id: concept/zij-sabi-sighting-tubes-for-measuring-diameters
class: concept
kind: scientific
label: { ar: "قياس أقطار الأجرام بالعضادة والشطبتين", en: "Measuring the diameters of bodies with the sighting tubes", ur: "عضادہ اور دو شطبتین سے اجرام کے قطروں کی پیمائش", es: "Medición de los diámetros de los cuerpos con los tubos de puntería.", fr: "Mesure des diamètres des corps à l'aide des tubes de visée", tr: "Kumpas ve iki pah kullanarak nesnelerin çaplarını ölçme", id: "Mengukur diameter benda menggunakan jangka sorong dan dua alat pemotong miring." }
summary:
  ar: "لمن أراد أن يعرف قدر شيء من هذه الأقطار يتخذ عضادة ويركب فيها شطبتين مقورتين متقابلتين، ويجعل الثقب الذي يلي البصر صغيراً، والذي يلي الكوكب بقدر ما يجتمع فيه جرم الكوكب كله. ثم يقيس الشمس بمضادة أخرى على هذا القياس، فيعرف قطر الثقب الذي قاس به الشمس، ويقيسه إلى الثقب الذي قاس به الكوكب، ويكون القياس في موضع واحد من الأفق. {cite:zij-sabi-nallino-byblion pp.189-190}"
  en: "To find the size of one of these diameters a sighting arm is made with two curved tubes set opposite each other. The hole nearest the eye is small, and the hole at the body's end is large enough to take in the whole disc of the body. The Sun is then measured with a second arm in the same way, and the two holes are compared, the measurement being taken at one place on the horizon. {cite:zij-sabi-nallino-byblion pp.189-190}"
  ur: "کسی قطر کا اندازہ معلوم کرنے کے لیے ایک عضادہ بنایا جاتا ہے جس میں دو مڑی ہوئی شطبتیں آمنے سامنے لگی ہوں۔ آنکھ کے قریب والا سوراخ چھوٹا ہو، اور ستارے کی طرف والا اتنا بڑا کہ پورا جرم اس میں سما جائے۔ پھر اسی طرح ایک اور عضادے سے سورج ناپا جاتا ہے، اور دونوں سوراخوں کا موازنہ کیا جاتا ہے، پیمائش افق پر ایک ہی مقام سے کی جاتی ہے۔ {cite:zij-sabi-nallino-byblion pp.189-190}"
  es: "Para determinar el tamaño de uno de estos diámetros, se construye un brazo de puntería con dos tubos curvos colocados uno frente al otro. El orificio más cercano al ojo es pequeño, y el orificio en el extremo del cuerpo es lo suficientemente grande como para abarcar todo el disco del cuerpo. A continuación, se mide el Sol con un segundo brazo de la misma manera, y se comparan los dos orificios, tomando la medida en un punto del horizonte. {cite:zij-sabi-nallino-byblion pp.189-190}"
  fr: "Pour déterminer la taille de l'un de ces diamètres, on utilise un bras de visée constitué de deux tubes courbes placés face à face. L'orifice le plus proche de l'œil est petit, tandis que celui situé à l'extrémité du corps est suffisamment grand pour englober la totalité du disque solaire. On mesure ensuite le Soleil à l'aide d'un second bras, de la même manière, et l'on compare les deux orifices, la mesure étant prise à un point précis de l'horizon. {cite:zij-sabi-nallino-byblion pp.189-190}"
  tr: "Bu çaplardan herhangi birinin boyutunu belirlemek isteyen herkes için bir ışın kullanılır ve buna iki zıt içbükey yarık takılır. Göze en yakın delik küçük, gezegene en yakın delik ise gezegenin tüm gövdesini kapsayacak kadar büyük yapılır. Daha sonra, güneş başka bir sayaç kullanılarak ölçülür ve güneşi ölçmek için kullanılan deliğin çapı belirlenir. Bu çap daha sonra, ufukta tek bir noktadan ölçüm yapılarak, gezegeni ölçmek için kullanılan deliğe göre ölçülür. {cite:zij-sabi-nallino-byblion pp.189-190}"
  id: "Bagi siapa pun yang ingin menentukan ukuran diameter tersebut, digunakan sebuah berkas cahaya, dan dua celah cekung yang saling berlawanan dipasang padanya. Lubang yang paling dekat dengan mata dibuat kecil, dan lubang yang paling dekat dengan planet dibuat cukup besar untuk mencakup seluruh badan planet. Kemudian, matahari diukur menggunakan penghitung lain, dan diameter lubang yang digunakan untuk mengukur matahari ditentukan. Diameter ini kemudian diukur relatif terhadap lubang yang digunakan untuk mengukur planet, dengan pengukuran diambil pada satu titik di cakrawala. {cite:zij-sabi-nallino-byblion pp.189-190}"
