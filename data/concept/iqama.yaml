label: { ar: "إقامة", en: "Iqama (the call to stand for prayer)" }
summary:
  ar: "الإقامة في الشرع إعلام الحاضرين المتأهبين للصلاة بالقيام إليها بألفاظ مخصوصة، وتطلق بمعنى الثبوت في المكان ضد السفر. ألفاظها كألفاظ الأذان مع زيادة «قد قامت الصلاة»، والحنفية يثنّون أكثرها والمذاهب الثلاثة يفردونها. والإقامة عند الجمهور سنة مؤكدة، وقال الحنابلة بأنها فرض كفاية، ويستحب فيها الحدر، ولا تقدم على وقت الصلاة، وتقام للصلوات الخمس والجمعة والفوائت والمنفرد، ولا تسن لغيرها من الصلوات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3144} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3146} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3150} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3153}"
  en: "In the law, iqama is the call that tells those present and ready for prayer to stand, in set words. The word also means staying in one place, the opposite of travel. Its words follow the adhan with qad qamati al-salat added; the Hanafis repeat most phrases while the other three schools say most once. Most jurists hold it a confirmed sunna, and the Hanbalis hold it a communal obligation. It is said quickly and not before the prayer time. It is called for the five daily prayers, Friday, missed prayers and the solo worshipper, but not for other prayers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3144} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3146} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3150} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3153}"
