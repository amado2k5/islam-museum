label: { ar: "إقامة", en: "Iqama (the call to stand for prayer)", es: "Iqama (la llamada a ponerse de pie para la oración)", fr: "Iqama (l'appel à se lever pour la prière)", ur: "اقامت ⁦(نماز کے لیے کھڑے ہونے کی اذان)⁩", tr: "Konaklama", id: "Akomodasi" }
summary:
  ar: "الإقامة في الشرع إعلام الحاضرين المتأهبين للصلاة بالقيام إليها بألفاظ مخصوصة، وتطلق بمعنى الثبوت في المكان ضد السفر. ألفاظها كألفاظ الأذان مع زيادة «قد قامت الصلاة»، والحنفية يثنّون أكثرها والمذاهب الثلاثة يفردونها. والإقامة عند الجمهور سنة مؤكدة، وقال الحنابلة بأنها فرض كفاية، ويستحب فيها الحدر، ولا تقدم على وقت الصلاة، وتقام للصلوات الخمس والجمعة والفوائت والمنفرد، ولا تسن لغيرها من الصلوات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3144} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3146} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3150} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3153}"
  en: "In the law, iqama is the call that tells those present and ready for prayer to stand, in set words. The word also means staying in one place, the opposite of travel. Its words follow the adhan with qad qamati al-salat added; the Hanafis repeat most phrases while the other three schools say most once. Most jurists hold it a confirmed sunna, and the Hanbalis hold it a communal obligation. It is said quickly and not before the prayer time. It is called for the five daily prayers, Friday, missed prayers and the solo worshipper, but not for other prayers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3144} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3146} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3150} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3153}"
  es: "En la ley, la iqama es la llamada que indica a los presentes y preparados para la oración que se pongan de pie, con palabras fijas. La palabra también significa permanecer en un lugar, lo opuesto a viajar. Sus palabras siguen al adhan con la adición de qad qamati al-salat; los hanafíes repiten la mayoría de las frases, mientras que las otras tres escuelas las dicen una sola vez. La mayoría de los juristas la consideran una sunna confirmada, y los hanbalíes la consideran una obligación comunitaria. Se recita rápidamente y no antes de la hora de la oración. Se utiliza para las cinco oraciones diarias, la del viernes, las oraciones omitidas y para el orante solitario, pero no para otras oraciones. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3144} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3146} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3150} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3153}"
  fr: "En droit islamique, l'iqama est l'appel à la prière qui, par des formules précises, invite les fidèles présents et prêts à se lever. Ce terme signifie également rester immobile, à l'opposé du déplacement. Ses paroles suivent l'adhan, auxquelles s'ajoute la formule qad qamati al-salat. Les hanafites répètent la plupart des phrases, tandis que les trois autres écoles les prononcent une seule fois. La plupart des juristes la considèrent comme une sunna confirmée, et les hanbalites comme une obligation collective. Elle est récitée rapidement et pas avant l'heure de la prière. Elle est requise pour les cinq prières quotidiennes, la prière du vendredi, les prières manquées et la prière individuelle, mais pas pour les autres prières. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3144} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3146} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3150} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3153}"
  ur: "قانون میں، اقامہ وہ اذان ہے جو حاضرین اور نماز کے لیے تیار ہونے والوں کو متعین الفاظ میں کھڑے ہونے کے لیے بتاتی ہے۔ اس لفظ کا مطلب ایک جگہ ٹھہرنا بھی ہے، سفر کے برعکس۔ اس کے الفاظ اذان کے بعد قضاء قمتی الصلاۃ شامل کرتے ہیں۔ احناف زیادہ تر جملے دہراتے ہیں جبکہ باقی تین مکاتب اکثر ایک بار کہتے ہیں۔ اکثر فقہاء اس کو سنت ثابت کرتے ہیں اور حنبلی اسے اجتماعی فرض سمجھتے ہیں۔ جلدی کہا جاتا ہے نماز کے وقت سے پہلے نہیں۔ یہ پانچوں نمازوں، جمعہ، فوت شدہ نمازوں اور تنہا نمازی کے لیے کہا جاتا ہے، لیکن دوسری نمازوں کے لیے نہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3144} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص3146} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3150} صفحہ 3153}"
  tr: "İslam hukukunda 'ikama', orada bulunan ve namaza hazır olanlara namazı belirli terimlerle kılmalarını bildirir ve seyahat etmek yerine orada kalmak anlamına gelir. Ikamesi, namaz zamanı (namaz belirlenmiştir) eklenmiş ezan çağrısı gibidir. Hanefiler çoğunu överken, üç mezhebe bunu belirli bir mezhep olarak belirtir. Çoğunluğa göre, ikama onaylanmış bir sünnettir ve Habelililer bunun toplu bir zorunluluk (Fard Kifayah) olduğunu, hadar namazının orada kılınmasının tavsiye edildiğini belirtir. Namaz zamanından önce kılınmaz. Beş, Cuma, eksik ve tek namazlar için yapılır, diğer namazlar için önerilmez. {alıntı:) fiqh-mawsua-kuwaitiyya-noor-v3 s.3144} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3146} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3150} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3153}"
  id: "Dalam hukum Islam, 'iqama' memberi tahu mereka yang hadir dan siap berdoa untuk melakukannya secara spesifik, dan digunakan untuk berarti tinggal di tempat tersebut daripada bepergian. Kata-katanya mirip dengan panggilan salat dengan tambahan 'qada al-salat al-salah' (doa telah ditetapkan). Hanafi memuji sebagian besar dari mereka, sementara tiga aliran pemikiran menentukannya sebagai satu yang khusus. Menurut mayoritas, iqamah adalah Sunnah yang dikonfirmasi, dan Hanbal mengatakan itu adalah kewajiban kolektif (Fard Kifayah), dan disarankan untuk melaksanakan shalat hadar di dalamnya. Salat ini tidak dilakukan lebih awal dari waktu shalat. Dilakukan untuk salat lima, Jumat, doa yang hilang, dan solitair, dan tidak direkomendasikan untuk salat lain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3144} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3146} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3150} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3153}"
