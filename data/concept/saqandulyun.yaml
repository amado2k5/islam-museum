summary:
  ar: "سقندوليون في الكتاب دواء ذكرت منافعه للأورام والقروح والرأس والصدر والكبد، وينفع من عسر النفس والربو واليرقان وأوجاع الكبد والصداع، وفي الكتاب نقل موسوم في اختناق الرحم {cite:canon-ibn-sina-print-v1 p.607}"
  en: "Saqandulyun is in the book a drug listed for swellings, ulcers, the head, the chest and the liver, benefiting difficult breathing, asthma, jaundice, pains of the liver and headache, with a labelled listing on suffocation of the womb {cite:canon-ibn-sina-print-v1 p.607}"
  ur: "سقندولیون کتاب میں ایک دوا ہے جس کے فوائد ورموں، زخموں، سر، سینے اور جگر کے لیے گنوائے گئے ہیں؛ یہ سانس کی تنگی، دمے، یرقان، جگر کے دردوں اور سر درد میں فائدہ دیتا ہے، اور کتاب میں رحم کے گھٹنے کے بارے میں ایک موسوم نقل ہے {cite:canon-ibn-sina-print-v1 p.607}۔"
  es: "Saqandulyun aparece en el libro como un medicamento para hinchazones, úlceras, la cabeza, el pecho y el hígado, beneficioso para la dificultad respiratoria, el asma, la ictericia, los dolores de hígado y el dolor de cabeza, con una mención específica para la asfixia del útero {cite:canon-ibn-sina-print-v1 p.607}."
