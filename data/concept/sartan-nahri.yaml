label:
  ar: "سرطان نهري"
  en: "Sartan nahri (the river crab)"
  ur: "سرطان نہری"
  es: "Sartan nahri (el cangrejo de río)"
  fr: "Sartan nahri (le crabe de rivière)"
summary:
  ar: "السرطان النهري في الكتاب حيوان عسير الهضم كثير الغذاء يصلحه الطبخ بالماش، يخرج الأزجة والشوك، ورماده مع العسل المطبوخ جيد لشقاق الرجلين، ويحلل الأورام الجاسية، ولحمه ينفع من السل، وينفع من لسع العقارب {cite:canon-ibn-sina-print-v1 p.587}."
  en: "Sartan nahri, the river crab, is in the book an animal hard to digest and rich in nourishment, improved by cooking with mung beans; it draws out splinters and thorns, its ash with cooked honey is good for cracked feet, it dissolves hard swellings, its flesh helps consumption, and it helps the sting of scorpions {cite:canon-ibn-sina-print-v1 p.587}."
  ur: "سرطان نہری کتاب میں ایک جانور ہے جو دیر ہضم اور بہت غذائیت والا ہے، ماش کے ساتھ پکانے سے سنورتا ہے؛ کانٹے اور پھانس نکالتا ہے، اس کی راکھ پکے ہوئے شہد کے ساتھ پھٹی ایڑیوں کے لیے اچھی ہے، سخت ورموں کو تحلیل کرتا ہے، اس کا گوشت سل میں مفید ہے، اور بچھو کے ڈنک میں نفع دیتا ہے {cite:canon-ibn-sina-print-v1 p.587}۔"
  es: "Sartan nahri, el cangrejo de río, es en el libro un animal difícil de digerir y rico en nutrientes, que mejora al cocinarlo con frijoles mungo; extrae astillas y espinas, su ceniza con miel cocida es buena para los pies agrietados, disuelve hinchazones duras, su carne ayuda a la tuberculosis y ayuda a aliviar la picadura de los escorpiones {cite:canon-ibn-sina-print-v1 p.587}."
  fr: "Le Sartan nahri, le crabe de rivière, est décrit dans le livre comme un animal difficile à digérer et riche en nutriments, amélioré par la cuisson avec des haricots mungo; il extrait les échardes et les épines, sa cendre avec du miel cuit est bonne pour les pieds crevassés, il dissout les gonflements durs, sa chair aide à la consommation et il aide contre les piqûres de scorpions {cite:canon-ibn-sina-print-v1 p.587}."
