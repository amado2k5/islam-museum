id: concept/estate-of-the-prophet
tags: [wasaya-browser, wasaya-legacy, wasaya-mirath]
class: concept
kind: legal
label:
  ar: "ما تركه النبي عند وفاته"
  en: "What the Prophet left at his death"
  ur: "نبی نے وفات کے وقت کیا چھوڑا"
  es: "Lo que el Profeta dejó en su muerte"
  fr: "Ce que le Prophète a laissé à sa mort"
  tr: "Peygamber'in ölümünde bıraktıkları"
  id: "Apa yang ditinggalkan Nabi saat wafatnya"
summary:
  ar: "يروي البخاري عن عمرو بن الحارث أخي جويرية أن النبي لم يترك عند موته ديناراً ولا درهماً ولا عبداً ولا أمة إلا بغلته البيضاء وسلاحه وأرضاً جعلها صدقة {cite:al-bidaya-wal-nihaya scan vol. 3 p. 310} {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 3400}. وتقول عائشة إنه توفي ودرعه مرهونة عند يهودي بثلاثين صاعاً من شعير {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 3401} {cite:al-bidaya-wal-nihaya scan vol. 3 p. 311}، وتروي أنه أمرها في مرضه بتفريق دنانير كانت عندها فلما وجدها دعا بها وقال ما ظن نبي الله لو لقي الله وهذه عنده {cite:al-bidaya-wal-nihaya scan vol. 3 p. 446}. ويرجّح ابن كثير أنه تصدق في حياته بما ملك وترك الأراضي صدقة {cite:al-bidaya-wal-nihaya scan vol. 3 p. 312}."
  en: "Al-Bukhari reports from 'Amr ibn al-Harith, brother of Juwayriya, that at his death the Prophet left no dinar, dirham, male or female slave, except his white mule, his weapons and land he had made charity {cite:al-bidaya-wal-nihaya scan vol. 3 p. 310} {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 3400}. 'A'isha says he died with his armour pawned to a Jew for thirty sa' of barley {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 3401} {cite:al-bidaya-wal-nihaya scan vol. 3 p. 311}, and recalls that in his illness he told her to give away some dinars, and when he found they were still there he asked for them and said what would the Prophet of God think if he met God with these in his keeping {cite:al-bidaya-wal-nihaya scan vol. 3 p. 446}. Ibn Kathir suggests that he gave away in life what he owned and left the lands as charity {cite:al-bidaya-wal-nihaya scan vol. 3 p. 312}."
  ur: "امام بخاری عمرو بن حارث ⁦(جویریہ کے بھائی)⁩ سے روایت کرتے ہیں کہ نبی نے وفات کے وقت نہ دینار چھوڑا نہ درہم، نہ غلام نہ باندی، سوائے اپنے سفید خچر، اپنے ہتھیاروں اور اس زمین کے جسے آپ صدقہ کر گئے تھے {cite:al-bidaya-wal-nihaya scan vol. 3 p. 310} {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 3400}۔ عائشہ بتاتی ہیں کہ آپ کی وفات اس حال میں ہوئی کہ آپ کی زرہ ایک یہودی کے پاس تیس صاع جَو کے بدلے رہن تھی {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 3401} {cite:al-bidaya-wal-nihaya scan vol. 3 p. 311}، اور یہ بھی کہ بیماری میں آپ نے کچھ دینار بانٹ دینے کو کہا، اور جب معلوم ہوا کہ وہ ابھی موجود ہیں تو انہیں منگوا کر فرمایا: اللہ کے نبی کا کیا گمان ہو گا اگر وہ اللہ سے اس حال میں ملے کہ یہ اس کے پاس ہوں {cite:al-bidaya-wal-nihaya scan vol. 3 p. 446}۔ ابن کثیر کا خیال ہے کہ آپ نے اپنی ملکیت زندگی میں صدقہ کر دی اور زمینیں صدقہ چھوڑ گئے {cite:al-bidaya-wal-nihaya scan vol. 3 p. 312}۔"
  es: "Al-Bujari informa de 'Amr ibn al-Harith, hermano de Juwayriya, que a su muerte el Profeta no dejó ningún dinar, dirham, esclavo o esclava, excepto su mula blanca, sus armas y la tierra que había donado {cite:al-bidaya-wal-nihaya scan vol. 3 p. 310} {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 3400}. 'Aisha dice que murió con su armadura empeñada a un judío por treinta sa' de cebada {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 3401} {cite:al-bidaya-wal-nihaya scan vol. 3 p. 311}, y recuerda que en su enfermedad le dijo que diera algunos dinares, y cuando vio que todavía estaban allí los pidió y dijo qué pensaría el Profeta de Dios si se encontrara con Dios con estos en su poder {cite:al-bidaya-wal-nihaya scan vol. 3 p. 446}. Ibn Kathir sugiere que en vida dio lo que poseía y dejó las tierras como caridad {cite:al-bidaya-wal-nihaya scan vol. 3 p. 312}."
  fr: "Al-Bukhari rapporte d'après 'Amr ibn al-Harith, frère de Juwayriya, qu'à sa mort, le Prophète ne laissa ni dinar, ni dirham, ni esclave, homme ou femme, hormis sa mule blanche, ses armes et les terres qu'il avait données en aumône (voir: al-bidaya-wal-nihaya, vol. 3, p. 310; voir: dalail-al-nubuwwa-bayhaqi, vol. 1, p. 3400). 'Aïcha dit qu'il mourut avec son armure mise en gage chez un Juif pour trente sa' d'orge (voir: dalail-al-nubuwwa-bayhaqi, vol. 1, p. 3401; voir: al-bidaya-wal-nihaya, vol. 3, p. 3400). 311}, et se souvient que, durant sa maladie, il lui avait demandé de donner quelques dinars, et lorsqu'il constata qu'ils étaient toujours là, il les réclama et dit: « Que penserait le Prophète de Dieu s'il rencontrait Dieu avec ces dinars en sa possession ? » {cite: al-bidaya-wal-nihaya scan vol. 3 p. 446}. Ibn Kathir suggère qu'il avait donné de son vivant tout ce qu'il possédait et laissé les terres en aumône {cite: al-bidaya-wal-nihaya scan vol. 3 p. 312}."
  tr: "El-Buhari, Cumeyriya'nın kardeşi Amr bin el-Harit'ten rivayet eder ki, Peygamber ölümünde sadece beyaz katırı, silahı ve toprakları dışında dinar, dirhem, köle veya köle bırakmamıştır; topraklarını sadaka olarak vermiştir {atıf:al-bidaya-wal-nihaya tarama cilt 3, s. 310} {cite:dalail-al-nubuwwa-bayhaqi taraması cilt 1, s. 3400}. Aişa, kalkanını bir Yahudi'ye otuz sa' arpa karşılığında bağladığı halde öldüğünü anlatır {atıf:dalail-al-nubuwwa-bayhaqi taraması cilt 1, s. 3401} {cite:al-bidaya-wal-nihaya taraması cilt 3, s. 311}. Hastalığı sırasında ona sahip olduğu dinarları dağıtmasını emrettiğini, bulduğunda onlar için dua ettiğini ve şöyle dediğini anlatır: \"Peygamberimiz Allah'ı görse bile düşünmezdi, bu da onunla {cite:al-bidaya-wal-nihaya tarama cilt 3, s. 446}.\" İbn Kathir, onun yaşamı boyunca sahip olduğu şeye sadaka verdiğini ve toprakları sadaka olarak bıraktığını öne sürer {cite:al-bidaya-wal-nihaya scan cilt 3, s. 312}."
  id: "Al-Bukhari menceritakan dari Amr ibn al-Harith, saudara Juwayriyah, bahwa Nabi tidak meninggalkan dinar, dirham, budak, atau budak saat wafat kecuali keledai putihnya, senjatanya, dan tanahnya, yang telah ia jadikan amal {cite:al-bidaya-wal-nihaya scan vol. 3, hlm. 310} {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1, hlm. 3400}. Aisha mengatakan bahwa ia meninggal dan menggadaikan perisainya kepada seorang Yahudi dengan harga tiga puluh sa' jelai {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1, hlm. 3401} {cite:al-bidaya-wal-nihaya scan vol. 3, hlm. 311}. Ia menceritakan bahwa ia memerintahkan Aisha selama sakitnya untuk membagikan dinar yang dimilikinya, dan ketika menemukannya, ia berdoa dan berkata, \"Nabi Allah tidak akan berpikir jika ia bertemu Tuhan, dan ini bersamanya {cite:al-bidaya-wal-nihaya scan vol. 3, hlm. 446}.\" Ibn Kathir menyatakan bahwa ia memberikan amal selama hidupnya kepada apa yang dimilikinya dan meninggalkan tanah tersebut sebagai amal {cite:al-bidaya-wal-nihaya scan vol. 3, hlm. 312}."
