label:
  ar: يوم الحسرة
  en: The Day of Regret
  ur: یوم حسرت
summary:
  ar: "يوم الحسرة في القرآن والسنة: اليوم الذي يتحسر فيه أهل النار على ما فاتهم من الجنة، يذكر أنه من أشراط الساعة، وأن فيه من الفزع ما لا يوصف، وأن الله يجعلهم يتحسرون."
  en: "The Day of Regret in Qur'an and Sunnah: the day the people of fire regret what they missed of paradise — a sign of the Hour, a day of indescribable terror, when God makes them regret."
  ur: "یوم حسرت قرآن و سنت میں: وہ دن جب آگ والے جنت میں اپنی چھوٹی ہوئی چیزوں پر افسوس کرتے ہیں — ساعت کی نشانیوں میں سے، ایک ایسا دن جس کا خوف بیان نہیں کیا جا سکتا، جب اللہ انہیں پچھتاواس پر آمادہ کرتا ہے۔"
