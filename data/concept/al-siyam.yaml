id: concept/al-siyam
class: concept
kind: legal
label:
  ar: "الصيام"
  en: "Fasting (siyam)"
summary:
  ar: "يرى الشعراوي أن الصيام إمساك عن شهوتي البطن والفرج من الفجر إلى الغروب، وأنه منهج تربية كان في الأديان السابقة، وأنه يضعف شرة المادية ويعوّد الاستقامة، وأن الرخصة للمريض والمسافر تكون بقضاء أيام أخر، وأن رمضان اصطفي لتشيع الاستقامة في كل الأزمنة. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.764}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.765}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.768}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.771}"
  en: "Sha'rawi holds that fasting is abstention from appetite and desire from dawn to sunset, a discipline found in earlier religions, that it weakens the drive of the material and trains steadiness, that the concession for the sick and the traveller is made up on other days, and that Ramadan is chosen so that its steadiness spreads to all times {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.764}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.765}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.768}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.771}."
wings: [ideas]
themes: [worship-and-the-pillars, spirituality-and-sufism]
periods: [period/prophetic-era]
regions: [arabia]
issue:
  ar: "ما حكمة الصيام ومن يُرخص له فيه، وهل يُفطر المريض والمسافر أم يفطران برخصة اختيارية؟"
  en: "What is the wisdom of fasting, who is granted leave from it, and is the sick or travelling person's breaking of the fast optional?"
perspectives:
  - tradition: sunni
    id: sharawi-fasting-discipline
    stance:
      ar: "الصيام تربية على الاستقامة، ورخصة المريض والمسافر إفطار ثم قضاء وليست اختيارا بين الصوم والإفطار"
      en: "Fasting trains steadiness; the sick and the traveller break the fast and make it up, and the leave is not a free choice between fasting and not"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يذكر الشعراوي أن النص عبارة [[passage/quran-2-184|الآية 184 من البقرة]] يعني أن الصوم انتقل إلى ما بعد السفر والشفاء، وأن من صام وهو مريض أو مسافر لا يعتد بصيامه في رأيه، ويرد على من جعلوا الرخصة اختيارية بأن ما لا يحتاج إلى تأويل أولى. ويذكر أنه اطمأن إلى أن الأيام المعدودة كانت ثلاثة من كل شهر، وهذا ما يطمئن إليه خاطره لا نص. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.767}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.771}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.772}"
      en: "Sha'rawi says the clause on other days ([[passage/quran-2-184|2:184]]) means that fasting passes to the time after travel or recovery; he holds that one who fasts while sick or travelling does not have it counted, and answers those who make the leave optional that what needs no interpretation is preferred. He says that the three monthly days of the earlier stage are what his own judgement inclines to, not a text {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.767}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.771}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.772}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
  - tradition: sunni
    id: scope-note-jurists-leave
    stance:
      ar: "قول من جعل الفطر في السفر والمرض رخصة اختيارية يُذكر هنا كما ينقله الشعراوي ولم يُراجع من مصدره"
      en: "The view that breaking the fast on a journey or in sickness is an optional leave is recorded as Sha'rawi reports it, not checked against its source"
    holders: []
    summary:
      ar: "ينقل الشعراوي قول من جعل الرخصة اختيارية ويرده، ولم تُراجع أقوالهم ولا مذاهب الفقهاء في الفطر في السفر، ولا الرأي الأكاديمي، ولا الآراء الأخرى. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.771}"
      en: "Sha'rawi reports the view that the leave is optional and rejects it; the jurists' views on breaking the fast on a journey, the academic view and other views are not checked or entered here {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.771}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
