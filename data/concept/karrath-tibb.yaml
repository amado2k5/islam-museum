id: concept/karrath-tibb
class: concept
kind: natural
label:
  ar: "كراث ⁦(في القانون)⁩"
  en: "Karrath (leek, in the Canon)"
  ur: "کراث ⁦(قانون میں)⁩"
  es: "Karrath (puerro, en el Canon)"
  fr: "Karrath (poireau, dans le Canon)"
  tr: "Pırasa (kayınvalide)"
  id: "Bawang bawang (mertua)"
summary:
  ar: "الكراث عند ابن سينا ثلاثة أصناف: الشامي والنبطي والبري، حار في الثالثة يابس في الثانية، وفيه ذكر لنفعه للربو والبواسير وللأذن وضرره للمعدة واللثة والبصر {cite:canon-ibn-sina-print-v1 p.532} {cite:canon-ibn-sina-print-v1 p.533}."
  en: "In the Canon the leek has three kinds, the Syrian, the Nabataean and the wild; it is hot in the third degree and dry in the second. The book lists benefits for asthma, piles and the ear, and harm to the stomach, gums and sight {cite:canon-ibn-sina-print-v1 p.532} {cite:canon-ibn-sina-print-v1 p.533}."
  ur: "قانون میں کراث کی تین قسمیں ہیں: شامی، نبطی اور جنگلی؛ تیسرے درجے میں گرم اور دوسرے میں خشک۔ کتاب دمے، بواسیر اور کان میں اس کے فائدے اور معدے، مسوڑھوں اور نظر کو نقصان گنواتی ہے {cite:canon-ibn-sina-print-v1 p.532} {cite:canon-ibn-sina-print-v1 p.533}۔"
  es: "En el Canon, el puerro tiene tres variedades: el sirio, el nabateo y el silvestre; es picante en el tercer grado y seco en el segundo. El libro enumera beneficios para el asma, las hemorroides y el oído, y perjuicios para el estómago, las encías y la vista {cite:canon-ibn-sina-print-v1 p.532} {cite:canon-ibn-sina-print-v1 p.533}."
  fr: "Dans le Canon, le poireau est classé en trois catégories: syrien, nabatéen et sauvage; il est considéré comme chaud au troisième degré et sec au deuxième. L’ouvrage mentionne ses bienfaits contre l’asthme, les hémorroïdes et les affections de l’oreille, et ses effets néfastes sur l’estomac, les gencives et la vue {cite:canon-ibn-sina-print-v1 p.532} {cite:canon-ibn-sina-print-v1 p.533}."
  tr: "İbn Sina'ya göre, pırasa üç türdendir: Levantine, Nabati ve yabani; üçüncüsü acı, ikincisi kuru. Astım, hemoroid, kulaklar ve mide, diş eti ile görme zararları nedeniyle belirtilir {cite:canon-ibn-sina-print-v1 s.532} {cite:canon-ibn-sina-print-v1 s.533}."
  id: "Menurut Ibn Sina, bawang daun bawang terdiri dari tiga jenis: Levantine, Nabati, dan liar; pedas pada yang ketiga dan kering pada yang kedua. Ia disebut karena manfaatnya untuk asma, wasir, telinga, dan bahaya terhadap perut, gusi, dan penglihatan {cite:canon-ibn-sina-print-v1 hlm.532} {cite:canon-ibn-sina-print-v1 hlm.533}."
