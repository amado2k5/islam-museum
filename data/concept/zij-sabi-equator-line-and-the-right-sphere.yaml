label: { ar: "خط الاستواء والفلك المستقيم في الزيج الصابي", en: "The equator line and the right sphere in al-Zij al-Sabi", ur: "خط استوا اور فلک مستقیم زیج صابی میں", es: "La línea del ecuador y la esfera derecha en al-Zij al-Sabi", fr: "La ligne équatoriale et la sphère droite dans al-Zij al-Sabi", tr: "Sabian astronomik tablolarındaki ekvator ve düz çizgi", id: "Garis khatulistiwa dan garis lurus dalam tabel astronomi Sabian" }
summary:
  ar: "يفتتح الباب السادس بخط الاستواء، وهو الخط الذي تحت فلك معدل النهار من الأرض، ولا عرض له. يصف البتاني فيه تساوي الليل والنهار طول السنة، وانعدام ظل القائم عند انتصاف النهار في الاعتدالين، وطلوع الكواكب كلها وغروبها لأن قطبي الكرة على دائرة الأفق، ودوران الفلك هناك دولابي. {cite:zij-sabi-nallino-byblion p.25}."
  en: "Chapter 6 opens with the equator line, the line of the earth beneath the equator of the day, which has no latitude. Al-Battani describes day and night equal all year, the upright gnomon casting no noon shadow at the two equinoxes, every star rising and setting because the poles of the sphere lie on the horizon circle, and the rotation of the heavens there being wheel-like. {cite:zij-sabi-nallino-byblion p.25}."
  ur: "چھٹا باب خط استوا سے شروع ہوتا ہے، یعنی زمین کا وہ خط جو معدل النہار کے نیچے ہے اور جس کا کوئی عرض نہیں۔ البتانی اس میں سال بھر دن اور رات کی برابری، دونوں اعتدالوں میں کھڑی شاخص کا دوپہر کو سایہ نہ ہونا، تمام ستاروں کا طلوع و غروب کیونکہ کرے کے دونوں قطب دائرۂ افق پر ہوتے ہیں، اور وہاں فلک کی گردش کے دولابی ہونے کا ذکر کرتے ہیں۔ {cite:zij-sabi-nallino-byblion p.25}۔"
  es: "El capítulo 6 comienza con la línea del ecuador, la línea de la Tierra por debajo del ecuador diurno, que no tiene latitud. Al-Battani describe el día y la noche como iguales durante todo el año, el gnomon erguido sin proyectar sombra al mediodía en los dos equinoccios, cada estrella saliendo y poniéndose porque los polos de la esfera se encuentran en el círculo del horizonte, y la rotación de los cielos en esa dirección como una rueda. {cite:zij-sabi-nallino-byblion p.25}."
  fr: "Le chapitre 6 s'ouvre sur la ligne de l'équateur, la ligne de la Terre sous l'équateur diurne, qui ne connaît pas de latitude. Al-Battani décrit le jour et la nuit comme égaux toute l'année, le gnomon vertical ne projetant aucune ombre à midi aux deux équinoxes, chaque étoile se levant et se couchant car les pôles de la sphère se situent sur le cercle de l'horizon, et la rotation des cieux y étant semblable à une roue. {cite:zij-sabi-nallino-byblion p.25}."
  tr: "Altıncı Bölüm, enlemi olmayan, Dünya'nın gündüz ekvatorunun altındaki çizgi olan ekvatorla başlar. Al-Battani burada, yıl boyunca gece ve gündüzün eşitliğini, ekinokslar sırasında öğle vakti gölgenin olmamasını ve kürenin kutuplarının ufukta bulunması ve gök küresinin dönüşünün merkezcil olması nedeniyle tüm gezegenlerin doğuş ve batışını açıklar. {cite:zij-sabi-nallino-byblion s.25}."
  id: "Bab Enam dibuka dengan garis khatulistiwa, garis di bawah khatulistiwa Bumi dalam istilah siang hari, yang tidak memiliki garis lintang. Al-Battani menggambarkan di dalamnya kesamaan siang dan malam sepanjang tahun, tidak adanya bayangan di tengah hari selama ekuinoks, dan terbit serta terbenamnya semua planet karena kutub bola terletak di cakrawala, dan rotasi bola langit di sana bersifat sentripetal. {cite:zij-sabi-nallino-byblion p.25}."
