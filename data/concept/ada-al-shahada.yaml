id: concept/ada-al-shahada
class: concept
kind: legal
label:
  ar: "أداء الشهادة"
  en: "Ada' al-shahada (performing testimony: the duty on request, the excused witness, and the wording)"
  fr: "Ada' al-shahada (déposition d'un témoignage : obligation sur demande, témoin excusé et formulation)"
  es: "Ada' al-shahada (prestación de testimonio: el deber a petición, el testigo excusado y la redacción)"
  ur: "عدۃ الشہداء ⁦(گواہی ادا کرنا: درخواست پر فرض، عذر شدہ گواہ، اور الفاظ)⁩"
  tr: "Sertifikasyon Performansı"
  id: "Kinerja Sertifikasi"
summary:
  ar: "أداء الشهادة فرض كفاية، فإذا أداها من يكفي سقط الطلب عن الباقين، وإن امتنع الجميع أثموا، ويصير فرض عين إذا لم يوجد غيره والحق متوقف عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1989} وفي حقوق الآدميين لا يجب الأداء إلا بطلب المشهود له، ولا يجوز الشهادة قبل الطلب، وفي حقوق الله ما عدا الحدود يلزم الأداء حسبةً، وفي أسباب الحدود الستر مندوب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1989} ويسقط الأداء عن العاجز لبعد المسافة أو الضرر، وعند بعضهم مع عدم عدالة الحاكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1990} ويعتبر لفظ الشهادة عند الجمهور، فلا يُعتد بقول أعلم أو أتيقن، ويكتفي المالكية بما يدل على العلم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1990}"
  en: "Giving testimony is a communal obligation: once enough witnesses give it the rest are released, and all are sinful if all refuse. It becomes an individual obligation where no one else can give it and the right depends on the witness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1989} For purely human rights the duty arises only on the beneficiary's request, and testimony before a request is not allowed; for rights of God other than the hudud it is owed as a duty to God, and in the causes of the hudud concealment is recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1989} A witness who is far away or who would be harmed is excused, and some hold the duty lapses when the judge is unjust. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1990} Most jurists require the word of testimony; the Malikis accept any word that shows knowledge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1990}"
  fr: "Déposer un témoignage est une obligation collective : dès qu'un nombre suffisant de témoins l'a fait, les autres en sont déchargés ; si tous refusent, tous commettent un péché. Cela devient une obligation individuelle lorsque personne d'autre ne peut témoigner et que le droit dépend du témoin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1989} Pour les droits purement humains, l'obligation ne naît qu'à la demande du bénéficiaire, et témoigner avant cette demande n'est pas permis ; pour les droits de Dieu autres que les hudud, le témoignage est dû comme devoir envers Dieu, et la dissimulation est recommandée pour les faits donnant lieu aux hudud. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1989} Le témoin éloigné ou qui subirait un préjudice est excusé ; certains estiment que l'obligation tombe si le juge est injuste. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1990} La plupart des juristes exigent le terme de témoignage ; les malikites acceptent tout terme exprimant la connaissance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1990}"
  es: "Dar testimonio es una obligación comunitaria: una vez que suficientes testigos lo dan, el resto queda liberado, y todos son pecadores si todos se niegan. Se convierte en una obligación individual cuando nadie más puede darlo y el derecho depende del testigo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1989} Para los derechos puramente humanos, el deber surge solo a petición del beneficiario, y no se permite el testimonio antes de una petición; para los derechos de Dios que no sean el hudud, se debe como un deber para con Dios, y en las causas del hudud se recomienda el ocultamiento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1989} Un testigo que está lejos o que sería perjudicado está excusado, y algunos sostienen que el deber se extingue cuando el juez es injusto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1990} La mayoría de los juristas requieren la palabra del testimonio; Los malikíes aceptan cualquier palabra que demuestre conocimiento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1990}"
  ur: "گواہی دینا ایک اجتماعی ذمہ داری ہے: ایک بار جب کافی گواہ دے دیں تو باقی چھوڑ دیے جائیں گے، اور اگر سب انکار کر دیں تو سب گناہ گار ہیں۔ یہ ایک انفرادی ذمہ داری بن جاتی ہے جہاں کوئی دوسرا نہیں دے سکتا اور حق گواہ پر منحصر ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1989} خالصتاً انسانی حقوق کے لیے یہ فرض صرف فائدہ اٹھانے والے کی درخواست پر عائد ہوتا ہے، اور درخواست سے پہلے گواہی کی اجازت نہیں ہے۔ خدا کے حقوق کے لئے ہد کے علاوہ یہ خدا پر واجب ہے اور اسباب میں حدد کی پردہ پوشی مستحب ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1989} جو گواہ دور ہو یا جس کو نقصان پہنچا ہو اسے معاف کر دیا جاتا ہے، اور بعض جج کے ناانصافی ہونے پر ذمہ داری سے کوتاہی کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1990} اکثر فقہا گواہی کے لفظ کا تقاضا کرتے ہیں۔ مالکی علم کو ظاہر کرنے والے ہر لفظ کو قبول کرتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 1990}"
  tr: "Tanıklık etmek toplu bir yükümlülüktür; biri yeterli ederse, talep diğerlerinden kaldırılır ve herkes reddederse, günahkârdır. Başka bir yükümlülük yoksa ve hak buna bağlıysa bu özel bir yükümlülük olur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1989} İnsan haklarında, ödeme yalnızca tanıklık eden tarafın talebi üzerine zorunludur ve talep öncesinde tanıklık etmek kabul edilemez. Tanrı'nın haklarında, hudud davaları hariç, ödeme hesap temelinde zorunludur ve hudud nedenlerinde gizlenme önerilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1989} Mesafe veya zarar nedeniyle elet durumda olanlar için ödeme kaldırılır, bazıları için ise hakimin adaletsizliğine rağmen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1990} 'tanıklık' terimi çoğunluk tarafından kabul edilir, bu yüzden daha bilgili veya kesin ifade dikkate alınmamalı ve Malikis, bilgiyi gösteren şeylerle yeterlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1990}"
  id: "Memberikan kesaksian adalah kewajiban kolektif; jika seseorang cukup untuk melakukannya, klaim dicabut dari yang lain, dan jika semua orang menolak, mereka dianggap berdosa. Menjadi kewajiban khusus jika tidak ada kewajiban lain dan hak bergantung padanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1989} Dalam hak asasi manusia, pembayaran hanya wajib atas permintaan pihak saksi, dan kesaksian sebelum permintaan tidak diperbolehkan. Dalam hak Tuhan, kecuali dalam kasus hudud, pembayaran wajib berdasarkan perhitungan, dan dalam kasus hudud, penyembunyian dianjurkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1989} Pembayaran dibatalkan untuk yang tidak mampu karena jarak atau bahaya, dan bagi sebagian orang, meskipun hakim tidak adil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1990} Istilah 'kesaksian' dipertimbangkan oleh mayoritas, sehingga pernyataan yang lebih berpengetahuan atau pasti tidak perlu diperhitungkan, dan Malikis cukup dengan apa yang menunjukkan pengetahuan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1990}"
