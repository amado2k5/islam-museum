id: concept/ada-al-shahada
class: concept
kind: legal
label:
  ar: "أداء الشهادة"
  en: "Ada' al-shahada (performing testimony: the duty on request, the excused witness, and the wording)"
summary:
  ar: "أداء الشهادة فرض كفاية، فإذا أداها من يكفي سقط الطلب عن الباقين، وإن امتنع الجميع أثموا، ويصير فرض عين إذا لم يوجد غيره والحق متوقف عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1989} وفي حقوق الآدميين لا يجب الأداء إلا بطلب المشهود له، ولا يجوز الشهادة قبل الطلب، وفي حقوق الله ما عدا الحدود يلزم الأداء حسبةً، وفي أسباب الحدود الستر مندوب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1989} ويسقط الأداء عن العاجز لبعد المسافة أو الضرر، وعند بعضهم مع عدم عدالة الحاكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1990} ويعتبر لفظ الشهادة عند الجمهور، فلا يُعتد بقول أعلم أو أتيقن، ويكتفي المالكية بما يدل على العلم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1990}"
  en: "Giving testimony is a communal obligation: once enough witnesses give it the rest are released, and all are sinful if all refuse. It becomes an individual obligation where no one else can give it and the right depends on the witness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1989} For purely human rights the duty arises only on the beneficiary's request, and testimony before a request is not allowed; for rights of God other than the hudud it is owed as a duty to God, and in the causes of the hudud concealment is recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1989} A witness who is far away or who would be harmed is excused, and some hold the duty lapses when the judge is unjust. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1990} Most jurists require the word of testimony; the Malikis accept any word that shows knowledge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1990}"
