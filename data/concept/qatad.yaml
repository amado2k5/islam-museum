  fr: "Qatad est décrit dans le livre comme froid et sec, et l'entrée indique que sa gomme est kathira, qui a été traitée dans le chapitre de la lettre kaf {cite:canon-ibn-sina-print-v1 p.654}"
  tr: "Kitaptaki alıntı soğuk ve kurudur, içindeki referansta yapıştırıcısının çoğunlukla çok sayıda olduğu belirtilir ve Kaf mektubu hakkındaki bölümde bahsedilir {cite:canon-ibn-sina-print-v1 s.654}"
  id: "Kutipan dalam buku ini dingin dan kering, dan referensi di dalamnya mengatakan bahwa lemnya sebagian besar jumlahnya, dan disebutkan dalam bab tentang surat Kaf {cite:canon-ibn-sina-print-v1 hlm.654}"
