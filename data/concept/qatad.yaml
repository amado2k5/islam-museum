  ar: "القتاد في الكتاب بارد يابس، وتقول الإشارة فيه إن صمغه هو الكثيراء وقد ذكر في باب الكاف {cite:canon-ibn-sina-print-v1 p.654}"
  en: "Qatad is in the book cold and dry, and the entry says its gum is kathira, which was dealt with in the chapter of the letter kaf {cite:canon-ibn-sina-print-v1 p.654}"
