id: concept/attribute-sifa
class: concept
kind: legal
label:
  ar: "الصِّفَة"
  en: "Sifa (the attribute: its meaning for grammarians, jurists and usulis, its role in sale and salam, and the effect of an unmet description)"
summary:
  ar: "الصفة في اللغة الحلية والنعت، وفي اصطلاح النحاة الاسم الدال على بعض أحوال الذات، وعند الفقهاء أن ينضبط الموصوف على وجه لا يبقى بعده إلا تفاوت يسير، وعند الأصوليين تقييد لفظ مشترك المعنى بلفظ آخر مختص. وتدخل الصفة في شروط السلم والبيع على الصفة، فإذا تخلفت ثبت خيار فوات الوصف، وليس للصفة مقابل في الثمن لأنها تابعة في العقد. ومن مفهوم الصفة في أصول الفقه تعليق الحكم على الذات بأحد أوصافها، كقوله في سائمة الغنم زكاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10403} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10404}"
  en: "In language sifa is the adornment or description of a thing. For grammarians it is a noun showing some state of a thing; for jurists it is that the thing described is so fixed that after the description only a slight variation remains; for the usulis it is the restriction of a word with several meanings by another, specific word, which is not a condition or a limit. Description enters the conditions of salam and of sale on description: if the described quality is not found, the buyer has the option of the lost attribute, and the attribute has no share of the price, since it follows the contract without being named. In usul al-fiqh the concept of the attribute is the attaching of a ruling to a thing by one of its qualities, as in the saying that a free-grazing flock owes zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10403} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10404}"
