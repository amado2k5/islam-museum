id: concept/attribute-sifa
class: concept
kind: legal
label:
  ar: "الصِّفَة"
  en: "Sifa (the attribute: its meaning for grammarians, jurists and usulis, its role in sale and salam, and the effect of an unmet description)"
  fr: "Sifa (l’attribut : son sens chez les grammairiens, les juristes et les spécialistes des fondements du droit, son rôle dans la vente et le salam et l’effet d’une qualité décrite mais absente)"
  es: "Sifa (el atributo: su significado para gramáticos, juristas y usulis, su papel en la salé y el salam, y el efecto de una descripción no cumplida)"
summary:
  ar: "الصفة في اللغة الحلية والنعت، وفي اصطلاح النحاة الاسم الدال على بعض أحوال الذات، وعند الفقهاء أن ينضبط الموصوف على وجه لا يبقى بعده إلا تفاوت يسير، وعند الأصوليين تقييد لفظ مشترك المعنى بلفظ آخر مختص. وتدخل الصفة في شروط السلم والبيع على الصفة، فإذا تخلفت ثبت خيار فوات الوصف، وليس للصفة مقابل في الثمن لأنها تابعة في العقد. ومن مفهوم الصفة في أصول الفقه تعليق الحكم على الذات بأحد أوصافها، كقوله في سائمة الغنم زكاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10403} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10404}"
  en: "In language sifa is the adornment or description of a thing. For grammarians it is a noun showing some state of a thing; for jurists it is that the thing described is so fixed that after the description only a slight variation remains; for the usulis it is the restriction of a word with several meanings by another, specific word, which is not a condition or a limit. Description enters the conditions of salam and of sale on description: if the described quality is not found, the buyer has the option of the lost attribute, and the attribute has no share of the price, since it follows the contract without being named. In usul al-fiqh the concept of the attribute is the attaching of a ruling to a thing by one of its qualities, as in the saying that a free-grazing flock owes zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10403} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10404}"
  fr: "Dans la langue, sifa est la parure ou la description d’une chose. Pour les grammairiens, c’est un nom indiquant un état d’une chose ; pour les juristes, la chose décrite est si précisément déterminée qu’après sa description il ne subsiste qu’une légère variation ; pour les spécialistes des fondements du droit, c’est la restriction d’un mot à plusieurs sens par un autre mot, spécifique, qui n’est ni une condition ni une limite. La description entre dans les conditions du salam et de la vente sur description : si la qualité décrite n’est pas présente, l’acheteur dispose de l’option liée à l’attribut manquant, et l’attribut n’a pas de part dans le prix, puisqu’il suit le contrat sans être nommé. Dans les fondements du droit, le concept de l’attribut consiste à rattacher une règle à une chose par l’une de ses qualités, comme lorsqu’on dit qu’un troupeau paissant librement doit la zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10403} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10404}"
  es: "En el lenguaje, sifa es el adorno o la descripción de una cosa. Para los gramáticos, es un sustantivo que muestra algún estado de una cosa; para los juristas, es que la cosa descrita está tan fija que después de la descripción solo queda una ligera variación; para los usulis, es la restricción de una palabra con varios significados por otra palabra específica, que no es una condición ni un límite. La descripción entra en las condiciones de salam y de venta por descripción: si no se encuentra la cualidad descrita, el comprador tiene la opción del atributo faltante, y el atributo no tiene parte del precio, ya que sigue al contrato sin ser nombrado. En usul al-fiqh, el concepto de atributo es la vinculación de una norma a una cosa por una de sus cualidades, como en el dicho de que un rebaño que pasta libremente debe zakat. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10403} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10404}"
