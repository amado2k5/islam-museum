id: concept/tawzif-maali
class: concept
kind: legal
label:
  ar: "التوظيف المالي"
  en: "Compulsory levy on wealth (tawzif)"
issue:
  ar: "هل للإمام أن يفرض على الأغنياء ما يكفي الجند والفقراء حين يخلو بيت المال؟"
summary:
  ar: "التوظيف المالي فرض تكاليف إضافية على أموال الأغنياء بقدر ما تحتاجه الجند والفقراء بعد استنفاد بيت مال الزكاة وبيت مال المصالح {cite:usul-iqtisad-islami-0660 p. 322}. ويرى الجويني أن على الأغنياء بذل فضلات أموالهم لتحصل الكفاية {cite:usul-iqtisad-islami-0660 p. 322}، ويقر الغزالي أن الإمام يوظف عند خلو بيت المال واحتياج الجند {cite:usul-iqtisad-islami-0660 p. 323}، ويقرر ابن حزم أن على أغنياء كل بلد أن يقوموا بفقرائهم {cite:usul-iqtisad-islami-0660 p. 323}."
wings: [ideas]
themes:
- trade-and-finance
- zakat-and-sadaqa
periods:
- period/prophetic-era
regions:
- global
perspectives:
  - tradition: sunni
    id: juwayni-ghazali-levy-when-needed
    summary:
      ar: "أهل السنة من الشافعية: الجويني والغزالي يجيزان التوظيف على الأغنياء عند الحاجة، ويحددان الحاجة بما يكفي الجند والفقراء، والغزالي يشترط خلو بيت المال من المال، ثم ينظر الإمام في توزيع التوظيف على الغلات والثمار كي لا يغيظ الناس {cite:usul-iqtisad-islami-0660 p. 322}{cite:usul-iqtisad-islami-0660 p. 323}."
    sources: [source/usul-iqtisad-islami-0660]
  - tradition: sunni
    id: ibn-hazm-collective-care
    summary:
      ar: "ابن حزم الظاهري يوجب على أغنياء كل بلد أن يقوموا بفقرائهم بما يأكلون من القوت واللباس والمسكن، ويجبرهم السلطان إن لم تكفِ الزكاة والفيء {cite:usul-iqtisad-islami-0660 p. 323}. ويذكر المؤلف أن بعضهم ظن هذا مذهبه وحده {cite:usul-iqtisad-islami-0660 p. 323}."
    sources: [source/usul-iqtisad-islami-0660]
  - tradition: other
    id: author-sufficiency-collective-duty
    summary:
      ar: "يرى المؤلف أن كفاية الفقراء من فروض الكفاية التي نادى بها فقهاء المذاهب جميعاً، وأن ابن حزم أطال في الاستدلال لها {cite:usul-iqtisad-islami-0660 p. 324}. وهذا تقرير المؤلف، ولا يُعرض هنا بوصفه إجماعاً مسنداً إلى أسماء."
    sources: [source/usul-iqtisad-islami-0660]
