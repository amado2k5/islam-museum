id: concept/tawzif-maali
class: concept
kind: legal
tags: [islamic-economy-browser, islamic-economy-money]
label:
  ar: "التوظيف المالي"
  en: "Compulsory levy on wealth (tawzif)"
  es: "Impuesto obligatorio sobre la riqueza (tawzif)"
  fr: "Impôt obligatoire sur la fortune (tawzif)"
  ur: "مال پر لازمی محصول ⁦(توزیف)⁩"
  tr: "Finansal İşe Alım"
  id: "Rekrutmen Keuangan"
issue:
  ar: "هل للإمام أن يفرض على الأغنياء ما يكفي الجند والفقراء حين يخلو بيت المال؟"
summary:
  ar: "التوظيف المالي فرض تكاليف إضافية على أموال الأغنياء بقدر ما تحتاجه الجند والفقراء بعد استنفاد بيت مال الزكاة وبيت مال المصالح {cite:usul-iqtisad-islami-0660 p. 322}. ويرى الجويني أن على الأغنياء بذل فضلات أموالهم لتحصل الكفاية {cite:usul-iqtisad-islami-0660 p. 322}، ويقر الغزالي أن الإمام يوظف عند خلو بيت المال واحتياج الجند {cite:usul-iqtisad-islami-0660 p. 323}، ويقرر ابن حزم أن على أغنياء كل بلد أن يقوموا بفقرائهم {cite:usul-iqtisad-islami-0660 p. 323}."
  tr: "Mali istihdam, zenginlerin zenginliğine, zekat hazinesi ve kamu yararı tükendikten sonra askerlerin ve yoksulların ihtiyaç duyduğu kadar ek maliyetler getirir {cite:usul-iqtisad-islami-0660 s. 322}. Al-Juwayni, zenginlerin fazladan paralarını yeterlilik sağlamak için harcamaları gerektiğine inanır {cite:usul-iqtisad-islami-0660 s. 322}. Al-Gazali, İmam'ın kamu hazinesi boşken ve askerlerin ihtiyaç duyduğu durumlarda istihdam ettiğini kabul eder {cite:usul-iqtisad-islami-0660 s. 323} ve İbn Hazm ise her ülkenin zenginlerinin yoksullarını desteklemesi gerektiğini belirtir {cite:usul-iqtisad-islami-0660 s. 323}."
  id: "Pekerjaan keuangan menimbulkan biaya tambahan pada kekayaan orang kaya sama seperti kebutuhan tentara dan orang miskin setelah kas zakat dan kepentingan publik habis {cite:usul-iqtisad-islami-0660 hlm. 322}. Al-Juwayni percaya bahwa orang kaya harus menghabiskan uang surplus mereka untuk mencapai kecukupan {cite:usul-iqtisad-islami-0660 hlm. 322}. Al-Ghazali mengakui bahwa Imam bekerja ketika kas umum kosong dan tentara membutuhkan {cite:usul-iqtisad-islami-0660 hlm. 323}, dan Ibn Hazm menyatakan bahwa orang kaya di setiap negara harus mendukung orang miskin mereka {cite:usul-iqtisad-islami-0660 hlm. 323}."
