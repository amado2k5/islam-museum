label: { ar: "الحاجة", en: "Need (hajah) in fiqh", ur: "حاجت" }
summary:
  ar: "الحاجة في اللغة الافتقار، وفي الاصطلاح ما يفتقر إليه الناس لرفع الضيق المؤدي إلى الحرج. تراعيها الشريعة في العبادات والعادات والمعاملات والجنايات، فتُرخص للمريض والمسافر، وتبيح ما لا يباح عند عدمها كبيع العرايا، وتعرض الموسوعة الخلاف في اعتبارها دليلا مستقلا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6706} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6707} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6708} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6709} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6716}"
  en: "Hajah in the language is want; as a technical term it is what people need to remove a hardship that would otherwise lead to constriction. The law takes need into account in worship, custom, dealings and offences: it relaxes rules for the sick and the traveller and permits what would not be allowed without need, such as the sale of fresh dates for dried dates on the tree (the ariya). The schools differ on whether need is an independent basis for a ruling. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6706} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6707} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6708} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6709} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6716}"
  ur: "حاجت لغت میں محتاجی ہے، اور اصطلاح میں وہ ضرورت جس سے تنگی دور ہو۔ شریعت عبادات، عادات اور معاملات میں اس کا لحاظ کرتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6706} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6709} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6716}"
