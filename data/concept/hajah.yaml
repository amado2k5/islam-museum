id: concept/hajah
class: concept
kind: legal
label: { ar: "الحاجة", en: "Need (hajah) in fiqh", ur: "حاجت", es: "Necesidad (hajah) en fiqh", fr: "Besoin (hajah) en fiqh", tr: "İhtiyaç", id: "Kebutuhan" }
summary:
  ar: "الحاجة في اللغة الافتقار، وفي الاصطلاح ما يفتقر إليه الناس لرفع الضيق المؤدي إلى الحرج. تراعيها الشريعة في العبادات والعادات والمعاملات والجنايات، فتُرخص للمريض والمسافر، وتبيح ما لا يباح عند عدمها كبيع العرايا، وتعرض الموسوعة الخلاف في اعتبارها دليلا مستقلا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6706} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6707} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6708} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6709} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6716}"
  en: "Hajah in the language is want; as a technical term it is what people need to remove a hardship that would otherwise lead to constriction. The law takes need into account in worship, custom, dealings and offences: it relaxes rules for the sick and the traveller and permits what would not be allowed without need, such as the sale of fresh dates for dried dates on the tree (the ariya). The schools differ on whether need is an independent basis for a ruling. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6706} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6707} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6708} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6709} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6716}"
  ur: "حاجت لغت میں محتاجی ہے، اور اصطلاح میں وہ ضرورت جس سے تنگی دور ہو۔ شریعت عبادات، عادات اور معاملات میں اس کا لحاظ کرتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6706} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6709} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6716}"
  es: "Hajah, en español, significa necesidad; técnicamente, se refiere a aquello que las personas necesitan para superar una dificultad que, de otro modo, les acarrearía restricciones. La ley considera la necesidad en el culto, las costumbres, las transacciones y las infracciones: flexibiliza las normas para los enfermos y los viajeros, y permite lo que no estaría permitido sin necesidad, como la venta de dátiles frescos en lugar de dátiles secos en el árbol (ariya). Las escuelas jurídicas difieren en cuanto a si la necesidad constituye un fundamento independiente para dictar una norma. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6706} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6707} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6708} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6709} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6716}"
  fr: "En langue hébraïque, « hajah » signifie besoin; techniquement, ce terme désigne ce dont une personne a besoin pour surmonter une difficulté qui, autrement, entraînerait une contrainte. La loi prend en compte le besoin dans le culte, les coutumes, les transactions commerciales et les infractions: elle assouplit les règles pour les malades et les voyageurs et autorise ce qui serait interdit sans besoin, comme la vente de dattes fraîches contre des dattes séchées sur l’arbre (l’ariya). Les écoles juridiques divergent quant à savoir si le besoin constitue un fondement indépendant pour une décision. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6706} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6707} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6708} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6709} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6716}"
  tr: "Dilbilimde ihtiyaç yoksulluktur ve teknik terminolojide, insanların sıkıntıyı hafifletmek için eksik oldukları zorluklara yol açar. Şeriat, ibadet, adet, işlemler ve suçlarda bunu uygular; hastalar ve yolcular için izin verir, izin verilmediğinde yasak olanları (örneğin çıplaklık satılmayı) kabul eder. Ansiklopedi, bağımsız kanıtları konusunda anlaşmazlığı sunar. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.6706} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6707} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6708} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6709} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6716}"
  id: "Dalam linguistik, kebutuhan adalah kemiskinan, dan dalam istilah teknis, apa yang kurang bagi manusia adalah menghilangkan kesedihan yang menyebabkan kesulitan. Syariah mengamati hal ini dalam tindakan ibadah, adat, transaksi, dan kejahatan, mengizinkannya bagi orang sakit dan pelancong, mengizinkan apa yang tidak diperbolehkan jika tidak diperbolehkan, seperti menjual ketelanjangan. Ensiklopedia menyajikan ketidaksepakatan mengenai bukti independennya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6706} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6709} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6709} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6709} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6716}"
