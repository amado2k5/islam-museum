summary:
  ar: "سام أبرص في الكتاب هو الوزغ ويقال خلاقه، يضمد به على الشوك والسلاء وعلى الثآليل والمسمارية فيقلعها، والمجفف منه مع الزيت ينبت الشعر على القرع، وقيل إن كبده يسكن وجع الضرس، ويشق ويوضع على لسع العقرب، وله بول ودم نافعان في فتق الصبيان {cite:canon-ibn-sina-print-v1 p.601}."
  en: "Samm abras is in the book the wall lizard, also called khalaq; laid on thorns and splinters and on warts and nail-warts it removes them, the dried kind with oil grows hair on a scald, its liver is said to calm toothache, and split open it is laid on a scorpion's sting, while its urine and blood are said to help hernia in children {cite:canon-ibn-sina-print-v1 p.601}."
  ur: "سام ابرص کتاب میں چھپکلی ⁦(وزغ)⁩ ہے جسے خلاق بھی کہا جاتا ہے؛ کانٹوں اور پھانس پر اور مسوں اور میخ نما مسوں پر رکھی جائے تو انہیں اکھاڑتی ہے، خشک کی ہوئی تیل کے ساتھ گنج پر بال اگاتی ہے، کہا گیا کہ اس کا جگر داڑھ کے درد کو تسکین دیتا ہے، چیر کر بچھو کے ڈنک پر رکھی جاتی ہے، اور اس کا پیشاب اور خون بچوں کے فتق میں مفید بتائے گئے ہیں {cite:canon-ibn-sina-print-v1 p.601}۔"
  es: "Samm abras es en el libro el lagarto de pared, también llamado khalaq; colocado sobre espinas y astillas y sobre verrugas y verrugas de las uñas las elimina, la variedad seca con aceite hace crecer el pelo en una escaldadura, se dice que su hígado calma el dolor de muelas, y abierto se coloca sobre el aguijón de un escorpión, mientras que se dice que su orina y sangre ayudan con la hernia en los niños {cite:canon-ibn-sina-print-v1 p.601}."
