id: concept/khalq-al-insan
class: concept
kind: doctrine
label:
  ar: "خلق الإنسان"
  en: "The creation of man"
  ur: "انسان کی تخلیق"
  es: "La creación del hombre"
  fr: "La création de l'homme"
summary:
  ar: "خلق الإنسان في درس الشيخ عمر عبد الكافي مراحل متتابعة: من تراب اختلط بالماء فصار طينا، ثم حمأ مسنونا، ثم صلصالا، ثم نُفخت فيه الروح في آخر الخلق، ويجعل الشيخ من ذلك دليلا على البعث. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep03 00:26:30}"
  en: "In Sheikh Omar Abdelkafy's lessons the creation of man follows successive stages: dust mixed with water into clay, then fermented mud, then dried clay, and the soul is breathed in at the end; he draws on this as evidence for the resurrection. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep03 00:26:30}"
  ur: "شیخ عمر عبدالکافی کے درس میں انسان کی تخلیق کئی مراحل میں ہوئی: مٹی پانی سے مل کر گارا بنی، پھر سڑا ہوا گارا، پھر خشک گارا، اور آخر میں روح پھونکی گئی؛ وہ اسے قیامت کی دلیل کے طور پر پیش کرتے ہیں۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep03 00:26:30}"
  es: "En las enseñanzas del jeque Omar Abdelkafy, la creación del hombre se desarrolla en etapas sucesivas: polvo mezclado con agua que se convierte en arcilla, luego lodo fermentado, después arcilla seca, y finalmente el alma es insuflada; él utiliza esto como prueba de la resurrección. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep03 00:26:30}"
  fr: "Dans les enseignements du cheikh Omar Abdelkafy, la création de l'homme se déroule en plusieurs étapes successives: la poussière mélangée à l'eau pour former de l'argile, puis de la boue fermentée, puis de l'argile séchée, et enfin l'âme est insufflée; il s'appuie sur ce processus comme preuve de la résurrection. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep03 00:26:30}"
