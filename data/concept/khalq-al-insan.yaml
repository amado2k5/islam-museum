label:
  ar: "خلق الإنسان"
  en: "The creation of man"
  ur: "انسان کی تخلیق"
summary:
  ar: "خلق الإنسان في درس الشيخ عمر عبد الكافي مراحل متتابعة: من تراب اختلط بالماء فصار طينا، ثم حمأ مسنونا، ثم صلصالا، ثم نُفخت فيه الروح في آخر الخلق، ويجعل الشيخ من ذلك دليلا على البعث. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep03 00:26:30}"
  en: "In Sheikh Omar Abdelkafy's lessons the creation of man follows successive stages: dust mixed with water into clay, then fermented mud, then dried clay, and the soul is breathed in at the end; he draws on this as evidence for the resurrection. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep03 00:26:30}"
  ur: "شیخ عمر عبدالکافی کے درس میں انسان کی تخلیق کئی مراحل میں ہوئی: مٹی پانی سے مل کر گارا بنی، پھر سڑا ہوا گارا، پھر خشک گارا، اور آخر میں روح پھونکی گئی؛ وہ اسے قیامت کی دلیل کے طور پر پیش کرتے ہیں۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep03 00:26:30}"
