id: concept/al-nafs-al-sari-wa-al-bati
class: concept
kind: scientific
label:
  ar: "النفس السريع والبطيء"
  en: "The swift breath and the slow"
  fr: "La respiration rapide et la lente"
  ur: "تیز اور سست سانس"
summary:
  ar: "النفس السريع هو الذي تكون الحركة فيه في مدة قصيرة مع بلوغ الحاجة لا كالقصير والصغير، والسبب فيه شدة الحاجة إذا لم يبلغ الكفاية فيها بالعظم إما لأن الحاجة فوق البلوغ إليه بالعظم وإما لأن العظم حائل مثل ما قيل في النبض وذلك الحائل إما في الآلة وإما في القوة وقد تكون السرعة في إحدى الحركتين أكثر منها في الأخرى مثل المذكور في النفس العظيم، والبطيء ضد السريع وضد أسبابه وقد يبطئ الوجع إذا كان العضو المتنفس يحتاج إلى أن يتحرك برفق وتؤدة {cite:canon-ibn-sina-print-v2 p.311}"
  en: "The swift breath is the breath whose motion falls in a short span while the need is met — not like the short and the small. Its cause is the need's intensity when sufficiency is not reached by largeness: either because the need is above what largeness reaches, or because largeness is barred — as was said in the pulse — and that bar is either in the instrument or in the power; and the swiftness may be more in one of the two motions than the other, as was said of the great breath. The slow is the swift's contrary and contrary to its causes; and pain may slow the breath when the breathing organ needs to move gently and slowly {cite:canon-ibn-sina-print-v2 p.311}"
  fr: "La respiration rapide est celle dont le mouvement tombe dans un court laps de temps tandis que le besoin est satisfait, non comme la courte et la petite. Sa cause est l'intensité du besoin lorsque la suffisance n'est pas atteinte par la grandeur : soit parce que le besoin dépasse ce que la grandeur atteint, soit parce que la grandeur est empêchée, comme il a été dit du pouls, et cet empêchement est soit dans l'instrument, soit dans la force ; et la rapidité peut être plus grande dans l'un des deux mouvements que dans l'autre, comme il a été dit de la grande respiration. La lente est le contraire de la rapide et contraire à ses causes ; et la douleur peut ralentir la respiration lorsque l'organe respiratoire a besoin de se mouvoir doucement et lentement {cite:canon-ibn-sina-print-v2 p.311}"
  ur: "تیز سانس وہ ہے جس کی حرکت تھوڑے مدت میں ہوتی ہے ساتھ ضرورت کی تکمیل کے — چھوٹی اور چھوٹے جیسی نہیں؛ اس کا سبب ضرورت کی شدت ہے جب بڑائی سے کفایت نہ ملے: یا اس لیے کہ ضرورت بڑائی کی پہنچ سے اوپر ہے یا اس لیے کہ بڑائی حائل ہے جیسے نبض میں کہا گیا اور وہ حائل یا اوزار میں ہے یا قوت میں؛ اور تیزی دونوں حرکتوں میں سے ایک میں دوسری سے زیادہ ہو سکتی ہے جیسے بڑی سانس میں کہا گیا؛ سست تیز کی مخالف ہے اور اس کے اسباب کی بھی؛ اور درد بھی سانس سست کر سکتا ہے جب تنفس کرنے والے عضو کو آہستگی اور نرمی سے حرکت کی ضرورت ہو {cite:canon-ibn-sina-print-v2 p.311}"
