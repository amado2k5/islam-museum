id: concept/friendship
class: concept
kind: ethical
label:
  ar: "الصَّداقة"
  en: "Friendship (its meaning, the law's encouragement of it, eating at a friend's house, and a friend's testimony for a friend)"
summary:
  ar: "الصداقة في اللغة من الصدق في الود والنصح، وفي الاصطلاح اتفاق الضمائر على المودة. وقد رغبت الشريعة فيها بين المسلمين، وعبرت عنها غالبا بالأخوة في الله. واختلف الفقهاء في الأكل في بيت الصديق في غيبته، فجوزه الشافعية إذا عُلم أنه لا يكره ذلك، ونقل الماوردي قولين في الوليمة وغيرها. وتقبل شهادة الصديق لصديقه عند عامة العلماء، واشترط الحنفية والمالكية ألا تبلغ الصداقة حد التصرف في مال الآخر، وأن يكون مشهورا بالعدالة، وزاد المالكية ألا يكون في عياله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10293} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10294}"
  en: "In language friendship (sadaqa) comes from truth in affection and counsel; in usage it is the agreement of two hearts on affection. The law encourages friendship among Muslims and usually names it brotherhood in God. The Shafi'is allow a friend to eat in his friend's house in his absence when it is known that he would not object; al-Mawardi reports two views on whether this extends beyond a wedding feast. A friend's testimony for a friend is accepted by most scholars; the Hanafis and Malikis add that the friendship must not be so close that each disposes of the other's property, and that the witness be known for uprightness, and the Malikis add that he must not live as one of the other's household. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10293} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10294}"
