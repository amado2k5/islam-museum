id: concept/falak-al-buruj
class: concept
kind: scientific
label: { ar: "فلك البروج", en: "The zodiac (ecliptic)", es: "El zodíaco (eclíptica)", fr: "Le zodiaque (écliptique)", ur: "رقم ⁦( چاند گرہن )⁩", tr: "burç", id: "zodiak" }
summary:
  ar: "فلك البروج دائرة عظيمة يرسمها سير الشمس الخاص من المغرب إلى المشرق، وتنقسم اثني عشر قسماً متساوية تسمى البروج، لكل برج ثلاثون درجة، وأولها الحمل ثم الثور والجوزاء والسرطان والأسد والسنبلة والميزان والعقرب والقوس والجدي والدلو والحوت. يقطع معدل النهار عند نقطتي الاعتدالين {cite:farghani-elements-astronomy p. 116}{cite:farghani-elements-astronomy p. 148}{cite:farghani-elements-astronomy p. 149}."
  en: "The zodiac is the great circle traced by the sun's own motion from west to east; it is divided into twelve equal signs of thirty degrees each, from Aries to Pisces, and it cuts the equinoctial circle at the two equinoxes {cite:farghani-elements-astronomy p. 116}{cite:farghani-elements-astronomy p. 148}{cite:farghani-elements-astronomy p. 149}."
  es: "El zodíaco es el gran círculo trazado por el propio movimiento del sol de oeste a este; está dividido en doce signos iguales de treinta grados cada uno, desde Aries hasta Piscis, y corta el círculo equinoccial en los dos equinoccios {cite:farghani-elements-astronomy p. 116}{cite:farghani-elements-astronomy p. 148}{cite:farghani-elements-astronomy p. 149}."
  fr: "Le zodiaque est le grand cercle tracé par le mouvement propre du soleil d'ouest en est; il est divisé en douze signes égaux de trente degrés chacun, du Bélier aux Poissons, et il coupe le cercle équinoxial aux deux équinoxes {cite:farghani-elements-astronomy p. 116}{cite:farghani-elements-astronomy p. 148}{cite:farghani-elements-astronomy p. 149}."
  ur: "رقم ایک عظیم دائرہ ہے جس کا پتہ سورج کی اپنی حرکت سے مغرب سے مشرق تک ہوتا ہے۔ اسے میش سے لے کر میش تک، تیس درجے کی بارہ مساوی علامات میں تقسیم کیا گیا ہے، اور یہ دو مساوی خطوں پر استوائی دائرے کو کاٹتا ہے۔ 116}{حوالہ دیں:فرغانی-عناصر-فلکیات صفحہ۔ 148}{حوالہ:فرغانی-عناصر-فلکیات صفحہ۔ 149}۔"
  tr: "Burç dairesi, güneşin batıdan doğuya özel yolunun çizdiği büyük bir daireyi takip eder; bu daire, her biri otuz dereceye sahip on iki eşit burç olarak adlandırılan burçlara ayrılır; ilki Koç, ardından Boğa, İkizler, Yengeç, Aslan, Başak burcu, Terazi, Akrep, Yay, Oğlak, Kova ve Balıktır. Gündüz dönemi iki ekinoksla kesişir {cite:farghani-elements-astronomy s. 116}{cite:farghani-elements-astronomy s. 148}{cite:farghani-elements-astronomy s. 149}}."
  id: "Lingkaran zodiak mengikuti lingkaran besar yang digambar oleh jalur khusus matahari dari barat ke timur, dibagi menjadi dua belas bagian yang sama yang disebut zodiak, masing-masing dengan tiga puluh derajat, yang pertama adalah Aries, kemudian Taurus, Gemini, Cancer, Leo, Virgo, Libra, Scorpio, Sagitarius, Capricorn, Aquarius, dan Pisces. Periode cahaya siang berpotongan pada dua ekuinoks {cite:farghani-elements-astronomy hlm. 116}{cite:farghani-elements-astronomy hlm. 148}{cite:farghani-elements-astronomy hlm. 149}."
