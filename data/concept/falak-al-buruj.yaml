summary:
  ar: "فلك البروج دائرة عظيمة يرسمها سير الشمس الخاص من المغرب إلى المشرق، وتنقسم اثني عشر قسماً متساوية تسمى البروج، لكل برج ثلاثون درجة، وأولها الحمل ثم الثور والجوزاء والسرطان والأسد والسنبلة والميزان والعقرب والقوس والجدي والدلو والحوت. يقطع معدل النهار عند نقطتي الاعتدالين {cite:farghani-elements-astronomy p. 116}{cite:farghani-elements-astronomy p. 148}{cite:farghani-elements-astronomy p. 149}."
  en: "The zodiac is the great circle traced by the sun's own motion from west to east; it is divided into twelve equal signs of thirty degrees each, from Aries to Pisces, and it cuts the equinoctial circle at the two equinoxes {cite:farghani-elements-astronomy p. 116}{cite:farghani-elements-astronomy p. 148}{cite:farghani-elements-astronomy p. 149}."
