label:
  ar: "وَظِيفة"
  en: "Wazifa (office, stipend, fixed duty)"
summary:
  ar: "الوظيفة من كل شيء ما يُقدَّر من طعام أو رزق أو عمل في زمن معيَّن، ويُطلق على الورد من القراءة ونحوه، وعلى المنصب والخدمة المعينة وهو لفظ مولد، وعلى العشر والخراج مجازاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17534} والمِهنة: الخدمة والعمل، والوظيفة أعم منها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17534}\n\nأولاً: الوظيفة بمعنى العمل المطلوب القيام به، وهي نوعان: عامة وخاصة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17534}\n\nالوظائف العامة: من له حق تولية الوظائف العامة هو من تنفذ أوامره وتجوز نظره، إما السلطان المستولي على الأمور، أو وزير التفويض، أو عامل عام الولاية كعامل إقليم؛ ويُشترط فيمن يُولّى أن يوثق بأمانته ويستقل بكفايته وأن يكون أصلح الناس لها، واستدل الكتاب بحديث في من استعمل رجلاً وفي الناس من هو أولى منه، وقد أشار إلى ضعف بعض رواته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17534}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17535}\n\nيلزم عند التولية تعيين العمل الذي يختص به الموظف، والعلم برسومه وحقوقه، وتحديد المكان الذي يمارس فيه العمل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17535}\n\nولاية النظر في الوظيفة لها ثلاث حالات بحسب ما قدّره المولي: أن تكون بمدة محصورة بالشهور أو السنين، أو بعمل معيّن ينتهي بانتهائه، أو مطلقة لا تقدير فيها؛ وفرّق الماوردي بين لزوم العمل للعامل إذا كان الأجر معلوماً وعدم لزومه إذا لم يتقدر بما يصح في الأجور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17535}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17536} وإذا صح التقليد فالنظر مستديم كالجباية والقضاء ما لم يُعزل، أو منقطع، ومنه ما يعود في كل عام كالخراج، وفيه وجهان: الاقتصار على عام التولية، أو الحمل على كل عام ما لم يُعزل اعتباراً بالعرف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17536}\n\nالوظائف الخاصة: وهي المرتبطة بالعقود التي ينشئها المتعاقدون، ومنها الوقف، ويحرم على الإمام وغيره إحداث وظيفة فيه لم تكن في شرط الواقف، ويفسق من فعل ذلك وينعزل الناظر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17536}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17537}\n\nصيغة تولية الوظائف: إما بألفاظ صريحة أو كنائية، وجاز التولية باللفظ وبالكتابة إذا اقترنت بشواهد، وتفصيلها في باب التولية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17537}\n\nصيغة تولية الوظائف (تتمة): تصح التولية باللفظ الصريح والكناية، وبالكتابة إذا اقترنت بشواهد الحال، وباللفظ المنجَّز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17537} وفي تعليق التولية على شرط: الحنفية والشافعية في وجه مقابل الأصح يجيزونه، واستدلوا بتأمير النبي زيداً ثم جعفراً ثم ابن رواحة في غزوة مؤتة، وهو ما يؤخذ من عبارات المالكية والحنابلة؛ والشافعية في الأصح لا يجوزون تعليق الولايات بشرط إلا في الضرورة كالإيصاء والإمارة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17537}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17538}\n\nالاعتياض عن الوظائف بمال: الشافعية وهو رأي عند الحنفية والمالكية يمنعونه، والحنابلة والحنفية في المفتى به والمالكية في رأي ضعيف عند الحطاب وبعض الشافعية كالسبكي يجيزونه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17538}\n\nالغيبة التي يستحق بها الموظف العزل: للحنفية تفصيل، فإن خرج الموظف مسيرة سفر ثم رجع لم يستحق ما مضى من معلومه، وإن أقام في الريف خمسة عشر يوماً فأكثر لغير عذر سقط، ولعذر كطلب المعاش عفو إلا إن زادت الغيبة على ثلاثة أشهر فلغيره أخذ وظيفته؛ والكتاب ينقل تفصيل ابن الشحنة والرملي والقنية، وأن ذلك لا يجوز إذا نصّب الموظف نائباً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17538}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17539} وعن الخصّاف أنه إذا أصاب القيّم عذر يمنعه المباشرة لا يستحق المعلوم، وإن أمكنه الكلام والأمر والنهي والأخذ والإعطاء فله الأجر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17539}\n\nالنزول عن الوظائف: الحنفية يرون أن المتولي لو عزل نفسه لا ينعزل حتى يبلغ القاضي فينصب غيره؛ والحنابلة يرون أن من نزل عن وظيفة لمن فيه أهلية لها لا يُقرّر غير المنزول له، فإن قرره من له الولاية تم، وإن لم يُقرّره فالوظيفة للنازل؛ ونقل الكتاب تفصيل الرحيباني في شروط تمام النزول بالقبول والإمضاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17539}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17540}\n\nتقرير أولاد الموظفين في وظيفة آبائهم بعد وفاتهم: ذكر الحنفية أن من مات وله وظيفة في بيت المال لحق الشرع وإعزاز الإسلام، وله أبناء يقومون بها، فهم أولى بها، وتفصيله في الصفحة التالية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17540}\n\nتقرير أولاد الموظفين في وظيفة آبائهم بعد وفاتهم: نص الحنفية على أن من مات وله وظيفة في بيت المال لحق الشرع وإعزاز الإسلام، وله أبناء يقومون بها، جاز للإمام أن يعطيها لأبنائه لا لغيرهم، لحصول المقصود وجبر القلوب؛ وقال البيري إن ذلك عرف مرضي في الحرمين الشريفين ومصر والروم، إذا كانوا أهلاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17540}\n\nموت صاحب الوظيفة قبل استيفاء الأجر: إن كان العمل مما لا يجوز الاستئجار عليه كالمعاصي سقط حقه، وإن جاز أُعطي بقدر ما باشر ويكون ميراثاً؛ وإن كان العمل عبادة كالأذان والإمامة وتعليم القرآن والحج فاختلفوا بحسب اختلافهم في جواز الاستئجار على العبادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17541}\n\nاستحقاق الأجرة على الوظيفة: الوظيفة إما عمل خاص وإما ولاية عامة للدولة كالإمارة والقضاء والإمامة والأذان وتعليم القرآن، وفي أخذ الأجر عليها اختلف الفقهاء، والمعاصي لا يصح الاستئجار عليها باتفاق، وتفصيله في الإجارة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17541} وقال الماوردي وأبو يعلى إن جاري العامل على عمله ثلاثة أحوال: أن يُسمّى معلوماً فيستحق المسمى إن وفى العمل، وإن قصّر روعي تقصيره، وأن يُسمّى مجهولاً فيستحق جاري المثل، وأن لا يُسمّى فيه شيء، وفيه أربعة مذاهب عند الشافعي وأصحابه: الشافعي يرى لا جاري له لأنه متطوع، والمزني يرى له جاري المثل، وابن سريج يفرق بين من اشتُهر بأخذ الجاري وغيره، وأبو إسحاق المروزي يفرّق بين من دُعي إلى العمل ومن ابتدأ بالطلب؛ وقال أبو يعلى مثل ابن سريج، وإن لم يكن للعمل مال يُجبى ففي بيت المال من سهم المصالح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17541}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17542}\n\nالوظيفة بمعنى الورد: ما يرتبه الإنسان على نفسه كل يوم أو ليلة من عمل، وتفصيله في الورد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17542}\n\nالوظيفة بمعنى ما يجب في الأرض من عشر أو خارج، والخراج قسمان: خراج الوظيفة وخراج المقاسمة، وتفصيله في باب الخراج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17542}\n\nالوظيفة بمعنى ما يُقدَّر في كل يوم من طعام أو رزق: إن كان المعطى من بيت المال فهو رزق، فالمعتبر حد الكفاية؛ وإن كان من غيره فالمعتبر ما حدده المعطي قل أو كثر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17543}"
  en: "Wazifa, lexically, is what is fixed of food, sustenance or work for a given time; it is also used for the daily litany of the recitation and for an office and a particular service, a later usage, and figuratively for the tithe and the land tax. Mihna is service and work, and wazifa is the wider term. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17534}\n\nFirst, wazifa as the work required of a person; it is either general (public) or particular. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17534}\n\nPublic offices: the power to appoint to public offices belongs to whoever's commands are obeyed and whose supervision is valid: the sovereign who holds all affairs, the minister of delegation, or a governor of a general charge, such as a provincial governor. An appointee must be trusted in honesty, able to discharge the duty alone, and the best suited; the book cites a saying about appointing a man when others are better, noting that one of its transmitters is weak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17534}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17535}\n\nAt the appointment the work that falls to the officer must be defined, its rules and rights known, and the place where he works specified. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17535}\n\nThe period of an officer's charge depends on the terms of appointment: a fixed term in months or years, a task that ends with its completion, or an unlimited charge. Al-Mawardi distinguishes whether the officer is bound when the pay is known and valid for a contract, from the case where pay is not so fixed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17535}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17536} If the appointment is valid, a continuing charge (collecting revenue, judging) continues until dismissal, while a charge that ends (such as the division of spoils) lapses; a charge that recurs every year (such as the land tax) has two views: confined to the year of appointment, or read as continuing each year until dismissal, by custom. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17536}\n\nParticular offices: those tied to the contracts that the parties make, including endowments. In an endowment the ruler or any officer may not create an office that the founder's terms did not provide, nor spend from the endowment on it; whoever does so is a sinner, and the administrator who does so is dismissed; no one but the founder may dismiss the appointee except for a clear cause such as incapacity or betrayal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17536}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17537}\n\nThe wording of the appointment is express or allusive; appointment by word or by writing, when accompanied by evidence, is permitted, and the details are under the appointment heading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17537}\n\nWording of the appointment, continued: an appointment may be made in express or allusive words, by writing when the circumstances supply evidence, and in an immediate form. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17537} On conditional appointment: the Hanafis and one Shafi'i view opposite the sounder view allow it, citing the Prophet's appointment of Zayd, then Ja'far, then Ibn Rawaha at the battle of Mu'ta; the Malikis and Hanbalis are read to accept it in their statements. The sounder Shafi'i view forbids the conditioning of offices on a condition except in necessity, as in a bequest or a command. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17537}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17538}\n\nBuying an office for money: the Shafi'is, and one view of the Hanafis and Malikis, forbid it; the Hanbalis, the Hanafi view on which fatwas are given, one Maliki view (weak according to al-Hattab) and some Shafi'is such as al-Subki, permit it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17538}\n\nAbsence that leads to dismissal: the Hanafis distinguish. If the holder goes a journey's distance and returns, he forfeits what he would have received during the absence; if he stays in the countryside fifteen days or more without excuse he forfeits it, while an excuse such as seeking a living is pardoned unless the absence exceeds three months, when another may take the office; if he is in the town and does not occupy himself with religious learning, he may be dismissed. Where he appoints a deputy, no one else may take his office. The book cites al-Khassaf: if a custodian suffers an incapacity that prevents him from acting, he takes no pay, but if he can still speak, command, forbid, take and give, he takes it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17538}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17539}\n\nResigning an office: the Hanafis hold that a holder who dismisses himself is not dismissed until the judge is informed and appoints another. The Hanbalis hold that if a person resigns an office such as the imamate, preaching or teaching to one who is qualified, the resignee is not superseded; if the official with authority appoints him, the matter is complete; if not, the office stays with the resignor. Al-Ruhaybani gives the conditions for the resignation to be complete: acceptance by the appointee and approval by the authority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17539}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17540}\n\nThe children of officials after their death: the Hanafis hold that where a holder of an office in the public treasury, for the sake of religion and the strengthening of Islam, such as the imam's or muezzin's pay, dies leaving sons who perform the duty and maintain the same, they have the better claim to it; the details continue on the next page. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17540}\n\nThe children of holders after their death: the Hanafis hold that where a holder of an office in the public treasury, for the sake of God's law and the strengthening of Islam, dies leaving sons who perform the duty, the imam may give the office to the sons and to no one else, to secure the purpose and to console them; al-Bayri says this is an accepted custom in the two holy cities, Egypt and Rum, where the sons are qualified. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17540}\n\nThe holder's death before receiving his pay: if the work could not lawfully be hired for, as with sins, his claim lapses; if it could be hired for, he receives the pay for what he did and it passes as an inheritance. If the work is an act of worship, such as the call to prayer, the imamate, teaching the Qur'an or the pilgrimage, the jurists differ according to whether it may be hired for. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17541}\n\nEntitlement to pay for an office: an office is either a particular task or a public charge of the state, such as the emirate, judgeship, imamate, call to prayer or teaching the Qur'an. The jurists differ on taking pay for these; hiring for sins is forbidden by agreement. Detail is under hire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17541} Al-Mawardi and Abu Ya'la say the pay of an agent has three cases: a named pay, which he earns if he does the work and loses part of if he neglects it or embezzles; an unnamed pay, which he earns at the wage of the like; and no pay named at all. In the last case the Shafi'i school view has him a volunteer with no pay; al-Muzani holds he has the wage of the like; Ibn Suraij distinguishes whether he is known for taking pay; Abu Ishaq al-Marwazi distinguishes whether he was called to the work. Abu Ya'la holds with Ibn Suraij, and where there is no fund to draw on the pay comes from the public treasury, from the share for public interests. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17541}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17542}\n\nThe office as a daily litany: what a person sets himself each day or night of work; the details are under its own heading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17542}\n\nThe office as a levy on land: the jurists divide what is due on land into tithe and tax, and the land tax into the fixed tax and the sharing tax; the rules are under land reclamation and tax. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17542}\n\nThe office as a daily allowance of food or sustenance: if it comes from the public treasury it is a sustenance, the measure being sufficiency; if it comes from another source, what the giver fixed governs, however little or much. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17543}"
