label:
  ar: "وَظِيفة"
  en: "Wazifa (office, stipend, fixed duty)"
summary:
  ar: "الوظيفة من كل شيء ما يُقدَّر من طعام أو رزق أو عمل في زمن معيَّن، ويُطلق على الورد من القراءة ونحوه، وعلى المنصب والخدمة المعينة وهو لفظ مولد، وعلى العشر والخراج مجازاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17534} والمِهنة: الخدمة والعمل، والوظيفة أعم منها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17534}\n\nأولاً: الوظيفة بمعنى العمل المطلوب القيام به، وهي نوعان: عامة وخاصة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17534}\n\nالوظائف العامة: من له حق تولية الوظائف العامة هو من تنفذ أوامره وتجوز نظره، إما السلطان المستولي على الأمور، أو وزير التفويض، أو عامل عام الولاية كعامل إقليم؛ ويُشترط فيمن يُولّى أن يوثق بأمانته ويستقل بكفايته وأن يكون أصلح الناس لها، واستدل الكتاب بحديث في من استعمل رجلاً وفي الناس من هو أولى منه، وقد أشار إلى ضعف بعض رواته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17534}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17535}\n\nيلزم عند التولية تعيين العمل الذي يختص به الموظف، والعلم برسومه وحقوقه، وتحديد المكان الذي يمارس فيه العمل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17535}\n\nولاية النظر في الوظيفة لها ثلاث حالات بحسب ما قدّره المولي: أن تكون بمدة محصورة بالشهور أو السنين، أو بعمل معيّن ينتهي بانتهائه، أو مطلقة لا تقدير فيها؛ وفرّق الماوردي بين لزوم العمل للعامل إذا كان الأجر معلوماً وعدم لزومه إذا لم يتقدر بما يصح في الأجور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17535}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17536} وإذا صح التقليد فالنظر مستديم كالجباية والقضاء ما لم يُعزل، أو منقطع، ومنه ما يعود في كل عام كالخراج، وفيه وجهان: الاقتصار على عام التولية، أو الحمل على كل عام ما لم يُعزل اعتباراً بالعرف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17536}\n\nالوظائف الخاصة: وهي المرتبطة بالعقود التي ينشئها المتعاقدون، ومنها الوقف، ويحرم على الإمام وغيره إحداث وظيفة فيه لم تكن في شرط الواقف، ويفسق من فعل ذلك وينعزل الناظر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17536}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17537}\n\nصيغة تولية الوظائف: إما بألفاظ صريحة أو كنائية، وجاز التولية باللفظ وبالكتابة إذا اقترنت بشواهد، وتفصيلها في باب التولية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17537}"
  en: "Wazifa, lexically, is what is fixed of food, sustenance or work for a given time; it is also used for the daily litany of the recitation and for an office and a particular service, a later usage, and figuratively for the tithe and the land tax. Mihna is service and work, and wazifa is the wider term. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17534}\n\nFirst, wazifa as the work required of a person; it is either general (public) or particular. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17534}\n\nPublic offices: the power to appoint to public offices belongs to whoever's commands are obeyed and whose supervision is valid: the sovereign who holds all affairs, the minister of delegation, or a governor of a general charge, such as a provincial governor. An appointee must be trusted in honesty, able to discharge the duty alone, and the best suited; the book cites a saying about appointing a man when others are better, noting that one of its transmitters is weak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17534}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17535}\n\nAt the appointment the work that falls to the officer must be defined, its rules and rights known, and the place where he works specified. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17535}\n\nThe period of an officer's charge depends on the terms of appointment: a fixed term in months or years, a task that ends with its completion, or an unlimited charge. Al-Mawardi distinguishes whether the officer is bound when the pay is known and valid for a contract, from the case where pay is not so fixed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17535}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17536} If the appointment is valid, a continuing charge (collecting revenue, judging) continues until dismissal, while a charge that ends (such as the division of spoils) lapses; a charge that recurs every year (such as the land tax) has two views: confined to the year of appointment, or read as continuing each year until dismissal, by custom. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17536}\n\nParticular offices: those tied to the contracts that the parties make, including endowments. In an endowment the ruler or any officer may not create an office that the founder's terms did not provide, nor spend from the endowment on it; whoever does so is a sinner, and the administrator who does so is dismissed; no one but the founder may dismiss the appointee except for a clear cause such as incapacity or betrayal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17536}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17537}\n\nThe wording of the appointment is express or allusive; appointment by word or by writing, when accompanied by evidence, is permitted, and the details are under the appointment heading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17537}"
