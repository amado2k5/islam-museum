id: concept/wazifa-fiqh
class: concept
kind: legal
label:
  ar: "وَظِيفة"
  en: "Wazifa (office, stipend, fixed duty)"
  es: "Wazifa (oficina, estipendio, deber fijo)"
  fr: "Wazifa (bureau, allocation, tâche fixe)"
  ur: "وظیفہ ⁦(دفتر، وظیفہ، مقررہ ڈیوٹی)⁩"
  tr: "iş"
  id: "pekerjaan"
summary:
  ar: "الوظيفة من كل شيء ما يُقدَّر من طعام أو رزق أو عمل في زمن معيَّن، ويُطلق على الورد من القراءة ونحوه، وعلى المنصب والخدمة المعينة وهو لفظ مولد، وعلى العشر والخراج مجازاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17534} والمِهنة: الخدمة والعمل، والوظيفة أعم منها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17534}\n\nأولاً: الوظيفة بمعنى العمل المطلوب القيام به، وهي نوعان: عامة وخاصة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17534}\n\nالوظائف العامة: من له حق تولية الوظائف العامة هو من تنفذ أوامره وتجوز نظره، إما السلطان المستولي على الأمور، أو وزير التفويض، أو عامل عام الولاية كعامل إقليم؛ ويُشترط فيمن يُولّى أن يوثق بأمانته ويستقل بكفايته وأن يكون أصلح الناس لها، واستدل الكتاب بحديث في من استعمل رجلاً وفي الناس من هو أولى منه، وقد أشار إلى ضعف بعض رواته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17534}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17535}\n\nيلزم عند التولية تعيين العمل الذي يختص به الموظف، والعلم برسومه وحقوقه، وتحديد المكان الذي يمارس فيه العمل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17535}\n\nولاية النظر في الوظيفة لها ثلاث حالات بحسب ما قدّره المولي: أن تكون بمدة محصورة بالشهور أو السنين، أو بعمل معيّن ينتهي بانتهائه، أو مطلقة لا تقدير فيها؛ وفرّق الماوردي بين لزوم العمل للعامل إذا كان الأجر معلوماً وعدم لزومه إذا لم يتقدر بما يصح في الأجور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17535}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17536} وإذا صح التقليد فالنظر مستديم كالجباية والقضاء ما لم يُعزل، أو منقطع، ومنه ما يعود في كل عام كالخراج، وفيه وجهان: الاقتصار على عام التولية، أو الحمل على كل عام ما لم يُعزل اعتباراً بالعرف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17536}\n\nالوظائف الخاصة: وهي المرتبطة بالعقود التي ينشئها المتعاقدون، ومنها الوقف، ويحرم على الإمام وغيره إحداث وظيفة فيه لم تكن في شرط الواقف، ويفسق من فعل ذلك وينعزل الناظر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17536}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17537}\n\nصيغة تولية الوظائف: إما بألفاظ صريحة أو كنائية، وجاز التولية باللفظ وبالكتابة إذا اقترنت بشواهد، وتفصيلها في باب التولية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17537}\n\nصيغة تولية الوظائف ⁦(تتمة)⁩: تصح التولية باللفظ الصريح والكناية، وبالكتابة إذا اقترنت بشواهد الحال، وباللفظ المنجَّز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17537} وفي تعليق التولية على شرط: الحنفية والشافعية في وجه مقابل الأصح يجيزونه، واستدلوا بتأمير النبي زيداً ثم جعفراً ثم ابن رواحة في غزوة مؤتة، وهو ما يؤخذ من عبارات المالكية والحنابلة؛ والشافعية في الأصح لا يجوزون تعليق الولايات بشرط إلا في الضرورة كالإيصاء والإمارة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17537}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17538}\n\nالاعتياض عن الوظائف بمال: الشافعية وهو رأي عند الحنفية والمالكية يمنعونه، والحنابلة والحنفية في المفتى به والمالكية في رأي ضعيف عند الحطاب وبعض الشافعية كالسبكي يجيزونه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17538}\n\nالغيبة التي يستحق بها الموظف العزل: للحنفية تفصيل، فإن خرج الموظف مسيرة سفر ثم رجع لم يستحق ما مضى من معلومه، وإن أقام في الريف خمسة عشر يوماً فأكثر لغير عذر سقط، ولعذر كطلب المعاش عفو إلا إن زادت الغيبة على ثلاثة أشهر فلغيره أخذ وظيفته؛ والكتاب ينقل تفصيل ابن الشحنة والرملي والقنية، وأن ذلك لا يجوز إذا نصّب الموظف نائباً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17538}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17539} وعن الخصّاف أنه إذا أصاب القيّم عذر يمنعه المباشرة لا يستحق المعلوم، وإن أمكنه الكلام والأمر والنهي والأخذ والإعطاء فله الأجر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17539}\n\nالنزول عن الوظائف: الحنفية يرون أن المتولي لو عزل نفسه لا ينعزل حتى يبلغ القاضي فينصب غيره؛ والحنابلة يرون أن من نزل عن وظيفة لمن فيه أهلية لها لا يُقرّر غير المنزول له، فإن قرره من له الولاية تم، وإن لم يُقرّره فالوظيفة للنازل؛ ونقل الكتاب تفصيل الرحيباني في شروط تمام النزول بالقبول والإمضاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17539}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17540}\n\nتقرير أولاد الموظفين في وظيفة آبائهم بعد وفاتهم: ذكر الحنفية أن من مات وله وظيفة في بيت المال لحق الشرع وإعزاز الإسلام، وله أبناء يقومون بها، فهم أولى بها، وتفصيله في الصفحة التالية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17540}\n\nتقرير أولاد الموظفين في وظيفة آبائهم بعد وفاتهم: نص الحنفية على أن من مات وله وظيفة في بيت المال لحق الشرع وإعزاز الإسلام، وله أبناء يقومون بها، جاز للإمام أن يعطيها لأبنائه لا لغيرهم، لحصول المقصود وجبر القلوب؛ وقال البيري إن ذلك عرف مرضي في الحرمين الشريفين ومصر والروم، إذا كانوا أهلاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17540}\n\nموت صاحب الوظيفة قبل استيفاء الأجر: إن كان العمل مما لا يجوز الاستئجار عليه كالمعاصي سقط حقه، وإن جاز أُعطي بقدر ما باشر ويكون ميراثاً؛ وإن كان العمل عبادة كالأذان والإمامة وتعليم القرآن والحج فاختلفوا بحسب اختلافهم في جواز الاستئجار على العبادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17541}\n\nاستحقاق الأجرة على الوظيفة: الوظيفة إما عمل خاص وإما ولاية عامة للدولة كالإمارة والقضاء والإمامة والأذان وتعليم القرآن، وفي أخذ الأجر عليها اختلف الفقهاء، والمعاصي لا يصح الاستئجار عليها باتفاق، وتفصيله في الإجارة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17541} وقال الماوردي وأبو يعلى إن جاري العامل على عمله ثلاثة أحوال: أن يُسمّى معلوماً فيستحق المسمى إن وفى العمل، وإن قصّر روعي تقصيره، وأن يُسمّى مجهولاً فيستحق جاري المثل، وأن لا يُسمّى فيه شيء، وفيه أربعة مذاهب عند الشافعي وأصحابه: الشافعي يرى لا جاري له لأنه متطوع، والمزني يرى له جاري المثل، وابن سريج يفرق بين من اشتُهر بأخذ الجاري وغيره، وأبو إسحاق المروزي يفرّق بين من دُعي إلى العمل ومن ابتدأ بالطلب؛ وقال أبو يعلى مثل ابن سريج، وإن لم يكن للعمل مال يُجبى ففي بيت المال من سهم المصالح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17541}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17542}\n\nالوظيفة بمعنى الورد: ما يرتبه الإنسان على نفسه كل يوم أو ليلة من عمل، وتفصيله في الورد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17542}\n\nالوظيفة بمعنى ما يجب في الأرض من عشر أو خارج، والخراج قسمان: خراج الوظيفة وخراج المقاسمة، وتفصيله في باب الخراج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17542}\n\nالوظيفة بمعنى ما يُقدَّر في كل يوم من طعام أو رزق: إن كان المعطى من بيت المال فهو رزق، فالمعتبر حد الكفاية؛ وإن كان من غيره فالمعتبر ما حدده المعطي قل أو كثر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17543}"
  en: "Wazifa, lexically, is what is fixed of food, sustenance or work for a given time; it is also used for the daily litany of the recitation and for an office and a particular service, a later usage, and figuratively for the tithe and the land tax. Mihna is service and work, and wazifa is the wider term. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17534}\n\nFirst, wazifa as the work required of a person; it is either general (public) or particular. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17534}\n\nPublic offices: the power to appoint to public offices belongs to whoever's commands are obeyed and whose supervision is valid: the sovereign who holds all affairs, the minister of delegation, or a governor of a general charge, such as a provincial governor. An appointee must be trusted in honesty, able to discharge the duty alone, and the best suited; the book cites a saying about appointing a man when others are better, noting that one of its transmitters is weak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17534}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17535}\n\nAt the appointment the work that falls to the officer must be defined, its rules and rights known, and the place where he works specified. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17535}\n\nThe period of an officer's charge depends on the terms of appointment: a fixed term in months or years, a task that ends with its completion, or an unlimited charge. Al-Mawardi distinguishes whether the officer is bound when the pay is known and valid for a contract, from the case where pay is not so fixed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17535}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17536} If the appointment is valid, a continuing charge (collecting revenue, judging) continues until dismissal, while a charge that ends (such as the division of spoils) lapses; a charge that recurs every year (such as the land tax) has two views: confined to the year of appointment, or read as continuing each year until dismissal, by custom. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17536}\n\nParticular offices: those tied to the contracts that the parties make, including endowments. In an endowment the ruler or any officer may not create an office that the founder's terms did not provide, nor spend from the endowment on it; whoever does so is a sinner, and the administrator who does so is dismissed; no one but the founder may dismiss the appointee except for a clear cause such as incapacity or betrayal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17536}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17537}\n\nThe wording of the appointment is express or allusive; appointment by word or by writing, when accompanied by evidence, is permitted, and the details are under the appointment heading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17537}\n\nWording of the appointment, continued: an appointment may be made in express or allusive words, by writing when the circumstances supply evidence, and in an immediate form. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17537} On conditional appointment: the Hanafis and one Shafi'i view opposite the sounder view allow it, citing the Prophet's appointment of Zayd, then Ja'far, then Ibn Rawaha at the battle of Mu'ta; the Malikis and Hanbalis are read to accept it in their statements. The sounder Shafi'i view forbids the conditioning of offices on a condition except in necessity, as in a bequest or a command. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17537}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17538}\n\nBuying an office for money: the Shafi'is, and one view of the Hanafis and Malikis, forbid it; the Hanbalis, the Hanafi view on which fatwas are given, one Maliki view (weak according to al-Hattab) and some Shafi'is such as al-Subki, permit it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17538}\n\nAbsence that leads to dismissal: the Hanafis distinguish. If the holder goes a journey's distance and returns, he forfeits what he would have received during the absence; if he stays in the countryside fifteen days or more without excuse he forfeits it, while an excuse such as seeking a living is pardoned unless the absence exceeds three months, when another may take the office; if he is in the town and does not occupy himself with religious learning, he may be dismissed. Where he appoints a deputy, no one else may take his office. The book cites al-Khassaf: if a custodian suffers an incapacity that prevents him from acting, he takes no pay, but if he can still speak, command, forbid, take and give, he takes it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17538}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17539}\n\nResigning an office: the Hanafis hold that a holder who dismisses himself is not dismissed until the judge is informed and appoints another. The Hanbalis hold that if a person resigns an office such as the imamate, preaching or teaching to one who is qualified, the resignee is not superseded; if the official with authority appoints him, the matter is complete; if not, the office stays with the resignor. Al-Ruhaybani gives the conditions for the resignation to be complete: acceptance by the appointee and approval by the authority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17539}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17540}\n\nThe children of officials after their death: the Hanafis hold that where a holder of an office in the public treasury, for the sake of religion and the strengthening of Islam, such as the imam's or muezzin's pay, dies leaving sons who perform the duty and maintain the same, they have the better claim to it; the details continue on the next page. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17540}\n\nThe children of holders after their death: the Hanafis hold that where a holder of an office in the public treasury, for the sake of God's law and the strengthening of Islam, dies leaving sons who perform the duty, the imam may give the office to the sons and to no one else, to secure the purpose and to console them; al-Bayri says this is an accepted custom in the two holy cities, Egypt and Rum, where the sons are qualified. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17540}\n\nThe holder's death before receiving his pay: if the work could not lawfully be hired for, as with sins, his claim lapses; if it could be hired for, he receives the pay for what he did and it passes as an inheritance. If the work is an act of worship, such as the call to prayer, the imamate, teaching the Qur'an or the pilgrimage, the jurists differ according to whether it may be hired for. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17541}\n\nEntitlement to pay for an office: an office is either a particular task or a public charge of the state, such as the emirate, judgeship, imamate, call to prayer or teaching the Qur'an. The jurists differ on taking pay for these; hiring for sins is forbidden by agreement. Detail is under hire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17541} Al-Mawardi and Abu Ya'la say the pay of an agent has three cases: a named pay, which he earns if he does the work and loses part of if he neglects it or embezzles; an unnamed pay, which he earns at the wage of the like; and no pay named at all. In the last case the Shafi'i school view has him a volunteer with no pay; al-Muzani holds he has the wage of the like; Ibn Suraij distinguishes whether he is known for taking pay; Abu Ishaq al-Marwazi distinguishes whether he was called to the work. Abu Ya'la holds with Ibn Suraij, and where there is no fund to draw on the pay comes from the public treasury, from the share for public interests. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17541}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17542}\n\nThe office as a daily litany: what a person sets himself each day or night of work; the details are under its own heading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17542}\n\nThe office as a levy on land: the jurists divide what is due on land into tithe and tax, and the land tax into the fixed tax and the sharing tax; the rules are under land reclamation and tax. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17542}\n\nThe office as a daily allowance of food or sustenance: if it comes from the public treasury it is a sustenance, the measure being sufficiency; if it comes from another source, what the giver fixed governs, however little or much. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17543}"
  es: "Wazifa, léxicamente, es lo que se fija de alimento, sustento o trabajo por un tiempo dado; también se usa para la letanía diaria de la recitación y para un cargo y un servicio particular, un uso posterior, y figurativamente para el diezmo y el impuesto de la tierra. Mihna es servicio y trabajo, y wazifa es el término más amplio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17534} Primero, wazifa como el trabajo requerido de una persona; es general (público) o particular. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17534} Cargos públicos: el poder de nombrar para cargos públicos pertenece a quienquiera que se obedezcan sus órdenes y cuya supervisión sea válida: el soberano que tiene todos los asuntos, el ministro de delegación o un gobernador de cargo general, como un gobernador provincial. Un designado debe ser confiable en honestidad, capaz de cumplir el deber solo y el más adecuado; El libro cita un dicho sobre nombrar a un hombre cuando hay otros mejores, señalando que uno de sus transmisores es débil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17534}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17535} En el nombramiento, el trabajo que le corresponde al funcionario debe estar definido, sus reglas y derechos conocidos, y el lugar donde trabaja especificado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17535} El período de servicio de un funcionario depende de los términos del nombramiento: un plazo fijo en meses o años, una tarea que termina al completarse, o un cargo ilimitado. Al-Mawardi distingue si el funcionario está obligado cuando el salario es conocido y válido para un contrato, del caso en que el salario no está fijado de esa manera. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17535}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17536} Si el nombramiento es válido, un cargo continuo (recaudación de ingresos, juicio) continúa hasta el despido, mientras que un cargo que termina (como la división del botín) caduca; un cargo que se repite cada año (como el impuesto sobre la tierra) tiene dos interpretaciones: confinado al año del nombramiento, o leído como continuo cada año hasta el despido, por costumbre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17536} Cargos particulares: aquellos vinculados a los contratos que las partes celebran, incluidas las fundaciones. En una fundación, el gobernante o cualquier funcionario no puede crear un cargo que los términos del fundador no previeran, ni gastar de la fundación en él; quien lo haga es un pecador, y el administrador que lo haga es destituido; Nadie más que el fundador puede destituir al designado excepto por una causa clara como incapacidad o traición. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17536}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17537} La redacción del nombramiento es expresa o alusiva; el nombramiento por palabra o por escrito, cuando va acompañado de pruebas, está permitido, y los detalles están bajo el encabezado del nombramiento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17537} Redacción del nombramiento, continuación: un nombramiento puede hacerse en palabras expresas o alusivas, por escrito cuando las circunstancias proporcionan pruebas, y de forma inmediata. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17537} Sobre el nombramiento condicional: los hanafíes y una opinión shafi'í opuesta a la opinión más sólida lo permiten, citando el nombramiento del Profeta de Zayd, luego de Ja'far, luego de Ibn Rawaha en la batalla de Mu'ta; se lee que los malikíes y los hanbalíes lo aceptan en sus declaraciones. La opinión shafi'í más sólida prohíbe condicionar los cargos a una condición excepto en necesidad, como en un legado o una orden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17537}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17538} Comprar un cargo por dinero: los shafi'íes, y una opinión de los hanafíes y los malikíes, lo prohíben; Los hanbalíes, la visión hanafí sobre la que se emiten fatuas, una visión malikí (débil según al-Hattab) y algunos shafi'ís como al-Subki, lo permiten. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17538} Ausencia que conlleva destitución: los hanafíes distinguen. Si el titular va una distancia de viaje y regresa, pierde lo que habría recibido durante la ausencia; si permanece en el campo quince días o más sin excusa, lo pierde, mientras que una excusa como buscar sustento se perdona a menos que la ausencia exceda los tres meses, en cuyo caso otro puede asumir el cargo; si está en la ciudad y no se ocupa del estudio religioso, puede ser destituido. Cuando nombra a un sustituto, nadie más puede ocupar su cargo. El libro cita a al-Khassaf: si un custodio sufre una incapacidad que le impide actuar, no recibe paga, pero si aún puede hablar, mandar, prohibir, tomar y dar, la recibe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17538}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17539} Renuncia a un cargo: los hanafíes sostienen que un titular que se renuncia a sí mismo no es destituido hasta que el juez es informado y nombra a otro. Los hanbalíes sostienen que si una persona renuncia a un cargo como el imamato, predicar o enseñar a alguien calificado, el renunciante no es reemplazado; si el funcionario con autoridad lo nombra, el asunto está completo; de lo contrario, el cargo permanece con el renunciante. Al-Ruhaybani da las condiciones para que la renuncia sea completa: aceptación por parte del nombrado y aprobación por parte de la autoridad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17539}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17540} Los hijos de los funcionarios después de su muerte: los hanafíes sostienen que cuando un titular de un cargo en el tesoro público, por el bien de la religión y el fortalecimiento del Islam, como el salario del imán o del muecín, muere dejando hijos que realizan el deber y mantienen el mismo, tienen mejor derecho a él; los detalles continúan en la página siguiente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17540} Los hijos de los titulares después de su muerte: los hanafíes sostienen que cuando un titular de un cargo en el tesoro público, por el bien de la ley de Dios y el fortalecimiento del Islam, muere dejando hijos que realizan el deber, el imán puede dar el cargo a los hijos y a nadie más, para asegurar el propósito y consolarlos; al-Bayri dice que esta es una costumbre aceptada en las dos ciudades santas, Egipto y Rum, donde los hijos están calificados. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17540} La muerte del titular antes de recibir su pago: si el trabajo no podía ser contratado legalmente, como con los pecados, su derecho caduca; si podía ser contratado, recibe el pago por lo que hizo y pasa como herencia. Si el trabajo es un acto de culto, como la llamada a la oración, el imamato, la enseñanza del Corán o la peregrinación, los juristas difieren en cuanto a si se puede contratar para ello. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17541} Derecho a recibir un pago por un cargo: un cargo es una tarea particular o una carga pública del estado, como el emirato, el cargo de juez, el imamato, la llamada a la oración o la enseñanza del Corán. Los juristas difieren en cuanto a recibir un pago por estos; contratar para pecados está prohibido por acuerdo. El detalle está bajo el alquiler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17541} Al-Mawardi y Abu Ya'la dicen que el pago de un agente tiene tres casos: un pago nombrado, que gana si hace el trabajo y pierde parte de él si lo descuida o malversa; un pago no nombrado, que gana al salario de los similares; y ningún pago nombrado en absoluto. En el último caso, la opinión de la escuela Shafi'i lo tiene como voluntario sin pago; al-Muzani sostiene que tiene el salario de los similares; Ibn Suraij distingue si es conocido por recibir un pago; Abu Ishaq al-Marwazi distingue si fue llamado al trabajo. Abu Ya'la está de acuerdo con Ibn Suraij, y cuando no hay fondos para retirar el pago proviene del tesoro público, de la parte para los intereses públicos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17541}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17542} El cargo como una letanía diaria: lo que una persona se propone cada día o noche de trabajo; los detalles están bajo su propio encabezado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17542} El cargo como gravamen sobre la tierra: los juristas dividen lo que se debe sobre la tierra en diezmo e impuesto, y el impuesto sobre la tierra en impuesto fijo e impuesto de reparto; las reglas están bajo recuperación de tierras e impuesto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17542} El cargo como asignación diaria de alimentos o sustento: si proviene del tesoro público es un sustento, siendo la medida la suficiencia; si proviene de otra fuente, lo que el donante fijó rige, sin importar cuánto o poco. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17543}"
  fr: "Le terme wazifa, au sens littéral, désigne ce qui est fixé en matière de nourriture, de subsistance ou de travail pour une période donnée; il est également employé pour la litanie quotidienne de la récitation, ainsi que pour une fonction et un service particulier (usage plus récent), et, au sens figuré, pour la dîme et l’impôt foncier. Mihna signifie service et travail, tandis que wazifa est le terme plus général. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17534} Premièrement, le wazifa désigne le travail requis d’une personne; il peut être général (public) ou particulier. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17534} Fonctions publiques: le pouvoir de nommer aux fonctions publiques appartient à celui dont les ordres sont respectés et dont la supervision est légitime: le souverain qui détient toutes les affaires, le ministre délégué ou un gouverneur chargé d’une compétence générale, tel qu’un gouverneur de province. Le candidat doit être digne de confiance, intègre, capable d’assumer seul ses fonctions et être le plus apte. L'ouvrage cite un adage concernant la nomination d'un homme lorsque d'autres sont plus compétents, tout en soulignant la faiblesse de l'un de ses transmetteurs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17534}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17535} Lors de la nomination, les tâches qui incombent à l'agent doivent être définies, ses règles et droits connus, et son lieu d'affectation précisé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17535} La durée du mandat d'un agent dépend des modalités de sa nomination: une durée déterminée en mois ou en années, une mission qui prend fin à son achèvement, ou une mission à durée indéterminée. Al-Mawardi établit une distinction entre le cas où l'agent est lié par un contrat dont la rémunération est connue et valable, et le cas où elle n'est pas fixée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17535}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17536} Si la nomination est valide, une charge permanente (perception des revenus, jugement) se poursuit jusqu'à la révocation, tandis qu'une charge qui prend fin (comme le partage du butin) s'éteint. Une charge annuelle (comme l'impôt foncier) peut être interprétée de deux manières: soit elle est limitée à l'année de la nomination, soit elle est considérée comme se poursuivant chaque année jusqu'à la révocation, par coutume. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17536} Fonctions particulières: celles qui sont liées aux contrats conclus entre les parties, y compris les dotations. Dans une dotation, le souverain ou tout autre fonctionnaire ne peut créer une fonction non prévue par les termes du fondateur, ni dépenser des fonds de la dot pour cela; quiconque agit ainsi commet un péché, et l'administrateur qui agit ainsi est révoqué. Nul autre que le fondateur ne peut révoquer le nommé, sauf pour un motif clair tel que l'incapacité ou la trahison. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17536}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17537} La nomination peut être formulée expressément ou de manière indirecte; une nomination verbale ou écrite, accompagnée de preuves, est autorisée, et les détails figurent sous la rubrique « Nomination ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17537} Suite de la formulation de la nomination: une nomination peut être faite expressément ou de manière indirecte, par écrit lorsque les circonstances fournissent des preuves, et de manière immédiate. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17537} Concernant la nomination conditionnelle: les Hanafites et une opinion chaféite, contraire à l’avis le plus solide, l’autorisent, citant la nomination par le Prophète de Zayd, puis de Ja’far, puis d’Ibn Rawaha lors de la bataille de Mu’ta; les Malikites et les Hanbalites semblent l’accepter dans leurs déclarations. L’avis chaféite le plus solide interdit de conditionner les charges à une condition, sauf en cas de nécessité, comme dans le cas d’un legs ou d’un commandement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17537}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17538} L’achat d’une charge contre de l’argent: les Chaféites, ainsi qu’une opinion des Hanafites et des Malikites, l’interdisent; Les Hanbalites, l'école hanafite sur laquelle se fondent les fatwas, une école malikite (faible selon al-Hattab) et certains chaféites, comme al-Subki, l'autorisent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17538} Absence entraînant la révocation: les Hanafites font la distinction suivante. Si le titulaire effectue un voyage et revient, il perd les revenus qu'il aurait perçus pendant son absence; s'il séjourne à la campagne quinze jours ou plus sans excuse valable, il perd également ses revenus, tandis qu'une excuse telle que la recherche d'un emploi est pardonnée, sauf si l'absence excède trois mois, auquel cas un autre peut occuper la fonction; s'il se trouve en ville et ne se consacre pas à l'étude religieuse, il peut être révoqué. S'il nomme un adjoint, nul autre ne peut occuper sa fonction. L'ouvrage cite al-Khassaf: si un gardien est frappé d'incapacité l'empêchant d'agir, il ne perçoit pas de rémunération; en revanche, s'il est encore capable de parler, d'ordonner, d'interdire, de prendre et de donner, il la perçoit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17538}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17539} Démission: selon l'école hanafite, celui qui démissionne n'est pas démis de ses fonctions tant que le juge n'en a pas été informé et n'a pas désigné son successeur. L'école hanbalite, quant à elle, considère que si une personne démissionne d'une fonction telle que l'imamat, la prédication ou l'enseignement, en faveur d'une personne qualifiée, le démissionnaire n'est pas remplacé; si l'autorité compétente le nomme, la procédure est close; dans le cas contraire, la fonction reste acquise au démissionnaire. Al-Ruhaybani énonce les conditions de validité d'une démission: son acceptation par le candidat désigné et son approbation par l'autorité compétente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17539}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17540} Concernant les enfants des fonctionnaires décédés: selon l'école hanafite, lorsqu'un titulaire d'une fonction au sein du Trésor public, œuvrant pour la religion et le renforcement de l'islam (comme la rémunération de l'imam ou du muezzin), décède en laissant des fils qui exercent et maintiennent cette fonction, ces derniers ont un droit prioritaire à l'héritage. Plus de détails à ce sujet sont présentés à la page suivante. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17540} Les enfants des titulaires après leur décès: selon l’école hanafite, lorsqu’un titulaire d’une charge au Trésor public décède en laissant des fils qui exercent cette fonction, l’imam peut, par respect pour la loi divine et pour le renforcement de l’islam, la transmettre à ces fils, et à nul autre, afin de garantir la continuité de la charge et de les consoler. Al-Bayri rapporte que cette coutume est acceptée dans les deux villes saintes d’Égypte et de Roum, où les fils remplissent les conditions requises. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17540} En cas de décès du titulaire avant la perception de sa rémunération: si le travail ne pouvait être licitement effectué, comme c’est le cas pour les péchés, son droit à la rémunération s’éteint; s’il pouvait l’être, il perçoit la rémunération correspondante, qui est transmise par héritage. Si l'activité consiste en un acte de culte, tel que l'appel à la prière, l'imamat, l'enseignement du Coran ou le pèlerinage, les juristes divergent quant à la possibilité d'une rémunération. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17541} Droit à une rémunération pour une fonction: une fonction désigne soit une tâche particulière, soit une charge publique de l'État, comme l'émirat, la magistrature, l'imamat, l'appel à la prière ou l'enseignement du Coran. Les juristes divergent sur la question de la rémunération de ces fonctions; la rémunération pour des actes répréhensibles est interdite par convention. Les détails sont abordés dans la section consacrée à la rémunération. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17541} Al-Mawardi et Abu Ya'la distinguent trois types de rémunération pour un mandataire: une rémunération fixe, qu'il perçoit s'il accomplit sa tâche et dont il perd une partie s'il la néglige ou détourne des fonds; Une rémunération non précisée, perçue au salaire d'une personne exerçant une fonction similaire; et aucune rémunération du tout. Dans ce dernier cas, l'école shafi'ite le considère comme un bénévole non rémunéré; al-Muzani estime qu'il perçoit le salaire d'une personne exerçant une fonction similaire; Ibn Suraij fait la distinction selon qu'il est connu pour percevoir une rémunération; Abu Ishaq al-Marwazi fait la distinction selon qu'il a été appelé à exercer cette fonction. Abu Ya'la partage l'avis d'Ibn Suraij et, en l'absence de fonds propres, la rémunération provient du trésor public, prélevée sur la part allouée aux intérêts publics. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17541}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17542} La fonction comme une litanie quotidienne: ce que chacun se fixe chaque jour ou chaque nuit de travail; les détails sont consignés dans une rubrique dédiée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17542} L'office comme prélèvement foncier: les juristes divisent les sommes dues sur la terre en dîme et impôt, et cet impôt foncier en impôt fixe et impôt de partage; les règles sont décrites dans la section consacrée à la mise en valeur et à l'impôt fonciers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17542} L'office comme allocation journalière de nourriture ou de subsistance: si elle provient du trésor public, il s'agit d'une subsistance, la mesure étant la suffisance; si elle provient d'une autre source, c'est le montant fixé par le donateur qui prévaut, quel que soit son montant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17543}"
  ur: "وظیفہ، لغوی طور پر، وہ ہے جو کھانے، رزق یا کام کے لیے ایک مقررہ وقت کے لیے مقرر کیا جاتا ہے۔ اس کا استعمال روزانہ کی تلاوت کے لیے اور دفتر اور کسی خاص خدمت کے لیے، بعد میں استعمال، اور علامتی طور پر دسواں حصہ اور زمین کے ٹیکس کے لیے بھی کیا جاتا ہے۔ میانہ خدمت اور کام ہے اور وظیفہ وسیع تر اصطلاح ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17534} سب سے پہلے وظیفہ ایک شخص کے لیے ضروری کام ہے۔ یہ یا تو عام ⁦(عوامی)⁩ ہے یا خاص۔ عوامی دفاتر: عوامی دفاتر میں تقرری کا اختیار ہر اس شخص کا ہے جس کے حکم کی تعمیل ہو اور جس کی نگرانی درست ہو: وہ صاحب اقتدار جو تمام امور کا نگران ہو، وزیر وفد، یا گورنر، گورنر یا گورنر جیسے انچارج۔ تقرر کرنے والے پر ایمانداری پر بھروسہ ہونا چاہیے، وہ تنہا ڈیوٹی انجام دینے کے قابل، اور بہترین موزوں ہونا چاہیے۔ کتاب ایک آدمی کو مقرر کرنے کے بارے میں ایک قول کا حوالہ دیتی ہے جب دوسرے بہتر ہوں، یہ نوٹ کرتے ہوئے کہ اس کا ایک ٹرانسمیٹر کمزور ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17534}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17535} تقرری کے وقت افسر کے پاس آنے والے کام کی وضاحت ہونی چاہیے، اس کے قوانین اور حقوق کا علم ہونا چاہیے، اور اس کے کام کرنے کی جگہ کا تعین ہونا چاہیے۔ {حوالہ:فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17535} ایک افسر کے چارج کی مدت تقرری کی شرائط پر منحصر ہے: مہینوں یا سالوں میں ایک مقررہ مدت، ایک کام جو اس کے مکمل ہونے پر ختم ہو، یا لامحدود چارج۔ الماوردی فرق کرتا ہے کہ آیا افسر پابند ہے جب تنخواہ معلوم ہو اور معاہدے کے لیے درست ہو، اس معاملے سے جہاں تنخواہ اتنی مقرر نہیں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17535}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17536} اگر تقرری درست ہے تو، ایک مسلسل چارج ⁦(محصول جمع کرنا، فیصلہ کرنا)⁩ جاری رہتا ہے جب تک کہ چارج ختم نہ ہو جائے، خرابیاں ایک چارج جو ہر سال دہرایا جاتا ہے ⁦(جیسے لینڈ ٹیکس)⁩ کے دو نظریات ہیں: تقرری کے سال تک محدود، یا اپنی مرضی کے مطابق، برخاستگی تک ہر سال جاری رہنے کے طور پر پڑھیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17536} خاص دفاتر: وہ معاہدوں سے منسلک ہیں جو فریقین کرتے ہیں، بشمول اوقاف۔ اوقاف میں حاکم یا کوئی افسر ایسا دفتر نہیں بنا سکتا جو بانی کی شرائط نے فراہم نہ کیا ہو، اور نہ ہی اس پر خرچ کیا جائے۔ جو ایسا کرتا ہے وہ گنہگار ہے، اور ایسا کرنے والے کو برطرف کر دیا جاتا ہے۔ بانی کے علاوہ کوئی بھی مقرر کو برطرف نہیں کر سکتا سوائے کسی واضح وجہ جیسے کہ نااہلی یا خیانت کے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17536}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17537} تقرری کا لفظ واضح یا اشارہ ہے؛ لفظی یا تحریری طور پر تقرری، جب ثبوت کے ساتھ ہو، اجازت ہے، اور تفصیلات ملاقات کے عنوان کے تحت ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17537} تقرری کے الفاظ، جاری: ایک ملاقات واضح یا اشتعال انگیز الفاظ میں، حالات کے ثبوت فراہم کرنے پر لکھ کر، اور فوری شکل میں کی جا سکتی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17537} مشروط تقرری پر: حنفیہ اور ایک شافعی صحیح قول کے مخالف اس کی اجازت دیتے ہیں، موطا کی جنگ میں نبی کے زید، پھر جعفر، پھر ابن رواحہ کی تقرری کا حوالہ دیتے ہوئے؛ مالکیہ اور حنبلی اپنے اقوال میں اسے قبول کرنے کے لیے پڑھے جاتے ہیں۔ صحیح شافعی کا قول کسی شرط پر دفاتر کو کنڈیشن کرنے سے منع کرتا ہے سوائے ضرورت کے، جیسا کہ وصیت یا حکم میں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17537}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17538} پیسوں سے دفتر خریدنا: شافعیوں کا، اور حنفیہ اور مالکیوں کا ایک قول، اس سے منع کرتے ہیں۔ حنبلی، حنفی مسلک جس پر فتویٰ دیا جاتا ہے، ایک مالکی قول ⁦(الحطب کے مطابق ضعیف)⁩ اور بعض شافعی جیسے السبکی اس کی اجازت دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17538} عدم موجودگی جو تصرف کا باعث بنتی ہے: حنفیہ امتیاز کرتے ہیں۔ اگر ہولڈر سفر کی مسافت پر جاتا ہے اور واپس آتا ہے، تو وہ اس چیز کو کھو دیتا ہے جو اسے غیر موجودگی کے دوران حاصل ہوتا۔ اگر وہ دیہی علاقوں میں بغیر کسی عذر کے پندرہ دن یا اس سے زیادہ قیام کرتا ہے تو وہ اسے ضائع کر دیتا ہے، جب کہ روزی کے حصول جیسے عذر کو معاف کر دیا جاتا ہے جب تک کہ غیر حاضری تین ماہ سے زیادہ نہ ہو، جب کوئی دوسرا عہدہ سنبھال سکتا ہے۔ اگر وہ شہر میں ہے اور مذہبی تعلیم میں مشغول نہیں ہے تو اسے برخاست کیا جا سکتا ہے۔ جہاں وہ نائب مقرر کرتا ہے، کوئی دوسرا اس کا عہدہ نہیں لے سکتا۔ کتاب الخصاف کا حوالہ دیتی ہے: اگر کسی نگران کو کوئی ایسی عاجزی ہو جو اسے کام کرنے سے روکتی ہو تو وہ کوئی تنخواہ نہیں لیتا، لیکن اگر وہ پھر بھی بول سکتا ہے، حکم دے سکتا ہے، منع کر سکتا ہے، لے سکتا ہے اور دے سکتا ہے تو وہ اسے لے لیتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17538}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17539} عہدہ سے استعفیٰ دینا: احناف کا موقف ہے کہ اپنے آپ کو برطرف کرنے والے کو اس وقت تک برطرف نہیں کیا جاتا جب تک کہ جج کو اطلاع نہ کر دی جائے اور کسی دوسرے کو مقرر نہ کیا جائے۔ حنبلیوں کا خیال ہے کہ اگر کوئی شخص کسی اہل کو امامت، تبلیغ یا تعلیم جیسے عہدے سے مستعفی ہو جائے تو مستعفی نہیں ہوتا۔ اگر بااختیار اہلکار اسے مقرر کرے تو معاملہ مکمل ہو جاتا ہے۔ اگر نہیں، تو دفتر استعفیٰ دینے والے کے ساتھ رہتا ہے۔ الروحیبانی استعفیٰ کے مکمل ہونے کی شرائط بتاتے ہیں: مقرر کی طرف سے قبولیت اور اتھارٹی کی طرف سے منظوری۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17539}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17540} حکام کی اولاد ان کی وفات کے بعد: احناف کا خیال ہے کہ سرکاری خزانے میں کوئی عہدہ رکھنے والا، دین اسلام کی مضبوطی اور اس طرح کے دین کی خاطر۔ مؤذن کی تنخواہ، بیٹوں کو چھوڑ کر مر جاتا ہے جو فرض ادا کرتے ہیں اور اسی کو برقرار رکھتے ہیں، ان کا اس پر بہتر دعویٰ ہے۔ تفصیلات اگلے صفحے پر جاری ہیں۔ فقہ الموسوعۃ کویتیہ نور ص 17540 ص 17540} ان کے مرنے کے بعد حاملین کی اولاد: احناف کا خیال ہے کہ جہاں خدا کے قانون اور اسلام کی مضبوطی کی خاطر سرکاری خزانے میں کوئی عہدہ رکھنے والا فوت ہو جائے، وہ اپنے بیٹوں کو چھوڑ کر جو فرض ادا کرتے ہیں، امام کسی اور کو عہدہ اور تسلی نہیں دے سکتا۔ البائری کہتے ہیں کہ یہ دو مقدس شہروں مصر اور روم میں ایک قبول شدہ رواج ہے جہاں بیٹے اہل ہوتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17540} تنخواہ وصول کرنے سے پہلے ہولڈر کی موت: اگر کام قانونی طور پر کام پر نہیں لیا جا سکتا، جیسا کہ گناہوں کے ساتھ، اس کا دعوی ختم ہو جاتا ہے۔ اگر اس کے لیے کرایہ پر لیا جا سکتا ہے، تو وہ اپنے کیے کی تنخواہ وصول کرتا ہے اور یہ وراثت کے طور پر گزر جاتا ہے۔ اگر کام عبادت ہے، جیسے کہ اذان، امامت، قرآن پڑھانا یا حج کرنا، تو فقہاء کا اختلاف ہے کہ آیا اس کے لیے کرایہ پر لیا جا سکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17541} دفتر کی ادائیگی کا حق: دفتر یا تو ایک خاص کام یا ریاست کا عوامی چارج ہے، جیسے امارت، قاضی، امامت، اذان یا قرآن پڑھانا۔ فقہا کا ان کی اجرت لینے میں اختلاف ہے۔ معاہدوں کے ذریعہ گناہوں کے لئے کام کرنا حرام ہے۔ تفصیل کرایہ کے تحت ہے۔ الماوردی اور ابو یعلٰی کہتے ہیں کہ ایجنٹ کی تنخواہ کی تین صورتیں ہیں: ایک نامی تنخواہ، جسے وہ کام کرنے پر کماتا ہے اور اگر اس میں کوتاہی یا غبن کرتا ہے تو اس کا کچھ حصہ کھو دیتا ہے۔ ایک بے نام تنخواہ، جو وہ اسی طرح کی اجرت پر کماتا ہے؛ اور کوئی تنخواہ کا نام نہیں ہے۔ آخری صورت میں شافعی مکتبہ فکر کے مطابق وہ ایک رضاکار ہے جس کی کوئی تنخواہ نہیں ہے۔ المزانی کا خیال ہے کہ اس کے پاس اسی طرح کی اجرت ہے۔ ابن سریج نے فرق کیا ہے کہ آیا وہ تنخواہ لینے کے لیے جانا جاتا ہے۔ ابو اسحاق المروازی نے اس بات کی تفریق کی کہ آیا انہیں کام پر بلایا گیا تھا۔ ابو یعلٰی ابن سریج کے پاس ہے، اور جہاں تنخواہ پر خرچ کرنے کے لیے کوئی فنڈ نہیں ہے وہ عوامی خزانے سے، عوامی مفادات کے لیے حصہ سے آتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17541}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17542} روزمرہ کے لیٹنی کے طور پر دفتر: جو شخص ہر دن یا کام کی رات خود کو طے کرتا ہے؛ تفصیلات اس کے اپنے عنوان کے تحت ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17542} زمین پر محصول کے طور پر دفتر: فقہاء زمین پر واجب الادا رقم کو دسواں اور ٹیکس میں تقسیم کرتے ہیں، اور زمین کے ٹیکس کو مقررہ ٹیکس اور شیئرنگ ٹیکس میں تقسیم کرتے ہیں۔ قوانین زمین کی بحالی اور ٹیکس کے تحت ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17542} کھانے یا رزق کے یومیہ الاؤنس کے طور پر دفتر: اگر یہ سرکاری خزانے سے آتا ہے تو یہ ایک رزق ہے، پیمانہ کفایت؛ اگر یہ کسی اور ذریعہ سے آیا ہے، تو جو دینے والے نے مقرر کیا ہے، خواہ تھوڑا ہو یا زیادہ۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص17543}"
  tr: "\"Fonksiyon\" terimi, belirli bir süre için yiyecek, geçim veya iş açısından tahsis edilen her şeyi ifade eder. Ayrıca okuma veya benzeri faaliyetlerin bir bölümünü, belirli bir pozisyonu veya hizmeti (yeni bir terim) ve mecazi olarak zekât ve vergileri ifade etmek için de kullanılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17534} \"Meslek\" terimi hizmet ve işi ifade ederken, \"fonksiyon\" daha geneldir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17534} Öncelikle, \"fonksiyon\" gerekli iş anlamına gelir ve iki türü vardır: genel ve özel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17534} Kamu görevleri: Kamu görevlerine atama yetkisi, emirleri yerine getirilen ve görüşü geçerli olan kişiye aittir; bu, işleri denetleyen sultan, bakan veya bölge yetkilisi gibi eyalet genel yetkilisi olabilir. Atanan kişinin güvenilir, yetenekli ve göreve en uygun kişi olması şart koşulmuştur. Kitap, daha nitelikli biri varken birini atayan kişiyle ilgili bir hadis zikrediyor ve bazı ravilerinin zayıflığını ortaya koyuyor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17534}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17535} Atama yapıldıktan sonra, çalışanın özel görevleri, ücreti ve hakları ile çalışacağı yerin belirtilmesi gerekir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17535} Bir işi denetleme yetkisi, atayan kişinin takdirine bağlı olarak üç biçimde olabilir: belirli bir süre için (aylar veya yıllar), tamamlanmasıyla sona eren belirli bir görev için veya belirli bir süresi olmayan açık uçlu olabilir. El-Mawardi, ücretin bilindiği durumlarda çalışanın çalışma yükümlülüğü ile ücretin kabul edilebilir bir ücret olarak belirlenmediği durumlarda çalışma yükümlülüğünün olmaması arasında ayrım yapmıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17535}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17536} Atama geçerli ise, atanan kişi görevden alınmadığı veya geçici olmadığı sürece, denetim vergi tahsilatı ve yargılama gibi süreklidir. Bazı ihmaller her yıl tekrarlanır, örneğin arazi vergisi (haraç) gibi ve bu konuda iki görüş vardır: atama yılıyla sınırlı tutulması veya atanan kişi görevden alınmadığı sürece her yıl uygulanması, gelenek esasına dayanmaktadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17536} Özel görevler: Bunlar, vakıflar (waqf) dahil olmak üzere, sözleşme tarafları tarafından kurulan sözleşmelerle ilgilidir. İmamın veya başka birinin, vakıf kuran tarafından belirtilmemiş bir vakıf içinde bir görev oluşturması yasaktır. Bunu yapan kişi günah işlemiş sayılır ve gözetmen görevden alınır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17536}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17537} Görevlilerin atanması formülü: ya açıkça ifade edilerek ya da ima yoluyla. Atama, sözlü ve yazılı olarak, destekleyici delillerle birlikte yapılması şartıyla caizdir. Daha ayrıntılı bilgi atama bölümünde bulunmaktadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17537} Memur atama formülü (devamı): Atama, açık sözlerle, ima yoluyla, destekleyici delillerle birlikte yazılı olarak ve nihai, kesin bir beyanla geçerlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17537} Atamayı şartlı hale getirme konusunda: Hanefiler ve Şafiiler, daha az doğru görüşlerden birinde, buna izin verirler. Delil olarak, Peygamberin Mu'te Muharebesi'nde önce Zeyd'i, sonra Cafer'i, sonra da İbn Ravaha'yı komutan olarak atamasını gösterirler. Bu, Malikiler ve Hanbelilerin açıklamalarından da anlaşılmaktadır. Şafiîler, daha doğru görüşe göre, vasiyet veya valilik gibi zorunluluk halleri dışında atamaları şartlı hale getirmeye izin vermezler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17537}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17538} Resmi görevler karşılığında para kabul etme konusunda: Şafiîler ve bu görüş bazı Hanefi ve Maliki mezhepleri tarafından da benimsenmiştir, bunu yasaklarlar. Hanbeliler, Hanefiler (yaygın görüşe göre), Malikiler (el-Hattab'ın zayıf görüşüne göre) ve el-Subki gibi bazı Şafiîler buna izin verirler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17538} Çalışanın işten çıkarılmasını gerektiren devamsızlık: Hanefi mezhebi bu konuda ayrıntılı bir açıklama sunmaktadır. Bir çalışan uzun bir yolculuk yapıp geri dönerse, geçmiş döneme ait maaşını almaya hak kazanmaz. Geçerli bir mazereti olmaksızın on beş gün veya daha fazla süreyle kırsal kesimde kalırsa, maaşı kesilir. Emekli maaşı almak gibi geçerli bir mazereti varsa, üç ayı aşmadığı sürece mazur görülür; üç ayı aşarsa, yerine başka biri geçebilir. Kitap, İbn el-Şihna, el-Ramli ve el-Kunya'nın ayrıntılı görüşlerini aktarıyor ve çalışanın bir vekil ataması durumunda bunun caiz olmadığını belirtiyor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17538}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17539} El-Hasaf'tan rivayet edildiğine göre, amirin görevini yerine getirmesini engelleyen geçerli bir mazereti varsa, maaşını almaya hak kazanmaz. Ancak, konuşabiliyor, emredebiliyor, yasaklayabiliyor, alabiliyor ve verebiliyorsa, maaşa hak kazanır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17539} Görevlerden İstifa: Hanefiler, bir yöneticinin istifa etmesi durumunda, hakime haber verilip yerine bir başkası atanana kadar görevden alınamayacağını savunurlar. Hanbeliler ise, bir kişi bir görevden istifa ederek o göreve yetkili birini atarsa, istifa edilen kişiden başkasının atanamayacağını savunurlar. Yetkili kişi atamayı onaylarsa, atama geçerlidir; onaylamazsa, görev istifa eden kişiye aittir. Kitap ayrıca, istifanın geçerliliği için gereken şartların, yani kabul ve tasdik şartlarının, Rahibani'nin ayrıntılı açıklamasını da içermektedir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17539}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17540} Çalışanların Çocuklarının Babalarının Vefatından Sonra Görevlerine Atanması: Hanefiler, bir kimse İslam hukukunun hakları ve İslam'ın güçlendirilmesi nedeniyle kamu hazinesinde (Beytül Mal) bir görevde bulunurken vefat ederse ve bu görevi yerine getiren çocukları varsa, bu göreve en çok hak kazananların onlar olduğunu belirtmişlerdir. Daha fazla ayrıntı bir sonraki sayfada verilmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17540} Çalışanların çocuklarının babalarının ölümünden sonra görevlerini devralmaları hakkındaki rapor: Hanefi mezhebi, bir kimse İslam hukuku ve İslam'ın korunması adına kamu hazinesinde (Beytül Mal) bir görevde bulunurken ölürse ve bu görevi yerine getirebilecek oğulları varsa, imamın bu görevi oğullarına verebileceğini, böylece amacın gerçekleşmesini ve merhumun teselli edilmesini sağlayabileceğini belirtmiştir. El-Biri, oğulların nitelikli olması şartıyla bunun İki Kutsal Mescid (Mekke ve Medine), Mısır ve Bizans İmparatorluğu'nda yerleşik bir uygulama olduğunu belirtmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17540} Ücret almadan önce işçinin ölümü: Eğer yapılan iş, günah gibi ücret ödenmesinin caiz olmadığı bir iş ise, işçinin bu iş için ücret alma hakkı ortadan kalkar. Eğer yapılan iş caiz ise, işçi yaptığı iş miktarına göre ücretlendirilir ve bu, mirasından pay alır. Eğer yapılan iş, ezan okumak, namaz kıldırmak, Kur'an öğretmek veya Hac yapmak gibi bir ibadet ise, âlimler ibadetler için ücret ödenmesinin caiz olup olmadığı konusunda farklı görüşlere sahiptirler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17541} Bir iş için ücret alma hakkı: Bir iş, özel bir iş veya emirlik, yargı, imamlık, ezan okuma ve Kur'an öğretme gibi devletin kamu görevi olabilir. Fıkıhçılar bunun için ücret alınması konusunda farklı görüşler belirtmişlerdir ve günahlar için işçi çalıştırmanın caiz olmadığı konusunda ittifak etmişlerdir; bunun detayları kira sözleşmesinde yer almaktadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17541} El-Mawardi ve Ebu Ya'la, işçinin emeği karşılığında alacağı ücretin üç tür olduğunu söylemişlerdir: Birincisi, bilinen olarak belirtilen ücrettir; bu durumda işçi, işi tamamladığı takdirde belirtilen miktarı almaya hak kazanır ve eksik kaldığı takdirde eksikliği dikkate alınır; ikincisi, bilinmeyen olarak belirtilen ücrettir; üçüncüsü ise, hiçbir ücret belirtilmemiştir. Bu konuda Şafiî ve arkadaşları arasında dört görüş vardır: Şafiî, gönüllü olduğu için ücret almaması gerektiğini savunur; El-Muzani, işçinin geleneksel ücreti alması gerektiğini savunur; İbn Surayj ise, ücret aldığı bilinen ve bilinmeyen arasında ayrım yapar. Ebu İshak el-Mervezi, çalışmaya çağrılan ile arayarak başlayan arasında ayrım yapar; Ebu Ya'la da İbn Surayj ile aynı şeyi söyler ve eğer iş için toplanacak para yoksa, bu para faiz payından hazinede bulunur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17541}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17542} \"Vazife\" terimi, günlük veya gece yapılan bir ibadet anlamına gelir ve ayrıntıları günlük ibadetler bölümünde bulunur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17542} \"Vazife\" terimi ayrıca, arazi üzerinden ödenmesi gereken bir zekat veya diğer vergi anlamına da gelir. Vergiler iki türdür: vezife vergisi ve musamame (ortakçılık) vergisi; bunların ayrıntıları haraç (toprak vergisi) bölümünde bulunmaktadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17542} \"Vazife\" terimi ayrıca günlük yiyecek veya geçim tahsisi anlamına da gelir. Tahsis kamu hazinesinden geliyorsa, geçim olarak kabul edilir ve belirleyici faktör yeterlilik için gereken minimum miktardır. Başka bir kaynaktan geliyorsa, belirleyici faktör, verenin belirttiği miktardır, ister büyük ister küçük olsun. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17543}"
  id: "Istilah \"fungsi\" merujuk pada segala sesuatu yang dialokasikan dalam bentuk makanan, nafkah, atau pekerjaan untuk jangka waktu tertentu. Istilah ini juga digunakan untuk merujuk pada sebagian kegiatan membaca atau kegiatan serupa, posisi atau layanan tertentu (sebuah neologisme), dan secara metaforis merujuk pada persepuluhan dan pajak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17534} Istilah \"profesi\" merujuk pada pelayanan dan pekerjaan, sedangkan \"fungsi\" lebih umum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17534} Pertama, \"fungsi\" berarti pekerjaan yang dibutuhkan, dan ada dua jenis: umum dan khusus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17534} Jabatan publik: Orang yang berhak mengangkat seseorang untuk jabatan publik adalah orang yang perintahnya dilaksanakan dan pendapatnya valid, baik itu sultan yang mengendalikan urusan, menteri delegasi, atau pejabat umum provinsi, seperti pejabat daerah; Ditetapkan bahwa siapa pun yang diangkat harus dapat dipercaya, mampu, dan orang yang paling cocok untuk posisi tersebut. Buku ini mengutip sebuah hadits tentang seseorang yang mengangkat seseorang padahal ada orang yang lebih memenuhi syarat, dan menunjukkan kelemahan beberapa perawinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17534}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17535} Setelah pengangkatan, perlu ditentukan tugas khusus karyawan, biaya dan hak mereka, serta lokasi tempat mereka akan bekerja. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17535} Wewenang untuk mengawasi suatu pekerjaan memiliki tiga bentuk, tergantung pada kebijaksanaan pemberi kuasa: dapat berupa jangka waktu tetap beberapa bulan atau tahun, untuk tugas tertentu yang berakhir setelah selesai, atau dapat bersifat tidak terbatas tanpa jangka waktu tetap. Al-Mawardi membedakan antara kewajiban karyawan untuk bekerja jika upahnya diketahui dan tidak adanya kewajiban jika upahnya tidak ditentukan sesuai dengan apa yang dianggap dapat diterima sebagai upah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17535}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17536} Jika penunjukan tersebut sah, maka pengawasan bersifat berkelanjutan, seperti pengumpulan pajak dan pengadilan, kecuali jika orang yang ditunjuk diberhentikan, atau bersifat sementara. Beberapa kelalaian berulang setiap tahun, seperti pajak tanah (kharaj), dan ada dua pendapat mengenai hal ini: membatasinya pada tahun pengangkatan, atau menerapkannya setiap tahun kecuali jika pejabat yang diangkat diberhentikan, berdasarkan kebiasaan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17536} Fungsi khusus: Ini terkait dengan kontrak yang dibuat oleh pihak-pihak yang berkontrak, termasuk wakaf. Dilarang bagi imam atau siapa pun untuk menciptakan fungsi dalam wakaf yang tidak ditentukan oleh pemberi wakaf. Siapa pun yang melakukannya dianggap telah berbuat dosa, dan pengawasnya diberhentikan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17536}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17537} Rumus pengangkatan pejabat: baik dengan kata-kata eksplisit atau secara implisit. Pengangkatan diperbolehkan secara lisan dan tertulis jika disertai bukti pendukung. Rincian lebih lanjut terdapat dalam bab tentang pengangkatan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17537} Rumus pengangkatan pejabat (lanjutan): Pengangkatan sah dengan kata-kata eksplisit, secara implisit, secara tertulis jika disertai bukti pendukung, dan dengan pernyataan akhir yang definitif. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17537} Mengenai pengangkatan bersyarat: Mazhab Hanafi dan Syafi'i, dalam salah satu pendapat yang kurang tepat, memperbolehkannya. Mereka mengutip sebagai bukti pengangkatan Nabi terhadap Zaid, kemudian Ja'far, kemudian Ibnu Rawahah sebagai komandan dalam Perang Mu'tah. Hal ini juga dipahami dari pernyataan mazhab Maliki dan Hanbali. Mazhab Syafi'i, dalam pendapat yang lebih tepat, tidak memperbolehkan pengangkatan bersyarat kecuali dalam kasus-kasus yang mendesak, seperti wasiat atau jabatan gubernur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17537}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17538} Mengenai menerima uang sebagai pengganti tugas resmi: Mazhab Syafi'i, dan ini juga merupakan pendapat yang dianut oleh sebagian mazhab Hanafi dan Maliki, melarangnya. Mazhab Hanbali, mazhab Hanafi (menurut pendapat yang berlaku), mazhab Maliki (dalam pendapat lemah yang dianut oleh al-Hattab), dan sebagian mazhab Syafi'i, seperti al-Subki, memperbolehkannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17538} Ketidakhadiran yang menyebabkan pemecatan karyawan: Mazhab Hanafi memiliki penjelasan yang rinci. Jika seorang karyawan melakukan perjalanan jauh dan kemudian kembali, ia tidak berhak atas gajinya untuk periode sebelumnya. Jika ia tinggal di pedesaan selama lima belas hari atau lebih tanpa alasan yang sah, gajinya hangus. Jika ia memiliki alasan yang sah, seperti mengajukan pensiun, ia dibebaskan dari kewajiban tersebut, kecuali jika ketidakhadirannya melebihi tiga bulan, dalam hal ini orang lain dapat menggantikan posisinya. Buku ini mengutip pendapat rinci Ibn al-Shihna, al-Ramli, dan al-Qunya, dan menyatakan bahwa hal ini tidak diperbolehkan jika karyawan tersebut menunjuk seorang wakil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17538}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17539} Diriwayatkan dari al-Khasaf bahwa jika pengawas memiliki alasan yang sah yang menghalanginya untuk melaksanakan tugasnya, ia tidak berhak atas gajinya. Namun, jika ia mampu berbicara, memberi perintah, melarang, mengambil, dan memberi, maka ia berhak atas gajinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17539} Pengunduran Diri dari Jabatan: Mazhab Hanafi berpendapat bahwa jika seorang administrator mengundurkan diri, ia tidak diberhentikan dari jabatannya sampai hakim diberitahu dan menunjuk pengganti. Mazhab Hanbali berpendapat bahwa jika seseorang mengundurkan diri dari suatu jabatan kepada seseorang yang memenuhi syarat, maka tidak seorang pun selain orang yang menerima pengunduran diri tersebut dapat diangkat. Jika orang yang berwenang mengkonfirmasi pengangkatan tersebut, maka pengangkatan itu sah; jika tidak, jabatan tersebut menjadi milik orang yang mengundurkan diri. Buku ini juga memuat penjelasan rinci Al-Rahibani tentang syarat-syarat keabsahan pengunduran diri, yaitu penerimaan dan pengesahan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17539}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17540} Pengangkatan Anak-Anak Pegawai untuk Menggantikan Posisi Ayah Mereka Setelah Kematian Ayah: Mazhab Hanafi menyatakan bahwa jika seseorang meninggal dunia dengan memegang jabatan di kas negara (Bayt al-Mal) karena hak-hak hukum Islam dan penguatan Islam, dan ia memiliki anak-anak yang menjalankan peran tersebut, maka merekalah yang paling berhak atas jabatan tersebut. Rincian lebih lanjut diberikan pada halaman berikutnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17540} Laporan tentang anak-anak pegawai yang mewarisi jabatan ayah mereka setelah meninggal: Mazhab Hanafi menetapkan bahwa jika seseorang meninggal dunia dengan memegang jabatan di kas negara (Bayt al-Mal) demi hukum Islam dan penegakan Islam, dan memiliki putra yang dapat memenuhi peran tersebut, Imam dapat menugaskannya kepada putranya dan bukan kepada orang lain, untuk mencapai tujuan yang dimaksud dan menghibur almarhum. Al-Biri menyatakan bahwa ini adalah praktik yang sudah mapan di Dua Masjid Suci (Mekah dan Madinah), Mesir, dan Kekaisaran Bizantium, asalkan putra-putra tersebut memenuhi syarat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17540} Kematian pegawai sebelum menerima pembayaran: Jika pekerjaan tersebut adalah sesuatu yang tidak diperbolehkan untuk dibayar, seperti perbuatan dosa, maka haknya atas pekerjaan tersebut hilang. Jika diperbolehkan, ia dibayar sesuai dengan jumlah yang telah ia kerjakan, dan ini menjadi bagian dari warisannya. Jika pekerjaan tersebut adalah ibadah, seperti mengumandangkan azan, memimpin salat, mengajarkan Al-Quran, atau melaksanakan haji, para ulama berbeda pendapat mengenai kebolehan menerima bayaran untuk ibadah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17541} Hak atas pembayaran untuk suatu pekerjaan: Pekerjaan dapat berupa pekerjaan swasta atau jabatan publik negara seperti emirat, peradilan, imam, mengumandangkan azan, dan mengajarkan Al-Quran. Para ahli fiqih berbeda pendapat mengenai pengambilan bayaran untuk pekerjaan tersebut, dan disepakati bahwa tidak diperbolehkan untuk mempekerjakan orang yang berbuat dosa, dan rinciannya ada dalam perjanjian sewa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17541} Al-Mawardi dan Abu Ya’la mengatakan bahwa upah pekerja untuk pekerjaannya ada tiga jenis: upah yang disebut sebagai upah yang diketahui, sehingga ia berhak atas jumlah yang disebutkan jika ia menyelesaikan pekerjaannya, dan jika ia kurang, kekurangannya diperhitungkan; upah yang disebut sebagai upah yang tidak diketahui, sehingga ia berhak atas upah yang lazim; dan tidak ada yang disebutkan untuk upah tersebut, dan ada empat pendapat tentang hal ini di antara Al-Shafi’i dan para sahabatnya: Al-Shafi’i berpendapat bahwa ia tidak mendapat upah karena ia adalah sukarelawan; Al-Muzani berpendapat bahwa ia berhak atas upah yang lazim; Ibn Surayj membedakan antara orang yang dikenal menerima upah dan orang yang tidak; dan Abu Ishaq Al-Marwazi membedakan antara orang yang dipanggil untuk bekerja dan orang yang memulai dengan mencari pekerjaan; dan Abu Ya’la mengatakan hal yang sama seperti Ibn Surayj, dan jika tidak ada uang yang dikumpulkan untuk pekerjaan itu, maka uang itu ada di kas negara dari bagian bunga. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17541}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17542} Istilah \"wazifah\" berarti ibadah harian atau malam hari, rinciannya terdapat dalam bagian tentang ibadah harian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17542} Istilah \"wazifah\" juga berarti persepuluhan atau pajak lain yang dikenakan atas tanah. Pajak ada dua jenis: pajak yang dikenakan atas wazifah dan pajak yang dikenakan atas musamamah (bagi hasil pertanian), rinciannya terdapat dalam bagian tentang kharaj (pajak tanah). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17542} Istilah \"wazifah\" juga berarti alokasi makanan atau rezeki harian. Jika alokasi tersebut berasal dari kas negara, maka dianggap sebagai rezeki, dan faktor penentunya adalah jumlah minimum yang dibutuhkan untuk kecukupan. Jika berasal dari sumber lain, faktor penentunya adalah jumlah yang ditentukan oleh pemberi, baik besar maupun kecil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17543}"
