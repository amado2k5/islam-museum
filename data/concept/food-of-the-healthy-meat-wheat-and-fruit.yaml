summary:
  ar: "يفتتح ابن سينا الفصل السابع، في تدبير المأكول، بأن حافظ الصحة لا يجعل جوهر غذائه من الأغذية الدوائية كالبقول والفواكه، ويفضل لحم الجدي والعجول الصغيرة والحملان والحنطة النقية والحلو الملائم، ويجعل التين والعنب والتمر أشبه الفواكه بالغذاء {cite:canon-ibn-sina-print-v1 pp.227-228}."
  en: "Opening chapter 7, on the management of what is eaten, Ibn Sina says whoever guards his health should not make medicinal foods such as pulses and fruit the substance of his diet; he prefers kid, young calves, lambs, cleaned wheat and a sweet suited to the temperament, and names figs, grapes and dates as the fruits closest to real food {cite:canon-ibn-sina-print-v1 pp.227-228}."
