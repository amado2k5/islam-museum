id: concept/hisab-harf-al-quran
class: concept
kind: doctrine
label:
  ar: "قراءة حرف من القرآن: حسنة بعشر أمثالها"
  en: "Reading a letter of the Qur'an: a good deed counted ten"
  ur: "قرآن کا ایک حرف پڑھنا: دس گنا نیکی"
summary:
  ar: "من قرأ حرفا من كتاب الله فله به حسنة، والحسنة بعشر أمثالها، ثم يوضح الحديث وحدة العدّ: ليست فاتحة البقرة حرفا واحدا، بل الألف حرف واللام حرف والميم حرف، في رواية ابن مسعود عند الترمذي الذي ذكر أن بعضهم رفعه وبعضهم وقفه على ابن مسعود [[passage/tirmidhi-api-2910]]. وهو أوضح نص يسمّي وحدة الحساب ويضرب لها مثالا."
  en: "Whoever reads a letter of the Book of God has a good deed for it, and the good deed counts ten; the report then fixes the unit of counting: the opening of al-Baqara is not one letter, for alif is a letter, lam a letter and mim a letter, in Ibn Mas'ud's narration in al-Tirmidhi, who notes that some transmitters raise it to the Prophet and others stop it at Ibn Mas'ud [[passage/tirmidhi-api-2910]]. It is the clearest text that names its unit of account and gives a worked example."
  ur: "جو اللہ کی کتاب کا ایک حرف پڑھے اس کے لیے ایک نیکی ہے، اور نیکی دس گنا ہے؛ پھر حدیث شمار کی اکائی واضح کرتی ہے: سورۂ بقرہ کا آغاز ایک حرف نہیں بلکہ الف ایک حرف، لام ایک حرف اور میم ایک حرف ہے، ابن مسعود کی روایت میں جو ترمذی میں ہے، اور ترمذی نے بتایا کہ بعض نے اسے مرفوع اور بعض نے ابن مسعود پر موقوف روایت کیا [[passage/tirmidhi-api-2910]]۔ یہ سب سے واضح نص ہے جو حساب کی اکائی کا نام لیتی اور اس کی مثال دیتی ہے۔"
