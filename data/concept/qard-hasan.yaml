id: concept/qard-hasan
class: concept
kind: belief
label: { ar: "القرض الحسن لله", en: "The good loan to God (qard hasan)", ur: "اللہ کو قرض حسن" }
summary:
  ar: "يرى الشعراوي أن الإنفاق في سبيل الله يسمى قرضاً لأن المنفق يعطي ماله على أمل أن يستعيده مضاعفاً، وأن القرض الحسن يكون من مال حلال، وأن ثوابه قد يفوق الصدقة لأن النفس تبقى متعلقة به {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1040} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1041}."
  en: "Sha'rawi holds that spending in God's cause is called a loan because the giver hands over wealth in hope of getting back more. A good loan comes from lawful money, and he reports the view that its reward can exceed that of charity, because the self stays attached to it {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1040} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1041}."
  ur: "شعراوی کے نزدیک اللہ کی راہ میں خرچ کو قرض اس لیے کہا گیا کہ دینے والا مال اس امید پر دیتا ہے کہ اسے زیادہ کر کے واپس پائے گا۔ قرض حسن حلال مال سے ہوتا ہے، اور وہ نقل کرتے ہیں کہ اس کا ثواب صدقے سے بڑھ سکتا ہے کیونکہ نفس اس سے جڑا رہتا ہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1040} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1041}۔"
