label:
  ar: "الحرية في الدماء"
  en: "Security of life in Islam"
summary:
  ar: "يعرض محمد الخضر حسين حرمة الدم بوصفها جزءًا من الحرية، فيشبّه الأمة بجسد واحد، وسفك دم الفرد فيها بفصد عرق، ويرى القصاص من القاتل كفصد الطبيب الذي يمنع فساد الدم أن يسري إلى سائر الأعضاء {cite:al-hurriyya-fi-al-islam-azhar p. 91}. ويقول إن القصاص يكف الناس عن إراقة الدماء، ويحفظ حياة من كان سيُقتل انتقامًا لغيره، وإن الأحكام بُنيت على الاحتياط حتى لا يتخذ الأشقياء ذريعة إلى إهدار الدماء {cite:al-hurriyya-fi-al-islam-azhar p. 91} {cite:al-hurriyya-fi-al-islam-azhar p. 92}. ويذكر أن الصحابة اتفقوا على قتل الجماعة بالواحد، وأن عمر بن الخطاب قتل سبعة من أهل صنعاء بواحد، مع أن القصاص يقتضي المساواة {cite:al-hurriyya-fi-al-islam-azhar p. 92}. وفي القتل العمد تؤخذ الدية من مال القاتل مع تعزيره، وفي الخطأ تتحملها العاقلة من قرابته تخفيفًا عن المصاب، لا عقوبة على ذنب غيره {cite:al-hurriyya-fi-al-islam-azhar p. 93}."
  en: "Muhammad al-Khidr Husayn treats the sanctity of life as part of freedom. He likens the community to one body, so that shedding one person's blood is like opening a vein, and retaliation (qisas) is like a physician's lancet that stops corrupt blood from spreading to the other limbs (p. 91). He says qisas stops people shedding blood and saves the life of someone who might otherwise be killed in a feud, and that the rules were built on caution so that wrongdoers find no pretext to waste blood (pp. 91-92). He reports that the Companions agreed to execute a group for one killing, and that Umar executed seven men of Sana'a for one (p. 92). For deliberate killing the blood money is taken from the killer's property, and for accidental killing the kin bear it as relief for the victims' family, not as punishment for another's fault (p. 93)."
