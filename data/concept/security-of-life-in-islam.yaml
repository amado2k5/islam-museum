id: concept/security-of-life-in-islam
class: concept
kind: legal
label:
  ar: "الحرية في الدماء"
  en: "Security of life in Islam"
  es: "Seguridad de la vida en el Islam"
  fr: "La sécurité de la vie en islam"
  ur: "اسلام میں زندگی کی حفاظت"
summary:
  ar: "يعرض محمد الخضر حسين حرمة الدم بوصفها جزءًا من الحرية، فيشبّه الأمة بجسد واحد، وسفك دم الفرد فيها بفصد عرق، ويرى القصاص من القاتل كفصد الطبيب الذي يمنع فساد الدم أن يسري إلى سائر الأعضاء {cite:al-hurriyya-fi-al-islam-azhar p. 91}. ويقول إن القصاص يكف الناس عن إراقة الدماء، ويحفظ حياة من كان سيُقتل انتقامًا لغيره، وإن الأحكام بُنيت على الاحتياط حتى لا يتخذ الأشقياء ذريعة إلى إهدار الدماء {cite:al-hurriyya-fi-al-islam-azhar p. 91} {cite:al-hurriyya-fi-al-islam-azhar p. 92}. ويذكر أن الصحابة اتفقوا على قتل الجماعة بالواحد، وأن عمر بن الخطاب قتل سبعة من أهل صنعاء بواحد، مع أن القصاص يقتضي المساواة {cite:al-hurriyya-fi-al-islam-azhar p. 92}. وفي القتل العمد تؤخذ الدية من مال القاتل مع تعزيره، وفي الخطأ تتحملها العاقلة من قرابته تخفيفًا عن المصاب، لا عقوبة على ذنب غيره {cite:al-hurriyya-fi-al-islam-azhar p. 93}."
  en: "Muhammad al-Khidr Husayn treats the sanctity of life as part of freedom. He likens the community to one body, so that shedding one person's blood is like opening a vein, and retaliation (qisas) is like a physician's lancet that stops corrupt blood from spreading to the other limbs (p. 91). He says qisas stops people shedding blood and saves the life of someone who might otherwise be killed in a feud, and that the rules were built on caution so that wrongdoers find no pretext to waste blood (pp. 91-92). He reports that the Companions agreed to execute a group for one killing, and that Umar executed seven men of Sana'a for one (p. 92). For deliberate killing the blood money is taken from the killer's property, and for accidental killing the kin bear it as relief for the victims' family, not as punishment for another's fault (p. 93)."
  es: "Muhammad al-Khidr Husayn considera la santidad de la vida como parte de la libertad. Compara la comunidad con un solo cuerpo, de modo que derramar la sangre de una persona es como abrir una vena, y la represalia (qisas) es como la lanceta de un médico que impide que la sangre corrupta se extienda a otras extremidades (p. 91). Afirma que la qisas evita que la gente derrame sangre y salva la vida de alguien que de otro modo podría morir en una disputa, y que las normas se basaron en la cautela para que los malhechores no encuentren pretexto para desperdiciar sangre (pp. 91-92). Relata que los Compañeros acordaron ejecutar a un grupo por un asesinato, y que Umar ejecutó a siete hombres de Sana'a por uno (p. 92). Por un asesinato deliberado, la indemnización por la sangre se toma de los bienes del asesino, y por un asesinato accidental, los familiares la asumen como alivio para la familia de la víctima, no como castigo por la culpa de otro (p. 93)."
  fr: "Muhammad al-Khidr Husayn considère le caractère sacré de la vie comme une composante de la liberté. Il compare la communauté à un seul corps, de sorte que verser le sang d'une personne équivaut à ouvrir une veine, et la vengeance (qisas) à la lancette d'un médecin qui empêche le sang corrompu de se répandre aux autres membres (p. 91). Il affirme que la qisas empêche les effusions de sang et sauve la vie de celui qui, autrement, pourrait être tué dans une querelle, et que les règles ont été fondées sur la prudence afin que les malfaiteurs ne trouvent aucun prétexte pour verser inutilement du sang (pp. 91-92). Il rapporte que les Compagnons s'étaient mis d'accord pour exécuter un groupe pour un seul meurtre, et qu'Umar a exécuté sept hommes de Sanaa pour un seul (p. 92). En cas de meurtre délibéré, le prix du sang est prélevé sur les biens du meurtrier, et en cas de meurtre accidentel, la famille le supporte comme un soulagement pour la famille de la victime, et non comme une punition pour la faute d'autrui (p. 93)."
  ur: "محمد الخضر حسین زندگی کے تقدس کو آزادی کا حصہ سمجھتے ہیں۔ وہ برادری کو ایک جسم سے تشبیہ دیتا ہے، اس لیے کہ ایک شخص کا خون بہانا ایک رگ کھولنے کے مترادف ہے، اور قصاص ⁦(قصاص)⁩ ایک طبیب کے نشتر کی طرح ہے جو خراب خون کو دوسرے اعضاء میں پھیلنے سے روکتا ہے ⁦(ص 91)⁩۔ وہ کہتا ہے کہ قصاص لوگوں کو خون بہانے سے روکتا ہے اور کسی ایسے شخص کی جان بچاتا ہے جو بصورت دیگر جھگڑے میں مارا جا سکتا ہے، اور یہ کہ قوانین احتیاط پر بنائے گئے تھے تاکہ ظالموں کو خون ضائع کرنے کا کوئی بہانہ نہ ملے ⁦(صفحہ 91-92)⁩۔ وہ بیان کرتے ہیں کہ صحابہ کرام نے ایک قتل کے بدلے ایک گروہ کو قتل کرنے پر اتفاق کیا اور عمر نے صنعاء کے سات آدمیوں کو ایک کے بدلے میں قتل کیا ⁦(ص 92)⁩۔ جان بوجھ کر قتل کرنے کے لیے خون کی رقم قاتل کی جائیداد سے لی جاتی ہے، اور حادثاتی طور پر قتل کرنے پر رشتہ دار اسے مقتول کے خاندان کے لیے امداد کے طور پر برداشت کرتے ہیں، نہ کہ دوسرے کی غلطی کی سزا کے طور پر ⁦(ص 93)⁩۔"
