label:
  ar: "العِشْرة"
  en: "Marital companionship and the rights of spouses (ishra)"
  ur: "عشرت (ازدواجی رفاقت)"
summary:
  ar: "العشرة في اللغة الاجتماع والمخالطة، والعشير القريب والصديق، وعشير المرأة زوجها، وفي الاصطلاح ما يكون بين الزوجين من الألفة والانضمام {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11626}. ويرى الحنفية والحنابلة أن معاشرة الزوجين بالمعروف مندوبة، وذهب المالكية إلى وجوبها ديانة لا قضاء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11627}. ومعنى المعاشرة بالمعروف أداء الحقوق كاملة مع حسن الخلق {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11627} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11628}. ومن حقوق الزوج على زوجته تسليم نفسها، والطاعة في غير معصية، والاستمتاع، وأن تتزين وتتنظف بما يمكنه من الاستمتاع، وألا تأذن في بيته لمن يكره، وألا تخرج إلا بإذنه، وذهب الجمهور إلى أنها لا تجب عليها الخدمة، وذهب الحنفية إلى وجوبها ديانة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11629} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11630} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11631} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11632} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11633}. ومن حقوق الزوجة المهر والنفقة وإعفافها بالوطء، وأن يبيت عندها أو يقسم بينها إن كان متزوجاً بأكثر من واحدة، واختلف الفقهاء في وجوب بعض هذه الحقوق {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11633} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11634} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11635} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11636}. والمشترك بين الزوجين المعاشرة بالمعروف والاستمتاع والإرث {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11636} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11637}."
  en: "In the lexicon, ishra is companionship and mingling; ashir is a near kinsman or friend, and a wife's ashir is her husband. As a term it is the affection and union between spouses {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11626}. The Hanafis and Hanbalis hold that spouses' good companionship is recommended, while the Malikis hold it obligatory in conscience but not enforceable in court {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11627}. Good companionship means fulfilling each one's rights in full with good conduct {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11627} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11628}. The husband's rights include the wife's surrender of herself for intercourse, her obedience in what is not sinful, the enjoyment of her, her cleanliness and grooming, her not admitting unwanted guests or leaving the house without his leave; the majority hold that service is not obligatory on her, while the Hanafis hold it obligatory in conscience {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11629} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11630} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11631} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11632} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11633}. The wife's rights include the dower, maintenance, the husband's intercourse with her, and night-sharing or equal division where he has more than one wife, on which the jurists differ in detail {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11633} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11634} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11635} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11636}. Companionship, enjoyment and inheritance are shared rights {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11636} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11637}."
