  en: "Orphan (yatim, fiqh)"
summary:
  ar: "اليتيم في الاصطلاح من مات أبوه وهو دون البلوغ. وأحكامه في الفقه: الإحسان إليه، وتعليمه، وتصرفات الوصي في ماله، والإنفاق عليه من ماله أو من قرابته أو من بيت المال، ورجوع الوصي بما أنفقه، وأخذ الوصي الأجرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17968}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17970}"
  en: "The orphan, in law, is one whose father has died while still below puberty. The rulings cover kindness to him, his teaching, the guardian's dealings with his property, his maintenance from his property, from relatives or from the treasury, the guardian's claim for what he spent, and the guardian's fee. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17968}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17970}"
  ur: "یتیم اصطلاحاً وہ ہے جس کا باپ بلوغ سے پہلے وفات پا جائے۔ اس کے احکام میں حسنِ سلوک، تعلیم، وصی کے تصرفات، نفقہ اور وصی کے خرچ کی واپسی شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17968}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17970}"
