id: concept/firar
class: concept
kind: term
label: { ar: "الفرار إلى الله", en: "Fleeing to God (firar)", ur: "اللہ کی طرف فرار", es: "Huyendo a Dios (firar)", fr: "Fuir vers Dieu (firar)", tr: "Tanrı'ya Uçuş", id: "Flight to God" }
summary:
  ar: "المنزلة العاشرة من منازل السالكين في مدارج السالكين لابن قيم الجوزية، مأخوذة من آية الذاريات؛ حقيقتها الهرب من شيء إلى شيء، وهي فرار السعداء إلى الله وفرار الأشقياء منه، ويشرح ابن القيم درجاتها الثلاث عند الهروي: فرار العامة من الجهل والكسل والضيق، وفرار الخاصة من الخبر إلى الشهود ومن الرسوم إلى الأصول ومن الحظوظ إلى التجريد، وفرار خاصة الخاصة الذي يخالفه في جعله غاية."
  en: "The tenth of the wayfarers' stations in Ibn Qayyim al-Jawziyya's Madarij al-Salikin, taken from the verse of al-Dhariyat. Its reality is escaping from one thing to another – the fleeing of the blessed to God and of the wretched away from Him. Ibn al-Qayyim explains al-Harawi's three degrees: the common people's flight from ignorance, laziness and constriction; the elite's flight from report to witnessing, from outward forms to roots and from self-interest to detachment; and the flight of the elite of the elite, which he does not accept as the highest goal."
  ur: "ابن قیم الجوزیہ کی مدارج السالکین میں سالکین کی دسویں منزل، جو سورۃ الذاریات کی آیت سے ماخوذ ہے۔ اس کی حقیقت ایک چیز سے دوسری چیز کی طرف بھاگنا ہے – سعادت مندوں کا اللہ کی طرف بھاگنا اور بدبختوں کا اس سے دور بھاگنا۔ ابن القیم ہروی کے تین درجوں کی شرح کرتے ہیں: عوام کا جہالت، سستی اور تنگی سے فرار؛ خواص کا خبر سے شہود، ظاہری رسوم سے اصول اور حظوظ سے تجرید کی طرف فرار؛ اور خاص الخاص کا فرار، جسے وہ سب سے اونچی غایت تسلیم نہیں کرتے۔"
  es: "La décima de las estaciones del viajero en el Madarij al-Salikin de Ibn Qayyim al-Jawziyya, tomada del versículo de al-Dhariyat. Su esencia es escapar de una cosa a otra: la huida de los bienaventurados hacia Dios y la de los desdichados lejos de Él. Ibn al-Qayyim explica los tres grados de al-Harawi: la huida del pueblo llano de la ignorancia, la pereza y la opresión; la huida de la élite del informe al testimonio, de las formas externas a las raíces y del interés propio al desapego; y la huida de la élite de la élite, que él no acepta como la meta más elevada."
  fr: "La dixième étape du cheminement, selon Ibn Qayyim al-Jawziyya dans son ouvrage Madarij al-Salikin, est tirée du verset d'al-Dhariyat. Elle consiste à passer d'une chose à une autre: le passage des bienheureux vers Dieu et celui des damnés loin de Lui. Ibn al-Qayyim explique les trois degrés d'al-Harawi: la fuite du peuple face à l'ignorance, la paresse et l'asservissement; la fuite de l'élite du récit au témoignage, des apparences à l'essence et de l'intérêt personnel au détachement; et la fuite de l'élite de l'élite, qu'il ne considère pas comme le but suprême."
  tr: "İbn Kayyim al-Jawziyyah'ın Madarij al-Salikin'deki Arayıcıların onuncu durağı, Adh-Dhariyat'ın dizesinden alınmıştır; gerçekliği bir şeyden diğerine kaçmaktır; bu da şanslıların Allah'a kaçışı ve zavallıların O'ndan kaçışıdır. İbn al-Qayyim, bu üç düzeyi el-Harawi'ye göre açıklar: sıradan halkın cehaletten, tembellikten ve sıkıntıdan kaçışı; seçkinlerin haberlerden tanıklara; çizimlerden ilkere; ve talihlerden soyutlamaya; elitin cehaletten, tembellikten ve sıkıntıdan kaçışı; elitin bilgiden tanıklara; çizimlerden ilkelere kaçışı; ve seçkinlerin elitten kaçışı, ki bunu bir son haline getirmekle karşı çıkar."
  id: "Stasiun kesepuluh Para Pencari dalam Madarij al-Salikin oleh Ibn Qayyim al-Jawziyyah diambil dari ayat Adh-Dhariyat; kenyataannya adalah melarikan diri dari satu hal ke hal lain, yaitu pelarian orang yang beruntung kepada Tuhan dan pelarian orang malang dari-Nya. Ibn al-Qayyim menjelaskan tiga tingkatnya menurut al-Harawi: pelarian rakyat biasa dari kebodohan, kemalasan, dan kesusahan; pelarian elit dari berita menjadi saksi; dari gambar ke prinsip; dan dari keberuntungan ke abstraksi; dan pelarian elit dari kebodohan, kemalasan, dan kesusahan; pelarian elit dari pengetahuan menjadi saksi; dari gambar ke prinsip; dan pelarian elit dari elit, yang ia lawan dalam menjadikannya akhir."
