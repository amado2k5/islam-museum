id: concept/firar
class: concept
kind: term
label: { ar: "الفرار إلى الله", en: "Fleeing to God (firar)", ur: "اللہ کی طرف فرار" }
summary:
  ar: "المنزلة العاشرة من منازل السالكين في مدارج السالكين لابن قيم الجوزية، مأخوذة من آية الذاريات؛ حقيقتها الهرب من شيء إلى شيء، وهي فرار السعداء إلى الله وفرار الأشقياء منه، ويشرح ابن القيم درجاتها الثلاث عند الهروي: فرار العامة من الجهل والكسل والضيق، وفرار الخاصة من الخبر إلى الشهود ومن الرسوم إلى الأصول ومن الحظوظ إلى التجريد، وفرار خاصة الخاصة الذي يخالفه في جعله غاية."
  en: "The tenth of the wayfarers' stations in Ibn Qayyim al-Jawziyya's Madarij al-Salikin, taken from the verse of al-Dhariyat. Its reality is escaping from one thing to another – the fleeing of the blessed to God and of the wretched away from Him. Ibn al-Qayyim explains al-Harawi's three degrees: the common people's flight from ignorance, laziness and constriction; the elite's flight from report to witnessing, from outward forms to roots and from self-interest to detachment; and the flight of the elite of the elite, which he does not accept as the highest goal."
  ur: "ابن قیم الجوزیہ کی مدارج السالکین میں سالکین کی دسویں منزل، جو سورۃ الذاریات کی آیت سے ماخوذ ہے۔ اس کی حقیقت ایک چیز سے دوسری چیز کی طرف بھاگنا ہے – سعادت مندوں کا اللہ کی طرف بھاگنا اور بدبختوں کا اس سے دور بھاگنا۔ ابن القیم ہروی کے تین درجوں کی شرح کرتے ہیں: عوام کا جہالت، سستی اور تنگی سے فرار؛ خواص کا خبر سے شہود، ظاہری رسوم سے اصول اور حظوظ سے تجرید کی طرف فرار؛ اور خاص الخاص کا فرار، جسے وہ سب سے اونچی غایت تسلیم نہیں کرتے۔"
