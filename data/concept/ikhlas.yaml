id: concept/ikhlas
class: concept
kind: ethical
label: { ar: "الإخلاص", en: "Sincerity (ikhlas)", ur: "اخلاص", es: "Sinceridad", fr: "Sincérité", tr: "Samimiyet", id: "Ketulusan" }
summary:
  ar: "تخليص العمل من كل شائبة حتى لا يبقى فيه باعث سوى التقرب إلى الله، كما يعرّفه الغزالي في كتاب النية والإخلاص والصدق من إحياء علوم الدين، ويرتب الآفات التي تكدّره من الرياء الجلي إلى أخفى خطرات النفس {cite:ihya-shamela-dar-al-marifa p. 8137} {cite:ihya-shamela-dar-al-marifa p. 8148}. ويضع النووي في أول رياض الصالحين باب الإخلاص وإحضار النية في جميع الأعمال والأقوال والأحوال البارزة والخفية، ويستهلّه بحديث «إنما الأعمال بالنيات» المتفق عليه، ثم يجمع فيه أحاديث تردّ الأعمال إلى القصد: فمن همّ بحسنة فلم يعملها كُتبت له حسنة كاملة، ومن همّ بسيئة فلم يعملها كُتبت له حسنة، والرجال الثلاثة الذين نجّاهم الله من الصخرة دعوا «ابتغاء وجهك» في أعمالهم الصالحة {cite:riyad-salihin p.5}{cite:riyad-salihin p.8}"
  en: "Freeing an act of every admixture so that no motive remains in it but drawing near to God, as al-Ghazali defines it in the Book of Intention, Sincerity and Truthfulness of the Ihya', ranking the flaws that cloud it from open showing off to the most hidden stirrings of the self {cite:ihya-shamela-dar-al-marifa p. 8137} {cite:ihya-shamela-dar-al-marifa p. 8148}. Al-Nawawi places at the head of Riyad al-Salihin a chapter on sincerity and presence of intention in all outward and hidden works, words and states, opening it with the agreed-upon hadith that actions are but by intentions, then gathering hadiths returning deeds to intent: whoever intends a good deed without doing it has a full good deed written for him, whoever intends an evil without doing it has a good deed written, and the three men God saved from the rock prayed 'seeking Your face' for their righteous deeds {cite:riyad-salihin p.5}{cite:riyad-salihin p.8}"
  ur: "عمل کو ہر آمیزش سے پاک کرنا یہاں تک کہ اس میں اللہ کے قرب کے سوا کوئی محرک باقی نہ رہے، جیسا کہ غزالی احیاء کی کتاب النیۃ والاخلاص والصدق میں اس کی تعریف کرتے ہیں اور اسے مکدر کرنے والی آفات کو کھلی ریا سے لے کر نفس کے پوشیدہ ترین خیالات تک درجہ بدرجہ بیان کرتے ہیں {cite:ihya-shamela-dar-al-marifa p. 8137} {cite:ihya-shamela-dar-al-marifa p. 8148}۔"
  es: "Liberar un acto de toda mezcla para que no quede en él otro motivo que no sea acercarse a Dios, como lo define al-Ghazali en el Libro de la Intención, la Sinceridad y la Veracidad del Ihya', clasificando los defectos que lo empañan desde la ostentación abierta hasta los impulsos más ocultos del yo {cite:ihya-shamela-dar-al-marifa p. 8137} {cite:ihya-shamela-dar-al-marifa p. 8148}. Al-Nawawi coloca al comienzo de Riyad al-Salihin un capítulo sobre la sinceridad y la presencia de la intención en todas las obras, palabras y estados, tanto externos como ocultos, comenzando con el hadiz consensuado de que las acciones se basan únicamente en las intenciones, y luego recopila hadices que vinculan las obras con la intención: quien tiene la intención de hacer una buena acción sin realizarla, se le escribe una buena acción completa; quien tiene la intención de hacer una mala acción sin realizarla, se le escribe una buena acción; y los tres hombres que Dios salvó de la roca oraron \"buscando Tu rostro\" por sus buenas obras {cite:riyad-salihin p.5}{cite:riyad-salihin p.8}"
  fr: "Libérer un acte de tout mélange afin qu'il ne reste d'autre motif que celui de se rapprocher de Dieu, comme le définit al-Ghazali dans le Livre de l'Intention, de la Sincérité et de la Vérité de l'Ihya', classant les défauts qui l'obscurcissent, de la démonstration ouverte aux élans les plus cachés du moi {cite:ihya-shamela-dar-al-marifa p. 8137} {cite:ihya-shamela-dar-al-marifa p. 8148}. Al-Nawawi place en tête de Riyad al-Salihin un chapitre sur la sincérité et la présence de l'intention dans tous les actes, paroles et états, tant extérieurs qu'intérieurs. Il l'ouvre sur le hadith consensuel selon lequel les actions ne sont que le fruit des intentions, puis rassemble des hadiths qui rattachent les actes à l'intention: quiconque a l'intention d'accomplir une bonne action sans la réaliser, une bonne action est inscrite pour lui; quiconque a l'intention de commettre un mal sans le réaliser, une bonne action est inscrite pour lui; et les trois hommes que Dieu a sauvés du rocher ont prié « T'implorant » pour leurs bonnes actions. {cite:riyad-salihin p.5}{cite:riyad-salihin p.8}"
  tr: "Eylemi her türlü kirlilikten arındırır ki, içinde sadece Allah'a yaklaşmak kalsın; bu, El-Gazali'nin 'Din Bilimlerini Canlandırmak' adlı kitabında tanımladığı gibi. Kendisini rahatsız eden sıkıntıları, açık ikiyüzlülükten ruhun en gizli tehlikelerine kadar ayarlar {cite:ihya-şamela-dar-al-marifa s. 8137} {cite:ihya-şamela-dar-al-marifa s. 8148}. El-Nevavi, Riyad el-Salihin'in başına, samimiyet ve tüm eylemlere, sözlere ve hem belirgin hem gizli durumlara niyet getirme bölümü koyar. Üzerinde anlaşılmış hadis \"Eylem sadece niyettir\" ile başlar, ardından eylemleri amaca döndüren hadisler derler: \"Kim iyiyse ve yapmazsa, onun için tam bir iyi iş kaydedilir; ve kim kötü bir iş yaparsa yapmazsa, onun için iyi bir iş kaydedilir.\" Allah'ın kayadan kurtardığı üç adam, doğru işlerinde \"Senin yüzünü aramaya\" çağırdı {cite:riyad-salihin s.5}{cite:riyad-salihin s.8}"
  id: "Memurnikan perbuatan dari setiap ketidakmurnian sehingga tidak ada yang tersisa kecuali mendekatkan diri kepada Allah, seperti yang didefinisikan Al-Ghazali dalam buku 'Niat dan Kesungguhan dan Kebenaran dari Menghidupkan Kembali Ilmu Agama.' Ia mengatur penderitaan yang menimpanya, mulai dari kemunafikan yang jelas hingga bahaya jiwa yang paling tersembunyi {cite:ihya-shamela-dar-al-marifa hlm. 8137} {cite:ihya-shamela-dar-al-marifa hlm. 8148}. Al-Nawawi menempatkan di awal Riyad al-Salihin, bab tentang ketulusan dan membawa niat ke dalam setiap tindakan, kata-kata, serta keadaan yang menonjol maupun tersembunyi. Ia memulai dengan hadits yang disepakati \"Perbuatan hanyalah dengan niat,\" lalu menyusun hadits yang mengembalikan perbuatan menjadi tujuan: \"Siapa yang baik dan tidak melakukannya, perbuatan baik sepenuhnya dicatat untuknya; dan siapa yang berbuat jahat dan tidak melakukannya, perbuatan baik dicatat untuknya.\" Tiga orang yang diselamatkan Allah dari batu itu memanggil \"mencari wajah-Mu\" dalam perbuatan benar mereka {cite:riyad-salihin hlm.5}{cite:riyad-salihin hlm.8}"
