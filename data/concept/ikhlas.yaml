id: concept/ikhlas
class: concept
kind: doctrine
label:
  ar: "الإخلاص في العمل"
  en: "Sincerity of purpose (ikhlas)"
summary:
  ar: "يرى الشعراوي أن الإخلاص أن يكون العمل لله وحده، وأن الأعمال الظاهرة الواحدة تختلف ثوابها بحسب القصد، وأن النية وحدها لا تكفي دون عمل، وأن العمل ينفع الناس بظاهره، أما الثواب فعلى النية الخالصة. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.615}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.617}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.618}"
  en: "Sha'rawi holds that sincerity is doing the act for God alone, that one outward act can carry different reward according to its purpose, that intention alone is not enough without action, and that the act benefits people by its outward form while reward follows the sincere intention {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.615}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.617}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.618}."
wings: [ideas]
themes: [creed, spirituality-and-sufism, worship-and-the-pillars]
periods: [period/prophetic-era]
regions: [global]
issue:
  ar: "هل يكفي الإخلاص في القلب دون عمل، وهل يُثاب من أتى بعمل نافع لغير وجه الله؟"
  en: "Is sincerity of heart enough without action, and is someone who does a beneficial deed for other than God's sake rewarded?"
perspectives:
  - tradition: sunni
    id: sharawi-sincerity-intention
    stance:
      ar: "الإخلاص شرط الثواب، والعمل مع النية، ولا يكفي القلب وحده"
      en: "Sincerity is the condition of reward; the deed must accompany the intention, and the heart alone is not enough"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقول الشعراوي إن الإخلاص لا يكفي بالنية وحدها بل بالنية مع العمل، وإن ما يُنتفع به من العمل ينال الناس منه نفعه، وإن الثواب على النية الخالصة لا على العمل المجرد، ويمثل بمن بنى عمارة فانتفع بها الكثيرون، وبمن كفر فعمل نافعاً لغير الله فلا جزاء له عنده في تقديره. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.617}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.618}"
      en: "Sha'rawi says sincerity is not intention alone but intention with action, that people benefit from the deed whatever the doer intended, and that reward follows the sincere intention, not the bare deed. He gives the example of someone who builds a house that many benefit from, and in his reading a disbeliever whose useful deed is not done for God has no reward with God {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.617}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.618}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
  - tradition: sunni
    id: scope-note-other-readings
    stance:
      ar: "أقوال المفسرين والفقهاء في عمل غير المؤمن لم تُدخل من مصدر مراجَع في هذه الدفعة"
      en: "Jurists' and exegetes' views on the deeds of a non-believer are not entered from a checked source in this batch"
    holders: []
    summary:
      ar: "لم يُدخل هنا خلاف الفقهاء والمفسرين في ثواب عمل غير المؤمن في الدنيا، ولا الرأي الأكاديمي، ولا الآراء الأخرى. قول الشعراوي في الكافر هنا رأيه وحده. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.618}"
      en: "The jurists' and exegetes' disagreement over the reward of a non-believer's deeds in this world, the academic view and other views are not entered here. Sha'rawi's words on the disbeliever are his view alone {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.618}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
