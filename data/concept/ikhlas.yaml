id: concept/ikhlas
class: concept
kind: ethical
label: { ar: "الإخلاص", en: "Sincerity (ikhlas)", ur: "اخلاص" }
summary:
  ar: "تخليص العمل من كل شائبة حتى لا يبقى فيه باعث سوى التقرب إلى الله، كما يعرّفه الغزالي في كتاب النية والإخلاص والصدق من إحياء علوم الدين، ويرتب الآفات التي تكدّره من الرياء الجلي إلى أخفى خطرات النفس {cite:ihya-shamela-dar-al-marifa p. 8137} {cite:ihya-shamela-dar-al-marifa p. 8148}."
  en: "Freeing an act of every admixture so that no motive remains in it but drawing near to God, as al-Ghazali defines it in the Book of Intention, Sincerity and Truthfulness of the Ihya', ranking the flaws that cloud it from open showing off to the most hidden stirrings of the self {cite:ihya-shamela-dar-al-marifa p. 8137} {cite:ihya-shamela-dar-al-marifa p. 8148}."
  ur: "عمل کو ہر آمیزش سے پاک کرنا یہاں تک کہ اس میں اللہ کے قرب کے سوا کوئی محرک باقی نہ رہے، جیسا کہ غزالی احیاء کی کتاب النیۃ والاخلاص والصدق میں اس کی تعریف کرتے ہیں اور اسے مکدر کرنے والی آفات کو کھلی ریا سے لے کر نفس کے پوشیدہ ترین خیالات تک درجہ بدرجہ بیان کرتے ہیں {cite:ihya-shamela-dar-al-marifa p. 8137} {cite:ihya-shamela-dar-al-marifa p. 8148}۔"
wings: [ideas]
themes: [spirituality-and-sufism, ethics-and-character]
periods: [period/buyid-seljuk-fatimid-era]
regions: [global]
issue:
  ar: "هل يُثاب العمل الذي اختلط فيه قصد التقرب بباعث نفسي أو برياء؟"
  en: "Is an act rewarded when the intention to draw near to God is mixed with a selfish motive or with showing off?"
  ur: "کیا وہ عمل باعثِ ثواب ہے جس میں اللہ کے قرب کی نیت کے ساتھ نفسانی محرک یا ریا مل گئی ہو؟"
perspectives:
  - tradition: sunni
    id: ghazali-strength-of-motive
    standing: main
    stance:
      ar: "الحكم بقدر قوة الباعث: إن تساوى الباعثان تساقطا، وإن غلب الرياء أضرّ، وإن غلب قصد التقرب أُثيب بقدر الزيادة"
      en: "The verdict follows the strength of the motive: equal motives cancel out, a dominant showing off harms, a dominant intention of nearness earns reward in proportion to its excess"
      ur: "حکم محرک کی قوت کے مطابق ہے: برابر محرکات ایک دوسرے کو ساقط کرتے ہیں، ریا غالب ہو تو نقصان دہ، اور قرب کی نیت غالب ہو تو زائد مقدار کے برابر ثواب"
    summary:
      ar: "يذكر الغزالي أن ظاهر الأخبار يدل على أن العمل المشوب لا ثواب له وأن الأخبار لا تخلو من تعارض، ثم يقرر بحسب ما «ينقدح» له أن العبرة بقوة الباعث، ويستدل بأن مثقال الذرة من الخير والشر لا يضيع."
      en: "Al-Ghazali notes that the outward sense of the reports is that a mixed act has no reward and that the reports are not free of conflict, then states what 'occurs' to him: what counts is the strength of the motive, arguing that not an atom's weight of good or evil is lost."
      ur: "غزالی بیان کرتے ہیں کہ روایات کا ظاہر یہ بتاتا ہے کہ ملے جلے عمل پر ثواب نہیں اور روایات تعارض سے خالی نہیں، پھر اپنی سمجھ کے مطابق طے کرتے ہیں کہ اعتبار محرک کی قوت کا ہے، اس دلیل سے کہ ذرہ برابر خیر و شر ضائع نہیں ہوتا۔"
