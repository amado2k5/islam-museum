issue:
  ar: "أيهما أفضل: الفقير الصابر أم الغني الشاكر؟"
  en: "Which is better: the patient poor man or the grateful rich man?"
  ur: "کون افضل ہے: صابر فقیر یا شاکر غنی؟"
sensitivity: contested
perspectives:
  - tradition: sunni
    id: junayd-poverty-better
    standing: main
    stance:
      ar: "الفقر أفضل: قول الجنيد والخواص والأكثرين كما ينقله الغزالي"
      en: "Poverty is better: the view of al-Junayd, al-Khawwas and most, as al-Ghazali reports"
      ur: "فقر افضل ہے: جنید، خواص اور اکثر کا قول، جیسا کہ غزالی نقل کرتے ہیں"
    summary:
      ar: "ينقل الغزالي أن الجنيد والخواص والأكثرين ذهبوا إلى تفضيل الفقر، ويقال إن الجنيد دعا على ابن عطاء لمخالفته فأصابته محنة."
      en: "Al-Ghazali reports that al-Junayd, al-Khawwas and most held poverty to be better; it is said al-Junayd invoked against Ibn 'Ata' for differing with him and that a trial befell him."
      ur: "غزالی نقل کرتے ہیں کہ جنید، خواص اور اکثر نے فقر کو افضل کہا؛ اور کہا جاتا ہے کہ جنید نے ابن عطاء کی مخالفت پر ان کے خلاف دعا کی اور وہ آزمائش میں پڑے۔"
    holders: [person/al-junayd-ibn-muhammad, person/ibrahim-al-khawwas]
    evidence:
      - ref: source/ihya-shamela-dar-al-marifa
        note: { ar: "ص 7240 ⁦(بيان فضيلة الفقر على الغنى)⁩", en: "p. 7240 (on the merit of poverty over wealth)" }
    sources: [source/ihya-shamela-dar-al-marifa]
  - tradition: sunni
    id: ibn-ata-grateful-rich
    standing: main
    stance:
      ar: "الغني الشاكر القائم بحقه أفضل: قول ابن عطاء كما ينقله الغزالي"
      en: "The grateful rich man who fulfils its due is better: the view of Ibn 'Ata' as al-Ghazali reports it"
      ur: "اپنے حق کو ادا کرنے والا شاکر غنی افضل ہے: ابن عطاء کا قول، جیسا کہ غزالی نقل کرتے ہیں"
    summary:
      ar: "ينقل الغزالي عن ابن عطاء أن الغني الشاكر أفضل من الفقير الصابر، وأنه احتج بأن الغنى وصف الحق، وبحديث الفقراء الذين شكوا سبق الأغنياء بالصدقات."
      en: "Al-Ghazali reports Ibn 'Ata' as holding the grateful rich superior to the patient poor, arguing that wealth (ghina) is an attribute of God, and citing the hadith of the poor who complained that the rich outstripped them in charity."
      ur: "غزالی ابن عطاء سے نقل کرتے ہیں کہ شاکر غنی صابر فقیر سے افضل ہے، اس دلیل سے کہ غنا حق تعالیٰ کی صفت ہے، اور ان فقرا کی حدیث سے جنہوں نے شکایت کی کہ اغنیا صدقات میں آگے بڑھ گئے۔"
    evidence:
      - ref: source/ihya-shamela-dar-al-marifa
        note: { ar: "ص 7240-7242", en: "pp. 7240-7242" }
    sources: [source/ihya-shamela-dar-al-marifa]
  - tradition: sunni
    id: ghazali-detail
    standing: main
    stance:
      ar: "التفصيل: لا يُطلب الفقر ولا يُذم الغنى لعينه، بل بحسب ما يشغل عن الله؛ والفقير أبعد عن الخطر في حق عامة الناس"
      en: "It depends: neither poverty nor wealth is sought or blamed for itself but according to what distracts from God; for most people the poor man is further from danger"
      ur: "تفصیل: نہ فقر فی نفسہ مطلوب ہے نہ غنا فی نفسہ مذموم، بلکہ یہ دیکھا جائے کہ کیا اللہ سے غافل کرتا ہے؛ عام لوگوں کے حق میں فقیر خطرے سے زیادہ دور ہے"
    summary:
      ar: "يرى الغزالي أن كلام الفريقين تعلّق بعمومات وكلمات «قاصرة»، وأن المال لا يُذم لعينه بل لأنه عائق، وأن من الأغنياء من لم يشغله غناه كسليمان وعثمان وعبد الرحمن بن عوف، لكن فتنة السراء أشد من فتنة الضراء، ولذلك ذم الشرع الغنى ومدح الفقر لأن خطابه للكل لا للنادر."
      en: "Al-Ghazali holds that both sides relied on general statements and 'deficient' words; wealth is blamed not for itself but as an obstacle; some rich men, such as Solomon, Uthman and Abd al-Rahman ibn Awf, were not distracted by it; but the trial of ease is harder than the trial of hardship, which is why the law, addressing everyone and not the rare exception, censured wealth and praised poverty."
      ur: "غزالی کی رائے ہے کہ دونوں فریقوں نے عمومات اور «ناقص» باتوں پر انحصار کیا؛ مال فی نفسہ نہیں بلکہ رکاوٹ ہونے کی وجہ سے مذموم ہے؛ بعض مالداروں کو، جیسے سلیمان، عثمان اور عبد الرحمن بن عوف، ان کی دولت نے غافل نہ کیا؛ مگر خوشحالی کی آزمائش تنگی کی آزمائش سے سخت ہے، اسی لیے شریعت نے، جس کا خطاب سب سے ہے نہ کہ نادر سے، غنا کی مذمت اور فقر کی تعریف کی۔"
    holders: [person/al-ghazali-abu-hamid]
