id: concept/faqr
class: concept
kind: ethical
label: { ar: "الفقر ⁦(في التصوف)⁩", en: "Poverty (faqr) in Sufi ethics", ur: "فقر ⁦(تصوف میں)⁩" }
summary:
  ar: "الفقر عند الغزالي «فقد ما هو محتاج إليه»، وكل موجود سوى الله فقير بهذا المعنى؛ لكنه يقصد في كتاب الفقر والزهد من إحياء علوم الدين الفقر من المال، ويميز فيه خمسة أحوال: الزاهد والراضي والقانع والحريص والمضطر، وفوقها حال «المستغني» الذي يستوي عنده وجود المال وفقده {cite:ihya-shamela-dar-al-marifa p. 7184} {cite:ihya-shamela-dar-al-marifa p. 7186} {cite:ihya-shamela-dar-al-marifa p. 7188}."
  en: "For al-Ghazali poverty is 'lacking what one needs', and in that sense everything other than God is poor; but in the Book of Poverty and Renunciation of the Ihya' he means poverty of wealth, distinguishing five states (the renunciant, the content, the satisfied, the covetous and the destitute) and above them the state of the 'self-sufficient' for whom having and lacking wealth are the same {cite:ihya-shamela-dar-al-marifa p. 7184} {cite:ihya-shamela-dar-al-marifa p. 7186} {cite:ihya-shamela-dar-al-marifa p. 7188}."
  ur: "غزالی کے نزدیک فقر «اس چیز کا نہ ہونا ہے جس کی ضرورت ہو»، اور اس معنی میں اللہ کے سوا ہر موجود فقیر ہے؛ مگر احیاء کی کتاب الفقر والزہد میں ان کی مراد مال کا فقر ہے، جس کے وہ پانچ احوال بتاتے ہیں: زاہد، راضی، قانع، حریص اور مضطر، اور ان سے اوپر «مستغنی» جس کے لیے مال کا ہونا اور نہ ہونا برابر ہے {cite:ihya-shamela-dar-al-marifa p. 7184} {cite:ihya-shamela-dar-al-marifa p. 7186} {cite:ihya-shamela-dar-al-marifa p. 7188}۔"
