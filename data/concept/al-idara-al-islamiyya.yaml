label:
  ar: "الإدارة الإسلامية"
  en: "Islamic management"
  ur: "اسلامی انتظامیہ"
summary:
  ar: "الإدارة الإسلامية كما يطرحها طارق السويدان: مشروع إعادة كتابة علم الإدارة على فلسفة التوحيد ومبدأ اتباع الرسول، بدل نقل التقسيمات الغربية وصبغها بالآيات؛ يكتب فيها ولم ينشرها بعد، ويستند إلى تصنيف أفعال الرسول عند محمد الأشقر."
  en: "Islamic management as Tareq al-Suwaidan frames it: a project to rewrite the science of management on the philosophy of tawhid and the principle of following the Prophet, rather than copying Western categories and colouring them with verses; he is writing it, unpublished so far, drawing on Muhammad al-Ashqar's classification of the Prophet's roles."
  ur: "اسلامی انتظامیہ جیسا کہ طارق السویدان پیش کرتے ہیں: علمِ انتظام کو توحید کے فلسفے اور اتباعِ رسول کے اصول پر ازسرنو لکھنے کا منصوبہ، بجائے مغربی تقسیمات کو آیات سے رنگنے کے؛ وہ اسے لکھ رہے ہیں، ابھی unpublished ہے، اور محمد الأشقر کی کتاب میں رسول کے کرداروں کی تقسیم سے استفادہ کرتے ہیں۔"
