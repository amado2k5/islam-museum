id: concept/canon-fatty-sediment
class: concept
kind: scientific
label:
  ar: "الرسوب الدسمي عند ابن سينا"
  en: "Greasy sediment in the Canon"
  fr: "Sédiment graisseux dans le Canon"
  ur: "چکنی تلچھٹ قانون میں"
  es: "Sedimentos grasientos en el cañón"
  tr: "İbn Sina'da Uykusuzluk"
  id: "Insomnia di Avicenna"
summary:
  ar: "يبين ابن سينا أن الرسوب الدسمي يدل على ذوبان الشحم والسمن واللحم، وأبلغه ما يشبه ماء الذهب، ويستدل على مبدئه من القلة والكثرة والمخالطة والتميز. {cite:canon-ibn-sina-print-v1 p.195}."
  en: "Ibn Sina says greasy sediment shows the melting of fat, flesh and body-butter, the most severe resembling liquid gold, and its source is judged from its quantity, mixing and separation. {cite:canon-ibn-sina-print-v1 p.195}."
  fr: "Ibn Sina y voit fonte de graisse, chair et beurre corporel, le plus grave ressemblant à l’or liquide ; quantité, mélange et séparation en indiqueraient l’origine. {cite:canon-ibn-sina-print-v1 p.195}."
  es: "Ibn Sina afirma que el sedimento graso muestra la fusión de grasa, carne y manteca corporal, siendo el caso más severo similar al oro líquido, y su origen se determina por su cantidad, mezcla y separación. {cite:canon-ibn-sina-print-v1 p.195}."
  ur: "ابن سینا کا کہنا ہے کہ چکنائی والی تلچھٹ چربی، گوشت اور جسم کے مکھن کے پگھلنے کو ظاہر کرتی ہے، یہ سب سے شدید مائع سونے سے مشابہت رکھتا ہے، اور اس کے ماخذ کا اندازہ اس کی مقدار، اختلاط اور علیحدگی سے کیا جاتا ہے۔ {حوالہ: کینن ابن سینا پرنٹ v1 صفحہ 195}۔"
  tr: "İbn Sina, 'dasmi'nin tortulmasının yağ, ghee ve etin çözünmesini, altın suyuna benzer bir şeye ulaştığını ve kökeninin kıtlık, bolluk, karışım ve farklılıkla gösterildiğini açıklar. {cite:canon-ibn-sina-print-v1 s.195}."
  id: "Ibn Sina menjelaskan bahwa sedimentasi 'dasmi' menunjukkan pelarutan lemak, ghee, dan daging, yang mencapai sesuatu yang mirip dengan air emas, dan asal-usulnya ditunjukkan oleh kelangkaan, kelimpahan, pencampuran, dan perbedaan. {cite:canon-ibn-sina-print-v1 hlm.195}."
