id: concept/gratitude-shukr
class: concept
kind: ethical
label:
  ar: "الشُّكْر"
  en: "Shukr (gratitude to God and to people: its meaning, its rulings, its virtue and its opposite)"
summary:
  ar: "الشكر اعتراف بالمعروف ونشره والثناء على فاعله، ويكون باللسان والقلب والجوارح، وشكر الله صرف النعم فيما يرضيه. وشكر الله واجب من حيث الجملة، والإكثار منه مستحب، وقد يقع على النعمة وعلى دفع النقمة وعند المكروهات بالصبر. وفضله ظاهر في القرآن والسنة، وضده كفران النعمة. ومن شكر الناس شكر الله، وشكر المنعم بالفعل أصل، فإن لم يقدر فبالثناء الحسن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10145} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10146} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10147} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10149} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10152} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10154}"
  en: "Shukr is the acknowledgement of a kindness, its spreading and praise of its doer. It is made by the tongue, the heart and the limbs; thanking God means using His favours in what pleases Him. Thanking God is obligatory in general, and much thanks is recommended. It applies to favours received, to the removal of harm, and to hardship borne with patience. Its virtue is clear in the Qur'an and the sunna, and its opposite is ingratitude. Whoever does not thank people does not thank God, and to repay a kindness in deed is the root of thanks; if one cannot, a good word is enough. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10145} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10146} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10147} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10149} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10152} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10154}"
