  fr: "Taraghiyun (l'arbre à chèvres)"
summary:
  ar: "نبات يكثر في كريت، صمغه يشبه الصمغ العربي وقوته جذابة؛ يذكر الكتاب أن شربه ينفع من تقطير البول ويفتت حصاة المثانة، وأن نوعه الآخر ينفع من قروح الأمعاء."
  en: "A plant of Crete with a gum like gum arabic and a drawing power; the book says drinking it helps painful urination and breaks bladder stone, and its other kind helps intestinal ulcers."
  ur: "کریٹ کا ایک پودا جس کا گوند گوند عربی جیسا ہے اور جس کی کھینچنے کی قوت ہے؛ کتاب کے مطابق اسے پینے سے پیشاب کی تکلیف میں فائدہ ہوتا ہے اور مثانے کی پتھری ٹوٹتی ہے، اور دوسری قسم آنتوں کے زخم میں مفید ہے۔"
  es: "Una planta de Creta con una goma similar a la goma arábiga y con poder de atracción; el libro dice que beberla ayuda a aliviar la micción dolorosa y a disolver los cálculos de la vejiga, y que su otro tipo ayuda con las úlceras intestinales."
  fr: "Une plante de Crète dont la gomme ressemble à la gomme arabique et possède des propriétés astringentes; le livre indique que sa consommation soulage les mictions douloureuses et dissout les calculs vésicaux, tandis qu’une autre variété est bénéfique pour les ulcères intestinaux."
