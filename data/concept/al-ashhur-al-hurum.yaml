id: concept/al-ashhur-al-hurum
class: concept
kind: social
label:
  ar: الأشهر الحُرم
  en: The sacred months
  fr: "Les mois sacrés"
  ur: الأشهر الحرم
  es: "Los meses sagrados"
  tr: "Kutsal aylar"
  id: "Bulan-bulan suci"
summary:
  ur: 'چار حرمت والے مہینے: ذوالقعدہ، ذوالحجہ، محرم اور رجب — اللہ نے انہیں زمین و
    آسمانوں کی تخلیق کے دن سے حرمت دی۔'
  ar: أربعة أشهر كان العرب يحرّمون فيها القتال، وهي ذو القعدة وذو الحجة والمحرم ورجب،
    ويعرض غوليوس في تعليقه على أسماء الشهور أصل هذا التحريم وتفسير أسماء الشهور المتصلة
    به {cite:farghani-elements-astronomy p. 248}{cite:farghani-elements-astronomy
    p. 253}.
  en: The four months in which fighting was forbidden in pre-Islamic Arabia (Dhu al-Qa'da,
    Dhu al-Hijja, Muharram, Rajab), and the meanings of their names, as set out in
    Golius's note on the Arabic months.
  fr: "Les quatre mois pendant lesquels les combats étaient interdits dans l’Arabie préislamique (Dhu al-Qa'da, Dhu al-Hijja, Muharram et Rajab), ainsi que le sens de leurs noms, d’après la note de Golius sur les mois arabes."
  es: "Los cuatro meses en los que estaba prohibido luchar en la Arabia preislámica (Dhu al-Qa'da, Dhu al-Hijja, Muharram, Rajab), y el significado de sus nombres, tal como se expone en la nota de Golius sobre los meses árabes."
  tr: "Arapların savaşmayı yasakladığı dört ay vardı: Zhu-Qi'dah, Dhu al-Hijjah, Muharrem ve Rajab. Ayların isimleri üzerine yaptığı yorumda Julius, bu yasağın kökenini ve ilgili ayların isimlerinin açıklamasını sunar {cite:farghani-elements-astronomy, s. 248} {cite:farghani-elements-astronomy, s. 253}."
  id: "Ada empat bulan di mana orang Arab melarang pertempuran: Zhu-Qi'dah, Dhu al-Hijjah, Muharram, dan Rajab. Dalam komentarnya tentang nama-nama bulan, Julius memberikan asal mula larangan ini dan penjelasan nama bulan-bulan tersebut {cite:farghani-elements-astronomy, hlm. 248} {cite:farghani-elements-astronomy, hlm. 253}."
