summary:
  ar: "يذكر الفهرس كواكب صورة السرطان في قسم مستقل من أقسام منطقة البروج، ويعدّ كواكبها بترتيبه. والبرج واحد من البروج الاثني عشر التي يقسم بها الزيج فلك البروج، والمواضع في جدول الطول والعرض لم تُنقل هنا. {cite:zij-sabi-nallino-byblion pp.257}"
  en: "The catalogue gives the stars of the figure of al-Saratan, Cancer, in its own section of the zodiac belt, listed in order. Cancer is one of the twelve signs into which the Zij divides the ecliptic. Its positions are in a table not transcribed here. {cite:zij-sabi-nallino-byblion pp.257}"
  ur: "فہرست منطقۃ البروج کے حصوں میں سرطان کی صورت کے ستارے ان کے اپنے حصے میں ترتیب سے دیتی ہے۔ سرطان زیج کے بارہ بروج میں سے ایک ہے جن میں وہ فلک البروج کو تقسیم کرتا ہے۔ مواضع جدول میں ہیں اور یہاں نقل نہیں کیے گئے۔ {cite:zij-sabi-nallino-byblion pp.257}"
  es: "El catálogo presenta las estrellas de la figura de al-Saratan, Cáncer, en su propia sección del cinturón zodiacal, listadas en orden. Cáncer es uno de los doce signos en los que el Zij divide la eclíptica. Sus posiciones se encuentran en una tabla que no se transcribe aquí. {cite:zij-sabi-nallino-byblion pp.257}"
  fr: "Le catalogue présente les étoiles de la figure d'al-Saratan, Cancer, dans sa propre section de la ceinture zodiacale, classées par ordre. Le Cancer est l'un des douze signes en lesquels le Zij divise l'écliptique. Ses positions figurent dans un tableau non transcrit ici. {cite:zij-sabi-nallino-byblion pp.257}"
  tr: "Bu dizin, Yengeç takımyıldızının gezegenlerini zodyakın ayrı bir bölümünde listeler ve sırayla sıralar. Bu takımyıldız, zodyakın bölündüğü on iki takımyıldızdan biridir ve boylam ve enlem tablosundaki konumlar burada yer almaz. {cite:zij-sabi-nallino-byblion pp.257}"
  id: "Indeks ini mencantumkan planet-planet dari konstelasi Cancer dalam bagian zodiak yang terpisah, dan mengurutkannya. Konstelasi ini adalah salah satu dari dua belas konstelasi yang menjadi bagian dari zodiak, dan posisi dalam tabel garis bujur dan garis lintang tidak disertakan di sini. {cite:zij-sabi-nallino-byblion pp.257}"
