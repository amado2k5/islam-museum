  ar: "دائرة الاستواء هي الدائرة الموازية لمعدل النهار على سطح الأرض، تقسم الأرض بقسمين شمالي وجنوبي، وهي أول حد للربع المسكون، وفيها يستوي الليل والنهار أبداً، وتمر الشمس على سمت الرأس فيها مرتين في السنة {cite:farghani-elements-astronomy p. 111}{cite:farghani-elements-astronomy p. 151}{cite:farghani-elements-astronomy p. 154}."
  en: "The equator is the circle on the earth parallel to the equinoctial circle, dividing the earth into northern and southern halves; it is the first limit of the inhabited quarter, where day and night are always equal {cite:farghani-elements-astronomy p. 111}{cite:farghani-elements-astronomy p. 151}{cite:farghani-elements-astronomy p. 154}."
