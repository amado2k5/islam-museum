id: concept/dairat-al-istiwa
class: concept
kind: scientific
label: { ar: "دائرة الاستواء", en: "The equator", es: "El ecuador", fr: "L'équateur", ur: "خط استوا۔", tr: "Ekvator Çemberi", id: "lingkaran ekuator" }
summary:
  ar: "دائرة الاستواء هي الدائرة الموازية لمعدل النهار على سطح الأرض، تقسم الأرض بقسمين شمالي وجنوبي، وهي أول حد للربع المسكون، وفيها يستوي الليل والنهار أبداً، وتمر الشمس على سمت الرأس فيها مرتين في السنة {cite:farghani-elements-astronomy p. 111}{cite:farghani-elements-astronomy p. 151}{cite:farghani-elements-astronomy p. 154}."
  en: "The equator is the circle on the earth parallel to the equinoctial circle, dividing the earth into northern and southern halves; it is the first limit of the inhabited quarter, where day and night are always equal {cite:farghani-elements-astronomy p. 111}{cite:farghani-elements-astronomy p. 151}{cite:farghani-elements-astronomy p. 154}."
  es: "El ecuador es el círculo en la tierra paralelo al círculo equinoccial, que divide la tierra en mitades norte y sur; es el primer límite del cuarto habitado, donde el día y la noche son siempre iguales {cite:farghani-elements-astronomy p. 111}{cite:farghani-elements-astronomy p. 151}{cite:farghani-elements-astronomy p. 154}."
  fr: "L'équateur est le cercle sur la terre parallèle au cercle équinoxial, divisant la terre en deux moitiés nord et sud; c'est la première limite du quart habité, où le jour et la nuit sont toujours égaux {cite:farghani-elements-astronomy p. 111}{cite:farghani-elements-astronomy p. 151}{cite:farghani-elements-astronomy p. 154}."
  ur: "خط استوا زمین پر ایک دائرہ ہے جو استوائی دائرے کے متوازی ہے، جو زمین کو شمالی اور جنوبی حصوں میں تقسیم کرتا ہے۔ یہ آباد سہ ماہی کی پہلی حد ہے، جہاں دن اور رات ہمیشہ برابر ہوتے ہیں 111}{حوالہ دیں:فرغانی-عناصر-فلکیات صفحہ۔ 151}{حوالہ:فرغانی-عناصر-فلکیات صفحہ۔ 154}۔"
  tr: "Ekvator dairesi, Dünya yüzeyindeki günün ortalamasına paralel olan dairedir. Dünya, kuzey ve güney bölümlerine ayrılır. Bu, gece ve gündüzün her zaman eşit olduğu ve güneşin yılda iki kez zenitinden geçtiği yerleşik çeyreğin ilk sınırıdır {cite:farghani-elements-astronomy s. 111}{cite:farghani-elements-astronomy s. 151}{cite:farghani-elements-astronomy s. 154}."
  id: "Lingkaran ekuator adalah lingkaran yang sejajar dengan rata-rata hari di permukaan Bumi. Bumi terbagi menjadi bagian utara dan selatan. Ini adalah batas pertama dari kuadran yang dihuni, di mana malam dan siang selalu sama, dan matahari melewati puncaknya dua kali setahun {cite:farghani-elements-astronomy hlm. 111}{cite:farghani-elements-astronomy hlm. 151}{cite:farghani-elements-astronomy hlm. 154}."
