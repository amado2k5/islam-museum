perspectives:
  - tradition: sunni
    id: hanafi-mawla-al-muwala
    summary:
      ar: "الحنفية يجعلون الدية على مولى الموالاة إن لم توجد عاقلة، وهو عقد يتعاقد فيه الرجل ليعقل عنه وليرثه إن مات دون وارث {cite:usul-iqtisad-islami-0660 p. 331}."
    sources: [source/usul-iqtisad-islami-0660]
  - tradition: sunni
    id: jumhur-wala-al-muwala-abrogated
    summary:
      ar: "الجمهور، غير الحنفية، يرون ولاء الموالاة جاهلياً نسخه الإسلام، فلا يُعتمد عليه في الدية أو الميراث {cite:usul-iqtisad-islami-0660 p. 333}."
    sources: [source/usul-iqtisad-islami-0660]
  - tradition: sunni
    id: sunni-sharawi-diya-aqila
    stance:
      ar: "الدية على العاقلة لا على القاتل وحده، ولا تؤخذ من الأصول والفروع، وفيها جبر لأهل القتيل وتوازن للمجتمع"
      en: "The blood-money falls on the kin group rather than the killer alone, is not taken from his ascendants or descendants, and compensates the family and balances society"
    summary:
      ar: "يذكر الشعراوي في تفسير آية القتل الخطأ أن الدية تؤديها قرابة القاتل، ولا تؤخذ من أصوله وفروعه حتى لا تجتمع عليهم مصيبة القتل مع فزع المشاركة فيه {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2543}{cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2547}. ويرى أن القريب إذا علم أنه سيشارك في الدية تعلّم صون حقوق غيره {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2543}، وأن الدية التي تُسلَّم إلى أهل القتيل المسلم تجبر فقدهم، وأن عفوهم عنها يورث مودة بين الأسرتين {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2544}{cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2545}. وفي الآية ثلاث صور: قتيل في بيئة مؤمنة فيجب التحرير والدية، وقتيل مؤمن في قوم معادين فيجب التحرير وحده لأنه لا توارث بينهم، وقتيل من قوم بينهم وبين المسلمين ميثاق فتجب الدية مع التحرير {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2545}{cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2546}. وهذا رأيه في تفسير الآية، ولم تُعرض بعد أحكام المذاهب من مصدر محدد (needs_source)."
      en: "In his commentary on the verse about accidental killing, Sha'rawi says the blood-money is paid by the killer's kin, not from his ascendants or descendants, so that the grief of the killing is not compounded by the burden of paying {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2543}{cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2547}. He holds that a relative who knows he will share the payment learns to protect others' rights {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2543}, and that blood-money paid to the family of a Muslim victim consoles them, and that forgiving it breeds affection between the families {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2544}{cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2545}. He sets out three cases: a believer killed within a believing people owes a freed slave and blood-money; a believer killed among a people hostile to the Muslims owes only a freed slave, since there is no inheritance between them; and a person from a people bound to the Muslims by treaty owes blood-money and a freed slave {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2545}{cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2546}. This is his reading; the jurists' rules are not yet set out from a named source (needs_source)."
