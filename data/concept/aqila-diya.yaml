id: concept/aqila-diya
class: concept
kind: legal
label:
  ar: "العاقلة والديات"
  en: "Kin liability for blood money (aqila)"
issue:
  ar: "من يتحمل دية القاتل خطأً إذا لم توجد عاقلة؟"
summary:
  ar: "العاقلة عند المؤلف هم عصبة القاتل من جهة الأب من الرجال الأحرار البالغين، يتحملون دية القتيل خطأً ولو كان القاتل غنياً {cite:usul-iqtisad-islami-0660 p. 331}. فإن لم توجد عاقلة فالمولى عند الحنفية، ثم أهل الديوان، ثم بيت المال {cite:usul-iqtisad-islami-0660 p. 331}. والدية مئة من الإبل أو ألف دينار أو اثنا عشر ألف درهم وتُقسط على ثلاث سنوات {cite:usul-iqtisad-islami-0660 p. 331}. وإن لم يُعرف القاتل أقسم خمسون من أهل المكان {cite:usul-iqtisad-islami-0660 p. 332}."
wings: [ideas]
themes:
- law-and-courts
- the-poor-and-the-worker
periods:
- period/prophetic-era
regions:
