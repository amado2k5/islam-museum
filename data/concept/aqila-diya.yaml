id: concept/aqila-diya
class: concept
kind: legal
label:
  ar: "العاقلة والديات"
  en: "Kin liability for blood money (aqila)"
  es: "Responsabilidad familiar por indemnización por derramamiento de sangre (aqila)"
  fr: "Responsabilité familiale pour le prix du sang (aqila)"
  ur: "خون کے پیسے کے لیے رشتہ داروں کی ذمہ داری ⁦(عقیلہ)⁩"
  tr: "Bilge ve ebeveynler"
  id: "Orang bijak dan orang tua"
issue:
  ar: "من يتحمل دية القاتل خطأً إذا لم توجد عاقلة؟"
summary:
  ar: "العاقلة عند المؤلف هم عصبة القاتل من جهة الأب من الرجال الأحرار البالغين، يتحملون دية القتيل خطأً ولو كان القاتل غنياً {cite:usul-iqtisad-islami-0660 p. 331}. فإن لم توجد عاقلة فالمولى عند الحنفية، ثم أهل الديوان، ثم بيت المال {cite:usul-iqtisad-islami-0660 p. 331}. والدية مئة من الإبل أو ألف دينار أو اثنا عشر ألف درهم وتُقسط على ثلاث سنوات {cite:usul-iqtisad-islami-0660 p. 331}. وإن لم يُعرف القاتل أقسم خمسون من أهل المكان {cite:usul-iqtisad-islami-0660 p. 332}."
  tr: "Yazara göre, 'akilahlar, katilin baba tarafından akrabaları, özgür yetişkinler arasından olan akrabalardır ve katilin zengin olsa bile yanlışlıkla mağdur için kan parasını taşırlar {cite:usul-iqtisad-islami-0660 s. 331}. Eğer 'aqilah yoksa, Hanefi'lere göre mevla, sonra büro çalışanları, ardından kamu hazinesi {cite:usul-iqtisad-islami-0660 s. 331}. Kan parası, üç yıl boyunca taksitler halinde ödenen yüz deve, bin dinar veya on iki bin dirhemdir {cite:usul-iqtisad-islami-0660 s. 331}. Katil bilinmiyorsa, yerden elli kişi yemin eder {cite:usul-iqtisad-islami-0660 s. 332}."
  id: "Menurut penulis, 'aqilah adalah kerabat pembunuh dari pihak ayah, dari antara pria dewasa bebas, yang secara tidak sengaja membawa uang darah untuk korban, meskipun pembunuhnya kaya {cite:usul-iqtisad-islami-0660 hlm. 331}. Jika tidak ada 'aqilah, maka mawla menurut Hanafi, maka orang-orang biro, maka kas negara {cite:usul-iqtisad-islami-0660 hlm. 331}. Uang darahnya adalah seratus unta, atau seribu dinar, atau dua belas ribu dirham, yang dibayarkan secara cicilan selama tiga tahun {cite:usul-iqtisad-islami-0660 hlm. 331}. Jika pembunuhnya tidak diketahui, lima puluh orang dari tempat itu akan bersumpah {cite:usul-iqtisad-islami-0660 hlm. 332}."
