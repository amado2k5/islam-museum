issue:
  ar: "ما معنى جعل الأرض كلها مسجداً، وما حكم منع ذكر الله في المساجد وتخريبها؟"
  en: "What does it mean that the whole earth is a place of prayer, and what is the ruling on barring the remembrance of God in mosques or wrecking them?"
perspectives:
  - tradition: sunni
    id: sunni-sharawi-whole-earth
    stance:
      ar: "الأرض كلها مسجد وطهور لتيسير العبادة، والمساجد أعظم حرمة وتخريبها ظلم"
      en: "The whole earth is a place of prayer and purity to ease worship; mosques carry greater sanctity and wrecking them is a wrong"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يذكر الشعراوي أن الدين قبل الإسلام كان لا تصح عبادته إلا في موضع مخصص، ثم جعل الله الأرض كلها مسجداً وطهوراً توسعةً على الناس ليلتقوا بربهم، ويستدل بحديث الخصال الخمس عن جابر. ويعدّ منع ذكر الله في مساجده وسعي خرابها أعظم الظلم، ويقول إن المؤمن إن سكت عن ذلك فقد شارك فيه. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.537}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.538}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.541}"
      en: "Sha'rawi says that before Islam a religion's worship was valid only in a designated place, and that God made the whole earth a place of prayer and purity to widen the means of meeting Him; he cites the hadith of the five gifts from Jabir. He counts barring God's name from mosques and seeking their ruin as the greatest wrong, and says a believer who keeps silent shares in it {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.537}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.538}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.541}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
  - tradition: sunni
    id: sunni-scope-note
    stance:
      ar: "أحكام المسجد وحرمته وما يُفسد صلاته وتخريبه دون مصدر في هذه الدفعة"
      en: "The rules on mosque sanctity, on what invalidates prayer there and on the penalties for wrecking a mosque are not yet entered from a source"
    holders: []
    summary:
      ar: "لم تُدخل بعد أحكام الفقهاء في حرمة المسجد وأحكام تخريبه ومنع الذكر فيه، ولا الرأي الأكاديمي أو الآراء الأخرى. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.541}"
      en: "The jurists' rulings on the sanctity of mosques, the penalties for wrecking them and barring worship in them, the academic view and other views are not yet entered."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
