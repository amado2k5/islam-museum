id: concept/al-ard-masjid-wa-tahur
class: concept
kind: doctrine
label: { ar: "الأرض مسجداً وطهوراً", en: "The earth made a place of prayer and purity", fr: "La terre, lieu de prière et de purification", es: "La tierra se convirtió en un lugar de oración y pureza.", ur: "زمین نے نماز اور پاکیزگی کی جگہ بنائی", tr: "Dünya bir cami ve bir saflıktır", id: "Dunia adalah masjid dan kemurnian" }
summary:
  ar: "يعرض الشعراوي أن الله جعل الأرض كلها مسجداً وطهوراً لأمة محمد، فتصح الصلاة في كل موضع، وأن تخريب المساجد يُنظر إليه على أنه ظلم عظيم يستدعي الخزي في الدنيا والعذاب في الآخرة. ويقول إن النعم الكاشفة عن أسرار الكون تُقابل بالسجود شكراً. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.537}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.538}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.539}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.540}"
  en: "Sha'rawi holds that God made the whole earth a place of prayer and purity for the community of Muhammad, so that prayer is valid in every place. He treats the wrecking of mosques as a very great wrong that brings shame in this world and punishment in the next, and says that the discovery of hidden laws in creation calls for prostration in thanks {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.537}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.538}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.539}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.540}."
  fr: "Selon Sha'rawi, Dieu a fait de toute la terre un lieu de prière et de purification pour la communauté de Muhammad, si bien que la prière est valide en tout lieu. Il considère la destruction des mosquées comme une faute très grave qui entraîne l’humiliation ici-bas et le châtiment dans l’au-delà, et estime que la découverte de lois cachées dans la création appelle une prosternation de gratitude {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.537}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.538}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.539}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.540}."
  es: "Sha'rawi sostiene que Dios hizo de toda la tierra un lugar de oración y pureza para la comunidad de Muhammad, por lo que la oración es válida en cualquier lugar. Considera la destrucción de mezquitas como una gran injusticia que trae vergüenza en este mundo y castigo en el más allá, y dice que el descubrimiento de leyes ocultas en la creación exige postración en agradecimiento {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.537}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.538}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.539}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.540}."
  ur: "شعراوی کا خیال ہے کہ اللہ تعالیٰ نے پوری زمین کو امت محمدیہ کے لیے عبادت اور پاکیزگی کی جگہ بنایا، اس لیے یہ نماز ہر جگہ جائز ہے۔ وہ مساجد کی بربادی کو ایک بہت بڑی غلطی قرار دیتا ہے جو دنیا میں رسوائی اور آخرت میں عذاب کا باعث ہے اور کہتا ہے کہ مخلوقات میں پوشیدہ قوانین کی دریافت شکر میں سجدہ ریز ہونے کا مطالبہ کرتی ہے۔ p.537}{cite:tafsir-Sharawi-khawatir-scan-pp-501-1000 p.538}{cite:tafsir-Sharawi-khawatir-scan-pp-501-1000 p.539}{cite:tafsir-sharawi-khawatir-p.501-p.501}"
  tr: "Al-Shaarawi, Allah'ın tüm dünyayı Muhammed milleti için cami ve arınma olarak yarattığını, böylece namazın her yerde geçerli olduğunu ve camilerin yıkılmasının bu dünyada utanç ve ahirette ceza gerektiren büyük bir adaletsizlik olarak görüldüğünü belirtir. Evrenin sırlarını ortaya çıkaran nimetlerin minnetle karşılık bulduğunu söyler. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 s.537} {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 s.538} {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 s.539} {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 s.540}"
  id: "Al-Shaarawi menyatakan bahwa Allah menciptakan seluruh dunia sebagai masjid dan penyucian bagi bangsa Muhammad, sehingga shalat berlaku di mana-mana, dan penghancuran masjid dianggap sebagai ketidakadilan besar di dunia ini dan hukuman di akhirat. Dia berkata bahwa berkat yang mengungkapkan rahasia alam semesta diberi ganjaran dengan rasa syukur. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 hlm.537} {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 hlm.538} {cite:tafsir-sharawi-khawatir-scan-pp-pp-501-1000 hlm.539} {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 hlm.540}"
