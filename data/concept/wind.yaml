summary:
  ar: "ريح سليمان سخّرها الله له غدوها شهر ورواحها شهر، والريح العقيم على عاد لا تذر شيئاً أتت عليه إلا جعلته كالرميم، واللواقح لتحيي الأرض وتنشر رحمة الله."
  en: "Solomon's wind, made subject to him — its morning course a month and its evening a month; the barren wind against 'Ad which left nothing it touched without making it dust; and the fertilizing winds that revive the earth and spread His mercy."
  ur: "سلیمان کی ہوا مسخر تھی — صبح کا سفر ایک مہینہ اور شام کا ایک مہینہ؛ عاد پر بے ثمر ہوا جو ہر چیز کو ریزہ بنا ڈالتی تھی؛ اور نسل کشی والی ہوائیں جو زمین کو زندہ کر کے اس کی رحمت پھیلاتی ہیں۔"
