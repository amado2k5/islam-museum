  ar: "الريح"
  en: "The wind"
  ur: "ہوا"
  es: "El viento"
  fr: "Le vent"
summary:
  ar: "ريح سليمان سخّرها الله له غدوها شهر ورواحها شهر، والريح العقيم على عاد لا تذر شيئاً أتت عليه إلا جعلته كالرميم، واللواقح لتحيي الأرض وتنشر رحمة الله."
  en: "Solomon's wind, made subject to him — its morning course a month and its evening a month; the barren wind against 'Ad which left nothing it touched without making it dust; and the fertilizing winds that revive the earth and spread His mercy."
  ur: "سلیمان کی ہوا مسخر تھی — صبح کا سفر ایک مہینہ اور شام کا ایک مہینہ؛ عاد پر بے ثمر ہوا جو ہر چیز کو ریزہ بنا ڈالتی تھی؛ اور نسل کشی والی ہوائیں جو زمین کو زندہ کر کے اس کی رحمت پھیلاتی ہیں۔"
  es: "El viento de Salomón, sometido a él —su recorrido matutino duraba un mes y su recorrido vespertino otro mes—; el viento estéril contra 'Ad que no dejaba nada que tocaba sin convertirlo en polvo; y los vientos fertilizadores que reaniman la tierra y extienden su misericordia."
  fr: "Le vent de Salomon, soumis à lui — son souffle du matin durant un mois et son souffle du soir durant un mois; le vent stérile contre 'Ad qui ne laissait rien qu'il touchait sans le réduire en poussière; et les vents fertilisants qui raniment la terre et répandent sa miséricorde."
