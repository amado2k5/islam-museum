label:
  ar: "وَصِيَّة"
  en: "Wasiyya (bequest, fiqh)"
summary:
  ar: "الوصية في اللغة من وصيت الشيء بالشيء أصِيه، أي وصلته، وتُطلق على الموصى به. وفي الاصطلاح الوصية بالمال تمليك مضاف إلى ما بعد الموت بطريق التبرع، سواء في الأعيان أو المنافع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17270} والإيصاء والوصاية والهبة والصدقة ألفاظ ذات صلة: فالوصية تمليك بعد الموت، والهبة في الحياة بلا عوض، والصدقة في الحياة لمحتاج لأجل الثواب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17270}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17271} والوصية مشروعة بالكتاب والسنة والإجماع: فالقرآن قدّم الوصية والدين على الميراث، والسنة قدّمت الدين على الوصية؛ وجاء في حديث سعد بن أبي وقاص أن الثلث كثير، وأن ترك الورثة أغنياء خير من تركهم عالة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17271} وفي حديث معاذ أن الله تصدّق بثلث الأموال عند الوفاة زيادةً في الحسنات، وفي حديث ابن عمر أن المسلم لا ينبغي أن يبيت ليلتين إلا ووصيته مكتوبة عنده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17272} وحكمة مشروعيتها تحصيل ذكر الخير والثواب، وصلة القرابة غير الوارثين، ونفع المحتاجين، بشرط ألا يُضار فيها أحد، وأن تُقصر على الثلث، وألا تنفذ لوارث إلا بإجازة الورثة منعاً للتباغض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17272}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17273} والجمهور على أن الوصية بجزء من المال ليست بواجبة، بل مستحبة لمن ترك خيراً، ونُسخ الوجوب في حق الوارثين بحديث «لا وصية لوارث»، وبقي الاستحباب في حق من لا يرث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17273} ويُستحب أن لا يستوعب الموصي الثلث، والحنابلة يرون الخمس أفضل للغني، ونُقل عن ابن عباس وجماعة استحباب الربع. وإذا كان الورثة فقراء استُحب النقص من الثلث، والفقير ذو الورثة المحتاجين لا يُستحب له أن يوصي عند الحنفية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17274}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17275} وذهب بعض السلف، كالزهري وطاوس ومسروق وغيرهم، إلى وجوب الوصية للأقربين غير الوارثين، واحتجوا بالآية وبحديث ابن عمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17275} وأركان الوصية عند الجمهور أربعة: صيغة وموصٍ وموصى له وموصى به. وعند الحنفية الركن الإيجاب والقبول عند أبي حنيفة وصاحبيه، وعند زفر الإيجاب وحده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17275}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17276} والصيغة كل لفظ يدل على التمليك بعد الموت، وتنعقد بالكتابة عند الجمهور، والشافعية يعدّونها كناية لا تنعقد إلا بالنية، والحنابلة يشترطون ثبوت خط الموصي، والإشارة من القادر على النطق لا تنعقد عند الجمهور، ويجيزها المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17276}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17277}"
  en: "In the lexicon wasiyya comes from joining one thing to another and can also name the thing bequeathed. Technically a bequest of property is a gift made by way of kindness and attached to the time after death, whether of things or of benefits. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17270} Related terms are the commission (ايصاء), the executorship (wisaya), the gift, which is in life and without return, and alms, which is in life to one in need seeking reward. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17270}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17271} The bequest is lawful by the Qur'an, the Sunna and consensus. The Qur'an places the bequest and the debt before inheritance, and the sunna places the debt before the bequest; a report from Sa'd ibn Abi Waqqas holds a third to be much, and that leaving heirs rich is better than leaving them in need. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17271} A report from Mu'adh says God gives charity of a third at death as an increase in good deeds, and a report from Ibn Umar says a Muslim who has a bequest should not spend two nights without it written by him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17272} Its purpose is to gain remembrance and reward, to give to relatives who do not inherit and to help the needy, on condition that no one is harmed, that it stays within a third, and that it is not valid for an heir without the consent of the other heirs, to prevent hatred. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17272}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17273} Most jurists hold that a bequest of part of the property is not obligatory but recommended for one who leaves good; the obligation was abrogated for heirs by the report that there is no bequest to an heir, and recommendation remains for non-heirs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17273} A bequest of less than a third is preferred; the Hanbalis say a fifth is better for the rich; Ibn Abbas and others preferred a quarter. Where heirs are poor the bequest is reduced, and a poor man with needy heirs is not advised to bequeath, in the Hanafi and Hanbali views. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17274}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17275} Some early authorities, such as al-Zuhri, Masruq and Tawus, held the bequest obligatory for relatives who do not inherit, relying on the verse on bequests and the report of Ibn Umar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17275} The pillars of the bequest are, for the majority, four: the formula, the testator, the legatee and the thing bequeathed. For the Hanafis the pillar is offer and acceptance according to Abu Hanifa and his two companions, and offer alone according to Zufar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17275}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17276} The formula is any word showing transfer after death. The majority accept a bequest in writing; the Shafi'is treat writing as an allusion requiring intention, and the Hanbalis require the testator's hand to be proven. A sign from one able to speak is not valid in the majority view, and the Malikis allow it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17276}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17277}"
