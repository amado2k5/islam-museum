id: concept/wasiyya-fiqh
class: concept
kind: legal
label:
  ar: "وَصِيَّة"
  en: "Wasiyya (bequest, fiqh)"
summary:
  ar: "الوصية في اللغة من وصيت الشيء بالشيء أصِيه، أي وصلته، وتُطلق على الموصى به. وفي الاصطلاح الوصية بالمال تمليك مضاف إلى ما بعد الموت بطريق التبرع، سواء في الأعيان أو المنافع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17270} والإيصاء والوصاية والهبة والصدقة ألفاظ ذات صلة: فالوصية تمليك بعد الموت، والهبة في الحياة بلا عوض، والصدقة في الحياة لمحتاج لأجل الثواب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17270}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17271} والوصية مشروعة بالكتاب والسنة والإجماع: فالقرآن قدّم الوصية والدين على الميراث، والسنة قدّمت الدين على الوصية؛ وجاء في حديث سعد بن أبي وقاص أن الثلث كثير، وأن ترك الورثة أغنياء خير من تركهم عالة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17271} وفي حديث معاذ أن الله تصدّق بثلث الأموال عند الوفاة زيادةً في الحسنات، وفي حديث ابن عمر أن المسلم لا ينبغي أن يبيت ليلتين إلا ووصيته مكتوبة عنده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17272} وحكمة مشروعيتها تحصيل ذكر الخير والثواب، وصلة القرابة غير الوارثين، ونفع المحتاجين، بشرط ألا يُضار فيها أحد، وأن تُقصر على الثلث، وألا تنفذ لوارث إلا بإجازة الورثة منعاً للتباغض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17272}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17273} والجمهور على أن الوصية بجزء من المال ليست بواجبة، بل مستحبة لمن ترك خيراً، ونُسخ الوجوب في حق الوارثين بحديث «لا وصية لوارث»، وبقي الاستحباب في حق من لا يرث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17273} ويُستحب أن لا يستوعب الموصي الثلث، والحنابلة يرون الخمس أفضل للغني، ونُقل عن ابن عباس وجماعة استحباب الربع. وإذا كان الورثة فقراء استُحب النقص من الثلث، والفقير ذو الورثة المحتاجين لا يُستحب له أن يوصي عند الحنفية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17274}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17275} وذهب بعض السلف، كالزهري وطاوس ومسروق وغيرهم، إلى وجوب الوصية للأقربين غير الوارثين، واحتجوا بالآية وبحديث ابن عمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17275} وأركان الوصية عند الجمهور أربعة: صيغة وموصٍ وموصى له وموصى به. وعند الحنفية الركن الإيجاب والقبول عند أبي حنيفة وصاحبيه، وعند زفر الإيجاب وحده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17275}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17276} والصيغة كل لفظ يدل على التمليك بعد الموت، وتنعقد بالكتابة عند الجمهور، والشافعية يعدّونها كناية لا تنعقد إلا بالنية، والحنابلة يشترطون ثبوت خط الموصي، والإشارة من القادر على النطق لا تنعقد عند الجمهور، ويجيزها المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17276}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17277} قبول الوصية أو ردها بالدلالة: أن يتصرف الموصى له في الموصى به تصرف الملاك كالبيع والهبة والإجارة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17278} وإذا مات الموصى له بعد موت الموصي وقبل القبول دخل الموصى به في ملك ورثته عند الحنفية، لأن الوصية تمت من جهة الموصي بموته؛ وذهب المالكية والحنابلة والشافعية في قول إلى اشتراط القبول لمعيّن، ولا يكفي عدم الرد، فإن مات الموصى له قبل موت الموصي بطلت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17278} واتفق الفقهاء على أن الوصية تبطل برد الموصى له بعد موت الموصي، ولا عبرة بالقبول أو الرد قبل موت الموصي عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17278}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17279} ولا يشترط أن يكون القبول أو الرد فوراً بعد الموت، بل هما على التراخي، وأضاف الشافعية والحنابلة أن للوارث مطالبة الموصى له بالقبول أو الرد، فإن امتنع حكم القاضي بالرد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17279} وفي الرجوع عن القبول ثلاثة آراء: الجمهور لا يجوز الرد بعد القبول، والشافعية والحنابلة في قول يجيزونه قبل القبض، وقول ثالث يجيزه في المكيل والموزون قبل القبض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17279}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17280} وفي تجزؤ القبول: احتمالان عند الشافعية، والراجح عند زكريا الأنصاري البطلان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17280} والموصى له المعين يملك القبول أو الرد بنفسه إن كان كامل الأهلية، والموصى له غير المعين أو الجماعة غير المحصورة كالفقراء والمساجد لا يحتاج إلى قبول، والمحجور عليه يقبل له وليه بما فيه الحظ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17280} وإذا مات الموصى له المعين بعد موت الموصي دون قبول ولا رد، فللحنفية غير زفر قول بالصحة استحساناً، وقال زفر وبعض الحنابلة يكون الموصى به لورثة الموصي فتبطل، وجمهور الفقهاء يجعلون ورثة الموصى له يقومون مقامه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17280}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17281} وتعليق الوصية على شرط أو إضافتها إلى المستقبل جائز بالاتفاق عند الحنفية والشافعية، وعند المالكية تبطل إن قال: إن مت من مرضي هذا فلفلان كذا ولم يمت منه، وعند الحنابلة تصح إذا كانت الصفة يرتقب وقوعها بعد الموت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17281}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17283} والوصية عقد غير لازم، ويجوز للموصي الرجوع عنها كلها أو بعضها في حياته مرضاً أو صحة، لأثر عمر «يغيّر الرجل ما شاء في وصيته». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17282} والرجوع يكون بالقول كنقض الوصية وإبطالها، وبالدلالة كالبيع والهبة والرهن واستهلاك الموصى به، وخلطه، وطحن الحنطة وغزل القطن ونحو ذلك. وجمهور الفقهاء يرون جحود الوصية ليس رجوعاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17282}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17283} والموصي يشترط فيه أن يكون أهلاً للتبرع: العقل فلا تصح من المجنون والمعتوه والمغمى عليه؛ والبلوغ فيشترطه الحنفية والشافعية في المذهب والحنابلة في قول، ويجيزها المالكية والحنابلة في المذهب والشافعية في قول لمميز، ويجيز المالكية وصية المميز ممن بلغ عشر سنين فأقل بحسب حاله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17284}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17285} والحرية شرط عند الفقهاء فلا تصح وصية العبد، والرضا والاختيار شرط فلا تصح وصية المكره والهازل والمخطئ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17285} ولا يشترط إسلام الموصي عند الجمهور، فتصح وصية غير المسلم، ونص الشافعية والحنابلة على صحة وصية الكافر ولو كان حربياً، وقيّد الشافعية صحة وصية المرتد بألا يموت كافراً، وأبطلها المالكية في حال الردة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17286} وفي وصية المستأمن الحربي عند الحنفية تفصيل: تنفذ إن كانت قائمة بعينها إذا أسلم أهل داره أو صاروا ذمة، فإن استُهلكت بطلت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17286}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17287} والموصى له هو من تبرع له الموصي بجزء من ماله بعد وفاته، ويشترط أن يكون موجوداً حال الوصية عند الحنفية والشافعية في الأصح والحنابلة في المذهب، وأجازها المالكية والشافعية في مقابل الأصح والحنابلة في قول لمن سيوجد، كالحمل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17287}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17288} ويشترط أن يكون الموصى له أهلاً للتملك، فإن أوصى لميت لا يعلم الموصي بموته بطلت، والمالكية يصرفونه لدين الميت أو لورثته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17288} والوصية للحمل صحيحة إن وُجد حال الوصية، ويُعلم وجوده بولادته حياً لأقل من ستة أشهر، وعند الشافعية والحنابلة لأقل من أربع سنين إن لم تكن الأم ذات زوج أو سيد، وعند الحنفية لسنتين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17288} ويشترط أن يكون الموصى له معلوماً، فلو أوصى لأحد رجلين فالوصية باطلة عند أبي حنيفة وزفر والمالكية والشافعية والحنابلة، وأجازها أبو يوسف إن اصطلحا، وقال محمد الخيار للورثة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17289} والوصية لجماعة لا يمكن حصرهم كالفقراء والمساكين صحيحة، ثم اختلفوا في وجوب التعميم: المالكية لا يلزمونه، والشافعية في الأظهر يكفي الدفع إلى ثلاثة، والحنابلة يكفي الدفع إلى واحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17289} وإذا أوصى لقبيلة لا تُحصى كتميم وعقيل فالوصية باطلة عند الحنفية والشافعية في مقابل الأظهر، لاشتراط أن يكون الموصى له معلوماً، وتصح إن كانوا يُحصَون؛ وفي تفسير الإحصاء أقوال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17290} والوصية لذات الدابة باطلة، وأما الوصية لعلف دابة فلان فجائزة وتُصرف في علفها، وللشافعية والحنابلة تفصيل في الوصية لفرس بعينه أو لفرس حبيس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17290}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17291} والوصية للجهة العامة كبناء المسجد وترميمه صحيحة من المسلم لأنها قربة، وأجاز المالكية والشافعية والحنابلة الوصية لجهة مباحة. ولا تجوز وصية المسلم لبناء كنيسة أو بيعة عند الجمهور لأنها معصية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17291}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17292} وفي وصايا أهل الذمة عند الحنفية تفصيل: ما هو قربة عندنا وعندهم يجوز بالاتفاق، وما هو قربة عندنا فقط لا يجوز، وما هو قربة عندهم فقط فيجوزه أبو حنيفة ويمنعه الصاحبان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17292} والوصية لله تعالى تصرف في وجوه البر عند الشافعية ومحمد بن الحسن، وبقوله يُفتى عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17292} والوصية في سبيل الله تُصرف عند الشافعية والحنابلة وأبي يوسف في الغزو، ويزيد محمد والحنابلة في قول الحج. والوصية لأعمال البر تُصرف عند الحنابلة في القُرب كلها ويُبدأ بالغزو، وعند الحنفية كل ما ليس فيه تمليك من أعمال البر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17293} وإذا قال الموصي: ضعوا ثلثي حيث أراك الله، فالحنابلة يصححونه ويصرف في أي جهة قربة، والشافعية يرون صرفه إلى أقاربه الذين لا يرثونه ثم إلى محارمه ثم إلى جيرانه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17293} الوصية لقاتل الموصي: يشترطها ألا يكون الموصى له قاتلاً عند الحنفية والحنابلة في المذهب والشافعية في مقابل الأظهر والثوري، لحديث «ليس لقاتل وصية»، وهو حديث ضعّفه الدارقطني، والقتل المانع هو المضمون بقصاص أو دية أو كفارة ولو خطأ. والحنفية يشترطون المباشرة ووجود وارث للموصي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17294} والمالكية والشافعية في الأظهر والحنابلة في رواية لا يشترطون ذلك؛ وعند المالكية إن علم الموصي بسبب القتل صحت الوصية، وإن جهله ففيه تأويلان، والظاهر عند الدسوقي عدم الصحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17294}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17295} وعند الفقهاء يشترط ألا يكون الموصى له وارثاً وقت موت الموصي إن كان هناك وارث آخر، لحديث «إن الله قد أعطى كل ذي حق حقه فلا وصية لوارث»، ومعناه أن الوصية للوارث لا تنفذ إلا بإجازة الورثة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17295} وإذا أجاز بعض الورثة دون بعض صحت الوصية في حصة المجيز وبطلت في حق غيره عند الجمهور، والمالكية وقول للشافعية وللحنابلة يرون الوصية باطلة وتحتاج إلى قبول جديد بعد الإجازة. ويشترط في المجيز أن يكون أهلاً للتبرع، وأن تكون الإجازة بعد موت الموصي عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17296} والمالكية يرون أن الإجازة في مرض الموصي تلزم بشروط، ومنها أن يكون المرض مخوفاً، وألا يصح الموصي بعدها. والعبرة بكون المستحق وارثاً وقت موت الموصي لا وقت الإيصاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17296}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17297} ووردت عبارات تتعلق بالموصى له تختلف في معناها عند الفقهاء: فالوصية للجيران عند أبي حنيفة للملاصقين، والصاحبان للملاصقين ومن يسكن المحلة ويجمعهم مسجدها، والمالكية للملاصقين من الجهات الست وللمقابلين بزقاق صغير، والشافعية في المذهب والحنابلة لأربعين داراً من كل جانب، والحنابلة أيضاً لمن يسمع النداء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17298} والوصية للأقارب عند أبي حنيفة للأقرب فالأقرب من كل ذي رحم محرم، دون الوالدين والولد؛ والصاحبان لكل من ينسب إلى أقصى أب له في الإسلام؛ والمالكية لأقارب أبيه غير الورثة؛ والشافعية لكل قرابة وإن بعدت، إلا الأصل والفرع في الأصح؛ والحنابلة لأولاد الآباء الأربعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17298}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17299} والوصية لأقرب الأقارب عند الشافعية تشمل الأصل والفرع، والأصح تقديم الابن وإن سفل على الأب، وتقديم الأخ على الجد، والحنابلة يفصّلون بين الأبوين والأب والأم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17299}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17300} والوصية للأصهار والأختان والآل والعلماء لها تفصيل عند الحنفية: فالأصهار كل ذي رحم محرم من امرأته، والأختان أزواج المحارم، والآل آل بنيه وقبيلته، والعلماء عند الجمهور أهل الفقه والحديث، وأضاف الشافعية والحنابلة أهل التفسير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17300}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17301} والوصية لغير المسلم: تصح للذمي عند الفقهاء، واشترط الحنابلة أن يكون معيناً؛ وتصح للمستأمن عند الحنفية والشافعية والمالكية والحنابلة؛ وللحربي ثلاثة أقوال: الشافعية في الأصح والحنابلة في الصحيح يجيزونها للحربي المعيّن، والحنفية والمالكية في المذهب يمنعونها في دار الحرب؛ وللمرتد الحنفية والمالكية والحنابلة في وجه يمنعونها، والشافعية والحنابلة في الصحيح يجيزونها للمعيّن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17301}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17303} والركن الرابع الموصى به: يشترط أن يكون مالاً، فيشمل النقد والعين والديون والحقوق المقدرة بمال، والمنافع التي تُباع وتُوهب وتُؤجر؛ وخالف ابن أبي ليلى وابن شبرمة في الوصية بالمنافع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17303}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17304} ويشترط أن يكون متقوّماً في الشرع: فلا تصح من مسلم ولا لمسلم بالخمر والخنزير والكلب العقور والسباع التي لا تصلح للصيد، وتصح من النصراني لمثله بما يتقوم عنده، وتجوز بالكلب المعلم والسباع الصالحة للصيد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17304} ويشترط أن يكون ما أوصي به من المال متقوماً؛ وتصح الوصية بجلد ميتة قابل للدباغ عند الشافعية، والوصية بإناء ذهب أو فضة جائزة لأنه مال يُنتفع به في غير حال الاستعمال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17305} والوصية بالمال القابل للتمليك بعد الموت بعقد: الحنفية والشافعية في قول يشترطون ذلك، فتصح بثمر نخيل عام أو أبداً، ولا تصح عند الحنفية استحساناً بما تلده أغنامه، والجمهور يصححون الوصية بالمعدوم مطلقاً كالسلم والمساقاة والإجارة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17305}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17306} وتصح الوصية بالمجهول كشاة من غنمه بالاتفاق، وبما لا يُقدر على تسليمه كالبعير الشارد. وتجوز بالمشاع والمقسوم عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17305}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17306} وعند الحنفية يُشترط وجود الموصى به في المستقبل وفق نوع المال: إن كان معيناً بذاته كدار معينة يُشترط وجوده عند الوصية، وإن كان شائعاً في كل المال كالثلث أو الربع فعند موت الموصي، وإن كان شائعاً في بعض المال فعند الوصية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17306} ويُشترط أن يكون الموصى به مملوكاً للموصي: فعند المالكية والشافعية في وجه والحنابلة في المذهب لا تصح الوصية بمال الغير ولو ملكه بعد الوصية، وعند الحنفية والشافعية في وجه آخر والحنابلة في قول تصح موقوفة على إجازة المالك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17306}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17307} ويمتنع بيع أو وصية بمحرم، لأن القصد من الوصية تدارك الإحسان، ولا تنفذ الوصية بما استغرقه الدين إلا بإبراء الغرماء عند الحنفية والشافعية، والمالكية يرون وصية المستغرق الذمة لا تنعقد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17307}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17308} والوصية في الثلث: إن كان للموصي وارث لا تنفذ الزيادة عن الثلث إلا بإجازة الورثة عند الجمهور، فإن أجازوا نفذت، وإن ردوا بطلت. وإن لم يكن له وارث فعند الحنفية تكون الوصية في جميع المال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17308} وأما الوصية بسهم من المال فلها أقوال: منها أن يكون للموصى له السدس إن كانت الفريضة أقل من ستة أسهم عند أبي حنيفة والحنابلة في المذهب، ومنها مثل أقل سهام الورثة، والمالكية لهم تفصيل بحسب العول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17309}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17310} والوصية بجزء أو حظ من المال مجملة، فيعطيه الورثة ما شاؤوا بعد الموت إن لم يبيّن الموصي، عند الحنفية والشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17310} والوصية بشاة تشمل الصغيرة والكبيرة والذكر والأنثى بحسب القرينة، وعند الحنابلة تُعطى ما يقع عليه الاسم عرفاً، والوصية بدابة تُعطى فرساً أو بغلاً أو حماراً بالعرف، والوصية بكلب لا كلب له باطلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17310}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17311} والوصية بطبل من طبول الحرب تُعطى واحداً منها، وبطبول اللهو تصح إن صلح لمنفعة مباحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17311} والوصية بالمنافع جائزة عند جمهور الفقهاء، وتُخرج قيمتها من الثلث، فإن لم تخرج أُجيز منها بقدر الثلث. وإذا مات الموصى له بالمنفعة عند الحنفية عادت المنفعة إلى صاحب العين؛ وعند الشافعية والحنابلة تُورث الوصية على تفصيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17311}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17314} والوصية بالمنفعة المؤقتة بسنة معينة تُحسب من الثلث بحسب ما نقصته المنفعة، وإذا وُصّي بمنفعة عبد لواحد ورقبته لآخر فالرقبة لصاحب الرقبة والخدمة لصاحب الخدمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17312}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17313} والمنفعة المشتركة بين الموصى له والورثة تُستوفى بقسمة الغلة، أو قسمة العين إن قبلت القسمة، أو مهايأة زمانية أو مكانية، وانتهاء الوصية بالمنفعة يكون بمضي المدة قبل الوفاة، أو إسقاط الموصى له حقه، وعند الحنفية بوفاته قبل الاستيفاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17314}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17315} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17315}"
  en: "In the lexicon wasiyya comes from joining one thing to another and can also name the thing bequeathed. Technically a bequest of property is a gift made by way of kindness and attached to the time after death, whether of things or of benefits. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17270} Related terms are the commission (ايصاء), the executorship (wisaya), the gift, which is in life and without return, and alms, which is in life to one in need seeking reward. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17270}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17271} The bequest is lawful by the Qur'an, the Sunna and consensus. The Qur'an places the bequest and the debt before inheritance, and the sunna places the debt before the bequest; a report from Sa'd ibn Abi Waqqas holds a third to be much, and that leaving heirs rich is better than leaving them in need. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17271} A report from Mu'adh says God gives charity of a third at death as an increase in good deeds, and a report from Ibn Umar says a Muslim who has a bequest should not spend two nights without it written by him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17272} Its purpose is to gain remembrance and reward, to give to relatives who do not inherit and to help the needy, on condition that no one is harmed, that it stays within a third, and that it is not valid for an heir without the consent of the other heirs, to prevent hatred. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17272}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17273} Most jurists hold that a bequest of part of the property is not obligatory but recommended for one who leaves good; the obligation was abrogated for heirs by the report that there is no bequest to an heir, and recommendation remains for non-heirs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17273} A bequest of less than a third is preferred; the Hanbalis say a fifth is better for the rich; Ibn Abbas and others preferred a quarter. Where heirs are poor the bequest is reduced, and a poor man with needy heirs is not advised to bequeath, in the Hanafi and Hanbali views. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17274}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17275} Some early authorities, such as al-Zuhri, Masruq and Tawus, held the bequest obligatory for relatives who do not inherit, relying on the verse on bequests and the report of Ibn Umar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17275} The pillars of the bequest are, for the majority, four: the formula, the testator, the legatee and the thing bequeathed. For the Hanafis the pillar is offer and acceptance according to Abu Hanifa and his two companions, and offer alone according to Zufar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17275}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17276} The formula is any word showing transfer after death. The majority accept a bequest in writing; the Shafi'is treat writing as an allusion requiring intention, and the Hanbalis require the testator's hand to be proven. A sign from one able to speak is not valid in the majority view, and the Malikis allow it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17276}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17277} Acceptance may be by conduct, where the legatee deals with the thing as its owner, by sale, gift or lease. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17278} If the legatee dies after the testator without accepting, the Hanafis hold the thing passes to his heirs; the Malikis, Hanbalis and a Shafi'i view require acceptance for a named person, not mere silence, and if he dies before the testator the bequest lapses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17278} All agree that refusal after the testator's death voids the bequest; acceptance or refusal before his death counts for nothing according to the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17278}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17279} Acceptance and refusal need not come at once after death; the Shafi'is and Hanbalis let the heirs require the legatee to decide. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17279} On retracting an acceptance there are three views: the majority forbid it; some Shafi'is and Hanbalis allow it before possession; a third allows it for measured goods before possession. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17279}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17280} A partial acceptance is disputed in the Shafi'i school; Zakariyya al-Ansari prefers invalidity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17280} A named legatee of full capacity accepts or refuses for himself; an unnamed group such as the poor or the mosques needs neither; a ward accepts through his guardian for his interest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17280} If a named legatee dies after the testator without accepting, the Hanafis except Zufar hold the bequest valid by preference; Zufar and a Hanbali view make it the heirs' property and void it; the majority let his heirs stand in his place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17280}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17281} A bequest may be made conditional or dated to the future: the Hanafis and Shafi'is allow it; the Malikis void it when the testator says if I die of this illness and does not die of it; the Hanbalis allow a condition expected to occur after death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17281}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17283} A bequest is not binding; the testator may revoke all or part of it, in health or in sickness, as Umar is reported to have said that a man may change what he wills. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17282} Revocation may be by word, or by conduct such as sale, gift, pledge, consumption, mixing, grinding grain, spinning cotton or building on the thing. The majority hold that denying the bequest is not a revocation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17282}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17283} The testator must be sane; the Hanafis, Shafi'is and Hanbalis require puberty, while the Malikis and a Hanbali view allow a discerning minor in the matters where he is able. An insane person, the dazed and the unconscious are excluded. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17284}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17285} Freedom is required, so a slave's bequest is void; the bequest must be made freely, so one forced, joking or mistaken makes it void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17285} The majority do not require the testator to be Muslim; the Shafi'is and Hanbalis accept a non-Muslim's bequest, including an apostate's on the Shafi'i view unless he dies as an apostate, while the Malikis void an apostate's bequest during the apostasy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17286} For the Hanafis, a bequest by a non-Muslim enemy in enemy territory is valid if the thing is still there when they come under protection. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17286}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17287} The legatee must exist at the time of the bequest for the Hanafis, Shafi'is (preferred view) and Hanbalis; the Malikis and a Shafi'i and Hanbali view allow a bequest to one not yet born. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17287}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17288} The legatee must be capable of owning; a bequest to a dead person unknown to the testator is void, and the Malikis then direct it to the debts of the dead or his heirs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17288} A bequest to a foetus is valid if it is born alive within the usual period: six months from the bequest where the mother has a husband or master; four years for the Shafi'is and Hanbalis otherwise; two years for the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17288} A bequest to one of two unnamed men is void according to Abu Hanifa, Zufar, the Malikis, Shafi'is and Hanbalis; Abu Yusuf holds it valid if they agree, and Muhammad leaves the choice to the heirs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17289} A bequest to a group that cannot be counted, such as the poor, is valid; the Malikis do not require equal shares, the Shafi'is in the preferred view accept delivery to three, and the Hanbalis to one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17289} Where the legatee is a group that cannot be counted, such as the tribes of Tamim and Aqil, the bequest is void according to the Hanafis and the less favoured Shafi'i view, because the legatee must be known; it is valid where they can be counted, and the meaning of counting is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17290} A bequest to an animal itself is void; a bequest for the fodder of a named person's animal is valid and spent on its feed, and the Shafi'is and Hanbalis differ on a bequest to a particular horse or a horse held for God. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17290}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17291} A bequest by a Muslim to a public work, such as building or repairing a mosque, is valid because it is an act of devotion; the Malikis, Shafi'is and Hanbalis allow it to a lawful public purpose. A Muslim's bequest to build a church is forbidden by the majority as an act of disobedience. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17291}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17292} On bequests by non-Muslims, the Hanafis divide: what is devotion for both sides is valid; what is devotion only for Muslims is void; what is devotion only for them Abu Hanifa allows and his two companions forbid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17292} A bequest to God alone is spent on works of piety in the Shafi'i view and that of Muhammad, and his view is the one followed by the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17292} A bequest for the cause of God is spent on military expedition by the Shafi'is, Hanbalis and Abu Yusuf, and Muhammad and a Hanbali view add the pilgrimage. A bequest to works of piety goes, for the Hanbalis, to all acts of devotion beginning with the raid; for the Hanafis, to anything without transfer of ownership. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17293} If the testator says place my third where God shows you, the Hanbalis allow it to any act of devotion; the Shafi'is prefer his relatives who do not inherit, then his close kin by milk, then his neighbours. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17293} A bequest is void where the legatee killed the testator: the Hanafis, Hanbalis, a view of the Shafi'is and al-Thawri require that the legatee not be the killer, relying on the saying that a killer has no bequest, which al-Daraqutni weakened. The bar is a killing that carries retaliation, blood-money or expiation, even by mistake; the Hanafis require direct killing and an heir of the testator. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17294} The Malikis, the preferred Shafi'i view and a Hanbali report do not require this. For the Malikis, if the testator knew the cause of the killing the bequest is valid; if he did not know, there are two views, and al-Dusuqi prefers invalidity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17294}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17295} The jurists require that the legatee not be an heir at the testator's death where another heir exists, on the saying that God has given each holder of a right his right, so there is no bequest to an heir unless the heirs consent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17295} If some heirs consent and others do not, the bequest is valid for the share of those who consent, according to the majority; the Malikis and a Shafi'i and Hanbali view hold it void and require a fresh acceptance. Consent must come from a competent person and, for the majority, after the testator's death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17296} For the Malikis, consent given in the testator's illness binds, if the illness is dangerous and he does not recover; the test of who is an heir is the moment of death, not the moment of the bequest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17296}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17297} Terms about the legatee vary in meaning: a bequest to neighbours is, for Abu Hanifa, to adjoining houses; for the two companions, to adjoining houses and others in the quarter who share the mosque; for the Malikis, to adjoining houses on six sides and those across a lane; for the Shafi'is and Hanbalis, to forty houses on each side; the Hanbalis also count those who hear the call to prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17298} A bequest to relatives: for Abu Hanifa, the nearest kin in order of closeness among blood relatives within marriage's bar, excluding parents and children; for the two companions, all who trace descent to the furthest ancestor who was Muslim; for the Malikis, the paternal kin not heirs; for the Shafi'is, all kin however distant, except ascendants and descendants in the preferred view; for the Hanbalis, descendants of four forefathers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17298}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17299} A bequest to the nearest kin: the Shafi'is include ascendants and descendants; their preferred view puts a son, however distant, before a father, and a brother before a grandfather. The Hanbalis distinguish by full and half siblings. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17299}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17300} Bequests to in-laws, to relatives by marriage, to a household and to scholars have their own senses: for the Hanafis, in-laws are the blood relatives of one's wife and kin by marriage are the husbands of the forbidden kin; scholars, for the majority, are jurists and hadith specialists, to which the Shafi'is and Hanbalis add exegetes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17300}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17301} A bequest to a non-Muslim is valid for a protected person; the Hanbalis require him to be named. It is valid for a protected foreigner according to the Hanafis, Shafi'is, Malikis and Hanbalis. For an enemy: the Shafi'is in the preferred view and the Hanbalis in the sound view allow it to a named enemy, while the Hanafis and Malikis in the school forbid it in enemy territory. For an apostate, the Hanafis, Malikis and a Hanbali face forbid it, and the Shafi'is and sound Hanbali view allow it to a named apostate. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17301}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17303} The fourth pillar, the thing bequeathed, must be property; it includes cash, goods, debts owed by others, rights measured in money, and benefits that may be sold, given or hired. Ibn Abi Layla and Ibn Shubruma forbid bequests of benefits. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17303}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17304} It must be of value in law: a bequest by or to a Muslim of wine, pork, a savage dog or a beast unfit for hunting is void; a Christian may bequeath what is of value in his belief; a trained dog or a beast fit for hunting may be bequeathed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17304} Only property of value may be bequeathed; a bequest of a skin before tanning is valid for the Shafi'is, and a bequest of a gold or silver vessel is valid, since it may be used when not in use as an ornament or sold. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17305} Some jurists require that what is bequeathed be capable of transfer by contract after death: the Hanafis and a Shafi'i view require it; a bequest of a year's dates from palm trees is valid, and the Hanafis reject a bequest of what a flock will bear. The majority allow bequests of what does not yet exist, as in sale by salam and in tending orchards and leasing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17305}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17306} A bequest of an unknown thing, such as one sheep from his flock, and of a thing one cannot deliver, such as a stray camel, is valid by agreement; a bequest of an undivided share or of a divided one is valid according to the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17305}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17306} For the Hanafis the thing must exist at a time that depends on its kind: a named property at the bequest; a share of the whole estate, such as a third or a quarter, at the testator's death; a share of part of the estate at the bequest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17306} The thing must belong to the testator: the Malikis, a Shafi'i view and the Hanbali school hold that a bequest of another's property is void even if he later owns it; the Hanafis, another Shafi'i view and a Hanbali view allow it as subject to the owner's consent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17306}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17307} A bequest of a forbidden thing is void, since its purpose is to make up for good done in life. A bequest is not carried out for a sum that absorbs all the estate unless the creditors release it, according to the Hanafis and Shafi'is; the Malikis hold that a testator whose estate is wholly owed cannot bequeath. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17307}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17308} Where the testator has heirs, a bequest above the third is valid only with their consent, according to the majority; if they consent it stands, and if they refuse it falls. Where there are no heirs, the Hanafis let the bequest take the whole estate. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17308} On a bequest of a share of property: for Abu Hanifa and the Hanbali school the legatee takes a sixth where the division has fewer than six shares; other views fix it at the smallest heir's share, or a third, or a sixth. The Malikis distinguish according to whether the estate is subject to the 'awl. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17309}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17310} A bequest of a part or portion of property is, if not explained by the testator in his life, given by the heirs as they wish after death, according to the Hanafis, Shafi'is and Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17310} A bequest of a sheep covers the young or old, male or female, according to the context; the Hanbalis give what the name normally covers. A bequest of an animal is interpreted by custom as a horse, mule or donkey; a bequest of a dog that the testator does not own is void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17310}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17311} A bequest of a drum of war is valid for one of them; a bequest of an instrument for amusement is valid if it can be used for a lawful purpose. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17311} A bequest of benefits is valid according to the majority, and its value is taken from the third; if it exceeds the third it is allowed only up to the third. For the Hanafis, the benefit returns to the owner of the thing when the legatee dies. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17311}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17314} A bequest of benefits for a set year is counted against the third by the loss of value of the thing during the period; where the benefit is shared between the legatee and the heirs it is divided by rent, by division of the thing if divisible, or by alternation of time or place. The bequest ends when the period ends before death, when the legatee gives up his right, and, in the Hanafi view, when he dies before taking it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17312}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17315}"
