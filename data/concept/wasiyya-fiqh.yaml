label:
  ar: "وَصِيَّة"
  en: "Wasiyya (bequest, fiqh)"
  es: "Legado (fiqh)"
  fr: "Legs (fiqh)"
  ur: "وصیت ⁦(فقہ)⁩"
summary:
  ar: "الوصية في اللغة من وصيت الشيء بالشيء أصِيه، أي وصلته، وتُطلق على الموصى به. وفي الاصطلاح الوصية بالمال تمليك مضاف إلى ما بعد الموت بطريق التبرع، سواء في الأعيان أو المنافع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17270} والإيصاء والوصاية والهبة والصدقة ألفاظ ذات صلة: فالوصية تمليك بعد الموت، والهبة في الحياة بلا عوض، والصدقة في الحياة لمحتاج لأجل الثواب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17270}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17271} والوصية مشروعة بالكتاب والسنة والإجماع: فالقرآن قدّم الوصية والدين على الميراث، والسنة قدّمت الدين على الوصية؛ وجاء في حديث سعد بن أبي وقاص أن الثلث كثير، وأن ترك الورثة أغنياء خير من تركهم عالة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17271} وفي حديث معاذ أن الله تصدّق بثلث الأموال عند الوفاة زيادةً في الحسنات، وفي حديث ابن عمر أن المسلم لا ينبغي أن يبيت ليلتين إلا ووصيته مكتوبة عنده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17272} وحكمة مشروعيتها تحصيل ذكر الخير والثواب، وصلة القرابة غير الوارثين، ونفع المحتاجين، بشرط ألا يُضار فيها أحد، وأن تُقصر على الثلث، وألا تنفذ لوارث إلا بإجازة الورثة منعاً للتباغض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17272}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17273} والجمهور على أن الوصية بجزء من المال ليست بواجبة، بل مستحبة لمن ترك خيراً، ونُسخ الوجوب في حق الوارثين بحديث «لا وصية لوارث»، وبقي الاستحباب في حق من لا يرث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17273} ويُستحب أن لا يستوعب الموصي الثلث، والحنابلة يرون الخمس أفضل للغني، ونُقل عن ابن عباس وجماعة استحباب الربع. وإذا كان الورثة فقراء استُحب النقص من الثلث، والفقير ذو الورثة المحتاجين لا يُستحب له أن يوصي عند الحنفية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17274}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17275} وذهب بعض السلف، كالزهري وطاوس ومسروق وغيرهم، إلى وجوب الوصية للأقربين غير الوارثين، واحتجوا بالآية وبحديث ابن عمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17275} وأركان الوصية عند الجمهور أربعة: صيغة وموصٍ وموصى له وموصى به. وعند الحنفية الركن الإيجاب والقبول عند أبي حنيفة وصاحبيه، وعند زفر الإيجاب وحده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17275}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17276} والصيغة كل لفظ يدل على التمليك بعد الموت، وتنعقد بالكتابة عند الجمهور، والشافعية يعدّونها كناية لا تنعقد إلا بالنية، والحنابلة يشترطون ثبوت خط الموصي، والإشارة من القادر على النطق لا تنعقد عند الجمهور، ويجيزها المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17276}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17277} قبول الوصية أو ردها بالدلالة: أن يتصرف الموصى له في الموصى به تصرف الملاك كالبيع والهبة والإجارة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17278} وإذا مات الموصى له بعد موت الموصي وقبل القبول دخل الموصى به في ملك ورثته عند الحنفية، لأن الوصية تمت من جهة الموصي بموته؛ وذهب المالكية والحنابلة والشافعية في قول إلى اشتراط القبول لمعيّن، ولا يكفي عدم الرد، فإن مات الموصى له قبل موت الموصي بطلت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17278} واتفق الفقهاء على أن الوصية تبطل برد الموصى له بعد موت الموصي، ولا عبرة بالقبول أو الرد قبل موت الموصي عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17278}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17279} ولا يشترط أن يكون القبول أو الرد فوراً بعد الموت، بل هما على التراخي، وأضاف الشافعية والحنابلة أن للوارث مطالبة الموصى له بالقبول أو الرد، فإن امتنع حكم القاضي بالرد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17279} وفي الرجوع عن القبول ثلاثة آراء: الجمهور لا يجوز الرد بعد القبول، والشافعية والحنابلة في قول يجيزونه قبل القبض، وقول ثالث يجيزه في المكيل والموزون قبل القبض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17279}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17280} وفي تجزؤ القبول: احتمالان عند الشافعية، والراجح عند زكريا الأنصاري البطلان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17280} والموصى له المعين يملك القبول أو الرد بنفسه إن كان كامل الأهلية، والموصى له غير المعين أو الجماعة غير المحصورة كالفقراء والمساجد لا يحتاج إلى قبول، والمحجور عليه يقبل له وليه بما فيه الحظ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17280} وإذا مات الموصى له المعين بعد موت الموصي دون قبول ولا رد، فللحنفية غير زفر قول بالصحة استحساناً، وقال زفر وبعض الحنابلة يكون الموصى به لورثة الموصي فتبطل، وجمهور الفقهاء يجعلون ورثة الموصى له يقومون مقامه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17280}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17281} وتعليق الوصية على شرط أو إضافتها إلى المستقبل جائز بالاتفاق عند الحنفية والشافعية، وعند المالكية تبطل إن قال: إن مت من مرضي هذا فلفلان كذا ولم يمت منه، وعند الحنابلة تصح إذا كانت الصفة يرتقب وقوعها بعد الموت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17281}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17283} والوصية عقد غير لازم، ويجوز للموصي الرجوع عنها كلها أو بعضها في حياته مرضاً أو صحة، لأثر عمر «يغيّر الرجل ما شاء في وصيته». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17282} والرجوع يكون بالقول كنقض الوصية وإبطالها، وبالدلالة كالبيع والهبة والرهن واستهلاك الموصى به، وخلطه، وطحن الحنطة وغزل القطن ونحو ذلك. وجمهور الفقهاء يرون جحود الوصية ليس رجوعاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17282}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17283} والموصي يشترط فيه أن يكون أهلاً للتبرع: العقل فلا تصح من المجنون والمعتوه والمغمى عليه؛ والبلوغ فيشترطه الحنفية والشافعية في المذهب والحنابلة في قول، ويجيزها المالكية والحنابلة في المذهب والشافعية في قول لمميز، ويجيز المالكية وصية المميز ممن بلغ عشر سنين فأقل بحسب حاله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17284}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17285} والحرية شرط عند الفقهاء فلا تصح وصية العبد، والرضا والاختيار شرط فلا تصح وصية المكره والهازل والمخطئ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17285} ولا يشترط إسلام الموصي عند الجمهور، فتصح وصية غير المسلم، ونص الشافعية والحنابلة على صحة وصية الكافر ولو كان حربياً، وقيّد الشافعية صحة وصية المرتد بألا يموت كافراً، وأبطلها المالكية في حال الردة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17286} وفي وصية المستأمن الحربي عند الحنفية تفصيل: تنفذ إن كانت قائمة بعينها إذا أسلم أهل داره أو صاروا ذمة، فإن استُهلكت بطلت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17286}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17287} والموصى له هو من تبرع له الموصي بجزء من ماله بعد وفاته، ويشترط أن يكون موجوداً حال الوصية عند الحنفية والشافعية في الأصح والحنابلة في المذهب، وأجازها المالكية والشافعية في مقابل الأصح والحنابلة في قول لمن سيوجد، كالحمل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17287}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17288} ويشترط أن يكون الموصى له أهلاً للتملك، فإن أوصى لميت لا يعلم الموصي بموته بطلت، والمالكية يصرفونه لدين الميت أو لورثته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17288} والوصية للحمل صحيحة إن وُجد حال الوصية، ويُعلم وجوده بولادته حياً لأقل من ستة أشهر، وعند الشافعية والحنابلة لأقل من أربع سنين إن لم تكن الأم ذات زوج أو سيد، وعند الحنفية لسنتين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17288} ويشترط أن يكون الموصى له معلوماً، فلو أوصى لأحد رجلين فالوصية باطلة عند أبي حنيفة وزفر والمالكية والشافعية والحنابلة، وأجازها أبو يوسف إن اصطلحا، وقال محمد الخيار للورثة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17289} والوصية لجماعة لا يمكن حصرهم كالفقراء والمساكين صحيحة، ثم اختلفوا في وجوب التعميم: المالكية لا يلزمونه، والشافعية في الأظهر يكفي الدفع إلى ثلاثة، والحنابلة يكفي الدفع إلى واحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17289} وإذا أوصى لقبيلة لا تُحصى كتميم وعقيل فالوصية باطلة عند الحنفية والشافعية في مقابل الأظهر، لاشتراط أن يكون الموصى له معلوماً، وتصح إن كانوا يُحصَون؛ وفي تفسير الإحصاء أقوال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17290} والوصية لذات الدابة باطلة، وأما الوصية لعلف دابة فلان فجائزة وتُصرف في علفها، وللشافعية والحنابلة تفصيل في الوصية لفرس بعينه أو لفرس حبيس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17290}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17291} والوصية للجهة العامة كبناء المسجد وترميمه صحيحة من المسلم لأنها قربة، وأجاز المالكية والشافعية والحنابلة الوصية لجهة مباحة. ولا تجوز وصية المسلم لبناء كنيسة أو بيعة عند الجمهور لأنها معصية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17291}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17292} وفي وصايا أهل الذمة عند الحنفية تفصيل: ما هو قربة عندنا وعندهم يجوز بالاتفاق، وما هو قربة عندنا فقط لا يجوز، وما هو قربة عندهم فقط فيجوزه أبو حنيفة ويمنعه الصاحبان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17292} والوصية لله تعالى تصرف في وجوه البر عند الشافعية ومحمد بن الحسن، وبقوله يُفتى عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17292} والوصية في سبيل الله تُصرف عند الشافعية والحنابلة وأبي يوسف في الغزو، ويزيد محمد والحنابلة في قول الحج. والوصية لأعمال البر تُصرف عند الحنابلة في القُرب كلها ويُبدأ بالغزو، وعند الحنفية كل ما ليس فيه تمليك من أعمال البر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17293} وإذا قال الموصي: ضعوا ثلثي حيث أراك الله، فالحنابلة يصححونه ويصرف في أي جهة قربة، والشافعية يرون صرفه إلى أقاربه الذين لا يرثونه ثم إلى محارمه ثم إلى جيرانه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17293} الوصية لقاتل الموصي: يشترطها ألا يكون الموصى له قاتلاً عند الحنفية والحنابلة في المذهب والشافعية في مقابل الأظهر والثوري، لحديث «ليس لقاتل وصية»، وهو حديث ضعّفه الدارقطني، والقتل المانع هو المضمون بقصاص أو دية أو كفارة ولو خطأ. والحنفية يشترطون المباشرة ووجود وارث للموصي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17294} والمالكية والشافعية في الأظهر والحنابلة في رواية لا يشترطون ذلك؛ وعند المالكية إن علم الموصي بسبب القتل صحت الوصية، وإن جهله ففيه تأويلان، والظاهر عند الدسوقي عدم الصحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17294}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17295} وعند الفقهاء يشترط ألا يكون الموصى له وارثاً وقت موت الموصي إن كان هناك وارث آخر، لحديث «إن الله قد أعطى كل ذي حق حقه فلا وصية لوارث»، ومعناه أن الوصية للوارث لا تنفذ إلا بإجازة الورثة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17295} وإذا أجاز بعض الورثة دون بعض صحت الوصية في حصة المجيز وبطلت في حق غيره عند الجمهور، والمالكية وقول للشافعية وللحنابلة يرون الوصية باطلة وتحتاج إلى قبول جديد بعد الإجازة. ويشترط في المجيز أن يكون أهلاً للتبرع، وأن تكون الإجازة بعد موت الموصي عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17296} والمالكية يرون أن الإجازة في مرض الموصي تلزم بشروط، ومنها أن يكون المرض مخوفاً، وألا يصح الموصي بعدها. والعبرة بكون المستحق وارثاً وقت موت الموصي لا وقت الإيصاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17296}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17297} ووردت عبارات تتعلق بالموصى له تختلف في معناها عند الفقهاء: فالوصية للجيران عند أبي حنيفة للملاصقين، والصاحبان للملاصقين ومن يسكن المحلة ويجمعهم مسجدها، والمالكية للملاصقين من الجهات الست وللمقابلين بزقاق صغير، والشافعية في المذهب والحنابلة لأربعين داراً من كل جانب، والحنابلة أيضاً لمن يسمع النداء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17298} والوصية للأقارب عند أبي حنيفة للأقرب فالأقرب من كل ذي رحم محرم، دون الوالدين والولد؛ والصاحبان لكل من ينسب إلى أقصى أب له في الإسلام؛ والمالكية لأقارب أبيه غير الورثة؛ والشافعية لكل قرابة وإن بعدت، إلا الأصل والفرع في الأصح؛ والحنابلة لأولاد الآباء الأربعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17298}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17299} والوصية لأقرب الأقارب عند الشافعية تشمل الأصل والفرع، والأصح تقديم الابن وإن سفل على الأب، وتقديم الأخ على الجد، والحنابلة يفصّلون بين الأبوين والأب والأم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17299}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17300} والوصية للأصهار والأختان والآل والعلماء لها تفصيل عند الحنفية: فالأصهار كل ذي رحم محرم من امرأته، والأختان أزواج المحارم، والآل آل بنيه وقبيلته، والعلماء عند الجمهور أهل الفقه والحديث، وأضاف الشافعية والحنابلة أهل التفسير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17300}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17301} والوصية لغير المسلم: تصح للذمي عند الفقهاء، واشترط الحنابلة أن يكون معيناً؛ وتصح للمستأمن عند الحنفية والشافعية والمالكية والحنابلة؛ وللحربي ثلاثة أقوال: الشافعية في الأصح والحنابلة في الصحيح يجيزونها للحربي المعيّن، والحنفية والمالكية في المذهب يمنعونها في دار الحرب؛ وللمرتد الحنفية والمالكية والحنابلة في وجه يمنعونها، والشافعية والحنابلة في الصحيح يجيزونها للمعيّن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17301}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17303} والركن الرابع الموصى به: يشترط أن يكون مالاً، فيشمل النقد والعين والديون والحقوق المقدرة بمال، والمنافع التي تُباع وتُوهب وتُؤجر؛ وخالف ابن أبي ليلى وابن شبرمة في الوصية بالمنافع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17303}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17304} ويشترط أن يكون متقوّماً في الشرع: فلا تصح من مسلم ولا لمسلم بالخمر والخنزير والكلب العقور والسباع التي لا تصلح للصيد، وتصح من النصراني لمثله بما يتقوم عنده، وتجوز بالكلب المعلم والسباع الصالحة للصيد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17304} ويشترط أن يكون ما أوصي به من المال متقوماً؛ وتصح الوصية بجلد ميتة قابل للدباغ عند الشافعية، والوصية بإناء ذهب أو فضة جائزة لأنه مال يُنتفع به في غير حال الاستعمال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17305} والوصية بالمال القابل للتمليك بعد الموت بعقد: الحنفية والشافعية في قول يشترطون ذلك، فتصح بثمر نخيل عام أو أبداً، ولا تصح عند الحنفية استحساناً بما تلده أغنامه، والجمهور يصححون الوصية بالمعدوم مطلقاً كالسلم والمساقاة والإجارة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17305}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17306} وتصح الوصية بالمجهول كشاة من غنمه بالاتفاق، وبما لا يُقدر على تسليمه كالبعير الشارد. وتجوز بالمشاع والمقسوم عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17305}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17306} وعند الحنفية يُشترط وجود الموصى به في المستقبل وفق نوع المال: إن كان معيناً بذاته كدار معينة يُشترط وجوده عند الوصية، وإن كان شائعاً في كل المال كالثلث أو الربع فعند موت الموصي، وإن كان شائعاً في بعض المال فعند الوصية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17306} ويُشترط أن يكون الموصى به مملوكاً للموصي: فعند المالكية والشافعية في وجه والحنابلة في المذهب لا تصح الوصية بمال الغير ولو ملكه بعد الوصية، وعند الحنفية والشافعية في وجه آخر والحنابلة في قول تصح موقوفة على إجازة المالك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17306}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17307} ويمتنع بيع أو وصية بمحرم، لأن القصد من الوصية تدارك الإحسان، ولا تنفذ الوصية بما استغرقه الدين إلا بإبراء الغرماء عند الحنفية والشافعية، والمالكية يرون وصية المستغرق الذمة لا تنعقد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17307}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17308} والوصية في الثلث: إن كان للموصي وارث لا تنفذ الزيادة عن الثلث إلا بإجازة الورثة عند الجمهور، فإن أجازوا نفذت، وإن ردوا بطلت. وإن لم يكن له وارث فعند الحنفية تكون الوصية في جميع المال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17308} وأما الوصية بسهم من المال فلها أقوال: منها أن يكون للموصى له السدس إن كانت الفريضة أقل من ستة أسهم عند أبي حنيفة والحنابلة في المذهب، ومنها مثل أقل سهام الورثة، والمالكية لهم تفصيل بحسب العول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17309}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17310} والوصية بجزء أو حظ من المال مجملة، فيعطيه الورثة ما شاؤوا بعد الموت إن لم يبيّن الموصي، عند الحنفية والشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17310} والوصية بشاة تشمل الصغيرة والكبيرة والذكر والأنثى بحسب القرينة، وعند الحنابلة تُعطى ما يقع عليه الاسم عرفاً، والوصية بدابة تُعطى فرساً أو بغلاً أو حماراً بالعرف، والوصية بكلب لا كلب له باطلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17310}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17311} والوصية بطبل من طبول الحرب تُعطى واحداً منها، وبطبول اللهو تصح إن صلح لمنفعة مباحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17311} والوصية بالمنافع جائزة عند جمهور الفقهاء، وتُخرج قيمتها من الثلث، فإن لم تخرج أُجيز منها بقدر الثلث. وإذا مات الموصى له بالمنفعة عند الحنفية عادت المنفعة إلى صاحب العين؛ وعند الشافعية والحنابلة تُورث الوصية على تفصيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17311}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17314} والوصية بالمنفعة المؤقتة بسنة معينة تُحسب من الثلث بحسب ما نقصته المنفعة، وإذا وُصّي بمنفعة عبد لواحد ورقبته لآخر فالرقبة لصاحب الرقبة والخدمة لصاحب الخدمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17312}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17313} والمنفعة المشتركة بين الموصى له والورثة تُستوفى بقسمة الغلة، أو قسمة العين إن قبلت القسمة، أو مهايأة زمانية أو مكانية، وانتهاء الوصية بالمنفعة يكون بمضي المدة قبل الوفاة، أو إسقاط الموصى له حقه، وعند الحنفية بوفاته قبل الاستيفاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17314}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17315} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17315} منع الموصى له من الانتفاع بالعين الموصى بمنفعتها: عند الحنفية إن منعه أحد الورثة ضمن له بدل المنفعة، وإن منعه الجميع ضمنوا كذلك، وليس له أن يطالب بمدة أخرى بعد فوات المدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17316} وعند المالكية من فوّت المنفعة ضمنها، وعند الشافعية والحنابلة كل حق تعلق بالعين تعلق ببدلها، فإذا قُتل الحيوان الموصى بمنفعته اشتُري بالقيمة ما يقوم مقامه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17316} وقال الشافعية: لو أوصى لشخص بمنفعة دار سنة ثم أجّرها الموصي ومات عقب الإجارة بطلت الوصية، وإن مات بعد ستة أشهر بطلت في النصف الأول واستحق الموصى له النصف الباقي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17316} ونفقة العين الموصى بمنفعتها على صاحب المنفعة عند الحنفية والمالكية والحنابلة في المذهب، وعند الشافعية على مالك الرقبة في الأصح في المؤبدة وكالمأجورة في المؤقتة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17317} وتصح الوصية بحقوق الارتفاق التي تنتقل بالإرث كحق الشرب والمسيل والمجرى، ويُفصَّل في الوصية بما يتضمن قسمة التركة بين الورثة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17317} والوصية لكل وارث بقدر حصته شائعاً لغو عند الشافعية لأنه يستحقه بغير الوصية، والوصية لكل وارث بعين تفتقر عند الشافعية في الأصح إلى إجازة الورثة لاختلاف الأغراض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17318} وفي ثبوت ملكية الموصى به: الموصى له المعين عند الحنابلة في المذهب والمالكية والشافعية في قول لا يملك إلا بالقبول بعد الموت فيكون النماء قبل القبول للورثة؛ والحنفية والمالكية في الراجح يجعلون النماء بعد الموت للموصى له؛ والشافعية في الأظهر يوقفون الملك على القبول أو الرد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17318} وتنفذ التبرعات الموصى بها من ثلث المال بعد تجهيز الميت ووفاء ديون العباد؛ وأما ديون الله كالحج والزكاة والنذر والكفارة فتخرج عند الحنفية من الثلث فقط، وعند الجمهور من أصل التركة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17319} وتبطل الوصية عند الحنفية بالجنون المطبق ونحوه الطارئ على الموصي، سواء اتصل بالموت أو أفاق قبله، والجنون المطبق عند أبي يوسف شهر فأكثر، وعند محمد سنة؛ ولا تبطل بالإغماء ولا بالجنون غير المطبق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17319} وقال ابن النجار: المبرسم لا تصح وصيته، لكن إن كان يفيق أحياناً فأوصى حال إفاقته صحت. وصرح الشافعية بأن طروء الجنون على الموصي لا يبطل الوصية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17320} ردة الموصي تبطل الوصية عند الحنفية والمالكية، وأضاف المالكية أنه إن رجع إلى الإسلام جازت الوصية المكتوبة وإلا فلا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17320} ردة الموصى له لا تبطلها عند الشافعية وبعض المالكية، وتبطلها عند المالكية في المذهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17320} والوصية عقد غير لازم فللموصي الرجوع عنها متى شاء، لأثر عمر «يغير الرجل ما شاء من وصيته»، وقال الشعبي وابن سيرين وابن شبرمة والنخعي يغيّر ما شاء إلا العتق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17320} والرجوع إما صريح كقول الموصي رجعت عن وصيتي أو نقضتها، وهو متفق عليه، وإما دلالة كالتصرف الذي يخرج العين عن ملكه كالبيع والهبة والصدقة والوقف، أو الفعل فيها كذبح الشاة وغزل القطن ونسج الغزل، أو التصرف الذي يزيل اسم الشيء كطحن الحنطة وتحويل الخشبة باباً؛ وجحود الوصية ليس رجوعاً عند جمهور الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17321} وتبطل الوصية برد الموصى له بعد وفاة الموصي، وتبطل بموت الموصى له المعين قبل موت الموصي باتفاق، وكذلك عند الجمهور إذا مات بعد موت الموصي قبل القبول، وعند الحنفية لا تبطل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17322} وقتل الموصى له الموصي فيه خلاف، وتبطل الوصية بهلاك الموصى به المعين قبل القبول، أو باستحقاقه، لفوات محل الوصية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17322}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17323} والوصية للوارث تبطل عند الفقهاء إلا بإجازة الورثة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17323} والأصل أن الوصية لا تجوز بأكثر من ثلث المال إن كان هناك وارث، فإن زادت الوصايا على الثلث ولم يجز الورثة، تحاص الموصى لهم في الثلث بنسبة ما لكل منهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17323} وقدّم الحنفية حقوق الله على حقوق العباد إذا اجتمعت الوصايا، فيُقسم الثلث على جهات الفرائض ثم الواجبات ثم التطوعات؛ ووصايا العباد لا يُعتبر فيها التقديم إلا بنص أو لكونها عتقاً أو محاباة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17323}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17324} وإن تساوى السبب بين الموصى لهم قُسم الثلث بينهم بالتساوي عند الحنفية، وإذا أوصى لأحدهما بالكل والآخر بالثلث ولم يجز الورثة ففيه خلاف: أبو حنيفة يقسم الثلث نصفين، وأبو يوسف ومحمد يتحاصان على أربعة أسهم، والصحيح قول الإمام عند ابن عابدين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17325} وذهب المالكية إلى أن بعض الوصايا يقدَّم على بعض إذا ضاق الثلث عنها، كفك الأسير ثم تدبير الصحة ثم الزكاة ثم زكاة الفطر ثم كفارات الظهار والقتل والأيمان ثم النذر، وما كان في مرتبة واحدة يتحاص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17325} وفي تزاحم الوصايا التي لا تبدئة فيها، يتحاص أهلها في الثلث كما يتحاص الغرماء في مال المفلس، وقد أورد الكتاب أمثلة المالكية في النصف والثلث والربع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17326}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17327} وعند المالكية يدخل التحاص وصايا المجهول مع المعلوم، ويُضرب للمجهول بالثلث، وسحنون يرى المطلق بلا أجل كأنه وصية بثلث المال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17327} وعند الشافعية تتقسط التبرعات المتعلقة بالموت على الثلث بالقيمة أو المقدار، ولا يُقدَّم بعضها على بعض بالسبق، والعتق مع غيره يُقسط عليه بالقيمة، وفي قول يُقدم العتق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17328} وعند الحنابلة يقسم الثلث بين الموصى لهم على قدر وصاياهم، وروي عن أحمد تقديم العتق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17328}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17329} وكتابة الوصية مستحبة، ويبدأ الموصي بالبسملة والثناء والصلاة على النبي ثم الشهادتين ثم الإشهاد؛ ويُذكر أن الصحابة كانوا يكتبون في صدور وصاياهم هذا مع البسملة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17329}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17330} وتثبت الوصية بالشهادة والكتابة: فالحنفية والشافعية يعتبرون الكتابة إذا قُرئت على الشهود أو أقر بها الموصي، ولا يُكتفى بالخط المجرد؛ والمالكية تثبت الوصية بخط الموصي مع الإشهاد عليها؛ والحنابلة يقبلون الكتابة المعروفة الخط بإقرار الورثة أو ببينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17330}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17331} وإذا تركت الوصية أموالاً حاضرة وغائبة أو ديوناً، تنفذ الوصية من الحاضر بقدر الثلث عند الحنفية والحنابلة، وتتعلق بالعين المعينة كذلك؛ والشافعية يوقفون التصرف في الغائب حتى يحضر ما يُخرج الحاضر من الثلث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17332}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17333} وتكون الوصية بالأنصباء أو بالأجزاء أو بالجمع بينهما، ومنها الوصية بمثل نصيب أحد الورثة المعين؛ فالجمهور يستحق الموصى له نصيب ذلك الوارث مضموماً إلى المسألة، والمالكية لهم تفصيل بحسب الإجازة، والشافعية والحنابلة يعطونه مثل نصيب أقل الورثة إن تفاضلوا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17333}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17334} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17334} وفي الوصية بجزء من الورثة: إذا أوصى بجزء من ماله مساوٍ لأحد أبنائه فعند الحنفية تصح، وإن كان ابنه غير وارث فلا شيء له عند الجمهور؛ والمالكية يعطونه نصيب الابن إن قال لو كان يرث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17335}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17336} والوصية بجزء معلوم بالثلث فما دونه: يحسب بجزء المخرج من الفريضة، وإن لم ينقسم الباقي على الورثة تُضرب مسألة الورثة في مخرج الوصية أو وفقهما، ويُعتبر ذلك عند المالكية والشافعية والحنابلة، ويُمثَّل لذلك بثلاثة بنين وثلث مال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17337}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17338} وفي الوصية بجزأين أو أكثر في حدود الثلث تُضرب مخارج الأجزاء بعضها في بعض، وما اجتمع مخرج للفريضتين، ومن أمثلة المالكية ثلاثة بنين مع سدس وسبع، ومن أمثلة الشافعية أبوان مع الثمن والخمس، وتُفصّل عند الحنابلة الكسور بنظيرها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17339}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17340} والوصية بأكثر من الثلث إن لم تستغرق المال تتوقف على إجازة الورثة، فإن أجازوا قُسم المال على قدر الوصايا، كمن أوصى بنصف ماله وآخر بثلثه وآخر بربعه، وتُعال الفريضة بسهم في المثال، وذلك باتفاق الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17340}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17341}\n\nوإذا ردّ الورثة الوصايا الزائدة على الثلث، اختلف الفقهاء في كيفية قسمة الثلث بين الموصى لهم. فذهب المالكية والشافعية والحنابلة وأبو يوسف ومحمد إلى أن الثلث يُقسم بين الموصى لهم على قدر سهامهم كأن الإجازة حاصلة، ويُقسم الثلثان على الورثة، ولا فرق بين من تجاوزت وصيته الثلث ومن لم تتجاوزه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17341} وذهب أبو حنيفة وأبو ثور وابن المنذر إلى أن الزيادة على الثلث تبطل عند عدم الإجازة، فلا يُضرب الموصى له بالزائد إلا بالثلث، لأن الوصية بالزائد وقعت على غير وجه مشروع فلا تنفذ، والتفضيل الثابت في ضمنها يبطل ببطلانها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17341}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17342} ومن أمثلة ذلك: من أوصى لرجل بربع ماله ولآخر بنصفه فردّ الورثة، فعند الجمهور يُقسم الثلث على ثلاثة أسهم، سهمان لصاحب النصف وسهم لصاحب الربع، وعند أبي حنيفة على سبعة أسهم، أربعة لصاحب النصف وثلاثة لصاحب الربع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17341}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17342} ومن أوصى بثلث ماله ونصفه وربعه فردّ الورثة، فعند الجمهور تُحسب القسمة من ثلاثة عشر سهماً، وعند أبي حنيفة من أحد عشر سهماً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17342}\n\nوإذا أغرقت الوصايا المال وأجازها الورثة، جرت مجرى العول في الفرائض، فتُجعل وصاياهم كالفروض التي فرضها الله للورثة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17342} فإن ردّ الورثة الزيادة على الثلث قُسم الثلث بين الموصى لهم على نسبة أنصبائهم، عند الجمهور؛ وعند أبي حنيفة وأبي ثور وابن المنذر لا يُضرب الموصى له عند عدم الإجازة بأكثر من الثلث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17342} ومن أوصى لزيد بماله كله ولعمرو بثلثه: إن أجاز الورثة عالت القسمة إلى أربعة، لزيد ثلاثة ولعمرو سهم؛ وإن ردّوا قُسم الثلث بين الموصى لهما على أربعة، وتكون القسمة من اثني عشر عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17342} وفي فقرة الحنفية عن عدم إجازة الابنين ⁦(ص 17343)⁩ تُذكر أرقام لا يتضح نصّها في المسح، فلا تُنقل هنا؛ وهي موضع شك في القراءة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17343}\n\nالحالة الثالثة: الجمع بين الوصية بالأجزاء والأنصباء، وله صور: الوصية بمثل نصيب وارث مع جزء من جميع المال، والوصية بجزء من جزء يبقى بعد النصيب، والوصية بالنصيب مع استثناء جزء من المال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17343}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17345} فمن ذلك عند الحنفية: ابنان، وأوصى لرجل بثلث المال ولآخر بمثل نصيب أحدهما، فأجازا الوصيتين فالحساب من تسعة: ثلاثة لصاحب الثلث، ويُقسم الباقي بين الابنين وصاحب النصيب أثلاثاً، فلكل ابن سهمان ولصاحب النصيب سهمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17343} وإذا أجاز الابنان لصاحب النصيب دون صاحب الثلث احتيج إلى حساب أدق، وأقل مخرجه ثمانية عشر سهماً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17343}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17344} والشافعية والحنابلة يختلفون في تنزيل الموصى له بالنصيب: فالشافعية يُدخلونه كأحد الورثة حين لا تزيد الوصية على الثلث، والحنابلة على قولين، أحدهما وهو المذهب أن لصاحب النصيب ثلث المال عند الإجازة، والآخر أن له مثل ما يحصل لأحد الابنين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17344}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17345}\n\nومن صور الوصية بجزء من جزء يبقى بعد النصيب: عند الحنفية، خمسة بنين وأوصى لرجل بمثل نصيب أحدهم ولآخر بثلث ما بقي من الثلث، فالفريضة من أحد وخمسين سهماً، لصاحب النصيب ثمانية، ولصاحب ثلث ما بقي ثلاثة، ولكل ابن ثمانية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17345} وعند المالكية ثلاثة بنين بمثال مماثل تُخرج فيه الأنصبة بالدراهم المجهولة، وعند الشافعية والحنابلة أمثلة بالتصحيح والجبر وطريقة التعديل بالخطأ الأول والثاني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17345}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17346}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17347}\n\nوفي الوصية بالنصيب مع استثناء جزء من المال، عند الحنابلة: ابن واحد أوصى لرجل بمثل نصيبه إلا نصف المال، فالموصى له يأخذ ربع المال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17347} ومثال الاستثناء من النصيب بسبع المال على ثلاثة بنين يُعمل على مخرج يبلغ ثلاثة وستين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17348}\n\nوالاستثناء مع ذكر الأنصباء والكسور على أربعة أضرب: الأول أن يكون المستثنى جزءاً مما يبقى بعد النصيب، وفيه مثال خمسة بنين بفريضة من سبعة وخمسين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17348} والثاني أن يكون المستثنى جزءاً مما يبقى بعد الوصية، ومثاله ثلاثة بنين وربع الباقي بعد الوصية، والمخرج ثلاثة عشر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17349} والثالث أن يكون المستثنى جزءاً مما يبقى من جزء بعد الوصية، وفيه ثلاثة بنين ونصف الباقي من الثلث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17349} والرابع أن يكون المستثنى جزءاً مما يبقى من جزء المال بعد النصيب، ومثاله ثلاثة بنين وثلث ما يبقى من ثلث المال، والفريضة تسعة وثلاثون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17349}\n\nوإذا أطلق الموصي الاستثناء فلم يقل بعد النصيب ولا بعد الوصية، ففيه رأيان: الأول يُحمل على ما بعد النصيب، لأن المذكور هو النصيب، وعزاه ابن قدامة إلى جمهور الفقهاء. والثاني يُحمل على الباقي بعد الوصية، لأن المستثنى يكون حينئذ أكثر فيقل نصيب الموصى له، وتُنزّل الوصايا على الأقل المتيقن؛ وهذا قول أكثر الشافعية، وعزاه ابن قدامة إلى محمد بن الحسن الشيباني وإلى البصريين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17349}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17350} ويذكر ابن قدامة في كتاب الوصايا أن الوصية بالمال هي التبعة به بعد الموت، وأن أصلها الكتاب والسنة والإجماع، وأنها لا تجب إلا على من عليه دين أو عنده وديعة أو واجب يُوصي بالخروج منه، فالوصية بجزء من المال ليست واجبة على أحد في قول الجمهور مع شذوذ طائفة أوجبتها. {cite:mughni-ibn-qudama p.1387} وفي الوصية للأقارب رأى أكثر أهل العلم أن الإيصاء لغير الوارثين جائز وإن تُرك أقارب الموصي، وخالفهم طاوس والضحاك وعبد الملك بن يعلى فقالوا يُنزع عن الموصى له ويرد إلى قرابته، وقال سعيد بن المسيب والحسن وجابر بن زيد للذي أوصى له ثلث الثلث والباقي يرد إلى قرابة الميت. {cite:mughni-ibn-qudama p.1389}{cite:mughni-ibn-qudama p.1390} ولا وصية لوارث إلا أن يجيزها الورثة إجماعاً، فإن أجازتها جازت في قول الجمهور، ونقل عن بعض الحنابلة أن الوصية باطلة وإن أجازها سائر الورثة إلا أن يعطوه عطيّة مبتدأة. {cite:mughni-ibn-qudama p.1390} ولا تصح الوصية بمعصية وفعل محرم كأن يوصي ببناء كنيسة أو بيت نار عند الشافعي وأبي ثور، وأجازها أصحاب الرأي، وفي الوصية للقاتل اختلف أصحاب أحمد على ثلاثة أوجه: أجازها ابن حامد وأبو الخطاب في وصية صدرت بعد الجرح، وأجازها الثوري وأصحاب الرأي. {cite:mughni-ibn-qudama p.1434-1435}{cite:mughni-ibn-qudama p.1436-1437} والعطايا المعلقة بالموت كالوصية في حكمها فتتساوى مقدمها ومؤخرها، بخلاف العطايا المنجزة التي يقدَّم أولها فالأول. {cite:mughni-ibn-qudama p.1458}"
  en: "In the lexicon wasiyya comes from joining one thing to another and can also name the thing bequeathed. Technically a bequest of property is a gift made by way of kindness and attached to the time after death, whether of things or of benefits. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17270} Related terms are the commission ⁦(ايصاء)⁩, the executorship (wisaya), the gift, which is in life and without return, and alms, which is in life to one in need seeking reward. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17270}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17271} The bequest is lawful by the Qur'an, the Sunna and consensus. The Qur'an places the bequest and the debt before inheritance, and the sunna places the debt before the bequest; a report from Sa'd ibn Abi Waqqas holds a third to be much, and that leaving heirs rich is better than leaving them in need. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17271} A report from Mu'adh says God gives charity of a third at death as an increase in good deeds, and a report from Ibn Umar says a Muslim who has a bequest should not spend two nights without it written by him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17272} Its purpose is to gain remembrance and reward, to give to relatives who do not inherit and to help the needy, on condition that no one is harmed, that it stays within a third, and that it is not valid for an heir without the consent of the other heirs, to prevent hatred. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17272}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17273} Most jurists hold that a bequest of part of the property is not obligatory but recommended for one who leaves good; the obligation was abrogated for heirs by the report that there is no bequest to an heir, and recommendation remains for non-heirs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17273} A bequest of less than a third is preferred; the Hanbalis say a fifth is better for the rich; Ibn Abbas and others preferred a quarter. Where heirs are poor the bequest is reduced, and a poor man with needy heirs is not advised to bequeath, in the Hanafi and Hanbali views. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17274}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17275} Some early authorities, such as al-Zuhri, Masruq and Tawus, held the bequest obligatory for relatives who do not inherit, relying on the verse on bequests and the report of Ibn Umar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17275} The pillars of the bequest are, for the majority, four: the formula, the testator, the legatee and the thing bequeathed. For the Hanafis the pillar is offer and acceptance according to Abu Hanifa and his two companions, and offer alone according to Zufar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17275}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17276} The formula is any word showing transfer after death. The majority accept a bequest in writing; the Shafi'is treat writing as an allusion requiring intention, and the Hanbalis require the testator's hand to be proven. A sign from one able to speak is not valid in the majority view, and the Malikis allow it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17276}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17277} Acceptance may be by conduct, where the legatee deals with the thing as its owner, by sale, gift or lease. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17278} If the legatee dies after the testator without accepting, the Hanafis hold the thing passes to his heirs; the Malikis, Hanbalis and a Shafi'i view require acceptance for a named person, not mere silence, and if he dies before the testator the bequest lapses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17278} All agree that refusal after the testator's death voids the bequest; acceptance or refusal before his death counts for nothing according to the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17278}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17279} Acceptance and refusal need not come at once after death; the Shafi'is and Hanbalis let the heirs require the legatee to decide. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17279} On retracting an acceptance there are three views: the majority forbid it; some Shafi'is and Hanbalis allow it before possession; a third allows it for measured goods before possession. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17279}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17280} A partial acceptance is disputed in the Shafi'i school; Zakariyya al-Ansari prefers invalidity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17280} A named legatee of full capacity accepts or refuses for himself; an unnamed group such as the poor or the mosques needs neither; a ward accepts through his guardian for his interest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17280} If a named legatee dies after the testator without accepting, the Hanafis except Zufar hold the bequest valid by preference; Zufar and a Hanbali view make it the heirs' property and void it; the majority let his heirs stand in his place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17280}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17281} A bequest may be made conditional or dated to the future: the Hanafis and Shafi'is allow it; the Malikis void it when the testator says if I die of this illness and does not die of it; the Hanbalis allow a condition expected to occur after death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17281}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17283} A bequest is not binding; the testator may revoke all or part of it, in health or in sickness, as Umar is reported to have said that a man may change what he wills. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17282} Revocation may be by word, or by conduct such as sale, gift, pledge, consumption, mixing, grinding grain, spinning cotton or building on the thing. The majority hold that denying the bequest is not a revocation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17282}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17283} The testator must be sane; the Hanafis, Shafi'is and Hanbalis require puberty, while the Malikis and a Hanbali view allow a discerning minor in the matters where he is able. An insane person, the dazed and the unconscious are excluded. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17284}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17285} Freedom is required, so a slave's bequest is void; the bequest must be made freely, so one forced, joking or mistaken makes it void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17285} The majority do not require the testator to be Muslim; the Shafi'is and Hanbalis accept a non-Muslim's bequest, including an apostate's on the Shafi'i view unless he dies as an apostate, while the Malikis void an apostate's bequest during the apostasy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17286} For the Hanafis, a bequest by a non-Muslim enemy in enemy territory is valid if the thing is still there when they come under protection. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17286}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17287} The legatee must exist at the time of the bequest for the Hanafis, Shafi'is (preferred view) and Hanbalis; the Malikis and a Shafi'i and Hanbali view allow a bequest to one not yet born. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17287}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17288} The legatee must be capable of owning; a bequest to a dead person unknown to the testator is void, and the Malikis then direct it to the debts of the dead or his heirs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17288} A bequest to a foetus is valid if it is born alive within the usual period: six months from the bequest where the mother has a husband or master; four years for the Shafi'is and Hanbalis otherwise; two years for the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17288} A bequest to one of two unnamed men is void according to Abu Hanifa, Zufar, the Malikis, Shafi'is and Hanbalis; Abu Yusuf holds it valid if they agree, and Muhammad leaves the choice to the heirs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17289} A bequest to a group that cannot be counted, such as the poor, is valid; the Malikis do not require equal shares, the Shafi'is in the preferred view accept delivery to three, and the Hanbalis to one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17289} Where the legatee is a group that cannot be counted, such as the tribes of Tamim and Aqil, the bequest is void according to the Hanafis and the less favoured Shafi'i view, because the legatee must be known; it is valid where they can be counted, and the meaning of counting is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17290} A bequest to an animal itself is void; a bequest for the fodder of a named person's animal is valid and spent on its feed, and the Shafi'is and Hanbalis differ on a bequest to a particular horse or a horse held for God. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17290}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17291} A bequest by a Muslim to a public work, such as building or repairing a mosque, is valid because it is an act of devotion; the Malikis, Shafi'is and Hanbalis allow it to a lawful public purpose. A Muslim's bequest to build a church is forbidden by the majority as an act of disobedience. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17291}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17292} On bequests by non-Muslims, the Hanafis divide: what is devotion for both sides is valid; what is devotion only for Muslims is void; what is devotion only for them Abu Hanifa allows and his two companions forbid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17292} A bequest to God alone is spent on works of piety in the Shafi'i view and that of Muhammad, and his view is the one followed by the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17292} A bequest for the cause of God is spent on military expedition by the Shafi'is, Hanbalis and Abu Yusuf, and Muhammad and a Hanbali view add the pilgrimage. A bequest to works of piety goes, for the Hanbalis, to all acts of devotion beginning with the raid; for the Hanafis, to anything without transfer of ownership. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17293} If the testator says place my third where God shows you, the Hanbalis allow it to any act of devotion; the Shafi'is prefer his relatives who do not inherit, then his close kin by milk, then his neighbours. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17293} A bequest is void where the legatee killed the testator: the Hanafis, Hanbalis, a view of the Shafi'is and al-Thawri require that the legatee not be the killer, relying on the saying that a killer has no bequest, which al-Daraqutni weakened. The bar is a killing that carries retaliation, blood-money or expiation, even by mistake; the Hanafis require direct killing and an heir of the testator. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17294} The Malikis, the preferred Shafi'i view and a Hanbali report do not require this. For the Malikis, if the testator knew the cause of the killing the bequest is valid; if he did not know, there are two views, and al-Dusuqi prefers invalidity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17294}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17295} The jurists require that the legatee not be an heir at the testator's death where another heir exists, on the saying that God has given each holder of a right his right, so there is no bequest to an heir unless the heirs consent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17295} If some heirs consent and others do not, the bequest is valid for the share of those who consent, according to the majority; the Malikis and a Shafi'i and Hanbali view hold it void and require a fresh acceptance. Consent must come from a competent person and, for the majority, after the testator's death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17296} For the Malikis, consent given in the testator's illness binds, if the illness is dangerous and he does not recover; the test of who is an heir is the moment of death, not the moment of the bequest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17296}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17297} Terms about the legatee vary in meaning: a bequest to neighbours is, for Abu Hanifa, to adjoining houses; for the two companions, to adjoining houses and others in the quarter who share the mosque; for the Malikis, to adjoining houses on six sides and those across a lane; for the Shafi'is and Hanbalis, to forty houses on each side; the Hanbalis also count those who hear the call to prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17298} A bequest to relatives: for Abu Hanifa, the nearest kin in order of closeness among blood relatives within marriage's bar, excluding parents and children; for the two companions, all who trace descent to the furthest ancestor who was Muslim; for the Malikis, the paternal kin not heirs; for the Shafi'is, all kin however distant, except ascendants and descendants in the preferred view; for the Hanbalis, descendants of four forefathers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17298}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17299} A bequest to the nearest kin: the Shafi'is include ascendants and descendants; their preferred view puts a son, however distant, before a father, and a brother before a grandfather. The Hanbalis distinguish by full and half siblings. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17299}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17300} Bequests to in-laws, to relatives by marriage, to a household and to scholars have their own senses: for the Hanafis, in-laws are the blood relatives of one's wife and kin by marriage are the husbands of the forbidden kin; scholars, for the majority, are jurists and hadith specialists, to which the Shafi'is and Hanbalis add exegetes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17300}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17301} A bequest to a non-Muslim is valid for a protected person; the Hanbalis require him to be named. It is valid for a protected foreigner according to the Hanafis, Shafi'is, Malikis and Hanbalis. For an enemy: the Shafi'is in the preferred view and the Hanbalis in the sound view allow it to a named enemy, while the Hanafis and Malikis in the school forbid it in enemy territory. For an apostate, the Hanafis, Malikis and a Hanbali face forbid it, and the Shafi'is and sound Hanbali view allow it to a named apostate. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17301}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17303} The fourth pillar, the thing bequeathed, must be property; it includes cash, goods, debts owed by others, rights measured in money, and benefits that may be sold, given or hired. Ibn Abi Layla and Ibn Shubruma forbid bequests of benefits. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17303}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17304} It must be of value in law: a bequest by or to a Muslim of wine, pork, a savage dog or a beast unfit for hunting is void; a Christian may bequeath what is of value in his belief; a trained dog or a beast fit for hunting may be bequeathed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17304} Only property of value may be bequeathed; a bequest of a skin before tanning is valid for the Shafi'is, and a bequest of a gold or silver vessel is valid, since it may be used when not in use as an ornament or sold. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17305} Some jurists require that what is bequeathed be capable of transfer by contract after death: the Hanafis and a Shafi'i view require it; a bequest of a year's dates from palm trees is valid, and the Hanafis reject a bequest of what a flock will bear. The majority allow bequests of what does not yet exist, as in sale by salam and in tending orchards and leasing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17305}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17306} A bequest of an unknown thing, such as one sheep from his flock, and of a thing one cannot deliver, such as a stray camel, is valid by agreement; a bequest of an undivided share or of a divided one is valid according to the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17305}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17306} For the Hanafis the thing must exist at a time that depends on its kind: a named property at the bequest; a share of the whole estate, such as a third or a quarter, at the testator's death; a share of part of the estate at the bequest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17306} The thing must belong to the testator: the Malikis, a Shafi'i view and the Hanbali school hold that a bequest of another's property is void even if he later owns it; the Hanafis, another Shafi'i view and a Hanbali view allow it as subject to the owner's consent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17306}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17307} A bequest of a forbidden thing is void, since its purpose is to make up for good done in life. A bequest is not carried out for a sum that absorbs all the estate unless the creditors release it, according to the Hanafis and Shafi'is; the Malikis hold that a testator whose estate is wholly owed cannot bequeath. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17307}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17308} Where the testator has heirs, a bequest above the third is valid only with their consent, according to the majority; if they consent it stands, and if they refuse it falls. Where there are no heirs, the Hanafis let the bequest take the whole estate. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17308} On a bequest of a share of property: for Abu Hanifa and the Hanbali school the legatee takes a sixth where the division has fewer than six shares; other views fix it at the smallest heir's share, or a third, or a sixth. The Malikis distinguish according to whether the estate is subject to the 'awl. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17309}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17310} A bequest of a part or portion of property is, if not explained by the testator in his life, given by the heirs as they wish after death, according to the Hanafis, Shafi'is and Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17310} A bequest of a sheep covers the young or old, male or female, according to the context; the Hanbalis give what the name normally covers. A bequest of an animal is interpreted by custom as a horse, mule or donkey; a bequest of a dog that the testator does not own is void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17310}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17311} A bequest of a drum of war is valid for one of them; a bequest of an instrument for amusement is valid if it can be used for a lawful purpose. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17311} A bequest of benefits is valid according to the majority, and its value is taken from the third; if it exceeds the third it is allowed only up to the third. For the Hanafis, the benefit returns to the owner of the thing when the legatee dies. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17311}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17314} A bequest of benefits for a set year is counted against the third by the loss of value of the thing during the period; where the benefit is shared between the legatee and the heirs it is divided by rent, by division of the thing if divisible, or by alternation of time or place. The bequest ends when the period ends before death, when the legatee gives up his right, and, in the Hanafi view, when he dies before taking it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17312}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17315} Where the legatee of benefits is prevented from using the thing, the Hanafis make the one who prevents him pay the value of the benefit, whether one heir or all the heirs did it, and he cannot claim another period after the set time has passed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17316} The Malikis make whoever destroys a benefit liable for it; the Shafi'is and Hanbalis hold that any right tied to a thing passes to its replacement, so if an animal whose benefit is bequeathed is killed, its value is used to buy what stands in its place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17316} The Shafi'is say that if a house's benefit for a year is bequeathed and the testator lets it for that year and dies just after the lease, the bequest is void; if he dies after six months, it is void for the first half and the legatee takes the rest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17316} The upkeep of a thing whose benefit is bequeathed falls on the benefit-holder for the Hanafis, Malikis and the Hanbali school, and on the owner of the thing for the Shafi'is in the preferred view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17317} A bequest of the rights of easement that pass by inheritance, such as the right to water, to a drainage channel and to build upwards, is valid; a bequest that amounts to dividing the estate among the heirs has its own rules. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17317} A bequest to each heir of an undivided share is void for the Shafi'is, as the heir takes that by inheritance; a bequest to each heir of a particular thing needs the heirs' consent in the preferred Shafi'i view, because the aims differ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17318} On when the thing passes: for the Hanbali school, a Maliki view and a Shafi'i view, a named legatee owns only by accepting after death, so the increase before acceptance belongs to the heirs; for the Hanafis and the preferred Maliki view, the increase after death belongs to the legatee; the preferred Shafi'i view holds ownership suspended until he accepts or refuses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17318} Gifts bequeathed are carried out from the third left after the costs of shrouding and burial and the debts owed to people; for the Hanafis, debts owed to God such as pilgrimage, zakat, vows and expiation come from the third alone, and for the majority from the whole estate. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17319} For the Hanafis a bequest is void if the testator becomes permanently insane, whether it lasts until death or he recovers before death; permanent insanity is a month or more for Abu Yusuf and a year for Muhammad; a faint and a temporary insanity do not void it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17319} A bequest is void where the testator is an insane person whose insanity is permanent; a person who becomes insane but recovers and bequeaths in his lucid time is valid, according to Ibn al-Najjar; the Shafi'is hold that an insanity that comes later does not void it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17320} The apostasy of the testator voids his bequest for the Hanafis and Malikis; the Malikis add that if he returns to Islam, a written bequest stands and an unwritten one does not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17320} The apostasy of the legatee does not void it for the Shafi'is and some Malikis; the Malikis in the school hold it void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17320} A bequest is not binding, so the testator may revoke it whenever he likes, following Umar's words that a man may change what he wills; al-Sha'bi, Ibn Sirin, Ibn Shubruma and al-Nakha'i allow him to change anything but manumission. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17320} Revocation is either express, as in saying I revoke my bequest, which is agreed, or by act: a sale, gift, alms or endowment of the thing, or an act on it such as slaughtering the sheep, spinning cotton or weaving thread, or any act that changes its name, such as grinding grain or making a board into a door, which the Hanafis, Shafi'is and Hanbalis count as revocation; denying the bequest is not revocation for most jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17321} A bequest is void when the legatee refuses it after the testator's death, when the legatee dies before the testator, by agreement, and, for the majority, when he dies after the testator without accepting; for the Hanafis the bequest stands. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17322} The killing of the testator by the legatee is disputed; a bequest is void when the thing bequeathed is specific and perishes before acceptance, or when it is shown to belong to another. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17322}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17323} A bequest to an heir is void unless the heirs consent, as explained earlier. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17323} The rule is that a bequest may not exceed a third of the estate where there is an heir; if the bequests exceed the third and the heirs do not consent, the legatees share the third in proportion to their bequests. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17323} For the Hanafis, when bequests are combined, God's rights are placed first: the obligatory acts of worship such as zakat and pilgrimage, then expiations, vows and zakat al-fitr, and voluntary acts; a bequest to people is not ranked unless by text, or unless it is manumission or a bequest of advantage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17323}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17324} Where the legatees have equal claims, the third is shared equally in the Hanafi school; where one is bequeathed the whole estate and another a third, Abu Hanifa divides the third in two, while Abu Yusuf and Muhammad share it in four parts; Ibn Abidin accepts the imam's view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17325} The Malikis rank some bequests above others when the third is too small: ransoming a captive, then the temporary manumission of a slave, then zakat, zakat al-fitr, expiation for zihar, homicide and oaths, then a vow; bequests in the same rank share. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17325} Where the bequests overflow the third and the heirs do not consent, the legatees share the third as creditors share a bankrupt's estate, and the Malikis give worked examples with a half, a third and a quarter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17326}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17327} The Malikis include in such sharing the bequest to an unknown person together with a named one, giving the unknown a third in the calculation; Sahnun treats a bequest without a time limit as a third of the estate. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17327} For the Shafi'is, death-related gifts are apportioned from the third by value or amount, with no priority by sequence; manumission among them is apportioned by value, and a view gives it priority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17328} For the Hanbalis the third is shared among the legatees in proportion to their bequests, and a report from Ahmad gives manumission first. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17328}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17329} Writing a bequest is recommended: begin with the basmala, praise, the testimony of faith, then call witnesses; the Companions are reported to write the basmala at the head of their wills. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17329}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17330} Proof of a bequest is by testimony and writing: the Hanafis and Shafi'is accept writing read to witnesses or acknowledged by the testator, and not bare handwriting; the Malikis accept the testator's hand with witnesses; the Hanbalis accept known handwriting proved by the heirs or evidence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17330}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17331} When the estate is partly present and partly absent or in debts, the Hanafis and Hanbalis carry out the bequest from the present money up to the third; the Shafi'is hold the rest of a named thing in suspense until what is absent comes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17332}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17333} Bequests may be by shares, by portions or both; one who bequeaths the equal of an heir's share gets, for most jurists, that share added to the case; the Malikis divide differently when the heirs consent, the Shafi'is and Hanbalis give the least heir's share where heirs differ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17333}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17334} A bequest of the equal of one of the testator's sons is valid according to the Hanafis; if the son is not an heir, the majority give the legatee nothing, and the Malikis give the son's share if the testator said as if he were an heir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17335}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17336} A bequest of a known fraction up to a third is computed by taking the fraction from the common base of the shares; if the remainder does not divide among the heirs, the heirs' base is multiplied by the base of the bequest or by a common factor, as the Malikis, Shafi'is and Hanbalis compute it, with three sons and a third as the example. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17337}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17338} For two or more fractions within the third, the bases are multiplied together to produce the base of both shares; the Malikis give an example with three sons and a sixth and a seventh, and the Shafi'is an example with two parents, an eighth and a fifth; the Hanbalis reduce the fractions to one common base. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17339}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17340} A bequest above the third that does not exhaust the estate needs the heirs' consent; if they consent the estate is divided by the shares, as in a half, a third and a quarter, where the base is twelve and the sum rises by one, which is agreed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17340}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17341}\n\nWhen the heirs reject the excess over the third, the jurists differ on how the third is divided among the legatees. The Malikis, Shafi'is, Hanbalis, Abu Yusuf and Muhammad hold that the third is divided by the legatees' shares as though the heirs had consented, with two-thirds going to the heirs, and that it makes no difference whether a legacy exceeded the third. Abu Hanifa, Abu Thawr and Ibn al-Mundhir hold that the excess is void without consent, so a legatee of the excess counts only for the third, because a bequest of the excess was not valid and the preference carried inside it falls with it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17341}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17342} Examples: a quarter and a half, rejected by the heirs, give three parts to the majority (two to the half-legatee, one to the quarter-legatee) and seven to Abu Hanifa (four and three). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17341}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17342} A third, a half and a quarter, rejected, give thirteen parts to the majority and eleven to Abu Hanifa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17342}\n\nWhen the bequests exhaust the estate and the heirs consent, they behave like the fixed shares of 'awl, and each legatee takes a fixed part as if prescribed by God for an heir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17342} If the heirs reject the excess, the majority divide the third among the legatees in proportion to their shares, while Abu Hanifa, Abu Thawr and Ibn al-Mundhir do not count a legatee above the third without consent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17342} One example: all to Zayd and a third to Amr. With consent the division rises to four parts (three to Zayd, one to Amr); without consent the third is divided on four, and the base of the bequest is twelve by the majority view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17342} The Hanafi figures for the case where the two sons do not consent (p.17343) are garbled in the scan, so they are not given here; the reading is doubtful and flagged.\n\nThe third case is the combination of bequests of parts with bequests of shares. It has several forms: a bequest equal to an heir's share together with a fraction of the whole estate, a fraction of what remains after a share, and a share bequest with a part of the estate excepted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17343}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17345} In the Hanafi example with two sons, one legatee gets a third and another an amount equal to one son's share; with both sons consenting the account runs from nine, so the third-legatee takes three and the rest is divided among the two sons and the share-legatee in thirds, giving each son two and the share-legatee two. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17343} If only one son consents, the account grows to a base of eighteen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17343}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17344} The Shafi'is treat the share-legatee as one of the heirs when the bequest does not exceed the third; the Hanbalis have two views, the preferred one giving the share-legatee a third of the estate on consent, and the other giving him what a son receives. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17344}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17345}\n\nFor a bequest of a part of what remains after a share, the Hanafi example of five sons gives a base of fifty-one: eight to the share-legatee, three to the legatee of a third of what remains, and eight to each son. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17345} The Maliki, Shafi'i and Hanbali examples on the next pages use unknown quantities and the method of correction; the figures are in the book's worked lines and are summarised here, not reproduced. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17345}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17346}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17347}\n\nA share bequest with an exception of part of the estate: the Hanbali example of one son and a bequest equal to his share except half the estate gives the legatee a quarter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17347} For three sons and a bequest equal to one share except a seventh of the estate, the arithmetic is run on a base of sixty-three. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17348}\n\nThe exception that accompanies shares and fractions comes in four kinds. First, a part of what remains after the share (five sons, base fifty-seven). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17348} Second, a part of what remains after the bequest (three sons, with the base of thirteen). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17349} Third, a part of what remains of a part after the bequest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17349} Fourth, a part of what remains of a part of the estate after the share, with a base of thirty-nine for three sons. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17349}\n\nWhen the testator states an exception without saying whether it is after the share or after the bequest, there are two views. The first, which Ibn Qudama attributes to most jurists, reads it as after the share, because the share is what was named. The second reads it as after the bequest, which yields the larger exception and so the smaller legacy; the legacies are read on the surest minimum. This second view is that of most Shafi'is and is attributed by Ibn Qudama to Muhammad al-Shaybani and to the Basran jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17349}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17350} Ibn Qudama's book of bequests defines the property bequest as a charge laid upon it after death, its basis being the Book, the Sunna and consensus; it is obligatory only on one who owes a debt, holds a deposit or owes a duty to discharge by it, so a bequest of part of one's property binds no one in the jumhur's view, though a sect made it obligatory. {cite:mughni-ibn-qudama p.1387} On bequests to kinsmen most scholars held that bequeathing to non-heirs is valid even if the testator's closest kin are left out; Tawus, al-Dahhak and Abd al-Malik ibn Ya'la held it is taken from the legatee and returned to his kin, while Sa'id ibn al-Musayyab, al-Hasan and Jabir ibn Zayd gave the legatee a third of the third and returned the rest to the deceased's kin. {cite:mughni-ibn-qudama p.1389}{cite:mughni-ibn-qudama p.1390} There is no bequest to an heir unless the other heirs ratify it, by consensus; if they do, it holds in the jumhur's view, while some of the companions held it void even then unless they give him a fresh gift. {cite:mughni-ibn-qudama p.1390} A bequest for sin or a forbidden act, such as building a church or a house of fire, is invalid for al-Shafi'i and Abu Thawr but allowed by the opinion-jurists, and Ahmad's companions differed on the killer's bequest in three views — Ibn Hamid and Abu al-Khattab allowed one made after the wounding, and al-Thawri and the opinion-jurists allowed it. {cite:mughni-ibn-qudama p.1434-1435}{cite:mughni-ibn-qudama p.1436-1437} Gifts suspended on death are bequests in ruling and are equalised whether earlier or later, unlike gifts completed in life, whose first takes precedence. {cite:mughni-ibn-qudama p.1458}"
  es: "En el léxico, wasiyya proviene de unir una cosa con otra y también puede nombrar la cosa legada. Técnicamente, un legado de propiedad es un regalo hecho por bondad y vinculado al tiempo después de la muerte, ya sea de cosas o de beneficios. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17270} Los términos relacionados son la comisión ⁦(ايصاء)⁩, la albacea (wisaya), el regalo, que es en vida y sin contraprestación, y la limosna, que es en vida a quien lo necesita buscando recompensa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17270}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17271} El legado es lícito según el Corán, la Sunna y el consenso. El Corán coloca el legado y la deuda antes que la herencia, y la Sunna coloca la deuda antes que el legado; un relato de Sa'd ibn Abi Waqqas sostiene que un tercio es mucho, y que dejar a los herederos ricos es mejor que dejarlos necesitados. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17271} Un relato de Mu'adh dice que Dios da caridad de un tercio al morir como un aumento en las buenas obras, y un relato de Ibn Umar dice que un musulmán que tiene un legado no debe pasar dos noches sin que él lo haya escrito. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17272} Su propósito es obtener recuerdo y recompensa, dar a los parientes que no heredan y ayudar a los necesitados, con la condición de que nadie sea perjudicado, que se mantenga dentro de un tercio, y que no sea válido para un heredero sin el consentimiento de los otros herederos, para evitar el odio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17272}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17273} La mayoría de los juristas sostienen que un legado de parte de la propiedad no es obligatorio pero sí recomendable para quien deja buenas obras; la obligación fue abrogada para los herederos por el informe de que no hay legado para un heredero, y la recomendación permanece para los no herederos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17273} Se prefiere un legado de menos de un tercio; los hanbalíes dicen que un quinto es mejor para los ricos; Ibn Abbas y otros preferían un cuarto. Cuando los herederos son pobres, el legado se reduce, y no se aconseja a un hombre pobre con herederos necesitados que haga un legado, según las opiniones hanafíes y hanbalíes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17274}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17275} Algunas autoridades antiguas, como al-Zuhri, Masruq y Tawus, sostenían que el legado era obligatorio para los parientes que no heredan, basándose en el versículo sobre los legados y el informe de Ibn Umar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17275} Los pilares del legado son, para la mayoría, cuatro: la fórmula, el testador, el legatario y la cosa legada. Para los hanafíes, el pilar es la oferta y la aceptación según Abu Hanifa y sus dos compañeros, y solo la oferta según Zufar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17275}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17276} La fórmula es cualquier palabra que muestre la transferencia después de la muerte. La mayoría acepta un legado por escrito; los shafiíes consideran la escritura como una alusión que requiere intención, y los hanbalíes requieren que se pruebe la letra del testador. Una señal de alguien capaz de hablar no es válida en la opinión mayoritaria, y los malikíes la permiten. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17276}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17277} La aceptación puede ser por conducta, cuando el legatario trata con la cosa como su propietario, por venta, donación o arrendamiento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17278} Si el legatario muere después del testador sin aceptar, los Hanafis sostienen que la cosa pasa a sus herederos; los Malikis, Hanbalis y una visión Shafi'i requieren la aceptación de una persona nombrada, no el mero silencio, y si muere antes que el testador el legado caduca. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17278} Todos están de acuerdo en que la negativa después de la muerte del testador anula el legado; La aceptación o el rechazo antes de su muerte no cuentan para nada según la mayoría. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17278}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17279} La aceptación y el rechazo no tienen por qué darse inmediatamente después de la muerte; los shafi'ís y los hanbalíes dejan que los herederos requieran que el legatario decida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17279} Sobre la retractación de una aceptación hay tres puntos de vista: la mayoría lo prohíbe; algunos shafi'ís y hanbalíes lo permiten antes de la posesión; un tercero lo permite para bienes medidos antes de la posesión. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17279}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17280} Una aceptación parcial es disputada en la escuela Shafi'i; Zakariyya al-Ansari prefiere la invalidez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17280} Un legatario nombrado con plena capacidad acepta o rechaza por sí mismo; un grupo no nombrado como los pobres o las mezquitas no necesita ninguno; un pupilo acepta a través de su tutor para su interés. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17280} Si un legatario nombrado muere después del testador sin aceptar, los Hanafis excepto Zufar sostienen que el legado es válido por preferencia; Zufar y una visión hanbalí lo hacen propiedad de los herederos y lo anulan; la mayoría deja que sus herederos ocupen su lugar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17280}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17281} Un legado puede hacerse condicional o fechado para el futuro: los hanafíes y shafiíes lo permiten; los malikíes lo anulan cuando el testador dice si muero de esta enfermedad y no muere de ella; los hanbalíes permiten una condición que se espera que ocurra después de la muerte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17281}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17283} Un legado no es vinculante; El testador puede revocar total o parcialmente el testamento, en salud o en enfermedad, como se dice que dijo Umar: «Un hombre puede cambiar su voluntad». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17282} La revocación puede hacerse verbalmente o mediante actos como la venta, la donación, la prenda, el consumo, la mezcla, la molienda de grano, el hilado de algodón o la construcción sobre la cosa. La mayoría sostiene que negar el legado no constituye una revocación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17282}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17283} El testador debe estar en pleno uso de sus facultades mentales; los hanafíes, shafiíes y hanbalíes exigen la pubertad, mientras que los malikíes y la visión hanbalí permiten que un menor con capacidad de discernimiento participe en los asuntos en los que sea capaz. Se excluye a las personas con trastornos mentales, aturdidas o inconscientes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17284}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17285} Se requiere libertad, por lo que el legado de un esclavo es nulo; el legado debe hacerse libremente, por lo que uno forzado, en broma o por error lo hace nulo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17285} La mayoría no requiere que el testador sea musulmán; los shafi'is y hanbalis aceptan el legado de un no musulmán, incluido el de un apóstata según la visión shafi'i, a menos que muera como apóstata, mientras que los malikíes anulan el legado de un apóstata durante la apostasía. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17286} Para los Hanafis, un legado de un enemigo no musulmán en territorio enemigo es válido si la cosa todavía está allí cuando entran bajo protección. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17286}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17287} El legatario debe existir en el momento del legado para los Hanafis, Shafi'is (visión preferida) y Hanbalis; los Malikis y una visión Shafi'i y Hanbali permiten un legado a alguien que aún no ha nacido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17287}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17288} El legatario debe ser capaz de poseer; un legado a una persona muerta desconocida para el testador es nulo, y los malikíes entonces lo dirigen a las deudas del muerto o sus herederos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17288} Un legado a un feto es válido si nace vivo dentro del período habitual: seis meses desde el legado cuando la madre tiene un esposo o amo; cuatro años para los shafi'ís y hanbalíes en otros casos; dos años para los hanafíes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17288} Un legado a uno de dos hombres no nombrados es nulo según Abu Hanifa, Zufar, los Malikis, los Shafi'is y los Hanbalis; Abu Yusuf lo considera válido si están de acuerdo, y Muhammad deja la elección a los herederos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17289} Un legado a un grupo que no se puede contar, como los pobres, es válido; los Malikis no requieren partes iguales, los Shafi'is en la opinión preferida aceptan la entrega a tres, y los Hanbalis a uno. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17289} Cuando el legatario es un grupo que no se puede contar, como las tribus de Tamim y Aqil, el legado es nulo según los Hanafis y la visión Shafi'i menos favorecida, porque el legatario debe ser conocido; es válido cuando se pueden contar, y el significado de contar es disputado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17290} Un legado a un animal en sí es nulo; un legado para el forraje del animal de una persona nombrada es válido y se gasta en su alimento, y los Shafi'is y Hanbalis difieren en un legado a un caballo en particular o a un caballo mantenido para Dios. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17290}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17291} Un legado de un musulmán para una obra pública, como la construcción o reparación de una mezquita, es válido porque es un acto de devoción; los malikíes, shafi'ís y hanbalíes lo permiten para un propósito público lícito. El legado de un musulmán para construir una iglesia está prohibido por la mayoría como un acto de desobediencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17291}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17292} Sobre los legados de no musulmanes, los hanafíes dividen: lo que es devoción para ambas partes es válido; lo que es devoción solo para los musulmanes es nulo; ¿Qué es la devoción solo para ellos? Abu Hanifa lo permite y sus dos compañeros lo prohíben. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17292} Un legado a Dios solamente se gasta en obras de piedad en la visión shafi'í y la de Muhammad, y su visión es la que siguen los hanafíes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17292} Un legado para la causa de Dios se gasta en expediciones militares por los shafi'ís, hanbalíes y Abu Yusuf, y Muhammad y una visión hanbalí añaden la peregrinación. Un legado para obras de piedad va, para los hanbalíes, a todos los actos de devoción comenzando con la incursión; para los hanafíes, a cualquier cosa sin transferencia de propiedad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17293} Si el testador dice coloca mi tercera parte donde Dios te muestre, los hanbalíes lo permiten a cualquier acto de devoción; los shafi'ís prefieren a sus parientes que no heredan, luego a sus parientes cercanos por línea materna, luego a sus vecinos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17293} Un legado es nulo cuando el legatario mató al testador: los hanafíes, los hanbalíes, una opinión de los shafi'ís y al-Thawri requieren que el legatario no sea el asesino, basándose en el dicho de que un asesino no tiene legado, que al-Daraqutni debilitó. La prohibición es un asesinato que conlleva represalia, dinero de sangre o expiación, incluso por error; los hanafíes requieren un asesinato directo y un heredero del testador. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17294} Los malikíes, la opinión preferida de los shafi'íes y un informe hanbalí no requieren esto. Para los malikíes, si el testador conocía la causa del asesinato, el legado es válido; si no la conocía, hay dos opiniones, y al-Dusuqi prefiere la invalidez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17294}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17295} Los juristas requieren que el legatario no sea un heredero al momento de la muerte del testador cuando existe otro heredero, basándose en que Dios ha dado a cada poseedor de un derecho su derecho, por lo que no hay legado a un heredero a menos que los herederos consientan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17295} Si algunos herederos dan su consentimiento y otros no, el legado es válido para la parte de los que dan su consentimiento, según la mayoría; los malikíes y una visión shafi'í y hanbalí lo consideran nulo y requieren una nueva aceptación. El consentimiento debe provenir de una persona competente y, para la mayoría, después de la muerte del testador. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17296} Para los malikíes, el consentimiento dado durante la enfermedad del testador es vinculante, si la enfermedad es peligrosa y no se recupera; la prueba de quién es heredero es el momento de la muerte, no el momento del legado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17296}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17297} Los términos sobre el legatario varían en significado: un legado a los vecinos es, para Abu Hanifa, a las casas contiguas; para los dos compañeros, a las casas contiguas y a otros en el barrio que comparten la mezquita; para los malikíes, a las casas contiguas en seis lados y a las que están al otro lado de un callejón; para los shafi'íes y hanbalíes, a cuarenta casas en cada lado; los hanbalíes también cuentan a los que oyen la llamada a la oración. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17298} Un legado a los parientes: para Abu Hanifa, los parientes más cercanos en orden de cercanía entre los parientes consanguíneos dentro de la barrera del matrimonio, excluyendo a los padres y a los hijos; Para los dos compañeros, todos los que rastrean la descendencia hasta el antepasado más lejano que fue musulmán; para los malikíes, los parientes paternos no herederos; para los shafi'ís, todos los parientes por muy lejanos que sean, excepto los ascendientes y descendientes en la visión preferida; para los hanbalíes, descendientes de cuatro antepasados. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17298}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17299} Un legado al pariente más cercano: los shafi'ís incluyen ascendientes y descendientes; su visión preferida coloca a un hijo, por muy lejano que sea, antes que a un padre, y a un hermano antes que a un abuelo. Los hanbalíes distinguen por hermanos completos y medios hermanos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17299}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17300} Los legados a los suegros, a los parientes por matrimonio, a un hogar y a los eruditos tienen sus propios sentidos: para los Hanafi, los suegros son los parientes consanguíneos de la esposa y los parientes por matrimonio son los maridos de los parientes prohibidos; los eruditos, para la mayoría, son juristas y especialistas en hadices, a los que los Shafi'is y los Hanbalis añaden los exégetas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17300}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17301} Un legado a un no musulmán es válido para una persona protegida; los Hanbalis requieren que se le nombre. Es válido para un extranjero protegido según los Hanafis, Shafi'is, Malikis y Hanbalis. Para un enemigo: los Shafi'is en la opinión preferida y los Hanbalis en la opinión sólida lo permiten para un enemigo nombrado, mientras que los Hanafis y Malikis en la escuela lo prohíben en territorio enemigo. Para un apóstata, los Hanafis, Malikis y una cara Hanbali lo prohíben, y los Shafi'is y la opinión Hanbali sólida lo permiten para un apóstata nombrado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17301}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17303} El cuarto pilar, la cosa legada, debe ser propiedad; incluye efectivo, bienes, deudas de otros, derechos medidos en dinero y beneficios que pueden venderse, darse o alquilarse. Ibn Abi Layla e Ibn Shubruma prohíben los legados de beneficios. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17303}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17304} Debe tener valor legal: un legado de o a un musulmán de vino, cerdo, un perro salvaje o una bestia no apta para la caza es nulo; un cristiano puede legar lo que tenga valor en su fe; un perro entrenado o una bestia apta para la caza puede ser legada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17304} Solo se puede legar propiedad de valor; un legado de una piel antes de curtir es válido para los shafi'is, y un legado de un recipiente de oro o plata es válido, ya que puede usarse cuando no se usa como adorno o venderse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17305} Algunos juristas requieren que lo que se lega sea susceptible de transferencia por contrato después de la muerte: los Hanafis y una visión Shafi'i lo requieren; un legado de dátiles de un año de palmeras es válido, y los Hanafis rechazan un legado de lo que un rebaño pueda producir. La mayoría permite legados de lo que aún no existe, como en la venta por salam y en el cuidado de huertos y arrendamientos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17305}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17306} Un legado de una cosa desconocida, como una oveja de su rebaño, y de una cosa que uno no puede entregar, como un camello extraviado, es válido por acuerdo; un legado de una parte indivisa o de una dividida es válido según la mayoría. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17305}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17306} Para los Hanafis la cosa debe existir en un momento que depende de su tipo: una propiedad nombrada en el legado; una parte de la totalidad del patrimonio, como un tercio o un cuarto, a la muerte del testador; una parte de la herencia en el legado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17306} La cosa debe pertenecer al testador: los malikíes, una visión shafi'í y la escuela hanbalí sostienen que un legado de la propiedad de otro es nulo incluso si posteriormente la posee; los hanafíes, otra visión shafi'í y una visión hanbalí lo permiten sujeto al consentimiento del propietario. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17306}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17307} Un legado de una cosa prohibida es nulo, ya que su propósito es compensar el bien hecho en vida. Un legado no se realiza por una suma que absorba todo el patrimonio a menos que los acreedores lo liberen, según los Hanafis y Shafi'is; los Malikis sostienen que un testador cuyo patrimonio es totalmente adeudado no puede legar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17307}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17308} Cuando el testador tiene herederos, un legado superior a un tercio es válido solo con su consentimiento, según la mayoría; si consienten, se mantiene, y si se niegan, se pierde. Cuando no hay herederos, los Hanafis permiten que el legado tome todo el patrimonio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17308} En un legado de una parte de la propiedad: para Abu Hanifa y la escuela Hanbali, el legatario toma un sexto cuando la división tiene menos de seis partes; Otras opiniones lo fijan en la parte del heredero más pequeño, o un tercio, o un sexto. Los malikíes distinguen según si la herencia está sujeta al 'awl. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17309}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17310} Un legado de una parte o porción de propiedad, si no es explicado por el testador en su vida, es dado por los herederos como deseen después de la muerte, según los hanafíes, shafi'ís y hanbalíes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17310} Un legado de una oveja cubre a los jóvenes o viejos, machos o hembras, según el contexto; los hanbalíes dan lo que el nombre normalmente cubre. Un legado de un animal se interpreta por costumbre como un caballo, una mula o un burro; Un legado de un perro que el testador no posee es nulo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17310}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17311} Un legado de un tambor de guerra es válido para uno de ellos; un legado de un instrumento de entretenimiento es válido si puede usarse para un propósito lícito. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17311} Un legado de beneficios es válido según la mayoría, y su valor se toma de la tercera parte; si excede la tercera parte, solo se permite hasta la tercera parte. Para los Hanafi, el beneficio regresa al dueño de la cosa cuando muere el legatario. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17311}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17314} Un legado de beneficios por un año determinado se cuenta contra el tercero por la pérdida de valor de la cosa durante el período; cuando el beneficio se comparte entre el legatario y los herederos se divide por renta, por división de la cosa si es divisible, o por alternancia de tiempo o lugar. El legado termina cuando termina el período antes de la muerte, cuando el legatario renuncia a su derecho y, en la opinión Hanafi, cuando muere antes de tomarlo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17312}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17315} Cuando el legatario de los beneficios se ve impedido de usar la cosa, los Hanafis hacen que quien se lo impide pague el valor del beneficio, ya sea que lo haya hecho un heredero o todos los herederos, y no puede reclamar otro período después de que haya transcurrido el tiempo establecido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17316} Los Malikis hacen que quien destruye un beneficio sea responsable de él; los Shafi'is y los Hanbalis sostienen que cualquier derecho vinculado a una cosa pasa a su reemplazo, por lo que si un animal cuyo beneficio se lega es asesinado, su valor se usa para comprar lo que está en su lugar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17316} Los shafi'ís dicen que si se lega el beneficio de una casa por un año y el testador la arrienda por ese año y muere justo después del arrendamiento, el legado es nulo; si muere después de seis meses, es nulo por la primera mitad y el legatario toma el resto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17316} El mantenimiento de una cosa cuyo beneficio se lega recae sobre el poseedor del beneficio para los hanafíes, malikíes y la escuela hanbalí, y sobre el propietario de la cosa para los shafi'ís en la opinión preferida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17317} Un legado de los derechos de servidumbre que se transmiten por herencia, como el derecho al agua, a un canal de drenaje y a construir hacia arriba, es válido; un legado que equivale a dividir la herencia entre los herederos tiene sus propias reglas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17317} Un legado a cada heredero de una parte indivisa es nulo para los shafi'ís, ya que el heredero la toma por herencia; un legado a cada heredero de una cosa en particular necesita el consentimiento de los herederos en la opinión preferida de los shafi'ís, porque los objetivos difieren. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17318} Sobre cuándo se transmite la cosa: para la escuela Hanbali, una visión Maliki y una visión Shafi'i, un legatario nombrado posee solo al aceptar después de la muerte, por lo que el aumento antes de la aceptación pertenece a los herederos; para los Hanafis y la visión Maliki preferida, el aumento después de la muerte pertenece al legatario; la visión Shafi'i preferida sostiene la propiedad suspendida hasta que él acepte o rechace. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17318} Los legados se realizan del tercio que queda después de los costos de la mortaja y el entierro y las deudas debidas a las personas; para los Hanafis, las deudas debidas a Dios tales como peregrinación, zakat, votos y expiación provienen solo del tercio, y para la mayoría de todo el patrimonio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17319} Para los hanafíes, un legado es nulo si el testador se vuelve permanentemente loco, ya sea que dure hasta la muerte o se recupere antes de morir; la locura permanente es de un mes o más para Abu Yusuf y un año para Muhammad; un desmayo y una locura temporal no lo anulan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17319} Un legado es nulo cuando el testador es una persona loca cuya locura es permanente; una persona que se vuelve loca pero se recupera y lega en su tiempo lúcido es válida, según Ibn al-Najjar; los shafi'ís sostienen que una locura que viene después no lo anula. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17320} La apostasía del testador anula su legado para los hanafíes y malikíes; los malikíes añaden que si regresa al Islam, un legado escrito es válido y uno no escrito no lo es. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17320} La apostasía del legatario no lo anula para los shafi'ís y algunos malikíes; los malikíes de la escuela lo consideran nulo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17320} Un legado no es vinculante, por lo que el testador puede revocarlo cuando quiera, siguiendo las palabras de Umar de que un hombre puede cambiar lo que quiere; Al-Sha'bi, Ibn Sirin, Ibn Shubruma y al-Nakha'i le permiten cambiar cualquier cosa menos la manumisión. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17320} La revocación es expresa, como decir \"revoco mi legado\", lo cual es acordado, o por acto: una venta, donación, limosna o dotación de la cosa, o un acto sobre ella como sacrificar la oveja, hilar algodón o tejer hilo, o cualquier acto que cambie su nombre, como moler grano o hacer una tabla en una puerta, lo cual los Hanafi, Shafi'i y Hanbali consideran revocación; negar el legado no es revocación para la mayoría de los juristas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17321} Un legado es nulo cuando el legatario lo rechaza después de la muerte del testador, cuando el legatario muere antes que el testador, por acuerdo, y, para la mayoría, cuando muere después del testador sin aceptarlo; para los Hanafi, el legado es válido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17322} El asesinato del testador por el legatario es controvertido; un legado es nulo cuando la cosa legada es específica y perece antes de la aceptación, o cuando se demuestra que pertenece a otro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17322}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17323} Un legado a un heredero es nulo a menos que los herederos den su consentimiento, como se explicó anteriormente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17323} La regla es que un legado no puede exceder un tercio de la herencia cuando hay un heredero; si los legados exceden el tercio y los herederos no dan su consentimiento, los legatarios comparten el tercio en proporción a sus legados. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17323} Para los hanafíes, cuando se combinan legados, los derechos de Dios se colocan primero: los actos obligatorios de culto como el zakat y la peregrinación, luego las expiaciones, los votos y el zakat al-fitr, y los actos voluntarios; un legado a personas no se clasifica a menos que sea por texto, o a menos que sea manumisión o un legado de ventaja. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17323}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17324} Cuando los legatarios tienen derechos iguales, el tercio se comparte por igual en la escuela hanafí; cuando a uno se le lega todo el patrimonio y a otro un tercio, Abu Hanifa divide el tercio en dos, mientras que Abu Yusuf y Muhammad lo comparten en cuatro partes; Ibn Abidin acepta la opinión del imán. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17325} Los malikíes clasifican algunos legados por encima de otros cuando el tercio es demasiado pequeño: rescate de un cautivo, luego la manumisión temporal de un esclavo, luego zakat, zakat al-fitr, expiación por zihar, homicidio y juramentos, luego un voto; los legados del mismo rango se comparten. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17325} Cuando los legados exceden el tercio y los herederos no consienten, los legatarios comparten el tercio como los acreedores comparten la herencia de un quebrado, y los malikíes dan ejemplos prácticos con la mitad, un tercio y un cuarto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17326}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17327} Los malikíes incluyen en tal reparto el legado a una persona desconocida junto con una nombrada, dando al desconocido un tercio en el cálculo; Sahnun trata un legado sin límite de tiempo como un tercio de la herencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17327} Para los shafi'ís, los legados relacionados con la muerte se reparten del tercio por valor o cantidad, sin prioridad por secuencia; la manumisión entre ellos se reparte por valor, y una visión le da prioridad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17328} Para los hanbalíes, el tercio se reparte entre los legatarios en proporción a sus legados, y un informe de Ahmad da la manumisión primero. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17328}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17329} Se recomienda escribir un legado: comenzar con la basmala, la alabanza, el testimonio de fe, luego llamar a los testigos; se dice que los Compañeros escribían la basmala al principio de sus testamentos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17329}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17330} La prueba de un legado es por testimonio y escrito: los Hanafis y Shafi'is aceptan escritos leídos a testigos o reconocidos por el testador, y no escritura a mano; los Malikis aceptan la mano del testador con testigos; los Hanbalis aceptan escritura a mano conocida probada por los herederos o evidencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17330}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17331} Cuando la herencia está parcialmente presente y parcialmente ausente o endeudada, los Hanafis y Hanbalis llevan a cabo el legado desde el dinero presente hasta el tercio; Los shafi'ís mantienen el resto de una cosa nombrada en suspenso hasta que llegue lo que falta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17332}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17333} Los legados pueden ser por partes, por porciones o ambas; quien lega lo igual a la parte de un heredero obtiene, para la mayoría de los juristas, esa parte agregada al caso; los malikíes dividen de manera diferente cuando los herederos consienten, los shafi'ís y los hanbalíes dan la parte menor del heredero cuando los herederos difieren. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17333}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17334} Un legado de igual a uno de los hijos del testador es válido según los Hanafis; si el hijo no es heredero, la mayoría no le da nada al legatario, y los Malikis dan la parte del hijo si el testador dijo como si fuera un heredero. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17335}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17336} Un legado de una fracción conocida hasta un tercio se calcula tomando la fracción de la base común de las partes; Si el remanente no se divide entre los herederos, la base de los herederos se multiplica por la base del legado o por un factor común, como lo calculan los malikíes, shafi'ís y hanbalíes, con tres hijos y un tercio como ejemplo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17337}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17338} Para dos o más fracciones dentro del tercio, las bases se multiplican entre sí para producir la base de ambas partes; los malikíes dan un ejemplo con tres hijos y un sexto y un séptimo, y los shafi'ís un ejemplo con dos padres, un octavo y un quinto; los hanbalíes reducen las fracciones a una base común. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17339}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17340} Un legado superior al tercio que no agota la herencia necesita el consentimiento de los herederos; si consienten, la herencia se divide por partes, como en una mitad, un tercio y un cuarto, donde la base es doce y la suma aumenta en uno, lo cual es acordado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17340}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17341} Cuando los herederos rechazan el exceso sobre el tercio, los juristas difieren en cómo se divide el tercio entre los legatarios. Los malikíes, shafi'ís, hanbalíes, Abu Yusuf y Muhammad sostienen que el tercio se divide entre las partes de los legatarios como si los herederos hubieran consentido, correspondiendo dos tercios a los herederos, y que no hay diferencia si un legado excedió el tercio. Abu Hanifa, Abu Thawr e Ibn al-Mundhir sostienen que el exceso es nulo sin consentimiento, por lo que un legatario del exceso cuenta solo para el tercio, porque un legado del exceso no era válido y la preferencia que contenía se pierde con él. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17341}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17342} Ejemplos: un cuarto y medio, rechazado por los herederos, dar tres partes a la mayoría (dos al medio legatario, una al cuarto legatario) y siete a Abu Hanifa (cuatro y tres). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17341}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17342} Un tercio, la mitad y un cuarto, rechazados, dan trece partes a la mayoría y once a Abu Hanifa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17342} Cuando los legados agotan la herencia y los herederos dan su consentimiento, se comportan como las partes fijas de 'awl, y cada legatario toma una parte fija como si Dios lo hubiera prescrito para un heredero. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17342} Si los herederos rechazan el exceso, la mayoría divide el tercio entre los legatarios en proporción a sus partes, mientras que Abu Hanifa, Abu Thawr e Ibn al-Mundhir no cuentan a un legatario por encima del tercio sin consentimiento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17342} Un ejemplo: todo para Zayd y un tercio para Amr. Con consentimiento la división asciende a cuatro partes (tres para Zayd, una para Amr); sin consentimiento el tercio se divide en cuatro, y la base del legado es doce según la opinión mayoritaria. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17342} Las cifras hanafíes para el caso en que los dos hijos no consienten (p.17343) están distorsionadas en el escaneo, por lo que no se incluyen aquí; la lectura es dudosa y se señala. El tercer caso es la combinación de legados de partes con legados de acciones. Tiene varias formas: un legado igual a la parte de un heredero junto con una fracción de la herencia total, una fracción de lo que queda después de una parte, y un legado de parte con una parte de la herencia exceptuada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17343}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17345} En el ejemplo Hanafi con dos hijos, un legatario recibe un tercio y otro una cantidad igual a la parte de un hijo; con el consentimiento de ambos hijos, la cuenta comienza desde nueve, por lo que el legatario del tercio toma tres y el resto se divide entre los dos hijos y el legatario de la parte en tercios, dando a cada hijo dos y al legatario de la parte dos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17343} Si solo un hijo consiente, la cuenta crece hasta una base de dieciocho. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17343}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17344} Los shafi'ís tratan al legatario de la parte como uno de los herederos cuando el legado no excede el tercio; los hanbalíes tienen dos puntos de vista, el preferido es dar al legatario de la parte un tercio de la herencia por consentimiento, y el otro es darle lo que recibe un hijo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17344}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17345} Para un legado de una parte de lo que queda después de una parte, el ejemplo hanafí de cinco hijos da una base de cincuenta y uno: ocho para el legatario de la parte, tres para el legatario de un tercio de lo que queda, y ocho para cada hijo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17345} Los ejemplos de Maliki, Shafi'i y Hanbali en las páginas siguientes utilizan cantidades desconocidas y el método de corrección; las cifras están en las líneas desarrolladas del libro y se resumen aquí, no se reproducen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17345}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17346}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17347} Un legado de participación con excepción de parte de la herencia: el ejemplo Hanbali de un hijo y un legado igual a su participación excepto la mitad de la herencia da al legatario un cuarto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17347} Para tres hijos y un legado igual a una parte excepto un séptimo de la herencia, la aritmética se realiza sobre una base de sesenta y tres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17348} La excepción que acompaña a las partes y fracciones viene en cuatro tipos. Primero, una parte de lo que queda después de la parte (cinco hijos, base cincuenta y siete). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17348} Segundo, una parte de lo que queda después del legado (tres hijos, con la base de trece). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17349} Tercero, una parte de lo que queda de una parte después del legado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17349} Cuarto, una parte de lo que queda de una parte de la herencia después de la porción, con una base de treinta y nueve para tres hijos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17349} Cuando el testador establece una excepción sin decir si es después de la porción o después del legado, hay dos opiniones. La primera, que Ibn Qudama atribuye a la mayoría de los juristas, la interpreta como después de la porción, porque la porción es lo que se nombró. La segunda la interpreta como después del legado, lo que produce la excepción mayor y, por lo tanto, el legado menor; los legados se interpretan sobre el mínimo más seguro. Esta segunda opinión es la de la mayoría de los shafi'ís y es atribuida por Ibn Qudama a Muhammad al-Shaybani y a los juristas de Basora. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17349}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17350} El libro de legados de Ibn Qudama define el legado de propiedad como una carga impuesta sobre ella después de la muerte, su base es el Libro, la Sunna y el consenso; es obligatorio solo para aquel que debe una deuda, posee un depósito o debe un deber que debe cumplir con él, por lo que un legado de parte de la propiedad de uno no obliga a nadie en la opinión del jumhur, aunque una secta lo hizo obligatorio. {cite:mughni-ibn-qudama p.1387} Sobre los legados a parientes la mayoría de los eruditos sostenían que legar a no herederos es válido incluso si los parientes más cercanos del testador quedan excluidos; Tawus, al-Dahhak y Abd al-Malik ibn Ya'la sostenían que se tomaba del legatario y se devolvía a sus parientes, mientras que Sa'id ibn al-Musayyab, al-Hasan y Jabir ibn Zayd daban al legatario un tercio del tercio y devolvían el resto a los parientes del difunto. {cite:mughni-ibn-qudama p.1389}{cite:mughni-ibn-qudama p.1390} No hay legado a un heredero a menos que los demás herederos lo ratifiquen por consenso; si lo hacen, se mantiene en la opinión del jumhur, mientras que algunos de los compañeros lo consideraban nulo incluso entonces a menos que le dieran un nuevo regalo. {cite:mughni-ibn-qudama p.1390} Un legado por pecado o acto prohibido, como la construcción de una iglesia o una casa de fuego, es inválido para al-Shafi'i y Abu Thawr, pero está permitido por los juristas opositores. Los compañeros de Ahmad discreparon sobre el legado del asesino en tres opiniones: Ibn Hamid y Abu al-Khattab permitieron uno hecho después de la herida, y al-Thawri y los juristas opositores también lo permitieron. {cite:mughni-ibn-qudama p.1434-1435}{cite:mughni-ibn-qudama p.1436-1437} Los legados suspendidos por la muerte son legados en la ley y se igualan, ya sean anteriores o posteriores, a diferencia de los legados realizados en vida, cuyo primer legado tiene prioridad. {cite:mughni-ibn-qudama p.1458}"
  fr: "Dans le lexique, « wasiyya » signifie lier une chose à une autre et peut également désigner le bien légué. Techniquement, un legs est un don fait par bienveillance et lié à l'après-décès, qu'il s'agisse de biens matériels ou de prestations. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17270} Parmi les termes apparentés, on trouve la commission ⁦(ايصاء)⁩, l'exécuteur testamentaire (wisaya), le don (effectué du vivant et sans contrepartie) et l'aumône (faite du vivant à une personne dans le besoin en vue d'une récompense). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17270}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17271} Le legs est licite selon le Coran, la Sunna et le consensus. Le Coran place le legs et le remboursement des dettes avant l'héritage, tandis que la Sunna place les dettes avant le legs. Un hadith rapporté par Sa'd ibn Abi Waqqas considère qu'un tiers est une somme importante et qu'il vaut mieux laisser ses héritiers riches que dans le besoin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17271} Un hadith rapporté par Mu'adh indique que Dieu accorde l'aumône d'un tiers au décès comme une récompense pour les bonnes actions, et un hadith rapporté par Ibn Umar précise qu'un musulman qui a un legs ne doit pas passer deux nuits sans le consigner par écrit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17272} Le but de ce legs est d'obtenir le souvenir d'un héritier et une récompense, de venir en aide aux proches qui n'héritent pas et de secourir les nécessiteux, à condition que personne ne soit lésé, que le legs reste inférieur à un tiers et qu'il ne soit valable pour un héritier sans le consentement des autres héritiers, afin de prévenir toute haine. La plupart des juristes estiment qu'un legs partiel n'est pas obligatoire, mais recommandé pour celui qui laisse une bonne situation. L'obligation a été abrogée pour les héritiers par le hadith selon lequel il n'existe pas de legs en faveur d'un héritier, et la recommandation demeure pour les non-héritiers. Un legs inférieur à un tiers est préférable; les hanbalites estiment qu'un cinquième est préférable pour les riches; Ibn Abbas et d'autres préconisaient un quart. Lorsque les héritiers sont pauvres, le legs est réduit, et il est déconseillé à un homme pauvre ayant des héritiers nécessiteux de léguer, selon les écoles hanafite et hanbalite. Certaines autorités anciennes, telles qu'al-Zuhri, Masruq et Tawus, considéraient le legs comme obligatoire pour les parents qui n'héritent pas, se fondant sur le verset relatif aux legs et sur le hadith d'Ibn Umar. Pour la majorité, le legs comporte quatre piliers: la formule, le testateur, le légataire et le bien légué. Pour les hanafites, le pilier est l'offre et l'acceptation selon Abu Hanifa et ses deux compagnons, et l'offre seule selon Zufar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17275}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17276} La formule est tout mot indiquant le transfert après le décès. La majorité accepte un legs écrit; les chaféites considèrent l’écrit comme une simple allusion nécessitant une intention, et les hanbalites exigent que l’écriture du testateur soit authentifiée. Un signe d’une personne capable de parler n’est pas valable selon l’avis majoritaire, tandis que les malikites l’autorisent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17276}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17277} L’acceptation peut se faire par le comportement du légataire, lorsque celui-ci dispose du bien comme son propriétaire, par vente, donation ou location. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17278} Si le légataire décède après le testateur sans accepter le legs, les Hanafites considèrent que le legs revient à ses héritiers; les Malikites, les Hanbalites et une opinion chaféite exigent une acceptation pour une personne nommément désignée, et non un simple silence, et si celle-ci décède avant le testateur, le legs est caduc. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17278} Tous s’accordent à dire que le refus après le décès du testateur annule le legs; l’acceptation ou le refus avant son décès est sans effet selon la majorité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17278}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17279} L’acceptation et le refus ne doivent pas nécessairement intervenir immédiatement après le décès; Les écoles chaféite et hanbalite permettent aux héritiers d'exiger du légataire qu'il tranche. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17279} Concernant la rétractation d'une acceptation, trois avis divergent: la majorité l'interdit; certains chaféites et hanbalites l'autorisent avant la prise de possession; un tiers l'autorise pour les biens mesurés avant la prise de possession. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17279}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17280} L'acceptation partielle est contestée dans l'école chaféite; Zakariyya al-Ansari préconise la nullité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17280} Un légataire nommé et capable accepte ou refuse lui-même; un groupe non nommé, comme les pauvres ou les mosquées, n'a pas à se prononcer. Un pupille accepte un legs par l'intermédiaire de son tuteur, en son nom. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17280} Si un légataire désigné décède après le testateur sans avoir accepté le legs, les hanafites, à l'exception de l'école de Zufar, considèrent le legs comme valide par préférence; l'école de Zufar et une opinion hanbalite le rendent propriété des héritiers et le rendent caduc; la majorité des juristes laissent ses héritiers prendre sa place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17280}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17281} Un legs peut être conditionnel ou daté: les hanafites et les chaféites l'autorisent; les malikites le rendent caduc si le testateur stipule « si je meurs de telle maladie » et n'en décède pas; les hanbalites autorisent une condition qui devrait survenir après le décès. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17281}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17283} Un legs n'est pas irrévocable; le testateur peut le révoquer en tout ou en partie, en bonne santé ou malade, comme l'aurait dit Umar, affirmant qu'un homme peut changer d'avis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17282} La révocation peut être verbale ou comportementale, par exemple par la vente, le don, le nantissement, la consommation, le mélange, la mouture de céréales, le filage de coton ou la construction sur le bien. La majorité considère que le refus du legs ne constitue pas une révocation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17282}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17283} Le testateur doit être sain d'esprit; les écoles hanafite, chaféite et hanbalite exigent la puberté, tandis que les écoles malikite et une opinion hanbalite admettent un mineur capable de discernement dans les matières où il en est capable. Les personnes atteintes de troubles mentaux, hébétées ou inconscientes sont exclues. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17284}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17285} La liberté est requise, de sorte que le legs d'un esclave est nul; le legs doit être fait librement, de sorte qu'un legs fait sous la contrainte, par plaisanterie ou par erreur le rend nul. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17285} La majorité des écoles juridiques n'exigent pas que le testateur soit musulman; les chaféites et les hanbalites acceptent le legs d'un non-musulman, y compris celui d'un apostat selon l'école chaféite, sauf si ce dernier décède en état d'apostasie. Les malikites, quant à eux, annulent le legs d'un apostat durant son apostasie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17286} Pour les hanafites, un legs fait par un ennemi non musulman en territoire ennemi est valable si le bien s'y trouve encore lorsque ce dernier est placé sous leur protection. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17286}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17287} Selon les écoles hanafite, chaféite (avis privilégié) et hanbalite, le légataire doit exister au moment du legs; les écoles malikite, ainsi qu'une opinion chaféite et hanbalite, autorisent un legs à une personne non encore née. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17287}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17288} Le légataire doit être capable de posséder; un legs à une personne décédée inconnue du testateur est nul, et les écoles malikite affectent alors le legs au règlement des dettes du défunt ou de ses héritiers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17288} Un legs à un fœtus est valable s'il naît vivant dans le délai habituel: six mois à compter du legs lorsque la mère a un mari ou un employeur; quatre ans pour les écoles chaféite et hanbalite dans les autres cas; deux ans pour l'école hanafite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17288} Un legs à l'un des deux hommes non nommés est nul selon Abou Hanifa, Zoufar, les Malikites, les Chaféites et les Hanbalites; Abou Yusuf le considère valable s'ils sont d'accord, et le Prophète Muhammad laisse le choix aux héritiers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17289} Un legs à un groupe indéterminé, comme les pauvres, est valable. Les Malikites n'exigent pas de parts égales, les Chafi'ites, dans leur avis privilégié, acceptent une répartition entre trois personnes, et les Hanbalites entre une seule. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17289} Lorsque le légataire est un groupe indénombrable, comme les tribus de Tamim et d'Aqil, le legs est nul selon les Hanafites et l'avis Chafi'ite, moins répandu, car le légataire doit être identifié; il est valable lorsqu'il peut être dénombré, et la notion de dénombrement fait débat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17290} Un legs à un animal lui-même est nul; un legs pour le fourrage d'un animal nommément désigné est valable et utilisé pour son alimentation, et les Chafi'ites et les Hanbalites divergent quant à un legs à un cheval particulier ou à un cheval offert à Dieu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17290}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17291} Un legs fait par un musulman pour une œuvre publique, telle que la construction ou la restauration d'une mosquée, est valable car il s'agit d'un acte de dévotion; les écoles malikite, chaféite et hanbalite l'autorisent pour un but d'intérêt public licite. Un legs fait par un musulman pour la construction d'une église est interdit par la majorité, car considéré comme un acte de désobéissance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17291}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17292} Concernant les legs faits par des non-musulmans, les hanafites sont partagés: ce qui relève de la dévotion pour les deux parties est valable; ce qui relève de la dévotion uniquement pour les musulmans est nul. Selon l'école chaféite et celle du Prophète Muhammad (qui est également l'école hanafite), un legs destiné exclusivement à Dieu est consacré à des œuvres de piété. Selon les chaféites, les hanbalites et l'école hanafite, un legs destiné à la cause de Dieu est consacré à des expéditions militaires. Le Prophète Muhammad et une école hanbalite y ajoutent le pèlerinage. Pour les hanbalites, un legs destiné à des œuvres de piété couvre tous les actes de dévotion, à commencer par le raid; pour les hanafites, il couvre tout acte sans transfert de propriété. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17293} Si le testateur dit: « Placez mon tiers là où Dieu vous le montrera », les Hanbalites autorisent tout acte de dévotion; les Chafi'ites préfèrent ses parents qui n'héritent pas, puis ses proches parents par le lait, puis ses voisins. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17293} Un legs est nul si le légataire a tué le testateur: les Hanafites, les Hanbalites, une opinion des Chafi'ites et al-Thawri exigent que le légataire ne soit pas le meurtrier, se fondant sur le principe selon lequel un meurtrier n'a pas droit à un legs, principe qu'al-Daraqutni a atténué. L'irrecevabilité est un meurtre entraînant des représailles, le paiement d'un prix du sang ou une expiation, même accidentel; les Hanafites exigent un meurtre direct et un héritier du testateur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17294} Les Malikites, l'avis privilégié des Chafi'ites et un hadith hanbalite n'exigent pas cette condition. Pour les Malikites, si le testateur connaissait la cause du meurtre, le legs est valide; s'il l'ignorait, deux avis divergent, et al-Dusuqi privilégie l'invalidité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17294}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17295} Les juristes exigent que le légataire ne soit pas un héritier au décès du testateur s'il existe un autre héritier, partant du principe que Dieu a conféré à chacun son droit, et qu'il n'y a donc pas de legs à un héritier sans son consentement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17295} Si certains héritiers consentent et d'autres non, le legs est valable pour la part de ceux qui y consentent, selon la majorité; les Malikites, ainsi qu'une opinion chaféite et hanbalite, le considèrent nul et exigent une nouvelle acceptation. Le consentement doit émaner d'une personne capable et, pour la majorité, après le décès du testateur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17296} Pour les Malikites, le consentement donné pendant la maladie du testateur est contraignant si la maladie est grave et qu'il ne guérit pas; le critère pour déterminer qui est héritier est le moment du décès, et non celui du legs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17296}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17297} Les termes relatifs au légataire ont des significations variables: pour Abou Hanifa, un legs aux voisins concerne les maisons contiguës; pour les deux Compagnons, les maisons contiguës et les autres habitants du quartier qui partagent la mosquée; pour les Malikites, les maisons contiguës sur six côtés et celles situées de l’autre côté d’une ruelle; pour les Chafi'ites et les Hanbalites, quarante maisons de chaque côté; les Hanbalites comptent également ceux qui entendent l’appel à la prière. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17298} Un legs aux proches: pour Abou Hanifa, le plus proche parent par ordre de proximité parmi les parents par le sang, à l’exclusion des parents et des enfants; Pour les deux compagnons, tous ceux qui descendent de l'ancêtre musulman le plus éloigné; pour les Malikites, les parents paternels, à l'exclusion des héritiers; pour les Chafi'ites, tous les parents, même éloignés, sauf les ascendants et les descendants selon leur avis privilégié; pour les Hanbalites, les descendants de quatre ancêtres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17298}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17299} Un legs au parent le plus proche: les Chafi'ites incluent les ascendants et les descendants; leur avis privilégié place le fils, même éloigné, avant le père, et le frère avant le grand-père. Les Hanbalites font la distinction entre frères et sœurs germains et demi-frères et sœurs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17299}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17300} Les legs aux beaux-parents, aux parents par alliance, aux membres d'une famille et aux savants ont des significations spécifiques: pour les hanafites, les beaux-parents sont les parents par le sang de l'épouse et les parents par alliance sont les époux des parents interdits; les savants sont, pour la majorité, des juristes et des spécialistes du hadith, auxquels les chaféites et les hanbalites ajoutent les exégètes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17300}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17301} Un legs à un non-musulman est valable pour une personne protégée; les hanbalites exigent que son nom soit mentionné. Selon les écoles hanafite, chaféite, malikite et hanbalite, le legs est valable pour un étranger protégé. Concernant un ennemi: l’école chaféite (avis privilégié) et l’école hanbalite (avis sain) l’autorisent pour un ennemi nommément désigné, tandis que les écoles hanafite et malikite l’interdisent en territoire ennemi. Concernant un apostat, les écoles hanafite, malikite et une opinion hanbalite l’interdisent, tandis que les écoles chaféite et hanbalite (avis sain) l’autorisent pour un apostat nommément désigné. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17301}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17303} Le quatrième pilier, le legs, doit être un bien; il comprend l’argent liquide, les biens, les dettes d’autrui, les droits monnayables et les avantages qui peuvent être vendus, donnés ou loués. Ibn Abi Layla et Ibn Shubruma interdisent les legs de biens matériels. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17303}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17304} Le bien doit avoir une valeur légale: un legs de vin, de porc, d’un chien sauvage ou d’une bête impropre à la chasse, fait par ou à un musulman, est nul; un chrétien peut léguer ce qui a de la valeur selon sa foi; un chien dressé ou une bête apte à la chasse peuvent être légués. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17304} Seuls les biens de valeur peuvent être légués; un legs d’une peau avant tannage est valable pour les chaféites, et un legs d’un vase en or ou en argent est valable, car il peut être utilisé comme ornement ou vendu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17305} Certains juristes exigent que ce qui est légué puisse être transféré par contrat après la mort: les Hanafites et une opinion Shafi'ite l'exigent; un legs de dattes d'une année de palmiers est valable, et les Hanafites rejettent un legs de ce qu'un troupeau produira. La majorité autorise les legs de biens n'existant pas encore, comme la vente par salami, l'entretien de vergers et la location. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17305}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17306} Un legs d'une chose inconnue, comme un mouton de son troupeau, ou d'une chose qu'on ne peut livrer, comme un chameau égaré, est valable par convention; un legs d'une part indivise ou d'une part divisée est valable selon la majorité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17305}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17306} Pour les Hanafites, le bien doit exister à un moment qui dépend de sa nature: un bien nommé au moment du legs; Une part de l'ensemble du patrimoine, telle qu'un tiers ou un quart, au décès du testateur; une part d'une partie du patrimoine par legs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17306} Le bien doit appartenir au testateur: les Malikites, une opinion chaféite et l'école hanbalite considèrent qu'un legs portant sur le bien d'autrui est nul, même si le testateur en devient propriétaire ultérieurement; les Hanafites, une autre opinion chaféite et une opinion hanbalite l'autorisent sous réserve du consentement du propriétaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17306}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17307} Un legs portant sur un bien interdit est nul, car son but est de compenser une bonne action accomplie du vivant du testateur. Selon les écoles hanafite et chaféite, un legs d'une somme absorbant la totalité du patrimoine n'est pas valable, sauf si les créanciers le libèrent. L'école malikite considère qu'un testateur dont le patrimoine est entièrement grevé de dettes ne peut léguer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17307}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17308} En présence d'héritiers, un legs supérieur au tiers n'est valable qu'avec leur consentement, à la majorité; s'ils y consentent, le legs est maintenu, sinon il est caduc. En l'absence d'héritiers, l'école hanafite autorise le legs à porter sur la totalité du patrimoine. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17308} Concernant le legs d'une part de propriété: selon Abu Hanifa et l'école hanbalite, le légataire reçoit un sixième lorsque le partage comporte moins de six parts; d'autres avis fixent la part à celle du plus petit héritier, ou à un tiers, ou encore à un sixième. Les Malikites font une distinction selon que la succession est soumise ou non à l'« awl ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17309}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17310} Un legs d'une partie ou d'une portion de propriété est, s'il n'a pas été formulé par le testateur de son vivant, effectué par les héritiers selon leur volonté après le décès, selon les écoles hanafite, chaféite et hanbalite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17310} Un legs de mouton concerne le jeune ou le vieux, le mâle ou la femelle, selon le contexte; les Hanbalites donnent l’interprétation courante. Un legs d’animal est généralement interprété comme un cheval, un mulet ou un âne; un legs d’un chien qui n’appartient pas au testateur est nul. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17310}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17311} Un legs de tambour de guerre est valable pour l’un d’eux; un legs d’instrument de divertissement est valable s’il peut être utilisé à des fins licites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17311} Un legs de biens est valable à la majorité, et sa valeur est déduite de la part du tiers; s’il excède le tiers, il n’est admis que dans la limite du tiers. Pour les Hanafites, le bien revient au propriétaire au décès du légataire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17311}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17314} Un legs de biens pour une année déterminée est déduit de la part du tiers du montant de la perte de valeur du bien pendant cette période; lorsque le bien est partagé entre le légataire et ses héritiers, il est réparti au prorata du loyer, au prorata de la part du bien si celui-ci est divisible, ou selon l’alternance du temps ou du lieu. Le legs prend fin lorsque le délai imparti expire avant le décès, lorsque le légataire renonce à ses droits et, selon l'école hanafite, lorsqu'il décède avant d'en avoir bénéficié. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17312}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17315} Si le légataire est empêché d'utiliser le bien, les hanafites obligent celui qui l'en empêche à payer la valeur du bien, que ce soit un seul héritier ou tous, et il ne peut prétendre à un nouveau délai après l'expiration de la période fixée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17316} Les malikites rendent responsable celui qui détruit un bien. Les écoles chaféite et hanbalite considèrent que tout droit attaché à une chose est transmis à son remplaçant. Ainsi, si un animal dont le bénéfice est légué est tué, sa valeur sert à acquérir ce qui le remplace. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17316} Selon les chaféites, si le bénéfice d'une maison pour une année est légué et que le testateur la loue pour cette année et décède peu après la fin du bail, le legs est nul; s'il décède après six mois, il est nul pour la première moitié et le légataire reçoit le reste. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17316} L'entretien d'une chose dont le bénéfice est légué incombe au bénéficiaire pour les écoles hanafite, malikite et hanbalite, et au propriétaire de la chose pour l'école chaféite, qui privilégie cette dernière. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17317} Un legs portant sur des servitudes transmises par héritage, telles que le droit à l'eau, à un canal de drainage et au droit de construire en hauteur, est valable; un legs ayant pour effet de diviser le patrimoine entre les héritiers est soumis à des règles spécifiques. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17317} Selon l'école shafi'ite, un legs à chaque héritier d'une part indivise est nul, car l'héritier la reçoit par héritage; un legs à chaque héritier d'un bien particulier requiert le consentement des héritiers, selon l'avis shafi'ite privilégié, car les finalités divergent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17318} Concernant la transmission: selon l’école hanbalite, l’avis malikite et l’avis chaféite, un légataire désigné n’acquiert la propriété qu’après acceptation, l’accroissement de la valeur successorale avant cette acceptation revenant alors aux héritiers; selon l’école hanafite et l’avis malikite privilégié, l’accroissement de la valeur successorale revient au légataire; l’avis chaféite privilégié considère la propriété comme suspendue jusqu’à ce que le légataire accepte ou refuse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17318} Les legs sont prélevés sur le tiers restant après déduction des frais funéraires et des dettes envers autrui; selon l’école hanafite, les dettes envers Dieu, telles que le pèlerinage, la zakat, les vœux et les expiations, sont prélevées sur le tiers restant, tandis que pour la majorité, elles sont prélevées sur la totalité du patrimoine. Pour les Hanafites, un legs est nul si le testateur devient atteint de démence permanente, que cet état persiste jusqu'à son décès ou qu'il guérisse avant. La démence permanente est définie comme un mois ou plus pour Abu Yusuf et un an pour Muhammad. Un évanouissement ou une démence passagère n'entraînent pas la nullité du legs. Un legs est nul si le testateur est atteint de démence permanente. Selon Ibn al-Najjar, un legs est valable si le testateur, devenu dément, guérit et lègue durant sa période de lucidité. Les Shafi'ites considèrent qu'une démence survenant ultérieurement n'entraîne pas la nullité du legs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17320} L'apostasie du testateur annule son legs pour les hanafites et les malikites; ces derniers ajoutent que s'il se convertit à l'islam, un legs écrit est valable, mais pas un legs oral. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17320} L'apostasie du légataire n'annule pas le legs pour les chaféites et certains malikites; les malikites, au sein de cette école, le considèrent comme nul. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17320} Un legs n'est pas contraignant; le testateur peut donc le révoquer à tout moment, conformément aux paroles d'Umar selon lesquelles un homme peut changer d'avis. Al-Sha'bi, Ibn Sirin, Ibn Shubruma et al-Nakha'i lui permettent de modifier tout bien, sauf l'affranchissement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17320} La révocation peut être expresse, comme lorsqu'on dit « Je révoque mon legs », ce qui est convenu, ou tacite: la vente, le don, l'aumône ou la dotation du bien, ou un acte effectué sur celui-ci, comme l'abattage du mouton, le filage du coton ou le tissage du fil, ou tout acte qui en modifie la nature, comme moudre du grain ou transformer une planche en porte. Les hanafites, les chaféites et les hanbalites considèrent ces actes comme une révocation; le refus du legs n'est pas considéré comme une révocation par la plupart des juristes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17321} Un legs est nul lorsque le légataire le refuse après le décès du testateur, lorsqu'il décède avant celui-ci, par accord mutuel, et, pour la majorité, lorsqu'il décède après le testateur sans l'avoir accepté; pour les hanafites, le legs est valable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17322} Le meurtre du testateur par le légataire est contesté; un legs est nul lorsque le bien légué est spécifique et périt avant son acceptation, ou lorsqu'il est démontré qu'il appartient à un tiers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17322}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17323} Un legs à un héritier est nul sauf consentement de ce dernier, comme expliqué précédemment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17323} La règle est la suivante: un legs ne peut excéder un tiers de la succession lorsqu’il y a un héritier; si les legs excèdent ce tiers et que les héritiers n’y consentent pas, les légataires se partagent le tiers au prorata de leurs legs respectifs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17323} Pour les Hanafites, lors de la constitution de legs, les droits de Dieu priment: les actes d’adoration obligatoires tels que la zakat et le pèlerinage, puis les expiations, les vœux et la zakat al-fitr, et enfin les actes surérogatoires; un legs à une personne n’est hiérarchisé que par un texte sacré, ou s’il s’agit d’une affranchissement ou d’un legs avantageux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17323}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17324} Lorsque les légataires ont des droits égaux, le tiers est partagé équitablement selon l’école hanafite; lorsqu’un légue la totalité du domaine et un autre un tiers, Abu Hanifa divise le tiers en deux, tandis qu’Abu Yusuf et Muhammad le partagent en quatre parts. Ibn Abidin partage l'avis de l'imam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17325} Les Malikites hiérarchisent les legs lorsque le tiers est insuffisant: le rachat d'un captif, puis l'affranchissement temporaire d'un esclave, puis la zakat, la zakat al-fitr, l'expiation pour le zihar, l'homicide et les serments, puis un vœu; les legs de même rang sont partagés. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17325} Lorsque les legs excèdent le tiers et que les héritiers n'y consentent pas, les légataires se partagent le tiers comme les créanciers se partagent le patrimoine d'un failli. Les Malikites donnent des exemples concrets avec la moitié, le tiers et le quart. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17326}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17327} Les Malikites incluent dans ce partage le legs à une personne inconnue avec celui à une personne nommément désignée, attribuant à l'inconnue un tiers du calcul; Sahnun considère un legs sans limite de temps comme un tiers de la succession. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17327} Pour les Shafi'ites, les legs liés au décès sont répartis du tiers en fonction de leur valeur ou de leur montant, sans ordre de priorité; l'affranchissement, quant à lui, est réparti en fonction de sa valeur, et une opinion lui accorde la priorité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17328} Chez les Hanbalites, le tiers est partagé entre les légataires proportionnellement à leurs legs, et un hadith rapporté par Ahmad mentionne l'affranchissement en premier. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17328}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17329} Il est recommandé de rédiger un testament: commencer par la basmala, louange, témoignage de foi, puis appeler les témoins; il est rapporté que les Compagnons écrivaient la basmala en tête de leur testament. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17329}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17330} La preuve d'un legs se fait par témoignage et par écrit: les Hanafites et les Shafi'ites acceptent un écrit lu à des témoins ou reconnu par le testateur, et non une simple écriture manuscrite; les Malikites acceptent la main du testateur en présence de témoins; les Hanbalites acceptent une écriture manuscrite connue, authentifiée par les héritiers ou par des preuves. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17330}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17331} Lorsque le patrimoine est partiellement présent et partiellement absent, ou s'il est endetté, les Hanafites et les Hanbalites exécutent le legs sur la base des fonds présents, jusqu'au tiers restant. Les shafi'ites suspendent la répartition d'un bien nommé jusqu'à ce que ce qui manque soit reçu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17332}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17333} Les legs peuvent être faits par parts, par portions ou les deux; celui qui lègue une part égale à celle d'un héritier voit, pour la plupart des juristes, cette part ajoutée au legs; les malikites répartissent différemment lorsque les héritiers y consentent; les shafi'ites et les hanbalites attribuent la part du plus petit héritier en cas de désaccord. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17333}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17334} Selon l'école hanafite, un legs d'une part égale à celle de l'un des fils du testateur est valable; si le fils n'est pas héritier, la majorité des écoles ne lègue rien au légataire, tandis que les malikites lui attribuent la part du fils si le testateur a stipulé qu'il était héritier. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17335}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17336} Un legs d'une fraction connue, jusqu'à un tiers, est calculé en prenant la fraction à partir de la base commune des parts. Si le reliquat ne se divise pas entre les héritiers, la base de chaque héritier est multipliée par la base du legs ou par un facteur commun, selon le calcul des écoles malikite, chaféite et hanbalite, avec pour exemple trois fils et un tiers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17337}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17338} Pour deux ou plusieurs fractions au sein du tiers, les bases sont multipliées entre elles afin d'obtenir la base des deux parts; les malikites donnent un exemple avec trois fils, un sixième et un septième, et les chaféites un exemple avec deux parents, un huitième et un cinquième; les hanbalites ramènent les fractions à une base commune. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17339}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17340} Un legs supérieur au tiers qui n'épuise pas la succession requiert le consentement des héritiers; s'ils y consentent, la succession est divisée selon les parts convenues, par exemple une moitié, un tiers et un quart, la base étant douze et la somme augmentée d'une unité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17340}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17341} Lorsque les héritiers refusent l'excédent par rapport au tiers, les juristes divergent quant à la répartition de ce tiers entre les légataires. Les écoles malikite, chaféite, hanbalite, Abou Yusuf et Muhammad soutiennent que le tiers est divisé entre les légataires comme si les héritiers y avaient consenti, les deux tiers revenant aux héritiers, et que le fait qu'un legs excède le tiers est sans incidence. Abou Hanifa, Abou Thawr et Ibn al-Mundhir estiment que l'excédent est nul sans consentement; par conséquent, un légataire de l'excédent ne compte que pour le tiers, car un legs de l'excédent n'était pas valable et la préférence qu'il contenait est annulée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17341}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17342} Exemples: un quart et la moitié, refusés par les héritiers, donnent trois parts à la majorité (deux au demi-légataire, une au quart-légataire) et sept à Abou Hanifa (quatre et trois). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17341}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17342} Un tiers, une moitié et un quart, rejetés, donnent treize parts à la majorité et onze à Abu Hanifa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17342} Lorsque les legs épuisent la succession et que les héritiers y consentent, ils se comportent comme les parts fixes de l'« awl », et chaque légataire reçoit une part fixe comme si elle était prescrite par Dieu pour un héritier. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17342} Si les héritiers refusent l'excédent, la majorité répartit le tiers entre les légataires proportionnellement à leurs parts, tandis qu'Abu Hanifa, Abu Thawr et Ibn al-Mundhir ne comptent aucun légataire au-delà du tiers sans consentement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17342} Exemple: la totalité revient à Zayd et un tiers à Amr. Avec consentement, la répartition s'élève à quatre parts (trois pour Zayd, une pour Amr); sans consentement, le tiers est divisé en quatre, et la base du legs est de douze selon l'avis majoritaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17342} Les chiffres hanafites relatifs au cas où les deux fils ne consentent pas (p. 17343) sont illisibles dans la numérisation; ils ne sont donc pas reproduits ici. La lecture est douteuse et signalée. Le troisième cas concerne la combinaison de legs partiels et de legs d’actions. Il existe plusieurs formes de legs: un legs égal à la part d’un héritier, augmenté d’une fraction de la succession entière; un legs d’une fraction du reliquat après partage; et un legs d’une part, une partie de la succession étant exclue. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17343}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17345} Dans l’exemple hanafite avec deux fils, un légataire reçoit un tiers et l’autre une somme égale à la part du premier fils. Si les deux fils y consentent, le compte est porté à neuf; le troisième légataire reçoit alors trois et le reste est divisé en trois parts égales entre les deux fils et le légataire d’une part, soit deux pour chaque fils et deux pour le légataire d’une part. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17343} Si un seul fils y consent, le compte est porté à dix-huit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17343}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17344} Les chaféites considèrent le légataire à part comme un héritier lorsque le legs n'excède pas le tiers; les hanbalites ont deux avis: le premier, privilégié, attribue au légataire à part un tiers de la succession avec son consentement; le second lui attribue la part qui revient à un fils. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17344}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17345} Pour un legs portant sur une partie du reliquat après partage, l'exemple hanafite de cinq fils donne une base de cinquante et un: huit au légataire à part, trois au légataire du tiers du reliquat, et huit à chacun des fils. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17345} Les exemples malikites, chaféites et hanbalites des pages suivantes utilisent des quantités inconnues et la méthode de correction; les chiffres figurent dans les calculs du livre et sont résumés ici, sans être reproduits. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17345}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17346}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17347} Un legs de part avec exception d'une partie de la succession: l'exemple hanbalite d'un fils et d'un legs égal à sa part, moins la moitié de la succession, lègue au légataire un quart. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17347} Pour trois fils et un legs égal à une part, moins un septième de la succession, le calcul se fait sur une base de soixante-trois. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17348} L'exception relative aux parts et aux fractions se présente sous quatre formes. Premièrement, une partie de ce qui reste après le partage (cinq fils, base cinquante-sept). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17348} Deuxièmement, une partie de ce qui reste après le legs (trois fils, base treize). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17349} Troisièmement, une partie de ce qui reste d'une partie après le legs. Quatrièmement, une partie de ce qui reste de la succession après la part, avec une base de trente-neuf pour trois fils. Lorsqu'un testateur mentionne une exception sans préciser si elle s'applique après la part ou après le legs, deux avis s'opposent. Le premier, qu'Ibn Qudama attribue à la plupart des juristes, considère qu'elle s'applique après la part, puisque c'est bien la part qui a été nommée. Le second la considère comme s'appliquant après le legs, ce qui entraîne une exception plus importante et donc un legs plus faible; les legs sont interprétés selon le minimum garanti. Ce second avis est celui de la plupart des chaféites et est attribué par Ibn Qudama à Muhammad al-Shaybani et aux juristes de Bassorah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17349}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17350} Le livre d'Ibn Qudama sur les legs définit le legs de biens comme une charge grevant le bien après le décès, fondée sur le Coran, la Sunna et le consensus. Il n'est obligatoire que pour celui qui a une dette, détient un dépôt ou a une obligation à acquitter par ce legs. Ainsi, selon la doctrine du jumhur, un legs d'une partie de ses biens n'engage personne, bien qu'une secte l'ait rendu obligatoire. {cite:mughni-ibn-qudama p.1387} Concernant les legs aux proches parents, la plupart des savants estiment que léguer à des non-héritiers est valable même si les parents les plus proches du testateur sont exclus. Tawus, al-Dahhak et Abd al-Malik ibn Ya'la estimaient que le legs était retiré au légataire et restitué à sa famille, tandis que Sa'id ibn al-Musayyab, al-Hasan et Jabir ibn Zayd accordaient au légataire un tiers du tiers et restituaient le reste à la famille du défunt. {cite:mughni-ibn-qudama p.1389}{cite:mughni-ibn-qudama p.1390} Un legs n'est valable que si les autres héritiers le ratifient par consensus; s'ils le font, il est valide selon l'avis du jumhur, tandis que certains compagnons le considéraient nul même dans ce cas, à moins qu'un nouveau legs ne soit fait au légataire. {cite:mughni-ibn-qudama p.1390} Un legs pour un péché ou un acte interdit, tel que la construction d'une église ou d'une maison de feu, est invalide selon al-Shafi'i et Abu Thawr, mais autorisé par les juristes d'opinion. Les compagnons d'Ahmad divergeaient quant au legs du meurtrier, selon trois avis: Ibn Hamid et Abu al-Khattab l'autorisaient lorsqu'il était fait après la blessure, et al-Thawri et les juristes d'opinion l'autorisaient également. {cite:mughni-ibn-qudama p.1434-1435}{cite:mughni-ibn-qudama p.1436-1437} Les legs suspendus au décès sont considérés comme des legs et sont traités de la même manière, qu'ils soient antérieurs ou postérieurs, contrairement aux legs effectués du vivant, dont le premier prime. {cite:mughni-ibn-qudama p.1458}"
  ur: "لغت میں وصیّہ ایک چیز سے دوسری چیز میں شامل ہونے سے آتا ہے اور وصیت کردہ چیز کا نام بھی رکھ سکتا ہے۔ تکنیکی طور پر جائیداد کی وصیت ایک تحفہ ہے جو احسان کے ذریعہ کیا جاتا ہے اور موت کے بعد کے وقت سے منسلک ہوتا ہے، خواہ چیزوں کا ہو یا فوائد کا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17270} متعلقہ اصطلاحات کمیشن ⁦(ایصاء)⁩، عمل آوری ⁦(وصایا)⁩، تحفہ، جو زندگی میں ہو اور بغیر واپسی کے، اور صدقہ، جو ثواب کے طلبگار کے لیے زندگی میں ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17270}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17271} وصیت قرآن، سنت اور اجماع سے حلال ہے۔ قرآن وصیت اور قرض کو میراث سے پہلے اور سنت قرض کو وصیت سے پہلے رکھتا ہے۔ سعد بن ابی وقاص کی روایت ایک تہائی زیادہ ہے، اور یہ کہ وارثوں کو مالدار چھوڑنا انہیں محتاج چھوڑنے سے بہتر ہے۔ معاذ کی روایت ہے کہ اللہ تعالیٰ موت کے وقت ایک تہائی صدقہ نیکیوں میں اضافے کے طور پر دیتا ہے، اور ابن عمر کی روایت ہے کہ جس مسلمان کے پاس وصیت ہو وہ دو راتیں اس کے لکھے ہوئے بغیر نہ گزارے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17272} اس کا مقصد ذکر و ثواب حاصل کرنا، ان رشتہ داروں کو دینا جو میراث نہیں رکھتے اور ضرورت مندوں کی مدد کرنا ہے، اس شرط پر کہ کسی کو نقصان نہ پہنچے، یہ تہائی کے اندر رہے، اور یہ کہ کسی وارث کے لیے اس کی رضامندی کے بغیر روکنا جائز نہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17272}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17273} اکثر فقہاء کا خیال ہے کہ جائیداد کے کچھ حصے کی وصیت واجب نہیں ہے بلکہ نیکی چھوڑنے والے کے لیے مستحب ہے۔ اس رپورٹ کے ذریعہ وارثوں کے لئے ذمہ داری کو منسوخ کردیا گیا تھا کہ وارث کے لئے کوئی وصیت نہیں ہے، اور غیر وارثوں کے لئے سفارش باقی ہے. {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17273} تہائی سے کم کی وصیت کو ترجیح دی جاتی ہے۔ حنبلی کہتے ہیں کہ امیر کے لیے پانچواں حصہ افضل ہے۔ ابن عباس وغیرہ نے چوتھائی کو ترجیح دی۔ جہاں ورثاء غریب ہوں وہاں وصیت کم ہو جاتی ہے اور حنفی اور حنبلی مسلک میں غریب آدمی کو وصیت کرنے کی تلقین نہیں کی جاتی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17274}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17275} بعض ابتدائی حکام، جیسے کہ الزہری، مسروق اور طاؤس نے ان رشتہ داروں کے لیے وصیت کو واجب قرار دیا تھا، جو میں نے ان رشتہ داروں کی وصیت نہیں کی تھی جو میں نے ان کے بارے میں اطلاع نہیں دی تھی۔ عمر {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17275} وصیت کے ستون جمہور کے لیے چار ہیں: فارمولہ، وصیت کرنے والا، وصیت کرنے والا اور وصیت کی ہوئی چیز۔ احناف کے نزدیک ستون ابوحنیفہ اور ان کے دو اصحاب کے نزدیک پیشکش اور قبولیت ہے اور زفر کے نزدیک تنہا پیش کش ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17275}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17276} فارمولا کوئی بھی لفظ ہے جو موت کے بعد منتقلی کو ظاہر کرتا ہے۔ اکثریت تحریری وصیت قبول کرتی ہے۔ شافعی لکھنے کو نیت کا اشارہ سمجھتے ہیں، اور حنبلی اس کے لیے وصیت کرنے والے کے ہاتھ کا تقاضا کرتے ہیں۔ بولنے والے کی طرف سے اشارہ جمہور کے نزدیک صحیح نہیں ہے اور مالکیہ اس کی اجازت دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17276}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17277} قبولیت طرز عمل سے ہو سکتی ہے، جہاں وصیت کرنے والا چیز کو اس کے مالک کے طور پر فروخت، تحفہ یا کرایہ کے ذریعے پیش کرتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17278} اگر وصیت کرنے والے کے بعد وصیت قبول کیے بغیر مر جائے تو احناف اس چیز کو اس کے ورثاء کو دے دیتے ہیں۔ مالکیوں، حنبلیوں اور شافعیوں کا قول ہے کہ نامی شخص کے لیے قبولیت ضروری ہے، نہ کہ خاموشی، اور اگر وہ وصیت کرنے والے کے سامنے مر جائے تو وصیت ختم ہوجاتی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17278} سب اس بات پر متفق ہیں کہ وصیت کرنے والے کی موت کے بعد انکار وصیت کو باطل کر دیتا ہے۔ اس کی موت سے پہلے قبولیت یا انکار اکثریت کے مطابق کچھ بھی نہیں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17278}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17279} قبولیت اور انکار مرنے کے بعد ایک ساتھ نہیں آنا ضروری ہے۔ شافعی اور حنبلی اس بات کی اجازت دیتے ہیں کہ وارثوں کو فیصلہ کرنے والے کا تقاضہ کریں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17279} قبولیت واپس لینے پر تین قول ہیں: جمہور نے منع کیا ہے۔ بعض شافعی اور حنبلی قبضے سے پہلے اس کی اجازت دیتے ہیں۔ ایک تہائی اسے قبضے سے پہلے ناپے ہوئے سامان کی اجازت دیتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17279}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17280} شافعی مکتب میں جزوی قبولیت کا اختلاف ہے۔ زکریا الانصاری باطل کو ترجیح دیتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17280} ایک نامزد وراثت پوری صلاحیت کا حامل اپنے لیے قبول کرتا ہے یا انکار کرتا ہے۔ ایک بے نام گروپ جیسے غریبوں یا مساجد کو کسی کی ضرورت نہیں ہے۔ ایک وارڈ اپنے مفاد کے لیے اپنے سرپرست کے ذریعے قبول کرتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17280} اگر وصیت کرنے والے کے بعد کوئی نامزد وصیت قبول کیے بغیر فوت ہو جائے تو زفر کے علاوہ احناف اس وصیت کو ترجیح کے اعتبار سے درست سمجھتے ہیں۔ زفر اور حنبلی کا قول اسے وارث کی ملکیت قرار دیتا ہے اور اسے باطل کرتا ہے۔ اکثریت نے اس کے وارثوں کو اس کی جگہ کھڑا کرنے دیا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17280}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17281} وصیت مشروط کی جا سکتی ہے یا مستقبل کی تاریخ کی جا سکتی ہے: احناف اور شافعیہ اس کی اجازت دیتے ہیں۔ جب وصیت کرنے والا کہے کہ اگر میں اس بیماری سے مروں اور اس سے نہ مروں تو مالکیہ اسے باطل کرتے ہیں۔ حنبلی مرنے کے بعد متوقع حالت کی اجازت دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17281}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17283} وصیت کا پابند نہیں ہے۔ وصیت کرنے والا صحت یا بیماری کی حالت میں اس کا تمام یا کچھ حصہ منسوخ کر سکتا ہے جیسا کہ عمر سے روایت ہے کہ آدمی جو چاہے بدل سکتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17282} تنسیخ لفظ سے ہو سکتی ہے یا طرز عمل سے ہو سکتی ہے جیسے کہ فروخت، تحفہ، گروی، استعمال، ملاوٹ، اناج پیسنا، روئی کاتنا یا چیز پر عمارت۔ جمہور کا خیال ہے کہ وصیت کا انکار کرنا فسخ نہیں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17282}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17283} وصیت کرنے والے کو عقلمند ہونا چاہیے۔ حنفیہ، شافعی اور حنبلی بلوغت کا تقاضا کرتے ہیں، جب کہ مالکیہ اور حنبلی کا نظریہ ایک نابالغ کو ان امور میں جہاں وہ استطاعت رکھتا ہے۔ ایک دیوانہ، چکرا ہوا اور بے ہوش اس سے خارج ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17284}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17285} آزادی مطلوب ہے، اس لیے غلام کی وصیت باطل ہے۔ وصیت آزادانہ طور پر کی جائے، اس لیے زبردستی، مذاق یا غلطی سے اسے باطل کر دیتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17285} اکثریت وصیت کرنے والے کے مسلمان ہونے کی ضرورت نہیں رکھتی۔ شافعی اور حنبلی غیر مسلم کی وصیت کو قبول کرتے ہیں، جس میں شافعی کے نزدیک مرتد کی وصیت بھی شامل ہے جب تک کہ وہ مرتد نہ ہو جائے، جبکہ مالکی ارتداد کے دوران مرتد کی وصیت کو رد کرتے ہیں۔ {حوالہ: فقہ الموسوعۃ النور-v3 ص17286} احناف کے لیے، دشمن کے علاقے میں غیر مسلم دشمن کی وصیت صحیح ہے اگر وہ چیز وہاں موجود ہو جب وہ حفاظت میں ہوں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17286}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17287} حنفیہ، شافعیہ ⁦(ترجیحی قول)⁩ اور حنبلیوں کے لیے وصیت کے وقت وراثت کا موجود ہونا ضروری ہے۔ مالکیہ اور شافعی اور حنبلی کا قول اس شخص کے لیے وصیت کرتا ہے جو ابھی پیدا نہیں ہوا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17287}{cite:fiqh-masua-kuwaitiyya-noor-v3 p.17288} وراثت کا مالک ہونا ضروری ہے۔ وصیت کرنے والے کے لیے نامعلوم مردہ کے لیے وصیت باطل ہے، اور پھر مالکیہ اسے میت یا اس کے ورثاء کے قرضوں کی طرف بھیج دیتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17288} جنین کے لیے وصیت اس صورت میں درست ہے جب وہ معمول کی مدت کے اندر زندہ پیدا ہوا ہو: اس وصیت سے چھ ماہ جہاں ماں کا شوہر یا مالک ہو۔ شافعیوں اور حنبلیوں کے لیے چار سال ورنہ۔ احناف کے لیے دو سال۔ ابوحنیفہ، زفر، مالکیہ، شافعیہ اور حنبلی کے نزدیک دو بے نام مردوں میں سے ایک کی وصیت باطل ہے۔ ابو یوسف اس کو جائز سمجھتے ہیں اگر وہ راضی ہوں، اور محمد نے انتخاب کا اختیار وارثوں پر چھوڑ دیا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17289} ایسے گروہ کے لیے وصیت جس کا شمار نہ کیا جا سکتا ہو، جیسے غریب، جائز ہے۔ مالکیوں کو مساوی حصص کی ضرورت نہیں ہے، شافعی ترجیح کے مطابق تین کو اور حنبلی ایک کو دینا قبول کرتے ہیں۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17289} جہاں وصیت کرنے والا ایک ایسا گروہ ہو جسے شمار نہیں کیا جا سکتا، جیسے قبائل تمیم اور عاقل، حنفیہ کے نزدیک وصیت باطل ہے اور شافعی کے نزدیک کم پسند ہے، کیونکہ وصیت کرنے والا معلوم ہونا چاہیے۔ یہ صحیح ہے جہاں ان کو شمار کیا جا سکتا ہے، اور گنتی کے معنی میں اختلاف ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17290} جانور کے لیے وصیت خود باطل ہے۔ نامی شخص کے جانور کے چارے کی وصیت صحیح ہے اور اس کے چارہ پر خرچ کیا جاتا ہے، اور شافعیہ اور حنبلی کا اختلاف ہے کہ کسی خاص گھوڑے یا خدا کے لیے رکھے ہوئے گھوڑے کی وصیت کی جائے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17290}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17291} ایک مسلمان کی طرف سے عوامی کام جیسے مسجد کی تعمیر یا مرمت کی وصیت درست ہے کیونکہ یہ عبادت ہے۔ مالکیہ، شافعی اور حنبلی اس کی اجازت ایک جائز عوامی مقصد کے لیے کرتے ہیں۔ ایک مسلمان کی طرف سے چرچ بنانے کی وصیت کو اکثریت نے نافرمانی کے طور پر حرام قرار دیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17291}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17292} غیر مسلموں کی وصیت پر حنفیہ تقسیم کرتے ہیں: دونوں طرف سے جو عقیدت ہے وہ درست ہے۔ جو صرف مسلمانوں کے لیے عقیدت ہے وہ باطل ہے۔ صرف ان کے لیے عقیدت کیا ہے ابو حنیفہ اجازت دیتے ہیں اور ان کے دو صحابہ منع کرتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17292} شافعی اور محمد کے قول میں صرف خدا کے لیے وصیت تقویٰ کے کاموں پر خرچ ہوتی ہے اور ان کا مسلک وہی ہے جس کی پیروی احناف کرتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17292} شافعیوں، حنبلیوں اور ابو یوسف کی طرف سے جنگی مہم میں خدا کی وصیت خرچ کی جاتی ہے، اور محمد اور حنبلی کا قول حج کا اضافہ کرتا ہے۔ تقویٰ کے کاموں کی وصیت، حنبلیوں کے لیے، چھاپے سے شروع ہونے والے تمام عبادات کے لیے۔ حنفیوں کے لیے، ملکیت کی منتقلی کے بغیر کسی بھی چیز پر۔ اگر وصیت کرنے والا کہے کہ میرا تیسرا رکھو جہاں خدا تمہیں دکھاتا ہے تو حنبلی اسے کسی بھی عبادت کی اجازت دیتے ہیں۔ شافعی اپنے رشتہ داروں کو ترجیح دیتے ہیں جو وراثت میں نہیں ہیں، پھر اس کے قریبی رشتہ داروں کو دودھ کے اعتبار سے، پھر اس کے پڑوسیوں کو۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17293} وصیت باطل ہے جہاں وصیت کرنے والے نے وصیت کرنے والے کو قتل کیا ہو: حنفیہ، حنبلی، شافعی اور ثوری کا قول ہے کہ وصیت کرنے والا قاتل نہ ہو، اس قول پر انحصار کرتے ہوئے کہ قاتل کی ضعیف وصیت نہیں ہے۔ بار ایک قتل ہے جس میں بدلہ لیا جاتا ہے، خون بہانا یا کفارہ، غلطی سے بھی۔ احناف کے نزدیک براہ راست قتل اور وصیت کرنے والے کے وارث کی ضرورت ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17294} مالکیہ، شافعی کا پسندیدہ قول اور حنبلی روایت اس کی ضرورت نہیں ہے۔ مالکیوں کے لیے، اگر وصیت کرنے والے کو قتل کی وجہ معلوم ہو تو وصیت صحیح ہے۔ اگر وہ نہیں جانتا تھا تو اس میں دو قول ہیں اور الدسوقی نے باطل کو ترجیح دی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17294}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17295} فقہاء کا تقاضا ہے کہ وصیت کرنے والے کی موت پر جہاں دوسرا وارث موجود ہو اس کا وارث نہ ہو، اس قول پر کہ اللہ تعالیٰ نے ہر ایک کو اس کا حق دیا ہے، اس لیے اس کا کوئی حق نہیں ہے۔ جب تک کہ ورثاء کی رضامندی نہ ہو۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17295} اگر کچھ ورثاء راضی ہوں اور بعض نہ مانیں تو وصیت ان لوگوں کے حصہ کے لیے درست ہے جو اکثریت کے مطابق متفق ہیں۔ مالکیہ اور شافعی اور حنبلی اس کو باطل قرار دیتے ہیں اور اسے نئے سرے سے قبول کرنے کی ضرورت ہے۔ وصیت کرنے والے کی موت کے بعد، رضامندی ایک قابل شخص سے اور اکثریت کے لیے ہونی چاہیے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17296} مالکیوں کے لیے وصیت کرنے والے کی بیماری میں دی گئی رضامندی پابند ہے، اگر بیماری خطرناک ہو اور وہ ٹھیک نہ ہو۔ وارث کون ہے اس کا امتحان موت کا لمحہ ہے، وصیت کا لمحہ نہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17296}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17297} وراثت کے بارے میں شرائط مختلف ہوتی ہیں: پڑوسیوں کے لیے وصیت ابو حنیفہ کے لیے ملحقہ مکانات کے لیے ہے۔ دونوں ساتھیوں کے لیے، ملحقہ مکانات اور دوسرے کوارٹر میں جو مسجد میں شریک ہیں۔ مالکیوں کے لیے، چھ طرف سے ملحقہ مکانات اور ایک گلی کے اس پار۔ شافعیوں اور حنبلیوں کے لیے، ہر طرف چالیس گھر؛ حنبلی ان لوگوں کو بھی شمار کرتے ہیں جو اذان سنتے ہیں۔ {حوالہ: فقہ الموسوعہ-کویتیہ-نور-v3 صفحہ 17298} رشتہ داروں کے لیے وصیت: ابوحنیفہ کے لیے، رشتہ داروں کے درمیان قربت کے لحاظ سے قریبی رشتہ داروں کو نکاح کے بار میں، والدین اور بچوں کو چھوڑ کر؛ دونوں اصحاب کے لیے، وہ سب جو سب سے دور کے آباؤ اجداد سے تعلق رکھتے ہیں جو مسلمان تھا۔ مالکیوں کے لیے، باپ کا رشتہ دار وارث نہیں؛ شافعیوں کے لیے، تمام رشتہ دار چاہے دور ہی کیوں نہ ہوں، سوائے اعلیٰ اور اولاد کے ترجیحی نظریہ میں۔ حنبلیوں کے لیے، چار آباؤ اجداد کی اولاد۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17298}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17299} قریبی رشتہ داروں کے لیے وصیت: شافعیوں میں اولاد اور اولاد شامل ہے۔ ان کا ترجیحی نظریہ ایک بیٹے کو، چاہے وہ دور ہی کیوں نہ ہو، باپ سے پہلے اور بھائی کو دادا سے پہلے رکھتا ہے۔ حنبلی مکمل اور سوتیلے بہن بھائیوں میں فرق کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17299}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17300} وصیتیں سسرال والوں کو، رشتہ داروں کو نکاح سے، گھر والوں کو اور اہل علم کی اپنی عقلیں ہیں: کیونکہ احناف کے خون اور رشتہ داروں میں بیویاں ہیں۔ حرام رشتہ داروں کے شوہر؛ علماء، اکثریت کے نزدیک، فقہاء اور حدیث کے ماہرین ہیں، جن میں شافعی اور حنبلی مفسرین شامل کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17300}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17301} محفوظ شخص کے لیے غیر مسلم کے لیے وصیت درست ہے۔ حنبلی اس کا نام لینا چاہتے ہیں۔ حنفیہ، شافعی، مالکیوں اور حنبلیوں کے نزدیک یہ محفوظ غیر ملکی کے لیے جائز ہے۔ دشمن کے لیے: شافعی ترجیحی نقطہ نظر میں اور حنبلی صوتی نقطہ نظر میں اس کی اجازت کسی نامزد دشمن کو دیتے ہیں، جب کہ مکتب میں حنفیہ اور مالکیہ دشمن کے علاقے میں اسے منع کرتے ہیں۔ مرتد کے لیے حنفیہ، مالکی اور حنبلی اس کو حرام قرار دیتے ہیں، اور شافعی اور صیغہ حنبلی اس کی اجازت نامی مرتد کو دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17301}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17303} چوتھا ستون، جو چیز وصیت کی گئی ہے، جائیداد ہونی چاہیے۔ اس میں نقد رقم، سامان، دوسروں کے واجب الادا قرض، رقم میں ماپا جانے والے حقوق، اور وہ فوائد شامل ہیں جو بیچے، دیے یا کرایہ پر لیے جا سکتے ہیں۔ ابن ابی لیلیٰ اور ابن شبرومہ نے وصیت سے منع کیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17303}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17304} یہ قانون کے لحاظ سے قابل قدر ہونا چاہئے: شراب، سور کا گوشت، وحشی کتے یا حیوان کی طرف سے یا کسی مسلمان کی طرف سے وصیت کرنا غیر موزوں ہے۔ ایک عیسائی وصیت کر سکتا ہے کہ اس کے عقیدے میں کیا اہمیت ہے۔ ایک تربیت یافتہ کتا یا شکار کے لیے موزوں جانور کی وصیت کی جا سکتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17304} صرف قیمت کی جائیداد کی وصیت کی جا سکتی ہے۔ شافعیوں کے لیے چمڑے کی رنگت سے پہلے کی وصیت صحیح ہے، اور سونے یا چاندی کے برتن کی وصیت صحیح ہے، کیونکہ یہ زیور کے استعمال میں نہ ہونے یا بیچنے کی صورت میں استعمال کی جا سکتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17305} بعض فقہاء اس بات کا تقاضا کرتے ہیں کہ جو وصیت کی گئی ہے وہ مرنے کے بعد عقد کے ذریعے منتقل کی جا سکتی ہے: احناف اور شافعی کا نظریہ اس کا تقاضا کرتا ہے۔ کھجور کے درختوں سے ایک سال کی کھجور کی وصیت صحیح ہے، اور احناف اس وصیت کو رد کرتے ہیں کہ ریوڑ کیا لے گا۔ اکثریت اس چیز کی وصیت کی اجازت دیتی ہے جو ابھی تک موجود نہیں ہے، جیسا کہ سلام کے ذریعے فروخت کرنا اور باغات کی دیکھ بھال اور لیز پر دینا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17305}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17306} کسی نامعلوم چیز کی وصیت، جیسے کہ اس کے ریوڑ میں سے ایک بھیڑ، اور جس چیز کو وہ دے نہیں سکتا، جیسے معاہدہ کے ذریعے آوارہ اونٹ؛ غیر منقسم حصہ یا تقسیم شدہ کی وصیت جمہور کے مطابق درست ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17305}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17306} احناف کے نزدیک چیز کا اس وقت موجود ہونا ضروری ہے جس کا انحصار اس کی نوعیت پر ہو: وصیت پر نام کی جائیداد۔ وصیت کرنے والے کی موت پر پوری جائیداد کا حصہ، جیسے تہائی یا چوتھائی؛ وصیت میں جائیداد کے حصے کا حصہ۔ {حوالہ: فقہ الموسوعۃ-کویتیہ-نور-v3 صفحہ 17306} چیز وصیت کرنے والے کی ہونی چاہیے: مالکیہ، شافعی اور حنبلی مسلک کے نزدیک کسی دوسرے کے مال کی وصیت باطل ہے خواہ بعد میں وہ اس کا مالک ہو۔ حنفیہ، ایک اور شافعی اور حنبلی مسلک اس کی اجازت مالک کی رضامندی سے مشروط ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17306}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17307} حرام چیز کی وصیت باطل ہے کیونکہ اس کا مقصد زندگی میں نیکی کی قضاء ہے۔ حنفیہ اور شافعیہ کے نزدیک اس رقم کے لیے وصیت نہیں کی جاتی جو تمام املاک کو جذب کر لے جب تک کہ قرض خواہ اسے جاری نہ کر دیں۔ مالکیوں کا خیال ہے کہ وصیت کرنے والا جس کی جائیداد پوری طرح واجب الادا ہو وہ وصیت نہیں کر سکتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17307}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17308} جہاں وصیت کرنے والے کے وارث ہوں، وہاں تیسرے سے اوپر کی وصیت جمہور کے مطابق صرف ان کی رضامندی سے درست ہے۔ اگر وہ رضامند ہوں تو وہ قائم رہتا ہے، اور اگر وہ انکار کرتے ہیں تو وہ گر جاتا ہے۔ جہاں کوئی وارث نہ ہو وہاں احناف وصیت کر کے ساری جائداد لے لیتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17308} جائیداد میں سے حصہ کی وصیت پر: ابو حنیفہ اور حنبلی مکتب کے لیے جہاں تقسیم کے چھ سے کم حصے ہوتے ہیں وہ چھٹا حصہ لیتا ہے۔ دوسرے آراء اسے وارث کے چھوٹے حصے یا تہائی یا چھٹے حصے پر طے کرتے ہیں۔ مالکی اس لحاظ سے فرق کرتے ہیں کہ آیا جائیداد عوض کے تابع ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17309}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17310} جائیداد کے کسی حصے یا حصے کی وصیت اگر وصیت کرنے والے نے اس کی زندگی میں بیان نہ کی ہو تو وارثوں کی طرف سے دی گئی ہو، جیسا کہ وہ مرنے کے بعد حنفیہ ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17310} سیاق و سباق کے مطابق بھیڑ کی وصیت جوان یا بوڑھے، نر یا مادہ کا احاطہ کرتی ہے۔ حنبلی وہ نام دیتے ہیں جو عام طور پر احاطہ کرتا ہے۔ کسی جانور کی وصیت کو رواج کے مطابق گھوڑے، خچر یا گدھے سے تعبیر کیا جاتا ہے۔ کتے کی وصیت جو وصیت کرنے والے کے پاس نہ ہو باطل ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17310}{cite:fiqh-masua-kuwaitiyya-noor-v3 p.17311} ان میں سے کسی ایک کے لیے جنگ کے ڈھول کی وصیت درست ہے۔ تفریح کے لیے کسی آلے کی وصیت درست ہے اگر اسے کسی جائز مقصد کے لیے استعمال کیا جا سکے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17311} وصیت جمہور کے اعتبار سے درست ہے اور اس کی قیمت تیسرے سے لی جاتی ہے۔ اگر یہ تیسرے سے زیادہ ہو تو اسے صرف تیسرے تک کی اجازت ہے۔ احناف کے نزدیک جب وراثت مر جائے تو فائدہ اس کے مالک کو لوٹتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17311}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17314} ایک مقررہ سال کے فائدے کی وصیت کو مدت کے دوران چیز کی قیمت کے نقصان سے تیسرے کے مقابلے میں شمار کیا جاتا ہے۔ جہاں فائدہ ورثہ اور وارثوں کے درمیان بانٹ دیا جاتا ہے اسے کرایہ کے ذریعے تقسیم کیا جاتا ہے، اگر تقسیم ہو تو چیز کی تقسیم، یا وقت یا جگہ کی تبدیلی سے۔ وصیت اس وقت ختم ہو جاتی ہے جب مدت موت سے پہلے ختم ہو جائے، جب وصیت کرنے والا اپنا حق چھوڑ دے، اور حنفی کے نزدیک جب وہ اسے لینے سے پہلے مر جائے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17312}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17315} جہاں وصیت کرنے والے کو چیز کے استعمال سے روکا گیا ہو، وہاں حنفیہ اس سے روکنے والے کو نفع کی قیمت ادا کر دیں یا دوسری مدت مقرر کر دیں، خواہ اس نے ایک اور مدت کا دعویٰ کیا ہو۔ وقت گزر گیا ہے. {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17316} مالکی اس شخص کو اس کا ذمہ دار ٹھہراتے ہیں جو فائدہ کو ضائع کردے۔ شافعیہ اور حنبلیوں کا خیال ہے کہ کسی چیز کا کوئی حق اس کے بدلے میں چلا جاتا ہے، اس لیے اگر کوئی جانور جس کی وصیت کی گئی ہو اسے قتل کر دیا جائے تو اس کی قیمت اس چیز کو خریدنے کے لیے استعمال کی جاتی ہے جو اس کی جگہ کھڑا ہو۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17316} شافعی کہتے ہیں کہ اگر ایک سال کے لیے مکان کی وصیت کی جائے اور وصیت کرنے والا اس سال کے لیے اجازت دے اور ٹھیکے کے بعد مر جائے تو وصیت باطل ہے۔ اگر وہ چھ ماہ کے بعد فوت ہو جائے تو پہلا نصف باطل ہے اور باقی حصہ لینے والا لے گا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17316} جس چیز کا فائدہ وصیت کیا گیا ہو اس کی دیکھ بھال حنفیہ، مالکیہ اور حنبلی مسلک کے فائدے والے پر ہے اور شافعیوں کے نزدیک پسندیدہ چیز کے مالک پر ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17317} وراثت سے گزرنے والے آرام کے حقوق کی وصیت، جیسے پانی کا حق، نکاسی آب کا حق اور اوپر کی طرف تعمیر کرنا، صحیح ہے۔ ایک وصیت جو وارثوں میں جائیداد کی تقسیم کے مترادف ہے اس کے اپنے اصول ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17317} ہر ایک وارث کے لیے غیر منقسم حصہ کی وصیت شافعیوں کے لیے باطل ہے، جیسا کہ وارث اسے وراثت سے لیتا ہے۔ کسی خاص چیز کے ہر وارث کو وصیت کرنے کے لیے شافعی کے پسندیدہ قول میں ورثاء کی رضامندی ضروری ہے، کیونکہ مقاصد مختلف ہیں۔ {حوالہ: فقہ الموسوعۃ-کویتیہ-نور-v3 صفحہ 17318} جب بات گزر جاتی ہے: مکتب حنبلی، مالکی مسلک اور شافعی مسلک کے لیے، ایک نامزد وارث صرف مرنے کے بعد قبولیت کا مالک ہوتا ہے، اس لیے قبولیت سے پہلے کا اضافہ وارثوں کا ہے۔ حنفیہ اور ترجیحی مالکی کے نزدیک مرنے کے بعد اضافہ وارث کا ہے۔ شافعی کا پسندیدہ نظریہ ملکیت کو اس وقت تک معطل رکھتا ہے جب تک کہ وہ قبول یا انکار نہ کر دے۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 17318} کفن اور تدفین کے اخراجات اور لوگوں پر واجب الادا قرضوں کے بعد وصیت کردہ تحفے تیسرے بائیں سے کئے جاتے ہیں۔ احناف کے نزدیک خدا کے ذمے واجب الادا قرض جیسے حج، زکوٰۃ، نذر اور کفارہ صرف تیسرے سے آتے ہیں اور اکثریت کے لیے پوری جائیداد سے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17319} اگر وصیت کرنے والا مستقل طور پر دیوانہ ہو جائے تو احناف کے لیے وصیت باطل ہے، چاہے وہ موت تک رہے یا موت سے پہلے صحت یاب ہو جائے۔ مستقل پاگل پن ابو یوسف کے لیے ایک مہینہ یا اس سے زیادہ اور محمد کے لیے ایک سال ہے۔ ایک بیہوش اور ایک عارضی پاگل پن اسے باطل نہیں کرتا۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17319} وصیت باطل ہے جہاں وصیت کرنے والا دیوانہ ہو جس کا پاگل پن مستقل ہو۔ ابن النجار کے مطابق جو شخص دیوانہ ہو جائے لیکن صحت یاب ہو جائے اور وصیت کر لے وہ صحیح ہے۔ شافعیوں کا خیال ہے کہ بعد میں آنے والا پاگل پن باطل نہیں ہوتا۔ وصیت کرنے والے کا ارتداد حنفیہ اور مالکیوں کے لیے اس کی وصیت کو باطل کر دیتا ہے۔ مالکیوں کا مزید کہنا ہے کہ اگر وہ اسلام کی طرف لوٹتا ہے تو تحریری وصیت ہوتی ہے اور غیر تحریری وصیت نہیں ہوتی۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17320} شافعیوں اور بعض مالکیوں کے نزدیک ولی کا ارتداد باطل نہیں ہوتا۔ مکتب میں مالکی اسے باطل قرار دیتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17320} وصیت واجب نہیں ہے، اس لیے وصیت کرنے والا جب چاہے اسے منسوخ کر سکتا ہے، عمر کے اس قول کے بعد کہ آدمی جو چاہے بدل سکتا ہے۔ الشعبی، ابن سیرین، ابن شبروما اور النخعی اسے اجازت دیتے ہیں کہ وہ دستبرداری کے علاوہ کسی بھی چیز کو تبدیل کریں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17320} تنسیخ یا تو ظاہر ہے، جیسے کہ میں اپنی وصیت کو منسوخ کرتا ہوں، جس پر اتفاق کیا گیا ہو، یا عمل سے: کسی چیز کی فروخت، ہدیہ، خیرات یا وقف، یا اس پر کوئی عمل جیسے بھیڑ کو ذبح کرنا، کاتنا یا اس کا نام تبدیل کرنا، اس طرح کا کوئی عمل۔ اناج کو پیسنا یا دروازے پر تختہ بنانا جسے حنفیہ، شافعی اور حنبلی فسخ قرار دیتے ہیں۔ وصیت کا انکار اکثر فقہاء کے نزدیک منسوخ نہیں ہے۔ وصیت اس وقت باطل ہے جب وصیت کرنے والا وصیت کرنے والے کی موت کے بعد انکار کر دے، جب وصیت کرنے والا وصیت کرنے والے سے پہلے مر جائے، اتفاق سے، اور جمہور کے لیے، جب وہ وصیت کرنے والے کے بعد بغیر قبول کیے مر جائے۔ احناف کے لیے وصیت ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17322} وصیت کرنے والے کے ذریعہ وصیت کرنے والے کے قتل میں اختلاف ہے۔ وصیت اس وقت باطل ہے جب وصیت کی گئی چیز مخصوص ہو اور قبول ہونے سے پہلے ہی فنا ہو جائے، یا جب یہ ظاہر ہو کہ وہ کسی اور کی ملکیت ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17322}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17323} وارث کے لیے وصیت اس وقت تک باطل ہے جب تک کہ وارث رضامند نہ ہوں، جیسا کہ پہلے بیان کیا گیا ہے۔ {حوالہ:فقہ الموسوعۃ کویتیہ نور-v3 ص17323} قاعدہ یہ ہے کہ جہاں وارث ہو وہاں وصیت ایک تہائی جائیداد سے زیادہ نہیں ہو سکتی۔ اگر وصیتیں تہائی سے زیادہ ہوں اور ورثاء راضی نہ ہوں تو وصیت کرنے والے اپنی وصیت کے تناسب سے تہائی حصہ دیتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17323} احناف کے لیے جب وصیتیں جمع کی جاتی ہیں تو خدا کے حقوق سب سے پہلے رکھے جاتے ہیں: واجب عبادات جیسے زکوٰۃ اور حج، پھر کفارہ، نذر اور زکوٰۃ الفطر، اور رضاکارانہ اعمال۔ لوگوں کے لیے وصیت کی درجہ بندی اس وقت تک نہیں کی جاتی جب تک کہ متن کے ذریعے، یا جب تک کہ یہ دستبرداری یا فائدے کی وصیت نہ ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17323}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17324} جہاں مقتدیوں کا مساوی دعویٰ ہے، تیسرے کو حنفی مکتب میں یکساں طور پر شریک کیا گیا ہے۔ جہاں ایک کو پوری جائیداد اور دوسرے کو تہائی کی وصیت کی جاتی ہے، ابو حنیفہ تیسرے کو دو حصوں میں تقسیم کرتے ہیں، جبکہ ابو یوسف اور محمد نے اسے چار حصوں میں تقسیم کیا ہے۔ ابن عابدین نے امام کے قول کو قبول کیا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17325} مالکیہ بعض وصیتوں کو دوسروں پر درجہ دیتے ہیں جب تیسرا بہت چھوٹا ہوتا ہے: قیدی کو فدیہ دینا، پھر غلام کی عارضی رہائی، پھر زکوٰۃ، فطرانہ، ظہار کا کفارہ، قتل، پھر قتل و غارت؛ ایک ہی درجہ کے حصہ میں وصیتیں. {حوالہ:فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 17325} جہاں وصیتیں تیسرے حصے میں آتی ہیں اور ورثاء رضامند نہیں ہوتے، وصیت کرنے والے تیسرے کو بطور قرض دار دیوالیہ جائیداد میں شریک کرتے ہیں، اور مالکی ڈیڑھ، تہائی اور ایک چوتھائی کے ساتھ کام کی مثالیں دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17326}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17327} مالکیوں نے اس طرح کی وصیت کو نامعلوم شخص کے ساتھ ایک نام کے ساتھ بانٹنا، نامعلوم کو حساب میں ایک تہائی دینا شامل ہے۔ سہنون وقت کی حد کے بغیر وصیت کو جائیداد کا تہائی سمجھتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17327} شافعیوں کے لیے، موت سے متعلق تحائف تیسرے سے قدر یا رقم کے لحاظ سے تقسیم کیے جاتے ہیں، ترتیب کے لحاظ سے کوئی ترجیح نہیں۔ ان کے درمیان manumission قدر کے لحاظ سے تقسیم کیا جاتا ہے، اور ایک نظریہ اسے ترجیح دیتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17328} حنبلیوں کے لیے تیسرا حصہ ان کی وصیت کے تناسب سے مقتدیوں کے درمیان ہے، اور احمد کی ایک رپورٹ میں سب سے پہلے اس کی وصیت کی گئی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17328}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17329} وصیت لکھنا مستحب ہے: بسم اللہ، حمد، ایمان کی گواہی سے شروع کریں، پھر گواہوں کو بلائیں۔ صحابہ کرام سے روایت ہے کہ وہ اپنی وصیت کے سر پر بسم اللہ لکھتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17329}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17330} وصیت کا ثبوت گواہی اور تحریر سے ہے: حنفیہ اور شافعی گواہوں کے سامنے لکھی ہوئی تحریر کو قبول کرتے ہیں یا گواہی دینے والے کو تسلیم نہیں کرتے، ہاتھ سے تصدیق نہیں کرتے۔ مالکی گواہوں کے ساتھ وصیت کرنے والے کا ہاتھ قبول کرتے ہیں۔ حنبلی وارثوں یا شواہد سے ثابت شدہ لکھاوٹ کو قبول کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17330}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17331} جب جائیداد جزوی طور پر موجود ہو اور جزوی طور پر غائب ہو یا قرض ہو تو حنفیہ اور حنبلی موجودہ رقم کی وصیت تیسرے سے کرتے ہیں۔ شافعی باقی نام والی چیز کو اس وقت تک سسپنس میں رکھتے ہیں جب تک کہ وہ غائب نہ ہو جائے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17332}{cite:fiqh-Mawsua-kuwaitiyya-noor-v3 p.17333} وصیتیں حصص کی طرف سے ہو سکتی ہیں، حصے کی طرف سے یا دونوں سے۔ جو شخص وارث کے برابر حصہ کی وصیت کرتا ہے، زیادہ تر فقہاء کے نزدیک وہ حصہ مقدمے میں شامل ہوتا ہے۔ جب ورثاء کی رضامندی ہو تو مالکی مختلف طریقے سے تقسیم کرتے ہیں، شافعی اور حنبلی کم سے کم حصہ دیتے ہیں جہاں وارثوں میں اختلاف ہوتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17333}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17334} احناف کے نزدیک وصیت کرنے والے کے بیٹوں میں سے ایک کے برابر کی وصیت درست ہے۔ اگر بیٹا وارث نہ ہو تو جمہور وصیت کرنے والے کو کچھ نہیں دیتے اور مالکی بیٹے کا حصہ دیتے ہیں اگر وصیت کرنے والے نے کہا کہ وہ وارث ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17335}{cite:fiqh-Mawsua-kuwaitiyya-noor-v3 p.17336} ایک تہائی تک معلوم حصہ کی وصیت کا شمار حصص کی مشترکہ بنیاد سے حصہ لے کر کیا جاتا ہے۔ اگر بقیہ وارثوں میں تقسیم نہ ہو تو وارثوں کی بنیاد کو وصیت کی بنیاد سے یا کسی مشترک عامل سے ضرب دیا جاتا ہے جیسا کہ مالکیہ، شافعی اور حنبلی اس کی گنتی کرتے ہیں، تین بیٹے اور ایک تہائی مثال کے طور پر۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17337}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17338} تیسرے کے اندر دو یا زیادہ حصوں کے لیے، بنیادوں کو ایک ساتھ ضرب دیا جاتا ہے تاکہ دونوں حصص کی بنیاد پیدا کی جا سکے۔ مالکیوں نے تین بیٹوں اور چھٹے اور ساتویں کے ساتھ مثال دی ہے، اور شافعی دو والدین کے ساتھ مثال دیتے ہیں، آٹھویں اور پانچویں؛ حنبلی فرقوں کو ایک مشترکہ بنیاد پر کم کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17339}{cite:fiqh-Mawsua-kuwaitiyya-noor-v3 p.17340} تیسری کے اوپر ایک وصیت جس سے جائیداد ختم نہ ہو وارث کی رضامندی ضروری ہے۔ اگر وہ رضامند ہوں تو جائیداد کو حصص سے تقسیم کیا جاتا ہے، جیسا کہ ڈیڑھ، تہائی اور چوتھائی میں، جہاں بنیاد بارہ ہے اور رقم ایک سے بڑھ جاتی ہے، جس پر اتفاق کیا جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17340}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17341} جب ورثاء تیسرے پر زیادتی کو رد کرتے ہیں، تو فقہاء کا اس بات پر اختلاف ہے کہ تیسرے کو وارثوں میں کیسے تقسیم کیا جاتا ہے۔ مالکیہ، شافعی، حنبلی، ابو یوسف اور محمد کا خیال ہے کہ تیسرا حصہ ورثاء کے حصہ سے اس طرح تقسیم کیا جاتا ہے جیسے ورثاء نے رضامندی دی ہو، اور دو تہائی وارثوں کے حصے میں جائے، اور اس سے کوئی فرق نہیں پڑتا کہ وراثت تیسرے سے زیادہ ہے۔ ابوحنیفہ، ابو ثور اور ابن المنذر کہتے ہیں کہ زیادتی بغیر رضامندی کے باطل ہے، لہٰذا زائد کا وارث صرف تیسرے کے لیے شمار ہوتا ہے، کیونکہ زیادتی کی وصیت صحیح نہیں تھی اور اس کے اندر کی ترجیح اس کے ساتھ آتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17341}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17342} مثالیں: ڈیڑھ چوتھائی، ورثاء کی طرف سے مسترد، اکثریت کو تین حصے دیں ⁦(دو حصے کو، ایک کو نصف کو)⁩۔ حنیفہ ⁦(چار اور تین)⁩۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17341}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17342} ڈیڑھ تہائی، رد، تیرہ حصے اکثریت کو اور گیارہ ابو حنیفہ کو۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17342} جب وصیتیں جائیداد اور وارثوں کی رضامندی سے ختم ہوجاتی ہیں، تو وہ عوّل کے مقررہ حصّوں کی طرح برتاؤ کرتے ہیں، اور ہر وارث ایک مقررہ حصہ لیتا ہے گویا کہ وارث کے لیے خدا نے مقرر کیا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17342} اگر ورثاء زائد کو رد کر دیں تو اکثریت ورثاء میں ان کے حصہ کے تناسب سے تہائی تقسیم کر دیتی ہے، جب کہ ابو حنیفہ، ابو ثور اور ابن المنذر بغیر رضامندی کے تیسرے سے زیادہ وصیت والے کو شمار نہیں کرتے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17342} ایک مثال: تمام زید کی طرف اور تیسری عمرو کی طرف۔ رضامندی سے تقسیم بڑھ کر چار حصے ⁦(تین زید سے، ایک عمرو تک)⁩۔ بغیر رضامندی کے تیسرے کو چار پر تقسیم کیا جاتا ہے، اور وصیت کی بنیاد اکثریت کے خیال سے بارہ ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17342} حنفی اعداد و شمار اس معاملے کے لیے جہاں دونوں بیٹے رضامند نہیں ہوتے ⁦(ص17343)⁩ سکین میں گڑبڑ کر دیے گئے ہیں، اس لیے وہ یہاں نہیں دیے گئے ہیں۔ پڑھنا مشکوک اور نشان زد ہے۔ تیسری صورت حصص کی وصیت کے ساتھ حصص کی وصیت کا مجموعہ ہے۔ اس کی کئی صورتیں ہیں: ایک وصیت وارث کے حصہ کے برابر اور پوری جائیداد کے ایک حصے کے ساتھ، حصہ کے بعد جو کچھ باقی رہ جاتا ہے اس کا ایک حصہ، اور جائیداد کے ایک حصے کے ساتھ حصہ کی وصیت۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17343}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17345} حنفی مثال میں دو بیٹوں کے ساتھ، ایک وارث کو تیسرا اور دوسرے کو بیٹے کے حصہ کے برابر رقم ملتی ہے۔ دونوں بیٹوں کی رضامندی سے کھاتہ نو سے چلتا ہے، اس لیے تیسرا وارث تین لیتا ہے اور باقی کو دو بیٹوں میں اور حصہ دار کو تیسرے حصے میں تقسیم کیا جاتا ہے، ہر بیٹے کو دو اور حصہ دار کو دو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17343} اگر صرف ایک بیٹا رضامند ہو جائے تو اکاؤنٹ بڑھ کر اٹھارہ ہو جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17343}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17344} جب وصیت تیسرے سے زیادہ نہ ہو تو شافعی حصہ والے کو وارثوں میں سے سمجھتے ہیں۔ حنبلیوں کے دو قول ہیں، ایک ترجیحی حصہ دار کو رضامندی پر جائیداد کا ایک تہائی دینا، اور دوسرا اسے دینا جو بیٹے کو ملے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17344}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17345} حصہ کے بعد جو حصہ بچتا ہے اس کی وصیت کے لیے پانچ بیٹوں کی حنفی مثال اکیاون کی بنیاد دیتی ہے: تیسرے حصے میں سے ایک حصہ، تیسرے حصے میں سے آٹھ کا حصہ۔ باقی ہے، اور ہر بیٹے کو آٹھ۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17345} اگلے صفحات پر مالکی، شافعی اور حنبلی کی مثالیں نامعلوم مقداروں اور تصحیح کا طریقہ استعمال کرتی ہیں۔ اعداد و شمار کتاب کے کام کی لائنوں میں ہیں اور یہاں خلاصہ کیے گئے ہیں، دوبارہ پیش نہیں کیے گئے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ17345}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ17346}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17347} مثال کے طور پر ایک حصہ اور حنبلی کے بیٹے کے ساتھ وصیت کا حصہ۔ اس کے حصے کے برابر وصیت کی جائے سوائے آدھی جائیداد کے وارث کو چوتھائی حصہ ملتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17347} تین بیٹوں اور جائیداد کے ساتویں حصے کے علاوہ ایک حصہ کے برابر وصیت کے لیے ریاضی تریسٹھ کی بنیاد پر چلایا جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17348} حصص اور حصوں کے ساتھ مستثنیٰ چار قسموں میں آتا ہے۔ سب سے پہلے، حصہ کے بعد جو باقی رہ جاتا ہے اس کا ایک حصہ ⁦(پانچ بیٹے، بنیاد ستاون)⁩۔ دوسرا، وصیت کے بعد جو کچھ باقی رہ جاتا ہے اس کا ایک حصہ ⁦(تین بیٹے، تیرہ کی بنیاد کے ساتھ)⁩۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17349} تیسرا، وصیت کے بعد جو حصہ باقی رہ جاتا ہے اس کا ایک حصہ۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17349} چوتھا، حصہ کے بعد جائیداد کے ایک حصے کا ایک حصہ، جس کی بنیاد تین بیٹوں کے لیے انتیس ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 ص17349} جب وصیت کرنے والا استثناء بیان کرے بغیر یہ کہے کہ یہ حصہ کے بعد ہے یا وصیت کے بعد تو اس کے دو قول ہیں۔ پہلا جسے ابن قدامہ نے اکثر فقہاء کی طرف منسوب کیا ہے، اسے حصہ کے بعد پڑھتے ہیں، کیونکہ حصہ وہی ہے جس کا نام رکھا گیا تھا۔ دوسرا اسے وصیت کے بعد پڑھتا ہے، جس سے بڑا استثنیٰ حاصل ہوتا ہے اور اسی طرح چھوٹی میراث؛ وراثت کو کم سے کم پڑھا جاتا ہے۔ یہ دوسرا قول اکثر شافعیوں کا ہے اور ابن قدامہ نے اسے محمد الشیبانی اور بصری فقہاء کی طرف منسوب کیا ہے۔ ابن قدامہ کی کتاب وصیت میں جائیداد کی وصیت کی تعریف مرنے کے بعد اس پر عائد ہونے والے چارج کے طور پر کی گئی ہے، اس کی بنیاد سنت اور ضابطہ ہے۔ واجب ہے صرف اسی پر واجب ہے جس پر قرض ہو، امانت ہو یا واجب الادا ہو اس کے ذریعے ادا کرنا، اس لیے جمہور کے نزدیک کسی کے مال کے حصے کی وصیت کسی پر لازم نہیں ہے، اگرچہ کسی فرقے نے اسے واجب کیا ہو۔ {حوالہ: مغنی ابن قدامہ ص1387} قرابت داروں کو وصیت کرنے پر اکثر علماء کا خیال ہے کہ غیر وارثوں کو وصیت کرنا جائز ہے چاہے وصیت کرنے والے کے قریبی رشتہ داروں کو چھوڑ دیا جائے۔ طاؤس، الضحاک اور عبد الملک بن یعلٰی نے کہا کہ اسے وارث سے لے کر اس کے رشتہ داروں کو واپس کر دیا گیا، جب کہ سعید بن المسیب، الحسن اور جابر بن زید نے وصیت والے کو تہائی حصہ دیا اور باقی مقتول کے رشتہ داروں کو واپس کر دیا۔ {حوالہ:مغنی ابن قدامہ ص1389}وصیت:مغنی ابن قدامہ ص1390} کسی وارث کے لیے وصیت نہیں ہوتی جب تک کہ دوسرے وارث اس کی توثیق نہ کر لیں۔ اگر وہ ایسا کرتے ہیں تو جمہور کے خیال میں ہے، جب کہ بعض صحابہ نے اسے باطل قرار دیا ہے جب تک کہ وہ اسے نیا تحفہ نہ دیں۔ {حوالہ: مغنی ابن قدامہ ص1390} گناہ یا حرام کام کی وصیت مثلاً کلیسا یا آگ کا گھر بنانا، شافعی اور ابو ثور کے نزدیک باطل ہے لیکن فقہا نے اسے جائز قرار دیا ہے، اور احمد کے اصحاب کا قاتل کے بارے میں اختلاف ہے - ابو کعب نے وصیت کی اجازت کے بعد تینوں میں ابو کعب کی وصیت کی ہے۔ زخم، اور الثوری اور فقہا نے اس کی اجازت دی ہے۔ {حوالہ:مغنی ابن قدامہ صفحہ 1434-1435}{cite:مغنی ابن قدامہ صفحہ 1436-1437} موت پر موقوف تحفے حکمرانی میں وصیت کرتے ہیں اور برابر ہوتے ہیں خواہ پہلے یا بعد میں، زندگی میں مکمل ہونے والے تحائف کے برعکس، جن کی پہلی ترجیح ہوتی ہے۔ {حوالہ: مغنی ابن قدامہ ص1458}"
