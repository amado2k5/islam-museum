summary:
  ar: "يبين ابن سينا أن ما يستفرغ ويحتبس يدل من وجوه: احتباس غير طبيعي، أو استفراغ غير طبيعي من جوهر العضو بدلالة جوهره أو مقداره أو لونه، أو من غير جوهره بدلالة خروجه أو كيفيته أو جوهره أو مقداره أو جهته {cite:canon-ibn-sina-print-v1 p.157}."
  en: "Ibn Sina shows that what is evacuated or held back points in several ways: an unnatural retention, or an unnatural evacuation, either of the organ's own substance, read by its kind, amount or colour, or of something else, read by its coming out at all, its quality, its substance, its amount or its direction {cite:canon-ibn-sina-print-v1 p.157}."
