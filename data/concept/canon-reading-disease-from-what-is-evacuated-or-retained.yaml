id: concept/canon-reading-disease-from-what-is-evacuated-or-retained
class: concept
kind: scientific
label:
  ar: "الاستدلال مما يستفرغ ويحتبس عند ابن سينا"
  en: "Reading disease from what is evacuated or retained in the Canon"
  fr: "Reconnaître la maladie par évacuations et rétentions dans le Canon"
  ur: "خارج ہونے اور رکنے والی چیز سے استدلال، قانون کے مطابق"
  es: "Interpretación de la enfermedad a partir de lo que se evacua o se retiene en el Canon"
summary:
  ar: "يبين ابن سينا أن ما يستفرغ ويحتبس يدل من وجوه: احتباس غير طبيعي، أو استفراغ غير طبيعي من جوهر العضو بدلالة جوهره أو مقداره أو لونه، أو من غير جوهره بدلالة خروجه أو كيفيته أو جوهره أو مقداره أو جهته {cite:canon-ibn-sina-print-v1 p.157}."
  en: "Ibn Sina shows that what is evacuated or held back points in several ways: an unnatural retention, or an unnatural evacuation, either of the organ's own substance, read by its kind, amount or colour, or of something else, read by its coming out at all, its quality, its substance, its amount or its direction {cite:canon-ibn-sina-print-v1 p.157}."
  fr: "Ibn Sina distingue rétention ou évacuation non naturelles : substance de l’organe interprétée selon nature, quantité ou couleur ; autre matière interprétée selon sa seule sortie, sa qualité, sa substance, sa quantité ou sa direction {cite:canon-ibn-sina-print-v1 p.157}."
  es: "Ibn Sina muestra que lo que se evacua o se retiene apunta de varias maneras: una retención antinatural, o una evacuación antinatural, ya sea de la propia sustancia del órgano, leída por su tipo, cantidad o color, o de algo más, leído por su salida en absoluto, su calidad, su sustancia, su cantidad o su dirección {cite:canon-ibn-sina-print-v1 p.157}."
