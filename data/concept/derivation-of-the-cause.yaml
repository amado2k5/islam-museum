id: concept/derivation-of-the-cause
class: concept
kind: term
label:
  ar: "تخريج المناط"
  en: "Derivation of the cause (takhrij al-manat)"
  ur: "تخریجِ مناط"
  es: "Derivación de la causa (takhrij al-manat)"
  fr: "Dérivation de la cause (takhrij al-manat)"
summary:
  ar: "تخريج المناط هو النظر والاجتهاد في إثبات علة الحكم إذا دل النص أو الإجماع على الحكم دون علته، فيستخرج المجتهد العلة برأيه. وعدّه بعض الأصوليين مسلكا من مسالك العلة، وأنكره أهل الظاهر والشيعة وطائفة من المعتزلة البغداديين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4811}"
  en: "Takhrij al-manat is the effort to establish the cause of a ruling when a text or consensus states the ruling but not its cause, so the jurist draws the cause out by his own judgement. Some usulis count it as one way of establishing the cause; the Zahiris, the Shia and some Baghdadi Mu'tazilis reject it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4811}"
  es: "Takhrij al-manat es el esfuerzo por establecer la causa de un dictamen cuando un texto o consenso lo enuncia pero no su causa, por lo que el jurista deduce la causa mediante su propio juicio. Algunos usulis lo consideran una forma de establecer la causa; los zahiríes, los chiíes y algunos mu'tazilíes de Bagdad lo rechazan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4811}"
  fr: "Le takhrij al-manat consiste à établir la cause d'une décision lorsqu'un texte ou un consensus énonce la décision sans en expliquer la cause, le juriste la déduisant alors par son propre jugement. Certains usulis le considèrent comme un moyen d'établir la cause; les zahirites, les chiites et certains mu'tazilites bagdadiens le rejettent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4811}"
  ur: "تخریج المنات کسی حکم کی وجہ کو قائم کرنے کی کوشش ہے جب کوئی متن یا اجماع حکم بیان کرتا ہے لیکن اس کی وجہ نہیں، اس لیے فقیہ اپنے فیصلے سے وجہ نکالتا ہے۔ بعض علماء اسے سبب قائم کرنے کا ایک طریقہ شمار کرتے ہیں۔ ظاہری، شیعہ اور بعض بغدادی معتزلی اس کو رد کرتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص4811}"
