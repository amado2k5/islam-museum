  en: "Derivation of the cause (takhrij al-manat)"
  ur: "تخریجِ مناط"
summary:
  ar: "تخريج المناط هو النظر والاجتهاد في إثبات علة الحكم إذا دل النص أو الإجماع على الحكم دون علته، فيستخرج المجتهد العلة برأيه. وعدّه بعض الأصوليين مسلكا من مسالك العلة، وأنكره أهل الظاهر والشيعة وطائفة من المعتزلة البغداديين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4811}"
  en: "Takhrij al-manat is the effort to establish the cause of a ruling when a text or consensus states the ruling but not its cause, so the jurist draws the cause out by his own judgement. Some usulis count it as one way of establishing the cause; the Zahiris, the Shia and some Baghdadi Mu'tazilis reject it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4811}"
