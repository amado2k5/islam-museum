label: { ar: "المياه الراكدة وأمراض شاربيها عند ابن سينا", en: "Standing water and the illnesses of those who drink it in the Canon", ur: "قانون میں ٹھہرے ہوئے پانی اور اس کے پینے والوں کے امراض", es: "El agua estancada y las enfermedades de quienes la beben en el Canon", fr: "L'eau stagnante et les maladies de ceux qui la boivent dans le Canon", tr: "İbn Sina'ya göre durgun su ve içenlerin hastalıkları", id: "Air tergenang dan penyakit para peminumnya menurut Ibn Sina" }
summary:
  ar: "يذكر ابن سينا أن المياه الجليدية والثلجية غليظة، وأن المياه الراكدة الآجمة، خصوصاً المكشوفة، رديئة ثقيلة، تبرد في الشتاء بسبب الثلوج وتولد البلغم، وتسخن في الصيف بسبب الشمس والعفونة فتولد المرارة {cite:canon-ibn-sina-print-v1 p.137}."
  en: "Ibn Sina says glacier and snow waters are coarse, and standing waters of thickets and marshes, especially open ones, are bad and heavy. They turn cold in winter because of the snows and breed phlegm, and turn warm in summer because of the sun and putrefaction and breed bitterness {cite:canon-ibn-sina-print-v1 p.137}."
  es: "Ibn Sina afirma que las aguas glaciares y de nieve son ásperas, y que las aguas estancadas de matorrales y marismas, especialmente las abiertas, son malas y pesadas. Se enfrían en invierno debido a la nieve y generan flema, y se calientan en verano debido al sol y la putrefacción, generando amargor {cite:canon-ibn-sina-print-v1 p.137}."
  fr: "Ibn Sina affirme que les eaux glaciaires et les eaux de fonte des neiges sont grossières, et que les eaux stagnantes des fourrés et des marais, surtout à découvert, sont mauvaises et lourdes. Elles deviennent froides en hiver à cause de la neige et favorisent la formation de mucosités, et chaudes en été à cause du soleil et de la putréfaction, engendrant ainsi de l'amertume {cite:canon-ibn-sina-print-v1 p.137}."
  ur: "ابن سینا کا کہنا ہے کہ گلیشیئر اور برف کے پانی موٹے ہیں، اور جھاڑیوں اور دلدلوں کے کھڑے پانی، خاص طور پر کھلے پانی، خراب اور بھاری ہیں۔ وہ سردیوں میں برف باری اور بلغم کی افزائش کی وجہ سے سرد ہو جاتے ہیں، اور گرمیوں میں دھوپ کی وجہ سے گرم ہو جاتے ہیں اور کڑواہٹ پیدا ہو جاتی ہے۔"
  tr: "İbn Sina, buzul ve buzlu suların kalın olduğunu, durgun ve kalın suyun, özellikle açıkta kalan suyun fakir ve ağır olduğunu, kışın kar nedeniyle soğuduğunu ve balgam oluşturduğunu, yazın ise güneş ve pislik nedeniyle ısınarak safra kesesi oluşturduğunu belirtir {cite:canon-ibn-sina-print-v1 s.137}."
  id: "Ibn Sina menyebutkan bahwa air glasial dan es itu tebal, dan air yang tergenang dan tebal, terutama air yang terbuka, miskin dan berat, mendingin di musim dingin karena salju dan menghasilkan lendir, serta memanas di musim panas karena sinar matahari dan kotoran, menghasilkan kantong empedu {cite:canon-ibn-sina-print-v1 hlm.137}."
