label: { ar: "المياه الراكدة وأمراض شاربيها عند ابن سينا", en: "Standing water and the illnesses of those who drink it in the Canon", ur: "قانون میں ٹھہرے ہوئے پانی اور اس کے پینے والوں کے امراض" }
summary:
  ar: "يذكر ابن سينا أن المياه الجليدية والثلجية غليظة، وأن المياه الراكدة الآجمة، خصوصاً المكشوفة، رديئة ثقيلة، تبرد في الشتاء بسبب الثلوج وتولد البلغم، وتسخن في الصيف بسبب الشمس والعفونة فتولد المرارة {cite:canon-ibn-sina-print-v1 p.137}."
  en: "Ibn Sina says glacier and snow waters are coarse, and standing waters of thickets and marshes, especially open ones, are bad and heavy. They turn cold in winter because of the snows and breed phlegm, and turn warm in summer because of the sun and putrefaction and breed bitterness {cite:canon-ibn-sina-print-v1 p.137}."
