label:
  ar: "الأزمة المالية العالمية 2008"
  en: "The global financial crisis of 2008 (an Islamic economic reading)"
  es: "La crisis financiera mundial de 2008 (una lectura económica islámica)"
  fr: "La crise financière mondiale de 2008 (une lecture économique islamique)"
  ur: "2008 کا عالمی مالیاتی بحران ⁦(ایک اسلامی معاشی مطالعہ)⁩"
  tr: "2008 Küresel Finansal Krizi"
  id: "Krisis Keuangan Global 2008"
summary:
  ar: "يعرض المؤلف الأزمة المالية العالمية 2008 بوصفها بدأت في سوق القروض العقارية الأمريكية {cite:usul-iqtisad-islami-0660 p. 350}، ويعزوها من منظور إسلامي إلى عشرة أسباب: الربا، والقمار، والمشتقات، والتوريق، وبيع الديون، وخلق النقود، والرقابة على المصارف، والفساد الإداري، والمغالاة في المصالح الخاصة، وسكوت رجال العلم والإعلام {cite:usul-iqtisad-islami-0660 p. 350} {cite:usul-iqtisad-islami-0660 p. 358}."
  tr: "Yazar, 2008 küresel finansal krizini Amerikan ipotek piyasasında başlamış olarak sunuyor {cite:usul-iqtisad-islami-0660 s. 350} ve İslami bakış açısından on nedene bağlıyor: tefecilik, kumar, türevler, menkul kıymetleştirme, borç satışı, para yaratımı, banka denetimi, idari yolsuzluk, aşırı çıkarcılık ve akademisyenler ile medya figürlerinin sessizliği {cite:usul-iqtisad-islami-0660 s. 350} {cite:usul-iqtisad-islami-0660 s. 358}."
  id: "Penulis menyajikan krisis keuangan global 2008 sebagai yang dimulai di pasar hipotek Amerika {cite:usul-iqtisad-islami-0660 hlm. 350}, mengaitkannya dari perspektif Islam pada sepuluh penyebab: riba, perjudian, derivatif, sekuritisasi, penjualan utang, penciptaan uang, pengawasan perbankan, korupsi administratif, kepentingan pribadi yang berlebihan, dan keheningan para sarjana serta tokoh media {cite:usul-iqtisad-islami-0660 hlm. 350} {cite:usul-iqtisad-islami-0660 hlm. 358}."
