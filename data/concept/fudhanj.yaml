  en: "Fudhanj (the mint family)"
  ur: "فوذنج"
  es: "Fudhanj (la familia de la menta)"
summary:
  ar: "الفوذنج في الكتاب نهري وجبلي وصنف يسمى غليجن وصنف يسمى فوذنج التيس، حريف لطيف الجوهر، يلطف تلطيفا قويا ويسخن ويجذب من عمق البدن ويقطع ويجفف، والجبلي أقوى من النهري، وينفع من الشقاق والحكة والجرب وضيق النفس واليرقان وقلة الشهوة ونهش الهوام، ويذكر الكتاب فيه أفعالا في الجنين والطمث والباه {cite:canon-ibn-sina-print-v1 pp.630-631}"
  en: "Fudhanj is in the book river, mountain, a kind called ghulayjan and a kind called the he-goat's fudhanj; pungent and fine in substance, it attenuates strongly, warms, draws from the depth of the body, cuts and dries, the mountain being stronger than the river; it benefits itch, scab, tightness of breath, jaundice, poor appetite and the bites of vermin, and the book lists in it actions on the foetus, the menses and desire {cite:canon-ibn-sina-print-v1 pp.630-631}"
  ur: "فوذنج کتاب میں دریائی، پہاڑی، غلیجن نامی ایک قسم اور بکرے کا فوذنج نامی ایک قسم ہے؛ چرپرا اور لطیف جوہر والا، سختی سے لطیف بناتا، گرمی دیتا، بدن کی گہرائی سے کھینچتا، قطع کرتا اور خشک کرتا ہے، پہاڑی دریائی سے زیادہ قوی ہے؛ خارش، جرب، سانس کی تنگی، یرقان، بھوک کی کمی اور زہریلے جانوروں کے ڈنک میں نافع ہے، اور کتاب اس میں جنین، حیض اور باہ پر اثرات بھی بتاتی ہے {cite:canon-ibn-sina-print-v1 pp.630-631}۔"
  es: "En el libro, el fudhanj es de río, de montaña, un tipo llamado ghulayjan y otro llamado fudhanj de cabra; picante y de sustancia fina, atenúa fuertemente, calienta, extrae de lo profundo del cuerpo, corta y seca, siendo el de montaña más fuerte que el de río; beneficia la picazón, la costra, la dificultad para respirar, la ictericia, la falta de apetito y las picaduras de parásitos, y el libro enumera en él acciones sobre el feto, la menstruación y el deseo {cite:canon-ibn-sina-print-v1 pp.630-631}"
