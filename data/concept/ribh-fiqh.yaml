id: concept/ribh-fiqh
class: concept
kind: legal
tags: [islamic-economy-browser, islamic-economy-money]
label:
  ar: "الربح"
  en: "Profit (ribh): lawful and unlawful gain, profit from another's property, profit-sharing in partnership and investment, and zakat on trade profit"
  ur: "نفع ⁦(ربح)⁩"
  es: "Ganancia (ribh): ganancia lícita e ilícita, ganancia derivada de la propiedad ajena, participación en las ganancias de sociedades e inversiones, y zakat sobre las ganancias comerciales."
  fr: "Bénéfice (ribh): gains licites et illicites, profit tiré de la propriété d’autrui, partage des bénéfices dans le cadre d’une société en nom collectif ou d’un investissement, et zakat sur les bénéfices commerciaux."
  tr: "Kâr"
  id: "Keuntungan"
summary:
  ar: "الربح في اللغة النماء في التجارة، ومن ألفاظه النماء والغلة، والنماء أعم من الربح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8607} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8608} والربح المشروع ما نتج عن تصرف مباح كالبيع والمضاربة والشركة، وهو حلال بالإجماع، والربح غير المشروع ما نتج عن تصرف محرم كالربا والقمار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8608} وفي ربح ما تصرف فيه الإنسان من مال غيره اختلف الفقهاء: فالحنفية يرون أنه لا يطيب للمتصرف، وقال المالكية والشافعية في الأظهر إنه للمتصرف، وقال الحنابلة إنه للمالك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8608} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8609} وأجمع الفقهاء على أن تحديد نسبة الربح بين المالك والعامل ركن في المضاربة، ويجوز أن تكون بأي نسبة يتفقان عليها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8609} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8610} ويضم الربح الحاصل من عروض التجارة في أثناء الحول إلى الأصل عند المالكية والشافعية في الأظهر والحنابلة، ويبني أبو حنيفة حول كل مستفاد على حول جنسه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8610} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8611}"
  en: "Ribh is gain in trade; its relatives are growth (nama') and income (ghalla), and growth is the wider term. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8607} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8608} Lawful profit comes from a lawful contract such as sale, mudaraba or partnership, and is lawful by consensus; unlawful profit comes from a forbidden transaction, such as riba or gambling. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8608} On profit made from another's property in one's hand, the Hanafis hold it not lawful to the user, the Malikis and the preferred Shafi'i view give it to the user, and the Hanbalis give it to the owner. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8608} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8609} All agree that the share of profit between owner and worker must be fixed in a mudaraba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8609} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8610} In partnership the profit follows the agreed shares, and the schools differ on whether unequal capital may bring equal shares. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8610} Profit on trade goods is added to the principal for zakat by the Malikis, the preferred Shafi'i view and the Hanbalis, while Abu Hanifa has each new gain run its own year. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8610} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8611}"
  ur: "ربح لغت میں تجارت میں افزائش ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8607} جائز تصرفات سے حاصل نفع حلال ہے، اور سود یا جوئے سے حاصل نفع حرام۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8608}"
  es: "Ribh es ganancia en el comercio; sus parientes son crecimiento (nama') e ingreso (ghalla), y crecimiento es el término más amplio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8607} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8608} La ganancia lícita proviene de un contrato lícito como la venta, mudaraba o sociedad, y es lícita por consenso; la ganancia ilícita proviene de una transacción prohibida, como riba o juego. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8608} Sobre la ganancia obtenida de la propiedad de otro en posesión de uno, los Hanafis sostienen que no es lícita para el usuario, los Malikis y la opinión preferida de Shafi'i se la otorgan al usuario, y los Hanbalis se la otorgan al propietario. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8608} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8609} Todos coinciden en que la participación en las ganancias entre el propietario y el trabajador debe fijarse en una mudaraba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8609} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8610} En una sociedad, las ganancias siguen las participaciones acordadas, y las escuelas difieren en si un capital desigual puede generar participaciones iguales. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8610} Las ganancias sobre bienes comerciales se suman al capital para el zakat según los malikíes, la opinión preferida de los shafi'íes y los hanbalíes, mientras que Abu Hanifa considera que cada nueva ganancia se gestiona en su propio año. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8610} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8611}"
  fr: "Ribh désigne le gain réalisé dans le commerce; ses termes apparentés sont croissance (nama') et revenu (ghalla), la croissance étant le terme le plus général. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8607} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8608} Le profit licite provient d'un contrat licite tel qu'une vente, une mudaraba ou un partenariat, et est reconnu licite par consensus; le profit illicite provient d'une transaction interdite, telle que le riba ou les jeux de hasard. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8608} Concernant le profit tiré du bien d'autrui détenu par soi-même, les hanafites le considèrent comme illicite pour celui qui l'utilise, les malikites et l'avis majoritaire des shafi'ites l'accordent à celui-ci, et les hanbalites l'accordent au propriétaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8608} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8609} Tous s'accordent à dire que la répartition des bénéfices entre propriétaire et travailleur doit être fixée par une mudaraba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8609} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8610} En cas de partenariat, les bénéfices sont répartis selon les parts convenues, et les écoles divergent quant à la possibilité pour des capitaux inégaux d'engendrer des parts égales. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8610} Les bénéfices réalisés sur les marchandises échangées sont ajoutés au capital pour la zakat par les Malikites, l'avis privilégié des Shafi'ites et les Hanbalites, tandis qu'Abu Hanifa considère que chaque nouveau gain fait l'objet d'une année distincte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8610} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8611}"
  tr: "Dilde kâr ticarette büyüme anlamına gelir ve terimleri büyüme ile getiri içerir; büyüme ise kârdan daha geniştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8607} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8608} Yasal kâr, satış, spekülasyon ve ortaklık gibi izin verilen işlemlerden kaynaklanan kârdır ve oybirliğiyle helaldır. Yasadışı kâr, tefecilik ve kumar gibi yasak işlemlerden kaynaklanan kârdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8608} Bir kişinin başkasının servetinden kullandığı kâr konusunda hukukçular farklı görüştedir: Hanafiler, bunun yöneten kişi için hoş olmadığını savunurken, Malikiler ve Şafiiler en açık görüşle sahibine ait olduğunu savunur. Hanbaliler ise kârın sahibine ait olduğunu söyler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8608} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8609} Hukukçular, mal sahibi ile işçi arasındaki kâr oranının belirlenmesinin spekülasyonun bir dayanağı olduğunu ve her zaman anlaşılan bir oranda yapılabileceğini oybirliğiyle kabul ederler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8609} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8610}, Maliki ve Şafii okullarına göre Azhar ve Hanbali okullarındaki ticaret tekliflerinin aslına transfer sırasında elde edilen kârı içerir ve Abu Hanifa her birini kendi türündeki okul etrafında inşa eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8610} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8611}"
  id: "Dalam bahasa, keuntungan berarti pertumbuhan dalam perdagangan, dan istilahnya mencakup pertumbuhan dan hasil, dan pertumbuhan lebih luas daripada keuntungan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8607} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8608} Keuntungan yang sah adalah yang dihasilkan dari transaksi yang diperbolehkan seperti penjualan, spekulasi, dan kemitraan, dan secara bulat halal. Keuntungan yang tidak sah adalah yang berasal dari transaksi terlarang, seperti riba dan perjudian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8608} Mengenai keuntungan dari apa yang digunakan seseorang dari kekayaan orang lain, para ahli hukum berbeda: Hanafi berpendapat bahwa itu tidak menyenangkan bagi yang mengelola, dan Maliki serta Shafi'i mengatakan secara paling jelas bahwa keuntungan itu milik pemilik. Hanbal mengatakan itu milik pemilik. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8608} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8609} Para ahli hukum sepakat bahwa menentukan rasio keuntungan antara pemilik dan pekerja adalah pilar spekulasi dan dapat dilakukan dengan tingkat yang disepakati. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8609} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.8610} mencakup keuntungan yang diperoleh dari penawaran perdagangan selama transfer ke asli menurut mazhab Maliki dan Shafi'i di mazhab Azhar dan Hanbali, dan Abu Hanifa membangun masing-masing berdasarkan yang sama dengan yang sejenis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8610} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8611}"
