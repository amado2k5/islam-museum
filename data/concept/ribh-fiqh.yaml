id: concept/ribh-fiqh
class: concept
kind: legal
label:
  ar: "الربح"
  en: "Profit (ribh): lawful and unlawful gain, profit from another's property, profit-sharing in partnership and investment, and zakat on trade profit"
  ur: "نفع (ربح)"
summary:
  ar: "الربح في اللغة النماء في التجارة، ومن ألفاظه النماء والغلة، والنماء أعم من الربح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8607} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8608} والربح المشروع ما نتج عن تصرف مباح كالبيع والمضاربة والشركة، وهو حلال بالإجماع، والربح غير المشروع ما نتج عن تصرف محرم كالربا والقمار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8608} وفي ربح ما تصرف فيه الإنسان من مال غيره اختلف الفقهاء: فالحنفية يرون أنه لا يطيب للمتصرف، وقال المالكية والشافعية في الأظهر إنه للمتصرف، وقال الحنابلة إنه للمالك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8608} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8609} وأجمع الفقهاء على أن تحديد نسبة الربح بين المالك والعامل ركن في المضاربة، ويجوز أن تكون بأي نسبة يتفقان عليها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8609} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8610} ويضم الربح الحاصل من عروض التجارة في أثناء الحول إلى الأصل عند المالكية والشافعية في الأظهر والحنابلة، ويبني أبو حنيفة حول كل مستفاد على حول جنسه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8610} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8611}"
  en: "Ribh is gain in trade; its relatives are growth (nama') and income (ghalla), and growth is the wider term. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8607} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8608} Lawful profit comes from a lawful contract such as sale, mudaraba or partnership, and is lawful by consensus; unlawful profit comes from a forbidden transaction, such as riba or gambling. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8608} On profit made from another's property in one's hand, the Hanafis hold it not lawful to the user, the Malikis and the preferred Shafi'i view give it to the user, and the Hanbalis give it to the owner. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8608} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8609} All agree that the share of profit between owner and worker must be fixed in a mudaraba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8609} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8610} In partnership the profit follows the agreed shares, and the schools differ on whether unequal capital may bring equal shares. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8610} Profit on trade goods is added to the principal for zakat by the Malikis, the preferred Shafi'i view and the Hanbalis, while Abu Hanifa has each new gain run its own year. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8610} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8611}"
  ur: "ربح لغت میں تجارت میں افزائش ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8607} جائز تصرفات سے حاصل نفع حلال ہے، اور سود یا جوئے سے حاصل نفع حرام۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8608}"
