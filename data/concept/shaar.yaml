label:
  ar: "شعر"
  en: "Sha'r (entry on hair)"
  ur: "شعر"
  es: "Sha'r (entrada sobre el cabello)"
  fr: "Sha'r (entrée sur les cheveux)"
  tr: "Şiir"
  id: "Puisi"
summary:
  ar: "شعر في الكتاب الشعر المحرق مسخن مجفف بقوة جدا، يجلو الأسنان وماؤه ينبت الشعر، ويجفف القروح الوسخة والرهلة بقوة، ويذكر الكتاب شعر الإنسان بالخل ضمادا لعضة الكلب الكلب، وهذا نقل منسوب إلى الكتاب لا توصية {cite:canon-ibn-sina-print-v1 p.683}"
  en: "Sha'r is in the book hair: burnt hair is heating and drying very strongly, cleanses the teeth, its water grows hair, and it dries dirty and flabby ulcers strongly; the book mentions human hair with vinegar as a poultice for the bite of a rabid dog, a report attributed to the book, not a recommendation {cite:canon-ibn-sina-print-v1 p.683}"
  ur: "شعر کتاب میں بال ہے: جلا ہوا بال گرم اور بہت شدت سے خشک کرنے والا ہے، دانتوں کو صاف کرتا ہے، اس کا پانی بال اگاتا ہے، اور گندے اور پھولے ہوئے قرحوں کو شدت سے خشک کرتا ہے؛ کتاب پاگل کتے کے کاٹنے پر سرکے کے ساتھ انسانی بال کا لیپ ذکر کرتی ہے، جو کتاب سے منسوب نقل ہے، سفارش نہیں {cite:canon-ibn-sina-print-v1 p.683}۔"
  es: "Sha'r aparece en el libro: el cabello quemado calienta y seca muy bien, limpia los dientes, su agua hace crecer el cabello y seca eficazmente las úlceras sucias y flácidas; el libro menciona cabello humano con vinagre como cataplasma para la mordedura de un perro rabioso, un relato atribuido al libro, no una recomendación {cite:canon-ibn-sina-print-v1 p.683}"
  fr: "Le Sha'r est mentionné dans le livre des cheveux: les cheveux brûlés chauffent et dessèchent très fortement, nettoient les dents, leur eau favorise la pousse des cheveux et assèche efficacement les ulcères sales et flasques; le livre mentionne également l'utilisation de cheveux humains mélangés à du vinaigre comme cataplasme contre la morsure d'un chien enragé, une information qui lui est attribuée, et non une recommandation {cite:canon-ibn-sina-print-v1 p.683}"
  tr: "Kitapta yanmış saçlar var, çok güçlü şekilde ısıtılmış ve kurutulmuş; dişleri temizliyor, suyu saçların büyümesine neden oluyor ve kirli yaralar ile döküntüleri güçlü şekilde kurutuyordu. Kitap, köpek ısırıklarına karşı sirke ile insan saçından bahseder ve bu bir öneri değil, kitaba atfedilen bir aktarımdır {cite:canon-ibn-sina-print-v1 s.683}"
  id: "Buku ini mengandung rambut yang terbakar, dipanaskan, dan dikeringkan dengan sangat kuat; ia membersihkan gigi dan airnya menyebabkan rambut tumbuh serta mengeringkan luka kotor dan ruam dengan kuat. Buku ini menyebutkan rambut manusia dengan cuka sebagai obat untuk gigitan anjing, dan ini adalah transmisi yang dikaitkan dengan buku, bukan rekomendasi {cite:canon-ibn-sina-print-v1 hlm.683}"
