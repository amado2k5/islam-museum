id: concept/zij-sabi-cause-of-the-lunar-eclipse
class: concept
kind: scientific
label: { ar: "علة الكسوف القمري", en: "The cause of the lunar eclipse", ur: "قمری کسوف کی علت", es: "La causa del eclipse lunar", fr: "La cause de l'éclipse lunaire", tr: "Ay tutulmasının nedeni", id: "Penyebab gerhana bulan" }
summary:
  ar: "الكسوف القمري يقع لأن ظل الأرض المخروطي يمتد في الهواء إلى ما وراء فلك عطارد، فإذا كان القمر في إحدى عقدتي فلكه وقت المقابلة وقع فيه وانكسف ضوؤه. {cite:zij-sabi-nallino-byblion p.83}."
  en: "A lunar eclipse happens because the Earth's conical shadow stretches through the air beyond the sphere of Mercury. When the Moon is at one of the nodes of its sphere at opposition, it enters that shadow and its light is dimmed. {cite:zij-sabi-nallino-byblion p.83}."
  ur: "قمری کسوف اس لیے ہوتا ہے کہ زمین کا مخروطی سایہ ہوا میں عطارد کے فلک سے آگے تک پھیلتا ہے۔ جب مقابلے کے وقت چاند اپنے فلک کی کسی عقدہ پر ہو تو وہ اس سائے میں داخل ہوتا ہے اور اس کی روشنی مدھم ہو جاتی ہے۔ {cite:zij-sabi-nallino-byblion p.83}۔"
  es: "Un eclipse lunar se produce porque la sombra cónica de la Tierra se extiende por el aire más allá de la esfera de Mercurio. Cuando la Luna se encuentra en uno de los nodos de su esfera en oposición, entra en esa sombra y su luz disminuye. {cite:zij-sabi-nallino-byblion p.83}."
  fr: "Une éclipse lunaire se produit car l'ombre conique de la Terre s'étend dans l'air au-delà de la sphère de Mercure. Lorsque la Lune se trouve à l'un des nœuds de sa sphère, en opposition, elle pénètre dans cette ombre et sa lumière est atténuée. {cite:zij-sabi-nallino-byblion p.83}."
  tr: "Ay tutulması, Dünya'nın konik gölgesinin Merkür'ün yörüngesinin ötesine, havada uzanması nedeniyle meydana gelir. Eğer ay, karşı konumdayken düğüm noktalarından birinde bulunuyorsa, bu gölgeye girer ve ışığı tutulur. {cite:zij-sabi-nallino-byblion s.83}."
  id: "Gerhana bulan terjadi karena bayangan kerucut Bumi meluas di udara melampaui orbit Merkurius. Jika bulan berada di salah satu simpulnya pada saat oposisi, maka bulan akan jatuh ke dalam bayangan ini dan cahayanya akan tertutupi. {cite:zij-sabi-nallino-byblion p.83}."
