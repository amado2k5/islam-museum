id: concept/zij-sabi-cause-of-the-lunar-eclipse
class: concept
kind: scientific
label: { ar: "علة الكسوف القمري", en: "The cause of the lunar eclipse", ur: "قمری کسوف کی علت", es: "La causa del eclipse lunar" }
summary:
  ar: "الكسوف القمري يقع لأن ظل الأرض المخروطي يمتد في الهواء إلى ما وراء فلك عطارد، فإذا كان القمر في إحدى عقدتي فلكه وقت المقابلة وقع فيه وانكسف ضوؤه. {cite:zij-sabi-nallino-byblion p.83}."
  en: "A lunar eclipse happens because the Earth's conical shadow stretches through the air beyond the sphere of Mercury. When the Moon is at one of the nodes of its sphere at opposition, it enters that shadow and its light is dimmed. {cite:zij-sabi-nallino-byblion p.83}."
  ur: "قمری کسوف اس لیے ہوتا ہے کہ زمین کا مخروطی سایہ ہوا میں عطارد کے فلک سے آگے تک پھیلتا ہے۔ جب مقابلے کے وقت چاند اپنے فلک کی کسی عقدہ پر ہو تو وہ اس سائے میں داخل ہوتا ہے اور اس کی روشنی مدھم ہو جاتی ہے۔ {cite:zij-sabi-nallino-byblion p.83}۔"
  es: "Un eclipse lunar se produce porque la sombra cónica de la Tierra se extiende por el aire más allá de la esfera de Mercurio. Cuando la Luna se encuentra en uno de los nodos de su esfera en oposición, entra en esa sombra y su luz disminuye. {cite:zij-sabi-nallino-byblion p.83}."
