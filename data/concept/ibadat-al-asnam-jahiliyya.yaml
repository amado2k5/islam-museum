label: { ar: "عبادة الأصنام في الجاهلية ومراسمها", en: "Idol worship in the Jahiliyya and its rites" }
summary:
  ar: "مراسم عبادة الأصنام عند أهل الجاهلية كما يعدّها الرحيق المختوم: العكوف عليها والاستغاثة بها اعتقاداً أنها تشفع عند الله، والحج إليها والطواف بها والسجود لها، والذبح لها وبأسمائها، وتخصيص نصيب من المآكل والحرث والأنعام لها، والنذر، والبحيرة والسائبة والوصيلة والحامي؛ ابتدع أكثرها عمرو بن لحي وظنوها بدعة حسنة لا تغييراً لدين إبراهيم، وأنكرها القرآن في آيات الأنعام والمائدة والزمر ويونس."
  en: "The rites of idol worship among the Arabs of the Jahiliyya as al-Raheeq al-Makhtum lists them: devotion and appeal to the idols as intercessors with God, pilgrimage, circumambulation and prostration to them, slaughter for them and in their names, a share of food, crops and cattle set aside for them, vows, and the consecrated animals; most were introduced by Amr ibn Luhayy and thought a good innovation rather than a change of Ibrahim's religion, and the Qur'an rejects them in al-An'am, al-Ma'ida, al-Zumar and Yunus."
