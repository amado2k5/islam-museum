id: concept/ibadat-al-asnam-jahiliyya
class: concept
kind: belief
label: { ar: "عبادة الأصنام في الجاهلية ومراسمها", en: "Idol worship in the Jahiliyya and its rites", es: "La adoración de ídolos en la época preislámica (Jahiliyya) y sus ritos.", fr: "Le culte des idoles à l'époque préislamique et ses rites", ur: "جاہلیت میں بت پرستی اور اس کے عبادات" }
summary:
  ar: "مراسم عبادة الأصنام عند أهل الجاهلية كما يعدّها الرحيق المختوم: العكوف عليها والاستغاثة بها اعتقاداً أنها تشفع عند الله، والحج إليها والطواف بها والسجود لها، والذبح لها وبأسمائها، وتخصيص نصيب من المآكل والحرث والأنعام لها، والنذر، والبحيرة والسائبة والوصيلة والحامي؛ ابتدع أكثرها عمرو بن لحي وظنوها بدعة حسنة لا تغييراً لدين إبراهيم، وأنكرها القرآن في آيات الأنعام والمائدة والزمر ويونس."
  en: "The rites of idol worship among the Arabs of the Jahiliyya as al-Raheeq al-Makhtum lists them: devotion and appeal to the idols as intercessors with God, pilgrimage, circumambulation and prostration to them, slaughter for them and in their names, a share of food, crops and cattle set aside for them, vows, and the consecrated animals; most were introduced by Amr ibn Luhayy and thought a good innovation rather than a change of Ibrahim's religion, and the Qur'an rejects them in al-An'am, al-Ma'ida, al-Zumar and Yunus."
  es: "Los ritos de adoración de ídolos entre los árabes de la época preislámica, tal como los enumera al-Raheeq al-Makhtum: devoción e invocación a los ídolos como intercesores ante Dios, peregrinación, circunvalación y postración ante ellos, sacrificio de animales en su nombre y para ellos, una parte de la comida, las cosechas y el ganado reservados para ellos, votos y animales consagrados; la mayoría fueron introducidos por Amr ibn Luhayy y se consideraron una buena innovación más que un cambio de la religión de Ibrahim, y el Corán los rechaza en al-An'am, al-Ma'ida, al-Zumar y Yunus."
  fr: "Les rites du culte des idoles chez les Arabes de la Jahiliyya, tels que décrits dans al-Raheeq al-Makhtum, comprennent: la dévotion et l'invocation des idoles comme intercesseurs auprès de Dieu, le pèlerinage, la circumambulation et la prosternation devant elles, le sacrifice d'animaux pour elles et en leur nom, une part de nourriture, de récoltes et de bétail qui leur est réservée, les vœux et les animaux consacrés; la plupart de ces rites furent introduits par Amr ibn Luhayy, considéré comme une bonne innovation plutôt que comme un changement de la religion d'Ibrahim, et le Coran les rejette dans al-An'am, al-Ma'ida, al-Zumar et Yunus."
  ur: "جاہلیت کے عربوں میں بتوں کی پوجا کی جو رسومات الرحیق المختم ہیں ان کی فہرست درج ذیل ہے: بتوں کی عبادت اور خدا کے ہاں سفارشی بن کر ان کی عبادت، زیارت، طواف اور ان کے لیے سجدہ، ان کے لیے ذبح کرنا اور ان کے ناموں پر، کھانے کا حصہ، فصلوں اور مویشیوں کے لیے مقرر کردہ سامان؛ زیادہ تر کا تعارف عمرو بن لحیی نے کیا تھا اور انہوں نے ابراہیم کے مذہب کی تبدیلی کے بجائے ایک اچھی بدعت سمجھی تھی، اور قرآن نے الانعام، المائدہ، الزمر اور یونس میں ان کو رد کیا ہے۔"
