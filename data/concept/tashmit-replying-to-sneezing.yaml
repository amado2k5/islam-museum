label:
  ar: "التشميت"
  en: "Tashmit (replying to a sneezer)"
  ur: "تشمیت ⁦(چھینک والے کا جواب دینا)⁩"
  es: "Tashmit (respondiendo a alguien que estornuda)"
  fr: "Tashmit (répondant à quelqu'un qui éternue)"
  tr: "böbürlenen"
  id: "membanggakan diri"
summary:
  ar: "التشميت الدعاء للعاطس بالخير والبركة بعد أن يحمد الله. اتفق العلماء على أن العاطس يحمد الله عقب عطاسه، ويُشمَّت إن حمد؛ وإن لم يحمد فلا يُشمَّت، ويستحب لمن حضره تذكيره بالحمد. وحكم التشميت عند الشافعية سنة، وعند الحنفية وقول للحنابلة واجب، وعند المالكية وهو المشهور عند الحنابلة فرض كفاية، ونقل النووي أن المختار أنه يُشمِّت من سمعه، وقيل فرض عين. ولا يُشمِّت المصلي غيره في الصلاة لأنه كلام آدمي يفسدها عند الجمهور، ويكره التشميت في الخلاء، وفي الخطبة عند الحنفية والمالكية، ولا يُشمَّت العاطس أكثر من ثلاث مرات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5189} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5190} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5191} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5193} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5195} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5196}"
  en: "Tashmit is praying for a sneezer's good and blessing once he has praised God. All agree that the sneezer praises God and is answered only if he does; the one present should remind a sneezer who forgot. Among the Shafiis it is a sunna; for the Hanafis and one Hanbali view a duty; for the Malikis and the known Hanbali view a communal obligation, with an-Nawawi preferring that each who hears answers, and some saying an individual duty. Within prayer, answering a sneezer breaks it for most jurists, as it is human speech, while praising God silently does not; it is disliked in the lavatory and, for the Hanafis and Malikis, during the sermon; a sneezer is not answered beyond three sneezes unless he has a cold. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5189} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5190} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5191} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5193} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5195} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5196}"
  es: "Tashmit es una oración por el bien y la bendición de quien estornuda después de que haya alabado a Dios. Todos coinciden en que quien estornuda alaba a Dios y solo recibe respuesta si lo hace; quien esté presente debe recordárselo a quien lo haya olvidado. Entre los shafiíes es una sunna; para los hanafíes y un hanbalí, un deber; para los malikíes y los hanbalíes conocidos, una obligación comunitaria, con an-Nawawi prefiriendo que cada uno que oiga responda, y algunos dicen que es un deber individual. Dentro de la oración, responder a quien estornuda la interrumpe para la mayoría de los juristas, ya que es una expresión humana, mientras que alabar a Dios en silencio no lo hace; está mal visto en el baño y, para los hanafíes y malikíes, durante el sermón; no se responde a quien estornuda más allá de tres estornudos a menos que tenga un resfriado. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5189} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5190} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5191} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5193} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5195} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5196}"
  fr: "Tashmit consiste à prier pour le bien et la bénédiction de celui qui éternue après avoir loué Dieu. Tous s'accordent à dire que celui qui éternue loue Dieu et que la prière n'est exaucée que s'il le fait; la personne présente doit le rappeler à celui qui l'aurait oublié. Chez les Chafiites, c'est une sunna; pour les Hanafites et un Hanbalite, c'est un devoir; pour les Malikites et le Hanbalite reconnu, c'est une obligation communautaire, tandis qu'an-Nawawi préfère que chacun reçoive une réponse, et certains y voient un devoir individuel. Pendant la prière, répondre à un éternuement l'interrompt pour la plupart des juristes, car il s'agit de parole humaine, alors que louer Dieu en silence ne l'interrompt pas; c'est déconseillé aux toilettes et, pour les Hanafites et les Malikites, pendant le sermon; on ne répond pas à celui qui éternue plus de trois fois, sauf s'il est enrhumé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5189} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5190} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5191} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5193} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5195} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5196}"
  ur: "تسمیت ایک بار چھینکنے والے کی بھلائی اور برکت کے لیے دعا کر رہا ہے جب اس نے خدا کی تعریف کی۔ سب اس بات پر متفق ہیں کہ چھینکنے والا خدا کی حمد کرتا ہے اور صرف اس صورت میں جواب دیا جاتا ہے جب وہ کرتا ہے۔ موجود شخص کو چھینک والے کو یاد دلانا چاہیے جو بھول گیا تھا۔ شافعیوں میں یہ سنت ہے۔ حنفیہ اور ایک حنبلی کے نزدیک فرض ہے۔ مالکیوں اور معروف حنبلیوں کے نزدیک ایک اجتماعی فرض ہے، ایک نووی اس بات کو ترجیح دیتے ہیں کہ ہر ایک جو جواب سنتا ہے، اور کچھ کہتے ہیں کہ انفرادی فرض ہے۔ نماز کے اندر، چھینک کا جواب دینا اکثر فقہاء کے لیے اسے توڑ دیتا ہے، جیسا کہ یہ انسانی کلام ہے، جب کہ خاموشی سے خدا کی حمد کرنا ایسا نہیں ہے۔ یہ غسل خانہ میں اور احناف اور مالکیوں کے لیے خطبہ کے دوران ناپسندیدہ ہے۔ چھینکنے والے کو تین چھینکوں کے بعد جواب نہیں دیا جاتا جب تک کہ اسے زکام نہ ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5189} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5190} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5191} صفحہ 5193} {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 5195}"
  tr: "Şammit, Allah'ı övdükten sonra iyilik ve bereketle hapşıran kişi için yapılan duadır. Âlimler, hapşıran kişinin hapşırdıktan sonra Allah'ı övdüğünü ve övgü ederse övündüğünü kabul ederler; ama övmezse övünmemelidir. Orada bulunanların ona övgüyle hatırlatması tavsiye edilir. Övünme hükmü Şafii'lere göre sünnettir, Hanefilere göre ve Hanbaliler bunun zorunlu olduğunu söyler. Malikiler arasında, en iyi bilinen olanıdır Hanbalis ise toplu bir yükümlülüktür. El-Newavi, tercih edilen görüşün bunu duyanların üzerinde övünmek olduğunu iletmiştir ve bunun bireysel bir yükümlülük olduğu söylenir. İbadetçi, dua sırasında başkalarının üzerinde övünmemelidir çünkü çoğunluk arasında insan konuşması bunu geçersiz kılar. Hanafi ve Malikilere göre kamusal alanda ve vaazlarda övünmekten hoşlanmaz, hapşıran kişi ise üç defadan fazla övünmemelidir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s. 5189} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5190} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5191} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5193} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5195} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5196}"
  id: "Shammit adalah doa untuk orang yang bersin dengan kebaikan dan berkat setelah memuji Allah. Para ulama sepakat bahwa orang yang bersin memuji Allah setelah bersin dan bermegah jika memuji; tetapi jika tidak memuji, maka tidak boleh membanggakan diri. Disarankan bagi yang hadir untuk mengingatkannya dengan pujian. Aturan tentang membanggakan diri adalah Sunnah menurut Syafi'i, menurut Hanafi, dan Hanbal mengatakan itu wajib. Di antara Maliki, yang terkenal di kalangan Hanbali, itu adalah kewajiban kolektif. Al-Nawawi menyampaikan bahwa pendapat yang lebih disukai adalah membanggakan daripada mereka yang mendengarnya, dan dikatakan itu adalah kewajiban individu. Penyembah tidak boleh membanggakan orang lain saat salat karena itu adalah ucapan manusia yang membatalkannya di kalangan mayoritas. Dia tidak suka bermegah di depan umum dan dalam khotbah menurut Hanafi dan Maliki, dan orang yang bersin tidak boleh bermegah lebih dari tiga kali. {cite:Fiqh-mawsua-Kuwaitiyya-noor-v3 p.5189} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5190} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5191} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5193} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5195} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5196}"
