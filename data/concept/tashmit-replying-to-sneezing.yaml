  en: "Tashmit (replying to a sneezer)"
  ur: "تشمیت (چھینک والے کا جواب دینا)"
summary:
  ar: "التشميت الدعاء للعاطس بالخير والبركة بعد أن يحمد الله. اتفق العلماء على أن العاطس يحمد الله عقب عطاسه، ويُشمَّت إن حمد؛ وإن لم يحمد فلا يُشمَّت، ويستحب لمن حضره تذكيره بالحمد. وحكم التشميت عند الشافعية سنة، وعند الحنفية وقول للحنابلة واجب، وعند المالكية وهو المشهور عند الحنابلة فرض كفاية، ونقل النووي أن المختار أنه يُشمِّت من سمعه، وقيل فرض عين. ولا يُشمِّت المصلي غيره في الصلاة لأنه كلام آدمي يفسدها عند الجمهور، ويكره التشميت في الخلاء، وفي الخطبة عند الحنفية والمالكية، ولا يُشمَّت العاطس أكثر من ثلاث مرات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5189} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5190} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5191} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5193} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5195} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5196}"
  en: "Tashmit is praying for a sneezer's good and blessing once he has praised God. All agree that the sneezer praises God and is answered only if he does; the one present should remind a sneezer who forgot. Among the Shafiis it is a sunna; for the Hanafis and one Hanbali view a duty; for the Malikis and the known Hanbali view a communal obligation, with an-Nawawi preferring that each who hears answers, and some saying an individual duty. Within prayer, answering a sneezer breaks it for most jurists, as it is human speech, while praising God silently does not; it is disliked in the lavatory and, for the Hanafis and Malikis, during the sermon; a sneezer is not answered beyond three sneezes unless he has a cold. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5189} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5190} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5191} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5193} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5195} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5196}"
