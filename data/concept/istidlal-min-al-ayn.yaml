id: concept/istidlal-min-al-ayn
class: concept
kind: scientific
label:
  ar: "الاستدلال على الدماغ من العين"
  en: "Inference about the brain from the eye"
  ur: "آنکھ سے دماغ پر استدلال"
summary:
  ar: "يذكر ابن سينا أن حال العين من عروقها ولونها ودمعها وطرفها وحركتها وجحوظها وغورها يقارب في الدلالة ما يكون في الدماغ نفسه {cite:canon-ibn-sina-print-v2 p.20}"
  en: "Ibn Sina says that the state of the eye, in its vessels, colour, tears, blinking, movement, protrusion and sunkenness, comes very close in indication to what is in the brain itself {cite:canon-ibn-sina-print-v2 p.20}"
  ur: "ابن سینا کہتا ہے کہ آنکھ کی حالت، اس کی رگوں، رنگ، آنسو، پلک جھپکنے، حرکت، ابھار اور دھنساؤ میں، دلالت میں اس کے قریب ہے جو خود دماغ میں ہوتا ہے {cite:canon-ibn-sina-print-v2 p.20}۔"
