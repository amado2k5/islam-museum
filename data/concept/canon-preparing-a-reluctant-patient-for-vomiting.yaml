id: concept/canon-preparing-a-reluctant-patient-for-vomiting
class: concept
kind: scientific
label:
  ar: "تهيئة من لا يحب القيء ولا بد من تقيئته عند ابن سينا"
  en: "Preparing a patient who dislikes vomiting but needs it"
  fr: "Préparer au vomissement un malade réticent selon le Canon"
  ur: "قانون میں قے سے گھبرانے والے مریض کی تیاری"
  es: "Preparar a un paciente que no le gusta vomitar pero lo necesita."
  tr: "Kusmayı sevmeyenlerin hazırlanması, İbn Sina'ya göre kusmak zorunda"
  id: "Mempersiapkan mereka yang tidak suka muntah harus dimuntahkan menurut Avicenna"
summary:
  ar: "يوصي ابن سينا فيمن لا يحب أن يقيأ ولا بد من تقيئته أن يُهيَّأ أولاً ويُعوَّد، وتُليَّن أغذيته وتُدسَّم وتُحلَّى، ويُراح من الرياضة، ثم يُسقى الدسومات والأدهان بشراب ويُطعم قبل القذف غذاء جيداً {cite:canon-ibn-sina-print-v1 p.285}."
  en: "For someone who dislikes vomiting but cannot be spared it, Ibn Sina advises first preparing and accustoming him, softening, enriching and sweetening his food and resting him from exercise, then giving fats and oils with wine and good food before he brings it up {cite:canon-ibn-sina-print-v1 p.285}."
  fr: "Pour qui répugne au vomissement sans pouvoir l’éviter, Ibn Sina décrit préparation et accoutumance, aliments ramollis, gras et doux, repos d’exercice, puis graisses et huiles au vin et bons aliments avant rejet {cite:canon-ibn-sina-print-v1 p.285}."
  es: "Para alguien que no le gusta vomitar pero no puede evitarlo, Ibn Sina aconseja primero prepararlo y acostumbrarlo, ablandando, enriqueciendo y endulzando su comida y dejándolo descansar del ejercicio, luego darle grasas y aceites con vino y buena comida antes de que lo vomite {cite:canon-ibn-sina-print-v1 p.285}."
  ur: "کسی ایسے شخص کے لیے جو قے کو ناپسند کرتا ہے لیکن اس سے بچا نہیں جا سکتا، ابن سینا پہلے اسے تیار کرنے اور اس کی عادت ڈالنے، اس کے کھانے کو نرم کرنے، افزودہ کرنے اور اسے میٹھا کرنے اور ورزش سے آرام دینے کا مشورہ دیتے ہیں، پھر اسے لانے سے پہلے چکنائی اور تیل اور اچھی خوراک کے ساتھ دینے کا مشورہ دیتے ہیں۔"
  tr: "İbn Sina, kusmayı sevmeyenlerin önce hazırlanıp geri dönmesini, besinlerini yumuşatmasını, kilo almalarını, tatlandırılmalarını ve egzersizden kurtulmalarını tavsiye eder. Sonra yağ ve yağlarla sulanmaları ve boşalmadan önce iyice beslenmeleri gerektiğini belirtir {cite:canon-ibn-sina-print-v1 s.285}."
  id: "Ibn Sina menyarankan bahwa mereka yang tidak suka muntah dan harus muntah harus terlebih dahulu mempersiapkan diri dan kembali, melunakkan nutrisi, menjadi gemuk, manis, dan melepaskan diri dari olahraga. Kemudian mereka harus disiram dengan lemak dan minyak dengan minuman dan diberi makan jauh sebelum ejakulasi {cite:canon-ibn-sina-print-v1 hlm.285}."
