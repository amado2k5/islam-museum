id: concept/canon-preparing-a-reluctant-patient-for-vomiting
class: concept
kind: scientific
label: { ar: "تهيئة من لا يحب القيء ولا بد من تقيئته عند ابن سينا", en: "Preparing a patient who dislikes vomiting but needs it", ur: "قانون میں قے سے گھبرانے والے مریض کی تیاری" }
summary:
  ar: "يوصي ابن سينا فيمن لا يحب أن يقيأ ولا بد من تقيئته أن يُهيَّأ أولاً ويُعوَّد، وتُليَّن أغذيته وتُدسَّم وتُحلَّى، ويُراح من الرياضة، ثم يُسقى الدسومات والأدهان بشراب ويُطعم قبل القذف غذاء جيداً {cite:canon-ibn-sina-print-v1 p.285}."
  en: "For someone who dislikes vomiting but cannot be spared it, Ibn Sina advises first preparing and accustoming him, softening, enriching and sweetening his food and resting him from exercise, then giving fats and oils with wine and good food before he brings it up {cite:canon-ibn-sina-print-v1 p.285}."
