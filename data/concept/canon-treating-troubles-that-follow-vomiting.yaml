label: { ar: "تدارك الأحوال التي تعرض للمتقيئ عند ابن سينا", en: "Treating the troubles that follow vomiting in the Canon", ur: "قانون میں قے کے بعد پیش آنے والی تکلیفوں کا علاج", es: "Tratamiento de los problemas que siguen al vómito en el Canon", fr: "Traitement des troubles consécutifs aux vomissements dans le Canon" }
summary:
  ar: "يعالج ابن سينا ما يعرض بعد القيء: اللذع الشديد الباقي في المعدة بالمرقة الدسمة السريعة الهضم وتمريخ الموضع بدهن البنفسج مخلوطاً بدهن الخيري وقليل شمع، والكزاز والسبات وانقطاع الصوت بشد الأطراف وتكميد المعدة بزيت طبخ فيه السذاب {cite:canon-ibn-sina-print-v1 p.288}."
  en: "Ibn Sina treats what follows vomiting: lingering sharp irritation of the stomach with a fatty broth quick to digest and a rub of violet oil mixed with wallflower oil and a little wax; and tetanus, lethargy and loss of voice with binding the limbs and fomenting the stomach with oil in which rue has been boiled {cite:canon-ibn-sina-print-v1 p.288}."
  es: "Ibn Sina trata lo que sigue al vómito: irritación aguda y persistente del estómago con un caldo graso de rápida digestión y un frotamiento de aceite de violeta mezclado con aceite de alhelí y un poco de cera; y el tétanos, letargo y pérdida de la voz con vendar las extremidades y estimular el estómago con aceite en el que se ha hervido ruda {cite:canon-ibn-sina-print-v1 p.288}."
  fr: "Ibn Sina traite ce qui suit les vomissements: une irritation aiguë et persistante de l’estomac avec un bouillon gras facile à digérer et un frottement d’huile de violette mélangée à de l’huile de giroflée et un peu de cire; et le tétanos, la léthargie et la perte de la voix avec l’immobilisation des membres et l’application de foment sur l’estomac avec de l’huile dans laquelle de la rue a été bouillie {cite:canon-ibn-sina-print-v1 p.288}."
