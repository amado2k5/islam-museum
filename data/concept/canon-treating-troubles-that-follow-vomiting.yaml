summary:
  ar: "يعالج ابن سينا ما يعرض بعد القيء: اللذع الشديد الباقي في المعدة بالمرقة الدسمة السريعة الهضم وتمريخ الموضع بدهن البنفسج مخلوطاً بدهن الخيري وقليل شمع، والكزاز والسبات وانقطاع الصوت بشد الأطراف وتكميد المعدة بزيت طبخ فيه السذاب {cite:canon-ibn-sina-print-v1 p.288}."
  en: "Ibn Sina treats what follows vomiting: lingering sharp irritation of the stomach with a fatty broth quick to digest and a rub of violet oil mixed with wallflower oil and a little wax; and tetanus, lethargy and loss of voice with binding the limbs and fomenting the stomach with oil in which rue has been boiled {cite:canon-ibn-sina-print-v1 p.288}."
