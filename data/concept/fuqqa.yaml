summary:
  ar: "الفقاع في الكتاب معروف، أصله المتخذ من خبز الحواري ونعنع وكرفس، نفاخ يولد أخلاطا رديئة رديء الغذاء، يضر بالعصب وحجب الدماغ، والمتخذ من الحواري والكرفس والنعنع جيد الكيموس موافق للمحرورين وللمعدة الحارة، والمتخذ بالشعير يدر البول ويضر بالكلى والمثانة {cite:canon-ibn-sina-print-v1 637}"
  en: "Fuqqa is in the book a known drink, the best being what is made from refined-flour bread with mint and celery; it is windy, engenders bad humours and is bad food, harms the nerve and the membranes of the brain, while the kind made from refined bread, celery and mint has good chyme and suits the hot-tempered and the hot stomach, and the barley kind promotes urine and harms the kidneys and the bladder {cite:canon-ibn-sina-print-v1 637}"
  ur: "فقاع کتاب میں معروف مشروب ہے، سب سے اچھا وہ جو میدے کی روٹی، پودینے اور اجوائن سے بنے؛ ہوا بھرنے والا، ناقص اخلاط پیدا کرنے والا اور بُری غذا ہے، اعصاب اور دماغ کے پردوں کو نقصان دیتا ہے، جبکہ میدے کی روٹی، اجوائن اور پودینے سے بنا ہوا اچھا کیموس دیتا ہے اور گرم مزاج والوں اور گرم معدے کے موافق ہے، اور جو سے بنا پیشاب جاری کرتا اور گردوں اور مثانے کو نقصان دیتا ہے {cite:canon-ibn-sina-print-v1 637}۔"
  es: "En el libro se menciona la fuqqa como una bebida conocida; la mejor es la que se elabora con pan de harina refinada, menta y apio. Es flemática, genera malos humores y es un alimento perjudicial, daña los nervios y las membranas cerebrales, mientras que la elaborada con pan refinada, apio y menta tiene buen quimo y es adecuada para personas de temperamento irascible y estómago sensible, y la elaborada con cebada promueve la micción y daña los riñones y la vejiga. {cite:canon-ibn-sina-print-v1 637}"
  fr: "Le fuqqa est mentionné dans le livre comme une boisson connue, la meilleure étant celle faite de pain à la farine raffinée avec de la menthe et du céleri; elle provoque des flatulences, engendre de mauvaises humeurs et est mauvaise pour la santé, nuisible aux nerfs et aux méninges, tandis que celle faite de pain raffiné, de céleri et de menthe est bénéfique et convient aux personnes colériques et à l'estomac sensible. Quant à celle à base d'orge, elle favorise la diurèse et nuit aux reins et à la vessie. {cite:canon-ibn-sina-print-v1 637}"
