id: "concept/thiql-al-ajfan"
class: "concept"
kind: "scientific"
label:
  ar: "ثقل الأجفان"
  en: "Heaviness of the eyelids"
  ur: "پلکوں کی گرانی"
  es: "Pesadez en los párpados"
  fr: "sensation de lourdeur des paupières"
summary:
  ar: "قد يكون ثقل الأجفان للتهيج وأسبابه وقد يكون لضعف القوة وسقوطها كما في الدق وقد يكون للغلظ والشرناق ونحوه وقد يعرض ثقل واسترخاء في ابتداء نوائب الحميات {cite:canon-ibn-sina-print-v2 p.195}"
  en: "Heaviness of the lids may be from irritation and its causes, or from weakness and fall of the power as in consumption, or from thickness and sharnaq and the like; heaviness and relaxation may also occur at the onset of fever attacks {cite:canon-ibn-sina-print-v2 p.195}"
  ur: "پلکوں کی گرانی تهیج اور اس کے اسباب سے ہو سکتی ہے یا قوت کے ضعف اور گرنے سے جیسا دق میں ہوتا ہے یا گاڑھے پن اور شرناق وغیرہ سے؛ اور بخار کے نوبتوں کی ابتدا میں گرانی اور استرخاء بھی عرض ہو سکتا ہے {cite:canon-ibn-sina-print-v2 p.195}"
  es: "La pesadez de los párpados puede deberse a irritación y sus causas, o a debilidad y disminución de la fuerza como en la tuberculosis, o a engrosamiento y sharnaq y similares; la pesadez y la relajación también pueden ocurrir al inicio de ataques de fiebre {cite:canon-ibn-sina-print-v2 p.195}"
  fr: "La lourdeur des paupières peut être due à une irritation et à ses causes, ou à une faiblesse et une chute de vigueur comme dans la tuberculose, ou encore à une épaisseur et une sharnaq, etc.; une lourdeur et un relâchement peuvent également survenir au début des crises de fièvre {cite:canon-ibn-sina-print-v2 p.195}"
