kind: belief
label:
  ar: يوم البعث
  en: The Day of Resurrection
  ur: یوم بعث
  es: "El día de la resurrección"
  fr: "Le jour de la Résurrection"
  tr: "Kıyamet Günü"
  id: "Hari Kebangkitan"
summary:
  ar: "يوم البعث في القرآن والسنة: اليوم الذي يبعث الله فيه الخلائق من قبورهم للحساب، يذكر أنه من أشراط الساعة، وأن فيه من الفزع ما لا يوصف، وأن الله يبعث من في القبور كما يبعث من في الأرض."
  en: "The Day of Resurrection in Qur'an and Sunnah: the day God raises creation from their graves for reckoning — a sign of the Hour, a day of indescribable terror, when God raises those in the graves as He raises those on the earth."
  ur: "یوم بعث قرآن و سنت میں: وہ دن جب اللہ قبروں سے مخلوق کو اٹھاتا ہے اور حساب کے لیے جمع کرتا ہے — ساعت کی نشانیوں میں سے، ایک ایسا دن جس کا خوف بیان نہیں کیا جا سکتا، جب اللہ قبروں میںمیں سے اٹھاتا ہے جیسے زمین کے لوگوں کو اٹھاتا ہے۔"
  es: "El Día de la Resurrección en el Corán y la Sunnah: el día en que Dios resucita a la creación de sus tumbas para el juicio final, una señal de la Hora, un día de terror indescriptible, cuando Dios resucita a los que están en las tumbas como resucita a los que están en la tierra."
  fr: "Le Jour de la Résurrection dans le Coran et la Sunna: le jour où Dieu ressuscite la création de ses tombes pour le jugement dernier — un signe de l’Heure, un jour d’une terreur indescriptible, où Dieu ressuscite ceux qui sont dans les tombes comme Il ressuscite ceux qui sont sur la terre."
  tr: "Kur'an ve Sünnette Kıyamet Günü: Allah'ın yaratıkları hesap için kabirlerinden dirilteceği gündür. Kıyametin alametlerinden biri olduğu, tarifsiz bir dehşet içerdiği ve Allah'ın kabirdekileri de yeryüzündekiler gibi dirilteceği belirtilmiştir."
  id: "Hari Kiamat dalam Al-Qur'an dan Sunnah: Hari di mana Allah akan membangkitkan makhluk dari kubur mereka untuk perhitungan. Disebutkan bahwa hari itu adalah salah satu tanda-tanda Kiamat, dan bahwa ada kengerian yang tak terlukiskan di dalamnya, dan bahwa Allah akan membangkitkan orang-orang yang berada di dalam kubur sebagaimana Dia membangkitkan orang-orang di bumi."
