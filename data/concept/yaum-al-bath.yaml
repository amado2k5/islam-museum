label:
  ar: يوم البعث
  en: The Day of Resurrection
  ur: یوم بعث
summary:
  ar: "يوم البعث في القرآن والسنة: اليوم الذي يبعث الله فيه الخلائق من قبورهم للحساب، يذكر أنه من أشراط الساعة، وأن فيه من الفزع ما لا يوصف، وأن الله يبعث من في القبور كما يبعث من في الأرض."
  en: "The Day of Resurrection in Qur'an and Sunnah: the day God raises creation from their graves for reckoning — a sign of the Hour, a day of indescribable terror, when God raises those in the graves as He raises those on the earth."
  ur: "یوم بعث قرآن و سنت میں: وہ دن جب اللہ قبروں سے مخلوق کو اٹھاتا ہے اور حساب کے لیے جمع کرتا ہے — ساعت کی نشانیوں میں سے، ایک ایسا دن جس کا خوف بیان نہیں کیا جا سکتا، جب اللہ قبروں میںمیں سے اٹھاتا ہے جیسے زمین کے لوگوں کو اٹھاتا ہے۔"
