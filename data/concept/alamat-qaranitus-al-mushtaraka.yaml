id: concept/alamat-qaranitus-al-mushtaraka
class: concept
kind: scientific
label:
  ar: "العلامات المشتركة لقرانيطس"
  en: "The common signs of qaranitus"
  fr: "Signes communs du qaranitus"
  ur: "قرانیطس کی مشترک علامات"
  es: "Los signos comunes de qaranitus"
  tr: "Korintliler'in yaygın işaretleri"
  id: "Tanda-tanda umum dari orang Korintus"
summary:
  ar: "يعدّد ابن سينا العلامات المشتركة لأصناف قرانيطس الحقيقية من الحمى اللازمة اليابسة والهذيان واختلاط العقل وعبث الأطراف والنوم المضطرب وطباع العليل وأقواله وأبواله ونبضه {cite:canon-ibn-sina-print-v2 p.77} {cite:canon-ibn-sina-print-v2 p.78}"
  en: "Ibn Sina lists the signs common to the true kinds of qaranitus: the continued dry fever, raving, confusion of mind, plucking of the limbs, troubled sleep, and the patient's temper, speech, urine and pulse {cite:canon-ibn-sina-print-v2 p.77} {cite:canon-ibn-sina-print-v2 p.78}"
  fr: "Ibn Sina énumère les signes communs aux formes véritables du qaranitus : fièvre sèche continue, délire, confusion de l’esprit, gestes de pincement des membres, sommeil agité, ainsi que les particularités de l’humeur, de la parole, de l’urine et du pouls du malade. {cite:canon-ibn-sina-print-v2 p.77} {cite:canon-ibn-sina-print-v2 p.78}"
  ur: "ابن سینا قرانیطس کی حقیقی قسموں کی مشترک علامات گنواتا ہے: لازم خشک بخار، ہذیان، عقل کا اختلاط، اطراف کا ٹٹولنا، بے چین نیند، اور مریض کا مزاج، گفتگو، پیشاب اور نبض {cite:canon-ibn-sina-print-v2 p.77} {cite:canon-ibn-sina-print-v2 p.78}۔"
  es: "Ibn Sina enumera los signos comunes a los verdaderos tipos de qaranitus: fiebre seca persistente, delirio, confusión mental, arrancarse las extremidades, sueño intranquilo y el temperamento, habla, orina y pulso del paciente {cite:canon-ibn-sina-print-v2 p.77} {cite:canon-ibn-sina-print-v2 p.78}"
  tr: "İbn Sina, Kur'an'ın gerçek türlerinin yaygın belirtilerini sıralar; bunlar arasında kuru ateş, deliryum, zihin karışıklığı, dağınık uzuvlar, huzursuz uyku, hastanın mizacı, sözleri, idrarı ve nabzı {cite:canon-ibn-sina-print-v2 s.77} {cite:canon-ibn-sina-print-v2 s.78}"
  id: "Ibn Sina mencantumkan tanda-tanda umum dari jenis sejati Al-Qur'an; di antaranya adalah demam kering, delirium, kebingungan, anggota tubuh yang tersebar, tidur gelisah, temperamen pasien, kata-kata, urin, dan denyut nadi {cite:canon-ibn-sina-print-v2 hlm.77} {cite:canon-ibn-sina-print-v2 hlm.78}"
