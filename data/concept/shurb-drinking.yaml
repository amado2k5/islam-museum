id: concept/shurb-drinking
class: concept
kind: legal
label:
  ar: "الشُّرب"
  en: "Shurb (drinking: manners, the one who drinks in prayer and fasting, and vessels of gold and silver)"
summary:
  ar: "الشرب لغة تناول كل مائع ماء كان أو غيره، والأصل جواز شرب المشروبات إلا ما قام دليل على تحريمه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9935} ومن آدابه التسمية في أوله والحمد في آخره، والشرب باليمين، والتنفس في ثلاثة أنفاس خارج الإناء، والشرب جالسا، ومص الماء لا عبه، والشرب من فم السقاء وثلمة الإناء مكروه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9938} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9940} وجمهور الفقهاء يحرمون الأكل والشرب في آنية الذهب والفضة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9941} ويحرم على الصائم الأكل والشرب، ويبطل الصلاة عند الحنفية الشرب مطلقا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9942} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9943}"
  en: "In language shurb is taking in any liquid, water or other. The basic rule is that all drinks are lawful unless a proof forbids them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9935} Its manners include naming God at the start and praising Him at the end, drinking with the right hand, taking the drink in three breaths outside the vessel, drinking seated, sipping rather than gulping, and disliking drinking from the mouth of a waterskin or from a notch in a vessel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9938} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9940} Most jurists forbid eating and drinking from vessels of gold or silver. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9941} The fasting person is forbidden to eat and drink; drinking deliberately in an obligatory prayer requires repetition, and the schools differ on drinking in prayer by mistake. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9942} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9943}"
