id: concept/shurb-drinking
class: concept
kind: legal
label:
  ar: "الشُّرب"
  en: "Shurb (drinking: manners, the one who drinks in prayer and fasting, and vessels of gold and silver)"
  es: "Shurb (beber: modales, el que bebe en oración y ayuno, y vasos de oro y plata)"
  fr: "Shurb (boire: manières, celui qui boit pendant la prière et le jeûne, et récipients d’or et d’argent)"
  ur: "شرب ⁦(پینے: آداب، نماز اور روزے میں پینے والا، اور سونے اور چاندی کے برتن)⁩"
  tr: "İçki"
  id: "Minum"
summary:
  ar: "الشرب لغة تناول كل مائع ماء كان أو غيره، والأصل جواز شرب المشروبات إلا ما قام دليل على تحريمه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9935} ومن آدابه التسمية في أوله والحمد في آخره، والشرب باليمين، والتنفس في ثلاثة أنفاس خارج الإناء، والشرب جالسا، ومص الماء لا عبه، والشرب من فم السقاء وثلمة الإناء مكروه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9938} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9940} وجمهور الفقهاء يحرمون الأكل والشرب في آنية الذهب والفضة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9941} ويحرم على الصائم الأكل والشرب، ويبطل الصلاة عند الحنفية الشرب مطلقا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9942} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9943}"
  en: "In language shurb is taking in any liquid, water or other. The basic rule is that all drinks are lawful unless a proof forbids them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9935} Its manners include naming God at the start and praising Him at the end, drinking with the right hand, taking the drink in three breaths outside the vessel, drinking seated, sipping rather than gulping, and disliking drinking from the mouth of a waterskin or from a notch in a vessel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9938} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9940} Most jurists forbid eating and drinking from vessels of gold or silver. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9941} The fasting person is forbidden to eat and drink; drinking deliberately in an obligatory prayer requires repetition, and the schools differ on drinking in prayer by mistake. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9942} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9943}"
  es: "En el idioma shurb significa tomar cualquier líquido, agua u otro. La regla básica es que todas las bebidas son lícitas a menos que una prueba las prohíba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9935} Sus modales incluyen nombrar a Dios al principio y alabarlo al final, beber con la mano derecha, tomar la bebida en tres respiraciones fuera del recipiente, beber sentado, sorber en lugar de tragar, y desaconsejar beber de la boca de un odre o de una muesca en un recipiente. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9936} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9937} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9938} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9940} La mayoría de los juristas prohíben comer y beber en vasijas de oro o plata. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9941} La persona que ayuna tiene prohibido comer y beber; beber deliberadamente en una oración obligatoria requiere repetición, y las escuelas difieren en cuanto a beber en oración por error. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9942} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9943}"
  fr: "En langue kuwati, « shurb » signifie boire tout liquide, eau ou autre. La règle de base est que toutes les boissons sont licites, sauf si une preuve les interdit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9935} Les usages comprennent le fait de nommer Dieu au début et de Le louer à la fin, de boire de la main droite, d'avaler la boisson en trois respirations hors du récipient, de boire assis, de siroter plutôt que d'avaler d'un trait, et de ne pas boire directement au goulot d'une outre ou à une encoche d'un récipient. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9938} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9940} La plupart des juristes interdisent de manger et de boire dans des récipients en or ou en argent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9941} Il est interdit à la personne à jeun de manger et de boire; boire délibérément dans une prière obligatoire nécessite une répétition, et les écoles diffèrent sur le fait de boire dans la prière par erreur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9942} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9943}"
  ur: "زبان میں shurb کسی بھی مائع، پانی یا دیگر میں لے رہا ہے. بنیادی قاعدہ یہ ہے کہ تمام مشروبات حلال ہیں جب تک کہ کوئی ثبوت ان کو حرام نہ کرے۔ اس کے آداب میں شروع میں خدا کا نام لینا اور آخر میں اس کی حمد کرنا، داہنے ہاتھ سے پینا، برتن کے باہر تین سانسوں میں مشروب لینا، بیٹھ کر پینا، گھونٹ پینے کے بجائے گھونٹ پینا، اور کسی برتن یا منہ میں پانی پینا ناپسندیدہ ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9936} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9937} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ9938} ص.9939} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص.9940} اکثر فقہاء سونے یا چاندی کے برتنوں میں کھانے پینے سے منع کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9941} روزہ دار کا کھانا پینا حرام ہے۔ فرض نماز میں جان بوجھ کر پینے کے لیے تکرار کی ضرورت ہے، اور مکاتب میں غلطی سے نماز میں شراب پینے پر اختلاف ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9942}"
  tr: "Dilsel olarak içmek, herhangi bir sıvı su içmektir, ister öyle olsun ister olmasın, ve orijinal kural, içeceklerin içilmesinin yasaklanmasına dair kanıt olmadıkça izin verilebileceğidir. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.9935} Adabından bazıları arasında ismi başta söylemek, sonunda Allah'a şükürler olsun, sağ elle içmek, kabın dışında üç nefes almak, otururken içmek, suyu tükürmek yerine emmek ve su taşıyıcının ağzından ve tencerenin ağzından içmek s.9936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9938} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9940} Çoğu hukukçu altın ve gümüş kaplarda yemek ve içmeyi yasaklar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9941} Oruç tutan kişinin yemek ve içmesi yasaktır ve Hanefi mezhebine göre içki içmek tamamen geçersizdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9942} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9943}"
  id: "Minum secara linguistik berarti minum cairan air apa pun, baik itu air maupun tidak, dan aturan awalnya adalah bahwa minum minuman diperbolehkan kecuali ada bukti untuk melarangnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9935} Salah satu etiketnya adalah mengucapkan nama di awal dan puji Tuhan di akhir, minum dengan tangan kanan, menghirup tiga napas di luar wadah, minum sambil duduk, menghisap air daripada meludahkannya, dan minum dari mulut pembawa air dan panci di akhir tidak disukai. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9936} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.9937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9938} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9940} Mayoritas ahli hukum melarang makan dan minum dalam wadah emas dan perak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9941} Dilarang bagi orang yang berpuasa untuk makan dan minum, dan menurut mazhab Hanafi, minum sama sekali tidak sah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9942} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9943}"
