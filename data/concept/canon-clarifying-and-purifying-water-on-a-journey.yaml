id: concept/canon-clarifying-and-purifying-water-on-a-journey
class: concept
kind: scientific
label:
  ar: "تصفية الماء وترويقه في السفر عند ابن سينا"
  en: "Clarifying and purifying water on a journey in the Canon"
  fr: "Clarification et purification de l’eau en voyage dans le Canon"
  ur: "سفر میں پانی کو صاف اور نتھارنا قانون میں"
  es: "Aclarar y purificar el agua durante un viaje por el Cañón"
summary:
  ar: "يقرر ابن سينا في الفصل السابع أن اختلاف المياه قد يوقع المسافر في أمراض أكثر من اختلاف الأغذية، فيدبر ذلك بكثرة ترويق الماء واسترشاحه من الخزف الرشاح وطبخه، وأبلغ من ذلك كله تقطيره بالتصعيد، أو بفتيلة من صوف تصل بين إناء مملوء وإناء خالٍ {cite:canon-ibn-sina-print-v1 p.265}."
  en: "In the seventh chapter Ibn Sina states that differing waters can bring a traveller more illnesses than differing foods, and he deals with this by clarifying the water often, straining it through porous pottery and boiling it, the most effective of all being distilling it by sublimation, or by a woollen wick joining a full vessel to an empty one {cite:canon-ibn-sina-print-v1 p.265}."
  fr: "Au chapitre 7, Ibn Sina juge les eaux changeantes plus susceptibles que les aliments changeants de rendre le voyageur malade. Il décrit clarifications répétées, filtration par poterie poreuse, ébullition, surtout distillation par sublimation, et mèche de laine entre récipient plein et vide {cite:canon-ibn-sina-print-v1 p.265}."
  es: "En el séptimo capítulo, Ibn Sina afirma que las diferentes aguas pueden causar más enfermedades a un viajero que los diferentes alimentos, y lo soluciona clarificando el agua con frecuencia, colándola a través de cerámica porosa y hirviéndola; el método más eficaz de todos es destilarla por sublimación o mediante una mecha de lana que une un recipiente lleno con uno vacío {cite:canon-ibn-sina-print-v1 p.265}."
