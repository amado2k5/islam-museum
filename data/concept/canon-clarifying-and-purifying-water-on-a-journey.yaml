label: { ar: "تصفية الماء وترويقه في السفر عند ابن سينا", en: "Clarifying and purifying water on a journey in the Canon", ur: "سفر میں پانی کو صاف اور نتھارنا قانون میں" }
summary:
  ar: "يقرر ابن سينا في الفصل السابع أن اختلاف المياه قد يوقع المسافر في أمراض أكثر من اختلاف الأغذية، فيدبر ذلك بكثرة ترويق الماء واسترشاحه من الخزف الرشاح وطبخه، وأبلغ من ذلك كله تقطيره بالتصعيد، أو بفتيلة من صوف تصل بين إناء مملوء وإناء خالٍ {cite:canon-ibn-sina-print-v1 p.265}."
  en: "In the seventh chapter Ibn Sina states that differing waters can bring a traveller more illnesses than differing foods, and he deals with this by clarifying the water often, straining it through porous pottery and boiling it, the most effective of all being distilling it by sublimation, or by a woollen wick joining a full vessel to an empty one {cite:canon-ibn-sina-print-v1 p.265}."
