id: concept/cautions-on-leaving-the-bath
class: concept
kind: scientific
label: { ar: "احتراز المستحم عند الخروج من الحمام عند ابن سينا", en: "Cautions on leaving the bath in the Canon", ur: "قانون میں حمام سے نکلتے وقت احتیاطیں", es: "Precauciones al salir del baño en el Canon", fr: "Précautions à prendre en sortant du bain dans le Canon" }
summary:
  ar: "يحذر ابن سينا المستحم من شرب شيء بارد بالفعل عقب الخروج من الحمام أو فيه لأن المسام منفتحة فيندفع البرد إلى الأعضاء الرئيسة، ومن شدة حرارة الماء خشية السل والدق، ومن معافصة الخروج وكشف الرأس وتعريض البدن للبرد، ويوصي بالخروج متدثراً في الشتاء، ويحذر المحموم ومن به تفرق اتصال من الحمام {cite:canon-ibn-sina-print-v1 p.226}."
  en: "Ibn Sina warns the bather against drinking anything actually cold on leaving the bath or in it, since the pores are open and the cold rushes to the principal organs; against very hot water, for fear of consumption and wasting; against leaving abruptly, uncovering the head or exposing the body to cold; he advises leaving wrapped in winter, and that those in the fever's heat or with a solution of continuity beware the bath {cite:canon-ibn-sina-print-v1 p.226}."
  es: "Ibn Sina advierte al bañista que no beba nada realmente frío al salir del baño o dentro de él, ya que los poros están abiertos y el frío llega rápidamente a los órganos principales; que no beba agua muy caliente, por temor a la tuberculosis y el desgaste; que no salga bruscamente, descubriendo la cabeza o exponiendo el cuerpo al frío; aconseja salir bien abrigado en invierno, y que aquellos con fiebre o con una solución continua tengan cuidado con el baño {cite:canon-ibn-sina-print-v1 p.226}."
  fr: "Ibn Sina met en garde le baigneur contre le fait de boire quelque chose de vraiment froid en sortant du bain ou pendant celui-ci, car les pores sont ouverts et le froid se précipite vers les principaux organes; contre l'eau très chaude, par crainte de consommation et de dépérissement; contre le fait de sortir brusquement, de découvrir la tête ou d'exposer le corps au froid; il conseille de sortir enveloppé en hiver, et que ceux qui sont en proie à la fièvre ou qui ont une solution de continuité se méfient du bain {cite:canon-ibn-sina-print-v1 p.226}."
  ur: "ابن سینا غسل سے نکلنے یا اس میں ٹھنڈی چیز نہ پینے سے غسل کرنے والے کو تنبیہ کرتا ہے، کیونکہ مسام کھلے ہوتے ہیں اور سردی بنیادی اعضاء تک پہنچ جاتی ہے۔ بہت گرم پانی کے خلاف، استعمال اور ضائع ہونے کے خوف سے؛ اچانک چھوڑنے، سر کو ننگا کرنے یا جسم کو ٹھنڈا کرنے کے خلاف؛ وہ سردیوں میں لپیٹ کر چھوڑنے کا مشورہ دیتے ہیں، اور یہ کہ بخار کی گرمی میں یا تسلسل کے حل کے ساتھ غسل کرنے سے ہوشیار رہیں۔"
