id: concept/cautions-on-leaving-the-bath
class: concept
kind: scientific
label: { ar: "احتراز المستحم عند الخروج من الحمام عند ابن سينا", en: "Cautions on leaving the bath in the Canon", ur: "قانون میں حمام سے نکلتے وقت احتیاطیں" }
summary:
  ar: "يحذر ابن سينا المستحم من شرب شيء بارد بالفعل عقب الخروج من الحمام أو فيه لأن المسام منفتحة فيندفع البرد إلى الأعضاء الرئيسة، ومن شدة حرارة الماء خشية السل والدق، ومن معافصة الخروج وكشف الرأس وتعريض البدن للبرد، ويوصي بالخروج متدثراً في الشتاء، ويحذر المحموم ومن به تفرق اتصال من الحمام {cite:canon-ibn-sina-print-v1 p.226}."
  en: "Ibn Sina warns the bather against drinking anything actually cold on leaving the bath or in it, since the pores are open and the cold rushes to the principal organs; against very hot water, for fear of consumption and wasting; against leaving abruptly, uncovering the head or exposing the body to cold; he advises leaving wrapped in winter, and that those in the fever's heat or with a solution of continuity beware the bath {cite:canon-ibn-sina-print-v1 p.226}."
