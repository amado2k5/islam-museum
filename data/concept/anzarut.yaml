  tr: "Al-Anzarot"
  id: "Al-Anzarot"
summary:
  ar: "الأنزروت في الكتاب صمغ شجرة شائكة في بلاد فارس وفيه مرارة، وجيّده ما يضرب إلى الصفرة ويشبه اللبان؛ حارّ في الثانية يابس في الأولى عند بعضهم، يغرّ بلا لذع فيدمل ويلحم ويستعمل في المراهم، وفيه إنضاج وتحليل؛ يسكّن الأورام ضماداً، ويأكل اللحم الميت ويدمل الجراحات الطرية ويجبر الوثي، وينفع من الرمد والرمص ونوازل العين، ويسهّل الخام والبلغم الغليظ {cite:canon-ibn-sina-print-v1 pp.350-351}"
  en: "In the book anzarut is the gum of a thorny tree in the land of Fars, with bitterness, and the good kind leans to yellow and resembles frankincense; some say it is hot in the second degree and dry in the first, it glues without stinging so that it cicatrizes and joins and is used in ointments, and it has ripening and resolving power; it soothes swellings as a poultice, eats dead flesh, heals fresh wounds and mends sprains, helps ophthalmia, ocular sordes and catarrhs of the eye, and purges the raw and thick phlegm {cite:canon-ibn-sina-print-v1 pp.350-351}"
  fr: "Dans le livre, l’anzarut est la gomme d’un arbre épineux du pays de Fars, dotée d’amertume, dont la bonne variété tire sur le jaune et ressemble à l’encens ; certains le disent chaud au deuxième degré et sec au premier ; il colle sans piquer, de sorte qu’il cicatrise et réunit les tissus et s’emploie dans les onguents, et possède une force maturative et résolutive ; il apaise les tuméfactions en cataplasme, ronge les chairs mortes, cicatrise les plaies fraîches et répare les entorses, aide contre l’ophtalmie, les chassies et les catarrhes de l’œil, et purge les humeurs crues et le phlegme épais {cite:canon-ibn-sina-print-v1 pp.350-351}"
  ur: "انزروت کتاب میں فارس کے ایک کانٹے دار درخت کا گوند ہے جس میں کڑواہٹ ہے، اور اچھا وہ ہے جو زردی کی طرف مائل ہو اور لبان سے مشابہ ہو؛ بعض کے نزدیک دوسرے درجے میں گرم اور پہلے میں خشک ہے، بغیر جلن کے چپکاتا ہے اس لیے زخم بھرتا اور جوڑتا ہے اور مرہموں میں استعمال ہوتا ہے، اور اس میں پکانے اور تحلیل کی صفت ہے؛ پٹی کی صورت میں ورموں کو تسکین دیتا ہے، مردہ گوشت کو کھاتا ہے، تازہ زخم بھرتا ہے اور موچ کو جوڑتا ہے، آشوب چشم، آنکھ کے رمص اور آنکھ میں اترنے والی رطوبتوں میں مفید ہے، اور کچی اور گاڑھی بلغم کو دست سے نکالتا ہے {cite:canon-ibn-sina-print-v1 pp.350-351}۔"
  es: "En el libro, el anzarut es la goma de un árbol espinoso de la tierra de Fars, de sabor amargo, y la buena tiende al amarillo y se asemeja al incienso; algunos dicen que es caliente en segundo grado y seca en primero, pega sin picar, por lo que cicatriza y une y se usa en ungüentos, y tiene poder madurador y resolutivo; alivia las hinchazones como cataplasma, come carne muerta, cura heridas recientes y esguinces, ayuda con la oftalmía, las afecciones oculares y los catarros del ojo, y purga la flema cruda y espesa {cite:canon-ibn-sina-print-v1 pp.350-351}"
  tr: "Kitapta Anzurut, İran'da dikenli bir ağacın reçinesidir ve acılık içerir. Özelliği sararır ve tütsüye benzer; ikincisi sıcak, ilkinde kuru olduğundan, sokmadan yem edilir, kaynatılır, kaynak edilir ve merhemlerde kullanılır. Olgunlaşmış ve analiz edilmiştir; tümörleri bir kompres olarak yatıştırır, ölü eti yer, yumuşak yaraları iyileştirir, rahmi iyileştirir, konjunktivit, kusturma ve göz rahatsızlıkları için faydalıdır, pürüzlülük ve kalın balgamı kolaylaştırır {cite:canon-ibn-sina-print-v1 s.350-351}"
  id: "Dalam buku ini, Anzurut adalah resin dari pohon berduri di Persia dan mengandung kepahitan. Kualitasnya adalah yang berubah menjadi kuning dan menyerupai kemenyan; panas pada yang kedua dan kering pada yang pertama, ia dipancing tanpa perih, direbus, dilas, dan digunakan dalam salep. Ia matang dan dianalisis; ia menenangkan tumor sebagai polas, memakan daging mati, menyembuhkan luka lunak, menyembuhkan rahim, bermanfaat untuk konjungtivitis, muntah, dan gangguan mata, serta memudahkan kekasaran dan dahak tebal {cite:canon-ibn-sina-print-v1 hlm.350-351}"
