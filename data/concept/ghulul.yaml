id: concept/ghulul
class: concept
kind: legal
label: { ar: "تحريم الغلول", en: "Prohibition of misappropriating spoils (ghulul)", es: "Prohibición de apropiarse indebidamente del botín (ghulul)", fr: "Interdiction du détournement du butin (ghulul)", ur: "مال غنیمت کی ممانعت ⁦(غلول)⁩", tr: "Hırsızlığın Yasaklanması", id: "Larangan Pencurian" }
summary:
  ar: "حكم شرعي وأخلاقي جازم يحرّم كتمان أو اختلاس أي شيء من الغنائم قبل قسمتها العادلة؛ أكده النبي بالجعرانة حين رفع وبرة من سنام بعير محذرًا أن الغلول عار ونار وشنار يوم القيامة حتى في الخياط والمخيط."
  en: "A strict legal and ethical prohibition forbidding the misappropriation of spoils before equitable distribution; emphasized by the Prophet at al-Ji'rana holding up a tuft of camel hair and warning that ghulul brings disgrace and fire on the Day of Resurrection even down to a needle and thread."
  es: "Una estricta prohibición legal y ética que prohíbe la apropiación indebida del botín antes de su distribución equitativa; enfatizada por el Profeta en al-Ji'rana sosteniendo un mechón de pelo de camello y advirtiendo que el ghulul trae deshonra y fuego en el Día de la Resurrección, incluso hasta una aguja e hilo."
  fr: "Une interdiction légale et éthique stricte interdisant le détournement du butin avant sa distribution équitable; soulignée par le Prophète à al-Ji'rana, brandissant une touffe de poils de chameau et avertissant que le ghulul apporte la honte et le feu le Jour de la Résurrection, même jusqu'à une aiguille et un fil."
  ur: "ایک سخت قانونی اور اخلاقی ممانعت جو مساوی تقسیم سے پہلے مال غنیمت کے غلط استعمال سے منع کرتی ہے۔ الجیرانہ میں نبی نے اونٹ کے بالوں کا ایک ٹکڑا اٹھا کر اس بات پر زور دیا کہ غلول قیامت کے دن ذلت اور آگ کو سوئی اور دھاگے تک لے جائے گا۔"
  tr: "Ganimetin adil dağıtımdan önce gizlenmesini veya zimmete geçirilmesini yasaklayan kesin dini ve ahlaki bir hüküm; Peygamber, deve hörgüsünden mızrak kaldırdığında mızrakla bunu onayladı ve hırsızlığın Kıyamet Günü'nde terzi ve terzi için bile utanç, ateş ve alev olduğunu uyardı."
  id: "Sebuah aturan agama dan moral yang tegas melarang penyembunyian atau penggelapan barang rampasan sebelum pembagian yang adil; Nabi menegaskan hal ini dengan tombak ketika ia mengangkat tombak dari bongkuk unta, memperingatkan bahwa pencurian adalah aib, api, dan api pada Hari Penghakiman, bahkan bagi penjahit dan penjahit."
