label: { ar: "تحريم الغلول", en: "Prohibition of misappropriating spoils (ghulul)" }
summary:
  ar: "حكم شرعي وأخلاقي جازم يحرّم كتمان أو اختلاس أي شيء من الغنائم قبل قسمتها العادلة؛ أكده النبي بالجعرانة حين رفع وبرة من سنام بعير محذرًا أن الغلول عار ونار وشنار يوم القيامة حتى في الخياط والمخيط."
  en: "A strict legal and ethical prohibition forbidding the misappropriation of spoils before equitable distribution; emphasized by the Prophet at al-Ji'rana holding up a tuft of camel hair and warning that ghulul brings disgrace and fire on the Day of Resurrection even down to a needle and thread."
