id: concept/al-qiyan
class: concept
kind: social
label:
  ar: القيان والجواري المغنيات
  en: The qiyan — singing slave-girls
  fr: "Les qiyan, chanteuses esclaves"
  es: "Las qiyan — esclavas cantantes"
summary:
  ar: "القيان مؤسسة اجتماعية في العصر العباسي الأول: جوارٍ مغنيات يدربهن أسيادهن وأساتذة الغناء على الألحان والأصوات، على نوعين؛ قيان خاصة للخليفة والأمراء والأغنياء يتهادونهن حباً في التجدد، وقيان عامة يملكهن نخاس يعرضهن في بيوت المقينين لسماع الفتيان والإنفاق عليهن كبيت ابن رامني بالكوفة وقينته سلامة الزرقاء الذي كان يغشاه روح بن حاتم المهلبي ومحمد بن الأشعث ومعن بن زائدة وابن المقفع، وقد امتلأ كتاب الأغاني بتراجمهن أمثال عريب ومتيم وبذل وذات الخال وفريدة، وكان منهن الأديبة الشاعرة فبلغت الواحدة ألفي دينار وثلاثة آلاف."
  en: "The qiyan institution of the first Abbasid age: slave-girls schooled in airs and modes by their masters — Ibrahim al-Mawsili teaching his own, Abdallah ibn Tahir composing for his — divided between the private singers of caliphs and grandees, gifted round out of fashion for novelty, and the public qiyan a slave-dealer housed in 'houses of the established singers' (buyut al-muqayyin) like Ibn Ramin's at Kufa and his girl Sallama al-Zarqa, whose salon Ruh ibn Hatim al-Muhallabi, Muhammad ibn al-Ash'ath, Ma'n ibn Za'ida and Ibn al-Muqaffa' frequented. The Aghani is full of their tarajim — Arib, Mutayyam, Badhl, Dhat al-Khal, Farida — some poets and litterateurs fetching two or three thousand dinars."
  fr: "L’institution des qiyan au début de l’époque abbasside : des femmes esclaves formées aux airs et aux modes par leurs maîtres — Ibrahim al-Mawsili enseignait aux siennes, ‘Abdallah ibn Tahir composait pour les siennes. Il y avait les chanteuses privées des califes et des grands, que ceux-ci s’offraient par goût de la nouveauté, et les qiyan publiques qu’un marchand d’esclaves logeait dans les « maisons des chanteuses établies » (buyut al-muqayyin), comme la maison d’Ibn Ramin à Koufa où chantait Sallama al-Zarqa. Ruh ibn Hatim al-Muhallabi, Muhammad ibn al-Ash‘ath, Ma‘n ibn Za’ida et Ibn al-Muqaffa‘ fréquentaient son salon. L’Aghani abonde en biographies (tarajim) de ces chanteuses : ‘Arib, Mutayyam, Badhl, Dhat al-Khal ou Farida. Certaines étaient poétesses et femmes de lettres et se vendaient deux ou trois mille dinars."
  es: "La institución qiyan de la primera época abasí: esclavas instruidas en melodías y modos por sus amos —Ibrahim al-Mawsili enseñando a las suyas, Abdallah ibn Tahir componiendo para las suyas— divididas entre las cantantes privadas de califas y grandes, regaladas alrededor de la moda por novedad, y el qiyan público, un traficante de esclavas alojado en las «casas de los cantantes consagrados» (buyut al-muqayyin) como la de Ibn Ramin en Kufa y su esclava Sallama al-Zarqa, cuyo salón frecuentaban Ruh ibn Hatim al-Muhallabi, Muhammad ibn al-Ash'ath, Ma'n ibn Za'ida e Ibn al-Muqaffa'. El Aghani está lleno de sus tarajim —Arib, Mutayyam, Badhl, Dhat al-Khal, Farida— algunos poetas y literatos que se ganaban dos o tres mil dinares."
