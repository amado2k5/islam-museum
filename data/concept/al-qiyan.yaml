label:
  ar: القيان والجواري المغنيات
  en: The qiyan — singing slave-girls
summary:
  ar: "القيان مؤسسة اجتماعية في العصر العباسي الأول: جوارٍ مغنيات يدربهن أسيادهن وأساتذة الغناء على الألحان والأصوات، على نوعين؛ قيان خاصة للخليفة والأمراء والأغنياء يتهادونهن حباً في التجدد، وقيان عامة يملكهن نخاس يعرضهن في بيوت المقينين لسماع الفتيان والإنفاق عليهن كبيت ابن رامني بالكوفة وقينته سلامة الزرقاء الذي كان يغشاه روح بن حاتم المهلبي ومحمد بن الأشعث ومعن بن زائدة وابن المقفع، وقد امتلأ كتاب الأغاني بتراجمهن أمثال عريب ومتيم وبذل وذات الخال وفريدة، وكان منهن الأديبة الشاعرة فبلغت الواحدة ألفي دينار وثلاثة آلاف."
  en: "The qiyan institution of the first Abbasid age: slave-girls schooled in airs and modes by their masters — Ibrahim al-Mawsili teaching his own, Abdallah ibn Tahir composing for his — divided between the private singers of caliphs and grandees, gifted round out of fashion for novelty, and the public qiyan a slave-dealer housed in 'houses of the established singers' (buyut al-muqayyin) like Ibn Ramin's at Kufa and his girl Sallama al-Zarqa, whose salon Ruh ibn Hatim al-Muhallabi, Muhammad ibn al-Ash'ath, Ma'n ibn Za'ida and Ibn al-Muqaffa' frequented. The Aghani is full of their tarajim — Arib, Mutayyam, Badhl, Dhat al-Khal, Farida — some poets and litterateurs fetching two or three thousand dinars."
