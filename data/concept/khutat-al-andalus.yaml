label: { ar: "الخطط الست بالأندلس" }
kind: political
summary:
  ar: "وصف ابن سعيد لنظم الحكم بالأندلس في ست خطط: الوزارة التي كانت مشتركة في جماعة يختار منهم الأمير حاجباً وكانت تتوارث في البيوت حتى صار اسم الحاجب أعظم ما يتنافس فيه ملوك الطوائف، والكتابة أعلاها كاتب الرسائل وكاتب الزمام الذي لا يكون نصرانياً ولا يهودياً البتة لأنه يحتاج إلى وجوه الناس، وصاحب الأشغال الخراجية الذي كان أعظم من الوزير وإن اغتر بالاكتساب صُودر، وخطة القضاء أعظم الخطط عند الخاصة والعامة وصاحبها قاضي الجماعة، وخطة الشرطة وصاحبها صاحب المدينة وصاحب الليل، وخطة الاحتساب الموضوعة في أهل العلم والفطن وكان المحتسب يركب بنفسه على الأسواق وبيد أعوانه ميزان الخبز ويختبر بيع الجزار بورقة السعر {cite:nafh-tib-maqqari p. 252-255}."
  en: "Ibn Sa'id's celebrated register of the six offices of Andalusi government: the collegial wazirate with its inherited hajib, the chancery (katib al-rasa'il and the katib al-zamam who must be a man of standing, 'never Christian or Jew'), the kharaj director greater than the wazir, the qadiate — highest office of all under qadi al-jama'a — the shurta (sahib al-madina) and the hisba inspector who rode the markets with the bread-scale in an aide's hand {cite:nafh-tib-maqqari p. 252-255}."
