id: concept/khutat-al-andalus
class: concept
label: { ar: "الخطط الست بالأندلس", en: "The six offices of al-Andalus", es: "Las seis oficinas de al-Ándalus", fr: "Les six bureaux d'al-Andalus" }
kind: political
summary:
  ar: "وصف ابن سعيد لنظم الحكم بالأندلس في ست خطط: الوزارة التي كانت مشتركة في جماعة يختار منهم الأمير حاجباً وكانت تتوارث في البيوت حتى صار اسم الحاجب أعظم ما يتنافس فيه ملوك الطوائف، والكتابة أعلاها كاتب الرسائل وكاتب الزمام الذي لا يكون نصرانياً ولا يهودياً البتة لأنه يحتاج إلى وجوه الناس، وصاحب الأشغال الخراجية الذي كان أعظم من الوزير وإن اغتر بالاكتساب صُودر، وخطة القضاء أعظم الخطط عند الخاصة والعامة وصاحبها قاضي الجماعة، وخطة الشرطة وصاحبها صاحب المدينة وصاحب الليل، وخطة الاحتساب الموضوعة في أهل العلم والفطن وكان المحتسب يركب بنفسه على الأسواق وبيد أعوانه ميزان الخبز ويختبر بيع الجزار بورقة السعر {cite:nafh-tib-maqqari p. 252-255}."
  en: "Ibn Sa'id's celebrated register of the six offices of Andalusi government: the collegial wazirate with its inherited hajib, the chancery (katib al-rasa'il and the katib al-zamam who must be a man of standing, 'never Christian or Jew'), the kharaj director greater than the wazir, the qadiate — highest office of all under qadi al-jama'a — the shurta (sahib al-madina) and the hisba inspector who rode the markets with the bread-scale in an aide's hand {cite:nafh-tib-maqqari p. 252-255}."
  es: "El célebre registro de Ibn Sa'id de los seis cargos del gobierno andalusí: el wazirat colegiado con su hajib hereditario, la cancillería (katib al-rasa'il y el katib al-zamam que debe ser un hombre de posición, 'nunca cristiano ni judío'), el director del kharaj, superior al wazirat, el cadí —el cargo más alto de todos bajo el cadí al-jama'a—, el shurta (sahib al-madina) y el inspector hisba que recorría los mercados con la balanza del pan en la mano de un ayudante {cite:nafh-tib-maqqari p. 252-255}."
  fr: "Le célèbre registre d'Ibn Sa'id sur les six offices du gouvernement andalou: le wazirat collégial avec son hajib héréditaire, la chancellerie (katib al-rasa'il et le katib al-zamam qui doit être un homme de haut rang, « jamais chrétien ni juif »), le directeur du kharaj supérieur au wazir, le qadiat — le plus haut office de tous sous le qadi al-jama'a — le shurta (sahib al-madina) et l'inspecteur de la hisba qui parcourait les marchés avec la balance à pain dans la main d'un aide {cite:nafh-tib-maqqari p. 252-255}."
