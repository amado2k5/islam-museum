summary:
  ar: "الصبر في الكتاب عصارة جامدة بين حمرة وشقرة، منه أسقوطري ومنه عربي ومنه سمنجاني، وأجوده الأسقوطري، حار إلى الثانية يابس فيها، قابض مجفف منوم، ينفع في الأورام والقروح العسرة الاندمال والصداع وقروح العين، وينقي الفضول الصفراوية والبلغمية في المعدة ويسهل البطن، وأصلح مسهل للمعدة، وسقيه في أيام البرد خطر {cite:canon-ibn-sina-print-v1 pp.640-641}"
  en: "Sabir is in the book a congealed juice between red and fair, of which there is the Socotran, the Arabian and the Samanjani, the Socotran the best; hot to the second degree and dry in it, astringent, drying and sleep-inducing, it benefits swellings, ulcers that are slow to heal, headache and ulcers of the eye, cleanses the bilious and phlegmatic superfluities in the stomach and loosens the belly, being the best laxative for the stomach, though giving it in cold days is dangerous {cite:canon-ibn-sina-print-v1 pp.640-641}"
  ur: "صبر کتاب میں جما ہوا رس ہے جو سرخی اور سنہرے پن کے بیچ ہے، اس کی ایک قسم اسقوطری، ایک عربی اور ایک سمنجانی ہے، سب سے اچھا اسقوطری؛ دوسرے درجے تک گرم اور اس میں خشک، قابض، خشک کرنے والا اور نیند لانے والا؛ ورموں، دیر سے بھرنے والے زخموں، سر درد اور آنکھ کے زخموں میں نافع ہے، معدے کے صفراوی اور بلغمی فضلات صاف کرتا اور پیٹ کھولتا ہے، معدے کے لیے سب سے مناسب مسہل ہے، اور سردی کے دنوں میں پلانا خطرناک ہے {cite:canon-ibn-sina-print-v1 pp.640-641}۔"
  es: "Sabir es descrito en el libro como un jugo coagulado entre rojo y claro, del cual existen el Socotran, el Árabe y el Samanjani; el Socotran es el mejor. Caliente hasta el segundo grado y seco en su interior, astringente, secante e inductor del sueño, beneficia las hinchazones, las úlceras de lenta cicatrización, el dolor de cabeza y las úlceras oculares, limpia los excesos biliares y flemáticos del estómago y afloja el vientre, siendo el mejor laxante para el estómago, aunque administrarlo en días fríos es peligroso {cite:canon-ibn-sina-print-v1 pp.640-641}"
  fr: "Le sabir est décrit dans le livre comme un jus coagulé, entre le rouge et le clair, dont il existe trois variétés: le sabir de Socotra, le sabir d'Arabie et le samanjani, le sabir de Socotra étant le meilleur. Chaud au deuxième degré et sec, astringent, asséchant et soporifique, il est bénéfique pour les gonflements, les ulcères à cicatrisation lente, les maux de tête et les ulcères oculaires. Il purifie l'estomac des excès bilieux et phlegmatiques et décongestionne l'estomac, étant le meilleur laxatif pour l'estomac. Toutefois, son administration par temps froid est dangereuse. {cite:canon-ibn-sina-print-v1 pp.640-641}"
