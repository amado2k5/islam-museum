label: { ar: "مطالع الأبراج المتناظرة وجدول الربع الأول في الزيج الصابي", en: "The risings of the mirror signs and the table of the first quarter", ur: "متناظر بروج کے مطالع اور پہلے ربع کا جدول", es: "Las elevaciones de los signos del espejo y la tabla del primer cuarto", fr: "Les levées des signes miroirs et la table du premier quartier" }
summary:
  ar: "يبيّن البتاني أن مطالع الحوت مثل مطالع الحمل، ومطالع السنبلة مثل مطالع الميزان، ومطالع الدلو مثل مطالع الثور، ومطالع الجدي مثل مطالع الجوزاء، ومطالع القوس مثل مطالع السرطان، ومطالع الأسد مثل مطالع العقرب، فيكفي معرفة حصص ما بين أول الحمل وأول السرطان، من درجة إلى تسعين درجة. ثم يشرح كيف يُبنى جدول المطالع درجة درجة. {cite:zij-sabi-nallino-byblion p.44}."
  en: "Al-Battani shows that the risings of Pisces equal those of Aries, Virgo those of Libra, Aquarius those of Taurus, Capricorn those of Gemini, Sagittarius those of Cancer and Leo those of Scorpio, so that it is enough to know the shares between the first of Aries and the first of Cancer, from one degree to ninety. He then explains how to build the risings table degree by degree. {cite:zij-sabi-nallino-byblion p.44}."
  ur: "البتانی دکھاتے ہیں کہ حوت کے مطالع حمل کے، سنبلہ کے میزان کے، دلو کے ثور کے، جدی کے جوزاء کے، قوس کے سرطان کے اور اسد کے عقرب کے مطالع کے برابر ہیں، اس لیے حمل کے آغاز اور سرطان کے آغاز کے بیچ ایک درجے سے نوے درجے تک کے حصے جان لینا کافی ہے۔ پھر وہ بتاتے ہیں کہ مطالع کا جدول درجہ بہ درجہ کیسے بنایا جاتا ہے۔ {cite:zij-sabi-nallino-byblion p.44}۔"
  es: "Al-Battani demuestra que los ascendentes de Piscis son iguales a los de Aries, Virgo a los de Libra, Acuario a los de Tauro, Capricornio a los de Géminis, Sagitario a los de Cáncer y Leo a los de Escorpio, de modo que basta con conocer las proporciones entre el primero de Aries y el primero de Cáncer, desde un grado hasta noventa. A continuación, explica cómo construir la tabla de ascendentes grado por grado. {cite:zij-sabi-nallino-byblion p.44}."
  fr: "Al-Battani démontre que les ascendants des Poissons sont égaux à ceux du Bélier, ceux de la Vierge à ceux de la Balance, ceux du Verseau à ceux du Taureau, ceux du Capricorne à ceux des Gémeaux, ceux du Sagittaire à ceux du Cancer et ceux du Lion à ceux du Scorpion. Il suffit donc de connaître les proportions entre le premier ascendant du Bélier et le premier ascendant du Cancer, de un à quatre-vingt-dix degrés. Il explique ensuite comment construire le tableau des ascendants degré par degré. {cite:zij-sabi-nallino-byblion p.44}"
