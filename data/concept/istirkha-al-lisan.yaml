id: concept/istirkha-al-lisan
class: concept
kind: scientific
label:
  ar: استرخاء اللسان وثقله والخلل الداخل في الكلام
  en: Relaxation and heaviness of the tongue and the speech defect
  ur: زبان کا استرخا، گرانی اور کلام کا خلل
  es: "Relajación y pesadez de la lengua y el defecto del habla"
  fr: "Relâchement et lourdeur de la langue et trouble de la parole"
summary:
  ar: استرخاء اللسان من أصناف الاسترخاء المذكورة والسبب المعلوم وقد يكون من رطوبة دموية مائية وقد يكون لسبب في الدماغ أو في العصبة المحركة له ويدل على أن المادة دموية حمرة اللسان وحرارته وعلى أنها رقيقة مائية كثرة سيلان اللعاب الرقيق، وقد يبلغ باللسان أن يعدم الكلام أو يتعسر أو يتغير ومنه الفأفاء والتمتام والمتعتع وألثغ ⁦(ألفاظ العيوب بتحرير النساخ)⁩ ومن الصبيان من تطول به مدة العجز عن الكلام ومنهم من إذا عرض له مرض حار انطلق لسانه لذوبان الرطوبة المحتبسة في أصول عصبه، ويعالج بتنقية البدن ثم قصد ناحية الرأس ثم الموضع بالدلك والتغرغر والحبوب الممسكة تحت اللسان {cite:canon-ibn-sina-print-v2 p.255} {cite:canon-ibn-sina-print-v2 p.256} {cite:canon-ibn-sina-print-v2 p.257} {cite:canon-ibn-sina-print-v2 p.258}
  en: 'The tongue''s relaxation is among the kinds of relaxation already named and from the known cause: a sanguine watery moisture, or a cause in the brain or in its moving nerve or the branch coming to it from it; the matter''s being sanguine is read from the tongue''s redness and heat, and its being thin and watery from the flow of thin saliva, little benefit from dissolvers and benefit from the astringing kinds. It may reach the loss of speech, its difficulty or its alteration — among its forms the fa''fa'', the tamtam, the muta''ti'' and the lisp ⁦(the defect terms by the copyists'' explanation)⁩. Some boys are long unable to speak; one whose moisture moderates as he grows returns eloquent, and one on whom a hot disease falls may have his tongue released by the melting of the moisture held in the roots of his nerves. The body is purified, then the head''s quarter is aimed at, then the place itself with rubbing, gargling and pills held under the tongue ⁦(recipes and drug names left out; the cupping-lancet case report carried as the book''s report)⁩ {cite:canon-ibn-sina-print-v2 p.255} {cite:canon-ibn-sina-print-v2 p.256} {cite:canon-ibn-sina-print-v2 p.257} {cite:canon-ibn-sina-print-v2 p.258}'
  ur: 'زبان کا استرخا مذکورہ استرخا کی اقسام میں سے ہے اور معلوم سبب سے: خونی پانی کی رطوبت، یا دماغ میں کوئی سبب یا اس کے محرک عصب یا اس سے آنے والی شاخ میں؛ مادہ کا خونی ہونا زبان کی سرخی اور حرارت سے اور پتلا پانی ہونا پتلے لعاب کے بہاؤ، محللات کے کم نفع اور قابضوں کے نفع سے پہچانا جاتا ہے؛ اور یہ زبان کو کلام سے محروم، دشوار یا بدلا ہوا کر سکتا ہے — اس میں فأفاء، تمتام، متعتع اور لتلتاہٹ ہیں ⁦(عیبوں کے نام نساخوں کی تحریر سے)⁩؛ بعض لڑکوں کا کلام مدت تک نہیں کھلتا؛ جس کی رطوبت بڑھتے ہوئے معتدل ہو جائے وہ فصیح لوٹتا ہے اور جس پر کوئی گرم مرض آئے اس کی زبان اعصاب کی جڑوں میں محبوس رطوبت کے پگھلنے سے کھل جاتی ہے؛ علاج میں پہلے بدن صاف کیا جاتا ہے پھر سر کی طرف قصد پھر خود مقام پر ملید، غرغرہ اور زبان کے تلے رکھنے والی گولیاں ⁦(نسخے اور ادویہ کے نام مطروح؛ حجامت کی میخ کی داستان کتاب کی روایت کے طور پر)⁩ {cite:canon-ibn-sina-print-v2 p.255} {cite:canon-ibn-sina-print-v2 p.256} {cite:canon-ibn-sina-print-v2 p.257} {cite:canon-ibn-sina-print-v2 p.258}'
  es: "La relajación de la lengua se encuentra entre los tipos de relajación ya mencionados y tiene una causa conocida: una humedad acuosa sanguínea, o una causa en el cerebro o en su nervio motor o la rama que viene de él; la naturaleza sanguínea de la materia se deduce del enrojecimiento y el calor de la lengua, y su fluidez y contenido acuoso por el flujo de saliva fina, poco beneficio de los disolventes y beneficio de los astringentes. Puede llegar a la pérdida del habla, su dificultad o su alteración; entre sus formas se encuentran el fa'fa', el tamtam, el muta'ti' y el ceceo (los términos del defecto según la explicación de los copistas). Algunos niños son incapaces de hablar durante mucho tiempo; uno cuya humedad se modera con la edad recupera la elocuencia, y uno que padece una enfermedad febril puede experimentar una liberación de la lengua por la disolución de la humedad retenida en las raíces de sus nervios. Se purifica el cuerpo, luego se apunta a la cabeza, luego al lugar mismo con frotamiento, gárgaras y pastillas sostenidas bajo la lengua (se omiten recetas y nombres de medicamentos; el informe del caso de la lanceta de ventosas se presenta como el informe del libro) {cite:canon-ibn-sina-print-v2 p.255} {cite:canon-ibn-sina-print-v2 p.256} {cite:canon-ibn-sina-print-v2 p.257} {cite:canon-ibn-sina-print-v2 p.258}"
  fr: "Le relâchement de la langue fait partie des types de relâchement déjà nommés et dont la cause est connue: une humidité aqueuse et sanguine, ou une cause cérébrale, nerveuse (notamment au niveau du nerf qui la innerve). La nature sanguine de la substance se manifeste par la rougeur et la chaleur de la langue, tandis que sa viscosité et son aspect aqueux sont dus à un écoulement de salive fluide. Les dissolvants sont peu efficaces, contrairement aux astringents. Ce relâchement peut aller jusqu'à la perte de la parole, des difficultés d'élocution ou des troubles tels que le fa'fa', le tamtam, le muta'ti' et le zézaiement (termes désignant ce défaut par les copistes). Certains garçons restent longtemps muets; celui dont l'humidité diminue avec l'âge retrouve l'éloquence, et celui qui est atteint d'une maladie inflammatoire peut voir sa langue se libérer par la disparition de l'humidité retenue à la base de ses nerfs. Le corps est purifié, puis on s'attaque au quartier de la tête, puis à la zone elle-même par frictions, gargarismes et administration de pilules sous la langue (recettes et noms de médicaments omis; le compte rendu de l'expérience avec les ventouses et la lancette est repris dans le livre) {cite:canon-ibn-sina-print-v2 p.255} {cite:canon-ibn-sina-print-v2 p.256} {cite:canon-ibn-sina-print-v2 p.257} {cite:canon-ibn-sina-print-v2 p.258}"
