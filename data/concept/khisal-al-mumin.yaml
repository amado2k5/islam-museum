id: concept/khisal-al-mumin
class: concept
kind: ethical
label:
  ar: "خِصَال المؤمن"
  en: "The traits of the believer (khisal al-mu'min)"
  ur: "مومن کی خصلتیں"
  es: "Los rasgos del creyente (khisal al-mu'min)"
summary:
  ar: "خصال المؤمن هي الصفات التي يصف بها القرآن والحديث من آمن: خشوعه في صلاته وحفظه لأمانته وعهده في أول سورة المؤمنون [[passage/quran-23-1|المؤمنون 1]]–[[passage/quran-23-11|11]]، ووجل قلبه وزيادة إيمانه وتوكله في [[passage/quran-8-2|الأنفال 2]]، وتواضع عباد الرحمن وحلمهم في [[passage/quran-25-63|الفرقان 63]] وما بعدها. ويمثّل الحديث المؤمنين بالبنيان يشد بعضه بعضا {cite:sahih-muslim 2585} وبالجسد الواحد {cite:sahih-muslim 2586}، ويعدّ ثلاثا من كنّ فيه وجد بهن حلاوة الإيمان {cite:sahih-muslim 0043}، ويصف المسلم بأنه من سلم المسلمون من لسانه ويده {cite:sahih-al-bukhari 10}. والخصلة والشعبة عند النووي بمعنى واحد: فمعنى حديث شعب الإيمان عنده «بضع وسبعون خصلة» {cite:sharh-sahih-muslim-al-nawawi p.116}."
  en: "The traits of the believer are the qualities by which the Qur'an and the hadith describe those who believe: humility in prayer and the keeping of trusts and covenants at the opening of Surat al-Mu'minun, [[passage/quran-23-1|al-Mu'minun 1]]–[[passage/quran-23-11|11]]; the trembling heart, growing faith and reliance on God of [[passage/quran-8-2|al-Anfal 2]]; and the humility and forbearance of the servants of the Merciful from [[passage/quran-25-63|al-Furqan 63]] onward. The hadith likens the believers to a building whose parts hold one another up {cite:sahih-muslim 2585} and to one body {cite:sahih-muslim 2586}, counts three traits by which a person finds the sweetness of faith {cite:sahih-muslim 0043}, and describes the Muslim as the one from whose tongue and hand the Muslims are safe {cite:sahih-al-bukhari 10}. For al-Nawawi a trait and a branch are one thing: the hadith of the branches of faith means 'seventy-odd traits' {cite:sharh-sahih-muslim-al-nawawi p.116}."
  ur: "مومن کی خصلتیں وہ اوصاف ہیں جن سے قرآن اور حدیث ایمان والوں کو بیان کرتے ہیں: سورۂ مومنون کے آغاز میں نماز میں خشوع اور امانت و عہد کی پاسداری، [[passage/quran-23-1|المؤمنون 1]]–[[passage/quran-23-11|11]]؛ [[passage/quran-8-2|الانفال 2]] میں دل کا لرزنا، ایمان کا بڑھنا اور اللہ پر توکل؛ اور [[passage/quran-25-63|الفرقان 63]] سے آگے رحمٰن کے بندوں کی تواضع اور بردباری۔ حدیث مومنوں کو ایسی عمارت سے تشبیہ دیتی ہے جس کا ایک حصہ دوسرے کو مضبوط کرتا ہے {cite:sahih-muslim 2585} اور ایک جسم سے {cite:sahih-muslim 2586}، تین خصلتیں گنتی ہے جن سے آدمی ایمان کی مٹھاس پاتا ہے {cite:sahih-muslim 0043}، اور مسلمان کا وصف یہ بتاتی ہے کہ اس کی زبان اور ہاتھ سے مسلمان محفوظ رہیں {cite:sahih-al-bukhari 10}۔ نووی کے نزدیک خصلت اور شعبہ ایک ہی معنی میں ہیں: ان کے ہاں شعبِ ایمان کی حدیث کا مطلب «ستر سے کچھ اوپر خصلتیں» ہے {cite:sharh-sahih-muslim-al-nawawi p.116}۔"
  es: "Los rasgos del creyente son las cualidades con las que el Corán y el hadiz describen a los que creen: humildad en la oración y el cumplimiento de las confianzas y los pactos al comienzo de la Sura al-Mu'minun, [[passage/quran-23-1|al-Mu'minun 1]]–[[passage/quran-23-11|11]]; el corazón tembloroso, la fe creciente y la confianza en Dios de [[passage/quran-8-2|al-Anfal 2]]; y la humildad y la paciencia de los siervos del Misericordioso desde [[passage/quran-25-63|al-Furqan 63]] en adelante. El hadiz compara a los creyentes con un edificio cuyas partes se sostienen mutuamente {cite:sahih-muslim 2585} y con un solo cuerpo {cite:sahih-muslim 2586}, enumera tres rasgos mediante los cuales una persona encuentra la dulzura de la fe {cite:sahih-muslim 0043} y describe al musulmán como aquel de cuya lengua y mano los musulmanes están a salvo {cite:sahih-al-bukhari 10}. Para al-Nawawi, un rasgo y una rama son una misma cosa: el hadiz de las ramas de la fe significa \"setenta y tantos rasgos\" {cite:sharh-sahih-muslim-al-nawawi p.116}."
