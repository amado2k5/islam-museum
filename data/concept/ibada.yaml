label:
  ar: العبادة
  en: Ibada (worship)
  ur: عبادت
  es: "Ibada (adoración)"
  fr: "Ibada (culte)"
  tr: "İbadet"
  id: "Ibadah"
summary:
  ar: "العبادة في الشريعة اسم جامع لما يحبه الله ويرضاه من أعمال القلوب والجوارح؛ تعالج الموسوعة الفقهية الكويتية أحكام العبادات في كتبها الأولى من نية إفساد العبادة إلى الاستعانة بالغير فيها {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  en: "Ibada in the sharia is a comprehensive name for the acts of the heart and limbs that God loves and approves; the Kuwaiti Fiqh Encyclopedia treats the rulings of worship in its opening books, from the intention that vitiates worship to seeking others' help in it {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  es: "Ibada en la sharia es un nombre general para los actos del corazón y los miembros que Dios ama y aprueba; la Enciclopedia Fiqh de Kuwait trata las normas de la adoración en sus primeros libros, desde la intención que vicía la adoración hasta la búsqueda de ayuda de otros en ella {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  fr: "Dans la charia, l'Ibada est un terme générique désignant les actes du cœur et des membres que Dieu aime et approuve; l'Encyclopédie Fiqh koweïtienne traite des règles du culte dans ses premiers livres, depuis l'intention qui vicie le culte jusqu'à la recherche de l'aide d'autrui dans celui-ci {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  ur: "شریعت میں عبادت دل اور اعضاء کے کاموں کا ایک جامع نام ہے جو خدا کو پسند اور منظور ہے۔ کویتی فقہ انسائیکلو پیڈیا اپنی ابتدائی کتابوں میں عبادات کے احکام کو بیان کرتا ہے، اس نیت سے جو عبادت کو خراب کرتی ہے اس میں دوسروں کی مدد حاصل کرنے تک۔"
  tr: "Şeriatta ibadet, Allah'ın kalp ve uzuvların eylemleri açısından sevdiği ve hoşuna gittiği şeyleri ifade eden toplu bir terimdir; Kuveyt Fıkıh Ansiklopedisi, ibadet kurallarını erken kitaplarında ele alır; ibadeti geçersiz kılma niyetinden başkalarından yardım aramaya kadar {atıf:fiqh-mawsua-kuwaitiyya-noor-v3}."
  id: "Ibadah dalam Syariah adalah istilah kolektif untuk apa yang Allah cintai dan sukai dalam hal tindakan hati dan anggota tubuh; Ensiklopedia Yurisprudensial Kuwait membahas aturan ibadah dalam buku-buku awalnya, mulai dari niat untuk membatalkan ibadah hingga mencari bantuan dari orang lain di dalamnya {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
