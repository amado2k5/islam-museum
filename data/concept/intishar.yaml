id: concept/intishar
class: concept
kind: legal
label: { ar: "الانتشار", en: "Intishar (spreading; erection, and spreading of a report)", es: "Intishar (difusión; erección y propagación de un informe)", fr: "Intishar (diffusion; érection et diffusion d'un rapport)", ur: "Intishar ⁦(پھیلنا؛ کھڑا ہونا، اور رپورٹ کا پھیلانا)⁩", tr: "Yayılım", id: "Yayılım" }
summary:
  ar: "الانتشار لغة الذيوع والامتداد، ويطلقه الفقهاء على معنيين: إنعاظ الذكر، وشيوع الشيء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3436} والانتشار بالمعنى الأول له أثر في حل المطلقة ثلاثا لمن طلقها بعد نكاح آخر، ويتعلق به الإكراه على الزنا، والانتشار بمعنى الشيوع يُعتبر في ثبوت الهلال بالخبر المنتشر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3436}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3437}"
  en: "Intishar in the lexical sense is spreading or extending. The jurists use it in two senses: the stiffening of the male member and the spreading of a thing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3436} The first matters for whether a triply divorced woman becomes lawful to her former husband after another marriage, and for compulsion to fornication; the second matters for proof of the new moon by a widely spread report. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3436}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3437}"
  es: "Intishar, en sentido léxico, significa extender o propagar. Los juristas lo usan en dos sentidos: la erección del miembro masculino y la propagación de algo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3436} El primero es relevante para determinar si una mujer divorciada tres veces se vuelve lícita con su exmarido después de un nuevo matrimonio, y para la coacción; el segundo es relevante para la prueba de la luna nueva mediante un informe ampliamente difundido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3436}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3437}"
  fr: "Intishar, au sens littéral, signifie « étendre » ou « s'étendre ». Les juristes l'emploient dans deux sens: l'érection et la propagation d'une chose. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3436} Le premier sens est pertinent pour déterminer si une femme trois fois divorcée peut redevenir licite à son ex-mari après un nouveau mariage, et en cas de contrainte à la fornication; le second est pertinent pour prouver la nouvelle lune par une rumeur largement répandue. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3436}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3437}"
  ur: "لغوی معنوں میں انتشار پھیلنا یا پھیلانا ہے۔ فقہاء اسے دو معنوں میں استعمال کرتے ہیں: مرد کے رکن کا اکڑ جانا اور کسی چیز کا پھیل جانا۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 3436} پہلی بات یہ ہے کہ آیا تین طلاق یافتہ عورت دوسری شادی کے بعد اپنے سابقہ شوہر کے لیے حلال ہو جاتی ہے، اور زنا کرنے پر مجبور ہو جاتی ہے۔ بڑے پیمانے پر پھیلی ہوئی رپورٹ کے ذریعہ نئے چاند کے ثبوت کے لئے دوسرا معاملہ۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3436}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص3437}"
  tr: "Dilsel olarak yaymak, 'yaymak' ve genişletme anlamına gelir ve hukukçular bunu iki anlamda kullanır: erkeğin tekrarı ve bir şeyin yayılması. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3436} Birinci anlamda yaymak, boşanmış bir kadının başka bir evlilikten sonra boşananlar için üç kez izin verilebilirliğini etkiler ve zina yapmaya zorlama ile ilgilidir. Yaygın anlamda yayılma, yayılma raporunda hilal şeklinde bir doğrulama olarak kabul edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3436} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3437}"
  id: "Menyebarkan secara linguistik berarti 'penyebaran' dan perluasan, dan ahli hukum menggunakannya untuk dua makna: pengulangan laki-laki dan penyebaran sesuatu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3436} Penyebaran dalam arti pertama memengaruhi izinnya perempuan yang bercerai tiga kali bagi mereka yang menceraikannya setelah pernikahan lain, dan berkaitan dengan paksaan untuk berzina. Penyebaran dalam arti menyebar dianggap sebagai konfirmasi bulan sabit dalam laporan penyebaran. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3436} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3437}"
