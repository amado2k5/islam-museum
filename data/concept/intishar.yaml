label: { ar: "الانتشار", en: "Intishar (spreading; erection, and spreading of a report)" }
summary:
  ar: "الانتشار لغة الذيوع والامتداد، ويطلقه الفقهاء على معنيين: إنعاظ الذكر، وشيوع الشيء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3436} والانتشار بالمعنى الأول له أثر في حل المطلقة ثلاثا لمن طلقها بعد نكاح آخر، ويتعلق به الإكراه على الزنا، والانتشار بمعنى الشيوع يُعتبر في ثبوت الهلال بالخبر المنتشر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3436}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3437}"
  en: "Intishar in the lexical sense is spreading or extending. The jurists use it in two senses: the stiffening of the male member and the spreading of a thing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3436} The first matters for whether a triply divorced woman becomes lawful to her former husband after another marriage, and for compulsion to fornication; the second matters for proof of the new moon by a widely spread report. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3436}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3437}"
