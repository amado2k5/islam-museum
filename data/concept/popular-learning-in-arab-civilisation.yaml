label: { ar: "الحركة العامية في الحضارة العربية", en: "Popular learning in Arab civilisation" }
summary:
  ar: "يعرض شكيب أرسلان في فصل «الحركة العامية في الحضارة العربية» انتشار التعليم بين عامة الناس بعد أن كان مقصوراً على طبقة بعينها. يذكر أن المدارس في البصرة والكوفة وبغداد والقاهرة وقرطبة كانت مفتوحة لطلاب من طبقات مختلفة، وأن بعض الخلفاء كانوا يجرون النفقة على التلاميذ الفقراء، وأن أهل الذمة كانوا يتولون إدارة بعض المدارس، وأن كثيراً من طلاب قرطبة كانوا من المسيحيين. ويرى أن هذه الحركة تقوم على قدر من التسامح في زمن الأمويين والعباسيين الأوائل، ويصف ترجمة المأمون لكتب بطليموس وما تبعها من علوم الفلك. يعرض ذلك بوصف المؤلف، وقد اعتمد فيه على تاريخ عام لا على دراسة تفصيلية لكل مدرسة."
  en: "Arslan's chapter describes the spread of learning beyond a narrow class in early Arab-Islamic civilisation. He reports that schools in Basra, Kufa, Baghdad, Cairo and Cordoba admitted students of different social rank, that some rulers paid living costs for poor pupils, that non-Muslim teachers sometimes ran schools, and that many students in Cordoba were Christian. He sees this openness as rooted in the tolerance of the early Umayyad and Abbasid periods, and points to al-Ma'mun's translation of Ptolemy and the astronomy that followed. This is the author's broad account, not a study of each school."
