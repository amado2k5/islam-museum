label: { ar: "الحركة العامية في الحضارة العربية", en: "Popular learning in Arab civilisation", es: "El aprendizaje popular en la civilización árabe", fr: "L'apprentissage populaire dans la civilisation arabe", ur: "عرب تہذیب میں مقبول تعلیم", tr: "Arap Uygarlığında Günlük Hareket", id: "Gerakan Sehari-hari dalam Peradaban Arab" }
summary:
  ar: "يعرض شكيب أرسلان في فصل «الحركة العامية في الحضارة العربية» انتشار التعليم بين عامة الناس بعد أن كان مقصوراً على طبقة بعينها. يذكر أن المدارس في البصرة والكوفة وبغداد والقاهرة وقرطبة كانت مفتوحة لطلاب من طبقات مختلفة، وأن بعض الخلفاء كانوا يجرون النفقة على التلاميذ الفقراء، وأن أهل الذمة كانوا يتولون إدارة بعض المدارس، وأن كثيراً من طلاب قرطبة كانوا من المسيحيين. ويرى أن هذه الحركة تقوم على قدر من التسامح في زمن الأمويين والعباسيين الأوائل، ويصف ترجمة المأمون لكتب بطليموس وما تبعها من علوم الفلك. يعرض ذلك بوصف المؤلف، وقد اعتمد فيه على تاريخ عام لا على دراسة تفصيلية لكل مدرسة."
  en: "Arslan's chapter describes the spread of learning beyond a narrow class in early Arab-Islamic civilisation. He reports that schools in Basra, Kufa, Baghdad, Cairo and Cordoba admitted students of different social rank, that some rulers paid living costs for poor pupils, that non-Muslim teachers sometimes ran schools, and that many students in Cordoba were Christian. He sees this openness as rooted in the tolerance of the early Umayyad and Abbasid periods, and points to al-Ma'mun's translation of Ptolemy and the astronomy that followed. This is the author's broad account, not a study of each school."
  es: "El capítulo de Arslan describe la difusión del conocimiento más allá de una clase social reducida en los inicios de la civilización árabe-islámica. Relata que las escuelas de Basora, Kufa, Bagdad, El Cairo y Córdoba admitían estudiantes de diferentes estratos sociales, que algunos gobernantes sufragaban los gastos de manutención de alumnos pobres, que en ocasiones maestros no musulmanes dirigían escuelas y que muchos estudiantes en Córdoba eran cristianos. Arslan considera que esta apertura tenía sus raíces en la tolerancia de los primeros periodos omeya y abasí, y destaca la traducción de Ptolomeo realizada por al-Ma'mun y la posterior astronomía. Este es un análisis general del autor, no un estudio de cada escuela en particular."
  fr: "Le chapitre d'Arslan décrit la diffusion du savoir au-delà d'une élite restreinte dans la civilisation arabo-islamique primitive. Il rapporte que les écoles de Bassora, Koufa, Bagdad, Le Caire et Cordoue accueillaient des élèves de tous rangs sociaux, que certains souverains prenaient en charge les frais de subsistance des élèves les plus démunis, que des enseignants non musulmans dirigeaient parfois des écoles et que de nombreux élèves à Cordoue étaient chrétiens. Il attribue cette ouverture à la tolérance des débuts des périodes omeyyade et abbasside et cite la traduction de Ptolémée par al-Ma'mun ainsi que les travaux astronomiques qui en ont découlé. Il s'agit d'un panorama général de l'auteur, et non d'une étude détaillée de chaque école."
  ur: "ارسلان کا باب ابتدائی عرب اسلامی تہذیب میں ایک تنگ طبقے سے باہر سیکھنے کے پھیلاؤ کو بیان کرتا ہے۔ وہ بتاتا ہے کہ بصرہ، کوفہ، بغداد، قاہرہ اور قرطبہ کے اسکولوں میں مختلف سماجی درجہ کے طلبہ کو داخلہ دیا جاتا تھا، بعض حکمران غریب شاگردوں کے لیے زندگی گزارنے کے اخراجات ادا کرتے تھے، بعض اوقات غیر مسلم اساتذہ اسکول چلاتے تھے، اور قرطبہ میں بہت سے طلبہ عیسائی تھے۔ وہ اس کشادگی کو ابتدائی اموی اور عباسی ادوار کی رواداری کے طور پر دیکھتا ہے، اور المامون کے بطلیموس کے ترجمہ اور اس کے بعد کے فلکیات کی طرف اشارہ کرتا ہے۔ یہ مصنف کا وسیع اکاؤنٹ ہے، ہر اسکول کا مطالعہ نہیں۔"
  tr: "Shakib Arslan, \"Arap Uygarlığında Halk Hareketi\" bölümünde, eğitimin daha önce belirli bir sınıfla sınırlı kaldıktan sonra genel halk arasında nasıl yayıldığını anlatır. Basra, Kufa, Bağdat, Kahire ve Kordoba'daki okulların farklı sınıflardan öğrencilere açık olduğunu, bazı halifelerin yoksul öğrencilere destek sağladığını, zimmilerin bazı okulları yönettiğini ve Cordoba'nın öğrencilerinin çoğunun Hristiyan olduğunu belirtir. Bu hareketin Emevi ve erken Abbasi dönemlerinde bir dereceye kadar hoşgörüye dayandığına inanır ve el-Ma'mun'un Ptolemaios'un kitaplarının biyografisini ve ardından gelen astronomi bilimlerini anlatır. Bunu yazar olarak sunar; her okulun ayrıntılı incelenmesinden ziyade genel bir tarihe dayanır."
  id: "Shakib Arslan memaparkan dalam bab \"Gerakan Populer dalam Peradaban Arab\" penyebaran pendidikan di kalangan masyarakat umum setelah sebelumnya terbatas pada kelas tertentu. Ia menyebutkan bahwa sekolah-sekolah di Basra, Kufa, Baghdad, Kairo, dan Cordoba terbuka untuk siswa dari berbagai kelas, beberapa khalifah memberikan dukungan bagi siswa miskin, dhimmi mengelola beberapa sekolah, dan banyak murid Cordoba adalah Kristen. Ia percaya bahwa gerakan ini didasarkan pada tingkat toleransi selama periode Umayyah dan awal Abbasiyah, serta menggambarkan biografi al-Ma'mun tentang buku-buku Ptolemy dan ilmu astronomi yang menyusul. Ia menyajikan ini sebagai penulis, dengan mengandalkan sejarah umum daripada studi rinci tentang masing-masing aliran."
