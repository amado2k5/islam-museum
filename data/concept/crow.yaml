summary:
  ar: "بعث الله غراباً يبحث في الأرض ليريَ قاتلَ أخيه من ابني آدم كيف يواري سوأة أخيه فقال يا ويلتى أعجزت أن أكون مثل هذا الغراب، وهو من الفواسق التي رخّص النبي في قتلها."
  en: "God sent a crow scratching the ground to show one of Adam's sons, who had killed his brother, how to hide his brother's nakedness; he cried 'Am I too weak to be like this crow?' The crow is among the vermin the Prophet permitted killing."
  ur: "اللہ نے ایک کوّے کو زمین کھودتے بھیجا تاکہ آدم کے قاتل بیٹے کو دکھائے کہ مرے ہوئے بھائی کو کیسے دفنائے؛ اس نے کہا 'کیا میں اس کوّے جیسا بھی نہ ہو سکا؟' کوّا ان مؤذیوں میں ہے جن کا قتل نبی نے جائز قرار دیا۔"
  es: "Dios envió un cuervo que escarbaba el suelo para mostrarle a uno de los hijos de Adán, que había matado a su hermano, cómo ocultar la desnudez de este; él exclamó: \"¿Acaso soy demasiado débil para ser como este cuervo?\". El cuervo se encuentra entre las alimañas que el Profeta permitió matar."
  fr: "Dieu envoya un corbeau gratter le sol pour montrer à l'un des fils d'Adam, qui avait tué son frère, comment cacher la nudité de ce dernier; il s'écria: « Suis-je trop faible pour faire comme ce corbeau ? » Le corbeau fait partie des vermines que le Prophète a autorisé à tuer."
  tr: "Allah, kardeşini Adem'in oğullarından öldüren birinin kardeşinin kötülüğünü nasıl gizleyebildiğini görmek için yeryüzünde bir karga gönderdi. Dedi ki, \"Vay halime olsun! Böyle bir karga olamam ve Peygamber'in öldürmesine izin verdiği günahkarlar arasındadır.\""
  id: "Allah mengutus seekor gagak mencari di bumi untuk melihat bagaimana pembunuh saudaranya dari anak-anak Adam dapat menyembunyikan kejahatan saudaranya. Dia berkata, \"Celakalah aku! Aku tidak mampu menjadi gagak seperti itu, dan di antara para pendosa itulah yang diizinkan Nabi untuk dibunuh.\""
