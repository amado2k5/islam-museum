summary:
  ar: "بعث الله غراباً يبحث في الأرض ليريَ قاتلَ أخيه من ابني آدم كيف يواري سوأة أخيه فقال يا ويلتى أعجزت أن أكون مثل هذا الغراب، وهو من الفواسق التي رخّص النبي في قتلها."
  en: "God sent a crow scratching the ground to show one of Adam's sons, who had killed his brother, how to hide his brother's nakedness; he cried 'Am I too weak to be like this crow?' The crow is among the vermin the Prophet permitted killing."
  ur: "اللہ نے ایک کوّے کو زمین کھودتے بھیجا تاکہ آدم کے قاتل بیٹے کو دکھائے کہ مرے ہوئے بھائی کو کیسے دفنائے؛ اس نے کہا 'کیا میں اس کوّے جیسا بھی نہ ہو سکا؟' کوّا ان مؤذیوں میں ہے جن کا قتل نبی نے جائز قرار دیا۔"
