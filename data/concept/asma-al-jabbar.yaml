  tr: "El-Cebber: Kırıkları iyileştiren ve kudretlileri gücüyle boyun eğdiren. El-Tirmidi'nin Allah'ın Güzel İsimleri hakkındaki hadislerde adı 9."
  id: "Al-Jabbar: dia yang menyembuhkan yang patah hati dan menundukkan yang perkasa dengan kuasa-Nya. Nama nomor 9 dalam daftar yang disebutkan dalam hadits Al-Tirmidhi tentang Nama-nama Indah Allah."
