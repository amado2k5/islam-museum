label: { ar: "الحجاز في أحكام الفقهاء", en: "Hijaz in the jurists' rulings", ur: "حجاز فقہاء کے احکام میں" }
summary:
  ar: "الحجاز في اللغة من الحجز، وهو الفصل بين الشيئين، وتختلف عبارات اللغويين في حدوده، فيذكر ياقوت أنه الجبل الممتد الذي يحول بين غور تهامة ونجد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6824} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6825} وعند الشافعية والحنابلة، وهم الذين قصروا حكم جزيرة العرب الوارد في الحديث على الحجاز، يشمل الحجاز مكة والمدينة واليمامة ومخاليفها، وذكر المنهاج من مدنه الطائف ووج وجدة والينبع وخيبر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6825} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6826} وأحكام الحجاز الشرعية عند الفقهاء أربعة: ألا يسكنه غير المسلمين، ولا يُدفن فيه غير المسلم، ولا يبقى فيه معبد لغير المسلمين، وأرضه زكوية لا يؤخذ منها خراج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6826} وأما ما عدا الحجاز من أرض العرب كاليمن والبحرين، فالحنفية والمالكية يرون أحاديث الباب شاملة له، والشافعية والحنابلة لا يرونه كذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6826}"
  en: "Linguistically, Hijaz comes from the root for barrier, the mountain range that separates the lowland of Tihama from Najd. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6824} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6825} For the Shafi'is and Hanbalis, who limit the Prophetic ruling on the Arabian peninsula to the Hijaz, it covers Mecca, Medina, al-Yamama and its dependencies; the Minhaj lists Ta'if, Wajh, Jedda, Yanbu' and Khaybar among its towns. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6825} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6826} The jurists count four rulings that apply to the Hijaz: no non-Muslim may settle in it, no non-Muslim may be buried in it, no place of worship for non-Muslims may stand in it, and its land pays alms (zakat) with no kharaj tax. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6826} Outside the Hijaz, the rest of the Arabian land such as Yemen and Bahrain is included in the hadith for the Hanafis and Malikis but not for the Shafi'is and Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6826}"
