label: { ar: "الحجاز في أحكام الفقهاء", en: "Hijaz in the jurists' rulings", ur: "حجاز فقہاء کے احکام میں", es: "El hiyaz en las sentencias de los juristas", fr: "Le Hedjaz dans les décisions des juristes" }
summary:
  ar: "الحجاز في اللغة من الحجز، وهو الفصل بين الشيئين، وتختلف عبارات اللغويين في حدوده، فيذكر ياقوت أنه الجبل الممتد الذي يحول بين غور تهامة ونجد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6824} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6825} وعند الشافعية والحنابلة، وهم الذين قصروا حكم جزيرة العرب الوارد في الحديث على الحجاز، يشمل الحجاز مكة والمدينة واليمامة ومخاليفها، وذكر المنهاج من مدنه الطائف ووج وجدة والينبع وخيبر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6825} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6826} وأحكام الحجاز الشرعية عند الفقهاء أربعة: ألا يسكنه غير المسلمين، ولا يُدفن فيه غير المسلم، ولا يبقى فيه معبد لغير المسلمين، وأرضه زكوية لا يؤخذ منها خراج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6826} وأما ما عدا الحجاز من أرض العرب كاليمن والبحرين، فالحنفية والمالكية يرون أحاديث الباب شاملة له، والشافعية والحنابلة لا يرونه كذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6826}"
  en: "Linguistically, Hijaz comes from the root for barrier, the mountain range that separates the lowland of Tihama from Najd. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6824} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6825} For the Shafi'is and Hanbalis, who limit the Prophetic ruling on the Arabian peninsula to the Hijaz, it covers Mecca, Medina, al-Yamama and its dependencies; the Minhaj lists Ta'if, Wajh, Jedda, Yanbu' and Khaybar among its towns. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6825} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6826} The jurists count four rulings that apply to the Hijaz: no non-Muslim may settle in it, no non-Muslim may be buried in it, no place of worship for non-Muslims may stand in it, and its land pays alms (zakat) with no kharaj tax. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6826} Outside the Hijaz, the rest of the Arabian land such as Yemen and Bahrain is included in the hadith for the Hanafis and Malikis but not for the Shafi'is and Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6826}"
  es: "Lingüísticamente, Hijaz proviene de la raíz que significa barrera, la cadena montañosa que separa la llanura de Tihama de Najd. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6824} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6825} Para los shafi'is y hanbalis, que limitan el dictamen profético en la península arábiga al Hijaz, este abarca La Meca, Medina, al-Yamama y sus dependencias; el Minhaj enumera Ta'if, Wajh, Jedda, Yanbu' y Khaybar entre sus ciudades. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6825} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6826} Los juristas enumeran cuatro normas que se aplican al Hiyaz: ningún no musulmán puede establecerse en él, ningún no musulmán puede ser enterrado en él, ningún lugar de culto para no musulmanes puede estar en él, y su tierra paga limosna (zakat) sin impuesto kharaj. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6826} Fuera del Hiyaz, el resto de la tierra árabe, como Yemen y Baréin, está incluido en el hadiz para los hanafíes y malikíes, pero no para los shafiíes y hanbalíes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6826}"
  fr: "Linguistiquement, le Hedjaz tire son nom de la racine signifiant « barrière », la chaîne de montagnes qui sépare la plaine de Tihama du Najd. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6824} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6825} Pour les écoles chaféite et hanbalite, qui limitent la portée du Prophète dans la péninsule arabique au Hedjaz, cette région englobe La Mecque, Médine, al-Yamama et ses dépendances; l’école minhaj cite Taïf, Wajh, Djeddah, Yanbu’ et Khaybar parmi ses villes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6825} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6826} Les juristes recensent quatre règles applicables au Hedjaz: aucun non-musulman ne peut s’y installer, aucun non-musulman ne peut y être enterré, aucun lieu de culte non musulman ne peut y être établi, et ses terres sont soumises à la zakat (aumône légale) sans kharaj (impôt). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6826} En dehors du Hedjaz, le reste du territoire arabe, comme le Yémen et Bahreïn, est inclus dans les hadiths pour les écoles hanafite et malikite, mais pas pour les écoles chaféite et hanbalite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6826}"
