label:
  ar: "سومقوطون"
  en: "Sumuqutun (the drug the book names sumuqutun)"
  ur: "سومقوطون"
  es: "Sumuqutun (la droga que el libro denomina sumuqutun)"
  fr: "Sumuqutun (la drogue que le livre nomme sumuqutun)"
summary:
  ar: "السومقوطون في الكتاب قيل إنه حي العالم وقيل ضرب من اللفاح، وهو نوعان صخري وغير صخري، الغالب عليه البرد واليبس وفيه لطف يقطع ولزوجة تجمع وتقبض، ولا رائحة له ولا حلاوة، ويشفي خشونة الحلق ويمنع النفث من الدم وينفع من قروح الأمعاء والسحج وأوجاع الكلية {cite:canon-ibn-sina-print-v1 p.597}."
  en: "Sumuqutun is in the book said to be the houseleek, or else a kind of mandrake, in two kinds, rocky and not rocky, with cold and dryness prevailing and a fineness that cuts and a viscosity that binds and constricts, without scent or sweetness; it heals roughness of the throat, checks spitting of blood and helps ulcers of the intestines, abrasion and pains of the kidney {cite:canon-ibn-sina-print-v1 p.597}."
  ur: "سومقوطون کتاب میں کہا گیا کہ یہ حی العالم ہے اور کہا گیا کہ لفاح کی ایک قسم ہے، اس کی دو قسمیں ہیں: پتھریلی اور غیر پتھریلی؛ اس پر سردی اور خشکی غالب ہے، اس میں لطافت ہے جو کاٹتی ہے اور لزوجت ہے جو جوڑتی اور سکیڑتی ہے، نہ بو ہے نہ مٹھاس؛ حلق کی کھردرا پن دور کرتا، خون تھوکنا روکتا اور آنتوں کے زخموں، چھلنے اور گردے کے دردوں میں مفید ہے {cite:canon-ibn-sina-print-v1 p.597}۔"
  es: "En el libro se dice que Sumuqutun es la siempreviva, o bien una especie de mandrágora, en dos tipos, rocosa y no rocosa, con predominio de frío y sequedad, y una finura que corta y una viscosidad que une y contrae, sin aroma ni dulzura; cura la aspereza de la garganta, detiene la expectoración de sangre y ayuda con las úlceras intestinales, las abrasiones y los dolores de riñón {cite:canon-ibn-sina-print-v1 p.597}."
  fr: "Le sumuqutun est décrit dans le livre comme étant la joubarbe, ou bien une sorte de mandragore, en deux sortes, rocheuse et non rocheuse, avec une prédominance de froid et de sécheresse et une finesse qui coupe et une viscosité qui lie et resserre, sans parfum ni douceur; il guérit les irritations de la gorge, arrête les crachats de sang et aide les ulcères des intestins, les abrasions et les douleurs rénales {cite:canon-ibn-sina-print-v1 p.597}."
