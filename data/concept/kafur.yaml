summary:
  ar: "الكافور أصناف تنبت شجرتها في نواحي الصين، وقد صنّفه الكتاب باردا يابسا في الثالثة، وذكر منافعه في الرعاف والحمّيات الحادة والرمد الحار وأورام الجلد."
  en: "Kafur, camphor, comes in several kinds from a tree that the book places in the regions of China. The book classes it as cold and dry in the third degree and records its uses for nosebleed, acute fevers, hot ophthalmia and hot swellings of the skin."
  ur: "کافور کئی قسموں کا ہوتا ہے، اور اس کا درخت چین کے علاقوں میں اگتا ہے۔ کتاب اسے تیسرے درجے میں ٹھنڈا اور خشک بتاتی ہے، اور نکسیر، حادّ بخاروں، گرم رمد اور جلد کے گرم ورم میں اس کے فائدے لکھتی ہے۔"
