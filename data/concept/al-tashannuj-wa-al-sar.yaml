id: "concept/al-tashannuj-wa-al-sar"
class: "concept"
kind: "scientific"
label:
  ar: "التشنج والصرع"
  en: "Convulsion and epilepsy"
  fr: "Convulsion et épilepsie"
  ur: "تشنج اور صرع"
  es: "Convulsiones y epilepsia"
  tr: "Nöbetler ve epilepsi"
  id: "Kejang dan epilepsi"
summary:
  ar: "كأن التشنج صرع عضو كما أن الصرع تشنج البدن كله، والفرق بينهما العموم والخصوص، وأن أكثر الصرع يكون بسرعة وقد يكون بأدوار وغير ذلك من فروق {cite:canon-ibn-sina-print-v2 p.143}"
  en: "Convulsion is as it were the epilepsy of a member, as epilepsy is the convulsion of the whole body; the difference between them is generality and particularity, that most epilepsy comes on swiftly and may come in turns, and other differences {cite:canon-ibn-sina-print-v2 p.143}"
  fr: "Dans le Canon, la convulsion est pour ainsi dire l’épilepsie d’un membre, de même que l’épilepsie est la convulsion du corps entier. Elles se distinguent par leur caractère local ou général, par le fait que l’épilepsie est le plus souvent soudaine et peut se manifester par accès, et par d’autres traits {cite:canon-ibn-sina-print-v2 p.143}"
  ur: "گویا تشنج کسی عضو کی صرع ہے جس طرح صرع سارے بدن کا تشنج ہے؛ اور دونوں کا فرق عموم اور خصوص کا ہے، اور یہ کہ اکثر صرع جلدی سے ہوتی ہے اور ادوار میں ہو سکتی ہے اور اس کے سوا اور فرق بھی ہیں {cite:canon-ibn-sina-print-v2 p.143}۔"
  es: "La convulsión es, por así decirlo, la epilepsia de un miembro, así como la epilepsia es la convulsión de todo el cuerpo; la diferencia entre ellas radica en la generalidad y la particularidad, en que la mayoría de las epilepsias aparecen rápidamente y pueden presentarse por turnos, y otras diferencias {cite:canon-ibn-sina-print-v2 p.143}"
  tr: "Sanki nöbet bir organın epilepsisiymiş gibi, epilepsi de tüm vücudun spazmı gibidir ve aralarındaki fark genel ve özgüldür. Çoğu epilepsi hızlı görülür ve roller ile diğer farklılıklar içerebilir {cite:canon-ibn-sina-print-v2 s.143}"
  id: "Sama seperti kejang adalah epilepsi pada suatu organ, epilepsi adalah seperti kejang seluruh tubuh, dan perbedaan di antara keduanya bersifat umum dan spesifik. Sebagian besar epilepsi dapat dilihat dengan cepat dan mungkin mencakup peran serta perbedaan lain {cite:canon-ibn-sina-print-v2 hlm.143}"
