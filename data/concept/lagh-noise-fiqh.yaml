id: concept/lagh-noise-fiqh
class: concept
kind: legal
label:
  ar: "اللَّغْط"
  en: "Noise (lagh), fiqh rulings"
  ur: "شور (لغط، فقہی احکام)"
summary:
  ar: "اللغط بسكون الغين وفتحها الأصوات المبهمة المختلطة والجلبة التي لا تُفهم؛ واللغو ما لا معنى له ولا تترتب عليه آثار، والفرق أن اللغط يُقصد معناه واللغو قد لا يُقصد {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13646}."
  en: "Lagh, in lexicon, is confused and mixed noise, a din that cannot be understood; lagw is speech without meaning or effect. The difference is that lagh has a meaning intended, while lagw may not {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13646}."
  ur: "لغط سکون اور فتحہ دونوں کے ساتھ مبہم اور ملی جلی آوازوں اور ایسے شور کو کہتے ہیں جو سمجھ میں نہ آئے؛ اور لغو وہ ہے جس کا کوئی معنی نہ ہو اور اس پر کوئی حکم مرتب نہ ہو۔ فرق یہ ہے کہ لغط میں معنی مقصود ہوتا ہے، جبکہ لغو میں مقصود نہیں بھی ہو سکتا {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13646}۔"
