label:
  ar: "اللَّغْط"
  en: "Noise (lagh), fiqh rulings"
  ur: "شور ⁦(لغط، فقہی احکام)⁩"
  es: "Ruido (lagh), decisiones de fiqh"
  fr: "Bruit (lagh), décisions fiqh"
  tr: "Kargaşa"
  id: "Kegaduhan"
summary:
  ar: "اللغط بسكون الغين وفتحها الأصوات المبهمة المختلطة والجلبة التي لا تُفهم؛ واللغو ما لا معنى له ولا تترتب عليه آثار، والفرق أن اللغط يُقصد معناه واللغو قد لا يُقصد {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13646}."
  en: "Lagh, in lexicon, is confused and mixed noise, a din that cannot be understood; lagw is speech without meaning or effect. The difference is that lagh has a meaning intended, while lagw may not {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13646}."
  ur: "لغط سکون اور فتحہ دونوں کے ساتھ مبہم اور ملی جلی آوازوں اور ایسے شور کو کہتے ہیں جو سمجھ میں نہ آئے؛ اور لغو وہ ہے جس کا کوئی معنی نہ ہو اور اس پر کوئی حکم مرتب نہ ہو۔ فرق یہ ہے کہ لغط میں معنی مقصود ہوتا ہے، جبکہ لغو میں مقصود نہیں بھی ہو سکتا {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13646}۔"
  es: "Lagh, en léxico, es ruido confuso y mezclado, un estruendo incomprensible; lagw es habla sin significado ni efecto. La diferencia radica en que lagh tiene un significado intencionado, mientras que lagw puede no tenerlo {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13646}."
  fr: "Le terme « lagh » désigne, dans le lexique, un bruit confus et indistinct, un vacarme incompréhensible; « lagw » est un discours dénué de sens et d’effet. La différence réside dans le fait que « lagh » a une signification voulue, tandis que « lagw » peut ne pas en avoir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13646}."
  tr: "al-laghu, ghin üzerine sukun ve anlaşılmayan karışık sesler ve karışık karışık seslerle fetha ile bir kelime vardır; 'laghw' ise anlamsız ve hiçbir etkisi olmayan bir şeydir. Fark şudur ki, 'laghw' anlamını ifade ederken, 'laghw' {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.13646} anlamına gelmeyebilir."
  id: "Al-laghu dengan sukun pada ghin dan fatha dengan suara campuran ambigu dan keributan yang tidak dipahami; dan 'laghw' adalah sesuatu yang tidak berarti dan tidak memiliki efek apapun. Perbedaannya adalah 'laghw' berarti maknanya, sementara 'laghw' mungkin tidak berarti {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13646}."
