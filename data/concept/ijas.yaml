label:
  ar: "الإجاص"
  en: "Ijas (plum, Prunus-type fruit)"
  ur: "آلو بخارا ⁦(الإجاص)⁩"
  es: "Ijas (ciruela, fruta tipo Prunus)"
summary:
  ar: "الإجاص، وأقواه البستي، ويُقال إن صمغه يفتّت حصاة المثانة. ويذكر الكتاب أن ماءه يدرّ الطمث، وهذا ما ورد فيه لا توصية به {cite:canon-ibn-sina-print-v1 p.369} {cite:canon-ibn-sina-print-v1 p.370}."
  en: "Ijas, the garden kind being the strongest. Its gum is said to crush bladder stone. The book states that its water brings on menses; this is the book's listing, not a recommendation {cite:canon-ibn-sina-print-v1 p.369} {cite:canon-ibn-sina-print-v1 p.370}."
  ur: "الاجاص، جس میں باغی قسم سب سے طاقتور ہے؛ کہا جاتا ہے کہ اس کا صمغ مثانے کی پتھری توڑتا ہے۔ کتاب میں لکھا ہے کہ اس کا پانی حیض جاری کرتا ہے؛ یہ کتاب کی فہرست ہے، کوئی سفارش نہیں {cite:canon-ibn-sina-print-v1 p.369} {cite:canon-ibn-sina-print-v1 p.370}۔"
  es: "Ijas, siendo la variedad de jardín la más fuerte. Se dice que su goma disuelve los cálculos de la vejiga. El libro afirma que su agua provoca la menstruación; esta es la información del libro, no una recomendación {cite:canon-ibn-sina-print-v1 p.369} {cite:canon-ibn-sina-print-v1 p.370}."
