id: concept/revival-after-death-stories
class: concept
kind: belief
label: { ar: "قصص الإحياء بعد الموت", en: "Stories of revival after death (the ruined town and Abraham's request)", ur: "موت کے بعد زندگی کے قصے" }
summary:
  ar: "يربط الشعراوي بين قصة الذي مر بقرية خاوية وقصة إبراهيم في طلب الكيفية، ويرى أن السؤال عن الكيفية دليل إيمان لا شك، وأن الله أماته مائة عام ثم بعثه، فقال لم يتغير شيء فيه، وأن الله يقبض الزمن ويبسطه في حق من يشاء، ويذكر أن جمهور العلماء يرون أن المار هو عزير {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1130} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1132} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1134} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1135}."
  en: "Sha'rawi links the story of the man who passed a ruined town with Abraham's request to be shown how God revives. He holds that asking how is a sign of faith and not doubt, that God caused the man to die for a hundred years and then revived him, and that God contracts and expands time for whom He wills. He reports that most scholars take the passer-by to be 'Uzayr {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1130} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1132} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1134} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1135}."
  ur: "شعراوی اس شخص کے قصے کو جو خالی بستی سے گزرا، اور ابراہیم کے کیفیت پوچھنے کے واقعے سے جوڑتے ہیں۔ ان کے نزدیک کیفیت کا سوال ایمان کی علامت ہے نہ کہ شک کی، اور اللہ نے اسے سو سال تک موت دے کر زندہ کیا، اور وقت کو سکیڑتا اور پھیلاتا ہے۔ وہ نقل کرتے ہیں کہ جمہور علماء اس گزرنے والے کو عزیر سمجھتے ہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1130} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1132} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1134} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1135}۔"
