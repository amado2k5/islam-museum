summary:
  ar: "خرنوب في الكتاب أصلحه الشامي المجفف، والنبطي أشد يبسا وبرودة؛ الشامي مجفف قابض وثمرته كذلك إلا أن فيها حلاوة ومع ذلك تعقل، والنبطي أشد يبسا وتجفيفا ولا يلذع ويؤكل رطبا وخلطه رديء ثقيل، وإذا دلكت الثآليل بالنبطي الفج أذهبها، والمضمضة بطبيخه جيدة لوجع الأسنان، والينبوت جيد لليرقان وللمغص والإسهال؛ وفيه نقل موسوم عن سيلان الطمث المفرط في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v1 p.710}"
  en: "Kharnub is in the book of which the most suitable is the dried Syrian, the Nabati being drier and colder; the Syrian is drying and astringent, and so is its fruit except that there is sweetness in it and yet it binds, while the Nabati is drier and more drying, does not sting, is eaten fresh and its humour is bad and heavy; the unripe Nabati rubbed on warts removes them, rinsing with its decoction is good for toothache, and the yanbut is good for jaundice, colic and diarrhoea; it has a labelled listing on excessive flow of menses in a section held for the founder's ruling {cite:canon-ibn-sina-print-v1 p.710}"
  ur: "خرنوب کتاب میں سب سے موزوں خشک شامی ہے، اور نبطی زیادہ خشک اور ٹھنڈا ہے؛ شامی خشک کرنے والا اور قابض ہے اور اس کا پھل بھی ایسا ہی ہے مگر اس میں مٹھاس ہے اور پھر بھی روکتا ہے، اور نبطی زیادہ خشک اور خشک کرنے والا ہے، چبھتا نہیں، تر کھایا جاتا ہے اور اس کی خلط بری اور بھاری ہے؛ کچے نبطی سے مسوں کو ملا جائے تو انہیں دور کرتا ہے، اس کے جوشاندے سے کلی دانت کے درد کے لیے اچھی ہے، اور ینبوت یرقان، مروڑ اور دست کے لیے اچھا ہے؛ حیض کے حد سے زیادہ بہاؤ کے بارے میں ایک موسوم نقل بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v1 p.710}۔"
  es: "Kharnub se encuentra en el libro del cual el más adecuado es el sirio seco, siendo el nabati más seco y frío; el sirio es secante y astringente, al igual que su fruto, excepto que tiene dulzura y, sin embargo, es astringente, mientras que el nabati es más seco y más secante, no pica, se come fresco y su humor es malo y pesado; el nabati inmaduro frotado sobre las verrugas las elimina, enjuagarse con su decocción es bueno para el dolor de muelas, y el yanbut es bueno para la ictericia, el cólico y la diarrea; tiene una lista etiquetada sobre el flujo menstrual excesivo en una sección reservada para el dictamen del fundador {cite:canon-ibn-sina-print-v1 p.710}"
