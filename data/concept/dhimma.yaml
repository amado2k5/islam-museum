summary:
  ar: "الذمة عند البلاذري عقد الأمان المكتوب للمصالَحين من أهل الكتاب: صيغته في كتاب النبي لنجران «ولهم ذمة الله وذمة رسوله على أنفسهم وملتهم وأرضهم وأموالهم وغائبهم وشاهدهم»، ومن شروطها عنده في صلح نجران أن لا يُفتنوا عن دينهم ومراتبهم فيه ولا يُحشروا ولا يُعشروا، وفي نص الكتاب أن لا يُفتن أسقف من أسقفيته ولا راهب من رهبانيته ولا يُغيَّر حق من حقوقهم وأمثلتهم — والأمثلة الصلبان والصور — ولا يطأ أرضهم جيش، ومن أكل منهم رباً كانت ذمة النبي منه بريئة؛ وفي كتاب أهل مقنى «لكم ذمة الله وذمة رسوله» مع الأمان والعفو عن كل دم؛ وكانت الذمة تُجدد عند الخلفاء: كتب أبو بكر لأهل نجران على نحو كتاب النبي، ووصفهم عثمان بـ«قوم لهم ذمة» حين حط عنهم مائتي حلة."
  en: "Dhimma in al-Baladhuri is the written covenant of security granted to treaty peoples of the Book: its formula in the Prophet's letter to Najran runs 'they have God's protection and the protection of His messenger over their persons, religion, lands, wealth, absent and present', and its stipulated terms in the Najran peace include that they not be seduced from their religion or its ranks, nor levied nor tithed, and in the letter's text that no bishop be removed from his bishopric, no monk from his monasticism, no right of theirs or their images — crucifixes and icons — be altered, and no army tread their land, while whoever of them took usury the Prophet's protection was quit of him; the letter of the people of Maqna grants 'God's protection and His messenger's' with security and pardon for every blood; and the dhimma was renewed under the caliphs — Abu Bakr wrote to the people of Najran on the model of the Prophet's letter, and Uthman called them 'a people who have a dhimma' when he remitted two hundred of their hullas."
  es: "Dhimma en al-Baladhuri es el pacto escrito de seguridad otorgado a los pueblos del Libro mediante tratado: su fórmula en la carta del Profeta a Najran dice: \"tienen la protección de Dios y la protección de Su mensajero sobre sus personas, religión, tierras, riquezas, ausentes y presentes\", y sus términos estipulados en la paz de Najran incluyen que no sean seducidos de su religión o sus filas, ni recaudados ni diezmados, y en el texto de la carta que ningún obispo sea destituido de su obispado, ningún monje de su monacato, ningún derecho suyo o sus imágenes —crucifijos e iconos— sea alterado, y ningún ejército pise su tierra, mientras que quien de ellos tomara usura, la protección del Profeta sería retirada de él; la carta de la gente de Maqna otorga \"la protección de Dios y de Su mensajero\" con seguridad y perdón por cada sangre; y la dhimma fue renovada bajo los califas: Abu Bakr escribió a la gente de Najran siguiendo el modelo de la carta del Profeta, y Uthman los llamó \"un pueblo que tiene una dhimma\" cuando les condonó doscientas de sus hullas."
  fr: "La dhimma, selon al-Baladhuri, est l'alliance écrite de sécurité accordée aux peuples du Livre signataires d'un traité: sa formule dans la lettre du Prophète à Najran est la suivante: « Ils ont la protection de Dieu et la protection de Son messager sur leurs personnes, leur religion, leurs terres, leurs biens, qu'ils soient présents ou absents ». Les conditions stipulées dans le traité de Najran incluent l'interdiction de les détourner de leur religion ou de leurs rangs, de les soumettre à des prélèvements ou à la dîme, et, dans le texte de la lettre, qu'aucun évêque ne soit destitué de son évêché, aucun moine de son monachisme, qu'aucun de leurs droits ni de leurs images — crucifix et icônes — ne soit altéré, et qu'aucune armée ne foule leur terre. Quiconque parmi eux avait recours à l'usure était déchu de la protection du Prophète. La lettre des habitants de Maqna accorde « la protection de Dieu et celle de Son messager » avec sécurité et pardon pour chaque sang versé. et la dhimma fut renouvelée sous les califes — Abu Bakr écrivit aux habitants de Najran sur le modèle de la lettre du Prophète, et Uthman les appela « un peuple qui a une dhimma » lorsqu'il leur remit deux cents de leurs hullas."
  ur: "البلادوری میں ذمّہ سلامتی کا تحریری عہد ہے جو اہل کتاب کو دیا گیا ہے: نجران کے پیغمبر کے خط میں اس کا فارمولہ یہ چلتا ہے کہ 'ان کو اپنے افراد، مذہب، زمین، مال، غائب اور حاضر پر خدا کی حفاظت اور اس کے رسول کی حفاظت حاصل ہے'، اور نجران میں اس کی جو شرائط طے کی گئی ہیں وہ ان کے مذہب میں شامل نہیں ہیں یا ان کے مذہب میں شامل نہیں ہیں۔ نہ ہی لگائی گئی اور نہ ہی دسواں، اور خط کے متن میں ہے کہ کسی بشپ کو اس کے بشپ سے نہیں ہٹایا جائے گا، کسی راہب کو اس کی رہبانیت سے نہیں ہٹایا جائے گا، ان کے یا ان کی تصویروں کا کوئی حق نہیں - مصلوب اور شبیہیں - کو تبدیل نہیں کیا جائے گا، اور کوئی فوج ان کی زمین پر نہ چلے گی، جب کہ ان میں سے جس نے بھی سود لیا اس سے پیغمبر کی حفاظت چھوڑ دی گئی۔ اہل مکنا کا خط ہر خون کی حفاظت اور معافی کے ساتھ 'خدا اور اس کے رسول' کی حفاظت کرتا ہے۔ اور خلفاء کے دور میں ذم کی تجدید ہوئی - ابوبکر نے نجران کے لوگوں کو پیغمبر کے خط کے نمونے پر لکھا، اور عثمان نے ان کے دو سو حلوں کو معاف کرنے پر انہیں 'ذمہ والے لوگ' کہا۔"
  tr: "El-Baladhuri'ye göre, Kitap Ahli arasında barışanlar için yazılmış olan güvenlik antlaşması: Peygamber'in Necran kitabındaki ifade: 'Allah ve Elçi'nin sorumluluğu kendilerin, dinlerinin, topraklarının, servetlerinin, yokluklarının ve şahitlerinin üzerindedir.' Necran Barı'nda onun görüşüne göre şartlardan biri, dinleri ve rütbeleri tarafından ayartılmamaları, toplanmamaları ve ondalık vergileri olmalarıdır. Kitabın metni, piskoposluğundan hiçbir piskoposun ya da manastır tarikatından bir keşişin ayartılmamalı, hakları ve örneklerinin — haç ve heykel gibi — bir ordu tarafından ayartılmaması ve aralarından kimsenin tefecilikle yozlaştırılmaması gerektiğini belirtir. Peygamber'in sorumluluğu onun masum bir yeriydi; Muqna halkının kitabında \"Allah'ın koruması ve Elçisinin sorumluluğu sizdedir,\" tüm kanlar için güvenlik ve bağışlanma ile; ve halifeler arasında antlaşma yenilendi: Ebu Bekir, Peygamber'in kitabı gibi Necran halkına yazdı ve Osman, onlardan iki yüz giysi çıkardığında onları \"ahdi olan bir halk\" olarak tanımladı."
  id: "Menurut Al-Baladhuri, perjanjian keselamatan yang ditulis untuk mereka yang berdamai di antara umat Kitab: Kata-katanya dalam kitab Nabi kepada Najran: 'Dan mereka akan memikul tanggung jawab Allah dan Rasul-Nya atas diri mereka sendiri, agama mereka, tanah mereka, harta mereka, ketidakhadiran mereka, dan saksi mereka.' Di antara syarat-syaratnya dalam Perdamaian Najran adalah mereka tidak boleh digoda oleh agama dan pangkat mereka di dalamnya, juga tidak boleh dikumpulkan atau membayar persepuluhan. Teks kitab ini menyatakan bahwa tidak ada uskup dari keuskupannya atau biksu dari tarekat monastiknya yang boleh digoda, dan hak dan teladan mereka—seperti salib dan gambar—tidak boleh digoda oleh tentara, dan tidak ada seorang pun di antara mereka yang boleh dirusak oleh riba. Tanggung jawab Nabi tidak bersalah darinya; dalam kitab umat Muqna, \"Kamu memiliki perlindungan Allah dan tanggung jawab Rasul-Nya,\" dengan keselamatan dan pengampunan untuk semua darah; dan perjanjian diperbarui di antara para khalifah: Abu Bakr menulis kepada rakyat Najran dengan cara kitab Nabi, dan Uthman menggambarkan mereka sebagai \"umat dengan perjanjian\" ketika dia melepas dua ratus pakaian dari mereka."
