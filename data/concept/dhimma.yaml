label:
  ar: الذمة
  en: Dhimma (the covenant of protection)
summary:
  ar: "الذمة عند البلاذري عقد الأمان المكتوب للمصالَحين من أهل الكتاب: صيغته في كتاب النبي لنجران «ولهم ذمة الله وذمة رسوله على أنفسهم وملتهم وأرضهم وأموالهم وغائبهم وشاهدهم»، ومن شروطها عنده في صلح نجران أن لا يُفتنوا عن دينهم ومراتبهم فيه ولا يُحشروا ولا يُعشروا، وفي نص الكتاب أن لا يُفتن أسقف من أسقفيته ولا راهب من رهبانيته ولا يُغيَّر حق من حقوقهم وأمثلتهم — والأمثلة الصلبان والصور — ولا يطأ أرضهم جيش، ومن أكل منهم رباً كانت ذمة النبي منه بريئة؛ وفي كتاب أهل مقنى «لكم ذمة الله وذمة رسوله» مع الأمان والعفو عن كل دم؛ وكانت الذمة تُجدد عند الخلفاء: كتب أبو بكر لأهل نجران على نحو كتاب النبي، ووصفهم عثمان بـ«قوم لهم ذمة» حين حط عنهم مائتي حلة."
  en: "Dhimma in al-Baladhuri is the written covenant of security granted to treaty peoples of the Book: its formula in the Prophet's letter to Najran runs 'they have God's protection and the protection of His messenger over their persons, religion, lands, wealth, absent and present', and its stipulated terms in the Najran peace include that they not be seduced from their religion or its ranks, nor levied nor tithed, and in the letter's text that no bishop be removed from his bishopric, no monk from his monasticism, no right of theirs or their images — crucifixes and icons — be altered, and no army tread their land, while whoever of them took usury the Prophet's protection was quit of him; the letter of the people of Maqna grants 'God's protection and His messenger's' with security and pardon for every blood; and the dhimma was renewed under the caliphs — Abu Bakr wrote to the people of Najran on the model of the Prophet's letter, and Uthman called them 'a people who have a dhimma' when he remitted two hundred of their hullas."
