id: concept/shurut-al-qiraa-al-sahiha
class: concept
kind: doctrine
label:
  ar: شروط القراءة الصحيحة
  en: The conditions of an accepted reading
  ur: صحیح قراءت کی شرطیں
  es: "Las condiciones de una lectura aceptada"
  fr: "Les conditions d'une lecture acceptée"
  tr: "Doğru okuma koşulları"
  id: "Kondisi membaca yang benar"
summary:
  ar: "ضبط ابن الجزري القراءة المقبولة بثلاثة أركان: موافقة العربية ولو بوجه، وموافقة أحد المصاحف العثمانية ولو احتمالاً، وصحة السند؛ ومتى اختل ركن منها فالقراءة ضعيفة أو شاذة ولو جاءت عن أحد السبعة {cite:nashr-dahman-damascus-1345-v1 p. 19} {cite:itqan-suyuti p. 491}."
  en: "Ibn al-Jazari fixed the accepted reading by three pillars: agreement with Arabic in at least one way, agreement with one of the Uthmanic codices even potentially, and a sound chain; where one pillar fails the reading is weak or irregular, even if it comes from one of the seven {cite:nashr-dahman-damascus-1345-v1 p. 19} {cite:itqan-suyuti p. 491}."
  ur: "ابن الجزری نے مقبول قراءت کو تین ارکان سے باندھا: کسی ایک وجہ سے عربی کی موافقت، عثمانی مصاحف میں سے کسی کی احتمالاً موافقت، اور صحتِ سند؛ جہاں کوئی رکن ٹوٹے وہاں قراءت ضعیف یا شاذ ہے خواہ سبعہ میں سے کسی سے آئی ہو {cite:nashr-dahman-damascus-1345-v1 p. 19} {cite:itqan-suyuti p. 491}۔"
  es: "Ibn al-Jazari fijó la lectura aceptada mediante tres pilares: concordancia con el árabe en al menos un sentido, concordancia con uno de los códices utmánicos, incluso potencialmente, y una cadena sólida; donde falla un pilar, la lectura es débil o irregular, incluso si proviene de uno de los siete {cite:nashr-dahman-damascus-1345-v1 p. 19} {cite:itqan-suyuti p. 491}."
  fr: "Ibn al-Jazari a fixé la lecture acceptée en se basant sur trois piliers: l'accord avec l'arabe d'au moins une manière, l'accord avec l'un des codex uthmaniens même potentiellement, et une chaîne de transmission solide; lorsqu'un pilier fait défaut, la lecture est faible ou irrégulière, même si elle provient de l'un des sept {cite:nashr-dahman-damascus-1345-v1 p. 19} {cite:itqan-suyuti p. 491}."
  tr: "İbn al-Jazari kabul edilen okumayı üç temel olarak sınıflandırır: Arapça ile bir şekilde uyumlu olmak, mümkünse Osmanlı Kur'anlarından biriyle uyumlu olmak ve zincirin özgünlüğü; ve eğer herhangi bir kısmı eksikse, yedi {cite:nashr-dahman-damascus-1345-v1 s. 19} {cite:itqan-suyuti, s. 491} {cite:itqan-suyuti, s. 491}"
  id: "Ibn al-Jazari mengklasifikasikan bacaan yang diterima ini dengan tiga pilar: setuju dengan bahasa Arab meskipun dalam beberapa hal, setuju dengan salah satu Al-Qur'an Ottoman meskipun mungkin, dan keaslian rantai tersebut; dan jika ada bagian yang tidak lengkap, bacaan itu lemah atau tidak biasa meskipun berasal dari salah satu dari tujuh {cite:nashr-dahman-damascus-1345-v1 hlm. 19} {cite:itqan-suyuti, hlm. 491}."
