id: concept/qaranitus-al-sarsam-al-harr
class: concept
kind: scientific
label:
  ar: "قرانيطس وهو السرسام الحار"
  en: "Qaranitus, the hot sarsam"
  ur: "قرانیطس یعنی گرم سرسام"
  es: "Qaranitus, el sarsam caliente"
  fr: "Qaranitus, le sarsam chaud"
  tr: "Kuranitler, ateşli ressam"
  id: "Quranites, pelukis panas"
summary:
  ar: "يعرّف ابن سينا قرانيطس بأنه الورم الحار في حجاب الدماغ دون جرمه ويردّ قول من زعم أن الدماغ لا يرم، ويبيّن أصل الاسم وأن السرسام والبرسام لفظان فارسيان وتشارك الاسم في معان، ويذكر مواضع الورم ومبدأه من الدم أو الصفراء؛ وفيه سطر موسوم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v2 p.76}"
  en: "Ibn Sina defines qaranitus as the hot swelling of the membrane of the brain apart from its substance, answers those who claimed the brain cannot swell, explains where the name comes from and that sarsam and birsam are Persian words whose name is shared by several things, and gives the places of the swelling and its start from blood or bile; the record has a labelled line in a section held for the founder's ruling {cite:canon-ibn-sina-print-v2 p.76}"
  ur: "ابن سینا قرانیطس کو دماغ کی جھلی کی گرم سوجن بتاتا ہے جو اس کے جوہر کے سوا ہوتی ہے، اس کا رد کرتا ہے جو کہتا تھا کہ دماغ میں سوجن نہیں آتی، نام کا ماخذ بتاتا ہے اور یہ کہ سرسام اور برسام فارسی الفاظ ہیں اور نام کئی چیزوں میں مشترک ہے، اور سوجن کے مقامات اور اس کا آغاز خون یا صفراء سے بتاتا ہے؛ اس میں ایک موسوم سطر بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v2 p.76}۔"
  es: "Ibn Sina define qaranitus como la inflamación caliente de la membrana cerebral, separada de su sustancia; responde a quienes afirmaban que el cerebro no puede inflamarse; explica el origen del nombre y que sarsam y birsam son palabras persas que comparten nombre con varias cosas; y describe los lugares donde se produce la inflamación y su origen en la sangre o la bilis. El registro incluye una línea etiquetada en una sección reservada para la decisión del fundador {cite:canon-ibn-sina-print-v2 p.76}."
  fr: "Ibn Sina définit le qaranitus comme le gonflement chaud des membranes du cerveau, indépendamment de sa substance. Il répond à ceux qui affirmaient que le cerveau ne pouvait pas gonfler, explique l'origine du nom et précise que sarsam et birsam sont des mots persans désignant plusieurs choses. Il indique également la localisation du gonflement et son origine: le sang ou la bile. Le texte comporte une ligne annotée dans une section réservée à la décision du fondateur {cite:canon-ibn-sina-print-v2 p.76}."
  tr: "İbn Sina, Qaranlıları beyin diyaframında kütlesi olmayan sıcak tümör olarak tanımlar. Beynin ateş etmediği iddiasını çürütür, ismin kökenini açıklar ve 'sarsam' ile 'barsam'ın Farsça terimler olduğunu ve aynı anlamaları paylaştığını belirtir. Tümörün yerlerini ve kan veya safra kökenini belirtir; kurucunun kuralı hakkında bir bölümde işaretlenmiş bir satır yer alır {cite:canon-ibn-sina-print-v2 s.76}"
  id: "Ibn Sina mendefinisikan Qaranite sebagai tumor panas di diafragma otak tanpa massanya. Ia membantah klaim bahwa otak tidak menembak, memperjelas asal-usul nama tersebut, dan menyatakan bahwa 'sarsam' dan 'barsam' adalah istilah Persia yang memiliki makna yang sama. Ia menyebutkan lokasi tumor dan asalnya dari darah atau empedu; terdapat baris yang ditandai dalam bagian tentang aturan pendiri {cite:canon-ibn-sina-print-v2 hlm.76}"
