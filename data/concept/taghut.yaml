id: concept/taghut
class: concept
kind: belief
label: { ar: "الطاغوت", en: "Taghut (every object of wrongful obedience)", ur: "طاغوت", es: "Taghut (todo objeto de obediencia indebida)", fr: "Taghut (tout objet d'obéissance injustifiée)", tr: "Tiran", id: "Tiran" }
summary:
  ar: "يعرف الشعراوي الطاغوت بأنه مبالغة في الطغيان، ويعدّ من صوره الشيطان، والكهان الذين يشرعون باسم الدين للسلطة، والسحرة والدجالين، والحاكم الذي يحكم بغير أمر الله، ويرى أن الطاغوت هو من تزيده الطاعة طغياناً {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1115} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1116} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1120}."
  en: "Sha'rawi defines taghut as an intensive form of tyranny. Its forms include Satan, clerics who legislate in religion's name for worldly power, sorcerers and charlatans, and a ruler who rules without God's command. He holds that taghut is the one whom obedience makes more tyrannical {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1115} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1116} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1120}."
  ur: "شعراوی طاغوت کو طغیان کی مبالغہ آمیز شکل قرار دیتے ہیں۔ اس کی صورتوں میں شیطان، وہ کاہن جو دین کے نام پر اقتدار کے لیے قانون بناتے ہیں، جادوگر اور دھوکے باز، اور وہ حاکم جو اللہ کے حکم کے بغیر حکومت کرے شامل ہیں۔ ان کے نزدیک طاغوت وہ ہے جس کی اطاعت اسے اور سرکش بنا دے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1115} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1116} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1120}۔"
  es: "Sha'rawi define taghut como una forma intensiva de tiranía. Sus formas incluyen a Satanás, clérigos que legislan en nombre de la religión para obtener poder mundano, hechiceros y charlatanes, y un gobernante que gobierna sin el mandato de Dios. Sostiene que taghut es aquel a quien la obediencia vuelve más tiránico {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1115} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1116} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1120}."
  fr: "Sha'rawi définit le taghut comme une forme intense de tyrannie. Parmi ses manifestations figurent Satan, les religieux qui légifèrent au nom de la religion pour asseoir leur pouvoir temporel, les sorciers et les charlatans, ainsi que le dirigeant qui gouverne sans l'aval de Dieu. Il soutient que le taghut est celui que l'obéissance rend plus tyrannique {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1115} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1116} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1120}."
  tr: "Al-Shaarawi, taghut'u zulümde bir abartı olarak tanımlar ve onun biçimlerini Şeytan, din adına otoriteyi meşrulaştıran kahinler, büyücüler ve sahtekarlar ile Tanrı'nın emri olmadan yöneten yöneticileri içerir. O, zorbaların itaatin zorbalıkta arttığına inanır {cite:tafsir-sharawi-khawatir-scan-vol-2 s.1115} {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1116} {cite:tafsir-sharawi-khawatir-scan-vol-2 s.1120}."
  id: "Al-Shaarawi mendefinisikan taghut sebagai pembesaran dalam tirani, dan mencakup bentuknya Setan, peramal yang melegitimasi otoritas atas nama agama, penyihir dan penipu, serta penguasa yang memerintah tanpa perintah Tuhan. Ia percaya bahwa tiran adalah mereka yang ketaatannya semakin parah dalam tirani {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1115} {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1116} {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1120} {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1120}."
