id: concept/taghut
class: concept
kind: belief
label: { ar: "الطاغوت", en: "Taghut (every object of wrongful obedience)", ur: "طاغوت" }
summary:
  ar: "يعرف الشعراوي الطاغوت بأنه مبالغة في الطغيان، ويعدّ من صوره الشيطان، والكهان الذين يشرعون باسم الدين للسلطة، والسحرة والدجالين، والحاكم الذي يحكم بغير أمر الله، ويرى أن الطاغوت هو من تزيده الطاعة طغياناً {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1115} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1116} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1120}."
  en: "Sha'rawi defines taghut as an intensive form of tyranny. Its forms include Satan, clerics who legislate in religion's name for worldly power, sorcerers and charlatans, and a ruler who rules without God's command. He holds that taghut is the one whom obedience makes more tyrannical {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1115} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1116} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1120}."
  ur: "شعراوی طاغوت کو طغیان کی مبالغہ آمیز شکل قرار دیتے ہیں۔ اس کی صورتوں میں شیطان، وہ کاہن جو دین کے نام پر اقتدار کے لیے قانون بناتے ہیں، جادوگر اور دھوکے باز، اور وہ حاکم جو اللہ کے حکم کے بغیر حکومت کرے شامل ہیں۔ ان کے نزدیک طاغوت وہ ہے جس کی اطاعت اسے اور سرکش بنا دے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1115} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1116} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1120}۔"
