label: { ar: "الغول والغيلان", en: "The ghul" }
summary:
  ar: "يزعم العرب أن الغول يتغول لهم في الخلوات ويظهر لهم في أنواع الصور فيخاطبونه وربما ضيفوه، ورجلاه رجلا عنز، وكانوا إذا اعترضتهم الغول في الفيافي يرتجزون يا رجل عنز انهق نهيقا لن نترك السبسب والطريقا فتشرد عنهم في بطون الأودية، وذكر جماعة من الصحابة منهم عمر بن الخطاب أنه شاهد ذلك في بعض أسفاره إلى الشام قبل الإسلام وأن الغول كانت تتغول له فضربها بسيفه، وحكى بعض المتفلسفين أنها حيوان شاذ مشوه لم تحكمه الطبيعة، وذهبت طائفة من الهند إلى أنها تماثيل وأشخاص يظهرها طلوع الكواكب الثمانية والأربعون المعروفة بحامل رأس الغول وذكرها بطليموس وأبو معشر في المدخل الكبير، وفرق العرب بين السعلاة والغول، وجعلوا القطرب والغدار أنواعاً متشيطنة تظهر بأكناف اليمن والتهائم وأعالي صعيد مصر، وروى أهل التواريخ أن الجان حملت فباضت إحدى وثلاثين بيضة تفلقت عن القطربة أم القطارب وهي على صورة الهرة وعن الأبالسة منهم الحارث أبو مرة مسكنهم البحور وعن المردة مسكنهم الجزائر وعن الغيلان مسكنهم الخلوات وعن السعالي سكنوا الحمامات والمزابل وعن الهوام حيات ذوات أجنحة في الهواء {cite:muruj-al-dhahab p. 469-472}."
  en: "The desert ghul — goat-legged, appearing to travellers in lonely places; Arabs kept to the track chanting the goat-foot rajaz until it fled to the wadis. Umar is said to have struck one with his sword before Islam. Naturalist readings made it a deformed beast; a Hindu-astral theory made it the 48 stars 'bearing the ghul's head' (Ptolemy, Abu Ma'shar's Great Introduction). Distinct from the sa'la'at; the qutrub and ghaddar haunt Yemen and Upper Egypt; and the egg-genealogy of the jinn assigns them and the marada, abalisa and hawam their dwelling-places {cite:muruj-al-dhahab p. 469-472}."
