label: { ar: "الغول والغيلان", en: "The ghul", es: "El ghul", fr: "Le goule", ur: "غل", tr: "Ghoul ve ghoul'lar", id: "Ghoul dan hantu" }
summary:
  ar: "يزعم العرب أن الغول يتغول لهم في الخلوات ويظهر لهم في أنواع الصور فيخاطبونه وربما ضيفوه، ورجلاه رجلا عنز، وكانوا إذا اعترضتهم الغول في الفيافي يرتجزون يا رجل عنز انهق نهيقا لن نترك السبسب والطريقا فتشرد عنهم في بطون الأودية، وذكر جماعة من الصحابة منهم عمر بن الخطاب أنه شاهد ذلك في بعض أسفاره إلى الشام قبل الإسلام وأن الغول كانت تتغول له فضربها بسيفه، وحكى بعض المتفلسفين أنها حيوان شاذ مشوه لم تحكمه الطبيعة، وذهبت طائفة من الهند إلى أنها تماثيل وأشخاص يظهرها طلوع الكواكب الثمانية والأربعون المعروفة بحامل رأس الغول وذكرها بطليموس وأبو معشر في المدخل الكبير، وفرق العرب بين السعلاة والغول، وجعلوا القطرب والغدار أنواعاً متشيطنة تظهر بأكناف اليمن والتهائم وأعالي صعيد مصر، وروى أهل التواريخ أن الجان حملت فباضت إحدى وثلاثين بيضة تفلقت عن القطربة أم القطارب وهي على صورة الهرة وعن الأبالسة منهم الحارث أبو مرة مسكنهم البحور وعن المردة مسكنهم الجزائر وعن الغيلان مسكنهم الخلوات وعن السعالي سكنوا الحمامات والمزابل وعن الهوام حيات ذوات أجنحة في الهواء {cite:muruj-al-dhahab p. 469-472}."
  en: "The desert ghul — goat-legged, appearing to travellers in lonely places; Arabs kept to the track chanting the goat-foot rajaz until it fled to the wadis. Umar is said to have struck one with his sword before Islam. Naturalist readings made it a deformed beast; a Hindu-astral theory made it the 48 stars 'bearing the ghul's head' (Ptolemy, Abu Ma'shar's Great Introduction). Distinct from the sa'la'at; the qutrub and ghaddar haunt Yemen and Upper Egypt; and the egg-genealogy of the jinn assigns them and the marada, abalisa and hawam their dwelling-places {cite:muruj-al-dhahab p. 469-472}."
  es: "El ghul del desierto, con patas de cabra, se aparece a los viajeros en lugares solitarios; los árabes siguieron el rastro cantando el rajaz de las patas de cabra hasta que huyó a los uadis. Se dice que Umar lo golpeó con su espada antes del Islam. Las lecturas naturalistas lo describían como una bestia deforme; una teoría hindú-astral lo identificaba con las 48 estrellas que \"llevan la cabeza del ghul\" (Ptolomeo, Gran Introducción de Abu Ma'shar). Distinto del sa'la'at, el qutrub y el ghaddar habitan Yemen y el Alto Egipto; y la genealogía de los jinn les asigna, junto con el marada, el abalisa y el hawam, sus moradas {cite:muruj-al-dhahab p. 469-472}."
  fr: "Le ghul du désert, à pattes de chèvre, apparaissait aux voyageurs dans les lieux isolés. Les Arabes suivaient les sentiers en scandant « rajaz aux pieds de chèvre » jusqu'à ce qu'il s'enfuie vers les oueds. On raconte qu'Umar en aurait frappé un de son épée avant l'avènement de l'islam. Les interprétations naturalistes le décrivaient comme une bête difforme; une théorie astrale hindoue l'identifiait aux 48 étoiles « portant la tête du ghul » (Ptolémée, Grande Introduction d'Abu Ma'shar). Distincts des sa'la'at, les qutrub et les ghaddar hantent le Yémen et la Haute-Égypte; la généalogie des œufs des djinns leur attribue, ainsi qu'aux marada, abalisa et hawam, leurs demeures (voir: Muruj-al-Dhahab, p. 469-472)."
  ur: "صحرائی غل — بکری کی ٹانگوں والا، تنہا جگہوں پر مسافروں کو دکھائی دیتا ہے۔ عرب بکرے کے قدموں کے رجز کا نعرہ لگاتے ہوئے اس وقت تک ٹریک پر رہے جب تک کہ وہ وادیوں کی طرف بھاگ نہ گیا۔ کہا جاتا ہے کہ عمر نے اسلام سے پہلے اپنی تلوار سے ایک کو مارا تھا۔ نیچرلسٹ ریڈنگ نے اسے ایک بگڑا ہوا حیوان بنا دیا۔ ایک ہندو فلکیاتی نظریہ نے اسے 48 ستارے بنا دیا جو 'غل کے سر پر ہیں' ⁦(بطلیموس، ابو معشر کا عظیم تعارف)⁩۔ صلاۃ سے ممتاز؛ قطب اور غدر یمن اور بالائی مصر کا شکار ہیں۔ اور جنوں کا شجرہ نسب انہیں اور مردہ، ابلیسہ اور حوام کو ان کی رہائش گاہیں متعین کرتا ہے۔ 469-472}۔"
  tr: "Araplar, gulyabaniyenin yalnızlıklarında dolaşıp çeşitli şekillerde göründüğünü, bu yüzden ona hitap ettiklerini ve belki de onu ağırladıklarını, bacaklarının keçi gibi olduğunu iddia ederler. Gulyabani onları çölde gördüğünde, 'Ey keçi adam, ulu, yolları ve yolu terk etmeyeceğiz' derlerdi, böylece vadilerde onlardan uzaklaşırdı. Bir grup yoldaş, aralarında Ömer bin el-Hattab'ın da bulunduğu bir grup, İslam'dan önce Levant'a yaptığı bazı yolculuklarda bunu gördüğünü ve gulyabaniyenin ona saldırdığını, bu yüzden kılıcıyla vurduğunu söylediler. Bazı filozoflar onun doğanın kontrolü altında olmayan, sapkın ve şekilsiz bir hayvan olduğunu söylerdi, Hindistan'dan bir grup, bunların, Ptolemy ve Abu Ma'shar tarafından Büyük Giriş'te bahsedilen, Ghul'un başının taşıyıcısı olarak bilinen kırk sekiz gezegenin yükselişiyle tasvir edilen heykeller ve figürler olduğuna inanıyordu. Araplar, öksürük ile gulyabani arasında ayrım yaparak Qutrab ve Ghadar şeytani türlerinin Yemen'in dış mahallelerinde, Al-Tahim'de ve yukarı Yukarı Mısır'da ortaya çıkmasına neden oldu. Tarihçiler, cinlerin Katarbah veya Qattarib'den çıkan ve bir kediye benzeyen otuz bir yumurta bıraktığını anlatır. Şeytanlar arasında Al-Harith Abu Murrah, ikametgahı Al-Bahur, Al-Marda civarı, ikametgahları Cezayir, Al-Ghaylan ise ikametgahları vardı Inzivalar ve Sa'li arasında hamamlar ve çöplüklerde yaşar, vahşi hayvanlar arasında ise havada kanatları olan yaratıklar bulunurdu {cite:muruj-al-dhahab, s. 469-472}."
  id: "Orang Arab mengklaim bahwa ghoul akan berkeliaran di kesendirian mereka dan muncul dalam berbagai bentuk, sehingga mereka berbicara dan mungkin menjadi tuan rumah, dan kakinya seperti kambing. Ketika ghoul bertemu mereka di padang gurun, mereka berkata, 'Wahai manusia kambing, teriaklah, kami tidak akan meninggalkan jalan dan jalan,' sehingga ghoul itu akan menjauh dari mereka di lembah. Sekelompok teman, termasuk Umar ibn al-Khattab, menyebutkan bahwa ia menyaksikan hal ini selama beberapa perjalanannya ke Levant sebelum Islam, dan bahwa ghoul itu akan menyerangnya, sehingga ia memukulnya dengan pedangnya. Beberapa filsuf mengatakan itu adalah hewan menyimpang dan cacat yang tidak dikendalikan oleh alam, Sekelompok orang dari India percaya bahwa mereka adalah patung dan sosok yang digambarkan oleh kebangkitan empat puluh delapan planet yang dikenal sebagai pembawa kepala Ghul, yang disebutkan oleh Ptolemy dan Abu Ma'shar dalam Grand Entrance. Orang Arab membedakan antara batuk dan hantu, sehingga tipe iblis Qutrab dan Ghadar muncul di pinggiran Yaman, Al-Tahim, dan Mesir Hulu bagian atas. Sejarawan menceritakan bahwa jin mengandung dan bertelur tiga puluh satu yang menetas dari Qatarbah atau Qattarib, menyerupai kucing. Di antara iblis itu adalah Al-Harith Abu Murrah, yang tempat tinggalnya di Al-Bahur, sekitar Al-Marda, tempat tinggal mereka di Aljazair, dan sekitar Al-Ghaylan tempat tinggal mereka Tempat peristirahatan, dan di antara suku Sa'li, mereka mendiami pemandian dan tempat pembuangan, dan di antara binatang liar terdapat makhluk dengan sayap di udara {cite:muruj-al-dhahab, hlm. 469-472}."
