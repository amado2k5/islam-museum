summary:
  ar: "العنبر في الكتاب مما يظن أنه نبع عين في البحر، ويرد قول من قال إنه زبد البحر أو روث دابة، وينقل خبر ثقة وجده على ساحل البحر، أجوده الأشهب القوي ثم الأزرق ثم الأصفر وأردؤه الأسود، حار يابس، ينفع المشايخ بلطف تسخينه وينفع الدماغ والحواس والقلب جداً {cite:canon-ibn-sina-print-v1 p.613}"
  en: "Anbar is in the book thought to be a spring in the sea, the book setting aside the saying that it is sea foam or the dung of an animal, and relating the report of a trusted man who found it on a sea shore; the best is the ash-grey and strong, then the blue, then the yellow, and the worst the black; hot and dry, it benefits the old by its gentle warming and greatly benefits the brain, the senses and the heart {cite:canon-ibn-sina-print-v1 p.613}"
  fr: "Dans le livre, l’anbar passe pour une source jaillissant dans la mer. L’auteur écarte l’idée qu’il s’agisse d’écume ou d’excréments d’un animal et rapporte le témoignage d’un homme digne de confiance qui en a trouvé sur le rivage. Le meilleur est gris cendré et fort ; viennent ensuite le bleu, puis le jaune, le noir étant le moins bon. Chaud et sec, il serait bénéfique aux personnes âgées par la douceur de sa chaleur et ferait grand bien au cerveau, aux sens et au cœur {cite:canon-ibn-sina-print-v1 p.613}"
  ur: "عنبر کتاب میں سمجھا جاتا ہے کہ سمندر میں ایک چشمے کا ابال ہے، اور کتاب اس قول کو بعید سمجھتی ہے کہ یہ سمندر کی جھاگ یا کسی جانور کی لید ہے، اور ایک ثقہ شخص کی خبر نقل کرتی ہے جس نے اسے سمندر کے ساحل پر پایا؛ بہترین راکھ جیسا مضبوط ہے پھر نیلا پھر زرد اور سب سے ناقص سیاہ؛ گرم خشک ہے، بوڑھوں کو اپنی نرم گرمی سے فائدہ دیتا ہے اور دماغ، حواس اور دل کو بہت فائدہ دیتا ہے {cite:canon-ibn-sina-print-v1 p.613}۔"
