issue:
  ar: "هل يورَث الأنبياء مالهم، وكيف يوفَّق بين حديث «لا نورث» وآيتي ميراث سليمان لداود وطلب زكريا وليّاً يرثه؟"
  en: "Are prophets inherited from in their property, and how is the hadith 'We are not inherited from' reconciled with the verses on Sulayman inheriting from Dawud and Zakariyya's request for an heir?"
  ur: "کیا انبیا کے مال میں وراثت جاری ہوتی ہے، اور حدیث «ہماری وراثت نہیں ہوتی» کو سلیمان کے داؤد کے وارث ہونے اور زکریا کی وارث کی دعا والی آیات سے کیسے ہم آہنگ کیا جاتا ہے؟"
perspectives:
  - tradition: sunni
    id: prophethood-and-knowledge-not-wealth
    standing: main
    stance:
      ar: "الأنبياء لا يورث ما تركوا وهو صدقة، والإرث في الآيتين إرث نبوة وعلم لا مال"
      en: "What the prophets leave is not inherited but is charity, and inheritance in the two verses is of prophethood and knowledge, not wealth"
      ur: "انبیا کا چھوڑا ہوا مال وراثت میں نہیں جاتا بلکہ صدقہ ہے، اور دونوں آیات میں وراثت نبوت اور علم کی ہے، مال کی نہیں"
    summary:
      ar: "يستدل ابن كثير بثبوت الحديث في الصحيحين من طرق عن جماعة من الصحابة، وبأن لداود بنين غير سليمان فلا يُخص بالمال دونهم، وبأن الدنيا كانت أحقر عند الأنبياء من أن يكنزوا لها، وبأن زكريا كان نجاراً يأكل من عمل يده {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 609} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 666}. ويقول القرطبي، ناقلاً عن ابن عبد البر، إن أهل العلم بتأويل القرآن على هذا وإن ما خالف قول النبي «مدفوع مهجور» {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 4330}."
      en: "Ibn Kathir argues from the hadith being in the two Sahih collections through several routes from a group of Companions, from Dawud having other sons so that Sulayman would not be singled out for wealth, from this world being too low in the prophets' eyes to hoard for, and from Zakariyya being a carpenter eating from his own work {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 609} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 666}. Al-Qurtubi, quoting Ibn Abd al-Barr, says the people of knowledge of Qur'anic interpretation hold this and that whatever contradicts the Prophet's saying is 'rejected and abandoned' {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 4330}."
      ur: "ابن کثیر اس سے استدلال کرتے ہیں کہ حدیث صحیحین میں صحابہ کی ایک جماعت سے کئی طرق سے ہے، کہ داؤد کے اور بیٹے بھی تھے تو سلیمان کو مال میں الگ نہ کیا جاتا، کہ دنیا انبیا کی نظر میں ذخیرہ کرنے کے لائق نہ تھی، اور کہ زکریا اپنے ہاتھ کی کمائی کھانے والے بڑھئی تھے {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 609} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 666}۔ قرطبی ابن عبد البر سے نقل کرتے ہیں کہ تاویلِ قرآن کے اہلِ علم اسی پر ہیں اور جو نبی کے قول کے خلاف ہو وہ «مردود اور متروک» ہے {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 4330}۔"
