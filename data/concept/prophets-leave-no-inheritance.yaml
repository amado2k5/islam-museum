  - tradition: sunni
    id: specific-to-our-prophet
    standing: secondary
    stance:
      ar: "عدم التوريث خاص بنبينا، إذ جعل الله ماله كله صدقة زيادة في فضيلته"
      en: "The rule that he is not inherited from is specific to our Prophet, God having made all his property charity as an addition to his excellence"
      ur: "وراثت نہ ہونا ہمارے نبی کے لیے خاص ہے، کیونکہ اللہ نے ان کا سارا مال ان کی فضیلت میں اضافے کے طور پر صدقہ بنا دیا"
    summary:
      ar: "ينقل القرطبي عن أبي عمر أن هذا قول بعض أهل البصرة منهم ابن علية، وأن سائر علماء المسلمين على القول الأول {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 4334}."
      en: "Al-Qurtubi quotes Abu Umar that this is the view of some people of Basra, among them Ibn Ulayya, and that the rest of the Muslim scholars hold the first view {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 4334}."
      ur: "قرطبی ابو عمر سے نقل کرتے ہیں کہ یہ بصرہ کے بعض لوگوں کا قول ہے جن میں ابن علیہ ہیں، اور باقی مسلمان علما پہلے قول پر ہیں {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 4334}۔"
    holders: [person/al-qurtubi]
    sources: [source/jami-ahkam-quran-resala-v1]
  - tradition: sunni
    id: usual-practice-not-universal
    standing: secondary
    stance:
      ar: "الحديث قد يصف غالب سيرة الأنبياء لا العموم، وقد يكون زكريا طلب وراثة المال أو العلم"
      en: "The hadith may describe the usual way of the prophets rather than a universal rule, and Zakariyya may have asked for inheritance of wealth or of knowledge"
      ur: "حدیث انبیا کے غالب طریقے کا بیان ہو سکتی ہے نہ کہ کلیہ، اور زکریا نے مال یا علم کی وراثت مانگی ہو سکتی ہے"
    summary:
      ar: "ينقل القرطبي عن ابن عطية أن الأكثر من المفسرين على أن زكريا أراد وراثة المال، وأن الحديث قد لا يقصد العموم كقولك إنا معشر المسلمين شغلتنا العبادة، ثم يرجّح القرطبي العموم، وينقل عن النحاس أن الحديث لا حجة فيه على منع وراثة المال عن الأنبياء عامة {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 4330} {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 4333} {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 5106}."
      en: "Al-Qurtubi quotes Ibn Atiyya that most commentators hold that Zakariyya meant inheritance of wealth and that the hadith may not intend generality, as in saying 'we Muslims are busy with worship'; al-Qurtubi himself favours generality, and quotes al-Nahhas that the hadith is no proof against inheritance of wealth for prophets generally {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 4330} {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 4333} {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 5106}."
      ur: "قرطبی ابن عطیہ سے نقل کرتے ہیں کہ اکثر مفسرین کے نزدیک زکریا نے مال کی وراثت مراد لی تھی اور حدیث میں عموم مراد نہ ہو سکتا ہے، جیسے کوئی کہے «ہم مسلمان تو عبادت میں لگے ہیں»؛ قرطبی خود عموم کو ترجیح دیتے ہیں، اور نحاس سے نقل کرتے ہیں کہ حدیث میں عام انبیا کی مالی وراثت کے منع ہونے کی کوئی دلیل نہیں {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 4330} {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 4333} {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 5106}۔"
