id: concept/prophets-leave-no-inheritance
class: concept
kind: doctrine
tags: [wasaya-browser, wasaya-legacy, wasaya-mirath]
label:
  ar: "الأنبياء لا يورَثون: «لا نورث ما تركنا صدقة»"
  en: "The prophets leave no inheritance: 'We are not inherited from; what we leave is charity'"
  ur: "انبیا وراثت نہیں چھوڑتے: «ہماری وراثت نہیں ہوتی، جو ہم چھوڑیں صدقہ ہے»"
  es: "Los profetas no dejan herencia: «No heredamos de nadie; lo que dejamos es caridad»."
summary:
  ar: "روي عن النبي أنه قال «لا نورث ما تركنا فهو صدقة»، وفي لفظ عام «نحن معشر الأنبياء لا نورث»، ويذكر ابن كثير أنه رواه عدد من الصحابة منهم عمر وعثمان وعلي والعباس وعبد الرحمن بن عوف وأبو هريرة {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 666}. ويفهم المفسرون من أهل السنة وراثة سليمان لداود وطلب زكريا وليّاً يرثه على أنها وراثة نبوة وعلم لا وراثة مال {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 609} {cite:tafsir-ibn-kathir scan vol. 1 p. 2926}. وينقل القرطبي عن أبي داود أن العلماء ورثة الأنبياء وأن الأنبياء ورّثوا العلم لا ديناراً ولا درهماً {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 4330}. وتذكر الكتب وجوهاً في فهم الحديث بينها قول إنه خاص بنبينا وقول إنه وصف لغالب سيرة الأنبياء {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 4334} {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 5106}."
  en: "The Prophet is reported to have said 'We are not inherited from; what we leave is charity', and in a general wording 'We, the company of prophets, are not inherited from'; Ibn Kathir lists Umar, Uthman, Ali, al-Abbas, Abd al-Rahman ibn Awf and Abu Hurayra among its transmitters {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 666}. Sunni commentators read Sulayman's inheriting from Dawud and Zakariyya's request for an heir as inheritance of prophethood and knowledge, not of wealth {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 609} {cite:tafsir-ibn-kathir scan vol. 1 p. 2926}. Al-Qurtubi quotes from Abu Dawud that scholars are the heirs of the prophets and that the prophets left knowledge, not a dinar or dirham {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 4330}. The books give several ways of understanding the hadith, among them that it is specific to our Prophet and that it describes the usual way of the prophets {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 4334} {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 5106}."
  ur: "نبی سے روایت ہے کہ انھوں نے فرمایا «ہماری وراثت نہیں ہوتی، جو ہم چھوڑیں صدقہ ہے»، اور عام لفظ میں «ہم گروہِ انبیا کی وراثت نہیں ہوتی»؛ ابن کثیر راویوں میں عمر، عثمان، علی، عباس، عبد الرحمن بن عوف اور ابو ہریرہ کا ذکر کرتے ہیں {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 666}۔ سنی مفسرین سلیمان کی داؤد سے وراثت اور زکریا کی وارث کی دعا کو نبوت اور علم کی وراثت سمجھتے ہیں، مال کی نہیں {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 609} {cite:tafsir-ibn-kathir scan vol. 1 p. 2926}۔ قرطبی ابو داود سے نقل کرتے ہیں کہ علما انبیا کے وارث ہیں اور انبیا نے علم چھوڑا، دینار و درہم نہیں {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 4330}۔ کتابیں حدیث کو سمجھنے کی کئی صورتیں دیتی ہیں، جن میں یہ بھی ہے کہ وہ ہمارے نبی کے لیے خاص ہے اور یہ بھی کہ وہ انبیا کے غالب طریقے کا بیان ہے {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 4334} {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 5106}۔"
  es: "Se dice que el Profeta dijo: «No heredamos de; lo que dejamos es caridad», y en términos generales: «Nosotros, la compañía de los profetas, no heredamos de»; Ibn Kathir enumera a Umar, Uthman, Ali, al-Abbas, Abd al-Rahman ibn Awf y Abu Hurayra entre sus transmisores {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 666}. Los comentaristas sunitas interpretan la herencia de Sulayman de Dawud y la petición de Zakariyya de un heredero como herencia de profecía y conocimiento, no de riqueza {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 609} {cite:tafsir-ibn-kathir scan vol. 1 p. 2926}. Al-Qurtubi cita a Abu Dawud diciendo que los eruditos son los herederos de los profetas y que los profetas dejaron conocimiento, no un dinar o dirham {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 4330}. Los libros ofrecen varias formas de entender el hadiz, entre ellas que es específico de nuestro Profeta y que describe la forma habitual de los profetas {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 4334} {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 5106}."
