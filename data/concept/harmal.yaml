summary:
  ar: "الحرمل نبات معروف، والكتاب يذكر منه أنه مقطّع ملطّف، وهذا الإدخال قصير لأن المصنف لم يزد على الوصف، والحاشية الطويلة المنقولة عن مؤلف حديث حُذفت."
  en: "Harmal is a known plant. The book describes it only as cutting and thinning, so this entry is short. A long editor's footnote quoting a modern herbal is left out."
  ur: "حرمل ایک معروف پودا ہے؛ کتاب اسے صرف کاٹنے اور باریک کرنے والا بتاتی ہے، اس لیے یہ اندراج مختصر ہے۔ جدید جڑی بوٹیوں کی کتاب سے منقول طویل حاشیہ حذف کیا گیا ہے۔"
  es: "El harmal es una planta conocida. El libro la describe únicamente como útil para cortar y ralear, por lo que esta entrada es breve. Se omite una extensa nota a pie de página del editor que cita un herbario moderno."
  fr: "L'harmal est une plante connue. L'ouvrage la décrit uniquement comme une plante à tailler et à éclaircir, d'où la brièveté de cette entrée. Une longue note de bas de page de l'éditeur, citant un herbier moderne, a été omise."
  tr: "Al-Harmal iyi bilinen bir bitkidir ve kitapta hafif bir pasaj olarak bahsedilmektedir. Bu giriş kısa çünkü yazar sadece bunu tanımlamış ve yakın zamanda yazılmış bir yazardan alıntılanan uzun kenar notları çıkarılmıştır."
  id: "Al-Harmal adalah tanaman yang terkenal, dan buku menyebutnya sebagai bagian yang ringan. Entri ini singkat karena penulis hanya mendeskripsikannya, dan catatan panjang di pinggir yang dikutip dari penulis terbaru dihilangkan."
