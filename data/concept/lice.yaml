  ar: "ثاني آيات موسى على آل فرعون بعد الطوفان القمل، وقيل البراغيث وقيل السوس وقيل الجراد الصغير الذي لا جناح له."
  en: "The second sign upon Pharaoh's people after the flood: the lice — others read it as fleas, weevils, or the small wingless locust."
  ur: "سیلاب کے بعد فرعون کے آل پر دوسری نشانی: جوئیں — کچھ کے نزدیک پسو، سرکیاں یا بے پر چھوٹے ٹڈے۔"
  es: "La segunda señal que apareció sobre el pueblo del faraón después del diluvio: los piojos; otros lo interpretan como pulgas, gorgojos o la pequeña langosta sin alas."
  fr: "Le deuxième signe qui s'abattit sur le peuple de Pharaon après le déluge: les poux — certains l'interprètent comme des puces, des charançons ou la petite sauterelle sans ailes."
  tr: "Tufandan sonra Firavun ailesine Musa'nın ikinci işareti bitlerdi ve pireler, böcekler ve kanatsız küçük çekirgeler deniyordu."
  id: "Tanda kedua Musa bagi keluarga Firaun setelah banjir adalah kutu, dan dikatakan kutu, kutu kuak, kumbang kecil, dan belalang kecil yang tidak memiliki sayap."
