id: concept/khitba-fiqh
class: concept
kind: legal
label:
  ar: الخِطبة (طلب الزواج)
  en: Khitba (marriage proposal)
  ur: خِطبہ (نکاح کا پیغام)
summary:
  ar: 'الخِطبة بكسر الخاء مصدر خطب المرأة، أي طلب أن يتزوجها، واختطب القوم فلانا إذا دعوه إلى تزويج صاحبتهم؛ والنكاح عقد يفيد ملك المتعة قصدا بين رجل وامرأة من غير مانع شرعي، والخطبة مقدمة له لا يترتب عليها أحكامه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7714} الخطبة غالبا وسيلة للنكاح وليست شرطا لصحته، والجمهور على إباحتها، والمعتمد عند الشافعية استحبابها لفعل النبي حين خطب عائشة وحفصة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7714} خطبة الخلية (التي لا زوج لها ولا عدة) جائزة تصريحا وتعريضا بالاتفاق؛ وخطبة المنكوحة حرام؛ وخطبة من قام بها مانع، كالمجوسية حتى تسلم، لا تجوز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7714}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7715} خطبة المعتدة تختلف بحالها: التصريح بخطبة معتدة الغير حرام بالاتفاق، لقوله تعالى في سورة البقرة وقد ذكر فيها التعريض والتصريح؛ والتعريض هو ما يحتمل الرغبة وغيرها، ويسمى تلويحا؛ وعرفه الشافعية بمثل قوله «ورب راغب فيك». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7715}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7716} التعريض بخطبة المعتدة الرجعية حرام بالاتفاق؛ والمتوفى عنها زوجها يجوز التعريض لها؛ والبائن بطلاق يجوز التعريض لها عند المالكية والشافعية في الأظهر والحنابلة، والحنفية والشافعية في مقابل الأظهر يمنعونه إن أفضى إلى عداوة المطلق؛ ومعتدة النكاح الفاسد والفسخ ونحوهما يجوز التعريض لها عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7716}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7717}'
  en: 'Khitba, with a short vowel on the kha, is the verb khataba, to propose marriage to a woman; the marriage contract gives ownership of enjoyment by intent between a man and a woman free of legal bar; the proposal comes before it and does not carry its effects. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7714} The proposal is usually a means to marriage and not a condition of it; the majority permit it, and the Shafiis prefer it, following the Prophet\''s proposals to Aisha and Hafsa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7714} Proposing to an unmarried woman with no waiting period is lawful, directly or by hint, by agreement; proposing to a married woman is forbidden; proposing to one barred by an impediment, such as a Magian woman until she accepts Islam, is not lawful. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7714}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7715} A proposal to a woman in waiting varies by her state: a direct proposal to another man\''s waiting woman is forbidden by agreement, on the Quranic verse that distinguishes hint from express offer; a hint is what admits of the desire to marry or of something else. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7715}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7716} A hint to a woman in a revocable waiting period is forbidden by agreement; a hint to a widow is permitted; a hint to a woman divorced irrevocably is permitted by the Malikis, the Shafiis in the preferred view and the Hanbalis, while the Hanafis and a Shafii view forbid it if it causes enmity with the former husband; a hint to a woman in the waiting period of an invalid marriage or a dissolution is permitted by most. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7716}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7717}'
  ur: 'خِطبہ کسرۂ خاء کے ساتھ مصدر ہے جس کا مطلب عورت سے نکاح کا پیغام بھیجنا؛ نکاح وہ عقد ہے جو کسی مرد اور عورت کے درمیان بغیر شرعی مانع کے قصداً استمتاع کی ملکیت دیتا ہے، اور خطبہ اس کا مقدمہ ہے جس کے احکام اس پر لاگو نہیں ہوتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7714} خطبہ عموماً نکاح کا ذریعہ ہے اور اس کی شرط نہیں؛ جمہور کے نزدیک جائز ہے اور شافعیہ کے نزدیک مستحب، نبی کے عائشہ اور حفصہ کو پیغام بھیجنے سے استدلال کرتے ہوئے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7714} بغیر شوہر اور بغیر عدت والی عورت کو صراحتاً یا اشارتاً پیغام دینا بالاتفاق جائز ہے؛ شادی شدہ کو پیغام حرام ہے؛ جس کو کوئی مانع ہو (جیسے مجوسی عورت جب تک مسلمان نہ ہو) اس کو پیغام جائز نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7714}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7715} عدت والی عورت کا حکم اس کی حالت کے مطابق ہے: دوسرے کی معتدہ کو صریح پیغام بالاتفاق حرام ہے، اور تعریض وہ ہے جو رغبت یا کسی اور بات کا احتمال رکھے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7715}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7716} رجعی عدت والی کو تعریض بالاتفاق حرام ہے؛ بیوہ کو تعریض جائز ہے؛ بائن طلاق والی کو تعریض مالکیہ، شافعیہ کے اظہر قول اور حنابلہ کے نزدیک جائز ہے، جبکہ حنفیہ اور شافعیہ کا مقابل قول اسے منع کرتے ہیں اگر سابق شوہر سے عداوت کا باعث ہو؛ فاسد نکاح یا فسخ کی عدت والی کو جمہور کے نزدیک تعریض جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7716}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7717}'
