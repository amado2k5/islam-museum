id: concept/khitba-fiqh
class: concept
kind: legal
label:
  ar: الخِطبة (طلب الزواج)
  en: Khitba (marriage proposal)
  ur: خِطبہ (نکاح کا پیغام)
summary:
  ar: 'الخِطبة بكسر الخاء مصدر خطب المرأة، أي طلب أن يتزوجها، واختطب القوم فلانا إذا دعوه إلى تزويج صاحبتهم؛ والنكاح عقد يفيد ملك المتعة قصدا بين رجل وامرأة من غير مانع شرعي، والخطبة مقدمة له لا يترتب عليها أحكامه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7714} الخطبة غالبا وسيلة للنكاح وليست شرطا لصحته، والجمهور على إباحتها، والمعتمد عند الشافعية استحبابها لفعل النبي حين خطب عائشة وحفصة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7714} خطبة الخلية (التي لا زوج لها ولا عدة) جائزة تصريحا وتعريضا بالاتفاق؛ وخطبة المنكوحة حرام؛ وخطبة من قام بها مانع، كالمجوسية حتى تسلم، لا تجوز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7714}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7715} خطبة المعتدة تختلف بحالها: التصريح بخطبة معتدة الغير حرام بالاتفاق، لقوله تعالى في سورة البقرة وقد ذكر فيها التعريض والتصريح؛ والتعريض هو ما يحتمل الرغبة وغيرها، ويسمى تلويحا؛ وعرفه الشافعية بمثل قوله «ورب راغب فيك». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7715}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7716} التعريض بخطبة المعتدة الرجعية حرام بالاتفاق؛ والمتوفى عنها زوجها يجوز التعريض لها؛ والبائن بطلاق يجوز التعريض لها عند المالكية والشافعية في الأظهر والحنابلة، والحنفية والشافعية في مقابل الأظهر يمنعونه إن أفضى إلى عداوة المطلق؛ ومعتدة النكاح الفاسد والفسخ ونحوهما يجوز التعريض لها عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7716}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7717} جواب الخاطب: حكم جواب المرأة أو وليها كحكم الخطبة حلا وحرمة؛ فيحل للمتوفى عنها زوجها أن تجيب بالتعريض، ويحرم عليها التصريح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7718} خطبة المُحرِم: يكره عند الجمهور لحديث عثمان «لا ينكح المحرم ولا ينكح ولا يخطب»، والحنفية يجيزونها في الإحرام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7718} من تُخطب إليه المرأة: المجبَرة إلى وليها؛ ويجوز للرشيدة أن تُخطب إلى نفسها، كما فعل النبي مع أم سلمة في خطبة حاطب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7718} يستحب للولي أن يعرض موليته على ذوي الصلاح والفضل، كما فعل شعيب مع موسى وعمر مع عثمان وأبي بكر في حفصة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7719} إخفاء الخطبة: يندب عند المالكية والجمهور إخفاؤها، بخلاف عقد النكاح فيندب إعلانه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7719} الخطبة على الخطبة: الجمهور على تحريمها إذا حصل الركون للخاطب الأول، لحديث ابن عمر، والنووي حكى الإجماع على أن النهي للتحريم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7719}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7720} متى تحرم: الشافعية والحنابلة يشترطون إجابة الأول وعدم تركه وعلم الثاني، والشافعية يزيدون التصريح بالإجابة وجواز الخطبة الأولى وعلم الثاني بالتحريم؛ والحنابلة تكفي الإجابة بالتعريض؛ والمالكية يشترطون الركون وألا يكون الفاسق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7720} العقد بعد الخطبة المحرمة: الجمهور يصححونه مع الحرمة؛ وبعض المالكية يوجبون فسخه قبل الدخول إن استمر الركون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7721} نظر الخاطب إلى المخطوبة: مباح بالإجماع، وهو عند الحنفية والمالكية والشافعية وبعض الحنابلة مندوب، لحديث المغيرة بن شعبة «انظر إليها فإنه أحرى أن يؤدم بينكما»؛ والحنابلة يشترطون إرادة النكاح وظن الإجابة، والحنفية يكتفون بإرادة النكاح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7721}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7722} لا يشترط علم المخطوبة ولا إذنها عند الجمهور، ولا أمن الفتنة عند الحنفية والمالكية والشافعية، والحنابلة يشترطون أمن الفتنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7722}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7723} ما ينظر من المخطوبة: الوجه والكفان عند الحنفية والمالكية والشافعية؛ والحنابلة ينظرون ما يظهر غالبا كالوجه والرقبة واليد والقدم، وفي رواية لا ينظر إلا الوجه، وقد جاء المذهب على الثانية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7723} تزين المرأة الخالية وتعرضها: الحنفية تحلية البنات سنة؛ وعند المالكية يجوز التزين للخطاب ولو قيل بالندب لم يبعد؛ والحنابلة يذكرون حديث الاختضاب تعرضا للرزق، وقصة سبيعة الأسلمية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7723}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7724} تكرير النظر حتى يتبين حالها، بقدر الحاجة؛ ولا يجوز المس، ولا الخلوة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7724}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7725} يجوز للخاطب إرسال امرأة تنظر المخطوبة وتصفها، ولو بما لا يحل نظره، لحاجته، وأرسل النبي أم سليم إلى جارية؛ والمالكية يجيزون إرسال الرجل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7724}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7725} إذا نظر الخاطب فلم تعجبه فليسكت ولا يقل لا أريدها لأنه إيذاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7726} من استشير في خاطب أو مخطوبة وجب عليه أن يذكر ما فيه من مساوئ شرعية أو عرفية نصيحة لا إيذاء، ولا تكون غيبة محرمة، ويقاس عليه حديث فاطمة بنت قيس في معاوية وأبي جهم؛ ومن استشير في أمر نفسه بيّنه، ويفصل بعض الشافعية بين ما يثبت الخيار وما يقلل الرغبة فقط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7726}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7727} خطبة قبل الخطبة: يندب للخاطب أو نائبه أن يقدم حمد الله والثناء والصلاة على النبي والوصية بالتقوى، ثم يذكر أنه جاء خاطبا، وتبرك الأئمة بخطبة الحاجة المأثورة عن ابن مسعود. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7727}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7728} الرجوع عن الخطبة: الشافعية والحنابلة يرون الخطبة وعدا لا عقدا لازما، وللولي الرجوع إن رأى المصلحة، وللمرأة الرجوع إن كرهت، وكره الرجوع لغير غرض؛ والمالكية يكرهون لمن ركنت له امرأة أن يتركها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7728} ما يسترد من الهدية والنفقة: الحنفية يسترد ما أعطاه للمهر وهو قائم، ولا يسترد الهالك؛ والمالكية يجيزون الإهداء للمعتدة لا الإنفاق؛ والشافعية يسترد من أنفق بقصد الزواج ما بقي أو بدله إن تلف؛ والحنابلة يرون الهدية قبل العقد تعود إن لم يفوا بالوعد، وتردّ بعد العقد عند الفرقة الاختيارية قبل الدخول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7728}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7729}'
  en: 'Khitba, with a short vowel on the kha, is the verb khataba, to propose marriage to a woman; the marriage contract gives ownership of enjoyment by intent between a man and a woman free of legal bar; the proposal comes before it and does not carry its effects. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7714} The proposal is usually a means to marriage and not a condition of it; the majority permit it, and the Shafiis prefer it, following the Prophet\''s proposals to Aisha and Hafsa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7714} Proposing to an unmarried woman with no waiting period is lawful, directly or by hint, by agreement; proposing to a married woman is forbidden; proposing to one barred by an impediment, such as a Magian woman until she accepts Islam, is not lawful. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7714}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7715} A proposal to a woman in waiting varies by her state: a direct proposal to another man\''s waiting woman is forbidden by agreement, on the Quranic verse that distinguishes hint from express offer; a hint is what admits of the desire to marry or of something else. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7715}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7716} A hint to a woman in a revocable waiting period is forbidden by agreement; a hint to a widow is permitted; a hint to a woman divorced irrevocably is permitted by the Malikis, the Shafiis in the preferred view and the Hanbalis, while the Hanafis and a Shafii view forbid it if it causes enmity with the former husband; a hint to a woman in the waiting period of an invalid marriage or a dissolution is permitted by most. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7716}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7717} On the answer to a proposal: the woman or her guardian\''s answer has the same lawfulness as the proposal; a widow may answer by hint, but not openly, and the same goes for other women in waiting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7718} A proposal by a pilgrim in ihram is disliked by most, on the report of Uthman that the pilgrim neither marries, is married, nor proposes; the Hanafis allow it in ihram. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7718} Who is approached: a compelled woman through her guardian; a woman of sound mind may be approached on her own behalf, as the Prophet approached Umm Salama for Hatib. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7718}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7719} A guardian is advised to offer his ward to the righteous and learned, as the father of the two daughters offered one to Moses and Umar offered Hafsa to Uthman and then to Abu Bakr. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7719} Concealing the proposal is recommended by the Malikis and most jurists, but announcing the contract is recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7719} Proposing over another\''s proposal: most jurists forbid it once the woman has inclined to the first suitor, on the report of Ibn Umar; al-Nawawi reports agreement that the prohibition is absolute. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7719}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7720} When the prohibition applies: the Shafiis and Hanbalis require that the first suitor was accepted, not withdrawn, not refused, and that the second knows; the Shafiis add explicit acceptance; the Hanbalis accept a hint of acceptance; the Malikis require inclination and that the first suitor is not a sinner. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7720} A contract made after a forbidden proposal stands according to most jurists, though some Malikis require it dissolved if the inclination continues. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7721} Looking at the woman proposed to is lawful by agreement, recommended for the Hanafis, Malikis, Shafiis and some Hanbalis, on the report of Mughira ibn Shu\''ba that looking helps love between them; the Hanbalis require the wish to marry and a likely acceptance, the Hanafis only the wish to marry. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7721}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7722} Consent or knowledge of the woman or her guardian is not required by most; the Hanbalis require safety from temptation, the others do not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7722}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7723} What may be seen: the face and the two hands are allowed by the Hanafis, Malikis and Shafiis; the Hanbalis allow what usually shows, such as the face, neck, hand and foot, though one report allows only the face, and the school\''s preferred view is the wider. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7723} A woman of sound mind may adorn herself and show herself to suitors; the Hanafis count the dressing of daughters as a sunna. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7723}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7724} A suitor may look again as needed until he knows her state, no further than need; touching is not allowed, nor privacy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7724}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7725} A suitor may send a woman to see the proposed bride and describe her, even what he may not see, since the need is great; the Malikis allow him to send a man too. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7725} If the suitor sees a woman and does not like her, he should keep silent and not say he does not want her, since that hurts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7726} Whoever is asked about a suitor or a woman must name the defects, religious or customary, as advice and not as harm; this is not forbidden backbiting when the purpose is warning, as in the case of Fatima bint Qays and Muawiya and Abu Jahm; whoever is asked about himself must state his case; some Shafiis separate the defects that give a right to annul from those that only lessen desire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7726}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7727} A preliminary sermon before the proposal is recommended: praise of God, prayer on the Prophet, counsel to piety, then the declaration of coming as a suitor, with the sermon of need reported from Ibn Mas\''ud as the model. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7727}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7728} Withdrawal: the Shafiis and Hanbalis hold the proposal a promise, not a binding contract, and the guardian may withdraw for the woman\''s interest; the woman may withdraw if she dislikes the suitor; withdrawal without cause is disliked; the Malikis dislike leaving a woman who inclined to the suitor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7728} Recovering gifts and maintenance: the Hanafis recover a gift given for the dowry if it still exists, not what is lost or used; the Malikis allow gifts but not maintenance to a waiting woman; the Shafiis recover what was spent with the marriage in view, the thing or its value; the Hanbalis hold that gifts before the contract return if the promise fails, and after the contract return on a voluntary separation before consummation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7728}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7729}'
  ur: 'خِطبہ کسرۂ خاء کے ساتھ مصدر ہے جس کا مطلب عورت سے نکاح کا پیغام بھیجنا؛ نکاح وہ عقد ہے جو کسی مرد اور عورت کے درمیان بغیر شرعی مانع کے قصداً استمتاع کی ملکیت دیتا ہے، اور خطبہ اس کا مقدمہ ہے جس کے احکام اس پر لاگو نہیں ہوتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7714} خطبہ عموماً نکاح کا ذریعہ ہے اور اس کی شرط نہیں؛ جمہور کے نزدیک جائز ہے اور شافعیہ کے نزدیک مستحب، نبی کے عائشہ اور حفصہ کو پیغام بھیجنے سے استدلال کرتے ہوئے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7714} بغیر شوہر اور بغیر عدت والی عورت کو صراحتاً یا اشارتاً پیغام دینا بالاتفاق جائز ہے؛ شادی شدہ کو پیغام حرام ہے؛ جس کو کوئی مانع ہو (جیسے مجوسی عورت جب تک مسلمان نہ ہو) اس کو پیغام جائز نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7714}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7715} عدت والی عورت کا حکم اس کی حالت کے مطابق ہے: دوسرے کی معتدہ کو صریح پیغام بالاتفاق حرام ہے، اور تعریض وہ ہے جو رغبت یا کسی اور بات کا احتمال رکھے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7715}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7716} رجعی عدت والی کو تعریض بالاتفاق حرام ہے؛ بیوہ کو تعریض جائز ہے؛ بائن طلاق والی کو تعریض مالکیہ، شافعیہ کے اظہر قول اور حنابلہ کے نزدیک جائز ہے، جبکہ حنفیہ اور شافعیہ کا مقابل قول اسے منع کرتے ہیں اگر سابق شوہر سے عداوت کا باعث ہو؛ فاسد نکاح یا فسخ کی عدت والی کو جمہور کے نزدیک تعریض جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7716}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7717} جواب کا حکم: عورت یا اس کے ولی کا جواب بھی خطبے کے حلال و حرام ہونے کے مطابق ہے؛ بیوہ تعریض سے جواب دے سکتی ہے، صریح جواب نہیں؛ باقی عدت والی عورتوں کا بھی یہی حکم ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7718} محرم کا پیغام: جمہور کے نزدیک مکروہ ہے، عثمان کی حدیث «لا ينكح المحرم ولا ينكح ولا يخطب» سے استدلال؛ حنفیہ احرام میں جائز کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7718} کس سے پیغام: مجبورہ عورت کے ولی سے؛ رشیدہ عورت خود اپنے لیے پیغام لے سکتی ہے، جیسے نبی نے ام سلمہ کو حاطب کے لیے پیغام دیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7718}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7719} ولی کو مستحب ہے کہ اپنی زیرِ ولایت لڑکی صالح اور صاحب فضل لوگوں کے سامنے پیش کرے، جیسے شعیب کا موسیٰ کے سامنے، اور عمر کا حفصہ کو عثمان اور ابو بکر کے سامنے پیش کرنا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7719} پیغام کا چھپانا مالکیہ اور جمہور کے نزدیک مستحب ہے، جبکہ نکاح کا اعلان مستحب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7719} پہلے کے پیغام پر پیغام دینا: جمہور کے نزدیک حرام ہے جب عورت پہلے کی طرف مائل ہو، ابن عمر کی حدیث سے؛ نووی نے اس پر اجماع نقل کیا ہے کہ نہی تحریم کے لیے ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7719}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7720} حرمت کی شرائط: شافعیہ اور حنابلہ کے نزدیک پہلے خاطب کی قبولیت ہو، واپسی نہ ہو، اور دوسرے کو علم ہو؛ شافعیہ صریح قبولیت کی شرط لگاتے ہیں؛ حنابلہ اشارے سے قبولیت کو کافی کہتے ہیں؛ مالکیہ مائل ہونا اور پہلے خاطب کا فاسق نہ ہونا شرط کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7720} ممنوع پیغام کے بعد کیا گیا نکاح جمہور کے نزدیک صحیح ہے، بعض مالکیہ کے نزدیک مائل رہنے کی صورت میں فسخ واجب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7721} خاطب کا مخطوبہ کو دیکھنا: مباح بالاتفاق، حنفیہ، مالکیہ، شافعیہ اور بعض حنابلہ کے نزدیک مندوب ہے، مغیرہ بن شعبہ کی حدیث «انظر إليها فإنه أحرى أن يؤدم بينكما» سے؛ حنابلہ نکاح کا ارادہ اور قبولیت کا ظن شرط کہتے ہیں، حنفیہ صرف ارادہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7721}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7722} جمہور کے نزدیک عورت یا ولی کی اجازت یا علم شرط نہیں؛ حنابلہ فتنے سے امن شرط کہتے ہیں، دوسرے نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7722}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7723} کیا دیکھا جا سکتا ہے: چہرہ اور دونوں ہتھیلیاں حنفیہ، مالکیہ اور شافعیہ کے نزدیک؛ حنابلہ ظاہر ہونے والے اعضا (چہرہ، گردن، ہاتھ، پاؤں) دیکھنے کی اجازت دیتے ہیں، ایک روایت میں صرف چہرہ، اور مذہب کی راجح روایت وسیع ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7723} خالی عورت زیب و زینت کر کے پیغام دینے والوں کے سامنے آ سکتی ہے؛ حنفیہ بیٹیوں کی زیبائش کو سنت کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7723}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7724} ضرورت کی حد تک بار بار دیکھنا جائز ہے؛ چھونا اور تنہائی منع ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7724}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7725} خاطب کسی عورت کو بھیج کر مخطوبہ کو دکھا سکتا ہے اور وصف بیان کروا سکتا ہے، جو وہ خود نہ دیکھ سکتا ہو، کیونکہ ضرورت شدید ہے؛ نبی نے ام سلیم کو ایک لڑکی کے پاس بھیجا تھا؛ مالکیہ مرد کو بھیجنا بھی جائز کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7725} اگر خاطب مخطوبہ کو دیکھے اور پسند نہ آئے تو خاموش رہے، یہ نہ کہے کہ میں اسے نہیں چاہتا، کیونکہ یہ ایذا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7726} جس سے خاطب یا مخطوبہ کے بارے میں مشورہ لیا جائے وہ شرعی یا عرفی عیوب نصیحت کے طور پر بتائے، ایذا کے طور پر نہیں؛ اس میں نصیحت کی نیت ہو تو یہ حرام غیبت نہیں، جیسے فاطمہ بنت قیس کا معاویہ اور ابو جہم کے بارے میں سوال؛ اپنے بارے میں پوچھا جائے تو اپنی حالت بتائے؛ بعض شافعیہ ان عیوب میں فرق کرتے ہیں جو خیار کا حق دیں اور جو صرف رغبت کم کریں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7726}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7727} پیغام سے پہلے خطبہ مستحب ہے: حمد، درود، تقویٰ کی وصیت، پھر یہ کہنا کہ میں خاطب بن کر آیا ہوں، ابن مسعود سے مروی خطبۂ حاجت کو نمونہ بنایا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7727}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7728} پیغام سے رجوع: شافعیہ اور حنابلہ کے نزدیک پیغام وعدہ ہے نہ کہ لازم عقد، ولی مصلحت کے تحت رجوع کر سکتا ہے، عورت کو ناپسندیدگی پر رجوع کا حق ہے، بلاوجہ رجوع مکروہ ہے؛ مالکیہ اس عورت کو چھوڑنا مکروہ کہتے ہیں جو خاطب کی طرف مائل ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7728} ہدیہ اور نفقہ کی واپسی: حنفیہ مہر کے طور پر دی گئی چیز موجود ہو تو واپس لیتے ہیں، ضائع یا استعمال شدہ نہیں؛ مالکیہ معتدہ کو ہدیہ دینا جائز اور نفقہ دینا ناجائز کہتے ہیں؛ شافعیہ نکاح کی غرض سے خرچ کیا ہوا واپس لیتے ہیں اگر چیز موجود ہو یا بدل؛ حنابلہ کے نزدیک وعدہ پورا نہ ہو تو عقد سے پہلے کا ہدیہ واپس ہوتا ہے، عقد کے بعد اختیاری علیحدگی اور دخول سے پہلے واپس ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7728}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7729}'
