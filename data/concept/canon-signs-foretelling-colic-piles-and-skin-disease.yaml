id: concept/canon-signs-foretelling-colic-piles-and-skin-disease
class: concept
kind: scientific
label:
  ar: "علامات تنذر بالقولنج والبواسير وأمراض الجلد"
  en: "Signs foretelling colic, piles and skin disease in the Canon"
  fr: "Signes annonçant colique, hémorroïdes et maladies cutanées dans le Canon"
  ur: "قولنج، بواسیر اور جلدی امراض کی خبر دینے والی علامات قانون میں"
  es: "Signos que predicen cólicos, hemorroides y enfermedades de la piel en el Canon"
  tr: "Kolik, hemoroid ve cilt hastalıklarının uyarı belirtileri"
  id: "Tanda-tanda peringatan kolik, wasir, dan penyakit kulit"
summary:
  ar: "يختم ابن سينا فصل الأعراض المنذرة بعلامات في الأمعاء والجلد: سقوط الشهوة مع القيء والنفخ والوجع في الأطراف ينذر بالقولنج، والحكاك في المقعدة إن لم تكن ديدان صغار ينذر بالبواسير، وكثرة الدماميل والسلع تنذر بدبيلة كثيرة، والقوباء تنذر بالبرص الأسود والبهق الأبيض بالبرص الأبيض {cite:canon-ibn-sina-print-v1 pp.260-261}."
  en: "Ibn Sina closes the chapter of warning symptoms with signs in the bowels and the skin: loss of appetite with vomiting, flatulence and pain in the limbs foretells colic; itching of the seat, unless small worms are the cause, foretells piles; many boils and cysts foretell many abscesses; ringworm foretells the black leprosy and white vitiligo the white {cite:canon-ibn-sina-print-v1 pp.260-261}."
  fr: "Ibn Sina clôt les symptômes annonciateurs par intestin et peau : perte d’appétit avec vomissement, flatulence et douleur des membres annoncerait colique ; prurit du siège sans petits vers, hémorroïdes ; nombreux furoncles et kystes, nombreux abcès ; teigne, lèpre noire ; vitiligo blanc, forme blanche {cite:canon-ibn-sina-print-v1 pp.260-261}."
  es: "Ibn Sina cierra el capítulo de síntomas de advertencia con signos en los intestinos y la piel: la pérdida de apetito con vómitos, flatulencia y dolor en las extremidades presagia cólicos; picazón en el asiento, a menos que la causa sean pequeños gusanos, presagia hemorroides; muchos forúnculos y quistes presagian muchos abscesos; la tiña presagia la lepra negra y el vitíligo blanco la lepra blanca {cite:canon-ibn-sina-print-v1 pp.260-261}."
  ur: "ابن سینا انتباہی علامات کے باب کو آنتوں اور جلد میں علامات کے ساتھ بند کرتے ہیں: قے کے ساتھ بھوک میں کمی، پیٹ پھولنا اور اعضاء میں درد درد کی پیش گوئی کرتا ہے۔ نشست کی خارش، جب تک کہ چھوٹے کیڑے اس کا سبب نہ ہوں، ڈھیر کی پیش گوئی کرتا ہے۔ بہت سے پھوڑے اور سسٹ بہت سے پھوڑوں کی پیش گوئی کرتے ہیں۔ داد کالے کوڑھ اور سفید وٹیلگو کو سفید کی پیشین گوئی کرتا ہے"
  tr: "İbn Sina, uyarı belirtileri üzerine bölümü bağırsak ve ciltte belirtilerle bitirir: istek kaybı, kusma, şişkinlik ve uçlarda ağrı kolikleri gösterir; dışkıda kaşıntı varsa küçük solucanlar hemoroidi gösterir; bol çıbanlar ve sığırlar çok sayıda çıbanı gösterir; impego siyah cüzzamı uyarır; vitiligo beyaz vitiligoyu gösterir. {cite:canon-ibn-sina-print-v1 s.260-261}."
  id: "Ibn Sina menutup bab tentang gejala peringatan dengan tanda-tanda di usus dan kulit: hilangnya hasrat dengan muntah, kembung, dan nyeri di anggota tubuh menunjukkan kolik; gatal di tinja jika bukan cacing kecil menunjukkan wasir; bisul melimpah dan ternak menunjukkan banyak bisul; impego memperingatkan kusta hitam; dan vitiligo putih menunjukkan vitiligo putih. {cite:canon-ibn-sina-print-v1 hlm.260-261}."
