summary:
  ar: "يختم ابن سينا فصل الأعراض المنذرة بعلامات في الأمعاء والجلد: سقوط الشهوة مع القيء والنفخ والوجع في الأطراف ينذر بالقولنج، والحكاك في المقعدة إن لم تكن ديدان صغار ينذر بالبواسير، وكثرة الدماميل والسلع تنذر بدبيلة كثيرة، والقوباء تنذر بالبرص الأسود والبهق الأبيض بالبرص الأبيض {cite:canon-ibn-sina-print-v1 pp.260-261}."
  en: "Ibn Sina closes the chapter of warning symptoms with signs in the bowels and the skin: loss of appetite with vomiting, flatulence and pain in the limbs foretells colic; itching of the seat, unless small worms are the cause, foretells piles; many boils and cysts foretell many abscesses; ringworm foretells the black leprosy and white vitiligo the white {cite:canon-ibn-sina-print-v1 pp.260-261}."
