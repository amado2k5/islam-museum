label:
  ar: "الأمومة"
  en: "Motherhood"
  ur: "مامتا"
  es: "Maternidad"
summary:
  ar: "الأمومة في الإسلام صلة رحم مقرونة بفضل مضاعف: تحمل الأم حملها وهنا على وهن، ورضاعها حولين كاملين، وبرها مقدم ثلاث مرات على بر الأب، والجنة تحت أقدام الأمهات، وفي فقهها أحكام الحمل والوضع والرضاعة والحضانة والنفقة والميراث."
  en: "Motherhood in Islam is a bond of womb joined to a multiplied honour: the mother bears her child in weakness upon weakness, nurses him two full years, her dutifulness is named three times before the father's, Paradise lies beneath mothers' feet, and its fiqh carries the rulings of pregnancy, delivery, nursing, custody, maintenance and inheritance."
  ur: "اسلام میں مامتا رحم کا رشتہ ہے جس کے ساتھ بڑا اعزاز جڑا ہے: ماں اولاد کو مشقت پر مشقت اٹھاتی ہے، دو برس دودھ پلاتی ہے، اس کے ساتھ نیکی باپ سے تین بار مقدم ہے، جنت ماؤں کے قدموں تلے ہے، اور اس کے فقہ میں حمل، ولادت، دودھ، حضانت، نفقہ اور میراث کے احکام ہیں۔"
  es: "La maternidad en el Islam es un vínculo de vientre unido a un honor multiplicado: la madre lleva a su hijo en la adversidad, lo amamanta durante dos años completos, su deber es mencionado tres veces antes que el del padre, el Paraíso se encuentra bajo los pies de las madres, y su fiqh contiene las normas sobre el embarazo, el parto, la lactancia, la custodia, el sustento y la herencia."
