label:
  ar: "الصَّفِيّ"
  en: "Safi (the chosen share of the spoils taken by the Prophet before division: the majority view that it was his alone, Abu Thawr's view, and its end)"
  es: "Safi (la parte elegida del botín tomado por el Profeta antes de la división: la opinión mayoritaria de que le pertenecía solo a él, la opinión de Abu Thawr y su desenlace)"
  fr: "Safi (la part choisie du butin pris par le Prophète avant le partage: l’avis majoritaire selon lequel elle lui revenait exclusivement, l’avis d’Abu Thawr et sa conclusion)"
  ur: "صفی ⁦(تقسیم سے پہلے رسول اللہ کی طرف سے اٹھائے گئے مال غنیمت کا منتخب حصہ: اکثریت کا خیال ہے کہ یہ صرف آپ کا تھا، ابو ثور کا قول، اور اس کا خاتمہ)⁩"
  tr: "El-Safi"
  id: "Al-Safi"
summary:
  ar: "الصفي في اللغة الخالص من كل شيء، واستصفى الشيء اختاره، وفي اصطلاح الفقهاء شيء يختار من المغنم قبل القسمة كالجارية والعبد والثوب والسيف. ذهب الجمهور إلى أن الصفي كان للنبي خاصة، ولا يعلم مخالف إلا أبا ثور الذي رأى أن للإمام أخذه على نحو ما كان يأخذه النبي. وانقطاعه بعد النبي ثابت بإجماع الأمة، إذ لم يأخذه أبو بكر وعمر وعثمان ولا من بعدهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10406} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10407}"
  en: "In language safi is the pure part of anything, and istasfa means to choose. As a term it is a thing chosen from the booty before division, such as a slave-girl, a slave, a garment or a sword. The majority hold that the safi belonged to the Prophet alone; no dissenter is known except Abu Thawr, who held that the imam may take it in the manner the Prophet took it and give it the place of the Prophet's share of the fifth of the fifth. Ibn al-Mundhir says no one preceded Abu Thawr in this view. The Prophet's letter to the Banu Zuhayr ibn Uqaysh, with its mention of the fifth and the Prophet's chosen share, and the report of 'A'isha that Safiyya was from the safi, are cited. Its end after the Prophet is established by the consensus of the nation, since Abu Bakr, 'Umar and 'Uthman and later rulers did not take it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10406} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10407}"
  es: "En el idioma safi significa la parte pura de algo, e istasfa significa elegir. Como término, se refiere a algo elegido del botín antes de su reparto, como una esclava, un esclavo, una prenda de vestir o una espada. La mayoría sostiene que el safi pertenecía solo al Profeta; no se conoce ningún disidente excepto Abu Thawr, quien sostenía que el imán podía tomarlo de la misma manera que lo hizo el Profeta y darle el lugar de la parte del Profeta correspondiente a la quinta parte de la quinta. Ibn al-Mundhir afirma que nadie precedió a Abu Thawr en esta opinión. Se citan la carta del Profeta a los Banu Zuhayr ibn Uqaysh, con su mención de la quinta parte y la porción elegida por el Profeta, y el relato de Aisha de que Safiyya provenía del safi. Su fin después del Profeta está establecido por el consenso de la nación, ya que Abu Bakr, Umar, Uthman y gobernantes posteriores no lo tomaron. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10406} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10407}"
  fr: "En langue arabe, « safi » désigne la partie pure de toute chose, et « istasfa » signifie choisir. Ce terme désigne un objet choisi parmi le butin avant le partage, comme une esclave, un esclave, un vêtement ou une épée. La majorité considère que le « safi » appartenait exclusivement au Prophète; seul Abu Thawr, qui affirmait que l’imam pouvait le prendre comme le Prophète l’avait fait et lui attribuer la part du Prophète dans le cinquième du cinquième, est connu pour avoir exprimé une opinion dissidente. Ibn al-Mundhir rapporte que personne n’a précédé Abu Thawr sur ce point. On cite la lettre du Prophète aux Banu Zuhayr ibn Uqaysh, mentionnant le cinquième et la part choisie par le Prophète, ainsi que le récit d’Aïcha selon lequel la Safiyya provenait du « safi ». Son sort après le Prophète est établi par consensus, car ni Abu Bakr, ni Umar, ni Uthman, ni les souverains ultérieurs ne l’ont pris. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10406} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10407}"
  ur: "زبان میں صفی کسی بھی چیز کا خالص حصہ ہے اور استغفار کا مطلب انتخاب کرنا ہے۔ ایک اصطلاح کے طور پر یہ تقسیم سے پہلے مال غنیمت میں سے منتخب کی جانے والی چیز ہے، جیسے لونڈی، لونڈی، لباس یا تلوار۔ جمہور کا خیال ہے کہ صفی کا تعلق صرف نبی سے تھا۔ ابو ثور کے علاوہ کوئی اختلاف کرنے والا معلوم نہیں ہے، جس کا خیال تھا کہ امام اس کو لے سکتا ہے جیسا کہ نبی نے لیا تھا اور اسے نبی کے پانچویں حصے کا پانچواں حصہ دیا تھا۔ ابن المنذر کہتے ہیں کہ اس قول میں ابو ثور سے کسی نے سبقت نہیں کی۔ بنو زہیر بن عقیش کے نام رسول اللہ کا خط، جس میں پانچویں اور نبی کے منتخب حصہ کا ذکر ہے، اور عائشہ ا کی روایت ہے کہ صفیہ صفیہ میں سے تھیں۔ نبی کے بعد اس کا خاتمہ امت کے اجماع سے ہوتا ہے، کیونکہ ابوبکر، عمر، عثمان اور بعد کے حکمرانوں نے اسے قبول نہیں کیا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10406}"
  tr: "Dil olarak, 'Safi' her şeyden saftır ve 'İstifa' onun seçtiği bir şeydir. Fıkıh terminolojisinde, bölünmeden önce ganimetlerden seçilen bir şeydir; örneğin köle, köle, giysi ve kılıç. Çoğunluk, Safi'nin yalnızca Peygamber'e ait olduğunu savunur ve karşıtını kimse bilmez, sadece Ebu Tewr bilir; o da imamın onu Peygamber gibi alması gerektiğine inanır. Peygamber'den sonra sona ermesi, Ebu Bekir, Ömer, Osman veya onlardan sonrakilerin almaması nedeniyle ümmetin birliğiyle belirlenir. {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.10406} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.10407}"
  id: "Dalam bahasa, 'Safi' murni dari segala hal, dan 'Istifa' adalah sesuatu yang dipilihnya. Dalam terminologi firisprudensi, itu adalah sesuatu yang dipilih dari rampasan sebelum pembagian, seperti budak, budak, pakaian, dan pedang. Mayoritas berpendapat bahwa Safi itu hanya untuk Nabi, dan tidak ada yang tahu lawan kecuali Abu Thawr, yang percaya bahwa Imam harus menerimanya seperti Nabi. Penghentiannya setelah Nabi ditetapkan atas kesepakatan Ummah, karena Abu Bakr, Umar, Uthman, atau mereka yang setelahnya tidak mengambilnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.10406} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.10407}"
