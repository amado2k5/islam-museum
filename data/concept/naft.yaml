label: { ar: "النَّفْط", en: "Naft (petroleum)", ur: "نفط (تیل)" }
summary:
  ar: "النفط في اللغة الدهن الذي تطلى به الإبل للجرب، وعند الفقهاء أحد الأجزاء المستقرة التي ركبها الله في الأرض، وهو دهن يعلو الماء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15861} وجمهور الفقهاء على أنه لا زكاة في معدن النفط، وقال الحنابلة وقول شاذ للشافعية بوجوب ربع العشر فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15861} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15862} والحنفية والشافعية والحنابلة لا يملكون المعادن الظاهرة كالنفط بالإحياء ولا يجوز إقطاعها، والمالكية يجعلون أمرها إلى الإمام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15862} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15863}"
  en: "Naft, in the lexicon, is an oil that camels are smeared with against mange; as a term it is one of the fixed substances God placed in the earth at its creation, an oil that floats on water. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15861} Most jurists hold that a petroleum mine owes no zakat; the Hanbalis and an odd Shafi'i view require a quarter of a tenth. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15861} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15862} The Hanafis, Shafi'is and Hanbalis hold that such apparent mines are not owned by revival and may not be granted; the Malikis leave the matter to the ruler, who may grant them for use without ownership. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15862} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15863}"
  ur: "نفط لغت میں وہ تیل ہے جو اونٹوں کو خارش سے بچانے کے لیے ملا جاتا ہے، اور اصطلاح میں زمین کے ثابت اجزاء میں سے ایک ہے، جو پانی پر تیرتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15861} جمہور کے نزدیک تیل کی کان میں زکوٰۃ نہیں، جبکہ حنابلہ اور شافعیہ کے ایک شاذ قول کے مطابق ربع عشر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15862} حنفیہ، شافعیہ اور حنابلہ کے نزدیک ظاہری کانیں احیاء سے ملکیت میں نہیں آتیں اور ان کی جاگیر نہیں دی جا سکتی، جبکہ مالکیہ کے نزدیک امام اس کا فیصلہ کرتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15862} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15863}"
