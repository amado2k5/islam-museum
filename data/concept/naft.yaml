summary:
  ar: "النفط في الكتاب أبيض معروف وأسود هو صفوة القار البابلي، حار يابس إلى الرابعة، لطيف محلل مذيب مفتح للسدد، وينفع المفاصل والأذن والعين والصدر ويقتل الديدان ويدر البول {cite:canon-ibn-sina-print-v1 p.581}."
  en: "Naft, naphtha, is in the book white, the well known kind, and black, the pure of Babylonian pitch; hot and dry to the fourth degree, fine, dissolving, melting and opening obstructions; it helps joints, ear, eye and chest, kills worms and provokes urine {cite:canon-ibn-sina-print-v1 p.581}."
  ur: "نفط کتاب میں سفید ہے جو معروف قسم ہے اور سیاہ جو بابلی قار کا خلاصہ ہے؛ چوتھے درجے تک گرم خشک، لطیف، تحلیل کرنے اور گھلانے والا اور سدے کھولنے والا؛ جوڑوں، کان، آنکھ اور سینے میں مفید ہے، کیڑے مارتا اور پیشاب جاری کرتا ہے {cite:canon-ibn-sina-print-v1 p.581}۔"
  es: "Naft, nafta, es en el libro blanco, el tipo conocido, y negro, el puro de brea babilónica; caliente y seco hasta el cuarto grado, fino, disolvente, fundidor y desobstrucciones; ayuda a las articulaciones, oídos, ojos y pecho, mata gusanos y provoca la micción {cite:canon-ibn-sina-print-v1 p.581}."
  fr: "Le naft, ou naphte, est décrit dans le livre comme blanc, la variété bien connue, et noir, le pur poix babylonien; chaud et sec au quatrième degré, fin, dissolvant, fondant et ouvrant les obstructions; il aide les articulations, les oreilles, les yeux et la poitrine, tue les vers et provoque la diurèse {cite:canon-ibn-sina-print-v1 p.581}."
