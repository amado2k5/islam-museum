summary:
  ar: "الرئة في الكتاب غذاؤها قليل يميل إلى البلغمية وفيه نظر، وهي سهلة الانهضام وفيها عقل للبطن، ويذكر الكتاب أن رئة الجمل ورئة الخنزير تشفي سحج الخف، وأن رئة الثعلب إذا جففت وشربت نفعت من الربو {cite:canon-ibn-sina-print-v1 p.668}"
  en: "Ria is in the book the lung, whose nourishment is little and inclines to the phlegmatic, with room for examination; it is easily digested and has a binding in it for the belly; the book reports that the lung of the camel and of the pig heal chafing from the sock, and that the lung of the fox, dried and drunk, benefits asthma {cite:canon-ibn-sina-print-v1 p.668}"
  ur: "رئہ کتاب میں پھیپھڑا ہے، جس کی غذائیت کم ہے اور بلغمی کی طرف مائل ہے، اور اس میں غور کی گنجائش ہے؛ اس کا ہضم آسان ہے اور اس میں پیٹ کے لیے قبض ہے؛ کتاب روایت کرتی ہے کہ اونٹ اور خنزیر کا پھیپھڑا موزے کی رگڑ کے زخم کو ٹھیک کرتا ہے، اور لومڑی کا پھیپھڑا خشک کر کے پیا جائے تو دمے میں نافع ہے {cite:canon-ibn-sina-print-v1 p.668}۔"
  es: "En el libro se menciona que el pulmón, cuya nutrición es escasa y tiende a ser flemática, es susceptible de examen; se digiere fácilmente y contiene un ligamento para el estómago. El libro indica que el pulmón del camello y del cerdo cura las rozaduras causadas por los calcetines, y que el pulmón del zorro, seco y bebido, beneficia el asma. {cite:canon-ibn-sina-print-v1 p.668}"
  fr: "Le poumon, décrit dans le livre, est peu nutritif et de nature flegmatique, et mérite d'être examiné; il est facile à digérer et possède des propriétés apaisantes pour l'estomac; le livre rapporte que le poumon de chameau et de porc guérit les irritations dues aux chaussettes, et que le poumon de renard, séché et bu, est bénéfique contre l'asthme {cite:canon-ibn-sina-print-v1 p.668}"
  tr: "Kitaptaki akciğerler az besin içerir, balgam eğilimindedir ve bir mizah anlayışı vardır. Sindirilmesi kolaydır ve karın için bir zihin barındırır. Kitapta, deve ve domuzların akciğerlerinin çorapların sajr ağrısını iyileştirdiği ve tilkinin akciğerinin kurutulup içildiğinde astım için faydalı olduğu belirtilir {cite:canon-ibn-sina-print-v1 s.668}"
  id: "Paru-paru dalam buku ini kurang nutrisi, cenderung ke arah dahak, dan ada selera humor. Paru-paru ini mudah dicerna dan mengandung pikiran untuk perut. Buku menyebutkan bahwa paru-paru unta dan babi menyembuhkan sakit pada kaos kaki, dan paru-paru rubah, jika dikeringkan dan diminum, bermanfaat untuk asma {cite:canon-ibn-sina-print-v1 hlm.668}"
