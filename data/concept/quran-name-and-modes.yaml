id: concept/quran-name-and-modes
class: concept
kind: term
label: {ar: "اسم القرآن ووسيلتا تلاوته: الحفظ والكتابة", en: "The name Quran and its two modes: memory and writing", es: "El nombre Corán y sus dos modalidades: memorización y escritura.", fr: "Le nom Coran et ses deux modes: mémorisation et écriture"}
summary:
  ar: "يذكر الشعراوي أن «قرآن» مصدر من قرأ، فيدل اسمه على التلاوة، وأن الله سمّاه كتاباً فيدل على الكتابة، فللقرآن وسيلتان: يُحفظ في الصدور ويُسجَّل في السطور {cite:tafsir-sharawi-khawatir-scan p.14}."
  en: "Sha'rawi notes that the word Quran is a verbal noun from qara'a (to read), so its name points to recitation, and that God calls it a Book, which points to writing. The Quran therefore has two modes: it is kept in hearts and recorded in lines {cite:tafsir-sharawi-khawatir-scan p.14}."
  es: "Sha'rawi señala que la palabra Corán es un sustantivo verbal derivado de qara'a (leer), por lo que su nombre apunta a la recitación, y que Dios lo llama Libro, lo que apunta a la escritura. Por lo tanto, el Corán tiene dos modalidades: se guarda en los corazones y se registra en versículos {cite:tafsir-sharawi-khawatir-scan p.14}."
  fr: "Sha'rawi remarque que le mot Coran est un nom verbal dérivé de qara'a (lire), son nom renvoyant ainsi à la récitation, et que Dieu le qualifie de Livre, ce qui renvoie à l'écriture. Le Coran possède donc deux modes de transmission: il est conservé dans les cœurs et consigné par écrit (voir: Tafsir de Sha'rawi Khawatir, p. 14)."
