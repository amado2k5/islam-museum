label: { ar: "اسم القرآن ووسيلتا تلاوته: الحفظ والكتابة", en: "The name Quran and its two modes: memory and writing" }
summary:
  ar: "يذكر الشعراوي أن «قرآن» مصدر من قرأ، فيدل اسمه على التلاوة، وأن الله سمّاه كتاباً فيدل على الكتابة، فللقرآن وسيلتان: يُحفظ في الصدور ويُسجَّل في السطور {cite:tafsir-sharawi-khawatir-scan p.14}."
  en: "Sha'rawi notes that the word Quran is a verbal noun from qara'a (to read), so its name points to recitation, and that God calls it a Book, which points to writing. The Quran therefore has two modes: it is kept in hearts and recorded in lines {cite:tafsir-sharawi-khawatir-scan p.14}."
