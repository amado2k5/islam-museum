label: { ar: "الإسناد", en: "Isnad" }
summary:
  ar: "الإسناد سلسلة الرجال الموصلة إلى متن الحديث: «حدثنا فلان عن فلان» حتى تنتهي الرواية إلى النبي أو الصحابي؛ به عرف المحدثون صحة الخبر من ضعفه، فدرسوا الرجال عدالةً وضبطاً، واتصال السند من انقطاعه. وقد افتتح مسلم صحيحه بالكلام على عظمة الإسناد وصيانته من الكذب، وفيه عن ابن المبارك «الإسناد من الدين، ولولا الإسناد لقال من شاء ما شاء» {cite:sahih-muslim muqaddima}، حتى قيل إنه من خصائص هذه الأمة."
  en: "The isnad is the chain of men linking a hadith's text back to the Prophet or a Companion — 'so-and-so told us from so-and-so'; by it the muhaddithun judged a report sound or weak, examining narrators for integrity and precision and the chain for continuity. Muslim opened his Sahih with the isnad's dignity and its guarding against fabrication, so that it came to be counted among this community's distinguishing marks."
