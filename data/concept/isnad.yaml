label: { ar: "الإسناد", en: "Isnad", es: "Isnad", fr: "Isnad", ur: "اسناد", tr: "Atıf", id: "Atribusi" }
summary:
  ar: "الإسناد سلسلة الرجال الموصلة إلى متن الحديث: «حدثنا فلان عن فلان» حتى تنتهي الرواية إلى النبي أو الصحابي؛ به عرف المحدثون صحة الخبر من ضعفه، فدرسوا الرجال عدالةً وضبطاً، واتصال السند من انقطاعه. وقد افتتح مسلم صحيحه بالكلام على عظمة الإسناد وصيانته من الكذب {cite:sahih-muslim muqaddima}. وتذكر دائرة المعارف الإسلامية أن الحاجة إلى الإسناد نمت مع تقدم القرن الأول، وأن مجموعات القرن الثالث فصاعدًا تورد الأسانيد كاملة، وتعرض مصطلحاته وطرق تلقي الرواية، كما تعرض آراء الباحثين الغربيين في نمو الأسانيد."
  en: "The isnad is the chain of men linking a hadith's text back to the Prophet or a Companion, by which the muhaddithun judged a report sound or weak, examining narrators and the chain's continuity. Muslim opened his Sahih with the isnad's dignity and its guarding against fabrication. The Encyclopaedia of Islam says the need to state one's authority grew as the first century advanced and that collections from the 3rd/9th century on give complete isnads; it sets out the technical terms and the ways of receiving a transmission, and reports the views of Western scholars on the growth of isnads."
  ur: "اسناد راویوں کا وہ سلسلہ ہے جو حدیث کے متن کو نبی یا صحابی تک پہنچاتا ہے؛ اسی سے محدثین نے روایت کی صحت اور ضعف پرکھا، راویوں اور سند کے اتصال کو دیکھ کر۔ مسلم نے اپنی صحیح کا آغاز اسناد کی عظمت اور اس کے جھوٹ سے محفوظ رہنے پر گفتگو سے کیا۔ انسائیکلوپیڈیا آف اسلام کہتا ہے کہ پہلی صدی کے بڑھنے کے ساتھ اپنے مآخذ بیان کرنے کی ضرورت پیدا ہوئی اور تیسری صدی ہجری سے مجموعوں میں مکمل اسناد دی گئیں؛ وہ اصطلاحات اور روایت حاصل کرنے کے طریقے بتاتا ہے اور اسناد کے ارتقا پر مغربی علما کی آرا بھی نقل کرتا ہے۔"
  es: "El isnad es la cadena de narradores que vincula el texto de un hadiz con el Profeta o un Compañero, mediante la cual el muhaddithun juzgaba la autenticidad de un relato, examinando a los narradores y la continuidad de la cadena. Muslim inició su Sahih destacando la importancia del isnad y su función de protección contra la falsificación. La Enciclopedia del Islam afirma que la necesidad de declarar la propia autoridad creció a medida que avanzaba el siglo I y que las colecciones a partir del siglo III/IX ofrecen isnads completos; expone los términos técnicos y las formas de recibir una transmisión, e informa sobre las opiniones de los eruditos occidentales respecto al desarrollo de los isnads."
  fr: "L'isnad est la chaîne de transmission d'un hadith remontant au Prophète ou à un Compagnon. C'est grâce à elle que les muhaddithun (examinateurs du hadith) jugeaient la véracité d'un hadith, en examinant les narrateurs et la continuité de la chaîne. Muslim ouvre son Sahih en soulignant l'importance de l'isnad et son rôle de rempart contre la falsification. L'Encyclopédie de l'Islam indique que la nécessité de justifier son autorité s'est accrue au cours du premier siècle et que les recueils à partir du IIIe/IXe siècle présentent des isnads complets. Elle expose la terminologie technique et les modalités de transmission, et rend compte des points de vue des érudits occidentaux sur le développement des isnads."
  tr: "Rivayet zinciri, hadisin ana metnine bağlanan insan zinciridir: \"Şu falanca bize falancıdan rivayet edilmiştir,\" ta ki rivayet Peygamber'e veya Sahabe'ye ulaşana kadar; bu sayede hadis âlimleri rivayetin doğruluğunu zayıflığından ayırmış, rivayetçileri adalet ve doğrulukla incelemiş ve zincirin bağlantısı bağlantısını incelemiştir. Müslüm, sahih'ine zincirin büyüklüğünü ve yalandan korunmasını tartışarak açar {atıf:sahih-müqaddima}. İslam Ansiklopedisi, isnad ihtiyacının birinci yüzyılın ilerlemesiyle arttığını ve üçüncü yüzyıldan itibaren yapılan koleksiyonların terimlerini ve rivayet alma yöntemlerini ve Batılı araştırmacıların aktarım zincirlerinin gelişimine dair görüşlerini sunduğunu belirtir."
  id: "Rantai riwayat adalah rantai manusia yang terhubung ke teks utama hadis: \"Si Anu diceritakan kepada kami dari si anu,\" sampai riwayat sampai kepada Nabi atau Sahabat; melalui ini, para ulama hadis mengenali keaslian laporan dari kelemahannya, sehingga mereka mempelajari narator dengan adil dan akurat, serta keterhubungan rantai dari pemutusannya. Muslim membuka Sahihnya dengan membahas kebesaran rantai dan pemeliharaannya dari kebohongan {cite:sahih-muslim muqaddima}. Ensiklopedia Islam menyebutkan bahwa kebutuhan akan isnad tumbuh seiring kemajuan abad pertama, dan koleksi sejak abad ketiga dan seterusnya menyediakan rantai transmisi lengkap, menyajikan istilah dan metode penerimaan narasi, serta pandangan peneliti Barat tentang perkembangan rantai transmisi."
