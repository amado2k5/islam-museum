id: concept/canon-care-of-the-newborn-cord-and-salting
class: concept
kind: scientific
label:
  ar: "تدبير المولود: قطع السرة والتمليح"
  en: "Care of the newborn: cutting the cord and salting"
  fr: "Soins du nouveau-né : cordon et salage"
  ur: "نومولود کی تدبیر: ناف کاٹنا اور نمک ملنا"
  es: "Cuidado del recién nacido: cortar el cordón umbilical y salar"
  tr: "Yeni doğan bakımı: göbek kesimi ve tuzlama"
  id: "Perawatan bayi baru lahir: memotong pusar dan menggaram"
summary:
  ar: "يبدأ التعليم الأول في التربية بالفصل الأول في تدبير المولود إلى أن ينهض، فيذكر ما قال به جماعة من الفضلاء من قطع السرة فوق أربع أصابع وربطها بصوف نقي، وذر دواء عليها، وتمليح البدن بماء ملح رقيق لتقوية الجلد {cite:canon-ibn-sina-print-v1 pp.203-204}."
  en: "Taʿlim 1 of Fann 3, on upbringing, opens with chapter 1, the management of the newborn until it stands. Ibn Sina reports what a group of learned men said: cut the cord four fingers from the body, tie it with clean wool, powder it with a drug, and salt the body with thin brine to firm the skin {cite:canon-ibn-sina-print-v1 pp.203-204}."
  fr: "Le premier ta'lim du troisième fann, sur l’éducation, s’ouvre sur les soins du nouveau-né jusqu’à la station debout. Ibn Sina rapporte l’avis de savants : couper le cordon à quatre doigts du corps, le lier de laine propre, le poudrer d’un remède et saler le corps à la saumure légère pour raffermir la peau {cite:canon-ibn-sina-print-v1 pp.203-204}."
  es: "Taʿlim 1 de Fann 3, sobre la crianza, comienza con el capítulo 1, el cuidado del recién nacido hasta que se pone de pie. Ibn Sina relata lo que dijo un grupo de hombres sabios: cortar el cordón umbilical a cuatro dedos del cuerpo, atarlo con lana limpia, espolvorearlo con un medicamento y salar el cuerpo con salmuera ligera para reafirmar la piel {cite:canon-ibn-sina-print-v1 pp.203-204}."
  ur: "فین 3 کا تلم 1، پرورش پر، باب 1 کے ساتھ کھلتا ہے، نوزائیدہ کا انتظام اس وقت تک ہوتا ہے جب تک وہ کھڑا نہ ہو۔ ابن سینا بیان کرتے ہیں کہ عالموں کے ایک گروہ نے کیا کہا: ہڈی کو جسم سے چار انگلیاں کاٹیں، اسے صاف اون سے باندھیں، اسے کسی دوا سے پاؤڈر کریں، اور جلد کو مضبوط کرنے کے لیے پتلی نمکین پانی سے جسم کو نمک دیں۔"
  tr: "Yetiştirilme eğitimi, yenidoğanın kalkmasına kadar ilk bölümde yönetilmesiyle başlar. Bir grup erdemli insanın dediğini hatırlar: göbeğin dört parmağının üzerinden kesilmesi, saf yünle bağlanması, üzerine ilaç serpilmesi ve cildi güçlendirmek için vücuda ince tuzlu su konması {cite:canon-ibn-sina-print-v1 s.203-204}."
  id: "Pendidikan utama dalam pengasuhan dimulai dengan bab pertama tentang merawat bayi baru lahir hingga ia bangkit. Ia mengingat apa yang dikatakan sekelompok orang berbudi luhur: memotong pusar di atas empat jari, mengikatnya dengan wol murni, menaburkan obat, dan menggaram tubuh dengan air garin tipis untuk memperkuat kulit {cite:canon-ibn-sina-print-v1 hlm.203-204}."
