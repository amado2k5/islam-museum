summary:
  ar: "يبدأ التعليم الأول في التربية بالفصل الأول في تدبير المولود إلى أن ينهض، فيذكر ما قال به جماعة من الفضلاء من قطع السرة فوق أربع أصابع وربطها بصوف نقي، وذر دواء عليها، وتمليح البدن بماء ملح رقيق لتقوية الجلد {cite:canon-ibn-sina-print-v1 pp.203-204}."
  en: "Taʿlim 1 of Fann 3, on upbringing, opens with chapter 1, the management of the newborn until it stands. Ibn Sina reports what a group of learned men said: cut the cord four fingers from the body, tie it with clean wool, powder it with a drug, and salt the body with thin brine to firm the skin {cite:canon-ibn-sina-print-v1 pp.203-204}."
