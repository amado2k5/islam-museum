label: { ar: "الإسلام وسلطان العقل والعلم", en: "Islam and the authority of reason and science", es: "El Islam y la autoridad de la razón y la ciencia.", fr: "L'islam et l'autorité de la raison et de la science", ur: "اسلام اور عقل اور سائنس کی اتھارٹی", tr: "İslam ve Akıl ile Bilimin Otoritesi", id: "Islam dan Otoritas Akal dan Ilmu Pengetahuan" }
summary:
  ar: "يعرض محمد فريد وجدي أن الإسلام يدعو إلى النظر والتفكير وطلب البرهان ونبذ التقليد الأعمى، ويرى أن القرآن كله قائم على هذه الأصول {cite:al-islam-din-amm-khalid-azhar p. 73}. ويورد حديثاً في أن الدين هو العقل، وتذكر الحاشية أن النسائي حكم عليه بالبطلان {cite:al-islam-din-amm-khalid-azhar p. 74}، فلا يُنسب الحديث إلى النبي إلا بالتحقق من درجته. ويرى المؤلف أن الإسلام انتشر «بلا دعوة ولا إكراه»، وهذا من آرائه وتُعرض معه وجهات النظر الأخرى {cite:al-islam-din-amm-khalid-azhar p. 73}."
  en: "Wajdi argues that Islam calls for reflection, demanding proof and rejecting blind imitation, and that the whole Qur'an rests on these principles {cite:al-islam-din-amm-khalid-azhar p. 73}. He quotes a saying equating religion with reason, but the footnote records al-Nasa'i's judgement that it is baseless {cite:al-islam-din-amm-khalid-azhar p. 74}. His claim that Islam spread without compulsion is the author's view and is presented with other views {cite:al-islam-din-amm-khalid-azhar p. 73}."
  es: "Wajdi argumenta que el Islam exige reflexión, pruebas y rechaza la imitación ciega, y que todo el Corán se fundamenta en estos principios {cite:al-islam-din-amm-khalid-azhar p. 73}. Cita un dicho que equipara la religión con la razón, pero la nota al pie recoge la opinión de al-Nasa'i de que carece de fundamento {cite:al-islam-din-amm-khalid-azhar p. 74}. Su afirmación de que el Islam se extendió sin coacción es la opinión del autor y se presenta junto con otras opiniones {cite:al-islam-din-amm-khalid-azhar p. 73}."
  fr: "Wajdi soutient que l'islam invite à la réflexion, exige des preuves et rejette l'imitation aveugle, et que le Coran tout entier repose sur ces principes (voir: al-islam-din-amm-khalid-azhar, p. 73). Il cite un hadith assimilant la religion à la raison, mais la note de bas de page indique que, selon al-Nasa'i, cette assimilation est sans fondement (voir: al-islam-din-amm-khalid-azhar, p. 74). Son affirmation selon laquelle l'islam s'est répandu sans contrainte est le point de vue de l'auteur et est présentée aux côtés d'autres points de vue (voir: al-islam-din-amm-khalid-azhar, p. 73)."
  ur: "وجدی کا استدلال ہے کہ اسلام غور و فکر کرنے، ثبوت مانگنے اور اندھی تقلید کو رد کرنے کا مطالبہ کرتا ہے، اور یہ کہ پورا قرآن ان اصولوں پر قائم ہے۔ 73}۔ اس نے ایک قول نقل کیا ہے جس میں مذہب کو استدلال کے ساتھ مساوی کیا گیا ہے، لیکن حاشیہ النسائی کے اس فیصلے کو درج کرتا ہے کہ یہ بے بنیاد ہے۔ 74}۔ ان کا یہ دعویٰ کہ اسلام بغیر جبر کے پھیلا، مصنف کا نظریہ ہے اور اسے دوسرے خیالات کے ساتھ پیش کیا گیا ہے۔ 73}۔"
  tr: "Muhammed Farid Wajdi, İslam'ın düşünmeyi, telaş yapmayı, delil aramayı ve körü körüne takliti reddetmeyi çağırdığını ve tüm Kur'an'ın bu ilkelere dayandığına inandığını belirtir {cite:al-islam-din-amm-khalid-azhar s. 73}. Ayrıca dinin akıl olduğunu anlatır ve kenar notlarında el-Nasa'i'nin onu geçersiz saydığını belirtir {cite:al-islam-din-amm-khalid-azhar s. 74}, bu nedenle hadisin Peygamber'e ancak rütbesi doğrulanarak atfedilir. Yazar, İslam'ın \"davet veya zorlamadan\" yayıldığına inanır; bu onun görüşlerinden biridir ve başka görüşler sunar {cite:al-islam-din-amm-khalid-azhar s. 73}."
  id: "Muhammad Farid Wajdi menyajikan bahwa Islam menuntut refleksi, refleksi, mencari bukti, dan menolak peniruan buta, serta percaya bahwa seluruh Al-Qur'an didasarkan pada prinsip-prinsip ini {cite:al-islam-din-amm-khalid-azhar hlm. 73}. Ia juga menceritakan bahwa agama adalah akal, dan catatan di pinggir menyebutkan bahwa al-Nasa'i menyatakan agama itu tidak sah {cite:al-islam-din-amm-khalid-azhar hlm. 74}, sehingga hadis tersebut tidak dikaitkan dengan Nabi kecuali dengan memverifikasi pangkatnya. Penulis percaya bahwa Islam menyebar \"tanpa undangan atau paksaan,\" yang merupakan salah satu pandangannya dan menyajikan sudut pandang lain {cite:al-islam-din-amm-khalid-azhar hlm. 73}."
