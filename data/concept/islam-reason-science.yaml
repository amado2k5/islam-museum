label: { ar: "الإسلام وسلطان العقل والعلم", en: "Islam and the authority of reason and science" }
summary:
  ar: "يعرض محمد فريد وجدي أن الإسلام يدعو إلى النظر والتفكير وطلب البرهان ونبذ التقليد الأعمى، ويرى أن القرآن كله قائم على هذه الأصول {cite:al-islam-din-amm-khalid-azhar p. 73}. ويورد حديثاً في أن الدين هو العقل، وتذكر الحاشية أن النسائي حكم عليه بالبطلان {cite:al-islam-din-amm-khalid-azhar p. 74}، فلا يُنسب الحديث إلى النبي إلا بالتحقق من درجته. ويرى المؤلف أن الإسلام انتشر «بلا دعوة ولا إكراه»، وهذا من آرائه وتُعرض معه وجهات النظر الأخرى {cite:al-islam-din-amm-khalid-azhar p. 73}."
  en: "Wajdi argues that Islam calls for reflection, demanding proof and rejecting blind imitation, and that the whole Qur'an rests on these principles {cite:al-islam-din-amm-khalid-azhar p. 73}. He quotes a saying equating religion with reason, but the footnote records al-Nasa'i's judgement that it is baseless {cite:al-islam-din-amm-khalid-azhar p. 74}. His claim that Islam spread without compulsion is the author's view and is presented with other views {cite:al-islam-din-amm-khalid-azhar p. 73}."
