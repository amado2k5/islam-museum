summary:
  ar: "يقول ابن سينا إن صباري جنون مفرط يعرض مع سرسام حار صفراوي، ويفرقه عن قرانيطس الساذج بأن الجنون والورم فيه حادثان معاً عن المادة، ويذكر علاماته وأن علاجه علاج السرسام الصفراوي مع زيادة في الترطيب {cite:canon-ibn-sina-print-v2 p.83} {cite:canon-ibn-sina-print-v2 p.84}"
  en: "Ibn Sina says sabari is an excessive madness that comes with a hot bilious sarsam, tells it from simple qaranitus in that the madness and the swelling in it both arise together from the matter, gives its signs, and says its treatment is that of the bilious sarsam with much added moistening {cite:canon-ibn-sina-print-v2 p.83} {cite:canon-ibn-sina-print-v2 p.84}"
  ur: "ابن سینا کہتا ہے کہ صباری حد سے بڑھا ہوا جنون ہے جو گرم صفراوی سرسام کے ساتھ آتا ہے، اسے سادہ قرانیطس سے یوں الگ کرتا ہے کہ اس میں جنون اور سوجن دونوں مادے سے ساتھ پیدا ہوتے ہیں، اس کی علامات بتاتا ہے، اور کہتا ہے کہ اس کا علاج صفراوی سرسام کا علاج ہے اور تر کرنے میں بہت اضافہ {cite:canon-ibn-sina-print-v2 p.83} {cite:canon-ibn-sina-print-v2 p.84}۔"
  es: "Ibn Sina dice que el sabari es una locura excesiva que viene con un sarsam biliar caliente, lo explica a partir de un qaranitus simple en el sentido de que la locura y la hinchazón que lo acompaña surgen juntas de la materia, da sus signos y dice que su tratamiento es el del sarsam biliar con mucha humectación añadida {cite:canon-ibn-sina-print-v2 p.83} {cite:canon-ibn-sina-print-v2 p.84}"
  fr: "Ibn Sina affirme que le sabari est une folie excessive accompagnée d'un sarsam bilieux et brûlant. Il l'explique par de simples qaranitus, en précisant que la folie et le gonflement qui en résulte proviennent simultanément de la matière. Il en donne les signes et indique que son traitement consiste à hydrater abondamment le sarsam bilieux. {cite:canon-ibn-sina-print-v2 p.83} {cite:canon-ibn-sina-print-v2 p.84}"
  tr: "İbn Sina, kaktüsün sıcak safra tırtılıyla sergilenen aşırı bir delilik olduğunu, naif Corintus'tan ayırır; çünkü delilik ve tümör maddeden aynı anda ortaya çıkar. Belirtilerini ve tedavisinin safra yoluyla ve artan nemlendirme ile gerçekleştiğini belirtir {cite:canon-ibn-sina-print-v2 s.83} {cite:canon-ibn-sina-print-v2 s.84}"
  id: "Ibn Sina mengatakan bahwa kaktus adalah kegilaan berlebihan yang ditunjukkan oleh ulat empedu panas, membedakannya dari Corinthus yang naif karena kegilaan dan tumor terjadi bersamaan dengan zat tersebut. Ia menyebutkan tanda-tandanya dan bahwa pengobatannya bersifat empedu dengan peningkatan hidrasi {cite:canon-ibn-sina-print-v2 hlm.83} {cite:canon-ibn-sina-print-v2 hlm.84}"
