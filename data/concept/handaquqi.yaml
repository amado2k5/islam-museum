summary:
  ar: "الحندقوقي نبات برّي وبستاني ومصري، يُتخذ من بزره خبز؛ البستاني معتدل الجلاء والتجفيف، والبرّي فيه قبض مع تسخين، ودهنه للرياح الغليظة، وينفع من أوجاع المفاصل وتطلع منه عصارة للبياض والغشاوة في العين."
  en: "Handaquqi is a plant that has wild, cultivated and Egyptian kinds; its seed is made into bread. The cultivated kind cleanses and dries moderately; the wild has binding with warmth. Its oil helps thick wind and joint pains; the juice of the cultivated kind, especially with honey, helps whiteness and cloud of the eye."
  ur: "حندقوقی ایک پودا ہے جس کی جنگلی، باغی اور مصری قسمیں ہیں؛ اس کے بیج سے روٹی بنائی جاتی ہے۔ باغی قسم معتدل صفائی اور خشکی رکھتی ہے، جنگلی میں گرمی کے ساتھ کسیلاپن ہے؛ اس کا تیل گاڑھی ہوا اور جوڑوں کے درد میں مفید ہے، اور باغی کا رس، خاص کر شہد کے ساتھ، آنکھ کی سفیدی اور دھندلاہٹ میں نفع دیتا ہے۔"
  es: "Handaquqi es una planta que tiene variedades silvestres, cultivadas y egipcias; con sus semillas se elabora pan. La variedad cultivada limpia y seca moderadamente; la silvestre tiene propiedades astringentes y cálidas. Su aceite ayuda a aliviar la congestión nasal y los dolores articulares; el jugo de la variedad cultivada, especialmente con miel, ayuda a aclarar la piel y a disipar la opacidad ocular."
  fr: "L'handaquqi est une plante qui se décline en variétés sauvages, cultivées et égyptiennes; ses graines servent à la confection de pain. La variété cultivée purifie et asséche modérément; la variété sauvage a des propriétés astringentes et réchauffantes. Son huile soulage les ballonnements et les douleurs articulaires; le jus de la variété cultivée, notamment associé au miel, contribue à éclaircir le regard et à dissiper la confusion oculaire."
  tr: "Al-Handqooqi, tohumundan ekmek olarak yapılan yabani, bahçecilik ve Mısır bitkisidir; bahçıvan orta derecede kurutulmuş ve kurutulmuşken, yabani ısı ile sıkıdır, güçlü rüzgarlara uygulanır ve eklem ağrıları için faydalıdır, beyazlık ve göz bulanıklığı için özsuyu üretir."
  id: "Al-Handqooqi adalah tanaman liar, hortikultura, dan Mesir yang dibuat dari bijinya sebagai roti; tukang kebun memiliki kering dan kering sedang, sedangkan tanaman liar sangat ketat, diaplikasikan pada angin kencang, dan bermanfaat untuk nyeri sendi, menghasilkan getah untuk putih dan keruh."
