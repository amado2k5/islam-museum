summary:
  ar: "جوز في مقدار العفص، سهل الكسر، رقيق القشر، طيب الرائحة، حاد؛ وفي الهامش أنه جوز الطيب {cite:canon-ibn-sina-print-v1 p.416}."
  en: "A nut the size of a gall-nut, easy to break, thin-shelled, fragrant and sharp; the editor's footnote gives it as nutmeg {cite:canon-ibn-sina-print-v1 p.416}."
  ur: "ایک گری جو مازو کے برابر ہے، آسانی سے ٹوٹتی ہے، پتلے چھلکے والی، خوشبودار اور تیز ہے؛ حاشیے کے مطابق یہ جوزالطیب ہے {cite:canon-ibn-sina-print-v1 p.416}۔"
  es: "Una nuez del tamaño de una agalla, fácil de romper, de cáscara fina, fragante y afilada; la nota al pie del editor la identifica como nuez moscada {cite:canon-ibn-sina-print-v1 p.416}."
  fr: "Une noix de la taille d'une noix de galle, facile à casser, à coque mince, parfumée et pointue; la note de bas de page de l'éditeur la désigne comme noix de muscade {cite:canon-ibn-sina-print-v1 p.416}."
  tr: "Tanen boyutunda ceviz, kolay kırılır, ince kabuklu, kokulu, keskin; kenarda muskat cevizi {cite:canon-ibn-sina-print-v1 s.416}."
  id: "Kenari berukuran tanin, mudah pecah, kulit tipis, harum, tajam; di pinggir, palanya {cite:canon-ibn-sina-print-v1 hlm.416}."
