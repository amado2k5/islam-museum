summary:
  ar: "عدّه مالك فيما يعقر الناس ويعدو عليهم ويخافهم مثل الأسد والفهد والذئب، فهو في حكم الكلب العقور يقتله المحرم ولا جناح عليه."
  en: "Malik counted it among what attacks people and strikes fear — like the lion, the cheetah and the wolf — so it carries the ruling of the rabid dog: the pilgrim may kill it without sin."
  ur: "مالک نے اسے ان درندوں میں گنا جو انسانوں پر حملہ کرتے ہیں — شیر، چیتے اور بھیڑیے کی طرح — اس لیے اسے آکرت کتے کی حکم دیا: محرم اسے بلا جرم مار سکتا ہے۔"
  es: "Malik lo incluyó entre los animales que atacan a las personas e infunden miedo, como el león, el guepardo y el lobo, por lo que se le aplica la misma regla que al perro rabioso: el peregrino puede matarlo sin pecar."
  fr: "Malik le comptait parmi ceux qui attaquent les hommes et inspirent la peur — comme le lion, le guépard et le loup — et il est donc soumis à la même règle que le chien enragé: le pèlerin peut le tuer sans commettre de péché."
  tr: "Malik'in saydığı, onları aslanlar, çitalar ve kurtlar gibi sakatlayan, saldıran ve korkanları sayması; yasak bir kişi tarafından öldürülmüş vahşi bir köpek gibidirler ve suçlanmazlar."
  id: "Malik menghitung mereka yang merusak, menyerang mereka, dan takut seperti singa, cheetah, dan serigala; mereka seperti anjing liar yang dibunuh oleh orang terlarang dan tidak disalahkan."
