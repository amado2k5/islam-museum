id: concept/qawanin-al-qurud
class: concept
kind: term
label:
  ar: "قوانين القرود والتفويض"
  en: "The monkey laws and delegation"
  ur: "بندر کے قوانین اور تفویض"
summary:
  ar: "قوانين القرود (monkey laws) كما يشرحها طارق السويدان من كتاب أونكن وبلانشارد: القرد هو الخطوة التالية، وله صاحب واحد، وصاحبه أدنى مستوى إداري قادر عليه، والتفويض لا يلغي المسؤولية، وقاعدته «لا تأخذ قرود الآخرين»."
  en: "The monkey laws as Tareq al-Suwaidan explains them from Oncken and Blanchard's book: the monkey is the next step, it has one owner, its owner is the lowest management level able to handle it, delegation does not cancel responsibility, and his rule — 'do not take other people's monkeys'."
  ur: "بندر کے قوانین جیسا کہ طارق السویدان اونکن اور بلانچارڈ کی کتاب سے بیان کرتے ہیں: بندر اگلا قدم ہے، اس کا ایک ہی مالک ہوتا ہے جو انتظام کی سب سے پست قابل سطح ہے، تفویض ذمہ داری ختم نہیں کرتی، اور ان کا اصول «دوسروں کے بندر مت لو»۔"
