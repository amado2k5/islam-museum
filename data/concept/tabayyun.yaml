perspectives:
- tradition: sunni
  id: sunni-sharawi-verify
  stance:
    ar: "لا يُحكم على من ألقى السلام بعدم الإيمان قبل التثبت، والإيمان عمل القلب والإسلام ظاهر"
    en: "No one who gives the greeting of peace is judged to lack faith before verification; faith is an act of the heart and Islam is outward"
  summary:
    ar: "يذكر الشعراوي أن الخطاب في الآية موجّه إلى «الذين آمنوا» لأن الإيمان عمل قلبي، أما الإسلام فأمر ظاهر قد يتظاهر به من يقتل {cite:tafsir-sharawi-khawatir-scan p.2548}. ويرى أن من أُلقي إليه السلام يُحمل على الإسلام حتى يتبين غيره، وأن الإحن والبغضاء تحمل صاحبها على ألا يدقق، ولذلك أنكر النبي على محلم قتله {cite:tafsir-sharawi-khawatir-scan p.2557}. ويعرض قصة أسامة بن زيد وقول النبي له: هل شققت قلبه؟ {cite:tafsir-sharawi-khawatir-scan p.2560}. ويرى أن التبيّن يحتاج فطنة تدرك ملامح الإيمان {cite:tafsir-sharawi-khawatir-scan p.2560}. وهذا رأيه في تفسير الآية (needs_source للأحكام الفقهية المفصّلة)."
    en: "Sha'rawi says the verse addresses those who believe, since faith is an act of the heart, while Islam is outward and can be feigned by a killer {cite:tafsir-sharawi-khawatir-scan p.2548}. He holds that one who gives the greeting is taken as a Muslim until the contrary is shown, and that enmity makes a man careless, so the Prophet rebuked Muhallim for the killing {cite:tafsir-sharawi-khawatir-scan p.2557}. He recounts the story of Usama ibn Zayd, whom the Prophet asked whether he had split open the man's heart to know his state {cite:tafsir-sharawi-khawatir-scan p.2560}. He holds that verification requires insight that reads the marks of faith {cite:tafsir-sharawi-khawatir-scan p.2560}. This is his reading; detailed jurisprudential rules are not set out here (needs_source)."
