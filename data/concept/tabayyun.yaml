id: concept/tabayyun
class: concept
kind: ethical
label:
  ar: التبيّن قبل الحكم
  en: Verification before judgement (tabayyun)
summary:
  ar: "يقرر الشعراوي أن المسلم يتثبّت قبل أن يحكم على من ألقى إليه تحية الإسلام، لأن الإسلام ظاهر والإيمان عمل القلب، وأن قتل من أظهر الشهادة بغير تثبّت خطأ جسيم. ويستدل بقصص أسامة بن زيد والمقداد ومُحلِّم بن جثامة في أسباب نزول الآية {cite:tafsir-sharawi-khawatir-scan p.2548}{cite:tafsir-sharawi-khawatir-scan p.2557}{cite:tafsir-sharawi-khawatir-scan p.2560}{cite:tafsir-sharawi-khawatir-scan p.2561}."
  en: "Sha'rawi holds that a believer must verify before judging the one who gives the greeting of peace, since Islam is outward and faith is in the heart, and that killing one who professes the creed without verification is a grave error. He cites the stories of Usama ibn Zayd, al-Miqdad and Muhallim ibn Jaththama as occasions of the verse {cite:tafsir-sharawi-khawatir-scan p.2548}{cite:tafsir-sharawi-khawatir-scan p.2557}{cite:tafsir-sharawi-khawatir-scan p.2560}{cite:tafsir-sharawi-khawatir-scan p.2561}."
