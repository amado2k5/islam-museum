id: concept/nafkh-al-ruh-fi-al-janin
class: concept
kind: belief
label:
  ar: نفخ الروح في الجنين
  en: Ensoulment in the womb
  ur: رحم میں روح کا پھونکا جانا
summary:
  ar: "بعد أربعين وسبعين يومًا يُبعث الملك إلى الجنين فينفخ فيه الروح ويُؤمر بأربع كلمات: رزقه وأجله وعمله وشقي أو سعيد — لحظة غيبية يتحول بها المضغة إلى نفس."
  en: "After some seventy days an angel is sent to the embryo, breathes the soul into it and is ordered four words: its provision, its term, its deeds, and wretched or happy — the unseen moment the lump becomes a soul."
  ur: "کوئی ستر دن کے بعد فرشتہ جنین کے پاس بھیجا جاتا ہے جو اس میں روح پھونکتا ہے اور چار باتوں کا حکم ملتا ہے: رزق، اجل، عمل اور شقی یا سعید — وہ غیبی لمحہ جس میں گوشت کا ٹکڑا انسان بن جاتا ہے۔"
