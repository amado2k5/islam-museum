label:
  ar: الزهد
  en: Renunciation (zuhd)
summary:
  ar: "الزهد في الشيء لغة الإعراض عنه لاستقلاله واحتقاره وارتفاع الهمة عنه؛ وفي شرح ابن رجب لحديث «ازهد في الدنيا يحبك الله» أن الزهادة في الدنيا ليست بتحريم الحلال ولا إضاعة المال — كما وقف على أبي مسلم الخولاني عند أحمد في كتاب الزهد وهو الصحيح عنده — بل أن تكون بما في يد الله أوثق مما في يديك، وإذا أصبت بمصيبة كنت أشد رجاء لأجرها وذخرها من إياها لو بقيت لك؛ وقال الزهري الزاهد من لم يغلب الحرام صبره ولم يشغل الحلال شكره، وقال سفيان بن عيينة من إذا أنعم عليه شكر وإذا ابتلي صبر، وقال سفيان الثوري والإمام أحمد الزهد في الدنيا قصر الأمل ليس بأكل الغليظ ولا لبس العباء، وأضاف أحمد مرة واليأس مما في أيدي الناس، وقال إبراهيم بن أدهم الزهد ثلاثة: فرض وهو الزهد في الحرام، وفضل وهو الزهد في الحلال، وسلامة وهو الزهد في الشبهات، واختلف الناس هل يستحق اسم الزاهد من زهد في الحرام دون فضول المباح على قولين؛ وجمع أبو سليمان الداراني معانيه بأن الزهد في ترك ما يشغلك عن الله وهو عند ابن رجب حسن يجمع جميع معاني الزهد وأقسامه وأنواعه؛ ومما يدخل في تمامه أن المؤمن إذا نوى بتناول شهواته المباحة التقوي على الطاعة كانت شهواته له طاعة كما قال معاذ إني لأحتسب نومتي كما أحتسب قومتي (جامع العلوم والحكم ص 643–655)، ويفتتح مسلم كتاب الزهد والرقائق بقول النبي «الدنيا سجن المؤمن وجنة الكافر» {cite:sahih-muslim 2956}. الزهد عند المؤلف الزهد في الحرام والمكروه والشبهات وما في أيدي الناس، لا ترك الكسب، ويعرض المراتب الثلاث التي ذكرها أحمد بن حنبل، ويرى أن الغنى مع الزهد ممكن، وأن الزهد لا يكون عند السعي والإنتاج."
  en: "Zuhd of a thing means turning away from it out of contempt for it and rising above it; in Ibn Rajab's commentary on 'renounce the world and God will love you', renouncing the world is neither forbidding the lawful nor wasting wealth — as halted at Abu Muslim al-Khawlani in Ahmad's Kitab al-Zuhd, the reading he prefers — but being more confident in what is in God's hand than in what is in your own, and, when calamity strikes, more hopeful of its reward and store than of its survival; al-Zuhri defined the renunciant as one whom the unlawful does not overcome in patience nor the lawful distract from gratitude; Sufyan ibn Uyayna as one who gives thanks when blessed and is patient when tried; Sufyan al-Thawri and the Imam Ahmad as 'renouncing the world is shortening hopes, not eating coarse food nor wearing a rough cloak' — Ahmad once adding 'and despairing of what is in people's hands'; Ibrahim ibn Adham made it three kinds: obligatory, renunciation of the unlawful; meritorious, of the lawful; and safekeeping, of the doubtful — people disputing whether renouncing the unlawful alone earns the name, and Abu Sulayman al-Darani gathering all its meanings as 'renouncing whatever occupies you away from God', a saying Ibn Rajab calls comprehensive of all its senses, divisions and kinds; and its fullness includes that a believer who intends by lawful pleasures strength for obedience finds them counted worship, as Mu'adh said 'I reckon my sleep as I reckon my night vigil' (Jami' al-Ulum wal-Hikam pp. 643–655)."
