education:
  did_you_know:
    ar: "الزهد في اللغة الإعراض عن الشيء لاستقلاله؛ وفي شرح ابن رجب أن الزهادة ليست بتحريم الحلال ولا إضاعة المال، وإنما رفع الهمة عن الدنيا."
    en: "Zuhd in the language is turning from a thing for its littleness; Ibn Rajab's commentary says renouncing the world is neither banning the lawful nor wasting wealth — it is lifting one's ambition above it."
    ur: "زہد لغت میں کسی چیز سے اعراض ہے؛ ابن رجب کے شرح میں دنیا سے بے رغبتی نہ حلال حرام کرنا ہے نہ مال ضائع — بلکہ ہمت کو دنیا سے بلند رکھنا ہے۔"
    sources: [source/ibn-rajab-jami-ulum-hikam, source/usul-iqtisad-islami-0660]
