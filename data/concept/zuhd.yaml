id: concept/zuhd
education:
  did_you_know:
    ar: "الزهد في اللغة الإعراض عن الشيء لاستقلاله؛ وفي شرح ابن رجب أن الزهادة ليست بتحريم الحلال ولا إضاعة المال، وإنما رفع الهمة عن الدنيا."
    en: "Zuhd in the language is turning from a thing for its littleness; Ibn Rajab's commentary says renouncing the world is neither banning the lawful nor wasting wealth — it is lifting one's ambition above it."
    ur: "زہد لغت میں کسی چیز سے اعراض ہے؛ ابن رجب کے شرح میں دنیا سے بے رغبتی نہ حلال حرام کرنا ہے نہ مال ضائع — بلکہ ہمت کو دنیا سے بلند رکھنا ہے۔"
    sources: [source/ibn-rajab-jami-ulum-hikam, source/usul-iqtisad-islami-0660]
class: concept
kind: ethical
label:
  ar: الزهد
  en: Renunciation (zuhd)
summary:
  ar: "الزهد في الشيء لغة الإعراض عنه لاستقلاله واحتقاره وارتفاع الهمة عنه؛ وفي شرح ابن رجب لحديث «ازهد في الدنيا يحبك الله» أن الزهادة في الدنيا ليست بتحريم الحلال ولا إضاعة المال — كما وقف على أبي مسلم الخولاني عند أحمد في كتاب الزهد وهو الصحيح عنده — بل أن تكون بما في يد الله أوثق مما في يديك، وإذا أصبت بمصيبة كنت أشد رجاء لأجرها وذخرها من إياها لو بقيت لك؛ وقال الزهري الزاهد من لم يغلب الحرام صبره ولم يشغل الحلال شكره، وقال سفيان بن عيينة من إذا أنعم عليه شكر وإذا ابتلي صبر، وقال سفيان الثوري والإمام أحمد الزهد في الدنيا قصر الأمل ليس بأكل الغليظ ولا لبس العباء، وأضاف أحمد مرة واليأس مما في أيدي الناس، وقال إبراهيم بن أدهم الزهد ثلاثة: فرض وهو الزهد في الحرام، وفضل وهو الزهد في الحلال، وسلامة وهو الزهد في الشبهات، واختلف الناس هل يستحق اسم الزاهد من زهد في الحرام دون فضول المباح على قولين؛ وجمع أبو سليمان الداراني معانيه بأن الزهد في ترك ما يشغلك عن الله وهو عند ابن رجب حسن يجمع جميع معاني الزهد وأقسامه وأنواعه؛ ومما يدخل في تمامه أن المؤمن إذا نوى بتناول شهواته المباحة التقوي على الطاعة كانت شهواته له طاعة كما قال معاذ إني لأحتسب نومتي كما أحتسب قومتي ⁦(جامع العلوم والحكم ص 643–655)⁩، ويفتتح مسلم كتاب الزهد والرقائق بقول النبي «الدنيا سجن المؤمن وجنة الكافر» {cite:sahih-muslim 2956}. الزهد عند المؤلف الزهد في الحرام والمكروه والشبهات وما في أيدي الناس، لا ترك الكسب، ويعرض المراتب الثلاث التي ذكرها أحمد بن حنبل، ويرى أن الغنى مع الزهد ممكن، وأن الزهد لا يكون عند السعي والإنتاج. ويجمع جامع الترمذي في كتاب الزهد والرقائق صوره من النصوص: أن الدنيا ملعونة إلا ذكر الله وما والاه وعالم أو متعلم {cite:jami-al-tirmidhi p.531}، وأن مثلها في الآخرة كإصبع يجعلها أحدكم في اليم {cite:jami-al-tirmidhi p.532}، وأنها سجن المؤمن وجنة الكافر {cite:jami-al-tirmidhi p.532}، وأنها لأربعة نفر: عبد جمع مالا وعلما يتقي فيه ربه ويصل فيه رحمه ويعلم لله فيه حقا فهو بأفضل المنازل، وعبد جمع علما بلا مال فهو بنيته وأجرهما سواء، وعبد جمع مالا بلا علم فيخبط في ماله بغير علم فهو بأخبث المنازل، ومن لم يجمع شيئا ويقول لو كان لي مالا لعملت بعمل فلان فهو بنيته ووزرهما سواء {cite:jami-al-tirmidhi p.532}، وأن من نزلت به فاقة فأزلها بالله نجاه ومن أزالها إلى الناس لم تسد فاقته {cite:jami-al-tirmidhi p.533}، وأن لا يكفي من جمع المال خادم وركب في سبيل الله {cite:jami-al-tirmidhi p.533}، وأن خير الناس من طال عمره وحسن عمله وشرهم من طال عمره وساء عمله {cite:jami-al-tirmidhi p.533}، وأن من أخذ النبي ببعض جسده وقال كن في الدنيا كأنك غريب أو عابر سبيل وعد نفسك من أهل القبور وأخذ من صحتك قبل سقمك ومن حياتك قبل موتك {cite:jami-al-tirmidhi p.534}، وأن فتنة هذه الأمة في المال {cite:jami-al-tirmidhi p.534}، وأنه لو كان لابن آدم واديان من ذهب لأحب أن يكون له ثالثا ولا يملأ فاه إلا التراب {cite:jami-al-tirmidhi p.535}، وأن من توكل على الله حق توكله لرزق كما ترزق الطير تغدو خماصا وتروح بطانا {cite:jami-al-tirmidhi p.536}، وأن من أصبح آمنا في سربه معافى في جسده عنده قوت يومه فكأنما حيزت له الدنيا {cite:jami-al-tirmidhi p.536}، وأن أغبط أوليائه عنده مؤمن خفيف الحاذ حسن العبادة رزقه كفافا فصبر عليه فأعجّلت منيته وقلت بواكيه وقل تراثه {cite:jami-al-tirmidhi p.536}، وأن قد أفلح من أسلم ورزق كفافا وقنعه الله {cite:jami-al-tirmidhi p.537}، وأن فقراء المهاجرين يدخلون الجنة قبل أغنيائهم بخمسمائة عام وأن عائشة سئلت لم فقال إنهم يدخلون الجنة قبل أغنيائهم بأربعين خريفا ولا تردي المسكين ولو بشق تمرة وأحبي المساكين وقربيهم {cite:jami-al-tirmidhi p.537}؛ ويجمع مشكاة المصابيح كتاب الزهد والرقائق: أن النبي خط خطا ومربعا خارجا منه وخطوطا صغارا إليه فقال هذا الإنسان وهذا أجله محيط به وهذا الذي هو خارج أمله وهذه الخطوط الصغار الآفات فإن أخطأه هذا نهشه هذا وإن أخطأه هذا نهشه هذا {cite:mishkat-al-masabih p.1450}، وأن ابن آدم يهرم ويشب منه اثنان: الحرص على المال والحرص على العمر وأن لا يزال قلب الكبير شابا في اثنين: في حب الدنيا وطول الأمل {cite:mishkat-al-masabih p.1450}، وأن لو كان لابن آدم واد من مال لا يبتلي به ثالث ولا علما جوفه ابن آدم إلا التراب {cite:mishkat-al-masabih p.1451}، وأن من أخذ النبي ببعض جسده وقال كن في الدنيا كأنك غريب أو عابر سبيل وعد نفسك من أهل القبور {cite:mishkat-al-masabih p.1451}، وأن الله يحب العبد التقي وأن أي الناس خير من طال عمره وحسن عمله وشرهم من طال عمره وسيء عمله وأنه إذا أراد الله بعبد خيرا استعمله يوفق لعمل صالح {cite:mishkat-al-masabih p.1454}، وأن الكيس من دان نفسه وعمل لما بعد الموت والعاجز من أتبع نفسه هواها وتمنى على الله {cite:mishkat-al-masabih p.1455}، ويعقبها أبواب التوكل والصبر والرياء والسمعة والبكاء والخوف {cite:mishkat-al-masabih p.1457}"
  en: "Zuhd of a thing means turning away from it out of contempt for it and rising above it; in Ibn Rajab's commentary on 'renounce the world and God will love you', renouncing the world is neither forbidding the lawful nor wasting wealth — as halted at Abu Muslim al-Khawlani in Ahmad's Kitab al-Zuhd, the reading he prefers — but being more confident in what is in God's hand than in what is in your own, and, when calamity strikes, more hopeful of its reward and store than of its survival; al-Zuhri defined the renunciant as one whom the unlawful does not overcome in patience nor the lawful distract from gratitude; Sufyan ibn Uyayna as one who gives thanks when blessed and is patient when tried; Sufyan al-Thawri and the Imam Ahmad as 'renouncing the world is shortening hopes, not eating coarse food nor wearing a rough cloak' — Ahmad once adding 'and despairing of what is in people's hands'; Ibrahim ibn Adham made it three kinds: obligatory, renunciation of the unlawful; meritorious, of the lawful; and safekeeping, of the doubtful — people disputing whether renouncing the unlawful alone earns the name, and Abu Sulayman al-Darani gathering all its meanings as 'renouncing whatever occupies you away from God', a saying Ibn Rajab calls comprehensive of all its senses, divisions and kinds; and its fullness includes that a believer who intends by lawful pleasures strength for obedience finds them counted worship, as Mu'adh said 'I reckon my sleep as I reckon my night vigil' (Jami' al-Ulum wal-Hikam pp. 643–655). Jami' al-Tirmidhi gathers its images in the Book of Renunciation and the Heart-Softening: that this world is accursed save the remembrance of God and what accompanies it, a scholar or a learner {cite:jami-al-tirmidhi p.531}; that its likeness in the Hereafter is a finger dipped in the sea {cite:jami-al-tirmidhi p.532}; that it is the believer's prison and the unbeliever's paradise {cite:jami-al-tirmidhi p.532}; and that it belongs to four kinds — one granted wealth and knowledge who fears God in it, joins kin and acknowledges God's right in it, the best of stations; one granted knowledge without wealth, equal in intent and reward; one granted wealth without knowledge, blundering in his wealth in ignorance, the vilest of stations; and one granted neither, who says 'were I to have wealth I would work as so-and-so did' — equal in intent and in blame {cite:jami-al-tirmidhi p.532}; that whoever's need is lowered to God is saved, while one who lowers it to people is not relieved {cite:jami-al-tirmidhi p.533}; that sufficing for the amasser of wealth is a servant and a mount in God's way {cite:jami-al-tirmidhi p.533}; that the best of people is one whose life is long and whose deeds are good, the worst one whose life is long and whose deeds are evil {cite:jami-al-tirmidhi p.533}; that the Prophet took hold of part of his body and said 'be in this world as a stranger or a wayfarer, count yourself among the people of graves', taking from your health before your sickness and your life before your death {cite:jami-al-tirmidhi p.534}; that this community's trial is wealth {cite:jami-al-tirmidhi p.534}; that were the son of Adam given two valleys of gold he would wish for a third, yet his mouth is filled only with dust {cite:jami-al-tirmidhi p.535}; that whoever trusts in God as trust should be is provided for as the birds are — going out hungry and returning full {cite:jami-al-tirmidhi p.536}; that whoever wakes secure among his people, sound in body, with his day's provision, it is as though the world were gathered for him {cite:jami-al-tirmidhi p.536}; that the most envied of God's friends is a believer light on his provision, excellent in worship, given barely enough and patient with it — his death hastened, his weepers few and his legacy small {cite:jami-al-tirmidhi p.536}; that he prospers who embraces Islam, is given barely enough and is contented by God {cite:jami-al-tirmidhi p.537}; and that the poor Emigrants enter Paradise five hundred years before their rich, Aisha being told that they enter forty autumns earlier and counseled not to turn away the poor even with half a date, to love them and draw them near {cite:jami-al-tirmidhi p.537}; and Mishkat al-Masabih's Book of Renunciation and Heart-Softening gathers: that the Prophet drew a line, a square outside it and small lines leading to the middle one, saying 'this is man, his term encircles him, this outside line is his hope, and these small lines are the calamities — if this misses him this bites him, and if this misses him this bites him' {cite:mishkat-al-masabih p.1450}; that the son of Adam grows old and two things grow with him — greed for wealth and greed for life — and that the heart of the great remains young in two things: love of the world and long hope {cite:mishkat-al-masabih p.1450}; that were the son of Adam given a valley of wealth by which he would not be tried a third time, and knowledge into whose breast he would not be tried, nothing would fill his mouth but dust {cite:mishkat-al-masabih p.1451}; that he took hold of part of his body and said 'be in this world as a stranger or a wayfarer, count yourself among the people of graves' {cite:mishkat-al-masabih p.1451}; that God loves the God-fearing servant, that the best of people is one whose life is long and whose deeds are good and the worst one whose life is long and whose deeds are evil, and that when God wills good for a servant He employs him for righteous work {cite:mishkat-al-masabih p.1454}; and that the discerning man disciplines his soul and works for what is after death, while the incapable follows his soul's desires and hopes in God {cite:mishkat-al-masabih p.1455} — followed by the chapters on reliance and patience, showing off and reputation, weeping and fear {cite:mishkat-al-masabih p.1457}."
