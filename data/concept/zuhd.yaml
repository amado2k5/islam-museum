id: concept/zuhd
education:
  did_you_know:
    ar: "الزهد في اللغة الإعراض عن الشيء لاستقلاله؛ وفي شرح ابن رجب أن الزهادة ليست بتحريم الحلال ولا إضاعة المال، وإنما رفع الهمة عن الدنيا."
    en: "Zuhd in the language is turning from a thing for its littleness; Ibn Rajab's commentary says renouncing the world is neither banning the lawful nor wasting wealth — it is lifting one's ambition above it."
    ur: "زہد لغت میں کسی چیز سے اعراض ہے؛ ابن رجب کے شرح میں دنیا سے بے رغبتی نہ حلال حرام کرنا ہے نہ مال ضائع — بلکہ ہمت کو دنیا سے بلند رکھنا ہے۔"
    sources: [source/ibn-rajab-jami-ulum-hikam, source/usul-iqtisad-islami-0660]
class: concept
kind: ethical
label:
  ar: الزهد
  en: Renunciation (zuhd)
summary:
  ar: "الزهد في دائرة المعارف الإسلامية هو التقشف المادي والروحي الذي ييسر القرب من الإلهي، وتعدّه من الفضائل الروحية التي لا يعتني بها المتصوفة وحدهم. ويذكر المقال أن الحديث والمحدّثين كان لهم دور أساسي في أدبه، وأن الناس اختلفوا في نطاقه بين ترك ظاهر للدنيا وتقشف باطني يقود إلى التوكل، وأن الصوفية رتبوه مرحلة أولى في الطريق. وقد بقيت في المسوّدة الأولى أقوال ابن رجب وما نقله من الأحاديث والمأثور."
  en: "In the Encyclopaedia of Islam, zuhd is the material and spiritual asceticism that eases closer association with the divine, and one of the spiritual virtues weighed by many thinkers besides the mystics. The article credits hadith scholars with an essential role in its literature, reports two readings of its scope, an outward renunciation and an inward asceticism leading to trust in God, and describes the staged schemes of Ibn Adham, Shaqiq al-Balkhi and al-Kharraz. Ibn Rajab's commentary, the hadith collections and the later lectures are kept in the page as separate sections."
  ur: "دائرۃ المعارف اسلامیہ میں زہد وہ مادی اور روحانی ریاضت ہے جو الٰہی ہستی سے قرب کو آسان کرتی ہے، اور صوفیہ کے علاوہ بہت سے مفکرین نے بھی اسے روحانی فضائل میں گنا ہے۔ مقالہ اس کے ادب میں محدثین کا بنیادی کردار مانتا ہے، اس کے دائرے کی دو قراءتیں بیان کرتا ہے، ظاہری ترک اور توکل تک پہنچانے والی باطنی ریاضت، اور ابن ادھم، شقیق بلخی اور خراز کی مرحلہ وار تقسیمیں ذکر کرتا ہے۔ ابن رجب کی شرح، حدیث کے مجموعے اور بعد کے دروس صفحے میں الگ حصوں کے طور پر باقی ہیں۔"
