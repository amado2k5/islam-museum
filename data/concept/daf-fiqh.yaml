label:
  ar: "الدفع ⁦(في الفقه)⁩"
  en: "Daf' (the fiqh term: repelling, giving, returning and rebutting)"
  ur: "دفع ⁦(فقہی اصطلاح)⁩"
  es: "Daf' (término fiqh: repeler, dar, devolver y refutar)"
  fr: "Daf' (terme juridique: repousser, donner, renvoyer et réfuter)"
  tr: "Ödeme (içtihatta)"
  id: "Pembayaran (dalam yurisprudensi)"
summary:
  ar: "الدفع في اللغة التنحية والمماطلة والمحاجة عن الغير والرد، وفي الاصطلاح صرف الشيء قبل وروده، والفقهاء يستعملونه بمعنى الإعطاء والإخراج والأداء، وبمعنى الرد، وبمعنى اتقاء الشر ومنعه، وبمعنى رد خصومة المدعي وإبطال دعواه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8213} والدفع أقوى من الرفع قاعدة فقهية ذكرها الزركشي، ومن أمثلتها أن الماء المستعمل إذا بلغ قلتين لا يعود طهورا في وجه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8215}"
  en: "In the lexicon daf' means pushing away, delaying, pleading on behalf of another and returning; as a term it means turning a thing away before it arrives. Jurists use it to mean giving or paying (as in zakat), returning (a deposit), warding off harm (repelling an aggressor), and rebutting a claim and voiding it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8213} The maxim that repelling is stronger than removing (al-daf' aqwa min al-raf') is cited from al-Zarkashi; among its applications, water already used that reaches two qullas does not become pure in one view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8215}"
  ur: "فقہ میں دفع کے معنی دینے، واپس کرنے، برائی سے بچانے اور دعوی کو رد کرنے کے ہیں۔ اس سے متعلق یہ قاعدہ ہے کہ دفع رفع سے زیادہ قوی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8213} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8215}"
  es: "En el léxico, daf' significa alejar, retrasar, interceder por otro y devolver; como término, significa rechazar algo antes de que llegue. Los juristas lo usan para referirse a dar o pagar (como en el zakat), devolver (un depósito), evitar el daño (repeler a un agresor) y refutar una reclamación y anularla. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8213} La máxima de que repeler es más fuerte que eliminar (al-daf' aqwa min al-raf') se cita de al-Zarkashi; entre sus aplicaciones, el agua ya usada que alcanza dos qullas no se purifica en una sola visión. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8215}"
  fr: "Dans le lexique, « daf' » signifie repousser, retarder, intercéder en faveur d'autrui et revenir; en tant que terme, il signifie détourner une chose avant qu'elle n'arrive. Les juristes l'emploient pour désigner le fait de donner ou de payer (comme dans le cas de la zakat), de restituer (un dépôt), de se prémunir contre un danger (repousser un agresseur) et de réfuter une demande et de l'annuler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8213} La maxime selon laquelle repousser est plus fort que supprimer (al-daf' aqwa min al-raf') est attribuée à al-Zarkashi; parmi ses applications, l'eau déjà utilisée qui atteint deux qullas ne devient pas pure selon une opinion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8215}"
  tr: "Dilde savunma, geri çekme, geciktirme, başkaları adına savunma ve reddetme anlamına gelir. Terminolojide, bir şeyi gelmeden önce aktarmak anlamına gelir. Hukukçular bunu vermek, kaldırmak ve ödemek, ayrıca geri vermek ve zararı önlemek için kullanırlar; davacının anlaşmazlığını reddetmek ve iddiasını geçersiz kılmak için kullanırlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8213} Savunma, çıkarmaktan daha güçlüdür. Al-Zarkashi'nin bahsettiği bir hukuk ilkesi, suyun iki qwala ulaştığında yüzeyde saf olmamasıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8215}"
  id: "Dalam bahasa, membela berarti penarikan, penundaan, berargumen atas nama orang lain, dan penolakan. Dalam terminologi, itu berarti memindahkan sesuatu sebelum tiba. Para ahli hukum menggunakannya untuk menyerah, menghapus, dan membayar, serta mengembalikan dan mencegah kerugian, serta menolak sengketa penggugat dan membatalkan klaimnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8213} Pembelaan lebih kuat daripada penghilangan. Prinsip yurisprudensi yang disebutkan oleh Al-Zarkashi adalah bahwa air yang digunakan jika mencapai dua qwal tidak menjadi murni secara langsung. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8215}"
