id: concept/daf-fiqh
class: concept
kind: legal
label:
  ar: "الدفع (في الفقه)"
  en: "Daf' (the fiqh term: repelling, giving, returning and rebutting)"
  ur: "دفع (فقہی اصطلاح)"
summary:
  ar: "الدفع في اللغة التنحية والمماطلة والمحاجة عن الغير والرد، وفي الاصطلاح صرف الشيء قبل وروده، والفقهاء يستعملونه بمعنى الإعطاء والإخراج والأداء، وبمعنى الرد، وبمعنى اتقاء الشر ومنعه، وبمعنى رد خصومة المدعي وإبطال دعواه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8213} والدفع أقوى من الرفع قاعدة فقهية ذكرها الزركشي، ومن أمثلتها أن الماء المستعمل إذا بلغ قلتين لا يعود طهورا في وجه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8215}"
  en: "In the lexicon daf' means pushing away, delaying, pleading on behalf of another and returning; as a term it means turning a thing away before it arrives. Jurists use it to mean giving or paying (as in zakat), returning (a deposit), warding off harm (repelling an aggressor), and rebutting a claim and voiding it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8213} The maxim that repelling is stronger than removing (al-daf' aqwa min al-raf') is cited from al-Zarkashi; among its applications, water already used that reaches two qullas does not become pure in one view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8215}"
  ur: "فقہ میں دفع کے معنی دینے، واپس کرنے، برائی سے بچانے اور دعوی کو رد کرنے کے ہیں۔ اس سے متعلق یہ قاعدہ ہے کہ دفع رفع سے زیادہ قوی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8213} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8215}"
