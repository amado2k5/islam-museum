label:
  ar: "كِبْر"
  en: "Pride (kibr)"
  ur: "تکبر (کبر)"
summary:
  ar: "الكِبر في اللغة العظمة، وفي الاصطلاح خلق في النفس، هو أن يرى المرء نفسه فوق من يتكبر عليه، وفي السنة عدم قبول الحق ترفعاً واحتقار الناس. وهو من الكبائر بالاتفاق، وقد جاء النهي عنه بالنص. وللتكبر مظاهر كثيرة منها تصعير الوجه، والاختيال في المشي، والترفع عن مجالسة الفقراء، والأكل متكئاً، وإطالة الثوب خيلاء. وحكم هذه المظاهر يختلف بحسب النية والعرف، فما كان من شعار المتكبرين كُره، وما فعل لغير تكبر فلا بأس به. وعلاجه فرض عين، ومقاماه استئصال أصله بمعرفة النفس وربها، ثم معالجة أسبابه كالنسب والجمال والقوة والغنى والعلم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13182} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13183} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13184} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13185} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13187} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13188} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13189}"
  en: "Pride (kibr) is, in the lexicon, greatness. In the jurists' terms it is a trait of the self by which a person sees himself above those he looks down on; in the Sunna it is refusing the truth out of arrogance and despising people. All agree it is a major sin, and the prohibition is textual. Its signs are many, among them lowering the face, strutting, disdaining to sit with the poor, reclining while eating and trailing one's robe out of vanity. The ruling on these signs depends on intention and custom: what marks out the proud is disliked, and what is done without pride is not objectionable. Treating pride is an individual duty, and its method is to uproot it by knowing oneself and one's Lord, then to treat its causes such as lineage, beauty, strength, wealth and knowledge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13182} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13183} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13184} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13185} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13187} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13188} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13189}"
  ur: "کِبْر لغت میں عظمت ہے، اور اصطلاح میں نفس کی وہ صفت جس سے آدمی خود کو اپنے سے کمتر سمجھنے والوں سے بلند جانتا ہے؛ حدیث میں حق کو قبول نہ کرنا تکبر سے اور لوگوں کو حقیر جاننا ہے۔ تمام علماء کے نزدیک یہ کبیرہ گناہ ہے اور اس کی ممانعت نص سے ثابت ہے۔ اس کی علامات بہت ہیں، جیسے منہ پھیرنا، اکڑ کر چلنا، کمزور لوگوں کے ساتھ بیٹھنے سے عار کرنا، ٹیک لگا کر کھانا اور غرور سے کپڑا لٹکانا۔ ان علامات کا حکم نیت اور عرف پر منحصر ہے: جو تکبر والوں کی علامت ہو وہ مکروہ ہے، اور جو بغیر تکبر کے ہو اس میں حرج نہیں۔ اس کا علاج فرضِ عین ہے، جس کا پہلا درجہ نفس اور رب کی معرفت سے اس کی جڑ کاٹنا ہے، پھر اس کے اسباب جیسے نسب، حسن، طاقت، مال اور علم کا علاج۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13182} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13183} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13184} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13185} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13187} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13188} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13189}"
