  ar: "الدروميذس"
  en: "Andromeda"
  ur: "دروميذس"
  es: "Andrómeda"
summary:
  ar: "يذكر الفهرس صورة الدروميذس، وهي المرأة، بعد صورة الفرس والدلفين، ويجعل بعض كواكبها في رأسها. ثم تأتي صورة المثلث في الصفحة نفسها التي تبدأ فيها أسماء الكواكب الثابتة. ولم تُنقل مواضعها من الطول والعرض. {cite:zij-sabi-nallino-byblion pp.253-254}"
  en: "The catalogue gives Andromeda, the Woman, and places some of her stars at her head. Her entries come on the page where the names of the fixed stars begin again, and the Triangle follows on the same page. Positions in longitude and latitude are not transcribed here. {cite:zij-sabi-nallino-byblion pp.253-254}"
  ur: "فہرست دروميذس، یعنی عورت، کی صورت دیتی ہے اور اس کے کچھ ستارے اس کے سر پر رکھتی ہے۔ اس کے ستارے اس صفحے پر آتے ہیں جہاں ثابت ستاروں کے نام دوبارہ شروع ہوتے ہیں، اور مثلث اسی صفحے پر آتی ہے۔ طول اور عرض یہاں نقل نہیں ہوئے۔ {cite:zij-sabi-nallino-byblion pp.253-254}"
  es: "El catálogo menciona a Andrómeda, la Mujer, y coloca algunas de sus estrellas a su cabeza. Sus entradas aparecen en la página donde comienzan nuevamente los nombres de las estrellas fijas, y el Triángulo se encuentra en la misma página. Las posiciones en longitud y latitud no se transcriben aquí. {cite:zij-sabi-nallino-byblion pp.253-254}"
