summary:
  ar: "الفو في الكتاب نبات له ورق كورق الكرفس وساق أملس أرجواني ذو عقد وزهر كالنرجس وأصل عطري قوته شبيهة بالسنبل ولذلك يسميه قوم ناردين بريا، قوة أصله مسخنة، ينفع من وجع الجنب ويدر البول، ويذكر الكتاب أنه يدر الطمث {cite:canon-ibn-sina-print-v1 pp.624-625}"
  en: "Fu is in the book a plant with a leaf like celery, a smooth purple jointed stem, a flower like the narcissus and an aromatic root whose power resembles spikenard, so some call it wild nard; its root is warming, benefits pain in the side and promotes urine, and the book lists it as promoting the menses {cite:canon-ibn-sina-print-v1 pp.624-625}"
  ur: "فو کتاب میں ایک پودا ہے جس کے پتے کرفس جیسے، تنا ہموار ارغوانی اور گرہ دار، پھول نرگس جیسا اور جڑ خوشبودار ہے جس کی قوت سنبل سے ملتی ہے اس لیے کچھ لوگ اسے ناردین بری کہتے ہیں؛ اس کی جڑ گرم کرنے والی ہے، پہلو کے درد میں نافع ہے اور پیشاب جاری کرتی ہے، اور کتاب اسے حیض جاری کرنے والی بتاتی ہے {cite:canon-ibn-sina-print-v1 pp.624-625}۔"
  es: "En el libro, Fu es una planta con una hoja parecida al apio, un tallo liso, púrpura y articulado, una flor parecida al narciso y una raíz aromática cuyo poder se asemeja al del nardo silvestre, por lo que algunos la llaman nardo silvestre; su raíz es cálida, alivia el dolor de costado y favorece la micción, y el libro la menciona como promotora de la menstruación {cite:canon-ibn-sina-print-v1 pp.624-625}."
  fr: "Le Fu est décrit dans le livre comme une plante à feuilles semblables à celles du céleri, à tige lisse, violette et articulée, à fleur semblable à celle du narcisse et à racine aromatique dont les propriétés rappellent celles du nard, ce qui lui vaut parfois le nom de nard sauvage; sa racine est réchauffante, soulage les douleurs latérales et favorise la diurèse, et le livre mentionne également son action sur les menstruations {cite:canon-ibn-sina-print-v1 pp.624-625}"
