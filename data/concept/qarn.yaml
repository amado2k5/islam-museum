summary:
  ar: "القرن في الكتاب قرن الأيل والعنز المحرقان، يجلو الأسنان بقوة ويشد اللثة ويسكن وجعها، ويمنع المواد عن العين، وينفع من نفث الدم واليرقان والدوسنطاريا، وهو نقل في أجزاء الحيوان {cite:canon-ibn-sina-print-v1 p.658}"
  en: "Qarn is in the book the burnt horn of the stag and the goat, which cleans the teeth strongly, firms the gums and calms their pain, keeps matters from the eye, and benefits the spitting of blood, jaundice and dysentery; it is a report on parts of animals {cite:canon-ibn-sina-print-v1 p.658}"
  ur: "قرن کتاب میں ہرن اور بکری کے جلائے ہوئے سینگ ہیں جو دانتوں کو زور سے صاف کرتے، مسوڑھوں کو مضبوط کرتے اور ان کے درد کو تسکین دیتے ہیں، آنکھ کی طرف مادوں کو روکتے ہیں، اور خون تھوکنے، یرقان اور پیچش میں نافع ہیں؛ یہ جانوروں کے اجزاء کے بارے میں منقول بیان ہے {cite:canon-ibn-sina-print-v1 p.658}۔"
  es: "En el libro, Qarn es el cuerno quemado del ciervo y la cabra, que limpia los dientes con fuerza, fortalece las encías y calma el dolor, previene la congestión ocular y beneficia la expectoración de sangre, la ictericia y la disentería; es un informe sobre partes de animales {cite:canon-ibn-sina-print-v1 p.658}"
  fr: "Le qarn est mentionné dans le livre comme étant la corne brûlée du cerf et du bouc, qui nettoie efficacement les dents, fortifie les gencives et apaise leurs douleurs, prévient les écoulements oculaires et est bénéfique en cas de crachats de sang, de jaunisse et de dysenterie; il s’agit d’un rapport sur les parties d’animaux {cite:canon-ibn-sina-print-v1 p.658}"
  tr: "Kitaptaki boynuz yanan geyik ve keçinin boynuzudur; dişleri güçlü şekilde temizler, diş etlerini sıkılaştırır, ağrılarını hafifletir, gözden maddeleri engeller ve kan pompalama, sarılık ve dizanteri için faydalıdır. Hayvan parçalarında bulaşır {cite:canon-ibn-sina-print-v1 s.658}"
  id: "Tanduk dalam buku ini adalah tanduk rusa dan kambing yang terbakar; tanduk ini sangat membersihkan gigi, mengencangkan gusi, meredakan rasa sakit, mencegah zat masuk ke mata, dan bermanfaat untuk pemompaan darah, penyakit kuning, dan disentri. Tanduk ini menular ke bagian tubuh hewan {cite:canon-ibn-sina-print-v1 hlm.658}"
