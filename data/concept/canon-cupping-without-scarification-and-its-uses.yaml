label:
  ar: "الحجامة بلا شرط واستعمالاتها عند ابن سينا"
  en: "Cupping without scarification and its uses in the Canon"
  fr: "Ventouses sans scarification dans le Canon"
  ur: "قانون میں بغیر نشتر حجامہ اور اس کے استعمالات"
  es: "La ventosaterapia sin escarificación y sus usos en el canon."
summary:
  ar: "يبين ابن سينا أن الحجامة بلا شرط تستعمل لأغراض متعددة: جذب المادة عن جهة حركتها وإبراز الورم الغائر ونقله وتسخين العضو وتحليل رياحه وإرجاعه إلى موضعه وتسكين الوجع {cite:canon-ibn-sina-print-v1 p.301}."
  en: "Ibn Sina shows that cupping without scarification serves several ends: drawing matter away from where it moves, bringing a deep swelling out, moving it, warming the organ, dissolving its winds, returning it to its place and easing pain {cite:canon-ibn-sina-print-v1 p.301}."
  fr: "Ibn Sina leur attribue détournement de matière, extériorisation et déplacement d’un gonflement profond, réchauffement de l’organe, résolution de ses vents, remise en place et apaisement douloureux {cite:canon-ibn-sina-print-v1 p.301}."
  es: "Ibn Sina muestra que la ventosaterapia sin escarificación cumple varios propósitos: extraer la materia de donde se mueve, sacar una hinchazón profunda, moverla, calentar el órgano, disolver sus vientos, devolverla a su lugar y aliviar el dolor {cite:canon-ibn-sina-print-v1 p.301}."
