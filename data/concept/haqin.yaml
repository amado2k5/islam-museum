label: { ar: "الحاقن", en: "Haqin (one who holds back urine)", ur: "حاقن" }
summary:
  ar: "الحاقن من يدافع البول، والحاقب من يدافع الغائط، والحازق من يدافعه الريح. يكره عند الجمهور أن يصلي الحاقن أو الحاقب، وعند الحنفية يكره تحريما ويجب قطع الصلاة إن لم يخف فوات الوقت. ويكره للقاضي والمفتي أن يحكم أو يفتي وهو بهذه الحال، وينفذ الحكم إن أصاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6725} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6726}"
  en: "A haqin is a person holding back urine, a haqib one holding back faeces and a hazeq one holding back wind. Most jurists consider prayer while in this state disliked; the Hanafis treat it as forbidden and say the prayer must be broken unless the time is about to pass. A judge or mufti in this state is disliked to rule or give an opinion, and a judgment given correctly still stands, while the Hanbali preferred view forbids it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6725} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6726}"
  ur: "حاقن وہ شخص ہے جو پیشاب روکے ہوئے ہو، اور حاقب وہ جو رفع حاجت روکے ہوئے ہو۔ ایسی حالت میں نماز مکروہ ہے، اور قاضی یا مفتی کا فیصلہ یا فتوی مکروہ ہے، لیکن درست فیصلہ نافذ ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6726}"
