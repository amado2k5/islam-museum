id: concept/daerat-al-mulk
class: concept
kind: term
label: { ar: "الدائرة الحكمية", en: "The Circle of Power" }
summary:
  ar: "ثمان كلمات حكمية سياسية نقلها ابن خلدون مما أشار إليه الكتاب المنسوب لأرسطو في السياسة ارتبط بعضها ببعض وارتدت أعجازها إلى صدورها في دائرة لا يتعين طرفها: العالم بستان سياجه الدولة، والدولة سلطان تحيا به السنة، والسنة سياسة يسوسها الملك، والملك نظام يعضده الجند، والجند أعوان يكفلهم المال، والمال رزق تجمعه الرعية، والرعية عبيد يكنفهم العدل، والعدل مألوف وبه قوائم العالم، ثم ترجع إلى أول الكلام، وفي معناها كلام الموبذان بهرام بن بهرام الملك لا يتم عزه إلا بالشريعة ولا قوام للشريعة إلا بالملك ولا عز للملك إلا بالرجال ولا قوام للرجال إلا بالمال ولا سبيل للمال إلا بالعمارة ولا سبيل للعمارة إلا بالعدل، وكلام أنوشروان الملك بالجند والجند بالمال والمال بالخراج والخراج بالعمارة والعمارة بالعدل ورأس الكل افتقاد الملك حال رعيته بنفسه، وأن كتابه استوعب تفسير هذه الكلمات وتفصيل إجمالها من غير تعليم أرسطو ولا إفادة موبذان، وأن كلام ابن المقفع في رسائله وكتاب سراج الملوك لأبي بكر الطرطوشي يتضمنان كثيراً من مسائله على منحى الخطابة {cite:muqaddima-ibn-khaldun p. 44-45}."
  en: "The circular maxim — the world a garden fenced by the state, the state by law, law by kingship, kingship by soldiers, soldiers by money, money by subjects, subjects by justice — traced to pseudo-Aristotle, the Mobedhan and Anushirvan {cite:muqaddima-ibn-khaldun p. 44-45}."
