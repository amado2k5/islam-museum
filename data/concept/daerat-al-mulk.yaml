label: { ar: "الدائرة الحكمية", en: "The Circle of Power", es: "El círculo del poder", fr: "Le cercle du pouvoir", ur: "طاقت کا دائرہ", tr: "Yargı Devresi", id: "Sirkuit Yudisial" }
summary:
  ar: "ثمان كلمات حكمية سياسية نقلها ابن خلدون مما أشار إليه الكتاب المنسوب لأرسطو في السياسة ارتبط بعضها ببعض وارتدت أعجازها إلى صدورها في دائرة لا يتعين طرفها: العالم بستان سياجه الدولة، والدولة سلطان تحيا به السنة، والسنة سياسة يسوسها الملك، والملك نظام يعضده الجند، والجند أعوان يكفلهم المال، والمال رزق تجمعه الرعية، والرعية عبيد يكنفهم العدل، والعدل مألوف وبه قوائم العالم، ثم ترجع إلى أول الكلام، وفي معناها كلام الموبذان بهرام بن بهرام الملك لا يتم عزه إلا بالشريعة ولا قوام للشريعة إلا بالملك ولا عز للملك إلا بالرجال ولا قوام للرجال إلا بالمال ولا سبيل للمال إلا بالعمارة ولا سبيل للعمارة إلا بالعدل، وكلام أنوشروان الملك بالجند والجند بالمال والمال بالخراج والخراج بالعمارة والعمارة بالعدل ورأس الكل افتقاد الملك حال رعيته بنفسه، وأن كتابه استوعب تفسير هذه الكلمات وتفصيل إجمالها من غير تعليم أرسطو ولا إفادة موبذان، وأن كلام ابن المقفع في رسائله وكتاب سراج الملوك لأبي بكر الطرطوشي يتضمنان كثيراً من مسائله على منحى الخطابة {cite:muqaddima-ibn-khaldun p. 44-45}."
  en: "The circular maxim — the world a garden fenced by the state, the state by law, law by kingship, kingship by soldiers, soldiers by money, money by subjects, subjects by justice — traced to pseudo-Aristotle, the Mobedhan and Anushirvan {cite:muqaddima-ibn-khaldun p. 44-45}."
  es: "La máxima circular —el mundo un jardín cercado por el estado, el estado por la ley, la ley por la monarquía, la monarquía por los soldados, los soldados por el dinero, el dinero por los súbditos, los súbditos por la justicia— se remonta a un pseudo-Aristóteles, el Mobedhan y el Anushirvan {cite:muqaddima-ibn-khaldun p. 44-45}."
  fr: "La maxime circulaire — le monde est un jardin clos par l'État, l'État par la loi, la loi par la royauté, la royauté par les soldats, les soldats par l'argent, l'argent par les sujets, les sujets par la justice — est attribuée au pseudo-Aristote, au Mobedhan et à Anushirvan {cite: muqaddima-ibn-khaldun p. 44-45}."
  ur: "سرکلر میکسم - دنیا ایک باغ ہے جس کی باڑ ریاست کی طرف سے، قانون کے ذریعہ ریاست، بادشاہت کے ذریعہ بادشاہی، سپاہیوں کے ذریعہ بادشاہی، سپاہیوں کے ذریعہ پیسہ، رعایا کے ذریعہ پیسہ، رعایا کے ذریعہ انصاف - چھدم ارسطو، موبیدھن اور انوشیروان سے پتہ چلتا ہے {حوالہ: مقدیمہ ابن خلدون صفحہ 44-45}۔"
  tr: "İbn Haldun'un Aristoteles'e atfedilen siyaset üzerine kitaptan alıntıladığı sekiz siyasi açıdan bilge söz, bazıları birbirine bağlıdır ve mucizeleri göğüslerine kadar uzanır, dönüş gerektirmeyen bir çemberde: Dünya devlet tarafından çevrili bir bahçedir, devlet Sünnilerin yaşadığı bir egemendir, Sünnet kral tarafından yönetilen bir siyasettir, kral askerler tarafından desteklenen bir sistemdir, askerler zenginlikle garanti edilen yardımcılardır, servet tebaaların biriktirdiği geçim kaynağıdır, tebaalar adaletle çevrili kölelerdir, adalet tanıdıktır ve dünyanın temellerine sahiptir, sonra konuşmanın başına geri döner ve anlamı kurtarıcılar Bahram bin Bahram kralın sözleridir Onun onuru yalnızca Şeriat ile sağlanır, Şeriatın temeli ise sadece krallık yoluyla sağlanır; onur ise insanlar dışında, insanlar için güç ise zenginlikle olur; servet sadece inşaatla olur ve inşa yolu adaletle mümkün değildir. Anuşirvan'ın kralın askerlerle, askerlerin servetle, servetle servet, vergilerin inşaatla ve adaletle inşa edilmesiyle ilgili sözleri. Ana nokta, tebaasının kendisi olduğu sürece krallığın olmamasıdır. Kitabı, bu kelimelerin yorumunu kapsar ve Aristoteles'in öğretisi veya iki kaynağın faydası olmadan genel anlamlarını ayrıntılı olarak açıklar. İbn el-Muqaffa'nın mektuplarındaki ve Ebu Bekir el-Türkuşi'nin Siraj al-Muluk adlı kitabındaki sözleri, onun birçok sorununu hitabet tarzında içerir {atıf:Muqaddima-ibn-khaldun, s. 44-45}."
  id: "Delapan kata bijak politik yang dikutip oleh Ibn Khaldun dari buku yang dikaitkan dengan Aristoteles tentang politik, beberapa di antaranya saling terkait dan mukjizat mereka ditelusuri kembali ke dada mereka dalam lingkaran yang tidak perlu diputar: Dunia adalah taman yang dikelilingi oleh negara, negara adalah kedaulatan tempat Sunni hidup, Sunnah adalah politik yang diatur oleh raja, raja adalah sistem yang didukung oleh tentara, tentara adalah pembantu yang dijamin oleh kekayaan, kekayaan adalah mata pencaharian yang dikumpulkan oleh rakyat, rakyat adalah budak yang dikelilingi keadilan, keadilan adalah hal yang dikenal dan memiliki dasar dunia, lalu kembali ke awal pidato, dan dalam maknanya adalah kata-kata penyelamat Bahram bin Bahram sang raja Kehormatannya hanya dicapai oleh Syariah, dan dasar Syariah hanya melalui kerajaan, dan kehormatan bagi raja kecuali melalui manusia, dan kekuatan bagi manusia kecuali melalui kekayaan, dan kekayaan hanya melalui pembangunan, dan tidak ada jalan untuk membangun kecuali melalui keadilan. Kata-kata Anushirwan tentang raja dengan tentara, tentara dengan kekayaan, kekayaan dengan pajak, pajak dengan pembangunan, dan pembangunan dengan keadilan. Poin utamanya adalah kurangnya kepemimpinan raja sementara rakyatnya adalah diri mereka sendiri. Bukunya mencakup penafsiran kata-kata ini dan merinci makna umumnya tanpa ajaran Aristoteles atau manfaat dari dua sumber. Kata-kata Ibn al-Muqaffa dalam surat-suratnya dan buku Abu Bakr al-Turtushi Siraj al-Muluk memuat banyak edisinya dalam gaya orasi {cite:muqaddima-ibn-khaldun, hlm. 44-45}."
