id: concept/inhabitants-of-the-heavens-reports
class: concept
kind: term
label: { ar: "أخبار أهل السماوات وبنائها في الحديث", en: "Hadith reports on the heavens' inhabitants and structure", ur: "آسمانوں کے باشندوں اور ساخت کے بارے میں احادیث", es: "Los hadices relatan la vida y la estructura de los cielos.", fr: "Les hadiths rapportent des informations sur les habitants et la structure des cieux." }
summary:
  ar: "تتناول أحاديث متعددة امتلاء السماء بالملائكة الساجدين وأطيطها، وما بين السماوات من مسافات، وثقل الكرسي والعرش، والبيت المعمور ودخول سبعين ألف ملك إليه، والمعراج عبر السماوات السبع؛ وتتفاوت درجاتها عند العلماء بين الصحيحين والحسن والضعيف {cite:jami-al-tirmidhi 2312} {cite:sunan-abi-dawud 4723} {cite:sahih-al-bukhari 3207}."
  en: "Several hadith reports speak of the sky being full of prostrating angels and groaning, the distances between the heavens, the Kursi and the Throne, the Bayt al-Ma'mur entered daily by seventy thousand angels, and the ascent through the seven heavens; scholars graded them differently, from the two Sahihs to hasan to weak {cite:jami-al-tirmidhi 2312} {cite:sunan-abi-dawud 4723} {cite:sahih-al-bukhari 3207}."
  ur: "متعدد احادیث آسمان کے ساجد فرشتوں سے بھرے ہونے اور چرچرانے، آسمانوں کے درمیانی فاصلوں، کرسی و عرش، بیت المعمور میں روزانہ ستر ہزار فرشتوں کے داخل ہونے اور سات آسمانوں سے معراج کا ذکر کرتی ہیں؛ علما نے ان کے درجے مختلف بتائے، صحیحین سے لے کر حسن اور ضعیف تک {cite:jami-al-tirmidhi 2312} {cite:sunan-abi-dawud 4723} {cite:sahih-al-bukhari 3207}۔"
  es: "Varios informes de hadices hablan de que el cielo está lleno de ángeles postrados y gimiendo, las distancias entre los cielos, el Kursi y el Trono, la Bahía de los Magos a la que entran diariamente setenta mil ángeles, y el ascenso a través de los siete cielos; los eruditos los clasificaron de manera diferente, desde los dos Sahihs hasta hasan y débiles {cite:jami-al-tirmidhi 2312} {cite:sunan-abi-dawud 4723} {cite:sahih-al-bukhari 3207}."
  fr: "Plusieurs hadiths évoquent un ciel rempli d'anges prosternés et gémissants, les distances entre les cieux, le Kursi et le Trône, le Bayt al-Ma'mur où pénètrent quotidiennement soixante-dix mille anges, et l'ascension à travers les sept cieux; les savants les ont classés différemment, des deux Sahihs à hasan à faible {cite:jami-al-tirmidhi 2312} {cite:sunan-abi-dawud 4723} {cite:sahih-al-bukhari 3207}."
