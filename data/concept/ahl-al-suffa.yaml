id: concept/ahl-al-suffa
class: concept
kind: belief
label: { ar: "أهل الصفة", en: "The people of the bench (ahl al-suffa)", ur: "اہل صفہ" }
summary:
  ar: "يذكر الشعراوي في تفسير آية الفقراء المحصرين في سبيل الله أن أهل الصفة كانوا فقراء لا يستطيعون الضرب في الأرض، وأن الأنصار كانوا يعلقون التمر في المسجد لإطعامهم، ويفسر الصفات الدالة على حالهم بالسيما وعدم الإلحاف {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1177} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1178} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1179}."
  en: "In his reading of the verse on the poor confined for God's cause, Sha'rawi says the people of the bench were poor and unable to travel for trade. The Ansar used to hang dates in the mosque for them. He reads the marks of their condition as their mark and their not asking persistently {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1177} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1178} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1179}."
  ur: "شعراوی اس آیت کی تفسیر میں جو اللہ کی راہ میں روکے ہوئے فقراء کے بارے میں ہے، کہتے ہیں کہ اہل صفہ محتاج تھے اور تجارت کے لیے سفر نہیں کر سکتے تھے۔ انصار مسجد میں کھجوریں لٹکاتے تھے تاکہ وہ کھائیں۔ وہ ان کی حالت کی علامت کو «سیما» اور اصرار سے سوال نہ کرنے کے معنی میں لیتے ہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1177} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1178} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1179}۔"
