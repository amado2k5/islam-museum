id: concept/zij-sabi-the-distance-of-the-moon-from-its-parallax
class: concept
kind: scientific
label: { ar: "بُعد القمر عن الأرض من اختلاف منظره", en: "The Moon's distance from the Earth from its parallax", ur: "منظر کے اختلاف سے چاند کا زمین سے فاصلہ", es: "La distancia de la Luna a la Tierra a partir de su paralaje", fr: "La distance de la Lune à la Terre d'après sa parallaxe", tr: "Ay'ın Dünya'ya olan uzaklığı, görünümünün değişmesine neden olur.", id: "Jarak bulan dari Bumi menyebabkan penampilannya berubah." }
summary:
  ar: "يعرض البتاني في الباب الأربعين طريقة معرفة بُعد القمر عن الأرض من قِبَل اختلاف منظره في دائرة الارتفاع إذا كان ذلك معلوماً، إما بالرصد أو بالجداول، بزيادة اختلاف منظر القمر في الطول والعرض على اختلاف منظر الشمس إن أُخذ من الجداول. {cite:zij-sabi-nallino-byblion p.127}."
  en: "In chapter forty al-Battani gives the way to find the Moon's distance from the Earth from its parallax in the altitude circle, once that parallax is known, either by observation or by the tables: the parallax of the Moon in longitude and latitude is added to the Sun's parallax when taken from the tables. {cite:zij-sabi-nallino-byblion p.127}."
  ur: "چالیسویں باب میں البتانی بتاتے ہیں کہ دائرۂ ارتفاع میں اختلافِ منظر معلوم ہو تو اس سے چاند کا زمین سے فاصلہ کیسے نکلے، خواہ رصد سے ہو یا جداول سے؛ جداول سے لیا جائے تو چاند کے طول اور عرض کا اختلافِ منظر سورج کے اختلافِ منظر پر بڑھایا جاتا ہے۔ {cite:zij-sabi-nallino-byblion p.127}۔"
  es: "En el capítulo cuarenta, al-Battani explica cómo calcular la distancia de la Luna a la Tierra a partir de su paralaje en el círculo de altitud, una vez que se conoce dicho paralaje, ya sea por observación o mediante tablas: al paralaje del Sol, tomado de las tablas, se le suma el paralaje de la Luna en longitud y latitud. {cite:zij-sabi-nallino-byblion p.127}."
  fr: "Au chapitre quarante, al-Battani explique comment calculer la distance de la Lune à la Terre à partir de sa parallaxe dans le cercle héliocentrique, une fois cette parallaxe connue, soit par observation, soit à l'aide de tables: la parallaxe de la Lune en longitude et en latitude est ajoutée à celle du Soleil lorsqu'elle est tirée des tables. {cite:zij-sabi-nallino-byblion p.127}."
  tr: "El-Battani, kırkıncı bölümde, ayın görünen yüksekliğindeki değişimi gözlemleyerek (eğer bu bilgi gözlem yoluyla veya tablolardan biliniyorsa) ayın dünyadan uzaklığını belirleme yöntemini sunmaktadır. Bu, ayın görünen yüksekliğindeki ve genişliğindeki değişimin, tablolardan alınan güneşin görünen yüksekliğindeki değişime göre artırılmasıyla yapılır. {cite:zij-sabi-nallino-byblion s.127}."
  id: "Dalam bab empat puluh, al-Battani menyajikan metode untuk menentukan jarak bulan dari bumi dengan mengamati variasi ketinggian tampak bulan, jika hal ini diketahui, baik melalui pengamatan maupun dari tabel. Hal ini dilakukan dengan meningkatkan variasi ketinggian dan lebar tampak bulan dibandingkan dengan variasi ketinggian tampak matahari jika diambil dari tabel. {cite:zij-sabi-nallino-byblion p.127}."
