label:
  ar: يوم الصراط
  en: The Day of the Bridge
  ur: یوم صراط
summary:
  ar: "يوم الصراط في القرآن والسنة: اليوم الذي يمر فيه الناس على الصراط فوق جهنم، يذكر أنه من أشراط الساعة، وأن فيه من الفزع ما لا يوصف، وأن الناس يمرون عليه كالبرق أو كالريح أو كالطير أو كالخيل أو كالرجل أو يمشون ويثبنون."
  en: "The Day of the Bridge in Qur'an and Sunnah: the day people pass over the Sirat above Hell — a sign of the Hour, a day of indescribable terror, when people cross it like lightning, wind, birds, horses, or running and leaping."
  ur: "یوم صراط قرآن و سنت میں: وہ دن جب لوگ جهنم کے اوپر صراط پر گزرتے ہیں — ساعت کی نشانیوں میں سے، ایک ایسا دن جس کا خوف بیان نہیں کیا جا سکتا، جب لوگ اس پر بجلی، ہوا، پرندوں، گھوڑوں، یا دوڑتے چھلانگ لگاتے ہوئے گزرتے ہیں۔"
