label:
  ar: يوم الصراط
  en: The Day of the Bridge
  ur: یوم صراط
  es: "El día del puente"
  fr: "Le jour du pont"
  tr: "Köprü Günü"
  id: "Hari Jembatan"
summary:
  ar: "يوم الصراط في القرآن والسنة: اليوم الذي يمر فيه الناس على الصراط فوق جهنم، يذكر أنه من أشراط الساعة، وأن فيه من الفزع ما لا يوصف، وأن الناس يمرون عليه كالبرق أو كالريح أو كالطير أو كالخيل أو كالرجل أو يمشون ويثبنون."
  en: "The Day of the Bridge in Qur'an and Sunnah: the day people pass over the Sirat above Hell — a sign of the Hour, a day of indescribable terror, when people cross it like lightning, wind, birds, horses, or running and leaping."
  ur: "یوم صراط قرآن و سنت میں: وہ دن جب لوگ جهنم کے اوپر صراط پر گزرتے ہیں — ساعت کی نشانیوں میں سے، ایک ایسا دن جس کا خوف بیان نہیں کیا جا سکتا، جب لوگ اس پر بجلی، ہوا، پرندوں، گھوڑوں، یا دوڑتے چھلانگ لگاتے ہوئے گزرتے ہیں۔"
  es: "El Día del Puente en el Corán y la Sunnah: el día en que la gente cruza el Sirat sobre el Infierno, una señal de la Hora, un día de terror indescriptible, cuando la gente lo cruza como un rayo, el viento, pájaros, caballos, o corriendo y saltando."
  fr: "Le Jour du Pont dans le Coran et la Sunna: le jour où les gens franchissent le Sirat au-dessus de l'Enfer — un signe de l'Heure, un jour d'une terreur indescriptible, où les gens le traversent comme l'éclair, le vent, les oiseaux, les chevaux, ou en courant et en sautant."
  tr: "Kur'an ve Sünnette Köprü Günü: İnsanların cehennem köprüsünden geçeceği gün. Bunun kıyametin alametlerinden biri olduğu, içinde tarifsiz bir dehşet olduğu ve insanların oradan şimşek gibi, rüzgar gibi, kuş gibi, at gibi, insan gibi geçeceği veya yürüyüp zıplayacakları belirtilmiştir."
  id: "Hari Jembatan dalam Al-Qur'an dan Sunnah: Hari ketika manusia akan melewati jembatan di atas Neraka. Disebutkan bahwa itu adalah salah satu tanda-tanda Hari Kiamat, dan bahwa ada kengerian yang tak terlukiskan di dalamnya, dan bahwa manusia akan melewatinya seperti kilat, atau seperti angin, atau seperti burung, atau seperti kuda, atau seperti manusia, atau mereka akan berjalan dan melompat."
