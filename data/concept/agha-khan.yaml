label:
  ar: "آغا خان"
  en: "Agha Khan (title of the Nizari Imams)"
  fr: "Agha Khan (titre des imams nizârites)"
  es: "Agha Khan (título de los imanes nizaríes)"
summary:
  ar: "آغا خان لقب أئمة الإسماعيلية النزارية، وأصله لقب فخري في بلاط القاجاريين بإيران حمله حسن علي شاه سنة 1817 وما بعدها، ثم ثبت لخلفائه في بومباي ومنهم سلطان محمد شاه، المولود سنة 1877، الذي تولّى الإمامة الروحية لجماعات النزارية في الهند وفارس وآسيا الوسطى وسوريا وشرق أفريقيا {cite:encyclopaedia-of-islam-2 vol. 1 p. 268}."
  en: "Agha Khan is the title of the Nizari Ismaili Imams. It began as an honorary title at the Qajar court in Persia, borne by Hasan 'Ali Shah, and his successors kept it from Bombay. The Agha Khan of the article's time, Sultan Muhammad Shah (born 1877), led the Nizari community in India, Persia, Central Asia, Syria and East Africa; his heir was 'Ali Khan (born 1910) {cite:encyclopaedia-of-islam-2 vol. 1 p. 268}."
  fr: "Agha Khan est le titre des imams ismaéliens nizârites. Il fut d’abord un titre honorifique à la cour qajare de Perse, porté par Hasan 'Ali Shah, et ses successeurs le conservèrent depuis Bombay. L’Agha Khan à l’époque de l’article, Sultan Muhammad Shah (né en 1877), dirigeait la communauté nizârite en Inde, en Perse, en Asie centrale, en Syrie et en Afrique orientale ; son héritier était 'Ali Khan (né en 1910) {cite:encyclopaedia-of-islam-2 vol. 1 p. 268}."
  es: "Agha Khan es el título de los imanes ismaelitas nizaríes. Comenzó como un título honorífico en la corte Qajar de Persia, ostentado por Hasan 'Ali Shah, y sus sucesores lo conservaron desde Bombay. El Agha Khan de la época en que se escribió este artículo, Sultan Muhammad Shah (nacido en 1877), lideró la comunidad nizarí en India, Persia, Asia Central, Siria y África Oriental; su heredero fue 'Ali Khan (nacido en 1910) {cite:encyclopaedia-of-islam-2 vol. 1 p. 268}."
