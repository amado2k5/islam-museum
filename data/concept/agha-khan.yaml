label:
  ar: "آغا خان"
  en: "Agha Khan (title of the Nizari Imams)"
summary:
  ar: "آغا خان لقب أئمة الإسماعيلية النزارية، وأصله لقب فخري في بلاط القاجاريين بإيران حمله حسن علي شاه سنة 1817 وما بعدها، ثم ثبت لخلفائه في بومباي ومنهم سلطان محمد شاه، المولود سنة 1877، الذي تولّى الإمامة الروحية لجماعات النزارية في الهند وفارس وآسيا الوسطى وسوريا وشرق أفريقيا {cite:encyclopaedia-of-islam-2 vol. 1 p. 268}."
  en: "Agha Khan is the title of the Nizari Ismaili Imams. It began as an honorary title at the Qajar court in Persia, borne by Hasan 'Ali Shah, and his successors kept it from Bombay. The Agha Khan of the article's time, Sultan Muhammad Shah (born 1877), led the Nizari community in India, Persia, Central Asia, Syria and East Africa; his heir was 'Ali Khan (born 1910) {cite:encyclopaedia-of-islam-2 vol. 1 p. 268}."
