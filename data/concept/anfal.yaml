label: { ar: "الأنفال", en: "Anfal (spoils and the other gains taken from the enemy, and their divisions)" }
summary:
  ar: "النَّفل لغة الغنيمة، وأصله الزيادة. وقد اختلف في تعريفه اصطلاحا على خمسة أقوال: الغنائم، والفيء، والخمس، والتنفيل، والسلب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3514}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515} وتُطلق الأنفال على أموال الحربيين التي آلت إلى المسلمين بقتال أو بغير قتال، فتدخل فيها الغنيمة والفيء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515} والرضخ عطاء من الغنيمة لا يزيد على سهم واحد تقديره إلى ولي الأمر لمن أعان في القتال من النساء والصبيان والذميين والعبيد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515} ويختلف حكم الأنفال بحسب مفرداتها، وينظر حكم كل منها في مصطلحه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515}"
  en: "Nafl, in lexical sense, is spoil (ghanima), and its root sense is increase. The term has five definitions in usage: the spoils, the fay', the fifth, the tanfil (an extra grant), and the salab (a horseman's extra share). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3514}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515} The anfal in general are the properties of the enemy that came to the Muslims by fighting or without it, and so include both spoils and fay'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515} Radkh is a grant from the spoils not exceeding one share, fixed by the ruler, to those who helped in the fighting, such as women, children, protected non-Muslims and slaves. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515} The ruling varies with each part, and each is treated under its own term. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515}"
