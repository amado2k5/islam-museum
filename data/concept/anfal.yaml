id: concept/anfal
class: concept
kind: legal
label: { ar: "الأنفال", en: "Anfal (spoils and the other gains taken from the enemy, and their divisions)", es: "Anfal (botín y demás ganancias obtenidas del enemigo y sus divisiones)", fr: "Anfal (butin et autres gains pris à l'ennemi et à ses divisions)", ur: "انفال ⁦(دشمن سے لیا گیا مال غنیمت اور ان کی تقسیم)⁩", tr: "El-Enfal", id: "Al-Anfal" }
summary:
  ar: "النَّفل لغة الغنيمة، وأصله الزيادة. وقد اختلف في تعريفه اصطلاحا على خمسة أقوال: الغنائم، والفيء، والخمس، والتنفيل، والسلب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3514}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515} وتُطلق الأنفال على أموال الحربيين التي آلت إلى المسلمين بقتال أو بغير قتال، فتدخل فيها الغنيمة والفيء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515} والرضخ عطاء من الغنيمة لا يزيد على سهم واحد تقديره إلى ولي الأمر لمن أعان في القتال من النساء والصبيان والذميين والعبيد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515} ويختلف حكم الأنفال بحسب مفرداتها، وينظر حكم كل منها في مصطلحه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515}"
  en: "Nafl, in lexical sense, is spoil (ghanima), and its root sense is increase. The term has five definitions in usage: the spoils, the fay', the fifth, the tanfil (an extra grant), and the salab (a horseman's extra share). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3514}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515} The anfal in general are the properties of the enemy that came to the Muslims by fighting or without it, and so include both spoils and fay'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515} Radkh is a grant from the spoils not exceeding one share, fixed by the ruler, to those who helped in the fighting, such as women, children, protected non-Muslims and slaves. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515} The ruling varies with each part, and each is treated under its own term. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515}"
  es: "Nafl, en sentido léxico, es botín (ghanima), y su sentido raíz es aumento. El término tiene cinco definiciones en uso: el botín, el fay', la quinta parte, el tanfil (una concesión adicional) y el salab (la parte adicional de un jinete). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3514}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515} El anfal en general son las propiedades del enemigo que llegaron a los musulmanes luchando o no, y por lo tanto incluyen tanto el botín como el fay'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515} Radkh es una concesión del botín que no excede una parte, fijada por el gobernante, a aquellos que ayudaron en la lucha, como mujeres, niños, no musulmanes protegidos y esclavos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515} La norma varía según cada parte, y cada una se trata bajo su propio término. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515}"
  fr: "Nafl, au sens lexical, signifie butin (ghanima), et son sens premier est « accroissement ». Ce terme a cinq définitions en usage: le butin, le fay', le cinquième, le tanfil (une allocation supplémentaire) et le salab (la part supplémentaire d'un cavalier). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3514}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515} Les anfal désignent généralement les biens de l'ennemi parvenus aux musulmans par la guerre ou sans combat, et comprennent donc à la fois le butin et le fay'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515} Le radkh est une allocation prélevée sur le butin, n'excédant pas une part, fixée par le souverain, à ceux qui ont participé aux combats, tels que les femmes, les enfants, les non-musulmans protégés et les esclaves. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515} La décision varie selon les parties, et chacune est traitée selon sa propre terminologie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515}"
  ur: "نفل لغوی معنی میں غنیمت ہے اور اس کا اصل معنی اضافہ ہے۔ استعمال میں اس اصطلاح کی پانچ تعریفیں ہیں: غنیمت، فائی، پانچواں، تنفیل ⁦(اضافی امداد)⁩ اور سلب ⁦(گھڑ سوار کا اضافی حصہ)⁩۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3514}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515} عام طور پر انفال دشمن کے وہ خواص ہیں جو مسلمانوں کے پاس لڑ کر یا اس کے بغیر آئے، اور اس میں غنیمت اور فائی دونوں شامل ہیں۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 3515} ردخ اس مال غنیمت میں سے ایک عطیہ ہے جو ایک حصہ سے زیادہ نہ ہو، حاکم کی طرف سے لڑائی میں مدد کرنے والوں، جیسے خواتین، بچے، غیر مسلموں اور غلاموں کے لیے مقرر کیا جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3515} ہر حصے کے ساتھ حکم مختلف ہوتا ہے، اور ہر ایک کو اس کی اپنی اصطلاح کے تحت سمجھا جاتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 3515}"
  tr: "Nafl, ganimetlerin dilidir ve kökeni toplamadır. Beş görüşe göre terminolojide farklılıklar vardır: ganimet, al-fay', al-khums, tanfil ve porsiyon. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3514} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3515} 'al-anfal' terimi, savaş olsun ya da savaşmamanın Müslümanlara gelen savaş ağalarının servetini ifade eder; bu nedenle ganimet ve ziyafet de buna dahildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3515} Ve teslimiyet, hükümdar tarafından savaşa yardım edenler, kadınlar, çocuklar, zimmiler ve köleler için tahmin edilen ganimetten bir payı aşmayan bir armağandır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3515} El-Enfal üzerindeki hüküm şartlarına göre değişir ve her birinin kararı terminolojide değerlendirilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3515}"
  id: "Nafl adalah bahasa rampasan, dan asal-usulnya adalah penambahan. Ada perbedaan definisi dalam istilah istilah menurut lima pendapat: rampasan, al-fay', al-khums, tanfil, dan rampasan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3514} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3515} Istilah 'al-Anfal' merujuk pada kekayaan para panglima perang yang datang kepada umat Muslim dengan atau tanpa perang, sehingga rampasan dan pesta termasuk di dalamnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3515} Dan penyerahan adalah hadiah dari rampasan tidak melebihi satu bagian, yang diperkirakan oleh penguasa untuk mereka yang membantu dalam pertempuran, termasuk wanita, anak-anak, dhimmi, dan budak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3515} Putusan tentang Al-Anfal bervariasi sesuai dengan istilahnya, dan putusan masing-masing dipertimbangkan dalam istilahnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3515}"
