id: concept/crafts-in-islam
class: concept
kind: ethical
label:
  ar: الصناعة في الإسلام
  en: Crafts in Islam
summary:
  ar: "يعدّ المراغي الصناعات من أهم أركان بناء العالم، وأساس الحضارات، ومن فروض الكفاية التي تأثم الجماعة كلها إن خلت منها {cite:min-qadaya-al-mal-wal-amal-azhar p. 36}. وينقل عن الغزالي أن أصول الصناعات كالفلاحة والحياكة والحجامة من فروض الكفاية {cite:min-qadaya-al-mal-wal-amal-azhar p. 36}. ويذكر أن القرآن أشار إلى صنعة الدروع التي مارسها داود، وإلى صنعة السفينة التي أُمر بها نوح {cite:min-qadaya-al-mal-wal-amal-azhar p. 37}. ويعدّ الصانع أجيرًا فيما استُصنع فيه، ويجب عليه الإخلاص وإتقان العمل والوفاء بالوعد {cite:min-qadaya-al-mal-wal-amal-azhar p. 37}. ويورد حديث «إن الله يحب إذا عمل أحدكم عملًا أن يتقنه»، وينقل عن أحمد بن حنبل أنه لا يجوز إخفاء العيب في ما يُباع {cite:min-qadaya-al-mal-wal-amal-azhar p. 37} {cite:min-qadaya-al-mal-wal-amal-azhar p. 38}. ويرى أن الإسلام يحرّم من الصناعات ما يحرم من الأعمال، كصناعة الخمر والمخدرات {cite:min-qadaya-al-mal-wal-amal-azhar p. 37}."
  en: "Al-Maraghi calls crafts a pillar of the economy and the basis of civilisations, and a communal duty (fard kifaya) whose neglect makes the whole community sinful (p. 36). After al-Ghazali, farming, weaving and cupping are such duties (p. 36). The Qur'an mentions David's armour-making and Noah's ship-building (p. 37). The craftsman is a hired worker for what he makes and must perfect the work (p. 37). Concealing defects in what is sold is forbidden (p. 38). Forbidden crafts are those forbidden as work (p. 37)."
