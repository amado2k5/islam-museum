class: concept
kind: ethical
label:
  ar: الصناعة في الإسلام
  en: Crafts in Islam
  es: "Artesanía en el Islam"
  fr: "L'artisanat islamique"
  ur: "اسلام میں دستکاری"
  tr: "İslam'da Sanayi"
  id: "Industri dalam Islam"
summary:
  ar: "يعدّ المراغي الصناعات من أهم أركان بناء العالم، وأساس الحضارات، ومن فروض الكفاية التي تأثم الجماعة كلها إن خلت منها {cite:min-qadaya-al-mal-wal-amal-azhar p. 36}. وينقل عن الغزالي أن أصول الصناعات كالفلاحة والحياكة والحجامة من فروض الكفاية {cite:min-qadaya-al-mal-wal-amal-azhar p. 36}. ويذكر أن القرآن أشار إلى صنعة الدروع التي مارسها داود، وإلى صنعة السفينة التي أُمر بها نوح {cite:min-qadaya-al-mal-wal-amal-azhar p. 37}. ويعدّ الصانع أجيرًا فيما استُصنع فيه، ويجب عليه الإخلاص وإتقان العمل والوفاء بالوعد {cite:min-qadaya-al-mal-wal-amal-azhar p. 37}. ويورد حديث «إن الله يحب إذا عمل أحدكم عملًا أن يتقنه»، وينقل عن أحمد بن حنبل أنه لا يجوز إخفاء العيب في ما يُباع {cite:min-qadaya-al-mal-wal-amal-azhar p. 37} {cite:min-qadaya-al-mal-wal-amal-azhar p. 38}. ويرى أن الإسلام يحرّم من الصناعات ما يحرم من الأعمال، كصناعة الخمر والمخدرات {cite:min-qadaya-al-mal-wal-amal-azhar p. 37}."
  en: "Al-Maraghi calls crafts a pillar of the economy and the basis of civilisations, and a communal duty (fard kifaya) whose neglect makes the whole community sinful (p. 36). After al-Ghazali, farming, weaving and cupping are such duties (p. 36). The Qur'an mentions David's armour-making and Noah's ship-building (p. 37). The craftsman is a hired worker for what he makes and must perfect the work (p. 37). Concealing defects in what is sold is forbidden (p. 38). Forbidden crafts are those forbidden as work (p. 37)."
  es: "Al-Maraghi considera la artesanía un pilar de la economía y la base de las civilizaciones, así como un deber comunitario (fard kifaya) cuya negligencia hace pecar a toda la comunidad (p. 36). Según al-Ghazali, la agricultura, el tejido y la ventosaterapia son ejemplos de tales deberes (p. 36). El Corán menciona la fabricación de armaduras de David y la construcción de barcos de Noé (p. 37). El artesano es un trabajador asalariado por lo que fabrica y debe perfeccionar su trabajo (p. 37). Ocultar defectos en lo que se vende está prohibido (p. 38). Las artesanías prohibidas son aquellas cuyo trabajo está prohibido (p. 37)."
  fr: "Al-Maraghi considère l'artisanat comme un pilier de l'économie et le fondement des civilisations, ainsi qu'un devoir communautaire (fard kifaya) dont la négligence rend la communauté entière coupable de péché (p. 36). Selon al-Ghazali, l'agriculture, le tissage et la confection de coupes sont des devoirs de ce type (p. 36). Le Coran mentionne la fabrication d'armures par David et la construction navale par Noé (p. 37). L'artisan est un salarié rémunéré pour son travail et doit le perfectionner (p. 37). Dissimuler des défauts dans ce qui est vendu est interdit (p. 38). Les métiers interdits sont ceux dont l'exercice est prohibé (p. 37)."
  ur: "المراثی نے دستکاری کو معیشت کا ستون اور تہذیبوں کی بنیاد، اور ایک اجتماعی فرض ⁦(فرد کفایہ)⁩ کہا ہے جس کی غفلت پوری کمیونٹی کو گناہگار بنا دیتی ہے ⁦(ص 36)⁩۔ الغزالی کے بعد کھیتی باڑی، بُنائی اور سنگی وغیرہ ایسے فرائض ہیں ⁦(ص 36)⁩۔ قرآن نے داؤد کے ہتھیار بنانے اور نوح کے جہاز بنانے کا ذکر کیا ہے ⁦(ص 37)⁩۔ کاریگر جو کچھ بناتا ہے اس کے لیے کرائے کا مزدور ہوتا ہے اور اسے کام کو مکمل کرنا چاہیے ⁦(ص 37)⁩۔ بیچی ہوئی چیزوں میں عیب چھپانا حرام ہے ⁦(ص 38)⁩۔ ممنوعہ دستکاری وہ ہیں جو کام کے طور پر حرام ہیں ⁦(ص 37)⁩۔"
  tr: "Maraghi Endüstrileri, dünyayı inşa etmenin en önemli direklerindendir, medeniyetlerin temelini oluşturur ve yokluğunda tüm topluluğu günahkar yapan ortak yükümlülükler arasında yer alır {cite:min-qadaya-al-mal-wal-amal-azhar s. 36}. Al-Gazali'den bildirildiğine göre, tarım, dokuma ve kupa gibi endüstrilerin temelleri toplu yükümlülükler arasında yer alır {cite:min-qadaya-al-mal-wal-amal-azhar s. 36}. Kur'an'ın Davut'un zırh ustalığına ve Nuh'un emrettiği gemi zanaatına atıfta bulunduğu belirtilir {cite:min-qadaya-al-mal-wal-amal-azhar s. 37}. Zanaatkâr, ustalığı nedeniyle ücretli kabul edilir ve samimi olmalı, işi ustalıkla yapmalı ve sözünü yerine getirmelidir {cite:min-qadaya-al-mal-wal-amal-azhar s. 37}. Ayrıca hadisi rivayet eder: \"Gerçekten Allah, biriniz bir iş yaptığında onu mükemmelleştirmesini sever,\" ve Ahmed bin Hanbal'dan, satılan şeydeki kusurların gizlenmesinin caiz olmadığını rivayet eder {cite:min-qadaya-al-mal-wal-amal-azhar s. 37} {cite:min-qadaya-al-mal-wal-amal-azhar s. 38}. İslam'ın alkol ve uyuşturucu üretimi gibi yasak endüstrileri yasakladığına inanır {cite:min-qadaya-al-mal-wal-amal-azhar s. 37}."
  id: "Industri Maraghi adalah salah satu pilar terpenting dalam membangun dunia, fondasi peradaban, dan di antara kewajiban kolektif yang membuat seluruh komunitas berdosa jika tidak ada {cite:min-qadaya-al-mal-wal-amal-azhar hlm. 36}. Dilaporkan dari Al-Ghazali bahwa dasar-dasar industri seperti pertanian, tenunan, dan pembuatan bekam termasuk di antara kewajiban kolektif {cite:min-qadaya-al-mal-wal-amal-azhar hlm. 36}. Disebutkan bahwa Al-Quran merujuk pada kerajinan zirah yang dipraktikkan oleh Daud dan pada kerajinan bahtera yang diperintahkan Nuh {cite:min-qadaya-al-mal-wal-amal-azhar hlm. 37}. Pengrajin dianggap sebagai pekerja upahan atas keahliannya, dan harus tulus, menguasai pekerjaan, dan memenuhi janji {cite:min-qadaya-al-mal-wal-amal-azhar hlm. 37}. Ia juga menceritakan hadis: \"Sesungguhnya, Allah bersuka bahwa ketika salah satu dari kalian melakukan pekerjaan, ia menyempurnakannya,\" dan diceritakan dari Ahmad ibn Hanbal bahwa tidak diperbolehkan menyembunyikan cacat dalam apa yang dijual {cite:min-qadaya-al-mal-wal-amal-azhar hlm. 37} {cite:min-qadaya-al-mal-wal-amal-amal-azhar hlm. 38}. Ia percaya bahwa Islam melarang industri terlarang, seperti pembuatan alkohol dan narkoba {cite:min-qadaya-al-mal-wal-amal-amal-azhar hlm. 37}."
