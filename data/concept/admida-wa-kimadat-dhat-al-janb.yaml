"summary":
  "ar": "ومما يكثر النفث النوم على الجنب العليل وربما احتيج إلى هز يسير وإلى سقيه\
    \ الماء الذي إلى الحرارة متتابعة فإنه نافع له جداً، وقد يستعان بضمادات ومروخات\
    \ وأول ما يجب أن يستعمل فيها قيروطي من هذا الجنس ثم يتدرج إلى الشحوم والألعبة\
    \ وغبار الرحا ثم يتدرج إلى ما هو أقوى من أضمدة هذا الجنس وإن احتيج إلى ما هو أقوى\
    \ استعمل الضماد المتخذ من أقوى هذا الجنس، واعلم أنه إن كانت المادة كثيرة فالأضمدة\
    \ والأطلية ضارة وإن كانت قليلة لم تضر وكذلك إن كان الورم تحلل وبقيت بقية، وإذا\
    \ وقع استفراغ عن الفصد نافع جاز أيضاً الطلاء، وقد وصف فيها ضماداً حسناً ومروخاً\
    \ حسناً من هذا الجنس، ومن الأضمدة التي تجمع الإنضاج لتسكين الوجع ضماد من هذا الجنس\
    \ وقد يستعان فيها بكمادات رطبة ويابسة والرطبة أوفق لما يضرب إلى الحمرة واليابسة\
    \ لما يضرب إلى الفلغمونية لكن الرطب إذا لم ينفع لم يضر واليابس إن ضر ضر عظيماً،\
    \ وأولاها بالتقديم الإسفنج المبلول بالماء الحار وأقوى منه ماء البحر والماء المالح\
    \ ثم يجاوز ذلك إن احتيج إليه فيكمد بالبخار أو بمادة حارة من هذا الجنس وأقوى من\
    \ ذلك ما يتخذ بالخل وما يجري مجراه على الصوف المشرب دهناً ومن اليابسات اللطيفة\
    \ النخالة ثم الجاورس ثم الملح، والتكميد والفصد يحل كل وجع عالٍ أو سافل إذا لم\
    \ يكن مانع من امتلاء بجذبه التكميد وأما الفصد فأكثر حله للأوجاع العالية، وإذا\
    \ ضمدت أو كمدت فاجتهد أن تحبس بخارهما عن وجه العليل لئلا يهيج به كرب وضيق نفس،\
    \ وربما كانت العلة شديدة اليبس فينفع بخار الضماد والكماد الرطبين المعتدلين إذا\
    \ ضرب الوجه وذهب في الاستنشاق، وقد يستعان بلعوقات يستعملونها وأليقها وأوفقها للمحرورين\
    \ من هذا الجنس، والثقة بأنه قد استنقى فإن المحاجم إذا وضعت على الموضع الوجع ظهر\
    \ منها نفع عظيم وربما سكنت الوجع أصلاً وربما جذبته إلى النواحي الخارجة وضماد الخردل\
    \ إن استعمل في مثل هذا الموضع عمل عمل المحاجم في الجذب، فإذا جاوز السابع فإن الأقدمين\
    \ كانوا يأمرون بلعوق من هذا الجنس وربما استعملوا المعاجين الكبار وهو طريق جيد\
    \ يقد عليه المحققون للصناعة الواثقون من أنفسهم بالتفطن لتلاف إن اقتضاه هذا التدبير\
    \ وبالاقتدار عليه فيبلغون به من التنقية المبلغ الشافي وأما المحدثون الجبناء غير\
    \ الواثقين من أنفسهم في ذلك فإنهم يخافون العسل ويجعلون بدله السكر، وكان الأقدمون\
    \ أيضاً يشيرون بأدوية قوية التنقية مهيأة بالعسل حبوباً تمسك تحت اللسان ويشيرون\
    \ في هذا الوقت بالأضمدة المسماة ذات الرائحة وبالأدهان من هذا الجنس، وبالجملة من\
    \ سلك هذا السبيل الذي للقدماء فيجب أن يسلكه بتوق وتحرز وخوف أن يفجر ورماً أو يهيج\
    \ حرارة كثيرة ثم له أن يثق بعد ذلك بالنجاح العاجل، فإن بقيت العلة إلى الرابع عشر\
    \ لم يكن بد من الحجامة في الأبير حينئذ، وإذا اشتد بهم السهر فلا بد من شراب من\
    \ هذا الجنس، وإذا تواتر فيهم النفس فتدارك ضرره إنما يكون بالترطيب بمثل لعاب هذا\
    \ الجنس يجرع منه شيئاً بعد شيء بمثل الجلاب، وقد ينتفع بنطل الجنب بماء فاتر ليخف\
    \ الوجع ويقل تواتر النفس فإنه ضار على ما قد عرفت، وبعد الانحطاط الظاهر يستعمل\
    \ الحمام ويجتنب التبريد الشديد إلا فيما كان من جنس الحمرة وكذلك يجتنب التدبير\
    \ المغلظ ويستقل بالتلطيف ويطبخ في المياه والأشربة المذكورة من هذا الجنس في آخره\
    \ ويلعقون بزراً من هذا الجنس مع العسل، فإن استعصى الورم ونحا نحو الجمع دبر التدبير\
    \ الذي نذكره في باب ذلك خاصة {cite:canon-ibn-sina-print-v2 p.362}"
  "en": "What makes expectoration abound: sleeping on the ailing side; a slight shaking\
    \ may be needed, and giving him the water that tends to warmth in succession —\
    \ very beneficial for him. Poultices and liniments may be used: the first that\
    \ should be applied is a cerate of this kind, then the gradation goes to the fats,\
    \ the mucilages and mill-dust, then to the stronger poultices of this kind, and\
    \ if something stronger is needed the poultice made of the strongest of this kind\
    \ is used. Know that if the matter is abundant, poultices and ointments are harmful;\
    \ if scant, they do not harm — likewise when the tumour has dissolved and a residue\
    \ remains; and if a beneficial evacuation by venesection has occurred, anointing\
    \ is also permitted. A good poultice and a good liniment of this kind have been\
    \ described; and among the poultices that join maturing with quieting the pain\
    \ is a poultice of this kind. Moist and dry compresses may aid: the moist agree\
    \ better with what tends to the erysipelas kind, the dry with what tends to the\
    \ phlegmon kind — but the moist, if it does not benefit, does not harm, while\
    \ the dry, if it harms, harms greatly. First to be preferred is the sponge soaked\
    \ in hot water, stronger than that sea water and salt water, then beyond that,\
    \ if needed, fomenting with steam or with a hot matter of this kind; and stronger\
    \ still is what is made with vinegar and its like on wool steeped in oil; and\
    \ among the light dry things, bran, then jawars, then salt. Fomentation and venesection\
    \ resolve every high or low pain, unless the filling hinders by the fomentation's\
    \ drawing; and venesection resolves the high pains more. When you poultice or\
    \ foment, keep their vapour from the patient's face lest it stir in him distress\
    \ and shortness of breath. The disease may be very dry — then the vapour of the\
    \ poultice and the temperate moist compress benefits if it strikes the face and\
    \ enters the inhaling. The lohochs they use may aid: the most fitting for the\
    \ burned are of this kind. Once it is well cleansed, the cupping glasses, if set\
    \ on the painful spot, show great benefit — they may quiet the pain altogether\
    \ or draw it to the outer regions — and the mustard poultice, used on such a spot,\
    \ does the cupping glasses' work in drawing. When it passes the seventh: the ancients\
    \ used to order a lohoch of this kind and sometimes employed the great electuaries\
    \ — a good road, taken by those true in the craft who trust themselves to notice\
    \ and repair whatever this regimen may require and have the power over it, and\
    \ by it they reach a cleansing that heals; while the modern cowards, who do not\
    \ trust themselves in it, fear the honey and put sugar in its place. The ancients\
    \ also used to direct strongly cleansing drugs prepared with honey as pills held\
    \ under the tongue, and to direct at this time the poultices named 'the scented'\
    \ and the oils of this kind. In sum, whoever walks this path of the ancients must\
    \ walk it with care, caution and the fear of bursting a tumour or stirring much\
    \ heat — then he may afterward trust in a quick success. If the disease lasts\
    \ to the fourteenth, cupping on the nape is then indispensable. If sleeplessness\
    \ grows severe on them, a syrup of this kind is indispensable; if the breath runs\
    \ frequent on them, its harm is repaired only by moistening with a mucilage of\
    \ this kind, sipped little by little with a julep. Sprinkling the side with tepid\
    \ water may benefit in lightening the pain and lessening the frequency of breath\
    \ — though it is harmful, as you have learned. After the evident decline the bath\
    \ is used; strong cooling is shunned, except in what is of the erysipelas kind,\
    \ and likewise the thickening regimen is shunned and sufficiency made with thinning;\
    \ a thing of this kind is cooked in the waters and drinks mentioned, at their\
    \ end, and they lick a seed of this kind with honey. If the tumour resists and\
    \ turns toward gathering, the regimen we name in its own chapter is used {cite:canon-ibn-sina-print-v2\
    \ p.362}"
  "ur": "نفث بڑھانے والی چیزیں: بیمار پہلو پر سونا اور کبھی ہلکا ہلانا درکار ہو اور\
    \ گرمائی مائل پانی مسلسل پلانا جو اس کے لیے بہت مفید ہے اور ضماد اور مروخ سے مدد\
    \ لی جا سکتی ہے پہلے جو استعمال ہو اسی جنس کا قيروطي ہے پھر چربیوں لعابوں اور\
    \ چکی کی مٹی کی طرف پھر اسی جنس کے مضبوط ضمادوں کی طرف اور اگر مضبوط تر درکار\
    \ ہو تو اسی جنس کی مضبوط ترین چیز کا ضماد اور جان لو کہ اگر مادہ زیادہ ہو تو ضماد\
    \ اور طلاء نقصان دہ ہیں اور کم ہو تو ضرر نہیں اور ایسے ہی جب ورم تحلیل ہو کر بقیہ\
    \ رہ جائے اور اگر فصد سے مفید استفراغ ہو جائے تو طلاء بھی جائز ہے اور اچھا ضماد\
    \ اور اچھا مروخ اسی جنس کا بیان ہوا ہے اور ان ضمادوں میں جو درد بجھانے کے ساتھ\
    \ پکانا جمع کرتے ہیں اسی جنس کا ضماد ہے اور اس میں گیلے اور خشک کماد بھی مدد دیتے\
    \ ہیں گیلا حمرة مائل کے لیے اور خشک فلغمونیہ مائل کے لیے موافق تر ہے مگر گیلا\
    \ اگر نفع نہ دے تو ضرر نہیں دیتا اور خشک اگر ضرر دے تو بہت ضرر دیتا ہے اور سب\
    \ سے پہلے ترجیح گرم پانی میں بھیگا اسفنج ہے اس سے مضبوط سمندری اور نمکین پانی\
    \ پھر اگر ضرورت ہو تو بھاپ یا اسی جنس کی گرم مادہ سے کماد اور اس سے مضبوط سرکہ\
    \ اور اس کے ہم جنس کی تیل میں بھیگی اون پر بنا ہوا اور ہلکی خشک چیزوں میں چوسر\
    \ پھر جاورس پھر نمک۔ کماد اور فصد ہر اوپر یا نیچے کے درد کو حل کرتے ہیں اگر امتلاء\
    \ کماد کی کھینچ سے نہ روکے اور فصد اوپر کے درد زیادہ حل کرتا ہے اور جب ضماد یا\
    \ کماد کرو تو ان کی بھاپ مریض کے چہرے سے روکو کہ اس سے غم اور تنگی نفس نہ ابھرے\
    \ اور کبھی علت بہت خشک ہو تو ضماد اور معتدل گیلے کماد کی بھاپ فائدہ دیتی ہے اگر\
    \ چہرے پر پڑے اور سونگھنے میں جائے اور لعوقات سے بھی مدد لی جا سکتی ہے جو وہ استعمال\
    \ کرتے ہیں اور جلے ہوئے کے لیے موافق تر اسی جنس کا ہے اور جب اچھی طرح صاف ہو جائے\
    \ تو پچھنے اگر درد والے مقام پر لگائیں تو بڑا فائدہ دیتے ہیں اور کبھی درد کو بالکل\
    \ بجھا دیتے ہیں اور کبھی بیرونی طرفوں میں کھینچ لیتے ہیں اور رائی کا ضماد ایسے\
    \ مقام پر استعمال ہو تو کھینچنے میں پچھنوں جیسا کام کرتا ہے۔ جب ساتویں گزر جائے\
    \ تو قدیم لوگ اسی جنس کا لعوق تجویز کرتے تھے اور کبھی بڑے معاجين استعمال کرتے\
    \ تھے اور یہ اچھا راستہ ہے جس پر صنعت کے محقق جو اپنے ذہانت اور اقتدار پر بھروسا\
    \ رکھتے ہیں چڑھتے ہیں اور اس سے شفا بخش تنقیہ تک پہنچتے ہیں اور جدید بزدل جو اس\
    \ پر خود اعتماد نہیں وہ شہد سے ڈرتے اور اس کی جگہ شکر رکھتے ہیں اور قدیم لوگ قوی\
    \ صاف کرنے والی ادویہ بھی شہد میں تیار کر کے گولیاں بنا کر زبان تلے رکھواتے تھے\
    \ اور اس وقت خوشبو دار نام کے ضماد اور اسی جنس کی ادهان تجویز کرتے تھے۔ خلاصہ\
    \ جو قدیموں کے اس راستے پر چلے اسے احتیاط اور تنبیہ اور ورم پھٹنے یا زیادہ حرارت\
    \ ابھرنے کے خوف سے چلنا چاہیے پھر اس کے بعد جلد کامیابی کا بھروسا کر سکتا ہے اور\
    \ اگر علت چودہویں تک رہ جائے تو گردن پر پچھنا لگانا ناگزیر ہے اور اگر بے خوابی\
    \ بڑھ جائے تو اسی جنس کا شربت ناگزیر ہے اور اگر سانس مسلسل آئے تو اس کا ضرر صرف\
    \ اسی جنس کے لعاب سے تر کرنے میں ہے جسے جلاب کے ساتھ تھوڑا تھوڑا چوسیں اور پہلو\
    \ پر ولدا پانی چھڑکنا درد ہلکا کرنے اور سانس کے تواتر کم کرنے میں فائدہ دے سکتا\
    \ ہے مگر یہ نقصان دہ ہے جیسا تم جان چکے اور ظاہری زوال کے بعد حمام استعمال ہوتا\
    \ ہے اور شدید ٹھنڈک سے بچا جاتا ہے مگر حمرة کی جنس میں اور مغلظ تدبیر سے بھی بچا\
    \ جاتا ہے اور تلطيف پر اکتفا اور مذکورہ پانیوں اور جلائوں میں اسی جنس کی چیز آخر\
    \ میں پکائی جاتی ہے اور وہ اسی جنس کا بذر شہد کے ساتھ چاٹتے ہیں اور اگر ورم نہ\
    \ مانے اور جمع ہونے کی طرف جائے تو اس کے اپنے باب میں کہنے والا تدبیر کیا جاتا\
    \ ہے {cite:canon-ibn-sina-print-v2 p.362}"
