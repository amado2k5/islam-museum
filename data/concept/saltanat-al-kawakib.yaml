id: concept/saltanat-al-kawakib
class: concept
kind: doctrine
label: { ar: "سلطان الكواكب ودور العالم", en: "The planets' reign and the world's cycles", es: "El reinado de los planetas y los ciclos del mundo", fr: "Le règne des planètes et les cycles du monde" }
summary:
  ar: "لأهل الهيئة عند المسعودي كلام في فناء العالم ونقصه وعوده جديداً: ذكروا أن السلطان في هذا الوقت السنبلة وهو سبعة آلاف سنة وذلك عمر هذا العالم البشري وقد ساعدها المشتري في التدبير، ونهاية العالم في كثرة قطع الكوكب المدبر المسافة التامة بالقوى فإذا استكملها وقع النفاد والدثور بالعالم، والكواكب إذا كملت ما لها من كر ودور عاد التدبير إلى الأول منها وعادت أشخاص كل عالم وصوره مع اجتماع المواد وهكذا يجري شأن العالم سرمداً، وزعموا أن سلطان الحمل اثنا عشر ألف سنة وسلطان الثور إحدى عشرة ألف سنة {cite:muruj-al-dhahab p. 522}."
  en: "The astronomers' doctrine of world-cycles: Virgo now reigns 7,000 years — this world's age — Jupiter assisting; when the governing planet completes its full course the world ends, the cycle returns to the first, persons and forms recur with their matter, and so forever — Aries' reign 12,000 years, Taurus' 11,000 {cite:muruj-al-dhahab p. 522}."
  es: "La doctrina de los astrónomos sobre los ciclos mundiales: Virgo reina ahora 7.000 años —la edad de este mundo— con la ayuda de Júpiter; cuando el planeta regente completa su curso, el mundo termina, el ciclo vuelve al principio, las personas y las formas reaparecen con su materia, y así para siempre —el reinado de Aries dura 12.000 años, el de Tauro 11.000 {cite:muruj-al-dhahab p. 522}."
  fr: "La doctrine des astronomes sur les cycles du monde: la Vierge règne actuellement 7 000 ans — l'âge de ce monde — avec l'aide de Jupiter; lorsque la planète qui gouverne achève son cycle, le monde prend fin, le cycle revient au point de départ, les personnes et les formes réapparaissent avec leur matière, et ainsi de suite pour toujours — le règne du Bélier dure 12 000 ans, celui du Taureau 11 000 {cite: muruj-al-dhahab p. 522}."
