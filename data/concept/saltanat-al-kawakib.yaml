id: concept/saltanat-al-kawakib
class: concept
kind: doctrine
label: { ar: "سلطان الكواكب ودور العالم", en: "The planets' reign and the world's cycles" }
summary:
  ar: "لأهل الهيئة عند المسعودي كلام في فناء العالم ونقصه وعوده جديداً: ذكروا أن السلطان في هذا الوقت السنبلة وهو سبعة آلاف سنة وذلك عمر هذا العالم البشري وقد ساعدها المشتري في التدبير، ونهاية العالم في كثرة قطع الكوكب المدبر المسافة التامة بالقوى فإذا استكملها وقع النفاد والدثور بالعالم، والكواكب إذا كملت ما لها من كر ودور عاد التدبير إلى الأول منها وعادت أشخاص كل عالم وصوره مع اجتماع المواد وهكذا يجري شأن العالم سرمداً، وزعموا أن سلطان الحمل اثنا عشر ألف سنة وسلطان الثور إحدى عشرة ألف سنة {cite:muruj-al-dhahab p. 522}."
  en: "The astronomers' doctrine of world-cycles: Virgo now reigns 7,000 years — this world's age — Jupiter assisting; when the governing planet completes its full course the world ends, the cycle returns to the first, persons and forms recur with their matter, and so forever — Aries' reign 12,000 years, Taurus' 11,000 {cite:muruj-al-dhahab p. 522}."
