id: concept/saltanat-al-kawakib
class: concept
kind: doctrine
label: { ar: "سلطان الكواكب ودور العالم", en: "The planets' reign and the world's cycles", es: "El reinado de los planetas y los ciclos del mundo", fr: "Le règne des planètes et les cycles du monde", ur: "سیاروں کا راج اور دنیا کے چکر", tr: "Gezegenlerin Sultanı ve Dünyanın Rolü", id: "Sultan Planet dan Peran Dunia" }
summary:
  ar: "لأهل الهيئة عند المسعودي كلام في فناء العالم ونقصه وعوده جديداً: ذكروا أن السلطان في هذا الوقت السنبلة وهو سبعة آلاف سنة وذلك عمر هذا العالم البشري وقد ساعدها المشتري في التدبير، ونهاية العالم في كثرة قطع الكوكب المدبر المسافة التامة بالقوى فإذا استكملها وقع النفاد والدثور بالعالم، والكواكب إذا كملت ما لها من كر ودور عاد التدبير إلى الأول منها وعادت أشخاص كل عالم وصوره مع اجتماع المواد وهكذا يجري شأن العالم سرمداً، وزعموا أن سلطان الحمل اثنا عشر ألف سنة وسلطان الثور إحدى عشرة ألف سنة {cite:muruj-al-dhahab p. 522}."
  en: "The astronomers' doctrine of world-cycles: Virgo now reigns 7,000 years — this world's age — Jupiter assisting; when the governing planet completes its full course the world ends, the cycle returns to the first, persons and forms recur with their matter, and so forever — Aries' reign 12,000 years, Taurus' 11,000 {cite:muruj-al-dhahab p. 522}."
  es: "La doctrina de los astrónomos sobre los ciclos mundiales: Virgo reina ahora 7.000 años —la edad de este mundo— con la ayuda de Júpiter; cuando el planeta regente completa su curso, el mundo termina, el ciclo vuelve al principio, las personas y las formas reaparecen con su materia, y así para siempre —el reinado de Aries dura 12.000 años, el de Tauro 11.000 {cite:muruj-al-dhahab p. 522}."
  fr: "La doctrine des astronomes sur les cycles du monde: la Vierge règne actuellement 7 000 ans — l'âge de ce monde — avec l'aide de Jupiter; lorsque la planète qui gouverne achève son cycle, le monde prend fin, le cycle revient au point de départ, les personnes et les formes réapparaissent avec leur matière, et ainsi de suite pour toujours — le règne du Bélier dure 12 000 ans, celui du Taureau 11 000 {cite: muruj-al-dhahab p. 522}."
  ur: "ماہرین فلکیات کا نظریہ عالمی چکر: کنیا اب 7,000 سال راج کر رہی ہے — اس دنیا کی عمر — مشتری مدد کر رہا ہے۔ جب حکومت کرنے والا سیارہ اپنا مکمل راستہ مکمل کر لیتا ہے تو دنیا ختم ہو جاتی ہے، سائیکل پہلے کی طرف لوٹتا ہے، افراد اور شکلیں اپنے مادے کے ساتھ دوبارہ آتی ہیں، اور اسی طرح ہمیشہ کے لیے — میش کا دور حکومت 12,000 سال، ثور کا 11,000 {حوالہ: مروج الذہب صفحہ 522}۔"
  tr: "El-Mes'udi'ye göre, sistem halkı dünyanın yok oluşundan ve yeni eksikliklerinden bahsetti: O dönemde Sultan'ın kulak kulağı olduğunu, yani yedi bin yıl olduğunu ve bu insan dünyasının ömrü olduğunu, Jüpiter'in ise yönetiminde ona yardım ettiğini söylediler. Dünyanın sonu, tüm mesafeyi kuvvetlerle kat eden birçok gezegen yüzündendi, bu yüzden tamamlanırsa dünya tükenip parçalanacaktı. Ve gezegenler rollerini ve evrelerini tamamladığında, yönetim ilkine dönecek, her dünyanın insanları madde birikimiyle geri dönüp onu oluşturacaktı. Böylece dünyanın işleri sonsuza dek devam edecekti. Koç Sultanı'nın on iki bin yıl, Boğa Sultanı'nın ise on bir bin yıl sürdüğünü iddia ettiler {atıf:Muruj-al-Dhahab, s. 522}."
  id: "Menurut Al-Mas'udi, masyarakat sistem berbicara tentang kehancuran dunia dan kekurangan barunya: Mereka menyebutkan bahwa Sultan pada waktu ini adalah telinga telinga, yang berlangsung tujuh ribu tahun, dan itulah umur dunia manusia ini, dan Jupiter membantunya dalam pengelolaan. Akhir dunia disebabkan oleh banyaknya planet yang telah menempuh jarak penuh dengan kekuatan, jadi jika selesai, dunia akan habis dan runtuh. Dan ketika planet-planet menyelesaikan peran dan fase mereka, pengelolaan akan kembali ke yang pertama, dan orang-orang dari setiap dunia akan kembali dan membentuknya dengan akumulasi materi. Dengan demikian, urusan dunia akan terus berlanjut selamanya. Mereka mengklaim bahwa Sultan Aries bertahan dua belas ribu tahun dan Sultan Taurus sebelas ribu tahun {cite:Muruj-al-Dhahab, hlm. 522}."
