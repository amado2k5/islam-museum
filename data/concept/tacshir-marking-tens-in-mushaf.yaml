id: concept/tacshir-marking-tens-in-mushaf
class: concept
kind: legal
label:
  ar: "التعشير في المصحف"
  en: "Ta'shir (marking the tens in a copy of the Qur'an)"
  ur: "تعشیر (مصحف میں دس آیات کی نشانی)"
summary:
  ar: "التعشير لغة أخذ العشر من الأموال، وفي الاصطلاح جعل علامات العشر في المصحف، وهي الحلقة عند منتهى كل عشر آيات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5454} ونقل عن بعض التواريخ أن المأمون أو الحجاج أمر بذلك، وعن قتادة أن النقط والتخميس والتعشير جاءت بالتدريج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5454} وكره ابن مسعود التعشير وأمر بحكه، وكرهه مجاهد مع الطيب، وأجازه الحنفية لما فيه من الرفق بالقراء ولا سيما العجم، وعدّوه بدعة حسنة، وعند المالكية يكره بالحمرة وغيرها من الألوان ويجوز بالحبر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5455}"
  en: "Ta'shir means, in language, taking a tenth of property; in the technical sense it means marking the tens in a copy of the Qur'an, a ring placed at the end of every ten verses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5454} One report attributes the practice to al-Ma'mun, another to al-Hajjaj, and Qatada describes dotting, then fifths and then tens as successive stages. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5454} Ibn Mas'ud disliked it and ordered such marks removed, and Mujahid disliked it together with perfume; the Hanafis allowed it as an aid to readers, especially non-Arabs, and called it a good innovation; the Malikis disliked marking in red or other colours but allowed ink. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5455}"
  ur: "تعشیر لغت میں مال کا دسواں حصہ لینے کو کہتے ہیں، اور اصطلاح میں مصحف میں دس آیات کے اختتام پر دائرہ یا نشان لگانے کو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5454} بعض تواریخ کے مطابق یہ کام مامون یا حجاج نے کرایا، اور قتادہ کے بیان کے مطابق پہلے نقطے لگائے گئے پھر پانچ کی علامت اور پھر دس کی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5454} ابن مسعود نے اسے ناپسند کیا اور مٹانے کا حکم دیا، جبکہ حنفیہ نے قاریوں بالخصوص غیر عرب کی سہولت کی بنا پر اسے جائز اور اچھی بدعت کہا، اور مالکیہ کے نزدیک سرخ یا دوسرے رنگ سے نشان مکروہ ہے اور سیاہی سے جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5455}"
