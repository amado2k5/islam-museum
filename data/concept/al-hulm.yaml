summary:
  ar: "الرؤيا ثلاث: بشرى من الله وتحزين من الشيطان وحديث نفس — فمن رأى ما يكره فليتفل عن يساره ثلاثًا ولا يحدث بها أحدًا فإنها لا تضره."
  en: "Dreams are three: glad tidings from God, sorrowing from Satan, and the soul's own chatter — who sees what he dislikes spits to his left thrice, tells no one, and it cannot harm him."
  ur: "خواب تین ہیں: اللہ کی بشارت، شیطان کی رنجش اور نفس کی باتیں — جو بری خواب دیکھے بائیں طرف تین بار تھوکے اور کسی کو نہ سنائے تو وہ نقصان نہیں دے گی۔"
