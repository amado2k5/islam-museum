id: concept/malaikat-al-imdad
class: concept
kind: doctrine
label:
  ar: ملائكة الإمداد
  en: The Angels of Aid
  ur: مدد کے فرشتے
summary:
  ar: ملائكة ينزلون لتثبيت المؤمنين ونصرهم في الملاحم، يذكرهم القرآن في قصة بدر [[passage/quran-8-12|الأنفال 12]] وفي قصة حنين [[passage/quran-9-26|التوبة 26]] وفي وعده الثلاثة آلاف من الملائكة المنزلين [[passage/quran-3-124|آل عمران 124]]؛ وينفصل عنهم تسجيل أنjouirات الموصوفة في كتب السنة بالقتال والمرافعة.
  en: Angels who descend to steady and aid the believers in battles, mentioned by the Qur'an at Badr [[passage/quran-8-12|al-Anfal 12]], at Hunayn [[passage/quran-9-26|al-Tawbah 26]] and in the promise of three thousand angels sent down [[passage/quran-3-124|Al 'Imran 124]]; reports in the Sunan describe them fighting and debating.
  ur: فرشتے جو جنگوں میں مومنوں کی مدد اور ثبات کے لیے نازل ہوتے ہیں، جن کا ذکر قرآن نے بدر [[passage/quran-8-12|الانفال 12]] اور حنین [[passage/quran-9-26|التوبہ 26]] اور تین ہزار نازل فرشتوں کے وعدے [[passage/quran-3-124|آل عمران 124]] میں کیا؛ سنن کی روایات انہیں لڑتے اور مباحثہ کرتے ہوئے بیان کرتی ہیں۔
