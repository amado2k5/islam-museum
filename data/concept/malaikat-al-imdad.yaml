id: concept/malaikat-al-imdad
class: concept
kind: doctrine
label:
  ar: ملائكة الإمداد
  en: The Angels of Aid
  ur: مدد کے فرشتے
  es: "Los Ángeles de la Ayuda"
  fr: "Les Anges du Secours"
  tr: "Tedarik Melekleri"
  id: "Malaikat Pasokan"
summary:
  ar: ملائكة ينزلون لتثبيت المؤمنين ونصرهم في الملاحم، يذكرهم القرآن في قصة بدر [[passage/quran-8-12|الأنفال 12]] وفي قصة حنين [[passage/quran-9-26|التوبة 26]] وفي وعده الثلاثة آلاف من الملائكة المنزلين [[passage/quran-3-124|آل عمران 124]]؛ وينفصل عنهم تسجيل أنjouirات الموصوفة في كتب السنة بالقتال والمرافعة.
  en: Angels who descend to steady and aid the believers in battles, mentioned by the Qur'an at Badr [[passage/quran-8-12|al-Anfal 12]], at Hunayn [[passage/quran-9-26|al-Tawbah 26]] and in the promise of three thousand angels sent down [[passage/quran-3-124|Al 'Imran 124]]; reports in the Sunan describe them fighting and debating.
  ur: فرشتے جو جنگوں میں مومنوں کی مدد اور ثبات کے لیے نازل ہوتے ہیں، جن کا ذکر قرآن نے بدر [[passage/quran-8-12|الانفال 12]] اور حنین [[passage/quran-9-26|التوبہ 26]] اور تین ہزار نازل فرشتوں کے وعدے [[passage/quran-3-124|آل عمران 124]] میں کیا؛ سنن کی روایات انہیں لڑتے اور مباحثہ کرتے ہوئے بیان کرتی ہیں۔
  es: "Ángeles que descienden para fortalecer y ayudar a los creyentes en las batallas, mencionados por el Corán en Badr [[passage/quran-8-12|al-Anfal 12]], en Hunayn [[passage/quran-9-26|al-Tawbah 26]] y en la promesa de tres mil ángeles enviados [[passage/quran-3-124|Al 'Imran 124]]; los relatos en el Sunan los describen luchando y debatiendo."
  fr: "Les anges qui descendent pour soutenir et aider les croyants dans les batailles, mentionnés par le Coran à Badr [[passage/quran-8-12|al-Anfal 12]], à Hunayn [[passage/quran-9-26|al-Tawbah 26]] et dans la promesse des trois mille anges envoyés [[passage/quran-3-124|Al 'Imran 124]]; les récits du Sunan les décrivent en train de combattre et de débattre."
  tr: "Melekler, destanlarda inananları güçlendirmek ve desteklemek için iner. Kur'an, Bedr hikayesinde [[pasaj/kuran-8-12|El-Enfal 12], Hunayn hikayesinde [[pasaj/kuran-9-26|Et-Tevbe 26]] ve indirilen üç bin meleğin sayısında [[pasaj/kuran-3-124|İmran 124]]]; ayrıca bunlar Sünnet kitaplarında savaş ve yalvarış olarak tanımlanan ayetlerin kaydından ayrılır."
  id: "Malaikat turun untuk menguatkan dan mendukung para mukmin dalam epik tersebut. Al-Qur'an menyebutkan mereka dalam kisah Badr [[ayat/al-quran-8-12|Al-Anfal 12], dalam kisah Hunayn [[ayat/al-quran-9-26|At-Tawbah 26]], dan dalam hitungan tiga ribu malaikat yang diturunkan [[ayat/al-quran-3-124|Al Imran 124]]; dan mereka dipisahkan dari pencatatan ayat-ayat yang digambarkan dalam kitab-kitab Sunnah sebagai perjuangan dan permohonan."
