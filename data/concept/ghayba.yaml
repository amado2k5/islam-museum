label: { ar: "الغيبة" }
summary:
  ar: "الغيبة عند الإمامية اعتقاد أن الإمام قد يخفى عن الأنظار دون أن ينقطع وجوده: «وللإمام غيبة — وإذا بلغكم عن صاحب هذا الأمر غيبة فلا تنكروها — وللإمام الثاني عشر غيبة، وهو المهدي الذي يملأ الأرض عدلاً وقسطاً»؛ وفسّر أبو جعفر قوله تعالى ﴿فَلَا أُقْسِمُ بِالْخُنَّسِ الْجَوَارِ الْكُنَّسِ﴾ بأن الخُنَّس «إمام يخنس في زمانه... ثم يبدو كالشهاب الواقد في ظلمة الليل» {cite:duha-islam p. 857}. وعلى هذا الاعتقاد بُنيت دعوات الأئمة المستترين الذين يبثون الدعاة في الأمصار {cite:duha-islam p. 877}."
  en: "Ghayba — the Twelver belief that the imam may withdraw from sight without ceasing to exist; for the twelfth imam this is the occultation of the Mahdi, who 'conceals himself in his time... then appears like a meteor in the darkness of night' {cite:duha-islam p. 857}."
