label: { ar: "الغيبة", en: "Ghayba (occultation)", es: "Ghayba (ocultación)", fr: "Ghayba (occultation)", ur: "غیبہ ⁦(غیبت)⁩", tr: "Yokluk", id: "Ketidakhadiran" }
summary:
  ar: "الغيبة عند الإمامية اعتقاد أن الإمام قد يخفى عن الأنظار دون أن ينقطع وجوده: «وللإمام غيبة — وإذا بلغكم عن صاحب هذا الأمر غيبة فلا تنكروها — وللإمام الثاني عشر غيبة، وهو المهدي الذي يملأ الأرض عدلاً وقسطاً»؛ وفسّر أبو جعفر قوله تعالى ﴿فَلَا أُقْسِمُ بِالْخُنَّسِ الْجَوَارِ الْكُنَّسِ﴾ بأن الخُنَّس «إمام يخنس في زمانه... ثم يبدو كالشهاب الواقد في ظلمة الليل» {cite:duha-islam p. 857}. وعلى هذا الاعتقاد بُنيت دعوات الأئمة المستترين الذين يبثون الدعاة في الأمصار {cite:duha-islam p. 877}."
  en: "Ghayba — the Twelver belief that the imam may withdraw from sight without ceasing to exist; for the twelfth imam this is the occultation of the Mahdi, who 'conceals himself in his time... then appears like a meteor in the darkness of night' {cite:duha-islam p. 857}."
  es: "Ghayba: la creencia duodecimana de que el imán puede desaparecer de la vista sin dejar de existir; para el duodécimo imán, esta es la ocultación del Mahdi, quien \"se oculta en su tiempo... luego aparece como un meteoro en la oscuridad de la noche\" {cite:duha-islam p. 857}."
  fr: "Ghayba — la croyance des Douzains selon laquelle l'imam peut se retirer de la vue sans cesser d'exister; pour le douzième imam, il s'agit de l'occultation du Mahdi, qui « se cache en son temps... puis apparaît comme un météore dans l'obscurité de la nuit » {cite: duha-islam p. 857}."
  ur: "غیبہ - بارہ کا عقیدہ کہ امام بغیر وجود کے ختم ہو کر نظروں سے ہٹ سکتا ہے۔ بارہویں امام کے لیے یہ مہدی کی غیبت ہے، جو 'اپنے وقت میں چھپا لیتا ہے... پھر رات کی تاریکی میں الکا کی طرح ظاہر ہوتا ہے'۔ 857}۔"
