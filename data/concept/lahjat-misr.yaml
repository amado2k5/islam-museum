id: concept/lahjat-misr
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-dialects]
label:
  ar: "اللهجة المصرية"
  en: "The dialect of Egypt"
  ur: "مصر کی بولی"
  fr: "Le dialecte d'Égypte"
  es: "El dialecto de Egipto"
summary:
  ar: "ما تقوله دائرة المعارف البريطانية في قسم اللغات من مقال مصر: الفصحى والعامية، ومجموعات العامية المصرية من بدو الصحراء الشرقية والغربية والصعيد والقاهرة والدلتا والريف، وفهم لهجة القاهرة في العالم العربي، والأقليات اللغوية، والقبطية وانتشار العربية، مع إشارتين قديمتين عند السيوطي وابن خلدون. ولم تُذكر أعداد المتكلمين ولا الخصائص الصوتية والنحوية."
  en: "What the Encyclopaedia Britannica says in the languages section of its article on Egypt: standard Arabic and the vernacular, the groups of Egyptian colloquial among the Bedouin of the Eastern and Western Deserts, Upper Egypt, Cairo, the Delta and the countryside, the wide understanding of Cairo's dialect in the Arab world, the minority languages, and Coptic and the spread of Arabic, with two old pointers in al-Suyuti and Ibn Khaldun. No speaker counts or phonetic and grammatical features are stated."
  ur: "جو انسائیکلوپیڈیا برٹانیکا مصر کے مقالے کے زبانوں کے حصے میں کہتا ہے: فصحیٰ اور عامی، مشرقی اور مغربی صحرا کے بدوؤں، صعید، قاہرہ، ڈیلٹا اور دیہات کے مصری عامی کے گروہ، عرب دنیا میں قاہرہ کی بولی کا وسیع فہم، لسانی اقلیتیں، اور قبطی اور عربی کا پھیلاؤ، ساتھ ہی سیوطی اور ابن خلدون کے ہاں دو قدیم اشارے۔ بولنے والوں کی تعداد اور صوتی و نحوی خصوصیات بیان نہیں ہوئیں۔"
  fr: "Ce que dit l'Encyclopaedia Britannica dans la section sur les langues de son article sur l'Égypte : l'arabe standard et le vernaculaire, les groupes du parler égyptien chez les Bédouins du désert oriental et occidental, en Haute-Égypte, au Caire, dans le Delta et à la campagne, la large compréhension du dialecte du Caire dans le monde arabe, les langues minoritaires, et le copte et la diffusion de l'arabe, avec deux anciens renvois chez al-Suyuti et Ibn Khaldun. Aucun décompte de locuteurs ni aucun trait phonétique ou grammatical n'est énoncé."
  es: "Lo que dice la Encyclopaedia Britannica en la sección sobre lenguas de su artículo sobre Egipto: el árabe estándar y el vernáculo, los grupos del coloquial egipcio entre los beduinos del desierto oriental y occidental, el Alto Egipto, El Cairo, el Delta y el campo, la amplia comprensión del dialecto de El Cairo en el mundo árabe, las lenguas minoritarias, y el copto y la difusión del árabe, con dos antiguas referencias en al-Suyuti e Ibn Jaldún. No se enuncian recuentos de hablantes ni rasgos fonéticos y gramaticales."
