id: concept/lahjat-misr
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-dialects]
label:
  ar: "اللهجة المصرية"
  en: "The dialect of Egypt"
  ur: "مصر کی بولی"
  fr: "Le dialecte d'Égypte"
  es: "El dialecto de Egipto"
  tr: "Mısır lehçesi"
  id: "Dialek Mesir"
summary:
  ar: "ما تقوله دائرة المعارف البريطانية في قسم اللغات من مقال مصر: الفصحى والعامية، ومجموعات العامية المصرية من بدو الصحراء الشرقية والغربية والصعيد والقاهرة والدلتا والريف، وفهم لهجة القاهرة في العالم العربي، والأقليات اللغوية، والقبطية وانتشار العربية، مع إشارتين قديمتين عند السيوطي وابن خلدون. ولم تُذكر أعداد المتكلمين ولا الخصائص الصوتية والنحوية. وأضاف لاحقاً ملخص بحثي قُدّم إلى المتحف أقساماً عن التصنيف وأبرز الخصائص وأعداد المتكلمين؛ ولم يفتح المتحف الصفحات التي يستشهد بها."
  en: "What the Encyclopaedia Britannica says in the languages section of its article on Egypt: standard Arabic and the vernacular, the groups of Egyptian colloquial among the Bedouin of the Eastern and Western Deserts, Upper Egypt, Cairo, the Delta and the countryside, the wide understanding of Cairo's dialect in the Arab world, the minority languages, and Coptic and the spread of Arabic, with two old pointers in al-Suyuti and Ibn Khaldun. No speaker counts or phonetic and grammatical features are stated. A research summary supplied to the museum later added sections on classification, main features and speaker numbers; the museum did not open the pages it cites."
  ur: "جو انسائیکلوپیڈیا برٹانیکا مصر کے مقالے کے زبانوں کے حصے میں کہتا ہے: فصحیٰ اور عامی، مشرقی اور مغربی صحرا کے بدوؤں، صعید، قاہرہ، ڈیلٹا اور دیہات کے مصری عامی کے گروہ، عرب دنیا میں قاہرہ کی بولی کا وسیع فہم، لسانی اقلیتیں، اور قبطی اور عربی کا پھیلاؤ، ساتھ ہی سیوطی اور ابن خلدون کے ہاں دو قدیم اشارے۔ بولنے والوں کی تعداد اور صوتی و نحوی خصوصیات بیان نہیں ہوئیں۔ بعد میں عجائب گھر کو فراہم کردہ ایک تحقیقی خلاصے نے درجہ بندی، نمایاں خصوصیات اور بولنے والوں کی تعداد کے حصے شامل کیے؛ عجائب گھر نے اس کے حوالہ کردہ صفحات نہیں کھولے۔"
  fr: "Ce que dit l'Encyclopaedia Britannica dans la section sur les langues de son article sur l'Égypte : l'arabe standard et le vernaculaire, les groupes du parler égyptien chez les Bédouins du désert oriental et occidental, en Haute-Égypte, au Caire, dans le Delta et à la campagne, la large compréhension du dialecte du Caire dans le monde arabe, les langues minoritaires, et le copte et la diffusion de l'arabe, avec deux anciens renvois chez al-Suyuti et Ibn Khaldun. Aucun décompte de locuteurs ni aucun trait phonétique ou grammatical n'est énoncé. Un dossier de recherche fourni au musée a ajouté ensuite des sections sur la classification, les principaux traits et le nombre de locuteurs ; le musée n'a pas ouvert les pages qu'il cite."
  es: "Lo que dice la Encyclopaedia Britannica en la sección sobre lenguas de su artículo sobre Egipto: el árabe estándar y el vernáculo, los grupos del coloquial egipcio entre los beduinos del desierto oriental y occidental, el Alto Egipto, El Cairo, el Delta y el campo, la amplia comprensión del dialecto de El Cairo en el mundo árabe, las lenguas minoritarias, y el copto y la difusión del árabe, con dos antiguas referencias en al-Suyuti e Ibn Jaldún. No se enuncian recuentos de hablantes ni rasgos fonéticos y gramaticales. Un archivo de investigación entregado al museo añadió después secciones sobre la clasificación, los rasgos principales y el número de hablantes; el museo no abrió las páginas que cita."
  tr: "Britanya Ansiklopedisi'nin diller bölümünde Mısır hakkında söyledikleri: Standart Arapça ve Günlük Dil, Mısır Günlük Grupları, Doğu ve Batı Çölleri, Yukarı Mısır, Kahire, Delta ve Rif Bedevilerinden, Arap dünyasında Kahire lehçesinin anlaşılması, dil azınlıkları, Kıpti ve Arapçanın yayılması; Al-Suyuti ve İbn Haldun'dan iki eski referans yer almaktadır. Konuşanların sayısı veya fonetik ve dilbilgisel özellikler belirtilmemiştir. Daha sonra sınıflandırma, temel özellikler ve konuşan sayısı hakkında bölümler içeren bir araştırma özeti eklemiştir; müze alıntılanan sayfaları açmamıştır."
  id: "Apa yang dikatakan Ensiklopedia Inggris di bagian bahasa tentang Mesir: Arab Standar dan Bahasa Sehari-hari, kelompok sehari-hari Mesir dari suku Badui di Gurun Timur dan Barat, Mesir Atas, Kairo, Delta, dan Rif, pemahaman dialek Kairo di dunia Arab, minoritas linguistik, Koptik, dan penyebaran bahasa Arab, dengan dua referensi lama oleh Al-Suyuti dan Ibn Khaldun. Jumlah penutur atau fitur fonetik dan gramatikal tidak disebutkan. Ia kemudian menambahkan ringkasan penelitian yang menyediakan bagian tentang klasifikasi, karakteristik utama, dan jumlah penutur; museum tidak membuka halaman-halaman yang dikutip."
