label:
  ar: "التشنج"
  en: "Convulsion"
  ur: "تشنج"
summary:
  ar: "التشنج علة عصبية تتحرك لها العضل إلى مباديها فتعصى في الانبساط، فمنها ما تبقى على حالها فلا تنبسط، ومنها ما يسهل عوده إلى البساط كالتثاؤب والفواق؛ والسبب فيه إما مادة وإما سبب غير المادة مثل حر أو يبس {cite:canon-ibn-sina-print-v2 p.142}"
  en: "Convulsion is a nervous disorder by which the muscles move toward their origins and refuse extension; of them is what stays in its state and does not extend, and what easily returns to extension like yawning and hiccup; its cause is either a matter or a cause other than matter, such as heat or dryness {cite:canon-ibn-sina-print-v2 p.142}"
  ur: "تشنج ایک عصبی علت ہے جس سے عضل اپنے مبادی کی طرف حرکت کرتی ہیں تو انبساط میں نافرمان ہو جاتی ہیں؛ ان میں سے ایک وہ ہے جو اپنی حال پر رہے تو نہ بسطے، اور ایک وہ ہے جو آسانی سے بساط کی طرف لوٹ آئے جیسے جمائی اور ہچکی؛ اور اس کا سبب یا تو مادہ ہے یا مادہ کے سوا سبب جیسے حر یا یبس {cite:canon-ibn-sina-print-v2 p.142}۔"
