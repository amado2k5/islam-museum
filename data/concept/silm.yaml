summary:
  ar: "السَّلم في اللغة الصلح، ويأتي بمعنى الإسلام، والمعنى الشرعي قريب من اللغوي: هو الصلح خلاف الحرب، أو ترك الجهاد مع الكفار بشروطه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9803} ينقسم السلم عند الفقهاء إلى ثلاثة معان: سلم مطلق بأصل الملة لا ينشأ عن عقد، وسلم بمعنى المصالحة وهو عقد مؤبد هو عقد الذمة، وعقد مؤقت يأتي في صورتين هما الهدنة والأمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9804}"
  en: "Silm in the lexicon means reconciliation, and it can also mean Islam; in the technical sense it stays close to the lexical one: reconciliation as the opposite of war, or the giving up of holy war against unbelievers on conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9803} The jurists divide it into three senses: an absolute silm that belongs to the community by origin and does not arise from a contract; a silm of reconciliation, which is a lasting contract (the dhimma) or a time-limited one, in two forms, the truce (hudna) and safe-conduct (aman). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9804}"
  es: "Silm en el léxico significa reconciliación, y también puede referirse al Islam; en el sentido técnico se mantiene cercano al léxico: la reconciliación como lo opuesto a la guerra, o la renuncia a la guerra santa contra los infieles bajo ciertas condiciones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9803} Los juristas lo dividen en tres sentidos: un silm absoluto que pertenece a la comunidad por origen y no surge de un contrato; un silm de reconciliación, que es un contrato duradero (el dhimma) o uno limitado en el tiempo, en dos formas: la tregua (hudna) y el salvoconducto (aman). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9804}"
  fr: "Le terme « silm » signifie réconciliation dans le lexique et peut également désigner l'islam. Au sens technique, il reste proche du sens lexical: la réconciliation est l'opposé de la guerre, ou l'abandon du combat contre les non-croyants sous certaines conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9803} Les juristes le distinguent en trois sens: un silm absolu, propre à la communauté par son origine et ne résultant pas d'un contrat; un silm de réconciliation, qui est un contrat durable (la dhimma) ou un contrat temporaire, sous deux formes: la trêve (hudna) et le sauf-conduit (aman). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9804}"
