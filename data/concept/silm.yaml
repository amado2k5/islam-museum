label: { ar: "السَّلم (الصلح مع أهل الحرب)", en: "Silm: peace and treaty with the enemy" }
summary:
  ar: "السَّلم في اللغة الصلح، ويأتي بمعنى الإسلام، والمعنى الشرعي قريب من اللغوي: هو الصلح خلاف الحرب، أو ترك الجهاد مع الكفار بشروطه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9803} ينقسم السلم عند الفقهاء إلى ثلاثة معان: سلم مطلق بأصل الملة لا ينشأ عن عقد، وسلم بمعنى المصالحة وهو عقد مؤبد هو عقد الذمة، وعقد مؤقت يأتي في صورتين هما الهدنة والأمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9804}"
  en: "Silm in the lexicon means reconciliation, and it can also mean Islam; in the technical sense it stays close to the lexical one: reconciliation as the opposite of war, or the giving up of holy war against unbelievers on conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9803} The jurists divide it into three senses: an absolute silm that belongs to the community by origin and does not arise from a contract; a silm of reconciliation, which is a lasting contract (the dhimma) or a time-limited one, in two forms, the truce (hudna) and safe-conduct (aman). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9804}"
