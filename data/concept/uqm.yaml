id: concept/uqm
class: concept
kind: legal
label:
  ar: "العُقْم"
  en: "Sterility (uqm) and its effect on marriage"
  ur: "عقم ⁦(بانجھ پن)⁩"
  es: "La esterilidad (uqm) y su efecto en el matrimonio."
  fr: "La stérilité (uqm) et son effet sur le mariage"
summary:
  ar: "العُقْم في اللغة اليبس الذي يمنع من قبول الأثر، والعقيم الذي لا يولد له، والعقم في المرأة أن لا تحمل {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11773} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11774}. ويستحب لمن يريد النكاح أن ينكح ولوداً بكراً، وحث الشرع على النسل ونهى عن تعطيله، ونهى عن نكاح العقيم في الأثر المروي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11774} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11775}. واتفق جمهور الفقهاء على أن العقم لا يثبت به فسخ عقد النكاح، وخالف الحسن فجعله خياراً في ابتداء النكاح، ولا يجب على من يعلم عقمه إخبار الآخر قبل العقد عند الجمهور {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11775}. وتجب الدية الكاملة في إبطال قوة الحبل والإحبال بالجناية، ويحرم قطع النسل بالدواء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11775}."
  en: "In the lexicon, uqm is a dryness that prevents conception; a woman who cannot conceive is barren, and the word is used of a man who cannot father children {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11773} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11774}. The jurists recommend that a man marrying choose a fertile virgin, since the law encourages offspring and forbids what blocks them; a report discourages marrying a barren woman {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11774} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11775}. The majority hold that sterility is not a defect that dissolves a marriage; al-Hasan alone gives the option of withdrawal at the start of the marriage, and the majority do not require a spouse who knows of his or her sterility to disclose it before the contract {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11775}. Full blood-money is due for injuring the power to conceive or to impregnate, and cutting off offspring by medicine is forbidden {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11775}."
  es: "En el léxico, uqm es una sequedad que impide la concepción; una mujer que no puede concebir es estéril, y la palabra se usa para un hombre que no puede engendrar hijos {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11773} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11774}. Los juristas recomiendan que un hombre que se casa elija a una virgen fértil, ya que la ley fomenta la descendencia y prohíbe lo que la impide; un informe desaconseja casarse con una mujer estéril {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11774} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11775}. La mayoría sostiene que la esterilidad no es un defecto que disuelva un matrimonio; Solo Al-Hasan ofrece la opción de retirarse al inicio del matrimonio, y la mayoría no exige que el cónyuge que conoce su esterilidad lo revele antes del contrato {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11775}. Se debe pagar una indemnización completa por la pérdida de la capacidad de concebir o embarazar, y está prohibido interrumpir la descendencia mediante medicamentos {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11775}."
  fr: "Dans le lexique, « uqm » désigne une sécheresse empêchant la conception; une femme qui ne peut concevoir est dite stérile, et le terme est employé pour désigner un homme incapable d’engendrer des enfants {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11773} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11774}. Les juristes recommandent à l’homme qui se marie de choisir une vierge fertile, car la loi encourage la descendance et interdit ce qui l’entrave; un rapport déconseille d’épouser une femme stérile {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11774} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11775}. La majorité considère que la stérilité n’est pas un défaut qui dissout le mariage. Seul al-Hasan prévoit la possibilité de se rétracter dès le début du mariage, et la majorité des savants n'exigent pas qu'un conjoint connaissant sa stérilité la divulgue avant le contrat {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11775}. Le prix du sang est intégralement dû en cas d'atteinte à la fertilité, et l'interruption de grossesse par voie médicamenteuse est interdite {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11775}."
