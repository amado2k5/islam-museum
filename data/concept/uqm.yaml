id: concept/uqm
class: concept
kind: legal
label:
  ar: "العُقْم"
  en: "Sterility (uqm) and its effect on marriage"
  ur: "عقم (بانجھ پن)"
summary:
  ar: "العُقْم في اللغة اليبس الذي يمنع من قبول الأثر، والعقيم الذي لا يولد له، والعقم في المرأة أن لا تحمل {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11773} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11774}. ويستحب لمن يريد النكاح أن ينكح ولوداً بكراً، وحث الشرع على النسل ونهى عن تعطيله، ونهى عن نكاح العقيم في الأثر المروي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11774} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11775}. واتفق جمهور الفقهاء على أن العقم لا يثبت به فسخ عقد النكاح، وخالف الحسن فجعله خياراً في ابتداء النكاح، ولا يجب على من يعلم عقمه إخبار الآخر قبل العقد عند الجمهور {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11775}. وتجب الدية الكاملة في إبطال قوة الحبل والإحبال بالجناية، ويحرم قطع النسل بالدواء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11775}."
  en: "In the lexicon, uqm is a dryness that prevents conception; a woman who cannot conceive is barren, and the word is used of a man who cannot father children {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11773} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11774}. The jurists recommend that a man marrying choose a fertile virgin, since the law encourages offspring and forbids what blocks them; a report discourages marrying a barren woman {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11774} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11775}. The majority hold that sterility is not a defect that dissolves a marriage; al-Hasan alone gives the option of withdrawal at the start of the marriage, and the majority do not require a spouse who knows of his or her sterility to disclose it before the contract {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11775}. Full blood-money is due for injuring the power to conceive or to impregnate, and cutting off offspring by medicine is forbidden {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11775}."
