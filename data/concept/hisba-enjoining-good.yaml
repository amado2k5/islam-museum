id: concept/hisba-enjoining-good
class: concept
kind: legal
label: { ar: "الحسبة", en: "Hisba: enjoining good and forbidding wrong", ur: "حسبہ ⁦(نیکی کا حکم اور برائی سے روکنا)⁩", es: "Hisba: ordenar el bien y prohibir el mal", fr: "Hisba: ordonner le bien et interdire le mal" }
summary:
  ar: "الحسبة لغة الأجر وحسن التدبير والإنكار والاختبار، واصطلاحا عند جمهور الفقهاء الأمر بالمعروف إذا ظهر تركه والنهي عن المنكر إذا ظهر فعله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7036} وتفترق عن القضاء في أن المحتسب ينظر في الحقوق المعترف بها ولا يدخل في الجحود، وتزيد عليه بالنظر في المنكر من غير خصم، والقضاء فيه الأناة والوقار، والحسبة فيها الرهبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7037} وتختلف عن الإفتاء والشهادة والمظالم، والمظالم أعلى منها، والحسبة تليها بعد القضاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7038} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7042} والحسبة واجبة في الجملة، فإن تعلقت بواجب أو محرم فوجوبها على القادر ظاهر، وإن تعلقت بمندوب أو مكروه فهي مستحبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7041} وتجب على الإمام عينا، وعلى الآحاد بحسب القدرة والسلامة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7042} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7043} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7053} وشروط المحتسب: الإسلام، والتكليف، والعلم، والعدالة، والقدرة، والذكورة عند كثيرين، ويشترط الجمهور العدالة في صاحب الولاية دون المتطوع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7047} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7048} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7049} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7050} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7051} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7052} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7054} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7055} ويرتزق المحتسب من بيت المال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7056} وآداب المحتسب: العفة عن الهدايا، والتفقد للأسواق، والرفق والتأني، والستر عند الإمكان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7057} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7058} والمعروف والمنكر: المعروف ما يُعرف صوابه، والمنكر ما يُنكر ويحظره الشرع، ومنه المكروه كراهة التحريم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7059} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7063} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7064} وأقسام المعروف ما يتعلق بحق الله، كالجماعة والجمعة والأذان، وما يتعلق بحق الآدمي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7059} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7060} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7061} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7062} وشرط المنكر أن يكون محظورا، وأن يكون ظاهرا للمحتسب من غير تجسس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7064} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7065} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7068} وفي الستر على أصحاب الزلات، خلاف، والستر أولى عند جمهور الفقهاء في غير حقوق الله المتعلقة بالحدود، وفي الإنكار على أرباب البدع المضلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7065} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7066} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7067} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7068}"
  en: "Hisba (the office of enjoining good and forbidding wrong) is, for most jurists, enjoining good when it is seen to be neglected and forbidding wrong when it is seen to be done. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7036} It differs from judgeship in that the muhtasib deals with acknowledged rights and not with denial; it adds the power to act on wrong without a plaintiff, and judgeship calls for patience while hisba calls for awe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7037} It is distinct from fatwa, from testimony, and from the redress of grievances (mazalim), which ranks above it, and hisba comes after judgeship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7038} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7042} Hisba is a duty in general: when it concerns an obligation or a prohibition it is obligatory for the able, and when it concerns a recommended or disliked matter it is recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7041} It is an individual duty of the ruler, and a communal duty for others as far as they are able and safe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7042} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7043} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7053} The conditions of the muhtasib: Islam, legal capacity, knowledge, justice (which the majority require of the office-holder but not of the volunteer), capacity, and maleness for many. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7047} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7048} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7049} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7050} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7051} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7052} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7054} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7055} The office-holder is paid from the public treasury. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7056} The etiquette: refusing gifts, touring the markets, gentleness and patience, and concealing faults where possible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7057} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7058} Good is what is known to be right; wrong is what the law forbids, including the disliked forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7059} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7063} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7064} Good concerns God's rights, such as the Friday prayer, congregational prayer and the call to prayer, and concerns human rights, such as the public water supply and the rights of debtors. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7059} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7060} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7061} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7062} A wrong that the muhtasib may act on must be forbidden and visible to him without spying. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7064} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7065} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7068} Concealing the faults of those who slipped is preferred by most jurists except where God's penalties apply, and the innovators of misleading heresies may be confronted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7065} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7066} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7067} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7068}"
  es: "Hisba (el oficio de ordenar el bien y prohibir el mal) es, para la mayoría de los juristas, ordenar el bien cuando se ve que se descuida y prohibir el mal cuando se ve que se comete. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7036} Se diferencia del cargo de juez en que el muhtasib trata con derechos reconocidos y no con negación; añade el poder de actuar sobre el mal sin un demandante, y el cargo de juez exige paciencia mientras que hisba exige respeto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7037} Es distinto de la fatwa, del testimonio y de la reparación de agravios (mazalim), que tiene un rango superior, y hisba viene después del cargo de juez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7038} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7042} Hisba es un deber en general: cuando se trata de una obligación o una prohibición, es obligatorio para los capaces, y cuando se trata de un asunto recomendado o desaconsejable, es recomendable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7041} Es un deber individual del gobernante y un deber comunitario para los demás en la medida en que sean capaces y seguros. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7042} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7043} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7053} Las condiciones del muhtasib: Islam, capacidad jurídica, conocimiento, justicia (que la mayoría exige del titular del cargo pero no del voluntario), capacidad y ser hombre para muchos. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7047} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7048} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7049} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7050} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7051} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7052} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7054} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7055} El titular del cargo recibe su pago del tesoro público. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7056} La etiqueta: rechazar regalos, recorrer los mercados, gentileza y paciencia, y ocultar defectos cuando sea posible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7057} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7058} Lo bueno es lo que se sabe que es correcto; lo malo es lo que la ley prohíbe, incluyendo lo prohibido que no agrada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7059} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7063} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7064} El bien se refiere a los derechos de Dios, como la oración del viernes, la oración congregacional y el llamado a la oración, y se refiere a los derechos humanos, como el suministro público de agua y los derechos de los deudores. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7059} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7060} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7061} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7062} Un mal sobre el cual el muhtasib puede actuar debe estar prohibido y ser visible para él sin espionaje. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7064} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7065} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7068} La mayoría de los juristas prefieren ocultar las faltas de quienes se desviaron, excepto cuando se aplican los castigos de Dios y se puede confrontar a los innovadores de herejías engañosas. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7065} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7066} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7067} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7068}"
  fr: "La hisba (office d'ordonner le bien et d'interdire le mal) consiste, pour la plupart des juristes, à ordonner le bien lorsqu'il est négligé et à interdire le mal lorsqu'il est commis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7036} Elle diffère du jugement en ce que le muhtasib traite des droits reconnus et non des droits contestés; elle ajoute le pouvoir d'agir contre le mal sans plaignant, et le jugement exige de la patience tandis que la hisba exige du respect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7037} Elle se distingue de la fatwa, du témoignage et du recours aux griefs (mazalim), qui lui est supérieur, et la hisba intervient après le jugement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7038} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7042} La hisba est un devoir en général: lorsqu’elle concerne une obligation ou une interdiction, elle est obligatoire pour ceux qui en sont capables, et lorsqu’elle concerne une chose recommandée ou déconseillée, elle est recommandée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7041} C’est un devoir individuel pour le dirigeant et un devoir collectif pour les autres, dans la mesure où ils en sont capables et en toute sécurité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7042} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7043} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7053} Les conditions du muhtasib: l’islam, la capacité juridique, la connaissance, la justice (que la majorité exige du titulaire de la charge mais pas du volontaire), la capacité et la masculinité pour beaucoup. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7047} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7048} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7049} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7050} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7051} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7052} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7054} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7055} Le titulaire de charge est rémunéré des fonds publics. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7056} L'étiquette: refuser les cadeaux, visiter les marchés, faire preuve de douceur et de patience, et dissimuler ses défauts autant que possible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7057} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7058} Le bien est ce qui est reconnu comme juste; le mal est ce que la loi interdit, y compris ce qui est interdit et détesté. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7059} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7063} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7064} Le bien concerne les droits de Dieu, tels que la prière du vendredi, la prière en congrégation et l'appel à la prière, et concerne les droits de l'homme, tels que l'approvisionnement public en eau et les droits des débiteurs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7059} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7060} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7061} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7062} Un tort sur lequel le muhtasib peut agir doit lui être interdit et visible sans espionnage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7064} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7065} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7068} La plupart des juristes préfèrent dissimuler les fautes de ceux qui ont dérapé, sauf lorsque les sanctions divines s'appliquent et que les innovateurs d'hérésies trompeuses peuvent être confrontés. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7065} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7066} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7067} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7068}"
