label: { ar: "الحسبة", en: "Hisba: enjoining good and forbidding wrong", ur: "حسبہ (نیکی کا حکم اور برائی سے روکنا)" }
summary:
  ar: "الحسبة لغة الأجر وحسن التدبير والإنكار والاختبار، واصطلاحا عند جمهور الفقهاء الأمر بالمعروف إذا ظهر تركه والنهي عن المنكر إذا ظهر فعله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7036} وتفترق عن القضاء في أن المحتسب ينظر في الحقوق المعترف بها ولا يدخل في الجحود، وتزيد عليه بالنظر في المنكر من غير خصم، والقضاء فيه الأناة والوقار، والحسبة فيها الرهبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7037} وتختلف عن الإفتاء والشهادة والمظالم، والمظالم أعلى منها، والحسبة تليها بعد القضاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7038} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7042} والحسبة واجبة في الجملة، فإن تعلقت بواجب أو محرم فوجوبها على القادر ظاهر، وإن تعلقت بمندوب أو مكروه فهي مستحبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7041} وتجب على الإمام عينا، وعلى الآحاد بحسب القدرة والسلامة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7042} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7043} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7053} وشروط المحتسب: الإسلام، والتكليف، والعلم، والعدالة، والقدرة، والذكورة عند كثيرين، ويشترط الجمهور العدالة في صاحب الولاية دون المتطوع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7047} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7048} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7049} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7050} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7051} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7052} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7054} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7055} ويرتزق المحتسب من بيت المال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7056} وآداب المحتسب: العفة عن الهدايا، والتفقد للأسواق، والرفق والتأني، والستر عند الإمكان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7057} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7058} والمعروف والمنكر: المعروف ما يُعرف صوابه، والمنكر ما يُنكر ويحظره الشرع، ومنه المكروه كراهة التحريم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7059} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7063} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7064} وأقسام المعروف ما يتعلق بحق الله، كالجماعة والجمعة والأذان، وما يتعلق بحق الآدمي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7059} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7060} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7061} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7062} وشرط المنكر أن يكون محظورا، وأن يكون ظاهرا للمحتسب من غير تجسس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7064} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7065} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7068} وفي الستر على أصحاب الزلات، خلاف، والستر أولى عند جمهور الفقهاء في غير حقوق الله المتعلقة بالحدود، وفي الإنكار على أرباب البدع المضلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7065} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7066} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7067} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7068}"
  en: "Hisba (the office of enjoining good and forbidding wrong) is, for most jurists, enjoining good when it is seen to be neglected and forbidding wrong when it is seen to be done. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7036} It differs from judgeship in that the muhtasib deals with acknowledged rights and not with denial; it adds the power to act on wrong without a plaintiff, and judgeship calls for patience while hisba calls for awe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7037} It is distinct from fatwa, from testimony, and from the redress of grievances (mazalim), which ranks above it, and hisba comes after judgeship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7038} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7042} Hisba is a duty in general: when it concerns an obligation or a prohibition it is obligatory for the able, and when it concerns a recommended or disliked matter it is recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7041} It is an individual duty of the ruler, and a communal duty for others as far as they are able and safe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7042} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7043} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7053} The conditions of the muhtasib: Islam, legal capacity, knowledge, justice (which the majority require of the office-holder but not of the volunteer), capacity, and maleness for many. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7047} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7048} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7049} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7050} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7051} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7052} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7054} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7055} The office-holder is paid from the public treasury. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7056} The etiquette: refusing gifts, touring the markets, gentleness and patience, and concealing faults where possible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7057} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7058} Good is what is known to be right; wrong is what the law forbids, including the disliked forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7059} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7063} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7064} Good concerns God's rights, such as the Friday prayer, congregational prayer and the call to prayer, and concerns human rights, such as the public water supply and the rights of debtors. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7059} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7060} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7061} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7062} A wrong that the muhtasib may act on must be forbidden and visible to him without spying. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7064} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7065} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7068} Concealing the faults of those who slipped is preferred by most jurists except where God's penalties apply, and the innovators of misleading heresies may be confronted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7065} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7066} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7067} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7068}"
