summary:
  ar: "يوصي ابن سينا بأن يتقدم الإسهال والقيء تلطيف الخلط المراد استفراغه وتوسيع المجاري وفتحها فيريح ذلك البدن من التعب، وبأن تعويد الطبيعة اللين والإجابة بسهولة قبل الدواء القوي من التدابير المفلحة {cite:canon-ibn-sina-print-v1 p.277}."
  en: "Ibn Sina advises that purging and vomiting be preceded by thinning the humour to be evacuated and widening and opening the channels, which spares the body fatigue, and counts habituating nature to ease and ready response before a strong drug among the successful measures {cite:canon-ibn-sina-print-v1 p.277}."
