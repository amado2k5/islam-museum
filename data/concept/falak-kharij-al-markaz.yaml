id: concept/falak-kharij-al-markaz
class: concept
kind: scientific
label: { ar: "الفلك الخارج المركز", en: "Eccentric orb", es: "orbe excéntrico", fr: "orbe excentrique" }
summary:
  ar: "فلك يكون مركزه مخالفاً لمركز الأرض، فيُقطع بُعد الجرم عن الأرض فيتغير بين الأوج والحضيض. يبيّن الفرغاني أن للشمس فلكاً واحداً خارج المركز، بُعد مركزه عن مركز الأرض جزءان ونصف من ستين جزءاً هي نصف قطره. {cite:farghani-elements-astronomy p. 66}{cite:farghani-elements-astronomy p. 84}"
  en: "An orb whose centre is off the earth's centre, so that a body's distance from the earth varies between apogee and perigee. al-Farghani gives the sun one eccentric orb whose centre lies two and a half parts off the earth's centre, when the orb's radius is sixty parts {cite:farghani-elements-astronomy p. 66}."
  es: "Un orbe cuyo centro está alejado del centro de la Tierra, de modo que la distancia de un cuerpo a la Tierra varía entre el apogeo y el perigeo. Al-Farghani le da al Sol un orbe excéntrico cuyo centro se encuentra a dos partes y media del centro de la Tierra, cuando el radio del orbe es de sesenta partes {cite:farghani-elements-astronomy p. 66}."
  fr: "Un corps céleste est un globe dont le centre est excentré par rapport au centre de la Terre, de sorte que sa distance à la Terre varie entre l'apogée et le périgée. Al-Farghani décrit le Soleil comme un globe excentrique dont le centre est situé à deux parties et demie du centre de la Terre, lorsque son rayon est de soixante parties {cite:farghani-elements-astronomy p. 66}."
