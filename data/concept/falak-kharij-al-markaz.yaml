summary:
  ar: "فلك يكون مركزه مخالفاً لمركز الأرض، فيُقطع بُعد الجرم عن الأرض فيتغير بين الأوج والحضيض. يبيّن الفرغاني أن للشمس فلكاً واحداً خارج المركز، بُعد مركزه عن مركز الأرض جزءان ونصف من ستين جزءاً هي نصف قطره. {cite:farghani-elements-astronomy p. 66}{cite:farghani-elements-astronomy p. 84}"
  en: "An orb whose centre is off the earth's centre, so that a body's distance from the earth varies between apogee and perigee. al-Farghani gives the sun one eccentric orb whose centre lies two and a half parts off the earth's centre, when the orb's radius is sixty parts {cite:farghani-elements-astronomy p. 66}."
