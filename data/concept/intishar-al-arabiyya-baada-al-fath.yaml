id: concept/intishar-al-arabiyya-baada-al-fath
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-origins]
label:
  ar: "انتشار العربية بعد الفتح"
  en: "How Arabic spread after the conquests"
  ur: "فتوحات کے بعد عربی کا پھیلاؤ"
  fr: "La diffusion de l'arabe après les conquêtes"
  es: "La difusión del árabe tras las conquistas"
  tr: "Fetihten sonra Arapçanın yayılması"
  id: "Penyebaran bahasa Arab setelah penaklukan"
summary:
  ar: "ما يقوله ملخص بحثي زُوّد به المتحف عن انتشار العربية خارج جزيرة العرب بعد القرن السابع: بالفتح العسكري، والإصلاح الإداري، والاستيطان الحضري، ثم الهجرات القبلية اللاحقة. وهذه الصفحة هي المدخل الأول لأربع صفحات: هذه، و[[concept/taarib-al-dawawin|تعريب الدواوين]]، و[[concept/al-arabiyya-fi-al-andalus-wa-siqilliyya|العربية في الأندلس وصقلية]]، و[[concept/taarib-al-maghrib|تعريب المغرب]]. ولم يفتح المتحف الصفحات التي يسمّيها الملخص، وقد أجاز المؤسس استعمالها كما وردت في 21 نوفمبر 2026."
  en: "What a research summary supplied to the museum says about how Arabic spread beyond the Arabian Peninsula after the 7th century: through military conquest, administrative reform, urban settlement and later tribal migrations. This page is the first doorway to four: this one, [[concept/taarib-al-dawawin|The Arabisation of the dīwāns]], [[concept/al-arabiyya-fi-al-andalus-wa-siqilliyya|Arabic in al-Andalus and Sicily]] and [[concept/taarib-al-maghrib|The Arabisation of the Maghrib]]. The museum did not open the pages the summary names, and the founder approved using them as supplied on 21 November 2026."
  ur: "ایک تحقیقی خلاصہ، جو متحف کو فراہم کیا گیا، یہ کہتا ہے کہ ساتویں صدی کے بعد عربی جزیرۂ عرب سے باہر کیسے پھیلی: فوجی فتح، انتظامی اصلاح، شہری آبادکاری اور بعد کی قبائلی ہجرتوں کے ذریعے۔ یہ صفحہ چار صفحات کا پہلا دروازہ ہے: یہ صفحہ، [[concept/taarib-al-dawawin|دواوین کی تعریب]]، [[concept/al-arabiyya-fi-al-andalus-wa-siqilliyya|اندلس اور صقلیہ میں عربی]] اور [[concept/taarib-al-maghrib|مغرب کی تعریب]]۔ متحف نے خلاصے کے بیان کردہ صفحات نہیں کھولے، اور بانی نے 21 نومبر 2026 کو انہیں جیسے ملے ویسے استعمال کرنے کی منظوری دی۔"
  fr: "Ce que dit un résumé de recherche remis au musée sur la manière dont l'arabe s'est répandu hors de la péninsule arabique après le VIIe siècle : par la conquête militaire, la réforme administrative, l'installation urbaine et les migrations tribales ultérieures. Cette page est la première porte de quatre : celle-ci, [[concept/taarib-al-dawawin|L'arabisation des dīwāns]], [[concept/al-arabiyya-fi-al-andalus-wa-siqilliyya|L'arabe en al-Andalus et en Sicile]] et [[concept/taarib-al-maghrib|L'arabisation du Maghreb]]. Le musée n'a pas ouvert les pages que nomme le résumé, et le fondateur a approuvé leur usage tel que fourni le 21 novembre 2026."
  es: "Lo que dice un resumen de investigación entregado al museo sobre cómo se difundió el árabe fuera de la península arábiga después del siglo VII: por la conquista militar, la reforma administrativa, el asentamiento urbano y las migraciones tribales posteriores. Esta página es la primera puerta de cuatro: esta, [[concept/taarib-al-dawawin|La arabización de los dīwāns]], [[concept/al-arabiyya-fi-al-andalus-wa-siqilliyya|El árabe en al-Ándalus y Sicilia]] y [[concept/taarib-al-maghrib|La arabización del Magreb]]. El museo no abrió las páginas que nombra el resumen, y el fundador aprobó usarlas tal como se entregaron el 21 de noviembre de 2026."
  tr: "Müzenin Arap Yarımadası dışına yayılması hakkında sunduğu araştırma özeti budur: askeri fetih, idari reform, kentsel yerleşim ve ardından gelen kabile göçleri. Bu sayfa, dört sayfanın ilk girişidir: bu, [[concept/taarib-al-dawawin|diwanların Araplaştırılması]], [[concept/al-arabiyya-fi-al-andalus-wa-siqilliyya|Endülüs ve Sicilya'da Arapça]] ve [[concept/taarib-al-maghrib|Fas'ın Araplaştırılması]]. Müze, özet olarak adlandırdığı sayfaları açmamış ve kurucu 21 Kasım 2026'da belirtildiği gibi kullanımlarına izin vermiştir."
  id: "Inilah yang diberikan oleh ringkasan penelitian yang diberikan museum tentang penyebaran bahasa Arab di luar Semenanjung Arab setelah abad ketujuh: penaklukan militer, reformasi administrasi, pemukiman urban, dan migrasi suku berikutnya. Halaman ini adalah entri pertama dari empat halaman: ini, [[konsep/taarib-al-dawawin|Arabisasi diwan]], [[konsep/al-arabiyya-fi-al-andalus-wa-siqilliyya|Arab di Andalusia dan Sisilia]], dan [[konsep/taarib-al-maghrib|Arabisasi Maroko]]. Museum tidak membuka halaman yang disebut ringkasan, dan pendiri mengizinkan penggunaannya seperti yang dinyatakan pada 21 November 2026."
