id: concept/canon-tensive-and-pressing-pain
class: concept
kind: scientific
label: { ar: "الوجع الممدد والضاغط عند ابن سينا", en: "Tensive and pressing pain in the Canon", ur: "کھنچنے والا اور دبانے والا درد، قانون کے مطابق", es: "Dolor intenso y opresivo en el Canon", fr: "Douleurs intenses et pressantes dans le canon", tr: "İbn Sina'daki uzun süren ve acemi acı", id: "Rasa sakit yang berkepanjangan dan mendesak pada Ibn Sina" }
summary:
  ar: "سبب الوجع الممدّد ريح أو خلط يمدّد العصب، وسبب الضاغط مادة تضيّق على العضو مكانه أو ريح تكتنفه فيشبه المقبوض عليه {cite:canon-ibn-sina-print-v1 p.149}."
  en: "Tensive pain is caused by wind or a humour that stretches a nerve; pressing pain by matter that narrows the organ's place or wind that surrounds it, so that it seems gripped {cite:canon-ibn-sina-print-v1 p.149}."
  es: "El dolor tensional es causado por un viento o un humor que estira un nervio; el dolor opresivo por materia que estrecha el lugar del órgano o viento que lo rodea, de modo que parece estar atrapado {cite:canon-ibn-sina-print-v1 p.149}."
  fr: "La douleur tensive est causée par le vent ou une humeur qui étire un nerf; la douleur pressante par une matière qui rétrécit l'espace de l'organe ou par le vent qui l'entoure, de sorte qu'il semble serré {cite:canon-ibn-sina-print-v1 p.149}."
  ur: "شدید درد ہوا یا مزاح کی وجہ سے ہوتا ہے جو اعصاب کو کھینچتا ہے۔ مادے کے ذریعے درد کو دبانا جو عضو کی جگہ کو تنگ کرتا ہے یا ہوا جو اس کے گرد گھیرا ہوا ہے، تاکہ یہ گرفت میں آ جائے۔"
  tr: "Uzun süreli ağrının nedeni, siniri geren rüzgar veya karışmadır; kompresörün nedeni ise organın yerini daraltan veya çevresindeki rüzgarı daraltan bir maddedir; bu, yakalanan bir kişiye benzer {cite:canon-ibn-sina-print-v1 s.149}."
  id: "Penyebab rasa sakit berkepanjangan adalah angin atau pencampuran yang meregangkan saraf, dan penyebab kompresor adalah zat yang menyempitkan posisi organ atau angin di sekitarnya, menyerupai seseorang yang disancam {cite:canon-ibn-sina-print-v1 hlm.149}."
