id: concept/al-kufr-satr-al-haqq
class: concept
kind: doctrine
label:
  ar: "الكفر بوصفه ستراً للحق"
  en: "Kufr as concealment of the truth"
  fr: "Le kufr comme dissimulation de la vérité"
  ur: "کفر بطور حق کو چھپانا"
  es: "La incredulidad como ocultamiento de la verdad."
  tr: "Gerçeği örtbas etmek için inançsızlık"
  id: "Tidak percaya untuk menutupi kebenaran"
summary:
  ar: "يرى الشعراوي أن الكفر في اللغة الستر، وأن من يكفر يستر وجود الله، والستر لا يكون إلا لموجود، فالأصل هو الإيمان الذي طرأت عليه الغفلة. ويستدل بأن آدم علم الأسماء وأمر الملائكة بالسجود، وأن الكفر تأخر عن ذلك، وأن الحجة في سؤال الله للكفار «كيف تكفرون بالله» وهم كانوا أمواتا فأحياهم {cite:tafsir-sharawi-khawatir-scan p.137} {cite:tafsir-sharawi-khawatir-scan p.138}. هذا تفسيره ويُنسب إليه."
  en: "Sha'rawi holds that kufr means concealment, so that the disbeliever conceals God's existence; a concealment presupposes something that exists, so faith is the original state and heedlessness came after it. He argues from Adam's teaching and the angels' prostration that disbelief came later, and that God's question 'how do you disbelieve in God, when you were dead and He gave you life' is an argument from the disbeliever's own existence {cite:tafsir-sharawi-khawatir-scan p.137} {cite:tafsir-sharawi-khawatir-scan p.138}. This is Sha'rawi's reading and is attributed to him."
  fr: "Sha'rawi estime que kufr signifie dissimulation, de sorte que le mécréant dissimule l’existence de Dieu ; une dissimulation suppose quelque chose qui existe, la foi est donc l’état originel et l’insouciance est venue après elle. Il tire argument de l’enseignement donné à Adam et de la prosternation des anges pour montrer que la mécréance est venue plus tard, et voit dans la question de Dieu « comment pouvez-vous ne pas croire en Dieu, alors que vous étiez morts et qu’Il vous a donné la vie » un argument tiré de l’existence même du mécréant {cite:tafsir-sharawi-khawatir-scan p.137} {cite:tafsir-sharawi-khawatir-scan p.138}. Il s’agit de la lecture de Sha'rawi, qui lui est attribuée."
  ur: "شعراوی کے مطابق کفر کا لغوی مطلب چھپانا ہے، یعنی کافر اللہ کے وجود کو چھپاتا ہے، اور چھپانا کسی موجود چیز کا ہوتا ہے، اس لیے اصل ایمان ہے اور غفلت بعد میں آئی۔ وہ آدم کے علم اور فرشتوں کے سجدے سے استدلال کرتے ہیں کہ کفر بعد میں آیا، اور اللہ کا سوال «كيف تكفرون بالله» انسان کے اپنے وجود سے دلیل ہے {cite:tafsir-sharawi-khawatir-scan p.137} {cite:tafsir-sharawi-khawatir-scan p.138}۔ یہ شعراوی کی تفسیر ہے اور ان کی طرف منسوب ہے۔"
  es: "Sha'rawi sostiene que kufr significa ocultamiento, de modo que el incrédulo oculta la existencia de Dios; un ocultamiento presupone algo que existe, por lo que la fe es el estado original y la indiferencia vino después. Argumenta a partir de la enseñanza de Adán y la postración de los ángeles que la incredulidad vino después, y que la pregunta de Dios «¿cómo puedes descreer en Dios, si estabas muerto y Él te dio la vida?» es un argumento basado en la propia existencia del incrédulo {cite:tafsir-sharawi-khawatir-scan p.137} {cite:tafsir-sharawi-khawatir-scan p.138}. Esta es la interpretación de Sha'rawi y se le atribuye."
  tr: "Al-Shaarawi, dilde inançsızlığın gizlenme olduğuna, inanmazın Allah'ın varlığını gizlediğine ve gizlemenin sadece varoluş için var olduğuna inanır. Asıl inanç, dikkatsizlikten kaynaklanan inançtır. O, Adem'in isimleri öğrettiğini ve meleklere secde etmelerini emrettiğini, kâfirliğin bunun geciktiğini ve argümanın, kâfirlere öldüklerinde \"Allah'a nasıl kâfir oluyorsunuz?\" diye sormakta olduğunu savunur; böylece O'nun onları hayata döndürdüğünü {cite:tafsir-sharawi-khawatir-scan s.137} {cite:tafsir-sharawi-khawatir-scan s.138} Bu onun yorumudur ve ona atfedilir."
  id: "Al-Shaarawi percaya bahwa ketidakpercayaan pada bahasa adalah penyembunyian, orang kafir menyembunyikan keberadaan Allah, dan penyembunyian hanya ada demi keberadaan. Iman sejati adalah kepercayaan yang muncul dari kelalaian. Ia berargumen bahwa Adam mengajarkan nama-nama dan memerintahkan malaikat untuk sujud, bahwa ketidakpercayaan menunda hal ini, dan argumennya adalah bertanya kepada orang kafir ketika mereka meninggal, \"Bagaimana kalian tidak percaya kepada Allah?\" dengan demikian Ia menghidupkan mereka kembali {cite:tafsir-sharawi-khawatir-scan hlm.137} {cite:tafsir-sharawi-khawatir-scan hlm.138} Ini adalah tafsir-sharawi-khawatir-scan hlm.138} Ini adalah tafsir-sharawi-khawatir-scan hlm.138} Ini adalah tafsir-sharawi-khawatir-scan hlm.138} Inilah interpretasinya dan dikaitkan kepadanya."
