id: concept/al-kufr-satr-al-haqq
class: concept
kind: doctrine
label:
  ar: "الكفر بوصفه ستراً للحق"
  en: "Kufr as concealment of the truth"
  ur: "کفر بطور حق کو چھپانا"
summary:
  ar: "يرى الشعراوي أن الكفر في اللغة الستر، وأن من يكفر يستر وجود الله، والستر لا يكون إلا لموجود، فالأصل هو الإيمان الذي طرأت عليه الغفلة. ويستدل بأن آدم علم الأسماء وأمر الملائكة بالسجود، وأن الكفر تأخر عن ذلك، وأن الحجة في سؤال الله للكفار «كيف تكفرون بالله» وهم كانوا أمواتا فأحياهم {cite:tafsir-sharawi-khawatir-scan p.137} {cite:tafsir-sharawi-khawatir-scan p.138}. هذا تفسيره ويُنسب إليه."
  en: "Sha'rawi holds that kufr means concealment, so that the disbeliever conceals God's existence; a concealment presupposes something that exists, so faith is the original state and heedlessness came after it. He argues from Adam's teaching and the angels' prostration that disbelief came later, and that God's question 'how do you disbelieve in God, when you were dead and He gave you life' is an argument from the disbeliever's own existence {cite:tafsir-sharawi-khawatir-scan p.137} {cite:tafsir-sharawi-khawatir-scan p.138}. This is Sha'rawi's reading and is attributed to him."
  ur: "شعراوی کے مطابق کفر کا لغوی مطلب چھپانا ہے، یعنی کافر اللہ کے وجود کو چھپاتا ہے، اور چھپانا کسی موجود چیز کا ہوتا ہے، اس لیے اصل ایمان ہے اور غفلت بعد میں آئی۔ وہ آدم کے علم اور فرشتوں کے سجدے سے استدلال کرتے ہیں کہ کفر بعد میں آیا، اور اللہ کا سوال «كيف تكفرون بالله» انسان کے اپنے وجود سے دلیل ہے {cite:tafsir-sharawi-khawatir-scan p.137} {cite:tafsir-sharawi-khawatir-scan p.138}۔ یہ شعراوی کی تفسیر ہے اور ان کی طرف منسوب ہے۔"
