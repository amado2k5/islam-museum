label: { ar: "الأمراض المركبة والأورام عند ابن سينا", en: "Composite diseases and tumours in the Canon", ur: "قانون میں مرکب بیماریاں اور ورم", es: "Enfermedades compuestas y tumores en el Canon", fr: "Maladies et tumeurs composites dans le Canon", tr: "İbn Sina'daki Karmaşık Hastalıklar ve Tümörler", id: "Penyakit dan Tumor Kompleks di Avicenna" }
summary:
  ar: "في الفصل الخامس يبين ابن سينا أن الأمراض المركبة ليست أمراضاً اتفقت متجمعة بل التي إذا اجتمعت حدث منها مرض واحد، ومثالها الورم الذي يوجد فيه أجناس الأمراض كلها، ثم يقسم الأورام بحسب موادها الست {cite:canon-ibn-sina-print-v1 p.107}."
  en: "In the fifth chapter Ibn Sina shows that composite diseases are not diseases that merely happen to be together but those whose joining produces one disease, the example being the tumour, in which all the genera of disease are found, and he divides tumours by their six matters {cite:canon-ibn-sina-print-v1 p.107}."
  es: "En el quinto capítulo, Ibn Sina muestra que las enfermedades compuestas no son enfermedades que simplemente se presentan juntas, sino aquellas cuya unión produce una sola enfermedad, siendo el ejemplo el tumor, en el que se encuentran todos los géneros de enfermedades, y divide los tumores según sus seis componentes {cite:canon-ibn-sina-print-v1 p.107}."
  fr: "Dans le cinquième chapitre, Ibn Sina montre que les maladies composites ne sont pas des maladies qui se trouvent simplement ensemble, mais celles dont l'union produit une seule maladie, l'exemple étant la tumeur, dans laquelle tous les genres de maladies se trouvent, et il divise les tumeurs selon leurs six matières {cite:canon-ibn-sina-print-v1 p.107}."
  ur: "پانچویں باب میں ابن سینا بتاتا ہے کہ جامع بیماریاں وہ بیماریاں نہیں ہیں جو محض اکٹھے ہونے سے ہوتی ہیں بلکہ وہ بیماریاں ہیں جن کے ملاپ سے ایک بیماری پیدا ہوتی ہے، مثال ٹیومر ہے جس میں بیماری کی تمام نسلیں پائی جاتی ہیں، اور وہ رسولیوں کو ان کے چھ امور سے تقسیم کرتا ہے۔"
  tr: "Beşinci bölümde, İbn Sina karmaşık hastalıkların birlikte kabul edilen hastalıklar olmadığını, aksine birleştiğinde tek bir hastalığın ortaya çıktığını açıklar. Bir örnek, tüm hastalık cinslerini içeren bir tümördür. Daha sonra tümörleri altı materyaline göre sınıflandırır {cite:canon-ibn-sina-print-v1 s.107}."
  id: "Dalam bab kelima, Ibn Sina menjelaskan bahwa penyakit kompleks bukanlah penyakit yang disepakati bersama, melainkan, ketika digabungkan, satu penyakit tunggal terjadi. Contohnya adalah tumor yang mengandung semua genus penyakit. Ia kemudian mengklasifikasikan tumor berdasarkan enam materinya {cite:canon-ibn-sina-print-v1 hlm.107}."
