summary:
  ar: "في الفصل الخامس يبين ابن سينا أن الأمراض المركبة ليست أمراضاً اتفقت متجمعة بل التي إذا اجتمعت حدث منها مرض واحد، ومثالها الورم الذي يوجد فيه أجناس الأمراض كلها، ثم يقسم الأورام بحسب موادها الست {cite:canon-ibn-sina-print-v1 p.107}."
  en: "In the fifth chapter Ibn Sina shows that composite diseases are not diseases that merely happen to be together but those whose joining produces one disease, the example being the tumour, in which all the genera of disease are found, and he divides tumours by their six matters {cite:canon-ibn-sina-print-v1 p.107}."
