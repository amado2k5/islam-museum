id: concept/malik-keeper-of-jahannam
class: concept
kind: angel
label:
  ar: مالك خازن النار
  en: Malik, Keeper of the Fire
  ur: آگ کا خازن مالک
summary:
  ar: ملك يُسمّيه الحديث خازن جهنم، يُعرَف في كتب السنة بأحاديث مروية في الترمذي ومسنده غيره؛ والقرآن يذكر خازن النار دون تسمية، فيجمع بعضهم بينه
    وبين مالك خازن النار المروي في الحديث.
  en: An angel whom hadith collections name as the keeper of Hell — Malik — while the Qur'an speaks of Hell's keeper without naming him; commentators
    variously identify him with this Malik.
  ur: وہ فرشتہ جسے حدیث کی کتابیں جہنم کا خازن مالک بتاتی ہیں، جبکہ قرآن جہنم کے خازن کا ذکر بغیر نام کے کرتا ہے؛ مفسرین اسے اسی مالک سے جوڑتے
    ہیں۔
