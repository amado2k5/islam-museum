id: concept/al-farah-wal-surur
class: concept
kind: ethical
label:
  ar: "الفرح والسرور"
  en: "Joy and gladness (al-farah wal-surur)"
  ur: "خوشی اور مسرت (الفرح والسرور)"
summary:
  ar: "يعرض الشيخ عمر عبد الكافي الفرح والسرور: السرور الخالص من الحزن، والفرح المذموم المقرون بالفخر والبطر، وأن الإيمان أعظم أسباب السرور، وأن السعادة تُطلب بالتقوى والرضا لا بالسفر أو المال، وأن البشاشة في الوجه خُلق نبوي."
  en: "Sheikh Omar Abdelkafy sets out joy and gladness: surur as gladness free from grief, the blameworthy farah linked with pride and boasting, faith as the greatest source of gladness, happiness sought through piety and contentment rather than travel or wealth, and a cheerful face as a prophetic manner."
  ur: "شیخ عمر عبدالکافی خوشی اور مسرت کو بیان کرتے ہیں: وہ مسرت جو غم سے خالی ہو، اور وہ مذموم فرح جو فخر اور اترانے سے جڑا ہو، ان کے نزدیک ایمان خوشی کا سب سے بڑا سبب ہے، اور خوشی تقوی اور رضا سے حاصل ہوتی ہے نہ کہ سفر یا مال سے، اور چہرے کی بشاشت نبوی اخلاق ہے۔"
