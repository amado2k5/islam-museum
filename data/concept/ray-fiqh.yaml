id: concept/ray-fiqh
class: concept
kind: legal
label:
  ar: "الريع"
  en: "Ray': agricultural yield, rental proceeds, and waqf revenue in Islamic jurisprudence"
  ur: "ریع (پیداوار، کرایہ اور وقف کی آمدنی کے فقہی احکام)"
summary:
  ar: "الريع لغة النماء والزيادة والمرتفع من الأرض، وفي الاصطلاح ما تخرجه الأرض من زرع أو الشجر من ثمر أو حاصل كراء العقار والمستغلات، وهو يباين الربح الناشئ عن البيع والتجارة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9052} يصح إيراد العقود على الريع كالوقف والوصية والمساقاة والمزارعة، واختلف الفقهاء في اشتراط الواقف الريع لنفسه فأجازه الحنفية والحنابلة في رواية، ومنعه المالكية والشافعية لئلا يعود الوقف إلى منفعة الواقف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9053} تصرف غلة الوقف بحسب شروط الواقف المعتبرة، وتقدم عمارة الأصل الموقوف وترميمه على توزيع الريع صيانة للمال عن الاندثار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9054} وتجوز الوصية بريع الدار أو الأرض مؤبدة أو مؤقتة فتكون الرقبة للورثة والمنفعة للموصى له، كما تصح المساقاة بحصة شائعة من ثمار الشجر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9055} تجوز المزارعة بجزء شائع من خارج الأرض عند جمهور الصحابة والفقهاء، ويضمن غاصب العقار ريعه وأجر مثله عند المالكية والشافعية والحنابلة في المعتمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9056} تجب زكاة الزروع والثمار في ريع الأرض كما نص في سورة البقرة: 267 وسورة الأنعام: 141، وسبب الفرضية نماء الأرض بالخارج حقيقة فلا عشر في الحطب والحشيش النابت بلا قصد الاستغلال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9057}"
  en: "Ray' lexically denotes growth, increase, and elevated ground, and in Islamic jurisprudence it signifies the agricultural produce of land, the fruits of trees, or the rental revenues derived from real estate and leased assets, in contrast to profit (ribh) generated through commerce. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9052} Legal transactions such as endowments (waqf), bequests (wasiyya), sharecropping (muzara'a), and agricultural irrigation partnerships (musaqat) may be established upon future yield, and scholars disagreed over whether an endower may stipulate the waqf's proceeds for himself: the Hanafis and Hanbalis permit it, whereas the Malikis and Shafi'is disallow it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9053} Revenues of an endowment are distributed in accordance with the founder's stipulations, though maintenance and upkeep of the underlying property take precedence over distributing income so that the physical asset is preserved. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9054} Bequeathing the perpetual or temporary usufruct and proceeds of an estate is valid, granting ownership of the property to heirs while granting income to the legatee, and irrigation partnerships for a proportional share of fruit are valid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9055} Sharecropping for an undivided percentage of agricultural output is permissible according to the majority of Companions and jurists, and an unlawful usurper of real property is liable for fair rental yield according to the Malikis, Shafi'is, and Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9056} Zakat on agricultural produce and fruits is obligatory upon land output as established in surah al-Baqarah: 267 and surah al-An'am: 141, the legal reason being actual fruitful growth, excluding spontaneously growing firewood or wild weeds not intended for cultivation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9057}"
  ur: "ریع کا لغوی معنی اضافہ، بڑھوتری اور بلند زمین ہے، اور فقہ میں زمین کی پیداوار، درختوں کے پھل، یا جائیداد اور سواریوں کے کرائے و آمدنی کو ریع کہا جاتا ہے جو تجارت کے نفع سے الگ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9052} ریع پر وقف، وصیت، مساقات اور مزارعت کے عقود جاری ہو سکتے ہیں، اور واقف کا اپنے لیے وقف کی پیداوار یا آمدنی کی شرط لگانا حنفیہ اور حنابلہ کے ہاں جائز جبکہ مالکیہ اور شوافع کے ہاں ناجائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9053} وقف کی آمدنی واقف کی شرائط کے مطابق تقسیم ہوتی ہے، اور وقف کی اصل جائیداد کی تعمیر و مرمت کو آمدنی کی تقسیم پر مقدم رکھا جاتا ہے تاکہ اصل باقی رہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9054} جائیداد کی پیداوار یا کرائے کی دائمی یا وقتی وصیت درست ہے جس میں اصل ملکیت وارثوں کی اور آمدنی موصی لہ کی ہوتی ہے، اور درختوں کے پھل میں مشاع حصے پر مساقات درست ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9055} زمین کی پیداوار میں متعین حصے پر مزارعت جمہور فقہاء کے نزدیک جائز ہے، اور غصب شدہ جائیداد کا غاصب مالکیہ، شوافع اور حنابلہ کے ہاں پیداوار اور اجر مثل کا ضامن ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9056} زمین کی زراعت اور پھلوں پر زکوۃ واجب ہے جیسا کہ سورۃ البقرۃ: 267 اور سورۃ الانعام: 141 میں وارد ہے، اور وجوب کا سبب زمین کی حقیقی بڑھوتری ہے لہٰذا بغیر کاشت کے خود رو گھاس پھونس اور لکڑیوں پر زکوۃ نہیں ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9057}"
