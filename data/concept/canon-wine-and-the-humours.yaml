id: concept/canon-wine-and-the-humours
class: concept
kind: scientific
label: { ar: "أثر الشراب في الأخلاط والدماغ عند ابن سينا", en: "What wine does to the humours and the brain in the Canon", ur: "اخلاط اور دماغ پر شراب کا اثر قانون میں", es: "Lo que el vino le hace a los humores y al cerebro en el Canon", fr: "Ce que le vin fait aux humeurs et au cerveau dans le Canon", tr: "İbn Sina'ya göre içmenin mizah ve beyin üzerindeki etkisi", id: "Pengaruh minum terhadap humor dan otak menurut Ibn Sina" }
summary:
  ar: "يذكر ابن سينا أن الشراب ينفع الممرورين بإدرار المرة والمرطوبين بإنضاج الرطوبة، وكلما زادت عطريته وطيبه فهو أوفق، وهو منفذ في البدن يقطع البلغم ويخرج الصفراء في البول ويزلق السوداء، وأن قوي الدماغ لا يسكر بسرعة ويصفو ذهنه {cite:canon-ibn-sina-print-v1 p.237}."
  en: "Ibn Sina says wine benefits the bilious by bringing out bile and the phlegmatic by ripening moisture, the more so the more fragrant and pleasant it is, and that it carries through the body, cuts phlegm, brings out yellow bile in the urine and makes black bile slip away, while one of strong brain does not quickly grow drunk and his mind clears {cite:canon-ibn-sina-print-v1 p.237}."
  es: "Ibn Sina dice que el vino beneficia a los biliares al facilitar la producción de bilis y a los flemáticos al aumentar la humedad, sobre todo cuanto más fragante y agradable sea, y que se distribuye por el cuerpo, disuelve la flema, elimina la bilis amarilla en la orina y hace que la bilis negra se disipe, mientras que una persona de mente fuerte no se emborracha rápidamente y su mente se aclara {cite:canon-ibn-sina-print-v1 p.237}."
  fr: "Ibn Sina dit que le vin est bénéfique aux bilieux en faisant sortir la bile et aux flegmatiques en mûrissant l'humidité, d'autant plus qu'il est parfumé et agréable, et qu'il circule dans le corps, coupe le flegme, fait sortir la bile jaune dans l'urine et fait glisser la bile noire, tandis qu'une personne à l'esprit vif ne s'enivre pas rapidement et son esprit s'éclaircit {cite:canon-ibn-sina-print-v1 p.237}."
  ur: "ابن سینا کہتے ہیں کہ شراب صفرا کو صفرا نکالتی ہے اور بلغمی کو نمی پک کر اتنی ہی زیادہ خوشبودار اور خوشگوار ہوتی ہے، اور یہ کہ یہ جسم میں گزرتی ہے، بلغم کو کاٹتی ہے، پیشاب میں زرد پت نکالتی ہے اور سیاہ پت کو دور کرتی ہے، جب کہ نشے میں دھت آدمی کا دماغ جلدی صاف نہیں ہوتا اور اس کا دماغ جلد صاف نہیں ہوتا۔ {حوالہ:کینن ابن سینا پرنٹ v1 صفحہ 237}۔"
  tr: "İbn Sina, içeceğin acı idrardan geçmiş olanlara ve nemin olgunlaşmasıyla nemli olanlara fayda sağladığını belirtir. Ne kadar aromatik ve hoşsa, o kadar faydalıdır. Vücuda nüfuz eder, balgamı keser, idrarda safra salgılar ve siyah mukusu yağlar. Ayrıca güçlü bir beynin hızla sarhoş olmadığını ve zihnini temizlediğini belirtmiştir {cite:canon-ibn-sina-print-v1 s.237}."
  id: "Ibn Sina menyebutkan bahwa minuman ini bermanfaat bagi mereka yang telah melewati urin pahit dan mereka yang lembap melalui pematangan kelembapan. Semakin aromatik dan menyenangkan, semakin bermanfaat rasanya. Minuman ini menembus tubuh, memotong dahak, mengeluarkan empedu dalam urin, dan melumasi lendir hitam. Ia juga mencatat bahwa otak yang kuat tidak cepat mabuk dan membersihkan pikirannya {cite:canon-ibn-sina-print-v1 hlm.237}."
