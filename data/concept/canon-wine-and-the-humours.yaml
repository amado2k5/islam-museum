summary:
  ar: "يذكر ابن سينا أن الشراب ينفع الممرورين بإدرار المرة والمرطوبين بإنضاج الرطوبة، وكلما زادت عطريته وطيبه فهو أوفق، وهو منفذ في البدن يقطع البلغم ويخرج الصفراء في البول ويزلق السوداء، وأن قوي الدماغ لا يسكر بسرعة ويصفو ذهنه {cite:canon-ibn-sina-print-v1 p.237}."
  en: "Ibn Sina says wine benefits the bilious by bringing out bile and the phlegmatic by ripening moisture, the more so the more fragrant and pleasant it is, and that it carries through the body, cuts phlegm, brings out yellow bile in the urine and makes black bile slip away, while one of strong brain does not quickly grow drunk and his mind clears {cite:canon-ibn-sina-print-v1 p.237}."
