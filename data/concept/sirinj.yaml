label:
  ar: "سرنج"
  en: "Sirinj (the mineral called sirinj)"
  ur: "سرنج"
  es: "Sirinj (el mineral llamado sirinj)"
  fr: "Sirinj (le minéral appelé sirinj)"
  tr: "şırınga"
  id: "jarum suntik"
summary:
  ar: "السرنج في الكتاب قريب القوة من الساذنج بل أقوى منه، بارد يابس، قابض فيه من الإسفيداج المبرد لكنه ألطف كثيراً، يمنع النزوف، ويوضع بقيروطي على حرق النار، ويمنع نزف الدم بقوة {cite:canon-ibn-sina-print-v1 p.593}."
  en: "Sirinj is in the book close in power to sadhinj and stronger, cold and dry, astringent with something of the cooled white lead but far subtler; it checks hemorrhages, is laid with a cerate on a burn from fire, and stops the flow of blood strongly {cite:canon-ibn-sina-print-v1 p.593}."
  ur: "سرنج کتاب میں قوت میں ساذنج کے قریب بلکہ اس سے زیادہ قوی ہے، ٹھنڈا خشک، قابض، اس میں ٹھنڈے کیے ہوئے اسفیداج کا کچھ اثر ہے مگر بہت زیادہ لطیف؛ بہنے والے خون کو روکتا ہے، موم روغن کے ساتھ آگ کے جلنے پر رکھا جاتا ہے، اور خون کا بہنا بڑی قوت سے روکتا ہے {cite:canon-ibn-sina-print-v1 p.593}۔"
  es: "En el libro, Sirinj tiene un poder similar al de sadhinj, pero es más fuerte, frío y seco, astringente con algo del blanco de plomo enfriado, pero mucho más sutil; detiene las hemorragias, se aplica con cerato sobre una quemadura por fuego y detiene el flujo de sangre con fuerza {cite:canon-ibn-sina-print-v1 p.593}."
  fr: "Le sirinj est décrit dans le livre comme proche en puissance du sadhinj et plus fort, froid et sec, astringent avec quelque chose de blanc de plomb refroidi mais beaucoup plus subtil; il arrête les hémorragies, est appliqué avec un cérate sur une brûlure par le feu et arrête fortement le flux sanguin {cite:canon-ibn-sina-print-v1 p.593}."
  tr: "Kitaptaki şırınga, eyerin gücüne yakındır, soğutulan, kuru, soğutulan savidadan daha sıkı ama çok daha naziktir. Kanamayı önler, ateşe keroti ile konur ve kan dökülmesini kuvvetle engeller {cite:canon-ibn-sina-print-v1 s.593}."
  id: "Suntikan dalam buku ini hampir kuat dengan pelana, bahkan lebih kuat, dingin, kering, lebih ketat daripada savida yang sudah dingin, tetapi jauh lebih lembut. Suntikan ini mencegah pendarahan, diletakkan dengan keroti di atas api, dan mencegah pertumpahan darah dengan kekuatan {cite:canon-ibn-sina-print-v1 hlm.593}."
