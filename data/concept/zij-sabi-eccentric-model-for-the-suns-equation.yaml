label: { ar: "الفلك الخارج المركز في تعديل الشمس", en: "The eccentric model of the Sun's equation", ur: "سورج کے تعدیل میں خارج المرکز فلک کا نمونہ", es: "El modelo excéntrico de la ecuación del Sol", fr: "Le modèle excentrique de l'équation du Soleil" }
summary:
  ar: "ثم يبين البتاني الجهة الثانية على الفلك الخارج المركز، فيرسم دائرة فلك البروج وعليها الدائرة الخارجة المركز، وقطر يمر بالمركزين تقع عليه نقطة البعد الأبعد ونقطة البعد الأقرب، ويحسب الاختلاف في الحالتين ذاتهما، ثلاثين ومائة وخمسين جزءاً من البعد الأبعد، وفي الحالة التي تقرأ أرقامها بوضوح، وهي الثانية، ينتهي إلى النتيجة نفسها {cite:zij-sabi-nallino-byblion pp.74-76}."
  en: "Al-Battani then explains the second manner on the eccentric sphere: he draws the circle of the zodiac and upon it the eccentric circle, with a diameter through both centres on which lie the points of greatest and least distance, and reckons the variation in the same two cases, thirty and a hundred and fifty parts from the apogee, and in the case whose figures read clearly, the second, arrives at the same result {cite:zij-sabi-nallino-byblion pp.74-76}."
  ur: "پھر البتانی دوسرا طریقہ خارج المرکز فلک پر بیان کرتے ہیں: فلک البروج کا دائرہ کھینچتے ہیں اور اس پر خارج المرکز دائرہ، اور ایک قطر جو دونوں مرکزوں سے گزرتا ہے جس پر سب سے دور اور سب سے قریب کے نقطے ہیں، اور انہی دو حالتوں میں، اوج سے تیس اور ایک سو پچاس اجزا پر، اختلاف کا حساب کرتے ہیں، اور جس حالت کے اعداد صاف پڑھے جاتے ہیں، یعنی دوسری، اس میں اسی نتیجے پر پہنچتے ہیں {cite:zij-sabi-nallino-byblion pp.74-76}۔"
  es: "Al-Battani explica entonces el segundo método en la esfera excéntrica: dibuja el círculo del zodíaco y sobre él el círculo excéntrico, con un diámetro que pasa por ambos centros en los que se encuentran los puntos de mayor y menor distancia, y calcula la variación en los mismos dos casos, treinta y ciento cincuenta partes desde el apogeo, y en el caso cuyas cifras se leen claramente, el segundo, llega al mismo resultado {cite:zij-sabi-nallino-byblion pp.74-76}."
  fr: "Al-Battani explique ensuite la seconde méthode sur la sphère excentrique: il trace le cercle du zodiaque et sur celui-ci le cercle excentrique, avec un diamètre passant par les deux centres sur lesquels se trouvent les points de plus grande et de plus petite distance, et calcule la variation dans les deux mêmes cas, trente et cent cinquante parties de l'apogée, et dans le cas dont les chiffres se lisent clairement, le second, arrive au même résultat {cite:zij-sabi-nallino-byblion pp.74-76}."
