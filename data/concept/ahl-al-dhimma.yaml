id: concept/ahl-al-dhimma
class: concept
tags: ["umam-browser", "um-mafahim"]
kind: legal
sensitivity: contested
label: { ar: "أهل الذمة", en: "Ahl al-Dhimma (the protected non-Muslim subjects of an Islamic state, their covenant, rights, duties and limits)", fr: "Ahl al-Dhimma (les sujets non musulmans protégés d’un État islamique, leur alliance, leurs droits, leurs devoirs et leurs limites)", es: "Ahl al-Dhimma (los súbditos no musulmanes protegidos de un estado islámico, su pacto, derechos, deberes y límites)", ur: "اہل الذمہ ⁦(اسلامی ریاست کے محفوظ غیر مسلم رعایا، ان کے عہد، حقوق، فرائض اور حدود)⁩", tr: "zimmiler", id: "dhimmis" }
summary:
  ar: "الذمة في اللغة الأمان والعهد، والذمي المعاهد، وهو في الاصطلاح من أقر في دار الإسلام على كفره بعهد من الإمام يؤمنه على نفسه وماله نظير التزامه الجزية ونفوذ أحكام الإسلام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3616}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3617} وتحصل الذمة لأهل الكتاب ومن في حكمهم بالعقد أو القرائن أو التبعية أو الغلبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3617}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3618}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3621}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3622}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3623} وقد اتفق الفقهاء على جواز عقد الذمة لأهل الكتاب والمجوس، واختلفوا فيما عداهم، فأجازه الحنفية والمالكية لجميع الكفار إلا عبدة الأوثان عند الحنفية، ومنعه الشافعية والحنابلة في المشهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3618}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3619} ويكون العقد مؤبدا، ويلتزم الذمي أحكام الإسلام في المعاملات، ويشترط في الرجل قبول الجزية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3619} والأصل أن لأهل الذمة ما لنا وعليهم ما علينا، لكنها غير مطبقة على إطلاقها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3623}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3624} ولهم حماية الدولة والإقامة الآمنة، ويمنعون من الإقامة الدائمة في مكة والمدينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3624} ولهم اختيار العمل والمعاملات المالية مع استثناءات، كبيع الخمر والخنزير، واستئجار المسلم للخدمة الشخصية، وشهادتهم على المسلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3627}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3628}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3629} وعليهم الجزية والخراج والعشور، ويمنعون من إظهار شعائر تخالف الإسلام في الأمصار، ويكون عليهم التمييز في الزي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3630}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3631} وتنتقض ذمتهم باللحوق بدار الحرب والامتناع عن الجزية عند الجمهور، وبأسباب أخرى عند بعض المذاهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3634}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3635}"
  en: "Ahl al-dhimma are non-Muslim subjects who remain in the land of Islam in their unbelief under a covenant with the imam, granting them safety for life and property in return for the poll tax and their submission to the rules of Islam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3616}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3617} The dhimma is acquired by contract, by circumstance, by following a parent, by being found as a foundling, or by conquest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3617}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3618}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3621}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3622}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3623} The jurists agree that a covenant may be made with the People of the Book and the Magians; the Hanafis and Malikis allow it for all unbelievers except idolaters, while the Shafi'is and Hanbalis in the sounder view do not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3618}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3619} The covenant is perpetual, the protected person accepts the rules of Islam in dealings, and the men pay the poll tax. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3619} The general rule is that they have what we have and owe what we owe, though it is not applied without exception. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3623}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3624} They have the protection of the state and safe residence, but may not settle permanently in Mecca and Medina. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3624} They may choose their work and deal in property, with exceptions such as wine and pork, and a Muslim may not hire himself out for personal service; their testimony is not accepted against Muslims. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3627}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3628}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3629} They owe the poll tax, the land tax and the tithe on trade, and may not show in Muslim cities what Islam forbids; they are distinguished in dress. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3630}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3631} The covenant is broken by joining the land of war and by refusing the poll tax in the view of the majority, and by other acts in the views of the schools. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3634}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3635}"
  fr: "Les ahl al-dhimma sont des sujets non musulmans qui demeurent en terre d’islam dans leur non-croyance sous une alliance avec l’imam, leur garantissant la sécurité de leur vie et de leurs biens en échange de la capitation et de leur soumission aux règles de l’islam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3616}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3617} La dhimma s’acquiert par contrat, par les circonstances, par rattachement à un parent, en étant recueilli comme enfant trouvé ou par conquête. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3617}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3618}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3621}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3622}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3623} Les juristes s’accordent sur le fait qu’une alliance peut être conclue avec les Gens du Livre et les mages ; les hanafites et les malikites l’autorisent pour tous les non-croyants sauf les idolâtres, tandis que les chaféites et les hanbalites, selon l’opinion jugée la plus solide, ne l’autorisent pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3618}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3619} L’alliance est perpétuelle, la personne protégée accepte les règles de l’islam dans les transactions et les hommes paient la capitation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3619} La règle générale veut qu’ils aient ce que nous avons et doivent ce que nous devons, bien qu’elle ne soit pas appliquée sans exception. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3623}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3624} Ils bénéficient de la protection de l’État et d’une résidence sûre, mais ne peuvent s’installer de façon permanente à La Mecque et à Médine. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3624} Ils peuvent choisir leur travail et disposer de leurs biens, avec des exceptions telles que le vin et le porc, et un musulman ne peut louer ses services pour un service personnel ; leur témoignage n’est pas accepté contre les musulmans. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3627}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3628}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3629} Ils doivent la capitation, l’impôt foncier et la dîme sur le commerce, et ne peuvent afficher dans les villes musulmanes ce que l’islam interdit ; ils sont distingués par la tenue. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3630}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3631} L’alliance est rompue par le fait de rejoindre la terre de guerre et par le refus de payer la capitation selon la majorité, ainsi que par d’autres actes selon les écoles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3634}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3635}"
  es: "Ahl al-dhimma son súbditos no musulmanes que permanecen en la tierra del Islam en su incredulidad bajo un pacto con el imán, que les garantiza seguridad para la vida y la propiedad a cambio del impuesto de capitación y su sumisión a las reglas del Islam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3616}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3617} La descendencia se adquiere por contrato, por circunstancia, por seguir a un padre, por ser encontrado como expósito o por conquista. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3617}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3618}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3621}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3622}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3623} Los juristas coinciden en que se puede hacer un pacto con la Gente del Libro y los Magos; los Hanafíes y los Malikis lo permiten para todos los incrédulos excepto los idólatras, mientras que los Shafi'is y los Hanbalis, en la opinión más sólida, no lo permiten. El pacto es perpetuo, la persona protegida acepta las reglas del Islam en sus tratos y los hombres pagan el impuesto de capitación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3619} La regla general es que tienen lo que nosotros tenemos y deben lo que nosotros debemos, aunque no se aplica sin excepción. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3623}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3624} Tienen la protección del estado y residencia segura, pero no pueden establecerse permanentemente en La Meca y Medina. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3624} Pueden elegir su trabajo y comerciar con propiedades, con excepciones como el vino y la carne de cerdo, y un musulmán no puede alquilarse para servicios personales; su testimonio no es aceptado contra los musulmanes. Deben el impuesto de capitación, el impuesto sobre la tierra y el diezmo sobre el comercio, y no pueden mostrar en las ciudades musulmanas lo que el Islam prohíbe; se distinguen por su vestimenta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3630}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3631} El pacto se rompe al unirse a la tierra de guerra y al negarse a pagar el impuesto per cápita según la opinión de la mayoría, y por otros actos según la opinión de las escuelas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3634}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3635}"
  ur: "اہل الذھمہ غیر مسلم رعایا ہیں جو امام کے ساتھ ایک عہد کے تحت اپنے کفر کی حالت میں اسلام کی سرزمین میں رہتے ہیں، انہیں انتخابات کے ٹیکس کے بدلے میں جان و مال کی حفاظت اور اسلام کے احکام کو تسلیم کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3616}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3617} مسئلہ معاہدہ کے ذریعہ، حالات کے ذریعہ، والدین کی پیروی کرکے، بانی کے طور پر پایا جانے سے، یا فتح کے ذریعہ حاصل کیا گیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ3617}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ3618}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ3621}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ صفحہ 3622 {حوالہ:فقہ الموسوعۃ کویتیہ نور-v3 ص3623} فقہاء اس بات پر متفق ہیں کہ اہل کتاب اور مجوسیوں سے عہد کیا جا سکتا ہے۔ حنفیہ اور مالکیہ مشرکین کے علاوہ تمام کافروں کے لیے اس کی اجازت دیتے ہیں، جب کہ شافعی اور حنبلی درست نظریہ میں ایسا نہیں کرتے۔ عہد دائمی ہے، تحفظ یافتہ شخص معاملات میں اسلام کے احکام کو قبول کرتا ہے، اور مرد پول ٹیکس ادا کرتے ہیں۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 3619} عام اصول یہ ہے کہ جو کچھ ہمارے پاس ہے وہ ان کے پاس ہے اور جو ہم پر واجب ہے وہ ان کے پاس ہے، حالانکہ اس کا اطلاق بلا استثناء نہیں ہوتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3623}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3624} انہیں ریاست کا تحفظ اور محفوظ رہائش حاصل ہے، لیکن وہ مکہ اور مدینہ میں مستقل طور پر آباد نہیں ہو سکتے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3624} وہ اپنے کام کا انتخاب کر سکتے ہیں اور جائیداد کا سودا کر سکتے ہیں، مستثنیات جیسے شراب اور سور کا گوشت، اور کوئی مسلمان ذاتی خدمت کے لیے خود کو ملازمت پر نہیں رکھ سکتا۔ مسلمانوں کے خلاف ان کی گواہی قبول نہیں کی جاتی۔ ان پر پول ٹیکس، لینڈ ٹیکس اور تجارت پر دسواں حصہ واجب الادا ہے، اور ہو سکتا ہے کہ مسلم شہروں میں یہ ظاہر نہ کریں کہ اسلام میں کیا ممانعت ہے۔ وہ لباس میں ممتاز ہیں. {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3630}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3631} جنگ کی سرزمین میں شامل ہو کر اور اکثریت کے خیال میں رائے شماری کے ٹیکس سے انکار کر کے، اور دوسرے مکاتب فکر کے خیال میں یہ عہد ٹوٹ جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3634}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3635}"
  tr: "Dilde, 'zimma' güvenlik ve antlaşma anlamına gelir, 'zimmi ise antlaşma anlamına gelir.' Terminolojide, imamdan alınan bir ahitle inançsızlığını kabul eden kişi, kendisini ve servetini garanti eden bir ahitle kendisini ve servetini cizye'ye bağlılığı ve İslami hükümlerin uygulanması karşılığında kabul eder. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.3616} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3617} Sorumluluk, Kitap Ahli ve eşdeğer statüdekiler tarafından sözleşme, göstergeler, bağımlılık veya üstünlük yoluyla üstlenir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3617} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3618} {atı:fiqh-mawsua-kuveytiyya-noor-v3 s.3621}} {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.3622}} {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.3623} Hukukçular, Kitap Ahli ve Magiler için zimma antlaşmasının yapılmasının caizliğinde hemfikirdir, ancak aksi konuda farklı görüştedirler. Hanefiler ve Malikiler, Hanefilere göre putperestler hariç tüm gayrimüslimlere izin verirken, Şafiiler ve Hanbaliler bilinen görüşe göre yasaklar. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.3618} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3619} Sözleşme ömür boyuncadır, zimmi işlemlerde İslami kurallara uymalı ve adam cizye kabul etmelidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3619} Varsayılan durum, zimmi halkının bizim sahip olduğumuz ve onların da bizim borçlu olduğumuz şeylere sahip olduğudur, ancak bu onlar için kesinlikle geçerli değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3623} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3624} Devlet koruması ve güvenli ikametgahları vardır, Mekke ve Medine'de kalıcı ikamet etmeleri yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3624} Alkol ve domuz eti satmak, kişisel hizmet için bir Müslüman tutmak ve Müslümanlara tanıklık etmek gibi istisnalar dışında çalışma ve finansal işlemler yapma seçeneğine sahiptirler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3627} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3628} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3629} Cizya, kharaj ve ondalık ödemeleri zorunludur, eyaletlerde İslam'a aykırı ritüelleri sergilemeleri yasaktır ve kıyafetleriyle kendilerini ayırt etmek zorundadırlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3630} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3631} Vicdanları, halkın ve bazı düşünce okullarına göre başka nedenlerle savaş alanına katılıp cizya ödemeyerek geçersiz kılınır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3634}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3635}"
  id: "Dalam bahasa, 'zimma' berarti keamanan dan persetujuan, sedangkan 'dhimmi' berarti persetujuan.' Dalam istilah tertentu, seseorang yang menerima ketidakpercayaannya dengan perjanjian yang diambil dari imam menerima dirinya sendiri dan kekayaannya dengan perjanjian yang menjamin diri dan kekayaannya sebagai imbalan atas komitmen mereka kepada jizya dan penerapan aturan Islam. {sitasi:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3616} {sitasi:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3617} Tanggung jawab diambil oleh Umat Kitab dan mereka yang memiliki status setara melalui kontrak, indikator, ketergantungan, atau keunggulan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3617} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3618} {at: fiqh-mawsua-kuwaytiiyya-noor-v3 hlm.3621}} {at: fiqh-mawsua-kuwaytiiyya-noor-v3 hlm.3622}} {at: fiqh-mawsua-kuwaytiiyya-noor-v3 hlm.3623} Para ahli hukum sepakat tentang diperbolehkannya membuat perjanjian pengungkapan bagi umat Kitab dan para Majus, tetapi mereka memiliki pandangan berbeda yang sebaliknya. Menurut Hanafi dan Malikit, semua non-Muslim kecuali penyembah berhala diperbolehkan, sementara Shafi'i dan Hanbali diketahui melarangnya. {sitasi: fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3618} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3619} Kontrak itu untuk seumur hidup; dhimmi harus mengikuti aturan Islam dalam transaksi dan orang harus menerima jizya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3619} Asumsinya adalah bahwa orang dhimmi memiliki apa yang kita miliki dan apa yang mereka hutangkan kepada kita, tetapi ini jelas tidak benar bagi mereka. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3623} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.3624} Mereka memiliki perlindungan negara dan tempat tinggal yang aman, dan tempat tinggal tetap di Mekah dan Madinah dilarang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3624} Kecuali untuk pengecualian seperti menjual alkohol dan daging babi, memelihara Muslim untuk pelayanan pribadi, dan menyaksikan umat Muslim, mereka memiliki pilihan untuk bekerja dan melakukan transaksi keuangan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3627} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3628} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.3629} Pembayaran jizya, kharaj, dan persepuluhan wajib, mereka dilarang melakukan ritual Islam di negara bagian, dan mereka harus membedakan diri melalui pakaian mereka. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3630} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3631} Hati nurani menjadi tidak valid karena ikut serta di medan perang dan tidak membayar jizya untuk alasan lain menurut publik dan beberapa aliran pemikiran. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3634}} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.3635}"
