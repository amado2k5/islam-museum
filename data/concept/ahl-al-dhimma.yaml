id: concept/ahl-al-dhimma
class: concept
kind: legal
label: { ar: "أهل الذمة", en: "Ahl al-Dhimma (the protected non-Muslim subjects of an Islamic state, their covenant, rights, duties and limits)" }
summary:
  ar: "الذمة في اللغة الأمان والعهد، والذمي المعاهد، وهو في الاصطلاح من أقر في دار الإسلام على كفره بعهد من الإمام يؤمنه على نفسه وماله نظير التزامه الجزية ونفوذ أحكام الإسلام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3616}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3617} وتحصل الذمة لأهل الكتاب ومن في حكمهم بالعقد أو القرائن أو التبعية أو الغلبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3617}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3618}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3621}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3622}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3623} وقد اتفق الفقهاء على جواز عقد الذمة لأهل الكتاب والمجوس، واختلفوا فيما عداهم، فأجازه الحنفية والمالكية لجميع الكفار إلا عبدة الأوثان عند الحنفية، ومنعه الشافعية والحنابلة في المشهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3618}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3619} ويكون العقد مؤبدا، ويلتزم الذمي أحكام الإسلام في المعاملات، ويشترط في الرجل قبول الجزية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3619} والأصل أن لأهل الذمة ما لنا وعليهم ما علينا، لكنها غير مطبقة على إطلاقها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3623}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3624} ولهم حماية الدولة والإقامة الآمنة، ويمنعون من الإقامة الدائمة في مكة والمدينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3624} ولهم اختيار العمل والمعاملات المالية مع استثناءات، كبيع الخمر والخنزير، واستئجار المسلم للخدمة الشخصية، وشهادتهم على المسلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3627}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3628}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3629} وعليهم الجزية والخراج والعشور، ويمنعون من إظهار شعائر تخالف الإسلام في الأمصار، ويكون عليهم التمييز في الزي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3630}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3631} وتنتقض ذمتهم باللحوق بدار الحرب والامتناع عن الجزية عند الجمهور، وبأسباب أخرى عند بعض المذاهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3634}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3635}"
  en: "Ahl al-dhimma are non-Muslim subjects who remain in the land of Islam in their unbelief under a covenant with the imam, granting them safety for life and property in return for the poll tax and their submission to the rules of Islam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3616}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3617} The dhimma is acquired by contract, by circumstance, by following a parent, by being found as a foundling, or by conquest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3617}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3618}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3621}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3622}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3623} The jurists agree that a covenant may be made with the People of the Book and the Magians; the Hanafis and Malikis allow it for all unbelievers except idolaters, while the Shafi'is and Hanbalis in the sounder view do not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3618}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3619} The covenant is perpetual, the protected person accepts the rules of Islam in dealings, and the men pay the poll tax. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3619} The general rule is that they have what we have and owe what we owe, though it is not applied without exception. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3623}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3624} They have the protection of the state and safe residence, but may not settle permanently in Mecca and Medina. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3624} They may choose their work and deal in property, with exceptions such as wine and pork, and a Muslim may not hire himself out for personal service; their testimony is not accepted against Muslims. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3627}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3628}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3629} They owe the poll tax, the land tax and the tithe on trade, and may not show in Muslim cities what Islam forbids; they are distinguished in dress. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3630}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3631} The covenant is broken by joining the land of war and by refusing the poll tax in the view of the majority, and by other acts in the views of the schools. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3634}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3635}"
