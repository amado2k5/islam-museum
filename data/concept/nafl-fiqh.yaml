label: { ar: "النَّفْل ⁦(العبادات التطوعية)⁩", en: "Nafl (voluntary worship in fiqh)", ur: "نفل ⁦(نفلی عبادات)⁩", es: "Nafl (adoración voluntaria en fiqh)", fr: "Nafl (culte volontaire en fiqh)", tr: "Nafl (gönüllü ibadet eylemleri)", id: "Nafl (tindakan ibadah sukarela)" }
summary:
  ar: "النفل في اللغة الزيادة، وعند الحنفية ما ليس بفرض ولا واجب، وعند الشافعية ما عدا الفرائض ويعبر عنه بالسنة والمندوب والتطوع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15930} والفرض أفضل من النفل باتفاق، وقد يكمل النفل ما نقص من الفرض، وللفقهاء صور استثنوا فيها المندوب من أصل تفضيل الفرض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15933} ومن شرع في نفل الحج والعمرة لزمه إتمامه، وفي الصلاة والصوم خلاف بين الحنفية والمالكية من جهة ووجوب الإتمام، والشافعية والحنابلة من جهة عدمه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15934} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15935} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15936} وتفضيل طول القيام أو كثرة الركوع في النافلة فيه خلاف، والجمهور على أن النوافل مثنى مثنى، والحنفية يجيزون الأربع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15940} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15941} ويفصل بين الفريضة والنافلة بكلام أو قيام أو تحول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15942} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15943} وصدقة التطوع مستحبة في كل وقت، وصيام النافلة وحج النفل من أفضل الأعمال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15944} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15945} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15946}"
  en: "Nafl, in the lexicon, is an addition. The Hanafis define it as what is neither obligatory nor required; the Shafi'is as everything beyond the obligations, also called sunna, recommended or voluntary. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15930} The obligation is better than the voluntary act by agreement, though voluntary works may complete what is lacking in obligations, and the jurists list cases where a recommended act outranks an obligatory one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15933} Whoever starts a voluntary pilgrimage or lesser pilgrimage must complete it. For voluntary prayer and fasting the Hanafis and Malikis require completion, while the Shafi'is and Hanbalis allow one to break them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15934} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15935} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15936} Voluntary prayers are generally offered in twos, the Hanafis allowing fours; the length of standing and the number of prostrations are compared. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15940} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15941} One separates a voluntary prayer from the obligatory by speech, standing or moving. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15942} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15943} Voluntary almsgiving is recommended at all times, and voluntary fasting and voluntary pilgrimage are among the best works. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15944} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15945} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15946}"
  ur: "نفل لغت میں زیادتی کو کہتے ہیں۔ حنفیہ کے نزدیک جو فرض اور واجب نہ ہو، اور شافعیہ کے نزدیک فرائض کے سوا سب کچھ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15930} فرض نفل سے افضل ہے، مگر نفل فرض کی کمی پوری کر سکتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15931} حج نفل اور عمرہ شروع کر لیا تو مکمل کرنا لازم ہے، نماز اور روزے میں حنفیہ و مالکیہ اتمام کو لازم کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15934} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15935} نفلی نماز عموماً دو دو رکعت ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15939} فرض اور نفل کے درمیان کلام یا حرکت سے فصل مستحب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15942} صدقۂ نفل ہر وقت مستحب ہے، اور نفلی روزہ اور حج نفل بہترین اعمال میں سے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15944} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15946}"
  es: "Nafl, en el léxico, es una adición. Los hanafíes lo definen como aquello que no es ni obligatorio ni requerido; los shafiíes como todo lo que va más allá de las obligaciones, también llamado sunna, recomendado o voluntario. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15930} La obligación es mejor que el acto voluntario por acuerdo, aunque las obras voluntarias pueden suplir lo que falta en las obligaciones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15933} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15933} Quien inicie una peregrinación voluntaria o una peregrinación menor debe completarla. Para la oración voluntaria y el ayuno, los Hanafis y Malikis requieren completarlos, mientras que los Shafi'is y Hanbalis permiten romperlos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15934} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15936} Las oraciones voluntarias generalmente se ofrecen de dos en dos, los hanafis permiten cuatro; Se compara la duración de la permanencia en pie y el número de postraciones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15941} Se separa una oración voluntaria de la obligatoria hablando, de pie o moviéndose. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15942} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15943} Se recomienda la limosna voluntaria en todo momento, y el ayuno voluntario y la peregrinación voluntaria se encuentran entre las mejores obras. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15944} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15945} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15946}"
  fr: "Nafl, dans le lexique, est un ajout. Les Hanafis le définissent comme ce qui n'est ni obligatoire ni requis; les Shafi'is comme tout ce qui dépasse les obligations, aussi appelé sunna, recommandé ou volontaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15930} L'obligation vaut mieux que l'acte volontaire par accord, bien que les travaux volontaires puissent compléter ce qui manque aux obligations. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15933} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15933} Celui qui commence un pèlerinage volontaire ou un pèlerinage moindre doit le terminer. Pour la prière surérogatoire et le jeûne, les hanafites et les malikites exigent leur accomplissement, tandis que les chaféites et les hanbalites autorisent leur interruption. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15934} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15936} Les prières surérogatoires sont généralement accomplies par deux, les hanafites autorisant par quatre; la durée de la station debout et le nombre de prosternations sont comparés. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15941} On distingue une prière surérogatoire d'une prière obligatoire par la parole, en restant debout ou en se déplaçant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15942} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15943} L'aumône volontaire est recommandée à tout moment, et le jeûne volontaire et le pèlerinage volontaire sont parmi les meilleures œuvres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15944} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15945} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15946}"
  tr: "Dilde gönüllü namaz bir eklemedir; Hanefilere göre zorunlu veya zorunlu değildir; Şafiilere göre, Sünnet, tavsiye ve gönüllü namazla ifade edilen zorunlu namaz dışındaki her şeyi ifade eder. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.15929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15930} ve gönüllü bir zorunluluk, uzlaşmayla gönüllü namazdan daha iyidir ve gönüllü namazlar zorunlu namazlarda eksik olanı tamamlayabilir. Hukukçular, önerilen kişiyi zorunlu namazları tercih etme ilkesinden dışladıkları durumlar da vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15933} Gönüllü Hac ve Umre buyuran kişi bunu tamamlamalıdır. Namaz ve oruç konusunda bir yanda Hanafi ile Maliki arasında anlaşmazlık vardır ve bunu tamamlama yükümlülüğü vardır; Şafi'ler ve Hanbaliler ise bunun yapılmaması gerektiğini tartışır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15934} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15935} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15936} Gönüllü namazlarda uzun süreli veya sık eğilme tercihi konusunda görüş ayrılığı vardır. Çoğunluk gönüllü namazların çift olarak kabul edildiğini, Hanafiler ise dört kez kabul ettiğini kabul eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15939}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15940} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15941} zorunlu ve gönüllü eylemleri konuşma, ayakta durma veya dönüşerek ayırır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15942} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15943} Gönüllü hayırseverlik her zaman tavsiye edilir ve oruç, gönüllü namaz kılmak ve gönüllü hac yapmak en iyi eylemler arasındadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15944} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15945} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15946}"
  id: "Dalam bahasa tersebut, doa sukarela adalah tambahan; menurut Hanafi, doa ini tidak wajib atau wajib; menurut Shafi'i, doa ini merujuk pada apa pun selain doa wajib, yang diungkapkan oleh Sunnah, rekomendasi, dan doa sukarela. {cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 hlm.15929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15930} dan kewajiban sukarela lebih baik daripada doa sukarela berdasarkan konsensus, dan doa sukarela dapat melengkapi apa yang kurang dari doa wajib. Para ahli hukum memiliki kasus di mana mereka mengecualikan orang yang direkomendasikan dari prinsip preferensi doa wajib. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15933} Siapa pun yang mewajibkan Haji dan Umrah sukarela harus menyelesaikannya. Mengenai salat dan puasa, terdapat perbedaan antara Hanisi dan Malik di satu sisi, serta kewajiban untuk menyelesaikannya, sementara para Shafi'i dan Hanbalis mempertimbangkan apakah seharusnya tidak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15934} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15935} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15936} Ada perbedaan pendapat mengenai preferensi untuk membungkuk lama atau sering dalam salat sukarela. Mayoritas setuju bahwa shalat sukarela dianggap dua kali lipat, sedangkan Hanafi mengizinkan empat doa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15940} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15941} memisahkan tindakan wajib dan sukarela dengan berbicara, berdiri, atau berubah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15942} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15943} Amal sukarela selalu dianjurkan, dan berpuasa doa sukarela serta melakukan ziarah sukarela adalah di antara perbuatan terbaik. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15944} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15945} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15946}"
