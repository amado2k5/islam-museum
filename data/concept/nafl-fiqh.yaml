label: { ar: "النَّفْل (العبادات التطوعية)", en: "Nafl (voluntary worship in fiqh)", ur: "نفل (نفلی عبادات)" }
summary:
  ar: "النفل في اللغة الزيادة، وعند الحنفية ما ليس بفرض ولا واجب، وعند الشافعية ما عدا الفرائض ويعبر عنه بالسنة والمندوب والتطوع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15930} والفرض أفضل من النفل باتفاق، وقد يكمل النفل ما نقص من الفرض، وللفقهاء صور استثنوا فيها المندوب من أصل تفضيل الفرض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15933} ومن شرع في نفل الحج والعمرة لزمه إتمامه، وفي الصلاة والصوم خلاف بين الحنفية والمالكية من جهة ووجوب الإتمام، والشافعية والحنابلة من جهة عدمه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15934} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15935} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15936} وتفضيل طول القيام أو كثرة الركوع في النافلة فيه خلاف، والجمهور على أن النوافل مثنى مثنى، والحنفية يجيزون الأربع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15940} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15941} ويفصل بين الفريضة والنافلة بكلام أو قيام أو تحول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15942} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15943} وصدقة التطوع مستحبة في كل وقت، وصيام النافلة وحج النفل من أفضل الأعمال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15944} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15945} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15946}"
  en: "Nafl, in the lexicon, is an addition. The Hanafis define it as what is neither obligatory nor required; the Shafi'is as everything beyond the obligations, also called sunna, recommended or voluntary. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15930} The obligation is better than the voluntary act by agreement, though voluntary works may complete what is lacking in obligations, and the jurists list cases where a recommended act outranks an obligatory one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15933} Whoever starts a voluntary pilgrimage or lesser pilgrimage must complete it. For voluntary prayer and fasting the Hanafis and Malikis require completion, while the Shafi'is and Hanbalis allow one to break them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15934} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15935} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15936} Voluntary prayers are generally offered in twos, the Hanafis allowing fours; the length of standing and the number of prostrations are compared. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15940} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15941} One separates a voluntary prayer from the obligatory by speech, standing or moving. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15942} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15943} Voluntary almsgiving is recommended at all times, and voluntary fasting and voluntary pilgrimage are among the best works. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15944} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15945} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15946}"
  ur: "نفل لغت میں زیادتی کو کہتے ہیں۔ حنفیہ کے نزدیک جو فرض اور واجب نہ ہو، اور شافعیہ کے نزدیک فرائض کے سوا سب کچھ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15930} فرض نفل سے افضل ہے، مگر نفل فرض کی کمی پوری کر سکتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15931} حج نفل اور عمرہ شروع کر لیا تو مکمل کرنا لازم ہے، نماز اور روزے میں حنفیہ و مالکیہ اتمام کو لازم کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15934} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15935} نفلی نماز عموماً دو دو رکعت ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15939} فرض اور نفل کے درمیان کلام یا حرکت سے فصل مستحب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15942} صدقۂ نفل ہر وقت مستحب ہے، اور نفلی روزہ اور حج نفل بہترین اعمال میں سے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15944} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15946}"
