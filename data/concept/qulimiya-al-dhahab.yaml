id: concept/qulimiya-al-dhahab
class: concept
kind: natural
label:
  ar: "قليميا الذهب"
  en: "Qulimiya al-dhahab (gold qulimiya, a mineral)"
  ur: "قلیمیا الذہب"
  es: "Qulimiya al-dhahab (qulimiya de oro, un mineral)"
  fr: "Qulimiya al-dhahab (qulimiya d'or, un minéral)"
summary:
  ar: "قليميا الذهب في الكتاب أفضله الذهبي العنقودي الرمادي اللون الطري، معتدل إلى يبس في الثالثة، فيه تجفيف وجلاء، يملأ الجراحات وينقي أوساخها ويأكل لحومها الزائدة ويدمل القروح الخبيثة، وينفع من بياض العين وابتداء الماء {cite:canon-ibn-sina-print-v1 pp.650-651}"
  en: "Qulimiya al-dhahab is in the book best when golden, clustered, ash-coloured and soft, moderate leaning to dryness in the third degree, with drying and clearing in it; it fills wounds, cleans their dirt, eats their proud flesh and heals malignant ulcers, and benefits whiteness of the eye and the beginning of the water {cite:canon-ibn-sina-print-v1 pp.650-651}"
  ur: "قلیمیا الذہب کتاب میں بہترین وہ ہے جو سنہری، خوشے دار، راکھ کے رنگ کا اور نرم ہو، اعتدال والا جو تیسرے درجے میں خشکی کی طرف مائل ہے، اس میں خشک کرنا اور جلا ہے؛ زخموں کو بھرتا، ان کی میل صاف کرتا، ان کا زائد گوشت کھا جاتا اور خبیث قرحوں کو بھرتا ہے، اور آنکھ کی سفیدی اور پانی اترنے کے آغاز میں نافع ہے {cite:canon-ibn-sina-print-v1 pp.650-651}۔"
  es: "En el libro, Qulimiya al-dhahab es mejor cuando es dorada, agrupada, de color ceniza y suave, con una tendencia moderada a la sequedad en el tercer grado, con propiedades secantes y aclarantes; rellena las heridas, limpia la suciedad, elimina la carne orgullosa y cura las úlceras malignas, y beneficia la blancura de los ojos y el comienzo de la menstruación {cite:canon-ibn-sina-print-v1 pp.650-651}"
  fr: "Qulimiya al-dhahab est décrite dans le livre comme étant meilleure lorsqu'elle est dorée, agglomérée, de couleur cendrée et douce, modérément sèche au troisième degré, avec des propriétés asséchantes et purifiantes; elle comble les plaies, les nettoie, absorbe leur impureté et guérit les ulcères malins, et est bénéfique pour la blancheur de l'œil et le début de l'eau {cite:canon-ibn-sina-print-v1 pp.650-651}"
