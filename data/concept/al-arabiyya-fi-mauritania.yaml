id: concept/al-arabiyya-fi-mauritania
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-world]
label:
  ar: "العربية في موريتانيا"
  en: "Arabic in Mauritania"
  ur: "موریتانیہ میں عربی"
  fr: "L'arabe en Mauritanie"
  es: "El árabe en Mauritania"
  tr: "Moritanya'da Arapça"
  id: "Bahasa Arab di Mauritania"
summary:
  ar: "مكانة العربية في موريتانيا كما تقولها دائرة المعارف البريطانية وكتاب حقائق العالم: لغة رسمية ووطنية، والحسانية لهجتها المتكلَّمة، قواعدها عربية في الأساس ومفرداتها عربية وأمازيغية معرَّبة، ويقول الكتاب إنها تختلف كثيراً عن الفصحى؛ والبولارية والسوننكية والولفية لغات وطنية، وتُذكر الفرنسية في الكتاب. وتذكر الصفحة ما لم يُقرأ. وأُضيف نص الحكم الدستوري بلغته الأصلية كما ورد في ملخص بحثي لم يتحقق المتحف منه على الصفحة."
  en: "The place of Arabic in Mauritania as the Encyclopaedia Britannica and The World Factbook state it: an official and national language, with Hassaniyya as its spoken dialect, its grammar mainly Arabic and its vocabulary Arabic and Arabized Amazigh, which the Factbook says differs considerably from the standard; Pular, Soninke and Wolof are national languages, and the Factbook also lists French. The page notes what was not read. The constitutional text is added in its original wording, as supplied in a research summary that the museum did not check against the page."
  ur: "موریتانیہ میں عربی کا مقام جیسا انسائیکلوپیڈیا برٹانیکا اور ورلڈ فیکٹ بک بیان کرتی ہیں: سرکاری اور قومی زبان، جس کی بولی جانے والی شکل حسانیہ ہے، اس کے قواعد بنیادی طور پر عربی اور الفاظ عربی اور عربائے گئے امازیغی، اور فیکٹ بک کے مطابق یہ فصیح سے بہت مختلف ہے؛ پولار، سوننکے اور ولوف قومی زبانیں ہیں، اور فیکٹ بک فرانسیسی کا بھی نام لیتی ہے۔ صفحہ بتاتا ہے کہ کیا نہیں پڑھا گیا۔ آئینی حکم کی عبارت اصل زبان میں شامل کی گئی ہے، جیسی ایک تحقیقی خلاصے میں ملی جسے متحف نے صفحے سے نہیں جانچا۔"
  fr: "La place de l'arabe en Mauritanie selon l'Encyclopaedia Britannica et The World Factbook : langue officielle et nationale, le hassaniya en étant le dialecte parlé, à grammaire principalement arabe et vocabulaire arabe et amazigh arabisé, que le Factbook dit différer considérablement du standard ; le pular, le soninké et le wolof sont langues nationales, et le Factbook cite aussi le français. La page note ce qui n'a pas été lu. Le texte constitutionnel est ajouté dans sa langue d'origine, tel que fourni par un résumé de recherche que le musée n'a pas vérifié sur la page."
  es: "El lugar del árabe en Mauritania según la Encyclopaedia Britannica y The World Factbook: lengua oficial y nacional, con el hassaniya como dialecto hablado, de gramática principalmente árabe y vocabulario árabe y amazigh arabizado, que el Factbook dice que difiere considerablemente del estándar; el pular, el soninké y el wolof son lenguas nacionales, y el Factbook cita también el francés. La página anota lo que no se leyó. Se añade el texto constitucional en su lengua original, tal como lo entrega un resumen de investigación que el museo no verificó en la página."
  tr: "Moritanya'da Arapça'nın durumu, İngiliz Ansiklopedisi ve Facts of the World: An Official and National Language kitabında belirtildiği şekliyle, Hassaniya konuşulan lehçesi, dilbilgisi orijinal olarak Arapça ve kelime dağarcığı Arapça ve Amazigh Arapçasıdır. Kitap, Klasik Arapçadan büyük ölçüde farklı olduğunu belirtir; Bulary, Sonen ve Wolfian ulusal dillerdir ve kitapta Fransızca da geçer. Sayfada okunmayanlardan bahsedilir. Anayasa kararının metnini, müzenin sayfada doğrulamadığı bir araştırma özetinde belirtildiği üzere orijinal dilinde ekledim."
  id: "Status Bahasa Arab di Mauritania, sebagaimana dinyatakan dalam British Encyclopedia and Facts of the World: An Official and National Language, dialek Hassaniya yang digunakan awalnya adalah Arab, tata bahasanya, dan kosakamatanya adalah Arab dan Arab Amazigh. Buku ini mencatat bahwa dialek ini sangat berbeda dari bahasa Arab Klasik; Bulary, Sonen, dan Wolfian adalah bahasa nasional, dan bahasa Prancis juga disebutkan dalam buku. Bahasa yang tidak dibaca di halaman disebutkan. Saya telah menambahkan teks keputusan konstitusional dalam bahasa aslinya, sebagaimana dinyatakan dalam ringkasan penelitian yang tidak diverifikasi oleh museum di halaman tersebut."
