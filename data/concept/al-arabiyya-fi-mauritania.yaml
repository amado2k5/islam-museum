label:
  ar: "العربية في موريتانيا"
  en: "Arabic in Mauritania"
  ur: "موریتانیہ میں عربی"
  fr: "L'arabe en Mauritanie"
  es: "El árabe en Mauritania"
summary:
  ar: "مكانة العربية في موريتانيا كما تقولها دائرة المعارف البريطانية وكتاب حقائق العالم: لغة رسمية ووطنية، والحسانية لهجتها المتكلَّمة، قواعدها عربية في الأساس ومفرداتها عربية وأمازيغية معرَّبة، ويقول الكتاب إنها تختلف كثيراً عن الفصحى؛ والبولارية والسوننكية والولفية لغات وطنية، وتُذكر الفرنسية في الكتاب. وتذكر الصفحة ما لم يُقرأ."
  en: "The place of Arabic in Mauritania as the Encyclopaedia Britannica and The World Factbook state it: an official and national language, with Hassaniyya as its spoken dialect, its grammar mainly Arabic and its vocabulary Arabic and Arabized Amazigh, which the Factbook says differs considerably from the standard; Pular, Soninke and Wolof are national languages, and the Factbook also lists French. The page notes what was not read."
  ur: "موریتانیہ میں عربی کا مقام جیسا انسائیکلوپیڈیا برٹانیکا اور ورلڈ فیکٹ بک بیان کرتی ہیں: سرکاری اور قومی زبان، جس کی بولی جانے والی شکل حسانیہ ہے، اس کے قواعد بنیادی طور پر عربی اور الفاظ عربی اور عربائے گئے امازیغی، اور فیکٹ بک کے مطابق یہ فصیح سے بہت مختلف ہے؛ پولار، سوننکے اور ولوف قومی زبانیں ہیں، اور فیکٹ بک فرانسیسی کا بھی نام لیتی ہے۔ صفحہ بتاتا ہے کہ کیا نہیں پڑھا گیا۔"
  fr: "La place de l'arabe en Mauritanie selon l'Encyclopaedia Britannica et The World Factbook : langue officielle et nationale, le hassaniya en étant le dialecte parlé, à grammaire principalement arabe et vocabulaire arabe et amazigh arabisé, que le Factbook dit différer considérablement du standard ; le pular, le soninké et le wolof sont langues nationales, et le Factbook cite aussi le français. La page note ce qui n'a pas été lu."
  es: "El lugar del árabe en Mauritania según la Encyclopaedia Britannica y The World Factbook: lengua oficial y nacional, con el hassaniya como dialecto hablado, de gramática principalmente árabe y vocabulario árabe y amazigh arabizado, que el Factbook dice que difiere considerablemente del estándar; el pular, el soninké y el wolof son lenguas nacionales, y el Factbook cita también el francés. La página anota lo que no se leyó."
