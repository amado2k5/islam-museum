label:
  ar: "حبة الخردل"
  en: "The mustard seed"
  ur: "رائی کا دانہ"
  es: "La semilla de mostaza"
  fr: "La graine de moutarde"
  tr: "hardal çekirdeği"
  id: "biji mustard"
summary:
  ar: "من يعمل مثقال ذرة خيراً يره ومن يعمل مثقال ذرة شراً يره، ولو كان مثقال حبة من خردل في صخرة أو في السماوات أو في الأرض يأت به الله."
  en: "Whoever does an atom's weight of good sees it and whoever does an atom's weight of evil sees it; were it the weight of a mustard seed in a rock or in the heavens or the earth God would bring it forth."
  ur: "جو ذرا برابر نیکی کرے دیکھے گا اور جو ذرا برابر برائی کرے دیکھے گا؛ اگر رائی کے دانے برابر چیز چٹان یا آسمانوں یا زمین میں ہو اللہ اسے لے آئے گا۔"
  es: "Quien hace una obra buena, por pequeña que sea, la ve, y quien hace una obra mala, por pequeña que sea, también la ve; aunque fuera del tamaño de una semilla de mostaza en una roca, en los cielos o en la tierra, Dios la haría brotar."
  fr: "Quiconque fait le bien, même de l'ordre d'un atome, le voit, et quiconque fait le mal, même de l'ordre d'un atome, le voit; si c'était le poids d'une graine de moutarde dans un rocher, dans les cieux ou sur la terre, Dieu la ferait sortir."
  tr: "Bir atom ağırlığında iyilik yapan onu görür ve bir atomun ağırlığını kötülük yapan onu görür; ister bir atomun ağırlığı hardal çekirdeği bir kayada, gökte ister yeryüzünde olsun, Allah onu ortaya çıkaracaktır."
  id: "Siapa pun yang melakukan berat kebaikan atom akan melihatnya, dan siapa pun yang melakukan beban kejahatan atom akan melihatnya, meskipun itu adalah berat atom berupa biji mustard di batu, di langit, atau di bumi, Tuhan akan melahirkannya."
