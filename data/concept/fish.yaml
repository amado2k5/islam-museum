summary:
  ar: "أحلّ الله صيد البحر وطعامه متاعاً لكم وللسيارة، وتعاهد الله على أهل القرية بحرمت السبت إذ تأتيهم حيتانهم يوم سبتهم شورعاً ويوم لا يسبتون لا تأتيهم، ومن البحر تستخرج حلية وتأكلون منه لحماً طرياً."
  en: "God made lawful the game of the sea and its food, provision for you and for travellers; He tested the Sabbath town whose fish came to them openly on their Sabbath and came not the day they kept it not; and from the sea you draw ornaments and eat fresh flesh."
  ur: "اللہ نے سمندر کا شکار اور اس کا کھانا تمہارے اور مسافروں کے لیے حلال کیا؛ اس نے ہفتے والی بستی کو آزمایا جن کی مچھلیاں ہفتے کے دن ابل کر آتیں اور جس دن ہفتے نہ رکھتے نہ آتیں؛ اور سمندر سے تم زیور نکالتے اور تازہ گوشت کھاتے ہو۔"
  es: "Dios hizo lícita la caza del mar y su alimento, sustento para vosotros y para los viajeros; puso a prueba a la ciudad que observaba el sábado, cuyos peces acudían abiertamente a ellos en su sábado y no acudían el día en que no lo guardaban; y del mar extraéis adornos y coméis carne fresca."
  fr: "Dieu a rendu licite la pêche en mer et sa nourriture, pour votre subsistance et celle des voyageurs; il a mis à l'épreuve la ville du sabbat dont le poisson venait ouvertement à eux le jour du sabbat, et ne venait pas le jour où ils ne l'observaient pas; et de la mer vous tirez des ornements et mangez de la chair fraîche."
  tr: "Tanrı, denizin avlanmasına ve yiyeceğine izin verdi, senin ve araba için erzak olarak ve köy halkıyla bir antlaşma yaptı; balinalar onları terk ettikleri gün gelir, dinlenmedikleri gün ise onlara gelmezler. Denizden takılar çıkarır ve taze et yersin."
  id: "Tuhan telah mengizinkan perburuan laut dan makanannya sebagai persediaan untuk kamu dan mobil, dan Dia telah membuat perjanjian dengan penduduk desa untuk melarang hari Sabat, karena paus mereka datang pada hari mereka meninggalkan mereka dalam hukum, dan pada hari mereka tidak beristirahat, mereka tidak datang kepada mereka. Dari laut, kamu mengeluarkan perhiasan dan makan daging segar darinya."
