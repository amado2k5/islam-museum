summary:
  ar: "أحلّ الله صيد البحر وطعامه متاعاً لكم وللسيارة، وتعاهد الله على أهل القرية بحرمت السبت إذ تأتيهم حيتانهم يوم سبتهم شورعاً ويوم لا يسبتون لا تأتيهم، ومن البحر تستخرج حلية وتأكلون منه لحماً طرياً."
  en: "God made lawful the game of the sea and its food, provision for you and for travellers; He tested the Sabbath town whose fish came to them openly on their Sabbath and came not the day they kept it not; and from the sea you draw ornaments and eat fresh flesh."
  ur: "اللہ نے سمندر کا شکار اور اس کا کھانا تمہارے اور مسافروں کے لیے حلال کیا؛ اس نے ہفتے والی بستی کو آزمایا جن کی مچھلیاں ہفتے کے دن ابل کر آتیں اور جس دن ہفتے نہ رکھتے نہ آتیں؛ اور سمندر سے تم زیور نکالتے اور تازہ گوشت کھاتے ہو۔"
