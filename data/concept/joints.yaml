  en: "In the first chapter on bones, Ibn Sina sorts the ways bones meet into three: the free joint, the difficult joint that is not secured, and the secured joint. The secured joint is divided into the socketed, the sutured and the glued {cite:canon-ibn-sina-print-v1 pp.42-43}."
