id: concept/khunsa-fiqh
class: concept
kind: legal
label:
  ar: الخنثى
  en: Khuntha (the one of unclear sex)
  ur: خنثیٰ
  es: "Khuntha (el de sexo incierto)"
  fr: "Khuntha (celui au sexe indéterminé)"
  tr: "hermafrodit"
  id: "hermaprodit"
summary:
  ar: 'الخنثى لغة الذي لا يخلص لذكر ولا أنثى، أو الذي له ما للرجال والنساء من الخنث أي اللين؛ واصطلاحا من له آلتا الرجال والنساء، أو من ليس له شيء منهما وله ثقب يخرج منه البول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7867} يفترق عن المخنث، وهو الذي يتشبه بالنساء في اللين والكلام والحركة؛ فمن كان كذلك بخلقه فلا إثم عليه، والمتكلف للتشبه ملعون في الأحاديث الصحيحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7867}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7868} الخنثى غير المشكل تظهر فيه علامات الذكورة أو الأنوثة فيكون حكمه حكم ما ظهرت فيه؛ والمشكل لا تظهر علاماته أو تتعارض، وهو نوعان: من له آلتان واستوت علاماته، ومن لا آلة له وله ثقب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7868} يتحدد نوعه قبل البلوغ بالبول: إن بال من الذكر فغلام، وإن بال من الفرج فأنثى، وإن بال منهما فالسابق؛ ويستدل الجمهور بأثر ابن عباس ويرون أن منفعة الآلة عند الانفصال خروج البول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7868} إذا استويا: المالكية والحنابلة وأبو يوسف ومحمد يعتبرون الكثرة، والشافعية والحنفية الأكثر لا يرجح، وقال بعض المالكية إن البول من الفرج مرتين ومن الذكر مرة يدل على أنوثته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7869} بعد البلوغ يتبين الأمر بالأسباب: نبات اللحية أو الإنزال بالذكر أو إحبال امرأة أو الوصول إليها فرجل، والحيض أو اللبن أو إمكان الوطء فامرأة، والولادة قطعية الأنوثة، والميل: إلى الرجال فامرأة، وإلى النساء فرجل، وإن استوى فمشكل؛ وإطلاق الخنثى في الفقه يعني المشكل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7869}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7869}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} أحكام الخنثى المشكل: يؤخذ فيها بالأحوط والأوثق، ولا يحكم بثبوت حكم وقع الشك فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} العورة: كعورة المرأة عند الحنفية والشافعية، وكف الخنثى وقدميه وصوته وذراعيه بتفصيل؛ والمالكية يسترون بالأحوط كالمرأة في الصلاة والحج؛ والحنابلة كالرجل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} نقض الوضوء بلمس الفرج: الحنفية والمالكية في رواية لا ينقض، والمالكية في المذهب والشافعية ينقضان، والحنابلة يفصلون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} الغسل بالإيلاج بلا إنزال: لا يجب عند الحنفية والشافعية والحنابلة، خلافا للمالكية؛ والأذان من الخنثى لا يصح بالاتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} الصف والإمامة: يقف الخنثى بعد الرجال والصبيان وقبل النساء؛ والإمام يقيمه عن يمينه عند الحنابلة؛ وإمامة الخنثى للرجال لا تصح، وللنساء صحيحة عند الحنفية والشافعية والحنابلة، ويقوم أمامهن لا وسطهن عند جمهورهم؛ ومنع المالكية إمامته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7871}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7871} الحج والإحرام: الخنثى كالأنثى في شروط الحج عند الجمهور، ولا يحج إلا مع ذي محرم؛ والحنابلة لا فدية إن غطى رأسه أو وجهه وحده، وفدية إن غطاهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7871}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7872} النظر والخلوة: لا يخلو به غير محرم، ولا يسافر به غير محرم من الرجال، ولا يتكشف للنساء ولا للرجال احتياطا؛ والقفال من الشافعية أجاز ذلك استصحابا لحكم الصغر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7872} النكاح: الحنفية إن زوجه أبوه رجلا فوصل إليه جاز، وإلا أجل كالعنين؛ والمالكية والشافعية يمنعونه من النكاح من الجهتين؛ والحنابلة يرجعون إلى قوله في الميل، وأبو بكر لا يجيزه حتى يتبين أمره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7873} الرضاع: لبنه لا يثبت به التحريم عند الحنفية وجمهور الحنابلة؛ والمالكية يرون أنه ينشر الحرمة قياسا على الطهارة والحدث؛ والشافعية وابن حامد يوقفون الأمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7873} الإقرار: إن أقر بما يقلل ميراثه أو ديته قبل، وما يزيد لا يقبل، وفي العبادات يقبل قوله؛ الشهادة: كالأنثى، وتعد امرأة، وقضاؤه لا يصح عند المالكية والشافعية والحنابلة؛ والحنفية يصححونه في غير حد وقود. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7874} القصاص: يقتل به الرجل والمرأة، ويقتل بهما؛ وفي الأطراف يقتص عند المالكية والشافعية والحنابلة، ولا قصاص عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7874} الدية: يبدأ الكلام عنها عند الحنفية عند القتل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7874} الدية: المالكية والحنابلة يوجبون نصف دية ذكر ونصف دية أنثى لاحتمال الذكورة والأنوثة، والشافعية يوجبون دية أنثى لأنها اليقين؛ والحنفية والشافعية نصف دية الذكر في الجراح، والمالكية والحنابلة يساوون الذكر إلى الثلث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7875} لا يدخل الخنثى في العاقلة، فإن بان ذكرا غرم الشافعية حصته مما أداه غيره؛ والقسامة: الحنفية والحنابلة في قول لا يدخل؛ المالكية والحنابلة في قول يقسم؛ والشافعية يحلف الأكثر ويوقف الباقي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7875}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7876} حد القذف: المالكية والشافعية يوجبونه إن قذف بالزنى بالفرج الذكر، وإن زنى بأحدهما فلا حد؛ والحنفية لا حد للخنثى ويعزر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7876} الختان: الحنفية يجيزونه للصغير الذي لا يشتهى من رجل أو امرأة؛ والمالكية منهم من يمنعه احتياطا؛ والشافعية يمنعونه في الصغر، وفي البلوغ وجهان؛ والحنابلة يختن فرجيه احتياطا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7876} لبس الحرير والذهب والفضة: جمهور الفقهاء يحرمونه؛ والحنفية يكرهونه احتياطا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7876}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7877} الغسل والتكفين والدفن: الحنفية لا يغسله رجل ولا امرأة بل يمم؛ والشافعية يفصلون: إن كان صغيرا جاز للرجال والنساء غسله، وإن كان كبيرا فوجهان؛ والحنابلة يممونه بحائل إن بلغ سبع سنين؛ ويكفن في خمسة أثواب بيض كالجارية؛ ويوضع بين الرجل والمرأة في الصلاة؛ ويستحب تسجيته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7877}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7878} الميراث: المالكية والحنابلة وأبو يوسف ومحمد يورثونه نصف ميراث ذكر ونصف ميراث أنثى؛ وأبو حنيفة أقل النصيبين احتياطا؛ والشافعية يعطونه اليقين ويوقفون الباقي حتى يتبين الأمر أو يصطلحوا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7878}'
  en: 'Khuntha is lexically one who is neither purely male nor female, or who has the features of both, from khanth, softness; technically one with both sets of organs, or with neither and only an opening for urine. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7867} It differs from the mukhannath, one who imitates women in softness, speech and movement; one made so by birth is not blamed, while one who imitates by choice is cursed in the sound reports. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7867}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7868} A clear khuntha shows male or female signs and is judged by them; an unclear one has no clear signs or contrary ones, and is of two kinds: both organs with equal signs, or no organ but an opening. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7868} Before puberty the sex is set by urination: from the penis, a boy; from the vagina, a girl; from both, the earlier; the majority rely on the report of Ibn Abbas and hold that the function at birth is urination. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7868} When the signs are equal: the Malikis, Hanbalis, Abu Yusuf and Muhammad hold that the greater quantity counts, reported from al-Awza''i; the majority say quantity is no proof. Some Malikis hold that urinating twice from the vagina and once from the penis shows he is female. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7869} After puberty the sex shows by beard or emission by the penis (male), by impregnating or being penetrated (male), by menses, milk or fitness for intercourse (female); birth shows female; inclination shows the opposite; equal inclination leaves him unclear, and in fiqh an unqualified khuntha means the unclear. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7869}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7869}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} The unclear khuntha is judged by the safer and firmer course, and no ruling whose ground is doubtful is applied. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} Awrah: as a woman\''s by the Hanafis and Shafiis, except the face and hands; the Malikis cover as a woman in prayer and pilgrimage; the Hanbalis as a man. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} Ablution and touch of the genitals: the Hanafis and a Maliki report say no; the Maliki school and the Shafiis say yes; the Hanbalis divide. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} Ghusl and penetration without emission: not required by the Hanafis, Shafiis and Hanbalis, unlike the Malikis; the call to prayer by a khuntha is not valid by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} Rows and leading the prayer: he stands after the men and boys and before the women; the Hanbalis have the imam place him at his right; leading men is invalid, leading women valid for the Hanafis, Shafiis and Hanbalis, standing in front of them; the Malikis forbid his leading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7871}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7871} Pilgrimage and ihram: he is like a woman in the conditions of the Hajj for the majority, and does not travel for it without a mahram; the Hanbalis require no expiation if he covers only the head or only the face, expiation if both. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7871}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7872} Looking and seclusion: no non-mahram may be alone with him or travel with him; he may not be uncovered before women or men in caution; al-Qaffal allowed it by the presumption of childhood. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7872} Marriage: the Hanafis allow it if his father marries him to a man who consummates, otherwise they postpone it as for the impotent; the Malikis and Shafiis forbid it on both sides; the Hanbalis rely on his inclination; Abu Bakr forbids marriage until his sex is clear. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7873} Suckling: his milk does not establish marriage bars for the Hanafis and most Hanbalis; the Malikis count it by analogy with purity; the Shafiis and Ibn Hamid suspend the matter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7873} Admission and testimony: his admission lowers his share of inheritance or blood-money is accepted; his claim to raise it is not; he is witness as a woman; his judgeship is not valid by the Malikis, Shafiis and Hanbalis, the Hanafis accepting it outside hadd and retaliation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7874} Retaliation: one who kills or is killed in retaliation may be killed for or by him; for injuries the Malikis, Shafiis and Hanbalis retaliate, the Hanafis do not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7874} Blood-money: the Hanafi discussion of the diya of the khuntha begins here and continues beyond p.7874. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7874} Blood-money: the Malikis and Hanbalis give half a male and half a female diya, since the sex is one of two possibilities; the Shafiis give the female diya as the certain sum; for wounds the Hanafis and Shafiis give half the male sum, and the Malikis and Hanbalis equal the male up to a third. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7875} The khuntha is not in the paternal kin who pay; if he proves male, the Shafiis have him repay the share others paid; in the oath of the group (qasama) the Hanafis and a Hanbali view exclude him, while the Malikis and another Hanbali view include him; the Shafiis have the majority swear and suspend the rest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7875}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7876} Slander: the Malikis and Shafiis impose the hadd for slander of his male organ, and none if he committed adultery in either; the Hanafis give no hadd, but discretionary punishment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7876} Circumcision: the Hanafis permit it for a child who is not yet desired by a man or a woman; some Malikis forbid it out of caution; the Shafiis forbid it in childhood, with two views at puberty; the Hanbalis circumcise both organs out of caution. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7876} Silk, gold and silver: most jurists forbid them; the Hanafis dislike them out of caution. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7876}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7877} Washing, shrouding and burial: the Hanafis do not wash him, a man or a woman, and he is dry-ablute; the Shafiis divide: if a child, both men and women may wash him, if grown, two views; the Hanbalis dry-ablute him from seven years; he is shrouded in five white pieces like a girl; he is placed between a man and a woman in the prayer; covering the grave is recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7877}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7878} Inheritance: the Malikis, Hanbalis, Abu Yusuf and Muhammad give him half a male share and half a female share; Abu Hanifa gives the lesser of the two shares; the Shafiis give the certain share and hold the rest until the matter is clear or they agree. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7878}'
  ur: 'خنثیٰ لغت میں وہ جو نہ خالص مرد ہو نہ عورت، یا جس میں دونوں کی خصوصیات ہوں؛ اصطلاح میں وہ شخص جس کے مرد و عورت دونوں کے آلات ہوں، یا کوئی آلہ نہ ہو اور صرف پیشاب کا سوراخ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7867} مخنث وہ ہے جو عورتوں کی طرح نرمی، کلام اور حرکت میں مشابہت اختیار کرے؛ جو پیدائشی ایسا ہو اس پر گناہ نہیں، جو جان بوجھ کر مشابہت اختیار کرے اس پر صحیح احادیث میں لعنت ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7867}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7868} واضح خنثیٰ میں علامات کے مطابق حکم؛ مشکل میں علامات ظاہر نہ ہوں یا متضاد ہوں، اور وہ دو قسم کا: دونوں آلات والا جس میں علامات برابر، اور صرف سوراخ والا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7868} بلوغ سے پہلے پیشاب سے تعین: ذکر سے ہو تو لڑکا، فرج سے ہو تو لڑکی، دونوں سے ہو تو جو پہلے ہو؛ جمہور ابن عباس کے اثر سے استدلال کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7868} مساوی ہوں تو مالکیہ، حنابلہ، ابو یوسف اور محمد کثرت کا اعتبار کرتے ہیں ⁦(اوزاعی سے منقول)⁩، جبکہ جمہور کثرت کو دلیل نہیں مانتے؛ بعض مالکیہ کے نزدیک فرج سے دو بار اور ذکر سے ایک بار پیشاب عورت ہونے کی دلیل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7869} بلوغ کے بعد: داڑھی یا ذکر سے انزال یا حمل ٹھہرانا یا وطی سے مرد؛ حیض، دودھ یا امکانِ وطی سے عورت؛ ولادت قطعی طور پر عورت؛ میلان مردوں کی طرف عورت اور عورتوں کی طرف مرد؛ برابر ہوں تو مشکل؛ فقہ میں مطلق خنثیٰ سے مراد مشکل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7869}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} مشکل خنثیٰ کے احکام میں احوط اور اوثق پر عمل کیا جاتا ہے، اور جس حکم کا ثبوت شک میں ہو اسے ثابت نہیں مانا جاتا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} ستر: حنفیہ اور شافعیہ کے نزدیک عورت کی طرح، سوائے چہرے اور ہتھیلیوں کے؛ مالکیہ نماز و حج میں احوط کے مطابق عورت کی طرح ڈھانپتے ہیں؛ حنابلہ مرد کی طرح۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} فرج چھونے سے وضو: حنفیہ اور مالکیہ کی ایک روایت میں نہیں ٹوٹتا؛ مالکیہ کے مذہب اور شافعیہ میں ٹوٹتا ہے؛ حنابلہ تفصیل کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} غسل: بغیر انزال کے ایلاج سے حنفیہ، شافعیہ اور حنابلہ کے نزدیک واجب نہیں؛ مالکیہ مختلف ہیں؛ خنثیٰ کی اذان بالاتفاق صحیح نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} صف اور امامت: مردوں اور لڑکوں کے بعد اور عورتوں سے پہلے کھڑا ہوگا؛ حنابلہ امام اسے دائیں جانب کھڑا کرے؛ مردوں کی امامت باطل، عورتوں کی امامت حنفیہ، شافعیہ اور حنابلہ کے نزدیک صحیح، عورتوں کے آگے کھڑا ہو؛ مالکیہ منع کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7871}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7871} حج اور احرام: جمہور کے نزدیک حج کی شرائط میں عورت کی طرح؛ محرم کے بغیر حج نہیں؛ حنابلہ سر یا چہرہ اکیلا ڈھانپنے پر فدیہ نہیں، دونوں ڈھانپنے پر فدیہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7871}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7872} نظر اور خلوت: غیر محرم اس کے ساتھ تنہا نہ ہو اور نہ سفر کرے؛ احتیاطاً عورتوں اور مردوں کے سامنے بے پردہ نہ ہو؛ قفال نے بچپن کے استصحاب سے جائز کہا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7872} نکاح: حنفیہ کے نزدیک اگر باپ کسی مرد سے بیاہ دے اور وہ وطی کرے تو جائز، ورنہ عنین کی طرح مہلت؛ مالکیہ اور شافعیہ دونوں جانب سے ممنوع؛ حنابلہ اس کے میلان پر اعتماد کرتے ہیں، ابو بکر حقیقت واضح ہونے تک نکاح ناجائز کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7873} رضاع: حنفیہ اور جمہور حنابلہ کے نزدیک اس کے دودھ سے حرمت ثابت نہیں؛ مالکیہ طہارت پر قیاس کر کے حرمت مانتے ہیں؛ شافعیہ اور ابن حامد معاملہ موقوف رکھتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7873} اقرار اور شہادت: جو اقرار اس کی میراث یا دیت کم کرے قبول، زیادہ کرے نامقبول؛ عبادات میں قول قبول؛ شہادت عورت کی طرح؛ قضا مالکیہ، شافعیہ اور حنابلہ کے نزدیک صحیح نہیں، حنفیہ حد و قصاص کے سوا صحیح کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7874} قصاص: اس کو قتل کرنے پر مرد یا عورت قتل ہوگا، اور وہ دونوں کو قتل کرے گا؛ اعضاء میں مالکیہ، شافعیہ اور حنابلہ قصاص کے قائل، حنفیہ نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7874} دیت: حنفیہ کا بیان یہاں سے شروع ہو کر آگے جاری ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7874} دیت: مالکیہ اور حنابلہ مرد و عورت کی نصف نصف دیت لازم کرتے ہیں کیونکہ جنس دو احتمالات میں سے ایک ہے؛ شافعیہ یقینی عورت کی دیت لازم کرتے ہیں؛ زخموں میں حنفیہ اور شافعیہ نصف مرد کی دیت، مالکیہ اور حنابلہ ایک تہائی تک مرد کے برابر۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7875} خنثیٰ عاقلہ میں شامل نہیں؛ مرد نکلے تو شافعیہ دوسروں کے ادا کردہ حصے کا تاوان لیتے ہیں؛ قسامہ میں حنفیہ اور حنابلہ کے ایک قول کے مطابق شامل نہیں، مالکیہ اور حنابلہ کے دوسرے قول میں قسم کھاتا ہے؛ شافعیہ اکثر حصے پر قسم لیتے ہیں اور باقی موقوف رکھتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7875}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7876} حد قذف: مالکیہ اور شافعیہ مرد عضو کے ساتھ زنا کی تہمت پر حد واجب کرتے ہیں، دونوں میں سے کسی سے زنا کی صورت میں حد نہیں؛ حنفیہ خنثیٰ پر قذف میں حد نہیں مانتے، تعزیر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7876} ختنہ: حنفیہ ایسے بچے کے لیے جائز کہتے ہیں جس کی طرف مرد یا عورت کو رغبت نہ ہو؛ بعض مالکیہ احتیاط سے منع کرتے ہیں؛ شافعیہ بچپن میں منع اور بلوغ میں دو وجوہ؛ حنابلہ احتیاطاً دونوں عضو کا ختنہ کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7876} ریشم، سونا اور چاندی: جمہور حرام کہتے ہیں؛ حنفیہ احتیاطاً مکروہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7876}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7877} غسل، کفن اور دفن: حنفیہ نہ مرد نہ عورت غسل دیں بلکہ تیمم کریں؛ شافعیہ تفصیل: بچہ ہو تو مرد و عورت دونوں غسل دے سکتے ہیں، بڑا ہو تو دو وجوہ؛ حنابلہ سات سال کے بعد پردے کے ساتھ تیمم کرتے ہیں؛ کفن پانچ سفید کپڑوں میں جیسے لڑکی کا؛ نماز میں مرد و عورت کے بیچ رکھا جائے؛ قبر ڈھانپنا مستحب۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7877}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7878} میراث: مالکیہ، حنابلہ، ابو یوسف اور محمد مرد اور عورت کے نصف نصف حصے دیتے ہیں؛ ابو حنیفہ دونوں میں سے کم حصہ احتیاطاً؛ شافعیہ یقینی حصہ دیتے ہیں اور باقی معاملہ واضح ہونے یا صلح تک موقوف۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7878}'
  es: "Khuntha es léxicamente aquel que no es ni puramente masculino ni femenino, o que tiene las características de ambos, de khanth, suavidad; técnicamente aquel con ambos conjuntos de órganos, o sin ninguno y solo una abertura para la orina. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7867} Se diferencia del mukhannath, aquel que imita a las mujeres en suavidad, habla y movimiento; aquel hecho así por nacimiento no es culpado, mientras que aquel que imita por elección es maldecido en los informes de sonido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7867}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7868} Un khuntha claro muestra signos masculinos o femeninos y es juzgado por ellos; uno incierto no tiene signos claros o tiene signos contrarios, y es de dos tipos: ambos órganos con signos iguales, o ningún órgano más que una abertura. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7868} Antes de la pubertad, el sexo se determina por la micción: del pene, varón; de la vagina, niña; de ambos, el primero; la mayoría se basa en el relato de Ibn Abbas y sostiene que la función al nacer es la micción. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7868} Cuando los signos son iguales: los malikíes, hanbalíes, Abu Yusuf y Muhammad sostienen que la mayor cantidad cuenta, según lo informado por al-Awza'i; la mayoría dice que la cantidad no es prueba. Algunos malikíes sostienen que orinar dos veces por la vagina y una vez por el pene demuestra que es mujer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7869} Después de la pubertad, el sexo se muestra por la barba o la emisión del pene (hombre), por la impregnación o la penetración (hombre), por la menstruación, la leche o la aptitud para el coito (mujer); el nacimiento muestra mujer; la inclinación muestra lo contrario; la misma inclinación lo deja incierto, y en fiqh un khuntha no calificado significa incierto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7869}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7869}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} El khuntha incierto se juzga por el curso más seguro y firme, y no se aplica ninguna regla cuyo fundamento sea dudoso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} Awrah: como la de una mujer según los Hanafis y Shafiis, excepto la cara y las manos; los Malikis se cubren como una mujer en la oración y la peregrinación; los Hanbalis como un hombre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} Ablución y contacto de los genitales: los Hanafis y un informe Maliki dicen que no; la escuela Maliki y los Shafiis dicen que sí; los Hanbalis dividen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} Ghusl y penetración sin emisión: no requeridos por los Hanafis, Shafiis y Hanbalis, a diferencia de los Malikis; el llamado a la oración por un khuntha no es válido por acuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} Filas y dirigir la oración: se coloca después de los hombres y los niños y delante de las mujeres; los hanbalíes hacen que el imán lo coloque a su derecha; dirigir a los hombres es inválido, dirigir a las mujeres es válido para los hanafíes, shafiíes y hanbalíes, de pie delante de ellas; los malikíes prohíben que dirija. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7871}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7871} Peregrinación e ihram: es como una mujer en las condiciones del Hajj para la mayoría, y no viaja para ello sin un mahram; Los hanbalíes no requieren expiación si cubre solo la cabeza o solo el rostro, expiación si cubre ambos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7871}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7872} Mirada y reclusión: ningún no mahram puede estar a solas con él ni viajar con él; no puede ser descubierto delante de mujeres u hombres por precaución; al-Qaffal lo permitió por la presunción de infancia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7872} Matrimonio: los hanafíes lo permiten si su padre lo casa con un hombre que consuma, de lo contrario lo posponen como para el impotente; los malikíes y shafiíes lo prohíben por ambas partes; los hanbalíes se basan en su inclinación; Abu Bakr prohíbe el matrimonio hasta que su sexo sea claro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7873} Lactancia: su leche no establece impedimentos matrimoniales para los Hanafis y la mayoría de los Hanbalis; los Malikis la cuentan por analogía con la pureza; los Shafiis e Ibn Hamid suspenden el asunto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7873} Admisión y testimonio: su admisión reduce su parte de la herencia o se acepta el dinero de sangre; su reclamo para aumentarlo no lo es; es testigo como mujer; su juez no es válido para los Malikis, Shafiis y Hanbalis, los Hanafis lo aceptan fuera de hadd y represalia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7874} Represalia: uno que mata o es asesinado en represalia puede ser asesinado por o para él; por lesiones los malikíes, shafiíes y hanbalíes toman represalias, los hanafíes no. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7874} Dinero de sangre: la discusión hanafí de la diya del khuntha comienza aquí y continúa más allá de la p.7874. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7874} Dinero de sangre: los malikíes y hanbalíes dan la mitad de una diya masculina y la mitad de una femenina, ya que el sexo es una de dos posibilidades; los shafiíes dan la diya femenina como suma cierta; por heridas los hanafíes y shafiíes dan la mitad de la suma masculina, y los malikíes y hanbalíes igualan la masculina hasta un tercio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7875} El khuntha no está en el pariente paterno que paga; Si resulta ser varón, los shafiíes le hacen devolver la parte que otros pagaron; en el juramento del grupo (qasama) los hanafíes y una visión hanbalí lo excluyen, mientras que los malikíes y otra visión hanbalí lo incluyen; los shafiíes hacen que la mayoría jure y suspenda al resto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7875}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7876} Calumnia: los malikíes y los shafiíes imponen el hadd por calumniar su órgano masculino, y ninguno si cometió adulterio en cualquiera de ellos; los hanafíes no dan hadd, sino castigo discrecional. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7876} Circuncisión: los hanafíes la permiten para un niño que aún no es deseado por un hombre o una mujer; algunos malikíes la prohíben por precaución; Los shafiíes lo prohíben en la infancia, con dos opiniones en la pubertad; los hanbalíes circuncidan ambos órganos por precaución. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7876} Seda, oro y plata: la mayoría de los juristas los prohíben; a los hanafíes les disgustan por precaución. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7876}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7877} Lavado, amortajamiento y entierro: los hanafíes no lo lavan, sea hombre o mujer, y es seco-ablute; los shafiíes dividen: si es un niño, tanto hombres como mujeres pueden lavarlo, si es adulto, dos opiniones; los hanbalíes lo abluten seco a partir de los siete años; es amortajado en cinco piezas blancas como una niña; es colocado entre un hombre y una mujer en la oración; Se recomienda cubrir la tumba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7877}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7878} Herencia: los malikíes, hanbalíes, Abu Yusuf y Muhammad le dan la mitad de la parte masculina y la mitad de la femenina; Abu Hanifa le da la menor de las dos partes; los shafiíes le dan la parte segura y retienen el resto hasta que el asunto se aclare o lleguen a un acuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7878}"
  fr: "Le terme « khuntha » désigne, lexicalement, celui qui n'est ni purement masculin ni purement féminin, ou qui présente des caractéristiques des deux sexes, dérivé de « khanth », qui signifie douceur; techniquement, il désigne celui qui possède les deux sexes, ou celui qui n'en possède aucun et ne présente qu'un orifice urinaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7867} Il se distingue du « mukhannath », celui qui imite les femmes par sa douceur, sa parole et ses mouvements; celui qui est né ainsi n'est pas blâmé, tandis que celui qui imite par choix est maudit selon les sources authentiques. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7867}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7868} Un « khuntha » manifeste clairement des signes masculins ou féminins et est jugé en fonction de ceux-ci; un « khuntha » ambigu ne présente aucun signe distinctif ou des signes contraires, et se divise en deux catégories: celui qui possède les deux sexes avec des signes identiques, ou celui qui ne possède aucun organe et ne présente qu'un orifice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7868} Avant la puberté, le sexe est déterminé par l'urine: par le pénis, un garçon; par le vagin, une fille; par les deux, la première urine prévaut. La majorité se fonde sur le hadith d'Ibn Abbas et considère que la fonction déterminante à la naissance est l'urine. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7868} En cas d'égalité des signes, les Malikites, les Hanbalites, Abu Yusuf et Muhammad estiment que la quantité la plus importante prévaut, selon un hadith rapporté par al-Awza'i. La majorité considère que la quantité n'est pas une preuve. Certains Malikites affirment que le fait d'uriner deux fois par le vagin et une fois par le pénis indique qu'il s'agit d'une fille. Après la puberté, le sexe se manifeste par la barbe ou l'éjaculation (chez l'homme), par la grossesse ou la pénétration (chez l'homme), par les menstruations, le lait ou l'aptitude à la reproduction (chez la femme); la naissance indique un sexe féminin; l'inclination indique le sexe opposé; une inclination égale laisse le sexe indéterminé, et en droit islamique (fiqh), un khuntha non qualifié désigne ce qui est indéterminé. Le khuntha indéterminé est jugé selon la voie la plus sûre et la plus ferme, et aucune règle dont le fondement est douteux n'est appliquée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} Awrah: selon les Hanafites et les Chafiites, elle est couverte comme celle d’une femme, à l’exception du visage et des mains; les Malikites la couvrent comme celle d’une femme lors de la prière et du pèlerinage; les Hanbalites comme celle d’un homme. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} Ablution et contact des parties génitales: les Hanafites et un hadith malikite les interdisent; l’école malikite et les Chafiites les autorisent; les Hanbalites sont partagés. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} Ghusl et pénétration sans éjaculation: non requis par les Hanafites, les Chafiites et les Hanbalites, contrairement aux Malikites; l’appel à la prière par un khuntha n’est pas valide par consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} Rangées et direction de la prière: il se tient après les hommes et les garçons et avant les femmes; les Hanbalites exigent que l’imam le place à sa droite; le fait qu’il dirige les hommes est invalide, tandis que le fait qu’il dirige les femmes est valide pour les Hanafites, les Shafiites et les Hanbalites, se tenant devant elles; les Malikites interdisent qu’il dirige la prière. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7871}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7871} Pèlerinage et ihram: il est assimilé à une femme aux conditions du Hajj pour la majorité des fidèles et ne voyage pas pour cela sans un mahram; Les Hanbalites n'exigent aucune expiation si le garçon ne couvre que la tête ou que le visage, mais une expiation est requise s'il couvre les deux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7871}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7872} Le regard et l'isolement: aucun non-mahram ne peut se retrouver seul avec lui ni voyager avec lui; par prudence, il ne doit pas être découvert devant des femmes ou des hommes; al-Qaffal l'autorisait en raison de la présomption d'enfance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7872} Le mariage: les Hanafites l'autorisent si son père le marie à un homme qui consomme le mariage, sinon ils le reportent comme pour les personnes impuissantes; les Malikites et les Shafi'ites l'interdisent des deux côtés; les Hanbalites se fient à son inclination; Abu Bakr interdit le mariage jusqu'à ce que son sexe soit clairement établi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7873} Allaitement: son lait ne constitue pas un obstacle au mariage pour les Hanafites et la plupart des Hanbalites; les Malikites le prennent en compte par analogie avec la pureté; les Chafiites et Ibn Hamid suspendent la question. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7873} Aveu et témoignage: son aveu diminue sa part d’héritage ou de prix du sang est accepté; sa prétention de l’augmenter ne l’est pas; il est témoin en tant que femme; son jugement n’est pas valable pour les Malikites, les Chafiites et les Hanbalites, les Hanafites l’acceptant en dehors du hadd et de la représailles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7874} Représailles: celui qui tue ou est tué en représailles peut être tué pour ou par lui; Pour les blessures, les Malikites, les Chafiites et les Hanbalites ripostent, contrairement aux Hanafites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7874} Le prix du sang: la discussion hanafite sur la diya du khuntha commence ici et se poursuit au-delà de la page 7874. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7874} Le prix du sang: les Malikites et les Hanbalites versent la moitié d’une diya masculine et l’autre moitié d’une diya féminine, le sexe étant l’une des deux possibilités; les Chafiites versent la diya féminine comme somme fixe; pour les blessures, les Hanafites et les Chafiites versent la moitié de la somme masculine, et les Malikites et les Hanbalites égalent la somme masculine jusqu’à un tiers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7875} Le khuntha n’est pas un membre de la famille paternelle qui paie; S'il est prouvé qu'il est un homme, les Chafiites exigent qu'il rembourse la part payée par les autres; lors du serment du groupe (qasama), les Hanafites et une opinion hanbalite l'excluent, tandis que les Malikites et une autre opinion hanbalite l'incluent; les Chafiites font prêter serment à la majorité et suspendent le reste. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7875}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7876} Calomnie: les Malikites et les Chafiites imposent la peine de hadd pour la calomnie concernant son organe génital masculin, et aucune peine s'il a commis l'adultère avec l'un ou l'autre; les Hanafites n'imposent pas de hadd, mais une peine discrétionnaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7876} Circoncision: les Hanafites l'autorisent pour un enfant qui n'est pas encore désiré par un homme ou une femme; Certains malikites l'interdisent par prudence; les chaféites l'interdisent durant l'enfance, avec deux avis divergents à la puberté; les hanbalites circoncisent les deux organes par prudence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7876} Soie, or et argent: la plupart des juristes les interdisent; les hanafites les désapprouvent par prudence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7876}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7877} Lavage, linceul et enterrement: les hanafites ne le lavent pas, homme ou femme, et il est purifié à sec; les chaféites sont partagés: si c'est un enfant, hommes et femmes peuvent le laver, si c'est un adulte, deux avis divergent; les hanbalites le purifient à sec à partir de sept ans; il est enveloppé dans un linceul de cinq pièces blanches comme une fille; Il est placé entre un homme et une femme lors de la prière; il est recommandé de recouvrir la tombe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7877}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7878} Héritage: les Malikites, les Hanbalites, Abu Yusuf et Muhammad lui attribuent une part égale pour les hommes et une part égale pour les femmes; Abu Hanifa lui attribue la plus petite des deux parts; les Shafi'ites attribuent la part déterminée et conservent le reste jusqu'à ce que la situation soit clarifiée ou qu'un accord soit trouvé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7878}"
  tr: "Dilsel olarak, hermafrodit, ne erkeğe ne de kadına karşı samimi olmayan ya da erkeklerin ve kadınların hermafrodit erkeklerden sahip olduğu gibi, yani nazikliğe sahip kişidir; teknik olarak, hem erkek hem kadın genital organlarına sahip olan ya da hiçbiri olmayan ve idrarının çıktığı bir delik olan kişidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7867}, yumuşaklık, konuşma ve hareketle kadınları taklit eden hermafroditten ayrılır; yaratılışında böyle olan günahkar değildir ve taklit eden gerçek hadislerde lanetlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7867} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7868} Sorun yaşamayan hermafrodit erkeklik veya kadınlık belirtileri gösterir, bu yüzden hükmü içinde görünenle aynıdır; problem işaretlerini göstermez veya çelişmez, iki tür vardır: biri iki aleti olan ve sabit bir işaretçisi olan, diğeri ise organı olmayan ve deliği olan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7868} Tipi ergenlikten önce idrarla belirlenir: erkeğin penisi varsa erkektir; erkek mi kadın mı erkekse, özel bölgeden gelirse erkektir. Çoğunluk İbn Abbas'ın anlatımına atıfta bulunur ve ayrılık sırasında aletin faydasının idrarın atılması olduğuna inanır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7868} Eşitlerse: Malikiler, Hanbaliler, Ebu Yusuf ve Muhammed çoğunluk olarak kabul eder, Şafi'ler ve Hanafiler en olası olanlardır, ancak bazı Malikiler vajinadan iki kez, erkekten bir kez çıkan idrarın kadınsı olduğunu söyler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7869} Ergenlikten sonra konu şu nedenlerle netleşir: sakal bırakma, boşalma, kadının rahmi veya erkeğe ulaşma, adet görme, süt veya kadınla cinsel ilişki olasılığı, doğum kadınlıktan kesin, eğilim erkek ve kadın için erkek, eğer eşit ise sorunluysa; ve fıkıhta hermafrodit terimi sorunlu anlamına gelir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7869} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7869} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7870} Şüpheli bir hermafrodit hakkında kararlar: En temkinli ve güvenilir yaklaşım alınır ve bir karar şüpheli bir hükmü belirlemeye dayanmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7870} 'awrah: Hanafi ve Şafi'lere göre kadının 'awrah'ı, hermafroditin elleri, ayakları, sesi ve kolları ayrıntılı şekilde anlatılmıştır; Malikiler dua ve hac yolculuğunda bir kadın gibi en temkinli şekilde örtür; Hanbaliler ise erkekler gibidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7870} Özel bölgelere dokunarak abdest almanın iptal edilmesi: Bir rivayette Hanafi ve Maliki bunu geçersiz kılmaz, okuldaki Malikiler ve Şafi'ler geçersiz kılar, Hanbaliler ise belirtir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7870} Boşalmadan penetrasyon yoluyla Hüsl: Hanefiler, Şafiiler ve Hanbalilere göre zorunlu değildir, Malikilerin aksine; ve bir hermafroditten gelen ezan da uzlaşmayla geçerli değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7870} Tartışma ve liderlik: Hermafrodit erkeklerin ve erkeklerin ve kadınların önünde durur; İmam Hanbalilere göre sağında durur; erkekler için hermafroditin liderliği geçerli değildir, ancak kadınlar için Hanefi, Şafii ve Hanelilere göre geçerlidir ve onların önünde durur, aralarında değil, çoğunluklarına göre; ve Malikiler imamını yasaklamıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7870} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7871} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7871} Hac ve İhram: Hermafrodit kişi, çoğunluğa göre Hac koşullarında bir kadın gibidir ve hac sadece bir mahramla yapılır; Hanbali'ye göre, baş veya yüz kapalıysa fidya yoktur, ikisi de kapalıysa fidya yoktur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7871} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7872} Bakışma ve inziva: sadece bir mahram onunla seyahat etmeli, erkekler arasında bir mahram dışında kimse seyahat etmeli ve önlem olarak kadın veya erkekler için açılmamalıdır; ve Şafii çilingir bunu azınlık hükmü nedeniyle varsayım varsayımı olarak kabul etmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7872} Evlilik: Hanafiler, babası onu bir erkekle evlendirirse ve ona ulaşırsa bunun caiz olduğunu söylerler; aksi takdirde 'anin' gibi gecikir; Malikiler ve Şafiiler onun her iki taraftan evlenmesini engeller; Hanbalılar onun eğilim görüşüne atıfta bulunur ve Ebu Bekir durumu netleşmeden izin vermez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7873} Emzirme: sütünün Hanafileri ve Hanbali çoğunluğuna göre yasaklama sağladığını düşünür; Malikiler bunun saflık ve kirliliğe benzetme yoluyla yasağı yaydığını düşünür; Şafiiler ve İbn Hamid bu konuyu durdurur. {Kaynak:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s. 7873} İtiraf: Eğer mirasını veya kan parasını azaltan ve aşan şeyi kabul ederse, kabul edilmez. İbadet eylemlerinde ifadesi kabul edilir; tanıklık: kadın gibi, kadın sayılır. Bu hükm, Malikiler, Şafi'ler ve Hanelilere göre geçerli değildir; Hanafiler ceza dışında başka durumlarda da geçerlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7874} Qisa: Bir erkek ve bir kadını öldürür, onları öldürür; aşırılar için Malikiler, Şafi'ler ve Hanbalilere göre cezalandırılır, ancak Hanefilere göre kısa yoktur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7874} Diyya: Hanefiler öldürme anında bunu tartışmaya başlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7874} Diyah: Maliki ve Hanbaliler erkek ve kadın statüsü için yarı diyya, kadın için yarı diyya ister; Şafiiler kadın için diyya ister, çünkü kesindir; Hanafi ve Şafi'ler yaralar için erkek için kan parasının yarısını ister; Maliki ve Hanbaliler erkeği üçte bire eşitler. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.7875} Hermafrodit 'aqilah'a dahil edilmez; bir erkek vahy edilirse, Şafiiler başkalarının ödediği paydan para cezası alır; ve Qasama: Hanafi ve Hanbalılar bunun geçerli olmadığını söyler; Malikiler ve Hanbalılar bölünür; Şafiiler çoğuna yemin eder ve diğerlerini durdurur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7875} {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.. 7876} İftira cezası: Malikiler ve Şafiiler, erkek özel bölgelerine iftira atarsa onu zorunlu kılar; eğer onlardan biriyle zina yaparsa ceza yoktur; Hanefiler hermafrodit için ceza almazlar ve onlar 'azardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7876} Sünnet: Hanafiler, erkek ya da kadın istemeyen reşit olmayanlar için sünneti kabul eder; Malikiler önlem olarak yasaklar; Şafiiler hem çocuklukta hem ergenlikte yasaklar; Hanbaliler ise önlem olarak sünnet yaparlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7876} İpek, altın ve gümüş giymek: Çoğu hukukçu bunu yasaklar; Hanafiler önlem olarak hoşlanmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7876} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7877} Hüsl, kefen ve gömme: Hanafiler onu ne erkek ne de kadın tarafından değil, imam tarafından yıkar; Şafiiler şöyle belirtir: gençse erkeklerin ve kadınların yıkaması caizdir, ama yaşlıysa her iki yüz için yapılmalıdır; Hanbalılar ise yedi yaşına ulaştığında doluyla yapılmasını ister; beş beyaz giysiyle köle kız gibi örtülür; namaz sırasında erkek ve kadın arasına konur; ve okunması tavsiye edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7877} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7878} Miras: Malikiler, Hanbaliler, Ebu Yusuf ve Muhammed erkek mirasının yarısını, kadın mirasının yarısını miras alır; Ebu Hanife en az çekingendir; Şafiiler ona kesinlik verir, geri kalanını ise mesele netleşene veya uzlaştırılana kadar saklar. {atı:fiqh-mawsua-kuveytiyya-noor-v3 s.7878}"
  id: "Secara linguistik, hermaprodit adalah seseorang yang tidak tulus baik kepada laki-laki maupun perempuan, atau yang memiliki apa yang dimiliki pria dan wanita dari pria hermaprodit, yaitu kelembutan; secara teknis, seseorang yang memiliki alat kelamin laki-laki dan perempuan, atau yang tidak memiliki keduanya dan lubang dari mana urin keluar. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7867} dibedakan dari hermaprodit, yang meniru perempuan dalam kelembutan, ucapan, dan gerakan; siapa pun yang seperti ini dalam ciptaannya tidak berdosa, dan yang meniru peniruan dikutuk dalam hadits yang sah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7867} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7868} Hermaprodit yang tidak bermasalah menunjukkan tanda-tanda maskulinitas atau feminitas, sehingga keputusannya sama dengan yang muncul di dalamnya; masalah ini tidak menunjukkan atau bertentangan dengan tandanya, dan ada dua jenis: satu yang memiliki dua alat dan memiliki penanda tetap, dan satu yang tidak memiliki organ dan lubang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7868} Jenisnya ditentukan sebelum pubertas oleh urine: jika laki-laki memiliki penis, maka laki-laki; jika laki-laki atau perempuan, dan jika dari bagian pribadi, maka itu yang pertama. Mayoritas merujuk pada narasi Ibn Abbas dan percaya bahwa manfaat alat saat pemisahan adalah pengeluaran urin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7868} Jika mereka setara: Maliki, Hanbali, Abu Yusuf, dan Muhammad menganggap itu mayoritas, sementara Shafi'i dan Hanafi paling mungkin, tetapi beberapa Malik mengatakan urin dari vagina dua kali dan dari pria sekali menunjukkan feminitas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7869} Setelah pubertas, masalah menjadi jelas berdasarkan penyebabnya: menumbuhkan jenggot, ejakulasi, rahim wanita atau mencapai pria, menstruasi, susu, atau kemungkinan hubungan seksual dengan wanita, persalinan pasti femininitas, dan kecenderungan terhadap pria dan wanita, dan terhadap wanita adalah pria, dan jika genap, maka bermasalah; dan istilah hermaprodit dalam yurisprudensi berarti bermasalah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7869} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7869} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7870} Putusan tentang hermaprodit yang diragukan: Pendekatan paling hati-hati dan dapat diandalkan diambil, dan keputusan tidak didasarkan pada penetapan keputusan yang meragukan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7870} 'awrah: 'awrah wanita menurut Hanafi dan Syafi'i, serta tangan, kaki, suara, dan lengan hermafrodit dirinci secara rinci; Maliki menutupi dengan cara paling hati-hati seperti wanita dalam doa dan ziarah; dan Hanbal seperti pria. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7870} Membatalkan wudhu dengan menyentuh bagian pribadi: Hanafi dan Malik dalam satu narasi tidak membatalkannya, Maliki dan Shafi'i di sekolah membatalkannya, dan Hanbalis menentukan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7870} Ghusl dengan penetrasi tanpa ejakulasi: Ini tidak wajib menurut Hanafi, Shafi'i, dan Hanbali, berbeda dengan Maliki; dan seruan untuk berdoa dari hermafrodit tidak sah secara konsensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7870} Baris dan kepemimpinan: Hermaprodit berdiri setelah pria dan anak laki-laki dan di depan wanita; imam berdiri di sebelah kanannya menurut Hanbali; kepemimpinan hermaprodit untuk pria tidak sah, tetapi untuk wanita sah menurut Hanafi, Shafi'i, dan Hanbali, dan dia berdiri di depan mereka, bukan di antara mereka, sesuai dengan mayoritas mereka; dan Malik melarang imamatnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7870} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7871} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7871} Haji dan Ihram: Orang hermafrodit adalah seperti perempuan dalam kondisi Haji menurut mayoritas, dan Haji hanya dilakukan dengan mahram; menurut Hanbali, tidak ada fidya jika kepala atau wajah tertutup, dan fidya jika keduanya tertutup. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7871} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7872} Melihat dan menyendiri: tidak ada yang boleh bepergian kecuali mahram di antara pria, dan tidak boleh dibuka untuk wanita atau laki-laki sebagai tindakan pencegahan; dan tukang kunci Shafi'i mengizinkan hal ini sebagai praduga karena aturan minoritas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7872} Pernikahan: Kaum Hanafi mengatakan bahwa jika ayahnya menikahkannya dengan seorang pria dan ia telah mendapatkannya, maka diperbolehkan; jika tidak, itu akan tertunda seperti 'anin'; Maliki dan Shafi'i melarangnya menikah dari kedua sisi; Hanbal merujuk pada pandangannya tentang kecenderungan, dan Abu Bakr tidak mengizinkannya sampai kasusnya dijelaskan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7873} Menyusui: susunya tidak menetapkan larangan menurut mayoritas Hanabi dan Hanbali; Maliki menganggap larangan menyebarkan larangan secara analogi pada kemurnian dan ketidakmurnian; Syafi'i dan Ibn Hamid menghentikan masalah ini. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.m. 7873} Pengakuan: Jika ia mengakui apa yang mengurangi warisan atau uang darahnya sebelumnya dan melebihinya, maka itu tidak diterima. Dalam ibadah, pernyataannya diterima; kesaksian: seperti perempuan, dan wanita dianggap sebagai perempuan. Penghakimannya tidak berlaku menurut Maliki, Shafi'i, dan Hanbali; Hanafi membenarkannya dalam kasus selain hukuman. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7874} Qisa: Ia membunuh seorang pria dan seorang wanita, membunuh mereka; dalam kasus ekstremis, ia dihukum menurut Maliki, Shafi'i, dan Hanbali, tetapi tidak ada qisa menurut Hanafi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7874} Diyya: Hanafi mulai membicarakannya saat pembunuhan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7874} Diyah: Malikis dan Hanbalis membutuhkan setengah diyya untuk laki-laki dan setengah untuk perempuan agar status laki-laki dan perempuan; Shafi'i membutuhkan diyya untuk perempuan karena itu pasti; Hanafi dan Shafi'i membutuhkan setengah uang darah untuk laki-laki untuk luka; Malikis dan Hanbal menyamakan laki-laki dengan sepertiga. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7875} Hermafrodit tidak termasuk dalam 'aqilah; jika seorang laki-laki terungkap, para Shafi'i didenda bagiannya dari apa yang telah dibayar orang lain; dan Qasama: Hanafi dan Hanbal mengatakan itu tidak berlaku; Maliki dan Hanbal mengatakan mereka membagi; dan Shafi'i bersumpah pada mayoritas dan menghentikan sisanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7875} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm. 7876} Hukuman untuk fitnah: Maliki dan Shafi'i mewajibkannya jika ia mencemarkan bagian pribadi pria, dan jika ia berzina dengan salah satu dari mereka, tidak ada hukuman; Hanafi tidak memiliki hukuman untuk hermafrodit dan mereka adalah 'azar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7876} Sunat: Hanafi mengizinkannya untuk anak di bawah umur yang tidak menginginkan pria atau wanita; Malik melarangnya sebagai tindakan pencegahan; Shafi'i melarangnya baik saat masa kanak-kanak maupun pubertas; dan Hanbal menyunat sebagai tindakan pencegahan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7876} Mengenakan sutra, emas, dan perak: Mayoritas ahli hukum melarangnya; Hanafi tidak menyukainya sebagai tindakan pencegahan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7876} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7877} Ghusl, kain kain kain, dan pemakaman: Para Hanafi tidak mencucinya baik oleh pria maupun wanita, melainkan oleh imam; para Syafi'i menetapkan: jika masih muda, diperbolehkan bagi pria dan wanita untuk mencucinya, tetapi jika sudah tua, harus dilakukan untuk kedua wajah; Hanbal mengharuskannya dilakukan dengan Salam jika berusia tujuh tahun; dibalut dengan lima pakaian putih seperti budak perempuan; diletakkan di antara pria dan wanita saat shalat; dan disarankan untuk mengucapkannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7877} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7878} Warisan: Malikis, Hanbalis, Abu Yusuf, dan Muhammad mewarisi setengah warisan laki-laki dan setengah warisan perempuan; Abu Hanifa adalah yang paling tidak pendiam; para Shafi'i memberinya kepastian dan menahan sisanya sampai masalah itu dijelaskan atau diselesaikan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7878}"
