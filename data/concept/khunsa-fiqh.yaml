label:
  ar: الخنثى
  en: Khuntha (the one of unclear sex)
  ur: خنثیٰ
summary:
  ar: 'الخنثى لغة الذي لا يخلص لذكر ولا أنثى، أو الذي له ما للرجال والنساء من الخنث أي اللين؛ واصطلاحا من له آلتا الرجال والنساء، أو من ليس له شيء منهما وله ثقب يخرج منه البول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7867} يفترق عن المخنث، وهو الذي يتشبه بالنساء في اللين والكلام والحركة؛ فمن كان كذلك بخلقه فلا إثم عليه، والمتكلف للتشبه ملعون في الأحاديث الصحيحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7867}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7868} الخنثى غير المشكل تظهر فيه علامات الذكورة أو الأنوثة فيكون حكمه حكم ما ظهرت فيه؛ والمشكل لا تظهر علاماته أو تتعارض، وهو نوعان: من له آلتان واستوت علاماته، ومن لا آلة له وله ثقب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7868} يتحدد نوعه قبل البلوغ بالبول: إن بال من الذكر فغلام، وإن بال من الفرج فأنثى، وإن بال منهما فالسابق؛ ويستدل الجمهور بأثر ابن عباس ويرون أن منفعة الآلة عند الانفصال خروج البول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7868}'
  en: 'Khuntha is lexically one who is neither purely male nor female, or who has the features of both, from khanth, softness; technically one with both sets of organs, or with neither and only an opening for urine. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7867} It differs from the mukhannath, one who imitates women in softness, speech and movement; one made so by birth is not blamed, while one who imitates by choice is cursed in the sound reports. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7867}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7868} A clear khuntha shows male or female signs and is judged by them; an unclear one has no clear signs or contrary ones, and is of two kinds: both organs with equal signs, or no organ but an opening. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7868} Before puberty the sex is set by urination: from the penis, a boy; from the vagina, a girl; from both, the earlier; the majority rely on the report of Ibn Abbas and hold that the function at birth is urination. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7868}'
  ur: 'خنثیٰ لغت میں وہ جو نہ خالص مرد ہو نہ عورت، یا جس میں دونوں کی خصوصیات ہوں؛ اصطلاح میں وہ شخص جس کے مرد و عورت دونوں کے آلات ہوں، یا کوئی آلہ نہ ہو اور صرف پیشاب کا سوراخ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7867} مخنث وہ ہے جو عورتوں کی طرح نرمی، کلام اور حرکت میں مشابہت اختیار کرے؛ جو پیدائشی ایسا ہو اس پر گناہ نہیں، جو جان بوجھ کر مشابہت اختیار کرے اس پر صحیح احادیث میں لعنت ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7867}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7868} واضح خنثیٰ میں علامات کے مطابق حکم؛ مشکل میں علامات ظاہر نہ ہوں یا متضاد ہوں، اور وہ دو قسم کا: دونوں آلات والا جس میں علامات برابر، اور صرف سوراخ والا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7868} بلوغ سے پہلے پیشاب سے تعین: ذکر سے ہو تو لڑکا، فرج سے ہو تو لڑکی، دونوں سے ہو تو جو پہلے ہو؛ جمہور ابن عباس کے اثر سے استدلال کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7868}'
