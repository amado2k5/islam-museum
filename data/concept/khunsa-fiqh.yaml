label:
  ar: الخنثى
  en: Khuntha (the one of unclear sex)
  ur: خنثیٰ
summary:
  ar: 'الخنثى لغة الذي لا يخلص لذكر ولا أنثى، أو الذي له ما للرجال والنساء من الخنث أي اللين؛ واصطلاحا من له آلتا الرجال والنساء، أو من ليس له شيء منهما وله ثقب يخرج منه البول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7867} يفترق عن المخنث، وهو الذي يتشبه بالنساء في اللين والكلام والحركة؛ فمن كان كذلك بخلقه فلا إثم عليه، والمتكلف للتشبه ملعون في الأحاديث الصحيحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7867}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7868} الخنثى غير المشكل تظهر فيه علامات الذكورة أو الأنوثة فيكون حكمه حكم ما ظهرت فيه؛ والمشكل لا تظهر علاماته أو تتعارض، وهو نوعان: من له آلتان واستوت علاماته، ومن لا آلة له وله ثقب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7868} يتحدد نوعه قبل البلوغ بالبول: إن بال من الذكر فغلام، وإن بال من الفرج فأنثى، وإن بال منهما فالسابق؛ ويستدل الجمهور بأثر ابن عباس ويرون أن منفعة الآلة عند الانفصال خروج البول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7868} إذا استويا: المالكية والحنابلة وأبو يوسف ومحمد يعتبرون الكثرة، والشافعية والحنفية الأكثر لا يرجح، وقال بعض المالكية إن البول من الفرج مرتين ومن الذكر مرة يدل على أنوثته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7869} بعد البلوغ يتبين الأمر بالأسباب: نبات اللحية أو الإنزال بالذكر أو إحبال امرأة أو الوصول إليها فرجل، والحيض أو اللبن أو إمكان الوطء فامرأة، والولادة قطعية الأنوثة، والميل: إلى الرجال فامرأة، وإلى النساء فرجل، وإن استوى فمشكل؛ وإطلاق الخنثى في الفقه يعني المشكل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7869}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7869}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} أحكام الخنثى المشكل: يؤخذ فيها بالأحوط والأوثق، ولا يحكم بثبوت حكم وقع الشك فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} العورة: كعورة المرأة عند الحنفية والشافعية، وكف الخنثى وقدميه وصوته وذراعيه بتفصيل؛ والمالكية يسترون بالأحوط كالمرأة في الصلاة والحج؛ والحنابلة كالرجل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} نقض الوضوء بلمس الفرج: الحنفية والمالكية في رواية لا ينقض، والمالكية في المذهب والشافعية ينقضان، والحنابلة يفصلون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} الغسل بالإيلاج بلا إنزال: لا يجب عند الحنفية والشافعية والحنابلة، خلافا للمالكية؛ والأذان من الخنثى لا يصح بالاتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} الصف والإمامة: يقف الخنثى بعد الرجال والصبيان وقبل النساء؛ والإمام يقيمه عن يمينه عند الحنابلة؛ وإمامة الخنثى للرجال لا تصح، وللنساء صحيحة عند الحنفية والشافعية والحنابلة، ويقوم أمامهن لا وسطهن عند جمهورهم؛ ومنع المالكية إمامته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7871}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7871} الحج والإحرام: الخنثى كالأنثى في شروط الحج عند الجمهور، ولا يحج إلا مع ذي محرم؛ والحنابلة لا فدية إن غطى رأسه أو وجهه وحده، وفدية إن غطاهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7871}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7872} النظر والخلوة: لا يخلو به غير محرم، ولا يسافر به غير محرم من الرجال، ولا يتكشف للنساء ولا للرجال احتياطا؛ والقفال من الشافعية أجاز ذلك استصحابا لحكم الصغر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7872} النكاح: الحنفية إن زوجه أبوه رجلا فوصل إليه جاز، وإلا أجل كالعنين؛ والمالكية والشافعية يمنعونه من النكاح من الجهتين؛ والحنابلة يرجعون إلى قوله في الميل، وأبو بكر لا يجيزه حتى يتبين أمره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7873} الرضاع: لبنه لا يثبت به التحريم عند الحنفية وجمهور الحنابلة؛ والمالكية يرون أنه ينشر الحرمة قياسا على الطهارة والحدث؛ والشافعية وابن حامد يوقفون الأمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7873} الإقرار: إن أقر بما يقلل ميراثه أو ديته قبل، وما يزيد لا يقبل، وفي العبادات يقبل قوله؛ الشهادة: كالأنثى، وتعد امرأة، وقضاؤه لا يصح عند المالكية والشافعية والحنابلة؛ والحنفية يصححونه في غير حد وقود. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7874} القصاص: يقتل به الرجل والمرأة، ويقتل بهما؛ وفي الأطراف يقتص عند المالكية والشافعية والحنابلة، ولا قصاص عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7874} الدية: يبدأ الكلام عنها عند الحنفية عند القتل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7874}'
  en: 'Khuntha is lexically one who is neither purely male nor female, or who has the features of both, from khanth, softness; technically one with both sets of organs, or with neither and only an opening for urine. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7867} It differs from the mukhannath, one who imitates women in softness, speech and movement; one made so by birth is not blamed, while one who imitates by choice is cursed in the sound reports. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7867}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7868} A clear khuntha shows male or female signs and is judged by them; an unclear one has no clear signs or contrary ones, and is of two kinds: both organs with equal signs, or no organ but an opening. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7868} Before puberty the sex is set by urination: from the penis, a boy; from the vagina, a girl; from both, the earlier; the majority rely on the report of Ibn Abbas and hold that the function at birth is urination. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7868} When the signs are equal: the Malikis, Hanbalis, Abu Yusuf and Muhammad hold that the greater quantity counts, reported from al-Awza''i; the majority say quantity is no proof. Some Malikis hold that urinating twice from the vagina and once from the penis shows he is female. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7869} After puberty the sex shows by beard or emission by the penis (male), by impregnating or being penetrated (male), by menses, milk or fitness for intercourse (female); birth shows female; inclination shows the opposite; equal inclination leaves him unclear, and in fiqh an unqualified khuntha means the unclear. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7869}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7869}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} The unclear khuntha is judged by the safer and firmer course, and no ruling whose ground is doubtful is applied. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} Awrah: as a woman\''s by the Hanafis and Shafiis, except the face and hands; the Malikis cover as a woman in prayer and pilgrimage; the Hanbalis as a man. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} Ablution and touch of the genitals: the Hanafis and a Maliki report say no; the Maliki school and the Shafiis say yes; the Hanbalis divide. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} Ghusl and penetration without emission: not required by the Hanafis, Shafiis and Hanbalis, unlike the Malikis; the call to prayer by a khuntha is not valid by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} Rows and leading the prayer: he stands after the men and boys and before the women; the Hanbalis have the imam place him at his right; leading men is invalid, leading women valid for the Hanafis, Shafiis and Hanbalis, standing in front of them; the Malikis forbid his leading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7871}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7871} Pilgrimage and ihram: he is like a woman in the conditions of the Hajj for the majority, and does not travel for it without a mahram; the Hanbalis require no expiation if he covers only the head or only the face, expiation if both. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7871}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7872} Looking and seclusion: no non-mahram may be alone with him or travel with him; he may not be uncovered before women or men in caution; al-Qaffal allowed it by the presumption of childhood. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7872} Marriage: the Hanafis allow it if his father marries him to a man who consummates, otherwise they postpone it as for the impotent; the Malikis and Shafiis forbid it on both sides; the Hanbalis rely on his inclination; Abu Bakr forbids marriage until his sex is clear. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7873} Suckling: his milk does not establish marriage bars for the Hanafis and most Hanbalis; the Malikis count it by analogy with purity; the Shafiis and Ibn Hamid suspend the matter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7873} Admission and testimony: his admission lowers his share of inheritance or blood-money is accepted; his claim to raise it is not; he is witness as a woman; his judgeship is not valid by the Malikis, Shafiis and Hanbalis, the Hanafis accepting it outside hadd and retaliation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7874} Retaliation: one who kills or is killed in retaliation may be killed for or by him; for injuries the Malikis, Shafiis and Hanbalis retaliate, the Hanafis do not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7874} Blood-money: the Hanafi discussion of the diya of the khuntha begins here and continues beyond p.7874. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7874}'
  ur: 'خنثیٰ لغت میں وہ جو نہ خالص مرد ہو نہ عورت، یا جس میں دونوں کی خصوصیات ہوں؛ اصطلاح میں وہ شخص جس کے مرد و عورت دونوں کے آلات ہوں، یا کوئی آلہ نہ ہو اور صرف پیشاب کا سوراخ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7867} مخنث وہ ہے جو عورتوں کی طرح نرمی، کلام اور حرکت میں مشابہت اختیار کرے؛ جو پیدائشی ایسا ہو اس پر گناہ نہیں، جو جان بوجھ کر مشابہت اختیار کرے اس پر صحیح احادیث میں لعنت ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7867}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7868} واضح خنثیٰ میں علامات کے مطابق حکم؛ مشکل میں علامات ظاہر نہ ہوں یا متضاد ہوں، اور وہ دو قسم کا: دونوں آلات والا جس میں علامات برابر، اور صرف سوراخ والا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7868} بلوغ سے پہلے پیشاب سے تعین: ذکر سے ہو تو لڑکا، فرج سے ہو تو لڑکی، دونوں سے ہو تو جو پہلے ہو؛ جمہور ابن عباس کے اثر سے استدلال کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7868} مساوی ہوں تو مالکیہ، حنابلہ، ابو یوسف اور محمد کثرت کا اعتبار کرتے ہیں (اوزاعی سے منقول)، جبکہ جمہور کثرت کو دلیل نہیں مانتے؛ بعض مالکیہ کے نزدیک فرج سے دو بار اور ذکر سے ایک بار پیشاب عورت ہونے کی دلیل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7869} بلوغ کے بعد: داڑھی یا ذکر سے انزال یا حمل ٹھہرانا یا وطی سے مرد؛ حیض، دودھ یا امکانِ وطی سے عورت؛ ولادت قطعی طور پر عورت؛ میلان مردوں کی طرف عورت اور عورتوں کی طرف مرد؛ برابر ہوں تو مشکل؛ فقہ میں مطلق خنثیٰ سے مراد مشکل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7869}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} مشکل خنثیٰ کے احکام میں احوط اور اوثق پر عمل کیا جاتا ہے، اور جس حکم کا ثبوت شک میں ہو اسے ثابت نہیں مانا جاتا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} ستر: حنفیہ اور شافعیہ کے نزدیک عورت کی طرح، سوائے چہرے اور ہتھیلیوں کے؛ مالکیہ نماز و حج میں احوط کے مطابق عورت کی طرح ڈھانپتے ہیں؛ حنابلہ مرد کی طرح۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} فرج چھونے سے وضو: حنفیہ اور مالکیہ کی ایک روایت میں نہیں ٹوٹتا؛ مالکیہ کے مذہب اور شافعیہ میں ٹوٹتا ہے؛ حنابلہ تفصیل کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} غسل: بغیر انزال کے ایلاج سے حنفیہ، شافعیہ اور حنابلہ کے نزدیک واجب نہیں؛ مالکیہ مختلف ہیں؛ خنثیٰ کی اذان بالاتفاق صحیح نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870} صف اور امامت: مردوں اور لڑکوں کے بعد اور عورتوں سے پہلے کھڑا ہوگا؛ حنابلہ امام اسے دائیں جانب کھڑا کرے؛ مردوں کی امامت باطل، عورتوں کی امامت حنفیہ، شافعیہ اور حنابلہ کے نزدیک صحیح، عورتوں کے آگے کھڑا ہو؛ مالکیہ منع کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7870}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7871}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7871} حج اور احرام: جمہور کے نزدیک حج کی شرائط میں عورت کی طرح؛ محرم کے بغیر حج نہیں؛ حنابلہ سر یا چہرہ اکیلا ڈھانپنے پر فدیہ نہیں، دونوں ڈھانپنے پر فدیہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7871}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7872} نظر اور خلوت: غیر محرم اس کے ساتھ تنہا نہ ہو اور نہ سفر کرے؛ احتیاطاً عورتوں اور مردوں کے سامنے بے پردہ نہ ہو؛ قفال نے بچپن کے استصحاب سے جائز کہا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7872} نکاح: حنفیہ کے نزدیک اگر باپ کسی مرد سے بیاہ دے اور وہ وطی کرے تو جائز، ورنہ عنین کی طرح مہلت؛ مالکیہ اور شافعیہ دونوں جانب سے ممنوع؛ حنابلہ اس کے میلان پر اعتماد کرتے ہیں، ابو بکر حقیقت واضح ہونے تک نکاح ناجائز کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7873} رضاع: حنفیہ اور جمہور حنابلہ کے نزدیک اس کے دودھ سے حرمت ثابت نہیں؛ مالکیہ طہارت پر قیاس کر کے حرمت مانتے ہیں؛ شافعیہ اور ابن حامد معاملہ موقوف رکھتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7873} اقرار اور شہادت: جو اقرار اس کی میراث یا دیت کم کرے قبول، زیادہ کرے نامقبول؛ عبادات میں قول قبول؛ شہادت عورت کی طرح؛ قضا مالکیہ، شافعیہ اور حنابلہ کے نزدیک صحیح نہیں، حنفیہ حد و قصاص کے سوا صحیح کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7874} قصاص: اس کو قتل کرنے پر مرد یا عورت قتل ہوگا، اور وہ دونوں کو قتل کرے گا؛ اعضاء میں مالکیہ، شافعیہ اور حنابلہ قصاص کے قائل، حنفیہ نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7874} دیت: حنفیہ کا بیان یہاں سے شروع ہو کر آگے جاری ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7874}'
