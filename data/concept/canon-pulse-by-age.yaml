summary:
  ar: "يصف ابن سينا نبض الصبيان والشبان والكهول والشيوخ، ويعلل كلاً بالقوة والحاجة {cite:canon-ibn-sina-print-v1 pp.176-177}."
  en: "Ibn Sina describes the pulse of children, young men, men in middle age and the old, and explains each by power and need {cite:canon-ibn-sina-print-v1 pp.176-177}."
