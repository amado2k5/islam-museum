  es: "Ibn Sina describe el pulso de los niños, los jóvenes, los hombres de mediana edad y los ancianos, y explica cada uno por su poder y necesidad {cite:canon-ibn-sina-print-v1 pp.176-177}."
  ur: "ابن سینا بچوں، جوانوں، درمیانی عمر کے مردوں اور بوڑھوں کی نبض کو بیان کرتا ہے اور ہر ایک کی طاقت اور ضرورت کی وضاحت کرتا ہے۔"
  tr: "İbn Sina, erkeklerin, gençlerin, yaşlıların ve yaşlıların nabzını anlatır ve her birini güç ve ihtiyaçla açıklar {cite:canon-ibn-sina-print-v1 s.176-177}."
  id: "Ibn Sina menggambarkan denyut nadi anak laki-laki, remaja, orang tua, dan orang tua, serta menjelaskan masing-masing berdasarkan kekuatan dan kebutuhan {cite:canon-ibn-sina-print-v1 hlm.176-177}."
