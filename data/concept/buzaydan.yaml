id: concept/buzaydan
class: concept
kind: natural
label:
  ar: "بوزيدان"
  en: "Buzaydan (an Indian woody drug)"
  fr: "Buzaydan (drogue ligneuse indienne)"
  ur: "بوزیدان"
  es: "Buzaydan (una droga leñosa de la India)"
  tr: "Bouzidan"
  id: "Bouzidan"
summary:
  ar: "دواء خشبي هندي فيه مشابهة لقوة البهمن. حار في الثانية يابس في الأولى، ملطّف. أجوده الأبيض الغليظ الكثير الخطوط الخشن، والأملس الدقيق العود القليل البياض رديء. ينفع من وجع المفاصل والنقرس، ويزيد في الباه، وينفع من السموم {cite:canon-ibn-sina-print-v1 p.399}، {cite:canon-ibn-sina-print-v1 p.400}."
  en: "An Indian woody drug with some likeness to the power of bahman. Hot in the second degree and dry in the first; dissolving. The best is the thick, white, rough kind with many lines; the smooth, thin-stemmed and less white kind is poor, and it is adulterated with a Berber imitation. It helps pains of the joints and gout, increases desire, and helps against poisons {cite:canon-ibn-sina-print-v1 p.399}, {cite:canon-ibn-sina-print-v1 p.400}."
  fr: "Drogue ligneuse indienne dont le pouvoir rappelle le bahman. Chaude au deuxième degré, sèche au premier, résolutive. La meilleure serait épaisse, blanche, rude, très striée ; la lisse, à tige fine et moins blanche, médiocre, falsifiée par une imitation berbère. Selon le livre, elle aiderait douleurs articulaires et goutte, augmenterait le désir et aiderait contre les poisons {cite:canon-ibn-sina-print-v1 p.399}, {cite:canon-ibn-sina-print-v1 p.400}."
  ur: "یہ ہندی لکڑی جیسی دوا ہے جو بہمن کی قوت سے کچھ مشابہت رکھتی ہے۔ دوسرے درجے میں گرم اور پہلے میں خشک، تحلیل کرنے والی۔ سب سے اچھی موٹی، سفید اور کھردری اور دھاریوں والی ہے؛ ملائم، باریک تنے والی اور کم سفید خراب ہے، اور اس میں بربری نقل ملائی جاتی ہے۔ یہ جوڑوں کے درد اور گٹھیا میں نفع دیتی ہے، شہوت بڑھاتی ہے، اور زہروں میں نفع دیتی ہے {cite:canon-ibn-sina-print-v1 p.399}، {cite:canon-ibn-sina-print-v1 p.400}۔"
  es: "Una droga amaderada india con cierta semejanza al poder del bahman. Caliente en segundo grado y seca en primero; disolvente. La mejor es la variedad gruesa, blanca y áspera con muchas vetas; la variedad lisa, de tallo delgado y menos blanca es de mala calidad y está adulterada con una imitación bereber. Ayuda con los dolores de las articulaciones y la gota, aumenta el deseo y ayuda contra los venenos {cite:canon-ibn-sina-print-v1 p.399}, {cite:canon-ibn-sina-print-v1 p.400}."
  tr: "Bahman'ın gücüne benzer bir Hint ahşap ilacı. İkincisi sıcak, ilkisi kuru, yatıştırıcı. Zengin, kalın beyaz, birçok pürüzlü çizgi ile pürüzsüz ve hassastır, az da olsa beyaz ud zayıftır. Eklem ağrısı ve gut için faydalıdır, solgunluğu artırır ve toksinlere karşı faydalıdır {cite:canon-ibn-sina-print-v1 s.399}, {cite:canon-ibn-sina-print-v1 s.400}."
  id: "Obat kayu India yang mirip dengan kekuatan Bahman. Panas di bagian kedua, kering di bagian pertama, menenangkan. Putih tebal yang kaya dengan banyak garis kasar, halus dan presisi, dan sedikit oud putih kurang bagus. Obat ini bermanfaat untuk nyeri sendi dan asam urat, meningkatkan warna pucat, dan bermanfaat melawan racun {cite:canon-ibn-sina-print-v1 hlm.399}, {cite:canon-ibn-sina-print-v1 hlm.400}."
