id: concept/nasiha
education:
  did_you_know:
    ar: "النصيحة إرادة الخير للمنصوح إرادةً وفعلاً؛ جاء في حديث تميم الداري «الدين النصيحة» لله ولكتابه ولرسوله ولأئمة المسلمين وعامتهم."
    en: "Nasiha is willing good for the one counselled, in will and in deed; Tamim al-Dari's hadith sums the religion itself as 'sincere counsel' — to God, His book, His messenger, the Muslims' leaders and their community."
    ur: "نصیحہ دوسرے کے لیے بھلائی چاہنا ہے، نیت اور عمل دونوں میں؛ تمیم داری کی حدیث دین کو «نصیحت» قرار دیتی ہے — اللہ، اس کی کتاب، رسول اور مسلمانوں کے ائمہ و عوام کے لیے۔"
    sources: [source/sahih-muslim, source/ibn-rajab-jami-ulum-hikam]
class: concept
kind: ethical
label:
  ar: النصيحة
  en: Nasiha (sincere counsel)
summary:
  ar: "إرادة الخير للمنصوح له والقيام له بوجوه الخير إرادة وفعلاً؛ جاء في حديث تميم الداري أن «الدين النصيحة» لله ولكتابه ولرسوله ولأئمة المسلمين وعامتهم {cite:sahih-muslim 55}، وينقل ابن رجب عن الخطابي أن أصل النصح في اللغة الخلوص، وأن معناه لله صحة الاعتقاد في وحدانيته وإخلاص النية في عبادته، ولكتابه الإيمان به والعمل بما فيه، ولرسوله التصديق بنبوته وبذل الطاعة له فيما أمر به ونهى عنه، ولعامة المسلمين إرشادهم إلى مصالحهم؛ وعن ابن الصلاح تفصيل النصيحة لكل من هؤلاء، وروى النصح في بيعة جرير بن عبد الله «على إقام الصلاة وإيتاء الزكاة والنصح لكل مسلم»، وعن أبي داود أنه أحد الأحاديث التي يدور عليها الفقه، وعن محمد بن أسلم الطوسي أنه أحد أرباع الدين."
  en: "Wishing good for the one counselled and standing for him in the ways of good in will and deed; in Tamim al-Dari's hadith 'the religion is nasiha' — to God, His book, His messenger, the leaders of the Muslims and their common folk — Ibn Rajab cites al-Khattabi that the root of nash in the language is purity, its meaning toward God being sound belief in His oneness and sincere intention in worshipping Him, toward His book faith in it and acting on what is in it, toward His messenger believing his prophethood and offering him obedience in what he commanded and forbade, and toward the generality of Muslims guiding them to their welfare; and he transmits Ibn al-Salah's detailed exposition of each, the pledge of Jarir ibn Abdullah 'to establish prayer, give zakat and counsel every Muslim', Abu Dawud's report that it is one of the hadiths around which jurisprudence revolves, and Muhammad ibn Aslam al-Tusi's that it is a quarter of the religion."
