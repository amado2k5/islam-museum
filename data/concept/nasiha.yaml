label:
  ar: النصيحة
  en: Nasiha (sincere counsel)
  es: "Consejo (consejo sincero)"
  fr: "Conseils (conseils sincères)"
  ur: "نصیحہ ⁦(مخلص مشورہ)⁩"
summary:
  ar: "إرادة الخير للمنصوح له والقيام له بوجوه الخير إرادة وفعلاً؛ جاء في حديث تميم الداري أن «الدين النصيحة» لله ولكتابه ولرسوله ولأئمة المسلمين وعامتهم {cite:sahih-muslim 55}، وينقل ابن رجب عن الخطابي أن أصل النصح في اللغة الخلوص، وأن معناه لله صحة الاعتقاد في وحدانيته وإخلاص النية في عبادته، ولكتابه الإيمان به والعمل بما فيه، ولرسوله التصديق بنبوته وبذل الطاعة له فيما أمر به ونهى عنه، ولعامة المسلمين إرشادهم إلى مصالحهم؛ وعن ابن الصلاح تفصيل النصيحة لكل من هؤلاء، وروى النصح في بيعة جرير بن عبد الله «على إقام الصلاة وإيتاء الزكاة والنصح لكل مسلم»، وعن أبي داود أنه أحد الأحاديث التي يدور عليها الفقه، وعن محمد بن أسلم الطوسي أنه أحد أرباع الدين."
  en: "Wishing good for the one counselled and standing for him in the ways of good in will and deed; in Tamim al-Dari's hadith 'the religion is nasiha' — to God, His book, His messenger, the leaders of the Muslims and their common folk — Ibn Rajab cites al-Khattabi that the root of nash in the language is purity, its meaning toward God being sound belief in His oneness and sincere intention in worshipping Him, toward His book faith in it and acting on what is in it, toward His messenger believing his prophethood and offering him obedience in what he commanded and forbade, and toward the generality of Muslims guiding them to their welfare; and he transmits Ibn al-Salah's detailed exposition of each, the pledge of Jarir ibn Abdullah 'to establish prayer, give zakat and counsel every Muslim', Abu Dawud's report that it is one of the hadiths around which jurisprudence revolves, and Muhammad ibn Aslam al-Tusi's that it is a quarter of the religion."
  es: "Deseando el bien a aquel a quien se aconseja y defendiéndolo en los caminos del bien en voluntad y obra; en el hadiz de Tamim al-Dari 'la religión es nasiha' — a Dios, Su libro, Su mensajero, los líderes de los musulmanes y su gente común — Ibn Rajab cita a al-Khattabi que la raíz de nash en el idioma es pureza, su significado hacia Dios es la creencia sólida en Su unicidad y la intención sincera de adorarlo, hacia Su libro fe en él y actuar según lo que está en él, hacia Su mensajero creer en su profecía y ofrecerle obediencia en lo que mandó y prohibió, y hacia la generalidad de los musulmanes guiarlos hacia su bienestar; y transmite la detallada exposición de Ibn al-Salah sobre cada uno de ellos, la promesa de Jarir ibn Abdullah de \"establecer la oración, dar el zakat y aconsejar a cada musulmán\", el informe de Abu Dawud de que es uno de los hadices en torno a los cuales gira la jurisprudencia, y el de Muhammad ibn Aslam al-Tusi de que es una cuarta parte de la religión."
  fr: "Souhaiter du bien à celui qui est conseillé et le soutenir dans la voie du bien, en volonté et en action; dans le hadith de Tamim al-Dari « la religion est nasiha » — envers Dieu, Son livre, Son messager, les dirigeants des musulmans et leurs fidèles — Ibn Rajab cite al-Khattabi selon lequel la racine de nash dans la langue est pureté, sa signification envers Dieu étant une croyance solide en Son unicité et une intention sincère de L'adorer, envers Son livre la foi en celui-ci et la mise en pratique de ce qui s'y trouve, envers Son messager la croyance en sa prophétie et l'obéissance à ses commandements et à ses interdictions, et envers la majorité des musulmans les guidant vers leur bien-être; et il transmet l'exposé détaillé d'Ibn al-Salah sur chacun d'eux, l'engagement de Jarir ibn Abdullah « d'établir la prière, de donner la zakat et de conseiller chaque musulman », le rapport d'Abu Dawud selon lequel il s'agit de l'un des hadiths autour desquels la jurisprudence s'articule, et celui de Muhammad ibn Aslam al-Tusi selon lequel il constitue un quart de la religion."
  ur: "جس کے لیے نصیحت کی گئی ہے اس کے لیے بھلائی کی تمنا کرنا اور اس کے لیے ارادہ اور عمل میں نیکی کی راہوں میں کھڑا ہونا؛ تمیم الداری کی حدیث میں \"دین ناصح ہے\" - خدا، اس کی کتاب، اس کے رسول، مسلمانوں کے قائدین اور ان کے عام لوگوں کے لئے - ابن رجب نے الخطابی کا حوالہ دیا ہے کہ زبان میں ناش کی جڑ پاکیزگی ہے، اس کا مطلب خدا کی وحدانیت پر پختہ یقین اور اس کی عبادت میں خلوص نیت، اس کی عبادت پر عمل کرنا اور اس پر عمل کرنا کتاب ہے۔ رسول اپنی نبوت پر ایمان لانا اور جس چیز کا اس نے حکم دیا اور جس سے منع کیا ہے اس کی اطاعت کرنا اور مسلمانوں کی عمومیت کی طرف ان کی فلاح و بہبود کی طرف رہنمائی کرنا۔ اور اس نے ابن الصلاح کی ہر ایک کے بارے میں تفصیلی بیان، جریر بن عبداللہ کا 'نماز قائم کرنے، زکوٰۃ دینے اور ہر مسلمان کو نصیحت کرنے کا عہد' نقل کیا، ابو داؤد کی رپورٹ کہ یہ ان احادیث میں سے ایک ہے جس کے گرد فقہ گھومتی ہے، اور محمد بن اسلم الطوسی کا کہ یہ مذہب کا ایک مذہب ہے۔"
