summary:
  ar: "ضفدع في الكتاب نقل أن رماده إذا جعل على موضع الدم حبسه، وأن مرقه نافع لأورام الأوتار، وفيما يقال إنه بادزهر الجذام والهوام كلها مأكولا، وينقل الكتاب قولا في الضفادع النهرية وأسنان الدواب، وفي أكل دمه أو جرمه ضرر منسوب إلى الكتاب {cite:canon-ibn-sina-print-v1 pp.721-722}"
  en: "Difda' is in the book reported to have ash that, placed on the place of bleeding, stops it, a broth beneficial for swellings of the tendons, and, as is said, an antidote (badzahr) for leprosy and all vermin when eaten; the book records a saying on river frogs and the teeth of animals, and a harm attributed to eating its blood or body {cite:canon-ibn-sina-print-v1 pp.721-722}"
  ur: "ضفدع کتاب میں نقل ہے کہ اس کی راکھ خون کی جگہ پر رکھی جائے تو اسے روک دیتی ہے، اس کا شوربہ پٹھوں کی نسوں کے ورموں میں نافع ہے، اور جیسا کہا جاتا ہے کھانے پر جذام اور تمام ہوام کا بادزہر ہے؛ کتاب دریائی مینڈکوں اور جانوروں کے دانتوں کے بارے میں ایک قول نقل کرتی ہے، اور اس کا خون یا جسم کھانے میں ایک نقصان کتاب سے منسوب ہے {cite:canon-ibn-sina-print-v1 pp.721-722}۔"
  es: "En el libro se menciona que Difda' contiene ceniza que, colocada sobre el lugar de la hemorragia, la detiene; un caldo beneficioso para la inflamación de los tendones; y, según se dice, un antídoto (badzahr) para la lepra y todos los parásitos cuando se ingiere. El libro recoge un dicho sobre las ranas de río y los dientes de los animales, y un daño atribuido a comer su sangre o su cuerpo {cite:canon-ibn-sina-print-v1 pp.721-722}."
