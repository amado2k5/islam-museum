label:
  ar: "العَلَقَة"
  en: "The clot stage of the embryo (alaqa) and the rulings on its loss"
  fr: "Le stade du caillot dans la formation de l’embryon (alaqa) et les règles relatives à sa perte"
  ur: "علقہ ⁦(جنین کا ایک مرحلہ)⁩"
  es: "La fase de coagulación del embrión (alaqa) y las normas relativas a su pérdida."
  tr: "Sülük"
  id: "Lintah"
summary:
  ur: "جما ہوا گاڑھا خون — جنین کا دوسرا مرحلہ جس سے مضغہ بنتا ہے اور جس سے پہلے نطفہ آتا ہے۔"
  ar: "العلقة في اللغة الدم الجامد الغليظ، وقيل ما يجمد قبل أن ييبس، وهي طور من أطوار الجنين تتخلق منه المضغة، وتسبقها النطفة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11791}. وذهب جمهور الفقهاء من المالكية والشافعية والحنابلة إلى حرمة إسقاط العلقة، وأباح الحنفية إسقاط الحمل قبل مائة وعشرين يوماً على ما فصلوه، وحملها بعضهم على حال العذر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11791} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11792}. ولا تجب الغرة عند جمهور الفقهاء بإلقاء العلقة، وأوجبها المالكية {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11792}. وذهب جمهور الفقهاء إلى أن المرأة بإسقاط العلقة لا تعتبر نفساء، وذهب المالكية إلى أنها تعتبر نفساء وتنقضي بها العدة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11792}."
  en: "In the lexicon, alaqa is thick coagulated blood, or blood that clots before it dries; it is a stage in the formation of the embryo, from which the lump of flesh develops, and it follows the drop of semen {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11791}. The Malikis, Shafi'is and Hanbalis hold that causing the loss of the clot is forbidden; the Hanafis allow the loss of a pregnancy before a hundred and twenty days on conditions they set out, and some read this as limited to necessity {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11791} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11792}. The majority do not require a ghurra for a lost clot, while the Malikis do {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11792}. The majority hold that a woman who loses a clot is not counted as in post-natal bleeding, while the Malikis count her so, and a waiting period ends with it {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11792}."
  fr: "Dans le lexique, alaqa désigne du sang épais coagulé, ou du sang qui se coagule avant de sécher. C’est un stade de la formation de l’embryon, à partir duquel se développe le morceau de chair et qui suit celui de la goutte de semence {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11791}. Les malékites, les chaféites et les hanbalites tiennent pour interdit de provoquer la perte du caillot ; les hanafites permettent d’interrompre une grossesse avant cent vingt jours, sous certaines conditions qu’ils exposent, et certains interprètent cette permission comme limitée aux cas de nécessité {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11791} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11792}. La majorité n’exige pas de ghurra en cas de perte du caillot, tandis que les malékites en exigent une {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11792}. La majorité ne considère pas que la femme qui perd un caillot est en état de lochies, contrairement aux malékites ; le délai d’attente prend alors fin {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11792}."
  es: "En el léxico, alaqa es sangre espesa coagulada, o sangre que se coagula antes de secarse; es una etapa en la formación del embrión, a partir de la cual se desarrolla el bulto de carne, y sigue a la gota de semen {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11791}. Los malikíes, shafiíes y hanbalíes sostienen que está prohibido causar la pérdida del coágulo; los hanafíes permiten la pérdida de un embarazo antes de los ciento veinte días bajo ciertas condiciones que establecen, y algunos interpretan esto como limitado a la necesidad {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11791} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11792}. La mayoría no requiere una ghurra por la pérdida de un coágulo, mientras que los malikíes sí {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11792}. La mayoría sostiene que una mujer que pierde un coágulo no se considera en sangrado posparto, mientras que los malikíes sí, y el período de espera termina con ello {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11792}."
  tr: "Dilbilimde 'alaqah' kalın, katı kanı ifade eder ve kanın kurumadan önce donduğu söylenir. Embriyonun oluştuğu embriyo aşamasıdır ve bir damla ile başlar {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11791}. Malikiler, Şafi'ler ve Hanbalilerden olan hukukçuların çoğu, sülüğün kürtajını yasakladığını hükmederken, Hanafiler belirtildiği gibi yüz yirmi günden önce kürtaja izin verirken, bazıları bunu bir bahane olarak yorumlamıştır {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11791} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11792}. Hukukçuların çoğuna göre, la'qah'ın atılması ghura zorunlu değildir ve Maliki yetkilileri bunu zorunlu kılmıştır {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11792}. Hukukçuların çoğu, la'kah'tan çıkarılan bir kadının doğum sonrası olarak kabul edilmediğini, Malikiler ise kadının doğum sonrası olarak kabul edildiğini ve bekleme süresinin böylece sona erdiğini savunmuştur {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11792}."
  id: "Dalam linguistik, 'alaqah' merujuk pada darah yang kental dan padat dan dikatakan membeku sebelum mengering. Ini adalah tahap embrio di mana embrio terbentuk dan dimulai dengan tetesan {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11791}. Sementara sebagian besar ahli hukum dari Maliki, Shafi'i, dan Hanbali memutuskan bahwa lintah melarang aborsi, Hanafi mengizinkan aborsi sebelum seratus dua puluh hari seperti yang disebutkan, sementara beberapa menafsirkan ini sebagai alasan {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11791} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11792}. Menurut sebagian besar ahli hukum, penghapusan la'qah tidak wajib bagi ghura dan otoritas Maliki telah mewajibkannya {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11792}. Sebagian besar ahli hukum berpendapat bahwa wanita yang dikeluarkan dari la'kah tidak dianggap pasca melahirkan, sementara Maliki berpendapat bahwa wanita dianggap pasca melahirkan sehingga masa tunggu berakhir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11792}."
