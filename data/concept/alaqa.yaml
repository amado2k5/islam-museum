label:
  ar: "العَلَقَة"
  en: "The clot stage of the embryo (alaqa) and the rulings on its loss"
  ur: "علقہ (جنین کا ایک مرحلہ)"
summary:
  ar: "العلقة في اللغة الدم الجامد الغليظ، وقيل ما يجمد قبل أن ييبس، وهي طور من أطوار الجنين تتخلق منه المضغة، وتسبقها النطفة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11791}. وذهب جمهور الفقهاء من المالكية والشافعية والحنابلة إلى حرمة إسقاط العلقة، وأباح الحنفية إسقاط الحمل قبل مائة وعشرين يوماً على ما فصلوه، وحملها بعضهم على حال العذر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11791} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11792}. ولا تجب الغرة عند جمهور الفقهاء بإلقاء العلقة، وأوجبها المالكية {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11792}. وذهب جمهور الفقهاء إلى أن المرأة بإسقاط العلقة لا تعتبر نفساء، وذهب المالكية إلى أنها تعتبر نفساء وتنقضي بها العدة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11792}."
  en: "In the lexicon, alaqa is thick coagulated blood, or blood that clots before it dries; it is a stage in the formation of the embryo, from which the lump of flesh develops, and it follows the drop of semen {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11791}. The Malikis, Shafi'is and Hanbalis hold that causing the loss of the clot is forbidden; the Hanafis allow the loss of a pregnancy before a hundred and twenty days on conditions they set out, and some read this as limited to necessity {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11791} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11792}. The majority do not require a ghurra for a lost clot, while the Malikis do {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11792}. The majority hold that a woman who loses a clot is not counted as in post-natal bleeding, while the Malikis count her so, and a waiting period ends with it {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11792}."
