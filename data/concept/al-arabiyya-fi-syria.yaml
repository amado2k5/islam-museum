label:
  ar: "العربية في سوريا"
  en: "Arabic in Syria"
  ur: "شام میں عربی"
  fr: "L'arabe en Syrie"
  es: "El árabe en Siria"
summary:
  ar: "ما وُجد عن العربية في سوريا: المادة 4 من نص دستور 2012 كما يعرضه Constitute وهو مصنّف فيه «تاريخي»، ووصف دراسة مكتبة الكونغرس للعربية السورية ومواقف الناس من المحكية، وتصنيف الشامية عند مانشستر وGlottolog، مع بيان الخلاف بين المصادر وما لم يُعثر عليه. وأُضيف نص الحكم الدستوري بلغته الأصلية كما ورد في ملخص بحثي لم يتحقق المتحف منه على الصفحة."
  en: "What was found on Arabic in Syria: Article 4 of the 2012 constitution as the Constitute Project shows it, where the text is marked \"Historical\", the Library of Congress study's account of Syrian Arabic and of attitudes to the spoken form, and the Levantine classification at Manchester and Glottolog, with the differences between sources and what was not found. The constitutional text is added in its original wording, as supplied in a research summary that the museum did not check against the page."
  ur: "شام میں عربی کے بارے میں جو ملا: 2012 کے دستور کی دفعہ 4 جیسا Constitute دکھاتا ہے جہاں متن «تاریخی» درج ہے، لائبریری آف کانگریس کی تحقیق کا شامی عربی اور بولی کی طرف رویوں کا بیان، اور مانچسٹر اور Glottolog میں شامی گروہ کی درجہ بندی، مآخذ کے اختلاف اور جو نہیں ملا اس کے ساتھ۔ آئینی حکم کی عبارت اصل زبان میں شامل کی گئی ہے، جیسی ایک تحقیقی خلاصے میں ملی جسے متحف نے صفحے سے نہیں جانچا۔"
  fr: "Ce qui a été trouvé sur l'arabe en Syrie : l'article 4 de la constitution de 2012 tel que le montre le Constitute Project, où le texte est marqué « historique », le compte rendu de l'étude de la Bibliothèque du Congrès sur l'arabe syrien et les attitudes envers le parlé, et la classification levantine chez Manchester et Glottolog, avec les différences entre sources et ce qui n'a pas été trouvé. Le texte constitutionnel est ajouté dans sa langue d'origine, tel que fourni par un résumé de recherche que le musée n'a pas vérifié sur la page."
  es: "Lo que se encontró sobre el árabe en Siria: el artículo 4 de la constitución de 2012 tal como lo muestra el Constitute Project, donde el texto está marcado «histórico», el relato del estudio de la Biblioteca del Congreso sobre el árabe sirio y las actitudes hacia el hablado, y la clasificación levantina en Manchester y Glottolog, con las diferencias entre fuentes y lo que no se halló. Se añade el texto constitucional en su lengua original, tal como lo entrega un resumen de investigación que el museo no verificó en la página."
