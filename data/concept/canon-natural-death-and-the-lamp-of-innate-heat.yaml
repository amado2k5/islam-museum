id: concept/canon-natural-death-and-the-lamp-of-innate-heat
class: concept
kind: scientific
label:
  ar: "الموت الطبيعي ومثال السراج"
  en: "Natural death and the lamp of innate heat"
  fr: "Mort naturelle et lampe de la chaleur innée"
  ur: "طبعی موت اور چراغ کی مثال"
  es: "La muerte natural y la lámpara del calor innato"
summary:
  ar: "يشرح ابن سينا الموت الطبيعي بأن الحرارة الغريزية تجفف الرطوبات حتى تفنى، فتصير بالعرض سبباً لإطفاء نفسها، كالسراج يطفأ إذا فنيت مادته، فإذا تم الجفاف طفئت الحرارة وكان الموت الطبيعي {cite:canon-ibn-sina-print-v1 p.201}."
  en: "Ibn Sina explains natural death: the innate heat dries the moistures until they are spent, so it becomes, incidentally, a cause of putting itself out, like a lamp that goes out when its fuel is used up; when the drying is complete the heat is extinguished and natural death follows {cite:canon-ibn-sina-print-v1 p.201}."
  fr: "Ibn Sina explique la mort naturelle par dessiccation des humidités jusqu’à épuisement : la chaleur innée causerait ainsi accidentellement sa propre extinction, comme une lampe sans combustible ; dessiccation complète, extinction puis mort {cite:canon-ibn-sina-print-v1 p.201}."
  es: "Ibn Sina explica la muerte natural: el calor innato seca la humedad hasta que se agota, por lo que se convierte, incidentalmente, en una causa de su propia extinción, como una lámpara que se apaga cuando se agota su combustible; cuando el secado es completo, el calor se extingue y sobreviene la muerte natural {cite:canon-ibn-sina-print-v1 p.201}."
  ur: "ابن سینا فطری موت کی وضاحت کرتے ہیں: فطری گرمی نمی کو خشک کر دیتی ہے جب تک کہ وہ ضائع نہ ہو جائیں، اس لیے یہ اتفاق سے خود کو بجھانے کا سبب بن جاتی ہے، جیسے ایک چراغ جو اس کا ایندھن استعمال ہونے پر بجھ جاتا ہے۔ جب خشک ہونا مکمل ہو جاتا ہے تو گرمی بجھ جاتی ہے اور قدرتی موت اس کے بعد ہوتی ہے {cite:canon-ibn-sina-print-v1 p.201}"
