label: { ar: "الموت الطبيعي ومثال السراج", en: "Natural death and the lamp of innate heat", ur: "طبعی موت اور چراغ کی مثال" }
summary:
  ar: "يشرح ابن سينا الموت الطبيعي بأن الحرارة الغريزية تجفف الرطوبات حتى تفنى، فتصير بالعرض سبباً لإطفاء نفسها، كالسراج يطفأ إذا فنيت مادته، فإذا تم الجفاف طفئت الحرارة وكان الموت الطبيعي {cite:canon-ibn-sina-print-v1 p.201}."
  en: "Ibn Sina explains natural death: the innate heat dries the moistures until they are spent, so it becomes, incidentally, a cause of putting itself out, like a lamp that goes out when its fuel is used up; when the drying is complete the heat is extinguished and natural death follows {cite:canon-ibn-sina-print-v1 p.201}."
