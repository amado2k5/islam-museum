summary:
  ar: "اللعبة البربرية شيء كالسورنجان يجلب من نواحي أفريقية يغش به السورنجان، حارة في الثالثة، وفيها ذكر لتحريك الباه {cite:canon-ibn-sina-print-v1 p.541}."
  en: "Lu'ba barbariyya is something like colchicum (surinjan), brought from the regions of Ifriqiya and used to adulterate it; hot in the third degree, with a listing about stirring desire {cite:canon-ibn-sina-print-v1 p.541}."
  ur: "لعبہ بربریہ سورنجان جیسی ایک چیز ہے جو افریقیہ کے علاقوں سے لائی جاتی ہے اور اس سے سورنجان میں ملاوٹ کی جاتی ہے؛ تیسرے درجے میں گرم، اور باہ کو حرکت دینے کا ایک بیان ہے {cite:canon-ibn-sina-print-v1 p.541}۔"
  es: "Lu'ba barbariyya es algo parecido al colchicum (surinjan), traído de las regiones de Ifriqiya y usado para adulterarlo; caliente en tercer grado, con una lista sobre despertar el deseo {cite:canon-ibn-sina-print-v1 p.541}."
