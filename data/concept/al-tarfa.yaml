id: "concept/al-tarfa"
class: "concept"
kind: "scientific"
label:
  ar: "الطرفة"
  en: "Tarfa (blood spot in the eye)"
  fr: "Tarfa (tache de sang dans l’œil)"
  ur: "طرفہ"
  es: "Tarfa (mancha de sangre en el ojo)"
summary:
  ar: "الطرفة نقطة من دم طري أحمر أو عتيق مائت أكبد أسود قد سال عن بعض العروق المنفجرة في العين بضربة مثلاً أو لسبب آخر مفجر للعروق من امتلاء أو ورم حتى يعتق فيه، وربما كان عن غليان الدم في العروق، وربما حدث عن الطرفة الضربية خرق لطيف في الحدقة والذي في الملتحمة من الخرق أسلم ⁦(أسماء الأدوية والأكحال والأضمدة لا تحمل)⁩ {cite:canon-ibn-sina-print-v2 p.187}"
  en: "The tarfa is a spot of blood — fresh and red, or old, dying, dark and black — that has flowed from a burst vessel in the eye, by a blow for example or another vessel-bursting cause, from repletion or swelling till it settles in it; it may be from the blood's boiling in the vessels; the traumatic tarfa may cause a fine rupture in the pupil, while a rupture in the conjunctiva is safer ⁦(the drug, kohl and poultice names are not carried)⁩ {cite:canon-ibn-sina-print-v2 p.187}"
  fr: "La tarfa est une tache de sang — frais et rouge, ou ancien, mortifié, sombre et noir — qui s’est écoulé d’un vaisseau rompu dans l’œil, à la suite par exemple d’un coup ou d’une autre cause de rupture, comme la réplétion ou l’enflure, et qui y a séjourné. Elle peut provenir de l’ébullition du sang dans les vaisseaux. La tarfa d’origine traumatique peut causer une fine déchirure de la pupille, tandis qu’une déchirure de la conjonctive est moins dangereuse ⁦(les noms des remèdes, des kohls et des cataplasmes ne sont pas reproduits)⁩ {cite:canon-ibn-sina-print-v2 p.187}"
  ur: "طرفہ خون کا ایک دھبہ ہے — تازہ سرخ یا پرانا مردہ گہرا سیاہ — جو آنکھ میں کسی پھٹی رگ سے بہا ہو مثلاً کسی ضرب سے یا رگوں پھاڑنے والے کسی اور سبب سے، امتلاء یا ورم سے یہاں تک کہ وہ اس میں جم جائے؛ اور رگوں میں خون کے ابال سے بھی ہو سکتا ہے؛ اور ضربی طرفہ حدقہ میں باریک خرق بھی پیدا کر سکتا ہے جبکہ ملتحمہ میں خرق زیادہ سلامت ہے ⁦(ادویہ، سرموں اور ضمادوں کے نام منقول نہیں)⁩ {cite:canon-ibn-sina-print-v2 p.187}"
  es: "La tarfa es una mancha de sangre —fresca y roja, o vieja, moribunda, oscura y negra— que ha brotado de un vaso sanguíneo roto en el ojo, por ejemplo, debido a un golpe u otra causa que provoque la rotura de un vaso, por acumulación o hinchazón hasta que se asienta en él; puede deberse a la ebullición de la sangre en los vasos; la tarfa traumática puede causar una pequeña rotura en la pupila, mientras que una rotura en la conjuntiva es menos peligrosa (no se incluyen los nombres del medicamento, kohl ni cataplasma) {cite:canon-ibn-sina-print-v2 p.187}"
