label: { ar: "أبوال الحيوانات والسيالات الشبيهة بالبول عند ابن سينا", en: "Animal urine and liquids resembling urine in the Canon", ur: "جانوروں کا پیشاب اور پیشاب سے ملتے جلتے مائعات قانون میں", es: "Orina animal y líquidos que se asemejan a la orina en el Canon", fr: "L'urine animale et les liquides ressemblant à l'urine dans le Canon", tr: "İbn Sina'ya göre hayvan idrarı ve idrar benzeri sıvılar", id: "Urin hewan dan cairan mirip urin menurut Avicenna" }
summary:
  ar: "يذكر ابن سينا في الفصلين الحادي عشر والثاني عشر أبوال الحيوانات للامتحان، وأشياء سيالة تشبه الأبوال، وكيف يفرق بينها، ثم يختم كلامه في البول. {cite:canon-ibn-sina-print-v1 pp.197-198}."
  en: "In chapters eleven and twelve Ibn Sina mentions animal urine for testing, and liquids that resemble urine and how to tell them apart, and then ends his treatment of urine. {cite:canon-ibn-sina-print-v1 pp.197-198}."
  es: "En los capítulos once y doce, Ibn Sina menciona la orina animal para realizar pruebas, así como líquidos que se asemejan a la orina y cómo distinguirlos, y luego finaliza su análisis de la orina. {cite:canon-ibn-sina-print-v1 pp.197-198}."
  fr: "Dans les chapitres onze et douze, Ibn Sina mentionne l'urine animale comme critère d'analyse, ainsi que les liquides qui ressemblent à l'urine et la manière de les distinguer, puis il conclut son exposé sur l'urine. {cite:canon-ibn-sina-print-v1 pp.197-198}."
  ur: "ابواب گیارہ اور بارہ میں ابن سینا نے جانچ کے لیے جانوروں کے پیشاب اور پیشاب سے مشابہت رکھنے والے مائعات کا ذکر کیا ہے اور اس کے بعد ان کے پیشاب کے علاج کو ختم کیا ہے۔ {حوالہ: کینن ابن سینا پرنٹ v1 صفحہ 197-198}۔"
  tr: "İbn Sina, on birinci ve on ikinci bölümlerde hayvanların idrarını, idrara benzeyen sıvı şeyleri, bunları nasıl ayırt edeceğini belirtir ve ardından konuşmasını idrarla bitirir. {atıf:kanon-ibn-sina-print-v1 s.197-198}."
  id: "Ibn Sina menyebutkan dalam bab sebelas dan dua belas urin hewan untuk diperiksa, benda-benda cairan yang mirip urin, bagaimana membedakan di antara mereka, lalu mengakhiri pidatonya dengan urin. {cite:canon-ibn-sina-print-v1 hlm.197-198}."
