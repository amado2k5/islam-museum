id: concept/canon-relieving-pain-in-general
class: concept
kind: scientific
label:
  ar: "تسكين الأوجاع على الجملة عند ابن سينا"
  en: "Relieving pain in general in the Canon"
  fr: "Soulagement de la douleur en général dans le Canon"
  ur: "قانون میں درد کو عمومی طور پر کم کرنا"
  es: "Aliviar el dolor en general en el Canon"
summary:
  ar: "يفتتح ابن سينا الفصل الثلاثين في تسكين الأوجاع بأنها تنحصر في قسمين، ويقرر أن التسكين يكون بمضادة الأسباب، ثم يصنف المسكنات إلى مبدلة للمزاج ومحللة للمادة ومخدرة، ويعدد المرخيات والمخدرات {cite:canon-ibn-sina-print-v1 pp.309-310}."
  en: "Ibn Sina opens chapter 30, on relieving pains, by saying that pains fall into two kinds and that relief comes by opposing the causes, then ranks the relievers as changers of temperament, dissolvers of matter and narcotics, and lists the relaxants and the narcotics {cite:canon-ibn-sina-print-v1 pp.309-310}."
  fr: "Ibn Sina ouvre le chapitre 30 sur le soulagement des douleurs par leurs deux types et l’opposition aux causes, puis classe les agents calmants en modificateurs du tempérament, dissolvants de matière et narcotiques, et énumère relâchants et narcotiques {cite:canon-ibn-sina-print-v1 pp.309-310}."
  es: "Ibn Sina abre el capítulo 30, sobre el alivio de los dolores, diciendo que los dolores se dividen en dos tipos y que el alivio se logra oponiéndose a las causas, luego clasifica los aliviadores como cambiadores de temperamento, disolventes de materia y narcóticos, y enumera los relajantes y los narcóticos {cite:canon-ibn-sina-print-v1 pp.309-310}."
  ur: "ابن سینا دردوں سے نجات کے باب 30 کو یہ کہتے ہوئے کھولتے ہیں کہ درد دو طرح کے ہوتے ہیں اور یہ کہ راحت اسباب کی مخالفت سے حاصل ہوتی ہے، پھر راحت دینے والوں کو مزاج کو بدلنے والے، مادے اور نشہ کو تحلیل کرنے والے قرار دیتے ہیں اور آرام کرنے والوں اور نشہ آور چیزوں کی فہرست دیتے ہیں۔"
