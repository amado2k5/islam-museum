education:
  did_you_know:
    ar: "الاحتكار عند المراغي حبس السلع ليقلّ المعروض فتغلو الأثمان، ويضبط الفقهاء تدخل الدولة في السوق لمنعه حمايةً للناس."
    en: "Hoarding, for al-Maraghi, is withholding goods to shrink supply and raise prices; jurists bound the state's market intervention to prevent it and protect people."
    ur: "مراغی کے نزدیک احتکار مال روک کر فراوانی کم اور قیمتیں بڑھانا ہے؛ فقہاء اسے روکنے کے لیے بازار میں ریاست کی مداخلت کی حد بندھی ہے۔"
    sources: [source/min-qadaya-al-mal-wal-amal-azhar, source/nazarat-mawdu-iyya-azhar]
class: concept
kind: ethical
label:
  ar: الاحتكار
  en: Hoarding (ihtikar)
summary:
  ar: "الاحتكار عند المراغي هو حبس السلع ليقلّ المعروض فتغلو الأثمان ويتحكم المحتكر في البيع {cite:min-qadaya-al-mal-wal-amal-azhar p. 34}. ويسمي الكتاب ما يجري منه في الأزمات «السوق السوداء»، ويصف المحتكر بأنه عضو فاسد في جسم الجماعة {cite:min-qadaya-al-mal-wal-amal-azhar p. 34}. ويورد حديث «من احتكر فهو خاطئ»، وينبّه في حاشيته إلى أن بعض ألفاظ الأحاديث في الباب ضعيفة {cite:min-qadaya-al-mal-wal-amal-azhar p. 34}. ويذكر أن للحاكم أن يجبر المحتكر على البيع عند الضرورة، نقلًا عن ابن حجر الهيتمي {cite:min-qadaya-al-mal-wal-amal-azhar p. 36}. ويرى أن الاحتكار لا يقتصر على الطعام، بل يشمل الدواء والثياب والوقود ومواد البناء، نقلًا عن أبي يوسف {cite:min-qadaya-al-mal-wal-amal-azhar p. 35}. ويذكر قصة تاجر أمر وكيله ببيع الطعام بسعر يومه، ثم تصدّق بربحه الزائد، عن الغزالي {cite:min-qadaya-al-mal-wal-amal-azhar p. 35}. ويعرّف محيي الدين عفيفي أحمد الاحتكار بقول ابن قدامة: أن يكون المحتكر من الأقوات التي يحتاجها الناس، وأن يلحق المحتكر الضرر بالناس {cite:nazarat-mawdu-iyya-azhar p. 143}، ويذكر حديث «من احتكر طعامًا أربعين ليلة» دون بيان درجته {cite:nazarat-mawdu-iyya-azhar p. 144}. ويضيف زيدان قعدات في «منهج القرآن في الاقتصاد» أن الاحتكار من أسباب المشكلة الاقتصادية، إذ يقوم على أخذ حاجات الناس وتخزينها حتى ترتفع أسعارها، فتندر السلع في بلد وتكثر في آخر {cite:qadan-manhaj-iqtisad-quran p. 58}. ويذكر المؤلف الاحتكار في الأسباب الممنوعة للتملك {cite:usul-iqtisad-islami-0660 p. 53}، ويجعل من حق الدولة أن تجبر الباعة على البيع إذا احتكروا وكان الناس بحاجة إلى سلعهم، وتعطيهم ثمن المثل {cite:usul-iqtisad-islami-0660 p. 81}، ومن وظائف الحسبة منع الاحتكار {cite:usul-iqtisad-islami-0660 p. 90}. الاحتكار عند المؤلف حبس الأموال لأجل إغلائها على الناس، وفي نطاقه خلاف بين من خصّه بالطعام ومن عمّه كل ما يحتاج إليه الناس، والجمهور يخصه بالتجار الذين يشترون لإعادة البيع، ويجبر المحتكر على البيع بثمن المثل."
  en: "Al-Maraghi defines hoarding as withholding goods to reduce supply and raise prices (p. 34). He calls its modern form the black market and describes the hoarder as a diseased limb of the community (p. 34). He cites the hadith 'whoever hoards is a sinner' and notes that some hadith wordings in the chapter are weak (p. 34). The ruler may compel a hoarder to sell in necessity, after Ibn Hajar al-Haytami (p. 36). The ban extends beyond food to medicine, cloth and fuel, after Abu Yusuf (p. 35). The book reports an anecdote from al-Ghazali about a merchant who gave away his excess profit (p. 35). Muhyi al-Din Afifi Ahmad gives Ibn Qudama's definition: a foodstuff people need, withheld so as to harm them (p. 143), and cites the hadith on hoarding for forty nights without giving its grade (p. 144)."
