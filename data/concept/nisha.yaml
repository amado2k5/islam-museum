summary:
  ar: "النشا في الكتاب بارد يابس في الأولى فيه تقوية وتليين، يذهب الكلف بالزعفران ويدمل القروح ويمنع سيلان المواد إلى العين ويليّن الصدر ويعقل الطبيعة {cite:canon-ibn-sina-print-v1 p.579}."
  en: "Nisha, starch, is in the book cold and dry in the first degree, strengthening and softening; with saffron it removes freckles, it heals ulcers, stops the flow of matter to the eye, softens the chest and binds the nature {cite:canon-ibn-sina-print-v1 p.579}."
  ur: "نشا کتاب میں پہلے درجے میں سرد خشک ہے، مضبوط اور نرم کرنے والا؛ زعفران کے ساتھ جھائیاں مٹاتا، قرحے بھرتا، آنکھ کی طرف مادوں کا بہنا روکتا، سینہ نرم کرتا اور طبیعت کو باندھتا ہے {cite:canon-ibn-sina-print-v1 p.579}۔"
  es: "Nisha, almidón, es en el libro frío y seco en primer grado, fortalecedor y suavizante; con azafrán elimina las pecas, cura las úlceras, detiene el flujo de materia al ojo, suaviza el pecho y une la naturaleza {cite:canon-ibn-sina-print-v1 p.579}."
