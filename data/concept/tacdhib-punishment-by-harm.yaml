id: concept/tacdhib-punishment-by-harm
class: concept
kind: legal
label:
  ar: "التعذيب"
  en: "Ta'dhib (torment or punishment beyond the lawful: the prisoner, the thief, animals)"
  ur: "تعذیب (ناجائز اذیت یا سزا: قیدی، چور اور جانور)"
summary:
  ar: "التعذيب إيقاع العقوبة أو الأذى، والأصل فيه المنع لما فيه من العقاب بغير حق. ويشرع التعذيب بالتأديب والحدود والقصاص والتعزير، وقد أجاز الحنفية الكي للعلاج إذا تعين، وأجاز الفقهاء رمي الأعداء بالنار في الحرب، ويمنع تحريق من قدر عليه. ويعذب الأسير لكشف مال مكتوم، ولا يعذب الأسير ابتداء. وفي المتهم: من عرف بالصلاح لا يعاقب، ومجهول الحال يحبس، والمعروف بالفجور يحبس ويضرب عند بعض الفقهاء. وتعذيب الحيوان بالمنع من الطعام أو اتخاذ الحي غرضاً محرم، ويجوز الوسم والتعليم بقدر الحاجة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5406} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5407} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5408} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5409} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5410} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5411}"
  en: "Ta'dhib is inflicting punishment or harm. The basis is prohibition, since it punishes without right. It is lawful in discipline, the fixed penalties, retaliation and discipline by the ruler; the Hanafis allow cauterising for treatment when it is needed; and the jurists allow burning enemies in war when they cannot be taken otherwise, but not after capture. A captive may be made to reveal hidden property, and is not tormented at the start; an accused man of known goodness is not punished, one of unknown standing is detained, and one known for wrongdoing may be detained and beaten according to some. Torment of animals by starving them or using a living creature as a target is forbidden; branding and training are lawful to the extent of need. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5406} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5407} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5408} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5409} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5410} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5411}"
