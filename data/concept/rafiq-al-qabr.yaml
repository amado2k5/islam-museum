id: concept/rafiq-al-qabr
class: concept
kind: belief
label:
  ar: "رفيق القبر"
  en: "What accompanies a person to the grave"
  ur: "قبر کا ساتھی"
summary:
  ar: "ما يصحب الإنسان إلى قبره في رواية الشيخ عمر عبد الكافي: يبقى المال، ويصحبه الأهل إلى القبر، ولا يدخل القبر معه إلا عمله الصالح. ويعرض الشيخ حكايات وأحاديث عن الدفن والقبر بوصفها روايته هو، وبعضها لم يُسند في التسجيل."
  en: "What accompanies a person to the grave, in Sheikh Omar Abdelkafy's account: goods stay behind, family walks him to the grave, and only his deeds go in with him. He gives his account of burial and the grave, presenting the narrations as his own; some are not sourced in the recording."
  ur: "شیخ عمر عبدالکافی کی روایت کے مطابق انسان کے ساتھ قبر تک کیا جاتا ہے: مال پیچھے رہ جاتا ہے، اہلِ خانہ قبر تک ساتھ جاتے ہیں، اور قبر میں صرف نیک عمل ساتھ جاتا ہے۔ وہ دفن اور قبر کے بارے میں اپنی روایت پیش کرتے ہیں؛ ان میں سے بعض تسجیل میں غیر مسند ہیں۔"
