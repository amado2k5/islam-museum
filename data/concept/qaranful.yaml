summary:
  ar: "القرنفل في الكتاب ثمرة نبات في حد الصين يشبه الياسمين لكنه أسود، حار يابس في الثالثة، يطيب النكهة ويحد البصر ويقوي المعدة والكبد وينفع من القيء والغثيان {cite:canon-ibn-sina-print-v1 p.642}"
  en: "Qaranful is in the book the fruit of a plant at the edge of China, like jasmine but black, hot and dry in the third degree; it sweetens the breath, sharpens the sight, strengthens the stomach and liver and benefits vomiting and nausea {cite:canon-ibn-sina-print-v1 p.642}"
  ur: "قرنفل کتاب میں چین کی حد میں اگنے والے پودے کا پھل ہے جو چنبیلی سے ملتا ہے مگر کالا ہے، تیسرے درجے میں گرم خشک؛ منہ کی بو سنوارتا، نظر تیز کرتا، معدے اور جگر کو قوت دیتا اور قے اور متلی میں نافع ہے {cite:canon-ibn-sina-print-v1 p.642}۔"
  es: "En el libro, Qaranful es el fruto de una planta que crece en los confines de China, parecida al jazmín pero negra, caliente y seca en tercer grado; endulza el aliento, agudiza la vista, fortalece el estómago y el hígado y es beneficiosa para los vómitos y las náuseas {cite:canon-ibn-sina-print-v1 p.642}"
