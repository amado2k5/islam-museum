id: concept/shahm-fat
class: concept
kind: legal
label:
  ar: "الشَّحْم"
  en: "Shahm (animal fat: food, use of carrion fat, and the slaughter of the People of the Book)"
summary:
  ar: "الشحم في الحيوان جوهر السمن، وعند أكثر الفقهاء ما يكون في الجوف من شحم الكلى وغيره، والدهن أعم منه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9928} وشحم الحيوان المذكى حلال، وشحم الميتة حرام، وانتفاع جمهور الفقهاء بشحم الميتة في غير الأكل ممنوع لحديث جابر، وأجاز الشافعية الاستصباح به وطلي السفن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9929} واختلف الفقهاء في شحوم ذبائح أهل الكتاب المحرمة عليهم، فذهب الحنفية والشافعية والحنابلة في المذهب ومالك في قول إلى حلها، وذهب ابن القاسم وأشهب والقاضي من الحنابلة إلى تحريمها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9930}"
  en: "In the animal shahm is the essence of fat; for most jurists it is the fat inside the body, such as kidney fat; dihn is wider, since it can be vegetable, and shahm only animal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9928} The fat of a properly slaughtered animal is lawful, and the fat of carrion is forbidden. Most jurists forbid using carrion fat in anything at all, on the hadith of Jabir that wine, carrion, pork and idols were forbidden to sell; the Shafi'is allow it for caulking boats and lighting lamps, but not for eating or for the human body. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9929} The jurists differ on the fat of the slaughter of the People of the Book where it was forbidden to them. The Hanafis, Shafi'is, the Hanbali school and a view of Malik hold it lawful; Ibn al-Qasim, Ashhab, Abu al-Hasan al-Tamimi and a Hanbali qadi hold it forbidden, a view also reported from Malik, with the matter placed between forbidden and permitted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9930}"
