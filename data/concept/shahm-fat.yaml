id: concept/shahm-fat
class: concept
kind: legal
label:
  ar: "الشَّحْم"
  en: "Shahm (animal fat: food, use of carrion fat, and the slaughter of the People of the Book)"
  es: "Shahm (grasa animal: alimento, uso de grasa de carroña y matanza de la Gente del Libro)"
  fr: "Shahm (graisse animale: alimentation, utilisation de la graisse de charogne et massacre des Gens du Livre)"
  ur: "شاہم ⁦(جانوروں کی چربی: کھانا، مردار کی چربی کا استعمال، اور اہل کتاب کا ذبیحہ)⁩"
  tr: "Yağ"
  id: "Lemak"
summary:
  ar: "الشحم في الحيوان جوهر السمن، وعند أكثر الفقهاء ما يكون في الجوف من شحم الكلى وغيره، والدهن أعم منه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9928} وشحم الحيوان المذكى حلال، وشحم الميتة حرام، وانتفاع جمهور الفقهاء بشحم الميتة في غير الأكل ممنوع لحديث جابر، وأجاز الشافعية الاستصباح به وطلي السفن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9929} واختلف الفقهاء في شحوم ذبائح أهل الكتاب المحرمة عليهم، فذهب الحنفية والشافعية والحنابلة في المذهب ومالك في قول إلى حلها، وذهب ابن القاسم وأشهب والقاضي من الحنابلة إلى تحريمها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9930}"
  en: "In the animal shahm is the essence of fat; for most jurists it is the fat inside the body, such as kidney fat; dihn is wider, since it can be vegetable, and shahm only animal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9928} The fat of a properly slaughtered animal is lawful, and the fat of carrion is forbidden. Most jurists forbid using carrion fat in anything at all, on the hadith of Jabir that wine, carrion, pork and idols were forbidden to sell; the Shafi'is allow it for caulking boats and lighting lamps, but not for eating or for the human body. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9929} The jurists differ on the fat of the slaughter of the People of the Book where it was forbidden to them. The Hanafis, Shafi'is, the Hanbali school and a view of Malik hold it lawful; Ibn al-Qasim, Ashhab, Abu al-Hasan al-Tamimi and a Hanbali qadi hold it forbidden, a view also reported from Malik, with the matter placed between forbidden and permitted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9930}"
  es: "En el animal, shahm es la esencia de la grasa; para la mayoría de los juristas es la grasa dentro del cuerpo, como la grasa renal; dihn es más amplio, ya que puede ser vegetal, y shahm solo animal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9928} La grasa de un animal sacrificado correctamente es lícita, y la grasa de la carroña está prohibida. La mayoría de los juristas prohíben usar grasa de carroña en cualquier cosa, en el hadiz de Jabir que el vino, la carroña, el cerdo y los ídolos estaban prohibidos para vender; los shafi'íes la permiten para calafatear barcos y encender lámparas, pero no para comer ni para el cuerpo humano. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9929} Los juristas difieren sobre la grasa del sacrificio de la Gente del Libro, donde les estaba prohibido. Los hanafíes, los shafi'ís, la escuela hanbalí y la opinión de Malik la consideran lícita; Ibn al-Qasim, Ashhab, Abu al-Hasan al-Tamimi y un cadí hanbalí la consideran prohibida, una opinión también atribuida a Malik, situando el asunto entre lo prohibido y lo permitido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9930}"
  fr: "Chez les animaux, le terme shahm désigne l'essence de la graisse; pour la plupart des juristes, il s'agit de la graisse interne, comme la graisse rénale; le terme dihn a une portée plus large, puisqu'il peut être d'origine végétale, tandis que shahm ne concerne que la graisse animale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9928} La graisse d'un animal abattu selon les rites est licite, tandis que la graisse de charogne est interdite. La plupart des juristes interdisent tout usage de la graisse de charogne, se fondant sur le hadith de Jabir qui interdit la vente de vin, de charogne, de porc et d'idoles; les shafi'ites l'autorisent pour le calfatage des bateaux et l'allumage des lampes, mais non pour la consommation humaine. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9929} Les juristes divergent quant à la consommation de la graisse des sacrifices des Gens du Livre, pour lesquels cela leur était interdit. Les hanafites, les chaféites, l'école hanbalite et une opinion de Malik la considèrent comme licite; Ibn al-Qasim, Ashhab, Abu al-Hasan al-Tamimi et un cadi hanbalite la considèrent comme interdite, une opinion également rapportée par Malik, la question se situant ainsi entre l'interdit et le permis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9930}"
  ur: "شحم جانور میں چربی کا جوہر ہے۔ اکثر فقہاء کے نزدیک یہ جسم کے اندر کی چربی ہے، جیسے کہ گردے کی چربی۔ dihn وسیع ہے، کیونکہ یہ سبزی ہو سکتا ہے، اور شحم صرف جانور ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص9928} صحیح طریقے سے ذبح کیے گئے جانور کی چربی حلال ہے اور مردار کی چربی حرام ہے۔ اکثر فقہاء نے مردار کی چربی کو کسی بھی چیز میں استعمال کرنے سے منع کیا ہے، جابر کی حدیث میں ہے کہ شراب، مردار، سور کا گوشت اور بت بیچنا حرام ہے۔ شافعی اس کی اجازت کشتیوں کو چرانے اور چراغ جلانے کے لیے دیتے ہیں، لیکن کھانے یا انسانی جسم کے لیے نہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9928} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9929} اہل کتاب کے ذبیحہ کی چربی کے بارے میں فقہاء کا اختلاف ہے کہ یہ ان پر کہاں حرام تھا۔ حنفیہ، شافعی، مکتب حنبلی اور مالک کا قول اسے حلال قرار دیتا ہے۔ ابن القاسم، اشہب، ابو الحسن التمیمی اور ایک حنبلی قادی اسے حرام قرار دیتے ہیں، مالک سے بھی ایک قول روایت کیا گیا ہے، جس میں معاملہ حرام اور جائز کے درمیان رکھا گیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9929}"
  tr: "Hayvanlardaki yağ, ghee'nin özüdür ve çoğu hukukçuya göre çukurda bulunan böbrek yağı ve diğerleridir, ancak yağ bundan daha yaygındır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9928} Kesilen bir hayvanın yağı izinlidir, ancak ölü hayvanların yağı yasaktır. Çoğu hukukçu, leş yağını başka amaçlarla kullanır, ancak Jabir hadislerine göre yemek yasaktır. Şafi'ler bunu kullanmalarına ve gemileri boyamaya izin verir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9929} Hukukçular, Kitap Ahli'nin kesilmiş hayvanlarının yağları konusunda farklı görüştedir; bu yağlar kendilerine yasak değildir. Hanefi, Şafii ve Hanbali mezhebleri aynı görüşte, Malik bunu mücaiz bulurken, Hanbalılardan İbn al-Qasim, Ashhab ve el-Kadi bunun yasak olduğunu savunur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9930}"
  id: "Lemak pada hewan adalah esensi ghee, dan menurut sebagian besar ahli hukum, yang ditemukan di rongga adalah lemak ginjal dan lainnya, tetapi lemak lebih umum dari itu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9928} Lemak hewan yang disembelih diperbolehkan, tetapi lemak hewan mati dilarang. Mayoritas ahli hukum menggunakan lemak bangkai untuk tujuan selain makan dilarang menurut hadits Jabir. Syafi'i diperbolehkan menggunakannya dan mengecat kapal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9929} Para ahli hukum berbeda pendapat mengenai lemak hewan yang disembelih oleh Umat Kitab yang dilarang bagi mereka. Aliran Hanafi, Shafi'i, dan Hanbali memiliki pandangan yang sama, Malik menganggapnya diperbolehkan, dan Ibn al-Qasim, Ashhab, dan al-Qadi dari Hanbal berpendapat bahwa hal itu dilarang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9930}"
