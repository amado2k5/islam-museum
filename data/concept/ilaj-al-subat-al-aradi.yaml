id: concept/ilaj-al-subat-al-aradi
class: concept
kind: scientific
label:
  ar: "علاج السبات العارض لمرض عضو"
  en: "Treatment of coma that is a sign of an illness in an organ"
  ur: "کسی عضو کی بیماری کی علامت کے طور پر غنودگی کا علاج"
  es: "Tratamiento del coma que es un signo de una enfermedad en un órgano"
  fr: "Traitement du coma, signe d'une maladie d'organe"
  tr: "Organ hastalığı için semptomatik koma tedavisi"
  id: "Pengobatan koma simptomatik untuk penyakit organ"
summary:
  ar: "يذكر ابن سينا مبادئ علاج السبات العارض لمرض في عضو: قصد ذلك العضو بالتدبير وتقوية الدماغ، ثم ما يحلل إن احتبس فيه شيء، وعلاج ما كان من شيء مشروب بحسب المشروب؛ ولا تُنقل الوصفات ولا طرق الاستعمال {cite:canon-ibn-sina-print-v2 p.93}"
  en: "Ibn Sina gives the principles of treating coma that is a sign of an illness in an organ: attending to that organ by regimen and strengthening the brain, then what dissolves if something is held in it, and treating a coma from a drink according to what was drunk; recipes and methods of application are not reproduced {cite:canon-ibn-sina-print-v2 p.93}"
  ur: "ابن سینا کسی عضو کی بیماری کی علامت کے طور پر آنے والی غنودگی کے علاج کے اصول بتاتا ہے: اس عضو کو تدبیر سے دیکھنا اور دماغ کو قوت دینا، پھر جو کچھ اس میں رکا ہو اسے گھلانے والی چیز، اور پی ہوئی چیز سے ہونے والی غنودگی کا علاج پی ہوئی چیز کے مطابق؛ نسخے اور استعمال کے طریقے نقل نہیں کیے گئے {cite:canon-ibn-sina-print-v2 p.93}۔"
  es: "Ibn Sina expone los principios para tratar el coma que es un signo de enfermedad en un órgano: atender dicho órgano mediante un régimen y fortalecer el cerebro, luego disolver lo que se disuelve si algo se retiene en él, y tratar el coma por ingestión de una bebida según lo que se haya bebido; las recetas y los métodos de aplicación no se reproducen {cite:canon-ibn-sina-print-v2 p.93}"
  fr: "Ibn Sina expose les principes du traitement du coma, signe d'une maladie d'un organe: soigner cet organe par un régime alimentaire adapté et renforcer le cerveau, puis dissoudre ce qui y est retenu, et traiter un coma dû à une boisson en fonction de ce qui a été ingéré; les recettes et les modes d'application ne sont pas reproduits {cite:canon-ibn-sina-print-v2 p.93}"
  tr: "İbn Sina, bir organda meydana gelen bir hastalıkta görülen koma tedavisinin ilkelerinden bahseder: o organ için beynin yönetimi ve güçlendirilmesi, sonra içinde bir şey hapsolursa neyin izin verildiği ve içkiye göre içilebilir olanın tedavisi; ne tarifler ne de kullanım yöntemleri aktarılmazdır {cite:canon-ibn-sina-print-v2 s.93}"
  id: "Ibn Sina menyebutkan prinsip pengobatan koma yang terjadi pada penyakit di organ: tujuan mengelola dan memperkuat otak untuk organ tersebut, lalu apa yang diperbolehkan jika sesuatu terperangkap di dalamnya, dan pengobatan apa yang dapat diminum sesuai dengan minuman; baik resep maupun metode penggunaannya tidak ditransmisikan {cite:canon-ibn-sina-print-v2 hlm.93}"
