  tr: "Bahar hattı"
  id: "Garis pegas"
summary:
  ar: "خط مميّز مصقول الطابع كُتبت به مصاحف شبه القارة الهندية في القرنين الرابع عشر والخامس عشر ومطلع السادس عشر، حروفه على هيئة الأوتاد ذات أطراف دائرية غليظة، وألفه مائلة إلى اليسار، وتفصل بين كلماته مسافات واسعة؛ وأصل اسمه غامض ويُرجَّح أنه نسبة إلى ولاية بهار، وفي ضبطه خلاف {cite:blair-islamic-calligraphy-2006 p. 426} {cite:blair-islamic-calligraphy-2006 p. 427}."
  en: "A distinctive, stylised script used for Qur'an manuscripts in the Indian subcontinent from the fourteenth to the early sixteenth century: wedge-shaped letters with thick round bowls for endings, an alif pitched to the left and wide spaces between words. The origin of the name is obscure and probably refers to the state of Bihar, and even its vocalisation is disputed {cite:blair-islamic-calligraphy-2006 p. 426} {cite:blair-islamic-calligraphy-2006 p. 427}."
  fr: "Écriture stylisée caractéristique des manuscrits coraniques du sous-continent indien du XIVe au début du XVIe siècle : lettres cunéiformes, terminaisons en bols ronds épais, alif incliné à gauche, larges espaces entre les mots. L’origine du nom reste obscure, probablement liée au Bihar ; sa vocalisation même est discutée {cite:blair-islamic-calligraphy-2006 p. 426} {cite:blair-islamic-calligraphy-2006 p. 427}."
  ur: "برصغیر کے قرآنی مخطوطات میں چودھویں سے سولہویں صدی کے آغاز تک برتا جانے والا ممتاز، مخصوص انداز کا خط: میخ نما حروف، موٹے گول پیالوں پر ختم ہونے والے سرے، بائیں طرف جھکا ہوا الف اور الفاظ کے درمیان کھلی جگہ۔ نام کی اصل مبہم ہے اور غالبًا صوبہ بہار کی طرف اشارہ ہے، اور اس کے تلفظ میں بھی اختلاف ہے {cite:blair-islamic-calligraphy-2006 p. 426} {cite:blair-islamic-calligraphy-2006 p. 427}۔"
  es: "Una escritura distintiva y estilizada utilizada en los manuscritos del Corán en el subcontinente indio desde el siglo XIV hasta principios del siglo XVI: letras en forma de cuña con remates redondos y gruesos, una alif inclinada hacia la izquierda y amplios espacios entre palabras. El origen del nombre es incierto y probablemente se refiere al estado de Bihar, e incluso su vocalización es objeto de controversia {cite:blair-islamic-calligraphy-2006 p. 426} {cite:blair-islamic-calligraphy-2006 p. 427}."
  tr: "14., 15. ve erken 16. yüzyıllarda Hindistan alt kıtasının Kur'anlarında kullanılan ayırt edici ve cilalı bir yazı sistemi. Harfleri çivi şeklinde, kalın dairesel uçlara sahiptir, alfabesi sola eğiktir ve kelimeleri geniş boşluklarla ayrılmıştır. Kökeni belirsizdir ve muhtemelen Bihar eyaletine atfedilmektedir. Yazımında bir fark vardır {cite:Blair-Islamic-calligraphy-2006 s. 426} {cite:Blair-Islamic-calligraphy-2006, s. 427}."
  id: "Aksara khas yang dipoles digunakan untuk Al-Qur'an anak benua India pada abad ke-14, ke-15, dan awal abad ke-16. Huruf-hurufnya berbentuk pasak dengan ujung bundar tebal, alfabetnya miring ke kiri, dan kata-katanya dipisahkan oleh ruang lebar. Asal-usulnya tidak jelas, dan kemungkinan besar dikaitkan dengan negara bagian Bihar. Terdapat perbedaan dalam ejaan {cite:Blair-Islamic-calligraphy-2006 hlm. 426} {cite:Blair-Islamic-calligraphy-2006, hlm. 427}."
