id: concept/hujna-fiqh
class: concept
kind: legal
label: { ar: "هُجْنَة", en: "Hujna (hybridness, in the fiqh sense: spoils shares and speech)" }
summary:
  ar: "الهُجْنة في اللغة العيب والقبح، والهجين من الخيل ما تلده برذونة من حصان، والهجين من الناس من أب عربي وأم غير عربية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16447} ومن آداب الكلام التعبير بالكناية عن العيوب المستقبحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16448} وفي سهم الفرس الهجين من الغنيمة ذهب الحنفية والمالكية والشافعية إلى تسويته بسهم الفرس العربي، بينما فرّق الحنابلة فجعلوا للعربي (العتيق) ثلاثة أسهم، وللهجين والمقرف والبرذون سهمين: سهم للفارس وسهم للفرس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16448} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16449} ويستند الحنابلة إلى حديث في تفضيل العربي، وقد أورده أبو داود في المراسيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16449}"
  en: "Hujna is defect and ugliness in the lexical sense; the hajin among horses is the foal of a non-Arab mare by a stallion, and among people the one born of an Arab father and a non-Arab mother. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16447} Good speech avoids naming disgusting defects directly and uses euphemism. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16448} On the share of a hybrid horse in the spoils, the Hanafis, Malikis and Shafi'is give it the same share as an Arab horse; the Hanbalis distinguish: an Arab horse (ateeq) earns its rider three shares, while a hajin, a muqraf and a birdhawn earn two shares, one for the rider and one for the horse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16448} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16449} The Hanbali position relies on a report from Khalid ibn Ma'dan, transmitted as mursal in Abu Dawud's Marasil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16449}"
