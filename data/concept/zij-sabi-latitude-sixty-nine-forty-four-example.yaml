label: { ar: "مثال خط عرضه تسع وستون درجة وأربع وأربعون دقيقة في الزيج الصابي", en: "Worked example: the line at 69 degrees 44 minutes", ur: "مثال: ۶۹ درجے ۴۴ دقیقے والا خط" }
summary:
  ar: "يضرب البتاني مثلاً بالخط الذي ارتفاع القطب فيه تسع وستون درجة وأربع وأربعون دقيقة، فيبقى من تسعين عشرون جزءاً وست عشرة دقيقة، وهو ميل الشمس عندما تبعد عن نقطة المنقلب الصيفي ثلاثين جزءاً من كل ناحية، أي من أول الجوزاء إلى أول الأسد، فتدور حول الأفق نحو شهرين لا تغيب. وفي مقابلها من أول القوس إلى أول الدلو تخفى نحو شهرين فيكون الليل كذلك. {cite:zij-sabi-nallino-byblion pp.28-29}."
  en: "Al-Battani gives as an example the line where the pole is 69 degrees 44 minutes high; 20 degrees 16 minutes remain of ninety, which is the Sun's declination when it is thirty parts from the summer solstice point on either side, that is from the first of Gemini to the first of Leo, so it circles the horizon for about two months without setting. Opposite, from the first of Sagittarius to the first of Aquarius, it stays hidden about two months, so the night lasts as long. {cite:zij-sabi-nallino-byblion pp.28-29}."
  ur: "البتانی مثال کے طور پر اس خط کو لیتے ہیں جس پر قطب کی بلندی ۶۹ درجے ۴۴ دقیقے ہے، اس سے نوے میں ۲۰ جز ۱۶ دقیقے بچتے ہیں، اور یہی سورج کا میل ہے جب وہ نقطۂ انقلاب صیفی سے دونوں طرف تیس جز کے فاصلے پر ہو، یعنی جوزا کے آغاز سے اسد کے آغاز تک، تو وہ افق کے گرد گھومتا رہتا ہے اور تقریباً دو مہینے غروب نہیں ہوتا۔ اس کے مقابل قوس کے آغاز سے دلو کے آغاز تک تقریباً دو مہینے پوشیدہ رہتا ہے اس لیے رات بھی اتنی ہی ہوتی ہے۔ {cite:zij-sabi-nallino-byblion pp.28-29}۔"
