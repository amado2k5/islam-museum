label: { ar: "مثال خط عرضه تسع وستون درجة وأربع وأربعون دقيقة في الزيج الصابي", en: "Worked example: the line at 69 degrees 44 minutes", ur: "مثال: ۶۹ درجے ۴۴ دقیقے والا خط", es: "Ejemplo resuelto: la línea a 69 grados y 44 minutos.", fr: "Exemple résolu: la ligne à 69 degrés 44 minutes", tr: "Sabi Zij'de 69 derece 44 dakika enlemine bir örnek.", id: "Contoh garis lintang 69 derajat dan 44 menit dalam kalender Sabi Zij." }
summary:
  ar: "يضرب البتاني مثلاً بالخط الذي ارتفاع القطب فيه تسع وستون درجة وأربع وأربعون دقيقة، فيبقى من تسعين عشرون جزءاً وست عشرة دقيقة، وهو ميل الشمس عندما تبعد عن نقطة المنقلب الصيفي ثلاثين جزءاً من كل ناحية، أي من أول الجوزاء إلى أول الأسد، فتدور حول الأفق نحو شهرين لا تغيب. وفي مقابلها من أول القوس إلى أول الدلو تخفى نحو شهرين فيكون الليل كذلك. {cite:zij-sabi-nallino-byblion pp.28-29}."
  en: "Al-Battani gives as an example the line where the pole is 69 degrees 44 minutes high; 20 degrees 16 minutes remain of ninety, which is the Sun's declination when it is thirty parts from the summer solstice point on either side, that is from the first of Gemini to the first of Leo, so it circles the horizon for about two months without setting. Opposite, from the first of Sagittarius to the first of Aquarius, it stays hidden about two months, so the night lasts as long. {cite:zij-sabi-nallino-byblion pp.28-29}."
  ur: "البتانی مثال کے طور پر اس خط کو لیتے ہیں جس پر قطب کی بلندی ۶۹ درجے ۴۴ دقیقے ہے، اس سے نوے میں ۲۰ جز ۱۶ دقیقے بچتے ہیں، اور یہی سورج کا میل ہے جب وہ نقطۂ انقلاب صیفی سے دونوں طرف تیس جز کے فاصلے پر ہو، یعنی جوزا کے آغاز سے اسد کے آغاز تک، تو وہ افق کے گرد گھومتا رہتا ہے اور تقریباً دو مہینے غروب نہیں ہوتا۔ اس کے مقابل قوس کے آغاز سے دلو کے آغاز تک تقریباً دو مہینے پوشیدہ رہتا ہے اس لیے رات بھی اتنی ہی ہوتی ہے۔ {cite:zij-sabi-nallino-byblion pp.28-29}۔"
  es: "Al-Battani pone como ejemplo la línea donde el polo se encuentra a 69 grados y 44 minutos de altura; quedan 20 grados y 16 minutos de noventa, que es la declinación del Sol cuando está a treinta partes del punto del solsticio de verano a cada lado, es decir, desde el primero de Géminis hasta el primero de Leo, por lo que recorre el horizonte durante unos dos meses sin ponerse. En sentido contrario, desde el primero de Sagitario hasta el primero de Acuario, permanece oculto unos dos meses, por lo que la noche dura lo mismo. {cite:zij-sabi-nallino-byblion pp.28-29}."
  fr: "Al-Battani cite en exemple la ligne où le pôle se situe à 69 degrés et 44 minutes d'altitude; il reste 20 degrés et 16 minutes sur les 90 degrés, ce qui correspond à la déclinaison du Soleil lorsqu'il se trouve à trente parties du point du solstice d'été de part et d'autre, c'est-à-dire du 1er Gémeaux au 1er Lion. Le Soleil décrit alors un cercle autour de l'horizon pendant environ deux mois sans se coucher. À l'inverse, du 1er Sagittaire au 1er Verseau, il reste caché pendant environ deux mois, la nuit dure donc autant. {cite:zij-sabi-nallino-byblion pp.28-29}."
  tr: "Al-Battani, kutup yüksekliğinin 69 derece 44 dakika olduğu çizgiyi örnek veriyor. Geriye kalan 90 dakikanın 20 ve 16 dakikası, güneşin yaz gündönümünden her yöne 30 derece uzaklıkta olduğu zamanki eğimini temsil eder; yani İkizler burcunun başlangıcından Aslan burcunun başlangıcına kadar olan süre. Yaklaşık iki ay boyunca ufukta batmadan döner. Tersine, Yay burcunun başlangıcından Kova burcunun başlangıcına kadar yaklaşık iki ay boyunca kaybolur ve benzer bir gece süresine neden olur. {cite:zij-sabi-nallino-byblion pp.28-29}."
  id: "Al-Battani memberikan contoh garis di mana ketinggian kutub adalah 69 derajat dan 44 menit. Dari 90 sisanya, 20 dan 16 menit mewakili kemiringan matahari ketika berada 30 derajat dari titik balik matahari musim panas ke segala arah, yaitu, dari awal Gemini hingga awal Leo. Matahari berputar mengelilingi cakrawala selama sekitar dua bulan tanpa terbenam. Sebaliknya, dari awal Sagitarius hingga awal Aquarius, matahari menghilang selama sekitar dua bulan, menghasilkan waktu malam yang serupa. {cite:zij-sabi-nallino-byblion pp.28-29}."
