issue:
  ar: "هل النسيان معصية أم عذر؟"
  en: "Is forgetting a disobedience or an excuse?"
perspectives:
  - tradition: sunni
    id: sunni-sharawi
    stance:
      ar: "النسيان كان معصية في الأمم السابقة، ورفعه الله عن هذه الأمة"
      en: "Forgetting was a disobedience in earlier communities, and God lifted it from this nation"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن النسيان في قصة آدم عُدّ معصية، ويستدل بحديث يرفع عن الأمة الخطأ والنسيان، فيفهم أن النسيان كان معصية في الأمم السابقة ثم رُفع عن هذه الأمة {cite:tafsir-sharawi-khawatir-scan p.268}."
      en: "Sha'rawi holds that forgetting in Adam's story counted as disobedience, and he cites a hadith that lifts error and forgetting from this nation, reading it as forgetting having been disobedience in earlier communities before it was lifted from this one {cite:tafsir-sharawi-khawatir-scan p.268}."
    sources: [source/tafsir-sharawi-khawatir-scan]
  - tradition: academic
    id: academic
    stance:
      ar: "بحث في مفهوم النسيان في الفقه والكلام لم يُضف بعد"
      en: "A study of forgetting in jurisprudence and theology is not yet added"
    summary:
      ar: "لم تُعرض في هذه الصفحات دراسة لمفهوم النسيان في أحكام التكليف، وتحتاج إلى مرجع محدد."
      en: "No study of forgetting in the law of obligation is set out in these pages; it needs a named source."
