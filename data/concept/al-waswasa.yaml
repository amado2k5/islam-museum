id: concept/al-waswasa
class: concept
kind: term
label:
  ar: "الوسوسة"
  en: "Whispering (al-waswasa)"
  ur: "وسوسہ"
summary:
  ar: "يرى الشعراوي أن وسوسة الشيطان تسعى إلى المعصية بأي وجه، أما وسوسة النفس فتريد شيئا بعينه، وأن الشيطان بدأ عداوته لآدم بإيقاعه في الزلة، وأن النسيان كان معصية في الأمم السابقة {cite:tafsir-sharawi-khawatir-scan p.266} {cite:tafsir-sharawi-khawatir-scan p.267} {cite:tafsir-sharawi-khawatir-scan p.268}."
  en: "Sha'rawi holds that Satan's whisper seeks disobedience by any means, while the whisper of the self wants one particular thing; that Satan began his enmity to Adam by causing him to slip; and that forgetting was a disobedience in earlier communities {cite:tafsir-sharawi-khawatir-scan p.266} {cite:tafsir-sharawi-khawatir-scan p.267} {cite:tafsir-sharawi-khawatir-scan p.268}."
  ur: "شعراوی کے نزدیک شیطان کا وسوسہ کسی بھی طرح نافرمانی چاہتا ہے، جبکہ نفس کا وسوسہ کوئی خاص چیز چاہتا ہے۔ شیطان نے آدم سے اپنی دشمنی لغزش میں ڈال کر شروع کی، اور پچھلی امتوں میں بھول بھی نافرمانی تھی {cite:tafsir-sharawi-khawatir-scan p.266} {cite:tafsir-sharawi-khawatir-scan p.267} {cite:tafsir-sharawi-khawatir-scan p.268}۔"
