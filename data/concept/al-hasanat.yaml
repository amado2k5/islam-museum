label:
  ar: "الحسنات"
  en: "The good deeds (al-hasanat)"
  ur: "حسنات"
summary:
  ar: "الحسنة كل عمل طيب يقرب إلى الله، وجمعها الحسنات، وهي موضوع «متصفح الحسنات» الذي يجمع كل ذكر لها في المصحف والمدونة. يقرر القرآن كتابتها ومضاعفتها: «إن الله لا يظلم مثقال ذرة وإن تك حسنة يضاعفها» [[passage/quran-4-40]]، و«من جاء بالحسنة فله عشر أمثالها» [[passage/quran-6-160]]، و«إن الحسنات يذهبن السيئات» [[passage/quran-11-114]]، و«فأولئك يبدل الله سيئاتهم حسنات» [[passage/quran-25-70]]، و«وأقرضوا الله قرضا حسنا» [[passage/quran-73-20]]، و«بدل حسنا بعد سوء» [[passage/quran-27-11]]. وتجمع الأحاديث كتابتها في الحديث القدسي «إن الله كتب الحسنات والسيئات» {cite:sahih-al-bukhari 7501} {cite:sahih-muslim 0131}، وفيه أن من همّ بحسنة ولم يعملها كُتبت له حسنة، ومن عملها كُتبت له إلى سبعمائة ضعف {cite:sahih-muslim 0128}، وأن كل عمل ابن آدم يضاعف الحسنة بعشر أمثالها إلا الصوم {cite:sunan-ibn-majah 1638}، وأن من سنّ في الإسلام سنة حسنة فله أجرها وأجر من عمل بها {cite:sahih-muslim 1017}، وأن من قتل وزغة في أول ضربة فله حسنة {cite:sunan-abi-dawud 5263}. وتسمى «الحسنى» جزاء الإحسان: «فله جزاء الحسنى» [[passage/quran-18-88]] و«وللذين أحسنوا الحسنى وزيادة» [[passage/quran-10-26]]، وفيها ورد «وصدق بالحسنى» [[passage/quran-92-6]]. وللحسنة في الاستعمال القرآني معنىان يجمعهما هذا السجل: عمل الطاعة، وما ينزل من الخير والراحة في الدنيا — كقوله «وإن تصبهم حسنة يقولوا» [[passage/quran-4-78]] — و«قرضا حسنا» القرض لله [[passage/quran-2-245]]. أما «الأسماء الحسنى» فصيغة أخرى لا مدخل لها في باب الحسنات."
