summary:
  ar: "الحسنة كل عمل طيب يقرب إلى الله، وجمعها الحسنات، وهي موضوع «متصفح الحسنات» الذي يجمع كل ذكر لها في المصحف والمدونة. يقرر القرآن كتابتها ومضاعفتها: «إن الله لا يظلم مثقال ذرة وإن تك حسنة يضاعفها» [[passage/quran-4-40]]، و«من جاء بالحسنة فله عشر أمثالها» [[passage/quran-6-160]]، و«إن الحسنات يذهبن السيئات» [[passage/quran-11-114]]، و«فأولئك يبدل الله سيئاتهم حسنات» [[passage/quran-25-70]]، و«وأقرضوا الله قرضا حسنا» [[passage/quran-73-20]]، و«بدل حسنا بعد سوء» [[passage/quran-27-11]]. وتجمع الأحاديث كتابتها في الحديث القدسي «إن الله كتب الحسنات والسيئات» {cite:sahih-al-bukhari 7501} {cite:sahih-muslim 0131}، وفيه أن من همّ بحسنة ولم يعملها كُتبت له حسنة، ومن عملها كُتبت له إلى سبعمائة ضعف {cite:sahih-muslim 0128}، وأن كل عمل ابن آدم يضاعف الحسنة بعشر أمثالها إلا الصوم {cite:sunan-ibn-majah 1638}، وأن من سنّ في الإسلام سنة حسنة فله أجرها وأجر من عمل بها {cite:sahih-muslim 1017}، وأن من قتل وزغة في أول ضربة فله حسنة {cite:sunan-abi-dawud 5263}. وتسمى «الحسنى» جزاء الإحسان: «فله جزاء الحسنى» [[passage/quran-18-88]] و«وللذين أحسنوا الحسنى وزيادة» [[passage/quran-10-26]]، وفيها ورد «وصدق بالحسنى» [[passage/quran-92-6]]. وللحسنة في الاستعمال القرآني معنىان يجمعهما هذا السجل: عمل الطاعة، وما ينزل من الخير والراحة في الدنيا — كقوله «وإن تصبهم حسنة يقولوا» [[passage/quran-4-78]] — و«قرضا حسنا» القرض لله [[passage/quran-2-245]]. أما «الأسماء الحسنى» فصيغة أخرى لا مدخل لها في باب الحسنات."
  fr: "Une hasana est toute bonne action qui rapproche de Dieu ; son pluriel, al-hasanat, donne son nom à l’explorateur des bonnes actions, qui rassemble toutes les mentions dans le texte du Coran et dans le corpus. Le Coran enseigne que les bonnes actions sont inscrites et multipliées : Dieu ne lèse personne, même du poids d’un atome, et multiplie la bonne action [[passage/quran-4-40]] ; qui accomplit une bonne action en reçoit dix fois l’équivalent [[passage/quran-6-160]] ; les bonnes actions effacent les mauvaises [[passage/quran-11-114]] ; Dieu change certaines mauvaises actions en bonnes [[passage/quran-25-70]]. Il est aussi question du bon prêt à Dieu [[passage/quran-73-20]] et du remplacement du mal par le bien [[passage/quran-27-11]]. Un hadith qudsi dit que Dieu a inscrit les bonnes et les mauvaises actions {cite:sahih-al-bukhari 7501} {cite:sahih-muslim 0131}. Selon ce hadith, une bonne action est inscrite au compte de celui qui en a l’intention sans l’accomplir, et s’il l’accomplit, elle lui est comptée jusqu’à sept cents fois {cite:sahih-muslim 0128}. Les bonnes actions du fils d’Adam comptent dix fois, sauf le jeûne {cite:sunan-ibn-majah 1638}. Qui inaugure un bon usage en islam en reçoit la récompense et celle de ceux qui le suivent {cite:sahih-muslim 1017} ; qui tue un gecko du premier coup reçoit le crédit d’une bonne action {cite:sunan-abi-dawud 5263}. Al-husna désigne la récompense de l’ihsan : la meilleure récompense est promise à celui qui agit bien [[passage/quran-18-88]], avec davantage encore pour ceux qui font le bien [[passage/quran-10-26]] ; il est aussi question de croire en cette récompense [[passage/quran-92-6]]. Cette notice réunit les deux sens coraniques de hasana : l’acte d’obéissance et le bien ou le soulagement qui échoit ici-bas [[passage/quran-4-78]]. La formule qard hasan désigne le bon prêt à Dieu [[passage/quran-2-245]]. Les plus beaux noms de Dieu relèvent d’une formule distincte, qui n’entre pas dans la catégorie des bonnes actions."
  tr: "İyi bir iş, insanı Allah'a yaklaştıran herhangi bir iyi eylemdir ve çoğulu 'iyilikler'dir. Bu, 'İyilik Tarayıcısı'nın konusudur ve bu kitap Muşaf ve Blog'da her kez bu atıfta bulunur. Kur'an, yazmayı ve çoğaltmayı buyurur: 'Gerçekten Allah bir atomun ağırlığını bile kötülemez, iyi bir iş varsa onu iki katına çıkar.' [[pasaj/kuran-40], 'İyi bir iş getiren on katı alır' [[pasaj/kuran-6-160], 'Gerçekten iyilikler kötü işleri siler' [[pasaj/kuran-11-114], 'Bunlar için Allah, kötü yaptıklarını iyiliklerle değiştirir' [[pasaj/kuran-25-70], 'Ve Allah'a iyi bir borç verir' [[pasaj/kuran-73-20]] ve 'Kötülükten sonra iyiliği değiştirir' [pasaj/kuran-27-11]]. Hadisler kutsal hadislerde toplanır ve yazılmıştır: \"Gerçekten Allah iyi ve kötü işleri kaydetmiştir\" {cite:sahih-al-bukhari 7501} {cite:sahih-muslim 0131}; bu hadis, iyi bir iş yapıp yapmayan iyilik kaydedileceği, yapan kişinin yedi yüz kere kaydedileceği {cite:sahih-muslim 0128} ve Ademin oğlunun her eyleminin iyi işi on kat katladığı, oruç hariç {cite:sunan-ibn-majah 1638}, İslam'da iyi bir sünnet kuran kişinin ödülünü ve ona göre hareket edenlerin ödülünü alacağı {cite:sahih-muslim 1017}, ilk darbede bir gekoyu öldüren ise iyi bir iş yapmış olur {cite:sunan-abi-dawud 5263}. \"El-Hasna\" iyilik ödülü olarak adlandırılır: \"Böylece iyilik ödülü vardır\" [[pasaj/kuran-18-88]] ve \"İyi işler yapanlar için iyilik ve daha fazlası\" [[pasaj/kuran-10-26]] ve \"Ve en iyilerle dürüsttür\" ifadesini içerir [[pasaj/kuran-92-6]]. Kur'an kullanımında, iyi amalların iki anlamı vardır ve bu kayıt birleştirir: itaat eylemi ve bu dünyada iyilik ve tesellinin inişi — örneğin, \"Ve iyi işler olursa, derler\" [[pasaj/kuran-4-78]] — ve \"iyi bir borç\" Allah'a borç anlamına gelir [[pasaj/kuran-2-2-245]]. \"Güzel isimler\" ise iyi işler bölümünde kaydı olmayan başka bir biçimdir."
  id: "Perbuatan baik adalah setiap amal baik yang mendekatkan seseorang kepada Allah, dan jamaknya adalah 'kebaikan.' Ini adalah subjek 'Pemindai Kebaikan,' dan buku ini merujuknya setiap kali dalam Mushaf dan Blog. Al-Qur'an memerintahkan penulisan dan penggandaan: 'Sesungguhnya, Allah tidak merendahkan bahkan berat atom; jika ada amal baik, Dia melipatkannya dua kali lipat.' [[ayat/Al-Quran-40], 'Barangsiapa berbuat baik menerima sepuluh kali lipat' [[ayat/al-Quran-6-160], 'Sesungguhnya, perbuatan baik menghapus perbuatan jahat' [[ayat/al-Quran-11-114], 'Bagi mereka, Allah menggantikan perbuatan buruk dengan perbuatan baik' [[ayat/Al-Quran-25-70], 'Dan meminjamkan pinjaman baik kepada Allah' [[ayat/al-Quran-73-20]], dan 'Dia mengubah kebaikan dengan kejahatan' [ayat/al-Quran-27-11]]. Hadis dikumpulkan dalam hadis suci dan tertulis: \"Sesungguhnya, Allah telah mencatat perbuatan baik dan jahat\" {cite:sahih-al-bukhari 7501} {cite:sahih-muslim 0131}; Hadis ini menyatakan bahwa perbuatan baik dan mereka yang tidak berbuat baik akan dicatat tujuh ratus kali {cite:Sahih-Muslim 0128}, dan setiap perbuatan anak Adam melipatgandakan amal baik sepuluh kali lipat, kecuali puasa {cite:Sunan-ibn-Majah 1638}; dalam Islam, ganjaran bagi yang melakukan Sunnah baik dan ganjaran bagi mereka yang bertindak sesuai {cite:Sahih-Muslim 1017}; dan siapa pun yang membunuh tokek pada pukulan pertama melakukan perbuatan baik {cite:Sunan-abi-Dawud 5263}. \"Al-Hasna\" disebut sebagai ganjaran kebaikan: \"Maka ada ganjaran atas kebaikan\" [[ayat/Al-Qur'an-18-88]] dan \"Kebaikan bagi mereka yang berbuat baik dan lebih\" [[ayat/Al-Quran-10-26]] dan \"Dan ia jujur kepada yang terbaik\" [[ayat/Al-Quran-92-6]]. Dalam penggunaan Al-Qur'an, perbuatan baik memiliki dua makna, dan catatan ini menyatukannya: tindakan taat dan turunnya kebaikan serta penghiburan di dunia ini — misalnya, \"Dan ketika amal baik datang, mereka berkata\" [[ayat/Al-Quran-4-78]] — dan \"hutang yang baik\" berarti hutang kepada Allah [[ayat/Al-Quran-2-2-245]]. \"Nama-nama indah\" adalah bentuk lain yang tidak tercatat dalam bagian perbuatan baik."
