summary:
  ar: "الأرابيسك زخرفة نباتية منمّطة لا تحاكي الطبيعة، تنمو فيها الأوراق من سيقان متصلة بها، وهي علامة الفن الإسلامي. تقول دائرة المعارف الإسلامية إن لها نموذجاً أول في زخارف العصور القديمة المتأخرة، وإنها اكتسبت شكلها المميز في القرن التاسع في العصر العباسي وفي الأندلس، وظهرت مكتملة في القرن الحادي عشر، ثم انتقلت من إسبانيا الإسلامية إلى أوروبا المسيحية باسم موريسك في أواخر القرن الخامس عشر."
  en: "The arabesque is a stylised, non-naturalistic vegetal ornament in which leaves grow from the stalks they stay joined to, and it is a signature of Islamic art. The Encyclopaedia of Islam says it has a prototype in late antique motifs, took its typical shape in the ninth century under the Abbasids and in Islamic Spain, and appears fully developed in the eleventh century. From Islamic Spain it reached Christian Europe as the moresque in the late fifteenth century."
  fr: "L’arabesque est un ornement végétal stylisé et non naturaliste, dans lequel les feuilles naissent des tiges auxquelles elles restent unies ; elle est une signature de l’art islamique. L’Encyclopédie de l’Islam dit qu’elle trouve son prototype dans les motifs de l’Antiquité tardive, prit sa forme typique au IXe siècle sous les Abbassides et dans l’Espagne islamique, et apparaît pleinement développée au XIe siècle. De l’Espagne islamique, elle gagna l’Europe chrétienne sous le nom de moresque à la fin du XVe siècle."
  ur: "ارابسک نباتی آرائش کی ایک منقش صورت ہے جو فطرت کی نقل نہیں کرتی اور جس میں پتے اپنی شاخوں سے جڑے رہ کر اگتے ہیں، اور یہ اسلامی فن کی علامت ہے۔ انسائیکلوپیڈیا آف اسلام کے مطابق اس کا اولین نمونہ قدیم دورِ متاخر کے نقوش میں ہے، نویں صدی میں عباسیوں کے تحت اور اسلامی ہسپانیہ میں اس نے مخصوص شکل پائی، اور گیارہویں صدی میں مکمل ہو کر ظاہر ہوا۔ پندرہویں صدی کے اواخر میں یہ اسلامی ہسپانیہ سے مسیحی یورپ تک موریسک کے نام سے پہنچا۔"
  es: "El arabesco es un ornamento vegetal estilizado y no naturalista en el que las hojas brotan de los tallos a los que permanecen unidas, y es un rasgo distintivo del arte islámico. La Enciclopedia del Islam afirma que tiene un prototipo en los motivos de la Antigüedad tardía, adquirió su forma típica en el siglo IX bajo el dominio abasí y en la España islámica, y aparece plenamente desarrollado en el siglo XI. Desde la España islámica llegó a la Europa cristiana como el estilo morisco a finales del siglo XV."
  tr: "Arabesk, doğayı taklit etmeyen, yaprakların bağlı saplardan büyüdüğü desenli bir bitki süslemesidir ve İslam sanatının ayırt edici özelliğidir. İslam Ansiklopedisi, geç antik çağın süslemelerinde en eski örnek olduğunu, ayırt edici şeklini dokuzuncu yüzyılda Abbasiler döneminde ve Endülüs'te kazandığını, on birinci yüzyılda tamamlanmış ve ardından on beşinci yüzyılın sonlarında Morisko adıyla İslam İspanyası'ndan Hristiyan Avrupa'ya taşındığını belirtir."
  id: "Arabesque adalah dekorasi vegetasi bermotif yang tidak meniru alam, di mana daun-daun tumbuh dari batang yang saling terhubung, dan merupakan ciri khas seni Islam. Ensiklopedia Islam menyatakan bahwa ini memiliki contoh paling awal dalam dekorasi akhir zaman kuno, dan memperoleh bentuk khasnya pada abad kesembilan selama era Abbasiyah dan di al-Andalus, tampak lengkap pada abad kesebelas, lalu pindah dari Spanyol Islam ke Eropa Kristen dengan nama Morisco pada akhir abad kelima belas."
