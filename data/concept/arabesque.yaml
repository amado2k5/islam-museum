id: concept/arabesque
class: concept
kind: art_form
label:
  ar: "الأرابيسك ⁦(الزخرفة الإسلامية)⁩"
  en: "Arabesque"
summary:
  ar: "الأرابيسك زخرفة نباتية منمّطة لا تحاكي الطبيعة، تنمو فيها الأوراق من سيقان متصلة بها، وهي علامة الفن الإسلامي. تقول دائرة المعارف الإسلامية إن لها نموذجاً أول في زخارف العصور القديمة المتأخرة، وإنها اكتسبت شكلها المميز في القرن التاسع في العصر العباسي وفي الأندلس، وظهرت مكتملة في القرن الحادي عشر، ثم انتقلت من إسبانيا الإسلامية إلى أوروبا المسيحية باسم موريسك في أواخر القرن الخامس عشر."
  en: "The arabesque is a stylised, non-naturalistic vegetal ornament in which leaves grow from the stalks they stay joined to, and it is a signature of Islamic art. The Encyclopaedia of Islam says it has a prototype in late antique motifs, took its typical shape in the ninth century under the Abbasids and in Islamic Spain, and appears fully developed in the eleventh century. From Islamic Spain it reached Christian Europe as the moresque in the late fifteenth century."
  ur: "ارابسک نباتی آرائش کی ایک منقش صورت ہے جو فطرت کی نقل نہیں کرتی اور جس میں پتے اپنی شاخوں سے جڑے رہ کر اگتے ہیں، اور یہ اسلامی فن کی علامت ہے۔ انسائیکلوپیڈیا آف اسلام کے مطابق اس کا اولین نمونہ قدیم دورِ متاخر کے نقوش میں ہے، نویں صدی میں عباسیوں کے تحت اور اسلامی ہسپانیہ میں اس نے مخصوص شکل پائی، اور گیارہویں صدی میں مکمل ہو کر ظاہر ہوا۔ پندرہویں صدی کے اواخر میں یہ اسلامی ہسپانیہ سے مسیحی یورپ تک موریسک کے نام سے پہنچا۔"
