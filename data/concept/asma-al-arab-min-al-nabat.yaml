label: { ar: "تسمية العرب لأبنائهم على أسماء النبات", en: "Arab naming of children after plants" }
summary:
  ar: "لاحظ الهمداني أن العرب تميل في أسماء الرجال إلى العِضاه الشائكة المرتعية لما فيها من الخشونة والحدة والصلابة والصبر على قلة المياه — فمن أسمائهم طلحة وسَمُرة وأوسجة وعُرفطة وقَنادة وعِصية وصَبرة؛ وفي النساء أسماء النواعم والثمار كغَلْقة وبَشامة وبُسْرة وسَحَمّة {cite:sifat-jazirat-al-arab pp. 116-117}."
  en: "Al-Hamdani observes that the Arabs inclined to name their men after thorny grazing shrubs — for the hardness, sharpness and drought-endurance in them: Talha, Samura, Awsaja, 'Urfuta, Qanada, 'Isiya, Sabra — and their women after the soft plants and fruits: Ghilqa, Bashama, Busra, Sahamma {cite:sifat-jazirat-al-arab pp. 116-117}."
