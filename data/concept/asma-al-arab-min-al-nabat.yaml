id: concept/asma-al-arab-min-al-nabat
class: concept
kind: social
label:
  ar: "تسمية العرب لأبنائهم على أسماء النبات"
  en: "Arab naming of children after plants"
  fr: "Les noms d’enfants arabes tirés des plantes"
  es: "Nombres árabes para niños inspirados en plantas"
  ur: "پودوں کے نام پر بچوں کے عرب نام"
  tr: "Araplar çocuklarına bitkilerin isimlerini verdiler"
  id: "Orang Arab menamai anak-anak mereka berdasarkan tanaman"
summary:
  ar: "لاحظ الهمداني أن العرب تميل في أسماء الرجال إلى العِضاه الشائكة المرتعية لما فيها من الخشونة والحدة والصلابة والصبر على قلة المياه — فمن أسمائهم طلحة وسَمُرة وأوسجة وعُرفطة وقَنادة وعِصية وصَبرة؛ وفي النساء أسماء النواعم والثمار كغَلْقة وبَشامة وبُسْرة وسَحَمّة {cite:sifat-jazirat-al-arab pp. 116-117}."
  en: "Al-Hamdani observes that the Arabs inclined to name their men after thorny grazing shrubs — for the hardness, sharpness and drought-endurance in them: Talha, Samura, Awsaja, 'Urfuta, Qanada, 'Isiya, Sabra — and their women after the soft plants and fruits: Ghilqa, Bashama, Busra, Sahamma {cite:sifat-jazirat-al-arab pp. 116-117}."
  fr: "Al-Hamdani observe que les Arabes tendaient à donner à leurs hommes les noms d’arbustes épineux des pâturages — pour leur dureté, leur caractère piquant et leur résistance à la sécheresse : Talha, Samura, Awsaja, 'Urfuta, Qanada, 'Isiya, Sabra — et à leurs femmes ceux de plantes tendres et de fruits : Ghilqa, Bashama, Busra, Sahamma {cite:sifat-jazirat-al-arab pp. 116-117}."
  es: "Al-Hamdani observa que los árabes tendían a nombrar a sus hombres en honor a arbustos espinosos para pastoreo —por su dureza, agudeza y resistencia a la sequía—: Talha, Samura, Awsaja, 'Urfuta, Qanada, 'Isiya, Sabra —y a sus mujeres en honor a plantas y frutos suaves—: Ghilqa, Bashama, Busra, Sahamma {cite:sifat-jazirat-al-arab pp. 116-117}."
  ur: "الحمدانی نے مشاہدہ کیا ہے کہ عرب اپنے مردوں کے نام کانٹے دار چرنے والی جھاڑیوں کے نام پر رکھتے تھے - ان میں سختی، نفاست اور خشک سالی کی وجہ سے: طلحہ، سمورا، اوسجا، عرفوتا، کنادہ، عصیہ، صابرہ - اور ان کی عورتیں: نرم پودوں، بخارمہ، بصرہ کے پھلوں کے بعد۔ {حوالہ:صفت جزیرۃ العرب صفحہ 116-117}۔"
  tr: "El-Hamdani, Arapların erkek isimlerindeki dikenli, otlayan kısımları pürüzlülükleri, keskinlikleri, sertlikleri ve kıt suya karşı sabrı nedeniyle kullanma eğiliminde olduklarını belirtti—isimleri arasında Talha, Samra, Awsajah, Arfatah, Qandada, Asiya ve Sabra bulunur; kadınlar arasında ise meyve ve kuyuların isimleri Ghalqa, Shama, Basra ve Sahmah gibidir {cite:sifat-jazirat-al-arab s. 116-117}."
  id: "Al-Hamdani mencatat bahwa orang Arab cenderung menyebut bagian berduri dan merumput dalam nama pria karena kekasaran, ketajaman, kekerasan, dan kesabaran terhadap air yang terbatas—di antara nama-nama mereka adalah Talha, Samra, Awsajah, Arfatah, Qandada, Asiya, dan Sabra; dan di antara wanita, nama buah dan sumur adalah Ghalqa, Shama, Basra, dan Sahmah {cite:sifat-jazirat-al-arab hlm. 116-117}."
