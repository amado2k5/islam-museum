label: { ar: "مجانسة المطبوخ للخلط عند ابن سينا", en: "Matching the decoction to the humour in the Canon", ur: "مطبوخ کو خلط کے موافق رکھنا قانون میں" }
summary:
  ar: "يقرر ابن سينا أن الحبوب تسقى في طبيخ يجانسها، فالمسهل للصفراء في طبيخ الشاهترج والمسهل للسوداء في طبيخ الأفتيمون والبسفايج والمخرج للبلغم في طبيخ القنطوريون، وأن يشرب المطبوخ فاتراً وتسخن معدة الشارب وقدمه {cite:canon-ibn-sina-print-v1 p.280}."
  en: "Ibn Sina lays down that pills are drunk in a decoction of like kind: the bile purgative in fumitory, the black-bile purgative in dodder of thyme and polypody, and the phlegm purgative in centaury, taken lukewarm with the stomach and feet of the drinker kept warm {cite:canon-ibn-sina-print-v1 p.280}."
