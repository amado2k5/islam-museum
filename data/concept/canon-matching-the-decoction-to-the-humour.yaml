id: concept/canon-matching-the-decoction-to-the-humour
class: concept
kind: scientific
label:
  ar: "مجانسة المطبوخ للخلط عند ابن سينا"
  en: "Matching the decoction to the humour in the Canon"
  fr: "Adapter la décoction à l’humeur dans le Canon"
  ur: "مطبوخ کو خلط کے موافق رکھنا قانون میں"
  es: "Adaptar la decocción al humor del Canon"
summary:
  ar: "يقرر ابن سينا أن الحبوب تسقى في طبيخ يجانسها، فالمسهل للصفراء في طبيخ الشاهترج والمسهل للسوداء في طبيخ الأفتيمون والبسفايج والمخرج للبلغم في طبيخ القنطوريون، وأن يشرب المطبوخ فاتراً وتسخن معدة الشارب وقدمه {cite:canon-ibn-sina-print-v1 p.280}."
  en: "Ibn Sina lays down that pills are drunk in a decoction of like kind: the bile purgative in fumitory, the black-bile purgative in dodder of thyme and polypody, and the phlegm purgative in centaury, taken lukewarm with the stomach and feet of the drinker kept warm {cite:canon-ibn-sina-print-v1 p.280}."
  fr: "Ibn Sina décrit pilules en décoction apparentée : fumeterre pour bile, cuscute de thym et polypode pour bile noire, centaurée pour phlegme ; prise tiède, estomac et pieds tenus chauds {cite:canon-ibn-sina-print-v1 p.280}."
  es: "Ibn Sina establece que las píldoras se toman en una decocción del mismo tipo: el purgante de bilis en fumaria, el purgante de bilis negra en cuscuta de tomillo y polipodio, y el purgante de flema en centaurea, tomado tibio con el estómago y los pies del bebedor mantenidos calientes {cite:canon-ibn-sina-print-v1 p.280}."
  ur: "ابن سینا بیان کرتے ہیں کہ گولیاں اس قسم کے کاڑھے میں پی جاتی ہیں: شہوت میں صفرا کو دور کرنے والی، تائیم اور پولی پوڈی کے ڈوڈر میں کالی پت کو دور کرنے والی، اور بلغم کو دور کرنے والی سینٹوری میں، پینے والے کے پیٹ اور پاؤں کے ساتھ نیم گرم پینے سے گرم رکھا جاتا ہے۔"
