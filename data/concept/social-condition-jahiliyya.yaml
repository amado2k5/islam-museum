summary:
  ar: "صورة الرحيق المختوم للمجتمع الجاهلي: مكانة المرأة الرفيعة في الأشراف واختلاط الأوساط الأخرى، أنكحة الجاهلية الأربعة في حديث عائشة، تعدد الزوجات بلا حد والجمع بين الأختين ونكاح زوجة الأب والطلاق بيد الرجال، شيوع الزنا، معاملة الأولاد بين الحنان والوأد، العصبية القبلية والمثل «انصر أخاك ظالماً أو مظلوماً»، تفكك العلاقة بين القبائل، والأشهر الحرم رحمة لهم؛ ويحكم المؤلف أن الحالة الاجتماعية كانت في الحضيض."
  en: "al-Raheeq al-Makhtum's picture of Jahili society: the high standing of women among the nobility and the mixing of the other classes, the four Jahili forms of marriage in Aisha's report, unlimited polygamy, marrying two sisters and a father's widow, divorce in men's hands, widespread fornication, treatment of children from tenderness to burial alive, tribal asabiyya and the maxim 'help your brother, wronging or wronged', the disjointed relations between tribes, and the sacred months as their mercy; the author judges the social condition to have been at its lowest."
  es: "La descripción que hace al-Raheeq al-Makhtum de la sociedad preislámica incluye: la elevada posición de las mujeres entre la nobleza y la mezcla con las demás clases, las cuatro formas de matrimonio preislámicas mencionadas en el relato de Aisha, la poligamia ilimitada, el matrimonio con dos hermanas y la viuda del padre, el divorcio en manos de los hombres, la fornicación generalizada, el trato a los niños desde la ternura hasta el entierro en vida, la asabiyya tribal y la máxima \"ayuda a tu hermano, sea quien lo haga o quien lo haya hecho\", las relaciones fragmentadas entre las tribus y los meses sagrados como muestra de misericordia; el autor considera que la condición social se encontraba en su punto más bajo."
  fr: "Le tableau que dresse al-Raheeq al-Makhtum de la société jahili: le statut élevé des femmes parmi la noblesse et le mélange des autres classes, les quatre formes de mariage jahili rapportées par Aïcha, la polygamie illimitée, le mariage avec deux sœurs et la veuve de son père, le divorce prononcé par les hommes, la fornication répandue, le traitement des enfants allant de la tendresse à l’enterrement vivant, l’asabiyya tribale et la maxime « aide ton frère, qu’il ait fait du tort ou qu’il en ait été victime », les relations désunies entre les tribus et les mois sacrés comme leur miséricorde; l’auteur estime que la condition sociale était alors à son plus bas."
  ur: "الرحیق المختم کی جاہلی معاشرے کی تصویر: شرافت میں عورتوں کا بلند مقام اور دوسرے طبقوں کا اختلاط، عائشہ کی رپورٹ میں شادی کی چار جاہلی صورتیں، لامحدود تعدد ازدواج، دو بہنوں اور ایک باپ کی بیوہ سے شادی، مردوں کے ہاتھ میں طلاق، عصمت دری سے لے کر زنا بالجبر تک کا وسیع سلوک۔ اصابیہ اور مقتدرہ 'اپنے بھائی کی مدد کریں، ظلم یا زیادتی'، قبائل کے درمیان منقطع تعلقات، اور مقدس مہینے ان کی رحمت کے طور پر؛ مصنف سماجی حالت کو اس کی سب سے کم ترین سطح پر قرار دیتا ہے۔"
