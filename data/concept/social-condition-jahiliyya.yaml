summary:
  ar: "صورة الرحيق المختوم للمجتمع الجاهلي: مكانة المرأة الرفيعة في الأشراف واختلاط الأوساط الأخرى، أنكحة الجاهلية الأربعة في حديث عائشة، تعدد الزوجات بلا حد والجمع بين الأختين ونكاح زوجة الأب والطلاق بيد الرجال، شيوع الزنا، معاملة الأولاد بين الحنان والوأد، العصبية القبلية والمثل «انصر أخاك ظالماً أو مظلوماً»، تفكك العلاقة بين القبائل، والأشهر الحرم رحمة لهم؛ ويحكم المؤلف أن الحالة الاجتماعية كانت في الحضيض."
  en: "al-Raheeq al-Makhtum's picture of Jahili society: the high standing of women among the nobility and the mixing of the other classes, the four Jahili forms of marriage in Aisha's report, unlimited polygamy, marrying two sisters and a father's widow, divorce in men's hands, widespread fornication, treatment of children from tenderness to burial alive, tribal asabiyya and the maxim 'help your brother, wronging or wronged', the disjointed relations between tribes, and the sacred months as their mercy; the author judges the social condition to have been at its lowest."
