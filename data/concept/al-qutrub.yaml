summary:
  ar: "يصف ابن سينا القطرب بأنه نوع من المالنخوليا يجعل الإنسان فراراً من الناس محباً لمجاورة الموتى والمقابر، ويذكر علاماته وسبب تسميته وسببه الصفراء المحترقة والسوداء {cite:canon-ibn-sina-print-v2 p.111}"
  en: "Ibn Sina describes qutrub as a kind of melancholia that makes a person flee from living people and love the neighbourhood of the dead and the graves, and gives its signs, the reason for its name and its cause in burnt bile and black bile {cite:canon-ibn-sina-print-v2 p.111}"
  fr: "Ibn Sina décrit le qutrub comme une espèce de mélancolie qui fait fuir à l’homme les vivants et lui fait aimer le voisinage des morts et des tombes, et il en donne les signes, la raison du nom et la cause, dans la bile brûlée et la bile noire {cite:canon-ibn-sina-print-v2 p.111}"
  ur: "ابن سینا قطرب کو مالنخولیا کی ایک قسم بتاتا ہے جو انسان کو زندہ لوگوں سے بھاگنے والا اور مردوں اور قبرستانوں کی ہمسائیگی کا شوقین بنا دیتی ہے، اور اس کی علامات، نام کی وجہ اور سبب جلی صفراء اور سودا بتاتا ہے {cite:canon-ibn-sina-print-v2 p.111}۔"
  es: "Ibn Sina describe el qutrub como una especie de melancolía que hace que una persona huya de los vivos y ame la cercanía de los muertos y las tumbas, y da sus signos, la razón de su nombre y su causa en la bilis quemada y la bilis negra {cite:canon-ibn-sina-print-v2 p.111}"
