summary:
  ar: "في الفصل الثالث يصف ابن سينا الأجوف: أصله يتفرق في الكبد كالشعر ليجذب الغذاء من شعب الباب، ثم يطلع ساقه عند الحدبة فينقسم صاعداً وهابطاً، ويخرق الصاعد الحجاب ويبلغ القلب عند أذنه اليمنى {cite:canon-ibn-sina-print-v1 p.88}."
  en: "In the third chapter Ibn Sina describes the hollow vein: its root spreads in the liver like hairs to draw food from the branches of the gate vein, its stem then rises at the convexity and divides into rising and descending parts, and the rising part pierces the diaphragm and reaches the heart at its right auricle {cite:canon-ibn-sina-print-v1 p.88}."
