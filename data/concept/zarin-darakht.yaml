summary:
  ar: "زرين درخت شجرة يُعرف بالعامية بالزنزلخت، وماء ورقه مع الميبختج ينفع عسر البول، ويخرج الدم الجامد من المثانة، وينفع عرق النسا ولسع الهوام. {cite:canon-ibn-sina-print-v1 p.466}"
  en: "Zarin darakht is a tree known colloquially as zinzalakht. The water of its leaves, with maybakhtaj, helps difficult urination and expels clotted blood from the bladder; it helps sciatica and vermin stings. {cite:canon-ibn-sina-print-v1 p.466}"
  ur: "زرین درخت ایک درخت ہے جسے عوام میں زنزلخت کہتے ہیں؛ اس کے پتوں کا پانی میبختج کے ساتھ پیشاب کی دشواری میں مفید ہے، مثانے سے جمے ہوئے خون کو نکالتا ہے، اور عرق النسا اور کیڑوں کے ڈنک میں مفید ہے۔ {cite:canon-ibn-sina-print-v1 p.466}"
  es: "Zarin darakht es un árbol conocido coloquialmente como zinzalakht. El agua de sus hojas, con maybakhtaj, facilita la micción dificultosa y ayuda a expulsar la sangre coagulada de la vejiga; también alivia la ciática y las picaduras de parásitos. {cite:canon-ibn-sina-print-v1 p.466}"
  fr: "Le Zarin darakht est un arbre connu familièrement sous le nom de zinzalakht. L'eau extraite de ses feuilles, associée au maybakhtaj, facilite la miction difficile et dissout le sang coagulé dans la vessie; elle soulage également la sciatique et les piqûres d'insectes. {cite:canon-ibn-sina-print-v1 p.466}"
