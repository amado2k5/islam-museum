summary:
  ar: "شجرة تنبت عند المياه القائمة، ثمرها قابض يستعمل بدل العفص، وورقها وخشبها ودخانها تنفع من أمراض الفم والقروح والأورام والنفث."
  en: "A tree that grows by standing water; its fruit is astringent and used in place of gall nut, and its leaf, wood and smoke help mouth ailments, ulcers, swellings and spitting of blood."
  ur: "کھڑے پانی کے پاس اُگنے والا درخت؛ اس کا پھل قابض ہے اور عفص کی جگہ استعمال ہوتا ہے، اور اس کا پتّا، لکڑی اور دھواں منہ کی بیماریوں، زخموں، سوجن اور خون تھوکنے میں فائدہ دیتے ہیں۔"
  es: "Árbol que crece en aguas estancadas; su fruto es astringente y se usa en lugar de la nuez de agalla, y sus hojas, madera y humo ayudan a aliviar dolencias bucales, úlceras, hinchazones y la expectoración de sangre."
