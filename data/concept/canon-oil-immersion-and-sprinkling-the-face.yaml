summary:
  ar: "يختم ابن سينا الفصل التاسع عشر بأن الاستنقاع في الزيت ينفع أصحاب الإعياء، وأن طبخ ثعلب أو ضبع فيه على ما سيصفه أفضل علاج لأصحاب أوجاع المفاصل والنقرس، وأن بل الوجه ورش الماء عليه ينعش القوة المسترخية {cite:canon-ibn-sina-print-v1 p.143}."
  en: "Ibn Sina closes chapter 19 by saying that soaking in oil helps people with fatigue, that cooking a fox or a hyena in it, as he will describe, is the best treatment for pains of the joints and gout, and that wetting the face and sprinkling water on it revives a slackened power {cite:canon-ibn-sina-print-v1 p.143}."
