id: concept/canon-oil-immersion-and-sprinkling-the-face
class: concept
kind: scientific
label:
  ar: "الاستنقاع في الأدهان ورش الماء على الوجه عند ابن سينا"
  en: "Soaking in oils and sprinkling water on the face in the Canon"
  fr: "Immersion huileuse et aspersion du visage dans le Canon"
  ur: "تیلوں میں بیٹھنا اور چہرے پر پانی چھڑکنا، قانون کے مطابق"
  es: "Remojar la piel en aceites y rociar agua sobre el rostro en el Canon"
  tr: "İbn Sina'ya göre alkol içmek ve yüze su serpmek"
  id: "Minum alkohol dan menyiramkan air ke wajah menurut Ibn Sina"
summary:
  ar: "يختم ابن سينا الفصل التاسع عشر بأن الاستنقاع في الزيت ينفع أصحاب الإعياء، وأن طبخ ثعلب أو ضبع فيه على ما سيصفه أفضل علاج لأصحاب أوجاع المفاصل والنقرس، وأن بل الوجه ورش الماء عليه ينعش القوة المسترخية {cite:canon-ibn-sina-print-v1 p.143}."
  en: "Ibn Sina closes chapter 19 by saying that soaking in oil helps people with fatigue, that cooking a fox or a hyena in it, as he will describe, is the best treatment for pains of the joints and gout, and that wetting the face and sprinkling water on it revives a slackened power {cite:canon-ibn-sina-print-v1 p.143}."
  fr: "Ibn Sina clôt le chapitre 19 par immersion huileuse contre fatigue, huile où renard ou hyène ont cuit jugée meilleure contre douleurs articulaires et goutte, et aspersion du visage pour ranimer la faculté relâchée {cite:canon-ibn-sina-print-v1 p.143}."
  es: "Ibn Sina cierra el capítulo 19 diciendo que remojarse en aceite ayuda a las personas con fatiga, que cocinar un zorro o una hiena en él, como describirá, es el mejor tratamiento para los dolores de las articulaciones y la gota, y que mojar la cara y rociarla con agua reaviva una fuerza debilitada {cite:canon-ibn-sina-print-v1 p.143}."
  ur: "ابن سینا نے باب 19 کو یہ کہتے ہوئے ختم کیا ہے کہ تیل میں بھگونے سے تھکاوٹ کا شکار لوگوں کو فائدہ ہوتا ہے، کہ اس میں لومڑی یا ہائینا پکانا، جیسا کہ وہ بیان کریں گے، جوڑوں اور گاؤٹ کے درد کا بہترین علاج ہے، اور یہ کہ چہرے کو گیلا کرکے اس پر پانی چھڑکنے سے سستی طاقت بحال ہوتی ہے۔"
  tr: "İbn Sina, on dokuzuncu bölümü bitkin olanlar için yağ ıslatmanın faydalı olduğunu, tilki veya sırtlan pişirmenin eklem ağrısı ve gut hastaları için en iyi çare olarak tanımlandığını, hatta yüze su uygulamanın bile rahatlamış gücü tazelediğini belirterek bitirir {cite:canon-ibn-sina-print-v1 s.143}."
  id: "Ibn Sina menutup bab sembilan belas dengan menyatakan bahwa merendam minyak bermanfaat bagi mereka yang kelelahan, dan bahwa memasak rubah atau hyena di dalamnya digambarkan sebagai obat terbaik bagi mereka yang mengalami nyeri sendi dan asam urat, dan bahkan dengan mengoleskan air ke wajah dapat menyegarkan kekuatan yang rileks {cite:canon-ibn-sina-print-v1 hlm.143}."
