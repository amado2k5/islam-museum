id: concept/opportunity-cost-in-islam
class: concept
kind: term
tags: [islamic-economy-browser, islamic-economy-money]
label:
  ar: "تكلفة الخيار والمفاضلة بين المصالح"
  en: "Opportunity cost and choosing between benefits"
  es: "Costo de oportunidad y elección entre beneficios"
  fr: "Coût d'opportunité et choix entre les avantages"
  ur: "مواقع کی قیمت اور فوائد کے درمیان انتخاب"
  tr: "Seçim maliyeti ve çıkarlar arasındaki ödünleşme"
  id: "Biaya pilihan dan pertukaran antara kepentingan"
summary:
  ar: "يربط المؤلف تكلفة الخيار ⁦(تكلفة الفرصة المختارة)⁩ بعوامل الإنتاج من وقت وجهد ومال، ويرى أن الاختيار الرشيد يجب أن يكون أنفع من الفرصة الفائتة، وأن المفاضلة بين المصالح عند الفقهاء هي ما يسميه الاقتصاديون التضحية ويسميه الأصوليون التفويت {cite:usul-iqtisad-islami-0660 p. 133} {cite:usul-iqtisad-islami-0660 p. 135}."
  tr: "Yazar, seçimin maliyetini (seçilen fırsatın maliyetini) zaman, çaba ve para gibi üretim faktörlerine bağlar ve akıllıca bir seçimin kaçırılmış bir fırsattan daha faydalı olması gerektiğine inanır; yargıcılara göre çıkarlar arasındaki dengenin ekonomistlerin fedakarlık dediği ve Usul akademisyenlerinin transfer dediği şey olduğunu düşünür {cite:usul-iqtisad-islami-0660 s. 133} {cite:usul-iqtisad-islami-0660 s. 135}."
  id: "Penulis mengaitkan biaya pilihan (biaya kesempatan yang dipilih) dengan faktor-faktor produksi, termasuk waktu, usaha, dan uang, dan percaya bahwa pilihan bijak seharusnya lebih bermanfaat daripada kesempatan yang terlewatkan, dan bahwa pertukaran antara kepentingan menurut ahli hukum adalah apa yang disebut ekonom sebagai pengorbanan dan para sarjana Usul menyebut transfer {cite:usul-iqtisad-islami-0660 hlm. 133} {cite:usul-iqtisad-islami-0660 hlm. 135}."
