id: concept/ilaj-al-bawasir-wa-al-arbiyan
class: concept
kind: scientific
label:
  ar: علاج البواسير والأربيان في الأنف
  en: The treatment of the piles and polyps in the nose
  ur: ناک کی بواسیر اور اربیان کا علاج
  es: "El tratamiento de las hemorroides y los pólipos nasales"
  fr: "Traitement des hémorroïdes et des polypes nasaux"
summary:
  ar: القسم الأول يقطع بسكين دقيقة ثم يجرد بالمجرد ناعماً والثاني الأنسب أن يكوى بأدوية من جنس ما يعرف أو بالنار بمكاو صغار دقاق أو تقطع بمجارد تخرج جميع ما في الأنف من الزوائد وأجود المجارد الأنبوبي ثم يصب في المنخرين خل وماء، فإن بقيت منه في العمق بقية يستعمل المنشار الخيطي وصفته خيط من شعر أو إبريسم يعقد عقداً يصير بها كالمنشار يدخل في إبرة معقفة من المنخر حتى يخرج إلى الحنك ثم ينشر به بقية اللحم جذباً من الجانبين ثم يؤخذ أنبوب من جنس ما يعرف يلف عليه خرقة ويذر عليها أدوية البواسير ليبقى موضع النفس مفتوحاً ⁦(أعمال اليد كلها تحمل وصف الكتاب لا استعمال وأسماء الأدوية تحمل جنسها)⁩ {cite:canon-ibn-sina-print-v2 p.249}
  en: 'The first kind is cut with a fine knife then scraped gently with the scraper; the second is best cauterised, either with drugs of the known kind or with small fine irons, or cut with scrapers that take out all the growths in the nose — the best scraper being the tubular — then vinegar and water are poured into the nostrils. If a remnant stays deep, the thread-saw is used: a hair or silk thread knotted into saw-teeth, passed on a bent lead needle from the nostril till it comes out at the palate, then the rest of the flesh is sawn by pulling from both sides; a tube of the known kind wrapped in cloth dusted with the piles drugs then keeps the air-path open ⁦(all the hand-works are carried as the book''s descriptions, not as procedures; the drug names only by kind)⁩ {cite:canon-ibn-sina-print-v2 p.249}'
  ur: 'پہلی قسم باریک چاقو سے کاٹی جاتی ہے پھر جھاڑنے والے سے نرمی سے جھاڑی جاتی ہے؛ دوسری قسم کے لیے بہتر ہے کہ داغی جائے — معروف جنس کے ادویہ سے یا چھوٹی باریک لوہوں سے — یا ایسے جھاڑنے والوں سے کاٹی جائے جو ناک کے تمام اضافے نکال دیں — بہترین جھاڑنے والا نلکی نما ہے — پھر نتھنوں میں سرکہ اور پانی ڈالا جائے؛ اگر گہرائی میں کوئی بقیہ رہے تو دھاگا آرا استعمال ہوتا ہے: بال یا ریشم کا دھاگا جس میں ایسی گانٹھیں ہوں کہ آری کے داندے بن جائیں، اسے جھکی ہوئی سیسے کی سوئی میں نتھنے سے ڈال کر تالو تک نکالا جائے پھر دونوں طرف سے کھینچ کر بقیہ گوشت کاٹا جائے؛ پھر معروف جنس کی نلکی پر بواسیر کے ادویہ چھڑکا کپڑا لپیٹا جائے کہ سانس کا راستہ کھلا رہے ⁦(ہاتھ کے تمام کام کتاب کے بیان کے طور پر، طریقہ کار نہیں؛ ادویہ کے نام صرف جنس کے اعتبار سے)⁩ {cite:canon-ibn-sina-print-v2 p.249}'
  es: "El primer tipo se corta con un cuchillo fino y luego se raspa suavemente con el raspador; el segundo se cauteriza mejor, ya sea con medicamentos conocidos o con hierros finos pequeños, o se corta con raspadores que extraen todos los crecimientos de la nariz —el mejor raspador es el tubular—, luego se vierte vinagre y agua en las fosas nasales. Si queda algún remanente profundo, se usa la sierra de hilo: un hilo de pelo o seda anudado en dientes de sierra, se pasa por una aguja de plomo doblada desde la fosa nasal hasta que sale por el paladar, luego se corta el resto de la carne tirando de ambos lados; un tubo conocido envuelto en tela espolvoreada con los medicamentos para las hemorroides mantiene las vías respiratorias abiertas (todos los trabajos manuales se presentan como descripciones del libro, no como procedimientos; los nombres de los medicamentos solo se indican por tipo) {cite:canon-ibn-sina-print-v2 p.249}"
  fr: "Le premier type d'excroissance est incisé avec un couteau fin, puis gratté délicatement avec un grattoir; le second est cautérisé de préférence, soit avec des médicaments connus, soit avec de petits fers fins, soit incisé avec des grattoirs qui retirent toutes les excroissances nasales – le grattoir tubulaire étant le plus efficace – puis on verse de l'eau vinaigrée dans les narines. S'il reste un résidu en profondeur, on utilise la scie à fil: un cheveu ou un fil de soie noué en dents de scie, passé sur une aiguille de plomb courbée de la narine jusqu'au palais, puis le reste de la chair est scié en tirant des deux côtés; un tube du type connu, enveloppé dans un tissu saupoudré de médicaments contre les hémorroïdes, maintient ensuite les voies respiratoires ouvertes (tous les travaux manuels sont décrits dans le livre, et non présentés comme des procédures; les noms des médicaments sont indiqués uniquement par type). {cite:canon-ibn-sina-print-v2 p.249}"
