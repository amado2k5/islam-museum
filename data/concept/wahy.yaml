label:
  ar: الوحي
  en: Wahy (revelation)
  ur: وحی
  es: "Wahy (revelación)"
  fr: "Wahy (révélation)"
  tr: "vahiy"
  id: "wahyu"
summary:
  ar: "الوحي في التصور الإسلامي كلام الله المُنزَّل على رسله؛ «ونشهد أن القرآن كلام رب العالمين» {cite:aqida-tahawiyya §75}، ويفصّل شرح الطحاوية أن القرآن ليس بمخلوق {cite:sharh-tahawiyya-ibn-abi-al-izz}."
  en: "Wahy in Islamic conception is God's speech sent down to His messengers; 'we bear witness that the Qur'an is the speech of the Lord of the worlds' {cite:aqida-tahawiyya §75}, and the Sharh details that the Qur'an is not created {cite:sharh-tahawiyya-ibn-abi-al-izz}."
  es: "En la concepción islámica, Wahy es la palabra de Dios enviada a Sus mensajeros; \"damos testimonio de que el Corán es la palabra del Señor de los mundos\" {cite:aqida-tahawiyya §75}, y el Sharh detalla que el Corán no es creado {cite:sharh-tahawiyya-ibn-abi-al-izz}."
  fr: "Dans la conception islamique, le Wahy est la parole de Dieu transmise à Ses messagers; « nous témoignons que le Coran est la parole du Seigneur des mondes » {cite: aqida-tahawiyya §75}, et le Sharh précise que le Coran n'est pas créé {cite: sharh-tahawiyya-ibn-abi-al-izz}."
  ur: "اسلامی تصور میں وحی خدا کا کلام ہے جو اس کے رسولوں پر نازل ہوا ہے۔ 'ہم گواہی دیتے ہیں کہ قرآن رب العالمین کا کلام ہے' {حوالہ: عقیدہ طحاویہ §75}، اور شرح تفصیلات کہ قرآن تخلیق نہیں ہوا {حوالہ: شرح طحاویہ ابن ابی العز}۔"
  tr: "İslami kavramda vahiy, Allah'ın elçilerine vahyettiği sözdür; \"Ve biz şahitlik ederiz ki Kur'an dünyaların Rabbinin sözüdür\" {cite:aqida-tahawiyya §75} ve Al-Tahawiyya'nın tefsiri Kur'an'ın yaratılmadığını belirtir {cite:sharh-tahawiyya-ibn-abi-al-izz}."
  id: "Wahyu dalam konsepsi Islam adalah firman Allah yang diwahyukan kepada para rasul-Nya; \"Dan kami bersaksi bahwa Al-Qur'an adalah firman Tuhan segala alam\" {cite:aqida-tahawiyya §75}, dan komentar Al-Tahawiyya merinci bahwa Al-Qur'an bukanlah ciptaan {cite:sharh-tahawiyya-ibn-abi-al-izz}."
