summary:
  ar: "الوحي في التصور الإسلامي كلام الله المُنزَّل على رسله؛ «ونشهد أن القرآن كلام رب العالمين» {cite:aqida-tahawiyya §75}، ويفصّل شرح الطحاوية أن القرآن ليس بمخلوق {cite:sharh-tahawiyya-ibn-abi-al-izz}."
  en: "Wahy in Islamic conception is God's speech sent down to His messengers; 'we bear witness that the Qur'an is the speech of the Lord of the worlds' {cite:aqida-tahawiyya §75}, and the Sharh details that the Qur'an is not created {cite:sharh-tahawiyya-ibn-abi-al-izz}."
