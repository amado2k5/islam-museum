label: { ar: "إصلاح المسهل بما يخالفه عند ابن سينا", en: "Correcting a purgative with a drug of opposite quality in the Canon", ur: "مسہل کی اصلاح اس کی ضد والی دوا سے قانون میں" }
summary:
  ar: "يذكر ابن سينا أنه قد يحتاج إلى دواء يجانس الخلط المستفرغ في الكيفية كالسقمونيا للصفراء فيخلط به ما يخالفه في الكيفية ولا يمنع الإسهال كالهليلج ويتدارك سوء المزاج بعده، ولأصحاب أورام الأحشاء ملينات لطيفة {cite:canon-ibn-sina-print-v1 p.277}."
  en: "Ibn Sina notes that a drug may be needed that matches the humour in quality, such as scammony for bile, in which case a drug of opposite quality that does not hinder purging, such as myrobalan, is mixed in and the resulting bad temperament put right afterward; for those with swellings of the viscera he names gentle laxatives {cite:canon-ibn-sina-print-v1 p.277}."
