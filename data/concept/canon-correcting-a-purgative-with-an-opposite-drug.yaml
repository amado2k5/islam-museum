id: concept/canon-correcting-a-purgative-with-an-opposite-drug
class: concept
kind: scientific
label:
  ar: "إصلاح المسهل بما يخالفه عند ابن سينا"
  en: "Correcting a purgative with a drug of opposite quality in the Canon"
  fr: "Correction d’un purgatif par un remède contraire dans le Canon"
  ur: "مسہل کی اصلاح اس کی ضد والی دوا سے قانون میں"
  es: "Corregir un purgante con un fármaco de cualidad opuesta en el Canon"
summary:
  ar: "يذكر ابن سينا أنه قد يحتاج إلى دواء يجانس الخلط المستفرغ في الكيفية كالسقمونيا للصفراء فيخلط به ما يخالفه في الكيفية ولا يمنع الإسهال كالهليلج ويتدارك سوء المزاج بعده، ولأصحاب أورام الأحشاء ملينات لطيفة {cite:canon-ibn-sina-print-v1 p.277}."
  en: "Ibn Sina notes that a drug may be needed that matches the humour in quality, such as scammony for bile, in which case a drug of opposite quality that does not hinder purging, such as myrobalan, is mixed in and the resulting bad temperament put right afterward; for those with swellings of the viscera he names gentle laxatives {cite:canon-ibn-sina-print-v1 p.277}."
  fr: "Ibn Sina admet parfois un remède de même qualité que l’humeur, comme la scammonée pour la bile, corrigé par un contraire ne gênant pas la purge, comme le myrobolan, puis correction du mauvais tempérament résultant. Pour les gonflements viscéraux, il nomme des laxatifs doux {cite:canon-ibn-sina-print-v1 p.277}."
  es: "Ibn Sina señala que puede ser necesario un medicamento que coincida con el humor en calidad, como la escamonía para la bilis, en cuyo caso se mezcla un medicamento de calidad opuesta que no impida la purga, como el mirabolano, y luego se corrige el mal temperamento resultante; para aquellos con hinchazón de las vísceras nombra laxantes suaves {cite:canon-ibn-sina-print-v1 p.277}."
