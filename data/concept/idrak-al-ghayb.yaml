id: concept/idrak-al-ghayb
class: concept
kind: term
label:
  ar: إدراك الغيب
  en: Perception of the unseen
  ur: إدراك الغيب
  es: "Percepción de lo invisible"
  fr: "Perception de l'invisible"
summary:
  ur: غیب خبرِ صادق سے دریافت ہوتا ہے حواس سے نہیں — اصحابِ کہف اور روح کے سوال سے
    ثابت۔
  ar: 'صنف ابن خلدون مدارك الغيب عند البشر: الكهانة، والنظر في الأجسام الشفافة كالمرايا
    وطساس الماء، والنظر في قلوب الحيوانات وأكبادها وعظامها، والزجر في الطير والسباع،
    والطرق بالحصى والحبوب من الحنطة والنوى، وما يلقى على ألسنة المجانين من كلمات الغيب،
    وكلام النائم والميت لأول موته أو نومه، ومدارك أهل الرياضة من المتصوفة على سبيل
    الكرامة، وبين أن النفس ذات روحانية موجودة بالقوة تحجبها الحواس الجاذبة لها إلى
    الظاهر فإذا انغمست من الظاهر إلى الباطن ارتفع حجاب البدن لحظة إما بخاصية للإنسان
    على الإطلاق مثل النوم أو بخاصية لبعض البشر مثل الكهانة والطرق أو بالرياضة مثل
    أهل الكشف فتلتفت إلى الذوات الروحانية فوقها وفيها صور الموجودات فتقتبس منها علوماً
    وربما دفعتها إلى الخيال فيرصفها في القوالب المعتادة، والناظرون في المرايا يعانون
    رفع الحجاب بانحصار المدارك في البصر حتى يغيب عنه ويبدو بينهم وبين سطح المرآة كالغمام
    يتمثل فيه صور مداركهم، وإدراك المجانين مشوب بالباطل لفساد أمزجتهم أو مزاحمة النفوس
    الشيطانية {cite:muqaddima-ibn-khaldun p. 100-102}.'
  en: Soothsaying, scrying, augury, casting, possession, deathbed speech and Sufi
    kashf — all the soul's veil lifted a moment {cite:muqaddima-ibn-khaldun p. 100-102}.
  es: "Adivinación, clarividencia, augurio, lanzamiento de hechizos, posesión, discurso en el lecho de muerte y kashf sufí: todo el velo del alma se levantó por un momento {cite:muqaddima-ibn-khaldun p. 100-102}."
  fr: "Divination, divination, augure, incantation, possession, discours sur le lit de mort et kashf soufi — tout le voile de l'âme se levait un instant {cite:muqaddima-ibn-khaldun p. 100-102}."
