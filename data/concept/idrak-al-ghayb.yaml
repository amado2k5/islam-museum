id: concept/idrak-al-ghayb
class: concept
kind: term
label:
  ar: إدراك الغيب
  en: Perception of the unseen
  ur: إدراك الغيب
  es: "Percepción de lo invisible"
  fr: "Perception de l'invisible"
  tr: "görünmeyenin algılanması"
  id: "persepsi terhadap yang tak terlihat"
summary:
  ur: غیب خبرِ صادق سے دریافت ہوتا ہے حواس سے نہیں — اصحابِ کہف اور روح کے سوال سے
    ثابت۔
  ar: 'صنف ابن خلدون مدارك الغيب عند البشر: الكهانة، والنظر في الأجسام الشفافة كالمرايا
    وطساس الماء، والنظر في قلوب الحيوانات وأكبادها وعظامها، والزجر في الطير والسباع،
    والطرق بالحصى والحبوب من الحنطة والنوى، وما يلقى على ألسنة المجانين من كلمات الغيب،
    وكلام النائم والميت لأول موته أو نومه، ومدارك أهل الرياضة من المتصوفة على سبيل
    الكرامة، وبين أن النفس ذات روحانية موجودة بالقوة تحجبها الحواس الجاذبة لها إلى
    الظاهر فإذا انغمست من الظاهر إلى الباطن ارتفع حجاب البدن لحظة إما بخاصية للإنسان
    على الإطلاق مثل النوم أو بخاصية لبعض البشر مثل الكهانة والطرق أو بالرياضة مثل
    أهل الكشف فتلتفت إلى الذوات الروحانية فوقها وفيها صور الموجودات فتقتبس منها علوماً
    وربما دفعتها إلى الخيال فيرصفها في القوالب المعتادة، والناظرون في المرايا يعانون
    رفع الحجاب بانحصار المدارك في البصر حتى يغيب عنه ويبدو بينهم وبين سطح المرآة كالغمام
    يتمثل فيه صور مداركهم، وإدراك المجانين مشوب بالباطل لفساد أمزجتهم أو مزاحمة النفوس
    الشيطانية {cite:muqaddima-ibn-khaldun p. 100-102}.'
  en: Soothsaying, scrying, augury, casting, possession, deathbed speech and Sufi
    kashf — all the soul's veil lifted a moment {cite:muqaddima-ibn-khaldun p. 100-102}.
  es: "Adivinación, clarividencia, augurio, lanzamiento de hechizos, posesión, discurso en el lecho de muerte y kashf sufí: todo el velo del alma se levantó por un momento {cite:muqaddima-ibn-khaldun p. 100-102}."
  fr: "Divination, divination, augure, incantation, possession, discours sur le lit de mort et kashf soufi — tout le voile de l'âme se levait un instant {cite:muqaddima-ibn-khaldun p. 100-102}."
  tr: "İbn Haldun, insanların görünmeyenin algılarını sınıflandırdı: kehanet, aynalar ve su tıkanma gibi şeffaf bedenlere bakmak, hayvanların kalplerine, karaciğerlerine ve kemiklerine bakmak, kuşları ve hayvanları azarlamak, buğday ve çukur gibi çakıl taşları ve tahıllarla vurmak, görünmeyenin dilinde söylenenleri, ölümlerinin ya da uykularının başında uyuyanların ve ölülerin sözlerini ve Sufi alimlerinin algılarını onur meselesi olarak tanımlamıştır. Ruhun, ruhun güçle var olan ve dışa çeken duyular tarafından gizlenen ruhani bir doğaya sahip olduğunu, böylece görünenin içinden içe daldığında perdenin kalktığını açıkladı Beden ya uyku gibi insan özelliğiyle, ya da bazı insanlara özgü kehanet ve manevi uygulamalar gibi bir özellikle, ya da oyunla ortaya çıkanlar, yukarıdaki ruhani varlıklara yönelir; bu varlıklar var olan varlıkların görüntülerini içerir, onlardan bilgi alır ve belki de onları hayal gücüne iterek onları sıradan biçimlere yerleştirir. Aynalara bakanlar, algıların hapsolması nedeniyle perdeyi kaldırmaktan muzdarip olur; onlar ile ayna yüzeyi arasında, algılarının görüntülerinin oluştuğu bulutlar gibi görünür. Delilerin algısı, mizaçlarının yozlaşması veya şeytani ruhların rekabeti nedeniyle yalanla lekelenir {atıf:mukaddima-ibn-khaldun s. 100-102}."
  id: "Ibn Khaldun mengklasifikasikan persepsi tentang yang tak terlihat di antara manusia: ramalan, melihat benda transparan seperti cermin dan keran air, melihat ke dalam hati, hati, dan tulang hewan, menegur burung dan binatang, memukul dengan kerikil dan biji-bijian seperti gandum dan biji, apa yang diucapkan di lidah orang gila dari yang tak terlihat, kata-kata orang yang tidur dan mati di awal kematian atau tidur mereka, dan persepsi para ulama Sufi sebagai kehormatan. Ia menjelaskan bahwa jiwa memiliki sifat spiritual yang ada dengan paksa, tersembunyi oleh indera yang menariknya ke luar, sehingga ketika ia menyelam dari yang tampak ke dalam, tirai itu terangkat Tubuh bersifat sementara baik dengan sifat manusia seperti tidur, atau dengan karakteristik beberapa manusia seperti ramalan dan praktik spiritual, atau melalui olahraga seperti orang-orang pembukaan, beralih kepada makhluk spiritual di atas mereka, yang berisi gambar makhluk yang ada, menarik pengetahuan dari mereka, dan mungkin mendorong mereka ke imajinasi, yang mengatur mereka dalam bentuk biasa. Mereka yang melihat cermin menderita karena terangkat tabir karena keterbatasan persepsi yang terlihat hingga hilang, dan di antara mereka dan permukaan cermin, tampak seperti awan di mana gambaran persepsi mereka terbentuk. Persepsi orang gila tercemar oleh kebohongan akibat korupsi temperamen mereka atau persaingan jiwa setan {cite:muqaddima-ibn-khaldun hlm. 100-102}."
