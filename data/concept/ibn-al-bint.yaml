label: { ar: "ابن البنت", en: "Daughter's son", es: "El hijo de la hija", fr: "Le fils de la fille" }
summary:
  ar: "تعرّف الموسوعة الفقهية الكويتية ابن البنت نسباً بأنه الولد الذكر النسبي للبنت النسبية، ورضاعاً بأنه من حلّت فيه علاقة الرضاع محل علاقة النسب، وعند الإطلاق ينصرف إلى ابن البنت من النسب. واتفق الفقهاء على أنه لا يدخل في لفظ «أولادي» في الوقف، واختلفوا في دخوله في «أولاد أولادي» و«نسلي» و«عقبي» و«ذريتي». واتفقوا على أنه من المحارم يسري عليه أحكامهم، ومنها تحريم نكاح جدته وجواز مخالطتها ومرافقتها في السفر. واتفقوا على أنه من ذوي الأرحام، لهم أحكام في الميراث والحجب والولاية والحضانة والنفقة والرجوع في الهبة والجناية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1461} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1462}"
  en: "The Kuwaiti encyclopedia defines a daughter's son by blood as the male blood child of a blood daughter; by fostering, he is one in whom the foster tie takes the place of the blood tie; and without qualification the word means the blood relation. The jurists agree that he is not included in the word my children in a waqf; they differ on whether he is included in the words children of my children, my offspring, my descendants and my issue. They agree that he is a mahram, and the rules of mahrams apply to him, including the prohibition of marrying his grandmother and the permission to keep company with her and travel with her. They agree that he is among those with blood-ties through a female, with rules in inheritance, exclusion, guardianship, custody, maintenance, the revocation of a gift and liability for offences. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1461} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1462}"
  es: "La enciclopedia kuwaití define al hijo biológico de una hija como el varón consanguíneo de una hija biológica; por crianza, se refiere a aquel en quien el vínculo de crianza sustituye al vínculo de sangre; y, sin ninguna especificación, la palabra significa parentesco consanguíneo. Los juristas coinciden en que no se le incluye en la expresión \"mis hijos\" en un waqf; difieren en si se le incluye en las expresiones \"hijos de mis hijos\", \"mi descendencia\", \"mis descendientes\" y \"mi descendencia\". Coinciden en que es un mahram, y se le aplican las normas de los mahrams, incluyendo la prohibición de casarse con su abuela y el permiso para acompañarla y viajar con ella. Coinciden en que se le considera entre aquellos con vínculos de sangre a través de una mujer, con normas en materia de herencia, exclusión, tutela, custodia, manutención, revocación de una donación y responsabilidad por delitos. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1461} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1462}"
  fr: "L'encyclopédie koweïtienne définit le fils d'une fille par le sang comme l'enfant mâle né d'une fille par le sang; par adoption, il s'agit de celui pour qui le lien d'adoption remplace le lien de sang; et, sans autre précision, le terme désigne le lien de parenté par le sang. Les juristes s'accordent à dire qu'il n'est pas inclus dans la notion de « mes enfants » dans un waqf; ils divergent quant à son inclusion dans les expressions « enfants de mes enfants », « ma descendance », « mes descendants » et « ma progéniture ». Ils s'accordent à dire qu'il est un mahram et que les règles applicables aux mahrams lui sont applicables, notamment l'interdiction d'épouser sa grand-mère et l'autorisation de la fréquenter et de voyager avec elle. Ils s'accordent à dire qu'il fait partie de ceux qui ont des liens de sang par une mère, avec les règles relatives à l'héritage, l'exclusion, la tutelle, la garde, la pension alimentaire, la révocation d'une donation et la responsabilité pour les infractions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1461} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1462}"
