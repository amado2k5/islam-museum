id: concept/ibn-al-bint
class: concept
kind: legal
label: { ar: "ابن البنت", en: "Daughter's son" }
summary:
  ar: "تعرّف الموسوعة الفقهية الكويتية ابن البنت نسباً بأنه الولد الذكر النسبي للبنت النسبية، ورضاعاً بأنه من حلّت فيه علاقة الرضاع محل علاقة النسب، وعند الإطلاق ينصرف إلى ابن البنت من النسب. واتفق الفقهاء على أنه لا يدخل في لفظ «أولادي» في الوقف، واختلفوا في دخوله في «أولاد أولادي» و«نسلي» و«عقبي» و«ذريتي». واتفقوا على أنه من المحارم يسري عليه أحكامهم، ومنها تحريم نكاح جدته وجواز مخالطتها ومرافقتها في السفر. واتفقوا على أنه من ذوي الأرحام، لهم أحكام في الميراث والحجب والولاية والحضانة والنفقة والرجوع في الهبة والجناية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1461} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1462}"
  en: "The Kuwaiti encyclopedia defines a daughter's son by blood as the male blood child of a blood daughter; by fostering, he is one in whom the foster tie takes the place of the blood tie; and without qualification the word means the blood relation. The jurists agree that he is not included in the word my children in a waqf; they differ on whether he is included in the words children of my children, my offspring, my descendants and my issue. They agree that he is a mahram, and the rules of mahrams apply to him, including the prohibition of marrying his grandmother and the permission to keep company with her and travel with her. They agree that he is among those with blood-ties through a female, with rules in inheritance, exclusion, guardianship, custody, maintenance, the revocation of a gift and liability for offences. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1461} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1462}"
