summary:
  ar: "الكلس خشب هندي يكثر جلبه إلى البلاد، ولا يبعد أن يكون المغاث الهندي، وقد زعم قوم من المجربين أنه عظيم النفع في الكسر والوثي والخلع."
  en: "Kals is an Indian wood often brought into the lands of the book's author. The book says it may well be the Indian al-maghath. Some experienced practitioners claimed it is very useful for fractures, sprains and dislocations."
  ur: "کلس ایک ہندوستانی لکڑی ہے جو مصنف کے علاقوں میں اکثر لائی جاتی ہے۔ کتاب کہتی ہے کہ یہ ممکن ہے کہ ہندی مغاث ہو۔ بعض تجربہ کاروں کے مطابق یہ ہڈی ٹوٹنے، موچ اور جوڑ اترنے میں بہت مفید ہے۔"
  es: "Kals es una madera india que se suele llevar a las tierras del autor del libro. El libro afirma que podría tratarse del al-maghath indio. Algunos practicantes experimentados aseguran que es muy útil para fracturas, esguinces y dislocaciones."
  fr: "Le kals est un bois indien souvent importé dans les régions où l'auteur du livre évoque son utilisation. Ce dernier suggère qu'il pourrait s'agir de l'al-maghath indien. Certains praticiens expérimentés affirment qu'il est très efficace pour soigner les fractures, les entorses et les luxations."
