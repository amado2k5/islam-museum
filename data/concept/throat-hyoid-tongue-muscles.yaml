label: { ar: "عضل الحلقوم واللامي واللسان عند ابن سينا", en: "Muscles of the pharynx, hyoid and tongue in the Canon", ur: "قانون میں حلق، لامی ہڈی اور زبان کے پٹھے", es: "Músculos de la faringe, el hioides y la lengua en el Canon", fr: "Muscles du pharynx, de l'os hyoïde et de la langue dans le canon", tr: "İbn Sina'ya göre boğaz kası, lamiks ve dil", id: "Otot tenggorokan, lamyx, dan lidah menurut Ibn Sina" }
summary:
  ar: "يتناول ابن سينا بعد الحنجرة عضل الحلقوم والعظم اللامي واللسان، فيجعل للحلقوم زوجين يجذبانه إلى أسفل، وللامي ثلاثة أزواج تخصه، وللسان تسع عضل {cite:canon-ibn-sina-print-v1 pp.66-67}."
  en: "After the larynx Ibn Sina treats the muscles of the pharynx, the hyoid bone and the tongue: two pairs draw the pharynx down, three pairs belong to the hyoid, and nine muscles move the tongue {cite:canon-ibn-sina-print-v1 pp.66-67}."
  es: "Después de la laringe, Ibn Sina trata los músculos de la faringe, el hueso hioides y la lengua: dos pares tiran de la faringe hacia abajo, tres pares pertenecen al hioides y nueve músculos mueven la lengua {cite:canon-ibn-sina-print-v1 pp.66-67}."
  fr: "Après le larynx, Ibn Sina traite les muscles du pharynx, de l'os hyoïde et de la langue: deux paires tirent le pharynx vers le bas, trois paires appartiennent à l'os hyoïde et neuf muscles déplacent la langue {cite:canon-ibn-sina-print-v1 pp.66-67}."
  ur: "larynx کے بعد ابن سینا نے گردن کے پٹھوں، hyoid ہڈی اور زبان کا علاج کیا: دو جوڑے گردن کو نیچے کھینچتے ہیں، تین جوڑے hyoid سے تعلق رکھتے ہیں، اور نو عضلات زبان کو حرکت دیتے ہیں۔"
  tr: "Gırtlaktan sonra İbn Sina, faringeal kas, hyoid kemik ve dili ele alır; farenks için iki çift oluşturur ve bu çiftler aşağıya doğru çeker, gırtlakta üç çift bulunur ve dil dokuz kası vardır {cite:canon-ibn-sina-print-v1 s.66-67}."
  id: "Setelah laring, Ibn Sina menangani otot faring, tulang hyoid, dan lidah, membentuk dua pasang untuk faring yang menariknya ke bawah, laring memiliki tiga pasang sendiri, dan lidah memiliki sembilan otot {cite:canon-ibn-sina-print-v1 hlm.66-67}."
