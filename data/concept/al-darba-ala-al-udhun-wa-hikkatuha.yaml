id: "concept/al-darba-ala-al-udhun-wa-hikkatuha"
class: "concept"
kind: "scientific"
label:
  ar: "الضربة على الأذن وحكتها"
  en: "A blow on the ear, and its itch"
  ur: "کان پر ضرب اور اس کی خارش"
summary:
  ar: "في المرض يعرض للأذن والضربة: أما بقراط فيرى أن لا تعالج بشيء، وأما من بعده فمما يعالجون به ما يتخذ منه لطوخ؛ وفي حكة الأذن يؤخذ ما يعرف ويصب أو يقطر ⁦⁦(قول بقراط منقول كرأي منسوب إليه، وأسماء الأدوية لا تحمل)⁩⁩ {cite:canon-ibn-sina-print-v2 p.230}"
  en: "On the ailment befalling the ear and the blow: Hippocrates holds it should be treated with nothing; those after him treat it with things made into smears. On the ear's itch, the known is taken and poured or dropped ⁦(Hippocrates' view is transmitted as an opinion attributed to him; drug names are not carried)⁩ {cite:canon-ibn-sina-print-v2 p.230}"
  ur: "کان کو پہنچنے والے مرض اور ضرب کے بارے میں: بقراط کی رائے ہے کہ اسے کسی چیز سے علاج نہ کیا جائے؛ اور بعد والے لوگ اسے ایسی چیزوں سے علاج کرتے ہیں جن سے لپوٹ بنایا جائے؛ اور کان کی خارش میں معروف چیز لی جائے اور ڈالی یا ٹپکائی جائے ⁦⁦(بقراط کی رائے اس کی طرف منسوب کے طور پر منقول؛ ادویہ کے نام منقول نہیں)⁩⁩ {cite:canon-ibn-sina-print-v2 p.230}"
