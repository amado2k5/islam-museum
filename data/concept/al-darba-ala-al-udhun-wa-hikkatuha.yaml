id: "concept/al-darba-ala-al-udhun-wa-hikkatuha"
class: "concept"
kind: "scientific"
label:
  ar: "الضربة على الأذن وحكتها"
  en: "A blow on the ear, and its itch"
  fr: "Coup sur l’oreille et démangeaison"
  ur: "کان پر ضرب اور اس کی خارش"
  es: "Un golpe en la oreja y su picazón."
  tr: "Kulağa darbe ve tırmalama."
  id: "Tamparan telinga dan garukan."
summary:
  ar: "في المرض يعرض للأذن والضربة: أما بقراط فيرى أن لا تعالج بشيء، وأما من بعده فمما يعالجون به ما يتخذ منه لطوخ؛ وفي حكة الأذن يؤخذ ما يعرف ويصب أو يقطر ⁦⁦(قول بقراط منقول كرأي منسوب إليه، وأسماء الأدوية لا تحمل)⁩⁩ {cite:canon-ibn-sina-print-v2 p.230}"
  en: "On the ailment befalling the ear and the blow: Hippocrates holds it should be treated with nothing; those after him treat it with things made into smears. On the ear's itch, the known is taken and poured or dropped ⁦(Hippocrates' view is transmitted as an opinion attributed to him; drug names are not carried)⁩ {cite:canon-ibn-sina-print-v2 p.230}"
  fr: "Au sujet de l’affection touchant l’oreille et du coup : Hippocrate estime qu’il ne faut rien y appliquer ; ceux qui lui succèdent la traitent avec des substances préparées en enduits. Pour la démangeaison de l’oreille, on prend la substance connue et on la verse ou on l’instille (l’avis d’Hippocrate est transmis comme une opinion qui lui est attribuée ; les noms des médicaments ne sont pas reproduits) {cite:canon-ibn-sina-print-v2 p.230}"
  ur: "کان کو پہنچنے والے مرض اور ضرب کے بارے میں: بقراط کی رائے ہے کہ اسے کسی چیز سے علاج نہ کیا جائے؛ اور بعد والے لوگ اسے ایسی چیزوں سے علاج کرتے ہیں جن سے لپوٹ بنایا جائے؛ اور کان کی خارش میں معروف چیز لی جائے اور ڈالی یا ٹپکائی جائے ⁦⁦(بقراط کی رائے اس کی طرف منسوب کے طور پر منقول؛ ادویہ کے نام منقول نہیں)⁩⁩ {cite:canon-ibn-sina-print-v2 p.230}"
  es: "Sobre la afección del oído y el golpe: Hipócrates sostiene que no debe tratarse con nada; quienes le siguieron lo trataron con ungüentos. Para la picazón de oído, se toma y se vierte o se deja caer el medicamento conocido (la opinión de Hipócrates se transmite como una opinión que se le atribuye; no se mencionan nombres de medicamentos). {cite:canon-ibn-sina-print-v2 p.230}"
  tr: "Hastalıkta kulak ve üflemeye maruz kalır: Hipokrat ise bunun hiçbir şeyle tedavi edilmemesi gerektiğine inanır ve ondan sonra tedavi edilen şey bir leke olan şeydir; kaşıntılı bir kulakta bilinen şey alınır ve dökülür ya da damlatılır (Hipokrat'ın ona atfedilen bir görüş olarak aktardığı bir söz ve ilaç isimlerinde bu ifade yoktur) {atıf:kanon-ibn-sina-print-v2 s.230}"
  id: "Saat sakit, telinga terpapar tiupan: Hippocrates percaya bahwa ini tidak boleh diobati dengan apa pun, dan yang kemudian diobati adalah bintik; pada telinga yang gatal, apa yang diketahui diambil dan dilepaskan atau dititiskan (ungkapan ini tidak ditemukan dalam kata-kata dan nama obat yang diberikan kepadanya oleh Hippocrates) {sitasi:kanon-ibn-sina-print-v2 hlm.230}"
