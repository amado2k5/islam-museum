summary:
  ar: "الموز معروف، له ورق عريض طويل شبيه بورق المارزوان، وينبت في البلدان الحارة لا غير، يغذو يسيراً وهو مليّن، والإكثار منه يولد السدد ويثقل المعدة {cite:canon-ibn-sina-print-v1 p.573}."
  en: "Mawz, the banana, is called well known, with broad long leaves like those of the marzuwan, growing only in hot lands; it nourishes a little and loosens, and too much of it breeds obstructions and weighs on the stomach {cite:canon-ibn-sina-print-v1 p.573}."
  ur: "موز معروف ہے، اس کے پتے چوڑے لمبے اور مرزوان کے پتوں جیسے ہیں اور یہ صرف گرم ملکوں میں اگتا ہے؛ تھوڑی غذا دیتا اور نرم کرتا ہے، اور اس کی زیادتی سدے پیدا کرتی اور معدے پر بوجھ ڈالتی ہے {cite:canon-ibn-sina-print-v1 p.573}۔"
  es: "El mawz, el plátano, es llamado bien conocido, con hojas anchas y largas como las del marzuwan, crece solo en tierras cálidas; nutre un poco y afloja, y demasiado de él produce obstrucciones y pesa en el estómago {cite:canon-ibn-sina-print-v1 p.573}."
