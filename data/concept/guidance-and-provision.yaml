id: concept/guidance-and-provision
class: concept
kind: belief
label: { ar: "الهداية والرزق: هداية الدلالة وهداية المعونة", en: "Guidance and provision: guidance by showing and guidance by help", ur: "ہدایت اور رزق: دلالت کی ہدایت اور معونت کی ہدایت" }
summary:
  ar: "يفرق الشعراوي بين هداية الدلالة، وهي البيان الذي يقوم به الرسول وكل داع، وهداية المعونة والتوفيق، وهي التي يختص بها الله من آمن به، ويرى أن العطاء للمحتاج من الرزق لا يتوقف على هدايته، لأن الرزق عطاء الربوبية {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1174} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1175} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1176}."
  en: "Sha'rawi distinguishes guidance by showing, the clarity that a prophet or any caller provides, from guidance by help and success, which God gives to whoever believes in Him. He holds that providing for the needy does not depend on their guidance, since provision is the gift of Lordship {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1174} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1175} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1176}."
  ur: "شعراوی دلالت کی ہدایت، یعنی وہ وضاحت جو نبی یا ہر داعی کرتا ہے، اور معونت و توفیق کی ہدایت، جو اللہ اس کو عطا کرتا ہے جو اس پر ایمان لائے، میں فرق کرتے ہیں۔ ان کے نزدیک محتاج کی مدد اس کی ہدایت پر موقوف نہیں، کیونکہ رزق ربوبیت کی عطا ہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1174} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1175} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1176}۔"
