education:
  did_you_know:
    ar: "الخراج في فتوح البلدان ضريبة الأرض والمحصول على المصالَحين وأهل الذمة، وهو الاسم العام الذي تندرج تحته الجزية والعشر؛ وفي كتاب النبي لنجران سُمّيت الحُلل «حُلل الخراج»."
    en: "In Futuh al-Buldan kharaj is the land-and-crop tax on treaty peoples and dhimmis — the general name under which the jizya and the tithe fall; in the Prophet's letter to Najran the levied garments were called 'garments of kharaj'."
    ur: "فتوح البلدان میں خراج صلح کیے گئے لوگوں اور اہلِ ذمہ پر زمین و فصل کا محصول ہے — جس کے تحت جزیرہ اور عشر آتے ہیں؛ نبی کے نجران کو خط میں مقررہ کپڑے «خراج کے کپڑے» کہلائے۔"
    sources: [source/futuh-buldan-maarif-1407, source/usul-iqtisad-islami-0660]
