label:
  ar: الخراج
  en: Kharaj (land tax)
summary:
  ar: "الخراج في استعمال فتوح البلدان ضريبة الأرض والمحصول المضروبة على المصالَحين وأهل الذمة، وهو الاسم العام الذي تندرج تحته الجزية على الرؤوس والعشر على الأرض: ففي كتاب النبي لنجران سُمّيت الحُلَل المفروضة «حُلَل الخراج» تجبى في كل صفر ورجب ألفَي حلة قيمة الواحدة أوقية، وقيل لأهل نجران لما عرضوا على عمر بن عبد العزيز نقصهم «أرى هذا الصلح جزية على رؤوسهم وليس بصلح على أراضيهم»؛ ومن أحكامه عنده ما روي عن عمر أنه كتب لأهل الطائف في الكروم «ليس عليها عشر»، وما ذهب إليه سفيان الثوري وأبو يوسف ومالك وغيرهم في وجوب الصدقة في الغلات والفواكه ونصاب خمسة أوسق — وخراج الكتاب هو الموضوع الذي يليه البلاذري في أبوابه الختامية بعد استيفاء أخبار الفتوح. وقدّم ابن خرداذبه صاحب البريد أجلّ سجل خراجي باقٍ: خراج السواد وكوره بالطساسيج وسائر الأقاليم في عصره، ومقابلة بجباية كسرى أبرويز التي بلغت سنة ثمان عشرة من ملكه أربع مائة وعشرين ألف ألف مثقال ثم ستمائة ألف ألف مثقال بعد ذلك، وذكر أن أهل السواد مُنعوا ذبح البقر لتكثر الحراثة {cite:masalik-mamalik-ibn-khurdadhbih pp. 13-18}."
  en: "Kharaj in the usage of Futuh al-Buldan is the tax laid on land and produce owed by treaty peoples and dhimmis, the general name under which fall the capitation jizya and the tithe 'ushr on land: in the Prophet's letter to Najran the stipulated hullas are called 'the kharaj hullas', levied at two thousand a year in Safar and Rajab at an uqiyya apiece, and when the people of Najran presented their diminished numbers to Umar ibn Abd al-Aziz he judged 'I see this treaty is a jizya on their heads, not a treaty on their lands'; among its rulings transmitted by him are Umar's letter to the people of al-Ta'if on their vines 'there is no tithe on them', and the positions of Sufyan al-Thawri, Abu Yusuf, Malik and others on what crops and fruits incur the levy and the five-awsuq threshold — kharaj being the subject al-Baladhuri pursues in the book's closing chapters after exhausting the conquest reports."
