id: concept/canon-leeches-poisonous-kinds-and-choosing-them
class: concept
kind: scientific
label:
  ar: "العلق وأنواعها السمية واختيارها عند ابن سينا"
  en: "Leeches, the poisonous kinds and how to choose them in the Canon"
  fr: "Sangsues : types venimeux et choix dans le Canon"
  ur: "قانون میں جونکیں، زہریلی اقسام اور ان کا انتخاب"
  es: "Las sanguijuelas, las especies venenosas y cómo elegirlas en el canon."
  tr: "Sülükler ve onların zehirli türleri ile İbn Sina'ya göre seçimleri"
  id: "Lintah dan jenis toksiknya serta seleksi mereka menurut Ibn Sina"
summary:
  ar: "يبدأ ابن سينا الفصل الثاني والعشرين في العلق بنقل ما قالته الهند عن أنواعها السمية وما تورثه، ثم يبين من أين تصاد وكيف تختار {cite:canon-ibn-sina-print-v1 p.302}."
  en: "Ibn Sina begins chapter 22 on leeches by reporting what the Indians said of their poisonous kinds and what they cause, then shows where leeches should be caught and how to choose them {cite:canon-ibn-sina-print-v1 p.302}."
  fr: "Au chapitre 22, Ibn Sina rapporte les types venimeux selon les Indiens et leurs effets, puis lieux de capture et critères de choix {cite:canon-ibn-sina-print-v1 p.302}."
  es: "Ibn Sina comienza el capítulo 22 sobre las sanguijuelas informando lo que los indios decían sobre sus especies venenosas y lo que causan, luego muestra dónde se deben atrapar las sanguijuelas y cómo elegirlas {cite:canon-ibn-sina-print-v1 p.302}."
  ur: "ابن سینا جونکوں پر باب 22 کا آغاز یہ بتاتے ہوئے کرتا ہے کہ ہندوستانیوں نے ان کی زہریلی اقسام کے بارے میں کیا کہا اور ان کی وجہ کیا ہے، پھر یہ بتاتا ہے کہ جونک کو کہاں پکڑا جائے اور ان کا انتخاب کیسے کیا جائے۔"
  tr: "İbn Sina, Al-'Alaq'ın yirmi ikinci bölümüne Hindistan'ın zehirli türleri ve mirasları hakkında söylediklerini alıntılayarak başlar, ardından nerede yakalandıklarını ve nasıl seçileceğini açıklar {cite:canon-ibn-sina-print-v1 s.302}."
  id: "Ibn Sina memulai bab dua puluh dua di Al-'Alaq dengan mengutip apa yang dikatakan India tentang spesies beracun mereka dan apa yang mereka warisi, lalu menjelaskan di mana mereka ditangkap dan bagaimana memilih {cite:canon-ibn-sina-print-v1 hlm.302}."
