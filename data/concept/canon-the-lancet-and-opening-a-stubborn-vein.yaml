label: { ar: "المبضع وفتح العرق العسر عند ابن سينا", en: "The lancet and opening a stubborn vein in the Canon", ur: "قانون میں نشتر اور ضدی رگ کا کھولنا", es: "La lanceta y la apertura de una vena obstinada en el Canon", fr: "La lancette et l'ouverture d'une veine récalcitrante dans le Canon", tr: "İbn Sina'ya göre neşter ve sert damarın açılması", id: "Pisau bedah dan pembukaan pembuluh darah keras menurut Ibn Sina" }
summary:
  ar: "يوصي ابن سينا في ختام فصل الفصد بكيفية استعمال المبضع وأخذه، واختبار علوقه بالجلد، ومعالجة العرق الذي لا يظهر امتلاؤه، وتقييده وشده بحسب الجلد والبدن، وما يدل على الحاجة إلى الفصد {cite:canon-ibn-sina-print-v1 p.299}."
  en: "At the close of the chapter on venesection Ibn Sina gives how the lancet is used and held, how its bite on the skin is tried, how a vein that does not fill is managed, how it is fixed and bound according to the skin and the body, and what shows the need for bleeding {cite:canon-ibn-sina-print-v1 p.299}."
  es: "Al final del capítulo sobre la venesección, Ibn Sina explica cómo se usa y se sostiene la lanceta, cómo se prueba su punción en la piel, cómo se maneja una vena que no se llena, cómo se fija y se liga según la piel y el cuerpo, y qué indica la necesidad de sangrar {cite:canon-ibn-sina-print-v1 p.299}."
  fr: "À la fin du chapitre sur la saignée, Ibn Sina explique comment utiliser et tenir la lancette, comment tester sa morsure sur la peau, comment gérer une veine qui ne se remplit pas, comment la fixer et la ligaturer en fonction de la peau et du corps, et ce qui montre la nécessité de la saignée {cite:canon-ibn-sina-print-v1 p.299}."
  ur: "ابن سینا کے باب کے اختتام پر ابن سینا بتاتا ہے کہ لینسیٹ کو کس طرح استعمال اور پکڑا جاتا ہے، جلد پر اس کے کاٹنے کی کوشش کیسے کی جاتی ہے، جو رگ نہ بھرتی ہے اس کا انتظام کیسے کیا جاتا ہے، اسے جلد اور جسم کے مطابق کیسے ٹھیک اور پابند کیا جاتا ہے، اور خون بہنے کی ضرورت کو کیا ظاہر کرتا ہے۔"
  tr: "Flebotik bölümün sonunda, İbn Sina neşterin nasıl kullanılacağını ve nasıl tutulacağını, cilde yapışmasını test etmeyi, dolgun görünmeyen teri tedavi etmeyi ve cilt ile vücuda göre kısıtlayıp sıkılaştırmayı ve flebit ihtiyacı belirtilerini önerir {cite:canon-ibn-sina-print-v1 s.299}."
  id: "Di akhir bab flebotik, Ibn Sina merekomendasikan cara menggunakan dan memegang pisau bedah, menguji daya rekatnya pada kulit, mengobati keringat yang tidak tampak penuh, serta membatasi dan mengencangkannya sesuai kulit dan tubuh, serta tanda-tanda kebutuhan flebitis {cite:canon-ibn-sina-print-v1 hlm.299}."
