label: { ar: "المبضع وفتح العرق العسر عند ابن سينا", en: "The lancet and opening a stubborn vein in the Canon", ur: "قانون میں نشتر اور ضدی رگ کا کھولنا", es: "La lanceta y la apertura de una vena obstinada en el Canon", fr: "La lancette et l'ouverture d'une veine récalcitrante dans le Canon" }
summary:
  ar: "يوصي ابن سينا في ختام فصل الفصد بكيفية استعمال المبضع وأخذه، واختبار علوقه بالجلد، ومعالجة العرق الذي لا يظهر امتلاؤه، وتقييده وشده بحسب الجلد والبدن، وما يدل على الحاجة إلى الفصد {cite:canon-ibn-sina-print-v1 p.299}."
  en: "At the close of the chapter on venesection Ibn Sina gives how the lancet is used and held, how its bite on the skin is tried, how a vein that does not fill is managed, how it is fixed and bound according to the skin and the body, and what shows the need for bleeding {cite:canon-ibn-sina-print-v1 p.299}."
  es: "Al final del capítulo sobre la venesección, Ibn Sina explica cómo se usa y se sostiene la lanceta, cómo se prueba su punción en la piel, cómo se maneja una vena que no se llena, cómo se fija y se liga según la piel y el cuerpo, y qué indica la necesidad de sangrar {cite:canon-ibn-sina-print-v1 p.299}."
  fr: "À la fin du chapitre sur la saignée, Ibn Sina explique comment utiliser et tenir la lancette, comment tester sa morsure sur la peau, comment gérer une veine qui ne se remplit pas, comment la fixer et la ligaturer en fonction de la peau et du corps, et ce qui montre la nécessité de la saignée {cite:canon-ibn-sina-print-v1 p.299}."
