label: { ar: "المَنْفَعَة", en: "Benefit or usufruct (manfa'a) as property and as a legal thing", ur: "منفعت (فائدہ، استعمال کا حق)" }
summary:
  ar: "المنفعة في الاصطلاح الفائدة التي تحصل باستعمال العين. واختلف الفقهاء في ماليتها، فذهب المالكية والشافعية والحنابلة إلى أنها أموال متقومة، والحنفية إلى أنها لا تتقوم إلا بالعقد. ويترتب على ذلك ضمانها بالإتلاف والغصب، وجعلها صداقا، والشفعة عند معاوضة المشفوع بها، ووراثتها، ورهنها، وقسمتها، وإسقاطها، والوصية بها، ووقفها، وانتهاء ملكها. وللفقهاء أصل في الإذن بالمنافع، ويسمى الأصل في المنافع الإذن وفي المضار المنع."
  en: "Manfa'a in law is the benefit obtained by using a thing. The jurists differ on whether it is property: the Malikis, Shafi'is and Hanbalis hold it is valued property, while the Hanafis hold it becomes valued only through a contract. The difference bears on whether benefits are compensated when destroyed or seized, on making a benefit the dower, on pre-emption, on inheritance, pledge, partition, release, bequest and endowment of benefits, and on when a usufruct ends. The jurists also hold that the basic rule for benefits is permission, and for harms prohibition."
  ur: "منفعت وہ فائدہ ہے جو کسی چیز کے استعمال سے حاصل ہو۔ مالکیہ، شافعیہ اور حنابلہ اسے متقوم مال مانتے ہیں، جبکہ حنفیہ کے نزدیک یہ صرف عقد کے ذریعے متقوم ہوتی ہے۔ اس اختلاف کا اثر ضمان، مہر، شفعہ، وراثت، رہن، تقسیم، وصیت اور وقف کے احکام پر پڑتا ہے۔"
