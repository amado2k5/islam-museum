label: { ar: "المَنْفَعَة", en: "Benefit or usufruct (manfa'a) as property and as a legal thing", ur: "منفعت ⁦(فائدہ، استعمال کا حق)⁩", es: "Beneficio o usufructo (manfa'a) como propiedad y como cosa jurídica", fr: "Le bénéfice ou l'usufruit (manfa'a) en tant que propriété et en tant que chose légale", tr: "Fayda", id: "Utilitas" }
summary:
  ar: "المنفعة في الاصطلاح الفائدة التي تحصل باستعمال العين. واختلف الفقهاء في ماليتها، فذهب المالكية والشافعية والحنابلة إلى أنها أموال متقومة، والحنفية إلى أنها لا تتقوم إلا بالعقد. ويترتب على ذلك ضمانها بالإتلاف والغصب، وجعلها صداقا، والشفعة عند معاوضة المشفوع بها، ووراثتها، ورهنها، وقسمتها، وإسقاطها، والوصية بها، ووقفها، وانتهاء ملكها. وللفقهاء أصل في الإذن بالمنافع، ويسمى الأصل في المنافع الإذن وفي المضار المنع."
  en: "Manfa'a in law is the benefit obtained by using a thing. The jurists differ on whether it is property: the Malikis, Shafi'is and Hanbalis hold it is valued property, while the Hanafis hold it becomes valued only through a contract. The difference bears on whether benefits are compensated when destroyed or seized, on making a benefit the dower, on pre-emption, on inheritance, pledge, partition, release, bequest and endowment of benefits, and on when a usufruct ends. The jurists also hold that the basic rule for benefits is permission, and for harms prohibition."
  ur: "منفعت وہ فائدہ ہے جو کسی چیز کے استعمال سے حاصل ہو۔ مالکیہ، شافعیہ اور حنابلہ اسے متقوم مال مانتے ہیں، جبکہ حنفیہ کے نزدیک یہ صرف عقد کے ذریعے متقوم ہوتی ہے۔ اس اختلاف کا اثر ضمان، مہر، شفعہ، وراثت، رہن، تقسیم، وصیت اور وقف کے احکام پر پڑتا ہے۔"
  es: "En derecho, manfa'a es el beneficio obtenido al usar algo. Los juristas difieren en cuanto a si se trata de propiedad: los malikíes, shafiíes y hanbalíes consideran que es propiedad valorada, mientras que los hanafíes sostienen que solo adquiere valor mediante un contrato. Esta diferencia radica en si los beneficios se compensan al ser destruidos o confiscados, en si un beneficio constituye la dote, en el derecho de tanteo, en la herencia, la prenda, la partición, la liberación, el legado y la donación de beneficios, y en cuándo finaliza un usufructo. Los juristas también sostienen que la regla básica para los beneficios es la permisibilidad, y para los daños, la prohibición."
  fr: "En droit, la manfa'a désigne le bénéfice obtenu par l'usage d'une chose. Les juristes divergent quant à sa nature patrimoniale: les malikites, les chaféites et les hanbalites la considèrent comme un bien ayant une valeur intrinsèque, tandis que les hanafites estiment qu'elle n'acquiert de valeur que par contrat. Cette divergence porte sur la question de l'indemnisation des bénéfices en cas de destruction ou de saisie, sur leur constitution en dot, sur le droit de préemption, sur l'héritage, le nantissement, le partage, la libération, le legs et la dotation des bénéfices, ainsi que sur la date d'extinction de l'usufruit. Les juristes s'accordent également sur le fait que la règle fondamentale applicable aux bénéfices est la permission, et celle applicable aux préjudices, l'interdiction."
  tr: "Terminolojide, fayda, mülkün kullanımıyla elde edilen faydadır. Hukukçular mülkiyeti konusunda farklı görüşlere sahiptir; Malikiler, Şafi'ler ve Hanbaliler bunun yerleşik mülk olduğunu savunurken, Hanafiler sadece sözleşme yoluyla geçerli olduğunu savunur. Bu, yok etme ve gaspa karşı sorumluluk getirir; çeyiz yapmak, işin karışan kişinin takasında, miras alırken önlem almak, ipotek koymak, bölmek, feragat etmek, miras bırakmak, devretmek ve mülkiyetin sona erdirilmesidir. Hukukçuların fayda izni için bir dayanağı vardır ve faydalarda ilke izin verirken, zararlarda buna yasak denir."
  id: "Dalam istilah tertentu, manfaat adalah manfaat yang diperoleh dengan menggunakan properti. Para ahli hukum berbeda pendapat mengenai kepemilikannya; Maliki, Shafi'i, dan Hanbal berpendapat bahwa properti tersebut adalah properti yang sudah ditetapkan, sedangkan Hanafi hanya memilikinya yang sah berdasarkan kontrak. Ini menimbulkan tanggung jawab terhadap penghancuran dan pengambilalihan kekuasaan, menjadikannya mas kawin, preemption saat menukar orang yang terlibat, mewarisinya, menggadaikan, membagi, melepaskan hak, mewariskan, menurunkan, dan mengakhiri kepemilikannya. Ahli hukum memiliki dasar untuk izin atas manfaat, dan prinsip dalam manfaat adalah izin, sedangkan dalam kerugian disebut larangan."
