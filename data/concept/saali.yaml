label:
  ar: "سعالي"
  en: "Sa'ali (the plant the book names sa'ali)"
  ur: "سعالی"
  es: "Sa'ali (la planta que el libro llama sa'ali)"
  fr: "Sa'ali (la plante que le livre nomme sa'ali)"
summary:
  ar: "السعالي في الكتاب من جوهر حار وجوهر مائي، حار حريف باعتدال، ورقه يفجر الدبيلات ويحللها في ابتدائها، والطري منه ينضج الأورام العاصية ويقلع الجرب المتقرح، ويقع في الأدوية المحدة للبصر، وقيل إنه أفضل دواء للسعال ونفس الانتصاب {cite:canon-ibn-sina-print-v1 p.596}."
  en: "Sa'ali is in the book of a hot substance and a watery substance, moderately hot and pungent; its leaf bursts abscesses and dissolves them at their start, the fresh kind ripens stubborn swellings and removes ulcerating scab, it enters drugs that sharpen sight, and it is said to be the best remedy for cough and orthopnoea {cite:canon-ibn-sina-print-v1 p.596}."
  ur: "سعالی کتاب میں گرم جوہر اور آبی جوہر سے ہے، اعتدال سے گرم اور تیز؛ اس کا پتا پھوڑوں کو پھاڑتا اور ابتدا میں انہیں گھلاتا ہے، تازہ قسم ضدی ورموں کو پکاتی اور پھوٹنے والی خارش اکھاڑتی ہے، بینائی تیز کرنے والی دواؤں میں شامل ہوتا ہے، اور کہا گیا کہ کھانسی اور نفس الانتصاب کی بہترین دوا ہے {cite:canon-ibn-sina-print-v1 p.596}۔"
  es: "Sa'ali es en el libro de una sustancia caliente y una sustancia acuosa, moderadamente caliente y picante; su hoja revienta los abscesos y los disuelve en su inicio, la variedad fresca madura las hinchazones persistentes y elimina la costra ulcerada, entra en medicamentos que agudizan la vista, y se dice que es el mejor remedio para la tos y la ortopnea {cite:canon-ibn-sina-print-v1 p.596}."
  fr: "Sa'ali est mentionné dans le livre comme une substance chaude et une substance aqueuse, modérément chaude et piquante; sa feuille fait éclater les abcès et les dissout à leur début, la variété fraîche fait mûrir les gonflements tenaces et enlève les croûtes ulcérées, elle entre dans la composition de médicaments qui aiguisent la vue, et on dit qu'elle est le meilleur remède contre la toux et l'orthopnée {cite:canon-ibn-sina-print-v1 p.596}."
