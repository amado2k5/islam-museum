label: { ar: "الإكسال", en: "Iksal (coitus without ejaculation)", es: "Iksal (coito sin eyaculación)", fr: "Iksal (coït sans éjaculation)", ur: "اکسل ⁦(بغیر انزال کے صحبت)⁩" }
summary:
  ar: "الإكسال أن يجامع الرجل ثم يفتر ذكره بعد الإيلاج فلا ينزل، وهو لا يغير الأحكام المتعلقة بالجماع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3251} وعلى قول الجمهور يحصل الإحصان والتحليل وفيئة المولي وإزالة العنة بالإيلاج دون إنزال، لأن العسيلة هي الجماع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3252} وخالف الحسن البصري فاشترط الإنزال، وخالف سعيد بن المسيب فاكتفى بالعقد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3252}"
  en: "Iksal is intercourse in which the man's member goes slack after penetration, so he does not ejaculate. It does not change the rulings on intercourse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3251} By the majority view, penetration without ejaculation is enough for the condition of marriage (ihsan), for the return of a husband who swore off intercourse, for curing impotence, and for making a triply divorced woman lawful to her former husband, because the tasting in the hadith is intercourse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3252} Al-Hasan al-Basri required ejaculation, and Sa'id ibn al-Musayyab held that the contract alone sufficed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3252}"
  es: "Iksal es la relación sexual en la que el miembro del hombre se relaja después de la penetración, por lo que no eyacula. Esto no altera las normas sobre la relación sexual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3251} Según la opinión mayoritaria, la penetración sin eyaculación es suficiente para la condición de matrimonio (ihsan), para el regreso de un esposo que juró abstenerse de tener relaciones sexuales, para curar la impotencia y para que una mujer triplemente divorciada sea lícita con su exmarido, porque la degustación en el hadiz es la relación sexual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3252} Al-Hasan al-Basri exigió la eyaculación, y Sa'id ibn al-Musayyab sostuvo que el contrato por sí solo era suficiente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3252}"
  fr: "L'iksal est un rapport sexuel où le pénis de l'homme se relâche après la pénétration, de sorte qu'il n'y a pas éjaculation. Cela ne modifie pas les règles relatives au rapport sexuel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3251} Selon l'avis majoritaire, la pénétration sans éjaculation suffit pour la condition de mariage (ihsan), pour le retour d'un mari qui avait renoncé aux rapports sexuels, pour guérir l'impuissance et pour rendre licite à son ex-mari une femme triplement divorcée, car le goût mentionné dans le hadith est bien le rapport sexuel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3252} Al-Hasan al-Basri exigeait l'éjaculation, tandis que Sa'id ibn al-Musayyab considérait que le contrat seul suffisait. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3252}"
  ur: "اکسل وہ جماع ہے جس میں دخول کے بعد آدمی کا رکن سست ہو جاتا ہے، اس لیے انزال نہیں ہوتا۔ اس سے جماع کے احکام نہیں بدلتے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور ص 3251} جمہور کے نزدیک بغیر انزال کے دخول نکاح کی شرط ⁦(احسان)⁩ کے لیے کافی ہے، جماع کرنے والے شوہر کے رجوع کے لیے، نامردی کے علاج کے لیے، اور تین طلاق دینے والی عورت کے لیے، اس لیے کہ سابقہ شوہر کے لیے اس کے شوہر کے لیے حلال ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 3252} الحسن البصری کو انزال کی ضرورت تھی، اور سعید بن المسیب کا خیال تھا کہ صرف معاہدہ ہی کافی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 3252}"
