label: { ar: "الإكسال", en: "Iksal (coitus without ejaculation)" }
summary:
  ar: "الإكسال أن يجامع الرجل ثم يفتر ذكره بعد الإيلاج فلا ينزل، وهو لا يغير الأحكام المتعلقة بالجماع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3251} وعلى قول الجمهور يحصل الإحصان والتحليل وفيئة المولي وإزالة العنة بالإيلاج دون إنزال، لأن العسيلة هي الجماع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3252} وخالف الحسن البصري فاشترط الإنزال، وخالف سعيد بن المسيب فاكتفى بالعقد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3252}"
  en: "Iksal is intercourse in which the man's member goes slack after penetration, so he does not ejaculate. It does not change the rulings on intercourse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3251} By the majority view, penetration without ejaculation is enough for the condition of marriage (ihsan), for the return of a husband who swore off intercourse, for curing impotence, and for making a triply divorced woman lawful to her former husband, because the tasting in the hadith is intercourse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3252} Al-Hasan al-Basri required ejaculation, and Sa'id ibn al-Musayyab held that the contract alone sufficed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3252}"
