label: { ar: "إجماع", en: "Consensus (ijma')" }
summary:
  ar: "الإجماع في اللغة العزم، وقد يراد به الاتفاق، وعند الأصوليين اتفاق جميع المجتهدين من أمة محمد بعد عصره على أمر شرعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1697} وهو حجة قطعية على الصحيح إذا اتفق المعتبرون على أنه إجماع، ولا يحتج به في ما يتوقف عليه حجيته كوجود الله ورسالة النبي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1698}"
  en: "In the lexicon ijma' means resolve, and sometimes agreement. For the usulis it is the agreement of all the mujtahids of the community after the Prophet's time on a matter of law. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1697} It is a definitive proof when the recognised scholars agree that it is a consensus; it is not used to prove what its own validity depends on, such as God's existence or the Prophet's mission. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1698}"
