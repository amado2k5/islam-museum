id: concept/ijma
class: concept
kind: legal
tags: [madhahib-browser, mh-mafahim]
label: { ar: "إجماع", en: "Consensus (ijma')", es: "Consenso (ijma')", fr: "Consensus (ijma')" }
summary:
  ar: "الإجماع في اللغة العزم، وقد يراد به الاتفاق، وعند الأصوليين اتفاق جميع المجتهدين من أمة محمد بعد عصره على أمر شرعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1697} وهو حجة قطعية على الصحيح إذا اتفق المعتبرون على أنه إجماع، ولا يحتج به في ما يتوقف عليه حجيته كوجود الله ورسالة النبي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1698}"
  en: "In the lexicon ijma' means resolve, and sometimes agreement. For the usulis it is the agreement of all the mujtahids of the community after the Prophet's time on a matter of law. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1697} It is a definitive proof when the recognised scholars agree that it is a consensus; it is not used to prove what its own validity depends on, such as God's existence or the Prophet's mission. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1698}"
  es: "En el léxico, ijma' significa resolución y, a veces, acuerdo. Para los usulis, se trata del acuerdo de todos los mujtahids de la comunidad después de la época del Profeta sobre una cuestión de derecho. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1697} Es una prueba definitiva cuando los eruditos reconocidos coinciden en que existe un consenso; no se utiliza para probar de qué depende su propia validez, como la existencia de Dios o la misión del Profeta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1698}"
  fr: "Dans le lexique, « ijma' » signifie résolution, et parfois accord. Pour les usulis, il s'agit de l'accord de tous les mujtahids de la communauté après l'époque du Prophète sur une question de droit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1697} C'est une preuve définitive lorsque les savants reconnus s'accordent sur l'existence d'un consensus; cela ne sert pas à prouver ce dont dépend sa propre validité, comme l'existence de Dieu ou la mission du Prophète. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1698}"
