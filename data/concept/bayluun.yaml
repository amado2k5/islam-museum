summary:
  ar: "الكتاب يقول إنه العرفج البري، وهو من اليتوعات، وبزره ناري كاليتوعات، ويسهّل البطن {cite:canon-ibn-sina-print-v1 p.404}."
  en: "The book says it is the wild 'arfaj. It belongs to the yatu'at group, its seed is hot like theirs, and it loosens the bowel {cite:canon-ibn-sina-print-v1 p.404}."
  fr: "Le livre l’identifie à l’'arfaj sauvage, du groupe des yatu'at. Sa graine est chaude comme les leurs ; il relâcherait l’intestin {cite:canon-ibn-sina-print-v1 p.404}."
  ur: "کتاب کے مطابق یہ جنگلی عرفج ہے۔ یہ یتوعات کی جنس سے ہے، اس کا بیج ان کی طرح گرم ہے، اور یہ پیٹ کو ڈھیلا کرتا ہے {cite:canon-ibn-sina-print-v1 p.404}۔"
  es: "El libro dice que es el 'arfaj salvaje. Pertenece al grupo yatu'at, su semilla es caliente como la de ellos y afloja el intestino {cite:canon-ibn-sina-print-v1 p.404}."
