summary:
  ar: "الكشوت شيء يلتف على الشوك والشجر يشبه الليف المكي ولا ورق له، وهو عند الكتاب ذو قوى متضادة، حار قليلا في أول الأولى ويابس في آخر الثانية، منق يخرج الفضول اللطيفة من العروق، ويقوي المعدة والكبد، وينفع من اليرقان ومن الحميات العتيقة."
  en: "Kushut is a thing that twines round thorns and trees, looks like Meccan fibre, and has no leaves. The book says it has opposite powers: slightly hot at the start of the first degree and dry at the end of the second. It cleanses, draws out fine humours from the veins, strengthens the stomach and the liver, and helps jaundice and old fevers. The editor's footnote gives the name as dodder."
  ur: "کشوت ایک ایسی شے ہے جو کانٹوں اور درختوں پر لپٹ جاتی ہے، مکی ریشے جیسی دکھتی ہے اور اس کا کوئی پتا نہیں۔ کتاب اس کی قوتیں متضاد بتاتی ہے: پہلے درجے کے آغاز میں ہلکی گرم اور دوسرے درجے کے آخر میں خشک۔ یہ صاف کرتا ہے، رگوں سے باریک رطوبتیں نکالتا ہے، معدے اور جگر کو قوت دیتا ہے، اور یرقان اور پرانے بخاروں میں فائدہ دیتا ہے۔ حاشیے میں اسے افتمیون لکھا گیا ہے۔"
  es: "El kushut es una planta trepadora que se enrosca alrededor de espinas y árboles, tiene el aspecto de una fibra de La Meca y carece de hojas. El libro afirma que posee propiedades opuestas: ligeramente caliente al inicio del primer grado y seca al final del segundo. Limpia, extrae los humores finos de las venas, fortalece el estómago y el hígado, y ayuda con la ictericia y las fiebres persistentes. La nota al pie del editor indica que su nombre es cuscuta."
  fr: "Le kushut est une plante qui s'enroule autour des épines et des arbres, ressemble à la fibre de La Mecque et est dépourvue de feuilles. Le livre indique qu'elle possède des propriétés opposées: légèrement chaude au début du premier degré et sèche à la fin du second. Elle purifie, favorise l'élimination des humeurs fines des veines, fortifie l'estomac et le foie, et soulage la jaunisse et les fièvres anciennes. La note de bas de page de l'éditeur la nomme cuscute."
  tr: "Kashut, dikenler ve ağaçlar etrafında dolanan, Makki lifine benzeyen ve yapraksız bir şeydir. Kitaba göre, zıt güçlere sahiptir; birincinin başında hafifçe sıcak, ikincisinin sonunda kuru. Damarlardan nazik atıkları atan, mideyi ve karaciğeri güçlendiren ve sarılık ile eski ateşler için faydalıdır."
  id: "Kashut adalah sesuatu yang melilit duri dan pohon, menyerupai serat Makki dan tidak memiliki daun. Menurut buku, ia memiliki kekuatan yang berlawanan, sedikit panas di awal yang pertama dan kering di akhir yang kedua. Ini adalah pigmen yang mengeluarkan limbah ringan dari pembuluh darah, memperkuat lambung dan hati, serta bermanfaat untuk penyakit kuning dan demam kuno."
