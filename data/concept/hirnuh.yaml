label:
  ar: "هرنوه"
  en: "Hirnuh (pepper)"
  ur: "ہرنوہ ⁦(فلفل)⁩"
  es: "Hirnuh (pimienta)"
  fr: "Hirnuh (poivre)"
  tr: "Hernøh"
  id: "Hernøh"
summary:
  ar: "الهرنوه يشبه الفلفل إلا أنه إلى الصفرة، وهو عطر يشبه العود، معتدل الطبع، يقوّي المعدة ويجيد الهضم ويقوّي الشهوة للطعام. {cite:canon-ibn-sina-print-v1 p.450}"
  en: "Hirnuh resembles pepper except that it tends to yellow; it is a fragrance like aloes wood, moderate in temperament, strengthens the stomach, improves digestion and strengthens appetite for food. {cite:canon-ibn-sina-print-v1 p.450}"
  ur: "ہرنوہ فلفل جیسا ہے مگر زردی مائل ہے؛ یہ عود جیسی خوشبو ہے، مزاج میں معتدل، معدے کو مضبوط کرتا، ہضم اچھا کرتا اور کھانے کی رغبت بڑھاتا ہے۔ {cite:canon-ibn-sina-print-v1 p.450}"
  es: "El hirnuh se asemeja a la pimienta, salvo que tiende a amarillear; tiene una fragancia parecida a la de la madera de aloe, es de temperamento moderado, fortalece el estómago, mejora la digestión y estimula el apetito. {cite:canon-ibn-sina-print-v1 p.450}"
  fr: "Le hirnuh ressemble au poivre, à ceci près qu'il a tendance à jaunir; son parfum rappelle celui du bois d'aloès; de tempérament modéré, il fortifie l'estomac, améliore la digestion et stimule l'appétit. {cite:canon-ibn-sina-print-v1 p.450}"
  tr: "Harnuh bibere benzer ancak sarımsı bir renktedir. Ud'a benzer, ılımlı bir parfümdür, mideyi güçlendirir, sindirimi iyileştirir ve iştahı artırır. {cite:canon-ibn-sina-print-v1 s.450}"
  id: "Harnuh menyerupai lada tetapi berwarna kekuningan. Ini adalah parfum mirip oud, temperamen sedang, memperkuat perut, memperbaiki pencernaan, dan meningkatkan nafsu makan. {cite:canon-ibn-sina-print-v1 hlm.450}"
