  id: "Matahari"
summary:
  ar: "الشمس والقمر بحسبان والشمس تجري لمستقر لها ذلك تقدير العزيز العليم، وجعلها الله ضياءً وسراجاً يهتدى بهما ويحسب بهما الأيام."
  en: "The sun and the moon run their reckoned courses; the sun moves to its resting place — the decree of the Mighty, the Knowing — a radiance and a lamp by which men guide themselves and count the days."
  ur: "سورج اور چاند حساب کے ساتھ چلتے ہیں؛ سورج اپنے ٹھکانے کی طرف دوڑتا ہے — یہ غالب دانا کا اندازہ ہے — روشنی اور چراغ جس سے لوگ راہ پاتے اور دن گنتے ہیں۔"
  es: "El sol y la luna siguen sus cursos preestablecidos; el sol se mueve hacia su lugar de reposo —decreto del Todopoderoso, del Omnisciente— un resplandor y una lámpara con la que los hombres se guían y cuentan los días."
  fr: "Le soleil et la lune suivent leur course prescrite; le soleil rejoint son lieu de repos — décret du Puissant, du Savant — une lumière et une lampe qui guident les hommes et leur permettent de compter les jours."
  tr: "Güneş ve ay hesaplanır, güneş dinlenme yerine doğru hareket eder. Bu, Yüce Olan, Her Şeyi Bilen'in emridir. Tanrı onları bir ışık ve bir lamba yaptı; rehber olarak yönlendirilecek ve günlerin sayıldığı bir ışık ve lamba yarattı."
  id: "Matahari dan bulan dihitung, dan matahari bergerak menuju tempat peristirahatannya. Itulah perintah Yang Maha Kuasa, Yang Maha Tahu. Allah menjadikan mereka sebagai cahaya dan lampu yang membimbing dan menghitung hari-hari."
