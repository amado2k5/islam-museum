id: concept/al-qiraat-al-shadhdha
class: concept
kind: term
label:
  ar: القراءات الشاذة
  en: Irregular readings (shadhdh)
  ur: شاذ قراءتیں
summary:
  ar: "الشاذ عند ابن الجزري ما اختل فيه ركن من أركان القراءة الصحيحة، ولو نُسب إلى أحد السبعة؛ وقسّم مكي ما يُروى إلى ما يُقرأ به، وما يُقبل ولا يُقرأ به كقراءة الصحابة الثابتة بالآحاد المخالفة للرسم، وما لا يُقبل {cite:nashr-dahman-damascus-1345-v1 p. 19} {cite:nashr-dahman-damascus-1345-v1 p. 23} {cite:nashr-dahman-damascus-1345-v1 p. 24}."
  en: "For Ibn al-Jazari an irregular reading is one in which a pillar of the sound reading fails, even if it is attributed to one of the seven; Makki divided what is reported into what is read in prayer, what is accepted but not read, such as Companions' readings established by solitary reports against the script, and what is not accepted {cite:nashr-dahman-damascus-1345-v1 p. 19} {cite:nashr-dahman-damascus-1345-v1 p. 23} {cite:nashr-dahman-damascus-1345-v1 p. 24}."
  ur: "ابن الجزری کے نزدیک شاذ وہ ہے جس میں صحیح قراءت کا کوئی رکن ٹوٹ جائے خواہ وہ سبعہ میں سے کسی کی طرف منسوب ہو؛ مکی نے منقول کو تین قسموں میں بانٹا: جس سے پڑھا جائے، جو قبول ہو مگر پڑھا نہ جائے جیسے آحاد سے ثابت رسم کے مخالف صحابہ کی قراءتیں، اور جو قبول نہ ہو {cite:nashr-dahman-damascus-1345-v1 p. 19} {cite:nashr-dahman-damascus-1345-v1 p. 23} {cite:nashr-dahman-damascus-1345-v1 p. 24}۔"
