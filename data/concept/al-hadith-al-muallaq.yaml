id: concept/al-hadith-al-muallaq
class: concept
kind: term
label: { ar: "الحديث المعلّق", en: "The suspended report (mu'allaq)", ur: "معلق حدیث" }
summary:
  ar: "المعلّق عند ابن حجر ما سقط من مبادئ سنده راوٍ أو أكثر من تصرّف مصنّف، ومن صوره حذف السند كله أو إلا الصحابي؛ وذُكر في المردود للجهل بحال المحذوف، وقد يُحكم بصحته إن جاء مسمّى من وجه آخر، ولما جزم به البخاري في صحيحه حكم خاص {cite:nuzhat-al-nazar-itr-bushra-2011 p. 75-77}. التعليق عند ابن الصلاح ما حُذف من مبتدأ إسناده واحد فأكثر، حتى استعمله بعضهم في حذف الإسناد كله، كقول البخاري: قال رسول الله، أو قال ابن عباس، أو قال الزهري عن أبي سلمة. ويرى أن ما أورده البخاري في صحيحه معلقاً بصيغة الجزم صورته صورة الانقطاع وليس حكمه حكمه، ولا يخرج من قبيل الصحيح، ورد على ابن حزم في جعله حديث المعازف منقطعاً. وأخذه من تعليق الجدار والطلاق لما فيه من قطع الاتصال {cite:muqaddima-ibn-salah-itr p. 67-70}."
  en: "For Ibn Hajar the suspended report (mu'allaq) is one in which a compiler has dropped one or more narrators from the beginning of the chain, including dropping the whole chain or all but the Companion; it is counted among rejected reports because the omitted narrators are unknown, though it may be judged sound if they are named by another route, and those al-Bukhari states assertively in his Sahih have a special status {cite:nuzhat-al-nazar-itr-bushra-2011 p. 75-77}. For Ibn al-Salah ta'liq is the omission of one or more narrators from the beginning of a chain, some using it even for dropping the whole chain, as when al-Bukhari writes 'the Messenger of God said', 'Ibn Abbas said' or 'al-Zuhri from Abu Salama'. He holds that what al-Bukhari gives in his Sahih suspended in a decisive form looks broken but does not take the ruling of a broken chain and does not leave the category of sound, and he rejects Ibn Hazm's treatment of the hadith on musical instruments as broken. He derives the term from 'suspending' a wall or a divorce, since all share a cut in continuity."
  ur: "ابن حجر کے نزدیک معلق وہ ہے جس کی سند کے شروع سے مصنف کے تصرف سے ایک یا زیادہ راوی ساقط ہوں، جس میں پوری سند یا صحابی کے سوا سب کو حذف کرنا بھی شامل ہے؛ محذوف کی حالت نامعلوم ہونے کی وجہ سے یہ مردود میں ذکر ہوتا ہے، اگرچہ کسی اور طریق سے نام آ جائیں تو صحیح کہا جا سکتا ہے، اور جو بخاری نے اپنی صحیح میں جزم سے ذکر کیا اس کا خاص حکم ہے {cite:nuzhat-al-nazar-itr-bushra-2011 p. 75-77}۔"
