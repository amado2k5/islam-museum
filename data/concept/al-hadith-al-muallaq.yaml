id: concept/al-hadith-al-muallaq
class: concept
kind: term
label: { ar: "الحديث المعلّق", en: "The suspended report (mu'allaq)", fr: "Le hadith suspendu (mu’allaq)", ur: "معلق حدیث", es: "El informe suspendido", tr: "Askıya alınmış hadis", id: "Hadis yang ditangguhkan" }
summary:
  ar: "المعلّق عند ابن حجر ما سقط من مبادئ سنده راوٍ أو أكثر من تصرّف مصنّف، ومن صوره حذف السند كله أو إلا الصحابي؛ وذُكر في المردود للجهل بحال المحذوف، وقد يُحكم بصحته إن جاء مسمّى من وجه آخر، ولما جزم به البخاري في صحيحه حكم خاص {cite:nuzhat-al-nazar-itr-bushra-2011 p. 75-77}. التعليق عند ابن الصلاح ما حُذف من مبتدأ إسناده واحد فأكثر، حتى استعمله بعضهم في حذف الإسناد كله، كقول البخاري: قال رسول الله، أو قال ابن عباس، أو قال الزهري عن أبي سلمة. ويرى أن ما أورده البخاري في صحيحه معلقاً بصيغة الجزم صورته صورة الانقطاع وليس حكمه حكمه، ولا يخرج من قبيل الصحيح، ورد على ابن حزم في جعله حديث المعازف منقطعاً. وأخذه من تعليق الجدار والطلاق لما فيه من قطع الاتصال {cite:muqaddima-ibn-salah-itr p. 67-70}."
  en: "For Ibn Hajar the suspended report (mu'allaq) is one in which a compiler has dropped one or more narrators from the beginning of the chain, including dropping the whole chain or all but the Companion; it is counted among rejected reports because the omitted narrators are unknown, though it may be judged sound if they are named by another route, and those al-Bukhari states assertively in his Sahih have a special status {cite:nuzhat-al-nazar-itr-bushra-2011 p. 75-77}. For Ibn al-Salah ta'liq is the omission of one or more narrators from the beginning of a chain, some using it even for dropping the whole chain, as when al-Bukhari writes 'the Messenger of God said', 'Ibn Abbas said' or 'al-Zuhri from Abu Salama'. He holds that what al-Bukhari gives in his Sahih suspended in a decisive form looks broken but does not take the ruling of a broken chain and does not leave the category of sound, and he rejects Ibn Hazm's treatment of the hadith on musical instruments as broken. He derives the term from 'suspending' a wall or a divorce, since all share a cut in continuity."
  fr: "Pour Ibn Hajar, le hadith suspendu est celui dont un compilateur a omis un ou plusieurs transmetteurs au début de la chaîne, jusqu’à omettre la chaîne entière ou à ne garder que le Compagnon. Il est classé parmi les récits rejetés parce que les transmetteurs omis sont inconnus, mais peut être jugé authentique si une autre voie les nomme ; ceux qu’al-Bukhari formule avec assurance dans son Sahih ont un statut particulier {cite:nuzhat-al-nazar-itr-bushra-2011 p. 75-77}. Pour Ibn al-Salah, le ta’liq est l’omission d’un ou plusieurs transmetteurs au début d’une chaîne. Certains emploient le terme même pour l’omission totale, par exemple quand al-Bukhari attribue une parole au Messager de Dieu, à Ibn Abbas, ou cite al-Zuhri d’après Abu Salama. Selon lui, ce qu’al-Bukhari présente dans son Sahih sous une forme à la fois suspendue et affirmative ressemble à une chaîne interrompue sans en avoir le statut et reste authentique. Il rejette l’analyse d’Ibn Hazm qui juge interrompu le hadith sur les instruments de musique. Il tire le terme de la « suspension » d’un mur ou d’un divorce, car tous supposent une rupture de continuité."
  ur: "ابن حجر کے نزدیک معلق وہ ہے جس کی سند کے شروع سے مصنف کے تصرف سے ایک یا زیادہ راوی ساقط ہوں، جس میں پوری سند یا صحابی کے سوا سب کو حذف کرنا بھی شامل ہے؛ محذوف کی حالت نامعلوم ہونے کی وجہ سے یہ مردود میں ذکر ہوتا ہے، اگرچہ کسی اور طریق سے نام آ جائیں تو صحیح کہا جا سکتا ہے، اور جو بخاری نے اپنی صحیح میں جزم سے ذکر کیا اس کا خاص حکم ہے {cite:nuzhat-al-nazar-itr-bushra-2011 p. 75-77}۔"
  es: "Para Ibn Hajar, el informe suspendido (mu'allaq) es aquel en el que un compilador ha omitido a uno o más narradores del principio de la cadena, incluyendo la omisión de toda la cadena o de todos excepto el Compañero; se cuenta entre los informes rechazados porque los narradores omitidos son desconocidos, aunque puede considerarse válido si se les nombra por otra vía, y aquellos que al-Bujari afirma categóricamente en su Sahih tienen un estatus especial {cite:nuzhat-al-nazar-itr-bushra-2011 p. 75-77}. Para Ibn al-Salah, ta'liq es la omisión de uno o más narradores del principio de una cadena, algunos usándolo incluso para omitir toda la cadena, como cuando al-Bujari escribe 'el Mensajero de Dios dijo', 'Ibn Abbas dijo' o 'al-Zuhri de Abu Salama'. Sostiene que lo que al-Bujari presenta en su Sahih, suspendido de forma decisiva, parece incompleto, pero no se rige por la regla de una cadena rota ni se sale de la categoría de válido. Rechaza la interpretación que Ibn Hazm hace del hadiz sobre instrumentos musicales, considerándolo incompleto. Deriva el término de «suspender» un muro o un divorcio, ya que ambos implican una interrupción en la continuidad."
  tr: "İbn Hajar'a göre, askıya alınan, bir veya daha fazla yazar değişikliğiyle rivayet zincirinin ilkelerinde eksik olan şeydir. Biçimleri arasında zincirin veya Sahabe'nin tamamının çıkarılması vardır; reddedilen durumda, atlanan zincirde cehaletten bahsedilmiştir ve eğer başka bir kaynaktan gelmişse doğruluğu başka bir kaynaktan gelirse yargılanabilir. El-Buhari Sahih'inde bunu belirttiği için özel bir hükmü vardır {alıntı:Nuzhat-al-Nazar-itr-Buşra-2011 s. 75-77}. İbn al-Salah'a göre tefsir, aktarım zincirinin başından en az bir veya daha fazla terfettir; bazıları zinciri tamamen atlamak için kullandığı kadar, örneğin El-Buhari'nin şu ifazesinde demiştir: Allah'ın Elçisi, İbn Abbas ya da Ebu Salama demiştir. El-Hazmer'in Sahih'inde askıya alınan şeyin, hükmünün kendi hükmü değil, bir kesinti biçimi olduğuna inanır ve bunun özgünlük kategorisine girmediğine inanır. İbn Hazm'ı, müzik aletlerinin hadisini birbirinden kopardığı için reddetti. Ve bağlantının kopması nedeniyle onu duvar askısından ve boşanmadan aldı {atıf:muqaddima-ibn-salah-itr s. 67-70}."
  id: "Menurut Ibn Hajar, tergantung adalah apa yang hilang dalam prinsip rantai narasi melalui satu atau lebih perubahan dalam narasi. Di antara bentuknya adalah penghapusan rantai atau seluruh Para Sahabat; dalam kasus penolakan, ketidaktahuan disebutkan dalam rantai yang dilewati, dan jika berasal dari sumber lain, ketepatannya dapat dinilai. Al-Bukhari memiliki putusan khusus karena ia menyatakan hal ini dalam Sahih-nya {kutipan: Nuzhat-al-Nazar-itr-Bushra-2011 hlm. 75-77}. Menurut Ibn al-Salah, tafsir adalah setidaknya satu atau lebih promosi sejak awal rantai transmisi; beberapa menggunakannya untuk sepenuhnya melewatkan rantai, misalnya dalam pernyataan Al-Bukhari berikut: Rasulullah berkata dalam pernyataan ini: Ibn Abbas atau Abu Salama. Ia percaya bahwa apa yang tergantung dalam Sahih Al-Hazmar bukanlah keputusannya tetapi bentuk interupsi, dan ia percaya ini tidak termasuk dalam kategori orisinalitas. Ia menolak Ibn Hazm karena ia memisahkan hadits alat musik. Dan karena terputusnya hubungan itu, ia mengambilnya dari dinding gantungan dan perceraian {atribusi: muqaddima-ibn-salah-itr hlm. 67-70}."
