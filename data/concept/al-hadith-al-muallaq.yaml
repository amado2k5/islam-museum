id: concept/al-hadith-al-muallaq
class: concept
kind: term
label: { ar: "الحديث المعلّق", en: "The suspended report (mu'allaq)", ur: "معلق حدیث" }
summary:
  ar: "المعلّق عند ابن حجر ما سقط من مبادئ سنده راوٍ أو أكثر من تصرّف مصنّف، ومن صوره حذف السند كله أو إلا الصحابي؛ وذُكر في المردود للجهل بحال المحذوف، وقد يُحكم بصحته إن جاء مسمّى من وجه آخر، ولما جزم به البخاري في صحيحه حكم خاص {cite:nuzhat-al-nazar-itr-bushra-2011 p. 75-77}."
  en: "For Ibn Hajar the suspended report (mu'allaq) is one in which a compiler has dropped one or more narrators from the beginning of the chain, including dropping the whole chain or all but the Companion; it is counted among rejected reports because the omitted narrators are unknown, though it may be judged sound if they are named by another route, and those al-Bukhari states assertively in his Sahih have a special status {cite:nuzhat-al-nazar-itr-bushra-2011 p. 75-77}."
  ur: "ابن حجر کے نزدیک معلق وہ ہے جس کی سند کے شروع سے مصنف کے تصرف سے ایک یا زیادہ راوی ساقط ہوں، جس میں پوری سند یا صحابی کے سوا سب کو حذف کرنا بھی شامل ہے؛ محذوف کی حالت نامعلوم ہونے کی وجہ سے یہ مردود میں ذکر ہوتا ہے، اگرچہ کسی اور طریق سے نام آ جائیں تو صحیح کہا جا سکتا ہے، اور جو بخاری نے اپنی صحیح میں جزم سے ذکر کیا اس کا خاص حکم ہے {cite:nuzhat-al-nazar-itr-bushra-2011 p. 75-77}۔"
