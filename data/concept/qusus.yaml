summary:
  ar: "القسوس في الكتاب ثلاثة أصناف أسود وأبيض وأحمر، حريف قابض، ويخرج من أحدها اللاذن، وهو ضار للعصب، وينفع من القروح والصداع المزمن والسيلان من الأنف ومن الدوسنطاريا، ويذكر الكتاب فيه أيضا قولا في الطمث والحبل والجنين {cite:canon-ibn-sina-print-v1 pp.652-653}"
  en: "Qusus is in the book of three kinds, black, white and red, acrid and astringent; one kind yields ladhan; it is harmful to the nerve, and benefits ulcers, chronic headache, flow from the nose and dysentery; the book also lists claims on it concerning menses, conception and the foetus {cite:canon-ibn-sina-print-v1 pp.652-653}"
  ur: "قسوس کتاب میں تین قسموں کا ہے، سیاہ، سفید اور سرخ، تیز اور قابض؛ ان میں سے ایک سے لاذن نکلتا ہے؛ اعصاب کے لیے مضر ہے، اور قرحوں، پرانے سر درد، ناک کے بہاؤ اور پیچش میں نافع ہے؛ کتاب حیض، حمل اور جنین کے بارے میں بھی اس کے متعلق اقوال درج کرتی ہے {cite:canon-ibn-sina-print-v1 pp.652-653}۔"
  es: "El qusus se clasifica en el libro en tres tipos: negro, blanco y rojo, acre y astringente; uno de ellos produce ladhan; es perjudicial para los nervios y beneficioso para las úlceras, el dolor de cabeza crónico, la secreción nasal y la disentería; el libro también enumera afirmaciones sobre él en relación con la menstruación, la concepción y el feto {cite:canon-ibn-sina-print-v1 pp.652-653}"
  fr: "Le Qusus est décrit dans le livre comme étant de trois sortes: noir, blanc et rouge, âcre et astringent; l’une d’elles provoque le ladhan; elle est nocive pour le système nerveux et bénéfique pour les ulcères, les maux de tête chroniques, les écoulements nasaux et la dysenterie; le livre mentionne également ses vertus concernant les menstruations, la conception et le fœtus {cite:canon-ibn-sina-print-v1 pp.652-653}"
