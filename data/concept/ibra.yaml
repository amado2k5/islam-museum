label: { ar: "الإبراء", en: "Release of a debt or right (ibra')" }
summary:
  ar: "تعرّف الموسوعة الفقهية الكويتية الإبراء اصطلاحاً بأنه إسقاط الشخص حقاً له في ذمة آخر أو قِبَله، فإن لم يكن الحق في ذمة أحد، كحق الشفعة، فتركه إسقاط محض لا إبراء. وتفرّق بينه وبين البراءة والمبارأة والاستبراء والإسقاط والهبة والصلح والإقرار والضمان والحطّ والترك. وتعرض أحكامه التكليفية، فهو مشروع في الجملة، وقد يجب أو يحرم أو يكره بحسب الحال، والغالب فيه الندب. وتذكر أن الفقهاء اختلفوا هل هو إسقاط أو تمليك؛ فجمهور الحنفية وقول للمالكية والشافعية والراجح عند الحنابلة أنه إسقاط، وقال بعض الشافعية وابن مفلح أنه تمليك من وجه، ورأى بعض الحنابلة أنه تمليك، ورأى ابن السمعاني أنه تمليك من المبرئ وإسقاط عن المبرأ في غير الطلاق. ويبحث الفصل في صيغته وقبوله وردّه، وفي شروط المبرئ والمبرأ والمبرأ منه، ويستمر الكلام في الموسوعة بعد الصفحات التي قُرئت هنا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1415} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1416} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1420} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1421} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1429}"
  en: "The Kuwaiti encyclopedia defines release (ibra') as the dropping by a person of a right he holds against another's liability or in his hands. Where the right is not owed by anyone, such as a right of pre-emption, leaving it is a pure dropping, not a release. It distinguishes release from acquittal, mubara'a, istibra', dropping, gift, settlement, acknowledgement, guarantee, remission and waiver. It sets out the rulings: release is permitted in general, may be obligatory, forbidden or disliked according to the case, and its general ruling is recommendation. The jurists differ on whether it is a dropping or a transfer of ownership. The majority of Hanafis, a view among Malikis and Shafi'is, and the prevailing Hanbali view hold it to be a dropping; some Shafi'is and Ibn Muflih hold it a transfer in one respect; some Hanbalis hold it a transfer; and Ibn al-Sam'ani holds it a transfer by the releasor and a dropping for the released, outside the case of divorce. The section goes on to its wording, acceptance and rejection, and the conditions for the releasor, the released and the released matter. The discussion continues in the encyclopedia beyond the pages read here."
