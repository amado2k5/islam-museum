label: { ar: "الإبراء", en: "Release of a debt or right (ibra')", es: "Liberación de una deuda o derecho (ibra')", fr: "Libération d'une dette ou d'un droit (ibra')" }
summary:
  ar: "تعرّف الموسوعة الفقهية الكويتية الإبراء بأنه إسقاط الشخص حقاً له في ذمة آخر أو قِبَله، فإن لم يكن الحق في ذمة أحد، كحق الشفعة، فتركه إسقاط محض لا إبراء. وتعرض أحكامه التكليفية، فهو مشروع في الجملة، ويجب أو يحرم أو يكره بحسب الحال، والغالب فيه الندب. وتبيّن خلاف الفقهاء هل هو إسقاط أو تمليك، وتفرّق بين الإبراء الإسقاطي والإبراء الاستيفائي. وتبحث أركانه وصيغته وقبوله وردّه، وشروط المبرئ والمبرأ والمبرأ منه، وشروط الإبراء في ذاته، وموضوعه من دين أو عين أو حق أو دعوى، وعمومه وخصوصه، وشموله الزمني وسريانه إلى غير المبرأ، وتعليقه وإضافته وتقييده، والإبراء بشرط أداء البعض أو بعوض، ورجوع المبرئ عنه، وبطلانه وأثره في الدنيا والآخرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1415} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1421} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1443}"
  en: "The Kuwaiti encyclopedia defines release (ibra') as the dropping by a person of a right he holds against another's liability or in his hands. Where the right is owed by no one, such as a right of pre-emption, leaving it is a pure dropping, not a release. The encyclopedia gives its rulings: release is permitted in general, may be obligatory, forbidden or disliked according to the case, and its general ruling is recommendation. The jurists differ on whether it is a dropping or a transfer of ownership, and the encyclopedia separates a release of dropping from a release of receipt. It then treats its pillars, wording, acceptance and rejection, the conditions on the releasor, the released and the matter released, the conditions on the release itself, its scope in general and particular terms, its time and its reach to persons other than the released, its conditional, dependent and qualified forms, release on partial payment or for a consideration, its retraction, its nullity, and its effects in this world and the next. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1415} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1421} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1443}"
  es: "La enciclopedia kuwaití define la liberación (ibra') como el cesión por parte de una persona de un derecho que posee frente a la responsabilidad de otra o que se encuentra en su poder. Cuando el derecho no es adeudado por nadie, como un derecho de tanteo, su cesión constituye una mera cesión, no una liberación. La enciclopedia establece sus dictámenes: la liberación está permitida en general, puede ser obligatoria, prohibida o desaconsejada según el caso, y su dictamen general es la recomendación. Los juristas difieren en cuanto a si se trata de una cesión o una transferencia de propiedad, y la enciclopedia distingue entre la cesión por cesión y la cesión por recepción. A continuación, aborda sus pilares, la redacción, la aceptación y el rechazo, las condiciones para el cedente, el liberado y la materia liberada, las condiciones de la liberación en sí, su alcance en términos generales y particulares, su duración y su alcance a personas distintas del liberado, sus formas condicionales, dependientes y cualificadas, la liberación mediante pago parcial o a cambio de una contraprestación, su retractación, su nulidad y sus efectos en este mundo y en el más allá. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1415} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1421} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1443}"
  fr: "L'encyclopédie koweïtienne définit la quittance (ibra') comme l'abandon par une personne d'un droit qu'elle détient contre la responsabilité d'autrui ou entre ses mains. Lorsque le droit n'est dû par personne, comme un droit de préemption, son abandon constitue une simple renonciation, et non une quittance. L'encyclopédie expose ses décisions: la quittance est généralement permise, peut être obligatoire, interdite ou déconseillée selon les circonstances, et sa règle générale est une recommandation. Les juristes divergent quant à savoir s'il s'agit d'une renonciation ou d'un transfert de propriété, et l'encyclopédie distingue la quittance par renonciation de la quittance par réception. Elle traite ensuite de ses fondements, de sa formulation, de son acceptation et de son refus, des conditions imposées au cédant, au bénéficiaire et à l'objet de la quittance, des conditions de la quittance elle-même, de sa portée en termes généraux et particuliers, de son délai et de sa portée aux tiers, de ses formes conditionnelles, subordonnées et assorties de conditions, de la quittance moyennant paiement partiel ou contrepartie, de sa rétractation, de sa nullité et de ses effets dans ce monde et dans l'autre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1415} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1421} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1443}"
