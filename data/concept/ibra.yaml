label: { ar: "الإبراء", en: "Release of a debt or right (ibra')" }
summary:
  ar: "تعرّف الموسوعة الفقهية الكويتية الإبراء بأنه إسقاط الشخص حقاً له في ذمة آخر أو قِبَله، فإن لم يكن الحق في ذمة أحد، كحق الشفعة، فتركه إسقاط محض لا إبراء. وتعرض أحكامه التكليفية، فهو مشروع في الجملة، ويجب أو يحرم أو يكره بحسب الحال، والغالب فيه الندب. وتبيّن خلاف الفقهاء هل هو إسقاط أو تمليك، وتفرّق بين الإبراء الإسقاطي والإبراء الاستيفائي. وتبحث أركانه وصيغته وقبوله وردّه، وشروط المبرئ والمبرأ والمبرأ منه، وشروط الإبراء في ذاته، وموضوعه من دين أو عين أو حق أو دعوى، وعمومه وخصوصه، وشموله الزمني وسريانه إلى غير المبرأ، وتعليقه وإضافته وتقييده، والإبراء بشرط أداء البعض أو بعوض، ورجوع المبرئ عنه، وبطلانه وأثره في الدنيا والآخرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1415} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1421} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1443}"
  en: "The Kuwaiti encyclopedia defines release (ibra') as the dropping by a person of a right he holds against another's liability or in his hands. Where the right is owed by no one, such as a right of pre-emption, leaving it is a pure dropping, not a release. The encyclopedia gives its rulings: release is permitted in general, may be obligatory, forbidden or disliked according to the case, and its general ruling is recommendation. The jurists differ on whether it is a dropping or a transfer of ownership, and the encyclopedia separates a release of dropping from a release of receipt. It then treats its pillars, wording, acceptance and rejection, the conditions on the releasor, the released and the matter released, the conditions on the release itself, its scope in general and particular terms, its time and its reach to persons other than the released, its conditional, dependent and qualified forms, release on partial payment or for a consideration, its retraction, its nullity, and its effects in this world and the next. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1415} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1421} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1443}"
