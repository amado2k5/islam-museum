summary:
  ar: "الورس شيء أحمر قانئ يشبه سحيق الزعفران، مجلوب من اليمن، قابض، ينفع من الكلف والنمش والبثور والجرب والحكة، ويُشرب منه لبياض الجلد. {cite:canon-ibn-sina-print-v1 p.454}"
  en: "Wars is a deep red substance resembling ground saffron, brought from Yemen; it is astringent, helps freckles, dark spots, pustules, scabies and itching, and when drunk helps white patches. {cite:canon-ibn-sina-print-v1 p.454}"
  ur: "ورس ایک گہرا سرخ مادہ ہے جو پسی ہوئی زعفران جیسا لگتا ہے، یمن سے لایا جاتا ہے؛ یہ قابض ہے، جھائیوں، دھبوں، پھنسیوں، خارش اور کھجلی میں مفید ہے، اور پینے سے سفید داغ میں فائدہ دیتا ہے۔ {cite:canon-ibn-sina-print-v1 p.454}"
