label:
  ar: "نورة"
  en: "Nura (lime)"
  ur: "نورہ"
  es: "Nura (lima)"
  fr: "Nura (chaux)"
summary:
  ar: "النورة في الكتاب ما ترمد من الأجسام الحجرية والخزفية، التي لم يصبها الماء محرقة، والمطفأة تسخن فقط، والمغسولة معتدلة يابسة، تقطع نزف الدم وتأكل اللحم الزائد وتنفع من حرق النار {cite:canon-ibn-sina-print-v1 p.580}."
  en: "Nura, lime, is in the book what turns to ash from stony and ceramic bodies; unslaked it burns, slaked it only warms and the washed kind is moderate and dry; it stops bleeding, eats excess flesh and the washed kind helps fire burns {cite:canon-ibn-sina-print-v1 p.580}."
  ur: "نورہ ⁦(چونا)⁩ کتاب میں پتھر اور ٹھیکری جیسے اجسام کی راکھ ہے؛ جسے پانی نہ لگا ہو وہ جلانے والا ہے، بجھایا ہوا صرف گرم کرتا ہے اور دھویا ہوا معتدل خشک ہے؛ خون بہنا روکتا، زائد گوشت کھاتا اور دھویا ہوا آگ کے جلنے میں مفید ہے {cite:canon-ibn-sina-print-v1 p.580}۔"
  es: "Nura, cal, es en el libro lo que convierte en ceniza los cuerpos pétreos y cerámicos; sin apagar arde, apagada solo calienta y la lavada es moderada y seca; detiene el sangrado, consume el exceso de carne y la lavada ayuda a que el fuego arda {cite:canon-ibn-sina-print-v1 p.580}."
  fr: "Nura, la chaux, est dans le livre ce qui se transforme en cendre à partir de corps pierreux et céramiques; non éteinte, elle brûle, éteinte, elle ne fait que chauffer et la chaux lavée est modérée et sèche; elle arrête les saignements, mange l'excès de chair et la chaux lavée aide le feu à brûler {cite:canon-ibn-sina-print-v1 p.580}."
