id: concept/al-risala-al-amma
class: concept
kind: doctrine
label:
  ar: "الرسالة العامة"
  en: "The general mission of the messengers"
  fr: "La mission générale des messagers"
  es: "La misión general de los mensajeros"
  ur: "عمومی رسالت ⁦(رسولوں کا عمومی مشن)⁩"
  tr: "Genel Misyon"
  id: "Misi Umum"
summary:
  ar: "يصف عبده الرسالة العامة بأنها بعثة الرسل من البشر لتبليغ شيء من العقائد والأحكام عن الله، وهي ركن من أركان الإيمان يجب على المؤمن اعتقاده{cite:abduh-risalat-tawhid-imara-1994 p.82}. والمعجزة عنده الدليل المعروف للبشر على صدق من يدعي النبوة، فإذا ادعى الرسول النبوة واستدل عليها بالمعجزة وجب تصديقه، ويلزم من ذلك علو فطرته وصدقه وأمانته في التبليغ وسلامته مما يشوه السيرة البشرية، وإن كان يعتريه في غير ذلك ما يعتري سائر البشر{cite:abduh-risalat-tawhid-imara-1994 p.83}. ويقرر أن المعجزة ليست مستحيلة عقلا، وأن واضع النواميس الطبيعية قادر على نواميس خاصة بخوارق العادات، وأنها تقترن بالتحدي عند دعوى النبوة، وأن الله لا يؤيد الكاذب{cite:abduh-risalat-tawhid-imara-1994 p.83}{cite:abduh-risalat-tawhid-imara-1994 p.84}. ويفرق بينها وبين السحر، الذي يعده في متناول القوى الممكنة فلا يقارب المعجزة{cite:abduh-risalat-tawhid-imara-1994 p.84}."
  en: "Abduh calls the general mission the sending of human messengers to convey to people some of God’s beliefs and rulings, a pillar of faith that every believer must affirm{cite:abduh-risalat-tawhid-imara-1994 p.82}. A miracle is the sign that shows a prophet’s claim is true; a messenger who claims prophecy and supports it with a miracle must be believed. This implies that the messengers’ nature is noble, truthful, trustworthy in conveying the message and protected from what would disfigure human conduct, though in other matters they share the conditions of ordinary people, such as eating, sleeping, illness and persecution{cite:abduh-risalat-tawhid-imara-1994 p.83}. He argues that a miracle is not impossible for reason, since breaking the usual order is not a contradiction, and the maker of natural laws can set other laws for extraordinary events{cite:abduh-risalat-tawhid-imara-1994 p.83}{cite:abduh-risalat-tawhid-imara-1994 p.84}. A miracle must come with the challenge at the claim to prophecy, because God does not confirm a liar{cite:abduh-risalat-tawhid-imara-1994 p.84}. Magic, he says, though striking, stays within human powers and does not approach a miracle{cite:abduh-risalat-tawhid-imara-1994 p.84}."
  fr: "Abduh appelle mission générale l’envoi de messagers humains pour transmettre aux hommes une part des croyances et des prescriptions de Dieu, pilier de la foi que tout croyant doit affirmer{cite:abduh-risalat-tawhid-imara-1994 p.82}. Le miracle est le signe qui montre la vérité de la prétention d’un prophète; un messager qui prétend à la prophétie et l’appuie sur un miracle doit être cru. Il en découle que la nature de ces messagers est noble, véridique, digne de confiance dans la transmission et préservée de ce qui défigurerait la conduite humaine, même s’ils partagent par ailleurs les conditions des autres hommes{cite:abduh-risalat-tawhid-imara-1994 p.83}. Il soutient que le miracle n’est pas impossible à la raison, puisque rompre l’ordre habituel n’est pas une contradiction{cite:abduh-risalat-tawhid-imara-1994 p.83}{cite:abduh-risalat-tawhid-imara-1994 p.84}. Le miracle doit accompagner le défi lancé au moment de la prétention à la prophétie, car Dieu n’appuie pas un menteur{cite:abduh-risalat-tawhid-imara-1994 p.84}. La magie, dit-il, bien que frappante, reste à la portée des forces humaines et n’approche pas le miracle{cite:abduh-risalat-tawhid-imara-1994 p.84}."
  es: "Abduh llama misión general al envío de mensajeros humanos para transmitir a las personas parte de las creencias y mandatos de Dios, un pilar de la fe que todo creyente debe afirmar{cite:abduh-risalat-tawhid-imara-1994 p.82}. El milagro es la señal que muestra la verdad de la pretensión de un profeta; un mensajero que pretende la profecía y la respalda con un milagro debe ser creído. De ello se sigue que la naturaleza de esos mensajeros es noble, veraz, digna de confianza en la transmisión y protegida de lo que desfiguraría la conducta humana, aunque en lo demás comparten las condiciones de las demás personas{cite:abduh-risalat-tawhid-imara-1994 p.83}. Sostiene que el milagro no es imposible para la razón, pues romper el orden habitual no es una contradicción{cite:abduh-risalat-tawhid-imara-1994 p.83}{cite:abduh-risalat-tawhid-imara-1994 p.84}. El milagro debe acompañar el desafío que acompaña la pretensión profética, porque Dios no respalda a un mentiroso{cite:abduh-risalat-tawhid-imara-1994 p.84}. La magia, dice, aunque llamativa, se mantiene al alcance de las fuerzas humanas y no se acerca al milagro{cite:abduh-risalat-tawhid-imara-1994 p.84}."
  ur: "عبدہ عمومی رسالت سے مراد وہ بعثت لیتے ہیں جس میں انسانوں میں سے رسول بھیجے جائیں تاکہ وہ اللہ کے کچھ عقائد اور احکام لوگوں تک پہنچائیں؛ یہ ایمان کا ایک رکن ہے جسے ہر مومن کو ماننا ہے{cite:abduh-risalat-tawhid-imara-1994 p.82}۔ ان کے نزدیک معجزہ اس نشانی کا نام ہے جو نبوت کے دعوے کے سچ ہونے پر دلالت کرتی ہے، اور جو رسول نبوت کا دعویٰ کرے اور معجزے سے دلیل دے اس کی تصدیق لازم ہے۔ اس سے یہ بھی لازم آتا ہے کہ ان کی فطرت بلند، سچی اور پیغام پہنچانے میں امانت دار ہو اور انسانی سیرت کو بگاڑنے والی باتوں سے محفوظ ہو، اگرچہ دوسری باتوں میں وہ عام انسانوں جیسے ہی ہیں{cite:abduh-risalat-tawhid-imara-1994 p.83}۔ وہ کہتے ہیں کہ معجزہ عقل کے نزدیک محال نہیں، کیونکہ معمول کے نظام کو توڑنا تناقض نہیں، اور فطری قوانین کا خالق خارق عادت واقعات کے لیے دوسرے قوانین مقرر کر سکتا ہے{cite:abduh-risalat-tawhid-imara-1994 p.83}{cite:abduh-risalat-tawhid-imara-1994 p.84}۔ معجزہ نبوت کے دعوے کے ساتھ چیلنج کے طور پر ہونا چاہیے، کیونکہ اللہ جھوٹے کی تائید نہیں کرتا{cite:abduh-risalat-tawhid-imara-1994 p.84}۔ جادو کے بارے میں وہ کہتے ہیں کہ وہ حیرت انگیز ہو سکتا ہے مگر انسانی قوتوں کی حد میں رہتا ہے اور معجزے کے قریب نہیں آتا{cite:abduh-risalat-tawhid-imara-1994 p.84}۔"
  tr: "Abdu, genel mesajı insanlardan gelen elçilerin Tanrı hakkında belirli inançları ve hükümleri iletme görevi olarak tanımlar ve bir inananın inancının inanması gereken bir inanç direğidir {cite:abduh-risalat-tawhid-imara-1994 s.82}. Onun için mucizeler, peygamberlik iddiasında bulunanların doğruluğunun insanlara iyi bilinen kanıtıdır. Peygamber peygamberlik iddiasında bulunup bunu mucizevi kanıt olarak kullanıyorsa, ona inanılmalıdır. Bu, doğasının yüksek içgüdüsünü, doğruluğunu, dürüstlüğünü ve mesajı iletmedeki bütünlüğünü gerektirir; bu da insan davranışını çarpıtır, aksi takdirde diğer insanları etkileyen şeylerden zarar görse bile {cite:abduh-risalat-tawhid-imara-1994 s.83}. Mucizelerin entelektüel olarak imkansız olmadığını, doğal yasaların yaratıcısının doğaüstü geleneklere özgü yasalara sahip olduğunu, peygamberlik iddiasında zorluklarla ilişkilendirildiğini ve Tanrı'nın yalancıyı desteklemediğini {cite:abduh-risalat-tawhid-imara-1994 s.83}{cite:abduh-risalat-tawhid-imara-1994 s.84} savunur. Büyü ile sihri ayırt eder; sihri olası güçlerin erişiminde görür ve mucizeye yaklaşmaz{cite:abduh-risalat-tawhid-imara-1994 s.84}."
  id: "Abdu mendefinisikan pesan umum sebagai tugas utusan dari umat untuk menyampaikan keyakinan dan perintah tertentu tentang Tuhan dan merupakan pilar iman yang harus dipercaya oleh iman seorang mukmin {cite:abduh-risalat-tawhid-imara-1994 hlm.82}. Bagi dia, mukjizat adalah bukti yang dikenal bagi orang tentang kebenaran mereka yang mengklaim sebagai nabi. Jika seorang nabi mengklaim kenabian dan menggunakannya sebagai bukti mukjizat, maka ia harus dipercaya. Ini membutuhkan insting tinggi, kejujuran, kejujuran, dan integritas dalam menyampaikan pesan; hal ini mendistorsi perilaku manusia, meskipun sebaliknya dirugikan oleh hal-hal yang memengaruhi orang lain {cite:abduh-risalat-tawhid-imara-1994 hlm.83}. Ia berargumen bahwa mukjizat tidak mustahil secara intelektual, bahwa pencipta hukum alam memiliki hukum khusus tradisi supranatural, bahwa klaimnya sebagai nubuat terkait dengan kesulitan, dan bahwa Tuhan tidak mendukung pembohong {cite:abduh-risalat-tawhid-imara-1994 hlm.83}{cite:abduh-risalat-tawhid-imara-1994 hlm.84}. Ia membedakan sihir dari sihir; ia melihat sihir sebagai sesuatu yang dapat diakses oleh kekuatan yang mungkin dan tidak mendekati mukjizat {cite:abduh-risalat-tawhid-imara-1994 hlm.84}."
