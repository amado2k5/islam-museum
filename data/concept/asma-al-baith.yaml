  tr: "El-Bait: Diriliş Günü'nde insanları mezarlarından çıkaran, elçileri gönderen kişidir. El-Tirmidi'nin Allah'ın isimleri hakkındaki hadislerde adı 49."
  id: "Al-Ba'ith: dia yang membawa orang keluar dari kubur pada Hari Kebangkitan, dia yang mengutus utusan. Nama nomor 49 dalam daftar yang disebutkan dalam hadits Al-Tirmidhi tentang Nama-nama Allah."
