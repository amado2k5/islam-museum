  es: "Ibn Sina enumera los signos de una bilis amarilla dominante en el color, la boca, la lengua, la sed, la respiración, los vómitos, las heces y los sueños {cite:canon-ibn-sina-print-v1 p.165}."
  ur: "ابن سینا نے رنگ، منہ، زبان، پیاس، سانس، قے، پاخانہ اور خواب میں غالب زرد پت کی علامات کی فہرست دی ہے۔"
  tr: "İbn Sina, safra baskınlığının belirtilerini renk, ağız, dil, susuzluk, solunum, kusma, ishal ve rüyalarda listeler {cite:canon-ibn-sina-print-v1 s.165}."
  id: "Ibn Sina mencantumkan tanda-tanda dominasi empedu dalam warna, mulut, lidah, haus, pernapasan, muntah, diare, dan mimpi {cite:canon-ibn-sina-print-v1 hlm.165}."
