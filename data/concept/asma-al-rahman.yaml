  tr: "En Merhametli: Merhameti tüm yaratılışı kapsayan Kişi. El-Tirmidi'nin Allah'ın En Güzel İsimleri hadislerinde bahsedilen listede 1 numarayı söyle."
  id: "Yang Maha Penyayang: Dia yang rahmatnya meliputi seluruh ciptaan. Nama nomor 1 dalam daftar yang disebutkan dalam hadis Al-Tirmidhi tentang Nama-nama Terindah Allah."
