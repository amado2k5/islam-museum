label:
  ar: "الانتحار"
  en: "Suicide (intihar)"
  ur: "خودکشی"
summary:
  ar: "يقرأ الشعراوي قوله تعالى «ولا تقتلوا أنفسكم» قراءة تشمل النهي عن قتل المرء نفسه وعن تعريضها للهلاك، ويربط تحريمه بالثقة بالله وبأن المؤمن لا يعزل نفسه عن خالقه. ويذكر حديث من تعمد قتل نفسه بشيء في الدنيا، وقصة موسى حين قال قومه «إنا لمدركون»، ويرى أن الحكم يُشمل القتل في الجماعة الإيمانية {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2146}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2147}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2148}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2149}."
  en: "Al-Sha'rawi reads 'do not kill yourselves' as forbidding a person to take his own life or to put himself in ruin. He ties the prohibition to trust in God, since a believer does not isolate himself from his Creator. He cites the report about one who hastens to end his own life, and the story of Moses' people at the sea, and reads the command as covering killing within the believing community {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2146}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2147}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2148}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2149}."
  ur: "شعراوی آیت «ولا تقتلوا أنفسکم» کو خودکشی اور خود کو ہلاکت میں ڈالنے دونوں سے منع سمجھتے ہیں۔ ان کے مطابق یہ ممانعت اللہ پر بھروسے سے جڑی ہے، کیونکہ مومن اپنے خالق سے کٹتا نہیں۔ وہ اس حدیث کا ذکر کرتے ہیں جس میں اپنی جان لینے میں جلدی کرنے والے کا ذکر ہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2146}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2147}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2148}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2149}۔"
