id: concept/intihar
class: concept
sensitivity: contested
kind: legal
label: { ar: "الانتحار", en: "Intihar (self-killing: its kinds and the jurists' rulings)" }
summary:
  ar: "الانتحار قتل الإنسان نفسه بأي وسيلة، ويقسمه الفقهاء إلى انتحار بطريق الإيجاب، وهو بفعل منهي عنه، وانتحار بطريق السلب، وهو بالامتناع عن واجب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3420}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3421} والانتحار حرام بالاتفاق، ويعد من أكبر الكبائر، والمنتحر لا يخرج عن الإسلام عند جمهور الفقهاء، فيغسل ويصلى عليه، وجاء في الأحاديث ما يدل على وعيد شديد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3428}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3429}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3430}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3431}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3432} ولا قصاص ولا دية على من قتل نفسه، وفي الإكراه والأمر بالقتل خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3425}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3426}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3427}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3428}"
  en: "Intihar is a person killing himself by any means. The jurists divide it into killing by an act, which is a forbidden deed, and killing by refusing what is obligatory. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3420}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3421} It is forbidden by agreement and counted among the greatest sins; most jurists hold that the one who kills himself does not leave Islam, so he is washed and prayed over, although the hadith warn severely. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3428}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3429}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3430}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3431}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3432} There is neither retaliation nor diya for one who kills himself; the rulings on compulsion and on ordering a killing differ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3425}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3426}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3427}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3428}"
