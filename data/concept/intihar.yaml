kind: legal
label: { ar: "الانتحار", en: "Intihar (self-killing: its kinds and the jurists' rulings)", es: "Intihar (el suicidio: sus tipos y las decisiones de los juristas)", fr: "Intihar (le suicide: ses différentes formes et les décisions des juristes)", ur: "انتحار ⁦(خود کشی: اس کی اقسام اور فقہاء کے احکام)⁩", tr: "İntihar", id: "Bunuh Diri" }
summary:
  ar: "الانتحار قتل الإنسان نفسه بأي وسيلة، ويقسمه الفقهاء إلى انتحار بطريق الإيجاب، وهو بفعل منهي عنه، وانتحار بطريق السلب، وهو بالامتناع عن واجب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3420}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3421} والانتحار حرام بالاتفاق، ويعد من أكبر الكبائر، والمنتحر لا يخرج عن الإسلام عند جمهور الفقهاء، فيغسل ويصلى عليه، وجاء في الأحاديث ما يدل على وعيد شديد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3428}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3429}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3430}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3431}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3432} ولا قصاص ولا دية على من قتل نفسه، وفي الإكراه والأمر بالقتل خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3425}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3426}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3427}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3428}"
  en: "Intihar is a person killing himself by any means. The jurists divide it into killing by an act, which is a forbidden deed, and killing by refusing what is obligatory. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3420}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3421} It is forbidden by agreement and counted among the greatest sins; most jurists hold that the one who kills himself does not leave Islam, so he is washed and prayed over, although the hadith warn severely. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3428}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3429}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3430}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3431}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3432} There is neither retaliation nor diya for one who kills himself; the rulings on compulsion and on ordering a killing differ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3425}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3426}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3427}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3428}"
  es: "Intihar es una persona que se quita la vida por cualquier medio. Los juristas lo dividen en matar por un acto, que es un acto prohibido, y matar por negarse a lo que es obligatorio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3420}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3421} Está prohibido por acuerdo y se cuenta entre los pecados más grandes; la mayoría de los juristas sostienen que quien se quita la vida no abandona el Islam, por lo que se le lava y se ora por él, aunque el hadiz advierte severamente. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3428}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3429}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3430}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3431}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3432} No hay represalias ni diya para quien se suicida; las sentencias sobre la coerción y sobre la orden de ejecución difieren. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3425}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3426}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3427}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3428}"
  fr: "L'intihar désigne le suicide par quelque moyen que ce soit. Les juristes le distinguent en deux catégories: le suicide par acte délibéré, qui est un acte interdit, et le suicide par refus d'accomplir une obligation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3420}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3421} Il est unanimement reconnu comme interdit et compte parmi les péchés les plus graves. La plupart des juristes estiment que celui qui se suicide ne renie pas l'islam; par conséquent, il est purifié par les ablutions et la prière est faite sur sa dépouille, malgré la mise en garde sévère du hadith. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3428}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3429}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3430}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3431}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3432} Il n'y a ni représailles ni diya pour celui qui se suicide; les décisions concernant la contrainte et l'ordre de tuer diffèrent. }"
  ur: "انتظار ایک شخص ہے جو کسی بھی طرح سے خود کو مارتا ہے۔ فقہاء نے اسے ایک فعل کے ذریعے قتل کرنے میں تقسیم کیا ہے جو کہ ایک حرام عمل ہے اور جو فرض ہے اس سے انکار کر کے قتل کیا جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3420}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3421} یہ معاہدہ کے مطابق حرام ہے اور کبیرہ گناہوں میں شمار ہوتا ہے۔ اکثر فقہاء کا خیال ہے کہ جو شخص اپنے آپ کو مارتا ہے وہ اسلام کو نہیں چھوڑتا، اس لیے اسے غسل دیا جاتا ہے اور اس پر نماز پڑھی جاتی ہے، حالانکہ حدیث سخت تنبیہ کرتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ3428}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ3429}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ3430}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ3429 صفحہ 3431 {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3432} اپنے آپ کو قتل کرنے والے کے لیے نہ تو بدلہ ہے اور نہ ہی دیت۔ جبر کے احکام اور قتل کے حکم میں فرق ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3425}{cite:fiqh-Mawsua-kuwaityya-noor-v3 p.3426}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.3427}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.3427}{cite:fiqh-vuwatiyya-nor-v3 p.3426}"
  tr: "İntihar, her türlü yolla intihar etmektir ve hukukçular bunu olasılıkla intihar (yasak bir eylem) ve mahrumiyet yoluyla intihar (görevden kaçınmak) olarak ayırırlar. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.3420} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3421} İntihar oybirliğiyle yasaktır ve en ağır günahlardan biri olarak kabul edilir. İntihar eden kişi çoğu hukukçuya göre İslam'ın dışına çıkmaz; onun üzerinde yıkanmalı ve namaz kılmalıdır. Ağır bir uyarı işareti veren hadisler vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3428} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3429} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3430} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3431} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3432} Kendini öldüren kişi için intikam veya kan parası yoktur ve zorlama ile öldürme emri konusunda görüş ayrılığı vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3425} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3426}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3427} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3428}"
  id: "Bunuh diri adalah bunuh diri dengan cara apapun, dan para ahli hukum membaginya menjadi bunuh diri melalui kemungkinan, yaitu tindakan terlarang, dan bunuh diri dengan cara penampasan, yaitu dengan menahan diri dari suatu kewajiban. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3420} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3421} Bunuh diri dilarang secara bulat dan dianggap sebagai salah satu dosa berat. Orang yang bunuh diri tidak keluar dari Islam menurut mayoritas ahli hukum; ia harus membersihkan diri dan berdoa untuknya. Ada hadits yang menunjukkan peringatan yang berat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3428} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3429} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3430} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3431} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3432} Tidak ada pembalasan atau uang darah bagi seseorang yang bunuh diri, dan ada perbedaan pendapat mengenai paksaan dan perintah untuk membunuh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3425} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3427} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3428}"
