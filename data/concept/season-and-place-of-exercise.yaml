label: { ar: "فصل الرياضة ومكانها عند ابن سينا", en: "The season and place of exercise in the Canon", ur: "قانون میں ورزش کا موسم اور جگہ", es: "La temporada y el lugar de ejercicio en el Canon", fr: "La saison et le lieu de l'exercice dans le Canon" }
summary:
  ar: "يحدد ابن سينا أوفق أوقات الرياضة في الربيع قرب انتصاف النهار في بيت معتدل، ويقدمها في الصيف، ويقول إن القياس في الشتاء أن تؤخر إلى المساء لكن الموانع الأخرى تمنع، فيدفأ المكان ويسخن ليعتدل {cite:canon-ibn-sina-print-v1 p.224}."
  en: "Ibn Sina sets the best time for exercise in spring at about midday in a temperate room, brings it earlier in summer, and says that by reasoning winter exercise would be put off to evening but other hindrances forbid it, so the place is warmed to make it temperate {cite:canon-ibn-sina-print-v1 p.224}."
  es: "Ibn Sina establece que el mejor momento para hacer ejercicio en primavera es alrededor del mediodía en una habitación templada, lo adelanta en verano y dice que, razonando, el ejercicio de invierno se pospondría hasta la noche, pero otros impedimentos lo prohíben, por lo que el lugar se calienta para que sea templado {cite:canon-ibn-sina-print-v1 p.224}."
  fr: "Ibn Sina fixe le meilleur moment pour l'exercice au printemps vers midi dans une pièce tempérée, le fait avancer en été, et dit que par raisonnement, l'exercice hivernal serait reporté au soir mais que d'autres obstacles l'empêchent, donc l'endroit est chauffé pour le rendre tempéré {cite:canon-ibn-sina-print-v1 p.224}."
  ur: "ابن سینا موسم بہار میں ورزش کا بہترین وقت ایک معتدل کمرے میں دوپہر کے قریب مقرر کرتا ہے، اسے گرمیوں کے شروع میں لاتا ہے، اور کہتا ہے کہ موسم سرما کی ورزش کو شام تک موخر کر دیا جائے گا لیکن دوسری رکاوٹیں اس سے منع کرتی ہیں، اس لیے اس جگہ کو گرم کیا جاتا ہے تاکہ اسے معتدل بنایا جائے۔"
