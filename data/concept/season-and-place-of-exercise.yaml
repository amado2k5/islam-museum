summary:
  ar: "يحدد ابن سينا أوفق أوقات الرياضة في الربيع قرب انتصاف النهار في بيت معتدل، ويقدمها في الصيف، ويقول إن القياس في الشتاء أن تؤخر إلى المساء لكن الموانع الأخرى تمنع، فيدفأ المكان ويسخن ليعتدل {cite:canon-ibn-sina-print-v1 p.224}."
  en: "Ibn Sina sets the best time for exercise in spring at about midday in a temperate room, brings it earlier in summer, and says that by reasoning winter exercise would be put off to evening but other hindrances forbid it, so the place is warmed to make it temperate {cite:canon-ibn-sina-print-v1 p.224}."
