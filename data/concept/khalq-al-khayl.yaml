id: concept/khalq-al-khayl
class: concept
kind: belief
label: { ar: "خلق الخيل", en: "The creation of the horse" }
summary:
  ar: "على رواية ابن عباس عند المسعودي أوحى الله إلى الريح الجنوب أني خالق منك خلقاً فاجتمعي فأخذ جبريل منها قبضة فخلق الله منها فرساً كميتاً، وجعل الغنائم تقاد على ظهره والخير معقوداً بناصيته وبارك في صهيله إرعاباً للمشركين ووسمه بغرة وتحجيل، ولما خيّر آدم بين الفرس والبراق — وصورة البراق على صورة البغل لا ذكر ولا أنثى — اختار الفرس فقيل له اخترت عزك وعز ولدك، فذلك الوسم فيه وفي ولده إلى يوم القيامة {cite:muruj-al-dhahab p. 528-529}."
  en: "In Ibn 'Abbas's telling God gathered the south wind, Gabriel took a fistful, and the bay horse was made — spoils led on its back, good knotted in its forelock, its neigh a terror, marked with blaze and white socks; Adam chose it over the mule-formed Buraq and was told he had chosen his and his sons' glory {cite:muruj-al-dhahab p. 528-529}."
