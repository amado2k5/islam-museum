id: concept/khalq-al-khayl
class: concept
kind: belief
label: { ar: "خلق الخيل", en: "The creation of the horse", es: "La creación del caballo", fr: "La création du cheval", ur: "گھوڑے کی تخلیق", tr: "At Yaratımı", id: "Penciptaan kuda" }
summary:
  ar: "على رواية ابن عباس عند المسعودي أوحى الله إلى الريح الجنوب أني خالق منك خلقاً فاجتمعي فأخذ جبريل منها قبضة فخلق الله منها فرساً كميتاً، وجعل الغنائم تقاد على ظهره والخير معقوداً بناصيته وبارك في صهيله إرعاباً للمشركين ووسمه بغرة وتحجيل، ولما خيّر آدم بين الفرس والبراق — وصورة البراق على صورة البغل لا ذكر ولا أنثى — اختار الفرس فقيل له اخترت عزك وعز ولدك، فذلك الوسم فيه وفي ولده إلى يوم القيامة {cite:muruj-al-dhahab p. 528-529}."
  en: "In Ibn 'Abbas's telling God gathered the south wind, Gabriel took a fistful, and the bay horse was made — spoils led on its back, good knotted in its forelock, its neigh a terror, marked with blaze and white socks; Adam chose it over the mule-formed Buraq and was told he had chosen his and his sons' glory {cite:muruj-al-dhahab p. 528-529}."
  es: "En el relato de Ibn 'Abbas, Dios reunió el viento del sur, Gabriel tomó un puñado y se creó el caballo castaño: botín llevado sobre su lomo, buena sangre anudada en su flequillo, su relincho un terror, marcado con una mancha blanca en la frente y calcetines blancos; Adán lo eligió sobre Buraq, con forma de mula, y se le dijo que había elegido su gloria y la de sus hijos {cite:muruj-al-dhahab p. 528-529}."
  fr: "Selon le récit d'Ibn 'Abbas, Dieu rassembla le vent du sud, Gabriel en prit une poignée, et le cheval bai fut créé — le butin porté sur son dos, le bien noué dans sa crinière, son hennissement terrifiant, marqué d'une flamme et de chaussettes blanches; Adam le choisit plutôt que Buraq, qui avait la forme d'une mule, et il lui fut dit qu'il avait choisi sa gloire et celle de ses fils {cite:muruj-al-dhahab p. 528-529}."
  ur: "ابن عباس کے کہنے میں خدا نے جنوب کی ہوا کو جمع کیا، جبرائیل نے ایک مٹھی بھری، اور خلیج کا گھوڑا بنایا گیا - اس کی پیٹھ پر لوٹ کا سامان، اس کی پیشانی میں اچھی گرہیں، اس کا ہمسایہ خوفناک، آگ اور سفید جرابوں سے نشان زد؛ آدم نے اسے خچر سے بنے ہوئے براق پر چنا اور بتایا کہ اس نے اپنی اور اپنے بیٹوں کی شان کا انتخاب کیا ہے {حوالہ: مروج الذہب صفحہ 528-529}۔"
  tr: "El-Mes'udi'deki El-Mes'udi'den İbn Abbas'ın rivayetine göre, Allah güney rüzgarına benim sizden bir yaratılış yarattığımı vahyetti, bu yüzden toplanın. Cebrail ondan bir yumruk aldı, Tanrı sırtında gülümsemeyle bir at yarattı ve ganimetleri sırtına yaktı, iyiliği alnına bağladı, küşnemesini kutsadı, çok tanrılıları korkutmak ve mızrak ile mızrak olarak işaretledi. Adem, at ile buraq arasında—ve Buraq'ın suretini katır üzerinde seçtiğinde, ne erkek ne dişi—atı seçti. Ona şöyle denildi: 'Senin onurunu ve çocuğunun onurunu seçtim.' Bu işaret Kıyamet Günü'ne kadar onun ve çocuklarının üzerinde kalacaktır {atıf:muruj-al-dhahab, s. 528-529}."
  id: "Menurut riwayat Ibn Abbas dari Al-Mas'udi dalam Al-Mas'udi, Allah mengungkapkan kepada angin selatan bahwa Aku menciptakan ciptaan darimu, maka berkumpullah. Gabriel mengambil kepalan tangan darinya, dan Allah menciptakan seekor kuda dengan senyum di punggungnya, dan membuat rampasan dinyalakan di punggungnya, dengan barang baik diikat di dahinya, memberkati dengkikannya untuk menakuti para politeis dan menandainya sebagai tombak dan tombak. Ketika Adam memilih antara kuda dan buraq—dan gambar Buraq di atas keledai, bukan laki-laki maupun perempuan—ia memilih kuda. Dikatakan kepadanya, 'Aku telah memilih kehormatanmu dan kehormatan anakmu.' Tanda itu akan tetap pada dia dan keturunannya sampai Hari Penghakiman {cite:muruj-al-dhahab, hlm. 528-529}."
