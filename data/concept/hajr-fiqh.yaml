id: concept/hajr-fiqh
class: concept
kind: legal
label: { ar: "هَجْر", en: "Hajr (abandonment and shunning: its rules for a believer, a sinner, an innovator and a wife)" }
summary:
  ar: "الهجر في اللغة ضد الوصل، وفي الاصطلاح ترك ما يلزم تعهده، ومفارقة الإنسان غيره بالبدن أو اللسان أو القلب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16814} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16815} وهجر ما نهى الله عنه مأمور به، لحديث «المهاجر من هجر ما نهى الله عنه». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16816} ويحرم هجر المسلم أخاه المسلم فوق ثلاث ليال، وأجاز الجمهور الهجر ثلاثاً، وعدّ بعض العلماء الهجر فوق ثلاث من الكبائر إلا لمن خرج من أخوة الإسلام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16817} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16818} وفي زوال الهجر بالكتابة والمراسلة للغائب خلاف، وبالسلام خلاف، وفي الهجر الذي يزول بعودة العادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16820} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16821} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16822} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16823} وخير المتهاجرين من يبدأ صاحبه بالسلام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16823} ويجوز هجر غير المسلم، وللزوج هجر زوجته الناشز في المضجع إلى أن تطيع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16823} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16824} ويشرع هجر المجاهرين بالمعاصي والبدع زجراً وتأديباً، واختلف الفقهاء في حكمه على أقوال، وفي المستتر بالمعصية على ثلاثة أقوال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16824} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16825} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16826} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16827} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16828}"
  en: "Hajr in the lexical sense is the opposite of joining; technically it is leaving what must be attended to, and a person's separation from another in body, speech or heart. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16814} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16815} Abandoning what God has forbidden is commanded, on the saying 'the emigrant is one who abandons what God has forbidden'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16816} It is forbidden for a Muslim to shun his Muslim brother for more than three nights; most jurists allow shunning for three nights, and some count shunning beyond that among the major sins except toward one who has left the brotherhood of Islam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16817} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16818} Whether shunning ends by written messages to an absent person, or by greeting, the jurists differ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16820} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16821} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16822} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16823} The better of the two who shun is the one who greets first. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16823} Shunning a non-Muslim is allowed, and a husband may shun a rebellious wife in bed until she obeys. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16823} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16824} Shunning openly sinful or innovating people as correction is recognised, and the jurists give several rulings on it and three on the one who sins in secret. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16824} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16825} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16826} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16827} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16828}"
