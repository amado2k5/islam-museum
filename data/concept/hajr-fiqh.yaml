label: { ar: "هَجْر", en: "Hajr (abandonment and shunning: its rules for a believer, a sinner, an innovator and a wife)", es: "Hajr (abandono y rechazo: sus reglas para un creyente, un pecador, un innovador y una esposa)", fr: "Hajr (abandon et rejet: ses règles pour un croyant, un pécheur, un innovateur et une épouse)" }
summary:
  ar: "الهجر في اللغة ضد الوصل، وفي الاصطلاح ترك ما يلزم تعهده، ومفارقة الإنسان غيره بالبدن أو اللسان أو القلب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16814} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16815} وهجر ما نهى الله عنه مأمور به، لحديث «المهاجر من هجر ما نهى الله عنه». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16816} ويحرم هجر المسلم أخاه المسلم فوق ثلاث ليال، وأجاز الجمهور الهجر ثلاثاً، وعدّ بعض العلماء الهجر فوق ثلاث من الكبائر إلا لمن خرج من أخوة الإسلام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16817} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16818} وفي زوال الهجر بالكتابة والمراسلة للغائب خلاف، وبالسلام خلاف، وفي الهجر الذي يزول بعودة العادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16820} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16821} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16822} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16823} وخير المتهاجرين من يبدأ صاحبه بالسلام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16823} ويجوز هجر غير المسلم، وللزوج هجر زوجته الناشز في المضجع إلى أن تطيع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16823} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16824} ويشرع هجر المجاهرين بالمعاصي والبدع زجراً وتأديباً، واختلف الفقهاء في حكمه على أقوال، وفي المستتر بالمعصية على ثلاثة أقوال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16824} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16825} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16826} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16827} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16828}"
  en: "Hajr in the lexical sense is the opposite of joining; technically it is leaving what must be attended to, and a person's separation from another in body, speech or heart. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16814} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16815} Abandoning what God has forbidden is commanded, on the saying 'the emigrant is one who abandons what God has forbidden'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16816} It is forbidden for a Muslim to shun his Muslim brother for more than three nights; most jurists allow shunning for three nights, and some count shunning beyond that among the major sins except toward one who has left the brotherhood of Islam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16817} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16818} Whether shunning ends by written messages to an absent person, or by greeting, the jurists differ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16820} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16821} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16822} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16823} The better of the two who shun is the one who greets first. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16823} Shunning a non-Muslim is allowed, and a husband may shun a rebellious wife in bed until she obeys. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16823} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16824} Shunning openly sinful or innovating people as correction is recognised, and the jurists give several rulings on it and three on the one who sins in secret. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16824} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16825} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16826} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16827} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16828}"
  es: "Hajr en el sentido léxico es lo opuesto a unirse; técnicamente es dejar lo que debe ser atendido, y la separación de una persona de otra en cuerpo, palabra o corazón. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16814} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16815} Abandonar lo que Dios ha prohibido es ordenado, en el dicho 'el emigrante es aquel que abandona lo que Dios ha prohibido'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16816} Está prohibido para un musulmán evitar a su hermano musulmán por más de tres noches; la mayoría de los juristas permiten evitar por tres noches, y algunos consideran que evitar más allá de eso es uno de los pecados mayores excepto hacia aquel que ha abandonado la hermandad del Islam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16817} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16818} Si el rechazo termina con mensajes escritos a una persona ausente o con un saludo, los juristas difieren. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16820} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16821} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16822} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16823} El mejor de los dos que evitan es el que saluda primero. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16823} Se permite evitar a un no musulmán, y un marido puede evitar a una esposa rebelde en la cama hasta que ella obedezca. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16823} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16824} Se reconoce la práctica de evitar a las personas que pecan abiertamente o innovan como corrección, y los juristas dan varias normas al respecto y tres sobre quien peca en secreto. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16824} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16825} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16826} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16827} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16828}"
  fr: "Le terme « hajr », au sens littéral, est l'opposé de « joindre »; il désigne l'abandon de ce qui requiert une attention particulière, et la séparation d'une personne d'une autre, que ce soit physiquement, verbalement ou émotionnellement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16814} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16815} Il est ordonné d'abandonner ce que Dieu a interdit, selon le dicton: « L'émigrant est celui qui abandonne ce que Dieu a interdit. » {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16816} Il est interdit à un musulman de bouder son frère musulman pendant plus de trois nuits; la plupart des juristes autorisent une abstinence de trois nuits, et certains considèrent toute abstinence au-delà de cette période comme un péché majeur, sauf envers celui qui a quitté la communauté musulmane. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16817} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16818} Que l'évitement se termine par des messages écrits à une personne absente ou par une salutation, les juristes diffèrent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16820} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16821} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16822} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16823} Le meilleur des deux qui évite est celui qui salue le premier. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16823} Il est permis de rejeter un non-musulman, et un mari peut rejeter sa femme rebelle au lit jusqu'à ce qu'elle obéisse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16823} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16824} Il est reconnu de rejeter les personnes qui pèchent ouvertement ou qui innovent, à titre de correction; les juristes donnent plusieurs avis à ce sujet et trois concernant celui qui pèche en secret. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16824} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16825} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16826} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16827} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16828}"
