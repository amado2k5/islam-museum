id: concept/al-sadd
class: concept
kind: doctrine
label:
  ar: سد يأجوج ومأجوج
  en: The Barrier of Gog and Magog
  fr: "La barrière de Gog et Magog"
  ur: یعجوج و معجوج کی دیوار
  es: "La barrera de Gog y Magog"
  tr: "Gog ve Magog Barajı"
  id: "Bendungan Gog dan Magog"
summary:
  ar: "السد الذي بناه ذو القرنين في القرآن: حاجز من حديد بين جبال منعة لفصل يأجوج ومأجوج، ويذكر أنه يُفتح في آخر الزمان فيخرجون إلى الأرض فيكون ذلك من أشراط الساعة، وقد ورد في الحديث أنهم يخرجون في آخر الزمان بعد نزول عيسى."
  en: "The barrier built by Dhu'l-Qarnayn in the Qur'an: an iron wall between mountains to hold back Gog and Magog. It is opened in the last days, when they pour out onto the earth — one of the signs before the Hour, and the reports place their emergence after the descent of Jesus."
  fr: "La barrière bâtie par Dhu’l-Qarnayn dans le Coran : un mur de fer entre des montagnes pour retenir Gog et Magog. Elle s’ouvre aux derniers jours, lorsqu’ils se répandent sur la terre — l’un des signes précédant l’Heure, et les récits placent leur sortie après la descente de Jésus."
  ur: "سورہ الکهف میں ذوالقرنین کا بنایا ہوا بند: پہاڑوں کے درمیان لوہے کی دیوار جو یعجوج و معجوج کو روکے ہوئے ہے۔ آخر زمانے میں یہ کھل جاتا ہے اور وہ زمین پر نکل آتے ہیں — یہ ساعت کی نشانیوں میں سے ہے، اور روایات کے مطابق ان کا خروج عیسیٰ کی نزول کے بعد ہوتا ہے۔"
  es: "La barrera construida por Dhu'l-Qarnayn en el Corán: un muro de hierro entre montañas para contener a Gog y Magog. Se abre en los últimos días, cuando se derraman sobre la tierra, una de las señales que preceden a la Hora, y los relatos sitúan su aparición después del descenso de Jesús."
  tr: "Kur'an'da Zul-Karnayn tarafından inşa edilen baraj, Man'ah dağları arasında Gog ve Magog'u ayırmak için demir bir bariyerdir. Zamanın sonunda açılacağı ve onların yeryüzüne çıkacağı belirtilir; bu da Saatin işaretlerinden biridir. Hadislerde, İsa'nın inişinden sonra zamanın sonunda ortaya çıkacakları belirtilir."
  id: "Bendungan yang dibangun oleh Zul-Karnayn dalam Al-Qur'an adalah penghalang besi di antara gunung-gunung Man'ah untuk memisahkan Gog dan Magog. Dikatakan bahwa bendungan itu akan terbuka pada akhir zaman dan mereka akan naik ke bumi; ini adalah salah satu tanda Jam. Hadis menyatakan bahwa setelah kejatuhan Yesus, mereka akan muncul pada akhir zaman."
