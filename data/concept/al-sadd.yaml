id: concept/al-sadd
class: concept
kind: doctrine
label:
  ar: سد يأجوج ومأجوج
  en: The Barrier of Gog and Magog
  ur: یعجوج و معجوج کی دیوار
summary:
  ar: "السد الذي بناه ذو القرنين في القرآن: حاجز من حديد بين جبال منعة لفصل يأجوج ومأجوج، ويذكر أنه يُفتح في آخر الزمان فيخرجون إلى الأرض فيكون ذلك من أشراط الساعة، وقد ورد في الحديث أنهم يخرجون في آخر الزمان بعد نزول عيسى."
  en: "The barrier built by Dhu'l-Qarnayn in the Qur'an: an iron wall between mountains to hold back Gog and Magog. It is opened in the last days, when they pour out onto the earth — one of the signs before the Hour, and the reports place their emergence after the descent of Jesus."
  ur: "سورہ الکهف میں ذوالقرنین کا بنایا ہوا بند: پہاڑوں کے درمیان لوہے کی دیوار جو یعجوج و معجوج کو روکے ہوئے ہے۔ آخر زمانے میں یہ کھل جاتا ہے اور وہ زمین پر نکل آتے ہیں — یہ ساعت کی نشانیوں میں سے ہے، اور روایات کے مطابق ان کا خروج عیسیٰ کی نزول کے بعد ہوتا ہے۔"
