summary:
  ar: "نبات معروف. باردة في أول الثانية رطبة في آخرها، وأصله مجفف. النضيج منه لطيف، والنيء كثيف، وبزره أقوى جلاء، وهو جالٍ منضج، ويستحيل إلى ما يوافق من الأخلاط، وهو إلى البلغم أميل. ينقي الجلد، وينفع من الكلف والبهق، ويدر البول وينفع من الحصاة في الكلية والمثانة إذا كانت صغاراً، وهو مقيء بأصله، ويولّد الهيضة إذا لم يُستمرأ جيداً، وإذا فسد في المعدة استحال إلى طبيعة سمية {cite:canon-ibn-sina-print-v1 p.395}، {cite:canon-ibn-sina-print-v1 p.396}."
  en: "A well-known fruit. Cold in the first half of the second degree and moist at its end; its root is dried. The ripe fruit is light and the unripe is dense; its seed is the stronger polisher and it is a polishing ripening agent. It turns into whichever humour suits, and it leans more to phlegm. It cleanses the skin, helps freckles and white patches, promotes urine, and helps small stones in the kidney and bladder. Its root causes vomiting, and if it is not digested well it produces a sudden flux (haydha). When it spoils in the stomach it turns into a poisonous nature {cite:canon-ibn-sina-print-v1 p.395}, {cite:canon-ibn-sina-print-v1 p.396}."
  fr: "Fruit connu. Froid dans la première moitié du deuxième degré, humide à sa fin ; sa racine est séchée. Le fruit mûr est léger, le vert dense ; sa graine est plus polissante et c’est un agent de maturation et de polissage. Il se transforme en l’humeur qui convient, penchant davantage vers le phlegme. Il nettoierait la peau, aiderait contre taches de rousseur et taches blanches, favoriserait l’urine et aiderait contre les petits calculs rénaux et vésicaux. Sa racine provoquerait le vomissement ; mal digéré, il produirait un flux soudain (haydha). Corrompu dans l’estomac, il prendrait une nature toxique {cite:canon-ibn-sina-print-v1 p.395}, {cite:canon-ibn-sina-print-v1 p.396}."
  ur: "یہ معروف پھل ہے۔ دوسرے درجے کے آغاز میں ٹھنڈا اور آخر میں تر، اور اس کی جڑ خشک کی جاتی ہے۔ پکا ہوا ہلکا ہے اور کچا گھنا؛ اس کا بیج زیادہ جلا دینے والا ہے۔ یہ جس رطوبت کے موافق ہو اس میں بدل جاتا ہے، اور بلغم کی طرف زیادہ مائل ہے۔ یہ جلد کو صاف کرتا، کلف اور برص میں نفع دیتا، پیشاب آور ہے، اور گردے اور مثانے کی چھوٹی پتھریوں میں نفع دیتا ہے۔ اس کی جڑ قے لاتی ہے، اور اگر ٹھیک ہضم نہ ہو تو ہیضہ پیدا کرتا ہے، اور معدے میں خراب ہو جائے تو زہریلی خاصیت اختیار کر لیتا ہے {cite:canon-ibn-sina-print-v1 p.395}، {cite:canon-ibn-sina-print-v1 p.396}۔"
  es: "Una fruta muy conocida. Fría en la primera mitad del segundo grado y húmeda en su extremo; su raíz es seca. La fruta madura es ligera y la inmadura es densa; su semilla es el pulidor más fuerte y es un agente pulidor de la maduración. Se transforma en el humor que le conviene, y tiende más a la flema. Limpia la piel, ayuda con las pecas y las manchas blancas, promueve la micción y ayuda con los cálculos pequeños en el riñón y la vejiga. Su raíz causa vómitos, y si no se digiere bien produce un flujo repentino (haydha). Cuando se estropea en el estómago se vuelve venenosa {cite:canon-ibn-sina-print-v1 p.395}, {cite:canon-ibn-sina-print-v1 p.396}."
