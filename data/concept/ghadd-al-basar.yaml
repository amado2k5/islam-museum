summary:
  ar: "يرى الشيخ عمر عبد الكافي أن غض البصر حفظ للبصيرة، وأن كثيرًا من الحوادث تبدأ بنظرة واحدة، وأن الخاطرة تُرد من أولها. {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep13 00:31:00} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep13 00:31:30}"
  en: "Sheikh Omar Abdelkafy holds that lowering the gaze protects insight, that many incidents begin with a glance, and that a passing thought should be rejected at once {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep13 00:31:00} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep13 00:31:30}."
  ur: "شیخ عمر عبدالکافی کے نزدیک نگاہ نیچی رکھنا بصیرت کی حفاظت ہے، بہت سے واقعات ایک نظر سے شروع ہوتے ہیں، اور گزرتا خیال شروع ہی میں رد کرنا چاہیے {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep13 00:31:00} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep13 00:31:30}۔"
