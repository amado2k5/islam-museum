id: concept/al-arabiyya-fi-eritrea
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-world]
label:
  ar: "العربية في إريتريا"
  en: "Arabic in Eritrea"
  ur: "اریٹریا میں عربی"
  fr: "l'arabe en Érythrée"
  es: "el árabe en Eritrea"
summary:
  ar: "تعرض هذه الصفحة ما يقوله ملخص بحثي زُوّد به المتحف عن العربية في إريتريا: مكانتها القانونية، والأصناف المحكية منها، والأرقام الرسمية كما وردت. ولا يحمل الدستور لغة رسمية معيّنة، وتعمل العربية في الواقع لغة عمل إلى جانب التغرينية والإنجليزية بحسب الملخص. ولم يفتح المتحف الصفحات التي يسمّيها الملخص، وقد أجاز المؤسس استعماله كما ورد في 21 نوفمبر 2026. وحيث يقول الملخص إنه لم يجد مصدراً رسمياً أو رقماً فهذا ما تقوله الصفحة بلفظه، ولا يضع المتحف رقماً من عنده."
  en: "This page sets out what a research summary supplied to the museum says about Arabic in Eritrea: its legal status, the varieties spoken and the official figures, each as the summary gives it. The constitution designates no official language, and in practice, the summary says, Arabic works as a language of work beside Tigrinya and English. The museum did not open the pages the summary names, and the founder approved using it as supplied on 21 November 2026. Where the summary says that no official source or figure was found, this page says exactly that and supplies no number of its own."
  ur: "یہ صفحہ وہ پیش کرتا ہے جو متحف کو فراہم کردہ ایک تحقیقی خلاصہ اریٹریا میں عربی کے بارے میں کہتا ہے: اس کی قانونی حیثیت، بولی جانے والی اقسام اور سرکاری اعداد و شمار، ہر ایک جیسا خلاصہ دیتا ہے۔ آئین کسی خاص سرکاری زبان کو متعین نہیں کرتا، اور خلاصے کے مطابق عملاً عربی تگرنیا اور انگریزی کے ساتھ کام کی زبان کے طور پر چلتی ہے۔ متحف نے خلاصے کے بیان کردہ صفحات نہیں کھولے، اور بانی نے 21 نومبر 2026 کو خلاصے کو جیسا ملا اسی طرح استعمال کرنے کی منظوری دی۔ جہاں خلاصہ کہتا ہے کہ کوئی سرکاری ماخذ یا عدد نہیں ملا وہاں یہ صفحہ بالکل یہی کہتا ہے اور اپنی طرف سے کوئی عدد نہیں دیتا۔"
  fr: "Cette page expose ce que dit un résumé de recherche remis au musée sur l'arabe en Érythrée : son statut juridique, les variétés parlées et les chiffres officiels, chacun tel que le résumé le donne. La constitution ne désigne aucune langue officielle, et en pratique, dit le résumé, l'arabe sert de langue de travail avec le tigrigna et l'anglais. Le musée n'a pas ouvert les pages que nomme le résumé, et le fondateur a approuvé l'usage du résumé tel que fourni le 21 novembre 2026. Là où le résumé dit qu'aucune source officielle ni aucun chiffre n'a été trouvé, cette page dit exactement cela et ne fournit aucun nombre de son cru."
  es: "Esta página expone lo que dice un resumen de investigación entregado al museo sobre el árabe en Eritrea: su estatus jurídico, las variedades habladas y las cifras oficiales, cada una como la da el resumen. La constitución no designa ninguna lengua oficial, y en la práctica, dice el resumen, el árabe funciona como lengua de trabajo junto al tigriña y el inglés. El museo no abrió las páginas que nombra el resumen, y el fundador aprobó usarlo tal como se entregó el 21 de noviembre de 2026. Donde el resumen dice que no se halló ninguna fuente oficial ni cifra, esta página dice exactamente eso y no aporta ningún número propio."
