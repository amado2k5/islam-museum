label: { ar: "المِلْك", en: "Ownership (milk) and its kinds, causes and limits", ur: "مِلْک ⁦(ملکیت)⁩", es: "Propiedad (de la leche) y sus tipos, causas y límites", fr: "La propriété (du lait) et ses types, causes et limites" }
summary:
  ar: "الملك في اللغة احتواء الشيء والقدرة على الاستبداد به، وهو عند الفقهاء حكم شرعي يمكّن صاحبه من الانتفاع بالمملوك والعوض عنه. وينقسم إلى تام وناقص، وخاص وعام، واختياري وقهري، ومستقر وغير مستقر، وله أسباب مشروعة، وترد عليه قيود في أسبابه واستعماله وانتقاله، وللدولة قيود عليه للمصلحة العامة كالتسعير والاحتكار ونزع الملك لمصلحة المسجد والطريق."
  en: "Milk is, in the lexicon, possession of a thing with sole power over it. For the jurists it is a legal capacity that lets its holder use the owned thing and take its return. It is divided into full and partial, private and public, voluntary and compulsory, and stable and unstable. Its lawful causes are restricted, its use is limited (no waste, no harm to others, no prohibited use), its transfer requires consent, and the ruler may restrict it for public interest, as in price-fixing, hoarding, hima, and taking land for mosques and roads against fair compensation."
  ur: "مِلک فقہاء کے نزدیک ایک شرعی حکم ہے جو مالک کو مملوکہ چیز سے نفع اٹھانے اور اس کے عوض کا حق دیتا ہے۔ اس کی تقسیم، اسباب، استعمال اور انتقال پر شرعی قیود ہیں، اور حکومت عامہ مصلحت کے تحت پابندیاں عائد کر سکتی ہے۔"
  es: "En el léxico, la posesión de algo con poder exclusivo sobre ello es una capacidad jurídica que permite a su poseedor usar el bien y obtener una compensación. Se divide en plena y parcial, privada y pública, voluntaria y obligatoria, y estable e inestable. Sus causas lícitas están restringidas, su uso es limitado (no se permite el desperdicio, el daño a terceros ni el uso prohibido), su transferencia requiere consentimiento, y el gobernante puede restringirla por interés público, como en la fijación de precios, el acaparamiento, el hima y la expropiación de terrenos para mezquitas y carreteras a cambio de una justa compensación."
  fr: "Le droit de propriété, au sens juridique du terme, désigne la possession d'une chose assortie d'un pouvoir exclusif sur celle-ci. Pour les juristes, il s'agit d'une capacité légale permettant à son titulaire d'utiliser la chose possédée et d'en obtenir restitution. Ce droit se divise en droit absolu et droit partiel, privé et public, volontaire et obligatoire, stable et instable. Ses causes légitimes sont restreintes, son usage est limité (interdiction du gaspillage, du préjudice causé à autrui et des usages prohibés), sa cession requiert un consentement, et le pouvoir peut le restreindre pour des raisons d'intérêt public, comme dans le cas de la fixation des prix, de l'accaparement, du hima, ou de l'expropriation de terrains pour la construction de mosquées et de routes sans juste indemnisation."
