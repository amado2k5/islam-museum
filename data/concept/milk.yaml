id: concept/milk
class: concept
kind: legal
label: { ar: "المِلْك", en: "Ownership (milk) and its kinds, causes and limits", ur: "مِلْک (ملکیت)" }
summary:
  ar: "الملك في اللغة احتواء الشيء والقدرة على الاستبداد به، وهو عند الفقهاء حكم شرعي يمكّن صاحبه من الانتفاع بالمملوك والعوض عنه. وينقسم إلى تام وناقص، وخاص وعام، واختياري وقهري، ومستقر وغير مستقر، وله أسباب مشروعة، وترد عليه قيود في أسبابه واستعماله وانتقاله، وللدولة قيود عليه للمصلحة العامة كالتسعير والاحتكار ونزع الملك لمصلحة المسجد والطريق."
  en: "Milk is, in the lexicon, possession of a thing with sole power over it. For the jurists it is a legal capacity that lets its holder use the owned thing and take its return. It is divided into full and partial, private and public, voluntary and compulsory, and stable and unstable. Its lawful causes are restricted, its use is limited (no waste, no harm to others, no prohibited use), its transfer requires consent, and the ruler may restrict it for public interest, as in price-fixing, hoarding, hima, and taking land for mosques and roads against fair compensation."
  ur: "مِلک فقہاء کے نزدیک ایک شرعی حکم ہے جو مالک کو مملوکہ چیز سے نفع اٹھانے اور اس کے عوض کا حق دیتا ہے۔ اس کی تقسیم، اسباب، استعمال اور انتقال پر شرعی قیود ہیں، اور حکومت عامہ مصلحت کے تحت پابندیاں عائد کر سکتی ہے۔"
