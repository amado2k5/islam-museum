summary:
  ar: "أفضلها أدمغة الطير، وخصوصاً الجبلية، ومن ذوات الأربع دماغ الجمل ثم العجل. بارد رطب يولّد البلغم والأخلاط الغليظة. دماغ الدجاج نافع للرعاف الحجابي، ودماغ البعير المجفف مع خل الخمر ينفع الصرع، وهو بطيء الهضم لطاخ للمعدة، ويُذكر أنه نافع في السموم المشروبة والمعضوضة {cite:canon-ibn-sina-print-v1 p.436} {cite:canon-ibn-sina-print-v1 p.437}."
  en: "The best brains are those of birds, especially mountain birds; among four-footed animals, the camel's and then the calf's. Cold and moist; it generates phlegm and thick humours. The chicken brain helps a membrane nosebleed; a dried camel brain given with wine vinegar helps epilepsy. It digests slowly and clings to the stomach. The book says brains help poisons drunk and bites {cite:canon-ibn-sina-print-v1 p.436} {cite:canon-ibn-sina-print-v1 p.437}."
  ur: "بہترین دماغ پرندوں کے ہیں، خاص طور پر پہاڑی پرندوں کے؛ چار پاؤں والوں میں اونٹ کا دماغ، پھر بچھڑے کا۔ ٹھنڈا اور تر؛ بلغم اور گاڑھی رطوبتیں پیدا کرتا ہے۔ مرغی کا دماغ ناک کے پردے کی نکسیر میں مفید ہے؛ خشک اونٹ کا دماغ سرکے کے ساتھ مرگی میں نفع دیتا ہے۔ یہ دیر سے ہضم ہوتا ہے اور معدے سے چپکتا ہے؛ کتاب کہتی ہے کہ دماغ زہر پینے اور کاٹنے کی صورت میں مفید ہیں {cite:canon-ibn-sina-print-v1 p.436} {cite:canon-ibn-sina-print-v1 p.437}۔"
  es: "Los mejores cerebros son los de las aves, especialmente las de las aves de montaña; entre los animales de cuatro patas, el del camello y luego el del ternero. Frío y húmedo; genera flema y humores espesos. El cerebro de pollo ayuda a una hemorragia nasal membranosa; un cerebro de camello seco administrado con vinagre de vino ayuda a la epilepsia. Se digiere lentamente y se adhiere al estómago. El libro dice que los cerebros ayudan a los venenos, a las borracheras y a las picaduras {cite:canon-ibn-sina-print-v1 p.436} {cite:canon-ibn-sina-print-v1 p.437}."
  fr: "Les meilleurs cerveaux sont ceux des oiseaux, surtout des oiseaux de montagne; parmi les quadrupèdes, celui du chameau, puis celui du veau. Froid et humide, il produit des mucosités et des humeurs épaisses. Le cerveau de poulet aide à stopper un saignement de nez dû à une membrane; un cerveau de chameau séché, administré avec du vinaigre de vin, soulage l’épilepsie. Il se digère lentement et reste longtemps dans l’estomac. Le livre affirme que le cerveau aide à contrer les poisons ingérés et les morsures {cite:canon-ibn-sina-print-v1 p.436} {cite:canon-ibn-sina-print-v1 p.437}."
