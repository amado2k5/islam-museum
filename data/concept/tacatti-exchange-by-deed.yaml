label:
  ar: "التعاطي"
  en: "Ta'ati (exchange by deed without offer and acceptance)"
  ur: "تعاطی ⁦(ایجاب و قبول کے بغیر لین دین)⁩"
  es: "Ta'ati (intercambio mediante escritura pública sin oferta ni aceptación)"
  fr: "Ta'ati (échange par acte sans offre ni acceptation)"
summary:
  ar: "التعاطي أن يأخذ المشتري المبيع ويدفع الثمن، أو يدفع البائع المبيع ويدفع الآخر الثمن، من غير تكلم ولا إشارة. وجوزه الحنفية والمالكية والحنابلة، ومنع الشافعية في المذهب اشتراط الصيغة. واستدل المجيزون بأن البيع أُحل ولم تبين كيفيته فيرجع فيه إلى العرف، وبأن الصحابة لم ينقل عنهم الإيجاب والقبول في كثير من البيوع. وجوز الحنفية والمالكية والحنابلة الإقالة والإجارة بالتعاطي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5362} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5363} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5364}"
  en: "Ta'ati is the buyer taking the goods and giving the price, or the seller handing the goods and the other giving the price, without speech or gesture. The Hanafis, Malikis and Hanbalis allow it, while the Shafii school requires the formula. The permitters argue that God allowed sale without fixing its form, so custom decides, and that the Companions' many sales show no offer and acceptance; they allow revocation and hire by exchange as well. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5362} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5363} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5364}"
  es: "Ta'ati es la práctica en la que el comprador toma la mercancía y paga el precio, o el vendedor entrega la mercancía y el otro paga el precio, sin hablar ni hacer gestos. Las escuelas Hanafi, Maliki y Hanbali lo permiten, mientras que la escuela Shafi'i exige la fórmula. Quienes lo permiten argumentan que Dios autorizó la venta sin fijar su forma, por lo que la costumbre decide, y que las numerosas ventas de los Compañeros no muestran oferta ni aceptación; también permiten la revocación y el alquiler mediante permuta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5362} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5363} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5364}"
  fr: "La ta'ati consiste pour l'acheteur à prendre la marchandise et à en fixer le prix, ou pour le vendeur à remettre la marchandise à l'autre partie qui en fixe le prix, sans parole ni geste. Les écoles hanafite, malikite et hanbalite l'autorisent, tandis que l'école shafi'ite exige une formule. Les partisans de la ta'ati soutiennent que Dieu a permis la vente sans en fixer la forme, laissant ainsi la coutume trancher, et que les nombreuses ventes effectuées par les Compagnons ne témoignent d'aucune offre ni acceptation; ils autorisent également la révocation et la location par échange."
