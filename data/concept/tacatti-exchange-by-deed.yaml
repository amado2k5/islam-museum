label:
  ar: "التعاطي"
  en: "Ta'ati (exchange by deed without offer and acceptance)"
  ur: "تعاطی (ایجاب و قبول کے بغیر لین دین)"
summary:
  ar: "التعاطي أن يأخذ المشتري المبيع ويدفع الثمن، أو يدفع البائع المبيع ويدفع الآخر الثمن، من غير تكلم ولا إشارة. وجوزه الحنفية والمالكية والحنابلة، ومنع الشافعية في المذهب اشتراط الصيغة. واستدل المجيزون بأن البيع أُحل ولم تبين كيفيته فيرجع فيه إلى العرف، وبأن الصحابة لم ينقل عنهم الإيجاب والقبول في كثير من البيوع. وجوز الحنفية والمالكية والحنابلة الإقالة والإجارة بالتعاطي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5362} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5363} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5364}"
  en: "Ta'ati is the buyer taking the goods and giving the price, or the seller handing the goods and the other giving the price, without speech or gesture. The Hanafis, Malikis and Hanbalis allow it, while the Shafii school requires the formula. The permitters argue that God allowed sale without fixing its form, so custom decides, and that the Companions' many sales show no offer and acceptance; they allow revocation and hire by exchange as well. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5362} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5363} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5364}"
