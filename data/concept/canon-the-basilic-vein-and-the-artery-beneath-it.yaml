id: concept/canon-the-basilic-vein-and-the-artery-beneath-it
class: concept
kind: scientific
label: { ar: "الباسليق والشريان تحته عند ابن سينا", en: "The basilic vein and the artery beneath it in the Canon", ur: "قانون میں باسلیق اور اس کے نیچے شریان", es: "La vena basílica y la arteria que se encuentra debajo de ella en el Canon", fr: "La veine basilique et l'artère située en dessous dans le canon", tr: "İbn Sina'ya göre basiliq ve altındaki arter.", id: "Basiliq dan arteri di bawahnya menurut Ibn Sina" }
summary:
  ar: "يعد ابن سينا الباسليق عظيم الخطر لوقوع الشريان تحته، ويذكر ما يعرف به أن الشريان أصيب وكيف يحتبس دمه، وما في بتر الشريان وربط العضو من مخاطر {cite:canon-ibn-sina-print-v1 pp.294-295}."
  en: "Ibn Sina counts the basilic as of great danger because the artery lies beneath it, and gives how it is known that the artery was struck, how its blood is stopped, and the dangers in cutting the artery and tying the limb {cite:canon-ibn-sina-print-v1 pp.294-295}."
  es: "Ibn Sina considera la basílica como muy peligrosa porque la arteria se encuentra debajo de ella, y explica cómo se sabe que la arteria ha sido golpeada, cómo se detiene el flujo sanguíneo y los peligros de cortar la arteria y atar la extremidad {cite:canon-ibn-sina-print-v1 pp.294-295}."
  fr: "Ibn Sina considère la basilique comme un lieu très dangereux car l'artère se trouve en dessous, et explique comment on sait que l'artère a été touchée, comment son sang est arrêté, et les dangers liés à la coupe de l'artère et à l'ligature du membre {cite:canon-ibn-sina-print-v1 pp.294-295}."
  ur: "ابن سینا نے تلسی کو بڑا خطرہ شمار کیا ہے کیونکہ اس کے نیچے شریان ہوتی ہے، اور بتاتا ہے کہ یہ کیسے معلوم ہوتا ہے کہ شریان پر حملہ ہوا، اس کا خون کیسے بند ہوا، اور شریان کو کاٹنے اور اعضاء کو باندھنے کے خطرات۔"
  tr: "İbn Sina el-Basiliq, altındaki arter yüksek olduğu için son derece tehlikeli olarak kabul edilir. Arterin yaralanmasından, kanının nasıl hapsolduğundan ve amputasyon ile organ ligasyonu tehlikelerinden bahseder {cite:canon-ibn-sina-print-v1 s.294-295}."
  id: "Ibn Sina al-Basiliq dianggap sangat berbahaya karena arteri di bawahnya tinggi. Ia menyebutkan apa yang dikenal sebagai arteri yang terluka, bagaimana darahnya terperangkap, dan bahaya amputasi serta ligasi organ {cite:canon-ibn-sina-print-v1 hlm.294-295}."
