  ar: هاروت وماروت
  en: Harut and Marut
  ur: ہاروت اور ماروت
summary:
  ar: ملكان يُذكر أنهما نزل إلى بابل لابتلاء أهلها بالسحر، وقد علّمهما ما يفتتنون به من السحر، فيصيران فتنة كما في قصة owner's wife؛ والآية الوحيدة
    في هذا الباب [[passage/quran-2-102|البقرة 102]].
  en: Two angels said to have descended to Babylon to test its people with magic, taught what they were tempted by — as in the story of the wife
    of the Egyptian — per the single Qur'anic verse on them [[passage/quran-2-102|al-Baqarah 102]].
  ur: دو فرشتے جن کا کہا جاتا ہے کہ وہ بابل میں جادو کے امتحان کے لیے نازل ہوئے اور جنہیں وہ سحر سکھایا گیا جس سے لوگ فتنہ ہوتے ہیں — جیسا کہ
    مصری کے بیوی کی کہانی میں آیا — اور اس باب میں قرآن کا واحد آیت [[passage/quran-2-102|البقرہ 102]] ہے۔
