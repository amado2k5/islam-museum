id: concept/banat-wardan
class: concept
kind: natural
label:
  ar: "بنات وردان"
  en: "Banat wardan (the book's beetles and cockroaches)"
  fr: "Banat wardan (coléoptères et blattes du livre)"
  ur: "بنات وردان ⁦(کیڑے اور جھینگر)⁩"
summary:
  ar: "خنافس وصراصير، ينفع من أوجاع الأرحام والكلى بعد أن يُكسر تحليله بزيت وموم ومح البيض، ويدرّ البول والطمث، ويُسقط الجنين، وينفع من النافض والحميات وسموم الهوام، وبدله القيسور {cite:canon-ibn-sina-print-v1 p.414}."
  en: "Beetles and cockroaches, the editor says. The book says that after its dissolving is broken with oil, wax and egg yolk it helps pains of the womb and kidneys, moves urine and the menses, expels the foetus, helps shivering fits and fevers, and helps poisons of vermin; its substitute is the qaysur {cite:canon-ibn-sina-print-v1 p.414}."
  fr: "Coléoptères et blattes, selon l’éditeur. Le livre affirme qu’après atténuation de leur action résolutive par huile, cire et jaune d’œuf, ils aideraient contre les douleurs de l’utérus et des reins, favoriseraient urine et règles, expulseraient le fœtus, aideraient contre frissons, fièvres et venins des petites bêtes ; le substitut est le qaysur {cite:canon-ibn-sina-print-v1 p.414}."
  ur: "کتاب کے مطابق یہ حاشیے کے مطابق خنفساء اور جھینگر ہیں۔ کتاب کہتی ہے کہ تیل، موم اور انڈے کی زردی کے ساتھ اس کی تحلیل توڑنے کے بعد یہ رحم اور گردے کے درد میں مفید ہے، پیشاب اور حیض جاری کرتا ہے، جنین گرا دیتا ہے، کپکپی اور بخار میں مفید ہے، اور موذی کیڑوں کے زہر میں مفید ہے؛ اس کا بدل قیسور ہے {cite:canon-ibn-sina-print-v1 p.414}۔"
