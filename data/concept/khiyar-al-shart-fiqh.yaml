id: concept/khiyar-al-shart-fiqh
class: concept
kind: legal
label:
  ar: خيار الشرط
  en: Khiyar al-shart (option of stipulation)
  ur: خیار الشرط
summary:
  ar: 'خيار الشرط اسم مركب على ما يثبت بالاشتراط لأحد المتعاقدين من الاختيار بين الإمضاء والفسخ؛ وعرفه ابن عرفة من المالكية بأنه بيع وقف بتّه أولا على إمضاء يتوقع. وأسماؤه: الخيار الشرطي (تمييزا عن الحكمي كخيار العيب)، وخيار التروي، وبيع الخيار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7923}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7924} مشروعيته: جمهور الفقهاء يعتبرونه مشروعا لا ينافي العقد، بحديث ابن عمر وحبان بن منقذ «إذا بعت فقل لا خلابة» و«أنت بالخيار ثلاث ليال»، وبالإجماع عند النووي وابن الهمام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7924}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7925} صيغته: لا يتطلب لفظا معينا، فيكفي كل لفظ يدل على الخيار كالرضا أو المشيئة، وقد يثبت بالعرف عند المالكية كما لو تعارف الناس على الخيار في سلعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7925}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7926} شرائط قيامه: أن يكون مقارنا للعقد أو في مجلسه عند الشافعية والحنابلة؛ والحنفية يرون إلحاقه بعد العقد كإدخاله فيه؛ وأن يكون مؤقتا بمدة معلومة عند الجمهور، لأن الخيار المطلق يورث الجهالة الفاحشة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7926}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7927}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7927}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928} المدة: حدها الأدنى غير مقدر فيجوز ولو لحظة؛ وحدها الأقصى: مذهب أحمد ومحمد بن الحسن وأبي يوسف وغيرهم جواز أي مدة بالتفويض، ويستوجه صاحب غاية المنتهى المنع في المدة الخارجة عن العادة؛ ومالك يقيدها بقدر الحاجة والمعتاد بحسب المبيع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7929} الغرض من الخيار: تمكين المتعاقد من التأمل والتجربة، وتلبي حاجة الناس إلى المشورة والاختبار؛ ومدة الخيار عند المالكية بقدر ما يختبر فيه المبيع ويستشار فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7929} مدة الخيار في العقار: أقصاها شهر، ويلحق به ستة أيام، فأقصى ما يجوز مد الخيار إليه ستة وثلاثون يوما؛ ويلحق اليومان بالمدة لتمكين المشتري من الرد إذا كان المبيع في يده عند انتهائها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7930} الدواب: إن كان الخيار لمعرفة قوتها وأكلها وسعرها فأقصاه ثلاثة أيام، وإن كان للاختبار داخل البلد فيوم أو نحوه، وخارجه بريد عند ابن القاسم وبريدان عند أشهب (والبريد: مسافة نصف يوم سيرا)؛ وبقية الأشياء من الثياب والعروض والمثليات أقصاها ثلاثة أيام ويلحق بها يوم، أما الخضر والفواكه فتقدر مدتها بقدر حاجة الاختبار قبل أن تتغير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7930} الاتجاه الثالث يحدد الخيار بثلاثة أيام بلياليها أيا كان المعقود عليه، ويمنع المجاوزة، وهو مذهب أبي حنيفة وزفر والشافعي في المشهور عنه، واحتجوا بحديث حبان بن منقذ وبحديث المصراة «من اشترى شاة محفلة فهو بخير النظرين ثلاثة أيام»، وقال الشافعي إنه لما ثبت الخيار بالنص وقف عند الثلاث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7930}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7931} الزيادة على الثلاث: عند أبي حنيفة وزفر العقد فاسد، وعند الشافعي باطل؛ وينفرد أبو حنيفة بأن إسقاط الزيادة يصحح العقد ما لم تمض الأيام الثلاثة، ويخالفه زفر لأن البقاء على حسب الثبوت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7931}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7932} ويعد المالكية من صور الفساد اشتراط مشاورة من لا يعلم رأيه إلا بعد انقضاء المدة، واشتراط مدة تزيد كثيرا على مدة السلعة، أما الزيادة اليسيرة فلا تضر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7932} الخيار المطلق عن المدة: للمذاهب أربعة اتجاهات. الأول بطلان العقد أو فساده: قال به الشافعية والحنابلة في إحدى الروايتين، والحنفية بفساد العقد دون تفريق بين الجهالة المتفاحشة والمتقاربة، ويصير العقد صحيحا عند أبي حنيفة وصاحبيه إن زال المفسد في الأيام الثلاثة، وعند الصاحبين وحدهما ولو بعدها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7932}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933} الثاني بطلان الشرط دون العقد: رواية لأحمد ومذهب ابن أبي ليلى. الثالث صحة العقد وتعديل الشرط: يحدد القاضي المدة المألوفة لاختبار مثل السلعة عند مالك، ويرى ابن تيمية أن يثبت ثلاثة أيام إن أطلقاه. الرابع صحة العقد وبقاء الشرط على إطلاقه، وهو مذهب ابن شبرمة وقول لأحمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7932}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933} تأبيد الخيار شرط مفسد، كقوله «أبدا» أو «أياما» لا محددة. والتوقيت بوقت مجهول مفسد، سواء كانت الجهالة متفاحشة كهبوب الرياح ومجيء المطر وموت فلان ووضع الحامل، أو متقاربة كالحصاد والدياس وقدوم الحاج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933} شريطة الاتصال: تبدأ مدة الخيار من فور إبرام العقد، فلو شرطاه من آخر الشهر أو من الغد فسد العقد عند الحنفية والشافعية والحنابلة، لكن الحنفية يصححونه بحمل المدة الفاصلة عليها، كخيار يومين بعد رمضان في عقد وقع آخره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7934} شريطة الموالاة: تتابع أجزاء المدة، فلو جعل يوما يثبت ويوما لا يثبت ففيه عند الحنابلة وجهان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7934} تعيين مستحق الخيار: لا يصح أن يكون مجهولا، فلو جعلاه لأحدهما لا بعينه أو لمن يشاء أحدهما فباطل عند ابن قدامة، والأصح عند النووي صحة البيع إن شرط الخيار لأحدهما دون الآخر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7934}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7935} العقود التي يدخلها خيار الشرط هي العقود اللازمة القابلة للفسخ؛ والبيع هو الميدان الأساسي له ويدخل البيع الفاسد وبيع المرابحة وأشباهها. وتستثنى السلم والصرف وبيع الربوي بجنسه عند جمهور الحنابلة لاشتراط قبض العوض فيها، وقد نبه ابن عابدين على أن استثناء السلم والصرف مخل بالضابط، والمالكية يجيزونه في السلم إلى أجل قصير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7935} الإجارة: يجري الخيار فيها عند الحنفية والمالكية، ويقيده الشافعية والحنابلة بالإجارة في الذمة أو المعينة لمدة غير تالية للعقد. والحوالة: يقبلها الحنفية، ولا يقبلها الشافعية والحنابلة لأنها ليست مبنية على المغابنة. والقسمة: يختلف فيها؛ قسمة الأجناس المختلفة تراض لا إجبار فيها، وقسمة الجنس الواحد من القيميات يدخلها الخيار على الصحيح. والكفالة: يدخلها عند الحنفية، ويجوز فيها عند أبي حنيفة أكثر من ثلاثة أيام لأنها مبنية على التوسع. والوقف: يجري فيه عند أبي يوسف دون محمد والشافعي وأحمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7935}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7936} الخيار للمتعاقدين أو لأحدهما: يصح اشتراطه لأي منهما أو لكليهما، وهو قول الجمهور، وروي عن الثوري وابن شبرمة أنه للمشتري وحده. ويصح اشتراطه لأجنبي عن العقد، وهو موضع اتفاق عند الفقهاء بشرط أن يكون ممن يصح قوله، ومستند الحنفية الاستحسان لحاجة المتعاقد قليل الخبرة إلى من يفوض إليه الرأي، وخالف زفر لأن الخيار من مقتضيات العقد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7936}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7937}'
  en: 'The option of stipulation (khiyar al-shart) is a compound name for the right, set by stipulation, of one party to choose between confirming and annulling; Ibn Arafa defines it as a sale whose conclusion is held back for a confirmation expected. Other names: the stipulated option (distinguished from the legal option, such as defect), the option of deliberation, and the sale of option. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7923}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7924} Its lawfulness: most jurists hold it lawful and not contrary to the contract, on the report of Ibn Umar and of Habban ibn Munqidh ("when you sell, say: no deceit" and "you have the option three nights"); al-Nawawi and Ibn al-Humam report agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7924}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7925} Wording: no fixed words; any word that conveys the option (consent, will) is enough, and custom counts for the Malikis, as when people have long bargained with an option in a certain sale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7925}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7926} Conditions: it must be stipulated in the contract or its session in the Shafii and Hanbali view; the Hanafis allow it to be added later as if at the contract; it must be limited by a known term, since an unlimited option causes gross ignorance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7926}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7927}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7927}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928} Term: the least is not fixed and may be a moment; for the greatest, Ahmad, Muhammad al-Shaybani, Abu Yusuf and others allow any term by agreement, while Ibn Abi Layla, Ibn Shubruma and others too; Ahmad says he dislikes a long term, and the author of Ghayat al-Muntaha finds a term far beyond custom (such as a thousand years) invalid; Malik limits it by need and what is usual for the sale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7929} Purpose: to let the party consider and test the thing; the term under the Malikis is measured by what the thing needs to be tested and consulted about. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7929} Term for land: the outer limit is one month plus six days, so the option may run up to thirty-six days; two further days are added so that the buyer, still holding the thing at the end of the term, can return it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7930} Animals: if the option is to learn their food, strength and price, the limit is three days; if to test them within the town, one day or so; outside it, a barid (half a day''s march) according to Ibn al-Qasim and two barids according to Ashhab. Clothes, goods and fungibles: three days plus one day. Fruit and vegetables: the term is set by what testing needs before they change. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7930} The third view fixes three days with their nights for any subject, and forbids more. It is the view of Abu Hanifa, Zufar and (in the better-known report) al-Shafii. The sources are the report of Habban ibn Munqidh and the hadith of the sheep with its udder held full (musarrah): whoever buys a sheep so held has the option for three days, as al-Shafii argued. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7930}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7931} Beyond three days: for Abu Hanifa and Zufar the contract is void as fasid; for al-Shafii it is void as batil. Abu Hanifa alone holds that dropping the excess makes the contract valid, as long as the three days have not passed; Zufar disagrees, since continuation follows the original validity. The Malikis add that the term is faulty if it is to consult someone whose view is known only after it ends, or if it greatly exceeds the life of the goods; one extra day does no harm. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7931}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7932} An option with no term has four views. (1) The contract is void or invalid: al-Shafii and, in one report, Ahmad; the Hanafis hold the sale invalid without distinguishing gross from small uncertainty. Abu Hanifa and his companions hold that if the defect is removed within the three days the contract becomes valid; the two companions hold it valid even after three days. (2) The condition is void but the contract stands: one report of Ahmad, and Ibn Abi Layla. (3) The contract stands and the term is set: Malik lets the judge fix the usual term for testing such goods; Ibn Taymiyya suggests three days if they gave none. (4) The contract stands and the option stays open as it arose, the view of Ibn Shubruma and one report of Ahmad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7932}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933} Permanent option: a condition that makes the option last forever (or for unstated days) invalidates it. Unknown term: invalid, whether the uncertainty is gross (wind, rain, a person''s arrival or death, the birth of a pregnant animal) or slight (harvest, threshing, the return of pilgrims). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933} Connection: the term must start at the contract. If the term is set to begin later (from the end of the month or tomorrow) the sale is void for the Hanafis, Shafiis and Hanbalis; the Hanafis rescue it by counting the gap within the term, as in an option of two days after Ramadan in a contract made at the end of Ramadan. Continuity: the parts of the term must follow one another; for a day held and a day not, the Hanbalis have two views. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7934} Holder: the option holder must be named. If the parties give it to one of them without naming which, or to whomever one of them chooses, it is void according to Ibn Qudama; al-Nawawi holds the sale valid if the option is for one party only. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7934}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7935} Contracts: the option belongs only to binding contracts that can be rescinded. Sale is its main field, including sale of trust such as murabaha. The exceptions are salam, exchange of money (sarf) and exchange of ribawi goods of the same kind, for which some Hanbalis require the price to be received in the session; Ibn Abidin notes that excluding salam and sarf strains the rule, and the Malikis allow it in short salam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7935} Other contracts: leasing takes the option in general for Hanafis and Malikis; Shafiis and Hanbalis allow it only in leases on the debt, or in fixed leases whose term does not begin at once. Transfer of debt (hawala): accepted by the Hanafis, refused by the Shafiis and Hanbalis as it is not built on exchange. Division: divided; division of different kinds is by consent, division of the same kind of values takes the option. Guarantee (kafala): the Hanafis allow it, and Abu Hanifa allows more than three days because it is built on latitude. Waqf: allowed by Abu Yusuf, void for Muhammad, and in the Shafii and Hanbali view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7935}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7936} Who may stipulate: the option may be given to either party or to both, the view of most jurists; al-Thawri and Ibn Shubruma limited it to the buyer. It may be given to a third party: the jurists agree this is sound if the third party can speak for himself. The Hanafis base this on juristic preference (istihsan), because a party with little experience may need someone wiser; Zufar objected because the option is part of the contract. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7936}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7937}'
  ur: 'خیار الشرط: ایک مرکب نام، جو شرط سے ثابت ہونے والا وہ اختیار ہے جو کسی ایک عاقد کو عقد کو برقرار رکھنے یا فسخ کرنے کے درمیان حاصل ہو؛ ابن عرفہ (مالکی) اسے ایسی بیع قرار دیتے ہیں جس کا پکا ہونا کسی متوقع اجازت پر موقوف ہو۔ دوسرے نام: خیار شرطی (حکمی جیسے عیب سے امتیاز کے لیے)، خیار تروّی، بیع الخیار۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7923}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7924} جواز: جمہور اسے عقد کے منافی نہ ہونے کی بنا پر جائز مانتے ہیں، ابن عمر اور حبان بن منقذ کی حدیث «إذا بعت فقل لا خلابة» اور «أنت بالخيار ثلاث ليال» سے استدلال؛ نووی اور ابن الہمام اس پر اجماع نقل کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7924}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7925} الفاظ: کوئی معین لفظ ضروری نہیں، رضا یا مشیئت جیسے کسی بھی لفظ سے ہو سکتا ہے؛ مالکیہ کے نزدیک عرف بھی کافی، جیسے کسی مخصوص سامان میں لوگوں کا خیار رکھنا معروف ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7925}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7926} شرائط: شافعیہ اور حنابلہ کے نزدیک عقد میں یا مجلس میں شرط ہو؛ حنفیہ بعد میں شامل کرنے کو عقد میں شامل کرنے کی طرح جائز کہتے ہیں؛ جمہور کے نزدیک مدت معلوم ہو کیونکہ غیر مقررہ خیار بڑی جہالت پیدا کرتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7926}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7927}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7927}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928} مدت: کم از کم کی کوئی حد نہیں، ایک لمحہ بھی؛ زیادہ سے زیادہ: احمد، محمد بن حسن، ابو یوسف وغیرہ باہمی رضامندی سے کوئی بھی مدت جائز مانتے ہیں؛ احمد لمبی مدت کو پسند نہیں کرتے، اور غایۃ المنتہی کے مصنف عادت سے بہت زائد مدت (جیسے ہزار سال) کو درست نہیں کہتے؛ مالک ضرورت اور سامان کے عرف کے مطابق مقید کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7929} غرض: عاقد کو غور و فکر اور آزمائش کا موقع دینا؛ مالکیہ کے نزدیک مدت اتنی ہو جتنی آزمائش اور مشورے کے لیے درکار ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7929} عقار میں مدت: زیادہ سے زیادہ ایک ماہ، اور اس کے ساتھ چھ دن، یعنی چھتیس دن تک خیار بڑھایا جا سکتا ہے؛ دو دن اس لیے ملائے جاتے ہیں کہ مدت ختم ہونے پر اگر مبیع خریدار کے ہاتھ میں ہو تو وہ واپس کر سکے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7930} جانور: اگر خیار ان کی خوراک، طاقت اور قیمت جاننے کے لیے ہو تو زیادہ سے زیادہ تین دن، شہر کے اندر آزمائش ہو تو ایک دن یا اس کے قریب، اور شہر سے باہر ابن القاسم کے نزدیک ایک بَرِید اور اشہب کے نزدیک دو بَرِید (بَرِید: آدھے دن کی مسافت)۔ کپڑے، عروض اور مثلیات: تین دن اور ایک دن۔ پھل اور سبزیاں: اتنی مدت جتنی آزمائش کے لیے درکار ہو، قبل اس کے کہ وہ بدل جائیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7930} تیسرا اتجاہ: ہر معقود علیہ کے لیے تین دن بمع راتوں کے مقرر کرتا ہے اور اس سے زیادہ کو ممنوع کہتا ہے؛ یہ ابو حنیفہ، زفر اور امام شافعی کا مشہور قول ہے۔ ان کی دلیل حبان بن منقذ کی حدیث اور مصراۃ والی حدیث «من اشترى شاة محفلة فهو بخير النظرين ثلاثة أيام» ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7930}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7931} تین دن سے زیادہ: ابو حنیفہ اور زفر کے نزدیک عقد فاسد ہے، شافعی کے نزدیک باطل۔ صرف ابو حنیفہ کے نزدیک زائد حصہ ساقط کر دینے سے عقد درست ہو جاتا ہے جب تک تین دن نہ گزریں؛ زفر اختلاف کرتے ہیں۔ مالکیہ کے نزدیک فساد کی صورتیں یہ ہیں: ایسے شخص سے مشورہ جس کی رائے مدت گزرنے کے بعد ہی معلوم ہو، یا مدت سامان کی مدت سے بہت زیادہ ہو؛ ایک دن زائد ہو تو نقصان نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7931}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7932} غیر محدود خیار کے چار اتجاہات ہیں: (1) عقد باطل یا فاسد: شافعیہ اور حنابلہ کی ایک روایت اور حنفیہ کے نزدیک عقد فاسد۔ ابو حنیفہ اور ان کے دونوں شاگرد کہتے ہیں کہ اگر تین دن میں خرابی دور ہو جائے تو عقد درست ہو جاتا ہے، اور صاحبین کے نزدیک تین دن کے بعد بھی۔ (2) شرط باطل، عقد برقرار: احمد کی ایک روایت اور ابن ابی لیلیٰ۔ (3) عقد برقرار، شرط میں تعدیل: مالک کے نزدیک قاضی عادت کی مدت مقرر کرے؛ ابن تیمیہ کے نزدیک مدت نہ ہو تو تین دن۔ (4) عقد اور شرط دونوں برقرار: ابن شبرمہ اور احمد کا ایک قول۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7932}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933} ہمیشہ کے لیے خیار (تابید) مفسد ہے، جیسے «أبدا» یا غیر متعین «أياما» کہنا۔ نامعلوم وقت پر توقیت بھی مفسد ہے، خواہ جہالت فاحش ہو (ہوا، بارش، کسی کی آمد یا موت، حاملہ جانور کا بچہ جننا) یا قریبی ہو (فصل کٹنا، گہائی، حاجیوں کی واپسی)۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933} اتصال کی شرط: مدت عقد کے فوراً بعد شروع ہو؛ اگر آخرِ ماہ یا کل سے شروع کی جائے تو حنفیہ، شافعیہ اور حنابلہ کے نزدیک عقد فاسد ہے، مگر حنفیہ اسے فاصلے کی مدت کو شامل مان کر درست کرتے ہیں (رمضان کے آخر میں عقد اور رمضان کے بعد دو دن کا خیار)۔ موالاۃ: مدت کے اجزا پے در پے ہوں؛ ایک دن ثابت اور ایک دن غیر ثابت ہو تو حنابلہ کے دو وجوہ ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7934} صاحبِ خیار کا تعین: یہ مجہول نہیں ہو سکتا۔ اگر فریقین نے خیار دونوں میں سے کسی ایک کو بلا تعیین دیا، یا اسے جسے ایک فریق چاہے، تو ابن قدامہ کے نزدیک باطل ہے؛ نووی کے نزدیک اگر خیار صرف ایک فریق کو دیا جائے تو بیع صحیح ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7934}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7935} عقود: خیار صرف لازم اور قابل فسخ عقود میں ہوتا ہے؛ بیع اس کا اصل میدان ہے، بیع فاسد اور مرابحہ جیسی امانت کی بیع بھی اس میں شامل ہیں۔ سلم، صرف اور ربوی کی جنس کے ساتھ بیع جمہور حنابلہ کے نزدیک مستثنیٰ ہیں کیونکہ ان میں عوض پر قبضہ شرط ہے؛ ابن عابدین کہتے ہیں کہ سلم اور صرف کا استثنا قاعدے کو متاثر کرتا ہے، اور مالکیہ مختصر مدت کے سلم میں اسے جائز کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7935} دیگر عقود: اجارہ میں حنفیہ اور مالکیہ کے نزدیک خیار عام ہے، شافعیہ اور حنابلہ اسے ذمہ کی اجارت یا ایسی معین اجارت تک محدود کرتے ہیں جس کی مدت فوراً شروع نہ ہو۔ حوالہ: حنفیہ قبول کرتے ہیں، شافعیہ اور حنابلہ نہیں کیونکہ وہ مغابنہ پر مبنی نہیں۔ قسمت: اختلاف ہے؛ مختلف الاجناس کی تقسیم رضامندی سے ہوتی ہے، ایک جنس کی قیمی اشیا کی تقسیم میں خیار صحیح ہے۔ کفالہ: حنفیہ کے نزدیک داخل ہے اور ابو حنیفہ کے نزدیک تین دن سے زیادہ جائز ہے کیونکہ یہ وسعت پر مبنی ہے۔ وقف: ابو یوسف کے نزدیک جائز، محمد، شافعی اور احمد کے نزدیک نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7935}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7936} خیار کس کو دیا جائے: دونوں عاقدین کو یا ایک کو دیا جا سکتا ہے، جمہور کا یہی قول ہے؛ ثوری اور ابن شبرمہ کے نزدیک صرف خریدار کے لیے ہے۔ کسی اجنبی کو دینا جائز ہے، فقہاء اس پر متفق ہیں بشرطیکہ وہ خود بات کرنے کا اہل ہو؛ حنفیہ کی دلیل استحسان ہے کیونکہ کم تجربہ کار عاقد کو ایسے شخص کی ضرورت ہوتی ہے جو زیادہ بصیرت رکھتا ہو، زفر نے اعتراض کیا کیونکہ خیار عقد کے تقاضوں میں سے ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7936}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7937}'
