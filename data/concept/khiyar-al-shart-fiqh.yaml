id: concept/khiyar-al-shart-fiqh
class: concept
kind: legal
label:
  ar: خيار الشرط
  en: Khiyar al-shart (option of stipulation)
  ur: خیار الشرط
  es: "Khiyar al-shart (opción de estipulación)"
  fr: "Khiyar al-shart (option de stipulation)"
  tr: "Koşul seçeneği"
  id: "Opsi kondisi"
summary:
  ar: 'خيار الشرط اسم مركب على ما يثبت بالاشتراط لأحد المتعاقدين من الاختيار بين الإمضاء والفسخ؛ وعرفه ابن عرفة من المالكية بأنه بيع وقف بتّه أولا على إمضاء يتوقع. وأسماؤه: الخيار الشرطي ⁦(تمييزا عن الحكمي كخيار العيب)⁩، وخيار التروي، وبيع الخيار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7923}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7924} مشروعيته: جمهور الفقهاء يعتبرونه مشروعا لا ينافي العقد، بحديث ابن عمر وحبان بن منقذ «إذا بعت فقل لا خلابة» و«أنت بالخيار ثلاث ليال»، وبالإجماع عند النووي وابن الهمام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7924}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7925} صيغته: لا يتطلب لفظا معينا، فيكفي كل لفظ يدل على الخيار كالرضا أو المشيئة، وقد يثبت بالعرف عند المالكية كما لو تعارف الناس على الخيار في سلعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7925}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7926} شرائط قيامه: أن يكون مقارنا للعقد أو في مجلسه عند الشافعية والحنابلة؛ والحنفية يرون إلحاقه بعد العقد كإدخاله فيه؛ وأن يكون مؤقتا بمدة معلومة عند الجمهور، لأن الخيار المطلق يورث الجهالة الفاحشة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7926}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7927}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7927}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928} المدة: حدها الأدنى غير مقدر فيجوز ولو لحظة؛ وحدها الأقصى: مذهب أحمد ومحمد بن الحسن وأبي يوسف وغيرهم جواز أي مدة بالتفويض، ويستوجه صاحب غاية المنتهى المنع في المدة الخارجة عن العادة؛ ومالك يقيدها بقدر الحاجة والمعتاد بحسب المبيع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7929} الغرض من الخيار: تمكين المتعاقد من التأمل والتجربة، وتلبي حاجة الناس إلى المشورة والاختبار؛ ومدة الخيار عند المالكية بقدر ما يختبر فيه المبيع ويستشار فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7929} مدة الخيار في العقار: أقصاها شهر، ويلحق به ستة أيام، فأقصى ما يجوز مد الخيار إليه ستة وثلاثون يوما؛ ويلحق اليومان بالمدة لتمكين المشتري من الرد إذا كان المبيع في يده عند انتهائها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7930} الدواب: إن كان الخيار لمعرفة قوتها وأكلها وسعرها فأقصاه ثلاثة أيام، وإن كان للاختبار داخل البلد فيوم أو نحوه، وخارجه بريد عند ابن القاسم وبريدان عند أشهب ⁦(والبريد: مسافة نصف يوم سيرا)⁩؛ وبقية الأشياء من الثياب والعروض والمثليات أقصاها ثلاثة أيام ويلحق بها يوم، أما الخضر والفواكه فتقدر مدتها بقدر حاجة الاختبار قبل أن تتغير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7930} الاتجاه الثالث يحدد الخيار بثلاثة أيام بلياليها أيا كان المعقود عليه، ويمنع المجاوزة، وهو مذهب أبي حنيفة وزفر والشافعي في المشهور عنه، واحتجوا بحديث حبان بن منقذ وبحديث المصراة «من اشترى شاة محفلة فهو بخير النظرين ثلاثة أيام»، وقال الشافعي إنه لما ثبت الخيار بالنص وقف عند الثلاث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7930}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7931} الزيادة على الثلاث: عند أبي حنيفة وزفر العقد فاسد، وعند الشافعي باطل؛ وينفرد أبو حنيفة بأن إسقاط الزيادة يصحح العقد ما لم تمض الأيام الثلاثة، ويخالفه زفر لأن البقاء على حسب الثبوت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7931}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7932} ويعد المالكية من صور الفساد اشتراط مشاورة من لا يعلم رأيه إلا بعد انقضاء المدة، واشتراط مدة تزيد كثيرا على مدة السلعة، أما الزيادة اليسيرة فلا تضر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7932} الخيار المطلق عن المدة: للمذاهب أربعة اتجاهات. الأول بطلان العقد أو فساده: قال به الشافعية والحنابلة في إحدى الروايتين، والحنفية بفساد العقد دون تفريق بين الجهالة المتفاحشة والمتقاربة، ويصير العقد صحيحا عند أبي حنيفة وصاحبيه إن زال المفسد في الأيام الثلاثة، وعند الصاحبين وحدهما ولو بعدها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7932}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933} الثاني بطلان الشرط دون العقد: رواية لأحمد ومذهب ابن أبي ليلى. الثالث صحة العقد وتعديل الشرط: يحدد القاضي المدة المألوفة لاختبار مثل السلعة عند مالك، ويرى ابن تيمية أن يثبت ثلاثة أيام إن أطلقاه. الرابع صحة العقد وبقاء الشرط على إطلاقه، وهو مذهب ابن شبرمة وقول لأحمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7932}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933} تأبيد الخيار شرط مفسد، كقوله «أبدا» أو «أياما» لا محددة. والتوقيت بوقت مجهول مفسد، سواء كانت الجهالة متفاحشة كهبوب الرياح ومجيء المطر وموت فلان ووضع الحامل، أو متقاربة كالحصاد والدياس وقدوم الحاج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933} شريطة الاتصال: تبدأ مدة الخيار من فور إبرام العقد، فلو شرطاه من آخر الشهر أو من الغد فسد العقد عند الحنفية والشافعية والحنابلة، لكن الحنفية يصححونه بحمل المدة الفاصلة عليها، كخيار يومين بعد رمضان في عقد وقع آخره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7934} شريطة الموالاة: تتابع أجزاء المدة، فلو جعل يوما يثبت ويوما لا يثبت ففيه عند الحنابلة وجهان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7934} تعيين مستحق الخيار: لا يصح أن يكون مجهولا، فلو جعلاه لأحدهما لا بعينه أو لمن يشاء أحدهما فباطل عند ابن قدامة، والأصح عند النووي صحة البيع إن شرط الخيار لأحدهما دون الآخر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7934}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7935} العقود التي يدخلها خيار الشرط هي العقود اللازمة القابلة للفسخ؛ والبيع هو الميدان الأساسي له ويدخل البيع الفاسد وبيع المرابحة وأشباهها. وتستثنى السلم والصرف وبيع الربوي بجنسه عند جمهور الحنابلة لاشتراط قبض العوض فيها، وقد نبه ابن عابدين على أن استثناء السلم والصرف مخل بالضابط، والمالكية يجيزونه في السلم إلى أجل قصير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7935} الإجارة: يجري الخيار فيها عند الحنفية والمالكية، ويقيده الشافعية والحنابلة بالإجارة في الذمة أو المعينة لمدة غير تالية للعقد. والحوالة: يقبلها الحنفية، ولا يقبلها الشافعية والحنابلة لأنها ليست مبنية على المغابنة. والقسمة: يختلف فيها؛ قسمة الأجناس المختلفة تراض لا إجبار فيها، وقسمة الجنس الواحد من القيميات يدخلها الخيار على الصحيح. والكفالة: يدخلها عند الحنفية، ويجوز فيها عند أبي حنيفة أكثر من ثلاثة أيام لأنها مبنية على التوسع. والوقف: يجري فيه عند أبي يوسف دون محمد والشافعي وأحمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7935}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7936} الخيار للمتعاقدين أو لأحدهما: يصح اشتراطه لأي منهما أو لكليهما، وهو قول الجمهور، وروي عن الثوري وابن شبرمة أنه للمشتري وحده. ويصح اشتراطه لأجنبي عن العقد، وهو موضع اتفاق عند الفقهاء بشرط أن يكون ممن يصح قوله، ومستند الحنفية الاستحسان لحاجة المتعاقد قليل الخبرة إلى من يفوض إليه الرأي، وخالف زفر لأن الخيار من مقتضيات العقد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7936}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7937} الخيار للأجنبي وصيغة الاستشارة: عند المالكية إن قال «على مشورة فلان» كان لكل من العاقد والمستشار الاستقلال بالإمضاء أو الرد، لأن المشورة لا تلزم الموافقة؛ أما إن قال «على خيار فلان» أو «رضاه» فالمعتمد أنه تفويض لا توكيل، فلا يستقل العاقد بالإبرام أو الفسخ، وتلحق بهذين اللفظين المشورة المقيدة بما يدنو بها إليهما، كأن يقول «إن شاء أمضى وإن شاء رد». وعند الشافعية يصح الخيار للأجنبي تفويضا أو تحكيما لا توكيلا، وهو الأصح عندهم، وقال أبو يعلى إن الخيار لا يصح حينئذ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7938} شرط الاستئمار أو الاستشارة: عند الشافعية اتجاهان، أحدهما أن العاقد لا يفسخ حتى يقول إنه استأمر فأمره بالفسخ، والثاني للحنابلة أن الاستئمار غير لازم، وصححه النووي. ويجب تعيين من يستشار، فلو قال «على أن أشاور» من غير تعيين لم يكف، وقال الأذرعي إن الظاهر الكفاية. ولم يجد الباحث نصا للحنفية في المسألة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7938}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7939} النيابة في الخيار: يثبت الخيار لمن يشترطه لنفسه أيا كانت صفته، مالكا كان أو وصيا أو وليا أو وكيلا؛ فاشتراط الخيار في الولاية والوصاية نظر للصغير، وفي الوكالة يشمل الإطلاق بالأمر بالعقد ما فيه الخيار، كما يملك المضارب والشريك شركة عنان أو مفاوضة شرط الخيار بإطلاق عقد الشركة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7939} الوكيل عند الشافعية: يصح شرط الوكيل الخيار لنفسه أو لموكله، ويمنع الوكيل بالبيع أن يشترط الخيار للمشتري، والوكيل بالشراء أن يشترطه للبائع، فإن فعل بطل العقد ما لم يأذن الموكل؛ والأصح أن الخيار لا يتعدى من شرط له. والحنابلة مثلهم في صحة شرط الوكيل لنفسه، ويجب على الوكيل أن يفعل ما فيه حظ موكله لأنه مؤتمن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7939}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7940} تعدد الأطراف: كما يثبت الخيار لصاحبه منفردا إذا كان العاقد واحدا، يثبت للمتعدد إذا تعدد الطرف المتعاقد، كشريكين باعا شيئا أو مالك باع سلعة لاثنين واشترطا الخيار لهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7940} أثر الخيار على حكم العقد: يمنع الخيار ثبوت حكم العقد للحال في حق صاحب الخيار، وهذا متفق عليه بين أبي حنيفة وصاحبيه، وهو عند أبي حنيفة في حق العاقد الآخر أيضا؛ وقال الصاحبان ينفذ الحكم في حق من لا خيار له. وتوقف الحكم عند الكاساني بمعنى أنه لا يعرف للحال حتى يسقط الخيار. وعند الشافعية موقوف لا يحكم بانتقاله للمشتري ولا للبائع حتى ينقضي الخيار، وعند المالكية ملكية المحل باقية للبائع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7940}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7941} أثر الخيار على انتقال الملك: إذا كان الخيار لهما فعند الحنفية لا يخرج المبيع من ملك البائع ولا الثمن من ملك المشتري، والشافعية يقفون الملك حتى ينقضي الخيار، والحنابلة ينقلون الملك إلى المشتري بالعقد. وإذا كان الخيار لأحدهما: المالكية يبقون الملك للبائع والإمضاء ناقل، وقول عندهم أن الملك للمشتري، وعن أحمد الوقف؛ وإن كان الخيار للبائع فالملك له ويتصرف المشتري دون ملك، وتصرف البائع نافذ ويعد فسخا، وإن كان الخيار للمشتري زال الملك عن البائع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7941}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7942} ضمان محل الخيار عند الحنفية: إن كان الخيار للبائع وهلك المحل في يده قبل القبض فالضمان عليه؛ وإن هلك في يد المشتري بعد القبض وانقضاء الخيار فالضمان منه بالثمن؛ وإن هلك في يده قبل انقضاء خيار البائع فالضمان عليه بالقيمة لأنه مقبوض على جهة العقد؛ وإن كان الخيار للمشتري وهلك في يده فالضمان عليه بالثمن لأن الهلاك بمثابة عيب آل إلى تلف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7942}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7943} ضمان محل الخيار عند الآخرين: عند المالكية الضمان على البائع، إلا إذا تلف محل مما يغاب عليه ولم تثبت بينة بتلفه، فالضمان على المشتري؛ وعند الشافعية إن تلف المبيع بآفة سماوية بعد القبض والخيار للبائع انفسخ البيع، وإن كان الخيار للمشتري لم ينفسخ لدخوله في ضمانه بالقبض؛ وعند الحنابلة الملك للمشتري والضمان عليه، إلا أن المكيل والموزون لا يصير ضمانه عليه إلا بالاكتيال أو الوزن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7944}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7945} الزوائد في محل الخيار: قسم الحنفية الزيادة إلى أربعة أنواع: متصلة متولدة من الأصل كالسمن والبرء والنضج، ومتصلة غير متولدة كالصبغ والخياطة والبناء والغرس، ومنفصلة متولدة كالولد والثمر واللبن والبيض والصوف، ومنفصلة غير متولدة كغلة المأجور وأرش الجناية والعقر. وغير الحنفية يكتفون بتقسيم الزيادة إلى متصلة ومنفصلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7946} حكم الزيادة عند الحنفية: الأصل أنها تمنع الرد، فيلزم العقد وتكون الزوائد للمشتري، إلا المنفصلة غير المتولدة فلا تمنع الرد باتفاق، والمتصلة المتولدة فيها خلاف. فإذا اختار الفسخ في المنفصلة غير المتولدة رد أبو حنيفة الأصل مع الزوائد لأن الملك كان موقوفا، وقال الصاحبان إن الزوائد للمشتري. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7946}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7947} الزيادة المتصلة المتولدة: قال أبو حنيفة وأبو يوسف إنها تسقط الخيار ويملك صاحبه الأصل والزيادة، وقال محمد لا يبطل الخيار وله الإمضاء أو الفسخ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7947} الزوائد عند المالكية: الولد والصوف يكونان للمشتري لأنهما كجزء باق من المبيع، وما عداهما للبائع، كاللبن والسمن والبيض وأرش الجناية، لأن الملك زمن الخيار يبقى للبائع حتى يستعمل صاحب الخيار خياره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7947} الزوائد عند الشافعية: المنفصلة زمن الخيار تكون لمن له الملك، فإن كان الخيار لهما فهي موقوفة كحكم المبيع، والمتصلة تتبع الأصل، والحمل الموجود عند البيع كالأصل. أما الحنابلة فالزوائد كلها للمشتري، متصلها ومنفصلها، ولو كان المبيع في يد البائع قبل القبض، ويستدلون بحديث «الخراج بالضمان». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7947}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7948} تسليم البدلين في مدة الخيار: متفق على أنه لا يجب تسليم البدلين في مدة الخيار عند الإطلاق، فلا يجب على البائع تسليم المبيع ابتداء، ولا على المشتري تسليم الثمن، ما لم تمض المدة أو يسقط صاحب الخيار خياره. والتسليم اختيارا لا يبطل الخيار إن كان على وجه الاختبار، وإن كان على وجه التمليك والخيار للبائع بطل خياره. وإن سلم أحدهما تطوعا وامتنع الآخر فلا يجبر عند أبي حنيفة والشافعية، وللمسلم أن يسترد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7948}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7949} سقوط الخيار قبل استعماله: بالبلوغ في حق الصبي الذي عقد عنه وليه، وبالجنون ونحوه، وبموت صاحب الخيار على خلاف. ويرى أبو يوسف أن بلوغ الصغير صاحب الخيار يسقط الخيار للولي ويلزم العقد، وقال محمد لا يسقط، ثم اختلفت الروايات عنه. وطروء الجنون لا يسقط الخيار في ذاته، بل مضي المدة كلها دون فسخ، فلو أفاق في أثنائها كان على خياره في الأصح عند الحنفية. وعند المالكية إن جن صاحب الخيار ولم يرج إفاقته نظر السلطان فيما هو أصلح له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7949}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7950} ينتهي الخيار بإمضاء العقد أو بمضي مدته دون فسخ، أو بفسخ العقد. فالإمضاء بالإجازة الصريحة أو بالدلالة كالتصرف في المبيع تصرف الملاك من بيع أو هبة أو رهن، ولا يشترط علم العاقد الآخر بالإجازة. ويجوز أن يصالح صاحب الخيار على عوض فيسقط الخيار ويمضي البيع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7951}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7952} موت صاحب الخيار: عند الحنفية والحنابلة يسقط الخيار بموته، وعند المالكية والشافعية يبقى للورثة. أما موت من عليه الخيار فلا يسقط الخيار، بل يبقى لصاحبه ويرد على الورثة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7951} انتهاء الخيار بمضي المدة: متفق عليه في الجملة، لأن الخيار مؤقت، ولزوم العقد هو الأصل، فإذا انقضت المدة ثبت موجب العقد. والمالكية يعدون مضي المدة انتهاء للخيار لا إمضاء، فإن كان المبيع في يد المشتري كان إمضاء، وإن كان في يد البائع كان فسخا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7953} انتهاء الخيار بالفسخ: يكون الفسخ صريحا بالقول كقول «فسخت البيع» أو «رددت الثمن»، أو دلالة بالفعل. والفسخ الفعلي هو التصرف الذي يقتضي الرد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7953} الفسخ بالفعل: يكون فسخا إذا تصرف صاحب الخيار في المبيع تصرف الملاك، أو في الثمن إن كان عينا إذا كان الخيار للمشتري؛ أما الدين فلا يتصور فسخه بالفعل، لأن الأثمان لا تتعين بالتعيين. والعلة أن هذا التصرف دليل استبقاء الملك، واستبقاؤه لا يكون إلا بالفسخ. وقال ابن الهمام والكاساني إن ما يوجد من البائع في المبيع لو وجد منه في الثمن لكان إجازة يكون فسخا للبيع دلالة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7954} من تفاريع الفسخ الدلالي عند الحنفية: الأكل والشرب واللبس يسقط الخيار، وفي فتاوى قاضيخان أن لبسه مرة لا يبطل الخيار؛ النسخ من الكتاب لا يسقطه، ولو درس الكتاب يسقط؛ وركوب الدابة ليسقيها أو يردها أو يعلفها إجازة عند قوم، وأطلق قاضيخان أنه لا يبطل الخيار استحسانا؛ بيع المحل أو هبته أو رهنه مع التسليم يسقط الخيار، ولا ينفسخ بالهبة والرهن دون تسليم؛ الإيجار فسخ ولو لم يسلم عند قوم؛ وأبو بكر بن الفضل يفرق بين التسليم اختبارا فلا يبطل الخيار، والتسليم تمليكا فيبطل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7954}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7955} شروط نفاذ الفسخ: قيام الخيار؛ وعلم العاقد الآخر بالفسخ عند أبي حنيفة ومحمد، فإن جرى دون علمه كان موقوفا ينفذ إن علم به في مدة الخيار، ويلزم العقد إن مضت المدة دون أن يبلغه؛ وأبو يوسف له ثلاثة أقوال، والمشهور عنه عدم اشتراط العلم، ورجحه ابن الهمام. وعدم اشتراط العلم مذهب الجمهور ⁦(المالكية والشافعية والحنابلة)⁩. وأن لا يترتب على الفسخ تفريق الصفقة، فلا يمضى العقد في بعض ويفسخ في بعض، وعند الشافعية الأصح المنع، والمالكية يجبرون على رد الجميع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7955}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7956} انتقال خيار الشرط بالموت: يثبت عند مالك والشافعي أن الخيار ينتقل إلى الوارث، ويعلل بأنه حق ثابت لإصلاح المال كالرهن، ويستدل بحديث «من ترك مالا أو حقا فلورثته»، ولم يوجد تخريج لرواية بلفظ «حقا» فيما اطلع عليه؛ وعند الحنفية لا يورث لأنه صفة شخصية ومشيئة لا تنقل. وقال الحنابلة إن الخيار لا يورث إلا إذا طالب به المورث قبل موته، وهو مذهب ابن قدامة في أن الخيار يبطل بموت صاحبه ويبقى خيار الآخر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7956}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7957} انتقال الخيار بالجنون والإغماء: عند الشافعية لا ينقطع الخيار بطروء الجنون أو الإغماء، بل يقوم الولي أو الحاكم مقامه فيفسخ أو يجيز بما فيه الحظ، ويعين الحاكم نائبا لمن أصابه خرس بلا إشارة مفهومة. وعند المالكية يفرق بين الجنون والإغماء: إن جن صاحب الخيار ولم يرج إفاقته أو طال حتى يضر الآخر ينظر السلطان فيما هو أصلح، والمفيق يمكّن من الفسخ أو الإجازة ونقض فعل القيم إن كان له بينة؛ والمغمى عليه ينتظر إفاقته ليختار لنفسه، فإن أفاق بعد زمن الخيار استؤنف له الأجل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7957}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7958}'
  en: 'The option of stipulation (khiyar al-shart) is a compound name for the right, set by stipulation, of one party to choose between confirming and annulling; Ibn Arafa defines it as a sale whose conclusion is held back for a confirmation expected. Other names: the stipulated option (distinguished from the legal option, such as defect), the option of deliberation, and the sale of option. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7923}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7924} Its lawfulness: most jurists hold it lawful and not contrary to the contract, on the report of Ibn Umar and of Habban ibn Munqidh ("when you sell, say: no deceit" and "you have the option three nights"); al-Nawawi and Ibn al-Humam report agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7924}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7925} Wording: no fixed words; any word that conveys the option (consent, will) is enough, and custom counts for the Malikis, as when people have long bargained with an option in a certain sale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7925}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7926} Conditions: it must be stipulated in the contract or its session in the Shafii and Hanbali view; the Hanafis allow it to be added later as if at the contract; it must be limited by a known term, since an unlimited option causes gross ignorance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7926}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7927}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7927}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928} Term: the least is not fixed and may be a moment; for the greatest, Ahmad, Muhammad al-Shaybani, Abu Yusuf and others allow any term by agreement, while Ibn Abi Layla, Ibn Shubruma and others too; Ahmad says he dislikes a long term, and the author of Ghayat al-Muntaha finds a term far beyond custom (such as a thousand years) invalid; Malik limits it by need and what is usual for the sale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7929} Purpose: to let the party consider and test the thing; the term under the Malikis is measured by what the thing needs to be tested and consulted about. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7929} Term for land: the outer limit is one month plus six days, so the option may run up to thirty-six days; two further days are added so that the buyer, still holding the thing at the end of the term, can return it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7930} Animals: if the option is to learn their food, strength and price, the limit is three days; if to test them within the town, one day or so; outside it, a barid (half a day''s march) according to Ibn al-Qasim and two barids according to Ashhab. Clothes, goods and fungibles: three days plus one day. Fruit and vegetables: the term is set by what testing needs before they change. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7930} The third view fixes three days with their nights for any subject, and forbids more. It is the view of Abu Hanifa, Zufar and (in the better-known report) al-Shafii. The sources are the report of Habban ibn Munqidh and the hadith of the sheep with its udder held full (musarrah): whoever buys a sheep so held has the option for three days, as al-Shafii argued. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7930}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7931} Beyond three days: for Abu Hanifa and Zufar the contract is void as fasid; for al-Shafii it is void as batil. Abu Hanifa alone holds that dropping the excess makes the contract valid, as long as the three days have not passed; Zufar disagrees, since continuation follows the original validity. The Malikis add that the term is faulty if it is to consult someone whose view is known only after it ends, or if it greatly exceeds the life of the goods; one extra day does no harm. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7931}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7932} An option with no term has four views. (1) The contract is void or invalid: al-Shafii and, in one report, Ahmad; the Hanafis hold the sale invalid without distinguishing gross from small uncertainty. Abu Hanifa and his companions hold that if the defect is removed within the three days the contract becomes valid; the two companions hold it valid even after three days. (2) The condition is void but the contract stands: one report of Ahmad, and Ibn Abi Layla. (3) The contract stands and the term is set: Malik lets the judge fix the usual term for testing such goods; Ibn Taymiyya suggests three days if they gave none. (4) The contract stands and the option stays open as it arose, the view of Ibn Shubruma and one report of Ahmad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7932}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933} Permanent option: a condition that makes the option last forever (or for unstated days) invalidates it. Unknown term: invalid, whether the uncertainty is gross (wind, rain, a person''s arrival or death, the birth of a pregnant animal) or slight (harvest, threshing, the return of pilgrims). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933} Connection: the term must start at the contract. If the term is set to begin later (from the end of the month or tomorrow) the sale is void for the Hanafis, Shafiis and Hanbalis; the Hanafis rescue it by counting the gap within the term, as in an option of two days after Ramadan in a contract made at the end of Ramadan. Continuity: the parts of the term must follow one another; for a day held and a day not, the Hanbalis have two views. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7934} Holder: the option holder must be named. If the parties give it to one of them without naming which, or to whomever one of them chooses, it is void according to Ibn Qudama; al-Nawawi holds the sale valid if the option is for one party only. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7934}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7935} Contracts: the option belongs only to binding contracts that can be rescinded. Sale is its main field, including sale of trust such as murabaha. The exceptions are salam, exchange of money (sarf) and exchange of ribawi goods of the same kind, for which some Hanbalis require the price to be received in the session; Ibn Abidin notes that excluding salam and sarf strains the rule, and the Malikis allow it in short salam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7935} Other contracts: leasing takes the option in general for Hanafis and Malikis; Shafiis and Hanbalis allow it only in leases on the debt, or in fixed leases whose term does not begin at once. Transfer of debt (hawala): accepted by the Hanafis, refused by the Shafiis and Hanbalis as it is not built on exchange. Division: divided; division of different kinds is by consent, division of the same kind of values takes the option. Guarantee (kafala): the Hanafis allow it, and Abu Hanifa allows more than three days because it is built on latitude. Waqf: allowed by Abu Yusuf, void for Muhammad, and in the Shafii and Hanbali view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7935}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7936} Who may stipulate: the option may be given to either party or to both, the view of most jurists; al-Thawri and Ibn Shubruma limited it to the buyer. It may be given to a third party: the jurists agree this is sound if the third party can speak for himself. The Hanafis base this on juristic preference (istihsan), because a party with little experience may need someone wiser; Zufar objected because the option is part of the contract. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7936}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7937} A third party as option holder: the Malikis say that if the term reads ''on the advice of so-and-so'', both the contracting party and the adviser may decide alone, since advice does not bind to agreement; if it reads ''on so-and-so''s option'' or ''consent'', the better view is that it is delegation, not agency, and the contracting party cannot decide alone. Words close to these, such as ''if he wills he confirms, if he wills he annuls'', count the same. The Shafiis hold the option for a third party is delegation or arbitration, not agency, and that is their sounder view; Abu Yaala held that it is then invalid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7938} Consultation clause: the Shafiis have two views on whether the party must state he consulted and was told to annul; the Hanbalis do not require it, and al-Nawawi affirmed the first view. The person consulted must be named; ''on my consultation'' without naming him is not enough, though al-Adhra''i thought it sufficient. The Hanafis have no text on the point that the compiler found. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7938}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7939} Agency in the option: the option belongs to the contracting party who stipulates it for himself, whatever his position: owner, guardian, executor, agent, or the partner or mudarib of a company. A guardian or executor may stipulate it for the good of the minor or the ward; an agent acts on the principal''s general instruction to contract, which includes an option. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7939} The agent in the Shafii view: an agent may stipulate the option for himself or for his principal. A selling agent may not give the option to the buyer, nor a buying agent to the seller; if he does, the contract is void unless the principal permits it. The better view is that the option does not pass beyond the party named. The Hanbalis agree that an agent may stipulate it for himself. An agent must act for his principal''s benefit, since he is trusted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7939}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7940} Several parties: as the option holds for a single party, it also holds for several, as when two partners sell a thing or one owner sells to two buyers who stipulate the option for both. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7940} Effect of the option on the contract: it prevents the contract from taking effect in its legal rule for the party holding the option. Abu Hanifa holds this also against the other party; his two companions hold that the rule takes effect for the party without the option. Al-Kasani describes the contract as suspended, not known in its rule until the option ends. The Shafiis treat it as suspended; the Malikis hold the seller keeps ownership of the thing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7940}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7941} Effect on transfer of ownership: with the option for both parties the Hanafis hold that neither price nor thing changes hands, and the Shafiis suspend the transfer until the option ends; the Hanbalis hold that ownership passes to the buyer at the contract. With the option for one party, the Malikis hold that ownership stays with the seller, the sale being a dissolved not a formed contract, and confirmation then transfers it; another Maliki view and one of Ahmad hold the buyer owns it, or that it is suspended. When the seller holds the option, ownership stays with him, the buyer may not dispose of the thing, and the seller''s disposal is an annulment. When the buyer holds it, ownership leaves the seller. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7941}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7942} Liability for loss (Hanafis): when the seller holds the option and the thing perishes before receipt, the seller bears it. When it perishes in the buyer''s hand after receipt and the option has ended, the buyer bears it at the price. When the seller holds it and the buyer had received the thing and it perished during the option, the buyer bears it at value, as with a thing taken for inspection. When the buyer holds the option and it perishes in his hand, he bears it at the price, since loss is a defect that leads to perishing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7942}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7943} Liability for loss in other schools: the Malikis put liability on the seller, except that a movable thing that can be hidden, once lost with no proof, falls on the buyer. The Shafiis hold that if the thing perishes by heavenly cause after receipt and the option is the seller''s, the sale is dissolved; if the option is the buyer''s, the sale is not dissolved. The Hanbalis hold that ownership is the buyer''s and so is liability, except measured and weighed goods, where liability stays with the seller until they are measured or weighed by the buyer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7944}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7945} Increase in the object: the Hanafis divide increase into four kinds: connected and generated from the thing (fat, healing, ripening); connected and not generated (dyeing, sewing, building and planting on the land); separated and generated (offspring, fruit, milk, eggs, wool); and separated and not generated (rent of a hired thing, compensation for injury, and the mahr for intercourse by mistake). Other schools divide increase only into connected and separated. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7946} Ruling on increase in the Hanafi view: the general rule is that increase prevents return, so the contract is binding and the increase goes to the buyer, except that separated non-generated increase never prevents return, while connected generated increase is disputed. If the option is annulled, Abu Hanifa returns the thing with its increase, since ownership was suspended; the two companions hold the increase is the buyer''s. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7946}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7947} Connected generated increase: Abu Hanifa and Abu Yusuf hold that it ends the option and the holder owns both the thing and the increase; Muhammad holds that the option does not end, and the holder may confirm or annul. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7947} Increase in the Maliki view: offspring and wool go to the buyer, as a part of the thing that remains; the rest, such as milk, fat, eggs and compensation for injury, go to the seller, because ownership stays with the seller during the option until the holder uses it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7947} Increase in the Shafii view: separated increase during the option belongs to the one who owns the thing; if the option is for both, it is suspended like the thing itself. Connected increase follows the thing, and a pregnancy present at sale is part of the thing. The Hanbalis give all increase to the buyer, connected or separated, even if the thing is still in the seller''s hand before receipt, citing the hadith «the yield goes with the liability». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7947}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7948} Delivering the two prices during the option: it is agreed that neither side must deliver during the option unless stipulated; the seller need not hand over the thing at once, nor the buyer the price, until the term ends or the holder waives it. Voluntary delivery does not void the option, if it is meant for testing and not for ownership; if the seller delivers the thing as ownership while holding the option, his option ends. If one party delivers voluntarily and the other refuses, Abu Hanifa does not compel the other, and the Shafiis allow the deliverer to take it back. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7948}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7949} Ending the option before use: by the coming of age of a minor for whom a guardian contracted; by madness or the like; or by the death of the holder, which is disputed. Abu Yusuf holds that the minor''s coming of age ends the option for the guardian and binds the contract; Muhammad holds that it does not, and his reports differ. Madness does not end the option in itself, but the lapse of the whole term without a decision does; if the holder recovers in the term, he keeps his option for the rest, in the sounder Hanafi view. The Malikis say that if the holder goes mad and does not recover, the sultan considers what is best for him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7949}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7950} Ending the option by confirmation or by lapse of term: the option ends by confirmation, which may be express (words such as «I confirm the sale», «I have waived the option») or by implied act, such as disposing of the thing as an owner would, by sale, bargaining, lease, gift or pledge. Confirmation need not be known to the other party, and the thing need not still exist if it was fit at the contract. A settlement for money or goods to waive the option is valid, and becomes an increase in the price. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7951}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7952} Death: the Hanafis and Hanbalis hold that the option ends at the death of its holder, whether buyer or seller, and whether he acts himself or through an agent. The Malikis and Shafiis hold that it passes to the heirs. If the obligor dies, the option stays, and its holder may annul against the heirs, as al-Sarakhsi reports. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7951} Lapse of term: agreed in general, since the option is limited to a term and the contract is binding by default; the lapse is taken as confirmation, and the holder''s silence over the term is consent, though Abu Yaala differed. The Malikis treat the lapse as an ending, not a confirmation: if the thing is in the buyer''s hand, it is confirmation; if in the seller''s hand, it is annulment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7953} Ending by annulment: may be express by words, such as «I annul the sale» or «I return the price», or by act, which shows return. An express annulment includes the seller saying he will not sell unless the price is raised, and the buyer saying he will not buy unless it is lowered. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7953} Annulment by act: the option holder annuls when he deals with the thing as its owner would, or with the price if the option is the buyer''s and the price is a specific thing. A debt cannot be annulled by act, since prices are not fixed by being named. The reason is that such dealing shows the holder keeps the ownership, and that can only be kept by annulment. Ibn al-Humam and al-Kasani hold that what the seller does with the thing would, if done with the price, confirm the sale, so it annuls the sale by implication. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7954} Implied annulment in the Hanafi rulings: eating, drinking and wearing end the option (Qadikhan says wearing once does not); copying from a book does not, but erasing it does; riding an animal to water it, return it or feed it is confirmation for some, and Qadikhan says it does not void the option, by juristic preference (istihsan); sale, gift or pledge of the thing with delivery ends it, without delivery not; leasing is an annulment even without delivery, for some; Abu Bakr ibn al-Fadl separates delivery for testing (no annulment) from delivery for ownership (annulment). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7954}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7955} Conditions of valid annulment: the option must still exist. Abu Hanifa and Muhammad require that the other party know of the annulment; if the holder annuls without his knowledge the annulment is suspended, valid if he learns of it within the term, and the contract binds if the term ends unknown to him. Abu Yusuf has three reports, the best known requiring no knowledge; al-Shafii, the Malikis and the Hanbalis agree that knowledge is not required. Annulment must cover the whole deal and not split it; the Malikis compel return of all, and the Shafiis hold that splitting is not allowed in the sounder view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7955}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7956} Transfer of the option at death: Malik and al-Shafii hold the option passes to the heir, since it is a right set to protect the property, like a pledge; the Hanafis say it does not pass, being a personal wish and will that is not transferred. The Hanbalis say it passes only if the holder claimed it before death; Ibn Qudama holds that the option of the dead party lapses, while the other party''s option stays. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7956}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7957} Madness and fainting: for the Shafiis the option does not end on madness or fainting; the guardian or the judge acts for the holder by what is in his interest; a mute with no understood sign has a judge''s agent appointed. For the Malikis, the judge acts when madness is not expected to end, or when it lasts long enough to harm the other party; the sane holder may annul or confirm and overturn the guardian''s acts if he has proof. A person in a faint waits until he recovers; if he recovers after the term, a new term is granted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7957}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7958}'
  ur: 'خیار الشرط: ایک مرکب نام، جو شرط سے ثابت ہونے والا وہ اختیار ہے جو کسی ایک عاقد کو عقد کو برقرار رکھنے یا فسخ کرنے کے درمیان حاصل ہو؛ ابن عرفہ ⁦(مالکی)⁩ اسے ایسی بیع قرار دیتے ہیں جس کا پکا ہونا کسی متوقع اجازت پر موقوف ہو۔ دوسرے نام: خیار شرطی ⁦(حکمی جیسے عیب سے امتیاز کے لیے)⁩، خیار تروّی، بیع الخیار۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7923}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7924} جواز: جمہور اسے عقد کے منافی نہ ہونے کی بنا پر جائز مانتے ہیں، ابن عمر اور حبان بن منقذ کی حدیث «إذا بعت فقل لا خلابة» اور «أنت بالخيار ثلاث ليال» سے استدلال؛ نووی اور ابن الہمام اس پر اجماع نقل کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7924}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7925} الفاظ: کوئی معین لفظ ضروری نہیں، رضا یا مشیئت جیسے کسی بھی لفظ سے ہو سکتا ہے؛ مالکیہ کے نزدیک عرف بھی کافی، جیسے کسی مخصوص سامان میں لوگوں کا خیار رکھنا معروف ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7925}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7926} شرائط: شافعیہ اور حنابلہ کے نزدیک عقد میں یا مجلس میں شرط ہو؛ حنفیہ بعد میں شامل کرنے کو عقد میں شامل کرنے کی طرح جائز کہتے ہیں؛ جمہور کے نزدیک مدت معلوم ہو کیونکہ غیر مقررہ خیار بڑی جہالت پیدا کرتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7926}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7927}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7927}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928} مدت: کم از کم کی کوئی حد نہیں، ایک لمحہ بھی؛ زیادہ سے زیادہ: احمد، محمد بن حسن، ابو یوسف وغیرہ باہمی رضامندی سے کوئی بھی مدت جائز مانتے ہیں؛ احمد لمبی مدت کو پسند نہیں کرتے، اور غایۃ المنتہی کے مصنف عادت سے بہت زائد مدت ⁦(جیسے ہزار سال)⁩ کو درست نہیں کہتے؛ مالک ضرورت اور سامان کے عرف کے مطابق مقید کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7929} غرض: عاقد کو غور و فکر اور آزمائش کا موقع دینا؛ مالکیہ کے نزدیک مدت اتنی ہو جتنی آزمائش اور مشورے کے لیے درکار ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7929} عقار میں مدت: زیادہ سے زیادہ ایک ماہ، اور اس کے ساتھ چھ دن، یعنی چھتیس دن تک خیار بڑھایا جا سکتا ہے؛ دو دن اس لیے ملائے جاتے ہیں کہ مدت ختم ہونے پر اگر مبیع خریدار کے ہاتھ میں ہو تو وہ واپس کر سکے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7930} جانور: اگر خیار ان کی خوراک، طاقت اور قیمت جاننے کے لیے ہو تو زیادہ سے زیادہ تین دن، شہر کے اندر آزمائش ہو تو ایک دن یا اس کے قریب، اور شہر سے باہر ابن القاسم کے نزدیک ایک بَرِید اور اشہب کے نزدیک دو بَرِید ⁦(بَرِید: آدھے دن کی مسافت)⁩۔ کپڑے، عروض اور مثلیات: تین دن اور ایک دن۔ پھل اور سبزیاں: اتنی مدت جتنی آزمائش کے لیے درکار ہو، قبل اس کے کہ وہ بدل جائیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7930} تیسرا اتجاہ: ہر معقود علیہ کے لیے تین دن بمع راتوں کے مقرر کرتا ہے اور اس سے زیادہ کو ممنوع کہتا ہے؛ یہ ابو حنیفہ، زفر اور امام شافعی کا مشہور قول ہے۔ ان کی دلیل حبان بن منقذ کی حدیث اور مصراۃ والی حدیث «من اشترى شاة محفلة فهو بخير النظرين ثلاثة أيام» ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7930}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7931} تین دن سے زیادہ: ابو حنیفہ اور زفر کے نزدیک عقد فاسد ہے، شافعی کے نزدیک باطل۔ صرف ابو حنیفہ کے نزدیک زائد حصہ ساقط کر دینے سے عقد درست ہو جاتا ہے جب تک تین دن نہ گزریں؛ زفر اختلاف کرتے ہیں۔ مالکیہ کے نزدیک فساد کی صورتیں یہ ہیں: ایسے شخص سے مشورہ جس کی رائے مدت گزرنے کے بعد ہی معلوم ہو، یا مدت سامان کی مدت سے بہت زیادہ ہو؛ ایک دن زائد ہو تو نقصان نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7931}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7932} غیر محدود خیار کے چار اتجاہات ہیں: (1) عقد باطل یا فاسد: شافعیہ اور حنابلہ کی ایک روایت اور حنفیہ کے نزدیک عقد فاسد۔ ابو حنیفہ اور ان کے دونوں شاگرد کہتے ہیں کہ اگر تین دن میں خرابی دور ہو جائے تو عقد درست ہو جاتا ہے، اور صاحبین کے نزدیک تین دن کے بعد بھی۔ (2) شرط باطل، عقد برقرار: احمد کی ایک روایت اور ابن ابی لیلیٰ۔ (3) عقد برقرار، شرط میں تعدیل: مالک کے نزدیک قاضی عادت کی مدت مقرر کرے؛ ابن تیمیہ کے نزدیک مدت نہ ہو تو تین دن۔ (4) عقد اور شرط دونوں برقرار: ابن شبرمہ اور احمد کا ایک قول۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7932}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933} ہمیشہ کے لیے خیار ⁦(تابید)⁩ مفسد ہے، جیسے «أبدا» یا غیر متعین «أياما» کہنا۔ نامعلوم وقت پر توقیت بھی مفسد ہے، خواہ جہالت فاحش ہو ⁦(ہوا، بارش، کسی کی آمد یا موت، حاملہ جانور کا بچہ جننا)⁩ یا قریبی ہو ⁦(فصل کٹنا، گہائی، حاجیوں کی واپسی)⁩۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933} اتصال کی شرط: مدت عقد کے فوراً بعد شروع ہو؛ اگر آخرِ ماہ یا کل سے شروع کی جائے تو حنفیہ، شافعیہ اور حنابلہ کے نزدیک عقد فاسد ہے، مگر حنفیہ اسے فاصلے کی مدت کو شامل مان کر درست کرتے ہیں ⁦(رمضان کے آخر میں عقد اور رمضان کے بعد دو دن کا خیار)⁩۔ موالاۃ: مدت کے اجزا پے در پے ہوں؛ ایک دن ثابت اور ایک دن غیر ثابت ہو تو حنابلہ کے دو وجوہ ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7934} صاحبِ خیار کا تعین: یہ مجہول نہیں ہو سکتا۔ اگر فریقین نے خیار دونوں میں سے کسی ایک کو بلا تعیین دیا، یا اسے جسے ایک فریق چاہے، تو ابن قدامہ کے نزدیک باطل ہے؛ نووی کے نزدیک اگر خیار صرف ایک فریق کو دیا جائے تو بیع صحیح ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7934}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7935} عقود: خیار صرف لازم اور قابل فسخ عقود میں ہوتا ہے؛ بیع اس کا اصل میدان ہے، بیع فاسد اور مرابحہ جیسی امانت کی بیع بھی اس میں شامل ہیں۔ سلم، صرف اور ربوی کی جنس کے ساتھ بیع جمہور حنابلہ کے نزدیک مستثنیٰ ہیں کیونکہ ان میں عوض پر قبضہ شرط ہے؛ ابن عابدین کہتے ہیں کہ سلم اور صرف کا استثنا قاعدے کو متاثر کرتا ہے، اور مالکیہ مختصر مدت کے سلم میں اسے جائز کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7935} دیگر عقود: اجارہ میں حنفیہ اور مالکیہ کے نزدیک خیار عام ہے، شافعیہ اور حنابلہ اسے ذمہ کی اجارت یا ایسی معین اجارت تک محدود کرتے ہیں جس کی مدت فوراً شروع نہ ہو۔ حوالہ: حنفیہ قبول کرتے ہیں، شافعیہ اور حنابلہ نہیں کیونکہ وہ مغابنہ پر مبنی نہیں۔ قسمت: اختلاف ہے؛ مختلف الاجناس کی تقسیم رضامندی سے ہوتی ہے، ایک جنس کی قیمی اشیا کی تقسیم میں خیار صحیح ہے۔ کفالہ: حنفیہ کے نزدیک داخل ہے اور ابو حنیفہ کے نزدیک تین دن سے زیادہ جائز ہے کیونکہ یہ وسعت پر مبنی ہے۔ وقف: ابو یوسف کے نزدیک جائز، محمد، شافعی اور احمد کے نزدیک نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7935}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7936} خیار کس کو دیا جائے: دونوں عاقدین کو یا ایک کو دیا جا سکتا ہے، جمہور کا یہی قول ہے؛ ثوری اور ابن شبرمہ کے نزدیک صرف خریدار کے لیے ہے۔ کسی اجنبی کو دینا جائز ہے، فقہاء اس پر متفق ہیں بشرطیکہ وہ خود بات کرنے کا اہل ہو؛ حنفیہ کی دلیل استحسان ہے کیونکہ کم تجربہ کار عاقد کو ایسے شخص کی ضرورت ہوتی ہے جو زیادہ بصیرت رکھتا ہو، زفر نے اعتراض کیا کیونکہ خیار عقد کے تقاضوں میں سے ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7936}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7937} خیار کا اجنبی کے لیے ہونا اور مشورے کا الفاظ: مالکیہ کے نزدیک اگر کہا «على مشورة فلان» تو عاقد اور مشورہ دینے والا دونوں خود ہی امضا یا رد کر سکتے ہیں، کیونکہ مشورہ موافقت کو لازم نہیں کرتا؛ اور اگر کہا «على خيار فلان» یا «رضاه» تو معتمد قول یہ ہے کہ یہ تفویض ہے، توکیل نہیں، اس لیے عاقد خود فسخ یا ابرام نہیں کر سکتا۔ شافعیہ کے نزدیک اجنبی کو خیار دینا تفویض یا تحکیم ہے، توکیل نہیں، اور ابو یعلیٰ کے نزدیک یہ صورت باطل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7938} مشورہ کی شرط: شافعیہ کے دو اتجاہات ہیں: ایک یہ کہ عاقد فسخ نہ کرے جب تک کہہ نہ دے کہ اس نے مشورہ کیا اور اسے فسخ کا حکم ملا؛ دوسرا حنابلہ کا، کہ مشورہ شرط نہیں، اور نووی نے پہلے قول کی تصحیح کی۔ جس سے مشورہ لینا ہو اس کا تعین ضروری ہے؛ «على أن أشاور» بغیر تعیین کافی نہیں، اور اذرعی کے نزدیک کافی ہے۔ حنفیہ کا اس مسئلے میں کوئی نص نہیں ملا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7938}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7939} خیار میں نیابت: خیار اسی عاقد کو حاصل ہوتا ہے جو اسے اپنے لیے شرط کرے، خواہ وہ مالک ہو، وصی ہو، ولی ہو یا وکیل؛ ولایت اور وصایت میں شرط صغیر کی بہتری کے لیے ہوتی ہے، اور وکالت میں عقد کرنے کا مطلق حکم خیار کو بھی شامل ہے؛ مضارب اور شریک عنان یا مفاوضہ بھی عقد شرکت کے اطلاق سے خیار شرط کر سکتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7939} شافعیہ کے نزدیک وکیل: وکیل اپنے لیے یا موکل کے لیے خیار شرط کر سکتا ہے؛ بیع کا وکیل مشتری کے لیے اور خرید کا وکیل بائع کے لیے خیار شرط نہیں کر سکتا، ورنہ عقد باطل ہے جب تک موکل اجازت نہ دے؛ اور اصح یہ ہے کہ خیار اسی کو ملے گا جس کے لیے شرط ہوئی۔ حنابلہ بھی اپنے لیے شرط کرنے کو درست کہتے ہیں، اور وکیل پر لازم ہے کہ موکل کے مفاد میں کام کرے کیونکہ وہ امین ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7939}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7940} متعدد فریق: جس طرح خیار ایک عاقد کو حاصل ہوتا ہے، اسی طرح متعدد فریقوں کو بھی ہو سکتا ہے، جیسے دو شریک کوئی چیز بیچیں یا ایک مالک دو خریداروں کو بیچے اور دونوں کے لیے خیار شرط ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7940} عقد کے حکم پر اثر: خیار صاحبِ خیار کے حق میں عقد کا حکم فوراً ثابت ہونے سے روکتا ہے؛ ابو حنیفہ کے نزدیک یہ دوسرے عاقد کے حق میں بھی ہے، جبکہ صاحبین کے نزدیک بغیر خیار والے کے حق میں حکم نافذ ہوتا ہے۔ کاسانی کے نزدیک عقد موقوف ہے، یعنی حکم اس وقت تک معلوم نہیں جب تک خیار ساقط نہ ہو۔ شافعیہ کے نزدیک بھی موقوف ہے، اور مالکیہ کے نزدیک محلِ خیار کی ملکیت بائع کے پاس باقی رہتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7940}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7941} ملکیت کی منتقلی پر اثر: اگر خیار دونوں کے لیے ہو تو حنفیہ کے نزدیک نہ مبیع بائع کی ملک سے نکلتا ہے اور نہ ثمن مشتری کی ملک سے؛ شافعیہ ملک کو خیار ختم ہونے تک موقوف رکھتے ہیں، اور حنابلہ عقد کے ساتھ ہی ملک مشتری کو منتقل مانتے ہیں۔ اگر خیار ایک کے لیے ہو تو مالکیہ کے نزدیک ملک بائع کے پاس رہتی ہے، امضا ناقل ہے؛ ان کا ایک اور قول ملک مشتری کے لیے ہے، اور احمد سے ایک روایت وقف کی ہے۔ بائع کو خیار ہو تو ملک بائع کی رہتی ہے اور مشتری تصرف نہیں کر سکتا، بائع کا تصرف فسخ شمار ہوتا ہے؛ مشتری کو خیار ہو تو ملک بائع سے زائل ہو جاتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7941}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7942} ضمانِ محلِ خیار ⁦(حنفیہ)⁩: اگر بائع کو خیار ہو اور قبض سے پہلے محل ہلاک ہو جائے تو ضمان بائع پر ہے؛ اگر قبض کے بعد اور خیار ختم ہونے کے بعد مشتری کے ہاتھ میں ہلاک ہو تو ضمان ثمن کے ساتھ مشتری پر ہے؛ اگر بائع کا خیار ہو اور مشتری کے ہاتھ میں خیار کے دوران ہلاک ہو تو ضمان قیمت کے ساتھ مشتری پر ہے کیونکہ وہ عقد کی بنیاد پر مقبوض ہے؛ اگر مشتری کا خیار ہو اور اس کے ہاتھ میں ہلاک ہو تو ضمان ثمن کے ساتھ مشتری پر ہے کیونکہ ہلاکت عیب کی طرح ہے جو تلف تک پہنچ جائے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7942}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7943} ضمان دیگر مذاہب میں: مالکیہ کے نزدیک ضمان بائع پر ہے، سوائے اس کے کہ وہ چیز جو چھپائی جا سکتی ہو ہلاک ہو اور بینہ سے ہلاکت ثابت نہ ہو تو ضمان مشتری پر؛ شافعیہ کے نزدیک قبض کے بعد آسمانی آفت سے تلف ہو تو اگر خیار بائع کا ہو تو بیع فسخ ہو جاتی ہے، اور مشتری کا ہو تو فسخ نہیں ہوتی کیونکہ ضمان قبض سے اس پر آ گیا؛ حنابلہ کے نزدیک ملک مشتری کی ہے اور ضمان بھی، مگر ماپی اور تولی جانے والی چیزوں میں ضمان مشتری پر تبھی آئے گا جب ماپ یا وزن ہو جائے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7944}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7945} خیار میں زیادتیاں: حنفیہ زیادتی کو چار قسمیں کرتے ہیں: متصلہ متولدہ جیسے موٹاپا، بیماری سے شفا اور پھل کا پکنا؛ متصلہ غیر متولدہ جیسے رنگائی، سلائی، زمین میں عمارت اور درخت؛ منفصلہ متولدہ جیسے بچہ، پھل، دودھ، انڈے اور اون؛ اور منفصلہ غیر متولدہ جیسے کرائے کی شے کی آمدنی، جانور پر جنایت کا ارش اور عقر۔ دوسرے مذاہب صرف متصل اور منفصل کی تقسیم کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7946} حنفیہ کے نزدیک زیادتی کا حکم: اصل یہ ہے کہ زیادتی رد سے مانع ہے، اس لیے عقد لازم ہوتا ہے اور زیادتیاں مشتری کی ہوتی ہیں؛ البتہ منفصلہ غیر متولدہ رد سے مانع نہیں اور متصلہ متولدہ میں اختلاف ہے۔ منفصلہ غیر متولدہ میں فسخ ہو تو ابو حنیفہ اصل کے ساتھ زیادتی بھی واپس کرتے ہیں کیونکہ ملکیت موقوف تھی، صاحبین کے نزدیک زیادتی مشتری کی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7946}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7947} متصلہ متولدہ زیادتی: ابو حنیفہ اور ابو یوسف کے نزدیک یہ خیار کو ساقط کرتی ہے اور صاحبِ خیار اصل اور زیادتی دونوں کا مالک ہو جاتا ہے؛ امام محمد کے نزدیک خیار باقی رہتا ہے اور امضا یا فسخ کا اختیار ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7947} مالکیہ کے نزدیک زیادتیاں: بچہ اور اون مشتری کے ہیں کیونکہ وہ باقی رہنے والا جزء ہیں؛ باقی جیسے دودھ، گھی، انڈے اور جنایت کا ارش بائع کے ہیں، کیونکہ خیار کے دوران ملکیت بائع کی رہتی ہے یہاں تک کہ صاحبِ خیار اپنا خیار استعمال کرے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7947} شافعیہ کے نزدیک زیادتیاں: خیار کے دوران منفصلہ زیادتی اسی کی ہے جس کی ملک ہو، اور اگر خیار دونوں کا ہو تو وہ مبیع کی طرح موقوف ہے؛ متصلہ زیادتی اصل کے تابع ہے، اور عقد کے وقت موجود حمل اصل کا حصہ ہے۔ حنابلہ کے نزدیک تمام زیادتیاں مشتری کی ہیں، خواہ متصل ہوں یا منفصل، اور قبضے سے پہلے بائع کے پاس ہوں تب بھی، حدیث «الخراج بالضمان» سے استدلال کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7947}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7948} خیار کی مدت میں دونوں بدلوں کی حوالگی: اس پر اتفاق ہے کہ مطلق عقد میں خیار کی مدت کے دوران دونوں بدلوں کی حوالگی واجب نہیں؛ نہ بائع پر مبیع دینا لازم ہے اور نہ مشتری پر ثمن دینا، جب تک مدت نہ گزرے یا صاحبِ خیار خیار ساقط نہ کرے۔ آزمائش کے لیے رضامندی سے حوالگی خیار کو باطل نہیں کرتی، لیکن ملکیت کی نیت سے ہو اور خیار بائع کا ہو تو اس کا خیار باطل ہو جاتا ہے۔ اگر ایک فریق نے رضاکارانہ دے دیا اور دوسرا انکار کر دے تو ابو حنیفہ اور شافعیہ کے نزدیک جبر نہیں، اور دینے والا واپس لے سکتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7948}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7949} استعمال سے پہلے خیار کا ساقط ہونا: بچے کے بالغ ہونے سے جس کا عقد ولی نے کیا ہو، جنون وغیرہ سے، اور صاحبِ خیار کی موت سے ⁦(جس میں اختلاف ہے)⁩۔ ابو یوسف کے نزدیک صغیر کے بالغ ہونے سے ولی کا خیار ساقط ہو جاتا ہے اور عقد لازم ہو جاتا ہے، محمد کے نزدیک ساقط نہیں ہوتا۔ جنون بذاتِ خود خیار کو ساقط نہیں کرتا، بلکہ پوری مدت گزر جانا بغیر فسخ کے ساقط کرتا ہے؛ اور اگر مدت کے دوران افاقہ ہو جائے تو اصح حنفی قول کے مطابق باقی خیار برقرار رہتا ہے۔ مالکیہ کے نزدیک صاحبِ خیار مجنون ہو اور افاقہ کی امید نہ ہو تو حاکم وہ صورت دیکھے جو اس کے لیے بہتر ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7949}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7950} خیار کا اختتام امضا یا مدت گزرنے یا فسخ سے ہوتا ہے۔ امضا صریح ہو سکتا ہے، جیسے «میں نے بیع کی اجازت دی» یا «میں نے خیار ساقط کیا»، یا دلالت سے، جیسے مالک کی طرح مبیع میں تصرف کرنا، بیچنا، سودا کرنا، اجارہ، ہبہ یا رہن۔ دوسرے عاقد کو اجازت کا علم ہونا ضروری نہیں۔ خیار ساقط کرنے کے بدلے مال پر صلح ہو سکتی ہے، اور وہ قیمتِ ثمن میں اضافہ شمار ہوتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7951}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7952} موت: حنفیہ اور حنابلہ کے نزدیک صاحبِ خیار کی موت سے خیار ساقط ہو جاتا ہے، اور مالکیہ اور شافعیہ کے نزدیک وارثوں کو منتقل ہوتا ہے۔ اگر جس پر خیار ہو وہ مر جائے تو خیار باقی رہتا ہے اور وارثوں کے سامنے رد ہو سکتا ہے، جیسا کہ سرخسی نے نقل کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7951} مدت گزرنا: عام طور پر متفق ہے کیونکہ خیار مدت سے مقیّد ہے اور عقد لازم ہونا اصل ہے؛ مدت گزرنے کو امضا سمجھا جاتا ہے، اگرچہ قاضی ابو یعلیٰ نے اختلاف کیا۔ مالکیہ مدت گزرنے کو خیار کا ختم ہونا کہتے ہیں نہ امضا؛ اگر مبیع مشتری کے ہاتھ میں ہو تو امضا، اور بائع کے ہاتھ میں ہو تو فسخ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7953} فسخ سے انتہا: فسخ قول سے صریح ہو سکتا ہے، جیسے «میں نے بیع فسخ کی» یا «میں نے ثمن واپس کیا»، یا فعل سے دلالۃً۔ بائع کا یہ کہنا کہ میں قیمت بڑھائے بغیر نہیں بیچوں گا، اور مشتری کا یہ کہنا کہ کم کیے بغیر نہیں خریدوں گا، صریح فسخ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7953} عمل سے فسخ: صاحبِ خیار مالک کی طرح مبیع میں تصرف کرے، یا خیار مشتری کا ہو اور ثمن عین ہو تو ثمن میں تصرف کرے، تو فسخ ہے؛ دین کا فسخ عمل سے نہیں ہو سکتا کیونکہ اثمان نام لینے سے متعین نہیں ہوتے۔ علت یہ ہے کہ ایسا تصرف ملکیت کو باقی رکھنے کی دلیل ہے، اور ملکیت باقی رکھنا فسخ ہی سے ہوتا ہے۔ ابن الہمام اور کاسانی کے نزدیک بائع کا مبیع میں جو کام اجازت ہوتا، ثمن میں ہو تو فسخ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7954} حنفیہ کی دلالۃً فسخ کی تفریعات: کھانا، پینا اور پہننا خیار ساقط کرتے ہیں، قاضی خان کے نزدیک ایک بار پہننے سے خیار باطل نہیں ہوتا؛ کتاب سے نقل کرنا خیار ساقط نہیں کرتا، مٹا دینا کرتا ہے؛ جانور پر سوار ہو کر پانی پلانا، واپس کرنا یا چارہ دینا بعض کے نزدیک اجازت ہے؛ مبیع کا فروخت، ہبہ یا رہن تسلیم کے ساتھ خیار ساقط کرتا ہے، بغیر تسلیم کے نہیں؛ اجارہ بغیر تسلیم کے بھی فسخ ہے بعض کے نزدیک؛ ابو بکر بن الفضل تسلیم کو آزمائش کے لیے ⁦(خیار باقی)⁩ اور تملیک کے لیے ⁦(خیار باطل)⁩ میں تقسیم کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7954}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7955} فسخ نافذ ہونے کی شرائط: خیار کا موجود ہونا؛ ابو حنیفہ اور محمد کے نزدیک دوسرے عاقد کو فسخ کا علم ہونا، ورنہ فسخ موقوف رہتا ہے اور مدت میں علم ہو تو نافذ، ورنہ عقد لازم ہو جاتا ہے؛ ابو یوسف کے تین اقوال ہیں اور مشہور یہ ہے کہ علم شرط نہیں، ابن الہمام نے اسی کو ترجیح دی۔ جمہور ⁦(مالکیہ، شافعیہ، حنابلہ)⁩ کے نزدیک علم شرط نہیں۔ اور فسخ سے صفقہ میں تفریق نہ ہو، کہ کچھ میں عقد جاری رہے اور کچھ میں فسخ ہو؛ شافعیہ کے نزدیک اصح یہ ہے کہ یہ جائز نہیں، اور مالکیہ سب کو واپس کرنے پر مجبور کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7955}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7956} موت سے خیار کی منتقلی: امام مالک اور شافعی کے نزدیک خیار وارث کو منتقل ہوتا ہے، کیونکہ یہ مال کی اصلاح کے لیے ثابت حق ہے جیسے رہن؛ حنفیہ کے نزدیک خیار وراثت میں نہیں جاتا کیونکہ یہ ذاتی مشیئت ہے۔ حنابلہ کے نزدیک خیار صرف اس صورت میں وارث کو ملے گا جب مورث نے موت سے پہلے اس کا مطالبہ کیا ہو؛ ابن قدامہ کے نزدیک مرنے والے کا خیار باطل ہو جاتا ہے اور دوسرے کا باقی رہتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7956}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7957} جنون اور بے ہوشی: شافعیہ کے نزدیک جنون یا بے ہوشی سے خیار منقطع نہیں ہوتا، ولی یا حاکم اس کی طرف سے وہ فیصلہ کرے جس میں اس کا فائدہ ہو، اور گونگے کے لیے جس کا اشارہ نہ سمجھا جائے حاکم نائب مقرر کرے۔ مالکیہ کے نزدیک جنون بغیر افاقہ کی امید کے یا دوسرے کو ضرر کی حد تک طویل ہو تو سلطان دیکھتا ہے؛ ہوش میں آ جانے والا فسخ یا اجازت کر سکتا ہے اور ولی کا فعل بدل سکتا ہے اگر ثبوت ہو؛ بے ہوش انتظار کرتا ہے، اور مدت کے بعد افاقہ ہو تو نئی مدت دی جاتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7957}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7958}'
  es: "La opción de estipulación (khiyar al-shart) es un nombre compuesto para el derecho, establecido por estipulación, de una parte a elegir entre confirmar y anular; Ibn Arafa la define como una venta cuya conclusión se retrasa hasta una confirmación esperada. Otros nombres: la opción estipulada (que se distingue de la opción legal, como el defecto), la opción de deliberación y la venta de opción. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7923}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7924} Su licitud: la mayoría de los juristas la consideran lícita y no contraria al contrato, en el informe de Ibn Umar y de Habban ibn Munqidh (\"cuando vendas, di: sin engaño\" y \"tienes la opción tres noches\"); al-Nawawi e Ibn al-Humam informan de acuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7924}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7925} Redacción: no hay palabras fijas; cualquier palabra que transmita la opción (consentimiento, voluntad) es suficiente, y la costumbre cuenta para los malikíes, como cuando las personas han negociado durante mucho tiempo con una opción en una venta determinada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7925}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7926} Condiciones: debe estar estipulado en el contrato o en su sesión en la visión shafií y hanbalí; los hanafíes permiten que se agregue más tarde como si fuera en el contrato; debe estar limitado por un plazo conocido, ya que una opción ilimitada causa una gran ignorancia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7926}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7927}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7927}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928} Plazo: el mínimo no es fijo y puede ser un momento; para el máximo, Ahmad, Muhammad al-Shaybani, Abu Yusuf y otros permiten cualquier plazo por acuerdo, mientras que Ibn Abi Layla, Ibn Shubruma y otros también; Ahmad dice que no le gusta un plazo largo, y el autor de Ghayat al-Muntaha encuentra inválido un plazo mucho más allá de la costumbre (como mil años); Malik lo limita por necesidad y lo que es habitual para la venta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7929} Propósito: permitir que la parte considere y pruebe la cosa; el plazo según los Malikis se mide por lo que la cosa necesita ser probada y consultada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7929} Plazo para la tierra: el límite exterior es un mes más seis días, por lo que la opción puede extenderse hasta treinta y seis días; se agregan dos días más para que el comprador, que aún posee la cosa al final del plazo, pueda devolverla. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7930} Animales: si la opción es conocer su alimento, fuerza y precio, el límite es de tres días; si se trata de probarlos dentro de la ciudad, un día más o menos; fuera de ella, un barid (medio día de marcha) según Ibn al-Qasim y dos barids según Ashhab. Ropa, bienes y fungibles: tres días más un día. Frutas y verduras: el plazo lo establece lo que se necesita probar antes de que cambien. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7930} La tercera opinión fija tres días con sus noches para cualquier tema, y prohíbe más. Es la opinión de Abu Hanifa, Zufar y (en el informe más conocido) al-Shafii. Las fuentes son el informe de Habban ibn Munqidh y el hadiz de la oveja con la ubre llena (musarrah): quien compra una oveja así tiene la opción por tres días, como argumentó al-Shafii. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7930}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7931} Más allá de los tres días: para Abu Hanifa y Zufar el contrato es nulo como fasid; para al-Shafii es nulo como batil. Abu Hanifa es el único que sostiene que dejar caer el exceso hace que el contrato sea válido, siempre que no hayan pasado los tres días; Zufar discrepa, ya que la continuación sigue a la validez original. Los Malikis añaden que el plazo es defectuoso si es para consultar a alguien cuya opinión se conoce solo después de que termina, o si excede mucho la vida útil de los bienes; un día extra no hace daño. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7931}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7932} Una opción sin plazo tiene cuatro puntos de vista. (1) El contrato es nulo o inválido: al-Shafii y, en un informe, Ahmad; los Hanafis consideran la venta inválida sin distinguir entre incertidumbre grave y leve. Abu Hanifa y sus compañeros sostienen que si el defecto se elimina dentro de los tres días el contrato se vuelve válido; los dos compañeros lo consideran válido incluso después de tres días. (2) La condición es nula pero el contrato se mantiene: un informe de Ahmad e Ibn Abi Layla. (3) El contrato se mantiene y el plazo se fija: Malik deja que el juez fije el plazo habitual para probar tales bienes; Ibn Taymiyya sugiere tres días si no se dio ninguno. (4) El contrato se mantiene y la opción permanece abierta como surgió, la opinión de Ibn Shubruma y un informe de Ahmad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7932}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933} Opción permanente: una condición que hace que la opción dure para siempre (o por días no especificados) la invalida. Plazo desconocido: inválido, ya sea que la incertidumbre sea grave (viento, lluvia, llegada o muerte de una persona, nacimiento de un animal preñado) o leve (cosecha, trilla, regreso de peregrinos). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933} Conexión: el plazo debe comenzar en el contrato. Si el plazo se establece para comenzar más tarde (desde el final del mes o mañana) la venta es nula para los Hanafis, Shafiis y Hanbalis; Los hanafíes lo rescatan contando el intervalo dentro del plazo, como en una opción de dos días después del Ramadán en un contrato hecho al final del Ramadán. Continuidad: las partes del plazo deben seguirse una a otra; para un día cumplido y un día no cumplido, los hanbalíes tienen dos puntos de vista. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7934} Titular: el titular de la opción debe ser nombrado. Si las partes la otorgan a una de ellas sin nombrar a cuál, o a quien una de ellas elija, es nula según Ibn Qudama; al-Nawawi sostiene que la venta es válida si la opción es para una sola parte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7934}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7935} Contratos: la opción pertenece solo a los contratos vinculantes que pueden ser rescindidos. La venta es su campo principal, incluyendo la venta de fideicomiso como murabaha. Las excepciones son salam, intercambio de dinero (sarf) e intercambio de bienes ribawi del mismo tipo, para los cuales algunos hanbalíes requieren que el precio se reciba en la sesión; Ibn Abidin señala que excluir salam y sarf fuerza la regla, y los malikíes lo permiten en salam breve. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7935} Otros contratos: el arrendamiento toma la opción en general para hanafíes y malikíes; shafiíes y hanbalíes lo permiten solo en arrendamientos sobre deuda, o en arrendamientos fijos cuyo plazo no comienza de inmediato. Transferencia de deuda (hawala): aceptada por los hanafíes, rechazada por los shafiíes y hanbalíes ya que no se basa en el intercambio. División: dividida; la división de diferentes tipos es por consentimiento, la división del mismo tipo de valores toma la opción. Garantía (kafala): los hanafíes la permiten, y Abu Hanifa permite más de tres días porque se basa en la flexibilidad. Waqf: permitido por Abu Yusuf, nulo para Muhammad, y en la opinión shafií y hanbalí. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7935}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7936} Quién puede estipular: la opción puede darse a cualquiera de las partes o a ambas, la opinión de la mayoría de los juristas; al-Thawri e Ibn Shubruma la limitaron al comprador. Puede darse a un tercero: los juristas están de acuerdo en que esto es válido si el tercero puede hablar por sí mismo. Los hanafíes basan esto en la preferencia jurídica (istihsan), porque una parte con poca experiencia puede necesitar a alguien más sabio; Zufar objetó porque la opción es parte del contrato. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7936}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7937} Un tercero como titular de la opción: los malikíes dicen que si el término dice 'por consejo de fulano', tanto la parte contratante como el asesor pueden decidir solos, ya que el consejo no vincula al acuerdo; si dice 'por opción de fulano' o 'consentimiento', la mejor opinión es que es delegación, no agencia, y la parte contratante no puede decidir sola. Palabras cercanas a estas, como 'si quiere confirma, si quiere anula', cuentan igual. Los shafiíes sostienen que la opción para un tercero es delegación o arbitraje, no agencia, y esa es su opinión más sólida; Abu Yaala sostuvo que entonces es inválida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7938} Cláusula de consulta: los shafiíes tienen dos opiniones sobre si la parte debe declarar que consultó y se le dijo que anulara; los hanbalíes no lo requieren, y al-Nawawi afirmó la primera opinión. La persona consultada debe ser nombrada; 'en mi consulta' sin nombrarlo no es suficiente, aunque al-Adhra'i pensó que era suficiente. Los hanafíes no tienen texto sobre el punto que encontró el compilador. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7938}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7939} Agencia en la opción: la opción pertenece a la parte contratante que la estipula para sí misma, cualquiera que sea su posición: propietario, tutor, albacea, agente o socio o mudarib de una compañía. Un tutor o albacea puede estipularla para el bien del menor o del pupilo; un agente actúa según la instrucción general del principal para contratar, que incluye una opción. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7939} El agente en la visión shafií: un agente puede estipular la opción para sí mismo o para su principal. Un agente de ventas no puede dar la opción al comprador, ni un agente de compras al vendedor; si lo hace, el contrato es nulo a menos que el principal lo permita. La mejor opinión es que la opción no pasa más allá de la parte nombrada. Los hanbalíes coinciden en que un agente puede estipularlo para sí mismo. Un agente debe actuar en beneficio de su principal, puesto que se le confía. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7939}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7940} Varias partes: así como la opción es válida para una sola parte, también lo es para varias, como cuando dos socios venden una cosa o un propietario vende a dos compradores que estipulan la opción para ambos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7940} Efecto de la opción sobre el contrato: impide que el contrato surta efecto en su norma legal para la parte que posee la opción. Abu Hanifa sostiene esto también en contra de la otra parte; sus dos compañeros sostienen que la norma surte efecto para la parte que no tiene la opción. Al-Kasani describe el contrato como suspendido, sin conocerse en su norma hasta que finaliza la opción. Los shafiíes lo consideran suspendido; los malikíes sostienen que el vendedor conserva la propiedad de la cosa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7940}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7941} Efecto en la transferencia de propiedad: con la opción para ambas partes, los hanafíes sostienen que ni el precio ni la cosa cambian de manos, y los shafiíes suspenden la transferencia hasta que finaliza la opción; los hanbalíes sostienen que la propiedad pasa al comprador en el contrato. Con la opción para una de las partes, los malikíes sostienen que la propiedad permanece con el vendedor, siendo la venta un contrato disuelto, no formado, y la confirmación la transfiere; otra opinión malikí y una de Ahmad sostienen que el comprador es el propietario, o que está suspendido. Cuando el vendedor tiene la opción, la propiedad permanece con él, el comprador no puede disponer de la cosa, y la disposición del vendedor es una anulación. Cuando el comprador la posee, la propiedad deja al vendedor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7941}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7942} Responsabilidad por pérdida (Hanafis): cuando el vendedor tiene la opción y la cosa perece antes de la recepción, el vendedor la soporta. Cuando perece en manos del comprador después de la recepción y la opción ha terminado, el comprador la soporta al precio. Cuando el vendedor la tiene y el comprador ha recibido la cosa y perece durante la opción, el comprador la soporta al valor, como con una cosa tomada para inspección. Cuando el comprador tiene la opción y perece en su mano, la soporta al precio, ya que la pérdida es un defecto que lleva a perecer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7942}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7943} Responsabilidad por pérdida en otras escuelas: los malikíes ponen la responsabilidad en el vendedor, excepto que una cosa mueble que puede ser ocultada, una vez perdida sin prueba, recae sobre el comprador. Los shafiíes sostienen que si la cosa perece por causa divina después de la recepción y la opción es del vendedor, la venta se disuelve; si la opción es del comprador, la venta no se disuelve. Los hanbalíes sostienen que la propiedad es del comprador y también lo es la responsabilidad, excepto los bienes medidos y pesados, donde la responsabilidad permanece con el vendedor hasta que sean medidos o pesados por el comprador. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7944}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7945} Aumento en el objeto: los Hanafi dividen el aumento en cuatro tipos: conectado y generado por la cosa (grasa, curación, maduración); conectado y no generado (teñido, costura, construcción y siembra en la tierra); separado y generado (descendencia, fruta, leche, huevos, lana); y separado y no generado (alquiler de una cosa arrendada, compensación por daño y el mahr por coito por error). Otras escuelas dividen el aumento solo en conectado y separado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7946} Dictamen sobre el aumento en la visión Hanafi: la regla general es que el aumento impide la devolución, por lo que el contrato es vinculante y el aumento va al comprador, excepto que el aumento separado no generado nunca impide la devolución, mientras que el aumento conectado generado es disputado. Si la opción se anula, Abu Hanifa devuelve la cosa con su aumento, ya que la propiedad fue suspendida; los dos compañeros sostienen que el aumento es del comprador. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7946}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7947} Aumento generado conectado: Abu Hanifa y Abu Yusuf sostienen que termina la opción y el poseedor posee tanto la cosa como el aumento; Muhammad sostiene que la opción no termina, y el poseedor puede confirmar o anular. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7947} Aumento en la visión Maliki: la descendencia y la lana van al comprador, como parte de la cosa que queda; el resto, como la leche, la grasa, los huevos y la compensación por daño, van al vendedor, porque la propiedad permanece con el vendedor durante la opción hasta que el poseedor lo usa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7947} Aumento en la visión shafií: el aumento separado durante la opción pertenece a quien posee la cosa; si la opción es para ambos, se suspende como la cosa misma. El aumento conectado sigue a la cosa, y un embarazo presente en la venta es parte de la cosa. Los hanbalíes dan todo el aumento al comprador, conectado o separado, incluso si la cosa todavía está en la mano del vendedor antes de la recepción, citando el hadiz «el rendimiento va con la obligación». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7947}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7948} Entrega de los dos precios durante la opción: se acuerda que ninguna de las partes debe entregar durante la opción a menos que se estipule; el vendedor no necesita entregar la cosa de inmediato, ni el comprador el precio, hasta que termine el plazo o el tenedor renuncie a él. La entrega voluntaria no anula la opción, si está destinada a prueba y no a la propiedad; si el vendedor entrega la cosa como propiedad mientras mantiene la opción, su opción termina. Si una parte entrega voluntariamente y la otra se niega, Abu Hanifa no obliga a la otra, y los shafiíes permiten que el que entrega la recupere. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7948}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7949} Terminación de la opción antes de su uso: por la mayoría de edad de un menor para quien un tutor contrató; por locura o similar; o por la muerte del titular, lo cual es discutido. Abu Yusuf sostiene que la mayoría de edad del menor termina la opción para el tutor y vincula el contrato; Muhammad sostiene que no, y sus informes difieren. La locura no termina la opción en sí misma, pero el transcurso de todo el plazo sin una decisión sí lo hace; Si el titular se recupera durante el plazo, conserva su opción por el resto, según la interpretación más sólida de la escuela Hanafi. Los Malikis dicen que si el poseedor enloquece y no se recupera, el sultán considera qué es mejor para él. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7949}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7950} Terminación de la opción por confirmación o por vencimiento del plazo: la opción termina por confirmación, que puede ser expresa (palabras como «confirmo la venta», «he renunciado a la opción») o por acto implícito, como disponer de la cosa como lo haría un propietario, mediante venta, negociación, arrendamiento, donación o prenda. La confirmación no necesita ser conocida por la otra parte, y la cosa no necesita seguir existiendo si era apta al momento del contrato. Un acuerdo por dinero o bienes para renunciar a la opción es válido y se convierte en un aumento del precio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7951}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7952} Muerte: los hanafíes y hanbalíes sostienen que la opción termina con la muerte de su titular, ya sea comprador o vendedor, y ya sea que actúe él mismo o a través de un agente. Los malikíes y shafiíes sostienen que pasa a los herederos. Si el obligado muere, la opción permanece, y su titular puede anularla frente a los herederos, como informa al-Sarakhsi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7951} Caducidad del plazo: generalmente acordado, ya que la opción está limitada a un plazo y el contrato es vinculante por defecto; la caducidad se toma como confirmación, y el silencio del titular sobre el plazo es consentimiento, aunque Abu Yaala discrepó. Los malikíes tratan la caducidad como una finalización, no como una confirmación: si la cosa está en manos del comprador, es una confirmación; si está en manos del vendedor, es una anulación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7953} Finalización por anulación: puede expresarse mediante palabras, como «Anulo la venta» o «Devuelvo el precio», o mediante un acto que muestre la devolución. Una anulación expresa incluye que el vendedor diga que no venderá a menos que se aumente el precio, y que el comprador diga que no comprará a menos que se reduzca. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7953} Anulación por acto: el titular de la opción anula cuando trata con la cosa como lo haría su propietario, o con el precio si la opción es del comprador y el precio es una cosa específica. Una deuda no puede anularse por acto, ya que los precios no se fijan al ser nombrados. La razón es que tal transacción muestra que el poseedor conserva la propiedad, y eso solo puede conservarse mediante la anulación. Ibn al-Humam y al-Kasani sostienen que lo que el vendedor hace con la cosa, si se hiciera con el precio, confirmaría la venta, por lo que anula la venta por implicación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7954} Anulación implícita en las resoluciones Hanafi: comer, beber y vestir terminan la opción (Qadikhan dice que vestir una vez no lo hace); copiar de un libro no lo hace, pero borrarlo sí; montar un animal para darle agua, devolverlo o alimentarlo es confirmación para algunos, y Qadikhan dice que no anula la opción, por preferencia jurídica (istihsan); la venta, donación o prenda de la cosa con entrega la termina, sin entrega no; el arrendamiento es una anulación incluso sin entrega, para algunos; Abu Bakr ibn al-Fadl separa la entrega para prueba (sin anulación) de la entrega para propiedad (anulación). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7954}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7955} Condiciones de anulación válida: la opción debe seguir existiendo. Abu Hanifa y Muhammad requieren que la otra parte conozca la anulación; si el titular anula sin su conocimiento, la anulación queda suspendida, válida si se entera de ella dentro del plazo, y el contrato es vinculante si el plazo termina sin que él lo sepa. Abu Yusuf tiene tres informes, el más conocido no requiere conocimiento; al-Shafii, los Malikis y los Hanbalis coinciden en que el conocimiento no es necesario. La anulación debe abarcar la totalidad del acuerdo y no dividirlo; los Malikis obligan a la devolución de todo, y los Shafiis sostienen que la división no está permitida en la opinión más sólida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7955}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7956} Transferencia de la opción por muerte: Malik y al-Shafii sostienen que la opción pasa al heredero, ya que es un derecho establecido para proteger la propiedad, como una prenda; los Hanafis dicen que no pasa, siendo un deseo y voluntad personal que no se transfiere. Los Hanbalis dicen que pasa solo si el titular la reclamó antes de la muerte; Ibn Qudama sostiene que la opción de la parte fallecida caduca, mientras que la opción de la otra parte permanece. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7956}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7957} Locura y desmayo: para los Shafiis la opción no termina con la locura o el desmayo; El tutor o el juez actúa en nombre del titular en función de su interés; a una persona muda sin signos comprensibles se le asigna un agente judicial. Para los malikíes, el juez interviene cuando no se prevé que la locura termine o cuando dura lo suficiente como para perjudicar a la otra parte; el titular cuerdo puede anular, confirmar o revocar los actos del tutor si tiene pruebas. Una persona desmayada espera hasta recuperarse; si se recupera después del plazo establecido, se le concede un nuevo plazo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7957}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7958}"
  fr: "L'option de stipulation (khiyar al-shart) désigne le droit, stipulé par convention, pour une partie de choisir entre la confirmation et l'annulation d'un contrat. Ibn Arafa la définit comme une vente dont la conclusion est différée jusqu'à confirmation. Autres appellations: option stipulée (à distinguer de l'option légale, telle que la clause de défaut), option de réflexion et vente avec option. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7923}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7924} Sa licéité: la plupart des juristes la considèrent licite et non contraire au contrat, se fondant sur les hadiths d'Ibn Umar et d'Habban ibn Munqidh (« lorsque vous vendez, dites: pas de tromperie » et « vous avez trois nuits pour vous engager »). Al-Nawawi et Ibn al-Humam rapportent un consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7924}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7925} Formulation: aucune formulation fixe n’est requise; tout terme exprimant l’option (consentement, volonté) suffit, et l’usage est pris en compte par les Malikites, comme lorsqu’une option a été négociée de longue date dans le cadre d’une vente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7925}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7926} Conditions: l’option doit être stipulée dans le contrat ou lors de sa conclusion selon les écoles Shafi’i et Hanbalite; les Hanafites autorisent son ajout ultérieur comme s’il avait été conclu au contrat; elle doit être limitée par une durée connue, car une option illimitée engendre une ignorance flagrante. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7926}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7927}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7927}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928} Durée: la durée minimale n’est pas fixe et peut être d’un instant; pour la durée maximale, Ahmad, Muhammad al-Shaybani, Abu Yusuf et d’autres autorisent toute durée par accord, de même qu’Ibn Abi Layla, Ibn Shubruma et d’autres; Ahmad dit qu’il n’aime pas les durées trop longues, et l’auteur de Ghayat al-Muntaha juge invalide une durée excessive (comme mille ans); Malik la limite selon les besoins et les usages de la vente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7929} Objectif: permettre à la partie d’examiner et de tester la chose; le délai selon les Malikites est déterminé par les éléments à examiner et à vérifier. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7929} Délai pour un bien immobilier: la limite maximale est d’un mois et six jours, l’option peut donc aller jusqu’à trente-six jours; deux jours supplémentaires sont ajoutés pour permettre à l’acheteur, toujours en possession du bien à l’issue du délai, de le restituer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7930} Animaux: si l’on souhaite connaître leur nourriture, leur force et leur prix, la limite est de trois jours; si l’on souhaite les tester en ville, un jour environ suffit; hors de la ville, un barid (une demi-journée de marche) selon Ibn al-Qasim et deux barids selon Ashhab. Vêtements, marchandises et biens fongibles: trois jours plus un jour. Fruits et légumes: la durée est déterminée par les tests nécessaires avant qu’ils ne changent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7930} Un troisième avis fixe à trois jours, nuits comprises, pour tout sujet, et interdit toute période supplémentaire. C’est l’avis d’Abu Hanifa, de Zufar et (dans le rapport le plus connu) d’al-Shafi’i. Les sources sont le récit de Habban ibn Munqidh et le hadith de la brebis à la mamelle pleine (musarrah): celui qui achète une brebis ainsi tenue dispose d’une option de trois jours, comme l’a soutenu al-Shafi’i. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7930}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7931} Au-delà de trois jours: pour Abou Hanifa et Zoufar, le contrat est nul (fasid); pour al-Shafi’i, il est nul (batil). Abou Hanifa est le seul à considérer que la suppression de l’excédent rend le contrat valide tant que les trois jours ne sont pas écoulés; Zoufar est d’un avis contraire, car la poursuite du contrat découle de sa validité initiale. Les Malikites ajoutent que la clause est irrégulière si elle prévoit la consultation d’une personne dont l’avis n’est connu qu’après son expiration, ou si elle excède largement la durée de vie de la marchandise; un jour supplémentaire est sans conséquence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7931}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7932} Une option sans délai peut donner lieu à quatre interprétations: (1) Le contrat est nul: al-Shafi'i et, selon un hadith rapporté, Ahmad; les Hanafites invalident la vente sans distinction entre incertitude majeure et mineure. Abou Hanifa et ses compagnons estiment que si le défaut est corrigé dans les trois jours, le contrat devient valide; deux autres compagnons le considèrent valide même après trois jours. (2) La condition est nulle, mais le contrat demeure: selon un hadith rapporté par Ahmad et Ibn Abi Layla. (3) Le contrat demeure et le délai est fixé: Malik laisse au juge la possibilité de fixer le délai habituel pour tester de telles marchandises; Ibn Taymiyya suggère trois jours si aucun délai n'a été accordé. (4) Le contrat demeure et l'option reste ouverte telle qu'elle a été formulée: avis d'Ibn Shubruma et selon un hadith rapporté par Ahmad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7932}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933} Option permanente: une condition qui rend l’option permanente (ou à durée indéterminée) l’invalide. Terme inconnu: invalide, que l’incertitude soit grande (vent, pluie, arrivée ou décès d’une personne, naissance d’un animal gestant) ou petite (récolte, battage, retour des pèlerins). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933} Lien de causalité: le terme doit commencer à courir à la date du contrat. Si le terme commence ultérieurement (à la fin du mois ou le lendemain), la vente est nulle pour les écoles hanafite, chaféite et hanbalite; les hanafites la valident en comptant l’intervalle entre les deux jours dans le terme, comme dans le cas d’une option de deux jours après le Ramadan dans un contrat conclu à la fin du Ramadan. Continuité: les éléments du terme doivent se succéder. Concernant la question de savoir si un jour est exercé et un autre non, les Hanbalites ont deux avis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7934} Titulaire: le titulaire de l'option doit être nommé. Si les parties la confèrent à l'une d'elles sans la nommer, ou à la personne de leur choix, l'option est nulle selon Ibn Qudama. Al-Nawawi considère la vente comme valable si l'option est unilatérale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7934}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7935} Contrats: l'option s'applique uniquement aux contrats exécutoires et résiliables. La vente, y compris la vente fiduciaire comme la murabaha, constitue son principal domaine d'application. Les exceptions concernent le salam, l'échange d'argent (sarf) et l'échange de biens ribawi de même nature, pour lesquels certains hanbalites exigent que le prix soit perçu lors de la transaction. Ibn Abidin note qu'exclure le salam et le sarf est une interprétation abusive de la règle, et les malikites l'autorisent pour les salam de courte durée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7935} Autres contrats: le leasing est généralement autorisé par les hanafites et les malikites; les chaféites et les hanbalites ne l'autorisent que pour les leasings sur dette ou les leasings à durée déterminée dont le terme ne commence pas immédiatement. Transfert de dette (hawala): accepté par les hanafites, refusé par les chaféites et les hanbalites car il ne repose pas sur un échange. Partage: le partage est autorisé; le partage de biens de nature différente se fait par consentement mutuel, le partage de biens de même nature est autorisé. Caution (kafala): les hanafites l'autorisent, et Abu Hanifa autorise une durée supérieure à trois jours car elle repose sur la latitude. Waqf: autorisé par Abou Yusuf, nul pour Muhammad, et selon les écoles shafi'ite et hanbalite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7935}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7936} Qui peut stipuler l'option ? L'option peut être accordée à l'une ou l'autre des parties, ou aux deux, selon l'avis de la plupart des juristes; al-Thawri et Ibn Shubruma la limitent à l'acheteur. Elle peut être accordée à un tiers: les juristes s'accordent à dire que cela est valable si le tiers peut s'exprimer lui-même. Les hanafites fondent cette décision sur la préférence juridique (istihsan), car une partie peu expérimentée peut avoir besoin de l'avis d'une personne plus avisée; Zufar s'y est opposé, car l'option fait partie intégrante du contrat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7936}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7937} Un tiers comme titulaire d'option: les Malikites affirment que si la clause stipule « sur l'avis de telle ou telle personne », la partie contractante et le conseiller peuvent décider individuellement, car un avis n'engage pas la partie contractante; si elle stipule « à l'option de telle ou telle personne » ou « avec son consentement », il est préférable de considérer qu'il s'agit d'une délégation et non d'un mandat, et la partie contractante ne peut décider seule. Des formulations proches, telles que « s'il le veut, il confirme; s'il le veut, il annule », ont la même signification. Les Chafiites estiment que l'option accordée à un tiers constitue une délégation ou un arbitrage, et non un mandat, et que c'est leur avis le plus fondé; Abu Yaala a jugé que, dans ce cas, elle est invalide. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7938} Clause de consultation: les shafi'ites ont deux avis quant à l'obligation pour une partie de déclarer avoir consulté et avoir reçu l'ordre d'annuler; les hanbalites ne l'exigent pas, et al-Nawawi a soutenu le premier avis. La personne consultée doit être nommée; la mention « après consultation » sans la nommer est insuffisante, bien qu'al-Adhra'i l'ait jugée suffisante. Les hanafites ne possèdent aucun texte sur ce point, du moins d'après le compilateur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7938}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7939} Mandat dans l'option: l'option appartient à la partie contractante qui la stipule pour elle-même, quelle que soit sa qualité: propriétaire, tuteur, exécuteur testamentaire, mandataire, associé ou mudarib d'une société. Un tuteur ou un exécuteur testamentaire peut stipuler une option dans l'intérêt du mineur ou du pupille; un mandataire agit sur instruction générale du mandant de contracter, instruction qui inclut une option. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7939} Selon l'école shafi'ite: un mandataire peut stipuler l'option pour lui-même ou pour son mandant. Un agent vendeur ne peut céder l'option à l'acheteur, ni un agent acheteur au vendeur; s'il le fait, le contrat est nul, sauf autorisation du mandant. L'avis le plus favorable est que l'option ne peut être cédée à une personne autre que celle désignée. Les hanbalites admettent qu'un mandataire peut la stipuler pour lui-même. Un mandataire doit agir dans l'intérêt de son mandant, car il est un mandataire de confiance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7939}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7940} Plusieurs parties: l’option, de même qu’elle s’applique à une seule partie, s’applique également à plusieurs, comme lorsque deux associés vendent un bien ou lorsqu’un propriétaire vend à deux acheteurs qui stipulent l’option pour les deux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7940} Effet de l’option sur le contrat: elle empêche le contrat de produire ses effets juridiques pour la partie qui détient l’option. Abou Hanifa considère que cette disposition s’applique également à l’autre partie; ses deux compagnons estiment que le contrat produit ses effets pour la partie qui ne détient pas l’option. Al-Kasani décrit le contrat comme suspendu, ses effets juridiques restant inconnus jusqu’à l’expiration de l’option. Les Chafiites le considèrent comme suspendu; les Malikites estiment que le vendeur conserve la propriété du bien. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7940}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7941} Effet sur le transfert de propriété: en cas d’option pour les deux parties, les Hanafites considèrent que ni le prix ni la propriété ne sont transférés, tandis que les Shafi'ites suspendent le transfert jusqu’à l’expiration de l’option. Les Hanbalites, quant à eux, estiment que la propriété est transférée à l’acheteur dès la conclusion du contrat. En cas d’option pour une seule partie, les Malikites considèrent que la propriété reste acquise au vendeur, la vente étant considérée comme un contrat dissous et non formé, et que la confirmation du contrat entraîne alors le transfert de propriété. Une autre opinion malikite, ainsi qu’une opinion ahmadis, soutiennent que l’acheteur devient propriétaire ou que la propriété est suspendue. Lorsque le vendeur détient l’option, la propriété lui appartient, l’acheteur ne peut disposer de la propriété et toute disposition du vendeur entraîne l’annulation du contrat. Lorsque l’acheteur détient la propriété, celle-ci quitte le vendeur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7941}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7942} Responsabilité en cas de perte (Hanafis): lorsque le vendeur détient l’option et que la chose périt avant sa réception, il en supporte la perte. Lorsque la chose périt entre les mains de l’acheteur après sa réception et l’expiration de l’option, l’acheteur en supporte la perte au prix d’achat. Lorsque le vendeur détient la chose et que l’acheteur l’a reçue, mais que celle-ci périt pendant la période d’option, l’acheteur en supporte la perte à sa valeur, comme pour une chose reçue pour inspection. Lorsque l’acheteur détient l’option et que la chose périt entre ses mains, il en supporte la perte au prix d’achat, car la perte est un vice qui entraîne la détérioration. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7942}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7943} Responsabilité en cas de perte selon les autres écoles juridiques: les Malikites imputent la responsabilité au vendeur, sauf pour les biens meubles susceptibles d’être dissimulés; une fois perdus sans preuve, la responsabilité incombe à l’acheteur. Les Chafiites considèrent que si le bien périt pour cause divine après réception et que le vendeur a la possibilité de le récupérer, la vente est annulée; si cette possibilité appartient à l’acheteur, la vente n’est pas annulée. Les Hanbalites estiment que la propriété et la responsabilité incombent à l’acheteur, sauf pour les biens mesurés et pesés, pour lesquels la responsabilité reste à la charge du vendeur jusqu’à ce qu’ils soient mesurés ou pesés par l’acheteur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7944}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7945} Augmentation de la valeur de l'objet: les hanafites distinguent quatre types d'augmentation: l'augmentation liée et générée par la chose (graisse, guérison, maturation); l'augmentation liée mais non générée (teinture, couture, construction et plantation); l'augmentation séparée et générée (descendance, fruits, lait, œufs, laine); et l'augmentation séparée mais non générée (loyer d'un bien loué, indemnisation pour préjudice et dot pour relation sexuelle accidentelle). D'autres écoles ne distinguent que l'augmentation liée et l'augmentation séparée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7946} Règle concernant l'augmentation selon l'école hanafite: la règle générale est que l'augmentation empêche la restitution, donc le contrat est contraignant et l'augmentation revient à l'acheteur. Toutefois, l'augmentation séparée et non générée n'empêche jamais la restitution, tandis que l'augmentation liée et générée est sujette à controverse. Si l'option est annulée, Abou Hanifa restitue le bien avec son accroissement, la propriété étant suspendue; les deux compagnons estiment que l'accroissement appartient à l'acheteur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7946}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7947} Accroissement lié à l'option: Abou Hanifa et Abou Yusuf considèrent que l'option prend fin et que le détenteur devient propriétaire du bien et de l'accroissement; Muhammad considère que l'option se poursuit et que le détenteur peut la confirmer ou l'annuler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7947} Accroissement selon l'école malikite: la progéniture et la laine reviennent à l'acheteur, car elles font partie du bien restant; le reste, comme le lait, la graisse, les œufs et l'indemnisation du préjudice, revient au vendeur, car la propriété demeure chez lui pendant toute la durée de l'option, jusqu'à ce que le détenteur l'exerce. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7947} Selon l'école shafi'ite: l'augmentation de prix distincte durant l'option appartient au propriétaire du bien; si l'option est consentie aux deux parties, elle est suspendue, comme le bien lui-même. L'augmentation de prix liée au bien est attachée à celui-ci, et une grossesse présente lors de la vente fait partie intégrante du bien. Les hanbalites attribuent l'intégralité de l'augmentation de prix à l'acheteur, qu'elle soit liée ou distincte, même si le bien est encore en possession du vendeur avant sa réception, en se référant au hadith « le rendement est lié à l'obligation ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7947}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7948} Versement des deux prix durant l'option: il est convenu qu'aucune des parties n'est tenue de verser le prix durant l'option, sauf stipulation contraire; le vendeur n'est pas tenu de remettre le bien immédiatement, ni l'acheteur de verser le prix, avant l'expiration du délai ou jusqu'à ce que le détenteur y renonce. La remise volontaire du bien n'annule pas l'option si elle a pour but de permettre son acceptation et non son transfert de propriété. Si le vendeur remet le bien en pleine propriété tout en conservant l'option, celle-ci s'éteint. Si une partie remet volontairement le bien et que l'autre refuse, Abou Hanifa n'oblige pas cette dernière, et les Shafi'ites autorisent le livreur à le reprendre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7948}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7949} L'option prend fin avant son utilisation: par la majorité d'un mineur pour lequel un tuteur a contracté; par la démence ou un cas similaire; ou par le décès du titulaire, ce dernier point étant sujet à controverse. Abou Yusuf soutient que la majorité du mineur met fin à l'option pour le tuteur et rend le contrat exécutoire; Muhammad soutient le contraire, et ses sources divergent. La démence n'entraîne pas la fin de l'option en soi, mais l'expiration du terme sans décision y met fin. Si le détenteur se rétablit pendant la durée du contrat, il conserve son option pour le reste de la période, selon l'opinion plus saine de l'école hanafite. Les Malikites affirment que si le détenteur d'une option devient fou et ne guérit pas, le sultan détermine ce qui est le mieux pour lui. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7949}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7950} L'option prend fin par confirmation ou par expiration du terme: l'option s'éteint par confirmation, qui peut être expresse (par exemple: « Je confirme la vente », « Je renonce à l'option ») ou tacite (par exemple: la disposition du bien comme le ferait un propriétaire, par vente, négociation, location, donation ou nantissement). La confirmation n'a pas besoin d'être connue de l'autre partie, et le bien n'a pas besoin d'exister encore s'il était propre au moment du contrat. Un règlement en espèces ou en nature pour renoncer à l'option est valable et constitue une augmentation de prix. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7951}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7952} Décès: les écoles hanafite et hanbalite considèrent que l’option s’éteint au décès de son titulaire, qu’il soit acheteur ou vendeur, et qu’il agisse lui-même ou par l’intermédiaire d’un mandataire. Les écoles malikite et chaféite considèrent qu’elle est transmise aux héritiers. Si le débiteur décède, l’option demeure et son titulaire peut l’annuler à l’encontre des héritiers, comme le rapporte al-Sarakhsi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7951} Expiration du terme: généralement admise, puisque l’option est limitée à une durée et que le contrat est exécutoire par défaut; l’expiration du terme vaut confirmation et le silence du titulaire quant à l’expiration du terme vaut consentement, bien qu’Abu Yaala ait une opinion différente. Les Malikites considèrent la caducité comme une cessation, et non une confirmation: si la chose est entre les mains de l’acheteur, il y a confirmation; si elle est entre les mains du vendeur, il y a annulation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7953} Cessation par annulation: elle peut être expresse, par exemple par une déclaration comme « J’annule la vente » ou « Je restitue le prix », ou par un acte, qui marque la restitution. Une annulation expresse inclut le fait pour le vendeur de refuser la vente à moins d’une augmentation de prix, et pour l’acheteur de refuser l’achat à moins d’une baisse de prix. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7953} Annulation par acte: le titulaire de l’option annule lorsqu’il dispose de la chose comme le ferait son propriétaire, ou du prix si l’option appartient à l’acheteur et que le prix porte sur une chose déterminée. Une dette ne peut être annulée par acte, car les prix ne sont pas fixés par leur dénomination. La raison en est que de telles transactions démontrent que le détenteur conserve la propriété, laquelle ne peut être maintenue que par annulation. Ibn al-Humam et al-Kasani estiment que l'usage que le vendeur fait du bien, s'il est effectué avec le prix convenu, confirme la vente et l'annule donc implicitement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7954} Annulation implicite selon l'école hanafite: manger, boire et porter le bien mettent fin à l'option (Qadikhan considère que le fait de le porter une seule fois ne l'annule pas); recopier un livre ne l'annule pas, mais le rayer, si; monter un animal pour l'abreuver, le ramener ou le nourrir constitue une confirmation pour certains, et Qadikhan considère que cela n'annule pas l'option, par préférence juridique (istihsan); la vente, le don ou le nantissement du bien avec livraison y met fin, sans livraison non plus; la location entraîne une annulation même sans livraison, pour certains; Abu Bakr ibn al-Fadl distingue la livraison à des fins de vérification (pas d'annulation) de la livraison pour transfert de propriété (annulation). Conditions de validité de l'annulation: l'option doit subsister. Abou Hanifa et Muhammad exigent que l'autre partie soit informée de l'annulation; si le titulaire annule à son insu, l'annulation est suspendue, valable s'il en prend connaissance pendant le délai imparti, et le contrat devient exécutoire si le délai expire sans qu'il en soit informé. Abou Yusuf rapporte trois hadiths, le plus connu ne nécessitant aucune connaissance préalable; al-Shafi'i, les Malikites et les Hanbalites s'accordent sur le fait que la connaissance n'est pas requise. L'annulation doit porter sur l'intégralité du contrat et non le fractionner; les Malikites exigent la restitution de la totalité, et les Shafi'ites considèrent que le fractionnement est interdit, selon l'avis le plus solide. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7955}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7956} Transmission de l'option au décès: Malik et al-Shafi'i considèrent que l'option est transmise à l'héritier, car il s'agit d'un droit établi pour protéger le bien, à l'instar d'un gage; les Hanafites affirment qu'elle n'est pas transmissible, car il s'agit d'une volonté personnelle et non cessible. Les Hanbalites estiment qu'elle n'est transmissible que si le titulaire l'a exercée avant son décès; Ibn Qudama soutient que l'option du défunt s'éteint, tandis que celle de l'autre partie demeure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7956}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7957} Folie et évanouissement: pour les Shafi'ites, l'option ne prend pas fin en cas de folie ou d'évanouissement. Le tuteur ou le juge agit dans l'intérêt du titulaire; une personne muette et incapable de communiquer par signes se voit désigner un représentant du juge. Chez les Malikites, le juge intervient lorsque la folie est incurable ou lorsqu'elle dure suffisamment longtemps pour nuire à l'autre partie; le titulaire sain d'esprit peut annuler, confirmer ou infirmer les actes du tuteur s'il en apporte la preuve. Une personne en état de malaise attend de se rétablir; si elle se rétablit après le délai imparti, un nouveau délai est accordé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7957}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7958}"
  tr: "Bir şart opsiyonu, sözleşme taraflarından birinin imzalama ile iptal arasında seçim yapması gerektiği şartıyla belirlenen bileşik bir terimdir; Malikis'ten İbn Arafa, bunu, beklenen imzalı bir sözleşmede sonunu durduran bir satış olarak tanımlamıştır. İsimleri şunlardır: koşullu opsiyon (yargılayıcı opsiyondan kusur opsiyonu olarak ayırt edilir), anlatım opsiyonu ve opsiyonun satışı. {alıntı:atıf:) fiqh-mawsua-kuveytiyya-noor-v3 s.7923} {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s.7924} Meşruiyeti: Çoğu hukukçu, İbn Ömer ve İbn Munqidh'in hadislerine dayanarak, sözleşmeye aykırı olmayan bir yasa olarak kabul eder: 'Eğer satarsanız, rahatlama yoktur' ve 'Üç gece seçeneğiniz var,' ve bu karar el-Nawawi ile İbn al-Humam tarafından kabul edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7924} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7925} Metni: belirli bir ifade gerektirmez; rıza veya irade gibi bir tercihi belirten her kelime yeterlidir. Maliki geleneğine göre, insanların bir üründe bir seçenek üzerinde anlaşmış gibi kabul edilmesi de mümkündür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7925} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7926} Geçerlilik koşulları: Sözleşmeye uygun olmalı veya toplantısında Şafi'ler ve Hanbalilere göre olmalıdır; Hanafiler, sözleşmeden sonra bağlanmasını sözleşmeye dahil sayırlar; ve çoğunluğa göre bilinen bir süre için geçici olmalıdır, çünkü mutlak seçim büyük cehalete yol açar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7926} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7928} Süre: Asgari miktarı belirlenmemiştir ve bir an için bile izin verilir; maksimum sınır: Ahmad, Muhammed ibn al-Hasan, Abu Yusuf ve diğerlerinin görüşü, devretme yoluyla herhangi bir süreye izin verir. En yüksek sınırın sahibi, olağanüstü dönemde yasaklama ister; sahibi ise ihtiyaca ve satılan ürüne göre geleneğe göre sınırlayabilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7929} Seçeneğin amacı: tarafın düşünmesini ve denemesini sağlamak, insanların tavsiye ve test ihtiyacını karşılamak; Malikis'e göre opsiyonun süresi, satılan ürünün test edilip danışılması kadardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7929} Mülkte opsiyon süresi: maksimum bir ay, ardından altı gün, opsiyonun maksimum uzatılması otuz altı gündür; ürün süresi dolduğunda alıcının ürünü iade edebilmesi için süreye iki gün eklenir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7930} Hayvanlar: Güç ve yiyecek ve fiyatlarını bilmek ise, en fazla üç gün; test ülke içinde ise bir gün kadar; dışarıda İbn al-Kasım'da bir barid ve Ashhab'da bir baridan vardır (barid: yarım günlük yürüyüş mesafesi); giysi, sunular ve kadın kıyafetleri gibi diğer eşyalar ise en fazla üç gün ve ek bir gündür. Sebze ve meyveler için ise, süreleri değişmeden önce testin gerekliliğine göre tahmin edilir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7930} Üçüncü yaklaşım, sözleşmeli seçeneği üç gün ve geceyle sınırlar ve geçişi yasaklar. Bu, onun iyi bilinen görüşünde Ebu Hanifa, Zafar ve Al-Shafi'i'nin görüşüdür. Hibban bin Munqidh'in hadisi ve El-Misra'nın hadislerini alıntıladılar: \"Bir toplama koyunu satın alan iki günün en iyisidir.\" El-Şafii, metinde seçenek belirlendiğinde üçte durduğunu söyledi. {alıntı:fiqh-mawsua-kuveytiyya-noor-v3 s.7930} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7931} Üçüne ek olarak: Abu Hanifa'ya göre sözleşme geçersizdir, ancak Al-Shafi'i'ye göre geçersizdir; Abu Hanifa benzersiz olarak, üç gün geçmedikçe eklemenin kaldırılmasının sözleşmeyi geçerli kıldığını savunur ve Zafar buna karşı çıkar çünkü kalan durum belirlenmiş statüye bağlıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7932} Malikiler, görüşü süresi dolana kadar bilinmeyen biriyle danışılması ve ürünün orijinal üründen çok daha uzun olması şartını bir tür yozlaşma olarak görürler. Küçük bir artış zarar vermez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7932} Süre konusunda kesin seçim: Okulların dört yaklaşımı vardır. İlki, sözleşmenin geçersiz veya geçersiz olmasıdır: Şafi'ler ve Hanbaliler bunu iki rivayetten birinde belirtmiş, Hanafiler ise sözleşmeyi geçersiz sayarlar, ancak büyük cehalet ile yakın cehalet arasında ayrım yapmazlar. Sözleşme, Ebu Hanife ve iki arkadaşına göre, geçersiz edici üç gün içinde ortadan kaybolursa geçerlidir ve sadece iki sahabe arasında, sonrasında bile olsa geçerlidir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7933} İkincisi, sözleşme olmadan koşulun geçersizliğidir: Ahmed ve İbn Epey Leyla okulunun rivayeti. Üçüncüsü: Sözleşmenin geçerliliği ve şartın değiştirilmesi: Hakim, mülkün sahibi ile test edilmesi için olağan süreyi belirler ve İbn Teymiyye, mülkü serbest bırakırsa üç gün süreyle belirlenmesi gerektiğine inanır. Dördüncüsü: Sözleşmenin geçerliliği ve şartı koşulsuz kalır; bu, İbn Şubrumah ve Ahmed'in görüşüdür. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.7932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7933} Bu seçeneğin bozulmaya yol açması, örneğin 'asla' ya da 'gün' demek gibi bozucu bir durumu sürdürmek. Bilinmeyen bir zamanda zamanlama geçersizdir; cehalet rüzgar, yaklaşan yağmur, şu kişinin ölümü, hamile bir kadının doğumu ya da hasat, diyas ve hacının gelişi gibi yakın koşullar kadar şiddetli olsun. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7933}, opsiyon süresinin sözleşme imzalandıktan hemen sonra başlaması koşuluyla. Eğer ay sonunda veya ertesi gün belirlenirse, sözleşme Hanefiler, Şafi'ler ve Hanbalilere göre geçersizdir, ancak Hanafiler, Ramazan'dan iki gün sonra imzalanan bir sözleşmede opsiyon gibi aralık dönemini uygulayarak düzeltirler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7933} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7934} sürenin bölümleri ardışık olduğu sürece; bir gün sabit, bir gün sabitse, bir gün sabitse, Hanbalilere göre iki taraf vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7934} Opsiyonun hakkının belirlenmesi: Bilinmemesi geçerli değildir. Eğer opsiyon birine verilirse ve bireye ya da birinin istediği kişiye verilmezse, İbn Qudamah'a göre geçersizdir. Daha doğru görüş, satışın opsiyonun biri için ve diğeri için değilse geçerli olduğudur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7934} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7935} Koşul opsiyonuna dahil edilen sözleşmeler, iptal edilebilecek gerekli sözleşmelerdir; satış birincil alanıdır ve geçersiz satışlar, Murabaha satışları ve benzerlerini içerir. Satış, işlem ve tefecilik satışları, Hanbali çoğunluğuna göre tazminat alma koşulu nedeniyle muaftır. İbn Abidin, salam ve takas hariç tutulmasının kuralın ihlali olduğunu ve Malikilerin kısa ödeme süresinde izin verdiğini uyarmıştır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7935} İcara: Hanafi ve Malikilere göre opsiyon geçerlidir ve Şafi'ler ile Hanbaliler sözleşmeye uymayan bir süre kiralama ile sınırlıdır. Devir: Hanefiler tarafından kabul edilir, ancak kârlılığa dayalı olmadığı için Şafiiler ve Haneliler tarafından kabul edilmez. Bölünme: farklılık gösterir; farklı türlerin bölünmesi karşılıklı anlaşmadır, zorlama değil ve aynı tür değerin bölünmesi doğru görüşe göre seçeneğe tabidir. Ve kafala: Hanefi'lere göre dahil edilmiştir ve Ebu Hanife'nin genişletmeye dayandığı için üç günden fazla uzatması izinlidir. Vakıf: Muhammed, Şafii veya Ahmed olmadan Ebu Yusuf için geçerlidir. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.7935} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7936} Seçenek taraflardan biri veya her iki taraf içindir: çoğunluk görüşü olan bu kararı her iki taraf için de kabul etmek geçerlidir. Al-Thawri ve Ibn Shubrumah'tan anlatıldığı gibi, bu tamamen alıcıya aittir. Hukukçular tarafından kabul edilen sözleşme dışında birine şart koşul, görüş geçerli olduğu sürece geçerlidir. Hanefi temeli tercihtir çünkü yüklenicinin görüşü devredecek birine ihtiyacı vardır ve Zafar'dan farklıdır çünkü seçim sözleşmenin bir gerekliliğidir. {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 s. 7936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7937} Seçenek yabancı olmayan ve danışma biçimi içindir: Malikilere göre, \"falancının tavsiyesiyle\" derse, hem taraf hem de danışman imzalama veya iptal etme konusunda bağımsızdır, çünkü tavsiye için onay gerekmez; ancak \"falancının seçimi üzerine\" veya \"onun rızası\" derse, kabul edilen görüş delegasyondur, ajans değil, dolayısıyla tarafın sonuçlandırma veya iptal etme bağımsızlığı yoktur. Bu iki terim, \"İsterse devam edebilir ve isterse geri dönecek\" gibi kendilerine yakın olanlarla sınırlı tavsiyelerle birlikte gelir. Şafiilere göre, seçenek dışarıdan gelen kişi için devretme veya tahkim yoluyla geçerlidir, yetki yoluyla değil, ki bu onlara göre en doğrusudur. Abu Ya'la bu durumda seçeneğin geçerli olmadığını söyledi. {atı:fiqh-mawsua-kuwaitiyya-noor-v3 s.7938} Danışma veya danışma koşulu: Şafiilere göre iki görüş vardır: biri, yüklenicinin danıştığını söyleyip iptal edilmesi emredilmeden sözleşmeyi iptal etmediği; ikincisi ise danışmanın gerekli olmadığıdır, bu da el-Nawawi tarafından doğrulanmıştır. Danışma için birini atanmak gerekir; eğer \"danışmak\" dediği belirtilmeden bu yeterli değildir ve Al-Adhra'i bunun görünürdeki anlamının toplumsal olduğunu söylemiştir. Araştırmacı bu konuda bir Hanefi metni bulamamıştır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7938} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7939} Opsiyonda temsil: Opsiyon, statüsü ne olursa olsun, sahibi olsun, vasi veya vekil olsun, kendisi için koşan kişi için oluşturulur. Vasilik ve vasilik için opsiyon şartı reşit olmayanın sorumluluğundadır ve vekil olarak opsiyon, sözleşme emriyle opsiyonu da kapsar; spekülatör ve ortak ise şirket sözleşmesini serbest bırakarak bir şirket sahibi olur veya opsiyon şartını müzakere eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7939} Şafi'lere göre vekil: Vekselin opsiyon koşulu kendisi veya asıl için geçerlidir ve satış temsilcisi alıcı için opsiyonu belirlemekte yasaktır, satın alma temsilcisi ise satıcı için bunu şartlandırmalıdır. Eğer işlem geçersizse, asıl izin vermedikçe opsiyon bir koşulu aşmaz. Hanbaliler, temsilcinin kendisi için koşulunun geçerliliği açısından benzer ve temsilci, emanet edildiği için asıl sorumlusunun çıkarları doğrultusunda hareket etmelidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7940} Çoklu taraflar: Opsiyon, tek taraf için kurulduğu gibi, birden fazla taraf varsa da birden fazla taraf varsa (örneğin bir şey satan iki ortak veya bir mal sahibi iki tarafa satıp her ikisi için de opsiyon koşmuştur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7940} Opsiyonun sözleşme kararı üzerindeki etkisi: Opsiyon, opsiyon sahibinin lehine olan şartın sözleşme kararının belirlenmesini engeller ve bu, Abu Hanifa ile iki yoldaşı arasında kararlaştırılmıştır; ayrıca Abu Hanifa tarafından diğer taraf için de geçerlidir; her iki yazar da kararın seçeneği olmayanlara uygulandığını belirtmiştir. Al-Kasani kararı, opsiyon kaldırılana kadar koşulun bilinmemesi anlamında durdurulur. Şafiilere göre, bir sufuf opsiyon süresi dolmadan alıcıya veya satıcıya devredilmez, Malikilere göre ise dükkanın mülkiyeti satıcıda kalır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7940} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7941} Opsiyonun mülkiyet devri üzerindeki etkisi: Eğer opsiyon onlara aitse, Hanefilere göre satılan eşya satıcının mülkiyetinden veya alıcının mülkiyetinden çıkmaz. Şafi'ler opsiyon süresi dolana kadar mülkiyeti elinde tutar, Hanbaliler ise mülkiyeti sözleşmeyle alıcıya devreder. Opsiyon onlardan birine aitse: Malikiler, mülkiyet satıcıya ait ve imza devredilir. Onların görüşüne göre mülkiyet alıcıya aittir, Ahmad ise vakıftır; opsiyon satıcıya aitse, mülkiyet ona aittir ve alıcı mülkiyeti sahipsiz bırakır. Satıcının işlemi geçerlidir ve iptal sayılır. Opsiyon alıcıya aitse, mülkiyet satıcıdan alınır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7941} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7942} Hanefilere göre opsiyonun konumuna ilişkin sorumluluk: Opsiyon satıcıya aitse ve ürün teslim edilmeden kaybolursa, garanti ona aittir; alıcının elinde ölürse ve opsiyon sona ererse, garanti fiyat üzerindedir; eğer opsiyon satıcının elinde kaybedilirse, teminat yükleniciye ait olduğu için değer için ona aittir; opsiyon alıcıya aitse ve bozulursa, garanti fiyat içindir çünkü kayıp hasara yol açan bir kusura eşdeğerdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7942} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7943} Opsiyon yerinin başkalarıyla olan sorumluluğu: Malikis'e göre, sorumluluk satıcıya aittir; eğer bir eşya yokluğunda zarar görmedikçe ve zarar olduğuna dair kanıt yoksa alıcı sorumludur; Şafi'lere göre, satılan eşya mülkiyetten sonra ilahi bir bela tarafından zarar görürse ve opsiyon satıcıya verilirse, satış iptal edilir. Opsiyon alıcıya aitse, iptal edilmez çünkü mülkiyet alıcıya aittir, sorumluluk ise alıcıdadır, ancak ölçü ve tartılan kişi ancak tartma veya tartma yoluyla sorumlu tutulur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7944}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7945} Tercih edilen yere eklemeler: Hanafiler eklemeyi dört türe ayırır: bağlı ve orijinal, örneğin ghee, bara ve olgunluk; bağlı ve kökensiz, boyama, dikiş, inşaat ve dikim gibi; ayrı ve çocuk, meyve, süt, yumurta ve yün gibi; ve kökensiz ayrı, örneğin kiralık verim, suçlunun kokusu ve tedavi edilemez gibi. Hanafi olmayanlar eklemeyi sürekli ve ayrı olarak bölmekle yetinirler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7946} Hanefilere göre ekleme hakkı: İlke, geri dönüşü engellemesidir, bu yüzden sözleşme bağlayıcıdır ve fazlalık alıcıya aittir, ayrı ve doğmamış olanlar hariç, bunlar anlaşmayla geri dönüşü engellemez. Doğumun sürekliliği tartışmalıdır. Ayrılmış, doğmamış olanı iptal etmeyi seçerse, Ebu Hanifa mal bağışlı olduğu için asıl parayı ve fazlasını geri verir; iki sahibi ise fazlanın alıcıya ait olduğunu söyler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7946} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7947} Sürekli artış oluştu: Abu Hanifa ve Abu Yusuf, bunun opsiyonu geçersiz kıldığını ve sahibinin orijinal ile eklemeye sahip olduğunu söyledi. Muhammed, opsiyonun geçersiz olmadığını ve onaylama veya iptal etme hakkına sahip olduğunu söyledi. {Kaynak:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 s.. 7947} Malikilere göre fazla eşyalar: Çocuklar ve yün, satılan ürünün kalan parçası oldukları için alıcıya aittir; süt, yağ, yumurta ve suç mızrağı gibi diğer her şey satıcıya aittir; çünkü opsiyon anında sahiplik, opsiyon sahibi opsiyonunu kullanana kadar satıcıda kalır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7947} Şafi'lere göre eklemeler: Opsiyon sırasında ayrı eşyalar mülkün sahibine aittir; opsiyon onlara aitse, satılan eşya üzerindeki karar gibi askıya alınır ve ekli eşyalar orijinal değere göre hareket eder, satış anındaki yük ise orijinal gibidir. Hanbaliler için ise, tüm eklemeler alıcıya aittir, bağlı ve ayrı, satılan eşya satıcının mülkiyetinde olmadan önce olsa bile, ve \"Kharaj by Liability hadis\" kullanılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7947} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7948} Opsiyon süresi içinde iki yedek ürünün teslimi: Serbest bırakılma zamanındaki opsiyon dönemi içinde iki yedek ürün teslim edilmemelidir. Satıcı, satılan ürünü ilk teslim etmek zorunda değildir, alıcı da fiyatı teslim etmek zorunda değildir; süre dolmadan veya opsiyon sahibi opsiyonunu kaybetmedikçe fiyatı teslim etmez. Tercih ile teslim, test amaçlı ise opsiyonu geçersiz kılmaz; mülkiyet yoluyla ve opsiyon satıcıya aitse, opsiyon geçersiz sayılır. Biri gönüllü teslim eder diğeri reddederse, Abu Hanifa ve Şafiilere göre zorunlu değildir ve Müslüman geri alabilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7948} {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.7949} Opsiyon kullanılmadan kaybedilir: vasisi sözleşmeyi imzalayan çocuk için ergenliğe ulaştığında, ya da akıl hastalığı veya benzeri durumlar nedeniyle ve seçeneği olan kişinin ölümü, anlaşmazlığa göre. Abu Yusuf, çocuğun opsiyonla ergenliğinin vasi için seçeneği geçersiz kıldığını ve sözleşmeyi bağlayacağını savunur ve Muhammed bunun kaybetmediğini, ancak rivayetlerin farklılık gösterdiğini söyler. Akıl hastalığı durumu seçeneği geçersiz kılmaz; aksine, tüm süre iptal edilmeden geçer. Eğer bu süre boyunca bilinç kazanırsa, seçenek Hanefilere göre en doğru olanına göre değerlendirilir. Malikilere göre, opsiyon sahibi delirir ve uyanmayı beklemezse, yetki onun için en iyisini düşünmelidir. {cite:fiqh-mawsua-kuwaitiyya-v3 s.7949} {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.7950} Opsiyon, sözleşmenin imzalanması veya süresinin sona ermeden geçmesi, ya da sözleşmenin feshi ile sona erer. Açık izin veya gösterge, örneğin satılan eşyanın elden çıkarılması gibi, sahibin satış, hediye veya ipotek eylemidir ve diğer sözleşme tarafının lisansı bilmesi gerekmez. Ayrıca, opsiyon sahibinin bir bedel karşılığında uzlaşması da mümkündür, bu nedenle opsiyon feragat edilir ve satış gelir elde eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7951} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7952} Opsiyon sahibinin ölümü: Hanafiler ve Hanbali'lere göre, opsiyon onun ölümünde feragat edilirken, Maliki ve Şafii'lere göre varislerde kalır. Seçeneği olan kişinin ölümü ise geçersiz olmaz; aksine, sahip olduğu için mirasçılara geri verilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7951} Opsiyon, süresinin sona ermesiyle sona erer: Genel olarak kabul edilir çünkü opsiyon geçicidir ve sözleşmeye bağlayıcı olan varsayılan durumdur. Süre geçtikten sonra sözleşmenin şartı belirlenir. Malikiler, vadelerin sona ermesini opsiyonun sonu olarak kabul eder, imzalama değil; satılan ürün alıcının elindeyse bu bir imzadır; eğer satıcının elindeyse bu bir iptal olur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7953} Opsiyonun iptal yoluyla sona erdirilmesi: iptal açıkça 'Satışı geri çektim' veya 'Fiyatı iade ettim' gibi ifadelerle ya da bir eylemi belirterek yapılır. Fiili iptal, iade gerektiren eylemdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7953} Kanunla iptal: Opsiyon sahibi, satılan ürünü sahibin sahibi olarak elden çıkarırsa veya opsiyon alıcıya aitse eşya eşya içinde ise, iptal sayılır; borç ise pratikte iptal edilemez, çünkü fiyatlar şart koşulla belirlenmez. Bunun nedeni, bu işlemin mülkiyetin elinde tutulmasının kanıtı olması ve ancak iptal yoluyla gerçekleşmesidir. İbn el-Hammam ve el-Kasani, satıcının satılan üründe bulduğu şeyin, fiyatta bulunursa, izin olacağını, bunun da satışın iptali anlamına geldiğini belirtmişlerdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7954} Hanefilere göre iptal tafareleri arasında: yemek, içmek ve giymek seçeneği geçersiz kılar. Kadikhan'ın fetvalarında bir kez takmak seçeneği geçersiz kılmaz; kitaptan kopyalamak iptal etmez ve kitap incelendiğinde feragat edilir; hayvana binip onu sulamak, çıkarmak veya beslemek bir gruptan alınmış ruhsattır. Qadihan, dükkan, hediye veya ipotek satmanın seçeneği geçersiz kıldığını, hediye veya ipotekle teslim edilmeden iptal edilmediğini; kira başkalarına teslim edilmese bile iptal edildiğini; Ebu Bekir bin el-Fadl, teslimi test olarak ayırır ve seçimi geçersiz kılmaz, teslim ise mülkiyettir ve böylece geçersiz kılar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7954} {Kaynak:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 s.. 7955} İptalin geçerliliği koşulları: Opsiyonun kurulması; diğer taraf Ebu Hanifa ve Muhammed'e göre iptalden haberdardı, eğer bu onun haberi olmadan gerçekleştiyse, ek olarak kabul edilir ve opsiyon süresi içinde biliniyorsa uygulanır. Sözleşme, süre kendisine ulaşmadan geçerse bağlayıcıdır; Ebu Yusuf'un üç görüşü vardır, bilinen görüş bilginin gerekli olmadığıdır ve İbn al-Humam bunu tercih etmiştir. Bilgi zorunluluğu olmaması çoğunluk görüşüdür (Maliki, Şafii ve Hanbali mezhebeleri). Ve bu iptal işlemi ayırmaz, bu yüzden sözleşme bazı durumlarda sonuçlanmaz, bazılarında iptal edilir. Şafiilere göre doğru görüş yasaktır, Malikiler ise hepsini reddetmek zorundadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7955} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7956} Ölüm durumunda koşul seçeneğinin devri: Malik ve Al-Shafi'i tarafından belirlenmiştir ki, opsiyon varise geçer ve mülkün onarılması için sabit bir hak, örneğin ipotek gibi, gerekçelendirilir. \"Kim para veya hak bırakırsa, miras alır.\" hadisini aktarırlar. Bildiği kadarıyla \"hak\" kelimesiyle ilgili bir rivayet doğrulanmamıştır; Hanefilere göre, bu kişisel bir özellik ve devredilemez bir vasiyet olduğu için miras sayılmaz. Hanbaliler, vefat eden kişinin ölümünden önce talep etmediği sürece opsiyonun miras alınmadığını, İbn Kudema'nın görüşüne göre, opsiyon sahibinin ölümüyle geçersiz olur ve diğer hakkın seçeneği kalır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7956} {Kaynak:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s. 7957} Akıl hastalığı ve bayılma nedeniyle seçeneğin aktarılması: Şafiilere göre, seçenek akıl hastalığı veya bayılma nedeniyle sona ermez; aksine, vasi veya hükümdar onun yerine hareket eder ve şans hakkına göre iptal eder veya izin verir, hakim ise anlaşılır bir belirti olmadan dilsiz kalan birine vekil atar. Malikilere göre, akıl hastalığı ile bayılma arasında bir ayrım yapılır: Eğer seçeneğe sahip kişi delirir ve uyanmayı ummazsa ya da bu durum diğerine zarar vermek için uzatırsa, yetki neyin daha iyi olduğuna karar verir. Uyanan kişi iptal veya izin verir, kanıt varsa vasi eylemini iptal eder; bilinçsiz kişi uyanışını bekleyerek kendi seçimini yapar; eğer tercih ettiği zamandan sonra uyanırsa görev süresi devam eder. {atı:fiqh-mawsua-kuwaitiyya-noor-v3 s.7957} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7958}"
  id: "Opsi syarat adalah istilah gabungan berdasarkan apa yang ditetapkan dengan menetapkan bahwa salah satu pihak yang mengikat harus memilih antara penandatanganan dan pembatalan; Ibn Arafa dari Malikis mendefinisikannya sebagai penjualan yang pertama kali menghentikan akhir kontrak yang ditandatangani yang diharapkan. Nama-namanya adalah: opsi bersyarat (dibedakan dari opsi penilaian sebagai opsi cacat), opsi narasi, dan penjualan opsi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7923} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7924} Legitimasinya: Mayoritas ahli hukum menganggapnya sebagai hukum yang diperbolehkan yang tidak bertentangan dengan kontrak, berdasarkan hadits Ibn Umar dan Ibn Munqidh: 'Jika Anda menjual, katakan tidak ada keringanan,' dan 'Anda memiliki opsi untuk tiga malam,' dan ini disepakati oleh al-Nawawi dan Ibn al-Humam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7924} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7925} Kata-katanya: tidak memerlukan kata-kata khusus; setiap kata yang menunjukkan pilihan, seperti persetujuan atau kehendak, sudah cukup. Hal ini dapat ditetapkan oleh kebiasaan Maliki seolah-olah orang sepakat pada suatu opsi dalam sebuah produk. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7925} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7926} Syarat-syarat keabsahannya: Harus sesuai dengan kontrak atau dalam perhimpunannya menurut Shafi'i dan Hanbali; Hanafi menganggap keterikatannya setelah kontrak sebagai bagian dari kontrak tersebut; dan harus bersifat sementara untuk periode yang diketahui menurut mayoritas, karena pilihan mutlak menyebabkan ketidaktahuan besar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7926} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7928} Durasi: Batas minimumnya tidak ditentukan dan diperbolehkan bahkan untuk sesaat; batas maksimum: Pandangan Ahmad, Muhammad ibn al-Hasan, Abu Yusuf, dan lainnya mengizinkan periode apa pun melalui delegasi. Pemilik batas maksimum meminta larangan selama periode luar biasa; pemilik dapat membatasinya sesuai kebutuhan dan kebiasaan sesuai dengan barang yang dijual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7929} Tujuan opsi ini: memungkinkan pihak kontrak merenung dan bereksperimen, serta memenuhi kebutuhan orang akan nasihat dan pengujian; durasi opsi menurut Malikis sejauh barang yang dijual diuji dan dikonsultasikan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7929} Durasi opsi dalam properti: maksimum satu bulan, diikuti enam hari, dengan perpanjangan maksimum opsi yang diizinkan adalah tiga puluh enam hari; dua hari ditambahkan pada periode untuk memungkinkan pembeli mengembalikan barang jika barang tersebut berada dalam kepemilikan mereka saat kedaluwarsa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7930} Hewan: Jika pilihannya adalah mengetahui kekuatan, makanan, dan harga mereka, maka maksimal tiga hari; jika ujian dilakukan di dalam negeri, maka sekitar satu hari; di luar sana, ada barid di Ibn al-Qasim dan baridan di Ashhab (barid: jarak setengah hari berjalan kaki); dan barang lain seperti pakaian, persembahan, dan pakaian wanita memiliki maksimal tiga hari dan tambahan satu hari. Adapun sayuran dan buah-buahan, durasinya diperkirakan sesuai kebutuhan ujian sebelum berubah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7930} Pendekatan ketiga membatasi opsi hanya tiga hari dan malam, terlepas dari yang dikontrakkan, dan melarang penyeberangan. Ini adalah pandangan Abu Hanifa, Zafar, dan Al-Shafi'i dalam pendapat terkenal darinya. Mereka mengutip hadits Hibban ibn Munqidh dan hadis Al-Misra: \"Siapa pun yang membeli domba pengumpul adalah yang terbaik dari dua hari.\" Al-Shafi'i mengatakan bahwa ketika pilihan ditetapkan oleh teks, ia berhenti pada tiga. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7930} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7931} Penambahan ketiga: menurut Abu Hanifa, kontrak tidak sah, tetapi menurut Al-Shafi'i, kontrak itu tidak sah; Abu Hanifa secara unik berpendapat bahwa menghapus penambahan akan mengesahkan kontrak kecuali tiga hari telah berlalu, dan Zafar membantahnya karena tetap ada bergantung pada status yang telah ditetapkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7932} Keluarga Malik menganggap ini sebagai bentuk korupsi jika memerlukan konsultasi dengan seseorang yang pendapatnya tidak diketahui sampai masa jabatan berakhir, dan persyaratan produk harus jauh lebih panjang dari produk asli. Kenaikan kecil tidak merugikan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7932} Pilihan mutlak mengenai durasi: Sekolah-sekolah memiliki empat pendekatan. Yang pertama adalah ketidakabsahan atau ketidakabsahan kontrak: Syafi'i dan Hanbalis menyatakan hal ini dalam salah satu dari dua narasi, dan para Hahanfi menyatakan kontrak tersebut tidak sah tanpa membedakan antara ketidaktahuan berat dan yang dekat. Kontrak menjadi berlaku menurut Abu Hanifa dan dua sahabatnya jika pembatalan hilang dalam tiga hari, dan hanya di antara dua sahabat, meskipun setelahnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7933} Yang kedua adalah ketidakabsahan kondisi tanpa kontrak: sebuah narasi oleh Ahmad dan mazhab Ibn Abi Layla. Ketiga: Keabsahan kontrak dan perubahan kondisi: Hakim menentukan periode biasa untuk menguji properti dengan pemilik, dan Ibn Taymiyyah percaya bahwa harus ditetapkan selama tiga hari jika ia melepaskannya. Keempat: Keabsahan kontrak dan ketentuan tetap tanpa syarat, menurut pandangan Ibn Shubrumah dan pendapat Ahmad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7932} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7933} Membuat opsi ini melanggengkan kondisi yang merusak, seperti mengatakan 'tidak pernah' atau 'hari' tanpa ketentuan tertentu. Waktu pada waktu yang tidak diketahui tidak sah, apakah ketidaktahuan seberat angin, hujan yang datang, kematian si anu, kelahiran wanita hamil, atau yang dekat seperti panen, diya, dan kedatangan peziarah. {cite:fiqh-mawsua-kuwaitiya-noor-v3 hlm.7933} asalkan periode opsi dimulai segera setelah kontrak ditandatangani. Jika ditetapkan pada akhir bulan atau hari berikutnya, kontrak tersebut tidak sah menurut Hanafi, Shafi'i, dan Hanbali, tetapi Hanafi memperbaikinya dengan menerapkan periode interval, seperti opsi dua hari setelah Ramadan dalam kontrak yang berakhir dengan penandatanganan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7933} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7934} asalkan bagian-bagian periode tersebut berturut-turut; jika satu hari ditetapkan dan satu hari tidak, menurut Hanbali, ada dua sisi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7934} Menentukan hak opsi: Tidak sah jika opsi tersebut tidak diketahui. Jika diberikan kepada salah satu dari mereka dan bukan kepada individu atau kepada siapa yang diinginkan, maka dianggap tidak sah menurut Ibn Qudamah. Pandangan yang lebih benar adalah bahwa penjualan sah jika opsi ditetapkan untuk salah satu dari mereka dan bukan untuk yang lain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7934} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7935} Kontrak yang termasuk dalam opsi syarat adalah kontrak yang diperlukan yang dapat dibatalkan; penjualan adalah bidang utamanya dan mencakup penjualan yang tidak sah, penjualan Murabaha, dan yang serupa. Penjualan, transaksi, dan penjualan riba semacam itu dikecualikan menurut mayoritas Hanbali karena syarat menerima kompensasi. Ibn Abidin memperingatkan bahwa pengecualian salam dan pertukaran adalah pelanggaran aturan, dan Malikis mengizinkannya dalam jangka waktu pembayaran yang singkat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7935} Ijarah: Opsi berlaku menurut Hanafi dan Maliki, dan Shafi'i serta Hanbal membatasinya hanya untuk sewa selama periode yang tidak mengikuti kontrak. Transfer: diterima oleh Hanafi, tetapi tidak oleh Shafi'i dan Hanbalis karena tidak didasarkan pada profitabilitas. Pembagian: berbeda di dalamnya; pembagian jenis berbeda adalah kesepakatan bersama, bukan paksaan, dan pembagian nilai yang sama tunduk pada opsi menurut pandangan yang benar. Dan kafalah: dimasukkan menurut Hanafi, dan diperbolehkan bagi Abu Hanifa untuk memperpanjangnya lebih dari tiga hari karena didasarkan pada perluasan. Waqf: Ini berlaku untuk Abu Yusuf tanpa Muhammad, Al-Shafi'i, atau Ahmad. {cite:Fiqh-Mawsua-Kuwaityya-Noor-V3 hlm.7935} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7936} Opsi ini untuk salah satu atau kedua pihak: sah untuk menetapkannya untuk salah satu atau keduanya, yang merupakan pendapat mayoritas. Dinarasikan dari Al-Thawri dan Ibn Shubrumah bahwa opsi itu sepenuhnya milik pembeli. Sah untuk mensyaratkannya kepada pihak lain selain kontrak, yang disepakati oleh para ahli hukum asalkan pendapat tersebut sah. Dasar Hanafi adalah preferensi karena kontraktor membutuhkan seseorang untuk mendelegasikan pendapat tersebut, dan berbeda dari Zafar karena pilihan adalah syarat dalam kontrak. {cite:fiqh-mawsua-Kuwaityya-noor-v3 hlm. 7936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7937} Pilihan ini untuk orang yang bukan asing dan bentuk konsultasi: Menurut Maliki, jika ia mengatakan \"atas saran si anu,\" baik pihak kontrak maupun penasihat memiliki kebebasan untuk menandatangani atau mencabut, karena nasihat tidak memerlukan persetujuan; tetapi jika ia mengatakan \"atas pilihan si anu\" atau \"persetujuannya,\" pandangan yang diterima adalah delegasi, bukan agensi, sehingga pihak yang berkontrak tidak memiliki kebebasan untuk membuat keputusan atau membatalkan. Kedua ketentuan ini disertai dengan nasihat yang terbatas pada hal yang terdekat, seperti mengatakan \"Jika ia mau, ia boleh melanjutkan dan jika ia mau, ia akan kembali.\" Menurut para Syafi'i, opsi ini berlaku bagi pihak luar melalui delegasi atau arbitrase, bukan melalui delegasi, yang menurut mereka paling benar. Abu Ya'la mengatakan bahwa opsi tersebut tidak berlaku dalam kasus tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7938} Syarat untuk konsultasi atau konsultasi: Menurut para syafi'i, ada dua pandangan: satu adalah bahwa kontraktor tidak membatalkan kontrak sampai dia mengatakan telah berkonsultasi dan diperintahkan untuk membatalkannya; yang kedua adalah konsultasi tidak diperlukan, yang telah disahkan oleh al-Nawawi. Perlu menunjuk seseorang untuk berkonsultasi; jika dia mengatakan \"berkonsultasi\" tanpa menyebutkan, itu tidak cukup, dan Al-Adhra'i mengatakan makna yang tampak bersifat komunal. Peneliti tidak menemukan teks Hanafi mengenai hal ini. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7938} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7939} Representasi dalam opsi: Opsi ditetapkan untuk orang yang menetapkannya untuk dirinya sendiri, tanpa memandang statusnya, baik pemilik, eksekutor, wali, atau agen. Persyaratan opsi untuk wali dan wali adalah tanggung jawab anak di bawah umur, dan dalam agen opsi mencakup opsi berdasarkan perintah kontrak, dan spekulan serta mitra memiliki perusahaan yang ditahan atau menegosiasikan syarat opsi dengan melepaskan kontrak perusahaan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7939} Agen menurut Shafi'is: Syarat opsi agen berlaku untuk dirinya sendiri atau prinsipalnya, dan agen yang dijual dilarang menetapkan opsi untuk pembeli, dan agen pembelian harus menetapkannya untuk penjual. Jika tindakan tidak sah, kecuali prinsipal mengizinkan, opsi tidak melebihi satu syarat. Hanbalis serupa dalam keabsahan kondisi agen untuk dirinya sendiri, dan agen harus bertindak demi kepentingan terbaik prinsipalnya karena ia dipercayakan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7940} Beberapa pihak: Sama seperti opsi ditetapkan untuk satu pihak jika hanya ada satu pihak yang berkontrak, maka opsi ditetapkan untuk beberapa pihak jika ada beberapa pihak yang berkontrak, seperti dua mitra yang menjual sesuatu atau pemilik yang menjual komoditas kepada dua pihak dan menetapkan opsi untuk keduanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7940} Dampak opsi terhadap putusan kontrak: Opsi ini mencegah penetapan putusan kontrak untuk kondisi yang menguntungkan pemegang opsi, dan hal ini disepakati antara Abu Hanifa dan kedua rekannya, serta menurut Abu Hanifa mengenai pihak kontrak lainnya; kedua penulis mengatakan putusan ini berlaku bagi mereka yang tidak memiliki pilihan. Putusan ini dihentikan oleh Al-Kasani dalam arti bahwa kondisi tersebut tidak diketahui sampai opsi tersebut dihapuskan. Menurut syafi'i, sufuf tidak diputuskan dialihkan kepada pembeli atau penjual sampai opsi tersebut berakhir, sementara menurut Maliki, kepemilikan toko tetap berada di tangan penjual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7940} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7941} Dampak opsi terhadap pengalihan kepemilikan: Jika opsi milik mereka, menurut Hanafi, barang yang dijual tidak keluar dari kepemilikan penjual maupun harga dari kepemilikan pembeli. Shafi'i memegang kepemilikan sampai opsi berakhir, sementara Hanbalis mengalihkan kepemilikan kepada pembeli melalui kontrak. Jika opsi milik salah satu dari mereka: Maliki, kepemilikan tetap milik penjual dan tanda tangan dialihkan. Pandangan mereka adalah bahwa kepemilikan milik pembeli, dan Ahmad adalah wakaf; jika opsi milik penjual, maka kepemilikan menjadi miliknya, dan pembeli melepaskan kepemilikan tanpa kepemilikan. Tindakan penjual sah dan dianggap pembatalan. Jika opsi milik pembeli, kepemilikan dicabut dari penjual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7941} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7942} Tanggung jawab atas lokasi opsi menurut Hanafis: Jika opsi milik penjual dan barang hilang sebelum dimiliki, maka garansi ada padanya; jika barang mati dalam kepemilikan pembeli dan opsi berakhir, garansi tergantung pada harga; jika mati sebelum opsi penjual berakhir, garansi menjadi tanggung jawab atas nilai karena dimiliki kontraktor; jika opsi milik pembeli dan mati, garansi adalah atas harga karena kerugian setara dengan cacat yang menyebabkan kerusakan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7942} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7943} Tanggung jawab atas tempat opsi terhadap pihak lain: Menurut Malikis, tanggung jawab berada pada penjual, kecuali suatu barang rusak secara in absentia dan tidak ada bukti kerusakannya, dalam hal ini pembeli bertanggung jawab; menurut syafi'i, jika barang yang dijual rusak akibat wabah ilahi setelah memiliki dan opsi diberikan kepada penjual, penjualan dibatalkan. Jika opsi milik pembeli, maka tidak dicabut karena menjadi tanggung jawab kepemilikannya. Menurut Hanbalis, kepemilikan milik pembeli dan tanggung jawab ada padanya, tetapi ukuran dan yang ditimbang tidak menjadi tanggung jawab kecuali dengan menimbang atau menimbang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7944}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7945} Penambahan di tempat pilihan: Hanafi membagi penambahan menjadi empat jenis: terhubung dan asli, seperti ghee, bara, dan kematangan; terhubung dan tidak asal, seperti pewarnaan, menjahit, membangun, dan menanam; terpisah dan dihasilkan seperti anak, buah, susu, telur, dan wol; serta terpisah tanpa asal, seperti hasil yang disewa, aroma penjahat, dan yang tidak dapat disembuhkan. Non-Hanafi puas membagi penambahan menjadi kontinu dan terpisah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7946} Putusan penjumlahan menurut Hanafi: Prinsipnya adalah mencegah pengembalian, sehingga kontrak mengikat dan kelebihan menjadi milik pembeli, kecuali yang terpisah dan yang belum lahir, yang tidak mencegah pengembalian melalui kesepakatan. Kontinuitas kelahiran diperdebatkan. Jika ia memilih untuk membatalkan yang terpisah dan belum lahir, Abu Hanifa mengembalikan yang asli beserta kelebihan karena properti tersebut telah diwakani, dan kedua pemilik mengatakan kelebihan tersebut milik pembeli. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7946} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7947} Peningkatan yang terus-menerus dihasilkan: Abu Hanifa dan Abu Yusuf mengatakan bahwa opsi tersebut dibatalkan, dan pemiliknya memiliki opsi asli dan penambahan. Muhammad mengatakan opsi tersebut tidak dibatalkan dan berhak untuk mengesahkan atau membatalkannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.. 7947} Barang berlebih menurut Maliki: Anak-anak dan wol menjadi milik pembeli karena merupakan bagian yang tersisa dari barang yang dijual, dan barang lain milik penjual, seperti susu, ghee, telur, dan tombak kejahatan, karena kepemilikan pada saat opsi tetap berada di tangan penjual sampai pemegang opsi menggunakan opsinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7947} Penambahan menurut syafi'i: Barang terpisah pada saat opsi milik mereka yang memiliki properti; jika opsi itu milik mereka, barang tersebut ditangguhkan seperti aturan atas barang yang dijual, dan barang yang terlampir mengikuti nilai asli, dan beban yang ada saat penjualan sama seperti asli. Adapun Hanbali, semua tambahan milik pembeli, terhubung dan terpisah, meskipun barang yang dijual sudah dimiliki penjual sebelum dimiliki, dan mereka menggunakan hadits \"kharaj by liability.\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7947} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7948} Pengiriman dua pengganti selama periode opsi: Disepakati bahwa kedua pengganti tidak boleh diserahkan selama periode opsi pada saat pelepasan. Penjual tidak wajib menyerahkan barang yang terjual pada awalnya, dan pembeli tidak boleh menyerahkan harga kecuali periode telah berlalu atau pemegang opsi kehilangan opsinya. Pengiriman atas pilihan tidak membatalkan opsi jika untuk tujuan pengujian, dan jika itu karena kepemilikan dan opsi milik penjual, opsi tersebut dibatalkan. Jika satu menyerahkan secara sukarela dan yang lain menolak, ia tidak dipaksa menurut Abu Hanifa dan para Shafi'i, dan Muslim dapat mengklaim kembali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7948} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7949} Opsi hilang sebelum digunakan: saat mencapai pubertas bagi anak yang walinya telah mengontrak kontrak, atau karena gangguan jiwa atau kasus serupa, dan kematian orang dengan opsi tersebut, menurut perselisihan. Abu Yusuf berpendapat bahwa pubertas anak di bawah umur dengan opsi tersebut membatalkan opsi untuk wali dan mengikat kontrak, dan Muhammad mengatakan opsi itu tidak dihapuskan, tetapi narasi berbeda. Kondisi kegilaan tidak membatalkan opsi itu sendiri; melainkan, seluruh periode berlalu tanpa pembatalan. Jika dia sadar kembali selama masa itu, opsi dipertimbangkan sesuai dengan yang paling benar menurut Hanafi. Menurut Malikis, jika pemilik opsi menjadi gila dan tidak berharap bangun, otoritas harus mempertimbangkan apa yang terbaik untuknya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7949} {cite::fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7950} Opsi berakhir dengan penandatanganan kontrak atau masa berlakunya berakhir tanpa pengakhiran, atau dengan pengakhiran kontrak. Penandatanganan dengan izin eksplisit atau dengan indikasi, seperti menjual barang yang dijual, adalah tindakan penjualan, hadiah, atau hipotek pemilik, dan pihak kontrak lainnya tidak diwajibkan mengetahui lisensi tersebut. Pemilik opsi juga diperbolehkan untuk menerima imbalan, sehingga opsi dihapus dan penjualan pun dilanjutkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7951} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7952} Kematian pemilik opsi: Menurut Hanafi dan Hanbali, opsi tersebut dilepaskan setelah kematiannya, sedangkan menurut Malikis dan Shafi'i, opsi tetap berada di tangan ahli waris. Adapun kematian orang yang memiliki opsi, opsi tersebut tidak berakhir; sebaliknya, tetap berada di tangan pemiliknya dan dikembalikan kepada ahli waris. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7951} Opsi berakhir dengan berakhirnya masa berlaku: Secara umum disepakati karena opsi bersifat sementara, dan mengikat kontrak adalah default. Setelah periode berlalu, syarat kontrak ditetapkan. Keluarga Malik menganggap berakhirnya jangka waktu sebagai akhir opsi, bukan tanda tangan; jika barang yang dijual berada di tangan pembeli, maka itu tanda tangan; jika berada di tangan penjual, maka itu adalah pembatalan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7953} Pengakhiran opsi dengan pembatalan: pembatalan tersebut secara eksplisit dengan mengatakan, seperti 'Saya membatalkan penjualan' atau 'Saya mengembalikan harga,' atau dengan menunjukkan suatu tindakan. Pembatalan aktual adalah tindakan yang memerlukan restitusi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7953} Pembatalan melalui tindakan: Pembatalan adalah jika pemilik opsi melepaskan barang yang dijual sebagai pemilik, atau jika opsi tersebut berada dalam item jika opsi tersebut milik pembeli; sedangkan untuk utang, tidak dapat dicabut dalam praktiknya, karena harga tidak selalu ditentukan oleh spesifikasi. Alasannya adalah bahwa tindakan ini merupakan bukti mempertahankan kepemilikan, dan penahanan hanya terjadi melalui pembatalan. Ibn al-Hammam dan al-Kasani mengatakan bahwa apa yang ditemukan oleh penjual dalam barang yang dijual, jika ditemukan dalam harga, akan menjadi izin, yang merupakan indikasi pembatalan penjualan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7954} Di antara hal-hal semantik pembatalan menurut Hanafi: makan, minum, dan berpakaian membatalkan opsi tersebut. Dalam fatwa Qadikhan bahwa memakainya sekali tidak membatalkan opsi tersebut; menyalin dari buku tidak membatalkannya, dan jika buku dipelajari, maka dibebaskan; menunggang binatang untuk minum, mengambil, atau memberinya makan adalah izin dari kelompok. Qadikhan menyatakan bahwa menjual toko, hadiah, atau hipotek dengan pengiriman membatalkan opsi tersebut, dan tidak membatalkan dengan hadiah atau hipotek tanpa pengiriman; sewa dibatalkan meskipun tidak diserahkan kepada orang lain; Abu Bakr ibn al-Fadl membedakan antara penyerahan sebagai ujian dan tidak membatalkan opsi, sedangkan pengiriman adalah kepemilikan dan dengan demikian membatalkan kepemilikan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7954} {cite:fiqh-mawsua-Kuwaitiyya-noor-v3 p.m. 7955} Syarat keabsahan pembatalan: Penetapan opsi; dan pihak kontrak lainnya mengetahui pembatalan menurut Abu Hanifa dan Muhammad, dan jika terjadi tanpa sepengetahuannya, maka dianggap sebagai akhiran dan ditegakkan jika diketahui selama periode opsi. Kontrak mengikat jika periode berlalu tanpa sampai kepadanya; Abu Yusuf memiliki tiga pendapat, pandangan yang dikenal adalah bahwa pengetahuan tidak diperlukan, dan Ibn al-Humam lebih memilih itu. Ketidakwajiban pengetahuan adalah pendapat mayoritas (aliran Maliki, Shafi'i, dan Hanbali). Dan pembatalan itu tidak menyebabkan pemisahan transaksi, sehingga kontrak tidak berakhir dalam beberapa kasus dan dibatalkan dalam kasus lain. Menurut para Shafi'i, pandangan yang benar adalah larangan, sementara Maliki wajib menolak semuanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7955} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7956} Pemindahan opsi syarat setelah kematian: Malik dan Al-Shafi'i menetapkan bahwa opsi tersebut berpindah ke ahli waris, dan dibenarkan bahwa itu adalah hak tetap untuk memperbaiki properti, seperti hipotek. Mereka mengutip hadits \"Siapa pun meninggalkan uang atau hak, ia mewarisinya.\" Tidak ada autentikasi untuk narasi dengan kata \"hak\" sejauh yang ia ketahui; menurut Hanafi, itu tidak diwariskan karena merupakan atribut pribadi dan wasiat yang tidak dapat dialihkan. Hanbalis mengatakan bahwa opsi tidak diwariskan kecuali almarhum mengklaimnya sebelum kematian, yang menurut Ibn Qudamah bahwa opsi tersebut dibatalkan oleh kematian pemegangnya dan opsi hak lainnya tetap ada. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7956} {cite:fiqh-mawsua-Kuwaitiyya-noor-v3 hlm. 7957} Transmisi opsi karena kegilaan dan pingsan: Menurut syafi'i, pilihan tidak berakhir karena kegilaan atau pingsan; melainkan, wali atau penguasa bertindak menggantikan dan membatalkan atau mengizinkan sesuai hak keberuntungan, dan hakim menunjuk wakil untuk seseorang yang menjadi bisu tanpa indikasi yang dapat dipahami. Menurut Maliki, ada perbedaan antara kegilaan dan pingsan: jika orang yang memiliki pilihan menjadi gila dan tidak berharap bangun atau jika itu berlarutan untuk menyakiti orang lain, otoritas akan mempertimbangkan yang lebih baik. Orang yang terbangun mengizinkan pembatalan atau izin dan membatalkan tindakan wali jika ada bukti; orang yang tidak sadar menunggu kebangunannya untuk memilih sendiri; jika dia bangun setelah waktu pilihan, masa jabatannya dilanjutkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7957} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7958}"
