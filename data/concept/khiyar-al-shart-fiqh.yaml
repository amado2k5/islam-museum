id: concept/khiyar-al-shart-fiqh
class: concept
kind: legal
label:
  ar: خيار الشرط
  en: Khiyar al-shart (option of stipulation)
  ur: خیار الشرط
summary:
  ar: 'خيار الشرط اسم مركب على ما يثبت بالاشتراط لأحد المتعاقدين من الاختيار بين الإمضاء والفسخ؛ وعرفه ابن عرفة من المالكية بأنه بيع وقف بتّه أولا على إمضاء يتوقع. وأسماؤه: الخيار الشرطي (تمييزا عن الحكمي كخيار العيب)، وخيار التروي، وبيع الخيار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7923}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7924} مشروعيته: جمهور الفقهاء يعتبرونه مشروعا لا ينافي العقد، بحديث ابن عمر وحبان بن منقذ «إذا بعت فقل لا خلابة» و«أنت بالخيار ثلاث ليال»، وبالإجماع عند النووي وابن الهمام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7924}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7925} صيغته: لا يتطلب لفظا معينا، فيكفي كل لفظ يدل على الخيار كالرضا أو المشيئة، وقد يثبت بالعرف عند المالكية كما لو تعارف الناس على الخيار في سلعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7925}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7926} شرائط قيامه: أن يكون مقارنا للعقد أو في مجلسه عند الشافعية والحنابلة؛ والحنفية يرون إلحاقه بعد العقد كإدخاله فيه؛ وأن يكون مؤقتا بمدة معلومة عند الجمهور، لأن الخيار المطلق يورث الجهالة الفاحشة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7926}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7927}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7927}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928} المدة: حدها الأدنى غير مقدر فيجوز ولو لحظة؛ وحدها الأقصى: مذهب أحمد ومحمد بن الحسن وأبي يوسف وغيرهم جواز أي مدة بالتفويض، ويستوجه صاحب غاية المنتهى المنع في المدة الخارجة عن العادة؛ ومالك يقيدها بقدر الحاجة والمعتاد بحسب المبيع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7929} الغرض من الخيار: تمكين المتعاقد من التأمل والتجربة، وتحفظ حاجة الناس إلى المشورة والاختبار؛ ومدة الخيار عند المالكية بقدر ما يختبر فيه المبيع ويستشار فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7929}'
  en: 'The option of stipulation (khiyar al-shart) is a compound name for the right, set by stipulation, of one party to choose between confirming and annulling; Ibn Arafa defines it as a sale whose conclusion is held back for a confirmation expected. Other names: the stipulated option (distinguished from the legal option, such as defect), the option of deliberation, and the sale of option. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7923}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7924} Its lawfulness: most jurists hold it lawful and not contrary to the contract, on the report of Ibn Umar and of Habban ibn Munqidh ("when you sell, say: no deceit" and "you have the option three nights"); al-Nawawi and Ibn al-Humam report agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7924}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7925} Wording: no fixed words; any word that conveys the option (consent, will) is enough, and custom counts for the Malikis, as when people have long bargained with an option in a certain sale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7925}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7926} Conditions: it must be stipulated in the contract or its session in the Shafii and Hanbali view; the Hanafis allow it to be added later as if at the contract; it must be limited by a known term, since an unlimited option causes gross ignorance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7926}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7927}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7927}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928} Term: the least is not fixed and may be a moment; for the greatest, Ahmad, Muhammad al-Shaybani, Abu Yusuf and others allow any term by agreement, while Ibn Abi Layla, Ibn Shubruma and others too; Ibn Hubayra and Ibn Mahdi reject a term beyond custom; Malik limits it by need and what is usual for the sale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7929} Purpose: to let the party consider and test the thing; the term under the Malikis is measured by what the thing needs to be tested and consulted about. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7929}'
  ur: 'خیار الشرط: ایک مرکب نام، جو شرط سے ثابت ہونے والا وہ اختیار ہے جو کسی ایک عاقد کو عقد کو برقرار رکھنے یا فسخ کرنے کے درمیان حاصل ہو؛ ابن عرفہ (مالکی) اسے ایسی بیع قرار دیتے ہیں جس کا پکا ہونا کسی متوقع اجازت پر موقوف ہو۔ دوسرے نام: خیار شرطی (حکمی جیسے عیب سے امتیاز کے لیے)، خیار تروّی، بیع الخیار۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7923}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7924} جواز: جمہور اسے عقد کے منافی نہ ہونے کی بنا پر جائز مانتے ہیں، ابن عمر اور حبان بن منقذ کی حدیث «إذا بعت فقل لا خلابة» اور «أنت بالخيار ثلاث ليال» سے استدلال؛ نووی اور ابن الہمام اس پر اجماع نقل کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7924}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7925} الفاظ: کوئی معین لفظ ضروری نہیں، رضا یا مشیئت جیسے کسی بھی لفظ سے ہو سکتا ہے؛ مالکیہ کے نزدیک عرف بھی کافی، جیسے کسی مخصوص سامان میں لوگوں کا خیار رکھنا معروف ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7925}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7926} شرائط: شافعیہ اور حنابلہ کے نزدیک عقد میں یا مجلس میں شرط ہو؛ حنفیہ بعد میں شامل کرنے کو عقد میں شامل کرنے کی طرح جائز کہتے ہیں؛ جمہور کے نزدیک مدت معلوم ہو کیونکہ غیر مقررہ خیار بڑی جہالت پیدا کرتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7926}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7927}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7927}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928} مدت: کم از کم کی کوئی حد نہیں، ایک لمحہ بھی؛ زیادہ سے زیادہ: احمد، محمد بن حسن، ابو یوسف وغیرہ باہمی رضامندی سے کوئی بھی مدت جائز مانتے ہیں؛ ابن ہبیرہ اور ابن مہدی عادت سے زائد کو رد کرتے ہیں؛ مالک ضرورت اور سامان کے عرف کے مطابق مقید کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7929} غرض: عاقد کو غور و فکر اور آزمائش کا موقع دینا؛ مالکیہ کے نزدیک مدت اتنی ہو جتنی آزمائش اور مشورے کے لیے درکار ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7929}'
