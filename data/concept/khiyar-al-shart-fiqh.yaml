id: concept/khiyar-al-shart-fiqh
class: concept
kind: legal
label:
  ar: خيار الشرط
  en: Khiyar al-shart (option of stipulation)
  ur: خیار الشرط
summary:
  ar: 'خيار الشرط اسم مركب على ما يثبت بالاشتراط لأحد المتعاقدين من الاختيار بين الإمضاء والفسخ؛ وعرفه ابن عرفة من المالكية بأنه بيع وقف بتّه أولا على إمضاء يتوقع. وأسماؤه: الخيار الشرطي (تمييزا عن الحكمي كخيار العيب)، وخيار التروي، وبيع الخيار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7923}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7924} مشروعيته: جمهور الفقهاء يعتبرونه مشروعا لا ينافي العقد، بحديث ابن عمر وحبان بن منقذ «إذا بعت فقل لا خلابة» و«أنت بالخيار ثلاث ليال»، وبالإجماع عند النووي وابن الهمام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7924}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7925} صيغته: لا يتطلب لفظا معينا، فيكفي كل لفظ يدل على الخيار كالرضا أو المشيئة، وقد يثبت بالعرف عند المالكية كما لو تعارف الناس على الخيار في سلعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7925}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7926} شرائط قيامه: أن يكون مقارنا للعقد أو في مجلسه عند الشافعية والحنابلة؛ والحنفية يرون إلحاقه بعد العقد كإدخاله فيه؛ وأن يكون مؤقتا بمدة معلومة عند الجمهور، لأن الخيار المطلق يورث الجهالة الفاحشة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7926}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7927}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7927}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928} المدة: حدها الأدنى غير مقدر فيجوز ولو لحظة؛ وحدها الأقصى: مذهب أحمد ومحمد بن الحسن وأبي يوسف وغيرهم جواز أي مدة بالتفويض، ويستوجه صاحب غاية المنتهى المنع في المدة الخارجة عن العادة؛ ومالك يقيدها بقدر الحاجة والمعتاد بحسب المبيع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7929} الغرض من الخيار: تمكين المتعاقد من التأمل والتجربة، وتلبي حاجة الناس إلى المشورة والاختبار؛ ومدة الخيار عند المالكية بقدر ما يختبر فيه المبيع ويستشار فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7929} مدة الخيار في العقار: أقصاها شهر، ويلحق به ستة أيام، فأقصى ما يجوز مد الخيار إليه ستة وثلاثون يوما؛ ويلحق اليومان بالمدة لتمكين المشتري من الرد إذا كان المبيع في يده عند انتهائها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7930} الدواب: إن كان الخيار لمعرفة قوتها وأكلها وسعرها فأقصاه ثلاثة أيام، وإن كان للاختبار داخل البلد فيوم أو نحوه، وخارجه بريد عند ابن القاسم وبريدان عند أشهب (والبريد: مسافة نصف يوم سيرا)؛ وبقية الأشياء من الثياب والعروض والمثليات أقصاها ثلاثة أيام ويلحق بها يوم، أما الخضر والفواكه فتقدر مدتها بقدر حاجة الاختبار قبل أن تتغير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7930} الاتجاه الثالث يحدد الخيار بثلاثة أيام بلياليها أيا كان المعقود عليه، ويمنع المجاوزة، وهو مذهب أبي حنيفة وزفر والشافعي في المشهور عنه، واحتجوا بحديث حبان بن منقذ وبحديث المصراة «من اشترى شاة محفلة فهو بخير النظرين ثلاثة أيام»، وقال الشافعي إنه لما ثبت الخيار بالنص وقف عند الثلاث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7930}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7931} الزيادة على الثلاث: عند أبي حنيفة وزفر العقد فاسد، وعند الشافعي باطل؛ وينفرد أبو حنيفة بأن إسقاط الزيادة يصحح العقد ما لم تمض الأيام الثلاثة، ويخالفه زفر لأن البقاء على حسب الثبوت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7931}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7932} ويعد المالكية من صور الفساد اشتراط مشاورة من لا يعلم رأيه إلا بعد انقضاء المدة، واشتراط مدة تزيد كثيرا على مدة السلعة، أما الزيادة اليسيرة فلا تضر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7932} الخيار المطلق عن المدة: للمذاهب أربعة اتجاهات. الأول بطلان العقد أو فساده: قال به الشافعية والحنابلة في إحدى الروايتين، والحنفية بفساد العقد دون تفريق بين الجهالة المتفاحشة والمتقاربة، ويصير العقد صحيحا عند أبي حنيفة وصاحبيه إن زال المفسد في الأيام الثلاثة، وعند الصاحبين وحدهما ولو بعدها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7932}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933} الثاني بطلان الشرط دون العقد: رواية لأحمد ومذهب ابن أبي ليلى. الثالث صحة العقد وتعديل الشرط: يحدد القاضي المدة المألوفة لاختبار مثل السلعة عند مالك، ويرى ابن تيمية أن يثبت ثلاثة أيام إن أطلقاه. الرابع صحة العقد وبقاء الشرط على إطلاقه، وهو مذهب ابن شبرمة وقول لأحمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7932}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933} تأبيد الخيار شرط مفسد، كقوله «أبدا» أو «أياما» لا محددة. والتوقيت بوقت مجهول مفسد، سواء كانت الجهالة متفاحشة كهبوب الرياح ومجيء المطر وموت فلان ووضع الحامل، أو متقاربة كالحصاد والدياس وقدوم الحاج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933} شريطة الاتصال: تبدأ مدة الخيار من فور إبرام العقد، فلو شرطاه من آخر الشهر أو من الغد فسد العقد عند الحنفية والشافعية والحنابلة، لكن الحنفية يصححونه بحمل المدة الفاصلة عليها، كخيار يومين بعد رمضان في عقد وقع آخره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7934} شريطة الموالاة: تتابع أجزاء المدة، فلو جعل يوما يثبت ويوما لا يثبت ففيه عند الحنابلة وجهان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7934} تعيين مستحق الخيار: لا يصح أن يكون مجهولا، فلو جعلاه لأحدهما لا بعينه أو لمن يشاء أحدهما فباطل عند ابن قدامة، والأصح عند النووي صحة البيع إن شرط الخيار لأحدهما دون الآخر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7934}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7935} العقود التي يدخلها خيار الشرط هي العقود اللازمة القابلة للفسخ؛ والبيع هو الميدان الأساسي له ويدخل البيع الفاسد وبيع المرابحة وأشباهها. وتستثنى السلم والصرف وبيع الربوي بجنسه عند جمهور الحنابلة لاشتراط قبض العوض فيها، وقد نبه ابن عابدين على أن استثناء السلم والصرف مخل بالضابط، والمالكية يجيزونه في السلم إلى أجل قصير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7935} الإجارة: يجري الخيار فيها عند الحنفية والمالكية، ويقيده الشافعية والحنابلة بالإجارة في الذمة أو المعينة لمدة غير تالية للعقد. والحوالة: يقبلها الحنفية، ولا يقبلها الشافعية والحنابلة لأنها ليست مبنية على المغابنة. والقسمة: يختلف فيها؛ قسمة الأجناس المختلفة تراض لا إجبار فيها، وقسمة الجنس الواحد من القيميات يدخلها الخيار على الصحيح. والكفالة: يدخلها عند الحنفية، ويجوز فيها عند أبي حنيفة أكثر من ثلاثة أيام لأنها مبنية على التوسع. والوقف: يجري فيه عند أبي يوسف دون محمد والشافعي وأحمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7935}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7936} الخيار للمتعاقدين أو لأحدهما: يصح اشتراطه لأي منهما أو لكليهما، وهو قول الجمهور، وروي عن الثوري وابن شبرمة أنه للمشتري وحده. ويصح اشتراطه لأجنبي عن العقد، وهو موضع اتفاق عند الفقهاء بشرط أن يكون ممن يصح قوله، ومستند الحنفية الاستحسان لحاجة المتعاقد قليل الخبرة إلى من يفوض إليه الرأي، وخالف زفر لأن الخيار من مقتضيات العقد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7936}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7937} الخيار للأجنبي وصيغة الاستشارة: عند المالكية إن قال «على مشورة فلان» كان لكل من العاقد والمستشار الاستقلال بالإمضاء أو الرد، لأن المشورة لا تلزم الموافقة؛ أما إن قال «على خيار فلان» أو «رضاه» فالمعتمد أنه تفويض لا توكيل، فلا يستقل العاقد بالإبرام أو الفسخ، وتلحق بهذين اللفظين المشورة المقيدة بما يدنو بها إليهما، كأن يقول «إن شاء أمضى وإن شاء رد». وعند الشافعية يصح الخيار للأجنبي تفويضا أو تحكيما لا توكيلا، وهو الأصح عندهم، وقال أبو يعلى إن الخيار لا يصح حينئذ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7938} شرط الاستئمار أو الاستشارة: عند الشافعية اتجاهان، أحدهما أن العاقد لا يفسخ حتى يقول إنه استأمر فأمره بالفسخ، والثاني للحنابلة أن الاستئمار غير لازم، وصححه النووي. ويجب تعيين من يستشار، فلو قال «على أن أشاور» من غير تعيين لم يكف، وقال الأذرعي إن الظاهر الكفاية. ولم يجد الباحث نصا للحنفية في المسألة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7938}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7939} النيابة في الخيار: يثبت الخيار لمن يشترطه لنفسه أيا كانت صفته، مالكا كان أو وصيا أو وليا أو وكيلا؛ فاشتراط الخيار في الولاية والوصاية نظر للصغير، وفي الوكالة يشمل الإطلاق بالأمر بالعقد ما فيه الخيار، كما يملك المضارب والشريك شركة عنان أو مفاوضة شرط الخيار بإطلاق عقد الشركة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7939} الوكيل عند الشافعية: يصح شرط الوكيل الخيار لنفسه أو لموكله، ويمنع الوكيل بالبيع أن يشترط الخيار للمشتري، والوكيل بالشراء أن يشترطه للبائع، فإن فعل بطل العقد ما لم يأذن الموكل؛ والأصح أن الخيار لا يتعدى من شرط له. والحنابلة مثلهم في صحة شرط الوكيل لنفسه، ويجب على الوكيل أن يفعل ما فيه حظ موكله لأنه مؤتمن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7939}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7940} تعدد الأطراف: كما يثبت الخيار لصاحبه منفردا إذا كان العاقد واحدا، يثبت للمتعدد إذا تعدد الطرف المتعاقد، كشريكين باعا شيئا أو مالك باع سلعة لاثنين واشترطا الخيار لهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7940} أثر الخيار على حكم العقد: يمنع الخيار ثبوت حكم العقد للحال في حق صاحب الخيار، وهذا متفق عليه بين أبي حنيفة وصاحبيه، وهو عند أبي حنيفة في حق العاقد الآخر أيضا؛ وقال الصاحبان ينفذ الحكم في حق من لا خيار له. وتوقف الحكم عند الكاساني بمعنى أنه لا يعرف للحال حتى يسقط الخيار. وعند الشافعية موقوف لا يحكم بانتقاله للمشتري ولا للبائع حتى ينقضي الخيار، وعند المالكية ملكية المحل باقية للبائع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7940}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7941} أثر الخيار على انتقال الملك: إذا كان الخيار لهما فعند الحنفية لا يخرج المبيع من ملك البائع ولا الثمن من ملك المشتري، والشافعية يقفون الملك حتى ينقضي الخيار، والحنابلة ينقلون الملك إلى المشتري بالعقد. وإذا كان الخيار لأحدهما: المالكية يبقون الملك للبائع والإمضاء ناقل، وقول عندهم أن الملك للمشتري، وعن أحمد الوقف؛ وإن كان الخيار للبائع فالملك له ويتصرف المشتري دون ملك، وتصرف البائع نافذ ويعد فسخا، وإن كان الخيار للمشتري زال الملك عن البائع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7941}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7942} ضمان محل الخيار عند الحنفية: إن كان الخيار للبائع وهلك المحل في يده قبل القبض فالضمان عليه؛ وإن هلك في يد المشتري بعد القبض وانقضاء الخيار فالضمان منه بالثمن؛ وإن هلك في يده قبل انقضاء خيار البائع فالضمان عليه بالقيمة لأنه مقبوض على جهة العقد؛ وإن كان الخيار للمشتري وهلك في يده فالضمان عليه بالثمن لأن الهلاك بمثابة عيب آل إلى تلف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7942}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7943} ضمان محل الخيار عند الآخرين: عند المالكية الضمان على البائع، إلا إذا تلف محل مما يغاب عليه ولم تثبت بينة بتلفه، فالضمان على المشتري؛ وعند الشافعية إن تلف المبيع بآفة سماوية بعد القبض والخيار للبائع انفسخ البيع، وإن كان الخيار للمشتري لم ينفسخ لدخوله في ضمانه بالقبض؛ وعند الحنابلة الملك للمشتري والضمان عليه، إلا أن المكيل والموزون لا يصير ضمانه عليه إلا بالاكتيال أو الوزن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7944}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7945} الزوائد في محل الخيار: قسم الحنفية الزيادة إلى أربعة أنواع: متصلة متولدة من الأصل كالسمن والبرء والنضج، ومتصلة غير متولدة كالصبغ والخياطة والبناء والغرس، ومنفصلة متولدة كالولد والثمر واللبن والبيض والصوف، ومنفصلة غير متولدة كغلة المأجور وأرش الجناية والعقر. وغير الحنفية يكتفون بتقسيم الزيادة إلى متصلة ومنفصلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7946} حكم الزيادة عند الحنفية: الأصل أنها تمنع الرد، فيلزم العقد وتكون الزوائد للمشتري، إلا المنفصلة غير المتولدة فلا تمنع الرد باتفاق، والمتصلة المتولدة فيها خلاف. فإذا اختار الفسخ في المنفصلة غير المتولدة رد أبو حنيفة الأصل مع الزوائد لأن الملك كان موقوفا، وقال الصاحبان إن الزوائد للمشتري. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7946}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7947} الزيادة المتصلة المتولدة: قال أبو حنيفة وأبو يوسف إنها تسقط الخيار ويملك صاحبه الأصل والزيادة، وقال محمد لا يبطل الخيار وله الإمضاء أو الفسخ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7947} الزوائد عند المالكية: الولد والصوف يكونان للمشتري لأنهما كجزء باق من المبيع، وما عداهما للبائع، كاللبن والسمن والبيض وأرش الجناية، لأن الملك زمن الخيار يبقى للبائع حتى يستعمل صاحب الخيار خياره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7947} الزوائد عند الشافعية: المنفصلة زمن الخيار تكون لمن له الملك، فإن كان الخيار لهما فهي موقوفة كحكم المبيع، والمتصلة تتبع الأصل، والحمل الموجود عند البيع كالأصل. أما الحنابلة فالزوائد كلها للمشتري، متصلها ومنفصلها، ولو كان المبيع في يد البائع قبل القبض، ويستدلون بحديث «الخراج بالضمان». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7947}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7948} تسليم البدلين في مدة الخيار: متفق على أنه لا يجب تسليم البدلين في مدة الخيار عند الإطلاق، فلا يجب على البائع تسليم المبيع ابتداء، ولا على المشتري تسليم الثمن، ما لم تمض المدة أو يسقط صاحب الخيار خياره. والتسليم اختيارا لا يبطل الخيار إن كان على وجه الاختبار، وإن كان على وجه التمليك والخيار للبائع بطل خياره. وإن سلم أحدهما تطوعا وامتنع الآخر فلا يجبر عند أبي حنيفة والشافعية، وللمسلم أن يسترد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7948}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7949} سقوط الخيار قبل استعماله: بالبلوغ في حق الصبي الذي عقد عنه وليه، وبالجنون ونحوه، وبموت صاحب الخيار على خلاف. ويرى أبو يوسف أن بلوغ الصغير صاحب الخيار يسقط الخيار للولي ويلزم العقد، وقال محمد لا يسقط، ثم اختلفت الروايات عنه. وطروء الجنون لا يسقط الخيار في ذاته، بل مضي المدة كلها دون فسخ، فلو أفاق في أثنائها كان على خياره في الأصح عند الحنفية. وعند المالكية إن جن صاحب الخيار ولم يرج إفاقته نظر السلطان فيما هو أصلح له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7949}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7950} ينتهي الخيار بإمضاء العقد أو بمضي مدته دون فسخ، أو بفسخ العقد. فالإمضاء بالإجازة الصريحة أو بالدلالة كالتصرف في المبيع تصرف الملاك من بيع أو هبة أو رهن، ولا يشترط علم العاقد الآخر بالإجازة. ويجوز أن يصالح صاحب الخيار على عوض فيسقط الخيار ويمضي البيع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7951}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7952} موت صاحب الخيار: عند الحنفية والحنابلة يسقط الخيار بموته، وعند المالكية والشافعية يبقى للورثة. أما موت من عليه الخيار فلا يسقط الخيار، بل يبقى لصاحبه ويرد على الورثة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7951} انتهاء الخيار بمضي المدة: متفق عليه في الجملة، لأن الخيار مؤقت، ولزوم العقد هو الأصل، فإذا انقضت المدة ثبت موجب العقد. والمالكية يعدون مضي المدة انتهاء للخيار لا إمضاء، فإن كان المبيع في يد المشتري كان إمضاء، وإن كان في يد البائع كان فسخا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7953} انتهاء الخيار بالفسخ: يكون الفسخ صريحا بالقول كقول «فسخت البيع» أو «رددت الثمن»، أو دلالة بالفعل. والفسخ الفعلي هو التصرف الذي يقتضي الرد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7953} الفسخ بالفعل: يكون فسخا إذا تصرف صاحب الخيار في المبيع تصرف الملاك، أو في الثمن إن كان عينا إذا كان الخيار للمشتري؛ أما الدين فلا يتصور فسخه بالفعل، لأن الأثمان لا تتعين بالتعيين. والعلة أن هذا التصرف دليل استبقاء الملك، واستبقاؤه لا يكون إلا بالفسخ. وقال ابن الهمام والكاساني إن ما يوجد من البائع في المبيع لو وجد منه في الثمن لكان إجازة يكون فسخا للبيع دلالة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7954} من تفاريع الفسخ الدلالي عند الحنفية: الأكل والشرب واللبس يسقط الخيار، وفي فتاوى قاضيخان أن لبسه مرة لا يبطل الخيار؛ النسخ من الكتاب لا يسقطه، ولو درس الكتاب يسقط؛ وركوب الدابة ليسقيها أو يردها أو يعلفها إجازة عند قوم، وأطلق قاضيخان أنه لا يبطل الخيار استحسانا؛ بيع المحل أو هبته أو رهنه مع التسليم يسقط الخيار، ولا ينفسخ بالهبة والرهن دون تسليم؛ الإيجار فسخ ولو لم يسلم عند قوم؛ وأبو بكر بن الفضل يفرق بين التسليم اختبارا فلا يبطل الخيار، والتسليم تمليكا فيبطل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7954}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7955} شروط نفاذ الفسخ: قيام الخيار؛ وعلم العاقد الآخر بالفسخ عند أبي حنيفة ومحمد، فإن جرى دون علمه كان موقوفا ينفذ إن علم به في مدة الخيار، ويلزم العقد إن مضت المدة دون أن يبلغه؛ وأبو يوسف له ثلاثة أقوال، والمشهور عنه عدم اشتراط العلم، ورجحه ابن الهمام. وعدم اشتراط العلم مذهب الجمهور (المالكية والشافعية والحنابلة). وأن لا يترتب على الفسخ تفريق الصفقة، فلا يمضى العقد في بعض ويفسخ في بعض، وعند الشافعية الأصح المنع، والمالكية يجبرون على رد الجميع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7955}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7956} انتقال خيار الشرط بالموت: يثبت عند مالك والشافعي أن الخيار ينتقل إلى الوارث، ويعلل بأنه حق ثابت لإصلاح المال كالرهن، ويستدل بحديث «من ترك مالا أو حقا فلورثته»، ولم يوجد تخريج لرواية بلفظ «حقا» فيما اطلع عليه؛ وعند الحنفية لا يورث لأنه صفة شخصية ومشيئة لا تنقل. وقال الحنابلة إن الخيار لا يورث إلا إذا طالب به المورث قبل موته، وهو مذهب ابن قدامة في أن الخيار يبطل بموت صاحبه ويبقى خيار الآخر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7956}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7957} انتقال الخيار بالجنون والإغماء: عند الشافعية لا ينقطع الخيار بطروء الجنون أو الإغماء، بل يقوم الولي أو الحاكم مقامه فيفسخ أو يجيز بما فيه الحظ، ويعين الحاكم نائبا لمن أصابه خرس بلا إشارة مفهومة. وعند المالكية يفرق بين الجنون والإغماء: إن جن صاحب الخيار ولم يرج إفاقته أو طال حتى يضر الآخر ينظر السلطان فيما هو أصلح، والمفيق يمكّن من الفسخ أو الإجازة ونقض فعل القيم إن كان له بينة؛ والمغمى عليه ينتظر إفاقته ليختار لنفسه، فإن أفاق بعد زمن الخيار استؤنف له الأجل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7957}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7958}'
  en: 'The option of stipulation (khiyar al-shart) is a compound name for the right, set by stipulation, of one party to choose between confirming and annulling; Ibn Arafa defines it as a sale whose conclusion is held back for a confirmation expected. Other names: the stipulated option (distinguished from the legal option, such as defect), the option of deliberation, and the sale of option. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7923}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7924} Its lawfulness: most jurists hold it lawful and not contrary to the contract, on the report of Ibn Umar and of Habban ibn Munqidh ("when you sell, say: no deceit" and "you have the option three nights"); al-Nawawi and Ibn al-Humam report agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7924}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7925} Wording: no fixed words; any word that conveys the option (consent, will) is enough, and custom counts for the Malikis, as when people have long bargained with an option in a certain sale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7925}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7926} Conditions: it must be stipulated in the contract or its session in the Shafii and Hanbali view; the Hanafis allow it to be added later as if at the contract; it must be limited by a known term, since an unlimited option causes gross ignorance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7926}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7927}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7927}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928} Term: the least is not fixed and may be a moment; for the greatest, Ahmad, Muhammad al-Shaybani, Abu Yusuf and others allow any term by agreement, while Ibn Abi Layla, Ibn Shubruma and others too; Ahmad says he dislikes a long term, and the author of Ghayat al-Muntaha finds a term far beyond custom (such as a thousand years) invalid; Malik limits it by need and what is usual for the sale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7929} Purpose: to let the party consider and test the thing; the term under the Malikis is measured by what the thing needs to be tested and consulted about. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7929} Term for land: the outer limit is one month plus six days, so the option may run up to thirty-six days; two further days are added so that the buyer, still holding the thing at the end of the term, can return it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7930} Animals: if the option is to learn their food, strength and price, the limit is three days; if to test them within the town, one day or so; outside it, a barid (half a day''s march) according to Ibn al-Qasim and two barids according to Ashhab. Clothes, goods and fungibles: three days plus one day. Fruit and vegetables: the term is set by what testing needs before they change. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7930} The third view fixes three days with their nights for any subject, and forbids more. It is the view of Abu Hanifa, Zufar and (in the better-known report) al-Shafii. The sources are the report of Habban ibn Munqidh and the hadith of the sheep with its udder held full (musarrah): whoever buys a sheep so held has the option for three days, as al-Shafii argued. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7930}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7931} Beyond three days: for Abu Hanifa and Zufar the contract is void as fasid; for al-Shafii it is void as batil. Abu Hanifa alone holds that dropping the excess makes the contract valid, as long as the three days have not passed; Zufar disagrees, since continuation follows the original validity. The Malikis add that the term is faulty if it is to consult someone whose view is known only after it ends, or if it greatly exceeds the life of the goods; one extra day does no harm. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7931}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7932} An option with no term has four views. (1) The contract is void or invalid: al-Shafii and, in one report, Ahmad; the Hanafis hold the sale invalid without distinguishing gross from small uncertainty. Abu Hanifa and his companions hold that if the defect is removed within the three days the contract becomes valid; the two companions hold it valid even after three days. (2) The condition is void but the contract stands: one report of Ahmad, and Ibn Abi Layla. (3) The contract stands and the term is set: Malik lets the judge fix the usual term for testing such goods; Ibn Taymiyya suggests three days if they gave none. (4) The contract stands and the option stays open as it arose, the view of Ibn Shubruma and one report of Ahmad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7932}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933} Permanent option: a condition that makes the option last forever (or for unstated days) invalidates it. Unknown term: invalid, whether the uncertainty is gross (wind, rain, a person''s arrival or death, the birth of a pregnant animal) or slight (harvest, threshing, the return of pilgrims). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933} Connection: the term must start at the contract. If the term is set to begin later (from the end of the month or tomorrow) the sale is void for the Hanafis, Shafiis and Hanbalis; the Hanafis rescue it by counting the gap within the term, as in an option of two days after Ramadan in a contract made at the end of Ramadan. Continuity: the parts of the term must follow one another; for a day held and a day not, the Hanbalis have two views. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7934} Holder: the option holder must be named. If the parties give it to one of them without naming which, or to whomever one of them chooses, it is void according to Ibn Qudama; al-Nawawi holds the sale valid if the option is for one party only. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7934}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7935} Contracts: the option belongs only to binding contracts that can be rescinded. Sale is its main field, including sale of trust such as murabaha. The exceptions are salam, exchange of money (sarf) and exchange of ribawi goods of the same kind, for which some Hanbalis require the price to be received in the session; Ibn Abidin notes that excluding salam and sarf strains the rule, and the Malikis allow it in short salam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7935} Other contracts: leasing takes the option in general for Hanafis and Malikis; Shafiis and Hanbalis allow it only in leases on the debt, or in fixed leases whose term does not begin at once. Transfer of debt (hawala): accepted by the Hanafis, refused by the Shafiis and Hanbalis as it is not built on exchange. Division: divided; division of different kinds is by consent, division of the same kind of values takes the option. Guarantee (kafala): the Hanafis allow it, and Abu Hanifa allows more than three days because it is built on latitude. Waqf: allowed by Abu Yusuf, void for Muhammad, and in the Shafii and Hanbali view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7935}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7936} Who may stipulate: the option may be given to either party or to both, the view of most jurists; al-Thawri and Ibn Shubruma limited it to the buyer. It may be given to a third party: the jurists agree this is sound if the third party can speak for himself. The Hanafis base this on juristic preference (istihsan), because a party with little experience may need someone wiser; Zufar objected because the option is part of the contract. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7936}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7937} A third party as option holder: the Malikis say that if the term reads ''on the advice of so-and-so'', both the contracting party and the adviser may decide alone, since advice does not bind to agreement; if it reads ''on so-and-so''s option'' or ''consent'', the better view is that it is delegation, not agency, and the contracting party cannot decide alone. Words close to these, such as ''if he wills he confirms, if he wills he annuls'', count the same. The Shafiis hold the option for a third party is delegation or arbitration, not agency, and that is their sounder view; Abu Yaala held that it is then invalid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7938} Consultation clause: the Shafiis have two views on whether the party must state he consulted and was told to annul; the Hanbalis do not require it, and al-Nawawi affirmed the first view. The person consulted must be named; ''on my consultation'' without naming him is not enough, though al-Adhra''i thought it sufficient. The Hanafis have no text on the point that the compiler found. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7938}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7939} Agency in the option: the option belongs to the contracting party who stipulates it for himself, whatever his position: owner, guardian, executor, agent, or the partner or mudarib of a company. A guardian or executor may stipulate it for the good of the minor or the ward; an agent acts on the principal''s general instruction to contract, which includes an option. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7939} The agent in the Shafii view: an agent may stipulate the option for himself or for his principal. A selling agent may not give the option to the buyer, nor a buying agent to the seller; if he does, the contract is void unless the principal permits it. The better view is that the option does not pass beyond the party named. The Hanbalis agree that an agent may stipulate it for himself. An agent must act for his principal''s benefit, since he is trusted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7939}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7940} Several parties: as the option holds for a single party, it also holds for several, as when two partners sell a thing or one owner sells to two buyers who stipulate the option for both. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7940} Effect of the option on the contract: it prevents the contract from taking effect in its legal rule for the party holding the option. Abu Hanifa holds this also against the other party; his two companions hold that the rule takes effect for the party without the option. Al-Kasani describes the contract as suspended, not known in its rule until the option ends. The Shafiis treat it as suspended; the Malikis hold the seller keeps ownership of the thing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7940}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7941} Effect on transfer of ownership: with the option for both parties the Hanafis hold that neither price nor thing changes hands, and the Shafiis suspend the transfer until the option ends; the Hanbalis hold that ownership passes to the buyer at the contract. With the option for one party, the Malikis hold that ownership stays with the seller, the sale being a dissolved not a formed contract, and confirmation then transfers it; another Maliki view and one of Ahmad hold the buyer owns it, or that it is suspended. When the seller holds the option, ownership stays with him, the buyer may not dispose of the thing, and the seller''s disposal is an annulment. When the buyer holds it, ownership leaves the seller. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7941}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7942} Liability for loss (Hanafis): when the seller holds the option and the thing perishes before receipt, the seller bears it. When it perishes in the buyer''s hand after receipt and the option has ended, the buyer bears it at the price. When the seller holds it and the buyer had received the thing and it perished during the option, the buyer bears it at value, as with a thing taken for inspection. When the buyer holds the option and it perishes in his hand, he bears it at the price, since loss is a defect that leads to perishing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7942}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7943} Liability for loss in other schools: the Malikis put liability on the seller, except that a movable thing that can be hidden, once lost with no proof, falls on the buyer. The Shafiis hold that if the thing perishes by heavenly cause after receipt and the option is the seller''s, the sale is dissolved; if the option is the buyer''s, the sale is not dissolved. The Hanbalis hold that ownership is the buyer''s and so is liability, except measured and weighed goods, where liability stays with the seller until they are measured or weighed by the buyer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7944}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7945} Increase in the object: the Hanafis divide increase into four kinds: connected and generated from the thing (fat, healing, ripening); connected and not generated (dyeing, sewing, building and planting on the land); separated and generated (offspring, fruit, milk, eggs, wool); and separated and not generated (rent of a hired thing, compensation for injury, and the mahr for intercourse by mistake). Other schools divide increase only into connected and separated. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7946} Ruling on increase in the Hanafi view: the general rule is that increase prevents return, so the contract is binding and the increase goes to the buyer, except that separated non-generated increase never prevents return, while connected generated increase is disputed. If the option is annulled, Abu Hanifa returns the thing with its increase, since ownership was suspended; the two companions hold the increase is the buyer''s. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7946}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7947} Connected generated increase: Abu Hanifa and Abu Yusuf hold that it ends the option and the holder owns both the thing and the increase; Muhammad holds that the option does not end, and the holder may confirm or annul. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7947} Increase in the Maliki view: offspring and wool go to the buyer, as a part of the thing that remains; the rest, such as milk, fat, eggs and compensation for injury, go to the seller, because ownership stays with the seller during the option until the holder uses it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7947} Increase in the Shafii view: separated increase during the option belongs to the one who owns the thing; if the option is for both, it is suspended like the thing itself. Connected increase follows the thing, and a pregnancy present at sale is part of the thing. The Hanbalis give all increase to the buyer, connected or separated, even if the thing is still in the seller''s hand before receipt, citing the hadith «the yield goes with the liability». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7947}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7948} Delivering the two prices during the option: it is agreed that neither side must deliver during the option unless stipulated; the seller need not hand over the thing at once, nor the buyer the price, until the term ends or the holder waives it. Voluntary delivery does not void the option, if it is meant for testing and not for ownership; if the seller delivers the thing as ownership while holding the option, his option ends. If one party delivers voluntarily and the other refuses, Abu Hanifa does not compel the other, and the Shafiis allow the deliverer to take it back. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7948}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7949} Ending the option before use: by the coming of age of a minor for whom a guardian contracted; by madness or the like; or by the death of the holder, which is disputed. Abu Yusuf holds that the minor''s coming of age ends the option for the guardian and binds the contract; Muhammad holds that it does not, and his reports differ. Madness does not end the option in itself, but the lapse of the whole term without a decision does; if the holder recovers in the term, he keeps his option for the rest, in the sounder Hanafi view. The Malikis say that if the holder goes mad and does not recover, the sultan considers what is best for him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7949}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7950} Ending the option by confirmation or by lapse of term: the option ends by confirmation, which may be express (words such as «I confirm the sale», «I have waived the option») or by implied act, such as disposing of the thing as an owner would, by sale, bargaining, lease, gift or pledge. Confirmation need not be known to the other party, and the thing need not still exist if it was fit at the contract. A settlement for money or goods to waive the option is valid, and becomes an increase in the price. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7951}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7952} Death: the Hanafis and Hanbalis hold that the option ends at the death of its holder, whether buyer or seller, and whether he acts himself or through an agent. The Malikis and Shafiis hold that it passes to the heirs. If the obligor dies, the option stays, and its holder may annul against the heirs, as al-Sarakhsi reports. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7951} Lapse of term: agreed in general, since the option is limited to a term and the contract is binding by default; the lapse is taken as confirmation, and the holder''s silence over the term is consent, though Abu Yaala differed. The Malikis treat the lapse as an ending, not a confirmation: if the thing is in the buyer''s hand, it is confirmation; if in the seller''s hand, it is annulment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7953} Ending by annulment: may be express by words, such as «I annul the sale» or «I return the price», or by act, which shows return. An express annulment includes the seller saying he will not sell unless the price is raised, and the buyer saying he will not buy unless it is lowered. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7953} Annulment by act: the option holder annuls when he deals with the thing as its owner would, or with the price if the option is the buyer''s and the price is a specific thing. A debt cannot be annulled by act, since prices are not fixed by being named. The reason is that such dealing shows the holder keeps the ownership, and that can only be kept by annulment. Ibn al-Humam and al-Kasani hold that what the seller does with the thing would, if done with the price, confirm the sale, so it annuls the sale by implication. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7954} Implied annulment in the Hanafi rulings: eating, drinking and wearing end the option (Qadikhan says wearing once does not); copying from a book does not, but erasing it does; riding an animal to water it, return it or feed it is confirmation for some, and Qadikhan says it does not void the option, by juristic preference (istihsan); sale, gift or pledge of the thing with delivery ends it, without delivery not; leasing is an annulment even without delivery, for some; Abu Bakr ibn al-Fadl separates delivery for testing (no annulment) from delivery for ownership (annulment). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7954}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7955} Conditions of valid annulment: the option must still exist. Abu Hanifa and Muhammad require that the other party know of the annulment; if the holder annuls without his knowledge the annulment is suspended, valid if he learns of it within the term, and the contract binds if the term ends unknown to him. Abu Yusuf has three reports, the best known requiring no knowledge; al-Shafii, the Malikis and the Hanbalis agree that knowledge is not required. Annulment must cover the whole deal and not split it; the Malikis compel return of all, and the Shafiis hold that splitting is not allowed in the sounder view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7955}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7956} Transfer of the option at death: Malik and al-Shafii hold the option passes to the heir, since it is a right set to protect the property, like a pledge; the Hanafis say it does not pass, being a personal wish and will that is not transferred. The Hanbalis say it passes only if the holder claimed it before death; Ibn Qudama holds that the option of the dead party lapses, while the other party''s option stays. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7956}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7957} Madness and fainting: for the Shafiis the option does not end on madness or fainting; the guardian or the judge acts for the holder by what is in his interest; a mute with no understood sign has a judge''s agent appointed. For the Malikis, the judge acts when madness is not expected to end, or when it lasts long enough to harm the other party; the sane holder may annul or confirm and overturn the guardian''s acts if he has proof. A person in a faint waits until he recovers; if he recovers after the term, a new term is granted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7957}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7958}'
  ur: 'خیار الشرط: ایک مرکب نام، جو شرط سے ثابت ہونے والا وہ اختیار ہے جو کسی ایک عاقد کو عقد کو برقرار رکھنے یا فسخ کرنے کے درمیان حاصل ہو؛ ابن عرفہ (مالکی) اسے ایسی بیع قرار دیتے ہیں جس کا پکا ہونا کسی متوقع اجازت پر موقوف ہو۔ دوسرے نام: خیار شرطی (حکمی جیسے عیب سے امتیاز کے لیے)، خیار تروّی، بیع الخیار۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7923}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7924} جواز: جمہور اسے عقد کے منافی نہ ہونے کی بنا پر جائز مانتے ہیں، ابن عمر اور حبان بن منقذ کی حدیث «إذا بعت فقل لا خلابة» اور «أنت بالخيار ثلاث ليال» سے استدلال؛ نووی اور ابن الہمام اس پر اجماع نقل کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7924}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7925} الفاظ: کوئی معین لفظ ضروری نہیں، رضا یا مشیئت جیسے کسی بھی لفظ سے ہو سکتا ہے؛ مالکیہ کے نزدیک عرف بھی کافی، جیسے کسی مخصوص سامان میں لوگوں کا خیار رکھنا معروف ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7925}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7926} شرائط: شافعیہ اور حنابلہ کے نزدیک عقد میں یا مجلس میں شرط ہو؛ حنفیہ بعد میں شامل کرنے کو عقد میں شامل کرنے کی طرح جائز کہتے ہیں؛ جمہور کے نزدیک مدت معلوم ہو کیونکہ غیر مقررہ خیار بڑی جہالت پیدا کرتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7926}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7927}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7927}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928} مدت: کم از کم کی کوئی حد نہیں، ایک لمحہ بھی؛ زیادہ سے زیادہ: احمد، محمد بن حسن، ابو یوسف وغیرہ باہمی رضامندی سے کوئی بھی مدت جائز مانتے ہیں؛ احمد لمبی مدت کو پسند نہیں کرتے، اور غایۃ المنتہی کے مصنف عادت سے بہت زائد مدت (جیسے ہزار سال) کو درست نہیں کہتے؛ مالک ضرورت اور سامان کے عرف کے مطابق مقید کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7929} غرض: عاقد کو غور و فکر اور آزمائش کا موقع دینا؛ مالکیہ کے نزدیک مدت اتنی ہو جتنی آزمائش اور مشورے کے لیے درکار ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7928}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7929} عقار میں مدت: زیادہ سے زیادہ ایک ماہ، اور اس کے ساتھ چھ دن، یعنی چھتیس دن تک خیار بڑھایا جا سکتا ہے؛ دو دن اس لیے ملائے جاتے ہیں کہ مدت ختم ہونے پر اگر مبیع خریدار کے ہاتھ میں ہو تو وہ واپس کر سکے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7930} جانور: اگر خیار ان کی خوراک، طاقت اور قیمت جاننے کے لیے ہو تو زیادہ سے زیادہ تین دن، شہر کے اندر آزمائش ہو تو ایک دن یا اس کے قریب، اور شہر سے باہر ابن القاسم کے نزدیک ایک بَرِید اور اشہب کے نزدیک دو بَرِید (بَرِید: آدھے دن کی مسافت)۔ کپڑے، عروض اور مثلیات: تین دن اور ایک دن۔ پھل اور سبزیاں: اتنی مدت جتنی آزمائش کے لیے درکار ہو، قبل اس کے کہ وہ بدل جائیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7930} تیسرا اتجاہ: ہر معقود علیہ کے لیے تین دن بمع راتوں کے مقرر کرتا ہے اور اس سے زیادہ کو ممنوع کہتا ہے؛ یہ ابو حنیفہ، زفر اور امام شافعی کا مشہور قول ہے۔ ان کی دلیل حبان بن منقذ کی حدیث اور مصراۃ والی حدیث «من اشترى شاة محفلة فهو بخير النظرين ثلاثة أيام» ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7930}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7931} تین دن سے زیادہ: ابو حنیفہ اور زفر کے نزدیک عقد فاسد ہے، شافعی کے نزدیک باطل۔ صرف ابو حنیفہ کے نزدیک زائد حصہ ساقط کر دینے سے عقد درست ہو جاتا ہے جب تک تین دن نہ گزریں؛ زفر اختلاف کرتے ہیں۔ مالکیہ کے نزدیک فساد کی صورتیں یہ ہیں: ایسے شخص سے مشورہ جس کی رائے مدت گزرنے کے بعد ہی معلوم ہو، یا مدت سامان کی مدت سے بہت زیادہ ہو؛ ایک دن زائد ہو تو نقصان نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7931}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7932} غیر محدود خیار کے چار اتجاہات ہیں: (1) عقد باطل یا فاسد: شافعیہ اور حنابلہ کی ایک روایت اور حنفیہ کے نزدیک عقد فاسد۔ ابو حنیفہ اور ان کے دونوں شاگرد کہتے ہیں کہ اگر تین دن میں خرابی دور ہو جائے تو عقد درست ہو جاتا ہے، اور صاحبین کے نزدیک تین دن کے بعد بھی۔ (2) شرط باطل، عقد برقرار: احمد کی ایک روایت اور ابن ابی لیلیٰ۔ (3) عقد برقرار، شرط میں تعدیل: مالک کے نزدیک قاضی عادت کی مدت مقرر کرے؛ ابن تیمیہ کے نزدیک مدت نہ ہو تو تین دن۔ (4) عقد اور شرط دونوں برقرار: ابن شبرمہ اور احمد کا ایک قول۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7932}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933} ہمیشہ کے لیے خیار (تابید) مفسد ہے، جیسے «أبدا» یا غیر متعین «أياما» کہنا۔ نامعلوم وقت پر توقیت بھی مفسد ہے، خواہ جہالت فاحش ہو (ہوا، بارش، کسی کی آمد یا موت، حاملہ جانور کا بچہ جننا) یا قریبی ہو (فصل کٹنا، گہائی، حاجیوں کی واپسی)۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933} اتصال کی شرط: مدت عقد کے فوراً بعد شروع ہو؛ اگر آخرِ ماہ یا کل سے شروع کی جائے تو حنفیہ، شافعیہ اور حنابلہ کے نزدیک عقد فاسد ہے، مگر حنفیہ اسے فاصلے کی مدت کو شامل مان کر درست کرتے ہیں (رمضان کے آخر میں عقد اور رمضان کے بعد دو دن کا خیار)۔ موالاۃ: مدت کے اجزا پے در پے ہوں؛ ایک دن ثابت اور ایک دن غیر ثابت ہو تو حنابلہ کے دو وجوہ ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7933}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7934} صاحبِ خیار کا تعین: یہ مجہول نہیں ہو سکتا۔ اگر فریقین نے خیار دونوں میں سے کسی ایک کو بلا تعیین دیا، یا اسے جسے ایک فریق چاہے، تو ابن قدامہ کے نزدیک باطل ہے؛ نووی کے نزدیک اگر خیار صرف ایک فریق کو دیا جائے تو بیع صحیح ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7934}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7935} عقود: خیار صرف لازم اور قابل فسخ عقود میں ہوتا ہے؛ بیع اس کا اصل میدان ہے، بیع فاسد اور مرابحہ جیسی امانت کی بیع بھی اس میں شامل ہیں۔ سلم، صرف اور ربوی کی جنس کے ساتھ بیع جمہور حنابلہ کے نزدیک مستثنیٰ ہیں کیونکہ ان میں عوض پر قبضہ شرط ہے؛ ابن عابدین کہتے ہیں کہ سلم اور صرف کا استثنا قاعدے کو متاثر کرتا ہے، اور مالکیہ مختصر مدت کے سلم میں اسے جائز کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7935} دیگر عقود: اجارہ میں حنفیہ اور مالکیہ کے نزدیک خیار عام ہے، شافعیہ اور حنابلہ اسے ذمہ کی اجارت یا ایسی معین اجارت تک محدود کرتے ہیں جس کی مدت فوراً شروع نہ ہو۔ حوالہ: حنفیہ قبول کرتے ہیں، شافعیہ اور حنابلہ نہیں کیونکہ وہ مغابنہ پر مبنی نہیں۔ قسمت: اختلاف ہے؛ مختلف الاجناس کی تقسیم رضامندی سے ہوتی ہے، ایک جنس کی قیمی اشیا کی تقسیم میں خیار صحیح ہے۔ کفالہ: حنفیہ کے نزدیک داخل ہے اور ابو حنیفہ کے نزدیک تین دن سے زیادہ جائز ہے کیونکہ یہ وسعت پر مبنی ہے۔ وقف: ابو یوسف کے نزدیک جائز، محمد، شافعی اور احمد کے نزدیک نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7935}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7936} خیار کس کو دیا جائے: دونوں عاقدین کو یا ایک کو دیا جا سکتا ہے، جمہور کا یہی قول ہے؛ ثوری اور ابن شبرمہ کے نزدیک صرف خریدار کے لیے ہے۔ کسی اجنبی کو دینا جائز ہے، فقہاء اس پر متفق ہیں بشرطیکہ وہ خود بات کرنے کا اہل ہو؛ حنفیہ کی دلیل استحسان ہے کیونکہ کم تجربہ کار عاقد کو ایسے شخص کی ضرورت ہوتی ہے جو زیادہ بصیرت رکھتا ہو، زفر نے اعتراض کیا کیونکہ خیار عقد کے تقاضوں میں سے ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7936}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7937} خیار کا اجنبی کے لیے ہونا اور مشورے کا الفاظ: مالکیہ کے نزدیک اگر کہا «على مشورة فلان» تو عاقد اور مشورہ دینے والا دونوں خود ہی امضا یا رد کر سکتے ہیں، کیونکہ مشورہ موافقت کو لازم نہیں کرتا؛ اور اگر کہا «على خيار فلان» یا «رضاه» تو معتمد قول یہ ہے کہ یہ تفویض ہے، توکیل نہیں، اس لیے عاقد خود فسخ یا ابرام نہیں کر سکتا۔ شافعیہ کے نزدیک اجنبی کو خیار دینا تفویض یا تحکیم ہے، توکیل نہیں، اور ابو یعلیٰ کے نزدیک یہ صورت باطل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7938} مشورہ کی شرط: شافعیہ کے دو اتجاہات ہیں: ایک یہ کہ عاقد فسخ نہ کرے جب تک کہہ نہ دے کہ اس نے مشورہ کیا اور اسے فسخ کا حکم ملا؛ دوسرا حنابلہ کا، کہ مشورہ شرط نہیں، اور نووی نے پہلے قول کی تصحیح کی۔ جس سے مشورہ لینا ہو اس کا تعین ضروری ہے؛ «على أن أشاور» بغیر تعیین کافی نہیں، اور اذرعی کے نزدیک کافی ہے۔ حنفیہ کا اس مسئلے میں کوئی نص نہیں ملا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7938}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7939} خیار میں نیابت: خیار اسی عاقد کو حاصل ہوتا ہے جو اسے اپنے لیے شرط کرے، خواہ وہ مالک ہو، وصی ہو، ولی ہو یا وکیل؛ ولایت اور وصایت میں شرط صغیر کی بہتری کے لیے ہوتی ہے، اور وکالت میں عقد کرنے کا مطلق حکم خیار کو بھی شامل ہے؛ مضارب اور شریک عنان یا مفاوضہ بھی عقد شرکت کے اطلاق سے خیار شرط کر سکتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7939} شافعیہ کے نزدیک وکیل: وکیل اپنے لیے یا موکل کے لیے خیار شرط کر سکتا ہے؛ بیع کا وکیل مشتری کے لیے اور خرید کا وکیل بائع کے لیے خیار شرط نہیں کر سکتا، ورنہ عقد باطل ہے جب تک موکل اجازت نہ دے؛ اور اصح یہ ہے کہ خیار اسی کو ملے گا جس کے لیے شرط ہوئی۔ حنابلہ بھی اپنے لیے شرط کرنے کو درست کہتے ہیں، اور وکیل پر لازم ہے کہ موکل کے مفاد میں کام کرے کیونکہ وہ امین ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7939}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7940} متعدد فریق: جس طرح خیار ایک عاقد کو حاصل ہوتا ہے، اسی طرح متعدد فریقوں کو بھی ہو سکتا ہے، جیسے دو شریک کوئی چیز بیچیں یا ایک مالک دو خریداروں کو بیچے اور دونوں کے لیے خیار شرط ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7940} عقد کے حکم پر اثر: خیار صاحبِ خیار کے حق میں عقد کا حکم فوراً ثابت ہونے سے روکتا ہے؛ ابو حنیفہ کے نزدیک یہ دوسرے عاقد کے حق میں بھی ہے، جبکہ صاحبین کے نزدیک بغیر خیار والے کے حق میں حکم نافذ ہوتا ہے۔ کاسانی کے نزدیک عقد موقوف ہے، یعنی حکم اس وقت تک معلوم نہیں جب تک خیار ساقط نہ ہو۔ شافعیہ کے نزدیک بھی موقوف ہے، اور مالکیہ کے نزدیک محلِ خیار کی ملکیت بائع کے پاس باقی رہتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7940}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7941} ملکیت کی منتقلی پر اثر: اگر خیار دونوں کے لیے ہو تو حنفیہ کے نزدیک نہ مبیع بائع کی ملک سے نکلتا ہے اور نہ ثمن مشتری کی ملک سے؛ شافعیہ ملک کو خیار ختم ہونے تک موقوف رکھتے ہیں، اور حنابلہ عقد کے ساتھ ہی ملک مشتری کو منتقل مانتے ہیں۔ اگر خیار ایک کے لیے ہو تو مالکیہ کے نزدیک ملک بائع کے پاس رہتی ہے، امضا ناقل ہے؛ ان کا ایک اور قول ملک مشتری کے لیے ہے، اور احمد سے ایک روایت وقف کی ہے۔ بائع کو خیار ہو تو ملک بائع کی رہتی ہے اور مشتری تصرف نہیں کر سکتا، بائع کا تصرف فسخ شمار ہوتا ہے؛ مشتری کو خیار ہو تو ملک بائع سے زائل ہو جاتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7941}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7942} ضمانِ محلِ خیار (حنفیہ): اگر بائع کو خیار ہو اور قبض سے پہلے محل ہلاک ہو جائے تو ضمان بائع پر ہے؛ اگر قبض کے بعد اور خیار ختم ہونے کے بعد مشتری کے ہاتھ میں ہلاک ہو تو ضمان ثمن کے ساتھ مشتری پر ہے؛ اگر بائع کا خیار ہو اور مشتری کے ہاتھ میں خیار کے دوران ہلاک ہو تو ضمان قیمت کے ساتھ مشتری پر ہے کیونکہ وہ عقد کی بنیاد پر مقبوض ہے؛ اگر مشتری کا خیار ہو اور اس کے ہاتھ میں ہلاک ہو تو ضمان ثمن کے ساتھ مشتری پر ہے کیونکہ ہلاکت عیب کی طرح ہے جو تلف تک پہنچ جائے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7942}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7943} ضمان دیگر مذاہب میں: مالکیہ کے نزدیک ضمان بائع پر ہے، سوائے اس کے کہ وہ چیز جو چھپائی جا سکتی ہو ہلاک ہو اور بینہ سے ہلاکت ثابت نہ ہو تو ضمان مشتری پر؛ شافعیہ کے نزدیک قبض کے بعد آسمانی آفت سے تلف ہو تو اگر خیار بائع کا ہو تو بیع فسخ ہو جاتی ہے، اور مشتری کا ہو تو فسخ نہیں ہوتی کیونکہ ضمان قبض سے اس پر آ گیا؛ حنابلہ کے نزدیک ملک مشتری کی ہے اور ضمان بھی، مگر ماپی اور تولی جانے والی چیزوں میں ضمان مشتری پر تبھی آئے گا جب ماپ یا وزن ہو جائے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7944}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7945} خیار میں زیادتیاں: حنفیہ زیادتی کو چار قسمیں کرتے ہیں: متصلہ متولدہ جیسے موٹاپا، بیماری سے شفا اور پھل کا پکنا؛ متصلہ غیر متولدہ جیسے رنگائی، سلائی، زمین میں عمارت اور درخت؛ منفصلہ متولدہ جیسے بچہ، پھل، دودھ، انڈے اور اون؛ اور منفصلہ غیر متولدہ جیسے کرائے کی شے کی آمدنی، جانور پر جنایت کا ارش اور عقر۔ دوسرے مذاہب صرف متصل اور منفصل کی تقسیم کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7946} حنفیہ کے نزدیک زیادتی کا حکم: اصل یہ ہے کہ زیادتی رد سے مانع ہے، اس لیے عقد لازم ہوتا ہے اور زیادتیاں مشتری کی ہوتی ہیں؛ البتہ منفصلہ غیر متولدہ رد سے مانع نہیں اور متصلہ متولدہ میں اختلاف ہے۔ منفصلہ غیر متولدہ میں فسخ ہو تو ابو حنیفہ اصل کے ساتھ زیادتی بھی واپس کرتے ہیں کیونکہ ملکیت موقوف تھی، صاحبین کے نزدیک زیادتی مشتری کی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7946}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7947} متصلہ متولدہ زیادتی: ابو حنیفہ اور ابو یوسف کے نزدیک یہ خیار کو ساقط کرتی ہے اور صاحبِ خیار اصل اور زیادتی دونوں کا مالک ہو جاتا ہے؛ امام محمد کے نزدیک خیار باقی رہتا ہے اور امضا یا فسخ کا اختیار ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7947} مالکیہ کے نزدیک زیادتیاں: بچہ اور اون مشتری کے ہیں کیونکہ وہ باقی رہنے والا جزء ہیں؛ باقی جیسے دودھ، گھی، انڈے اور جنایت کا ارش بائع کے ہیں، کیونکہ خیار کے دوران ملکیت بائع کی رہتی ہے یہاں تک کہ صاحبِ خیار اپنا خیار استعمال کرے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7947} شافعیہ کے نزدیک زیادتیاں: خیار کے دوران منفصلہ زیادتی اسی کی ہے جس کی ملک ہو، اور اگر خیار دونوں کا ہو تو وہ مبیع کی طرح موقوف ہے؛ متصلہ زیادتی اصل کے تابع ہے، اور عقد کے وقت موجود حمل اصل کا حصہ ہے۔ حنابلہ کے نزدیک تمام زیادتیاں مشتری کی ہیں، خواہ متصل ہوں یا منفصل، اور قبضے سے پہلے بائع کے پاس ہوں تب بھی، حدیث «الخراج بالضمان» سے استدلال کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7947}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7948} خیار کی مدت میں دونوں بدلوں کی حوالگی: اس پر اتفاق ہے کہ مطلق عقد میں خیار کی مدت کے دوران دونوں بدلوں کی حوالگی واجب نہیں؛ نہ بائع پر مبیع دینا لازم ہے اور نہ مشتری پر ثمن دینا، جب تک مدت نہ گزرے یا صاحبِ خیار خیار ساقط نہ کرے۔ آزمائش کے لیے رضامندی سے حوالگی خیار کو باطل نہیں کرتی، لیکن ملکیت کی نیت سے ہو اور خیار بائع کا ہو تو اس کا خیار باطل ہو جاتا ہے۔ اگر ایک فریق نے رضاکارانہ دے دیا اور دوسرا انکار کر دے تو ابو حنیفہ اور شافعیہ کے نزدیک جبر نہیں، اور دینے والا واپس لے سکتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7948}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7949} استعمال سے پہلے خیار کا ساقط ہونا: بچے کے بالغ ہونے سے جس کا عقد ولی نے کیا ہو، جنون وغیرہ سے، اور صاحبِ خیار کی موت سے (جس میں اختلاف ہے)۔ ابو یوسف کے نزدیک صغیر کے بالغ ہونے سے ولی کا خیار ساقط ہو جاتا ہے اور عقد لازم ہو جاتا ہے، محمد کے نزدیک ساقط نہیں ہوتا۔ جنون بذاتِ خود خیار کو ساقط نہیں کرتا، بلکہ پوری مدت گزر جانا بغیر فسخ کے ساقط کرتا ہے؛ اور اگر مدت کے دوران افاقہ ہو جائے تو اصح حنفی قول کے مطابق باقی خیار برقرار رہتا ہے۔ مالکیہ کے نزدیک صاحبِ خیار مجنون ہو اور افاقہ کی امید نہ ہو تو حاکم وہ صورت دیکھے جو اس کے لیے بہتر ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7949}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7950} خیار کا اختتام امضا یا مدت گزرنے یا فسخ سے ہوتا ہے۔ امضا صریح ہو سکتا ہے، جیسے «میں نے بیع کی اجازت دی» یا «میں نے خیار ساقط کیا»، یا دلالت سے، جیسے مالک کی طرح مبیع میں تصرف کرنا، بیچنا، سودا کرنا، اجارہ، ہبہ یا رہن۔ دوسرے عاقد کو اجازت کا علم ہونا ضروری نہیں۔ خیار ساقط کرنے کے بدلے مال پر صلح ہو سکتی ہے، اور وہ قیمتِ ثمن میں اضافہ شمار ہوتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7951}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7952} موت: حنفیہ اور حنابلہ کے نزدیک صاحبِ خیار کی موت سے خیار ساقط ہو جاتا ہے، اور مالکیہ اور شافعیہ کے نزدیک وارثوں کو منتقل ہوتا ہے۔ اگر جس پر خیار ہو وہ مر جائے تو خیار باقی رہتا ہے اور وارثوں کے سامنے رد ہو سکتا ہے، جیسا کہ سرخسی نے نقل کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7951} مدت گزرنا: عام طور پر متفق ہے کیونکہ خیار مدت سے مقیّد ہے اور عقد لازم ہونا اصل ہے؛ مدت گزرنے کو امضا سمجھا جاتا ہے، اگرچہ قاضی ابو یعلیٰ نے اختلاف کیا۔ مالکیہ مدت گزرنے کو خیار کا ختم ہونا کہتے ہیں نہ امضا؛ اگر مبیع مشتری کے ہاتھ میں ہو تو امضا، اور بائع کے ہاتھ میں ہو تو فسخ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7953} فسخ سے انتہا: فسخ قول سے صریح ہو سکتا ہے، جیسے «میں نے بیع فسخ کی» یا «میں نے ثمن واپس کیا»، یا فعل سے دلالۃً۔ بائع کا یہ کہنا کہ میں قیمت بڑھائے بغیر نہیں بیچوں گا، اور مشتری کا یہ کہنا کہ کم کیے بغیر نہیں خریدوں گا، صریح فسخ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7953} عمل سے فسخ: صاحبِ خیار مالک کی طرح مبیع میں تصرف کرے، یا خیار مشتری کا ہو اور ثمن عین ہو تو ثمن میں تصرف کرے، تو فسخ ہے؛ دین کا فسخ عمل سے نہیں ہو سکتا کیونکہ اثمان نام لینے سے متعین نہیں ہوتے۔ علت یہ ہے کہ ایسا تصرف ملکیت کو باقی رکھنے کی دلیل ہے، اور ملکیت باقی رکھنا فسخ ہی سے ہوتا ہے۔ ابن الہمام اور کاسانی کے نزدیک بائع کا مبیع میں جو کام اجازت ہوتا، ثمن میں ہو تو فسخ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7954} حنفیہ کی دلالۃً فسخ کی تفریعات: کھانا، پینا اور پہننا خیار ساقط کرتے ہیں، قاضی خان کے نزدیک ایک بار پہننے سے خیار باطل نہیں ہوتا؛ کتاب سے نقل کرنا خیار ساقط نہیں کرتا، مٹا دینا کرتا ہے؛ جانور پر سوار ہو کر پانی پلانا، واپس کرنا یا چارہ دینا بعض کے نزدیک اجازت ہے؛ مبیع کا فروخت، ہبہ یا رہن تسلیم کے ساتھ خیار ساقط کرتا ہے، بغیر تسلیم کے نہیں؛ اجارہ بغیر تسلیم کے بھی فسخ ہے بعض کے نزدیک؛ ابو بکر بن الفضل تسلیم کو آزمائش کے لیے (خیار باقی) اور تملیک کے لیے (خیار باطل) میں تقسیم کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7954}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7955} فسخ نافذ ہونے کی شرائط: خیار کا موجود ہونا؛ ابو حنیفہ اور محمد کے نزدیک دوسرے عاقد کو فسخ کا علم ہونا، ورنہ فسخ موقوف رہتا ہے اور مدت میں علم ہو تو نافذ، ورنہ عقد لازم ہو جاتا ہے؛ ابو یوسف کے تین اقوال ہیں اور مشہور یہ ہے کہ علم شرط نہیں، ابن الہمام نے اسی کو ترجیح دی۔ جمہور (مالکیہ، شافعیہ، حنابلہ) کے نزدیک علم شرط نہیں۔ اور فسخ سے صفقہ میں تفریق نہ ہو، کہ کچھ میں عقد جاری رہے اور کچھ میں فسخ ہو؛ شافعیہ کے نزدیک اصح یہ ہے کہ یہ جائز نہیں، اور مالکیہ سب کو واپس کرنے پر مجبور کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7955}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7956} موت سے خیار کی منتقلی: امام مالک اور شافعی کے نزدیک خیار وارث کو منتقل ہوتا ہے، کیونکہ یہ مال کی اصلاح کے لیے ثابت حق ہے جیسے رہن؛ حنفیہ کے نزدیک خیار وراثت میں نہیں جاتا کیونکہ یہ ذاتی مشیئت ہے۔ حنابلہ کے نزدیک خیار صرف اس صورت میں وارث کو ملے گا جب مورث نے موت سے پہلے اس کا مطالبہ کیا ہو؛ ابن قدامہ کے نزدیک مرنے والے کا خیار باطل ہو جاتا ہے اور دوسرے کا باقی رہتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7956}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7957} جنون اور بے ہوشی: شافعیہ کے نزدیک جنون یا بے ہوشی سے خیار منقطع نہیں ہوتا، ولی یا حاکم اس کی طرف سے وہ فیصلہ کرے جس میں اس کا فائدہ ہو، اور گونگے کے لیے جس کا اشارہ نہ سمجھا جائے حاکم نائب مقرر کرے۔ مالکیہ کے نزدیک جنون بغیر افاقہ کی امید کے یا دوسرے کو ضرر کی حد تک طویل ہو تو سلطان دیکھتا ہے؛ ہوش میں آ جانے والا فسخ یا اجازت کر سکتا ہے اور ولی کا فعل بدل سکتا ہے اگر ثبوت ہو؛ بے ہوش انتظار کرتا ہے، اور مدت کے بعد افاقہ ہو تو نئی مدت دی جاتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7957}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7958}'
