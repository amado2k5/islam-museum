id: concept/idrak-fiqh
class: concept
kind: legal
label:
  ar: "إدراك"
  en: "Idrak (attaining: catching up with a prayer, reaching a term, and the right to one's own property)"
  ur: "ادراک (نماز کا پانا، وقت کو پہنچنا، اور اپنے مال کا حق)"
summary:
  ar: "الإدراك في الفقه اللحوق والبلوغ، وقد يكون معنويا كلزوم الثمن للمشتري. وأهم أحكامه إدراك الفريضة وفضيلة الجماعة، وفي المعاملات أن من أدرك عين ماله عند غيره فهو أحق بها، وعليها يقوم ضمان الدرك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2002} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2003}"
  en: "In law, idrak (attaining) means catching up and reaching a stage, and it may be figurative, as when a price binds a buyer. Its main rulings concern attaining the obligatory prayer and the merit of congregational prayer; in dealings, whoever finds his own property with another has the better claim to it, and the guarantee of eviction rests on this. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2002} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2003}"
  ur: "فقہ میں ادراک سے مراد پانا اور کسی مرحلے کو پہنچنا ہے، اور یہ معنوی بھی ہو سکتا ہے، جیسے قیمت کا خریدار پر لازم ہونا۔ اس کے بڑے احکام فرض نماز اور جماعت کی فضیلت کے پانے سے متعلق ہیں؛ معاملات میں جو شخص اپنا مال کسی اور کے پاس پائے وہ اس کا زیادہ حقدار ہے، اور ضمان درک اسی پر قائم ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2002} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2003}"
