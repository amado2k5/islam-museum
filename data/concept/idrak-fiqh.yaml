id: concept/idrak-fiqh
class: concept
kind: legal
label:
  ar: "إدراك"
  en: "Idrak (attaining: catching up with a prayer, reaching a term, and the right to one's own property)"
  ur: "ادراک ⁦(نماز کا پانا، وقت کو پہنچنا، اور اپنے مال کا حق)⁩"
  es: "Idrak (obtener: alcanzar una plegaria, cumplir un plazo y obtener el derecho a la propia propiedad)"
  fr: "Idrak (atteindre: accomplir une prière, atteindre un terme et obtenir le droit à sa propre propriété)"
  tr: "Algı"
  id: "Persepsi"
summary:
  ar: "الإدراك في الفقه اللحوق والبلوغ، وقد يكون معنويا كلزوم الثمن للمشتري. وأهم أحكامه إدراك الفريضة وفضيلة الجماعة، وفي المعاملات أن من أدرك عين ماله عند غيره فهو أحق بها، وعليها يقوم ضمان الدرك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2002} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2003}"
  en: "In law, idrak (attaining) means catching up and reaching a stage, and it may be figurative, as when a price binds a buyer. Its main rulings concern attaining the obligatory prayer and the merit of congregational prayer; in dealings, whoever finds his own property with another has the better claim to it, and the guarantee of eviction rests on this. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2002} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2003}"
  ur: "فقہ میں ادراک سے مراد پانا اور کسی مرحلے کو پہنچنا ہے، اور یہ معنوی بھی ہو سکتا ہے، جیسے قیمت کا خریدار پر لازم ہونا۔ اس کے بڑے احکام فرض نماز اور جماعت کی فضیلت کے پانے سے متعلق ہیں؛ معاملات میں جو شخص اپنا مال کسی اور کے پاس پائے وہ اس کا زیادہ حقدار ہے، اور ضمان درک اسی پر قائم ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2002} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2003}"
  es: "En derecho, idrak (alcanzar) significa ponerse al día y llegar a una etapa, y puede ser figurativo, como cuando un precio vincula a un comprador. Sus principales normas se refieren al cumplimiento de la oración obligatoria y al mérito de la oración congregacional; en las transacciones, quien encuentra su propiedad en poder de otro tiene mejor derecho sobre ella, y la garantía de desalojo se basa en esto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2002} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2003}"
  fr: "En droit, « idrak » (atteindre) signifie rattraper et parvenir à un certain stade, et peut être employé au sens figuré, comme lorsqu'un prix lie un acheteur. Ses principales règles concernent l'accomplissement de la prière obligatoire et le mérite de la prière en congrégation; dans les transactions, celui qui trouve son bien chez autrui a un droit prioritaire sur celui-ci, et la garantie d'expulsion repose sur ce principe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2002} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2003}"
  tr: "Yargıda algı, edinim ve olgunlaşma ile ilgilidir ve alıcıya karşı fiyat yükümlülüğü olarak maddi olmayan olabilir. En önemli kararları, topluluğun yükümlülüğünü ve erdemini tanımaktır. İşlemlerde, mal varlığına başkalarıyla sahip olan kişi ona daha fazla hak kazanır ve mülkiyet sorumluluğu buna dayanır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.2002} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.2003}"
  id: "Persepsi dalam yurisprudensi merujuk pada akuisisi dan jatuh tempo, dan bisa bersifat tidak berwujud sebagai kewajiban harga kepada pembeli. Putusan terpentingnya adalah mengakui kewajiban dan kebajikan komunitas. Dalam transaksi, siapa pun yang memiliki barang propertinya bersama orang lain lebih berhak atasnya, dan tanggung jawab atas kepemilikan tersebut didasarkan padanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.2002} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.2003}"
