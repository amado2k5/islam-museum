id: concept/izm-al-lisan
class: concept
kind: scientific
label:
  ar: عظم اللسان
  en: Enlargement of the tongue
  ur: زبان کا بڑا ہونا
  es: "Agrandamiento de la lengua"
  fr: "Hypertrophie de la langue"
summary:
  ar: قد يكون عظم اللسان من دم غالب وقد يكون من رطوبة كثيرة بلغمية مرخية مهيجة وقد يعظم كثيراً حتى يخرج من الفم ولا يسعه الفم وهذا العظم قد أفرد ذكره من باب الورم لما هو مختص به من الفرق، وأما الدموي والكائن من مادة حارة فيعالج بأن يدام دلكه بالمقطعات الحامضة والقابضة من هذا الجنس والكائن عن الرطوبات فبأن يدام دلكه من هذا الجنس بعد الاستفراغات فيعود إلى حجمه ويدخل الخارج منه {cite:canon-ibn-sina-print-v2 p.257} {cite:canon-ibn-sina-print-v2 p.258}
  en: 'The tongue''s enlargement may come from prevailing blood or from a great relaxing irritating phlegmy moisture; it may grow so great it leaves the mouth and the mouth cannot hold it, and this greatness is given its own mention apart from the tumour chapter for the distinction proper to it. The sanguine and the one from hot matter is treated by keeping up its rubbing with the cutting sour astringents of this kind; the one from moistures by keeping up its rubbing of this kind after evacuations, until it returns to its size and the protruding part goes back in {cite:canon-ibn-sina-print-v2 p.257} {cite:canon-ibn-sina-print-v2 p.258}'
  ur: 'زبان کا بڑا ہونا غالب خون سے بھی ہو سکتا ہے اور بہت سی نرم کر دینے والی ابھارنے والی بلغمی رطوبت سے بھی؛ اور اتنا بڑھ سکتا ہے کہ منہ سے باہر نکل آئے اور منہ میں نہ سمائے؛ اس بڑائی کو ورم کے باب سے جدا اس لیے بیان کیا گیا کہ اس کا اپنا فرق ہے؛ خونی اور گرم مادے والا اسی جنس کے مفرّق حامض قابضوں سے مسلسل مالنے سے علاج ہوتا ہے اور رطوبتوں والا استفراغوں کے بعد اسی جنس سے مسلسل مالنے سے، یہاں تک کہ اپنے حجم کو لوٹے اور نکلا ہوا حصہ اندر چلا جائے {cite:canon-ibn-sina-print-v2 p.257} {cite:canon-ibn-sina-print-v2 p.258}'
  es: "El agrandamiento de la lengua puede deberse a la presencia de sangre o a una gran cantidad de flema irritante y relajante; puede crecer tanto que se salga de la boca y esta no pueda contenerla, y este tamaño se menciona aparte del capítulo sobre tumores para la distinción que le corresponde. La lengua sanguínea y la causada por materia caliente se tratan frotándolas con astringentes ácidos y cortantes de este tipo; la causada por humedades, frotándolas con este tipo de astringentes después de las evacuaciones, hasta que recupere su tamaño y la parte protuberante vuelva a su lugar. {cite:canon-ibn-sina-print-v2 p.257} {cite:canon-ibn-sina-print-v2 p.258}"
  fr: "L'enflure de la langue peut être due à une accumulation de sang ou à une importante humidité phlegmatique irritante et relaxante; elle peut devenir si volumineuse qu'elle sort de la bouche et que celle-ci ne peut la retenir. Cette hypertrophie est traitée séparément, en dehors du chapitre consacré aux tumeurs, en raison de sa spécificité. L'enflure due au sang ou à une substance chaude est traitée par frictions répétées avec des astringents acides et mordants de ce type; celle due à l'humidité, par frictions répétées après les évacuations, jusqu'à ce qu'elle retrouve sa taille normale et que la partie saillante se rétracte. {cite:canon-ibn-sina-print-v2 p.257} {cite:canon-ibn-sina-print-v2 p.258}"
