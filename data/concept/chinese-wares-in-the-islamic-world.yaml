summary:
  ar: "الخزف والبورسلين الصيني الذي وصل إلى بلاد الإسلام بحرًا في الغالب ووجدت بقاياه في نيسابور ومواقع إسلامية كثيرة، وكان لفظ «الصيني» عندهم مرادفًا للجودة، وكتب عنه سليمان التاجر والثعالبي والبيروني {cite:wilkinson-nishapur-pottery p. 296}."
  en: "Chinese earthenware and porcellanous ware that reached the Islamic lands, mostly by sea, found at Nishapur and many Islamic sites; 'chini' was almost a synonym for excellence, and Sulayman the merchant, al-Tha'alibi and al-Biruni wrote of it {cite:wilkinson-nishapur-pottery p. 296}."
  ur: "چینی مٹی کے برتن اور چینی ظروف جو زیادہ تر سمندر کے راستے اسلامی ممالک پہنچے اور نیشاپور اور بہت سے اسلامی مقامات پر ملے؛ «چینی» عمدگی کا مترادف تھا {cite:wilkinson-nishapur-pottery p. 296}."
