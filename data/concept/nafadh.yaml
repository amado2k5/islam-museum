id: concept/nafadh
class: concept
kind: legal
label: { ar: "النَّفَاذ", en: "Nafadh (taking effect)", ur: "نفاذ ⁦(مؤثر ہونا)⁩", es: "Nafadh (entrando en vigor)", fr: "Nafadh (prenant effet)", tr: "Erişilebilirlik", id: "Aksesibilitas" }
summary:
  ar: "النفاذ في اللغة المضي والخلوص، واصطلاحاً ترتب أثر التصرف الصحيح في الحال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15803} وكل نافذ صحيح، وليس كل صحيح نافذاً، والإجازة ترد على العقد الموقوف دون النافذ والباطل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15804} ومن التصرفات غير النافذة تصرف الفضولي والصبي المميز والسفيه، وبيع الراهن أو المؤجر أو الشريك بغير إذن من له الحق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15804} والعقد الموقوف صحيح عند الحنفية والمالكية وقول للشافعي وإحدى روايتين عن أحمد، ويتوقف نفاذه على الإجازة، وهو باطل عند الشافعية في المشهور والحنابلة في المذهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15804}"
  en: "Nafadh, in the lexicon, is passing and taking effect; as a term it is the effect of a valid disposition taking hold at once. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15803} Every effective disposition is valid, but not every valid one is effective, and ratification applies to a suspended contract but not to an effective or void one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15804} Dispositions that do not take effect include those of an unauthorised agent, a discerning minor and a spendthrift, and a sale by a mortgagor, landlord or partner without the consent of the party whose right is involved. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15804} A suspended contract is valid in the Hanafi and Maliki schools, in an old Shafi'i view and in one Hanbali report, and takes effect on ratification; it is void in the prevailing Shafi'i and Hanbali views. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15804}"
  ur: "نفاذ لغت میں گزرنے اور خالص ہونے کو کہتے ہیں، اور اصطلاح میں درست تصرف کا فوری اثر ہونا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15803} ہر نافذ تصرف صحیح ہے، مگر ہر صحیح نافذ نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15804} فضولی، ممیز بچے اور سفیہ کے تصرفات نافذ نہیں ہوتے، اور رہن دینے والے، کرایہ دار یا شریک کا حق رکھنے والے کی اجازت کے بغیر بیع بھی نافذ نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15804} موقوف عقد حنفیہ اور مالکیہ کے نزدیک صحیح ہے اور اجازت پر نافذ ہوتا ہے، جبکہ شافعیہ کے مشہور قول اور حنابلہ کے مذہب میں باطل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15804}"
  es: "Nafadh, en el léxico, es pasar y entrar en vigor; como término es el efecto de una disposición válida que entra en vigor de inmediato. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15803} Toda disposición efectiva es válida, pero no toda válida es efectiva, y la ratificación se aplica a un contrato suspendido pero no a uno efectivo o nulo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15804} Las disposiciones que no entran en vigor incluyen las de un agente no autorizado, un menor discernidor y un derrochador, y una venta por un hipotecante, arrendador o socio sin el consentimiento de la parte cuyo derecho está en juego. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15804} Un contrato suspendido es válido en las escuelas Hanafi y Maliki, en una antigua opinión Shafi'i y en un informe Hanbali, y surte efecto tras la ratificación; es nulo en las opiniones Shafi'i y Hanbali predominantes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15804}"
  fr: "Le terme « nafadh », dans le lexique, signifie « transitoire et prenant effet »; il désigne l'effet immédiat d'une disposition valable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15803} Toute disposition valable est effective, mais l'inverse n'est pas vrai. La ratification s'applique à un contrat suspendu, mais non à un contrat valable ou nul. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15804} Parmi les dispositions inopérantes figurent celles d'un mandataire non autorisé, d'un mineur capable de discernement et d'un dépensier, ainsi que la vente effectuée par un emprunteur, un bailleur ou un associé sans le consentement de la partie dont le droit est en jeu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15804} Un contrat suspendu est valable selon les écoles hanafite et malikite, selon une ancienne opinion shafi'ite et selon un hadith hanbalite, et prend effet dès sa ratification. Elle est nulle selon les avis shafi'ite et hanbalite dominants. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15804}"
  tr: "Dilde 'icra' işlem ve tasfiye anlamına gelir ve teknik olarak, doğru işlemin hemen etkisiyle ortaya çıkar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15803} Ve her geçerli geçerli geçerlidir, her geçerli değildir ve izin, geçerli ve geçersiz olmayan askıya alınmış sözleşmeye uygulanır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15804} Etkisiz eylemler arasında meraklı, ayrıcalıklı çocuk, aptal ve rehin verenin, kiralanın veya ortağın gerçek sahibi izni olmadan satılması yer alır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15804} Durdurulmuş sözleşme Hanafi ve Maliki'ye göre geçerlidir ve Al-Shafi'i'nin bir görüşü ile Ahmad'ın iki rivayetinden biridir. Geçerliliği yetkilendirmeye bağlıdır, ancak okuldaki Meşhura ve Hanbali'lere göre Şafi'lere göre geçersizdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15804}"
  id: "Dalam bahasa, 'penegakan' berarti melanjutkan dan membersihkan, dan secara teknis, itu langsung berasal dari efek transaksi yang benar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15803} Dan setiap yang sah adalah sah, tidak semua yang sah adalah sah, dan izin berlaku untuk kontrak yang ditangguhkan tanpa kontrak yang sah dan batal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15804} Di antara tindakan yang tidak efektif adalah tindakan orang yang penasaran, anak yang berhak istimewa, yang bodoh, dan penjualan gadai, penyewa, atau mitra tanpa izin pemilik sah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15804} Kontrak yang dihentikan berlaku menurut Hanafi dan Maliki dan merupakan pandangan Al-Shafi'i serta salah satu dari dua narasi Ahmad. Keabsahannya bergantung pada otorisasi, tetapi tidak sah menurut Shafi'i menurut Mashhura dan Hanbalis di aliran tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15804}"
