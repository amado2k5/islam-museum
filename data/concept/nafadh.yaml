label: { ar: "النَّفَاذ", en: "Nafadh (taking effect)", ur: "نفاذ (مؤثر ہونا)" }
summary:
  ar: "النفاذ في اللغة المضي والخلوص، واصطلاحاً ترتب أثر التصرف الصحيح في الحال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15803} وكل نافذ صحيح، وليس كل صحيح نافذاً، والإجازة ترد على العقد الموقوف دون النافذ والباطل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15804} ومن التصرفات غير النافذة تصرف الفضولي والصبي المميز والسفيه، وبيع الراهن أو المؤجر أو الشريك بغير إذن من له الحق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15804} والعقد الموقوف صحيح عند الحنفية والمالكية وقول للشافعي وإحدى روايتين عن أحمد، ويتوقف نفاذه على الإجازة، وهو باطل عند الشافعية في المشهور والحنابلة في المذهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15804}"
  en: "Nafadh, in the lexicon, is passing and taking effect; as a term it is the effect of a valid disposition taking hold at once. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15803} Every effective disposition is valid, but not every valid one is effective, and ratification applies to a suspended contract but not to an effective or void one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15804} Dispositions that do not take effect include those of an unauthorised agent, a discerning minor and a spendthrift, and a sale by a mortgagor, landlord or partner without the consent of the party whose right is involved. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15804} A suspended contract is valid in the Hanafi and Maliki schools, in an old Shafi'i view and in one Hanbali report, and takes effect on ratification; it is void in the prevailing Shafi'i and Hanbali views. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15804}"
  ur: "نفاذ لغت میں گزرنے اور خالص ہونے کو کہتے ہیں، اور اصطلاح میں درست تصرف کا فوری اثر ہونا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15803} ہر نافذ تصرف صحیح ہے، مگر ہر صحیح نافذ نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15804} فضولی، ممیز بچے اور سفیہ کے تصرفات نافذ نہیں ہوتے، اور رہن دینے والے، کرایہ دار یا شریک کا حق رکھنے والے کی اجازت کے بغیر بیع بھی نافذ نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15804} موقوف عقد حنفیہ اور مالکیہ کے نزدیک صحیح ہے اور اجازت پر نافذ ہوتا ہے، جبکہ شافعیہ کے مشہور قول اور حنابلہ کے مذہب میں باطل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15804}"
