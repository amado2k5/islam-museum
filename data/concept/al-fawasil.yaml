id: concept/al-fawasil
class: concept
kind: discipline
label:
  ar: "الفواصل ورؤوس الآي"
  en: "Verse-endings (fawasil)"
  ur: "فواصل اور رؤوسِ آیات"
summary:
  ar: "الفاصلة كلمة آخر الآية كقافية الشعر وقرينة السجع، وهي النوع الثالث عند الزركشي؛ فرّق الداني بين الفاصلة ورأس الآية، وسُميت فواصل لا أسجاعًا تنزيهًا للقرآن، واختلفوا في وقوع السجع فيه: نفاه الرماني والباقلاني ونقله عن الأشعري، وأثبته آخرون."
  en: "A fasila is the last word of a verse, like a poem's rhyme or the paired end of rhymed prose; it is al-Zarkashi's third type. Al-Dani distinguished the fasila from the verse-end; the endings were called fawasil rather than saj' to honour the Qur'an, and scholars differed over whether rhymed prose occurs in it: al-Rummani and al-Baqillani denied it, the latter citing al-Ash'ari, while others affirmed it."
  ur: "فاصلہ آیت کا آخری کلمہ ہے، جیسے شعر کا قافیہ اور سجع کا قرینہ؛ یہ زرکشی کے ہاں تیسری نوع ہے۔ دانی نے فاصلہ اور رأسِ آیت میں فرق کیا؛ قرآن کی تعظیم میں انہیں سجع کے بجائے فواصل کہا گیا، اور اس میں سجع کے وقوع پر اختلاف ہوا: رمانی اور باقلانی نے انکار کیا، باقلانی نے اشعری سے بھی نقل کیا، اور دوسروں نے اثبات کیا۔"
