label:
  ar: ملك مريم
  en: The Angel of Maryam
  ur: مریم کا فرشتہ
summary:
  ar: الملك الذي تمثل لمريم بشراً سوياً وبشرها بغلام زكي، وهو جبريل في الرواية الأشهر؛ وتروي القصة في سورة آل عمران [[passage/quran-3-42|آل عمران
    42]] وسورة مريم [[passage/quran-19-16|مريم 16]].
  en: The angel who appeared to Maryam as a well-formed man and gave her tidings of a righteous son — identified as Jibril in the best-known reports;
    the story is told in Al 'Imran [[passage/quran-3-42|3:42]] and Maryam [[passage/quran-19-16|19:16]].
  ur: وہ فرشتہ جو مریم کے سامنے کی صورت میں ظاہر ہوا اور اسے نیک بیٹے کی بشارت دی — مشہور روایت میں وہ جبرائیل ہیں؛ یہ کہانی آل عمران [[passage/quran-3-42|آل
    عمران 42]] اور مریم [[passage/quran-19-16|مریم 16]] میں آئی ہے۔
