id: concept/malak-maryam
class: concept
kind: angel
label:
  ar: ملك مريم
  en: The Angel of Maryam
  ur: مریم کا فرشتہ
  es: "El Ángel de María"
  fr: "L'ange de Marie"
  tr: "Meryem Kralı"
  id: "Raja Maria"
summary:
  ar: الملك الذي تمثل لمريم بشراً سوياً وبشرها بغلام زكي، وهو جبريل في الرواية الأشهر؛ وتروي القصة في سورة آل عمران [[passage/quran-3-42|آل عمران
    42]] وسورة مريم [[passage/quran-19-16|مريم 16]].
  en: The angel who appeared to Maryam as a well-formed man and gave her tidings of a righteous son — identified as Jibril in the best-known reports;
    the story is told in Al 'Imran [[passage/quran-3-42|3:42]] and Maryam [[passage/quran-19-16|19:16]].
  ur: وہ فرشتہ جو مریم کے سامنے کی صورت میں ظاہر ہوا اور اسے نیک بیٹے کی بشارت دی — مشہور روایت میں وہ جبرائیل ہیں؛ یہ کہانی آل عمران [[passage/quran-3-42|آل
    عمران 42]] اور مریم [[passage/quran-19-16|مریم 16]] میں آئی ہے۔
  es: "El ángel que se apareció a María como un hombre bien formado y le dio la noticia de un hijo justo —identificado como Jibril en los relatos más conocidos; la historia se cuenta en Al 'Imran [[passage/quran-3-42|3:42]] y Maryam [[passage/quran-19-16|19:16]]."
  fr: "L'ange qui est apparu à Maryam sous la forme d'un homme bien formé et lui a annoncé la naissance d'un fils vertueux — identifié comme Jibril dans les récits les plus connus; l'histoire est racontée dans Al 'Imran [[passage/quran-3-42|3:42]] et Maryam [[passage/quran-19-16|19:16]]."
  tr: "Meryem'e insan olarak görünen ve ona saf bir çocuk olan Cebrail haberini veren melek, en ünlü rivayette; hikaye İmran Suresi'nde [[pasaj/kuran-3-42|İmran 42]] ve Maryam Suresi'nde [[pasaj/kuran-19-16|Maryam 16]] anlatılır."
  id: "Malaikat yang muncul kepada Maria sebagai manusia dan memberinya kabar baik tentang seorang anak laki-laki suci, Gabriel dalam riwayat paling terkenal; kisah ini diceritakan dalam Surah Al-Imran [[ayat/al-quran-3-42|Al-Imran 42]] dan Surah Maryam [[ayat/al-quran-19-16|Maryam 16]]."
