id: concept/canon-causes-of-quick-intoxication
class: concept
kind: scientific
label:
  ar: "أسباب سرعة السكر عند ابن سينا"
  en: "The causes of quick intoxication in the Canon"
  fr: "Causes d’ivresse rapide dans le Canon"
  ur: "جلد نشہ چڑھنے کے اسباب قانون میں"
  es: "Las causas de la intoxicación rápida en el Canon"
summary:
  ar: "يعدد ابن سينا أسباب سرعة السكر فيراها في ضعف الدماغ أو كثرة الأخلاط فيه أو قوة الشراب أو قلة الغذاء وسوء التدبير، ويقول إن علاج ما كان لضعف الرأس كعلاج النزلة المتقادمة {cite:canon-ibn-sina-print-v1 p.239}."
  en: "Ibn Sina lists the causes of quick intoxication as a weak brain, a plenty of humours in it, the strength of the wine, scant food and poor regimen, and says that what comes of a weak head is treated as old catarrh is {cite:canon-ibn-sina-print-v1 p.239}."
  fr: "Ibn Sina attribue l’ivresse rapide à un cerveau faible ou chargé d’humeurs, au vin fort, au manque d’aliments et au mauvais régime. Il traite le cas de faiblesse de tête comme le catarrhe ancien {cite:canon-ibn-sina-print-v1 p.239}."
  es: "Ibn Sina enumera las causas de la intoxicación rápida como un cerebro débil, una abundancia de humores en él, la fuerza del vino, la escasez de alimentos y un régimen deficiente, y dice que lo que viene de una cabeza débil se trata como un catarro viejo {cite:canon-ibn-sina-print-v1 p.239}."
  ur: "ابن سینا نے جلدی نشہ کی وجوہات کو کمزور دماغ، اس میں مزاح کی کثرت، شراب کی طاقت، کم خوراک اور ناقص غذا قرار دیا ہے اور کہا ہے کہ کمزور سر سے جو چیز آتی ہے اسے پرانا نزلہ سمجھا جاتا ہے۔"
