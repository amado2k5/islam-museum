label: { ar: "الأمي", en: "The unlettered (al-ummi)", fr: "Celui qui ne sait ni lire ni écrire (al-ummi)", es: "Los analfabetos (al-ummi)" }
summary:
  ar: "وصف النبي بأنه أمي لا يقرأ ولا يكتب قبل الوحي. يعدّ رشيد رضا هذا الوصف من أدلة الرسالة: أن كتاباً مفصلاً في العقائد والشرائع وغيرها نزل على لسان رجل أمي نشأ بين قومه دون أن يُعرف عنه شيء من مثله، يدل على أنه من عند الله لا من عنده. وأن علماء أهل الكتاب الذين يعرفون كتبهم يعلمون أن هذا القرآن من جنس الوحي، وأن كتبهم فيها بشارات به. هذه حجة رضا في تفسير الأنعام 114، وتنسب إليه هنا."
  en: "The description of the Prophet as unlettered, unable to read or write before the revelation. Rashid Rida counts this description among the proofs of the message: a detailed book on creed, law and other matters was sent down through the tongue of an unlettered man raised among his people, without anything of its kind being known from him, which shows that it comes from God and not from him. Scholars of the People of the Book who know their own books know that this Qur'an is of the kind of revelation, and that their books contain good tidings of it. This is Rida's argument in his commentary on Surat al-An'am 114 and is attributed to him here."
  fr: "Le terme décrit le Prophète comme ne sachant ni lire ni écrire avant la révélation. Rashid Rida y voit une preuve de sa mission : un livre détaillé sur la foi, la loi et d’autres sujets a été transmis par la bouche d’un homme qui ne savait ni lire ni écrire et avait grandi parmi les siens sans que l’on connût rien de comparable venant de lui ; pour Rida, cela montre que le livre vient de Dieu et non de cet homme. Les savants des gens du Livre qui connaissent leurs propres Écritures savent que le Coran relève de la révélation et que leurs Livres l’annoncent. C’est l’argument de Rida dans son commentaire du verset 114 de la sourate Al-An‘am ; il lui est attribué ici."
  es: "La descripción del Profeta como iletrado, incapaz de leer ni escribir antes de la revelación. Rashid Rida incluye esta descripción entre las pruebas del mensaje: un libro detallado sobre credo, ley y otros asuntos fue revelado por un hombre iletrado criado entre su pueblo, sin que se conociera nada similar de él, lo que demuestra que proviene de Dios y no de él. Los eruditos de la Gente del Libro, conocedores de sus propios libros, saben que este Corán es una revelación y que sus libros contienen buenas nuevas al respecto. Este es el argumento de Rida en su comentario sobre la Sura Al-An'am 114, y se le atribuye aquí."
