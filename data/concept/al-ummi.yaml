label: { ar: "الأمي", en: "The unlettered (al-ummi)" }
summary:
  ar: "وصف النبي بأنه أمي لا يقرأ ولا يكتب قبل الوحي. يعدّ رشيد رضا هذا الوصف من أدلة الرسالة: أن كتاباً مفصلاً في العقائد والشرائع وغيرها نزل على لسان رجل أمي نشأ بين قومه دون أن يُعرف عنه شيء من مثله، يدل على أنه من عند الله لا من عنده. وأن علماء أهل الكتاب الذين يعرفون كتبهم يعلمون أن هذا القرآن من جنس الوحي، وأن كتبهم فيها بشارات به. هذه حجة رضا في تفسير الأنعام 114، وتنسب إليه هنا."
  en: "The description of the Prophet as unlettered, unable to read or write before the revelation. Rashid Rida counts this description among the proofs of the message: a detailed book on creed, law and other matters was sent down through the tongue of an unlettered man raised among his people, without anything of its kind being known from him, which shows that it comes from God and not from him. Scholars of the People of the Book who know their own books know that this Qur'an is of the kind of revelation, and that their books contain good tidings of it. This is Rida's argument in his commentary on Surat al-An'am 114 and is attributed to him here."
