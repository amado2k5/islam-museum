  es: "Rijl al-jarad"
  fr: "Rijl al-jarad"
  tr: "çekirge adam"
  id: "manusia belalang"
summary:
  ar: "رجل الجراد في الكتاب يجري مجرى البقلة اليمانية، ينفع من السل، وطبيخه ينفع في حميات الربع والمطبقة والطربطاوس نفعا بليغا {cite:canon-ibn-sina-print-v1 p.666}"
  en: "Rijl al-jarad is in the book said to run the course of the Yemeni herb; it benefits consumption, and its decoction benefits quartan fevers, the sustained fever and tarbatawus very greatly {cite:canon-ibn-sina-print-v1 p.666}"
  ur: "رجل الجراد کتاب میں یمنی بقلہ کی راہ پر چلتا ہے؛ سل میں نافع ہے، اور اس کا جوشاندہ چوتھیا، مسلسل بخار اور طربطاوس میں بہت زیادہ نفع دیتا ہے {cite:canon-ibn-sina-print-v1 p.666}۔"
  es: "En el libro se dice que Rijl al-jarad recorre el curso de la hierba yemení; beneficia la tuberculosis, y su decocción beneficia enormemente las fiebres cuartanas, la fiebre persistente y el tarbatawus {cite:canon-ibn-sina-print-v1 p.666}"
  fr: "Le Rijl al-jarad est décrit dans le livre comme ayant le même effet que l'herbe yéménite; il est bénéfique en cas de tuberculose, et sa décoction est très efficace contre les fièvres quartan, les fièvres persistantes et les tarbatawus {cite:canon-ibn-sina-print-v1 p.666}"
  tr: "Kitaptaki çekirge adam, Yemen semizotu gibi koşar, tüberküloz için faydalı ve pişirmesi çeyrek ve tablaq ile tarbataw ateşleri için çok faydalıdır {cite:canon-ibn-sina-print-v1 s.666}"
  id: "Manusia belalang dalam buku ini berlari seperti purslane Yaman, bermanfaat untuk tuberkulosis, dan masakannya sangat bermanfaat untuk demam kuartal, tablaq, dan tarbataw {cite:canon-ibn-sina-print-v1 hlm.666}"
