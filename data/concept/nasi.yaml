summary: { ar: "النسيء: إبدال أهل الجاهلية صفة شهر بالشهر، فيقدّمون ويؤخّرون أشهر السنة توافقاً مع مواسمهم وحروبهم، حتى أطبق الحج مع قريضة الحج سنة 10هـ؛ نسخه القرآن: «إنما النسيء زيادة في الكفر».", en: "Al-Nasīʾ: shifting the sacred months to fit seasonal interests until the Hajj realigned in 10 AH — the Qurʾan abolished it as ‘an excess of disbelief’.", es: "Al-Nasīʾ: cambiar los meses sagrados para que coincidieran con los intereses estacionales hasta que el Hajj se realineó en el año 10 AH; el Corán lo abolió como 'un exceso de incredulidad'.", fr: "Al-Nasīʾ: le décalage des mois sacrés pour correspondre aux intérêts saisonniers jusqu'à ce que le Hajj soit réorganisé en 10 AH — le Coran l'a aboli comme « un excès d'incroyance ».", ur: "النصیٰ: 10 ہجری میں حج کے دوبارہ ہونے تک مقدس مہینوں کو موسمی مفادات کے مطابق منتقل کرنا - قرآن نے اسے 'کفر کی زیادتی' کے طور پر ختم کردیا۔" }
