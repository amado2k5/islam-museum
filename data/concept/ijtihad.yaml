tags: [madhahib-browser, mh-mafahim]
label:
  ar: "الاجتهاد"
  en: "Ijtihad (independent juristic reasoning)"
  es: "Ijtihad (razonamiento jurídico independiente)"
  fr: "Ijtihad (raisonnement juridique indépendant)"
  ur: "اجتہاد ⁦(آزاد فقہی استدلال)⁩"
  tr: "İctihad"
  id: "Ijtihad"
summary:
  ar: "بذل الفقيه وسعه واستفراغ جهده في استنباط الحكم الشرعي من الأدلة الشرعية {cite:nashat-al-fiqh-al-ijtihadi-azhar p. 11}. ويرى السايس أنه بدأ في عصر التنزيل، وأن غايته كشف حكم الله في الواقعة لا إنشاء التشريع، فهو ملزم للمجتهد ومن قلده، ومقيد بالقواعد الكلية للشريعة {cite:nashat-al-fiqh-al-ijtihadi-azhar p. 24, 26}. وتتعدد طرقه: أخذ الحكم من ظواهر النصوص، أو من معقولها بالقياس، أو بتنزيل الوقائع على القواعد العامة كالاستحسان والمصالح المرسلة وسد الذرائع {cite:nashat-al-fiqh-al-ijtihadi-azhar p. 11-12}."
  en: "Ijtihad: the jurist's exertion of effort to derive a ruling from the revealed sources. Al-Sayis's view is that it discloses God's ruling rather than legislating, and binds only the mujtahid and those who follow him."
  es: "Ijtihad: el esfuerzo del jurista por derivar una norma de las fuentes reveladas. Según Al-Sayis, revela la voluntad de Dios en lugar de legislar, y vincula únicamente al muytahid y a quienes lo siguen."
  fr: "L'ijtihad: l'effort du juriste pour déduire une décision à partir des sources révélées. Selon Al-Sayis, l'ijtihad révèle la volonté divine plutôt que de légiférer, et ne lie que le mujtahid et ses disciples."
  ur: "اجتہاد: فقیہ کی طرف سے نازل شدہ ذرائع سے حکم اخذ کرنے کی کوشش۔ السیس کا نظریہ یہ ہے کہ یہ قانون سازی کے بجائے خدا کے حکم کو ظاہر کرتا ہے، اور صرف مجتہد اور اس کے پیروکاروں کو پابند کرتا ہے۔"
  tr: "Hukukçu, hukuki kararları hukuki kanıtlardan çıkarmak için tüm çabasını ve çabasını göstermiştir {cite:nashat-al-fiqh-al-ijtihadi-azhar s. 11}. Al-Sais, vahiy çağında başladığını ve amacının Tanrı'nın gerçek konudaki hükmünü ortaya çıkarmak olduğunu, yasa koymak olmadığını düşünür; bu hüküm, müjtahid ve taklitçileri için bağlayıcıdır ve Şeriat'ın genel kurallarına bağlıdır {cite:nashat-al-fiqh-al-ijtihadi-azhar s. 24, 26}. Yöntemleri farklılık gösterir: hükümleri metinlerin görünür anlamlarından, ya da akılcı anlamlarından benzetme yoluyla ya da tercih, güvenilmez çıkarlar ve sadd al-da'ari gibi genel kurallara gerçekleri uygulayarak türetir {cite:nashat-al-fiqh-al-ijtihadi-azhar s. 11-12}."
  id: "Ahli hukum mengerahkan seluruh usahanya untuk mengambil putusan hukum dari bukti hukum {cite:nashat-al-fiqh-al-ijtihadi-azhar hlm. 11}. Al-Sais percaya bahwa ia memulai pada era wahyu, dan tujuannya adalah mengungkapkan putusan Tuhan tentang perkara sebenarnya, bukan menetapkan undang-undang; hukum ini mengikat mujtahid dan para penirunya, dan terikat oleh aturan umum Syariah {cite:nashat-al-fiqh-al-ijtihadi-azhar hlm. 24, 26}. Metodenya bervariasi: mengambil keputusan dari makna teks yang jelas, atau dari makna rasionalnya secara analogi, atau dengan menerapkan fakta pada aturan umum seperti preferensi, kepentingan yang tidak dapat diandalkan, dan sadd al-da'ari' {cite:nashat-al-fiqh-al-ijtihadi-azhar hlm. 11-12}."
