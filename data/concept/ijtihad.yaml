label:
  ar: "الاجتهاد"
  en: "Ijtihad (independent juristic reasoning)"
summary:
  ar: "بذل الفقيه وسعه واستفراغ جهده في استنباط الحكم الشرعي من الأدلة الشرعية {cite:nashat-al-fiqh-al-ijtihadi-azhar p. 11}. ويرى السايس أنه بدأ في عصر التنزيل، وأن غايته كشف حكم الله في الواقعة لا إنشاء التشريع، فهو ملزم للمجتهد ومن قلده، ومقيد بالقواعد الكلية للشريعة {cite:nashat-al-fiqh-al-ijtihadi-azhar p. 24, 26}. وتتعدد طرقه: أخذ الحكم من ظواهر النصوص، أو من معقولها بالقياس، أو بتنزيل الوقائع على القواعد العامة كالاستحسان والمصالح المرسلة وسد الذرائع {cite:nashat-al-fiqh-al-ijtihadi-azhar p. 11-12}."
  en: "Ijtihad: the jurist's exertion of effort to derive a ruling from the revealed sources. Al-Sayis's view is that it discloses God's ruling rather than legislating, and binds only the mujtahid and those who follow him."
