id: concept/ijtihad
class: concept
kind: term
label:
  ar: "الاجتهاد"
  en: "Ijtihad (independent legal reasoning)"
issue:
  ar: "من يحق له الاجتهاد، وهل هو وسيلة من وسائل التجديد؟"
summary:
  ar: "يعرض عباس شومان الاجتهاد بوصفه آلية من آليات التجديد، يقوم بها المؤهلون وحدهم. ويستشهد بحديث معاذ بن جبل حين بعثه النبي قاضيا إلى اليمن، وبحديث «إذا حكم الحاكم فاجتهد فأصاب فله أجران»، وينقل عن المحدثين خلافا في صحة حديث معاذ، فيذكر تضعيفه عن غير واحد من أهل العلم، ومع ذلك تقويته عند الخطيب البغدادي وقبول أهل العلم له. ويرى أن الصحابة اجتهدوا في مسائل لم تظهر في عهد النبوة، ومنها الخلافة وقتال المرتدين. {cite:nazarat-fi-al-tajdid-azhar p. 17} {cite:nazarat-fi-al-tajdid-azhar p. 18} {cite:nazarat-fi-al-tajdid-azhar p. 19}"
  en: "Shouman treats ijtihad as one of the mechanisms of renewal, to be exercised only by qualified scholars. He cites the Mu'adh report on judging by Qur'an, Sunna and personal reasoning, and the hadith that the mujtahid who errs still has one reward, and he records that scholars disagreed on the authenticity of the Mu'adh report. He also notes that the Companions reasoned on questions that did not arise in the Prophet's lifetime, including the succession."
sources: [source/nazarat-fi-al-tajdid-azhar]
