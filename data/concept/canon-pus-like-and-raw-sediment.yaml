id: concept/canon-pus-like-and-raw-sediment
class: concept
kind: scientific
label:
  ar: "الرسوب المدي والخام عند ابن سينا"
  en: "Pus-like sediment and raw sediment in the Canon"
  fr: "Sédiments purulent et cru dans le Canon"
  ur: "پیپ نما اور خام تلچھٹ قانون میں"
  es: "Sedimentos purulentos y sedimentos crudos en el Cañón"
  tr: "İbn Sina'ya göre yatay ve kaba yerleştirme"
  id: "Deposisi Horizontal dan Kasar menurut Ibn Sina"
summary:
  ar: "يذكر ابن سينا أن المدي يدل على قرحة منفجرة وخصوصاً في أعضاء البول، ويفرق بينه وبين الخام بالنتن وتقدم ورم وسهولة اجتماع الأجزاء وتفرقها. {cite:canon-ibn-sina-print-v1 p.195}."
  en: "Ibn Sina says pus-like sediment shows a burst ulcer, especially in the urinary organs, and he tells it from raw sediment by stench, a preceding swelling, and parts that gather and scatter easily. {cite:canon-ibn-sina-print-v1 p.195}."
  fr: "Ibn Sina associe le purulent à un ulcère rompu, surtout urinaire ; puanteur, gonflement antérieur et particules aisément rassemblées ou dispersées le distingueraient du cru. {cite:canon-ibn-sina-print-v1 p.195}."
  es: "Ibn Sina afirma que el sedimento purulento indica una úlcera abierta, especialmente en los órganos urinarios, y la distingue del sedimento crudo por el hedor, una hinchazón previa y partes que se acumulan y dispersan fácilmente. {cite:canon-ibn-sina-print-v1 p.195}."
  ur: "ابن سینا کا کہنا ہے کہ پیپ کی طرح کی تلچھٹ ایک پھٹنے والے السر کو ظاہر کرتی ہے، خاص طور پر پیشاب کے اعضاء میں، اور وہ اسے کچی تلچھٹ سے بدبو، پہلے کی سوجن، اور ایسے حصوں کو بتاتا ہے جو آسانی سے جمع اور بکھر جاتے ہیں۔ {حوالہ: کینن ابن سینا پرنٹ v1 صفحہ 195}۔"
  tr: "İbn Sina, 'Mada'nın özellikle idrar organlarında patlayıcı bir ülseri gösterdiğini belirtir ve kötü koku, tümörlerin ilerlemesi ve sık sık parça toplanıp yayılmasının kolay olması ile ham sudan ayırır. {cite:canon-ibn-sina-print-v1 s.195}."
  id: "Ibn Sina menyebutkan bahwa 'Mada' menunjukkan tukak lambung eksplosif, terutama di organ kemih, dan membedakannya dari air mentah melalui bau busuk, serta perkembangan tumor dan kemudahan bagian-bagian yang sering terkumpul dan menyebar. {cite:canon-ibn-sina-print-v1 hlm.195}."
