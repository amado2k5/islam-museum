summary:
  ar: "طين يقوّي فم المعدة ويذهب بثقل الطعام ويمنع القيء، ولا يستحسن المؤلف استعماله."
  en: "An earth that the book says strengthens the mouth of the stomach, removes the heaviness of food and stops vomiting, though the author does not favour its use."
  ur: "ایک مٹی جو معدے کے منہ کو قوت دیتی ہے، کھانے کا بھاری پن دور کرتی ہے اور قے روکتی ہے، مگر مصنف اس کے استعمال کو پسند نہیں کرتا۔"
  es: "Según el libro, se trata de una tierra que fortalece la boca del estómago, elimina la pesadez de la comida y detiene los vómitos, aunque el autor no recomienda su uso."
  fr: "Une terre qui, selon le livre, fortifie l'estomac, allège la digestion et arrête les vomissements, bien que l'auteur n'en préconise pas l'usage."
