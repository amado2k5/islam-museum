label: { ar: "النُّقُود (أحكامها في الفقه)", en: "Nuqud (money in fiqh)", ur: "نقود (فقہ میں احکام)" }
summary:
  ar: "النقود جمع نقد، وهي في الفقه معنى يتراوح بين الذهب والفضة مسكوكين أو غير مسكوكين، وبين المضروب منهما، وبين كل ما يتعامل به وسيطاً للتبادل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16002} والتعامل بالنقود جائز بالكتاب والسنة، وللنقود وظيفة الميزان الذي يقوم به الأموال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16003} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16004} والنقود الخلقية الدينار والدرهم، والاصطلاحية الفلوس والدراهم الغالبة الغش والورق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16004} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16005} وتتقدر بالنقود أحكام الزكاة والمهر والسرقة والدية والجزية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16006} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16007} وحق الضرب للإمام وحده، وللتعزير من افتات عليه، وكسر النقود مكروه عند جماعة، والتزين بالنقود على ضوابط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16009} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16010} وفي العقود يتعين نقد البلد عند الإطلاق، والنقود تتعين بالتعيين عند الشافعية والحنابلة لا عند الحنفية والمالكية، وفي الشركة والمضاربة خلاف في رأس المال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16014} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16015} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16016} وتضاف الأحكام في القرض والرهن والإعارة والإجارة والوقف والسلم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16018} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16022} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16023} وتتغير قيم الفلوس بالغلاء والرخص والكساد، وتنظر الديون عند تغيرها، وقد رأى ابن تيمية وابن القيم والمقريزي أن استقرار النقد أصل للعدل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16024} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16025} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16026} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16027}"
  en: "Nuqud, the plural of naqd, means in fiqh either gold and silver, coined or not, the minted coin, or anything used as a medium of exchange. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16002} Dealing in money is lawful by the Qur'an and the Sunna, and money serves as the measure by which goods are valued. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16003} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16004} The natural coins are the dinar and the dirham; the conventional ones are fulus, debased dirhams and paper money. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16004} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16005} Several rulings are fixed in money: the zakat threshold, the least dower, the theft threshold, blood money and the poll tax. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16006} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16007} Minting belongs to the ruler alone; clipping coins is disliked by several; decorating with coins is subject to rules. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16010} In contracts the local currency is meant when none is named; coins are specified by the Shafi'is and Hanbalis but not by the Hanafis and Malikis, and the schools differ on bullion and coins as capital. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16016} The rulings on loans, pledges, hire, endowment and salam are set out in the same way. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16018} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16022} When the value of fulus changes, the schools differ on how debts are paid, and Ibn Taymiyya, Ibn al-Qayyim and al-Maqrizi held that stable money is the basis of justice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16024} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16027}"
  ur: "نقود لغت میں نقد کی جمع ہے، اور فقہ میں اس سے مراد سونا اور چاندی، ڈھلے ہوئے سکے، یا تبادلے کا ہر ذریعہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16002} قرآن و سنت سے نقود کا لین دین جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16003} زکوٰۃ کا نصاب، کم از کم مہر، چوری کا نصاب، دیت اور جزیہ نقود سے مقرر ہوتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16006} سکہ ڈھالنے کا حق حاکم کو ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16008} عقد میں مطلق ہونے پر ملک کا رائج سکہ مراد ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16014} قیمت بدلنے پر قرض کی ادائیگی میں اختلاف ہے، اور ابن تیمیہ، ابن القیم اور مقریزی کے نزدیک نقد کا استحکام عدل کی بنیاد ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16024} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16027}"
