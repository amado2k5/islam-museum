label: { ar: "النُّقُود ⁦(أحكامها في الفقه)⁩", en: "Nuqud (money in fiqh)", ur: "نقود ⁦(فقہ میں احکام)⁩", es: "Nuqud (dinero en fiqh)", fr: "Nuqud (argent en fiqh)", tr: "Para (İçtihattaki Kararları)", id: "Uang (Putusan dalam Yurisprudensi)" }
summary:
  ar: "النقود جمع نقد، وهي في الفقه معنى يتراوح بين الذهب والفضة مسكوكين أو غير مسكوكين، وبين المضروب منهما، وبين كل ما يتعامل به وسيطاً للتبادل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16002} والتعامل بالنقود جائز بالكتاب والسنة، وللنقود وظيفة الميزان الذي يقوم به الأموال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16003} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16004} والنقود الخلقية الدينار والدرهم، والاصطلاحية الفلوس والدراهم الغالبة الغش والورق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16004} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16005} وتتقدر بالنقود أحكام الزكاة والمهر والسرقة والدية والجزية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16006} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16007} وحق الضرب للإمام وحده، وللتعزير من افتات عليه، وكسر النقود مكروه عند جماعة، والتزين بالنقود على ضوابط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16009} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16010} وفي العقود يتعين نقد البلد عند الإطلاق، والنقود تتعين بالتعيين عند الشافعية والحنابلة لا عند الحنفية والمالكية، وفي الشركة والمضاربة خلاف في رأس المال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16014} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16015} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16016} وتضاف الأحكام في القرض والرهن والإعارة والإجارة والوقف والسلم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16018} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16022} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16023} وتتغير قيم الفلوس بالغلاء والرخص والكساد، وتنظر الديون عند تغيرها، وقد رأى ابن تيمية وابن القيم والمقريزي أن استقرار النقد أصل للعدل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16024} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16025} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16026} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16027}"
  en: "Nuqud, the plural of naqd, means in fiqh either gold and silver, coined or not, the minted coin, or anything used as a medium of exchange. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16002} Dealing in money is lawful by the Qur'an and the Sunna, and money serves as the measure by which goods are valued. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16003} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16004} The natural coins are the dinar and the dirham; the conventional ones are fulus, debased dirhams and paper money. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16004} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16005} Several rulings are fixed in money: the zakat threshold, the least dower, the theft threshold, blood money and the poll tax. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16006} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16007} Minting belongs to the ruler alone; clipping coins is disliked by several; decorating with coins is subject to rules. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16010} In contracts the local currency is meant when none is named; coins are specified by the Shafi'is and Hanbalis but not by the Hanafis and Malikis, and the schools differ on bullion and coins as capital. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16016} The rulings on loans, pledges, hire, endowment and salam are set out in the same way. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16018} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16022} When the value of fulus changes, the schools differ on how debts are paid, and Ibn Taymiyya, Ibn al-Qayyim and al-Maqrizi held that stable money is the basis of justice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16024} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16027}"
  ur: "نقود لغت میں نقد کی جمع ہے، اور فقہ میں اس سے مراد سونا اور چاندی، ڈھلے ہوئے سکے، یا تبادلے کا ہر ذریعہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16002} قرآن و سنت سے نقود کا لین دین جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16003} زکوٰۃ کا نصاب، کم از کم مہر، چوری کا نصاب، دیت اور جزیہ نقود سے مقرر ہوتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16006} سکہ ڈھالنے کا حق حاکم کو ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16008} عقد میں مطلق ہونے پر ملک کا رائج سکہ مراد ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16014} قیمت بدلنے پر قرض کی ادائیگی میں اختلاف ہے، اور ابن تیمیہ، ابن القیم اور مقریزی کے نزدیک نقد کا استحکام عدل کی بنیاد ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16024} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16027}"
  es: "Nuqud, el plural de naqd, significa en fiqh tanto oro y plata, acuñados o no, la moneda acuñada, o cualquier cosa utilizada como medio de cambio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16002} El comercio de dinero es lícito según el Corán y la Sunna, y el dinero sirve como medida por la cual se valoran los bienes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16003} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16004} Las monedas naturales son el dinar y el dirham; las convencionales son los fulus, los dirhams devaluados y el papel moneda. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16004} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16005} Varias normas están fijadas en dinero: el umbral del zakat, la dote mínima, el umbral del robo, el dinero de sangre y el impuesto de capitación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16006} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16007} La acuñación pertenece solo al gobernante; recortar monedas es desaprobado por varios; decorar con monedas está sujeto a reglas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16010} En los contratos se entiende la moneda local cuando no se menciona ninguna; los shafi'is y hanbalis especifican las monedas, pero no los hanafis y malikis, y las escuelas difieren en cuanto al lingote y las monedas como capital. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16016} Las resoluciones sobre préstamos, prendas, alquiler, dotación y salam se establecen de la misma manera. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16018} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16022} Cuando cambia el valor de los fulus, las escuelas difieren sobre cómo se pagan las deudas, e Ibn Taymiyya, Ibn al-Qayyim y al-Maqrizi sostuvieron que el dinero estable es la base de la justicia. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16024} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16027}"
  fr: "Nuqud, pluriel de naqd, désigne en droit islamique (fiqh) l'or et l'argent, frappés ou non, la monnaie elle-même, ou tout moyen d'échange. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16002} Le Coran et la Sunna licitent les transactions monétaires, et la monnaie sert d'unité de mesure pour évaluer les biens. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16003} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16004} Les monnaies naturelles sont le dinar et le dirham; les monnaies conventionnelles sont le fulus, les dirhams dévalués et le papier-monnaie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16004} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16005} Plusieurs règles sont fixées en matière monétaire: le seuil de la zakat, le montant minimal de la dot, le seuil de la fraude, le prix du sang et la capitation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16006} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16007} La frappe de la monnaie appartient exclusivement au souverain; le rognage des pièces est mal vu par plusieurs; la décoration avec des pièces est soumise à des règles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16010} Dans les contrats, la monnaie locale est utilisée lorsqu'elle n'est pas précisée; les écoles chaféite et hanbalite mentionnent les pièces de monnaie, contrairement aux écoles hanafite et malikite, et les divergences entre les écoles juridiques portent sur l'utilisation des lingots et des pièces de monnaie comme capital. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16016} Les règles relatives aux prêts, aux nantissements, aux locations, aux dotations et au salam sont énoncées de la même manière. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16018} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16022} Lorsque la valeur du fulus change, les écoles diffèrent sur la manière dont les dettes sont payées, et Ibn Taymiyya, Ibn al-Qayyim et al-Maqrizi ont soutenu que l'argent stable est la base de la justice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16024} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16027}"
  tr: "Nunuq, 'naqq' kelimesinin çoğuludur ve fıkâhta, altın ile gümüş arasında, basılmış ya da basılmamış olsun, basılan ve değişim aracı olarak kullanılan her şey arasında bir anlam taşır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.16002} Parayla işlem Kur'an ve Sünnet'e göre caizdir ve para, paranın kullandığı terazinin işlevini görür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16003} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16004} ve geleneksel para birimleri dinar ve dirhemdir, teknik biçimler ise baskın para ve dirhem, sahtekarlık ve kağıttır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.16004} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16005} ve nakit olarak zekat, çeyiz, hırsızlık, kan parası ve cizye hükümleri olarak tahmin edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16006} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16007} Grev hakkı yalnızca imama aittir ve tezir hakkı ona saldıranlara aittir, para kırmak bir grup tarafından sevilmez ve kendini parayla süslemek kesinlikle uygulanır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16009} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16010} Sözleşmelerde, ülke serbest bırakıldığında nakde çevrilmeli ve para Hanafi ve Malikilere göre değil, Şafi'ler ve Hanbalilere göre belirlenmelidir. Ortaklık ve spekülasyonda sermaye üzerinde bir anlaşmazlık vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16014} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16015} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16016} Kararlar krediler, ipotekler, krediler, kiralar, vakıflar ve salamlara eklenir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16018} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16022}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16023} Paranın değeri yüksek fiyatlar, ucuzluk ve durgunlukla değişir, borçlar değiştiğinde dikkate alınır. İbn Teymiyye, İbn al-Qayyim ve al-Makrizi parasal istikrarın adaletin temeli olduğuna inanırlardı. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16024} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16025} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16026} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16027}"
  id: "Nunuq adalah bentuk jamak dari 'naqq', dan dalam hukum, maknanya berkisar antara emas dan perak, baik yang dicetak maupun tidak, antara yang dicetak dan segala sesuatu yang digunakan sebagai perantara untuk pertukaran. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16002} Mengelola uang diperbolehkan menurut Al-Qur'an dan Sunnah, dan uang berfungsi sesuai skala yang digunakan oleh uang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16003} {cite:fiqh-mawsua-kuwaitiyya-noor-noor-v3 hlm.16004} dan mata uang tradisionalnya adalah dinar dan dirham, dan bentuk teknisnya adalah uang dan dirham yang dominan, penipuan dan kertas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16004} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16005} dan diperkirakan secara tunai adalah keputusan zakat, mas kawin, pencurian, uang darah, dan jizya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16006} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16007} Hak mogok hanya milik imam, dan hak untuk ta'zir adalah milik mereka yang menikamnya, memutus uang tidak disukai oleh sebagian kelompok, dan menghias diri dengan uang harus diikuti secara ketat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16009} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16010} Dalam kontrak, negara harus dicairkan saat dibebaskan, dan uang harus ditetapkan sesuai dengan Shafi'i dan Hanbali, bukan Hafani dan Maliki. Dalam kemitraan dan spekulasi, ada perselisihan modal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16013} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.16014} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16015} {cite:fiqh-mawsua-Kuwaitiyya-noor-v3 hlm. 16016} Putusan tersebut ditambahkan ke pinjaman, hipotek, pinjaman, sewa, wakaf, dan salam. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.16018} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16022} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16023} Nilai uang berubah seiring harga tinggi, murah, dan resesi, dan utang dipertimbangkan ketika harganya berubah. Ibn Taymiyyah, Ibn al-Qayyim, dan al-Maqrizi percaya bahwa stabilitas moneter adalah dasar keadilan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16024} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16025} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16026} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16027}"
