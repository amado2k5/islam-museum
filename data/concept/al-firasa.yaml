label:
  ar: الفراسة
  en: Firasa — the believer's insight
  ur: فراست
summary:
  ar: "نور يقذفه الله في قلب عبده يعرف به ما خفي من الأحوال؛ في الحديث: اتقوا فراسة المؤمن فإنه ينظر بنور الله — من أدنى أبواب الغيب التي تفتح للمتقين {cite:jami-al-tirmidhi}."
  en: "A light God casts into His servant's heart by which he perceives hidden states; the hadith says: beware the believer's firasa, for he sees by God's light — the nearest door of the unseen opened to the godfearing {cite:jami-al-tirmidhi}."
  ur: "وہ نور جو اللہ اپنے بندے کے دل میں ڈالتا ہے جس سے وہ پوشیدہ حالات پہچانتا ہے؛ حدیث: مومن کی فراست سے بچو کہ وہ اللہ کے نور سے دیکھتا ہے — متقین کے لیے غیب کا قریب ترین دروازہ {cite:jami-al-tirmidhi}۔"
