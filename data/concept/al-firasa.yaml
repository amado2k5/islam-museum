id: concept/al-firasa
class: concept
kind: belief
label:
  ar: الفراسة
  en: Firasa — the believer's insight
  fr: "Firasa : la clairvoyance du croyant"
  ur: فراست
  es: "Firasa: la visión del creyente"
summary:
  ar: "نور يقذفه الله في قلب عبده يعرف به ما خفي من الأحوال؛ في الحديث: اتقوا فراسة المؤمن فإنه ينظر بنور الله — من أدنى أبواب الغيب التي تفتح للمتقين {cite:jami-al-tirmidhi}."
  en: "A light God casts into His servant's heart by which he perceives hidden states; the hadith says: beware the believer's firasa, for he sees by God's light — the nearest door of the unseen opened to the godfearing {cite:jami-al-tirmidhi}."
  fr: "Une lumière que Dieu projette dans le cœur de Son serviteur et par laquelle celui-ci perçoit des états cachés. Le hadith invite à prendre garde à la firasa du croyant, car il voit par la lumière de Dieu : c’est la porte la plus proche sur l’invisible qui soit ouverte à ceux qui craignent Dieu {cite:jami-al-tirmidhi}."
  ur: "وہ نور جو اللہ اپنے بندے کے دل میں ڈالتا ہے جس سے وہ پوشیدہ حالات پہچانتا ہے؛ حدیث: مومن کی فراست سے بچو کہ وہ اللہ کے نور سے دیکھتا ہے — متقین کے لیے غیب کا قریب ترین دروازہ {cite:jami-al-tirmidhi}۔"
  es: "Una luz que Dios arroja al corazón de su siervo, mediante la cual percibe estados ocultos; el hadiz dice: cuidado con la firasa del creyente, porque ve por la luz de Dios; la puerta más cercana de lo invisible se abre para el temeroso de Dios {cite:jami-al-tirmidhi}."
