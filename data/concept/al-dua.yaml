id: concept/al-dua
class: concept
kind: doctrine
label:
  ar: "الدعاء"
  en: "Supplication (du'a)"
summary:
  ar: "يرى الشعراوي أن الله قريب يجيب دعوة الداعي إذا دعاه، وأن الاستجابة مشروطة بالاستجابة لمنهجه والإيمان به، وأن الدعاء قد يُصرف عن صاحبه إذا لم يكن فيه خير له، وأن الدعاء بالطيب من الرزق شرط لقبوله، وأن ذكر الله يُغني عن المسألة. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.780}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.783}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.784}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.786}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.787}"
  en: "Sha'rawi holds that God is near and answers the caller who calls Him, that the answer is conditioned on responding to His way and believing in Him, that a prayer may be turned away when it is not good for the one who asks, that lawful provision is a condition of acceptance, and that remembrance of God can take the place of asking {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.780}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.783}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.784}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.786}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.787}."
wings: [ideas]
themes: [spirituality-and-sufism, worship-and-the-pillars]
periods: [period/prophetic-era]
regions: [global]
issue:
  ar: "لماذا لا يُستجاب كل دعاء، وما شروط الإجابة في تفسير الشعراوي؟"
  en: "Why is not every prayer answered, and what are the conditions of answer in Sha'rawi's exposition?"
perspectives:
  - tradition: sunni
    id: sharawi-dua-conditions
    stance:
      ar: "الإجابة بقدر حكمة الله لا بمقياس الداعي، وشرطها الطيب والاستجابة للمنهج"
      en: "The answer follows God's wisdom rather than the caller's measure; its conditions are lawful provision and obedience to the way"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يذكر الشعراوي أن الإنسان قد يدعو بما يظنه خيراً وهو شر، فيمنع الله الإجابة لمصلحته، ويقرن الإجابة بالاستجابة للمنهج، ويستدل بحديث الرجل الذي مطعمه حرام لعدم استجابة دعائه، ويذكر دعاء النبي لعائشة في ليلة القدر بالعفو. وفي الهامش يحيل إلى الترمذي وأحمد والحاكم ومسلم، ولم تُراجع هذه المصادر هنا. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.784}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.786}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.787}"
      en: "Sha'rawi says a person may ask for what he thinks good and it is evil, so God withholds the answer for his benefit; he ties the answer to obedience to the way; he cites the man whose food and dress are unlawful as one whose prayer is not answered, and the prayer taught to Aisha on the Night of Power, 'You love pardon, so pardon me'. The footnotes name Tirmidhi, Ahmad, Hakim and Muslim, which were not checked here {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.784}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.786}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.787}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
  - tradition: sunni
    id: scope-note-hadith-checks
    stance:
      ar: "أحاديث الدعاء المذكورة في الهامش لم تُراجع أصولها هنا"
      en: "The hadiths on supplication cited in the footnotes were not checked against their originals here"
    holders: []
    summary:
      ar: "لم تُراجع أصول الأحاديث في الدعاء، ولم تُدخل أقوال الفقهاء في آداب الدعاء، ولا الرأي الأكاديمي، ولا الآراء الأخرى. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.787}"
      en: "The originals of the hadiths on supplication were not checked; the jurists' rules of supplication, the academic view and other views are not entered here {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.787}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
