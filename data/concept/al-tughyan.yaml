label:
  ar: "الطغيان"
  en: "Tyranny (tughyan)"
  fr: "Tyrannie (tughyan)"
  ur: "سرکشی ⁦(طغیان)⁩"
  es: "Tiranía (tughyan)"
summary:
  ar: "يرى عمر عبد الكافي أن الطغيان ظلمُ من يملك القدرة لمن هو أضعف منه، من الحاكم والوزير ومدير المؤسسة إلى الزوج والابن والموظف الصغير، ويرى أن السماء تتدخل إذا طغى العبد على عباد الله، ويستشهد بفرعون ومؤمن آل فرعون."
  en: "Omar Abdelkafy holds that tyranny is the wronging of the weaker by one with power, from ruler, minister and director down to husband, son and petty official, and that heaven intervenes when a servant tyrannises God's servants, citing Pharaoh and the believer of Pharaoh's household."
  fr: "Selon Omar Abdelkafy, la tyrannie consiste à profiter de son pouvoir pour léser plus faible que soi. Elle peut être le fait aussi bien d’un dirigeant, d’un ministre ou d’un directeur que d’un mari, d’un fils ou d’un petit fonctionnaire. Il estime que le ciel intervient lorsqu’un serviteur tyrannise les serviteurs de Dieu, et cite Pharaon et le croyant de la maison de Pharaon."
  ur: "عمر عبد الکافی کے نزدیک طغیان طاقتور کا کمزور پر ظلم ہے، حاکم، وزیر اور ادارے کے سربراہ سے لے کر شوہر، بیٹے اور چھوٹے ملازم تک، اور جب بندہ اللہ کے بندوں پر سرکشی کرے تو آسمان مداخلت کرتا ہے؛ وہ فرعون اور آلِ فرعون کے مومن سے استدلال کرتے ہیں۔"
  es: "Omar Abdelkafy sostiene que la tiranía es la injusticia que sufre el más débil por parte de quien ostenta el poder, desde gobernante, ministro y director hasta esposo, hijo y funcionario de bajo rango, y que el cielo interviene cuando un siervo tiraniza a los siervos de Dios, citando al faraón y al creyente de la casa del faraón."
