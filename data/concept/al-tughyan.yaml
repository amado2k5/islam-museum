label:
  ar: "الطغيان"
  en: "Tyranny (tughyan)"
  ur: "سرکشی (طغیان)"
summary:
  ar: "يرى عمر عبد الكافي أن الطغيان ظلمُ من يملك القدرة لمن هو أضعف منه، من الحاكم والوزير ومدير المؤسسة إلى الزوج والابن والموظف الصغير، ويرى أن السماء تتدخل إذا طغى العبد على عباد الله، ويستشهد بفرعون ومؤمن آل فرعون."
  en: "Omar Abdelkafy holds that tyranny is the wronging of the weaker by one with power, from ruler, minister and director down to husband, son and petty official, and that heaven intervenes when a servant tyrannises God's servants, citing Pharaoh and the believer of Pharaoh's household."
  ur: "عمر عبد الکافی کے نزدیک طغیان طاقتور کا کمزور پر ظلم ہے، حاکم، وزیر اور ادارے کے سربراہ سے لے کر شوہر، بیٹے اور چھوٹے ملازم تک، اور جب بندہ اللہ کے بندوں پر سرکشی کرے تو آسمان مداخلت کرتا ہے؛ وہ فرعون اور آلِ فرعون کے مومن سے استدلال کرتے ہیں۔"
