summary:
  ar: "تمساح في الكتاب ذكر موجز لا ماهية فيه ولا طبع: زبله ينفع من بياض العين، وشحمه ضمادا على عضته يسكن وجعها في الحال، ويورد الكتاب قولا منقولا موسوما عن الباه في فقرة معلقة لحكم المؤسس، وكل ما ورد هنا نقل منسوب إلى الكتاب لا توصية {cite:canon-ibn-sina-print-v1 pp.689-690}"
  en: "Timsah is in the book a short entry with no nature or temperament: its dung benefits whiteness of the eye, its fat laid as a poultice on its own bite calms the pain at once, and the book gives a reported statement on desire in a labelled section held for the founder's ruling; everything given here is a report attributed to the book, not a recommendation {cite:canon-ibn-sina-print-v1 pp.689-690}"
  ur: "تمساح کتاب میں ایک مختصر اندراج ہے جس میں ماہیت اور مزاج نہیں: اس کی بیٹ آنکھ کی سفیدی میں نافع ہے، اس کی چربی اس کے کاٹے پر لیپ کی صورت میں درد کو فوراً تسکین دیتی ہے، اور کتاب باہ کے بارے میں ایک منقول بات موسوم حصے میں دیتی ہے جو بانی کے فیصلے کے لیے موقوف ہے، اور یہاں جو کچھ آیا وہ کتاب سے منسوب نقل ہے، سفارش نہیں {cite:canon-ibn-sina-print-v1 pp.689-690}۔"
  es: "En el libro, Timsah es una breve entrada sin naturaleza ni temperamento definidos: su estiércol beneficia la blancura de los ojos, su grasa aplicada como cataplasma sobre su propia mordedura calma el dolor de inmediato, y el libro ofrece una declaración sobre el deseo en una sección etiquetada reservada para la decisión del fundador; todo lo que se presenta aquí es un informe atribuido al libro, no una recomendación {cite:canon-ibn-sina-print-v1 pp.689-690}"
  fr: "Le Timsah est mentionné brièvement dans le livre, sans précision sur sa nature ni son tempérament: ses excréments blanchissent les yeux, sa graisse, appliquée en cataplasme sur sa propre morsure, apaise immédiatement la douleur, et le livre rapporte une déclaration sur le désir dans une section réservée à l’avis du fondateur; tout ce qui est dit ici est un rapport attribué au livre, et non une recommandation {cite:canon-ibn-sina-print-v1 pp.689-690}"
  tr: "Kitaptaki timsah, içeriği veya doğası olmayan kısa bir bahsedilmiştir: göz beyazından çöp kullanılır ve yağı ısırığında acısını hemen hafifleten bir komprestir. Kitapta, kurucunun kararıyla ilgili askıya alınmış bir paragrafta Al-Bah'tan alıntılanan bir söz yer alır. Burada bahsedilen her şey kitaba atfedilen kopyalanmış bir anlatımdır, tavsiye değildir {cite:canon-ibn-sina-print-v1 s.689-690}"
  id: "Buaya dalam buku ini adalah sebutan singkat tanpa substansi atau alam: sampah digunakan dari bagian putih mata, dan lemaknya adalah ramuan pada gigitan yang langsung menghilangkan rasa sakitnya. Buku ini memuat kutipan berjudul Al-Bah dalam paragraf yang ditangguhkan tentang putusan pendiri. Semua yang disebutkan di sini adalah salinan catatan yang dikaitkan dengan buku ini, bukan rekomendasi {cite:canon-ibn-sina-print-v1 hlm.689-690}"
