summary:
  ar: "تمساح في الكتاب ذكر موجز لا ماهية فيه ولا طبع: زبله ينفع من بياض العين، وشحمه ضمادا على عضته يسكن وجعها في الحال، ويورد الكتاب قولا منقولا موسوما عن الباه في فقرة معلقة لحكم المؤسس، وكل ما ورد هنا نقل منسوب إلى الكتاب لا توصية {cite:canon-ibn-sina-print-v1 pp.689-690}"
  en: "Timsah is in the book a short entry with no nature or temperament: its dung benefits whiteness of the eye, its fat laid as a poultice on its own bite calms the pain at once, and the book gives a reported statement on desire in a labelled section held for the founder's ruling; everything given here is a report attributed to the book, not a recommendation {cite:canon-ibn-sina-print-v1 pp.689-690}"
  ur: "تمساح کتاب میں ایک مختصر اندراج ہے جس میں ماہیت اور مزاج نہیں: اس کی بیٹ آنکھ کی سفیدی میں نافع ہے، اس کی چربی اس کے کاٹے پر لیپ کی صورت میں درد کو فوراً تسکین دیتی ہے، اور کتاب باہ کے بارے میں ایک منقول بات موسوم حصے میں دیتی ہے جو بانی کے فیصلے کے لیے موقوف ہے، اور یہاں جو کچھ آیا وہ کتاب سے منسوب نقل ہے، سفارش نہیں {cite:canon-ibn-sina-print-v1 pp.689-690}۔"
