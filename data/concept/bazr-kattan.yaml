id: concept/bazr-kattan
class: concept
kind: natural
label:
  ar: "بزر كتان"
  en: "Bazr kattan (flaxseed)"
  fr: "Bazr kattan (graine de lin)"
  ur: "بزرِ کتان ⁦(السی کا بیج)⁩"
  es: "Bazr kattan (semilla de lino)"
summary:
  ar: "قوته قريبة من قوة الحلبة، حارّ في الأولى، منضج يجلو وينفخ لرطوبته الفضلية، ومقليه قابض، وهو مسكّن للأوجاع دون البابونج، ويلين الأورام الحارة، وينفع التشنّج، ويُحقن به الأمعاء لقروحها، ومع عسل وفلفل يحرّك الباه {cite:canon-ibn-sina-print-v1 p.410}."
  en: "Its power is close to fenugreek's. Hot in the first degree, a ripening agent that cleanses, and bloats from its surplus moisture; roasted, it is astringent. It eases pain, less than chamomile, softens hot swellings, helps cramp, and is injected for ulcers of the intestines with rose oil. With honey and pepper it is said to stir desire {cite:canon-ibn-sina-print-v1 p.410}."
  fr: "Son pouvoir approche celui du fenugrec. Chaude au premier degré, maturative et nettoyante, elle ballonne par son humidité excédentaire ; grillée, elle est astringente. Elle calmerait la douleur, moins que la camomille, adoucirait les gonflements chauds, aiderait contre les crampes ; avec huile de rose, elle est injectée contre les ulcères intestinaux. Avec miel et poivre, elle exciterait le désir {cite:canon-ibn-sina-print-v1 p.410}."
  ur: "اس کی قوت میتھی کی قوت کے قریب ہے۔ پہلے درجے میں گرم، پکانے والا اور صاف کرنے والا، اور اپنی زائد رطوبت کی وجہ سے پھلاتا ہے؛ بھونے ہوئے میں قبض ہے۔ یہ بابونج سے کم درد کم کرتا ہے، گرم ورموں کو نرم کرتا ہے، اینٹھن میں مفید ہے، اور آنتوں کے زخم کے لیے گلاب کے تیل کے ساتھ حقنہ کیا جاتا ہے۔ شہد اور کالی مرچ کے ساتھ جماع کی رغبت بڑھاتا ہے {cite:canon-ibn-sina-print-v1 p.410}۔"
  es: "Su poder es similar al del fenogreco. De sabor intenso, es un agente madurador que limpia y provoca hinchazón por su exceso de humedad; tostado, es astringente. Alivia el dolor, aunque en menor medida que la manzanilla, suaviza las hinchazones, ayuda a aliviar los calambres y se inyecta para las úlceras intestinales con aceite de rosa. Se dice que, con miel y pimienta, estimula el deseo {cite:canon-ibn-sina-print-v1 p.410}."
