label: { ar: "وقت الإسهال من السنة عند ابن سينا", en: "The season for purging in the Canon", ur: "مسہل کا موسم قانون میں" }
summary:
  ar: "يقول ابن سينا إن طلوع الشعرى ووقوع الثلج على الجبال والبرد الشديد ليس وقتاً للدواء، فيشرب الدواء ربيعاً أو خريفاً، لطيفاً في الربيع وقوياً في الخريف، وإن من احتاج مسهلاً في الشتاء فليرصد ريح الجنوب، ولا تعود الطبيعة شرب الدواء كلما احتاجت إلى تليين {cite:canon-ibn-sina-print-v1 p.282}."
  en: "Ibn Sina says the rising of Sirius, snow on the mountains and bitter cold are not the time for the drug, so it is taken in spring or autumn, a gentle one in spring and a strong one in autumn, that one needing a purgative in winter should watch for the south wind, and that nature should not be accustomed to a drug whenever it needs softening {cite:canon-ibn-sina-print-v1 p.282}."
