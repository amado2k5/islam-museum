id: concept/canon-season-for-purging
class: concept
kind: scientific
label:
  ar: "وقت الإسهال من السنة عند ابن سينا"
  en: "The season for purging in the Canon"
  fr: "Saison de la purge dans le Canon"
  ur: "مسہل کا موسم قانون میں"
  es: "La época de purgas en el canon"
  tr: "İbn Sina'ya göre Sünnet'ten kaynaklanan ishal zamanı"
  id: "Masa diare dari Sunnah menurut Ibn Sina"
summary:
  ar: "يقول ابن سينا إن طلوع الشعرى ووقوع الثلج على الجبال والبرد الشديد ليس وقتاً للدواء، فيشرب الدواء ربيعاً أو خريفاً، لطيفاً في الربيع وقوياً في الخريف، وإن من احتاج مسهلاً في الشتاء فليرصد ريح الجنوب، ولا تعود الطبيعة شرب الدواء كلما احتاجت إلى تليين {cite:canon-ibn-sina-print-v1 p.282}."
  en: "Ibn Sina says the rising of Sirius, snow on the mountains and bitter cold are not the time for the drug, so it is taken in spring or autumn, a gentle one in spring and a strong one in autumn, that one needing a purgative in winter should watch for the south wind, and that nature should not be accustomed to a drug whenever it needs softening {cite:canon-ibn-sina-print-v1 p.282}."
  fr: "Ibn Sina écarte lever de Sirius, neige en montagne et grand froid : purgatif doux au printemps, fort en automne ; en hiver, attente du vent du sud. Il déconseille d’habituer la nature à un remède chaque fois qu’elle a besoin d’être assouplie {cite:canon-ibn-sina-print-v1 p.282}."
  es: "Ibn Sina dice que el ascenso de Sirio, la nieve en las montañas y el frío intenso no son el momento para tomar el medicamento, por lo que se toma en primavera u otoño, uno suave en primavera y uno fuerte en otoño, que quien necesite un purgante en invierno debe estar atento al viento del sur, y que la naturaleza no debe acostumbrarse a un medicamento cuando necesita suavizarse {cite:canon-ibn-sina-print-v1 p.282}."
  ur: "ابن سینا کہتے ہیں کہ سیریس کا طلوع ہونا، پہاڑوں پر برف پڑنا اور کڑوی سردی دوا کا وقت نہیں ہے، لہٰذا یہ موسم بہار یا خزاں میں لیا جاتا ہے، موسم بہار میں نرم اور خزاں میں مضبوط، یہ کہ سردیوں میں رفع حاجت کرنے والے کو جنوبی ہوا کا خیال رکھنا چاہیے، اور فطرت کو جب بھی نرم دوا کی ضرورت ہو تو اسے عادی نہیں ہونا چاہیے۔ {حوالہ:کینن ابن سینا پرنٹ v1 صفحہ 282}۔"
  tr: "İbn Sina, şiir ağacının yükselmesi, dağlarda kar yağışı ve şiddetli soğuğun ilaç zamanı olmadığını söyler; ilkbaharda ya da sonbaharda ilaç içmeli, ilkbaharda yumuşak, sonbaharda güçlü içmelidir. Kışın müshile ihtiyacı olan güney rüzgarına dikkat etmelidir ve doğa ilaç yumuşatılması gerektiğinde içmez {cite:canon-ibn-sina-print-v1 s.282}."
  id: "Ibn Sina mengatakan bahwa munculnya pohon puisi, salju turun di pegunungan, dan dingin yang parah bukanlah waktu untuk obat; ia harus minum obat di musim semi atau gugur, lembut di musim semi dan kuat di musim gugur. Siapa pun yang membutuhkan obat pencahar di musim dingin harus waspada terhadap angin selatan, dan alam tidak minum obat kapan pun perlu dilunakkan {cite:canon-ibn-sina-print-v1 hlm.282}."
