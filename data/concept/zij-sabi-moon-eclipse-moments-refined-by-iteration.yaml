label: { ar: "تصحيح أزمنة الكسوف بالتكرار", en: "Refining the moments of a lunar eclipse by repetition", ur: "تکرار سے گرہن کے لمحات کی تصحیح", es: "Perfeccionar los momentos de un eclipse lunar mediante la repetición.", fr: "Affiner les moments d'une éclipse lunaire par la répétition", tr: "Tekrarlama yöntemiyle tutulma zamanlarının düzeltilmesi", id: "Memperbaiki waktu gerhana dengan pengulangan" }
summary:
  ar: "بعد أن تُعرف الأزمنة المحكمة تُعاد الخطوات: تُحسب حركة العرض للوقتين، ثم يُطرح عرض القمر على هذه الحركة فيُعرف الفضل بين نصف القطرين وعرض القمر، ويُجمع الحاصل ويُقسم على سبق القمر ليصير الزمان المعدل. وإذا تطابق الاختلاف الثاني مع الثالث تكون الأزمنة صحيحة؛ وإن لم يتطابق عُدّل النقص أو الزيادة بجزء من ساعة، وتُكرر المقارنة حتى يصح الموضع. {cite:zij-sabi-nallino-byblion pp.153-154}"
  en: "Once the corrected moments are known the steps are repeated. The latitude motion for both moments is taken, the Moon's latitude is subtracted from it, and the difference between the half-radii and the latitude is found. The result is divided by the Moon's motion to give a corrected time. When the second and third differences agree the moments are right; if not, a fraction of an hour is added or taken away and the comparison is repeated until the place is correct. {cite:zij-sabi-nallino-byblion pp.153-154}"
  ur: "جب تصحیح شدہ لمحات معلوم ہو جائیں تو مراحل دہرائے جاتے ہیں: دونوں لمحات کے لیے عرض کی حرکت لی جاتی ہے، اس میں سے چاند کا عرض گھٹایا جاتا ہے، اور نصف قطروں اور عرض کا فرق نکالا جاتا ہے۔ حاصل کو چاند کی حرکت پر تقسیم کر کے درست وقت ملتا ہے۔ اگر دوسرا اور تیسرا فرق ملتے ہوں تو لمحات درست ہیں، ورنہ گھنٹے کا ایک جزو جمع یا منہا کر کے موازنہ دہرایا جاتا ہے۔ {cite:zij-sabi-nallino-byblion pp.153-154}"
  es: "Una vez conocidos los momentos corregidos, se repiten los pasos. Se toma el movimiento latitudinal para ambos momentos, se le resta la latitud de la Luna y se calcula la diferencia entre los semirradios y la latitud. El resultado se divide por el movimiento de la Luna para obtener una hora corregida. Si la segunda y la tercera diferencia coinciden, los momentos son correctos; de lo contrario, se suma o se resta una fracción de hora y se repite la comparación hasta que el lugar sea correcto. {cite:zij-sabi-nallino-byblion pp.153-154}"
  fr: "Une fois les instants corrigés connus, les étapes sont répétées. On calcule le mouvement de latitude pour les deux instants, on en soustrait la latitude de la Lune, et on détermine la différence entre les demi-rayons et la latitude. Le résultat est divisé par le mouvement de la Lune pour obtenir une heure corrigée. Lorsque les deuxième et troisième différences concordent, les instants sont corrects; sinon, on ajoute ou on soustrait une fraction d’heure et la comparaison est répétée jusqu’à ce que la position soit correcte. {cite:zij-sabi-nallino-byblion pp.153-154}"
  tr: "Kesin zamanlar bilindikten sonra adımlar tekrarlanır: iki zamanın enlemi hesaplanır, ardından yarıçaplar ile ayın enlemi arasındaki farkı belirlemek için bu enlemden ayın enlemi çıkarılır. Sonuç daha sonra toplanır ve ayarlanmış zamanı elde etmek için ayın açısal hızına bölünür. İkinci ve üçüncü farklar eşleşirse, zamanlar doğrudur; eşleşmezlerse, eksiklik veya fazlalık bir saatlik bir kesirle ayarlanır ve konum doğru olana kadar karşılaştırma tekrarlanır. {cite:zij-sabi-nallino-byblion pp.153-154}"
  id: "Setelah waktu yang tepat diketahui, langkah-langkahnya diulangi: lintang dari kedua waktu tersebut dihitung, kemudian lintang bulan dikurangi dari lintang ini untuk menentukan perbedaan antara jari-jari dan lintang bulan. Hasilnya kemudian dijumlahkan dan dibagi dengan kecepatan sudut bulan untuk mendapatkan waktu yang disesuaikan. Jika perbedaan kedua dan ketiga cocok, waktu tersebut benar; jika tidak cocok, kekurangan atau kelebihan disesuaikan dengan pecahan jam, dan perbandingan diulangi sampai posisinya benar. {cite:zij-sabi-nallino-byblion pp.153-154}"
