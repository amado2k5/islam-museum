label: { ar: "تصحيح أزمنة الكسوف بالتكرار", en: "Refining the moments of a lunar eclipse by repetition", ur: "تکرار سے گرہن کے لمحات کی تصحیح", es: "Perfeccionar los momentos de un eclipse lunar mediante la repetición." }
summary:
  ar: "بعد أن تُعرف الأزمنة المحكمة تُعاد الخطوات: تُحسب حركة العرض للوقتين، ثم يُطرح عرض القمر على هذه الحركة فيُعرف الفضل بين نصف القطرين وعرض القمر، ويُجمع الحاصل ويُقسم على سبق القمر ليصير الزمان المعدل. وإذا تطابق الاختلاف الثاني مع الثالث تكون الأزمنة صحيحة؛ وإن لم يتطابق عُدّل النقص أو الزيادة بجزء من ساعة، وتُكرر المقارنة حتى يصح الموضع. {cite:zij-sabi-nallino-byblion pp.153-154}"
  en: "Once the corrected moments are known the steps are repeated. The latitude motion for both moments is taken, the Moon's latitude is subtracted from it, and the difference between the half-radii and the latitude is found. The result is divided by the Moon's motion to give a corrected time. When the second and third differences agree the moments are right; if not, a fraction of an hour is added or taken away and the comparison is repeated until the place is correct. {cite:zij-sabi-nallino-byblion pp.153-154}"
  ur: "جب تصحیح شدہ لمحات معلوم ہو جائیں تو مراحل دہرائے جاتے ہیں: دونوں لمحات کے لیے عرض کی حرکت لی جاتی ہے، اس میں سے چاند کا عرض گھٹایا جاتا ہے، اور نصف قطروں اور عرض کا فرق نکالا جاتا ہے۔ حاصل کو چاند کی حرکت پر تقسیم کر کے درست وقت ملتا ہے۔ اگر دوسرا اور تیسرا فرق ملتے ہوں تو لمحات درست ہیں، ورنہ گھنٹے کا ایک جزو جمع یا منہا کر کے موازنہ دہرایا جاتا ہے۔ {cite:zij-sabi-nallino-byblion pp.153-154}"
  es: "Una vez conocidos los momentos corregidos, se repiten los pasos. Se toma el movimiento latitudinal para ambos momentos, se le resta la latitud de la Luna y se calcula la diferencia entre los semirradios y la latitud. El resultado se divide por el movimiento de la Luna para obtener una hora corregida. Si la segunda y la tercera diferencia coinciden, los momentos son correctos; de lo contrario, se suma o se resta una fracción de hora y se repite la comparación hasta que el lugar sea correcto. {cite:zij-sabi-nallino-byblion pp.153-154}"
