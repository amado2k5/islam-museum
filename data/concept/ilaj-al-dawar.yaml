id: concept/ilaj-al-dawar
class: concept
kind: scientific
label:
  ar: "علاج الدوار"
  en: "Treatment of vertigo (dawar)"
  ur: "دوار کا علاج"
  es: "Tratamiento del vértigo (dawar)"
  fr: "Traitement des vertiges (dawar)"
  tr: "Baş dönmesi tedavisi"
  id: "Pengobatan vertigo"
summary:
  ar: "يذكر ابن سينا علاج الدوار بحسب سببه: السكون والنوم لما كان عن الدوران والنظر، واستفراغ الدم والأخلاط للمادي، ومعالجة العضو الأصل، وعلاج الضربة أولاً، وأن يجتنب صاحبه النظر إلى الدائر والإشراف من العلو؛ ولا تُنقل الوصفات ولا الإجراءات {cite:canon-ibn-sina-print-v2 p.116} {cite:canon-ibn-sina-print-v2 p.117}"
  en: "Ibn Sina gives the treatment of vertigo by its cause: stillness and sleep for what came from turning and looking, evacuation of blood and humours for the material kind, treatment of the source organ, treating a blow first, and that the sufferer keep from looking at what turns and from looking down from a height; recipes and procedures are not reproduced {cite:canon-ibn-sina-print-v2 p.116} {cite:canon-ibn-sina-print-v2 p.117}"
  ur: "ابن سینا سبب کے لحاظ سے دوار کا علاج بتاتا ہے: گھومنے اور دیکھنے سے ہونے والے کے لیے سکون اور نیند، مادی کے لیے خون اور اخلاط کا استفراغ، اصل عضو کا علاج، چوٹ کا پہلے علاج، اور یہ کہ مریض گھومتی چیز کو دیکھنے اور بلندی سے جھانکنے سے بچے؛ نسخے اور کارروائیاں نقل نہیں کی گئیں {cite:canon-ibn-sina-print-v2 p.116} {cite:canon-ibn-sina-print-v2 p.117}۔"
  es: "Ibn Sina describe el tratamiento del vértigo según su causa: quietud y sueño para lo que proviene de girar y mirar, evacuación de sangre y humores para el tipo material, tratamiento del órgano causante, tratamiento del golpe en primer lugar, y que el afectado evite mirar lo que gira y mirar hacia abajo desde una altura; no se reproducen recetas ni procedimientos {cite:canon-ibn-sina-print-v2 p.116} {cite:canon-ibn-sina-print-v2 p.117}"
  fr: "Ibn Sina propose un traitement du vertige selon sa cause: immobilité et sommeil pour les vertiges provoqués par les mouvements du regard, évacuation du sang et des humeurs pour les vertiges d'origine matérielle, traitement de l'organe responsable, en commençant par le traitement du traumatisme, et en conseillant au patient d'éviter de regarder ce qui tourne et de regarder en bas. Les recettes et les procédures ne sont pas reproduites. {cite:canon-ibn-sina-print-v2 p.116} {cite:canon-ibn-sina-print-v2 p.117}"
  tr: "İbn Sina, baş dönmesinin tedavisini nedenine göre belirtir: dönme ve bakma nedeniyle hareketsizlik ve uyku, kan ve fiziksel madde için kusur, orijinal organın tedavisi, önce darbenin tedavisi ve uygulayıcının çevreye bakmaktan ve yukarıdan denetlemekten kaçınması gerektiğini belirtir; ne reçeteler ne de prosedürler aktarılmamalıdır {cite:canon-ibn-sina-print-v2 s.116} {cite:canon-ibn-sina-print-v2 s.117}"
  id: "Ibn Sina menyebutkan pengobatan pusing berdasarkan penyebabnya: diam dan tidur akibat berbalik dan melihat, muntah darah dan cairan untuk benda fisik, mengobati organ asli, mengobati pukulan terlebih dahulu, dan praktisi harus menghindari melihat lingkungan sekitar dan mengawasi dari atas; tidak boleh diberikan resep maupun prosedur {cite:canon-ibn-sina-print-v2 hlm.116} {cite:canon-ibn-sina-print-v2 hlm.117}"
