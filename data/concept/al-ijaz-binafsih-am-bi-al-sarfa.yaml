issue:
  ar: "أين يقع الإعجاز: في نظم القرآن وبلاغته أم في صرف الله العرب عن معارضته؟"
  en: "Where does the inimitability lie: in the Qur'an's composition and rhetoric, or in God turning the Arabs away from opposing it?"
  ur: "اعجاز کہاں ہے: قرآن کے نظم اور بلاغت میں یا اللہ کے عربوں کو اس کی معارضت سے پھیر دینے میں؟"
  fr: "Où réside l'inimitabilité : dans la composition et la rhétorique du Coran, ou dans le fait que Dieu détourne les Arabes de s'y opposer ?"
  es: "¿Dónde está la inimitabilidad: en la composición y la retórica del Corán o en que Dios aparte a los árabes de oponerse a él?"
perspectives:
  - tradition: sunni
    id: intrinsic-inimitability
    standing: main
    stance:
      ar: "نظم القرآن وفصاحته وبلاغته وأسلوبه معجزة في ذاتها، والتحدي قائم لأن لا أحد يأتي بمثله."
      en: "The Qur'an's composition, eloquence, rhetoric and style are inimitable in themselves, and the challenge stands because no one can produce its like."
      ur: "قرآن کا نظم، فصاحت، بلاغت اور اسلوب اپنی ذات میں معجز ہیں، اور چیلنج قائم ہے کیونکہ کوئی اس جیسا نہیں لا سکتا۔"
      fr: "La composition, l'éloquence, la rhétorique et le style du Coran sont inimitables en eux-mêmes, et le défi tient car nul ne peut en produire l'égal."
      es: "La composición, la elocuencia, la retórica y el estilo del Corán son inimitables en sí mismos, y el desafío se sostiene porque nadie puede producir algo igual."
    holders: [person/fakhr-al-din-al-razi, person/mahmud-al-alusi, person/ibn-kathir, person/al-qurtubi, person/muhammad-al-tahir-ibn-ashur]
    summary:
      ar: "يناقش الرازي في مفاتيح الغيب وجوه الإعجاز وينتقد القول بالصرفة لصالح الإعجاز البلاغي في النص نفسه، ويؤكد الآلوسي في روح المعاني أن القرآن معجز بنفسه وأن لدى أصحاب الصرفة أدلة غير مقنعة. ويؤكد ابن كثير والقرطبي المعنى المشهور في إعجاز النص عند آيات التحدي، كالبقرة 23 و24 والإسراء 88، ويركز ابن عاشور على فرادة البلاغة والنظم محوراً للإعجاز {cite:research-summary-quran-arabic-classical-tafsir-2026 on section c}."
      en: "Al-Razi in Mafatih al-ghayb discusses aspects of i'jaz and critiques sarfa-type views in favour of the text's intrinsic rhetorical miracle; al-Alusi in Ruh al-ma'ani affirms the Qur'an is miraculous in itself and that advocates of sarfa lack convincing evidence; Ibn Kathir and al-Qurtubi affirm the standard view of intrinsic inimitability on the challenge verses, for example 2:23-24 and 17:88; and Ibn Ashur emphasises rhetorical and compositional uniqueness as central to i'jaz {cite:research-summary-quran-arabic-classical-tafsir-2026 on section c}."
      ur: "رازی مفاتیح الغیب میں اعجاز کے وجوہ پر بحث کرتے ہیں اور صرفہ کی قسم کے اقوال پر نص ہی کے بلاغی اعجاز کی حمایت میں نقد کرتے ہیں؛ آلوسی روح المعانی میں تصدیق کرتے ہیں کہ قرآن اپنی ذات میں معجز ہے اور اصحاب صرفہ کے پاس قائل کرنے والے دلائل نہیں؛ ابن کثیر اور قرطبی چیلنج والی آیات، مثلاً البقرہ 23 اور 24 اور الاسراء 88، پر نص کے ذاتی اعجاز کے معیاری قول کی تصدیق کرتے ہیں؛ اور ابن عاشور بلاغت اور نظم کی انفرادیت کو اعجاز کا مرکز بتاتے ہیں {cite:research-summary-quran-arabic-classical-tafsir-2026 on section c}۔"
      fr: "Al-Razi, dans Mafatih al-ghayb, discute les aspects de l'i'jaz et critique les vues de type sarfa en faveur du miracle rhétorique intrinsèque du texte ; al-Alusi, dans Ruh al-ma'ani, affirme que le Coran est miraculeux en lui-même et que les partisans de la sarfa manquent de preuves convaincantes ; Ibn Kathir et al-Qurtubi affirment l'avis habituel de l'inimitabilité intrinsèque sur les versets du défi, par exemple 2:23-24 et 17:88 ; et Ibn Ashur souligne l'unicité rhétorique et compositionnelle comme centrale pour l'i'jaz {cite:research-summary-quran-arabic-classical-tafsir-2026 on section c}."
      es: "Al-Razi, en Mafatih al-ghayb, discute los aspectos del i'jaz y critica las posturas de tipo sarfa a favor del milagro retórico intrínseco del texto; al-Alusi, en Ruh al-ma'ani, afirma que el Corán es milagroso en sí mismo y que los partidarios de la sarfa carecen de pruebas convincentes; Ibn Kathir y al-Qurtubi afirman la opinión habitual de la inimitabilidad intrínseca en los versículos del desafío, por ejemplo 2:23-24 y 17:88; e Ibn Ashur subraya la unicidad retórica y compositiva como central para el i'jaz {cite:research-summary-quran-arabic-classical-tafsir-2026 on section c}."
