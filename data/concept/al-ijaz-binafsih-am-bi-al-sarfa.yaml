id: concept/al-ijaz-binafsih-am-bi-al-sarfa
class: concept
kind: doctrine
tags: [arabiyya-browser, arabiyya-ijaz]
label:
  ar: "هل إعجاز القرآن في نفسه أم بالصرفة؟ النظّام والقول المشهور"
  en: "Is the Qur'an inimitable in itself or by sarfa? al-Nazzam and the mainstream view"
  ur: "کیا قرآن کا اعجاز اپنی ذات میں ہے یا صرفہ سے؟ نظّام اور مشہور قول"
  fr: "Le Coran est-il inimitable en soi ou par sarfa ? al-Nazzam et l'avis dominant"
  es: "¿Es el Corán inimitable en sí mismo o por sarfa? al-Nazzam y la opinión mayoritaria"
summary:
  ar: "القول المشهور أن نظم القرآن وفصاحته وأسلوبه معجزة في ذاتها، وأن التحدي باقٍ لأن أحداً لا يأتي بمثله. وذهب النظّام، المتوفى نحو سنة 230هـ الموافقة لسنة 845م، إلى أن العرب كانت قادرة لغوياً على مثله لكن الله صرفهم عنه، إما بسلب الدافع والعلم أو بالمنع المباشر، فالمعجزة في فعل الصرف لا في تفوق النص. ويرى النظام مع ذلك أن القرآن حجة بوجوه أخرى كالإخبار بالغيب، وأثّر القول في بعض المعتزلة وغيرهم، وردّه الجمهور لأنه يُسقط الإعجاز الذاتي، ومنهم الرازي والآلوسي وابن كثير والقرطبي وابن عاشور."
  en: "The mainstream view is that the Qur'an's composition, eloquence and style are inimitable in themselves, and the challenge remains unmet because no one can produce its like. Al-Nazzam, d. about 230 AH, 845 CE, held that the Arabs had the linguistic capacity to match it but God turned them away, either by removing motivation and knowledge or by direct prevention, so the miracle lies in the act of aversion rather than in the text's superiority. He still regarded the Qur'an as a proof by other features, such as knowledge of the unseen; the theory influenced some Mu'tazila and later figures, and was widely rejected by the majority as undermining intrinsic inimitability, among them al-Razi, al-Alusi, Ibn Kathir, al-Qurtubi and Ibn Ashur."
  ur: "مشہور قول یہ ہے کہ قرآن کا نظم، فصاحت اور اسلوب اپنی ذات میں معجز ہے، اور چیلنج اس لیے باقی ہے کہ کوئی اس جیسا نہیں لا سکتا۔ نظّام، جن کی وفات تقریباً 230ھ یعنی 845ء میں ہوئی، کے نزدیک عربوں کے پاس اس جیسا لانے کی لسانی صلاحیت تھی مگر اللہ نے انہیں پھیر دیا، یا تو داعیہ اور علم سلب کر کے یا براہ راست روک کر، اس لیے معجزہ صرف فعل صرفہ میں ہے نہ کہ متن کی برتری میں۔ نظّام قرآن کو پھر بھی دوسرے وجوہ، جیسے غیب کی خبر، سے حجت مانتے تھے؛ اس قول نے بعض معتزلہ اور دوسروں کو متاثر کیا، اور جمہور نے اسے ذاتی اعجاز کو کمزور کرنے کی وجہ سے رد کیا، جن میں رازی، آلوسی، ابن کثیر، قرطبی اور ابن عاشور شامل ہیں۔"
  fr: "L'avis dominant est que la composition, l'éloquence et le style du Coran sont inimitables en eux-mêmes, et que le défi reste sans réponse car nul ne peut en produire l'égal. Al-Nazzam, mort vers 230 de l'hégire, 845, tenait que les Arabes avaient la capacité linguistique de l'égaler mais que Dieu les en détourna, soit en ôtant la motivation et le savoir, soit par empêchement direct, de sorte que le miracle réside dans l'acte de détournement plutôt que dans la supériorité du texte. Il tenait pourtant le Coran pour une preuve par d'autres traits, comme la connaissance de l'invisible ; la théorie influença certains mu'tazilites et d'autres, et fut largement rejetée par la majorité comme minant l'inimitabilité intrinsèque, dont al-Razi, al-Alusi, Ibn Kathir, al-Qurtubi et Ibn Ashur."
  es: "La opinión mayoritaria es que la composición, la elocuencia y el estilo del Corán son inimitables en sí mismos, y que el desafío sigue sin respuesta porque nadie puede producir algo igual. Al-Nazzam, muerto hacia el 230 de la hégira, 845, sostenía que los árabes tenían capacidad lingüística para igualarlo pero que Dios los apartó, ya quitando la motivación y el saber, ya por impedimento directo, de modo que el milagro está en el acto de apartar y no en la superioridad del texto. Aun así tenía el Corán por prueba mediante otros rasgos, como el conocimiento de lo oculto; la teoría influyó en algunos mu'tazilíes y otros, y la mayoría la rechazó por socavar la inimitabilidad intrínseca, entre ellos al-Razi, al-Alusi, Ibn Kathir, al-Qurtubi e Ibn Ashur."
