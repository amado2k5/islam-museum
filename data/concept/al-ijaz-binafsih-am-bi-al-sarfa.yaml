    summary:
      ar: "يرى النظّام، المتوفى نحو سنة 230هـ الموافقة لسنة 845م، أن العرب كانت تملك القدرة اللغوية على مماثلة نقاء القرآن وفصاحته، ولكن الله صرفهم، إما بسلب الدافع والعلم وإما بالمنع المباشر، فالإعجاز في فعل الصرف لا في تفوق النص ذاته. ومع ذلك عدّ القرآن دليلاً بوجوه أخرى كعلم الغيب. وأثّرت النظرية في بعض المعتزلة وبعض من جاء بعد، وردّها الجمهور لأنها تضعف الإعجاز الذاتي {cite:research-summary-quran-arabic-classical-tafsir-2026 on section c}."
      en: "Al-Nazzam (d. ca. 230/845) held that the Arabs possessed the linguistic capacity to match the Qur'an's purity and eloquence, but God turned them away, either by removing motivation and knowledge or by direct prevention, so the miracle lies in the divine act of aversion rather than the text's inherent superiority. He still regarded the Qur'an as a proof via other features, such as knowledge of the unseen. The theory influenced some Mu'tazila and later figures, and was widely rejected by the majority as undermining intrinsic i'jaz {cite:research-summary-quran-arabic-classical-tafsir-2026 on section c}."
      ur: "نظّام، جن کی وفات تقریباً 230ھ یعنی 845ء میں ہوئی، کے نزدیک عربوں کے پاس قرآن کی پاکیزگی اور فصاحت جیسا لانے کی لسانی صلاحیت تھی مگر اللہ نے انہیں پھیر دیا، یا تو داعیہ اور علم سلب کر کے یا براہ راست روک کر، اس لیے اعجاز فعل صرفہ میں ہے نہ کہ خود متن کی برتری میں۔ پھر بھی انہوں نے قرآن کو دوسرے وجوہ، جیسے علم غیب، سے دلیل مانا۔ اس نظریے نے بعض معتزلہ اور بعد کے لوگوں کو متاثر کیا، اور جمہور نے اسے ذاتی اعجاز کو کمزور کرنے کی وجہ سے رد کیا {cite:research-summary-quran-arabic-classical-tafsir-2026 on section c}۔"
      fr: "Al-Nazzam (mort vers 230/845) tenait que les Arabes possédaient la capacité linguistique d'égaler la pureté et l'éloquence du Coran, mais que Dieu les en détourna, soit en ôtant la motivation et le savoir, soit par empêchement direct, de sorte que le miracle réside dans l'acte divin de détournement plutôt que dans la supériorité inhérente du texte. Il tenait pourtant le Coran pour une preuve par d'autres traits, comme la connaissance de l'invisible. La théorie influença certains mu'tazilites et des figures ultérieures, et fut largement rejetée par la majorité comme minant l'i'jaz intrinsèque {cite:research-summary-quran-arabic-classical-tafsir-2026 on section c}."
      es: "Al-Nazzam (m. hacia 230/845) sostenía que los árabes poseían la capacidad lingüística de igualar la pureza y la elocuencia del Corán, pero que Dios los apartó, ya quitando la motivación y el saber, ya por impedimento directo, de modo que el milagro está en el acto divino de apartar y no en la superioridad inherente del texto. Aun así tenía el Corán por prueba mediante otros rasgos, como el conocimiento de lo oculto. La teoría influyó en algunos mu'tazilíes y figuras posteriores, y la mayoría la rechazó por socavar el i'jaz intrínseco {cite:research-summary-quran-arabic-classical-tafsir-2026 on section c}."
