label:
  ar: علم الفرائض
  en: The science of inheritance shares
summary:
  ar: "علم الفرائض في الحديث الثالث والأربعون — أول زيادات ابن رجب — من جامع أحكام المواريث: «ألحقوا الفرائض بأهلها فما أبقت الفرائض فلأولى رجل ذكر» — فأصحاب الفروض المقدرة في الكتاب يستوفونها أولاً ثم يستحق الباقي أقرب العصبة من الذكور عند جماعة الأئمة منهم أحمد وإسحاق، وعليه اختلف في الأخت مع البنت: قول ابن عباس والظاهرية بتعصيبها للباقي، وقول الجمهور — عمر وعلي وعائشة وزيد وابن مسعود ومعاذ — أنها عصبة مع الغير؛ وتعلق بالحديث أيضاً خلاف توريث ذوي الأرحام ومعنى «رجل ذكر» (جامع العلوم والحكم ص 846–847)."
  en: "The science of inheritance shares, anchored in the forty-third hadith — the first of Ibn Rajab's additions — as the text that gathers the rulings of succession: 'give the fixed shares to their people; whatever the shares leave over goes to the nearest male' — so those named for fixed portions in the Book take them first, then the nearest male agnate claims the residue, on the view of a group of imams including Ahmad and Ishaq; upon it turns the dispute of the sister alongside the daughter — Ibn Abbas's and the Zahiris' position that she inherits the residue by agnation versus the majority of Umar, Ali, A'isha, Zayd, Ibn Masud and Mu'adh that she is residuayer with her — and to the hadith attach further the controversy over the distant kindred's share and the sense of 'a male man' (Jami' al-Ulum wal-Hikam pp. 846–847)."
