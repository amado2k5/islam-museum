label:
  ar: علم الفرائض
  en: The science of inheritance shares
  es: "La ciencia de la herencia comparte"
  fr: "La science de l'hérédité"
summary:
  ar: "علم الفرائض في الحديث الثالث والأربعون — أول زيادات ابن رجب — من جامع أحكام المواريث: «ألحقوا الفرائض بأهلها فما أبقت الفرائض فلأولى رجل ذكر» — فأصحاب الفروض المقدرة في الكتاب يستوفونها أولاً ثم يستحق الباقي أقرب العصبة من الذكور عند جماعة الأئمة منهم أحمد وإسحاق، وعليه اختلف في الأخت مع البنت: قول ابن عباس والظاهرية بتعصيبها للباقي، وقول الجمهور — عمر وعلي وعائشة وزيد وابن مسعود ومعاذ — أنها عصبة مع الغير؛ وتعلق بالحديث أيضاً خلاف توريث ذوي الأرحام ومعنى «رجل ذكر» ⁦(جامع العلوم والحكم ص 846–847)⁩."
  en: "The science of inheritance shares, anchored in the forty-third hadith — the first of Ibn Rajab's additions — as the text that gathers the rulings of succession: 'give the fixed shares to their people; whatever the shares leave over goes to the nearest male' — so those named for fixed portions in the Book take them first, then the nearest male agnate claims the residue, on the view of a group of imams including Ahmad and Ishaq; upon it turns the dispute of the sister alongside the daughter — Ibn Abbas's and the Zahiris' position that she inherits the residue by agnation versus the majority of Umar, Ali, A'isha, Zayd, Ibn Masud and Mu'adh that she is residuayer with her — and to the hadith attach further the controversy over the distant kindred's share and the sense of 'a male man' (Jami' al-Ulum wal-Hikam pp. 846–847)."
  es: "La ciencia de las partes de la herencia, anclada en el hadiz cuarenta y tres —el primero de los añadidos de Ibn Rajab— como el texto que reúne las normas de sucesión: «dad las partes fijas a su gente; lo que sobre de las partes va al varón más cercano» — de modo que aquellos nombrados para porciones fijas en el Libro las toman primero, luego el agnado varón más cercano reclama el remanente, según la opinión de un grupo de imanes que incluyen a Ahmad e Ishaq; sobre esto gira la disputa de la hermana junto con la hija —la posición de Ibn Abbas y los Zahiris de que ella hereda el remanente por agnación frente a la mayoría de Umar, Ali, A'isha, Zayd, Ibn Masud y Mu'adh de que ella es residual con ella— y al hadiz se le añade además la controversia sobre la parte del pariente lejano y el sentido de «un varón» (Jami' al-Ulum wal-Hikam pp. 846–847)."
  fr: "La science des parts d'héritage, ancrée dans le quarante-troisième hadith — le premier des ajouts d'Ibn Rajab — comme texte rassemblant les règles de succession: « donnez les parts fixes à leurs proches; ce qui reste revient au plus proche parent masculin » — ainsi, ceux qui sont nommément désignés pour des parts fixes dans le Livre les reçoivent en premier, puis le plus proche parent masculin réclame le reste, selon l'avis d'un groupe d'imams, dont Ahmad et Ishaq; de là découle la controverse concernant la sœur aux côtés de la fille — la position d'Ibn Abbas et des Zahirites selon laquelle elle hérite du reste par filiation contre la majorité d'Umar, Ali, A'isha, Zayd, Ibn Masud et Mu'adh selon laquelle elle est résiduaire avec elle — et à ce hadith s'ajoute la controverse concernant la part du parent éloigné et le sens de « l'homme » (Jami' al-Ulum wal-Hikam pp. 846–847)."
