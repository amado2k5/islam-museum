id: concept/ashara-mubashshara
education:
  did_you_know:
    ar: "سمّى النبي عشرة من أصحابه وبشّرهم بالجنة، ويشهد لهم الطحاوي بها: أبو بكر وعمر وعثمان وعلي وطلحة والزبير وسعد وسعيد وعبد الرحمن وأبو عبيدة."
    en: "The Prophet named ten companions and gave them the good news of paradise, and al-Tahawi affirms it: Abu Bakr, Umar, Uthman, Ali, Talha, al-Zubayr, Sa'd, Sa'id, Abd al-Rahman and Abu Ubayda."
    ur: "نبی نے دس صحابہ کا نام لے کر انہیں جنت کی خوشخبری دی اور طحاوی اس کی تصدیق کرتا ہے: ابوبکر، عمر، عثمان، علی، طلحہ، زبیر، سعد، سعید، عبدالرحمٰن اور ابو عبیدہ۔"
    sources: [source/aqida-tahawiyya, source/lumat-al-itiqad]
class: concept
kind: doctrine
label:
  ar: العشرة المبشرون بالجنة
  en: The ten promised Paradise
summary:
  ar: 'العشرة من الصحابة الذين سمّاهم النبي وبشّرهم بالجنة، ويشهد لهم الطحاوي بها: أبو بكر وعمر وعثمان وعلي وطلحة والزبير وسعد وسعيد وعبد الرحمن بن عوف وأبو عبيدة.'
  en: 'The ten Companions whom the Prophet named and gave the good news of Paradise, to whom al-Tahawi bears witness: Abu Bakr, Umar, Uthman, Ali, Talha, al-Zubayr, Sa''d, Sa''id, Abd al-Rahman ibn Awf and Abu Ubayda.'
