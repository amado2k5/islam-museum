  stance:
    ar: الشهادة للعشرة بالجنة بما شهد لهم به النبي
    en: Testimony of Paradise for the ten on what the Prophet testified for them
  summary:
    ar: يقول الطحاوي إن العشرة الذين سمّاهم رسول الله وبشّرهم بالجنة يُشهد لهم بها على ما شهد لهم، ويسمّيهم ويصف أبا عبيدة بأنه أمين هذه الأمة.
