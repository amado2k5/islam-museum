  id: aqida-wasitiyya
  stance:
    ar: الشهادة بالجنة لمن شهد له النبي، كالعشرة وثابت بن قيس
    en: Testifying to Paradise for those the Prophet testified for, like the ten and Thabit ibn Qays
  summary:
    ar: يقول ابن تيمية إن أهل السنة «يشهدون بالجنة لمن شهد له رسول الله كالعشرة وثابت بن قيس بن شماس وغيرهم من الصحابة»، ويذكر أن أهل بدر قال الله لهم «اعملوا ما شئتم فقد غفرت لكم» وأنه لا يدخل النار أحد بايع تحت الشجرة.
    en: Ibn Taymiyya says Ahl al-Sunna testify to Paradise for those the Messenger of God testified for, such as the ten, Thabit ibn Qays ibn Shammas and other Companions; he mentions that God said to the people of Badr to do as they wished for He had forgiven them, and that no one who pledged under the tree enters the Fire.
