  id: lumat-al-itiqad
  stance:
    ar: الشهادة للعشرة ولكل من شهد له النبي بالجنة، مع عدم الجزم لغيرهم
    en: Testimony for the ten and for anyone the Prophet testified for, with no certainty for others
  summary:
    ar: 'يقول ابن قدامة: «ونشهد للعشرة بالجنة، كما شهد لهم النبي»، ويسمّيهم، ثم يقول: «وكل من شهد له النبي بالجنة، شهدنا له بها»، ويذكر الحسن والحسين وثابت بن قيس، ولا يجزم لأحد من أهل القبلة بجنة ولا نار إلا من جزم له الرسول.'
    en: Ibn Qudama says we testify to Paradise for the ten as the Prophet testified for them, names them, and says that for everyone the Prophet testified Paradise we testify too, mentioning al-Hasan and al-Husayn and Thabit ibn Qays, while being certain of neither Paradise nor Hell for any other of the people of the qibla.
