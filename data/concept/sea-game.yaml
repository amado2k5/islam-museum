label:
  ar: "صيد البحر"
  en: "The game of the sea"
  ur: "سمندری شکار"
  es: "El juego del mar"
  fr: "Le jeu de la mer"
summary:
  ar: "أحلّ الله صيد البحر وطعامه متاعاً لكم وللسيارة وحرّم صيد البر ما دمتم حرماً، وفي البحرين اللؤلؤ والمرجان والسمك الطري."
  en: "God made lawful the game of the sea and its food, provision for you and for travellers, while land game is forbidden to you in ihram; from the two seas come pearl and coral and fresh fish."
  ur: "اللہ نے سمندر کا شکار اور اس کا کھانا تمہارے اور مسافروں کے لیے حلال کیا جبکہ احرام میں خشکی کا شکار حرام ہے؛ دونوں سمندروں سے موتی، مرجان اور تازہ مچھلی ملتی ہے۔"
  es: "Dios hizo lícita la caza del mar y su alimento, sustento para vosotros y para los viajeros, mientras que la caza terrestre os está prohibida durante el ihram; de los dos mares proceden las perlas, los corales y el pescado fresco."
  fr: "Dieu a rendu licite la chasse en mer et sa nourriture, pour votre subsistance et celle des voyageurs, tandis que la chasse terrestre vous est interdite en état d'ihram; des deux mers proviennent les perles, le corail et le poisson frais."
