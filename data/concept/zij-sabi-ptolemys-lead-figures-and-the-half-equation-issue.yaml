label: { ar: "أرقام بطليموس لسبق القمر ومسألة نصف التعديل", en: "Ptolemy's figures for the Moon's lead and the question of the half equation", ur: "بطلیموس کے سبقتِ قمر کے اعداد اور نصف تعدیل کا سوال", es: "Las cifras de Ptolomeo sobre el avance de la Luna y la cuestión de la ecuación de la mitad", fr: "Les chiffres de Ptolémée concernant le plomb de la Lune et la question de la demi-équation", tr: "Batlamyus'un Ay'ın presesyonu için verdiği sayılar ve yarım modifikasyon sorunu", id: "Angka-angka Ptolemy untuk presesi bulan dan masalah modifikasi setengah." }
summary:
  ar: "يذكر البتاني أن بطليموس حسب سبق القمر بالقياس على أكثر التعديلين، حين يكون تعديل القمر خمسة أجزاء وتعديل الشمس جزءين وثلثاً وعشرين دقيقة، فيجتمع الفضل سبعة أجزاء وخمس دقائق ونصف، فيعطي سبقاً قريباً من ساعة، وأن ذلك لا يتفق مع حال تعديل القمر إذا بلغ ثلاثة أجزاء. {cite:zij-sabi-nallino-byblion p.144}."
  en: "Al-Battani says Ptolemy computed the Moon's lead on the basis of the larger of the two equations, when the Moon's equation is five parts and the Sun's two parts and twenty-three minutes; the difference then comes to about seven parts and five and a half minutes, giving a lead of nearly an hour. He notes this does not hold when the Moon's equation is three parts. {cite:zij-sabi-nallino-byblion p.144}."
  ur: "البتانی کہتے ہیں کہ بطلیموس نے سبقتِ قمر کو دونوں تعدیلوں میں سے بڑے پر حساب کیا، جب چاند کا تعدیل پانچ اجزاء اور سورج کا دو اجزاء اور تیئیس دقائق ہو؛ تب فرق تقریباً سات اجزاء اور ساڑھے پانچ دقائق بنتا ہے، اور سبقت تقریباً ایک گھنٹہ دیتا ہے۔ وہ کہتے ہیں کہ یہ اس وقت درست نہیں جب چاند کا تعدیل تین اجزاء ہو۔ {cite:zij-sabi-nallino-byblion p.144}۔"
  es: "Al-Battani afirma que Ptolomeo calculó la anticipación de la Luna basándose en la mayor de las dos ecuaciones, cuando la ecuación de la Luna es de cinco partes y la del Sol de dos partes y veintitrés minutos; la diferencia resulta entonces en aproximadamente siete partes y cinco minutos y medio, lo que da una anticipación de casi una hora. Señala que esto no se cumple cuando la ecuación de la Luna es de tres partes. {cite:zij-sabi-nallino-byblion p.144}."
  fr: "Al-Battani explique que Ptolémée a calculé l'avance de la Lune en se basant sur la plus grande des deux équations, lorsque l'équation de la Lune est de cinq parties et celle du Soleil de deux parties et vingt-trois minutes; la différence est alors d'environ sept parties et cinq minutes et demie, soit une avance de près d'une heure. Il note que ce calcul n'est pas valable lorsque l'équation de la Lune est de trois parties. {cite:zij-sabi-nallino-byblion p.144}."
  tr: "Al-Battani, Batlamyus'un ay önceliğini, iki ayarlamadan daha büyük olanı ölçerek hesapladığını, ay ayarlamasının beş kısım, güneş ayarlamasının ise iki kısım, yani üçte bir ve yirmi dakika olduğunu, dolayısıyla farkın yedi kısım, beş buçuk dakika olduğunu ve bunun yaklaşık bir saatlik bir öncelik verdiğini, ancak bunun ay ayarlamasının üç kısım olduğu durumla uyuşmadığını belirtir. {cite:zij-sabi-nallino-byblion s.144}."
  id: "Al-Battani menyebutkan bahwa Ptolemy menghitung prioritas bulan dengan mengukur penyesuaian yang lebih besar dari kedua penyesuaian tersebut, ketika penyesuaian bulan adalah lima bagian dan penyesuaian matahari adalah dua bagian, sepertiga dan dua puluh menit, sehingga perbedaannya adalah tujuh bagian, lima setengah menit, memberikan prioritas hampir satu jam, dan bahwa ini tidak sesuai dengan keadaan penyesuaian bulan ketika itu adalah tiga bagian. {cite:zij-sabi-nallino-byblion p.144}."
