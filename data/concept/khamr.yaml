label: { ar: "الخمر", en: "Wine", es: "Vino", fr: "Vin", ur: "شراب", tr: "Alkol", id: "Alkohol" }
summary:
  ar: "ورد في مسامرة للمستكفي عند المسعودي أنها ليس في العالم شيء أخذ من أمهاته الأربع فضيلتها إلا هي، فلها لون النار وهو أحسن الألوان ولدونة الهواء وهي ألين المجسات وعذوبة الماء وهي أطيب المذاقات وبرد الأرض وهي ألذ المشروبات، قيل فيها ست أرى كالراح في جمعها لأربع هن قوام الورى عذوبة الماء ولين الهوا وسخنة النار وبرد الثرى، ويشبه شعاعها بكل شيء نوري من شمس وقمر ونجم ونار ولونها بالياقوت والعقيق والذهب، وشبهها الأولون بدم الذبيح، وأتى أبو نواس في وصف نورها وطعمها وريحها وظروفها بما كاد يغلق باب الوصف منه فكأنها في كفه شمس وراحته قمر {cite:muruj-al-dhahab p. 707-709}، وفي الاجتهاد ذهب الأئمة الثلاثة مالك والشافعي وأحمد إلى سد الباب ففسروا الخمر بما يشمل جميع الأنبذة المسكرة وقالوا كلها خمر وكلها محرمة، بينما فسرها أبو حنيفة بعصير العنب مستنداً إلى اللغة فأجاز بعض الأنبذة كنبيذ التمر والزبيب إن طُبخ وشرب منه قدر لا يسكر ونحو الخليطين، تبعاً في ذلك لابن مسعود الذي كان يرى حل النبيذ حتى اتبعه عامة التابعين الكوفيين وجعلوه أعظم حججهم، وكان عبد الله بن إدريس الوحيد بين فقهاء الكوفة يحرمه فيردون عليه {cite:duha-islam p. 119-120}."
  en: "The drink that alone drew the best of the four mothers — fire's colour, air's softness, water's sweetness, earth's cold {cite:muruj-al-dhahab p. 707-709}."
  es: "La bebida que solo extraía lo mejor de las cuatro madres: el color del fuego, la suavidad del aire, la dulzura del agua, el frío de la tierra {cite:muruj-al-dhahab p. 707-709}."
  fr: "La boisson qui seule attirait le meilleur des quatre mères — la couleur du feu, la douceur de l'air, la douceur de l'eau, le froid de la terre {cite:muruj-al-dhahab p. 707-709}."
  ur: "وہ مشروب جس نے اکیلے ہی چار ماؤں میں سے سب سے بہتر بنایا — آگ کا رنگ، ہوا کی نرمی، پانی کی مٹھاس، زمین کی سردی {حوالہ: مروج الذہب ص۔ 707-709}۔"
  tr: "El-Mustakfi'nin el-Mes'udi ile yaptığı bir sohbette, dünyada erdemini dört annesinden alan hiçbir şeyin kendisi olmadığı belirtilir. Ateşin rengi, en iyi renkler, havanın yumuşaklığı, duyguların yumuşaklığı, suyun tatlılığı, en lezzetli tat ve toprağın serinliği ve en lezzetli içecektir. Altı tanesinin rüzgar gibi olduğu söylenir; dörde bölündüklerinde ise toprağın özüdürler: suyun tazeliği, havanın yumuşaklığı, ateşin sıcaklığı ve toprağın soğukluğu. Işınları her şeye benzer—güneş, ay, yıldız ve ateş. Rengi yakut, ak ve altındır. Eskiler onu kana benzetmiştir. Kesilen hayvan. Ebu Nuwas, onun ışığını, tatını, kokusunu ve koşullarını neredeyse elinde güneş, avucunda bir ay gibi tarif etmesine neredeyse kapıyı kapatacak şekilde tarif etti {cite:muruj-al-dhahab s. 707-709}. İctihadlarında üç imam—Malik, Al-Shafi'i ve Ahmad—kapıya gidip şarabın tüm sarhoş edici tütsüleri içerdiğini açıkladılar; hepsinin şarap olduğunu ve hepsinin yasak olduğunu söylediler; Ebu Hanife ise dil temelinde üzüm suyu olarak yorumladı; bazı tütsü şarabını, örneğin hurma şarabı ve kuru üzüm, pişirilip sarhoş etmeyen bir tencerede içilirse ve benzer karışımlara izin verdi Bu, İbn Mes'ud'a atfedilir; o da çoğu Kufan takipçisi onu takip edip en büyük kanıtı haline gelene kadar şerabın caiz olduğunu düşünmüştür. Abdullah ibn İdris, Kufe'nin hukukçuları arasında bunu yasaklayan tek âlimdi ve onlar da ona yanıt vermiştir {atıf:Duha-İslam, s. 119-120}."
  id: "Dalam sebuah percakapan al-Mustakfi dengan al-Mas'udi disebutkan bahwa tidak ada yang di dunia ini mengambil keutamaannya dari empat induknya kecuali dirinya. Warna api adalah warna terbaik, kelembutan udara, kelembutan perasaan, manisnya air, rasa paling lezat, dan dinginnya bumi, dan minuman ini adalah minuman paling lezat. Dikatakan bahwa enam di antaranya seperti angin; ketika dibagi menjadi empat, mereka adalah esensi bumi: kesegaran air, kelembutan udara, hangatnya api, dan dinginnya bumi. Sinar apinya menyerupai segala sesuatu yang bercahaya—matahari, bulan, bintang, dan api. Warnanya adalah rubi, agat, dan emas. Orang kuno mengibaratkannya dengan darah. Hewan yang disembelih. Abu Nuwas menggambarkan cahaya, rasa, aroma, dan keadaannya dengan cara yang hampir menutup pintu untuk deskripsi, seolah-olah itu adalah matahari di tangannya dan bulan di telapak tangannya {cite:muruj-al-dhahab hlm. 707-709}. Dalam ijtihad mereka, ketiga imam—Malik, Al-Shafi'i, dan Ahmad—mendekati pintu dan menjelaskan bahwa anggur itu mencakup semua dupa yang memabukkan, mengatakan bahwa semua adalah anggur dan semua dilarang, sementara Abu Hanifa menafsirkannya sebagai jus anggur berdasarkan bahasa, mengizinkan beberapa anggur dupa, seperti anggur kurma dan kismis, jika dimasak dan diminum dalam panci yang tidak memabukkan, serta campuran serupa sebagai berikut Hal ini dikaitkan dengan Ibn Mas'ud, yang menganggap anggur diperbolehkan sampai sebagian besar pengikut Kufan mengikutinya dan menjadikannya bukti terbesar mereka. Abdullah ibn Idris adalah satu-satunya ulama di antara para ahli hukum Kufa yang melarangnya, dan mereka menanggapinya {cite:Duha-Islam, hlm. 119-120}."
