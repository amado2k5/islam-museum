id: concept/khamr
class: concept
kind: term
label: { ar: "الخمر", en: "Wine" }
summary:
  ar: "ورد في مسامرة للمستكفي عند المسعودي أنها ليس في العالم شيء أخذ من أمهاته الأربع فضيلتها إلا هي، فلها لون النار وهو أحسن الألوان ولدونة الهواء وهي ألين المجسات وعذوبة الماء وهي أطيب المذاقات وبرد الأرض وهي ألذ المشروبات، قيل فيها ست أرى كالراح في جمعها لأربع هن قوام الورى عذوبة الماء ولين الهوا وسخنة النار وبرد الثرى، ويشبه شعاعها بكل شيء نوري من شمس وقمر ونجم ونار ولونها بالياقوت والعقيق والذهب، وشبهها الأولون بدم الذبيح، وأتى أبو نواس في وصف نورها وطعمها وريحها وظروفها بما كاد يغلق باب الوصف منه فكأنها في كفه شمس وراحته قمر {cite:muruj-al-dhahab p. 707-709}، وفي الاجتهاد ذهب الأئمة الثلاثة مالك والشافعي وأحمد إلى سد الباب ففسروا الخمر بما يشمل جميع الأنبذة المسكرة وقالوا كلها خمر وكلها محرمة، بينما فسرها أبو حنيفة بعصير العنب مستنداً إلى اللغة فأجاز بعض الأنبذة كنبيذ التمر والزبيب إن طُبخ وشرب منه قدر لا يسكر ونحو الخليطين، تبعاً في ذلك لابن مسعود الذي كان يرى حل النبيذ حتى اتبعه عامة التابعين الكوفيين وجعلوه أعظم حججهم، وكان عبد الله بن إدريس الوحيد بين فقهاء الكوفة يحرمه فيردون عليه {cite:duha-islam p. 119-120}."
  en: "The drink that alone drew the best of the four mothers — fire's colour, air's softness, water's sweetness, earth's cold {cite:muruj-al-dhahab p. 707-709}."
