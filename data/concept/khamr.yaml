id: concept/khamr
class: concept
kind: term
label: { ar: "الخمر", en: "Wine" }
summary:
  ar: "ورد في مسامرة للمستكفي عند المسعودي أنها ليس في العالم شيء أخذ من أمهاته الأربع فضيلتها إلا هي، فلها لون النار وهو أحسن الألوان ولدونة الهواء وهي ألين المجسات وعذوبة الماء وهي أطيب المذاقات وبرد الأرض وهي ألذ المشروبات، قيل فيها ست أرى كالراح في جمعها لأربع هن قوام الورى عذوبة الماء ولين الهوا وسخنة النار وبرد الثرى، ويشبه شعاعها بكل شيء نوري من شمس وقمر ونجم ونار ولونها بالياقوت والعقيق والذهب، وشبهها الأولون بدم الذبيح، وأتى أبو نواس في وصف نورها وطعمها وريحها وظروفها بما كاد يغلق باب الوصف منه فكأنها في كفه شمس وراحته قمر {cite:muruj-al-dhahab p. 707-709}."
  en: "The drink that alone drew the best of the four mothers — fire's colour, air's softness, water's sweetness, earth's cold {cite:muruj-al-dhahab p. 707-709}."
sources: [source/muruj-al-dhahab]
