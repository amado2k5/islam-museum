label: { ar: "تطابق البُعد الحقيقي والأوسط دون اختلاف", en: "When the true and mean apogees coincide without inequality", ur: "جب حقیقی اور اوسط بُعد بغیر اختلاف کے ایک ہوں", es: "Cuando los apogeos verdadero y medio coinciden sin desigualdad" }
summary:
  ar: "إذا كان الكوكب على نقطة البعد الأبعد من فلك التدوير ومركز فلك التدوير على نقطة البعد الأبعد من الفلك الخارج، فإن البعد الأبعد الحقيقي والأوسط يكونان واحداً ولا اختلاف بينهما. {cite:zij-sabi-nallino-byblion p.96}."
  en: "When the planet is at the far point of its epicycle and the epicycle's centre is at the far point of the eccentric, the true and the mean apogee are one and there is no inequality between them. {cite:zij-sabi-nallino-byblion p.96}."
  ur: "جب سیارہ اپنے فلکِ تدویر کے بُعدِ اَبعد پر ہو اور فلکِ تدویر کا مرکز خارج المرکز کے بُعدِ اَبعد پر ہو، تو حقیقی اور اوسط بُعدِ اَبعد ایک ہوتے ہیں اور ان کے درمیان کوئی اختلاف نہیں ہوتا۔ {cite:zij-sabi-nallino-byblion p.96}۔"
  es: "Cuando el planeta se encuentra en el extremo de su epiciclo y el centro del epiciclo está en el extremo de la excéntrica, el apogeo verdadero y el apogeo medio coinciden, sin que exista desigualdad alguna entre ellos. {cite:zij-sabi-nallino-byblion p.96}."
