label:
  ar: الرشوة
  en: "Bribery (al-rishwa)"
  fr: "La corruption (al-rishwa)"
  es: "Soborno (al-rishwa)"
summary:
  ar: "يعد قعدات الرشوة صورة من صور فتنة المال، وهي إعطاء الأموال أو أخذها بغير حق في التعامل مع الحكام والمسؤولين {cite:qadan-manhaj-iqtisad-quran p. 141}. ويستشهد بنهي القرآن عن أكل أموال الناس بالباطل، وعن إعطاء السفهاء الأموال التي جعلها الله قياماً {cite:qadan-manhaj-iqtisad-quran p. 141}. ويرى أن مثل هذه الصور تبدد الموارد، وتدفع إلى التضخم، وتقوي طبقة المترفين {cite:qadan-manhaj-iqtisad-quran p. 141}. يبين المؤلف أن الرشوة تضعف الإنتاج، لأنها تجعل الناس يبحثون عن المرتشي لا عن المنتج الأمين، وأن الراشي لا يرشو إلا إذا علم أن سلعته لا تروج إلا بالرشوة، فيجب محاربتها لإخلاء الطريق أمام المنتجين."
  fr: "L’auteur compte la corruption parmi les formes de l’épreuve de l’argent : c’est le fait de donner ou de prendre des biens sans droit dans les rapports avec les gouvernants et les responsables {cite:qadan-manhaj-iqtisad-quran p. 141}. Il invoque l’interdiction coranique de manger les biens des gens par le faux, et de donner aux insensés les biens que Dieu a faits pour la subsistance {cite:qadan-manhaj-iqtisad-quran p. 141}. Il estime que de telles formes dilapident les ressources, poussent à l’inflation et renforcent la classe des gens vivant dans le luxe {cite:qadan-manhaj-iqtisad-quran p. 141}. L’auteur montre que la corruption affaiblit la production, car elle pousse les gens à chercher celui qui se laisse corrompre plutôt que le producteur honnête, et que le corrupteur ne corrompt que s’il sait que sa marchandise ne s’écoulera que par la corruption ; il faut donc la combattre pour dégager la voie devant les producteurs."
