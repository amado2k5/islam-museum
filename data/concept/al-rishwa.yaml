summary:
  ar: "يعد قعدات الرشوة صورة من صور فتنة المال، وهي إعطاء الأموال أو أخذها بغير حق في التعامل مع الحكام والمسؤولين {cite:qadan-manhaj-iqtisad-quran p. 141}. ويستشهد بنهي القرآن عن أكل أموال الناس بالباطل، وعن إعطاء السفهاء الأموال التي جعلها الله قياماً {cite:qadan-manhaj-iqtisad-quran p. 141}. ويرى أن مثل هذه الصور تبدد الموارد، وتدفع إلى التضخم، وتقوي طبقة المترفين {cite:qadan-manhaj-iqtisad-quran p. 141}. يبين المؤلف أن الرشوة تضعف الإنتاج، لأنها تجعل الناس يبحثون عن المرتشي لا عن المنتج الأمين، وأن الراشي لا يرشو إلا إذا علم أن سلعته لا تروج إلا بالرشوة، فيجب محاربتها لإخلاء الطريق أمام المنتجين."
