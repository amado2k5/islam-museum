label:
  ar: الرشوة
  en: "Bribery (al-rishwa)"
  fr: "La corruption (al-rishwa)"
  es: "Soborno (al-rishwa)"
  ur: "رشوت خوری ⁦(الرشوہ)⁩"
  tr: "rüşvet"
  id: "suap"
summary:
  ar: "يعد قعدات الرشوة صورة من صور فتنة المال، وهي إعطاء الأموال أو أخذها بغير حق في التعامل مع الحكام والمسؤولين {cite:qadan-manhaj-iqtisad-quran p. 141}. ويستشهد بنهي القرآن عن أكل أموال الناس بالباطل، وعن إعطاء السفهاء الأموال التي جعلها الله قياماً {cite:qadan-manhaj-iqtisad-quran p. 141}. ويرى أن مثل هذه الصور تبدد الموارد، وتدفع إلى التضخم، وتقوي طبقة المترفين {cite:qadan-manhaj-iqtisad-quran p. 141}. يبين المؤلف أن الرشوة تضعف الإنتاج، لأنها تجعل الناس يبحثون عن المرتشي لا عن المنتج الأمين، وأن الراشي لا يرشو إلا إذا علم أن سلعته لا تروج إلا بالرشوة، فيجب محاربتها لإخلاء الطريق أمام المنتجين."
  fr: "L’auteur compte la corruption parmi les formes de l’épreuve de l’argent : c’est le fait de donner ou de prendre des biens sans droit dans les rapports avec les gouvernants et les responsables {cite:qadan-manhaj-iqtisad-quran p. 141}. Il invoque l’interdiction coranique de manger les biens des gens par le faux, et de donner aux insensés les biens que Dieu a faits pour la subsistance {cite:qadan-manhaj-iqtisad-quran p. 141}. Il estime que de telles formes dilapident les ressources, poussent à l’inflation et renforcent la classe des gens vivant dans le luxe {cite:qadan-manhaj-iqtisad-quran p. 141}. L’auteur montre que la corruption affaiblit la production, car elle pousse les gens à chercher celui qui se laisse corrompre plutôt que le producteur honnête, et que le corrupteur ne corrompt que s’il sait que sa marchandise ne s’écoulera que par la corruption ; il faut donc la combattre pour dégager la voie devant les producteurs."
  tr: "Rüşvet, hükümdarlar ve memurlarla haksız şekilde para vermek veya almak anlamına gelen bir mali sınav biçimi olarak kabul edilir {cite:qadan-manhaj-iqtisad-kur'an, s. 141}. Kur'an'ın insanların servetini haksız yere tüketmeyi ve Allah'ın sunduğu serveti aptal insanlara vermeyi yasakladığını örnek gösterir {cite:qadan-manhaj-iqtisad-kur'an s. 141}. Böyle biçimlerin kaynak israfı olduğuna, enflasyonu tetiklediğine ve varlıklı sınıfı güçlendirdiğine inanır {cite:qadan-manhaj-iqtisad-kur'an s. 141}. Yazar, rüşvetin üretimi zayıflattığını çünkü insanların dürüst ürünü değil rüşvet aldığını ve rüşvetçinin mallarının sadece rüşvetle desteklendiğini bilirse rüşvet aldığını, bu yüzden üreticilerin yolunu açmak için mücadele edilmesi gerektiğini açıklar."
  id: "Suap dianggap sebagai bentuk ujian keuangan yang berarti memberikan atau menerima uang secara tidak adil kepada penguasa dan pejabat {cite:qadan-manhaj-iqtisad-qur'an, hlm. 141}. Ia mengutip sebagai contoh bahwa Al-Qur'an melarang mengonsumsi kekayaan orang secara tidak adil dan memberikan kekayaan yang telah diberikan Tuhan kepada orang bodoh {cite:qadan-manhaj-iqtisad-qur'an hlm. 141}. Ia percaya bentuk-bentuk tersebut adalah pemborosan sumber daya, memicu inflasi, dan memperkuat kelas kaya {cite:qadan-manhaj-iqtisad-qur'an hlm. 141}. Penulis menjelaskan bahwa suap melemahkan produksi karena orang menerima suap, bukan produk yang jujur, dan jika suap tahu bahwa barang mereka hanya didukung oleh suap, mereka menerima suap, sehingga upaya harus dilakukan untuk membuka jalan bagi para produsen."
