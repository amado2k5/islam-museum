education:
  did_you_know:
    ar: "لم يبدأ التقويم الهجري من يوم الهجرة؛ استقر عمر بن الخطاب على جعل أول السنة المحرمَ سنة 17هـ."
    en: "The Hijri calendar does not start on the day of the Hijra; Umar ibn al-Khattab settled on the first of Muharram in year 17 AH."
    ur: "ہجری تقویم ہجرت کے دن سے نہیں شروع ہوتا؛ عمر بن خطاب نے 17ھ میں سال کے آغاز کو محرم ٹھہرایا۔"
