id: concept/hijri-calendar
class: concept
kind: term
label:
  ar: التقويم الهجري
  en: The Hijri calendar
  ur: التقويم الهجري
  es: "El calendario Hijri"
  fr: "Le calendrier hégirien"
  tr: "Hicri Takvimi"
  id: "Kalender Hijriyah"
summary:
  ur: قمری اسلامی تقویم جو ہجرت سے شروع ہوتا ہے اور جس پر عبادات و تاریخ قائم ہیں۔
  ar: تقويم قمري تُعدّ سنواته من هجرة النبي من مكة إلى المدينة، ويحدد مواعيد العبادات
    كرمضان والحج والأعياد؛ وتذكر الروايات أن عمر بن الخطاب هو من اعتمد هذا المبدأ
    للتأريخ، لكن اختلاف الروايات في سبب اعتماده وتاريخه يحتاج إلى مراجعة مصدر ثانٍ
    (needs_source).
  en: The lunar calendar that counts its years from the Prophet's hijra from Mecca
    to Medina, and sets the dates of Ramadan, the Hajj and the feasts. Reports say
    Umar ibn al-Khattab adopted the hijra as the starting point of dating; the reports
    differ on the occasion and the date, and need a second source (needs_source).
  es: "El calendario lunar que cuenta sus años desde la Hégira del Profeta de La Meca a Medina, y que establece las fechas del Ramadán, el Hajj y las festividades. Según algunos relatos, Umar ibn al-Khattab adoptó la Hégira como punto de partida para la datación; sin embargo, los relatos difieren en cuanto a la ocasión y la fecha, y se necesita una segunda fuente (needs_source)."
  fr: "Le calendrier lunaire, dont les années sont calculées à partir de l'Hégire du Prophète (traversée de La Mecque à Médine), fixe les dates du Ramadan, du Hajj et des fêtes. Selon certaines sources, Umar ibn al-Khattab aurait adopté l'Hégire comme point de départ du calendrier; toutefois, les récits divergent quant à l'occasion et la date, et une seconde source est nécessaire."
  tr: "Peygamber'in Mekke'den Medine'ye göçünden itibaren yılları sayılan bir ay takvimi, Ramazan, Hac ve bayramlar gibi ibadet tarihlerini belirtir. Rivayetler, Ömer bin El-Hattab'ın bu ilkeyi tarihlendirme için benimsediğini belirtir, ancak kabul edilme nedeni ve tarihi konusunda farklı rivayetler ikinci bir kaynağın incelenmesini gerektirir (needs_source)."
  id: "Kalender lunar yang tahun-tahunnya dihitung dari migrasi Nabi dari Mekah ke Madinah, dan menetapkan tanggal ibadah seperti Ramadan, Haji, dan festival. Narasi menyebutkan bahwa Umar ibn Al-Khattab mengadopsi prinsip ini untuk penanggalan, tetapi riwayat yang berbeda mengenai alasan dan tanggalnya memerlukan tinjauan sumber kedua (needs_source)."
