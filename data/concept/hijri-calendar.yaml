label: { ar: "التقويم الهجري", en: "The Hijri calendar" }
summary:
  ar: "تقويم قمري تُعدّ سنواته من هجرة النبي من مكة إلى المدينة، ويحدد مواعيد العبادات كرمضان والحج والأعياد؛ وتذكر الروايات أن عمر بن الخطاب هو من اعتمد هذا المبدأ للتأريخ، لكن اختلاف الروايات في سبب اعتماده وتاريخه يحتاج إلى مراجعة مصدر ثانٍ (needs_source)."
  en: "The lunar calendar that counts its years from the Prophet's hijra from Mecca to Medina, and sets the dates of Ramadan, the Hajj and the feasts. Reports say Umar ibn al-Khattab adopted the hijra as the starting point of dating; the reports differ on the occasion and the date, and need a second source (needs_source)."
