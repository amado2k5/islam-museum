id: concept/alamat-asnaf-al-suda-min-al-asbab-al-kharijiyya-wa-al-madiyya
class: concept
kind: scientific
label:
  ar: "علامات أصناف الصداع من الأسباب الخارجية والمادية"
  en: "Signs of the kinds of headache: external causes, weakness, matters, winds and temperaments"
  fr: "Signes des formes de céphalée : causes externes, faiblesse, matières, vents et tempéraments"
  ur: "صداع کی قسموں کی علامات: بیرونی اسباب، کمزوری، مادے، ہوائیں اور مزاج"
  es: "Síntomas de los distintos tipos de dolor de cabeza: causas externas, debilidad, problemas, vientos y temperamento."
  tr: "Baş ağrısı türlerinin dışsal ve fiziksel nedenlerden kaynaklanan belirtileri"
  id: "Gejala jenis sakit kepala yang disebabkan oleh penyebab eksternal dan fisik"
summary:
  ar: "يذكر ابن سينا علامات الصداع الكائن عن الأسباب الخارجية وعن ضعف الدماغ أو قوة حسه، وعن المواد بأصنافها، وعن الرياح والأبخرة، وعن الأمزجة الساذجة الحارة والباردة واليابسة؛ وفيه سطر موسوم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v2 pp.50-51}"
  en: "Ibn Sina gives the signs of headache from external causes, from weakness of the brain or strength of its sense, from matters of each kind, from winds and vapours, and from the plain hot, cold and dry temperaments; the record has a labelled line in a section held for the founder's ruling {cite:canon-ibn-sina-print-v2 pp.50-51}"
  fr: "Ibn Sina donne les signes des céphalées dues aux causes externes, à la faiblesse du cerveau ou à la force de sa sensibilité, aux différentes sortes de matières, aux vents et vapeurs, et aux tempéraments simples, chauds, froids ou secs. La notice comporte une mention signalée dans une section réservée à la décision du fondateur {cite:canon-ibn-sina-print-v2 pp.50-51}."
  ur: "ابن سینا بیرونی اسباب سے، دماغ کی کمزوری یا اس کے حس کی قوت سے، ہر قسم کے مادوں سے، ہواؤں اور بخارات سے، اور سادہ گرم، ٹھنڈے اور خشک مزاجوں سے ہونے والے صداع کی علامات بتاتا ہے؛ اس میں ایک موسوم سطر بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v2 pp.50-51}۔"
  es: "Ibn Sina menciona los síntomas del dolor de cabeza por causas externas, por debilidad cerebral o agudeza sensorial, por asuntos de todo tipo, por vientos y vapores, y por temperamentos cálidos, fríos y secos; el registro tiene una línea etiquetada en una sección reservada para la decisión del fundador {cite:canon-ibn-sina-print-v2 pp.50-51}"
  tr: "İbn Sina, dış nedenlerden kaynaklanan baş ağrılarının belirtilerinden, beynin zayıflığından veya gücünden, çeşitli maddelerden, rüzgar ve buhardan, saf sıcak, soğuk ve kuru ruh hallerinden bahseder; ve kurucunun kuralı üzerine bir bölümde başlıklı bir satır vardır {cite:canon-ibn-sina-print-v2 s.50-51}"
  id: "Ibn Sina menyebutkan gejala sakit kepala yang disebabkan oleh penyebab eksternal, kelemahan atau kekuatan otak, berbagai zat, angin dan uap, suasana hati panas, dingin, dan kering murni; dan dalam bagian tentang Aturan Pendiri, terdapat baris berjudul {cite:canon-ibn-sina-print-v2 hlm.50-51}"
