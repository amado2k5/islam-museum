label:
  ar: "التراخي"
  en: "Tarakhi (delay in performing a duty)"
  ur: "تراخی ⁦(کام میں تاخیر)⁩"
  es: "Tarakhi (retraso en el cumplimiento de un deber)"
  fr: "Tarakhi (retard dans l'accomplissement d'un devoir)"
  tr: "gevşeklik"
  id: "kelonggaran"
summary:
  ar: "التراخي كون الأداء متأخرا عن أول وقت الإمكان إلى مظنة الفوت، وضده الفور. وللأصوليين خلاف في الأمر المطلق: هل يقتضي الفور أو التراخي أو التوقف. وللفقهاء أحكام تراخ في رد المغصوب والهبة والشفعة والوصية والنكاح وخيار العيب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4923} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4925} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4927}"
  en: "Tarakhi is performing an act later than its first possible time, up to the point where it may be lost; its opposite is fawr, prompt performance. Usulis differ over a bare command: whether it requires prompt performance, delay, or neither. Jurists apply delay in the return of usurped goods, in gifts, in pre-emption, in bequests, in marriage and in defect options. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4923} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4925} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4927}"
  es: "Tarakhi es realizar un acto más tarde de su primer momento posible, hasta el punto en que puede perderse; su opuesto es fawr, la pronta ejecución. Los usulis difieren sobre una simple orden: si requiere pronta ejecución, demora o ninguna de las dos. Los juristas aplican la demora en la devolución de bienes usurpados, en donaciones, en el derecho de tanteo, en legados, en matrimonios y en opciones por defecto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4923} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4925} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4927}"
  fr: "Tarakhi consiste à accomplir un acte après le moment initialement prévu, jusqu'à ce qu'il devienne caduc; son contraire est fawr, l'exécution immédiate. Les usulis divergent quant à l'interprétation d'un commandement simple: exige-t-il une exécution immédiate, un délai, ou ni l'un ni l'autre ? Les juristes appliquent le délai dans la restitution des biens usurpés, les donations, le droit de préemption, les legs, le mariage et les options de défaut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4923} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4925} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4927}"
  ur: "تراکھی اپنے پہلے ممکنہ وقت سے زیادہ دیر میں ایک عمل انجام دے رہا ہے، اس مقام تک جہاں وہ ضائع ہو سکتا ہے۔ اس کے برعکس fawr، فوری کارکردگی ہے. Usulis ایک ننگی کمانڈ سے مختلف ہے: چاہے اسے فوری کارکردگی کی ضرورت ہو، تاخیر، یا نہ ہی۔ فقہا غصب شدہ مال کی واپسی میں تاخیر کا اطلاق تحائف میں، قبل از وقت، وصیت میں، نکاح میں اور عیب کے اختیارات میں کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص.4922} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص4923} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص.4925} {حوالہ: فقہ-موسوع-کویتیہ-نور-v3 صفحہ4923} صفحہ 4927}"
  tr: "Gevşeklik, ödemenin en erken zamandan eksik olma ihtimaline kadar geciktirilmesidir; bunun ise tam tersi ise anlıktır. İlke bilginleri mutlak konuda farklı görüşe sahiptir: anlık mı, gevşeklik mi yoksa sonlandırma mı gerektiği. Hukukçular, gasp edilen mülkün iadesi, hediye, önlem, vasiyet, evlilik ve kusur seçeneği konusunda gevşeklik kararlarına sahiptir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4923} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4925} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4927}"
  id: "Kelonggaran terjadi ketika pembayaran tertunda dari waktu paling awal hingga kemungkinan hilang, dan sebaliknya adalah kelangsungan yang mendesak. Para ahli prinsip berbeda pendapat dalam hal mutlak: apakah harus segera dilakukan, kelonggaran, atau penghentian. Para ahli hukum memiliki keputusan kelonggaran dalam mengembalikan harta, hadiah, preemption, wasiat, pernikahan, dan opsi cacat yang diambil alih. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4923} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4925} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4927}"
