summary:
  ar: "التراخي كون الأداء متأخرا عن أول وقت الإمكان إلى مظنة الفوت، وضده الفور. وللأصوليين خلاف في الأمر المطلق: هل يقتضي الفور أو التراخي أو التوقف. وللفقهاء أحكام تراخ في رد المغصوب والهبة والشفعة والوصية والنكاح وخيار العيب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4923} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4925} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4927}"
  en: "Tarakhi is performing an act later than its first possible time, up to the point where it may be lost; its opposite is fawr, prompt performance. Usulis differ over a bare command: whether it requires prompt performance, delay, or neither. Jurists apply delay in the return of usurped goods, in gifts, in pre-emption, in bequests, in marriage and in defect options. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4923} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4925} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4927}"
