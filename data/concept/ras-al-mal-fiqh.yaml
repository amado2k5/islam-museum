label:
  ar: "رأس المال (في الفقه)"
  en: "Capital (ra's al-mal): the principal sum without profit"
  ur: "رأس المال (فقہی اصطلاح)"
summary:
  ar: "رأس المال في اللغة أصل المال بلا ربح ولا زيادة، وهو جملة المال التي تستثمر في عمل ما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8530} ويذكر الفقهاء هذا المصطلح في الزكاة والشركة والمضاربة والسلم والربا والقرض وبيوع الأمانات والمرابحة والتولية والحطيطة، وتنظر أحكامه في مواضعها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8530}"
  en: "Capital (ra's al-mal) in the lexicon is the principal of money without profit or increase, the whole sum put into an enterprise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8530} The jurists mention it in zakat, partnership, mudaraba, salam, usury, loan, trust sales, murabaha, tawliya and hitta, and its rules are found in those places. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8530}"
  ur: "رأس المال لغت میں وہ اصل مال ہے جو نفع اور زیادتی کے بغیر ہو، اور وہ کل رقم جو کسی کام میں لگائی جائے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8530}"
