label:
  ar: "رأس المال ⁦(في الفقه)⁩"
  en: "Capital (ra's al-mal): the principal sum without profit"
  ur: "رأس المال ⁦(فقہی اصطلاح)⁩"
  es: "Capital (ra's al-mal): la suma principal sin ganancia"
  fr: "Capital (ra's al-mal): le capital initial sans profit"
  tr: "Sermaye (Hukuk Hukukunda)"
  id: "Modal (dalam Yurisprudensi)"
summary:
  ar: "رأس المال في اللغة أصل المال بلا ربح ولا زيادة، وهو جملة المال التي تستثمر في عمل ما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8530} ويذكر الفقهاء هذا المصطلح في الزكاة والشركة والمضاربة والسلم والربا والقرض وبيوع الأمانات والمرابحة والتولية والحطيطة، وتنظر أحكامه في مواضعها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8530}"
  en: "Capital (ra's al-mal) in the lexicon is the principal of money without profit or increase, the whole sum put into an enterprise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8530} The jurists mention it in zakat, partnership, mudaraba, salam, usury, loan, trust sales, murabaha, tawliya and hitta, and its rules are found in those places. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8530}"
  ur: "رأس المال لغت میں وہ اصل مال ہے جو نفع اور زیادتی کے بغیر ہو، اور وہ کل رقم جو کسی کام میں لگائی جائے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8530}"
  es: "El capital (ra's al-mal) en el léxico es el principal del dinero sin ganancias ni incrementos, la suma total invertida en una empresa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8530} Los juristas lo mencionan en zakat, sociedades, mudaraba, salam, usura, préstamos, ventas fiduciarias, murabaha, tawliya y hitta, y sus reglas se encuentran en esos textos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8530}"
  fr: "Le capital (ra's al-mal) désigne, dans le lexique, le principal d'argent sans profit ni accroissement, soit la somme totale investie dans une entreprise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8530} Les juristes l'évoquent dans les textes relatifs à la zakat, aux partenariats, à la mudaraba, au salam, à l'usure, aux prêts, aux ventes en fiducie, à la murabaha, à la tawliya et à la hitta, et ses règles s'y trouvent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8530}"
  tr: "Dilde sermaye, kâr veya artış olmadan para kaynağıdır ve belirli bir faaliyete yatırılan paranın toplamıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8530} Hukukçular bu terimi zekat, ortaklık, mudarabah, salam, tefecilik, krediler, vakıfların satışı, murabaha, vesayet ve hitta kelimelerinde kullanır ve kararları ilgili bağlamlarda incelenir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8530}"
  id: "Dalam bahasa, modal adalah sumber uang tanpa keuntungan atau peningkatan, dan merupakan jumlah uang yang diinvestasikan dalam suatu aktivitas tertentu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8530} Para ahli hukum menyebut istilah ini dalam zakat, partnership, mudarabah, salam, riba, pinjaman, penjualan trust, murabaha, trusteeship, dan hitta, dan putusan mereka diperiksa dalam konteks masing-masing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8530}"
