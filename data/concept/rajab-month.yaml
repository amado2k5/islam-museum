label:
  ar: "شهر رجب"
  en: "Rajab (the seventh month and one of the four sacred months)"
summary:
  ar: "رجب سابع شهور السنة وأحد الأشهر الحرم الأربعة، وهو شهر فرد لا تتصل حرمته بغيره. وكانت العرب تعظمه وتدع القتال فيه، ووقعت فيه عمرة القضاء، وروي عن الإسراء والمعراج فيه أقوال لم تثبت تفصيلا. {cite:athar-baqiya-thaqafa-2008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
  en: "Rajab is the seventh month and one of the four sacred months, a solitary sacred month not joined to others. The Arabs honoured it and laid down fighting in it; the 'umra of qada' fell in it, and reports place the night journey in it without settled detail. {cite:athar-baqiya-thaqafa-2008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
  ur: "رجب ساتواں مہینہ اور چار حرمت والے مہینوں میں سے ایک ہے، اور یہ اکیلا حرمت والا مہینہ ہے جس کی حرمت کسی اور مہینے سے ملی ہوئی نہیں۔ عرب اسے بڑا مانتے تھے اور اس میں قتال چھوڑ دیتے تھے؛ اس میں عمرۃ القضا ہوئی اور اسراء و معراج کے بارے میں بھی روایات ہیں مگر تفصیل ثابت نہیں۔ {cite:athar-baqiya-thaqafa-2008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
