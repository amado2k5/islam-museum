id: concept/action-by-quality
class: concept
kind: scientific
label: { ar: "الفعل بالكيفية عند ابن سينا", en: "Action by quality in the Canon", ur: "قانون میں کیفیت کے ذریعے عمل" }
summary:
  ar: "الفاعل بكيفيته عند ابن سينا هو ما من شأنه أن يتسخن أو يتبرد إذا حصل في بدن الإنسان، فيسخن بسخونته ويبرد ببرده من غير أن يتشبه بالبدن {cite:canon-ibn-sina-print-v1 p.131}. ويقول في الصفحة التالية إن الفاعل بالكيفية لا مدخل لمادته في الفعل {cite:canon-ibn-sina-print-v1 p.132}."
  en: "For Ibn Sina, what acts by its quality is that which, once in the human body, tends to grow hot or cold, so that it heats by its heat and cools by its cold without being assimilated to the body {cite:canon-ibn-sina-print-v1 p.131}. On the next page he adds that for what acts by quality, its matter has no part in the action {cite:canon-ibn-sina-print-v1 p.132}."
