label: { ar: "الحفيد", en: "The grandson (hafid)", ur: "حفید (پوتا / نواسہ)" }
summary:
  ar: "الحفيد في الاصطلاح ولد الولد، وهو من العصبات باتفاق الفقهاء، ينزل منزلة الابن للصلب عند فقده، ويعصب أخواته وبنات أعمامه اللاتي في درجته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7140} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7141} وابن البنت حفيد عند الحنابلة، وهو في الميراث من ذوي الأرحام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7141} والحفيدة بنت الابن تنزل منزلة البنت عند عدمها، وترث السدس مع بنت الصلب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7141} وفي دخول أولاد الأولاد في الوقف على الأولاد، يدخل أولاد البنين دون أولاد البنات عند الحنابلة وظاهر الرواية عند الحنفية، ويرى الشافعية أنهم لا يدخلون في الأصح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7141}"
  en: "In the jurists' usage the hafid is a son's son. He is an agnatic heir by agreement, and stands in the place of a son when there is none; he makes agnatic his sisters and paternal cousins in his degree. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7140} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7141} For the Hanbalis, a daughter's son is also a hafid, and he inherits among the kin by blood. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7141} A granddaughter takes the place of a daughter when none is left and takes a sixth with a daughter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7141} On whether grandchildren enter a bequest to ”the children”, the Hanbalis and the Hanafi favoured view include sons' children and not daughters' children; the Shafi'is in the sounder view exclude them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7141}"
