label: { ar: "الجزء المتوسط للسماء من سمت مطلع الكوكب", en: "The part at midheaven from the azimuth of a star's rising", ur: "طلوعِ ستارہ کی سمت سے وسط السماء کا جزء", es: "La parte en el centro del cielo desde el acimut de la salida de una estrella.", fr: "La partie située au milieu du ciel par rapport à l'azimut du lever d'une étoile", tr: "Gezegenin doğuş azimutundan gökyüzünün orta kısmı", id: "Bagian tengah langit dari azimut terbitnya planet" }
summary:
  ar: "بعد معرفة بعد الكوكب عن معدل النهار يعرف نصف قوس نهاره على الجهة المذكورة في معرفة نصف قوس نهار الكوكب. فإن كان على الأفق الشرقي زيد نصف قوس نهاره على أزمان مطالع الدرجة التي تطلع معه في الإقليم، وإن كان على الأفق الغربي نُقص نصف قوس نهاره من مطالع الجزء الذي يغيب معه، ثم قُوِّس الحاصل وأُدخل في مطالع الفلك المستقيم وأُخذ ما بإزائه من درج البروج، فهو الجزء الذي يتوسط السماء مع الكوكب. {cite:zij-sabi-nallino-byblion p.58}."
  en: "Once the star's distance from the equator is known, its half day arc is found in the way given for the half day arc of a star. If the star is on the eastern horizon its half day arc is added to the rising times of the degree rising with it in the clime; if on the western horizon its half day arc is taken from the rising times of the part with which it sets. The result is brought into the rising times of the right sphere, and the degree of the signs against it is the part that culminates with the star. {cite:zij-sabi-nallino-byblion p.58}."
  ur: "ستارے کا معدل النہار سے بعد معلوم ہو جائے تو اس کی نصف قوسِ نہار اسی طرح معلوم کی جاتی ہے جیسے ستارے کی نصف قوسِ نہار کے باب میں آیا۔ اگر ستارہ مشرقی افق پر ہو تو اس کی نصف قوسِ نہار اس درجے کے مطالع کے ازمان میں جمع کی جاتی ہے جو اقلیم میں اس کے ساتھ طلوع ہوتا ہے، اور مغربی افق پر ہو تو اس جزء کے مطالع میں سے گھٹائی جاتی ہے جس کے ساتھ وہ غروب ہوتا ہے؛ حاصل کو فلک مستقیم کے مطالع میں لایا جاتا ہے اور اس کے مقابل درجۂ بروج لیا جاتا ہے، وہی وہ جزء ہے جو ستارے کے ساتھ وسط السماء میں آتا ہے۔ {cite:zij-sabi-nallino-byblion p.58}۔"
  es: "Una vez conocida la distancia de la estrella al ecuador, se calcula su arco de medio día siguiendo el procedimiento establecido para el arco de medio día de una estrella. Si la estrella se encuentra en el horizonte oriental, su arco de medio día se suma a las horas de salida del grado que asciende con ella en el hemisferio; si se encuentra en el horizonte occidental, su arco de medio día se resta de las horas de salida de la parte con la que se pone. El resultado se traslada a las horas de salida de la esfera derecha, y el grado de los signos opuestos corresponde a la parte que culmina con la estrella. {cite:zij-sabi-nallino-byblion p.58}."
  fr: "Une fois la distance de l'étoile à l'équateur connue, son arc de demi-journée est calculé selon la méthode habituelle. Si l'étoile se trouve à l'horizon est, son arc de demi-journée est ajouté aux heures de lever du degré qui se lève avec elle dans le même climat; si elle se trouve à l'horizon ouest, son arc de demi-journée est soustrait des heures de lever de la partie du ciel avec laquelle elle se couche. Le résultat est ensuite reporté dans le système des heures de lever de la sphère droite, et le degré des signes opposés correspond à la partie qui culmine avec l'étoile. {cite:zij-sabi-nallino-byblion p.58}."
  tr: "Gezegenin ortalama güne olan uzaklığı belirlendikten sonra, gezegenin gününün yarım yayı, gezegenin gününün yarım yayını belirlemek için belirtilen yönde belirlenir. Eğer doğu ufkunda ise, yarım yayı, bölgede yükseldiği derecenin yükselme sürelerine eklenir. Eğer batı ufkunda ise, yarım yayı, battığı kısmın yükselme sürelerinden çıkarılır. Elde edilen yay daha sonra yuvarlanır ve sağ gök küresinin yükselme sürelerine yerleştirilir ve ekliptiğin karşılık gelen derecesi alınır. Bu, gökyüzü ile gezegen arasında ortada kalan kısımdır. {cite:zij-sabi-nallino-byblion s.58}."
  id: "Setelah menentukan jarak planet dari hari rata-rata, setengah busur harinya ditentukan dalam arah yang disebutkan untuk menentukan setengah busur hari sebuah planet. Jika berada di cakrawala timur, setengah busurnya ditambahkan ke waktu terbit derajat yang sama dengan saat planet tersebut terbit di wilayah tersebut. Jika berada di cakrawala barat, setengah busurnya dikurangi dari waktu terbit bagian yang sama dengan saat planet tersebut terbenam. Busur yang dihasilkan kemudian dibulatkan dan dimasukkan ke dalam waktu terbit bola langit kanan, dan derajat ekliptika yang sesuai diambil. Ini adalah bagian yang terletak di tengah antara langit dan planet. {cite:zij-sabi-nallino-byblion p.58}."
