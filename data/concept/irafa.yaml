label:
  ar: "العِرَافَة"
  en: "Fortune-telling by the 'arraf' (irafa)"
  ur: "عرافت"
summary:
  ar: "العرافة بالكسر لها معنيان: الأول عمل العراف، وهو من يدعي معرفة الأمور بمقدمات أسباب يستدل بها على مواقعها كمعرفة السارق ومكان الضالة، والثاني مصدر عرف القوم بمعنى تدبير أمرهم والقيام بسياستهم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11539}. والعرافة في الاصطلاح الفقهي حرام، لأن من أتى كاهناً أو عرافاً فصدقه فيما يقول فقد كفر، ومن سأله دون أن يصدقه لم تقبل صلاته أربعين ليلة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11540} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11541}. والفرق بينه وبين الكاهن أن العراف يخبر عن الغائب الماضي، والكاهن عن الماضي والمستقبل، والكهانة والسحر والتنجيم ألفاظ قريبة منه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11540}."
  en: "Irafa has two senses. The first is the trade of the 'arraf', who claims to know hidden matters by means of premises and signs, such as who stole an object or where a lost animal is. The second is the verbal noun of managing a people's affairs and governing them {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11539}. In the juristic sense, irafa is forbidden: whoever goes to a soothsayer (kahin) or an 'arraf' and believes what he says has disbelieved, and whoever only asks without believing him has his prayer withheld for forty nights {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11540} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11541}. The 'arraf' reports on past hidden matters, the kahin on past and future ones; kihana, sorcery and astrology are related terms {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11540}."
