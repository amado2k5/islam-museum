label:
  ar: "العِرَافَة"
  en: "Fortune-telling by the 'arraf' (irafa)"
  ur: "عرافت"
  es: "Adivinación por el 'arraf' (irafa)"
  fr: "La divination par l'« arraf » (irafa)"
summary:
  ar: "العرافة بالكسر لها معنيان: الأول عمل العراف، وهو من يدعي معرفة الأمور بمقدمات أسباب يستدل بها على مواقعها كمعرفة السارق ومكان الضالة، والثاني مصدر عرف القوم بمعنى تدبير أمرهم والقيام بسياستهم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11539}. والعرافة في الاصطلاح الفقهي حرام، لأن من أتى كاهناً أو عرافاً فصدقه فيما يقول فقد كفر، ومن سأله دون أن يصدقه لم تقبل صلاته أربعين ليلة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11540} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11541}. والفرق بينه وبين الكاهن أن العراف يخبر عن الغائب الماضي، والكاهن عن الماضي والمستقبل، والكهانة والسحر والتنجيم ألفاظ قريبة منه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11540}."
  en: "Irafa has two senses. The first is the trade of the 'arraf', who claims to know hidden matters by means of premises and signs, such as who stole an object or where a lost animal is. The second is the verbal noun of managing a people's affairs and governing them {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11539}. In the juristic sense, irafa is forbidden: whoever goes to a soothsayer (kahin) or an 'arraf' and believes what he says has disbelieved, and whoever only asks without believing him has his prayer withheld for forty nights {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11540} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11541}. The 'arraf' reports on past hidden matters, the kahin on past and future ones; kihana, sorcery and astrology are related terms {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11540}."
  es: "Irafa tiene dos sentidos. El primero es el oficio del 'arraf', quien afirma conocer asuntos ocultos por medio de premisas y señales, como quién robó un objeto o dónde está un animal perdido. El segundo es el sustantivo verbal de administrar los asuntos de un pueblo y gobernarlos {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11539}. En el sentido jurídico, irafa está prohibido: quien acude a un adivino (kahin) o a un 'arraf' y cree lo que dice ha incrédulo, y quien solo pregunta sin creerle tiene su oración retenida durante cuarenta noches {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11540} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11541}. El 'arraf' informa sobre asuntos ocultos pasados, el kahin sobre asuntos pasados y futuros; Kihana, hechicería y astrología son términos relacionados {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11540}."
  fr: "Le terme « irafa » a deux sens. Le premier désigne le métier de « devin », qui prétend connaître les choses cachées grâce à des indices et des signes, comme l'identité du voleur d'un objet ou l'emplacement d'un animal perdu. Le second est le nom verbal de la gestion et de la gouvernance des affaires d'un peuple {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11539}. Juridiquement, l'irafa est interdit: quiconque consulte un devin (kahin) ou un « arraf » et croit ce qu'il dit est considéré comme mécréant; et quiconque interroge sans croire en lui voit sa prière suspendue pendant quarante nuits {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11540} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11541}. Le « arraf » fait état de faits cachés du passé, le « kahin » de faits passés et futurs; kihana, sorcellerie et astrologie sont des termes apparentés {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11540}."
