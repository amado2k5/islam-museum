id: concept/istidlal-kulli-min-afal-al-dimagh
class: concept
kind: scientific
label:
  ar: "الاستدلال الكلي من أفعال الدماغ"
  en: "The general inference from the acts of the brain"
  ur: "دماغ کے افعال سے کلی استدلال"
  es: "La inferencia general a partir de los actos del cerebro"
summary:
  ar: "يقول ابن سينا إن الأفعال السليمة تدل على سلامة الدماغ والمؤفة على آفة فيه، وإن آفات الأفعال ثلاث: الضعف والتغير والتشوش ثم البطلان {cite:canon-ibn-sina-print-v2 p.11}"
  en: "Ibn Sina says that sound acts indicate a sound brain and afflicted acts an affliction in it, and that the afflictions of acts are three: weakness, change and confusion, then failure {cite:canon-ibn-sina-print-v2 p.11}"
  ur: "ابن سینا کہتا ہے کہ صحیح افعال دماغ کی سلامتی پر اور خراب افعال اس میں آفت پر دلالت کرتے ہیں، اور افعال کی آفتیں تین ہیں: ضعف، تغیر اور تشویش، پھر بطلان {cite:canon-ibn-sina-print-v2 p.11}۔"
  es: "Ibn Sina afirma que los actos sanos indican un cerebro sano y los actos afligidos una aflicción en él, y que las aflicciones de los actos son tres: debilidad, cambio y confusión, y luego fracaso {cite:canon-ibn-sina-print-v2 p.11}"
