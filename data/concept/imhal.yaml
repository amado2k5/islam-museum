id: concept/imhal
class: concept
kind: legal
label: { ar: "الإمهال", en: "Imhal (granting time or respite)" }
summary:
  ar: "الإمهال لغة الإنظار وتأخير الطلب، وينافي التعجيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3418} ومن أحكامه أن من ثبت إعساره ينظر إلى ميسره، لقوله تعالى في سورة البقرة (2:280). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3418}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3419} والعنين يضرب له القاضي سنة عند الجمهور، والمولي أربعة أشهر، ويمهل المدعي لإحضار بينته، ويمتنع الإمهال فيما تشترط فيه الفورية كخيار الرد بالعيب والشفعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3418}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3419}"
  en: "Imhal in the lexical sense is granting delay and postponing a demand; it is the opposite of hastening. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3418} One whose poverty is proven must be given time until he is able to pay, citing the Quranic verse in al-Baqara (2:280). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3418}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3419} A man impotent with his wife is given a year by most jurists, the one who swore off intercourse four months, and a claimant is given time to bring his proof, while respite is refused where immediacy is required, such as the option to return a defective sale or pre-emption. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3418}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3419}"
