id: concept/imhal
class: concept
kind: legal
label: { ar: "الإمهال", en: "Imhal (granting time or respite)", es: "Imhal (que concede tiempo o respiro)", fr: "Imhal (qui accorde du temps ou un répit)" }
summary:
  ar: "الإمهال لغة الإنظار وتأخير الطلب، وينافي التعجيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3418} ومن أحكامه أن من ثبت إعساره ينظر إلى ميسره، لقوله تعالى في سورة البقرة (2:280). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3418}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3419} والعنين يضرب له القاضي سنة عند الجمهور، والمولي أربعة أشهر، ويمهل المدعي لإحضار بينته، ويمتنع الإمهال فيما تشترط فيه الفورية كخيار الرد بالعيب والشفعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3418}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3419}"
  en: "Imhal in the lexical sense is granting delay and postponing a demand; it is the opposite of hastening. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3418} One whose poverty is proven must be given time until he is able to pay, citing the Quranic verse in al-Baqara (2:280). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3418}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3419} A man impotent with his wife is given a year by most jurists, the one who swore off intercourse four months, and a claimant is given time to bring his proof, while respite is refused where immediacy is required, such as the option to return a defective sale or pre-emption. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3418}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3419}"
  es: "Imhal en el sentido léxico es conceder demora y posponer una demanda; es lo opuesto a apresurar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3418} A quien se le demuestra pobreza se le debe dar tiempo hasta que pueda pagar, citando el versículo coránico en al-Baqara (2:280). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3418}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3419} A un hombre impotente con su esposa se le da un año por la mayoría de los juristas, a quien juró abstenerse de relaciones sexuales cuatro meses, y a un reclamante se le da tiempo para presentar su prueba, mientras que se niega el aplazamiento cuando se requiere inmediatez, como la opción de devolver una venta defectuosa o el derecho de tanteo. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3418}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3419}"
  fr: "Le terme « imhal », au sens littéral, signifie accorder un délai et reporter une demande; il est l’opposé de « se hâter ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3418} Celui dont la pauvreté est avérée doit se voir accorder un délai jusqu’à ce qu’il soit en mesure de payer, conformément au verset coranique cité dans al-Baqara (2:280). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3418}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3419} La plupart des juristes accordent un an à un homme impuissant avec sa femme, quatre mois à celui qui a fait vœu de chasteté, et un demandeur dispose de temps pour apporter ses preuves. En revanche, le sursis est refusé lorsque l’immédiateté est requise, comme dans le cas d’une option de retour d’un bien défectueux ou d’un droit de préemption. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3418}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3419}"
