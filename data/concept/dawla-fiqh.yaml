label:
  ar: "الدولة ⁦(في الفقه والسياسة الشرعية)⁩"
  en: "The state (in fiqh and siyasa shar'iyya)"
  ur: "ریاست ⁦(فقہ اور سیاستِ شرعیہ میں)⁩"
  es: "El estado (en fiqh y siyasa shar'iyya)"
  fr: "L'État (en fiqh et siyasa shar'iyya)"
  tr: "Devlet (Fıkıh ve Şeriat Siyasetinde)"
  id: "Negara (dalam Hukum dan Politik Syariah)"
summary:
  ar: "الدولة في الفقه تقوم على ثلاثة أركان هي الدار والرعية والمنعة ⁦(السيادة)⁩، وتتألف من ولايات متعددة يتولاها الإمام الأعظم بالنيابة عن الأمة، ومنها ولاية العهد وأهل الحل والعقد والمحتسب والقضاء وبيت المال والوزارة وإمارة الحرب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8245} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8246} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8247} وذهب جمهور الفقهاء إلى أنه لا يجوز أن يكون في العالم إمامان في وقت واحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8250}"
  en: "In fiqh the state rests on three pillars: the territory, the subjects (Muslims and protected non-Muslims), and sovereignty. It is made of several offices, and the supreme imam holds them as the nation's agent: the heir apparent, the people of loosening and binding, the muhtasib, the judiciary, the public treasury, the viziers and the military command. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8245} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8246} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8247} The majority hold that two imams may not hold office at one time. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8250}"
  ur: "فقہ میں ریاست تین ارکان پر قائم ہے: علاقہ، رعیت ⁦(مسلمان اور ذمی)⁩ اور اقتدار۔ اس کے امام اعظم کے ماتحت مختلف مناصب ہیں، اور جمہور کے نزدیک ایک وقت میں دو امام نہیں ہو سکتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8245} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8250}"
  es: "En el fiqh, el Estado se sustenta en tres pilares: el territorio, los súbditos (musulmanes y no musulmanes protegidos) y la soberanía. Está compuesto por varios cargos, que el imán supremo ostenta como representante de la nación: el heredero aparente, el encargado de la restitución y la imposición, el muhtasib, el poder judicial, el tesoro público, los visires y el mando militar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8245} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8246} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8247} La mayoría sostiene que dos imanes no pueden ocupar un cargo simultáneamente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8250}"
  fr: "En droit islamique (fiqh), l'État repose sur trois piliers: le territoire, les sujets (musulmans et non-musulmans protégés) et la souveraineté. Il est composé de plusieurs offices, détenus par l'imam suprême en tant qu'agent de la nation: l'héritier présomptif, les autorités chargées de lier et de délier les liens, les muhtasib, le pouvoir judiciaire, le trésor public, les vizirs et le commandement militaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8245} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8246} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8247} La majorité considère que deux imams ne peuvent exercer simultanément leurs fonctions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8250}"
  tr: "Fıkıhta devlet üç sütuna dayanır: ev, teba ve otorite (egemenlik). Ulus adına Büyük İmam tarafından tutulan birden fazla eyaletten oluşur; bunlar arasında Veliaht Prens, Yetkili Kişiler, Sözleşme, Muhtasib, Yargı, Kamu Hazinesi, Vezir ve Savaş Emirliği bulunur. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.8245} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8246} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8247} Hukukçuların çoğunluğu, dünyada aynı anda iki imamın var olmasının izin verilmediğini savunmuştur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8250}"
  id: "Dalam bidang hukum, negara didasarkan pada tiga pilar: rumah, subjek, dan otoritas (kedaulatan). Negara terdiri dari beberapa provinsi yang dipegang oleh Imam Agung atas nama bangsa, termasuk Putra Mahkota, Rakyat Otoritas, Kontrak, Muhtasib, Yudikatif, Perbendaharaan Publik, Wazir, dan Emirat Perang. {cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 hlm.8245} {cite:Fiqh-Mawsua-Kuwaitiyya-noor-v3 hlm.8246} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8247} Mayoritas ahli hukum berpendapat bahwa tidak diperbolehkan dua imam berada di dunia secara bersamaan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8250}"
