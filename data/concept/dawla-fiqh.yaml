label:
  ar: "الدولة (في الفقه والسياسة الشرعية)"
  en: "The state (in fiqh and siyasa shar'iyya)"
  ur: "ریاست (فقہ اور سیاستِ شرعیہ میں)"
summary:
  ar: "الدولة في الفقه تقوم على ثلاثة أركان هي الدار والرعية والمنعة (السيادة)، وتتألف من ولايات متعددة يتولاها الإمام الأعظم بالنيابة عن الأمة، ومنها ولاية العهد وأهل الحل والعقد والمحتسب والقضاء وبيت المال والوزارة وإمارة الحرب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8245} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8246} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8247} وذهب جمهور الفقهاء إلى أنه لا يجوز أن يكون في العالم إمامان في وقت واحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8250}"
  en: "In fiqh the state rests on three pillars: the territory, the subjects (Muslims and protected non-Muslims), and sovereignty. It is made of several offices, and the supreme imam holds them as the nation's agent: the heir apparent, the people of loosening and binding, the muhtasib, the judiciary, the public treasury, the viziers and the military command. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8245} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8246} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8247} The majority hold that two imams may not hold office at one time. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8250}"
  ur: "فقہ میں ریاست تین ارکان پر قائم ہے: علاقہ، رعیت (مسلمان اور ذمی) اور اقتدار۔ اس کے امام اعظم کے ماتحت مختلف مناصب ہیں، اور جمہور کے نزدیک ایک وقت میں دو امام نہیں ہو سکتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8245} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8250}"
