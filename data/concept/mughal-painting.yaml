label: { ar: "التصوير المغولي", en: "Mughal painting", ur: "مغل مصوری", es: "Pintura mogol", fr: "Peinture moghole" }
summary:
  ar: "مدرسة التصوير في بلاط الأباطرة المغول بالهند، تشكلت في عهد أكبر من عناصر صفوية وهندية، وبلغت بين نحو 1600 و1660 ذروة الطبيعية والبورتريه في عهدي جهانگير وشاه جهان {cite:beach-grand-mogul-1978 p. 16} {cite:beach-grand-mogul-1978 p. 18}."
  en: "The painting of the Mughal imperial court in India, formed under Akbar from Safavid and Indian elements, which between about 1600 and 1660, under Jahangir and Shah Jahan, reached its height of naturalism and portraiture {cite:beach-grand-mogul-1978 p. 16} {cite:beach-grand-mogul-1978 p. 18}."
  ur: "ہندوستان میں مغل شاہی دربار کی مصوری، جو اکبر کے دور میں صفوی اور ہندوستانی عناصر سے بنی اور تقریباً 1600 سے 1660 تک جہانگیر و شاہ جہان کے دور میں فطرت نگاری اور شبیہ نگاری کے عروج پر پہنچی {cite:beach-grand-mogul-1978 p. 16} {cite:beach-grand-mogul-1978 p. 18}۔"
  es: "La pintura de la corte imperial mogol en la India, formada bajo Akbar a partir de elementos safávidas e indios, que entre aproximadamente 1600 y 1660, bajo Jahangir y Shah Jahan, alcanzó su apogeo de naturalismo y retrato {cite:beach-grand-mogul-1978 p. 16} {cite:beach-grand-mogul-1978 p. 18}."
  fr: "La peinture de la cour impériale moghole en Inde, formée sous Akbar à partir d'éléments safavides et indiens, qui entre environ 1600 et 1660, sous Jahangir et Shah Jahan, a atteint son apogée en matière de naturalisme et de portrait {cite:beach-grand-mogul-1978 p. 16} {cite:beach-grand-mogul-1978 p. 18}."
