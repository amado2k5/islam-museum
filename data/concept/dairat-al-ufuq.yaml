id: concept/dairat-al-ufuq
class: concept
kind: scientific
label: { ar: "دائرة الأفق", en: "The horizon circle", es: "El círculo del horizonte", fr: "Le cercle de l'horizon", ur: "افق کا دائرہ" }
summary:
  ar: "دائرة الأفق هي الدائرة التي تفصل بين ما يظهر من السماء فوق الأرض وما يخفى منها تحت الأرض، قطبها على سمت الرأس، وهي من الدوائر العظام التي تنصّف السماء. ومن خصائصها عند الفرغاني أنها لا تنصّف إلا معدل النهار من دوائر الموازية له، أما سائر الدوائر الموازية فتنقسم بقسمين غير متساويين {cite:farghani-elements-astronomy p. 110}{cite:farghani-elements-astronomy p. 154}."
  en: "The horizon circle divides the visible sky from the hidden sky, its pole at the zenith; al-Farghani notes that it bisects only the equinoctial circle among the parallels, and cuts every other parallel unequally {cite:farghani-elements-astronomy p. 110}{cite:farghani-elements-astronomy p. 154}."
  es: "El círculo del horizonte divide el cielo visible del cielo oculto, con su polo en el cenit; al-Farghani observa que solo biseca el círculo equinoccial entre los paralelos, y corta todos los demás paralelos de manera desigual {cite:farghani-elements-astronomy p. 110}{cite:farghani-elements-astronomy p. 154}."
  fr: "Le cercle de l'horizon sépare le ciel visible du ciel caché, son pôle étant au zénith; al-Farghani note qu'il ne divise en deux que le cercle équinoxial parmi les parallèles, et coupe tous les autres parallèles de manière inégale {cite:farghani-elements-astronomy p. 110}{cite:farghani-elements-astronomy p. 154}."
  ur: "افق کا دائرہ نظر آنے والے آسمان کو پوشیدہ آسمان سے تقسیم کرتا ہے، اس کا قطب زینت پر ہے۔ الفرغانی نوٹ کرتا ہے کہ یہ متوازی کے درمیان صرف مساوی دائرے کو تقسیم کرتا ہے، اور ہر دوسرے متوازی کو غیر مساوی طور پر کاٹتا ہے۔ 110}{حوالہ:فرغانی-عناصر-فلکیات صفحہ۔ 154}۔"
