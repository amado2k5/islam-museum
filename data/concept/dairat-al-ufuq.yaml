summary:
  ar: "دائرة الأفق هي الدائرة التي تفصل بين ما يظهر من السماء فوق الأرض وما يخفى منها تحت الأرض، قطبها على سمت الرأس، وهي من الدوائر العظام التي تنصّف السماء. ومن خصائصها عند الفرغاني أنها لا تنصّف إلا معدل النهار من دوائر الموازية له، أما سائر الدوائر الموازية فتنقسم بقسمين غير متساويين {cite:farghani-elements-astronomy p. 110}{cite:farghani-elements-astronomy p. 154}."
  en: "The horizon circle divides the visible sky from the hidden sky, its pole at the zenith; al-Farghani notes that it bisects only the equinoctial circle among the parallels, and cuts every other parallel unequally {cite:farghani-elements-astronomy p. 110}{cite:farghani-elements-astronomy p. 154}."
