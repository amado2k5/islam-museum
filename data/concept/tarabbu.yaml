summary:
  ar: "التربع ضرب من الجلوس، وهو أن يقعد على وركيه ويمد ركبته اليمنى إلى جانب يمينه وقدمه إلى جانب يساره. وفي الصلاة يجوز للمعذور الذي لا يطيق القيام، وفي الفريضة بغير عذر مكروه عند الحنفية، ومخالف للهيئة المشروعة عند الجمهور. وفي التطوع يجوز الجلوس مع القدرة على القيام، والقيام أفضل. ويجوز قراءة القرآن في أي حال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4930} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4933}"
  en: "Tarabbu is a way of sitting: one sits on the hips, stretches the right knee to the right and the right foot to the left. In prayer it is allowed for one who cannot stand; in an obligatory prayer without excuse the Hanafis call it disliked, and most jurists hold it departs from the required posture. In a voluntary prayer, sitting is allowed while one can stand, though standing is better. Reciting the Qur'an is allowed in any position. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4930} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4933}"
  es: "Tarabbu es una forma de sentarse: uno se sienta sobre las caderas, estira la rodilla derecha hacia la derecha y el pie derecho hacia la izquierda. En la oración, está permitido para quien no puede permanecer de pie; en una oración obligatoria sin excusa, los hanafíes la consideran desaconsejable, y la mayoría de los juristas sostienen que se aparta de la postura requerida. En una oración voluntaria, se permite sentarse mientras se pueda permanecer de pie, aunque estar de pie es mejor. Se permite recitar el Corán en cualquier posición. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4930} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4933}"
  fr: "Le tarabou est une position assise: on s’assoit sur les hanches, le genou droit tourné vers la droite et le pied droit vers la gauche. Cette position est permise pour la prière à celui qui ne peut se tenir debout; lors d’une prière obligatoire sans excuse valable, les hanafites la déconseillent, et la plupart des juristes estiment qu’elle s’écarte de la posture requise. Lors d’une prière surérogatoire, la position assise est permise même si l’on peut se tenir debout, bien que la position debout soit préférable. La récitation du Coran est permise dans n’importe quelle position."
