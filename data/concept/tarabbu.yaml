  en: "Tarabbu (sitting cross-legged in prayer)"
  ur: "تربّع (پالتی مار کر بیٹھنا)"
summary:
  ar: "التربع ضرب من الجلوس، وهو أن يقعد على وركيه ويمد ركبته اليمنى إلى جانب يمينه وقدمه إلى جانب يساره. وفي الصلاة يجوز للمعذور الذي لا يطيق القيام، وفي الفريضة بغير عذر مكروه عند الحنفية، ومخالف للهيئة المشروعة عند الجمهور. وفي التطوع يجوز الجلوس مع القدرة على القيام، والقيام أفضل. ويجوز قراءة القرآن في أي حال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4930} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4933}"
  en: "Tarabbu is a way of sitting: one sits on the hips, stretches the right knee to the right and the right foot to the left. In prayer it is allowed for one who cannot stand; in an obligatory prayer without excuse the Hanafis call it disliked, and most jurists hold it departs from the required posture. In a voluntary prayer, sitting is allowed while one can stand, though standing is better. Reciting the Qur'an is allowed in any position. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4930} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4933}"
