id: concept/istidlal-min-intifad-al-fudul-wa-al-shaar
class: concept
kind: scientific
label:
  ar: "الاستدلال من انتفاض الفضول والشعر وما يظهر على الرأس"
  en: "Inference from the superfluities expelled, the hair and what shows on the head"
  ur: "خارج ہونے والے فضلات، بال اور سر پر ظاہر ہونے والی چیزوں سے استدلال"
  es: "Inferencia a partir de las superfluidades expulsadas, el cabello y lo que se ve en la cabeza."
  fr: "Déduction à partir des éléments superflus expulsés, des cheveux et de ce qui apparaît sur la tête"
  tr: "Merak ve şiir patlamasından ve kafada görünenlerden çıkarım"
  id: "Inferensi dari ledakan rasa ingin tahu dan puisi serta apa yang tertera di kepala"
summary:
  ar: "يذكر ابن سينا كيف يدل كثرة ما ينتفض من الحنك والأنف والأذن أو قلته مع الثقل والوخز، ولونه وطعمه ورائحته، على نوع المادة: صفراء أو دم أو بلغم أو سوداء {cite:canon-ibn-sina-print-v2 pp.15-16}"
  en: "Ibn Sina shows how the amount of what is expelled from the palate, nose and ear, its scarcity with heaviness and pricking, and its colour, taste and smell point to the kind of matter: yellow bile, blood, phlegm or black bile {cite:canon-ibn-sina-print-v2 pp.15-16}"
  ur: "ابن سینا بتاتا ہے کہ تالو، ناک اور کان سے خارج ہونے والی چیز کی کثرت، یا اس کی کمی کے ساتھ بھاری پن اور چبھن، اور اس کا رنگ، ذائقہ اور بو مادے کی قسم پر کیسے دلالت کرتے ہیں: صفرا، خون، بلغم یا سودا {cite:canon-ibn-sina-print-v2 pp.15-16}۔"
  es: "Ibn Sina muestra cómo la cantidad de lo que se expulsa del paladar, la nariz y el oído, su escasez con pesadez y picazón, y su color, sabor y olor apuntan al tipo de materia: bilis amarilla, sangre, flema o bilis negra {cite:canon-ibn-sina-print-v2 pp.15-16}"
  fr: "Ibn Sina montre comment la quantité de ce qui est expulsé du palais, du nez et de l'oreille, sa rareté associée à une sensation de lourdeur et de picotement, ainsi que sa couleur, son goût et son odeur indiquent la nature de la substance: bile jaune, sang, phlegme ou bile noire {cite:canon-ibn-sina-print-v2 pp.15-16}"
  tr: "İbn Sina, damak, burun ve kulaktan karıştırılan şeyin bolluğu veya azlığının, rengi, tadı ve kokusunun madde türünü gösterdiğini belirtir: sarı, kan, balgam veya siyah {cite:canon-ibn-sina-print-v2 s.15-16}"
  id: "Ibn Sina menyebutkan bagaimana kelimpahan atau kelangkaan apa yang diaduk dari langit-langit, hidung, dan telinga dengan berat dan kesemutan, serta warna, rasa, dan baunya, menunjukkan jenis zat: kuning, darah, dahak, atau hitam {cite:canon-ibn-sina-print-v2 hlm.15-16}"
