class: concept
kind: scientific
label: { ar: "النصف العالي والنصف المخفض من فلك البروج", en: "The raised and the lowered halves of the zodiac", ur: "فلکِ البروج کا عالی اور مخفض نصف", es: "Las mitades elevada y bajada del zodíaco", fr: "Les moitiés levée et abaissée du zodiaque", tr: "Zodyakın üst ve alt yarısı", id: "Bagian atas dan bawah zodiak" }
summary:
  ar: "تُسمّى الأجزاء التي تقع وتطالع بعضها بعضاً المخفضة والعالية، فالأجزاء التي في النصف الجنوبي من أول الميزان إلى آخر الحوت تسمى المخفضة، والأجزاء التي في النصف الشمالي من أول الحمل إلى آخر السنبلة تسمى العالية، وذلك أن مقدار زيادة النهار في الأجزاء الشمالية هو مقدار نظيره في الجنوبية. {cite:zij-sabi-nallino-byblion pp.199-200}"
  en: "The parts that fall opposite to one another are called raised and lowered. The parts of the southern half, from the beginning of Libra to the end of Pisces, are called the lowered; the parts of the northern half, from the beginning of Aries to the end of Virgo, are called the raised. The growth of the day in the northern parts equals that of their opposite parts. {cite:zij-sabi-nallino-byblion pp.199-200}"
  ur: "جو اجزا ایک دوسرے کے مقابل آتے ہیں انہیں عالیہ اور مخفضہ کہا جاتا ہے۔ جنوبی نصف کے اجزا، میزان کے آغاز سے حوت کے آخر تک، مخفضہ کہلاتے ہیں؛ اور شمالی نصف کے اجزا، حمل کے آغاز سے سنبلہ کے آخر تک، عالیہ کہلاتے ہیں۔ شمالی اجزا میں دن کی زیادتی ان کے مقابل جنوبی اجزا کے برابر ہے۔ {cite:zij-sabi-nallino-byblion pp.199-200}"
  es: "Las partes opuestas entre sí se denominan elevadas y descendidas. Las partes de la mitad sur, desde el inicio de Libra hasta el final de Piscis, se denominan descendidas; las partes de la mitad norte, desde el inicio de Aries hasta el final de Virgo, se denominan elevadas. El crecimiento del día en las partes del norte es igual al de sus partes opuestas. {cite:zij-sabi-nallino-byblion pp.199-200}"
  fr: "Les parties opposées du ciel sont dites « haussées » et « abaissées ». Celles de la moitié sud, du début de la Balance à la fin des Poissons, sont dites « abaissées »; celles de la moitié nord, du début du Bélier à la fin de la Vierge, sont dites « haussées ». La durée du jour est la même dans les parties nord que dans leurs parties opposées. {cite:zij-sabi-nallino-byblion pp.199-200}"
  tr: "Birbirinin karşısında yer alan bölgelere alçak ve yüksek bölgeler denir. Güney yarımkürede, Terazi burcunun başlangıcından Balık burcunun sonuna kadar olan bölgelere alçak bölgeler, kuzey yarımkürede, Koç burcunun başlangıcından Başak burcunun sonuna kadar olan bölgelere ise yüksek bölgeler denir. Bunun nedeni, kuzey bölgelerindeki gün uzunluğunun güney bölgelerindekiyle aynı olmasıdır. {cite:zij-sabi-nallino-byblion pp.199-200}"
  id: "Bagian yang terletak berlawanan satu sama lain disebut rendah dan tinggi. Bagian di belahan bumi selatan, dari awal Libra hingga akhir Pisces, disebut rendah, dan bagian di belahan bumi utara, dari awal Aries hingga akhir Virgo, disebut tinggi. Ini karena panjang hari di bagian utara sama dengan di bagian selatan. {cite:zij-sabi-nallino-byblion pp.199-200}"
