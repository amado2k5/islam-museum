id: concept/alaniya
class: concept
kind: ethical
label:
  ar: "العَلانِيَة"
  en: "Openness as against secrecy in acts of worship, charity and public notice (alaniya)"
  ur: "علانیہ (کھلے عام ہونا)"
summary:
  ar: "العلانية في اللغة من الإعلان وإظهار الشيء، وهي ضد السر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11788}. والجهر أخص من العلانية، والسر الحديث المكتوم في النفس {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11788} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11789}. وتنقسم الطاعات باعتبار الإعلان والإسرار، فمنها ما شرعت فيه العلانية كالأذان والخطبة والجهاد والأمر بالمعروف، ومنها ما يكون إسراره خيراً كإسرار القراءة في الصلاة السرية، ومنها ما يخفى تارة ويظهر أخرى كالصدقة، فالفريضة يستحب إعلانها إن أمن الرياء ليقتدى به، والنافلة إخفاؤها أفضل عند خوف الرياء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11788} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11789} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11790}. ويجب إعلان جرح الرواة والشهود وأمناء الصدقات والأوقاف إذا قدح ذلك في أهليتهم، وليس من الغيبة المحرمة عند العلماء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11789}. ويندب للحاكم أن يعلن حجر المحجور عليه للفلس ويشهد عليه، وفي قول عند الشافعية أن ذلك واجب {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11790}."
  en: "In the lexicon, alaniya comes from proclaiming and showing a thing, and is the opposite of secrecy {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11788}. Public voice (jahr) is narrower than openness, and secrecy is what is hidden in the heart {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11788} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11789}. Acts of worship divide by openness: some are prescribed to be public, such as the call to prayer, the sermon, jihad and enjoining good; some are better kept private, such as reciting silently in the silent prayer; and some may be either, such as charity. An obligatory alms-giving is better shown when there is no fear of showing off, so that others may follow it, while a voluntary gift is better hidden where display is feared {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11788} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11789} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11790}. The faults of narrators, witnesses and those entrusted with charities and endowments must be made public when they affect their fitness, and the scholars hold this is not forbidden backbiting {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11789}. The judge is recommended to proclaim the restraint of a bankrupt and to call witnesses to it, and one Shafi'i view makes it obligatory {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11790}."
