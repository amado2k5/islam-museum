summary:
  ar: "غافت في الكتاب من الحشائش الشائكة، وله ورق كورق الشهدانج أو ورق القنطافلون، وزهره كالنيلوفر وهو المستعمل أو عصارته، وتعليق المحقق أنه شجرة البراغيث؛ حار في الأولى يابس في الثانية، لطيف قطاع جلاء، جيد في ابتداء داء الثعلب وداء الحية، نافع من الجرب والحكة وأوجاع الكبد وسدده وصلابة الطحال وأورام الكبد والمعدة ومن الحميات المزمنة {cite:canon-ibn-sina-print-v1 p.725}"
  en: "Ghafit is in the book one of the thorny herbs, with a leaf like the leaf of shahdanaj or the leaf of qantaflun and a flower like the water lily, which is what is used, or its sap, and the editor's note says it is the flea tree (shajarat al-baraghith); hot in the first degree and dry in the second, subtle, cutting and cleansing, good at the beginning of da' al-tha'lab and da' al-hayya, and beneficial for scab and itch, pains and obstructions of the liver, hardness of the spleen, swellings of the liver and stomach, and long-standing fevers {cite:canon-ibn-sina-print-v1 p.725}"
  ur: "غافت کتاب میں کانٹے دار بوٹیوں میں سے ہے، اس کا پتا شہدانج کے پتے یا قنطافلون کے پتے جیسا ہے اور پھول نیلوفر جیسا، اور یہی استعمال ہوتا ہے یا اس کا رس، اور محقق کا حاشیہ کہتا ہے کہ یہ شجرۃ البراغیث ہے؛ پہلے درجے میں گرم اور دوسرے میں خشک، لطیف، کاٹنے والا اور جلا دینے والا، داء الثعلب اور داء الحیہ کے آغاز میں اچھا، اور جرب، خارش، جگر کے دردوں اور رکاوٹوں، تلی کی سختی، جگر اور معدے کے ورموں اور پرانے بخاروں میں نافع {cite:canon-ibn-sina-print-v1 p.725}۔"
  es: "Ghafit es en el libro una de las hierbas espinosas, con una hoja como la de shahdanaj o la de qantaflun y una flor como la del nenúfar, que es lo que se usa, o su savia, y la nota del editor dice que es el árbol de las pulgas (shajarat al-baraghith); caliente en el primer grado y seco en el segundo, sutil, cortante y depurativo, bueno al comienzo de da' al-tha'lab y da' al-hayya, y beneficioso para la sarna y el picor, dolores y obstrucciones del hígado, dureza del bazo, hinchazón del hígado y del estómago, y fiebres prolongadas {cite:canon-ibn-sina-print-v1 p.725}"
  fr: "Le ghafit figure dans le livre parmi les herbes épineuses, avec une feuille semblable à celle du shahdanaj ou du qantaflun et une fleur semblable à celle du nénuphar, dont on utilise la sève. La note de l'éditeur précise qu'il s'agit de l'arbre à puces (shajarat al-baraghith); chaud au premier degré et sec au second, subtil, tranchant et purifiant, bon au début de da' al-tha'lab et da' al-hayya, et bénéfique contre la croûte et les démangeaisons, les douleurs et les obstructions du foie, la dureté de la rate, les gonflements du foie et de l'estomac, et les fièvres persistantes. {cite:canon-ibn-sina-print-v1 p.725}"
