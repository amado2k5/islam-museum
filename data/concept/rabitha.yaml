summary:
  ar: "الربيثا في الكتاب قال ابن ماسويه إنها أسخن من الروبيان، وهي نافعة للمعدة تجفف رطوباتها، ولا سيما إذا أكلت مع السذاب والشونيز والكرفس والزيت، ويذكر الكتاب نقلا موسوما أنها عون على الباه {cite:canon-ibn-sina-print-v1 p.669}"
  en: "Rabitha is in the book, Ibn Masawayh said, hotter than the rubyan; it is beneficial for the stomach and dries its moistures, above all when it is eaten with rue, nigella, celery and oil; and the book lists, as a labelled report, that it is a help to desire {cite:canon-ibn-sina-print-v1 p.669}"
  ur: "ربیثا کتاب میں ہے؛ ابن ماسویہ نے کہا کہ یہ روبیان سے زیادہ گرم ہے، اور معدے کے لیے نافع ہے، اس کی رطوبتوں کو خشک کرتی ہے، خاص طور پر جب سداب، شونیز، اجوائن اور تیل کے ساتھ کھائی جائے؛ اور کتاب منقول فہرست کے طور پر درج کرتی ہے کہ یہ باہ میں مددگار ہے {cite:canon-ibn-sina-print-v1 p.669}۔"
