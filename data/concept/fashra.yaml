summary:
  ar: "الفاشرا في الكتاب كما قال قوم هو الهزارجشان وهو الكرمة البيضاء، حار يابس إلى الثالثة، حاد حريف يجلو ويجفف ويلطف، ينفع أصله ضمادا للبثور والثآليل والقروح الرديئة والطحال ويذكر الكتاب فيه أفعالا في الرحم والجنين {cite:canon-ibn-sina-print-v1 pp.627-628}"
  en: "Fashra is in the book, as some said, hazarjashan, the white vine; hot and dry to the third degree, sharp and pungent, cleansing, drying and attenuating; its root is used as a poultice on pustules, warts, bad ulcers and the spleen, and the book lists in it actions on the womb and the foetus {cite:canon-ibn-sina-print-v1 pp.627-628}"
  ur: "فاشرا کتاب میں، جیسا کچھ لوگوں نے کہا، ہزارجشان یعنی سفید بیل ہے؛ تیسرے درجے تک گرم خشک، تیز اور چرپرا، جلاء، خشکی اور لطافت دینے والی؛ اس کی جڑ پھنسیوں، مسوں، بُرے زخموں اور تلی پر ضماد کے طور پر آتی ہے، اور کتاب اس میں رحم اور جنین پر اثرات بھی بتاتی ہے {cite:canon-ibn-sina-print-v1 pp.627-628}۔"
  es: "En el libro se menciona, según algunos, a Fashra, la vid blanca; caliente y seca hasta el tercer grado, punzante y astringente, limpiadora, secante y atenuante; su raíz se usa como cataplasma para pústulas, verrugas, úlceras graves y el bazo, y el libro enumera en ella sus efectos sobre el útero y el feto {cite:canon-ibn-sina-print-v1 pp.627-628}."
