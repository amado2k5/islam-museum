label:
  ar: "قوانين كلية في معالجات العين"
  en: "General canons for treating the eye"
  ur: "آنکھ کے علاج کے کلی قوانین"
  es: "Cánones generales para el tratamiento del ojo"
  fr: "Principes généraux du traitement de l'œil"
summary:
  ar: "معالجات العين مقابلة لأمراضها: استفراغ المواد إما صرفاً عنها من البدن ثم الدماغ ثم النقل من طريق الأنف والعروق القريبة وإما تحليباً منها بالأدوية المدمعة، وتبديل المزاج بالأدوية الخاصية، وإصلاح الهيئة كما في الجحوظ، وعلاج تفرق الاتصال بما له تجفيف بعيد من اللذع، مع تقليل الغذاء واجتناب المبخر وسوء الهضم {cite:canon-ibn-sina-print-v2 p.164} {cite:canon-ibn-sina-print-v2 p.165}"
  en: "The eye's treatments answer its diseases: evacuating the matters either by turning them away — from the body first, then the brain, then diverting them by way of the nose and the veins near the eye — or by milking them out with tear-drawing drugs; changing the temper with propriety drugs; mending the shape as in protrusion; and treating the solution of continuity with what dries without biting — all with reducing food and shunning the vaporous and the ill-digested {cite:canon-ibn-sina-print-v2 p.164} {cite:canon-ibn-sina-print-v2 p.165}"
  ur: "آنکھ کے علاج اس کے امراض کے مطابق ہیں: مادوں کا استفراغ یا تو انھیں موڑ کر — پہلے بدن سے، پھر دماغ سے، پھر ناک اور آنکھ کے قریبی رگوں کے راستے منتقل کر کے — یا آنسو لانے والی ادویہ سے انھیں دھو نکال کر؛ خاصیت والی ادویہ سے مزاج بدلنا؛ شکل کی اصلاح جیسے جحوظ میں؛ اور تفرق الاتصال کا علاج ایسے سے جو خشک کرے مگر چبھن سے دور ہو — یہ سب غذا کم کرنے، مبخر اور سوء ہضم سے بچنے کے ساتھ {cite:canon-ibn-sina-print-v2 p.164} {cite:canon-ibn-sina-print-v2 p.165}"
  es: "Los tratamientos para el ojo responden a sus enfermedades: evacuar las sustancias desviándolas —primero del cuerpo, luego del cerebro, y después desviándolas por la nariz y las venas cercanas al ojo— o extrayéndolas con fármacos que provocan lágrimas; cambiar el estado con medicamentos que favorecen la visión; corregir la forma, como en el caso de la protrusión; y tratar la solución de continuidad con lo que seca sin irritar —todo ello reduciendo la ingesta de alimentos y evitando lo vaporoso y lo mal digerido. {cite:canon-ibn-sina-print-v2 p.164} {cite:canon-ibn-sina-print-v2 p.165}"
  fr: "Les traitements de l'œil répondent à ses maladies: évacuer les matières soit en les éloignant – d'abord du corps, puis du cerveau, puis en les déviant par le nez et les veines proches de l'œil – soit en les faisant s'évacuer à l'aide de lacrymogènes; modifier l'humeur avec des remèdes appropriés; corriger la forme, notamment en cas de protrusion; et traiter la solution de continuité avec ce qui asséche sans piquer – le tout en réduisant l'alimentation et en évitant les aliments volatils et mal digérés. {cite:canon-ibn-sina-print-v2 p.164} {cite:canon-ibn-sina-print-v2 p.165}"
