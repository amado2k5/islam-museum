label:
  ar: "مآل التشنج"
  en: "Outcome of convulsion"
  ur: "تشنج کا انجام"
  es: "Resultado de la convulsión"
  fr: "Issue de la convulsion"
  tr: "Kasılma kaderi"
  id: "Nasib kejang"
summary:
  ar: "كل من مات من التشنج مات وبدنه بعد حار، وذلك مما يقتل بالخنق، وإنما يقتل بالخنق لأن عضل التنفس تتشنج وتبطل حركتها؛ وكل تشنج يتبع جراحة فهو قتال وهو من علامات الموت في أكثر الأمر {cite:canon-ibn-sina-print-v2 p.145}"
  en: "Everyone who dies of convulsion dies while his body is still hot, and it is among what kills by suffocation, killing by suffocation because the breathing muscles convulse and their motion lapses; every convulsion following a wound is deadly and a sign of death in most cases {cite:canon-ibn-sina-print-v2 p.145}"
  ur: "جو کوئی تشنج سے مرے وہ اس وقت مرے جب اس کا بدن ابھی گرم ہو، اور یہ ان چیزوں میں ہے جو دم گھٹ کر مارتی ہیں، اور دم گھٹ کر اس لیے مارتا ہے کہ تنفس کی عضل متشنج ہو جاتی ہیں اور ان کی حرکت باطل ہو جاتی ہے؛ اور ہر تشنج جو کسی زخم کے پیچھے ہو وہ قاتل ہے اور اکثر موت کی علامتوں میں ہے {cite:canon-ibn-sina-print-v2 p.145}۔"
  es: "Todo aquel que muere de convulsión muere mientras su cuerpo aún está caliente, y se trata de una de las causas de muerte por asfixia, que se produce porque los músculos respiratorios se convulsionan y su movimiento se interrumpe; toda convulsión posterior a una herida es mortal y, en la mayoría de los casos, un signo de muerte. {cite:canon-ibn-sina-print-v2 p.145}"
  fr: "Quiconque meurt de convulsions meurt alors que son corps est encore chaud, et cela fait partie des causes de mort par suffocation, car les muscles respiratoires se contractent violemment et leur mouvement s'interrompt; toute convulsion faisant suite à une blessure est mortelle et, dans la plupart des cas, signe de mort {cite:canon-ibn-sina-print-v2 p.145}"
  tr: "Kasılmadan ölen herkes, boğulma yoluyla öldüren sıcak vücutla ölür; daha çok solunum kası spazm geçirip hareket etmeyi durdurduğu için boğulma yoluyla ölür; ameliyattan sonra gelen her spazm savaş olarak kabul edilir ve çoğu durumda ölüm belirtilerinden biridir {cite:canon-ibn-sina-print-v2 s.145}"
  id: "Siapa pun yang meninggal karena kejang akan mati dengan tubuh panas, yang mematikan dengan dicekik, tetapi lebih karena dicekik karena otot pernapasan kejang dan berhenti bergerak; setiap kejang yang terjadi setelah operasi dianggap sebagai perjuangan dan merupakan salah satu tanda kematian dalam banyak kasus {cite:canon-ibn-sina-print-v2 hlm.145}"
