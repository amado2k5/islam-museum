id: concept/ittisal-al-isnad
class: concept
kind: discipline
label:
  ar: اتصال الإسناد وثبوت اللقي
  en: Connectedness of the isnad and proven hearing
  es: "Conectividad de la red y audición comprobada"
  fr: "La connectivité de l'Isnad et l'audition prouvée"
  ur: "اسناد اور ثابت سماعت کا مربوط ہونا"
  tr: "Atıf bağlantısı ve bulguyu doğrulama."
  id: "Koneksi atribusi dan konfirmasi temuan."
summary:
  ar: "شرط عند جمهور من المحدثين في قبول السند متصلاً: أن يثبت سماع أو لقاء كل راو لشيخه، لا مجرد المعاصرة والعنعنة؛ يعرض ابن رجب في تخريج حديث «اتق الله حيثما كنت» هذا الأصل بوضوح: رأي البخاري وشيخه علي بن المديني وأبي زرعة وأبي حاتم وغيرهم أن الحديث لا يتصل إلا بصحة اللقي، ودلالة كلام الإمام أحمد على ذلك ونص الشافعي عليه في الرسالة، وكل ذلك خلاف رأي مسلم؛ والتطبيق عنده ميمون بن أبي شبيب راوي الحديث عن أبي ذر ومعاذ: قال الفلاس ليس في شيء من رواياته عن الصحابة «سمعت»، وقال أبو حاتم روايته عن أبي ذر وعائشة غير متصلة، وقال أبو داود لم يدرك عائشة ولم ير علياً فلم يدرك معاذاً بطريق الأولى، ولم يخرج له البخاري في صحيحه شيئاً ولا مسلم إلا في مقدمة كتابه — فكان تصحيح الحاكم للحديث على شرط الشيخين وهماً عند ابن رجب من هذين الوجهين، ورجح الدارقطني إسناد الحديث المرسل."
  en: "The condition held by a majority traditionist school for accepting a chain as connected: that each narrator's hearing of, or meeting with, his own informant be proven — not mere contemporaneity and 'an'ana; Ibn Rajab sets out this principle plainly in his takhrij of 'fear God wherever you are': the view of al-Bukhari, his teacher Ali ibn al-Madini, Abu Zur'a, Abu Hatim and others that a hadith connects only with proven meeting, Ahmad's wording indicating the same and al-Shafi'i stating it in the Risala — all contrary to Muslim's position; the application is Maymun ibn Abi Shabib, the chain's reporter from Abu Dharr and Mu'adh: al-Fallas found no 'I heard' in any of his Companion reports, Abu Hatim declared his routes from Abu Dharr and A'isha unconnected, Abu Dawud held he reached neither A'isha nor Ali — still less Mu'adh — and al-Bukhari narrates nothing from him in his Sahih nor Muslim except in his introduction; hence al-Hakim's grading of the hadith as sound on the two Shaykhs' condition is, for Ibn Rajab, mistaken on both counts, and al-Daraqutni preferred its mursal route."
  es: "La condición que sostiene una escuela tradicionalista mayoritaria para aceptar una cadena como conectada: que se demuestre que cada narrador escuchó o se reunió con su propio informante, no la mera contemporaneidad y 'an'ana'; Ibn Rajab expone este principio claramente en su takhrij de 'temed a Dios dondequiera que estéis': la opinión de al-Bukhari, su maestro Ali ibn al-Madini, Abu Zur'a, Abu Hatim y otros de que un hadiz se conecta solo con un encuentro probado, la redacción de Ahmad indicando lo mismo y al-Shafi'i afirmándolo en la Risala, todo contrario a la posición de Muslim; La aplicación es Maymun ibn Abi Shabib, el reportero de la cadena de Abu Dharr y Mu'adh: al-Fallas no encontró ningún \"escuché\" en ninguno de sus informes de Compañeros, Abu Hatim declaró que sus rutas desde Abu Dharr y A'isha no estaban conectadas, Abu Dawud sostuvo que no llegó ni a A'isha ni a Ali —y mucho menos a Mu'adh— y al-Bukhari no narra nada de él en su Sahih ni en Muslim excepto en su introducción; por lo tanto, la clasificación del hadiz como auténtico por parte de al-Hakim en la condición de los dos Shaykhs es, para Ibn Rajab, errónea en ambos aspectos, y al-Daraqutni prefirió su ruta mursal."
  fr: "La condition posée par une école traditionniste majoritaire pour accepter une chaîne comme étant continue: que chaque narrateur ait entendu parler de son propre informateur ou l'ait rencontré — et non pas une simple contemporanéité et 'an'ana; Ibn Rajab expose clairement ce principe dans son takhrij de « craignez Dieu où que vous soyez »: l'avis d'al-Bukhari, de son maître Ali ibn al-Madini, d'Abu Zur'a, d'Abu Hatim et d'autres selon lesquels un hadith n'est valable qu'en cas de rencontre prouvée, la formulation d'Ahmad indiquant la même chose et al-Shafi'i l'affirmant dans la Risala — tous contraires à la position de Muslim; L'application concerne Maymun ibn Abi Shabib, le rapporteur de la chaîne de transmission d'après Abu Dharr et Mu'adh: al-Fallas n'a trouvé aucun « j'ai entendu » dans aucun de ses rapports de Compagnons, Abu Hatim a déclaré que ses itinéraires depuis Abu Dharr et A'isha étaient non connectés, Abu Dawud a soutenu qu'il n'avait atteint ni A'isha ni Ali — encore moins Mu'adh — et al-Bukhari ne rapporte rien de lui dans son Sahih ni dans Muslim, sauf dans son introduction; par conséquent, la classification du hadith par al-Hakim comme authentique sur la base de la condition des deux cheikhs est, pour Ibn Rajab, erronée sur les deux points, et al-Daraqutni a préféré sa voie mursal."
  ur: "اکثریتی روایت پسند مکتب کی طرف سے سلسلہ کو منسلک تسلیم کرنے کے لیے جو شرط رکھی گئی ہے: کہ ہر راوی کا اس کے اپنے مخبر کی سماعت، یا اس سے ملاقات ثابت ہو — محض ہم عصر اور 'عنا' نہیں۔ ابن رجب نے اپنی تخریج میں یہ اصول واضح طور پر بیان کیا ہے کہ تم جہاں بھی ہو خدا سے ڈرو: بخاری، ان کے استاد علی ابن المدینی، ابو زرعہ، ابو حاتم اور دیگر کا قول ہے کہ حدیث کا تعلق صرف ثابت ملاقات سے ہے، احمد کا قول اسی کی طرف اشارہ کرتا ہے اور شافعی نے تمام مؤقف کو مسلم قرار دیا ہے۔ درخواست میمون بن ابی شبیب ہے، ابوذر اور معاذ سے سلسلہ کے نامہ نگار: الفلاس نے اپنے کسی صحابی کی روایت میں 'میں نے نہیں سنا' نہیں پایا، ابو حاتم نے ابوذر اور عائشہ سے اپنے راستوں کو غیر مربوط قرار دیا، ابو داؤد کا خیال ہے کہ وہ نہ عائشہ تک پہنچا ہے اور نہ ہی علی بخاری - اور ان سے کم کچھ بھی نہیں ہے۔ صحیح نہ مسلم سوائے اس کے تعارف کے۔ لہٰذا الحاکم نے حدیث کو دو شیخوں کی شرط پر صحیح قرار دیا ہے، ابن رجب کے نزدیک دونوں اعتبار سے غلط ہے، اور دارقطنی نے اس کے مرسل کو ترجیح دی ہے۔"
  tr: "Çoğu hadis âlimine göre, sürekli bir aktarım zincirini kabul etmenin bir şartı, her rivayetçinin sadece çağdaşlık veya gelenek değil, öğretmenini duyduğu veya görüştüğünün kanıtlanmasıdır; İbn Receb bu özgünlüğü 'Nerede olursan ol Allah'tan kork' hadisinin doğruluğunda açıkça sunar: El-Buhari, onun hocası Ali ibn al-Medini, Ebu Zur'ah, Ebu Hatim ve diğerlerinin görüşü, hadisin yalnızca buluşmanın gerçekliğiyle bağlantılı olduğudur ve İmam Ahmed'in sözleri ile Al-Shafi'i'nin risaledeki açık metninin kanıtları, tüm bunların Müslümanların görüşünden farklı olduğunu gösterir; ve uygulama ona rivayetçi olarak Maymun ibn Ebi Şabib'dir Ebu Zerr ve Muadh'dan gelen hadisler: El-Falas, rivayetlerinde hiçbir 'Ben duydum' demiştir. Ebu Hatim, Ebu Zerr ve Aişe'den rivayetinin bağlantılı olmadığını söylemiştir. Ebu Davud, Ayşa ile karşılaşmadığını, Ali'yi görmediğini ve Muadh ile ilk görüşte karşılaşmadığını belirtmiştir. El-Buhari onun için Sahih'inde hiçbir şey anlatmamıştır, Müslümanlar da sadece kitabının girişinde rivayet etmiştir—bu nedenle El-Hakim'in hadisi doğruluğu, İbn Receb'e göre iki şeyhin şartlarını karşılar. El-Darakutni, mursal hadisin aktarım zincirini tercih etmiştir."
  id: "Syarat menurut mayoritas ulama hadis untuk menerima rantai transmisi yang berkelanjutan adalah harus dibuktikan bahwa setiap narator mendengar atau bertemu gurunya, bukan hanya sezaman atau tradisi; Ibn Rajab dengan jelas menyajikan asli ini dalam pengesahan hadis 'Takutlah Allah di mana pun kamu berada': Pendapat Al-Bukhari, gurunya Ali ibn al-Madini, Abu Zur'ah, Abu Hatim, dan lainnya adalah bahwa hadis hanya terkait dengan keaslian pertemuan tersebut, dan bukti kata-kata Imam Ahmad serta teks eksplisit Al-Shafi'i dalam risalah menunjukkan bahwa semua ini berbeda dari pandangan Muslim; dan penerapannya adalah Maymun ibn Abi Shabib sebagai narator Hadis dari Abu Dharr dan Mu'adh: Al-Falas mengatakan tidak ada 'Aku mendengar' dalam riwayatnya dari para Sahabat. Abu Hatim mengatakan riwayatnya dari Abu Dharr dan Aisha tidak terkait. Abu Dawood mengatakan ia tidak bertemu Aisha, juga tidak melihat Ali, dan ia juga tidak bertemu Mu'adh dengan cara pertama. Al-Bukhari tidak menceritakan apa pun untuknya dalam Sahih-nya, juga Muslim tidak menceritakan apa pun kecuali dalam pengantar bukunya—jadi otentikasi hadis oleh Al-Hakim memenuhi syarat dua Syekh tersebut, yang menurut Ibn Rajab berasal dari dua sudut pandang ini. Al-Daraqutni lebih memilih rangkaian penyampaian hadis Mursal."
