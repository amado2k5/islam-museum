label:
  ar: اتصال الإسناد وثبوت اللقي
  en: Connectedness of the isnad and proven hearing
summary:
  ar: "شرط عند جمهور من المحدثين في قبول السند متصلاً: أن يثبت سماع أو لقاء كل راو لشيخه، لا مجرد المعاصرة والعنعنة؛ يعرض ابن رجب في تخريج حديث «اتق الله حيثما كنت» هذا الأصل بوضوح: رأي البخاري وشيخه علي بن المديني وأبي زرعة وأبي حاتم وغيرهم أن الحديث لا يتصل إلا بصحة اللقي، ودلالة كلام الإمام أحمد على ذلك ونص الشافعي عليه في الرسالة، وكل ذلك خلاف رأي مسلم؛ والتطبيق عنده ميمون بن أبي شبيب راوي الحديث عن أبي ذر ومعاذ: قال الفلاس ليس في شيء من رواياته عن الصحابة «سمعت»، وقال أبو حاتم روايته عن أبي ذر وعائشة غير متصلة، وقال أبو داود لم يدرك عائشة ولم ير علياً فلم يدرك معاذاً بطريق الأولى، ولم يخرج له البخاري في صحيحه شيئاً ولا مسلم إلا في مقدمة كتابه — فكان تصحيح الحاكم للحديث على شرط الشيخين وهماً عند ابن رجب من هذين الوجهين، ورجح الدارقطني إسناد الحديث المرسل."
  en: "The condition held by a majority traditionist school for accepting a chain as connected: that each narrator's hearing of, or meeting with, his own informant be proven — not mere contemporaneity and 'an'ana; Ibn Rajab sets out this principle plainly in his takhrij of 'fear God wherever you are': the view of al-Bukhari, his teacher Ali ibn al-Madini, Abu Zur'a, Abu Hatim and others that a hadith connects only with proven meeting, Ahmad's wording indicating the same and al-Shafi'i stating it in the Risala — all contrary to Muslim's position; the application is Maymun ibn Abi Shabib, the chain's reporter from Abu Dharr and Mu'adh: al-Fallas found no 'I heard' in any of his Companion reports, Abu Hatim declared his routes from Abu Dharr and A'isha unconnected, Abu Dawud held he reached neither A'isha nor Ali — still less Mu'adh — and al-Bukhari narrates nothing from him in his Sahih nor Muslim except in his introduction; hence al-Hakim's grading of the hadith as sound on the two Shaykhs' condition is, for Ibn Rajab, mistaken on both counts, and al-Daraqutni preferred its mursal route."
