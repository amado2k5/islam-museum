class: "concept"
kind: "scientific"
label:
  ar: "أسباب الخدر"
  en: "Causes of numbness"
  fr: "Causes de l’engourdissement"
  ur: "خدر کے اسباب"
  es: "Causas del entumecimiento"
  tr: "Uyuşmanın nedenleri"
  id: "Penyebab mati rasa"
summary:
  ar: "أسباب الخدر من جهة القوة كضعفها في الحميات القوية وعند الغشي وقرب الموت، ومن جهة الآلة كإفساد مزاجها ببرد أو حر شديدين أو غلظ جوهر العصب أو سدد الأخلاط الغليظة أو ضغط الورم والرباط والوضع أو انصباب الدم، وقد تكون في الدماغ نفسه أو النخاع أو فقرة أو شعبة عصب {cite:canon-ibn-sina-print-v2 p.159}"
  en: "The causes of numbness are from the power's side — its weakening in strong acute fevers, at the point of syncope and near death — or from the instrument's side: corrupting its temper by severe cold or severe heat, thickness of the nerve's substance, thick-humour obstructions, the pressure of a swelling, ligature or posture, or effused blood blocking the passages; and the causes may be in the brain itself, the spinal cord, one vertebra or a nerve's branch {cite:canon-ibn-sina-print-v2 p.159}"
  fr: "Les causes de l’engourdissement relèvent de la faculté — son affaiblissement dans les fortes fièvres aiguës, à l’approche de la syncope et de la mort — ou de l’instrument : corruption de son tempérament par un froid ou une chaleur intenses, épaisseur de la substance du nerf, obstructions d’humeurs épaisses, pression d’un gonflement, d’une ligature ou d’une posture, ou sang épanché obstruant les voies ; les causes peuvent se trouver dans le cerveau lui-même, la moelle épinière, une vertèbre ou une ramification nerveuse {cite:canon-ibn-sina-print-v2 p.159}"
  ur: "خدر کے اسباب یا تو قوت کی طرف سے ہیں — مضبوط شدید بخاروں میں اس کا کمزور ہونا، غشی کے قریب اور موت کے نزدیک — یا آلہ کی طرف سے: شدید سردی یا شدید گرمی سے مزاج کا فاسد ہونا، عصب کے جوہر کی کثافت، موٹی اخلاط کی سدد، ورم، بندھن یا وضع کے دباؤ، یا راستوں کو روکنے والا اچھالا ہوا خون؛ اور اسباب خود دماغ میں، نخاع میں، ایک فقرے یا عصب کی شاخ میں بھی ہو سکتے ہیں {cite:canon-ibn-sina-print-v2 p.159}"
  es: "Las causas del entumecimiento provienen del lado de la potencia —su debilitamiento en fiebres agudas intensas, al borde del síncope y cerca de la muerte— o del lado del instrumento: alteración de su temperamento por frío o calor intensos, engrosamiento de la sustancia del nervio, obstrucciones por humores densos, la presión de una inflamación, ligadura o postura, o sangre derramada que bloquea los conductos; y las causas pueden estar en el propio cerebro, la médula espinal, una vértebra o una rama nerviosa {cite:canon-ibn-sina-print-v2 p.159}"
  tr: "Uyuşmanın nedenleri arasında şiddetli ateşte güçsüzlük, bayılma ve makinenin neredeyse ölmesi gibi güç; ve alet tarafında aşırı soğuk veya sıcaktan kaynaklanan ruh hali bozuklukları, sinir çekirdeğinin kalınlaşması, kaba humorların tıkanması, tümör basıncı, bağ, doğum veya kan akışı yer alır. Ayrıca beynin kendisinde, omurilikte veya sinir omurları ya da dallarında da olabilir {cite:canon-ibn-sina-print-v2 s.159}"
  id: "Penyebab mati rasa meliputi kekuatan, seperti kelemahan saat demam parah, pingsan, dan hampir mati mesin; dan di sisi instrumen, seperti gangguan suasana hati akibat dingin atau panas ekstrem, penebalan inti saraf, penyumbatan humor kasar, tekanan tumor, ligamen, persalinan, atau aliran darah. Penyakit ini juga dapat terjadi di otak itu sendiri, sumsum tulang belakang, atau vertebra saraf atau cabang {cite:canon-ibn-sina-print-v2 hlm.159}"
