id: concept/canon-matching-the-drying-to-organ-and-body-and-internal-ulcers
class: concept
kind: scientific
label:
  ar: "ملاءمة التجفيف للعضو والبدن وقروح الباطن عند ابن سينا"
  en: "Matching the drying to the organ and the body, internal ulcers and what hinders healing in the Canon"
  fr: "Dessiccation adaptée, ulcères internes et obstacles à la cicatrisation dans le Canon"
  ur: "قانون میں خشک کرنے کا عضو اور بدن سے موازنہ، اندرونی زخم اور شفا کی رکاوٹیں"
  es: "Adaptación de la sequedad al órgano y al cuerpo, úlceras internas y lo que dificulta la curación en el Canon"
  tr: "İbn Sina'ya göre organ, vücut ve iç ülserler için kurutma uygunluğu"
  id: "Kesesuaian pengeringan untuk organ, tubuh, dan luka dalam menurut Ibn Sina"
summary:
  ar: "يشرح ابن سينا كيف تقدر درجة التجفيف بمزاج العضو ومزاج القرحة ومزاج البدن وقوة المجففات، ثم قروح الباطن وموانع برء القرحة، ويختم بما يتأمل من لون المدة {cite:canon-ibn-sina-print-v1 pp.307-308}."
  en: "Ibn Sina explains how the degree of drying is set by the temperament of the organ, of the ulcer and of the body and by the strength of the drying drugs, then treats internal ulcers and what hinders an ulcer's healing, and ends with what to watch in the colour of the pus {cite:canon-ibn-sina-print-v1 pp.307-308}."
  fr: "Ibn Sina adapte le degré desséchant aux tempéraments de l’organe, de l’ulcère et du corps et à la force des remèdes, puis traite ulcères internes, obstacles à guérison et couleur du pus {cite:canon-ibn-sina-print-v1 pp.307-308}."
  es: "Ibn Sina explica cómo el grado de desecación está determinado por el temperamento del órgano, de la úlcera y del cuerpo, y por la potencia de los fármacos desecantes; luego trata las úlceras internas y lo que dificulta su curación, y finaliza con lo que hay que observar en el color del pus {cite:canon-ibn-sina-print-v1 pp.307-308}."
  ur: "ابن سینا بتاتے ہیں کہ کس طرح خشک ہونے کی ڈگری عضو کے مزاج، السر اور جسم کے مزاج اور خشک کرنے والی ادویات کی طاقت سے طے ہوتی ہے، پھر اندرونی السر کا علاج کرتی ہے اور جو السر کے ٹھیک ہونے میں رکاوٹ ہے، اور اس پر ختم ہوتی ہے کہ پیپ کے رنگ میں کیا دیکھنا ہے۔"
  tr: "İbn Sina, kuruma derecesinin organın ruh hali, ülserin mizaç, vücudun mizaç, kuru maddelerin gücü, ardından iç benliğin yaraları ve iyileşme yaralarının önündeki engellerle nasıl tahmin edildiğini açıklar; sonlandırma süresinin rengini düşünerek {cite:canon-ibn-sina-print-v1 s.307-308}"
  id: "Ibn Sina menjelaskan bagaimana tingkat pengeringan diperkirakan berdasarkan suasana hati organ, temperamen tukak lambung, temperamen tubuh, kekuatan zat kering, lalu luka dalam diri dan penghalang penyembuhan tukak lambung, dan mengakhiri dengan merenungkan warna durasi {cite:canon-ibn-sina-print-v1 hlm.307-308}."
