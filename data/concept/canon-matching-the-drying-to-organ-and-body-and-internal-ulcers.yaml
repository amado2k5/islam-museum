  en: "Matching the drying to the organ and the body, internal ulcers and what hinders healing in the Canon"
  fr: "Dessiccation adaptée, ulcères internes et obstacles à la cicatrisation dans le Canon"
  ur: "قانون میں خشک کرنے کا عضو اور بدن سے موازنہ، اندرونی زخم اور شفا کی رکاوٹیں"
summary:
  ar: "يشرح ابن سينا كيف تقدر درجة التجفيف بمزاج العضو ومزاج القرحة ومزاج البدن وقوة المجففات، ثم قروح الباطن وموانع برء القرحة، ويختم بما يتأمل من لون المدة {cite:canon-ibn-sina-print-v1 pp.307-308}."
  en: "Ibn Sina explains how the degree of drying is set by the temperament of the organ, of the ulcer and of the body and by the strength of the drying drugs, then treats internal ulcers and what hinders an ulcer's healing, and ends with what to watch in the colour of the pus {cite:canon-ibn-sina-print-v1 pp.307-308}."
  fr: "Ibn Sina adapte le degré desséchant aux tempéraments de l’organe, de l’ulcère et du corps et à la force des remèdes, puis traite ulcères internes, obstacles à guérison et couleur du pus {cite:canon-ibn-sina-print-v1 pp.307-308}."
