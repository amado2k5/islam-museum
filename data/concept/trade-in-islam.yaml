label:
  ar: التجارة في الإسلام
  en: Trade in Islam
  es: "Comercio en el Islam"
  fr: "Le commerce en islam"
  ur: "اسلام میں تجارت"
summary:
  ar: "يرى المراغي التجارة من أوسع ميادين النشاط الإنساني، ويقرن بها الصناعة والزراعة في تصريف الإنتاج {cite:min-qadaya-al-mal-wal-amal-azhar p. 30}. وينقل عن ابن خلدون أنها تستدعي المكايسة والغش والأيمان الكاذبة، فخصّها الإسلام بالترغيب والترهيب {cite:min-qadaya-al-mal-wal-amal-azhar p. 30}. ويقرر الكتاب أن الإسلام أمر بالتثبت من الكيل والوزن، وبيّن العيب، ونهى عن الغش، واستحب السماحة في البيع والشراء {cite:min-qadaya-al-mal-wal-amal-azhar p. 31} {cite:min-qadaya-al-mal-wal-amal-azhar p. 33}. ويذكر حديث «أنا ثالث الشريكين ما لم يخن أحدهما صاحبه» {cite:min-qadaya-al-mal-wal-amal-azhar p. 32}، وصور الشركة من العمل ورأس المال، والمضاربة، والتصرف بالأصالة أو بالوكالة {cite:min-qadaya-al-mal-wal-amal-azhar p. 32}. ويعرض الكتاب حديث «رحم الله عبدًا سمحًا» وحديث «من أقال أخاه بيعًا» في باب السماحة {cite:min-qadaya-al-mal-wal-amal-azhar p. 31} {cite:min-qadaya-al-mal-wal-amal-azhar p. 33}، ويعدّ من السماحة التساهل في ثمن ما يشتريه المرء من الباعة الجوالين {cite:min-qadaya-al-mal-wal-amal-azhar p. 33}. وينسب المؤلف إلى المأثور قولًا في أن تسعة أعشار الرزق في التجارة، ويبيّن أنه أورده في حاشيته مرسلًا {cite:min-qadaya-al-mal-wal-amal-azhar p. 30}. يعرض المؤلف التجارة بوصفها تنمية المال بالبيع والشراء، وأنها تخلق المنفعة الزمانية والمكانية، وأنها جائزة، وأن العلم بأحكام البيع فرض كفاية يصير فرض عين على التاجر، ويعرض نظرية المزايا النسبية المستفادة من آيتين عن توزيع الأقوات والمعايش."
  en: "Al-Maraghi treats trade as among the widest fields of human activity, tied to farming and craft (p. 30). After Ibn Khaldun he notes its dangers of haggling, cheating and false oaths, which Islam met with exhortation and warning (p. 30). Honest measure, disclosure of defects, and generosity in buying and selling are required (pp. 31, 33). He cites the hadith 'I am the third of two partners as long as neither betrays the other' and the forms of partnership, including mudaraba (p. 32). A saying about nine-tenths of livelihood being in trade is recorded but, by the book's own footnote, is mursal (p. 30)."
  es: "Al-Maraghi considera el comercio como uno de los campos más amplios de la actividad humana, vinculado a la agricultura y la artesanía (p. 30). Tras Ibn Khaldun, señala los peligros del regateo, el engaño y los juramentos falsos, a los que el Islam respondió con exhortaciones y advertencias (p. 30). Se exige honestidad, transparencia en la compraventa y la generosidad (pp. 31, 33). Cita el hadiz «Soy el tercero de dos socios mientras ninguno traicione al otro» y las formas de asociación, incluida la mudaraba (p. 32). Se registra un dicho que afirma que nueve décimas partes del sustento provienen del comercio, pero, según la propia nota al pie del libro, es mursal (p. 30)."
  fr: "Al-Maraghi considère le commerce comme l'un des domaines d'activité humaine les plus vastes, étroitement lié à l'agriculture et à l'artisanat (p. 30). À la suite d'Ibn Khaldun, il souligne les dangers du marchandage, de la tromperie et des faux serments, auxquels l'islam s'oppose par des exhortations et des avertissements (p. 30). L'honnêteté, la transparence quant aux défauts et la générosité dans l'achat et la vente sont indispensables (pp. 31, 33). Il cite le hadith « Je suis le tiers entre deux associés tant que l'un ne trahit pas l'autre » et les différentes formes de partenariat, notamment la mudaraba (p. 32). Un hadith rapporte que les neuf dixièmes des moyens de subsistance proviennent du commerce, mais, d'après une note de bas de page de l'ouvrage, il s'agit d'un hadith mursal (p. 30)."
  ur: "المراثی تجارت کو انسانی سرگرمیوں کے وسیع ترین شعبوں میں شمار کرتا ہے، جو کاشتکاری اور دستکاری سے منسلک ہے ⁦(ص 30)⁩۔ ابن خلدون کے بعد وہ اس کے ہنگامے، دھوکہ دہی اور جھوٹی قسموں کے خطرات کو نوٹ کرتا ہے، جن کا اسلام نصیحت اور تنبیہ کے ساتھ پورا کرتا ہے ⁦(ص 30)⁩۔ خرید و فروخت میں دیانت دارانہ پیمائش، نقائص کا انکشاف اور فراخدلی کی ضرورت ہے ⁦(صفحہ 31، 33)⁩۔ وہ حدیث کا حوالہ دیتے ہیں 'میں دو شریکوں میں تیسرا ہوں جب تک کہ دوسرے سے خیانت نہ کرے' اور شراکت کی شکلیں بشمول مضاربہ ⁦(ص 32)⁩۔ معاش کا نو دسواں حصہ تجارت میں ہونے کے بارے میں ایک قول درج ہے لیکن کتاب کے اپنے حاشیہ سے مرسل ہے ⁦(ص 30)⁩۔"
