id: concept/trade-in-islam
class: concept
kind: ethical
label:
  ar: التجارة في الإسلام
  en: Trade in Islam
summary:
  ar: "يرى المراغي التجارة من أوسع ميادين النشاط الإنساني، ويقرن بها الصناعة والزراعة في تصريف الإنتاج {cite:min-qadaya-al-mal-wal-amal-azhar p. 30}. وينقل عن ابن خلدون أنها تستدعي المكايسة والغش والأيمان الكاذبة، فخصّها الإسلام بالترغيب والترهيب {cite:min-qadaya-al-mal-wal-amal-azhar p. 30}. ويقرر الكتاب أن الإسلام أمر بالتثبت من الكيل والوزن، وبيّن العيب، ونهى عن الغش، واستحب السماحة في البيع والشراء {cite:min-qadaya-al-mal-wal-amal-azhar p. 31} {cite:min-qadaya-al-mal-wal-amal-azhar p. 33}. ويذكر حديث «أنا ثالث الشريكين ما لم يخن أحدهما صاحبه» {cite:min-qadaya-al-mal-wal-amal-azhar p. 32}، وصور الشركة من العمل ورأس المال، والمضاربة، والتصرف بالأصالة أو بالوكالة {cite:min-qadaya-al-mal-wal-amal-azhar p. 32}. ويعرض الكتاب حديث «رحم الله عبدًا سمحًا» وحديث «من أقال أخاه بيعًا» في باب السماحة {cite:min-qadaya-al-mal-wal-amal-azhar p. 31} {cite:min-qadaya-al-mal-wal-amal-azhar p. 33}، ويعدّ من السماحة التساهل في ثمن ما يشتريه المرء من الباعة الجوالين {cite:min-qadaya-al-mal-wal-amal-azhar p. 33}. وينسب المؤلف إلى المأثور قولًا في أن تسعة أعشار الرزق في التجارة، ويبيّن أنه أورده في حاشيته مرسلًا {cite:min-qadaya-al-mal-wal-amal-azhar p. 30}. يعرض المؤلف التجارة بوصفها تنمية المال بالبيع والشراء، وأنها تخلق المنفعة الزمانية والمكانية، وأنها جائزة، وأن العلم بأحكام البيع فرض كفاية يصير فرض عين على التاجر، ويعرض نظرية المزايا النسبية المستفادة من آيتين عن توزيع الأقوات والمعايش."
  en: "Al-Maraghi treats trade as among the widest fields of human activity, tied to farming and craft (p. 30). After Ibn Khaldun he notes its dangers of haggling, cheating and false oaths, which Islam met with exhortation and warning (p. 30). Honest measure, disclosure of defects, and generosity in buying and selling are required (pp. 31, 33). He cites the hadith 'I am the third of two partners as long as neither betrays the other' and the forms of partnership, including mudaraba (p. 32). A saying about nine-tenths of livelihood being in trade is recorded but, by the book's own footnote, is mursal (p. 30)."
