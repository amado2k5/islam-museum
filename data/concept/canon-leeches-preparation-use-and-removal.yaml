id: concept/canon-leeches-preparation-use-and-removal
class: concept
kind: scientific
label:
  ar: "تهيئة العلق واستعمالها وإسقاطها عند ابن سينا"
  en: "Preparing, applying and removing leeches in the Canon"
  fr: "Préparation, pose et retrait des sangsues dans le Canon"
  ur: "قانون میں جونکوں کی تیاری، استعمال اور اتارنا"
  es: "Preparación, aplicación y eliminación de sanguijuelas en el cañón."
  tr: "İbn Sina'ya göre sülüklerin hazırlanması, kullanımı ve faşetimi"
  id: "Persiapan, penggunaan, dan proyeksi lintah menurut Ibn Sina"
summary:
  ar: "يشرح ابن سينا كيف تهيأ العلق قبل الاستعمال، وكيف تنشط للتعلق وتسقط بعد امتلائها، وما يفعل لحبس الدم بعد سقوطها، وما تنفع منه من الأمراض الجلدية {cite:canon-ibn-sina-print-v1 p.302}."
  en: "Ibn Sina explains how leeches are prepared before use, how they are encouraged to attach and made to fall off once full, what is done to stop the blood after they fall, and the skin diseases for which they help {cite:canon-ibn-sina-print-v1 p.302}."
  fr: "Ibn Sina décrit préparation, fixation, chute après réplétion, arrêt du sang et usages cutanés des sangsues {cite:canon-ibn-sina-print-v1 p.302}."
  es: "Ibn Sina explica cómo se preparan las sanguijuelas antes de su uso, cómo se las anima a adherirse y se las hace caer una vez llenas, qué se hace para detener la sangre después de que caen y las enfermedades de la piel para las que ayudan {cite:canon-ibn-sina-print-v1 p.302}."
  ur: "ابن سینا بتاتے ہیں کہ کس طرح جونک استعمال سے پہلے تیار کی جاتی ہے، انہیں کس طرح جوڑنے کی ترغیب دی جاتی ہے اور ایک بار بھر جانے پر گرنے کے لیے کیا جاتا ہے، گرنے کے بعد خون کو روکنے کے لیے کیا کیا جاتا ہے، اور جلد کی بیماریاں جن کے لیے وہ مدد کرتے ہیں {cite:canon-ibn-sina-print-v1 p.302}۔"
  tr: "İbn Sina, sülüklerin kullanımdan önce nasıl hazırlandığını, dolduktan sonra nasıl yapışıp düştüklerini, düştükten sonra kanı tutmak için neler yapıldığını ve cilt hastalıkları için ne gibi faydalar sağladığını açıklar {cite:canon-ibn-sina-print-v1 s.302}."
  id: "Ibn Sina menjelaskan bagaimana lintah dipersiapkan sebelum digunakan, bagaimana mereka aktif untuk menempel dan jatuh setelah penuh, apa yang dilakukan untuk menjebak darah setelah jatuh, dan manfaat apa yang diberikannya untuk penyakit kulit {cite:canon-ibn-sina-print-v1 hlm.302}."
