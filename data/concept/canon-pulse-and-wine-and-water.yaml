id: concept/canon-pulse-and-wine-and-water
class: concept
kind: scientific
label:
  ar: "النبض والشراب والماء عند ابن سينا"
  en: "The pulse, wine and water in the Canon"
  fr: "Pouls, vin et eau dans le Canon"
  ur: "نبض، شراب اور پانی قانون میں"
  es: "El pulso, el vino y el agua en el Canon"
  tr: "İbn Sina'ya göre nabız, iç ve su"
  id: "Pulse, minum, dan air menurut Ibn Sina"
summary:
  ar: "يخص ابن سينا الشراب بحكم في النبض، ثم يذكر الماء، ويفرق بين الشراب الحار والبارد وبين تقويته {cite:canon-ibn-sina-print-v1 pp.178-179}."
  en: "Ibn Sina gives wine a ruling of its own for the pulse, then speaks of water, and separates hot wine from cold and both from its strengthening {cite:canon-ibn-sina-print-v1 pp.178-179}."
  fr: "Ibn Sina distingue l’effet propre du vin sur le pouls, puis l’eau, séparant température chaude ou froide et pouvoir fortifiant {cite:canon-ibn-sina-print-v1 pp.178-179}."
  es: "Ibn Sina le da al vino una regla propia para el pulso, luego habla del agua y separa el vino caliente del frío y ambos de su fortalecimiento {cite:canon-ibn-sina-print-v1 pp.178-179}."
  ur: "ابن سینا شراب کو نبض کے لیے اپنا ایک حکم دیتا ہے، پھر پانی کی بات کرتا ہے، اور گرم شراب کو ٹھنڈے سے الگ کرتا ہے اور اس کی مضبوطی سے بھی۔"
  tr: "İbn Sina, içeceği nabız hızına göre tanımlar, ardından suyu belirterek sıcak ve soğuk içecekleri ve güçlendirmelerini ayırt eder {cite:canon-ibn-sina-print-v1 s.178-179}."
  id: "Ibn Sina menentukan minuman berdasarkan laju denyutnya, lalu menyebutkan air, membedakan antara minuman panas dan dingin serta penguatannya {cite:canon-ibn-sina-print-v1 hlm.178-179}."
