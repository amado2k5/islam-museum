summary:
  ar: "يعرض ابن النفيس في شرحه مباحث التشريح من القانون لابن سينا، ويذكر أن ما منعه من مباشرة التشريح بنفسه، من الشريعة ومن الرحمة، دفعه إلى الاعتماد في صور الأعضاء الباطنة على ما وصفه المباشرون قبله، وخاصة جالينوس، وإلى النظر في منافعها {cite:sharh-tashrih-qanun-print p.1}."
  en: "In his commentary on the Canon's anatomy, Ibn al-Nafis says that religious restraint and compassion kept him from dissecting himself. He therefore relied on earlier practitioners, chiefly Galen, for the shapes of the inner organs, and on reasoned inquiry for their functions {cite:sharh-tashrih-qanun-print p.1}."
