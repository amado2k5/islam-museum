label: { ar: "علم التشريح", en: "Anatomy", fr: "Anatomie", es: "Anatomía", ur: "اناٹومی" }
summary:
  ar: "يعرض ابن النفيس في شرحه مباحث التشريح من القانون لابن سينا، ويذكر أن ما منعه من مباشرة التشريح بنفسه، من الشريعة ومن الرحمة، دفعه إلى الاعتماد في صور الأعضاء الباطنة على ما وصفه المباشرون قبله، وخاصة جالينوس، وإلى النظر في منافعها {cite:sharh-tashrih-qanun-print p.1}. ويعرّف ابن سينا في «القانون» العضو ويقسمه إلى مفرد ومركّب، ويعدّد الأعضاء المتشابهة الأجزاء، ثم الأعضاء القابلة والمعطية والقوى الرئيسة والخادمة {cite:canon-ibn-sina-print-v1 pp.36-41}."
  en: "In his commentary on the Canon's anatomy, Ibn al-Nafis says that religious restraint and compassion kept him from dissecting himself. He therefore relied on earlier practitioners, chiefly Galen, for the shapes of the inner organs, and on reasoned inquiry for their functions {cite:sharh-tashrih-qanun-print p.1}. Ibn Sina himself, in the Canon, defines the organ and divides it into simple and composite, lists the similar-part organs, and treats the accepting and giving organs, the principal powers and the serving organs {cite:canon-ibn-sina-print-v1 pp.36-41}."
  fr: "Dans son commentaire de l’anatomie du Canon, Ibn al-Nafis dit que la retenue religieuse et la compassion l’ont empêché de pratiquer lui-même la dissection. Il s’est donc fondé sur les praticiens antérieurs, principalement Galien, pour les formes des organes internes, et sur la recherche raisonnée pour leurs fonctions {cite:sharh-tashrih-qanun-print p.1}. Ibn Sina lui-même, dans le Canon, définit l’organe et le divise en simple et composé, énumère les organes à parties similaires, et traite des organes qui reçoivent et qui donnent, des facultés principales et des organes serviteurs {cite:canon-ibn-sina-print-v1 pp.36-41}."
  es: "En su comentario sobre la anatomía del Canon, Ibn al-Nafis afirma que la moderación religiosa y la compasión le impidieron diseccionarse a sí mismo. Por lo tanto, se basó en practicantes anteriores, principalmente Galeno, para la forma de los órganos internos, y en la investigación razonada para sus funciones {cite:sharh-tashrih-qanun-print p.1}. El propio Ibn Sina, en el Canon, define el órgano y lo divide en simple y compuesto, enumera los órganos de partes similares y trata los órganos receptores y donantes, las facultades principales y los órganos de servicio {cite:canon-ibn-sina-print-v1 pp.36-41}."
  ur: "کینن کی اناٹومی پر اپنی تفسیر میں ابن النفیس کا کہنا ہے کہ مذہبی تحمل اور ہمدردی نے اسے اپنے آپ کو جدا کرنے سے روکا۔ اس لیے اس نے اندرونی اعضاء کی شکلوں کے لیے پہلے پریکٹیشنرز، خاص طور پر گیلن پر، اور ان کے افعال کے لیے استدلال استفسار پر انحصار کیا۔ ابن سینا خود، کینن میں عضو کی تعریف کرتا ہے اور اسے سادہ اور جامع میں تقسیم کرتا ہے، اسی طرح کے اعضاء کی فہرست دیتا ہے، اور اعضاء کو قبول کرنے اور دینے، بنیادی اختیارات اور خدمت کرنے والے اعضاء کا علاج کرتا ہے۔"
