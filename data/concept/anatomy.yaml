label: { ar: "علم التشريح", en: "Anatomy" }
summary:
  ar: "يعرض ابن النفيس في شرحه مباحث التشريح من القانون لابن سينا، ويذكر أن ما منعه من مباشرة التشريح بنفسه، من الشريعة ومن الرحمة، دفعه إلى الاعتماد في صور الأعضاء الباطنة على ما وصفه المباشرون قبله، وخاصة جالينوس، وإلى النظر في منافعها {cite:sharh-tashrih-qanun-print p.1}. ويعرّف ابن سينا في «القانون» العضو ويقسمه إلى مفرد ومركّب، ويعدّد الأعضاء المتشابهة الأجزاء، ثم الأعضاء القابلة والمعطية والقوى الرئيسة والخادمة {cite:canon-ibn-sina-print-v1 pp.36-41}."
  en: "In his commentary on the Canon's anatomy, Ibn al-Nafis says that religious restraint and compassion kept him from dissecting himself. He therefore relied on earlier practitioners, chiefly Galen, for the shapes of the inner organs, and on reasoned inquiry for their functions {cite:sharh-tashrih-qanun-print p.1}. Ibn Sina himself, in the Canon, defines the organ and divides it into simple and composite, lists the similar-part organs, and treats the accepting and giving organs, the principal powers and the serving organs {cite:canon-ibn-sina-print-v1 pp.36-41}."
