id: concept/zij-sabi-the-ascendant-from-a-stars-turning
class: concept
kind: scientific
label: { ar: "معرفة الطالع من دوران الكوكب", en: "The ascendant from the turning of a star", ur: "ستارے کے دوران سے طالع کی پہچان" }
summary:
  ar: "يعرف البتاني الطالع بإضافة ما دار من الفلك منذ طلوع الكوكب إلى أزمان المطالع التي بإزاء الجزء الذي يطلع معه الكوكب في الإقليم، فيعرف بالناتج الطالع ووسط السماء على الرسم المتقدم. وله جهة أخرى: تؤخذ القوس الراجعة فتُنقص من أزمان المطالع التي تتوسط السماء مع الكوكب في الفلك المستقيم إذا كان الكوكب في ناحية المشرق، وتُزاد عليها إذا كان في ناحية المغرب. {cite:zij-sabi-nallino-byblion pp.55-56}."
  en: "Al-Battani finds the ascendant by adding the part of the sphere that has turned since the star's rising to the rising times against the part that rises with the star in the clime; with the result he finds the ascendant and midheaven by the earlier procedure. Another way takes the returned arc and subtracts it from the rising times of the part culminating with the star in the right sphere when the star is on the east side, and adds it when on the west. {cite:zij-sabi-nallino-byblion pp.55-56}."
  ur: "البتانی طالع اس طرح جانتے ہیں کہ ستارے کے طلوع کے بعد فلک کا جتنا حصہ گھوم چکا ہو اسے اس جزء کے مقابل مطالع کے ازمان میں جمع کرتے ہیں جس کے ساتھ ستارہ اقلیم میں طلوع ہوتا ہے، اور حاصل سے پچھلے طریقے پر طالع اور وسط السماء معلوم کرتے ہیں۔ دوسرا طریقہ یہ ہے کہ قوسِ راجعہ کو لے کر ان مطالع کے ازمان میں سے گھٹائیں جو فلک مستقیم میں ستارے کے ساتھ وسط السماء میں آتے ہیں جب ستارہ مشرقی طرف ہو، اور مغربی طرف ہو تو جمع کریں۔ {cite:zij-sabi-nallino-byblion pp.55-56}۔"
