id: concept/aqd
class: concept
kind: legal
label:
  ar: "العَقْد"
  en: "The contract (aqd): elements, offer and acceptance, and its kinds"
  ur: "عقد (معاہدہ)"
summary:
  ar: "العقد في اللغة الربط والشد والضمان والعهد، وفي الاصطلاح العام كل ما يعقده الإنسان على نفسه أو على غيره، وفي الاصطلاح الخاص ما ينشأ عن إرادتين لظهور أثره الشرعي في المحل، وهو المقصود هنا {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11705} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11706}. وأركان العقد عند جمهور الفقهاء العاقدان والصيغة والمحل، وعند الحنفية الصيغة وحدها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11707}. وتنعقد الصيغة بالألفاظ والكتابة والإشارة والتعاطي بحسب المذهب، ويشترط عند الشافعية والحنابلة في النكاح لفظ النكاح أو التزويج، وأما الحنفية والمالكية فلا يشترطانه، وتراعى المقاصد أحياناً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11708} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11710} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11713}. ويشترط توافق القبول مع الإيجاب، واتصاله به في مجلس واحد، وللموجب الرجوع قبل القبول عند جمهور الفقهاء، ولا يشترط الفور في القبول عند الجمهور {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11718} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11719} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11720} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11723} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11724}. ومن شروط العاقدين الأهلية والولاية والرضا، ومن شروط المحل الوجود والقابلية والمعلومية والقدرة على التسليم، مع استثناءات في عقود التبرع {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11726} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11728} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11733}. وتقسم العقود إلى مالية وغير مالية، ولازمة وجائزة، ومعاوضة وتبرع، وصحيحة وباطلة وفاسدة، ونافذة وموقوفة، ومؤقتة ومطلقة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11744}. وينتهي العقد بالفسخ أو الإقالة أو انتهاء المدة، وبهلاك المعقود عليه ووفاة أحد العاقدين وغصبه، وبالاستحقاق {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11746} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11750}."
  en: "In the lexicon, aqd is tying, binding, guarantee and covenant. In the general sense it is any undertaking a person binds himself or another to; in the specific sense, which is meant here, it is what arises from two wills so that its legal effect appears in the object {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11705} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11706}. Most jurists count three pillars: the two contracting parties, the formula (offer and acceptance) and the object; the Hanafis count only the formula {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11707}. The formula may be spoken, written, signalled or given by exchange, according to the school; the Shafi'is and Hanbalis require the word for marriage in a marriage contract, the Hanafis and Malikis do not, and some cases follow the purpose over the wording {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11708} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11710} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11713}. The acceptance must match the offer and be joined to it in one session; the offerer may retract before acceptance according to the majority, and the majority do not require immediate acceptance {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11718} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11719} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11720} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11723} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11724}. The parties need capacity, authority and consent; the object must exist or be capable of the contract's effect, be known and deliverable, with exceptions for gifts {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11726} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11728} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11733}. Contracts are divided into financial and non-financial, binding and revocable, exchange and gratuitous, valid, void and defective, effective and suspended, and fixed-term and open-ended {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11744}. A contract ends by rescission, dissolution by agreement, expiry, destruction of the object, death of a party, usurpation, or a successful claim by a third party {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11746} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11750}."
