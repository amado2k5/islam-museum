id: concept/taawwudh
class: concept
kind: term
label:
  ar: التعوذ
  en: Ta'awwudh (seeking refuge)
  ur: تعوذ
  es: "Ta'awwudh (buscando refugio)"
  fr: "Ta'awwudh (chercher refuge)"
  tr: "sığınak aramak"
  id: "mencari perlindungan"
summary:
  ar: "التعوذ الاستعاذة بالله من الشيطان قبل القراءة وعندها؛ تبحث الموسوعة الفقهية الكويتية صيغ الاستعاذة وأفضلها وأحكام الوقف عليها وإعادتها {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  en: "Ta'awwudh is seeking refuge with God from Satan before and during recitation; the Kuwaiti Fiqh Encyclopedia examines the formulas of refuge, the best of them, and the rulings on pausing and repeating it {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  es: "Ta'awwudh es buscar refugio en Dios de Satanás antes y durante la recitación; la Enciclopedia de Fiqh de Kuwait examina las fórmulas de refugio, las mejores de ellas y las normas sobre pausar y repetirlo {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  fr: "Le ta'awwudh consiste à chercher refuge auprès de Dieu contre Satan avant et pendant la récitation; l'Encyclopédie Fiqh koweïtienne examine les formules de refuge, les meilleures d'entre elles, et les règles sur la pause et la répétition {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  ur: "تعوذ تلاوت سے پہلے اور دوران شیطان سے خدا کی پناہ مانگتا ہے۔ کویتی فقہ انسائیکلو پیڈیا پناہ کے فارمولوں کا جائزہ لیتا ہے، ان میں سے سب سے بہتر، اور اسے روکنے اور دہرانے کے احکام {حوالہ:فقہ-موسوع-کویتیہ-نور-v3}۔"
  tr: "Şeytandan önce ve sonra Allah'a sığınmak; Kuveyt Fıkıh Ansiklopedisi, sığınma biçimlerini, en iyilerini, bunlara durma kararlarını ve tekrarını tartışır {atıf:fiqh-mawsua-kuwaitiyya-noor-v3}."
  id: "Mencari perlindungan kepada Allah dari Setan sebelum dan sesudah pembacaan; Ensiklopedia Yurisprudensial Kuwait membahas bentuk-bentuk mencari perlindungan, yang terbaik, aturan tentang berhenti di dalamnya, dan pengulangannya {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
