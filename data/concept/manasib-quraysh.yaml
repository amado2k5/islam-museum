label: { ar: "مناصب قريش في مكة", en: "The offices of Quraysh at Mecca" }
summary:
  ar: "المناصب التي قامت عليها حكومة مكة قبل الإسلام في عرض الرحيق المختوم: الخمسة التي جمعها قصي (رياسة دار الندوة واللواء والحجابة والسقاية والرفادة) واقتسمها بعده بنو عبد الدار وبنو عبد مناف، وما وُزّع بين بطون قريش من الإيسار وتحجير الأموال والشورى والأشناق والعقاب والقبة والسفارة، حتى كوّنوا بها ما يسميه المؤلف شبه دويلة ديمقراطية؛ وقبلها خلال مضر الثلاث في الحج."
  en: "The offices on which Mecca's pre-Islamic government rested in al-Raheeq al-Makhtum's account: the five gathered by Qusayy (Dar al-Nadwa, the banner, the custody of the Kaaba, the watering and the feeding of pilgrims) later divided between Abd al-Dar and Abd Manaf, and the further offices distributed among the clans (divination arrows, votive property, counsel, blood-money, the war standard, the camp and cavalry, embassy), forming what the author calls a quasi-democratic statelet; before them, the three hajj prerogatives of Mudar."
