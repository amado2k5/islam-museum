id: concept/manasib-quraysh
class: concept
kind: political
label: { ar: "مناصب قريش في مكة", en: "The offices of Quraysh at Mecca", es: "Las oficinas de los Quraysh en La Meca", fr: "Les bureaux de Quraysh à La Mecque", ur: "مکہ میں قریش کے دفاتر" }
summary:
  ar: "المناصب التي قامت عليها حكومة مكة قبل الإسلام في عرض الرحيق المختوم: الخمسة التي جمعها قصي ⁦(رياسة دار الندوة واللواء والحجابة والسقاية والرفادة)⁩ واقتسمها بعده بنو عبد الدار وبنو عبد مناف، وما وُزّع بين بطون قريش من الإيسار وتحجير الأموال والشورى والأشناق والعقاب والقبة والسفارة، حتى كوّنوا بها ما يسميه المؤلف شبه دويلة ديمقراطية؛ وقبلها خلال مضر الثلاث في الحج."
  en: "The offices on which Mecca's pre-Islamic government rested in al-Raheeq al-Makhtum's account: the five gathered by Qusayy (Dar al-Nadwa, the banner, the custody of the Kaaba, the watering and the feeding of pilgrims) later divided between Abd al-Dar and Abd Manaf, and the further offices distributed among the clans (divination arrows, votive property, counsel, blood-money, the war standard, the camp and cavalry, embassy), forming what the author calls a quasi-democratic statelet; before them, the three hajj prerogatives of Mudar."
  es: "Según el relato de al-Raheeq al-Makhtum, los cargos en los que se basaba el gobierno preislámico de La Meca eran los cinco reunidos por Qusayy (Dar al-Nadwa, el estandarte, la custodia de la Kaaba, el suministro de agua y la alimentación de los peregrinos), que más tarde se dividieron entre Abd al-Dar y Abd Manaf, y los demás cargos se distribuyeron entre los clanes (flechas de adivinación, propiedades votivas, consejo, compensación por derramamiento de sangre, el estandarte de guerra, el campamento y la caballería, la embajada), formando lo que el autor denomina un pequeño estado cuasi democrático; antes de ellos, las tres prerrogativas del Hajj de Mudar."
  fr: "D'après le récit d'al-Raheeq al-Makhtum, les offices sur lesquels reposait le gouvernement préislamique de La Mecque étaient répartis: les cinq offices réunis par Qusayy (Dar al-Nadwa, la bannière, la garde de la Kaaba, l'approvisionnement en eau et en nourriture des pèlerins), plus tard partagés entre Abd al-Dar et Abd Manaf, et les autres offices distribués entre les clans (flèches divinatoires, biens votifs, conseil, prix du sang, étendard de guerre, camp et cavalerie, ambassade), formant ce que l'auteur appelle un État quasi-démocratique; avant eux, les trois prérogatives du hajj de Mudar."
  ur: "وہ دفاتر جن پر مکہ کی قبل از اسلام حکومت نے الرحیق المختم کے کھاتے میں قیام کیا تھا: قصی کے جمع ہونے والے پانچ ⁦(دارالندوہ، جھنڈا، کعبہ کی حفاظت، پانی پلانا اور زائرین کو کھانا کھلانا)⁩ بعد میں عبد الدار اور عبد مناف کے درمیان دفتر تقسیم کیا گیا، اور مزید تقسیم کیا گیا۔ ووٹ کی جائیداد، مشورہ، خون کی رقم، جنگی معیار، کیمپ اور گھڑسوار فوج، سفارت خانہ)، جسے مصنف نے ایک نیم جمہوری ریاست کا نام دیا ہے۔ ان کے سامنے مدر کے تین حج استحقاق ہیں۔"
