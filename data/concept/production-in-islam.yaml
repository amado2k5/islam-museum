label:
  ar: "الإنتاج في الإسلام"
  en: "Production in Islam"
  es: "La producción en el Islam"
  fr: "La production en islam"
  ur: "اسلام میں پیداوار"
  tr: "İslam'da Yapım"
  id: "Produksi dalam Islam"
summary:
  ar: "يعرّف المؤلف الإنتاج بأنه استغلال الموارد وتخصيصها، وسدّ الحاجات، وخلق الدخول، ويقصر بابه على استغلال الموارد وسدّ الحاجات، ويؤجّل خلق الدخول إلى باب التوزيع {cite:usul-iqtisad-islami-0660 p. 103}. وهو عنده وسيلة لا غاية: يُنتَج ليُسدّ الحاجات ويستغنى عن الناس ويُعطى منه، لا لمجرد زيادة الثروة {cite:usul-iqtisad-islami-0660 p. 122} {cite:usul-iqtisad-islami-0660 p. 124}. ويُحرَّم إنتاج الحرام، وتُقدَّم الضروريات ثم الحاجيات ثم التحسينيات {cite:usul-iqtisad-islami-0660 p. 125}. ويوسّع مفهوم الإنتاج ليشمل خلق المنفعة الزمانية والمكانية في التجارة {cite:usul-iqtisad-islami-0660 p. 170} {cite:usul-iqtisad-islami-0660 p. 171}."
  tr: "Yazar, üretimi kaynakların sömürülmesi ve tahsisi, ihtiyaçların karşılanması ve gelir yaratılması olarak tanımlar; bu alanın sadece kaynak sömürüsü ve ihtiyaçların karşılanmasıyla sınırlandırılır ve yaratımı dağıtım kapısına erteler {cite:usul-iqtisad-islami-0660 s. 103}. Onun için bu bir araçtır, amaç değil: sadece serveti artırmak için değil, ihtiyaçları karşılamak, insanlardan vazgeçmek ve onlardan vermek için üretir {cite:usul-iqtisad-islami-0660 s. 122} {cite:usul-iqtisad-islami-0660 s. 124}. Yasaklanmış şeylerin üretimini yasaklar, gereklilikleri ve ardından ihtiyaçları ve iyileştirmeleri sunar {cite:usul-iqtisad-islami-0660 s. 125}. Üretim kavramı, ticarette zamansal ve mekânsal fayda yaratmayı da kapsayacak şekilde genişletilmiştir {cite:usul-iqtisad-islami-0660 s. 170} {cite:usul-iqtisad-islami-0660 s. 171}."
  id: "Penulis mendefinisikan produksi sebagai eksploitasi dan alokasi sumber daya, memenuhi kebutuhan, dan menciptakan pendapatan, membatasi cakupannya pada eksploitasi sumber daya dan memenuhi kebutuhan, serta menunda penciptaan hingga ke pintu distribusi {cite:usul-iqtisad-islami-0660 hlm. 103}. Bagi dia, ini adalah sarana, bukan tujuan: menghasilkan untuk memenuhi kebutuhan, menghilangkan orang, dan memberi dari mereka, bukan hanya untuk menambah kekayaan {cite:usul-iqtisad-islami-0660 hlm. 122} {cite:usul-iqtisad-islami-0660 hlm. 124}. Ia melarang produksi barang terlarang, dan menyajikan kebutuhan lalu kebutuhan lalu perbaikan {cite:usul-iqtisad-islami-0660 hlm. 125}. Konsep produksi diperluas untuk mencakup penciptaan utilitas temporal dan spasial dalam perdagangan {cite:usul-iqtisad-islami-0660 hlm. 170} {cite:usul-iqtisad-islami-0660 hlm. 171}."
