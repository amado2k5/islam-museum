label:
  ar: "الإنتاج في الإسلام"
  en: "Production in Islam"
summary:
  ar: "يعرّف المؤلف الإنتاج بأنه استغلال الموارد وتخصيصها، وسدّ الحاجات، وخلق الدخول، ويقصر بابه على استغلال الموارد وسدّ الحاجات، ويؤجّل خلق الدخول إلى باب التوزيع {cite:usul-iqtisad-islami-0660 p. 103}. وهو عنده وسيلة لا غاية: يُنتَج ليُسدّ الحاجات ويستغنى عن الناس ويُعطى منه، لا لمجرد زيادة الثروة {cite:usul-iqtisad-islami-0660 p. 122} {cite:usul-iqtisad-islami-0660 p. 124}. ويُحرَّم إنتاج الحرام، وتُقدَّم الضروريات ثم الحاجيات ثم التحسينيات {cite:usul-iqtisad-islami-0660 p. 125}. ويوسّع مفهوم الإنتاج ليشمل خلق المنفعة الزمانية والمكانية في التجارة {cite:usul-iqtisad-islami-0660 p. 170} {cite:usul-iqtisad-islami-0660 p. 171}."
