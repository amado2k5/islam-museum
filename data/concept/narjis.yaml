summary:
  ar: "النرجس في الكتاب أصله يجذب من المقعر ويجفف ويجلو ويغسل، ودهنه في أحواله دهن الياسمين لكنه أضعف، وينفع في الجراحات والأورام وأوجاع العصب والرأس، ويذكر له الكتاب نقلاً في الرحم موسوماً {cite:canon-ibn-sina-print-v1 p.575}."
  en: "Narjis, narcissus, has in the book a root that draws from the depths, dries, cleanses and washes, and an oil that serves like jasmine oil but weaker; it helps wounds, swellings, pains of the nerves and the head, and the book also gives a listing on the womb, labelled here {cite:canon-ibn-sina-print-v1 p.575}."
  ur: "نرجس کی جڑ کتاب کے مطابق گہرائی سے کھینچتی، خشک کرتی، جلا دیتی اور دھوتی ہے، اور اس کا تیل چمبیلی کے تیل کی طرح مگر کمزور ہے؛ یہ زخموں، ورموں، اعصاب اور سر کے دردوں میں مفید ہے، اور کتاب رحم کے بارے میں بھی ایک بات نقل کرتی ہے جو یہاں موسوم کی گئی {cite:canon-ibn-sina-print-v1 p.575}۔"
  es: "Narjis, narciso, tiene en el libro una raíz que extrae de las profundidades, seca, limpia y lava, y un aceite que sirve como el aceite de jazmín pero más débil; ayuda con heridas, hinchazones, dolores de los nervios y de la cabeza, y el libro también da una lista sobre el útero, etiquetada aquí {cite:canon-ibn-sina-print-v1 p.575}."
  fr: "Le livre mentionne dans Narjis, le narcisse, une racine qui puise dans les profondeurs, assèche, purifie et lave, et une huile qui agit comme l'huile de jasmin mais en plus faible; elle aide à soigner les plaies, les gonflements, les douleurs nerveuses et les maux de tête, et le livre donne également une liste sur l'utérus, étiquetée ici {cite:canon-ibn-sina-print-v1 p.575}."
