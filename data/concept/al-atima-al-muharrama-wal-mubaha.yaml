id: concept/al-atima-al-muharrama-wal-mubaha
class: concept
kind: legal
label:
  ar: "المطاعم بين الحلال والحرام"
  en: "Foods between the lawful and the unlawful"
  fr: "Aliments licites et illicites"
  ur: "کھانے: حلال اور حرام کے درمیان"
  es: "Alimentos entre lo lícito y lo ilícito"
  tr: "Helal ve Haram Arasında Restoranlar"
  id: "Restoran antara Halal dan Haram"
summary:
  ar: "تأمر آيات منها [[passage/quran-2-168|البقرة 168]] بالأكل مما في الأرض حلالاً طيباً وتنهى عن اتباع خطوات الشيطان {cite:tanzil-quran}. وتعدد [[passage/quran-5-3|المائدة 3]] ما حرم من الأكل كالميتة والدم ولحم الخنزير وما أهل به لغير الله {cite:tanzil-quran}. وتروي كتب الحديث تحريم كل مسكر {cite:sahih-al-bukhari 4343}، وتحريم الحمر الأهلية وكل ذي ناب من السباع {cite:sunan-abi-dawud 3806}، وإحلال الحوت والجراد والكبد والطحال {cite:sunan-ibn-majah 3314}. وفي حديث الضب أنه أكل على مائدة النبي وهو لم يأكله تقذراً {cite:sunan-abi-dawud 3793}."
  en: "Verses such as [[passage/quran-2-168|al-Baqara 168]] tell people to eat of what is lawful and good on the earth and forbid following the footsteps of the devil {cite:tanzil-quran}. [[passage/quran-5-3|al-Ma'ida 3]] lists what is forbidden as food, such as carrion, blood, swine flesh and what was dedicated to other than God {cite:tanzil-quran}. The books of hadith report the prohibition of every intoxicant {cite:sahih-al-bukhari 4343}, of domestic donkeys and of every fanged beast of prey {cite:sunan-abi-dawud 3806}, and the making lawful of fish, locust, liver and spleen {cite:sunan-ibn-majah 3314}. In the report about the dabb lizard, it was eaten at the Prophet's table while he left it out of distaste {cite:sunan-abi-dawud 3793}."
  fr: "Des versets comme [[passage/quran-2-168|Al-Baqara, verset 168]] invitent à manger des aliments licites et bons que l’on trouve sur terre et interdisent de suivre les pas du diable {cite:tanzil-quran}. [[passage/quran-5-3|Al-Ma'ida, verset 3]] énumère les aliments interdits, comme les bêtes mortes, le sang, la chair de porc et ce qui a été consacré à un autre que Dieu {cite:tanzil-quran}. Les recueils de hadiths rapportent l’interdiction de tout ce qui enivre {cite:sahih-al-bukhari 4343}, des ânes domestiques et de toute bête de proie à crocs {cite:sunan-abi-dawud 3806}, ainsi que la permission de consommer du poisson, des sauterelles, du foie et de la rate {cite:sunan-ibn-majah 3314}. Dans le récit du lézard dabb, on en mange à la table du Prophète, qui s’en abstient par dégoût {cite:sunan-abi-dawud 3793}."
  ur: "آیات، جن میں [[passage/quran-2-168|البقرہ 168]] شامل ہے، زمین کی حلال اور پاکیزہ چیزوں میں سے کھانے کا حکم دیتی ہیں اور شیطان کے نقشِ قدم پر چلنے سے روکتی ہیں {cite:tanzil-quran}۔ [[passage/quran-5-3|المائدہ 3]] کھانے میں حرام چیزیں گنواتی ہے، جیسے مردار، خون، خنزیر کا گوشت اور وہ جو اللہ کے سوا کسی اور کے نام پر ہو {cite:tanzil-quran}۔ کتبِ حدیث ہر نشہ آور چیز کی حرمت {cite:sahih-al-bukhari 4343}، پالتو گدھوں اور ہر کچلی والے درندے کی حرمت {cite:sunan-abi-dawud 3806}، اور مچھلی، ٹڈی، کلیجی اور تلی کی حلت {cite:sunan-ibn-majah 3314} روایت کرتی ہیں۔ ضب کی روایت میں ہے کہ وہ نبی کے دسترخوان پر کھایا گیا جبکہ انہوں نے گھن کے سبب اسے نہیں کھایا {cite:sunan-abi-dawud 3793}۔"
  es: "Versículos como [[passage/quran-2-168|al-Baqara 168]] dicen a la gente que coma de lo que es lícito y bueno en la tierra y prohíben seguir los pasos del diablo {cite:tanzil-quran}. [[passage/quran-5-3|al-Ma'ida 3]] enumera lo que está prohibido como alimento, como la carroña, la sangre, la carne de cerdo y lo que fue dedicado a otro que no sea Dios {cite:tanzil-quran}. Los libros de hadices informan la prohibición de todo intoxicante {cite:sahih-al-bukhari 4343}, de los asnos domésticos y de toda bestia de presa con colmillos {cite:sunan-abi-dawud 3806}, y la legalidad del pescado, la langosta, el hígado y el bazo {cite:sunan-ibn-majah 3314}. En el relato sobre el lagarto dabb, se dice que fue comido en la mesa del Profeta, mientras que él lo dejó por desagrado {cite:sunan-abi-dawud 3793}."
  tr: "[[pasaj/kuran-2-168|Al-Baqarah 168]] gibi ayetler, yeryüzünde yasal ve iyi olandan yemek yemeyi emreder ve şeytanın izinden gitmeyi yasaktır {atıf:tanzil-kuran}. [[pasaj/kuran-kuran-5-3|El-Ma'idah 3]] yemekten yasak olanları listeler; leş, kan, domuz eti ve Allah dışında başkalarına izin verilenler {atı:tanzil-kur'an}. Hadis kitapları, tüm sarhoş maddelerin yasaklanmasını {atı:sahih-al-bukhari 4343}, evcil eşeklerin ve her dişli hayvanın yasaklanmasını {cite:sunan-abi-dawud 3806} ve balina, çekirge, karaciğer ve dalak yerine getirilmesini {cite:sunan-ibn-majah 3314} anlatır. Kertenkele hadisinde, Peygamber'in sofrasında yediği ama pislikten yemediği söylenir {atıf:sunan-abi-davud 3793}."
  id: "[[ayat/Al-Quran-2-168| Al-Baqarah 168]] memerintahkan makan dari apa yang sah dan baik di bumi dan melarang mengikuti jalan Setan {kutipan:Tanzil-Quran}. [[ayat/Al-Quran-5-3| Al-Ma'idah 3]] mencantumkan apa yang dilarang dimakan; bangkai, darah, babi, dan apa yang diperbolehkan bagi siapa pun selain Allah {at: Tanzil-Qur'an}. Kitab-kitab hadis menjelaskan larangan semua zat memabukkan {at: Sahih al-Bukhari 4343}, larangan keledai domestik dan hewan bergigi apa pun {cite: Sunan-abi-Dawud 3806}, serta pemenuhan paus, belalang, hati, dan limpa {cite: Sunan-ibn-Majah 3314}. Dalam hadis kadal, dikatakan bahwa Nabi makan di mejanya tetapi tidak makan dari kotoran {atribusi: sunan-abi-davud 3793}."
