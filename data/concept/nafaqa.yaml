label: { ar: "النَّفَقَة", en: "Nafaqa (maintenance)", ur: "نفقہ (کفالت اور خرچ)" }
summary:
  ar: "النفقة في اللغة ما يُنفق، وفي الاصطلاح ما به قوام الإنسان المعتاد دون إسراف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15863} وتجب بثلاثة أسباب: النكاح، والقرابة، والملك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15863} ونفقة الزوجة واجبة على زوجها بالكتاب والسنة والإجماع، وتجب بالعقد عند قول، وبالتمكين عند جمهور المالكية والحنابلة والشافعية في الجديد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15864} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15865} وتقدر بالكفاية عند الحنفية والمالكية وأكثر الحنابلة، وبمقدار محدد عند الشافعية على المعتمد، ويراعى حال الزوج والزوجة في الغالب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15868} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15870} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15871} وتسقط بالنشوز وبالسفر بغير إذن على تفصيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15868} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15885} وتجب نفقة الأصول والفروع والحواشي بالقرابة بتفصيل المذاهب في الإنفاق والإرث والدين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15901} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15917} وتجب نفقة الحيوان على مالكه، ونفقة الرقيق على سيده، ونفقة العاجز الفقير في بيت المال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15923} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15929}"
  en: "Nafaqa, in the lexicon, is what is spent; as a term it is what a person needs to sustain life in the usual way without extravagance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15863} It is owed for three causes: marriage, kinship and ownership. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15863} A wife's maintenance is owed by her husband by the Qur'an, the Sunna and consensus; it is owed from the contract in one view and from her yielding herself in the Maliki, Hanbali and the new Shafi'i views. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15864} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15865} It is measured by sufficiency in the Hanafi, Maliki and most Hanbali views, and by a fixed measure in the Shafi'i view that is preferred; the means of both spouses are considered. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15868} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15870} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15871} It lapses through disobedience and by travel without permission, with details. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15868} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15885} Relatives' maintenance is owed between ascendants, descendants and collaterals, with the schools differing on who is included, on inheritance and on debt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15901} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15917} The animal's maintenance falls on its owner, a slave's on his master, and a poor man with no provider on the treasury. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15923} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15929}"
  ur: "نفقہ لغت میں خرچ ہونے والی چیز ہے، اور اصطلاح میں وہ کچھ جو انسان کی معمول کی زندگی کے لیے بغیر اسراف کے ضروری ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15863} تین اسباب سے واجب ہوتا ہے: نکاح، قرابت اور ملکیت۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15863} بیوی کا نفقہ شوہر پر قرآن، سنت اور اجماع سے واجب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15864} حنفیہ، مالکیہ اور اکثر حنابلہ کے نزدیک کفایت کے مطابق، اور شافعیہ کے معتمد قول میں مقررہ مقدار کے مطابق ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15868} قرابت داروں کا نفقہ فروع، اصول اور حواشی کے درمیان مذاہب کے اختلاف کے ساتھ واجب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15901} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15917} غلام کا نفقہ مالک پر، جانور کا نفقہ اس کے مالک پر، اور بے سہارا فقیر کا نفقہ بیت المال پر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15923} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15929}"
