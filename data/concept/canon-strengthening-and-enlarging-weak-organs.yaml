id: concept/canon-strengthening-and-enlarging-weak-organs
class: concept
kind: scientific
label: { ar: "تقوية الأعضاء الضعيفة وتعظيمها عند ابن سينا", en: "Strengthening and enlarging weak organs in the Canon", ur: "کمزور اعضا کو مضبوط اور بڑا کرنا قانون میں", es: "Fortalecimiento y agrandamiento de los órganos débiles en el Canon", fr: "Renforcement et développement des organes faibles dans le Canon" }
summary:
  ar: "يبين ابن سينا في الفصل الحادي عشر أن الأعضاء الضعيفة والصغيرة تقوى وتعظم بالتغذية فيمن هو في سن النمو، وبالدلك المعتدل والرياضة الخاصة ثم الطلاء بالزفت وحصر النفس في المسنين، ويضرب مثل ضامر الساق، ويحذر من الورم والدوالي وداء الفيل إذا ظهر اتساع العروق {cite:canon-ibn-sina-print-v1 p.242}."
  en: "In the eleventh chapter Ibn Sina shows that weak and small organs are strengthened and enlarged by nourishment in those still growing, and by moderate rubbing, the organ's own exercise, a coating of pitch and holding the breath in the old, takes the thin-shinned as his example, and warns of swelling, varicose veins and elephantiasis once widening of the vessels appears {cite:canon-ibn-sina-print-v1 p.242}."
  es: "En el capítulo once, Ibn Sina muestra que los órganos débiles y pequeños se fortalecen y agrandan mediante la nutrición en aquellos que aún están en crecimiento, y mediante el frotamiento moderado, el propio ejercicio del órgano, una capa de brea y contener la respiración en los ancianos, toma como ejemplo a los delgados y advierte sobre la hinchazón, las venas varicosas y la elefantiasis una vez que aparece el ensanchamiento de los vasos {cite:canon-ibn-sina-print-v1 p.242}."
  fr: "Dans le onzième chapitre, Ibn Sina montre que les organes faibles et petits sont renforcés et agrandis par la nourriture chez ceux qui sont encore en croissance, et par un frottement modéré, l'exercice propre à l'organe, un enduit de poix et la rétention du souffle chez les personnes âgées, prend les jambes minces comme exemple, et met en garde contre le gonflement, les varices et l'éléphantiasis une fois que l'élargissement des vaisseaux apparaît {cite:canon-ibn-sina-print-v1 p.242}."
  ur: "گیارہویں باب میں ابن سینا بتاتا ہے کہ کمزور اور چھوٹے اعضاء اب بھی بڑھنے والوں میں غذائیت سے مضبوط اور بڑے ہوتے ہیں، اور اعتدال سے رگڑنے سے، اعضاء کی اپنی ورزش، پچ کی تہہ لگانا اور بوڑھے میں سانس روکنا، پتلی پنڈلیوں کو اپنی مثال کے طور پر لیتا ہے، اور سوجن، سیلینس اور چوڑے ہونے سے خبردار کرتا ہے۔ برتن ظاہر ہوتے ہیں {حوالہ:کینن-ابن سینا-پرنٹ-v1 p.242}۔"
