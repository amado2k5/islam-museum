summary:
  ar: "يبين ابن سينا في الفصل الحادي عشر أن الأعضاء الضعيفة والصغيرة تقوى وتعظم بالتغذية فيمن هو في سن النمو، وبالدلك المعتدل والرياضة الخاصة ثم الطلاء بالزفت وحصر النفس في المسنين، ويضرب مثل ضامر الساق، ويحذر من الورم والدوالي وداء الفيل إذا ظهر اتساع العروق {cite:canon-ibn-sina-print-v1 p.242}."
  en: "In the eleventh chapter Ibn Sina shows that weak and small organs are strengthened and enlarged by nourishment in those still growing, and by moderate rubbing, the organ's own exercise, a coating of pitch and holding the breath in the old, takes the thin-shinned as his example, and warns of swelling, varicose veins and elephantiasis once widening of the vessels appears {cite:canon-ibn-sina-print-v1 p.242}."
