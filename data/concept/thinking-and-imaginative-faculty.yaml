summary:
  ar: "القوة الثانية من الباطنة هي التي يسميها الأطباء مفكرة ويسميها المحققون تارة متخيلة وتارة مفكرة، وهي تتصرف في ما خزن الخيال بالتركيب والتفصيل، ومسكنها البطن الأوسط من الدماغ {cite:canon-ibn-sina-print-v1 p.100}."
  en: "The second of the inner powers is what physicians call the thinking faculty and the verifiers call at times imaginative and at times thinking; it works on what imagination has stored by composing and dividing, and its seat is the middle ventricle of the brain {cite:canon-ibn-sina-print-v1 p.100}."
