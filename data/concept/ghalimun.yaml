summary:
  ar: "غالمون في الكتاب دواء طيب الرائحة لونه لون السفرجل، يجمد اللبن وقوته مجففة مع حدة يسيرة، وزهره نافع لانفجار الدم، ويذكر الكتاب أنه قد يظن أنه يشفي من حرق؛ وبه يختم حرف الغين وهو آخر الكتاب الثاني {cite:canon-ibn-sina-print-v1 p.727}"
  en: "Ghalimun is in the book a sweet-smelling drug the colour of the quince, which congeals milk, its power drying with a little sharpness, and its flower is beneficial for the bursting forth of blood; the book says it may be thought that it heals from a burn; with it the letter ghayn closes, and with it the end of Book II {cite:canon-ibn-sina-print-v1 p.727}"
  ur: "غالمون کتاب میں ایک خوشبودار دوا ہے جس کا رنگ بہی کا سا ہے، دودھ کو جماتی ہے اور اس کی قوت خشک کرنے والی ہے اور تھوڑی تیزی کے ساتھ، اور اس کا پھول خون کے پھوٹ پڑنے کے لیے فائدہ مند ہے؛ کتاب کہتی ہے کہ گمان کیا جاتا ہے کہ یہ جلنے سے شفا دیتی ہے؛ اس پر حرف غین ختم ہوتا ہے اور کتاب دوم کا اختتام {cite:canon-ibn-sina-print-v1 p.727}۔"
  es: "Ghalimun es, según el libro, una droga de aroma dulce, del color del membrillo, que coagula la leche, cuyo poder seca con un ligero picor, y cuya flor es beneficiosa para la hemorragia; el libro dice que puede pensarse que cura las quemaduras; con ella se cierra la carta ghayn, y con ella el final del Libro II {cite:canon-ibn-sina-print-v1 p.727}"
