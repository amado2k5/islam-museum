summary:
  ar: "الحُضَض صمغ عصارة نبات متشوّك؛ الهندي أقوى في الشعر وتقويته، والمكّي في الأورام، وفي الهندي تحليل وقبض يسير ينفع كل نزف، ويُنسب إليه أيضاً تنقية القلاع وقروح الأذن واللثة والعين."
  en: "Hudad is a resin drawn from a thorny plant. The Indian kind is stronger for hair and for strengthening it, the Meccan kind for swellings. The Indian has a slight dissolving and astringent action that helps every bleeding, and the book lists uses for thrush, ear and gum ulcers, and the eye."
  ur: "حضض ایک کانٹے دار پودے کا رس یا صمغ ہے؛ ہندی قسم بالوں اور ان کی مضبوطی کے لیے زیادہ قوی ہے، مکی قسم سوجن میں۔ ہندی میں ہلکی تحلیل اور کسیلاپن ہے جو ہر طرح کے خون بہنے میں نفع دیتا ہے، اور کتاب اس کے فوائد زبان کے چھالوں، کان اور مسوڑھوں کے زخموں اور آنکھ میں درج کرتی ہے۔"
  es: "El hudad es una resina extraída de una planta espinosa. La variedad india es más potente para el cabello y para fortalecerlo, mientras que la de La Meca se utiliza para reducir la hinchazón. La variedad india tiene una ligera acción disolvente y astringente que ayuda a detener cualquier sangrado, y el libro menciona usos para la candidiasis oral, las úlceras de oído y encías, y los ojos."
  fr: "L'hudad est une résine extraite d'une plante épineuse. La variété indienne est plus puissante pour fortifier les cheveux, tandis que la variété mecquoise est utilisée pour traiter les gonflements. L'hudad indienne possède de légères propriétés dissolvantes et astringentes qui aident à arrêter les saignements. L'ouvrage mentionne également son utilisation contre le muguet, les ulcères de l'oreille et des gencives, ainsi que les affections oculaires."
  tr: "El-Hadhh, sukulent bitkisinin özsuyunun özsuyudur; Hint saçı daha güçlü ve güçlendirir, ayrıca tüm kanamalara yardımcı olan hafif bir çözülme ve kasılmadır. Ayrıca arındırıcı sardıçlar, kulak, diş eti ve göz ülserlerini arındırmakla da tanınır."
  id: "Al-Hadhdh adalah getah dari tanaman sukulen; tanaman India lebih kuat pada rambut dan memperkuatnya, serta merupakan pelarutan dan kontraksi ringan yang membantu mengatasi semua pendarahan. Al-Hadhdh juga dikenal memurnikan sarias, telinga, gusi, dan luka mata."
