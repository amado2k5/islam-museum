label:
  ar: "الأنفحة"
  en: "Anfaha (rennet)"
  fr: "Anfaha (présure)"
  ur: "انفحہ ⁦(رینِٹ)⁩"
  es: "Anfaha (cuajo)"
  tr: "puff"
  id: "puff"
summary:
  ar: "الأنفحة في الكتاب أنافح كثيرة تُذكر كل واحدة في باب حيوانها، وأجودها في نوعها أنفحة الأرنب، وكلها حارّة يابسة نارية، تحلّل كل جامد من دم ولبن متجبّن وخلط غليظ، وتجمّد كل ذائب، وهي مقطّعة ملطّفة؛ تنفع من الصرع، وتحلّل الدم الجامد في الرئة والمعدة وهي رديئة للمعدة، وتنفع قروح الأمعاء، وكلها بادزهرية تنفع من الشوكران؛ ويذكر الكتاب فيها أقوالاً عن نزف النساء والحبل والرحم في فقرة موسومة معلّقة لحكم المؤسس {cite:canon-ibn-sina-print-v1 p.353}"
  en: "In the book anfahah (rennet) is many rennets, each mentioned in the chapter of its animal, the best of its kind being the hare's rennet; all are hot, dry and fiery, dissolving every clot of blood, curdled milk and thick humour, and solidifying everything that is liquid, cutting and refining; they are listed for epilepsy, they dissolve clotted blood in the lung and stomach but are bad for the stomach, they help ulcers of the intestines, and all are antidotes and help against hemlock; the book also gives statements on women's bleeding, conception and the womb in a labelled section held for the founder's ruling {cite:canon-ibn-sina-print-v1 p.353}"
  fr: "Le livre distingue de nombreuses présures (anfahah), chacune traitée au chapitre de l’animal dont elle provient ; celle du lièvre y est donnée pour la meilleure. Toutes sont dites chaudes, sèches et ignées : elles dissoudraient les caillots de sang, le lait caillé et les humeurs épaisses, solidifieraient tout liquide et auraient des propriétés incisives et atténuantes. Le livre en fait mention à propos de l’épilepsie et des ulcères intestinaux ; il leur attribue la faculté de dissoudre le sang coagulé dans le poumon et l’estomac, tout en les disant mauvaises pour l’estomac. Il les donne toutes pour des antidotes, notamment contre la ciguë. Il rapporte aussi des affirmations sur les saignements des femmes, la conception et la matrice dans une section signalée et réservée à la décision du fondateur {cite:canon-ibn-sina-print-v1 p.353}"
  ur: "انفحہ کتاب میں بہت سی انفحہ ہیں جن میں سے ہر ایک اپنے جانور کے باب میں ذکر ہوگی، اور اپنی نوع میں بہترین خرگوش کی انفحہ ہے، سب گرم خشک اور آتشی ہیں، ہر جمی ہوئی چیز کو، خون، جما ہوا دودھ اور گاڑھا خلط، تحلیل کرتی ہیں، اور ہر پگھلی چیز کو جماتی ہیں، کاٹنے اور لطیف کرنے والی ہیں؛ مرگی میں مذکور ہیں، پھیپھڑے اور معدے کے جمے ہوئے خون کو تحلیل کرتی ہیں مگر معدے کے لیے بری ہیں، آنتوں کے زخموں میں مفید ہیں، اور سب بادزہر ہیں اور شوکران میں مفید ہیں؛ کتاب عورتوں کے خون بہنے، حمل اور رحم کے بارے میں اقوال موسوم حصے میں دیتی ہے جو بانی کے فیصلے کے لیے موقوف ہے {cite:canon-ibn-sina-print-v1 p.353}۔"
  es: "En el libro anfahah (cuajo) se mencionan muchos tipos de cuajo, cada uno en el capítulo de su animal correspondiente, siendo el mejor de su clase el cuajo de liebre. Todos son calientes, secos y ardientes, disuelven todo coágulo de sangre, leche cuajada y humor espeso, y solidifican todo lo líquido, cortando y refinando. Se mencionan para la epilepsia, disuelven la sangre coagulada en los pulmones y el estómago, pero son perjudiciales para el estómago, ayudan con las úlceras intestinales y todos son antídotos y ayudan contra la cicuta. El libro también incluye declaraciones sobre el sangrado femenino, la concepción y el útero en una sección dedicada a la decisión del fundador {cite:canon-ibn-sina-print-v1 p.353}."
  tr: "Kitaptaki şişme suffah, her biri kendi hayvanıyla ilgili bölümde bahsedilen birçok koklayıcıdan oluşur ve türünün en iyisi tavşan suffahıdır; hepsi kuru, ateşli ve kan, iri süt ve yoğun karışımdan oluşan katı şeyleri çürür, erimiş tüm şeyleri dondurur. Dilimlenir ve yumuşatılırlar; epilepsi için faydalıdırlar ve akciğerler ile midede katı kanı çözer, bunlar mide için zararlıdır ve bağırsak ülserleri için faydalıdır. Hepsi agacon'dan faydalanan girdap formundadır; kitap, 'Kurucu Kuralına Asmak' başlıklı bölümde kadınlardan, rahimden ve rahimden kanama ifadeleri yer alır {cite:canon-ibn-sina-print-v1 s.353}"
  id: "Alat tiup dalam buku ini adalah banyak alat pencium, masing-masing disebutkan dalam bab tentang hewannya, dan yang terbaik dari jenisnya adalah suffah kelinci, semuanya kering, berapi, dan membusuk semua benda padat yang terbuat dari darah, susu kasar, dan campuran kental, serta membekukan semua benda yang meleleh. Mereka diiris dan dilunakkan; bermanfaat untuk epilepsi, dan melarutkan darah padat di paru-paru dan lambung, yang buruk untuk lambung, dan bermanfaat untuk tukak lambung usus. Semua benda tersebut berbentuk pusaran yang mendapat manfaat dari agacon; buku ini menyebutkan pernyataan tentang pendarahan dari wanita, rahim, dan rahim dalam bagian berjudul 'Hanging on the Founder's Rule {cite:canon-ibn-sina-print-v1 hlm.353}"
