class: concept
kind: legal
label:
  ar: "الركن"
  en: "Rukn (pillar): what an act cannot exist without, as against the condition and the obligation; the pillars of worship and of contracts; and the kissing of the corners of the Ka'ba"
  ur: "رکن"
  es: "Rukn (pilar): aquello sin lo cual un acto no puede existir, en contra de la condición y la obligación; los pilares del culto y de los contratos; y el beso de las esquinas de la Kaaba."
  fr: "Rukn (pilier): ce sans quoi un acte ne peut exister, par opposition à la condition et à l'obligation; les piliers du culte et des contrats; et le baiser des angles de la Kaaba"
summary:
  ar: "الركن في اللغة الجانب الأقوى والأمر العظيم، وفي الاصطلاح ما لا وجود للشيء إلا به، وهو جزء الماهية، ويفرق عن الشرط وهو الخارج عن المسمى، وعن الفرض والواجب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8955} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8956} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8957} ويفرّق الفقهاء بين أركان الحج والعمرة، فمن ترك ركنا لم يتم نسكه، ومن ترك واجبا جبره بالدم، وكذلك في الصلاة عند الحنفية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8957} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8958} وتختلف أركان الوضوء والتيمم والصلاة والصيام والاعتكاف والحج بين المذاهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8958} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8959} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8960} وفي العقود يرى الجمهور أن لكل عقد ثلاثة أركان: الصيغة والعاقدان والمعقود عليه، ويرى الحنفية أن ركنه الصيغة وحدها، ويؤدي تخلف الركن إلى البطلان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8960} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8961} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8962} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8963} ويستحب استلام الحجر الأسود والركن اليماني واستقبالهما بالإشارة عند الزحام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8963} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8964} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8965} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8966}"
  en: "Rukn in the lexicon is the strongest side and the great matter; technically it is what a thing cannot exist without, the part of its essence, as against the condition, which is outside the essence, and against the obligation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8955} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8956} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8957} A pilgrim who leaves a pillar of the pilgrimage does not complete his rite; one who leaves an obligation makes it good by a sacrifice, and the Hanafis and Hanbalis apply this to prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8957} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8958} The pillars of ablution, tayammum, prayer, fasting, i'tikaf and pilgrimage differ between the schools. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8958} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8959} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8960} In contracts the majority hold that each has three pillars, the formula, the two parties and the object, while the Hanafis hold the formula alone; the lack of a pillar makes the contract void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8960} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8961} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8962} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8963} The sunna is to touch or kiss the Black Stone and the Yemeni corner, and to point to them from afar when crowded. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8963} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8964} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8965} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8966}"
  ur: "رکن کسی چیز کا وہ جزء ہے جس کے بغیر اس کا وجود نہ ہو؛ عبادات اور عقود کے ارکان مذاہب کے مطابق مختلف ہیں، اور رکن کی کمی سے عبادت یا عقد باطل ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8955} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8957} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8962} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8963}"
  es: "Rukn en el léxico es el lado más fuerte y la gran materia; técnicamente es aquello sin lo cual una cosa no puede existir, la parte de su esencia, en contraposición a la condición, que está fuera de la esencia, y en contra de la obligación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8955} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8956} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8957} Un peregrino que deja un pilar de la peregrinación no completa su rito; quien deja una obligación la cumple mediante un sacrificio, y los hanafíes y hanbalíes aplican esto a la oración. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8957} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8958} Los pilares de la ablución, tayammum, oración, ayuno, i'tikaf y peregrinación difieren entre las escuelas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8958} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8959} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8960} En los contratos la mayoría sostiene que cada uno tiene tres pilares, la fórmula, las dos partes y el objeto, mientras que los Hanafi mantenga la fórmula sola; la falta de un pilar anula el contrato. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8960} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8961} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8962} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8963} La sunna es tocar o besar la Piedra Negra y la esquina yemení, y señalarlas desde lejos cuando hay mucha gente. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8963} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8964} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8965} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8966}"
  fr: "Dans le lexique, « rukn » désigne l’élément le plus important et la matière première; techniquement, il s’agit de ce sans quoi une chose ne peut exister, une partie de son essence, par opposition à la condition, qui est extérieure à l’essence, et à l’obligation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8955} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8956} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8957} Un pèlerin qui néglige un pilier du pèlerinage n’achève pas son rite; celui qui manque une obligation la rattrape par un sacrifice, et les écoles hanafite et hanbalite appliquent ce principe à la prière. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8957} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8958} Les piliers des ablutions, du tayammum, de la prière, du jeûne, de l'i'tikaf et du pèlerinage diffèrent selon les écoles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8958} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8959} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8960} Dans les contrats, la majorité considère que chacun a trois piliers, la formule, les deux parties et l'objet, tandis que les Hanafis tenir la formule seule; l'absence de pilier rend le contrat nul. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8960} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8961} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8962} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8963} La sunna est de toucher ou d'embrasser la Pierre Noire et le coin yéménite, et de les montrer du doigt de loin lorsqu'il y a foule. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8963} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8964} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8965} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8966}"
