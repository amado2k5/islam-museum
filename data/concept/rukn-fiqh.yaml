label:
  ar: "الركن"
  en: "Rukn (pillar): what an act cannot exist without, as against the condition and the obligation; the pillars of worship and of contracts; and the kissing of the corners of the Ka'ba"
  ur: "رکن"
summary:
  ar: "الركن في اللغة الجانب الأقوى والأمر العظيم، وفي الاصطلاح ما لا وجود للشيء إلا به، وهو جزء الماهية، ويفرق عن الشرط وهو الخارج عن المسمى، وعن الفرض والواجب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8955} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8956} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8957} ويفرّق الفقهاء بين أركان الحج والعمرة، فمن ترك ركنا لم يتم نسكه، ومن ترك واجبا جبره بالدم، وكذلك في الصلاة عند الحنفية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8957} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8958} وتختلف أركان الوضوء والتيمم والصلاة والصيام والاعتكاف والحج بين المذاهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8958} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8959} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8960} وفي العقود يرى الجمهور أن لكل عقد ثلاثة أركان: الصيغة والعاقدان والمعقود عليه، ويرى الحنفية أن ركنه الصيغة وحدها، ويؤدي تخلف الركن إلى البطلان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8960} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8961} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8962} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8963} ويستحب استلام الحجر الأسود والركن اليماني واستقبالهما بالإشارة عند الزحام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8963} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8964} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8965} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8966}"
  en: "Rukn in the lexicon is the strongest side and the great matter; technically it is what a thing cannot exist without, the part of its essence, as against the condition, which is outside the essence, and against the obligation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8955} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8956} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8957} A pilgrim who leaves a pillar of the pilgrimage does not complete his rite; one who leaves an obligation makes it good by a sacrifice, and the Hanafis and Hanbalis apply this to prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8957} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8958} The pillars of ablution, tayammum, prayer, fasting, i'tikaf and pilgrimage differ between the schools. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8958} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8959} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8960} In contracts the majority hold that each has three pillars, the formula, the two parties and the object, while the Hanafis hold the formula alone; the lack of a pillar makes the contract void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8960} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8961} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8962} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8963} The sunna is to touch or kiss the Black Stone and the Yemeni corner, and to point to them from afar when crowded. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8963} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8964} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8965} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8966}"
  ur: "رکن کسی چیز کا وہ جزء ہے جس کے بغیر اس کا وجود نہ ہو؛ عبادات اور عقود کے ارکان مذاہب کے مطابق مختلف ہیں، اور رکن کی کمی سے عبادت یا عقد باطل ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8955} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8957} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8962} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8963}"
