id: concept/ilm-al-dabt
class: concept
kind: discipline
label:
  ar: "علم الضبط: ضبط المصحف بالشكل والعلامات"
  en: "The science of dabt: marking the codex with vowels and signs"
  ur: "علمِ ضبط: مصحف کو شکل اور علامات سے مضبوط کرنا"
summary:
  ar: "الضبط وضع علامات الحركات والتنوين والتشديد والسكون والمد والهمز في المصحف على ما يقتضي الأداء، وقد تناوله الداني في «المحكم» و«النقط»؛ ومن قواعده عنده أن لا يُنقط بالسواد وأن تكون الحركات بالحمرة والهمزات بالصفرة وألا تُجمع قراءات في مصحف واحد {cite:itqan-suyuti p. 2249} {cite:itqan-suyuti p. 2250}."
  en: "Dabt is setting the signs of vowels, tanwin, doubling, sukun, stretch and hamza in the codex as delivery requires; al-Dani treated it in al-Muhkam and al-Naqt, and among his rules are that it is not done in black, that the vowels are in red and the hamzas in yellow, and that readings are not combined in one codex {cite:itqan-suyuti p. 2249} {cite:itqan-suyuti p. 2250}."
  ur: "ضبط مصحف میں حرکات، تنوین، تشدید، سکون، مد اور ہمزہ کی علامات کو اس طرح رکھنا ہے جیسے ادا کا تقاضا ہو؛ دانی نے اسے «المحکم» اور «النقط» میں بیان کیا، اور ان کے قاعدوں میں ہے کہ سیاہی سے نقط نہ ہو، حرکات سرخ اور ہمزے زرد ہوں اور ایک مصحف میں قراءتیں جمع نہ کی جائیں {cite:itqan-suyuti p. 2249} {cite:itqan-suyuti p. 2250}۔"
