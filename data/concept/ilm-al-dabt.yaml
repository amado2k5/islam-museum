id: concept/ilm-al-dabt
class: concept
kind: discipline
label:
  ar: "علم الضبط: ضبط المصحف بالشكل والعلامات"
  en: "The science of dabt: marking the codex with vowels and signs"
  ur: "علمِ ضبط: مصحف کو شکل اور علامات سے مضبوط کرنا"
  es: "La ciencia del dabt: marcando el códice con vocales y signos."
  fr: "La science du dabt: le marquage du codex avec des voyelles et des signes"
  tr: "Standartlaştırma: Kur'an'ın Şekil ve Işaretler Haline Getirilmesi"
  id: "Standarisasi: Menetapkan Al-Quran dalam Bentuk dan Tanda-tanda"
summary:
  ar: "الضبط وضع علامات الحركات والتنوين والتشديد والسكون والمد والهمز في المصحف على ما يقتضي الأداء، وقد تناوله الداني في «المحكم» و«النقط»؛ ومن قواعده عنده أن لا يُنقط بالسواد وأن تكون الحركات بالحمرة والهمزات بالصفرة وألا تُجمع قراءات في مصحف واحد {cite:itqan-suyuti p. 2249} {cite:itqan-suyuti p. 2250}."
  en: "Dabt is setting the signs of vowels, tanwin, doubling, sukun, stretch and hamza in the codex as delivery requires; al-Dani treated it in al-Muhkam and al-Naqt, and among his rules are that it is not done in black, that the vowels are in red and the hamzas in yellow, and that readings are not combined in one codex {cite:itqan-suyuti p. 2249} {cite:itqan-suyuti p. 2250}."
  ur: "ضبط مصحف میں حرکات، تنوین، تشدید، سکون، مد اور ہمزہ کی علامات کو اس طرح رکھنا ہے جیسے ادا کا تقاضا ہو؛ دانی نے اسے «المحکم» اور «النقط» میں بیان کیا، اور ان کے قاعدوں میں ہے کہ سیاہی سے نقط نہ ہو، حرکات سرخ اور ہمزے زرد ہوں اور ایک مصحف میں قراءتیں جمع نہ کی جائیں {cite:itqan-suyuti p. 2249} {cite:itqan-suyuti p. 2250}۔"
  es: "Dabt consiste en colocar los signos de vocales, tanwin, duplicación, sukun, estiramiento y hamza en el códice según lo requiera la entrega; al-Dani lo trató en al-Muhkam y al-Naqt, y entre sus reglas están que no se haga en negro, que las vocales estén en rojo y las hamzas en amarillo, y que las lecturas no se combinen en un solo códice {cite:itqan-suyuti p. 2249} {cite:itqan-suyuti p. 2250}."
  fr: "Dabt place les signes des voyelles, du tanwin, du redoublement, du sukun, de l'étirement et du hamza dans le codex selon les exigences de la prononciation; al-Dani l'a traité dans al-Muhkam et al-Naqt, et parmi ses règles figurent le fait que cela ne se fait pas en noir, que les voyelles sont en rouge et les hamzas en jaune, et que les lectures ne sont pas combinées dans un seul codex {cite:itqan-suyuti p. 2249} {cite:itqan-suyuti p. 2250}."
  tr: "Düzeltme: Gösteri gereği Mushaf'a diyakritik işaretler, tanween, shaddah, sukoon, hanımefendi ve hamza işaretlerinin yerleştirilmesi. Al-Dani bunu 'Al-Muhkam' ve 'Al-Nuqta'da ele almıştır; kuralları arasında siyah nokta kullanmamak, kırmızı diyakritik işaretler, sarı hamza kullanmak ve okumaları tek bir Mushaf'ta birleştirmemek vardır {cite:itqan-suyuti s. 2249} {cite:itqan-suyuti s. 2250}."
  id: "Koreksi: Menempatkan tanda diakritik, tanween, shaddah, sukoon, madam, dan hamza dalam Mushaf sesuai dengan pertunjukan. Al-Dani membahas ini dalam 'Al-Muhkam' dan 'Al-Nuqta'; di antara aturannya adalah tidak boleh bertitik hitam, tidak memiliki tanda diakritik merah, hamza kuning, dan tidak menggabungkan pembacaan dalam satu Mushaf {cite:itqan-suyuti hlm. 2249} {cite:itqan-suyuti hlm. 2250}."
