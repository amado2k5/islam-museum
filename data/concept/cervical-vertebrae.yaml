id: concept/cervical-vertebrae
class: concept
kind: scientific
label: { ar: "فقار العنق عند ابن سينا", en: "The neck vertebrae in the Canon", ur: "قانون میں گردن کی کڑیاں", es: "Las vértebras cervicales en el Canon", fr: "Les vertèbres cervicales dans le canon", tr: "İbn Sina'ya göre boyun omurları", id: "Vertebra leher menurut Ibn Sina" }
summary:
  ar: "يقول ابن سينا إن العنق خُلق لأجل قصبة الرئة، وإن فقاره سبع، وإن الأولى والثانية منها لهما خواص ليست لغيرهما في حركة الرأس {cite:canon-ibn-sina-print-v1 pp.48-50}."
  en: "Ibn Sina says the neck was made for the sake of the windpipe, that its vertebrae are seven, and that the first and second have properties the others lack, in the movement of the head {cite:canon-ibn-sina-print-v1 pp.48-50}."
  es: "Ibn Sina dice que el cuello fue hecho para el bien de la tráquea, que sus vértebras son siete, y que la primera y la segunda tienen propiedades de las que carecen las demás en el movimiento de la cabeza {cite:canon-ibn-sina-print-v1 pp.48-50}."
  fr: "Ibn Sina dit que le cou a été fait pour la trachée, que ses vertèbres sont au nombre de sept et que la première et la deuxième ont des propriétés que les autres n'ont pas, dans le mouvement de la tête {cite:canon-ibn-sina-print-v1 pp.48-50}."
  ur: "ابن سینا کہتے ہیں کہ گردن کو ہوا کی نالی کی وجہ سے بنایا گیا تھا، کہ اس کے فقرے سات ہیں، اور یہ کہ پہلے اور دوسرے میں سر کی حرکت میں ایسی خصوصیات ہیں جن کی کمی ہے،"
  tr: "İbn Sina, boynun akciğer trakeası için yaratıldığını, omurlarının yedi omur olduğunu ve birinci ile ikinci omurların baş hareketinde başka hiçbir omurda olmayan özelliklere sahip olduğunu söyler {cite:canon-ibn-sina-print-v1 s.48-50}."
  id: "Ibn Sina mengatakan bahwa leher dibuat untuk trakea paru-paru, dan bahwa vertebranya memiliki tujuh, dan bahwa tulang belakang pertama dan kedua memiliki sifat yang tidak dimiliki oleh yang lain dalam gerakan kepala {cite:canon-ibn-sina-print-v1 hlm.48-50}."
