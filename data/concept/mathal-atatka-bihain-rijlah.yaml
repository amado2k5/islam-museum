label:
  ar: "مثل «أتتك بحائن رجلاه»"
  en: "The proverb 'His own feet brought a doomed man to you'"
  ur: "مثل «أتتک بحائن رجلاہ»"
  fr: "Le proverbe « Ses propres pieds t'ont amené un condamné »"
  es: "El proverbio «Sus propios pies te trajeron a un condenado»"
  tr: "Mesela \"Ayaklarının Zincirleri Sana Geldi\""
  id: "Seperti \"Rantai Kaki-Nya Telah Datang Kepadamu\""
summary:
  ar: "مثل يُضرب فيمن يسعى بقدميه إلى هلاكه، وقصته أن عبيد بن الأبرص دخل على المنذر في يوم بؤسه وهو لا يدري {cite:islamport-5454-58}."
  en: "A proverb for one who walks with his own feet into his doom; its tale is that Abid ibn al-Abras came to al-Mundhir on his day of ill-fortune without knowing it {cite:islamport-5454-58}."
  ur: "وہ مثل جو اپنے پاؤں سے ہلاکت کی طرف جانے والے کے لیے کہی جاتی ہے؛ اس کا قصہ یہ ہے کہ عبید بن الابرص انجانے میں منذر کے یوم بؤس پر اس کے دربار میں پہنچ گیا {cite:islamport-5454-58}۔"
  fr: "Proverbe dit de qui va de ses propres pieds à sa perte ; son histoire est qu'Abid ibn al-Abras entra chez al-Mundhir le jour de son malheur sans le savoir {cite:islamport-5454-58}."
  es: "Proverbio que se dice de quien va con sus propios pies a su perdición; su relato es que Abid ibn al-Abras entró en la corte de al-Mundhir en su día de infortunio sin saberlo {cite:islamport-5454-58}."
  tr: "Ayaklarıyla yıkım arayan biri hakkında bir mesel verilir. Hikayesi, Ubeyd bin el-Abras'ın mutsuzluk gününde farkında olmadan el-Mundhir'e girdiği anlatılır {atıf:islamport-5454-58}."
  id: "Sebuah perumpamaan diberikan tentang seseorang yang mencari kehancuran dengan kakinya. Kisahnya adalah bahwa Ubayd ibn al-Abras memasuki al-Mundhir pada hari penderitaannya tanpa menyadarinya {cite:islamport-5454-58}."
