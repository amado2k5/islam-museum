label:
  ar: "الحية"
  en: "Serpens (al-Hayya)"
  ur: "سانپ"
  es: "Serpens (al-Hayya)"
summary:
  ar: "يسمّي فهرس البتاني الصورة الحيّة التي يُمسكها الحاوي، ويضيف الشرح اللاتيني: الحية التي يمسكها السيقولوس. تبدأ كواكبها عند الصدغ قرب المنخرين، وتمتد عبر العنق، ويتابع الذيل في الصفحة التالية. لا تُنقل المواضع هنا. {cite:nallino-albatenii-opus-astronomicum pp.151}"
  en: "The catalogue names the serpent al-Hayya allati yumsikuha al-Hawi, with the Latin gloss serpens quem psyllus tenet, the serpent that the snake-charmer holds. Its stars run from the temple near the nostrils through the neck, and the tail continues onto the next page. Positions are not transcribed here. {cite:nallino-albatenii-opus-astronomicum pp.151}"
  ur: "فہرست میں سانپ کی صورت الحیۃ ہے جسے حاوی تھامے ہوئے ہے، اور لاطینی شرح serpens quem psyllus tenet درج ہے۔ اس کے ستارے سر کی جانب، ناک کے قریب سے گردن تک جاتے ہیں، اور دم کا حصہ اگلے صفحے پر ہے۔ مواضع یہاں نقل نہیں ہوئے۔ {cite:nallino-albatenii-opus-astronomicum pp.151}"
  es: "El catálogo nombra a la serpiente al-Hayya allati yumsikuha al-Hawi, con la glosa latina serpens quem psyllus tenet, la serpiente que sostiene el encantador de serpientes. Sus estrellas parten del templo, cerca de las fosas nasales, y se extienden hasta el cuello, y la cola continúa en la página siguiente. Las posiciones no se transcriben aquí. {cite:nallino-albatenii-opus-astronomicum pp.151}"
