label:
  ar: "حبّ السمنة"
  en: "Habb al-samna (the kardamana seed)"
  ur: "حب السمنہ ⁦(کردمانہ)⁩"
  es: "Habb al-samna (la semilla de kardamana)"
  fr: "Habb al-samna (la graine de kardamana)"
summary:
  ar: "حبّ السمنة ثمرة شجرة قفرية ذات ورق أبيض، ثمرها كالفلفل دهنيّ لبنيّ. حار إلى قليل رطوبة، يسمّن ويحسّن، ويبطؤ في المعدة فيكثر غذاؤه إذا انهضم. ويذكر الكتاب أنه يزيد في المني ويهيّج الباه، وهذا تقرير مُعلَّم. وحسب حاشية المحقّق هو الكردمانة."
  en: "Habb al-samna is the fruit of a desert shrub with pale leaves; the fruit is like pepper, oily and milky. It is hot with a little moisture, fattening and beautifying. It is slow in the stomach but gives much nourishment once digested. The book says it increases semen and stirs desire; that is a labelled listing set aside for the founder's ruling. The editor's note identifies it as kardamana."
  ur: "حب السمنہ ایک صحرائی جھاڑی کا پھل ہے جس کے پتے ہلکے رنگ کے ہوتے ہیں؛ پھل کالی مرچ جیسا، تیلی اور دودھیا ہوتا ہے۔ یہ گرم ہے اور اس میں تھوڑی تری ہے، فربہ کرتا اور نکھارتا ہے۔ معدے میں دیر سے ہضم ہوتا ہے مگر ہضم ہونے کے بعد زیادہ غذا دیتا ہے۔ کتاب کہتی ہے کہ یہ منی بڑھاتا اور خواہش ابھارتا ہے؛ یہ نشان زدہ بیان ہے۔ مدوّن کے حاشیے کے مطابق یہ کردمانہ ہے۔"
  es: "Habb al-samna es el fruto de un arbusto del desierto con hojas pálidas; su sabor es similar al de la pimienta, aceitoso y lechoso. Es picante, ligeramente húmedo, engorda y embellece. Es de digestión lenta, pero una vez digerido, proporciona mucha nutrición. El libro afirma que aumenta el semen y estimula el deseo; esta es una anotación reservada para la doctrina del fundador. La nota del editor lo identifica como kardamana."
  fr: "Habb al-samna est le fruit d'un arbuste du désert aux feuilles pâles; sa chair, semblable à celle du poivre, est huileuse et laiteuse. Chaud et légèrement humide, il est nourrissant et embellit. Sa digestion est lente, mais il apporte de nombreux nutriments. Le livre affirme qu'il augmente la production de sperme et stimule le désir; cette mention est attribuée au fondateur. La note de l'éditeur le désigne sous le nom de kardamana."
