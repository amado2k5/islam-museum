id: concept/istidlal-min-al-afal-al-harakiyya-wa-al-nawm
class: concept
kind: scientific
label:
  ar: "الاستدلال من الأفعال الحركية والنوم واليقظة"
  en: "Inference from the motor acts, sleep and waking"
  ur: "حرکی افعال، نیند اور بیداری سے استدلال"
  es: "Inferencia a partir de los actos motores, el sueño y la vigilia."
  fr: "Déduction à partir des actes moteurs, du sommeil et de l'éveil"
summary:
  ar: "يبين ابن سينا ما تدل عليه الأفعال الحركية بطلاناً وضعفاً وتغيراً، وما يدل عليه النوم واليقظة والسهر من رطوبة أو برد أو يبوسة {cite:canon-ibn-sina-print-v2 pp.14-15}"
  en: "Ibn Sina shows what the motor acts indicate when they fail, weaken or change, and what sleep, waking and sleeplessness indicate of moisture, cold or dryness {cite:canon-ibn-sina-print-v2 pp.14-15}"
  ur: "ابن سینا بتاتا ہے کہ حرکی افعال کے باطل، کمزور یا تبدیل ہونے سے، اور نیند، بیداری اور بے خوابی سے رطوبت، سردی یا خشکی میں سے کس پر دلالت ہوتی ہے {cite:canon-ibn-sina-print-v2 pp.14-15}۔"
  es: "Ibn Sina muestra lo que indican los actos motores cuando fallan, se debilitan o cambian, y lo que el sueño, la vigilia y el insomnio indican de humedad, frío o sequedad {cite:canon-ibn-sina-print-v2 pp.14-15}"
  fr: "Ibn Sina montre ce que les actes moteurs indiquent lorsqu'ils défaillent, s'affaiblissent ou changent, et ce que le sommeil, l'éveil et l'insomnie indiquent de l'humidité, du froid ou de la sécheresse {cite:canon-ibn-sina-print-v2 pp.14-15}"
