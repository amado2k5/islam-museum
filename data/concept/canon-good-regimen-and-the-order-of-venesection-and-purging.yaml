summary:
  ar: "يرى ابن سينا أن حسن التدبير يغني بالرياضة والدلك والحمام عن القيء والإسهال في الأكثر، وإذا أوجبت الضرورة فصداً أو دواء قوياً بدئ بالفصد، ويبدأ بالإسهال إن كانت الأخلاط لزجة باردة {cite:canon-ibn-sina-print-v1 p.276}."
  en: "Ibn Sina holds that a good regimen, with exercise, rubbing and the bath, often spares a person vomiting and purging; if need forces venesection or a strong drug, venesection comes first, but purging comes first when the humours are sticky and cold {cite:canon-ibn-sina-print-v1 p.276}."
