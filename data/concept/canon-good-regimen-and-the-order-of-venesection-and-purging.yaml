id: concept/canon-good-regimen-and-the-order-of-venesection-and-purging
class: concept
kind: scientific
label:
  ar: "حسن التدبير وترتيب الفصد والإسهال عند ابن سينا"
  en: "Good regimen and the order of venesection and purging in the Canon"
  fr: "Bon régime et ordre de saignée et purge dans le Canon"
  ur: "اچھی تدبیر اور فصد و اسہال کی ترتیب قانون میں"
  es: "Buen régimen y el orden de venesección y purga en el Canon"
summary:
  ar: "يرى ابن سينا أن حسن التدبير يغني بالرياضة والدلك والحمام عن القيء والإسهال في الأكثر، وإذا أوجبت الضرورة فصداً أو دواء قوياً بدئ بالفصد، ويبدأ بالإسهال إن كانت الأخلاط لزجة باردة {cite:canon-ibn-sina-print-v1 p.276}."
  en: "Ibn Sina holds that a good regimen, with exercise, rubbing and the bath, often spares a person vomiting and purging; if need forces venesection or a strong drug, venesection comes first, but purging comes first when the humours are sticky and cold {cite:canon-ibn-sina-print-v1 p.276}."
  fr: "Un bon régime avec exercice, friction et bain épargnerait souvent vomissement et purge ; si saignée ou remède fort s’impose, Ibn Sina place la saignée d’abord, sauf humeurs froides visqueuses où la purge précède {cite:canon-ibn-sina-print-v1 p.276}."
  es: "Ibn Sina sostiene que un buen régimen, con ejercicio, masajes y baños, a menudo evita que una persona vomite y purgue; si la necesidad obliga a realizar una flebotomía o administrar un medicamento fuerte, la flebotomía se realiza primero, pero la purga se realiza primero cuando los humores son pegajosos y fríos {cite:canon-ibn-sina-print-v1 p.276}."
  ur: "ابن سینا کا خیال ہے کہ ورزش، رگڑ اور غسل کے ساتھ ایک اچھا طریقہ انسان کو اکثر قے کرنے اور صاف کرنے سے بچاتا ہے۔ اگر ضرورت پڑنے پر نس نکالنے یا کسی مضبوط دوا کی ضرورت ہو تو وینیسیکشن پہلے آتا ہے، لیکن صاف کرنا پہلے اس وقت آتا ہے جب مزاح چپچپا اور ٹھنڈا ہو"
