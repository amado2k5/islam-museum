label:
  ar: "أثر الإقليم في البشر"
  en: "Climate's effect on people"
  fr: "L’effet du climat sur les populations"
  es: "Efecto del clima en las personas"
  ur: "لوگوں پر آب و ہوا کا اثر"
  tr: "Bölgenin İnsanlar Üzerindeki Etkisi"
  id: "Dampak Wilayah terhadap Manusia"
summary:
  ar: "قرر ابن خلدون أن الإقليم الرابع أعدل الأقاليم فيكون سكانه أعدل أجساماً وألواناً وأخلاقاً وأدياناً حتى النبوت إنما توجد في الأكثر فيها ولم يقف على خبر بعثة في الأقاليم الجنوبية ولا الشمالية، وأن السواد في أهل الإقليمين الأول والثاني من مزاج هوائهم للحرارة المتضاعفة بمسامتة الشمس رءوسهم مرتين في السنة لا لدعوة نوح على حام كما توهم بعض النسابين من حكاية القصاص، ودعاء نوح إنما كان أن يكون ولده عبيداً لولد إخوته وليس فيه ذكر السواد، وكذلك البياض والزعورة وزرقة العيون وصهوبة الشعور في أهل السادس والسابع من البرد المفرط، واستثنى جزيرة العرب من الانحراف لأن البحار أحاطت بها من ثلاث جهات فكان لرطوبتها أثر في رطوبة هوائها، وذكر أن أهل مالي وكوكو والتكرور المجاورين لأرض المغرب دانوا بالإسلام يقال في المائة السابعة {cite:muqaddima-ibn-khaldun p. 82-85}."
  en: "Ibn Khaldun's climatology: skin colour from solar exposure not Noah's curse, prophecy clustered in the temperate fourth clime {cite:muqaddima-ibn-khaldun p. 82-85}."
  fr: "La climatologie d’Ibn Khaldun : la couleur de peau vient de l’exposition au soleil, non de la malédiction de Noé ; la prophétie se concentre dans le quatrième climat, tempéré {cite:muqaddima-ibn-khaldun p. 82-85}."
  es: "Climatología de Ibn Khaldun: el color de la piel por la exposición solar no es la maldición de Noé, la profecía se agrupa en el cuarto clima templado {cite:muqaddima-ibn-khaldun p. 82-85}."
  ur: "ابن خلدون کی موسمیات: سورج کی روشنی سے جلد کا رنگ نوح کی لعنت نہیں، پیشن گوئی معتدل چوتھے موسم میں کلسٹرڈ ہے {حوالہ: مقدّمہ ابن خلدون صفحہ 82-85}۔"
  tr: "İbn Haldun, dördüncü bölgenin bölgeler arasında en adil olduğunu ve bu nedenle sakinlerinin beden, renk, ahlak ve din açısından en adil olduğunu, hatta peygamberlik bile çoğunda bulunduğunu düşündü. Güney veya kuzey bölgelerinde bir misyon haberini bulamadı. Birinci ve ikinci bölge halkları arasındaki karanlık, güneşin yılda iki kez başlarını delip geçmesiyle artan sıcaklık nedeniyle hava mizaçlarından kaynaklanıyor; bazı soybilimcilerin misilleme hikayesinden tahmin ettiği gibi Nuh'un Ham'a karşı yaptığı dua değil. Nuh'un duası, oğlunun kardeşlerinin çocuklarına köle olmasıydı ve bundan hiç bahsedilmez Siyah, ayrıca beyazlık, kısık gözler, mavi gözler ve aşırı soğukta altıncı ve yedinci aylarda gri saçlar vardı. Arap Yarımadası'nı sapmadan dışladı çünkü denizler üç tarafından çevrelenmişti, bu yüzden nemi havanın nemini etkiledi. Fas topraklarına komşu Mali, Koko ve Takrur halkının yedinci yüzyılda İslam'a geçtiği belirtilmiştir {atıf:muqaddima-ibn-khaldun, s. 82-85}."
  id: "Ibn Khaldun memutuskan bahwa wilayah keempat adalah yang paling adil di antara wilayah tersebut, sehingga penduduknya paling adil dalam tubuh, warna kulit, moral, dan agama, bahkan kenabian ditemukan di sebagian besar wilayah tersebut. Ia tidak menemukan kabar tentang misi di wilayah selatan atau utara. Kegelapan di antara penduduk wilayah pertama dan kedua disebabkan oleh temperamen udara mereka akibat panas yang semakin intens akibat matahari yang menusuk kepala mereka dua kali setahun, bukan karena doa Nuh melawan Ham seperti yang dibayangkan beberapa ahli silsilah dari kisah pembalasan. Doa Nuh adalah agar putranya menjadi budak bagi anak-anak saudara-saudaranya, dan tidak ada penyebutan tentang hal itu Hitam serta putih, mata biru menyipit, dan rambut abu-abu pada bulan keenam dan ketujuh akibat dingin ekstrem. Ia mengecualikan Semenanjung Arab dari penyimpangan karena laut mengelilinginya di tiga sisi, sehingga kelembapannya memengaruhi kelembapan udaranya. Disebutkan bahwa penduduk Mali, Koko, dan Takrur, yang bertetangga dengan tanah Maroko, memeluk Islam pada abad ketujuh {cite:muqaddima-ibn-khaldun, hlm. 82-85}."
