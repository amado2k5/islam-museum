id: concept/athar-al-iqlim
class: concept
kind: term
label: { ar: "أثر الإقليم في البشر", en: "Climate's effect on people" }
summary:
  ar: "قرر ابن خلدون أن الإقليم الرابع أعدل الأقاليم فيكون سكانه أعدل أجساماً وألواناً وأخلاقاً وأدياناً حتى النبوت إنما توجد في الأكثر فيها ولم يقف على خبر بعثة في الأقاليم الجنوبية ولا الشمالية، وأن السواد في أهل الإقليمين الأول والثاني من مزاج هوائهم للحرارة المتضاعفة بمسامتة الشمس رءوسهم مرتين في السنة لا لدعوة نوح على حام كما توهم بعض النسابين من حكاية القصاص، ودعاء نوح إنما كان أن يكون ولده عبيداً لولد إخوته وليس فيه ذكر السواد، وكذلك البياض والزعورة وزرقة العيون وصهوبة الشعور في أهل السادس والسابع من البرد المفرط، واستثنى جزيرة العرب من الانحراف لأن البحار أحاطت بها من ثلاث جهات فكان لرطوبتها أثر في رطوبة هوائها، وذكر أن أهل مالي وكوكو والتكرور المجاورين لأرض المغرب دانوا بالإسلام يقال في المائة السابعة {cite:muqaddima-ibn-khaldun p. 82-85}."
  en: "Ibn Khaldun's climatology: skin colour from solar exposure not Noah's curse, prophecy clustered in the temperate fourth clime {cite:muqaddima-ibn-khaldun p. 82-85}."
