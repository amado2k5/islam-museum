summary:
  ar: "تربد في الكتاب قطع خشب غلاظ ودقاق يؤتى بها من الهند، أجوده الأبيض غير المسوس الملتف كأنابيب القصب الدقيقة، الأملس السريع التفتت، ويورث استعماله يبسا وجفافا في البدن لأنه يخرج الرطوبات الرقيقة، ويسهل بلغما كثيرا وشيئا من الأخلاط المحرقة قليلا إذا أخذ مسحوقا وبالعكس مطبوخا، وفي الكتاب خلاف في ما يسهله من الأخلاط {cite:canon-ibn-sina-print-v1 p.692}"
  en: "Turbud is in the book pieces of wood, thick and thin, brought from India; the best is the white, unspoiled by worms, rolled like tubes of thin reed, smooth and quick to crumble; its use brings dryness and desiccation to the body because it draws out the thin moistures; it purges much phlegm and a little of the burnt humours when taken powdered, and the reverse when boiled, and the book gives differing views on which humours it loosens {cite:canon-ibn-sina-print-v1 p.692}"
  ur: "تربد کتاب میں لکڑی کے موٹے اور پتلے ٹکڑے ہیں جو ہندوستان سے لائے جاتے ہیں؛ سب سے اچھا سفید ہے جسے گھن نہ لگا ہو، باریک نرکل کی نلیوں کی طرح لپٹا ہوا، ہموار اور جلد ٹوٹنے والا؛ اس کا استعمال بدن میں خشکی اور سوکھاپن لاتا ہے کیونکہ یہ پتلی رطوبتوں کو نکالتا ہے؛ پسا ہوا لیں تو بہت بلغم اور جلی ہوئی خلطوں میں سے کچھ تھوڑا دست سے نکالتا ہے اور پکا کر اس کے برعکس، اور کتاب میں اس بارے میں اختلاف ہے کہ یہ کون سی خلطیں نکالتا ہے {cite:canon-ibn-sina-print-v1 p.692}۔"
  es: "En el libro, el turbud se presenta en trozos de madera, gruesos y delgados, traídos de la India; el mejor es el blanco, sin gusanos, enrollado como tubos de caña fina, liso y fácil de desmoronar; su uso produce sequedad y deshidratación en el cuerpo porque extrae la humedad; purga mucha flema y un poco de los humores quemados cuando se toma en polvo, y lo contrario cuando se hierve, y el libro ofrece diferentes opiniones sobre qué humores afloja {cite:canon-ibn-sina-print-v1 p.692}"
