summary:
  ar: "خاليدونيون في الكتاب قال بعضهم هو العروق ويقال له ماميران، وقال آخرون صغيرة الماميران، وكبيرة الزردجوق؛ منه جنس صغير حار مقرح، يمضغ أصله فيسكن وجع السن، وعصارته تحد البصر، وينقل الكتاب خبرا عن أم الخطاطيف التي تحمل هذا النبات إلى فرخها الأعمى فيرتد بصيرا، ولذلك سمي الخطافي؛ نقل منسوب إلى الكتاب لا توصية {cite:canon-ibn-sina-print-v1 p.716}"
  en: "Khalidoniyun is in the book said by some to be al-'uruq, called mamiran, and by others to be the small mamiran, the large being zardjuq; a small kind of it is hot and ulcerating, its root is chewed and calms toothache, its juice sharpens sight, and the book gives an account of the mother of the swallows bringing this plant to her blind young, who then regain sight, for which it is named al-khattafi; a report attributed to the book, not a recommendation {cite:canon-ibn-sina-print-v1 p.716}"
  ur: "خالیدونیون کتاب میں بعض کے نزدیک العروق ہے جسے مامیران کہتے ہیں، اور دوسروں نے کہا چھوٹا مامیران، اور بڑا زردجوق؛ اس کی ایک چھوٹی قسم گرم اور زخم ڈالنے والی ہے، اس کی جڑ چبائی جائے تو دانت کے درد کو تسکین دیتی ہے، اس کا رس نظر کو تیز کرتا ہے، اور کتاب ابابیلوں کی ماں کا ایک بیان نقل کرتی ہے جو یہ نبات اپنے اندھے بچے کے پاس لاتی ہے تو وہ بینا ہو جاتا ہے، اور اسی لیے اسے الخطافی کہا گیا؛ کتاب سے منسوب نقل، سفارش نہیں {cite:canon-ibn-sina-print-v1 p.716}۔"
  es: "En el libro, algunos dicen que Khalidoniyun es al-'uruq, llamado mamiran, y otros que es el mamiran pequeño, siendo el grande zardjuq; una variedad pequeña es caliente y ulcerante, su raíz se mastica y calma el dolor de muelas, su jugo agudiza la vista, y el libro relata que la madre de las golondrinas llevó esta planta a sus crías ciegas, quienes recuperaron la vista, por lo que se le llama al-khattafi; un relato atribuido al libro, no una recomendación {cite:canon-ibn-sina-print-v1 p.716}"
  fr: "Le Khalidoniyun est mentionné dans le livre par certains comme étant al-'uruq, appelé mamiran, et par d'autres comme étant le petit mamiran, le grand étant zardjuq; une petite variété est chaude et ulcérative, sa racine, mâchée, calme les maux de dents, son jus améliore la vue, et le livre relate l'histoire de la mère des hirondelles apportant cette plante à ses petits aveugles, qui recouvrent alors la vue, d'où son nom d'al-khattafi; un récit attribué au livre, et non une recommandation {cite:canon-ibn-sina-print-v1 p.716}"
  tr: "Kitaptaki Halidâniler, bazılarının bunun 'al-uruk' olduğunu ve 'Mamiran' olarak adlandırıldığını, diğerlerinin ise küçük 'mamiran' ve büyük zardjouk olduğunu; kökü diş ağrısını hafifletmek için ısırılan küçük, sıcak, ağrılı bir cins olduğunu ve suyunun görmeyi kısıtladığını belirtir. Kitap ayrıca el-hatafifin annesinin bu bitkiyi kör yavrusuna taşıyarak görme yüzünden tekrar başladığını da bildirir. Bu nedenle al-hattafi olarak adlandırılmıştır; tavsiye olmaksızın kitaba atfedilen bir transfer {cite:canon-ibn-sina-print-v1 s.716}"
  id: "Khalidoni dalam buku mengatakan beberapa mengatakan itu 'al-uruk' dan disebut 'Mamiran', sementara yang lain mengatakan itu adalah 'mamiran' kecil dan zardjouk besar; ini adalah genus kecil, panas, dan sakit yang akarnya digigit untuk meredakan sakit gigi, dan jusnya membatasi penglihatan. Buku ini juga melaporkan tentang ibu al-khatarif, yang membawa tanaman ini kepada anak keturunannya yang buta, menyebabkan tanaman itu kambuh saat penglihatan. Oleh karena itu disebut al-khattafi; transfer yang dikaitkan dengan buku tanpa rekomendasi {cite:canon-ibn-sina-print-v1 hlm.716}"
