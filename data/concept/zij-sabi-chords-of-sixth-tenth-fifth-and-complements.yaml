label: { ar: "أوتار السدس والعشر والخمس والقوس المتممة في الزيج الصابي", en: "Chords of a sixth, tenth, fifth and the complementary arc", ur: "سدس، عُشر اور خُمس کے اوتار اور قوسِ متممہ", es: "Acordes de sexta, décima, quinta y el arco complementario", fr: "Accords de sixte, de dixième, de quinte et l'arc complémentaire", tr: "Saba astronomik tablolarındaki altıncı, onuncu, beşinci ve tamamlayıcı yay kirişleri", id: "Busur panah keenam, kesepuluh, kelima, dan komplementer dalam tabel astronomi Sabaean." }
summary:
  ar: "يعلّم البتاني أن وتر القوس الباقية لتمام نصف الدائرة يُعلم بأن يضرب وتر القوس المعلومة في نفسه وينقص من القطر مضروباً في نفسه ويؤخذ جذر الباقي، وأن وتر ربع الدائرة جذر ضعف مربع نصف القطر، وأن وتر العُشر وتر الخُمس يُستخرجان بمعادلات ذكرها بمربعات نصف القطر وربعه وبالجذر. {cite:zij-sabi-nallino-byblion pp.17-18}."
  en: "Al-Battani teaches that the chord of the arc remaining to complete the semicircle is found by squaring the known arc's chord, subtracting it from the square of the diameter and taking the root of what remains; that the chord of a quarter of the circle is the root of twice the square of the radius; and that the chords of a tenth and a fifth come out by rules he gives with the squares of the radius and of its half and the root. {cite:zij-sabi-nallino-byblion pp.17-18}."
  ur: "البتانی سکھاتے ہیں کہ نصف دائرے کی تکمیل کے لیے باقی قوس کا وتر یوں معلوم ہوتا ہے کہ معلوم قوس کے وتر کو خود سے ضرب دیں، قطر کے مربع میں سے گھٹائیں اور باقی کا جذر لیں؛ ربع دائرہ کا وتر نصف قطر کے مربع کے دوگنے کا جذر ہے؛ اور عُشر اور خُمس کے اوتار نصف قطر اور اس کے نصف کے مربعوں اور جذر سے ان کے بتائے ہوئے قواعد کے مطابق نکلتے ہیں۔ {cite:zij-sabi-nallino-byblion pp.17-18}۔"
  es: "Al-Battani enseña que la cuerda del arco restante para completar el semicírculo se halla elevando al cuadrado la cuerda del arco conocido, restándola del cuadrado del diámetro y calculando la raíz cuadrada del resultado; que la cuerda de un cuarto de círculo es la raíz cuadrada del doble del cuadrado del radio; y que las cuerdas de una décima y una quinta parte se obtienen mediante reglas que él mismo establece con los cuadrados del radio y de su mitad, y la raíz cuadrada. {cite:zij-sabi-nallino-byblion pp.17-18}."
  fr: "Al-Battani enseigne que la corde de l'arc restant à compléter pour obtenir un demi-cercle se calcule en élevant au carré la corde de l'arc connu, en la soustrayant du carré du diamètre et en prenant la racine du résultat; que la corde d'un quart de cercle est la racine carrée du double du carré du rayon; et que les cordes d'un dixième et d'un cinquième de cercle se calculent selon les règles qu'il donne, à partir des carrés du rayon et de sa moitié, et de la racine carrée. {cite:zij-sabi-nallino-byblion pp.17-18}."
  tr: "El-Battani, yarım daireyi tamamlamak için kalan yayın kirişinin, bilinen yay kirişinin kendisiyle çarpılması, çapın kendisiyle çarpımının çıkarılması ve kalanın karekökünün alınmasıyla bulunduğunu öğretir. Ayrıca, çeyrek dairenin kirişinin yarıçapın karesinin iki katının karekökü olduğunu ve onda bir ve beşte bir dairelerin kirişlerinin, yarıçapın, çeyreğinin ve karekökünün karelerini içeren bahsettiği denklemler kullanılarak bulunduğunu belirtir. {cite:zij-sabi-nallino-byblion pp.17-18}."
  id: "Al-Battani mengajarkan bahwa tali busur dari busur yang tersisa untuk melengkapi setengah lingkaran ditemukan dengan mengalikan tali busur yang diketahui dengan dirinya sendiri, mengurangi diameter yang dikalikan dengan dirinya sendiri, dan mengambil akar kuadrat dari sisanya. Ia juga menyatakan bahwa tali busur seperempat lingkaran adalah akar kuadrat dari dua kali kuadrat jari-jari, dan bahwa tali busur sepersepuluh dan seperlima lingkaran ditemukan menggunakan persamaan yang ia sebutkan yang melibatkan kuadrat jari-jari, seperempat lingkaran, dan akar kuadratnya. {cite:zij-sabi-nallino-byblion pp.17-18}."
