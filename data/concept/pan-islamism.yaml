id: concept/pan-islamism
class: concept
kind: political
label: { ar: "الجامعة الإسلامية", en: "Pan-Islamism" }
summary:
  ar: "يعرض شكيب أرسلان في الفصل الثاني من الكتاب فكرة «الجامعة الإسلامية» بوصفها حركة سياسية دينية قامت على شعور مشترك بين المسلمين في وجه التوسع الأوروبي. يتتبع أصولها في الدعوة الوهابية وفي دعوة جمال الدين الأفغاني، ويذكر دعاة مثل عالي باشا، ويصف تعاون الحركات الدينية في الهند وآسيا الوسطى وشرق آسيا وشمال أفريقيا، ويعرض أثر الحرب الروسية اليابانية سنة 1904 على الابتهاج بانتصار اليابان. ويرى أن الجامعة الإسلامية تقوم على رابطة اجتماعية وخلقية أكثر من كونها دينية وحسب، ويُعد من أدواتها الصحافة والمواصلات. ويقرّ أرسلان بأن الحركة اتخذت مسارات متعددة ومتعارضة، وأن تأثيرها تراجع حين تقدمت القومية. هذا عرض لتصور المؤلف، لا تقييم محايد للحركة."
  en: "In the second chapter Arslan treats Pan-Islamism as a religious and political movement grounded in a shared feeling among Muslims against European expansion. He traces its roots to the Wahhabi call and to Jamal al-Din al-Afghani, mentions propagandists such as Ali Pasha, and describes how religious movements from India to Central Asia, East Asia and North Africa were linked. He records the wave of Muslim pride at Japan's victory in 1904, and argues that the bond is social and moral as much as religious. He notes that the movement's influence declined as nationalism grew. This is the author's account, not a neutral assessment."
