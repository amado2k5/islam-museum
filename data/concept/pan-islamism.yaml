label: { ar: "الجامعة الإسلامية", en: "Pan-Islamism", es: "Panislamismo", fr: "Panislamisme", ur: "پان اسلام ازم", tr: "İslam Üniversitesi", id: "Universitas Islam" }
summary:
  ar: "يعرض شكيب أرسلان في الفصل الثاني من الكتاب فكرة «الجامعة الإسلامية» بوصفها حركة سياسية دينية قامت على شعور مشترك بين المسلمين في وجه التوسع الأوروبي. يتتبع أصولها في الدعوة الوهابية وفي دعوة جمال الدين الأفغاني، ويذكر دعاة مثل عالي باشا، ويصف تعاون الحركات الدينية في الهند وآسيا الوسطى وشرق آسيا وشمال أفريقيا، ويعرض أثر الحرب الروسية اليابانية سنة 1904 على الابتهاج بانتصار اليابان. ويرى أن الجامعة الإسلامية تقوم على رابطة اجتماعية وخلقية أكثر من كونها دينية وحسب، ويُعد من أدواتها الصحافة والمواصلات. ويقرّ أرسلان بأن الحركة اتخذت مسارات متعددة ومتعارضة، وأن تأثيرها تراجع حين تقدمت القومية. هذا عرض لتصور المؤلف، لا تقييم محايد للحركة."
  en: "In the second chapter Arslan treats Pan-Islamism as a religious and political movement grounded in a shared feeling among Muslims against European expansion. He traces its roots to the Wahhabi call and to Jamal al-Din al-Afghani, mentions propagandists such as Ali Pasha, and describes how religious movements from India to Central Asia, East Asia and North Africa were linked. He records the wave of Muslim pride at Japan's victory in 1904, and argues that the bond is social and moral as much as religious. He notes that the movement's influence declined as nationalism grew. This is the author's account, not a neutral assessment."
  es: "En el segundo capítulo, Arslan aborda el panislamismo como un movimiento religioso y político basado en un sentimiento compartido entre los musulmanes contra la expansión europea. Rastrea sus raíces hasta el llamado wahabí y a Jamal al-Din al-Afghani, menciona a propagandistas como Ali Pasha y describe cómo se vincularon los movimientos religiosos desde la India hasta Asia Central, Asia Oriental y el Norte de África. Documenta la oleada de orgullo musulmán tras la victoria de Japón en 1904 y argumenta que el vínculo es tanto social y moral como religioso. Señala que la influencia del movimiento disminuyó a medida que crecía el nacionalismo. Esta es la interpretación del autor, no una valoración neutral."
  fr: "Dans le deuxième chapitre, Arslan analyse le panislamisme comme un mouvement religieux et politique fondé sur un sentiment partagé par les musulmans contre l'expansion européenne. Il en retrace les origines jusqu'à l'appel wahhabite et à Jamal al-Din al-Afghani, mentionne des propagandistes tels qu'Ali Pacha et décrit les liens entre les mouvements religieux, de l'Inde à l'Asie centrale, en passant par l'Asie orientale et l'Afrique du Nord. Il relate la vague de fierté musulmane suscitée par la victoire du Japon en 1904 et soutient que ce lien est autant social et moral que religieux. Il constate que l'influence du mouvement a décliné avec la montée du nationalisme. Il s'agit là du point de vue de l'auteur, et non d'une analyse neutre."
  ur: "دوسرے باب میں ارسلان پان اسلام ازم کو ایک مذہبی اور سیاسی تحریک کے طور پر دیکھتا ہے جس کی بنیاد مسلمانوں میں یورپی توسیع کے خلاف مشترکہ احساس پر ہے۔ وہ اس کی جڑیں وہابی دعوت اور جمال الدین الافغانی سے ڈھونڈتے ہیں، علی پاشا جیسے پروپیگنڈوں کا تذکرہ کرتے ہیں، اور بتاتے ہیں کہ ہندوستان سے لے کر وسطی ایشیا، مشرقی ایشیا اور شمالی افریقہ تک مذہبی تحریکیں کس طرح منسلک تھیں۔ وہ 1904 میں جاپان کی فتح پر مسلم فخر کی لہر کو ریکارڈ کرتا ہے، اور دلیل دیتا ہے کہ یہ رشتہ اتنا ہی سماجی اور اخلاقی ہے جتنا مذہبی۔ وہ نوٹ کرتا ہے کہ قوم پرستی کے بڑھنے کے ساتھ ہی تحریک کا اثر کم ہوا۔ یہ مصنف کا بیان ہے، غیر جانبدارانہ تشخیص نہیں۔"
  tr: "Kitabın ikinci bölümünde, Shakib Arslan, 'İslami Üniversitesi' fikrini, Avrupa genişlemesi karşısında Müslümanlar arasında paylaşılan bir duyguya dayanan siyasi-dini bir hareket olarak sunar. Kökenlerini Vahhabi çağrısı ve Cemaleddin el-Afgan'ın çağrısında izler, Ali Paşa gibi vaizlerden bahseder, Hindistan, Orta Asya, Doğu Asya ve Kuzey Afrika'daki dini hareketlerin iş birliğini anlatır ve 1904 Rus-Japon Savaşı'nın Japonya'nın zafer sevincine etkisini sunar. İslam Üniversitesi'ni sadece dini değil, daha çok sosyal ve ahlaki bir bağa dayanan bir şey olarak görür ve gazetecilik ile ulaşımı araçları olarak görür. Arslan, hareketin çok sayıda ve çelişkili yol izlediğini ve milliyetçilik ilerledikçe etkisinin azaldığını kabul eder. Bu, yazarın vizyonunun bir sunumudur, hareketin tarafsız bir değerlendirmesi değildir."
  id: "Dalam bab kedua buku ini, Shakib Arslan menyajikan gagasan 'Universitas Islam' sebagai gerakan politik-agama yang didasarkan pada perasaan bersama di antara umat Muslim menghadapi ekspansi Eropa. Ia menelusuri asal-usulnya dari seruan Wahhabi dan seruan Jamal al-Din al-Afghani, menyebut para pengkhotbah seperti Ali Pasha, menggambarkan kerja sama gerakan agama di India, Asia Tengah, Asia Timur, dan Afrika Utara, serta menyajikan dampak Perang Rusia-Jepang 1904 terhadap sukacita kemenangan Jepang. Ia melihat Universitas Islam lebih didasarkan pada ikatan sosial dan moral daripada sekadar religius, dan menganggap jurnalisme serta transportasi sebagai alatnya. Arslan mengakui bahwa gerakan ini mengambil banyak jalur yang saling bertentangan, dan pengaruhnya menurun seiring kemajuan nasionalisme. Ini adalah penyajian visi penulis, bukan evaluasi netral terhadap gerakan tersebut."
