label: { ar: "ارتفاع الكوكب من ساعات الليل", en: "The altitude of a star from the night hours", ur: "رات کی ساعتوں سے ستارے کا ارتفاع", es: "La altitud de una estrella desde las horas nocturnas", fr: "L'altitude d'une étoile pendant les heures nocturnes", tr: "Gezegenin gece saatlerindeki yüksekliği", id: "Ketinggian planet pada malam hari" }
summary:
  ar: "متى عُرف بعد الكوكب عن خط وسط السماء أُخذ الوتر الراجع لهذا البعد وأُنقص من الوتر الراجع لنصف قوس النهار، وضُرب الباقي في وتر ارتفاع الكوكب في وسط السماء، وقُسم على الوتر الراجع لنصف قوس النهار، وقُوِّس الناتج كما تُقوَّس الأوتار، فالقوس هي ارتفاع الكوكب في تلك الساعة. {cite:zij-sabi-nallino-byblion p.57}."
  en: "When the star's distance from the meridian line is known, one takes the returned chord of that distance and subtracts it from the returned chord of the half day arc, multiplies the remainder by the chord of the star's altitude at midheaven, divides by the returned chord of the half day arc, and takes the arc of the result as chords are turned into arcs; that arc is the star's altitude at that hour. {cite:zij-sabi-nallino-byblion p.57}."
  ur: "جب ستارے کا خطِ وسط السماء سے بعد معلوم ہو تو اس بعد کا وترِ راجع لے کر نصف قوسِ نہار کے وترِ راجع میں سے گھٹایا جاتا ہے، باقی کو وسط السماء میں ستارے کے ارتفاع کے وتر سے ضرب دی جاتی ہے، نصف قوسِ نہار کے وترِ راجع پر تقسیم کیا جاتا ہے، اور حاصل کو اسی طرح قوس بنایا جاتا ہے جیسے اوتار کو قوس بنایا جاتا ہے؛ وہ قوس اس ساعت میں ستارے کا ارتفاع ہے۔ {cite:zij-sabi-nallino-byblion p.57}۔"
  es: "Cuando se conoce la distancia de la estrella a la línea meridiana, se toma la cuerda resultante de esa distancia y se le resta la cuerda resultante del arco de medio día, se multiplica el resto por la cuerda de la altitud de la estrella en el centro del cielo, se divide por la cuerda resultante del arco de medio día y se toma el arco del resultado, ya que las cuerdas se convierten en arcos; ese arco es la altitud de la estrella a esa hora. {cite:zij-sabi-nallino-byblion p.57}."
  fr: "Lorsque la distance de l'étoile au méridien est connue, on soustrait la corde inverse de cette distance de la corde inverse de l'arc d'une demi-journée, on multiplie le résultat par la corde correspondant à la hauteur de l'étoile au milieu du ciel, on divise par la corde inverse de l'arc d'une demi-journée, et on calcule l'arc résultant (les cordes étant transformées en arcs); cet arc représente la hauteur de l'étoile à cette heure. {cite:zij-sabi-nallino-byblion p.57}."
  tr: "Gezegenin meridyenden uzaklığı bilindiğinde, bu uzaklığın kirişi alınır ve meridyen yayının kirişinden çıkarılır. Kalan değer daha sonra gezegenin meridyendeki yüksekliğinin kirişiyle çarpılır, meridyen yayının kirişine bölünür ve sonuç, kirişlerin eğri olduğu gibi eğri çizilir. Yay, gezegenin o saatteki yüksekliğini temsil eder. {cite:zij-sabi-nallino-byblion s.57}."
  id: "Setelah jarak planet dari meridian diketahui, panjang tali busur dari jarak ini diambil dan dikurangi dari panjang tali busur meridian. Sisanya kemudian dikalikan dengan panjang tali busur ketinggian planet di meridian, dibagi dengan panjang tali busur meridian, dan hasilnya dilengkungkan seperti halnya tali busur. Busur tersebut mewakili ketinggian planet pada jam tersebut. {cite:zij-sabi-nallino-byblion p.57}."
