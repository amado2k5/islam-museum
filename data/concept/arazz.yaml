label:
  ar: "أرزّ"
  en: "Arazz (rice)"
  ur: "ارز ⁦(چاول)⁩"
summary:
  ar: "حبّ معروف، حار يابس، ويبسه أظهر من حرّه {cite:canon-ibn-sina-print-v1 p.379}. يغذّي غذاء صالحاً، وإذا طُبخ باللبن ودهن اللوز غذّى أكثر وأجود، وإذا نُقع ليلة في ماء النخالة خفّ تجفيفه وعقله، وفيه جلاء {cite:canon-ibn-sina-print-v1 p.380}."
  en: "A well-known grain, hot and dry, its dryness more evident than its heat {cite:canon-ibn-sina-print-v1 p.379}. It gives good nourishment; cooked with milk and almond oil it nourishes more and better, and soaked overnight in bran water it lessens its drying and binding; the book also says it has a cleansing quality {cite:canon-ibn-sina-print-v1 p.380}."
  ur: "ایک معروف دانہ، طبیعت میں گرم اور خشک، جس کی خشکی اس کی گرمی سے زیادہ نمایاں ہے {cite:canon-ibn-sina-print-v1 p.379}۔ یہ اچھی غذا دیتا ہے؛ بادام کے تیل اور دودھ کے ساتھ پکایا جائے تو زیادہ اور بہتر غذا دیتا ہے، اور رات بھر سوجی کے پانی میں بھگویا جائے تو اس کی خشکی اور قبض کم ہو جاتی ہے، اور کتاب کے مطابق اس میں جلاء ہے {cite:canon-ibn-sina-print-v1 p.380}۔"
