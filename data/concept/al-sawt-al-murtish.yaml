label:
  ar: "الصوت المرتعش"
  en: "The trembling voice"
  ur: "کانپتی آواز"
summary:
  ar: "يؤمر صاحب الصوت المرتعش أن لا يصيح ولا يرفع صوته مدة شهر ويقل كلامه ما أمكن وضحكه والحركة والعدو والصعود والهبوط والغضب ويودع اليدين ويريحهما ما أمكن ثم ليستلق وليتكلف الكلام وقد أثقل صدره بمثل الرصاص وضعاً فوق صدره بقدر ما يحتمل ⁦(وضع الثقل على وصف الكتاب خبر عما يفعل لا حكم عمل)⁩، وأفضل الأغذية له ما يقوي جنبه ⁦(وفيه سطر موسوم من المأكولات التي عدها)⁩ {cite:canon-ibn-sina-print-v2 p.326}"
  en: "The owner of the trembling voice is ordered not to shout nor raise his voice for a month, to lessen his talk as much as possible, and his laughter, movement, running, ascending, descending and anger, to lay down his hands and rest them as much as he can, then to lie down and force the speech, having weighted his chest with something like lead placed upon it to the measure he can bear (the weight-placing on the book's description, a report of what is done, not a ruling); and the best of foods for him is what strengthens his side (among them a labelled listing of the foods he counts) {cite:canon-ibn-sina-print-v2 p.326}"
  ur: "کانپتی آواز والے کو حکم ہے کہ نہ چیخے نہ مہینہ بھر آواز اونچی کرے اور جتنا ممکن ہو اپنی بات اور ہنسی اور حرکت دوڑ چڑھائی اتار اور غصہ کم کرے اور اپنے ہاتھ معطل رکھے اور آرام دے پھر لیٹ جائے اور بات کرنے کی تکلف کرے اور اپنے سینے پر سیسے جیسی کوئی چیز اتنا رکھے جتنا برداشت کرے ⁦(بوجھ رکھنا کتاب کی بیان کردہ صورت پر ہے جو ہوتا ہے اس کی خبر ہے حکم نہیں)⁩؛ اور اس کے لیے بہترین خوراک وہ ہے جو اس کے پہلو کو قوت دے ⁦(اس میں گنوائی ہوئی خوراکوں کی موسوم سطر ہے)⁩ {cite:canon-ibn-sina-print-v2 p.326}"
