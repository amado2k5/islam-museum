  ar: "يعدد ابن سينا ما ينبغي أن يكون مع الفصاد من مباضع وكبة ومقيأ ووبر أرنب ومسك لمواجهة الغشي، ويذكر متى لا يبالى بمقاربة الغشي، وسبب الغشي في أول الفصد {cite:canon-ibn-sina-print-v1 pp.290-296}."
  en: "Ibn Sina lists what the bleeder should have with him, lancets, a ball, a vomiting tool, hare's fur and musk, to meet faintness, and says when the approach of faintness is not minded, and the cause of faintness at the first bleeding {cite:canon-ibn-sina-print-v1 pp.290-296}."
