id: concept/canon-the-bleeders-kit-and-treating-faintness
class: concept
kind: scientific
label: { ar: "عدة الفصاد وعلاج الغشي عند ابن سينا", en: "The bleeder's kit and the treatment of faintness in the Canon", ur: "قانون میں فصاد کا سامان اور غشی کا علاج", es: "El kit para el paciente con hemorragia y el tratamiento de los desmayos en el Canon", fr: "La trousse du saigneur et le traitement des évanouissements dans le Canon" }
summary:
  ar: "يعدد ابن سينا ما ينبغي أن يكون مع الفصاد من مباضع وكبة ومقيأ ووبر أرنب ومسك لمواجهة الغشي، ويذكر متى لا يبالى بمقاربة الغشي، وسبب الغشي في أول الفصد {cite:canon-ibn-sina-print-v1 pp.290-296}."
  en: "Ibn Sina lists what the bleeder should have with him, lancets, a ball, a vomiting tool, hare's fur and musk, to meet faintness, and says when the approach of faintness is not minded, and the cause of faintness at the first bleeding {cite:canon-ibn-sina-print-v1 pp.290-296}."
  es: "Ibn Sina enumera lo que el sangrante debe tener consigo: lancetas, una bola, un instrumento para vomitar, piel de liebre y almizcle, para afrontar el desmayo, y dice cuándo no se tiene en cuenta la proximidad del desmayo y la causa del desmayo en el primer sangrado {cite:canon-ibn-sina-print-v1 pp.290-296}."
  fr: "Ibn Sina énumère ce que le saigneur doit avoir avec lui: des lancettes, une balle, un instrument pour vomir, de la fourrure de lièvre et du musc, pour faire face à l'évanouissement, et dit quand l'approche de l'évanouissement n'est pas prise en compte, et la cause de l'évanouissement lors du premier saignement {cite:canon-ibn-sina-print-v1 pp.290-296}."
