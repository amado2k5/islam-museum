label: { ar: "الزجر والعيافة", en: "Zajr and iyafa (augury)" }
summary:
  ar: "زجر الطير والتطير والتفاؤل وما يتصل بالسانح والبارح، من خواص العرب عند المسعودي كالقيافة، وهي لبني أسد والقيافة لبني مدلج والكهانة لليمن، ونقلها عن العرب أمم مجاورة كالإفرنجة، وأهل الجبال والقفار والدهاس أزجر وأعرف؛ ومن زجر عبيد بن الأبرص الراعي في شعره ما أورده المسعودي {cite:muruj-al-dhahab p. 478-481}."
  en: "Augury — the zajr of birds, tafa'ul and tatayyur, the sanih and barih: counted among the Arabs' specialities, zajr belonging to Banu Asad as kahana to Yemen; mountaineers and desert-dwellers were the readiest augurs {cite:muruj-al-dhahab p. 478-481}."
