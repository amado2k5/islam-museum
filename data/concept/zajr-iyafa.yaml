label: { ar: "الزجر والعيافة", en: "Zajr and iyafa (augury)", es: "Zajr e iyafa (augurio)", fr: "Zajr et iyafa (augure)", ur: "زجر اور یفا ⁦(آج)⁩", tr: "Azarlama ve kehanet", id: "Teguran dan ramalan" }
summary:
  ar: "زجر الطير والتطير والتفاؤل وما يتصل بالسانح والبارح، من خواص العرب عند المسعودي كالقيافة، وهي لبني أسد والقيافة لبني مدلج والكهانة لليمن، ونقلها عن العرب أمم مجاورة كالإفرنجة، وأهل الجبال والقفار والدهاس أزجر وأعرف؛ ومن زجر عبيد بن الأبرص الراعي في شعره ما أورده المسعودي {cite:muruj-al-dhahab p. 478-481}."
  en: "Augury — the zajr of birds, tafa'ul and tatayyur, the sanih and barih: counted among the Arabs' specialities, zajr belonging to Banu Asad as kahana to Yemen; mountaineers and desert-dwellers were the readiest augurs {cite:muruj-al-dhahab p. 478-481}."
  es: "Augurio: el zajr de las aves, tafa'ul y tatayyur, el sanih y barih: contados entre las especialidades de los árabes, el zajr perteneciente a Banu Asad como kahana a Yemen; los montañeses y los habitantes del desierto eran los augures más hábiles {cite:muruj-al-dhahab p. 478-481}."
  fr: "Augure — le zajr des oiseaux, tafa'ul et tatayyur, le sanih et le barih: compté parmi les spécialités des Arabes, le zajr appartenant aux Banu Asad comme kahana au Yémen; les montagnards et les habitants du désert étaient les augures les plus prompts {cite: muruj-al-dhahab p. 478-481}."
  ur: "اگوری - پرندوں کا زجر، طافل اور تطیور، صحیح اور باریح: عربوں کی خصوصیات میں شمار ہوتا ہے، بنو اسد سے تعلق رکھنے والا زجر، یمن کا کہانہ؛ کوہ پیما اور صحرائی باشندے سب سے زیادہ مستعد تھے 478-481}۔"
  tr: "El-Mas'udi'ye göre, kuşların yorumlanması, batıl inanç, iyimserlik ve sağ ile sol ile ilgili konular, Arapların özelliklerindendir; tıpkı Beni Esad'a özgü olan fizyonomi ve Beni Mudlij'e özgü olan fizyonomi, Yemen'e özgü olan ve Franklar gibi komşu milletlere Araplardan aktarılan falcılık gibi. Dağlık, çöl ve ovalık bölgelerde yaşayan insanlar ise yorumlama konusunda daha bilgili ve yeteneklidir. El-Mas'udi'nin bahsettiği yorumlar arasında, çoban Ubaid bin Al-Abras'ın şiirlerindeki yorumlar da yer almaktadır. (Kaynak: Muruj-al-dhahab, s. 478-481)"
  id: "Penafsiran burung, takhayul, optimisme, dan hal-hal yang berkaitan dengan kanan dan kiri, termasuk di antara ciri-ciri orang Arab menurut Al-Mas’udi, seperti halnya ilmu fisiognomi yang dimiliki Bani Asad, dan ilmu fisiognomi yang dimiliki Bani Mudlij, dan ramalan yang dimiliki Yaman, dan bangsa-bangsa tetangga seperti Frank yang mewarisinya dari orang Arab, dan orang-orang di pegunungan, gurun, dan dataran lebih berpengetahuan dan terampil dalam penafsiran; dan di antara penafsiran Ubaid bin Al-Abras, seorang penggembala, dalam puisinya adalah apa yang disebutkan Al-Mas’udi {cite:muruj-al-dhahab p. 478-481}."
