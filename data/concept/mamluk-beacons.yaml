label: { ar: "المناور والمحرقات في الدولة المملوكية", en: "Mamluk beacons and crop-burnings (al-manawir wa-l-muhriqat)", ur: "مملوک دور کے آگ کے مینار اور فصلیں جلانا", es: "Faros y quemas de cosechas mamelucos (al-manawir wa-l-muhriqat)", fr: "Les balises mameloukes et les brûlis de récoltes (al-manawir wa-l-muhriqat)" }
summary:
  ar: "المناور مواضع رفع النار ليلاً والدخان نهاراً على رؤوس الجبال والأبنية العالية من ثغور الفرات كالبيرة والرحبة إلى قلعة الجبل، اتُّخذت للإعلام بقصد التتار، حتى قال صاحب «التعريف» إن عنوان الخبر يظهر من الفرات بمصر في يوم وليلة؛ والمحرقات مواضع في مملكة بني هولاكو كان يُرسل إليها رجال يحرقون زرعها بالثعالب والكلاب لئلا تجد خيل التتار علفاً. وقد ذكر القلقشندي أنها عفت بعد الصلح بين الدولتين {cite:subh-al-asha-cairo-v14 p.398} {cite:subh-al-asha-cairo-v14 p.400} {cite:subh-al-asha-cairo-v14 p.401}."
  en: "The manawir were posts for raising fire by night and smoke by day on mountain tops and high buildings, from the Euphrates frontier at al-Bira and al-Rahba to the Citadel of Cairo, built to give warning of Mongol attacks, so that, as al-Ta'rif says, the first word of news from the Euphrates reached Egypt within a day and a night; the muhriqat were places inside the Ilkhanid realm where men were sent to burn the crops, using foxes and dogs, so that the Mongol horses would find no fodder. Al-Qalqashandi records that the beacons fell into ruin after peace was made between the two states."
  es: "Los manawir eran puestos para encender fuego de noche y generar humo de día en las cimas de las montañas y en edificios altos, desde la frontera del Éufrates en al-Bira y al-Rahba hasta la Ciudadela de El Cairo. Se construyeron para alertar sobre los ataques mongoles, de modo que, como dice al-Ta'rif, la primera noticia del Éufrates llegaba a Egipto en un día y una noche. Los muhriqat eran lugares dentro del reino iljánida donde se enviaba a hombres a quemar las cosechas, utilizando zorros y perros, para que los caballos mongoles no encontraran alimento. Al-Qalqashandi relata que las balizas cayeron en ruinas tras la firma de la paz entre ambos estados."
  fr: "Les manawir étaient des postes d'observation servant à allumer des feux la nuit et à produire de la fumée le jour, installés au sommet des montagnes et sur les édifices élevés, depuis la frontière de l'Euphrate à al-Bira et al-Rahba jusqu'à la citadelle du Caire. Construits pour donner l'alerte en cas d'attaque mongole, ils permettaient, comme le rapporte al-Ta'rif, que les premières nouvelles en provenance de l'Euphrate parvenaient en Égypte en un jour et une nuit. Les muhriqat étaient des lieux situés à l'intérieur du territoire ilkhanide où des hommes étaient envoyés brûler les récoltes, à l'aide de renards et de chiens, afin de priver les chevaux mongols de fourrage. Al-Qalqashandi indique que ces balises tombèrent en ruine après la signature de la paix entre les deux États."
