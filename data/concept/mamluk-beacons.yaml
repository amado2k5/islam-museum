label: { ar: "المناور والمحرقات في الدولة المملوكية", en: "Mamluk beacons and crop-burnings (al-manawir wa-l-muhriqat)", ur: "مملوک دور کے آگ کے مینار اور فصلیں جلانا" }
summary:
  ar: "المناور مواضع رفع النار ليلاً والدخان نهاراً على رؤوس الجبال والأبنية العالية من ثغور الفرات كالبيرة والرحبة إلى قلعة الجبل، اتُّخذت للإعلام بقصد التتار، حتى قال صاحب «التعريف» إن عنوان الخبر يظهر من الفرات بمصر في يوم وليلة؛ والمحرقات مواضع في مملكة بني هولاكو كان يُرسل إليها رجال يحرقون زرعها بالثعالب والكلاب لئلا تجد خيل التتار علفاً. وقد ذكر القلقشندي أنها عفت بعد الصلح بين الدولتين {cite:subh-al-asha-cairo-v14 p.398} {cite:subh-al-asha-cairo-v14 p.400} {cite:subh-al-asha-cairo-v14 p.401}."
  en: "The manawir were posts for raising fire by night and smoke by day on mountain tops and high buildings, from the Euphrates frontier at al-Bira and al-Rahba to the Citadel of Cairo, built to give warning of Mongol attacks, so that, as al-Ta'rif says, the first word of news from the Euphrates reached Egypt within a day and a night; the muhriqat were places inside the Ilkhanid realm where men were sent to burn the crops, using foxes and dogs, so that the Mongol horses would find no fodder. Al-Qalqashandi records that the beacons fell into ruin after peace was made between the two states."
