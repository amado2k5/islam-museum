id: concept/canon-colic-and-frequent-sneezing-in-infants
class: concept
kind: scientific
label:
  ar: "المغص والعطاس المتواتر عند الصبيان عند ابن سينا"
  en: "Colic and frequent sneezing in infants in the Canon"
  fr: "Coliques et éternuements fréquents du nourrisson dans le Canon"
  ur: "قانون میں بچوں کا پیٹ درد اور بار بار چھینکنا"
  es: "Cólicos y estornudos frecuentes en bebés en el Canon"
summary:
  ar: "يذكر ابن سينا مغصاً يلتوي منه الصبي ويبكي، وعلاجه بتكميد البطن، وعطاساً متواتراً قد يكون من ورم في نواحي الدماغ فيبرد، وإلا نفخ الباذروج المسحوق في المنخرين {cite:canon-ibn-sina-print-v1 p.216}."
  en: "Ibn Sina mentions a colic that makes the child twist and cry, treated by fomenting the belly, and repeated sneezing that may come from a swelling about the brain and is then cooled, or else powdered basil is blown into the nostrils {cite:canon-ibn-sina-print-v1 p.216}."
  fr: "Ibn Sina décrit la colique faisant se tordre et pleurer l’enfant, traitée par fomentation abdominale ; les éternuements répétés peuvent venir d’un gonflement près du cerveau, traité par refroidissement, sinon de la poudre de basilic est insufflée dans les narines {cite:canon-ibn-sina-print-v1 p.216}."
  es: "Ibn Sina menciona un cólico que hace que el niño se retuerza y llore, tratado mediante la estimulación del vientre, y estornudos repetidos que pueden provenir de una inflamación alrededor del cerebro y que luego se enfría, o bien se sopla albahaca en polvo en las fosas nasales {cite:canon-ibn-sina-print-v1 p.216}."
  ur: "ابن سینا نے ایک درد کا تذکرہ کیا ہے جس سے بچہ مروڑتا ہے اور روتا ہے، پیٹ کو جلانے سے علاج کیا جاتا ہے، اور بار بار چھینکیں جو دماغ میں سوجن سے آتی ہیں اور پھر اسے ٹھنڈا کیا جاتا ہے، ورنہ تلسی کا پاؤڈر نتھنوں میں پھونک دیا جاتا ہے۔"
