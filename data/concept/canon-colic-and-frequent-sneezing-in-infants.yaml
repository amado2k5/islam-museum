summary:
  ar: "يذكر ابن سينا مغصاً يلتوي منه الصبي ويبكي، وعلاجه بتكميد البطن، وعطاساً متواتراً قد يكون من ورم في نواحي الدماغ فيبرد، وإلا نفخ الباذروج المسحوق في المنخرين {cite:canon-ibn-sina-print-v1 p.216}."
  en: "Ibn Sina mentions a colic that makes the child twist and cry, treated by fomenting the belly, and repeated sneezing that may come from a swelling about the brain and is then cooled, or else powdered basil is blown into the nostrils {cite:canon-ibn-sina-print-v1 p.216}."
