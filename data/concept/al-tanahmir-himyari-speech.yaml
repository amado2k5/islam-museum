id: concept/al-tanahmir-himyari-speech
class: concept
kind: term
label: { ar: "التنحْمير — بقايا اللسان الحميري", en: "al-Tanahmir: the Himyaritic speech remnant", fr: "Al-Tanahmir : vestiges du parler himyarite", es: "al-Tanahmir: el remanente del habla himyarita", ur: "التناحمیر: ہمیراتی تقریر باقیات", tr: "Tanhemer — Himyar dilinin kalıntıları", id: "Tanhemer — Sisa-sisa bahasa Himyar" }
summary:
  ar: "سجّل الهمداني، وقد قطع اليمن وصفاً لديارها، أن في كلام سرو حِمْير وجَعْدة «شيئاً من التنحمير»: يجرّون في كلامهم ويحذفون فيقولون «بابن معَم» في «بابن العم» و«سِمّع» في «اسمع»؛ وعدّ كِندة وهمدان وبعض الصدف أفصح أهل حضرموت وما والاها، وقال إن مهرة يشاكلون في كلامهم العجم، وأن نَحْجاً وأبين ودثينة أفصح. وهي أقدم شهادة مفصلة على بقاء لغة حمير القديمة أثراً في ألسنة أهل القرن الرابع {cite:sifat-jazirat-al-arab p. 117}."
  en: "Al-Hamdani's register of the peninsula's tongues records that the highland Himyar and Ja'da keep 'something of tanahmir' — Himyaritic speech — eliding consonants: 'bi-bn Ma'am' for 'bi-bn al-'amm', 'simmi'' for 'isma''. He counts Kinda and Hamdan the most eloquent of the south, says Mahra's speech resembles the 'ajam's, and names Nahj, Abyan and Dathina the purest — the earliest detailed witness to Old Himyaritic surviving on fourth-century tongues {cite:sifat-jazirat-al-arab p. 117}."
  fr: "Dans son relevé des parlers de la péninsule, al-Hamdani indique que le haut pays de Himyar et Ja'da conservent « quelque chose du tanahmir », le parler himyarite, et élident des consonnes : « bi-bn Ma'am » pour « bi-bn al-'amm », « simmi' » pour « isma' ». Il tient Kinda et Hamdan pour les plus éloquents du sud, dit que le parler de Mahra ressemble à celui des non-Arabes (les 'ajam) et cite Nahj, Abyan et Dathina comme les plus purs. Il s’agit du plus ancien témoignage détaillé de la survivance du himyarite ancien dans les parlers du IVe siècle {cite:sifat-jazirat-al-arab p. 117}."
  es: "El registro de lenguas de la península realizado por Al-Hamdani documenta que los himyar y ja'da de las tierras altas conservan «algo de tanahmir» —el habla himyarítica— omitiendo consonantes: «bi-bn Ma'am» por «bi-bn al-'amm», «simmi» por «isma». Considera a Kinda y Hamdan los más elocuentes del sur, afirma que el habla de Mahra se asemeja a la de «ajam» y nombra a Nahj, Abyan y Dathina como los más puros —el testimonio detallado más antiguo del antiguo himyarítico que sobrevive en lenguas del siglo IV {cite:sifat-jazirat-al-arab p. 117}."
  ur: "جزیرہ نما کی زبانوں کے الحمدانی کے رجسٹر میں درج ہے کہ پہاڑی ہمیار اور جادہ میں 'تناہمیر کی کوئی چیز' رکھی گئی ہے - ہمیاراتی تقریر - ختم ہونے والی تلفظ: 'بی بن المعم' کے لیے 'بی بن مام'، 'اسماء' کے لیے 'سمی'۔ وہ کندہ اور ہمدان کو جنوب کے سب سے زیادہ فصیح شمار کرتا ہے، مہرہ کی تقریر عجم سے مشابہت رکھتی ہے، اور نہج، ابیان اور داتھینا کے نام سب سے زیادہ خالص ہیں - چوتھی صدی کی زبانوں پر قدیم ہماریٹک زندہ رہنے کا ابتدائی تفصیلی گواہ۔ 117}۔"
  tr: "Yemen topraklarını anlatan el-Hamdani, Sarw Himyar ve Ca'dah'ın sözlerinde biraz tanhamir olduğunu kaydetmiştir: konuşmalarında sürüklenip atlanırlar, 'İbn el-Amm'de 'İbn Hanım', 'Asma'da 'Sama' derler; Kinda ve Hamdan'ın vaatleri ile bazı tesadüfler Hadramaut ve çevresi arasında en etkileyici olanlardır ve Mahrah'ın konuşma olarak Arap olmayanlara benzediğini, Nahja, Abyan ve Dhaynah'ın ise daha etkileyici konuştuğunu söylemiştir. Bu, dördüncü yüzyıl halkının dillerinde eski Himyarit dilinin korunmasına dair en eski ayrıntılı tanıklıktır {cite:sifat-jazirat-al-Arab, s. 117}."
  id: "Al-Hamdani, yang menggambarkan wilayah Yaman, mencatat bahwa Sarw Himyar dan Ca'dah memiliki beberapa taḥamāmir: dalam pidato mereka mereka melayang dan melompat, mengatakan 'Ibn Hanım' dalam Ibn al-Amm, 'Sama' dalam 'Asma'; Janji-janji Kinda dan Hamdan serta beberapa kebetulan adalah yang paling mengesankan di antara Hadramaut dan lingkarannya, dan ia mengatakan bahwa Mahrah mirip dengan non-Arab dalam ucapan, sementara Nahja, Abyan, dan Dhaynah berbicara dengan lebih mengesankan. Ini adalah kesaksian tertua yang rinci tentang pelestarian bahasa Himyarit kuno dalam bahasa-bahasa orang abad keempat {cite:sifat-jazirat-al-Arab, hlm. 117}."
