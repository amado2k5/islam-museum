summary:
  ar: "سجّل الهمداني، وقد قطع اليمن وصفاً لديارها، أن في كلام سرو حِمْير وجَعْدة «شيئاً من التنحمير»: يجرّون في كلامهم ويحذفون فيقولون «بابن معَم» في «بابن العم» و«سِمّع» في «اسمع»؛ وعدّ كِندة وهمدان وبعض الصدف أفصح أهل حضرموت وما والاها، وقال إن مهرة يشاكلون في كلامهم العجم، وأن نَحْجاً وأبين ودثينة أفصح. وهي أقدم شهادة مفصلة على بقاء لغة حمير القديمة أثراً في ألسنة أهل القرن الرابع {cite:sifat-jazirat-al-arab p. 117}."
  en: "Al-Hamdani's register of the peninsula's tongues records that the highland Himyar and Ja'da keep 'something of tanahmir' — Himyaritic speech — eliding consonants: 'bi-bn Ma'am' for 'bi-bn al-'amm', 'simmi'' for 'isma''. He counts Kinda and Hamdan the most eloquent of the south, says Mahra's speech resembles the 'ajam's, and names Nahj, Abyan and Dathina the purest — the earliest detailed witness to Old Himyaritic surviving on fourth-century tongues {cite:sifat-jazirat-al-arab p. 117}."
