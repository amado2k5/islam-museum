label:
  ar: "آفات القطع"
  en: "The harms of the cutting"
  fr: "Les méfaits de l’excision"
  ur: "کاٹنے کی آفات"
summary:
  ar: "آفات القطع من ذلك الضرر بالصوت وتعريض الرئة للبرد والحر فيعرض سعال لسوء مزاج عن سبب بارد من ريح وغبار ونحوه وكثيراً منهم يستبرد الهواء المعتدل وكثيراً منهم استحكم البرد في صدره ورثته حتى مات وقد يعرض منه نزف دم {cite:canon-ibn-sina-print-v2 p.300}"
  en: "The harms of the cutting: among them harm to the voice, and exposing the lung to cold and heat so a cough befalls for ill temperament from a cold cause — wind, dust and the like; many of them find even moderate air cold, and in many the cold settles in his chest and finishes him until he dies; and a haemorrhage of blood may arise from it {cite:canon-ibn-sina-print-v2 p.300}"
  fr: "Les méfaits de l’excision : parmi eux, une atteinte à la voix et l’exposition du poumon au froid et à la chaleur, d’où une toux due à un mauvais tempérament provoqué par une cause froide — vent, poussière et autres choses semblables ; beaucoup trouvent froid même un air modéré, et chez beaucoup le froid s’installe dans la poitrine et les consume jusqu’à la mort ; une hémorragie peut aussi en résulter {cite:canon-ibn-sina-print-v2 p.300}"
  ur: "کاٹنے کی آفات: ان میں آواز کا نقصان اور پھیپھڑے کا سردی اور گرمی کے روبرو ہونا ہے تو باد غبار جیسے سرد سبب سے سوء مزاج کی کھانسی ہوتی ہے؛ ان میں سے بہت سے معتدل ہوا بھی سرد پاتے ہیں اور بہت سے میں سردی سینے میں جکڑ جاتی ہے اور ان کا پیچھا کرتی ہے یہاں تک کہ مر جائیں؛ اور اس سے خون کا نزف بھی ہو سکتا ہے {cite:canon-ibn-sina-print-v2 p.300}"
