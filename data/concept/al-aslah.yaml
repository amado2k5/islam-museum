id: concept/al-aslah
class: concept
kind: doctrine
label:
  ar: "الأصلح"
  en: "Al-aslah (the 'most fitting' for mankind)"
  fr: "Al-aslah (« le plus approprié » pour l’humanité)"
  es: "Al-aslah (el 'más apropiado' para la humanidad)"
  ur: "الاصلاح ⁦(انسانوں کے لیے 'سب سے موزوں')⁩"
  tr: "En uygun"
  id: "En uygun"
summary:
  ar: "مصطلح كلامي معناه «الأنسب والأصلح»، وقال به فريق من المعتزلة يرى أن الله يفعل ما هو الأصلح للعباد؛ وقد اختلف المعتزلة في حدّه، فقيّده النظّام بأن للّه بدائل لا نهاية لها متساوية في الحسن، ورآه آخرون في النبوة وحدها، ورُدّ عليه بقصة الأخوة الثلاثة {cite:encyclopaedia-of-islam-2 vol. 1 p. 762}."
  en: "A technical term of theology meaning the most suitable or fitting. The upholders of the aslah were a group of the Mu'tazila who held that God does what is best for mankind; the entry notes that nothing says who formed the group. Abu '1-Hudhayl held the principle, al-Nazzam refined it with an infinity of equally good alternatives, and others confined it to sending prophets {cite:encyclopaedia-of-islam-2 vol. 1 p. 762}."
  fr: "Terme technique de théologie qui désigne ce qui est le plus approprié ou le plus indiqué. Les partisans de l’aslah formaient un groupe parmi les mutazilites et soutenaient que Dieu fait ce qui est le mieux pour l’humanité. La notice relève que rien n’indique qui en faisait partie. Abu al-Hudhayl défendait ce principe ; Al-Nazzam l’a nuancé en invoquant une infinité de possibilités également bonnes, tandis que d’autres le limitaient à l’envoi de prophètes {cite:encyclopaedia-of-islam-2 vol. 1 p. 762}."
  es: "Un término técnico de teología que significa lo más adecuado o apropiado. Los defensores del principio de la aslah eran un grupo de los Mu'tazila que sostenían que Dios hace lo mejor para la humanidad; la entrada señala que no se menciona quiénes formaban el grupo. Abu 'l-Hudhayl defendía este principio, al-Nazzam lo refinó con una infinidad de alternativas igualmente válidas, y otros lo limitaron al envío de profetas {cite:encyclopaedia-of-islam-2 vol. 1 p. 762}."
  ur: "دینیات کی ایک تکنیکی اصطلاح جس کا مطلب ہے سب سے زیادہ موزوں یا موزوں۔ اسلاف کے محافظ معتزلہ کا ایک گروہ تھا جس کا خیال تھا کہ خدا وہی کرتا ہے جو بنی نوع انسان کے لیے بہتر ہوتا ہے۔ اندراج نوٹ کرتا ہے کہ کچھ بھی نہیں کہتا کہ گروپ کس نے بنایا۔ ابو 1-ہذیل نے اس اصول کو برقرار رکھا، النظم نے اسے یکساں طور پر اچھے متبادلات کی لامحدودیت کے ساتھ بہتر کیا، اور دوسروں نے اسے پیغمبروں کو بھیجنے تک محدود رکھا۔ 1 ص۔ 762}۔"
  tr: "'En uygun ve en uygun olan' anlamına gelen teolojik bir terim ve bir grup Mu'tazilit, Allah'ın kulları için en iyisini yaptığını düşünüyordu; Mu'tazilliler sınırında farklılık gösterdi, ancak sistem sınırlarını sınırladı; diğerleri ise bunu sadece peygamberlikte görüp üç kardeşin hikayesiyle yanıt verdi {cite:encyclopaedia-of-Islam-2 cilt 1, s. 762}."
  id: "Istilah teologis yang berarti 'yang paling tepat dan paling cocok', dan sekelompok Mu'tazilite percaya bahwa Tuhan melakukan yang terbaik untuk hamba-Nya; Mu'tazilite berbeda dalam batasnya tetapi membatasi batas sistem; yang lain hanya melihat ini dalam nubuat dan menanggapi dengan kisah tiga saudara {cite:encyclopaedia-of-Islam-2, vol. 1, hlm. 762}."
