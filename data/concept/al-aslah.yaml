label:
  ar: "الأصلح"
  en: "Al-aslah (the 'most fitting' for mankind)"
summary:
  ar: "مصطلح كلامي معناه «الأنسب والأصلح»، وقال به فريق من المعتزلة يرى أن الله يفعل ما هو الأصلح للعباد؛ وقد اختلف المعتزلة في حدّه، فقيّده النظّام بأن للّه بدائل لا نهاية لها متساوية في الحسن، ورآه آخرون في النبوة وحدها، ورُدّ عليه بقصة الأخوة الثلاثة {cite:encyclopaedia-of-islam-2 vol. 1 p. 762}."
  en: "A technical term of theology meaning the most suitable or fitting. The upholders of the aslah were a group of the Mu'tazila who held that God does what is best for mankind; the entry notes that nothing says who formed the group. Abu '1-Hudhayl held the principle, al-Nazzam refined it with an infinity of equally good alternatives, and others confined it to sending prophets {cite:encyclopaedia-of-islam-2 vol. 1 p. 762}."
