summary:
  ar: "الهليلج أصناف، منها الأصفر والأسود الهندي والكابلي والصيني، وكلها تطفئ المرّة، وتنفع الحواس والعقل والمعدة، والكابلي ينفع من الاستسقاء. {cite:canon-ibn-sina-print-v1 p.447}"
  en: "Halilaj comes in kinds: the yellow, the black Indian, the Kabuli and the Chinese. All quench bile; they help the senses, the mind and the stomach, and the Kabuli helps dropsy. {cite:canon-ibn-sina-print-v1 p.447}"
  ur: "ہلیلہ کی کئی قسمیں ہیں: زرد، ہندی سیاہ، کابلی اور چینی۔ سب صفرا کو بجھاتی ہیں، حواس، عقل اور معدے کو فائدہ دیتی ہیں، اور کابلی استسقا میں مفید ہے۔ {cite:canon-ibn-sina-print-v1 p.447}"
