label:
  ar: اللوح المحفوظ
  en: Al-Lawh al-Mahfuz
  ur: لوح محفوظ
summary:
  ar: "اللوح الذي كتب الله فيه مقادير الخلائق قبل أن يخلق السماوات والأرض بخمسين ألف سنة؛ فيه القرآن المجيد محفوظاً، وإليه ينتهي علم الأجل والرزق {cite:jami-al-tirmidhi} {cite:tafsir-ibn-kathir}."
  en: "The Tablet in which God wrote the decrees of creation fifty thousand years before creating the heavens and the earth; in it the glorious Qur'an is preserved, and to it belongs the knowledge of terms and provision {cite:jami-al-tirmidhi} {cite:tafsir-ibn-kathir}."
  ur: "وہ تختی جس میں اللہ نے آسمانوں اور زمین کو پیدا کرنے سے پچاس ہزار سال پہلے مخلوقات کی تقدیر لکھ دی؛ اسی میں قرآن مجید محفوظ ہے اور اسی سے اجل اور رزق کا علم منسوب ہے {cite:jami-al-tirmidhi} {cite:tafsir-ibn-kathir}۔"
