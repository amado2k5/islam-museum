id: concept/canon-mixed-wine-and-the-harm-of-excess
class: concept
kind: scientific
label:
  ar: "الشراب الممزوج وضرر الإفراط عند ابن سينا"
  en: "Mixed wine and the harm of excess in the Canon"
  fr: "Vin coupé et méfaits de l’excès dans le Canon"
  ur: "ملی ہوئی شراب اور زیادتی کا ضرر قانون میں"
  es: "El vino mezclado y el daño del exceso en el Canon"
summary:
  ar: "يبين ابن سينا أن الممزوج يرخي المعدة ويرطبها ويسكر أسرع لكنه يجلو البشرة، وأن الشراب على الريق أو بعد حركة مفرطة ضار بالدماغ والعصب، وأن السكر المتواتر رديء جداً، وأن الشراب الكثير يستحيل في بعض المعد إلى صفراء رديئة وفي بعضها إلى خل حاذق، وأن أغلب الضرر في الدماغ {cite:canon-ibn-sina-print-v1 p.238}."
  en: "Ibn Sina says mixed wine relaxes and moistens the stomach and intoxicates faster yet clears the skin, that wine on an empty stomach or after excessive movement harms the brain and nerve, that repeated drunkenness is very bad, that much wine turns in some stomachs to bad bile and in others to sharp vinegar, and that most of the harm falls on the brain {cite:canon-ibn-sina-print-v1 p.238}."
  fr: "Ibn Sina attribue au vin coupé relâchement et humidification gastriques, ivresse plus rapide et peau clarifiée ; à jeun ou après fort mouvement, dommage cérébral et nerveux ; à l’ivresse répétée, grands méfaits. Le vin abondant deviendrait bile mauvaise ou vinaigre âcre selon l’estomac, nuisant surtout au cerveau {cite:canon-ibn-sina-print-v1 p.238}."
  es: "Ibn Sina dice que el vino mezclado relaja y humedece el estómago y embriaga más rápido, pero limpia la piel; que el vino con el estómago vacío o después de un movimiento excesivo daña el cerebro y los nervios; que la embriaguez repetida es muy mala; que mucho vino se convierte en algunos estómagos en bilis mala y en otros en vinagre fuerte; y que la mayor parte del daño recae sobre el cerebro {cite:canon-ibn-sina-print-v1 p.238}."
  ur: "ابن سینا کا کہنا ہے کہ مخلوط شراب معدے کو نرم اور تر کرتی ہے اور جلد کو نشہ پہنچاتی ہے لیکن جلد کو صاف کرتی ہے، وہ شراب خالی پیٹ یا زیادہ حرکت کے بعد دماغ اور اعصاب کو نقصان پہنچاتی ہے، یہ کہ بار بار شراب پینا بہت بری چیز ہے، یہ شراب کچھ کے پیٹ میں خراب صفرا اور بعض میں تیز سرکہ بن جاتی ہے، اور زیادہ تر دماغ کو نقصان پہنچاتی ہے۔ {حوالہ: کینن ابن سینا پرنٹ v1 صفحہ 238}۔"
