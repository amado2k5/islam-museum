label: { ar: "الشراب الممزوج وضرر الإفراط عند ابن سينا", en: "Mixed wine and the harm of excess in the Canon", ur: "ملی ہوئی شراب اور زیادتی کا ضرر قانون میں" }
summary:
  ar: "يبين ابن سينا أن الممزوج يرخي المعدة ويرطبها ويسكر أسرع لكنه يجلو البشرة، وأن الشراب على الريق أو بعد حركة مفرطة ضار بالدماغ والعصب، وأن السكر المتواتر رديء جداً، وأن الشراب الكثير يستحيل في بعض المعد إلى صفراء رديئة وفي بعضها إلى خل حاذق، وأن أغلب الضرر في الدماغ {cite:canon-ibn-sina-print-v1 p.238}."
  en: "Ibn Sina says mixed wine relaxes and moistens the stomach and intoxicates faster yet clears the skin, that wine on an empty stomach or after excessive movement harms the brain and nerve, that repeated drunkenness is very bad, that much wine turns in some stomachs to bad bile and in others to sharp vinegar, and that most of the harm falls on the brain {cite:canon-ibn-sina-print-v1 p.238}."
