label: { ar: "الشريان الوريدي عند ابن سينا", en: "The venous artery in the Canon", ur: "قانون میں وریدی شریان", es: "La arteria venosa en el Canon", fr: "L'artère veineuse dans le canon", tr: "İbn Sina'daki venöz arter", id: "Arteri vena di Avicenna" }
summary:
  ar: "الشريان الوريدي عند ابن سينا هو أحد الشريانين النابتين أولاً من التجويف الأيسر للقلب، يذهب إلى الرئة وينقسم فيها، وهو ذو طبقة واحدة بخلاف سائر الشرايين {cite:canon-ibn-sina-print-v1 p.84}."
  en: "The venous artery in Ibn Sina is one of the two arteries growing first from the left cavity of the heart; it goes to the lung and divides in it, and unlike the other arteries it has a single coat {cite:canon-ibn-sina-print-v1 p.84}."
  es: "La arteria venosa en Ibn Sina es una de las dos arterias que crecen primero desde la cavidad izquierda del corazón; va al pulmón y se divide en él, y a diferencia de las otras arterias tiene una sola capa {cite:canon-ibn-sina-print-v1 p.84}."
  fr: "L'artère veineuse chez Ibn Sina est l'une des deux artères qui se développent en premier à partir de la cavité gauche du cœur; elle se dirige vers le poumon et s'y divise, et contrairement aux autres artères, elle possède une seule couche {cite:canon-ibn-sina-print-v1 p.84}."
  ur: "ابن سینا میں وینس شریان ان دو شریانوں میں سے ایک ہے جو پہلے دل کی بائیں گہا سے بڑھتی ہیں۔ یہ پھیپھڑوں میں جاتا ہے اور اس میں تقسیم ہوتا ہے، اور دوسری شریانوں کے برعکس اس کا ایک ہی پردہ ہوتا ہے {حوالہ: کینن ابن سینا پرنٹ-v1 p.84}۔"
  tr: "İbn Sina'daki venöz arter, kalbin sol odasından ilk olarak başlayan ve akciğere giden ve orada bölünen iki arterden biridir. Diğer arterlerden farklı olarak tek bir tabakaya sahiptir {cite:canon-ibn-sina-print-v1 s.84}."
  id: "Arteri vena pada Ibn Sina adalah salah satu dari dua arteri yang pertama kali berasal dari ruang kiri jantung, yang menuju paru-paru dan membelah di sana. Arteri ini memiliki satu lapisan, berbeda dengan arteri lain {cite:canon-ibn-sina-print-v1 hlm.84}."
