label:
  ar: "الفرس"
  en: "Equuleus (al-Faras)"
  ur: "چھوٹا گھوڑا"
summary:
  ar: "يسمّي فهرس البتاني الصورة الفرس الصغير بالاسم اليوناني بوروتومِس، أي رأس الفرس، وبالعربية الفرس. تقع كواكبها في الرأس والفم، وقد وصفت أربعة منها في عمود القدر بأنها خافتة. يرد القسم بعد الدلفين. مواضعها لم تُنقل هنا. {cite:nallino-albatenii-opus-astronomicum pp.153}"
  en: "The catalogue names the Little Horse by the Greek buruțumis, the horse's head, and by the Arabic al-faras, the horse. Its stars lie in the head and the mouth, and the magnitude column marks four of them as dim. The section follows Delphinus, and its positions are not transcribed here. {cite:nallino-albatenii-opus-astronomicum pp.153}"
  ur: "فہرست میں چھوٹے گھوڑے کو یونانی نام بوروطومس، یعنی گھوڑے کا سر، اور عربی نام الفرس کے ساتھ لیا گیا ہے۔ اس کے ستارے سر اور منہ میں ہیں، اور قدر کے خانے میں چار ستارے دھندلے لکھے گئے ہیں۔ یہ حصہ دلفین کے بعد آتا ہے۔ مواضع یہاں نقل نہیں ہوئے۔ {cite:nallino-albatenii-opus-astronomicum pp.153}"
