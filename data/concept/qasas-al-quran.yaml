issue:
  ar: "هل قصص القرآن وقائع تاريخية محددة أم عبر عامة؟"
  en: "Are the stories of the Qur'an specific historical events or general lessons?"
perspectives:
  - tradition: sunni
    id: sunni-sharawi
    stance:
      ar: "القصص وقائع حدثت فعلا، والمقصود منها الحكمة لا الأشخاص"
      en: "The stories are events that happened; the aim is the wisdom, not the persons"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن القرآن يقص الحق، فكل قصة فيه أحداث وقعت، ويعلل ترك أسماء الأشخاص بأن المقصود الحكمة لا شخص بعينه {cite:tafsir-sharawi-khawatir-scan p.235} {cite:tafsir-sharawi-khawatir-scan p.236} {cite:tafsir-sharawi-khawatir-scan p.237}."
      en: "Sha'rawi holds that the Qur'an tells the truth, so each story is an event that occurred, and he explains the absence of names by saying the aim is the wisdom rather than a particular person {cite:tafsir-sharawi-khawatir-scan p.235} {cite:tafsir-sharawi-khawatir-scan p.236} {cite:tafsir-sharawi-khawatir-scan p.237}."
    sources: [source/tafsir-sharawi-khawatir-scan]
