id: concept/qasas-al-quran
class: concept
kind: term
label:
  ar: "قصص القرآن"
  en: "The stories of the Qur'an"
  ur: "قرآن کے قصے"
  es: "Las historias del Corán"
  fr: "Les récits du Coran"
  tr: "Kur'an Hikayeleri"
  id: "Cerita Al-Qur'an"
tags: ["nubuwat-browser", "nubuwat-asrar"]
summary:
  ar: "يرى الشعراوي أن قصص القرآن وقائع حدثت فعلا، وأنها تُروى لتثبيت النبي والمؤمنين، وأن الشخصيات فيها تأتي مجهولة الأسماء إلا حين تكون المعجزة لا تتكرر، وأن القصة الواحدة تتوزع على آيات تكمل بعضها {cite:tafsir-sharawi-khawatir-scan p.235} {cite:tafsir-sharawi-khawatir-scan p.236} {cite:tafsir-sharawi-khawatir-scan p.237}."
  en: "Sha'rawi holds that the stories of the Qur'an are events that happened, told to strengthen the Prophet and the believers. The people in them are left unnamed unless their miracle cannot recur, and one story is spread over verses that complete one another {cite:tafsir-sharawi-khawatir-scan p.235} {cite:tafsir-sharawi-khawatir-scan p.236} {cite:tafsir-sharawi-khawatir-scan p.237}."
  ur: "شعراوی کے نزدیک قرآن کے قصے ایسے واقعات ہیں جو واقعی پیش آئے، اور انہیں نبی اور مومنین کو ثابت قدم رکھنے کے لیے بیان کیا گیا۔ ان میں کردار نام کے بغیر آتے ہیں، سوائے اس کے کہ معجزہ دوبارہ نہ ہونے والا ہو، اور ایک قصہ کئی آیات میں بکھرا ہوتا ہے جو ایک دوسرے کی تکمیل کرتی ہیں {cite:tafsir-sharawi-khawatir-scan p.235} {cite:tafsir-sharawi-khawatir-scan p.236} {cite:tafsir-sharawi-khawatir-scan p.237}۔"
  es: "Sha'rawi sostiene que las historias del Corán son eventos que sucedieron, narrados para fortalecer al Profeta y a los creyentes. Las personas en ellas permanecen sin nombre a menos que su milagro no pueda repetirse, y una historia se extiende a lo largo de versículos que se complementan entre sí {cite:tafsir-sharawi-khawatir-scan p.235} {cite:tafsir-sharawi-khawatir-scan p.236} {cite:tafsir-sharawi-khawatir-scan p.237}."
  fr: "Sha'rawi soutient que les récits du Coran relatent des événements réels, contés pour fortifier le Prophète et les croyants. Les personnages y sont anonymes, sauf si leur miracle est irréversible, et chaque récit s'étend sur plusieurs versets qui se complètent mutuellement {cite:tafsir-sharawi-khawatir-scan p.235} {cite:tafsir-sharawi-khawatir-scan p.236} {cite:tafsir-sharawi-khawatir-scan p.237}."
  tr: "El-Şaarawi, Kur'an hikayelerinin Peygamber'i ve müminleri onaylamak için rivayet edilen gerçek olaylar olduğuna, karakterlerin mucize tekrarlanmadığı sürece anonim olarak göründüğüne ve bazı ayetleri tamamlayan ayetler arasında tek bir hikâyenin dağıtıldığına inanır {cite:tafsir-sharawi-khawatir-scan s.235} {cite:tafsir-sharawi-khawatir-scan s.236} {cite:tafsir-sharawi-khawatir-scan s.237}."
  id: "Al-Shaarawi percaya bahwa kisah-kisah Al-Qur'an adalah peristiwa nyata yang terjadi, diceritakan untuk menegaskan Nabi dan para mukminmin, dan bahwa karakter-karakter tersebut muncul secara anonim kecuali jika mukjizat tidak terulang, dan bahwa satu cerita dibagi dalam ayat-ayat yang melengkapi beberapa di antaranya {cite:tafsir-sharawi-khawatir-scan hlm.235} {cite:tafsir-sharawi-khawatir-scan hlm.236} {cite:tafsir-sharawi-khawatir-scan hlm.237}."
