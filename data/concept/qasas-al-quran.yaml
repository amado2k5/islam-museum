id: concept/qasas-al-quran
class: concept
kind: term
label:
  ar: "قصص القرآن"
  en: "The stories of the Qur'an"
  ur: "قرآن کے قصے"
summary:
  ar: "يرى الشعراوي أن قصص القرآن وقائع حدثت فعلا، وأنها تُروى لتثبيت النبي والمؤمنين، وأن الشخصيات فيها تأتي مجهولة الأسماء إلا حين تكون المعجزة لا تتكرر، وأن القصة الواحدة تتوزع على آيات تكمل بعضها {cite:tafsir-sharawi-khawatir-scan p.235} {cite:tafsir-sharawi-khawatir-scan p.236} {cite:tafsir-sharawi-khawatir-scan p.237}."
  en: "Sha'rawi holds that the stories of the Qur'an are events that happened, told to strengthen the Prophet and the believers. The people in them are left unnamed unless their miracle cannot recur, and one story is spread over verses that complete one another {cite:tafsir-sharawi-khawatir-scan p.235} {cite:tafsir-sharawi-khawatir-scan p.236} {cite:tafsir-sharawi-khawatir-scan p.237}."
  ur: "شعراوی کے نزدیک قرآن کے قصے ایسے واقعات ہیں جو واقعی پیش آئے، اور انہیں نبی اور مومنین کو ثابت قدم رکھنے کے لیے بیان کیا گیا۔ ان میں کردار نام کے بغیر آتے ہیں، سوائے اس کے کہ معجزہ دوبارہ نہ ہونے والا ہو، اور ایک قصہ کئی آیات میں بکھرا ہوتا ہے جو ایک دوسرے کی تکمیل کرتی ہیں {cite:tafsir-sharawi-khawatir-scan p.235} {cite:tafsir-sharawi-khawatir-scan p.236} {cite:tafsir-sharawi-khawatir-scan p.237}۔"
