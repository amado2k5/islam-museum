id: concept/iddat-al-hamil
class: concept
kind: legal
label:
  ar: "عدة الحامل"
  en: "The waiting period of the pregnant woman (iddat al-hamil)"
  ur: "حاملہ عورت کی عدت"
  es: "El período de espera de la mujer embarazada (iddat al-hamil)"
summary:
  ar: "عدة الحامل من المطلقات والمتوفى عنهن أزواجهن تنتهي بوضع الحمل، نص عليها قوله تعالى وأولو الأحمال أجلهن أن يضعن حملهن في سورة الطلاق، فلا تنقضي عدتها بمضي الشهور بل بتمام الوضع قريبا كان أو بعيدا، وهي عدة المطلقة الحامل والأرملة الحامل عند جماهير الفقهاء خلافا لمن أجمع بين الأجلين في الوفاة."
  en: "The waiting period of the pregnant woman, whether divorced or widowed, ends when she delivers the pregnancy, as the verse of Sura al-Talaq lays down — and the term of those with child is that they deliver their burden — so her idda does not end with the months but with the delivery, soon or late; this holds for the divorced pregnant woman and the widowed pregnant woman for most jurists, against those who join the two terms in the case of widowhood."
  ur: "حاملہ عورت کی عدت — خواہ طلاق یافتہ ہو یا بیوہ — حمل کے پیدا ہونے پر ختم ہوتی ہے، جیسا کہ سورۃ طلاق کی آیت نے مقرر کیا کہ حمل والوں کی مدت یہ ہے کہ وہ اپنا حمل ڈال دیں، پس اس کی عدت مہینوں کے گزرنے سے نہیں بلکہ وضع حمل سے ختم ہوتی ہے قریب ہو یا دور؛ یہ طلاق یافتہ حاملہ اور بیوہ حاملہ دونوں کے لیے ہے جمهور فقہا کے نزدیک، خلافاً ان کے جو وفات کی صورت میں دونوں مدتوں کو جمع کرتے ہیں۔"
  es: "El período de espera de la mujer embarazada, ya sea divorciada o viuda, termina cuando da a luz, como lo establece el versículo de la Sura al-Talaq; y el plazo para las que están embarazadas es que den a luz. Por lo tanto, su idda no termina con los meses, sino con el parto, pronto o tarde. Esto se aplica tanto a la mujer embarazada divorciada como a la viuda para la mayoría de los juristas, en contra de aquellos que combinan ambos plazos en el caso de la viudez."
