id: concept/gharib-al-quran
class: concept
kind: discipline
label: { ar: "غريب القرآن", en: "Gharib al-Qur'an (the rare words of the Qur'an)", ur: "غریب القرآن", es: "Gharib al-Qur'an (las palabras raras del Corán)", fr: "Gharib al-Qur'an (les paroles rares du Coran)" }
summary:
  ar: "علم يختص بتفسير الألفاظ القرآنية التي غمض معناها وبعدت عن الفهم؛ والغريب فيه ليس المنكر ولا الشاذ، بل اللفظ «الحسن المستغرب في التأويل» كما ينقل مركز الدراسات القرآنية بمجمع الملك فهد عن الرافعي؛ نشأ التأليف فيه في بداية القرن الثاني الهجري، وتنوعت مناهجه بين الترتيب على السور والترتيب المعجمي {cite:muyassar-gharib-quran-king-fahd-1433 p.6} {cite:muyassar-gharib-quran-king-fahd-1433 p.10} {cite:muyassar-gharib-quran-king-fahd-1433 p.14} {cite:muyassar-gharib-quran-king-fahd-1433 p.15}."
  en: "The science of explaining Qur'anic words whose meaning is obscure or remote from ready understanding; the 'rare' here is not the odd or anomalous but, as the Centre for Qur'anic Studies of the King Fahd Complex quotes al-Rafi'i, the word 'fine yet strange in interpretation'; writing on it began in the early second Islamic century, and its methods range from following the order of the suras to dictionary arrangements."
  es: "La ciencia de explicar las palabras coránicas cuyo significado es oscuro o difícil de comprender; lo \"raro\" aquí no es lo extraño o anómalo, sino, como cita el Centro de Estudios Coránicos del Complejo Rey Fahd a al-Rafi'i, la palabra \"fino pero extraño en su interpretación\"; los escritos sobre ella comenzaron a principios del segundo siglo islámico, y sus métodos van desde seguir el orden de las suras hasta la organización en diccionarios."
  fr: "La science qui explique les mots coraniques dont le sens est obscur ou difficile à comprendre; le terme « rare » ici ne signifie pas étrange ou anormal, mais, comme le cite al-Rafi'i du Centre d'études coraniques du complexe du roi Fahd, « fin mais étrange dans son interprétation »; les écrits à ce sujet ont commencé au début du deuxième siècle islamique, et ses méthodes vont du suivi de l'ordre des sourates à l'organisation par dictionnaire."
  ur: "قرآنی الفاظ کی وضاحت کرنے کی سائنس جن کے معنی غیر واضح یا تیار فہم سے دور ہیں۔ یہاں 'نایاب' کوئی عجیب یا غیر معمولی نہیں ہے لیکن جیسا کہ کنگ فہد کمپلیکس کے مرکز برائے قرآنی مطالعات نے الرفاعی کا حوالہ دیا ہے، لفظ 'تعبیر میں ٹھیک لیکن عجیب'؛ اس پر لکھنا دوسری اسلامی صدی کے اوائل میں شروع ہوا، اور اس کے طریقے سورتوں کی ترتیب سے لے کر لغت کی ترتیب تک ہیں۔"
