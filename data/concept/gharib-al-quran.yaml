label: { ar: "غريب القرآن", en: "Gharib al-Qur'an (the rare words of the Qur'an)", ur: "غریب القرآن" }
summary:
  ar: "علم يختص بتفسير الألفاظ القرآنية التي غمض معناها وبعدت عن الفهم؛ والغريب فيه ليس المنكر ولا الشاذ، بل اللفظ «الحسن المستغرب في التأويل» كما ينقل مركز الدراسات القرآنية بمجمع الملك فهد عن الرافعي؛ نشأ التأليف فيه في بداية القرن الثاني الهجري، وتنوعت مناهجه بين الترتيب على السور والترتيب المعجمي {cite:muyassar-gharib-quran-king-fahd-1433 p.6} {cite:muyassar-gharib-quran-king-fahd-1433 p.10} {cite:muyassar-gharib-quran-king-fahd-1433 p.14} {cite:muyassar-gharib-quran-king-fahd-1433 p.15}."
  en: "The science of explaining Qur'anic words whose meaning is obscure or remote from ready understanding; the 'rare' here is not the odd or anomalous but, as the Centre for Qur'anic Studies of the King Fahd Complex quotes al-Rafi'i, the word 'fine yet strange in interpretation'; writing on it began in the early second Islamic century, and its methods range from following the order of the suras to dictionary arrangements."
