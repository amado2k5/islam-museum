id: concept/mufakhadha
class: concept
kind: legal
label:
  ar: المُفَاخَذَة
  en: Thigh contact (mufakhadha)
  ur: مفاخذہ (ران سے ران ملانا)
summary:
  ar: "المفاخذة في اللغة مفاعلة، يقال فاخذ المرأة إذا جلس بين فخذيها أو فوقهما كجلوس المجامع، ولا يخرج الاصطلاح عن ذلك. يُباح للرجل مفاخذة زوجته في غير الإحرام والحيض والنفاس، بحائل أو بغيره، ويحرم مع غير الزوجة. وفي الحج نص الشافعية على تحريمها بشروط، وتوجب الفدية إن كانت قبل التحلل الأول، ولا تفسد النسك. وفي الصوم تُبطل المفاخذة الصوم إن أنزل، ولا تبطله إن لم ينزل، وعند الجمهور لا كفارة فيها، والمالكية يوجبونها. وفي المصاهرة قولان للشافعية في ثبوتها بالمفاخذة الشهوانية. وعند الشافعية لا حد فيها، بل يُعزَّر فاعلها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14803} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14805}"
  en: "Mufakhadha, in the lexical sense, means a man sitting between a woman's thighs or above them as one does in intercourse; the technical sense does not differ. A husband may touch his wife's thighs outside ihram and outside menstruation or postpartum bleeding, with or without a barrier; with a woman who is not his wife it is forbidden. For the pilgrimage, the Shafi'is forbid it under conditions, with a fidya owed when it occurs before the first release, though the rite is not voided. For fasting, mufakhadha breaks the fast if ejaculation follows and not otherwise; most jurists impose no expiation, while the Malikis do. On affinity, the Shafi'is hold two views on whether sexual thigh contact establishes it. For the Shafi'is there is no hadd penalty for it, only discretionary punishment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14803} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14805}"
  ur: "مفاخذہ کے لغوی معنی ران سے ران ملانا یا عورت کی رانوں کے بیچ یا اوپر بیٹھنا ہے۔ بیوی کے ساتھ احرام، حیض اور نفاس کے سوا حالت میں جائز ہے، غیر عورت کے ساتھ حرام ہے۔ روزے میں انزال ہو تو روزہ ٹوٹ جاتا ہے، ورنہ نہیں؛ جمہور کفارہ واجب نہیں کرتے، مالکیہ کرتے ہیں۔ شافعیہ کے نزدیک اس پر حد نہیں، تعزیر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14803} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14805}"
