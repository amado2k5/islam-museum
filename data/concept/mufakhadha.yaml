id: concept/mufakhadha
class: concept
kind: legal
label:
  ar: المُفَاخَذَة
  en: Thigh contact (mufakhadha)
  ur: مفاخذہ ⁦(ران سے ران ملانا)⁩
  es: "Contacto con el muslo (mufakhadha)"
  fr: "Contact cuisse (mufakhadha)"
summary:
  ar: "المفاخذة في اللغة مفاعلة، يقال فاخذ المرأة إذا جلس بين فخذيها أو فوقهما كجلوس المجامع، ولا يخرج الاصطلاح عن ذلك. يُباح للرجل مفاخذة زوجته في غير الإحرام والحيض والنفاس، بحائل أو بغيره، ويحرم مع غير الزوجة. وفي الحج نص الشافعية على تحريمها بشروط، وتوجب الفدية إن كانت قبل التحلل الأول، ولا تفسد النسك. وفي الصوم تُبطل المفاخذة الصوم إن أنزل، ولا تبطله إن لم ينزل، وعند الجمهور لا كفارة فيها، والمالكية يوجبونها. وفي المصاهرة قولان للشافعية في ثبوتها بالمفاخذة الشهوانية. وعند الشافعية لا حد فيها، بل يُعزَّر فاعلها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14803} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14805}"
  en: "Mufakhadha, in the lexical sense, means a man sitting between a woman's thighs or above them as one does in intercourse; the technical sense does not differ. A husband may touch his wife's thighs outside ihram and outside menstruation or postpartum bleeding, with or without a barrier; with a woman who is not his wife it is forbidden. For the pilgrimage, the Shafi'is forbid it under conditions, with a fidya owed when it occurs before the first release, though the rite is not voided. For fasting, mufakhadha breaks the fast if ejaculation follows and not otherwise; most jurists impose no expiation, while the Malikis do. On affinity, the Shafi'is hold two views on whether sexual thigh contact establishes it. For the Shafi'is there is no hadd penalty for it, only discretionary punishment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14803} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14805}"
  ur: "مفاخذہ کے لغوی معنی ران سے ران ملانا یا عورت کی رانوں کے بیچ یا اوپر بیٹھنا ہے۔ بیوی کے ساتھ احرام، حیض اور نفاس کے سوا حالت میں جائز ہے، غیر عورت کے ساتھ حرام ہے۔ روزے میں انزال ہو تو روزہ ٹوٹ جاتا ہے، ورنہ نہیں؛ جمہور کفارہ واجب نہیں کرتے، مالکیہ کرتے ہیں۔ شافعیہ کے نزدیک اس پر حد نہیں، تعزیر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14803} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14805}"
  es: "Mufakhadha, en sentido léxico, significa que un hombre se sienta entre los muslos de una mujer o sobre ellos, como se hace durante el coito; el sentido técnico no difiere. Un esposo puede tocar los muslos de su esposa fuera del ihram y fuera de la menstruación o el sangrado posparto, con o sin barrera; con una mujer que no sea su esposa está prohibido. Para la peregrinación, los shafi'íes lo prohíben bajo ciertas condiciones, con una fidya debiendo cuando ocurre antes de la primera liberación, aunque el rito no se anula. Para el ayuno, mufakhadha rompe el ayuno si hay eyaculación y no en caso contrario; la mayoría de los juristas no imponen expiación, mientras que los malikíes sí. En cuanto a la afinidad, los shafi'íes tienen dos puntos de vista sobre si el contacto sexual entre los muslos la establece. Para los shafi'íes no hay castigo hadd para ello, solo castigo discrecional. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14803} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14804} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14805}"
  fr: "Le terme « mufakhadha », au sens littéral, désigne le fait pour un homme de s'asseoir entre les cuisses d'une femme ou au-dessus d'elles, comme lors d'un rapport sexuel; le sens technique est identique. Un mari peut toucher les cuisses de sa femme en dehors de l'ihram, des menstruations et des saignements post-partum, avec ou sans protection; cela est interdit avec une autre femme. Pour le pèlerinage, les chaféites l'interdisent sous certaines conditions, avec une fidya (amende) due si cela se produit avant la première éjaculation, sans toutefois invalider le rite. Pour le jeûne, le mufakhadha rompt le jeûne si une éjaculation suit, et seulement dans le cas contraire; la plupart des juristes n'imposent aucune expiation, contrairement aux malikites. Concernant l'affinité, les chaféites ont deux avis sur la question de savoir si le contact sexuel entre les cuisses l'établit. Pour eux, il n'y a pas de peine hadd (paiement rituel) prévue à cet effet, seulement une sanction discrétionnaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14803} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14805}"
