summary:
  ar: "أم غيلان شجرة صحراوية شائكة، وهي بحسب الهامش من نوع الأكاسيا؛ قابضة تمنع نفث الدم وسيلان الرحم {cite:canon-ibn-sina-print-v1 p.362} {cite:canon-ibn-sina-print-v1 p.363}."
  en: "Umm ghaylan is a thorny desert tree, which a footnote identifies as an acacia. It is astringent and stops spitting of blood and uterine discharge {cite:canon-ibn-sina-print-v1 p.362} {cite:canon-ibn-sina-print-v1 p.363}."
  ur: "ام غیلان ایک کانٹے دار صحرائی درخت ہے، جسے حاشیے میں ببول کی ایک قسم بتایا گیا ہے؛ یہ قابض ہے اور خون تھوکنے اور رحم کے بہاؤ کو روکتا ہے {cite:canon-ibn-sina-print-v1 p.362} {cite:canon-ibn-sina-print-v1 p.363}۔"
  es: "Umm ghaylan es un árbol espinoso del desierto, que una nota al pie identifica como una acacia. Es astringente y detiene el sangrado y la secreción uterina {cite:canon-ibn-sina-print-v1 p.362} {cite:canon-ibn-sina-print-v1 p.363}."
