id: concept/malaika-khalq
class: concept
kind: doctrine
label:
  ar: خلق الملائكة وأوصافهم
  en: The Creation and Nature of Angels
  ur: فرشتوں کی تخلیق اور اوصاف
summary:
  ar: 'بيان لعقيدة أهل السنة في خلق الملائكة: أنهم خلق خفي لا يُدرَك بدقة، ويذكر أن منهم من خُلق من نور؛ ويصفهم القرآن بأنهم رسل الله [[passage/quran-35-1|فاطر 1]]، لا يعصون الله ما أمرهم [[passage/quran-66-6|التحريم 6]]، يسبحون الليل والنهار لا يفترون [[passage/quran-21-20|الأنبياء 20]]، وأن لكل منهم مقاماً معلوماً [[passage/quran-37-164|الصافات 164]].'
  en: 'A statement of Sunni doctrine on the angels'' creation: a hidden creation whose precise origin is not known, reported in some traditions as created of light; the Qur''an describes them as God''s messengers [[passage/quran-35-1|Fatir 1]] who never disobey [[passage/quran-66-6|al-Tahrim 6]], glorify night and day without flagging [[passage/quran-21-20|al-Anbiya'' 20]], and each has a known station [[passage/quran-37-164|al-Saffat 164]].'
  ur: اہل سنت کی اس عقیدے کا بیان کہ فرشتے ایک پوشیدہ مخلوق ہیں جن کی اصل حقیقت اجمالی ہے اور بعض روایات میں انہیں نور سے پیدا کیا گیا کہا گیا؛ قرآن انہیں اللہ کے رسول کہتا ہے [[passage/quran-35-1|فاطر 1]]، جو کبھی اللہ کی نافرمانی نہیں کرتے [[passage/quran-66-6|التحریم 6]]، رات دن تسبیح کرتے رہتے ہیں [[passage/quran-21-20|الانبیاء 20]]، اور ہر ایک کا مقام معلوم ہے [[passage/quran-37-164|الصافات 164]]۔
