id: concept/malaika-khalq
class: concept
kind: doctrine
label:
  ar: خلق الملائكة وأوصافهم
  en: The Creation and Nature of Angels
  ur: فرشتوں کی تخلیق اور اوصاف
  es: "La creación y la naturaleza de los ángeles"
  fr: "La création et la nature des anges"
  tr: "Meleklerin yaratılışı ve betimlemeleri"
  id: "Penciptaan malaikat dan deskripsinya"
summary:
  ar: 'بيان لعقيدة أهل السنة في خلق الملائكة: أنهم خلق خفي لا يُدرَك بدقة، ويذكر أن منهم من خُلق من نور؛ ويصفهم القرآن بأنهم رسل الله [[passage/quran-35-1|فاطر 1]]، لا يعصون الله ما أمرهم [[passage/quran-66-6|التحريم 6]]، يسبحون الليل والنهار لا يفترون [[passage/quran-21-20|الأنبياء 20]]، وأن لكل منهم مقاماً معلوماً [[passage/quran-37-164|الصافات 164]].'
  en: 'A statement of Sunni doctrine on the angels'' creation: a hidden creation whose precise origin is not known, reported in some traditions as created of light; the Qur''an describes them as God''s messengers [[passage/quran-35-1|Fatir 1]] who never disobey [[passage/quran-66-6|al-Tahrim 6]], glorify night and day without flagging [[passage/quran-21-20|al-Anbiya'' 20]], and each has a known station [[passage/quran-37-164|al-Saffat 164]].'
  ur: اہل سنت کی اس عقیدے کا بیان کہ فرشتے ایک پوشیدہ مخلوق ہیں جن کی اصل حقیقت اجمالی ہے اور بعض روایات میں انہیں نور سے پیدا کیا گیا کہا گیا؛ قرآن انہیں اللہ کے رسول کہتا ہے [[passage/quran-35-1|فاطر 1]]، جو کبھی اللہ کی نافرمانی نہیں کرتے [[passage/quran-66-6|التحریم 6]]، رات دن تسبیح کرتے رہتے ہیں [[passage/quran-21-20|الانبیاء 20]]، اور ہر ایک کا مقام معلوم ہے [[passage/quran-37-164|الصافات 164]]۔
  es: "Una declaración de la doctrina sunita sobre la creación de los ángeles: una creación oculta cuyo origen preciso se desconoce, reportada en algunas tradiciones como creada de luz; el Corán los describe como mensajeros de Dios [[passage/quran-35-1|Fatir 1]] que nunca desobedecen [[passage/quran-66-6|al-Tahrim 6]], glorifican noche y día sin flaquear [[passage/quran-21-20|al-Anbiya' 20]], y cada uno tiene una estación conocida [[passage/quran-37-164|al-Saffat 164]]."
  fr: "Déclaration de la doctrine sunnite sur la création des anges: une création cachée dont l'origine précise n'est pas connue, rapportée dans certaines traditions comme créée de lumière; le Coran les décrit comme les messagers de Dieu [[passage/quran-35-1|Fatir 1]] qui ne désobéissent jamais [[passage/quran-66-6|al-Tahrim 6]], glorifient la nuit et le jour sans faiblir [[passage/quran-21-20|al-Anbiya' 20]], et chacun a une station connue [[passage/quran-37-164|al-Saffat 164]]."
  tr: "Meleklerin yaratılmasıyla ilgili Sünni inancının açıklaması: Onların tam olarak algılanmayan gizli bir yaratılış olduğu. Bazılarının ışıktan yaratıldığı belirtilir; Kur'an onları Allah'ın elçileri olarak tanımlar [[pasaj/kuran-35-1|Fatir 1]], Allah'ın emrettiği gibi itaatsizlik etmeyen [[pasaj/kuran-66-6|At-Tahrim 6]], gece ve gündüzü yüceltmeleri [[pasaj/kuran-20|El-Enbiya 20]] ve her birinin bilinen bir konumu olduğu [[pasaj/kuran-37-164|As-Saffat 164]]."
  id: "Penjelasan tentang ajaran Sunni mengenai penciptaan malaikat: bahwa mereka adalah ciptaan tersembunyi yang tidak benar-benar dipahami. Disebutkan bahwa beberapa dari mereka diciptakan dari cahaya; Al-Qur'an menggambarkan mereka sebagai utusan Allah [[ayat/al-Qur'an-35-1|Fatir 1]], yang tidak membangkang Allah seperti yang diperintahkan-Nya kepada mereka [[ayat/al-quran-66-6|At-Tahrim 6]], memuliakan siang dan malam tanpa melanggar [[ayat/al-quran-20|Al-Qur'an 20]], dan bahwa masing-masing dari mereka memiliki kedudukan yang diketahui [[ayat/al-quran-37-164|As-Saffat 164]]."
