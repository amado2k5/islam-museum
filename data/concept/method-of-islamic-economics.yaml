summary:
  ar: 'تقوم الظواهر الاقتصادية، في رأي المؤلف، على تداخل عوامل كثيرة فلا تُدرس في حالتها الصافية كما تدرس الظواهر المخبرية، فيفرض على الاقتصاد الإسلامي منهجًا مركبًا {cite:usul-iqtisad-islami-0660 p. 29} {cite:usul-iqtisad-islami-0660 p. 30}. ويقوم المنهج على ثلاثة أمور: الاستضاءة بنور الوحي فلا يقرر ما يخالف الكتاب والسنة، والاستفادة من أصول الفقه ومقاصد الشريعة والقواعد الكلية {cite:usul-iqtisad-islami-0660 p. 31}، واستخدام الاستنباط بوضع الفروض والنماذج واختبارها {cite:usul-iqtisad-islami-0660 p. 31} {cite:usul-iqtisad-islami-0660 p. 32}، واستخدام الاستقراء بقراءة الوقائع والإحصاءات للتأكد من النتائج والعلاقات {cite:usul-iqtisad-islami-0660 p. 32}. ويفرّق المؤلف بين الاستنباط الرياضي والمنهج الإسلامي بأن صحة النتائج تعتمد على المقدمات وتطابق الواقع مع النظرية، والمنتج المسلم لا يعظّم ربحه من كل طريق {cite:usul-iqtisad-islami-0660 p. 31} {cite:usul-iqtisad-islami-0660 p. 32}. ويستعمل فرض «بقاء الأشياء الأخرى على حالها» وهو عنده مما عرفه الفقهاء بقولهم «والمسألة بحالها» {cite:usul-iqtisad-islami-0660 p. 29} {cite:usul-iqtisad-islami-0660 p. 30}.'
  tr: "Yazara göre, ekonomik olgular birçok faktörün iç içe karışmasına dayanır, bu yüzden laboratuvar fenomenleri gibi saf halleriyle incelenmezler ve böylece İslam ekonomisine karmaşık bir yaklaşım dayatılır {cite:usul-iqtisad-islami-0660 s. 29} {cite:usul-iqtisad-islami-0660 s. 30}. Metodoloji üç yöne dayanır: Kur'an ve Sünnet'e aykırı olmaması için vahiy ışığında aydınlatma; fıhh ilkelerinden, Şeriat'ın amaçlarından ve genel kurallardan yararlanmak {cite:usul-iqtisad-islami-0660 s. 31}; varsayımlar ve modeller formüle ederek ve test ederek çıkarım yapmak {cite:usul-iqtisad-islami-0660 s. 31}; ve sonuçları ve ilişkileri doğrulamak için gerçekleri ve istatistikleri okuyarak tümevarım kullanma {cite:usul-iqtisad-islami-0660 s. 32}. Yazar, matematiksel çıkarım ile İslami yöntem arasında ayrım yapar; sonuçların geçerliliğinin öncüllere ve gerçekliğin teoriyle uyumuna bağlı olduğunu, Müslüman ürününün her yöntemden elde ettiği kârı maksimize etmediğini belirtir {cite:usul-iqtisad-0660 s. 31} {cite:usul-iqtisad-islami-0660 s. 32}. \"Diğer şeyler olduğu gibi kalır\" varsayımını kullanır; bunu hukukçular olarak şöyle tanımlar: \"ve madde kendi durumundadır\" {cite:usul-iqtisad-islami-0660 s. 29} {cite:usul-iqtisad-islami-0660 s. 30}."
  id: "Menurut penulis, fenomena ekonomi didasarkan pada percampuran banyak faktor, sehingga tidak dipelajari dalam keadaan murni seperti fenomena laboratorium, sehingga menerapkan pendekatan kompleks pada ekonomi Islam {cite:usul-iqtisad-islami-0660 hlm. 29} {cite:usul-iqtisad-islami-0660 hlm. 30}. Metodologi ini didasarkan pada tiga aspek: pencerahan melalui cahaya wahyu agar tidak bertentangan dengan Al-Qur'an dan Sunnah; memanfaatkan prinsip fiqh, tujuan Syariah, dan aturan umum {cite:usul-iqtisad-islami-0660 hlm. 31}; menggunakan deduksi dengan merumuskan hipotesis dan model serta mengujinya {cite:usul-iqtisad-islami-0660 hlm. 31}; serta menggunakan induksi dengan membaca fakta dan statistik untuk memverifikasi hasil dan hubungan {cite:usul-iqtisad-islami-0660 hlm. 32}. Penulis membedakan antara deduksi matematis dan metode Islam, menyatakan bahwa validitas hasil bergantung pada premis dan keselarasan realitas dengan teori, dan produk Muslim tidak memaksimalkan keuntungan dari setiap metode {cite:usul-iqtisad-islami-0660 hlm. 31} {cite:usul-iqtisad-islami-0660 hlm. 32}. Ia menggunakan asumsi bahwa \"hal-hal lain tetap seperti adanya,\" yang ia definisikan sebagai ahli hukum dengan mengatakan, \"dan materi berada dalam keadaannya\" {cite:usul-iqtisad-islami-0660 hlm. 29} {cite:usul-iqtisad-islami-0660 hlm. 30}."
