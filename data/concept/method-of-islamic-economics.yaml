label:
  ar: منهج الاقتصاد الإسلامي
  en: Method of Islamic economics
summary:
  ar: 'تقوم الظواهر الاقتصادية، في رأي المؤلف، على تداخل عوامل كثيرة فلا تُدرس في حالتها الصافية كما تدرس الظواهر المخبرية، فيفرض على الاقتصاد الإسلامي منهجًا مركبًا {cite:usul-iqtisad-islami-0660 p. 29} {cite:usul-iqtisad-islami-0660 p. 30}. ويقوم المنهج على ثلاثة أمور: الاستضاءة بنور الوحي فلا يقرر ما يخالف الكتاب والسنة، والاستفادة من أصول الفقه ومقاصد الشريعة والقواعد الكلية {cite:usul-iqtisad-islami-0660 p. 31}، واستخدام الاستنباط بوضع الفروض والنماذج واختبارها {cite:usul-iqtisad-islami-0660 p. 31} {cite:usul-iqtisad-islami-0660 p. 32}، واستخدام الاستقراء بقراءة الوقائع والإحصاءات للتأكد من النتائج والعلاقات {cite:usul-iqtisad-islami-0660 p. 32}. ويفرّق المؤلف بين الاستنباط الرياضي والمنهج الإسلامي بأن صحة النتائج تعتمد على المقدمات وتطابق الواقع مع النظرية، والمنتج المسلم لا يعظّم ربحه من كل طريق {cite:usul-iqtisad-islami-0660 p. 31} {cite:usul-iqtisad-islami-0660 p. 32}. ويستعمل فرض «بقاء الأشياء الأخرى على حالها» وهو عنده مما عرفه الفقهاء بقولهم «والمسألة بحالها» {cite:usul-iqtisad-islami-0660 p. 29} {cite:usul-iqtisad-islami-0660 p. 30}.'
