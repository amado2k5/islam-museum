id: concept/rad-al-anf
class: concept
kind: scientific
label:
  ar: رض الأنف
  en: The crushing of the nose
  ur: ناک کا کچلنا
  es: "El aplastamiento de la nariz"
summary:
  ar: الأولى والأفضل في رض الأنف أن يحشى من داخل ثم يسوى من خارج ويخرج الحشو كل قليل حتى يستوي ⁦(بوصف الكتاب)⁩، وأما الأطلية النافعة في ذلك فالذي يجب أن يجعل على الكسر من جنس ما يعرف على أنا ربما عاودنا ذكر هذا الباب في كتاب الكسر والجبر ⁦(أسماء الأطلية لا تحمل)⁩ {cite:canon-ibn-sina-print-v2 p.248}
  en: For the crushing of the nose the first and best is that it be stuffed from inside, then evened from outside, the stuffing taken out little by little until it settles ⁦(as the book describes)⁩. The useful embrocation is what is laid on the break, of the known kind; and we may return to this chapter in the book of fracture and setting ⁦(the embrocation names are not carried)⁩ {cite:canon-ibn-sina-print-v2 p.248}
  ur: ناک کے کچلنے میں اولین اور بہترین یہ ہے کہ اندر سے حشو کیا جائے پھر باہر سے برابر کیا جائے اور حشو تھوڑا تھوڑا نکالا جائے یہاں تک کہ مرتب ہو جائے ⁦(کتاب کے بیان کے طور پر)⁩؛ اور اس میں مفید تیل مساج وہ ہے جو معروف جنس کی چیزوں سے ٹوٹی جگہ پر لگایا جائے؛ اور شاید اس باب کا ذکر ہم کسر و جبر کی کتاب میں دوبارہ کریں ⁦(تیل مساج کے نام نہیں لیے گئے)⁩ {cite:canon-ibn-sina-print-v2 p.248}
  es: "Para la fractura de la nariz, lo primero y mejor es rellenarla desde dentro, luego nivelarla desde fuera, retirando el relleno poco a poco hasta que se asiente (como describe el libro). El ungüento útil es el que se aplica sobre la fractura, del tipo conocido; y podemos volver a este capítulo en el libro de fracturas y asentamiento (no se incluyen los nombres de los ungüentos) {cite:canon-ibn-sina-print-v2 p.248}"
