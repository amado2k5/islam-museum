id: concept/umum-al-balwa
class: concept
kind: legal
label:
  ar: "عُمُوم البَلْوَى"
  en: "General affliction ('umum al-balwa) and the rulings built on it"
  ur: "عمومِ بلویٰ"
summary:
  ar: "عموم البلوى حالة أو حادثة تمس كثيراً من الناس ويتعذر الاحتراز عنها، ويعبر عنه بعض الفقهاء بالضرورة العامة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11876}. وقد بنى الفقهاء عليه أحكاماً في الرخص، كالعفو عن يسير بعض النجاسات كدم القروح وذرق الطيور، وطهارة الخف والنعل بالدلك، وجواز الاستصناع وإجارة مجرى الماء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11877} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11878}. وفي الأصول، اختلف الأصوليون في خبر الواحد فيما تعم به البلوى، فقال الأكثرون بقبوله إذا صح سنده، وقال الحنفية لا يقبل مخالفاً لما تعم به البلوى لتقضي العادة بنقله متواتراً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11878} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11879}. واختلفوا في قول الصحابي فيما تعم به البلوى {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11880}."
  en: "General affliction is a situation or event that touches many people and cannot easily be avoided; some jurists call it general necessity {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11876}. On it the jurists built concessions, such as overlooking small impurities such as the blood of sores and the droppings of birds, the purity of a leather sock or shoe cleaned by rubbing, the contract for manufacture (istis'a) and the hire of a water channel {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11877} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11878}. In legal theory, the usulis disagreed on a single report in matters of general affliction; most accept it when the chain is sound, while the Hanafis refuse a report that contradicts what general affliction would make widely known {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11878} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11879}. They also differ on the statement of a companion in such matters {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11880}."
