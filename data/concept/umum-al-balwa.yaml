id: concept/umum-al-balwa
class: concept
kind: legal
label:
  ar: "عُمُوم البَلْوَى"
  en: "General affliction ('umum al-balwa) and the rulings built on it"
  ur: "عمومِ بلویٰ"
  es: "Afligencia general ('umum al-balwa) y las normas basadas en ella"
  fr: "L'affliction générale ('umum al-balwa) et les décisions qui en découlent"
summary:
  ar: "عموم البلوى حالة أو حادثة تمس كثيراً من الناس ويتعذر الاحتراز عنها، ويعبر عنه بعض الفقهاء بالضرورة العامة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11876}. وقد بنى الفقهاء عليه أحكاماً في الرخص، كالعفو عن يسير بعض النجاسات كدم القروح وذرق الطيور، وطهارة الخف والنعل بالدلك، وجواز الاستصناع وإجارة مجرى الماء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11877} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11878}. وفي الأصول، اختلف الأصوليون في خبر الواحد فيما تعم به البلوى، فقال الأكثرون بقبوله إذا صح سنده، وقال الحنفية لا يقبل مخالفاً لما تعم به البلوى لتقضي العادة بنقله متواتراً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11878} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11879}. واختلفوا في قول الصحابي فيما تعم به البلوى {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11880}."
  en: "General affliction is a situation or event that touches many people and cannot easily be avoided; some jurists call it general necessity {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11876}. On it the jurists built concessions, such as overlooking small impurities such as the blood of sores and the droppings of birds, the purity of a leather sock or shoe cleaned by rubbing, the contract for manufacture (istis'a) and the hire of a water channel {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11877} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11878}. In legal theory, the usulis disagreed on a single report in matters of general affliction; most accept it when the chain is sound, while the Hanafis refuse a report that contradicts what general affliction would make widely known {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11878} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11879}. They also differ on the statement of a companion in such matters {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11880}."
  es: "La aflicción general es una situación o evento que afecta a muchas personas y no se puede evitar fácilmente; algunos juristas la llaman necesidad general {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11876}. Sobre ella los juristas construyeron concesiones, como pasar por alto pequeñas impurezas como la sangre de las llagas y los excrementos de las aves, la pureza de un calcetín o zapato de cuero limpiado por frotamiento, el contrato de fabricación (istis'a) y el alquiler de un canal de agua {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11877} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11878}. En teoría jurídica, los usulis discreparon sobre un solo informe en asuntos de aflicción general; La mayoría lo acepta cuando la cadena es sólida, mientras que los hanafíes rechazan un informe que contradice lo que la aflicción general haría ampliamente conocido {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11878} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11879}. También difieren en la declaración de un compañero en tales asuntos {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11880}."
  fr: "L'affliction générale est une situation ou un événement qui touche de nombreuses personnes et qu'il est difficile d'éviter; certains juristes la qualifient de nécessité générale {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11876}. Sur ce fondement, les juristes ont établi des concessions, comme le fait de passer outre de petites impuretés telles que le sang des plaies et les fientes d'oiseaux, la pureté d'une chaussette ou d'une chaussure en cuir nettoyée par frottement, le contrat de fabrication (istis'a) et la location d'un canal d'irrigation {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11877} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11878}. En matière de théorie juridique, les usulis étaient en désaccord sur un seul rapport concernant l'affliction générale; La plupart l'acceptent lorsque la chaîne de transmission est solide, tandis que les Hanafites rejettent un récit qui contredit ce que la souffrance générale rendrait largement connu {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11878} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11879}. Ils divergent également sur la déclaration d'un compagnon en de telles matières {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11880}."
  ur: "عام مصیبت ایک ایسی صورتحال یا واقعہ ہے جو بہت سے لوگوں کو چھوتی ہے اور آسانی سے ٹال نہیں سکتی۔ بعض فقہاء اسے عام ضرورت کہتے ہیں {حوالہ: فقہ معاویہ کویتیہ نور v3 ص11876}۔ اس پر فقہاء نے رعایتیں بنائیں، مثلاً زخموں کے خون اور پرندوں کے قطروں کو نظر انداز کرنا، چمڑے کے جراب یا جوتے کو رگڑ کر صاف کرنا، تیاری کا معاہدہ ⁦(استسعہ)⁩ اور پانی کے نالے کا کرایہ۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص11878}۔ قانونی نظریہ میں، عام مصائب کے معاملات میں عام لوگوں نے ایک رپورٹ پر اختلاف کیا۔ جب سلسلہ صحیح ہو تو اکثر اسے قبول کرتے ہیں، جب کہ احناف اس رپورٹ سے انکار کرتے ہیں جو اس بات سے متصادم ہے کہ عام مصیبت کس چیز کو عام طور پر مشہور کرے گی اس طرح کے معاملات میں ایک صحابی کے قول پر بھی ان کا اختلاف ہے۔"
