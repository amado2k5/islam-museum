id: concept/bay-al-nafs-wal-mal-ila-allah
class: concept
kind: belief
label:
  ar: "بيع النفس والمال إلى الله"
  en: "Selling self and wealth to God (bay al-nafs wal-mal ila Allah)"
  fr: "Vendre sa personne et ses biens à Dieu (bay al-nafs wal-mal ila Allah)"
  ur: "جان و مال کا اللہ کے ہاتھ فروخت کرنا"
  es: "Vender el yo y la riqueza a Dios (bay al-nafs wal-mal ila Allah)"
  tr: "Kendini ve parayı Tanrı'ya satmak"
  id: "Menjual diri dan uang kepada Tuhan"
summary:
  ar: "يعرض الشيخ عمر عبد الكافي بذل النفس والمال في سبيل الله في صورة عقد بيع يكون فيه الله هو المشتري والجنة هي الثمن، ويوصي المسلم بتجديد هذا العقد كل يوم."
  en: "Sheikh Omar Abdelkafy presents the giving of self and wealth in the way of God as a contract of sale in which God is the buyer and Paradise the price, and advises the Muslim to renew the contract every day."
  fr: "Omar Abdelkafy présente le don de soi et de ses biens dans la voie de Dieu comme une vente dont Dieu est l’acheteur et le Paradis le prix ; il conseille au musulman de renouveler quotidiennement ce contrat."
  ur: "شیخ عمر عبدالکافی جان و مال کو اللہ کی راہ میں دینے کو بیع کے معاملے کی صورت میں پیش کرتے ہیں، جس میں خریدار اللہ اور قیمت جنت ہے، اور مسلمان کو ہر روز یہ معاہدہ تازہ کرنے کی نصیحت کرتے ہیں۔"
  es: "El jeque Omar Abdelkafy presenta la entrega de uno mismo y de las riquezas en el camino de Dios como un contrato de compraventa en el que Dios es el comprador y el Paraíso el precio, y aconseja al musulmán que renueve el contrato cada día."
  tr: "Şeyh Ömer Abdulkafi, Allah'ın alıcı olduğu, cennetin ise bedel olduğu bir satış sözleşmesi şeklinde hayatını ve servetini Allah yolunda vermeyi sunar ve Müslümanlara bu sözleşmeyi her gün yenilemelerini tavsiye eder."
  id: "Sheikh Omar Abdul Kafi menyajikan pemberian hidup dan harta seseorang dalam bentuk kontrak penjualan di mana Allah adalah pembeli dan Surga adalah harga, dan ia merekomendasikan agar umat Muslim memperbarui kontrak ini setiap hari."
