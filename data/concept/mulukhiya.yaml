label:
  ar: "ملوخيا"
  en: "Mulukhiya (the mallow)"
  ur: "ملوخیا"
  es: "Mulukhiya (la malva)"
  fr: "Mulukhiya (la mauve)"
  tr: "eğmez"
  id: "Mallow"
summary:
  ar: "الملوخيا هي الخبازي، وقد استقصى الكتاب ذكرها في فصل الخاء، باردة في الأولى رطبة في الثانية، وقيل إنها تفتح سدد الكبد {cite:canon-ibn-sina-print-v1 p.572}."
  en: "Mulukhiya is the mallow, which the book treats at length under the letter kha, cold in the first degree and moist in the second, and said to open obstructions of the liver {cite:canon-ibn-sina-print-v1 p.572}."
  ur: "ملوخیا خبازی ہے جس کا ذکر کتاب نے حرفِ خا میں تفصیل سے کر دیا ہے، پہلے درجے میں ٹھنڈی اور دوسرے میں تر، اور کہا گیا ہے کہ جگر کی رکاوٹیں کھولتی ہے {cite:canon-ibn-sina-print-v1 p.572}۔"
  es: "Mulukhiya es la malva, que el libro trata extensamente bajo la letra kha, fría en el primer grado y húmeda en el segundo, y se dice que abre las obstrucciones del hígado {cite:canon-ibn-sina-print-v1 p.572}."
  fr: "Mulukhiya est la mauve, que le livre traite en détail sous la lettre kha, froide au premier degré et humide au second, et qui est censée ouvrir les obstructions du foie {cite:canon-ibn-sina-print-v1 p.572}."
  tr: "Emek, fırın ürünleridir ve kitapta 'Kha' bölümünde ayrıntılı olarak bahsedilmiş; ilkinde soğuk, ikincisinde nemlidir ve karaciğer pıhtılaşmasını açtığı söylenir {cite:canon-ibn-sina-print-v1 s.572}."
  id: "Mallow adalah kue panggang, dan buku ini telah menjelaskan sebutannya dalam bab tentang 'Kha'; ia dingin pada yang pertama dan lembap pada yang kedua, dan dikatakan membuka pembekuan hati {cite:canon-ibn-sina-print-v1 hlm.572}."
