issue:
  ar: "لماذا امتنع وفد نجران عن المباهلة، وهل يدل الامتناع على شيء في أمر القوم؟"
  en: "Why did the Najran delegation refuse mubahala, and does the refusal show anything about their position?"
perspectives:
- tradition: sunni
  id: sunni-sharawi-refusal-as-doubt
  stance:
    ar: "امتناع الوفد دليل شك، واستعداد النبي بأهله دليل يقين"
    en: "The delegation's refusal is a sign of doubt; the Prophet's readiness with his family is a sign of certainty"
  summary:
    ar: "يرى الشعراوي أن المباهلة في أصلها ضراعة إلى القوة القاهرة، وأن النبي دعا إليها بأمر من الله، فلما جاء النبي بالحسن والحسين وفاطمة وعلي امتنع الوفد وطلب الصلح، وأن من لا يملك يقيناً لا يُقدم على المباهلة. ويذكر أن العرب كانوا يأخذون نساءهم إلى الحرب ليثبت الرجل {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1519}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1520}."
    en: "Sha'rawi holds that mubahala is, at root, supplication to a dominant power, that the Prophet called to it on God's command, and that when the Prophet came with al-Hasan, al-Husayn, Fatima and Ali the delegation refused and asked for a settlement, since one who lacks certainty will not face such a test. He notes that Arab men took their women to war so that they would not flee {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1519}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1520}."
