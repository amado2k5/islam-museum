id: concept/mubahala
class: concept
kind: social
label:
  ar: المباهلة
  en: Mubahala (mutual invocation of God's curse)
summary:
  ar: "المباهلة دعاء يجتمع فيه فريقان مختلفان فيسألان الله أن ينزل لعنته على الكاذب منهما. يعرض الشعراوي دعوة النبي لوفد نجران إليها، ويرى أن إحجام الوفد عنها دليل شك في أمرهم، وأن النبي جاء بأهله على يقين {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1519}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1520}."
  en: "Mubahala is a supplication in which two opposing parties gather and ask God to send His curse on the one who lies. Sha'rawi presents the Prophet's call to the Najran delegation to it, holds that the delegation's refusal showed doubt in their own position, and that the Prophet came with his family in certainty {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1519}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1520}."
wings: [ideas]
