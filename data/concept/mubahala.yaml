label:
  ar: المباهلة
  en: Mubahala (mutual invocation of God's curse)
  es: "Mubahala (invocación mutua de la maldición de Dios)"
  fr: "Mubahala (invocation mutuelle de la malédiction de Dieu)"
  ur: "مباہلہ ⁦(خدا کی لعنت کی باہمی دعا)⁩"
  tr: "Mubahala"
  id: "Mubahala"
summary:
  ar: "المباهلة دعاء يجتمع فيه فريقان مختلفان فيسألان الله أن ينزل لعنته على الكاذب منهما. يعرض الشعراوي دعوة النبي لوفد نجران إليها، ويرى أن إحجام الوفد عنها دليل شك في أمرهم، وأن النبي جاء بأهله على يقين {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1519}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1520}."
  en: "Mubahala is a supplication in which two opposing parties gather and ask God to send His curse on the one who lies. Sha'rawi presents the Prophet's call to the Najran delegation to it, holds that the delegation's refusal showed doubt in their own position, and that the Prophet came with his family in certainty {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1519}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1520}."
  es: "Mubahala es una súplica en la que dos partes opuestas se reúnen y piden a Dios que envíe Su maldición sobre quien miente. Sha'rawi presenta el llamado del Profeta a la delegación de Najrán, sostiene que la negativa de la delegación demostró dudas sobre su propia posición, y que el Profeta llegó con su familia con certeza {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1519}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1520}."
  fr: "La mubahala est une supplication au cours de laquelle deux parties adverses se réunissent et demandent à Dieu de maudire celui qui ment. Sha'rawi rapporte que le Prophète a appelé la délégation de Najran à cette mubahala, et soutient que le refus de cette délégation révélait un doute quant à sa propre position, tandis que le Prophète s'est rendu avec sa famille en toute certitude {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1519}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1520}."
  ur: "مباہلہ ایک دعا ہے جس میں دو مخالف فریق جمع ہوتے ہیں اور خدا سے جھوٹ بولنے والے پر لعنت بھیجتے ہیں۔ شعراوی اس میں نجران کے وفد کو پیغمبر کی دعوت پیش کرتا ہے، اس کا خیال ہے کہ وفد کے انکار سے ان کے اپنے موقف میں شک ظاہر ہوا، اور یہ کہ پیغمبر اپنے اہل و عیال کے ساتھ یقینی طور پر تشریف لائے۔"
  tr: "Mubahala, iki farklı grubun bir araya gelip Allah'tan aralarındaki yalancıya lanetini göndermesini dilediği bir duadır. El-Şaarawi, Peygamber'in davetini Necran heyetine sunar; heyetin bunu reddetmesini konularına dair şüphe kanıtı olarak görür ve Peygamber'in halkını kesin olarak getirdiğini kabul eder {cite:tafsir-sharawi-khawatir-scan-vol-cült-2 s.1519}{cite:tafsir-sharawi-khawatir-scan-vol-vol-cült-2 s.1520}."
  id: "Mubahala adalah doa di mana dua kelompok berbeda berkumpul dan memohon kepada Allah agar mengirimkan kutukan kepada pembohong di antara mereka. Al-Shaarawi menyampaikan undangan Nabi kepada delegasi Najran untuk hadir, menganggap penolakan delegasi tersebut sebagai bukti keraguan atas masalah mereka, dan bahwa Nabi membawa umat-Nya dengan pasti {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1519}{cite:tafsir-sharawi-khawatir-khawatir-scan-vol-2 hlm.1520}."
