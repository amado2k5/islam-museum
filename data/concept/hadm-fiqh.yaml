label: { ar: "هَدْم", en: "Hadm (demolition, real and legal)" }
summary:
  ar: "الهدم في اللغة نقض البناء أو التخريب أو السقوط، ومعناه الاصطلاحي لا يخرج عن معناه اللغوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16458} وهو نوعان: هدم حقيقي في البناء، وهدم تقديري في غيره كالعقود بمعنى الإبطال والنقض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16459} ويجب الهدم الحقيقي في صور منها: كنيسة بناها أهل الكتاب في بلد أحدثه المسلمون، والبناء في حريم النهر، وإخراج جناح أو ساباط في طريق نافذ يضر المارة فيهدمه الحاكم، والحائط المائل فلا ضمان على هادمه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16460} ومن آثار الهدم الحقيقي أن هدم حائط المسجد يوجب تسويته وإصلاحه، وأن هدم المشتري شيئاً من الدار يعد إمضاء للبيع، وأن من هدم بيتاً مصوراً بالصور ضمن قيمته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16460} ومن صور الهدم الحكمي الطلاق الثلاث، إذ تعود المطلقة ثلاثاً بعد زوج آخر بملك جديد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16460}"
  en: "Hadm in the lexical sense is tearing down a building, destruction or collapse; the technical sense does not depart from this. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16458} It is of two kinds: real demolition of a structure, and figurative demolition of something else, such as a contract, meaning annulment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16459} Real demolition is required in several cases: a church built by People of the Book in a city the Muslims founded, a building within a river's buffer, a projecting structure over a public road that harms passers-by (the judge orders it removed), and a leaning wall, whose demolisher bears no liability. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16460} Real demolition has legal effects: demolishing a mosque wall obliges its restoration, a buyer who demolishes part of the house confirms the sale, and one who demolishes a house decorated with figural images owes its value. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16460} The figurative case is triple divorce: a woman divorced three times returns to her husband, after another marriage, under a new marriage, the earlier divorce being demolished. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16460}"
