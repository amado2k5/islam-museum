label: { ar: "هَدْم", en: "Hadm (demolition, real and legal)", es: "Hadm (demolición, real y legal)", fr: "Hadm (démolition, réelle et légale)", ur: "حدم ⁦(مسماری، حقیقی اور قانونی)⁩", tr: "Yıkım", id: "Pembongkaran" }
summary:
  ar: "الهدم في اللغة نقض البناء أو التخريب أو السقوط، ومعناه الاصطلاحي لا يخرج عن معناه اللغوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16458} وهو نوعان: هدم حقيقي في البناء، وهدم تقديري في غيره كالعقود بمعنى الإبطال والنقض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16459} ويجب الهدم الحقيقي في صور منها: كنيسة بناها أهل الكتاب في بلد أحدثه المسلمون، والبناء في حريم النهر، وإخراج جناح أو ساباط في طريق نافذ يضر المارة فيهدمه الحاكم، والحائط المائل فلا ضمان على هادمه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16460} ومن آثار الهدم الحقيقي أن هدم حائط المسجد يوجب تسويته وإصلاحه، وأن هدم المشتري شيئاً من الدار يعد إمضاء للبيع، وأن من هدم بيتاً مصوراً بالصور ضمن قيمته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16460} ومن صور الهدم الحكمي الطلاق الثلاث، إذ تعود المطلقة ثلاثاً بعد زوج آخر بملك جديد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16460}"
  en: "Hadm in the lexical sense is tearing down a building, destruction or collapse; the technical sense does not depart from this. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16458} It is of two kinds: real demolition of a structure, and figurative demolition of something else, such as a contract, meaning annulment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16459} Real demolition is required in several cases: a church built by People of the Book in a city the Muslims founded, a building within a river's buffer, a projecting structure over a public road that harms passers-by (the judge orders it removed), and a leaning wall, whose demolisher bears no liability. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16460} Real demolition has legal effects: demolishing a mosque wall obliges its restoration, a buyer who demolishes part of the house confirms the sale, and one who demolishes a house decorated with figural images owes its value. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16460} The figurative case is triple divorce: a woman divorced three times returns to her husband, after another marriage, under a new marriage, the earlier divorce being demolished. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16460}"
  es: "Hadm en el sentido léxico es derribar un edificio, destrucción o colapso; el sentido técnico no se aparta de esto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16458} Hay dos tipos: demolición real de una estructura y demolición figurada de otra cosa, como un contrato, que significa anulación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16459} La demolición real es necesaria en varios casos: una iglesia construida por Gente del Libro en una ciudad fundada por los musulmanes, un edificio dentro de la zona de amortiguación de un río, una estructura que sobresale sobre una vía pública que perjudica a los transeúntes (el juez ordena su remoción) y un muro inclinado, cuyo demolidor no tiene responsabilidad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16460} La demolición real tiene efectos legales: demoler el muro de una mezquita obliga a su restauración, un comprador que demuele parte de la casa confirma la venta, y quien demuele una casa decorada con imágenes figurativas debe su valor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16460} El caso figurado es el triple divorcio: una mujer divorciada tres veces regresa con su marido, después de otro matrimonio, bajo un nuevo matrimonio, quedando anulado el divorcio anterior. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16460}"
  fr: "Le terme « hadm », au sens littéral, désigne la démolition d'un bâtiment, sa destruction ou son effondrement; le sens technique reste identique. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16458} Il existe deux types de démolition: la démolition proprement dite d'une structure et la démolition figurative d'autre chose, comme un contrat, signifiant son annulation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16459} La démolition proprement dite est requise dans plusieurs cas: une église construite par les Gens du Livre dans une ville fondée par les musulmans, un bâtiment situé dans la zone tampon d'un cours d'eau, une construction en saillie au-dessus d'une voie publique qui gêne les passants (le juge ordonne sa démolition), et un mur penché, dont la démolition n'engage aucune responsabilité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16460} La démolition réelle a des effets juridiques: la démolition d’un mur de mosquée oblige à sa restauration, un acheteur qui démolit une partie de la maison confirme la vente, et celui qui démolit une maison ornée d’images figuratives doit en payer la valeur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16460} Le cas figuratif est celui du triple divorce: une femme divorcée trois fois retourne auprès de son mari après un nouveau mariage, le divorce précédent étant annulé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16460}"
  ur: "لغوی معنوں میں حمد کسی عمارت کو گرانا، تباہی یا گرنا ہے۔ تکنیکی احساس اس سے الگ نہیں ہوتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 16458} یہ دو طرح کا ہوتا ہے: کسی ڈھانچے کا حقیقی انہدام، اور کسی اور چیز کا علامتی انہدام، جیسے معاہدہ، یعنی منسوخی۔ {حوالہ:فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 16459} متعدد صورتوں میں حقیقی مسماری کی ضرورت ہے: مسلمانوں کے قائم کردہ شہر میں اہل کتاب کی طرف سے تعمیر کردہ چرچ، دریا کے بفر کے اندر ایک عمارت، ایک عوامی سڑک پر تعمیراتی ڈھانچہ جو راہگیروں کو نقصان پہنچاتا ہے ⁦(جج اسے ہٹانے کا حکم دیتا ہے)⁩، اور ایک دیوار کو ہٹانے کا حکم دیا گیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16459} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16460} حقیقی مسمار کرنے کے قانونی اثرات ہوتے ہیں: مسجد کی دیوار گرانے سے اس کی بحالی واجب ہوتی ہے، خریدار جو منہدم کرتا ہے جس نے مکان کا حصہ گرانے کی تصدیق کی اور مکان کو مسمار کرنے کی تصدیق کی۔ فگرل امیجز اس کی قدر کی مرہون منت ہیں۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 16460} علامتی صورت تین طلاق ہے: تین بار طلاق دینے والی عورت اپنے شوہر کے پاس واپس آجاتی ہے، دوسری شادی کے بعد، نئی شادی کے تحت، پہلے والی طلاق کو توڑ دیا جاتا ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 16460}"
  tr: "Dil açısından yıkım, bir binanın yıkılması veya çökmesi anlamına gelir ve teknik anlamı dilsel anlamından sapmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16458} İki türe ayrılır: inşaatta gerçek yıkım ve sözleşmeler gibi diğer durumlarda isteğe bağlı yıkım, yani iptal ve iptal anlamına gelir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16459} Gerçek yıkım, şu durumlarda gereklidir: Müslümanlar tarafından kurulan bir toprakta Kitap Ahli tarafından inşa edilen bir kilise, nehir kutsal alanında inşaat, geçenlere zarar veren bir geçitte kanat veya sabbatın kaldırılması ve hükümdarın yıktığı bir geçitte bir kanat veya sabbatın kaldırılması ve yıkımın sorumlu olmadığı eğik bir duvar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16460} Gerçek yıkımın etkilerinden biri, cami duvarının yıkılmasının düzleştirilmesi ve onarılmasını gerektirmesi, alıcının evdeki bir şeyi yıkması satış imzası olarak kabul edilmesi ve evin yıkımının değerinin bir parçası olarak fotoğraflanmasıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16460} Yasal yıkım türlerinden biri, boşanmış bir kadının başka bir kocasının yeni mülkle barışması olan üçlü talaqtır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16460}"
  id: "Dalam bahasa, pembongkaran berarti penghancuran atau runtuhnya sebuah bangunan, dan makna teknisnya tidak menyimpang dari makna linguistiknya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16458} Pembongkaran ini terdiri dari dua jenis: pembongkaran nyata dalam konstruksi, dan pembongkaran diskresioner dalam kasus lain seperti kontrak, yang berarti pembatalan dan pembatalan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16459} Pembongkaran nyata diperlukan dalam kasus seperti: sebuah gereja yang dibangun oleh Umat Kitab di tanah yang didirikan oleh umat Muslim, pembangunan di tempat suci sungai, penghapusan sayap atau sabbat di lorong yang merugikan orang yang lewat dan penguasa membongkarnya, serta tembok miring di mana pembongkaran tidak dapat dilakukan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16460} Salah satu efek dari pembongkaran sebenarnya adalah bahwa pembongkaran dinding masjid memerlukan perataan dan perbaikan, pembongkaran oleh pembeli terhadap sesuatu di rumah dianggap sebagai tanda tangan untuk dijual, dan pembongkaran rumah difoto sebagai bagian dari nilainya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16460} Di antara bentuk pembongkaran legal adalah triple talaq, di mana seorang wanita yang bercerai berdamai setelah suami lain dengan properti baru. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16460}"
