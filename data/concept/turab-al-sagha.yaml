summary:
  ar: "تراب الصاغة الرماد المتساقط في حوانيت الصاغة ولا يدرى ما فيه من الذهب أو الفضة. وتختلف المذاهب في بيعه: فالحنفية لا يجيزون بيع تراب الفضة بفضة، والشافعية لا يجيزونه قبل تصفيته، والمالكية لشدة الغرر لا يجيزونه، والحنابلة لا يجيزون بيعه بجنسه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4916} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4918}"
  en: "Goldsmiths' dust is the ash found in the workshops of goldsmiths, with no knowing what gold or silver is in it. The schools differ on selling it: the Hanafis forbid selling silver dust for silver, the Shafi'is forbid it before it is refined, the Malikis forbid it for its gross uncertainty, and the Hanbalis forbid selling it for its own kind. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4916} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4918}"
  es: "El polvo de orfebre es la ceniza que se encuentra en los talleres de orfebrería, sin saber si contiene oro o plata. Las escuelas discrepan sobre su venta: los hanafíes prohíben vender polvo de plata por plata, los shafiíes lo prohíben antes de su refinamiento, los malikíes lo prohíben por su gran incertidumbre, y los hanbalíes prohíben venderlo por su propia naturaleza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4916} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4918}"
  fr: "La poussière d'orfèvre est la cendre trouvée dans les ateliers d'orfèvres, sans que l'on sache si elle contient de l'or ou de l'argent. Les écoles juridiques divergent quant à sa vente: les hanafites interdisent de vendre la poussière d'argent contre de l'argent, les chaféites l'interdisent avant raffinage, les malikites l'interdisent en raison de son extrême incertitude, et les hanbalites l'interdisent de la vendre comme argent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4916} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4918}"
  ur: "سناروں کی خاک وہ راکھ ہے جو سناروں کی ورکشاپوں میں پائی جاتی ہے جس میں کوئی نہیں جانتا کہ اس میں سونا یا چاندی کیا ہے۔ اس کے بیچنے میں مکاتب کا اختلاف ہے: حنفیہ نے چاندی کی مٹی کو چاندی کے بدلے بیچنے سے منع کیا ہے، شافعیہ نے اسے صاف کرنے سے پہلے منع کیا ہے، مالکیہ نے اسے اس کی غیر یقینی صورت حال کی وجہ سے منع کیا ہے، اور حنبلی اسے اپنی قسم کے لیے فروخت کرنے سے منع کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 4916} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4917}"
  tr: "Kuyumcu tozu, mücevher dükkanlarında düşen küldür ve içinde altın mı yoksa gümüş mü olduğu bilinmemektedir. Okullar satışı konusunda farklılık gösterir: Hanafiler gümüş tozunun satışına izin vermez, Şafiiler tasfiye edilmeden önce izin vermez, Malikiler belirsizlik nedeniyle izin vermez ve Hanbaliler türü olarak satılmasına izin vermez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4916} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4918}"
  id: "Debu tukang emas adalah abu yang jatuh di toko perhiasan, dan tidak diketahui apakah mengandung emas atau perak. Aliran berbeda mengenai penjualannya: Hanafi tidak mengizinkan penjualan debu perak untuk perak, Shafi'i tidak mengizinkannya sebelum dilikuidasi, Malili tidak mengizinkannya karena ketidakpastian yang sangat tinggi, dan Hanbal tidak mengizinkan penjualannya berdasarkan jenisnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4916} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4918}"
