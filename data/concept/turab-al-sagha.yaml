summary:
  ar: "تراب الصاغة الرماد المتساقط في حوانيت الصاغة ولا يدرى ما فيه من الذهب أو الفضة. وتختلف المذاهب في بيعه: فالحنفية لا يجيزون بيع تراب الفضة بفضة، والشافعية لا يجيزونه قبل تصفيته، والمالكية لشدة الغرر لا يجيزونه، والحنابلة لا يجيزون بيعه بجنسه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4916} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4918}"
  en: "Goldsmiths' dust is the ash found in the workshops of goldsmiths, with no knowing what gold or silver is in it. The schools differ on selling it: the Hanafis forbid selling silver dust for silver, the Shafi'is forbid it before it is refined, the Malikis forbid it for its gross uncertainty, and the Hanbalis forbid selling it for its own kind. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4916} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4918}"
