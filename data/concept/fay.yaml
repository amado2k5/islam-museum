id: concept/fay
class: concept
kind: legal
label:
  ar: الفيء
  en: Fay' (property restored without battle)
  es: "Fay' (propiedad restaurada sin batalla)"
  fr: "Fay' (propriété restituée sans combat)"
  ur: "Fay' ⁦(جائیداد بغیر جنگ کے بحال ہوئی)⁩"
  tr: "Al-Fay'a"
  id: "Al-Fay'a"
summary:
  ar: "الفيء عند البلاذري ما أفاء الله على المسلمين من أموال أهل الكتاب بغير قتال: فبعد فتح خيبر عنوة صالح أهل فدك رسول الله على نصف أرضهم بتربتها «فكان نصف فدك خالصاً لرسول الله لأنه لم يوجف المسلمون عليه بخيل ولا ركاب»؛ وروي عن عمر أنه قال «كانت لرسول الله ثلاث صفايا: فكانت أرض بني النضير حبساً لنوائبه، وجزّأ خيبر على ثلاثة أجزاء، وكانت فدك لأبناء السبيل» — والآية المرجعية [[passage/quran-59-7|سورة الحشر 7]] في أموال بني النضير. فالفيء يقابل الغنيمة: ما أُوجف عليه بالخيل والركاب قُسم على المقاتلة وما أُفيء دون قتال كان للنبي يضعه حيث وضعه الله. — وهذا التقرير نفسه عند البخاري على لسان عمر في قصة العباس وعلي {cite:sahih-al-bukhari 4033}"
  en: "Fay' in al-Baladhuri's usage is property God restored (afaa) to the Muslims from the People of the Book without combat: after Khaybar was taken by force the people of Fadak made peace with the Prophet on half their land with its soil, 'so half of Fadak was the Prophet's alone because the Muslims had not charged upon it with horse or camel'; and Umar is reported saying 'the Prophet had three safaya — the land of Banu al-Nadir as an endowment for his contingencies, Khaybar divided into three parts, and Fadak for the wayfarers' — the governing verse being [[passage/quran-59-7|al-Hashr 59:7]] concerning Banu al-Nadir's property. Fay' thus contrasts with ghanima: what was charged upon with horse and camel was divided among the fighters, while what was restored without fighting was the Prophet's to place where God placed it."
  es: "En el uso de al-Baladhuri, fay' se refiere a la propiedad que Dios restituyó (afaa) a los musulmanes de la Gente del Libro sin combate: después de que Khaybar fue tomada por la fuerza, la gente de Fadak hizo las paces con el Profeta sobre la mitad de su tierra con su suelo, 'así que la mitad de Fadak fue solo del Profeta porque los musulmanes no la habían asaltado con caballos ni camellos'; y se dice que Umar afirmó que 'el Profeta tenía tres safaya: la tierra de Banu al-Nadir como dotación para sus contingencias, Khaybar dividida en tres partes y Fadak para los viajeros'; el versículo que rige es [[passage/quran-59-7|al-Hashr 59:7]] con respecto a la propiedad de Banu al-Nadir. Fay' contrasta así con ghanima: lo que fue asaltado con caballos y camellos fue dividido entre los combatientes, mientras que lo que fue restituido sin luchar fue del Profeta al lugar donde Dios lo colocó."
  fr: "Le terme « fay' », selon al-Baladhuri, désigne les biens que Dieu a restitués (afaa) aux musulmans, sans combat, provenant des Gens du Livre. Après la prise de Khaybar par la force, les habitants de Fadak ont fait la paix avec le Prophète concernant la moitié de leurs terres et de leur sol. « Ainsi, la moitié de Fadak appartenait exclusivement au Prophète, car les musulmans ne l'avaient pas envahie avec des chevaux ou des chameaux. » On rapporte également qu'Umar a dit: « Le Prophète disposait de trois safaya: les terres des Banu al-Nadir en dot pour ses besoins, Khaybar divisée en trois parts, et Fadak pour les voyageurs. » Le verset de référence étant [[passage/quran-59-7|al-Hashr 59:7]], relatif aux biens des Banu al-Nadir. Le terme « fay' » s'oppose donc à « ghanima »: ce qui avait été envahi par des chevaux et des chameaux était partagé entre les combattants, tandis que ce qui avait été restitué sans combat appartenait au Prophète à l'endroit où Dieu l'avait placé."
  ur: "البلادوری کے استعمال میں فَے وہ ملکیت ہے جو اللہ نے مسلمانوں کو اہل کتاب سے بغیر کسی جنگ کے بحال کر دی تھی: خیبر پر جبر کے ساتھ قبضہ کرنے کے بعد فدک کے لوگوں نے نبی کے ساتھ اپنی آدھی زمین پر اس کی مٹی کے ساتھ صلح کر لی تھی، اس لیے فدک کا آدھا حصہ صرف نبی کا تھا کیونکہ مسلمانوں نے اس پر گھوڑے یا اونٹ کا الزام نہیں لگایا تھا۔ اور عمر سے مروی ہے کہ رسول اللہ کے پاس تین صفے تھے - بنو نضیر کی زمین آپ کے ہنگامی حالات کے لیے وقف کے طور پر، خیبر کو تین حصوں میں تقسیم کیا گیا اور مسافروں کے لیے فدک۔ اس طرح فائی غنیما سے متصادم ہے: جو کچھ گھوڑے اور اونٹ پر لگایا گیا تھا وہ جنگجوؤں میں تقسیم کر دیا گیا تھا، جب کہ جو چیز بغیر لڑائی کے بحال ہوئی تھی وہ پیغمبر کی جگہ تھی جہاں خدا نے اسے رکھا تھا۔"
  tr: "El-Baladhuri'ye göre, 'Fay', Allah'ın Müslümanlara Kitap Ehli'nin servetinden savaşmadan verdiği şeydir: Haybar'ın zorla fethedilmesinden sonra, Fadak halkı, Allah'ın Resulleri tarafından Fadak halkını topraklarının ve topraklarının yarısını zorla kurtardı, 'yani Fadak'ın yarısı sadece Allah'ın Elçi'ne aitti, çünkü Müslümanlar ona cimri ya da süvari birlikleriyle para harcamadılar.' Ömer'den rivayet edilir: 'Ömer'den şöyle der: 'Ömer'den rivayet edilir Banu Nadir'in toprakları onun felaketleri için bir hapisteydi, Haybar üç parçaya bölünmüştü ve Fadak yol gezginleri içindi.' — Ve Banu Nadir'in servetiyle ilgili atıf ayeti [[pasaj/kuran-59-7|Haşr Suresi 7]]. Fay'i ganimetlere karşılık gelir: atlar ve atlarla harcanan şey savaşta yemin edilir, savaşmadan ödenen ise Peygamber'in Allah'ın koyduğu yere koymasıydı. — Ve aynı haber, El-Buhari'nin Ömer olarak anlatımında da yer alıyor {cite:sahih-al-bukhari 4033}"
  id: "Menurut al-Baladhuri, 'Fay' adalah apa yang Allah bayarkan kepada umat Muslim dari kekayaan umat Kitab tanpa berperang: Setelah penaklukan paksa Khaybar, umat Fadak menebus secara paksa umat Fadak oleh Rasulullah atas setengah tanah dan tanahnya, 'jadi setengah Fadak hanya untuk Rasulullah, karena umat Muslim tidak membuang waktu untuknya dengan kavaleri pelit atau berkuda.' Dinawayatkan dari Umar bahwa ia berkata: 'Tanah Banu Nadir adalah tempat penahanan karena bencana-nya, Khaybar dibagi menjadi tiga bagian, dan Fadak untuk para pengembara di jalan.' — Dan ayat referensi [[ayat/al-quran-59-7|Surah Al-Hashr 7]] mengenai kekayaan Banu Nadir. Fay'i sesuai dengan rampasan: apa yang dibelanjakan untuknya dengan kuda dan kuda disumpah dalam pertempuran, dan apa yang dibayar tanpa berperang adalah Nabi meletakkannya di tempat Allah meletakkannya. — Dan laporan yang sama terdapat dalam riwayat Al-Bukhari sebagai Umar dalam kisah Al-Abbas dan Ali {cite:sahih-al-bukhari 4033}"
