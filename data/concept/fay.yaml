label:
  ar: الفيء
  en: Fay' (property restored without battle)
summary:
  ar: "الفيء عند البلاذري ما أفاء الله على المسلمين من أموال أهل الكتاب بغير قتال: فبعد فتح خيبر عنوة صالح أهل فدك رسول الله على نصف أرضهم بتربتها «فكان نصف فدك خالصاً لرسول الله لأنه لم يوجف المسلمون عليه بخيل ولا ركاب»؛ وروي عن عمر أنه قال «كانت لرسول الله ثلاث صفايا: فكانت أرض بني النضير حبساً لنوائبه، وجزّأ خيبر على ثلاثة أجزاء، وكانت فدك لأبناء السبيل» — والآية المرجعية [[passage/quran-59-7|سورة الحشر 7]] في أموال بني النضير. فالفيء يقابل الغنيمة: ما أُوجف عليه بالخيل والركاب قُسم على المقاتلة وما أُفيء دون قتال كان للنبي يضعه حيث وضعه الله. — وهذا التقرير نفسه عند البخاري على لسان عمر في قصة العباس وعلي {cite:sahih-al-bukhari 4033}"
  en: "Fay' in al-Baladhuri's usage is property God restored (afaa) to the Muslims from the People of the Book without combat: after Khaybar was taken by force the people of Fadak made peace with the Prophet on half their land with its soil, 'so half of Fadak was the Prophet's alone because the Muslims had not charged upon it with horse or camel'; and Umar is reported saying 'the Prophet had three safaya — the land of Banu al-Nadir as an endowment for his contingencies, Khaybar divided into three parts, and Fadak for the wayfarers' — the governing verse being [[passage/quran-59-7|al-Hashr 59:7]] concerning Banu al-Nadir's property. Fay' thus contrasts with ghanima: what was charged upon with horse and camel was divided among the fighters, while what was restored without fighting was the Prophet's to place where God placed it."
