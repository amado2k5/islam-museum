id: concept/add-al-ay
class: concept
kind: term
label:
  ar: "عدّ الآي"
  en: "Counting the verses ('add al-ay)"
  ur: "عدّ الآی (آیات کی گنتی)"
summary:
  ar: "علم معرفة مواضع رؤوس الآيات وعددها في كل سورة؛ ويختلف فيه أهل الأمصار — الكوفيون والبصريون والحجازيون ⁦(المكي والمدني)⁩ والشاميون — لأن بعضهم يعدّ جملة ما آيةً مستقلة ويعدّها غيرهم جزءًا من آية. ويذكر محمد سيد طنطاوي هذا الاختلاف في تمهيد كل سورة من «التفسير الوسيط»."
  en: "The science of knowing where each verse ends and how many verses each sura has. The regional traditions — Kufan, Basran, Hijazi (Meccan and Medinan) and Syrian — differ in it, because some count a given phrase as a verse of its own while others count it as part of a verse. Muhammad Sayyid Tantawi records these differences in the introduction to each sura of al-Tafsir al-Wasit."
  ur: "ہر سورت میں آیات کے اختتامی مقامات اور ان کی تعداد جاننے کا علم۔ اس میں شہروں کی روایات — کوفی، بصری، حجازی (مکی و مدنی) اور شامی — مختلف ہیں، کیونکہ بعض ایک جملے کو مستقل آیت گنتے ہیں اور دوسرے اسے آیت کا حصہ سمجھتے ہیں۔ محمد سید طنطاوی «التفسیر الوسیط» میں ہر سورت کی تمہید میں یہ اختلاف ذکر کرتے ہیں۔"
wings: [words]
themes: [scripture-and-its-sciences]
regions: [arabia, levant-iraq]
issue:
  ar: "لماذا يختلف عدد آيات بعض السور بين المصاحف؟"
  en: "Why does the number of verses in some suras differ between mushafs?"
  ur: "بعض سورتوں کی آیات کی تعداد مصاحف میں مختلف کیوں ہے؟"
perspectives:
  - tradition: sunni
    id: regional-counts-differ-in-verse-ends
    standing: main
    stance:
      ar: "الخلاف في مواضع رؤوس الآي لا في النص"
      en: "The difference lies in where verses end, not in the text"
      ur: "اختلاف آیات کے اختتامی مقامات میں ہے، متن میں نہیں"
    summary:
      ar: "يشرح طنطاوي في سورة النساء أن الكوفيين عدّوا جملة منها آية فبلغت عندهم 176، وأن الشاميين وافقوهم وعدّوا جملة أخرى آية فبلغت عندهم 177، أما الحجازيون والبصريون فرأوا أن ذلك جزء من آية فعدّوها 175 {cite:tafsir-tantawi-wasit p.1074}."
      en: "Tantawi explains for Surat al-Nisa' that the Kufans counted one phrase in it as a verse, giving 176; the Syrians agreed and also counted another phrase as a verse, giving 177; while the Hijazis and Basrans held these to be parts of verses and counted 175 {cite:tafsir-tantawi-wasit p.1074}."
      ur: "طنطاوی سورۂ نساء کے بارے میں بتاتے ہیں کہ کوفیوں نے اس کے ایک جملے کو آیت شمار کیا تو تعداد 176 ہوئی؛ شامیوں نے ان سے اتفاق کیا اور ایک اور جملے کو بھی آیت گنا تو 177 ہوئی؛ جبکہ حجازیوں اور بصریوں کے نزدیک یہ آیات کے حصے ہیں، چنانچہ انہوں نے 175 گنیں {cite:tafsir-tantawi-wasit p.1074}۔"
