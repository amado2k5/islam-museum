id: concept/add-al-ay
class: concept
kind: term
label:
  ar: "عدّ الآي"
  en: "Counting the verses ('add al-ay)"
  fr: "Décompte des versets (’add al-ay)"
  ur: "عدّ الآی ⁦(آیات کی گنتی)⁩"
  es: "Contando los versículos ('add al-ay')"
  tr: "göz saymak"
  id: "hitung mata"
summary:
  ar: "علم معرفة مواضع رؤوس الآيات وعددها في كل سورة؛ ويختلف فيه أهل الأمصار — الكوفيون والبصريون والحجازيون ⁦(المكي والمدني)⁩ والشاميون — لأن بعضهم يعدّ جملة ما آيةً مستقلة ويعدّها غيرهم جزءًا من آية. ويذكر محمد سيد طنطاوي هذا الاختلاف في تمهيد كل سورة من «التفسير الوسيط»."
  en: "The science of knowing where each verse ends and how many verses each sura has. The regional traditions — Kufan, Basran, Hijazi (Meccan and Medinan) and Syrian — differ in it, because some count a given phrase as a verse of its own while others count it as part of a verse. Muhammad Sayyid Tantawi records these differences in the introduction to each sura of al-Tafsir al-Wasit."
  fr: "Science qui détermine où finit chaque verset et combien de versets compte chaque sourate. Les traditions régionales de Koufa, de Bassora, du Hedjaz (La Mecque et Médine) et de Syrie divergent : les unes comptent un passage comme un verset à part entière, les autres comme une partie de verset. Muhammad Sayyid Tantawi consigne ces différences dans l’introduction à chaque sourate de son al-Tafsir al-Wasit."
  ur: "ہر سورت میں آیات کے اختتامی مقامات اور ان کی تعداد جاننے کا علم۔ اس میں شہروں کی روایات — کوفی، بصری، حجازی ⁦(مکی و مدنی)⁩ اور شامی — مختلف ہیں، کیونکہ بعض ایک جملے کو مستقل آیت گنتے ہیں اور دوسرے اسے آیت کا حصہ سمجھتے ہیں۔ محمد سید طنطاوی «التفسیر الوسیط» میں ہر سورت کی تمہید میں یہ اختلاف ذکر کرتے ہیں۔"
  es: "La ciencia de determinar dónde termina cada versículo y cuántos versículos tiene cada sura. Las tradiciones regionales —Kufán, Basán, Hiyazí (Meca y Medina) y Siria— difieren en este aspecto, ya que algunas consideran una frase como un versículo independiente, mientras que otras la consideran parte de un versículo. Muhammad Sayyid Tantawi registra estas diferencias en la introducción a cada sura de al-Tafsir al-Wasit."
  tr: "Her suredeki ayet başlıklarının yerlerini ve sayısını bilme bilimi; bölge halkı bu konuda farklıdır—Kufanlar, Basranlar, Hicazi (Mekke ve Medinanlılar) ve Levantililer—çünkü bazıları belirli bir cümleyi bağımsız bir ayet olarak görürken, diğerleri onu bir ayetin parçası olarak kabul eder. Muhammed Seyyid Tantawi, her surenin \"El-Tefsir'i Vesit\"ten giriş kısmındaki bu farkı belirtir."
  id: "Ilmu mengetahui lokasi dan jumlah judul ayat dalam setiap surat; orang-orang di wilayah berbeda dalam hal ini—Kufan, Basran, Hijazi (Mekah dan Madinah), dan Levantine—karena beberapa menganggap suatu kalimat sebagai ayat independen, sementara yang lain menganggapnya sebagai bagian dari ayat. Muhammad Sayyid Tantawi menyebutkan perbedaan ini dalam pengantar setiap surah dari \"Al-Tafsir al-Wasit.\""
