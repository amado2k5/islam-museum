id: concept/divine-ownership-of-all-things
class: concept
kind: belief
label: { ar: "ملك الله لما في السماوات والأرض", en: "God's ownership of all that is in the heavens and earth", ur: "آسمانوں اور زمین کی ہر چیز پر اللہ کی ملکیت" }
summary:
  ar: "يرى الشعراوي أن ملكية البشر للأشياء عرض يزول بالموت أو بالأغيار، وأن الكون كله لله، وأن من وصل إلى الغنى أو الجاه فليحذر لأن النعمة تتغير، وأن الحساب يكون بما سُجل عليه لا بما علمه الله فحسب {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1231} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1232} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1233}."
  en: "Sha'rawi holds that human ownership of things is an accident that ends with death or with changing circumstances, and that all things belong to God. Whoever reaches wealth or standing should beware, since blessing changes. Accountability is for what is recorded, not only for what God knows {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1231} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1232} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1233}."
  ur: "شعراوی کے نزدیک انسان کی چیزوں پر ملکیت ایک عارضی حالت ہے جو موت یا حالات کے بدلنے سے ختم ہو جاتی ہے، اور کائنات کی ہر چیز اللہ کی ہے۔ جو دولت یا مرتبہ پائے وہ محتاط رہے کیونکہ نعمت بدلتی ہے۔ حساب اس پر ہوگا جو ریکارڈ میں آیا، نہ کہ صرف اس پر جو اللہ کو معلوم ہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1231} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1232} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1233}۔"
