id: concept/divine-ownership-of-all-things
class: concept
kind: belief
label: { ar: "ملك الله لما في السماوات والأرض", en: "God's ownership of all that is in the heavens and earth", ur: "آسمانوں اور زمین کی ہر چیز پر اللہ کی ملکیت", es: "Dios es dueño de todo lo que hay en los cielos y en la tierra.", fr: "Tout ce qui est dans les cieux et sur la terre appartient à Dieu.", tr: "Tanrı'nın göklerde ve yeryüzünde olanlar için egemenliği", id: "Kekuasaan Allah atas apa yang ada di langit dan bumi" }
summary:
  ar: "يرى الشعراوي أن ملكية البشر للأشياء عرض يزول بالموت أو بالأغيار، وأن الكون كله لله، وأن من وصل إلى الغنى أو الجاه فليحذر لأن النعمة تتغير، وأن الحساب يكون بما سُجل عليه لا بما علمه الله فحسب {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1231} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1232} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1233}."
  en: "Sha'rawi holds that human ownership of things is an accident that ends with death or with changing circumstances, and that all things belong to God. Whoever reaches wealth or standing should beware, since blessing changes. Accountability is for what is recorded, not only for what God knows {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1231} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1232} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1233}."
  ur: "شعراوی کے نزدیک انسان کی چیزوں پر ملکیت ایک عارضی حالت ہے جو موت یا حالات کے بدلنے سے ختم ہو جاتی ہے، اور کائنات کی ہر چیز اللہ کی ہے۔ جو دولت یا مرتبہ پائے وہ محتاط رہے کیونکہ نعمت بدلتی ہے۔ حساب اس پر ہوگا جو ریکارڈ میں آیا، نہ کہ صرف اس پر جو اللہ کو معلوم ہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1231} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1232} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1233}۔"
  es: "Sha'rawi sostiene que la propiedad humana de las cosas es un accidente que termina con la muerte o con el cambio de circunstancias, y que todas las cosas pertenecen a Dios. Quien alcanza riqueza o posición social debe tener cuidado, ya que la bendición cambia. La responsabilidad recae sobre lo que está registrado, no solo sobre lo que Dios sabe {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1231} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1232} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1233}."
  fr: "Sha'rawi soutient que la propriété humaine des choses est accidentelle et prend fin avec la mort ou un changement de circonstances, et que toutes choses appartiennent à Dieu. Quiconque acquiert richesse ou position sociale doit être prudent, car la bénédiction est éphémère. La responsabilité incombe à celui qui est enregistré, et non seulement à celui qui connaît Dieu."
  tr: "El-Şaarawi, insan mülkiyetinin ölümle ya da başkalarıyla birlikte kaybolan bir onur olduğuna, tüm evrenin Tanrı'ya ait olduğuna ve zenginlik veya statü kazanan herkesin dikkatli olması gerektiğine inanır çünkü nimetler değişir ve hesaplaşmanın sadece Tanrı'nın öğrettiklerine değil, üzerinde kaydedilenlere dayandığına inanır {cite:tafsir-sharawi-khawatir-scan-vol-vol-vol-2 s.1231} {cite:tafsir-sharawi-khawatir-scan-vol-2 s.1232} {cite:tafsir-sharawi-khawatir-scan-vol-2 s.1233}."
  id: "Al-Shaarawi percaya bahwa kepemilikan manusia atas sesuatu adalah kehormatan yang hilang bersama kematian atau orang lain, bahwa seluruh alam semesta adalah milik Tuhan, dan bahwa siapa pun yang mencapai kekayaan atau status harus berhati-hati karena berkat berubah, dan bahwa perhitungan itu didasarkan pada apa yang tercatat di dalamnya, bukan hanya oleh apa yang telah diajarkan Tuhan {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 hlm.1231} {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1232} {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1233}."
