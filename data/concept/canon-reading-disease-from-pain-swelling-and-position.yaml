label:
  ar: "الاستدلال من الوجع والورم والوضع عند ابن سينا"
  en: "Reading disease from pain, swelling and position in the Canon"
  fr: "Reconnaître la maladie par douleur, gonflement et position dans le Canon"
  ur: "درد، ورم اور وضع سے استدلال، قانون کے مطابق"
  es: "Lectura de la enfermedad a partir del dolor, la hinchazón y la posición en el Canon"
summary:
  ar: "يذكر ابن سينا أن الوجع يدل بموضعه وبنوعه، والورم بجوهره وموضعه وشكله، والوضع بالمواضع وبالمشاركات {cite:canon-ibn-sina-print-v1 p.157}."
  en: "Ibn Sina says pain points by its place and its kind, swelling by its substance, place and shape, and position by places and by sympathies {cite:canon-ibn-sina-print-v1 p.157}."
  fr: "Pour Ibn Sina, la douleur renseigne par son lieu et son type, le gonflement par sa substance, son lieu et sa forme, la position par les lieux et les sympathies {cite:canon-ibn-sina-print-v1 p.157}."
  es: "Ibn Sina dice que el dolor se localiza por su lugar y su tipo, la hinchazón por su sustancia, lugar y forma, y la posición por los lugares y las simpatías {cite:canon-ibn-sina-print-v1 p.157}."
  ur: "ابن سینا کہتے ہیں کہ درد کو اس کی جگہ اور اس کی نوعیت سے، سوجن کو اس کے مادے، جگہ اور شکل سے، اور مقام کے لحاظ سے اور ہمدردی سے۔"
