id: "concept/alamat-al-khayalat-wa-muqaddimatuha-li-al-ma"
class: "concept"
kind: "scientific"
label:
  ar: "علامات الخيالات وإنذارها بالماء"
  en: "Signs of the floaters and their heralding of the water"
  fr: "Les signes des mouches volantes et de leur annonce de l’eau"
  ur: "خیالات کی علامات اور پانی کی پیش بندی"
  es: "Señales de los flotadores y su anuncio del agua"
  tr: "Hayal Gücü ve Su Alarmı Izleri"
  id: "Jejak Alarm Imajinasi dan Air"
summary:
  ar: "علامة ما كان من ذكاء الحس أن يكون خفيفاً ليس على نهج واحد يصحب مدة الصحة، والقرني ثابت لا يتزايد ولا ضرر، والبخاري يهيج مع المبخرات والامتلاء والهضم والحركات ويكون في العينين، والمنذر بالماء يتدرج في تكدير البصر وقلما يجاوز ستة أشهر {cite:canon-ibn-sina-print-v2 p.208} {cite:canon-ibn-sina-print-v2 p.209}"
  en: "The sign of the floater from keenness of sense is that it is light, not of one pattern, accompanying healthy sight; the corneal stays fixed without growing or harming; the vaporous flares with vapour-raisers, repletion, digestion and motions and is in both eyes; the one heralding the water keeps clouding the sight step by step and rarely passes six months {cite:canon-ibn-sina-print-v2 p.208} {cite:canon-ibn-sina-print-v2 p.209}"
  fr: "Le signe de la mouche qui vient de l’acuité du sens est qu’elle est légère, sans forme unique, et accompagne une vue saine ; l’espèce cornéenne reste fixe sans croître ni nuire ; l’espèce vaporeuse s’embrase avec ce qui fait monter les vapeurs, la réplétion, la digestion et les mouvements, et se trouve dans les deux yeux ; celle qui annonce l’eau ne cesse de troubler la vue pas à pas et dépasse rarement six mois {cite:canon-ibn-sina-print-v2 p.208} {cite:canon-ibn-sina-print-v2 p.209}"
  ur: "حس کی تیزی سے ہونے والے خیال کی علامت یہ ہے کہ وہ ہلکا ہو، ایک ہی ڈھب پر نہ ہو اور صحت کی مدت ساتھ رہے؛ قرنیہ والا ایک جگہ ٹھہرا رہے نہ بڑھے نہ ضرر دے؛ بخاری مبخرت، امتلاء، ہضم اور حرکات کے ساتھ بھڑکے اور دونوں آنکھوں میں ہو؛ اور پانی کی پیش بندی کرنے والا بینائی کو آہستہ آہستہ کدر کرتا رہے اور شاذ ہی چھ ماہ سے تجاوز کرے {cite:canon-ibn-sina-print-v2 p.208} {cite:canon-ibn-sina-print-v2 p.209}۔"
  es: "El signo de la miodesopsia por agudeza sensorial es que es leve, no de un patrón único, acompañando a una visión sana; la córnea permanece fija sin crecer ni dañarse; la miodesopsia se manifiesta con la elevación del vapor, la plenitud, la digestión y los movimientos, y está presente en ambos ojos; la que anuncia el agua sigue nublando la visión paso a paso y rara vez dura seis meses {cite:canon-ibn-sina-print-v2 p.208} {cite:canon-ibn-sina-print-v2 p.209}"
  tr: "Duyusal zekanın bir işareti, hafif olması, tek bir yolda olmamasıdır ve sağlıklı bir dönem eşlik eder. Boynuzu sabittir ve artmaz ya da zarar vermez. Buhari, tütsü ocakları, dolgunluk, sindirim ve hareketlerle tahriş olur ve gözlerde bulunur. Su ile uyaran kişi giderek görme yetisini zayıflar ve nadiren altı ayı aşar. {cite:canon-ibn-sina-print-v2 s.208} {cite:canon-ibn-sina-print-v2 s.209}"
  id: "Tanda kecerdasan sensorik adalah bahwa ia ringan, tidak hanya di satu jalur, dan disertai dengan haid yang sehat. Tanduk tetap dan tidak bertambah atau menyebabkan kerusakan. Bukhari teriritasi oleh pembakar dupa, kenyang, pencernaan, dan gerakan, dan ditemukan di mata. Seseorang yang dirangsang air secara bertahap melemahkan penglihatannya dan jarang melebihi enam bulan. {cite:canon-ibn-sina-print-v2 hlm.208} {cite:canon-ibn-sina-print-v2 hlm.209}"
