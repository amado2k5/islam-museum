id: concept/al-ma-wa-al-awram-fi-al-ras-dakhil-al-qahf-wa-kharijih
class: concept
kind: scientific
label:
  ar: "الماء والأورام في الرأس داخل القحف وخارجه"
  en: "Water and swellings in the head, inside and outside the skull"
  ur: "سر میں پانی اور سوجنیں، کھوپڑی کے اندر اور باہر"
summary:
  ar: "يذكر ابن سينا الماء الذي يجتمع داخل القحف وعلاماته، والأورام الحارة والباردة في الحجب الخارجة والماء بين القحف والجلد وكيف يُفرَّق بينهما، وعطاس الصبيان؛ وفيه سطر موسوم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v2 p.86} {cite:canon-ibn-sina-print-v2 p.87}"
  en: "Ibn Sina treats the water that gathers inside the skull and its signs, the hot and cold swellings of the outer membranes and the water between skull and skin and how they are told apart, and the sneezing of infants; the record has a labelled line in a section held for the founder's ruling {cite:canon-ibn-sina-print-v2 p.86} {cite:canon-ibn-sina-print-v2 p.87}"
  ur: "ابن سینا کھوپڑی کے اندر جمع ہونے والا پانی اور اس کی علامات، بیرونی جھلیوں کی گرم اور ٹھنڈی سوجنیں اور کھوپڑی اور کھال کے درمیان کا پانی اور ان کا فرق، اور بچوں کی چھینک بیان کرتا ہے؛ اس میں ایک موسوم سطر بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v2 p.86} {cite:canon-ibn-sina-print-v2 p.87}۔"
