label:
  ar: "تراب الجنة"
  en: "The Soil of Paradise"
  ur: "جنت کی مٹی"
summary:
  ar: "في الصحيح وصف تراب الجنة وحصبائها. قال رسول الله: «تجرون على حصباء الجنة، الباقلّي» قيل: وما الباقلّي؟ قال: «ترابها من مسك أذفر»."
  en: "In the Sahih the soil and gravel of Paradise are described. The Prophet said: «You will be led over the gravel of Paradise — al-Baqilli.» It was said: what is al-Baqilli? He said: «its soil is fragrant musk»."
  ur: "صحیح میں جنت کی مٹی اور کنکری کا بیان آیا ہے۔ نبی نے فرمایا: «تمہیں جنت کی کنکری باقلّی پر چلایا جائے گا»۔ پوچھا گیا باقلّی کیا ہے؟ فرمایا: «اس کی مٹی خوشبودار مشک ہے»۔"
