id: concept/turab-al-jannah
class: concept
kind: belief
label:
  ar: "تراب الجنة"
  en: "The Soil of Paradise"
  ur: "جنت کی مٹی"
  es: "El suelo del paraíso"
  fr: "Le sol du paradis"
summary:
  ar: "في الصحيح وصف تراب الجنة وحصبائها. قال رسول الله: «تجرون على حصباء الجنة، الباقلّي» قيل: وما الباقلّي؟ قال: «ترابها من مسك أذفر»."
  en: "In the Sahih the soil and gravel of Paradise are described. The Prophet said: «You will be led over the gravel of Paradise — al-Baqilli.» It was said: what is al-Baqilli? He said: «its soil is fragrant musk»."
  ur: "صحیح میں جنت کی مٹی اور کنکری کا بیان آیا ہے۔ نبی نے فرمایا: «تمہیں جنت کی کنکری باقلّی پر چلایا جائے گا»۔ پوچھا گیا باقلّی کیا ہے؟ فرمایا: «اس کی مٹی خوشبودار مشک ہے»۔"
  es: "En el Sahih se describe el suelo y la grava del Paraíso. El Profeta dijo: «Seréis conducidos sobre la grava del Paraíso: al-Baqilli». Se preguntó: ¿Qué es al-Baqilli? Él respondió: «Su suelo es de fragante almizcle»."
  fr: "Dans les hadiths authentiques (Sahih), le sol et le gravier du Paradis sont décrits. Le Prophète a dit: « Vous serez conduits sur le gravier du Paradis, al-Baqilli. » On lui demanda: « Qu'est-ce qu'al-Baqilli ? » Il répondit: « Son sol est imprégné de musc parfumé. »"
