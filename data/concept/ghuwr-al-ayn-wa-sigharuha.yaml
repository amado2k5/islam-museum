id: "concept/ghuwr-al-ayn-wa-sigharuha"
class: "concept"
kind: "scientific"
label:
  ar: "غؤور العين وصغرها"
  en: "Sinking and smallness of the eye"
  ur: "آنکھ کا دھنسنا اور چھوٹا ہونا"
  es: "Hundimiento y pequeñez del ojo"
summary:
  ar: "قد يكون غؤور العين وصغرها في الحميات وخصوصاً في السهرية وعقيب الاستفراغات والأرق والغم والهم، والأرقية منها تكون العين فيها نعاسية ثقيلة عسرة الحركة في الجفن دون الحدقة وفي الغم ساكنة الحدقة، وقد حكي أنه عرض لبعض الناس اختلاف الشقين في برد شديد وحر شديد فعرض للعين التي في الشق البارد غؤور وصغر ⁦(الحكاية منقولة عن الكتاب كخبر)⁩ {cite:canon-ibn-sina-print-v2 p.191}"
  en: "The eye's sinking and smallness may occur in fevers — especially the sleepless — and after evacuations, insomnia, grief and care; in the insomniac kind the eye is sleepy, heavy and hard to move in the lid, not the pupil, and in grief the pupil is still; it is told that some people had a difference between the two halves in severe cold and severe heat, and the eye on the cold half sank and shrank ⁦(the anecdote transmitted as the book's report)⁩ {cite:canon-ibn-sina-print-v2 p.191}"
  ur: "آنکھ کا دھنسنا اور چھوٹا ہو جانا بخاروں میں ہو سکتا ہے بالخصوص بے خوابی والوں میں اور استفراغات، بے خوابی، غم اور فکر کے بعد؛ اور بے خوابی والی میں آنکھ نیندلی، بھاری اور پلک میں حرکت دشوار ہوتی ہے نہ کہ حدقہ میں، اور غم میں حدقہ ساکن ہوتا ہے؛ اور کہا گیا ہے کہ بعض لوگوں کو سخت سردی اور سخت گرمی میں دونوں شقوں کا اختلاف عرض ہوا تو سرد شق والی آنکھ دھنس گئی اور چھوٹی ہو گئی ⁦(یہ حکایت کتاب کے خبر کے طور پر منقول ہے)⁩ {cite:canon-ibn-sina-print-v2 p.191}"
  es: "El hundimiento y la reducción de tamaño del ojo pueden ocurrir en casos de fiebre —especialmente en personas con insomnio— y después de evacuaciones, insomnio, duelo y cuidados; en el caso del insomnio, el ojo está somnoliento, pesado y difícil de mover en el párpado, no la pupila, y en el duelo la pupila está inmóvil; se cuenta que algunas personas tenían una diferencia entre las dos mitades en el frío intenso y el calor intenso, y el ojo de la mitad fría se hundía y se encogía (la anécdota transmitida como informe del libro) {cite:canon-ibn-sina-print-v2 p.191}"
