label: { ar: "الدرجة والدقيقة والثانية والثالثة في الحساب الستيني", en: "Degrees, minutes, seconds and thirds in sexagesimal reckoning", ur: "ستینی حساب میں درجہ، دقیقہ، ثانیہ اور ثالثہ", es: "Grados, minutos, segundos y tercios en el cálculo sexagesimal.", fr: "Degrés, minutes, secondes et tiers dans le calcul sexagésimal", tr: "Altmışlık sistem hesaplamalarında derece, dakika, saniye ve üçte birler.", id: "Derajat, menit, detik, dan sepertiga dalam perhitungan seksagesimal" }
summary:
  ar: "يبين البتاني في الباب الثاني أن كل جزء من الدائرة يسمى درجة، وأن كل درجة تنقسم ستين قسماً تسمى الدقائق، وكل دقيقة ستين قسماً تسمى الثواني، وكل ثانية ستين ثالثة، وما بعد ذلك على الرسم نفسه إلى العواشر وما بعدها. {cite:zij-sabi-nallino-byblion p.12}."
  en: "In chapter 2 al-Battani explains that each part of the circle is also called a degree, each degree divides into sixty parts called minutes, each minute into sixty called seconds, each second into sixty thirds, and what follows goes on the same plan to tenths and beyond. {cite:zij-sabi-nallino-byblion p.12}."
  ur: "دوسرے باب میں البتانی بتاتے ہیں کہ دائرے کا ہر جزو درجہ بھی کہلاتا ہے، ہر درجہ ساٹھ حصوں میں بٹتا ہے جو دقائق کہلاتے ہیں، ہر دقیقہ ساٹھ حصوں میں جو ثوانی کہلاتے ہیں، ہر ثانیہ ساٹھ ثوالث میں اور اس کے بعد اسی دستور پر عواشر اور اس سے آگے تک۔ {cite:zij-sabi-nallino-byblion p.12}۔"
  es: "En el capítulo 2, al-Battani explica que cada parte del círculo también se llama grado, cada grado se divide en sesenta partes llamadas minutos, cada minuto en sesenta llamados segundos, cada segundo en sesenta tercios, y lo que sigue continúa con el mismo esquema hasta las décimas y más allá. {cite:zij-sabi-nallino-byblion p.12}."
  fr: "Au chapitre 2, al-Battani explique que chaque partie du cercle est également appelée un degré, chaque degré se divise en soixante parties appelées minutes, chaque minute en soixante appelées secondes, chaque seconde en soixante tiers, et ainsi de suite jusqu'aux dixièmes et au-delà. {cite:zij-sabi-nallino-byblion p.12}."
  tr: "İkinci bölümde el-Battani, çemberin her bir parçasının derece olarak adlandırıldığını ve her derecenin dakika adı verilen altmış parçaya, her dakikanın saniye adı verilen altmış parçaya, her saniyenin de altmış üçte birine ve bu şekilde aynı şemaya göre onda birlere ve ötesine kadar bölündüğünü açıklamaktadır. {cite:zij-sabi-nallino-byblion s.12}."
  id: "Dalam bab kedua, al-Battani menjelaskan bahwa setiap bagian lingkaran disebut derajat, dan setiap derajat dibagi menjadi enam puluh bagian yang disebut menit, dan setiap menit menjadi enam puluh bagian yang disebut detik, dan setiap detik menjadi enam puluh sepertiga, dan seterusnya, menurut diagram yang sama, hingga sepersepuluh dan seterusnya. {cite:zij-sabi-nallino-byblion p.12}."
