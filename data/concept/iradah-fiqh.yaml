id: concept/iradah-fiqh
class: concept
kind: legal
label:
  ar: "إرادة"
  en: "Iradah (will and intention: its place in contracts, acts and consent)"
  ur: "ارادہ (ارادہ: عقود، تصرفات اور رضا میں اس کا مقام)"
summary:
  ar: "الإرادة في الفقه القصد إلى الشيء والاتجاه إليه، وتفترق عن النية والرضا والاختيار. لا تعتبر إلا إذا صدرت عن ذي أهلية، وقد تنوب عنها إرادة الوكيل أو الولي، وتنشئ العقود إرادة العاقدين، وتنشئ التصرفات المنفردة الإرادة وحدها، ويؤثر فيها الغلط والإكراه بإثبات الخيار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2086} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2087}"
  en: "In law, iradah is the purpose of a thing and the turning towards it, distinct from intention (niyya), contentment (rida) and choice (ikhtiyar). It counts only when it comes from a competent person; an agent's or guardian's will may stand in for the principal's; contracts are made by the will of both parties, unilateral acts by one will alone, and error or duress allow the affected party an option to annul. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2086} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2087}"
  ur: "فقہ میں ارادہ کسی چیز کا قصد اور اس کی طرف رجحان ہے، جو نیت، رضا اور اختیار سے الگ ہے۔ یہ اسی وقت معتبر ہے جب اہل شخص کی طرف سے ہو؛ وکیل یا ولی کا ارادہ اصل کے ارادے کی جگہ لے سکتا ہے؛ عقود دونوں عاقدین کے ارادے سے بنتے ہیں اور یک طرفہ تصرفات ایک ارادے سے، اور غلطی یا جبر میں متأثرہ فریق کو فسخ کا اختیار ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2086} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2087}"
