label:
  ar: "الرقبة"
  en: "Raqaba (the neck; the person as a slave): its place in wiping the neck in ablution, in divorce and in zihar when attached to the neck, and in manumission"
  ur: "گردن ⁦(رقبہ)⁩"
  es: "Raqaba (el cuello; la persona como esclavo): su lugar al limpiar el cuello en la ablución, en el divorcio y en el zihar cuando está unido al cuello, y en la manumisión."
  fr: "Raqaba (le cou; la personne en tant qu'esclave): son rôle dans l'essuyage du cou lors des ablutions, lors du divorce et du zihar lorsqu'elle est attachée au cou, et lors de l'affranchissement."
summary:
  ar: "الرقبة في اللغة العنق، وتطلق على جميع الإنسان كناية، وعلى المملوك، ومنه عتق الرقبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8853} ومسح الرقبة في الوضوء مستحب عند الحنفية ومكروه عند المالكية ولا يُستحب عند الحنابلة، وأدخل الشافعية غسل صفحة العنق في إطالة الغرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8853} وإذا أضاف الزوج الطلاق إلى رقبة زوجته أو عنقها وقع الطلاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8853} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8854} وإذا شبه الزوج رقبة زوجته برقبة أمه فهو مظاهر عند الجمهور، ولا يكون مظاهرا عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8854} وترد الرقبة بمعنى المملوك في العتق والكفارات والمكاتبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8854}"
  en: "Raqaba in the lexicon is the neck, and by a figure of speech the whole person; it also means a slave, as in the phrase 'freeing a neck'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8853} Wiping the neck in ablution is recommended by the Hanafis, disliked by the Malikis and not recommended by the Hanbalis; the Shafi'is add washing the side of the neck to the lengthening of the white mark. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8853} If a husband attaches divorce to his wife's neck, the divorce takes effect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8853} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8854} If he likens his wife's neck to his mother's, the majority hold it a zihar, while the Hanafis do not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8854} The term raqaba names a slave in manumission, the expiations and contracts of writing-off. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8854}"
  ur: "رقبہ گردن کو کہتے ہیں اور غلام کے معنی میں بھی آتا ہے، جیسے گردن آزاد کرنا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8854} طلاق کو گردن کی طرف منسوب کرنے سے طلاق واقع ہوتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8853} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8854}"
  es: "Raqaba en el léxico es el cuello, y por figura retórica la persona entera; también significa un esclavo, como en la frase 'liberar un cuello'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8853} Limpiarse el cuello en la ablución es recomendado por los Hanafi, desaprobado por los Malikis y no recomendado por los Hanbalis; los Shafi'is añaden lavar el costado del cuello para alargar la marca blanca. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8853} Si un marido adjunta el divorcio al cuello de su esposa, el divorcio entra en vigor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8853} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8854} Si compara el cuello de su esposa con el de su madre, la mayoría lo considera un zihar, mientras que los hanafis no. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8854} El término raqaba nombra a un esclavo en manumisión, las expiaciones y los contratos de cancelación. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8854}"
  fr: "Dans le lexique, « raqaba » désigne le cou, et par extension, la personne entière; ce terme signifie également « esclave », comme dans l’expression « libérer un cou ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8853} Les hanafites recommandent de s’essuyer le cou lors des ablutions, contrairement aux malikites, et les hanbalites ne le recommandent pas. Les chaféites, quant à eux, ajoutent le lavage du côté du cou à l’allongement de la marque blanche. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8853} Si un mari appose sa signature de divorce sur le cou de sa femme, le divorce est effectif. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8853} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8854} S'il compare le cou de sa femme à celui de sa mère, la majorité le considère comme un zihar, contrairement aux Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8854} Le terme raqaba désigne un esclave en affranchissement, les expiations et les contrats de radiation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8854}"
