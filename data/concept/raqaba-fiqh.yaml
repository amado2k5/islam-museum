id: concept/raqaba-fiqh
class: concept
kind: legal
label:
  ar: "الرقبة"
  en: "Raqaba (the neck; the person as a slave): its place in wiping the neck in ablution, in divorce and in zihar when attached to the neck, and in manumission"
  ur: "گردن (رقبہ)"
summary:
  ar: "الرقبة في اللغة العنق، وتطلق على جميع الإنسان كناية، وعلى المملوك، ومنه عتق الرقبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8853} ومسح الرقبة في الوضوء مستحب عند الحنفية ومكروه عند المالكية ولا يُستحب عند الحنابلة، وأدخل الشافعية غسل صفحة العنق في إطالة الغرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8853} وإذا أضاف الزوج الطلاق إلى رقبة زوجته أو عنقها وقع الطلاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8853} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8854} وإذا شبه الزوج رقبة زوجته برقبة أمه فهو مظاهر عند الجمهور، ولا يكون مظاهرا عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8854} وترد الرقبة بمعنى المملوك في العتق والكفارات والمكاتبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8854}"
  en: "Raqaba in the lexicon is the neck, and by a figure of speech the whole person; it also means a slave, as in the phrase 'freeing a neck'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8853} Wiping the neck in ablution is recommended by the Hanafis, disliked by the Malikis and not recommended by the Hanbalis; the Shafi'is add washing the side of the neck to the lengthening of the white mark. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8853} If a husband attaches divorce to his wife's neck, the divorce takes effect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8853} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8854} If he likens his wife's neck to his mother's, the majority hold it a zihar, while the Hanafis do not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8854} The term raqaba names a slave in manumission, the expiations and contracts of writing-off. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8854}"
  ur: "رقبہ گردن کو کہتے ہیں اور غلام کے معنی میں بھی آتا ہے، جیسے گردن آزاد کرنا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8854} طلاق کو گردن کی طرف منسوب کرنے سے طلاق واقع ہوتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8853} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8854}"
