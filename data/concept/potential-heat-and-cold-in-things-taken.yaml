summary:
  ar: "يبين ابن سينا أن قولنا في شيء متناول أو مطلي إنه حار أو بارد إنما يعني أنه كذلك بالقوة لا بالفعل، أي أنه بالقوة أحر من أبداننا أو أبرد منها {cite:canon-ibn-sina-print-v1 p.132}."
  en: "Ibn Sina explains that when we say a thing taken or applied is hot or cold, we mean it is so in potency and not in act: it is potentially hotter or colder than our bodies {cite:canon-ibn-sina-print-v1 p.132}."
