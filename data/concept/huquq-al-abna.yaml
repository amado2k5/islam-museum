label:
  ar: "حقوق الأبناء"
  en: "Children's rights (huquq al-abna)"
  ur: "اولاد کے حقوق"
  es: "Derechos de los niños (huquq al-abna)"
  fr: "Droits de l'enfant (huquq al-abna)"
  tr: "Çocuk Hakları"
  id: "Hak Anak"
summary:
  ar: "حقوق الأبناء على آبائهم كما يعرضها الشيخ عمر عبد الكافي: اختيار الأم الصالحة، والاسم الحسن، والعقيقة والتحنيك، والتربية والرحمة، وحفظ القرآن."
  en: "Children's rights over their parents, as Sheikh Omar Abdelkafy presents them: choosing a righteous mother, a good name, aqiqa and tahnik, upbringing and mercy, and the memorisation of the Qur'an."
  ur: "شیخ عمر عبدالکافی کے بیان کے مطابق اولاد کے والدین پر حقوق: نیک ماں کا انتخاب، اچھا نام، عقیقہ اور تحنیک، تربیت اور رحمت، اور قرآن حفظ کرانا۔"
  es: "Los derechos de los niños sobre sus padres, tal como los presenta el jeque Omar Abdelkafy: elegir una madre virtuosa, un buen nombre, la aqiqa y el tahnik, la educación y la misericordia, y la memorización del Corán."
  fr: "Les droits des enfants sur leurs parents, tels que les présente le cheikh Omar Abdelkafy: choisir une mère vertueuse, un bon nom, l’aqiqa et le tahnik, l’éducation et la miséricorde, et la mémorisation du Coran."
  tr: "Şeyh Ömer Abdülkafi tarafından sunulan çocukların ebeveynleri üzerindeki hakları: doğru bir anne seçmek, iyi bir isim, 'akikah, tahneek, yetiştirilme ve merhamet, Kur'an'ı ezberlemek gibi."
  id: "Hak anak-anak atas orang tua mereka seperti yang disampaikan oleh Sheikh Omar Abdel Kafi: memilih ibu yang benar, nama baik, 'aqiqah, tahneek, didikan dan belas kasihan, serta menghafal Al-Qur'an."
