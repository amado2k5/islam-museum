summary:
  ar: "توث في الكتاب صنفان، الفرصاد الحلو يجري مجرى التين في الإنضاج إلا أنه أردأ غذاء وأفسد دما، والشامي الحامض أكثر كلام الكتاب فيه؛ الحلو حار رطب والحامض إلى البرد والرطوبة، فيه قبض وتبريد وعصارته قباضة تمنع سيلان المواد، ورقه يسود الشعر إذا طبخ مع ورق الكرم، والحامض يحبس أورام الحلق والفم وينفع القروح الخبيثة، وهو رديء للمعدة يفسد فيها، سريع الانحدار منها بطيء من المعي، والعفص المملح المجفف منه يحبس البطن وينفع من الدوسنطاريا، وقشره ترياق للشوكران {cite:canon-ibn-sina-print-v1 pp.694-695}"
  en: "Tuth is in the book of two kinds, the sweet firsad, which goes the way of the fig in ripening but is worse in nourishment and spoils the blood more, and the sour Shami, on which most of the book's discussion falls; the sweet is hot and moist, the sour tends to cold and moisture; it has astringency and cooling and its juice is astringent and prevents the flow of matter; its leaf, cooked with vine leaf, blackens the hair; the sour holds back swellings of the throat and mouth and benefits malignant ulcers; it is bad for the stomach and spoils in it, quick to leave it but slow in the intestine; the salted dried astringent kind holds the bowel and benefits dysentery, and its bark is a theriac for hemlock {cite:canon-ibn-sina-print-v1 pp.694-695}"
  ur: "توث کتاب میں دو قسم کا ہے، میٹھا فرصاد جو پکانے میں انجیر کی راہ چلتا ہے مگر غذا میں برا اور خون کو زیادہ بگاڑنے والا ہے، اور کھٹا شامی جس پر کتاب کا زیادہ کلام ہے؛ میٹھا گرم تر ہے اور کھٹا سردی اور تری کی طرف مائل، اس میں قبض اور ٹھنڈک ہے اور اس کا رس قابض ہے جو مادوں کے بہاؤ کو روکتا ہے؛ اس کا پتا انگور کے پتے کے ساتھ پکایا جائے تو بال کالے کرتا ہے؛ کھٹا گلے اور منہ کے ورموں کو روکتا ہے اور خبیث قرحوں میں نافع ہے؛ معدے کے لیے برا ہے اور اس میں بگڑ جاتا ہے، معدے سے جلد اترتا ہے اور آنت میں سست؛ نمک لگا خشک کسیلا پیٹ کو روکتا ہے اور پیچش میں نافع ہے، اور اس کی چھال شوکران کا تریاق ہے {cite:canon-ibn-sina-print-v1 pp.694-695}۔"
  es: "En el libro se mencionan dos tipos de Tut: el dulce firsad, que madura como el higo pero es menos nutritivo y daña más la sangre, y el agrio Shami, sobre el cual se centra la mayor parte de la discusión del libro. El dulce es caliente y húmedo, el agrio tiende al frío y la humedad; tiene astringencia y es refrescante, y su jugo es astringente y dificulta el tránsito intestinal. Su hoja, cocinada con hojas de vid, ennegrece el cabello. El agrio previene la inflamación de la garganta y la boca y beneficia las úlceras malignas. Es malo para el estómago y se descompone en él, se expulsa rápidamente pero es lento en el intestino. El tipo salado, seco y astringente, mantiene el intestino regular y beneficia la disentería, y su corteza es un remedio para la cicuta. {cite:canon-ibn-sina-print-v1 pp.694-695}"
