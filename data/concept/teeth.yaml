id: concept/teeth
class: concept
kind: scientific
label: { ar: "الأسنان عند ابن سينا", en: "Teeth in the Canon", ur: "قانون میں دانت", es: "Dientes en el cañón", fr: "Les dents dans le canon", tr: "İbn Sina'ya göre dişler", id: "Gigi menurut Avicenna" }
summary:
  ar: "يعدّ ابن سينا الأسنان اثنين وثلاثين سناً، وربما عُدمت النواجذ عند بعض الناس فتكون ثمانية وعشرين، ويفصّل أنواعها ووظائفها وجذورها {cite:canon-ibn-sina-print-v1 pp.46-47}."
  en: "Ibn Sina counts thirty-two teeth, though the wisdom teeth are sometimes lacking in some people, leaving twenty-eight, and he describes their kinds, their uses and their roots {cite:canon-ibn-sina-print-v1 pp.46-47}."
  es: "Ibn Sina cuenta treinta y dos dientes, aunque a algunas personas les faltan las muelas del juicio, quedando veintiocho, y describe sus tipos, sus usos y sus raíces {cite:canon-ibn-sina-print-v1 pp.46-47}."
  fr: "Ibn Sina compte trente-deux dents, bien que les dents de sagesse soient parfois absentes chez certaines personnes, ce qui en laisse vingt-huit, et il décrit leurs types, leurs usages et leurs racines {cite:canon-ibn-sina-print-v1 pp.46-47}."
  ur: "ابن سینا نے بتیس دانتوں کی گنتی کی ہے، حالانکہ بعض لوگوں میں عقلی دانتوں کی کمی ہوتی ہے، اٹھائیس چھوڑ کر، اور وہ ان کی اقسام، ان کے استعمال اور ان کی جڑیں بیان کرتا ہے۔"
  tr: "İbn Sina, dişleri otuz iki diş olarak sayar ve bazı kişiler stimlerini kaybetmiş olabilir, bu yüzden yirmi sekiz dişlerdir. Türlerini, işlevlerini ve köklerini ayrıntılı olarak belirtir {cite:canon-ibn-sina-print-v1 s.46-47}."
  id: "Ibn Sina menghitung gigi sebagai tiga puluh dua gigi, dan beberapa orang mungkin kehilangan stimnya, jadi jumlahnya dua puluh delapan. Ia merinci jenis, fungsi, dan akar gigi mereka {cite:canon-ibn-sina-print-v1 hlm.46-47}."
