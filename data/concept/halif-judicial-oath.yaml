label: { ar: "الحَلِف", en: "Halif (judicial oath)", ur: "حَلِف (قسم)" }
summary:
  ar: "الحَلِف لغة اليمين، وأصله العقد بالعزم والنية، واصطلاحا توكيد حكم بذكر معظم على وجه مخصوص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7245} والتحليف تكليف أحد الخصمين اليمين لفصل الخصومات، وقد ثبت ذلك بقول النبي للمدعى عليه: احلف بالله الذي لا إله إلا هو، وبقوله للأشعث بن قيس: بينتك وإلا فيمينه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7245} وتنعقد اليمين بالقسم بالله أو بصفاته، ويُنهى عن الحلف بغير الله، ومن ذلك الحديث في النهي عن الحلف بالآباء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7245} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7246} وتجري اليمين في حقوق العباد المالية بلا خلاف، أما الحدود فلا يحلف فيها، وفي حقوق العباد غير المالية كالقذف والقود والنكاح والطلاق والرجعة اختلاف بين المذاهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7246} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7247} والجمهور على أن اليمين تقطع الخصومة في الحال ولا تفيد البراءة من الحق، والمالكية يرون أنها تمنع إقامة البينة بعدها إلا لعذر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7247} ويحلف المرء على البت فيما فعله، وعلى نفي العلم فيما فعله غيره، والحنفية يفرقون بين الحلف على السبب والحلف على الحاصل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7248} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7249} ولا يُحلف المدعى عليه إلا بعد طلب المدعي عند الجمهور، واستثنى الحنفية خمسة مواطن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7249} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7250} وفي النية، تعتبر نية الحالف إن كان مظلوما، ونية المستحلف إن كان ظالما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7250} ويحيل المدخل إلى «أيمان» في التفصيل، ويعقب بالعنوان التالي «حِلْف» في ص 7251. "
  en: "Halif is lexically an oath, from a root meaning firm resolve; technically it is the affirmation of a ruling by naming something revered in a fixed form. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7245} Swearing in court makes one litigant take the oath to settle the dispute; the practice rests on the Prophet's instruction to the defendant to swear by God, and his word to al-Ash'ath ibn Qays: your proof, or else his oath. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7245} A binding oath is sworn by God or His attributes, and swearing by other than God is forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7245} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7246} Oaths lie over financial rights without dispute; a claim for a legal penalty of God is not sworn to, while non-financial private rights such as slander, retaliation, marriage, divorce, revocation and manumission are disputed between the schools. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7246} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7247} The majority hold that the oath ends the dispute at once but does not discharge the right; the Malikis treat it as barring later proof except for a valid excuse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7247} The oath is sworn to the act itself, or to another's act by denial of knowledge; the Hanafis divide oaths on the cause from those on the outcome. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7248} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7249} The judge administers the oath only when the claimant asks, and the Hanafis list five cases where it applies without that request. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7249} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7250} For intention, the oath follows the swearer's intention when he is the wronged party and the examiner's intention when he is the wrongdoer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7250} The entry refers the reader to the headword on oaths (ayman) for detail, and closes at the next heading حِلْف on p.7251. "
  ur: "حَلِف لغت میں قسم ہے، اور اصطلاحاً کسی حکم کی تاکید بزرگ ترین ہستی کے ذکر کے ساتھ مخصوص طریقے پر کرنا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7245} تحلیف یعنی فریقین میں سے ایک کو قسم اٹھانے کا پابند کرنا تاکہ جھگڑا ختم ہو؛ اس کی دلیل نبی کا مدعی علیہ کو قسم کا حکم دینا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7245} منعقد ہونے والی قسم اللہ یا اس کی صفات کے ساتھ ہوتی ہے، اور غیرِ اللہ کی قسم سے منع کیا گیا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7245} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7246} مالی حقوقِ عباد میں قسم بلا اختلاف جاری ہوتی ہے، جبکہ حدود میں قسم نہیں ہوتی، اور غیر مالی حقوق جیسے قذف، قصاص، نکاح اور طلاق میں مذاہب میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7246} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7247} جمہور کے نزدیک قسم فوری طور پر جھگڑا ختم کرتی ہے مگر حق سے بری نہیں کرتی؛ مالکیہ کے نزدیک بعد میں گواہ پیش کرنے سے روکتی ہے سوائے عذر کے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7247} انسان اپنے فعل پر یقین کے ساتھ قسم کھاتا ہے، اور غیر کے فعل پر نفیِ علم کے ساتھ؛ حنفیہ سبب اور حاصل پر قسم میں فرق کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7248} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7249} جمہور کے نزدیک قاضی مدعی علیہ سے مدعی کے مطالبے کے بغیر قسم نہیں لیتا، اور حنفیہ پانچ مواقع بیان کرتے ہیں جہاں یہ مطالبہ ضروری نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7249} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7250} نیت کے بارے میں مظلوم حالف کی نیت اور ظالم کی صورت میں قسم لینے والے کی نیت معتبر ہوتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7250} اس کی تفصیل «أيمان» کے مدخل میں ہے، اور یہ مدخل p.7251 پر «حِلْف» کے عنوان پر ختم ہوتا ہے۔ "
