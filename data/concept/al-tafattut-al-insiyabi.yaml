id: concept/al-tafattut-al-insiyabi
class: concept
kind: ethical
label:
  ar: "التفتيت الانسيابي للملكية"
  en: "Gradual dispersal of property (al-tafattut al-insiyabi)"
  ur: "ملکیت کا بتدریجی انتقال"
summary:
  ar: "يرى الشعراوي أن قسمة الميراث تفتّت الثروة تفتيتاً «انسيابياً» بين الأبناء والبنات فتشيع في المجتمع، بخلاف التفتيت «القسري» الذي قد يفاجئ الأبناء بالحرمان. ويربط ذلك بأن الإنسان يُسأل عن حركته في الأرض، وأن الحق لا يطلب المال كله من الأبناء، ويحذر من أن يظهر الضغن في المجتمع {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2049}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2050}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2051}."
  en: "Al-Sha'rawi holds that the division of inheritance spreads wealth 'in a flowing way' among sons and daughters so that it circulates in society, unlike a 'forced' dispersal that can surprise children with deprivation. He links this to the effort a person puts into the land, and warns that resentment must not rise in society {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2049}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2050}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2051}."
  ur: "شعراوی کے مطابق میراث کی تقسیم دولت کو اولاد میں «بہاؤ» کی صورت میں تقسیم کرتی ہے تاکہ وہ معاشرے میں گردش کرے، جبکہ «جبری» تقسیم اولاد کو اچانک محرومی سے دوچار کر سکتی ہے۔ وہ معاشرے میں کینہ پیدا ہونے سے خبردار کرتے ہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2049}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2050}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2051}۔"
wings: [ideas]
themes: [family-marriage-kinship]
issue:
  ar: "هل تحفظ قسمة الميراث الثروة في المجتمع أم تفتتها؟ وكيف يُقرأ حق الأبناء في ثمرة حركة الأب؟"
  en: "Does the division of inheritance preserve or fragment wealth in society, and how is the child's right in the father's effort read?"
  ur: "کیا میراث کی تقسیم معاشرے میں دولت کو محفوظ رکھتی ہے یا بکھیرتی ہے؟"
