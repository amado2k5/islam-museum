id: concept/al-tafattut-al-insiyabi
class: concept
kind: ethical
label:
  ar: "التفتيت الانسيابي للملكية"
  en: "Gradual dispersal of property (al-tafattut al-insiyabi)"
  fr: "Dispersion progressive du patrimoine (al-tafattut al-insiyabi)"
  ur: "ملکیت کا بتدریجی انتقال"
  es: "Dispersión gradual de la propiedad (al-tafattut al-insiyabi)"
  tr: "Sadeleştirilmiş Mülkiyet Parçalanması"
  id: "Fragmentasi Kepemilikan yang Disederhanakan"
summary:
  ar: "يرى الشعراوي أن قسمة الميراث تفتّت الثروة تفتيتاً «انسيابياً» بين الأبناء والبنات فتشيع في المجتمع، بخلاف التفتيت «القسري» الذي قد يفاجئ الأبناء بالحرمان. ويربط ذلك بأن الإنسان يُسأل عن حركته في الأرض، وأن الحق لا يطلب المال كله من الأبناء، ويحذر من أن يظهر الضغن في المجتمع {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2049}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2050}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2051}."
  en: "Al-Sha'rawi holds that the division of inheritance spreads wealth 'in a flowing way' among sons and daughters so that it circulates in society, unlike a 'forced' dispersal that can surprise children with deprivation. He links this to the effort a person puts into the land, and warns that resentment must not rise in society {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2049}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2050}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2051}."
  fr: "Selon al-Sha'rawi, le partage successoral répartit les richesses « sans à-coups » entre fils et filles, de sorte qu’elles circulent dans la société, contrairement à une dispersion « forcée » qui peut prendre les enfants au dépourvu en les privant de leurs ressources. Il lie cette idée aux efforts que l’on consacre à la terre et met en garde contre la montée du ressentiment dans la société {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2049}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2050}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2051}."
  ur: "شعراوی کے مطابق میراث کی تقسیم دولت کو اولاد میں «بہاؤ» کی صورت میں تقسیم کرتی ہے تاکہ وہ معاشرے میں گردش کرے، جبکہ «جبری» تقسیم اولاد کو اچانک محرومی سے دوچار کر سکتی ہے۔ وہ معاشرے میں کینہ پیدا ہونے سے خبردار کرتے ہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2049}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2050}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2051}۔"
  es: "Al-Sha'rawi sostiene que la división de la herencia distribuye la riqueza de forma fluida entre hijos e hijas, permitiendo que circule en la sociedad, a diferencia de una distribución forzada que puede sorprender a los niños con privaciones. Vincula esto con el esfuerzo que una persona dedica a la tierra y advierte que no debe surgir resentimiento en la sociedad {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2049}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2050}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2051}."
  tr: "Al-Shaarawi, miras paylaşımının zenginliği oğullar ve kızlar arasında 'akışkan' bir şekilde parçaladığına, topluma yayıldığına, çocukları yoksunlukla şaşırtabilen 'zorunlu' parçalanmanın aksine, inanır. Bunu, bir kişinin yeryüzündeki hareketi hakkında sorgulanmasına, sağın tüm serveti çocuklardan talep etmemesine bağlar ve toplumda kızgınlık görünümüne karşı uyarıda bulunur {cite:tafsir-sharawi-khawatir-scan-vol-2 s. 2049}{cite:tafsir-sharawi-khawatir-scan-vol-2 s. 2050}{cite:tafsir-sharawi-khawatir-scan-vol-2 s. 2051}."
  id: "Al-Shaarawi percaya bahwa pembagian warisan secara 'cair' memecah kekayaan antara anak laki-laki dan perempuan, menyebar ke seluruh masyarakat, berbeda dengan fragmentasi 'yang diperlukan' yang dapat mengejutkan anak-anak dengan kekurangan. Ia mengaitkan hal ini dengan mempertanyakan pergerakan seseorang di dunia, penolakan pihak kanan untuk menuntut semua kekayaan dari anak-anak, dan memperingatkan agar tidak muncul kemarahan dalam masyarakat {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 hlm. 2049}{cite:tafsir-sharawi-khawatir-scan-vol-vol-2 hlm. 2050}{cite:tafsir-sharawi-khawatir-scan-vol-2 hlm. 2051}"
