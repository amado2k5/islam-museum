id: concept/zij-sabi-observed-solar-eclipses-raqqa-and-antioch
class: concept
kind: scientific
label: { ar: "كسوفان شمسيان رُصدا بالرقة وأنطاكية", en: "Two observed solar eclipses at Raqqa and Antioch", ur: "رقہ اور انطاکیہ میں رصد شدہ دو شمسی کسوف", es: "Se observaron dos eclipses solares en Raqqa y Antioquía.", fr: "Deux éclipses solaires ont été observées à Raqqa et à Antioche.", tr: "Rakka ve Antakya'da iki güneş tutulması gözlemlendi.", id: "Dua gerhana matahari diamati di Raqqa dan Antiokhia." }
summary:
  ar: "يذكر البتاني كسوفين شمسيين قريبين رصدهما في زمانه: الأول في الثامن من آب بالرقة، أُظلمت فيه أكثر من ثلثي الشمس، والثاني في الثالث والعشرين من كانون الثاني بأنطاكية، انكسفت فيه أكثر من النصف، ويقيس بهما نسبة الظل وقطر القمر. {cite:zij-sabi-nallino-byblion p.85}."
  en: "Al-Battani records two solar eclipses that he observed close to his own time. The first, on 8 August at Raqqa, hid more than two-thirds of the Sun; the second, on 23 January at Antioch, hid more than half. He uses both to test the ratio of the shadow to the Moon's diameter. {cite:zij-sabi-nallino-byblion p.85}."
  ur: "البتانی اپنے زمانے کے قریب رصد کیے گئے دو شمسی کسوفات درج کرتے ہیں: پہلا آٹھ اگست کو رقہ میں، جس میں سورج کا دو تہائی سے زیادہ حصہ ڈھکا؛ دوسرا تئیس جنوری کو انطاکیہ میں، جس میں آدھے سے زیادہ۔ وہ دونوں سے سائے اور چاند کے قطر کی نسبت کی جانچ کرتے ہیں۔ {cite:zij-sabi-nallino-byblion p.85}۔"
  es: "Al-Battani registró dos eclipses solares que observó cerca de su época. El primero, el 8 de agosto en Raqqa, ocultó más de dos tercios del Sol; el segundo, el 23 de enero en Antioquía, ocultó más de la mitad. Utilizó ambos para comprobar la relación entre la sombra y el diámetro de la Luna. {cite:zij-sabi-nallino-byblion p.85}."
  fr: "Al-Battani relate deux éclipses solaires qu'il a observées peu avant son époque. La première, le 8 août à Raqqa, a occulté plus des deux tiers du Soleil; la seconde, le 23 janvier à Antioche, en a occulté plus de la moitié. Il utilise ces deux éclipses pour tester le rapport entre la taille de l'ombre et le diamètre de la Lune. {cite:zij-sabi-nallino-byblion p.85}."
  tr: "El-Battani, kendi zamanında gözlemlediği iki güneş tutulmasından bahseder: ilki 8 Ağustos'ta Rakka'da, güneşin üçte ikisinden fazlasının karardığı; ikincisi ise 23 Ocak'ta Antakya'da, güneşin yarısından fazlasının tutulduğu tutulmadır. Bu tutulmaları gölge oranını ve ayın çapını ölçmek için kullanır. {cite:zij-sabi-nallino-byblion s.85}."
  id: "Al-Battani menyebutkan dua gerhana matahari yang ia amati pada masanya: yang pertama pada tanggal 8 Agustus di Raqqa, di mana lebih dari dua pertiga matahari tertutupi, dan yang kedua pada tanggal 23 Januari di Antiokhia, di mana lebih dari setengahnya tertutupi. Ia menggunakan gerhana ini untuk mengukur rasio bayangan dan diameter bulan. {cite:zij-sabi-nallino-byblion p.85}."
