id: concept/adwa
class: concept
kind: legal
label:
  ar: "العَدْوَى"
  en: "Contagion (adwa)"
  ur: "عدوی"
summary:
  ar: "العدوى في اللغة تجاوز العلة من صاحبها إلى غيره، وفي الاصطلاح تجاوز العلة صاحبها إلى غيره {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11524}. وجمهور العلماء على أن المرض لا يعدي بطبعه، وإنما بفعل الله وقدره، ويجمعون بين حديث «لا عدوى» وحديث «لا يورد ممرض على مصح» {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11524} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11525}. وذهب عمر وجماعة من السلف إلى نفي العدوى، وذهب فريق من العلماء إلى إثباتها، واستدلوا بالحديث في المجذوم، ورأوا وجوب صون الأنفس والأعضاء والأموال من أسباب الإفساد {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11525} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11526}. والخوف من العدوى لا يحرم ما لم يمنع واجباً، وأما الخروج إلى أرض الوباء أو الدخول إليها فمنهي عنه بالنص {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11525}."
  en: "Linguistically, adwa is a sickness passing from its owner to another; as a technical term it is the same idea {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11524}. Most scholars hold that disease does not pass by its own nature but by God's act and decree, and they reconcile the hadith 'no contagion' with the hadith 'the diseased should not be brought to the healthy' {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11524} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11525}. Umar and a group of early scholars deny contagion; another group affirms it, citing the hadith about a leper of the Thaqif delegation and the hadith 'flee from the leper' {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11525} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11526}. Fear of contagion is not forbidden so long as it does not prevent an obligatory act; but entering a land stricken by plague is forbidden by the text {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11525}."
