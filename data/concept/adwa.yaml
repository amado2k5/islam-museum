id: concept/adwa
class: concept
kind: legal
label:
  ar: "العَدْوَى"
  en: "Contagion (adwa)"
  fr: "Contagion (adwa)"
  ur: "عدوی"
  es: "Contagio (adwa)"
  tr: "Enfeksiyon"
  id: "Infeksi"
summary:
  ar: "العدوى في اللغة تجاوز العلة من صاحبها إلى غيره، وفي الاصطلاح تجاوز العلة صاحبها إلى غيره {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11524}. وجمهور العلماء على أن المرض لا يعدي بطبعه، وإنما بفعل الله وقدره، ويجمعون بين حديث «لا عدوى» وحديث «لا يورد ممرض على مصح» {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11524} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11525}. وذهب عمر وجماعة من السلف إلى نفي العدوى، وذهب فريق من العلماء إلى إثباتها، واستدلوا بالحديث في المجذوم، ورأوا وجوب صون الأنفس والأعضاء والأموال من أسباب الإفساد {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11525} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11526}. والخوف من العدوى لا يحرم ما لم يمنع واجباً، وأما الخروج إلى أرض الوباء أو الدخول إليها فمنهي عنه بالنص {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11525}."
  en: "Linguistically, adwa is a sickness passing from its owner to another; as a technical term it is the same idea {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11524}. Most scholars hold that disease does not pass by its own nature but by God's act and decree, and they reconcile the hadith 'no contagion' with the hadith 'the diseased should not be brought to the healthy' {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11524} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11525}. Umar and a group of early scholars deny contagion; another group affirms it, citing the hadith about a leper of the Thaqif delegation and the hadith 'flee from the leper' {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11525} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11526}. Fear of contagion is not forbidden so long as it does not prevent an obligatory act; but entering a land stricken by plague is forbidden by the text {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11525}."
  fr: "Dans le lexique, adwa désigne le passage d’une maladie d’une personne atteinte à une autre ; le sens technique est le même {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11524}. La plupart des savants estiment que la maladie ne se transmet pas par elle-même mais par l’action et le décret de Dieu ; ils concilient le hadith « pas de contagion » avec celui qui dit de ne pas mettre les malades en présence des bien-portants {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11524} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11525}. Umar et un groupe d’anciens savants nient la contagion ; un autre groupe l’affirme en citant le hadith au sujet d’un lépreux de la délégation des Thaqif et celui qui dit de fuir le lépreux {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11525} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11526}. Selon ces règles, la crainte de la contagion n’est pas interdite tant qu’elle n’empêche pas un acte obligatoire ; le texte interdit toutefois d’entrer dans un pays frappé par la peste {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11525}."
  es: "Lingüísticamente, adwa es una enfermedad que pasa de su dueño a otro; como término técnico es la misma idea {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11524}. La mayoría de los eruditos sostienen que la enfermedad no se transmite por su propia naturaleza sino por el acto y decreto de Dios, y concilian el hadiz 'no contagio' con el hadiz 'el enfermo no debe ser llevado a los sanos' {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11524} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11525}. Umar y un grupo de eruditos antiguos niegan el contagio; Otro grupo lo afirma, citando el hadiz sobre un leproso de la delegación Thaqif y el hadiz \"huye del leproso\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11525} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11526}. El temor al contagio no está prohibido siempre que no impida un acto obligatorio; pero entrar en una tierra azotada por la peste está prohibido por el texto {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11525}."
  ur: "لسانی طور پر، عدوا ایک بیماری ہے جو اپنے مالک سے دوسرے کو منتقل ہوتی ہے۔ ایک تکنیکی اصطلاح کے طور پر یہ ایک ہی خیال ہے {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11524}۔ اکثر علماء کا خیال ہے کہ بیماری اپنی فطرت سے نہیں بلکہ خدا کے عمل اور حکم سے منتقل ہوتی ہے اور وہ حدیث 'متعدی نہیں' کو اس حدیث کے ساتھ جوڑتے ہیں کہ 'بیمار کو صحت مند نہ لایا جائے'۔ صفحہ 11525}۔ عمر اور ابتدائی علماء کا ایک گروہ متعدی بیماری سے انکار کرتا ہے۔ ایک اور گروہ نے اس کی توثیق کرتے ہوئے ثقیف وفد کے ایک کوڑھی کے بارے میں حدیث اور حدیث 'جذام سے بھاگنا' کا حوالہ دیتے ہوئے اس کی تصدیق کی ہے۔ چھوت کا خوف اس وقت تک حرام نہیں ہے جب تک کہ یہ کسی واجب عمل سے نہیں روکتا۔ لیکن طاعون زدہ سرزمین میں داخل ہونا متن {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 11525} کی رو سے منع ہے۔"
  tr: "Dilde enfeksiyon, nedenin sahibinden diğerine aktarılmasıdır; terminolojide ise nedenin başka birine aşılmasıdır {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11524}. Çoğu alim, hastalığın doğası gereği değil, Allah'ın eylemi ve hükmiyle bulaştığı konusunda hemfikirdir ve \"Enfeksiyon yoktur\" hadisini \"Sağlıklı bir kişiye hasta getirilmez\" hadisi ile birleştirirler {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11524} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11525}. Ömer ve ilk kuşaklardan bir grup enfeksiyonu reddederken, bir grup alim bunu destekledi; cüzzamlılarla ilgili hadisleri delil olarak gösterdi ve hayatları, uzuvları ve mülkleri koruma yükümlülüğünü yolsuzluğun nedenleri olarak gördü {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11525} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11526}. Enfeksiyon korkusu, zorunlulukla önlenmedikçe yasaktır. Salgının yaşandığı ülkeye çıkmak veya girmek ise {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11525} metiniyle yasaklanmıştır."
  id: "Dalam bahasa, infeksi adalah penularan sebab dari satu inang ke inang lain; dalam terminologi, ini berarti penularan sebab ke inang lain {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11524}. Sebagian besar ulama sepakat bahwa penyakit ini ditularkan bukan secara alami, melainkan oleh tindakan dan perintah Allah, dan mereka menggabungkan hadits \"Tidak ada infeksi\" dengan hadis \"Orang yang sehat tidak akan sakit\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11524} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11525}. Sementara Umar dan sekelompok generasi pertama menolak infeksi, sekelompok ulama mendukungnya; Ia mengutip hadits terkait kusta sebagai bukti dan menganggap kewajiban melindungi nyawa, anggota tubuh, dan harta sebagai penyebab korupsi {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11525} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11526}. Ketakutan akan infeksi dilarang kecuali dicegah karena kebutuhan. Masuk atau pergi ke negara tempat wabah terjadi dilarang menurut teks {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11525}."
