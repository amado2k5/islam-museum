summary:
  ar: "لفظ تركي وفارسي بمعنى الأب، يُستعمل لقباً للكبار وفي الأوساط الدرويشية، وأحياناً يدخل في أسماء الأماكن ليدل على صلة بالدراويش {cite:encyclopaedia-of-islam-2 vol. 1 p. 895-896}."
  en: "A Turkish and Persian term meaning father, used as a title for elders and in dervish circles, and sometimes in place names to mark dervish associations {cite:encyclopaedia-of-islam-2 vol. 1 p. 895-896}."
  fr: "Mot turc et persan signifiant père, employé comme titre pour les anciens et dans les milieux derviches, parfois aussi dans des noms de lieux pour signaler une association aux derviches {cite:encyclopaedia-of-islam-2 vol. 1 p. 895-896}."
  es: "Un término turco y persa que significa padre, utilizado como título para ancianos y en círculos derviches, y a veces en nombres de lugares para marcar asociaciones derviches {cite:encyclopaedia-of-islam-2 vol. 1 p. 895-896}."
  ur: "ایک ترکی اور فارسی اصطلاح جس کا مطلب باپ ہے، جو بزرگوں اور درویش حلقوں میں لقب کے طور پر استعمال ہوتا ہے، اور بعض اوقات درویش انجمنوں کو نشان زد کرنے کے لیے جگہ جگہ ناموں کے طور پر استعمال ہوتا ہے۔ 1 ص۔ 895-896}۔"
  tr: "Türkçe ve Farsça baba anlamına gelen bir terim, yaşlılar ve dervişler arasında bir unvan olarak kullanılır ve bazen dervişlerle bağlantıyı belirtmek için yer adlarına dahil edilir {cite:encyclopaedia-of-islam-2 cilt 1, ss. 895-896}."
  id: "Istilah Turki dan Persia yang berarti ayah, digunakan sebagai gelar untuk para tetua dan di antara para derwish, dan kadang-kadang dimasukkan dalam nama tempat untuk menunjukkan hubungan dengan para dervish {cite:encyclopaedia-of-islam-2 vol. 1, hlm. 895-896}."
