  en: "Taslif (advance payment; loan)"
  ur: "تسلیف (پیشگی ادائیگی؛ قرض)"
summary:
  ar: "التسليف في اللغة التقديم، ويقال سلف إليه واستسلف منه: أي اقترض. والسلف في المعاملات يطلق على القرض، وعلى نوع من البيع يُعجَّل فيه الثمن وتُضبط السلعة بالوصف إلى أجل معلوم، وهو السَّلم عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5082} والسلف جائز بالكتاب والسنة والإجماع، واستثنى الفقهاء عقد السلم من منع بيع المعدوم تيسيراً على أرباب الزروع والتجارات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5083} والقرض مندوب إليه بإجماع المسلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5083} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5084}"
  en: "In the lexicon, taslif means advancing something; one says he advanced to him, and that he borrowed from him. In dealings the word salaf names a loan, and a kind of sale in which the price is paid at once while the goods, fixed by description, are delivered at a known term; the majority call this salam. The Kuwaiti encyclopedia says the salaf is lawful by the Book, the Sunna and consensus, and that the jurists made the salam an exception to the ban on selling what does not yet exist, for the ease of farmers and traders. A loan is agreed by the Muslims to be recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5082} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5083} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5084}"
