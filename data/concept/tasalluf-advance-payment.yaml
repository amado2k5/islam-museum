label:
  ar: "التسليف"
  en: "Taslif (advance payment; loan)"
  ur: "تسلیف ⁦(پیشگی ادائیگی؛ قرض)⁩"
  es: "Taslif (pago por adelantado; préstamo)"
  fr: "Taslif (acompte; prêt)"
  tr: "Kredi verme"
  id: "Pemberian pinjaman"
summary:
  ar: "التسليف في اللغة التقديم، ويقال سلف إليه واستسلف منه: أي اقترض. والسلف في المعاملات يطلق على القرض، وعلى نوع من البيع يُعجَّل فيه الثمن وتُضبط السلعة بالوصف إلى أجل معلوم، وهو السَّلم عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5082} والسلف جائز بالكتاب والسنة والإجماع، واستثنى الفقهاء عقد السلم من منع بيع المعدوم تيسيراً على أرباب الزروع والتجارات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5083} والقرض مندوب إليه بإجماع المسلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5083} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5084}"
  en: "In the lexicon, taslif means advancing something; one says he advanced to him, and that he borrowed from him. In dealings the word salaf names a loan, and a kind of sale in which the price is paid at once while the goods, fixed by description, are delivered at a known term; the majority call this salam. The Kuwaiti encyclopedia says the salaf is lawful by the Book, the Sunna and consensus, and that the jurists made the salam an exception to the ban on selling what does not yet exist, for the ease of farmers and traders. A loan is agreed by the Muslims to be recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5082} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5083} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5084}"
  es: "En el léxico, taslif significa adelantar algo; se dice que le adelantó algo y que le pidió prestado. En las transacciones, la palabra salaf designa un préstamo y un tipo de venta en la que el precio se paga de inmediato, mientras que los bienes, cuyo precio se especifica por descripción, se entregan en un plazo determinado; la mayoría lo llama salam. La enciclopedia kuwaití afirma que el salaf es lícito según el Corán, la Sunna y el consenso, y que los juristas establecieron el salam como una excepción a la prohibición de vender lo que aún no existe, para facilitar la labor de agricultores y comerciantes. Los musulmanes recomiendan un préstamo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5082} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5083} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5084}"
  fr: "Dans le lexique, « taslif » signifie avancer quelque chose; on dit qu'il lui a avancé de l'argent et qu'il lui a emprunté. Dans le domaine des transactions commerciales, le mot « salaf » désigne un prêt et un type de vente où le prix est payé immédiatement tandis que les marchandises, dont la description est précise, sont livrées à une date convenue; la majorité appelle cela « salam ». L'encyclopédie koweïtienne indique que le « salaf » est licite selon le Coran, la Sunna et le consensus, et que les juristes ont fait du « salam » une exception à l'interdiction de vendre ce qui n'existe pas encore, pour faciliter les activités des agriculteurs et des commerçants. Un prêt est, de l'avis des musulmans, recommandé."
  ur: "لغت میں تسلیف کا مطلب ہے کسی چیز کو آگے بڑھانا۔ ایک کہتا ہے کہ وہ اس کی طرف بڑھا، اور یہ کہ اس نے اس سے قرض لیا۔ لین دین میں لفظ سلف ایک قرض کو کہتے ہیں، اور ایک قسم کی فروخت جس میں قیمت ایک ساتھ ادا کی جاتی ہے جبکہ سامان، جو تفصیل کے مطابق مقرر کیا جاتا ہے، ایک معلوم مدت پر پہنچایا جاتا ہے۔ اکثریت اسے سلام کہتے ہیں۔ کویتی انسائیکلوپیڈیا کہتا ہے کہ کتاب، سنت اور اجماع کے مطابق سلف حلال ہے، اور یہ کہ فقہاء نے کسانوں اور تاجروں کی آسانی کے لیے سلام کو فروخت کرنے پر پابندی سے مستثنیٰ قرار دیا ہے۔ مسلمانوں کی طرف سے ایک قرض کی سفارش کی جاتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5082} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5083}"
  tr: "Dilde kredi verme öncelik anlamına gelir ve ona borç vermek ve ondan borç almak denir: yani o borç aldı. İşlemlerde kredi, fiyatın hızlandırıldığı ve malın bilinen bir terim için tanımlandığı bir satış türünü ifade eder; bu terim çoğunluğa göre selamdır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.5082} Krediler Kur'an, Sünnet ve uzlaşma ile kabul edilir ve hukukçular, ürün sahipleri ve tüccarların satışını kolaylaştırmak için var olmayan malların satışını yasaklayan selam sözleşmesini muaf tutmuşlardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5083} ve ödünç Müslümanlar arasında uzlaşıyla tavsiye edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5083} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5084}"
  id: "Dalam bahasa tersebut, meminjamkan berarti prioritas, dan dikatakan meminjamkan dan meminjam darinya: artinya dia meminjam. Pinjaman dalam transaksi merujuk pada pinjaman dan jenis penjualan di mana harga dipercepat dan komoditas ditetapkan berdasarkan deskripsi untuk istilah yang dikenal, yaitu salam menurut mayoritas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5082} Pinjaman diperbolehkan oleh Al-Qur'an, Sunnah, dan konsensus, dan para ahli hukum telah membebaskan kontrak salam dari melarang penjualan barang yang tidak ada untuk memudahkan penjualan bagi pemilik tanaman dan pedagang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5083} dan pinjaman direkomendasikan berdasarkan konsensus di kalangan umat Muslim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5083} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5084}"
