  tr: "El-Aziz: Üstün Eğmeyen Hakim; Eşi Olmayan Yüce. El-Tirmidi'nin Allah'ın En Güzel İsimleri hadislerinde bahsedilen listede 8 numarayı söyle."
  id: "Al-Aziz: yang dominan yang tidak mengalahkan; yang Perkasa, yang tiada tandingan. Nama nomor 8 dalam daftar yang disebutkan dalam hadits Al-Tirmidhi tentang Nama-nama Terindah Allah."
