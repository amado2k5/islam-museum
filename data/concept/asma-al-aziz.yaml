summary:
  ar: 'العزيز: الغالب الذي لا يُغلَب العزيز الذي لا نظير له. الاسم رقم 8 في التعداد الوارد في حديث الترمذي عن أسماء الله الحسنى.'
  en: al-Aziz — The Almighty. Name 8 in the enumeration of the most beautiful names in the Tirmidhi hadith.
  fr: "al-Aziz — Le Tout-Puissant. Nom 8 dans l’énumération des plus beaux noms du hadith de Tirmidhi."
  ur: 'العزيز: غالب — جو کبھی مغلوب نہ ہو، جس کا کوئی ہمسر نہیں۔ اسمائے حسنیٰ کی ترمذی والی گنتی میں نمبر 8۔'
