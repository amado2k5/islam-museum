label: { ar: "احتباء", en: "Squatting with arms around the knees (ihtiba')", es: "Ponerse en cuclillas con los brazos alrededor de las rodillas (ihtiba')", fr: "Accroupi, les bras autour des genoux (ihtiba')", ur: "گھٹنوں کے گرد بازوؤں کے ساتھ بیٹھنا ⁦(احتیبہ)⁩", tr: "Tutunmak", id: "Bertahan" }
summary:
  ar: "الاحتباء في اللغة القعود على المقعدة وضم الفخذين إلى البطن مع الظهر بثوب أو باليدين، وهو عند الفقهاء كذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1715} والفرق بينه وبين الإقعاء أن الاحتباء يتضمن ضم الفخذين والركبتين والالتزام بهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1715} وهو خارج الصلاة مباح ما لم يرافقه محظور كانكشاف العورة، والأولى تركه وقت الخطبة وعند انتظار الصلاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1715}"
  en: "Ihtiba' in the lexicon is sitting on the buttocks with the thighs drawn to the belly and held by a cloth or the hands; the jurists use it in the same sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1715} It differs from iq'a, sitting on the buttocks with the knees raised, in that ihtiba' involves drawing both thighs and knees and holding them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1715} Outside prayer it is lawful unless accompanied by something forbidden, such as exposure of the private parts; it is better left during the sermon and while waiting for prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1715}"
  es: "En el léxico, ihtiba' se refiere a sentarse sobre las nalgas con los muslos pegados al vientre y sostenidos por una tela o las manos; los juristas lo usan en el mismo sentido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1715} Se diferencia de iq'a, sentarse sobre las nalgas con las rodillas levantadas, en que ihtiba' implica juntar tanto los muslos como las rodillas y sostenerlos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1715} Fuera de la oración, es lícito a menos que vaya acompañado de algo prohibido, como la exposición de las partes íntimas; es mejor reservarlo para el sermón y mientras se espera la oración. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1715}"
  fr: "L'ihtiba', selon le lexique, désigne la position assise sur les fesses, les cuisses repliées contre le ventre et maintenues par un tissu ou les mains; les juristes l'emploient dans le même sens. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1715} Elle diffère de l'iq'a, qui consiste à s'asseoir sur les fesses, les genoux relevés, en ce que l'ihtiba' implique de replier les cuisses et les genoux et de les maintenir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1715} En dehors de la prière, cette position est licite, sauf si elle est accompagnée d'un acte interdit, tel que l'exhibition des parties intimes; il est préférable de s'en abstenir pendant le sermon et en attendant la prière. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1715}"
  ur: "لغت میں احتیبہ کولہوں پر بیٹھ کر رانوں کو پیٹ کی طرف کھینچ کر کپڑے یا ہاتھوں سے پکڑے ہوئے ہے۔ فقہاء اسے اسی معنی میں استعمال کرتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 1715} یہ اقعہ سے مختلف ہے، کولہوں پر گھٹنوں کو اٹھا کر بیٹھنا، اس احتیاتی میں دونوں رانوں اور گھٹنوں کو کھینچنا اور پکڑنا شامل ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1715} باہر کی نماز اس وقت تک حلال ہے جب تک کہ اس کے ساتھ کوئی حرام چیز نہ ہو، جیسے شرمگاہ کی نمائش؛ خطبہ کے دوران اور نماز کے انتظار میں چھوڑ دینا بہتر ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 1715}"
  tr: "Dilbilimsel açıdan 'ihtibb', 'qi'tibah'ın üzerine oturmak ve uylukları sırtla bir giysiyle veya ellerle karın üzerine getirmek anlamına gelir ve hukukçular tarafından da kabul edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1715} 'iq'a' ile arasındaki fark, 'ikhtiba'nın uyluklar ve dizlerin birleştirilip onlara yapışmasını içermesidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1715} Namaz dışında, örneğin özel bölgelerin açılması gibi yasak bir şey eşlik etmedikçe izin verilir. Tercih edilen uygulama, vaaz sırasında ve namaz beklerken namazdan ayrılmaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1715}"
  id: "Dalam istilah linguistik, 'ihtibb' adalah duduk di atas 'qi'tibah' dan membawa paha ke perut dengan punggung dengan pakaian atau tangan, dan juga dianggap oleh para ahli hukum. {cite:fiqh-mawsua-kuwaitiyya-v3 hlm.1715} Perbedaan antara ini dan 'iq'a' adalah bahwa 'ikhtiba' melibatkan penyambungan paha dan lutut serta menempelkannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1715} Diperbolehkan di luar doa kecuali disertai sesuatu yang terlarang, seperti membuka bagian pribadi. Praktik yang lebih baik adalah meninggalkannya saat khotbah dan sambil menunggu doa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1715}"
