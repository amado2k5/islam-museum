label: { ar: "احتباء", en: "Squatting with arms around the knees (ihtiba')" }
summary:
  ar: "الاحتباء في اللغة القعود على المقعدة وضم الفخذين إلى البطن مع الظهر بثوب أو باليدين، وهو عند الفقهاء كذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1715} والفرق بينه وبين الإقعاء أن الاحتباء يتضمن ضم الفخذين والركبتين والالتزام بهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1715} وهو خارج الصلاة مباح ما لم يرافقه محظور كانكشاف العورة، والأولى تركه وقت الخطبة وعند انتظار الصلاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1715}"
  en: "Ihtiba' in the lexicon is sitting on the buttocks with the thighs drawn to the belly and held by a cloth or the hands; the jurists use it in the same sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1715} It differs from iq'a, sitting on the buttocks with the knees raised, in that ihtiba' involves drawing both thighs and knees and holding them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1715} Outside prayer it is lawful unless accompanied by something forbidden, such as exposure of the private parts; it is better left during the sermon and while waiting for prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1715}"
