summary:
  ar: "روى ابن إسحاق، بسنده عن إسحاق بن يسار، أن النبي دعا ركانة بن عبد يزيد المطلبي إلى الإسلام، فقال له النبي: أرأيت إن صرعتك أتعلم أن ذلك حق؟ فقال: نعم، فصرعه النبي مرتين، وانطلق ركانة يقول: هذا ساحر. {cite:sira-ibn-ishaq-zakkar p.276} وأورد ابن حجر في الإصابة الخبر من طريق أبي جعفر بن محمد بن ركانة عن أبيه، وأن ابن حبان قال في إسناده نظراً، ورجّح ابن حجر أن محمد بن ركانة أسقط حلقة من السند عن أبيه. {cite:ibn-hajar-isaba p.499} {cite:ibn-hajar-isaba p.531} وذكره أبو نعيم في معرفة الصحابة في فهرس أحاديثه بعنوان «أن النبي صارع ركانة»، ولم يُقرأ متنه في النسخة الممسوحة. {cite:marifat-sahaba-abu-nuaym p.682}"
  en: "Ibn Ishaq narrates, through Ishaq ibn Yasar, that the Prophet invited Rukana ibn Abd Yazid of Banu al-Muttalib to Islam; the Prophet asked whether Rukana would know his claim to be true if he threw him, Rukana agreed, the Prophet threw him twice, and Rukana then said he was a sorcerer. {cite:sira-ibn-ishaq-zakkar p.276} Ibn Hajar, in al-Isaba, gives the bout also through Abu Ja'far ibn Muhammad ibn Rukana from his father; Ibn Hibban found the chain doubtful, and Ibn Hajar judged that Muhammad ibn Rukana most likely dropped a link from the chain. {cite:ibn-hajar-isaba p.499} {cite:ibn-hajar-isaba p.531} Abu Nu'aym lists the bout in his index of Companion reports under the incipit «the Prophet wrestled Rukana»; the body text was not legible in the scan used. {cite:marifat-sahaba-abu-nuaym p.682}"
  fr: "Ibn Ishaq rapporte, par Ishaq ibn Yasar, que le Prophète invita à l'islam Rukana ibn Abd Yazid, des Banu al-Muttalib ; le Prophète lui demanda s'il reconnaîtrait la vérité de sa prétention s'il le terrassait, Rukana accepta, le Prophète le terrassa deux fois, et Rukana dit alors qu'il était un sorcier. {cite:sira-ibn-ishaq-zakkar p.276} Ibn Hajar, dans al-Isaba, donne aussi le combat par Abu Ja'far ibn Muhammad ibn Rukana d'après son père ; Ibn Hibban trouva la chaîne douteuse, et Ibn Hajar jugea que Muhammad ibn Rukana avait très probablement omis un maillon de la chaîne. {cite:ibn-hajar-isaba p.499} {cite:ibn-hajar-isaba p.531} Abu Nu'aym mentionne le combat dans son index des récits des Compagnons sous l'incipit «le Prophète lutta avec Rukana» ; le corps du texte n'était pas lisible dans le scan utilisé. {cite:marifat-sahaba-abu-nuaym p.682}"
  ur: "ابن اسحاق نے اسحاق بن یسار کی سند سے روایت کیا کہ نبی نے رکانہ بن عبد یزید مطلبی کو اسلام کی دعوت دی؛ نبی نے پوچھا کہ اگر میں تمہیں پچھاڑ دوں تو کیا تم جان لو گے کہ میری بات سچ ہے؟ رکانہ نے ہاں کہا، اور نبی نے انہیں دو مرتبہ پچھاڑا۔ {cite:sira-ibn-ishaq-zakkar p.276} ابن حجر نے الاصابہ میں یہ خبر ابو جعفر بن محمد بن رکانہ کی سند سے نقل کی، ابن حبان نے اس کی سند پر اعتراض کیا، اور ابن حجر کے نزدیک قریب تر یہ ہے کہ محمد بن رکانہ نے سند سے ایک کڑی گرا دی۔ {cite:ibn-hajar-isaba p.499} {cite:ibn-hajar-isaba p.531} ابو نعیم نے معرفۃ الصحابہ کے فہرست احادیث میں اسے «أن النبي صارع ركانة» کے عنوان سے درج کیا، تاہم اسکے متن کی عبارت ممسوحہ نسخے میں پڑھی نہیں جا سکی۔ {cite:marifat-sahaba-abu-nuaym p.682}"
  es: "Ibn Ishaq narra, a través de Ishaq ibn Yasar, que el Profeta invitó a Rukana ibn Abd Yazid de Banu al-Muttalib al Islam; el Profeta preguntó si Rukana sabría que su afirmación era cierta si lo arrojaba, Rukana aceptó, el Profeta lo arrojó dos veces, y Rukana entonces dijo que era un hechicero. {cite:sira-ibn-ishaq-zakkar p.276} Ibn Hajar, en al-Isaba, también da el combate a través de Abu Ja'far ibn Muhammad ibn Rukana de su padre; Ibn Hibban encontró la cadena dudosa, e Ibn Hajar juzgó que Muhammad ibn Rukana probablemente dejó caer un eslabón de la cadena. {cite:ibn-hajar-isaba p.499} {cite:ibn-hajar-isaba p.531} Abu Nu'aym incluye el combate en su índice de relatos de los Compañeros bajo el incipit «el Profeta luchó contra Rukana»; el texto principal no era legible en el escaneo utilizado. {cite:marifat-sahaba-abu-nuaym p.682}"
  tr: "İbn İshak, İshaq bin Yasar'dan aldığı zincirle Peygamber'in Rukana ibn Abd Yazid al-Muttalibi'yi İslam'a davet ettiğini ve Peygamber'in ona şöyle dediğini anlattı: 'Seni vurursam, bunun doğru olduğunu biliyor musun?' O da dedi ki: Evet. Peygamber ona iki kez vurdu ve Rukana dışarı çıkıp 'Bu bir büyücüdür.' dedi. {atıf:sira-ibn-ishaq-zakkar s.276} İbn Hajar, El-İsabah'ta Ebu Ca'fer bin Muhammed ibn Rukana'nın babasından verdiği haberi aktardı ve İbn Hibban'ın iletim zincirinde belli bir perspektifle söylediğini ve İbn Hacer'in Muhammed bin Rukanah'ın babasından zincirin bir halkasını çıkarmasını tercih ettiğini aktardı. {alıntı:ibn-hakar-isaba s.499} {cit:ibn-hajar-isaba s.531} Ebu Nu'eym, \"Peygamber bir köşeye kavuştu\" başlıklı hadis dizininde Ma'rifat al-Sahabah'da bunu belirtmiş ve silinmiş kopyadaki metnini okumamıştır. {alıntı:Marifat-sahaba-abu-nuaym s.682}"
  id: "Ibn Ishaq menceritakan bagaimana, menggunakan rantai yang diterimanya dari Ishaq ibn Yasar, Nabi mengundang Rukana ibn Abd Yazid al-Mutalibi ke Islam dan Nabi berkata kepadanya: 'Jika aku memukulmu, apakah engkau tahu itu benar?' Ia menjawab: Ya. Nabi memukulnya dua kali, dan Ruqana keluar dan berkata, 'Ini adalah seorang dukun.' {atribusi: sira-ibn-ishaq al-Zakqar hlm.276} Ibn Hajar menyampaikan berita yang diberikan oleh Abu Ja'far ibn Muhammad ibn Ruqana dalam Al-Isaab tentang ayahnya, dan bahwa Ibn Hibban mengatakannya dari sudut pandang tertentu dalam rantai rantai, dan bahwa Ibn Hajar lebih memilih Muhammad ibn Rukanah untuk melepaskan satu mata rantai dari ayahnya. {kutipan: ibn-haqar-isaba hlm.499} {kutipan: ibn-hajar-isaba hlm.531} Abu Nu'aym menyebutkan hal ini dalam Ma'rifat al-Sahabah dalam indeks hadis berjudul \"Nabi telah sampai di sudut\" dan tidak membaca teks dalam salinan yang dihapus. {kutipan: Marifat-sahaba-abu-Nuaym hlm.682}"
