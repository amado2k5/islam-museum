id: concept/khiyar-al-ayb-fiqh
class: concept
kind: legal
label:
  ar: خيار العيب
  en: Khiyar al-ayb (option of defect)
  ur: خیار العیب
summary:
  ar: 'خيار العيب مركب إضافي من «خيار» و«عيب»، والجمهور يسمونه بهذا الاسم، والمالكية يسمونه غالبا خيار النقيصة. وعرّفه ابن نجيم وابن الهمام بأنه ما يخلو عنه أصل الفطرة السليمة مما يعد به ناقصا، وعرّفه ابن رشد بأنه ما نقص عن الخلقة الطبيعية أو عن الخلق الشرعي نقصانا له تأثير في الثمن، وعرّفه الغزالي بأنه كل وصف مذموم اقتضى العرف سلامة المبيع منه غالبا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7959} مشروعية الرد بالعيب: لا خلاف بين الفقهاء في الرد بالعيب في الجملة. استدلوا من القرآن بقوله تعالى «إلا أن تكون تجارة عن تراض منكم» (سورة النساء، 4:29)، لأن العلم بالعيب ينافي الرضا المشروط في العقود. ومن السنة حديث عائشة في الرجل الذي اشترى غلاما فاستغله ثم وجد به عيبا فرده، فقال النبي إن «الغلة بالضمان». واستدل الكاساني بحديث المصراة، والقياس عليه أن المشتري بذل الثمن ليسلم له مبيع سليم فلم يسلم له ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7959}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7960} وجوب إعلام العيب على البائع: يجب عليه أن يعلم المشتري بالعيب فيما يثبت فيه الخيار؛ أما إن لم يكن العيب موجبا للخيار فترك التعرض له ليس تدليسا محرما، كما قال إمام الحرمين. وصرح جمهور الفقهاء بأن الإعلام واجب، فمن لم يبينه فهو آثم، ولا خلاف فيه كما قال ابن قدامة والسبكي؛ واستدلوا بحديث عقبة بن عامر «المسلم أخو المسلم، ولا يحل لمسلم باع من أخيه بيعا وفيه عيب إلا بينه له»، وبحديث واثلة بن الأسقع في تحريم بيع شيء دون بيان ما فيه، وبحديث «من غشنا فليس منا» في صبرة الطعام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7960}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} أثر الكتمان على صحة البيع: البيع مع كتمان العيب المسبب للخيار صحيح مع الإثم عند جمهور الفقهاء، لأن النهي عن الكتمان لا عن العقد. وإذا علم المشتري بالعيب بعد الشراء ورضيه فالإثم على البائع والبيع صحيح، كما جزم الشوكاني. ومن فعل الصحابة أن ابن عمر اشترى إبلا هيما، فلما أخبر بعيبها رضيها وأمضى العقد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} وجوب الإعلام على غير العاقد: لا يقتصر الوجوب على البائع، بل يمتد إلى كل من علم بالعيب، لحديث واثلة والنصوص العديدة في وجوب النصح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} وقت الإعلام بالعيب: يكون قبل البيع إن كان المعلم بائعا أو أجنبيا، ليكف المشتري عن الشراء، فإن لم يحضر الأجنبي أو لم يتيسر له فبعده ليتمكن المشتري من الرد؛ ويتأكد الوجوب إذا انفرد الأجنبي بعلم العيب دون البائع. والحكمة من مشروعية خيار العيب دفع الضرر عن المشتري، لأن البيع يقتضي سلامة المبيع، فإذا فات وصف السلامة بالعيب تخير، إذ الرضا داخل في حقيقة البيع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7962}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7963} شروط خيار العيب ثلاثة: ظهور عيب معتبر؛ وجهل المشتري بالعيب عند العقد؛ وألا يكون البائع قد شرط البراءة من العيب. ويعتبر العيب معتبرا إذا أثر في نقص القيمة أو فوات غرض صحيح، وكانت السلامة من ذلك الوصف هي الأصل في جنس المبيع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7963}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7964} ضابط العيب عند الحنفية: كل ما يوجب نقصا في القيمة عند أهل الخبرة، سواء نقص العين أم لا؛ والعيب الفاحش في المهر ما يخرجه من الجيد إلى الوسط؛ والحد الفاصل عند مختار الفتاوى ما يدخل تحت تقويم المقومين. وعند الشافعية: ما ينقص القيمة أو العين نقصانا يفوت به غرض صحيح، والغالب في أمثاله عدمه؛ والحنابلة يكتفون بنقص العين ولو زادت القيمة، ويرون نقص المالية عيبا. والمالكية يعدون من العيب البيت الذي قتل فيه إنسان لأن النفوس تنفر منه فيبخس ثمنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7963}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7964}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7965} السلامة الأصلية: يشترط أن تكون السلامة من الوصف العارض هي الأصل في نوع المبيع وأمثاله؛ فما هو مألوف في أمثاله لا يعد عيبا معتبرا، كوجود الثفل في الزيت بالحد المعتاد. ومرجع الحكم في ذلك أهل الخبرة، والكاساني يجعل التعويل على عرف التجار، والحطاب كذلك. وعند الحنفية يشترط إجماع أهل الخبرة، فإن اختلفوا فلا رد؛ وعند الشافعية يكفي قول واحد عند الجمهور، وعند صاحب التتمة يشترط شاهدان؛ وإن اختلفا ولم يوجد من يرجع إليه فالقول قول البائع مع يمينه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7965} شروط تأثير العيب: أن يكون في نفس المبيع لا في شخص العاقد الآخر أو في الرهن أو الكفيل؛ وأن يكون قديما، أي مقارنا للعقد أو حادثا قبل القبض، فالحادث بعد التسليم لا يثبت به الخيار، وإن كان المالكية يأخذون بقضية العهدة (عهدة الثلاث في عيوب الرقيق، وعهدة السنة في الجنون والجذام والبرص)، والحنفية يستثنون الإجارة فيفسخ بالعيب الحادث فيها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7966} ولا يثبت الخيار إن كان العيب بفعل المشتري قبل القبض، فهذا القيد كالاستثناء مما قبله عند الشافعية. ويشترط أن يبقى العيب بعد التسليم ومستمرا حتى الرد، فلو زال قبل الرد سقط حق الرد؛ والحنفية والشافعية يشترطون ثبوت العيب عند المشتري ليعلم قيامه، لأن العيب الثابت عند البائع يحتمل الزوال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7966}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7967} شرط ألا تمكن إزالة العيب بلا مشقة: كطابع المصنع على القماش إذا كان لا يضره الغسل، أو نجاسة في الثوب تزال بالغسل. وإن هون البائع من شأن العيب ثم ظهر أكبر، فالمالكية يثبتون خيار الرد للمشتري ما لم يحدث عيب آخر، فيتخير بين الرد والأرش، كما في نوازل الونشريسي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7967}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7968} طرق إثبات العيب بحسب درجة ظهوره: الظاهر المشاهد لا يحتاج إلى بينة، ويخاصم به المشتري البائع؛ والباطن الذي لا يعرفه إلا الأطباء والبياطرة يثبت بشهادة رجلين مسلمين أو رجل عدل من أهل الخبرة؛ والذي لا يطلع عليه إلا النساء يكفي فيه قول امرأة عدل، والاثنتان أحوط، ويثبت في حق الخصومة لا في حق الرد عند الحنفية؛ والذي لا يعرف إلا بالتجربة كالإباق لا يثبت إلا بشهادة رجلين أو رجل وامرأتين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7968} يمين البائع: إذا عجز المشتري عن إثبات العيب عنده، فالصاحبان يريان استحلاف البائع، وأبو حنيفة لا يستحلفه. وإذا كان العيب مما يجوز أن يحدث مثله عند المشتري استحلف على البتات، وإن كان من فعل البائع حلف على البتات؛ أما ما ليس بفعله فيحلف على العلم، فإن نكل ثبت العيب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7968}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7969} شرط جهل المشتري بالعيب: فإن علم به عند العقد أو عند القبض فلا خيار له، لأن إقدامه على الشراء أو القبض مع العلم رضا دلالة؛ والعيب البارز الذي لا يخفى عند الرؤية يعد المتعاقد عالما به، وكذلك ما دل عليه البائع من موضع العيب. وإذا صرح البائع بالعيب واشترطه كما لو باع ثورا على أنه يرقد في المحراث، فالبائع برئ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7969}'
  en: 'Khiyar al-ayb (option of defect) is a compound of ''option'' and ''defect''. The majority use this name; the Malikis usually call it the option of deficiency (khiyar al-naqisa). Ibn Nujaym and Ibn al-Humam define a defect as what the sound natural state lacks, so as to count as deficient; Ibn Rushd as what falls short of the natural creation or the lawful form, with a real effect on the price; al-Ghazali as any disliked attribute whose absence customarily is assumed for the thing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7959} Lawfulness of return for defect: the jurists agree in general that a defective thing may be returned. They cite the Qur''an, that trade must be by mutual consent (Surah al-Nisa, 4:29), since knowledge of a defect means the consent is not full; and the Sunnah: the report of Aisha about a man who bought a slave, used him, found a defect and returned him, and the Prophet''s ruling that the yield goes with the liability. Al-Kasani also cites the hadith of the sheep with its udder held full, and argues by analogy that the buyer pays a price for a sound thing and does not get it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7959}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7960} Duty of the seller to disclose: the seller must tell the buyer of a defect that gives the option. Not mentioning a defect that gives no option is not forbidden deceit, in the view of Imam al-Haramayn. The majority hold that disclosure is obligatory, and whoever hides a defect is sinful, a matter on which there is no dispute according to Ibn Qudama and al-Subki. Ibn Rushd counts it as eating wealth falsely. The sources cited include the hadith of Uqba ibn Amir that a Muslim sells to his brother only with the defect shown, the hadith of Wathila ibn al-Asqa'' against selling without explaining what is in it, and the saying «whoever cheats us is not of us», from the heap of grain that the Prophet found wet. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7960}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} Concealment and the validity of the sale: a sale that conceals a defect giving the option is valid though sinful, according to most jurists, since the prohibition is on concealment, not on the contract. If the buyer learns of the defect after buying and accepts it, the seller is still at fault and the sale holds, as al-Shawkani holds. The Companions'' practice included Ibn Umar buying camels with mange, and accepting them when told of it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} Duty on others than the contracting party: the duty to disclose is not limited to the seller but extends to anyone who knows of the defect, on the report of Wathila and the many texts on giving counsel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} Timing of the disclosure: a seller or a third party who knows of a defect should disclose it before the sale, so that the buyer may refrain; if the third party is not present, or cannot, then after the sale, so that the buyer may return the thing. The duty is strongest when only a third party knows. The purpose of the option is to remove harm from the buyer: a sale implies a sound object, and when soundness fails through a defect the buyer has the choice, because consent is part of the sale''s nature. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7962}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7963} Three conditions for the option of defect: a real defect must appear; the buyer must not have known of it at the contract; and the seller must not have stipulated release from defects. A defect counts when it lowers value or defeats a valid purpose, and when soundness in that respect is the normal state of that kind of thing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7963}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7964} Definitions: the Hanafis take any thing that lowers value in the eyes of experts, whether or not the substance is reduced; a grave defect in a dowry moves it from good to middling to poor quality. The Shafiis take a defect that lowers value or substance so that a valid purpose is lost, when the usual state of such things is free of it; the Hanbalis count loss of substance even where value rises, and loss of value even where substance is unchanged. The Malikis count a house where someone was killed as defective, since people shun it and its price falls. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7963}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7964}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7965} Normal state: the freedom from the defect must be the normal state of the kind of thing. What is common in such things is not a defect; for instance a usual sediment in oil. Experts decide: merchants for goods, craftsmen for crafted things. The Hanafis require the agreement of experts (if they disagree, there is no right of return); the majority of the Shafiis accept one expert, and the author of al-Tatimma requires two. If the two disagree and no other authority is available, the seller''s word stands with his oath. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7965} Conditions of effect: the defect must be in the object itself, not in the other party, a pledge, or a guarantor. It must be old, that is present at the contract or arising before receipt; a defect that arises after receipt gives no option, though the Malikis apply the rule of warranty (three days for slaves; a year for madness, leprosy and vitiligo). The Hanafis make an exception for leasing, which is annulled by a new defect, since leasing is a contract of benefits that accrue gradually. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7966} The buyer''s own act: a defect caused by the buyer before receipt gives no option, in the Shafii view. The defect must remain after delivery and until return: if it disappears before the buyer returns the thing, the right to return lapses. The Hanafis and Shafiis require that the buyer prove the defect is present with him, since a defect present with the seller may be removed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7966}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7967} Removable defects: no option where the defect can be removed without hardship, such as a maker''s stamp on cloth that washing does not harm, or stain on a garment that washing removes. If the seller minimised the defect and the buyer accepted it, the Malikis grant the buyer the right to return unless a new defect has arisen; then he may choose between return and compensation (arsh), as in a legal opinion by al-Wansharisi about a beast wounded by a spear. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7967}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7968} Proof of defects by how visible they are: a visible defect needs no proof beyond the buyer''s sight, and he may sue the seller. A hidden defect known only to experts (such as pain in the liver or spleen) is proven by two Muslim men or one just man of expertise. A defect only women see is proven by the word of one just woman, two being safer; in the Hanafi view it proves the claim but not return. A defect known only by trial, such as a slave who absconds, needs two men or a man and two women. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7968} The seller''s oath: if the buyer cannot prove the defect was with the seller, the two companions of Abu Hanifa have the seller sworn; Abu Hanifa does not. If the defect may occur in the buyer''s hand, the oath is absolute (a definite oath); if the seller only knows of another''s act, he swears on knowledge. If the seller refuses to swear, the defect is established against him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7968}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7969} Knowledge of the defect: the buyer must be unaware of the defect. If he knew it at the contract or at receipt he has no option, since by buying or taking the thing with knowledge he consents in effect. A defect that is obvious and that anyone would see counts as known, and so does a defect the seller pointed out. Where the seller said that a thing is faulty as a condition of sale, as with a bull sold on condition that it sleeps in the plough, the seller is free of blame. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7969}'
  ur: 'خیار العیب: «خیار» اور «عیب» سے مرکب اضافی ہے؛ جمہور یہی نام لیتے ہیں اور مالکیہ اسے عموماً خیار النقیصہ کہتے ہیں۔ ابن نجیم اور ابن الہمام کے نزدیک عیب وہ ہے جس سے سلیم فطرت خالی ہو اور اس کی وجہ سے چیز ناقص شمار ہو؛ ابن رشد کے نزدیک جو خلقتِ طبیعی یا شرعی خلق سے کم ہو اور قیمت پر اثر ڈالے؛ غزالی کے نزدیک ہر مذموم وصف جس کی غیر موجودگی عرف میں عموماً فرض کی جاتی ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7959} عیب کی بنا پر رد کی مشروعیت: فقہاء کے درمیان اجمالاً اس پر اتفاق ہے۔ قرآن سے سورۃ النساء (4:29) کی آیت «تجارة عن تراض» سے استدلال ہے کیونکہ عیب کا علم رضامندی کو ناقص کرتا ہے؛ سنت سے عائشہ کی حدیث ہے جس میں غلام کا غلہ (کمائی) «الغلة بالضمان» کے اصول پر مالک کو ملتا ہے۔ کاسانی مصراۃ کی حدیث سے بھی استدلال کرتے ہیں، اور قیاس یہ ہے کہ مشتری نے ثمن اس لیے دیا کہ سالم چیز ملے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7959}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7960} بائع پر عیب بتانے کا وجوب: جس عیب سے خیار ثابت ہو اس کا بتانا واجب ہے؛ جو عیب خیار نہ دے اس کا ذکر نہ کرنا امام الحرمین کے نزدیک حرام دھوکہ نہیں۔ جمہور کے نزدیک بتانا واجب ہے اور چھپانے والا گناہ گار ہے، اس پر ابن قدامہ اور سبکی کے مطابق اختلاف نہیں۔ دلیل میں عقبہ بن عامر کی حدیث «المسلم أخو المسلم» اور واثلہ بن الأسقع کی حدیث، اور «من غشنا فليس منا» جو غلے کے ڈھیر کے واقعے سے ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7960}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} کتمان کا بیع کی صحت پر اثر: خیار دینے والا عیب چھپا کر بیچنا جمہور کے نزدیک گناہ کے ساتھ صحیح ہے، کیونکہ نہی کتمان پر ہے نہ کہ عقد پر۔ اگر مشتری خرید کے بعد عیب جان کر راضی ہو جائے تو بائع پر گناہ ہے اور بیع صحیح ہے، جیسا کہ شوکانی نے جزم کیا۔ صحابہ کے عمل میں ابن عمر کا خارشی اونٹ خریدنا اور بتانے پر قبول کر لینا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} غیر عاقد پر وجوب: یہ وجوب صرف بائع پر نہیں بلکہ ہر اس شخص پر ہے جو عیب جانتا ہو، واثلہ کی حدیث اور نصیحت کے وجوب کے بارے میں متعدد نصوص کی بنا پر۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} عیب بتانے کا وقت: بیع سے پہلے بتانا چاہیے تاکہ مشتری رک جائے، اور اگر اجنبی موجود نہ ہو یا میسر نہ ہو تو بعد میں تاکہ مشتری واپس کر سکے؛ جب صرف اجنبی کو علم ہو تو وجوب زیادہ مؤکد ہے۔ خیار عیب کی حکمت مشتری سے ضرر دور کرنا ہے، کیونکہ بیع سالم چیز کا تقاضا کرتی ہے، اور عیب سے سلامت کا وصف جاتا رہے تو اختیار ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7962}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7963} خیار عیب کی تین شرطیں: معتبر عیب کا ظاہر ہونا؛ عقد کے وقت مشتری کو عیب کا علم نہ ہونا؛ اور بائع نے عیب سے بری ہونے کی شرط نہ لگائی ہو۔ عیب اس وقت معتبر ہوتا ہے جب قیمت میں کمی کرے یا صحیح غرض فوت کرے، اور اس جنس میں سلامت اصل ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7963}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7964} حنفیہ کا ضابطہ: ہر وہ چیز جو اہل خبرہ کے نزدیک قیمت میں کمی کرے، خواہ عین میں کمی ہو یا نہ ہو۔ شافعیہ کے نزدیک جو قیمت یا عین میں ایسی کمی کرے کہ صحیح غرض فوت ہو اور ایسی چیزوں میں عام طور پر یہ عیب نہ ہوتا ہو۔ حنابلہ عین کی کمی کو کافی سمجھتے ہیں اگرچہ قیمت بڑھ جائے، اور مالکیہ اس گھر کو عیب مانتے ہیں جس میں قتل ہوا ہو کیونکہ لوگ اسے ناپسند کرتے ہیں اور قیمت گرتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7963}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7964}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7965} اصل سلامت: اس جنس کی عام حالت سلامت ہونی چاہیے؛ جو ان چیزوں میں معمول ہو وہ عیب نہیں، جیسے تیل میں معمول کی تلچھٹ۔ اہل خبرہ فیصلہ کرتے ہیں، کاسانی کے نزدیک تاجروں کا عرف معتبر ہے۔ حنفیہ کے نزدیک اہل خبرہ کا اتفاق شرط ہے، اختلاف میں رد نہیں؛ شافعیہ کے نزدیک جمہور ایک کا قول کافی سمجھتے ہیں۔ اختلاف ہو تو بائع کا قول اس کی قسم کے ساتھ معتبر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7965} تاثیر کی شرائط: عیب خود مبیع میں ہو، عاقد دوسرے یا رہن و ضامن میں نہ ہو؛ قدیم ہو، یعنی عقد کے وقت یا قبض سے پہلے موجود ہو؛ قبض کے بعد پیدا ہونے والا عیب خیار نہیں دیتا، اگرچہ مالکیہ عہدہ کا اصول اپناتے ہیں (غلام میں تین دن، جنون، جذام اور برص میں ایک سال)۔ حنفیہ اجارے میں استثنا کرتے ہیں کیونکہ وہ منافع کا عقد ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7966} مشتری کا اپنا فعل: قبض سے پہلے مشتری کے فعل سے عیب ہو تو شافعیہ کے نزدیک خیار نہیں۔ عیب قبض کے بعد رد تک باقی رہنا چاہیے؛ اگر رد سے پہلے زائل ہو جائے تو رد کا حق نہیں رہتا۔ حنفیہ اور شافعیہ کے نزدیک مشتری کے ہاتھ میں عیب کا ثبوت ضروری ہے، کیونکہ بائع کے پاس عیب زائل ہونے کا احتمال ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7966}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7967} قابل ازالہ عیب: جو بغیر مشقت دور ہو سکے، جیسے کپڑے پر بنانے والی کمپنی کا نشان جو دھونے سے نہ جاتا ہو مگر دھونے سے نقصان نہ پہنچے، یا کپڑے کی نجاست جو دھونے سے زائل ہو۔ اگر بائع نے عیب کو معمولی بتایا اور مشتری راضی ہو گیا، تو مالکیہ کے نزدیک رد کا حق باقی رہتا ہے جب تک نیا عیب پیدا نہ ہو، اور تب مشتری رد یا ارش کے درمیان اختیار رکھتا ہے (ونشریسی کا فتویٰ نیزے کے زخم والے جانور کے بارے میں)۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7967}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7968} عیب کے ثبوت کے طریقے: ظاہر عیب کے لیے بینہ کی ضرورت نہیں اور مشتری بائع سے خصومت کر سکتا ہے؛ باطن عیب جو صرف ماہرین جانیں (جیسے جگر یا تلی کا درد) دو مسلمان مردوں یا ایک عادل ماہر سے ثابت ہوتا ہے؛ جو صرف عورتیں دیکھ سکیں اس میں ایک عادل عورت کا قول کافی ہے، دو زیادہ محتاط ہیں، اور حنفیہ کے نزدیک یہ خصومت کے لیے ہے، رد کے لیے نہیں؛ جو صرف تجربے سے معلوم ہو، جیسے بھاگ جانے والا غلام، اس کے لیے دو مرد یا ایک مرد اور دو عورتیں درکار ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7968} بائع کی قسم: اگر مشتری ثابت نہ کر سکے کہ عیب بائع کے پاس تھا تو صاحبین بائع کو قسم دینے کے قائل ہیں، ابو حنیفہ نہیں۔ اگر عیب مشتری کے ہاتھ میں بھی پیدا ہو سکتا ہو تو قسم قطعی (علی البتات) ہوگی، اور اگر بائع کا اپنا فعل نہ ہو تو علم کی قسم کھائے گا؛ انکار کرے تو عیب اس کے خلاف ثابت ہو جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7968}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7969} مشتری کا علم: مشتری کو عیب کا علم نہ ہو۔ عقد یا قبض کے وقت علم ہو تو خیار نہیں، کیونکہ علم کے ساتھ خریدنا یا لینا رضامندی کے مترادف ہے۔ واضح عیب جو دیکھنے سے نمایاں ہو، اور وہ عیب جس کی طرف بائع نے اشارہ کر دیا ہو، معلوم سمجھے جاتے ہیں۔ جیسے بیل کو اس شرط پر بیچنا کہ وہ ہل میں سوتا ہے، تو بائع بری ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7969}'
