id: concept/khiyar-al-ayb-fiqh
class: concept
kind: legal
label:
  ar: خيار العيب
  en: Khiyar al-ayb (option of defect)
  ur: خیار العیب
  es: "Khiyar al-ayb (opción de defecto)"
  fr: "Khiyar al-ayb (option de défaut)"
  tr: "Arıza seçeneği"
  id: "Opsi cacat"
summary:
  ar: 'خيار العيب مركب إضافي من «خيار» و«عيب»، والجمهور يسمونه بهذا الاسم، والمالكية يسمونه غالبا خيار النقيصة. وعرّفه ابن نجيم وابن الهمام بأنه ما يخلو عنه أصل الفطرة السليمة مما يعد به ناقصا، وعرّفه ابن رشد بأنه ما نقص عن الخلقة الطبيعية أو عن الخلق الشرعي نقصانا له تأثير في الثمن، وعرّفه الغزالي بأنه كل وصف مذموم اقتضى العرف سلامة المبيع منه غالبا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7959} مشروعية الرد بالعيب: لا خلاف بين الفقهاء في الرد بالعيب في الجملة. استدلوا من القرآن بقوله تعالى «إلا أن تكون تجارة عن تراض منكم» ⁦(سورة النساء، 4:29)⁩، لأن العلم بالعيب ينافي الرضا المشروط في العقود. ومن السنة حديث عائشة في الرجل الذي اشترى غلاما فاستغله ثم وجد به عيبا فرده، فقال النبي إن «الغلة بالضمان». واستدل الكاساني بحديث المصراة، والقياس عليه أن المشتري بذل الثمن ليسلم له مبيع سليم فلم يسلم له ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7959}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7960} وجوب إعلام العيب على البائع: يجب عليه أن يعلم المشتري بالعيب فيما يثبت فيه الخيار؛ أما إن لم يكن العيب موجبا للخيار فترك التعرض له ليس تدليسا محرما، كما قال إمام الحرمين. وصرح جمهور الفقهاء بأن الإعلام واجب، فمن لم يبينه فهو آثم، ولا خلاف فيه كما قال ابن قدامة والسبكي؛ واستدلوا بحديث عقبة بن عامر «المسلم أخو المسلم، ولا يحل لمسلم باع من أخيه بيعا وفيه عيب إلا بينه له»، وبحديث واثلة بن الأسقع في تحريم بيع شيء دون بيان ما فيه، وبحديث «من غشنا فليس منا» في صبرة الطعام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7960}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} أثر الكتمان على صحة البيع: البيع مع كتمان العيب المسبب للخيار صحيح مع الإثم عند جمهور الفقهاء، لأن النهي عن الكتمان لا عن العقد. وإذا علم المشتري بالعيب بعد الشراء ورضيه فالإثم على البائع والبيع صحيح، كما جزم الشوكاني. ومن فعل الصحابة أن ابن عمر اشترى إبلا هيما، فلما أخبر بعيبها رضيها وأمضى العقد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} وجوب الإعلام على غير العاقد: لا يقتصر الوجوب على البائع، بل يمتد إلى كل من علم بالعيب، لحديث واثلة والنصوص العديدة في وجوب النصح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} وقت الإعلام بالعيب: يكون قبل البيع إن كان المعلم بائعا أو أجنبيا، ليكف المشتري عن الشراء، فإن لم يحضر الأجنبي أو لم يتيسر له فبعده ليتمكن المشتري من الرد؛ ويتأكد الوجوب إذا انفرد الأجنبي بعلم العيب دون البائع. والحكمة من مشروعية خيار العيب دفع الضرر عن المشتري، لأن البيع يقتضي سلامة المبيع، فإذا فات وصف السلامة بالعيب تخير، إذ الرضا داخل في حقيقة البيع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7962}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7963} شروط خيار العيب ثلاثة: ظهور عيب معتبر؛ وجهل المشتري بالعيب عند العقد؛ وألا يكون البائع قد شرط البراءة من العيب. ويعتبر العيب معتبرا إذا أثر في نقص القيمة أو فوات غرض صحيح، وكانت السلامة من ذلك الوصف هي الأصل في جنس المبيع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7963}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7964} ضابط العيب عند الحنفية: كل ما يوجب نقصا في القيمة عند أهل الخبرة، سواء نقص العين أم لا؛ والعيب الفاحش في المهر ما يخرجه من الجيد إلى الوسط؛ والحد الفاصل عند مختار الفتاوى ما يدخل تحت تقويم المقومين. وعند الشافعية: ما ينقص القيمة أو العين نقصانا يفوت به غرض صحيح، والغالب في أمثاله عدمه؛ والحنابلة يكتفون بنقص العين ولو زادت القيمة، ويرون نقص المالية عيبا. والمالكية يعدون من العيب البيت الذي قتل فيه إنسان لأن النفوس تنفر منه فيبخس ثمنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7963}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7964}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7965} السلامة الأصلية: يشترط أن تكون السلامة من الوصف العارض هي الأصل في نوع المبيع وأمثاله؛ فما هو مألوف في أمثاله لا يعد عيبا معتبرا، كوجود الثفل في الزيت بالحد المعتاد. ومرجع الحكم في ذلك أهل الخبرة، والكاساني يجعل التعويل على عرف التجار، والحطاب كذلك. وعند الحنفية يشترط إجماع أهل الخبرة، فإن اختلفوا فلا رد؛ وعند الشافعية يكفي قول واحد عند الجمهور، وعند صاحب التتمة يشترط شاهدان؛ وإن اختلفا ولم يوجد من يرجع إليه فالقول قول البائع مع يمينه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7965} شروط تأثير العيب: أن يكون في نفس المبيع لا في شخص العاقد الآخر أو في الرهن أو الكفيل؛ وأن يكون قديما، أي مقارنا للعقد أو حادثا قبل القبض، فالحادث بعد التسليم لا يثبت به الخيار، وإن كان المالكية يأخذون بقضية العهدة ⁦(عهدة الثلاث في عيوب الرقيق، وعهدة السنة في الجنون والجذام والبرص)⁩، والحنفية يستثنون الإجارة فيفسخ بالعيب الحادث فيها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7966} ولا يثبت الخيار إن كان العيب بفعل المشتري قبل القبض، فهذا القيد كالاستثناء مما قبله عند الشافعية. ويشترط أن يبقى العيب بعد التسليم ومستمرا حتى الرد، فلو زال قبل الرد سقط حق الرد؛ والحنفية والشافعية يشترطون ثبوت العيب عند المشتري ليعلم قيامه، لأن العيب الثابت عند البائع يحتمل الزوال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7966}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7967} شرط ألا تمكن إزالة العيب بلا مشقة: كطابع المصنع على القماش إذا كان لا يضره الغسل، أو نجاسة في الثوب تزال بالغسل. وإن هون البائع من شأن العيب ثم ظهر أكبر، فالمالكية يثبتون خيار الرد للمشتري ما لم يحدث عيب آخر، فيتخير بين الرد والأرش، كما في نوازل الونشريسي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7967}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7968} طرق إثبات العيب بحسب درجة ظهوره: الظاهر المشاهد لا يحتاج إلى بينة، ويخاصم به المشتري البائع؛ والباطن الذي لا يعرفه إلا الأطباء والبياطرة يثبت بشهادة رجلين مسلمين أو رجل عدل من أهل الخبرة؛ والذي لا يطلع عليه إلا النساء يكفي فيه قول امرأة عدل، والاثنتان أحوط، ويثبت في حق الخصومة لا في حق الرد عند الحنفية؛ والذي لا يعرف إلا بالتجربة كالإباق لا يثبت إلا بشهادة رجلين أو رجل وامرأتين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7968} يمين البائع: إذا عجز المشتري عن إثبات العيب عنده، فالصاحبان يريان استحلاف البائع، وأبو حنيفة لا يستحلفه. وإذا كان العيب مما يجوز أن يحدث مثله عند المشتري استحلف على البتات، وإن كان من فعل البائع حلف على البتات؛ أما ما ليس بفعله فيحلف على العلم، فإن نكل ثبت العيب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7968}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7969} شرط جهل المشتري بالعيب: فإن علم به عند العقد أو عند القبض فلا خيار له، لأن إقدامه على الشراء أو القبض مع العلم رضا دلالة؛ والعيب البارز الذي لا يخفى عند الرؤية يعد المتعاقد عالما به، وكذلك ما دل عليه البائع من موضع العيب. وإذا صرح البائع بالعيب واشترطه كما لو باع ثورا على أنه يرقد في المحراث، فالبائع برئ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7969} علم المشتري بالعيب دون أن يدري أنه عيب: إذا علم المشتري بالأمر المعتبر عيبا دون أن يعرف أنه عيب فقبضه ثم عرف بعد القبض، فإن كان العيب بيّنا لا يخفى على الناس فلا رد له، وإن كان لا يعرفه إلا أهل الخبرة فله الرد. ومثله من علم أن النقد زيف دون أن يعرف عدده، فلم يكن رضاه بالجملة رضا بالعيب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7970} شرط عدم البراءة: لا يقوم الخيار إن اشترط البائع البراءة من العيب أو العيوب، واقترانها بالبيع يجعله نوعا خاصا يسمى بيع البراءة. وتجوز البراءة عند الحنفية مطلقا، معلوما كان العيب للمشترط أو مجهولا، وأجازها مالك والشافعي في الحيوان وحده، لأنه قلما ينفك عن عيب خفي أو ظاهر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7970}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7971} أصل البراءة: أثر عبد الله بن عمر حين باع غلاما له بالبراءة، فادعى المشتري داء لم يسمه، فحكم عثمان بن عفان أن يحلف ابن عمر أنه لا يعلم به، فأبى وارتجع الغلام، ثم باعه بعد ذلك بمال أكثر. وتتعدد مذاهب العلماء في البراءة: أن يبرأ من كل عيب علمه البائع أو لم يعلمه ⁦(أبو حنيفة وأبو ثور)⁩؛ أو لا يبرأ حتى يسمي العيب ⁦(ابن أبي ليلى والثوري)⁩؛ أو حتى يضع يده على العيب ⁦(الشافعية في المرئي، وشريح وعطاء وأحمد وإسحاق)⁩؛ أو لا يبرأ إلا من العيب الباطن في الحيوان ⁦(مالك والشافعي في القول الظاهر)⁩؛ أو تكون البراءة في بيع المغنم والمفلس والديون، أو يبطل البيع أصلا ⁦(قول للشافعية)⁩. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7971}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7972} أقسام البراءة: خاصة من عيب معين، أو عامة من كل عيب. ومن حيث الإضافة: إن قيدت بالعيب الموجود عند العقد فلا تتناول الحادث قبل القبض؛ وإن أضيفت إلى المستقبل بتنصيص على العيب الحادث بعد العقد قبل القبض فالشرط باطل والعقد فاسد؛ وإن أطلقت فعند أبي حنيفة وأبي يوسف تشمل القائم عند العقد وما يحدث إلى القبض، وعند مالك ومحمد وزفر والحسن بن زياد تقتصر على الموجود عند العقد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7972} العقود التي يثبت فيها خيار العيب عند الحنفية: البيع والشراء ⁦(والبيع الصحيح لا الفاسد، ويشمل الصرف)⁩، والإجارة ⁦(يثبت فيها الخيار بعيب قديم أو حادث، وينفرد صاحبه بالرد قبل القبض وبعده)⁩، والقسمة، والصلح عن المال، والمهر، وبدل الخلع، وبدل الصلح عن دم العمد ⁦(والرد فيها بالعيب الفاحش لا اليسير)⁩. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7972}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7973} ضابط ابن رشد: العقود ثلاثة أنواع: ما هو مجال لخيار العيب بلا خلاف وهو عقود المعاوضة؛ وما ليس مجالا له بلا خلاف كالهبة بلا عوض والصدقة؛ وما فيه خلاف، والأظهر أنه ليس مجالا له، كالهبة بقصد العوض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7973} توقيت الرد بالعيب: فيه ثلاثة آراء. الأول أنه على الفور، أي المبادرة على العادة، فمن علم العيب ولم يفسخ حتى سقط حقه وهو من ضمانه، وهو مذهب الشافعية وروايه عن أحمد، وقال به صاحب الحاوي من الحنفية، وقال ابن نجيم إنه غريب، والمعتمد عند الحنفية أنه على التراخي. والثاني أنه على التراخي ما لم يوجد دليل الرضا، وهو مذهب الحنفية على المعتمد والحنابلة في الرواية المصححة. والثالث أنه يوم أو يومان، وهو مذهب المالكية، فمن أمسك بعد ذلك دل على رضاه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7974}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7975} أثر العيب على حكم العقد: لا يمنع العيب انتقال الملك، فملك المبيع يثبت للمشتري حالا، وملك الثمن للبائع، لأن ركن البيع مطلق عن الشرط، والثابت بالنص شرط السلامة، وأثره منع لزوم العقد لا منع أصل حكمه. فالعقد مع خيار العيب غير لازم، لأن السلامة مشروطة فيه دلالة، والمشتري يدفع الثمن ليسلم له المبيع كله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7975}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7976} ما يخير فيه المشتري ⁦(ثلاثة اتجاهات)⁩: الأول، عند الحنفية والشافعية، التخيير بين الرد واسترداد الثمن، أو الإمساك بجميع الثمن دون أرش، ولا يمسك المعيب مع الأرش إلا عند تعذر الرد. والثاني، عند أحمد وإسحاق، التخيير بين الرد أو الإمساك مع الأرش، واستثنوا ما يؤدي إلى الربا فيكون الإمساك مجانا. والثالث، عند المالكية، يفرق بين الكثير ⁦(يخير بين الرد والإمساك مجانا)⁩ والمتوسط ⁦(في العقار يرجع بالأرش، وفي العروض يجب الرد على ظاهر المدونة)⁩. وسبب الخلاف: هل نقص العيب نقص أصل أم نقص وصف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7976}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7977} شرائط الرد: قيام الخيار؛ وأن يكون المردود على الوصف الذي قبضه المشتري، فلا يزيد عيب حادث أو عيب شركة؛ وألا يتضمن الرد تفريق الصفقة قبل تمام القبض، وإن رضي البائع جاز، لأنه ضرر مرضي من جهته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7977} تفريق الصفقة: إذا اتحد المبيع صفقة لا يرد المشتري بعضه بعيب قهرا، إلا إذا كان الباقي للبائع فيرد عليه البعض قهرا، وهو المعتمد عند القاضي ومن تبعه، لأن العلة الصحيحة هي الضرر الناشئ من تبعيض الصفقة على البائع. ولا يجوز تفريق الصفقة قبل قبض المبيع كله، سواء أكان شيئا واحدا كالثوب والدار، أو مكيلا أو موزونا في أوعية، أو شيئين حقيقة وتقديرا كالثوبين والدارين، أو شيئا واحدا تقديرا كمصراعي باب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7978} المالكية: إن فات السالم فللمشتري رد المعيب مطلقا وأخذ حصته من الثمن؛ وإن بقي السالم فله رد البعض بحصته بشرطين: ألا يكون المعيب أكثر من النصف ولو بيسير، وألا يكون المعيب وجه الصفقة، وإلا فله رد الجميع أو الرضا بالجميع. والحنابلة يمنعون الرد بالتفريق قطعا في الشيء الواحد وفي الشيئين مما ينقصهما التفريق، أما ما لا ينقص بالتفريق فليس له رد أحدهما على الصحيح. والشافعية لا يردون بعض المبيع المعيب، وإن كان الباقي للبائع، إلا قول القاضي حسين بالرد لأنه لا تبعيض فيه على البائع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7978}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7979} تفريق الصفقة بتعدد العاقد: إذا اشترى رجلان شيئا واطلعا على عيب فينفرد أحدهما بالفسخ في قول أبي حنيفة، وعند أبي يوسف ومحمد ينفرد؛ وحجة أبي حنيفة أن الرد لم يقع على الوصف الذي قبض عليه لأن عيب الشركة زائد. والشافعية والحنابلة يفرقون بين تعدد الصفقة بتعدد البائع أو المشتري أو تفصيل الثمن فيجوز رد أحدهما، وبين الانفراد فلا يجوز؛ وإن كان أحد البائعين غائبا فيرد على الحاضر حصته بقسطها من الثمن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7979}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7980} علم العاقد الآخر بالرد: يشترط الحنفية علمه بالفسخ، سواء أكان الرد قبل القبض أم بعده، فإن فسخ دون علمه كان موقوفا يتم بعلمه في المدة ويصير إجازة إن مضت المدة. أما الشافعية والحنابلة فلا يشترطون علمه ولا رضاه ولا حكم حاكم قبل القبض ولا بعده. والحنفية لا يشترطون للرد قبل القبض قضاء أو تراضيا، أما بعد القبض فلابد من أحدهما لأن الصفقة تمت بالقبض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7980}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7981} طبيعة الرد وأثرها في تعاقب البيع: عند الحنفية الرد بالتراضي بعد القبض فسخ بين المتعاقدين بيع في حق غيرهما، والرد بالقضاء فسخ في حقهما وفي حق غيرهما؛ وعند غير الحنفية الفسخ رفع للعقد من أصله. ويظهر الأثر في البيع الثاني: إن قبل البائع الثاني الرد بالقضاء بإقامة البينة أو النكول أو الإقرار، فله أن يرد على بائعه الأول؛ وإن قبله بالتراضي فليس له ذلك، لأنه بيع جديد في حق الثالث. أما قبل القبض فللمشتري الأول أن يرده على البائع الأول مطلقا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7981}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7982}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7983} الإمساك مع الأرش: إذا تعذر الرد بأمور تطرأ على المبيع من زيادة أو نقصان أو تصرف تنتقل حقوق المشتري من الرد إلى الرجوع بنقصان الثمن، وهو ما يسمى الموجب الخلفي؛ وهو مذهب الحنفية والشافعية، وعرفه المالكية عند تقسيم العيوب إلى يسير وكثير ⁦(عيب رد)⁩ ومتوسط ⁦(عيب قيمة)⁩، والحنابلة يخيرون بين الإمساك بنقصان الثمن والرد ولو لم يتعذر. والأرش يعرف بتقويم المبيع سليما ثم معيبا، ونسبة التفاوت إلى القيمة، وتؤخذ من الثمن. ويرى صاحب الأشباه أن القيمة تعتبر يوم العقد، والحسن البصري وأحمد يرون أنها يوم الشراء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7983}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7984} موانع الرد: طبيعية أو شرعية أو عقدية. فالهلاك في يد البائع يمنع الرد، ولا يرجع البائع على المشتري بشيء؛ والهلاك بعد القبض بسبب سماوي يمنع الرد ويكون الموجب الخلفي نقصان الثمن. وكذلك الاستهلاك بالاستعمال المشروع كأكل الطعام ولبس الثوب حتى يتخرق، وفيه خلاف بين أبي حنيفة وصاحبيه. والحنابلة يفرقون بحسب التدليس؛ والمالكية يرجعون بالثمن كله إذا كان العيب المدلس هو الذي أودى بالمبيع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7985} موانع الرد الشرعية: زيادة متصلة غير متولدة، كالصبغ والخياطة والبناء والغرس، تمنع الرد مطلقا قبل القبض أو بعده، لأنها أصل بنفسها لا تابعة، فلا يمكن الرد بدونها ولا معها؛ ولو رضي البائع بقبوله كذلك لم يجز، لأنه منع لحق الشرع لاستلزامه الربا. والزيادة المنفصلة المتولدة بعد القبض، كالولد والثمرة واللبن وأرش الجناية، تمنع الرد عند الحنفية، لأن ردها مع الأصل ربح ما لم يضمن؛ وخالف الشافعي فعدّها كالكسب فلا تمنع الرد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7986} الزيادات التي لا تمنع الرد: المتصلة المتولدة، كالسمن والكبر، وعند الحنابلة الجنين قبل الوضع والثمرة قبل التأبير؛ وهي لا تمنع الرد في ظاهر رواية الحنفية، فإن رضي المشتري بردها مع الأصل، وإن أبى فله الأرش. والمنفصلة المتولدة قبل القبض، كالولد واللبن والثمر في بيع الشجر، لا تمنع الرد، لكن لا يرد الأصل وحده بل يرد الكل أو يرضى بالكل بجميع الثمن؛ والحنابلة يردون الأصل دون الزيادة فتبقى للمشتري. والمنفصلة غير المتولدة كالغلة والكسب لا تمنع الرد، ويسلمها المشتري بالضمان ⁦(الخراج بالضمان)⁩؛ وعند أبي حنيفة تبقى له بلا ثمن ولا تطيب له، وعند الصاحبين للبائع؛ وإن رضي بالعيب فلا تطيب له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7986}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7987}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7988} إن هلكت الزيادة: بآفة سماوية لم يتغير الحكم؛ وإن هلكت بفعل المشتري فللبائع الخيار بين القبول برد جميع الثمن والرفض برد النقصان؛ وإن هلكت بفعل أجنبي امتنع الرد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7988} المالكية: قسّم ابن رشد الزيادة إلى خمسة أوجه: زيادة لحوالة الأسواق لا توجب الخيار؛ زيادة في حالة المبيع لا توجب خيارا؛ زيادة في عين المبيع بنماء حادث فيه أو بشيء من جنسه كالولد فيه خلاف؛ زيادة مضافة من غير جنس المبيع كثمر النخل إذا ظهر عنده فلا خيار له، فإن شاء رد النخل وثمرها ما لم يطب ورجع بالعلاج، أو أمسك ولا شيء له؛ وزيادة أحدثها المشتري بصنعة كالصبغ والخياطة فيخير بين التمسك بالعيب مع أرشه أو الرد ويكون شريكا بقيمة الزيادة. وكيفية التقويم عند ابن غازي والحطاب تحتاج إلى تقويمين أو أربعة بحسب الحالة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7987}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7988}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7989} المانع العقدي ⁦(العيب الحادث)⁩: إذا تعيب المبيع عند المشتري بعيب حادث، سواء بفعله أو بآفة سماوية أو بفعل المبيع الحي، امتنع الرد وانتقل الموجب إلى الرجوع بالنقصان؛ لأن شرط الرد أن يكون المردود على الصفة التي قبض عليها، ولأن الرد يضر البائع إذ الحادث بعد القبض لا يضمنه. والحنفية والحنابلة في رواية لا يجعلون للمشتري حق الرد لأنه السبب في العجز عنه، والمالكية ومن الحنابلة في رواية يخيرون بين الإمساك بأرش القديم أو الرد مع أرش الحادث؛ والشافعية يسقط الرد قهرا، فإن لم يرض البائع بالمعيب ضم المشتري أرش الحادث، ويجب إعلام البائع على الفور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7989} انتهاء الخيار وسقوطه: ينتهي بانتهاء العقد بفسخه، أو بالإمساك مع الأرش، سواء بالقول الدال على الرضا أو بالتصرف الدال عليه؛ وقد يسقط بزوال العيب قبل الرد، كتدارك العيب في زمن يسير، كالأرض فيها بذر يتعهد البائع بتركه أو بالفراغ منه في زمن يسير، أو الدار فيها خلل يصلحه البائع، أو الأرض فيها دفين لا يضر تركه وقلعه يضر، فإن الخيار يسقط؛ وكذلك إذا نعل المشتري الدابة فلو نزع النعل تعيبت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7990} وجوب ترك الرد لمصلحة: إذا كانت المصلحة في إمساك المعيب والعاقد مقيد التصرف، كالمشتري المفلس لأن الرد يفوت الفرق على الغرماء، والولي الذي اشترى لموليه لأن الرد تصرف ضار بحقه، ومن يعمل مضاربا ولم يصرح المالك بطلب الرد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7991} إسقاط الخيار: يصح عند الحنفية إسقاط خيار العيب بالصريح، لأنه حق خالص للمشتري، بخلاف خيار الرؤية؛ ويصح إسقاط حق الأرش وإبراء البائع من العيب. وعند الشافعية لا يسقط الخيار بعوض، لأنه خيار فسخ فأشبه خيار التروي في كونه غير متقوم، وليس الأرش عوضا عن ترك الخيار بل تقويم لنقصان الثمن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7991}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7992} الرضا بالعيب صراحة: كقول «رضيت بالعيب» أو «أسقطت خيار العيب» أو «أجزت العقد»، فينتهي الخيار جملة للرد والأرش، لأن حق الرد لفوات السلامة المشروطة دلالة، والرضا بالعيب بعد العلم به نزول عن الشرط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7992} التصرفات الدالة على الرضا: ثلاثة أنواع. الأول تصرفات الاستعمال والانتفاع دون إتلاف، كلبس الثوب وركوب الدابة ⁦(غير الرد أو السقي أو شراء العلف)⁩، والسقي والزرع والحصاد، وعرض المبيع للبيع أو الإجارة، ولو مرة، فهي دلالة على قصد الاستبقاء. والثاني الإتلاف كالتمزيق وقتل الدابة، فيسقط به الخيار. والثالث الإخراج عن الملك بعقد تمليك كالبيع والهبة مع التسليم والصلح، فيتعذر الرد إلى البائع لتعلق حق المشتري الثاني، ولا يرجع بالنقصان لأن امتناع الرد من قبل المشتري. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7992}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7993} اتجاهات الفقهاء في التصرفات: الحنفية والحنابلة يرون أن التصرف الناقل ولو كان غير عالم بالعيب يمنع الرد وينقل إلى الموجب الخلفي، والمالكية إن كان بعوض فيسقط الرد والأرش، وإن كان بغير عوض فله نقصان الثمن؛ والشافعية يفرقون بين تصرف يائس من عودة المبيع ⁦(كالوقف)⁩ فيمنع الرد، وتصرف يرجى معه العود ⁦(كالبيع)⁩ فيسقط الخيار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7993} إثبات العيب والاختلاف فيه: تقع الدعوى والخصومة بين العاقدين في مسائل العيب من قدم وحدوث وفي سبب الرد، وللمالكية والشافعية تفصيلات تخضع لطرائق الإثبات العامة بعد تصور المدعي والمنكر، وذكر الحنابلة أن العيب الذي لا يحتمل إلا قول أحدهما، كالجرح الطري إذا ادعى المشتري قدمه، فالقول قول من يدعيه بغير يمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7994} انتقال خيار العيب: اتفق الفقهاء على أنه ينتقل إلى الوارث بموت مستحق الخيار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7994}'
  en: 'Khiyar al-ayb (option of defect) is a compound of ''option'' and ''defect''. The majority use this name; the Malikis usually call it the option of deficiency (khiyar al-naqisa). Ibn Nujaym and Ibn al-Humam define a defect as what the sound natural state lacks, so as to count as deficient; Ibn Rushd as what falls short of the natural creation or the lawful form, with a real effect on the price; al-Ghazali as any disliked attribute whose absence customarily is assumed for the thing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7959} Lawfulness of return for defect: the jurists agree in general that a defective thing may be returned. They cite the Qur''an, that trade must be by mutual consent (Surah al-Nisa, 4:29), since knowledge of a defect means the consent is not full; and the Sunnah: the report of Aisha about a man who bought a slave, used him, found a defect and returned him, and the Prophet''s ruling that the yield goes with the liability. Al-Kasani also cites the hadith of the sheep with its udder held full, and argues by analogy that the buyer pays a price for a sound thing and does not get it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7959}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7960} Duty of the seller to disclose: the seller must tell the buyer of a defect that gives the option. Not mentioning a defect that gives no option is not forbidden deceit, in the view of Imam al-Haramayn. The majority hold that disclosure is obligatory, and whoever hides a defect is sinful, a matter on which there is no dispute according to Ibn Qudama and al-Subki. Ibn Rushd counts it as eating wealth falsely. The sources cited include the hadith of Uqba ibn Amir that a Muslim sells to his brother only with the defect shown, the hadith of Wathila ibn al-Asqa'' against selling without explaining what is in it, and the saying «whoever cheats us is not of us», from the heap of grain that the Prophet found wet. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7960}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} Concealment and the validity of the sale: a sale that conceals a defect giving the option is valid though sinful, according to most jurists, since the prohibition is on concealment, not on the contract. If the buyer learns of the defect after buying and accepts it, the seller is still at fault and the sale holds, as al-Shawkani holds. The Companions'' practice included Ibn Umar buying camels with mange, and accepting them when told of it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} Duty on others than the contracting party: the duty to disclose is not limited to the seller but extends to anyone who knows of the defect, on the report of Wathila and the many texts on giving counsel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} Timing of the disclosure: a seller or a third party who knows of a defect should disclose it before the sale, so that the buyer may refrain; if the third party is not present, or cannot, then after the sale, so that the buyer may return the thing. The duty is strongest when only a third party knows. The purpose of the option is to remove harm from the buyer: a sale implies a sound object, and when soundness fails through a defect the buyer has the choice, because consent is part of the sale''s nature. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7962}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7963} Three conditions for the option of defect: a real defect must appear; the buyer must not have known of it at the contract; and the seller must not have stipulated release from defects. A defect counts when it lowers value or defeats a valid purpose, and when soundness in that respect is the normal state of that kind of thing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7963}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7964} Definitions: the Hanafis take any thing that lowers value in the eyes of experts, whether or not the substance is reduced; a grave defect in a dowry moves it from good to middling to poor quality. The Shafiis take a defect that lowers value or substance so that a valid purpose is lost, when the usual state of such things is free of it; the Hanbalis count loss of substance even where value rises, and loss of value even where substance is unchanged. The Malikis count a house where someone was killed as defective, since people shun it and its price falls. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7963}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7964}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7965} Normal state: the freedom from the defect must be the normal state of the kind of thing. What is common in such things is not a defect; for instance a usual sediment in oil. Experts decide: merchants for goods, craftsmen for crafted things. The Hanafis require the agreement of experts (if they disagree, there is no right of return); the majority of the Shafiis accept one expert, and the author of al-Tatimma requires two. If the two disagree and no other authority is available, the seller''s word stands with his oath. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7965} Conditions of effect: the defect must be in the object itself, not in the other party, a pledge, or a guarantor. It must be old, that is present at the contract or arising before receipt; a defect that arises after receipt gives no option, though the Malikis apply the rule of warranty (three days for slaves; a year for madness, leprosy and vitiligo). The Hanafis make an exception for leasing, which is annulled by a new defect, since leasing is a contract of benefits that accrue gradually. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7966} The buyer''s own act: a defect caused by the buyer before receipt gives no option, in the Shafii view. The defect must remain after delivery and until return: if it disappears before the buyer returns the thing, the right to return lapses. The Hanafis and Shafiis require that the buyer prove the defect is present with him, since a defect present with the seller may be removed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7966}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7967} Removable defects: no option where the defect can be removed without hardship, such as a maker''s stamp on cloth that washing does not harm, or stain on a garment that washing removes. If the seller minimised the defect and the buyer accepted it, the Malikis grant the buyer the right to return unless a new defect has arisen; then he may choose between return and compensation (arsh), as in a legal opinion by al-Wansharisi about a beast wounded by a spear. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7967}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7968} Proof of defects by how visible they are: a visible defect needs no proof beyond the buyer''s sight, and he may sue the seller. A hidden defect known only to experts (such as pain in the liver or spleen) is proven by two Muslim men or one just man of expertise. A defect only women see is proven by the word of one just woman, two being safer; in the Hanafi view it proves the claim but not return. A defect known only by trial, such as a slave who absconds, needs two men or a man and two women. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7968} The seller''s oath: if the buyer cannot prove the defect was with the seller, the two companions of Abu Hanifa have the seller sworn; Abu Hanifa does not. If the defect may occur in the buyer''s hand, the oath is absolute (a definite oath); if the seller only knows of another''s act, he swears on knowledge. If the seller refuses to swear, the defect is established against him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7968}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7969} Knowledge of the defect: the buyer must be unaware of the defect. If he knew it at the contract or at receipt he has no option, since by buying or taking the thing with knowledge he consents in effect. A defect that is obvious and that anyone would see counts as known, and so does a defect the seller pointed out. Where the seller said that a thing is faulty as a condition of sale, as with a bull sold on condition that it sleeps in the plough, the seller is free of blame. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7969} A buyer who knows of a thing that is a defect without knowing it is one: if he takes it and only later learns that it is a defect, the question is whether the defect is plain. A plain defect that anyone sees gives no right to return; a defect that only experts know gives the right. Likewise a buyer who knows a coin is false, but not how many are false, has not consented to the defect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7970} The release from defects: the option is lost if the seller stipulates release. A release is valid in the Hanafi view whether the defect was known or unknown to the seller and whatever the thing; Malik and al-Shafii allow it only for animals. Such a sale with release is a special type called the sale of release. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7970}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7971} Origin and the views: the report of Ibn Umar, who sold a slave with release and was challenged over a hidden illness; Uthman ordered him to swear he did not know of it, and he refused, took the slave back, and later sold him for more. The jurists differ on the release: release from all defects whether known or not (Abu Hanifa, Abu Thawr, from Ibn Umar and Zayd); no release unless the defect is named (Ibn Abi Layla, al-Thawri); no release unless the buyer has seen it (some Shafiis, Shurayh, Ata, a report of Ahmad and Ishaq); release only from hidden defects in animals (Malik, and the apparent view of al-Shafii); a release only in a sale of spoils, of a bankrupt, or in debt payment; or a voiding of the sale altogether, a Shafii view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7971}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7972} Kinds of release: particular (of a named defect) or general (of all defects). If it refers to a defect existing at the contract, it covers only that. If it refers to a future defect arising before receipt, the condition is void and the sale invalid. If unqualified, Abu Hanifa and Abu Yusuf take it to cover defects at the contract and until receipt; Malik, Muhammad, Zufar and al-Hasan ibn Ziyad limit it to defects at the contract. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7972} Contracts that take the option of defect (Hanafi list): sale and purchase (the valid sale, not the void one, and including exchange of money); leasing, which takes it whether the defect is old or new, and where the lessee may return before and after receipt; division; settlement on property; the dowry; the compensation of khul''; and the settlement for willful blood. For these, return is only for a grave defect, not a slight one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7972}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7973} Ibn Rushd: contracts divide into three: those meant for exchange, which take the option without dispute; those not meant for exchange, such as a gift without return, which do not; and mixed contracts, such as a gift with intent of return, which he thinks do not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7973} Timing of the return: three views. (1) Immediately, meaning as soon as custom allows; whoever knows and does not return loses the right and bears the loss without arsh, the Shafii view and one of Ahmad. The Hanafi al-Hawi also holds this; Ibn Nujaym calls it strange, and the Hanafi view taken is that the option lasts. (2) Delayed, as long as no sign of consent appears, the view of the Hanafis (as relied on) and a sound Hanbali report. (3) A day or two, the Maliki view, where continued possession after that counts as consent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7974}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7975} Effect on the contract''s rule: the defect does not stop the transfer of ownership: the buyer owns the thing at once and the seller owns the price, since the sale is absolute in its pillars. The implied condition of soundness only stops the contract from being binding, not its basic effect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7975}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7976} What the buyer may choose: three views. (1) Hanafis and Shafiis: return against full price, or keep the thing for the full price with no arsh; arsh only if return is impossible. (2) Ahmad and Ishaq: return, or keep with arsh, even when return is possible; but if keeping with arsh leads to ribā, keeping is free. (3) Malikis: a grave defect allows return or keeping free; a slight defect in land means arsh only, and in goods return, by the apparent view of the Mudawwana. The source of the dispute: whether the defect reduces the substance or the attribute. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7976}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7977} Conditions of return: the option must still exist; the thing returned must be as received, without a further defect such as a defect of partnership arising from split of the deal; and the deal must not be split before the whole thing is received, unless the seller accepts, since then it is damage the seller accepts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7977} Splitting the deal: when a thing is one deal, the buyer may not return part of it for a defect by compulsion, unless the rest is the seller''s, in which case the part may be returned by compulsion; this is the view the judge relies on, since the valid reason is the harm of splitting the deal on the seller. Before the whole thing is received, the deal may not be split, whether the thing is one (cloth, a house), a measure in containers, two things in fact or one in account (like the two leaves of a door). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7978} The Malikis: if the sound part is lost, the buyer may return the defective part with its share of the price; if the sound part remains, he may return part by its share only if the defective part is not more than half, and the defect is not the purpose of the deal; otherwise he returns all or keeps all. The Hanbalis forbid return by splitting in one thing, and in two things that lose value when split; the Shafiis do not allow returning part, though al-Qadi Husayn allowed it where there is no split on the seller. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7978}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7979} Splitting by plurality of parties: when two buyers buy one thing and find a defect, one may return it alone according to Abu Yusuf and Muhammad; Abu Hanifa says no, since the return would not be of the thing as received (a new defect of partnership). The Shafiis and Hanbalis distinguish a plural deal (several sellers or buyers, or price stated per part) from a single one: the first allows return of one share; if one seller is absent, the buyer returns the present seller''s share by its price share. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7979}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7980} Knowledge and consent: the Hanafis require the other party to know of the return, whether before or after receipt; a return without his knowledge is suspended, and the deal binds if the term lapses. The Shafiis and Hanbalis require neither knowledge, consent, nor a judge''s ruling. Before receipt the Hanafis need neither consent nor judgement; after receipt they need one of them, because the deal is complete on receipt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7980}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7981} Nature of the return and its effect on resale: in Hanafi terms, a return by consent after receipt is a rescission between the parties but a new sale as against others; a return by judgement annuls for all. The effect appears in a chain of sales: if the second buyer''s return was accepted by judgement, he may return to his seller; if by consent, he may not, because it is a new sale for the third party. Before receipt, the first buyer may return to the first seller in all cases. Ibn Qudama holds that a buyer who knew of the defect, or showed consent, may not return it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7981}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7982}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7983} Keeping with arsh: when a return is impossible through increase, change or disposal, the buyer''s right passes from return to compensation of the price, called the substitute right. This is the Hanafi and Shafii view; the Malikis have three kinds of defect (slight, with nothing due; grave, with return or free keeping; and medium, with compensation of the price); the Hanbalis let the buyer choose between keeping with the price reduction and return even when return is possible. Arsh is found by valuing the thing sound, then with the defect, and taking the proportion of the difference to the value and applying it to the price. The author of al-Ashbah holds that the value is taken on the day of the contract; al-Hasan al-Basri and Ahmad take the value at purchase. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7983}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7984} Obstacles to return: natural, legal and contractual. Destruction in the seller''s hand prevents return, and the seller claims no price from the buyer. Destruction after receipt by a heavenly cause prevents return, leaving the price reduction. Consumption by the buyer through lawful use (eating food, wearing cloth until torn) also prevents return; Abu Hanifa differs from his two companions here, who hold it an obstacle to return but not to arsh. The Hanbalis distinguish whether the seller concealed the defect: if he did, the buyer may claim the whole price; the Malikis give the whole price only when the concealed defect itself caused the loss. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7985} Legal obstacles to return: a connected increase that is not generated from the thing (dyeing, sewing, building, planting) bars return whether before or after receipt, because it is a thing in itself and not a subordinate part; the seller''s consent does not allow it, since it would be riba. A separated increase generated after receipt (offspring, fruit, milk, compensation for an injury) bars return in the Hanafi view, since returning it with the thing is profit on what was not guaranteed; al-Shafii counts it as earnings and does not let it bar return. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7986} Increases that do not bar return: a connected generated increase (growth, fattening; for the Hanbalis the unborn young before birth and the fruit before pollination) does not bar return in the apparent Hanafi report, unless the buyer refuses to return it with the thing, in which case he takes the arsh; Muhammad differs. A separated generated increase before receipt (offspring, milk, fruit on trees) does not bar return, but the thing may not be returned alone: the buyer returns all or keeps all at the full price; the Hanbalis return the thing alone and the increase stays with the buyer. A separated non-generated increase (rent, earnings) does not bar return, and the buyer keeps it by the rule that the yield goes with liability; in the Hanafi view he keeps it without price but not in good conscience, and the two companions give it to the seller; if he chooses to keep the thing, the increase is not good for him (not lawful in the sense of clean gain). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7986}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7987}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7988} If the increase perishes: by a heavenly cause the rule does not change; by the buyer''s act the seller may accept the thing with the whole price, or refuse and take the lower price; by a third party''s act return is impossible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7988} The Malikis: Ibn Rushd gives five forms of increase. Growth from market change gives no option; an increase in the state of the thing gives none; growth within the thing or from its kind, such as offspring, is disputed; an added increase of another kind, like fruit that appears on a palm, gives no option, and the buyer returns the palm and its fruit before they ripen, with the cost of treatment, or keeps them with no return; an increase the buyer made by craft, such as dyeing or sewing, gives the option either to keep and claim the arsh or to return and become a partner in the value. Ibn Ghazi and al-Hattab describe valuations of two or four stages in these cases. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7987}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7988}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7989} Contractual obstacle (a new defect): if the thing is defective with a new defect in the buyer''s hand, by his act, by a heavenly cause, or by a living thing it harmed, the return of the defective thing is barred, and the substitute right to a price reduction takes its place, because the condition of return is that the thing be returned as received, and returning it would harm the seller who does not guarantee the new defect. The Hanafis and a Hanbali report give the buyer no right of return, since he caused the inability. The Malikis and another Hanbali report let him choose between keeping with the arsh of the old defect and return with the arsh of the new. The Shafiis hold that the right to return falls away automatically; if the seller does not accept the defective thing, the buyer adds the arsh of the new defect to it and returns it, or pays the arsh of the old defect and keeps it, and must notify the seller promptly. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7989} Ending the option: by the return (or by keeping with arsh) and by acts that show consent; also by removal of the defect before return, if done quickly and without harm to the buyer. Ibn Hajar''s examples: land with seed that the seller undertakes to remove quickly; a house with a roof fault that the seller repairs; land with buried stone whose leaving does no harm but whose removal does; and a shod animal, whose shoe, if removed, would worsen the defect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7990} Duty to refrain from return for the public interest: where keeping the defective thing is the better course and the contracting party''s power is restricted: a bankrupt buyer, because return would take the creditors'' gain; a guardian buying for his ward in a case where buying is lawful, since return harms the ward; and a mudarib who did not get the owner''s order to return. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7991} Waiver: the Hanafis allow the buyer to waive the option of defect by express words, since it is his own right, unlike the option of sight, which is an option by law. A waiver for consideration is not allowed in the Shafii view: Ibn Hajar held that paying for the option to be surrendered is not valid, as it is an option of rescission, like the option of deliberation, which has no value. The arsh is not a payment for waiving the option but an assessment of the price loss. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7991}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7992} Express consent: words such as «I consent to the defect», «I waived the option of defect», «I approve the contract» end both the return and the arsh, since the right to return exists because the condition of soundness implied in the contract has failed, and consent to the defect means the buyer waived that condition. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7992} Acts of consent: three kinds. First, use without loss, such as wearing a garment, riding an animal (other than to return it, water it or buy fodder), irrigating, planting or harvesting land, or offering the thing for sale or lease, even once; these show a wish to keep the thing. Second, destroying the thing, such as tearing cloth or killing an animal, which ends the option. Third, taking the thing out of ownership by a transfer, such as sale, gift with delivery, or settlement; the return to the seller is then barred for the buyer, who is held responsible for the barrier, so he has no right to the arsh either. If he later gets the thing back by an option of condition or of sight, he may return it to the seller, by judgement or by consent before receipt, but not by consent after receipt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7992}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7993} Other views on acts of ownership: the Hanafis and Hanbalis hold that any transfer, even by a buyer ignorant of the defect, bars return and moves the right to the arsh. The Malikis say that a transfer with consideration ends both return and arsh, and without consideration leaves the arsh. The Shafiis distinguish a transfer that gives no hope of return, such as a waqf, which bars return, from one that leaves hope of return, such as a sale, which ends the option. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7993} Proof and dispute over the defect: claims arise between the parties over whether the defect is old or new and over the cause of return; the Malikis and Shafiis have details falling under the general methods of proof, and the Hanbalis record that where a defect can admit the word of only one side, such as a fresh wound the buyer claims to be old, the word is that of the claimant without an oath. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7994} The option of defect passes to the heir on the death of the one entitled, by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7994}'
  ur: 'خیار العیب: «خیار» اور «عیب» سے مرکب اضافی ہے؛ جمہور یہی نام لیتے ہیں اور مالکیہ اسے عموماً خیار النقیصہ کہتے ہیں۔ ابن نجیم اور ابن الہمام کے نزدیک عیب وہ ہے جس سے سلیم فطرت خالی ہو اور اس کی وجہ سے چیز ناقص شمار ہو؛ ابن رشد کے نزدیک جو خلقتِ طبیعی یا شرعی خلق سے کم ہو اور قیمت پر اثر ڈالے؛ غزالی کے نزدیک ہر مذموم وصف جس کی غیر موجودگی عرف میں عموماً فرض کی جاتی ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7959} عیب کی بنا پر رد کی مشروعیت: فقہاء کے درمیان اجمالاً اس پر اتفاق ہے۔ قرآن سے سورۃ النساء (4:29) کی آیت «تجارة عن تراض» سے استدلال ہے کیونکہ عیب کا علم رضامندی کو ناقص کرتا ہے؛ سنت سے عائشہ کی حدیث ہے جس میں غلام کا غلہ ⁦(کمائی)⁩ «الغلة بالضمان» کے اصول پر مالک کو ملتا ہے۔ کاسانی مصراۃ کی حدیث سے بھی استدلال کرتے ہیں، اور قیاس یہ ہے کہ مشتری نے ثمن اس لیے دیا کہ سالم چیز ملے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7959}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7960} بائع پر عیب بتانے کا وجوب: جس عیب سے خیار ثابت ہو اس کا بتانا واجب ہے؛ جو عیب خیار نہ دے اس کا ذکر نہ کرنا امام الحرمین کے نزدیک حرام دھوکہ نہیں۔ جمہور کے نزدیک بتانا واجب ہے اور چھپانے والا گناہ گار ہے، اس پر ابن قدامہ اور سبکی کے مطابق اختلاف نہیں۔ دلیل میں عقبہ بن عامر کی حدیث «المسلم أخو المسلم» اور واثلہ بن الأسقع کی حدیث، اور «من غشنا فليس منا» جو غلے کے ڈھیر کے واقعے سے ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7960}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} کتمان کا بیع کی صحت پر اثر: خیار دینے والا عیب چھپا کر بیچنا جمہور کے نزدیک گناہ کے ساتھ صحیح ہے، کیونکہ نہی کتمان پر ہے نہ کہ عقد پر۔ اگر مشتری خرید کے بعد عیب جان کر راضی ہو جائے تو بائع پر گناہ ہے اور بیع صحیح ہے، جیسا کہ شوکانی نے جزم کیا۔ صحابہ کے عمل میں ابن عمر کا خارشی اونٹ خریدنا اور بتانے پر قبول کر لینا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} غیر عاقد پر وجوب: یہ وجوب صرف بائع پر نہیں بلکہ ہر اس شخص پر ہے جو عیب جانتا ہو، واثلہ کی حدیث اور نصیحت کے وجوب کے بارے میں متعدد نصوص کی بنا پر۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} عیب بتانے کا وقت: بیع سے پہلے بتانا چاہیے تاکہ مشتری رک جائے، اور اگر اجنبی موجود نہ ہو یا میسر نہ ہو تو بعد میں تاکہ مشتری واپس کر سکے؛ جب صرف اجنبی کو علم ہو تو وجوب زیادہ مؤکد ہے۔ خیار عیب کی حکمت مشتری سے ضرر دور کرنا ہے، کیونکہ بیع سالم چیز کا تقاضا کرتی ہے، اور عیب سے سلامت کا وصف جاتا رہے تو اختیار ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7962}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7963} خیار عیب کی تین شرطیں: معتبر عیب کا ظاہر ہونا؛ عقد کے وقت مشتری کو عیب کا علم نہ ہونا؛ اور بائع نے عیب سے بری ہونے کی شرط نہ لگائی ہو۔ عیب اس وقت معتبر ہوتا ہے جب قیمت میں کمی کرے یا صحیح غرض فوت کرے، اور اس جنس میں سلامت اصل ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7963}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7964} حنفیہ کا ضابطہ: ہر وہ چیز جو اہل خبرہ کے نزدیک قیمت میں کمی کرے، خواہ عین میں کمی ہو یا نہ ہو۔ شافعیہ کے نزدیک جو قیمت یا عین میں ایسی کمی کرے کہ صحیح غرض فوت ہو اور ایسی چیزوں میں عام طور پر یہ عیب نہ ہوتا ہو۔ حنابلہ عین کی کمی کو کافی سمجھتے ہیں اگرچہ قیمت بڑھ جائے، اور مالکیہ اس گھر کو عیب مانتے ہیں جس میں قتل ہوا ہو کیونکہ لوگ اسے ناپسند کرتے ہیں اور قیمت گرتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7963}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7964}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7965} اصل سلامت: اس جنس کی عام حالت سلامت ہونی چاہیے؛ جو ان چیزوں میں معمول ہو وہ عیب نہیں، جیسے تیل میں معمول کی تلچھٹ۔ اہل خبرہ فیصلہ کرتے ہیں، کاسانی کے نزدیک تاجروں کا عرف معتبر ہے۔ حنفیہ کے نزدیک اہل خبرہ کا اتفاق شرط ہے، اختلاف میں رد نہیں؛ شافعیہ کے نزدیک جمہور ایک کا قول کافی سمجھتے ہیں۔ اختلاف ہو تو بائع کا قول اس کی قسم کے ساتھ معتبر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7965} تاثیر کی شرائط: عیب خود مبیع میں ہو، عاقد دوسرے یا رہن و ضامن میں نہ ہو؛ قدیم ہو، یعنی عقد کے وقت یا قبض سے پہلے موجود ہو؛ قبض کے بعد پیدا ہونے والا عیب خیار نہیں دیتا، اگرچہ مالکیہ عہدہ کا اصول اپناتے ہیں ⁦(غلام میں تین دن، جنون، جذام اور برص میں ایک سال)⁩۔ حنفیہ اجارے میں استثنا کرتے ہیں کیونکہ وہ منافع کا عقد ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7966} مشتری کا اپنا فعل: قبض سے پہلے مشتری کے فعل سے عیب ہو تو شافعیہ کے نزدیک خیار نہیں۔ عیب قبض کے بعد رد تک باقی رہنا چاہیے؛ اگر رد سے پہلے زائل ہو جائے تو رد کا حق نہیں رہتا۔ حنفیہ اور شافعیہ کے نزدیک مشتری کے ہاتھ میں عیب کا ثبوت ضروری ہے، کیونکہ بائع کے پاس عیب زائل ہونے کا احتمال ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7966}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7967} قابل ازالہ عیب: جو بغیر مشقت دور ہو سکے، جیسے کپڑے پر بنانے والی کمپنی کا نشان جو دھونے سے نہ جاتا ہو مگر دھونے سے نقصان نہ پہنچے، یا کپڑے کی نجاست جو دھونے سے زائل ہو۔ اگر بائع نے عیب کو معمولی بتایا اور مشتری راضی ہو گیا، تو مالکیہ کے نزدیک رد کا حق باقی رہتا ہے جب تک نیا عیب پیدا نہ ہو، اور تب مشتری رد یا ارش کے درمیان اختیار رکھتا ہے ⁦(ونشریسی کا فتویٰ نیزے کے زخم والے جانور کے بارے میں)⁩۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7967}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7968} عیب کے ثبوت کے طریقے: ظاہر عیب کے لیے بینہ کی ضرورت نہیں اور مشتری بائع سے خصومت کر سکتا ہے؛ باطن عیب جو صرف ماہرین جانیں ⁦(جیسے جگر یا تلی کا درد)⁩ دو مسلمان مردوں یا ایک عادل ماہر سے ثابت ہوتا ہے؛ جو صرف عورتیں دیکھ سکیں اس میں ایک عادل عورت کا قول کافی ہے، دو زیادہ محتاط ہیں، اور حنفیہ کے نزدیک یہ خصومت کے لیے ہے، رد کے لیے نہیں؛ جو صرف تجربے سے معلوم ہو، جیسے بھاگ جانے والا غلام، اس کے لیے دو مرد یا ایک مرد اور دو عورتیں درکار ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7968} بائع کی قسم: اگر مشتری ثابت نہ کر سکے کہ عیب بائع کے پاس تھا تو صاحبین بائع کو قسم دینے کے قائل ہیں، ابو حنیفہ نہیں۔ اگر عیب مشتری کے ہاتھ میں بھی پیدا ہو سکتا ہو تو قسم قطعی ⁦(علی البتات)⁩ ہوگی، اور اگر بائع کا اپنا فعل نہ ہو تو علم کی قسم کھائے گا؛ انکار کرے تو عیب اس کے خلاف ثابت ہو جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7968}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7969} مشتری کا علم: مشتری کو عیب کا علم نہ ہو۔ عقد یا قبض کے وقت علم ہو تو خیار نہیں، کیونکہ علم کے ساتھ خریدنا یا لینا رضامندی کے مترادف ہے۔ واضح عیب جو دیکھنے سے نمایاں ہو، اور وہ عیب جس کی طرف بائع نے اشارہ کر دیا ہو، معلوم سمجھے جاتے ہیں۔ جیسے بیل کو اس شرط پر بیچنا کہ وہ ہل میں سوتا ہے، تو بائع بری ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7969} خریدار کا علم، مگر یہ معلوم نہ ہونا کہ یہ عیب ہے: اگر خریدار کسی ایسی چیز کو جانتا ہو جو معتبر عیب ہے، لیکن اسے عیب نہ جانتا ہو، پھر قبضہ کرے اور بعد میں علم ہو، تو دیکھا جائے گا کہ عیب کھلا ہے یا نہیں؛ کھلا عیب جو سب دیکھیں اس کا رد نہیں، اور جو صرف اہل خبرہ جانیں اس کا رد ہے۔ اسی طرح جو کھوٹا سکہ جانتا ہو مگر تعداد نہ جانتا ہو، اس نے پورے عیب پر رضامندی نہیں دی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7970} بری کرنے کی شرط: بائع نے عیب سے بری ہونے کی شرط لگائی ہو تو خیار قائم نہیں رہتا۔ حنفیہ کے نزدیک یہ براءت مطلق جائز ہے، عیب معلوم ہو یا مجہول؛ امام مالک اور شافعی نے اسے جانور کے ساتھ خاص کیا، کیونکہ جانور شاذ ہی عیب سے خالی ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7970}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7971} براءت کی اصل: عبداللہ بن عمر کا غلام بیچنا برأت کے ساتھ، اور مشتری کا پوشیدہ بیماری کا دعویٰ، پھر عثمان کا قسم کا حکم، ابن عمر کا انکار اور غلام واپس لے کر بعد میں زیادہ قیمت پر بیچنا۔ علماء کے مذاہب مختلف ہیں: ہر عیب سے بری، خواہ بائع کو معلوم ہو یا نہ ⁦(ابو حنیفہ، ابو ثور)⁩؛ جب تک عیب کا نام نہ لے بری نہیں ⁦(ابن ابی لیلیٰ، ثوری)⁩؛ جب تک ہاتھ نہ رکھے ⁦(شریح، عطاء، احمد کی ایک روایت، اسحاق)⁩؛ جانور کے باطن عیب سے ہی بری ⁦(مالک، شافعی کا ظاہر قول)⁩؛ غنیمت، مفلس یا قرض کی ادائیگی کی فروخت میں؛ یا بیع باطل ⁦(شافعیہ کا ایک قول)⁩۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7971}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7972} براءت کی اقسام: خاص ⁦(کسی معین عیب سے)⁩ یا عام ⁦(ہر عیب سے)⁩۔ اضافت کے لحاظ سے: موجودہ عیب پر مقید ہو تو قبض سے پہلے کے حادث عیب کو شامل نہیں؛ مستقبل کے حادث عیب پر ہو تو شرط باطل اور عقد فاسد؛ مطلق ہو تو ابو حنیفہ اور ابو یوسف کے نزدیک عقد کے وقت اور قبض تک کے عیوب کو شامل ہے، اور مالک، محمد، زفر اور حسن بن زیاد کے نزدیک صرف موجودہ عیب کو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7972} خیار عیب کے عقود ⁦(حنفیہ)⁩: بیع و شراء ⁦(صحیح بیع، صرف سمیت)⁩، اجارہ ⁦(قدیم یا حادث عیب سے خیار ثابت، قبض سے پہلے اور بعد میں صاحب خیار رد کر سکتا ہے)⁩، قسمت، مال کا صلح، مہر، بدلِ خلع، اور بدلِ صلح عن دم العمد ⁦(رد صرف فاحش عیب پر)⁩۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7972}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7973} ابن رشد کا ضابطہ: عقود تین قسم کے ہیں: معاوضے کے عقد جن میں خیار عیب بلاشبہ ہے؛ غیر معاوضہ عقد جیسے بلا عوض ہبہ اور صدقہ جن میں نہیں؛ اور ملے جلے عقد جیسے عوض کی نیت سے ہبہ، جن میں ابن رشد کے نزدیک اظہر یہ ہے کہ خیار نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7973} رد کا وقت: تین اتجاہات ہیں۔ (1) فوراً، یعنی عادت کے مطابق جلدی؛ جو جان کر بھی رد نہ کرے اس کا حق ساقط ہے اور نقصان اس کا ہے، بغیر ارش۔ یہ شافعیہ اور احمد کی ایک روایت ہے؛ صاحب الحاوی حنفی بھی اسی کے قائل ہیں، اور ابن نجیم اسے غریب کہتے ہیں۔ (2) تاخیر کے ساتھ، جب تک رضامندی کا کوئی ثبوت نہ ہو، یہ حنفیہ کے معتمد اور حنابلہ کی صحیح روایت ہے۔ (3) ایک یا دو دن، یہ مالکیہ کا قول ہے، جس کے بعد قبضہ رضا شمار ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7974}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7975} عیب کا عقد کے حکم پر اثر: عیب ملکیت کی منتقلی سے نہیں روکتا؛ مبیع کی ملک مشتری کو فوراً اور ثمن کی ملک بائع کو فوراً ملتی ہے، کیونکہ بیع کا رکن شرط سے مطلق ہے۔ سلامت کی شرط صرف لزوم کو روکتی ہے، اصل حکم کو نہیں؛ اس لیے عیب والا عقد غیر لازم ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7975}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7976} مشتری کا اختیار: تین اتجاہات ہیں۔ (1) حنفیہ اور شافعیہ کے نزدیک رد اور پورے ثمن کے ساتھ اسے رکھنا، ارش نہیں، سوائے اس کے کہ رد ممکن نہ ہو۔ (2) احمد اور اسحاق کے نزدیک رد یا ارش کے ساتھ رکھنا؛ اور جہاں ارش ربا کی طرف لے جائے وہاں مفت رکھنا۔ (3) مالکیہ کے نزدیک کثیر عیب میں رد یا مفت رکھنا؛ متوسط عیب میں غیر منقول میں ارش، اور منقول میں مدونہ کے ظاہر قول کے مطابق رد۔ اختلاف کی بنیاد یہ ہے کہ عیب اصل میں نقص ہے یا وصف میں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7976}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7977} رد کی شرائط: خیار کا موجود ہونا؛ جو چیز لوٹائی جائے وہ اسی وصف پر ہو جس پر قبضہ ہوا، اس میں کوئی نیا عیب نہ ہو؛ اور قبضِ کل سے پہلے صفقہ کی تفریق نہ ہو، الا یہ کہ بائع راضی ہو، کیونکہ ایسا نقصان اس کی طرف سے مرضی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7977} عقد کی تفریق: اگر مبیع ایک صفقہ ہو تو مشتری عیب کی وجہ سے اس کا بعض جبراً واپس نہیں کر سکتا، الا یہ کہ باقی بائع کا ہو تو بعض جبراً واپس ہو سکتا ہے؛ قاضی اور ان کے پیروکاروں کا یہی معتمد قول ہے، کیونکہ اصل علت بائع پر تقسیم کا ضرر ہے۔ قبضِ کل سے پہلے صفقہ کی تفریق جائز نہیں، خواہ ایک چیز ہو، یا پیمانے یا وزن کی چیز برتنوں میں، یا دو چیزیں حقیقتاً یا تقدیراً ایک۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7978} مالکیہ: اگر سالم حصہ ضائع ہو جائے تو مشتری معیب کو مطلقاً واپس کرے اور اپنا حصہ ثمن سے لے؛ اگر سالم حصہ باقی ہو تو بعض کو اس کے حصے سے واپس کرنا دو شرطوں کے ساتھ جائز ہے: معیب حصہ نصف سے زیادہ نہ ہو، اور معیب عقد کا مقصد نہ ہو؛ ورنہ سب واپس کرے یا سب رکھے۔ حنابلہ ایک چیز میں اور ان دو چیزوں میں جن کی تفریق سے نقصان ہو، تفریق کی واپسی منع کرتے ہیں؛ شافعیہ بعض کی واپسی جائز نہیں مانتے، سوائے قاضی حسین کے قول کے کہ بائع پر تبعیض نہ ہو تو جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7978}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7979} متعدد عاقدین کی تفریق: اگر دو خریدار ایک چیز خریدیں اور عیب پائیں تو ابو یوسف اور محمد کے نزدیک ایک اکیلا رد کر سکتا ہے؛ ابو حنیفہ کہتے ہیں نہیں، کیونکہ عیبِ شرکت زائد ہے۔ شافعیہ اور حنابلہ متعدد عقد ⁦(کئی بائع یا کئی مشتری، یا قیمت الگ الگ ہو)⁩ اور واحد عقد میں فرق کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7979}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7980} دوسرے عاقد کا علم اور رضا: حنفیہ کے نزدیک فسخ کا علم ضروری ہے، قبض سے پہلے یا بعد؛ بغیر علم کے فسخ موقوف رہتا ہے اور مدت گزرے تو عقد لازم ہو جاتا ہے۔ شافعیہ اور حنابلہ نہ علم، نہ رضا، نہ حاکم کا فیصلہ شرط مانتے ہیں۔ حنفیہ کے نزدیک قبض سے پہلے رد کے لیے نہ رضا ضروری ہے نہ قضا، اور قبض کے بعد دونوں میں سے ایک ضروری ہے کیونکہ صفقہ قبض سے مکمل ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7980}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7981} رد کی نوعیت اور زنجیرِ بیع پر اثر: حنفیہ کے نزدیک قبض کے بعد باہمی رضامندی سے رد عاقدین کے درمیان فسخ ہے مگر تیسرے کے حق میں نیا بیع ہے؛ قضا سے رد دونوں اور تیسرے کے حق میں فسخ ہے۔ دوسرے بائع کا قضا سے رد قبول کرنا ہو تو وہ اپنے پہلے بائع کو رد کر سکتا ہے، اور تراضی سے ہو تو نہیں۔ قبض سے پہلے پہلا مشتری ہر صورت میں پہلے بائع کو رد کر سکتا ہے۔ ابن قدامہ کے نزدیک جو عیب جانتا ہو یا رضا ظاہر کر چکا ہو وہ رد نہیں کر سکتا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7981}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7982}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7983} عیب کے ساتھ رکھنا اور ارش: جب زیادتی، تبدیلی یا تصرف کی وجہ سے رد ممکن نہ ہو تو مشتری کا حق رد سے نقصانِ ثمن کی طرف منتقل ہو جاتا ہے، جسے موجب خلفی کہتے ہیں؛ یہ حنفیہ اور شافعیہ کا مذہب ہے۔ مالکیہ عیب کو یسیر ⁦(کچھ نہیں)⁩، کثیر ⁦(رد)⁩ اور متوسط ⁦(قیمت کی کمی)⁩ میں تقسیم کرتے ہیں؛ حنابلہ رد اور نقصانِ ثمن کے ساتھ رکھنے کے درمیان اختیار دیتے ہیں، چاہے رد ممکن ہو۔ ارش کا طریقہ یہ ہے کہ چیز کو سالم قیمت دی جائے اور پھر معیب، فرق کی نسبت نکال کر ثمن پر لاگو کی جائے۔ قیمت عقد کے دن کی لی جائے ⁦(صاحب الاشباہ کی رائے)⁩، جبکہ حسن بصری اور احمد خرید کے دن کی قیمت کو لیتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7983}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7984} رد کی موانع: طبعی، شرعی اور عقدی۔ بائع کے ہاتھ میں ہلاکت رد سے مانع ہے، اور بائع مشتری سے کچھ نہیں لے گا۔ قبض کے بعد آسمانی آفت سے ہلاکت رد سے مانع ہے اور نقصانِ ثمن واجب ہے۔ جائز استعمال سے استہلاک، جیسے کھانا کھانا یا کپڑا پہننا یہاں تک کہ پھٹ جائے، بھی مانع ہے، اور ابو حنیفہ اپنے دونوں شاگردوں سے اس میں مختلف ہیں۔ حنابلہ تدلیس کے حساب سے فرق کرتے ہیں؛ مالکیہ کے نزدیک جب تدلیس والا عیب ہی ہلاکت کا سبب ہو تو پورا ثمن واپس ملے گا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7985} شرعی موانع: وہ متصل زیادتی جو اصل سے متولد نہ ہو، جیسے رنگائی، سلائی، عمارت اور درخت، قبض سے پہلے یا بعد دونوں صورتوں میں رد سے مانع ہے، کیونکہ یہ الگ چیز ہے نہ کہ تابع؛ بائع کی رضا سے بھی جائز نہیں، کیونکہ اس میں ربا لازم آتا ہے۔ قبض کے بعد پیدا ہونے والی منفصل زیادتی جیسے بچہ، پھل، دودھ اور جنایت کا ارش رد سے مانع ہے ⁦(حنفیہ)⁩، کیونکہ اصل کے ساتھ واپسی سے بائع کو وہ نفع ملے گا جس کی ضمانت نہ تھی؛ شافعیہ اسے کسب شمار کرتے ہیں اور مانع نہیں مانتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7986} زیادتیاں جو رد سے مانع نہیں: متصل متولدہ جیسے موٹاپا اور بڑھوتری؛ حنابلہ کے نزدیک پیٹ کا بچہ اور پھل کا تابیر سے پہلے کا حصہ؛ حنفیہ کی ظاہر روایت میں رد سے مانع نہیں، بشرطیکہ مشتری اصل کے ساتھ واپسی پر راضی ہو، ورنہ ارش ملے گا۔ منفصل متولدہ قبض سے پہلے، جیسے بچہ، دودھ، درخت کا پھل، رد سے مانع نہیں، مگر اصل تنہا واپس نہیں ہوتی؛ حنابلہ اصل تنہا واپس کرتے ہیں اور زیادتی مشتری کی رہتی ہے۔ منفصل غیر متولدہ، جیسے غلہ اور کمائی، رد سے مانع نہیں، اور «الخراج بالضمان» کے اصول پر مشتری کے پاس رہتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7986}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7987}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7988} زیادتی ہلاک ہو جائے: آسمانی آفت سے حکم نہیں بدلتا؛ مشتری کے فعل سے ہو تو بائع کو اختیار ہے کہ پورا ثمن دے کر قبول کرے یا انکار کرے اور نقصانِ ثمن لے؛ اجنبی کے فعل سے ہو تو رد ممتنع ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7988} مالکیہ: ابن رشد نے زیادتی کی پانچ صورتیں گنائی ہیں: بازار کے بھاؤ سے بڑھنا خیار نہیں دیتا؛ حالتِ مبیع میں زیادتی بھی نہیں؛ عین مبیع میں اس کی جنس کا اضافہ جیسے بچہ، اس پر اختلاف ہے؛ غیر جنس کا اضافہ جیسے کھجور کے درخت کا پھل جو خریدار کے پاس لگا، تو خیار نہیں، خریدار چاہے تو درخت اور پھل کو رد کرے جب تک پکا نہ ہو اور علاج کا خرچ لے، یا رکھ لے بغیر کچھ لیے؛ اور وہ زیادتی جو مشتری نے صنعت سے بڑھائی جیسے رنگ اور سلائی، تو مشتری کو اختیار ہے کہ رکھ کر عیب کا ارش لے، یا رد کرے اور زیادتی کی قیمت میں شریک بنے۔ ابن غازی اور الحطاب کے نزدیک قیمت کے تخمینے کی تفصیل دو یا چار مرحلوں میں ہوتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7987}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7988}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7989} عقدی مانع ⁦(نیا عیب)⁩: مشتری کے ہاتھ میں نیا عیب، خواہ اس کے فعل سے، آسمانی آفت سے، یا زندہ چیز کے نقصان سے ہو، تو معیب کا رد ممتنع ہو کر نقصانِ ثمن کا خلفی موجب باقی رہتا ہے، کیونکہ رد کی شرط یہ ہے کہ وہ اسی حالت میں واپس ہو جس میں قبضہ ہوا تھا۔ حنفیہ اور حنابلہ کی ایک روایت میں مشتری کو رد کا حق نہیں کیونکہ وہ خود عاجز ہوا۔ مالکیہ اور حنابلہ کی دوسری روایت میں مشتری قدیم عیب کے ارش کے ساتھ رکھنے اور نئے عیب کے ارش کے ساتھ رد میں اختیار رکھتا ہے۔ شافعیہ کے نزدیک رد جبراً ساقط ہو جاتا ہے، اور اگر بائع معیب قبول نہ کرے تو مشتری نیا عیب کا ارش ملا کر رد کرے یا قدیم کا ارش لے کر رکھ لے، اور بائع کو فوری اطلاع دینا ضروری ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7989} خیار کا ختم ہونا: عقد کے فسخ یا رکھ لینے کے ساتھ ارش لینے سے، قولی یا فعلی رضامندی سے؛ اور عیب کے زوال سے بھی، جیسے زمین میں بیج جسے بائع چند لمحوں میں ہٹا دے، یا گھر کی چھت کا نقص جسے بائع ٹھیک کرے، یا زمین میں دفینہ جس کا چھوڑنا نقصان نہ کرے اور نکالنا نقصان کرے؛ اور جانور کو نعل لگانا جس کے نکالنے سے عیب بڑھ جائے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7990} مصلحت کی بنا پر رد کا ترک واجب: جب معیب رکھنا بہتر ہو اور عاقد کا تصرف مقید ہو، جیسے مفلس خریدار ⁦(کیونکہ رد سے قرض خواہوں کا نفع جاتا ہے)⁩، ولی جو اپنے ولیہ کے لیے خریدے، اور مضارب جسے مالک نے رد کا حکم نہ دیا ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7991} خیار کا ترک ⁦(معافی)⁩: حنفیہ کے نزدیک صریح الفاظ سے خیار عیب ساقط کیا جا سکتا ہے، کیونکہ یہ مشتری کا خالص حق ہے، جبکہ خیار رؤیت صریح سے ساقط نہیں ہوتا؛ ارش کا حق بھی ساقط ہو سکتا ہے۔ شافعیہ کے نزدیک بدلے پر ترک جائز نہیں، کیونکہ یہ فسخ کا خیار ہے جیسے خیار تروّی غیر متقوم ہے؛ ارش ترک کا عوض نہیں بلکہ ثمن کے نقصان کی تقویم ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7991}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7992} صریح رضا: جیسے «میں عیب پر راضی ہوں» یا «میں نے خیار عیب ساقط کیا» یا «میں نے عقد کو جائز رکھا»، تو رد اور ارش دونوں ختم، کیونکہ رد کا حق اس شرط کے فوت ہونے سے ہے جو عقد میں دلالۃً ہے، اور عیب پر رضا اس شرط سے دستبرداری ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7992} رضامندی کے تصرفات: تین قسم کے ہیں۔ پہلا استعمال و انتفاع بغیر نقصان کے، جیسے کپڑا پہننا، جانور پر سواری ⁦(واپسی، پانی یا چارے کی خریداری کے علاوہ)⁩، زمین کو سیراب یا کاشت یا کٹائی کرنا، یا مبیع کو بیچنے یا کرائے پر دینے کے لیے پیش کرنا، اگرچہ ایک بار ہو؛ یہ استبقاء کی دلیل ہیں۔ دوسرا اتلاف جیسے پھاڑنا یا جانور کو مار دینا، جس سے خیار ساقط ہو جاتا ہے۔ تیسرا ملکیت سے نکالنا بذریعہ تملیکی عقد جیسے بیع، ہبہ مع قبضہ یا صلح، جس سے بائع کی طرف رد متعذر ہو جاتا ہے، اور مشتری ارش بھی نہیں لیتا کیونکہ رد کا امتناع اس کی طرف سے ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7992}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7993} تصرفات پر دیگر آراء: حنفیہ اور حنابلہ کے نزدیک ناقل تصرف، خواہ عیب سے بے خبر مشتری کا ہو، رد کو مانع اور خلفی موجب کی طرف منتقل کرتا ہے۔ مالکیہ کے نزدیک عوض کے ساتھ تصرف رد اور ارش دونوں کو ساقط کرتا ہے، اور بغیر عوض کے نقصانِ ثمن باقی رہتا ہے۔ شافعیہ وقف جیسے تصرف کو جس سے واپسی کی امید نہ ہو مانع رد سمجھتے ہیں، اور بیع جیسے تصرف کو جس میں واپسی کی امید ہو خیار ساقط کرنے والا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7993} عیب کے ثبوت اور اختلاف: متعاقدین کے درمیان عیب کے قدیم و حادث ہونے اور رد کے سبب پر دعویٰ ہوتا ہے؛ مالکیہ و شافعیہ کی تفصیلات طرقِ ثبوت عامہ کے تابع ہیں، اور حنابلہ کے نزدیک جس عیب میں صرف ایک طرف کا قول ممکن ہو، جیسے تازہ زخم جسے مشتری قدیم کہے، قول مدعی کا بغیر قسم معتبر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7994} خیار العیب اتفاقاً مستحق کے انتقال پر وارث کو منتقل ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7994}'
  es: "Khiyar al-ayb (opción de defecto) es un compuesto de 'opción' y 'defecto'. La mayoría usa este nombre; los malikíes suelen llamarlo la opción de deficiencia (khiyar al-naqisa). Ibn Nujaym e Ibn al-Humam definen un defecto como lo que le falta al estado natural sano, de modo que se cuenta como deficiente; Ibn Rushd como lo que no alcanza la creación natural o la forma lícita, con un efecto real en el precio; al-Ghazali como cualquier atributo desagradable cuya ausencia se asume habitualmente para la cosa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7959} Legalidad de la devolución por defecto: los juristas están de acuerdo en general en que una cosa defectuosa puede ser devuelta. Citan el Corán, que el comercio debe ser por consentimiento mutuo (Sura al-Nisa, 4:29), ya que el conocimiento de un defecto significa que el consentimiento no es completo; y la Sunnah: el relato de Aisha sobre un hombre que compró un esclavo, lo usó, encontró un defecto y lo devolvió, y el dictamen del Profeta de que el rendimiento viene con la responsabilidad. Al-Kasani también cita el hadiz de la oveja con su ubre llena, y argumenta por analogía que el comprador paga un precio por algo sano y no lo obtiene. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7959}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7960} Deber del vendedor de revelar: el vendedor debe informar al comprador de un defecto que le da la opción. No mencionar un defecto que no da opción no es engaño prohibido, en la opinión del Imam al-Haramayn. La mayoría sostiene que la revelación es obligatoria, y quien oculta un defecto es pecador, un asunto sobre el cual no hay disputa según Ibn Qudama y al-Subki. Ibn Rushd lo considera como comer riqueza falsamente. Las fuentes citadas incluyen el hadiz de Uqba ibn Amir que un musulmán vende a su hermano solo con el defecto mostrado, el hadiz de Wathila ibn al-Asqa' contra vender sin explicar qué hay en ello, y el dicho «quien nos engaña no es de los nuestros», del montón de grano que el Profeta encontró mojado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7960}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} Ocultación y validez de la venta: una venta que oculta un defecto dando la opción es válida aunque pecaminosa, según la mayoría de los juristas, ya que la prohibición es sobre la ocultación, no sobre el contrato. Si el comprador se entera del defecto después de la compra y lo acepta, el vendedor sigue teniendo la culpa y la venta se mantiene, como sostiene al-Shawkani. La práctica de los Compañeros incluía que Ibn Umar comprara camellos con sarna y los aceptara cuando se le informó de ello. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} Obligación sobre otros que no son la parte contratante: la obligación de revelar no se limita al vendedor sino que se extiende a cualquiera que conozca el defecto, según el informe de Wathila y los muchos textos sobre dar consejo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} Momento de la revelación: un vendedor o un tercero que conozca un defecto debe revelarlo antes de la venta, para que el comprador pueda abstenerse; si el tercero no está presente, o no puede, entonces después de la venta, para que el comprador pueda devolver la cosa. La obligación es más fuerte cuando solo un tercero lo sabe. El propósito de la opción es eliminar el daño del comprador: una venta implica un objeto sano, y cuando la salud falla por un defecto, el comprador tiene la opción, porque el consentimiento es parte de la naturaleza de la venta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7962}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7963} Tres condiciones para la opción de defecto: debe aparecer un defecto real; el comprador no debe haber tenido conocimiento de él al momento del contrato; y el vendedor no debe haber estipulado la liberación de defectos. Un defecto cuenta cuando disminuye el valor o frustra un propósito válido, y cuando la salud en ese sentido es el estado normal de ese tipo de cosa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7963}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7964} Definiciones: los hanafíes toman como defectuosa cualquier cosa que disminuya el valor a los ojos de los expertos, independientemente de si la sustancia se reduce o no; un defecto grave en una dote la hace pasar de buena a regular a mala calidad. Los shafiíes toman como defecto un defecto que disminuye el valor o la sustancia de tal manera que se pierde un propósito válido, cuando el estado habitual de tales cosas está libre de él; los hanbalíes cuentan la pérdida de sustancia incluso cuando el valor aumenta, y la pérdida de valor incluso cuando la sustancia no cambia. Los malikíes consideran defectuosa una casa donde alguien fue asesinado, ya que la gente la evita y su precio baja. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7963}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7964}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7965} Estado normal: la ausencia del defecto debe ser el estado normal del tipo de cosa. Lo que es común en tales cosas no es un defecto; por ejemplo, un sedimento habitual en el aceite. Los expertos deciden: los comerciantes para los bienes, los artesanos para las cosas hechas. Los hanafíes requieren el acuerdo de los expertos (si no están de acuerdo, no hay derecho de devolución); la mayoría de los shafiíes aceptan un experto, y el autor de al-Tatimma requiere dos. Si los dos no están de acuerdo y no hay otra autoridad disponible, la palabra del vendedor se mantiene con su juramento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7965} Condiciones de efecto: el defecto debe estar en el objeto mismo, no en la otra parte, un acreedor prendario o un garante. Debe ser antiguo, es decir, estar presente en el contrato o surgir antes de la recepción; un defecto que surge después de la recepción no da opción, aunque los malikíes aplican la regla de la garantía (tres días para los esclavos; un año para la locura, la lepra y el vitíligo). Los hanafíes hacen una excepción para el arrendamiento, que se anula por un nuevo defecto, ya que el arrendamiento es un contrato de beneficios que se acumulan gradualmente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7966} El propio acto del comprador: un defecto causado por el comprador antes de la recepción no da opción, en la opinión shafií. El defecto debe permanecer después de la entrega y hasta la devolución: si desaparece antes de que el comprador devuelva la cosa, el derecho a devolver caduca. Los hanafíes y shafiíes requieren que el comprador demuestre que el defecto está presente en él, ya que un defecto presente en el vendedor puede ser eliminado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7966}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7967} Defectos eliminables: no hay opción cuando el defecto puede eliminarse sin dificultad, como un sello del fabricante en una tela que el lavado no daña, o una mancha en una prenda que el lavado elimina. Si el vendedor minimizó el defecto y el comprador lo aceptó, los malikíes otorgan al comprador el derecho a devolverlo a menos que haya surgido un nuevo defecto; entonces puede elegir entre la devolución y la compensación (arsh), como en una opinión legal de al-Wansharisi sobre una bestia herida por una lanza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7967}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7968} Prueba de defectos por su visibilidad: un defecto visible no necesita prueba más allá de la vista del comprador, y este puede demandar al vendedor. Un defecto oculto conocido solo por expertos (como dolor en el hígado o el bazo) es probado por dos hombres musulmanes o un hombre justo experto. Un defecto que solo ven las mujeres es probado por la palabra de una mujer justa, siendo dos más seguro; en la visión Hanafi prueba la reclamación pero no la devolución. Un defecto conocido solo por juicio, como un esclavo que se fuga, necesita dos hombres o un hombre y dos mujeres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7968} El juramento del vendedor: si el comprador no puede probar que el defecto estaba con el vendedor, los dos compañeros de Abu Hanifa hacen jurar al vendedor; Abu Hanifa no lo hace. Si el defecto puede ocurrir en la mano del comprador, el juramento es absoluto (un juramento definido); si el vendedor solo conoce el acto de otro, jura por conocimiento. Si el vendedor se niega a jurar, el defecto se establece en su contra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7968}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7969} Conocimiento del defecto: el comprador debe desconocer el defecto. Si lo sabía en el contrato o en la recepción no tiene opción, ya que al comprar o tomar la cosa con conocimiento consiente de hecho. Un defecto que es obvio y que cualquiera vería cuenta como conocido, y también lo es un defecto que el vendedor señaló. Cuando el vendedor dijo que una cosa es defectuosa como condición de venta, como con un toro vendido con la condición de que duerma en el arado, el vendedor está libre de culpa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7969} Un comprador que sabe que una cosa es defectuosa sin saberlo es uno: si la toma y solo después se entera de que es defectuosa, la pregunta es si el defecto es evidente. Un defecto evidente que cualquiera ve no da derecho a devolución; un defecto que solo los expertos conocen da el derecho. Del mismo modo, un comprador que sabe que una moneda es falsa, pero no cuántas son falsas, no ha consentido el defecto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7970} La liberación de defectos: la opción se pierde si el vendedor estipula la liberación. Una liberación es válida en la visión Hanafi ya sea que el defecto fuera conocido o desconocido para el vendedor y sea cual sea la cosa; Malik y al-Shafii la permiten solo para animales. Tal venta con liberación es un tipo especial llamado venta de liberación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7970}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7971} Origen y las opiniones: el informe de Ibn Umar, quien vendió un esclavo con liberación y fue cuestionado sobre una enfermedad oculta; Uthman le ordenó que jurara que no lo sabía, y él se negó, tomó al esclavo de vuelta y luego lo vendió por más. Los juristas difieren en la liberación: liberación de todos los defectos ya sean conocidos o no (Abu Hanifa, Abu Thawr, de Ibn Umar y Zayd); no hay liberación a menos que el defecto sea nombrado (Ibn Abi Layla, al-Thawri); no hay liberación a menos que el comprador lo haya visto (algunos shafiíes, Shurayh, Ata, un informe de Ahmad e Ishaq); liberación solo de defectos ocultos en animales (Malik, y la opinión aparente de al-Shafii); una liberación solo en una venta de botín, de un quebrado, o en pago de deuda; o una anulación de la venta por completo, una opinión shafií. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7971}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7972} Tipos de liberación: particular (de un defecto nombrado) o general (de todos los defectos). Si se refiere a un defecto existente en el contrato, cubre solo ese. Si se refiere a un defecto futuro que surja antes de la recepción, la condición es nula y la venta inválida. Si no está calificada, Abu Hanifa y Abu Yusuf la consideran para cubrir defectos en el contrato y hasta la recepción; Malik, Muhammad, Zufar y al-Hasan ibn Ziyad lo limitan a los defectos en el contrato. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7972} Contratos que toman la opción del defecto (lista Hanafi): compraventa (la venta válida, no la nula, e incluyendo el intercambio de dinero); arrendamiento, que la toma ya sea que el defecto sea antiguo o nuevo, y donde el arrendatario puede devolver antes y después de la recepción; división; liquidación de bienes; la dote; la compensación de khul'; y la liquidación por sangre intencional. Para estos, la devolución es solo para un defecto grave, no para uno leve. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7972}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7973} Ibn Rushd: los contratos se dividen en tres: aquellos destinados al intercambio, que toman la opción sin disputa; aquellos que no están destinados al intercambio, como un regalo sin devolución, que no lo son; y contratos mixtos, como un regalo con intención de devolución, que él piensa que no lo son. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7973} Momento de la devolución: tres puntos de vista. (1) Inmediatamente, es decir, tan pronto como la costumbre lo permita; quien sabe y no devuelve pierde el derecho y soporta la pérdida sin arsh, el punto de vista shafií y uno de Ahmad. El hanafí al-Hawi también sostiene esto; Ibn Nujaym lo llama extraño, y el punto de vista hanafí tomado es que la opción dura. (2) Retrasado, mientras no aparezca ninguna señal de consentimiento, el punto de vista de los hanafíes (en el que se confía) y un informe hanbalí sólido. (3) Uno o dos días, el punto de vista malikí, donde la posesión continua después de eso cuenta como consentimiento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7974}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7975} Efecto en la regla del contrato: el defecto no impide la transferencia de propiedad: el comprador posee la cosa de inmediato y el vendedor posee el precio, ya que la venta es absoluta en sus pilares. La condición implícita de solidez solo impide que el contrato sea vinculante, no su efecto básico. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7975}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7976} Lo que el comprador puede elegir: tres puntos de vista. (1) Hanafis y Shafiis: devolución contra el precio completo, o quedarse con la cosa por el precio completo sin arsh; arsh solo si la devolución es imposible. (2) Ahmad e Ishaq: devolver, o conservar con arsh, incluso cuando la devolución es posible; pero si conservar con arsh conduce a ribā, conservar es gratis. (3) Malikis: un defecto grave permite la devolución o la conservación gratis; un defecto leve en la tierra significa solo arsh, y en los bienes devolución, según la opinión aparente del Mudawwana. La fuente de la disputa: si el defecto reduce la sustancia o el atributo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7976}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7977} Condiciones de devolución: la opción debe seguir existiendo; la cosa devuelta debe estar como se recibió, sin un defecto adicional como un defecto de sociedad que surja de la división del trato; y el trato no debe dividirse antes de que se reciba la cosa completa, a menos que el vendedor acepte, ya que entonces es un daño que el vendedor acepta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7977} División del trato: cuando una cosa es un trato, el comprador no puede devolver parte de ella por un defecto por obligación, a menos que el resto sea del vendedor, en cuyo caso la parte puede ser devuelta por obligación; esta es la opinión en la que se basa el juez, ya que la razón válida es el daño de dividir el trato para el vendedor. Antes de que se reciba la cosa completa, el trato no puede dividirse, ya sea que la cosa sea una (tela, una casa), una medida en recipientes, dos cosas de hecho o una en cuenta (como las dos hojas de una puerta). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7978} Los Malikis: si la parte sana se pierde, el comprador puede devolver la parte defectuosa con su parte del precio; si la parte sana permanece, puede devolver parte por su parte solo si la parte defectuosa no es más de la mitad, y el defecto no es el propósito del trato; De lo contrario, lo devuelve todo o se queda con todo. Los hanbalíes prohíben la devolución por división en una cosa, y en dos cosas que pierden valor al dividirse; los shafiíes no permiten la devolución de una parte, aunque al-Qadi Husayn lo permitió cuando no hay división por parte del vendedor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7978}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7979} División por pluralidad de partes: cuando dos compradores compran una cosa y encuentran un defecto, uno puede devolverla solo según Abu Yusuf y Muhammad; Abu Hanifa dice que no, ya que la devolución no sería de la cosa tal como se recibió (un nuevo defecto de la sociedad). Los shafiíes y los hanbalíes distinguen un trato plural (varios vendedores o compradores, o precio establecido por parte) de uno único: el primero permite la devolución de una parte; si un vendedor está ausente, el comprador devuelve la parte del vendedor presente por su parte del precio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7979}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7980} Conocimiento y consentimiento: los hanafíes requieren que la otra parte conozca la devolución, ya sea antes o después de la recepción; una devolución sin su conocimiento queda suspendida, y el acuerdo se vuelve vinculante si vence el plazo. Los shafiíes y hanbalíes no requieren ni conocimiento, ni consentimiento, ni dictamen judicial. Antes de la recepción, los hanafíes no necesitan ni consentimiento ni sentencia; después de la recepción sí necesitan uno de ellos, porque el acuerdo se completa al recibirlo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7980}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7981} Naturaleza de la devolución y su efecto en la reventa: en términos Hanafi, una devolución por consentimiento después de la recepción es una rescisión entre las partes pero una nueva venta frente a otros; una devolución por sentencia anula para todos. El efecto aparece en una cadena de ventas: si la devolución del segundo comprador fue aceptada por sentencia, puede devolver a su vendedor; si fue por consentimiento, no puede, porque es una nueva venta para el tercero. Antes de la recepción, el primer comprador puede devolver al primer vendedor en todos los casos. Ibn Qudama sostiene que un comprador que conocía el defecto, o mostró consentimiento, no puede devolverlo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7981}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7982}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7983} Conservación con arsh: cuando una devolución es imposible por aumento, cambio o disposición, el derecho del comprador pasa de devolución a compensación del precio, llamado derecho sustituto. Esta es la visión Hanafi y Shafii; los Malikis tienen tres tipos de defecto (leve, sin derecho alguno; grave, con devolución o conservación gratuita; y medio, con compensación del precio); los Hanbalis dejan al comprador elegir entre conservar con la reducción de precio y devolver incluso cuando la devolución es posible. Arsh se encuentra valorando la cosa sana, luego con el defecto, y tomando la proporción de la diferencia al valor y aplicándola al precio. El autor de al-Ashbah sostiene que el valor se toma el día del contrato; al-Hasan al-Basri y Ahmad toman el valor en el momento de la compra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7983}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7984} Obstáculos para la devolución: naturales, legales y contractuales. La destrucción en manos del vendedor impide la devolución, y el vendedor no reclama precio al comprador. La destrucción después de la recepción por una causa divina impide la devolución, dejando la reducción del precio. El consumo por parte del comprador mediante un uso lícito (comer alimentos, usar ropa hasta que se rompa) también impide la devolución; Abu Hanifa difiere de sus dos compañeros en este punto, quienes lo consideran un obstáculo para la devolución pero no para el arsh. Los hanbalíes distinguen si el vendedor ocultó el defecto: si lo hizo, el comprador puede reclamar el precio completo; los malikíes dan el precio completo solo cuando el defecto oculto en sí mismo causó la pérdida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7985} Obstáculos legales para la devolución: un aumento conectado que no se genera de la cosa (teñido, costura, construcción, siembra) impide la devolución ya sea antes o después de la recepción, porque es una cosa en sí misma y no una parte subordinada; el consentimiento del vendedor no lo permite, ya que sería riba. Un aumento separado generado después de la recepción (descendencia, fruta, leche, compensación por un daño) impide la devolución en la visión hanafí, ya que devolverlo con la cosa es ganancia sobre lo que no estaba garantizado; al-shafii lo cuenta como ganancias y no permite que impida la devolución. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7986} Aumentos que no impiden la devolución: un aumento generado conectado (crecimiento, engorde; para los Hanbalis, las crías no nacidas antes del nacimiento y el fruto antes de la polinización) no impide la devolución en el aparente informe Hanafi, a menos que el comprador se niegue a devolverlo con la cosa, en cuyo caso toma el arsh; Muhammad difiere. Un aumento generado separado antes de la recepción (crías, leche, fruta en los árboles) no impide la devolución, pero la cosa no puede devolverse sola: el comprador devuelve todo o se queda con todo al precio completo; los Hanbalis devuelven la cosa sola y el aumento se queda con el comprador. Un aumento separado no generado (renta, ganancias) no impide la devolución, y el comprador lo conserva según la regla de que el rendimiento va con la obligación; en la visión Hanafi lo conserva sin precio pero no en buena conciencia, y los dos compañeros se lo dan al vendedor; Si elige quedarse con la cosa, el aumento no es bueno para él (no es lícito en el sentido de ganancia limpia). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7986}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7987}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7988} Si el aumento perece: por una causa celestial la regla no cambia; por el acto del comprador el vendedor puede aceptar la cosa con el precio completo, o rechazarla y tomar el precio más bajo; por el acto de un tercero la devolución es imposible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7988} Los Malikis: Ibn Rushd da cinco formas de aumento. El crecimiento por cambio de mercado no da opción; un aumento en el estado de la cosa no da ninguna; El crecimiento dentro de la cosa o de su especie, como la descendencia, es objeto de disputa; un aumento adicional de otra clase, como el fruto que aparece en una palmera, no deja opción, y el comprador devuelve la palmera y su fruto antes de que maduren, junto con el costo del tratamiento, o los conserva sin recibir nada a cambio; un aumento que el comprador haya realizado mediante artesanía, como el teñido o la costura, le da la opción de conservar y reclamar el arsh o de devolverlo y convertirse en socio del valor. Ibn Ghazi y al-Hattab describen valoraciones de dos o cuatro etapas en estos casos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7987}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7988}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7989} Obstáculo contractual (un nuevo defecto): si la cosa es defectuosa con un nuevo defecto en manos del comprador, por su acto, por una causa divina, o por un ser vivo al que dañó, la devolución de la cosa defectuosa está prohibida, y el derecho sustituto a una reducción del precio toma su lugar, porque la condición de devolución es que la cosa se devuelva como se recibió, y devolverla dañaría al vendedor que no garantiza el nuevo defecto. Los Hanafis y un informe Hanbali no dan al comprador derecho de devolución, ya que él causó la imposibilidad. Los Malikis y otro informe Hanbali le permiten elegir entre quedarse con el arsh del antiguo defecto y devolver con el arsh del nuevo. Los shafiíes sostienen que el derecho de devolución se extingue automáticamente; si el vendedor no acepta el bien defectuoso, el comprador le añade el arsh del nuevo defecto y lo devuelve, o paga el arsh del defecto anterior y se lo queda, y debe notificarlo al vendedor de inmediato. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7989} La opción termina: por la devolución (o por conservarlo con el arsh) y por actos que demuestren consentimiento; también por la eliminación del defecto antes de la devolución, si se hace rápidamente y sin perjudicar al comprador. Ejemplos de Ibn Hajar: terreno con semillas que el vendedor se compromete a quitar rápidamente; una casa con un defecto en el techo que el vendedor repara; terreno con piedras enterradas cuya dejar no causa daño pero cuya quitar sí; y un animal herrado, cuya herradura, si se quita, empeoraría el defecto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7990} Deber de abstenerse de devolver por el interés público: cuando conservar la cosa defectuosa es el mejor curso y el poder de la parte contratante está restringido: un comprador en quiebra, porque la devolución quitaría la ganancia de los acreedores; un tutor que compra para su pupilo en un caso en que la compra es lícita, ya que la devolución perjudica al pupilo; y un mudarib que no obtuvo la orden del propietario de devolver. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7991} Renuncia: los Hanafis permiten al comprador renunciar a la opción del defecto por palabras expresas, ya que es su propio derecho, a diferencia de la opción de la vista, que es una opción por ley. Una renuncia a cambio de una contraprestación no está permitida en la visión Shafii: Ibn Hajar sostuvo que pagar por la opción que se va a entregar no es válido, ya que es una opción de rescisión, como la opción de deliberación, que no tiene valor. El arsh no es un pago por renunciar a la opción sino una evaluación de la pérdida de precio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7991}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7992} Consentimiento expreso: palabras como «Consiento el defecto», «Renuncio a la opción del defecto», «Apruebo el contrato» ponen fin tanto a la devolución como al arsh, ya que el derecho a devolver existe porque la condición de solidez implícita en el contrato ha fallado, y consentir el defecto significa que el comprador renunció a esa condición. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7992} Actos de consentimiento: tres tipos. Primero, el uso sin pérdida, como usar una prenda, montar un animal (que no sea para devolverlo, darle de beber o comprar forraje), irrigar, sembrar o cosechar la tierra, u ofrecer la cosa en venta o arrendamiento, incluso una sola vez; estos muestran un deseo de conservar la cosa. Segundo, la destrucción de la cosa, como rasgar una tela o matar un animal, lo que extingue la opción. Tercero, tomar la cosa de la propiedad por una transferencia, como una venta, una donación con entrega o un acuerdo; la devolución al vendedor queda entonces prohibida para el comprador, quien es responsable de la barrera, por lo que tampoco tiene derecho al arsh. Si posteriormente recupera la cosa por una opción de condición o de vista, puede devolverla al vendedor, por juicio o por consentimiento antes de la recepción, pero no por consentimiento después de la recepción. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7992}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7993} Otras opiniones sobre los actos de propiedad: los hanafíes y los hanbalíes sostienen que cualquier transferencia, incluso por un comprador ignorante del defecto, impide la devolución y traslada el derecho al arsh. Los malikíes dicen que una transferencia con contraprestación termina tanto la devolución como el arsh, y sin contraprestación deja el arsh. Los shafiíes distinguen una transferencia que no da esperanza de devolución, como un waqf, que impide la devolución, de una que deja esperanza de devolución, como una venta, que termina la opción. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7993} Prueba y disputa sobre el defecto: surgen reclamaciones entre las partes sobre si el defecto es antiguo o nuevo y sobre la causa de la devolución; Los malikíes y shafiíes presentan detalles que se enmarcan dentro de los métodos generales de prueba, y los hanbalíes registran que cuando un defecto admite la palabra de una sola parte, como una herida reciente que el comprador afirma que es antigua, prevalece la palabra del reclamante sin juramento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7994} La opción de defecto se transmite al heredero tras el fallecimiento del titular, por acuerdo mutuo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7994}"
  fr: "Khiyar al-ayb (option du défaut) est un composé d'« option » et de « défaut ». La majorité utilise cette appellation; les Malikites l'appellent généralement option de la déficience (khiyar al-naqisa). Ibn Nujaym et Ibn al-Humam définissent un défaut comme ce qui manque à l'état naturel sain, de sorte qu'il est considéré comme déficient; Ibn Rushd comme ce qui est inférieur à la création naturelle ou à la forme licite, avec un effet réel sur le prix; al-Ghazali comme tout attribut déplaisant dont l'absence est habituellement présumée pour la chose. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7959} Licéité du retour pour défaut: les juristes s'accordent généralement à dire qu'une chose défectueuse peut être retournée. Ils citent le Coran, selon lequel le commerce doit se faire par consentement mutuel (Sourate An-Nisa, 4:29), puisque la connaissance d'un défaut signifie que le consentement n'est pas plein. La Sunna relate le hadith d'Aïcha concernant un homme qui acheta un esclave, l'utilisa, découvrit un défaut et le rendit, ainsi que la décision du Prophète selon laquelle le fruit de l'exploitation est lié à la dette. Al-Kasani cite également le hadith de la brebis à la mamelle pleine et en déduit par analogie que l'acheteur paie un prix pour un bien sain qu'il ne reçoit pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7959}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7960} Obligation de divulgation du vendeur: le vendeur doit informer l'acheteur de tout défaut qui lui laisse une possibilité de rachat. Omettre de mentionner un défaut qui n'offre aucune possibilité de rachat n'est pas considéré comme une tromperie interdite, selon l'avis de l'imam al-Haramayn. La majorité considère que la divulgation est obligatoire et que quiconque dissimule un défaut commet un péché, un point sur lequel il n'y a pas de controverse selon Ibn Qudama et al-Subki. Ibn Rushd considère cela comme une appropriation illicite de richesses. Parmi les sources citées figurent le hadith d'Uqba ibn Amir selon lequel un musulman ne vend à son frère qu'en révélant le défaut, le hadith de Wathila ibn al-Asqa' interdisant de vendre sans en expliquer la nature, et le hadith « Quiconque nous trompe n'est pas des nôtres », tiré du tas de grain que le Prophète trouva humide. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7960}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} Dissimulation et validité de la vente: une vente dissimulant un défaut et laissant la possibilité de l'accepter est valable, bien que considérée comme un péché par la plupart des juristes, car l'interdiction porte sur la dissimulation et non sur le contrat lui-même. Si l'acheteur découvre le défaut après l'achat et l'accepte, le vendeur demeure fautif et la vente est maintenue, comme le soutient al-Shawkani. La pratique des Compagnons incluait l'achat, par Ibn Umar, de chameaux atteints de gale, et leur acceptation après avoir été informé de leur état. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} Obligation envers les tiers: l'obligation de divulgation ne se limite pas au vendeur, mais s'étend à toute personne ayant connaissance du défaut, selon le hadith de Wathila et de nombreux textes relatifs au conseil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} Moment de la divulgation: un vendeur ou un tiers ayant connaissance d'un défaut doit le divulguer avant la vente, afin que l'acheteur puisse s'abstenir; si le tiers est absent ou dans l'impossibilité de le faire, la divulgation doit avoir lieu après la vente, afin que l'acheteur puisse restituer le bien. Cette obligation est d'autant plus impérieuse lorsque seul un tiers a connaissance du défaut. L'objectif de l'option est de protéger l'acheteur contre tout préjudice: la vente suppose un bien sain, et lorsqu'un vice fait défaut, l'acheteur dispose d'un recours, le consentement étant inhérent à la vente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7962}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7963} Trois conditions doivent être remplies pour l'exercice de l'option: un vice réel doit apparaître; l'acheteur ne doit pas en avoir eu connaissance au moment de la conclusion du contrat; et le vendeur ne doit pas avoir stipulé de clause d'exonération pour vice. Un vice est caractérisé lorsqu'il diminue la valeur ou compromet la réalisation de l'objet légitime, et lorsque la qualité, à cet égard, est l'état normal de ce type de bien. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7963}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7964} Définitions: les Hanafites considèrent comme défectueux tout élément qui diminue la valeur aux yeux des experts, que la substance soit ou non réduite; un défaut grave dans une dot la fait passer de bonne à moyenne, puis à mauvaise qualité. Les Chafiites considèrent comme défectueux tout défaut qui diminue la valeur ou la substance au point de rendre inutilisable un objet valable, alors que l’état normal de ces biens n’en comporte pas; les Hanbalites prennent en compte la perte de substance même lorsque la valeur augmente, et la perte de valeur même lorsque la substance reste inchangée. Les Malikites considèrent comme défectueux une maison où un meurtre a eu lieu, car elle est délaissée et sa valeur diminue. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7963}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7964}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7965} État normal: l’absence de défaut doit être l’état normal de la nature de la chose. Ce qui est commun à de telles choses n’est pas un défaut; par exemple, un dépôt normal dans l’huile. Ce sont les experts qui décident: les marchands pour les marchandises, les artisans pour les objets artisanaux. Les hanafites exigent l’accord des experts (en cas de désaccord, il n’y a pas de droit de retour); la majorité des shafi’ites acceptent un seul expert, et l’auteur d’al-Tatimma en exige deux. Si les deux experts sont en désaccord et qu’aucune autre autorité n’est disponible, la parole du vendeur prévaut, assortie de son serment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7965} Conditions d'effet: le défaut doit affecter l'objet lui-même, et non l'autre partie, un gage ou un garant. Il doit être antérieur, c'est-à-dire présent au moment du contrat ou survenu avant la réception; un défaut survenant après la réception ne donne lieu à aucun recours, bien que les Malikites appliquent la règle de la garantie (trois jours pour les esclaves; un an en cas de folie, de lèpre ou de vitiligo). Les Hanafites font exception pour le bail, qui est annulé par un nouveau défaut, car le bail est un contrat de prestations dont les bénéfices s'accumulent progressivement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7966} Acte de l'acheteur: un défaut causé par l'acheteur avant la réception ne donne lieu à aucun recours, selon l'école Shafi'ite. Le défaut doit subsister après la livraison et jusqu'au retour: s'il disparaît avant le retour de l'objet par l'acheteur, le droit de retour est caduc. Les écoles hanafite et chaféite exigent que l'acheteur prouve la présence du défaut chez lui, car un défaut présent chez le vendeur peut être éliminé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7966}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7967} Défauts éliminables: aucune possibilité de retour n'est offerte lorsque le défaut peut être éliminé sans difficulté, comme une marque de fabricant sur un tissu qui ne s'altère pas au lavage, ou une tache sur un vêtement qui disparaît au lavage. Si le vendeur a minimisé le défaut et que l'acheteur l'a accepté, l'école malikite accorde à l'acheteur le droit de retourner le bien, sauf si un nouveau défaut est apparu; il peut alors choisir entre le retour et une compensation (arsh), comme dans un avis juridique d'al-Wansharisi concernant une bête blessée par une lance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7967}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7968} Preuve des défauts selon leur visibilité: un défaut visible ne nécessite aucune preuve autre que celle constatée par l’acheteur, qui peut alors poursuivre le vendeur. Un défaut caché, connu seulement des experts (comme une douleur au foie ou à la rate), est prouvé par deux hommes musulmans ou par un expert compétent. Un défaut que seules les femmes peuvent constater est prouvé par la parole d’une femme compétente, deux témoignages étant plus sûrs; selon l’école hanafite, cela prouve la demande mais non le retour. Un défaut qui ne peut être constaté que par une épreuve, comme la fuite d’un esclave, requiert la preuve de deux hommes ou d’un homme et de deux femmes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7968} Serment du vendeur: si l’acheteur ne peut prouver que le défaut est imputable au vendeur, les deux compagnons d’Abu Hanifa font prêter serment au vendeur; Abu Hanifa, lui, ne le fait pas. Si le défaut peut provenir de l’acheteur, le serment est absolu (serment formel); si le vendeur a seulement connaissance de l’acte d’autrui, il jure sur la base de sa connaissance. Si le vendeur refuse de jurer, le défaut lui est imputé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7968}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7969} Connaissance du défaut: l’acheteur doit ignorer le défaut. S'il avait connaissance du défaut au moment de la conclusion du contrat ou de la réception, il ne dispose d'aucun recours, car en achetant ou en prenant possession de l'objet en toute connaissance de cause, il y consent de fait. Un défaut apparent, visible par tous, est considéré comme connu, de même qu'un défaut signalé par le vendeur. Lorsque le vendeur a précisé qu'un objet était défectueux comme condition de vente, comme pour un taureau vendu à condition qu'il dorme dans la charrue, le vendeur est dégagé de toute responsabilité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7969} Un acheteur qui a connaissance d'un défaut sans en avoir conscience: s'il prend possession de l'objet et n'apprend le défaut que plus tard, la question est de savoir si le défaut est apparent. Un défaut apparent, visible par tous, ne donne pas droit à un retour; un défaut connu seulement des experts y donne droit. De même, un acheteur qui sait qu'une pièce de monnaie est fausse, mais ignore combien il y en a de fausses, n'a pas consenti au défaut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7970} La décharge de responsabilité: l’option est perdue si le vendeur stipule une décharge. Selon l’école hanafite, une décharge est valable que le vendeur ait connu ou non le défaut, et quelle que soit la nature de l’objet; les écoles malik et chaféite ne l’autorisent que pour les animaux. Une telle vente avec décharge constitue un type particulier appelé vente avec décharge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7970}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7971} Origine et avis: le récit d’Ibn Umar, qui vendit un esclave avec décharge et fut mis en cause au sujet d’une maladie cachée; Uthman lui ordonna de jurer qu’il n’en avait pas connaissance, ce qu’il refusa, reprit l’esclave et le revendit plus tard à un prix supérieur. Les juristes divergent quant à la question de la libération: libération pour tous les défauts, connus ou non (Abou Hanifa, Abou Thawr, d'après Ibn Umar et Zayd); absence de libération sauf si le défaut est nommé (Ibn Abi Layla, al-Thawri); absence de libération sauf si l'acheteur a constaté le défaut (certains shafi'ites, Shurayh, Ata, un rapport d'Ahmad et Ishaq); libération uniquement pour les vices cachés des animaux (Malik, et l'avis apparent d'al-Shafi'i); libération uniquement en cas de vente de butin, de faillite ou de paiement de dette; ou annulation pure et simple de la vente, avis shafi'ite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7971}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7972} Types de libération: particulière (d'un défaut nommé) ou générale (de tous les défauts). Si elle se rapporte à un défaut existant au moment du contrat, elle ne couvre que celui-ci. Si la clause se rapporte à un défaut futur survenant avant la réception, elle est nulle et la vente invalide. En l'absence de précision, Abu Hanifa et Abu Yusuf l'interprètent comme couvrant les défauts présents au contrat et jusqu'à la réception; Malik, Muhammad, Zufar et al-Hasan ibn Ziyad la limitent aux défauts présents au contrat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7972} Les contrats prévoyant l'option pour défaut (liste hanafite) sont: la vente et l'achat (la vente valable, et non la vente nulle, y compris l'échange d'argent); le bail, qui prévoit cette option que le défaut soit ancien ou nouveau, et lorsque le preneur peut restituer le bien avant et après sa réception; le partage; le règlement d'un bien; la dot; l'indemnité de khul'; et le règlement pour meurtre intentionnel. Dans ces cas, la restitution n'est possible qu'en cas de défaut grave, et non de défaut mineur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7972}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7973} Ibn Rushd: les contrats se divisent en trois catégories: ceux destinés à un échange, qui appliquent l'option sans contestation; ceux qui ne sont pas destinés à un échange, comme un don sans contrepartie, qui ne l'appliquent pas; et les contrats mixtes, comme un don avec intention de retour, qui, selon lui, ne l'appliquent pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7973} Délai de retour: trois avis. (1) Immédiatement, c'est-à-dire dès que la coutume le permet; celui qui connaît le droit de retour et ne le fait pas perd ce droit et supporte la perte sans compensation (arsh), avis shafi'ite et avis d'Ahmad. L'école hanafite al-Hawi soutient également cette position; Ibn Nujaym la juge étrange, et l'avis hanafite retenu est que l'option demeure. (2) Retardé, tant qu'aucun signe de consentement n'apparaît, selon l'avis des Hanafites (sur lequel s'appuie une source fiable) et un hadith hanbalite authentique. (3) Un jour ou deux, selon l'avis des Malikites, la possession continue après ce délai valant consentement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7974}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7975} Effet sur la validité du contrat: le vice n'empêche pas le transfert de propriété: l'acheteur acquiert immédiatement la propriété du bien et le vendeur le paiement du prix, la vente étant absolue. La condition implicite de validité du contrat ne fait que le rendre inapplicable, sans en altérer l'effet fondamental. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7975}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7976} Choix de l'acheteur: trois avis. (1) Hanafites et Shafiites: restitution contre remboursement du prix d'achat, ou conservation du bien pour le prix d'achat sans retenue; retenue uniquement si la restitution est impossible. (2) Ahmad et Ishaq: restitution, ou conservation avec retenue, même si la restitution est possible; mais si la conservation avec retenue entraîne un impôt (ribā), la conservation est gratuite. (3) Malikites: un défaut grave permet la restitution ou la conservation gratuite; un défaut mineur sur un terrain entraîne seulement une retenue, et sur un bien, la restitution, selon l'avis apparent des Mudawwana. Le point de désaccord porte sur la nature du défaut: s'agit-il d'une altération de la substance ou d'un attribut ? {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7976}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7977} Conditions de retour: l’option doit toujours exister; la chose retournée doit être dans l’état où elle a été reçue, sans autre défaut tel qu’un vice de partenariat résultant de la division du contrat; et le contrat ne doit pas être divisé avant la réception de la totalité de la chose, sauf si le vendeur l’accepte, car il s’agit alors d’un préjudice accepté par le vendeur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7977} Division du contrat: lorsqu’une chose constitue un contrat unique, l’acheteur ne peut pas en retourner une partie pour un défaut par la force, sauf si le reste appartient au vendeur, auquel cas la partie peut être retournée par la force; c’est sur ce point que se fonde le juge, puisque le motif valable est le préjudice que la division du contrat cause au vendeur. Avant la réception de l'intégralité du bien, la transaction ne peut être divisée, qu'il s'agisse d'un seul bien (tissu, maison), d'une mesure en récipients, de deux biens en réalité ou d'un seul en valeur (comme les deux vantaux d'une porte). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7978} Les Malikites: si la partie en bon état est perdue, l'acheteur peut restituer la partie défectueuse avec sa part du prix; si la partie en bon état demeure, il ne peut restituer que la partie défectueuse, à hauteur de sa part, si cette dernière ne représente pas plus de la moitié du prix et si le défaut n'est pas l'objet de la transaction; sinon, il doit restituer la totalité ou la conserver. Les Hanbalites interdisent la restitution partielle, que ce soit pour un seul bien ou pour deux biens qui perdent de la valeur une fois séparés; les Chafiites n'autorisent pas la restitution partielle, bien qu'al-Qadi Husayn l'ait autorisée lorsqu'il n'y a pas de partage à la charge du vendeur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7978}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7979} Partage entre plusieurs parties: lorsque deux acheteurs acquièrent un bien et constatent un défaut, l’un d’eux peut le retourner seul, selon Abu Yusuf et Muhammad. Abu Hanifa s’y oppose, car le retour ne porterait pas sur le bien tel que reçu (un nouveau défaut de la société). Les écoles Shafi’ite et Hanbalite distinguent une transaction plurielle (plusieurs vendeurs ou acheteurs, ou prix indiqué par part) d’une transaction unique: la première autorise le retour d’une part; si l’un des vendeurs est absent, l’acheteur retourne la part du vendeur présent à hauteur de sa quote-part. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7979}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7980} Connaissance et consentement: les Hanafites exigent que l’autre partie soit informée du retour, que ce soit avant ou après sa réception; un retour effectué sans sa connaissance est suspendu, et l’accord devient exécutoire si le délai expire. Les Shafi’ites et les Hanbalites n’exigent ni connaissance, ni consentement, ni décision d’un juge. Avant la réception, les Hanafites n’ont besoin ni de consentement ni de jugement; après la réception, ils en ont besoin, car l’accord est conclu dès la réception. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7980}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7981} Nature du retour et son effet sur la revente: selon l’école hanafite, un retour par consentement mutuel après réception constitue une résolution entre les parties, mais une nouvelle vente à l’égard des tiers; un retour par jugement annule la vente pour tous. Cet effet se manifeste dans une chaîne de ventes: si le retour du second acheteur a été accepté par jugement, il peut retourner la marchandise à son vendeur; s’il a été accepté par consentement mutuel, il ne le peut pas, car il s’agit d’une nouvelle vente pour le tiers. Avant réception, le premier acheteur peut retourner la marchandise au premier vendeur dans tous les cas. Ibn Qudama soutient qu'un acheteur ayant connaissance du défaut, ou y ayant consenti, ne peut le retourner. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7981}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7982}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7983} Concernant le droit de substitution: lorsqu'un retour est impossible par augmentation, modification ou cession, le droit de l'acheteur passe du retour à la compensation du prix, appelée droit de substitution. C'est l'avis des écoles hanafite et shafi'ite; les malikites distinguent trois types de défauts: mineur, sans indemnisation; grave, donnant droit à un retour ou à la conservation gratuite; et moyen, donnant droit à la compensation du prix; les hanbalites laissent à l'acheteur le choix entre la conservation avec une réduction de prix et le retour, même lorsque celui-ci est possible. L'arsh est déterminé en évaluant la valeur de l'objet en bon état, puis en tenant compte du défaut, et en calculant la différence proportionnellement à cette valeur, puis en l'appliquant au prix. L'auteur d'al-Ashbah considère que la valeur est celle du jour de la conclusion du contrat; al-Hasan al-Basri et Ahmad, quant à eux, la prennent en compte lors de l'achat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7983}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7984} Obstacles au retour: naturels, légaux et contractuels. La destruction du bien par le vendeur empêche le retour, et ce dernier ne peut prétendre à aucun remboursement. La destruction après réception, due à une cause divine, empêche également le retour, mais une réduction de prix peut être appliquée. La consommation par l'acheteur, par un usage licite (nourriture, vêtements usés), empêche aussi le retour; Abu Hanifa diffère sur ce point de ses deux compagnons, qui considèrent cela comme un obstacle au retour, mais non à l'arsh. Les Hanbalites font la distinction entre la dissimulation du défaut par le vendeur et le remboursement intégral du prix par l'acheteur. Les Malikites, quant à eux, n'accordent le remboursement intégral que si le défaut dissimulé a causé le préjudice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7985} Obstacles juridiques au retour: un enrichissement lié à la chose et non issu de celle-ci (teinture, couture, construction, plantation) fait obstacle au retour, qu'il soit antérieur ou postérieur à la réception, car il constitue une chose en soi et non une partie subordonnée. Le consentement du vendeur ne l'autorise pas, car il s'agirait d'usure (riba). Un enrichissement distinct survenu après la réception (descendance, fruits, lait, indemnisation pour un préjudice) fait obstacle au retour selon l'école Hanafi, car le retour avec la chose représente un profit sur ce qui n'était pas garanti. L'école al-Shafi'i le considère comme un gain et ne s'y oppose pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7986} Les plus-values n'empêchent pas la restitution: une plus-value liée (croissance, engraissement; pour les Hanbalites, le fœtus avant la naissance et le fruit avant la pollinisation) n'empêche pas la restitution selon l'école hanafite, sauf si l'acheteur refuse de la restituer avec la chose, auquel cas il conserve le prix; Muhammad a une opinion différente. Une plus-value séparée avant réception (descendance, lait, fruits sur les arbres) n'empêche pas la restitution, mais la chose ne peut être restituée seule: l'acheteur restitue la totalité ou la conserve au prix d'achat; les Hanbalites restituent la chose seule et la plus-value reste chez l'acheteur. Une plus-value séparée non liée (loyer, revenus) n'empêche pas la restitution, et l'acheteur la conserve selon la règle selon laquelle le rendement est lié à la dette; selon l'école hanafite, il la conserve sans prix, mais sans bonne conscience, et les deux compagnons la donnent au vendeur. S'il choisit de conserver le bien, l'accroissement ne lui est pas profitable (il ne s'agit pas d'un gain licite au sens d'un gain propre). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7986}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7987}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7988} Si l'accroissement disparaît: par une cause divine, la règle reste inchangée; par l'acte de l'acheteur, le vendeur peut accepter le bien à son prix initial, ou le refuser et accepter un prix inférieur; par l'acte d'un tiers, le retour est impossible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7988} Les Malikites: Ibn Rushd distingue cinq formes d'accroissement. La croissance due à l'évolution du marché ne laisse aucune possibilité; une amélioration de l'état du bien n'en laisse aucune; La croissance interne ou externe, comme la descendance, est sujette à controverse; un accroissement d'une autre nature, tel qu'un fruit apparaissant sur un palmier, ne laisse aucune possibilité de retour: l'acheteur restitue le palmier et ses fruits avant leur maturité, à ses frais, ou les conserve sans contrepartie; un accroissement réalisé par l'acheteur par un travail manuel, comme la teinture ou la couture, lui offre la possibilité de conserver le bien et d'en réclamer le fruit, ou de le restituer et de participer à sa valorisation. Ibn Ghazi et al-Hattab décrivent des évaluations en deux ou quatre étapes dans ces cas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7987}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7988}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7989} Obstacle contractuel (nouveau défaut): si la chose est défectueuse et qu’un nouveau défaut apparaît du fait de l’acheteur (par son action, par une cause divine ou par un être vivant qu’il a lésé), le retour de la chose défectueuse est interdit. Le vendeur a alors droit à une réduction de prix, car la condition de retour est que la chose soit restituée dans son état d’origine. La restitution nuirait au vendeur, qui ne garantit pas l’absence de nouveau défaut. L’école hanafite et un hadith hanbalite n’accordent aucun droit de retour à l’acheteur, puisqu’il est à l’origine du défaut. L’école malikite et un autre hadith hanbalite lui laissent le choix entre conserver les dommages causés par l’ancien défaut et restituer la chose avec les dommages causés par le nouveau. L'école shafi'ite considère que le droit de retour s'éteint automatiquement; si le vendeur refuse l'objet défectueux, l'acheteur y ajoute le prix du nouveau défaut et le retourne, ou bien il paie le prix du défaut initial et le conserve, en informant rapidement le vendeur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7989} L'option s'éteint: par le retour (ou en conservant l'objet avec le prix du nouveau défaut) et par des actes manifestant le consentement; également par la suppression du défaut avant le retour, si elle est effectuée rapidement et sans préjudice pour l'acheteur. Exemples d'Ibn Hajar: un terrain ensemencé que le vendeur s'engage à enlever rapidement; une maison avec un défaut de toiture que le vendeur répare; un terrain avec une pierre enfouie dont le maintien est sans conséquence, mais dont l'enlèvement est préjudiciable; et un animal ferré dont le fer, s'il était enlevé, aggraverait le défaut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7990} Obligation de s'abstenir de retourner un bien dans l'intérêt public: lorsque la conservation du bien défectueux est préférable et que le pouvoir de la partie contractante est limité: un acheteur en faillite, car le retour priverait les créanciers de leurs gains; un tuteur achetant pour son pupille dans un cas où l'achat est licite, car le retour est préjudiciable au pupille; et un mudarib n'ayant pas reçu l'ordre du propriétaire de retourner le bien. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7991} Renonciation: les Hanafites autorisent l'acheteur à renoncer expressément à l'option de défaut, car il s'agit d'un droit qui lui est propre, contrairement à l'option de droit de regard, qui est une option de droit légal. Une renonciation à titre onéreux n'est pas autorisée selon l'école Shafi'ite: Ibn Hajar considérait que le paiement d'une contrepartie pour renoncer à l'option n'est pas valable, car il s'agit d'une option de résolution, comme l'option de réflexion, qui est sans valeur. L'arrhe n'est pas une indemnisation pour la renonciation à l'option, mais une évaluation de la perte de prix. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7991}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7992} Consentement exprès: des formules telles que « J'accepte le défaut », « J'ai renoncé à l'option pour défaut », « J'approuve le contrat » mettent fin à la fois au retour et à l'arrhe, puisque le droit de retour existe parce que la condition de validité implicite dans le contrat n'a pas été remplie, et le consentement au défaut signifie que l'acheteur a renoncé à cette condition. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7992} Actes de consentement: trois types. Premièrement, l'usage sans perte, comme porter un vêtement, monter un animal (autrement que pour le restituer, l'abreuver ou acheter du fourrage), irriguer, planter ou récolter la terre, ou proposer la chose à la vente ou à la location, même une seule fois; Ces actes manifestent le désir de conserver le bien. Deuxièmement, la destruction du bien, comme le fait de déchirer un tissu ou de tuer un animal, met fin à l'option. Troisièmement, le transfert de propriété, tel qu'une vente, une donation avec remise ou un règlement, empêche alors l'acheteur de le restituer au vendeur. Ce dernier, responsable de l'empêchement, perd tout droit sur le bien. S'il récupère ultérieurement le bien par une option conditionnelle ou par la vue, il peut le restituer au vendeur, soit par jugement, soit par consentement avant réception, mais non par consentement après réception. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7992}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7993} D'autres avis sur les actes de propriété: les écoles hanafite et hanbalite considèrent que tout transfert, même par un acheteur ignorant le défaut, empêche la restitution et transfère le droit au bien. Les Malikites affirment qu'un transfert avec contrepartie met fin à la fois au droit de restitution et à l'arrhe, tandis qu'un transfert sans contrepartie maintient l'arrhe. Les Chafiites distinguent un transfert qui n'offre aucun espoir de restitution, tel qu'un waqf, qui interdit toute restitution, d'un transfert qui laisse un espoir de restitution, tel qu'une vente, qui met fin à l'option. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7993} Preuve et litige concernant le défaut: des litiges surgissent entre les parties quant à l'ancienneté ou la nouveauté du défaut et à la cause de la restitution; les Malikites et les Chafiites détaillent les méthodes générales de preuve, et les Hanbalites indiquent que lorsqu'un défaut ne peut être contesté que par une seule partie, comme une plaie récente que l'acheteur prétend ancienne, la parole est celle du demandeur sans serment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7994} L'option relative au défaut est transmise à l'héritier au décès du titulaire, par convention. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7994}"
  tr: "Kusur seçeneği, 'khiyar' ve 'ayib' kelimelerinin ek bir bileşiğidir; çoğunluk buna bu isim verirken, Malikiler genellikle kusur seçeneği olarak adlandırır. İbn Najim ve İbn al-Humam, bunu, vaat edilen eksik olanın orijinal sağlam doğasından yoksun bir şey olarak tanımlamıştır. İbn Rüşd, fiyatı etkileyen bir eksiklikle doğal veya meşru yaratılışı küçümseyen bir şey olarak tanımlarken, el-Gazali genellikle satılan ürünün sağlamlığını gerektiren herhangi bir kusurlu tanım olarak tanımlamıştır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7959} Kusurun reddedilmesinin meşruiyeti: Hukukçular arasında genel olarak kusura dayalı yalanlama konusunda bir anlaşmazlık yoktur. Kur'an'dan \"Karşılıklı anlaşmayla ticaret olmadıkça\" (An-Nisa Suresi, 4:29) ayetini alıntıladılar, çünkü bir kusurun bilinmesi sözleşmelerdeki koşullu rızaya aykırıdır. Sünnet'ten, bir adamın bir çocuğu satın aldığı, onu sömürdüğü ve onda bir kusur bulduğu hadisi vardır; bu yüzden Peygamber, \"Getiri garantilidir\" diye yanıt vermiştir. El-Kasani Misrat hadislerini aktardı ve benzetme şudur: alıcı geçerli bir eşya almak için fiyat verdi ama ona teslim edilmedi. {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.7959} {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s.. 7960} Satıcıya kusuru bildirme yükümlülüğü: Alıcıya kusuru seçeneği sağlayan konuda bildirmelidir; ancak kusur seçeneği haklı çıkarmıyorsa, İmam Haramayn'ın dediği gibi tatlisin atlanması yasak değildir. Hukukçuların çoğunluğu açıkça bildirmenin zorunlu olduğunu; açıklamayan günahkar olduğunu ve İbn Qudamah ile Al-Subki'nin dediği gibi bir anlaşmazlık olmadığını belirtmiştir. Üqbe bin Amir'in \"Müslüman, başka bir Müslümanın kardeşidir ve bir Müslümanın, kusurlu kardeşinden satması ancak onun ona açıklaması halinde kabul edilir\" hadisini, içeriği belirtilmeden satmanın yasak olduğuna dair Vetilah ibn el-Eska'nın hadisini ve Sabret al-Ta'a'daki \"Bizi kandıran bizden değildir\" hadisini aktardılar. {alıntı:) fiqh-mawsua-kuwaitiyya-noor-v3 s.7960} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7961} Satışın geçerliliği üzerindeki gizleme etkisi: Çoğu hukukçuya göre geçerli ama günahtır, çünkü gizleme yasağı sözleşmede yoktur. Alıcı satın alma sonrası kusuru fark eder ve kabul ederse, satıcının hatası geçerlidir ve satış geçerlidir, Al-Shawkani'nin iddia ettiği gibi. Sahabelerin eylemleri arasında, İbn Umar'ın yabani develeri satın alması ve kusurları kendisine bildirildiğinde onay verip sözleşmeyi imzalaması vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7961} Yüklenici olmayana bilgi verme yükümlülüğü: Yükümlülük satıcıyla sınırlı değildir, çok sayıda hadis ve tavsiye yükümlülüğüyle ilgili metinler nedeniyle kusuru bilen herkese de uygulanır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7961} Kusurun bildirilme süresi: İmzacı satıcı veya yabancı ise satış öncesi olur, bu yüzden alıcı satın almaktan kaçınır. Yabancı gelmezse veya gelemiyorsa, sonrasında alıcı geri dönebilir. Yükümlülük, sadece dışarıdan biri kusurdan haberdar olursa ve satıcı değilse doğrulanır. Kusur seçeneğinin meşruiyetinin akıllıcası, alıcıya zarar gelmemesini önlemektir, çünkü satış, satılan ürünün güvenliğini gerektirir. Kusur güvenli olarak tanımlanmıyorsa, bir seçim vardır, çünkü onay gerçek satışın bir parçasıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7962} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7963} Kusur seçeneğinin koşulları üçdür: geçerli bir kusurun görünmesi; alıcının sözleşme sırasında kusurdan haberdar olması; ve satıcının kusurun masumiyetini belirtmemiş olması gerekir. Kusur, değer düşüşüne neden olursa veya geçerli bir ürünü kaçırırsa geçerli sayılır ve bu tanımdan kaynaklanan güvenlik, satılan üründe varsayılan olarak kabul edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7963} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7964} Hanefilere göre kusur ölçütü: uzmanlara göre değer düşmesine neden olan her şey, değeri düşse de düşsün de; çeyizdeki ciddi bir kusur, onu iyi bir şeyden medyuma çıkarır; ve Mukhtar al-Fatawa göre belirleyici sınır, değer biçmenlerin değerlendirmesine giren şeydir. Şafiilere göre: değerini azaltan veya değerini azaltan şey geçerli bir amacı kaybeder ve çoğu durumda böyle bir şey yoktur; Hanbalılar, değer artsa bile değerin azalmasıyla yetinir ve servet eksikliğini bir kusur olarak görürler. Malikiler, bir kişinin itilmesi nedeniyle öldürüldüğü ve bu nedenle değerinin değersizleştirildiği bir kusur evi olarak kabul ederler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7963} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7964} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7965} Orijinal sağlamlık: Yan tanımın güvenliğinin eşya türü ve benzeri eşyalarda varsayılan olması gerekir; bu tür durumlarda tanıdık olan şey, örneğin yağda pomas bulunması gibi geçerli bir kusur olarak kabul edilmez. Bu konuda yargı yetkisi uzmanlardır ve Al-Kasani tüccarların ve oduncuların geleneklerine de dayanır. Hanefilere göre uzmanlar arasında uzlaşı gereklidir; farklılık varsa itiraz yoktur; Şafiilere göre çoğunluğa göre bir görüş yeterlidir ve ek yazarına göre iki tanık gereklidir; farklılıklar varsa ve başvurulacak kimse yoksa, görüş satıcının yeminli beyanıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7965} Kusurun etkisi koşulları: Kusur aynı eşyanın kendisinde olmalı, diğer yüklenicinin, ipoteğin veya kefil kişinin şahsında olmamalı; ve eski olmalı, yani sözleşme veya mülkiyetten önceki bir olayla karşılaştırılabilir olmalıdır. Teslimattan sonraki bir olay seçeneği belirlemez, ancak Malikiler koruma durumunu (üç kusurlu kölenin gözetimin, akıl hastalığı, cüzzam ve cüzzam durumlarında Sünnetin gözetimin) kabul eder ve Hanefiler kira mülklerini hariç tutar, böylece kusur kusur tarafından geçersiz sayılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7966} Kusur, alıcının mülkiyetten önceki eyleminden kaynaklandıysa seçenek kesinleşmez, çünkü bu kısıtlama Şafiilere göre öncekine bir istisna gibidir. Kusurun teslimattan sonra kalması ve iade edilene kadar devam etmesi gerekir; iade öncesinde kaybolursa, iade hakkı kaybedilir; Hanafiler ve Şafi'ler, kusurun alıcı tarafından tespit edilmesini ister, böylece kusur bilinir ki satıcı tarafından tespit edilen bir kusur muhtemelen giderilecektir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7966} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7967}, kusur kolayca giderilemiyorsa: örneğin, yıkama sırasında zarar görmemişse kumaş üzerindeki imal bir damga veya yıkanarak çıkarılan giysideki kirlilik gibi. Satıcı kusur sorununu küçümsüyor ve bu daha da önemlenirse, Malikiler alıcıyı başka bir kusur oluşmadıkça geri verme seçeneğini onaylar; bu nedenle Al-Wansharisi vakasında olduğu gibi iade ile boyama arasında seçim yapar. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7968} Kusurun görünür derecesine göre kanıtlama yöntemleri: görünür gözlemci delile ihtiyaç duymaz ve alıcı satıcıyla tartışır; iç kısım, sadece doktorlar ve veterinerler tarafından bilinir, iki Müslüman erkeğin ya da uzman bir adil adamın tanıklığıyla belirlenir; sadece kadınların bildiği şey adil bir kadının ifadesi için yeterlidir, her ikisi de daha temkinlidir ve bu, Hanefi'ye göre çürütme değil, anlaşmazlıklarla belirlenir; sadece deneyimle bilinen, kalan gibi, sadece iki erkeğin ya da iki erkek ve kadının tanıklığıyla doğrulanır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7968} Satıcı yemini: Alıcı kusuru kanıtlayamazsa, iki sahibi satıcının yeminini kabul eder ve Ebu Hanifa ona yemin etmez. Kusur alıcının aklına gelebilecek bir şeyse, belgelerle yemin eder; ama satıcının yapmadığı şeyi bilgiyle yemin eder, yanlış ise kusur tespit edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7968} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7969} Alıcının kusuru bilme durumu: Eğer sözleşme sırasında veya mülkiyet sırasında bunu biliyorsa, başka seçeneği yoktur; çünkü satın alma veya bilgiyle el koyması rıza göstergesidir; ve görünür görünmeden gizlenmemiş belirgin bir kusur, sözleşme tarafı tarafından bilinir sayılır ve satıcının kusurun yeri hakkında belirttiği de kabul edilir. Satıcı kusuru açıkça belirtir ve öküzü saban içindeymiş gibi satarmış gibi şart koşarsa, satıcı masumdur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7969} Alıcı kusuru bilmeden kusuru bilir: Alıcı kusuru bilmeden kusuru bilirse, kusuru alır ve elden geçirdikten sonra anlar. Kusur açık ve insanlara açıksa, iade edilmez. Sadece uzmanlar bilirse, iade edilebilir. Benzer şekilde, alıcı paranın sahte olduğunu numarası bilmeden bilirse, genel onayı kusurdan memnuniyet olarak kabul edilmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7970} Masumiyet olmama koşulu: Satıcı kusurlardan veya kusurlardan masumiyet şartı koşuyorsa ve bunların satışla birleşmesi bunu patent satışı adı verilen özel bir tür yapıyorsa seçenek uygulanmaz. Masumiyet genel olarak Hanefi okuluna göre, kusur şartçıdan mı yoksa bilinmeyen mi olursa olsun, izin verilir ve Malik ile Al-Shafi'i sadece hayvanlar söz konusunda, çünkü nadiren gizli veya görünür bir kusurdan ayrılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7971} Masumiyetin kökeni: Abdullah ibn Umar'ın masumiyetle bir köleyi kendisine satması ve alıcının adını vermediği bir hastalığı iddia etmesi sonucu etkisi. Osman ibn Affan, İbn Umar'ın bundan habersiz olduğunu yemin etmesi gerektiğine hükmetti, ancak İbn Ömer reddetti, çocuk geri döndü ve sonra onu daha fazla para karşılığında sattı. Âlimlerin ayrıştırma okulları farklılık gösterir: satıcının bilinen veya bilinmeyen her kusurdan muaf olduğu (Ebu Hanifa ve Ebu Savr); ya da kusurun ancak kusur adlandırılana kadar temizlendiği (İbn Ebi Leyla ve El-Thawri); ya da kusur tespit edildiği (görünür görüşte El-Şafii, Şuray, Ata, Ahmed ve İshaq); ya da kusurun sadece hayvandaki gizli kusurdan temizlendiği (görünür görüşe göre Malik ve El-Şafii); ya da masumiyetin ganimet, iflas ve borç satışına uygulandığı, ya da satışın tamamen geçersiz olduğu (Şafii görüşüne göre) olduğu düşünülür. {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.7971} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7972} Feragatname kategorileri: belirli bir kusura özgü veya her kusurdan genel olarak. Ekleme konusunda: sözleşmede bulunan kusurla belirtiliyorsa, mülkiyetten önceki durumu ele almaz; eğer sözleşmeden sonra oluşan kusur mülkiyetten önce belirtilerek geleceğe eklenirse, şart geçersiz ve sözleşme geçersizdir; serbest bırakılırsa, Abu Hanifa ve Abu Yusuf'a göre, sözleşmede ayakta olan ve teslim alana kadar olanları içerir; ve Malik, Muhammed, Zafar ve Hasan ibn Ziyad'a göre, sözleşme zamanında mevcut olanlarla sınırlıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7972} Hanefilere göre kusur seçeneğinin belirlendiği sözleşmeler: satış ve satın alma (ve satış geçersiz değil, geçersiz değildir ve takası da içerir), kira (eski veya kazara bir kusur nedeniyle opsiyon belirlenir ve mülkiyet öncesi ve sonrası yalnızca sahibi iade eder), mülkün bölünmesi, çeyiz, khul' için tazminat ve kasıtlı kan için tazminat (ve iade büyük kusur nedeniyle yapılır, küçük değil). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7972} {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 s. 7973} İbn Rüşd'ün kriteri: Üç tür vardır: tartışmasız kusur hakkına yer olmayan, bunlar değişim sözleşmeleri; tartışma alanı olmayanlar, örneğin tazminatsız veya sadaka olmadan verilen hediyeler; ve tartışmasız ve en açık olanlar, örneğin tazminat amacıyla verilen hediyeler. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7973} Kusurun reddedilme zamanlaması: Üç görüş vardır. Birincisi, bunun hemen gerçekleştiği, yani geleneksel olarak başlatılmasıdır. Kusuru bilen ve hakkı kaybedilene kadar iptal etmez, bu onun sorumluluğudur. Bu, Şafii okuludur ve Ahmed'den rivayet edilmiştir; Hanefi'den Al-Hawi'nin yazarı bunun nadir olduğunu söylemiştir ve Hanefiler arasında kabul görmüş görüş bunun hoşgörülüdür. İkincisi, onay kanıtı olmadıkça gevşek davranılmalıdır; bu, güvenilir ve Hanbali rivayetlerine göre Hanefi görüşüdür. Üçüncüsü ise bir veya iki gün sürer, bu Maliki görüşüdür; bundan sonra kaçınan onayını gösterir. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.7974} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7975} Kusurun sözleşmenin kararına etkisi: Kusur, mülkiyet devrini engellemez. Satılan ürünün mülkiyeti alıcı tarafından derhal belirlenir ve fiyatın mülkiyeti satıcıya aittir, çünkü satış unsuru mutlaktır ve metinle belirlenen şey sağlamlık koşuludur ve etkisi sözleşmenin bağlanmasını engeller, orijinal hüküm değil. Dolayısıyla, kusur seçeneği olan sözleşme bağlayıcı değildir, çünkü sağlamlık buna bağlıdır ve alıcı, satılan ürünün tamamını teslim etmek için fiyat öder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7975} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7976} Alıcının seçebileceği şey (üç yaklaşım): Birincisi, Hanafi ve Şafi'lere göre seçim fiyatı iade edip geri almak ya da rüşvet ödemeden tam fiyatı tutmak arasında olur ve arsh ile kusurlu olan sadece iade imkansız olduğunda geri verilir. İkincisi, Ahmad ve Ishaq'a göre, seçim arsh ile iade etmek veya tutma arasındadır ve tefeciliğe yol açacak olanı hariç tutmuşlardır, dolayısıyla kesinti ücretsizdir. Üçüncüsü, Malikilere göre, büyük (geri verme ve ücretsiz kesinti arasında seçim yapılır) ile medyumu (gayrimenkulde arsh iade edilir, prosodide ise yanıt kodun görünür anlamına göre olmalıdır) arasında ayrım yapar. Anlaşmazlığın nedeni: Kusurun eksikliği köken eksikliği mi yoksa tanım eksikliği mi? {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s.7976}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7977} İade koşulları: Seçenek belirlenmelidir; iade, alıcının aldığı tanımla uyumlu olmalı, böylece kaza veya şirket kusurunu artırmamalıdır; ve redd, satıcı onay verse bile işlemin sona erdirilmesini içermemelidir; satıcı onay verse bile, bu onun açısından tatmin edici bir zarar olduğu için kabul edilebilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7977} Anlaşmanın Bölünmesi: Satılan ürün bir işlemse, alıcı kusurlu bir kısmını zorla geri vermez, geri kalan kısmı satıcıya ait olmadıkça ve bir kısmı zorla geri verilirse, bu hakim ve takipçilerinin kararıdır, çünkü geçerli sebep satışın satıcıya yüklenmesinden kaynaklanan zarardır. Bir giysi ve ev gibi bir eşya, kaplarda tartılan veya tartılan olsun, iki gerçek ve tahmini eşya (kıyafet ve iki ev) ya da kapı şapası olarak tahmin edilen bir eşya olsun, tüm eşya alınmadan işlemi bölüştürmek yasaktır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7978} Maliki: Kasa kaybolursa, alıcı kusurlu eşyayı tamamen iade edebilir ve fiyattan kendi payını alabilir; kasa sağlam kalırsa, payının bir kısmını kendi payıyla birlikte iki koşulla iade edebilir: kusur küçük olsa bile yarıyı aşmamalı ve kusur işlemin nedeni olmamalıdır; aksi takdirde tamamını iade edebilir veya tamamını kabul edebilir. Hanbaliler, ayrılma olmayan durumlarda aynı eşyanın ve eksik iki eşyanın bölünmesiyle iade edilmesini yasaklar, ancak bölünmeyenler doğru görüşe göre iade edilemez. Şafiiler, satılan kusurlu ürünün bir kısmını, geri kalan ürün satıcıya ait olsa bile, geri vermezler; Hakim Hüseyin'in iade etme beyanı hariç, çünkü satıcıya karşı ayrımcılık yoktur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7978} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7979} Birden fazla sözleşmeyle işlemin ayrımcılığı: İki adam bir şey satın alıp kusur keşfederse, biri Abu Hanifa'ya göre sözleşmeyi tek taraflı olarak iptal eder, Ebu Yusuf ve Muhammed'e göre ise bunu yapar; Abu Hanifa'nın argümanı, ortaklık kusurunun aşırı olması nedeniyle aldığı tanıma ilişkin reddin geçerli olmadığıdır. Şafiiler ve Hanbaliler, birden fazla satıcı veya alıcı tarafından yapılan birden fazla işlemi veya birinin geri dönebileceği fiyatı belirterek ve münhasırlığı (ki bu kabul edilemez) ayırır; ve bir satıcı yoksa, payını mevcut kişiye ve fiyatın payına iade eder. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7979} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7980} Diğer yüklenicinin reddeden bilgisi: Hanafiler, reddin alınmadan önce veya sonra olup olmadığına bakılmaksızın, iptal hakkında bilgi sahibi olmalarını isterler. Bilgileri olmadan iptal askıya alınırsa, süre içinde bilgisiyle tamamlanır ve süre dolduğunda lisans sayılır. Şafiiler ve Hanbaliler ise alınmadan önce veya sonra onun bilgisi, rızası veya yargıç kararını talep etmezler. Hanafiler, teslim almadan önce iade etmek için sabit veya karşılıklı bir anlaşma gerektirmez; ancak teslim sonrası, işlem alınmışlıkla yapıldığı için bunlardan biri gereklidir. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.7980} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7981} İadenin doğası ve satışların defalarcısı üzerindeki etkisi: Hanefilere göre, mülkiyetten sonra karşılıklı redd, taraflar arasında başkaları lehine iptal edilir ve yargı yoluyla iade onların ve diğerlerinin hakkından iptal edilir; ve Hanefi olmayanlara göre iptal orijinal sözleşmeden kaldırılır. İkinci satışta etki, ikinci satıcı mahkeme tarafından delil, ret veya onay sunarak reddi kabul ederse, ürünü ilk satıcıya iade edebilir; karşılıklı anlaşmayla kabul ederse, üçüncü satıcıya ilişkin yeni bir satıştır. Teslim öncesinde, ilk alıcı her durumda ürünü ilk satıcıya iade edebilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7981} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7982} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7983} Kemer ile alıkoyma: Artış, azalma veya elden çıkarma nedeniyle ürünü iade etmek mümkün değilse, alıcının hakları iadeden iade değişimine geçer ve fiyatın düşürülmesi olarak adlandırılır; buna Hanefi ve Şafii okulu budur. Malikiler, kusurları küçük ve çok (kusur iadesi) ve orta (değer kusuru) olarak ayırırken tanımlar. Hanbaliler, fiyatı düşürerek alıkoyma ile mümkün olmasa bile iade etme arasında seçim yaparlar. 'Arş', satılan ürünün sağlam ve sonra kusurlu olarak değerlenmesi ile farkın değer oranı fiyattan alınmasıyla tanımlanır. Al-Ashbah'ın yazarı, değerin sözleşme günü olarak değerlendirildiğini, Al-Hasan Al-Basri ve Ahmad ise satın alma günü olarak kabul eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7983} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7984} İadeye itirazlar: doğal, yasal veya sözleşmesel. Satıcının elindeki yıkım iadeyi engeller ve satıcı alıcıdan hiçbir şey talep etmez; ilahi nedenlerle mülkiyetten sonra imha edildiğinde geri dönüş engeller ve bunun sonucunda fiyat düşer. Benzer şekilde, meşru kullanımla tüketim, örneğin yemek yemek ve giysi giymek, kırılana kadar, Abu Hanifa ile iki yoldaşı arasında bir anlaşmazlık vardır. Hanbaliler tadlilere göre ayırt eder; Malikiler ise satılan eşyaya kusur sebep olduysa tam fiyatı talep ederler. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7985} İadesi yasakları: Sürekli yapılmayan eklemeler, örneğin boyama, dikiş, inşa etme veya dikim, sahiplenmeden önce veya sonra tamamen yasaktır, çünkü bu özgün bir özgündür, bağımlılık değildir. Bu nedenle, kendisi olmadan veya onunla birlikte geri verilemez; satıcı kabul etse bile, şeriat tarafından tefecilik ima ettiği için yasaktır. Hanefi'ye göre çocuklar, meyve, süt ve suçun serpilmesi gibi ayrı eklemeler yasaktır, çünkü orijinaliyle geri vermek garanti edilmedikçe kârdır; Şafii ise buna katılmamış ve bunu kazanç gibi kabul etmiştir, bu yüzden iade engellenmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7986} İadeyi engellemeyen eklemeler: bağlı ve üretilen ürünler, örneğin ghee ve yaşlı tahıl. Hanbali'ye göre, doğumdan önce fetus ve döllenmeden önceki meyve; görünürdeki Hanefi rivayetine göre bunlar geri vermeyi engellemez. Alıcı onay verirse, orijinaliyle birlikte geri verebilir, reddederse tazminat ona aittir. Ağaç satışında çocuklar, süt ve meyve gibi mülkiyetten önce doğan ayrı eşyalar iade edilmesini engellemez, ancak orijinal tek başına geri verilmez; aksine, tüm para iade edilir veya hepsi tam fiyatla kabul edilir; Hanbaliler ana parayı artış olmadan iade eder, böylece alıcıda kalır. Gelir ve gelir gibi ayrı doğmamış eşyalar iade engellenmez ve alıcı bunları teminatla teslim eder (kharaj teminatlı); Abu Hanifa'ya göre fiyatsız kalır ve kendisine uygun değildir; iki sahibine göre satıcıya aittir; eğer kusuru kabul ederse, satıcı için kabul edilemez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7986} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7987} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7988} Artış yok olursa: ilahi bir bela nedeniyle hüküm değişmez; alıcının eylemiyle yok olursa, satıcı tam iadeyi kabul edebilir veya indirimi reddedebilir; ancak yabancı bir eylemle yok edilirse iade imkansızdır. {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s. 7988} Malikis: İbn Rüşd artışı beş türe ayırmıştır: seçim gerektirmeyen piyasa transferleri için artış; satılan üründe seçim gerektirmeyen artış; satılan üründe veya benzeri bir şeyde, örneğin bir çocukta meydana gelen büyüme nedeniyle satılan ürünün gerçek ürünündeki artış; satılan ürünün eklenmesi, örneğin palmiye meyvesi gibi, eğer yanında varsa, böylece başka seçeneği yoktur. Palmiye ağaçlarını ve meyvelerini iyileştirmeden ve tedavi edilmedikçe geri vermek isterse ya da hiçbir şeyi bırakmazsa; ve alıcının boyama ve dikiş gibi bir zanaatla getirdiği artış, böylece kusuru yerine koyarak koruma veya geri verme arasında seçim yapabilir ve artışın değerinde ortaktır. İbn Ghazi ve oduncuya göre değerlendirme yöntemi, duruma bağlı olarak iki veya dört değerlendirme gerektirir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7987} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7988} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7989} Sözleşmesel engel: Alıcı, kazara bir kusur nedeniyle, ister kendi eylemi, ister ilahi bir kusur, ister canlı bir nesne nedeniyle kusurluysa, iade imkansızdır ve talep sahibi eksiklik nedeniyle geri çekilmeye karar verir; çünkü iade şartı, iadenin mülkiyet şeklinde olmasıdır ve iade satıcıya zarar verir çünkü mülkiyetten sonraki olay sorumlu değildir. Hanafi ve Hanbali bir rivayette, alıcıya iade hakkı verilmez çünkü bu, onun yetersizliğinin sebebidir. Maliki ve Hanbali riwayetleri eski eşyayı tutmak ile tesadüfi eşyayla birlikte iade etmek arasında seçim yapar; Şafi'ler iadenin düşürüldüğünü kabul eder, bu nedenle satıcı kusurdan memnun kalmazsa, alıcı olayın miktarını belirtmeli ve satıcıya derhal bildirilmelidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7989} Opsiyonun feshi ve süresinin sona ermesi: Sözleşmenin feshiyle veya kemer ile alıkonulmasıyla sona erer; örneğin, kusurun kısa sürede düzeltilmesi gibi, satıcının kısa sürede bırakmayı veya bitirmeyi taahhüt ettiği tohumlu arazi gibi, ya da satıcının tamir ettiği kusurlu bir ev veya zarar vermeden gömülü ve çıkarılması zarar verdiğinde seçenek geçersiz sayılır; benzer şekilde, alıcı hayvanın tabanını çıkarırsa kusurlu hale gelir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7990} Faiz uğruna iadeden vazgeçme yükümlülüğü: Eğer menfaat kusuru elinde tutmaktan kaynaklanıyorsa ve yüklenici elden çıkarmada kısıtlanmışsa, örneğin iflas etmiş alıcı çünkü iade alacaklılara zarar veriyorsa, müşterisi için satın alan vasi ve spekülasyon yapan ve sahibi açıkça iade talep etmeyen biri. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7991} Opsiyondan feragat etme: Hanefilere göre, kusur opsiyonundan açıkça feragat etmek geçerlidir, çünkü bu alıcıya özgü bir haktır, görme seçeneğinin aksine; ayrıca arsh hakkından feragat etmek ve satıcıyı kusurdan aklamak da geçerlidir. Şafi'lere göre, opsiyon tazminatla feragat edilmez, çünkü bu bir iptal opsiyonudur; bu nedenle 'tawwi' opsiyonu sabit değildir, 'arsh' yerine opsiyondan ayrılmak yerine fiyat düşüşünün değerlendirilmesine benzer. {cite:cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7991} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7992} Kusurun açık kabulü: örneğin 'Kusuru kabul ettim', 'Kusur seçeneğinden feragat ettim' veya 'Sözleşmeyi kabul ettim' demek gibi, böylece opsiyon reddetme ve reddetme cümlesiyle sona erer, çünkü koşullu teminatı iade etme hakkı bir göstergedir ve kusurun kabul edilmesi koşuldan feragat anlamına gelir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7992} Rıza gösteren eylemler: üç tür. İlki, giysi giymek, hayvana binmek (geri vermek, sulamak veya yem almak dışında), sulama, ekmek, hasat etmek ve satılan ürünü bir kez bile olsa, satışa veya kiralamaya sunmak gibi tahrip edilmeden fayda ve fayda eylemleridir; çünkü bunlar hayvanı tutma niyetini gösterir. İkincisi ise hayvanı yırtıp öldürerek bu seçeneği geçersiz kılan imha ve fayda eylemleridir. Üçüncüsü ise, teslim ve uzlaşma ile birlikte satış ve hediye gibi bir mülkiyet sözleşmesiyle mülkiyetin kaldırılmasıdır; bu da ikinci alıcının hakkı nedeniyle satıcıya geri verilmesini imkansız kılar ve alıcı geri vermeyi reddettiği için bu miktar azaltılamaz. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7992} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7993} Hukukçuların işlemlerdeki yaklaşımları: Hanafi ve Hanbalılar, kusuru bilinmeyen devredilebilir bir işlemin iade yapılmasını engellediğini ve sonraki alıcıya devrettiğini savunur. Malikilere göre, eğer bedel karşılığıysa iade ve iade kaldırılır; tazminat olmadan ise fiyat düşmesine yol açar. Şafi'ler, satılan eşyanın iadesini umut eden bir işlem (örneğin vakıf) ile iade edilmesi beklenen bir işlemi (örneğin satış) ayırır, bu yüzden seçenek düşürülür. {cite:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.7993} Kusurun ve bunundaki anlaşmazlığın kanıtlanması: Taraflar arasındaki dava ve anlaşmazlık, kusurun önceliği ve ortaya çıkışı ile reddedilme nedeni gibi konularda ortaya çıkar. Maliki ve Şafi'ler, davacı ve inkârcıların algısına göre genel ispat yöntemlerini takip eden ayrıntılı yöntemlere sahiptir. Hanbaliler, sadece birinin tolere edebileceği bir kusurun, alıcının ayağını talep etmesi halinde küçük bir yara gibi olduğunu belirtmiştir. Görüş, davacının yemin etmeden yaptığı beyandır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7994} Kusur seçeneğinin devri: Hukukçular, opsiyona hak kazanan kişinin ölümüyle mirasçıya devredildiğini kabul eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7994}"
  id: "Opsi cacat adalah gabungan tambahan dari 'khiyar' dan 'ayib'; mayoritas menyebutnya nama ini, sementara Malikis sering menyebutnya opsi cacat. Ibn Najim dan Ibn al-Humam mendefinisikannya sebagai sesuatu yang tidak memiliki sifat asli yang tidak sesuai dengan apa yang dijanjikan kurang. Ibn Rushd mendefinisikannya sebagai sesuatu yang mengurangi penciptaan alami atau sah melalui kekurangan yang memengaruhi harga, dan al-Ghazali mendefinisikannya sebagai deskripsi yang patut dipersalahkan di mana kebiasaan biasanya mensyaratkan keaslian barang yang terjual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7959} Legitimasi penolakan cacat: Tidak ada perbedaan pendapat di antara para ahli hukum mengenai penolakan berdasarkan cacat secara umum. Mereka mengutip dari Al-Qur'an ayat \"Kecuali bahwa itu adalah perdagangan atas kesepakatan bersama kalian\" (Surah An-Nisa, 4:29), karena pengetahuan tentang cacat bertentangan dengan persetujuan bersyarat dalam kontrak. Dari Sunnah, terdapat hadits Aisha tentang seorang pria yang membeli seorang anak laki-laki, mengeksploitasinya, dan menemukan cacat pada anak laki-laki, sehingga Nabi menjawab, \"Hasilnya dijamin.\" Al-Kasani mengutip hadis Misrat, dan analoginya adalah pembeli memberikan harga untuk menerima barang yang sah tetapi tidak diberikan barang itu kepadanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7959} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm. 7960 Kewajiban untuk memberitahu penjual tentang cacat: Ia harus memberitahu pembeli tentang cacat dalam apa yang menetapkan opsi tersebut; tetapi jika cacat tersebut tidak membenarkan pilihan, maka mengabaikannya bukanlah tadli yang dilarang, seperti yang dikatakan Imam al-Haramayn. Mayoritas ahli hukum secara eksplisit menyatakan bahwa pemberitahuan adalah kewajiban; siapa pun yang tidak menjelaskannya adalah dosa, dan tidak ada perselisihan tentang hal itu, seperti yang dikatakan Ibn Qudamah dan Al-Subki. Mereka mengutip hadis Uqbah ibn 'Amir sebagai \"Seorang Muslim adalah saudara dari Muslim lain, dan tidak diperbolehkan bagi seorang Muslim untuk menjual dari saudaranya yang cacat kecuali dengan menjelaskannya kepadanya,\" dan hadis Wathilah ibn al-Asqa' mengenai larangan menjual sesuatu tanpa merinci isinya, serta hadis \"Siapa pun yang menipu kita bukanlah salah satu dari kita\" dalam Sabrat al-Ta'a. {cite:Fiqh-mawsua-kuwaitiyya-noor-v3 p.7960} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7961} Dampak penyembunyian terhadap keabsahan penjualan: Menjual sambil menyembunyikan cacat yang menyebabkan opsi adalah sah namun berdosa menurut mayoritas ahli hukum, karena larangan menyembunyikan tidak tercantum dalam kontrak. Jika pembeli mengetahui cacat setelah pembelian dan menyetujuinya, maka kesalahan penjual sah dan penjualan sah, seperti yang ditegaskan Al-Shawkani. Di antara tindakan Para Sahabat adalah Ibn Umar membeli unta liar, dan ketika ia diberitahu tentang cacatnya, ia menyetujui dan menandatangani kontrak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7961} Kewajiban untuk memberitahu non-kontraktor: Kewajiban tidak terbatas pada penjual tetapi juga berlaku bagi semua orang yang mengetahui cacat, karena banyak hadits dan teks mengenai kewajiban memberi nasihat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7961} Waktu untuk memberitahukan cacat: Sebelum penjualan terjadi jika penandatangan adalah penjual atau orang asing, sehingga pembeli tidak membeli. Jika orang asing tidak datang atau tidak dapat datang, maka kemudian pembeli dapat kembali. Kewajiban dikonfirmasi jika pihak luar hanya mengetahui cacat dan bukan penjual. Kebijaksanaan di balik legitimasi opsi cacat adalah untuk mencegah kerusakan pada pembeli, karena penjualan membutuhkan keselamatan barang yang dijual. Jika cacat tidak digambarkan aman, ada pilihan, karena persetujuan adalah bagian dari penjualan sebenarnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7962} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7963} Syarat untuk opsi cacat adalah tiga: munculnya cacat yang sah; pengetahuan pembeli tentang cacat pada saat kontrak dibuat; dan penjual tidak boleh menyatakan ketidakbersalahan cacat tersebut. Cacat dianggap sah jika menyebabkan penurunan nilai atau melewatkan barang yang sah, dan keamanan dari deskripsi tersebut adalah default pada barang yang dijual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7963} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7964} Kriteria cacat menurut Hanafi: apa pun yang menyebabkan penurunan nilai menurut para ahli, apakah nilainya berkurang atau tidak; cacat serius pada mas kawin adalah yang membuatnya dari baik menjadi sedang; dan batas penentu menurut Mukhtar al-Fatawa adalah yang masuk dalam penilaian penilai. Menurut syafi'i: apa yang mengurangi nilai atau nilai barang kehilangan tujuan yang sah, dan dalam banyak kasus serupa, hal itu tidak ada; Hanbalis puas dengan penurunan nilai meskipun nilainya meningkat, dan mereka menganggap kekurangan kekayaan sebagai cacat. Orang Malik menganggap rumah cacat di mana seseorang dibunuh karena orang menjauhkan diri, sehingga harganya menjadi terdevalued. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7963} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7964} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7965} Keaslian asli: Diwajibkan bahwa keamanan deskripsi insidental adalah default dalam jenis barang dan barang serupa; apa yang dikenal dalam kasus seperti ini tidak dianggap cacat yang sah, seperti keberadaan ampas dalam minyak dalam batas biasa. Otoritas penilaian dalam hal ini adalah para ahli, dan Al-Kasani juga mengandalkan kebiasaan pedagang dan penebang kayu. Menurut Hanafi, diperlukan konsensus di antara para ahli; jika mereka berbeda, tidak ada keberatan; menurut syafi'i, satu pendapat sudah cukup menurut mayoritas, dan menurut penulis suplemen, dua saksi diperlukan; jika mereka berbeda dan tidak ada yang bisa dirujuk, pendapat adalah pernyataan penjual beserta sumpahnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7965} Kondisi efek cacat: Harus ada pada barang yang sama, bukan pada kontraktor lain, atau pada hipotek, atau penjamin; dan harus tua, yaitu sebanding dengan kontrak atau peristiwa sebelum kepemilikan. Kejadian setelah penyerahan tidak menetapkan opsi tersebut, meskipun Malikis menerima kasus hak asuh (hak asuh tiga budak dalam cacat, hak asuh Sunnah dalam kasus kegilaan, kusta, dan kusta), dan Hanafi mengecualikan hak sewa, sehingga cacat dibatalkan oleh cacat tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7966} Opsi tidak dapat dibuktikan apakah cacat disebabkan oleh tindakan pembeli sebelum kepemilikan, karena pembatasan ini seperti pengecualian dari yang sebelumnya menurut Shafi'i. Cacat tersebut diwajibkan tetap ada setelah pengiriman dan berlanjut hingga pengembalian; jika hilang sebelum pengembalian, hak pengembalian hilang; Hanafi dan Shafi'i mengharuskan cacat tersebut dibuktikan oleh pembeli agar keberadaannya diketahui, karena cacat yang ditetapkan oleh penjual kemungkinan besar akan dihilangkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7966} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7967} asalkan cacat tersebut tidak dapat dihilangkan tanpa kesulitan: seperti cap buatan pada kain jika tidak rusak akibat dicuci, atau kotoran pada pakaian yang dihilangkan saat dicuci. Jika penjual meremehkan masalah cacat dan kemudian menjadi lebih signifikan, Malikis menegaskan opsi mengembalikan pembeli kecuali terjadi cacat lain, sehingga ia memilih antara mengembalikan dan mengecat, seperti dalam kasus Al-Wansharisi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7968} Metode membuktikan cacat menurut tingkat yang tampak: pengamat yang tampak tidak membutuhkan bukti, dan pembeli berselisih dengan penjual; bagian dalam, yang hanya diketahui oleh dokter dan dokter hewan, dibuktikan oleh kesaksian dua pria Muslim atau pria yang adil dan berpengalaman; apa yang hanya diketahui oleh wanita sudah cukup untuk pernyataan wanita yang adil, keduanya lebih berhati-hati, dan hal itu ditetapkan terkait perselisihan, bukan bantahan menurut Hanafi; apa yang hanya diketahui melalui pengalaman, seperti ketinggalan, hanya dapat dibuktikan oleh kesaksian dua pria atau dua pria dan wanita. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7968} Sumpah penjual: Jika pembeli tidak dapat membuktikan cacat kepadanya, kedua pemilik mempertimbangkan sumpah penjual, dan Abu Hanifa tidak bersumpah atas namanya. Jika cacat itu mungkin terjadi pada pembeli, ia bersumpah pada dokumen, dan jika tindakan penjual adalah sumpah, ia bersumpah pada dokumen tersebut; tetapi apa yang tidak dilakukan olehnya, ia bersumpah dengan pengetahuan, dan jika ia salah, cacat itu terbukti. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7968} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7969} Syarat pengetahuan pembeli tentang cacat: Jika ia mengetahuinya pada saat kontrak atau saat kepemilikan, ia tidak punya pilihan, karena proses pembelian atau pengambilan kepemilikan dengan pengetahuan menunjukkan persetujuan; dan cacat yang mencolok yang tidak tersembunyi saat dilihat dianggap diketahui oleh pihak yang berkontrak, serta apa yang ditunjukkan penjual mengenai lokasi cacat. Jika penjual secara eksplisit menyatakan cacat dan mensyaratkannya seolah-olah menjual sapi seperti yang terletak di bajak, penjual dianggap tidak bersalah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7969} Pembeli mengetahui cacat tanpa mengetahui cacat tersebut: Jika pembeli mengetahui cacat tanpa mengetahui cacat itu, ia mengambilnya dan kemudian mengetahui setelah dimiliki. Jika cacat tersebut jelas dan jelas bagi orang, maka tidak ada pengembalian dana. Jika hanya ahli yang tahu, ia dapat mengembalikannya. Demikian pula, jika pembeli tahu bahwa uang tersebut palsu tanpa mengetahui jumlahnya, persetujuan keseluruhannya tidak dianggap sebagai kepuasan atas cacat tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7970} Syarat tidak ada ketidakbersalahan: Opsi tidak berlaku jika penjual mensyaratkan ketidakbersalahan dari cacat atau cacat, dan konjungsinya dengan penjualan menjadikannya jenis khusus yang disebut penjualan paten. Ketidakbersalahan diperbolehkan menurut mazhab Hanafi secara umum, baik cacat itu disebabkan oleh penentu atau tidak diketahui, dan Malik serta Al-Shafi'i hanya mengizinkannya pada hewan, karena jarang dipisahkan dari cacat tersembunyi atau tampak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7971} Asal usul ketidakbersalahan: Dampak Abdullah ibn Umar ketika ia menjual seorang budak kepadanya dengan ketidakbersalahan, dan pembeli mengklaim penyakit yang tidak ia sebutkan. Uthman ibn Affan memutuskan bahwa Ibn Umar harus bersumpah tidak mengetahuinya, tetapi ia menolak, anak itu kembali, lalu menjualnya untuk mendapatkan uang lebih. Aliran disosiasi para ulama bervariasi: bahwa penjual dibebaskan dari setiap cacat yang diketahui atau tidak diketahui (Abu Hanifa dan Abu Thawr); atau bahwa cacat tersebut tidak dibersihkan sampai cacat tersebut disebutkan (Ibn Abi Layla dan Al-Thawri); atau bahwa cacat tersebut diidentifikasi (Al-Shafi'i dalam pandangan yang terlihat, dan Shurayh, Ata, Ahmad, dan Ishaq); atau bahwa cacat hanya dibersihkan dari cacat tersembunyi pada hewan (Malik dan Al-Shafi'i menurut pendapat yang tampak); atau bahwa ketidakbersalahan berlaku untuk penjualan rampasan, bangkrut, dan utang, atau bahwa penjualan tersebut sepenuhnya dibatalkan (menurut pandangan Shafi'i). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7971} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7972} Kategori penafian: spesifik pada cacat tertentu, atau umum dari setiap cacat. Mengenai penambahan: jika ditentukan oleh cacat yang tercantum dalam kontrak, maka tidak membahas kejadian sebelum kepemilikan; jika ditambahkan ke masa depan dengan menyebutkan cacat yang terjadi setelah kontrak sebelum kepemilikan, syarat tersebut batal dan kontrak tidak sah; jika dilepaskan, menurut Abu Hanifa dan Abu Yusuf, ketentuan tersebut mencakup yang berdiri di atas kontrak dan apa yang terjadi sampai diterima; dan menurut Malik, Muhammad, Zafar, dan Hasan ibn Ziyad, ketentuan dibatasi pada apa yang ada pada saat kontrak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7972} Kontrak di mana opsi cacat ditetapkan menurut Hanafi: jual beli (dan penjualan sah, tidak batal, dan termasuk pertukaran), sewa (di mana opsi ditetapkan karena cacat lama atau tidak sengaja, dan pemilik sendiri mengembalikan sebelum dan sesudah penguasaan), pembagian, penyelesaian properti, mas kawin, kompensasi untuk khul', dan kompensasi atas darah yang disengaja (dan restitusi disebabkan oleh cacat berat, bukan kecil). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7972} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm. 7973} Kriteria Ibn Rushd: Ada tiga jenis: yang tidak memiliki ruang untuk kesalahan tanpa sengketa, yaitu kontrak pertukaran; yang tidak memiliki ruang untuk diperdebatkan, seperti hadiah tanpa kompensasi atau amal; dan yang tidak diperdebatkan, dan yang paling jelas tidak diperbolehkan, seperti hadiah dengan niat kompensasi. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7973} Waktu untuk membantah kesalahan: Ada tiga pendapat. Yang pertama adalah bahwa ini adalah tindakan langsung, artinya memulai secara adat. Siapa pun yang mengetahui cacat dan tidak membatalkannya sampai haknya dicabut, itulah kewajibannya. Ini adalah mazhab Shafi'i dan diceritakan dari Ahmad, dan penulis Al-Hawi dari Hanafi mengatakan bahwa itu jarang, dan pandangan yang diterima di kalangan Hanafi adalah bahwa itu adalah keringanan. Yang kedua adalah bahwa seseorang harus longgar kecuali ada bukti persetujuan, yang merupakan pandangan Hanafi menurut narasi yang dapat dipercaya dan Hanbali dalam narasi yang diautentikasi. Yang ketiga adalah bahwa itu satu atau dua hari, yang merupakan pandangan Maliki; siapa pun yang menahan diri setelah itu menunjukkan persetujuannya. {cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 hlm.7974} {cite:Fiqh-Mawsua-Kuwaityya-Noor-V3 hlm.7975} Dampak cacat terhadap keputusan kontrak: Cacat tidak menghalangi pengalihan kepemilikan. Kepemilikan barang yang dijual segera ditetapkan oleh pembeli, dan kepemilikan harga menjadi milik penjual, karena unsur penjualan adalah mutlak tanpa syarat, dan yang ditetapkan oleh teks adalah syarat keabsahan, dan efeknya mencegah pengikatan kontrak, bukan putusan asli. Dengan demikian, kontrak dengan opsi cacat tidak mengikat, karena keabsahan bergantung padanya, dan pembeli membayar harga untuk menyerahkan seluruh barang yang terjual kepadanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7975} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7976} Apa yang dapat dipilih pembeli (tiga pendekatan): Pertama, menurut Hanafi dan Shafi'i, pilihannya adalah antara mengembalikan dan mengambil kembali harga, atau memegang harga penuh tanpa membayar suap, dan cacat dengan arsh hanya ditahan jika pengembalian tidak mungkin. Kedua, menurut Ahmad dan Ishaq, pilihannya adalah antara mengembalikan atau menahan dengan arsh, dan mereka mengecualikan apa yang menyebabkan riba, sehingga penahanan adalah gratis. Yang ketiga, menurut Maliki, membedakan antara besar (seseorang memilih antara mengembalikan dan menahan secara gratis) dan medium (dalam properti, arsh dikembalikan, dan dalam prosodi, responsnya harus sesuai dengan makna kode yang jelas). Alasan ketidaksepakatan: Apakah kekurangan cacat merupakan kekurangan asal atau kekurangan deskripsi? {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7976}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7977} Syarat pengembalian: Opsi harus ditetapkan; pengembalian harus sesuai dengan deskripsi yang diterima pembeli, sehingga tidak menambah cacat kecelakaan atau cacat perusahaan; dan penolakan tidak boleh mencakup pembubaran transaksi sebelum kepemilikan selesai, meskipun penjual menyetujui, hal itu diperbolehkan, karena merupakan kerugian yang memuaskan dari pihaknya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7977} Pembagian Kesepakatan: Jika barang yang dijual adalah transaksi, pembeli tidak mengembalikan sebagian barang dengan cacat dengan paksa, kecuali sisanya milik penjual, dan sebagian dikembalikan dengan paksa, yang merupakan keputusan hakim dan pengikutnya, karena alasan yang sah adalah kerugian yang timbul dari penjualan yang dijatuhkan kepada penjual. Tidak diperbolehkan membagi transaksi sebelum menerima seluruh barang, baik itu satu barang seperti pakaian dan rumah, atau ditimbang atau ditimbang dalam wadah, atau dua barang aktual dan diperkirakan seperti pakaian dan dua rumah, atau satu barang yang diperkirakan sebagai pintu tamparan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7978} Maliki: Jika brankas hilang, pembeli dapat mengembalikan barang cacat secara penuh dan mengambil bagiannya dari harga; jika brankas tetap utuh, ia dapat mengembalikan sebagian bagian bersama bagiannya dengan dua syarat: cacat tidak boleh melebihi setengah meskipun kecil, dan cacat tidak boleh menjadi penyebab transaksi; jika tidak, ia dapat mengembalikan semuanya atau menerima semuanya. Hanbalis melarang pengembalian dengan pembagian barang yang sama dan dua barang yang kurang dalam kasus yang tidak dipisahkan, tetapi apa yang tidak dikurangi dengan pembagian tidak dapat dikembalikan menurut pandangan yang benar. Para Shafi'i tidak mengembalikan sebagian barang yang cacat yang terjual, meskipun sisanya milik penjual, kecuali pernyataan Hakim Husayn untuk mengembalikannya, karena tidak ada diskriminasi terhadap penjual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7978} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7979} Diferensiasi transaksi dengan beberapa kontrak: Jika dua orang membeli sesuatu dan menemukan cacat, salah satu dari mereka secara sepihak membatalkan kontrak menurut Abu Hanifa, sementara menurut Abu Yusuf dan Muhammad ia melakukannya; argumen Abu Hanifa adalah bahwa bantahan tersebut tidak berlaku untuk deskripsi yang diterimanya karena cacat dalam kemitraan terlalu besar. Shafi'i dan Hanbalis membedakan antara transaksi ganda oleh beberapa penjual atau pembeli atau dengan menentukan harga, di mana salah satu dari mereka dapat mengembalikan, dan eksklusivitas, yang tidak diperbolehkan; dan jika salah satu penjual tidak ada, ia mengembalikan bagiannya kepada orang yang hadir beserta bagian harga tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7979} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7980} Pengetahuan kontraktor lain tentang penolakan: Hanafi mensyaratkan pengetahuan mereka tentang pembatalan, baik penolakan dilakukan sebelum maupun sesudah penerimaan. Jika pembatalan tanpa sepengetahuan mereka ditangguhkan, pembatalan tersebut diselesaikan dengan pengetahuan mereka selama periode tersebut dan menjadi izin jika periode tersebut telah berlalu. Adapun Shafi'i dan Hanbali, mereka tidak memerlukan pengetahuan, persetujuan, atau keputusan hakim sebelum atau sesudah penerimaan. Hanafi tidak memerlukan kesepakatan tetap atau bersama untuk mengembalikan sebelum penguasaan; namun, setelah penguasaan, salah satu dari mereka diperlukan karena transaksi diselesaikan dengan penerimaan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7980} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7981} Sifat pengembalian dan dampaknya terhadap suksesi penjualan: Menurut Hanafi, penolakan bersama setelah kepemilikan adalah pembatalan antara pihak kontrak demi pihak lain, dan pengembalian oleh pengadilan adalah pembatalan atas hak mereka dan pihak lain; dan menurut non-Hanafi, pembatalan dicabut dari kontrak asli. Efek dalam penjualan kedua adalah jika penjual kedua menerima penolakan oleh pengadilan dengan memberikan bukti, penolakan, atau pengakuan, ia dapat mengembalikannya kepada penjual pertama; jika menerima atas persetujuan bersama, ia tidak diperbolehkan melakukannya karena itu adalah penjualan baru terkait penjualan ketiga. Sebelum dimiliki, pembeli pertama dapat mengembalikannya kepada penjual pertama dalam hal apapun. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7981} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7982} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7983} Withholding dengan Arch: Jika tidak mungkin mengembalikan barang karena hal-hal yang timbul dari kenaikan, penurunan, atau pembuangan, hak pembeli bergeser dari return ke return dengan menurunkan harga, yang disebut pembalikan harga yang lebih rendah; ini adalah aliran pemikiran Hanafi dan Shafi'i. Malikis mendefinisikannya ketika membagi cacat menjadi kecil dan banyak (pengembalian cacat) dan sedang (cacat nilai). Hanbalis memilih antara menahan dengan menurunkan harga dan mengembalikannya meskipun tidak memungkinkan. 'arsh' didefinisikan oleh penilaian barang yang dijual sebagai baik lalu cacat, dan rasio selisih terhadap nilai diambil dari harga. Penulis Al-Ashbah berpendapat bahwa nilai dipertimbangkan pada hari kontrak, sementara Al-Hasan Al-Basri dan Ahmad menganggapnya sebagai hari pembelian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7983} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7984} Keberatan terhadap pengembalian: alami, hukum, atau kontraktual. Penghancuran di tangan penjual mencegah pengembalian, dan penjual tidak menuntut apa pun dari pembeli; kehancuran setelah kepemilikan karena sebab ilahi mencegah pengembalian, dengan penyebab berikutnya adalah penurunan harga. Demikian pula, konsumsi dengan penggunaan yang sah, seperti makan makanan dan pakaian sampai pecah, terjadi perselisihan antara Abu Hanifa dan kedua rekannya. Hanbal membedakan menurut tadlis; keluarga Malik menuntut harga penuh jika cacat menyebabkan barang terjual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7985} Larangan pengembalian: Penambahan berkelanjutan yang tidak dihasilkan, seperti pewarnaan, menjahit, membangun, atau menanam, sepenuhnya dilarang sebelum atau sesudah kepemilikan, karena itu adalah barang asli itu sendiri, bukan kebergantungan. Oleh karena itu, tidak dapat dikembalikan tanpa atau bersamanya; meskipun penjual setuju menerimanya, tidak diperbolehkan, karena dilarang oleh Syariah akibat implikasi riba. Penambahan terpisah yang dihasilkan setelah kepemilikan, seperti anak-anak, buah, susu, dan taburan kejahatan, dilarang menurut Hanafi, karena mengembalikannya bersama yang asli adalah keuntungan kecuali dijamin; dan Syafi'i tidak setuju dan menganggapnya sebagai penghasilan, sehingga tidak menghalangi pengembalian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7986} Penambahan yang tidak menghalangi pengembalian: barang yang terhubung dan diproduksi, seperti ghee dan biji-bijian elder. Menurut Hanbalis, janin sebelum persalinan dan buah sebelum pembuahan; ini tidak menghalangi pengembalian menurut narasi Hanafi yang tampak. Jika pembeli setuju, ia dapat mengembalikannya bersama asli, dan jika menolak, ia menerima kompensasi. Barang terpisah yang lahir sebelum kepemilikan, seperti anak-anak, susu, dan buah dalam penjualan pohon, tidak menghalangi pengembalian, tetapi yang asli tidak dikembalikan sendiri; sebaliknya, keseluruhan dikembalikan atau semua diterima dengan harga penuh; Hanbalis mengembalikan pokok tanpa tambahan, sehingga tetap berada di tangan pembeli. Barang yang belum lahir terpisah, seperti hasil dan pendapatan, tidak menghalangi pengembalian, dan pembeli menyerahkannya dengan jaminan (kharaj dengan jaminan); menurut Abu Hanifa, barang tersebut tetap tanpa harga dan tidak layak untuknya; dan menurut kedua pemilik, barang tersebut milik penjual; dan jika dia menerima cacat tersebut, maka tidak dapat diterima olehnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7986} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7987} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7988} Jika kenaikan tersebut dihancurkan: karena wabah ilahi, keputusan tidak berubah; jika dihancurkan oleh tindakan pembeli, penjual memiliki pilihan untuk menerima pengembalian penuh atau menolak pengurangan tersebut; tetapi jika dihancurkan oleh tindakan asing, pengembalian dana tidak mungkin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.. 7988} Malikis: Ibn Rushd membagi kenaikan menjadi lima jenis: kenaikan untuk transfer pasar yang tidak memerlukan pilihan; kenaikan untuk barang yang dijual tidak memerlukan pilihan; peningkatan pada barang yang dijual karena pertumbuhan yang terjadi atau sesuatu yang sejenis, seperti anak kecil, di mana terjadi perselisihan; tambahan dari jenis yang dijual, seperti buah palem jika muncul bersamanya, sehingga dia tidak punya pilihan. Jika dia ingin mengembalikan pohon palem dan buahnya kecuali pohon tersebut disembuhkan dan dikembalikan dengan pengobatan, atau menahan dan tidak memiliki apa-apa; dan kenaikan yang diperkenalkan pembeli dengan kerajinan seperti pewarnaan dan menjahit, sehingga dia memiliki pilihan antara mempertahankan cacat dengan penggantian atau mengembalikannya, dan dia menjadi mitra dalam nilai kenaikan tersebut. Metode penilaian menurut Ibn Ghazi dan penebang kayu memerlukan dua atau empat penilaian tergantung pada kasusnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7987} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7988} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7989} Hambatan kontraktual: Jika pembeli cacat akibat cacat tidak sengaja, baik karena tindakannya, cacat ilahi, atau benda hidup, pengembalian tidak mungkin, dan penggugat harus menarik kembali karena kekurangan; karena syarat restitusi adalah pengembalian harus dalam bentuk kepemilikan, dan karena restitusi merugikan penjual karena insiden setelah kepemilikan tidak bertanggung jawab. Hanafi dan Hanbali, dalam satu narasi, tidak memberikan hak pengembalian kepada pembeli karena itu menjadi penyebab ketidakmampuannya. Narasi Maliki dan Hanbali memberikan pilihan antara memegang barang lama atau mengembalikannya bersama barang yang bersifat insidental; Shafi'i menganggap pengembalian dibatalkan, jadi jika penjual tidak puas dengan cacat tersebut, pembeli harus mencantumkan jumlah insiden tersebut, dan penjual harus segera diberitahu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7989} Penghentian dan kadaluarsa opsi: Kontrak berakhir dengan pengakhiran kontrak atau dengan menahan kontrak dengan lengkungan, baik dengan pernyataan persetujuan atau tindakan yang menunjukkannya; dapat dibatalkan dengan menghilangkan cacat sebelum pengembalian, seperti memperbaiki cacat dalam waktu singkat, seperti tanah dengan benih yang penjual janji akan tinggalkan atau selesaikan dalam waktu singkat, atau rumah dengan cacat yang diperbaiki penjual, atau tanah yang terkubur tanpa kerusakan sehingga meninggalkan dan menghilangkannya menyebabkan kerugian, maka opsi tersebut batal; demikian pula, jika pembeli melepas sol hewan, maka opsi tersebut menjadi cacat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7990} Kewajiban untuk membatalkan pengembalian demi bunga: Jika kepentingan terletak pada kepemilikan cacat dan kontraktor dibatasi dalam pelepasan, seperti pembeli yang bangkrut karena restitusi mengorbankan selisih kepada kreditur, wali yang membeli untuk kliennya karena pengembalian tersebut merugikan haknya, dan seseorang yang berspekulasi dan pemilik tidak secara eksplisit meminta pengembalian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7991} Melepaskan opsi: Menurut Hanafis, sah untuk secara eksplisit melepaskan opsi cacat karena merupakan hak eksklusif pembeli, berbeda dengan opsi penglihatan; juga sah untuk melepaskan hak arsh dan membebaskan penjual dari cacat. Menurut Shafi'i, opsi tidak dibebaskan dengan kompensasi, karena merupakan opsi pembatalan, sehingga opsi 'tawwi' mirip dengan bahwa tidak tetap, bukan 'arsh' alih-alih meninggalkan opsi, melainkan evaluasi penurunan harga. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7991} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7992} Penerimaan eksplisit terhadap cacat: seperti mengatakan 'Saya menerima cacat,' 'Saya melepaskan opsi cacat,' atau 'Saya mengizinkan kontrak,' sehingga opsi berakhir dengan kalimat penolakan dan penolakan, karena hak untuk mengembalikan jaminan bersyarat adalah indikasi, dan penerimaan cacat setelah mengetahuinya adalah pengabaian kondisi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7992} Tindakan yang menunjukkan persetujuan: tiga jenis. Yang pertama adalah tindakan penggunaan dan manfaat tanpa kehancuran, seperti mengenakan pakaian, menunggang hewan (selain mengembalikan, menyiram, atau membeli pakan), menyiram, menanam, memanen, dan menawarkan barang yang terjual untuk dijual atau disewakan, bahkan sekali, karena ini menunjukkan niat untuk mempertahankannya. Yang kedua adalah penghancuran, seperti merobek dan membunuh hewan, sehingga menghilangkan opsi tersebut. Yang ketiga adalah menghilangkan kepemilikan melalui kontrak kepemilikan seperti jual dan hadiah dengan pengiriman dan rekonsiliasi, sehingga tidak mungkin mengembalikan kepada penjual karena hak pembeli kedua, dan tidak dapat dikurangi karena pembeli menolak mengembalikannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7992} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7993} Pendekatan ahli hukum dalam transaksi: Hanafi dan Hanbal berpendapat bahwa transaksi yang dapat dipindahtangankan, meskipun tidak diketahui cacatnya, mencegah pengembalian dan mentransfernya kepada pembeli berikutnya. Menurut Maliki, jika dipertimbangkan, pengembalian dan pengembalian dikecualikan; jika tanpa kompensasi, hal ini mengakibatkan penurunan harga. Syafi'i membedakan antara transaksi yang sangat membutuhkan pengembalian barang yang terjual (seperti wakaf), yang mencegah pengembalian, dan transaksi yang diharapkan akan dikembalikan (seperti penjualan), sehingga opsi dibatalkan. {cite::fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7993} Membuktikan cacat dan ketidaksepakatan di dalamnya: Gugatan dan perselisihan antara para pihak yang mengikat muncul berdasarkan masalah cacat, seperti preseden dan kejadian, serta alasan penolakan. Malikis dan Shafi'i memiliki metode rinci yang mengikuti metode pembuktian umum berdasarkan persepsi penggugat dan penyangkal. Hanbalis menyatakan bahwa cacat yang hanya dapat ditoleransi oleh salah satu dari mereka adalah luka ringan jika pembeli mengklaim kakinya. Pendapat tersebut adalah pernyataan penggugat tanpa sumpah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7994} Transfer opsi cacat: Para ahli hukum sepakat bahwa opsi tersebut dialihkan kepada ahli waris setelah kematian orang yang berhak atas opsi tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7994}"
