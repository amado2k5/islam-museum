id: concept/khiyar-al-ayb-fiqh
class: concept
kind: legal
label:
  ar: خيار العيب
  en: Khiyar al-ayb (option of defect)
  ur: خیار العیب
summary:
  ar: 'خيار العيب مركب إضافي من «خيار» و«عيب»، والجمهور يسمونه بهذا الاسم، والمالكية يسمونه غالبا خيار النقيصة. وعرّفه ابن نجيم وابن الهمام بأنه ما يخلو عنه أصل الفطرة السليمة مما يعد به ناقصا، وعرّفه ابن رشد بأنه ما نقص عن الخلقة الطبيعية أو عن الخلق الشرعي نقصانا له تأثير في الثمن، وعرّفه الغزالي بأنه كل وصف مذموم اقتضى العرف سلامة المبيع منه غالبا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7959} مشروعية الرد بالعيب: لا خلاف بين الفقهاء في الرد بالعيب في الجملة. استدلوا من القرآن بقوله تعالى «إلا أن تكون تجارة عن تراض منكم» (سورة النساء، 4:29)، لأن العلم بالعيب ينافي الرضا المشروط في العقود. ومن السنة حديث عائشة في الرجل الذي اشترى غلاما فاستغله ثم وجد به عيبا فرده، فقال النبي إن «الغلة بالضمان». واستدل الكاساني بحديث المصراة، والقياس عليه أن المشتري بذل الثمن ليسلم له مبيع سليم فلم يسلم له ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7959}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7960} وجوب إعلام العيب على البائع: يجب عليه أن يعلم المشتري بالعيب فيما يثبت فيه الخيار؛ أما إن لم يكن العيب موجبا للخيار فترك التعرض له ليس تدليسا محرما، كما قال إمام الحرمين. وصرح جمهور الفقهاء بأن الإعلام واجب، فمن لم يبينه فهو آثم، ولا خلاف فيه كما قال ابن قدامة والسبكي؛ واستدلوا بحديث عقبة بن عامر «المسلم أخو المسلم، ولا يحل لمسلم باع من أخيه بيعا وفيه عيب إلا بينه له»، وبحديث واثلة بن الأسقع في تحريم بيع شيء دون بيان ما فيه، وبحديث «من غشنا فليس منا» في صبرة الطعام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7960}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} أثر الكتمان على صحة البيع: البيع مع كتمان العيب المسبب للخيار صحيح مع الإثم عند جمهور الفقهاء، لأن النهي عن الكتمان لا عن العقد. وإذا علم المشتري بالعيب بعد الشراء ورضيه فالإثم على البائع والبيع صحيح، كما جزم الشوكاني. ومن فعل الصحابة أن ابن عمر اشترى إبلا هيما، فلما أخبر بعيبها رضيها وأمضى العقد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} وجوب الإعلام على غير العاقد: لا يقتصر الوجوب على البائع، بل يمتد إلى كل من علم بالعيب، لحديث واثلة والنصوص العديدة في وجوب النصح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} وقت الإعلام بالعيب: يكون قبل البيع إن كان المعلم بائعا أو أجنبيا، ليكف المشتري عن الشراء، فإن لم يحضر الأجنبي أو لم يتيسر له فبعده ليتمكن المشتري من الرد؛ ويتأكد الوجوب إذا انفرد الأجنبي بعلم العيب دون البائع. والحكمة من مشروعية خيار العيب دفع الضرر عن المشتري، لأن البيع يقتضي سلامة المبيع، فإذا فات وصف السلامة بالعيب تخير، إذ الرضا داخل في حقيقة البيع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7962}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7963} شروط خيار العيب ثلاثة: ظهور عيب معتبر؛ وجهل المشتري بالعيب عند العقد؛ وألا يكون البائع قد شرط البراءة من العيب. ويعتبر العيب معتبرا إذا أثر في نقص القيمة أو فوات غرض صحيح، وكانت السلامة من ذلك الوصف هي الأصل في جنس المبيع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7963}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7964} ضابط العيب عند الحنفية: كل ما يوجب نقصا في القيمة عند أهل الخبرة، سواء نقص العين أم لا؛ والعيب الفاحش في المهر ما يخرجه من الجيد إلى الوسط؛ والحد الفاصل عند مختار الفتاوى ما يدخل تحت تقويم المقومين. وعند الشافعية: ما ينقص القيمة أو العين نقصانا يفوت به غرض صحيح، والغالب في أمثاله عدمه؛ والحنابلة يكتفون بنقص العين ولو زادت القيمة، ويرون نقص المالية عيبا. والمالكية يعدون من العيب البيت الذي قتل فيه إنسان لأن النفوس تنفر منه فيبخس ثمنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7963}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7964}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7965} السلامة الأصلية: يشترط أن تكون السلامة من الوصف العارض هي الأصل في نوع المبيع وأمثاله؛ فما هو مألوف في أمثاله لا يعد عيبا معتبرا، كوجود الثفل في الزيت بالحد المعتاد. ومرجع الحكم في ذلك أهل الخبرة، والكاساني يجعل التعويل على عرف التجار، والحطاب كذلك. وعند الحنفية يشترط إجماع أهل الخبرة، فإن اختلفوا فلا رد؛ وعند الشافعية يكفي قول واحد عند الجمهور، وعند صاحب التتمة يشترط شاهدان؛ وإن اختلفا ولم يوجد من يرجع إليه فالقول قول البائع مع يمينه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7965} شروط تأثير العيب: أن يكون في نفس المبيع لا في شخص العاقد الآخر أو في الرهن أو الكفيل؛ وأن يكون قديما، أي مقارنا للعقد أو حادثا قبل القبض، فالحادث بعد التسليم لا يثبت به الخيار، وإن كان المالكية يأخذون بقضية العهدة (عهدة الثلاث في عيوب الرقيق، وعهدة السنة في الجنون والجذام والبرص)، والحنفية يستثنون الإجارة فيفسخ بالعيب الحادث فيها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7966} ولا يثبت الخيار إن كان العيب بفعل المشتري قبل القبض، فهذا القيد كالاستثناء مما قبله عند الشافعية. ويشترط أن يبقى العيب بعد التسليم ومستمرا حتى الرد، فلو زال قبل الرد سقط حق الرد؛ والحنفية والشافعية يشترطون ثبوت العيب عند المشتري ليعلم قيامه، لأن العيب الثابت عند البائع يحتمل الزوال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7966}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7967} شرط ألا تمكن إزالة العيب بلا مشقة: كطابع المصنع على القماش إذا كان لا يضره الغسل، أو نجاسة في الثوب تزال بالغسل. وإن هون البائع من شأن العيب ثم ظهر أكبر، فالمالكية يثبتون خيار الرد للمشتري ما لم يحدث عيب آخر، فيتخير بين الرد والأرش، كما في نوازل الونشريسي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7967}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7968} طرق إثبات العيب بحسب درجة ظهوره: الظاهر المشاهد لا يحتاج إلى بينة، ويخاصم به المشتري البائع؛ والباطن الذي لا يعرفه إلا الأطباء والبياطرة يثبت بشهادة رجلين مسلمين أو رجل عدل من أهل الخبرة؛ والذي لا يطلع عليه إلا النساء يكفي فيه قول امرأة عدل، والاثنتان أحوط، ويثبت في حق الخصومة لا في حق الرد عند الحنفية؛ والذي لا يعرف إلا بالتجربة كالإباق لا يثبت إلا بشهادة رجلين أو رجل وامرأتين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7968} يمين البائع: إذا عجز المشتري عن إثبات العيب عنده، فالصاحبان يريان استحلاف البائع، وأبو حنيفة لا يستحلفه. وإذا كان العيب مما يجوز أن يحدث مثله عند المشتري استحلف على البتات، وإن كان من فعل البائع حلف على البتات؛ أما ما ليس بفعله فيحلف على العلم، فإن نكل ثبت العيب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7968}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7969} شرط جهل المشتري بالعيب: فإن علم به عند العقد أو عند القبض فلا خيار له، لأن إقدامه على الشراء أو القبض مع العلم رضا دلالة؛ والعيب البارز الذي لا يخفى عند الرؤية يعد المتعاقد عالما به، وكذلك ما دل عليه البائع من موضع العيب. وإذا صرح البائع بالعيب واشترطه كما لو باع ثورا على أنه يرقد في المحراث، فالبائع برئ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7969} علم المشتري بالعيب دون أن يدري أنه عيب: إذا علم المشتري بالأمر المعتبر عيبا دون أن يعرف أنه عيب فقبضه ثم عرف بعد القبض، فإن كان العيب بيّنا لا يخفى على الناس فلا رد له، وإن كان لا يعرفه إلا أهل الخبرة فله الرد. ومثله من علم أن النقد زيف دون أن يعرف عدده، فلم يكن رضاه بالجملة رضا بالعيب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7970} شرط عدم البراءة: لا يقوم الخيار إن اشترط البائع البراءة من العيب أو العيوب، واقترانها بالبيع يجعله نوعا خاصا يسمى بيع البراءة. وتجوز البراءة عند الحنفية مطلقا، معلوما كان العيب للمشترط أو مجهولا، وأجازها مالك والشافعي في الحيوان وحده، لأنه قلما ينفك عن عيب خفي أو ظاهر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7970}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7971} أصل البراءة: أثر عبد الله بن عمر حين باع غلاما له بالبراءة، فادعى المشتري داء لم يسمه، فحكم عثمان بن عفان أن يحلف ابن عمر أنه لا يعلم به، فأبى وارتجع الغلام، ثم باعه بعد ذلك بمال أكثر. وتتعدد مذاهب العلماء في البراءة: أن يبرأ من كل عيب علمه البائع أو لم يعلمه (أبو حنيفة وأبو ثور)؛ أو لا يبرأ حتى يسمي العيب (ابن أبي ليلى والثوري)؛ أو حتى يضع يده على العيب (الشافعية في المرئي، وشريح وعطاء وأحمد وإسحاق)؛ أو لا يبرأ إلا من العيب الباطن في الحيوان (مالك والشافعي في القول الظاهر)؛ أو تكون البراءة في بيع المغنم والمفلس والديون، أو يبطل البيع أصلا (قول للشافعية). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7971}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7972} أقسام البراءة: خاصة من عيب معين، أو عامة من كل عيب. ومن حيث الإضافة: إن قيدت بالعيب الموجود عند العقد فلا تتناول الحادث قبل القبض؛ وإن أضيفت إلى المستقبل بتنصيص على العيب الحادث بعد العقد قبل القبض فالشرط باطل والعقد فاسد؛ وإن أطلقت فعند أبي حنيفة وأبي يوسف تشمل القائم عند العقد وما يحدث إلى القبض، وعند مالك ومحمد وزفر والحسن بن زياد تقتصر على الموجود عند العقد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7972} العقود التي يثبت فيها خيار العيب عند الحنفية: البيع والشراء (والبيع الصحيح لا الفاسد، ويشمل الصرف)، والإجارة (يثبت فيها الخيار بعيب قديم أو حادث، وينفرد صاحبه بالرد قبل القبض وبعده)، والقسمة، والصلح عن المال، والمهر، وبدل الخلع، وبدل الصلح عن دم العمد (والرد فيها بالعيب الفاحش لا اليسير). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7972}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7973} ضابط ابن رشد: العقود ثلاثة أنواع: ما هو مجال لخيار العيب بلا خلاف وهو عقود المعاوضة؛ وما ليس مجالا له بلا خلاف كالهبة بلا عوض والصدقة؛ وما فيه خلاف، والأظهر أنه ليس مجالا له، كالهبة بقصد العوض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7973} توقيت الرد بالعيب: فيه ثلاثة آراء. الأول أنه على الفور، أي المبادرة على العادة، فمن علم العيب ولم يفسخ حتى سقط حقه وهو من ضمانه، وهو مذهب الشافعية وروايه عن أحمد، وقال به صاحب الحاوي من الحنفية، وقال ابن نجيم إنه غريب، والمعتمد عند الحنفية أنه على التراخي. والثاني أنه على التراخي ما لم يوجد دليل الرضا، وهو مذهب الحنفية على المعتمد والحنابلة في الرواية المصححة. والثالث أنه يوم أو يومان، وهو مذهب المالكية، فمن أمسك بعد ذلك دل على رضاه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7974}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7975} أثر العيب على حكم العقد: لا يمنع العيب انتقال الملك، فملك المبيع يثبت للمشتري حالا، وملك الثمن للبائع، لأن ركن البيع مطلق عن الشرط، والثابت بالنص شرط السلامة، وأثره منع لزوم العقد لا منع أصل حكمه. فالعقد مع خيار العيب غير لازم، لأن السلامة مشروطة فيه دلالة، والمشتري يدفع الثمن ليسلم له المبيع كله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7975}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7976} ما يخير فيه المشتري (ثلاثة اتجاهات): الأول، عند الحنفية والشافعية، التخيير بين الرد واسترداد الثمن، أو الإمساك بجميع الثمن دون أرش، ولا يمسك المعيب مع الأرش إلا عند تعذر الرد. والثاني، عند أحمد وإسحاق، التخيير بين الرد أو الإمساك مع الأرش، واستثنوا ما يؤدي إلى الربا فيكون الإمساك مجانا. والثالث، عند المالكية، يفرق بين الكثير (يخير بين الرد والإمساك مجانا) والمتوسط (في العقار يرجع بالأرش، وفي العروض يجب الرد على ظاهر المدونة). وسبب الخلاف: هل نقص العيب نقص أصل أم نقص وصف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7976}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7977} شرائط الرد: قيام الخيار؛ وأن يكون المردود على الوصف الذي قبضه المشتري، فلا يزيد عيب حادث أو عيب شركة؛ وألا يتضمن الرد تفريق الصفقة قبل تمام القبض، وإن رضي البائع جاز، لأنه ضرر مرضي من جهته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7977}'
  en: 'Khiyar al-ayb (option of defect) is a compound of ''option'' and ''defect''. The majority use this name; the Malikis usually call it the option of deficiency (khiyar al-naqisa). Ibn Nujaym and Ibn al-Humam define a defect as what the sound natural state lacks, so as to count as deficient; Ibn Rushd as what falls short of the natural creation or the lawful form, with a real effect on the price; al-Ghazali as any disliked attribute whose absence customarily is assumed for the thing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7959} Lawfulness of return for defect: the jurists agree in general that a defective thing may be returned. They cite the Qur''an, that trade must be by mutual consent (Surah al-Nisa, 4:29), since knowledge of a defect means the consent is not full; and the Sunnah: the report of Aisha about a man who bought a slave, used him, found a defect and returned him, and the Prophet''s ruling that the yield goes with the liability. Al-Kasani also cites the hadith of the sheep with its udder held full, and argues by analogy that the buyer pays a price for a sound thing and does not get it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7959}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7960} Duty of the seller to disclose: the seller must tell the buyer of a defect that gives the option. Not mentioning a defect that gives no option is not forbidden deceit, in the view of Imam al-Haramayn. The majority hold that disclosure is obligatory, and whoever hides a defect is sinful, a matter on which there is no dispute according to Ibn Qudama and al-Subki. Ibn Rushd counts it as eating wealth falsely. The sources cited include the hadith of Uqba ibn Amir that a Muslim sells to his brother only with the defect shown, the hadith of Wathila ibn al-Asqa'' against selling without explaining what is in it, and the saying «whoever cheats us is not of us», from the heap of grain that the Prophet found wet. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7960}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} Concealment and the validity of the sale: a sale that conceals a defect giving the option is valid though sinful, according to most jurists, since the prohibition is on concealment, not on the contract. If the buyer learns of the defect after buying and accepts it, the seller is still at fault and the sale holds, as al-Shawkani holds. The Companions'' practice included Ibn Umar buying camels with mange, and accepting them when told of it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} Duty on others than the contracting party: the duty to disclose is not limited to the seller but extends to anyone who knows of the defect, on the report of Wathila and the many texts on giving counsel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} Timing of the disclosure: a seller or a third party who knows of a defect should disclose it before the sale, so that the buyer may refrain; if the third party is not present, or cannot, then after the sale, so that the buyer may return the thing. The duty is strongest when only a third party knows. The purpose of the option is to remove harm from the buyer: a sale implies a sound object, and when soundness fails through a defect the buyer has the choice, because consent is part of the sale''s nature. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7962}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7963} Three conditions for the option of defect: a real defect must appear; the buyer must not have known of it at the contract; and the seller must not have stipulated release from defects. A defect counts when it lowers value or defeats a valid purpose, and when soundness in that respect is the normal state of that kind of thing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7963}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7964} Definitions: the Hanafis take any thing that lowers value in the eyes of experts, whether or not the substance is reduced; a grave defect in a dowry moves it from good to middling to poor quality. The Shafiis take a defect that lowers value or substance so that a valid purpose is lost, when the usual state of such things is free of it; the Hanbalis count loss of substance even where value rises, and loss of value even where substance is unchanged. The Malikis count a house where someone was killed as defective, since people shun it and its price falls. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7963}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7964}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7965} Normal state: the freedom from the defect must be the normal state of the kind of thing. What is common in such things is not a defect; for instance a usual sediment in oil. Experts decide: merchants for goods, craftsmen for crafted things. The Hanafis require the agreement of experts (if they disagree, there is no right of return); the majority of the Shafiis accept one expert, and the author of al-Tatimma requires two. If the two disagree and no other authority is available, the seller''s word stands with his oath. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7965} Conditions of effect: the defect must be in the object itself, not in the other party, a pledge, or a guarantor. It must be old, that is present at the contract or arising before receipt; a defect that arises after receipt gives no option, though the Malikis apply the rule of warranty (three days for slaves; a year for madness, leprosy and vitiligo). The Hanafis make an exception for leasing, which is annulled by a new defect, since leasing is a contract of benefits that accrue gradually. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7966} The buyer''s own act: a defect caused by the buyer before receipt gives no option, in the Shafii view. The defect must remain after delivery and until return: if it disappears before the buyer returns the thing, the right to return lapses. The Hanafis and Shafiis require that the buyer prove the defect is present with him, since a defect present with the seller may be removed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7966}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7967} Removable defects: no option where the defect can be removed without hardship, such as a maker''s stamp on cloth that washing does not harm, or stain on a garment that washing removes. If the seller minimised the defect and the buyer accepted it, the Malikis grant the buyer the right to return unless a new defect has arisen; then he may choose between return and compensation (arsh), as in a legal opinion by al-Wansharisi about a beast wounded by a spear. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7967}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7968} Proof of defects by how visible they are: a visible defect needs no proof beyond the buyer''s sight, and he may sue the seller. A hidden defect known only to experts (such as pain in the liver or spleen) is proven by two Muslim men or one just man of expertise. A defect only women see is proven by the word of one just woman, two being safer; in the Hanafi view it proves the claim but not return. A defect known only by trial, such as a slave who absconds, needs two men or a man and two women. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7968} The seller''s oath: if the buyer cannot prove the defect was with the seller, the two companions of Abu Hanifa have the seller sworn; Abu Hanifa does not. If the defect may occur in the buyer''s hand, the oath is absolute (a definite oath); if the seller only knows of another''s act, he swears on knowledge. If the seller refuses to swear, the defect is established against him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7968}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7969} Knowledge of the defect: the buyer must be unaware of the defect. If he knew it at the contract or at receipt he has no option, since by buying or taking the thing with knowledge he consents in effect. A defect that is obvious and that anyone would see counts as known, and so does a defect the seller pointed out. Where the seller said that a thing is faulty as a condition of sale, as with a bull sold on condition that it sleeps in the plough, the seller is free of blame. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7969} A buyer who knows of a thing that is a defect without knowing it is one: if he takes it and only later learns that it is a defect, the question is whether the defect is plain. A plain defect that anyone sees gives no right to return; a defect that only experts know gives the right. Likewise a buyer who knows a coin is false, but not how many are false, has not consented to the defect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7970} The release from defects: the option is lost if the seller stipulates release. A release is valid in the Hanafi view whether the defect was known or unknown to the seller and whatever the thing; Malik and al-Shafii allow it only for animals. Such a sale with release is a special type called the sale of release. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7970}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7971} Origin and the views: the report of Ibn Umar, who sold a slave with release and was challenged over a hidden illness; Uthman ordered him to swear he did not know of it, and he refused, took the slave back, and later sold him for more. The jurists differ on the release: release from all defects whether known or not (Abu Hanifa, Abu Thawr, from Ibn Umar and Zayd); no release unless the defect is named (Ibn Abi Layla, al-Thawri); no release unless the buyer has seen it (some Shafiis, Shurayh, Ata, a report of Ahmad and Ishaq); release only from hidden defects in animals (Malik, and the apparent view of al-Shafii); a release only in a sale of spoils, of a bankrupt, or in debt payment; or a voiding of the sale altogether, a Shafii view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7971}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7972} Kinds of release: particular (of a named defect) or general (of all defects). If it refers to a defect existing at the contract, it covers only that. If it refers to a future defect arising before receipt, the condition is void and the sale invalid. If unqualified, Abu Hanifa and Abu Yusuf take it to cover defects at the contract and until receipt; Malik, Muhammad, Zufar and al-Hasan ibn Ziyad limit it to defects at the contract. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7972} Contracts that take the option of defect (Hanafi list): sale and purchase (the valid sale, not the void one, and including exchange of money); leasing, which takes it whether the defect is old or new, and where the lessee may return before and after receipt; division; settlement on property; the dowry; the compensation of khul''; and the settlement for willful blood. For these, return is only for a grave defect, not a slight one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7972}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7973} Ibn Rushd: contracts divide into three: those meant for exchange, which take the option without dispute; those not meant for exchange, such as a gift without return, which do not; and mixed contracts, such as a gift with intent of return, which he thinks do not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7973} Timing of the return: three views. (1) Immediately, meaning as soon as custom allows; whoever knows and does not return loses the right and bears the loss without arsh, the Shafii view and one of Ahmad. The Hanafi al-Hawi also holds this; Ibn Nujaym calls it strange, and the Hanafi view taken is that the option lasts. (2) Delayed, as long as no sign of consent appears, the view of the Hanafis (as relied on) and a sound Hanbali report. (3) A day or two, the Maliki view, where continued possession after that counts as consent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7974}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7975} Effect on the contract''s rule: the defect does not stop the transfer of ownership: the buyer owns the thing at once and the seller owns the price, since the sale is absolute in its pillars. The implied condition of soundness only stops the contract from being binding, not its basic effect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7975}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7976} What the buyer may choose: three views. (1) Hanafis and Shafiis: return against full price, or keep the thing for the full price with no arsh; arsh only if return is impossible. (2) Ahmad and Ishaq: return, or keep with arsh, even when return is possible; but if keeping with arsh leads to ribā, keeping is free. (3) Malikis: a grave defect allows return or keeping free; a slight defect in land means arsh only, and in goods return, by the apparent view of the Mudawwana. The source of the dispute: whether the defect reduces the substance or the attribute. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7976}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7977} Conditions of return: the option must still exist; the thing returned must be as received, without a further defect such as a defect of partnership arising from split of the deal; and the deal must not be split before the whole thing is received, unless the seller accepts, since then it is damage the seller accepts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7977}'
  ur: 'خیار العیب: «خیار» اور «عیب» سے مرکب اضافی ہے؛ جمہور یہی نام لیتے ہیں اور مالکیہ اسے عموماً خیار النقیصہ کہتے ہیں۔ ابن نجیم اور ابن الہمام کے نزدیک عیب وہ ہے جس سے سلیم فطرت خالی ہو اور اس کی وجہ سے چیز ناقص شمار ہو؛ ابن رشد کے نزدیک جو خلقتِ طبیعی یا شرعی خلق سے کم ہو اور قیمت پر اثر ڈالے؛ غزالی کے نزدیک ہر مذموم وصف جس کی غیر موجودگی عرف میں عموماً فرض کی جاتی ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7959} عیب کی بنا پر رد کی مشروعیت: فقہاء کے درمیان اجمالاً اس پر اتفاق ہے۔ قرآن سے سورۃ النساء (4:29) کی آیت «تجارة عن تراض» سے استدلال ہے کیونکہ عیب کا علم رضامندی کو ناقص کرتا ہے؛ سنت سے عائشہ کی حدیث ہے جس میں غلام کا غلہ (کمائی) «الغلة بالضمان» کے اصول پر مالک کو ملتا ہے۔ کاسانی مصراۃ کی حدیث سے بھی استدلال کرتے ہیں، اور قیاس یہ ہے کہ مشتری نے ثمن اس لیے دیا کہ سالم چیز ملے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7959}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7960} بائع پر عیب بتانے کا وجوب: جس عیب سے خیار ثابت ہو اس کا بتانا واجب ہے؛ جو عیب خیار نہ دے اس کا ذکر نہ کرنا امام الحرمین کے نزدیک حرام دھوکہ نہیں۔ جمہور کے نزدیک بتانا واجب ہے اور چھپانے والا گناہ گار ہے، اس پر ابن قدامہ اور سبکی کے مطابق اختلاف نہیں۔ دلیل میں عقبہ بن عامر کی حدیث «المسلم أخو المسلم» اور واثلہ بن الأسقع کی حدیث، اور «من غشنا فليس منا» جو غلے کے ڈھیر کے واقعے سے ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7960}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} کتمان کا بیع کی صحت پر اثر: خیار دینے والا عیب چھپا کر بیچنا جمہور کے نزدیک گناہ کے ساتھ صحیح ہے، کیونکہ نہی کتمان پر ہے نہ کہ عقد پر۔ اگر مشتری خرید کے بعد عیب جان کر راضی ہو جائے تو بائع پر گناہ ہے اور بیع صحیح ہے، جیسا کہ شوکانی نے جزم کیا۔ صحابہ کے عمل میں ابن عمر کا خارشی اونٹ خریدنا اور بتانے پر قبول کر لینا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} غیر عاقد پر وجوب: یہ وجوب صرف بائع پر نہیں بلکہ ہر اس شخص پر ہے جو عیب جانتا ہو، واثلہ کی حدیث اور نصیحت کے وجوب کے بارے میں متعدد نصوص کی بنا پر۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} عیب بتانے کا وقت: بیع سے پہلے بتانا چاہیے تاکہ مشتری رک جائے، اور اگر اجنبی موجود نہ ہو یا میسر نہ ہو تو بعد میں تاکہ مشتری واپس کر سکے؛ جب صرف اجنبی کو علم ہو تو وجوب زیادہ مؤکد ہے۔ خیار عیب کی حکمت مشتری سے ضرر دور کرنا ہے، کیونکہ بیع سالم چیز کا تقاضا کرتی ہے، اور عیب سے سلامت کا وصف جاتا رہے تو اختیار ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7962}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7963} خیار عیب کی تین شرطیں: معتبر عیب کا ظاہر ہونا؛ عقد کے وقت مشتری کو عیب کا علم نہ ہونا؛ اور بائع نے عیب سے بری ہونے کی شرط نہ لگائی ہو۔ عیب اس وقت معتبر ہوتا ہے جب قیمت میں کمی کرے یا صحیح غرض فوت کرے، اور اس جنس میں سلامت اصل ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7963}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7964} حنفیہ کا ضابطہ: ہر وہ چیز جو اہل خبرہ کے نزدیک قیمت میں کمی کرے، خواہ عین میں کمی ہو یا نہ ہو۔ شافعیہ کے نزدیک جو قیمت یا عین میں ایسی کمی کرے کہ صحیح غرض فوت ہو اور ایسی چیزوں میں عام طور پر یہ عیب نہ ہوتا ہو۔ حنابلہ عین کی کمی کو کافی سمجھتے ہیں اگرچہ قیمت بڑھ جائے، اور مالکیہ اس گھر کو عیب مانتے ہیں جس میں قتل ہوا ہو کیونکہ لوگ اسے ناپسند کرتے ہیں اور قیمت گرتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7963}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7964}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7965} اصل سلامت: اس جنس کی عام حالت سلامت ہونی چاہیے؛ جو ان چیزوں میں معمول ہو وہ عیب نہیں، جیسے تیل میں معمول کی تلچھٹ۔ اہل خبرہ فیصلہ کرتے ہیں، کاسانی کے نزدیک تاجروں کا عرف معتبر ہے۔ حنفیہ کے نزدیک اہل خبرہ کا اتفاق شرط ہے، اختلاف میں رد نہیں؛ شافعیہ کے نزدیک جمہور ایک کا قول کافی سمجھتے ہیں۔ اختلاف ہو تو بائع کا قول اس کی قسم کے ساتھ معتبر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7965} تاثیر کی شرائط: عیب خود مبیع میں ہو، عاقد دوسرے یا رہن و ضامن میں نہ ہو؛ قدیم ہو، یعنی عقد کے وقت یا قبض سے پہلے موجود ہو؛ قبض کے بعد پیدا ہونے والا عیب خیار نہیں دیتا، اگرچہ مالکیہ عہدہ کا اصول اپناتے ہیں (غلام میں تین دن، جنون، جذام اور برص میں ایک سال)۔ حنفیہ اجارے میں استثنا کرتے ہیں کیونکہ وہ منافع کا عقد ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7966} مشتری کا اپنا فعل: قبض سے پہلے مشتری کے فعل سے عیب ہو تو شافعیہ کے نزدیک خیار نہیں۔ عیب قبض کے بعد رد تک باقی رہنا چاہیے؛ اگر رد سے پہلے زائل ہو جائے تو رد کا حق نہیں رہتا۔ حنفیہ اور شافعیہ کے نزدیک مشتری کے ہاتھ میں عیب کا ثبوت ضروری ہے، کیونکہ بائع کے پاس عیب زائل ہونے کا احتمال ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7966}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7967} قابل ازالہ عیب: جو بغیر مشقت دور ہو سکے، جیسے کپڑے پر بنانے والی کمپنی کا نشان جو دھونے سے نہ جاتا ہو مگر دھونے سے نقصان نہ پہنچے، یا کپڑے کی نجاست جو دھونے سے زائل ہو۔ اگر بائع نے عیب کو معمولی بتایا اور مشتری راضی ہو گیا، تو مالکیہ کے نزدیک رد کا حق باقی رہتا ہے جب تک نیا عیب پیدا نہ ہو، اور تب مشتری رد یا ارش کے درمیان اختیار رکھتا ہے (ونشریسی کا فتویٰ نیزے کے زخم والے جانور کے بارے میں)۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7967}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7968} عیب کے ثبوت کے طریقے: ظاہر عیب کے لیے بینہ کی ضرورت نہیں اور مشتری بائع سے خصومت کر سکتا ہے؛ باطن عیب جو صرف ماہرین جانیں (جیسے جگر یا تلی کا درد) دو مسلمان مردوں یا ایک عادل ماہر سے ثابت ہوتا ہے؛ جو صرف عورتیں دیکھ سکیں اس میں ایک عادل عورت کا قول کافی ہے، دو زیادہ محتاط ہیں، اور حنفیہ کے نزدیک یہ خصومت کے لیے ہے، رد کے لیے نہیں؛ جو صرف تجربے سے معلوم ہو، جیسے بھاگ جانے والا غلام، اس کے لیے دو مرد یا ایک مرد اور دو عورتیں درکار ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7968} بائع کی قسم: اگر مشتری ثابت نہ کر سکے کہ عیب بائع کے پاس تھا تو صاحبین بائع کو قسم دینے کے قائل ہیں، ابو حنیفہ نہیں۔ اگر عیب مشتری کے ہاتھ میں بھی پیدا ہو سکتا ہو تو قسم قطعی (علی البتات) ہوگی، اور اگر بائع کا اپنا فعل نہ ہو تو علم کی قسم کھائے گا؛ انکار کرے تو عیب اس کے خلاف ثابت ہو جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7968}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7969} مشتری کا علم: مشتری کو عیب کا علم نہ ہو۔ عقد یا قبض کے وقت علم ہو تو خیار نہیں، کیونکہ علم کے ساتھ خریدنا یا لینا رضامندی کے مترادف ہے۔ واضح عیب جو دیکھنے سے نمایاں ہو، اور وہ عیب جس کی طرف بائع نے اشارہ کر دیا ہو، معلوم سمجھے جاتے ہیں۔ جیسے بیل کو اس شرط پر بیچنا کہ وہ ہل میں سوتا ہے، تو بائع بری ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7969} خریدار کا علم، مگر یہ معلوم نہ ہونا کہ یہ عیب ہے: اگر خریدار کسی ایسی چیز کو جانتا ہو جو معتبر عیب ہے، لیکن اسے عیب نہ جانتا ہو، پھر قبضہ کرے اور بعد میں علم ہو، تو دیکھا جائے گا کہ عیب کھلا ہے یا نہیں؛ کھلا عیب جو سب دیکھیں اس کا رد نہیں، اور جو صرف اہل خبرہ جانیں اس کا رد ہے۔ اسی طرح جو کھوٹا سکہ جانتا ہو مگر تعداد نہ جانتا ہو، اس نے پورے عیب پر رضامندی نہیں دی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7970} بری کرنے کی شرط: بائع نے عیب سے بری ہونے کی شرط لگائی ہو تو خیار قائم نہیں رہتا۔ حنفیہ کے نزدیک یہ براءت مطلق جائز ہے، عیب معلوم ہو یا مجہول؛ امام مالک اور شافعی نے اسے جانور کے ساتھ خاص کیا، کیونکہ جانور شاذ ہی عیب سے خالی ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7970}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7971} براءت کی اصل: عبداللہ بن عمر کا غلام بیچنا برأت کے ساتھ، اور مشتری کا پوشیدہ بیماری کا دعویٰ، پھر عثمان کا قسم کا حکم، ابن عمر کا انکار اور غلام واپس لے کر بعد میں زیادہ قیمت پر بیچنا۔ علماء کے مذاہب مختلف ہیں: ہر عیب سے بری، خواہ بائع کو معلوم ہو یا نہ (ابو حنیفہ، ابو ثور)؛ جب تک عیب کا نام نہ لے بری نہیں (ابن ابی لیلیٰ، ثوری)؛ جب تک ہاتھ نہ رکھے (شریح، عطاء، احمد کی ایک روایت، اسحاق)؛ جانور کے باطن عیب سے ہی بری (مالک، شافعی کا ظاہر قول)؛ غنیمت، مفلس یا قرض کی ادائیگی کی فروخت میں؛ یا بیع باطل (شافعیہ کا ایک قول)۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7971}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7972} براءت کی اقسام: خاص (کسی معین عیب سے) یا عام (ہر عیب سے)۔ اضافت کے لحاظ سے: موجودہ عیب پر مقید ہو تو قبض سے پہلے کے حادث عیب کو شامل نہیں؛ مستقبل کے حادث عیب پر ہو تو شرط باطل اور عقد فاسد؛ مطلق ہو تو ابو حنیفہ اور ابو یوسف کے نزدیک عقد کے وقت اور قبض تک کے عیوب کو شامل ہے، اور مالک، محمد، زفر اور حسن بن زیاد کے نزدیک صرف موجودہ عیب کو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7972} خیار عیب کے عقود (حنفیہ): بیع و شراء (صحیح بیع، صرف سمیت)، اجارہ (قدیم یا حادث عیب سے خیار ثابت، قبض سے پہلے اور بعد میں صاحب خیار رد کر سکتا ہے)، قسمت، مال کا صلح، مہر، بدلِ خلع، اور بدلِ صلح عن دم العمد (رد صرف فاحش عیب پر)۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7972}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7973} ابن رشد کا ضابطہ: عقود تین قسم کے ہیں: معاوضے کے عقد جن میں خیار عیب بلاشبہ ہے؛ غیر معاوضہ عقد جیسے بلا عوض ہبہ اور صدقہ جن میں نہیں؛ اور ملے جلے عقد جیسے عوض کی نیت سے ہبہ، جن میں ابن رشد کے نزدیک اظہر یہ ہے کہ خیار نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7973} رد کا وقت: تین اتجاہات ہیں۔ (1) فوراً، یعنی عادت کے مطابق جلدی؛ جو جان کر بھی رد نہ کرے اس کا حق ساقط ہے اور نقصان اس کا ہے، بغیر ارش۔ یہ شافعیہ اور احمد کی ایک روایت ہے؛ صاحب الحاوی حنفی بھی اسی کے قائل ہیں، اور ابن نجیم اسے غریب کہتے ہیں۔ (2) تاخیر کے ساتھ، جب تک رضامندی کا کوئی ثبوت نہ ہو، یہ حنفیہ کے معتمد اور حنابلہ کی صحیح روایت ہے۔ (3) ایک یا دو دن، یہ مالکیہ کا قول ہے، جس کے بعد قبضہ رضا شمار ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7974}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7975} عیب کا عقد کے حکم پر اثر: عیب ملکیت کی منتقلی سے نہیں روکتا؛ مبیع کی ملک مشتری کو فوراً اور ثمن کی ملک بائع کو فوراً ملتی ہے، کیونکہ بیع کا رکن شرط سے مطلق ہے۔ سلامت کی شرط صرف لزوم کو روکتی ہے، اصل حکم کو نہیں؛ اس لیے عیب والا عقد غیر لازم ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7975}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7976} مشتری کا اختیار: تین اتجاہات ہیں۔ (1) حنفیہ اور شافعیہ کے نزدیک رد اور پورے ثمن کے ساتھ اسے رکھنا، ارش نہیں، سوائے اس کے کہ رد ممکن نہ ہو۔ (2) احمد اور اسحاق کے نزدیک رد یا ارش کے ساتھ رکھنا؛ اور جہاں ارش ربا کی طرف لے جائے وہاں مفت رکھنا۔ (3) مالکیہ کے نزدیک کثیر عیب میں رد یا مفت رکھنا؛ متوسط عیب میں غیر منقول میں ارش، اور منقول میں مدونہ کے ظاہر قول کے مطابق رد۔ اختلاف کی بنیاد یہ ہے کہ عیب اصل میں نقص ہے یا وصف میں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7976}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7977} رد کی شرائط: خیار کا موجود ہونا؛ جو چیز لوٹائی جائے وہ اسی وصف پر ہو جس پر قبضہ ہوا، اس میں کوئی نیا عیب نہ ہو؛ اور قبضِ کل سے پہلے صفقہ کی تفریق نہ ہو، الا یہ کہ بائع راضی ہو، کیونکہ ایسا نقصان اس کی طرف سے مرضی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7977}'
