label:
  ar: خيار العيب
  en: Khiyar al-ayb (option of defect)
  ur: خیار العیب
summary:
  ar: 'خيار العيب مركب إضافي من «خيار» و«عيب»، والجمهور يسمونه بهذا الاسم، والمالكية يسمونه غالبا خيار النقيصة. وعرّفه ابن نجيم وابن الهمام بأنه ما يخلو عنه أصل الفطرة السليمة مما يعد به ناقصا، وعرّفه ابن رشد بأنه ما نقص عن الخلقة الطبيعية أو عن الخلق الشرعي نقصانا له تأثير في الثمن، وعرّفه الغزالي بأنه كل وصف مذموم اقتضى العرف سلامة المبيع منه غالبا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7959} مشروعية الرد بالعيب: لا خلاف بين الفقهاء في الرد بالعيب في الجملة. استدلوا من القرآن بقوله تعالى «إلا أن تكون تجارة عن تراض منكم» (سورة النساء، 4:29)، لأن العلم بالعيب ينافي الرضا المشروط في العقود. ومن السنة حديث عائشة في الرجل الذي اشترى غلاما فاستغله ثم وجد به عيبا فرده، فقال النبي إن «الغلة بالضمان». واستدل الكاساني بحديث المصراة، والقياس عليه أن المشتري بذل الثمن ليسلم له مبيع سليم فلم يسلم له ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7959}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7960} وجوب إعلام العيب على البائع: يجب عليه أن يعلم المشتري بالعيب فيما يثبت فيه الخيار؛ أما إن لم يكن العيب موجبا للخيار فترك التعرض له ليس تدليسا محرما، كما قال إمام الحرمين. وصرح جمهور الفقهاء بأن الإعلام واجب، فمن لم يبينه فهو آثم، ولا خلاف فيه كما قال ابن قدامة والسبكي؛ واستدلوا بحديث عقبة بن عامر «المسلم أخو المسلم، ولا يحل لمسلم باع من أخيه بيعا وفيه عيب إلا بينه له»، وبحديث واثلة بن الأسقع في تحريم بيع شيء دون بيان ما فيه، وبحديث «من غشنا فليس منا» في صبرة الطعام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7960}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} أثر الكتمان على صحة البيع: البيع مع كتمان العيب المسبب للخيار صحيح مع الإثم عند جمهور الفقهاء، لأن النهي عن الكتمان لا عن العقد. وإذا علم المشتري بالعيب بعد الشراء ورضيه فالإثم على البائع والبيع صحيح، كما جزم الشوكاني. ومن فعل الصحابة أن ابن عمر اشترى إبلا هيما، فلما أخبر بعيبها رضيها وأمضى العقد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} وجوب الإعلام على غير العاقد: لا يقتصر الوجوب على البائع، بل يمتد إلى كل من علم بالعيب، لحديث واثلة والنصوص العديدة في وجوب النصح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961}'
  en: 'Khiyar al-ayb (option of defect) is a compound of ''option'' and ''defect''. The majority use this name; the Malikis usually call it the option of deficiency (khiyar al-naqisa). Ibn Nujaym and Ibn al-Humam define a defect as what the sound natural state lacks, so as to count as deficient; Ibn Rushd as what falls short of the natural creation or the lawful form, with a real effect on the price; al-Ghazali as any disliked attribute whose absence customarily is assumed for the thing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7959} Lawfulness of return for defect: the jurists agree in general that a defective thing may be returned. They cite the Qur''an, that trade must be by mutual consent (Surah al-Nisa, 4:29), since knowledge of a defect means the consent is not full; and the Sunnah: the report of Aisha about a man who bought a slave, used him, found a defect and returned him, and the Prophet''s ruling that the yield goes with the liability. Al-Kasani also cites the hadith of the sheep with its udder held full, and argues by analogy that the buyer pays a price for a sound thing and does not get it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7959}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7960} Duty of the seller to disclose: the seller must tell the buyer of a defect that gives the option. Not mentioning a defect that gives no option is not forbidden deceit, in the view of Imam al-Haramayn. The majority hold that disclosure is obligatory, and whoever hides a defect is sinful, a matter on which there is no dispute according to Ibn Qudama and al-Subki. Ibn Rushd counts it as eating wealth falsely. The sources cited include the hadith of Uqba ibn Amir that a Muslim sells to his brother only with the defect shown, the hadith of Wathila ibn al-Asqa'' against selling without explaining what is in it, and the saying «whoever cheats us is not of us», from the heap of grain that the Prophet found wet. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7960}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} Concealment and the validity of the sale: a sale that conceals a defect giving the option is valid though sinful, according to most jurists, since the prohibition is on concealment, not on the contract. If the buyer learns of the defect after buying and accepts it, the seller is still at fault and the sale holds, as al-Shawkani holds. The Companions'' practice included Ibn Umar buying camels with mange, and accepting them when told of it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} Duty on others than the contracting party: the duty to disclose is not limited to the seller but extends to anyone who knows of the defect, on the report of Wathila and the many texts on giving counsel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961}'
  ur: 'خیار العیب: «خیار» اور «عیب» سے مرکب اضافی ہے؛ جمہور یہی نام لیتے ہیں اور مالکیہ اسے عموماً خیار النقیصہ کہتے ہیں۔ ابن نجیم اور ابن الہمام کے نزدیک عیب وہ ہے جس سے سلیم فطرت خالی ہو اور اس کی وجہ سے چیز ناقص شمار ہو؛ ابن رشد کے نزدیک جو خلقتِ طبیعی یا شرعی خلق سے کم ہو اور قیمت پر اثر ڈالے؛ غزالی کے نزدیک ہر مذموم وصف جس کی غیر موجودگی عرف میں عموماً فرض کی جاتی ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7959} عیب کی بنا پر رد کی مشروعیت: فقہاء کے درمیان اجمالاً اس پر اتفاق ہے۔ قرآن سے سورۃ النساء (4:29) کی آیت «تجارة عن تراض» سے استدلال ہے کیونکہ عیب کا علم رضامندی کو ناقص کرتا ہے؛ سنت سے عائشہ کی حدیث ہے جس میں غلام کا غلہ (کمائی) «الغلة بالضمان» کے اصول پر مالک کو ملتا ہے۔ کاسانی مصراۃ کی حدیث سے بھی استدلال کرتے ہیں، اور قیاس یہ ہے کہ مشتری نے ثمن اس لیے دیا کہ سالم چیز ملے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7959}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7960} بائع پر عیب بتانے کا وجوب: جس عیب سے خیار ثابت ہو اس کا بتانا واجب ہے؛ جو عیب خیار نہ دے اس کا ذکر نہ کرنا امام الحرمین کے نزدیک حرام دھوکہ نہیں۔ جمہور کے نزدیک بتانا واجب ہے اور چھپانے والا گناہ گار ہے، اس پر ابن قدامہ اور سبکی کے مطابق اختلاف نہیں۔ دلیل میں عقبہ بن عامر کی حدیث «المسلم أخو المسلم» اور واثلہ بن الأسقع کی حدیث، اور «من غشنا فليس منا» جو غلے کے ڈھیر کے واقعے سے ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7960}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} کتمان کا بیع کی صحت پر اثر: خیار دینے والا عیب چھپا کر بیچنا جمہور کے نزدیک گناہ کے ساتھ صحیح ہے، کیونکہ نہی کتمان پر ہے نہ کہ عقد پر۔ اگر مشتری خرید کے بعد عیب جان کر راضی ہو جائے تو بائع پر گناہ ہے اور بیع صحیح ہے، جیسا کہ شوکانی نے جزم کیا۔ صحابہ کے عمل میں ابن عمر کا خارشی اونٹ خریدنا اور بتانے پر قبول کر لینا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961} غیر عاقد پر وجوب: یہ وجوب صرف بائع پر نہیں بلکہ ہر اس شخص پر ہے جو عیب جانتا ہو، واثلہ کی حدیث اور نصیحت کے وجوب کے بارے میں متعدد نصوص کی بنا پر۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7961}'
