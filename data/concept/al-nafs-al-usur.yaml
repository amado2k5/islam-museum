id: concept/al-nafs-al-usur
class: concept
kind: scientific
label:
  ar: "النفس العسر"
  en: "The hard breath"
  fr: "La respiration difficile"
  ur: "دشوار سانس"
  es: "La respiración agitada"
summary:
  ar: "النفس العسر أن تكون التصرف في الهواء شاقاً كان ضيقاً أو لم يكن ضيقاً والسبب فيه آفات على القلب ويكون لبرد مميت للقوة المحركة أو آيف لها كما يعرض عند برد الحجاب بسبب تبرده من طلاء أو غيره وقد يكون لسوء مزاج يعرض للحجاب مثل برد من الهواء أو برد من ضماد يوضع عليه لسبب في نفسه أو لسبب في المعدة لسدة فيحتبس عندها الريح المستنشق ويحتاج إلى جهد حتى ينفتح وهذا مخالف للضيق وربما كانت السدة ورماً وقد يكون لدواء مسهل أثاره ولم يسهل أو لحقنة حادة لم تسهل وكذلك إذا لم يبلغ الفصد في ذات الجنب الحاجة ⁦(وقد قرئ مع ما كتب في آخر القول في ضيق النفس بحسب إحالة الكتاب)⁩ {cite:canon-ibn-sina-print-v2 p.314}"
  en: "The hard breath is that handling the air is toilsome, whether the breath is narrow or not. Its cause is harms upon the heart: it may come of a cold deadly to the moving power, or marring it, as befalls when the diaphragm is chilled by a poultice or another thing; or of a bad temperament befalling the diaphragm — a cold from the air, or a cold from a dressing laid on it for a cause in itself; or for a cause in the stomach, a blockage keeping the drawn-in wind held at it, needing effort until it opens — and this is contrary to the narrowness — and the blockage may be a tumour; or for a laxative drug it stirred but that did not purge, or a sharp clyster that did not purge; and so when the venesection in pleurisy does not reach the need (read together with what was written at the end of the discourse on the breath's narrowness, as the book refers it) {cite:canon-ibn-sina-print-v2 p.314}"
  fr: "La respiration difficile est celle où le maniement de l'air est pénible, que la respiration soit étroite ou non. Sa cause est des atteintes au cœur : elle peut venir d'un froid mortel pour la force motrice, ou qui l'altère, comme il arrive lorsque le diaphragme est refroidi par un cataplasme ou autre chose ; ou d'un mauvais tempérament qui frappe le diaphragme, un froid venant de l'air, ou un froid venant d'un pansement posé sur lui pour une cause qui lui est propre ; ou pour une cause dans l'estomac, une obstruction qui retient près de lui le vent aspiré, exigeant un effort jusqu'à ce qu'elle s'ouvre, ce qui est le contraire de l'étroitesse, et l'obstruction peut être une tuméfaction ; ou pour une drogue laxative qui a agité sans purger, ou un clystère âcre qui n'a pas purgé ; et de même lorsque la saignée dans la pleurésie n'atteint pas le besoin (à lire avec ce qui a été écrit à la fin du discours sur l'étroitesse de la respiration, comme le livre y renvoie) {cite:canon-ibn-sina-print-v2 p.314}"
  ur: "دشوار سانس وہ ہے جس میں ہوا سے تصرف دشوار ہو خواہ سانس تنگ ہو یا نہ ہو؛ اس کا سبب دل پر آفتیں ہیں: وہ حرکت دینے والی قوت کو مارنے والی یا اسے خراب کرنے والی ٹھنڈ سے ہو سکتا ہے جیسے جب حجاب کسی لپ یا کسی اور چیز سے ٹھنڈا ہو جائے؛ یا حجاب پر عارض بد مزاج سے جیسے ہوا کی ٹھنڈ یا اس پر لگائی گئی پٹی کی ٹھنڈ کسی خود اس کے سبب کے لیے؛ یا معدے کے سبب سے کسی سدے کے لیے کہ داخل شدہ ہوا وہاں محبوس رہے اور کھلنے تک زحمت چاہیے — اور یہ تنگی کے خلاف ہے — اور سدہ سوجن بھی ہو سکتا ہے؛ یا ایسی جلاب دوا سے جسے اس نے ابھارا مگر اس نے صفائی نہ کی یا تیز حقنے سے جس نے صفائی نہ کی؛ اور ایسے ہی جب ذات الجنب میں فصد ضرورت پوری نہ کرے ⁦(سانس کی تنگی کے کلام کے آخر میں لکھی بات کے ساتھ پڑھا جائے جیسا کہ کتاب نے حوالہ دیا)⁩ {cite:canon-ibn-sina-print-v2 p.314}"
  es: "La dificultad para respirar se debe a que manejar el aire es laborioso, ya sea que la respiración sea estrecha o no. Su causa son daños al corazón: puede ser por un resfriado mortal para la fuerza motriz, o que la daña, como sucede cuando el diafragma se enfría por una cataplasma u otra cosa; o por un mal temperamento que afecta al diafragma: un resfriado por el aire, o un resfriado por un vendaje colocado sobre él por una causa en sí misma; o por una causa en el estómago, una obstrucción que mantiene el aire aspirado retenido, necesitando esfuerzo hasta que se abre, y esto es contrario a la estrechez, y la obstrucción puede ser un tumor; o por un medicamento laxante que se movió pero que no purgó, o un enema fuerte que no purgó; y así, cuando la venesección en la pleuresía no alcanza la necesidad (léase junto con lo que se escribió al final del discurso sobre la estrechez de la respiración, como lo denomina el libro) {cite:canon-ibn-sina-print-v2 p.314}"
