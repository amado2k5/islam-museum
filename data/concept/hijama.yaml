label: { ar: "الحجامة", en: "Cupping (hijama)", ur: "حجامہ (پچھنے لگوانا)" }
summary:
  ar: "الحجامة مص الدم بعد الشرط بالمحجم، وتفترق عن الفصد، وهو شق العرق لإخراج الدم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6827} والتداوي بها مندوب عند الفقهاء استنادا إلى أحاديث في الصحيحين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6827} وفي نقض الوضوء اختلفوا: فالحنفية يرونها ناقضة، والحنابلة يوجبون الوضوء بالدم الفاحش، والمالكية والشافعية لا يوجبون الوضوء بها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6828} وفي الصوم: الحنفية يكرهونها للصائم إذا أضعفته، والمالكية يفصلون بحسب قوة البدن وغلبة الظن، والشافعية لا يرون أنها تفطر، والحنابلة يرون أنها تفطر الحاجم والمحجوم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6829} وفي الإحرام: الحنفية لا يرون بها بأسا، والمالكية يحرّمونها لغير عذر إن لزم منها قلع الشعر، والشافعية تجيزها إن لم تتضمن قطع الشعر، والحنابلة يفرّقون بين الحاجة وغيرها، ويجب في قلع الشعر فدية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6830} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6831} وذهب جمهور الفقهاء إلى جواز اتخاذها حرفة وأخذ الأجرة عليها، وفي قول عن أحمد كراهة أخذ أجرها، ويرون أن الحجام لا يضمن إذا أحسن صنعته ولم يتجاوز المعتاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6831}"
  en: "Hijama is the drawing of blood by suction after the skin has been cut with a cupping instrument. It differs from fasd, which is opening a vein. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6827} Jurists regard cupping as recommended for treatment, on the basis of hadiths in the two Sahih collections. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6827} On whether it breaks wudu', the Hanafis treat it as breaking; the Hanbalis require wudu' for heavy bleeding; the Malikis and Shafi'is do not require it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6828} On fasting, the Hanafis dislike it for a fasting person who is weakened; the Malikis judge by the person's strength and likelihood of harm; the Shafi'is hold that it does not break the fast; the Hanbalis hold that it breaks the fast for both the cupper and the cupped. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6829} On the pilgrim's state of ihram, the Hanafis see no objection; the Malikis forbid it without need if it entails removing hair; the Shafi'is allow it when it does not cut hair; the Hanbalis allow it, and removing hair brings a redemption payment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6830} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6831} Most jurists allow cupping as a paid trade, while a view attributed to Ahmad disapproves of the fee; the cupper is not liable if he performs the task skilfully and within what is customary. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6831}"
