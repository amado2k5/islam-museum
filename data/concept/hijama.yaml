id: concept/hijama
class: concept
kind: legal
label: { ar: "الحجامة", en: "Cupping (hijama)", ur: "حجامہ ⁦(پچھنے لگوانا)⁩", es: "Ventosaterapia (hijama)" }
summary:
  ar: "الحجامة مص الدم بعد الشرط بالمحجم، وتفترق عن الفصد، وهو شق العرق لإخراج الدم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6827} والتداوي بها مندوب عند الفقهاء استنادا إلى أحاديث في الصحيحين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6827} وفي نقض الوضوء اختلفوا: فالحنفية يرونها ناقضة، والحنابلة يوجبون الوضوء بالدم الفاحش، والمالكية والشافعية لا يوجبون الوضوء بها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6828} وفي الصوم: الحنفية يكرهونها للصائم إذا أضعفته، والمالكية يفصلون بحسب قوة البدن وغلبة الظن، والشافعية لا يرون أنها تفطر، والحنابلة يرون أنها تفطر الحاجم والمحجوم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6829} وفي الإحرام: الحنفية لا يرون بها بأسا، والمالكية يحرّمونها لغير عذر إن لزم منها قلع الشعر، والشافعية تجيزها إن لم تتضمن قطع الشعر، والحنابلة يفرّقون بين الحاجة وغيرها، ويجب في قلع الشعر فدية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6830} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6831} وذهب جمهور الفقهاء إلى جواز اتخاذها حرفة وأخذ الأجرة عليها، وفي قول عن أحمد كراهة أخذ أجرها، ويرون أن الحجام لا يضمن إذا أحسن صنعته ولم يتجاوز المعتاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6831}"
  en: "Hijama is the drawing of blood by suction after the skin has been cut with a cupping instrument. It differs from fasd, which is opening a vein. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6827} Jurists regard cupping as recommended for treatment, on the basis of hadiths in the two Sahih collections. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6827} On whether it breaks wudu', the Hanafis treat it as breaking; the Hanbalis require wudu' for heavy bleeding; the Malikis and Shafi'is do not require it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6828} On fasting, the Hanafis dislike it for a fasting person who is weakened; the Malikis judge by the person's strength and likelihood of harm; the Shafi'is hold that it does not break the fast; the Hanbalis hold that it breaks the fast for both the cupper and the cupped. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6829} On the pilgrim's state of ihram, the Hanafis see no objection; the Malikis forbid it without need if it entails removing hair; the Shafi'is allow it when it does not cut hair; the Hanbalis distinguish need from other cases, and removing hair requires a redemption payment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6830} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6831} Most jurists allow cupping as a paid trade, while a view attributed to Ahmad disapproves of the fee; the cupper is not liable if he performs the task skilfully and within what is customary. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6831}"
  es: "Hijama es la extracción de sangre por succión después de que la piel se haya cortado con un instrumento de ventosas. Se diferencia de fasd, que es abrir una vena. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6827} Los juristas consideran que las ventosas son recomendables para el tratamiento, basándose en hadices de las dos colecciones Sahih. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6827} Sobre si rompe el wudu', los hanafíes lo consideran una ruptura; los hanbalíes requieren wudu' para hemorragias abundantes; los malikíes y shafi'ís no lo requieren. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6828} Sobre el ayuno, los hanafíes lo desaconsejan para una persona que está debilitada; los malikíes juzgan por la fuerza de la persona y la probabilidad de daño; Los shafi'ís sostienen que no rompe el ayuno; los hanbalíes sostienen que rompe el ayuno tanto para el que realiza la ventosa como para el que se la realiza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6829} En cuanto al estado de ihram del peregrino, los hanafíes no ven objeción; los malikíes lo prohíben sin necesidad si implica la eliminación del cabello; los shafi'ís lo permiten cuando no corta el cabello; los hanbalíes distinguen la necesidad de otros casos, y la eliminación del cabello requiere un pago de redención. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6830} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6831} La mayoría de los juristas permiten la ventosaterapia como un oficio remunerado, mientras que una opinión atribuida a Ahmad desaprueba la tarifa; el que realiza la ventosaterapia no es responsable si realiza la tarea con habilidad y dentro de lo que es costumbre. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6831}"
