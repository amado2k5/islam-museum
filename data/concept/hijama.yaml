label: { ar: "الحجامة", en: "Cupping (hijama)", ur: "حجامہ ⁦(پچھنے لگوانا)⁩", es: "Ventosaterapia (hijama)", fr: "Ventouses (hijama)", tr: "kupa sıkma", id: "bekam" }
summary:
  ar: "الحجامة مص الدم بعد الشرط بالمحجم، وتفترق عن الفصد، وهو شق العرق لإخراج الدم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6827} والتداوي بها مندوب عند الفقهاء استنادا إلى أحاديث في الصحيحين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6827} وفي نقض الوضوء اختلفوا: فالحنفية يرونها ناقضة، والحنابلة يوجبون الوضوء بالدم الفاحش، والمالكية والشافعية لا يوجبون الوضوء بها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6828} وفي الصوم: الحنفية يكرهونها للصائم إذا أضعفته، والمالكية يفصلون بحسب قوة البدن وغلبة الظن، والشافعية لا يرون أنها تفطر، والحنابلة يرون أنها تفطر الحاجم والمحجوم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6829} وفي الإحرام: الحنفية لا يرون بها بأسا، والمالكية يحرّمونها لغير عذر إن لزم منها قلع الشعر، والشافعية تجيزها إن لم تتضمن قطع الشعر، والحنابلة يفرّقون بين الحاجة وغيرها، ويجب في قلع الشعر فدية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6830} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6831} وذهب جمهور الفقهاء إلى جواز اتخاذها حرفة وأخذ الأجرة عليها، وفي قول عن أحمد كراهة أخذ أجرها، ويرون أن الحجام لا يضمن إذا أحسن صنعته ولم يتجاوز المعتاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6831}"
  en: "Hijama is the drawing of blood by suction after the skin has been cut with a cupping instrument. It differs from fasd, which is opening a vein. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6827} Jurists regard cupping as recommended for treatment, on the basis of hadiths in the two Sahih collections. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6827} On whether it breaks wudu', the Hanafis treat it as breaking; the Hanbalis require wudu' for heavy bleeding; the Malikis and Shafi'is do not require it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6828} On fasting, the Hanafis dislike it for a fasting person who is weakened; the Malikis judge by the person's strength and likelihood of harm; the Shafi'is hold that it does not break the fast; the Hanbalis hold that it breaks the fast for both the cupper and the cupped. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6829} On the pilgrim's state of ihram, the Hanafis see no objection; the Malikis forbid it without need if it entails removing hair; the Shafi'is allow it when it does not cut hair; the Hanbalis distinguish need from other cases, and removing hair requires a redemption payment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6830} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6831} Most jurists allow cupping as a paid trade, while a view attributed to Ahmad disapproves of the fee; the cupper is not liable if he performs the task skilfully and within what is customary. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6831}"
  es: "Hijama es la extracción de sangre por succión después de que la piel se haya cortado con un instrumento de ventosas. Se diferencia de fasd, que es abrir una vena. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6827} Los juristas consideran que las ventosas son recomendables para el tratamiento, basándose en hadices de las dos colecciones Sahih. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6827} Sobre si rompe el wudu', los hanafíes lo consideran una ruptura; los hanbalíes requieren wudu' para hemorragias abundantes; los malikíes y shafi'ís no lo requieren. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6828} Sobre el ayuno, los hanafíes lo desaconsejan para una persona que está debilitada; los malikíes juzgan por la fuerza de la persona y la probabilidad de daño; Los shafi'ís sostienen que no rompe el ayuno; los hanbalíes sostienen que rompe el ayuno tanto para el que realiza la ventosa como para el que se la realiza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6829} En cuanto al estado de ihram del peregrino, los hanafíes no ven objeción; los malikíes lo prohíben sin necesidad si implica la eliminación del cabello; los shafi'ís lo permiten cuando no corta el cabello; los hanbalíes distinguen la necesidad de otros casos, y la eliminación del cabello requiere un pago de redención. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6830} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6831} La mayoría de los juristas permiten la ventosaterapia como un oficio remunerado, mientras que una opinión atribuida a Ahmad desaprueba la tarifa; el que realiza la ventosaterapia no es responsable si realiza la tarea con habilidad y dentro de lo que es costumbre. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6831}"
  fr: "La hijama consiste à prélever du sang par succion après avoir incisé la peau à l'aide d'un instrument à ventouses. Elle diffère du fasd, qui consiste à ouvrir une veine. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6827} Les juristes considèrent la hijama comme un traitement recommandé, sur la base des hadiths des deux recueils authentiques (Sahih). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6827} Concernant la validité des ablutions (wudu'), les hanafites la considèrent comme invalidante; les hanbalites exigent les ablutions en cas de saignements abondants; les malikites et les shafi'ites ne les exigent pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6828} Concernant le jeûne, les hanafites le déconseillent à une personne affaiblie; les malikites jugent en fonction de la force de la personne et du risque de préjudice. Les chaféites considèrent que la saignée ne rompt pas le jeûne; les hanbalites, quant à eux, estiment qu'elle le rompt tant pour celui qui la pratique que pour celui qui la reçoit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6829} Concernant l'état d'ihram du pèlerin, les hanafites n'y voient aucune objection; les malikites l'interdisent sans nécessité si elle implique l'épilation; les chaféites l'autorisent lorsqu'elle n'implique pas de coupe de cheveux; les hanbalites font une distinction entre les cas de nécessité et les autres, et l'épilation requiert un paiement compensatoire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6830} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6831} La plupart des juristes autorisent la saignée comme activité rémunérée, tandis qu'un avis attribué à Ahmad désapprouve le paiement d'une somme d'argent; le savancier n'est pas responsable s'il accomplit la tâche avec habileté et dans le respect des usages. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6831}"
  ur: "حجامہ ایک سنگی آلے سے جلد کو کاٹنے کے بعد سکشن کے ذریعے خون نکالنا ہے۔ یہ فاسد سے مختلف ہے، جو رگ کو کھول رہا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص6827} فقہاء دو صحیح مجموعوں میں موجود احادیث کی بنیاد پر علاج کے لیے سنگی لگانے کو مستحب سمجھتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص6827} اس بارے میں کہ آیا اس سے وضو ٹوٹتا ہے، احناف اسے ٹوٹنا سمجھتے ہیں۔ حنبلیوں کے نزدیک بہت زیادہ خون بہنے کے لیے وضو ضروری ہے۔ مالکیوں اور شافعیوں کو اس کی ضرورت نہیں ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص6828} روزہ رکھنے پر احناف اسے کمزور روزہ دار کے لیے ناپسند کرتے ہیں۔ مالکی شخص کی طاقت اور نقصان کے امکان کے مطابق فیصلہ کرتے ہیں۔ شافعیوں کا خیال ہے کہ اس سے روزہ نہیں ٹوٹتا۔ حنبلیوں کا عقیدہ ہے کہ اس سے سنگی اور سنگی دونوں کا روزہ ٹوٹ جاتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص6829} حاجی کی حالت احرام پر احناف کو کوئی اعتراض نہیں ہے۔ اگر بال اکھاڑنا ہو تو مالکیہ اسے بلا ضرورت حرام قرار دیتے ہیں۔ شافعی اس کی اجازت دیتے ہیں جب وہ بال نہ کاٹے۔ حنبلی ضرورت کو دیگر صورتوں سے ممتاز کرتے ہیں، اور بالوں کو ہٹانے کے لیے فدیہ کی ادائیگی کی ضرورت ہوتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.6830} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6831} اکثر فقہا سنگی لگانے کو بطور معاوضہ تجارت کی اجازت دیتے ہیں، جبکہ احمد سے منسوب ایک قول فیس کو مسترد کرتا ہے۔ کپر ذمہ دار نہیں ہے اگر وہ کام کو مہارت سے اور رواج کے مطابق انجام دے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص6831}"
  tr: "Kupa sıkma, muqab ile yapılan durumdan sonra kanın emilmesidir ve fleomadan farklıdır; fleoma, damarın ayrılarak kanı atmasıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6827} ve bu tedavi, iki sahih'teki hadislere dayanan hukukçular tarafından önerilmektedir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6827} Farklılıklar şunlardır: Hanafiler bunu geçersiz sayar, Hanbalılar aşırı kanla abdest alma gerektirirken, Malikiler ve Şafiiler abdest alma gerektirmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6828} Oruçta: Hanefiler, oruç tutan kişinin zayıflamasından hoşlanmaz. Malikiler fiziksel güç ve şüphe varsayımına göre ayrılır. Şafiiler orucu bozmak için kabul etmezken, Hanbaliler hapiste olan veya kupalı durumda olan kişi için orucu bozmak olarak kabul eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6829} İhramda: Hanefiler bunu sorunlu saymaz, Malikiler saç kesimi gerektiriyorsa mazeret göstermeden, saç kesilmesi gerektirmiyorsa Şafi'ler izin verir. Hanbaliler ihtiyacı ve diğerlerini ayırır, saç çekmek için fidya gereklidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6830} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6831} Hukukçuların çoğu, bunu bir zanaat olarak alıp bunun için ödeme almayı uygun bulur. Ahmad'ın görüşüne göre, ücretini almak hoş karşılanmaz ve berberin işini iyi yaparsa ve olağan standartları aşmazsa sorumlu olmadığını düşünürler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6831}"
  id: "Bekam adalah hisapan darah setelah kondisi dengan muqab, dan berbeda dengan fleoma, yaitu pembelahan pembuluh darah untuk mengeluarkan darah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6827} dan pengobatan dengan kubah direkomendasikan oleh ahli hukum berdasarkan hadits dalam kedua Sahih. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6827} Mereka berbeda: Hanafi menganggapnya batal, Hanbal memerlukan wudhu dengan darah berlebihan, sedangkan Malili dan Shafi'i tidak memerlukan wudhu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6828} Dalam puasa: Hanafi tidak suka jika puasa melemahkannya. Malik memisahkan diri berdasarkan kekuatan fisik dan anggapan keraguan. Syha'i tidak menganggap puasa diputuskan, sedangkan Hanbalis menganggapnya sebagai memutus puasa bagi orang yang dipenjara atau dalam keadaan bercawan berpuasa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6829} Dalam Ihram: Hanafi tidak menganggapnya bermasalah, Malik mengizinkan tanpa alasan jika perlu memotong rambut, dan Shafi'i mengizinkan jika tidak melibatkan pemotongan rambut. Hanbalis membedakan antara kebutuhan dan yang lain, dan fidya diperlukan untuk mencabut rambut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6830} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6831} Mayoritas ahli hukum menganggap diperbolehkan untuk mengambilnya sebagai kerajinan dan menerima pembayaran untuknya. Menurut pandangan Ahmad, menerima upahnya tidak disukai, dan mereka percaya bahwa tukang cukur tidak bertanggung jawab jika ia melakukan keahliannya dengan baik dan tidak melebihi standar biasa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6831}"
