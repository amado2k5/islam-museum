id: concept/atwar-al-dawla
class: concept
kind: term
label: { ar: "أطوار الدولة الخمسة", en: "The five stages of the state" }
summary:
  ar: "نظرية ابن خلدون الشهيرة أن الدولة تنتقل في أطوار مختلفة وحالات متجددة لا تعدو في الغالب خمسة أطوار يكتسب القائمون بها في كل طور خلقاً من أحواله، الأول طور الظفر بالبغية وغلب المدافع والاستيلاء على الملك وانتزاعه من أيدي الدولة السالفة فيكون صاحب الدولة أسوة قومه لا ينفرد دونهم بشيء لأن ذلك مقتضى العصبية، والثاني طور الاستبداد على قومه والانفراد دونهم بالملك وكبحهم عن التطاول للمشاركة فيعنى باصطناع الرجال واتخاذ الموالي لجدع أنوف أهل عصبيته المقاسمين له في نسبه فيدافع الأقارب ولا يظاهره إلا الأقل من الأباعد، والثالث طور الفراغ والدعة لتحصيل ثمرات الملك من تحصيل المال وتخليد الآثار وتشييد المباني والأمصار وإجازة الوفود واعتراض جنوده وإدرار أرزاقهم وهو آخر أطوار الاستبداد، والرابع طور القنوع والمسالمة فيكون قانعاً بما بنى أولوه سلماً لأنظاره يتبع آثارهم حذو النعل بالنعل، والخامس طور الإسراف والتبذير فيتلف ما جمع أولوه في سبيل الشهوات ويصطنع أخدان السوء ويستفسد كبار أولياء قومه حتى يضطغنوا عليه فيحصل في الدولة طبيعة الهرم والمرض المزمن الذي لا تكاد تخلص منه حتى تنقرض {cite:muqaddima-ibn-khaldun p. 176-177}."
  en: "Conquest, monopoly, fruition, imitation, waste — the senility that no state escapes {cite:muqaddima-ibn-khaldun p. 176-177}."
