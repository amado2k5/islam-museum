id: concept/atwar-al-dawla
class: concept
kind: term
label:
  ar: "أطوار الدولة الخمسة"
  en: "The five stages of the state"
  fr: "Les cinq phases de l’État"
  es: "Las cinco etapas del estado"
  ur: "ریاست کے پانچ مراحل"
  tr: "Devletin Beş Evresi"
  id: "Lima Fase Negara"
summary:
  ar: "نظرية ابن خلدون الشهيرة أن الدولة تنتقل في أطوار مختلفة وحالات متجددة لا تعدو في الغالب خمسة أطوار يكتسب القائمون بها في كل طور خلقاً من أحواله، الأول طور الظفر بالبغية وغلب المدافع والاستيلاء على الملك وانتزاعه من أيدي الدولة السالفة فيكون صاحب الدولة أسوة قومه لا ينفرد دونهم بشيء لأن ذلك مقتضى العصبية، والثاني طور الاستبداد على قومه والانفراد دونهم بالملك وكبحهم عن التطاول للمشاركة فيعنى باصطناع الرجال واتخاذ الموالي لجدع أنوف أهل عصبيته المقاسمين له في نسبه فيدافع الأقارب ولا يظاهره إلا الأقل من الأباعد، والثالث طور الفراغ والدعة لتحصيل ثمرات الملك من تحصيل المال وتخليد الآثار وتشييد المباني والأمصار وإجازة الوفود واعتراض جنوده وإدرار أرزاقهم وهو آخر أطوار الاستبداد، والرابع طور القنوع والمسالمة فيكون قانعاً بما بنى أولوه سلماً لأنظاره يتبع آثارهم حذو النعل بالنعل، والخامس طور الإسراف والتبذير فيتلف ما جمع أولوه في سبيل الشهوات ويصطنع أخدان السوء ويستفسد كبار أولياء قومه حتى يضطغنوا عليه فيحصل في الدولة طبيعة الهرم والمرض المزمن الذي لا تكاد تخلص منه حتى تنقرض {cite:muqaddima-ibn-khaldun p. 176-177}."
  en: "Conquest, monopoly, fruition, imitation, waste — the senility that no state escapes {cite:muqaddima-ibn-khaldun p. 176-177}."
  fr: "Conquête, monopole, fructification, imitation, gaspillage — la sénilité à laquelle aucun État n’échappe {cite:muqaddima-ibn-khaldun p. 176-177}."
  es: "Conquista, monopolio, explotación, imitación, despilfarro: la senilidad de la que ningún estado escapa {cite:muqaddima-ibn-khaldun p. 176-177}."
  ur: "فتح، اجارہ داری، نتیجہ، تقلید، بربادی - وہ بزرگی جس سے کوئی ریاست بچ نہیں سکتی۔ 176-177}۔"
  tr: "İbn Haldun'un ünlü teorisi, devletin genellikle beş aşamadan fazla olmayan çeşitli aşamalardan ve tekrarlayan devletlerden geçtiğini, bu aşamada yönetenlerin her aşamada belirli bir karakter kazandığını belirtir. Birinci aşama, hedefe ulaşma, savunucuları yenme, krallığı ele geçirme ve önceki devletin elinden alma aşamasıdır; böylece devlet sahibi halkı gibi olur ve hiçbir şeyi dışlamaz, çünkü bunun için kabilecilik gerekir; ikinci aşama ise halkı üzerinde egemen olup, onları kibirden alıkoyarak katılmaya zorlayan zorbalık aşamasıdır Soy ayrımındaki iki ayrım onun içindir, bu yüzden akrabaları onu savunur ve sadece en az mesafeli olanlar gösterir. Üçüncü aşama, krallığın meyvelerini elde etmek için eğlence ve sakinliktir; zenginlik kazanmak, anıtları ölümsüzleştirmek, binalar ve şehirler inşa etmek, heyetlere izin vermek, askerlerini durdurmak ve geçim kaynaklarını sağlamak gibi şeyler — ki bu zorbalığın son aşamasıdır. Dördüncü aşama huzur ve huzurdur; takipçilerinin gözleri için barış olarak inşa ettikleriyle yetinmek, onların izlerini adım adım takip etmek; beşinci aşama ise savurganlık ve israftır; takipçilerinin arzuları için topladıklarını mahveder, kötü alışkanlıklar uydurur ve halkının büyük azizlerini yozlaştırır, böylece onlar ona karşı kibirli olur ve böylece başarır. Eyalette, piramidin doğası ve kronik hastalığı zar zor yok eder ve sonunda yok olur {atıf:muqaddima-ibn-khaldun s. 176-177}."
  id: "Teori terkenal Ibn Khaldun menyatakan bahwa negara bergerak melalui berbagai tahap dan keadaan berulang, biasanya tidak lebih dari lima tahap, di mana mereka yang berkuasa memperoleh karakter tertentu di setiap tahap. Tahap pertama adalah tahap mencapai tujuan, mengalahkan para pembela, merebut kerajaan, dan merebutnya dari tangan negara sebelumnya, sehingga pemilik negara menjadi seperti rakyatnya dan tidak mengecualikan apa pun dari mereka karena ini memerlukan tribalisme; tahap kedua adalah tahap tirani atas rakyatnya, memonopoli kekuasaan raja atas mereka, dan menahan mereka agar tidak sombong untuk berpartisipasi, yang berkaitan dengan fabrikasi manusia dan menunjuk pengikut setia kepada yang terbaik dari suku mereka Dua pemisah garis keturunan adalah untuknya, sehingga kerabat membelanya, dan hanya yang paling tidak jauh yang menunjukkannya. Tahap ketiga adalah waktu luang dan ketenangan untuk memperoleh buah kerajaan, mengabadikan monumen, membangun bangunan dan kota, memberi izin kepada delegasi, mencegat tentaranya, dan menyediakan mata pencaharian mereka, yang merupakan tahap akhir tirani. Tahap keempat adalah kepuasan dan kedamaian, puas dengan apa yang telah dibangun para pengikutnya sebagai perdamaian bagi matanya, mengikuti jejak mereka langkah demi langkah; tahap kelima adalah kemewahan dan pemborosan, merusak apa yang dikumpulkan para pengikutnya untuk keinginan, membuat kebiasaan buruk, dan merusak para santo besar kaumnya hingga mereka menjadi sombong terhadapnya, sehingga mencapai Di negara bagian ini, sifat piramida dan penyakit kronis yang hampir tidak diberantas hingga punah {cite:muqaddima-ibn-khaldun hlm. 176-177}."
