id: concept/asbab-al-tan-fi-al-rawi
class: concept
kind: term
label:
  ar: "أسباب الطعن في الراوي"
  en: "The ten grounds for impugning a narrator"
  fr: "Les dix motifs de mise en cause d’un transmetteur"
  ur: "راوی پر طعن کے اسباب"
  es: "Los diez motivos para impugnar a un narrador"
  tr: "Anlatıcıya meydan okuma nedenleri"
  id: "Alasan menantang narator"
summary:
  ar: "يحصر ابن حجر الطعن في الراوي في عشرة أسباب، خمسة تتعلق بالعدالة وخمسة بالضبط، ويرتبها من الأشد إلى الأخف: الكذب في الحديث، والتهمة بالكذب، وفحش الغلط، والغفلة، والفسق، والوهم، ومخالفة الثقات، والجهالة، والبدعة، وسوء الحفظ؛ وأولها الطعن بالكذب الذي يكون حديثه الموضوع {cite:nuzhat-al-nazar-itr-bushra-2011 p. 83-85}."
  en: "Ibn Hajar reduces the grounds for impugning a narrator to ten, five concerning his integrity and five his precision, arranged from the gravest down: lying in hadith, suspicion of lying, gross error, inattention, sinfulness, misapprehension, contradicting trustworthy narrators, being unknown, heterodox innovation, and poor memory; the first, lying, makes his report a fabrication (mawdu') {cite:nuzhat-al-nazar-itr-bushra-2011 p. 83-85}."
  fr: "Ibn Hajar ramène à dix les motifs de mise en cause d’un transmetteur, cinq concernant sa probité et cinq sa précision, classés du plus grave au moins grave : mensonge dans le hadith, soupçon de mensonge, erreur grossière, inattention, conduite pécheresse, méprise, contradiction des transmetteurs dignes de confiance, caractère inconnu, innovation hétérodoxe et mauvaise mémoire ; le premier, le mensonge, fait de son récit une fabrication (mawdu') {cite:nuzhat-al-nazar-itr-bushra-2011 p. 83-85}."
  ur: "ابن حجر راوی پر طعن کو دس اسباب میں سمیٹتے ہیں، پانچ عدالت سے متعلق اور پانچ ضبط سے، اور انہیں سخت ترین سے ہلکے کی ترتیب میں رکھتے ہیں: حدیث میں جھوٹ، جھوٹ کی تہمت، فاحش غلطی، غفلت، فسق، وہم، ثقات کی مخالفت، جہالت، بدعت اور سوءِ حفظ؛ پہلا، یعنی جھوٹ، اس کی حدیث کو موضوع بنا دیتا ہے {cite:nuzhat-al-nazar-itr-bushra-2011 p. 83-85}۔"
  es: "Ibn Hajar reduce a diez los motivos para impugnar a un narrador, cinco relacionados con su integridad y cinco con su precisión, ordenados del más grave al más bajo: mentir en el hadiz, sospecha de mentira, error grave, falta de atención, pecado, malentendido, contradecir a narradores fidedignos, ser desconocido, innovación heterodoxa y mala memoria; el primero, mentir, convierte su relato en una invención (mawdu') {cite:nuzhat-al-nazar-itr-bushra-2011 p. 83-85}."
  tr: "İbn Hajar, anlatıcıya yönelik eleştiriyi on sebeple sınırlar; beşi adaletle ilgili, beşi ise özel ve bunları en ciddiden en hafife sıralar: hadislerde yalan söylemek, yalan söylemekle suçlanmak, büyük hata, dikkatsizlik, ahlaksızlık, aldatma, güvenilir kişilerle çelişki, cehalet, yenilik ve zayıf hafıza; bunların ilki, hadisi uydurma olan yalana saldırmaktır {cite:nuzhat-al-nazar-itr-bushra-2011, s. 83-85}."
  id: "Ibn Hajar membatasi kritik narator pada sepuluh alasan, lima terkait keadilan dan lima spesifik, dan ia mengurutkannya dari yang berat hingga yang paling ringan: kebohongan dalam hadis, tuduhan berbohong, kesalahan besar, kelalaian, ketidakmoralan, delusi, kontradiksi dengan individu yang dapat dipercaya, ketidaktahuan, inovasi, dan ingatan yang buruk; yang pertama adalah menyerang kebohongan, yang haditnya dibuat-buat {cite:nuzhat-al-nazar-itr-bushra-2011, hlm. 83-85}."
