id: concept/asbab-al-tan-fi-al-rawi
class: concept
kind: term
label: { ar: "أسباب الطعن في الراوي", en: "The ten grounds for impugning a narrator", ur: "راوی پر طعن کے اسباب" }
summary:
  ar: "يحصر ابن حجر الطعن في الراوي في عشرة أسباب، خمسة تتعلق بالعدالة وخمسة بالضبط، ويرتبها من الأشد إلى الأخف: الكذب في الحديث، والتهمة بالكذب، وفحش الغلط، والغفلة، والفسق، والوهم، ومخالفة الثقات، والجهالة، والبدعة، وسوء الحفظ؛ وأولها الطعن بالكذب الذي يكون حديثه الموضوع {cite:nuzhat-al-nazar-itr-bushra-2011 p. 83-85}."
  en: "Ibn Hajar reduces the grounds for impugning a narrator to ten, five concerning his integrity and five his precision, arranged from the gravest down: lying in hadith, suspicion of lying, gross error, inattention, sinfulness, misapprehension, contradicting trustworthy narrators, being unknown, heterodox innovation, and poor memory; the first, lying, makes his report a fabrication (mawdu') {cite:nuzhat-al-nazar-itr-bushra-2011 p. 83-85}."
  ur: "ابن حجر راوی پر طعن کو دس اسباب میں سمیٹتے ہیں، پانچ عدالت سے متعلق اور پانچ ضبط سے، اور انہیں سخت ترین سے ہلکے کی ترتیب میں رکھتے ہیں: حدیث میں جھوٹ، جھوٹ کی تہمت، فاحش غلطی، غفلت، فسق، وہم، ثقات کی مخالفت، جہالت، بدعت اور سوءِ حفظ؛ پہلا، یعنی جھوٹ، اس کی حدیث کو موضوع بنا دیتا ہے {cite:nuzhat-al-nazar-itr-bushra-2011 p. 83-85}۔"
