label:
  ar: "الدهري"
  en: "Dahri (the naturalist who holds that time is eternal)"
  ur: "دہری ⁦(زمانے کو ازلی ماننے والا)⁩"
  es: "Dahri (el naturalista que sostiene que el tiempo es eterno)"
  fr: "Dahri (le naturaliste qui soutient que le temps est éternel)"
  tr: "Kronik"
  id: "kronis"
summary:
  ar: "الدهريون في الاصطلاح فرقة من الكفار ذهبت إلى قدم الدهر وإسناد الحوادث إليه، ومنكرة وجود الصانع المختار، وإنكار للآخرة والبعث والجزاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8239} ويفرق الفقهاء بينه وبين الزنديق والملحد والمنافق والمرتد، ويشترك هؤلاء جميعا معه في الكفر، وحكم الدهري الأصلي يتبع حاله من حرب أو أمان أو ذمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8240}"
  en: "As a term the Dahriyya are a group of disbelievers who held that time is eternal and attributed events to it, denying the existence of a Creator who chooses, and denying the Hereafter, resurrection and recompense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8239} The jurists distinguish the Dahri from the zindiq, the mulhid, the hypocrite and the apostate, though all of them share disbelief with him; an original disbeliever of this kind is treated as a harbi, a musta'min or a dhimmi according to his residence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8240}"
  ur: "اصطلاح میں دہریہ کفار کا ایک گروہ ہے جو زمانے کو ازلی مانتا اور حوادث کو اسی کی طرف منسوب کرتا ہے، اور خالق مختار کے وجود اور آخرت کا انکار کرتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8239}"
  es: "El término Dahriyya se refiere a un grupo de incrédulos que sostenían que el tiempo es eterno y le atribuían los acontecimientos, negando la existencia de un Creador que elige y negando la vida después de la muerte, la resurrección y la retribución. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8239} Los juristas distinguen al Dahri del zindiq, el mulhid, el hipócrita y el apóstata, aunque todos ellos comparten la incredulidad con él; un incrédulo original de este tipo es tratado como harbi, musta'min o dhimmi según su lugar de residencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8240}"
  fr: "Le terme « Dahriyya » désigne un groupe de mécréants qui considèrent le temps comme éternel et lui attribuent les événements, niant l’existence d’un Créateur qui choisit, ainsi que la vie après la mort, la résurrection et la rétribution. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8239} Les juristes distinguent le Dahri du zindiq, du mulhid, de l’hypocrite et de l’apostat, bien que tous partagent l’incroyance; un mécréant originel de ce type est considéré comme un harbi, un musta’min ou un dhimmi selon son lieu de résidence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8240}"
  tr: "Terminoloji olarak, Dahirliler, eski zamanlara geri dönen ve olayları ona atfetmiş, seçilmiş Yaratıcı'nın varlığını ve Ahireti, dirilişi ve ödülü reddeden bir grup kâfirdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8239} Hukukçular, onu sapkın, ateist, münafık ve dinden dönen ile ayırır ve hepsi onun inançsızlığını paylaşır. Dahiri'nin orijinal hükmesi, onun savaş durumu, güvenlik veya dhimma durumuna bağlıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8240}"
  id: "Dalam istilah tertentu, Dahirite adalah kelompok kafir yang telah kembali ke zaman kuno dan mengaitkan peristiwa dengan mereka, menyangkal keberadaan Sang Pencipta pilihan, dan menyangkal Akhirat, kebangkitan, dan balasan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8239} Para ahli hukum membedakan antara dia dan yang sesat, ateis, munafik, dan murtad, dan semuanya berbagi ketidakpercayaannya. Keputusan asli Dahiri bergantung pada keadaan perang, aman, atau dhimma-nya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8240}"
