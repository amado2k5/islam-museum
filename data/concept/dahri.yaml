id: concept/dahri
class: concept
kind: doctrine
label:
  ar: "الدهري"
  en: "Dahri (the naturalist who holds that time is eternal)"
  ur: "دہری (زمانے کو ازلی ماننے والا)"
summary:
  ar: "الدهريون في الاصطلاح فرقة من الكفار ذهبت إلى قدم الدهر وإسناد الحوادث إليه، ومنكرة وجود الصانع المختار، وإنكار للآخرة والبعث والجزاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8239} ويفرق الفقهاء بينه وبين الزنديق والملحد والمنافق والمرتد، ويشترك هؤلاء جميعا معه في الكفر، وحكم الدهري الأصلي يتبع حاله من حرب أو أمان أو ذمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8240}"
  en: "As a term the Dahriyya are a group of disbelievers who held that time is eternal and attributed events to it, denying the existence of a Creator who chooses, and denying the Hereafter, resurrection and recompense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8239} The jurists distinguish the Dahri from the zindiq, the mulhid, the hypocrite and the apostate, though all of them share disbelief with him; an original disbeliever of this kind is treated as a harbi, a musta'min or a dhimmi according to his residence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8240}"
  ur: "اصطلاح میں دہریہ کفار کا ایک گروہ ہے جو زمانے کو ازلی مانتا اور حوادث کو اسی کی طرف منسوب کرتا ہے، اور خالق مختار کے وجود اور آخرت کا انکار کرتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8239}"
