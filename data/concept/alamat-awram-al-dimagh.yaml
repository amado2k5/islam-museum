id: concept/alamat-awram-al-dimagh
class: concept
kind: scientific
label:
  ar: "علامات أورام الدماغ"
  en: "The signs of swellings of the brain"
  fr: "Les signes des gonflements du cerveau"
  ur: "دماغ کے ورموں کی علامات"
  es: "Signos de inflamación cerebral"
summary:
  ar: "يذكر ابن سينا علامات الأورام الحارة والبلغمية والسوداوية في الدماغ، ويحيل على باب الصداع لدلائل ضعف الدماغ وقوته وعلامات الخلط الغالب {cite:canon-ibn-sina-print-v2 p.26}"
  en: "Ibn Sina gives the signs of hot, phlegmatic and black-bilious swellings in the brain, and refers to the chapter on headache for the signs of the brain's weakness and strength and of the prevailing humour {cite:canon-ibn-sina-print-v2 p.26}"
  fr: "Ibn Sina donne les signes des gonflements chauds, flegmatiques et dus à la bile noire qui touchent le cerveau. Il renvoie au chapitre sur la céphalée pour les signes de faiblesse ou de force du cerveau et ceux de l’humeur dominante {cite:canon-ibn-sina-print-v2 p.26}."
  ur: "ابن سینا دماغ میں گرم، بلغمی اور سوداوی ورموں کی علامات بتاتا ہے، اور دماغ کی کمزوری اور قوت اور غالب خلط کی علامات کے لیے سردرد کے باب کا حوالہ دیتا ہے {cite:canon-ibn-sina-print-v2 p.26}۔"
  es: "Ibn Sina da los signos de hinchazones calientes, flemáticas y de bilis negra en el cerebro, y remite al capítulo sobre el dolor de cabeza para los signos de debilidad y fortaleza del cerebro y del humor predominante {cite:canon-ibn-sina-print-v2 p.26}"
