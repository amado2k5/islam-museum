summary:
  ar: "أفلا ينظرون إلى الإبل كيف خلقت: أفاق العرب في بدئها أنعام ودواب رحمة وحُلي تركب وتُهدى وتُشكار، وفيها وفي غيرها عبرة لمن يتدبر آيات السماوات والأرض."
  en: "'Do they not look at the camels, how they are created?' For the desert Arabs the camel was livelihood and mercy: a mount, a gift, a bride-price; in it, as in all creatures, is a lesson for those who ponder the heavens and the earth."
  ur: "'کیا وہ اونٹوں کو نہیں دیکھتے کیسے پیدا کیے گئے؟' صحرائی عرب کے لیے اونٹ روزی اور رحمت تھا: سواری، ہدیہ، مہر؛ اس میں اور ہر مخلوق میں غور کرنے والوں کے لیے سبق ہے۔"
