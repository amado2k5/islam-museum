id: concept/asbab-al-dawar
class: concept
kind: scientific
label:
  ar: "أسباب الدوار"
  en: "Causes of vertigo (dawar)"
  fr: "Causes du vertige (dawar)"
  ur: "دوار کے اسباب"
summary:
  ar: "يعدد ابن سينا أسباب الدوار: دوران الإنسان على نفسه أو نظره إلى الأشياء الدائرة، وأسباب بدنية في الدماغ من بخارات وأخلاط، وضربة أو كسر، وبخارات متصاعدة من المعدة والمرارة والمثانة والحجاب، وفيه سطر موسوم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v2 p.113} {cite:canon-ibn-sina-print-v2 p.114} {cite:canon-ibn-sina-print-v2 p.115}"
  en: "Ibn Sina lists the causes of vertigo: a person turning on himself or looking at turning things, bodily causes in the brain from vapours and humours, a blow or a fracture, and vapours rising from the stomach, the gall bladder, the bladder and the diaphragm; the record has a labelled line in a section held for the founder's ruling {cite:canon-ibn-sina-print-v2 p.113} {cite:canon-ibn-sina-print-v2 p.114} {cite:canon-ibn-sina-print-v2 p.115}"
  fr: "Ibn Sina énumère les causes du vertige : tourner sur soi-même ou regarder des objets en rotation, des causes corporelles dans le cerveau provenant de vapeurs et d’humeurs, un coup ou une fracture, et des vapeurs montant de l’estomac, de la vésicule biliaire, de la vessie et du diaphragme ; la notice contient une ligne signalée dans une section en attente de la décision du fondateur {cite:canon-ibn-sina-print-v2 p.113} {cite:canon-ibn-sina-print-v2 p.114} {cite:canon-ibn-sina-print-v2 p.115}"
  ur: "ابن سینا دوار کے اسباب گنواتا ہے: انسان کا اپنے آپ پر گھومنا یا گھومتی چیزوں کو دیکھنا، دماغ میں بخارات اور اخلاط سے بدنی اسباب، چوٹ یا ٹوٹنا، اور معدے، مرارے، مثانے اور حجاب سے چڑھنے والے بخارات؛ اس میں ایک موسوم سطر بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v2 p.113} {cite:canon-ibn-sina-print-v2 p.114} {cite:canon-ibn-sina-print-v2 p.115}۔"
