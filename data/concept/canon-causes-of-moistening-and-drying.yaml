id: concept/canon-causes-of-moistening-and-drying
class: concept
kind: scientific
label:
  ar: "أسباب الترطيب والتجفيف عند ابن سينا"
  en: "The causes of moistening and of drying in the Canon"
  fr: "Causes d’humidification et de dessiccation dans le Canon"
  ur: "تر کرنے اور خشک کرنے کے اسباب، قانون کے مطابق"
  es: "Las causas de la humectación y del secado en el Canon"
summary:
  ar: "يعدد ابن سينا في الفصلين الثالث والرابع أسباب الترطيب وأسباب التجفيف، فيذكر في الأول السكون والنوم واحتباس ما يستفرغ وكثرة الغذاء والحمام على الطعام، وفي الثاني الحركة والسهر وكثرة الاستفراغ والجماع وقلة الغذاء {cite:canon-ibn-sina-print-v1 p.144}."
  en: "In chapters 3 and 4 Ibn Sina lists the causes of moistening and of drying, naming in the first rest, sleep, retention of what should be evacuated, abundant food and the bath after eating, and in the second movement, wakefulness, heavy evacuation, intercourse and scarcity of food {cite:canon-ibn-sina-print-v1 p.144}."
  fr: "Aux chapitres 3 et 4, Ibn Sina énumère les causes d’humidification : repos, sommeil, rétention, nourriture abondante, bain après repas ; et de dessiccation : mouvement, veille, forte évacuation, rapports sexuels et pénurie alimentaire {cite:canon-ibn-sina-print-v1 p.144}."
  es: "En los capítulos 3 y 4, Ibn Sina enumera las causas de la humectación y la sequedad, nombrando en la primera el descanso, el sueño, la retención de lo que debe evacuarse, la comida abundante y el baño después de comer, y en la segunda el movimiento, la vigilia, la evacuación abundante, las relaciones sexuales y la escasez de alimentos {cite:canon-ibn-sina-print-v1 p.144}."
