summary:
  ar: "يعدد ابن سينا في الفصلين الثالث والرابع أسباب الترطيب وأسباب التجفيف، فيذكر في الأول السكون والنوم واحتباس ما يستفرغ وكثرة الغذاء والحمام على الطعام، وفي الثاني الحركة والسهر وكثرة الاستفراغ والجماع وقلة الغذاء {cite:canon-ibn-sina-print-v1 p.144}."
  en: "In chapters 3 and 4 Ibn Sina lists the causes of moistening and of drying, naming in the first rest, sleep, retention of what should be evacuated, abundant food and the bath after eating, and in the second movement, wakefulness, heavy evacuation, intercourse and scarcity of food {cite:canon-ibn-sina-print-v1 p.144}."
