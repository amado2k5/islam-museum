  id: keep-the-codex-bare
  standing: secondary
  stance:
    ar: يُكره النقط والتعشير والفواتح ويُجرّد القرآن مما ليس منه
    en: Dots, tens and openings are disliked and the Qur'an is kept bare of what is not part of it
    ur: نقط، تعشیر اور فواتح ناپسندیدہ ہیں اور قرآن کو اس سے خالی رکھا جائے جو اس میں سے نہیں
  summary:
    ar: "روى أبو عبيد وغيره عن ابن مسعود: جرّدوا القرآن ولا تخلطوه بشيء. وعن النخعي أنه كره نقط المصاحف، وكره العواشر والفواتح وتصغير المصحف وأن يُكتب فيه سورة كذا؛ وعن ابن سيرين أنه كره النقط والفواتح والخواتيم، وعن ابن مسعود ومجاهد أنهما كرها التعشير، وعن أبي العالية كراهة الفواتح والخواتيم. ويقول يحيى بن أبي كثير إنهم ما كانوا يعرفون شيئاً مما أُحدث في المصاحف إلا النقط الثلاث على رؤوس الآيات {cite:itqan-suyuti p. 2246} {cite:itqan-suyuti p. 2247}."
    en: "Abu Ubayd and others relay from Ibn Mas'ud: keep the Qur'an bare and do not mix anything with it. From al-Nakha'i that he disliked dotting codices, and disliked the tens and openings, making the codex small, and writing in it 'sura such and such'; from Ibn Sirin that he disliked dots, openings and endings; from Ibn Mas'ud and Mujahid that they disliked tens; and from Abu al-Aliya the openings and endings. Yahya ibn Abi Kathir says they knew nothing of what was added to codices except three dots at the heads of verses {cite:itqan-suyuti p. 2246} {cite:itqan-suyuti p. 2247}."
    ur: "ابو عبید اور دوسروں نے ابن مسعود سے روایت کیا: قرآن کو خالی رکھو اور اس میں کسی چیز کی آمیزش نہ کرو۔ نخعی سے کہ وہ مصاحف کے نقط کو ناپسند کرتے تھے، اور دہائیوں اور فواتح، مصحف کو چھوٹا کرنے اور اس میں «فلاں سورت» لکھنے کو بھی؛ ابن سیرین سے کہ وہ نقط، فواتح اور خواتیم کو ناپسند کرتے تھے؛ ابن مسعود اور مجاہد سے کہ انھوں نے تعشیر کو ناپسند کیا؛ اور ابو العالیہ سے فواتح و خواتیم۔ یحییٰ بن ابی کثیر کہتے ہیں کہ وہ مصاحف میں نئے نکالے گئے امور میں سے آیات کے سروں پر تین نقطوں کے سوا کچھ نہ جانتے تھے {cite:itqan-suyuti p. 2246} {cite:itqan-suyuti p. 2247}۔"
