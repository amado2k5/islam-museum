label:
  ar: "تجريد المصحف: كراهة النقط والتعشير ثم إجازتهما"
  en: "Keeping the codex bare: the early dislike of dots and tens, and their later acceptance"
  ur: "مصحف کو خالی رکھنا: نقطوں اور تعشیر سے ابتدائی کراہت اور بعد کی اجازت"
  es: "Manteniendo el códice simple: la aversión inicial a los puntos y las decenas, y su posterior aceptación."
  fr: "Le codex épuré: la réticence initiale vis-à-vis des points et des dizaines, et leur acceptation ultérieure"
summary:
  ar: "روى أبو عبيد عن ابن مسعود «جرّدوا القرآن ولا تخلطوه بشيء»، وكره إبراهيم النخعي وابن سيرين وغيرهما النقط والتعشير والفواتح؛ ثم أجاز النقط والشكل الحسن وابن سيرين وربيعة، واستحبه النووي، وكره الحليمي الأعشار والأخماس وأجاز النقط لأنه لا صورة له {cite:itqan-suyuti p. 2246} {cite:itqan-suyuti p. 2247} {cite:itqan-suyuti p. 2248} {cite:itqan-suyuti p. 2249}."
  en: "Abu Ubayd relayed from Ibn Mas'ud 'keep the Qur'an bare and do not mix anything with it'; Ibrahim al-Nakha'i, Ibn Sirin and others disliked dots, tens and openings; al-Hasan, Ibn Sirin and Rabi'a later permitted dotting and vowelling, al-Nawawi called it recommended, and al-Halimi disliked tens and fives but allowed dots because they have no form {cite:itqan-suyuti p. 2246} {cite:itqan-suyuti p. 2247} {cite:itqan-suyuti p. 2248} {cite:itqan-suyuti p. 2249}."
  ur: "ابو عبید نے ابن مسعود سے روایت کیا «قرآن کو خالی رکھو اور اس میں کسی چیز کی آمیزش نہ کرو»، اور ابراہیم نخعی، ابن سیرین اور دوسروں نے نقطوں، تعشیر اور فواتح کو ناپسند کیا؛ پھر حسن، ابن سیرین اور ربیعہ نے نقط اور شکل کو جائز کہا، نووی نے مستحب کہا، اور حلیمی نے اعشار و اخماس کو ناپسند اور نقطوں کو جائز کہا کیونکہ ان کی کوئی صورت نہیں {cite:itqan-suyuti p. 2246} {cite:itqan-suyuti p. 2247} {cite:itqan-suyuti p. 2248} {cite:itqan-suyuti p. 2249}۔"
  es: "Abu Ubayd transmitió de Ibn Mas'ud 'mantén el Corán desnudo y no mezcles nada con él'; Ibrahim al-Nakha'i, Ibn Sirin y otros desaprobaban los puntos, las decenas y las aperturas; al-Hasan, Ibn Sirin y Rabi'a permitieron más tarde los puntos y las vocales, al-Nawawi lo consideró recomendable, y al-Halimi desaprobaba las decenas y las cincos pero permitía los puntos porque no tienen forma {cite:itqan-suyuti p. 2246} {cite:itqan-suyuti p. 2247} {cite:itqan-suyuti p. 2248} {cite:itqan-suyuti p. 2249}."
  fr: "Abou Ubayd a rapporté d'Ibn Mas'ud: « Gardez le Coran nu et n'y mélangez rien »; Ibrahim al-Nakha'i, Ibn Sirin et d'autres n'aimaient pas les points, les dizaines et les ouvertures; al-Hasan, Ibn Sirin et Rabi'a ont plus tard autorisé les points et les voyelles, al-Nawawi les a qualifiés de recommandés, et al-Halimi n'aimait pas les dizaines et les cinq mais autorisait les points car ils n'ont pas de forme {cite:itqan-suyuti p. 2246} {cite:itqan-suyuti p. 2247} {cite:itqan-suyuti p. 2248} {cite:itqan-suyuti p. 2249}."
