issue:
  ar: هل يجوز أن يُزاد على خط المصحف نقط وشكل وعلامات للأعشار والفواتح؟
  en: May dots, vowel marks and signs for tens and openings be added to the script of the codex?
  ur: کیا مصحف کے خط پر نقطے، اعراب اور دہائیوں اور فواتح کی علامات بڑھائی جا سکتی ہیں؟
perspectives:
- tradition: sunni
  id: dots-and-vowels-permitted
  standing: main
  stance:
    ar: يجوز النقط والشكل بل يُستحب لصيانة المصحف من اللحن
    en: Dots and vowelling are permitted, even recommended, to protect the codex from error
    ur: نقط اور شکل جائز بلکہ مستحب ہیں تاکہ مصحف لحن سے محفوظ رہے
  summary:
    ar: "روى ابن أبي داود عن الحسن وابن سيرين: لا بأس بنقط المصاحف، وعن ربيعة بن أبي عبد الرحمن: لا بأس بشكلها. وقال مالك: لا بأس بالنقط في المصاحف التي يتعلم فيها الغلمان أما الأمهات فلا. وقال النووي: نقط المصحف وشكله مستحب لأنه صيانة له من اللحن والتحريف. وقال الحليمي: يجوز النقط لأنه ليس له صورة فيُتوهم لأجلها ما ليس بقرآن قرآناً، وإنما هي دلالات على هيئة المقروء {cite:itqan-suyuti p. 2247} {cite:itqan-suyuti p. 2248} {cite:itqan-suyuti p. 2249}."
    en: "Ibn Abi Dawud relays from al-Hasan and Ibn Sirin: no harm in dotting codices, and from Rabi'a ibn Abi Abd al-Rahman: no harm in vowelling them. Malik said: no harm in dots in the codices from which boys learn, but not in the mothers. Al-Nawawi said: dotting and vowelling the codex is recommended because it protects it from error and corruption. Al-Halimi said: dots are permitted because they have no form from which one might suppose what is not Qur'an to be Qur'an; they are only indications of how it is to be read {cite:itqan-suyuti p. 2247} {cite:itqan-suyuti p. 2248} {cite:itqan-suyuti p. 2249}."
    ur: "ابن ابی داود نے حسن اور ابن سیرین سے روایت کیا: مصاحف کے نقط میں کوئی حرج نہیں، اور ربیعہ بن ابی عبد الرحمن سے: ان کے شکل میں کوئی حرج نہیں۔ مالک نے کہا: ان مصاحف میں نقط میں حرج نہیں جن سے لڑکے سیکھتے ہیں، امہات میں نہیں۔ نووی نے کہا: مصحف کے نقط اور شکل مستحب ہیں کیونکہ یہ اسے لحن اور تحریف سے بچاتے ہیں۔ حلیمی نے کہا: نقط جائز ہیں کیونکہ ان کی کوئی صورت نہیں جس کے سبب غیرِ قرآن کو قرآن سمجھا جائے، وہ تو پڑھنے کی ہیئت پر دلالتیں ہیں {cite:itqan-suyuti p. 2247} {cite:itqan-suyuti p. 2248} {cite:itqan-suyuti p. 2249}۔"
