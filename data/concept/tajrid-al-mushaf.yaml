  id: jarridu-meant-something-else
  standing: secondary
  stance:
    ar: مراد ابن مسعود ألا يُخلط بالقرآن غيره من الكتب أو الأحاديث
    en: Ibn Mas'ud meant that nothing else, no other books or reports, should be mixed with the Qur'an
    ur: ابن مسعود کی مراد یہ تھی کہ قرآن کے ساتھ دوسری کتابیں یا روایتیں نہ ملائی جائیں
  summary:
    ar: "ينقل السبت عن أبي عبيد أن إبراهيم النخعي كان يذهب بقول ابن مسعود إلى نقط المصاحف، ولكن أبا عبيد يرى أن الأبين أن ابن مسعود أراد ألا يُتعلّم شيء من كتب الله غير القرآن لأن ما خلا القرآن إنما يؤخذ عن اليهود والنصارى وليسوا بمأمونين عليها؛ ويذكر عمر: جرّدوا القرآن وأقلّوا الرواية عن رسول الله، وأنه لم يُرد ترك الحديث. وينقل السيوطي عن الحربي أن التجريد يحتمل التلاوة أو الخط، وعن البيهقي أن الأبين ألا يُخلط به غيره من الكتب. ويحصي السبت الاحتمالات: تجريده في الخط من النقط والشكل والتعشير، أو من التفسير، أو في التلاوة ألا يُشتغل بكتب سابقة أو ألا يُشتغل عنه بالحديث {cite:manahil-irfan-sabt p. 332} {cite:manahil-irfan-sabt p. 333} {cite:itqan-suyuti p. 2251}."
    en: "Al-Sabt relays from Abu Ubayd that Ibrahim al-Nakha'i took Ibn Mas'ud's saying to refer to dotting codices, but Abu Ubayd thinks the clearer meaning is that Ibn Mas'ud wanted nothing of God's books other than the Qur'an to be learned, since what lies outside the Qur'an is taken from the Jews and Christians, who are not trusted with it; he cites Umar's 'keep the Qur'an bare and report little from the Messenger of God' as not meaning leaving hadith. Al-Suyuti quotes al-Harbi that bareness may refer to recitation or to the script, and al-Bayhaqi that the clearer sense is that no other books be mixed with it. Al-Sabt counts the possibilities: bareness in the script from dots, vowels and tens, or from explanation; or in recitation, not busying oneself with earlier books, or not neglecting the Qur'an for hadith {cite:manahil-irfan-sabt p. 332} {cite:manahil-irfan-sabt p. 333} {cite:itqan-suyuti p. 2251}."
    ur: "سبت ابو عبید سے نقل کرتے ہیں کہ ابراہیم نخعی ابن مسعود کے قول کو مصاحف کے نقط پر لے جاتے تھے، لیکن ابو عبید سمجھتے ہیں کہ زیادہ واضح یہ ہے کہ ابن مسعود چاہتے تھے کہ قرآن کے سوا اللہ کی کتابوں میں سے کچھ نہ سیکھا جائے کیونکہ قرآن کے سوا جو ہے وہ یہود و نصاریٰ سے لیا جاتا ہے اور وہ اس پر امین نہیں؛ وہ عمر کا قول لاتے ہیں «قرآن کو خالی رکھو اور رسول اللہ سے روایت کم کرو» کہ اس کا مطلب حدیث ترک کرنا نہیں۔ سیوطی حربی سے نقل کرتے ہیں کہ تجرید تلاوت یا خط دونوں پر محمول ہو سکتی ہے، اور بیہقی سے کہ زیادہ واضح یہ ہے کہ اس میں دوسری کتابیں نہ ملائی جائیں۔ سبت احتمال گنواتے ہیں: خط میں نقط، شکل اور تعشیر سے خالی، یا تفسیر سے؛ یا تلاوت میں پچھلی کتابوں میں مشغول نہ ہونا، یا اس سے حدیث میں مشغول ہو کر غافل نہ ہونا {cite:manahil-irfan-sabt p. 332} {cite:manahil-irfan-sabt p. 333} {cite:itqan-suyuti p. 2251}۔"
