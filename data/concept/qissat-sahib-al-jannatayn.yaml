id: concept/qissat-sahib-al-jannatayn
class: concept
kind: term
label:
  ar: "قصة صاحب الجنتين"
  en: "The story of the owner of the two gardens"
  ur: "دو باغوں والے کا قصہ"
summary:
  ar: "المثل القرآني للرجلين اللذين جُعلت لأحدهما جنتان، كما يعرضه عمر عبد الكافي في سلسلة «قصة وعبر»: غنيّ نسي المنعم فتدرّج من إنكار النعمة إلى إنكار الساعة، فأُحيط بثمره، وعبرته أن العطاء والمنع كليهما ابتلاء."
  en: "The Qur'anic parable of two men, one of whom was given two gardens, as Omar Abdelkafy presents it in the series Qissa wa 'Ibar: a rich man who forgot the Giver, slid from denying the favour to denying the Hour, and saw his fruit destroyed; its lesson, for him, is that giving and withholding are both a trial."
  ur: "دو آدمیوں کی قرآنی مثال جن میں سے ایک کو دو باغ دیے گئے، جیسے عمر عبد الکافی سلسلہ «قصہ و عبر» میں پیش کرتے ہیں: ایک دولت مند جو نعمت دینے والے کو بھول گیا، نعمت کے انکار سے قیامت کے انکار تک گیا اور اس کا پھل برباد ہوا؛ ان کے نزدیک سبق یہ ہے کہ دینا اور روکنا دونوں آزمائش ہیں۔"
