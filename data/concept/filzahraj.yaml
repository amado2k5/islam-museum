id: concept/filzahraj
class: concept
kind: natural
label:
  ar: "فيلزهرج"
  en: "Filzahraj (a tree like the huḍuḍ)"
  ur: "فیلزہرج"
  es: "Filzahraj (un árbol como el huḍuḍ)"
  fr: "Filzahraj (un arbre semblable au huḍuḍ)"
summary:
  ar: "فيلزهرج في الكتاب قيل إنه شجرة الحضض وله ثمرة كالفلفل، وقوته قريبة من قوة الحضض وأضعف يسيرا، يقوي الشعر طلاء وتطبخ فروعه بالخل للطحال واليرقان، ويذكر الكتاب أن طبيخ ورقه وفروعه يدر الحيض {cite:canon-ibn-sina-print-v1 pp.629-630}"
  en: "Filzahraj is in the book said to be the tree of the huḍuḍ, with a fruit like pepper, its power near that of huḍuḍ and slightly weaker; applied it strengthens the hair, its branches cooked in vinegar are used for the spleen and for jaundice, and the book lists that a decoction of its leaf and branches brings on the menses {cite:canon-ibn-sina-print-v1 pp.629-630}"
  ur: "فیلزہرج کتاب میں کہا گیا ہے کہ حضض کا درخت ہے اور اس کا پھل مرچ جیسا ہے، اس کی قوت حضض کے قریب اور ذرا کمزور ہے؛ لیپ سے بالوں کو مضبوط کرتا ہے، اس کی شاخیں سرکے میں پکا کر تلی اور یرقان کے لیے استعمال ہوتی ہیں، اور کتاب بتاتی ہے کہ اس کے پتے اور شاخوں کا جوشاندہ حیض جاری کرتا ہے {cite:canon-ibn-sina-print-v1 pp.629-630}۔"
  es: "En el libro se dice que Filzahraj es el árbol del huḍuḍ, con un fruto parecido a la pimienta, cuyo poder es similar al del huḍuḍ y ligeramente menor; aplicado fortalece el cabello, sus ramas cocidas en vinagre se usan para el bazo y la ictericia, y el libro menciona que una decocción de sus hojas y ramas provoca la menstruación {cite:canon-ibn-sina-print-v1 pp.629-630}"
  fr: "Le Filzahraj est décrit dans le livre comme étant l'arbre du huḍuḍ, avec un fruit semblable au poivre, dont la puissance est proche de celle du huḍuḍ et légèrement inférieure; appliqué, il fortifie les cheveux, ses branches cuites dans du vinaigre sont utilisées pour la rate et la jaunisse, et le livre indique qu'une décoction de ses feuilles et de ses branches provoque les menstruations {cite:canon-ibn-sina-print-v1 pp.629-630}"
