label: { ar: "النُّشُوز", en: "Marital disobedience (nushuz) and its rulings", ur: "نشوز ⁦(ازدواجی نافرمانی)⁩ اور اس کے احکام", es: "La desobediencia conyugal (nushuz) y sus normas", fr: "La désobéissance conjugale (nushuz) et ses règles" }
summary:
  ar: "النشوز في اللغة الارتفاع، ويقال نشزت المرأة إذا عصت زوجها وامتنعت عليه. واصطلاحاً عند الحنفية خروج الزوجة من بيت زوجها بغير حق، وعند المالكية والشافعية والحنابلة خروجها عن الطاعة الواجبة للزوج، وقد يكون النشوز من الزوج أيضاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15706} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15707} والنشوز محرم عند الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15707} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15708} وتختلف صوره: فعند الحنفية يكون في النكاح بمنع النفس بغير حق والخروج من المنزل، وفي العدة بالخروج منها مراغمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15709} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15710} وعند المالكية والشافعية والحنابلة تُعدّ من النشوز صور كالخروج بغير إذن والسفر بغير إذن، والإغلاق في وجه الزوج، ومنع الاستمتاع بغير عذر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15710} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15711} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15712} وأثر النشوز على النفقة: فجمهور الفقهاء على سقوط نفقة الناشز وسكناها، وعلى عودتها بالرجوع إلى الطاعة، واختلفوا في التفصيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15712} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15713} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15714} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15715} وتفقد الزوجة الناشزة حقها في القسم بين الزوجات، ولا تُعطى من الزكاة عند الشافعية في الأصح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15716} ويجوز للزوج تأديب زوجته الناشز بالوعظ والهجر في المضجع والضرب غير المبرح، واختلفوا في ترتيب هذه الوسائل وفي شرط تكرار النشوز قبل الضرب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15716} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15717} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15718} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15719} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15720} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15721} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15722} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15723} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15725} ويضمن الزوج ما تلف من ضرب التأديب المشروع عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15723} ومن تعدى من الزوجين على الآخر يزجره الحاكم، فإن اشتد الشقاق بعث الحاكم حكمين من أهل الزوجين، واختلفوا في كونهما وكيلين أو حاكمين، وفي ما يملكانه من الجمع والتفريق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15730} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15733} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15735} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15736} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15739}"
  en: "Nushuz in the lexicon means rising up, and a wife is said to be nashiz when she disobeys her husband and withholds herself from him. As a term the Hanafis define it as a wife leaving her husband's house without right, and the Malikis, Shafi'is and Hanbalis as a wife leaving the obedience owed to her husband; it may also come from the husband. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15706} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15707} It is forbidden in the jurists' view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15707} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15708} The Hanafis distinguish nushuz in marriage, a wife withholding herself and leaving his house, from nushuz during the waiting period, leaving it out of defiance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15709} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15710} The other schools count further forms, such as leaving or travelling without permission, bolting the door, and withholding enjoyment without a reason. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15710} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15711} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15712} Most jurists hold that a nashiz wife loses maintenance and lodging, and that they return when she comes back to obedience, though the details differ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15712} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15713} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15714} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15715} A wife in nushuz loses her turn in the rotation, and the Shafi'is in the sound view do not give her zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15716} The husband may discipline her by admonition, leaving her in bed, and beating that is not severe; the jurists differ on the order of these measures and on whether nushuz must be repeated before beating. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15716} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15717} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15718} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15719} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15720} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15721} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15722} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15723} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15725} The majority hold the husband liable for any loss from lawful discipline. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15723} If there is wrongdoing by either spouse, the judge restrains it; if the dispute grows, he appoints two arbiters, one from each family. The jurists differ on whether they are agents or judges, and on what they may do, such as reconciling, separating or taking payment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15730} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15733} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15735} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15736} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15739}"
  ur: "نشوز لغت میں بلند ہونے کو کہتے ہیں، اور اصطلاح میں بیوی کا شوہر کی واجب اطاعت سے نکلنا ہے، جبکہ حنفیہ کے نزدیک بغیر حق کے گھر سے نکلنا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15706} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15707} نشوز حرام ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15708} نشوز کی بیوی کا نفقہ اور سکنی جمہور فقہاء کے نزدیک ساقط ہو جاتا ہے، اور اطاعت کی طرف لوٹنے پر واپس آ جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15712} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15714} شوہر وعظ، بستر میں ترک اور غیر شدید مار کے ذریعے تأدیب کر سکتا ہے، اور ترتیب میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15716} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15719} زوجین کے باہمی شقاق میں حاکم دو حکم مقرر کرتا ہے، جن کی حیثیت وکیل یا حاکم ہونے میں فقہاء کا اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15733}"
  es: "Nushuz en el léxico significa levantarse, y se dice que una esposa es nashiz cuando desobedece a su marido y se retiene de él. Como término, los hanafíes lo definen como una esposa que abandona la casa de su marido sin derecho, y los malikíes, shafi'ís y hanbalíes como una esposa que abandona la obediencia debida a su marido; también puede provenir del marido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15706} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15707} Está prohibido en la opinión de los juristas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15707} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15708} Los hanafíes distinguen nushuz en el matrimonio, una esposa que se retiene y abandona la casa de su marido, de nushuz durante el período de espera, abandonándola por desafío. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15709} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15710} Las otras escuelas cuentan otras formas, como irse o viajar sin permiso, cerrar la puerta con llave y retener el disfrute sin motivo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15710} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15711} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15712} La mayoría de los juristas sostienen que una esposa nashiz pierde el sustento y el alojamiento, y que estos se le devuelven cuando ella vuelve a la obediencia, aunque los detalles difieren. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15712} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15713} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15714} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15715} Una esposa en nushuz pierde su turno en la rotación, y los shafi'ís en la opinión sana no le dan zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15716} El marido puede disciplinarla mediante amonestación, dejándola en la cama y golpes que no sean severos; los juristas difieren en el orden de estas medidas y en si se debe repetir el nushuz antes de los golpes. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15716} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15717} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15718} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15719} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15720} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15721} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15722} {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.15723} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15725} La mayoría considera al marido responsable de cualquier pérdida derivada de la disciplina legal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15723} Si hay mala conducta por parte de alguno de los cónyuges, el juez la restringe; si la disputa crece, nombra a dos árbitros, uno de cada familia. Los juristas difieren en cuanto a si son agentes o jueces, y en cuanto a lo que pueden hacer, como reconciliar, separar o cobrar. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15729} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15730} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15731} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15733} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15734} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15735} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15736} {citar:fiqh-mawsua-kuwaitiyya-noor-v3 pág. 15739}"
  fr: "Le terme « nushuz » dans le lexique signifie « se lever », et une femme est dite « nashiz » lorsqu'elle désobéit à son mari et se refuse à lui. Les Hanafites définissent ce terme comme le fait pour une femme de quitter le domicile conjugal sans y être autorisée, tandis que les Malikites, les Shafi'ites et les Hanbalites le définissent comme le fait pour une femme de manquer à l'obéissance due à son mari; ce manquement peut également venir du mari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15706} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15707} Selon les juristes, cette situation est interdite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15707} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15708} Les hanafites distinguent le nushuz dans le mariage, où l'épouse se refuse à vivre avec son conjoint et quitte le domicile conjugal, du nushuz pendant la période d'attente, où elle quitte le domicile par défi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15709} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15710} Les autres écoles recensent d'autres formes, comme le fait de partir ou de voyager sans permission, de verrouiller la porte et de refuser la jouissance sans raison. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15710} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15711} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15712} La plupart des juristes estiment qu'une femme nashiz perd la pension alimentaire et le logement, et qu'ils reviennent lorsqu'elle revient à l'obéissance, bien que les détails diffèrent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15712} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15713} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15714} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15715} Une femme en état de nushuz perd son tour dans la rotation des épouses, et les shafi'ites, dans leur avis le plus juste, ne lui versent pas la zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15716} Le mari peut la discipliner en l'avertissant, en la laissant au lit et en lui infligeant une correction physique modérée; les juristes divergent quant à l'ordre de ces mesures et quant à la nécessité de répéter le nushuz avant de donner une correction physique. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15716} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15717} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15718} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15719} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15720} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15721} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15722} {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.15723} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15725} La majorité considère le mari responsable de toute perte résultant d'une discipline légale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15723} En cas de faute de l'un ou l'autre des époux, le juge intervient; si le différend s'envenime, il désigne deux arbitres, un de chaque famille. Les juristes divergent quant à leur rôle (agents ou juges) et à leurs prérogatives, telles que la réconciliation, la séparation ou le versement d'une compensation financière. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15730} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15733} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15735} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15736} {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.15739}"
