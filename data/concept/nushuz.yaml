id: concept/nushuz
class: concept
kind: legal
label: { ar: "النُّشُوز", en: "Marital disobedience (nushuz) and its rulings", ur: "نشوز (ازدواجی نافرمانی) اور اس کے احکام" }
summary:
  ar: "النشوز في اللغة الارتفاع، ويقال نشزت المرأة إذا عصت زوجها وامتنعت عليه. واصطلاحاً عند الحنفية خروج الزوجة من بيت زوجها بغير حق، وعند المالكية والشافعية والحنابلة خروجها عن الطاعة الواجبة للزوج، وقد يكون النشوز من الزوج أيضاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15706} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15707} والنشوز محرم عند الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15707} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15708} وتختلف صوره: فعند الحنفية يكون في النكاح بمنع النفس بغير حق والخروج من المنزل، وفي العدة بالخروج منها مراغمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15709} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15710} وعند المالكية والشافعية والحنابلة تُعدّ من النشوز صور كالخروج بغير إذن والسفر بغير إذن، والإغلاق في وجه الزوج، ومنع الاستمتاع بغير عذر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15710} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15711} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15712} وأثر النشوز على النفقة: فجمهور الفقهاء على سقوط نفقة الناشز وسكناها، وعلى عودتها بالرجوع إلى الطاعة، واختلفوا في التفصيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15712} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15713} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15714} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15715} وتفقد الزوجة الناشزة حقها في القسم بين الزوجات، ولا تُعطى من الزكاة عند الشافعية في الأصح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15716} ويجوز للزوج تأديب زوجته الناشز بالوعظ والهجر في المضجع والضرب غير المبرح، واختلفوا في ترتيب هذه الوسائل وفي شرط تكرار النشوز قبل الضرب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15716} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15717} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15718} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15719} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15720} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15721} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15722} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15723} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15725} ويضمن الزوج ما تلف من ضرب التأديب المشروع عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15723} ومن تعدى من الزوجين على الآخر يزجره الحاكم، فإن اشتد الشقاق بعث الحاكم حكمين من أهل الزوجين، واختلفوا في كونهما وكيلين أو حاكمين، وفي ما يملكانه من الجمع والتفريق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15730} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15733} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15735} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15736} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15739}"
  en: "Nushuz in the lexicon means rising up, and a wife is said to be nashiz when she disobeys her husband and withholds herself from him. As a term the Hanafis define it as a wife leaving her husband's house without right, and the Malikis, Shafi'is and Hanbalis as a wife leaving the obedience owed to her husband; it may also come from the husband. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15706} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15707} It is forbidden in the jurists' view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15707} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15708} The Hanafis distinguish nushuz in marriage, a wife withholding herself and leaving his house, from nushuz during the waiting period, leaving it out of defiance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15709} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15710} The other schools count further forms, such as leaving or travelling without permission, bolting the door, and withholding enjoyment without a reason. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15710} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15711} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15712} Most jurists hold that a nashiz wife loses maintenance and lodging, and that they return when she comes back to obedience, though the details differ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15712} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15713} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15714} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15715} A wife in nushuz loses her turn in the rotation, and the Shafi'is in the sound view do not give her zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15716} The husband may discipline her by admonition, leaving her in bed, and beating that is not severe; the jurists differ on the order of these measures and on whether nushuz must be repeated before beating. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15716} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15717} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15718} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15719} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15720} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15721} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15722} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15723} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15725} The majority hold the husband liable for any loss from lawful discipline. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15723} If there is wrongdoing by either spouse, the judge restrains it; if the dispute grows, he appoints two arbiters, one from each family. The jurists differ on whether they are agents or judges, and on what they may do, such as reconciling, separating or taking payment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15730} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15733} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15735} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15736} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15739}"
  ur: "نشوز لغت میں بلند ہونے کو کہتے ہیں، اور اصطلاح میں بیوی کا شوہر کی واجب اطاعت سے نکلنا ہے، جبکہ حنفیہ کے نزدیک بغیر حق کے گھر سے نکلنا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15706} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15707} نشوز حرام ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15708} نشوز کی بیوی کا نفقہ اور سکنی جمہور فقہاء کے نزدیک ساقط ہو جاتا ہے، اور اطاعت کی طرف لوٹنے پر واپس آ جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15712} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15714} شوہر وعظ، بستر میں ترک اور غیر شدید مار کے ذریعے تأدیب کر سکتا ہے، اور ترتیب میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15716} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15719} زوجین کے باہمی شقاق میں حاکم دو حکم مقرر کرتا ہے، جن کی حیثیت وکیل یا حاکم ہونے میں فقہاء کا اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15733}"
