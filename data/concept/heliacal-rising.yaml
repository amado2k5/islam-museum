id: concept/heliacal-rising
class: concept
kind: scientific
label: { ar: "طلوع الكوكب من شعاع الشمس", en: "Rising out of the sun's rays (heliacal rising)" }
summary:
  ar: "ظهور الكوكب بعد أن كان مستتراً بشعاع الشمس، فيُرى في المشرق قبل الفجر بعد استتاره (المشرق بالغداة)، ويُرى في المغرب بعد الغروب (المغرب بالعشايا). تتوقف مدة الاستتار على بعد الكوكب عن الشمس وعلى سرعته وعرضه، وتطول للكواكب البطيئة وللعروض الشمالية. {cite:farghani-elements-astronomy p. 41}{cite:farghani-elements-astronomy p. 30}{cite:farghani-elements-astronomy p. 33}"
  en: "The reappearance of a star or planet after it has been hidden in the sun's rays: it rises in the east before dawn once it clears the sun (called al-mashriq bil-ghadawat), and sets in the west after dusk (al-maghrib bil-'ashaya). The period of concealment depends on the distance from the sun, the speed and the latitude {cite:farghani-elements-astronomy p. 41}{cite:farghani-elements-astronomy p. 30}{cite:farghani-elements-astronomy p. 33}."
