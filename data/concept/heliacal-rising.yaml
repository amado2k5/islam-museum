id: concept/heliacal-rising
class: concept
kind: scientific
label: { ar: "طلوع الكوكب من شعاع الشمس", en: "Rising out of the sun's rays (heliacal rising)", es: "Surgiendo de los rayos del sol (salida helíaca)", fr: "Émergeant des rayons du soleil (lever héliaque)" }
summary:
  ar: "ظهور الكوكب بعد أن كان مستتراً بشعاع الشمس، فيُرى في المشرق قبل الفجر بعد استتاره ⁦(المشرق بالغداة)⁩، ويُرى في المغرب بعد الغروب ⁦(المغرب بالعشايا)⁩. تتوقف مدة الاستتار على بعد الكوكب عن الشمس وعلى سرعته وعرضه، وتطول للكواكب البطيئة وللعروض الشمالية. {cite:farghani-elements-astronomy p. 41}{cite:farghani-elements-astronomy p. 30}{cite:farghani-elements-astronomy p. 33}"
  en: "The reappearance of a star or planet after it has been hidden in the sun's rays: it rises in the east before dawn once it clears the sun (called al-mashriq bil-ghadawat), and sets in the west after dusk (al-maghrib bil-'ashaya). The period of concealment depends on the distance from the sun, the speed and the latitude {cite:farghani-elements-astronomy p. 41}{cite:farghani-elements-astronomy p. 30}{cite:farghani-elements-astronomy p. 33}."
  es: "La reaparición de una estrella o planeta después de haber estado oculto por los rayos del sol: sale por el este antes del amanecer una vez que sale del sol (llamado al-mashriq bil-ghadawat), y se pone por el oeste después del anochecer (al-maghrib bil-'ashaya). El período de ocultación depende de la distancia al sol, la velocidad y la latitud {cite:farghani-elements-astronomy p. 41}{cite:farghani-elements-astronomy p. 30}{cite:farghani-elements-astronomy p. 33}."
  fr: "La réapparition d'une étoile ou d'une planète après avoir été masquée par les rayons du soleil: elle se lève à l'est avant l'aube une fois qu'elle a dégagé l'ombre du soleil (phénomène appelé al-mashriq bil-ghadawat) et se couche à l'ouest après le crépuscule (al-maghrib bil-'ashaya). La durée de cette dissimulation dépend de la distance au soleil, de la vitesse du soleil et de la latitude."
