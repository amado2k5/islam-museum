summary:
  ar: "حبّ الميسم حبّ في مقدار الفلفل ولونه، سهل الانكسار، ينفلق عن لبّ شديد البياض عطر، حار يابس في الثانية، وجيّد للمعدة الباردة والمسترخية فيما يُقال. وحسب حاشية المحقّق هو حبّ البان."
  en: "Habb al-maysam is a berry the size and colour of pepper that breaks easily into a very white, fragrant kernel. The book gives it as hot and dry in the second degree and good for a cold, slack stomach, it is said. The editor's note identifies it as habb al-ban."
  ur: "حب المیسم کالی مرچ جتنا اور اسی رنگ کا دانہ ہے جو آسانی سے ٹوٹ جاتا ہے اور اندر سے نہایت سفید، خوشبودار مغز نکلتا ہے۔ کتاب اسے دوسرے درجے میں گرم اور خشک بتاتی ہے، اور کہا جاتا ہے کہ یہ سرد اور ڈھیلے معدے کے لیے اچھا ہے۔ مدوّن کے حاشیے کے مطابق یہ حب البان ہے۔"
  es: "Habb al-maysam es una baya del tamaño y color de la pimienta que se desprende fácilmente en una semilla muy blanca y fragante. El libro la describe como picante y seca en segundo grado, y se dice que es buena para el estómago frío y flácido. La nota del editor la identifica como habb al-ban."
  fr: "Le habb al-maysam est une baie de la taille et de la couleur du poivre, qui s'ouvre facilement en un grain très blanc et parfumé. Le livre la décrit comme étant chaude et sèche au deuxième degré et bénéfique en cas de rhume et de troubles digestifs. La note de l'éditeur l'identifie comme habb al-ban."
