label:
  ar: "قانون باريتو (قاعدة 80/20)"
  en: "Pareto's law (the 80/20 rule)"
  ur: "قانون پاریتو (اصول 80/20)"
summary:
  ar: "قانون باريتو كما يدرّسه طارق السويدان: عشرون في المئة من الأسباب تؤدي إلى ثمانين في المئة من النتائج — في القرارات والوقت والزبائن والموظفين والمشاكل — وقاعدة جاك ويلش في جنرال إلكتريك (20/70/10) تطبيق له."
  en: "Pareto's law as Tareq al-Suwaidan teaches it: twenty per cent of causes yield eighty per cent of results — in decisions, time, customers, staff and problems — with Jack Welch's 20/70/10 rule at General Electric as an application."
  ur: "قانون پاریتو جیسا کہ طارق السویدان سکھاتے ہیں: بیس فیصد اسباب اسی فیصد نتائج پیدا کرتے ہیں — فیصلوں، وقت، گاہکوں، ملازمین اور مسائل میں — اور جنرل الیکٹرک میں جیک ویلچ کا اصول 20/70/10 اس کا اطلاق ہے۔"
