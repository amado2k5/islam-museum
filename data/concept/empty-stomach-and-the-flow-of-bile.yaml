id: concept/empty-stomach-and-the-flow-of-bile
class: concept
kind: scientific
label: { ar: "خلو المعدة وانصباب المرة", en: "The empty stomach and the flow of bile", ur: "خالی معدہ اور صفرا کا بہنا" }
summary:
  ar: "يصف ابن سينا ما يعرض لمن أبقى معدته خالية: حموضة في الجشاء وخبث نفس وغثيان ومرارة في الفم ولين بطن وجبن وجزع ووجع في فم المعدة ولذع وبول محرق وبرد أطراف بانصباب المرة إلى المعدة، وهذا أكثر في مراري الأمزجة، ويدبر ذوو المرار الكثير بتغذية سريعة مفرقة قبل الاستحمام {cite:canon-ibn-sina-print-v1 p.231}."
  en: "Ibn Sina describes what happens to one who leaves the stomach empty: sour belching, a bad mood, nausea, a bitter mouth, a loose belly, timidity, pain and stinging at the mouth of the stomach, scorching urine and cold limbs as bile pours into the stomach; this is commoner in bilious temperaments, who are managed with quick, divided feeding before the bath {cite:canon-ibn-sina-print-v1 p.231}."
