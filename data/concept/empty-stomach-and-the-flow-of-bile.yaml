id: concept/empty-stomach-and-the-flow-of-bile
class: concept
kind: scientific
label: { ar: "خلو المعدة وانصباب المرة", en: "The empty stomach and the flow of bile", ur: "خالی معدہ اور صفرا کا بہنا", es: "El estómago vacío y el flujo de bilis", fr: "L'estomac vide et le flux de bile" }
summary:
  ar: "يصف ابن سينا ما يعرض لمن أبقى معدته خالية: حموضة في الجشاء وخبث نفس وغثيان ومرارة في الفم ولين بطن وجبن وجزع ووجع في فم المعدة ولذع وبول محرق وبرد أطراف بانصباب المرة إلى المعدة، وهذا أكثر في مراري الأمزجة، ويدبر ذوو المرار الكثير بتغذية سريعة مفرقة قبل الاستحمام {cite:canon-ibn-sina-print-v1 p.231}."
  en: "Ibn Sina describes what happens to one who leaves the stomach empty: sour belching, a bad mood, nausea, a bitter mouth, a loose belly, timidity, pain and stinging at the mouth of the stomach, scorching urine and cold limbs as bile pours into the stomach; this is commoner in bilious temperaments, who are managed with quick, divided feeding before the bath {cite:canon-ibn-sina-print-v1 p.231}."
  es: "Ibn Sina describe lo que le sucede a quien deja el estómago vacío: eructos ácidos, mal humor, náuseas, boca amarga, flacidez abdominal, timidez, dolor y escozor en la boca del estómago, orina ardiente y extremidades frías a medida que la bilis se vierte en el estómago; esto es más común en temperamentos biliares, que se controlan con una alimentación rápida y fraccionada antes del baño {cite:canon-ibn-sina-print-v1 p.231}."
  fr: "Ibn Sina décrit ce qui arrive à celui qui laisse son estomac vide: des rots acides, de la mauvaise humeur, des nausées, un goût amer dans la bouche, un ventre mou, de la timidité, des douleurs et des picotements à l'entrée de l'estomac, des urines brûlantes et des extrémités froides lorsque la bile se déverse dans l'estomac; ceci est plus fréquent chez les tempéraments bilieux, que l'on soigne en leur donnant des repas rapides et fractionnés avant le bain {cite:canon-ibn-sina-print-v1 p.231}."
