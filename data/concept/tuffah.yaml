summary:
  ar: "تفاح في الكتاب أعدله الشامي والتفه منه رديء قليل المنافع، والغالب في جوهره رطوبة فضلية باردة، والعفص والقابض والحامض بارد غليظ والحلو مائي، فيه منع للفضول وخصوصا في ورقه ونفخ، وورقه وعصارته ينفعان في ابتداء الأورام الحارة والنملة وورقه ولحاؤه يدملان، ويقوي القلب خصوصا العطر الشامي، ويقوي المعدة الضعيفة، والمشوي في العجين ينفع من قلة الشهوة والدود والدوسنطاريا، وإدمان أكله يحدث وجع العصب، وقد يتولد من خامه حميات {cite:canon-ibn-sina-print-v1 pp.691-692}"
  en: "Tuffah is in the book an apple whose most temperate kind is the Shami, while the insipid is bad with few benefits; the dominant matter in its substance is a cold superfluous moisture, the astringent, tart and sour being cold and thick and the sweet watery; it has a holding back of superfluities, especially in its leaf, and bloating; its leaf and juice benefit the beginning of hot swellings and erysipelas, its leaf and bark heal, it strengthens the heart, especially the fragrant Shami, and the weak stomach; baked in dough it benefits poor appetite, worms and dysentery; constant eating of it brings nerve pain, and from the raw fruit many fevers may arise {cite:canon-ibn-sina-print-v1 pp.691-692}"
  ur: "تفاح کتاب میں ایک پھل ہے جس کی سب سے معتدل قسم شامی ہے اور بے مزہ رد ہے جس کے فائدے کم ہیں؛ اس کے جوہر میں غالب ایک سرد فاضل رطوبت ہے، کسیلا، قابض اور کھٹا سرد اور گاڑھا ہے اور میٹھا آبی؛ اس میں فضلات کو روکنے کی قوت ہے، خصوصاً اس کے پتے میں، اور پھلاؤ بھی؛ اس کا پتا اور رس گرم ورموں کے آغاز اور نملہ میں نافع ہیں، پتا اور چھال زخم بھرتے ہیں، دل کو قوت دیتا ہے خصوصاً خوشبودار شامی، اور کمزور معدے کو بھی؛ آٹے میں بھنا ہوا بھوک کی کمی، کیڑوں اور پیچش میں نافع ہے؛ اسے ہمیشہ کھانے سے پٹھوں کا درد پیدا ہوتا ہے، اور اس کے کچے پھل سے بہت سے بخار پیدا ہو سکتے ہیں {cite:canon-ibn-sina-print-v1 pp.691-692}۔"
  es: "En el libro, la toba es una manzana cuya variedad más templada es la Shami, mientras que la insípida es mala y tiene pocos beneficios; la materia dominante en su sustancia es una humedad fría y superflua, siendo la astringente, ácida y agria fría y espesa, y la dulce acuosa; tiene propiedades para frenar las superfluidades, especialmente en su hoja, y la hinchazón; su hoja y jugo benefician el inicio de hinchazones calientes y erisipela, su hoja y corteza curan, fortalece el corazón, especialmente la fragante Shami, y el estómago débil; horneada en masa beneficia la falta de apetito, los parásitos intestinales y la disentería; su consumo constante provoca dolor nervioso, y de la fruta cruda pueden surgir muchas fiebres {cite:canon-ibn-sina-print-v1 pp.691-692}"
  fr: "Le terme « tuffah » désigne dans le livre une pomme dont la variété la plus tempérée est la Shami, tandis que la variété insipide est néfaste et peu bénéfique. Sa substance est principalement composée d'une humidité froide et excessive; les variétés astringentes, acides et âcres sont froides et épaisses, et les variétés sucrées et aqueuses. Elle retient les excès, notamment dans ses feuilles, et provoque des ballonnements. Ses feuilles et son jus sont bénéfiques en cas d'apparition de gonflements chauds et d'érysipèle; ses feuilles et son écorce sont cicatrisantes; elle fortifie le cœur, en particulier la Shami parfumée, et l'estomac fragile; cuite dans une pâte, elle est bénéfique en cas de manque d'appétit, de vers intestinaux et de dysenterie; sa consommation régulière provoque des douleurs nerveuses, et le fruit cru peut entraîner diverses fièvres. {cite:canon-ibn-sina-print-v1 pp.691-692}"
  tr: "Kitaptaki elmalar Levantin halkı tarafından kabul edilir ve hafif, fakir, az faydalıdır; çoğunlukla soğuk fazla nem, tanenler, büzülenler ve ekşi soğuk ve yoğundur, tatlı ise suludur. Merakı engeller, özellikle yapraklarında ve şişkinlikte. Yaprakları ve suları sıcak tümörlerin ve karıncaların ortaya çıkması için faydalıdır, yaprakları ve kabuğu ise çıbanlara neden olur. Kalbi güçlendirir, özellikle Levant parfümünü güçlendirir ve zayıf mideyi güçlendirir. Hamurda ızgara yapmak iştahı, solucanları ve dizanteri azaltmaya yardımcı olur. Yeme bağımlılığı sinir ağrısına ve ham maddesinden ateş çıkabilir. {cite:canon-ibn-sina-print-v1 s.691-692}"
  id: "Apel dalam buku ini dianggap oleh orang Levant dan bersifat ringan, miskin, dengan sedikit manfaat, kebanyakan dingin berlebih kelembapan, tanin, astringen, dan asam dingin dan kental, sedangkan yang manis bersifat encer. Apel ini mencegah rasa penasaran, terutama pada daun dan bengkaknya. Daun dan jusnya bermanfaat untuk munculnya tumor panas dan semut, dan daun serta kulit kayunya menyebabkan bisul terbit. Mereka memperkuat jantung, terutama parfum Levantine, dan memperkuat perut yang lemah. Dipanggang dalam adonan membantu mengurangi nafsu makan, cacing, dan disentri. Kecanduan makan menyebabkan nyeri saraf, dan demam dapat muncul dari bahan bakunya {cite:canon-ibn-sina-print-v1 hlm.691-692}"
