label:
  ar: "اللَّبَّة"
  en: "Labba (the place of slaughter on the chest)"
  ur: "لبہ ⁦(ذبح کی جگہ)⁩"
  es: "Labba (el lugar de la matanza en el pecho)"
  fr: "Labba (le lieu du massacre sur la poitrine)"
  tr: "Çekirdek"
  id: "Inti"
summary:
  ar: "اللَّبَّة في اللغة وسط الصدر والمنحر وموضع القلادة من الصدر، وجمعها لَبّات ولِباب؛ وفي الاصطلاح المنحر من الصدر، وهي الوهدة التي بين أصل العنق والصدر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13566}."
  en: "Labba, in lexicon, is the middle of the chest and the place where a necklace sits; the plural is labbat or libab. In law it is the place of slaughter on the chest, the hollow between the base of the neck and the chest {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13566}."
  ur: "لبہ لغت میں سینے کا درمیانی حصہ اور وہ جگہ ہے جہاں ہار رہتا ہے، جمع لبات اور لباب ہے؛ اصطلاح میں سینے کا وہ نحر ہے جو گردن کی جڑ اور سینے کے درمیان گڑھا ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13566}۔"
  es: "Labba, en léxico, es la parte central del pecho y el lugar donde se coloca un collar; el plural es labbat o libab. En derecho, es el lugar de sacrificio en el pecho, el hueco entre la base del cuello y el pecho {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13566}."
  fr: "Le terme « labba » désigne, dans le lexique, le milieu de la poitrine et l'endroit où repose un collier; son pluriel est « labbat » ou « libab ». En droit, il s'agit du lieu d'abattage sur la poitrine, le creux situé entre la base du cou et la poitrine (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.13566)."
  tr: "Dilde 'lab' sandığın ortası ve kolyeyi ifade eder, ayrıca kolyenin göğüsten ayrıldığı yeri ifade eder. Çoğulu 'labat' ve 'labab'dır; terminolojide ise boyun ile göğüs arasındaki boşluktur {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13566}."
  id: "Dalam bahasa, 'lab' merujuk pada bagian tengah peti dan kalung, serta posisi kalung dari peti. Jamaknya adalah 'labat' dan 'labab'; dalam terminologi, itu adalah lekukan antara leher dan dada {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13566}."
