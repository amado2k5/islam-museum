label:
  ar: "اللَّبَّة"
  en: "Labba (the place of slaughter on the chest)"
  ur: "لبہ (ذبح کی جگہ)"
summary:
  ar: "اللَّبَّة في اللغة وسط الصدر والمنحر وموضع القلادة من الصدر، وجمعها لَبّات ولِباب؛ وفي الاصطلاح المنحر من الصدر، وهي الوهدة التي بين أصل العنق والصدر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13566}."
  en: "Labba, in lexicon, is the middle of the chest and the place where a necklace sits; the plural is labbat or libab. In law it is the place of slaughter on the chest, the hollow between the base of the neck and the chest {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13566}."
  ur: "لبہ لغت میں سینے کا درمیانی حصہ اور وہ جگہ ہے جہاں ہار رہتا ہے، جمع لبات اور لباب ہے؛ اصطلاح میں سینے کا وہ نحر ہے جو گردن کی جڑ اور سینے کے درمیان گڑھا ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13566}۔"
