label: { ar: "الحوض ⁦(حوض النبي يوم القيامة)⁩", en: "The Basin (al-Hawd) of the Prophet", ur: "حوض ⁦(قیامت کے دن نبی کا حوض)⁩" }
term: { ar: "الحوض، الحوض المورود", en: "al-hawd" }
summary:
  ar: "الحوض في الاعتقاد حوض يرده أمة النبي يوم القيامة؛ يعقد له أبو داود «باب في الحوض» في كتاب السنة، ويروي فيه حديث ابن عمر «إن أمامكم حوضاً ما بين ناحيتيه كما بين جرباء وأذرح»، وحديث زيد بن أرقم «ما أنتم جزء من مائة ألف جزء ممن يرد عليّ الحوض»، وحديث أنس في الكوثر «نهر وعدنيه ربي… عليه حوض ترد عليه أمتي يوم القيامة، آنيته عدد الكواكب»، وخبر أبي برزة الأسلمي مع عبيد الله بن زياد {cite:sunan-abi-dawud-ibn-hazm-1997-v5 p. 72-74}."
  en: "In belief, the Basin is a pool to which the Prophet's community comes on the Day of Resurrection; Abu Dawud gives it a 'chapter on the Basin' in the Book of the Sunna, with Ibn 'Umar's report 'before you is a basin whose sides are as far apart as Jarba' and Adhruh', Zayd ibn Arqam's 'you are not one part in a hundred thousand of those who will come to me at the Basin', Anas's report on al-Kawthar, 'a river my Lord promised me… on it is a basin to which my community will come on the Day of Resurrection, its vessels as many as the stars', and the account of Abu Barza al-Aslami and 'Ubayd Allah ibn Ziyad {cite:sunan-abi-dawud-ibn-hazm-1997-v5 p. 72-74}."
  ur: "عقیدے میں حوض وہ حوض ہے جس پر قیامت کے دن نبی کی امت آئے گی؛ ابو داؤد کتاب السنہ میں «حوض کا باب» باندھتے ہیں، جس میں ابن عمر کی حدیث «تمہارے آگے ایک حوض ہے جس کے کناروں کا فاصلہ جرباء اور اذرح کے درمیان جتنا ہے»، زید بن ارقم کی حدیث «تم ان لوگوں کا ایک لاکھواں حصہ بھی نہیں جو میرے پاس حوض پر آئیں گے»، کوثر کے بارے میں انس کی حدیث «ایک نہر جس کا میرے رب نے مجھ سے وعدہ کیا… اس پر ایک حوض ہے جس پر قیامت کے دن میری امت آئے گی، اس کے برتن ستاروں کی تعداد میں ہیں»، اور ابو برزہ اسلمی اور عبید اللہ بن زیاد کا واقعہ ہے {cite:sunan-abi-dawud-ibn-hazm-1997-v5 p. 72-74}۔"
