id: concept/al-hawd-al-nabawi
class: concept
kind: belief
label: { ar: "الحوض ⁦(حوض النبي يوم القيامة)⁩", en: "The Basin (al-Hawd) of the Prophet", fr: "Le Bassin (al-Hawd) du Prophète", ur: "حوض ⁦(قیامت کے دن نبی کا حوض)⁩", es: "La Cuenca (al-Hawd) del Profeta", tr: "Gölet (Kıyamet Günü'nde Peygamberin Göleti)", id: "Pond (Kolam Nabi pada Hari Penghakiman)" }
term: { ar: "الحوض، الحوض المورود", en: "al-hawd" }
summary:
  ar: "الحوض في الاعتقاد حوض يرده أمة النبي يوم القيامة؛ يعقد له أبو داود «باب في الحوض» في كتاب السنة، ويروي فيه حديث ابن عمر «إن أمامكم حوضاً ما بين ناحيتيه كما بين جرباء وأذرح»، وحديث زيد بن أرقم «ما أنتم جزء من مائة ألف جزء ممن يرد عليّ الحوض»، وحديث أنس في الكوثر، وفيه أنه نهر وعد الله به نبيَّه، وعليه حوض ترده أمته يوم القيامة وآنيته عدد الكواكب، وخبر أبي برزة الأسلمي مع عبيد الله بن زياد {cite:sunan-abi-dawud-ibn-hazm-1997-v5 p. 72-74}."
  en: "In belief, the Basin is a pool to which the Prophet's community comes on the Day of Resurrection; Abu Dawud gives it a 'chapter on the Basin' in the Book of the Sunna, with Ibn 'Umar's report 'before you is a basin whose sides are as far apart as Jarba' and Adhruh', Zayd ibn Arqam's 'you are not one part in a hundred thousand of those who will come to me at the Basin', Anas's report describing al-Kawthar as a river God promised the Prophet, on which there is a basin that the Prophet's community will come to on the Day of Resurrection, with vessels as numerous as the stars, and the account of Abu Barza al-Aslami and 'Ubayd Allah ibn Ziyad {cite:sunan-abi-dawud-ibn-hazm-1997-v5 p. 72-74}."
  fr: "Dans la doctrine, le Bassin est un lieu où se rend la communauté du Prophète au Jour de la Résurrection. Abu Dawud lui consacre un chapitre dans le Livre de la sunna. Ibn Umar y rapporte que ses bords sont aussi éloignés que Jarba’ et Adhruh ; Zayd ibn Arqam, que les personnes auxquelles le Prophète s’adressait ne représentaient pas la cent-millième partie de celles qui viendraient au Bassin. Anas rapporte qu’al-Kawthar est un fleuve promis au Prophète, sur lequel se trouve le Bassin où se rendra sa communauté au Jour de la Résurrection, avec des récipients aussi nombreux que les étoiles. Le chapitre contient aussi le récit d’Abu Barza al-Aslami et d’Ubayd Allah ibn Ziyad {cite:sunan-abi-dawud-ibn-hazm-1997-v5 p. 72-74}."
  ur: "عقیدے میں حوض وہ حوض ہے جس پر قیامت کے دن نبی کی امت آئے گی؛ ابو داؤد کتاب السنہ میں «حوض کا باب» باندھتے ہیں، جس میں ابن عمر کی حدیث «تمہارے آگے ایک حوض ہے جس کے کناروں کا فاصلہ جرباء اور اذرح کے درمیان جتنا ہے»، زید بن ارقم کی حدیث «تم ان لوگوں کا ایک لاکھواں حصہ بھی نہیں جو میرے پاس حوض پر آئیں گے»، کوثر کے بارے میں انس کی حدیث، جس میں اسے ایک نہر بتایا گیا ہے جس کا اللہ نے نبی سے وعدہ کیا تھا، اور جس پر ایک حوض ہے جہاں قیامت کے دن نبی کی امت آئے گی اور جس کے برتن ستاروں کی تعداد میں ہیں، اور ابو برزہ اسلمی اور عبید اللہ بن زیاد کا واقعہ ہے {cite:sunan-abi-dawud-ibn-hazm-1997-v5 p. 72-74}۔"
  es: "Según la creencia, la Cuenca es una poza a la que la comunidad del Profeta acudirá el Día de la Resurrección; Abu Dawud le dedica un \"capítulo sobre la Cuenca\" en el Libro de la Sunna, con el relato de Ibn Umar: \"Ante ti hay una cuenca cuyos lados están tan separados como Jarba y Adhruh\", el de Zayd ibn Arqam: \"No sois ni una parte entre cien mil de los que vendrán a mí a la Cuenca\", el relato de Anas que describe al-Kawthar como un río que Dios prometió al Profeta, en el cual hay una cuenca a la que la comunidad del Profeta acudirá el Día de la Resurrección, con recipientes tan numerosos como las estrellas, y el relato de Abu Barza al-Aslami y Ubayd Allah ibn Ziyad {cite:sunan-abi-dawud-ibn-hazm-1997-v5 p. 72-74}."
  tr: "İnançla, havza, Peygamber'in ulusunun Kıyamet Günü'nde ziyaret edeceği bir havzadır; Ebu Davud, Sünnet Kitabı'nda havza hakkında bir bölüm adar; İbn Ömer'in hadisini anlatır: \"Önünüzde iki tarafı arasında bir leğen vardır, tıpkı Cerrahi ile Adhrah arasında olduğu gibi,\" ve Zeyd bin Arqam'ın \"Sen havuza dönenlerin yüz bin parçasının parçası değilsin\" hadisini ve Enas hadisinde Al-Kawthar'da bunun Allah'ın Peygamberine vaat ettiği bir nehir olduğu ve onun ulusunun Diriliş Günü'nde geri döneceği bir havza olduğu ve kaplarının yıldızlar kadar çokluğu olduğu belirtilir. Ebu Barzah el-Aslami'nin Ubeyd Allah ibn Ziyad ile birlikte haberi {atıf: sunan-abi-dawud-ibn-hazm-1997-v5, s. 72-74}."
  id: "Dengan iman, cekungan ini adalah cekungan yang akan dikunjungi bangsa Nabi pada Hari Kiamat; Abu Dawud mendedikasikan sebuah bab tentang cekungan dalam Kitab Sunnah; Ia menceritakan hadis Ibn Umar: \"Di hadapanmu terdapat cekungan di antara dua sisi, seperti di antara Jarrah dan Jarrah,\" dan hadis Zayd ibn Arqam, \"Engkau bukan bagian dari seratus ribu keping mereka yang kembali ke kolam,\" dan dalam hadis Anas Al-Kawthar, dinyatakan bahwa sungai ini dijanjikan oleh Allah kepada Nabi dan umat-Nya akan kembali pada Hari Kebangkitan, dengan wadah-wadahnya sebanyak bintang-bintang. Berita Abu Barzah al-Aslami bersama Ubayd Allah ibn Ziyad {sitasi: sunan-abi-dawud-ibn-hazm-1997-v5, hlm. 72-74}."
