label: { ar: "ابن", en: "Son (ibn) in fiqh" }
summary:
  ar: "تعرّف الموسوعة الفقهية الكويتية الابن بأن معناه الحقيقي الصلبي المباشر، لظهر أو لبطن، ولا يطلق على ابن الابن إلا مجازاً، وإطلاقه على ابن الرضاع مجاز ينصرف عند الإطلاق إلى النسبي المباشر. وهو بالنسبة للأب كل ذكر ولد له على فراش صحيح، أو بعقد نكاح فاسد، أو بوطء بشبهة معتبرة، أو ملك يمين، وبالنسبة للأم كل ذكر ولدته من نكاح أو سفاح، ومن أرضعته ذكراً صار ابناً لها من الرضاع. والابن عاصب بنفسه وأولى العصبات، يأخذ جميع المال إذا انفرد، ولا يُحجب من الميراث أصلاً، ويرث الولاء دون البنت عند جميع الفقهاء، وله ولاية تزويج أمه عند الجمهور، وفي تحمّله القسامة والدية خلاف بين المذاهب، وابن الزنى ينسب إلى أمه فقط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1457} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1458}"
  en: "The Kuwaiti encyclopedia gives the literal sense of ibn as the son in direct line by blood, from the back or from the belly; its use for a son's son is figurative, and a foster son, when the word is used alone, is taken as the direct blood son. For the father, the son is every male born to him on a valid bed, under a defective marriage, by a recognised mistaken intercourse, or by a bond of ownership; for the mother, every male she bore from a marriage or from an illicit union, and a male she suckled is a foster son to her. The son is an agnate in his own right and the first of the agnates: he takes the whole estate if alone, and the remainder after the fixed shares, and he is not excluded from inheritance at all. The jurists agree that he inherits the freedman's patronage (wala') before a daughter; the majority hold that he has the right to contract his mother's marriage; and in some schools he bears a share of the blood money and of the oath of qasama in homicide. The son of unlawful intercourse is ascribed to his mother alone. The detailed rules are given in their places: inheritance, marriage, foster-relations, maintenance, custody, descent, offences and the aqiqa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1457} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1458}"
