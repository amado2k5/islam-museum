class: concept
kind: scientific
label: { ar: "تصوير كسوف القمر بالدوائر على السطح", en: "Drawing a lunar eclipse as circles on a plane", ur: "چاند گرہن کو سطح پر دائروں سے دکھانا", es: "Dibujar un eclipse lunar como círculos en un plano.", fr: "Représenter une éclipse lunaire par des cercles sur un plan" }
summary:
  ar: "يرسم الحساب الكسوف بدوائر على سطح مستو: دائرة نصف القطرين مركزها مركز الدائرة، ودائرة للقمر لبدء الكسوف ودائرة له لتمام الانجلاء، ودائرة للظل. ويُخرج خط عرض القمر في الجهة المعلومة، فيحدد مركز القمر لبدء الكسوف ولوسطه ولتمام الانجلاء. وتتماس دائرة الظل مع دائرتي القمر، ويصير الخط بين مركز القمر في بدئه ومركزه لوسطه مقدار دقائق السقوط. {cite:zij-sabi-nallino-byblion pp.158-160}"
  en: "The reckoning draws the eclipse as circles on a flat plane: a circle of the sum of half-radii around the centre, circles for the Moon at the beginning, at the end, and a circle for the shadow. The Moon's latitude is laid off on the appropriate side, which fixes the centre of the Moon at the beginning, at mid-eclipse and at the end. The shadow circle touches the two Moon circles, and the line between the Moon's centres at the start and at the middle measures the minutes of fall. {cite:zij-sabi-nallino-byblion pp.158-160}"
  ur: "حساب گرہن کو ہموار سطح پر دائروں سے دکھاتا ہے: نصف قطروں کے مجموعے کا دائرہ مرکز کے گرد، آغاز اور اختتام پر چاند کے دائرے، اور سائے کا دائرہ۔ چاند کا عرض متعلقہ جانب میں رکھا جاتا ہے، جو آغاز، وسط اور اختتام پر چاند کا مرکز طے کرتا ہے۔ سائے کا دائرہ چاند کے دونوں دائروں کو چھوتا ہے، اور آغاز اور وسط کے مرکزوں کے درمیان خط سقوط کے دقائق کی پیمائش ہے۔ {cite:zij-sabi-nallino-byblion pp.158-160}"
  es: "El cálculo representa el eclipse como círculos en un plano: un círculo formado por la suma de los semirradios alrededor del centro, círculos para la Luna al inicio y al final, y un círculo para la sombra. La latitud de la Luna se traza en el lado correspondiente, lo que fija el centro de la Luna al inicio, en el punto medio del eclipse y al final. El círculo de la sombra toca los dos círculos de la Luna, y la línea que une los centros de la Luna al inicio y en el punto medio mide los minutos de caída. {cite:zij-sabi-nallino-byblion pp.158-160}"
  fr: "Le calcul représente l'éclipse par des cercles sur un plan: un cercle dont le rayon est la somme des demi-rayons autour du centre, des cercles pour la Lune au début et à la fin de l'éclipse, et un cercle pour l'ombre. La latitude de la Lune est reportée du côté approprié, ce qui fixe son centre au début, au milieu et à la fin de l'éclipse. Le cercle de l'ombre est tangent aux deux cercles lunaires, et la ligne reliant les centres de la Lune au début et au milieu de l'éclipse mesure les minutes de chute. {cite:zij-sabi-nallino-byblion pp.158-160}"
