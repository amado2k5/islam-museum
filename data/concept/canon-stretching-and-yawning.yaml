summary:
  ar: "يعرض ابن سينا في الفصل الثالث عشر التمطي والتثاؤب، فالتمطي يكون لفضول مجتمعة في العضل ولذلك يعرض عقيب النوم، وإذا كثرت صار قشعريرة ونافضاً ثم حمى، والتثاؤب ضرب من التمطي في عضل الفك والقص، وإذا كثر في غير وقته فهو رديء، والشراب الممزوج مناصفة جيد لهما إذا لم يكن سبب آخر {cite:canon-ibn-sina-print-v1 pp.243-244}."
  en: "In the thirteenth chapter Ibn Sina treats stretching and yawning: stretching comes from superfluities gathered in the muscles and so often follows sleep, and as they grow it becomes chill and shivering and then fever; yawning is a kind of stretching in the muscles of the jaw and breastbone, bad when frequent out of its time, and wine mixed half and half is good for both when there is no other cause {cite:canon-ibn-sina-print-v1 pp.243-244}."
