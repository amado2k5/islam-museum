id: concept/canon-stretching-and-yawning
class: concept
kind: scientific
label: { ar: "التمطي والتثاؤب عند ابن سينا", en: "Stretching and yawning in the Canon", ur: "انگڑائی اور جماہی قانون میں", es: "Estirarse y bostezar en el Canon", fr: "S'étirer et bâiller dans le Canon" }
summary:
  ar: "يعرض ابن سينا في الفصل الثالث عشر التمطي والتثاؤب، فالتمطي يكون لفضول مجتمعة في العضل ولذلك يعرض عقيب النوم، وإذا كثرت صار قشعريرة ونافضاً ثم حمى، والتثاؤب ضرب من التمطي في عضل الفك والقص، وإذا كثر في غير وقته فهو رديء، والشراب الممزوج مناصفة جيد لهما إذا لم يكن سبب آخر {cite:canon-ibn-sina-print-v1 pp.243-244}."
  en: "In the thirteenth chapter Ibn Sina treats stretching and yawning: stretching comes from superfluities gathered in the muscles and so often follows sleep, and as they grow it becomes chill and shivering and then fever; yawning is a kind of stretching in the muscles of the jaw and breastbone, bad when frequent out of its time, and wine mixed half and half is good for both when there is no other cause {cite:canon-ibn-sina-print-v1 pp.243-244}."
  es: "En el decimotercer capítulo, Ibn Sina trata sobre el estiramiento y el bostezo: el estiramiento proviene de superfluidades acumuladas en los músculos y suele seguir al sueño, y a medida que aumentan se convierte en escalofríos y temblores y luego en fiebre; el bostezo es una especie de estiramiento en los músculos de la mandíbula y el esternón, malo cuando es frecuente fuera de su tiempo, y el vino mezclado a partes iguales es bueno para ambos cuando no hay otra causa {cite:canon-ibn-sina-print-v1 pp.243-244}."
  fr: "Dans le treizième chapitre, Ibn Sina traite des étirements et des bâillements: les étirements proviennent des excès accumulés dans les muscles et suivent donc souvent le sommeil, et à mesure qu’ils augmentent, ils deviennent frissons et tremblements puis fièvre; les bâillements sont une sorte d’étirement des muscles de la mâchoire et du sternum, mauvais lorsqu’ils sont fréquents hors de leur temps, et le vin mélangé à parts égales est bon pour les deux lorsqu’il n’y a pas d’autre cause {cite:canon-ibn-sina-print-v1 pp.243-244}."
  ur: "تیرھویں باب میں ابن سینا کھنچاؤ اور جمائی کا علاج کرتا ہے: کھنچاؤ پٹھوں میں جمع ہونے والی ضرورت سے زیادہ ہوتا ہے اور اکثر نیند کے بعد آتا ہے، اور جیسے جیسے وہ بڑھتے ہیں یہ سردی اور کپکپاہٹ اور پھر بخار ہو جاتی ہے۔ جمائی جبڑے اور چھاتی کی ہڈی کے پٹھوں میں کھنچاؤ کی ایک قسم ہے، جب وقت سے باہر ہو تو برا ہوتا ہے، اور آدھا آدھا ملا ہوا شراب دونوں کے لیے اچھا ہے جب کوئی اور وجہ نہ ہو۔"
