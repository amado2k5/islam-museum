summary:
  ar: "مبدأ فقهي حربي أعلنه النبي في حصار الطائف حين نادى مناديه: «أيما عبد نزل إلينا وخرج من الحصن فهو حر»، فنزل بضعة عشر رجلاً منهم أبو بكرة فأعتقهم وسماهم «عتقاء الله»، ورفض ردهم لمواليهم بعد إسلام أهل الطائف."
  en: "A legal principle in Islamic law of war established during the siege of Ta'if when the Prophet proclaimed: 'Whichever slave descends from the fortress to us is a free man', freeing over a dozen men including Abu Bakra as 'freemen of God' and refusing to return them upon Ta'if's submission."
