label: { ar: "عتق أرقاء العدو عند لجوئهم للمسلمين", en: "Emancipation of enemy slaves upon fleeing to Muslim lines", es: "Emancipación de los esclavos enemigos al huir a territorios musulmanes.", fr: "Émancipation des esclaves ennemis fuyant vers les territoires musulmans", ur: "مسلمان خطوط پر بھاگنے پر دشمن کے غلاموں کی آزادی", tr: "Müslümanlara sığınan düşman köleleri özgürleştirmek", id: "Membebaskan budak musuh saat mereka mencari perlindungan bersama Muslim" }
summary:
  ar: "مبدأ فقهي حربي أعلنه النبي في حصار الطائف حين نادى مناديه: «أيما عبد نزل إلينا وخرج من الحصن فهو حر»، فنزل بضعة عشر رجلاً منهم أبو بكرة فأعتقهم وسماهم «عتقاء الله»، ورفض ردهم لمواليهم بعد إسلام أهل الطائف."
  en: "A legal principle in Islamic law of war established during the siege of Ta'if when the Prophet proclaimed: 'Whichever slave descends from the fortress to us is a free man', freeing over a dozen men including Abu Bakra as 'freemen of God' and refusing to return them upon Ta'if's submission."
  es: "Un principio jurídico del derecho islámico de la guerra, establecido durante el asedio de Ta'if, cuando el Profeta proclamó: \"Cualquier esclavo que descienda de la fortaleza hacia nosotros es un hombre libre\", liberando a más de una docena de hombres, entre ellos Abu Bakra, como \"hombres libres de Dios\" y negándose a devolverlos tras la rendición de Ta'if."
  fr: "Un principe juridique du droit islamique de la guerre a été établi lors du siège de Taïf, lorsque le Prophète a proclamé: « Tout esclave qui descend de la forteresse vers nous est un homme libre », libérant ainsi plus d'une douzaine d'hommes, dont Abou Bakra, en tant qu'« hommes libres de Dieu », et refusant de les renvoyer après la soumission de Taïf."
  ur: "جنگ کے اسلامی قانون میں ایک قانونی اصول جو طائف کے محاصرے کے دوران قائم ہوا جب نبی نے اعلان کیا: 'جو بھی غلام قلعہ سے ہمارے پاس آئے وہ آزاد ہے'، جس میں ابوبکرہ سمیت ایک درجن سے زیادہ آدمیوں کو 'خدا کے آزاد' کے طور پر آزاد کیا گیا اور طائف کی اطاعت پر انہیں واپس کرنے سے انکار کر دیا۔"
  tr: "Peygamber, Teif kuşatması sırasında çağıran kişiye seslenerek ilan ettiği fıkıh ve savaşla ilgili bir ilkedir: \"Bize inen ve kaleden çıkan her hizmetkar özgürdür.\" Böylece birkaç düzine adam, aralarında Ebu Bakra da var, atlarından indi, onları özgür bıraktı ve \"Allah tarafından özgür bırakıldı\" dediler; Taif halkı İslam'a geçtikten sonra onları özgür bırakılan takipçilerine geri vermeyi reddettiler."
  id: "Prinsip yurisprudensi dan terkait perang yang dinyatakan oleh Nabi selama pengepungan Ta'if ketika ia memanggil peneleponnya: \"Setiap hamba yang turun kepada kami dan meninggalkan benteng adalah bebas.\" Jadi beberapa lusin pria, termasuk Abu Bakra, turun dari kuda, membebaskan mereka, dan menyebut mereka \"dibebaskan oleh Tuhan,\" menolak mengembalikan mereka kepada pengikut yang dibebaskan setelah umat Ta'if memeluk Islam."
