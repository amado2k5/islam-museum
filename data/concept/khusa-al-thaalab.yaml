summary:
  ar: "خصى الثعلب في الكتاب نبات ينقل الكتاب وصفه عن ديسقوريدوس، ورقه مفروش على وجه الأرض أخضر شبيه بورق الزيتون الناعم إلا أنه أدق وأطول، وزهره فرفيري اللون وأصله شبيه ببصل البلبوس إلى الطول، ويؤكل الأصل مسلوقا، وينبت في مواضع حجرية ورملية، ومنه صنف آخر يسميه بعض الناس أندرياس، وحشيشهما خشن حلو، حار في الأولى رطب فيها رطوبته فضلية، وينفع من التشنج والتمدد اللذين إلى خلف ومن الفالج، ويقوم مقام أسقنقور، وضماده يفتح النواصير، ويذكر الكتاب فيه أقوالا عن الإنجاب والباه في فقرة موسومة معلقة لحكم المؤسس {cite:canon-ibn-sina-print-v1 pp.702-703}"
  en: "Khusa al-tha'lab is in the book a plant whose description the book takes from Dioscorides: a leaf spread on the face of the earth, green, like the leaf of the fine olive but thinner and longer, a flower of purple colour and a root like the bulbus onion but tending to length, the root eaten boiled, growing in stony and sandy places; there is a further kind that some call andriyas, and the herbage of both is rough and sweet; hot in the first degree and moist in it with a superfluous moisture, it benefits spasm and backward stretching and palsy, stands in the place of asqanqur, and its poultice opens fistulas; the book gives statements on begetting and desire in a labelled section held for the founder's ruling {cite:canon-ibn-sina-print-v1 pp.702-703}"
  ur: "خصی الثعلب کتاب میں ایک نبات ہے جس کا وصف کتاب دیسقوریدوس سے نقل کرتی ہے: پتا زمین پر بچھا ہوا، سبز، باریک زیتون کے پتے جیسا مگر اس سے پتلا اور لمبا، پھول ارغوانی رنگ کا اور جڑ بلبوس پیاز جیسی مگر لمبائی کی طرف مائل، جڑ ابال کر کھائی جاتی ہے، اور پتھریلی اور ریتلی جگہوں میں اگتا ہے؛ ایک اور قسم ہے جسے بعض لوگ اندریاس کہتے ہیں، اور دونوں کی گھاس کھردری میٹھی ہے؛ پہلے درجے میں گرم اور اس میں تر ہے، اس کی تری فاضل ہے، تشنج اور پیچھے کی طرف کھنچاؤ اور فالج میں نافع ہے، اسقنقور کے قائم مقام ہے، اور اس کی پٹی ناسوروں کو کھولتی ہے؛ کتاب اولاد اور باہ کے بارے میں باتیں موسوم حصے میں دیتی ہے جو بانی کے فیصلے کے لیے موقوف ہے {cite:canon-ibn-sina-print-v1 pp.702-703}۔"
  es: "Khusa al-tha'lab es en el libro una planta cuya descripción toma de Dioscórides: una hoja extendida sobre la faz de la tierra, verde, como la hoja del olivo fino pero más delgada y larga, una flor de color púrpura y una raíz como la cebolla bulbosa pero de longitud media, la raíz se come hervida, crece en lugares pedregosos y arenosos; hay otro tipo que algunos llaman andriyas, y la hierba de ambos es áspera y dulce; caliente en primer grado y húmeda en su interior con un exceso de humedad, beneficia los espasmos, la distensión hacia atrás y la parálisis, se coloca en el lugar de asqanqur, y su cataplasma abre fístulas; el libro da declaraciones sobre la procreación y el deseo en una sección etiquetada reservada para el dictamen del fundador {cite:canon-ibn-sina-print-v1 pp.702-703}"
