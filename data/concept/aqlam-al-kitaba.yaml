label: {ar: "الأقلام الموزونة", en: "The chancery pen-styles", fr: "Les styles calligraphiques de chancellerie", es: "Los estilos de pluma de la cancillería", ur: "چانسری قلم کے انداز", tr: "Ağırlıklı kalemler", id: "Pena berbobot"}
summary:
  ar: "ضبط ابن النديم تسمية الأقلام الموزونة: قلم الجليل وهو أبو الأقلام كلها يكتب به عن الخلفاء إلى ملوك الأرض في الطوامير الصحاح ويخرج منه قلما السجلات والديباج، ومنهما تتفرع الأقلام حتى بلغت أربعة وعشرين قلماً مخرجها من أربعة: الجليل والطومار الكبير والنصف الثقيل والثلث الكبير الثقيل، ومنها قلم الزنبور والمفتتح والجزم والعهود والأجوبة والرقاع والنرجس وغبار الحلبة، ولم يزل الناس يكتبون على مثال الخط القديم حتى ظهرت الدولة العباسية فاختصت المصاحف بخطوطها وحدث خط يقال له العراقي وهو المحقق الذي يسمى وراقي فحسن حتى انتهى الأمر إلى المأمون فأخذ أصحابه وكتابه بتجويد خطوطهم، وأنشأ ذو الرئاستين الفضل بن سهل قلماً اخترعه وهو أحسن الأقلام يعرف بالرياسي ويتفرع إلى عدة أقلام {cite:fihrist-ibn-al-nadim p. 18-21}."
  en: "Twenty-four royal and chancery hands all derived from the qalam al-jalil — the riyasi invented under al-Fadl b. Sahl {cite:fihrist-ibn-al-nadim p. 18-21}."
  fr: "Vingt-quatre écritures royales et de chancellerie, toutes dérivées du qalam al-jalil — le riyasi inventé sous al-Fadl b. Sahl {cite:fihrist-ibn-al-nadim p. 18-21}."
  es: "Veinticuatro manos reales y de cancillería, todas derivadas del qalam al-jalil — el riyasi inventado bajo al-Fadl b. Sahl {cite:fihrist-ibn-al-nadim p. 18-21}."
  ur: "چوبیس شاہی اور چانسری ہاتھ قلم الجلیل سے ماخوذ ہیں - ریاضی جو الفضل ب کے تحت ایجاد ہوا تھا۔ سہل {حوالہ: فہرست ابن الندیم ص۱۱۱۔ 18-21}۔"
  tr: "İbn el-Nadim, ağırlıklı kalemlerin adını kesin olarak tanımlamıştır: 'Kelemül-Celil', tüm kalemlerin babasıdır ve halifelerden yeryüzü krallarına ait yazıları özgün yazılarla yazmak için kullanılır. Buradan kalemler ve brokarlar ortaya çıkar. Bunlardan kalemler yirmi dört kaleme dallanır ve dört kalemden çıktı üretir: Celil, büyük parşömen, ağır yarı ve büyük ağır üç. Bunlar arasında eşek arısının kalemi, açılış, cüzm, antlaşmalar, cevaplar, rika', narsis ve çemen otu tozu bulunur. İnsanlar eski yazı tarzında yazmaya devam ettiler, ta ki Abbasi devleti ortaya çıkana kadar, Kur'anlar kendi yazılarında uzmanlaştı ve yeni bir yazı eklendi Editör olarak bilinen al-'Iraqi'nin vardı; kendisi Waraqi olarak bilinen ve konu el-Ma'mun'a ulaşana kadar başarılı oldu; Ma'mun, yoldaşlarını ve yazıcılarını yazılarını geliştirmek için yanına aldı. Dhu al-Raisayn, el-Fadl ibn Sahl, el-Riyasi olarak bilinen en iyi kalem olan ve birkaç kaleme ayrılan bir kalem icat etti {atıf:fihrist-ibn-al-nadim s. 18-21}."
  id: "Ibn al-Nadim secara tepat mendefinisikan nama pena berbobot: 'Qalam al-Jalil,' yang merupakan bapak dari semua pena, digunakan untuk menulis dari khalifah kepada raja-raja bumi dalam aksara otentik. Dari situ muncul pena dan brokat. Dari ini, pena bercabang hingga dua puluh empat pena, menghasilkan hasil dari empat: Jalil, gulungan besar, setengah berat, dan sepertiga besar yang berat. Di antaranya adalah pena tawon, bukaan, juzm, perjanjian, jawaban, riqa', narsis, dan debu dari fenugreek. Orang-orang terus menulis dengan gaya aksara lama sampai negara Abbasiyah muncul, dan Al-Qur'an mengkhususkan diri dalam aksara mereka, dan sebuah aksara baru diperkenalkan yang dikatakan Ia memiliki al-'Iraqi, yang merupakan editor yang dikenal sebagai Waraqi, yang berprestasi hingga masalah itu sampai ke al-Ma'mun, yang membawa rekan-rekannya dan juru tulisnya untuk memperbaiki naskah mereka. Dhu al-Raisayn, al-Fadl ibn Sahl, menciptakan pena yang merupakan pena terbaik yang dikenal sebagai al-Riyasi dan bercabang menjadi beberapa pena {sitasi: fihrist-ibn-al-nadim hlm. 18-21}."
