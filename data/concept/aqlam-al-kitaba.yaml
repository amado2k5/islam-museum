label: { ar: "الأقلام الموزونة", en: "The chancery pen-styles" }
summary:
  ar: "ضبط ابن النديم تسمية الأقلام الموزونة: قلم الجليل وهو أبو الأقلام كلها يكتب به عن الخلفاء إلى ملوك الأرض في الطوامير الصحاح ويخرج منه قلما السجلات والديباج، ومنهما تتفرع الأقلام حتى بلغت أربعة وعشرين قلماً مخرجها من أربعة: الجليل والطومار الكبير والنصف الثقيل والثلث الكبير الثقيل، ومنها قلم الزنبور والمفتتح والجزم والعهود والأجوبة والرقاع والنرجس وغبار الحلبة، ولم يزل الناس يكتبون على مثال الخط القديم حتى ظهرت الدولة العباسية فاختصت المصاحف بخطوطها وحدث خط يقال له العراقي وهو المحقق الذي يسمى وراقي فحسن حتى انتهى الأمر إلى المأمون فأخذ أصحابه وكتابه بتجويد خطوطهم، وأنشأ ذو الرئاستين الفضل بن سهل قلماً اخترعه وهو أحسن الأقلام يعرف بالرياسي ويتفرع إلى عدة أقلام {cite:fihrist-ibn-al-nadim p. 18-21}."
  en: "Twenty-four royal and chancery hands all derived from the qalam al-jalil — the riyasi invented under al-Fadl b. Sahl {cite:fihrist-ibn-al-nadim p. 18-21}."
