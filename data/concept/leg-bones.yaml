label: { ar: "عظام الرجل عند ابن سينا", en: "Leg bones in the Canon", ur: "قانون میں ٹانگ کی ہڈیاں", es: "Huesos de las piernas en el canon", fr: "Os des jambes dans le Canon", tr: "İbn Sina'ya göre adamın kemikleri", id: "Tulang-tulang manusia menurut Ibn Sina" }
summary:
  ar: "يجمل ابن سينا منفعة الرجل في شيئين: الثبات والقوام وذلك بالقدم، والانتقال مستوياً وصاعداً ونازلاً وذلك بالفخذ والساق، ثم يصف الفخذ والساق {cite:canon-ibn-sina-print-v1 p.58}."
  en: "Ibn Sina sums up the use of the leg in two things: stability and support, which is the foot's work, and moving on level ground, up and down, which is the work of the thigh and shank; he then describes the thigh and the shank {cite:canon-ibn-sina-print-v1 p.58}."
  es: "Ibn Sina resume el uso de la pierna en dos cosas: estabilidad y apoyo, que es el trabajo del pie, y movimiento en terreno llano, hacia arriba y hacia abajo, que es el trabajo del muslo y la pantorrilla; luego describe el muslo y la pantorrilla {cite:canon-ibn-sina-print-v1 p.58}."
  fr: "Ibn Sina résume l'utilisation de la jambe en deux choses: la stabilité et le soutien, qui sont le travail du pied, et le déplacement sur un terrain plat, de haut en bas, qui est le travail de la cuisse et de la jambe; il décrit ensuite la cuisse et la jambe {cite:canon-ibn-sina-print-v1 p.58}."
  ur: "ابن سینا نے ٹانگ کے استعمال کو دو چیزوں میں جمع کیا ہے: استحکام اور سہارا، جو پاؤں کا کام ہے، اور سطح زمین پر چلنا، اوپر نیچے، جو کہ ران اور پنڈلی کا کام ہے۔ اس کے بعد وہ ران اور پنڈلی کو بیان کرتا ہے {حوالہ:کینن ابن سینا پرنٹ-v1 صفحہ 58}۔"
  tr: "İbn Sina, bir erkeğin faydasını iki şeyde özetler: denge ve duruş, yani ayak ve uyluk ile baldırla yukarı, yukarı ve aşağı hareket edebilme yeteneği, ardından uyluk ve baldırı anlatır {cite:canon-ibn-sina-print-v1 s.58}."
  id: "Ibn Sina merangkum manfaat seorang pria dalam dua hal: stabilitas dan postur, yaitu kaki, serta kemampuan bergerak ke atas, ke atas, dan ke bawah dengan paha dan betis, lalu menggambarkan paha dan betis {cite:canon-ibn-sina-print-v1 hlm.58}."
