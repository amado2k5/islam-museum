label:
  ar: "عجل السامري"
  en: "The Samiri's calf"
  ur: "سامری کا بچھڑا"
  es: "La cría de Samiri"
  fr: "Le veau du Samiri"
summary:
  ar: "صنع السامري لقوم موسى عجلاً جسداً له خوار من حليهم فقالوا هذا إلهكم وإله موسى فنسي، فكان لهم وبالاً حين رجع موسى غضبان أسفاً."
  en: "The Samiri made for Moses' people a calf's body that lowed, from their ornaments, and they said 'this is your god and the god of Moses, but he forgot'; it was their ruin when Moses returned angry and grieved."
  ur: "سامری نے موسیٰ کی قوم کے لیے ان کے زیور سے بچھڑے کا جسم بنایا جس سے خوار نکلتی تھی تو انہوں نے کہا 'یہ تمہارا معبود اور موسیٰ کا معبود ہے لیکن وہ بھول گیا'؛ جب موسیٰ غصے اور غم میں لوٹے تو وہ ان کی تباہی بنا۔"
  es: "Los samiríes hicieron para el pueblo de Moisés el cuerpo de un becerro que mugía, de entre sus adornos, y dijeron: «Este es vuestro dios y el dios de Moisés, pero él lo olvidó». Fue su ruina cuando Moisés regresó enojado y afligido."
  fr: "Les Samiriens fabriquèrent pour le peuple de Moïse un corps de veau qui mugissait, parmi leurs ornements, et ils dirent: « C'est votre dieu et le dieu de Moïse, mais il l'a oublié »; ce fut leur ruine lorsque Moïse revint en colère et affligé."
