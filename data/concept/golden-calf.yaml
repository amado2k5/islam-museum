summary:
  ar: "صنع السامري لقوم موسى عجلاً جسداً له خوار من حليهم فقالوا هذا إلهكم وإله موسى فنسي، فكان لهم وبالاً حين رجع موسى غضبان أسفاً."
  en: "The Samiri made for Moses' people a calf's body that lowed, from their ornaments, and they said 'this is your god and the god of Moses, but he forgot'; it was their ruin when Moses returned angry and grieved."
  ur: "سامری نے موسیٰ کی قوم کے لیے ان کے زیور سے بچھڑے کا جسم بنایا جس سے خوار نکلتی تھی تو انہوں نے کہا 'یہ تمہارا معبود اور موسیٰ کا معبود ہے لیکن وہ بھول گیا'؛ جب موسیٰ غصے اور غم میں لوٹے تو وہ ان کی تباہی بنا۔"
