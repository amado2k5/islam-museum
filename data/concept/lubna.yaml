label:
  ar: "لبنى"
  en: "Lubna (liquid storax, mi'a)"
  ur: "لبنیٰ ⁦(میعہ)⁩"
  es: "Lubna (estorax líquido, mi'a)"
summary:
  ar: "اللبنى هو الميعة، ويقال لسائله عسل اللبنى والاصطرك، دمعة شجرة كالسفرجل، حار في الأولى يابس في الثانية، منضج مليّن مسخن محلل {cite:canon-ibn-sina-print-v1 p.537} {cite:canon-ibn-sina-print-v1 p.538}."
  en: "Lubna is the mi'a, whose liquid is called honey of lubna and storax, a gum-tear of a tree like the quince; hot in the first degree and dry in the second, ripening, softening, warming and dissolving {cite:canon-ibn-sina-print-v1 p.537} {cite:canon-ibn-sina-print-v1 p.538}."
  ur: "لبنیٰ میعہ ہے، اس کے بہنے والے حصے کو عسل اللبنیٰ اور اصطرک کہتے ہیں، ایک درخت کی گوند جو بہی کے درخت جیسا ہے؛ پہلے درجے میں گرم اور دوسرے میں خشک، پکانے، نرم کرنے، گرم کرنے اور تحلیل کرنے والا {cite:canon-ibn-sina-print-v1 p.537} {cite:canon-ibn-sina-print-v1 p.538}۔"
  es: "Lubna es la mi'a, cuyo líquido se llama miel de lubna y estoraque, una goma desgarrada de un árbol como el membrillo; caliente en el primer grado y seco en el segundo, madurando, ablandando, calentando y disolviendo {cite:canon-ibn-sina-print-v1 p.537} {cite:canon-ibn-sina-print-v1 p.538}."
