label: { ar: "الساعات الزمانية", en: "Seasonal (temporal) hours", es: "Horas estacionales (temporales)", fr: "Heures saisonnières (temporaires)" }
summary:
  ar: "ساعات تختلف طولاً بحسب طول النهار والليل، فتُقسم قوس النهار على اثنتي عشرة ساعة وقوس الليل كذلك، فتطول ساعات النهار في الصيف وتقصر في الشتاء. وتكون الساعة الزمانية معتدلة في الاستواء وتتفاوت بعده. {cite:farghani-elements-astronomy p. 86}{cite:farghani-elements-astronomy p. 85}"
  en: "Hours whose length follows the length of the day and night: the arc of day is divided into twelve, and the arc of night likewise, so day-hours lengthen in summer and shorten in winter. al-Farghani sets them against the equal hours {cite:farghani-elements-astronomy p. 86}{cite:farghani-elements-astronomy p. 85}."
  es: "Horas cuya duración sigue la duración del día y la noche: el arco del día se divide en doce, y el arco de la noche de igual manera, por lo que las horas diurnas se alargan en verano y se acortan en invierno. Al-Farghani las compara con las horas iguales {cite:farghani-elements-astronomy p. 86}{cite:farghani-elements-astronomy p. 85}."
  fr: "Les heures dont la durée suit celle du jour et de la nuit: l’arc du jour est divisé en douze, et l’arc de la nuit de même, de sorte que les heures du jour s’allongent en été et raccourcissent en hiver. Al-Farghani les oppose aux heures égales {cite:farghani-elements-astronomy p. 86}{cite:farghani-elements-astronomy p. 85}."
