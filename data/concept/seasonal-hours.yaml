  ar: "ساعات تختلف طولاً بحسب طول النهار والليل، فتُقسم قوس النهار على اثنتي عشرة ساعة وقوس الليل كذلك، فتطول ساعات النهار في الصيف وتقصر في الشتاء. وتكون الساعة الزمانية معتدلة في الاستواء وتتفاوت بعده. {cite:farghani-elements-astronomy p. 86}{cite:farghani-elements-astronomy p. 85}"
  en: "Hours whose length follows the length of the day and night: the arc of day is divided into twelve, and the arc of night likewise, so day-hours lengthen in summer and shorten in winter. al-Farghani sets them against the equal hours {cite:farghani-elements-astronomy p. 86}{cite:farghani-elements-astronomy p. 85}."
