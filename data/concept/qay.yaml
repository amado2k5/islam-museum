  en: "Vomit"
  ur: "قے"
  es: "Vomitar"
  fr: "Vomir"
summary:
  ar: "القيء في الاصطلاح الخارج من الطعام بعد استقراره في المعدة، ويُفرّق عن القلس. وفي نجاسته تختلف المذاهب: فالحنفية والشافعية والحنابلة يرونه نجساً، والمالكية يرون النجس منه ما تغيّر عن حال الطعام. وفي نقض الوضوء يرى الحنفية أنه ينقض إذا ملأ الفم، ولا ينقضه المالكية والشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13102} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13103} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13104}"
  en: "Vomit is, in the terminology of the jurists, what comes out of food after it has settled in the stomach; it is distinguished from regurgitation (qalas). The schools differ on whether it is impure: the Hanafis, Shafi'is and Hanbalis hold it impure, while the Malikis hold impure only what has changed from the state of food. On breaking ablution the Hanafis say it breaks it when it fills the mouth, and the Malikis and Shafi'is say it does not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13102} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13103} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13104}"
  es: "El vómito es, en la terminología de los juristas, lo que sale de los alimentos después de que estos se han asentado en el estómago; se distingue de la regurgitación (qalas). Las escuelas difieren en cuanto a su impureza: los hanafíes, shafiíes y hanbalíes lo consideran impuro, mientras que los malikíes consideran impuro solo lo que ha cambiado de estado respecto al alimento. Respecto a la ruptura de la ablución, los hanafíes afirman que se rompe cuando el vómito llena la boca, mientras que los malikíes y shafiíes sostienen que no. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13102} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13103} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13104}"
  fr: "Selon la terminologie des juristes, le vomissement désigne ce qui sort des aliments après leur arrivée dans l'estomac; il se distingue de la régurgitation (qalas). Les écoles divergent quant à son impureté: les hanafites, les chaféites et les hanbalites le considèrent impur, tandis que les malikites estiment impur uniquement ce qui a changé d'état par rapport aux aliments. Concernant la rupture des ablutions, les hanafites affirment qu'elle est rompue lorsque la bouche se remplit, tandis que les malikites et les chaféites estiment le contraire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13102} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13103} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13104}"
  ur: "قے، فقہاء کی اصطلاح میں وہ چیز ہے جو پیٹ میں جمنے کے بعد کھانے سے نکلتی ہے۔ یہ regurgitation ⁦(قلس)⁩ سے ممتاز ہے۔ اس کے نجس ہونے کے بارے میں مکاتب کا اختلاف ہے: حنفیہ، شافعی اور حنبلی اسے نجس سمجھتے ہیں، جبکہ مالکی صرف اس چیز کو نجس سمجھتے ہیں جو کھانے کی حالت سے بدل گئی ہو۔ وضو توڑنے پر احناف کہتے ہیں کہ منہ بھرنے سے ٹوٹ جاتا ہے اور مالکیہ اور شافعی کہتے ہیں کہ ایسا نہیں ہوتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 13102} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 13103}"
