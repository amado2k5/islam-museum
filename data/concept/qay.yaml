summary:
  ar: "القيء في الاصطلاح الخارج من الطعام بعد استقراره في المعدة، ويُفرّق عن القلس. وفي نجاسته تختلف المذاهب: فالحنفية والشافعية والحنابلة يرونه نجساً، والمالكية يرون النجس منه ما تغيّر عن حال الطعام. وفي نقض الوضوء يرى الحنفية أنه ينقض إذا ملأ الفم، ولا ينقضه المالكية والشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13102} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13103} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13104}"
  en: "Vomit is, in the terminology of the jurists, what comes out of food after it has settled in the stomach; it is distinguished from regurgitation (qalas). The schools differ on whether it is impure: the Hanafis, Shafi'is and Hanbalis hold it impure, while the Malikis hold impure only what has changed from the state of food. On breaking ablution the Hanafis say it breaks it when it fills the mouth, and the Malikis and Shafi'is say it does not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13102} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13103} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13104}"
