id: concept/alamat-al-malinkhuliya-al-dimaghiyya-wa-al-badaniyya
class: concept
kind: scientific
label:
  ar: "علامات المالنخوليا الدماغية وبمشاركة البدن"
  en: "Signs of brain melancholia and of melancholia by sharing of the whole body"
  fr: "Les signes de la mélancolie cérébrale et de la mélancolie par participation du corps entier"
  ur: "دماغی مالنخولیا اور پورے بدن کی شرکت سے مالنخولیا کی علامات"
  es: "Signos de melancolía cerebral y de melancolía por afectación de todo el cuerpo."
summary:
  ar: "يذكر ابن سينا علامات ما كان خاصاً بالدماغ ⁦(إفراط الفكرة ودوام الوسواس ولون الرأس والوجه)⁩ وما كان بمشاركة البدن كله ⁦(سواد البدن واحتباس ما كان يستفرغ)⁩، وفيه سطر موسوم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v2 p.106}"
  en: "Ibn Sina gives the signs of what is particular to the brain (excess of thought, constant obsession, the colour of the head and face) and of what comes by sharing of the whole body (blackness of the body, holding back of what used to be emptied); the record has a labelled line in a section held for the founder's ruling {cite:canon-ibn-sina-print-v2 p.106}"
  fr: "Ibn Sina donne les signes de ce qui est propre au cerveau (excès de pensée, obsession constante, couleur de la tête et du visage) et de ce qui vient par participation du corps entier (noirceur du corps, rétention de ce qui était évacué habituellement) ; la fiche comporte une ligne signalée dans une section en attente de la décision du fondateur {cite:canon-ibn-sina-print-v2 p.106}"
  ur: "ابن سینا دماغ سے خاص مرض کی علامات ⁦(فکر کی زیادتی، مسلسل وسوسہ، سر اور چہرے کا رنگ)⁩ اور پورے بدن کی شرکت سے ہونے والے مرض کی علامات ⁦(بدن کی سیاہی، جو خارج ہوتا تھا اس کا رک جانا)⁩ بتاتا ہے؛ اس میں ایک موسوم سطر بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v2 p.106}۔"
  es: "Ibn Sina da los signos de lo que es particular del cerebro (exceso de pensamiento, obsesión constante, el color de la cabeza y el rostro) y de lo que proviene de compartir todo el cuerpo (oscuridad del cuerpo, retención de lo que antes se vaciaba); el registro tiene una línea etiquetada en una sección reservada para el dictamen del fundador {cite:canon-ibn-sina-print-v2 p.106}"
