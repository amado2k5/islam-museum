label:
  ar: فضل الله ورحمته لمن يشاء
  en: God's bounty, given to whom he wills
summary:
  ar: "يرى الشعراوي أن الفضل بيد الله يعطيه لمن يريد، فلا يملك أحد على الله حقاً، وأن كل لحظة من لحظات الحياة فضل منه، وأن الله يختص برحمته بالإيمان بمنهجه من يشاء. ويعرض ذلك بوصفه تفسيراً لجواب الآية عن قول من أراد أن يمنع الفضل عن المؤمنين {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1540}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1541}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1542}."
  en: "Sha'rawi holds that bounty lies in God's hand and he gives it to whom he wills, so no one has a claim upon God. Every moment of life is a bounty from him, and he gives his mercy, through faith in his law, to whom he chooses. He presents this as the answer to those who wished to withhold the bounty from the believers {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1540}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1541}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1542}."
