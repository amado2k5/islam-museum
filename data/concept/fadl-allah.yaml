id: concept/fadl-allah
class: concept
kind: doctrine
label:
  ar: فضل الله ورحمته لمن يشاء
  en: God's bounty, given to whom he wills
  es: "La generosidad de Dios, dada a quien él quiere."
  fr: "La générosité de Dieu, donnée à qui il veut"
  ur: "خدا کا فضل، وہ جسے چاہتا ہے۔"
  tr: "Tanrı'nın lütfu ve merhameti kime isterse"
  id: "Kasih karunia dan belas kasihan Allah kepada siapa pun yang Dia kehendaki"
summary:
  ar: "يرى الشعراوي أن الفضل بيد الله يعطيه لمن يريد، فلا يملك أحد على الله حقاً، وأن كل لحظة من لحظات الحياة فضل منه، وأن الله يختص برحمته بالإيمان بمنهجه من يشاء. ويعرض ذلك بوصفه تفسيراً لجواب الآية عن قول من أراد أن يمنع الفضل عن المؤمنين {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1540}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1541}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1542}."
  en: "Sha'rawi holds that bounty lies in God's hand and he gives it to whom he wills, so no one has a claim upon God. Every moment of life is a bounty from him, and he gives his mercy, through faith in his law, to whom he chooses. He presents this as the answer to those who wished to withhold the bounty from the believers {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1540}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1541}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1542}."
  es: "Sha'rawi sostiene que la gracia reside en la mano de Dios y que Él la otorga a quien quiere, por lo que nadie tiene derecho a reclamar nada a Dios. Cada momento de la vida es una gracia suya, y concede su misericordia, mediante la fe en su ley, a quien elige. Presenta esto como respuesta a quienes deseaban negar la gracia a los creyentes {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1540}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1541}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1542}."
  fr: "Sha'rawi soutient que la grâce réside entre les mains de Dieu et qu'Il la distribue à qui Il veut; nul ne peut donc prétendre à une quelconque faveur envers Lui. Chaque instant de la vie est une grâce de Sa part, et Il accorde Sa miséricorde, par la foi en Sa loi, à qui Il choisit. Il présente cela comme la réponse à ceux qui souhaitaient priver les croyants de cette grâce."
  ur: "شعراوی کے نزدیک یہ فضل خدا کے ہاتھ میں ہے اور وہ جسے چاہتا ہے دیتا ہے، اس لیے خدا پر کسی کا دعویٰ نہیں ہے۔ زندگی کا ہر لمحہ اس کی طرف سے ایک فضل ہے، اور وہ اپنی رحمت دیتا ہے، اپنے قانون پر ایمان کے ذریعے، جسے وہ چنتا ہے۔ وہ اسے ان لوگوں کے جواب کے طور پر پیش کرتا ہے جو مومنوں سے فضل کو روکنا چاہتے ہیں {حوالہ:تفسیر-شراوی-خوااتیر-سکن-جلد-2 صفحہ 1540}{cite:تفسیر-شراوی-خوااتیر-سکن-جلد-2 صفحہ 1541}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1541}{cite:tafsir-sharawi-khawatir-scan-vol-2-p."
  tr: "Al-Shaarawi, liyakatın Allah'ın elinde olduğunu, İstediği kişiye verildiğini, bu yüzden kimsenin Tanrı üzerinde hakkı olmadığını, hayatın her anının O'ndan bir erdem olduğunu ve Tanrı'nın yoluna olan imanıyla merhametiyle yalnızca istediği kişiye bağlı olduğunu düşünür. Bunu, müminlerden lütf esirmek isteyenlerin sözlerine ayetin verdiği yanıtın açıklaması olarak sunar {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1540}{cite:tafsir-sharawi-khawatir-scan-vol-cilt 2 s.1541}{cite:tafsir-sharawi-khawatir-scan-vol-vol-vol-vol-2 s.1542}."
  id: "Al-Shaarawi percaya bahwa jasa ada di tangan Tuhan, diberikan kepada siapa pun yang Dia kehendaki, sehingga tidak ada yang berhak atas Tuhan, dan setiap momen hidup adalah kebajikan dari-Nya, dan bahwa Tuhan eksklusif oleh rahmat-Nya melalui iman pada jalan-Nya yang Dia kehendaki. Dia menyajikan ini sebagai penjelasan atas tanggapan ayat terhadap perkataan mereka yang ingin menahan kasih sayang dari orang beriman {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1540}{cite:tafsir-sharawi-khawatir-scan-vol-vol-2 hlm.1541}{cite:tafsir-sharawi-khawatir-scan-vol-vol-2 hlm.1542}."
