  ar: "عاقر قرحا"
  en: "Aqir qarha (pellitory)"
  ur: "عاقر قرحا"
summary:
  ar: "عاقر قرحا في الكتاب نبات يستعمل أصله، حار يابس في الثالثة، يحذو اللسان حذواً شديداً، يجلب البلغم مضغاً ويدر العرق مع الزيت، وينفع من استرخاء العصب المزمن وخدره ومن وجع الأسنان ويفتح سدد المصفاة والخشم {cite:canon-ibn-sina-print-v1 p.612}"
  en: "Aqir qarha is in the book a plant whose root is used, hot and dry in the third degree, which stings the tongue strongly, draws phlegm when chewed and promotes sweat with oil, and benefits chronic relaxation and numbness of the nerve and toothache, and opens obstructions of the sieve bone and the nose {cite:canon-ibn-sina-print-v1 p.612}"
  ur: "عاقر قرحا کتاب میں ایک پودا ہے جس کی جڑ استعمال ہوتی ہے، تیسرے درجے میں گرم خشک، زبان کو سخت جلاتا ہے، چبانے سے بلغم کھینچتا اور تیل کے ساتھ پسینہ لاتا ہے، اور پرانی اعصابی ڈھیلاہٹ اور سن ہو جانے، دانتوں کے درد میں فائدہ دیتا اور مصفاۃ اور ناک کی رکاوٹیں کھولتا ہے {cite:canon-ibn-sina-print-v1 p.612}۔"
