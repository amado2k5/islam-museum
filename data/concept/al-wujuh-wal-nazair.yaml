id: concept/al-wujuh-wal-nazair
class: concept
kind: discipline
label:
  ar: "الوجوه والنظائر"
  en: "Polysemy and parallels (al-wujuh wa-l-naza'ir)"
  ur: "وجوہ و نظائر"
summary:
  ar: "علم يجمع الألفاظ القرآنية التي تنصرف إلى معانٍ متعددة ⁦(الوجوه)⁩ والتي تتفق في معنى واحد في مواضع كثيرة ⁦(النظائر)⁩؛ هو النوع الرابع عند الزركشي، وصنف فيه مقاتل بن سليمان قديمًا، ثم ابن الزاغوني وابن الجوزي والدامغاني وابن فارس."
  en: "The science that gathers Qur'anic words turning to several meanings (wujuh) and words recurring with one meaning in many places (naza'ir); al-Zarkashi's fourth type. Muqatil ibn Sulayman wrote on it early, followed by Ibn al-Zaghuni, Ibn al-Jawzi, al-Damaghani and Ibn Faris."
  ur: "وہ علم جو قرآنی الفاظ کو جمع کرتا ہے جو متعدد معانی کی طرف پھرتے ہیں ⁦(وجوہ)⁩ اور جو بہت سے مقامات پر ایک ہی معنی میں آتے ہیں ⁦(نظائر)⁩؛ زرکشی کی چوتھی نوع۔ اس پر مقاتل بن سلیمان نے ابتدا میں لکھا، پھر ابن الزاغونی، ابن الجوزی، دامغانی اور ابن فارس نے۔"
