  ar: "الأنهار والعيون تجري من تحت الجنة ومن صخر الأرض، وانفجرت من الحجر اثنتا عشرة عيناً لبني إسرائيل، ومثل الجنة أنهار من ماء غير آسن وأنهار من لبن وأنهار من خمر وأنهار من عسل."
  en: "Rivers and springs run beneath the Garden and out of the rock of the earth — twelve springs gushed for Israel from the stone — and the Garden's likeness is rivers of water unstaling, rivers of milk, rivers of wine and rivers of honey."
