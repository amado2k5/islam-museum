  ar: "الأنهار والعيون"
  en: "Rivers and springs"
  ur: "دریا اور چشمے"
  es: "Ríos y manantiales"
  fr: "Rivières et sources"
  tr: "Nehirler ve Kaynaklar"
  id: "Sungai dan Mata Air"
summary:
  ar: "الأنهار والعيون تجري من تحت الجنة ومن صخر الأرض، وانفجرت من الحجر اثنتا عشرة عيناً لبني إسرائيل، ومثل الجنة أنهار من ماء غير آسن وأنهار من لبن وأنهار من خمر وأنهار من عسل."
  en: "Rivers and springs run beneath the Garden and out of the rock of the earth — twelve springs gushed for Israel from the stone — and the Garden's likeness is rivers of water unstaling, rivers of milk, rivers of wine and rivers of honey."
  ur: "دریا اور چشمے جنت کے نیچے اور زمین کی چٹانوں سے بہتے ہیں — بنی اسرائیل کے لیے پتھر سے بارہ چشمے پھوٹے — اور جنت کی مثال باسا نہ ہونے والے پانی، دودھ، شراب اور شہد کی نہریں ہیں۔"
  es: "Ríos y manantiales corren bajo el Jardín y brotan de la roca de la tierra; doce manantiales surgieron para Israel de la piedra; y la semejanza del Jardín es la de ríos de agua inagotable, ríos de leche, ríos de vino y ríos de miel."
  fr: "Des rivières et des sources coulent sous le Jardin et jaillissent du rocher de la terre — douze sources jaillissaient de la pierre pour Israël — et le Jardin ressemble à des rivières d'eau jaillissante, des rivières de lait, des rivières de vin et des rivières de miel."
  tr: "Nehirler ve kaynaklar Cennet'in altından ve yeryüzünün kayalarından akar, İsrailoğulları için taştan on iki kaynak fışkırır. Cennet gibi, kaynamamış su nehirleri, süt nehirleri, şarap nehirleri ve bal nehirleri gibidir."
  id: "Sungai dan mata air mengalir dari bawah Surga dan dari batu-batu bumi, dan dua belas mata air meletus dari batu untuk Anak-anak Israel. Seperti Surga, sungai air belum direbus, sungai susu, sungai anggur, dan sungai madu."
