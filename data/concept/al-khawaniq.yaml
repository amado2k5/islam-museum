label:
  ar: "الخوانيق والذبح"
  en: "The quinsies and the strangling"
  fr: "Les angines suffocantes et la suffocation"
  ur: "خناق اور ذبح"
summary:
  ar: "الاختناق امتناع نفوذ النفس إلى الرئة والقلب يعرض من أسباب كثيرة والذي كلامه فيه ما كان بسبب يعرض في آلات التنفس القريبة من الحنجرة من ورم أو انطباق أو عجز قوة عن تحريك آلات الاستنشاق، وأقسام الورم بحسب الأعضاء المتورمة أربعة: في العضلات الخارجة عن الحنجرة المائلة إلى قدام فيظهر في مقدم العنق والصدر، أو في الخارجة إلى خلف وفي عضلات المريء فيظهر لونه في داخل الفم وربما تأدى إلى الفقار والنخاع بالمشاركة، أو في العضلات الباطنة من المريء فيضيق النفس بالمجاورة ولا يظهر للحس، أو في العضلات الباطنة من الحنجرة والغشاء المستبطن لها وهو شر الأربعة ولا يظهر للحس أيضاً وقد يجتمع اثنان أو ثلاثة، وسببها سبب سائر الأورام وقد تعرض من الدم ومن المرة الصفراء ومن البلغم وهو أسلمها وأسرعها برءاً وقد يتطاول أربعين يوماً وقلما يعرض من السوداء وقال بعضهم إنه لا يعرض البتة ⁦(قول منسوب على لفظ الكتاب)⁩ {cite:canon-ibn-sina-print-v2 p.287}"
  en: "Suffocation is the breath's being barred from reaching the lung and the heart; it befalls for many causes, and his discourse is on what comes of a cause arising in the breathing-tools near the larynx — a tumour, an apposition, or a power failing to move the tools of inhaling. The tumour's divisions by the swollen organs are four: in the muscles outside the larynx leaning forward so the tumour and its redness show in the front of the neck or the chest or the breastbone; or in those outward but behind and in the oesophagus's muscles so its colour shows inside the mouth and it may reach the vertebra and the cord by sharing; or in the muscles inward of the oesophagus, narrowing the breath by neighbourhood without showing to sense; or in the muscles inward of the larynx and its inner membrane — the worst of the four, not showing to sense either; and two or three of these may combine. Their cause is the cause of all tumours; they may arise from blood, from yellow bile, and from phlegm — the soundest and quickest to heal, though it may stretch to forty days — and rarely from the black; and one of them said it never arises at all (a saying carried on the book's wording) {cite:canon-ibn-sina-print-v2 p.287}"
  fr: "La suffocation, selon le traité, survient lorsque le souffle ne peut atteindre le poumon et le cœur. Elle a de nombreuses causes ; l’auteur parle ici de celles qui touchent les organes de la respiration près du larynx : un gonflement, un accolement ou la défaillance de la faculté qui met en mouvement les organes de l’inspiration. Il distingue quatre sièges du gonflement : les muscles extérieurs au larynx, vers l’avant, où la tuméfaction et la rougeur sont visibles à l’avant du cou, de la poitrine ou du sternum ; les muscles extérieurs mais situés en arrière, ainsi que ceux de l’œsophage, où la couleur est visible dans la bouche et où l’atteinte peut s’étendre à la vertèbre et à la moelle du fait de leur relation ; les muscles intérieurs de l’œsophage, qui gênent la respiration par leur proximité sans que le gonflement soit perceptible ; enfin, les muscles intérieurs du larynx et sa membrane interne, siège de la plus grave des quatre formes, elle aussi imperceptible. Deux ou trois de ces formes peuvent se combiner. Leur cause est celle de tous les gonflements : ils peuvent provenir du sang, de la bile jaune ou du flegme — la forme la moins grave et la plus prompte à guérir, bien qu’elle puisse durer quarante jours — et rarement de la bile noire ; l’un des auteurs cités dit que cette dernière forme ne survient jamais (avis rapporté dans les termes du livre) {cite:canon-ibn-sina-print-v2 p.287}"
  ur: "گھٹن نفس کا پھیپھڑے اور دل تک نہ پہنچنے کی روک ہے؛ وہ بہت سے اسباب سے ہوتی ہے اور اس کا کلام اس پر ہے جو حنجرے کے قریب تنفس کے اوزاروں میں پیدا ہونے والے سبب سے ہو — سوجن یا انطباق یا قوت کا دم کشید کے اوزار چلانے سے عاجز ہونا؛ متورم اعضاء کے اعتبار سے سوجن کے اقسام چار ہیں: حنجرے سے باہر کے پٹھوں میں جو آگے جھکے ہیں تو سوجن اور اس کی سرخی گردن یا سینے یا قص کے مقدم میں ظاہر ہو، یا پیچھے کے اور مریء کے پٹھوں میں تو اس کا رنگ منہ کے اندر ظاہر ہو اور مشارکت سے فقار اور نخاع تک پہنچ سکتا ہے، یا مریء کے اندرونی پٹھوں میں تو قرب سے نفس تنگ ہو اور وہ حِس کو ظاہر نہ ہو، یا حنجرے کے اندرونی پٹھوں اور اس کے اندرونی غشاء میں — اور وہ چاروں میں بدترین ہے اور وہ بھی حِس کو ظاہر نہیں ہوتا؛ اور ان میں سے دو تین جمع بھی ہو سکتے ہیں؛ ان کا سبب تمام سوجنوں کا سبب ہے اور وہ خون سے بھی ہو سکتی ہے صفرا سے بھی اور بلغم سے بھی — جو ان میں سالم ترین اور جلد شفا دینے والی ہے مگر چالیس دن تک بھی جا سکتی ہے — اور سودا سے کم ہوتی ہے اور کسی نے کہا وہ بالکل نہیں ہوتی ⁦(کتاب کے لفظ پر منسوب قول)⁩ {cite:canon-ibn-sina-print-v2 p.287}"
