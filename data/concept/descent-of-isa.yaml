issue:
  ar: "هل ينزل عيسى ابن مريم قبل الساعة، وكيف يُفهم ذلك مع قوله تعالى إنه متوفيه ورافعه؟"
  en: "Will Jesus son of Mary descend before the Hour, and how is that understood alongside the verse saying God will take him and raise him?"
perspectives:
- tradition: sunni
  id: sunni-sharawi-descent-by-hadith
  stance:
    ar: "النزول ثابت بالحديث، والعقل لا يستبعده بعد قبول الولادة الخارقة"
    en: "The descent is established by hadith, and reason should not find it unlikely once the miraculous birth is accepted"
  summary:
    ar: "يقول الشعراوي إن النبي بيّن نزول ابن مريم، ويذكر حديثاً رواه البخاري ومسلم يخاطب فيه النبي أمته بأن ابن مريم سينزل فيهم وإمامهم منهم، ويجادل من يقبل ولادة عيسى دون أب ثم يستبعد نهاية حياته، فيقول إن من قبل الأولى يمهّد له قبول الثانية {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1505}."
    en: "Sha'rawi says the Prophet explained that the son of Mary will come again. He cites a hadith reported by al-Bukhari and Muslim in which the Prophet asks his community how they will be when the son of Mary descends among them and their leader is one of them. He argues with those who accept Jesus's birth without a father but find his end unlikely, saying that acceptance of the first prepares the way for the second {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1505}."
