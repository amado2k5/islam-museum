id: concept/descent-of-isa
education:
  did_you_know:
    ar: "يقرر الشعراوي أن النبي بيّن أن ابن مريم سينزل مرة أخرى، مستنداً إلى حديث عند البخاري ومسلم، ويرى أن من قبل ولادته الخارقة لا يستبعد نهايته الخارقة."
    en: "Al-Sha'rawi affirms the Prophet foretold that Ibn Maryam would descend once more, resting on a hadith in al-Bukhari and Muslim — and one who accepts his miraculous birth should not doubt a miraculous end."
    ur: "شعراوی اس پر قائل ہیں کہ نبی نے بتایا ابنِ مریم پھر نازل ہوں گے، بخاری و مسلم کی حدیث پر — اور جو معجزانہ ولادت مانتا ہے معجزانہ انجام سے انکار نہیں کر سکتا۔"
    sources: [source/tafsir-sharawi-khawatir-scan-vol-2, source/sahih-al-bukhari]
class: concept
kind: doctrine
label:
  ar: نزول عيسى ابن مريم قبل الساعة
  en: The descent of Jesus son of Mary before the Hour
summary:
  ar: "يقرر الشعراوي أن النبي بيّن أن ابن مريم سينزل مرة أخرى، ويستند إلى حديث رواه البخاري ومسلم، ويرى أن من قبل ولادته الخارقة لا يستبعد نهاية حياته الخارقة {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1505}."
  en: "Sha'rawi holds that the Prophet told that the son of Mary would come again. He relies on a hadith reported by al-Bukhari and Muslim, and argues that one who accepts the miraculous birth should not find his miraculous end unlikely {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1505}."
