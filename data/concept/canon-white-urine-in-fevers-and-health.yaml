id: concept/canon-white-urine-in-fevers-and-health
class: concept
kind: scientific
label: { ar: "البول الأبيض في الحميات والصحة عند ابن سينا", en: "White urine in fevers and in health in the Canon", ur: "بخار اور صحت میں سفید پیشاب قانون میں", es: "Orina blanca en casos de fiebre y en estado de salud en el Canon", fr: "Urine blanche en cas de fièvre et en bonne santé dans le Canon", tr: "İbn Sina'ya göre diyetlerde ve sağlıkta beyaz idrar", id: "Urin putih dalam pola makan dan kesehatan menurut Ibn Sina" }
summary:
  ar: "يعدد ابن سينا دلالات بياض البول في الحميات الحادة وفي الصحة، منها الانتقال إلى الربع في الحمى، وأن البول الرصاصي بلا رسوب رديء، واللبني مهلك، وأن الصفراء قد تميل إلى عضو أو إلى الرأس {cite:canon-ibn-sina-print-v1 p.187}."
  en: "Ibn Sina lists what white urine shows in acute fevers and in health: a fever shifting to a quartan, that leaden urine without sediment is bad and milky urine deadly, and that bile may have turned toward an organ or the head {cite:canon-ibn-sina-print-v1 p.187}."
  es: "Ibn Sina enumera lo que muestra la orina blanca en fiebres agudas y en la salud: una fiebre que cambia a cuartana, que la orina plomiza sin sedimento es mala y la orina lechosa es mortal, y que la bilis puede haberse dirigido hacia un órgano o la cabeza {cite:canon-ibn-sina-print-v1 p.187}."
  fr: "Ibn Sina énumère ce que l'urine blanche indique dans les fièvres aiguës et en bonne santé: une fièvre passant à un quartan, que l'urine plombée sans sédiment est mauvaise et l'urine laiteuse mortelle, et que la bile peut s'être dirigée vers un organe ou la tête {cite:canon-ibn-sina-print-v1 p.187}."
  ur: "ابن سینا نے درج کیا ہے کہ شدید بخار اور صحت میں سفید پیشاب کیا ظاہر کرتا ہے: بخار کو کوارٹن میں منتقل ہونا، بغیر تلچھٹ کے سیسہ کا پیشاب خراب اور دودھ والا پیشاب مہلک ہے، اور وہ پت کسی عضو یا سر کی طرف مڑ سکتی ہے۔"
  tr: "İbn Sina, ağır ateşlerde ve sağlıkta beyaz idrarın göstergelerini, ateşte dörtte bire geçişi, kurşunsuz idrarın kötü biriktirilmesini, süt idrarının ölümcül olduğunu ve safranın uzuv veya başa yönelebileceğini listeler. {cite:canon-ibn-sina-print-v1 s.187}."
  id: "Ibn Sina mencantumkan indikasi urine putih pada demam parah dan kesehatan, termasuk transisi ke seperempat demam, bahwa urin bebas timbal kurang tertahankan, bahwa urin susu bersifat fatal, dan bahwa empedu dapat melambangkan anggota tubuh atau kepala {cite:canon-ibn-sina-print-v1 hlm.187}."
