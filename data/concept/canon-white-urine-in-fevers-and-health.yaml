summary:
  ar: "يعدد ابن سينا دلالات بياض البول في الحميات الحادة وفي الصحة، منها الانتقال إلى الربع في الحمى، وأن البول الرصاصي بلا رسوب رديء، واللبني مهلك، وأن الصفراء قد تميل إلى عضو أو إلى الرأس {cite:canon-ibn-sina-print-v1 p.187}."
  en: "Ibn Sina lists what white urine shows in acute fevers and in health: a fever shifting to a quartan, that leaden urine without sediment is bad and milky urine deadly, and that bile may have turned toward an organ or the head {cite:canon-ibn-sina-print-v1 p.187}."
