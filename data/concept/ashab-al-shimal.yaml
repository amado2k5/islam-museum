summary:
  ar: "أصحاب الشمال في القرآن والسنة: الذين يؤتون كتابهم بشمائلهم في يوم القيامة، يدخلون النار، يذكر أن كتابهم يؤتى بهم بشمائلهم وهم يدخلون النار."
  en: "The People of the Left in Qur'an and Sunnah: those given their book in their left hands on the Day of Resurrection, entering fire — their book is given in their left hands as they enter fire."
  ur: "اصحاب شمال قرآن و سنت میں: وہ لوگ جنہیں یوم قیامت میں ان کا نامہ بائیں ہاتھ میں دیا جاتا ہے اور وہ آگ میں داخل ہوتے ہیں — ان کا نامہ بائیں ہاتھ میں دیا جاتا ہے جیسے وہ آگ میں داخل ہوتے ہیں۔"
