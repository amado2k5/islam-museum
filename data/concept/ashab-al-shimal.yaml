label:
  ar: أصحاب الشمال
  en: The People of the Left
  fr: "Les gens de la Gauche"
  ur: اصحاب شمال
  es: "La gente de izquierda"
summary:
  ar: "أصحاب الشمال في القرآن والسنة: الذين يؤتون كتابهم بشمائلهم في يوم القيامة، يدخلون النار، يذكر أن كتابهم يؤتى بهم بشمائلهم وهم يدخلون النار."
  en: "The People of the Left in Qur'an and Sunnah: those given their book in their left hands on the Day of Resurrection, entering fire — their book is given in their left hands as they enter fire."
  fr: "Les gens de la Gauche dans le Coran et la Sunna : ceux qui reçoivent leur livre dans la main gauche au Jour de la Résurrection et entrent au feu — leur livre leur est donné dans la main gauche lorsqu’ils entrent au feu."
  ur: "اصحاب شمال قرآن و سنت میں: وہ لوگ جنہیں یوم قیامت میں ان کا نامہ بائیں ہاتھ میں دیا جاتا ہے اور وہ آگ میں داخل ہوتے ہیں — ان کا نامہ بائیں ہاتھ میں دیا جاتا ہے جیسے وہ آگ میں داخل ہوتے ہیں۔"
  es: "La gente de la izquierda en el Corán y la Sunnah: aquellos a quienes se les entrega su libro en la mano izquierda el Día de la Resurrección, al entrar en el fuego, su libro es entregado en su mano izquierda al entrar en el fuego."
