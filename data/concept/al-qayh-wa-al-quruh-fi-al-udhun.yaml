id: "concept/al-qayh-wa-al-quruh-fi-al-udhun"
class: "concept"
kind: "scientific"
label:
  ar: "القيح والمدة والقروح في الأذن"
  en: "Pus, matter and ulcers in the ear"
  fr: "Pus, sérosité purulente et ulcères de l’oreille"
  ur: "کان میں پیپ، مدد اور پھوڑے"
  es: "Pus, materia y úlceras en el oído"
summary:
  ar: "يقدم في علاج القيح والقروح في الأذن تلطيف الغذاء وإمالة التدبير إلى الكيفية المعتدلة وتخفيف الرياضة وإمالة المادة إلى الأنف والفم، والقروح منها ظاهرة للحس تغسل وتجفف ومنها عميقة منها قريبة العهد ومنها مزمنة، والمزمنة رديئة جداً ربما أدت إلى كشف العظام ويدل عليها اتساع المجرى وكثرة الصديد المنتن؛ ويجب بالجملة أن لا يحبس الصديد بل يمنع تولده وتجفف قروحها، وذكر أن كثيراً من المعالجين المحتالين يحشون الأذن المقيحة خرقاً تمنع سيلان القيح فيحوج المادة إلى اللحم الرخو في أصل الأذن فيحدث ورماً يبطنونه بعد الإنضاج ⁦⁦(أسماء الأدوية والمركبات والفتائل ومقاديرها لا تحمل، وسطر لبن امرأة سطر موسوم مطروح لحكم المؤسس)⁩⁩ {cite:canon-ibn-sina-print-v2 p.227} {cite:canon-ibn-sina-print-v2 p.228}"
  en: "Treating pus and ulcers in the ear begins with lightening the diet, inclining the regimen to moderation, easing exercise and turning the matter to nose and mouth. Of ulcers some are sensible — washed then dried — and some deep, some recent and some chronic; the chronic are very bad, sometimes laying the bone bare, shown by the widening of the passage and much stinking pus. In sum pus must not be held back — its breeding is prevented and the ulcers dried; he tells how many cunning practitioners stuff the suppurating ear with rags to stop the pus flowing, driving the matter to the soft flesh at the ear's root where a swelling forms which they then lance after ripening ⁦(drug, compound and tent names and measures are not carried; the woman's-milk line is a labelled listing for the founder's ruling)⁩ {cite:canon-ibn-sina-print-v2 p.227} {cite:canon-ibn-sina-print-v2 p.228}"
  fr: "D’après le Canon, le traitement du pus et des ulcères de l’oreille commence par l’allègement de l’alimentation, le retour à un régime tempéré, la réduction de l’exercice et la dérivation de la matière vers le nez et la bouche. Certains ulcères sont perceptibles : on les lave puis on les sèche. D’autres sont profonds, récents ou chroniques. Les chroniques sont très graves et mettent parfois l’os à nu, ce que signalent l’élargissement du conduit et l’abondance de pus fétide. En somme, il ne faut pas retenir le pus, mais en prévenir la formation et sécher les ulcères. L’auteur raconte comment de nombreux praticiens rusés bourrent de chiffons l’oreille qui suppure pour arrêter l’écoulement et refouler la matière vers les chairs molles à la racine de l’oreille. Une tuméfaction s’y forme, qu’ils incisent après maturation (les noms et les quantités des remèdes, des composés et des mèches ne sont pas reproduits ; la mention du lait de femme est signalée pour décision du fondateur) {cite:canon-ibn-sina-print-v2 p.227} {cite:canon-ibn-sina-print-v2 p.228}"
  ur: "کان میں پیپ اور پھوڑوں کے علاج میں پہلے غذا ہلکی کرنا، تدبیر کو اعتدال کی طرف جھکانا، ورزش کم کرنا اور مادے کو ناک اور منہ کی طرف مائل کرنا مقدم ہے؛ پھوڑوں میں بعض حاسہ کو ظاہر ہیں جنہیں دھویا اور خشک کیا جاتا ہے اور بعض گہرے ہیں جن میں سے بعض تازہ اور بعض مزمن؛ مزمن نہایت بری ہیں جو کبھی ہڈی ننگی کر دیتی ہیں — ان کی علامت مجرا کا پھیلنا اور بدبودار صدید کی کثرت ہے؛ اور خلاصہ یہ کہ صدید کو نہیں روکنا چاہیے بل اس کا پیدا ہونا روکا جائے اور پھوڑے خشک کیے جائیں؛ اور اس نے بتایا کہ بہت سے چالاک معالج پپ والے کان میں کپڑے ٹھونس دیتے ہیں کہ پیپ کا بہنا بند ہو تو مادہ کان کی جڑ کے نرم گوشت کی طرف مجبور ہو جائے اور وہاں ورم پیدا ہو جسے پکنے کے بعد پھاڑتے ہیں ⁦⁦(ادویہ، مرکبات اور فتیلوں کے نام اور مقدار منقول نہیں؛ عورت کے دودھ کی سطر بانی کے فیصلے کے لیے موسوم فہرست ہے)⁩⁩ {cite:canon-ibn-sina-print-v2 p.227} {cite:canon-ibn-sina-print-v2 p.228}"
  es: "El tratamiento de la pus y las úlceras en el oído comienza con aligerar la dieta, inclinar el régimen hacia la moderación, reducir el ejercicio y dirigir el asunto hacia la nariz y la boca. Algunas úlceras son sensibles —se lavan y secan— y otras profundas, algunas recientes y otras crónicas; las crónicas son muy graves, a veces dejando el hueso al descubierto, lo que se evidencia por el ensanchamiento del conducto y la abundante pus maloliente. En resumen, no se debe contener la pus: se previene su proliferación y se secan las úlceras; cuenta cómo muchos curanderos ingeniosos rellenan el oído supurante con trapos para detener el flujo de pus, empujando la materia hacia la carne blanda en la raíz del oído donde se forma una inflamación que luego drenan después de madurar (no se incluyen nombres de medicamentos, compuestos ni medidas; la línea de leche materna es una lista etiquetada para la regla del fundador) {cite:canon-ibn-sina-print-v2 p.227} {cite:canon-ibn-sina-print-v2 p.228}"
