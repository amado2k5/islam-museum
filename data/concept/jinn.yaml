id: concept/jinn
class: concept
kind: belief
label:
  ar: الجن
  en: The jinn
  ur: جن
summary:
  ar: "الجن في التصور الإسلامي خلق مكلّف غائب عن أعين الناس؛ يروي ابن كثير أنهم سكنوا الأرض قبل الإنسان وأن منهم الكافر والمؤمن {cite:tafsir-ibn-kathir}. وتصفهم موسوعة الإسلام بأنهم أجسام من بخار أو لهب خُلقت من لهب لا دخان فيه، قابلة للنجاة، وتعرض المسألة في ثلاثة أبواب: الجن قبل الإسلام، والجن في الإسلام الرسمي، والجن في الفلكلور."
  en: "The jinn in Islamic conception are a hidden, accountable creation; Ibn Kathir reports they inhabited the earth before mankind and that among them are disbelievers and believers {cite:tafsir-ibn-kathir}. The Encyclopaedia of Islam describes them as intelligent beings of vapour or flame, made from smokeless fire and capable of salvation, and treats them under three heads: pre-Islamic Arabia, official Islam and folklore, with Turkish, Indian and Indonesian material."
  ur: "اسلامی تصور میں جن ایک پوشیدہ اور مکلف مخلوق ہیں؛ ابن کثیر کے مطابق وہ انسان سے پہلے زمین میں آباد تھے اور ان میں کافر و مسلمان دونوں ہیں {cite:tafsir-ibn-kathir}۔ اسلامی انسائیکلوپیڈیا انہیں بخارات یا شعلے سے بنی، بے دھوئیں کی آگ سے پیدا کردہ اور نجات کی اہل مخلوق بتاتی ہے، اور موضوع کو تین ابواب میں دیکھتی ہے: اسلام سے پہلے عرب، سرکاری اسلام اور لوک روایت، نیز ترکی، ہندوستانی اور انڈونیشیائی مواد۔"
