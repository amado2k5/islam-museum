id: concept/iktisab
class: concept
kind: legal
label: { ar: "الاكتساب", en: "Iktisab (earning a livelihood)", es: "Iktisab (ganarse la vida)", fr: "Iktisab (gagner sa vie)", ur: "اکتساب ⁦(روزی کمانا)⁩" }
summary:
  ar: "الاكتساب طلب الرزق وتحصيل المال بما حل من الأسباب، وهو يفترق عن الكسب بأنه لا يكون إلا ببذل الجهد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3234} وهو فرض على المحتاج القادر عليه، وهو سنة لمن له كفاية، ويجب على من لا قوت له ومن تلزمه نفقته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3235} ولا يكلف الاكتساب المرأة ولا الصغير الذي ليس بأهل للكسب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3235} ولا يجوز الاكتساب بما هو محرم كبيع الخمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3235}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3236}"
  en: "Iktisab means seeking livelihood and earning property by lawful means; unlike kasb it requires effort. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3234} It is obligatory on a capable person in need, a sunna for one who has enough, and obligatory for one without subsistence or one whose upkeep is due. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3235} Women and children who are not fit to earn are not required to work. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3235} Earning through what is forbidden, such as selling wine, is not allowed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3235}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3236}"
  es: "Iktisab significa buscar sustento y obtener bienes por medios lícitos; a diferencia de kasb, requiere esfuerzo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3234} Es obligatorio para una persona capaz que se encuentra en necesidad, una sunna para quien tiene suficiente y obligatorio para quien carece de sustento o cuyo mantenimiento es obligatorio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3235} Las mujeres y los niños que no están en condiciones de ganar dinero no están obligados a trabajar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3235} No está permitido ganar dinero mediante lo prohibido, como la venta de vino. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3235}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3236}"
  fr: "L'iktisab consiste à rechercher sa subsistance et à acquérir des biens par des moyens licites; contrairement au kasb, il requiert des efforts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3234} Il est obligatoire pour une personne capable et dans le besoin, recommandé (sunna) pour celui qui a les moyens, et obligatoire pour celui qui est sans ressources ou dont l'entretien est dû. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3235} Les femmes et les enfants qui ne sont pas aptes au travail ne sont pas tenus de travailler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3235} Il est interdit de gagner de l'argent par des moyens illicites, comme la vente de vin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3235}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3236}"
  ur: "اقتساب کا مطلب ہے روزی تلاش کرنا اور جائز ذرائع سے جائیداد کمانا۔ کسب کے برعکس اس کے لیے کوشش کی ضرورت ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3234} قابل ضرورت پر واجب، کفایت کرنے والے کے لیے سنت، اور بے روزی یا جس کی نگہداشت واجب ہو اس پر واجب ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3235} جو عورتیں اور بچے کمانے کے قابل نہیں ہیں ان پر کام کرنے کی ضرورت نہیں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3235} حرام چیزوں سے کمانا، جیسے شراب بیچنا، جائز نہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3235}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3236}"
