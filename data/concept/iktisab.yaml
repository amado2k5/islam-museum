id: concept/iktisab
class: concept
kind: legal
label: { ar: "الاكتساب", en: "Iktisab (earning a livelihood)" }
summary:
  ar: "الاكتساب طلب الرزق وتحصيل المال بما حل من الأسباب، وهو يفترق عن الكسب بأنه لا يكون إلا ببذل الجهد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3234} وهو فرض على المحتاج القادر عليه، وهو سنة لمن له كفاية، ويجب على من لا قوت له ومن تلزمه نفقته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3235} ولا يكلف الاكتساب المرأة ولا الصغير الذي ليس بأهل للكسب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3235} ولا يجوز الاكتساب بما هو محرم كبيع الخمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3235}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3236}"
  en: "Iktisab means seeking livelihood and earning property by lawful means; unlike kasb it requires effort. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3234} It is obligatory on a capable person in need, a sunna for one who has enough, and obligatory for one without subsistence or one whose upkeep is due. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3235} Women and children who are not fit to earn are not required to work. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3235} Earning through what is forbidden, such as selling wine, is not allowed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3235}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3236}"
