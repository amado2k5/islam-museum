id: concept/tatfful-uninvited-guest
class: concept
kind: ethical
label:
  ar: "التطفل"
  en: "Tatfful (entering another's meal uninvited)"
  ur: "تطفل ⁦(بغیر بلائے کسی کی دعوت میں جانا)⁩"
  es: "Tatfful (entrar sin invitación a la comida de otra persona)"
  fr: "Tatfful (s'introduire sans invitation dans le repas d'autrui)"
  tr: "Saldırı"
  id: "Intrusi"
summary:
  ar: "التطفل دخول الشخص محل غيره لتناول طعامه بغير إذنه ولا علم رضاه، أو ظن رضاه بقرينة معتبرة. ويحرم عند المالكية والشافعية والحنابلة، ويفسق به إن تكرر، لحديث «من دعي فلم يجب فقد عصى الله ورسوله، ومن دخل على غير دعوة دخل سارقاً وخرج مغيراً»، وترد شهادة الطفيلي إن تكرر منه ذلك لدناءته وقلة مروءته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5306} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5307} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5308}"
  en: "Tatfful is entering another person's place to eat his food without his leave or knowledge of his consent, or with consent presumed by a sound sign. It is forbidden for the Malikis, Shafiis and Hanbalis, and makes a person a sinner if repeated, on the hadith «whoever is invited and does not come has disobeyed God and His messenger, and whoever enters uninvited enters as a thief and leaves as a plunderer». The testimony of a habitual uninvited guest is rejected, because it is base and lacking in manliness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5306} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5307} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5308}"
  es: "Tatfful consiste en entrar en casa de otra persona para comer su comida sin su permiso ni conocimiento de su consentimiento, o con consentimiento presumido por una señal clara. Está prohibido para los malikíes, shafiíes y hanbalíes, y convierte a la persona en pecadora si se repite, según el hadiz «quien es invitado y no acude, desobedece a Dios y a Su mensajero; y quien entra sin invitación, entra como ladrón y sale como saqueador». El testimonio de un invitado habitual sin invitación es rechazado, pues es vil y falto de hombría. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5306} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5307} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5308}"
  fr: "Le tatfful consiste à entrer chez autrui pour manger sa nourriture sans sa permission ni son consentement, ou en présumant son consentement par un signe sonore. Cette pratique est interdite par les écoles malikite, chaféite et hanbalite, et constitue un péché si elle est répétée, conformément au hadith: « Quiconque est invité et ne vient pas a désobéi à Dieu et à Son Messager; quiconque entre sans y être invité entre comme un voleur et repart comme un pilleur. » Le témoignage d’un invité habituel et intrus est rejeté, car il est vil et manque de virilité."
  ur: "تطفول کسی دوسرے شخص کے کھانے کے لیے اس کی اجازت کے بغیر یا اس کی رضامندی کے علم کے بغیر یا اس کی رضامندی کے ساتھ اس کا کھانا کھانے کے لیے داخل ہو رہا ہے جس کے بارے میں صوتی علامت کا اندازہ لگایا گیا ہو۔ یہ مالکیوں، شافعیوں اور حنبلیوں کے لیے حرام ہے اور حدیث میں ہے کہ \"جس کو بلایا گیا اور نہ آیا اس نے خدا اور اس کے رسول کی نافرمانی کی، اور جو بغیر بلائے داخل ہوا وہ چور کی طرح داخل ہوا اور لوٹنے والا بن کر چلا گیا\"۔ عادی بن بلائے مہمان کی گواہی رد کی جاتی ہے، کیونکہ وہ بنیاد ہے اور مردانگی سے عاری ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5306} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5307}"
  tr: "Başkasının evine girip izin almadan, onların rızasından habersiz ya da onayının geçerli bir göstergesi olmadan yemek yemektir. Maliki, Şafiî ve Haneli'ye göre yasaktır ve tekrarlanması ahlaksızlık sayılır; hadise şu hadise dayanarak: \"Davet edilen ama cevap vermeyen Allah ve Elçi'ye itaatsizlik etmiş olur; davet olmadan giren hırsız olarak girer ve değişen olarak çıkar.\" El-Tufaili'nin tanıklığı, alçaklığı ve onursuzluğu nedeniyle tekrarlanırsa reddedilir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.5306} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5307} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5308}"
  id: "Mengganggu adalah memasuki tempat orang lain untuk makan tanpa izin atau tanpa mengetahui persetujuan mereka, atau dengan indikasi yang sah bahwa persetujuan mereka tercantum. Hal ini dilarang menurut Maliki, Syafi'i, dan Hanbali, dan dianggap tidak bermoral jika diulang, berdasarkan hadits: \"Siapa pun yang diundang tetapi tidak menjawab telah membangkang Allah dan Rasul-Nya; siapa pun yang masuk tanpa undangan masuk sebagai pencuri dan pergi sebagai penukar tukar.\" Kesaksian Al-Tufaili ditolak jika diulang karena kehinaan dan kurangnya martabatnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5306} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5307} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5308}"
