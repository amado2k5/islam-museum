label:
  ar: "التطفل"
  en: "Tatfful (entering another's meal uninvited)"
  ur: "تطفل (بغیر بلائے کسی کی دعوت میں جانا)"
summary:
  ar: "التطفل دخول الشخص محل غيره لتناول طعامه بغير إذنه ولا علم رضاه، أو ظن رضاه بقرينة معتبرة. ويحرم عند المالكية والشافعية والحنابلة، ويفسق به إن تكرر، لحديث «من دعي فلم يجب فقد عصى الله ورسوله، ومن دخل على غير دعوة دخل سارقاً وخرج مغيراً»، وترد شهادة الطفيلي إن تكرر منه ذلك لدناءته وقلة مروءته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5306} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5307} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5308}"
  en: "Tatfful is entering another person's place to eat his food without his leave or knowledge of his consent, or with consent presumed by a sound sign. It is forbidden for the Malikis, Shafiis and Hanbalis, and makes a person a sinner if repeated, on the hadith «whoever is invited and does not come has disobeyed God and His messenger, and whoever enters uninvited enters as a thief and leaves as a plunderer». The testimony of a habitual uninvited guest is rejected, because it is base and lacking in manliness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5306} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5307} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5308}"
