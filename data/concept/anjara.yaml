  ar: "أنجرة"
  en: "Anjara (a pungent seed plant)"
  fr: "Anjara (plante à graine âcre)"
  ur: "انجرہ"
summary:
  ar: "أنجرة نبات بزره حريف محرق، يُنقّي الصدر ويزيل الربو وذات الجنب، وينفع من أورام خلف الأذنين والرعاف؛ ويذكر الكتاب أنه يدرّ الطمث، وهذا ما ورد فيه لا توصية به {cite:canon-ibn-sina-print-v1 p.365} {cite:canon-ibn-sina-print-v1 p.366}."
  en: "Anjara is a plant with a pungent, burning seed. It cleanses the chest, removes asthma and pleurisy, and helps swellings behind the ears and nosebleed. The book also says it brings on menses; this is the book's listing, not a recommendation {cite:canon-ibn-sina-print-v1 p.365} {cite:canon-ibn-sina-print-v1 p.366}."
  fr: "L’anjara est une plante à graine âcre et brûlante. Selon le livre, elle nettoie la poitrine, dissipe l’asthme et la pleurésie et soulage les enflures derrière les oreilles et les saignements de nez. Le livre lui attribue aussi la faculté de déclencher les règles ; il s’agit d’une mention du livre, non d’une recommandation {cite:canon-ibn-sina-print-v1 p.365} {cite:canon-ibn-sina-print-v1 p.366}."
  ur: "انجرہ ایک ایسا پودا ہے جس کا تیز اور جلانے والا بیج ہے؛ یہ سینہ صاف کرتا، دمہ اور ذات الجنب دور کرتا، کان کے پیچھے کی سوجن اور نکسیر میں مفید ہے۔ کتاب میں لکھا ہے کہ یہ حیض جاری کرتا ہے؛ یہ کتاب کی فہرست ہے، کوئی سفارش نہیں {cite:canon-ibn-sina-print-v1 p.365} {cite:canon-ibn-sina-print-v1 p.366}۔"
