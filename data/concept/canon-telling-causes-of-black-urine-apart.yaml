id: concept/canon-telling-causes-of-black-urine-apart
class: concept
kind: scientific
label: { ar: "التمييز بين أسباب البول الأسود عند ابن سينا", en: "Telling the causes of black urine apart in the Canon", ur: "سیاہ پیشاب کے اسباب میں فرق قانون میں", es: "Distinguir las causas de la orina negra en el Canon", fr: "Distinguer les causes de l'urine noire dans le Canon", tr: "İbn Sina'ya göre siyah idrarın nedenlerinin ayırt edilmesi", id: "Membedakan penyebab urin hitam menurut Avicenna" }
summary:
  ar: "يبين ابن سينا كيف يستدل على أن السواد من احتراق أو برد أو سقوط قوة أو بحران، بما تقدمه من بول وبحال الثفل وبالرائحة وبما يعقبه {cite:canon-ibn-sina-print-v1 p.186}."
  en: "Ibn Sina shows how to tell whether blackness comes from burning, cold, collapse of strength or a crisis, by the urine that went before, the state of the sediment, the smell and what follows {cite:canon-ibn-sina-print-v1 p.186}."
  es: "Ibn Sina muestra cómo determinar si la oscuridad proviene de quemaduras, frío, colapso de la fuerza o una crisis, por la orina que la precedió, el estado del sedimento, el olor y lo que sigue {cite:canon-ibn-sina-print-v1 p.186}."
  fr: "Ibn Sina montre comment déterminer si la noirceur provient d'une brûlure, du froid, d'un effondrement de force ou d'une crise, par l'urine qui a précédé, l'état du sédiment, l'odeur et ce qui suit {cite:canon-ibn-sina-print-v1 p.186}."
  ur: "ابن سینا بتاتا ہے کہ کالا پن جلنے، سردی، طاقت کے گرنے سے یا بحران سے آتا ہے، پیشاب سے پہلے، تلچھٹ کی حالت، بدبو اور اس کے بعد کیا ہوتا ہے {cite:canon-ibn-sina-print-v1 p.186}۔"
  tr: "İbn Sina, siyahın yanma, soğuk, düşen kuvvet veya denizler, idrar, narın durumu, koku ve aşağıda olanları nasıl çıkarabileceğini açıklar {cite:canon-ibn-sina-print-v1 s.186}."
  id: "Ibn Sina menjelaskan bagaimana menyimpulkan bahwa kegelapan disebabkan oleh terbakar, dingin, gaya jatuh, atau laut, oleh urin, keadaan delima, bau, dan apa yang terjadi selanjutnya {cite:canon-ibn-sina-print-v1 hlm.186}."
