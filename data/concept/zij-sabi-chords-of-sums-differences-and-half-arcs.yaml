label: { ar: "أوتار مجموع القوسين وفضلهما ونصف القوس في الزيج الصابي", en: "Chords of the sum, difference and half of arcs", ur: "دو قوسوں کے مجموع، فرق اور نصف قوس کے اوتار" }
summary:
  ar: "يبين البتاني أن وتر القوس التي هي فضل قوسين معلومتي الوتر معلوم، وأن وتر نصف كل قوس معلومة الوتر معلوم، وأن وتر القوس المجموعة من قوسين معلومتين معلوم، بقواعد تعتمد على ضرب الأوتار بعضها في بعض وفي ما يبقى لتمام نصف الدائرة وعلى القسمة على القطر والجذور، ويخلص إلى أن جميع الأوتار المعلومة في نصف الدائرة تخرج بهذه الجهات. {cite:zij-sabi-nallino-byblion p.18}."
  en: "Al-Battani shows that the chord of the arc which is the difference of two arcs of known chord is known, that the chord of half of any arc of known chord is known, and that the chord of the arc composed of two known arcs is known, by rules that rest on multiplying chords by one another and by what remains to the semicircle, on division by the diameter and on roots; and he concludes that all the known chords of the semicircle come out by these ways. {cite:zij-sabi-nallino-byblion p.18}."
  ur: "البتانی دکھاتے ہیں کہ دو ایسی قوسوں کے فرق کا وتر جن کے وتر معلوم ہوں معلوم ہے، معلوم وتر والی ہر قوس کے نصف کا وتر معلوم ہے، اور دو معلوم قوسوں کے مجموعے کا وتر معلوم ہے؛ یہ قواعد اوتار کو ایک دوسرے میں اور نصف دائرے کی تکمیل کی باقی قوسوں کے اوتار میں ضرب، قطر پر قسمت اور جذور پر مبنی ہیں؛ اور وہ نتیجہ نکالتے ہیں کہ نصف دائرے کے تمام معلوم اوتار انہی طریقوں سے نکلتے ہیں۔ {cite:zij-sabi-nallino-byblion p.18}۔"
