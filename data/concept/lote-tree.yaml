summary:
  ar: "سدرة المنتهى عندها جنة المأوى وإليها انتهى الراجحون ليلة المعراج، وفي الجنة سدر مخضود، ولما أهلّت سبأ بأهلها السوء بدّلهم الله بجنتيهم جنتين ذواتي أكل خمط وأثل وشيء من سدر قليل."
  en: "The Lote Tree of the Furthest Bound beside which is the Garden of Refuge, where the Night Journey reached its limit; in Paradise the lote is thornless, and when Sheba's people turned away God gave them in exchange for their two gardens gardens of bitter fruit, tamarisk and a few lote trees."
  ur: "سدرۃ المنتہیٰ جس کے کنارے جنت الماوٰی ہے جہاں شبِ معراج ختم ہوئی؛ جنت میں بیری بے کانٹے ہے اور جب سبا کے لوگوں نے منہ موڑا تو اللہ نے ان کے دو باغوں کے بدلے کڑوے پھل، جھاؤ اور کچھ بیری کے باغ دیے۔"
