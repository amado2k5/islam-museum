id: concept/idla-fiqh
class: concept
kind: legal
label:
  ar: "إدلاء"
  en: "Idla (connection by descent: the ranking of heirs and custodians by the line that links them)"
  ur: "ادلاء (نسب کے ذریعے تعلق، وراثت اور حضانت میں ترتیب)"
summary:
  ar: "الإدلاء في اللغة إرسال الدلو في البئر، ثم استعير لكل إرسال، ويستعمله الفقهاء غالبا في الإرث والحضانة بمعنى الصلة بالنسب التي تصل الإنسان بالميت أو بالمحضون، فيقدم من يدلي بنفسه على من يدلي بغيره، ومن يدلي بجهتين على من يدلي بجهة واحدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2004}"
  en: "Idla literally means lowering a bucket into a well, and was then used for any sending down. The jurists use it mostly in inheritance and custody for the tie of descent that links a person to the deceased or the child in custody. Someone who connects directly is preferred over one who connects through another, and one who connects by two lines over one who connects by a single line. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2004}"
  ur: "ادلاء لغت میں کنویں میں ڈول اتارنے کو کہتے ہیں، پھر ہر اتارنے کے لیے استعمال ہونے لگا۔ فقہاء اسے زیادہ تر وراثت اور حضانت میں اس نسبی تعلق کے لیے بولتے ہیں جو آدمی کو میت یا زیرِ حضانت بچے سے جوڑتا ہے۔ جو براہِ راست تعلق رکھے وہ اس پر مقدم ہے جو کسی اور کے واسطے سے تعلق رکھے، اور جو دو جہتوں سے تعلق رکھے وہ اس پر مقدم ہے جو ایک جہت سے رکھے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2004}"
