id: concept/allusion-to-proposal-in-iddah
class: concept
kind: legal
label:
  ar: "التعريض بالخطبة في العدة"
  en: "Allusion to a proposal during the waiting period"
  ur: "عدت کے دوران اشارے سے نکاح کی بات"
summary:
  ar: "يقرر الشعراوي في تفسير آية 235 أن التعريض بالخطبة للمعتدّة جائز، وأن التصريح والمواعدة سراً ممنوعان، وأن عقدة النكاح لا تُعزم إلا بعد انتهاء العدة، فتمر بثلاث مراحل: التعريض، ثم العزم، ثم العقد {cite:tafsir-sharawi-khawatir-scan p.1012} {cite:tafsir-sharawi-khawatir-scan p.1013} {cite:tafsir-sharawi-khawatir-scan p.1014}."
  en: "In his commentary on verse 235, Sha'rawi holds that allusion to a proposal to a woman in her waiting period is allowed, while open declaration and a secret promise are forbidden, and that the firm resolve to marry may not be made until the waiting period ends. He reads the contract as passing through three stages: allusion, resolve, and the contract {cite:tafsir-sharawi-khawatir-scan p.1012} {cite:tafsir-sharawi-khawatir-scan p.1013} {cite:tafsir-sharawi-khawatir-scan p.1014}."
  ur: "آیت 235 کی تفسیر میں شعراوی کہتے ہیں کہ عدت میں عورت سے اشارے کنایے میں نکاح کی بات جائز ہے، جبکہ کھلا اقرار اور خفیہ وعدہ منع ہے، اور عدت ختم ہونے تک نکاح کا پختہ ارادہ نہیں کیا جا سکتا۔ وہ نکاح کے تین مراحل بیان کرتے ہیں: اشارہ، ارادہ، اور پھر نکاح {cite:tafsir-sharawi-khawatir-scan p.1012} {cite:tafsir-sharawi-khawatir-scan p.1013} {cite:tafsir-sharawi-khawatir-scan p.1014}."
issue:
  ar: "ما حدّ التعريض الجائز للمعتدّة، وما الذي يتأخر حتى تنتهي العدة؟"
  en: "Where is the line between permitted allusion and forbidden declaration to a woman in her waiting period, and what must wait until it ends?"
  ur: "عدت میں عورت سے جائز اشارے اور ممنوع اعلان کے درمیان حد کیا ہے، اور عدت ختم ہونے تک کیا موخر رکھنا ہے؟"
