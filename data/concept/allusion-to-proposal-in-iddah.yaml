  - tradition: sunni
    id: sunni-sharawi-three-stages
    stance: { ar: "التعريض جائز، والعزم والعقد بعد انتهاء العدة", en: "Allusion is allowed; resolve and the contract come after the waiting period ends", ur: "اشارہ جائز ہے؛ ارادہ اور نکاح عدت ختم ہونے کے بعد" }
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يرى الشعراوي أن التعريض يُعرّف المطلقة برأي الخاطب فلا توافق عليه مباشرة، وأن المواعدة سراً ممنوعة، وأن العزم لا يصح إلا بعد انتهاء العدة، ويجعل ذلك فرصة للتراجع {cite:tafsir-sharawi-khawatir-scan p.1013} {cite:tafsir-sharawi-khawatir-scan p.1014}."
      en: "Sha'rawi holds that allusion lets the divorced woman learn the suitor's intent so she does not accept him at once, that a secret promise is forbidden, and that resolve is valid only after the waiting period, which gives each side room to withdraw {cite:tafsir-sharawi-khawatir-scan p.1013} {cite:tafsir-sharawi-khawatir-scan p.1014}."
