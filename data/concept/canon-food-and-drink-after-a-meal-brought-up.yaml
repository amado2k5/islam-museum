id: concept/canon-food-and-drink-after-a-meal-brought-up
class: concept
kind: scientific
label:
  ar: "الأكل والشرب بعد طعام أُكل للقيء عند ابن سينا"
  en: "Food and drink after a meal eaten to be brought up"
  fr: "Aliments et boissons après repas destiné à être vomi"
  ur: "قانون میں قے کے لیے کھائی گئی غذا کے بعد کھانا پینا"
  es: "Comida y bebida después de una comida que se toma para ser llevada"
  tr: "İbn Sina'ya göre yemekten sonra yeme ve içme, kusma için yemek"
  id: "Makan dan minum setelah makan, makan untuk muntah menurut Ibn Sina"
summary:
  ar: "يوصي ابن سينا من تقيأ بعد طعام أكله للقيء أن يؤخر الأكل إلى أن يشتد الجوع، وأن يسكن عطشه بشراب التفاح لا بالجلاب والسكنجبين، وأن يكون غذاؤه فروج كردناج، وأن يؤخر الغداء إلى نصف النهار إذا قذف حامضاً {cite:canon-ibn-sina-print-v1 pp.285-286}."
  en: "Ibn Sina advises one who has vomited after a meal eaten for the purpose to hold back from food until hunger is strong, to quench thirst with apple drink rather than julep or oxymel, to eat young chicken, and, if he has brought up something sour, to put off his meal until midday {cite:canon-ibn-sina-print-v1 pp.285-286}."
  fr: "Ibn Sina conseille d’attendre une faim vive après vomissement d’un repas pris à cette fin, de calmer la soif par boisson de pomme plutôt que julep ou oxymel, de manger du jeune poulet ; après rejet acide, d’attendre midi {cite:canon-ibn-sina-print-v1 pp.285-286}."
  es: "Ibn Sina aconseja a quien haya vomitado después de una comida ingerida con ese propósito que se abstenga de comer hasta que tenga mucha hambre, que calme la sed con agua de manzana en lugar de julepe u oxímel, que coma pollo joven y, si ha vomitado algo agrio, que posponga su comida hasta el mediodía {cite:canon-ibn-sina-print-v1 pp.285-286}."
  ur: "ابن سینا کھانے کے بعد قے کرنے والے شخص کو مشورہ دیتے ہیں کہ وہ کھانے سے اس وقت تک باز رہے جب تک کہ بھوک نہ لگے، جولپ یا آکسیمل کے بجائے سیب کے مشروب سے پیاس بجھائے، مرغی کا چھوٹا گوشت کھائے، اور اگر اس نے کوئی کھٹی چیز لائی ہو تو دوپہر تک کھانا ترک کر دے۔ صفحہ 285-286}۔"
  tr: "İbn Sina, yemekten sonra kusmaya başlayanların açlık artana kadar yemeyi ertelemelerini, susuzluklarını jellab ve sangjibin yerine elma şurubu ile gidermelerini, tavuk gibi ekşi diş gibi yemelerini ve asit alsalar öğle yemeğini öğlene kadar ertelemelerini önerir. {cite:canon-ibn-sina-print-v1 s.285-286}."
  id: "Ibn Sina menyarankan agar mereka yang muntah setelah makan untuk muntah harus menunda makan sampai rasa lapar semakin kuat, menghilangkan dahaga dengan sirup apel daripada jellab dan sangjibin, makan ayam seperti gigi asam, dan menunda makan siang hingga tengah hari jika mereka mengeluarkan asam. {cite:canon-ibn-sina-print-v1 hlm.285-286}."
