id: concept/canon-food-and-drink-after-a-meal-brought-up
class: concept
kind: scientific
label: { ar: "الأكل والشرب بعد طعام أُكل للقيء عند ابن سينا", en: "Food and drink after a meal eaten to be brought up", ur: "قانون میں قے کے لیے کھائی گئی غذا کے بعد کھانا پینا" }
summary:
  ar: "يوصي ابن سينا من تقيأ بعد طعام أكله للقيء أن يؤخر الأكل إلى أن يشتد الجوع، وأن يسكن عطشه بشراب التفاح لا بالجلاب والسكنجبين، وأن يكون غذاؤه فروج كردناج، وأن يؤخر الغداء إلى نصف النهار إذا قذف حامضاً {cite:canon-ibn-sina-print-v1 pp.285-286}."
  en: "Ibn Sina advises one who has vomited after a meal eaten for the purpose to hold back from food until hunger is strong, to quench thirst with apple drink rather than julep or oxymel, to eat young chicken, and, if he has brought up something sour, to put off his meal until midday {cite:canon-ibn-sina-print-v1 pp.285-286}."
