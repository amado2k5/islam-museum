label:
  ar: "العربية في ليبيا"
  en: "Arabic in Libya"
  ur: "لیبیا میں عربی"
  fr: "L'arabe en Libye"
  es: "El árabe en Libia"
  tr: "Libya'da Arapça"
  id: "Bahasa Arab di Libya"
summary:
  ar: "مكانة العربية في ليبيا كما تقولها دائرة المعارف البريطانية وكتاب حقائق العالم: لغة رسمية يتكلمها كل الليبيين تقريباً، ونسبهم إلى بني هلال وبني سليم كما تروي الموسوعة، والأمازيغية في مواضع محدودة وأبرزها النفوسية، والإنجليزية والإيطالية مفهومتان في المدن. ولا تقول الصفحتان شيئاً عن تصنيف اللهجة. وأُضيف نص الحكم الدستوري بلغته الأصلية كما ورد في ملخص بحثي لم يتحقق المتحف منه على الصفحة."
  en: "The place of Arabic in Libya as the Encyclopaedia Britannica and The World Factbook state it: the official language spoken by almost all Libyans, who claim descent from the Banu Hilal and Banu Sulaym as the encyclopedia tells it; Amazigh in limited places, Nafusi above all; English and Italian understood in the cities. The pages say nothing on the classification of the dialect. The constitutional text is added in its original wording, as supplied in a research summary that the museum did not check against the page."
  ur: "لیبیا میں عربی کا مقام جیسا انسائیکلوپیڈیا برٹانیکا اور ورلڈ فیکٹ بک بیان کرتی ہیں: سرکاری زبان جو تقریباً سب لیبیائی بولتے ہیں، جو بنو ہلال اور بنو سلیم سے نسبت کا دعویٰ کرتے ہیں جیسا برٹانیکا بیان کرتی ہے؛ محدود مقامات پر امازیغی، خاص طور پر نفوسی؛ اور شہروں میں انگریزی اور اطالوی کی سمجھ۔ دونوں صفحات لہجے کی درجہ بندی کے بارے میں کچھ نہیں کہتے۔ آئینی حکم کی عبارت اصل زبان میں شامل کی گئی ہے، جیسی ایک تحقیقی خلاصے میں ملی جسے متحف نے صفحے سے نہیں جانچا۔"
  fr: "La place de l'arabe en Libye selon l'Encyclopaedia Britannica et The World Factbook : langue officielle parlée par presque tous les Libyens, qui revendiquent une descendance des Banu Hilal et des Banu Sulaym selon l'encyclopédie ; l'amazigh en des lieux limités, le nafusi surtout ; l'anglais et l'italien compris dans les villes. Les pages ne disent rien du classement du dialecte. Le texte constitutionnel est ajouté dans sa langue d'origine, tel que fourni par un résumé de recherche que le musée n'a pas vérifié sur la page."
  es: "El lugar del árabe en Libia según la Encyclopaedia Britannica y The World Factbook: lengua oficial hablada por casi todos los libios, que reivindican descender de los Banu Hilal y los Banu Sulaym según la enciclopedia; el amazigh en lugares limitados, sobre todo el nafusi; el inglés y el italiano comprendidos en las ciudades. Las páginas no dicen nada de la clasificación del dialecto. Se añade el texto constitucional en su lengua original, tal como lo entrega un resumen de investigación que el museo no verificó en la página."
  tr: "Arapçanın Libya'daki statüsü, İngiliz Ansiklopedisi ve Dünya Gerçekler Kitabı'nda belirtildiği şekliyle: neredeyse tüm Libyalılar tarafından konuşulan resmi bir dildir ve ansiklopedide anlatılan Banu Hilal ve Banu Sulaym'a olan soyları, sınırlı yerlerde, özellikle Nafousiyah olmak üzere Amazigh ile şehirlerde İngilizce ve İtalyanca anlaşılmaktadır. İki sayfa lehçenin sınıflandırılması hakkında hiçbir şey söylemiyor. Anayasa kararının metnini, müzenin sayfada doğrulamadığı bir araştırma özetinde belirtildiği üzere orijinal diliyle ekledim."
  id: "Status bahasa Arab di Libya, sebagaimana dinyatakan dalam British Encyclopedia dan Book of World Facts: bahasa ini adalah bahasa resmi yang digunakan oleh hampir semua orang Libya, dan garis keturunan Banu Hilal dan Banu Sulaym yang dijelaskan dalam ensiklopedia dipahami dalam bahasa Inggris dan Italia di beberapa tempat, terutama di kota-kota Nafousiyah dan Amazigh. Dialek dua halaman tidak membahas klasifikasinya. Saya menambahkan teks keputusan konstitusional dalam bahasa aslinya, sebagaimana tercantum dalam ringkasan penelitian yang tidak diverifikasi oleh museum di halaman tersebut."
