summary:
  ar: "الرياء في الاصطلاح الشرعي إظهار العمل ليراه الناس؛ تعده الموسوعة الفقهية الكويتية من القلبيات المحرمة مع الحقد والحسد والكبر والعجب {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  en: "Riya in the legal-religious terminology is displaying one's deeds to be seen by people; the Kuwaiti Fiqh Encyclopedia counts it among the forbidden inward acts with malice, envy, pride and self-admiration {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  es: "Riya, en la terminología jurídico-religiosa, es exhibir las propias acciones para que sean vistas por los demás; la Enciclopedia Fiqh de Kuwait la incluye entre los actos internos prohibidos con malicia, envidia, orgullo y autoadmiración {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  fr: "Riya, dans la terminologie juridico-religieuse, consiste à exhiber ses actes aux yeux des autres; l'Encyclopédie Fiqh koweïtienne le compte parmi les actes intérieurs interdits avec la malice, l'envie, l'orgueil et l'admiration de soi {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  ur: "ریا قانونی اور مذہبی اصطلاح میں کسی کے اعمال کو ظاہر کرنا ہے جو لوگوں کو نظر آئے۔ کویتی فقہ انسائیکلو پیڈیا اسے بغض، حسد، غرور اور خود پسندی کے حرام باطنی اعمال میں شمار کرتا ہے۔"
  tr: "İslami terminolojide, birinin eylemini göstermek insanların tarafından görülmesi anlamına gelir; Kuveyt Fıkıh Ansiklopedisi bunu nefret, kıskançlık, kibir ve hayranlıkla yasak bir eylem olarak kabul eder {atıf:fiqh-mawsua-kuwaitiyya-noor-v3}."
  id: "Dalam istilah Islam, memamerkan perbuatan seseorang harus dilihat oleh orang-orang; Ensiklopedia Yurisprudensial Kuwait menganggapnya sebagai tindakan terlarang dengan kebencian, iri hati, kesombongan, dan keajaiban {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
