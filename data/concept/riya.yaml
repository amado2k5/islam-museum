label: { ar: "الرياء", en: "Ostentation (riya')" }
summary:
  ar: "الرياء أن يُقصد بالعمل وجه الناس لا وجه الله. يورد الصلابي عن علي بن أبي طالب قوله: «لا تعمل شيئًا من الخير رياءً، ولا تتركه حياءً»، وذكر له ثلاث علامات: الكسل إذا كان وحده، والنشاط إذا كان بين الناس، والزيادة في العمل إذا أُثني عليه {cite:sallabi-ali-vol1 p. 261}. ويذكر الكتاب حديث «الشرك الأصغر» في الرياء {cite:sallabi-ali-vol1 p. 261}، ويعدّد صور الرياء بالعمل والقول والزي والصحبة والبدن {cite:sallabi-ali-vol1 p. 262}."
  en: "Ostentation is doing a deed to be seen by people rather than for God. Al-Sallabi quotes Ali: do no good for show and do not leave it for shame, and gives three signs of the show-off (lazy alone, active before people, more eager when praised) {cite:sallabi-ali-vol1 p. 261}."
