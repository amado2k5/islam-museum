id: concept/ilaj-fasad-al-dhikr
class: concept
kind: scientific
label:
  ar: "علاج فساد الذكر"
  en: "Treatment of corruption of memory"
  ur: "یاد کے بگاڑ کا علاج"
  es: "Tratamiento de la corrupción de la memoria"
  fr: "Traitement de la corruption de la mémoire"
summary:
  ar: "يذكر ابن سينا مبادئ علاج فساد الذكر بحسب سببه: الغذاء المرطب من اليبس، والاستفراغ بعد الإنضاج مع التدرج في التجفيف من المادة الباردة الرطبة، وأن يُجتنب ما يضر الروح الحاس، ويحيل الورم إلى علاج قرانيطس وليثرغس والسبات السهري؛ ولا تُنقل الوصفات ولا طرق الاستعمال {cite:canon-ibn-sina-print-v2 p.99} {cite:canon-ibn-sina-print-v2 p.100}"
  en: "Ibn Sina gives the principles of treating corruption of memory by its cause: moistening food for dryness; for the cold moist matter, evacuation after ripening and gradual drying; avoiding what harms the sensing spirit; and, for a swelling, the treatment of qaranitus, lithargus and the sleepless coma; recipes and methods of application are not reproduced {cite:canon-ibn-sina-print-v2 p.99} {cite:canon-ibn-sina-print-v2 p.100}"
  ur: "ابن سینا یاد کے بگاڑ کے علاج کے اصول سبب کے مطابق بتاتا ہے: خشکی میں تر کرنے والی غذا؛ ٹھنڈے تر مادے میں پکانے کے بعد استفراغ اور آہستہ آہستہ خشک کرنا؛ اس سے بچنا جو حس والی روح کو نقصان دے؛ اور سوجن میں قرانیطس، لیثرغس اور جاگتی غنودگی کا علاج؛ نسخے اور استعمال کے طریقے نقل نہیں کیے گئے {cite:canon-ibn-sina-print-v2 p.99} {cite:canon-ibn-sina-print-v2 p.100}۔"
  es: "Ibn Sina expone los principios para tratar la corrupción de la memoria según su causa: humedecer los alimentos para la sequedad; para la materia fría y húmeda, evacuación después de la maduración y secado gradual; evitar lo que daña el espíritu sensitivo; y, para la hinchazón, el tratamiento de qaranitus, litargus y el coma insomne; las recetas y los métodos de aplicación no se reproducen {cite:canon-ibn-sina-print-v2 p.99} {cite:canon-ibn-sina-print-v2 p.100}"
  fr: "Ibn Sina expose les principes du traitement des troubles de la mémoire en s'appuyant sur leur cause: humidifier les aliments en cas de sécheresse; pour les matières humides et froides, procéder à l'évacuation après maturation et séchage progressif; éviter ce qui nuit à l'esprit sensible; et, en cas d'œdème, traiter la qaranitus, la lithargie et le coma insomniaque. Les recettes et les modes d'application ne sont pas reproduits. {cite:canon-ibn-sina-print-v2 p.99} {cite:canon-ibn-sina-print-v2 p.100}"
