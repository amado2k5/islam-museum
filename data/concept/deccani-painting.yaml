summary:
  ar: "مدارس التصوير في سلطنات الدكن ⁦(أحمدنگر وبيجاپور وگولكنده)⁩ في القرنين السادس عشر والسابع عشر، ثم في حيدرآباد والأقاليم، تجمع الإرث التركماني الإيراني إلى الحس الجنوبي الهندي {cite:zebrowski-deccani-painting-1983 p. 7} {cite:zebrowski-deccani-painting-1983 p. 11}."
  en: "The schools of painting of the Deccan sultanates (Ahmadnagar, Bijapur, Golconda) in the sixteenth and seventeenth centuries, and later of Hyderabad and the provinces, joining a Turkman-Iranian heritage to South Indian sensibility {cite:zebrowski-deccani-painting-1983 p. 7} {cite:zebrowski-deccani-painting-1983 p. 11}."
  ur: "دکنی سلطنتوں ⁦(احمد نگر، بیجاپور، گولکنڈہ)⁩ کی سولہویں اور سترہویں صدی کی، اور بعد میں حیدرآباد اور صوبوں کی، مصوری کے مکاتب، جو ترکمانی ایرانی ورثے کو جنوبی ہندوستانی حس سے ملاتے ہیں {cite:zebrowski-deccani-painting-1983 p. 7} {cite:zebrowski-deccani-painting-1983 p. 11}۔"
  es: "Las escuelas de pintura de los sultanatos del Deccan (Ahmadnagar, Bijapur, Golconda) en los siglos XVI y XVII, y posteriormente de Hyderabad y las provincias, uniendo una herencia turcomana-iraní a la sensibilidad del sur de la India {cite:zebrowski-deccani-painting-1983 p. 7} {cite:zebrowski-deccani-painting-1983 p. 11}."
  fr: "Les écoles de peinture des sultanats du Deccan (Ahmadnagar, Bijapur, Golconde) aux XVIe et XVIIe siècles, puis d'Hyderabad et des provinces, unissant un héritage turkmène-iranien à la sensibilité sud-indienne {cite:zebrowski-deccani-painting-1983 p. 7} {cite:zebrowski-deccani-painting-1983 p. 11}."
  tr: "16. ve 17. yüzyıllarda Dekkan Sultanlığı'ndaki (Ahmednagar, Bijapur ve Golconda) resim okulları, ardından Haydarabad ve eyaletlerde, Türkmen İran mirasını Güney Hindistan duyarlılığıyla birleştirmiştir {cite:zebrowski-deccani-painting-1983 s. 7} {cite:zebrowski-deccani-painting-1983 s. 11}."
  id: "Sekolah lukisan di Kesultanan Deccan (Ahmednagar, Bijapur, dan Golconda) pada abad ke-16 dan ke-17, kemudian di Hyderabad dan provinsi-provinsi, menggabungkan warisan Iran Turkmen dengan kepekaan India Selatan {cite:zebrowski-deccani-painting-1983 hlm. 7} {cite:zebrowski-deccani-painting-1983 hlm. 11}."
