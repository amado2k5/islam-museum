id: concept/zij-sabi-the-cyclic-quadrilateral-for-distances-between-stars
class: concept
kind: scientific
label: { ar: "الشكل الرباعي في الدائرة وأبعاد الكواكب", en: "The cyclic quadrilateral behind the distance between stars", ur: "ستاروں کے درمیان فاصلوں کے پیچھے دائرے کا چوکور", es: "El cuadrilátero cíclico detrás de la distancia entre las estrellas", fr: "Le quadrilatère cyclique à l'origine de la distance entre les étoiles", tr: "Daire içindeki dörtgen şekil ve gezegenlerin boyutları", id: "Bentuk segi empat di dalam lingkaran dan dimensi planet-planet" }
summary:
  ar: "يبدأ الباب السادس والعشرون بمعرفة أبعاد ما بين الكواكب في ريها في الفلك ومواضع بعضها من بعض، وبه يُعلم بعد القمر عن الشمس على الحقيقة بحسب عرض القمر. ويتقدم ذلك ببرهان هندسي: كل ذي أربعة أضلاع يقع في دائرة، فضرب كل ضلعين متقابلين من أضلاعه أحدهما في الآخر إذا جُمع كان مساوياً لضرب أحد قطريه في الآخر. {cite:zij-sabi-nallino-byblion p.61}."
  en: "Chapter 26 begins with finding the distances between the stars as they appear in the sphere and the places of one to another, by which the true distance of the Moon from the Sun is known according to the Moon's latitude. It is preceded by a geometrical proof: in every four-sided figure inscribed in a circle, the products of the two pairs of opposite sides, added together, equal the product of one diagonal by the other. {cite:zij-sabi-nallino-byblion p.61}."
  ur: "چھبیسواں باب ستاروں کے درمیان فلک میں ان کے ظاہر ہونے کے لحاظ سے فاصلوں اور ایک کے دوسرے سے مقام کی پہچان سے شروع ہوتا ہے، جس سے چاند کے عرض کے لحاظ سے سورج سے چاند کا حقیقی بعد معلوم ہوتا ہے۔ اس سے پہلے ایک ہندسی برہان آتی ہے: ہر وہ چوضلعی شکل جو دائرے میں واقع ہو، اس کے متقابل ضلعوں کے دونوں جوڑوں کے حاصلِ ضرب کا مجموعہ اس کے ایک قطر کو دوسرے سے ضرب دینے کے برابر ہوتا ہے۔ {cite:zij-sabi-nallino-byblion p.61}۔"
  es: "El capítulo 26 comienza con el cálculo de las distancias entre las estrellas tal como aparecen en la esfera y sus posiciones relativas, lo que permite conocer la distancia real de la Luna al Sol según su latitud. Precedido por una demostración geométrica: en toda figura de cuatro lados inscrita en un círculo, la suma de los productos de los dos pares de lados opuestos es igual al producto de una diagonal por la otra. {cite:zij-sabi-nallino-byblion p.61}."
  fr: "Le chapitre 26 commence par le calcul des distances entre les étoiles telles qu'elles apparaissent sur la sphère et de leurs positions respectives, ce qui permet de connaître la distance réelle de la Lune au Soleil en fonction de sa latitude. Il est précédé d'une démonstration géométrique: dans tout quadrilatère inscrit dans un cercle, la somme des produits des côtés opposés de deux paires de côtés est égale au produit d'une diagonale par l'autre. {cite:zij-sabi-nallino-byblion p.61}."
  tr: "26. Bölüm, gökyüzündeki yörüngelerinde bulunan gezegenler arasındaki mesafeleri ve birbirlerine göre konumlarını belirleyerek başlar. Buradan, Ay'ın Güneş'e olan gerçek uzaklığı, Ay'ın enlemine bağlı olarak belirlenebilir. Bundan önce geometrik bir ispat yer alır: dört kenarlı herhangi bir cisim bir çember üzerinde bulunur ve iki karşı kenarının çarpımının toplamı, köşegenlerinden birinin çarpımına eşittir. {cite:zij-sabi-nallino-byblion s.61}."
  id: "Bab 26 dimulai dengan menentukan jarak antar planet dalam orbitnya di langit dan posisi relatifnya satu sama lain. Dari sini, jarak sebenarnya bulan dari matahari dapat ditentukan berdasarkan garis lintang bulan. Hal ini didahului oleh bukti geometris: setiap objek bersisi empat terletak di dalam lingkaran, dan jumlah hasil perkalian dua sisi yang berlawanan sama dengan hasil perkalian salah satu diagonalnya. {cite:zij-sabi-nallino-byblion p.61}."
