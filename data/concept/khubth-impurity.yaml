label: { ar: "الخبث", en: "Khubth (impurity; its removal)", ur: "خبث" }
summary:
  ar: "الخَبَث لغة كل ما يكره رداءة وخسّة محسوسا أو معقولا، واصطلاحا عين النجاسة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7535} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7536} ويفرق عن الرجس بأنه النتن والقذر، وعن الدنس بأنه الوسخ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7536} واتفق الفقهاء على الأمر بإزالة الخبث، واختلفوا في وجوبه؛ فالحنفية والشافعية والحنابلة يجعلون إزالة الخبث شرطا لصحة الصلاة إلا ما عُفي عنه، والمالكية في ذلك قولان: سنة أو واجب عند الذكر والقدرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7536} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7537} وأجمع الفقهاء على أربعة أعيان من الخبث: ميتة ما له دم من غير المائي، ولحم الخنزير، والدم المسفوح، وبول ابن آدم ورجيعه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7537} "
  en: "Khabath (impurity) lexically is whatever is disliked for baseness, sensible or not; technically it is the very substance of impurity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7535} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7536} It is distinguished from rijs (filth) and dans (dirt). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7536} The jurists agree that removing impurity is commanded and differ on whether it is obligatory; the Hanafis, Shafiis and Hanbalis make its removal a condition of valid prayer except what is excused, while the Malikis have two views, sunna or obligation when one remembers and is able. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7536} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7537} Four substances are agreed to be impurity: carrion of a land animal with blood, pig flesh, flowing blood, and a man's urine and dung. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7537} "
  ur: "خَبَث لغت میں ہر اس چیز کو کہتے ہیں جو پستی یا کمینگی کی بنا پر ناپسندیدہ ہو، خواہ محسوس ہو یا معقول؛ اصطلاح میں یہ نجاست کی عین ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7535} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7536} یہ رجس (گندگی) اور دنس (میل) سے ممتاز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7536} خبث کو زائل کرنے کے حکم پر فقہاء متفق ہیں، اور وجوب میں اختلاف ہے؛ حنفیہ، شافعیہ اور حنابلہ اسے نماز کی صحت کی شرط مانتے ہیں سوائے معاف چیز کے، اور مالکیہ کے دو قول ہیں: سنت یا یاد اور قدرت کی صورت میں واجب۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7536} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7537} چار اعیان کو بالاتفاق خبث مانا گیا ہے: خشکی کے خون والے جانور کا مردار، خنزیر کا گوشت، بہنے والا خون، اور آدمی کا پیشاب و پاخانہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7537} "
