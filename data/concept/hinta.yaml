label:
  ar: "الحنطة"
  en: "Wheat (hinta)"
  ur: "گندم ⁦(حنطہ)⁩"
  es: "Trigo (hinta)"
  fr: "Blé (hinta)"
summary:
  ar: "الحنطة معتدلة الحرارة والرطوبة واليبوسة وسويقها إلى اليبس؛ أجودها المتوسطة الصلابة الحديثة الملساء بين الحمراء والبيضاء، وفيها غذاء وتنقية للوجه، ومنها الحنطة المسلوقة والهريسة التي تولّد الدود، وتُذكر لها منافع في الحرق والعضة."
  en: "Wheat is moderately warm, moderate in moisture and dryness, and its gruel tends to dryness. The best is medium in hardness, fresh, smooth and between red and white. It nourishes and cleans the face; boiled wheat and harisa are slow to digest, and the book says eaten raw or in harisa they breed worms. It helps burns and dog bites."
  ur: "گندم گرمی اور نمی اور خشکی میں معتدل ہے اور اس کا ستو خشکی کی طرف مائل ہے۔ بہترین وہ ہے جو سختی میں درمیانی، تازہ، ہموار اور سرخ و سفید کے بیچ کی ہو۔ اس میں غذا ہے اور چہرہ صاف کرتی ہے؛ ابلی ہوئی گندم اور ہریسہ ہضم میں دیر لگاتے ہیں، اور کتاب کے مطابق کچی یا ہریسہ کی شکل میں کھانے سے کیڑے پیدا ہوتے ہیں۔ جلنے اور کتے کے کاٹنے میں مفید ہے۔"
  es: "El trigo es moderadamente cálido, con humedad y sequedad moderadas, y su papilla tiende a ser seca. El mejor es de dureza media, fresco, suave y de color entre rojo y blanco. Nutre y limpia el rostro; el trigo hervido y la harisa son de digestión lenta, y el libro dice que consumidos crudos o en harisa provocan lombrices. Ayuda a curar quemaduras y mordeduras de perro."
  fr: "Le blé est moyennement chaud, modérément humide et sec, et sa bouillie a tendance à être sèche. Le meilleur est de fermeté moyenne, frais, lisse et de couleur rouge à blanche. Il nourrit et nettoie le visage; le blé bouilli et le harisa sont longs à digérer, et le livre indique que consommés crus ou dans du harisa, ils favorisent la prolifération des vers. Il soulage les brûlures et les morsures de chien."
