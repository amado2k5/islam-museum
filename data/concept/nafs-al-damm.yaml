label: { ar: "مذاهب الجاهلية في النفوس", en: "Jahiliyya doctrines of the soul", es: "Doctrinas Jahiliyya del alma.", fr: "Doctrines Jahiliyya de l'âme", ur: "روح کے جاہلی عقائد", tr: "Ruhlarda İslam öncesi bilgi doktrinleri", id: "Doktrin pengetahuan pra-Islam dalam jiwa" }
summary:
  ar: "كانت للعرب مذاهب في النفوس وآراء ينازعون في كيفياتها، فمنهم من زعم أن النفس هي الدم لا غير وأن الروح الهواء الذي في باطن جسم المرء، ولذلك سموا المرأة نفساء لما يخرج منها من الدم، ولهذا تنازع فقهاء الأمصار فيما له نفس سائلة إذا سقط في الماء هل ينجسه، وقال تأبط شراً لخاله الشنفرى حين سأله عن قتيل ألجمته عضباً فسالت نفسه سكباً، وقالوا إن الميت لا ينبعث منه الدم ولا يوجد فيه {cite:muruj-al-dhahab p. 467-468}."
  en: "The Arabs' rival accounts of the soul before Islam: for one school the soul is simply the blood and the spirit the air within the body — whence the parturient 'nafsa'' and the jurists' dispute over soul-blooded things falling into water — Ta'abbata Sharran telling his uncle al-Shanfara 'I jammed him with a blade and his soul poured out', since a corpse has no blood to rise {cite:muruj-al-dhahab p. 467-468}."
  es: "Las versiones rivales de los árabes sobre el alma antes del Islam: para una escuela, el alma es simplemente la sangre y el espíritu el aire dentro del cuerpo, de donde proviene la 'nafsa' parturienta y la disputa de los juristas sobre las cosas con sangre y alma que caen al agua: Ta'abbata Sharran diciéndole a su tío al-Shanfara 'Lo apuñalé con una cuchilla y su alma se derramó', ya que un cadáver no tiene sangre para resucitar {cite:muruj-al-dhahab p. 467-468}."
  fr: "Les conceptions rivales des Arabes sur l'âme avant l'Islam: pour une école, l'âme est simplement le sang et l'esprit l'air à l'intérieur du corps — d'où la « nafsa » parturiente et la dispute des juristes sur les choses à l'âme sanglante tombant dans l'eau — Ta'abbata Sharran disant à son oncle al-Shanfara « Je l'ai poignardé avec une lame et son âme s'est répandue », puisqu'un cadavre n'a pas de sang pour ressusciter {cite:muruj-al-dhahab p. 467-468}."
  ur: "عربوں کے اسلام سے پہلے روح کے بارے میں بیانات: ایک مکتب کے لیے روح صرف خون ہے اور روح جسم کے اندر ہوا ہے - اس وجہ سے روح سے متعلق 'نفس' اور فقہا کا اختلاف روح سے خون آلود چیزوں کے پانی میں گرنے پر ہے - طباطہ شران نے اپنے چچا الشنفرہ سے کہا 'میں نے اسے جام کیا'، جب سے اس کا خون نکلا تو اس کا خون نہیں نکلا۔ {حوالہ: مروج الذہب ص۱۴۲۔ 467-468}۔"
  tr: "Arapların ruhlar hakkında farklı görüşleri ve doğaları hakkında farklı görüşleri vardı. Bazıları ruhun sadece kan olduğunu ve ruhun bedenin içindeki hava olduğunu iddia etti. Bu yüzden kadınlara doğum sonrası kadınlar deniyordu, çünkü onlardan çıkan kan vardı. Bu nedenle, bölge hukukçuları, bir ruhun sıvı olup suya düşmesinin kirli olup olmadığını tartıştı. Amcası Al-Shanfari'ye bir uzvuyla bağlı bir kurbanı sorduğunda sert davrandığını ve bunun sonucunda kendisinden bir akıntı döktüğünü, ölülerin kan söylediği ve içinde hiçbir şey olmadığını söyledi {cite:muruj-al-dhahab s. 467-468}."
  id: "Orang Arab memiliki pendapat berbeda tentang jiwa dan perbedaan pendapat tentang hakikatnya. Beberapa mengklaim bahwa jiwa hanyalah darah dan jiwa adalah udara di dalam tubuh. Oleh karena itu, wanita disebut wanita pasca melahirkan karena darah yang keluar dari tubuh mereka. Karena alasan ini, para ahli hukum di daerah tersebut memperdebatkan apakah jika jiwa itu cair, jika jatuh ke air, maka jiwa itu menjadi najis. Ia mengatakan ia bersikap keras kepada pamannya Al-Shanfari ketika bertanya tentang korban yang diikat oleh anggota tubuh, sehingga ia menuangkan darah dari tubuhnya, mengatakan bahwa orang mati tidak mengeluarkan darah dan tidak mengandung apa-apa {cite:muruj-al-dhahab hlm. 467-468}."
