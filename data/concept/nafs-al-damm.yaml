label: { ar: "مذاهب الجاهلية في النفوس", en: "Jahiliyya doctrines of the soul" }
summary:
  ar: "كانت للعرب مذاهب في النفوس وآراء ينازعون في كيفياتها، فمنهم من زعم أن النفس هي الدم لا غير وأن الروح الهواء الذي في باطن جسم المرء، ولذلك سموا المرأة نفساء لما يخرج منها من الدم، ولهذا تنازع فقهاء الأمصار فيما له نفس سائلة إذا سقط في الماء هل ينجسه، وقال تأبط شراً لخاله الشنفرى حين سأله عن قتيل ألجمته عضباً فسالت نفسه سكباً، وقالوا إن الميت لا ينبعث منه الدم ولا يوجد فيه {cite:muruj-al-dhahab p. 467-468}."
  en: "The Arabs' rival accounts of the soul before Islam: for one school the soul is simply the blood and the spirit the air within the body — whence the parturient 'nafsa'' and the jurists' dispute over soul-blooded things falling into water — Ta'abbata Sharran telling his uncle al-Shanfara 'I jammed him with a blade and his soul poured out', since a corpse has no blood to rise {cite:muruj-al-dhahab p. 467-468}."
