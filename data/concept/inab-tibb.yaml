label:
  ar: "عنب"
  en: "Inab (the grape and raisin), as a drug"
  ur: "عنب"
  es: "Inab (la uva y la pasa), como droga"
  fr: "Inab (le raisin et le raisin sec), en tant que médicament"
  tr: "Üzüm"
  id: "Anggur"
summary:
  ar: "العنب في الكتاب يختار منه الأبيض المترك بعد القطف، وقشره بارد يابس بطيء الهضم وحشوه حار رطب، والمعلق منه جيد الغذاء مقو للبدن، والزبيب صديق الكبد والمعدة وينفع الكلى والمثانة، وكل عنب يضر بالمثانة {cite:canon-ibn-sina-print-v1 p.622}"
  en: "Inab is in the book the grape: the white, left some time after picking, is chosen; its skin is cold and dry and slow to digest and its flesh hot and moist; the hung grape is good food strengthening the body, and the raisin is a friend to the liver and the stomach and benefits the kidneys and the bladder, though every grape harms the bladder {cite:canon-ibn-sina-print-v1 p.622}"
  ur: "عنب کتاب میں انگور ہے: سفید انگور، جو توڑنے کے بعد کچھ دن رکھا گیا ہو، پسندیدہ ہے؛ اس کا چھلکا ٹھنڈا خشک اور دیر ہضم اور گودا گرم تر ہے، لٹکایا ہوا انگور اچھی غذا اور بدن کو قوت دینے والا ہے، اور کشمش جگر اور معدے کی دوست ہے اور گردے اور مثانے کو فائدہ دیتی ہے، مگر ہر انگور مثانے کو نقصان دیتا ہے {cite:canon-ibn-sina-print-v1 p.622}۔"
  es: "En el libro de Inab se habla de la uva: se elige la blanca, que se deja reposar un tiempo después de la vendimia; su piel es fría, seca y de digestión lenta, y su pulpa caliente y húmeda; la uva pasa es un buen alimento que fortalece el cuerpo, y la uva uva pasa es beneficiosa para el hígado y el estómago, y también para los riñones y la vejiga, aunque toda uva perjudica a la vejiga {cite:canon-ibn-sina-print-v1 p.622}."
  fr: "Dans le livre d'Ibn Ibn Sina, il est question du raisin: on choisit le raisin blanc, laissé à sécher quelque temps après la cueillette; sa peau est froide, sèche et lente à digérer, tandis que sa chair est chaude et humide; le raisin mûr est un aliment fortifiant pour le corps, et le raisin sec est bénéfique pour le foie et l'estomac, ainsi que pour les reins et la vessie, bien que tout raisin soit nocif pour la vessie {cite:canon-ibn-sina-print-v1 p.622}"
  tr: "Kitapta, üzümler seçilir; beyaz yaprakları toplandıktan sonra bırakılır, derileri soğuk, kuru ve yavaş sindirilir, dolgusu sıcak ve nemlidir. Sarkan üzümler yiyecek için iyidir ve vücudu güçlendirir. Kuru üzümler karaciğer ve mideye dost olur, böbrekler ve mesaneye faydalıdır. Her üzüm mesaneye zarar verir {cite:canon-ibn-sina-print-v1 s.622}"
  id: "Dalam buku, anggur dipilih dari mana daun putihnya dibiarkan setelah dipetik, kulitnya dingin, kering, dan lambat dicerna, serta isiannya panas dan lembap. Anggur gantung baik untuk makanan dan memperkuat tubuh. Kismis ramah hati dan lambung serta bermanfaat bagi ginjal dan kandung kemih. Setiap anggur merusak kandung kemih {cite:canon-ibn-sina-print-v1 hlm.622}"
