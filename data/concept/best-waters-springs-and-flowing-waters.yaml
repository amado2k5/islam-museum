id: concept/best-waters-springs-and-flowing-waters
class: concept
kind: scientific
label:
  ar: "أفضل المياه: العيون والمياه الجارية عند ابن سينا"
  en: "The best waters, springs and running water, in the Canon"
  fr: "Les meilleures eaux, sources et eaux courantes dans le Canon"
  ur: "قانون میں بہترین پانی: چشمے اور بہتا پانی"
  es: "Las mejores aguas, manantiales y corrientes, en el Cañón."
summary:
  ar: "يقول ابن سينا إن المياه مختلفة لا في جوهر المائية بل بحسب ما يخالطها وبحسب الكيفيات التي تغلب عليها، وأفضلها مياه العيون، لا كل العيون بل عيون الأرض الحرة التي لا يغلب على تربتها شيء من الكيفيات الغريبة {cite:canon-ibn-sina-print-v1 p.135}."
  en: "Ibn Sina says waters differ not in the substance of wateriness but by what mixes with them and by the qualities that prevail in them. The best are spring waters, not every spring but the springs of free earth, whose soil is not dominated by any foreign quality {cite:canon-ibn-sina-print-v1 p.135}."
  fr: "Selon Ibn Sina, les eaux diffèrent non par la substance aqueuse, mais par leurs mélanges et les qualités dominantes. Les meilleures sont celles des sources, non de toutes, mais de terres pures dont le sol n’est dominé par aucune qualité étrangère {cite:canon-ibn-sina-print-v1 p.135}."
  es: "Ibn Sina afirma que las aguas no se diferencian por su naturaleza acuosa, sino por lo que se mezcla con ellas y por las cualidades que predominan en ellas. Las mejores son las aguas de manantial, no cualquier manantial, sino las de tierra fértil, cuyo suelo no está dominado por ninguna cualidad extraña {cite:canon-ibn-sina-print-v1 p.135}."
  ur: "ابن سینا کا کہنا ہے کہ پانی پانی کے مادے میں نہیں بلکہ ان کے ساتھ ملنے والی چیزوں اور ان میں موجود خصوصیات سے مختلف ہوتا ہے۔ بہترین موسم بہار کے پانی ہیں، ہر چشمہ نہیں بلکہ آزاد زمین کے چشمے ہیں، جن کی مٹی پر کسی غیر ملکی معیار کا غلبہ نہیں ہے۔"
