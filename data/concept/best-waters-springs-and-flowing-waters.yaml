summary:
  ar: "يقول ابن سينا إن المياه مختلفة لا في جوهر المائية بل بحسب ما يخالطها وبحسب الكيفيات التي تغلب عليها، وأفضلها مياه العيون، لا كل العيون بل عيون الأرض الحرة التي لا يغلب على تربتها شيء من الكيفيات الغريبة {cite:canon-ibn-sina-print-v1 p.135}."
  en: "Ibn Sina says waters differ not in the substance of wateriness but by what mixes with them and by the qualities that prevail in them. The best are spring waters, not every spring but the springs of free earth, whose soil is not dominated by any foreign quality {cite:canon-ibn-sina-print-v1 p.135}."
