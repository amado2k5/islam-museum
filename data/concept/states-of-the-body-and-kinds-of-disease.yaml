label: { ar: "أحوال البدن وأجناس المرض عند ابن سينا", en: "The states of the body and the kinds of disease in the Canon", ur: "قانون میں بدن کی حالتیں اور بیماریوں کی اقسام", es: "Los estados del cuerpo y los tipos de enfermedades en el Canon", fr: "Les états du corps et les types de maladies dans le Canon" }
summary:
  ar: "يعرض ابن سينا أحوال بدن الإنسان الثلاث عند جالينوس: الصحة والمرض وحالة ليست بصحة ولا مرض، ثم يقسم الأمراض إلى مفردة ومركبة، وأجناس المفردة ثلاثة: سوء المزاج وسوء التركيب وتفرق الاتصال {cite:canon-ibn-sina-print-v1 p.104}."
  en: "Ibn Sina sets out the three states of the human body according to Galen, health, disease and a state that is neither, then divides diseases into simple and composite, the simple falling in three genera: bad temperament, bad composition and breaking of continuity {cite:canon-ibn-sina-print-v1 p.104}."
  es: "Ibn Sina expone los tres estados del cuerpo humano según Galeno: salud, enfermedad y un estado que no es ninguno de los dos; luego divide las enfermedades en simples y compuestas, y las simples se dividen en tres géneros: mal temperamento, mala composición y ruptura de la continuidad {cite:canon-ibn-sina-print-v1 p.104}."
  fr: "Ibn Sina décrit les trois états du corps humain selon Galien: la santé, la maladie et un état qui n'est ni l'un ni l'autre, puis divise les maladies en simples et composites, les simples se répartissant en trois genres: mauvais tempérament, mauvaise composition et rupture de continuité {cite:canon-ibn-sina-print-v1 p.104}."
  ur: "ابن سینا نے جالن کے مطابق انسانی جسم کی تین حالتوں کا تعین کیا ہے، صحت، بیماری اور ایک ایسی حالت جو دونوں میں سے کوئی نہیں ہے، پھر بیماریوں کو سادہ اور جامع میں تقسیم کرتا ہے، سادہ کو تین نسلوں میں تقسیم کرتا ہے: خراب مزاج، خراب ساخت اور تسلسل کا ٹوٹنا۔"
