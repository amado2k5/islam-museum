summary:
  ar: "يعرض ابن سينا أحوال بدن الإنسان الثلاث عند جالينوس: الصحة والمرض وحالة ليست بصحة ولا مرض، ثم يقسم الأمراض إلى مفردة ومركبة، وأجناس المفردة ثلاثة: سوء المزاج وسوء التركيب وتفرق الاتصال {cite:canon-ibn-sina-print-v1 p.104}."
  en: "Ibn Sina sets out the three states of the human body according to Galen, health, disease and a state that is neither, then divides diseases into simple and composite, the simple falling in three genera: bad temperament, bad composition and breaking of continuity {cite:canon-ibn-sina-print-v1 p.104}."
