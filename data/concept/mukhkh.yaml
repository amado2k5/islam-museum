label:
  ar: "مخ"
  en: "Mukhkh (marrow)"
  ur: "مخ"
  es: "Mukhkh (médula)"
  fr: "Mukhkh (moelle)"
summary:
  ar: "المخ في الكتاب مسخن مليّن جالٍ كثير الغذاء إن استمرئ، وأوفقه مخ العجل والأيل، ثم الثور والماعز والضأن، وهو جيد للصلابات والتحجر، ويلطخ المعدة ويذهب بالشهوة {cite:canon-ibn-sina-print-v1 p.573}."
  en: "Mukhkh, marrow, is in the book warming, softening, cleansing and very nourishing if digested; the most suitable is the marrow of the calf and the deer, then ox, goat and sheep, and it is good for hardnesses and petrification but coats the stomach and takes away appetite {cite:canon-ibn-sina-print-v1 p.573}."
  ur: "مخ ⁦(گودا)⁩ کتاب میں گرم کرنے والا، نرم کرنے والا، جلا دینے والا اور ہضم ہو جائے تو بہت غذائیت والا ہے؛ سب سے موافق بچھڑے اور ہرن کا گودا ہے، پھر بیل، بکری اور بھیڑ کا، اور یہ سختیوں اور پتھرا جانے میں مفید ہے مگر معدے پر چکناہٹ چڑھاتا اور بھوک ختم کرتا ہے {cite:canon-ibn-sina-print-v1 p.573}۔"
  es: "Mukhkh, médula, es en el libro caliente, suavizante, limpiador y muy nutritivo si se digiere; la más adecuada es la médula de ternera y ciervo, luego la de buey, cabra y oveja, y es buena para las durezas y la petrificación, pero recubre el estómago y quita el apetito {cite:canon-ibn-sina-print-v1 p.573}."
  fr: "Mukhkh, la moelle, est décrite dans le livre comme réchauffante, adoucissante, purifiante et très nourrissante si elle est digérée; la plus appropriée est la moelle du veau et du cerf, puis celle du bœuf, de la chèvre et du mouton, et elle est bonne pour les duretés et la pétrification mais tapisse l'estomac et coupe l'appétit {cite:canon-ibn-sina-print-v1 p.573}."
