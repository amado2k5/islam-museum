label:
  ar: "حجر المسن"
  en: "Hajar al-masan (the whetstone)"
  ur: "حجر المسن ⁦(سان کا پتھر)⁩"
  es: "Hajar al-masan (la piedra de afilar)"
  fr: "Hajar al-masan (la pierre à aiguiser)"
  tr: "Yaşlı Taş"
  id: "Elder Stone"
summary:
  ar: "حجر المسن يُحكّ على الثدي والخصية لئلاّ تعظم، وحكاكته جيّدة لأورام الثدي الحارة."
  en: "The whetstone is rubbed on the breast and the testicle so that they do not grow large. Its rubbing is good for hot swellings of the breast."
  ur: "سان کا پتھر سینے اور خصیے پر رگڑا جاتا ہے تاکہ وہ بڑھیں نہیں۔ اس کی رگڑ گرم سوجن والے سینے کے لیے اچھی ہے۔"
  es: "La piedra de afilar se frota sobre el pecho y el testículo para evitar que crezcan demasiado. Frotarla también es bueno para aliviar la hinchazón y el calor en el pecho."
  fr: "On frotte la pierre à aiguiser sur le sein et le testicule pour éviter qu'ils ne grossissent. Ce frottement est bénéfique en cas de gonflement chaud du sein."
  tr: "Mürver taşı kemikleri önlemek için meme ve testislere sürter, sürtünmesi ise sıcak meme tümörleri için iyidir."
  id: "Batu elder menggosok payudara dan testis untuk mencegah tulang, dan gosokannya baik untuk tumor payudara panas."
