label:
  ar: "التشبيب"
  en: "Tashbib (amatory verse about women or boys)"
  ur: "تشبیب ⁦(عشقیہ اشعار کہنا)⁩"
  es: "Tashbib (verso amoroso sobre mujeres o muchachos)"
  fr: "Tashbib (vers amoureux sur les femmes ou les garçons)"
summary:
  ar: "التشبيب ترقيق أول القصيد بذكر النساء، وهو مرادف للنسيب والغزل. يحرم التشبيب بامرأة معينة لا تحل للمشبِّب أو بغلام أمرد، ويحرم ذكر المحاسن الفاحشة لأجنبية محرمة. أما التشبيب بزوجته أو جاريته فجائز ما لم يصف أعضاءها الباطنة، والتشبيب بامرأة غير معينة جائز ما لم يقل فحشاً أو يقم دليلاً على تعيينها. ولا تكون أسماء كليلى وسعاد تعييناً، ويجوز إنشاد القصيدة لغرض الاستشهاد أو تعلم البلاغة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5178} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5179}"
  en: "Tashbib is the opening of a poem with amatory lines about women; the words nasib and ghazal mean the same. It is forbidden to write verse about a named woman who is unlawful to the poet, or about a beardless boy; describing the lascivious features of an unlawful non-mahram woman is forbidden. Verse about one's own wife or slave-girl is lawful unless it describes her private parts or what should stay hidden. Verse about an unnamed woman is lawful unless it is obscene or gives clues to identify her; names such as Layla and Su'ad do not identify anyone, as Ka'b ibn Zuhayr recited his poem before the Prophet. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5178} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5179}"
  es: "Tashbib es el inicio de un poema con versos amorosos sobre mujeres; las palabras nasib y ghazal significan lo mismo. Está prohibido escribir versos sobre una mujer nombrada que sea ilícita para el poeta, o sobre un muchacho imberbe; describir los rasgos lascivos de una mujer ilícita que no sea mahram está prohibido. Los versos sobre la propia esposa o esclava son lícitos a menos que describan sus partes íntimas o lo que debe permanecer oculto. Los versos sobre una mujer sin nombre son lícitos a menos que sean obscenos o den pistas para identificarla; nombres como Layla y Su'ad no identifican a nadie, como Ka'b ibn Zuhayr recitó su poema ante el Profeta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5178} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5179}"
  fr: "Le tashbib est l'ouverture d'un poème contenant des vers amoureux sur les femmes; les mots nasib et ghazal ont la même signification. Il est interdit d'écrire des vers sur une femme nommée qui est illicite au poète, ou sur un garçon imberbe; il est interdit de décrire les traits lascifs d'une femme illicite non-mahram. Les vers sur sa propre épouse ou esclave sont licites, sauf s'ils décrivent ses parties intimes ou ce qui doit rester caché. Les vers sur une femme non nommée sont licites, sauf s'ils sont obscènes ou donnent des indices permettant de l'identifier; des noms tels que Layla et Su'ad n'identifient personne, comme Ka'b ibn Zuhayr a récité son poème devant le Prophète. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5178} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5179}"
