  en: "Tashbib (amatory verse about women or boys)"
  ur: "تشبیب (عشقیہ اشعار کہنا)"
summary:
  ar: "التشبيب ترقيق أول القصيد بذكر النساء، وهو مرادف للنسيب والغزل. يحرم التشبيب بامرأة معينة لا تحل للمشبِّب أو بغلام أمرد، ويحرم ذكر المحاسن الفاحشة لأجنبية محرمة. أما التشبيب بزوجته أو جاريته فجائز ما لم يصف أعضاءها الباطنة، والتشبيب بامرأة غير معينة جائز ما لم يقل فحشاً أو يقم دليلاً على تعيينها. ولا تكون أسماء كليلى وسعاد تعييناً، ويجوز إنشاد القصيدة لغرض الاستشهاد أو تعلم البلاغة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5178} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5179}"
  en: "Tashbib is the opening of a poem with amatory lines about women; the words nasib and ghazal mean the same. It is forbidden to write verse about a named woman who is unlawful to the poet, or about a beardless boy; describing the lascivious features of an unlawful non-mahram woman is forbidden. Verse about one's own wife or slave-girl is lawful unless it describes her private parts or what should stay hidden. Verse about an unnamed woman is lawful unless it is obscene or gives clues to identify her; names such as Layla and Su'ad do not identify anyone, as Ka'b ibn Zuhayr recited his poem before the Prophet. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5178} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5179}"
