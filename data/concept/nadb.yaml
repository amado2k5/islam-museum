label: { ar: "النَّدْب", en: "Recommended acts (nadb)", ur: "ندب (مستحب فعل)" }
summary:
  ar: "الندب في اللغة الدعاء إلى الفعل، ومنه ندب الميت أي تعديد محاسنه. وفي اصطلاح الأصوليين والفقهاء المندوب ما لا يلحق بتركه ذم، وهو مرادف للمستحب والتطوع والنفل. وعند جمهور الأصوليين المندوب مأمور به. ويحرم ندب الميت بتعديد شمائله، لحديث أبي موسى الأشعري في من يقول: واجبلاه، واسيداه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15550}"
  en: "Nadb, in the lexicon, is a call to an act, as in the lamentation for the dead by recounting their virtues. In the usage of the theorists and jurists, the mandub is an act whose omission brings no blame, and it is a synonym of mustahabb, tatawwu', and nafl. Most theorists hold that the mandub is included in the command. Lamenting the dead by listing their virtues is forbidden, on the report of Abu Musa al-Ash'ari about the one who cries: O mountain! O lord! and the two angels who reproach him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15550}"
  ur: "ندب (مستحب) وہ کام ہے جس کے چھوڑنے پر ملامت نہ ہو۔ جمہور اصولیین کے نزدیک مندوب بھی امر کے تحت آتا ہے۔ میت کے اوصاف گنوا کر نوحہ کرنا منع ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15550}"
