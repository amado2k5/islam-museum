id: concept/nadb
class: concept
kind: legal
label: { ar: "النَّدْب", en: "Recommended acts (nadb)", ur: "ندب ⁦(مستحب فعل)⁩", es: "Actos recomendados (nadb)", fr: "Actes recommandés (nadb)" }
summary:
  ar: "الندب في اللغة الدعاء إلى الفعل، ومنه ندب الميت أي تعديد محاسنه. وفي اصطلاح الأصوليين والفقهاء المندوب ما لا يلحق بتركه ذم، وهو مرادف للمستحب والتطوع والنفل. وعند جمهور الأصوليين المندوب مأمور به. ويحرم ندب الميت بتعديد شمائله، لحديث أبي موسى الأشعري في من يقول: واجبلاه، واسيداه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15550}"
  en: "Nadb, in the lexicon, is a call to an act, as in the lamentation for the dead by recounting their virtues. In the usage of the theorists and jurists, the mandub is an act whose omission brings no blame, and it is a synonym of mustahabb, tatawwu', and nafl. Most theorists hold that the mandub is included in the command. Lamenting the dead by listing their virtues is forbidden, on the report of Abu Musa al-Ash'ari about the one who cries: O mountain! O lord! and the two angels who reproach him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15550}"
  ur: "ندب ⁦(مستحب)⁩ وہ کام ہے جس کے چھوڑنے پر ملامت نہ ہو۔ جمہور اصولیین کے نزدیک مندوب بھی امر کے تحت آتا ہے۔ میت کے اوصاف گنوا کر نوحہ کرنا منع ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15550}"
  es: "En el léxico, nadb es una invocación a un acto, como el lamento por los muertos al enumerar sus virtudes. En el uso de los teóricos y juristas, el mandub es un acto cuya omisión no conlleva culpa, y es sinónimo de mustahabb, tatawwu' y nafl. La mayoría de los teóricos sostienen que el mandub está incluido en el mandato. El lamento por los muertos al enumerar sus virtudes está prohibido, según el relato de Abu Musa al-Ash'ari sobre aquel que clama: «¡Oh montaña! ¡Oh señor!» y los dos ángeles que lo reprochan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15550}"
  fr: "Dans le lexique, Nadb est un appel à accomplir un acte, comme la lamentation des défunts par l'évocation de leurs vertus. Selon les théoriciens et les juristes, le mandub est un acte dont l'omission n'entraîne aucun blâme; il est synonyme de mustahabb, tatawwu' et nafl. La plupart des théoriciens considèrent que le mandub est inclus dans le commandement. La lamentation des défunts par l'énumération de leurs vertus est interdite, conformément au hadith rapporté par Abu Musa al-Ash'ari concernant celui qui s'écrie: « Ô montagne ! Ô Seigneur ! » et les deux anges qui le réprimandent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15550}"
