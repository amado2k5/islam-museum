label:
  ar: التعلي ⁦(البناء فوق البناء)⁩
  en: Ta'liya (building above another building)
  ur: تعلیہ ⁦(عمارت کو اوپر اٹھانا)⁩
  es: "Ta'liya (edificio sobre otro edificio)"
  fr: "Ta'liya (bâtiment au-dessus d'un autre bâtiment)"
  tr: "Yükseklik (bir binanın üstünde bina)"
  id: "Elevasi (bangunan di atas bangunan)"
summary:
  ar: 'التعلي لغة من العلو وهو الارتفاع، وفي الاصطلاح عند الفقهاء رفع بناء فوق بناء آخر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5456} وللمالك أن يعلو على حائطه ما شاء ما لم يكن ضررا فاحشا على الجار، ولا عبرة بدعوى سد الريح والشمس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5457} وأجاز الجمهور بيع حق التعلي على تفصيل: فأجازه المالكية والشافعية والحنابلة مع وصف البناءين، ومنعه الحنفية لأن الهواء ليس مالا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5457} وإذا انهدم السفل وحده أو العلو وحده، اختلف الفقهاء في إجبار صاحب الآخر على إعادة البناء ومتى يرجع المعيد بما أنفق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5457} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5458} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5459} ويمنع الذمي من أن يعلو بناؤه على بناء جار مسلم، ويختلف الفقهاء في المساواة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5461} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5462} وفي فتح الكوة على الجار يمنعه الحنفية والشافعية والحنابلة إلا برضاه، ويجيز الصاحبان ما لا ضرر فيه، وللمالكية تفصيل في الجديدة والقديمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5460}'
  en: Ta'liya, from 'uluw (height), is in law raising a building on top of another. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5456} An owner may build up on his own wall as he likes, and a neighbour may not stop him unless the harm is gross; the claim that it blocks wind and sun is not gross harm. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5457} Most jurists (Malikis, Shafiis, Hanbalis) allow selling the right to build above, with the two storeys described; the Hanafis forbid it because air is not property. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5457} When the lower or the upper part falls, the jurists differ on whether the other owner can be compelled to rebuild and when the rebuilder may claim his costs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5457} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5458} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5459} A dhimmi may not build higher than a Muslim neighbour, and the jurists differ on building level with one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5461} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5462} Opening a window over a neighbour is refused without consent by the Hanafis, Shafiis and Hanbalis, while the two disciples of Abu Hanifa allow it if no harm; the Malikis distinguish new and old openings. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5460}
  ur: تعلی لغت میں بلندی کو کہتے ہیں، اور فقہاء کے نزدیک ایک عمارت کو دوسری عمارت کے اوپر اٹھانا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5456} مالک اپنی دیوار پر جتنی چاہے عمارت اٹھا سکتا ہے، اور پڑوسی اسے روک نہیں سکتا جب تک ضررِ فاحش نہ ہو؛ ہوا اور دھوپ روکنے کا دعویٰ ضررِ فاحش نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5457} جمہور ⁦(مالکیہ، شافعیہ، حنابلہ)⁩ اوپر کے حق کی بیع کو اوصاف کے ساتھ جائز کہتے ہیں، جبکہ حنفیہ ہوا کے مال نہ ہونے کی بنا پر منع کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5457} نچلا یا اوپر کا حصہ گر جائے تو اس کی تعمیر پر دوسرے کو مجبور کرنے اور خرچ کی واپسی کے بارے میں فقہاء میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5457} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5458} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5459} ذمی کی عمارت مسلمان پڑوسی کی عمارت سے بلند نہیں ہو سکتی، اور برابر کی بلندی میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5461} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5462} پڑوسی کی طرف روشندان کھولنا حنفیہ، شافعیہ اور حنابلہ کے نزدیک اس کی رضا کے بغیر جائز نہیں، جبکہ صاحبین کے نزدیک بغیر ضرر کے جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5460}
  es: "Ta'liya, de 'uluw (altura), es en derecho levantar un edificio encima de otro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5456} Un propietario puede construir sobre su propia pared como quiera, y un vecino no puede impedírselo a menos que el daño sea grave; la afirmación de que bloquea el viento y el sol no es un daño grave. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5457} La mayoría de los juristas (Malikis, Shafiis, Hanbalis) permiten vender el derecho a construir encima, con los dos pisos descritos; los Hanafis lo prohíben porque el aire no es propiedad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5457} Cuando se cae la parte inferior o superior, los juristas difieren en si se puede obligar al otro propietario a reconstruir y cuándo el reconstructor puede reclamar sus costos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5457} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5458} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5459} Un dhimmi no puede construir más alto que un vecino musulmán, y los juristas difieren en cuanto al nivel de construcción con uno. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5461} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5462} Los Hanafis, Shafiis y Hanbalis rechazan sin consentimiento abrir una ventana a un vecino, mientras que los dos discípulos de Abu Hanifa lo permiten si no hay daño; Los Maliki distinguen las aperturas nuevas y viejas. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5460}"
  fr: "La ta'liya, dérivée de 'uluw (hauteur), désigne juridiquement le fait de surélever un bâtiment au-dessus d'un autre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5456} Un propriétaire peut construire sur son propre mur à sa guise, et un voisin ne peut l'en empêcher sauf si le préjudice est grave; l'argument selon lequel cela bloque le vent et le soleil ne constitue pas un préjudice grave. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5457} La plupart des juristes (malikites, chaféites, hanbalites) autorisent la vente du droit de construire au-dessus, avec les deux étages décrits; les hanafites l'interdisent car l'air n'est pas une propriété. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5457} En cas d'effondrement de la partie inférieure ou supérieure d'un bâtiment, les juristes divergent quant à la possibilité de contraindre l'autre propriétaire à reconstruire et quant aux conditions dans lesquelles le reconstruiteur peut réclamer le remboursement de ses frais. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5457} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5458} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5459} Un dhimmi ne peut construire plus haut qu'un voisin musulman, et les juristes divergent quant à la possibilité de construire au même niveau. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5461} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5462} Ouvrir une fenêtre sur un voisin est refusé sans consentement par les Hanafis, Shafiis et Hanbalis, tandis que les deux disciples d'Abou Hanifa l'autorisent s'il n'y a pas de mal; les Malikis distinguent les ouvertures nouvelles et anciennes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5460}"
  tr: "Dilbilimsel olarak 'tal'al' yükseklik anlamına gelirken, hukuk terminolojisinde bir binayı başka bir yapının üzerine yükseltmek anlamına gelir. {cit:fiqh-mawsua-kuwaitiyya-noor-v3 s.5456} Sahibi, komşuya ciddi zarar vermediği sürece duvarını istediği kadar yükseltebilir ve rüzgar ile güneşi engelleme iddiasında hiçbir şüphe yoktur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5457} Çoğunluk, kibir hakkının ayrıntılı olarak satışına izin verdi: Malikiler, Şafiiler ve Hanbaliler bunu iki inşaatçının tanımlarıyla birlikte izin verdi, Hanafiler ise havanın zenginlik olmadığını söyledikleri için yasakladı. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5457} Sadece alt veya üst olan çökerse, hukukçular diğerinin sahibini yeniden inşa etmeye zorlamak ve restorasyonun harcanan parayı ne zaman geri alabileceği konusunda farklı görüşlere sahiptir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5457} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5458} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5459} ve zimminin binasının Müslüman bir komşunun binasının üstünde olmasını yasaklar, hukukçular ise eşitlik konusunda farklı görüşler sergiler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5461} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5462} Ve komşunun üzerinde kuyu açarken, Hanefiler, Şafiiler ve Hanbaliler bunu ancak onun rızası olmadan yasaklar, iki yazar da zararlı olmayanlara izin verir. Malikiler yeni ve eski vakalar hakkında detaylara sahiptir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5460}"
  id: "Secara linguistik, 'tal'al' berarti tinggi, dan dalam terminologi yurisprudensi, berarti mendirikan sebuah bangunan di atas struktur lain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5456} Pemilik dapat mendirikan temboknya sebanyak yang ia mau, kecuali jika itu menyebabkan kerugian serius pada tetangga, dan tidak ada keraguan dalam klaim menghalangi angin dan matahari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5457} Mayoritas mengizinkan penjualan hak kesombongan secara rinci: Maliki, Shafi'i, dan Hanbal mengizinkannya beserta deskripsi dua pembangun, dan Hanafi melarangnya karena udara bukanlah kekayaan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5457} Jika hanya yang bawah atau atas yang runtuh, para ahli hukum berbeda pendapat tentang memaksa pemilik yang lain membangun kembali dan kapan pemulihan dapat merebut kembali apa yang telah dikeluarkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5457} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5458} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5459} dan melarang dhimmi agar bangunannya lebih tinggi dari tetangga Muslim, dan para ahli hukum berbeda pendapat tentang kesetaraan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5461} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5462} Dan dalam membuka alwell atas tetangga, Hanafi, Shafi'i, dan Hanbalis melarangnya kecuali dengan persetujuannya, dan kedua penulis mengizinkan apa yang tidak berbahaya. Keluarga Malik memiliki rincian tentang kasus baru dan lama. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5460}"
