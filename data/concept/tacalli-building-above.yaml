id: concept/tacalli-building-above
class: concept
kind: legal
label:
  ar: التعلي (البناء فوق البناء)
  en: Ta'liya (building above another building)
  ur: تعلیہ (عمارت کو اوپر اٹھانا)
summary:
  ar: 'التعلي لغة من العلو وهو الارتفاع، وفي الاصطلاح عند الفقهاء رفع بناء فوق بناء آخر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5456} وللمالك أن يعلو على حائطه ما شاء ما لم يكن ضررا فاحشا على الجار، ولا عبرة بدعوى سد الريح والشمس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5457} وأجاز الجمهور بيع حق التعلي على تفصيل: فأجازه المالكية والشافعية والحنابلة مع وصف البناءين، ومنعه الحنفية لأن الهواء ليس مالا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5457} وإذا انهدم السفل وحده أو العلو وحده، اختلف الفقهاء في إجبار صاحب الآخر على إعادة البناء ومتى يرجع المعيد بما أنفق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5457} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5458} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5459} ويمنع الذمي من أن يعلو بناؤه على بناء جار مسلم، ويختلف الفقهاء في المساواة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5461} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5462} وفي فتح الكوة على الجار يمنعه الحنفية والشافعية والحنابلة إلا برضاه، ويجيز الصاحبان ما لا ضرر فيه، وللمالكية تفصيل في الجديدة والقديمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5460}'
  en: Ta'liya, from 'uluw (height), is in law raising a building on top of another. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5456} An owner may build up on his own wall as he likes, and a neighbour may not stop him unless the harm is gross; the claim that it blocks wind and sun is not gross harm. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5457} Most jurists (Malikis, Shafiis, Hanbalis) allow selling the right to build above, with the two storeys described; the Hanafis forbid it because air is not property. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5457} When the lower or the upper part falls, the jurists differ on whether the other owner can be compelled to rebuild and when the rebuilder may claim his costs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5457} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5458} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5459} A dhimmi may not build higher than a Muslim neighbour, and the jurists differ on building level with one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5461} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5462} Opening a window over a neighbour is refused without consent by the Hanafis, Shafiis and Hanbalis, while the two disciples of Abu Hanifa allow it if no harm; the Malikis distinguish new and old openings. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5460}
  ur: تعلی لغت میں بلندی کو کہتے ہیں، اور فقہاء کے نزدیک ایک عمارت کو دوسری عمارت کے اوپر اٹھانا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5456} مالک اپنی دیوار پر جتنی چاہے عمارت اٹھا سکتا ہے، اور پڑوسی اسے روک نہیں سکتا جب تک ضررِ فاحش نہ ہو؛ ہوا اور دھوپ روکنے کا دعویٰ ضررِ فاحش نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5457} جمہور (مالکیہ، شافعیہ، حنابلہ) اوپر کے حق کی بیع کو اوصاف کے ساتھ جائز کہتے ہیں، جبکہ حنفیہ ہوا کے مال نہ ہونے کی بنا پر منع کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5457} نچلا یا اوپر کا حصہ گر جائے تو اس کی تعمیر پر دوسرے کو مجبور کرنے اور خرچ کی واپسی کے بارے میں فقہاء میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5457} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5458} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5459} ذمی کی عمارت مسلمان پڑوسی کی عمارت سے بلند نہیں ہو سکتی، اور برابر کی بلندی میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5461} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5462} پڑوسی کی طرف روشندان کھولنا حنفیہ، شافعیہ اور حنابلہ کے نزدیک اس کی رضا کے بغیر جائز نہیں، جبکہ صاحبین کے نزدیک بغیر ضرر کے جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5460}
