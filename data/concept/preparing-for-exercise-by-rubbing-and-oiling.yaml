label: { ar: "التدلك والتمريخ قبل الرياضة عند ابن سينا", en: "Rubbing and oiling before exercise in the Canon", ur: "قانون میں ورزش سے پہلے مالش اور تیل" }
summary:
  ar: "يذكر ابن سينا أن من يرتاض يبدأ بتدلك بشيء خشن ثم يتمرخ بدهن عذب ثم يدرج التمريخ إلى أن يضغط العضو ضغطاً غير شديد الوغول بأيد كثيرة مختلفة أوضاع الملاقاة ليبلغ جميع شظايا العضل، ثم يترك ويأخذ المدلوك في الرياضة {cite:canon-ibn-sina-print-v1 p.224}."
  en: "Ibn Sina says the one who will exercise begins with a rubbing by something rough, then anoints himself with a sweet oil and works the anointing gradually until the organ is pressed, though not too deeply, by many hands meeting it from different positions so as to reach every fibre of the muscle, then leaves off and goes into exercise {cite:canon-ibn-sina-print-v1 p.224}."
