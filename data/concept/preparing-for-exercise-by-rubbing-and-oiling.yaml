id: concept/preparing-for-exercise-by-rubbing-and-oiling
class: concept
kind: scientific
label: { ar: "التدلك والتمريخ قبل الرياضة عند ابن سينا", en: "Rubbing and oiling before exercise in the Canon", ur: "قانون میں ورزش سے پہلے مالش اور تیل", es: "Frotarse y engrasarse antes de hacer ejercicio en el Canon", fr: "Frotter et huiler avant l'exercice dans le Canon", tr: "İbn Sina'da Spor Öncesi Masaj ve Ovma", id: "Pijat dan Gosok Sebelum Olahraga di Ibn Sina" }
summary:
  ar: "يذكر ابن سينا أن من يرتاض يبدأ بتدلك بشيء خشن ثم يتمرخ بدهن عذب ثم يدرج التمريخ إلى أن يضغط العضو ضغطاً غير شديد الوغول بأيد كثيرة مختلفة أوضاع الملاقاة ليبلغ جميع شظايا العضل، ثم يترك ويأخذ المدلوك في الرياضة {cite:canon-ibn-sina-print-v1 p.224}."
  en: "Ibn Sina says the one who will exercise begins with a rubbing by something rough, then anoints himself with a sweet oil and works the anointing gradually until the organ is pressed, though not too deeply, by many hands meeting it from different positions so as to reach every fibre of the muscle, then leaves off and goes into exercise {cite:canon-ibn-sina-print-v1 p.224}."
  es: "Ibn Sina dice que quien va a ejercitarse comienza frotándose con algo áspero, luego se unge con un aceite dulce y trabaja la unción gradualmente hasta que el órgano se presiona, aunque no demasiado profundamente, con muchas manos que lo tocan desde diferentes posiciones para alcanzar cada fibra del músculo, luego se detiene y pasa al ejercicio {cite:canon-ibn-sina-print-v1 p.224}."
  fr: "Ibn Sina dit que celui qui va s'exercer commence par se frotter avec quelque chose de rugueux, puis s'oint d'une huile douce et travaille l'onction progressivement jusqu'à ce que l'organe soit pressé, mais pas trop profondément, par de nombreuses mains le rencontrant de différentes positions afin d'atteindre chaque fibre du muscle, puis s'arrête et passe à l'exercice {cite:canon-ibn-sina-print-v1 p.224}."
  ur: "ابن سینا کہتے ہیں کہ جو ورزش کرے گا وہ کسی کھردری چیز سے رگڑ کر شروع کرتا ہے، پھر اپنے آپ کو میٹھے تیل سے مسح کرتا ہے اور بتدریج مسح کرتا ہے یہاں تک کہ عضو کو دبایا جاتا ہے، اگرچہ زیادہ گہرا نہیں، کئی ہاتھوں سے اسے مختلف پوزیشنوں سے ملاتا ہے تاکہ پٹھوں کے ہر ریشے تک پہنچ جائے، پھر چھوڑ کر ورزش میں لگ جاتا ہے۔"
  tr: "İbn Sina, meditasyon yapanın önce kaba bir şeyle masaj yaparak başladığını, sonra taze bir yağla gevşediğini, ardından organın farklı pozisyonlarda birçok farklı pozisyonda orta derecede baskı uygulayarak tüm kas parçalarına ulaşana kadar yavaş yavaş ovaladığını, ardından masajın bırakılıp egzersizle alındığını belirtir {cite:canon-ibn-sina-print-v1 s.224}."
  id: "Ibn Sina menyebutkan bahwa orang yang sedang bermeditasi dimulai dengan memijat menggunakan sesuatu yang kasar, lalu rileks dengan minyak baru, kemudian secara bertahap menggosok hingga organ memberikan tekanan sedang dengan banyak tangan berbeda dalam posisi berbeda hingga mencapai semua fragmen otot, kemudian yang dipijat dibiarkan dan dikonsumsi dalam latihan {cite:canon-ibn-sina-print-v1 hlm.224}."
