summary:
  ar: "الرصاص في الكتاب يحيل إلى ما قيل في باب الأسرب ويقول إن هذا هو القلعي، أما الإسفيداج وأصناف اتخاذه فيؤجل ذكرها إلى الأقراباذين، وهو بارد رطب، ومحرقه فيه تلطيف وتليين وتحليل ويقطع الدم، وينفع القروح الخبيئة والساعية ويملأ القروح الغائرة لحما، وينفع من لسعة العقرب البحري والتنين البحري {cite:canon-ibn-sina-print-v1 p.668}"
  en: "Rasas is in the book referred back to what was said in the chapter on usrub, and the book says that this is the qal'i; the isfidaj and its kinds of preparation are put off to the Aqrabadhin; it is cold and moist, its burnt form has a subtilising, softening and dissolving power and cuts blood, it benefits hidden and creeping ulcers and fills deep ulcers with flesh, and it benefits the sting of the sea scorpion and the sea dragon {cite:canon-ibn-sina-print-v1 p.668}"
  ur: "رصاص کتاب میں اس بات کی طرف لوٹایا گیا ہے جو اسرب کے باب میں کہی گئی، اور کتاب کہتی ہے کہ یہ قلعی ہے؛ اسفیداج اور اس کے بنانے کی قسمیں اقرباذین کے لیے مؤخر ہیں؛ یہ ٹھنڈا اور تر ہے، اس کے جلائے ہوئے میں لطافت، نرمی اور تحلیل ہے اور خون کو روکتا ہے، پوشیدہ اور پھیلنے والے قرحوں میں نافع ہے اور گہرے قرحوں کو گوشت سے بھرتا ہے، اور سمندری بچھو اور سمندری اژدہے کے ڈنک میں نافع ہے {cite:canon-ibn-sina-print-v1 p.668}۔"
  es: "En el libro, Rasas hace referencia a lo dicho en el capítulo sobre usrub, y el libro afirma que este es el qal'i; el isfidaj y sus preparaciones se reservan para los Aqrabadhin; es frío y húmedo, su forma quemada tiene un poder sutilizante, suavizante y disolvente, y corta la sangre; beneficia las úlceras ocultas y persistentes, y rellena las úlceras profundas con carne; y beneficia la picadura del escorpión marino y del dragón marino {cite:canon-ibn-sina-print-v1 p.668}."
  fr: "Le Rasas, mentionné dans le livre, fait référence à ce qui a été dit dans le chapitre sur l'usrub. Le livre précise qu'il s'agit du qal'i; l'isfidaj et ses différentes préparations sont réservés aux Aqrabadhin; il est froid et humide, sa forme brûlée possède un pouvoir subtilisant, adoucissant et dissolvant, et coupe le sang. Il est bénéfique pour les ulcères cachés et rampants, et comble les ulcères profonds de chair. Il est également bénéfique contre la piqûre du scorpion de mer et du dragon de mer. {cite:canon-ibn-sina-print-v1 p.668}"
  tr: "Kitaptaki kurşun, esirlerle ilgili bölümde söylenenlere atıfta bulunur ve bunun qala'i olduğunu söyler. Esfidaj ve türleri için ise Aqrabaddin'e anılması ertelenmiştir. Soğuk ve nemlidir, kanı yumuşatmak, yumuşatmak, çözmek ve kanı kesmek için kullanılır. Gizli ve ağrılı yaralar için faydalıdır, derin yaraları etle doldurur ve deniz akrepleri ile deniz ejderhalarının sokması için faydalıdır {cite:canon-ibn-sina-print-v1 s.668}"
  id: "Timbal dalam buku merujuk pada apa yang dikatakan dalam bab tentang tawanan dan mengatakan ini adalah qala'i. Adapun Esfidaj dan jenisnya, penyebutannya ditunda ke Aqrabaddin. Ia dingin dan lembap, dan pembakar digunakan untuk melunakkan, melunakkan, melarutkan, dan memotong darah. Ia berguna untuk luka tersembunyi dan menyakitkan, mengisi luka dalam dengan daging, dan berguna untuk sengatan kalajengking laut dan naga laut {cite:canon-ibn-sina-print-v1 hlm.668}"
