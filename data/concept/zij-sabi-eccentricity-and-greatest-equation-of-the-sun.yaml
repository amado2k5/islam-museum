label: { ar: "البعد بين المركزين وأعظم تعديل للشمس", en: "The distance between the centres and the Sun's greatest equation", ur: "دونوں مرکزوں کا فاصلہ اور سورج کا سب سے بڑا تعدیل", es: "La distancia entre los centros y la ecuación más grande del Sol" }
summary:
  ar: "يرسم البتاني دائرة فلك البروج وقطرين متعامدين ثم دائرة الفلك الخارج المركز للشمس داخلها، ويحسب من القوسين المرصودتين أن المسافة بين المركزين جزءان وأربع دقائق ونصف وربع دقيقة بالمقدار الذي نصف قطر الدائرة فيه ستون جزءاً، وأن مجموع اختلاف حركة الشمس الظاهر لهذه الأرصاد جزء وتسع وخمسون دقيقة بالتقريب {cite:zij-sabi-nallino-byblion pp.69-70}."
  en: "Al-Battani draws the circle of the zodiac with two diameters at right angles and the Sun's eccentric circle inside it, and from the two observed arcs reckons that the distance between the centres is two parts, four minutes and a half and a quarter of a minute, on a scale where the circle's radius is sixty parts, and that the whole variation of the Sun's motion shown by these observations is one part and fifty-nine minutes, approximately {cite:zij-sabi-nallino-byblion pp.69-70}."
  ur: "البتانی فلک البروج کا دائرہ اور دو ایک دوسرے پر عمود قطر کھینچتے ہیں اور اس کے اندر سورج کا خارج المرکز دائرہ، اور دونوں رصد شدہ قوسوں سے حساب لگاتے ہیں کہ دونوں مرکزوں کے درمیان کا فاصلہ، اس پیمانے پر جس میں دائرے کا نصف قطر ساٹھ اجزا ہے، دو اجزا، چار دقیقے، آدھا اور ایک چوتھائی دقیقہ ہے، اور ان رصدوں سے ظاہر ہونے والا سورج کی حرکت کا کل اختلاف ایک جز اور انسٹھ دقیقے ہے، تقریباً {cite:zij-sabi-nallino-byblion pp.69-70}۔"
  es: "Al-Battani dibuja el círculo del zodíaco con dos diámetros en ángulo recto y el círculo excéntrico del Sol dentro de él, y a partir de los dos arcos observados calcula que la distancia entre los centros es de dos partes, cuatro minutos y medio y un cuarto de minuto, en una escala donde el radio del círculo es de sesenta partes, y que toda la variación del movimiento del Sol mostrada por estas observaciones es de una parte y cincuenta y nueve minutos, aproximadamente {cite:zij-sabi-nallino-byblion pp.69-70}."
