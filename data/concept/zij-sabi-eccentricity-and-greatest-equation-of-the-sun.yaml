id: concept/zij-sabi-eccentricity-and-greatest-equation-of-the-sun
class: concept
kind: scientific
label: { ar: "البعد بين المركزين وأعظم تعديل للشمس", en: "The distance between the centres and the Sun's greatest equation", ur: "دونوں مرکزوں کا فاصلہ اور سورج کا سب سے بڑا تعدیل", es: "La distancia entre los centros y la ecuación más grande del Sol", fr: "La distance entre les centres et la plus grande équation du Soleil", tr: "İki merkez arasındaki mesafe ve güneşin en büyük sapması", id: "Jarak antara kedua pusat dan penyesuaian matahari terbesar" }
summary:
  ar: "يرسم البتاني دائرة فلك البروج وقطرين متعامدين ثم دائرة الفلك الخارج المركز للشمس داخلها، ويحسب من القوسين المرصودتين أن المسافة بين المركزين جزءان وأربع دقائق ونصف وربع دقيقة بالمقدار الذي نصف قطر الدائرة فيه ستون جزءاً، وأن مجموع اختلاف حركة الشمس الظاهر لهذه الأرصاد جزء وتسع وخمسون دقيقة بالتقريب {cite:zij-sabi-nallino-byblion pp.69-70}."
  en: "Al-Battani draws the circle of the zodiac with two diameters at right angles and the Sun's eccentric circle inside it, and from the two observed arcs reckons that the distance between the centres is two parts, four minutes and a half and a quarter of a minute, on a scale where the circle's radius is sixty parts, and that the whole variation of the Sun's motion shown by these observations is one part and fifty-nine minutes, approximately {cite:zij-sabi-nallino-byblion pp.69-70}."
  ur: "البتانی فلک البروج کا دائرہ اور دو ایک دوسرے پر عمود قطر کھینچتے ہیں اور اس کے اندر سورج کا خارج المرکز دائرہ، اور دونوں رصد شدہ قوسوں سے حساب لگاتے ہیں کہ دونوں مرکزوں کے درمیان کا فاصلہ، اس پیمانے پر جس میں دائرے کا نصف قطر ساٹھ اجزا ہے، دو اجزا، چار دقیقے، آدھا اور ایک چوتھائی دقیقہ ہے، اور ان رصدوں سے ظاہر ہونے والا سورج کی حرکت کا کل اختلاف ایک جز اور انسٹھ دقیقے ہے، تقریباً {cite:zij-sabi-nallino-byblion pp.69-70}۔"
  es: "Al-Battani dibuja el círculo del zodíaco con dos diámetros en ángulo recto y el círculo excéntrico del Sol dentro de él, y a partir de los dos arcos observados calcula que la distancia entre los centros es de dos partes, cuatro minutos y medio y un cuarto de minuto, en una escala donde el radio del círculo es de sesenta partes, y que toda la variación del movimiento del Sol mostrada por estas observaciones es de una parte y cincuenta y nueve minutos, aproximadamente {cite:zij-sabi-nallino-byblion pp.69-70}."
  fr: "Al-Battani trace le cercle du zodiaque avec deux diamètres à angle droit et le cercle excentrique du Soleil à l'intérieur, et à partir des deux arcs observés, il calcule que la distance entre les centres est de deux parties, quatre minutes et demie et un quart de minute, sur une échelle où le rayon du cercle est de soixante parties, et que la variation totale du mouvement du Soleil montrée par ces observations est d'une partie et cinquante-neuf minutes, approximativement {cite:zij-sabi-nallino-byblion pp.69-70}."
  tr: "El-Battani, ekliptik çemberi ve iki dik çapı, ardından da güneşi merkezine alan ektopik çemberi çizer. Gözlemlenen iki yaydan, çemberin yarıçapının altmış kısım olduğu miktarla, iki merkez arasındaki mesafenin iki kısım ve dört buçuk çeyrek dakika olduğunu ve bu gözlemler için güneşin görünen hareketindeki toplam farkın yaklaşık bir kısım ve elli dokuz dakika olduğunu hesaplar {cite:zij-sabi-nallino-byblion pp.69-70}."
  id: "Al-Battani menggambar lingkaran ekliptika dan dua diameter tegak lurus, kemudian lingkaran ektopik dengan matahari berpusat di dalamnya. Dari dua busur yang diamati, ia menghitung bahwa jarak antara kedua pusat tersebut adalah dua bagian dan empat setengah seperempat menit, dengan jumlah di mana jari-jari lingkaran adalah enam puluh bagian, dan bahwa perbedaan total dalam pergerakan semu matahari untuk pengamatan ini adalah sekitar satu bagian dan lima puluh sembilan menit {cite:zij-sabi-nallino-byblion pp.69-70}."
