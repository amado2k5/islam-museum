class: concept
kind: scientific
label: { ar: "تقويس المطالع وتحويلها إلى درج البروج في الزيج الصابي", en: "Converting risings back to degrees of the signs (taqwis al-matali)", ur: "مطالع کو بروج کے درجوں میں بدلنا، تقویس المطالع", es: "Convertir los ascendentes de nuevo a grados de los signos (taqwis al-matali)", fr: "Conversion des ascensions en degrés des signes (taqwis al-matali)", tr: "Yükselen burçları eğrilerek Sabian astronomik tablolarında zodyak burçlarına dönüştürmek", id: "Melengkungkan garis ascendant dan mengubahnya menjadi zodiak dalam tabel astronomi Sabian." }
summary:
  ar: "يسمي البتاني الطريقة العكسية تقويس المطالع، وهي تحويل أزمان المطالع إلى درج السواء التي هي درج البروج: يُطلب في جدول مطالع الفلك المستقيم أو مطالع الإقليم عدد الأزمان المعلوم أو أقرب أقل منه، فيؤخذ ما بإزائه من درج البروج، ثم يُحسب الباقي بضرب تفاضل العدد، ستين دقيقة أو ستمائة، وقسمته على تفاضل المطالع بين البرجين. {cite:zij-sabi-nallino-byblion p.45}."
  en: "Al-Battani calls the converse operation the taqwis of the risings, turning rising times into the degrees of equality, which are the degrees of the signs: in the table of the right sphere or of the clime one looks for the known number of times or the nearest smaller one, takes the degrees of the signs standing opposite, and then works out the remainder by multiplying by sixty or six hundred minutes, according to the step, and dividing by the difference of the risings between the two entries. {cite:zij-sabi-nallino-byblion p.45}."
  ur: "البتانی الٹے عمل کو تقویس المطالع کہتے ہیں، یعنی مطالع کے اوقات کو درج السواء میں بدلنا جو بروج کے درجے ہیں: فلک مستقیم یا اقلیم کے مطالع کے جدول میں معلوم اوقات کا عدد یا اس سے قریب ترین چھوٹا عدد تلاش کیا جاتا ہے، اس کے سامنے والے بروج کے درجے لیے جاتے ہیں، پھر وقفے کے مطابق ساٹھ یا چھ سو دقیقوں سے ضرب دے کر اور دونوں اندراجوں کے مطالع کے فرق پر تقسیم کر کے باقی کا حساب کیا جاتا ہے۔ {cite:zij-sabi-nallino-byblion p.45}۔"
  es: "Al-Battani denomina a la operación inversa el taqwis de los ascensos, que transforma los tiempos de ascenso en grados de igualdad, que son los grados de los signos: en la tabla de la esfera derecha o del clima se busca el número conocido de tiempos o el menor más cercano, se toman los grados de los signos opuestos y luego se calcula el resto multiplicando por sesenta o seiscientos minutos, según el paso, y dividiendo por la diferencia de los ascensos entre las dos entradas. {cite:zij-sabi-nallino-byblion p.45}."
  fr: "Al-Battani nomme l'opération inverse « taqwis des levers », transformant les heures de lever en degrés d'égalité, qui sont les degrés des signes: dans le tableau de la sphère droite ou du climat, on recherche le nombre de fois connu ou le plus proche inférieur, on prend les degrés des signes opposés, puis on calcule le reste en multipliant par soixante ou six cents minutes, selon l'intervalle, et en divisant par la différence des levers entre les deux entrées. {cite:zij-sabi-nallino-byblion p.45}."
  tr: "El-Battani, ters yöntemi yükselenlerin eğriliği olarak adlandırır; bu yöntem, yükselen zamanlarının zodyak derecelerine, yani eşitlik derecelerine dönüştürülmesidir: Düz gök küresinin yükselenleri tablosunda veya bölgenin yükselenlerinde, bilinen zaman sayısı veya en yakın daha küçük sayı istenir ve karşılık gelen zodyak derecesi alınır, ardından kalan, sayıdaki farkın (altmış dakika veya altı yüz) iki burç arasındaki yükselen farkına bölünmesiyle hesaplanır. {cite:zij-sabi-nallino-byblion s.45}."
  id: "Al-Battani menyebut metode kebalikannya sebagai kelengkungan ascendant, yaitu konversi waktu ascendant ke derajat kesamaan, yang merupakan derajat zodiak: Dalam tabel ascendant bola langit lurus atau ascendant wilayah, jumlah waktu yang diketahui atau angka yang lebih kecil terdekat diminta, dan derajat zodiak yang sesuai diambil, kemudian sisanya dihitung dengan mengalikan selisih angka tersebut, enam puluh menit atau enam ratus, dan membaginya dengan selisih ascendant antara kedua tanda. {cite:zij-sabi-nallino-byblion p.45}."
