label: { ar: "تقويس المطالع وتحويلها إلى درج البروج في الزيج الصابي", en: "Converting risings back to degrees of the signs (taqwis al-matali)", ur: "مطالع کو بروج کے درجوں میں بدلنا، تقویس المطالع" }
summary:
  ar: "يسمي البتاني الطريقة العكسية تقويس المطالع، وهي تحويل أزمان المطالع إلى درج السواء التي هي درج البروج: يُطلب في جدول مطالع الفلك المستقيم أو مطالع الإقليم عدد الأزمان المعلوم أو أقرب أقل منه، فيؤخذ ما بإزائه من درج البروج، ثم يُحسب الباقي بضرب تفاضل العدد، ستين دقيقة أو ستمائة، وقسمته على تفاضل المطالع بين البرجين. {cite:zij-sabi-nallino-byblion p.45}."
  en: "Al-Battani calls the converse operation the taqwis of the risings, turning rising times into the degrees of equality, which are the degrees of the signs: in the table of the right sphere or of the clime one looks for the known number of times or the nearest smaller one, takes the degrees of the signs standing opposite, and then works out the remainder by multiplying by sixty or six hundred minutes, according to the step, and dividing by the difference of the risings between the two entries. {cite:zij-sabi-nallino-byblion p.45}."
  ur: "البتانی الٹے عمل کو تقویس المطالع کہتے ہیں، یعنی مطالع کے اوقات کو درج السواء میں بدلنا جو بروج کے درجے ہیں: فلک مستقیم یا اقلیم کے مطالع کے جدول میں معلوم اوقات کا عدد یا اس سے قریب ترین چھوٹا عدد تلاش کیا جاتا ہے، اس کے سامنے والے بروج کے درجے لیے جاتے ہیں، پھر وقفے کے مطابق ساٹھ یا چھ سو دقیقوں سے ضرب دے کر اور دونوں اندراجوں کے مطالع کے فرق پر تقسیم کر کے باقی کا حساب کیا جاتا ہے۔ {cite:zij-sabi-nallino-byblion p.45}۔"
