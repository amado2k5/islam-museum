label:
  ar: "ضعف البصر"
  en: "Weakness of sight (da'f al-basar)"
  ur: "بینائی کا ضعف"
  es: "Debilidad de la vista (da'f al-basar)"
summary:
  ar: "ضعف البصر وآفته يوجبه إما مزاج عام في البدن، وإما سبب في الدماغ، وإما أمر يختص بالروح الباصر وما يليه من الأعضاء من العصبة المجوفة والرطوبات والطبقات، وتلك أبوابها المفصلة في أسبابه وعلاماته ومبادئ علاجه {cite:canon-ibn-sina-print-v2 p.201}"
  en: "Weakness of sight and its lesion are produced either by a general temperament in the body, or by a cause in the brain, or by something belonging to the visual spirit and the members next to it — the hollow nerve, the humours and the layers; these are its chapters set out in its causes, signs and principles of treatment {cite:canon-ibn-sina-print-v2 p.201}"
  ur: "بینائی کے ضعف اور اس کی آفت یا تو بدن کے عمومی مزاج سے ہوتی ہے، یا دماغ میں کسی سبب سے، یا باصر روح اور اس کے ملحقہ اعضا — کھوکھلا عصب، رطوبتیں اور طبقات — سے؛ اس کے ابواب اس کے اسباب، علامات اور علاج کے اصول میں مفصل ہیں {cite:canon-ibn-sina-print-v2 p.201}۔"
  es: "La debilidad de la vista y su lesión se producen bien por un temperamento general del cuerpo, bien por una causa cerebral, bien por algo perteneciente al espíritu visual y a los miembros adyacentes: el nervio óptico, los humores y las capas; estos son los capítulos que se exponen en sus causas, signos y principios de tratamiento {cite:canon-ibn-sina-print-v2 p.201}."
