label:
  ar: "التخدير والمخدرات"
  en: "Narcotics and drugging"
  ur: "نشہ آور ادویات ⁦(تخدیر)⁩"
  es: "Narcóticos y drogas"
  fr: "Stupéfiants et toxicomanie"
  tr: "Anestezi ve İlaçlar"
  id: "Anestesi dan Obat-obatan"
summary:
  ar: "التخدير استرخاء يغشى بعض الأعضاء أو الجسد كله، والمخدِّر ما يُفقد الإنسان الوعي بدرجات مختلفة كالبنج والحشيش والأفيون. جمهور الفقهاء على تحريم تناول المخدرات المغيِّبة للعقل، ويفرّقون بين تناولها للتداوي وتناولها بلا عذر، ويبحثون في الطهارة والبيع والتصرفات والعقوبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4806}"
  en: "Takhdir is a numbness that comes over some limbs or the whole body; a narcotic makes a person lose consciousness in varying degrees, as with henbane, hashish and opium. Most jurists forbid taking narcotics that cloud the mind, distinguish use for treatment from use without excuse, and discuss purity, sale, the validity of acts and penalty. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4806}"
  es: "Takhdir es un entumecimiento que afecta a algunas extremidades o a todo el cuerpo; un narcótico provoca la pérdida de conciencia en distintos grados, como ocurre con el beleño, el hachís y el opio. La mayoría de los juristas prohíben el consumo de narcóticos que nublan la mente, distinguen entre su uso terapéutico y su uso injustificado, y abordan la pureza, la venta, la validez de los actos y la pena. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4806}"
  fr: "Le takhdir est un engourdissement qui affecte certains membres ou tout le corps; un narcotique provoque une perte de conscience d'intensité variable, comme c'est le cas pour la jusquiame, le haschisch et l'opium. La plupart des juristes interdisent la consommation de narcotiques qui altèrent l'esprit, distinguent l'usage thérapeutique de l'usage injustifié et abordent les questions de pureté, de vente, de validité des actes et de sanction. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4806}"
  ur: "تقدیر ایک بے حسی ہے جو کچھ اعضاء یا پورے جسم پر آجاتی ہے۔ ایک نشہ آور چیز ایک شخص کو مختلف ڈگریوں میں ہوش کھو دیتی ہے، جیسا کہ ہین بین، چرس اور افیون کے ساتھ۔ اکثر فقہاء دماغ پر بادل ڈالنے والی منشیات لینے سے منع کرتے ہیں، علاج کے لیے استعمال کو بغیر عذر کے استعمال سے الگ کرتے ہیں، اور پاکیزگی، خریدوفروخت، اعمال کے جواز اور سزا پر بحث کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4804} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4805}"
  tr: "Anestezi, bazı organları veya tüm vücudu kaplayan bir gevşemedir. Narkotik, kişinin bilinç kaybına farklı derecelerde neden olur; örneğin haşiş, haşiş ve afyon. Hukukçuların çoğu, akıl hastalığına yol açan ilaçların kullanımını yasaklar; tıbbi amaçlarla almak ile mazeretsiz kullanmak arasında ayrım yapar ve saflık, satış, davranış ve ceza konularını tartışırlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4806}"
  id: "Anestesi adalah relaksasi yang mencakup beberapa organ atau seluruh tubuh. Narkotika menyebabkan seseorang kehilangan kesadaran dalam berbagai tingkat, seperti hashish, hashish, dan opium. Mayoritas ahli hukum melarang penggunaan obat yang menyebabkan kegilaan, membedakan antara mengonsumsinya untuk tujuan medis dan menggunakannya tanpa alasan, serta membahas kemurnian, penjualan, perilaku, dan hukuman. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4806}"
