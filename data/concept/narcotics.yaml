summary:
  ar: "التخدير استرخاء يغشى بعض الأعضاء أو الجسد كله، والمخدِّر ما يُفقد الإنسان الوعي بدرجات مختلفة كالبنج والحشيش والأفيون. جمهور الفقهاء على تحريم تناول المخدرات المغيِّبة للعقل، ويفرّقون بين تناولها للتداوي وتناولها بلا عذر، ويبحثون في الطهارة والبيع والتصرفات والعقوبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4806}"
  en: "Takhdir is a numbness that comes over some limbs or the whole body; a narcotic makes a person lose consciousness in varying degrees, as with henbane, hashish and opium. Most jurists forbid taking narcotics that cloud the mind, distinguish use for treatment from use without excuse, and discuss purity, sale, the validity of acts and penalty. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4806}"
