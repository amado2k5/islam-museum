id: concept/mal-al-malinkhuliya
class: concept
kind: scientific
label:
  ar: "مآل المالنخوليا"
  en: "Course and outlook of melancholia"
  ur: "مالنخولیا کا انجام"
summary:
  ar: "يذكر ابن سينا ما يدل في المالنخوليا على الخير أو الموت: أسلمها ما كان عن عكر الدم ومع فرح، وانحلالها بالبواسير والدوالي، وظهور السوداء المتحركة في القيء والبراز، والقروح علامة موت قريب {cite:canon-ibn-sina-print-v2 p.105} {cite:canon-ibn-sina-print-v2 p.110} {cite:canon-ibn-sina-print-v2 p.111}"
  en: "Ibn Sina gives what points in melancholia to good or to death: the safest is from the dregs of blood and with joy, it resolves by piles and varicose veins, black bile that moves shows in the vomit and stool, and sores on the body are a sign of near death {cite:canon-ibn-sina-print-v2 p.105} {cite:canon-ibn-sina-print-v2 p.110} {cite:canon-ibn-sina-print-v2 p.111}"
  ur: "ابن سینا بتاتا ہے کہ مالنخولیا میں کیا بھلائی یا موت کی طرف اشارہ کرتا ہے: سب سے محفوظ وہ ہے جو خون کی تلچھٹ سے ہو اور خوشی کے ساتھ ہو، یہ بواسیر اور دوالی سے حل ہوتا ہے، حرکت کرنے والا سودا قے اور فضلے میں ظاہر ہوتا ہے، اور بدن پر پھوڑے قریبی موت کی علامت ہیں {cite:canon-ibn-sina-print-v2 p.105} {cite:canon-ibn-sina-print-v2 p.110} {cite:canon-ibn-sina-print-v2 p.111}۔"
