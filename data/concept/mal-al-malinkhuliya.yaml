id: concept/mal-al-malinkhuliya
class: concept
kind: scientific
label:
  ar: "مآل المالنخوليا"
  en: "Course and outlook of melancholia"
  ur: "مالنخولیا کا انجام"
  es: "Evolución y pronóstico de la melancolía"
  fr: "Évolution et perspectives de la mélancolie"
  tr: "Melankolinin Kaderi"
  id: "Nasib melankolia"
summary:
  ar: "يذكر ابن سينا ما يدل في المالنخوليا على الخير أو الموت: أسلمها ما كان عن عكر الدم ومع فرح، وانحلالها بالبواسير والدوالي، وظهور السوداء المتحركة في القيء والبراز، والقروح علامة موت قريب {cite:canon-ibn-sina-print-v2 p.105} {cite:canon-ibn-sina-print-v2 p.110} {cite:canon-ibn-sina-print-v2 p.111}"
  en: "Ibn Sina gives what points in melancholia to good or to death: the safest is from the dregs of blood and with joy, it resolves by piles and varicose veins, black bile that moves shows in the vomit and stool, and sores on the body are a sign of near death {cite:canon-ibn-sina-print-v2 p.105} {cite:canon-ibn-sina-print-v2 p.110} {cite:canon-ibn-sina-print-v2 p.111}"
  ur: "ابن سینا بتاتا ہے کہ مالنخولیا میں کیا بھلائی یا موت کی طرف اشارہ کرتا ہے: سب سے محفوظ وہ ہے جو خون کی تلچھٹ سے ہو اور خوشی کے ساتھ ہو، یہ بواسیر اور دوالی سے حل ہوتا ہے، حرکت کرنے والا سودا قے اور فضلے میں ظاہر ہوتا ہے، اور بدن پر پھوڑے قریبی موت کی علامت ہیں {cite:canon-ibn-sina-print-v2 p.105} {cite:canon-ibn-sina-print-v2 p.110} {cite:canon-ibn-sina-print-v2 p.111}۔"
  es: "Ibn Sina da a entender qué indicios de melancolía apuntan al bien o a la muerte: lo más seguro es la ausencia de heces de sangre y la alegría, se resuelve con hemorroides y varices, la bilis negra que se mueve se manifiesta en el vómito y las heces, y las llagas en el cuerpo son un signo de muerte inminente {cite:canon-ibn-sina-print-v2 p.105} {cite:canon-ibn-sina-print-v2 p.110} {cite:canon-ibn-sina-print-v2 p.111}"
  fr: "Ibn Sina indique ce qui, dans la mélancolie, présage le meilleur ou le pire: le plus sûr est de s’en détacher avec joie; elle se résout par les hémorroïdes et les varices, la bile noire qui circule se manifeste dans les vomissements et les selles, et les plaies sur le corps sont un signe de mort imminente. {cite:canon-ibn-sina-print-v2 p.105} {cite:canon-ibn-sina-print-v2 p.110} {cite:canon-ibn-sina-print-v2 p.111}"
  tr: "İbn Sina, melankolide iyilik ya da ölümü gösteren şeylerden bahseder: bu, bulanık kandan ve sevinçten daha güvenlidir, hemoroid ve varislerle çözülmesi, kusmuk ve dışkıda hareketli siyah lekelerin ortaya çıkması ve ülserler yakın ölümün işaretleridir {cite:canon-ibn-sina-print-v2 s.105} {cite:canon-ibn-sina-print-v2 s.110} {cite:canon-ibn-sina-print-v2 s.111}"
  id: "Ibn Sina menyebutkan apa yang menunjukkan baik atau kematian dalam kesedihan: lebih aman daripada darah keruh dan dengan sukacita, larutnya dengan wasir dan varises, munculnya bintik hitam bergerak di muntahan dan feses, serta tukak lambung adalah tanda kematian yang akan datang {cite:canon-ibn-sina-print-v2 hlm.105} {cite:canon-ibn-sina-print-v2 hlm.110} {cite:canon-ibn-sina-print-v2 hlm.111} {cite:canon-ibn-sina-print-v2 hlm.111}"
