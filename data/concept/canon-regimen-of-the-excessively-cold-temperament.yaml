id: concept/canon-regimen-of-the-excessively-cold-temperament
class: concept
kind: scientific
label:
  ar: "تدبير المزاج الأزيد برودة عند ابن سينا"
  en: "The regimen of the excessively cold temperament in the Canon"
  fr: "Régime du tempérament excessivement froid dans le Canon"
  ur: "زیادہ سرد مزاج کی تدبیر قانون میں"
  es: "El régimen del temperamento excesivamente frío en el Canon"
summary:
  ar: "يذكر ابن سينا في الفصل الثاني أن أصناف الأزيد برودة ثلاثة، فمن كان معتدل المنفعلتين قصد إنهاض حرارته بأغذية حارة متوسطة في الرطوبة واليبس وبالأدهان المسخنة والمعاجين الكبار والاستفراغات الخاصة بالرطوبات والاستحمامات المعرقة والرياضات الصالحة، ومن به يبس مع ذلك فتدبيره بعينه تدبير المشايخ {cite:canon-ibn-sina-print-v1 p.256}."
  en: "In the second chapter Ibn Sina says the colder-than-balanced fall into three kinds; one who is balanced in the passive qualities aims to rouse his heat with warm foods moderate in moisture and dryness, warming oils, the great electuaries, evacuations specific to the moistures, sweating baths and suitable exercise; one with dryness besides has exactly the regimen of the old {cite:canon-ibn-sina-print-v1 p.256}."
  fr: "Au chapitre 2, Ibn Sina distingue trois types plus froids que l’équilibre. Celui dont les qualités passives sont équilibrées chercherait à ranimer sa chaleur par aliments chauds modérés en humidité et sécheresse, huiles réchauffantes, grands électuaires, évacuations propres aux humidités, bains sudorifiques et exercice adapté. Celui qui présente aussi de la sécheresse suivrait exactement le régime des personnes âgées {cite:canon-ibn-sina-print-v1 p.256}."
  es: "En el segundo capítulo, Ibn Sina dice que los más fríos que equilibrados caen en tres tipos; uno que está equilibrado en las cualidades pasivas busca despertar su calor con alimentos calientes moderados en humedad y sequedad, aceites calientes, los grandes electuarios, evacuaciones específicas para las humedades, baños de sudoración y ejercicio adecuado; uno con sequedad además tiene exactamente el régimen del antiguo {cite:canon-ibn-sina-print-v1 p.256}."
