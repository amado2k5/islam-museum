label: { ar: "تدبير المزاج الأزيد برودة عند ابن سينا", en: "The regimen of the excessively cold temperament in the Canon", ur: "زیادہ سرد مزاج کی تدبیر قانون میں" }
summary:
  ar: "يذكر ابن سينا في الفصل الثاني أن أصناف الأزيد برودة ثلاثة، فمن كان معتدل المنفعلتين قصد إنهاض حرارته بأغذية حارة متوسطة في الرطوبة واليبس وبالأدهان المسخنة والمعاجين الكبار والاستفراغات الخاصة بالرطوبات والاستحمامات المعرقة والرياضات الصالحة، ومن به يبس مع ذلك فتدبيره بعينه تدبير المشايخ {cite:canon-ibn-sina-print-v1 p.256}."
  en: "In the second chapter Ibn Sina says the colder-than-balanced fall into three kinds; one who is balanced in the passive qualities aims to rouse his heat with warm foods moderate in moisture and dryness, warming oils, the great electuaries, evacuations specific to the moistures, sweating baths and suitable exercise; one with dryness besides has exactly the regimen of the old {cite:canon-ibn-sina-print-v1 p.256}."
