label: { ar: "أحكام أراضي الخراج", en: "The Law of Kharaj Lands" }
summary:
  ar: "نقل البلاذري أقوال الفقهاء في أرض العنوة كالسواد والشام: فعند أبي يوسف إن قسمها الإمام بين الغالبين فهي أرض عشر وأهلها رقيق، وإن لم يقسمها وردها للمسلمين كما فعل عمر بالسواد فعلى رقاب أهلها الجزية وعلى الأرض الخراج وليسوا برقيق وهو قول أبي حنيفة، وروي عن سفيان الثوري مثله. وعند مالك وابن أبي ذئب إذا أسلم كافر من أهل العنوة أقرت أرضه في يده يعمرها ويؤدي خراجها. واختلفوا في اجتماع الخراج والزكاة على أهل العنوة فمنعوه أبو حنيفة وأجازوه مالك وابن أبي ذئب وسفيان وابن أبي ليلى والأوزاعي، وفي تكرار الزرع في السنة اكتفى الأكثرون بخراج واحد وطالب ابن أبي ليلى وابن أبي سبرة بخراج كل غلة. وأجمعوا تقريباً على إلزام المعطل للأرض بزرعها أو دفعها لمن يزرعها، وعلى إسقاط الخراج عند آفة أو غرق، واختلفوا في تعطيلها سنتين وبناء الحوانيت والبساتين عليها وفي إحياء الموات منها: فأرض تسقى ماء الخراج خراجية عند أبي يوسف ومن استنبط عيناً أو سقى من السماء فعشرية، وقال بشر هي عشرية بأي ماء سقيت. وأجازوا سوقاً في أرض الخراج التي لا تنسب لأحد، وفي السنن العجمية القديمة أبقى أبو سيف ما لم يبطله الإسلام وغيره مالك والشافعي ولو قدمت."
  en: "Baladhuri's digest of the jurists on 'anwa land like the Sawad and al-Sham: Abu Yusuf — if the imam divides it among the conquerors it is 'ushr-land and its folk raqiq; if he leaves it for the Muslims as Umar did the Sawad, jizya on their necks and kharaj on the land — Abu Hanifa's view, ascribed also to Sufyan al-Thawri. Malik and Ibn Abi Dhi'b: a convert keeps his land, working it and paying kharaj. On kharaj-plus-zakah they split (Abu Hanifa forbids the union; Malik, Ibn Abi Dhi'b, Sufyan, Ibn Abi Layla, al-Awza'i allow it), likewise on repeated crops (one kharaj vs Ibn Abi Layla's per-harvest), on a year's neglect (replant or yield it), blight and drowning (kharaj drops), mawat revived ('ushr if rain- or spring-fed, kharaj if fed by kharaj-water), and on old Persian customs (Abu Sa'd preserves what Islam did not annul; Malik and al-Shafi'i abolish them however old)."
