label: { ar: "أحكام أراضي الخراج", en: "The Law of Kharaj Lands", es: "La Ley de Tierras Kharaj", fr: "La loi sur les terres de Kharaj", ur: "خارج زمینوں کا قانون", tr: "Kharaj topraklarındaki kurallar", id: "Aturan atas tanah Kharaj" }
summary:
  ar: "نقل البلاذري أقوال الفقهاء في أرض العنوة كالسواد والشام: فعند أبي يوسف إن قسمها الإمام بين الغالبين فهي أرض عشر وأهلها رقيق، وإن لم يقسمها وردها للمسلمين كما فعل عمر بالسواد فعلى رقاب أهلها الجزية وعلى الأرض الخراج وليسوا برقيق وهو قول أبي حنيفة، وروي عن سفيان الثوري مثله. وعند مالك وابن أبي ذئب إذا أسلم كافر من أهل العنوة أقرت أرضه في يده يعمرها ويؤدي خراجها. واختلفوا في اجتماع الخراج والزكاة على أهل العنوة فمنعوه أبو حنيفة وأجازوه مالك وابن أبي ذئب وسفيان وابن أبي ليلى والأوزاعي، وفي تكرار الزرع في السنة اكتفى الأكثرون بخراج واحد وطالب ابن أبي ليلى وابن أبي سبرة بخراج كل غلة. وأجمعوا تقريباً على إلزام المعطل للأرض بزرعها أو دفعها لمن يزرعها، وعلى إسقاط الخراج عند آفة أو غرق، واختلفوا في تعطيلها سنتين وبناء الحوانيت والبساتين عليها وفي إحياء الموات منها: فأرض تسقى ماء الخراج خراجية عند أبي يوسف ومن استنبط عيناً أو سقى من السماء فعشرية، وقال بشر هي عشرية بأي ماء سقيت. وأجازوا سوقاً في أرض الخراج التي لا تنسب لأحد، وفي السنن العجمية القديمة أبقى أبو سيف ما لم يبطله الإسلام وغيره مالك والشافعي ولو قدمت."
  en: "Baladhuri's digest of the jurists on 'anwa land like the Sawad and al-Sham: Abu Yusuf — if the imam divides it among the conquerors it is 'ushr-land and its folk raqiq; if he leaves it for the Muslims as Umar did the Sawad, jizya on their necks and kharaj on the land — Abu Hanifa's view, ascribed also to Sufyan al-Thawri. Malik and Ibn Abi Dhi'b: a convert keeps his land, working it and paying kharaj. On kharaj-plus-zakah they split (Abu Hanifa forbids the union; Malik, Ibn Abi Dhi'b, Sufyan, Ibn Abi Layla, al-Awza'i allow it), likewise on repeated crops (one kharaj vs Ibn Abi Layla's per-harvest), on a year's neglect (replant or yield it), blight and drowning (kharaj drops), mawat revived ('ushr if rain- or spring-fed, kharaj if fed by kharaj-water), and on old Persian customs (Abu Sa'd preserves what Islam did not annul; Malik and al-Shafi'i abolish them however old)."
  es: "Resumen de Baladhuri de los juristas sobre la tierra 'anwa como Sawad y al-Sham: Abu Yusuf: si el imán la divide entre los conquistadores es tierra 'ushr y su gente raqiq; si la deja para los musulmanes como Umar hizo con Sawad, jizya sobre sus cuellos y kharaj sobre la tierra. Opinión de Abu Hanifa, atribuida también a Sufyan al-Thawri. Malik e Ibn Abi Dhi'b: un converso conserva su tierra, la trabaja y paga kharaj. En cuanto al kharaj más el zakat, discrepan (Abu Hanifa prohíbe la unión; Malik, Ibn Abi Dhi'b, Sufyan, Ibn Abi Layla y al-Awza'i la permiten), así también en cuanto a las cosechas repetidas (un kharaj frente al kharaj por cosecha de Ibn Abi Layla), en cuanto a un año de abandono (replantar o dejarlo), plagas e inundaciones (el kharaj cae), mawat revivido ('ushr si se alimenta de lluvia o manantial, kharaj si se alimenta con agua de kharaj), y en cuanto a las antiguas costumbres persas (Abu Sa'd conserva lo que el Islam no anuló; Malik y al-Shafi'i las abolen por muy antiguas que sean)."
  fr: "Le résumé de Baladhuri sur les juristes concernant les terres d'anwa, comme celles des Sawad et d'al-Sham: Abu Yusuf — si l'imam les divise entre les conquérants, il s'agit de terres d'ushr et ses habitants de terres raqiq; s'il les laisse aux musulmans, comme Umar l'a fait pour les Sawad, la jizya est due et le kharaj est prélevé sur la terre — avis d'Abu Hanifa, également attribué à Sufyan al-Thawri. Malik et Ibn Abi Dhi'b: un converti conserve sa terre, la cultive et paie le kharaj. Sur la question du kharaj plus zakah, les avis divergent (Abu Hanifa interdit cette union; Malik, Ibn Abi Dhi'b, Sufyan, Ibn Abi Layla et al-Awza'i l'autorisent), de même sur les récoltes répétées (un kharaj contre un par récolte selon Ibn Abi Layla), sur une année de négligence (replanter ou la perdre), sur la rouille et la noyade (le kharaj est perdu), sur la mawat ravivée ('ushr si elle est alimentée par la pluie ou une source, kharaj si elle est alimentée par l'eau du kharaj), et sur les anciennes coutumes persanes (Abu Sa'd préserve ce que l'Islam n'a pas annulé; Malik et al-Shafi'i les abolissent, quelle que soit leur ancienneté)."
  ur: "سواد اور الشام کی طرح انواء سرزمین پر بلادوری کا فقہا کا ڈائجسٹ: ابو یوسف - اگر امام اسے فاتحین میں تقسیم کرتا ہے تو یہ عشر زمین اور اس کا لوک رقیق ہے۔ اگر وہ اسے مسلمانوں کے لیے چھوڑ دے جیسا کہ عمر نے سواد کیا، ان کی گردنوں پر جزیہ اور زمین پر خرج - ابو حنیفہ کا قول، سفیان الثوری سے بھی منسوب ہے۔ مالک اور ابن ابی ذہب: مذہب تبدیل کرنے والا اپنی زمین رکھتا ہے، اس پر کام کرتا ہے اور خرج ادا کرتا ہے۔ خرج جمع زکوٰۃ پر وہ تقسیم ہو جاتے ہیں ⁦(ابو حنیفہ نے اتحاد سے منع کیا ہے، مالک، ابن ابی ذہب، سفیان، ابن ابی لیلیٰ، الاوزاعی اس کی اجازت دیتے ہیں)⁩، اسی طرح بار بار فصلوں پر ⁦(ایک خرج بمقابلہ ابن ابی لیلیٰ کی فی فصل)⁩، ایک سال کی کم یا کم پیداوار پر، ⁦(خراج کے قطرے)⁩، موات کو زندہ کیا ⁦('عشر اگر بارش- یا بہار سے، خراج اگر پانی سے پلایا جائے)⁩، اور پرانے فارسی رسم و رواج پر ⁦(ابو سعد نے اسے محفوظ کیا جسے اسلام نے منسوخ نہیں کیا؛ مالک اور الشافعی انہیں ختم کر دیتے ہیں چاہے وہ پرانے ہوں)⁩۔"
  tr: "El-Baladhuri, Enve'nin toprakları hakkındaki hukukçuların görüşlerini, örneğin El-Savud ve Şam'ı aktarmıştır: Ebu Yusuf'a göre, İmam toprakları iki egemen arasında bölerse, toprak on olur ve halkı köledir. Eğer Ebu Yusuf, Ömer'in El-Savad'a yaptığı gibi bölmez ve Müslümanlara geri vermezse, cizye halkının boynunda olur ve toprak vergilendirilir, köle değil, ki bu Ebu Hanifa'nın görüşüdür. Sufyan el-Tevri de aynı şeyi rivayet etmiştir. Malik ve İbn Ebi Di'b'e göre, Eğer 'Anwa halkından bir gayrimüslim İslam'ı benimserse, toprağı onun elinde tanınır, onu ekim yapar ve vergisini öder. Enve halkı üzerinde kharaj ve zekatın birleşimi konusunda anlaşmazlık yaşadılar, bu yüzden Ebu Hanife bunu yasakladı, Malik, İbn Ebi Di'b, Sufyan, İbn Ebi Leyla ve El-Avzai ise izin verdi. Sünnette tekrar eden tarımda, çoğu kişi bir kharacla yeterken, İbn Ebi Leyla ve İbn Ebi Sabra her verim için bir khaz talep etti. Neredeyse oybirliğiyle, yükümlülerin toprağı işlemesi veya çiftçiye ödemesi ve felaket ya da sel durumunda verginin kaldırılması konusunda anlaştılar. İki yıl boyunca askıya alınıp askıya alınmayacağı, üzerine dükkanlar ve meyve bahçeleri inşa edilip edilmeyeceği ve ölü toprakların diriltileceği konusunda görüş ayrılığı yaşadılar: 'Kharaj suyuyla sulanan arazi, Ebu Yusuf'a göre kharajiyah sayılır' ve kim kaynak çekerse ya da gökten sularsa 'tihr'dir. Bişr, bunun sulanan herhangi bir su olan bir 'tihr' olduğunu söyledi. Kharaj arazisinde kimseye atfedilmeyen bir pazara izin verdiler. Eski Arap olmayan geleneklerde, Ebu Saif, İslam ve diğerlerinin Malik ve Al-Shafi'i tarafından geçersiz kılmadığı şeyleri, daha önce gelmiş olsa bile, korudu."
  id: "Al-Baladhuri menyampaikan pendapat para ahli hukum mengenai tanah 'Anwah, seperti Al-Sawad dan Al-Sham: Menurut Abu Yusuf, jika Imam membaginya di antara dua dominan, maka itu adalah sepuluh tanah dan rakyatnya adalah budak. Jika ia tidak membaginya dan mengembalikannya kepada umat Muslim seperti yang dilakukan Umar terhadap Al-Sawad, maka jizya akan dikenakan pajak kepada rakyatnya dan tanah itu dikenakan pajak, bukan budak, seperti pandangan Abu Hanifa. Sufyan al-Thawri juga menceritakan hal yang sama. Menurut Malik dan Ibn Abi Dhi'bbi'b., jika seorang non-Muslim dari masyarakat 'Anwa memeluk Islam, tanahnya diakui di tangannya, ia mengolah dan membayar pajaknya. Mereka berbeda pendapat mengenai kombinasi kharaj dan zakat terhadap masyarakat 'Anwah, sehingga Abu Hanifa melarangnya, sementara Malik, Ibn Abi Dhi'b, Sufyan, Ibn Abi Layla, dan Al-Awza'i mengizinkannya. Dalam pemumaatan berulang dalam Sunnah, kebanyakan hanya memiliki satu kharaj, sementara Ibn Abi Layla dan Ibn Abi Sabra menuntut satu kharaj untuk setiap hasil panen. Mereka hampir sepakat sepakat untuk mewajibkan pengutang untuk mengolah tanah atau membayarnya kepada petani, dan membebaskan pajak jika terjadi bencana atau banjir. Mereka berbeda pendapat apakah harus ditangguhkan selama dua tahun, serta membangun toko dan kebun buah di atasnya, serta menghidupkan kembali lahan mati dari sana: 'Tanah yang diairi dengan air kharaj dianggap sebagai kharajiyah' menurut Abu Yusuf, dan siapa pun yang menarik mata air atau mengairi dari langit adalah 'tihr'. Bishr mengatakan itu adalah 'tihr' dengan air yang diairi. Mereka mengizinkan pasar di tanah kharaj yang tidak dikaitkan dengan siapa pun. Dalam tradisi non-Arab lama, Abu Saif mempertahankan apa yang Islam dan lainnya tidak dibatalkan oleh Malik dan Al-Shafi'i, meskipun itu datang lebih awal."
