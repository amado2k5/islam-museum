label:
  ar: "الشعيرة"
  en: "The stye (sha'ira)"
  ur: "شعیرہ"
summary:
  ar: "الشعيرة ورم مستطيل يظهر على حرف الجفن يشبه الشعير في شكله، ومادته في الأكثر دم غالب، ويعالج بالفصد والاستفراغ ثم بما يوصف عليه من كمادات ولطوخ {cite:canon-ibn-sina-print-v2 p.196}"
  en: "The stye is an oblong swelling appearing on the edge of the eyelid, resembling a barley grain in shape; its matter is mostly predominating blood, and it is treated by venesection and evacuation, then by the compresses and liniments described for it {cite:canon-ibn-sina-print-v2 p.196}"
  ur: "شعیرہ پلک کے کنارے پر ظاہر ہونے والی ایک لمبی سوجن ہے جو صورت میں جو کے دانے جیسی ہوتی ہے، اور اس کی مادہ اکثر غالب خون ہوتی ہے؛ اس کا علاج فصد اور استفراغ سے ہے، پھر وہ کمڑیاں اور لطوخ جو اس پر مقرر کی گئی ہیں {cite:canon-ibn-sina-print-v2 p.196}۔"
