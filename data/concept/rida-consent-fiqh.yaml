id: concept/rida-consent-fiqh
class: concept
kind: doctrine
label:
  ar: "الرضا (في العقود)"
  en: "Rida' (consent in contracts): its meaning, its place among the choices of the Hanafis and the majority, its defects, and its means of expression"
  ur: "رضا (عقود میں)"
summary:
  ar: "الرضا في اللغة سرور القلب وطيب النفس، وفي الاصطلاح عند الحنفية امتلاء الاختيار حتى يظهر أثره، وعند الجمهور قصد الفعل دون إكراه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8752} ويفرّق الحنفية بين الاختيار والرضا، فيكون الاختيار صحيحا مع الإكراه غير الملجئ، ويكون الرضا فاسدا معه، وترتب على ذلك صحة عقود مثل الطلاق والنكاح والرجعة دون رضا عند الحنفية، ويرى الجمهور أن القصد والرضا أساس العقود كلها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8753} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8754} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8755} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8756} وحل أموال الناس منوط بالرضا لقوله تعالى: إلا أن تكون تجارة عن تراض منكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8757} وتعيب الرضا الإكراه والجهل والغلط والتدليس والاستغلال، ويؤثر بعضها في صحة العقد وبعضها في لزومه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8758} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8759} والرضا أمر باطن يُعبَّر عنه باللفظ، أو الفعل، أو الكتابة، أو الإشارة، أو السكوت في معرض البيان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8759} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8760} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8761} ويجوز سكوت البكر إذنا في النكاح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8761}"
  en: "Rida' in the lexicon is contentment and a glad heart; in the Hanafi usage it is the choice brought to its full end so that its effect shows, and for the majority it is intent to do an act without coercion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8752} The Hanafis distinguish choice from consent: a choice is valid under coercion short of compulsion, while consent is defective under it, so marriage, divorce and return are valid without consent in their view; the majority hold intent and consent the basis of all contracts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8753} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8754} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8755} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8756} The lawful taking of another's property depends on consent, by the verse 'unless it be trade by mutual consent'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8757} Defects of consent are coercion, ignorance, error, deception and exploitation; some make a contract void and others only open to annulment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8758} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8759} Consent is inward and is expressed by word, act, writing, sign, or silence in a place where speech is needed; a virgin's silence counts as consent to marriage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8759} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8760} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8761}"
  ur: "رضا دل کی رضامندی ہے اور اس کا اظہار لفظ، عمل، تحریر یا اشارے سے ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8752} مال کا تبادلہ باہمی رضا سے ہی حلال ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8757} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8759}"
