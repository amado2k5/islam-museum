label:
  ar: "الرضا ⁦(في العقود)⁩"
  en: "Rida' (consent in contracts): its meaning, its place among the choices of the Hanafis and the majority, its defects, and its means of expression"
  ur: "رضا ⁦(عقود میں)⁩"
  es: "Rida' (consentimiento en los contratos): su significado, su lugar entre las opciones de los hanafíes y la mayoría, sus defectos y sus medios de expresión."
  fr: "Rida' (consentement contractuel): sa signification, sa place parmi les choix des hanafites et de la majorité, ses défauts et ses moyens d'expression"
  tr: "Memnuniyet (sözleşmelerde)"
  id: "Kepuasan (dalam kontrak)"
summary:
  ar: "الرضا في اللغة سرور القلب وطيب النفس، وفي الاصطلاح عند الحنفية امتلاء الاختيار حتى يظهر أثره، وعند الجمهور قصد الفعل دون إكراه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8752} ويفرّق الحنفية بين الاختيار والرضا، فيكون الاختيار صحيحا مع الإكراه غير الملجئ، ويكون الرضا فاسدا معه، وترتب على ذلك صحة عقود مثل الطلاق والنكاح والرجعة دون رضا عند الحنفية، ويرى الجمهور أن القصد والرضا أساس العقود كلها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8753} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8754} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8755} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8756} وحل أموال الناس منوط بالرضا لقوله تعالى: إلا أن تكون تجارة عن تراض منكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8757} وتعيب الرضا الإكراه والجهل والغلط والتدليس والاستغلال، ويؤثر بعضها في صحة العقد وبعضها في لزومه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8758} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8759} والرضا أمر باطن يُعبَّر عنه باللفظ، أو الفعل، أو الكتابة، أو الإشارة، أو السكوت في معرض البيان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8759} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8760} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8761} ويجوز سكوت البكر إذنا في النكاح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8761}"
  en: "Rida' in the lexicon is contentment and a glad heart; in the Hanafi usage it is the choice brought to its full end so that its effect shows, and for the majority it is intent to do an act without coercion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8752} The Hanafis distinguish choice from consent: a choice is valid under coercion short of compulsion, while consent is defective under it, so marriage, divorce and return are valid without consent in their view; the majority hold intent and consent the basis of all contracts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8753} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8754} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8755} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8756} The lawful taking of another's property depends on consent, by the verse 'unless it be trade by mutual consent'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8757} Defects of consent are coercion, ignorance, error, deception and exploitation; some make a contract void and others only open to annulment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8758} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8759} Consent is inward and is expressed by word, act, writing, sign, or silence in a place where speech is needed; a virgin's silence counts as consent to marriage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8759} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8760} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8761}"
  ur: "رضا دل کی رضامندی ہے اور اس کا اظہار لفظ، عمل، تحریر یا اشارے سے ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8752} مال کا تبادلہ باہمی رضا سے ہی حلال ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8757} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8759}"
  es: "Rida' en el léxico significa contentamiento y alegría; en el uso hanafí, es la elección llevada a su plena realización de manera que se manifieste su efecto, y para la mayoría es la intención de realizar un acto sin coacción. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8752} Los hanafíes distinguen la elección del consentimiento: una elección es válida bajo coacción sin llegar a la compulsión, mientras que el consentimiento es defectuoso bajo ella, por lo que el matrimonio, el divorcio y el regreso son válidos sin consentimiento en su opinión; la mayoría sostiene que la intención y el consentimiento son la base de todos los contratos. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8753} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8754} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8755} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8756} La toma legal de la propiedad de otra persona depende del consentimiento, según el versículo 'a menos que sea un intercambio por consentimiento mutuo'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8757} Los defectos del consentimiento son la coerción, la ignorancia, el error, el engaño y la explotación; algunos anulan un contrato y otros sólo se prestan a la anulación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8758} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8759} El consentimiento es interno y se expresa mediante palabra, acto, escritura, signo o silencio en un lugar donde se necesita la palabra; El silencio de una virgen cuenta como consentimiento al matrimonio. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8759} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8760} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8761}"
  fr: "Le terme « rida » désigne, dans le lexique, le contentement et la joie; dans l’usage hanafite, il s’agit du choix mené à son terme, de sorte que ses effets soient manifestes; et pour la majorité, il désigne l’intention d’accomplir un acte sans contrainte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8752} Les hanafites distinguent le choix du consentement: un choix est valable sous contrainte, sauf en cas de force majeure, tandis que le consentement est vicié par celle-ci. Ainsi, le mariage, le divorce et le retour sont, selon eux, valides sans consentement. La majorité considère que l’intention et le consentement constituent le fondement de tout contrat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8753} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8754} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8755} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8756} La prise licite de la propriété d'autrui dépend du consentement, par le verset « à moins qu'il ne s'agisse d'un commerce par consentement mutuel ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8757} Les défauts du consentement sont la coercition, l'ignorance, l'erreur, la tromperie et l'exploitation; certains annulent un contrat et d’autres ne peuvent qu’être annulés. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8758} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8759} Le consentement est intérieur et s'exprime par la parole, l'acte, l'écriture, le signe ou le silence dans un endroit où la parole est nécessaire; le silence d'une vierge vaut consentement au mariage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8759} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8760} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8761}"
  tr: "Dilbilimde, 'rıza kalbin sevinci ve ruhun hoşluğu anlamına gelir.' Hanefi terminolojisinde, seçimin etkisi ortaya çıkana kadar gerçekleşmesidir ve çoğunluğa göre, zorlamadan hareket etme niyeti anlamına gelir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.8752} Hanefi okulu seçim ile rızayı ayırır: seçim, başvurusuz zorlama ile geçerlidir, rıza ise onay ile geçersizdir. Rıza geçersizdir ve bu, Hanefilere göre boşanma, evlilik ve rıza olmadan uzlaşma gibi sözleşmelerin geçerliliğine yol açar. Çoğunluk, niyet ve rızanın tüm sözleşmelerin temeli olduğuna inanır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8753} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8754} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8755} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8756} İnsanların servetinin caiz edilebilirliği, Allah'ın dediği gibi, rızaya bağlıdır: \"Karşılıklı rızayla ticaret değilse.\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8757} Rızanın kusuru zorlama, cehalet, hata, dolandırıcılık ve sömürüdür; bazıları sözleşmenin geçerliliğini etkilerken, bazıları bağlılığını etkiler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8758} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8759} Tatmin, ifade sırasında sözlü, eylemde, yazıda, jestte veya sessizlikte ifade edilen içsel bir konudur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8759} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8760} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8761} Bakirenin evlilikte izin olarak sessiz kalması izinlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8761}"
  id: "Dalam linguistik, 'persetujuan berarti sukacita hati dan kesenangan jiwa.' Dalam terminologi Hanafi, persetujuan adalah pemenuhan pilihan sampai efeknya muncul, dan menurut mayoritas, itu berarti bermaksud bertindak tanpa paksaan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8752} Aliran Hanafi membedakan antara pilihan dan persetujuan: pilihan berlaku dengan paksaan tanpa banding, dan persetujuan tidak sah dengan pilihan tersebut. Persetujuan tidak sah, dan ini mengakibatkan keabsahan kontrak seperti perceraian, pernikahan, dan rekonsiliasi tanpa persetujuan menurut Hanafi. Mayoritas percaya bahwa niat dan persetujuan adalah dasar dari semua kontrak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8753} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8754} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8755} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8756} Kelayakan kekayaan orang bergantung pada persetujuan, seperti yang dikatakan Allah: \"Kecuali itu diperdagangkan atas persetujuan bersama dari kalian.\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8757} Cacat dari persetujuan adalah paksaan, ketidaktahuan, kesalahan, penipuan, dan eksploitasi; beberapa memengaruhi keabsahan kontrak dan beberapa mempengaruhi pengikatannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8758} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8759} Kepuasan adalah materi batin yang diungkapkan secara verbal, dalam tindakan, tulisan, gerak-gerik, atau keheningan dalam proses ekspresi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8759} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8760} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8761} Perawan diperbolehkan untuk diam sebagai izin dalam pernikahan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8761}"
