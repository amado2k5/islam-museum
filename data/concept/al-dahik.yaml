id: concept/al-dahik
class: concept
kind: ethical
tags: [juha-browser, juha-kind-laughter]
label: { ar: "الضحك والتبسم", en: "Laughter and smiling (dahik, tabassum)", ur: "ہنسی اور تبسم", fr: "Le rire et le sourire (dahik, tabassum)", es: "La risa y la sonrisa (dahik, tabassum)" }
summary:
  ar: "الضحك والتبسم يردان في القرآن والسنة على وجوه: ضحك الفرح والبشارة، كضحك امرأة إبراهيم في سورة هود، الآية 71، وتبسم سليمان من قول النملة في سورة النمل، الآية 19، والوجوه الضاحكة المستبشرة في سورة عبس، الآية 39؛ ونسبة الإضحاك والإبكاء إلى الله في سورة النجم، الآية 43؛ وضحك السخرية المذموم في سورة المطففين، الآية 29. وفي الحديث ضحك نبوي حتى بدت النواجذ في خبر آخر أهل الجنة دخولا {cite:sahih-muslim 186}، وضحك من حال الرجل الذي لم يجد أحوج منه إلى الصدقة {cite:muwatta-malik}."
  en: "Laughter and smiling appear in the Qur'an and the Sunnah in several senses: the laughter of joy and good news, as when Abraham's wife laughed in Surat Hud, verse 71, Solomon smiled at the ant's words in Surat al-Naml, verse 19, and faces are laughing and rejoicing in Surat Abasa, verse 39; the attribution of making people laugh and weep to God in Surat al-Najm, verse 43; and the blamed laughter of mockery in Surat al-Mutaffifin, verse 29. In hadith the Prophet laughs until his molars show in the report of the last person to enter Paradise {cite:sahih-muslim 186}, and laughs at the man who found no one needier of the alms than himself {cite:muwatta-malik}."
  ur: "ہنسی اور تبسم قرآن و سنت میں کئی معنوں میں آتے ہیں: خوشی اور بشارت کی ہنسی، جیسے سورۂ ہود آیت 71 میں ابراہیم کی اہلیہ کا ہنسنا، سورۂ نمل آیت 19 میں چیونٹی کی بات پر سلیمان کا مسکرانا، اور سورۂ عبس آیت 39 میں ہنستے خوش چہرے؛ سورۂ نجم آیت 43 میں ہنسانے اور رلانے کی نسبت اللہ کی طرف؛ اور سورۂ مطففین آیت 29 میں تمسخر کی مذموم ہنسی۔ حدیث میں جنت میں سب سے آخر میں داخل ہونے والے کی خبر میں نبی کا اتنا ہنسنا مذکور ہے کہ داڑھیں ظاہر ہو گئیں {cite:sahih-muslim 186}، اور اس شخص کے حال پر ہنسنا جسے صدقے کا اپنے سے زیادہ محتاج کوئی نہ ملا {cite:muwatta-malik}۔"
  fr: "Le rire et le sourire apparaissent dans le Coran et la Sunna en plusieurs sens : le rire de la joie et de la bonne nouvelle, quand l'épouse d'Abraham rit dans la sourate Hud, verset 71, quand Salomon sourit des paroles de la fourmi dans la sourate al-Naml, verset 19, et les visages riants et réjouis de la sourate Abasa, verset 39 ; l'attribution à Dieu de faire rire et pleurer dans la sourate al-Najm, verset 43 ; et le rire blâmé de la moquerie dans la sourate al-Mutaffifin, verset 29. Dans le hadith, le Prophète rit jusqu'à ce que ses molaires paraissent dans le récit du dernier à entrer au Paradis {cite:sahih-muslim 186}, et rit de l'homme qui ne trouva personne de plus nécessiteux que lui pour l'aumône {cite:muwatta-malik}."
  es: "La risa y la sonrisa aparecen en el Corán y la Sunna en varios sentidos: la risa de la alegría y la buena nueva, como cuando la esposa de Abraham rió en la sura Hud, versículo 71, Salomón sonrió ante las palabras de la hormiga en la sura al-Naml, versículo 19, y los rostros rientes y gozosos de la sura Abasa, versículo 39; la atribución a Dios de hacer reír y llorar en la sura al-Najm, versículo 43; y la risa censurada de la burla en la sura al-Mutaffifin, versículo 29. En el hadiz el Profeta ríe hasta que se le ven las muelas en el relato del último en entrar al Paraíso {cite:sahih-muslim 186}, y ríe del hombre que no halló a nadie más necesitado que él para la limosna {cite:muwatta-malik}."
