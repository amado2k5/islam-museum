id: "concept/khuruq-al-qarniyya"
class: "concept"
kind: "scientific"
label:
  ar: "خروق القرنية ونتوء العنبية"
  en: "Ruptures of the cornea and protrusion of the uvea"
  ur: "قرنیہ کے خروق اور عنبیہ کا نتو"
  es: "Roturas de la córnea y protrusión de la úvea."
  fr: "Ruptures de la cornée et protrusion de l'uvée"
  tr: "Kornea köpürmesi ve uvial çıkıntı"
  id: "Efervesensi Kornea dan Protrusi Uvial"
summary:
  ar: "خروق القرنية قد تكون عن قرحة نفذت أو عن سبب من خارج كضربة أو صدمة خارقة فتظهر العنبية، وبحسب العظم والصغر تسمى النملي والمورشارج والذبابي ثم العنبي فالنفاخي فالمسماري الذي يحول بين الجفنين والانطباق وإن ابيضت العنبية فلا برء له، ويفارق النفاخات بأنها صلبة لا تنكبس تحت الميل وعلى لون العنبية {cite:canon-ibn-sina-print-v2 p.178} {cite:canon-ibn-sina-print-v2 p.179}"
  en: "Ruptures of the cornea come from an ulcer that has eaten through or from an outside cause like a blow or piercing impact, whereupon the uvea shows; by size they are named the ant-like or mursharij, the fly-like, then the grape-like, the bladder-like, and the nail-like which bars the lids from closing — and if the uvea turns white there is no cure; they differ from watery bladders in being solid, not yielding under the probe, and keeping the uvea's colour {cite:canon-ibn-sina-print-v2 p.178} {cite:canon-ibn-sina-print-v2 p.179}"
  ur: "قرنیہ کے خروق یا تو ایسے قرحے سے ہوتے ہیں جو چبھ جائے یا بیرونی سبب سے جیسے چوٹ یا چبھونے والا صدمہ، جس پر عنبیہ ظاہر ہوتی ہے؛ بڑائی اور چھوٹائی کے مطابق انہیں نملی یا مرشارج، ذبابی، پھر عنبی، پھر نفاخی اور پھر مسماری کہتے ہیں جو دونوں پلکوں کے ملنے سے روکتا ہے — اور عنبیہ سفید ہو جائے تو اس کا علاج نہیں؛ یہ نفاخات سے اس میں فرق رکھتے ہیں کہ وہ سخت ہیں، میل کے نیچے نہیں دبتے اور عنبیہ کے رنگ پر رہتے ہیں {cite:canon-ibn-sina-print-v2 p.178} {cite:canon-ibn-sina-print-v2 p.179}"
  es: "Las rupturas de la córnea se producen por una úlcera que ha corroído la córnea o por una causa externa como un golpe o impacto punzante, tras lo cual se muestra la úvea; por su tamaño se denominan mursharij o en forma de hormiga, en forma de mosca, en forma de uva, en forma de vejiga y en forma de clavo, que impide que los párpados se cierren; y si la úvea se vuelve blanca, no hay cura; se diferencian de las vejigas acuosas en que son sólidas, no ceden bajo la sonda y mantienen el color de la úvea {cite:canon-ibn-sina-print-v2 p.178} {cite:canon-ibn-sina-print-v2 p.179}"
  fr: "Les ruptures de la cornée sont dues à un ulcère qui l'a traversée ou à une cause externe comme un coup ou un traumatisme pénétrant, laissant apparaître l'uvée. Selon leur taille, elles sont nommées « en forme de fourmi » ou « mursharij », « en forme de mouche », « en forme de raisin », « en forme de vessie » et « en forme d'ongle », cette dernière empêchant la fermeture des paupières. Si l'uvée blanchit, il n'y a pas de traitement. Elles se distinguent des vésicules aqueuses par leur consistance solide, leur résistance à la pression et le maintien de la couleur de l'uvée. {cite:canon-ibn-sina-print-v2 p.178} {cite:canon-ibn-sina-print-v2 p.179}"
  tr: "Kornea yırtıkları, infiltrasyonlu bir ülserden veya bir darbe ya da keskin bir şok gibi dış nedenlerden kaynaklanabilir; bu da uvealın ortaya çıkmasına neden olabilir. Kemiğe ve boyutuna bağlı olarak, önce antular, morcharged ve sinek benzeri form, sonra puffer, sonra çivi yazısı, göz kapakları ile çivi yazısını birbirine bağlayan çivi yazısı olarak adlandırılır ve eğer uveal beyaza dönerse geçersiz sayılmaz. Dolgular sert olmalarıyla ayırt edilir ve uve'nin eğimi veya rengi altında sıkışmazlar. {cite:canon-ibn-sina-print-v2 s.178} {cite:canon-ibn-sina-print-v2 s.179}"
  id: "Lubang kornea dapat disebabkan oleh tukak yang terinfiltrasi atau akibat eksternal seperti benturan atau kejutan tajam, yang menyebabkan munculnya uveal. Tergantung pada tulang dan ukuran, disebut bentuk antular, morcharged, dan seperti lalat, kemudian puffer, kemudian kuneiform, yang menghubungkan kelopak mata dan kuneiform, dan jika uveal berubah menjadi putih, itu tidak tidak berlaku. Puff dibedakan karena kencang dan tidak terkompret di bawah kemiringan atau warna uve. {cite:canon-ibn-sina-print-v2 hlm.178} {cite:canon-ibn-sina-print-v2 hlm.179} {cite:canon-ibn-sina-print-v2 hlm.179}"
