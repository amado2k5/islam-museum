id: "concept/baghd-al-ayn-lil-shaa"
class: "concept"
kind: "scientific"
label:
  ar: "بغض العين للشعاع"
  en: "The eye's hatred of light"
  fr: "L’aversion de l’œil pour la lumière"
  ur: "آنکھ کی روشنی سے کراہت"
  es: "El odio del ojo hacia la luz."
summary:
  ar: "بغض العين للشعاع مما يدل على تسخن الروح واشتعاله وترققه، وينذر كثيراً بقرانيطس إلا أن يكون بسبب جرب الأجفان، وعلاجه ما يعرف من تدبير ذلك {cite:canon-ibn-sina-print-v2 p.216}"
  en: "The eye's hatred of light shows a heating, kindling and thinning of the spirit, and often warns of frenitis unless it is from scab of the lids; its treatment is the known management of that cause {cite:canon-ibn-sina-print-v2 p.216}"
  fr: "Selon le livre, l’aversion de l’œil pour la lumière indique un échauffement, un embrasement et un amincissement du pneuma ; elle annonce souvent une phrénitis, sauf si elle vient d’une gale des paupières. Son traitement est celui, connu, de cette cause {cite:canon-ibn-sina-print-v2 p.216}"
  ur: "آنکھ کی روشنی سے کراہت روح کے گرم ہونے، بھڑکنے اور پتلے ہونے کی دلیل ہے، اور اکثر قرانيطس کی پیش بندی کرتی ہے مگر یہ کہ سبب پپوٹوں کا جرب ہو؛ اور علاج اسی سبب کے معروف تدبیر سے ہے {cite:canon-ibn-sina-print-v2 p.216}"
  es: "El rechazo del ojo a la luz muestra un calentamiento, inflamación y debilitamiento del espíritu, y a menudo advierte de frenitis, a menos que se deba a una costra en los párpados; su tratamiento es el manejo conocido de esa causa {cite:canon-ibn-sina-print-v2 p.216}"
