label: { ar: "أهل الكتاب", en: "People of the Book" }
issue:
  ar: "من هم أهل الكتاب في القرآن، وكيف يُحكم على إيمانهم بالرسل؟"
summary:
  ar: "اليهود والنصارى في خطاب القرآن. يعرض رشيد رضا في تفسير النساء 150-152 أن من يؤمن بالله ويكفر برسله، أو يؤمن ببعض الرسل دون بعض، لا يعدّ إيمانه صحيحاً، ويرى أن ما عليه أهل الكتاب من التعصب الجنسي والسياسي والتقليد ليس إيماناً بالرسالة. وفي تفسير الأنعام 114 يرى أن علماءهم العالمين بكتبهم يعلمون أن القرآن منزل من ربه بالحق. ويجادل رضا في تفسير النساء 153-161 بعبارة ساخرة من تعنت بني إسرائيل في طلب كتاب من السماء. وهذه كلها آراء رضا وحججه في الجدال معهم، وتنسب إليه هنا."
