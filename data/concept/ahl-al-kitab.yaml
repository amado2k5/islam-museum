id: concept/ahl-al-kitab
class: concept
kind: term
label: { ar: "أهل الكتاب", en: "People of the Book" }
issue:
  ar: "من هم أهل الكتاب في القرآن، وكيف يُحكم على إيمانهم بالرسل؟"
summary:
  ar: "اليهود والنصارى في خطاب القرآن. يعرض رشيد رضا في تفسير النساء 150-152 أن من يؤمن بالله ويكفر برسله، أو يؤمن ببعض الرسل دون بعض، لا يعدّ إيمانه صحيحاً، ويرى أن ما عليه أهل الكتاب من التعصب الجنسي والسياسي والتقليد ليس إيماناً بالرسالة. وفي تفسير الأنعام 114 يرى أن علماءهم العالمين بكتبهم يعلمون أن القرآن منزل من ربه بالحق. ويجادل رضا في تفسير النساء 153-161 بعبارة ساخرة من تعنت بني إسرائيل في طلب كتاب من السماء. وهذه كلها آراء رضا وحججه في الجدال معهم، وتنسب إليه هنا."
  en: "The People of the Book, Jews and Christians, in the Qur'an's address. In Rashid Rida's commentary on Surat al-Nisa 150-152, whoever believes in God but disbelieves His messengers, or believes in some messengers and not others, does not have valid faith; Rida holds that the ethnic and political partisanship and blind imitation found among the People of the Book is not faith in the message. In his commentary on Surat al-An'am 114 he holds that their scholars who know their books know that the Qur'an was sent down from their Lord in truth. In his commentary on Surat al-Nisa 153-161 Rida argues with a sardonic phrase about the Children of Israel's demand for a book from heaven. These are all Rida's views and arguments in his debate with them, and they are attributed to him here."
