label: { ar: "أهل الكتاب", en: "Ahl al-Kitab (the People of the Book, their status, and the rules on marriage, food, covenant and dealings)" }
summary:
  ar: "أهل الكتاب عند جمهور الفقهاء اليهود والنصارى بفرقهم المختلفة، وتوسع الحنفية فجعلوا منهم كل من يؤمن بنبي ويقر بكتاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3636} والمجوس ليسوا من أهل الكتاب باتفاق، وإن عوملوا معاملتهم في الجزية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3636}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3637} وعقد الذمة جائز لأهل الكتاب بالاتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3638} وتحل ذبيحتهم وطعامهم وصيدهم، واختلف في ذبيحة من أبواه أحدهما كتابي، ويجوز للمسلم نكاح الكتابية، واختلف في استعمال آنيتهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3639}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3640} ويحرم أن يكون لهم ولاية على المسلم، ولا يجوز زواج المسلمة بهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3641}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3642} ويجوز التعامل معهم، فقد ثبت أن النبي اشترى من يهودي طعاما إلى أجل ورهن درعه عنده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3642}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3643}"
  en: "The People of the Book, for the majority of jurists, are the Jews and Christians in their various sects; the Hanafis extended the term to anyone who believes in a prophet and acknowledges a scripture. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3636} The Magians are not of the People of the Book by agreement, although they are treated like them in the poll tax. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3636}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3637} A covenant of protection may be granted to the People of the Book by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3638} Their slaughter, food and game are lawful; the status of one with a non-Scriptural parent is disputed; a Muslim may marry a Scriptural woman, and the use of their vessels is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3639}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3640} They may not hold authority over a Muslim, and a Muslim woman may not marry one of them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3641}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3642} Dealing with them is lawful: the Prophet is reported to have bought food on credit from a Jew and to have pledged his armour to him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3642}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3643}"
