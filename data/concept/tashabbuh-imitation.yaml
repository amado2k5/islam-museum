id: concept/tashabbuh-imitation
class: concept
kind: legal
label:
  ar: "التشبه"
  en: "Tashabbuh (imitating others)"
  ur: "تشبّہ (دوسروں کی مشابہت اختیار کرنا)"
summary:
  ar: "التشبه تكلّف أن يكون الإنسان مثل غيره، والفقهاء يستعملونه بمعناه اللغوي. أشهر أحكامه في لباس يُعد شعاراً للكفار: يحكم جمهور الشافعية والحنفية على الصحيح والمالكية بكفر من لبسه ميلاً إليهم في بلاد الإسلام لغير ضرورة، ويراه الحنابلة محرماً دون كفر، ويرى الحنفية في قول أن الكفر لا يقع إلا باعتقاد معتقدهم. ويكره التشبه في العبادات كالصلاة في أوقات الكراهة واختصار الصلاة ووصال الصوم وإفراد عاشوراء بالصوم، ولا يجوز التشبه بهم في أعيادهم، ويكره تشبه الرجال بالنساء وعكسه عند الجمهور، ويُميَّز أهل الذمة بعلامات في لباسهم ومراكبهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5169} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5170} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5171} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5172} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5173} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5174} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5175} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5176} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5177}"
  en: "Tashabbuh is taking on the look of another; jurists use the word in its lexical sense. For dress that marks unbelievers, the majority of Hanafis (on the sound view), Malikis and Shafiis rule that one who wears it out of inclination to them in Muslim lands, without necessity, becomes an unbeliever; the Hanbalis call it forbidden without unbelief, and one Hanafi view requires belief in their creed. Imitation in worship is disliked (prayer at makruh times, shortened prayer, continuous fasting, singling out Ashura for fasting), imitating them at their festivals is not permitted, men imitating women and the reverse is disliked by most, and protected non-Muslims are marked by signs of dress and mounts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5169} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5170} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5171} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5172} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5173} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5174} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5175} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5176} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5177}"
