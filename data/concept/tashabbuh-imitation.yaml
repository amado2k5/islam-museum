id: concept/tashabbuh-imitation
class: concept
kind: legal
label:
  ar: "التشبه"
  en: "Tashabbuh (imitating others)"
  ur: "تشبّہ ⁦(دوسروں کی مشابہت اختیار کرنا)⁩"
  es: "Tashabbuh (imitar a otros)"
  fr: "Tashabbuh (imiter les autres)"
summary:
  ar: "التشبه تكلّف أن يكون الإنسان مثل غيره، والفقهاء يستعملونه بمعناه اللغوي. أشهر أحكامه في لباس يُعد شعاراً للكفار: يحكم جمهور الشافعية والحنفية على الصحيح والمالكية بكفر من لبسه ميلاً إليهم في بلاد الإسلام لغير ضرورة، ويراه الحنابلة محرماً دون كفر، ويرى الحنفية في قول أن الكفر لا يقع إلا باعتقاد معتقدهم. ويكره التشبه في العبادات كالصلاة في أوقات الكراهة واختصار الصلاة ووصال الصوم وإفراد عاشوراء بالصوم، ولا يجوز التشبه بهم في أعيادهم، ويكره تشبه الرجال بالنساء وعكسه عند الجمهور، ويُميَّز أهل الذمة بعلامات في لباسهم ومراكبهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5169} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5170} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5171} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5172} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5173} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5174} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5175} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5176} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5177}"
  en: "Tashabbuh is taking on the look of another; jurists use the word in its lexical sense. For dress that marks unbelievers, the majority of Hanafis (on the sound view), Malikis and Shafiis rule that one who wears it out of inclination to them in Muslim lands, without necessity, becomes an unbeliever; the Hanbalis call it forbidden without unbelief, and one Hanafi view requires belief in their creed. Imitation in worship is disliked (prayer at makruh times, shortened prayer, continuous fasting, singling out Ashura for fasting), imitating them at their festivals is not permitted, men imitating women and the reverse is disliked by most, and protected non-Muslims are marked by signs of dress and mounts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5169} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5170} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5171} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5172} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5173} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5174} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5175} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5176} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5177}"
  es: "Tashabbuh significa adoptar la apariencia de otro; los juristas usan la palabra en su sentido léxico. Respecto a la vestimenta que identifica a los no creyentes, la mayoría de los hanafíes (según la opinión correcta), los malikíes y los shafiíes dictaminan que quien la usa por inclinación hacia ellos en tierras musulmanas, sin necesidad, se convierte en un no creyente; los hanbalíes la consideran prohibida sin incredulidad, y una opinión hanafí exige la creencia en su credo. La imitación en el culto es desaconsejable (orar en momentos makruh, abreviar la oración, ayunar continuamente, ayunar solo en Ashura), imitarlos en sus festividades no está permitido, la mayoría desaprueba que los hombres imiten a las mujeres y viceversa, y los no musulmanes protegidos se identifican mediante signos en su vestimenta y monturas. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5169} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5170} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5171} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5172} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5173} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5174} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5175} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5176} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5177}"
  fr: "Le terme « tashabbuh » désigne le fait de prendre l'apparence d'autrui; les juristes l'emploient dans son sens lexical. Concernant les vêtements qui distinguent les non-musulmans, la majorité des hanafites (selon l'avis le plus juste), les malikites et les chaféites statuent que celui qui les porte par simple inclination, en terre d'islam, sans nécessité, devient non-musulman; les hanbalites les interdisent sans preuve de non-croyance, et une opinion hanafite exige la croyance en leur religion. L'imitation dans le culte est mal vue (prière aux heures déconseillées, prière abrégée, jeûne continu, jeûne spécifique d'Achoura), il est interdit de les imiter lors de leurs fêtes, l'imitation des femmes par les hommes et vice-versa est généralement mal vue, et les non-musulmans protégés sont marqués par des signes vestimentaires et des montures. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5169} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5170} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5171} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5172} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5173} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5174} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5175} {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.5176} {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.5177}"
