label:
  ar: "الدجال"
  en: "The Dajjal"
  ur: "دجال"
summary:
  ar: "الدجال في درس الشيخ عمر عبد الكافي فتنة آخر الزمان، ويذكر أن معه الطعام والشراب فيُفتن به من يحتاج القوت. ويجيب الشيخ بما يُروى عن رزق المؤمنين بالذكر، ويرى أن فتنته ليست الفتنة الوحيدة. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:34:30}"
  en: "In Sheikh Omar Abdelkafy's lessons, the Dajjal is the trial of the last days. He mentions that he carries food and drink, so that those in need of bread are tested by him, and he gives the answer found in the reports that believers are provided for through remembrance. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:34:30}"
  ur: "شیخ عمر عبدالکافی کے درس میں دجال آخری زمانے کا فتنہ ہے۔ وہ بتاتے ہیں کہ اس کے پاس کھانا اور پینا ہوگا، جس سے روٹی کے محتاج آزمائش میں پڑیں گے، اور اس کا جواب وہ اس روایت سے دیتے ہیں کہ مومنوں کو ذکر کے ذریعے رزق ملے گا۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:34:30}"
