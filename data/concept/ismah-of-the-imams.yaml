id: concept/ismah-of-the-imams
class: concept
kind: doctrine
label: { ar: "عصمة الأئمة عند الشيعة الإمامية", en: "Infallibility of the Imams (Twelver Shi'a)" }
summary:
  ar: "تعتقد الشيعة الإمامية الاثنا عشرية أن الأئمة معصومون من الذنوب صغيرها وكبيرها، ومن السهو والنسيان والخطأ، وأن العصمة شرط للإمامة. ينقل الصلابي أقوال المفيد والمجلسي وابن بابويه في تقريرها، ثم يعرض عليها ما يراه من تناقض في الروايات نفسها واختلاف بين شيوخ المذهب، ويستدل بمواضع من القرآن وبأقوال علي في نهج البلاغة على أن العصمة لم تكن عند علي ولا عند الصحابة. وهو يعرض ذلك من منظور أهل السنة، والعرض هنا بيان لمذهب الشيعة وللرد الذي أورده المؤلف، لا حكم من المتحف {cite:sallabi-ali-vol2 p. 244}."
  en: "Twelver Shi'i doctrine that the imams are infallible from childhood to death, and that infallibility is a condition of the imamate. Presented here as the position the author rebuts, with the Shi'i sources and the author's rebuttal both recorded."
wings: [ideas]
periods: [period/abbasid-early]
regions: [levant-iraq]
themes: [sects-and-schools, creed]
perspectives:
  - tradition: sunni
    id: sunni-rebuttal
    stance: { ar: "لا معصوم بعد النبي، والعصمة لا تكون إلا للرسول ولا يلزم الاتباع المطلق لغيره" }
    summary: { ar: "يرى المؤلف أن ما يُعرض على الكتاب والسنة يُقبل، وأن الأمة معصومة بمجموعها عن الضلال، وأن علياً نفسه قال «لست في نفسي بفوق أن أخطئ» {cite:sallabi-ali-vol2 p. 257}." }
    sources: [source/sallabi-ali-vol2]
  - tradition: academic
    id: internal-contradiction
    stance: { ar: "الروايات المنسوبة إلى الأئمة متعارضة، والتقية والبداء وُضعا لتغطية ذلك" }
    summary: { ar: "يذكر المؤلف أن الطوسي نفسه اعترف بأن أخبارهم متناقضة حتى لا يوجد خبر إلا وبإزائه ما يضاده، وأن بعض شيعة فارقوا المذهب حين رأوا اختلاف الحسن والحسين {cite:sallabi-ali-vol2 p. 259}." }
    sources: [source/sallabi-ali-vol2]
  - tradition: shia-twelver
    id: imami-statement
    stance: { ar: "العصمة شرط للإمامة، والإمام معصوم من الكبيرة والصغيرة والسهو والنسيان" }
    summary: { ar: "ينقل المؤلف عن المفيد أن الأئمة معصومون كعصمة الأنبياء، وأن نفي السهو عنهم من ضروريات المذهب عند الممقاني، وينقل عن المجلسي أن المسألة «في غاية الإشكال» لدلالة كثير من الأخبار على صدور السهو عنهم {cite:sallabi-ali-vol2 p. 244}." }
    sources: [source/sallabi-ali-vol2]
issue: { ar: "ماذا تقول العقيدة الشيعية في عصمة الأئمة، وهل وافق عليها علي والصحابة؟", en: "What do Twelver sources say about the imams' infallibility, and does the author's reading hold?" }
