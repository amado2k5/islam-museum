id: concept/ismah-of-the-imams
class: concept
kind: doctrine
label: { ar: "عصمة الأئمة عند الشيعة الإمامية", en: "Infallibility of the Imams (Twelver Shi'a)", es: "Infalibilidad de los imanes (chiítas duodecimanos)", fr: "L'infaillibilité des imams (chiites duodécimains)", ur: "ائمہ کی عصمت ⁦(بارہ شیعہ)⁩", tr: "İmam Şiilere Göre İmamların Yanılmazlığı", id: "Ketidaksalahan Imam menurut Syiah Imam" }
summary:
  ar: "تعتقد الشيعة الإمامية الاثنا عشرية أن الأئمة معصومون من الذنوب صغيرها وكبيرها، ومن السهو والنسيان والخطأ، وأن العصمة شرط للإمامة. ينقل الصلابي أقوال المفيد والمجلسي وابن بابويه في تقريرها، ثم يعرض عليها ما يراه من تناقض في الروايات نفسها واختلاف بين شيوخ المذهب، ويستدل بمواضع من القرآن وبأقوال علي في نهج البلاغة على أن العصمة لم تكن عند علي ولا عند الصحابة. وهو يعرض ذلك من منظور أهل السنة، والعرض هنا بيان لمذهب الشيعة وللرد الذي أورده المؤلف، لا حكم من المتحف {cite:sallabi-ali-vol2 p. 244}."
  en: "Twelver Shi'i doctrine that the imams are infallible from childhood to death, and that infallibility is a condition of the imamate. Presented here as the position the author rebuts, with the Shi'i sources and the author's rebuttal both recorded."
  es: "La doctrina chií duodecimana sostiene que los imanes son infalibles desde la infancia hasta la muerte, y que la infalibilidad es una condición del imamato. Aquí se presenta la postura que el autor refuta, con las fuentes chiíes y la refutación del autor debidamente registradas."
  fr: "La doctrine chiite duodécimaine affirme l'infaillibilité des imams de l'enfance à la mort, cette infaillibilité étant une condition de l'imamat. L'auteur la réfute ici, en s'appuyant sur les sources chiites et sa propre réfutation."
  ur: "بارہویں شیعہ عقیدہ کہ ائمہ بچپن سے لے کر موت تک معصوم ہیں اور یہ عصمت امامت کی شرط ہے۔ یہاں اس موقف کے طور پر پیش کیا گیا ہے جو مصنف نے رد کیا ہے، شیعہ ذرائع اور مصنف کی تردید دونوں درج ہیں۔"
  tr: "On İki İmam Şii, imamların küçük ve büyük günahlardan, unutkanlıktan, unutkanlıktan ve hatadan yanılmaz olduğuna ve yanılmazlığın İmalık için bir koşul olduğuna inanırlar. El-Sallabi, raporlarında El-Mufid, El-Majlisi ve İbn Babavey'in sözlerini alıntılar, ardından aynı rivayetlerde ve okulun şeyhleri arasındaki farklılıklarda çelişkiler olarak gördüğü şeyleri sunar ve Kur'an ile Ali'nin Nahj al-Balagha'daki açıklamalarından pasajları Ali veya Sahabelerde olmadığının kanıtı olarak gösterir. Bunu Ehl-sünnet perspektifinden sunar ve burada sunulan sunum, müzeden alınan bir karar değil, Şii doktrini ve yazarın verdiği yanıtın bir ifadesidir {cite:sallabi-ali-cilt 2 s. 244}."
  id: "Syiah Imami Dua Belas percaya bahwa para Imam tidak pernah salah dari dosa kecil dan besar, dari pelupaan, pelupaan, dan kesalahan, dan bahwa ketidaksalahan adalah syarat untuk Imamat. Al-Sallabi mengutip pernyataan Al-Mufid, Al-Majlisi, dan Ibn Babawayh dalam laporan mereka, kemudian menyajikan apa yang ia anggap sebagai kontradiksi dalam narasi dan perbedaan yang sama di antara para sheikh aliran tersebut, serta mengutip kutipan dari Al-Qur'an dan pernyataan Ali dalam Nahj al-Balagha sebagai bukti bahwa ketidaksalahan tidak ada pada Ali atau para Sahabat. Ia menyajikan ini dari sudut pandang Ahl al-Sunnah, dan penyajian di sini adalah pernyataan doktrin Syiah dan tanggapan yang disampaikan oleh penulis, bukan keputusan dari museum {cite:sallabi-ali-vol2 hlm. 244}."
