id: concept/al-sawt
class: concept
kind: scientific
label:
  ar: "الصوت وآفاته"
  en: "The voice and its harms"
  ur: "آواز اور اس کی آفتیں"
summary:
  ar: "المقالة الثانية في الصوت والصوت فاعله العضل التي عند الحنجرة بتقدير الفتح ويدفع الهواء المخرج وقرعه وآلته الحنجرة والجسم الشبيه بلسان المزمار وهي الآلة الأولى الحقيقية وسائر الآلات بواعث ومعينات وباعث مادته الحجاب وعضل الصدر ومؤد مادته الرئة ومادته الهواء الذي يموج عند الحنجرة، فالآفة تعرض له إما من الأسباب الفاعلة وإما بسبب الباعث للمادة وآفته إما بطلان وإما نقصان وإما تغير بحوحة أو حدة أو ثقل أو خشونة أو ارتعاش أو غير ذلك، وكل واحد من هذه الأسباب إنما يعتل إما لسوء مزاج مفرد أو مع مادة وخصوصاً من نزلة تعرض للحنجرة أو لما يعرض لها من انحلال فرد أو انقطاع أو ورم أو وجع أو ضربة أو سقطة، وقد تكون الآفة فيه نفسه وقد تكون بشركة المبدأ القريب من الأعصاب التي تشظى إلى تلك العضل أو من العضو المجاور من أعضاء الغذاء أو أعضاء النفس أو المحيط بهما من البطن والصدر والمتصل بهما من خرزة الفقار أو من الحنك فإن تغيره إلى رطوبة أو إلى يبوسة وخشونة قد يغير الصوت ومن هذا القبيل قطع اللهاة واللوزتين فإن صاحبها إذا صوت أحس كالدغدغة القوية الملجئة إلى التنحنح وربما انسدت حلوقهم عند كل صياح {cite:canon-ibn-sina-print-v2 p.322}"
  en: "The second maqala is on the voice. The voice's doer is the muscles at the larynx, by the measure of opening; it pushes the out-going air and strikes it; its instrument is the larynx and the reed-tongue-like body — the first true instrument — while the other instruments are urges and helpers; its matter's urger is the diaphragm and the chest muscles, its matter's conveyor the lung, and its matter the air waving at the larynx. So harm befalls it either from the doing causes or on account of the matter's urger; and its harm is either ceasing, or lessening, or a change — huskiness, sharpness, heaviness, harshness, trembling or other. Each of these causes is upset either by a simple bad temperament or one with matter — above all a catarrh befalling the larynx — or by what befalls it of a loosened join, a cutting, a tumour, a pain, a blow or a fall. The harm may be in itself, or by sharing of the near source — the nerves branching to those muscles — or of the neighbouring organ of the food-organs or the breath-organs or what surrounds them of belly and chest, or what joins them of the vertebra's bead or of the palate, whose change to moistness or to dryness and harshness may change the voice — and of this kind is the cutting of uvula and tonsils: their owner, voicing, feels a strong tickling forcing throat-clearing, and their throats may block at every shout {cite:canon-ibn-sina-print-v2 p.322}"
  ur: "دوسری مقالہ آواز پر ہے؛ آواز کا فاعل حنجرے کے پٹھے ہیں کھلنے کے اندازے سے؛ وہ باہر نکلتی ہوا کو دھکیلتے اور بجاتے ہیں؛ اس کا اوزار حنجرہ اور لسان المزمار جیسا جسم ہے — وہ پہلا حقیقی اوزار ہے اور باقی اوزار محرک اور مددگار ہیں؛ اس کے مادہ کا محرک حجاب اور سینے کے پٹھے ہیں اس کے مادہ کا پہنچانے والا پھیپھڑا اور اس کا مادہ وہ ہوا ہے جو حنجرے پر موج کھاتی ہے؛ تو آفت اسے یا فاعل اسباب سے پہنچتی ہے یا مادہ کے محرک کی وجہ سے؛ اور اس کی آفت یا بطلان ہے یا کمی یا تغیر — بھاری پن تیزی وزن خشونی کانپنا یا غیرہ؛ اور ان اسباب میں سے ہر ایک یا سادہ بد مزاج سے بگڑتا ہے یا مادہ کے ساتھ خصوصاً نزلے سے جو حنجرے کو پہنچے یا اس سے جو اسے فرد کے انحلال انقطاع سوجن درد ضرب یا گرنے سے پہنچے؛ آفت خود اس میں بھی ہو سکتی ہے اور قریبی مبدأ — ان اعصاب کی جو ان پٹھوں میں شاخیں پھیلاتے ہیں — یا خوراک کے اعضاء یا تنفس کے اعضاء یا ان کے گرد بطن اور سینے کے ہمسایہ عضو یا ان سے جڑے فقار کے دانے یا حنک کی مشارکت سے بھی جس کا تر یا خشک اور خشن میں بدلنا آواز بدل سکتا ہے — اور اسی جنس سے ہے لهاہ اور لوزتوں کا کاٹنا کہ ان کے صاحب کو آواز نکالتے شدید گدگدی سی محسوس ہوتی ہے جو تنحنح پر مجبور کرے اور ان کے حلق ہر چیخ پر بند ہو سکتے ہیں {cite:canon-ibn-sina-print-v2 p.322}"
