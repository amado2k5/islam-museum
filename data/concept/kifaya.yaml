label:
  ar: "كِفاية"
  en: "Sufficiency (kifaya)"
  ur: "کفایت"
summary:
  ar: "الكفاية لغة ما يحصل به الاستغناء عن غيره، وفي الفقه ثلاثة معان: الأفعال المهمة التي قصد الشارع وجودها دون نظر إلى فاعلها فهي فرض الكفاية، وأهلية الشخص لأداء المهام العامة، وسد الحاجات الأصلية للشخص من مطعم وملبس ومسكن بقدر حاله. وفرض الكفاية كتحمل الشهادة وأدائها والتقاط اللقيط وتغسيل الميت وتكفينه والصلاة عليه ودفنه، ونصب الإمام. وتوفر الكفاية الفرد نفسه ثم أقاربه ثم بيت المال والزكاة وضرائب الإمام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13376} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13377} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13378} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13379} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13380} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13381} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13382} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13383} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13384}"
  en: "Kifaya in the lexicon is what brings independence from others. In fiqh it has three senses: the important acts the lawgiver wants done without regard to who does them, which are the collective obligations (fard al-kifaya); a person's fitness for public duties; and meeting one's essential needs of food, clothing and housing to the level of one's condition. Collective obligations include bearing and giving testimony, taking in an abandoned child, washing, shrouding, praying over and burying the dead, and appointing an imam. Sufficiency is owed first by the person himself, then by his kin, then from the zakat, the public treasury and taxes levied by the ruler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13376} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13377} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13378} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13379} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13380} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13381} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13382} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13383} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13384}"
  ur: "کفایت لغت میں اس چیز کو کہتے ہیں جس سے دوسروں سے بے نیازی حاصل ہو۔ فقہ میں اس کے تین معنی ہیں: وہ اہم امور جن کا شارع مقصود ہے بغیر اس کے کہ کون انہیں انجام دے، یعنی فرضِ کفایہ؛ عوامی ذمہ داریوں کی اہلیت؛ اور آدمی کی بنیادی ضروریات (خوراک، لباس، رہائش) کو اس کی حیثیت کے مطابق پورا کرنا۔ فرضِ کفایہ میں گواہی دینا، لاوارث بچے کو اٹھانا، میت کو غسل، کفن، جنازہ اور دفن دینا، اور امام مقرر کرنا شامل ہیں۔ کفایت پہلے خود فرد، پھر اس کے رشتہ داروں، پھر زکاۃ، بیت المال اور حاکم کے لگائے ہوئے ٹیکسوں سے فراہم کی جاتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13376} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13377} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13378} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13379} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13380} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13381} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13382} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13383} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13384}"
