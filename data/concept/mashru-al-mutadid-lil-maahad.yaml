label:
  ar: مشروع المعتضد لدور الصنائع والعلوم
  en: al-Mu'tadid's unbuilt academy plan
summary:
  ar: "ذكر المقريزي أن الخليفة المعتضد بالله (279-289هـ) لما أراد بناء قصره في الشماسية ببغداد استزاد في الذرع بعد أن فرغ من تقدير ما أراد، فسُئل عن ذلك فذكر أنه يريد أن يبني فيه دوراً ومساكن ومقاصير ويرتب في كل موضع رؤساء كل صناعة ومذهب من مذاهب العلوم النظرية والعملية ويُجري عليهم الأرزاق السنية ليقصد كل من اختار علماً أو صناعة رئيسَ ما يختاره فيأخذ عنه — تصور مبكر لدار جامعة للعلوم والصنائع لم يُنفذ."
  en: "Al-Maqrizi reports that the caliph al-Mu'tadid (279-289), planning his palace at al-Shammasiyya in Baghdad, ordered an extra measure of ground: he meant to build houses, dwellings and chambers appointing in each the masters of every craft and every school of the speculative and practical sciences, assigning them ample stipends so that whoever chose a science or craft would come to its master and learn from him — an early vision of a state academy of sciences and trades that was never carried out."
