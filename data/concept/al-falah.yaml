id: concept/al-falah
class: concept
kind: term
label:
  ar: "الفلاح"
  en: "Al-falah (success)"
  ur: "فلاح"
summary:
  ar: "الفلاح هو الفوز، ويرى الشعراوي أن أصل اللفظ من شق الأرض للبذر، وأن الحق جاء به للآخرة ليجعل الغيب مقرّباً بالمشهود. ويرى أن «على هدى» تفيد الارتفاع لا الذل، وأن الضلالة في الظرفية المحيطة بالإنسان {cite:tafsir-sharawi-khawatir-scan p.132} {cite:tafsir-sharawi-khawatir-scan p.133} {cite:tafsir-sharawi-khawatir-scan p.134}. هذا تفسيره ويُنسب إليه."
  en: "Falah is success. Sha'rawi holds that the word comes from ploughing the earth for sowing, and that God used it for the Hereafter so that the unseen is brought near through the seen. He reads 'upon guidance' as elevation rather than subjection, and reads 'in error' as a surrounding enclosure {cite:tafsir-sharawi-khawatir-scan p.132} {cite:tafsir-sharawi-khawatir-scan p.133} {cite:tafsir-sharawi-khawatir-scan p.134}. This is Sha'rawi's reading and is attributed to him."
  ur: "فلاح کامیابی ہے۔ شعراوی کے نزدیک یہ لفظ زمین شق کرنے اور بیج ڈالنے سے ہے، اور اللہ نے اسے آخرت کے لیے لایا تاکہ مشاہدے سے غیب قریب ہو۔ وہ «على هدى» کو بلندی اور «في ضلال» کو گھیرنے والی کیفیت کے معنی میں لیتے ہیں {cite:tafsir-sharawi-khawatir-scan p.132} {cite:tafsir-sharawi-khawatir-scan p.133} {cite:tafsir-sharawi-khawatir-scan p.134}۔ یہ شعراوی کی تفسیر ہے اور ان کی طرف منسوب ہے۔"
