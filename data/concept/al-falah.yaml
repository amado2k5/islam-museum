id: concept/al-falah
class: concept
kind: term
label:
  ar: "الفلاح"
  en: "Al-falah (success)"
  fr: "Al-falah (la réussite)"
  ur: "فلاح"
  es: "Al-falah (éxito)"
  tr: "çiftçi"
  id: "petani"
summary:
  ar: "الفلاح هو الفوز، ويرى الشعراوي أن أصل اللفظ من شق الأرض للبذر، وأن الحق جاء به للآخرة ليجعل الغيب مقرّباً بالمشهود. ويرى أن «على هدى» تفيد الارتفاع لا الذل، وأن الضلالة في الظرفية المحيطة بالإنسان {cite:tafsir-sharawi-khawatir-scan p.132} {cite:tafsir-sharawi-khawatir-scan p.133} {cite:tafsir-sharawi-khawatir-scan p.134}. هذا تفسيره ويُنسب إليه."
  en: "Falah is success. Sha'rawi holds that the word comes from ploughing the earth for sowing, and that God used it for the Hereafter so that the unseen is brought near through the seen. He reads 'upon guidance' as elevation rather than subjection, and reads 'in error' as a surrounding enclosure {cite:tafsir-sharawi-khawatir-scan p.132} {cite:tafsir-sharawi-khawatir-scan p.133} {cite:tafsir-sharawi-khawatir-scan p.134}. This is Sha'rawi's reading and is attributed to him."
  fr: "Le falah désigne la réussite. Selon Sha’rawi, le mot vient du labour de la terre avant les semailles ; Dieu l’emploie à propos de l’au-delà pour rapprocher l’invisible par le visible. Sha’rawi voit dans « sur la bonne voie » une élévation plutôt qu’un assujettissement, et dans « dans l’égarement » l’image d’une enceinte qui enveloppe {cite:tafsir-sharawi-khawatir-scan p.132} {cite:tafsir-sharawi-khawatir-scan p.133} {cite:tafsir-sharawi-khawatir-scan p.134}. Cette lecture est celle de Sha’rawi."
  ur: "فلاح کامیابی ہے۔ شعراوی کے نزدیک یہ لفظ زمین شق کرنے اور بیج ڈالنے سے ہے، اور اللہ نے اسے آخرت کے لیے لایا تاکہ مشاہدے سے غیب قریب ہو۔ وہ «على هدى» کو بلندی اور «في ضلال» کو گھیرنے والی کیفیت کے معنی میں لیتے ہیں {cite:tafsir-sharawi-khawatir-scan p.132} {cite:tafsir-sharawi-khawatir-scan p.133} {cite:tafsir-sharawi-khawatir-scan p.134}۔ یہ شعراوی کی تفسیر ہے اور ان کی طرف منسوب ہے۔"
  es: "Falah significa éxito. Sha'rawi sostiene que la palabra proviene de arar la tierra para sembrar, y que Dios la usó para la Otra Vida, de modo que lo invisible se acerca a través de lo visible. Él interpreta «en guía» como elevación en lugar de sujeción, y «en error» como un cerco que lo rodea {cite:tafsir-sharawi-khawatir-scan p.132} {cite:tafsir-sharawi-khawatir-scan p.133} {cite:tafsir-sharawi-khawatir-scan p.134}. Esta es la interpretación de Sha'rawi y se le atribuye."
  tr: "Başarılı olan zaferdir ve Al-Shaarawi, kelimenin kökeninin toprağı ekmek için yarmaktan kaynaklandığına, gerçeğin ise görünmeyenin tanık olana yaklaşması için öteki dünyaya getirildiğine inanır. 'Rehberlikle' ifadesinin aşağılanma değil, yükseliş anlamına geldiğine ve yanlış yönlendirmenin bir kişinin etrafındaki durumda yattığına inanır {cite:tafsir-sharawi-khawatir-scan s.132} {cite:tafsir-sharawi-khawatir-scan s.133} {cite:tafsir-sharawi-khawatir-scan s.134}. Bu onun yorumudur ve ona atfedilir."
  id: "Kemenangan adalah kemenangan, dan Al-Shaarawi percaya asal kata berasal dari membelah tanah untuk menabur, sementara kebenaran dibawa ke alam lain agar yang tak terlihat dapat mendekati saksi. Ia percaya bahwa frasa 'dengan bimbingan' berarti pengangkatan, bukan penghinaan, dan bahwa kesalahan terletak pada situasi di sekitar seseorang {cite:tafsir-sharawi-khawatir-scan hlm.132} {cite:tafsir-sharawi-khawatir-scan hlm.133} {cite:tafsir-sharawi-khawatir-scan hlm.134}. Ini adalah tafsir-sharawi-khawatir-scan hlm.134}. Ini adalah interpretasinya dan dikaitkan dengannya."
