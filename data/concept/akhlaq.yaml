label:
  ar: الأخلاق
  en: Akhlaq (ethics and character)
  ur: اخلاق
summary:
  ar: "الأخلاق هيئة النفس الراسخة التي تصدر عنها الأفعال بسهولة من غير فكر ولا روية؛ إن كانت الهيئة تصدر عنها الأفعال الحسنة فهي خلق حسن، وإن كانت تصدر عنها القبيحة فهي خلق سيئ، كما يضبطه ابن القيم ومن تبعه في كتب الأخلاق {cite:fiqh-mawsua-kuwaitiyya-noor-v3}. والإسلام جعل غاية البعثة إتمامها، فجاء «إنما بعثت لأتمم مكارم الأخلاق»، وجعل «أكمل المؤمنين إيماناً أحسنهم خلقاً»، ووصف الله نبيه بأنه على خلق عظيم. ومن أبوابها: الصدق والأمانة والوفاء بالعهد، والصبر والشكر، والتواضع والحياء والحلم والعفو، والإخلاص والإيثار والكرم، وبر الوالدين وصلة الرحم وحسن الجوار، وكف الأذى عن الناس؛ وضدها الكذب والخيانة والكبر والرياء والحسد والبخل والغيبة والنميمة والسخرية والغضب والظلم والعقوق والنفاق والغش. والمتحف يجمع في متصفح الأخلاق والمعاملات كل ما ورد عنها في القرآن والسنة والسيرة وكل كتاب محصود {cite:tanzil-quran} {cite:riyad-al-salihin}."
  en: "Akhlaq is the settled disposition of the soul from which actions issue easily, without deliberation: if good actions issue from it the character is good, if bad ones issue it is bad — the definition given by Ibn al-Qayyim and those who followed him in the ethics books {cite:fiqh-mawsua-kuwaitiyya-noor-v3}. Islam made its perfection the purpose of the mission itself: 'I was sent to perfect noble character', and 'the most complete of believers in faith are the best of them in character', and God described His prophet as being upon a tremendous character. Its doors: truthfulness, trustworthiness and faithfulness to covenant; patience and gratitude; humility, modesty, forbearance and pardon; sincerity, altruism and generosity; kindness to parents, kinship ties and good neighbourliness; withholding harm from people. Its opposites: lying, treachery, pride, ostentation, envy, miserliness, backbiting, slander, mockery, anger, injustice, disobedience to parents, hypocrisy and cheating. The museum's Akhlaq and Mu'amalat Browser gathers everything the Qur'an, the Sunnah, the seerah and every harvested book records about them {cite:tanzil-quran} {cite:riyad-al-salihin}."
  ur: "اخلاق نفس کی وہ راسخ کیفیت ہے جس سے اعمال بغیر سوچے آسانی سے صادر ہوتے ہیں؛ اگر اس سے نیک اعمال صادر ہوں تو اخلاق حسن ہے اور اگر برے تو اخلاق بد ہے — جیسا کہ ابن القیم اور اخلاق کی کتابوں نے بیان کیا {cite:fiqh-mawsua-kuwaitiyya-noor-v3}۔ اسلام نے اس کی تکمیل کو بعثت کا مقصد بنایا: «میں اخلاق کو مکمل کرنے کے لیے بھیجا گیا»، اور «ایمان میں سب سے مکمل مومن وہ ہیں جو اخلاق میں بہتر ہیں»۔ اس کے ابواب: سچائی، امانت اور عہد کی وفاداری؛ صبر اور شکر؛ تواضع، حیا، حلم اور عفو؛ اخلاص، ایثار اور کرم؛ والدین کے ساتھ احسان، صلہ رحم اور حسن جوار؛ اور لوگوں سے تکلیف روکنا۔ اس کے متضاد: جھوٹ، خیانت، تکبر، ریاکاری، حسد، بخل، غیبت، چغل خوری، مذاق، غصہ، ظلم، عقوق، نفاق اور دھوکا {cite:tanzil-quran} {cite:riyad-al-salihin}."
