label:
  ar: الأخلاق
  en: Akhlaq (ethics and character)
  fr: "Akhlaq (éthique et caractère)"
  ur: اخلاق
  es: "Akhlaq (ética y carácter)"
  tr: "Ahlak"
  id: "Ahlak"
summary:
  ar: "الأخلاق هيئة النفس الراسخة التي تصدر عنها الأفعال بسهولة من غير فكر ولا روية؛ إن كانت الهيئة تصدر عنها الأفعال الحسنة فهي خلق حسن، وإن كانت تصدر عنها القبيحة فهي خلق سيئ، كما يضبطه ابن القيم ومن تبعه في كتب الأخلاق {cite:fiqh-mawsua-kuwaitiyya-noor-v3}. والإسلام جعل غاية البعثة إتمامها، فجاء «إنما بعثت لأتمم مكارم الأخلاق»، وجعل «أكمل المؤمنين إيماناً أحسنهم خلقاً»، ووصف الله نبيه بأنه على خلق عظيم. ومن أبوابها: الصدق والأمانة والوفاء بالعهد، والصبر والشكر، والتواضع والحياء والحلم والعفو، والإخلاص والإيثار والكرم، وبر الوالدين وصلة الرحم وحسن الجوار، وكف الأذى عن الناس؛ وضدها الكذب والخيانة والكبر والرياء والحسد والبخل والغيبة والنميمة والسخرية والغضب والظلم والعقوق والنفاق والغش. والمتحف يجمع في متصفح الأخلاق والمعاملات كل ما ورد عنها في القرآن والسنة والسيرة وكل كتاب محصود {cite:tanzil-quran} {cite:riyad-al-salihin}."
  en: "Akhlaq is the settled disposition of the soul from which actions issue easily, without deliberation: if good actions issue from it the character is good, if bad ones issue it is bad — the definition given by Ibn al-Qayyim and those who followed him in the ethics books {cite:fiqh-mawsua-kuwaitiyya-noor-v3}. Islam made its perfection the purpose of the mission itself: 'I was sent to perfect noble character', and 'the most complete of believers in faith are the best of them in character', and God described His prophet as being upon a tremendous character. Its doors: truthfulness, trustworthiness and faithfulness to covenant; patience and gratitude; humility, modesty, forbearance and pardon; sincerity, altruism and generosity; kindness to parents, kinship ties and good neighbourliness; withholding harm from people. Its opposites: lying, treachery, pride, ostentation, envy, miserliness, backbiting, slander, mockery, anger, injustice, disobedience to parents, hypocrisy and cheating. The museum's Akhlaq and Mu'amalat Browser gathers everything the Qur'an, the Sunnah, the seerah and every harvested book records about them {cite:tanzil-quran} {cite:riyad-al-salihin}."
  fr: "L’akhlaq est la disposition stable de l’âme d’où les actes procèdent avec facilité, sans délibération : si les actes qui en procèdent sont bons, le caractère est bon ; s’ils sont mauvais, il est mauvais — la définition donnée par Ibn al-Qayyim et ceux qui l’ont suivi dans les livres d’éthique {cite:fiqh-mawsua-kuwaitiyya-noor-v3}. L’islam a fait de son perfectionnement le but même de la mission : « J’ai été envoyé pour parfaire le noble caractère », et « les croyants les plus complets en foi sont ceux qui ont le meilleur caractère », et Dieu a décrit Son prophète comme doté d’un caractère éminent. Ses portes : la véracité, la probité et la fidélité à l’engagement ; la patience et la gratitude ; l’humilité, la pudeur, la longanimité et le pardon ; la sincérité, l’altruisme et la générosité ; la bonté envers les parents, les liens de parenté et le bon voisinage ; le fait de ne pas nuire aux gens. Ses contraires : le mensonge, la trahison, l’orgueil, l’ostentation, l’envie, l’avarice, la médisance, la calomnie, la moquerie, la colère, l’injustice, la désobéissance aux parents, l’hypocrisie et la tromperie. Le navigateur Akhlaq et Mu'amalat du musée rassemble tout ce que le Coran, la Sunna, la sira et chaque livre exploité en rapportent {cite:tanzil-quran} {cite:riyad-al-salihin}."
  ur: "اخلاق نفس کی وہ راسخ کیفیت ہے جس سے اعمال بغیر سوچے آسانی سے صادر ہوتے ہیں؛ اگر اس سے نیک اعمال صادر ہوں تو اخلاق حسن ہے اور اگر برے تو اخلاق بد ہے — جیسا کہ ابن القیم اور اخلاق کی کتابوں نے بیان کیا {cite:fiqh-mawsua-kuwaitiyya-noor-v3}۔ اسلام نے اس کی تکمیل کو بعثت کا مقصد بنایا: «میں اخلاق کو مکمل کرنے کے لیے بھیجا گیا»، اور «ایمان میں سب سے مکمل مومن وہ ہیں جو اخلاق میں بہتر ہیں»۔ اس کے ابواب: سچائی، امانت اور عہد کی وفاداری؛ صبر اور شکر؛ تواضع، حیا، حلم اور عفو؛ اخلاص، ایثار اور کرم؛ والدین کے ساتھ احسان، صلہ رحم اور حسن جوار؛ اور لوگوں سے تکلیف روکنا۔ اس کے متضاد: جھوٹ، خیانت، تکبر، ریاکاری، حسد، بخل، غیبت، چغل خوری، مذاق، غصہ، ظلم، عقوق، نفاق اور دھوکا {cite:tanzil-quran} {cite:riyad-al-salihin}."
  es: "Akhlaq es la disposición firme del alma de la cual las acciones surgen fácilmente, sin deliberación: si de ella surgen buenas acciones, el carácter es bueno, si surgen malas, es malo — la definición dada por Ibn al-Qayyim y quienes lo siguieron en los libros de ética {cite:fiqh-mawsua-kuwaitiyya-noor-v3}. El Islam hizo de su perfección el propósito de la misión misma: «Fui enviado para perfeccionar el carácter noble», y «los creyentes más completos en la fe son los mejores en carácter», y Dios describió a Su profeta como poseedor de un carácter tremendo. Sus puertas: veracidad, confiabilidad y fidelidad al pacto; paciencia y gratitud; humildad, modestia, tolerancia y perdón; sinceridad, altruismo y generosidad; bondad con los padres, lazos familiares y buena vecindad; abstenerse de hacer daño a las personas. Sus opuestos: mentira, traición, orgullo, ostentación, envidia, avaricia, murmuración, calumnia, burla, ira, injusticia, desobediencia a los padres, hipocresía y engaño. El navegador Akhlaq y Mu'amalat del museo reúne todo lo que el Corán, la Sunnah, la sirah y todos los libros recopilados registran sobre ellos {cite:tanzil-quran} {cite:riyad-al-salihin}."
  tr: "Ahlak, ruhun sağlam bir halidir; eylemler düşünce veya vizyon olmadan kolayca ortaya çıkar; eğer iyi işler ondan doğarsa, bu iyi karakterdir; kötü işler ondan kaynaklanırsa, kötü karakterdir; İbn al-Kayyim ve takipçileri etik kitaplarında açıkladığı gibi {cite:fiqh-mawsua-kuwaitiyya-noor-v3} bunu açıklamaktadır. İslam, görevin amacını mükemmellik olarak koymuş, \"Ben sadece asil ahlakı mükemmelleştirmek için gönderildim,\" ve \"imanda en mükemmel inananlar en iyi karaktere sahip olanlardır\" yapmıştır; Allah Peygamberini büyük bir karaktere sahip olarak tanımlamıştır. Bölümleri arasında dürüstlük, güvenilirlik, sözü tutma, sabır ve minnettarlık, alçakgönüllülük, alçakgönüllülük, hoşgörü gösterme, affetme, samimiyet, fedakarlık, cömertlik, ebeveynlere saygı gösterme, aile bağlarını sürdürmek, iyi komşuluk ve insanlara zarar vermemekten kaçınmak yer alır; bunların zıtlıkları ise yalan, ihanet, kibir, ikiyüzlülük, kıskançlık, cimrilik, sırtüstü ifade, dedikodu, alay etme, öfke, adaletsizlik, itaatsizlik, ikiyüzlülük ve hile yer alır. Müze, Kur'an, Sünnet, biyografi ve her kitapta kendileriyle ilgili her şeyi Etik ve İşlemler Tarayıcısı'nda toplar."
  id: "Moralitas adalah keadaan jiwa yang kokoh; tindakan mudah muncul tanpa pemikiran atau visi; jika perbuatan baik muncul darinya, maka itu adalah karakter baik; jika perbuatan buruk muncul darinya, maka itu adalah karakter buruk; Seperti yang dijelaskan oleh Ibn al-Qayyim dan para pengikutnya dalam kitab etika mereka, {cite:fiqh-mawsua-kuwaitiyya-noor-v3} menjelaskan hal ini. Islam menetapkan tujuan kewajiban sebagai kesempurnaan, dengan menyatakan, \"Aku diutus hanya untuk menyempurnakan moralitas mulia,\" dan \"orang mukmin yang paling sempurna dalam iman adalah mereka yang memiliki watak terbaik\"; Allah telah menggambarkan Nabi sebagai yang memiliki watak yang agung. Bagian-bagiannya meliputi kejujuran, keandalan, menepati janji, kesabaran dan rasa syukur, kerendahan hati, kerendahan hati, menunjukkan toleransi, pengampunan, ketulusan, pengorbanan, kemurahan hati, menghormati orang tua, menjaga ikatan keluarga, bertetangga yang baik, dan menghindari menyakiti orang lain; kebalikannya meliputi kebohongan, pengkhianatan, kesombongan, kemunafikan, cemburu, kepelit, ekspresi mundur, gosip, ejekan, kemarahan, ketidakadilan, ketidakpatuhan, kemunafikan, dan penipuan. Museum mengumpulkan segala hal yang berkaitan dengan diri mereka dalam Pemindai Etika dan Prosedur dalam Al-Quran, Sunnah, biografi, dan segala sesuatu yang berkaitan dengan mereka dalam setiap buku."
