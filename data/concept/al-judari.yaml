  ur: "ان وبائی بیماریوں میں سے جو قوموں کو تباہ کرتی ہیں اور جزیرۃ العرب میں بھی ثابت ہیں؛ اکثر مفسرین کے نزدیک اصحابِ فیل پر جو وبا آئی وہ چیچک تھی {cite:tafsir-ibn-kathir} {cite:sahih-al-bukhari}۔"
