id: concept/al-judari
class: concept
kind: belief
label:
  ar: الجدري وجدري الماء
  en: Smallpox and chickenpox
  fr: "Variole et varicelle"
  ur: چیچک اور جدری الماء
  es: "Viruela y varicela"
summary:
  ar: "من الأمراض الوبائية التي فتكت بالأمم وأثبتها التاريخ في جزيرة العرب وغيرها؛ ومنه الجدري الذي اشتهر به وباء عهد إبرهة أصحاب الفيل عند أكثر المفسرين {cite:tafsir-ibn-kathir} {cite:sahih-al-bukhari}."
  en: "Of the epidemic diseases that scourged nations, recorded in Arabia and beyond; the smallpox many commentators name as the epidemic that struck Abraha's People of the Elephant {cite:tafsir-ibn-kathir} {cite:sahih-al-bukhari}."
  fr: "Parmi les maladies épidémiques qui ont ravagé des populations, attestées en Arabie et au-delà, figure la variole. De nombreux commentateurs y voient l’épidémie qui frappa les gens de l’Éléphant conduits par Abraha {cite:tafsir-ibn-kathir} {cite:sahih-al-bukhari}."
  ur: "ان وبائی بیماریوں میں سے جو قوموں کو تباہ کرتی ہیں اور جزیرۃ العرب میں بھی ثابت ہیں؛ اکثر مفسرین کے نزدیک اصحابِ فیل پر جو وبا آئی وہ چیچک تھی {cite:tafsir-ibn-kathir} {cite:sahih-al-bukhari}۔"
  es: "De las enfermedades epidémicas que asolaron a las naciones, registradas en Arabia y más allá; la viruela que muchos comentaristas mencionan como la epidemia que azotó al Pueblo del Elefante de Abraha {cite:tafsir-ibn-kathir} {cite:sahih-al-bukhari}."
