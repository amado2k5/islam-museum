label:
  ar: كتاب الوصايا في كتب الحديث
  en: The Book of Wills (Kitab al-Wasaya) in the hadith collections
  ur: حدیث کی کتابوں میں «کتاب الوصایا»
  es: "El Libro de Testamentos (Kitab al-Wasaya) en las colecciones de hadices"
  fr: "Le Livre des Testaments (Kitab al-Wasaya) dans les recueils de hadiths"
  tr: "Hadis Kitaplarında Emirler Kitabı"
  id: "Kitab Perintah dalam Kitab Hadis"
summary:
  ar: '«كتاب الوصايا» باب في الكتب الستة وموطأ مالك يجمع الأحاديث والآثار في الوصية: وفي البخاري الأحاديث 2738-2781 {cite:hadith-api-fawazahmed0 Bukhari book 55, reports 2738-2781}، وفي مسلم 4204-4234 {cite:hadith-api-fawazahmed0 Muslim book 25, reports 4204-4234}، وفي الموطأ ستة وعشرون نصاً من 2214 إلى 2239 {cite:muwatta-maruf-1997 vol. 2 pdf pp. 309-321}. ومن أمثلته حديث سعد بن أبي وقاص وسؤاله عن الوصية بماله كله والشطر والثلث {cite:sahih-al-bukhari 2742}. والأرقام ترقيم قاعدة بيانات الحديث لا الطبعات المطبوعة.'
  en: 'The Book of Wills is a chapter of the six canonical collections and Malik''s Muwatta that gathers reports and rulings on bequest: in al-Bukhari reports 2738-2781 {cite:hadith-api-fawazahmed0 Bukhari book 55, reports 2738-2781}, in Muslim 4204-4234 {cite:hadith-api-fawazahmed0 Muslim book 25, reports 4204-4234}, in the Muwatta twenty-six texts, 2214 to 2239 {cite:muwatta-maruf-1997 vol. 2 pdf pp. 309-321}. An example is Sa''d ibn Abi Waqqas asking about bequeathing all his property, half or a third {cite:sahih-al-bukhari 2742}. The numbers are those of the hadith database, not of printed editions.'
  ur: '«کتاب الوصایا» صحاح ستہ اور موطا مالک کا ایک باب ہے جو وصیت کی روایات اور اقوال جمع کرتا ہے: بخاری میں روایات 2738-2781 {cite:hadith-api-fawazahmed0 Bukhari book 55, reports 2738-2781}، مسلم میں 4204-4234 {cite:hadith-api-fawazahmed0 Muslim book 25, reports 4204-4234}، موطا میں 2214 تا 2239 کے چھبیس متن {cite:muwatta-maruf-1997 vol. 2 pdf pp. 309-321}۔ ایک مثال سعد بن ابی وقاص کا پورے مال، نصف اور تہائی کی وصیت کے بارے میں پوچھنا ہے {cite:sahih-al-bukhari 2742}۔ نمبر ڈیٹا بیس کے ہیں، مطبوعہ نسخوں کے نہیں۔'
  es: "El Libro de Testamentos es un capítulo de las seis colecciones canónicas y del Muwatta de Malik que reúne informes y resoluciones sobre legados: en al-Bujari informes 2738-2781 {cite:hadith-api-fawazahmed0 Bukhari libro 55, informes 2738-2781}, en Muslim 4204-4234 {cite:hadith-api-fawazahmed0 Muslim libro 25, informes 4204-4234}, en los veintiséis textos del Muwatta, 2214 a 2239 {cite:muwatta-maruf-1997 vol. 2 pdf pp. 309-321}. Un ejemplo es Sa'd ibn Abi Waqqas preguntando sobre legar toda su propiedad, la mitad o un tercio {cite:sahih-al-bujari 2742}. Las cifras corresponden a la base de datos de hadices, no a las ediciones impresas."
  fr: "Le Livre des Testaments est un chapitre des six recueils canoniques et du Muwatta de Malik qui rassemble des hadiths et des décisions concernant les legs: dans al-Bukhari, hadiths 2738-2781 (Bukhari, livre 55, hadiths 2738-2781), dans Muslim, hadiths 4204-4234 (Muslim, livre 25, hadiths 4204-4234), et dans le Muwatta, vingt-six textes, 2214 à 2239 (Muwatta-maruf-1997, vol. 2, pp. 309-321). À titre d'exemple, Sa'd ibn Abi Waqqas s'interroge sur la possibilité de léguer la totalité de ses biens, la moitié ou un tiers (Sahih al-Bukhari, 2742). Ces chiffres sont ceux de la base de données des hadiths, et non ceux des éditions imprimées."
  tr: "\"Vasiyet Kitabı\" altı kitap üzerine bir bölümdür ve Malik'in Muwatta'sı vasiyetler üzerine hadisler ve gelenekler derler: El-Buhari Hadisleri 2738-2781 {atıf: Hadis-api-fawazahmed0 Buhari kitap 55, raporlar 2738-2781}, Müslüman 4204-4234 {cite:hadis-api-fawazahmed0 Muslim kitap 25, raporlar 4204-4234} ve Muwatta'da 2214-2239 yılları arasında yirmi altı metin bulunmaktadır {cite:Muwatta-Maruf-1997 cilt 2 pdf s. 309-321}. Örnekler arasında Sa'd bin Ebi Vakkas'ın hadisi ve tüm servetini yarı üçte birini miras bırakma sorusu {cite:Sahih-al-Bukhari 2742} yer alır. Numaralar hadis veritabanında numaralandırılmıştır, basılı baskılarda değil."
  id: "\"Kitab Wasiat\" adalah bab tentang enam kitab tersebut dan Muwatta karya Malik mengumpulkan hadis dan tradisi tentang wasiat: Dalam Hadis Al-Bukhari 2738-2781 {cite:hadith-api-fawazahmed0 Bukhari buku 55, laporan 2738-2781}, dalam Muslim 4204-4234 {cite:hadith-api-fawazahmed0 Muslim buku 25, laporan 4204-4234}, dan dalam Muwatta terdapat dua puluh enam teks dari tahun 2214 hingga 2239 {cite:Muwatta-Maruf-1997 vol. 2 pdf hlm. 309-321}. Di antara contohnya adalah hadis Sa'd ibn Abi Waqqas dan pertanyaannya tentang mewariskan seluruh hartanya, setengah dan sepertiga {cite:Sahih-al-Bukhari 2742}. Nomor-nomor tersebut diberi nomor dalam basis data Hadis, bukan edisi cetak."
