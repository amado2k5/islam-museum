id: concept/inzaj-al-madda-wa-jadhbuha-wa-tanqiyat-al-ras
class: concept
kind: scientific
label:
  ar: "إنضاج المادة وجذبها وتنقية الرأس"
  en: "Ripening the matter, drawing it off and cleansing the head"
  ur: "مادے کو پکانا، کھینچنا اور سر کی صفائی"
  es: "Madurar la materia, extraerla y limpiar la cabeza."
  fr: "Faire mûrir la matière, la retirer et nettoyer la tête"
  tr: "Malzeme olgunlaştırma, çekim ve baş arıtma"
  id: "Pematangan bahan, daya tarik, dan pemurnian kepala"
summary:
  ar: "يذكر ابن سينا مبادئ إنضاج مادة الرأس بحسب خلطها وكميتها وشدتها، ومقابلة المادة بالاستفراغ وبالجذب إلى الخلاف، وأصناف المنقيات الخاصة بالرأس من غرغرات وعطوسات وسعوطات {cite:canon-ibn-sina-print-v2 pp.28-36}"
  en: "Ibn Sina gives the principles of ripening the matter in the head according to its humour, amount and strength, countering the matter by evacuation and by drawing to the opposite side, and the kinds of cleansers particular to the head, gargles, sneezing preparations and nasal drops {cite:canon-ibn-sina-print-v2 pp.28-36}"
  ur: "ابن سینا سر کے مادے کو اس کے خلط، مقدار اور شدت کے مطابق پکانے کے اصول، مادے کا مقابلہ استفراغ اور مخالف سمت کھینچنے سے، اور سر کے لیے خاص صاف کرنے والی چیزوں کی قسمیں بتاتا ہے: غرغرے، چھینکیں لانے والی چیزیں اور ناک میں ٹپکانے کی دوائیں {cite:canon-ibn-sina-print-v2 pp.28-36}۔"
  es: "Ibn Sina expone los principios para madurar la materia en la cabeza según su humor, cantidad y fuerza, contrarrestando la materia mediante la evacuación y la atracción hacia el lado opuesto, y los tipos de limpiadores específicos para la cabeza, gárgaras, preparados para estornudar y gotas nasales {cite:canon-ibn-sina-print-v2 pp.28-36}"
  fr: "Ibn Sina donne les principes de maturation de la matière dans la tête selon son humeur, sa quantité et sa force, de lutte contre cette matière par l'évacuation et par le déplacement vers le côté opposé, et les types de nettoyants particuliers à la tête, les gargarismes, les préparations contre les éternuements et les gouttes nasales {cite:canon-ibn-sina-print-v2 pp.28-36}"
  tr: "İbn Sina, baş malzemesinin karışımı, miktarı ve yoğunluğuna göre olgunlaştırılması, maddenin kusma ve anlaşmazlığa çekilme yoluyla karşı etkisi ile gargara yapma, hapşırma ve hapşırma gibi başa özgü arıtıcı türlerini belirtir {cite:canon-ibn-sina-print-v2 s.28-36}"
  id: "Ibn Sina menyebutkan prinsip pematangan bahan kepala sesuai pencampuran, jumlah, dan intensitasnya, penanggulangan zat dengan muntah dan daya tarik terhadap perselisihan, serta jenis pemurni khas kepala seperti berkumur, bersin, dan bersin {cite:canon-ibn-sina-print-v2 hlm.28-36}"
