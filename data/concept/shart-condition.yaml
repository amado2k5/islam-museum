id: concept/shart-condition
class: concept
kind: legal
label:
  ar: "الشَّرْط"
  en: "Shart (a condition in law: its kinds, and its effect on contracts)"
  es: "Shart (una condición jurídica: sus tipos y su efecto en los contratos)"
  fr: "Shart (une condition en droit: ses types et son effet sur les contrats)"
  ur: "شارٹ ⁦(قانون میں ایک شرط: اس کی قسمیں، اور معاہدوں پر اس کا اثر)⁩"
summary:
  ar: "الشرط لغة إلزام الشيء والتزامه، ويطلق على العلامة كأشراط الساعة، واصطلاحا ما يلزم من عدمه العدم ولا يلزم من وجوده وجود ولا عدم لذاته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9977} وللشرط أقسام عند الأصوليين: ما يكون كالعلة، وما له حكم السبب، والشرط اسما لا حكما، والشرط بمعنى العلامة الخالصة كالإحصان في الزنا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9979} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9980} والشرط الجعلي قسمان: معلق ومقيد، والمعلق لا يصح إلا بأمور كأن يكون المعلق عليه مستقبلا على خطر الوجود. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9980} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9981} والشرط المقيد الصحيح يتعلق بصفة في محل العقد أو بمقتضاه أو بما يلائمه أو بما ورد دليله أو جرى به العرف؛ والفاسد أو الباطل يفسد العقد أو يبقيه صحيحا بحسب المذاهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9983} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9984} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9985} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9986} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9987} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9988}"
  en: "In language shart is the binding of a thing and its obligation, and also a sign, as in the signs of the Hour; in the technical sense it is what the absence of which entails absence, while its presence entails neither presence nor absence in itself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9977} The usulis distinguish a condition that acts as a cause, one that has the force of a cause, a condition that is a name and not a ruling, and a condition that is a plain sign, as ihsan in fornication. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9979} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9980} A made condition is either conditional (ta'liq) or restricted (taqyid); a conditional one requires that the thing conditioned on be future and uncertain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9980} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9981} A valid restricted condition concerns an attribute of the object, what the contract requires, what suits it, what a text permits, or what custom has settled; a defective or void condition either voids the contract or leaves it valid, according to the school. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9983} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9984} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9985} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9986} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9987} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9988}"
  es: "En el lenguaje, shart es la vinculación de una cosa y su obligación, y también un signo, como en los signos de la Hora; en el sentido técnico es aquello cuya ausencia implica ausencia, mientras que su presencia no implica ni presencia ni ausencia en sí misma. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9977} Los usulis distinguen una condición que actúa como causa, una que tiene la fuerza de una causa, una condición que es un nombre y no una regla, y una condición que es un signo claro, como ihsan en la fornicación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9979} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9980} Una condición hecha es condicional (ta'liq) o restringida (taqyid); una condicional requiere que la cosa condicionada sea futura e incierta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9980} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9981} Una condición restringida válida se refiere a un atributo del objeto, lo que el contrato requiere, lo que le conviene, lo que un texto permite o lo que la costumbre ha establecido; una condición defectuosa o nula anula el contrato o lo deja válido, según la escuela. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9983} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9984} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9985} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9986} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9987} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9988}"
  fr: "En langage courant, le shart désigne l'obligation d'une chose et son lien avec celle-ci, ainsi qu'un signe, comme dans les signes de l'Heure; au sens technique, il s'agit de ce dont l'absence entraîne l'absence, tandis que sa présence n'entraîne ni présence ni absence en soi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9977} Les usulis distinguent une condition qui agit comme une cause, une condition qui a la force d'une cause, une condition qui est un nom et non une règle, et une condition qui est un signe clair, comme l'ihsan dans la fornication. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9979} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9980} Une condition faite est soit conditionnelle (ta'liq), soit restreinte (taqyid); une conditionnelle exige que la chose conditionnée soit future et incertaine. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9980} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9981} Une condition restrictive valable concerne un attribut de l'objet, ce que le contrat exige, ce qui lui convient, ce qu'un texte permet ou ce que la coutume a établi; une condition défectueuse ou nulle annule le contrat ou le laisse valide, selon l'école. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9983} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9984} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9985} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9986} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9987} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9988}"
  ur: "زبان میں شارٹ کسی چیز کا پابند اور اس کی ذمہ داری ہے، اور علامت بھی، جیسا کہ قیامت کی نشانیوں میں ہے۔ تکنیکی معنوں میں یہ وہ چیز ہے جس کی عدم موجودگی غیر موجودگی کا باعث بنتی ہے، جبکہ اس کی موجودگی نہ تو اپنے اندر موجود ہوتی ہے اور نہ ہی غیر موجودگی۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 9977} اصول ایک ایسی حالت کی تمیز کرتے ہیں جو سبب کے طور پر کام کرتی ہو، ایسی حالت جس میں سبب کی قوت ہو، ایسی شرط جو اسم ہو نہ کہ حکم، اور ایسی شرط جو صریح علامت ہو، جیسا کہ زنا میں احسان ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9979} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9980} بنائی گئی شرط یا تو مشروط ⁦(تعلیق)⁩ یا محدود ⁦(تقید)⁩ ہوتی ہے۔ ایک مشروط کا تقاضا ہے کہ مشروط چیز مستقبل اور غیر یقینی ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9980} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9981} ایک درست پابندی والی شرط اعتراض کے کسی خاصیت سے متعلق ہے، معاہدہ کیا درکار ہے، اس کے مطابق کیا ہے، کس متن کو کسٹم کی اجازت دی گئی ہے، یا اسکول کے مطابق، عیب دار یا باطل حالت یا تو معاہدہ کو کالعدم کر دیتی ہے یا اسے درست چھوڑ دیتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص.9983} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ9984} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ9985} p.9986} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.9987} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ9988}"
