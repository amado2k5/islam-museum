id: concept/shart-condition
class: concept
kind: legal
label:
  ar: "الشَّرْط"
  en: "Shart (a condition in law: its kinds, and its effect on contracts)"
summary:
  ar: "الشرط لغة إلزام الشيء والتزامه، ويطلق على العلامة كأشراط الساعة، واصطلاحا ما يلزم من عدمه العدم ولا يلزم من وجوده وجود ولا عدم لذاته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9977} وللشرط أقسام عند الأصوليين: ما يكون كالعلة، وما له حكم السبب، والشرط اسما لا حكما، والشرط بمعنى العلامة الخالصة كالإحصان في الزنا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9979} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9980} والشرط الجعلي قسمان: معلق ومقيد، والمعلق لا يصح إلا بأمور كأن يكون المعلق عليه مستقبلا على خطر الوجود. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9980} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9981} والشرط المقيد الصحيح يتعلق بصفة في محل العقد أو بمقتضاه أو بما يلائمه أو بما ورد دليله أو جرى به العرف؛ والفاسد أو الباطل يفسد العقد أو يبقيه صحيحا بحسب المذاهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9983} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9984} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9985} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9986} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9987} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9988}"
  en: "In language shart is the binding of a thing and its obligation, and also a sign, as in the signs of the Hour; in the technical sense it is what the absence of which entails absence, while its presence entails neither presence nor absence in itself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9977} The usulis distinguish a condition that acts as a cause, one that has the force of a cause, a condition that is a name and not a ruling, and a condition that is a plain sign, as ihsan in fornication. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9979} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9980} A made condition is either conditional (ta'liq) or restricted (taqyid); a conditional one requires that the thing conditioned on be future and uncertain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9980} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9981} A valid restricted condition concerns an attribute of the object, what the contract requires, what suits it, what a text permits, or what custom has settled; a defective or void condition either voids the contract or leaves it valid, according to the school. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9983} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9984} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9985} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9986} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9987} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9988}"
