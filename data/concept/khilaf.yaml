summary:
  ar: "خلاف في الكتاب معروف، وقد يخرج لورقه إذا شدخ صمغ قوي، وهو الصفصاف بحسب حاشية محقق الكتاب؛ ثمرته وورقه قابض بلا لذع وله تجفيف كاف ورماده شديد التجفيف، وإذا تضمد به رطبا حبس نزف الدم، ورماده يقلع الثآليل بالخل ويزيل النملة، وفقاحه وماؤه مسكن للصداع، وصمغه نافع جدا للبصر الضعيف، وماؤه نافع من سدد الكبد واليرقان، وثمرته نافعة لاختلاف الدم {cite:canon-ibn-sina-print-v1 p.712}"
  en: "Khilaf is in the book known, and from its leaf, when crushed, a strong gum comes out, and it is al-safsaf by the note of the book's editor; its fruit and leaf are astringent without sting and have sufficient drying, its ash is strongly drying, applied fresh it stops the flow of blood, its ash removes warts with vinegar and removes namla, its blossoms and water calm headache, its gum is of great benefit to weak sight, its water benefits obstructions of the liver and jaundice, and its fruit benefits flux of blood {cite:canon-ibn-sina-print-v1 p.712}"
  ur: "خلاف کتاب میں معروف ہے، اور اس کے پتے کو کچلا جائے تو قوی گوند نکلتی ہے، اور کتاب کے محقق کے حاشیے کے مطابق یہ صفصاف ہے؛ اس کا پھل اور پتا بغیر چبھن کے قابض ہیں اور کافی خشک کرتے ہیں، اس کی راکھ سخت خشک کرنے والی ہے، تر ضماد کیا جائے تو خون کا بہنا روکتا ہے، اس کی راکھ سرکے کے ساتھ مسوں کو اکھاڑتی ہے اور نملہ کو دور کرتی ہے، اس کے شگوفے اور پانی سردرد کو تسکین دیتے ہیں، اس کی گوند کمزور نظر کے لیے بہت نافع ہے، اس کا پانی جگر کی رکاوٹوں اور یرقان میں نافع ہے، اور اس کا پھل خونی دست میں نافع ہے {cite:canon-ibn-sina-print-v1 p.712}۔"
  es: "Khilaf es conocido en el libro, y de su hoja, al ser triturada, sale una goma fuerte, y es al-safsaf según la nota del editor del libro; su fruto y hoja son astringentes sin picar y tienen suficiente efecto secante, su ceniza es muy secante, aplicada fresca detiene el flujo de sangre, su ceniza elimina las verrugas con vinagre y elimina el namla, sus flores y agua calman el dolor de cabeza, su goma es muy beneficiosa para la vista débil, su agua beneficia las obstrucciones del hígado y la ictericia, y su fruto favorece el flujo sanguíneo {cite:canon-ibn-sina-print-v1 p.712}"
  fr: "Le khilaf est mentionné dans le livre. De ses feuilles, lorsqu'on les froisse, il en sort une gomme puissante, appelée al-safsaf par l'éditeur du livre. Ses fruits et ses feuilles sont astringents sans être irritants et possèdent un fort pouvoir asséchant. Ses cendres sont fortement asséchantes; appliquées fraîches, elles arrêtent les saignements. Associées au vinaigre, elles permettent d'éliminer les verrues et les taches brunes. Ses fleurs et son eau calment les maux de tête. Sa gomme est très bénéfique pour la vue faible. Son eau est bénéfique en cas d'obstructions hépatiques et de jaunisse. Enfin, ses fruits sont bénéfiques pour les troubles sanguins. {cite:canon-ibn-sina-print-v1 p.712}"
