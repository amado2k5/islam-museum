summary:
  ar: "القيموليا في الكتاب صفائح كالرخام بيض براقة كافورية الطعم سريعة التفرك، وتنفع خاصة من حرق النار، ومحرقها المغسول نافع للقروح العسرة الاندمال {cite:canon-ibn-sina-print-v1 p.654}"
  en: "Qaymuliya is in the book sheets like marble, white and shining, camphor-like in taste and quick to crumble; it benefits especially burns of fire, and its burnt and washed form benefits ulcers slow to close {cite:canon-ibn-sina-print-v1 p.654}"
  ur: "قیمولیا کتاب میں سنگ مرمر جیسی سفید چمکدار تہیں ہیں، ذائقے میں کافوری، اور جلد بھربھری ہو جانے والی؛ خاص طور پر آگ کے جلنے میں نافع ہے، اور اس کا جلایا ہوا دھلا ہوا حصہ مشکل سے بھرنے والے قرحوں میں نافع ہے {cite:canon-ibn-sina-print-v1 p.654}۔"
  es: "Qaymuliya se describe en el libro como hojas de mármol, blancas y brillantes, de sabor alcanforado y que se deshacen con facilidad; beneficia especialmente las quemaduras de fuego, y su forma quemada y lavada beneficia las úlceras de cicatrización lenta {cite:canon-ibn-sina-print-v1 p.654}"
  fr: "La qaymuliya est décrite dans le livre comme ayant des feuilles semblables à du marbre, blanches et brillantes, au goût camphré et friable; elle est particulièrement bénéfique pour les brûlures, et sa forme brûlée et lavée est bénéfique pour les ulcères à cicatrisation lente {cite:canon-ibn-sina-print-v1 p.654}"
  tr: "Kitaptaki qimolialar mermer benzeri çarşaflar, parlak yumurtalar, kafur, hızlı sürtünme ve özellikle ateş yakmak için kullanışlıdır; yıkanmış brülörü ise sert yaralar ve çürüme için faydalıdır {cite:canon-ibn-sina-print-v1 s.654}"
  id: "Qimolia dalam buku ini adalah lembaran seperti marmer, telur mengkilap, kamper barus, mudah digosok, dan sangat berguna untuk membakar api, dan pembakar yang dicuci sangat bermanfaat untuk luka keras dan pembusukan {cite:canon-ibn-sina-print-v1 hlm.654}"
