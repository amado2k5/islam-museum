id: concept/row-prayer-saff
class: concept
kind: discipline
label:
  ar: "الصَّفّ"
  en: "Saff (the row in prayer: straightening the rows, the merit of the first row, the place of women and children, and fleeing the line in battle)"
  es: "Saff (la fila en la oración: enderezar las filas, el mérito de la primera fila, el lugar de las mujeres y los niños, y huir de la línea en la batalla)"
  fr: "Saff (la rangée en prière: redresser les rangs, le mérite du premier rang, la place des femmes et des enfants, et fuir la ligne au combat)"
  ur: "صف ⁦(نماز میں صف: صف کو سیدھا کرنا، پہلی صف کی فضیلت، عورتوں اور بچوں کی جگہ، اور جنگ میں صف سے بھاگنا)⁩"
summary:
  ar: "الصف في الصلاة صف المصلين بعضهم خلف بعض. ويستحب عند الجمهور تسوية الصفوف بالتراص وإلصاق المنكب بالمنكب والقدم بالقدم، وقال بعضهم بوجوبها، وصلاة من لم يسو صحيحة عند ابن حجر. ومن التسوية إكمال الصف الأول فالأول، وأن يسد الفرجة. وأفضل صفوف الرجال الأول، وأفضل صفوف النساء إذا لم يكن معهن رجال أولها، وإذا كن مع الرجال فآخرها. ويقف الإمام وسط الصف، ويصطف الرجال ثم الصبيان ثم النساء، ويحرم على المقاتل الفرار من الصف عند التقاء الصفين إلا لتحرف أو تحيز، ويستحب تسوية الصف على الجنازة ولا تنقص الصفوف عن ثلاثة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10397} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10398} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10399} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10400} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10401} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10402} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10403}"
  en: "A saff is a row of worshippers in prayer. The majority recommend straightening rows, with shoulders and feet touching and no gaps; some hold it obligatory, and Ibn Hajar says the prayer of one who does not straighten the row is still valid. Completing the first row before the next, and filling gaps, are part of straightening. The first rows are best for men; women's best rows are the last if men are present, and the first if women pray alone. The imam stands in the middle of the row, men come first, then boys, then women. A fighter may not leave the line when the two lines meet, except to manoeuvre or join a body of Muslims, and rows at a funeral prayer are straightened and not fewer than three. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10397} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10398} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10399} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10400} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10401} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10402} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10403}"
  es: "Un saff es una fila de fieles en oración. La mayoría recomienda alinear las filas, con los hombros y los pies tocándose y sin huecos; algunos lo consideran obligatorio, e Ibn Hajar afirma que la oración de quien no alinea la fila sigue siendo válida. Completar la primera fila antes de la siguiente y rellenar los huecos forma parte de alinear las filas. Las primeras filas son las mejores para los hombres; las mejores filas para las mujeres son las últimas si hay hombres presentes, y las primeras si rezan solas. El imán se sitúa en el centro de la fila; primero van los hombres, luego los niños y finalmente las mujeres. Un combatiente no puede abandonar la fila cuando se encuentran las dos filas, salvo para maniobrar o unirse a un grupo de musulmanes, y en una oración fúnebre las filas se alinean y no deben ser menos de tres. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10397} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10398} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10399} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10400} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10401} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10402} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10403}"
  fr: "Une saff désigne une rangée de fidèles en prière. La majorité recommande de former des rangées droites, épaules et pieds joints, sans aucun espace. Certains considèrent cela comme une obligation, et Ibn Hajar affirme que la prière de celui qui ne forme pas une rangée droite est valide. Terminer la première rangée avant la suivante et combler les espaces vides font partie intégrante de la formation d'une rangée droite. Les premières rangées sont préférables pour les hommes; les femmes sont de préférence en dernière position si des hommes sont présents, et en première position si elles prient seules. L'imam se tient au milieu de la rangée; les hommes prient en premier, suivis des garçons, puis des femmes. Un combattant ne peut quitter la rangée lorsque deux rangées se rejoignent, sauf pour manœuvrer ou rejoindre un groupe de musulmans. Lors d'une prière funéraire, les rangées sont droites et comportent au moins trois fidèles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10397} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10398} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10399} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10400} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10401} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10402} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10403}"
  ur: "صف نماز میں نمازیوں کی صف ہے۔ اکثریت قطاروں کو سیدھا کرنے کی تجویز کرتی ہے، کندھوں اور پیروں کو چھوتے ہوئے اور کوئی خلا نہ ہو۔ بعض اسے واجب قرار دیتے ہیں اور ابن حجر کہتے ہیں کہ جس نے صف سیدھی نہیں کی اس کی نماز صحیح ہے۔ اگلی قطار سے پہلے پہلی قطار کو مکمل کرنا، اور خالی جگہوں کو پُر کرنا، سیدھا کرنے کا حصہ ہیں۔ پہلی صفیں مردوں کے لیے بہترین ہیں۔ عورتوں کی بہترین صف آخری ہے اگر مرد موجود ہوں اور پہلی صف ہے اگر عورتیں اکیلے نماز پڑھیں۔ امام صف کے درمیان کھڑا ہوتا ہے، پہلے مرد آتے ہیں، پھر لڑکے، پھر عورتیں. جب دونوں لائنیں آپس میں ملتی ہیں تو ایک جنگجو لائن نہیں چھوڑ سکتا، سوائے اس کے کہ مسلمانوں کے کسی جسم میں شامل ہو جائے اور نماز جنازہ میں صفیں سیدھی کی جائیں اور تین سے کم نہ ہوں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10397} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10398} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10399} p.10400} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.10401} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.10402} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ104}"
