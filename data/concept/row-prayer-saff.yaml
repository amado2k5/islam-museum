id: concept/row-prayer-saff
class: concept
kind: discipline
label:
  ar: "الصَّفّ"
  en: "Saff (the row in prayer: straightening the rows, the merit of the first row, the place of women and children, and fleeing the line in battle)"
summary:
  ar: "الصف في الصلاة صف المصلين بعضهم خلف بعض. ويستحب عند الجمهور تسوية الصفوف بالتراص وإلصاق المنكب بالمنكب والقدم بالقدم، وقال بعضهم بوجوبها، وصلاة من لم يسو صحيحة عند ابن حجر. ومن التسوية إكمال الصف الأول فالأول، وأن يسد الفرجة. وأفضل صفوف الرجال الأول، وأفضل صفوف النساء إذا لم يكن معهن رجال أولها، وإذا كن مع الرجال فآخرها. ويقف الإمام وسط الصف، ويصطف الرجال ثم الصبيان ثم النساء، ويحرم على المقاتل الفرار من الصف عند التقاء الصفين إلا لتحرف أو تحيز، ويستحب تسوية الصف على الجنازة ولا تنقص الصفوف عن ثلاثة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10397} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10398} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10399} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10400} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10401} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10402} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10403}"
  en: "A saff is a row of worshippers in prayer. The majority recommend straightening rows, with shoulders and feet touching and no gaps; some hold it obligatory, and Ibn Hajar says the prayer of one who does not straighten the row is still valid. Completing the first row before the next, and filling gaps, are part of straightening. The first rows are best for men; women's best rows are the last if men are present, and the first if women pray alone. The imam stands in the middle of the row, men come first, then boys, then women. A fighter may not leave the line when the two lines meet, except to manoeuvre or join a body of Muslims, and rows at a funeral prayer are straightened and not fewer than three. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10397} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10398} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10399} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10400} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10401} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10402} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10403}"
