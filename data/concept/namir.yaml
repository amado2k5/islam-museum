summary:
  ar: "النمر في الكتاب حيوان معروف، نقل عن الخوزي أن شحمه من أعظم الأدوية للفالج، وأن مرارته قاتلة من ساعتها، وبه ينتهي حرف النون في ستة وعشرين دواء {cite:canon-ibn-sina-print-v1 p.583}."
  en: "Namir is in the book a well-known animal; al-Khuzi is reported to have said its fat is among the greatest drugs for palsy, and its gall is deadly at once; with it the letter nun ends, in twenty-six drugs in all {cite:canon-ibn-sina-print-v1 p.583}."
  ur: "نمر کتاب میں ایک معروف جانور ہے؛ خوزی سے منقول ہے کہ اس کی چربی فالج کی بڑی دواؤں میں سے ہے، اور اس کا پتا فوراً مہلک ہے؛ اسی پر حرف نون ختم ہوتا ہے، کل چھبیس دواؤں کے ساتھ {cite:canon-ibn-sina-print-v1 p.583}۔"
  es: "Namir es un animal muy conocido en el libro; se dice que al-Khuzi afirmó que su grasa es una de las mejores medicinas para la parálisis, y su bilis es mortal al instante; con ella termina la carta nun, en veintiséis medicinas en total {cite:canon-ibn-sina-print-v1 p.583}."
  fr: "Namir est dans le livre un animal bien connu; al-Khuzi aurait dit que sa graisse est parmi les meilleurs remèdes contre la paralysie, et que sa bile est mortelle immédiatement; avec lui se termine la lettre nun, en vingt-six remèdes au total {cite:canon-ibn-sina-print-v1 p.583}."
  tr: "Kitaptaki kaplan iyi bilinen bir hayvandır. Al-Khuzi'den bildirildiğine göre, yağları felç için en büyük çözümlerden biridir ve safra kesesi ise o andan itibaren ölümcüldür. İşte burada 'rahibe' harfi yirmi altı ilaçta sona erer {cite:canon-ibn-sina-print-v1 s.583}."
  id: "Harimau dalam buku itu adalah hewan yang terkenal. Dilaporkan dari Al-Khuzi bahwa lemaknya adalah salah satu obat terbaik untuk kelumpuhan, dan kantong empedunya mematikan sejak saat itu. Di sinilah huruf 'nun' berakhir dalam dua puluh enam obat {cite:canon-ibn-sina-print-v1 hlm.583}."
