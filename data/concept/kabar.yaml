summary:
  ar: "الكبر ثمرة وله أصل، حار يابس في الثانية، وقشور أصله أنفع ما فيه، وفيه ذكر لنفعه في الطحال وعرق النسا والجراحات الخبيثة {cite:canon-ibn-sina-print-v1 p.527} {cite:canon-ibn-sina-print-v1 p.528}."
  en: "The caper is a fruit with a root, hot and dry in the second degree. The book calls the bark of the root its most useful part and lists uses for the spleen, sciatica and malignant wounds {cite:canon-ibn-sina-print-v1 p.527} {cite:canon-ibn-sina-print-v1 p.528}."
  ur: "کبر ایک پھل ہے جس کی جڑ بھی ہے، دوسرے درجے میں گرم اور خشک۔ کتاب جڑ کی چھال کو اس کا سب سے مفید حصہ بتاتی ہے اور تلی، عرق النسا اور خبیث زخموں میں اس کے فائدے گنواتی ہے {cite:canon-ibn-sina-print-v1 p.527} {cite:canon-ibn-sina-print-v1 p.528}۔"
  es: "La alcaparra es un fruto con raíz, caliente y seco en segundo grado. El libro llama a la corteza de la raíz su parte más útil y enumera usos para el bazo, la ciática y las heridas malignas {cite:canon-ibn-sina-print-v1 p.527} {cite:canon-ibn-sina-print-v1 p.528}."
  fr: "Le câprier est un fruit à racine, chaud et sec au deuxième degré. Le livre désigne l'écorce de la racine comme sa partie la plus utile et énumère ses usages pour la rate, la sciatique et les plaies malignes {cite:canon-ibn-sina-print-v1 p.527} {cite:canon-ibn-sina-print-v1 p.528}."
  tr: "Kaperans, kökü olan, ikinci kökte sıcak ve kuru olan bir meyvedir ve kök kabukları en faydalı olanıdır. Dalak, siyatik ve kötü huylu yaralardaki faydalarıyla anılmaktadır {cite:canon-ibn-sina-print-v1 s.527} {cite:canon-ibn-sina-print-v1 s.528}."
  id: "Caperance adalah buah dengan akar, panas dan kering pada yang kedua, dan kulit akarnya adalah yang paling bermanfaat di dalamnya. Caperance disebut karena manfaatnya pada limpa, sciatica, dan luka ganas {cite:canon-ibn-sina-print-v1 hlm.527} {cite:canon-ibn-sina-print-v1 hlm.528}."
