id: concept/lukna-fiqh
class: concept
kind: legal
label:
  ar: "اللَّكْنَة"
  en: "Speech defect (lukna), fiqh rulings"
  ur: "لکنت (فقہی احکام)"
summary:
  ar: "اللَّكْنة في اللغة العيّ وثقل اللسان، ولكن لكناً صار كذلك، والذكر ألكن والأنثى لكناء، وهو الذي لا يفصح بالعربية؛ ويؤخذ تعريفه عند الفقهاء من تعريفهم للألكن، وهو من لا يستطيع إخراج بعض الحروف من مخارجها، لا ينطقها أو ينطقها مغيرة أو بزيادة أو تكرار {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13696}، والمالكية أكثر الفقهاء استعمالاً لهذا اللفظ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13696}."
  en: "Lukna, in lexicon, is hesitation and heaviness of the tongue; the man is alkan and the woman lakna, one who cannot speak clear Arabic. The jurists take the sense from their definition of the alkan, one who cannot produce some letters from their places, either not uttering them, changing them, adding to them or repeating them; the Malikis use the word most {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13696}."
  ur: "لکنت لغت میں گونگے پن اور زبان کے بھاری پن کو کہتے ہیں؛ جو شخص عربی صاف نہ بول سکے وہ الکن ہے، مذکر اور مؤنث کے لیے الکناء بھی؛ فقہاء کی تعریف الکن کی تعریف سے لی جاتی ہے، یعنی جو بعض حروف کو اپنے مخرج سے ادا نہ کر سکے، یا انہیں بولے ہی نہیں، یا بدل کر، زیادہ کر کے یا دہرا کر بولے؛ مالکیہ اس لفظ کو زیادہ استعمال کرتے ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13696}۔"
