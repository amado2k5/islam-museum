id: concept/canon-quick-intoxication-and-wine-for-painful-treatment
class: concept
kind: scientific
label:
  ar: "السكر السريع والشراب لعلاج مؤلم عند ابن سينا"
  en: "Quick intoxication and wine for a painful treatment in the Canon"
  fr: "Ivresse rapide et vin pour les traitements douloureux dans le Canon"
  ur: "جلد نشہ اور تکلیف دہ علاج کے لیے شراب قانون میں"
  es: "Intoxicación rápida y vino para un tratamiento doloroso en el Canon"
  tr: "İbn Sina'ya göre ağrılı tedavi için hızlı şeker ve şurup"
  id: "Gula cepat dan sirup untuk pengobatan nyeri menurut Ibn Sina"
summary:
  ar: "يختم ابن سينا فصل الماء والشراب بوصف ما ينقع في الشراب ليسكر صاحبه بسرعة من غير مضرة، وما يجعل فيه لمن احتاج إلى سكر شديد لعلاج عضو علاجاً مؤلماً، من ماء الشيلم وأدوية مخدرة تذكر بأسمائها {cite:canon-ibn-sina-print-v1 p.240}."
  en: "Ibn Sina closes the chapter on water and drink by describing what is soaked in wine to bring quick drunkenness without harm, and what is put in it for one who needs deep intoxication for a painful treatment of an organ, darnel water and numbing drugs he names {cite:canon-ibn-sina-print-v1 p.240}."
  fr: "Ibn Sina clôt le chapitre de l’eau et des boissons en décrivant des macérations dans le vin censées donner une ivresse rapide sans dommage, puis ce qui y serait ajouté pour une ivresse profonde lors d’un traitement douloureux d’un organe : eau d’ivraie et substances engourdissantes nommées dans le texte {cite:canon-ibn-sina-print-v1 p.240}."
  es: "Ibn Sina cierra el capítulo sobre el agua y la bebida describiendo lo que se remoja en vino para lograr una embriaguez rápida sin daño, y lo que se agrega para quien necesita una intoxicación profunda para un tratamiento doloroso de un órgano, agua de cizaña y drogas adormecedoras que él nombra {cite:canon-ibn-sina-print-v1 p.240}."
  ur: "ابن سینا نے پانی اور پینے کے باب کو یہ بیان کرتے ہوئے ختم کیا ہے کہ شراب میں بھیگی ہوئی چیز کو بغیر کسی نقصان کے جلدی نشہ لایا جاتا ہے اور اس میں کیا چیز ڈالی جاتی ہے جس کو کسی عضو کے دردناک علاج کے لیے گہرے نشہ کی ضرورت ہوتی ہے، پانی اور بے حسی کی دوائیوں کا نام اس نے بتایا ہے۔"
  tr: "İbn Sina, su ve içecek konusundaki bölümü, kullanıcıyı zarar vermeden hızla sarhoş etmek için içeceğe nelerin batırıldığını, şiddetli diyabete ihtiyacı olanlara ise ağrılı bir organı tedavi etmek için neler sağladığını anlatarak bitirir; örneğin şalem suyu ve isimleri geçen narkotik ilaçlar {cite:canon-ibn-sina-print-v1 s.240}."
  id: "Ibn Sina mengakhiri bab tentang air dan minuman dengan menjelaskan apa yang direndam dalam minuman untuk cepat memabukkan penggunanya tanpa membahayakan, serta apa yang disediakan bagi mereka yang membutuhkan diabetes berat untuk mengobati organ yang menyakitkan, seperti air shalem dan obat narkotika yang namanya disebutkan {cite:canon-ibn-sina-print-v1 hlm.240}."
