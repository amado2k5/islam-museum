summary:
  ar: "يختم ابن سينا فصل الماء والشراب بوصف ما ينقع في الشراب ليسكر صاحبه بسرعة من غير مضرة، وما يجعل فيه لمن احتاج إلى سكر شديد لعلاج عضو علاجاً مؤلماً، من ماء الشيلم وأدوية مخدرة تذكر بأسمائها {cite:canon-ibn-sina-print-v1 p.240}."
  en: "Ibn Sina closes the chapter on water and drink by describing what is soaked in wine to bring quick drunkenness without harm, and what is put in it for one who needs deep intoxication for a painful treatment of an organ, darnel water and numbing drugs he names {cite:canon-ibn-sina-print-v1 p.240}."
