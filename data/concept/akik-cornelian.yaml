label:
  ar: "العقيق"
  en: "Akik (the cornelian stone, used in seal-rings)"
  fr: "Akik (la cornaline, utilisée pour les bagues-sceaux)"
  es: "Akik (la piedra cornalina, utilizada en anillos de sello)"
  ur: "اکک ⁦(کارنیلین پتھر، مہر کی انگوٹھیوں میں استعمال ہوتا ہے)⁩"
summary:
  ar: "العقيق اسم الحجر الكرنيلي، ويوجد في جزيرة العرب بألوان ودرجات مختلفة، والأحمر منه أكثرها طلبًا، وكان يُصدَّر من اليمن والهند، ويُستعمل في خواتم الفصوص والحلي والفسيفساء، وكان يُعتقد أن للفص العقيقي في الخاتم قوةً تُسكّن القلب وتوقف النزيف {cite:encyclopaedia-of-islam-2 vol. 1 p. 357-358}."
  en: "Akik ('akika') is the name of the cornelian, found in Arabia in various colours, the red being most prized. It was exported from Yemen and India and used for seal-rings, ornaments and mosaics. Belief credited the cornelian in a seal-ring with soothing the heart and stopping haemorrhage, and it remains a favourite neck-ornament for women {cite:encyclopaedia-of-islam-2 vol. 1 p. 357-358}."
  fr: "Akik (« akika ») est le nom de la cornaline, que l’on trouve en Arabie en diverses couleurs, la rouge étant la plus prisée. Elle était exportée du Yémen et de l’Inde et servait aux bagues-sceaux, aux parures et aux mosaïques. La croyance attribuait à la cornaline montée en bague-sceau le pouvoir d’apaiser le cœur et d’arrêter les hémorragies, et elle reste une parure de cou appréciée des femmes {cite:encyclopaedia-of-islam-2 vol. 1 p. 357-358}."
  es: "Akik ('akika') es el nombre del cornalina, que se encuentra en Arabia en varios colores, siendo el rojo el más apreciado. Se exportaba desde Yemen e India y se utilizaba para anillos de sello, ornamentos y mosaicos. Se creía que la cornalina en un anillo de sello calmaba el corazón y detenía las hemorragias, y sigue siendo un adorno de cuello muy popular entre las mujeres {cite:encyclopaedia-of-islam-2 vol. 1 p. 357-358}."
  ur: "اکیک ⁦('اکیکا')⁩ کارنیلین کا نام ہے، جو عرب میں مختلف رنگوں میں پایا جاتا ہے، سرخ رنگ سب سے زیادہ قیمتی ہے۔ اسے یمن اور ہندوستان سے برآمد کیا جاتا تھا اور اسے مہر کی انگوٹھیوں، زیورات اور پچی کاری کے لیے استعمال کیا جاتا تھا۔ عقیدے نے قرنیلین کو مہر کی انگوٹھی میں دل کو تسکین دینے اور خون بہنے سے روکنے کا سہرا دیا، اور یہ خواتین کے لیے گردن کا ایک پسندیدہ زیور بنا ہوا ہے۔ 1 ص۔ 357-358}۔"
