label:
  ar: "العقيق"
  en: "Akik (the cornelian stone, used in seal-rings)"
summary:
  ar: "العقيق اسم الحجر الكرنيلي، ويوجد في جزيرة العرب بألوان ودرجات مختلفة، والأحمر منه أكثرها طلبًا، وكان يُصدَّر من اليمن والهند، ويُستعمل في خواتم الفصوص والحلي والفسيفساء، وكان يُعتقد أن للفص العقيقي في الخاتم قوةً تُسكّن القلب وتوقف النزيف {cite:encyclopaedia-of-islam-2 vol. 1 p. 357-358}."
  en: "Akik ('akika') is the name of the cornelian, found in Arabia in various colours, the red being most prized. It was exported from Yemen and India and used for seal-rings, ornaments and mosaics. Belief credited the cornelian in a seal-ring with soothing the heart and stopping haemorrhage, and it remains a favourite neck-ornament for women {cite:encyclopaedia-of-islam-2 vol. 1 p. 357-358}."
