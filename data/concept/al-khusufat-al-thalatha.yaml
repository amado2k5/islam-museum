id: concept/al-khusufat-al-thalatha
class: concept
kind: belief
label:
  ar: الخسوفات الثلاثة
  en: The three landslides
  fr: "Les trois effondrements"
  ur: تین زمین دھنسنے
  es: "Los tres deslizamientos de tierra"
  tr: "Üç Tutulma"
  id: "Tiga Gerhana"
summary:
  ar: "من العلامات الكبرى: خسف بالمشرق وخسف بالمغرب وخسف بجزيرة العرب — ثلاثة انهيارات أرضية عظام عدّها النبي في حديث العشر {cite:sahih-muslim}."
  en: "Of the major signs: a land sinking in the east, one in the west, and one in the Arabian peninsula — three great landslides the Prophet counted in the hadith of the ten {cite:sahih-muslim}."
  fr: "Parmi les signes majeurs : un engloutissement de terre à l’est, un à l’ouest et un dans la péninsule Arabique — trois grands effondrements que le Prophète a comptés dans le hadith des dix signes {cite:sahih-muslim}."
  ur: "بڑی نشانیوں میں سے: مشرق میں ایک، مغرب میں ایک، اور جزیرۃ العرب میں ایک زمین دھنسنا — تین بڑے دھنساؤ جو نبی نے دس نشانیوں کی حدیث میں گنے {cite:sahih-muslim}۔"
  es: "Entre las principales señales: un hundimiento de tierra en el este, otro en el oeste y otro en la península arábiga — tres grandes deslizamientos de tierra que el Profeta contó en el hadiz de los diez {cite:sahih-muslim}."
  tr: "Başlıca heyelanlar arasında: Doğu'da bir heyelan, Batı'da bir heyelan ve Arap Yarımadası'nda bir heyelan — Peygamber'in On Gün Hadisleri'nde saydığı üç büyük heyelan {atıf: sahih-muslim}."
  id: "Di antara longsor utama adalah: longsor di Timur, longsor di Barat, dan longsor di Semenanjung Arab — tiga longsor utama yang disebutkan oleh Nabi dalam Hadits Sepuluh Hari {atribusi: sahih-muslim}."
