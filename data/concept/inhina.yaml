id: concept/inhina
class: concept
kind: legal
label: { ar: "الانحناء", en: "Inhina' (bending, in fiqh: prayer, honour and compulsion)", es: "Inhina' (inclinación, en fiqh: oración, honor y obligación)", fr: "Inhina' (flexion, en fiqh: prière, honneur et contrainte)", ur: "انہنا ⁦(جھکنا، فقہ میں: نماز، عزت اور مجبوری)⁩", tr: "bükülme", id: "membengkok" }
summary:
  ar: "الانحناء لغة الانعطاف والاعوجاج عن الاستقامة، ويتضمن الركوع في الصلاة، والسجود، والإيماء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3461} والانحناء تعظيما لغير الله حرام باتفاق العلماء، والانحناء المفروض الركوع في الصلاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3462}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3463}"
  en: "Inhina' is bending from straightness, and includes bowing in prayer, prostration and gesturing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3461} Bending in honour of anyone but God is forbidden by agreement, and obligatory bending is the bow in prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3462}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3463}"
  es: "Inhina' es la inclinación desde la posición recta, e incluye la reverencia en la oración, la postración y los gestos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3461} Inclinarse en honor de cualquier persona que no sea Dios está prohibido por acuerdo, y la inclinación obligatoria es la reverencia en la oración. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3462}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3463}"
  fr: "Inhina' désigne toute flexion à partir de la rectitude et comprend l'inclinaison lors de la prière, la prosternation et les gestes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3461} Il est interdit, par consensus, de s'incliner en l'honneur de quiconque autre que Dieu; l'inclinaison obligatoire est l'inclinaison lors de la prière. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3462}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3463}"
  ur: "انا' سیدھی سے جھکنا ہے، اور اس میں رکوع، سجدہ اور اشارہ شامل ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 3461} اللہ کے سوا کسی کی تعظیم میں جھکنا اقرار سے منع ہے اور نماز میں جھکنا واجب ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3462}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3463}"
  tr: "Eğilmek, doğruluktan sapma ve dönme dilidir ve dua ederken eğilmek, secdede ve el hareketlerini içerir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3461} Allah dışındaki başkasına saygı duyarak eğilmek, alimlerin uzlaşmasıyla yasaktır ve eğilmek dua sırasında eğilmek zorunludur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3462} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3463}"
  id: "Membengkok adalah bahasa untuk berpaling dan menyimpang dari keadilan, termasuk membungkuk dalam doa, sujud, dan gestur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3461} Dan membungkuk sebagai penghormatan kepada selain Allah dilarang oleh kesepakatan para ulama, dan membungkuk wajib untuk membungkuk dalam doa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3462} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3463}"
