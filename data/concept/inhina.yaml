summary:
  ar: "الانحناء لغة الانعطاف والاعوجاج عن الاستقامة، ويتضمن الركوع في الصلاة، والسجود، والإيماء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3461} والانحناء تعظيما لغير الله حرام باتفاق العلماء، والانحناء المفروض الركوع في الصلاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3462}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3463}"
  en: "Inhina' is bending from straightness, and includes bowing in prayer, prostration and gesturing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3461} Bending in honour of anyone but God is forbidden by agreement, and obligatory bending is the bow in prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3462}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3463}"
