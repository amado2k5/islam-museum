  id: "Al-Wajid: Dia yang menginginkan segala sesuatu yang kaya dan bukan yang membutuhkan. Nama nomor 64 dalam daftar yang disebutkan dalam hadits Al-Tirmidhi tentang Nama-nama Terindah Allah."
