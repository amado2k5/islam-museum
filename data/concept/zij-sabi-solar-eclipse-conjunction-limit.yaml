label: { ar: "حدود كسوف الشمس عند الاجتماع", en: "The limits for a solar eclipse at conjunction", ur: "اجتماع پر سورج گرہن کی حدود", es: "Los límites para un eclipse solar en conjunción", fr: "Les limites d'une éclipse solaire à la conjonction", tr: "Toplantıda güneş tutulmasının sınırları", id: "Batasan gerhana matahari pada pertemuan tersebut" }
summary:
  ar: "يبدأ باب كسوف الشمس بالنظر في حركة العرض الوسطى عند الاجتماع: فإن وقعت فيما بين الحدود الكسوفية المرسومة للشمس في أعلى صفح شهور الاجتماع والامتلاء أمكن أن تنكسف، وإن زادت أو نقصت لم تنكسف في أي إقليم. ثم يُنظر هل يقع الاجتماع نهاراً أو قرب طلوع الشمس أو غروبها، فيعرف هل يُرى الكسوف كله أو بعضه. {cite:zij-sabi-nallino-byblion p.161}"
  en: "The chapter on the solar eclipse begins by examining the mean latitude motion at conjunction. If it lies between the solar eclipse limits printed at the top of the conjunction and full-moon pages, an eclipse is possible; if it exceeds or falls short of them, no eclipse occurs in any clime. The reckoner then asks whether the conjunction is in daytime or near sunrise or sunset, to know whether all or part is seen. {cite:zij-sabi-nallino-byblion p.161}"
  ur: "سورج گرہن کا باب اجتماع پر اوسط عرضی حرکت کو جانچ کر شروع ہوتا ہے۔ اگر وہ اجتماع اور امتلا کے صفحات کے اوپر درج سورجی گرہنی حدود کے درمیان ہو تو گرہن ممکن ہے؛ اگر ان سے زیادہ یا کم ہو تو کسی اقلیم میں گرہن نہیں ہوتا۔ پھر دیکھا جاتا ہے کہ اجتماع دن میں ہے یا طلوع یا غروب کے قریب، تاکہ معلوم ہو کہ سارا گرہن نظر آئے گا یا حصہ۔ {cite:zij-sabi-nallino-byblion p.161}"
  es: "El capítulo sobre el eclipse solar comienza examinando el movimiento de la latitud media en la conjunción. Si se encuentra entre los límites del eclipse solar impresos en la parte superior de las páginas de la conjunción y la luna llena, es posible que se produzca un eclipse; si los excede o no los alcanza, no se produce ningún eclipse en ningún clima. A continuación, el calculador pregunta si la conjunción ocurre durante el día o cerca del amanecer o el atardecer, para saber si se observa la totalidad o solo una parte. {cite:zij-sabi-nallino-byblion p.161}"
  fr: "Le chapitre sur l'éclipse solaire commence par examiner le mouvement moyen en latitude lors de la conjonction. Si ce mouvement se situe entre les limites d'éclipse solaire indiquées en haut des pages consacrées à la conjonction et à la pleine lune, une éclipse est possible; s'il les dépasse ou n'y est pas, aucune éclipse ne se produit, quel que soit le climat. Le calcul se base ensuite sur le moment de la conjonction (jour, lever ou coucher du soleil) pour déterminer si l'éclipse est totale ou partielle. {cite:zij-sabi-nallino-byblion p.161}"
  tr: "Güneş tutulmaları bölümü, kavuşum anında mezosferin hareketini inceleyerek başlar: eğer bu hareket, kavuşum ve dolunay aylarının haritasının üst kısmında güneş için çizilen tutulma sınırları içinde kalıyorsa, tutulma olasılığı vardır; eğer bu sınırlar daha büyük veya daha küçükse, hiçbir bölgede tutulma meydana gelmez. Daha sonra, tutulmanın tamamen mi yoksa kısmen mi görüleceğini belirlemek için kavuşumun gündüz mü, gün doğumu yakınında mı yoksa gün batımı yakınında mı gerçekleştiği dikkate alınır. {cite:zij-sabi-nallino-byblion s.161}"
  id: "Bab tentang gerhana matahari dimulai dengan memeriksa pergerakan mesosfer pada saat konjungsi: jika pergerakannya berada dalam batas gerhana yang digambarkan untuk matahari di bagian atas bagan bulan konjungsi dan bulan purnama, maka gerhana mungkin terjadi; jika lebih besar atau lebih kecil, tidak akan terjadi gerhana di wilayah mana pun. Kemudian, dipertimbangkan apakah konjungsi terjadi pada siang hari, menjelang matahari terbit, atau menjelang matahari terbenam, untuk menentukan apakah gerhana akan terlihat sepenuhnya atau sebagian. {cite:zij-sabi-nallino-byblion p.161}"
