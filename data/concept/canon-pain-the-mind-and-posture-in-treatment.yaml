summary:
  ar: "يذكر ابن سينا قواعد عملية: يبدأ بتسكين الوجع إذا اجتمع مع المرض، ويغذى شديد حس العضو بما يغلظ الدم، ويستعان بما يقوي القوى النفسانية، ويكلف المريض هيئات وحركات تسوي عضوه، وينتفع أحياناً بالانتقال من بلد إلى بلد {cite:canon-ibn-sina-print-v1 p.271}."
  en: "Ibn Sina gives practical rules: pain that comes with a disease is eased first, someone with an acutely sensitive organ is fed what thickens the blood, help is taken from whatever strengthens the powers of the soul, the patient is set postures and movements that straighten the organ, and a change from one country to another is sometimes of use {cite:canon-ibn-sina-print-v1 p.271}."
