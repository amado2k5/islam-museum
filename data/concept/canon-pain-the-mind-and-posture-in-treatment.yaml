id: concept/canon-pain-the-mind-and-posture-in-treatment
class: concept
kind: scientific
label:
  ar: "الوجع والنفس والهيئات في المعالجة عند ابن سينا"
  en: "Pain, the mind and posture in treatment in the Canon"
  fr: "Douleur, âme et posture thérapeutique dans le Canon"
  ur: "علاج میں درد، نفس اور ہیئتیں قانون میں"
  es: "El dolor, la mente y la postura en el tratamiento según el Canon"
summary:
  ar: "يذكر ابن سينا قواعد عملية: يبدأ بتسكين الوجع إذا اجتمع مع المرض، ويغذى شديد حس العضو بما يغلظ الدم، ويستعان بما يقوي القوى النفسانية، ويكلف المريض هيئات وحركات تسوي عضوه، وينتفع أحياناً بالانتقال من بلد إلى بلد {cite:canon-ibn-sina-print-v1 p.271}."
  en: "Ibn Sina gives practical rules: pain that comes with a disease is eased first, someone with an acutely sensitive organ is fed what thickens the blood, help is taken from whatever strengthens the powers of the soul, the patient is set postures and movements that straighten the organ, and a change from one country to another is sometimes of use {cite:canon-ibn-sina-print-v1 p.271}."
  fr: "Ibn Sina privilégie l’apaisement douloureux, aliments épaississant le sang si hypersensibilité, renforcement des facultés de l’âme, postures et mouvements redressant l’organe, parfois changement de pays {cite:canon-ibn-sina-print-v1 p.271}."
  es: "Ibn Sina da reglas prácticas: primero se alivia el dolor que viene con una enfermedad, a quien tiene un órgano muy sensible se le da de comer lo que espesa la sangre, se busca ayuda en todo lo que fortalece las facultades del alma, se coloca al paciente en posturas y movimientos que enderezan el órgano, y a veces es útil cambiar de un país a otro {cite:canon-ibn-sina-print-v1 p.271}."
