summary:
  ur: "دوزخ پر کھڑا پل جس سے ہر کوئی گزرے گا: نجات دینے والا اور گرانے والا۔"
  ar: "الصراط في العقيدة الجسر الممدود على جهنم يمر عليه الناس يوم القيامة؛ يذكر شرح الطحاوية أنه كحد السيف دحض مزلة {cite:sharh-tahawiyya-ibn-abi-al-izz}."
  en: "The sirat in the creed is the bridge stretched over Jahannam that people cross on the Day of Resurrection; the Sharh al-Tahawiyya describes it as finer than a sword's edge, slippery {cite:sharh-tahawiyya-ibn-abi-al-izz}."
  es: "El sirat en el credo es el puente extendido sobre Jahannam que la gente cruza el Día de la Resurrección; el Sharh al-Tahawiyya lo describe como más fino que el filo de una espada, resbaladizo {cite:sharh-tahawiyya-ibn-abi-al-izz}."
  fr: "Le sirat dans le credo est le pont tendu au-dessus de Jahannam que les gens traversent le Jour de la Résurrection; le Sharh al-Tahawiyya le décrit comme plus fin que le tranchant d'une épée, glissant {cite:sharh-tahawiyya-ibn-abi-al-izz}."
  tr: "İnançtaki yol, Cehennem üzerinde uzatılan köprüdür ve Kıyamet Günü'nde insanların geçeceği köprüdür; El-Tahawiyya'nın tefsiri, bunun kılıcın ucu gibi olduğunu belirtir ve bu sözü çürütür. {alıntı:şerh-tahawiyya-ibn-abi-al-izz}."
  id: "Jalan dalam kepercayaan adalah jembatan yang dibentangkan di atas Neraka yang akan dilalui orang pada Hari Penghakiman; komentar Al-Tahawiyya menyebutkan bahwa jalan itu seperti mata pedang, membantah kesalahan {cite:sharh-tahawiyya-ibn-abi-al-izz}."
