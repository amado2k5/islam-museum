summary:
  ar: "في الفصل العاشر يؤخر ابن سينا الكلام في الجماع وتعديله وتدارك ضرره، وفي الأدوية المسهلة وتدارك ضررها، إلى الكتب الجزئية وإلى مقالة العلاج، ثم يقول إن على مستحفظ الصحة أن يتعاهد الاستفراغ والنفث والتعريق السهل والإدرار {cite:canon-ibn-sina-print-v1 p.242}."
  en: "In the tenth chapter Ibn Sina puts off to the particular books and to the treatise on treatment the discussion of coitus, its moderation and the mending of its harm, and of laxative drugs and the mending of their harm, saying the keeper of health must attend to evacuation, expectoration, easy sweating and urination {cite:canon-ibn-sina-print-v1 p.242}."
