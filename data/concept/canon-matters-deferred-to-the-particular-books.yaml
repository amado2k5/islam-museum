id: concept/canon-matters-deferred-to-the-particular-books
class: concept
kind: scientific
label:
  ar: "ما يؤخر إلى الكتب الجزئية في تدبير الأصحاء عند ابن سينا"
  en: "What Ibn Sina defers to the particular books in the regimen of the healthy"
  fr: "Sujets renvoyés aux livres particuliers dans le régime des bien-portants"
  ur: "صحت مندوں کی تدبیر میں جو باتیں جزئی کتابوں پر چھوڑی گئیں"
  es: "Lo que Ibn Sina remite a los libros particulares en el régimen de la salud"
  tr: "İbn Sina'ya göre sağlıklıların yönetimi üzerine kısmi kitaplara ne gecikiyor"
  id: "Apa yang tertunda ke buku parsial tentang pengelolaan orang sehat menurut Ibn Sina"
summary:
  ar: "في الفصل العاشر يؤخر ابن سينا الكلام في الجماع وتعديله وتدارك ضرره، وفي الأدوية المسهلة وتدارك ضررها، إلى الكتب الجزئية وإلى مقالة العلاج، ثم يقول إن على مستحفظ الصحة أن يتعاهد الاستفراغ والنفث والتعريق السهل والإدرار {cite:canon-ibn-sina-print-v1 p.242}."
  en: "In the tenth chapter Ibn Sina puts off to the particular books and to the treatise on treatment the discussion of coitus, its moderation and the mending of its harm, and of laxative drugs and the mending of their harm, saying the keeper of health must attend to evacuation, expectoration, easy sweating and urination {cite:canon-ibn-sina-print-v1 p.242}."
  fr: "Au chapitre 10, Ibn Sina renvoie coït, modération et correction de ses méfaits, ainsi que laxatifs et leurs méfaits, aux livres particuliers et au traité thérapeutique ; il insiste sur évacuation, expectoration, sudation aisée et urine {cite:canon-ibn-sina-print-v1 p.242}."
  es: "En el décimo capítulo, Ibn Sina pospone a los libros particulares y al tratado sobre el tratamiento la discusión del coito, su moderación y la reparación de sus daños, y de los medicamentos laxantes y la reparación de sus daños, diciendo que el guardián de la salud debe prestar atención a la evacuación, la expectoración, la sudoración fácil y la micción {cite:canon-ibn-sina-print-v1 p.242}."
  ur: "دسویں باب میں ابن سینا مخصوص کتب اور علاج معالجے کی طرف صحبت، اس کے اعتدال اور اس کے نقصانات اور جلاب دوائیوں اور ان کے نقصانات کے تدارک کے بارے میں بحث کرتے ہوئے کہتا ہے کہ صحت کے محافظ کے لیے ضروری ہے کہ وہ انخلاء، کف، پسینہ اور پیشاب کے لیے احتیاط کرے۔"
  tr: "Onuncu bölümde, İbn Sina, cinsel ilişki, onun değişikliği ve zararı, müshil ilaçları ve zararları üzerine tartışmayı ayrıntılı kitaplar ve tedavi makalesine ertelemektedir. Daha sonra sağlığını koruyanların uygun kusma, dışlama, kolay bulaşım ve idrara çıkma yapması gerektiğini belirtir {cite:canon-ibn-sina-print-v1 s.242}."
  id: "Dalam bab kesepuluh, Ibn Sina menunda pembahasan tentang hubungan seksual, modifikasinya, dan bahayanya, serta tentang obat pencahar dan bahayanya, ke buku-buku rinci dan artikel tentang pengobatan. Ia kemudian menyatakan bahwa mereka yang menjaga kesehatan harus mempertahankan muntah yang baik, mengeluarkan tubuh, mudah menular, dan buang air kecil {cite:canon-ibn-sina-print-v1 hlm.242}."
