label:
  ar: "إكليل الملك"
  en: "Iklil al-malik (the crown of the king)"
  ur: "اکلیل الملک"
  es: "Iklil al-malik (la corona del rey)"
  fr: "Iklil al-malik (la couronne du roi)"
summary:
  ar: "إكليل الملك في الكتاب زهر نبات تبنيّ اللون هلاليّ الشكل، حارّ في الأولى يابس فيها وحرارته أغلب من برودته، فيه قبض يسير مع تحليل فينضج؛ ينفع من الأورام الحارة والصلبة والقروح الرطبة وأورام الأذنين وأوجاعها وأورام العينين والمقعدة والأنثيين، ويسكّن الصداع، ويدرّ البول؛ ويذكر الكتاب فيه قولاً عن الطمث والأجنّة في فقرة موسومة معلّقة لحكم المؤسس {cite:canon-ibn-sina-print-v1 pp.341-342}"
  en: "In the book iklil al-malik is the flower of a straw-coloured, crescent-shaped plant, hot in the first degree and dry in it, its heat outweighing its cold, with a slight astringency and some resolving power, so that it ripens; it is listed for hot and hard swellings, moist ulcers, swellings and pains of the ears, swellings of the eyes, anus and testicles, for headache, and as promoting urine; the book also gives a statement on menses and foetuses in a labelled section held for the founder's ruling {cite:canon-ibn-sina-print-v1 pp.341-342}"
  ur: "اکلیل الملک کتاب میں ایک بھوسی رنگ کے ہلالی شکل کے پودے کا پھول ہے، پہلے درجے میں گرم اور اسی میں خشک، اس کی گرمی سردی سے غالب ہے؛ اس میں ہلکی قبض کے ساتھ تحلیل ہے اس لیے یہ پکاتا ہے؛ گرم اور سخت ورموں، تر زخموں، کان کے ورم اور درد، آنکھوں، مقعد اور خصیوں کے ورم اور سر درد میں اور پیشاب جاری کرنے کے لیے مذکور ہے؛ کتاب حیض اور جنین کے بارے میں ایک بات موسوم حصے میں دیتی ہے جو بانی کے فیصلے کے لیے موقوف ہے {cite:canon-ibn-sina-print-v1 pp.341-342}۔"
  es: "En el libro, iklil al-malik es la flor de una planta de color pajizo, con forma de media luna, de naturaleza cálida en primer grado y seca en su interior, donde su calor supera al frío, con una ligera astringencia y cierto poder resolutivo, lo que favorece su maduración. Se menciona para tratar hinchazones calientes y duras, úlceras húmedas, hinchazones y dolores de oído, hinchazones de ojos, ano y testículos, dolores de cabeza y para estimular la micción. El libro también incluye una declaración sobre la menstruación y los fetos en una sección dedicada a la decisión del fundador {cite:canon-ibn-sina-print-v1 pp.341-342}."
  fr: "Dans le livre, l'iklil al-malik est mentionnée comme la fleur d'une plante en forme de croissant, de couleur paille, chaude au premier degré et sèche à l'intérieur, sa chaleur l'emportant sur sa fraîcheur, légèrement astringente et dotée d'un certain pouvoir dissolvant, ce qui lui permet de mûrir. Elle est indiquée pour les gonflements chauds et durs, les ulcères humides, les gonflements et les douleurs des oreilles, les gonflements des yeux, de l'anus et des testicules, pour les maux de tête, et comme favorisant la diurèse. Le livre contient également une déclaration sur les menstruations et les fœtus dans une section intitulée réservée à l'avis du fondateur. {cite:canon-ibn-sina-print-v1 pp.341-342}"
