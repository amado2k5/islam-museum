label:
  ar: "ادّهان"
  en: "Idhan (anointing with oil or perfume: its general ruling, the Friday and festival occasions, and the cases where it is forbidden)"
  es: "Idhan (unción con aceite o perfume: su regla general, las ocasiones de los viernes y festividades, y los casos en que está prohibido)"
  fr: "Idhan (l'onction d'huile ou de parfum: sa règle générale, les occasions du vendredi et des fêtes, et les cas où elle est interdite)"
  ur: "اذان ⁦(تیل یا خوشبو سے مسح کرنا: اس کا عام حکم، جمعہ اور تہوار کے مواقع اور وہ صورتیں جہاں یہ حرام ہے)⁩"
  tr: "Ezan"
  id: "Adhan"
summary:
  ar: "الادّهان الاطلاء بالدهن أو الطيب مما لا نجاسة فيه، وهو مستحب للإنسان في الجملة، ويتأكد للجمعة والعيد ومجامع الناس، ويُستثنى منه النساء في الجمعة، وحالات الإحرام والاعتكاف والصوم والإحداد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2001} وفي غير الإنسان يجوز بما لا نجاسة فيه، والمتنجس محل خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2002}"
  en: "Anointing (idhan) is smearing oneself with oil or perfume that contains no impurity. It is generally recommended for a person, and especially for the Friday prayer, the festivals and gatherings; women are excluded from it when they attend the Friday prayer, and it is forbidden or disliked in ihram, seclusion, fasting and mourning. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2001} Anointing objects is permitted if they are free of impurity; an impure substance is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2002}"
  es: "La unción (idhan) consiste en ungirse con aceite o perfume que no contenga impurezas. Generalmente se recomienda para la persona, especialmente para la oración del viernes, las festividades y las reuniones; las mujeres están excluidas de ella cuando asisten a la oración del viernes, y está prohibida o desaconsejada durante el ihram, el aislamiento, el ayuno y el luto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2001} Ungir objetos está permitido si están libres de impurezas; una sustancia impura es motivo de controversia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2002}"
  fr: "L'onction (idhan) consiste à s'enduire d'huile ou de parfum pur. Elle est généralement recommandée, notamment pour la prière du vendredi, les fêtes et les rassemblements. Les femmes en sont exemptées lorsqu'elles assistent à la prière du vendredi. L'onction est interdite ou déconseillée pendant l'ihram, la retraite spirituelle, le jeûne et le deuil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2001} L'onction d'objets est permise s'ils sont purs; l'utilisation d'une substance impure est controversée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2002}"
  ur: "مسح کرنا ⁦(ادھان)⁩ اپنے آپ کو تیل یا عطر سے مسح کرنا ہے جس میں کوئی نجاست نہیں ہے۔ یہ عام طور پر ایک شخص کے لئے سفارش کی جاتی ہے، اور خاص طور پر جمعہ کی نماز، تہواروں اور اجتماعات کے لئے؛ عورتیں اس سے خارج ہیں جب وہ جمعہ کی نماز میں حاضر ہوں، اور یہ احرام، خلوت، روزہ اور ماتم میں حرام یا ناپسندیدہ ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 2001} مسح کرنے کی اجازت ہے اگر وہ نجاست سے پاک ہوں۔ ایک ناپاک مادہ متنازعہ ہے. {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 2002}"
  tr: "Boyama, kirli olmayan yağ veya parfümle boyamaktır. Genel olarak bir kişi için önerilir ve Cuma, Bayram ve insan toplantıları için onaylanır. Kadınlar Cuma için istisnadır, ayrıca İhram, İ'tikaf, oruç ve İhdad durumları da istisnadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.2001} Ve insan olmayanlar için, kirli olmamışsa izin verilir, ancak kirli olan tartışmalıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.2002}"
  id: "Melukis adalah melukis dengan minyak atau parfum yang tidak mengandung kekotoran. Lukisan direkomendasikan untuk seseorang secara umum, dan dikonfirmasi untuk hari Jumat, Idul Fitri, dan pertemuan orang. Wanita adalah pengecualian untuk hari Jumat, begitu juga dengan Ihram, I'tikaf, puasa, dan Ihdad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.2001} Dan bagi non-manusia, diperbolehkan jika tidak ada kekotoran, tetapi apa yang tidak suci masih menjadi perdebatan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.2002}"
