label:
  ar: "ادّهان"
  en: "Idhan (anointing with oil or perfume: its general ruling, the Friday and festival occasions, and the cases where it is forbidden)"
summary:
  ar: "الادّهان الاطلاء بالدهن أو الطيب مما لا نجاسة فيه، وهو مستحب للإنسان في الجملة، ويتأكد للجمعة والعيد ومجامع الناس، ويُستثنى منه النساء في الجمعة، وحالات الإحرام والاعتكاف والصوم والإحداد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2001} وفي غير الإنسان يجوز بما لا نجاسة فيه، والمتنجس محل خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2002}"
  en: "Anointing (idhan) is smearing oneself with oil or perfume that contains no impurity. It is generally recommended for a person, and especially for the Friday prayer, the festivals and gatherings; women are excluded from it when they attend the Friday prayer, and it is forbidden or disliked in ihram, seclusion, fasting and mourning. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2001} Anointing objects is permitted if they are free of impurity; an impure substance is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2002}"
