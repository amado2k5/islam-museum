id: concept/istirkha-al-litha
class: concept
kind: scientific
label:
  ar: "استرخاء اللثة"
  en: "The relaxation of the gum"
  ur: "مسوڑھے کا استرخاء"
  es: "La relajación de la encía"
  fr: "Le relâchement de la gencive"
summary:
  ar: "استرخاء اللثة إن كان يسيراً كفت فيه المضمضة بما طبخ فيه القوابض الحارة أو الباردة بحسب المزاج، ومن الشديد النفع فيه الشب المطبوخ في الخل، وإن كان كثيراً فالصواب أن يشرط ويترك الدم يجري ويتفل ما يجري منه ثم يتمضمض بعده بسلاقة القوابض على الوجه المذكور فيما سلف، ومن الموافق لذلك من السلاقات واللطوخات اللاصقة ما وصف، وقد ينفع التحنيك بما وصف ويتمضمض بعده بما وصف من الأخلال ويستعمل السنونات القوية، وفصد الجهارك نافع فيه ⁦(الشروط والفصد محمولة كما سماها الكتاب لا عملية والأسماء من هذا الجنس مطروحة)⁩ {cite:canon-ibn-sina-print-v2 p.282}"
  en: "The gum's relaxation, if slight, is served by rinsing with what the hot astringents, or the cold according to the temperament, were cooked in — the alum cooked in vinegar being of the strongest benefit in it; if it is much, the right is that it be scarified and the blood left to run, what runs being spat out, then the mouth rinsed with the decoction of the astringents in the way stated before; of the decoctions and the adhesive smears agreeable to it are what he described, and palate-rubbing with what he stated may help, the mouth then rinsed with the stated vinegars and the strong dentifrices used; and venesection of the jaharik benefits it (the scarification and the venesection carried as the book names them, not as procedures; the names of this kind left out) {cite:canon-ibn-sina-print-v2 p.282}"
  ur: "مسوڑھے کا استرخاء اگر کم ہو تو اس میں اس چیز کی کلانی کافی ہے جس میں گرم قابض یا مزاج کے مطابق سرد چیزیں پکائی گئیں — اور سرکہ میں پکا ہوا شب اس میں نہایت سودا ہے؛ اور اگر زیادہ ہو تو صواب یہ ہے کہ شرط لگائی جائے اور خون بہنے دیا جائے اور بہنے والا تھوکا جائے پھر مذکورہ طریقے پر قابضوں کے جوشاندے سے کلانی کی جائے؛ اور اس کے موافق جوشاندوں اور چپکنے والی لطوخوں میں اس کی بیان کردہ چیزیں ہیں؛ اور بیان کردہ چیز سے تحنیک ⁦(یعنی حنک کی مالش، محرر کی تحریر)⁩ سودا کر سکتا ہے اور پھر بیان کردہ سرکوں سے کلانی اور مضبوط سنون استعمال ہوتے ہیں؛ اور جہارک کا فصد اسے نفع دیتا ہے ⁦(شرط اور فصد کتاب کے نام پر محمول، طریقہ نہیں؛ اسی جنس کے نام مطروح)⁩ {cite:canon-ibn-sina-print-v2 p.282}"
  es: "La relajación de la encía, si es leve, se logra enjuagándola con la solución en la que se cocinaron los astringentes calientes, o fríos según el temperamento; el alumbre cocido en vinagre es el más beneficioso. Si la inflamación es abundante, conviene escarificarla y dejar que la sangre fluya, escupiendo lo que fluye; luego, enjuagarse la boca con la decocción de los astringentes como se indicó anteriormente. Entre las decocciones y ungüentos adhesivos adecuados se encuentran los que él describió, y frotarse el paladar con lo que mencionó puede ayudar. Después, enjuagarse la boca con los vinagres indicados y los dentífricos fuertes utilizados. La flebectomía del jaharik también resulta beneficiosa (la escarificación y la flebectomía se realizan como las nombra el libro, no como procedimientos; se omiten los nombres de este tipo). {cite:canon-ibn-sina-print-v2 p.282}"
  fr: "Si l'inflammation gingivale est légère, on la soulage en rinçant la bouche avec la solution dans laquelle les astringents chauds, ou froids selon le tempérament, ont été cuits – l'alun cuit dans du vinaigre étant le plus efficace. Si l'inflammation est importante, il convient de la scarifier et de laisser le sang couler, puis de recracher le liquide et de se rincer la bouche avec la décoction des astringents, comme indiqué précédemment. Parmi les décoctions et les pommades adhésives appropriées, on peut citer celles décrites par Ibn Sina. Se frotter le palais avec les produits mentionnés peut également être utile. On rince ensuite la bouche avec les vinaigres et les dentifrices puissants indiqués. Enfin, la saignée du jaharik est bénéfique (la scarification et la saignée sont pratiquées telles que décrites dans le livre, et non comme des procédures; les noms de ces procédures sont omis). {cite:canon-ibn-sina-print-v2 p.282}"
