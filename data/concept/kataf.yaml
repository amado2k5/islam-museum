id: concept/kataf
class: concept
kind: legal
label:
  ar: "كَتِف"
  en: "Shoulder blade (kataf)"
  ur: "کندھا (کتف)"
summary:
  ar: "الكَتِف في اللغة عظم عريض خلف المنكب، وتطلق في الفقه على حكم قطع اليد وكسر العظم. فجمهور الفقهاء يجيزون القصاص في قطع اليد من مفصل الكتف بشرط أن يؤمن حدوث جائفة، فإن خيفت جائفة اقتص من المرفق. ولا قصاص في كسر الكتف ولا أرش مقدر فيه، وإنما تجب فيه حكومة. ومن أحكام الكتف في الصلاة السدل والاضطباع في الطواف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13211} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13212}"
  en: "In the lexicon kataf is the broad bone behind the shoulder, and in the law of injuries it names the rules on cutting the arm and breaking the bone. Most jurists allow retaliation for cutting the hand at the shoulder joint, provided a deep wound into the body is not feared; if it is feared, retaliation is at the elbow. Breaking the shoulder blade carries no fixed retaliation or fixed compensation, only an assessed sum. Related rules include the sadl and the idtiba' in circumambulation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13211} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13212}"
  ur: "لغت میں کتف کندھے کے پیچھے کی چوڑی ہڈی کو کہتے ہیں، اور فقہ میں اس سے ہاتھ کاٹنے اور ہڈی توڑنے کے احکام مراد ہیں۔ جمہور فقہاء کندھے کے جوڑ سے ہاتھ کاٹنے میں قصاص کے قائل ہیں، جب جسم میں گہرے زخم کا خطرہ نہ ہو؛ خطرہ ہو تو کہنی سے قصاص لیا جائے گا۔ کندھے کی ہڈی توڑنے میں نہ قصاص ہے، نہ مقرر ارش، بلکہ حکومت (تخمینی تاوان) واجب ہے۔ نماز میں سدل اور طواف میں اضطباع بھی اس سے متعلق احکام ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13211} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13212}"
