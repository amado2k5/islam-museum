label: { ar: "الجذب إلى الخلاف القريب والبعيد عند ابن سينا", en: "Drawing to the near and far opposite in the Canon", ur: "قریبی اور دور مخالف جانب کھینچنا قانون میں" }
summary:
  ar: "يذكر ابن سينا أن قلع المادة من موضعها يكون على وجهين: بالجذب إلى الخلاف البعيد وبالجذب إلى الخلاف القريب، ويمثل بمن يسيل من فمه دم كثير وبامرأة يفرط سيلان بواسيرها، ويشترط أن يكون البعد في قطر واحد وأن يسكن وجع الموضع أولاً {cite:canon-ibn-sina-print-v1 p.275}."
  en: "Ibn Sina says matter is removed from its place in two ways, by drawing to the far opposite and by drawing to the near opposite, using the example of a man bleeding heavily from the mouth and a woman with an excessive flow from her piles, and he requires that the distance lie along one diameter and that the pain of the place be eased first {cite:canon-ibn-sina-print-v1 p.275}."
