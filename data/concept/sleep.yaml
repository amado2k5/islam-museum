  ur: "نیند"
summary:
  ar: "جعل الله نومكم سباتاً وجعل الليل لباساً، وهو يتوفى الأنفس حين موتها والتي لم تمت في نومها فيمسك التي قضى عليها الموت، ونوم أهل الكهف ثلاثمئة سنين وازدادوا تسعاً."
  en: "God made your sleep a rest and the night a garment; He takes the souls at their death and those that die not in their sleep, holding back the one decreed for death; and the sleepers of the cave lay three hundred years and nine."
  ur: "اللہ نے تمہاری نیند کو آرام اور رات کو لباس بنایا؛ وہ موت پر جانیں لے لیتا ہے اور جو نیند میں نہ مریں ان میں سے جس کے لیے موت کا حکم ہے اسے روکے رکھتا ہے؛ اور کہف والے تین سو برس اور نو سوئے۔"
