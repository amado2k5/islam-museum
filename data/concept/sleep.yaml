  id: "Tidur"
summary:
  ar: "جعل الله نومكم سباتاً وجعل الليل لباساً، وهو يتوفى الأنفس حين موتها والتي لم تمت في نومها فيمسك التي قضى عليها الموت، ونوم أهل الكهف ثلاثمئة سنين وازدادوا تسعاً."
  en: "God made your sleep a rest and the night a garment; He takes the souls at their death and those that die not in their sleep, holding back the one decreed for death; and the sleepers of the cave lay three hundred years and nine."
  ur: "اللہ نے تمہاری نیند کو آرام اور رات کو لباس بنایا؛ وہ موت پر جانیں لے لیتا ہے اور جو نیند میں نہ مریں ان میں سے جس کے لیے موت کا حکم ہے اسے روکے رکھتا ہے؛ اور کہف والے تین سو برس اور نو سوئے۔"
  es: "Dios hizo de tu sueño un descanso y de la noche una vestidura; Él toma las almas en su muerte y a las que no mueren mientras duermen, reteniendo a la que fue destinada a la muerte; y los durmientes de la cueva yacían trescientos años y nueve."
  fr: "Dieu a fait de ton sommeil un repos et de la nuit un vêtement; Il reprend les âmes à leur mort et celles qui ne meurent pas dans leur sommeil, retenant celle qui est vouée à la mort; et les dormeurs de la caverne restèrent trois cent neuf ans."
  tr: "Tanrı uykunuzu uykuya çevirdi, geceyi bir giysi yaptı; öldükleri ruhları ve uykuda ölmeyenleri alır, böylece ölümün emrettiği kişileri tutar. Mağara halkının uykusu üç yüz yıldır ve dokuz yıl artmıştır."
  id: "Tuhan menjadikan tidurmu sebagai tidur dan menjadikan malam sebagai pakaian, dan Dia mengambil jiwa pada saat kematian mereka dan yang tidak mati dalam tidur, sehingga Dia menahan mereka yang telah ditetapkan oleh kematian. Tidur orang-orang gua itu selama tiga ratus tahun, dan jumlahnya bertambah sembilan tahun."
