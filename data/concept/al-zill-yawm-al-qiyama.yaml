id: concept/al-zill-yawm-al-qiyama
class: concept
kind: belief
label:
  ar: "الظل يوم لا ظل إلا ظله"
  en: "The Shade on the day of no shade but His"
  ur: "سایہ جس دن اس کے سائے کے سوا نہ ہو"
summary:
  ar: "سبعة يظلهم الله في ظله يوم لا ظل إلا ظله: الإمام العادل، وشاب نشأ في عبادة الله، ورجل قلبه معلق بالمساجد، ورجلان تحابا في الله، ورجل طلبته امرأة فقال إني أخاف الله، ورجل تصدق فأخفى، ورجل ذكر الله خاليا ففاضت عيناه {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  en: "Seven God shades in His shade on the day of no shade but His: a just ruler, a youth raised in worship, a man whose heart hangs on the mosque, two who love each other for God, a man seduced who says I fear God, a man who gives charity in secret, and a man who remembers God alone and weeps {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  ur: "سات اشخاص کو اللہ اپنے سائے میں جگہ دے گا جس دن اس کے سائے کے سوا کوئی سایہ نہ ہو گا: عادل حکمران، عبادت میں پلا جوان، مسجد سے جڑا دل، اللہ کے لیے ایک دوسرے سے محبت کرنے والے دو شخص، عورت کی دعوت ٹھکرانے والا، چھپ کر صدقہ کرنے والا، اور تنہائی میں اللہ کو یاد کر کے رونے والا {cite:sahih-al-bukhari} {cite:sahih-muslim}۔"
