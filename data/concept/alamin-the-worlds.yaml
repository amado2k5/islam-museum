id: concept/alamin-the-worlds
class: concept
kind: term
label: { ar: "العالَمين: العوالم في الفاتحة وأقوال المفسرين", en: "Al-'alamin: the worlds in al-Fatiha and the commentators", ur: "العالَمین: سورۂ فاتحہ میں عوالم اور مفسرین کے اقوال" }
summary:
  ar: "لفظ «العالمين» في الفاتحة 1:2 جمع عالَم، وهو عند الطبري أصناف الأمم وأهل كل قرن، وعند ابن كثير كل موجود سوى الله؛ وتُروى أعداد للعوالم عن أبي العالية وتُبيع الحميري ووهب ومقاتل وأبي سعيد الخدري، منها ما علّق عليه ابن كثير بأنه يحتاج دليلاً صحيحاً، ويقول الرازي إن الله قادر على خلق ألف ألف عالم خارج هذا العالم. {cite:tafsir-tabari-quran-com on 1:2} {cite:tafsir-ibn-kathir on 1:2} {cite:mafatih-al-ghayb-quran-tafsir-net on 1:2}"
  en: "The word al-'alamin in al-Fatiha 1:2 is the plural of 'alam: for al-Tabari the classes of nations and the people of each age, for Ibn Kathir everything other than God. Numbers of worlds are reported from Abu al-'Aliya, Tubay' al-Himyari, Wahb, Muqatil and Abu Sa'id al-Khudri, one of which Ibn Kathir says needs sound evidence; al-Razi says God is able to create a thousand thousand worlds outside this one. {cite:tafsir-tabari-quran-com on 1:2} {cite:tafsir-ibn-kathir on 1:2} {cite:mafatih-al-ghayb-quran-tafsir-net on 1:2}"
  ur: "لفظ «العالمین» سورۂ فاتحہ 1:2 میں عالَم کی جمع ہے؛ طبری کے نزدیک امتوں کی اقسام اور ہر دور کے لوگ، ابن کثیر کے نزدیک اللہ کے سوا ہر موجود۔ ابو العالیہ، تُبَیع حِمیری، وہب، مقاتل اور ابو سعید خدری سے عوالم کے اعداد مروی ہیں جن میں سے ایک پر ابن کثیر کہتے ہیں کہ اسے صحیح دلیل چاہیے؛ رازی کہتے ہیں کہ اللہ اس عالَم سے باہر ایک ہزار ہزار عالَم پیدا کر سکتا ہے۔ {cite:tafsir-tabari-quran-com on 1:2} {cite:tafsir-ibn-kathir on 1:2} {cite:mafatih-al-ghayb-quran-tafsir-net on 1:2}"
