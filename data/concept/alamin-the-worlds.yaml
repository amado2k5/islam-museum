label: { ar: "العالَمين: العوالم في الفاتحة وأقوال المفسرين", en: "Al-'alamin: the worlds in al-Fatiha and the commentators", fr: "Al-’alamin : les mondes dans al-Fatiha et chez les commentateurs", ur: "العالَمین: سورۂ فاتحہ میں عوالم اور مفسرین کے اقوال", es: "Al-'alamin: los mundos en al-Fatiha y los comentaristas", tr: "Dünyalar: El-Fatiha'daki Dünyalar ve Tefsircilerin Sözleri", id: "Dunia: Dunia dalam Al-Fatiha dan Kata-kata Para Komentator" }
summary:
  ar: "لفظ «العالمين» في الفاتحة 1:2 جمع عالَم، وهو عند الطبري أصناف الأمم وأهل كل قرن، وعند ابن كثير كل موجود سوى الله؛ وتُروى أعداد للعوالم عن أبي العالية وتُبيع الحميري ووهب ومقاتل وأبي سعيد الخدري، منها ما علّق عليه ابن كثير بأنه يحتاج دليلاً صحيحاً، ويقول الرازي إن الله قادر على خلق ألف ألف عالم خارج هذا العالم. {cite:tafsir-tabari-quran-com on 1:2} {cite:tafsir-ibn-kathir on 1:2} {cite:mafatih-al-ghayb-quran-tafsir-net on 1:2}"
  en: "The word al-'alamin in al-Fatiha 1:2 is the plural of 'alam: for al-Tabari the classes of nations and the people of each age, for Ibn Kathir everything other than God. Numbers of worlds are reported from Abu al-'Aliya, Tubay' al-Himyari, Wahb, Muqatil and Abu Sa'id al-Khudri, one of which Ibn Kathir says needs sound evidence; al-Razi says God is able to create a thousand thousand worlds outside this one. {cite:tafsir-tabari-quran-com on 1:2} {cite:tafsir-ibn-kathir on 1:2} {cite:mafatih-al-ghayb-quran-tafsir-net on 1:2}"
  fr: "Dans al-Fatiha 1:2, le mot al-’alamin est le pluriel de ’alam. Pour al-Tabari, il désigne les différentes catégories de peuples et les gens de chaque époque ; pour Ibn Kathir, tout ce qui existe en dehors de Dieu. Des nombres de mondes sont rapportés d’Abu al-’Aliya, Tubay’ al-Himyari, Wahb, Muqatil et Abu Sa’id al-Khudri. Ibn Kathir précise que l’un de ces nombres requiert une preuve solide. Al-Razi dit que Dieu peut créer mille fois mille mondes en dehors du nôtre. {cite:tafsir-tabari-quran-com on 1:2} {cite:tafsir-ibn-kathir on 1:2} {cite:mafatih-al-ghayb-quran-tafsir-net on 1:2}"
  ur: "لفظ «العالمین» سورۂ فاتحہ 1:2 میں عالَم کی جمع ہے؛ طبری کے نزدیک امتوں کی اقسام اور ہر دور کے لوگ، ابن کثیر کے نزدیک اللہ کے سوا ہر موجود۔ ابو العالیہ، تُبَیع حِمیری، وہب، مقاتل اور ابو سعید خدری سے عوالم کے اعداد مروی ہیں جن میں سے ایک پر ابن کثیر کہتے ہیں کہ اسے صحیح دلیل چاہیے؛ رازی کہتے ہیں کہ اللہ اس عالَم سے باہر ایک ہزار ہزار عالَم پیدا کر سکتا ہے۔ {cite:tafsir-tabari-quran-com on 1:2} {cite:tafsir-ibn-kathir on 1:2} {cite:mafatih-al-ghayb-quran-tafsir-net on 1:2}"
  es: "La palabra al-'alamin en al-Fatiha 1:2 es el plural de 'alam: para al-Tabari, las clases de naciones y los pueblos de cada época; para Ibn Kathir, todo lo que no sea Dios. Abu al-'Aliya, Tubay' al-Himyari, Wahb, Muqatil y Abu Sa'id al-Khudri mencionan varios mundos, uno de los cuales, según Ibn Kathir, requiere pruebas sólidas; al-Razi afirma que Dios es capaz de crear mil mundos fuera de este. {cite:tafsir-tabari-quran-com on 1:2} {cite:tafsir-ibn-kathir on 1:2} {cite:mafatih-al-ghayb-quran-tafsir-net on 1:2}"
  tr: "Al-Fatiha 1:2'deki 'al-'alamin' kelimesi, 'alam'ın çoğuludur; al-Tabari'ye göre bu kelime her çağın ulus ve halkı kategorilerini ifade ederken, İbn Kathir'e göre Allah hariç var olan her şeydir. Dünyalar için sayılar Ebu eliyye ve Ebu al-Aliyah'dan, el-Himyari, Vahb, Mukatil ve Ebu Seyid el-Hudri dahil olmak üzere anlatılmıştır. Bazıları İbn Ketir tarafından gerçek kanıta ihtiyaç duyulduğunu belirtir. El-Razi, Allah'ın bu dünyanın dışında bin bin alimi yaratabileceğini söyler. {alıntı:Tafsir-Tabari-Kuran-Com 1:2'de} {alıntı:Tefsir-ibn-Kathir 1:2'de} {Cite:Mafatih-al-ghayb-Quran-Tafsir-net 1:2'de}"
  id: "Kata 'al-'alamin' dalam Al-Fatiha 1:2 adalah jamak dari 'alam'; menurut al-Tabari, kata ini merujuk pada kategori bangsa dan bangsa dari setiap zaman, sedangkan menurut Ibn Kathir, kata ini berarti segala sesuatu yang ada kecuali Allah. Angka-angka untuk dunia-dunia telah dijelaskan dari Abu Aliyah dan Abu al-Aliyah, termasuk al-Himyari, Wahb, Mukatil, dan Abu Sayyid al-Khudri. Beberapa menyatakan bahwa Ibn Kathir membutuhkan bukti nyata. Al-Razi mengatakan bahwa Allah dapat menciptakan seribu ulama di luar dunia ini. {kutipan: Tafsir-Tabari-Quran-Com 1:2} {kutipan: Tafsir-ibn-Kathir 1:2} {Cite:Mafatih-al-ghayb-Quran-Tafsir-net 1:2'de}"
