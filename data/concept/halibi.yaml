label:
  ar: "حالبي"
  en: "Halibi (the ureter plant)"
  ur: "حالبی ⁦(حالب کی دوا)⁩"
  es: "Halibi (la planta del uréter)"
  fr: "Halibi (la plante uretère)"
summary:
  ar: "حالبي نبات سُمّي كذلك لأن له خاصية في شفاء أورام الحالب، يُضمّد به أو يُعلّق على الجسم، وهو مركّب القوى كالورد، فيه قوة مبرّدة مع حرارة، محلّل، ومبرّد دافع."
  en: "Halibi is a plant named for its power over swellings of the ureter, applied as a poultice or hung on the body. The book says it has a cooling power with some heat, is dissolving, and has a cooling, expelling power."
  ur: "حالبی ایک پودا ہے جس کا نام حالب کی سوجن پر اثر کی وجہ سے پڑا، اسے ضماد کے طور پر لگایا جاتا ہے یا جسم پر لٹکایا جاتا ہے۔ کتاب کے مطابق اس میں حرارت کے ساتھ ٹھنڈک کی قوت ہے، یہ تحلیل کرنے والا ہے اور ٹھنڈک سے دافع ہے۔"
  es: "Halibi es una planta que recibe su nombre por su poder para tratar la inflamación del uréter, y se aplica en forma de cataplasma o colgada sobre el cuerpo. El libro indica que tiene un efecto refrescante con cierto calor, es disolvente y tiene propiedades refrescantes y depurativas."
  fr: "L'halibi est une plante ainsi nommée pour son efficacité contre les gonflements de l'uretère; elle est appliquée en cataplasme ou suspendue au corps. Le livre indique qu'elle possède des propriétés rafraîchissantes et légèrement chauffantes, qu'elle est dissolvante et qu'elle a un effet purifiant et laxatif."
