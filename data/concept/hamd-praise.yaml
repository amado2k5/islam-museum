label: { ar: "الحمد", en: "Hamd (praise of God and thanks)", ur: "حمد" }
summary:
  ar: "الحمد لغة نقيض الذم، وهو الشكر والرضا والثناء الكامل بالكلام على جميل اختياري على سبيل التعظيم، ويفترق عن المدح والشكر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7292} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7294} ومجامع الحمد: الحمد لله حمدا يوافي نعمه ويكافئ مزيده، وأحسن عباراته: الحمد لله رب العالمين، وهي فاتحة الكتاب العزيز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7308} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7309} والحمد لله وحده على الكمال، ونُهي الإنسان عن تزكية نفسه، ونُهي عن مدح غيره بما ليس فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7294} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7295} ويُستحب الابتداء بحمد الله في الأمور المهمة، وفي الخطب والتأليف والمخاطبة، وفي دعاء الاستفتاح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7295} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7296} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7297} والتحميد في الركوع والسجود والرفع منه يختلف فيه الأئمة، وقول «ربنا ولك الحمد» يقوله المقتدي، والمنفرد يجمع بين التسميع والتحميد عند الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7297} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7298} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7299} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7300} ويستحب الحمد بعد الصلاة، وهو مطلوب في الخطب، وتختلف المذاهب في وجوبه في خطبتي الجمعة والعيدين والاستسقاء والكسوف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7301} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7302} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7303} ويستحب الحمد عند النعمة الظاهرة ودفع النقمة، وعند تهنئة المبتلى سرا، وبعد العطاس، وعند الصباح والمساء، وعند فقد الولد، ورؤية المحبوب والمكروه، ودخول السوق، والنظر في المرآة، وركوب الدابة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7304} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7305} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7306} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7307} وتذكر في المدخل أمثلة من أحاديث الحمد والتسبيح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7308} "
  en: "Hamd is lexically the opposite of blame and means thanks, contentment and full praise in speech for a voluntary excellence; it is narrower than praise and wider than thanks. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7292} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7294} The fullest form is 'praise belongs to God, Lord of the worlds', which opens the Quran; the expression 'praise that matches His bounties and multiplies them' is also cited. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7308} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7309} Praise is due to God alone, a person may not praise himself, and praising another for what he does not have is forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7294} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7295} Opening important affairs with praise of God is recommended, in speeches, writings and openings of prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7295} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7296} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7297} Praise during bowing, prostrating and rising from bowing is disputed among the schools; the follower says 'our Lord, to You be praise', while the lone prayer joins the two in the Shafii view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7297} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7298} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7299} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7300} Praise after prayer is recommended; in the Friday, festival, rain-prayer and eclipse sermons the schools differ on whether it is required. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7301} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7302} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7303} Praise is recommended at a sudden blessing or the removal of a harm, quietly before one afflicted, after sneezing, at morning and evening, at the loss of a child, at seeing what one loves or dislikes, on entering the market, before the mirror and on mounting a beast. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7304} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7305} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7306} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7307} The entry closes at the next headword, hamdala, which is a cross-reference to hamd, and then ḥaml (حمل). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7309} "
  ur: "حمد لغت میں مذمت کی ضد ہے؛ یہ شکر، رضا اور اختیاری خوبی پر تعظیم کے ساتھ کامل زبانی تعریف ہے، اور مدح سے خاص اور شکر سے عام ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7292} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7294} حمد کے مجامع میں سے: «الحمد لله حمدا يوافي نعمه ويكافئ مزيده» ہے، اور سب سے بہترین عبارت «الحمد لله رب العالمين» ہے جو قرآن کی فاتحہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7308} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7309} حمد صرف اللہ کے لیے ہے؛ آدمی اپنی تعریف نہ کرے، اور کسی دوسرے کی ایسی تعریف منع ہے جو اس میں نہ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7294} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7295} اہم کام کی ابتدا اللہ کی حمد سے مستحب ہے، جیسے خطبہ، تصنیف، خطاب اور دعاء استفتاح میں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7295} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7296} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7297} رکوع، سجدہ اور رکوع سے اٹھنے میں تحمید پر ائمہ کا اختلاف ہے؛ مقتدی «ربنا ولك الحمد» کہتا ہے، اور شافعیہ کے نزدیک منفرد تسمیع اور تحمید دونوں جمع کرتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7297} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7298} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7299} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7300} نماز کے بعد حمد مستحب ہے، اور جمعہ، عیدین، استسقاء اور کسوف کے خطبوں میں مذاہب کا اختلاف ہے کہ حمد لازم ہے یا نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7301} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7302} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7303} نعمت ملنے یا تکلیف دور ہونے پر، آزمائش میں مبتلا شخص کو آہستہ کہنا، چھینک کے بعد، صبح و شام، بچے کی وفات پر، پسند یا ناپسند چیز دیکھنے پر، بازار میں داخل ہونے پر، آئینہ دیکھنے پر اور سواری پر سوار ہونے پر حمد مستحب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7304} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7305} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7306} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7307} یہ مدخل p.7309 پر «حمدلة» (جو «حمد» کا حوالہ ہے) اور پھر «حمل» کے عنوان پر ختم ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7309} "
