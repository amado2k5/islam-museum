summary:
  ar: "يرفض عمر عبد الكافي وصف ذوي الاحتياجات الخاصة بـ«المعاق»، ويرى أن المعاق حقًّا من أعاق نفسه عن الطاعة، وأن الإعاقة الحقيقية إعاقة سلوكية: الحسد والحقد وبذاءة اللسان؛ وهذا رأيه."
  en: "Omar Abdelkafy rejects calling people with special needs 'disabled', holding that the truly disabled is one who has disabled himself from obedience, and that real disability is behavioural: envy, rancour and a foul tongue; this is his view."
  ur: "عمر عبد الکافی خصوصی ضروریات والوں کو «معذور» کہنے کو رد کرتے ہیں، ان کے نزدیک حقیقی معذور وہ ہے جس نے خود کو طاعت سے روک لیا، اور اصل معذوری رویے کی ہے: حسد، کینہ اور بدزبانی؛ یہ ان کی رائے ہے۔"
