id: concept/al-iaqa-al-sulukiyya
class: concept
kind: social
label:
  ar: "الإعاقة السلوكية"
  en: "'Behavioural disability'"
  fr: "« Le handicap comportemental »"
  ur: "«رویے کی معذوری»"
  es: "'Discapacidad conductual'"
summary:
  ar: "يرفض عمر عبد الكافي وصف ذوي الاحتياجات الخاصة بـ«المعاق»، ويرى أن المعاق حقًّا من أعاق نفسه عن الطاعة، وأن الإعاقة الحقيقية إعاقة سلوكية: الحسد والحقد وبذاءة اللسان؛ وهذا رأيه."
  en: "Omar Abdelkafy rejects calling people with special needs 'disabled', holding that the truly disabled is one who has disabled himself from obedience, and that real disability is behavioural: envy, rancour and a foul tongue; this is his view."
  fr: "Omar Abdelkafy refuse d'appeler « handicapées » les personnes ayant des besoins particuliers, estimant que le véritable handicapé est celui qui s'est rendu lui-même incapable d'obéissance, et que le vrai handicap est comportemental : l'envie, la rancune et une langue grossière ; c'est son point de vue."
  ur: "عمر عبد الکافی خصوصی ضروریات والوں کو «معذور» کہنے کو رد کرتے ہیں، ان کے نزدیک حقیقی معذور وہ ہے جس نے خود کو طاعت سے روک لیا، اور اصل معذوری رویے کی ہے: حسد، کینہ اور بدزبانی؛ یہ ان کی رائے ہے۔"
  es: "Omar Abdelkafy rechaza que se llame \"discapacitados\" a las personas con necesidades especiales, sosteniendo que la persona verdaderamente discapacitada es aquella que se ha incapacitado a sí misma para obedecer, y que la verdadera discapacidad es de carácter conductual: envidia, rencor y lenguaje soez; esta es su opinión."
