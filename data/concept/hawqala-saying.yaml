summary:
  ar: "الحوقلة في اللغة سرعة المشي، وفي العرف قول: لا حول ولا قوة إلا بالله، وهي مشتقة من الحول والقوة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7415} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7416} ومعنى الحوقلة عند أهل العلم: لا حركة ولا استطاعة إلا بمشيئة الله، أو لا حول عن المعصية إلا بعصمته ولا قوة على الطاعة إلا بمعونته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7416} ويستحب عند سماع الأذان أن يقول السامع: لا حول ولا قوة إلا بالله عند الحيعلة، عند الحنفية والشافعية والحنابلة، والقول الآخر للمالكية أنه لا يحوقل عند الحيعلتين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7416} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7417} وتستحب الحوقلة في مواطن أخرى كالهلكة والمرض وخوف العين والتطير والاستيقاظ من الليل وبعد الصلاة وفي الأذكار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7418} ويختم المدخل بالعنوان التالي «حول» على ص 7419. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7418} "
  en: "Hawqala lexically is walking briskly; in common use it is the saying 'there is no might or power except in God'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7415} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7416} Its meaning: no movement or ability except by God's will, or no turning from sin except by His protection and no power for obedience except by His help. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7416} A listener to the call to prayer should say the hawqala at the two calls 'come to prayer' and 'come to success', according to the Hanafis, Shafiis and Hanbalis; the Malikis have another view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7416} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7417} It is recommended in other cases too: in danger, in sickness, when fearing the evil eye, at omens, on waking at night, and after prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7418} The entry closes at the next headword, hawl (حول), on p.7419. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7418} "
  ur: "حوقلہ لغت میں تیز چلنے کو کہتے ہیں، اور عرف میں «لا حول ولا قوة إلا بالله» کہنے کو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7415} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7416} اس کا معنی یہ ہے کہ اللہ کی مشیت کے بغیر نہ حرکت ہے نہ طاقت، یا گناہ سے بچنا اور اطاعت کی قوت اللہ کی مدد کے بغیر ممکن نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7416} حنفیہ، شافعیہ اور حنابلہ کے نزدیک سننے والے کے لیے مؤذن کی «حيّ على الصلاة» اور «حيّ على الفلاح» پر حوقلہ مستحب ہے، جبکہ مالکیہ کا ایک قول اس کے خلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7416} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7417} ہلاکت، بیماری، نظرِ بد کے خوف، بدشگونی، رات کو بیدار ہونے اور نماز کے بعد بھی حوقلہ مستحب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7418} یہ مدخل p.7419 پر «حول» کے عنوان پر ختم ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7418} "
