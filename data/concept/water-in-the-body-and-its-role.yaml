label: { ar: "دور الماء في البدن عند ابن سينا", en: "The role of water in the body in the Canon", ur: "قانون میں بدن میں پانی کا کردار" }
summary:
  ar: "في الفصل السادس عشر، في أحوال المياه، يقول ابن سينا إن الماء ركن من الأركان ومخصوص من بينها بأنه وحده يدخل في جملة ما يتناول، لا لأنه يغذو، بل لأنه ينفذ الغذاء ويصلح قوامه {cite:canon-ibn-sina-print-v1 p.134}."
  en: "In the sixteenth chapter, on the states of waters, Ibn Sina says water is one of the elements and is singled out among them because it alone enters into what is taken in, not because it nourishes but because it carries the food through and mends its consistency {cite:canon-ibn-sina-print-v1 p.134}."
