label: { ar: "دور الماء في البدن عند ابن سينا", en: "The role of water in the body in the Canon", ur: "قانون میں بدن میں پانی کا کردار", es: "El papel del agua en el cuerpo según el Canon", fr: "Le rôle de l'eau dans le corps selon le canon" }
summary:
  ar: "في الفصل السادس عشر، في أحوال المياه، يقول ابن سينا إن الماء ركن من الأركان ومخصوص من بينها بأنه وحده يدخل في جملة ما يتناول، لا لأنه يغذو، بل لأنه ينفذ الغذاء ويصلح قوامه {cite:canon-ibn-sina-print-v1 p.134}."
  en: "In the sixteenth chapter, on the states of waters, Ibn Sina says water is one of the elements and is singled out among them because it alone enters into what is taken in, not because it nourishes but because it carries the food through and mends its consistency {cite:canon-ibn-sina-print-v1 p.134}."
  es: "En el capítulo dieciséis, sobre los estados de las aguas, Ibn Sina dice que el agua es uno de los elementos y se distingue entre ellos porque solo ella entra en lo que se ingiere, no porque nutra sino porque transporta el alimento y mejora su consistencia {cite:canon-ibn-sina-print-v1 p.134}."
  fr: "Dans le seizième chapitre, sur les états des eaux, Ibn Sina dit que l'eau est l'un des éléments et qu'elle est mise à part parmi eux parce qu'elle seule pénètre dans ce qui est ingéré, non pas parce qu'elle nourrit mais parce qu'elle transporte la nourriture et en modifie la consistance {cite:canon-ibn-sina-print-v1 p.134}."
