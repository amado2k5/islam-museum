id: concept/raiha-fiqh
class: concept
kind: legal
label:
  ar: "الرائحة"
  en: "Smell (raiha) in the rulings: purity, pilgrim, mosques, harm, the drinker and the wife"
  ur: "بو ⁦(فقہی احکام)⁩"
  es: "El olor (raiha) en las normas: pureza, peregrino, mezquitas, daño, el bebedor y la esposa"
  fr: "L'odeur (raiha) dans les règles: pureté, pèlerinage, mosquées, préjudice, buveur et épouse"
summary:
  ar: "الرائحة في اللغة النسيم طيبا كان أو نتنا، وهي عرض يُدرك بحاسة الشم، وقيل لا يطلق اسم الريح إلا على الطيب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8564} وتختلف أحكام الرائحة باختلاف أبواب الفقه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8564} فإذا غيّرت النجاسة أو المخالط أحد أوصاف الماء زالت طهوريته عند جمهور الفقهاء، وعند الحنفية لا تزول ما لم يزل طبع الماء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8565} ويحرم على المحرم استعمال ما تُقصد رائحته من الطيب، ولا يحرم ما لا تُقصد رائحته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8565} ويُستحب تطييب المساجد، ويُصان من الروائح الكريهة كالثوم والبصل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8565} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8566} ولا يثبت حد الشرب بوجود رائحة الخمر عند أكثر أهل العلم، ويثبت عند المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8566} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8567} وللزوج منع زوجته مما يتأذى من رائحته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8567}"
  en: "Smell is an accident perceived by the sense of smell, whether pleasant or foul; the word rih is used by some only for a pleasant scent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8564} Its ruling changes with the chapter of law. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8564} If an impurity or a mixed substance changes the smell of water, most jurists say the water loses its purifying power, while the Hanafis say it does not unless its nature as water is lost. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8565} A pilgrim in the state of ihram may not use scents whose smell is intended, but fruit with a pleasant smell is not forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8565} Mosques are to be perfumed and kept free of foul smells such as garlic and onion, and a person with such a smell is kept from the congregation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8565} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8566} The smell of wine on a drinker's breath does not prove the hadd penalty in the view of most jurists, but the Malikis accept it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8566} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8567} A husband may forbid his wife what gives him an unpleasant smell, and he may require her to remove foul odours from her body and clothes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8567}"
  ur: "رائحہ سے مراد نسیم ہے، خواہ خوشبو ہو یا بدبو، اور اس کے احکام ابواب کے لحاظ سے مختلف ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8564}"
  es: "El olor es un accidente percibido por el sentido del olfato, ya sea agradable o desagradable; la palabra rih es utilizada por algunos solo para un aroma agradable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8564} Su regla cambia con el capítulo de la ley. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8564} Si una impureza o una sustancia mixta cambia el olor del agua, la mayoría de los juristas dicen que el agua pierde su poder purificador, mientras que los hanafíes dicen que no lo pierde a menos que pierda su naturaleza como agua. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8565} Un peregrino en estado de ihram no puede usar perfumes cuyo olor sea intencional, pero la fruta con un olor agradable no está prohibida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8565} Las mezquitas deben estar perfumadas y libres de malos olores como ajo y cebolla, y una persona con tal olor es excluida de la congregación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8565} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8566} El olor a vino en el aliento de un bebedor no prueba la pena hadd en opinión de la mayoría de los juristas, pero los malikíes lo aceptan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8566} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8567} Un marido puede prohibir a su esposa lo que le produce un olor desagradable, y puede exigirle que elimine los malos olores de su cuerpo y ropa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8567}"
  fr: "L'odeur est un accident perçu par l'odorat, qu'elle soit agréable ou désagréable; le terme « rih » est parfois employé uniquement pour désigner un parfum agréable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8564} Son application varie selon le chapitre de la loi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8564} Si une impureté ou une substance mélangée modifie l'odeur de l'eau, la plupart des juristes estiment qu'elle perd son pouvoir purificateur, tandis que les hanafites affirment le contraire, à condition que sa nature d'eau soit altérée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8565} Un pèlerin en état d'ihram ne peut utiliser de parfums dont l'odeur est recherchée, mais les fruits agréablement parfumés ne sont pas interdits. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8565} Les mosquées doivent être parfumées et exemptes d'odeurs nauséabondes telles que l'ail et l'oignon; une personne dégageant une telle odeur est exclue de la prière en congrégation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8565} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8566} L'odeur de vin sur l'haleine d'un buveur ne constitue pas, de l'avis de la plupart des juristes, une preuve de la peine de hadd, mais les malikites l'acceptent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8566} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8567} Un mari peut interdire à sa femme ce qui lui dégage une odeur désagréable et il peut exiger d'elle qu'elle se débarrasse des mauvaises odeurs de son corps et de ses vêtements. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8567}"
