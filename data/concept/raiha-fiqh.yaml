id: concept/raiha-fiqh
class: concept
kind: legal
label:
  ar: "الرائحة"
  en: "Smell (raiha) in the rulings: purity, pilgrim, mosques, harm, the drinker and the wife"
  ur: "بو (فقہی احکام)"
summary:
  ar: "الرائحة في اللغة النسيم طيبا كان أو نتنا، وهي عرض يُدرك بحاسة الشم، وقيل لا يطلق اسم الريح إلا على الطيب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8564} وتختلف أحكام الرائحة باختلاف أبواب الفقه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8564} فإذا غيّرت النجاسة أو المخالط أحد أوصاف الماء زالت طهوريته عند جمهور الفقهاء، وعند الحنفية لا تزول ما لم يزل طبع الماء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8565} ويحرم على المحرم استعمال ما تُقصد رائحته من الطيب، ولا يحرم ما لا تُقصد رائحته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8565} ويُستحب تطييب المساجد، ويُصان من الروائح الكريهة كالثوم والبصل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8565} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8566} ولا يثبت حد الشرب بوجود رائحة الخمر عند أكثر أهل العلم، ويثبت عند المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8566} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8567} وللزوج منع زوجته مما يتأذى من رائحته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8567}"
  en: "Smell is an accident perceived by the sense of smell, whether pleasant or foul; the word rih is used by some only for a pleasant scent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8564} Its ruling changes with the chapter of law. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8564} If an impurity or a mixed substance changes the smell of water, most jurists say the water loses its purifying power, while the Hanafis say it does not unless its nature as water is lost. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8565} A pilgrim in the state of ihram may not use scents whose smell is intended, but fruit with a pleasant smell is not forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8565} Mosques are to be perfumed and kept free of foul smells such as garlic and onion, and a person with such a smell is kept from the congregation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8565} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8566} The smell of wine on a drinker's breath does not prove the hadd penalty in the view of most jurists, but the Malikis accept it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8566} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8567} A husband may forbid his wife what gives him an unpleasant smell, and he may require her to remove foul odours from her body and clothes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8567}"
  ur: "رائحہ سے مراد نسیم ہے، خواہ خوشبو ہو یا بدبو، اور اس کے احکام ابواب کے لحاظ سے مختلف ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8564}"
