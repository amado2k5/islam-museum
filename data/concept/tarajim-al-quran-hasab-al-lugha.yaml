tags: [arabiyya-browser, arabiyya-ijaz]
label:
  ar: "ترجمات القرآن بحسب اللغات: الإنجليزية والفرنسية والإسبانية والأردية والفارسية والتركية والسواحلية"
  en: "Qur'an translations by language: English, French, Spanish, Urdu, Persian, Turkish and Swahili"
  ur: "زبانوں کے لحاظ سے قرآن کے تراجم: انگریزی، فرانسیسی، ہسپانوی، اردو، فارسی، ترکی اور سواحلی"
  fr: "Les traductions du Coran par langue : anglais, français, espagnol, ourdou, persan, turc et swahili"
  es: "Traducciones del Corán por lengua: inglés, francés, español, urdu, persa, turco y suajili"
summary:
  ar: "قائمة بأبرز ترجمات القرآن في سبع لغات مع مترجميها وتواريخها كما وردت في ملخص بحثي: الإنجليزية من سيل 1734م إلى عبد الحليم 2004م، والفرنسية من دو ريير 1647م إلى بيرك 1990م، والإسبانية من غارسيا برافو 1907م إلى ميلارا نابيو، والأردية من شاه عبد القادر الدهلوي 1790م، والفارسية من تفسير الطبري وكشف الأسرار إلى شاه ولي الله 1738م، والتركية من يازر 1935م إلى هيئة الشؤون الدينية، والسواحلية من ديل 1923م إلى البرواني 1995م."
  en: "A list of the best-known Qur'an translations in seven languages with their translators and dates as a research summary gives them: English from Sale in 1734 to Abdel Haleem in 2004, French from Du Ryer in 1647 to Berque in 1990, Spanish from Garcia Bravo in 1907 to Melara Navio, Urdu from Shah Abdul Qadir Dehlvi in 1790, Persian from Tafsir-e Tabari and Kashf al-Asrar to Shah Waliullah in 1738, Turkish from Yazir in 1935 to the Diyanet, and Swahili from Dale in 1923 to al-Barwani in 1995."
  ur: "سات زبانوں میں قرآن کے معروف ترین تراجم کی فہرست، مترجمین اور تاریخوں کے ساتھ، جیسا کہ ایک تحقیقی خلاصہ انہیں دیتا ہے: انگریزی میں سیل 1734ء سے عبد الحلیم 2004ء تک، فرانسیسی میں دو ریر 1647ء سے بیرک 1990ء تک، ہسپانوی میں غارسیا براوو 1907ء سے میلارا نابیو تک، اردو میں شاہ عبد القادر دہلوی 1790ء سے، فارسی میں تفسیر طبری اور کشف الاسرار سے شاہ ولی اللہ 1738ء تک، ترکی میں یازر 1935ء سے دیانت تک، اور سواحلی میں ڈیل 1923ء سے البروانی 1995ء تک۔"
  fr: "Liste des traductions du Coran les mieux connues en sept langues, avec leurs traducteurs et leurs dates tels qu'un résumé de recherche les donne : anglais de Sale en 1734 à Abdel Haleem en 2004, français de Du Ryer en 1647 à Berque en 1990, espagnol de García Bravo en 1907 à Melara Navío, ourdou de Shah Abdul Qadir Dehlvi en 1790, persan du Tafsir-e Tabari et du Kashf al-Asrar à Shah Waliullah en 1738, turc de Yazır en 1935 à la Diyanet, et swahili de Dale en 1923 à al-Barwani en 1995."
  es: "Lista de las traducciones del Corán más conocidas en siete lenguas, con sus traductores y fechas tal como las da un resumen de investigación: inglés de Sale en 1734 a Abdel Haleem en 2004, francés de Du Ryer en 1647 a Berque en 1990, español de García Bravo en 1907 a Melara Navío, urdu de Shah Abdul Qadir Dehlvi en 1790, persa del Tafsir-e Tabari y el Kashf al-Asrar a Shah Waliullah en 1738, turco de Yazır en 1935 a la Diyanet, y suajili de Dale en 1923 a al-Barwani en 1995."
