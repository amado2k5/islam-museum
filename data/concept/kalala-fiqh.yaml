id: concept/kalala-fiqh
class: concept
kind: legal
label:
  ar: "الكَلالَة"
  en: "Kalala (collateral heirs, fiqh)"
  ur: "کلالہ (فقہی)"
summary:
  ar: "الكلالة في اللغة من الكلال، وهو التعب وذهاب القوة، ويقال إنها من الإكليل بمعنى الإحاطة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13480}. وفي الاصطلاح اختلف أهل العلم: فقيل هي اسم للورثة ما عدا الوالدين والمولودين، وقالت طائفة هي اسم للميت الذي لا والد له ولا ولد، إذ يحيط به النسب من جانبيه، كما روي أن النبي سئل عن الكلالة فقال: «من مات وليس له ولد ولا والد» {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13480}. وقال الراغب إن الكلالة اسم للميت، وذكر أن القولين صحيحان {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13481}."
  en: "Kalala, from kalal (fatigue, or from the crown that encircles), has two senses in law. Some say it names the heirs other than parents and children, while others say it names the dead man who has neither father nor son, since kin surround him on both sides; a report has the Prophet asked about it and say: one who dies without a child or a parent {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13480}. Al-Raghib called it a name for the dead man and held both senses correct {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13481}."
  ur: "کلالہ لغت میں کلال سے ہے، یعنی تھکن اور قوت کا جانا، اور کہا گیا ہے کہ یہ اکلیل سے ہے جس کے معنی گھیرنے کے ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13480}۔ اصطلاح میں اہلِ علم کا اختلاف ہے: بعض کے نزدیک یہ ان وارثوں کا نام ہے جو میت کے والدین اور اولاد کے علاوہ ہوں، اور ایک گروہ کے نزدیک یہ اس میت کا نام ہے جس کا نہ باپ ہو نہ بیٹا، کیونکہ نسب اسے دونوں طرف سے گھیرے ہوئے ہوتا ہے؛ ایک روایت میں ہے کہ نبی سے کلالہ کے بارے میں پوچھا گیا تو فرمایا: جو اس حال میں مرے کہ نہ اس کی اولاد ہو نہ والد {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13480}۔ راغب نے اسے میت کا نام قرار دیا اور دونوں معانی کو درست کہا {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13481}۔"
