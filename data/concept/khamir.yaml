summary:
  ar: "خمير في الكتاب فيه حرارة، وأما يبوسته ورطوبته فبقدر كثرة ملحه وبورقه وقلتهما؛ فيه قوة جلاءة للملح والبورقية والحنطية وقوة مبردة للحموضة، يجذب المواد العميقة إلى ظاهر البدن ويحلل، ويضمد به الوجع الذي يكون في أسفل القدم {cite:canon-ibn-sina-print-v1 p.713}"
  en: "Khamir is in the book of some heat, while its dryness and moisture are according to the amount of its salt and borax; it has a power of cleansing salt, borax and wheat matters and a power of cooling sourness, draws deep matters to the surface of the body and dissolves, and the pain in the sole of the foot is poulticed with it {cite:canon-ibn-sina-print-v1 p.713}"
  ur: "خمیر کتاب میں کچھ گرمی رکھتا ہے، اور اس کی خشکی اور تری اس کے نمک اور بورق کی کمی بیشی کے مطابق ہے؛ اس میں نمک، بورقیہ اور گندمی مادوں کو صاف کرنے کی قوت ہے اور کھٹاس کو ٹھنڈا کرنے کی قوت، گہرے مادوں کو بدن کی سطح کی طرف کھینچتا ہے اور تحلیل کرتا ہے، اور اس سے پاؤں کے تلوے کے درد پر ضماد کیا جاتا ہے {cite:canon-ibn-sina-print-v1 p.713}۔"
  es: "Khamir se encuentra en el libro de cierto calor, mientras que su sequedad y humedad dependen de la cantidad de sal y bórax que contiene; tiene el poder de limpiar la sal, el bórax y las materias de trigo, y el poder de enfriar la acidez, extrae las sustancias profundas a la superficie del cuerpo y las disuelve, y se utiliza para aplicar cataplasmas en el dolor de la planta del pie {cite:canon-ibn-sina-print-v1 p.713}"
  fr: "Le khamir est décrit dans le livre comme ayant une certaine chaleur, tandis que sa sécheresse et son humidité dépendent de sa teneur en sel et en borax; il possède des propriétés purificatrices (sel, borax et blé) et apaisantes (amertume), il attire et dissout les substances profondes du corps, et on l'utilise en cataplasme pour soulager les douleurs plantaires. {cite:canon-ibn-sina-print-v1 p.713}"
  tr: "Kitapta Khmerce ısı içerir ve kuruluğu ile nemi tuz miktarı, yaprağı ve azlığı ile orantılıdır; tuz, burka ve buğdayı arındırma gücüne sahiptir ve asiditeyi soğutur. Derin maddeleri vücudun yüzeyine çeker, çözer ve ayak altındaki ağrıyı iyileştirir {cite:canon-ibn-sina-print-v1 s.713}"
  id: "Khmer dalam buku mengandung panas, dan kekeringan serta kelembapannya sebanding dengan jumlah garam serta daun dan sedikit yang ada; ia memiliki kekuatan untuk menjernihkan garam, burqa, dan gandum, serta mendinginkan keasaman. Ia menarik zat dalam ke permukaan tubuh, melarutkannya, dan menyembuhkan rasa sakit di bagian bawah kaki {cite:canon-ibn-sina-print-v1 hlm.713}"
