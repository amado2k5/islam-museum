  ar: "مدرسة التصوير في سلطنة قطب شاهي بگولكنده وحيدرآباد ⁦(1512–1687م)⁩، استقبلت مصورين من أنحاء العالم الإسلامي وأبقت أساليبهم الصفوية والتركية والمغولية، مع ميل إلى الألوان النارية والحيوية الكثيفة {cite:zebrowski-deccani-painting-1983 p. 13} {cite:zebrowski-deccani-painting-1983 p. 152}."
  en: "The painting of the Qutb Shahi sultanate of Golconda and Hyderabad (1512–1687), which welcomed artists from across the Islamic world and kept their Safavid, Turkish and Mughal idioms, with a taste for fiery colour and dense vitality {cite:zebrowski-deccani-painting-1983 p. 13} {cite:zebrowski-deccani-painting-1983 p. 152}."
  ur: "گولکنڈہ اور حیدرآباد کی قطب شاہی سلطنت ⁦(1512–1687ء)⁩ کی مصوری، جس نے اسلامی دنیا بھر کے مصوروں کو خوش آمدید کہا اور ان کے صفوی، ترکی اور مغل انداز باقی رکھے، آتشیں رنگوں اور گھنی توانائی کے میلان کے ساتھ {cite:zebrowski-deccani-painting-1983 p. 13} {cite:zebrowski-deccani-painting-1983 p. 152}۔"
