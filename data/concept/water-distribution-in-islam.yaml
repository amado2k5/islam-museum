id: concept/water-distribution-in-islam
class: concept
kind: legal
label:
  ar: "توزيع المياه"
  en: "Distribution of water in Islam"
  es: "Distribución del agua en el Islam"
  fr: "La distribution de l'eau en Islam"
  ur: "اسلام میں پانی کی تقسیم"
  tr: "Su dağıtımı"
  id: "Distribusi air"
summary:
  ar: "يقسم المؤلف المياه عند الفقهاء إلى ماء مُحرَز في إناء أو بركة، وماء بئر أو عين، وماء بحار وأنهار وأودية وسيول {cite:usul-iqtisad-islami-0660 p. 219}. الماء المُحرز يُملك بالحيازة، وماء البئر أو العين لا يملكه جمهور الفقهاء، لكن صاحب البئر أحق به، وعليه أن يبذل فاضله دون عوض لمن يطلبه {cite:usul-iqtisad-islami-0660 p. 219}. والماء الظاهر مباح يشترك فيه الناس {cite:usul-iqtisad-islami-0660 p. 220}، والحديث «المسلمون شركاء في ثلاث: الماء والكلأ والنار» أصل ذلك {cite:usul-iqtisad-islami-0660 p. 220}."
  tr: "Yazar, İslam hukukçularına göre suyu üç kategoriye ayırır: bir kapta veya havuzda depolanan su, kuyu veya pınardan gelen su ve denizlerden, nehirlerden, vadilerden ve akarsulardan gelen su {cite:usul-iqtisad-islami-0660 s. 219}. Bir kapta veya havuzda depolanan su, zilyetlik yoluyla sahiplenilirken, hukukçuların çoğunluğu kuyu veya pınardan gelen suya sahip değildir; ancak kuyunun sahibi, bu su üzerinde daha büyük bir hakka sahiptir ve fazlasını talep eden herkese karşılıksız olarak vermek zorundadır {cite:usul-iqtisad-islami-0660 s. 219}. Görünür su, insanların paylaşması için caizdir {cite:usul-iqtisad-islami-0660 s. 220} ve bunun temeli, \"Müslümanlar üç şeyde ortaktır: su, otlak ve ateş\" hadisidir {cite:usul-iqtisad-islami-0660 s. 220}."
  id: "Penulis membagi air menurut ahli hukum Islam menjadi tiga kategori: air yang disimpan dalam wadah atau kolam, air dari sumur atau mata air, dan air dari laut, sungai, lembah, dan aliran air {cite:usul-iqtisad-islami-0660 p. 219}. Air yang disimpan dalam wadah atau kolam dimiliki berdasarkan kepemilikan, sedangkan mayoritas ahli hukum tidak memiliki air dari sumur atau mata air, tetapi pemilik sumur memiliki hak yang lebih besar atasnya dan harus memberikan kelebihan air tanpa kompensasi kepada siapa pun yang memintanya {cite:usul-iqtisad-islami-0660 p. 219}. Air yang terlihat diperbolehkan untuk dibagi-bagi oleh orang banyak {cite:usul-iqtisad-islami-0660 p. 220}, dan hadits, \"Umat Islam bersekutu dalam tiga hal: air, padang rumput, dan api,\" adalah dasar dari hal ini {cite:usul-iqtisad-islami-0660 p. 220}."
