label:
  ar: "توزيع المياه"
  en: "Distribution of water in Islam"
summary:
  ar: "يقسم المؤلف المياه عند الفقهاء إلى ماء مُحرَز في إناء أو بركة، وماء بئر أو عين، وماء بحار وأنهار وأودية وسيول {cite:usul-iqtisad-islami-0660 p. 219}. الماء المُحرز يُملك بالحيازة، وماء البئر أو العين لا يملكه جمهور الفقهاء، لكن صاحب البئر أحق به، وعليه أن يبذل فاضله دون عوض لمن يطلبه {cite:usul-iqtisad-islami-0660 p. 219}. والماء الظاهر مباح يشترك فيه الناس {cite:usul-iqtisad-islami-0660 p. 220}، والحديث «المسلمون شركاء في ثلاث: الماء والكلأ والنار» أصل ذلك {cite:usul-iqtisad-islami-0660 p. 220}."
