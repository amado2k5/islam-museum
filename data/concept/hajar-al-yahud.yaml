id: concept/hajar-al-yahud
class: concept
kind: natural
label:
  ar: "حجر اليهود"
  en: "Hajar al-yahud (the Jews' stone)"
  ur: "حجر اليہود"
  es: "Hajar al-yahud (la piedra de los judíos)"
  fr: "Hajar al-yahud (la pierre des Juifs)"
summary:
  ar: "حجر اليهود كالجوز الصغير إلى طول يسير، عليه خطوط متقاطعة تبقى منها تفاليس صغار لامعة. يُضعف المعدة ويسقط الشهوة، وينفع من حصاة الكلية ويخرجها بالماء الحار. وادّعى قوم أنه ينفع من حصاة المثانة وليس كذلك. وحسب حاشية المحقّق هو الزيتون الإسرائيلي."
  en: "Hajar al-yahud is a small nut-shaped stone with crossing lines that leave small shining flakes. It weakens the stomach and reduces appetite. It helps kidney stone and expels it with hot water. Some claimed it helps bladder stone, which the book says is not so. The editor's note identifies it as the Israeli olive."
  ur: "حجر اليہود ایک چھوٹے اخروٹ جیسا پتھر ہے جس پر کاٹتی ہوئی لکیریں ہیں، جن سے چمکدار چھوٹے ٹکڑے بن جاتے ہیں۔ یہ معدے کو کمزور کرتا ہے اور بھوک گھٹاتا ہے۔ گردے کی پتھری میں مفید ہے اور گرم پانی کے ساتھ اسے نکالتا ہے۔ بعض لوگوں نے اسے مثانے کی پتھری میں بھی مفید بتایا، جو کتاب کے مطابق درست نہیں۔ مدوّن کے حاشیے کے مطابق یہ اسرائیلی زیتون ہے۔"
  es: "Hajar al-yahud es una pequeña piedra con forma de nuez, con líneas entrecruzadas que dejan pequeñas escamas brillantes. Debilita el estómago y reduce el apetito. Ayuda a expulsar los cálculos renales con agua caliente. Algunos afirman que ayuda con los cálculos vesicales, lo cual, según el libro, no es cierto. La nota del editor la identifica como la aceituna israelí."
  fr: "Hajar al-yahud est une petite pierre en forme de noix, parcourue de lignes entrecroisées qui laissent de fines particules brillantes. Elle est réputée pour affaiblir l'estomac et réduire l'appétit. Elle serait bénéfique pour les calculs rénaux et favoriserait leur expulsion avec de l'eau chaude. Certains lui attribuent également des vertus contre les calculs vésicaux, ce que l'ouvrage réfute. La note de l'éditeur la désigne comme l'olive israélienne."
