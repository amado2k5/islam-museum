label:
  ar: "العُمْرَة"
  en: "The lesser pilgrimage (umra): its forms, pillars, obligations and invalidation"
  ur: "عمرہ"
summary:
  ar: "العمرة في اللغة الزيارة، وفي الاصطلاح عند جمهور الفقهاء الطواف بالبيت والسعي بين الصفا والمروة بإحرام {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11821}. وهي سنة مؤكدة عند المالكية والحنفية، وواجبة مرة في العمر عند بعضهم، وفرض عند الشافعية والحنابلة في الأظهر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11821}. وتؤدى على وجوه: الإفراد والتمتع والقران، والقارن يجزئه طواف واحد وسعي واحد عند الجمهور {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11821} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11822} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11823}. وأركانها عند الجمهور ثلاثة: الإحرام والطواف والسعي، وزاد الشافعية الحلق، وعند الحنفية ركنها الطواف وحده {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11826} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11828} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11829} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11830}. ويجب فيها السعي والحلق أو التقصير عند جمهور الفقهاء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11830}. وتندب العمرة في رمضان، ويستحب الإكثار منها، وكره بعضهم تكرارها في أشهر الحج، ويختلف المكان الأفضل للإحرام بها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11824} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11831} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11832} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11833}. وتفسد بترك ركن أو فعل مفسد قبل التحلل، وفي فداء ذلك خلاف، ويجوز أداؤها عن الغير عند الجمهور {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11834} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11835}."
  en: "In the lexicon, 'umra is a visit; as a term most jurists define it as circling the House and running between Safa and Marwa in the state of ihram {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11821}. The Malikis and Hanafis hold it a confirmed sunna, some Hanafis hold it obligatory once in a lifetime, and the sounder view of the Shafi'is and Hanbalis is that it is an obligation once in a lifetime {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11821}. It may be performed alone, combined with the pilgrimage (tamattu') or in one ihram with it (qiran); the majority hold that the one who combines needs only one circuit and one running {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11821} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11822} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11823}. The majority hold its pillars to be three: ihram, circumambulation and running, and the Shafi'is add shaving; the Hanafis hold circumambulation alone to be its pillar {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11826} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11828} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11829} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11830}. Running and shaving or clipping the hair are obligatory according to the majority {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11830}. Performing it in Ramadan is recommended, repeating it is encouraged, some disliked repeating it in the months of pilgrimage, and the best place to enter ihram for it is disputed {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11824} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11831} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11832} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11833}. It is invalidated by omitting a pillar or by a voiding act before release; the compensation for that is disputed, and performing it on behalf of another person is permitted by the majority {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11834} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11835}."
