class: concept
kind: legal
label:
  ar: "العُمْرَة"
  en: "The lesser pilgrimage (umra): its forms, pillars, obligations and invalidation"
  ur: "عمرہ"
  es: "La peregrinación menor (umra): sus formas, pilares, obligaciones e invalidez."
  fr: "Le petit pèlerinage (umra): ses formes, ses piliers, ses obligations et son invalidation"
  tr: "Umre"
  id: "Umrah"
summary:
  ar: "العمرة في اللغة الزيارة، وفي الاصطلاح عند جمهور الفقهاء الطواف بالبيت والسعي بين الصفا والمروة بإحرام {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11821}. وهي سنة مؤكدة عند المالكية والحنفية، وواجبة مرة في العمر عند بعضهم، وفرض عند الشافعية والحنابلة في الأظهر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11821}. وتؤدى على وجوه: الإفراد والتمتع والقران، والقارن يجزئه طواف واحد وسعي واحد عند الجمهور {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11821} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11822} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11823}. وأركانها عند الجمهور ثلاثة: الإحرام والطواف والسعي، وزاد الشافعية الحلق، وعند الحنفية ركنها الطواف وحده {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11826} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11828} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11829} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11830}. ويجب فيها السعي والحلق أو التقصير عند جمهور الفقهاء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11830}. وتندب العمرة في رمضان، ويستحب الإكثار منها، وكره بعضهم تكرارها في أشهر الحج، ويختلف المكان الأفضل للإحرام بها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11824} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11831} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11832} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11833}. وتفسد بترك ركن أو فعل مفسد قبل التحلل، وفي فداء ذلك خلاف، ويجوز أداؤها عن الغير عند الجمهور {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11834} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11835}."
  en: "In the lexicon, 'umra is a visit; as a term most jurists define it as circling the House and running between Safa and Marwa in the state of ihram {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11821}. The Malikis and Hanafis hold it a confirmed sunna, some Hanafis hold it obligatory once in a lifetime, and the sounder view of the Shafi'is and Hanbalis is that it is an obligation once in a lifetime {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11821}. It may be performed alone, combined with the pilgrimage (tamattu') or in one ihram with it (qiran); the majority hold that the one who combines needs only one circuit and one running {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11821} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11822} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11823}. The majority hold its pillars to be three: ihram, circumambulation and running, and the Shafi'is add shaving; the Hanafis hold circumambulation alone to be its pillar {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11826} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11828} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11829} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11830}. Running and shaving or clipping the hair are obligatory according to the majority {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11830}. Performing it in Ramadan is recommended, repeating it is encouraged, some disliked repeating it in the months of pilgrimage, and the best place to enter ihram for it is disputed {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11824} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11831} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11832} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11833}. It is invalidated by omitting a pillar or by a voiding act before release; the compensation for that is disputed, and performing it on behalf of another person is permitted by the majority {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11834} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11835}."
  es: "En el léxico, 'umra es una visita; como término, la mayoría de los juristas la definen como dar vueltas alrededor de la Casa y correr entre Safa y Marwa en estado de ihram {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11821}. Los malikíes y los hanafíes la consideran una sunna confirmada, algunos hanafíes la consideran obligatoria una vez en la vida, y la opinión más sólida de los shafi'íes y los hanbalíes es que es una obligación una vez en la vida {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11821}. Puede realizarse sola, combinada con la peregrinación (tamattu') o en un ihram con ella (qiran); La mayoría sostiene que quien combina necesita solo un circuito y una carrera {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11821} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11822} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11823}. La mayoría sostiene que sus pilares son tres: ihram, circunvalación y carrera, y los shafi'ís añaden el afeitado; los hanafis consideran que la circunvalación es únicamente su pilar {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11826} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11828} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11829} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11830}. Correr y afeitarse o cortarse el pelo son obligatorios según la mayoría {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11830}. Realizarlo en Ramadán es recomendable, repetirlo es alentador, algunos desaconsejaban repetirlo en los meses de peregrinación, y el mejor lugar para entrar en ihram para ello es disputado {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11824} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11831} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11832} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11833}. Se invalida al omitir un pilar o por un acto de anulación antes de la liberación; La compensación por ello es objeto de disputa, y realizarlo en nombre de otra persona está permitido por la mayoría {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11834} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11835}."
  fr: "Dans le lexique, la 'umra est une visite; la plupart des juristes la définissent comme le fait de faire le tour de la Maison et de courir entre Safa et Marwa en état d'ihram (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.11821). Les Malikites et les Hanafites la considèrent comme une sunna confirmée; certains Hanafites la jugent obligatoire une fois dans la vie, tandis que l'avis plus solide des Shafi'ites et des Hanbalites est qu'il s'agit d'une obligation à accomplir une fois dans la vie (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.11821). Elle peut être accomplie seule, combinée au pèlerinage (tamattu') ou en un seul ihram (qiran). La majorité considère que celui qui combine les deux n'a besoin que d'un seul circuit et d'une seule course {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11821} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11822} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11823}. La majorité considère que ses piliers sont au nombre de trois: l'ihram, la circumambulation et la course, et les Shafi'ites ajoutent le rasage; les Hanafis considèrent que la circumambulation seule est son pilier {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11826} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11828} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11829} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11830}. Courir et se raser ou se couper les cheveux sont obligatoires selon la majorité {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11830}. Il est recommandé de l'accomplir pendant le Ramadan, et sa répétition est encouragée. Certains déconseillent de le répéter pendant les mois du pèlerinage, et le meilleur endroit pour entrer en état d'ihram est sujet à controverse {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11824} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11831} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11832} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11833}. L'ihram est invalidé par l'omission d'un pilier ou par un acte d'annulation avant la levée de l'ihram. La rémunération de cette prestation est contestée, et son exécution au nom d'une autre personne est autorisée par la majorité {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11834} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11835}."
  ur: "لغت میں عمرہ ایک دورہ ہے۔ اصطلاح کے طور پر اکثر فقہاء اس کی تعریف بیت اللہ کا طواف کرنا اور صفا و مروہ کے درمیان حالت احرام میں دوڑنا کہتے ہیں۔ مالکیہ اور حنفیہ اسے مستند سنت سمجھتے ہیں، بعض احناف اسے زندگی میں ایک بار فرض سمجھتے ہیں، اور شافعیوں اور حنبلیوں کا صحیح قول یہ ہے کہ یہ زندگی میں ایک بار فرض ہے۔ یہ اکیلے، حج ⁦(تمتع)⁩ کے ساتھ یا اس کے ساتھ ایک احرام میں ⁦(قران)⁩ کیا جا سکتا ہے؛ اکثریت کا خیال ہے کہ جو جمع کرتا ہے اسے صرف ایک سرکٹ اور ایک چلانے کی ضرورت ہے {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11821} اکثریت اس کے تین ستونوں کو مانتی ہے: احرام، طواف اور دوڑنا، اور شافعی مونڈنے کا اضافہ کرتے ہیں۔ احناف صرف طواف کو اس کا ستون سمجھتے ہیں {حوالہ: فقہ معاسوۃ کویتیہ نور-v3 صفحہ 11826} {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 11830}۔ جمہور کے نزدیک دوڑنا اور منڈوانا یا تراشنا واجب ہے۔ اسے رمضان میں بجا لانا مستحب ہے، اسے دہرانے کی ترغیب دی گئی ہے، بعض نے حج کے مہینوں میں اسے دہرانا ناپسند کیا ہے، اور اس کے لیے احرام باندھنے کی بہترین جگہ متنازعہ ہے {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص11832} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص11833}۔ یہ ایک ستون کو چھوڑ کر یا رہائی سے پہلے باطل کرنے کے عمل سے باطل ہو جاتا ہے۔ اس کا معاوضہ متنازعہ ہے، اور کسی دوسرے شخص کی طرف سے اسے انجام دینے کی جمہور نے اجازت دی ہے {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 11835}۔"
  tr: "Umre, dilde ziyaret anlamına gelir ve çoğu hukukçu arasında terimlerde, İhram'da {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11821}'de Safa ile Merve arasında Ev ve Sa'i'nin etrafında dolaşmayı ifade eder. Maliki ve Hanefi'lere göre onaylanmış bir sünnettir, bazılarına göre ömür boyu zorunludur ve sonraki görüşte Şafiiler ve Hanbelilere göre zorunludur {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11821}. Ifrad, Tamattu' ve Kur'an biçimlerinde yapılır. Karşılaştıran kişi, cemaate göre bir Tevaf ve bir Seyi için yeterlidir {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.11821} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11822} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11823}. Çoğunluğa göre sütunları üç: İhram, Tevaf ve Sa'i. Şafi'ler tıraş kısmını eklemiştir ve Hanefilere göre sütunu sadece Tevaftır {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11826} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11828} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11829} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11830}. Sa'i, tıraş etmek veya satırın kısaltılması, çoğu hukukçuya göre gereklidir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11830}. Ramazan'da umre kılmak önerilir ve bunun artırılması da tavsiye edilir. Bazıları Hac aylarında tekrar etmekten hoşlanmaz ve ihrama girmek için en iyi yer farklıdır {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11824} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11831} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11832} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11833}. Bir sütunun bırakılması veya bozulma eylemi nedeniyle geçersiz hale gelir ve sona erer. Bunun tazminatı konusunda anlaşmazlıklar vardır ve çoğunluğa göre başkaları adına yapılması izinlidir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11834} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11835}."
  id: "Umrah dalam bahasa adalah kunjungan, dan dalam istilah di kalangan mayoritas ahli hukum, ini merujuk pada keliling Rumah dan Sa'i antara Safa dan Marwah dalam Ihram {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11821}. Ini adalah Sunnah yang dikonfirmasi menurut Malik dan Hanafi, wajib sekali seumur hidup menurut sebagian orang, dan wajib menurut Shafi'i dan Hanbalis dalam pandangan selanjutnya {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11821}. Ia dilakukan dalam bentuk Ifarat, Tamattu', dan Al-Qur'an. Orang yang membandingkan cukup untuk satu Tawaf dan satu Sa'i menurut jamaah {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11821} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11822} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11823}. Menurut mayoritas, pilarnya adalah tiga: Ihram, Tawaf, dan Sa'i. Para Shafi'i menambahkan pencukuran, dan menurut Hanafi, pilarnya hanya Tawaf {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11826} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11828} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11829} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11830}. Sa'i, mencukur, atau memperpendek garis diperlukan menurut mayoritas ahli hukum {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11830}. Melakukan Umrah dianjurkan pada Ramadan, dan disarankan untuk meningkatkannya. Beberapa orang tidak suka mengulanginya selama bulan-bulan Haji, dan tempat terbaik untuk memasuki ihram berbeda {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11824} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11831} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11832} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11833}. Tindakan tersebut menjadi tidak sah jika meninggalkan pilar atau tindakan korup sebelum dibubarkan. Ada perbedaan pendapat mengenai kompensasi untuk itu, dan diperbolehkan dilakukan atas nama orang lain menurut mayoritas {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11834} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11835}."
