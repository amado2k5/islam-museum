id: concept/ihdad
class: concept
kind: legal
label: { ar: "إحداد", en: "Mourning of a widow (ihdad)", es: "Luto de una viuda (ihdad)", fr: "Deuil d'une veuve (ihdad)", ur: "بیوہ کا ماتم ⁦(احداد)⁩" }
summary:
  ar: "الإحداد في اللغة ترك الزينة إظهاراً للحزن، وفي الاصطلاح امتناع المرأة من الزينة وما في معناها مدة مخصوصة في أحوال مخصوصة، وكذلك امتناعها من المبيت في غير منزلها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1753} وهو واجب على المرأة في عدة الوفاة من نكاح صحيح بالإجماع، لقوله: لا يحل لامرأة تؤمن بالله واليوم الآخر أن تُحِدّ على ميت فوق ثلاث إلا على زوج أربعة أشهر وعشراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1753} وتجتنب المحدة ما يعد زينة شرعاً أو عرفاً، ومنه الطيب والكحل والثوب المصبوغ، وقد نصّ الحديث على المعصفر والمزعفر وما فيه طيب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1756} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1757} وللمحدة أن تخرج لحاجتها، وإن كانت في غير منزلها فعليها أن تعود إلى بيت الزوجية، والخروج لحج أو سفر بعيد يُعالج بتفصيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1759} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1761} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1762}"
  en: "Ihdad in the lexicon is giving up adornment to show grief; as a term it is a woman's abstention from adornment and similar things for a set period and in set circumstances, and from sleeping away from her own house. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1753} It is obligatory for a widow in the period of waiting after a valid marriage, by agreement, on the saying that a woman who believes in God and the last day may not mourn a dead man for more than three nights, except for a husband, four months and ten days. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1753} The mourning woman avoids what is adornment by law or custom, including scent, kohl and dyed clothes; the report names safflower and saffron dyes, which carry scent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1756} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1757} She may go out for her needs; if she is away from her marital home she must return to it, and travel for pilgrimage or a long journey is treated in detail. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1759} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1761} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1762}"
  es: "Ihdad en el léxico es renunciar al adorno para mostrar dolor; como término es la abstención de una mujer de adornos y cosas similares durante un período determinado y en circunstancias determinadas, y de dormir fuera de su propia casa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1753} Es obligatorio para una viuda en el período de espera después de un matrimonio válido, por acuerdo, sobre el dicho de que una mujer que cree en Dios y en el último día no puede llorar a un hombre muerto por más de tres noches, excepto un esposo, cuatro meses y diez días. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1753} La mujer en duelo evita lo que es adorno por ley o costumbre, incluyendo perfume, kohl y ropas teñidas; el informe menciona tintes de cártamo y azafrán, que tienen aroma. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1756} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1757} Ella puede salir para satisfacer sus necesidades; si está fuera de su casa conyugal debe regresar a ella, y se trata detalladamente los viajes de peregrinación o de largo viaje. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1759} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1761} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1762}"
  fr: "Dans le lexique, l'ihdad désigne le renoncement aux ornements en signe de deuil; il s'agit de l'abstention, par une femme, de porter des bijoux et autres ornements similaires pendant une période et dans des circonstances déterminées, et de dormir hors de son domicile. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1753} Il est obligatoire pour une veuve, durant la période d'attente suivant un remariage valide, d'un commun accord, selon le principe qu'une femme croyant en Dieu et au Jour du Jugement ne doit pas porter le deuil d'un homme décédé plus de trois nuits, sauf pour son époux, pendant quatre mois et dix jours. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1753} La femme en deuil s'abstient de tout ornement, qu'il soit légal ou coutumier, y compris les parfums, le khôl et les vêtements teints; le hadith mentionne notamment les teintures de carthame et de safran, qui sont parfumées. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1756} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1757} Elle peut sortir pour ses besoins; si elle est éloignée de son domicile conjugal, elle doit y retourner, et les voyages en pèlerinage ou pour un long voyage sont traités en détail. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1759} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1761} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1762}"
  ur: "لغت میں احداد غم ظاہر کرنے کے لیے زینت کو ترک کر رہا ہے۔ ایک اصطلاح کے طور پر یہ عورت کا ایک مقررہ مدت اور مقررہ حالات میں زینت اور اس جیسی چیزوں سے پرہیز اور اپنے گھر سے دور سونے سے پرہیز ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1753} نکاح کے بعد عدت کی مدت میں بیوہ پر واجب ہے، اس قول پر کہ جو عورت خدا اور آخرت پر ایمان رکھتی ہو، وہ شوہر کے سوا چار مہینے دس دن تک کسی مردے پر تین راتوں سے زیادہ سوگ نہیں کر سکتی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1753} ماتم کرنے والی عورت اس چیز سے اجتناب کرتی ہے جو قانون یا رسم کے مطابق زینت ہے، بشمول خوشبو، سرمہ اور رنگے ہوئے کپڑے؛ رپورٹ میں زعفران اور زعفرانی رنگوں کا نام دیا گیا ہے، جن میں خوشبو آتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1756} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1757} وہ اپنی ضروریات کے لیے باہر جا سکتی ہے۔ اگر وہ اپنے ازدواجی گھر سے دور ہے تو اسے واپس اس میں واپس آنا چاہیے، اور حج یا لمبے سفر کا تفصیلی علاج کیا جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1759} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1761}"
