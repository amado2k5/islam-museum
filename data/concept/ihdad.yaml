label: { ar: "إحداد", en: "Mourning of a widow (ihdad)" }
summary:
  ar: "الإحداد في اللغة ترك الزينة إظهاراً للحزن، وفي الاصطلاح امتناع المرأة من الزينة وما في معناها مدة مخصوصة في أحوال مخصوصة، وكذلك امتناعها من المبيت في غير منزلها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1753} وهو واجب على المرأة في عدة الوفاة من نكاح صحيح بالإجماع، لقوله: لا يحل لامرأة تؤمن بالله واليوم الآخر أن تُحِدّ على ميت فوق ثلاث إلا على زوج أربعة أشهر وعشراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1753} وتجتنب المحدة ما يعد زينة شرعاً أو عرفاً، ومنه الطيب والكحل والثوب المصبوغ، وقد نصّ الحديث على المعصفر والمزعفر وما فيه طيب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1756} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1757} وللمحدة أن تخرج لحاجتها، وإن كانت في غير منزلها فعليها أن تعود إلى بيت الزوجية، والخروج لحج أو سفر بعيد يُعالج بتفصيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1759} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1761} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1762}"
  en: "Ihdad in the lexicon is giving up adornment to show grief; as a term it is a woman's abstention from adornment and similar things for a set period and in set circumstances, and from sleeping away from her own house. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1753} It is obligatory for a widow in the period of waiting after a valid marriage, by agreement, on the saying that a woman who believes in God and the last day may not mourn a dead man for more than three nights, except for a husband, four months and ten days. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1753} The mourning woman avoids what is adornment by law or custom, including scent, kohl and dyed clothes; the report names safflower and saffron dyes, which carry scent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1756} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1757} She may go out for her needs; if she is away from her marital home she must return to it, and travel for pilgrimage or a long journey is treated in detail. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1759} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1761} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1762}"
