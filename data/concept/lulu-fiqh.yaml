summary:
  ar: "اللؤلؤ معروف، وهو في اللغة جمع لؤلؤة وهي الدرة، ويجمع على لآلئ؛ ويتكون في الأصداف من رواسب صلبة لماعة مستديرة في بعض الرخويات المائية {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13553}."
  en: "Lu'lu' is the pearl, a hard, bright, round deposit formed in certain marine molluscs; its plural is lali {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13553}."
  ur: "لؤلؤ معروف ہے؛ لغت میں یہ لؤلؤہ کی جمع ہے، جو موتی کو کہتے ہیں، اور جمع لآلئ بھی ہے۔ یہ بعض سمندری گھونگھوں کے خول میں سخت، چمکدار اور گول ذرات کی صورت میں بنتا ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13553}۔"
