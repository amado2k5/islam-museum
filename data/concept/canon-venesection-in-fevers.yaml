label: { ar: "الفصد في الحميات عند ابن سينا", en: "Venesection in fevers in the Canon", ur: "قانون میں بخاروں میں فصد", es: "La flebotomía en casos de fiebre en el Canon" }
summary:
  ar: "يفصل ابن سينا متى يجتنب الفصد في الحميات ومتى يؤذن فيه، فيمنعه في شديدة الالتهاب وفي غير الحادة ابتداء، ويقدم في العفنة النظر في القوانين العشرة والقارورة والنبض والسحنة، ويرى برأي جالينوس جوازه ولو بعد الرابع، ويعد الحمى الدموية محتاجة إلى الفصد {cite:canon-ibn-sina-print-v1 pp.291-292}."
  en: "Ibn Sina sets out when bleeding is avoided in fevers and when it is allowed: he bars it in intensely inflaming fevers and at the start of non-acute ones, puts first in putrid fevers a look at the ten rules, the urine flask, the pulse and the physique, gives Galen's view that it is allowed even after the fourth day, and counts the sanguine fever as needing bleeding {cite:canon-ibn-sina-print-v1 pp.291-292}."
  es: "Ibn Sina establece cuándo se debe evitar la sangría en las fiebres y cuándo está permitida: la prohíbe en las fiebres intensamente inflamatorias y al comienzo de las no agudas, pone primero en las fiebres pútridas una mirada a las diez reglas, el frasco de orina, el pulso y el físico, da la opinión de Galeno de que está permitida incluso después del cuarto día, y considera que la fiebre sanguínea requiere sangría {cite:canon-ibn-sina-print-v1 pp.291-292}."
