id: concept/canon-venesection-in-fevers
class: concept
kind: scientific
label: { ar: "الفصد في الحميات عند ابن سينا", en: "Venesection in fevers in the Canon", ur: "قانون میں بخاروں میں فصد", es: "La flebotomía en casos de fiebre en el Canon", fr: "La saignée dans les fièvres dans le Canon", tr: "İbn Sina'ya göre diyetlerde flebit", id: "Flebitis dalam diet menurut Ibn Sina" }
summary:
  ar: "يفصل ابن سينا متى يجتنب الفصد في الحميات ومتى يؤذن فيه، فيمنعه في شديدة الالتهاب وفي غير الحادة ابتداء، ويقدم في العفنة النظر في القوانين العشرة والقارورة والنبض والسحنة، ويرى برأي جالينوس جوازه ولو بعد الرابع، ويعد الحمى الدموية محتاجة إلى الفصد {cite:canon-ibn-sina-print-v1 pp.291-292}."
  en: "Ibn Sina sets out when bleeding is avoided in fevers and when it is allowed: he bars it in intensely inflaming fevers and at the start of non-acute ones, puts first in putrid fevers a look at the ten rules, the urine flask, the pulse and the physique, gives Galen's view that it is allowed even after the fourth day, and counts the sanguine fever as needing bleeding {cite:canon-ibn-sina-print-v1 pp.291-292}."
  es: "Ibn Sina establece cuándo se debe evitar la sangría en las fiebres y cuándo está permitida: la prohíbe en las fiebres intensamente inflamatorias y al comienzo de las no agudas, pone primero en las fiebres pútridas una mirada a las diez reglas, el frasco de orina, el pulso y el físico, da la opinión de Galeno de que está permitida incluso después del cuarto día, y considera que la fiebre sanguínea requiere sangría {cite:canon-ibn-sina-print-v1 pp.291-292}."
  fr: "Ibn Sina expose quand les saignements sont à éviter en cas de fièvre et quand ils sont autorisés: il les interdit dans les fièvres intensément inflammatoires et au début des fièvres non aiguës, commence par examiner les dix règles, le flacon d'urine, le pouls et le physique dans les fièvres putrides, donne l'avis de Galien selon lequel ils sont autorisés même après le quatrième jour, et considère la fièvre sanguine comme nécessitant des saignements {cite:canon-ibn-sina-print-v1 pp.291-292}."
  ur: "ابن سینا بتاتا ہے کہ بخار میں خون آنے سے کب بچنا ہے اور کب اس کی اجازت ہے: وہ شدید بخار میں اسے روکتا ہے اور غیر شدید بخاروں کے شروع میں، سوکھے بخار میں پہلے دس اصولوں، پیشاب کے فلاسک، نبض اور جسم پر نظر ڈالتا ہے، گیلن کا خیال ہے کہ چار دن کے بعد بھی اس کی گنتی جائز ہے اور چار دن بھی جائز ہے۔ خون بہنا {حوالہ:کینن-ابن سینا-پرنٹ-v1 صفحہ 291-292}۔"
  tr: "İbn Sina, ateş sırasında flebitin ne zaman önlenmesi gerektiğini ve ne zaman izin verildiğini detaylandırır; şiddetli iltihaplanmada ve daha hafif vakalarda başlangıçta önlenir. Çürüme vakalarında, on yasanın dikkate alınmasını önceliklendirir: şişe, nabız ve sahne. Galen'e göre, dördüncüsünden sonra bile izin verilebilir olduğunu düşünür ve hematoponileri zorunlu kabul eder {cite:canon-ibn-sina-print-v1 s.291-292}."
  id: "Ibn Sina merinci kapan flebitis harus dihindari saat demam dan kapan diizinkan, sehingga mencegah peradangan parah dan pada kasus yang kurang parah pada awalnya. Dalam kasus pembusukan, ia memprioritaskan pertimbangan sepuluh hukum, yaitu vial, denyut nadi, dan sahna. Menurut Galen, ia menganggapnya diperbolehkan bahkan setelah yang keempat, dan menganggap hematoponi sebagai suatu kebutuhan {cite:canon-ibn-sina-print-v1 hlm.291-292}."
