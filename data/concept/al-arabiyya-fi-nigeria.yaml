id: concept/al-arabiyya-fi-nigeria
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-world]
label:
  ar: "العربية في نيجيريا"
  en: "Arabic in Nigeria"
  ur: "نائجیریا میں عربی"
  fr: "l'arabe au Nigéria"
  es: "el árabe en Nigeria"
  tr: "Nijerya'da Arapça"
  id: "Bahasa Arab di Nigeria"
summary:
  ar: "تعرض هذه الصفحة ما يقوله ملخص بحثي زُوّد به المتحف عن العربية في نيجيريا: مكانتها القانونية، والأصناف المحكية منها، والأرقام الرسمية كما وردت. ولا تملك العربية الفصحى ولا عربية الشوا في نيجيريا وضعاً دستورياً رسمياً أو وطنياً بحسب الملخص. ولم يفتح المتحف الصفحات التي يسمّيها الملخص، وقد أجاز المؤسس استعماله كما ورد في 21 نوفمبر 2026. وحيث يقول الملخص إنه لم يجد مصدراً رسمياً أو رقماً فهذا ما تقوله الصفحة بلفظه، ولا يضع المتحف رقماً من عنده."
  en: "This page sets out what a research summary supplied to the museum says about Arabic in Nigeria: its legal status, the varieties spoken and the official figures, each as the summary gives it. According to the summary, neither Standard Arabic nor Shuwa Arabic has constitutional official or national status in Nigeria. The museum did not open the pages the summary names, and the founder approved using it as supplied on 21 November 2026. Where the summary says that no official source or figure was found, this page says exactly that and supplies no number of its own."
  ur: "یہ صفحہ وہ پیش کرتا ہے جو متحف کو فراہم کردہ ایک تحقیقی خلاصہ نائجیریا میں عربی کے بارے میں کہتا ہے: اس کی قانونی حیثیت، بولی جانے والی اقسام اور سرکاری اعداد و شمار، ہر ایک جیسا خلاصہ دیتا ہے۔ خلاصے کے مطابق نائجیریا میں نہ معیاری عربی اور نہ شووا عربی کو آئینی سرکاری یا قومی حیثیت حاصل ہے۔ متحف نے خلاصے کے بیان کردہ صفحات نہیں کھولے، اور بانی نے 21 نومبر 2026 کو خلاصے کو جیسا ملا اسی طرح استعمال کرنے کی منظوری دی۔ جہاں خلاصہ کہتا ہے کہ کوئی سرکاری ماخذ یا عدد نہیں ملا وہاں یہ صفحہ بالکل یہی کہتا ہے اور اپنی طرف سے کوئی عدد نہیں دیتا۔"
  fr: "Cette page expose ce que dit un résumé de recherche remis au musée sur l'arabe au Nigéria : son statut juridique, les variétés parlées et les chiffres officiels, chacun tel que le résumé le donne. Selon le résumé, ni l'arabe standard ni l'arabe shuwa n'a de statut constitutionnel officiel ou national au Nigéria. Le musée n'a pas ouvert les pages que nomme le résumé, et le fondateur a approuvé l'usage du résumé tel que fourni le 21 novembre 2026. Là où le résumé dit qu'aucune source officielle ni aucun chiffre n'a été trouvé, cette page dit exactement cela et ne fournit aucun nombre de son cru."
  es: "Esta página expone lo que dice un resumen de investigación entregado al museo sobre el árabe en Nigeria: su estatus jurídico, las variedades habladas y las cifras oficiales, cada una como la da el resumen. Según el resumen, ni el árabe estándar ni el árabe shuwa tienen estatus constitucional oficial o nacional en Nigeria. El museo no abrió las páginas que nombra el resumen, y el fundador aprobó usarlo tal como se entregó el 21 de noviembre de 2026. Donde el resumen dice que no se halló ninguna fuente oficial ni cifra, esta página dice exactamente eso y no aporta ningún número propio."
  tr: "Bu sayfa, müzenin Nijerya'daki Arapça hakkında sunduğu araştırma özetini sunmaktadır: yasal statüsü, konuşulan çeşitleri ve bildirilen resmi sayılar. Özete göre Nijerya'da Modern Standart Arapça veya Shawa Arapçası, resmi veya ulusal anayasal statüye sahip değildir. Müze, özet olarak adlandırdığı sayfaları açmamış ve kurucu 21 Kasım 2026'da belirtildiği gibi kullanımına izin vermiştir. Özette resmi bir kaynak veya numara bulunmadığı belirtildiğinde, sayfa bunu sözlü olarak belirtir ve müze kendi hesabından bir numara içermez."
  id: "Halaman ini menyajikan ringkasan penelitian museum tentang bahasa Arab di Nigeria: status hukumnya, varian yang diucapkan, dan angka resmi yang dilaporkan. Menurut ringkasan tersebut, Arab Standar Modern atau Arab Shawa di Nigeria tidak memiliki status konstitusional resmi atau nasional. Museum belum membuka halaman yang disebut ringkasan, dan pendiri telah mengizinkan penggunaannya seperti yang dinyatakan pada 21 November 2026. Ketika dinyatakan bahwa tidak ada sumber atau nomor resmi dalam ringkasan, halaman tersebut secara lisan menyatakannya, dan museum tidak menyertakan nomor dari akun mereka sendiri."
