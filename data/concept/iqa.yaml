summary:
  ar: "الإقعاء عند العرب إلصاق الأليتين بالأرض ونصب الساقين، وللفقهاء فيه تفسيران. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3226} والأكثر على كراهته في الصلاة، وهو سنة بين السجدتين عند الشافعية، ولا يُكره في الأكل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3227}"
  en: "In Arabic usage iqa' is sitting with the buttocks on the ground and the shins raised; the jurists give two explanations. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3226} Most jurists dislike it in prayer; the Shafi'is hold the form between two prostrations to be a sunna; it is not disliked when eating. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3227}"
  es: "En árabe, iqa' consiste en sentarse con las nalgas en el suelo y las espinillas levantadas; los juristas ofrecen dos explicaciones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3226} La mayoría de los juristas lo desaconsejan durante la oración; los shafi'íes consideran que la postura entre dos postraciones es una sunna; no se desaconseja al comer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3227}"
  fr: "En arabe, l'iqa' désigne la position assise, les fesses à plat sur le sol et les tibias relevés; les juristes en donnent deux explications. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3226} La plupart des juristes la déconseillent pendant la prière; les chaféites la considèrent comme une sunna entre deux prosternations; elle n'est pas déconseillée pendant les repas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3227}"
