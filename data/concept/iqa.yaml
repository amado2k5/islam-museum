summary:
  ar: "الإقعاء عند العرب إلصاق الأليتين بالأرض ونصب الساقين، وللفقهاء فيه تفسيران. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3226} والأكثر على كراهته في الصلاة، وهو سنة بين السجدتين عند الشافعية، ولا يُكره في الأكل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3227}"
  en: "In Arabic usage iqa' is sitting with the buttocks on the ground and the shins raised; the jurists give two explanations. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3226} Most jurists dislike it in prayer; the Shafi'is hold the form between two prostrations to be a sunna; it is not disliked when eating. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3227}"
