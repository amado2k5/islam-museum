id: concept/ijbar
class: concept
kind: legal
label: { ar: "إجبار", en: "Compulsion (ijbar)", es: "Compulsión (ijbar)", fr: "Contrainte (ijbar)", ur: "مجبوری", tr: "Zorlama", id: "Pemaksaan" }
summary:
  ar: "الإجبار في اللغة القهر والإكراه، ولم يضع الفقهاء له تعريفاً خاصاً، والاستعمال الفقهي لا يخرج عن المعنى اللغوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1584} ومن الإجبار المشروع إجبار القاضي المدين المماطل على الوفاء، وإجبار الولي في الزواج على من له عليه ولاية إجبار كالصغيرة، ونزع الملكية جبراً للمنافع العامة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1584} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1585} والإجبار المشروع لا يؤثر في صحة التصرف، وقد يكون تلقائياً دون طلب كالمقاصة الجبرية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1585} ومن صوره أن يجبر المحتكر على البيع إذا لم يستجب لأمر السلطان، وأن يؤخذ من العامل ما زاد على ما كان عنده بجاه الولاية، وأن يمنع ولي الأمر كبار الصحابة من الزواج بالكتابيات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1587}"
  en: "Ijbar in the lexicon means compulsion or coercion. Jurists gave it no separate definition, and their use does not depart from the lexical sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1584} Lawful compulsion includes a judge forcing a stubborn debtor to pay, a guardian's power to marry off one under his care, such as a young girl, and the compulsory taking of property for public benefit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1584} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1585} Lawful compulsion does not void the transaction, and it may be automatic and without request, as in compulsory set-off. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1585} Other cases include forcing a hoarder to sell when he refuses the ruler's order, taking from a state official what he gained by his office, and the ruler's prohibition of marriage to Christian women for senior Companions, as reported. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1587}"
  es: "Ijbar en el léxico significa coacción o coerción. Los juristas no le dieron una definición separada, y su uso no se aparta del sentido léxico. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1584} La coacción legal incluye a un juez que obliga a un deudor obstinado a pagar, el poder de un tutor para casar a alguien bajo su cuidado, como una niña, y la toma obligatoria de propiedad para beneficio público. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1584} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1585} La coacción legal no anula la transacción, y puede ser automática y sin solicitud, como en la compensación obligatoria. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1585} Otros casos incluyen obligar a un acaparador a vender cuando se niega a obedecer la orden del gobernante, quitarle a un funcionario estatal lo que obtuvo gracias a su cargo, y la prohibición del gobernante de contraer matrimonio con mujeres cristianas para los Compañeros de mayor rango, según se informa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1587}"
  fr: "Dans le lexique, le terme « ijbar » signifie contrainte ou coercition. Les juristes ne lui ont pas donné de définition distincte, et leur usage reste fidèle à son sens littéral. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1584} La contrainte légitime comprend notamment le pouvoir d'un juge d'obliger un débiteur récalcitrant à payer, le pouvoir d'un tuteur de marier une personne placée sous sa tutelle, comme une jeune fille, et la réquisition de biens pour cause d'utilité publique. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1584} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1585} La contrainte légitime n'entraîne pas la nullité de la transaction et peut être automatique et sans demande préalable, comme dans le cas de la compensation obligatoire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1585} Parmi les autres cas, on peut citer le fait de contraindre un accapareur à vendre lorsqu'il refuse d'obéir à l'ordre du souverain, de confisquer à un fonctionnaire les avantages liés à sa fonction, et l'interdiction, par le souverain, pour les Compagnons de haut rang d'épouser des femmes chrétiennes, comme rapporté. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1587}"
  ur: "لغت میں اجبار کا مطلب ہے جبر یا جبر۔ فقہا نے اس کی کوئی الگ تعریف نہیں دی اور نہ ہی اس کا استعمال لغوی معنی سے ہٹتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1584} حلال مجبوری میں ایک جج کا ایک ضدی مقروض کو ادائیگی پر مجبور کرنا، سرپرست کا اختیار ہے کہ وہ اپنی زیر کفالت سے شادی کر لے، جیسے کہ کم عمر لڑکی، اور جائیداد کو عوامی فائدے کے لیے لینا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1584} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1585} حلال جبر سودے کو باطل نہیں کرتا، اور یہ خودکار اور بغیر درخواست کے ہو سکتا ہے، جیسا کہ لازمی سیٹ آف میں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1585} دیگر معاملات میں ذخیرہ اندوز کو بیچنے پر مجبور کرنا شامل ہے جب وہ حاکم کے حکم سے انکار کرتا ہے، ایک ریاستی اہلکار سے جو اس نے اپنے دفتر سے حاصل کیا تھا، اور حاکم کی طرف سے بزرگ صحابہ کے لیے عیسائی خواتین سے شادی کی ممانعت شامل ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص1587}"
  tr: "Dil açısından zorlama ve zorlamadır, hukukçular bunu özel olarak tanımlamamıştır ve hukukçular dilsel anlamın ötesine geçmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1584} Meşru zorlamalar arasında, erteleyen borçlu hakimi ödemeye zorlamak, vasiyi kendisi üzerinde velayeti olan biriyle evlendirmek, reşit olmayanlar gibi zorunlu olmak ve kamu yararları için mallara el koymak yer alır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1584} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1585} ve yasal zorlama, yasanın geçerliliğini etkilemez ve zorunlu mahsup gibi talep olmaksızın otomatik olabilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1585} Biçimleri arasında, tekelci hükümdarın emrine uymazsa satmaya zorlamak, işçiden otoritenin statüsü gereği sahip olduğu değeri aşan şeyleri almak ve kıdemli arkadaşların kitaptan kadınlarla evlenmesini engellemek yer alır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1587}"
  id: "Dalam bahasa, paksaan adalah paksaan dan paksaan, dan para ahli hukum tidak mendefinisikannya secara spesifik, dan penggunaan yurisprudensialnya tidak melampaui makna linguistik. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1584} Di antara paksaan yang sah adalah memaksa hakim debitur yang menunda membayar, memaksa wali menikah dengan seseorang yang memiliki hak asuh atasnya, wajib seperti anak di bawah umur, dan mengambil alih properti untuk mengganti manfaat publik. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1584} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1585} dan paksaan yang sah tidak memengaruhi keabsahan tindakan dan dapat otomatis tanpa permintaan, seperti pengurangan paksa (forced set-off). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1585} Salah satu bentuknya adalah memaksa monopoli menjual jika ia tidak mematuhi perintah penguasa, mengambil dari pekerja apa yang melebihi apa yang ia miliki karena status otoritas, dan mencegah para senior companion menikahi wanita dari kitab tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1587}"
