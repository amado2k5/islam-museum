id: concept/ijbar
class: concept
kind: legal
label: { ar: "إجبار", en: "Compulsion (ijbar)" }
summary:
  ar: "الإجبار في اللغة القهر والإكراه، ولم يضع الفقهاء له تعريفاً خاصاً، والاستعمال الفقهي لا يخرج عن المعنى اللغوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1584} ومن الإجبار المشروع إجبار القاضي المدين المماطل على الوفاء، وإجبار الولي في الزواج على من له عليه ولاية إجبار كالصغيرة، ونزع الملكية جبراً للمنافع العامة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1584} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1585} والإجبار المشروع لا يؤثر في صحة التصرف، وقد يكون تلقائياً دون طلب كالمقاصة الجبرية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1585} ومن صوره أن يجبر المحتكر على البيع إذا لم يستجب لأمر السلطان، وأن يؤخذ من العامل ما زاد على ما كان عنده بجاه الولاية، وأن يمنع ولي الأمر كبار الصحابة من الزواج بالكتابيات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1587}"
  en: "Ijbar in the lexicon means compulsion or coercion. Jurists gave it no separate definition, and their use does not depart from the lexical sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1584} Lawful compulsion includes a judge forcing a stubborn debtor to pay, a guardian's power to marry off one under his care, such as a young girl, and the compulsory taking of property for public benefit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1584} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1585} Lawful compulsion does not void the transaction, and it may be automatic and without request, as in compulsory set-off. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1585} Other cases include forcing a hoarder to sell when he refuses the ruler's order, taking from a state official what he gained by his office, and the ruler's prohibition of marriage to Christian women for senior Companions, as reported. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1587}"
