label:
  ar: "الغزو الفكري"
  en: "Intellectual invasion (al-ghazw al-fikri) in the Sheikh's view"
  fr: "L’invasion intellectuelle (al-ghazw al-fikri) selon le cheikh"
  ur: "فکری یلغار ⁦(الغزو الفکری)⁩"
