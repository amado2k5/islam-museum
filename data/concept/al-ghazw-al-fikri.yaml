  id: "Invasi Intelektual"
summary:
  ar: "يرى الشيخ عمر عبد الكافي أن جزءًا من الفهم المشوّش في الأمة يعود إلى الغزو الفكري والثقافي المنظّم، وأن الغرب والاستعمار يستخرجان الثروات ويبتزان العقول في رأيه. {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep05 00:04:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:21:00}"
  en: "Sheikh Omar Abdelkafy holds that part of the nation's confused understanding comes from an organised intellectual and cultural invasion, and that in his view the West and colonialism drain wealth and minds {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep05 00:04:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:21:00}."
  fr: "Selon le cheikh Omar Abdelkafy, une partie de la confusion qui règne dans la communauté tient à une invasion intellectuelle et culturelle organisée. À ses yeux, l’Occident et le colonialisme accaparent les richesses et les esprits {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep05 00:04:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:21:00}."
  ur: "شیخ عمر عبدالکافی کے نزدیک امت کی الجھی ہوئی سمجھ کا ایک حصہ منظم فکری و ثقافتی یلغار سے آتا ہے، اور ان کی رائے میں مغرب اور استعمار دولت اور ذہن نچوڑتے ہیں {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep05 00:04:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:21:00}۔"
  es: "El jeque Omar Abdelkafy sostiene que parte de la comprensión confusa de la nación proviene de una invasión intelectual y cultural organizada, y que, en su opinión, Occidente y el colonialismo agotan la riqueza y las mentes {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep05 00:04:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:21:00}."
  tr: "Şeyh Ömer Abdelkafi, ulus içindeki karmaşık anlayışın bir kısmının örgütlü entelektüel ve kültürel işgalden kaynaklandığını, Batı ve sömürgeciliğin ise zenginlik çıkarıp zihinleri şantaj yaptığını düşünüyor. {kaynak:assabile-omar-abdelkafy al-dinu-al-qayem/ep05 00:04:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:21:00}"
  id: "Sheikh Omar Abdelkafi percaya bahwa sebagian dari pemahaman kompleks di dalam negeri berasal dari pendudukan intelektual dan budaya yang terorganisir, sementara Barat dan kolonialisme menciptakan kekayaan dan pikiran pemerasan. {sumber:assabile-omar-abdelkafy al-dinu-al-qayem/ep05 00:04:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:21:00}"
