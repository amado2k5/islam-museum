summary:
  ar: "يرى الشيخ عمر عبد الكافي أن جزءًا من الفهم المشوّش في الأمة يعود إلى الغزو الفكري والثقافي المنظّم، وأن الغرب والاستعمار يستخرجان الثروات ويبتزان العقول في رأيه. {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep05 00:04:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:21:00}"
  en: "Sheikh Omar Abdelkafy holds that part of the nation's confused understanding comes from an organised intellectual and cultural invasion, and that in his view the West and colonialism drain wealth and minds {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep05 00:04:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:21:00}."
  ur: "شیخ عمر عبدالکافی کے نزدیک امت کی الجھی ہوئی سمجھ کا ایک حصہ منظم فکری و ثقافتی یلغار سے آتا ہے، اور ان کی رائے میں مغرب اور استعمار دولت اور ذہن نچوڑتے ہیں {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep05 00:04:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:21:00}۔"
