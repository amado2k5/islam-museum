id: concept/ilhaq
class: concept
kind: legal
label: { ar: "الإلحاق", en: "Ilhaq (attaching one thing to another: analogy, lineage, and accessories)" }
summary:
  ar: "الإلحاق في اللغة الاتباع، ويستعمله الفقهاء والأصوليون بمعنيين: إلحاق الفرع بالأصل بعلة مشتركة، وهو القياس، وإلحاق مجهول النسب بمن ادعاه بشروطه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3319}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3320} ومن تطبيقاته إلحاق جنين المذكاة بأمه عند الجمهور، وإلحاق صغار السوائم بالكبار في الزكاة، وإلحاق توابع المبيع به، كالجنين في بيع أمه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3320}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3321}"
  en: "Ilhaq is following in the lexical sense. Jurists use it in two senses: attaching a branch to a root by a shared cause, which is analogy, and ascribing a child of unknown lineage to the one who claims him, on conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3319}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3320} Its applications include the fetus of a slaughtered animal joining its dam for the majority, young livestock joining the adult in zakat, and the accessories of a sold thing, such as a fetus in the sale of its dam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3320}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3321}"
