label: { ar: "المُقَاسَمة", en: "Division by shares (muqasama)", ur: "مُقاسَمہ (حصہ بندی)" }
summary:
  ar: "المقاسمة في اللغة مصدر قاسم، وهي أخذ كل من الشريكين نصيبه. وفي الاصطلاح الفقهي تُستعمل في عدة أبواب: توريث الجد مع الإخوة، وخراج الأرض الذي يؤخذ حصة من الناتج، ومطالبة أحد الشريكين شريكه بقسمة المال المشترك، وقطع الثمرة وقسمتها بين رب المال والساعي. وهي أعم من المهايأة والمحاصة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14888} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14889}"
  en: "Muqasama is the division of a shared thing into shares; each partner takes his portion. The jurists use the word in several chapters: how a grandfather shares the estate with the brothers, the kharaj on land taken as a share of the produce, a partner's demand that common property be divided, and the picking of fruit and its division between the owner and the collector. It is broader than the mahaya (time-sharing of use) and the muhasa (pro-rata sharing when assets fall short of debts). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14888} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14889}"
  ur: "مُقاسَمہ شریک کے مشترکہ مال کو حصوں میں تقسیم کرنے کو کہتے ہیں۔ فقہاء اسے دادا کی میراث میں بھائیوں کے ساتھ حصہ، زمین کے خراج اور پھل کی تقسیم کے ابواب میں ذکر کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14888} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14890}"
