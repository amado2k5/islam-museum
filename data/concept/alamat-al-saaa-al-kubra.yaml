id: concept/alamat-al-saaa-al-kubra
class: concept
kind: belief
label:
  ar: علامات الساعة الكبرى
  en: The major signs of the Hour
  fr: "Les grands signes de l’Heure"
  ur: علاماتِ قیامۃِ کبریٰ
  es: "Las principales señales de la Hora"
  tr: "Büyük Saat İşaretleri"
  id: "Tanda Jam Besar"
summary:
  ar: "العلامات الكبرى عشر آيات عدّها النبي لأصحابه في حديث حذيفة بن أسيد الغفاري: الدخان والدجال والدابة وطلوع الشمس من مغربها ونزول عيسى ابن مريم ويأجوج ومأجوج وثلاثة خسوف ونار تخرج من اليمن {cite:sahih-muslim}."
  en: "The major signs are ten portents the Prophet listed in the hadith of Hudhayfa ibn Usayd al-Ghifari: the Smoke, the Dajjal, the Beast, the sun rising from the west, the descent of Isa, Ya'juj and Ma'juj, three landslides, and the Fire driving people to the gathering {cite:sahih-muslim}."
  fr: "Les grands signes sont dix présages que le Prophète énumère dans le hadith de Hudhayfa ibn Usayd al-Ghifari : la Fumée, le Dajjal, la Bête, le lever du soleil à l’ouest, la descente de Jésus, Gog et Magog, trois affaissements de terrain et le Feu qui pousse les gens vers le rassemblement {cite:sahih-muslim}."
  ur: "قیامت کی دس بڑی نشانیاں نبی نے حضرت حذیفہ بن اسید غفاری کی حدیث میں بیان فرمائیں: دخان، دجال، دابۃ الارض، مغرب سے سورج کا طلوع، عیسیٰ ابن مریم کا نزول، یاجوج ماجوج، تین دھنسنے، اور لوگوں کو محشر کی طرف ہانکنے والی آگ {cite:sahih-muslim}۔"
  es: "Las principales señales son diez presagios que el Profeta enumeró en el hadiz de Hudhayfa ibn Usayd al-Ghifari: el Humo, el Dajjal, la Bestia, la salida del sol por el oeste, el descenso de Isa, Ya'juj y Ma'juj, tres deslizamientos de tierra y el Fuego que conduce a la gente a la reunión {cite:sahih-muslim}."
  tr: "Başlıca işaretler, Peygamber'in Hudhayfah ibn Asid al-Gifari'nin hadislerinde sahabeleri olarak saydığı on ayettir: duman, Decal, canavar, güneşin batısından doğuşu, İsa'nın (Meryem'in oğlu, Gog ve Magog'un inişi), üç ay tutulması ve Yemen'den çıkan ateş {atıf:sahih-muslim}."
  id: "Tanda utama adalah sepuluh ayat yang dicantumkan Nabi sebagai sahabat dalam hadits Hudhayfah ibn Asid al-Ghifari: asap, Decal, binatang, matahari terbit dari barat, gerhana Yesus (putra Maria, turunnya Gog dan Magog), dan api yang keluar dari Yaman {atribusi: sahih-muslim}."
