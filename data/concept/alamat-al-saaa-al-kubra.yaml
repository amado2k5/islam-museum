label:
  ar: علامات الساعة الكبرى
  en: The major signs of the Hour
  ur: علاماتِ قیامۃِ کبریٰ
summary:
  ar: "العلامات الكبرى عشر آيات عدّها النبي لأصحابه في حديث حذيفة بن أسيد الغفاري: الدخان والدجال والدابة وطلوع الشمس من مغربها ونزول عيسى ابن مريم ويأجوج ومأجوج وثلاثة خسوف ونار تخرج من اليمن {cite:sahih-muslim}."
  en: "The major signs are ten portents the Prophet listed in the hadith of Hudhayfa ibn Usayd al-Ghifari: the Smoke, the Dajjal, the Beast, the sun rising from the west, the descent of Isa, Ya'juj and Ma'juj, three landslides, and the Fire driving people to the gathering {cite:sahih-muslim}."
  ur: "قیامت کی دس بڑی نشانیاں نبی نے حضرت حذیفہ بن اسید غفاری کی حدیث میں بیان فرمائیں: دخان، دجال، دابۃ الارض، مغرب سے سورج کا طلوع، عیسیٰ ابن مریم کا نزول، یاجوج ماجوج، تین دھنسنے، اور لوگوں کو محشر کی طرف ہانکنے والی آگ {cite:sahih-muslim}۔"
