label:
  ar: "وَكيرة"
  en: "Wakira (feast on finishing a house, fiqh)"
summary:
  ar: "الوَكِيرة في اللغة من الوَكْر، وهو عش الطائر، ويقال وكّر فلان اتخذ الوكيرة، والوكيرة طعام يتخذه الشخص عند فراغه من البناء فيدعو إليه؛ وفي الاصطلاح هي الطعام الذي يُتخذ عند الفراغ من بناء الدور فيدعى إليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17829}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17830}\n\nالوليمة في اللغة طعام العرس أو كل طعام يُصنع لدعوة، وهي في الاصطلاح ما يُتخذ لسرور حادث من عرس وإملاك وغيرهما، وتُطلق بمعناها الأعم على دعوات المناسبات الخاصة كالشندخية والإعذار والخرس والعقيقة والوكيرة والنقيعة والتحفة والحذاق والشنداخ والعتيرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17830}\n\nفعل الوكيرة. قال الشافعية هي مستحبة لا واجبة على المذهب، وهي دون وليمة العرس في التأكيد، وخرّج بعضهم قولاً في وجوب الولائم كلها. وقال الحنابلة فعل الدعوات لغير العرس مباح لا يُكره ولا يُستحب نصاً، والدعوة إلى غير العرس فيما روي عن عثمان بن أبي العاص مما كانوا لا يأتونه زمن النبي؛ والعقيقة تُسن، ودعوة المأتم تُكره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17830}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17831} وقال ابن قدامة إن الدعوة في غير التزويج ليس لها فضيلة مختصة لعدم ورود الشرع بها، ولكن فاعلها يُؤجر على شكر النعمة وإطعام الإخوان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17831}\n\nحكم إجابة الدعوة إلى الوكيرة. الحنفية والشافعية في المذهب والحنابلة: الإجابة غير واجبة، فهي سنة عند الحنفية ومستحبة عند الشافعية والحنابلة، لحديث البراء «أمرنا بإجابة الداعي»، ولجبر قلب الداعي. وقال الشافعية في قول بوجوب إجابة الدعوة إلى الوكيرة وسائر الولائم، لحديث «من دُعي إلى عرس ونحوه فليجب». والمالكية في قول يكرهونها، وفي قول يبيحونها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17831}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17832}\n\nالحكمة في الإجابة إدخال السرور على الداعي وجبر قلبه، وينبغي أن يقصد المدعو الاقتداء بالسنة وزيارة أخيه وإكرامه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17832}\n\nالأكل من طعام الوكيرة. يُستحب لمن حضر ودُعي أن يأكل إن كان غير صائم، عند جمهور الفقهاء؛ وذكر ابن حجر احتمال الوجوب، ونقل عن النووي أنه اختار الوجوب. أما الصائم فإن كان صومه واجباً أتمه ولم يأكل، وإن كان متطوعاً استُحب له الإفطار إن شقّ على صاحب الدعوة صومه، لحديث أبي سعيد في طعام النبي وأصحابه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17832}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17833}\n\nقال ابن تيمية: لا ينبغي لصاحب الدعوة أن يلحّ على المدعو في الأكل إذا امتنع من الفطر في التطوع، أو من الأكل إن كان مفطراً، فكلا الأمرين جائز، وإذا ألزمه بما لا يلزمه كان من نوع المسألة المنهي عنها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17833} وشروط إجابة الدعوة إلى الوكيرة تُفصّل في مادة «وليمة»، ولا تُذكر هنا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17833}"
  en: "The wakira is, in the language, from wakr, a bird's nest; a wakira is a meal that a man makes when he finishes building a house, to which people are invited. In the technical sense it is the meal made on finishing the building of houses and called to. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17829}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17830}\n\nThe walima, in the language, is the wedding feast or any food made for a gathering; in the technical sense it is the food made for a happy occasion, such as a wedding or a betrothal. In its wider sense it covers invitations to particular occasions, such as the shindakhiyya, the i'adhar, the khurs, the 'aqiqa, the wakira, the naqi'a, the tuhfa, the hadhdhaq, the shindakh and the 'atira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17830}\n\nMaking a wakira. The Shafi'is hold that it is recommended, not obligatory, on the school view, and less emphatic than the wedding feast; some drew a view that all feasts are obligatory. The Hanbalis say that making invitations other than to a wedding is permitted, neither disliked nor recommended; a report from al-Hasan says that 'Uthman ibn Abi al-'As declined a circumcision invitation, since they did not attend such feasts in the Prophet's time. The 'aqiqa is sunna, and an invitation to a mourning gathering is disliked. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17830}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17831} Ibn Qudama says that an invitation other than to a wedding has no particular merit, since the law does not mention it, but its maker is rewarded for giving thanks and feeding his brothers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17831}\n\nAnswering the invitation. The Hanafis, the school view of the Shafi'is and the Hanbalis hold that answering is not obligatory: it is sunna for the Hanafis and recommended for the Shafi'is and Hanbalis, on the report 'we were commanded to answer the caller', and to comfort the host. A Shafi'i view holds that answering is obligatory for the wakira and all feasts, on the report 'whoever is invited to a wedding or the like, let him answer'. The Malikis have one view that it is disliked and another that it is permitted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17831}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17832}\n\nThe purpose of answering is to bring joy to the host and comfort him; the guest should intend to follow the sunna, to visit and honour his brother. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17832}\n\nEating from the wakira's food. The majority hold that the invited guest who is not fasting is recommended to eat; Ibn Hajar mentions the possibility of obligation, and reports that al-Nawawi preferred the view of obligation. A guest who is fasting by an obligatory fast completes it and does not eat. If the fast is voluntary, the Shafi'is and Hanbalis recommend breaking it if it would distress the host, on the report of Abu Sa'id about the Prophet and his companions eating at a meal prepared for them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17832}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17833}\n\nIbn Taymiyya says that the host should not press the guest to eat if he refuses to break a voluntary fast, or to eat if he is not fasting; both are permitted, and to oblige him to what is not required is one of the forbidden matters. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17833} The conditions for answering an invitation to a wakira are set out under walima, and are not repeated here. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17833}"
