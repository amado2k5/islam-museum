id: concept/uqr
class: concept
kind: legal
label:
  ar: "العُقْر"
  en: "Dower for intercourse without a valid contract (uqr)"
  ur: "عقر (مہر کا بدل)"
summary:
  ar: "العقر في اللغة المهر، وهو المهر الذي يُعطى للمغتصبة من الإماء، وقيل مهر المرأة إذا وُطئت بشبهة، وفي الاصطلاح في الحرائر مهر المثل، وفي الإماء عشر القيمة لو كانت بكراً ونصفه لو كانت ثيباً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11769} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11770}. ويفرق بينه وبين الأجر، فالأجر أعم، ويستعمل في عقد المنافع وغيرها، والعقر لا يستعمل إلا في منافع البضع {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11770}. ويجب المهر في النكاح الصحيح بالعقد والدخول، ويجب في النكاح الفاسد بالدخول، وكذلك في الوطء بشبهة، واختلفوا هل الواجب المسمى أو مهر المثل {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11770}."
  en: "In the lexicon, uqr is the dower, especially the dower given to a woman forced or taken as a slave-woman; it is also the dower of a woman who is had by mistake. As a term it is the dower of the usual kind for a free woman and, for a slave-woman, a tenth of her value if she was a virgin or half of it if she was not {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11769} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11770}. Ajr is wider and covers the price of benefits generally, while uqr is used only of benefit from the woman's body {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11770}. The dower is due in a valid marriage on the contract and consummation, and in a void marriage on consummation; it is due also for intercourse under a mistake, and the jurists differ on whether the stipulated dower or the customary dower is due {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11770}."
