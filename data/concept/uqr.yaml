id: concept/uqr
class: concept
kind: legal
label:
  ar: "العُقْر"
  en: "Dower for intercourse without a valid contract (uqr)"
  ur: "عقر ⁦(مہر کا بدل)⁩"
  es: "Dote por relaciones sexuales sin contrato válido (uqr)"
  fr: "Dot pour relations sexuelles sans contrat valide (uqr)"
summary:
  ar: "العقر في اللغة المهر، وهو المهر الذي يُعطى للمغتصبة من الإماء، وقيل مهر المرأة إذا وُطئت بشبهة، وفي الاصطلاح في الحرائر مهر المثل، وفي الإماء عشر القيمة لو كانت بكراً ونصفه لو كانت ثيباً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11769} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11770}. ويفرق بينه وبين الأجر، فالأجر أعم، ويستعمل في عقد المنافع وغيرها، والعقر لا يستعمل إلا في منافع البضع {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11770}. ويجب المهر في النكاح الصحيح بالعقد والدخول، ويجب في النكاح الفاسد بالدخول، وكذلك في الوطء بشبهة، واختلفوا هل الواجب المسمى أو مهر المثل {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11770}."
  en: "In the lexicon, uqr is the dower, especially the dower given to a woman forced or taken as a slave-woman; it is also the dower of a woman who is had by mistake. As a term it is the dower of the usual kind for a free woman and, for a slave-woman, a tenth of her value if she was a virgin or half of it if she was not {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11769} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11770}. Ajr is wider and covers the price of benefits generally, while uqr is used only of benefit from the woman's body {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11770}. The dower is due in a valid marriage on the contract and consummation, and in a void marriage on consummation; it is due also for intercourse under a mistake, and the jurists differ on whether the stipulated dower or the customary dower is due {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11770}."
  es: "En el léxico, uqr es la dote, especialmente la dote dada a una mujer forzada o tomada como esclava; también es la dote de una mujer que es tomada por error. Como término es la dote del tipo habitual para una mujer libre y, para una esclava, una décima parte de su valor si era virgen o la mitad de él si no lo era {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11769} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11770}. Ajr es más amplio y cubre el precio de los beneficios en general, mientras que uqr se usa solo para el beneficio del cuerpo de la mujer {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11770}. La dote se debe en un matrimonio válido en el contrato y consumación, y en un matrimonio nulo en la consumación; También se debe por relaciones sexuales bajo error, y los juristas difieren en si se debe la dote estipulada o la dote consuetudinaria {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11770}."
  fr: "Dans le lexique, « uqr » désigne la dot, en particulier celle due à une femme contrainte ou réduite en esclavage; il s’agit également de la dot d’une femme acquise par erreur. Ce terme désigne la dot habituelle d’une femme libre et, pour une esclave, un dixième de sa valeur si elle était vierge, ou la moitié si elle ne l’était pas {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11769} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11770}. « Ajr » a un sens plus large et couvre la valeur des avantages en général, tandis que « uqr » ne s’applique qu’aux avantages tirés du corps de la femme {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11770}. La dot est due dans un mariage valide lors de la conclusion du contrat et de la consommation, et dans un mariage nul lors de la consommation. elle est également due pour les rapports sexuels survenus par erreur, et les juristes divergent sur la question de savoir si c'est la dot stipulée ou la dot coutumière qui est due {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11770}."
  ur: "لغت میں، عقر مہر ہے، خاص طور پر وہ مہر جو کسی عورت کو دیا جاتا ہے یا اسے لونڈی کے طور پر لیا جاتا ہے۔ یہ اس عورت کا مہر بھی ہے جو غلطی سے مل گئی ہو۔ ایک اصطلاح کے طور پر یہ آزاد عورت کے لیے معمول کا مہر ہے اور غلام عورت کے لیے اس کی قیمت کا دسواں حصہ اگر وہ کنواری ہو یا اگر وہ نہ ہو تو اس کا نصف حصہ اجر وسیع ہے اور عام طور پر فوائد کی قیمت کا احاطہ کرتا ہے، جبکہ عقر کا استعمال صرف عورت کے جسم کے فائدے کے لیے ہوتا ہے مہر عقد اور تکمیل پر ایک درست شادی میں واجب الادا ہے، اور ختم ہونے پر باطل شادی میں؛ یہ غلطی کے تحت جماع کے لیے بھی واجب ہے، اور فقہاء کا اس میں اختلاف ہے کہ مقررہ مہر واجب ہے یا رواجی مہر۔"
