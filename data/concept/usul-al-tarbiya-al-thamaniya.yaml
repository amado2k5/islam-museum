label:
  ar: "أصول التربية الثمانية في القرآن والسنة"
  en: "The eight principles of education in the Qur'an and Sunna"
summary:
  ar: "يستخلص البري من القرآن الكريم والسنة النبوية ثمانية أصول للتربية والتعليم: التخلية بين العبد وربه، وتقرير المساواة العامة، ودعوة الإسلام إلى العلم، وأن العقائد لا تنافي العقل، وأن الدين شُرع لخير الإنسان، وحرية البحث والنظر، والشورى والنصيحة، وأن العمل مناط السعادة {cite:usul-al-tarbiya-azhar p. 8} {cite:usul-al-tarbiya-azhar p. 9}. ويرى أن هذه الأصول تبني إنساناً يعرف ربه ويعمل بعلمه وينفع أمته، وأن التربية الإسلامية تعبدية قبل أن تكون مهنية {cite:usul-al-tarbiya-azhar p. 9}."
  en: "Al-Bari draws eight principles of education from the Qur'an and the Sunna: freedom of the servant from intermediaries before God, general equality, the call to knowledge, that creed does not oppose reason, that religion was legislated for human good, freedom of inquiry, shura and counsel, and that deeds are the basis of happiness. His aim is a person who knows his Lord, acts on his knowledge and benefits his community (pp. 8-9). This is the author's own framing."
