id: concept/usul-al-tarbiya-al-thamaniya
class: concept
kind: doctrine
label:
  ar: "أصول التربية الثمانية في القرآن والسنة"
  en: "The eight principles of education in the Qur'an and Sunna"
  es: "Los ocho principios de la educación en el Corán y la Sunna"
  fr: "Les huit principes de l'éducation dans le Coran et la Sunna"
  ur: "قرآن و سنت میں تعلیم کے آٹھ اصول"
  tr: "Kur'an ve Sünnet'te Eğitimin Sekiz İlkesi"
  id: "Delapan Prinsip Pendidikan dalam Al-Qur'an dan Sunnah"
summary:
  ar: "يستخلص البري من القرآن الكريم والسنة النبوية ثمانية أصول للتربية والتعليم: التخلية بين العبد وربه، وتقرير المساواة العامة، ودعوة الإسلام إلى العلم، وأن العقائد لا تنافي العقل، وأن الدين شُرع لخير الإنسان، وحرية البحث والنظر، والشورى والنصيحة، وأن العمل مناط السعادة {cite:usul-al-tarbiya-azhar p. 8} {cite:usul-al-tarbiya-azhar p. 9}. ويرى أن هذه الأصول تبني إنساناً يعرف ربه ويعمل بعلمه وينفع أمته، وأن التربية الإسلامية تعبدية قبل أن تكون مهنية {cite:usul-al-tarbiya-azhar p. 9}."
  en: "Al-Bari draws eight principles of education from the Qur'an and the Sunna: freedom of the servant from intermediaries before God, general equality, the call to knowledge, that creed does not oppose reason, that religion was legislated for human good, freedom of inquiry, shura and counsel, and that deeds are the basis of happiness. His aim is a person who knows his Lord, acts on his knowledge and benefits his community (pp. 8-9). This is the author's own framing."
  es: "Al-Bari extrae ocho principios de educación del Corán y la Sunna: la libertad del siervo de los intermediarios ante Dios, la igualdad general, el llamado al conocimiento, que el credo no se opone a la razón, que la religión fue legislada para el bien humano, la libertad de investigación, la shura y el consejo, y que las obras son la base de la felicidad. Su objetivo es formar a una persona que conozca a su Señor, actúe conforme a ese conocimiento y beneficie a su comunidad (págs. 8-9). Esta es la propia interpretación del autor."
  fr: "Al-Bari tire huit principes d'éducation du Coran et de la Sunna: l'absence d'intermédiaires devant Dieu, l'égalité universelle, l'appel à la connaissance, la non-opposition entre la croyance et la raison, la vocation bienveillante de la religion, la liberté de recherche, la shura et le conseil, et la conviction que les actes sont la source du bonheur. Son objectif est de former une personne qui connaît son Seigneur, agit selon sa connaissance et œuvre pour le bien de sa communauté (p. 8-9). Telle est la conception propre à l'auteur."
  ur: "الباری نے تعلیم کے آٹھ اصول قرآن و سنت سے اخذ کیے ہیں: بندے کی خدا کے سامنے ثالثوں سے آزادی، عام مساوات، علم کی دعوت، وہ عقیدہ عقل کی مخالفت نہیں کرتا، وہ مذہب انسانی بھلائی کے لیے قانون سازی کیا گیا، تحقیقات کی آزادی، شوریٰ اور مشورہ، اور یہ کہ اعمال سعادت کی بنیاد ہیں۔ اس کا مقصد وہ شخص ہے جو اپنے رب کو پہچانتا ہے، اس کے علم پر عمل کرتا ہے اور اپنی برادری کو فائدہ پہنچاتا ہے ⁦(صفحہ 8-9)⁩۔ یہ مصنف کی اپنی فریمنگ ہے۔"
  tr: "El-Bari, Kur'an-Kerim ve Peygamberlik Sünnet'ten sekiz eğitim ve öğretim ilkesini çıkarır: kul ile Rab arasındaki ayrım, genel eşitliğin tesis edilmesi, İslam'ın bilgiye çağrısı, inançların akla çelişmediği, dinin insanlığın iyiliği için yasalaştırılması, sorgulama ve düşünme özgürlüğü, danışma ve öğüt verme ve eylemin mutluluğun temeli olduğu {cite:usul-al-tarbiya-azhar, s. 8} {cite:usul-al-tarbiya-azhar, s. 9}. Bu ilkelerin, Rabbini tanıyan, bilgisine göre hareket eden ve milletine fayda sağlayan bir kişi inşa ettiğine ve İslami eğitimin mesleki olmadan önce ibadet olduğuna inanır {cite:usul-al-tarbiya-azhar, s. 9}."
  id: "Al-Bari mengutip dari Al-Qur'an dan Sunnah Nabi delapan prinsip pendidikan dan pengajaran: pemisahan antara hamba dan Tuhan-nya, penetapan kesetaraan umum, panggilan Islam untuk ilmu, bahwa kepercayaan tidak bertentangan dengan akal, bahwa agama diatur demi kebaikan umat manusia, kebebasan untuk penyelidikan dan refleksi, konsultasi dan nasihat, dan bahwa tindakan adalah dasar kebahagiaan {cite:usul-al-tarbiya-azhar, hlm. 8} {cite:usul-al-tarbiya-azhar, hlm. 9}. Ia percaya bahwa prinsip-prinsip ini membangun seseorang yang mengenal Tuhan-nya, bertindak berdasarkan pengetahuan-Nya, dan bermanfaat bagi bangsanya, serta pendidikan Islam bersifat devosi sebelum menjadi profesional {cite:usul-al-tarbiya-azhar, hlm. 9}."
