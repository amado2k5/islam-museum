id: concept/canon-worms-in-children
class: concept
kind: scientific
label: { ar: "الديدان في بطون الصبيان عند ابن سينا", en: "Worms in children's bellies in the Canon", ur: "قانون میں بچوں کے پیٹ کے کیڑے", es: "Gusanos en el vientre de los niños en el Canon", fr: "Des vers dans le ventre des enfants dans le Canon", tr: "İbn Sina'ya göre erkeklerin midesindeki solucanlar", id: "Cacing di Perut Anak Laki-laki menurut Ibn Sina" }
summary:
  ar: "يذكر ابن سينا ديداناً صغاراً تتولد في بطون الصبيان أكثرها في ناحية المقعدة، ومنها الطوال وقلما تتولد العراض، فتعالج الطوال بماء الشيح في اللبن وبتضميد البطن، والصغار بالراسن والعروق الصفر مع السكر {cite:canon-ibn-sina-print-v1 pp.219-220}."
  en: "Ibn Sina mentions small worms that grow in children's bellies, mostly near the rectum, some of them long and flat ones rarely; the long are treated with wormwood water in milk and poultices on the belly, and the small with rasan and yellow roots with sugar {cite:canon-ibn-sina-print-v1 pp.219-220}."
  es: "Ibn Sina menciona unos pequeños gusanos que crecen en el vientre de los niños, sobre todo cerca del recto, algunos de ellos largos y planos, aunque raramente; los largos se tratan con agua de ajenjo en leche y cataplasmas en el vientre, y los pequeños con rasan y raíces amarillas con azúcar {cite:canon-ibn-sina-print-v1 pp.219-220}."
  fr: "Ibn Sina mentionne de petits vers qui se développent dans le ventre des enfants, principalement près du rectum, certains d'entre eux étant longs et plats, rarement; les longs sont traités avec de l'eau d'absinthe dans du lait et des cataplasmes sur le ventre, et les petits avec du rasan et des racines jaunes avec du sucre {cite:canon-ibn-sina-print-v1 pp.219-220}."
  ur: "ابن سینا نے چھوٹے کیڑوں کا ذکر کیا ہے جو بچوں کے پیٹ میں بڑھتے ہیں، زیادہ تر ملاشی کے قریب، ان میں سے کچھ لمبے اور چپٹے شاذ و نادر ہی ہوتے ہیں۔ لمبے کو دودھ میں کیڑے کی لکڑی کے پانی اور پیٹ پر پولٹیس کے ساتھ علاج کیا جاتا ہے، اور چھوٹے کو رسن اور پیلی جڑوں سے چینی کے ساتھ علاج کیا جاتا ہے"
  tr: "İbn Sina, erkek çocukların karın bölgesinde doğan küçük solucanlardan bahseder; bunların çoğu ayak bileği bölgesinde bulunur, uzun olanlar da nadiren atriyum oluşturur. Uzun olanlar sütle pelin suyu ile ve karın bandajlanarak tedavi edilir; yavrular ise başlı ve sarı damarlı olanlar şekerle tedavi edilir {cite:canon-ibn-sina-print-v1 s.219-220}."
  id: "Ibn Sina menyebutkan cacing kecil yang lahir di perut anak laki-laki, sebagian besar berada di area pergelangan kaki, termasuk yang tinggi, yang jarang menghasilkan atrium. Cacing panjang diolah dengan air wormwood dalam susu dan dengan membalut perut, dan yang muda dengan kepala dan pembuluh darah kuning dengan gula {cite:canon-ibn-sina-print-v1 hlm.219-220}."
