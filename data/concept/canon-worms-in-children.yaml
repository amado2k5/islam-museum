label: { ar: "الديدان في بطون الصبيان عند ابن سينا", en: "Worms in children's bellies in the Canon", ur: "قانون میں بچوں کے پیٹ کے کیڑے" }
summary:
  ar: "يذكر ابن سينا ديداناً صغاراً تتولد في بطون الصبيان أكثرها في ناحية المقعدة، ومنها الطوال وقلما تتولد العراض، فتعالج الطوال بماء الشيح في اللبن وبتضميد البطن، والصغار بالراسن والعروق الصفر مع السكر {cite:canon-ibn-sina-print-v1 pp.219-220}."
  en: "Ibn Sina mentions small worms that grow in children's bellies, mostly near the rectum, some of them long and flat ones rarely; the long are treated with wormwood water in milk and poultices on the belly, and the small with rasan and yellow roots with sugar {cite:canon-ibn-sina-print-v1 pp.219-220}."
