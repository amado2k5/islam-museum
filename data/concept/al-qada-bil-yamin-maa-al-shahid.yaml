id: concept/al-qada-bil-yamin-maa-al-shahid
class: concept
kind: legal
label:
  ar: "القضاء باليمين مع الشاهد"
  en: "Judgement on one witness and the claimant's oath"
  fr: "Le jugement sur la foi d’un témoin et du serment du demandeur"
  ur: "ایک گواہ اور مدعی کی قسم پر فیصلہ"
  es: "Sentencia basada en un testigo y en el juramento del demandante"
  tr: "Yargı, tanıkla birlikte yemin eder"
  id: "Lembaga peradilan mengucapkan sumpah bersama saksi"
term: { ar: "اليَمين مع الشاهد، الشاهد واليمين", en: "al-yamin ma'a al-shahid" }
summary:
  ar: "أن يقضي القاضي للمدعي إذا أقام شاهداً واحداً وحلف معه. يثبته الشافعي في كتاب الأم بحديث ابن عباس في أن النبي قضى بها، ويقصره على الأموال وما في معناها، فلا يقضى به في النكاح والطلاق والعتق والحدود والقصاص والوصاية والوكالة، ولا يحلف المدعي مع امرأتين. ويرد على من خالفه فيه، ويحكي حججهم: أنها خلاف كتاب الله، وأن حديثها مرسل، وأن الزهري أنكرها. {cite:kitab-al-umm-wafa-v8 p.5} {cite:kitab-al-umm-wafa-v8 p.15} {cite:kitab-al-umm-wafa-v8 p.16} {cite:kitab-al-umm-wafa-v8 p.19}"
  en: "The judge's ruling for a claimant who brings one witness and takes an oath with him. Al-Shafi'i in Kitab al-Umm affirms it on the hadith of Ibn Abbas that the Prophet so ruled, and limits it to property and what is like it, so that it does not apply to marriage, divorce, manumission, hadd penalties, retaliation, appointment of an executor or agency, and a claimant does not swear alongside two women. He answers those who reject it, reporting their arguments: that it contradicts the Book of God, that its hadith is mursal, and that al-Zuhri denied it."
  fr: "Décision du juge en faveur du demandeur qui produit un témoin et prête serment à l’appui de son droit. Dans le Kitab al-Umm, al-Shafi‘i la tient pour établie par le hadith d’Ibn ‘Abbas rapportant que le Prophète a jugé ainsi. Il la limite aux biens et aux matières analogues : elle ne s’applique ni au mariage, ni au divorce, ni à l’affranchissement, ni aux peines de hadd, ni au talion, ni à la désignation d’un exécuteur testamentaire ou d’un mandataire. Le demandeur ne prête pas serment à l’appui de deux témoignages de femmes. Al-Shafi‘i répond à ceux qui rejettent ce jugement et rapporte leurs arguments : il contredirait le Livre de Dieu, le hadith serait mursal et al-Zuhri l’aurait récusé."
  ur: "یہ کہ قاضی مدعی کے حق میں فیصلہ کرے جب وہ ایک گواہ لائے اور اس کے ساتھ قسم کھائے۔ امام شافعی کتاب الام میں ابن عباس کی حدیث سے، کہ نبی نے اس پر فیصلہ کیا، اسے ثابت کرتے ہیں، اور اسے اموال اور ان کے ہم معنی امور تک محدود رکھتے ہیں؛ چنانچہ نکاح، طلاق، عتق، حدود، قصاص، وصایت اور وکالت میں اس پر فیصلہ نہیں ہوتا، اور مدعی دو عورتوں کے ساتھ قسم نہیں کھاتا۔ وہ اس کے مخالفین کا رد کرتے ہیں اور ان کے دلائل نقل کرتے ہیں: کہ یہ کتاب اللہ کے خلاف ہے، اس کی حدیث مرسل ہے، اور زہری نے اس کا انکار کیا۔"
  es: "El fallo del juez a favor de un demandante que presenta un testigo y jura con él. Al-Shafi'i, en Kitab al-Umm, lo afirma basándose en el hadiz de Ibn Abbas que el Profeta dictaminó así, y lo limita a la propiedad y lo que es similar, de modo que no se aplica al matrimonio, el divorcio, la manumisión, las penas hadd, la represalia, el nombramiento de un albacea o representante, y un demandante no jura junto a dos mujeres. Responde a quienes lo rechazan, recogiendo sus argumentos: que contradice el Libro de Dios, que su hadiz es mursal y que al-Zuhri lo negó."
  tr: "Hakim, davacı sadece bir tanık sunup onunla yemin ederse onun lehine karar vermelidir. El-Şafii, İbn Abbas'ın hadisine atıfta bulunarak, İbn Abbas'ın hadisini alıntılayarak bunu sadece servet ve anlamlarıyla sınırladığını belirtir; bu nedenle evlilik, boşanma, özgürlük, hudud, kısa, vasilik veya vekillikte aleyhine hükmedilmez, ayrıca davacı iki kadınla yemin etmez. Bu konuda kendisiyle aynı fikirde olmayanları reddeder ve onların argümanları, bunun Allah Kitabı'na aykırı, hadisin mursal olduğu ve El-Zuhri'nin bunu reddettiği yönündedir. {alıntı:kitab-al-um-wafa-v8 s.5} {cite:kitab-al-um-wafa-v8 s.15} {cite:kitab-al-um-wafa-v8 s.16} {cite:kitab-al-um-wafa-v8 s.19}"
  id: "Hakim harus memutuskan mendukung penggugat jika ia hanya menghadirkan saksi dan bersumpah bersama mereka. Al-Shafi'i, merujuk pada hadis Ibn Abbas, mengutip hadis Ibn Abbas dan menyatakan bahwa ia membatasinya hanya pada kekayaan dan makna; oleh karena itu, pernikahan, perceraian, kebebasan, batasan, surat pengawasan, perwalian, atau pengacara tidak diputuskan melawannya, dan penggugat juga tidak bersumpah atas dua wanita. Ia menolak mereka yang tidak setuju dengannya dalam hal ini, dan argumen mereka adalah bahwa ini bertentangan dengan Kitab Allah, bahwa hadis adalah utusan, dan bahwa Al-Zuhri menolaknya. {kutipan: kitab-al-um-wafa-v8 hlm.5} {kutipan: kitab-al-um-wafa-v8 hlm.15} {cite:Kitab-al-um-wafa-v8 p.16} {cite:Kitab-al-um-wafa-v8 p.19}"
