id: concept/al-qada-bil-yamin-maa-al-shahid
class: concept
kind: legal
label:
  ar: "القضاء باليمين مع الشاهد"
  en: "Judgement on one witness and the claimant's oath"
  ur: "ایک گواہ اور مدعی کی قسم پر فیصلہ"
term: { ar: "اليَمين مع الشاهد، الشاهد واليمين", en: "al-yamin ma'a al-shahid" }
summary:
  ar: "أن يقضي القاضي للمدعي إذا أقام شاهداً واحداً وحلف معه. يثبته الشافعي في كتاب الأم بحديث ابن عباس في أن النبي قضى بها، ويقصره على الأموال وما في معناها، فلا يقضى به في النكاح والطلاق والعتق والحدود والقصاص والوصاية والوكالة، ولا يحلف المدعي مع امرأتين. ويرد على من خالفه فيه، ويحكي حججهم: أنها خلاف كتاب الله، وأن حديثها مرسل، وأن الزهري أنكرها. {cite:kitab-al-umm-wafa-v8 p.5} {cite:kitab-al-umm-wafa-v8 p.15} {cite:kitab-al-umm-wafa-v8 p.16} {cite:kitab-al-umm-wafa-v8 p.19}"
  en: "The judge's ruling for a claimant who brings one witness and takes an oath with him. Al-Shafi'i in Kitab al-Umm affirms it on the hadith of Ibn Abbas that the Prophet so ruled, and limits it to property and what is like it, so that it does not apply to marriage, divorce, manumission, hadd penalties, retaliation, appointment of an executor or agency, and a claimant does not swear alongside two women. He answers those who reject it, reporting their arguments: that it contradicts the Book of God, that its hadith is mursal, and that al-Zuhri denied it."
  ur: "یہ کہ قاضی مدعی کے حق میں فیصلہ کرے جب وہ ایک گواہ لائے اور اس کے ساتھ قسم کھائے۔ امام شافعی کتاب الام میں ابن عباس کی حدیث سے، کہ نبی نے اس پر فیصلہ کیا، اسے ثابت کرتے ہیں، اور اسے اموال اور ان کے ہم معنی امور تک محدود رکھتے ہیں؛ چنانچہ نکاح، طلاق، عتق، حدود، قصاص، وصایت اور وکالت میں اس پر فیصلہ نہیں ہوتا، اور مدعی دو عورتوں کے ساتھ قسم نہیں کھاتا۔ وہ اس کے مخالفین کا رد کرتے ہیں اور ان کے دلائل نقل کرتے ہیں: کہ یہ کتاب اللہ کے خلاف ہے، اس کی حدیث مرسل ہے، اور زہری نے اس کا انکار کیا۔"
wings: [ideas]
themes: [law-and-courts]
regions: [global]
sensitivity: contested
issue:
  ar: "هل يقضى للمدعي بشاهد واحد مع يمينه، وفي أي الحقوق؟"
  en: "May a claimant win on one witness and his own oath, and for which rights?"
  ur: "کیا مدعی کے حق میں ایک گواہ اور اس کی قسم پر فیصلہ ہو سکتا ہے، اور کن حقوق میں؟"
perspectives:
  - tradition: sunni-shafii
    id: shafii
    stance: { ar: "يقضى به في الأموال وما في معناها", en: "It applies to property and what is like it", ur: "اموال اور ان کے ہم معنی امور میں فیصلہ ہوتا ہے" }
    summary:
      ar: "الشافعي: ثابت عن النبي بحديث ابن عباس، لا بحديث مرسل، ولا يحل خلافه عنده، ويقصره على الأموال لأن عمرو بن دينار قال في روايته إن النبي قضى بها في الأموال، وقال جعفر في الدين، والشاهدان أصل في الحقوق. {cite:kitab-al-umm-wafa-v8 p.15} {cite:kitab-al-umm-wafa-v8 p.16}"
      en: "Al-Shafi'i: it is established from the Prophet by the hadith of Ibn Abbas, not by a mursal report, and may not be opposed; he limits it to property because Amr ibn Dinar said in his report that the Prophet ruled so in property, and Ja'far said in debt, while two witnesses are the basic rule for rights."
      ur: "امام شافعی: یہ ابن عباس کی حدیث سے نبی سے ثابت ہے، کسی مرسل روایت سے نہیں، اور ان کے نزدیک اس کی مخالفت جائز نہیں؛ وہ اسے اموال تک محدود کرتے ہیں کیونکہ عمرو بن دینار نے اپنی روایت میں کہا کہ نبی نے اموال میں یہ فیصلہ کیا، اور جعفر نے دین میں کہا، اور حقوق میں اصل دو گواہ ہیں۔"
    holders: [person/al-shafii]
    sources: [source/kitab-al-umm-wafa-v8]
  - tradition: sunni
    id: opponents-reported
    stance: { ar: "لا يقضى به (كما يحكيه الشافعي عن مخالفيه)", en: "It is not applied (as al-Shafi'i reports his opponents)", ur: "اس پر فیصلہ نہیں ہوتا (جیسا امام شافعی مخالفین سے نقل کرتے ہیں)" }
    summary:
      ar: "يحكي الشافعي عن «بعض الناس» ممن ردّها أنهم قالوا إنها خلاف كتاب الله، وإنها لم تُرو إلا مرسلة، وإن الزهري أنكرها، وإن من قضى بها رُدّ حكمه. ولا يسمّيهم الشافعي في الصفحات المقروءة، ولم يُنقل قولهم هنا من كتبهم. {cite:kitab-al-umm-wafa-v8 p.15} {cite:kitab-al-umm-wafa-v8 p.16} {cite:kitab-al-umm-wafa-v8 p.19}"
      en: "Al-Shafi'i reports from 'some people' who rejected it that they called it contrary to the Book of God, said it was narrated only as mursal and that al-Zuhri denied it, and said a ruling based on it would be overturned. Al-Shafi'i does not name them in the pages read, and their view is not given here from their own books."
      ur: "امام شافعی «بعض لوگوں» سے، جنہوں نے اسے رد کیا، نقل کرتے ہیں کہ انہوں نے کہا یہ کتاب اللہ کے خلاف ہے، صرف مرسل مروی ہے، زہری نے اس کا انکار کیا، اور اس پر کیا گیا فیصلہ رد کیا جائے گا۔ امام شافعی پڑھے گئے صفحات میں ان کا نام نہیں لیتے، اور ان کا قول یہاں ان کی اپنی کتابوں سے نقل نہیں ہوا۔"
