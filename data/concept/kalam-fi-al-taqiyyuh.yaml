  "ar": "إذا ظهر في أورام ذات الجنب وذات الرئة علامات الجمع المذكورة وتصعدت فالواجب\
    \ أن يعان على الإنضاج بعد التنقية للبدن معونة تكون بالضمادات والكمادات من هذا\
    \ الجنس وأقوى منه الذي يجعل معه شيء من هذا الجنس وهو يصلح في آخره أيضاً عند التفجير،\
    \ ويجب أن يضطجع قبل وقت الانفجار على الجانب العليل فإنه أعون على النفث والتفجير،\
    \ فإن كانت الحرارة كثيرة سقي ماء العسل في ماء الشعير أو ماء العسل الرقيق وحده\
    \ وإن كانت الحرارة ليست بقوية والقوة قوية فيجب أن يسقى طبيخاً من هذا الجنس وربما\
    \ احتيج إلى مثل المشروبات العظيمة لينضج، وأوفق أوقات سقيه بعد النضج التام ليفجر\
    \ على حفظ من الغريزة والمتمر جيد غاية في هذا الوقت وبعده، وقرص لذلك من هذا الجنس،\
    \ وأما تغذيتهم في التصعد فخبز مبلول بماء أو بماء العسل وما أشبه ذلك من الأغذية\
    \ الرقيقة اللينة والأحساء الرقيقة المتخذة من هذا الجنس. وإذا جاوز وقت الانفجار\
    \ وتم النضج فيجب أن يعان على الانفجار فإن تركه يجعل للمرض صعوبة وشأناً ويسقى شراباً\
    \ قوياً من هذا الجنس بالأضمدة القوية التي ذكرناها، وقد ينفع منه هز كرسي وهو عليه\
    \ جالس وقد أخذ إنسان يكتفيه وينفع منه الاضطجاع على الجانب الصحيح إذا أريد الانفجار،\
    \ وقد أمر بالقيء بعد العشاء في مثل هذا الوقت وذلك خطر فإنه ربما أورث انفجاراً\
    \ عظيماً دفعة واحدة وربما خنق، وأما إذا لم ينفجر فلا بد من الكي ثم تنظر فإن خرجت\
    \ مدة بيضاء نقية رجي وإلا لم يرج. وإذا انفجرت المدة وسالت وحدست بأنها قليلة أو\
    \ معتدلة وبحيث يمكن أن تنقى بالنفث إلى أربعين يوماً فيجب أن تستعمل بعده الجلاءة\
    \ الغسالة المنقية ويسقى كما يبدو نفث ما انفجر وذلك بمثل طبيخ من هذا الجنس والأحساء\
    \ المذكورة من هذا الجنس، وأما الأدوية المفردة التي هي أمهات أدوية هذا الشأن فهي\
    \ من هذا الجنس وربما احتيج أن يخلط معها شيء من المخدرات بقدر، ومن هذه الأدوية\
    \ ما هو شديد المنفعة في هذا الباب وهذه الأدوية تقرص وتلعق وتصير لعوقات ونطولات\
    \ وضمادات بإسفنجات وأدهان وربما جعل الدهن الذي ينقل إليه قوتها من هذا الجنس بحسب\
    \ الحال والوقت، وإذا كانت الحمى قوية فلا تفرط في التسخين فتضعف القوة لسوء المزاج\
    \ وتعجز عن النفث ويجب أن تبادر إلى تدبير إخراج القيح بعد الانفجار إلى الصدر وفي\
    \ الأيام التي يتخيل العليل فيها خفته، وأما إذا حدست في ذات الجنب أن المادة كثيرة\
    \ لا تستنقى في أربعين يوماً فما دونه بل يوقع في السل فلا بد من كي بمكوى دقيق يثقب\
    \ به الصدر لينشف المدة ويستخرجها قليلاً قليلاً ويغسل بماء العسل ويعان على جذبها\
    \ إلى خارج فإذا نقيت أقبلت على الملحم، ويجب أن يتعرف الجهة التي فيها القيح من\
    \ الوجوه المذكورة من صوت القيح وخضخضته، وفي مثل هذا الوقت لا بد من حفظ القوة باللحم\
    \ والغذاء المعتدل ولا تلتفت إلى الحمى فإنها لا تبرأ ما دامت المدة باقية وإذا نقيتها\
    \ أقلعت وإذا قوي العليل على نفث المدة أو على ما يعالج به من الكي زالت الحمى لا\
    \ محالة، وكثيراً ما يتفق أن ينفجر الورم قبل النضج ويكون ما ينفجر منه دماً فحينئذ\
    \ لا بد له من الفصد ومن استعمال الضمادات الدافعة ومن المشتركات ضماد من هذا الجنس\
    \ على نسخة منسوبة إلى من وصفه وضماد بهذه الصفة من هذا الجنس {cite:canon-ibn-sina-print-v2\
    \ p.365}"
  "en": "When the said signs of gathering appear in the tumours of pleurisy and peripneumonia\
    \ and rise, the duty is to aid the ripening — after cleansing the body — by an\
    \ aid made of poultices and compresses of this kind, and stronger than it, what\
    \ is made with a thing of this kind, which also serves at its end at the bursting.\
    \ Before the bursting time he must lie on the ailing side, for it most helps the\
    \ expectoration and the bursting. If the heat is great, honey-water in barley-water\
    \ is given, or thin honey-water alone; if the heat is not strong and the power\
    \ strong, a decoction of this kind must be given, and the great drinks may be\
    \ needed to ripen it — the fittest time to give it being after complete ripening,\
    \ that it may burst while the innate heat is preserved — and dates are an excellent\
    \ food at this time and after; and a tablet of this kind is for it. As for feeding\
    \ them during the rising: bread soaked in water or in honey-water and the like\
    \ of the thin soft foods, and the thin gruels made of this kind. When the bursting\
    \ time has passed and the ripening is complete, the bursting must be aided — leaving\
    \ it gives the disease difficulty and consequence — and a strong syrup of this\
    \ kind is given with the strong poultices we named; a shaking of the chair while\
    \ he sits on it may benefit, and one man has taken to sufficing himself with it;\
    \ and lying on the healthy side benefits when the bursting is wanted. It has been\
    \ ordered to vomit after the evening meal at such a time — and that is dangerous,\
    \ for it may bring on a great bursting all at once and may choke. If it does not\
    \ burst, cautery is indispensable; then watch: if a clean white matter comes out\
    \ there is hope, else there is not. When the matter has burst and flowed, and\
    \ you guess it to be little or moderate, such as can be cleansed by expectoration\
    \ within forty days, the cleansing washing detergents must be used after it, and\
    \ a thing like a decoction of this kind is given as the expectoration of what\
    \ burst shows, and the said gruels of this kind. As for the single drugs that\
    \ are the mothers of this affair's drugs — they are of this kind — and a measured\
    \ admixture of the stupefying drugs may be needed with them; and among these drugs\
    \ is one of intense benefit in this chapter. These drugs are made into tablets,\
    \ lohochs, liniments and poultices with sponges and oils, and the oil that carries\
    \ their power to the place may be made of this kind according to the state and\
    \ the season. If the fever is strong, do not overdo the warming lest the power\
    \ weaken from the bad temperament and fail at expectoration; hasten to the management\
    \ of drawing the pus out after the bursting into the chest, in the days in which\
    \ the patient fancies his lightness. And if you guess in pleurisy that the matter\
    \ is too abundant to be cleansed within forty days or less — rather casting into\
    \ consumption — a fine cautery is indispensable, with which the chest is pierced\
    \ so the matter is dried and drawn out little by little, and it is washed with\
    \ honey-water and help is given to draw it outward; once cleansed, you turn to\
    \ the agglutinant. The side holding the pus must be known from the faces we mentioned\
    \ — from the pus's sound and sloshing. At such a time the power must be preserved\
    \ with meat and moderate feeding; do not heed the fever, for it is not healed\
    \ while the matter remains — when you cleanse it the fever leaves, and if the\
    \ patient gains the strength to expectorate the matter or to bear the cautery\
    \ it is treated with, the fever necessarily departs. It often happens that the\
    \ tumour bursts before ripeness and what bursts from it is blood — then venesection\
    \ is indispensable, and the use of the repelling poultices, among the common ones\
    \ a poultice of this kind on the copy of him who described it, and a poultice\
    \ of this description of this kind {cite:canon-ibn-sina-print-v2 p.365}"
  "ur": "جب ذات الجنب اور ذات الرئة کے ورموں میں جمع ہونے کی مذکورہ علامات ظاہر ہوں\
    \ اور بڑھیں تو لازم ہے کہ بدن کی تنقیہ کے بعد اسی جنس کے ضمادوں اور کمادوں سے\
    \ پکانے میں مدد دی جائے اور اس سے مضبوط وہ جس میں اسی جنس کی چیز ملائی جائے جو\
    \ تفجير کے وقت بھی اس کے آخر میں کام آتی ہے اور انفجار کے وقت سے پہلے بیمار پہلو\
    \ پر لٹنا چاہیے کیونکہ وہ نفث اور تفجير میں زیادہ مددگار ہے۔ اگر حرارت زیادہ ہو\
    \ تو جو کے پانی میں شہد کا پانی یا اکیلا پتلا شہد کا پانی پلایا جائے اور اگر حرارت\
    \ قوی نہ ہو اور قوت قوی ہو تو اسی جنس کا جوشاندہ پلانا چاہیے اور پکانے کے لیے\
    \ بڑے مشروبات کی ضرورت پڑ سکتی ہے اور اسے پلانے کا بہترین وقت مکمل پکنے کے بعد\
    \ ہے تاکہ فطری حرارت محفوظ رکھتے ہوئے پھٹے اور اس وقت اور بعد میں کھجور بہت اچھی\
    \ غذا ہے اور اس کے لیے اسی جنس کی قرص ہے اور عروج کے دوران ان کی غذا پانی یا شہد\
    \ کے پانی میں بھیگی روٹی اور اس جیسی باریک نرم غذائیں اور اسی جنس کی باریک احساء\
    \ ہیں۔ اور جب انفجار کا وقت گزر جائے اور پکنا مکمل ہو تو انفجار میں مدد کرنی چاہیے\
    \ کیونکہ چھوڑ دینے سے مرض کو دقت اور معنویت ملتی ہے اور مذکورہ مضبوط ضمادوں کے\
    \ ساتھ اسی جنس کا مضبوط شربت پلایا جاتا ہے اور کرسی پر بیٹھے ہوئے اسے ہلانا فائدہ\
    \ دے سکتا ہے اور ایک آدمی نے اسی پر اکتفا کیا اور جب انفجار مطلوب ہو تو صحیح پہلو\
    \ پر لیٹنا فائدہ دیتا ہے اور ایسے وقت میں عشاء کے بعد قے کا حکم دیا گیا ہے اور\
    \ یہ خطرناک ہے کیونکہ اس سے ایک دم بڑا انفجار ہو سکتا ہے اور دم گھٹ سکتا ہے اور\
    \ اگر نہ پھٹے تو داغ ناگزیر ہے پھر دیکھو اگر صاف سفید مادہ نکلے تو امید ورنہ نہیں۔\
    \ اور جب مادہ پھٹ کر بہے اور تم اسے کم یا معتدل گمان کرو اتنا کہ چالیس دن میں\
    \ نفث سے صاف ہو سکے تو اس کے بعد دھونے والی صاف کرنے والی جلائیں استعمال کرنی\
    \ چاہئیں اور جیسا انفجار شدہ نفث ظاہر ہو اسی جنس کے جوشاندہ جیسی چیز پلائی جائے\
    \ اور مذکورہ اسی جنس کی احساء اور وہ مفرد ادویہ جو اس شأن کی ادویہ کی مائیں ہیں\
    \ وہ اسی جنس کی ہیں اور کبھی ان کے ساتھ مقدار میں مخدرات کا کچھ ملانا درکار ہو\
    \ اور ان ادویہ میں ایک ایسا ہے جو اس باب میں بہت مفید ہے اور یہ ادویہ قرص لعوق\
    \ نطول اور اسفنجوں اور تیلوں کے ساتھ ضماد بنائی جاتی ہیں اور وہ تیل جو ان کی قوت\
    \ مقام تک پہنچائے حال اور موسم کے حساب سے اسی جنس کا ہو سکتا ہے اور اگر حمى قوی\
    \ ہو تو تسخین میں زیادتی نہ کرو کہ مزاج کی برائی سے قوت کمزور ہو کر نفث سے عاجز\
    \ آئے اور انفجار کے بعد سینے سے پیپ نکالنے کے تدبیر کی طرف جلدی کرنی چاہیے ان\
    \ دنوں میں جن میں مریض اپنی ہلکاہٹ کا تصور کرے اور اگر ذات الجنب میں گمان ہو کہ\
    \ مادہ اتنا زیادہ ہے کہ چالیس دن یا کم میں صاف نہ ہو بلکہ سل میں ڈالے تو باریک\
    \ مکوا ناگزیر ہے جس سے سینہ سوراخ کیا جائے تاکہ مادہ خشک ہو اور تھوڑا تھوڑا خارج\
    \ ہو اور شہد کے پانی سے دھویا جائے اور باہر کھینچنے میں مدد دی جائے جب صاف ہو\
    \ جائے تو ملحم کی طرف آؤ اور جس طرف پیپ ہو اسے مذکورہ وجوہ سے پیپ کی آواز اور\
    \ خضخضاہٹ سے پہچاننا چاہیے اور ایسے وقت میں گوشت اور معتدل غذا سے قوت سنبھالنا\
    \ ضروری ہے اور حمى کی طرف متوجہ نہ ہو کیونکہ جب تک مادہ باقی ہے وہ شفا نہیں پاتی\
    \ اور جب صاف کر دو تو رخصت ہو جاتی ہے اور اگر مریض مادہ نفث کرنے یا داغ برداشت\
    \ کرنے پر قادر ہو جائے تو حمى لازماً چلی جاتی ہے اور اکثر ایسا ہوتا ہے کہ ورم\
    \ پکنے سے پہلے پھٹ جائے اور جو پھٹا وہ خون ہو تو اس وقت فصد اور دفع کرنے والے\
    \ ضماد ضروری ہیں اور مشترک میں بیان کرنے والے کی نسخہ پر اسی جنس کا ضماد اور اسی\
    \ صفت کا اسی جنس کا ضماد ہے {cite:canon-ibn-sina-print-v2 p.365}"
  "es": "Cuando aparecen dichos signos de acumulación en los tumores de pleuresía y perineumonía y aumentan, el deber es ayudar a la ruptura —después de limpiar el cuerpo— con un remedio hecho de cataplasmas y tabletas de este tipo, y más fuerte aún, lo hecho con una cosa de este tipo, que también sirve en su extremo en el momento de la ruptura. Antes del momento de la ruptura debe acostarse sobre el lado enfermo, ya que esto ayuda más a la expectoración y a la ruptura. Si el calor es fuerte, se da agua de miel en agua de cebada, o solo agua de miel diluida; si el calor no es fuerte y la fuerza fuerte, debe darse una decocción de este tipo, y puede que se necesiten bebidas grandes para madurar —el momento más apropiado para darlo es después de la ruptura completa, para que pueda romperse mientras se conserva el calor innato— y los dátiles son un alimento excelente en este momento y después; y una tableta de este tipo es para ello. En cuanto a alimentarlos durante la fermentación: pan remojado en agua o en agua con miel y alimentos blandos similares, y gachas ligeras hechas de este tipo. Cuando haya pasado el tiempo de reventado y la maduración esté completa, se debe ayudar a que reviente —dejarlo causa dificultad y consecuencias para la enfermedad— y se administra un jarabe fuerte de este tipo con los polvos fuertes que mencionamos; sacudir la silla mientras está sentado en ella puede ser beneficioso, y un hombre ha optado por conformarse con ello; y acostarse sobre el lado sano es beneficioso cuando se necesita que reviente. Se le ha ordenado vomitar después de la cena en ese momento —y eso es peligroso, pues puede provocar un gran reventón de repente y puede asfixiarse. Si no revienta, la cauterización es esencial; luego observe: si sale una materia blanca limpia hay esperanza, de lo contrario no la hay. Cuando la materia ha reventado y fluido, y usted supone que es poca o moderada, de tal manera que se puede limpiar mediante expectoración dentro de cuarenta días, se deben usar detergentes de limpieza después de eso, y algo como una decocción de este tipo se da como expectoración de lo que reventado muestra, y dichos purés de este tipo. En cuanto a los medicamentos individuales que son las madres de los medicamentos de este asunto, son de este tipo, y puede ser necesaria una mezcla medida de medicamentos estupefacientes con ellos; y entre estos medicamentos hay uno de intenso beneficio en este capítulo. Estos medicamentos se hacen en tabletas, lohochs, linimentos y cataplasmas con esponjas y aceites, y el aceite que lleva su poder al lugar puede hacerse de este tipo según el estado y la estación. Si la fiebre es fuerte, no exagere con el calentamiento ya que debilita el poder del mal temperamento y falla en la expectoración; Apresúrese a extraer el pus después de que se rompa en el pecho, en los días en que el paciente se sienta ligero. Y si sospecha que en la pleuresía la materia es demasiado abundante para limpiarse en cuarenta días o menos —más bien para convertirse en tisis—, es indispensable un cauterio fino, con el que se perfora el pecho para que la materia se seque y se extraiga poco a poco, y se lava con agua con miel y se le da ayuda para extraerla; una vez limpia, pase al aglutinante. El lado que contiene el pus debe saberse por los rostros que mencionamos: por el sonido y el chapoteo del pus. En ese momento, debe conservar la fuerza con carne y alimentación moderada; no preste atención a la fiebre, pues no se cura mientras la materia permanezca; cuando se limpia, la fiebre desaparece, y si el paciente adquiere la fuerza para expectorar la materia o para soportar el cauterio con el que se trata, la fiebre necesariamente desaparece. A menudo sucede que el tumor revienta antes de madurar y lo que brota de él es sangre; entonces la venopunción es indispensable, y el uso de cataplasmas repelentes, entre las más comunes una cataplasma de este tipo sobre la copia de quien la describió, y una cataplasma de esta descripción de este tipo {cite:canon-ibn-sina-print-v2 p.365}"
  "fr": "Lorsque les signes de formation des tumeurs de la pleurésie et de la péripneumonie apparaissent et s'aggravent, il convient de favoriser leur maturation, après avoir purifié le corps, à l'aide de cataplasmes et de compresses de ce type, et plus encore, de cataplasmes préparés avec une substance similaire, qui sert également à l'éclatement. Avant l'éclatement, il faut se coucher sur le côté atteint, car cela facilite grandement l'expectoration et l'éclatement. Si la chaleur est intense, on administre de l'eau miellée diluée dans de l'eau d'orge, ou simplement de l'eau miellée diluée. Si la chaleur est modérée et la puissance élevée, une décoction de ce type est nécessaire, et de grandes quantités de boissons peuvent être requises pour la maturation. Le moment le plus propice pour administrer ce traitement est après la maturation complète, afin que la tumeur puisse éclater tout en préservant sa chaleur interne. Les dattes constituent un excellent aliment à ce moment-là et par la suite, et un comprimé de ce type est indiqué. Pour les nourrir pendant la levée: du pain trempé dans l’eau ou dans de l’eau miellée, ainsi que des aliments mous et légers, et des bouillies claires préparées de la même manière. Une fois la période d’éclatement passée et la maturation terminée, il faut favoriser l’éclatement – le laisser se produire aggrave la maladie – et un sirop concentré de ce type est administré avec les cataplasmes puissants mentionnés précédemment; secouer la chaise pendant qu’il est assis peut être bénéfique, et un patient s’en est même servi pour se nourrir; et se coucher sur le côté sain est utile lorsque l’éclatement est nécessaire. Il a été prescrit de vomir après le repas du soir à un moment précis – ce qui est dangereux, car cela peut provoquer un éclatement brutal et un étouffement. Si l’éclatement ne se produit pas, la cautérisation est indispensable; ensuite, il faut observer: si une substance blanche et propre sort, il y a de l’espoir, sinon il n’y en a pas. Lorsque la matière a éclaté et s'est écoulée, et que vous estimez qu'il s'agit d'une petite quantité ou d'une quantité modérée, susceptible d'être éliminée par expectoration en quarante jours, il faut ensuite utiliser des détergents purifiants, et administrer une décoction de ce type pour favoriser l'expectoration du liquide exsudatif, ainsi que des bouillies de ce type. Quant aux plantes médicinales qui constituent la base de ces remèdes, elles sont de ce type, et un mélange dosé de plantes stupéfiantes peut être nécessaire; parmi ces plantes, l'une est particulièrement bénéfique dans ce chapitre. Ces plantes sont transformées en comprimés, en cataplasmes, en liniments et en cataplasmes avec des éponges et des huiles, et l'huile qui véhicule leur pouvoir actif peut être préparée de ce type selon l'état et la saison. Si la fièvre est forte, il ne faut pas trop réchauffer le patient, de peur qu'il ne s'affaiblisse en raison de son mauvais tempérament et ne parvienne pas à expectorer; il faut s'empresser de drainer le pus après l'éclatement dans la poitrine, pendant les jours où le patient se sent mieux. Si, en cas de pleurésie, vous soupçonnez que la matière est trop abondante pour être éliminée en quarante jours ou moins – risquant plutôt de dégénérer en tuberculose –, une cautérisation fine est indispensable. On perce la poitrine avec ce bistouri afin de sécher la matière et de l'extraire progressivement. On la lave ensuite avec de l'eau miellée et on aide le patient à l'évacuer. Une fois la pleurésie éliminée, on s'attaque à l'agglutinant. Le côté où se trouve le pus doit être identifié grâce aux signes mentionnés précédemment, au bruit et au clapotis du pus. À ce stade, il faut maintenir les forces du patient par une alimentation riche en viande et modérée. Il ne faut pas s'inquiéter de la fièvre, car la maladie ne guérit pas tant que la matière persiste. Une fois la pleurésie éliminée, la fièvre disparaît, et si le patient a la force d'expectorer la matière ou de supporter la cautérisation, la fièvre finit nécessairement par tomber. Il arrive souvent que la tumeur éclate avant maturité et que ce qui en jaillit soit du sang; alors la saignée est indispensable, ainsi que l'usage de cataplasmes répulsifs, parmi lesquels un cataplasme de ce type décrit dans la copie de celui qui l'a décrit, et un cataplasme de cette description de ce type {cite:canon-ibn-sina-print-v2 p.365}"
  "tr": "Çoğul ve zatürre belirtileri ortaya çıkarsa ve birleşik belirtiler ortaya çıkar ve artarsa, arınma sonrası vücudun olgunlaşmasına yardımcı olmak zorundadır; bu tür bandajlar ve kompresler gibi, bu tür bandajlar ve kompresler içerir, ayrıca patlama sırasında da uygundur. Patlamadan önce zayıf tarafa uzanmalıdır, çünkü bu üfleme ve patlatma işlemlerine yardımcı olur. Sıcaklık yüksekse, su balı arpa suyu veya sadece ince bal suyu serpilmelidir, sıcaklık olsa bile Güçlü değildir ama gücü güçlüdür, bu yüzden bu tür bir aşçı tarafından sulanmalı ve belki de olgunlaşması için böyle harika içecekler gereklidir. Tam olgunlaştıktan sonra sulamanın en iyi zamanları içgüdüsel olarak korunmaktır ve hurmalar bu saatte ve sonrasında çok iyidir, ayrıca bu tür bir tutam da hurmadır. Onları beslerken beslemek ise, suya veya bal suyuna batırılmış ekmek ve benzeri hassas yiyecekler ve bu türden yapılan narin yiyeceklerdir. Patlama süresi geçmiş ve olgunlaşmışsa, patlamadan muzdarip kalmak gerekir, çünkü patlamadan ayrılmak hastalık, zorluk ve zorluklara yol açar. Bu tür güçlü içecekleri ve bahsettiğimiz güçlü bandajlarla birlikte vermelidir. Birisi sandalyeyi alırken otururken sallamak faydalı olabilir ve patlama amaçlanıyorsa sağ tarafa uzanmak için kullanılabilir. Böyle bir zamanda Isha'dan sonra kusması emredilmiştir, bu tehlikelidir çünkü aynı anda büyük bir patlamaya veya boğulmaya yol açabilir. Patlamazsa, koterize edilmeli ve sonra incelenmelidir; eğer tamamen beyaz bir nokta çıkarsa umut vericidir; aksi takdirde sallanmaz. Eğer periyot patladıysa, damladıysa ve kısa ya da orta derecede hissediliyorsa ve kırk güne kadar üfleyerek arıtılabilirse, temizleyici çamaşır makinesi kullanılmalı ve patlayan şeyin üflenmesi, göründüğü gibi, benzer bir karışım ile bu tür al-Ahsa ile sulandırılmalıdır. Bu amaçla başlıca ilaç olan bireysel ilaçlar ise bu türdendir ve bazı uyuşturucuların da bunlarla bir ölçüde karıştırılması gerekebilir. Bu ilaçlar arasında bu açıdan çok faydalı olanlar ve bu ilaçlar da vardır Yalar ve süngerler ile merhemlerle engeller, yamalar ve bandajlar haline gelir. Duruma ve zamana bağlı olarak bu türden kaynaklanmış olabilir. Ateş şiddetliyse, aşırı ısınmayın, çünkü kötü ruh hali nedeniyle güç zayıflar ve atılmayı engeller. Göğse çıkan irin çıkışından sonra ve hasta kişinin hafif olduğunu düşündüğünde irin atılmasını hemen kontrol etmelisiniz. Ancak, maddenin aşırı olduğunu ve kırk gün veya daha kısa sürede çıkarılamayacağını düşünüyorsanız, tüberküloza yol açıyorsa, Göğsü delip kurutmak için ince bir demirle ütülenmek, yavaş yavaş çıkarmak, bal suyu ile yıkanmak ve dışarı çekilmesi gerekir. Arıtılmışsa, lehimleme demirine yönelin. İtirün olduğu bölge, bahsedilen yüzeylerden irin sesi ve titremesiyle ayırt edilmelidir. Bu zamanlarda, et ve ılımlı yiyeceklerle gücü korumak ve ateşe dikkat etmemek gerekir, çünkü ateş süre boyunca iyileşmez. Arıtılırsa atılır. Hasta kişi süre boyunca üfleyecek kadar güçlüyse, Ateşi kaçınılmaz olarak çözen koterizasyon ile tedavi edilir. Tümörün olgunlaşmadan önce patladığı ve kan olduğu kabul edilir; bu durumda flebittir ve itici pansumanlar yaygındır. Bu cinsin bir pansumanı, onu tanımlayan kişiye atfedilen bir kopyadır ve bu cinsin bu tanımını içeren bir pansuman {cite:canon-ibn-sina-print-v2 s.365}"
  "id": "Jika tanda-tanda jamak dan pneumonia muncul serta tanda-tanda gabungan muncul dan meningkat, wajib membantu tubuh matang setelah pemurnian, dengan bantuan seperti perban dan kompres jenis ini, yang lebih kuat daripada yang mengandung beberapa jenis ini, dan juga cocok pada akhir saat ledakan. Harus berbaring di sisi lemah sebelum ledakan, karena membantu meniup dan meledak. Jika suhu tinggi, madu air harus ditaburi dengan air jelai atau hanya air madu halus, meskipun suhunya Kurma ini tidak kuat, tetapi kuatnya kuat, jadi harus disiram oleh juru masak seperti ini, dan mungkin minuman yang sangat baik diperlukan untuk matang. Waktu terbaik untuk menyiramnya setelah matang penuh adalah dengan mengawetkan secara naluriah, dan kurma sangat baik pada waktu ini dan sesudahnya, serta sejumput semacam itu. Untuk memberi makan saat tumbuh, itu adalah roti yang direndam dalam air atau air madu dan makanan halus serta makanan halus yang dibuat dari jenis ini. Jika waktu ledakan telah berlalu dan sudah matang, seseorang harus menanggung ledakan, karena meninggalkannya menyebabkan kesulitan dan kesulitan penyakit. Dia harus memberikan minuman keras jenis ini dengan perban kuat yang telah kami sebutkan. Mungkin bermanfaat untuk menggoyangkan kursi sambil duduk di atasnya sementara seseorang mengambilnya dan dapat digunakan untuk berbaring di sisi kanan jika ledakan dimaksudkan. Dia diperintahkan untuk muntah setelah Isha pada waktu seperti itu, yang berbahaya karena dapat menyebabkan ledakan besar sekaligus atau mungkin sesak napas. Jika tidak meledak, harus dikauterisasi dan kemudian diperiksa, dan jika keluar dengan warna putih murni, itu adalah harapan; jika tidak, tidak akan diguncang. Jika periode meledak, menetes, dan terasa kecil atau sedang, dan dapat dimurnikan dengan meniup hingga empat puluh hari, maka mesin cuci harus digunakan, dan tiupan yang meledak harus disiram, seperti yang terlihat, dengan campuran serupa dari jenis ini dan al-Ahsa yang disebutkan. Adapun obat individu yang menjadi obat utama untuk tujuan ini, mereka adalah jenis ini, dan mungkin perlu dicampur beberapa narkotika dengan obat tersebut sampai tingkat tertentu. Di antara obat-obatan ini ada beberapa yang sangat bermanfaat dalam hal ini, dan obat-obatan ini Demam ini menjilat, dan menjadi penghalang, tambalan, dan perban dengan spons dan salep. Kemungkinan lemak yang ditransfer ke nanah berasal dari jenis ini tergantung pada situasi dan waktu. Jika demam parah, jangan terlalu panas, karena kekuatan nanah melemah akibat suasana hati buruk dan mencegah keluar. Anda harus segera mengelola pengeluaran nanah setelah ledakan ke dada dan pada hari-hari ketika orang sakit mengira nanah ringan. Namun, jika Anda merasa di sisi yang sama bahwa zat tersebut berlebihan dan tidak dapat diekstraksi dalam waktu empat puluh hari atau kurang, melainkan menyebabkan tuberkulosis, maka Perlu disetrika dengan setrika halus untuk menusuk dada agar durasinya kering, ekstrak sedikit demi sedikit, cuci dengan air madu, dan bantu keluarkan. Jika sudah dimurnikan, gunakan alat penyolder. Area tempat nanah terbentuk harus dikenali dari permukaan yang disebutkan melalui suara dan getaran nanah. Pada saat seperti itu, perlu menjaga kekuatan dengan daging dan makanan sedang, dan tidak memperhatikan demam, karena tidak sembuh selama menstruasi berlangsung. Jika dimurnikan, nanah akan dikeluarkan. Jika orang sakit cukup kuat untuk meniup selama durasi nanah, Obat ini diobati dengan kauterisasi yang pasti menghilangkan demam. Sering disepakati bahwa tumor pecah sebelum matang dan ternyata adalah darah, dalam hal ini pasti flebitis, dan penggunaan perban menolak adalah hal yang umum. Perban dari genus ini adalah salinan yang dikaitkan dengan orang yang mendeskripsikannya, dan perban dengan deskripsi genus ini {cite:canon-ibn-sina-print-v2 hlm.365}"
