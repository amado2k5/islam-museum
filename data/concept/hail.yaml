summary:
  ar: "الحائل الحاجز، ويستعمل في الفقه للحاجز بين المصلي والمار كالعصا أو تسنيم التراب، وهو السترة. وتعرض الموسوعة أثر الحائل في الوضوء والغسل ومس المصحف، وفي الاقتداء إذا حال بين الإمام والمأموم نهر أو طريق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6696} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6697} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6698} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6700}"
  en: "A hail is a barrier. In fiqh the word is used for a screen between the worshipper and one who passes in front, such as a staff or a heap of earth, which is called a sutra. The entry also covers the effect of a barrier on ablution, bathing and touching the Qur'an, and whether a river or a road between the imam and the follower prevents following him in prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6696} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6697} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6698} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6700}"
  ur: "حائل یعنی رکاوٹ۔ نماز میں نمازی اور گزرنے والے کے درمیان آڑ کو سترہ کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6697} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6700}"
