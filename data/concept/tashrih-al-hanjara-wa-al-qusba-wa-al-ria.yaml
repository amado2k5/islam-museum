class: concept
kind: scientific
label:
  ar: "تشريح الحنجرة والقصبة والرئة"
  en: "The anatomy of the larynx, the windpipe and the lung"
  ur: "حنجرے، قصبۂ اور پھیپھڑے کی تشریح"
summary:
  ar: "قصبة الرئة عضو مؤلف من غضاريف كثيرة دوائر يصل بعضها على بعض، وما لاقى منها منفذ الطعام جعل ناقصاً قريباً من نصف دائرة لئلا يزاحم اللقمة النافذة، والتفت الغضاريف برباطات يجللها غشاء، وينقسم طرفها الأسفل إلى قسمين ثم إلى شعب تجري في الرئة مجاورة لشعب العروق وتنتهي إلى فوهات أضيق من فوهات ما يشاكلها لينفذ النسيم ولا ينفذ الدم، وخلقت من غضروف ليوجد فيها الانتفاخ ولا يلجئها اللين إلى الانطباق ولتكون صلابتها واقية وسبباً لحدوث الصوت، وخلق للتصويت ما يسمى لسان المزمار فيتضايق عنده طرف القصبة ثم يتسع عند الحنجرة ثم إلى فضاء واسع كما في المزمار، والحنجرة آلة لتمام الصوت ولتحبس النفس وهي مشدودة مع القصبة بالمريء فإذا مال المريء للازدراد انطبقت وارتفعت والتصق فم القصبة والحنجرة بالحنك فلا يسقط إلى القصبة من الطعام شيء، والرئة مؤلفة من شعب القصبة وشعب الشريان الوريدي وشعب الوريد الشرياني يجمعها لحم رخو متخلخل هوائي خلق من أرق الدم، وهي ذات قسمين الأيسر ذو شعبتين والأيمن ذو ثلاث شعب، ومنفعتها بالجملة الاستنشاق إعداداً لهواء للقلب أكثر من المحتاج إليه في نبضة واحدة {cite:canon-ibn-sina-print-v2 p.301}"
  en: "The lung's windpipe is an organ made of many round cartilages joined one to another; the part facing the food-passage behind it, the oesophagus, is made incomplete — near half a circle — so as not to crowd the passing morsel. The cartilages are wrapped by ligatures clothed in a membrane, and a smooth inner lining, hardened somewhat against dryness, runs over it within and without; the lower end splits into two, then into branches running through the lung beside the branches of the vessels, ending in mouths far narrower than the mouths of what matches them, so that the breeze may pass and the nourishing blood may not — else blood-spitting would occur. It was made of cartilage so that swelling would persist in it and softness would not force it shut, so that its hardness would guard it lying in front, and so that hardness would be a cause, or a helper, of the arising of voice. For voice there was made what is called the reed-tongue: the windpipe's end narrows at it, then widens at the larynx, then opens into a broad space as in a reed-pipe, for voice cannot be without the narrowing of its chamber. The larynx is the instrument completing the voice and holding the breath; it is bound with the windpipe by the oesophagus, so that when the oesophagus dips to swallow, the larynx closes and rises and the mouth of windpipe and larynx cleaves to the palate, letting food and drink pass with nothing falling in — and what does slip the nature keeps expelling by coughing. The lung is made of the windpipe's branches, the arterial vein's branches and the venous artery's branches, gathered by a loose airy spongy flesh created of the thinnest and subtlest blood — which is also its nourishment; it has two parts, the left of two lobes and the right of three, the fifth lobe on the right being a bedding for the vessel called the hollow; and its benefit in sum is inhalation — the preparing for the heart of air beyond what one beat needs {cite:canon-ibn-sina-print-v2 p.301}"
  ur: "پھیپھڑے کی قصبہ ایسا عضو ہے جو بہت سے گول گضروفوں سے بنا ہے جو ایک دوسرے سے ملے ہیں؛ جس حصے کا سامنا پیچھے خوراک کے راستے یعنی مریء سے ہے وہ ادھورا یعنی نصف دائرے کے قریب بنایا گیا تاکہ گزرنے والے نوالے کی رکاوٹ نہ بنے؛ گضروفے رباطوں میں لپٹے ہیں جن پر غشاء ہے اور اندر و باہر ہموار غشائی تہہ چلی ہے؛ نچلا سرا دو حصوں میں پھر شاخوں میں تقسیم ہو کر پھیپھڑے میں عروق کی شاخوں کے ساتھ چلتا ہے اور ایسے منہوں پر ختم ہوتا ہے جو مماثلت رکھنے والوں سے بہت تنگ ہیں تاکہ ہوا نفوذ کرے اور غذائی خون نہ کرے ورنہ خون تھوکنا ہوتا؛ اسے گضروف سے اس لیے بنایا گیا کہ اس میں پھولاؤ برقرار رہے اور نرمی اسے بند نہ کر دے اور اس کی سختی اس کی حفاظت کرے اور آواز کے پیدا ہونے کا سبب یا مددگار بنے؛ آواز کے لیے لسان المزمار کہلانے والی چیز بنائی گئی جہاں قصبہ کا سرا تنگ ہوتا ہے پھر حنجرے پر کھلتا ہے پھر وسیع فضا میں جیسے بانسری میں؛ حنجرہ آواز کو مکمل کرنے اور نفس کو روکنے کا اوزار ہے اور قصبہ کے ساتھ مریء سے بندھا ہے؛ پھیپھڑا قصبہ کی شاخوں شریان وریدی کی شاخوں اور ورید شریانی کی شاخوں سے بنا ہے جسے نرم متخلخل ہوائی گوشت جو سب سے لطیف خون سے خلقا گیا سمیٹتی ہے؛ اس کے دو حصے ہیں بایاں دو شعبوں والا اور دایاں تین شعبوں والا؛ اور اس کا نفع بالجملہ دم کشید ہے — دل کے لیے ایک دھڑکن سے زیادہ ضرورت کی ہوا تیار رکھنا {cite:canon-ibn-sina-print-v2 p.301}"
