label:
  ar: "تشريح الحنجرة والقصبة والرئة"
  en: "The anatomy of the larynx, the windpipe and the lung"
  ur: "حنجرے، قصبۂ اور پھیپھڑے کی تشریح"
  es: "Anatomía de la laringe, la tráquea y el pulmón."
  fr: "Anatomie du larynx, de la trachée et du poumon"
summary:
  ar: "قصبة الرئة عضو مؤلف من غضاريف كثيرة دوائر يصل بعضها على بعض، وما لاقى منها منفذ الطعام جعل ناقصاً قريباً من نصف دائرة لئلا يزاحم اللقمة النافذة، والتفت الغضاريف برباطات يجللها غشاء، وينقسم طرفها الأسفل إلى قسمين ثم إلى شعب تجري في الرئة مجاورة لشعب العروق وتنتهي إلى فوهات أضيق من فوهات ما يشاكلها لينفذ النسيم ولا ينفذ الدم، وخلقت من غضروف ليوجد فيها الانتفاخ ولا يلجئها اللين إلى الانطباق ولتكون صلابتها واقية وسبباً لحدوث الصوت، وخلق للتصويت ما يسمى لسان المزمار فيتضايق عنده طرف القصبة ثم يتسع عند الحنجرة ثم إلى فضاء واسع كما في المزمار، والحنجرة آلة لتمام الصوت ولتحبس النفس وهي مشدودة مع القصبة بالمريء فإذا مال المريء للازدراد انطبقت وارتفعت والتصق فم القصبة والحنجرة بالحنك فلا يسقط إلى القصبة من الطعام شيء، والرئة مؤلفة من شعب القصبة وشعب الشريان الوريدي وشعب الوريد الشرياني يجمعها لحم رخو متخلخل هوائي خلق من أرق الدم، وهي ذات قسمين الأيسر ذو شعبتين والأيمن ذو ثلاث شعب، ومنفعتها بالجملة الاستنشاق إعداداً لهواء للقلب أكثر من المحتاج إليه في نبضة واحدة {cite:canon-ibn-sina-print-v2 p.301}"
  en: "The lung's windpipe is an organ made of many round cartilages joined one to another; the part facing the food-passage behind it, the oesophagus, is made incomplete — near half a circle — so as not to crowd the passing morsel. The cartilages are wrapped by ligatures clothed in a membrane, and a smooth inner lining, hardened somewhat against dryness, runs over it within and without; the lower end splits into two, then into branches running through the lung beside the branches of the vessels, ending in mouths far narrower than the mouths of what matches them, so that the breeze may pass and the nourishing blood may not — else blood-spitting would occur. It was made of cartilage so that swelling would persist in it and softness would not force it shut, so that its hardness would guard it lying in front, and so that hardness would be a cause, or a helper, of the arising of voice. For voice there was made what is called the reed-tongue: the windpipe's end narrows at it, then widens at the larynx, then opens into a broad space as in a reed-pipe, for voice cannot be without the narrowing of its chamber. The larynx is the instrument completing the voice and holding the breath; it is bound with the windpipe by the oesophagus, so that when the oesophagus dips to swallow, the larynx closes and rises and the mouth of windpipe and larynx cleaves to the palate, letting food and drink pass with nothing falling in — and what does slip the nature keeps expelling by coughing. The lung is made of the windpipe's branches, the arterial vein's branches and the venous artery's branches, gathered by a loose airy spongy flesh created of the thinnest and subtlest blood — which is also its nourishment; it has two parts, the left of two lobes and the right of three, the fifth lobe on the right being a bedding for the vessel called the hollow; and its benefit in sum is inhalation — the preparing for the heart of air beyond what one beat needs {cite:canon-ibn-sina-print-v2 p.301}"
  ur: "پھیپھڑے کی قصبہ ایسا عضو ہے جو بہت سے گول گضروفوں سے بنا ہے جو ایک دوسرے سے ملے ہیں؛ جس حصے کا سامنا پیچھے خوراک کے راستے یعنی مریء سے ہے وہ ادھورا یعنی نصف دائرے کے قریب بنایا گیا تاکہ گزرنے والے نوالے کی رکاوٹ نہ بنے؛ گضروفے رباطوں میں لپٹے ہیں جن پر غشاء ہے اور اندر و باہر ہموار غشائی تہہ چلی ہے؛ نچلا سرا دو حصوں میں پھر شاخوں میں تقسیم ہو کر پھیپھڑے میں عروق کی شاخوں کے ساتھ چلتا ہے اور ایسے منہوں پر ختم ہوتا ہے جو مماثلت رکھنے والوں سے بہت تنگ ہیں تاکہ ہوا نفوذ کرے اور غذائی خون نہ کرے ورنہ خون تھوکنا ہوتا؛ اسے گضروف سے اس لیے بنایا گیا کہ اس میں پھولاؤ برقرار رہے اور نرمی اسے بند نہ کر دے اور اس کی سختی اس کی حفاظت کرے اور آواز کے پیدا ہونے کا سبب یا مددگار بنے؛ آواز کے لیے لسان المزمار کہلانے والی چیز بنائی گئی جہاں قصبہ کا سرا تنگ ہوتا ہے پھر حنجرے پر کھلتا ہے پھر وسیع فضا میں جیسے بانسری میں؛ حنجرہ آواز کو مکمل کرنے اور نفس کو روکنے کا اوزار ہے اور قصبہ کے ساتھ مریء سے بندھا ہے؛ پھیپھڑا قصبہ کی شاخوں شریان وریدی کی شاخوں اور ورید شریانی کی شاخوں سے بنا ہے جسے نرم متخلخل ہوائی گوشت جو سب سے لطیف خون سے خلقا گیا سمیٹتی ہے؛ اس کے دو حصے ہیں بایاں دو شعبوں والا اور دایاں تین شعبوں والا؛ اور اس کا نفع بالجملہ دم کشید ہے — دل کے لیے ایک دھڑکن سے زیادہ ضرورت کی ہوا تیار رکھنا {cite:canon-ibn-sina-print-v2 p.301}"
  es: "La tráquea es un órgano formado por numerosos cartílagos redondos unidos entre sí; la parte que da al esófago, el conducto alimentario, es incompleta —casi semicircular— para no obstruir el paso del alimento. Los cartílagos están envueltos por ligaduras revestidas de una membrana, y un revestimiento interno liso, ligeramente endurecido para protegerlo de la sequedad, lo recubre tanto por dentro como por fuera. El extremo inferior se divide en dos, y luego en ramificaciones que recorren el pulmón junto a las ramas de los vasos sanguíneos, terminando en bocas mucho más estrechas que las de sus contrapartes, de modo que el aire pueda pasar pero la sangre no, pues de lo contrario se produciría la hemorragia. Su estructura cartilaginosa permite que la hinchazón persista y que la blandura no la cierre, que su dureza la proteja en su parte frontal y que, además, facilite la aparición de la voz. Para la voz se creó lo que se llama la lengua de caña: el extremo de la tráquea se estrecha en ella, luego se ensancha en la laringe, luego se abre en un espacio amplio como en una flauta de caña, pues la voz no puede existir sin el estrechamiento de su cámara. La laringe es el instrumento que completa la voz y contiene la respiración; está unida a la tráquea por el esófago, de modo que cuando el esófago desciende para tragar, la laringe se cierra y se eleva, y la boca de la tráquea y la laringe se adhiere al paladar, permitiendo que los alimentos y las bebidas pasen sin que nada caiga dentro, y lo que se escapa, la naturaleza lo sigue expulsando mediante la tos. El pulmón está formado por las ramas de la tráquea, las ramas de la vena arterial y las ramas de la arteria venosa, reunidas por una carne esponjosa y aireada creada de la sangre más fina y sutil, que también es su alimento; Tiene dos partes, la izquierda con dos lóbulos y la derecha con tres, siendo el quinto lóbulo de la derecha un lecho para el vaso llamado hueco; y su beneficio en resumen es la inhalación: la preparación del corazón con aire más allá de lo que necesita un latido {cite:canon-ibn-sina-print-v2 p.301}"
  fr: "La trachée est un organe composé de nombreux cartilages ronds unis entre eux. La partie faisant face au passage des aliments, l'œsophage, est incomplète – presque un demi-cercle – afin de ne pas gêner le passage des aliments. Les cartilages sont enveloppés par des ligaments recouverts d'une membrane, et une muqueuse lisse, légèrement durcie pour résister à la sécheresse, la tapisse à l'intérieur comme à l'extérieur. L'extrémité inférieure se divise en deux, puis en branches qui parcourent le poumon le long des branches des vaisseaux, se terminant par des orifices beaucoup plus étroits que ceux des vaisseaux homologues, permettant ainsi le passage du souffle et l'obstruction du sang – sans quoi des crachats de sang se produiraient. La trachée est faite de cartilage afin que le gonflement persiste et que le ramollissement ne la fasse pas se fermer, que sa dureté la protège lorsqu'elle est allongée devant, et que cette dureté soit une cause, ou un facteur favorisant, l'émission de la voix. Pour la voix, on a créé ce qu'on appelle la langue de roseau: l'extrémité de la trachée se rétrécit à ce niveau, puis s'élargit au larynx, avant de s'ouvrir sur un large espace comme dans un tuyau de roseau, car la voix ne peut exister sans le rétrécissement de sa cavité. Le larynx est l'instrument qui complète la voix et retient le souffle; il est relié à la trachée par l'œsophage, de sorte que lorsque l'œsophage se baisse pour avaler, le larynx se ferme et remonte, et l'embouchure de la trachée et du larynx se joint au palais, laissant passer les aliments et les boissons sans que rien ne tombe à l'intérieur – et ce qui pourrait passer est expulsé par la toux. Le poumon est constitué des branches de la trachée, des branches des veines artérielles et des branches des artères veineuses, rassemblées par une chair lâche, aérée et spongieuse, formée du sang le plus fin et le plus subtil – qui est aussi sa nourriture. Il comporte deux parties: la gauche, composée de deux lobes, et la droite, de trois. Le cinquième lobe de droite sert de support au vaisseau appelé cavité; son principal avantage est l’inspiration, c’est-à-dire la préparation du cœur à un apport d’air supérieur à celui nécessaire pour un battement. {cite:canon-ibn-sina-print-v2 p.301}"
