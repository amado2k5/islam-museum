id: concept/zij-sabi-declination-of-an-ecliptic-degree
class: concept
kind: scientific
label: { ar: "ميل درجة من فلك البروج بالأوتار في الزيج الصابي", en: "The declination of an ecliptic degree by chords", ur: "فلک البروج کے ایک درجے کا میل اوتار سے", es: "La declinación de un grado de la eclíptica mediante cuerdas", fr: "La déclinaison d'un degré écliptique par cordes" }
summary:
  ar: "يعلّم البتاني حساب ميل أي درجة من فلك البروج عن معدل النهار: يؤخذ وتر الدرج من أول الحمل إلى الدرجة المطلوبة إلى تمام التسعين، ويضرب في وتر الميل كله، ويقسم الحاصل على نصف القطر وهو ستون، ويقوّس الخارج من الجدول، فتكون القوس ميل تلك الدرجة عن معدل النهار في فلك نصف النهار. {cite:zij-sabi-nallino-byblion pp.22-23}."
  en: "Al-Battani teaches how to compute the declination of any degree of the zodiac from the equator of the day: take the chord of the degrees from the start of Aries to the wanted degree, within ninety, multiply it by the chord of the whole obliquity, divide the product by the radius, sixty, and find the arc of the quotient from the table; that arc is the declination of that degree from the equator in the meridian. {cite:zij-sabi-nallino-byblion pp.22-23}."
  ur: "البتانی فلک البروج کے کسی بھی درجے کا معدل النہار سے میل نکالنا سکھاتے ہیں: حمل کے آغاز سے مطلوبہ درجے تک کے، نوے کے اندر، درجوں کا وتر لیں، اسے پورے میل کے وتر سے ضرب دیں، حاصل کو نصف قطر، جو ساٹھ ہے، پر تقسیم کریں اور خارج کی قوس جدول سے نکالیں؛ وہ قوس اس درجے کا معدل النہار سے نصف النہار میں میل ہے۔ {cite:zij-sabi-nallino-byblion pp.22-23}۔"
  es: "Al-Battani enseña cómo calcular la declinación de cualquier grado del zodíaco desde el ecuador del día: se toma la cuerda de los grados desde el inicio de Aries hasta el grado deseado, con una precisión de noventa grados, se multiplica por la cuerda de toda la oblicuidad, se divide el producto por el radio, sesenta grados, y se halla el arco del cociente en la tabla; ese arco es la declinación de ese grado desde el ecuador en el meridiano. {cite:zij-sabi-nallino-byblion pp.22-23}."
  fr: "Al-Battani explique comment calculer la déclinaison de n'importe quel degré du zodiaque par rapport à l'équateur: prendre la corde des degrés allant du début du Bélier au degré recherché, à 90 degrés près, la multiplier par la corde de l'obliquité totale, diviser le produit par le rayon, soit 60, et trouver l'arc du quotient dans le tableau; cet arc représente la déclinaison de ce degré par rapport à l'équateur au méridien. {cite:zij-sabi-nallino-byblion pp.22-23}."
