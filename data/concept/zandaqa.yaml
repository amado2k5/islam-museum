label: { ar: "الزندقة", en: "Zandaqa (heresy)", es: "Zandaqa (herejía)", fr: "Zandaqa (hérésie)", ur: "زندقہ ⁦(بدعت)⁩", tr: "sapkınlık", id: "bidaah" }
summary:
  ar: "الزندقة اتهام تردد على الألسنة في العصر العباسي الأول ونُسب إليه الناس حقاً وباطلاً حتى تنبه له الرأي العام تنبهاً دقيقاً، فكانوا يسمعون شعر الشاعر فيلتفتون إلى ما فيه يتهمونه بالزندقة؛ ويصف أحمد أمين الصراع بين الشك والإلحاد والإيمان الخالص في ذلك العصر بأنه حرب مستعرة استُخدمت فيها الخدع والمكايد والوسائل السرية واللجوء إلى السيف وسفك الدماء وعقد المجالس ومقارعة الحجج، وأن المؤرخين لم يعنوا بتسجيل هذه الحرب كما عنوا بتسجيل الحروب السياسية فلا يعثر الباحث إلا على نتف مبعثرة في ثنايا الكتب {cite:duha-islam p. 136-137}."
  en: "Zandaqa — the accusation of freethinking/heresy that ran through the first Abbasid era, levelled truly and falsely; Ahmad Amin frames the struggle between doubt and faith as an all-out war fought by ruse, sword and disputation alike {cite:duha-islam p. 136-137}."
  es: "Zandaqa — la acusación de librepensamiento/herejía que se extendió durante la primera era abasí, formulada con verdad y con falsedad; Ahmad Amin plantea la lucha entre la duda y la fe como una guerra total librada con astucia, espada y disputa por igual {cite:duha-islam p. 136-137}."
  fr: "Zandaqa — l’accusation de libre-pensée/hérésie qui a traversé la première ère abbasside, portée à la fois à juste titre et à tort; Ahmad Amin décrit la lutte entre le doute et la foi comme une guerre totale menée par la ruse, l’épée et la dispute {cite:duha-islam p. 136-137}."
  ur: "Zandaqa - آزادانہ سوچ / بدعت کا الزام جو پہلے عباسی دور سے گزرتا تھا، سچ اور جھوٹ کے برابر تھا۔ احمد امین شک اور ایمان کے درمیان لڑائی کو ایک ہمہ جہت جنگ کے طور پر بیان کرتے ہیں جو ہجوم، تلوار اور جھگڑے سے لڑی جاتی ہے۔ 136-137}۔"
  tr: "Abbasi döneminin başlarında sıkça tekrarlanan bir suçlama olan sapkınlık, kamuoyunun bu konuda iyice bilinçlenmesine kadar hem haklı hem de haksız yere insanlara yöneltilen bir suçlamaydı. İnsanlar bir şairin şiirini dinler ve içeriğine dikkat ederek onu sapkınlıkla suçlarlardı. Ahmed Amin, o dönemdeki şüphe, ateizm ve saf inanç arasındaki çatışmayı, aldatma, entrika, gizli yöntemler, kılıç kullanma, kan dökme, konseyler kurma ve tartışmanın kullanıldığı şiddetli bir savaş olarak tanımlar. Tarihçilerin bu savaşı, siyasi savaşları kaydettikleri gibi kaydetmeye özen göstermediklerini, bu nedenle araştırmacıların kitapların sayfalarında yalnızca dağınık parçalar bulduğunu belirtir. {cite:duha-islam s. 136-137}"
  id: "Bid'ah adalah tuduhan yang sering diulang pada awal era Abbasiyah, dan orang-orang dituduh demikian baik secara benar maupun salah, hingga opini publik menjadi sangat menyadarinya. Mereka akan mendengarkan puisi seorang penyair dan memperhatikan isinya, lalu menuduhnya melakukan bid'ah. Ahmed Amin menggambarkan konflik antara keraguan, ateisme, dan iman murni pada era itu sebagai perang yang berkecamuk di mana penipuan, intrik, cara-cara rahasia, penggunaan pedang, pertumpahan darah, penyelenggaraan konsili, dan perdebatan digunakan. Ia mencatat bahwa sejarawan tidak memperhatikan pencatatan perang ini seperti halnya pencatatan perang politik, sehingga peneliti hanya menemukan fragmen-fragmen yang tersebar di lipatan buku {cite:duha-islam hlm. 136-137}."
