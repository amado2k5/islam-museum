label: { ar: "الزندقة" }
summary:
  ar: "الزندقة اتهام تردد على الألسنة في العصر العباسي الأول ونُسب إليه الناس حقاً وباطلاً حتى تنبه له الرأي العام تنبهاً دقيقاً، فكانوا يسمعون شعر الشاعر فيلتفتون إلى ما فيه يتهمونه بالزندقة؛ ويصف أحمد أمين الصراع بين الشك والإلحاد والإيمان الخالص في ذلك العصر بأنه حرب مستعرة استُخدمت فيها الخدع والمكايد والوسائل السرية واللجوء إلى السيف وسفك الدماء وعقد المجالس ومقارعة الحجج، وأن المؤرخين لم يعنوا بتسجيل هذه الحرب كما عنوا بتسجيل الحروب السياسية فلا يعثر الباحث إلا على نتف مبعثرة في ثنايا الكتب {cite:duha-islam p. 136-137}."
  en: "Zandaqa — the accusation of freethinking/heresy that ran through the first Abbasid era, levelled truly and falsely; Ahmad Amin frames the struggle between doubt and faith as an all-out war fought by ruse, sword and disputation alike {cite:duha-islam p. 136-137}."
