label: { ar: "يوم الأسبوع من باقي القسمة على سبعة", en: "The weekday from the remainder after division by seven", ur: "باقی کو سات پر تقسیم کر کے ہفتے کا دن", es: "El día de la semana del resto después de la división por siete", fr: "Le jour de la semaine restant après division par sept", tr: "Ligin geri kalanından yedi puan farkla haftanın günü", id: "Hari dalam seminggu dari sisa divisi dengan selisih tujuh" }
summary:
  ar: "يحسب البتاني يوم الأسبوع من باقي قسمة عدد الأيام على سبعة، فيكون الباقي علامة اليوم، ويبدأ العد من يوم الأحد، فما لم يبلغ سبعة يُعد من الأحد، والذي يخرج بالحساب يدل على اليوم الذي يدخل فيه الشهر المطلوب. {cite:zij-sabi-nallino-byblion p.101}."
  en: "Al-Battani finds the weekday from the remainder when the day count is divided by seven. The remainder marks the day, counted from Sunday, and the result shows the weekday on which the sought month begins. {cite:zij-sabi-nallino-byblion p.101}."
  ur: "البتانی ہفتے کا دن دنوں کی تعداد کو سات پر تقسیم کرنے کے باقی سے نکالتے ہیں؛ باقی دن کی علامت ہے، جو اتوار سے گنا جاتا ہے، اور حاصل ہونے والا نتیجہ اس دن کو بتاتا ہے جس دن مطلوبہ مہینہ شروع ہوتا ہے۔ {cite:zij-sabi-nallino-byblion p.101}۔"
  es: "Al-Battani halla el día de la semana a partir del resto de la división del número de días entre siete. El resto marca el día, contado desde el domingo, y el resultado muestra el día de la semana en que comienza el mes buscado. {cite:zij-sabi-nallino-byblion p.101}."
  fr: "Al-Battani détermine le jour de la semaine à partir du reste de la division du nombre de jours par sept. Ce reste, compté à partir de dimanche, indique le jour de la semaine où commence le mois recherché. {cite:zij-sabi-nallino-byblion p.101}."
  tr: "El-Battani, haftanın gününü gün sayısını yediye bölerek hesaplar. Kalan, günü gösterir ve sayım Pazar gününden başlar. Yediye ulaşmayan günler Pazar gününden itibaren sayılır. Hesaplamanın sonucu, istenilen ayın başlangıç gününü gösterir. {cite:zij-sabi-nallino-byblion s.101}."
  id: "Al-Battani menghitung hari dalam seminggu dengan membagi jumlah hari dengan tujuh. Sisa pembagian menunjukkan hari, dan perhitungan dimulai pada hari Minggu. Hari-hari yang tidak mencapai tujuh hari dihitung mulai dari hari Minggu dan seterusnya. Hasil perhitungan menunjukkan hari dimulainya bulan yang diinginkan. {cite:zij-sabi-nallino-byblion p.101}."
