id: concept/al-hajj-wal-umra
class: concept
kind: legal
label:
  ar: "الحج والعمرة"
  en: "Hajj and 'Umra"
summary:
  ar: "يرى الشعراوي أن الحج والعمرة نسكان يتممان لله، وأن الإحصار يُجبر بالهدي، وأن الحاج ينهى عن الرفث والفسوق والجدال، ويُطلب منه أن يتزود ويبتغي فضلاً من ربه دون أن يُذل للناس، وأن الوقوف بعرفة هو الحج الأكبر، وأن ذكر الله بعد المناسك يتجاوز التفاخر بالآباء. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.835}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.837}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.839}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.844}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.847}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.857}"
  en: "Sha'rawi holds that Hajj and 'Umra are two rites to be completed for God; that the one prevented is restrained by an offering; that the pilgrim is barred from obscenity, wickedness and disputing, and is told to take provision and seek God's bounty without humbling himself to people; that standing at 'Arafat is the greater Hajj; and that remembrance of God after the rites exceeds boasting of one's fathers {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.835}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.837}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.839}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.844}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.847}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.857}."
wings: [ideas]
themes: [sacred-space-and-pilgrimage, worship-and-the-pillars]
periods: [period/prophetic-era]
regions: [arabia]
issue:
  ar: "ما الفرق بين الحج والعمرة وما حكم الهدي والفدية عند الإحصار، وما آداب الحاج؟"
  en: "What is the difference between Hajj and 'Umra, what is the ruling on the offering and redemption when prevented, and what are the pilgrim's manners?"
perspectives:
  - tradition: sunni
    id: sharawi-hajj-manners
    stance:
      ar: "الحج والعمرة يتمان لله، والآداب تنهى عن الرفث والفسوق والجدال، وتطلب الزاد وطلب الفضل دون ذل"
      en: "Hajj and 'Umra are completed for God; the manners forbid obscenity, wickedness and disputing, require provision and seeking bounty without humbling oneself"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يذكر الشعراوي أن الإحصار مما لا يُقصد بالتقصير ويجبر بالهدي، وأن من تعجل في يومين أو تأخر فلا إثم عليه، وأن الزاد يحفظ الحاج من السؤال، وأن الحج الأكبر هو الوقوف بعرفة. ويعرض الشعراوي اختلاف العلماء في الإفراد والتمتع والقران دون تسمية أصحاب الأقوال. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.839}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.840}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.842}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.847}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.838}"
      en: "Sha'rawi says that the prevented person is restrained by an offering; that one who hastens in two days or delays commits no sin; that provision keeps the pilgrim from asking; and that the greater Hajj is standing at 'Arafat. He reports the jurists' differences on ifrad, tamattu' and qiran without naming them {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.839}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.840}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.842}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.847}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.838}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
  - tradition: sunni
    id: scope-note-jurists-hajj
    stance:
      ar: "أقوال الفقهاء في الإفراد والتمتع والقران وشروط الهدي لم تُراجع أصولها هنا"
      en: "The jurists' views on ifrad, tamattu' and qiran and the conditions of the offering were not checked against their sources here"
    holders: []
    summary:
      ar: "لم تُدخل هنا أسماء أصحاب الأقوال في أنواع النسك، ولا الرأي الأكاديمي، ولا الآراء الأخرى. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.839}"
      en: "The names of those who hold each view on the kinds of rite, the academic view and other views are not entered {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.839}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
