summary:
  ar: "لحم الدُّرّاج، وهو أبو الحجاج بالعامية، أفضل من لحم القبج والفواخت، وأعدل وألطف، وأيبس من لحم التدرج. {cite:canon-ibn-sina-print-v1 p.446}"
  en: "Durraj is the partridge; its flesh is better than the flesh of the kabj and the fawakh, more balanced and lighter, and drier than the tadarruj. {cite:canon-ibn-sina-print-v1 p.446}"
  ur: "دراج تیتر کو کہتے ہیں؛ اس کا گوشت قبج اور فواخت سے بہتر، زیادہ معتدل اور ہلکا، اور تدرج کے گوشت سے زیادہ خشک ہے۔ {cite:canon-ibn-sina-print-v1 p.446}"
  es: "Durraj es la perdiz; su carne es mejor que la del kabj y el fawakh, más equilibrada y ligera, y más seca que la del tadarruj. {cite:canon-ibn-sina-print-v1 p.446}"
