label:
  ar: المصلحة الخاصة والعامة واليد الخفية
  en: Private and public interest and the invisible hand
summary:
  ar: يتمتع المسلم بحرية العمل لمصلحته الخاصة، ولا يقدم المصلحة العامة إلا عند التعارض، ويقف عند الحد الذي تضر فيه مصلحته بمصالح الآخرين {cite:usul-iqtisad-islami-0660 p. 18} {cite:usul-iqtisad-islami-0660 p. 19}. ويرى المؤلف أن السعي للمصلحة الخاصة يتضمن السعي للمصلحة العامة، وأن آدم سميث سماه اليد الخفية، وقد يقصد به يد العناية الإلهية، وأن علماء المسلمين سبقوا إلى ذلك {cite:usul-iqtisad-islami-0660 p. 19}. ويستشهد بالغزالي في أن الإنسان لو خلّي ونفسه لما أعطى غيره شيئًا إلا لطلب منفعته هو، وبالشاطبي في أن كل عمل فيه مصلحة الغير في طريق مصلحة نفسه يرجع إلى مصلحة الإنسان نفسه {cite:usul-iqtisad-islami-0660 p. 19} {cite:usul-iqtisad-islami-0660 p. 20}. ويقرر المؤلف أن المسلم لا يطالب بإلغاء مصلحته الخاصة، لأن ذلك غير مجد بل قد يضر {cite:usul-iqtisad-islami-0660 p. 19} {cite:usul-iqtisad-islami-0660 p. 79}.
