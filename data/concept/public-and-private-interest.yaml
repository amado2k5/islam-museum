label:
  ar: المصلحة الخاصة والعامة واليد الخفية
  en: Private and public interest and the invisible hand
  es: "El interés público y privado y la mano invisible"
  fr: "Intérêts privés et publics et la main invisible"
  ur: "نجی اور عوامی مفاد اور پوشیدہ ہاتھ"
  tr: "Özel ve kamu yararı ile gizli el"
  id: "Kepentingan pribadi dan publik serta tangan tersembunyi"
summary:
  ar: "يتمتع المسلم بحرية العمل لمصلحته الخاصة، ولا يقدم المصلحة العامة إلا عند التعارض، ويقف عند الحد الذي تضر فيه مصلحته بمصالح الآخرين {cite:usul-iqtisad-islami-0660 p. 18} {cite:usul-iqtisad-islami-0660 p. 19}. ويرى المؤلف أن السعي للمصلحة الخاصة يتضمن السعي للمصلحة العامة، وأن آدم سميث سماه اليد الخفية، وقد يقصد به يد العناية الإلهية، وأن علماء المسلمين سبقوا إلى ذلك {cite:usul-iqtisad-islami-0660 p. 19}. ويستشهد بالغزالي في أن الإنسان لو خلّي ونفسه لما أعطى غيره شيئًا إلا لطلب منفعته هو، وبالشاطبي في أن كل عمل فيه مصلحة الغير في طريق مصلحة نفسه يرجع إلى مصلحة الإنسان نفسه {cite:usul-iqtisad-islami-0660 p. 19} {cite:usul-iqtisad-islami-0660 p. 20}. ويقرر المؤلف أن المسلم لا يطالب بإلغاء مصلحته الخاصة، لأن ذلك غير مجد بل قد يضر {cite:usul-iqtisad-islami-0660 p. 19} {cite:usul-iqtisad-islami-0660 p. 79}. يعرض المؤلف قواعد تعارض المصالح والمفاسد، فتقدم المصلحة الكلية على الجزئية، ويتحمل الضرر الخاص لدفع الضرر العام، وتقدم المصلحة المتعدية على القاصرة، ويرى أن المصالح المرسلة والاستحسان والعرف والشورى وآراء أهل الخبرة تحكم شؤون الدنيا."
  tr: "Bir Müslüman, kendi çıkarı için hareket etme özgürlüğüne sahiptir ve sadece çatışma durumlarında kamu yararını önceliklendirir; ayrıca kendi çıkarlarının başkalarının çıkarlarına zarar verdiği noktada durur {cite:usul-iqtisad-islami-0660 s. 18} {cite:usul-iqtisad-islami-0660 s. 19}. Yazar, özel çıkarı aramanın kamu iyiliği için çaba göstermeyi de içerdiğine inanır ve Adam Smith buna gizli el demiştir; bu da ilahi takdirin elini ifade edebilir, ayrıca Müslüman alimlerin bundan önce de olduğunu {cite:usul-iqtisad-islami-0660 s. 19} Al-Gazali, bir kişi kendisiyle yalnız kalırsa, başkalarına sadece kendi çıkarını aramak için hiçbir şey vereceğini belirtirken, Al-Shatibi, kendisi için başkalarının yararını içeren herhangi bir eylemin kişinin kendi yararına olduğunu belirtir {cite:usul-iqtisad-islami-0660 s. 19} {cite:usul-iqtisad-islami-0660 s. 20}. Yazar, bir Müslümanın kendi çıkarlarının kaldırılmasını talep etmediğini, çünkü bunun faydasız olduğunu ve {cite:usul-iqtisad-islami-0660 s. 19} {cite:usul-iqtisad-islami-0660 s. 79} olduğunu belirtir. Yazar, çıkar çatışması ve zarar kurallarını sunar; burada genel çıkar özel menfaatin önüne geçer, özel zarar genel zararı önlemek için karşılanır ve küçüğe zarar veren çıkar önceliklendirilir. Sınırsız halkın çıkarlarının, tercihin (istihsan), geleneklerin, danışmanın ve uzmanların görüşlerinin dünyevi işleri yönettiğine inanır."
  id: "Seorang Muslim menikmati kebebasan untuk bertindak demi kepentingannya sendiri dan hanya memprioritaskan kepentingan publik dalam kasus konflik, dan ia berada pada titik di mana kepentingannya sendiri merugikan kepentingan orang lain {cite:usul-iqtisad-islami-0660 hlm. 18} {cite:usul-iqtisad-islami-0660 hlm. 19}. Penulis percaya bahwa mencari kepentingan pribadi termasuk berjuang untuk kebaikan umum, dan bahwa Adam Smith menyebutnya tangan tersembunyi, yang mungkin merujuk pada tangan penyelenggaraan ilahi, dan bahwa para ulama Muslim telah mendahului {cite:usul-iqtisad-islami-0660 hlm. 19}. Al-Ghazali mengutip bahwa jika seseorang sendirian dengan dirinya sendiri, ia tidak akan memberikan apa pun kepada orang lain kecuali demi kepentingannya sendiri, dan Al-Shatibi menyatakan bahwa setiap tindakan yang melibatkan kepentingan orang lain demi dirinya sendiri akan kembali menguntungkan orang itu sendiri {cite:usul-iqtisad-islami-0660 hlm. 19} {cite:usul-iqtisad-islami-0660 hlm. 20}. Penulis menyatakan bahwa seorang Muslim tidak menuntut penghapusan kepentingannya sendiri, karena itu tidak berguna dan dapat merugikan {cite:usul-iqtisad-islami-0660 hlm. 19} {cite:usul-iqtisad-islami-0660 hlm. 79}. Penulis memaparkan aturan konflik kepentingan dan kerugian, di mana kepentingan keseluruhan diutamakan daripada kepentingan khusus, kerugian pribadi ditanggung untuk menghindari kerugian umum, dan kepentingan yang melanggar anak di bawah umur diprioritaskan. Ia percaya bahwa kepentingan rakyat yang tidak dibatasi, preferensi (istihsan), adat, konsultasi, dan pendapat para ahli mengatur urusan duniawi."
