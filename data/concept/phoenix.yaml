summary:
  ar: "العنقاء عند العرب طائر أعجم لا يقع في الأيدي، ضُرب به المثل في الغائب البعيد: عنقاء مغرب، وأكثر الدميري في مدخلها أنها من أشهر أسماء الطير التي لا يعرفها الناس، إنما هي صنعة اللغة والخبر."
  en: "The anqa of the Arabs: the ungettable bird, proverb for the far and vanished — 'an anqa of the uttermost west'; al-Damiri himself dwells on it as one of the most famous bird-names nobody knows — a creature of language and tale rather than the field."
  ur: "عربوں کا عنقا: وہ پرندہ جو ہاتھ نہیں آتا، دوری اور فنا کی مثال 'مغرب کا عنقا'؛ خود دمیری اسے ان پرندوں کے مشہور ترین ناموں میں گنتا ہے جنہیں کوئی نہیں جانتا — یہ میدان کی بجائے زبان اور قصے کی مخلوق ہے۔"
  es: "El anqa de los árabes: el ave inalcanzable, proverbio para lo lejano y desaparecido: 'un anqa del extremo oeste'; el propio al-Damiri se detiene en él como uno de los nombres de aves más famosos que nadie conoce: una criatura del lenguaje y del cuento más que del campo."
  fr: "L'anqa des Arabes: l'oiseau insaisissable, proverbe pour le lointain et le disparu — « un anqa de l'extrême ouest »; al-Damiri lui-même s'attarde dessus comme sur l'un des noms d'oiseaux les plus célèbres que personne ne connaît — une créature du langage et du conte plutôt que des champs."
  tr: "Araplar arasında anka kuşu, ellerine düşmeyen yabancı bir kuştur. Uzak olmayan için bir metafor olarak kullanılır: Fas anka kuşu. Al-Damiri'nin çoğu tanıtımında bunun insanların bilmediği en ünlü kuş isimlerinden biri olduğu belirtilir; daha çok dil ve haber zanaatıdır."
  id: "Di antara orang Arab, phoenix adalah burung asing yang tidak jatuh ke tangan. Burung ini digunakan sebagai metafora untuk yang jauh yang hilang: phoenix Maroko. Sebagian besar pengantar Al-Damiri menyebutkan bahwa ini adalah salah satu nama burung paling terkenal yang tidak diketahui orang; melainkan, ini adalah kerajinan bahasa dan berita."
