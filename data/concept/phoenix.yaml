summary:
  ar: "العنقاء عند العرب طائر أعجم لا يقع في الأيدي، ضُرب به المثل في الغائب البعيد: عنقاء مغرب، وأكثر الدميري في مدخلها أنها من أشهر أسماء الطير التي لا يعرفها الناس، إنما هي صنعة اللغة والخبر."
  en: "The anqa of the Arabs: the ungettable bird, proverb for the far and vanished — 'an anqa of the uttermost west'; al-Damiri himself dwells on it as one of the most famous bird-names nobody knows — a creature of language and tale rather than the field."
  ur: "عربوں کا عنقا: وہ پرندہ جو ہاتھ نہیں آتا، دوری اور فنا کی مثال 'مغرب کا عنقا'؛ خود دمیری اسے ان پرندوں کے مشہور ترین ناموں میں گنتا ہے جنہیں کوئی نہیں جانتا — یہ میدان کی بجائے زبان اور قصے کی مخلوق ہے۔"
