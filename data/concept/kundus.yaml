summary:
  ar: "الكندس أصله أكثر ما يُستعمل، وهو عند الكتاب حار يابس في الثالثة، جالٍ منقٍّ مقرّح لذّاع يثير القيء، ويقطع البلغم والمرة السوداء، ويخرج البول، ويفتت الحصاة."
  en: "Kundus is most often used for its root. The book classes it as hot and dry in the third degree, a cleansing, sharp, irritant plant that provokes vomiting, cuts phlegm and black bile, brings on urine and breaks up stone. The editor's footnote gives the name as the sneezing-wood."
  ur: "کندس کی جڑ زیادہ استعمال ہوتی ہے۔ کتاب اسے تیسرے درجے میں گرم اور خشک بتاتی ہے، صاف کرنے والا، تیز، جلن پیدا کرنے والا پودا جو قے لاتا ہے، بلغم اور سودا کو کاٹتا ہے، پیشاب لاتا ہے اور پتھری کو توڑتا ہے۔ حاشیے کے مطابق اس کا نام چھینک کی لکڑی ہے۔"
  es: "El kundus se utiliza principalmente por su raíz. El libro lo clasifica como una planta caliente y seca de tercer grado, depurativa, punzante e irritante que provoca vómitos, disuelve la flema y la bilis negra, induce la micción y disuelve los cálculos. En una nota al pie, el editor la denomina «madera estornudadora»."
  fr: "Le kundus est surtout utilisé pour sa racine. L'ouvrage le classe comme chaud et sec au troisième degré, une plante purificatrice, piquante et irritante qui provoque des vomissements, dissout les mucosités et la bile noire, favorise la diurèse et dissout les calculs rénaux. La note de bas de page de l'éditeur le désigne comme le « bois des éternuements »."
  tr: "'al-kund'un kökeni en yaygın kullanılan türdür ve kitaba göre, üçüncü yılda sıcak ve kuru bir yara olarak kusmaya, balgamı ve kara safra kesen, idrar atan ve taşları parçalayan güçlü bir yara ve yara kaynağıdır."
  id: "Asal usul 'al-kund' adalah yang paling umum digunakan, dan menurut buku, ia panas dan kering pada tahun ketiga, merupakan zat sakit dan kuat yang menyebabkan muntah, memotong dahak dan empedu hitam, mengeluarkan urin, dan memecah batu."
