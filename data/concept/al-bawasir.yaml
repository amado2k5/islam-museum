summary:
  ar: "البواسير ينفع منها ما اتخذ منه مرهم بما وصف من الشمع والأدهان ⁦(الأسماء من هذا الجنس مطروحة)⁩ {cite:canon-ibn-sina-print-v2 p.284}"
  en: "Piles: what benefits them is the salve made of what he described with the stated wax and oils (the names of this kind left out) {cite:canon-ibn-sina-print-v2 p.284}"
  fr: "Hémorroïdes : ce qui leur est bénéfique est l’onguent préparé avec ce qu’il a décrit, avec la cire et les huiles indiquées (les noms de cette catégorie sont omis) {cite:canon-ibn-sina-print-v2 p.284}"
  ur: "بواسیر: ان میں وہ مرہم سودا کرتا ہے جو بیان کردہ چیزوں سے موم اور تیلوں کے ساتھ بنایا جائے ⁦(اسی جنس کے نام مطروح)⁩ {cite:canon-ibn-sina-print-v2 p.284}"
  es: "Hemorroides: lo que les beneficia es el ungüento hecho con lo que describió, con la cera y los aceites mencionados (se omiten los nombres de este tipo) {cite:canon-ibn-sina-print-v2 p.284}"
  tr: "Hemoroidler, tanımlanan mum ve merhemlerle birlikte kullanılan merhem sayesinde fayda sağlar (bu cinsin isimleri belirtilmiştir) {cite:canon-ibn-sina-print-v2 s.284}"
  id: "Wasir mendapat manfaat dari salep yang digunakan bersama dengan supositoria dan salep yang dijelaskan (nama genus ini ditentukan) {cite:canon-ibn-sina-print-v2 hlm.284}"
