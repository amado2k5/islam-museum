label:
  ar: محبة الوطن في الإسلام
  en: "Love of homeland in Islam"
  es: "El amor a la patria en el Islam"
  fr: "L'amour de la patrie en islam"
summary:
  ar: "يرى أحمد عمر هاشم أن محبة الأوطان من دلائل الإيمان، وأن الجهاد شرع دفاعا عن العقيدة والأوطان ورد الظلم {cite:hatha-huwa-al-islam-azhar p. 121}. ويرى أن حماية الوطن لا تقتصر على صد العدوان، بل تشمل مقاومة الفكر المغشوش والإشاعة المغرضة وكتمان أسرار الوطن عن أعدائه {cite:hatha-huwa-al-islam-azhar p. 122}. ويقسم الأوطان إلى وطن خاص كالبلد والدولة، ووطن عام كالعالم العربي والعالم الإسلامي، ووطن أعم هو الإنسانية جمعاء {cite:hatha-huwa-al-islam-azhar p. 122}."
  en: "Ahmad Umar Hashim holds that love of homeland is a sign of faith, and that jihad was legislated to defend the faith and the homelands and to repel injustice (p. 121). He argues that protecting the homeland includes resisting deceptive ideas and rumours and keeping the nation's secrets from its enemies (p. 122). He divides homelands into a personal one (town and state), a wider one (the Arab and Muslim worlds) and the widest, humanity as a whole (p. 122)."
  es: "Ahmad Umar Hashim sostiene que el amor a la patria es un signo de fe, y que la yihad fue legislada para defender la fe y la patria, así como para combatir la injusticia (p. 121). Argumenta que proteger la patria implica resistir las ideas engañosas y los rumores, y mantener los secretos de la nación a salvo de sus enemigos (p. 122). Divide la patria en una personal (la ciudad y el estado), una más amplia (el mundo árabe y musulmán) y la más amplia de todas, la humanidad en su conjunto (p. 122)."
  fr: "Ahmad Umar Hashim affirme que l'amour de la patrie est un signe de foi et que le jihad a été légiféré pour défendre la foi et la patrie et pour combattre l'injustice (p. 121). Il soutient que protéger la patrie implique de résister aux idées trompeuses et aux rumeurs, et de préserver les secrets de la nation vis-à-vis de ses ennemis (p. 122). Il distingue trois types de patrie: la patrie personnelle (la ville et l'État), la patrie plus large (le monde arabe et musulman) et la plus vaste encore, l'humanité tout entière (p. 122)."
