label:
  ar: محبة الوطن في الإسلام
  en: "Love of homeland in Islam"
summary:
  ar: "يرى أحمد عمر هاشم أن محبة الأوطان من دلائل الإيمان، وأن الجهاد شرع دفاعا عن العقيدة والأوطان ورد الظلم {cite:hatha-huwa-al-islam-azhar p. 121}. ويرى أن حماية الوطن لا تقتصر على صد العدوان، بل تشمل مقاومة الفكر المغشوش والإشاعة المغرضة وكتمان أسرار الوطن عن أعدائه {cite:hatha-huwa-al-islam-azhar p. 122}. ويقسم الأوطان إلى وطن خاص كالبلد والدولة، ووطن عام كالعالم العربي والعالم الإسلامي، ووطن أعم هو الإنسانية جمعاء {cite:hatha-huwa-al-islam-azhar p. 122}."
  en: "Ahmad Umar Hashim holds that love of homeland is a sign of faith, and that jihad was legislated to defend the faith and the homelands and to repel injustice (p. 121). He argues that protecting the homeland includes resisting deceptive ideas and rumours and keeping the nation's secrets from its enemies (p. 122). He divides homelands into a personal one (town and state), a wider one (the Arab and Muslim worlds) and the widest, humanity as a whole (p. 122)."
