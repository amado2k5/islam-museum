id: concept/canon-touch-as-a-sign-of-temperament
class: concept
kind: scientific
label: { ar: "الملمس دليلاً على المزاج عند ابن سينا", en: "Touch as a sign of temperament in the Canon", ur: "لمس بطور علامتِ مزاج، قانون کے مطابق", es: "El tacto como signo de temperamento en el Canon", fr: "Le toucher comme signe de tempérament dans le canon", tr: "İbn Sina'ya göre mizaç işareti olarak doku", id: "Tekstur sebagai Tanda Temperamen menurut Avicenna" }
summary:
  ar: "يجعل ابن سينا الملمس أول أجناس الدلائل على المزاج: يقاس بملمس الصحيح المزاج في البلدان والهواء المعتدلين، ويحترز من أن تخدع الحرارة أو البرودة الحكم بالليونة والصلابة {cite:canon-ibn-sina-print-v1 pp.158-159}."
  en: "Ibn Sina makes touch the first genus of signs of temperament: it is measured against the touch of a healthy-tempered person in moderate lands and air, with a caution against letting heat or cold mislead the judgement of softness and hardness {cite:canon-ibn-sina-print-v1 pp.158-159}."
  es: "Ibn Sina hace del tacto el primer género de signos del temperamento: se mide contra el tacto de una persona de temperamento sano en tierras y aire moderados, con la precaución de no dejar que el calor o el frío confundan el juicio de suavidad y dureza {cite:canon-ibn-sina-print-v1 pp.158-159}."
  fr: "Ibn Sina fait du toucher le premier genre de signes du tempérament: il est mesuré par rapport au toucher d'une personne au tempérament sain dans des terres et un air modérés, avec une mise en garde contre le risque de laisser la chaleur ou le froid induire en erreur le jugement de douceur et de dureté {cite:canon-ibn-sina-print-v1 pp.158-159}."
  ur: "ابن سینا نے مزاج کی علامات کی پہلی انواع کو چھو لیا ہے: اسے معتدل زمینوں اور ہوا میں ایک صحت مند مزاج شخص کے لمس کے خلاف ماپا جاتا ہے، گرمی یا سردی کو نرمی اور سختی کے فیصلے کو گمراہ کرنے کے خلاف احتیاط کے ساتھ ماپا جاتا ہے۔"
  tr: "İbn Sina, dokuyu ruh halinin ilk göstergesi olarak kullanır: ülkelerde doğru ruh halinin dokusu ve ılımlı hava ile ölçülür; sıcaklık veya soğuğun yumuşaklık ve sertlikle yargıyı yanıltmasına dikkat etmez {cite:canon-ibn-sina-print-v1 s.158-159}."
  id: "Ibn Sina menjadikan tekstur sebagai jenis indikasi pertama suasana hati: diukur dengan tekstur suasana hati yang tepat di negara dan udara sedang, dan ia berhati-hati agar panas atau dingin tidak menipu penilaian dengan kelembutan dan kekerasan {cite:canon-ibn-sina-print-v1 hlm.158-159}."
