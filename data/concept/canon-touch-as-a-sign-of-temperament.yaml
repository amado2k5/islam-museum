summary:
  ar: "يجعل ابن سينا الملمس أول أجناس الدلائل على المزاج: يقاس بملمس الصحيح المزاج في البلدان والهواء المعتدلين، ويحترز من أن تخدع الحرارة أو البرودة الحكم بالليونة والصلابة {cite:canon-ibn-sina-print-v1 pp.158-159}."
  en: "Ibn Sina makes touch the first genus of signs of temperament: it is measured against the touch of a healthy-tempered person in moderate lands and air, with a caution against letting heat or cold mislead the judgement of softness and hardness {cite:canon-ibn-sina-print-v1 pp.158-159}."
