label:
  ar: "بوقيصا"
  en: "Buqaysa (a tree with a cooling bark)"
  fr: "Buqaysa (arbre à écorce rafraîchissante)"
  ur: "بوقیصا"
  es: "Buqaysa (un árbol con corteza refrescante)"
  tr: "Bouqisa"
  id: "Bouqisa"
summary:
  ar: "بارد، فيه جلاء وقبض، وفي غلاف ثمرته رطوبة. يجلو الوجه، ويُجعل مسحوقاً على الجرب المتقرّح ويلزق الجراحات لقبضه وجلائه، وخاصة قشر شجرته، وينفع على العظام المكسورة بطبيخ أصله وورقه، وقشرته الغليظة تسهّل البلغم {cite:canon-ibn-sina-print-v1 p.400}."
  en: "Cold, with a cleansing and an astringent power, and moisture in the husk of its fruit. It brightens the face. Its bark, powdered, is applied to ulcerated scabies and to wounds because of its astringency and cleansing; its root and leaf in decoction are applied to broken bones. Its thick bark purges phlegm {cite:canon-ibn-sina-print-v1 p.400}."
  fr: "Froid, nettoyant et astringent, avec une humidité dans l’enveloppe du fruit. Il éclaircirait le visage. L’écorce en poudre est appliquée à la gale ulcérée et aux plaies pour ses pouvoirs nettoyant et astringent ; racine et feuilles en décoction aux fractures. L’écorce épaisse purgerait le phlegme {cite:canon-ibn-sina-print-v1 p.400}."
  ur: "یہ ٹھنڈا ہے، اس میں جلا دینے والی اور قابض قوت ہے، اور اس کے پھل کے غلاف میں تری ہے۔ یہ چہرہ صاف کرتا ہے۔ اس کی چھال پیس کر زخمی خارش پر ڈالی جاتی ہے اور زخموں پر لگائی جاتی ہے کیونکہ اس میں قبض اور جلا ہے، اور اس کی جڑ اور پتے کا جوشاندہ ٹوٹی ہوئی ہڈی پر لگایا جاتا ہے۔ اس کی موٹی چھال بلغم کو نکالتی ہے {cite:canon-ibn-sina-print-v1 p.400}۔"
  es: "Fría, con propiedades depurativas y astringentes, y con humedad en la cáscara de su fruto. Ilumina el rostro. Su corteza, en polvo, se aplica a la sarna ulcerada y a las heridas por su astringencia y poder depurativo; su raíz y hoja en decocción se aplican a las fracturas. Su corteza gruesa purga la flema {cite:canon-ibn-sina-print-v1 p.400}."
  tr: "Soğuktur, açılır ve kasılır, meyve sargısı nemlidir. Yüzü temizler, ülserleşmiş kabuk üzerine uygulanır ve özellikle ağacın kabuğunu sıkıp çıkararak yaralara yapışır. Kök ve yapraklarını pişirerek kırık kemikler için faydalıdır ve kalın kabuğu balgamı kolaylaştırır {cite:canon-ibn-sina-print-v1 s.400}."
  id: "Pohon ini dingin, memiliki area terbuka dan kontraksi, dan pembungkus buahnya lembap. Ia membersihkan wajah, diaplikasikan pada kerak yang berluka, dan menempel pada luka untuk mengencangkan dan menghilangkan, terutama kulit pohonnya. Ikan ini bermanfaat untuk tulang patah dengan memasak akar dan daunnya, dan kulitnya yang tebal memudahkan dahak {cite:canon-ibn-sina-print-v1 hlm.400}."
