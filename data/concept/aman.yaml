id: concept/aman
class: concept
kind: legal
label: { ar: "الأمان", en: "Aman (safe-conduct granted to enemies in war)" }
summary:
  ar: "الأمان في اللغة عدم توقع مكروه، وفي الاصطلاح رفع استباحة دم الحربي ورقه وماله حين قتاله أو الغرم عليه، مع استقراره تحت حكم الإسلام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3372}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3373} ويفترق عن الهدنة والجزية في أن الهدنة والجزية لا يعقدهما إلا الإمام، والجزية مؤبدة، والأمان عقد غير لازم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3373} وينعقد بكل لفظ صريح أو كناية، أو بالكتابة والإشارة المفهمة، ويصح من الإمام ومن آحاد المسلمين، ويشترط فيه الإسلام والعقل والبلوغ عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3373}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3374}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3375}"
  en: "Aman in the lexical sense is the absence of expected harm; in the technical sense it is lifting the lawful killing, enslavement and seizure of property of an enemy in war, while he remains under Islamic rule. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3372}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3373} It differs from truce and from the poll-tax, which only the imam may grant, and the poll-tax is permanent while aman is not binding. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3373} It is made by any clear or implied word, by writing or by a clear sign, and it may be given by the imam or by an individual Muslim; most jurists require Islam, sanity and adulthood in the giver. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3373}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3374}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3375}"
