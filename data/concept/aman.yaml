label: { ar: "الأمان", en: "Aman (safe-conduct granted to enemies in war)", fr: "Aman (sauf-conduit accordé aux ennemis en temps de guerre)", es: "Aman (salvoconducto concedido a los enemigos en la guerra)" }
summary:
  ar: "الأمان في اللغة عدم توقع مكروه، وفي الاصطلاح رفع استباحة دم الحربي ورقه وماله حين قتاله أو الغرم عليه، مع استقراره تحت حكم الإسلام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3372}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3373} ويفترق عن الهدنة والجزية في أن الهدنة والجزية لا يعقدهما إلا الإمام، والجزية مؤبدة، والأمان عقد غير لازم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3373} وينعقد بكل لفظ صريح أو كناية، أو بالكتابة والإشارة المفهمة، ويصح من الإمام ومن آحاد المسلمين، ويشترط فيه الإسلام والعقل والبلوغ عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3373}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3374}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3375}"
  en: "Aman in the lexical sense is the absence of expected harm; in the technical sense it is lifting the lawful killing, enslavement and seizure of property of an enemy in war, while he remains under Islamic rule. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3372}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3373} It differs from truce and from the poll-tax, which only the imam may grant, and the poll-tax is permanent while aman is not binding. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3373} It is made by any clear or implied word, by writing or by a clear sign, and it may be given by the imam or by an individual Muslim; most jurists require Islam, sanity and adulthood in the giver. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3373}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3374}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3375}"
  fr: "Au sens lexical, l’aman est l’absence d’un mal attendu. Au sens technique, il désigne la suspension de la permission de mettre à mort ou en esclavage un ennemi en temps de guerre et de saisir ses biens, tant qu’il reste sous l’autorité islamique. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3372}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3373} Il se distingue de la trêve et de la capitation, qui relèvent toutes deux du seul imam ; la capitation est permanente, tandis que l’aman n’est pas contraignant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3373} Il est accordé par une parole explicite ou implicite, par écrit ou par un signe clair. L’imam ou un musulman à titre individuel peut l’accorder ; la plupart des juristes exigent de celui qui l’accorde qu’il soit musulman, jouisse de ses facultés et soit majeur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3373}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3374}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3375}"
  es: "Aman, en sentido léxico, es la ausencia de daño esperado; en sentido técnico, es levantar la prohibición de matar, esclavizar y confiscar bienes de un enemigo en guerra, mientras este permanece bajo dominio islámico. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3372}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3373} Se diferencia de la tregua y del impuesto de capitación, que solo el imán puede conceder, y el impuesto de capitación es permanente mientras que el aman no es vinculante. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3373} Se realiza mediante cualquier palabra clara o implícita, por escrito o mediante un signo claro, y puede ser otorgado por el imán o por un musulmán individual; la mayoría de los juristas exigen que el otorgante sea musulmán, esté en su sano juicio y sea mayor de edad. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3373}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3374}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3375}"
