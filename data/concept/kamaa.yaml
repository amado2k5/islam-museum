  en: "Kamaa (truffle)"
  ur: "کمأہ"
summary:
  ar: "الكمأة جنس من الفطر لا ورق له ولا ساق، ينبت في الربيع تحت الأرض، وهو عند الكتاب غليظ جدا، يغذو غذاء غليظا سوداويا، ويُخاف منه الفالج والسكتة والقولنج، وترياقه الشراب الصرف والتوابل."
  en: "Kamaa, the truffle, is a fungus without leaves or stalk that grows underground in spring. The book calls it very thick: it gives a thick, black-bile food. The book warns of paralysis, apoplexy and colic from it, and names pure wine and spices as its antidote."
  ur: "کمأہ ایک فنگس ہے جس کا نہ پتا ہوتا ہے نہ تنا، اور جو بہار میں زمین کے نیچے اگتا ہے۔ کتاب اسے بہت گاڑھا کہتی ہے اور اس سے گاڑھی سودا والی غذا بنتی ہے۔ کتاب اس سے فالج، سکتے اور قولنج کا خطرہ بتاتی ہے، اور اس کا تریاق خالص شراب اور مصالحے بتاتی ہے۔"
