label:
  ar: "كمأة"
  en: "Kamaa (truffle)"
  ur: "کمأہ"
  es: "Kamaa (trufa)"
  fr: "Kamaa (truffe)"
  tr: "trüf mantarı"
  id: "truffle"
summary:
  ar: "الكمأة جنس من الفطر لا ورق له ولا ساق، ينبت في الربيع تحت الأرض، وهو عند الكتاب غليظ جدا، يغذو غذاء غليظا سوداويا، ويُخاف منه الفالج والسكتة والقولنج، وترياقه الشراب الصرف والتوابل."
  en: "Kamaa, the truffle, is a fungus without leaves or stalk that grows underground in spring. The book calls it very thick: it gives a thick, black-bile food. The book warns of paralysis, apoplexy and colic from it, and names pure wine and spices as its antidote."
  ur: "کمأہ ایک فنگس ہے جس کا نہ پتا ہوتا ہے نہ تنا، اور جو بہار میں زمین کے نیچے اگتا ہے۔ کتاب اسے بہت گاڑھا کہتی ہے اور اس سے گاڑھی سودا والی غذا بنتی ہے۔ کتاب اس سے فالج، سکتے اور قولنج کا خطرہ بتاتی ہے، اور اس کا تریاق خالص شراب اور مصالحے بتاتی ہے۔"
  es: "La kamaa, o trufa, es un hongo sin hojas ni tallo que crece bajo tierra en primavera. El libro la describe como muy espesa: produce un alimento denso, de sabor a bilis negra. Advierte sobre la parálisis, la apoplejía y los cólicos que puede causar, y menciona el vino puro y las especias como antídoto."
  fr: "La truffe (Kamaa) est un champignon sans feuilles ni pied qui pousse sous terre au printemps. Le livre la décrit comme très épaisse: elle donne un aliment épais, à la bile noire. Il met en garde contre la paralysie, l’apoplexie et les coliques qu’elle peut provoquer, et cite le vin pur et les épices comme antidote."
  tr: "Trüf, yaprakları ve sapları olmayan, ilkbaharda yeraltında yetişen bir mantar türüdür. Kur'an'a göre çok yoğundur, yoğun ve koyu bir yiyecek besler ve felç, inme ve kolik için korkulur. Panzehiri saf içecek ve baharatlardır."
  id: "Truffle adalah jenis jamur yang tidak memiliki daun maupun batang, tumbuh di bawah tanah saat musim semi. Menurut Al-Qur'an, jamur ini sangat kental, memberi nutrisi pada makanan pekat dan gelap, serta ditakuti terhadap stroke, stroke, dan kolik. Penawarnya adalah minuman murni dan rempah-rempah."
