  "en": "Peripneumonia (inflammation of the lung)"
  "ur": "ذات الرئة"
"summary":
  "ar": "ذات الرئة ورم حار في الرئة، وقد يقع ابتداء وقد يتبع حدوث نوازل واستجالات،\
    \ وأمثال هذه تقتل إلى السابع، وإن قويت الطبيعة على نفث المادة فإنها في الأكثر\
    \ توقع في السل. وذات الرئة تكون أكثر ما تكون عن البلغم محتبساً فيه الخلط الرقيق،\
    \ كما أن أكثر ذات الجنب مراري بعكس هذا المعنى لأن العضو غشائي كثيف مستحصف فلا\
    \ ينفذ فيه إلا اللطيف الحاد، على أنه قد يكون من الدم وقد يكون من جنس الحمرة، وهو\
    \ قتال في الأكثر بحدته ومجاورته للقلب وقلة انتفاعه بالمشروب والمضمود فإن المشروب\
    \ لا يصل إليه وهو يحفظ من قوة تبريده ما يقابله والمضمود لا يؤدي إليه تبريداً يوازيه.\
    \ وذات الرئة قد تزول بالتحلل وقد تؤول إلى التقيح وقد تصلب وكثيراً ما تنتقل خراجات\
    \ وقد تنتقل إلى قرانيطس وهو رديء، وربما انتقل إلى ذات الجنب وهو في القليل النادر،\
    \ وقد يعقب خدراً مثل المذكور في ذات الجنب وهو أكثر عقاباً له {cite:canon-ibn-sina-print-v2\
    \ p.350}"
  "en": "Peripneumonia is a hot tumour in the lung; it may arise first or may follow\
    \ the occurrence of catarrhs and fluxes, and the likes of these kill by the seventh;\
    \ if nature is strong enough to expectorate the matter, it mostly falls into consumption.\
    \ Peripneumonia arises most often from phlegm with the thin humour retained in\
    \ it — just as most pleurisy is bilious, by the reverse of this reasoning, for\
    \ the organ is a dense, resistant membrane into which only the thin and sharp\
    \ penetrates — though it may also be from blood, and may be of the erysipelas\
    \ kind, and is mostly deadly by its acuteness, its neighbourhood to the heart,\
    \ and its little benefit from drink or poultice: the drink does not reach it,\
    \ it preserves itself against the power of the cooling that meets it, and the\
    \ poultice conveys no cooling to match it. Peripneumonia may depart by dissolution,\
    \ may end in suppuration, may harden, often turns into abscesses, and may pass\
    \ into quinsy — which is bad; rarely it turns into pleurisy, and it may be followed\
    \ by a numbness like that named under pleurisy, which more often follows it {cite:canon-ibn-sina-print-v2\
    \ p.350}"
  "ur": "ذات الرئة پھیپھڑے میں گرم ورم ہے جو ابتداء سے بھی ہو سکتا ہے اور نوازل اور\
    \ استجالات کے بعد بھی ایسے معاملے ساتویں تک قتل کر دیتے ہیں اور اگر طبیعت مادہ\
    \ نفث کرنے پر قادر ہو تو اکثر سل میں گرتا ہے۔ ذات الرئة اکثر بلغم سے ہوتی ہے جس\
    \ میں رقيق خلط محبوس ہو جیسے ذات الجنب اکثر مراری ہوتی ہے اس کے برعکس کیونکہ عضو\
    \ غشائی کثيف مزاحم ہے جس میں صرف لطيف حاد نفوذ کرتا ہے بہرحال وہ خون سے بھی ہو\
    \ سکتی ہے اور حمرة کی جنس سے بھی اور زیادہ تر اپنی حدت اور قلب سے قربت اور مشروب\
    \ و ضماد سے کم فائدہ کی وجہ سے قتل کرنے والی ہے کیونکہ مشروب اس تک نہیں پہنچتا\
    \ اور وہ ٹھنڈک کی قوت کا مقابلہ کرتی ہے اور ضماد اس تک برابر ٹھنڈک نہیں پہنچاتا۔\
    \ ذات الرئة تحلل سے زائل بھی ہو سکتی ہے تقيح پر بھی منتج ہو سکتی ہے سخت بھی ہو\
    \ سکتی ہے اور اکثر خراجات میں بدلتی ہے اور قرانيطس میں بھی منتقل ہو سکتی ہے جو\
    \ بری ہے اور کم اور نادر میں ذات الجنب میں منتقل ہوتی ہے اور اس کے بعد ذات الجنب\
    \ میں مذکور خدر جیسا خدر بھی ہو سکتا ہے جو اسے زیادہ پاتا ہے {cite:canon-ibn-sina-print-v2\
    \ p.350}"
