"summary":
  "ar": "ذات الرئة ورم حار في الرئة، وقد يقع ابتداء وقد يتبع حدوث نوازل واستجالات،\
    \ وأمثال هذه تقتل إلى السابع، وإن قويت الطبيعة على نفث المادة فإنها في الأكثر\
    \ توقع في السل. وذات الرئة تكون أكثر ما تكون عن البلغم محتبساً فيه الخلط الرقيق،\
    \ كما أن أكثر ذات الجنب مراري بعكس هذا المعنى لأن العضو غشائي كثيف مستحصف فلا\
    \ ينفذ فيه إلا اللطيف الحاد، على أنه قد يكون من الدم وقد يكون من جنس الحمرة، وهو\
    \ قتال في الأكثر بحدته ومجاورته للقلب وقلة انتفاعه بالمشروب والمضمود فإن المشروب\
    \ لا يصل إليه وهو يحفظ من قوة تبريده ما يقابله والمضمود لا يؤدي إليه تبريداً يوازيه.\
    \ وذات الرئة قد تزول بالتحلل وقد تؤول إلى التقيح وقد تصلب وكثيراً ما تنتقل خراجات\
    \ وقد تنتقل إلى قرانيطس وهو رديء، وربما انتقل إلى ذات الجنب وهو في القليل النادر،\
    \ وقد يعقب خدراً مثل المذكور في ذات الجنب وهو أكثر عقاباً له {cite:canon-ibn-sina-print-v2\
    \ p.350}"
  "en": "Peripneumonia is a hot tumour in the lung; it may arise first or may follow\
    \ the occurrence of catarrhs and fluxes, and the likes of these kill by the seventh;\
    \ if nature is strong enough to expectorate the matter, it mostly falls into consumption.\
    \ Peripneumonia arises most often from phlegm with the thin humour retained in\
    \ it — just as most pleurisy is bilious, by the reverse of this reasoning, for\
    \ the organ is a dense, resistant membrane into which only the thin and sharp\
    \ penetrates — though it may also be from blood, and may be of the erysipelas\
    \ kind, and is mostly deadly by its acuteness, its neighbourhood to the heart,\
    \ and its little benefit from drink or poultice: the drink does not reach it,\
    \ it preserves itself against the power of the cooling that meets it, and the\
    \ poultice conveys no cooling to match it. Peripneumonia may depart by dissolution,\
    \ may end in suppuration, may harden, often turns into abscesses, and may pass\
    \ into quinsy — which is bad; rarely it turns into pleurisy, and it may be followed\
    \ by a numbness like that named under pleurisy, which more often follows it {cite:canon-ibn-sina-print-v2\
    \ p.350}"
  "ur": "ذات الرئة پھیپھڑے میں گرم ورم ہے جو ابتداء سے بھی ہو سکتا ہے اور نوازل اور\
    \ استجالات کے بعد بھی ایسے معاملے ساتویں تک قتل کر دیتے ہیں اور اگر طبیعت مادہ\
    \ نفث کرنے پر قادر ہو تو اکثر سل میں گرتا ہے۔ ذات الرئة اکثر بلغم سے ہوتی ہے جس\
    \ میں رقيق خلط محبوس ہو جیسے ذات الجنب اکثر مراری ہوتی ہے اس کے برعکس کیونکہ عضو\
    \ غشائی کثيف مزاحم ہے جس میں صرف لطيف حاد نفوذ کرتا ہے بہرحال وہ خون سے بھی ہو\
    \ سکتی ہے اور حمرة کی جنس سے بھی اور زیادہ تر اپنی حدت اور قلب سے قربت اور مشروب\
    \ و ضماد سے کم فائدہ کی وجہ سے قتل کرنے والی ہے کیونکہ مشروب اس تک نہیں پہنچتا\
    \ اور وہ ٹھنڈک کی قوت کا مقابلہ کرتی ہے اور ضماد اس تک برابر ٹھنڈک نہیں پہنچاتا۔\
    \ ذات الرئة تحلل سے زائل بھی ہو سکتی ہے تقيح پر بھی منتج ہو سکتی ہے سخت بھی ہو\
    \ سکتی ہے اور اکثر خراجات میں بدلتی ہے اور قرانيطس میں بھی منتقل ہو سکتی ہے جو\
    \ بری ہے اور کم اور نادر میں ذات الجنب میں منتقل ہوتی ہے اور اس کے بعد ذات الجنب\
    \ میں مذکور خدر جیسا خدر بھی ہو سکتا ہے جو اسے زیادہ پاتا ہے {cite:canon-ibn-sina-print-v2\
    \ p.350}"
  "es": "La perineumonía es un tumor caliente en el pulmón; puede aparecer primero o después de catarros y flucones, y tales como estos matan al séptimo día; si la naturaleza es lo suficientemente fuerte como para expectorar la materia, generalmente se convierte en tisis. La perineumonía surge con mayor frecuencia de flema con humor delgado retenido en ella, así como la mayoría de las pleuresías son biliares, por el razonamiento inverso, ya que el órgano es una membrana densa y resistente en la que solo penetra lo delgado y afilado, aunque también puede ser de sangre, y puede ser del tipo erisipela, y es mayormente mortal por su agudeza, su proximidad al corazón y su poco beneficio de la bebida o el polvo: la bebida no la alcanza, se conserva contra el poder del enfriamiento que encuentra, y el polvo no transmite ningún enfriamiento que la iguale. La perineumonía puede desaparecer por disolución, puede terminar en supuración, puede endurecerse, a menudo se convierte en abscesos, y puede pasar a ampsy, que es malo; Rara vez se convierte en pleuresía, y puede ir seguida de un entumecimiento como el que se menciona en la pleuresía, que suele seguirla {cite:canon-ibn-sina-print-v2 p.350}"
  "fr": "La péripneumonie est une tumeur chaude du poumon; elle peut survenir avant ou après des catarrhes et des dysenteries, et ces dernières sont souvent mortelles au bout de sept jours. Si le corps est suffisamment robuste pour expectorer les sécrétions, la maladie évolue généralement en tuberculose. La péripneumonie est le plus souvent d'origine biliaire, car le poumon est une membrane dense et résistante que seuls les fluides fins et agressifs pénètrent. Elle peut aussi être d'origine sanguine et être de type érysipèle. Sa gravité est généralement due à son acuité, sa proximité avec le cœur et sa faible efficacité sous forme de boisson ou de cataplasme: la boisson ne l'atteint pas, elle se protège du froid et le cataplasme n'apporte aucun refroidissement suffisant. La péripneumonie peut se résorber spontanément, se suppurer, s'infiltrer, se transformer souvent en abcès et évoluer en angine, affection grave. Rarement elle se transforme en pleurésie, et elle peut être suivie d'un engourdissement semblable à celui décrit sous la pleurésie, qui la suit plus souvent {cite:canon-ibn-sina-print-v2 p.350}"
  "tr": "Zatürre, akciğerde sıcak bir tümördür; başlangıçta ortaya çıkabilir ve ardından komplikasyonlar ve sorgulamalar gelebilir. Bu tür vakalar yedinci güne kadar ölümcül olabilir. Doğa maddeyi üfleyecek kadar güçlü olsa da, en olası tüberkülozdadır. Zatürre, en çok balgam nedeniyle ortaya çıkar ve ince bir koku hapseder. Çoğu plevrez safra kesesi olur, bunun aksine, organ yoğun, membranlı ve sadece keskin ve nazik olan nüfuz eder. Kan olabilir veya kırmızı tipte olabilir. Daha şiddetlidir ve kalbe yakındır, içecek veya zatürreden fayda sağlamaz. İçecek ona ulaşmaz ve karşı tarafın soğutma gücünü korur, zatürre ise soğutmayı sağlamaz. Zatürre, çözünerek geçebilir ve irin haline gelebilir ya da sertleşebilir. Çoğu zaman, apseler korneaya bulaşabilir, bu kornea zayıftır ve nadiren görülen plevrite de yayılabilir; ardından çoğul ishal örneğinde belirtilen uyuşukluk daha cezalandırıcı olur {cite:canon-ibn-sina-print-v2 s.350}"
  "id": "Pneumonia adalah tumor panas di paru-paru, yang dapat terjadi pada awalnya dan diikuti oleh komplikasi serta pertanyaan. Kasus seperti ini bisa fatal hingga hari ketujuh. Meskipun alam cukup kuat untuk mengeluarkan zat ini, kemungkinan besar terjadi pada tuberkulosis. Pneumonia paling sering terjadi akibat dahak, yang menjebak halus humor. Sebagian besar pleurisy adalah kantong empedu, berbeda dengan ini karena organ ini padat, membran, dan hanya organ lembut yang tajam yang menembus. Bisa berupa darah atau tipe merah. Lebih parah dan dekat dengan jantung, dan minuman tidak mendapat manfaat dari minuman atau pneumonia. Minuman tidak mencapai puncaknya, dan mempertahankan gaya pendinginan dari yang berlawanan, sementara pneumonia tidak menyebabkan pendinginan yang sesuai. Pneumonia dapat sembuh dengan pelarutan dan berubah menjadi nanah, atau mengeras. Seringkali, abses dapat menular ke kornea, yang buruk, dan juga dapat menyebar ke pleuritis, yang jarang, dan diikuti oleh mati rasa seperti yang disebutkan pada kasus diare jamak, yang lebih berat {cite:canon-ibn-sina-print-v2 hlm.350}"
