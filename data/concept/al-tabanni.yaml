id: concept/al-tabanni
class: concept
kind: legal
label:
  ar: "التبنّي"
  en: "Adoption (tabanni)"
  ur: "تبنّی"
summary:
  ar: "يذكر الشعراوي أن الإسلام أبطل نسبة من لم يولد من الصلب إلى المتبنِّي، وأن الآية «وحلائل أبنائكم الذين من أصلابكم» تفيد أن الأبناء بالتبني كانوا معروفين في الجاهلية. ويربط ذلك بقصة زيد بن حارثة وزينب بنت جحش، ويرى أن الحكم جاء بالوحي لا بمجرد تشريع من النبي، وأن تزويج زيد بزينب كان تمهيداً لإبطال التبني {cite:tafsir-sharawi-khawatir-scan p. 2100}{cite:tafsir-sharawi-khawatir-scan p. 2101}{cite:tafsir-sharawi-khawatir-scan p. 2104}{cite:tafsir-sharawi-khawatir-scan p. 2105}{cite:tafsir-sharawi-khawatir-scan p. 2106}."
  en: "Al-Sha'rawi says Islam ended ascribing to an adopter a child not born of his loins. The phrase 'wives of your sons who are of your own loins' shows that adopted sons were known in pre-Islamic practice. He ties this to the story of Zayd ibn Haritha and Zaynab bint Jahsh and holds that the ruling came by revelation and not only as the Prophet's own legislation {cite:tafsir-sharawi-khawatir-scan p. 2100}{cite:tafsir-sharawi-khawatir-scan p. 2101}{cite:tafsir-sharawi-khawatir-scan p. 2104}{cite:tafsir-sharawi-khawatir-scan p. 2105}{cite:tafsir-sharawi-khawatir-scan p. 2106}."
  ur: "شعراوی بیان کرتے ہیں کہ اسلام نے ایسے بچے کو تبنّی کرنے والے کی طرف منسوب کرنے سے روکا جو اس کے صلب سے نہ ہو۔ ان کے مطابق زید بن حارثہ اور زینب بنت جحش کا واقعہ اس حکم کا پس منظر ہے، اور وہ کہتے ہیں کہ یہ حکم وحی سے آیا {cite:tafsir-sharawi-khawatir-scan p. 2100}{cite:tafsir-sharawi-khawatir-scan p. 2101}{cite:tafsir-sharawi-khawatir-scan p. 2104}{cite:tafsir-sharawi-khawatir-scan p. 2105}{cite:tafsir-sharawi-khawatir-scan p. 2106}۔"
wings: [ideas]
themes: [family-marriage-kinship]
issue:
  ar: "هل يثبت النسب بالتبني؟ وما أثر إبطاله في الزواج والمحرمات؟"
  en: "Does adoption confer lineage, and what did its abolition change in marriage and prohibitions?"
  ur: "کیا تبنّی سے نسب ثابت ہوتا ہے، اور اس کے ختم ہونے سے نکاح اور محرمات میں کیا تبدیلی آئی؟"
perspectives:
  - tradition: sunni
    id: sunni-sharawi-abolished-by-revelation
    stance:
      ar: "التبني لا يثبت النسب، والحكم بإبطاله جاء بالوحي"
      en: "Adoption does not establish lineage, and its abolition came by revelation"
      ur: "تبنّی سے نسب ثابت نہیں ہوتا، اور اس کا ختم ہونا وحی سے ہوا"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن النسب لا يثبت بالتبني، ويستدل بالآيات التي نزلت في القصة، ويقول إن ما فعله النبي كان تطبيقاً للحكم لا تشريعاً من نفسه {cite:tafsir-sharawi-khawatir-scan p. 2104}{cite:tafsir-sharawi-khawatir-scan p. 2105}."
      en: "Sha'rawi holds that adoption does not establish lineage, relying on the verses revealed on the occasion, and says what the Prophet did was carrying out the ruling and not legislating on his own {cite:tafsir-sharawi-khawatir-scan p. 2104}{cite:tafsir-sharawi-khawatir-scan p. 2105}."
      ur: "شعراوی کے مطابق تبنّی سے نسب ثابت نہیں ہوتا، وہ اس واقعے پر نازل آیات سے استدلال کرتے ہیں، اور کہتے ہیں کہ نبی کا عمل حکم پر عمل تھا نہ کہ اپنی طرف سے قانون سازی {cite:tafsir-sharawi-khawatir-scan p. 2104}{cite:tafsir-sharawi-khawatir-scan p. 2105}۔"
    sources: [source/tafsir-sharawi-khawatir-scan]
