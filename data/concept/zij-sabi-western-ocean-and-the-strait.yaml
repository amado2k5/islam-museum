label: { ar: "البحر الغربي أوقيانس والخليج المتصل بالبحر الرومي في الزيج الصابي", en: "The western ocean Oceanus and the strait to the Mediterranean", ur: "مغربی سمندر اوقیانس اور بحر روم سے ملانے والی آبنائے", es: "El océano occidental Oceanus y el estrecho hacia el Mediterráneo", fr: "L'océan Océan occidental et le détroit vers la Méditerranée" }
summary:
  ar: "يقول البتاني إن بحر أوقيانس الغربي، وهو المحيط، لا يُعرف منه إلا ما كان من ناحية الغرب والشمال، ولا تجري فيه السفن، وإن الجزائر الست التي فيه مقابل أرض الحبش هي الجزائر العامرة وتسمى أيضاً جزائر السعداء، وإن جزيرة أخرى مقابل الأندلس تسمى غديرة عند الخليج الذي يخرج منه إلى بحر الروم، وعرضه سبعة أميال بين الأندلس وطنجة، وإن في شماله اثنتي عشرة جزيرة بريطانية. {cite:zij-sabi-nallino-byblion p.30}."
  en: "Al-Battani says of the western ocean Oceanus, the encircling ocean, that only its western and northern parts are known and no ships run in it; that its six islands opposite Abyssinian land are the Inhabited Islands, also called the Islands of the Blessed; that another island opposite al-Andalus called Gadira lies at the strait from which it flows to the sea of the Romans, seven miles wide between al-Andalus and Tangier; and that in its north lie twelve British islands. {cite:zij-sabi-nallino-byblion p.30}."
  ur: "البتانی بحر اوقیانس مغربی کے بارے میں، جو محیط ہے، کہتے ہیں کہ اس کا صرف مغرب اور شمال کی طرف کا حصہ معلوم ہے اور اس میں کشتیاں نہیں چلتیں؛ اس کے چھ جزیرے جو حبش کی زمین کے مقابل ہیں جزائر عامرہ ہیں اور جزائر سعداء بھی کہلاتے ہیں؛ ایک اور جزیرہ اندلس کے مقابل غدیرہ ہے اس آبنائے پر جہاں سے وہ بحر روم کی طرف نکلتا ہے، جس کی چوڑائی اندلس اور طنجہ کے بیچ سات میل ہے؛ اور اس کے شمال میں بارہ برطانوی جزیرے ہیں۔ {cite:zij-sabi-nallino-byblion p.30}۔"
  es: "Al-Battani dice del océano occidental Oceanus, el océano que lo rodea, que solo se conocen sus partes occidental y septentrional y que ningún barco navega en él; que sus seis islas frente a la tierra de Abisinia son las Islas Habitadas, también llamadas las Islas de los Bienaventurados; que otra isla frente a al-Ándalus, llamada Gadira, se encuentra en el estrecho desde el cual desemboca en el mar de los romanos, de siete millas de ancho entre al-Ándalus y Tánger; y que en su norte se encuentran doce islas británicas. {cite:zij-sabi-nallino-byblion p.30}."
  fr: "Al-Battani dit de l'océan occidental, l'Océan, que seules ses parties occidentale et septentrionale sont connues et qu'aucun navire n'y navigue; que ses six îles face à l'Abyssinie sont les Îles Habitées, également appelées Îles des Bienheureux; qu'une autre île face à al-Andalus, nommée Gadira, se situe au détroit d'où il se jette dans la mer des Romains, large de sept milles entre al-Andalus et Tanger; et qu'au nord se trouvent douze îles britanniques. {cite:zij-sabi-nallino-byblion p.30}."
