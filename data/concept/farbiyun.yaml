summary:
  ar: "الفربيون في الكتاب صمغ شجرة شبيهة بالقثاء مفرط الحرافة والحرارة، يستخرجه مستخرجوه من بعد خوفا من حرارته، وجيده الحديث الصافي الأصفر إلى الشقرة، حار فيه قوة محرقة جلاءة، ينفع من عرق النسا ويجلو العين ويسهل البلغم، ويحذر الكتاب من أنه قاتل بالتقريح {cite:canon-ibn-sina-print-v1 pp.628-629}"
  en: "Farbiyun is in the book the gum of a tree like the cucumber in shape, excessively pungent and hot, which gatherers take from a distance for fear of its heat; the best is the new, clear one, yellow to fair; it is hot, with a burning, cleansing power, benefits sciatica, cleanses the eye and loosens phlegm, and the book warns that it kills by ulcerating {cite:canon-ibn-sina-print-v1 pp.628-629}"
  ur: "فربیون کتاب میں ککڑی سے ملتے جلتے درخت کا گوند ہے، حد سے زیادہ تیز اور گرم، جسے جمع کرنے والے اس کی گرمی کے ڈر سے دور سے نکالتے ہیں؛ بہترین نیا، صاف، زردی سے سنہری مائل ہے؛ گرم ہے، جلانے اور جلاء دینے کی قوت رکھتا ہے، عرق النسا میں نافع ہے، آنکھ کو صاف کرتا اور بلغم نکالتا ہے، اور کتاب خبردار کرتی ہے کہ زخم بنا کر ہلاک کرتا ہے {cite:canon-ibn-sina-print-v1 pp.628-629}۔"
  es: "Farbiyun es en el libro la goma de un árbol con forma de pepino, excesivamente picante y caliente, que los recolectores toman de lejos por temor a su calor; la mejor es la nueva, clara, de color amarillo a claro; es caliente, con un poder ardiente y purificador, beneficia la ciática, limpia el ojo y afloja la flema, y el libro advierte que mata por ulceración {cite:canon-ibn-sina-print-v1 pp.628-629}"
  fr: "Le Farbiyun est décrit dans le livre comme la gomme d'un arbre ressemblant à un concombre, extrêmement piquante et brûlante, que les cueilleurs prélèvent à distance par crainte de sa chaleur; la meilleure est la gomme fraîche, limpide, jaune à claire; elle est brûlante, possède un pouvoir purifiant et tonique, soulage la sciatique, purifie les yeux et fluidifie les mucosités, et le livre met en garde contre son pouvoir mortel d'ulcération {cite:canon-ibn-sina-print-v1 pp.628-629}"
