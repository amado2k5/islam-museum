label: { ar: "خط الشكسته", en: "Shikasta script", ur: "خطِ شکستہ", es: "Escritura Shikasta", fr: "Écriture Shikasta", tr: "Kırık Çizgi", id: "Garis Putus" }
summary:
  ar: "خط فارسي معناه «المكسور»، نشأ في إيران بعد القرن العاشر الهجري، يصل حروفًا لا تتصل عادة فيكتب الكلمة بضربة واحدة، ووصفته مريم اختيار بأنه الاختزال الفارسي، ومنه الشكسته نستعليق للمراسيم والرسائل {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 26} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 47}."
  en: "A Persian script whose name means \"broken\", developed in Iran after the sixteenth century; it links normally unjoined letters so a word can be written in one stroke — the Persian equivalent of shorthand — and gave rise to shikasta-nasta'liq for edicts and letters {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 26} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 47}."
  ur: "ایک فارسی خط جس کے معنی «ٹوٹا ہوا» ہیں، سولہویں صدی کے بعد ایران میں بنا؛ عام طور پر الگ رہنے والے حروف جوڑ کر لفظ ایک ضرب میں لکھا جا سکتا ہے — گویا فارسی مختصر نویسی — اور اسی سے فرامین و خطوط کا شکستہ نستعلیق نکلا {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 26} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 47}۔"
  es: "Un sistema de escritura persa cuyo nombre significa \"roto\", desarrollado en Irán después del siglo XVI; une letras normalmente separadas para que una palabra pueda escribirse de un solo trazo —el equivalente persa de la taquigrafía— y dio origen al shikasta-nasta'liq para edictos y cartas {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 26} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 47}."
  fr: "Une écriture persane dont le nom signifie « brisée », développée en Iran après le XVIe siècle; elle relie des lettres normalement non jointes afin qu'un mot puisse être écrit en un seul trait — l'équivalent persan de la sténographie — et a donné naissance au shikasta-nasta'liq pour les édits et les lettres {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 26} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 47}."
  tr: "Farsça 'kırık' anlamına gelen bir alfabe, 10. yüzyıldan sonra İran'da ortaya çıkmıştır. Genellikle birbirine bağlanmayan harfleri birbirine bağlar, bu yüzden kelime tek bir çizgiyle yazılır. Maryam İhtiyar bunu Farsça kısaltma olarak tanımlamıştır, bu yüzden 'Shakshata' (fermanları ve harfleri yorumluyoruz {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 s. 26} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 s. 27} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 s. 47})."
  id: "Aksara Persia yang berarti 'rusak' berasal dari Iran setelah abad ke-10 H. Aksara ini menghubungkan huruf-huruf yang biasanya tidak terhubung, sehingga kata tersebut ditulis dengan satu goresan. Maryam Ikhtiyar menggambarkannya sebagai singkatan Persia, sehingga 'Shakshata' (kami menafsirkan dekret dan huruf {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 hlm. 26} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 hlm. 27} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 hlm. 47}."
