label: { ar: "خط الشكسته", en: "Shikasta script", ur: "خطِ شکستہ" }
summary:
  ar: "خط فارسي معناه «المكسور»، نشأ في إيران بعد القرن العاشر الهجري، يصل حروفًا لا تتصل عادة فيكتب الكلمة بضربة واحدة، ووصفته مريم اختيار بأنه الاختزال الفارسي، ومنه الشكسته نستعليق للمراسيم والرسائل {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 26} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 47}."
  en: "A Persian script whose name means \"broken\", developed in Iran after the sixteenth century; it links normally unjoined letters so a word can be written in one stroke — the Persian equivalent of shorthand — and gave rise to shikasta-nasta'liq for edicts and letters {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 26} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 47}."
  ur: "ایک فارسی خط جس کے معنی «ٹوٹا ہوا» ہیں، سولہویں صدی کے بعد ایران میں بنا؛ عام طور پر الگ رہنے والے حروف جوڑ کر لفظ ایک ضرب میں لکھا جا سکتا ہے — گویا فارسی مختصر نویسی — اور اسی سے فرامین و خطوط کا شکستہ نستعلیق نکلا {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 26} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 47}۔"
