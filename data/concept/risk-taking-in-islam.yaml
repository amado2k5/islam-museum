id: concept/risk-taking-in-islam
class: concept
kind: term
tags: [islamic-economy-browser, islamic-economy-money]
label:
  ar: "المخاطرة في الإسلام"
  en: "Risk-taking in Islam"
  es: "Asumir riesgos en el Islam"
  fr: "La prise de risque en islam"
  ur: "اسلام میں خطرہ مول لینا"
  tr: "İslam'da Risk"
  id: "Risiko dalam Islam"
summary:
  ar: "يرى المؤلف أن المخاطرة عائد المنظّم، وأن الإسلام عوّد الناس على ركوب المخاطر المشروعة، فمنع الكسب بلا مخاطرة، فالقرض ذو الفائدة المضمونة لا يجوز، والقراض بحصة من الربح الاحتمالي جائز، ويتحمل رب المال الخسارة {cite:usul-iqtisad-islami-0660 p. 116}. وربط الإسلام المخاطرة بالثواب الأخروي وبالضمان الاجتماعي الدنيوي {cite:usul-iqtisad-islami-0660 p. 113}."
  tr: "Yazar, riskin düzenleyicinin getirisi olduğuna ve İslam'ın insanları meşru riskler almaya alıştırdığına, böylece risksiz kârı yasakladığına inanır. Garantili faizli bir kredi kabul edilemez ve potansiyel kârın bir payıyla borçlanmak izinlidir, paranın sahibi ise zararı üstlenir {cite:usul-iqtisad-islami-0660 s. 116}. İslam, riski manevi ödül ve dünyevi sosyal güvenlikle ilişkilendirmiştir {cite:usul-iqtisad-islami-0660 s. 113}."
  id: "Penulis percaya bahwa risiko adalah pengembalian regulator, dan bahwa Islam membiasakan orang untuk mengambil risiko yang sah, sehingga melarang keuntungan tanpa risiko. Pinjaman dengan bunga yang dijamin tidak diperbolehkan, dan meminjam dengan bagian dari potensi keuntungan diperbolehkan, dan pemilik uang menanggung kerugian {cite:usul-iqtisad-islami-0660 hlm. 116}. Islam mengaitkan risiko dengan imbalan spiritual dan jaminan sosial duniawi {cite:usul-iqtisad-islami-0660 hlm. 113}."
