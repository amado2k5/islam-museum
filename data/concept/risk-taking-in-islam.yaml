summary:
  ar: "يرى المؤلف أن المخاطرة عائد المنظّم، وأن الإسلام عوّد الناس على ركوب المخاطر المشروعة، فمنع الكسب بلا مخاطرة، فالقرض ذو الفائدة المضمونة لا يجوز، والقراض بحصة من الربح الاحتمالي جائز، ويتحمل رب المال الخسارة {cite:usul-iqtisad-islami-0660 p. 116}. وربط الإسلام المخاطرة بالثواب الأخروي وبالضمان الاجتماعي الدنيوي {cite:usul-iqtisad-islami-0660 p. 113}."
