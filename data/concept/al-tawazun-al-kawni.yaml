id: concept/al-tawazun-al-kawni
class: concept
kind: belief
label:
  ar: "التوازن الكوني"
  en: "The balance of creation (al-tawazun al-kawni)"
  fr: "L’équilibre de la création (al-tawazun al-kawni)"
  ur: "کائناتی توازن"
  es: "El equilibrio de la creación (al-tawazun al-kawni)"
  tr: "Kozmik Denge"
  id: "Keseimbangan Kosmik"
summary:
  ar: "يرى عمر عبد الكافي أن الكون متوازن كما خلقه الله، وأن تدخل الإنسان فيه يفسده، ويضرب مثلًا بحملة صينية على طائر الدوري تبعها هجوم الجراد، ويبدي رأيه الشخصي في حبس الطيور والحيوانات في الأقفاص."
  en: "Omar Abdelkafy holds that creation is balanced as God made it and that human interference spoils it, citing a Chinese campaign against sparrows followed by a plague of locusts, and gives his personal view on keeping birds and animals in cages."
  fr: "Omar Abdelkafy estime que la création est équilibrée telle que Dieu l’a faite et que l’intervention humaine rompt cet équilibre. Il cite l’exemple d’une campagne chinoise contre les moineaux suivie d’une invasion de criquets, et donne son avis personnel sur la mise en cage des oiseaux et des autres animaux."
  ur: "عمر عبد الکافی کے نزدیک کائنات اسی توازن پر ہے جس پر اللہ نے اسے بنایا اور انسانی مداخلت اسے بگاڑ دیتی ہے؛ وہ چڑیوں کے خلاف ایک چینی مہم کی مثال دیتے ہیں جس کے بعد ٹڈی دل آیا، اور پرندوں اور جانوروں کو پنجروں میں رکھنے پر اپنی ذاتی رائے دیتے ہیں۔"
  es: "Omar Abdelkafy sostiene que la creación está en equilibrio tal como Dios la creó y que la interferencia humana la estropea, citando una campaña china contra los gorriones seguida de una plaga de langostas, y expone su punto de vista personal sobre mantener aves y animales en jaulas."
  tr: "Omar Abdelkafi, evrenin Tanrı'nın yarattığı gibi dengeli olduğuna ve insan müdahalesinin onu yozlaştırdığına inanır. Çin'in Dorian kuşuna yönelik kampanyasını ve ardından çekirge saldırılarını örnek olarak veriyor ve kuşların ve hayvanların kafeslerde hapsedilmesi konusundaki kişisel görüşünü dile getiriyor."
  id: "Omar Abdelkafi percaya bahwa alam semesta seimbang karena Tuhan menciptakannya dan bahwa intervensi manusia merusaknya. Ia mengutip kampanye Tiongkok melawan burung Dorian dan serangan belalang berikutnya sebagai contoh, mengungkapkan pandangan pribadinya tentang pemenjaraan burung dan hewan dalam kandang."
