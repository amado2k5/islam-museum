label:
  ar: "التوازن الكوني"
  en: "The balance of creation (al-tawazun al-kawni)"
  ur: "کائناتی توازن"
summary:
  ar: "يرى عمر عبد الكافي أن الكون متوازن كما خلقه الله، وأن تدخل الإنسان فيه يفسده، ويضرب مثلًا بحملة صينية على طائر الدوري تبعها هجوم الجراد، ويبدي رأيه الشخصي في حبس الطيور والحيوانات في الأقفاص."
  en: "Omar Abdelkafy holds that creation is balanced as God made it and that human interference spoils it, citing a Chinese campaign against sparrows followed by a plague of locusts, and gives his personal view on keeping birds and animals in cages."
  ur: "عمر عبد الکافی کے نزدیک کائنات اسی توازن پر ہے جس پر اللہ نے اسے بنایا اور انسانی مداخلت اسے بگاڑ دیتی ہے؛ وہ چڑیوں کے خلاف ایک چینی مہم کی مثال دیتے ہیں جس کے بعد ٹڈی دل آیا، اور پرندوں اور جانوروں کو پنجروں میں رکھنے پر اپنی ذاتی رائے دیتے ہیں۔"
