id: concept/istihsan
class: concept
kind: legal
label:
  ar: "الاستحسان"
  en: "Istihsan (juristic preference)"
  ur: "استحسان"
summary:
  ar: "الاستحسان في أصول الفقه مسألة مختلف في حقيقتها: قيل هو دليل ينقدح في نفس المجتهد ويعسر عليه التعبير عنه، وقيل العدول عن قياس إلى قياس أقوى، وقيل تخصيص قياس بأقوى منه؛ يحكي الشوكاني نسبته إلى الحنفية والحنابلة وإنكار الجمهور له، ويرده ابن حزم الظاهري ويراه اتباعاً للهوى. {cite:irshad-al-fuhul-dar-al-fikr p.242} {cite:muhalla-dar-ibn-hazm-2016-v1 p.454}"
  en: "Istihsan in legal theory is disputed in its very definition: an argument that arises in the jurist's mind but is hard to express; departing from one analogy to a stronger one; or restricting an analogy by something stronger. Al-Shawkani reports it attributed to the Hanafis and Hanbalis and rejected by the majority; the Zahiri Ibn Hazm rejects it as following one's desire."
  ur: "اصولِ فقہ میں استحسان کی حقیقت ہی میں اختلاف ہے: کہا گیا کہ یہ مجتہد کے دل میں ابھرنے والی دلیل ہے جسے بیان کرنا مشکل ہو، یا ایک قیاس سے زیادہ قوی قیاس کی طرف عدول، یا کسی قیاس کی زیادہ قوی دلیل سے تخصیص؛ شوکانی اس کی نسبت حنفیہ اور حنابلہ کی طرف اور جمہور کا انکار نقل کرتے ہیں، اور ظاہری ابن حزم اسے خواہش کی پیروی کہہ کر رد کرتے ہیں۔"
