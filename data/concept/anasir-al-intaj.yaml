label:
  ar: عناصر الإنتاج في القرآن
  en: Factors of production in the Qur'an
summary:
  ar: "يعدّ قعدات الأرض والعمل العنصرين الأصليين في الإنتاج، ويرى أن رأس المال والمنظم عنصران ثانويان يتفرعان عنهما، وأن الاقتصاد الحديث أضافهما إلى الأصلين {cite:qadan-manhaj-iqtisad-quran p. 55}. ويضيف دافعاً روحياً للإنتاج: الامتثال لأمر الخالق في السعي، وتقوية مركز الفرد دون استعطاف أحد، والرفع من شأن الجماعة {cite:qadan-manhaj-iqtisad-quran p. 48}. ويرى أن رأس المال يعامل شريكاً في الإنتاج لا العنصر الرئيس فيه، وأن المنظم إنسان كغيره من أهل العمل لا يبلغ درجة القداسة {cite:qadan-manhaj-iqtisad-quran p. 55}{cite:qadan-manhaj-iqtisad-quran p. 56}. يعدّ المؤلف عوامل الإنتاج المستقلة الأرض والعمل ورأس المال، والتابعة المخاطرة والزمن، ويرى أن المخاطرة عائد المنظم، وأن كل من التابعين لا ينتج وحده بل ينضم إلى عمل أو مال أو أرض."
