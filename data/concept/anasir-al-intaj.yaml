summary:
  ar: "يعدّ قعدات الأرض والعمل العنصرين الأصليين في الإنتاج، ويرى أن رأس المال والمنظم عنصران ثانويان يتفرعان عنهما، وأن الاقتصاد الحديث أضافهما إلى الأصلين {cite:qadan-manhaj-iqtisad-quran p. 55}. ويضيف دافعاً روحياً للإنتاج: الامتثال لأمر الخالق في السعي، وتقوية مركز الفرد دون استعطاف أحد، والرفع من شأن الجماعة {cite:qadan-manhaj-iqtisad-quran p. 48}. ويرى أن رأس المال يعامل شريكاً في الإنتاج لا العنصر الرئيس فيه، وأن المنظم إنسان كغيره من أهل العمل لا يبلغ درجة القداسة {cite:qadan-manhaj-iqtisad-quran p. 55}{cite:qadan-manhaj-iqtisad-quran p. 56}. يعدّ المؤلف عوامل الإنتاج المستقلة الأرض والعمل ورأس المال، والتابعة المخاطرة والزمن، ويرى أن المخاطرة عائد المنظم، وأن كل من التابعين لا ينتج وحده بل ينضم إلى عمل أو مال أو أرض."
  tr: "Toprağın topraklarını ve emeği üretimin orijinal unsurları olarak görür ve sermaye ile düzenleyiciyi bunlardan ayrılan ikincil unsurlar olarak görür ve modern ekonominin bunları iki kökene eklediğini {cite:qadan-manhaj-iqtisad-kur'an s. 55} Üretim için manevi bir motivasyon ekler: çabada Yaratıcı'nın emrine itaat, kimsenin sempatisini aramadan bireyin konumunu güçlendirmek ve topluluğun statüsünü yükseltmek {cite:qadan-manhaj-iqtisad-kur'an s. 48}. Sermayenin üretimde ana unsur olarak değil, ortak olarak ele alındığına ve organizatörün diğer işçiler gibi kutsallık seviyesine ulaşamayan bir insan olduğuna inanır {cite:qadan-manhaj-iqtisad-kuran s. 55} {cite:qadan-manhaj-iqtisad-kuran s. 56}. Yazar, bağımsız üretim faktörlerini toprak, emek, sermaye ve bağımlı risk ile zaman olarak ele alır ve riski düzenleyicinin getirisi olarak görür; her bağımlının tek başına üretmediğini, emeği, parayı veya toprağı birleştirdiğini görür."
