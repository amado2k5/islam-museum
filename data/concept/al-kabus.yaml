label:
  ar: "الكابوس"
  en: "Al-kabus (incubus)"
  fr: "Al-kabus (incube)"
  ur: "کابوس"
  es: "Al-kabus (íncubo)"
summary:
  ar: "يصف ابن سينا الكابوس، ويسمى الخانق والجاثوم والنيدلان، بأنه مرض يحس فيه الإنسان عند دخوله في النوم خيالاً ثقيلاً يقع عليه ويعصره، وأنه مقدمة للصرع أو السكتة أو المانيا إذا كان من مواد مزدحمة، ويذكر أسبابه {cite:canon-ibn-sina-print-v2 p.117} {cite:canon-ibn-sina-print-v2 p.118}"
  en: "Ibn Sina describes al-kabus, also called the strangler, al-jathum and al-nidalan, as an illness in which, on entering sleep, a person senses a heavy image fall on him and squeeze him, a forerunner of epilepsy, apoplexy or mania when it is from crowded matter, and gives its causes {cite:canon-ibn-sina-print-v2 p.117} {cite:canon-ibn-sina-print-v2 p.118}"
  fr: "Ibn Sina décrit l’al-kabus, aussi nommé l’étrangleur, al-jathum et al-nidalan, comme une maladie où, à l’endormissement, la personne sent une image pesante s’abattre sur elle et la comprimer. Il y voit un signe avant-coureur de l’épilepsie, de l’apoplexie ou de la manie quand le mal vient d’un amas de matières, et en expose les causes {cite:canon-ibn-sina-print-v2 p.117} {cite:canon-ibn-sina-print-v2 p.118}"
  ur: "ابن سینا کابوس کو، جسے خانق، جاثوم اور نیدلان بھی کہتے ہیں، ایسا مرض بتاتا ہے جس میں انسان نیند میں داخل ہوتے وقت ایک بھاری خیال اپنے اوپر گرتا اور اسے بھینچتا محسوس کرتا ہے، جو ہجوم کیے ہوئے مواد سے ہو تو صرع، سکتے یا مانیا کی تمہید ہے، اور اس کے اسباب بیان کرتا ہے {cite:canon-ibn-sina-print-v2 p.117} {cite:canon-ibn-sina-print-v2 p.118}۔"
  es: "Ibn Sina describe al-kabus, también llamado el estrangulador, al-jathum y al-nidalan, como una enfermedad en la que, al entrar en sueño, una persona siente que una imagen pesada cae sobre ella y la oprime, precursora de la epilepsia, la apoplejía o la manía cuando se debe a la acumulación de materia, y da sus causas {cite:canon-ibn-sina-print-v2 p.117} {cite:canon-ibn-sina-print-v2 p.118}"
