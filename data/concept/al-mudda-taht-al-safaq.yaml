id: "concept/al-mudda-taht-al-safaq"
class: "concept"
kind: "scientific"
label:
  ar: "المدة تحت الصفاق"
  en: "Pus under the membrane (opening)"
  fr: "Le pus sous la membrane (ouverture)"
  ur: "صفاق کے نیچے پیپ ⁦(آغاز)⁩"
summary:
  ar: "قد تحتبس مدة تحت القرنية إما في العمق وإما في القرب فيشبه موضع القرنية الظفرة وإذا تأكلت معه شظية سمي قلقطاناً ⁦(الفصل يبدأ هنا ويستكمل في الحزمة التالية)⁩ {cite:canon-ibn-sina-print-v2 p.180}"
  en: "Pus may be held under the cornea, either deep or near the surface, so that the cornea's spot resembles the pterygium; if a splinter corrodes with it it is called qalqatan — (the chapter opens here and continues in the next packet) {cite:canon-ibn-sina-print-v2 p.180}"
  fr: "Le pus peut être retenu sous la cornée, soit en profondeur, soit près de la surface, de sorte que la tache de la cornée ressemble au ptérygion ; si un éclat ronge avec lui, on l'appelle qalqatan (le chapitre s'ouvre ici et se poursuit dans le paquet suivant) {cite:canon-ibn-sina-print-v2 p.180}"
  ur: "قرنیہ کے نیچے پیپ قید ہو سکتی ہے — یا گہرائی میں یا قرب میں — جس سے قرنیہ کا مقام ظفرہ جیسا لگتا ہے؛ اگر ساتھ کوئی شظیہ کٹ جائے تو اسے قلقطان کہتے ہیں ⁦(یہ فصل یہاں کھلتی ہے اور اگلی حزم میں جاری رہے گی)⁩ {cite:canon-ibn-sina-print-v2 p.180}"
