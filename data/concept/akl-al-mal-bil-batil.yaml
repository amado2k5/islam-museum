id: concept/akl-al-mal-bil-batil
class: concept
kind: ethical
label:
  ar: "أكل المال بالباطل"
  en: "Consuming wealth by falsehood"
summary:
  ar: "يرى الشعراوي أن الحركة في المال يحكمها الحق الثابت لا الباطل الزائل، وأن الأكل بالباطل يشمل السرقة والغصب والغش والخيانة والرشوة، وأن من أكل بالباطل جاع بحق، وأن الأمانة في العمل والكسب الحلال شرط لقبول الصدقة. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.797}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.798}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.799}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.800}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.803}"
  en: "Sha'rawi holds that movement in wealth is governed by the lasting truth and not by the passing falsehood; that consuming by falsehood includes theft, seizure, fraud, betrayal of trust and bribery; that whoever eats by falsehood goes hungry in truth; and that honest earning is a condition of accepted charity {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.797}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.798}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.799}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.800}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.803}."
wings: [ideas]
themes: [ethics-and-character, the-poor-and-the-worker]
periods: [period/prophetic-era]
regions: [arabia]
issue:
  ar: "ما الذي يحرم الكسب ويحل المال، وهل يبرئ حكم الحاكم أو قانونه من أكل المال بالباطل؟"
  en: "What makes earning unlawful and wealth lawful, and does a ruler's permission or law clear one of consuming wealth by falsehood?"
perspectives:
  - tradition: sunni
    id: sharawi-wealth-falsehood
    stance:
      ar: "الأكل بالباطل حرام ولو أباحه الحاكم، والكسب الحلال شرط قبول الصدقة"
      en: "Consuming by falsehood is unlawful even if a ruler permits it; lawful earning is a condition of accepted charity"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يذكر الشعراوي أن الآية نهت عن أكل الأموال بالباطل والإدلاء بها إلى الحكام، وأن الحاكم لا يبيح ما حرمه الله، وأن الذي يتصدق من مال حرام لا يقبل الله صدقته، ويقول إن الكتمان والمنكر لا يُعطيان براءة. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.800}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.803}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.804}"
      en: "Sha'rawi says the verse forbids consuming wealth by falsehood and bringing it before rulers; that a ruler does not make lawful what God forbade; and that God does not accept charity from unlawful wealth. He cites the Prophet's words that a judgement in someone's favour in a wrong is a piece of Fire, attributed to Bukhari and Muslim in the footnotes {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.800}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.803}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.804}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
  - tradition: sunni
    id: scope-note-legal-detail
    stance:
      ar: "تفاصيل الفقهاء في العقود والمعاملات وحدود الحلال لم تُدخل في هذه الدفعة"
      en: "The jurists' detail on contracts, transactions and the limits of lawful gain is not entered in this batch"
    holders: []
    summary:
      ar: "لم تُدخل هنا أحكام المعاملات عند الفقهاء، ولا الرأي الأكاديمي، ولا الآراء الأخرى. أمثلة الشعراوي عن الفنون والأعمال في زمنه رأيه وحده. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.800}"
      en: "The jurists' rules of transactions, the academic view and other views are not entered; Sha'rawi's examples of arts and work in his time are his own view {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.800}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
