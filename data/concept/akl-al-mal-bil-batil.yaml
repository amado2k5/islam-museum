id: concept/akl-al-mal-bil-batil
class: concept
kind: ethical
label:
  ar: "أكل المال بالباطل"
  en: "Consuming wealth unjustly (akl al-mal bil-batil)"
  ur: "ناحق مال کھانا"
summary:
  ar: "يقرأ الشعراوي قوله تعالى «لا تأكلوا أموالكم بينكم بالباطل» على أنه أمر لكل فرد ألا يأكل مال غيره بالباطل، ويعدّ من الباطل الربا والسرقة والاختلاس والرشوة والغش والميسر، ويرى أن التجارة عن تراض هي المخرج المشروع، وأن الاجتماع على المأكل لا يدخل في الباطل. ويبني ذلك على أن حفظ مال كل فرد يحمي حركة المجتمع كله {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2141}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2142}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2143}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2144}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2145}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2146}."
  en: "Al-Sha'rawi reads the verse 'do not consume your wealth among yourselves in falsehood' as a command to each person not to take another's wealth unjustly. He counts usury, theft, embezzlement, bribery, cheating and gambling as falsehood, and holds that trade by mutual consent is the lawful way. Eating together with relatives and friends is not falsehood. He grounds this in the view that protecting each person's wealth protects the movement of the whole society {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2141}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2142}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2143}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2144}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2145}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2146}."
  ur: "شعراوی آیت «لا تأکلوا أموالکم بینکم بالباطل» کو ہر فرد کے لیے حکم سمجھتے ہیں کہ وہ دوسرے کا مال ناحق نہ کھائے۔ وہ سود، چوری، خیانت، رشوت، دھوکہ اور جوا کو باطل میں شمار کرتے ہیں، اور باہمی رضامندی کی تجارت کو جائز راستہ قرار دیتے ہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2141}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2143}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2145}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2146}۔"
wings: [ideas]
themes: [trade-and-finance]
issue:
  ar: "ما الذي يجعل أخذ المال باطلاً، وما المخرج المشروع من المعاملات؟"
  en: "What makes taking wealth unlawful, and what is the lawful way of dealing?"
  ur: "مال لینا ناحق کب بنتا ہے، اور معاملات کا جائز راستہ کیا ہے؟"
perspectives:
  - tradition: sunni
    id: sunni-sharawi-list-and-consent
    stance:
      ar: "الباطل أخذ المال بغير حقه كالربا والسرقة والرشوة والغش، والتجارة عن تراض هي المخرج"
      en: "Falsehood is taking wealth without right, such as usury, theft, bribery and cheating; trade by mutual consent is the way out"
      ur: "باطل یہ ہے کہ مال بغیر حق کے لیا جائے، جیسے سود، چوری، رشوت اور دھوکہ؛ باہمی رضامندی کی تجارت جائز راستہ ہے"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يذكر الشعراوي هذه الأمثلة ويعدّ الميسر والغش والاختلاس من أكل المال بالباطل، ويستدل بحديث أم سلمة في القضاء {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2145}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2146}. ويذكر أن المسلمين تحرجوا من الأكل عند إخوانهم حتى نزلت آية النور {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2143}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2144}."
      en: "Sha'rawi gives these examples and counts gambling, cheating and embezzlement as eating wealth unjustly, and cites the report of Umm Salama on judging by evidence {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2145}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2146}. He says the Muslims were scrupulous about eating at their brothers' houses until the verse of al-Nur was revealed {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2143}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2144}."
      ur: "شعراوی یہ مثالیں دیتے ہیں اور جوا، دھوکہ اور خیانت کو ناحق مال کھانا شمار کرتے ہیں، اور ام سلمہ کی روایت کا ذکر کرتے ہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2145}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2146}۔ وہ بیان کرتے ہیں کہ مسلمان بھائیوں کے گھر کھانے سے احتیاط کرتے تھے یہاں تک کہ سورۃ النور کی آیت نازل ہوئی {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2143}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2144}۔"
    sources: [source/tafsir-sharawi-khawatir-scan-vol-2]
