    en: The same signs with Gog and Magog and Jesus killing the Dajjal
  summary:
    ar: يذكر ابن قدامة من أشراط الساعة خروج الدجال ونزول عيسى ابن مريم فيقتله، وخروج يأجوج ومأجوج، وخروج الدابة، وطلوع الشمس من مغربها، «وأشباه ذلك مما صح به النقل».
    en: Ibn Qudama lists among the signs of the Hour the coming of the Dajjal and the descent of Jesus who kills him, the coming of Gog and Magog, the emergence of the beast and the rising of the sun from the west, and the like of what is soundly reported.
