id: concept/ashrat-al-saa
education:
  did_you_know:
    ar: "من أشراط الساعة في عقيدة الطحاوي: خروج الدجال، ونزول عيسى ابن مريم من السماء، وطلوع الشمس من مغربها، وخروج دابة الأرض من موضعها."
    en: "Among the Hour's signs in al-Tahawi's creed: the Dajjal's emergence, Jesus son of Mary's descent from the sky, the sun rising from its west, and the earth's beast coming forth."
    ur: "طحاوی کے عقیدے میں قیامت کی نشانیوں میں ہے: دجال کا نکلنا، عیسیٰ ابن مریم کا آسمان سے اتارنا، سورج کا مغرب سے طلوع اور زمین کا جانور نکلنا۔"
    sources: [source/aqida-tahawiyya, source/maqalat-islamiyyin]
class: concept
kind: doctrine
label:
  ar: أشراط الساعة
  en: Signs of the Hour
summary:
  ar: 'قول الطحاوي بالإيمان بأشراط الساعة: خروج الدجال، ونزول عيسى ابن مريم من السماء، وطلوع الشمس من مغربها، وخروج دابة الأرض من موضعها.'
  en: 'al-Tahawi''s statement of belief in the signs of the Hour: the coming of the Dajjal, the descent of Jesus son of Mary from heaven, the rising of the sun from its setting place, and the emergence of the beast of the earth from its place.'
