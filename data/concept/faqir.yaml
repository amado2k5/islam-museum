summary:
  ar: "أول مصارف الزكاة في آية التوبة؛ والفقير عند الفقهاء من لا مال له ولا كسب يقع بموقع كفايته، واختلف المذاهب في تقديمه على المسكين والعكس في المراد بكلٍّ منهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
  en: "The first of the zakat categories in the verse of Surat al-Tawba; the faqir, in the jurists' usage, is one with neither property nor earning that meets his sufficiency, and the schools differ over whether he stands below or above the miskin in need. {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
