id: concept/ikhlaf
class: concept
kind: ethical
label:
  ar: إخلاف
  en: Ikhlaf (breaking a promise or a covenant)
  es: "Ikhlaf (romper una promesa o un pacto)"
  fr: "Ikhlaf (rupture d'une promesse ou d'une alliance)"
  ur: "اخلاص ⁦(عہد یا عہد شکنی)⁩"
  tr: "Veraset"
  id: "Suksesi"
summary:
  ar: 'الإخلاف لغةً عدم الوفاء بالعهد، والعقود أوكد من العهود، ويستعمله الفقهاء بهذا المعنى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1974} ويفرّق بعضهم بين الوعد والعهد، فيجعل العهد ما أوجبه الله أو حرّمه؛ وإخلاف العهد حرام، وإخلاف الوعد مستحب الوفاء عند الجمهور ومنه الواجب عند جماعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1975} ومن وعد وفي نيته الإخلاف فهو آثم، ويشبه ذلك خصلة من النفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1975} وأثر الإخلاف في القضاء: الوعد عند الحنفية لا يلزم إلا إذا كان معلقاً، وعند المالكية يلزم إذا ترتب عليه التزام مالي، وعند الحنابلة لا يُلزم قضاءً، وإخلاف الشرط يُعد إخلالاً بالعقد أو يثبت خياراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1975}'
  en: 'Ikhlaf means, in the lexicon, failing to keep a covenant; covenants are stronger than promises, and the jurists use the word in this sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1974} Some distinguish promise from covenant, limiting covenant to what God has required or forbidden. Breaking a covenant is forbidden; breaking a promise is recommended to keep according to the majority and obligatory according to some. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1975} One who promises intending to break it is sinful and shows a branch of hypocrisy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1975} Effects in judgement: the Hanafis hold a promise binding in judgement only if it is conditional; the Malikis hold it binding when the promisee has taken on a financial obligation on its strength; the Hanbalis hold it not binding in judgement. Breaking a stipulation counts as breaking the contract or gives an option. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1975}'
  es: "Ikhlaf significa, en el léxico, no cumplir un pacto; los pactos son más fuertes que las promesas, y los juristas usan la palabra en este sentido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1974} Algunos distinguen promesa de pacto, limitando el pacto a lo que Dios ha requerido o prohibido. Romper un pacto está prohibido; romper una promesa es recomendable cumplir según la mayoría y obligatorio según algunos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1975} Quien promete con la intención de romperlo es pecador y muestra una rama de hipocresía. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1975} Efectos en el juicio: los Hanafis sostienen que una promesa es vinculante en el juicio solo si es condicional; los Malikis la sostienen vinculante cuando el beneficiario de la promesa ha asumido una obligación financiera en virtud de ella; Los hanbalíes consideran que no es vinculante a efectos de juicio. Incumplir una estipulación equivale a romper el contrato o a otorgar una opción. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1975}"
  fr: "Dans le lexique, « ikhlaf » signifie le manquement à une alliance; les alliances sont plus contraignantes que les promesses, et les juristes emploient ce terme dans ce sens. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1974} Certains distinguent la promesse de l’alliance, limitant cette dernière à ce que Dieu a prescrit ou interdit. Rompre une alliance est interdit; respecter une promesse est recommandé par la majorité et obligatoire par certains. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1975} Celui qui promet avec l’intention de rompre sa promesse commet un péché et fait preuve d’hypocrisie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1975} Effets en matière de jugement: les hanafites considèrent qu’une promesse n’est contraignante en matière de jugement que si elle est conditionnelle; les malikites la considèrent comme contraignante lorsque le bénéficiaire de la promesse a contracté une obligation financière sur sa base. Les Hanbalites estiment que cette clause n'est pas contraignante en matière de jugement. La violation d'une stipulation équivaut à une rupture de contrat ou ouvre une option. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1975}"
  ur: "لغت میں اخلاص کا مطلب عہد کی پاسداری میں ناکامی ہے۔ عہد وعدوں سے زیادہ مضبوط ہوتے ہیں اور فقہاء اس لفظ کو اسی معنی میں استعمال کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1974} کچھ عہد کو عہد سے الگ کرتے ہیں، عہد کو اس تک محدود کرتے ہیں جس کی خدا نے ضرورت یا منع کیا ہے۔ عہد شکنی حرام ہے۔ وعدہ خلافی کرنا جمہور کے مطابق اور بعض کے نزدیک واجب ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1975} جو شخص وعدہ خلافی کرنے کا ارادہ کرتا ہے وہ گنہگار ہے اور نفاق کا شاخسانہ ہے۔ {حوالہ: فقہ الموسوعہ-کویتیہ-نور-v3 صفحہ 1975} فیصلے میں اثرات: حنفیہ فیصلہ میں وعدہ کا پابند ہے صرف اس صورت میں جب وہ مشروط ہو۔ جب وعدہ کرنے والے نے اپنی طاقت پر مالی ذمہ داری اٹھا لی ہو تو مالکی اسے پابند سمجھتے ہیں۔ حنبلی اسے فیصلہ میں پابند نہیں سمجھتے۔ کسی شرط کو توڑنا معاہدہ کو توڑنے کے طور پر شمار ہوتا ہے یا کوئی اختیار دیتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 1975}"
  tr: "İhlaf dilsel olarak bir antlaşmanın yerine getirilmemesi anlamına gelir ve sözleşmeler antlaşmalardan daha doğrudur; hukukçular bunu bu anlamda kullanır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1974} Bazıları vaat ile antlaşma arasında ayrım yapar; Tanrı'nın zorunlu veya yasakladığı şeyi antlaşma yapar; antlaşmayı bozmak yasaktır ve sözü bozmak çoğunluk tarafından tavsiye edilir ve bir gruba göre zorunlu kabul edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1975} Bir sözü bozmak amacıyla veren günahkardır ve bu ikiyüzlülük özelliğine benzetilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1975} Anlaşmazlığın yargı üzerindeki etkisi: Hanefilere göre, bir söz ancak askıya alındığında bağlayıcıdır; Malikilere göre mali bir yükümlülük doğurması durumunda bağlayıcıdır; Hanbalilere göre hüküm üzerinde bağlayıcı değildir; bir koşulun ihlali sözleşme ihlali veya opsiyonun teyidi olarak kabul edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1975}"
  id: "Ikhlaf secara linguistik berarti tidak memenuhi perjanjian, dan kontrak lebih dikonfirmasi daripada perjanjian, dan para ahli hukum menggunakannya dalam arti ini. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1974} Beberapa orang membedakan antara janji dan perjanjian, membuat perjanjian apa yang telah diwajibkan atau dilarang oleh Tuhan; melanggar perjanjian dilarang, dan melanggar janji direkomendasikan oleh mayoritas dan dianggap wajib menurut kelompok. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1975} Siapa pun yang membuat janji dengan niat melanggarnya adalah berdosa, dan ini disamakan dengan sifat kemunafikan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1975} Dampak perselisihan terhadap penilaian: Menurut Hanafi, janji hanya mengikat jika ditangguhkan; menurut Maliki, janji mengikat jika menghasilkan kewajiban keuangan; menurut Hanbali, janji tidak mengikat pada putusan; pelanggaran suatu syarat dianggap sebagai pelanggaran kontrak atau konfirmasi opsi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1975}"
