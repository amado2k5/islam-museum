id: concept/ikhlaf
class: concept
kind: ethical
label:
  ar: إخلاف
  en: Ikhlaf (breaking a promise or a covenant)
summary:
  ar: 'الإخلاف لغةً عدم الوفاء بالعهد، والعقود أوكد من العهود، ويستعمله الفقهاء بهذا المعنى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1974} ويفرّق بعضهم بين الوعد والعهد، فيجعل العهد ما أوجبه الله أو حرّمه؛ وإخلاف العهد حرام، وإخلاف الوعد مستحب الوفاء عند الجمهور ومنه الواجب عند جماعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1975} ومن وعد وفي نيته الإخلاف فهو آثم، ويشبه ذلك خصلة من النفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1975} وأثر الإخلاف في القضاء: الوعد عند الحنفية لا يلزم إلا إذا كان معلقاً، وعند المالكية يلزم إذا ترتب عليه التزام مالي، وعند الحنابلة لا يُلزم قضاءً، وإخلاف الشرط يُعد إخلالاً بالعقد أو يثبت خياراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1975}'
  en: 'Ikhlaf means, in the lexicon, failing to keep a covenant; covenants are stronger than promises, and the jurists use the word in this sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1974} Some distinguish promise from covenant, limiting covenant to what God has required or forbidden. Breaking a covenant is forbidden; breaking a promise is recommended to keep according to the majority and obligatory according to some. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1975} One who promises intending to break it is sinful and shows a branch of hypocrisy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1975} Effects in judgement: the Hanafis hold a promise binding in judgement only if it is conditional; the Malikis hold it binding when the promisee has taken on a financial obligation on its strength; the Hanbalis hold it not binding in judgement. Breaking a stipulation counts as breaking the contract or gives an option. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1975}'
