label:
  ar: الحلال والحرام والمشتبهات
  en: The lawful, the unlawful and the doubtful
summary:
  ar: "تقسيم الأحكام والأعيان إلى حلال محض لا اشتباه فيه، وحرام محض، وأمور مشتبهات بينهما لا يعلم كثير من الناس من أي القسمين هي وإن كان الراسخون في العلم لا يشتبه عليهم ذلك؛ يمثل ابن رجب للحلال المحض بأكل الطيبات من الزروع والثمار وبهيمة الأنعام والنكاح والتسري إذا كان الاكتساب بعقد صحيح، وللحرام المحض بالميتة والدم ولحم الخنزير والخمر ونكاح المحارم والمكاسب المحرمة كالربا والميسر والغصب، وللمشتبه بما اختلف في حله أو تحريمه من الأعيان كالخيل والبغال والحمير والضب والأنبذة التي يسكر كثيرها، ومن المكاسب كمسائل العينة والتورق — وهو تفسير أحمد وإسحاق وغيرهما للمشتبهات؛ ومن اتقى الشبهات استبرأ لدينه وعرضه، ومن وقع فيها كالراعي حول حمى محارم الله."
  en: "The division of rulings and things into plainly lawful, plainly unlawful, and doubtful matters between them that many people cannot assign to either side though the firmly grounded in knowledge are not in doubt; Ibn Rajab gives as plainly lawful the good foods — crops, fruits, cattle — and marriage and concubinage when acquired by a valid contract; as plainly unlawful carrion, blood, pork, wine, marriage within the prohibited degrees, silk for men and unlawful gains such as usury, gambling, theft and usurpation; and as doubtful what is disputed as to its lawfulness — animals such as horses, mules, donkeys and the dabb lizard, intoxicating-when-abundant drinks, and disputed transactions such as 'ina and tawarruq — this being Ahmad's and Ishaq's and other imams' explanation of the doubtful; whoever avoids the doubtful clears his religion and honour, and whoever falls into it is like a shepherd at the edge of God's sanctuary."
