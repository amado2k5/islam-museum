id: concept/halal-haram
class: concept
kind: legal
label:
  ar: الحلال والحرام والمشتبهات
  en: The lawful, the unlawful and the doubtful
  es: "Lo lícito, lo ilícito y lo dudoso"
  fr: "Le licite, l'illicite et le douteux"
  ur: "حلال، حرام اور مشتبہ"
summary:
  ar: "تقسيم الأحكام والأعيان إلى حلال محض لا اشتباه فيه، وحرام محض، وأمور مشتبهات بينهما لا يعلم كثير من الناس من أي القسمين هي وإن كان الراسخون في العلم لا يشتبه عليهم ذلك؛ يمثل ابن رجب للحلال المحض بأكل الطيبات من الزروع والثمار وبهيمة الأنعام والنكاح والتسري إذا كان الاكتساب بعقد صحيح، وللحرام المحض بالميتة والدم ولحم الخنزير والخمر ونكاح المحارم والمكاسب المحرمة كالربا والميسر والغصب، وللمشتبه بما اختلف في حله أو تحريمه من الأعيان كالخيل والبغال والحمير والضب والأنبذة التي يسكر كثيرها، ومن المكاسب كمسائل العينة والتورق — وهو تفسير أحمد وإسحاق وغيرهما للمشتبهات؛ ومن اتقى الشبهات استبرأ لدينه وعرضه، ومن وقع فيها كالراعي حول حمى محارم الله."
  en: "The division of rulings and things into plainly lawful, plainly unlawful, and doubtful matters between them that many people cannot assign to either side though the firmly grounded in knowledge are not in doubt; Ibn Rajab gives as plainly lawful the good foods — crops, fruits, cattle — and marriage and concubinage when acquired by a valid contract; as plainly unlawful carrion, blood, pork, wine, marriage within the prohibited degrees, silk for men and unlawful gains such as usury, gambling, theft and usurpation; and as doubtful what is disputed as to its lawfulness — animals such as horses, mules, donkeys and the dabb lizard, intoxicating-when-abundant drinks, and disputed transactions such as 'ina and tawarruq — this being Ahmad's and Ishaq's and other imams' explanation of the doubtful; whoever avoids the doubtful clears his religion and honour, and whoever falls into it is like a shepherd at the edge of God's sanctuary."
  es: "La división de las normas y las cosas en asuntos claramente lícitos, claramente ilícitos y dudosos entre ellos que muchas personas no pueden asignar a ninguno de los dos lados, aunque los firmemente arraigados en el conocimiento no tienen dudas; Ibn Rajab da como claramente lícitos los buenos alimentos —cultivos, frutas, ganado— y el matrimonio y el concubinato cuando se adquieren mediante un contrato válido; como claramente ilícitos la carroña, la sangre, el cerdo, el vino, el matrimonio dentro de los grados prohibidos, la seda para hombres y las ganancias ilícitas como la usura, el juego, el robo y la usurpación; y como dudoso lo que se disputa en cuanto a su licitud —animales como caballos, mulas, asnos y el lagarto dabb, bebidas embriagantes cuando son abundantes y transacciones disputadas como 'ina y tawarruq— esta es la explicación de Ahmad e Ishaq y otros imanes sobre lo dudoso; quien evita lo dudoso limpia su religión y honor, y quien cae en ello es como un pastor al borde del santuario de Dios."
  fr: "La distinction entre les règles et les choses en matière clairement licite, clairement illicite et douteuse est source de confusion pour beaucoup, même si les personnes solidement ancrées dans la science n'ont aucun doute. Ibn Rajab considère comme clairement licites les bons aliments — récoltes, fruits, bétail — ainsi que le mariage et le concubinage acquis par un contrat valide; comme clairement illicites la charogne, le sang, le porc, le vin, le mariage entre personnes de degrés prohibés, la soie pour les hommes et les gains illicites tels que l'usure, les jeux de hasard, le vol et l'usurpation; et comme douteux ce dont la licéité est contestée — les animaux tels que les chevaux, les mules, les ânes et le lézard dabb, les boissons enivrantes en abondance et les transactions litigieuses telles que l'ina et le tawarruq — telle est l'explication d'Ahmad, d'Ishaq et d'autres imams concernant le douteux. Quiconque évite le douteux préserve sa religion et son honneur, et quiconque s'y adonne est comme un berger aux abords du sanctuaire de Dieu."
  ur: "احکام اور چیزوں کا ان کے درمیان صریح طور پر حلال، صریح ناجائز اور مشتبہ معاملات میں تقسیم ہونا جن کو بہت سے لوگ کسی ایک طرف نہیں دے سکتے حالانکہ علم کی مضبوط بنیادوں پر شک نہیں ہوتا۔ ابن رجب صاف طور پر اچھی غذاؤں کو حلال کرتا ہے - فصلیں، پھل، مویشی - اور شادی اور لونڈی جب کسی جائز معاہدے کے ذریعے حاصل کی جاتی ہیں۔ جیسا کہ صریح طور پر غیر قانونی مردار، خون، سور کا گوشت، شراب، ممنوعہ ڈگریوں کے اندر شادی، مردوں کے لیے ریشم اور ناجائز منافع جیسے سود، جوا، چوری اور غصب؛ اور جیسا کہ اس کے حلال ہونے میں اختلاف ہے - گھوڑے، خچر، گدھے اور چھپکلی جیسے جانور، نشہ آور مشروبات، اور اعنا و توارق جیسے متنازعہ لین دین - یہ احمد اور اسحاق اور دیگر ائمہ کی مشتبہ کی وضاحت ہے۔ جو شخص مشتبہ سے بچتا ہے اس نے اپنے دین اور عزت کو برباد کر دیا اور جو اس میں پڑ گیا وہ خدا کے حرم کے کنارے پر ایک چرواہے کی طرح ہے۔"
