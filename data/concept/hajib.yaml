id: concept/hajib
class: concept
kind: legal
label: { ar: "الحاجب", en: "Chamberlain (hajib)", ur: "حاجب", es: "Chambelán (hajib)", fr: "Chambellan (hajib)" }
summary:
  ar: "الحاجب من يقف على باب الحاكم أو القاضي فيأذن للناس بالدخول، وتفرقه الموسوعة عن البواب والنقيب. ويرى الفقهاء أن اتخاذ الحاجب جائز بحسب الحاجة، وتعرض شروطه وآدابه، ومنها الأمانة وألا يُرتشى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6701} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6704} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6705}"
  en: "A hajib is the attendant at the door of a ruler or judge who admits people. The encyclopedia distinguishes him from the gatekeeper and the warden. The jurists hold that a chamberlain may be appointed as needed, and the entry sets out his conditions and manners, including honesty and avoiding bribes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6701} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6704} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6705}"
  ur: "حاجب وہ شخص ہے جو حاکم یا قاضی کے دروازے پر کھڑا ہو کر لوگوں کو اندر آنے کی اجازت دیتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6701} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6704} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6705}"
  es: "Un hajib es el asistente de la puerta de un gobernante o juez que permite el acceso a las personas. La enciclopedia lo distingue del portero y del guardián. Los juristas sostienen que se puede nombrar un chambelán según sea necesario, y la entrada establece sus condiciones y modales, incluyendo la honestidad y la prohibición de sobornos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6701} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6704} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6705}"
  fr: "Un hajib est le préposé à la porte d'un souverain ou d'un juge, chargé de recevoir les personnes. L'encyclopédie le distingue du portier et du gardien. Les juristes estiment qu'un chambellan peut être nommé selon les besoins, et l'article décrit ses conditions et ses manières, notamment l'honnêteté et l'interdiction de la corruption. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6701} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6704} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6705}"
