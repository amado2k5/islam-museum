summary:
  ar: "الحاجب من يقف على باب الحاكم أو القاضي فيأذن للناس بالدخول، وتفرقه الموسوعة عن البواب والنقيب. ويرى الفقهاء أن اتخاذ الحاجب جائز بحسب الحاجة، وتعرض شروطه وآدابه، ومنها الأمانة وألا يُرتشى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6701} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6704} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6705}"
  en: "A hajib is the attendant at the door of a ruler or judge who admits people. The encyclopedia distinguishes him from the gatekeeper and the warden. The jurists hold that a chamberlain may be appointed as needed, and the entry sets out his conditions and manners, including honesty and avoiding bribes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6701} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6704} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6705}"
  ur: "حاجب وہ شخص ہے جو حاکم یا قاضی کے دروازے پر کھڑا ہو کر لوگوں کو اندر آنے کی اجازت دیتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6701} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6704} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6705}"
