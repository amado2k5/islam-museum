label: { ar: "حرارة ماء الشرب عند ابن سينا", en: "The temperature of drinking water in the Canon", ur: "پینے کے پانی کی حرارت قانون میں" }
summary:
  ar: "يبين ابن سينا أن شرب الماء البارد جداً رديء إلا بعد طعام كاف، وأن الفاتر يغثي، وأن المسخن إذا استكثر منه أوهن المعدة، وإذا شرب في الأحيان غسل المعدة وأطلق الطبيعة {cite:canon-ibn-sina-print-v1 p.237}."
  en: "Ibn Sina says that very cold water is poor drinking unless taken after a sufficient meal, that lukewarm water brings nausea, and that heated water in quantity weakens the stomach but, drunk now and then, washes the stomach and loosens the bowels {cite:canon-ibn-sina-print-v1 p.237}."
