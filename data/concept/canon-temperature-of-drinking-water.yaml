id: concept/canon-temperature-of-drinking-water
class: concept
kind: scientific
label: { ar: "حرارة ماء الشرب عند ابن سينا", en: "The temperature of drinking water in the Canon", ur: "پینے کے پانی کی حرارت قانون میں", es: "La temperatura del agua potable en el Canon", fr: "La température de l'eau potable dans le Canon" }
summary:
  ar: "يبين ابن سينا أن شرب الماء البارد جداً رديء إلا بعد طعام كاف، وأن الفاتر يغثي، وأن المسخن إذا استكثر منه أوهن المعدة، وإذا شرب في الأحيان غسل المعدة وأطلق الطبيعة {cite:canon-ibn-sina-print-v1 p.237}."
  en: "Ibn Sina says that very cold water is poor drinking unless taken after a sufficient meal, that lukewarm water brings nausea, and that heated water in quantity weakens the stomach but, drunk now and then, washes the stomach and loosens the bowels {cite:canon-ibn-sina-print-v1 p.237}."
  es: "Ibn Sina dice que el agua muy fría no es buena para beber a menos que se tome después de una comida suficiente, que el agua tibia produce náuseas y que el agua caliente en cantidad debilita el estómago, pero, bebida de vez en cuando, limpia el estómago y afloja los intestinos {cite:canon-ibn-sina-print-v1 p.237}."
  fr: "Ibn Sina dit que l'eau très froide est mauvaise à boire à moins d'être consommée après un repas suffisant, que l'eau tiède provoque des nausées et que l'eau chaude en grande quantité affaiblit l'estomac mais, bue de temps en temps, lave l'estomac et ramollit les intestins {cite:canon-ibn-sina-print-v1 p.237}."
  ur: "ابن سینا کا کہنا ہے کہ بہت ٹھنڈا پانی پینا ناقص ہے جب تک کہ کافی کھانے کے بعد نہ پیا جائے، یہ نیم گرم پانی متلی کا باعث بنتا ہے، اور اس گرم پانی سے معدہ کمزور ہوتا ہے لیکن بار بار پینے سے معدہ دھوتا ہے اور آنتوں کو ڈھیلا کرتا ہے۔"
