label:
  ar: "فقلامينوس"
  en: "Faqlaminus (a root drug, said to be bakhur maryam)"
  ur: "فقلامینوس"
  es: "Faqlaminus (una raíz medicinal, que se dice que es bakhur maryam)"
  fr: "Faqlaminus (une drogue à base de racine, que l'on dit être du bakhur maryam)"
summary:
  ar: "فقلامينوس في الكتاب قيل هو بخور مريم وهو جنس من العرطنيثا، قوته منقية بجلاء وتقطيع مفتحة محللة، يعرق جدا، وينفع أصله من اليرقان والبثور وأورام الطحال والصلابات والجراحات والنقرس وبرد الشقاق، ويذكر الكتاب فيه أفعالا في الحمل والجنين والطمث {cite:canon-ibn-sina-print-v1 636}"
  en: "Faqlaminus is in the book said to be bakhur maryam, a genus of artanitha, its power purifying by cleansing and cutting, opening and dissolving; it causes much sweating, and its root benefits jaundice, pustules, swellings of the spleen, hardenings, wounds, gout and chaps from cold, and the book lists in it actions on conception, the foetus and the menses {cite:canon-ibn-sina-print-v1 636}"
  ur: "فقلامینوس کتاب میں کہا گیا ہے کہ بخور مریم ہے اور عرطنیثا کی ایک جنس، اس کی قوت جلاء اور قطع سے صاف کرنے والی، کھولنے والی اور تحلیل کرنے والی ہے؛ بہت پسینہ لاتی ہے، اور اس کی جڑ یرقان، پھنسیوں، تلی کے ورم، سختیوں، زخموں، نقرس اور سردی سے پھٹنے میں نافع ہے، اور کتاب اس میں حمل، جنین اور حیض پر اثرات بھی بتاتی ہے {cite:canon-ibn-sina-print-v1 636}۔"
  es: "En el libro se dice que Faqlaminus es bakhur maryam, un género de artanitha, cuyo poder purificador consiste en limpiar y cortar, abrir y disolver; provoca mucha sudoración, y su raíz beneficia la ictericia, las pústulas, la inflamación del bazo, los endurecimientos, las heridas, la gota y las grietas causadas por el frío. El libro también enumera sus acciones sobre la concepción, el feto y la menstruación {cite:canon-ibn-sina-print-v1 636}."
  fr: "Le Faqlaminus est décrit dans le livre comme étant du bakhur maryam, un genre d'artanitha, dont le pouvoir purificateur consiste à nettoyer, couper, ouvrir et dissoudre; il provoque une forte transpiration, et sa racine est bénéfique en cas de jaunisse, de pustules, d'enflures de la rate, d'indurations, de plaies, de goutte et de crevasses dues au froid. Le livre mentionne également ses actions sur la conception, le fœtus et les menstruations. {cite:canon-ibn-sina-print-v1 636}"
