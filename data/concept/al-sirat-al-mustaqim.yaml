summary:
  ar: "الصراط المستقيم في الفاتحة: عند الطبري هو الطريق الواضح الذي لا اعوجاج فيه، وأولى تأويلات «اهدنا» عنده التوفيق للثبات على ما ارتضاه الله من قول وعمل {cite:tafsir-tabari-shakir-v01 p. 171}."
  en: "The straight path petitioned in the Fatiha: for al-Tabari it is the clear road with no crookedness, and the best reading of 'guide us' is steadfastness in what God approves {cite:tafsir-tabari-shakir-v01 p. 171}."
  fr: "Le droit chemin que le fidèle demande de suivre dans la Fatiha : pour al-Tabari, c’est une voie claire et sans détour, et la demande de guidance s’interprète au mieux comme une demande de rester ferme dans ce que Dieu agrée {cite:tafsir-tabari-shakir-v01 p. 171}."
  ur: "سورۂ فاتحہ میں مانگا گیا صراطِ مستقیم: طبری کے نزدیک یہ وہ واضح راستہ ہے جس میں ٹیڑھ نہ ہو {cite:tafsir-tabari-shakir-v01 p. 171}۔"
  es: "El camino recto solicitado en la Fatiha: para al-Tabari es el camino claro sin torsiones, y la mejor lectura de 'guíanos' es la firmeza en lo que Dios aprueba {cite:tafsir-tabari-shakir-v01 p. 171}."
  tr: "El-Fatiha'da Düz Yol: El-Tabari'ye göre, sapmadan açık bir yoldur ve \"Bizi yönlendir\"in en erken yorumu, Allah'ın söz ve eylemde onayladığı şeylerde kararlılık vermektir {atıf:tafsir-tabari-şakir-v01 s. 171}."
  id: "Jalan Lurus di Al-Fatiha: Menurut Al-Tabari, ini adalah jalan yang terbuka tanpa penyimpangan, dan interpretasi paling awal dari \"Membimbing kami\" adalah memberikan penentuan atas apa yang Allah persetujui dalam firman dan perbuatan {referensi: tafsir-tabari-shakir-v01 hlm. 171}."
