id: concept/al-ulfa-al-amma-bayn-al-shuub
class: concept
kind: doctrine
label:
  ar: الألفة العامة بين الشعوب
  en: General kinship among peoples
summary:
  ar: "قراءة محمد فريد وجدي لمبدأ القرآن في خلق الناس شعوباً وقبائل ليتعارفوا، وأن الشرف عند الله بالتقوى لا بالنسب؛ فيرى أن هذا الأصل أصاب العصبية في مقتلها، وأن الإسلام قدّم بالمساواة وحسن معاملة المخالفين أساساً لألفة عالمية. يصف الكتاب ما قبل البعثة بالتناحر، ويعدّ الإسلام افتتاح عهد جديد للألفة {cite:muhimmat-al-islam-azhar p. 26} {cite:muhimmat-al-islam-azhar p. 60} {cite:muhimmat-al-islam-azhar p. 64}. هذه قراءة المؤلف، تُنسب إليه ولا تُقدَّم بوصفها حكماً للمتحف؛ ومن ادعاءاته المقارنة مع الأمم السابقة وسرعة الانتشار في القارات الثلاث {cite:muhimmat-al-islam-azhar p. 28} {cite:muhimmat-al-islam-azhar p. 31}."
  en: "Muhammad Farid Wajdi's reading of the Qur'anic principle that God made people into peoples and tribes so that they might know one another, and that honour before God lies in taqwa rather than lineage. He holds that this principle struck tribal pride at its root and that Islam founded a universal kinship. The book calls the pre-Islamic world a time of constant conflict. The view is the author's and is attributed as such, and its comparisons are his own assertions {cite:muhimmat-al-islam-azhar p. 26} {cite:muhimmat-al-islam-azhar p. 28} {cite:muhimmat-al-islam-azhar p. 31}."
