id: concept/al-ulfa-al-amma-bayn-al-shuub
class: concept
kind: doctrine
label:
  ar: الألفة العامة بين الشعوب
  en: General kinship among peoples
  fr: "Fraternité entre les peuples"
  es: "Parentesco general entre los pueblos"
  ur: "لوگوں کے درمیان عمومی رشتہ داری"
  tr: "Halklar Arasında Genel Aşinalık"
  id: "Keakraban Umum di Antara Masyarakat"
summary:
  ar: "قراءة محمد فريد وجدي لمبدأ القرآن في خلق الناس شعوباً وقبائل ليتعارفوا، وأن الشرف عند الله بالتقوى لا بالنسب؛ فيرى أن هذا الأصل أصاب العصبية في مقتلها، وأن الإسلام قدّم بالمساواة وحسن معاملة المخالفين أساساً لألفة عالمية. يصف الكتاب ما قبل البعثة بالتناحر، ويعدّ الإسلام افتتاح عهد جديد للألفة {cite:muhimmat-al-islam-azhar p. 26} {cite:muhimmat-al-islam-azhar p. 60} {cite:muhimmat-al-islam-azhar p. 64}. هذه قراءة المؤلف، تُنسب إليه ولا تُقدَّم بوصفها حكماً للمتحف؛ ومن ادعاءاته المقارنة مع الأمم السابقة وسرعة الانتشار في القارات الثلاث {cite:muhimmat-al-islam-azhar p. 28} {cite:muhimmat-al-islam-azhar p. 31}."
  en: "Muhammad Farid Wajdi's reading of the Qur'anic principle that God made people into peoples and tribes so that they might know one another, and that honour before God lies in taqwa rather than lineage. He holds that this principle struck tribal pride at its root and that Islam founded a universal kinship. The book calls the pre-Islamic world a time of constant conflict. The view is the author's and is attributed as such, and its comparisons are his own assertions {cite:muhimmat-al-islam-azhar p. 26} {cite:muhimmat-al-islam-azhar p. 28} {cite:muhimmat-al-islam-azhar p. 31}."
  fr: "Muhammad Farid Wajdi commente le principe coranique selon lequel Dieu a fait des humains des peuples et des tribus pour qu’ils apprennent à se connaître, et selon lequel l’honneur devant Dieu tient à la piété (taqwa) plutôt qu’à la lignée. Il estime que ce principe a sapé l’orgueil tribal à la racine et que l’islam a fondé une fraternité universelle. Son livre décrit le monde préislamique comme une époque de conflits incessants. Cette lecture et les comparaisons qui l’accompagnent sont celles de l’auteur et lui sont attribuées {cite:muhimmat-al-islam-azhar p. 26} {cite:muhimmat-al-islam-azhar p. 28} {cite:muhimmat-al-islam-azhar p. 31}."
  es: "La interpretación que hace Muhammad Farid Wajdi del principio coránico de que Dios creó a las personas en pueblos y tribus para que se conocieran entre sí, y que el honor ante Dios reside en la taqwa (temor reverencial a Dios) más que en el linaje, sostiene que este principio erradicó el orgullo tribal y que el Islam fundó un parentesco universal. El libro describe el mundo preislámico como una época de conflicto constante. Esta opinión es del autor y se le atribuye como tal; las comparaciones que realiza son afirmaciones suyas. {cite:muhimmat-al-islam-azhar p. 26} {cite:muhimmat-al-islam-azhar p. 28} {cite:muhimmat-al-islam-azhar p. 31}"
  ur: "محمد فرید وجدی کا قرآنی اصول کو پڑھنا کہ خدا نے لوگوں کو قوموں اور قبیلوں میں تقسیم کیا تاکہ وہ ایک دوسرے کو جان سکیں اور خدا کے نزدیک عزت نسب کی بجائے تقویٰ میں ہے۔ اس کا خیال ہے کہ اس اصول نے قبائلی غرور کو جڑ سے اکھاڑ پھینکا اور اسلام نے ایک عالمگیر رشتہ داری کی بنیاد رکھی۔ کتاب قبل از اسلام دنیا کو مسلسل کشمکش کا دور قرار دیتی ہے۔ نقطہ نظر مصنف کا ہے اور اسی طرح منسوب ہے، اور اس کا موازنہ اس کے اپنے دعوے ہیں {حوالہ: محمّت الاسلام الاظہر ص۔ 26} {حوالہ: محمّت الاسلام اظہر ص۔ 28} {حوالہ: محمّت الاسلام اظہر ص۔ 31}۔"
  tr: "Muhammed Ferid Wajdi'nin Kur'an'ın insanları birbirlerini tanıyacak halklar ve kabileler olarak yaratma ilkesini okuması ve Allah'a olan onurun soyundan değil, dindarlıkta olduğunu okuması; bu ilkeyi kabileciliğin yok oluşunun kökü olarak görür ve İslam'ın küresel uyumun temeli olarak eşitlik ve rakiplere iyi muamele görmesi olarak sunulduğunu düşünür. Kitap, görev öncesi dönemi çatışma olarak tanımlar ve İslam, yeni bir uyum döneminin başlangıcını kabul eder {atıf:muhimmet-al-Islam-azhar s. 26} {cite:muhimmat-al-Islam-azhar s. 60} {cite:muhimmat-al-islam-azhar s. 64}. Bu, yazarın kendisine atfedilen ve müze için bir yargıç olarak sunulmayan yorumudur; iddiaları arasında önceki ülkelerle karşılaştırmalar ve üç kıta arasında hızlı yayılma yer alır {cite:Muhimmat-al-Islam-Azhar s. 28} {cite:Muhimmat-al-Islam-azhar s. 31}."
  id: "Pembacaan Muhammad Farid Wajdi terhadap prinsip Al-Qur'an bahwa manusia diciptakan sebagai bangsa dan suku yang saling mengenal dan bahwa kehormatan kepada Tuhan bukan berasal dari garis keturunan tetapi dari kesalehan; ia melihat prinsip ini sebagai akar dari tribalism dan percaya bahwa Islam disajikan sebagai dasar harmoni global sebagai kesetaraan dan perlakuan baik terhadap rival. Buku ini mendefinisikan periode pra-masa sebagai konflik, dan Islam mengakui awal periode harmoni baru {citation:muhimmat-al-Islam-azhar hlm. 26} {cite:muhimmat-al-Islam-azhar hlm. 60} {cite:muhimmat-al-islam-azhar hlm. 64}. Ini adalah interpretasi yang dikaitkan dengan penulis sendiri dan tidak disajikan sebagai hakim museum; klaimnya meliputi perbandingan dengan negara-negara sebelumnya dan penyebaran cepat di tiga benua {cite:Muhimmat-al-Islam-Azhar hlm. 28} {cite:Muhimmat-al-Islam-azhar hlm. 31}."
