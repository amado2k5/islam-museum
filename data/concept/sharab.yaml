label:
  ar: "الشراب"
  en: "Sharab (the drink)"
  ur: "شراب"
summary:
  ar: "الشراب في الكتاب يقول المؤلف إنه يعني به القهوة، يعدل الفضول التي من جنس المرار، ويحسن البشرة، ويصب على القروح الخبيثة والآكلة والناصور، ويذكر أنه يسكر وما يورثه إدمانه في الأعصاب والرأس والذاكرة، وينمي الحرارة الغريزية ويفرح القلب، وهو سريع الانحدار والانهضام كثير الغذاء، وفي إكثاره سدد الكبد والكلى، ويدر البول، ويختلف فعل المعسل والمائي والحلو والممزوج والصرف والمعمول بماء البحر في البطن والأمعاء، والعتيق نافع للسع الهوام، ويذكر الكتاب نقلا موسوما نفع المعسل لأوجاع الرحم {cite:canon-ibn-sina-print-v1 pp.685-686}"
  en: "Sharab is in the book what the author says he means by al-qahwa; it balances the superfluities of the bitter-bile kind and improves the complexion, is poured on malignant and eating ulcers and on the fistula, and the book says it intoxicates and names what constant use of it brings upon the nerves, the head and the memory; it increases innate heat and gladdens the heart, is quick to descend and to be digested and nourishes much, while much of it brings blockages in the liver and the kidneys; it promotes urine, and the book distinguishes the action on the belly and the intestines of the honeyed, the watery, the sweet, the mixed, the neat and that made with sea water; the old is beneficial for the stings of vermin; and the book lists, as a labelled report, the benefit of the honeyed for pains of the womb {cite:canon-ibn-sina-print-v1 pp.685-686}"
  ur: "شراب کتاب میں وہ ہے جس سے مصنف کے بقول اس کی مراد القہوہ ہے؛ یہ مرّہ کی جنس کے فضلات کو معتدل کرتا ہے اور رنگت کو بہتر کرتا ہے، خبیث اور کھانے والے قرحوں اور ناسور پر ڈالا جاتا ہے، اور کتاب بیان کرتی ہے کہ یہ نشہ لاتا ہے اور اسے مسلسل لینا اعصاب، سر اور حافظے پر کیا اثر ڈالتا ہے؛ یہ فطری حرارت کو بڑھاتا اور دل کو خوش کرتا ہے، جلدی اترنے اور ہضم ہونے والا اور بہت غذا دینے والا ہے، اور اس کی کثرت سے جگر اور گردوں میں رکاوٹیں پیدا ہوتی ہیں؛ پیشاب لاتا ہے، اور کتاب شہد ملے، پانی ملے، میٹھے، ملے ہوئے، خالص اور سمندر کے پانی سے بنے ہوئے کے پیٹ اور آنتوں پر اثر میں فرق کرتی ہے؛ پرانا کیڑوں کے ڈنک میں نافع ہے؛ اور کتاب منقول فہرست کے طور پر شہد ملے کا رحم کے دردوں میں فائدہ درج کرتی ہے {cite:canon-ibn-sina-print-v1 pp.685-686}۔"
