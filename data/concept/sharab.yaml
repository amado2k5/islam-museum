summary:
  ar: "الشراب في الكتاب يقول المؤلف إنه يعني به القهوة، يعدل الفضول التي من جنس المرار، ويحسن البشرة، ويصب على القروح الخبيثة والآكلة والناصور، ويذكر أنه يسكر وما يورثه إدمانه في الأعصاب والرأس والذاكرة، وينمي الحرارة الغريزية ويفرح القلب، وهو سريع الانحدار والانهضام كثير الغذاء، وفي إكثاره سدد الكبد والكلى، ويدر البول، ويختلف فعل المعسل والمائي والحلو والممزوج والصرف والمعمول بماء البحر في البطن والأمعاء، والعتيق نافع للسع الهوام، ويذكر الكتاب نقلا موسوما نفع المعسل لأوجاع الرحم {cite:canon-ibn-sina-print-v1 pp.685-686}"
  en: "Sharab is in the book what the author says he means by al-qahwa; it balances the superfluities of the bitter-bile kind and improves the complexion, is poured on malignant and eating ulcers and on the fistula, and the book says it intoxicates and names what constant use of it brings upon the nerves, the head and the memory; it increases innate heat and gladdens the heart, is quick to descend and to be digested and nourishes much, while much of it brings blockages in the liver and the kidneys; it promotes urine, and the book distinguishes the action on the belly and the intestines of the honeyed, the watery, the sweet, the mixed, the neat and that made with sea water; the old is beneficial for the stings of vermin; and the book lists, as a labelled report, the benefit of the honeyed for pains of the womb {cite:canon-ibn-sina-print-v1 pp.685-686}"
  ur: "شراب کتاب میں وہ ہے جس سے مصنف کے بقول اس کی مراد القہوہ ہے؛ یہ مرّہ کی جنس کے فضلات کو معتدل کرتا ہے اور رنگت کو بہتر کرتا ہے، خبیث اور کھانے والے قرحوں اور ناسور پر ڈالا جاتا ہے، اور کتاب بیان کرتی ہے کہ یہ نشہ لاتا ہے اور اسے مسلسل لینا اعصاب، سر اور حافظے پر کیا اثر ڈالتا ہے؛ یہ فطری حرارت کو بڑھاتا اور دل کو خوش کرتا ہے، جلدی اترنے اور ہضم ہونے والا اور بہت غذا دینے والا ہے، اور اس کی کثرت سے جگر اور گردوں میں رکاوٹیں پیدا ہوتی ہیں؛ پیشاب لاتا ہے، اور کتاب شہد ملے، پانی ملے، میٹھے، ملے ہوئے، خالص اور سمندر کے پانی سے بنے ہوئے کے پیٹ اور آنتوں پر اثر میں فرق کرتی ہے؛ پرانا کیڑوں کے ڈنک میں نافع ہے؛ اور کتاب منقول فہرست کے طور پر شہد ملے کا رحم کے دردوں میں فائدہ درج کرتی ہے {cite:canon-ibn-sina-print-v1 pp.685-686}۔"
  es: "En el libro, el sharab es lo que el autor dice entender por al-qahwa; equilibra los excesos de bilis amarga y mejora la tez, se vierte sobre úlceras malignas y corrosivas y sobre fístulas, y el libro dice que embriaga y nombra los efectos que su uso constante produce en los nervios, la cabeza y la memoria; aumenta el calor corporal y alegra el corazón, desciende y se digiere rápidamente y nutre mucho, aunque en exceso provoca obstrucciones en el hígado y los riñones; promueve la micción, y el libro distingue la acción sobre el vientre y los intestinos de la versión melosa, la acuosa, la dulce, la mixta, la pura y la hecha con agua de mar; la añeja es beneficiosa para las picaduras de parásitos; y el libro enumera, como un informe detallado, el beneficio de la versión melosa para los dolores uterinos {cite:canon-ibn-sina-print-v1 pp.685-686}"
  fr: "Le sharab, tel que défini dans le livre par l'auteur, correspond à ce qu'il appelle al-qahwa; il équilibre les excès de bile amère et améliore le teint, est appliqué sur les ulcères malins et purulents ainsi que sur les fistules. Le livre indique qu'il enivre et énumère les effets d'une consommation régulière sur le système nerveux, l'esprit et la mémoire; il accroît la chaleur interne et réjouit le cœur, est rapidement assimilé et digéré, et est très nourrissant, tandis qu'une consommation excessive peut entraîner des blocages au niveau du foie et des reins; il favorise la diurèse. Le livre distingue l'action sur l'estomac et les intestins du sharab miellé, aqueux, sucré, mélangé, pur et celui préparé avec de l'eau de mer; le vieux sharab est bénéfique contre les piqûres de vermine; et le livre mentionne, sous forme de rapport commenté, les bienfaits du sharab miellé contre les douleurs utérines {cite:canon-ibn-sina-print-v1 pp.685-686}"
  tr: "Yazar, kitaptaki içkinin acı merakı düzenleyen, cildi iyileştiren ve kötü huylular, aşındırıcı ve fistüllere dökülen kahveye atıfta bulunduğunu belirtir. Sinirlerde, kafada ve hafızada sarhoş olup bağımlılık yarattığını, içgüdüsel sıcaklığı tetiklediğini ve kalbe neşe getirdiğini belirtir. Hızlı azalır ve sindirim yapar, bolca besleyicidir. Bol miktarda karaciğer ve böbrekleri engeller ve idrar söktürücü üretir. Mussel, sulu ve tatlı, karışık, akıntılı ve deniz suyu karışımının etkileri mide ve bağırsaklarda farklılık gösterir. Antik formu mide yanması için faydalıdır. Kitapta \"Ma'assel rahim ağrıları için faydalıdır\" başlıklı bir anlatımdan bahsedilir {cite:canon-ibn-sina-print-v1 s.685-686}"
  id: "Penulis mengatakan minuman dalam buku ini merujuk pada kopi, yang mengatur rasa ingin tahu jenis pahit, memperbaiki kulit, dan menuangkan pada kanser, korosif, dan fistula. Ia menyebutkan bahwa kopi memabukkan dan menyebabkan kecanduan pada saraf, kepala, dan memori, merangsang kehangatan naluriah, dan membawa kebahagiaan ke hati. Kopi cepat menurun dan mencerna, sangat bergizi. Dalam jumlah melimpah, kopi ini menyumbat hati dan ginjal, serta menghasilkan diuretik. Efek moassel, air, manis, campuran, cairan, dan air laut yang dicampur berbeda pada lambung dan usus. Bentuk kuno ini bermanfaat untuk rasa perih lambung. Buku ini menyebutkan narasi berjudul \"Ma'assel bermanfaat untuk nyeri rahim\" {cite:canon-ibn-sina-print-v1 hlm.685-686}"
