id: concept/nasha-at-asma-al-usar-al-arabiyya
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-scholars]
label:
  ar: "نشأة أسماء الأسر العربية"
  en: "How Arab family names developed"
  ur: "عربی خاندانی ناموں کی نشأت"
  fr: "La formation des noms de famille arabes"
  es: "Cómo se formaron los apellidos árabes"
summary:
  ar: "لم يخلُ العرب قبل العصر الحديث من أسماء الأسر، فقد عرفت أسر وعشائر وسلالات حاكمة تسميات جماعية موروثة قبل أن تفرض الحكومات ألقاباً موحدة؛ والذي تغيّر وظيفة الاسم من وصف مرن للهوية والانتماء إلى معرّف ثابت مسجل قانوناً، كما يعرضه ملف بحثي قُدّم إلى المتحف مع جداول المراحل والمصادر {cite:bnf-kitcat-arabic-names} {cite:jstor-schimmel-islamic-names}."
  en: "Arabs did not lack family names before modern times: many families, clans and dynasties had inherited collective designations centuries before governments required standardised surnames; what changed was the name's function, from a flexible description of identity and affiliation to a fixed, legally registered identifier, as a research file supplied to the museum sets it out with tables of the stages and sources {cite:bnf-kitcat-arabic-names} {cite:jstor-schimmel-islamic-names}."
  ur: "عرب جدید دور سے پہلے خاندانی ناموں سے خالی نہ تھے، کیونکہ حکومتوں کی طرف سے یکساں کنیتیں مسلط کرنے سے صدیوں پہلے بہت سے خاندانوں، قبیلوں اور حکمران سلسلوں کے وراثتی اجتماعی نام موجود تھے؛ جو چیز بدلی وہ نام کا کام ہے، یعنی شناخت اور وابستگی کے لچکدار بیان سے ایک مقررہ، قانونی طور پر درج شدہ شناخت کنندہ، جیسا کہ عجائب گھر کو پیش کی گئی ایک تحقیقی فائل مراحل اور مآخذ کے جدولوں کے ساتھ بیان کرتی ہے {cite:bnf-kitcat-arabic-names} {cite:jstor-schimmel-islamic-names}۔"
  fr: "Les Arabes n'ont pas manqué de noms de famille avant l'époque moderne : de nombreuses familles, tribus et dynasties avaient des désignations collectives héritées des siècles avant que les gouvernements n'exigent des patronymes normalisés ; ce qui a changé, c'est la fonction du nom, d'une description souple de l'identité et de l'appartenance à un identifiant fixe, enregistré légalement, comme l'expose un dossier de recherche remis au musée avec des tableaux des étapes et des sources {cite:bnf-kitcat-arabic-names} {cite:jstor-schimmel-islamic-names}."
  es: "Los árabes no carecían de apellidos antes de los tiempos modernos: muchas familias, clanes y dinastías tenían designaciones colectivas heredadas siglos antes de que los gobiernos exigieran apellidos normalizados; lo que cambió fue la función del nombre, de una descripción flexible de la identidad y la afiliación a un identificador fijo y registrado legalmente, según lo expone un expediente de investigación entregado al museo con tablas de las etapas y las fuentes {cite:bnf-kitcat-arabic-names} {cite:jstor-schimmel-islamic-names}."
