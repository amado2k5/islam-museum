id: concept/kadik
class: concept
kind: legal
label:
  ar: "كَدِك"
  en: "Fixtures and right of tenure (kadik)"
  ur: "کدک (دکان کی تنصیبات اور حقِ قرار)"
summary:
  ar: "الكدك في الاصطلاح ما يثبت في الحانوت على وجه القرار من بناء ورفوف وأغلاق، وقد يطلق على ما يوضع متصلاً بغير قرار، أو على الأعيان المنقولة، أو على المنفعة المقابلة للدراهم وهو الخلو. وللمستأجر الذي أحدث الكدك بإذن الناظر حق القرار في العين الموقوفة ما دام يدفع أجرة المثل ولم يضر الوقف، وفي ذلك خلاف، فالحنفية والمالكية يثبتون حق القرار ويعدون الكدك مالاً متقوماً يباع ويورث، والشافعية والحنابلة لا يجعلون الكدك في الأصل وقفاً على وجه الخلو. ولا يصح وقف الكدك عند الحنفية، ويجوز عند المالكية. وأجاز المالكية الشفعة فيه، ومنعها الحنفية والشافعية في بيع البناء دون الأرض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13213} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13215} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13216} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13218} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13220} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13221}"
  en: "In the jurists' terms the kadik is what is fixed in a shop as a permanent part of it, such as a building, fitted shelves and locks; the word can also mean things set in a shop without being fixed, or the sum paid for the right of use, which is called khuluw. A tenant who builds with the administrator's leave has a right of tenure in an endowed property, provided he pays the fair rent and does not harm the endowment. The Hanafis and Malikis treat the fixture as property that can be sold and inherited, while the Shafi'is and Hanbalis treat the building as the tenant's own and deal with its removal at the end of a lease. The Hanafis do not allow endowing a kadik, the Malikis do. The Malikis allow pre-emption in it; the Hanafis and Shafi'is do not allow it for a building sold without its ground. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13213} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13215} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13216} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13218} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13220} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13221}"
  ur: "کدک اصطلاح میں وہ چیز ہے جو دکان میں مستقل طور پر نصب ہو، جیسے عمارت، مضبوط الماریاں اور کنڈیاں؛ اس لفظ کا اطلاق دکان میں رکھی ہوئی غیر مستقل چیزوں پر یا اس رقم پر بھی ہوتا ہے جو انتفاع کے حق کے بدلے دی جائے، جسے خلو کہتے ہیں۔ وقف جائیداد میں کرایہ دار اگر ناظر کی اجازت سے تعمیر کرے تو اسے حقِ قرار حاصل ہوتا ہے، بشرطیکہ وہ اجرت مثل ادا کرے اور وقف کو نقصان نہ ہو۔ حنفیہ اور مالکیہ کدک کو قابلِ بیع و وراثت مال مانتے ہیں، جبکہ شافعیہ اور حنابلہ عمارت کو کرایہ دار کی ملک سمجھتے ہیں اور اجارہ ختم ہونے پر اس کے ہٹانے کا حکم بیان کرتے ہیں۔ حنفیہ کدک کا وقف جائز نہیں کہتے، مالکیہ جائز کہتے ہیں۔ مالکیہ کے نزدیک اس میں شفعہ جائز ہے، جبکہ حنفیہ اور شافعیہ زمین کے بغیر عمارت کی بیع میں شفعہ نہیں مانتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13213} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13215} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13216} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13218} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13220} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13221}"
