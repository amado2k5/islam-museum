  en: "Fixtures and right of tenure (kadik)"
  ur: "کدک ⁦(دکان کی تنصیبات اور حقِ قرار)⁩"
  es: "Instalaciones fijas y derecho de tenencia (kadik)"
  fr: "Fixations et droit d'occupation (kadik)"
  tr: "Zor"
  id: "Sulit"
summary:
  ar: "الكدك في الاصطلاح ما يثبت في الحانوت على وجه القرار من بناء ورفوف وأغلاق، وقد يطلق على ما يوضع متصلاً بغير قرار، أو على الأعيان المنقولة، أو على المنفعة المقابلة للدراهم وهو الخلو. وللمستأجر الذي أحدث الكدك بإذن الناظر حق القرار في العين الموقوفة ما دام يدفع أجرة المثل ولم يضر الوقف، وفي ذلك خلاف، فالحنفية والمالكية يثبتون حق القرار ويعدون الكدك مالاً متقوماً يباع ويورث، والشافعية والحنابلة لا يجعلون الكدك في الأصل وقفاً على وجه الخلو. ولا يصح وقف الكدك عند الحنفية، ويجوز عند المالكية. وأجاز المالكية الشفعة فيه، ومنعها الحنفية والشافعية في بيع البناء دون الأرض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13213} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13215} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13216} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13218} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13220} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13221}"
  en: "In the jurists' terms the kadik is what is fixed in a shop as a permanent part of it, such as a building, fitted shelves and locks; the word can also mean things set in a shop without being fixed, or the sum paid for the right of use, which is called khuluw. A tenant who builds with the administrator's leave has a right of tenure in an endowed property, provided he pays the fair rent and does not harm the endowment. The Hanafis and Malikis treat the fixture as property that can be sold and inherited, while the Shafi'is and Hanbalis treat the building as the tenant's own and deal with its removal at the end of a lease. The Hanafis do not allow endowing a kadik, the Malikis do. The Malikis allow pre-emption in it; the Hanafis and Shafi'is do not allow it for a building sold without its ground. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13213} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13215} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13216} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13218} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13220} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13221}"
  ur: "کدک اصطلاح میں وہ چیز ہے جو دکان میں مستقل طور پر نصب ہو، جیسے عمارت، مضبوط الماریاں اور کنڈیاں؛ اس لفظ کا اطلاق دکان میں رکھی ہوئی غیر مستقل چیزوں پر یا اس رقم پر بھی ہوتا ہے جو انتفاع کے حق کے بدلے دی جائے، جسے خلو کہتے ہیں۔ وقف جائیداد میں کرایہ دار اگر ناظر کی اجازت سے تعمیر کرے تو اسے حقِ قرار حاصل ہوتا ہے، بشرطیکہ وہ اجرت مثل ادا کرے اور وقف کو نقصان نہ ہو۔ حنفیہ اور مالکیہ کدک کو قابلِ بیع و وراثت مال مانتے ہیں، جبکہ شافعیہ اور حنابلہ عمارت کو کرایہ دار کی ملک سمجھتے ہیں اور اجارہ ختم ہونے پر اس کے ہٹانے کا حکم بیان کرتے ہیں۔ حنفیہ کدک کا وقف جائز نہیں کہتے، مالکیہ جائز کہتے ہیں۔ مالکیہ کے نزدیک اس میں شفعہ جائز ہے، جبکہ حنفیہ اور شافعیہ زمین کے بغیر عمارت کی بیع میں شفعہ نہیں مانتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13213} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13215} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13216} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13218} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13220} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13221}"
  es: "En términos jurídicos, el kadik es lo que se fija en un local comercial como parte permanente del mismo, como un edificio, estanterías y cerraduras; la palabra también puede referirse a objetos colocados en un local comercial sin estar fijos, o a la suma pagada por el derecho de uso, que se denomina khuluw. Un arrendatario que construye con el permiso del administrador tiene derecho de tenencia sobre una propiedad dotada, siempre que pague el alquiler justo y no perjudique la dotación. Los hanafíes y los malikíes consideran la instalación como propiedad que puede venderse y heredarse, mientras que los shafiíes y los hanbalíes consideran el edificio como propiedad del arrendatario y regulan su demolición al finalizar el contrato de arrendamiento. Los hanafíes no permiten la dotación de un kadik, los malikíes sí. Los malikíes permiten el derecho de tanteo sobre él; los hanafíes y los shafiíes no lo permiten para un edificio vendido sin su terreno. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13213} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13215} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13216} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13218} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13220} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13221}"
  fr: "En termes juridiques, le kadik désigne ce qui est fixé de manière permanente dans un magasin, comme un bâtiment, des étagères aménagées et des serrures. Le terme peut également désigner les objets disposés dans un magasin sans y être fixés, ou la somme versée pour le droit d'usage, appelée khuluw. Un locataire qui construit avec l'autorisation de l'administrateur bénéficie d'un droit d'occupation sur un bien doté, à condition de payer un loyer équitable et de ne pas porter atteinte à la dotation. Les écoles hanafite et malikite considèrent l'aménagement comme un bien cessible par héritage, tandis que les écoles chaféite et hanbalite considèrent le bâtiment comme la propriété du locataire et traitent de sa démolition à la fin du bail. Les hanafites n'autorisent pas la dotation d'un kadik, contrairement aux malikites. Ces derniers autorisent le droit de préemption sur le kadik; les hanafites et les chaféites ne l'autorisent pas pour un bâtiment vendu sans son terrain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13213} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13215} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13216} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13218} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13220} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13221}"
  tr: "Terminolojide, 'kadak', dükkânda kararın tarafında sabit olan yapı, raflar ve çevreler gibi şeyleri ifade eder. Kararsız olarak bağlı olan şeyleri, taşınabilir malları veya dirhem eşdeğeri olan boş konuları ifade edebilir. Kadak'ı denetçinin izniyle kuran kiracı, eşdeğer kirayı ödediği ve vakıf zarar görmediği sürece vakıf mülkü belirleme hakkına sahiptir. Bu konuda bir fark vardır. Hanafis ve Malikis hakkı belirler kararın verdiği kararı kabul eder ve kadaki satılıp miras alınacak sabit mülk olarak kabul ederler; Şafiiler ve Haneliler ise kadaki başta arazi mülkü üzerinde bir vakıf olarak görmezler. Kadak'ın bağışı Hanefilere göre geçerli değildir, ancak Malikilere göre izin verilir. Malikiler bu konuda öncelik hakkı tanırken, Hanefiler ve Şafi'ler arazi olmadan binaların satışını yasaklamıştır. {atı:fiqh-mawsua-kuwaitiyya-noor-v3 s. 13213} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13215} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13216} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13218} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13220} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13221}"
  id: "Dalam terminologi, 'kadak' merujuk pada apa yang ditetapkan di toko di sisi keputusan, seperti konstruksi, rak, dan penutup. Istilah ini dapat merujuk pada apa yang ditempatkan terhubung tanpa keputusan, atau properti bergerak, atau manfaat setara dirham, yaitu kekosongan. Penyewa yang mendirikan kadak dengan izin pengawas berhak memutuskan properti yang diwakafikasi selama ia membayar sewa yang setara dan wakaf tidak dirugikan. Ada perbedaan dalam hal ini. Hanafi dan Malik menetapkan hak atas keputusan dan menganggap kadak sebagai properti tetap yang dijual dan diwariskan, sementara Shafi'i dan Hanbali awalnya tidak menganggap kadak sebagai wakaf atas properti tanah. Pemberian kadak tidak sah menurut Hanafi, tetapi diizinkan menurut Maliki. Malik mengizinkan preemption dalam hal ini, sementara Hanafi dan Shafi'i melarang penjualan bangunan tanpa tanah. {cite::Fiqh-mawsua-kuwaitiyya-noor-v3 p.13213} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13215} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13216} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13218} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13220} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13221}"
