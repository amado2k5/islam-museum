summary:
  ar: ملائكة يوصفون في القرآن بأنهم كرام كاتبون [[passage/quran-82-11|الانفطار 11]]، وأن لكل نفس حافظاً [[passage/quran-86-4|الطارق 4]]؛ ويؤيد
    الحديث أن لكل إنسان كاتبين يكتبان عمله عن يمينه وعن شماله.
  en: Angels the Qur'an describes as noble recording scribes [[passage/quran-82-11|al-Infitar 11]], with a guardian over every soul [[passage/quran-86-4|al-Tariq
    4]]; hadith supports that every person has two scribes recording his deeds at his right and left.
  ur: فرشتے جنہیں قرآن کرام کاتبین کہتا ہے [[passage/quran-82-11|الانفطار 11]] اور ہر نفس کے لیے حافظ مقرر ہے [[passage/quran-86-4|الطارق 4]]؛
    حدیث اس کی تصدیق کرتی ہے کہ ہر انسان کے دائیں اور بائیں دو کاتب اس کے اعمال لکھتے ہیں۔
