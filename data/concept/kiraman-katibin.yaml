id: concept/kiraman-katibin
class: concept
kind: angel
label:
  ar: الكرام الكاتبين
  en: The Noble Recording Scribes
  ur: کرام کاتبین
  es: "Los Nobles Escribas Registradores"
  fr: "Les nobles scribes qui enregistrent"
summary:
  ar: ملائكة يوصفون في القرآن بأنهم كرام كاتبون [[passage/quran-82-11|الانفطار 11]]، وأن لكل نفس حافظاً [[passage/quran-86-4|الطارق 4]]؛ ويؤيد
    الحديث أن لكل إنسان كاتبين يكتبان عمله عن يمينه وعن شماله.
  en: Angels the Qur'an describes as noble recording scribes [[passage/quran-82-11|al-Infitar 11]], with a guardian over every soul [[passage/quran-86-4|al-Tariq
    4]]; hadith supports that every person has two scribes recording his deeds at his right and left.
  ur: فرشتے جنہیں قرآن کرام کاتبین کہتا ہے [[passage/quran-82-11|الانفطار 11]] اور ہر نفس کے لیے حافظ مقرر ہے [[passage/quran-86-4|الطارق 4]]؛
    حدیث اس کی تصدیق کرتی ہے کہ ہر انسان کے دائیں اور بائیں دو کاتب اس کے اعمال لکھتے ہیں۔
  es: "El Corán describe a los ángeles como nobles escribas registradores [[passage/quran-82-11|al-Infitar 11]], con un guardián sobre cada alma [[passage/quran-86-4|al-Tariq 4]]; el hadiz apoya que cada persona tiene dos escribas que registran sus actos a su derecha y a su izquierda."
  fr: "Les anges, selon le Coran, sont de nobles scribes enregistreurs [[passage/quran-82-11|al-Infitar 11]], avec un gardien sur chaque âme [[passage/quran-86-4|al-Tariq 4]]; les hadiths confirment que chaque personne a deux scribes enregistrant ses actes à sa droite et à sa gauche."
