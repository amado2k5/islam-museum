label: { ar: "الأبكم", en: "The mute person (abkam) in fiqh" }
summary:
  ar: "تعرّف الموسوعة الفقهية الكويتية الأبكم بأنه صفة من البَكَم، وهو الخرس، وتفرّق اللغة بينه وبين الأخرس بأن الأخرس من خُلق لا ينطق، والأبكم من له نطق ولكن لا يعقل الجواب، وفقهاء الاستعمال لا يفرقون بينهما. وتذكر أنه لما فقد القدرة على البيان باللسان اكتُفي منه بالنية وتحريك اللسان أو التمتمة في العبادات كالصلاة وقراءة القرآن والتلبية، وأن المالكية يكتفون بالنية. وفي غير العبادات يلزمه البيان بالكتابة إن كان يجيدها، وإلا فبالإشارة المفهمة في البيوع والمعاملات والشهادات، وفي الحدود لا يُقبل إقراره على نفسه ولا شهادته على غيره لوجود الشبهة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1454} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1455}"
  en: "The Kuwaiti encyclopedia defines the mute person (abkam) as one who has the condition of dumbness, which is the absence of speech. Lexicographers distinguish the abkam, who has speech but cannot give an answer, from the akhras, one born unable to speak; the jurists in their usage do not distinguish between them. Since the mute lacks the means of expression by the tongue, the Encyclopedia says he is held to intention and to moving the tongue, or murmuring, in acts of worship such as prayer, reciting the Qur'an and the talbiya; the Malikis accept intention alone. In other matters he must express himself in writing, if he writes well, and otherwise by an intelligible sign, as in sales, transactions and testimony. In hudud punishments his confession against himself and his testimony against others are not accepted, because a doubt averts such punishments. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1454} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1455}"
