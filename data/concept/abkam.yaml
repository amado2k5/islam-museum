label: { ar: "الأبكم", en: "The mute person (abkam) in fiqh", fr: "La personne muette (abkam) en fiqh", es: "La persona muda (abkam) en fiqh", ur: "فقہ میں خاموش شخص ⁦(ابکم)⁩" }
summary:
  ar: "تعرّف الموسوعة الفقهية الكويتية الأبكم بأنه صفة من البَكَم، وهو الخرس، وتفرّق اللغة بينه وبين الأخرس بأن الأخرس من خُلق لا ينطق، والأبكم من له نطق ولكن لا يعقل الجواب، وفقهاء الاستعمال لا يفرقون بينهما. وتذكر أنه لما فقد القدرة على البيان باللسان اكتُفي منه بالنية وتحريك اللسان أو التمتمة في العبادات كالصلاة وقراءة القرآن والتلبية، وأن المالكية يكتفون بالنية. وفي غير العبادات يلزمه البيان بالكتابة إن كان يجيدها، وإلا فبالإشارة المفهمة في البيوع والمعاملات والشهادات، وفي الحدود لا يُقبل إقراره على نفسه ولا شهادته على غيره لوجود الشبهة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1454} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1455}"
  en: "The Kuwaiti encyclopedia defines the mute person (abkam) as one who has the condition of dumbness, which is the absence of speech. Lexicographers distinguish the abkam, who has speech but cannot give an answer, from the akhras, one born unable to speak; the jurists in their usage do not distinguish between them. Since the mute lacks the means of expression by the tongue, the Encyclopedia says he is held to intention and to moving the tongue, or murmuring, in acts of worship such as prayer, reciting the Qur'an and the talbiya; the Malikis accept intention alone. In other matters he must express himself in writing, if he writes well, and otherwise by an intelligible sign, as in sales, transactions and testimony. In hudud punishments his confession against himself and his testimony against others are not accepted, because a doubt averts such punishments. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1454} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1455}"
  fr: "L'encyclopédie koweïtienne définit la personne muette (abkam) comme une personne atteinte de mutisme, c'est-à-dire d'une absence de parole. Les lexicographes distinguent l'abkam, qui possède la parole mais ne peut donner de réponse, de l'akhras, né dans l'incapacité de parler ; les juristes ne les distinguent pas dans leur usage. La personne muette ne pouvant s'exprimer par la langue, l'Encyclopédie indique qu'il lui est demandé de former l'intention et de remuer la langue ou de murmurer dans les actes cultuels tels que la prière, la récitation du Coran et la talbiya ; les malikites se contentent de l'intention seule. Dans les autres domaines, elle doit s'exprimer par écrit si elle sait bien écrire, sinon par un signe intelligible, comme pour les ventes, les transactions et les témoignages. En matière de peines de hudud, son aveu contre elle-même et son témoignage contre autrui ne sont pas admis, car le doute écarte ces peines. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1454} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1455}"
  es: "La enciclopedia kuwaití define al mudo (abkam) como aquel que padece la condición de mudez, es decir, la ausencia de habla. Los lexicógrafos distinguen al abkam, que tiene habla pero no puede responder, del akhras, quien nace incapaz de hablar; los juristas, en su uso, no hacen distinción entre ambos. Dado que el mudo carece de la capacidad de expresarse mediante la lengua, la enciclopedia afirma que se le exige intención y el movimiento de la lengua, o murmurar, en actos de culto como la oración, la recitación del Corán y la talbiya; los malikíes aceptan únicamente la intención. En otros asuntos, debe expresarse por escrito, si escribe bien, o mediante un signo inteligible, como en ventas, transacciones y testimonios. En los castigos hudud, su confesión contra sí mismo y su testimonio contra otros no son aceptados, ya que la duda evita tales castigos. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1454} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1455}"
  ur: "کویتی انسائیکلوپیڈیا نے گونگا شخص ⁦(ابکم)⁩ کی تعریف وہ ہے جس کے گونگے ہونے کی حالت ہے، جو کہ تقریر کی غیر موجودگی ہے۔ لغت نگار ابکم کی تمیز کرتے ہیں، جس کے پاس تقریر ہوتی ہے لیکن وہ جواب نہیں دے سکتا، اکھاڑہ میں سے، وہ پیدا ہوتا ہے جو بولنے سے قاصر ہو۔ فقہاء ان کے استعمال میں فرق نہیں کرتے۔ چونکہ گونگا کے پاس زبان سے اظہار کا ذریعہ نہیں ہوتا ہے، اس لیے انسائیکلوپیڈیا کہتا ہے کہ وہ نیت اور زبان کو حرکت دینے، یا بڑبڑانے کے لیے، نماز، قرآن کی تلاوت اور تلبیہ جیسے عبادات میں۔ مالکی صرف نیت کو قبول کرتے ہیں۔ دوسرے معاملات میں اسے اپنے آپ کو تحریری طور پر ظاہر کرنا چاہیے، اگر وہ اچھا لکھتا ہے، اور دوسری صورت میں کسی قابل فہم نشانی سے، جیسا کہ فروخت، لین دین اور گواہی میں۔ حدد کی سزاؤں میں اس کا اپنے خلاف اقرار اور دوسروں کے خلاف اس کی گواہی قبول نہیں کی جاتی، کیونکہ شک ایسی سزاؤں کو ٹال دیتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1454}"
