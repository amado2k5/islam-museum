id: concept/indiras
class: concept
kind: legal
label: { ar: "الاندراس", en: "Indiras (the effacing of a thing's marks: mosques, endowments, graves and dead land)" }
summary:
  ar: "الاندراس عفاء الشيء وخفاء آثاره، والفقهاء يستعملونه في ذهاب معالم الشيء وبقاء أثره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3463} ويختلف حكمه بحسب موضوعه: فالمسجد إذا استغني عنه يبقى مسجدا عند أبي حنيفة وأبي يوسف، وقال محمد يعود إلى الواقف، والحنابلة يجيزون بيع بعضه لإصلاح باقيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3463}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3464} والوقف إذا تعطل يجوز استبداله عند جمهور الحنفية بإذن القاضي، والمالكية يجيزون استبدال المنقول، والشافعية يشددون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3464}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3465} وقبر الميت المسلم إذا صار ترابا يجوز نبشه والدفن فيه عند الجماهير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3465} وفي إحياء الأرض المندرسة خلاف: الشافعية والحنابلة يبقونها لصاحبها الأول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3465}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3466}"
  en: "Indiras is the effacing of a thing's marks while its trace remains. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3463} Its ruling depends on its subject. A mosque left unused remains a mosque for Abu Hanifa and Abu Yusuf; Muhammad held it returns to the founder, and the Hanbalis allow selling part of it to repair the rest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3463}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3464} An endowment that cannot yield anything may be exchanged by most Hanafis with the judge's leave, the Malikis allow exchanging movable endowments, and the Shafi'is are strict. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3464}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3465} A Muslim grave that has become earth may be opened and reused according to most scholars. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3465} The revival of effaced dead land is disputed: the Shafi'is and Hanbalis keep it for its first owner. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3465}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3466}"
