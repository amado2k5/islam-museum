id: concept/indiras
class: concept
kind: legal
label: { ar: "الاندراس", en: "Indiras (the effacing of a thing's marks: mosques, endowments, graves and dead land)", es: "Indiras (el borrado de las marcas de algo: mezquitas, donaciones, tumbas y tierras muertas)", fr: "Indiras (l'effacement des marques d'une chose: mosquées, dotations, tombes et terres mortes)" }
summary:
  ar: "الاندراس عفاء الشيء وخفاء آثاره، والفقهاء يستعملونه في ذهاب معالم الشيء وبقاء أثره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3463} ويختلف حكمه بحسب موضوعه: فالمسجد إذا استغني عنه يبقى مسجدا عند أبي حنيفة وأبي يوسف، وقال محمد يعود إلى الواقف، والحنابلة يجيزون بيع بعضه لإصلاح باقيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3463}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3464} والوقف إذا تعطل يجوز استبداله عند جمهور الحنفية بإذن القاضي، والمالكية يجيزون استبدال المنقول، والشافعية يشددون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3464}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3465} وقبر الميت المسلم إذا صار ترابا يجوز نبشه والدفن فيه عند الجماهير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3465} وفي إحياء الأرض المندرسة خلاف: الشافعية والحنابلة يبقونها لصاحبها الأول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3465}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3466}"
  en: "Indiras is the effacing of a thing's marks while its trace remains. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3463} Its ruling depends on its subject. A mosque left unused remains a mosque for Abu Hanifa and Abu Yusuf; Muhammad held it returns to the founder, and the Hanbalis allow selling part of it to repair the rest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3463}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3464} An endowment that cannot yield anything may be exchanged by most Hanafis with the judge's leave, the Malikis allow exchanging movable endowments, and the Shafi'is are strict. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3464}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3465} A Muslim grave that has become earth may be opened and reused according to most scholars. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3465} The revival of effaced dead land is disputed: the Shafi'is and Hanbalis keep it for its first owner. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3465}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3466}"
  es: "Indiras es el borrado de las marcas de una cosa mientras que su rastro permanece. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3463} Su dictamen depende de su sujeto. Una mezquita que se deja sin usar sigue siendo una mezquita para Abu Hanifa y Abu Yusuf; Muhammad sostuvo que regresa al fundador, y los Hanbalis permiten vender parte de ella para reparar el resto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3463}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3464} Una dotación que no puede producir nada puede ser intercambiada por la mayoría de los Hanafis con el permiso del juez, los Malikis permiten intercambiar dotciones muebles, y los Shafi'is son estrictos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3464}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3465} Una tumba musulmana convertida en tierra puede abrirse y reutilizarse según la mayoría de los estudiosos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3465} Se discute el resurgimiento de la tierra muerta borrada: los Shafi'is y Hanbalis la conservan para su primer propietario. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3465}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3466}"
  fr: "L'indiras désigne l'effacement des marques d'une chose, tandis que sa trace demeure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3463} Son statut dépend de son objet. Une mosquée laissée à l'abandon reste une mosquée pour Abou Hanifa et Abou Yusuf; Mahomet considérait qu'elle retourne à son fondateur, et les Hanbalites autorisent la vente d'une partie pour la restauration du reste. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3463}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3464} Une dot qui ne produit rien peut être échangée par la plupart des Hanafites avec l'autorisation du juge, les Malikites autorisent l'échange des dotations meubles, et les Chafi'ites sont stricts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3464}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3465} Une tombe musulmane devenue terre peut être ouverte et réutilisée selon la plupart des érudits. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3465} La renaissance des terres mortes effacées est contestée: les Shafi'is et les Hanbalis la gardent pour son premier propriétaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3465}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3466}"
