summary:
  ar: "يفتتح ابن سينا الفن الرابع، وهو في وجوه المعالجات بحسب الأمراض الكلية في اثنين وثلاثين فصلاً، بفصل كلي في العلاج، فيقرر أن العلاج يتم بثلاثة أشياء: التدبير والتغذية، واستعمال الأدوية، واستعمال أعمال اليد {cite:canon-ibn-sina-print-v1 p.267}."
  en: "Ibn Sina opens the fourth Fann, on the ways of treating diseases taken as wholes, in thirty-two chapters, with a general chapter on treatment: treatment is completed by three things, regimen and feeding, the use of drugs, and the use of the hands {cite:canon-ibn-sina-print-v1 p.267}."
