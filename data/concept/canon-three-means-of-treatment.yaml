id: concept/canon-three-means-of-treatment
class: concept
kind: scientific
label: { ar: "وسائل العلاج الثلاث عند ابن سينا", en: "The three means of treatment in the Canon", ur: "علاج کے تین ذرائع قانون میں", es: "Los tres medios de tratamiento en el Canon", fr: "Les trois moyens de traitement dans le Canon", tr: "İbn Sina'ya göre üç tedavi yöntemi", id: "Tiga Metode Pengobatan menurut Ibn Sina" }
summary:
  ar: "يفتتح ابن سينا الفن الرابع، وهو في وجوه المعالجات بحسب الأمراض الكلية في اثنين وثلاثين فصلاً، بفصل كلي في العلاج، فيقرر أن العلاج يتم بثلاثة أشياء: التدبير والتغذية، واستعمال الأدوية، واستعمال أعمال اليد {cite:canon-ibn-sina-print-v1 p.267}."
  en: "Ibn Sina opens the fourth Fann, on the ways of treating diseases taken as wholes, in thirty-two chapters, with a general chapter on treatment: treatment is completed by three things, regimen and feeding, the use of drugs, and the use of the hands {cite:canon-ibn-sina-print-v1 p.267}."
  es: "Ibn Sina abre el cuarto Fann, sobre las formas de tratar las enfermedades consideradas en su conjunto, en treinta y dos capítulos, con un capítulo general sobre el tratamiento: el tratamiento se completa con tres cosas, régimen y alimentación, el uso de medicamentos y el uso de las manos {cite:canon-ibn-sina-print-v1 p.267}."
  fr: "Ibn Sina ouvre le quatrième Fann, sur les moyens de traiter les maladies prises dans leur ensemble, en trente-deux chapitres, avec un chapitre général sur le traitement: le traitement est complété par trois choses, le régime et l'alimentation, l'utilisation de médicaments et l'utilisation des mains {cite:canon-ibn-sina-print-v1 p.267}."
  ur: "ابن سینا نے بتیس ابواب میں مکمل بیماریوں کے علاج کے طریقوں پر چوتھا فین کھولا ہے جس میں علاج کے بارے میں ایک عمومی باب ہے: علاج تین چیزوں سے مکمل ہوتا ہے، غذا اور خوراک، دوائیوں کا استعمال، اور ہاتھوں کا استعمال۔"
  tr: "İbn Sina, genel hastalıklara göre tedavileri otuz iki bölümde ele alan dördüncü sanatı kapsamlı bir tedavi bölümüyle açar ve tedavinin üç şeyle yapıldığını belirtir: yönetim ve beslenme, ilaç kullanımı ve el emeği kullanımı {cite:canon-ibn-sina-print-v1 s.267}."
  id: "Ibn Sina membuka seni keempat, yang membahas pengobatan berdasarkan penyakit umum dalam tiga puluh dua bab, dengan bab komprehensif tentang pengobatan, dan ia menyatakan bahwa pengobatan dilakukan melalui tiga hal: manajemen dan nutrisi, penggunaan obat-obatan, dan penggunaan tenaga kerja manual {cite:canon-ibn-sina-print-v1 hlm.267}."
