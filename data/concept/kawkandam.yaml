summary:
  ar: "الكوكندم شيء خفيف كالأشنة طيني، يسميه أهل الرقة خرء الحمام، وببغداد جوز جندم، وأجوده البربري، وهو عند الكتاب حار رطب في الأولى، يجفف، ويزيد في المني، ومسمن جدا."
  en: "Kawkandam is a light, earthy thing like lichen. People in Raqqa call it pigeon dung, and in Baghdad jawz jandam. The best is the Berber kind. The book classes it as hot and moist in the first degree; it dries, is said to increase semen, and is very fattening."
  ur: "کوکندم ایک ہلکی، مٹی جیسی شے ہے جو کائی کی طرح ہوتی ہے۔ رقہ کے لوگ اسے کبوتر کی بیٹ کہتے ہیں اور بغداد میں جوز جندم۔ سب سے اچھی قسم بربری ہے۔ کتاب اسے پہلے درجے میں گرم اور تر بتاتی ہے؛ یہ خشک کرتی ہے، کہا جاتا ہے کہ منی بڑھاتی ہے، اور بہت موٹا کرنے والی ہے۔"
  es: "El kawkandam es una sustancia ligera y terrosa, parecida al liquen. En Raqqa lo llaman excremento de paloma, y en Bagdad, jawz jandam. El mejor es el bereber. El libro lo clasifica como caliente y húmedo en primer grado; al secarse, se dice que aumenta el semen y es muy engordante."
  fr: "Le kawkandam est une substance légère et terreuse, semblable au lichen. À Raqqa, on l'appelle fiente de pigeon, et à Bagdad, jawz jandam. La meilleure variété est celle des Berbères. Le livre la classe comme chaude et humide au premier degré; elle sèche, est réputée augmenter la production de sperme et est très nourrissante."
