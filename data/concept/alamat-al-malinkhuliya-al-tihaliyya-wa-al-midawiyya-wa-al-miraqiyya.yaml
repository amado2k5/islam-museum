id: concept/alamat-al-malinkhuliya-al-tihaliyya-wa-al-midawiyya-wa-al-miraqiyya
class: concept
kind: scientific
label:
  ar: "علامات المالنخوليا الطحالية والمعدية والمراقية"
  en: "Signs of spleen, stomach and hypochondriac melancholia"
  fr: "Les signes de la mélancolie splénique, gastrique et hypocondriaque"
  ur: "تلی، معدے اور مراق سے مالنخولیا کی علامات"
  es: "Signos de melancolía del bazo, el estómago y el hipocondría"
  tr: "Dalak, bulaşıcı ve mirik melankolinin belirtileri"
  id: "Gejala limpa, menular, dan melankoli myric"
summary:
  ar: "يذكر ابن سينا علامات المالنخوليا بحسب العضو: الطحال ⁦(كثرة الشهوة وقلة الهضم وانتفاخ الطحال)⁩، والمعدة ⁦(علامات ورمها وزيادة العلة مع التخمة)⁩، والمراق ⁦(ثقل وتهوع وفساد هضم ووجع)⁩، وفيه سطر موسوم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v2 p.106} {cite:canon-ibn-sina-print-v2 p.107}"
  en: "Ibn Sina gives the signs of melancholia by organ: the spleen (abundant appetite, poor digestion, swelling of the spleen), the stomach (the signs of its swelling and increase with indigestion) and the hypochondrium (heaviness, retching, spoiled digestion, pain); the record has a labelled line in a section held for the founder's ruling {cite:canon-ibn-sina-print-v2 p.106} {cite:canon-ibn-sina-print-v2 p.107}"
  fr: "Ibn Sina donne les signes de la mélancolie selon l’organe : la rate (appétit abondant, digestion faible, tuméfaction de la rate), l’estomac (les signes de sa tuméfaction et l’augmentation avec l’indigestion) et l’hypocondre (lourdeur, haut-le-cœur, digestion corrompue, douleur) ; la fiche comporte une ligne signalée dans une section en attente de la décision du fondateur {cite:canon-ibn-sina-print-v2 p.106} {cite:canon-ibn-sina-print-v2 p.107}"
  ur: "ابن سینا عضو کے لحاظ سے مالنخولیا کی علامات بتاتا ہے: تلی ⁦(بھوک کی زیادتی، ہضم کی کمی، تلی کا پھول جانا)⁩، معدہ ⁦(اس کے ورم کی علامات اور بدہضمی سے مرض کا بڑھنا)⁩ اور مراق ⁦(بوجھ، متلی، بگڑا ہوا ہضم، درد)⁩؛ اس میں ایک موسوم سطر بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v2 p.106} {cite:canon-ibn-sina-print-v2 p.107}۔"
  es: "Ibn Sina da los signos de melancolía por órgano: el bazo (apetito abundante, mala digestión, hinchazón del bazo), el estómago (signos de hinchazón y aumento con indigestión) y el hipocondrio (pesadez, arcadas, digestión deficiente, dolor); el registro tiene una línea etiquetada en una sección reservada para el dictamen del fundador {cite:canon-ibn-sina-print-v2 p.106} {cite:canon-ibn-sina-print-v2 p.107}"
  tr: "İbn Sina, melankoli belirtilerini organa göre sıralar: dalak (aşırı arzu, kötü sindirim ve dalak şişmesi), mide (şişlik ve toklukla artan rahatsızlık belirtileri) ve dalak (ağırlık, kusma, kötü sindirim ve ağrı) ve kurucunun kararı üzerine bir bölümde başlıklı bir satır vardır {cite:canon-ibn-sina-print-v2 s.106} {cite:canon-ibn-sina-print-v2 s.107}"
  id: "Ibn Sina mencantumkan gejala melankoli menurut organ: limpa (keinginan berlebihan, pencernaan yang buruk, dan pembengkakan limpa), lambung (gejala ketidaknyamanan yang meningkat akibat kembung dan kenyang), dan limpa (berat, muntah, pencernaan buruk, dan nyeri), dan ada bagian berjudul pada keputusan pendiri {cite:canon-ibn-sina-print-v2 hlm.106} {cite:canon-ibn-sina-print-v2 hlm.107}"
