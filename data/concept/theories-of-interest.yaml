label:
  ar: "نظريات الفائدة ومناقشتها"
  en: "Theories of interest and their critique"
issue:
  ar: "هل تبرر النظريات الاقتصادية الفائدة، وهل يقبل الفقه الإسلامي تبريرها؟"
summary:
  ar: "يعرض المؤلف نظريات الاقتصاديين في تبرير الفائدة، ومنها المخاطرة، والتثمير، والاستعمال، وإنتاجية رأس المال، والزمن، وتفضيل السيولة، وأجر الادخار، والعمل المتراكم، والندرة، والتأمين {cite:usul-iqtisad-islami-0660 p. 270} {cite:usul-iqtisad-islami-0660 p. 277}. ويرى أنها تبرر عائد رأس المال، ولا تبرر هذا الشكل الخاص وهو الفائدة، وأن نظرية التفضيل الزمني أقواها وقد عرفها الفقهاء {cite:usul-iqtisad-islami-0660 p. 278} {cite:usul-iqtisad-islami-0660 p. 279}."
wings: [ideas]
themes:
- trade-and-finance
- ethics-and-character
regions:
- global
perspectives:
  - tradition: sunni
    id: classical-jurists
    summary:
      ar: "يقرر الفقهاء القدامى أن القرض لا يجوز فيه زيادة، وأن الزيادة في البيع الآجل جائزة لأجل الزمن، وأن للزمن حصة من الثمن، وأن المعجل خير من المؤجل إذا تساوى النقد والنسيئة {cite:usul-iqtisad-islami-0660 p. 203} {cite:usul-iqtisad-islami-0660 p. 204} {cite:usul-iqtisad-islami-0660 p. 278}."
    sources: [source/usul-iqtisad-islami-0660]
  - tradition: academic
    id: economists-theories
    summary:
      ar: "ينقل المؤلف عن الاقتصاديين الغربيين، ومنهم هابرلر وموريس آليه وسامويلسون، أن نظرية الفائدة كانت نقطة ضعف في علم الاقتصاد، وأن مشكلتها من أعوص المشكلات {cite:usul-iqtisad-islami-0660 p. 269} {cite:usul-iqtisad-islami-0660 p. 270}، وأن بعضهم يبرر الفائدة بالمخاطرة أو الإنتاجية أو التفضيل الزمني {cite:usul-iqtisad-islami-0660 p. 271}."
    sources: [source/usul-iqtisad-islami-0660]
  - tradition: other
    id: author-critique
    summary:
      ar: "يرى المؤلف أن النظريات تصلح لمواجهة الاشتراكية التي حرمت العائد على رأس المال، ولا تصلح لتبرير الفائدة في الإسلام، لأن الإسلام يحرم الفائدة في القرض ويجيز الزيادة في البيع الآجل والمشاركة بالربح {cite:usul-iqtisad-islami-0660 p. 278}."
    sources: [source/usul-iqtisad-islami-0660]
