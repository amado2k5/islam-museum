id: concept/khibra-expertise
class: concept
kind: legal
label: { ar: "الخبرة", en: "Khibra (expertise, and its use in vetting witnesses)", ur: "خبرۃ", es: "Khibra (experiencia y su uso en la verificación de testigos)", fr: "Khibra (expertise et son utilisation dans la vérification des témoins)", tr: "Deneyim", id: "Pengalaman" }
summary:
  ar: "الخبرة لغة العلم بالشيء ومعرفته على حقيقته، وأهل الخبرة ذووها، والخبير اسم من أسماء الله تعالى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7541} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7542} وتفترق الخبرة عن العلم والمعرفة بأنها العلم بكنه الشيء على حقيقته، وعن التجربة بأنها لا تلزم فيها التكرار، وعن الحذق بأنه المهارة في الصنعة غالبا، وعن الفراسة بأنها تثبت وتأمل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7542} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7543} ويعتمد الفقهاء على قول أهل الخبرة في كثير من الأحكام، ومنها تزكية الشهود؛ فجمهورهم يوجب على القاضي أن يطلب من يزكي الشهود عنده، ويشترط في المزكي معرفة أسباب الجرح والتعديل ومعرفة باطن من يعدّله بالخبرة أو الجوار أو المعاملة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7544}  ويعتمد الفقهاء على أهل الخبرة في الخرص، وهو التقدير بالحزر لمعرفة قدر الزكاة في التمر والعنب، فيبعث الإمام من يخرصها عند بدو الصلاح عند الجمهور؛ والحنفية يرون الخرص ظنا لا يلزم به حكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7545} والقائف يعرف الآثار ويتبعها ويعرف شبه الرجل بأبيه وأخيه، والجمهور خلافا للحنفية يعملون بقوله في إثبات النسب إذا كان خبيرا مجربا، ويكفي قائف واحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7546} وفي التقويم يعتمد الفقهاء على أهل الخبرة من التجار وأهل الصنعة في قيمة المتلفات وأروش الجنايات والعيوب الموجبة للخيار، ويشترط التعدد إذا تعلق بالتقويم حد من الحدود كالنصاب في المسروق، وقيل في الشهادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7546} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7547} ويعتبر قول أهل الخبرة شهادة فيجب فيه اثنان عند الجمهور إن كان على جهة الشهادة، ويكفي الواحد إن كان على جهة الإخبار كالطبيب والبيطار والخارص والقائف والقاسم وقايس الشجاج؛ ولا يعتبر قول الواحد فيما يتعلق بحد من حدود الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7548} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7549} وإذا اختلف أهل الخبرة فلكل مسألة حكمها؛ فالحنفية يرون أن العيب الذي لا يتفق عليه التجار لا يوجب الرد، والمالكية يرجحون أعدل البينتين، والشافعية يصدقون المشتري فيما يشك فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7550}"
  en: "Khibra (expertise) lexically is the knowledge of a thing's true nature; its people are the experts, and Khabir is a name of God. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7541} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7542} Expertise differs from knowledge and recognition in that it is the knowledge of a thing's inner reality, from trial (tajriba) in needing no repetition, from skill (hidhq) in being broader than craft, and from physiognomy (firasa) in being mostly by study rather than insight. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7542} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7543} The jurists rely on the word of experts in many rulings, including the vetting of witnesses; most require the judge to seek those who vouch for the witnesses, and the vetter must know the grounds of reproach and praise and the inner conduct of the one he vouches for, through knowledge, neighbourhood or dealing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7544}  The jurists rely on experts in estimating dates and grapes for zakat (kharṣ), the estimate given when the fruit is ready, which the majority require the imam to send someone to make; the Hanafis call it a guess that binds no one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7545} The qa'if traces and recognises kinship from likeness, and the majority, against the Hanafis, act on his word on descent if he is experienced; one qa'if suffices. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7546} In valuation the jurists rely on experts among merchants and craftsmen for the value of what was destroyed, the compensation for injuries and the defects that give a right to annul; more than one assessor is needed where a legal penalty depends on the value, as for the value of stolen goods. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7546} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7547} Expert testimony is testimony when it is given as such and then two are needed by the majority, but one suffices when given as information, as with physicians, veterinarians, the estimator of dates, the tracker of kinship, the divider of inheritance and the measurer of wounds; a single witness does not suffice where a legal penalty depends on it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7548} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7549} When experts disagree, each question has its ruling: the Hanafis hold that a defect not agreed on by merchants gives no right to return, the Malikis prefer the more just of two testimonies, and the Shafiis believe the buyer where in doubt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7550}"
  ur: "خبرۃ لغت میں کسی چیز کی حقیقت کو جاننے اور اس کا علم رکھنے کو کہتے ہیں؛ اہلِ خبرۃ وہ ہیں جو اس کا علم رکھتے ہیں، اور «خبیر» اللہ تعالیٰ کے ناموں میں سے ایک ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7541} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7542} خبرۃ علم اور معرفت سے اس طرح ممیز ہے کہ یہ کسی چیز کی حقیقت کا علم ہے، تجربہ سے اس طرح کہ اس میں تکرار لازم نہیں، حذق ⁦(مہارت)⁩ سے اس طرح کہ یہ عموماً صنعت کی مہارت ہے، اور فراست سے اس طرح کہ یہ تثبت اور غور و فکر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7542} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7543} فقہاء بہت سے احکام میں اہلِ خبرۃ کی بات پر اعتماد کرتے ہیں، جن میں گواہوں کی تزکیہ شامل ہے؛ جمہور قاضی پر لازم کرتے ہیں کہ وہ گواہوں کی تزکیہ کرنے والے طلب کرے، اور مزکی کے لیے جرح و تعدیل کے اسباب اور جس کی تعدیل کرے اس کے باطن کی معرفت شرط ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7544}  فقہاء زکوٰۃ کے لیے کھجور اور انگور کے اندازے ⁦(خرص)⁩ میں اہلِ خبرۃ پر اعتماد کرتے ہیں، جس کے لیے جمہور کے نزدیک امام کسی کو بھیجے گا؛ حنفیہ خرص کو ایک گمان کہتے ہیں جس سے کوئی حکم لازم نہیں ہوتا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7545} قائف نشانات پہچانتا ہے اور مشابہت سے نسب پہچانتا ہے، اور جمہور حنفیہ کے خلاف اس کے قول پر نسب کا فیصلہ کرتے ہیں اگر وہ تجربہ کار ہو، اور ایک قائف کافی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7546} قیمت کے تعین میں اہلِ خبرۃ تاجروں اور کاریگروں پر اعتماد ہوتا ہے، تلف شدہ مال کی قیمت، جنایات کے ارش اور عیب میں، اور جب قیمت پر کوئی حد موقوف ہو جیسے چوری شدہ مال کا نصاب، تو ایک سے زیادہ مقومین ضروری ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7546} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7547} اہلِ خبرۃ کی بات اگر شہادت کے طور پر ہو تو جمہور کے نزدیک دو گواہ ضروری ہیں، اور اگر اخبار ⁦(اطلاع)⁩ کے طور پر ہو تو ایک کافی ہے، جیسے طبیب، بیطار، خارص، قائف، قاسم اور زخموں کا اندازہ کرنے والا؛ جس بات پر حدِ الٰہی موقوف ہو وہاں ایک کی بات کافی نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7548} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7549} اہلِ خبرۃ میں اختلاف ہو تو ہر مسئلے کا الگ حکم ہے: حنفیہ کے نزدیک جس عیب پر تاجر متفق نہ ہوں وہ ردّ کا سبب نہیں، مالکیہ زیادہ عادل گواہی کو ترجیح دیتے ہیں، اور شافعیہ شک میں خریدار کی بات مانتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7550}"
  es: "Khibra (experiencia) léxicamente es el conocimiento de la verdadera naturaleza de una cosa; sus personas son los expertos, y Khabir es un nombre de Dios. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7541} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7542} La experiencia se diferencia del conocimiento y el reconocimiento en que es el conocimiento de la realidad interna de una cosa, de la prueba (tajriba) en que no necesita repetición, de la habilidad (hidhq) en que es más amplia que el oficio, y de la fisonomía (firasa) en que se basa principalmente en el estudio más que en la intuición. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7542} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7543} Los juristas se basan en la palabra de expertos en muchas resoluciones, incluyendo la verificación de testigos; la mayoría requiere que el juez busque a quienes respondan por los testigos, y el verificador debe conocer los motivos de reproche y alabanza y la conducta interna de aquel por quien responde, a través del conocimiento, la vecindad o el trato. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7544} Los juristas se basan en expertos para estimar dátiles y uvas para zakat (kharṣ), la estimación que se da cuando la fruta está lista, que la mayoría requiere que el imán envíe a alguien para hacer; Los hanafíes lo llaman una suposición que no obliga a nadie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7545} El qa'if rastrea y reconoce el parentesco por semejanza, y la mayoría, en contra de los hanafíes, actúa según su palabra en la descendencia si es experimentado; un qa'if es suficiente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7546} En la valoración, los juristas se basan en expertos entre comerciantes y artesanos para el valor de lo destruido, la compensación por daños y los defectos que dan derecho a anular; se necesita más de un tasador cuando una sanción legal depende del valor, como para el valor de los bienes robados. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7546} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7547} El testimonio de un experto es testimonio cuando se da como tal y entonces la mayoría necesita dos, pero uno basta cuando se da como información, como en el caso de médicos, veterinarios, el estimador de fechas, el rastreador de parentesco, el divisor de herencias y el medidor de heridas; un solo testigo no basta cuando de él depende una pena legal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7548} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7549} Cuando los expertos no están de acuerdo, cada cuestión tiene su decisión: los Hanafis sostienen que un defecto no acordado por los comerciantes no da derecho a devolución, los Malikis prefieren el más justo de dos testimonios, y los Shafiis creen que el comprador tiene dudas. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7549} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7550}"
  fr: "Le terme « khibra » (expertise) désigne lexicalement la connaissance de la véritable nature d'une chose; les personnes qui la pratiquent en sont les experts, et Khabir est un nom de Dieu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7541} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7542} L'expertise se distingue de la connaissance et de la reconnaissance en ce qu'elle est la connaissance de la réalité intérieure d'une chose, de l'épreuve (tajriba) en ce qu'elle ne nécessite aucune répétition, de la compétence (hidhq) en ce qu'elle est plus vaste que le simple savoir-faire, et de la physionomie (firasa) en ce qu'elle repose principalement sur l'étude plutôt que sur l'intuition. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7542} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7543} Les juristes s'appuient sur l'avis d'experts dans de nombreuses décisions, notamment pour la vérification des témoins; la plupart exigent que le juge recherche ceux qui se portent garants des témoins, et le vérificateur doit connaître les motifs de reproche et d'éloge ainsi que la conduite intérieure de celui pour qui il se porte garant, par connaissance, entourage ou relations d'affaires. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7544} Les juristes s'appuient sur des experts pour estimer les dattes et les raisins destinés à la zakat (kharṣ), l'estimation étant donnée lorsque le fruit est mûr, et la majorité exige que l'imam envoie quelqu'un pour l'effectuer; Les hanafites le qualifient de supposition non contraignante. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7545} Le qa'if établit et reconnaît la parenté par ressemblance, et la majorité, contrairement aux hanafites, se fie à sa parole quant à la filiation s'il est expérimenté; un seul qa'if suffit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7546} Pour l'évaluation, les juristes s'appuient sur des experts parmi les marchands et les artisans pour déterminer la valeur des biens détruits, l'indemnisation des préjudices et les vices donnant droit à l'annulation; plusieurs évaluateurs sont nécessaires lorsqu'une sanction légale dépend de la valeur, comme pour les biens volés. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7546} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7547} Le témoignage d'expert est un témoignage lorsqu'il est donné comme tel et alors deux sont nécessaires à la majorité, mais un seul suffit lorsqu'il est donné à titre d'information, comme dans le cas des médecins, des vétérinaires, de l'estimateur de dates, du traqueur de parenté, du partage d'héritage et du mesureur de blessures; un seul témoin ne suffit pas lorsqu'une sanction légale en dépend. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7548} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7549} Quand les experts ne sont pas d'accord, chaque question a sa décision: les Hanafis estiment qu'un défaut non accepté par les commerçants ne donne pas droit au retour, les Malikis préfèrent le plus juste des deux témoignages, et les Shafiis croient que l'acheteur a un doute. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7550}"
  tr: "Deneyim, bir şeyin bilgisinin ve onu olduğu gibi bilmenin dilidir. Uzmanlar bilgiye sahip olanlardır ve uzman Yüce Allah'ın isimlerinden biridir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7541} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7542} Deneyim, bilgi olarak bilgi olarak bir şeyin özünü olduğu gibi bilmekten, deneyimden tekrar gerektirmediği için, genel zanaatkârlıkta beceriden ve kanıtlamak ve düşünmek kadar içgörüden farklıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7542} {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 s.. 7543} Hukukçular, tanıkların onaylanması da dahil olmak üzere birçok kararda uzmanların görüşüne dayanır; çoğunlukları hakimin kendisinden tanıkları onaylatacak birini aramasını ister ve tanıklık edenin eleştiri, düzeltme nedenlerini ve deneyim, komşuluk veya ilişkilerle haklı çıkaran kişinin iç benliğini bilmesi gerekir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.75444} Hukukçular, hurma ve üzümdeki zakat miktarını tahminle belirlemek için tahminle tahmin yapan harras uzmanlarına güvenirler. Çoğunluk kharaların çoğunluk tarafından kabul edildiğini düşündüğünde imam birini onları örtbas etmek için gönderir; Hanafiler kharaları karar gerektirmeyen bir varsayım olarak görür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7545} Kafiye bilinir ve anlatımları takip eder; bir adamın babasına veya kardeşine benzerliği vardır. Hanefilerin aksine, çoğunluk, deneyimli bir uzman ise soyunu kanıtlamak için onun ifadesini takip eder ve bir kaf yeterlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7546} Değerlemede, hukukçular hasar görmüş eşyaların değeri, ceza davalarının sayısı ve bu seçeneği haklı çıkaran kusurlar konusunda tüccar ve zanaatkârlar arasında uzmanlara dayanırlar. Değerlendirme sabit bir cezayla ilgiliyse, örneğin çalıntı mallarda nisab ve bazıları tanıklıkta belirtilir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7546}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7547} Uzmanların görüşü tanıklık olarak kabul edilir, bu yüzden çoğunluğa göre tanıklık tarafındaysa, iki kişi gerekir. Rapor tarafında olan bir kişi için yeterlidir; örneğin doktor, bitar, al-kharis, kaif, al-Qasim ve Qais al-Shajaj gibi; bir kişinin sınırla ilgili açıklaması Allah'ın sınırlarının bir parçası olarak kabul edilmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7548} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7549} Uzmanlar farklı düşünse de, her konunun bir hükmü vardır; Hanafiler, tüccarların üzerinde anlaşamadığı bir kusurun iade edilmeyeceğine inanırken, Malikiler iki delilin en adil olanını tercih eder, Şafi'ler ise şüphe durumunda alıcıya inanır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7550}"
  id: "Pengalaman adalah bahasa pengetahuan tentang sesuatu dan mengetahuinya sebagaimana adanya. Para ahli adalah mereka yang memiliki pengetahuan, dan ahli adalah salah satu nama Allah Yang Maha Kuasa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7541} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7542} Pengalaman berbeda dengan pengetahuan dan pemahaman sebagai pengetahuan tentang esensi sesuatu sebagaimana adanya, dari pengalaman karena tidak memerlukan pengulangan, dari keterampilan dalam kerajinan secara umum, dan wawasan sebagai bukti dan renungan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7542} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7543} Para ahli hukum mengandalkan pendapat para ahli dalam banyak putusan, termasuk pengesahan saksi; mayoritas mereka mengharuskan hakim mencari seseorang yang mendukung saksi darinya, dan orang yang bersaksi harus mengetahui alasan kritik, koreksi, dan sisi batin orang yang membenarkannya melalui pengalaman, keakraban bersahabat, atau pergaulan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.75444} Para ahli hukum mengandalkan ahli kharras, yaitu memperkirakan berdasarkan estimasi untuk menentukan jumlah zakat pada kurma dan anggur. Imam mengirim seseorang untuk menutupi mereka ketika mayoritas menganggap khara dianggap oleh mayoritas; Hanafi menganggap khara sebagai prasangka yang tidak memerlukan keputusan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7545} Rima ini diketahui dan mengikuti narasi, serta kemiripan seorang pria dengan ayah atau saudaranya. Mayoritas, berbeda dengan Hanafi, mengikuti pernyataannya untuk membuktikan garis keturunan jika ia adalah ahli berpengalaman, dan satu qāf sudah cukup. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7546} Dalam penilaian, ahli hukum mengandalkan para ahli di antara pedagang dan pengrajin mengenai nilai barang yang rusak, jumlah kasus pidana, dan cacat yang membenarkan opsi tersebut. Hukuman ganda diperlukan jika evaluasi terkait dengan hukuman tetap, seperti nisab pada barang curian, dan beberapa mengatakan dalam kesaksian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7546} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7547} Pendapat para ahli dianggap sebagai kesaksian, jadi dua pendapat diperlukan menurut mayoritas jika itu berpihak pada kesaksian. Cukup bagi satu orang jika dia berada di pihak laporan, seperti dokter, bitar, al-kharis, qa'if, al-Qasim, dan Qais al-Shajaj; pernyataan satu orang mengenai batas tidak dianggap sebagai bagian dari batas Allah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7548} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7549} Jika para ahli berbeda, setiap isu memiliki keputusan; kaum Hanafi percaya bahwa cacat yang tidak disepakati oleh para pedagang tidak pantas dipulangkan lagi, kaum Maliki lebih memilih bukti yang paling adil dari kedua bukti, dan kaum Shafi'i percaya pada pembeli dalam hal yang diragukan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7550}"
