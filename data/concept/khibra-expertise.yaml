label: { ar: "الخبرة", en: "Khibra (expertise, and its use in vetting witnesses)", ur: "خبرۃ" }
summary:
  ar: "الخبرة لغة العلم بالشيء ومعرفته على حقيقته، وأهل الخبرة ذووها، والخبير اسم من أسماء الله تعالى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7541} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7542} وتفترق الخبرة عن العلم والمعرفة بأنها العلم بكنه الشيء على حقيقته، وعن التجربة بأنها لا تلزم فيها التكرار، وعن الحذق بأنه المهارة في الصنعة غالبا، وعن الفراسة بأنها تثبت وتأمل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7542} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7543} ويعتمد الفقهاء على قول أهل الخبرة في كثير من الأحكام، ومنها تزكية الشهود؛ فجمهورهم يوجب على القاضي أن يطلب من يزكي الشهود عنده، ويشترط في المزكي معرفة أسباب الجرح والتعديل ومعرفة باطن من يعدّله بالخبرة أو الجوار أو المعاملة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7544}  ويعتمد الفقهاء على أهل الخبرة في الخرص، وهو التقدير بالحزر لمعرفة قدر الزكاة في التمر والعنب، فيبعث الإمام من يخرصها عند بدو الصلاح عند الجمهور؛ والحنفية يرون الخرص ظنا لا يلزم به حكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7545} والقائف يعرف الآثار ويتبعها ويعرف شبه الرجل بأبيه وأخيه، والجمهور خلافا للحنفية يعملون بقوله في إثبات النسب إذا كان خبيرا مجربا، ويكفي قائف واحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7546} وفي التقويم يعتمد الفقهاء على أهل الخبرة من التجار وأهل الصنعة في قيمة المتلفات وأروش الجنايات والعيوب الموجبة للخيار، ويشترط التعدد إذا تعلق بالتقويم حد من الحدود كالنصاب في المسروق، وقيل في الشهادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7546} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7547} ويعتبر قول أهل الخبرة شهادة فيجب فيه اثنان عند الجمهور إن كان على جهة الشهادة، ويكفي الواحد إن كان على جهة الإخبار كالطبيب والبيطار والخارص والقائف والقاسم وقايس الشجاج؛ ولا يعتبر قول الواحد فيما يتعلق بحد من حدود الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7548} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7549} وإذا اختلف أهل الخبرة فلكل مسألة حكمها؛ فالحنفية يرون أن العيب الذي لا يتفق عليه التجار لا يوجب الرد، والمالكية يرجحون أعدل البينتين، والشافعية يصدقون المشتري فيما يشك فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7550}"
  en: "Khibra (expertise) lexically is the knowledge of a thing's true nature; its people are the experts, and Khabir is a name of God. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7541} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7542} Expertise differs from knowledge and recognition in that it is the knowledge of a thing's inner reality, from trial (tajriba) in needing no repetition, from skill (hidhq) in being broader than craft, and from physiognomy (firasa) in being mostly by study rather than insight. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7542} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7543} The jurists rely on the word of experts in many rulings, including the vetting of witnesses; most require the judge to seek those who vouch for the witnesses, and the vetter must know the grounds of reproach and praise and the inner conduct of the one he vouches for, through knowledge, neighbourhood or dealing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7544}  The jurists rely on experts in estimating dates and grapes for zakat (kharṣ), the estimate given when the fruit is ready, which the majority require the imam to send someone to make; the Hanafis call it a guess that binds no one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7545} The qa'if traces and recognises kinship from likeness, and the majority, against the Hanafis, act on his word on descent if he is experienced; one qa'if suffices. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7546} In valuation the jurists rely on experts among merchants and craftsmen for the value of what was destroyed, the compensation for injuries and the defects that give a right to annul; more than one assessor is needed where a legal penalty depends on the value, as for the value of stolen goods. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7546} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7547} Expert testimony is testimony when it is given as such and then two are needed by the majority, but one suffices when given as information, as with physicians, veterinarians, the estimator of dates, the tracker of kinship, the divider of inheritance and the measurer of wounds; a single witness does not suffice where a legal penalty depends on it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7548} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7549} When experts disagree, each question has its ruling: the Hanafis hold that a defect not agreed on by merchants gives no right to return, the Malikis prefer the more just of two testimonies, and the Shafiis believe the buyer where in doubt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7550}"
  ur: "خبرۃ لغت میں کسی چیز کی حقیقت کو جاننے اور اس کا علم رکھنے کو کہتے ہیں؛ اہلِ خبرۃ وہ ہیں جو اس کا علم رکھتے ہیں، اور «خبیر» اللہ تعالیٰ کے ناموں میں سے ایک ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7541} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7542} خبرۃ علم اور معرفت سے اس طرح ممیز ہے کہ یہ کسی چیز کی حقیقت کا علم ہے، تجربہ سے اس طرح کہ اس میں تکرار لازم نہیں، حذق (مہارت) سے اس طرح کہ یہ عموماً صنعت کی مہارت ہے، اور فراست سے اس طرح کہ یہ تثبت اور غور و فکر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7542} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7543} فقہاء بہت سے احکام میں اہلِ خبرۃ کی بات پر اعتماد کرتے ہیں، جن میں گواہوں کی تزکیہ شامل ہے؛ جمہور قاضی پر لازم کرتے ہیں کہ وہ گواہوں کی تزکیہ کرنے والے طلب کرے، اور مزکی کے لیے جرح و تعدیل کے اسباب اور جس کی تعدیل کرے اس کے باطن کی معرفت شرط ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7544}  فقہاء زکوٰۃ کے لیے کھجور اور انگور کے اندازے (خرص) میں اہلِ خبرۃ پر اعتماد کرتے ہیں، جس کے لیے جمہور کے نزدیک امام کسی کو بھیجے گا؛ حنفیہ خرص کو ایک گمان کہتے ہیں جس سے کوئی حکم لازم نہیں ہوتا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7545} قائف نشانات پہچانتا ہے اور مشابہت سے نسب پہچانتا ہے، اور جمہور حنفیہ کے خلاف اس کے قول پر نسب کا فیصلہ کرتے ہیں اگر وہ تجربہ کار ہو، اور ایک قائف کافی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7546} قیمت کے تعین میں اہلِ خبرۃ تاجروں اور کاریگروں پر اعتماد ہوتا ہے، تلف شدہ مال کی قیمت، جنایات کے ارش اور عیب میں، اور جب قیمت پر کوئی حد موقوف ہو جیسے چوری شدہ مال کا نصاب، تو ایک سے زیادہ مقومین ضروری ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7546} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7547} اہلِ خبرۃ کی بات اگر شہادت کے طور پر ہو تو جمہور کے نزدیک دو گواہ ضروری ہیں، اور اگر اخبار (اطلاع) کے طور پر ہو تو ایک کافی ہے، جیسے طبیب، بیطار، خارص، قائف، قاسم اور زخموں کا اندازہ کرنے والا؛ جس بات پر حدِ الٰہی موقوف ہو وہاں ایک کی بات کافی نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7548} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7549} اہلِ خبرۃ میں اختلاف ہو تو ہر مسئلے کا الگ حکم ہے: حنفیہ کے نزدیک جس عیب پر تاجر متفق نہ ہوں وہ ردّ کا سبب نہیں، مالکیہ زیادہ عادل گواہی کو ترجیح دیتے ہیں، اور شافعیہ شک میں خریدار کی بات مانتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7550}"
