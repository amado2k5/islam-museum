summary:
  ar: "غاريقون في الكتاب ينقل وصفه عن ديسقوريدوس ذكرا وأنثى، حار في الأولى يابس في الثانية، محلل مقطع للأخلاط الغليظة مفتح للسدد ملطف، ينفع من الأورام وعرق النسا والصرع والربو وقرحة الرئة واليرقان وأورام الطحال ووجع المعدة والكبد، ويسهل السوداء والبلغم، وينفع من النافض والحميات العتيقة، ويضمد به للسع الهوام؛ وفيه نقل موسوم عن البول والطمث وخنق الرحم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v1 pp.723-724}"
  en: "Gharyqun is in the book described, from Dioscorides, as male and female, hot in the first degree and dry in the second, dissolving, cutting thick humours, opening obstructions and subtilising; it benefits swellings, sciatica, epilepsy, asthma, ulcer of the lung, jaundice, swellings of the spleen and pain of the stomach and liver, loosens black bile and phlegm, benefits rigor and old fevers, and is applied as a poultice for stings of vermin; it has a labelled listing on urine, menses and suffocation of the womb in a section held for the founder's ruling {cite:canon-ibn-sina-print-v1 pp.723-724}"
  ur: "غاریقون کتاب میں دیسقوریدوس سے نقل کے مطابق نر اور مادہ بیان ہوا ہے، پہلے درجے میں گرم اور دوسرے میں خشک، تحلیل کرنے والا، گاڑھی خلطوں کو کاٹنے والا، رکاوٹیں کھولنے والا اور لطیف کرنے والا؛ ورموں، عرق النسا، مرگی، دمے، پھیپھڑے کے قرحے، یرقان، تلی کے ورموں اور معدے اور جگر کے درد میں نافع ہے، سودا اور بلغم کو نرمی سے خارج کرتا ہے، کپکپی اور پرانے بخاروں میں نافع ہے، اور ہوام کے ڈنک پر ضماد کیا جاتا ہے؛ پیشاب، حیض اور رحم کے گھٹن کے بارے میں ایک موسوم نقل بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v1 pp.723-724}۔"
  es: "En el libro de Dioscórides, Gharyqun se describe como masculino y femenino, caliente en el primer grado y seco en el segundo, disolvente, cortante de humores espesos, que abre obstrucciones y sutilizante; beneficia las hinchazones, la ciática, la epilepsia, el asma, la úlcera pulmonar, la ictericia, las inflamaciones del bazo y el dolor de estómago e hígado, fluidifica la bilis negra y la flema, beneficia los escalofríos y las fiebres antiguas, y se aplica como cataplasma para las picaduras de parásitos; tiene una lista etiquetada sobre la orina, la menstruación y la asfixia del útero en una sección reservada para la decisión del fundador {cite:canon-ibn-sina-print-v1 pp.723-724}"
