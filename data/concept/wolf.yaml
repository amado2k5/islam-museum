  en: "The wolf"
  ur: "بھیڑیا"
summary:
  ar: "ذئب يوسف الذي حذّر منه أبوه يعقوب أن يأكله وهو عنهم غافلون فادّعى الإخوة أن الذئب أكله وما كانوا بمصدقين ولو صدقوا، وفي الحديث أخبرت الجارية النبي أن الذئب أكل شاة من غنمها."
  en: "Joseph's wolf, of which his father Jacob warned lest it eat him while they were heedless; the brothers claimed the wolf ate him and would not have been believed even had they spoken true. In hadith a shepherd girl told the Prophet a wolf had eaten a ewe of her flock."
  ur: "یوسف کا بھیڑیا جس سے ان کے والد یعقوب نے ڈرایا کہ کہیں کھا نہ جائے جب وہ بے خبر ہوں؛ بھائیوں نے کہا بھیڑیا کھا گیا اور وہ سچ بھی کہتے تو نہ سنے جاتے۔ حدیث میں ایک چرواہے لڑکی نے نبی کو بتایا کہ بھیڑیا اس کی ریوڑ کی ایک بھیڑ کھا گیا۔"
