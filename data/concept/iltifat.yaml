label: { ar: "الالتفات", en: "Iltifat (turning the head or body)", es: "Iltifat (girar la cabeza o el cuerpo)", fr: "Iltifat (tourner la tête ou le corps)", ur: "الفت ⁦(سر یا جسم کو پھیرنا)⁩" }
summary:
  ar: "الالتفات لغة الانصراف إلى جهة اليمين أو الشمال، ولا يختلف استعمال الفقهاء عنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3313} ويطلب شرعا في الحيعلتين عند الأذان عند أغلب الفقهاء، ويسن عند التسليم في الصلاة، وينهى عنه في الصلاة بالوجه، ويكره عند الأئمة الأربعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3313}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3314}"
  en: "Iltifat is turning to the right or the left, and the jurists use it in the same sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3313} It is recommended while turning to the right and left in the hayya 'ala formulae of the adhan, which most jurists follow; it is recommended in the prayer greeting; and turning the face in prayer is disliked by the four Imams. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3313}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3314}"
  es: "Iltifat significa girar a la derecha o a la izquierda, y los juristas lo usan en el mismo sentido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3313} Se recomienda girar a la derecha y a la izquierda en las fórmulas hayya 'ala del adhan, que la mayoría de los juristas siguen; se recomienda en el saludo de la oración; y girar el rostro en la oración es desaconsejable para los cuatro imanes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3313}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3314}"
  fr: "Iltifat désigne le fait de se tourner à droite ou à gauche, et les juristes l'emploient dans le même sens. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3313} Il est recommandé de se tourner à droite et à gauche lors des formules hayya 'ala de l'adhan, suivies par la plupart des juristes; il est également recommandé lors de la salutation de la prière; et tourner le visage pendant la prière est déconseillé par les quatre imams. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3313}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3314}"
  ur: "التفات دائیں یا بائیں طرف مڑنا ہے اور فقہاء اسے اسی معنی میں استعمال کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3313} اذان کے حیاء الاعلی فارمولوں میں، جن کی اکثر فقہاء پیروی کرتے ہیں، میں دائیں اور بائیں رخ کرنے کی سفارش کی گئی ہے۔ نماز کے سلام میں اس کی سفارش کی جاتی ہے۔ اور نماز میں منہ پھیرنا چاروں اماموں کے نزدیک ناپسندیدہ ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3313}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3314}"
