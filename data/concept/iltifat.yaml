label: { ar: "الالتفات", en: "Iltifat (turning the head or body)" }
summary:
  ar: "الالتفات لغة الانصراف إلى جهة اليمين أو الشمال، ولا يختلف استعمال الفقهاء عنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3313} ويطلب شرعا في الحيعلتين عند الأذان عند أغلب الفقهاء، ويسن عند التسليم في الصلاة، وينهى عنه في الصلاة بالوجه، ويكره عند الأئمة الأربعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3313}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3314}"
  en: "Iltifat is turning to the right or the left, and the jurists use it in the same sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3313} It is recommended while turning to the right and left in the hayya 'ala formulae of the adhan, which most jurists follow; it is recommended in the prayer greeting; and turning the face in prayer is disliked by the four Imams. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3313}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3314}"
