summary:
  ar: "زجاج قلويّه من النطرون المعدني، كان أساس صناعة الزجاج الرومانية والمتأخرة في مصر والشام، واستمر في العصر الإسلامي حتى بداية القرن التاسع في الشام ونحو سنة 870م في مصر {cite:schibille-islamic-glass-2022 p. 22} {cite:schibille-islamic-glass-2022 p. 234}."
  en: "Glass fluxed with mineral natron, the basis of Roman and late antique glassmaking in Egypt and the Levant, continuing into the Islamic period until about 800 in Syria-Palestine and about 870 in Egypt {cite:schibille-islamic-glass-2022 p. 22} {cite:schibille-islamic-glass-2022 p. 234}."
  ur: "معدنی نیٹرون سے پگھلایا گیا شیشہ، مصر و شام میں رومی اور متاخر قدیم شیشہ سازی کی بنیاد، جو اسلامی دور میں شام میں تقریباً 800ء اور مصر میں تقریباً 870ء تک جاری رہا {cite:schibille-islamic-glass-2022 p. 234}."
