summary:
  ar: "الزفت صنفان: بحري أسود سيّال يدخل في المراهم، وجبلي برّي من سيلان شجر التنوب والصنوبر؛ منضج مسخّن، والرطب أشدّ إنضاجاً، واليابس أشدّ تجفيفاً؛ يليّن الأورام الصلبة، ويذهب القوابي، وينبت اللحم في القروح العميقة. {cite:canon-ibn-sina-print-v1 p.463}"
  en: "Pitch has two kinds: a black, flowing sea pitch that enters ointments, and a mountain pitch from the resin of the fir and other pines. It ripens and warms; the moist kind ripens more and the dry kind dries more. It softens hard swellings, clears scabs, and grows flesh in deep ulcers. {cite:canon-ibn-sina-print-v1 p.463}"
  ur: "زفت کی دو قسمیں ہیں: سمندری، سیاہ اور رواں، جو مرہموں میں داخل ہوتا ہے، اور پہاڑی، جو تنوب اور صنوبر کے درختوں کے رس سے ہوتا ہے۔ یہ پکاتا اور گرم کرتا ہے؛ گیلا زیادہ پکاتا ہے اور خشک زیادہ خشک کرتا ہے۔ یہ سخت سوجن کو نرم کرتا، کھرنڈ دور کرتا، اور گہرے السر میں گوشت اگاتا ہے۔ {cite:canon-ibn-sina-print-v1 p.463}"
  es: "La brea tiene dos tipos: una brea marina negra y fluida que se utiliza en ungüentos, y una brea de montaña que se obtiene de la resina del abeto y otros pinos. Madura y se calienta; la brea húmeda madura más y la seca, más. Suaviza las hinchazones duras, elimina las costras y regenera el tejido en úlceras profundas. {cite:canon-ibn-sina-print-v1 p.463}"
  fr: "Il existe deux types de poix: la poix marine, noire et fluide, qui entre dans la composition des onguents, et la poix de montagne, issue de la résine du sapin et d’autres pins. Elle mûrit et se réchauffe; la poix humide mûrit davantage et la poix sèche davantage. Elle ramollit les enflures dures, dissout les croûtes et favorise la cicatrisation des ulcères profonds. {cite:canon-ibn-sina-print-v1 p.463}"
  tr: "İki tür zift vardır: merhemlerde kullanılan siyah, akışkan deniz zifti ve köknar ve çam ağaçlarının özsuyundan yapılan yabani dağ zifti. Olgunlaştırıcı ve ısıtıcı bir maddedir; nemli çeşidi daha olgunlaştırıcı, kuru çeşidi ise daha kurutucudur. Sert tümörleri yumuşatır, uyuz hastalığını iyileştirir ve derin ülserlerde doku büyümesini destekler. {cite:canon-ibn-sina-print-v1 s.463}"
  id: "Ada dua jenis ter: ter laut hitam yang mengalir dan digunakan dalam salep, dan ter pegunungan liar yang terbuat dari getah pohon cemara dan pinus. Ter ini merupakan agen pematangan dan penghangat, dengan jenis yang lembap lebih bersifat mematangkan dan jenis yang kering lebih bersifat mengeringkan. Ter ini melembutkan tumor yang keras, menyembuhkan kudis, dan mendorong pertumbuhan jaringan pada ulkus yang dalam. {cite:canon-ibn-sina-print-v1 p.463}"
