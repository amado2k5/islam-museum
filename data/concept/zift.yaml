  en: "Zift (pitch)"
  ur: "زفت ⁦(رال)⁩"
summary:
  ar: "الزفت صنفان: بحري أسود سيّال يدخل في المراهم، وجبلي برّي من سيلان شجر التنوب والصنوبر؛ منضج مسخّن، والرطب أشدّ إنضاجاً، واليابس أشدّ تجفيفاً؛ يليّن الأورام الصلبة، ويذهب القوابي، وينبت اللحم في القروح العميقة. {cite:canon-ibn-sina-print-v1 p.463}"
  en: "Pitch has two kinds: a black, flowing sea pitch that enters ointments, and a mountain pitch from the resin of the fir and other pines. It ripens and warms; the moist kind ripens more and the dry kind dries more. It softens hard swellings, clears scabs, and grows flesh in deep ulcers. {cite:canon-ibn-sina-print-v1 p.463}"
  ur: "زفت کی دو قسمیں ہیں: سمندری، سیاہ اور رواں، جو مرہموں میں داخل ہوتا ہے، اور پہاڑی، جو تنوب اور صنوبر کے درختوں کے رس سے ہوتا ہے۔ یہ پکاتا اور گرم کرتا ہے؛ گیلا زیادہ پکاتا ہے اور خشک زیادہ خشک کرتا ہے۔ یہ سخت سوجن کو نرم کرتا، کھرنڈ دور کرتا، اور گہرے السر میں گوشت اگاتا ہے۔ {cite:canon-ibn-sina-print-v1 p.463}"
