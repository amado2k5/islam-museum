  en: "Tanin bahri"
  ur: "تنین بحری"
  es: "Tanin bahri"
  fr: "Tanin bahri"
summary:
  ar: "تنين بحري في الكتاب لا يذكر له وصف ولا طبع ولا اختيار، وإنما يرد في باب السموم، ينقل الكتاب عن جالينوس أنه يشق ويوضع على عضته فينفع، وأن حيوانا يقال له طريغلن يوضع على ضربة التنين البحري فينفع، وكل ذلك نقل منسوب إلى الكتاب لا توصية {cite:canon-ibn-sina-print-v1 p.689}"
  en: "Tanin bahri is in the book given no description, temperament or choice; it appears only under poisons, where the book reports from Galen that it is split and laid on its own bite with benefit, and that an animal called tarighlin laid on the sting of the tanin bahri benefits; all of this is a report attributed to the book, not a recommendation {cite:canon-ibn-sina-print-v1 p.689}"
  ur: "تنین بحری کتاب میں بغیر وصف، مزاج اور انتخاب کے آیا ہے؛ یہ صرف زہروں کے باب میں آتا ہے جہاں کتاب جالینوس سے نقل کرتی ہے کہ اسے چیر کر اسی کے کاٹے پر رکھا جائے تو نفع دیتا ہے، اور طریغلن نام کا ایک جانور تنین بحری کے ڈنک پر رکھا جائے تو نفع دیتا ہے؛ یہ سب کتاب سے منسوب نقل ہے، سفارش نہیں {cite:canon-ibn-sina-print-v1 p.689}۔"
  es: "En el libro no se da ninguna descripción, temperamento ni elección al tanin bahri; aparece únicamente en la sección de venenos, donde el libro informa, según Galeno, que se parte y se coloca sobre su propia picadura con beneficios, y que un animal llamado tarighlin, colocado sobre el aguijón del tanin bahri, también resulta beneficioso; todo esto es un informe atribuido al libro, no una recomendación {cite:canon-ibn-sina-print-v1 p.689}"
  fr: "Le Tanin bahri n'est décrit, ni son tempérament ni son utilisation comme remède; il n'apparaît que dans la section consacrée aux poisons, où le livre rapporte de Galien qu'il est fendu et appliqué sur sa propre morsure avec effet bénéfique, et qu'un animal appelé tarighlin, appliqué sur le dard du Tanin bahri, est également bénéfique; tout cela est un rapport attribué au livre, et non une recommandation {cite:canon-ibn-sina-print-v1 p.689}"
