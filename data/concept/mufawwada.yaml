id: concept/mufawwada
class: concept
kind: legal
label:
  ar: المُفَوَّضَة
  en: Woman married without a fixed dower (mufawwada)
  ur: مفوضہ (بغیر مہر مقرر کیے نکاح)
summary:
  ar: "المفوضة هي المرأة التي نُكحت بلا ذكر مهر أو على أن لا مهر لها، وتسمى مفوضة بكسر الواو إذا فوضت أمرها إلى الزوج أو الولي، وبفتحها إذا فوض وليها أمرها. وصح عقد النكاح بلا مهر باتفاق الفقهاء، واستدل بقوله تعالى في سورة البقرة وبأثر ابن مسعود، فلها مهر نسائها. وتنقسم التفويض إلى تفويض البضع، وهو إخلاء النكاح من المهر، ويصح عند الجمهور، وخالف المالكية والشافعية في وجه في صورة اشتراط نفي المهر. ويُعتبر في المفوضة أن تكون عاقلة بالغة رشيدة، ويفصل الفقهاء في تفويض الولي بغير إذنها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14845} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14846} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14847}"
  en: "A mufawwada is a woman married without a dower named, or on condition that she has none; the word is applied to a woman who delegates her matter to her husband or guardian, and in the passive form when her guardian delegates it for her. A marriage without a dower is valid by consensus, citing the Quranic verse on divorce before consummation and the report of Ibn Mas'ud, who ruled that she gets the dower of women like her. Delegation of the marriage itself, meaning leaving the dower out, is valid by the majority; the Malikis, and a Shafi'i view, hold the marriage void when the absence of dower is made a condition. A woman must be sane, adult and of sound judgement to delegate, and the jurists differ on a guardian who delegates her matter without her permission. This entry is partial; the sections on the dower owed by a delegated wife and the father marrying a daughter without dower continue beyond p.14852. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14845} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14846} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14847}"
  ur: "مفوضہ وہ عورت ہے جس کا نکاح بغیر مہر کے ذکر کے ہوا ہو، یا جس نے اپنا معاملہ شوہر یا ولی کے سپرد کیا ہو۔ بغیر مہر کا نکاح باتفاق صحیح ہے، اور مالکیہ اور شافعیہ کے وجہ کے مطابق مہر کی نفی کو شرط بنانے سے نکاح باطل ہو جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14845} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14846} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14847}"
