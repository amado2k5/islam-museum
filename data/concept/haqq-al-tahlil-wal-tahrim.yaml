id: concept/haqq-al-tahlil-wal-tahrim
class: concept
kind: legal
label:
  ar: "التحليل والتحريم حق لله"
  en: "Declaring lawful and unlawful belongs to God"
  ur: "حلال و حرام ٹھہرانا اللہ کا حق"
summary:
  ar: "يجمع هذا الموضع ما في المتحف عن أن الحكم بالحل والحرمة مرجعه إلى الله لا إلى أقوال الناس وأهوائهم. تنكر آيات من القرآن، منها [[passage/quran-16-116|النحل 116]]، على من يقولون بألسنتهم هذا حلال وهذا حرام، وتعد ذلك افتراء على الله {cite:tanzil-quran}. وفي حديث سلمان أن الحلال ما أحله الله في كتابه والحرام ما حرمه وما سكت عنه فهو مما عفا عنه {cite:sunan-ibn-majah 3367}. ويذكر الشاطبي في الموافقات أن تحريم الحلال وتحليل الحرام من حق الله تعالى لأنه تشريع مبتدأ {cite:muwafaqat p.445}. وتروي كتب الحديث أن النبي حرم على نفسه شيئاً فنزلت آية تسأله لم يحرم ما أحل الله له {cite:sahih-al-bukhari 5267}."
  en: "This entry gathers what the museum holds on the principle that declaring something lawful or unlawful belongs to God and not to the words or whims of people. Verses of the Qur'an, among them [[passage/quran-16-116|al-Nahl 116]], rebuke those who say with their tongues that this is lawful and that is unlawful, and count it as an invention against God {cite:tanzil-quran}. In the report of Salman, the lawful is what God made lawful in His Book, the unlawful is what He forbade in it, and what He was silent about is among what He pardoned {cite:sunan-ibn-majah 3367}. Al-Shatibi records in al-Muwafaqat that forbidding the lawful and permitting the unlawful belong to God's right, because they are a first act of legislation {cite:muwafaqat p.445}. The books of hadith report that the Prophet declared something unlawful for himself, and a verse came down asking why he forbade what God had made lawful for him {cite:sahih-al-bukhari 5267}."
  ur: "یہ اندراج اس اصول سے متعلق میوزیم کا مواد جمع کرتا ہے کہ کسی چیز کو حلال یا حرام ٹھہرانا اللہ کا حق ہے، لوگوں کی باتوں اور خواہشوں کا نہیں۔ قرآن کی آیات، جن میں [[passage/quran-16-116|النحل 116]] شامل ہے، ان لوگوں پر نکیر کرتی ہیں جو اپنی زبانوں سے کہتے ہیں کہ یہ حلال ہے اور یہ حرام، اور اسے اللہ پر افترا شمار کرتی ہیں {cite:tanzil-quran}۔ سلمان کی روایت میں ہے کہ حلال وہ ہے جسے اللہ نے اپنی کتاب میں حلال کیا اور حرام وہ ہے جسے اس نے حرام کیا، اور جس پر وہ خاموش رہا وہ معاف کردہ چیزوں میں سے ہے {cite:sunan-ibn-majah 3367}۔ شاطبی الموافقات میں لکھتے ہیں کہ حلال کو حرام اور حرام کو حلال ٹھہرانا اللہ تعالیٰ کا حق ہے، کیونکہ یہ ابتدائی تشریع ہے {cite:muwafaqat p.445}۔ کتبِ حدیث روایت کرتی ہیں کہ نبی نے ایک چیز اپنے اوپر حرام کر لی تو ایک آیت اتری جس میں پوچھا گیا کہ وہ اس چیز کو کیوں حرام کرتے ہیں جسے اللہ نے ان کے لیے حلال کیا {cite:sahih-al-bukhari 5267}۔"
