id: concept/diwan-al-insha
class: concept
kind: political
label: { ar: "ديوان الإنشاء ⁦(ديوان الرسائل)⁩", en: "Diwan al-Insha' (the chancery)", ur: "دیوان الانشاء ⁦(دیوان الرسائل، شاہی دفترِ مراسلات)⁩" }
summary:
  ar: "الديوان الذي تُنشأ عنه المكاتبات والولايات السلطانية، وكان يُعرف قديماً بديوان الرسائل؛ يعرّفه القلقشندي في مقدمة «صبح الأعشى» ويجعله «أول ديوان وضع في الإسلام» لأن النبي كان يكاتب أمراءه والملوك، ثم يؤرّخ له عند الأمويين والعباسيين والمغاربة والأندلسيين، وفي مصر في خمس حالات: من الفتح إلى الطولونيين، ثم الطولونيين والإخشيديين، ثم الفاطميين، ثم الأيوبيين، ثم الدولة التركية إلى زمانه، مع أسماء أصحابه {cite:subh-al-asha-cairo-v1 p. 89-100}."
  en: "The office from which the sultan's letters and appointments were issued, formerly called the Diwan al-Rasa'il. In the introduction to Subh al-a'sha al-Qalqashandi defines it and calls it 'the first diwan established in Islam', because the Prophet corresponded with his commanders and with kings; he traces it under the Umayyads, the Abbasids, the Maghrib and al-Andalus, and in Egypt through five phases — from the conquest to the Tulunids, the Tulunids and Ikhshidids, the Fatimids, the Ayyubids, and the Turkish (Mamluk) state of his own day — naming its heads {cite:subh-al-asha-cairo-v1 p. 89-100}."
term: { ar: "ديوان الإنشاء", en: "diwan al-insha'" }
etymology: { ar: "ديوان: قيل عربي من «دوّنته» أي أثبتّه، وقيل فارسي معرّب، وحكى الماوردي وجهين في سبب التسمية؛ والإنشاء مصدر أنشأ الشيء إذا ابتدأه {cite:subh-al-asha-cairo-v1 p. 89-90}", en: "Diwan: said to be Arabic, from dawwantuhu, 'I recorded it', or an Arabised Persian word, al-Mawardi giving two explanations of the name; insha' is the verbal noun of ansha'a, to originate {cite:subh-al-asha-cairo-v1 p. 89-90}" }
