label: { ar: "رصدا الاعتدال الخريفي عند أرخس وبطليموس", en: "The autumn equinox pair of Hipparchus and Ptolemy", ur: "ارخس اور بطلیموس کی خریفی اعتدال کی جوڑی رصد", es: "La pareja formada por Hiparco y Ptolomeo, que representa el equinoccio de otoño." }
summary:
  ar: "يعرض البتاني رصد أرخس للاعتدال الخريفي في الإسكندرية في اليوم الثالث من الأيام الخمسة الزائدة، ثم رصد بطليموس بعده بمائتين وخمس وثمانين سنة مصرية في السنة الثالثة من ملك أنطونينوس في التاسع من أتور بعد طلوع الشمس بقرابة ساعة، ويجد بين الرصدين على الحقيقة مائتين وخمساً وثمانين سنة مصرية وسبعين يوماً وربعاً وجزءاً من عشرين من يوم {cite:zij-sabi-nallino-byblion p.66}."
  en: "Al-Battani presents Hipparchus's observation of the autumn equinox at Alexandria on the third of the five added days, then Ptolemy's, two hundred and eighty-five Egyptian years later, in the third year of Antoninus, on the ninth of Athyr about an hour after sunrise, and finds between the two in truth two hundred and eighty-five Egyptian years, seventy days, a quarter day and a part of twenty of a day {cite:zij-sabi-nallino-byblion p.66}."
  ur: "البتانی ارخس کی اسکندریہ میں خریفی اعتدال کی رصد کو پانچ اضافی دنوں میں سے تیسرے دن پیش کرتے ہیں، پھر بطلیموس کی رصد کو، جو دو سو پچاسی مصری سال بعد انطونینوس کے تیسرے سال میں اتور کی نویں تاریخ کو طلوعِ آفتاب کے تقریباً ایک گھنٹے بعد ہوئی، اور دونوں کے درمیان حقیقت میں دو سو پچاسی مصری سال، ستر دن، ایک چوتھائی دن اور دن کا بیسواں حصہ پاتے ہیں {cite:zij-sabi-nallino-byblion p.66}۔"
  es: "Al-Battani presenta la observación de Hiparco sobre el equinoccio de otoño en Alejandría en el tercero de los cinco días añadidos, luego la de Ptolomeo, doscientos ochenta y cinco años egipcios después, en el tercer año de Antonino, en el noveno de Athyr, aproximadamente una hora después del amanecer, y encuentra entre ambos en verdad doscientos ochenta y cinco años egipcios, setenta días, un cuarto de día y una parte de veinte días {cite:zij-sabi-nallino-byblion p.66}."
