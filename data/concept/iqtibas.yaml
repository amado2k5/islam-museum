id: concept/iqtibas
class: concept
kind: term
label: { ar: "اقتباس", en: "Iqtibas (quoting the Qur'an or hadith in speech)", es: "Iqtibas (citando el Corán o hadiz en el discurso)", fr: "Iqtibas (citant le Coran ou le hadith dans un discours)", ur: "اقتباس ⁦(قرآن یا حدیث کو تقریر میں نقل کرنا)⁩" }
summary:
  ar: "الاقتباس في اللغة طلب القبس، وفي الاصطلاح تضمين المتكلم كلامه، شعرا كان أو نثرا، شيئا من القرآن أو الحديث على وجه لا يشعر بأنه منهما. وهو نوعان: ما لم يُنقل فيه المقتبَس عن معناه الأصلي، وما نُقل فيه عن معناه الأصلي. وجمهور الفقهاء يجيزونه في الجملة إذا كان لمقاصد شرعية تحسينا للكلام، ولا يجوز في الكلام الفاسد كلام المبتدعة وأهل المجون. واشتهر عند المالكية تحريمه في الشعر مع تشديد النكير، وأجازه بعضهم في النثر. ونقل السيوطي عن ابن حجة تقسيمه إلى مقبول ومباح ومردود. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3155} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3156} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3157}"
  en: "Iqtibas means taking a spark from a fire, and in the terminology of the rhetoricians it is weaving a piece of the Qur'an or hadith into one's own speech, in verse or prose, so that it is not presented as a quotation. It has two kinds: one where the borrowed words keep their original meaning, and one where they are turned to a new sense. Most jurists allow it in general when it serves lawful purposes and beautifies speech, but not in corrupt speech such as that of innovators or the profane. The Malikis are known for forbidding it, especially in poetry, and some allow it in prose. Al-Suyuti, citing Ibn Hijja, divides it into accepted, permitted and rejected kinds. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3155} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3156} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3157}"
  es: "Iqtibas significa tomar una chispa del fuego, y en la terminología de los retóricos consiste en incorporar un fragmento del Corán o un hadiz al propio discurso, ya sea en verso o prosa, de manera que no se presente como una cita. Existen dos tipos: uno en el que las palabras prestadas conservan su significado original, y otro en el que se les da un nuevo sentido. La mayoría de los juristas lo permiten en general cuando sirve a propósitos lícitos y embellece el discurso, pero no en discursos corruptos como el de los innovadores o los profanos. Los malikíes son conocidos por prohibirlo, especialmente en poesía, y algunos lo permiten en prosa. Al-Suyuti, citando a Ibn Hijja, lo divide en tipos aceptados, permitidos y rechazados. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3155} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3156} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3157}"
  fr: "L'iqtibas signifie « prendre une étincelle d'un feu ». Dans le jargon des rhéteurs, il s'agit d'intégrer un passage du Coran ou d'un hadith à son propre discours, en vers ou en prose, sans le présenter comme une citation. On distingue deux types d'iqtibas: l'un où les mots empruntés conservent leur sens originel, et l'autre où ils acquièrent un sens nouveau. La plupart des juristes l'autorisent généralement lorsqu'elle sert des fins licites et embellit le discours, mais pas dans les discours corrompus, tels que ceux des innovateurs ou des profanes. Les malikites sont connus pour l'interdire, notamment en poésie, tandis que certains l'autorisent en prose. Al-Suyuti, citant Ibn Hijja, la divise en trois catégories: iqtibas acceptée, licite et rejetée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3155} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3156} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3157}"
  ur: "اقتباس کا مطلب ہے آگ سے چنگاری لینا، اور فقیہ کی اصطلاح میں یہ قرآن یا حدیث کے کسی ٹکڑے کو اپنی تقریر میں، آیت یا نثر میں بُننا ہے، تاکہ اسے بطور اقتباس پیش نہ کیا جائے۔ اس کی دو قسمیں ہیں: ایک وہ جہاں مستعار الفاظ اپنے اصل معنی کو برقرار رکھتے ہیں، اور ایک وہ جہاں وہ نئے معنی کی طرف مڑ جاتے ہیں۔ اکثر فقہاء اس کی اجازت عام طور پر اس وقت دیتے ہیں جب یہ حلال مقاصد کی تکمیل کرتا ہو اور تقریر کو خوبصورت بناتا ہو، لیکن بدعنوانوں یا بدعتی تقریروں میں نہیں۔ مالکی اس کی ممانعت کے لیے مشہور ہیں، خاص طور پر شاعری میں، اور کچھ نثر میں اس کی اجازت دیتے ہیں۔ السیوطی نے ابن حجہ کا حوالہ دیتے ہوئے اسے قبول شدہ، جائز اور رد شدہ اقسام میں تقسیم کیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3155} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3156}"
