label: { ar: "اقتباس", en: "Iqtibas (quoting the Qur'an or hadith in speech)" }
summary:
  ar: "الاقتباس في اللغة طلب القبس، وفي الاصطلاح تضمين المتكلم كلامه، شعرا كان أو نثرا، شيئا من القرآن أو الحديث على وجه لا يشعر بأنه منهما. وهو نوعان: ما لم يُنقل فيه المقتبَس عن معناه الأصلي، وما نُقل فيه عن معناه الأصلي. وجمهور الفقهاء يجيزونه في الجملة إذا كان لمقاصد شرعية تحسينا للكلام، ولا يجوز في الكلام الفاسد كلام المبتدعة وأهل المجون. واشتهر عند المالكية تحريمه في الشعر مع تشديد النكير، وأجازه بعضهم في النثر. ونقل السيوطي عن ابن حجة تقسيمه إلى مقبول ومباح ومردود. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3155} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3156} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3157}"
  en: "Iqtibas means taking a spark from a fire, and in the terminology of the rhetoricians it is weaving a piece of the Qur'an or hadith into one's own speech, in verse or prose, so that it is not presented as a quotation. It has two kinds: one where the borrowed words keep their original meaning, and one where they are turned to a new sense. Most jurists allow it in general when it serves lawful purposes and beautifies speech, but not in corrupt speech such as that of innovators or the profane. The Malikis are known for forbidding it, especially in poetry, and some allow it in prose. Al-Suyuti, citing Ibn Hijja, divides it into accepted, permitted and rejected kinds. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3155} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3156} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3157}"
