id: concept/zij-sabi-flat-marble-dial-for-seasonal-hours
class: concept
kind: scientific
label: { ar: "الرخامة البسيطة لمعرفة الساعات الزمانية", en: "The flat marble dial for seasonal hours", ur: "زمانی گھنٹوں کے لیے سادہ سنگ مرمر کی رخامہ" }
summary:
  ar: "يصنع الحاسب آلة بسيطة تُعرف بها الساعات الزمانية الماضية من النهار في كل بلد، وتسمى الرخامة. تُتخذ رخامة أو صفيحة نحاس مستوية السطح، ويُعلَّم في نصف طولها نقطة يُجعل فيها مركز، وتُرسم عليها دائرة، ويُربع بخطين متقاطعين على زوايا قائمة. ثم تُعرف ظلال أول السرطان ورأس الجدي لكل ساعة، وسمتها من دائرة الأفق، وتُرسم في الرخامة بمسطرة من نقطة المركز. {cite:zij-sabi-nallino-byblion pp.206-207}"
  en: "The astronomer makes a simple instrument, called the marble, by which the seasonal hours of the day that have passed can be known in each place. A marble or a flat copper plate is taken, a centre is marked at the middle of its length, a circle is drawn, and it is quartered by two lines at right angles. The shadow of the first degree of Cancer and of Capricorn is found for each hour, with its azimuth on the horizon, and is drawn from the centre by a ruler. {cite:zij-sabi-nallino-byblion pp.206-207}"
  ur: "حاسب ایک سادہ آلہ بناتا ہے جسے رخامہ کہا جاتا ہے، جس سے ہر شہر میں دن کے گزرے ہوئے زمانی گھنٹے معلوم ہوتے ہیں۔ ایک سنگِ مرمر یا ہموار تانبے کی تختی لی جاتی ہے، اس کی لمبائی کے نصف پر مرکز نشان زد کیا جاتا ہے، ایک دائرہ کھینچا جاتا ہے، اور دو قائمہ زاویہ خطوط سے اسے چار حصوں میں بانٹا جاتا ہے۔ سرطان کے اول اور جدی کے رأس کے ہر گھنٹے کا سایہ، اس کا افقی سمت کے ساتھ، معلوم کر کے مرکز سے مسطرہ کے ذریعے کھینچا جاتا ہے۔ {cite:zij-sabi-nallino-byblion pp.206-207}"
