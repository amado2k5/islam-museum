label:
  ar: "الراتب"
  en: "Regular (ratib): the regular sunnas, the regular muezzin and the regular imam of a mosque"
  ur: "راتب"
  es: "Regular (ratib): las sunnas regulares, el muecín regular y el imán regular de una mezquita."
  fr: "Régulier (ratib): les sunnas régulières, le muezzin régulier et l'imam régulier d'une mosquée"
  tr: "Maaş"
  id: "Gaji"
summary:
  ar: "الراتب في اللغة الثابت المستقر، ولا يخرج معناه الاصطلاحي عن ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8568} ومن أبوابه السنن الرواتب التي تتبع الفرائض، واختلف الفقهاء في مقدارها، فذهب الجمهور إلى عشر ركعات، وذهب الحنفية إلى اثنتي عشرة ركعة، وأكدها عندهم ركعتا الفجر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8568} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8569} وفي المسجد يُقدَّم المؤذن الراتب والإمام الراتب على غيرهما، ولا يؤذن قبله إلا عند تخلفه مع خوف فوات الوقت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8569} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8570} ويقدَّم الإمام الراتب على غيره من الحاضرين ولو كان غيره أعلم منه، إلا أن يحضر السلطان أو نائبه أو القاضي فيقدَّمون عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8570} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8571} وكره الجمهور إعادة الجماعة في مسجد له إمام راتب إذا كان في غير ممر الناس، بينما أجازها الحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8571}"
  en: "Ratib means fixed and settled, and its technical sense keeps that meaning. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8568} Among its uses are the regular sunnas that follow the obligatory prayers; the jurists differ on their number: most say ten rak'as, and the Hanafis twelve, with the two before fajr the most emphasised for them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8568} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8569} In a mosque the regular muezzin and the regular imam come first; no one may call the adhan before the regular muezzin unless he is absent and the time is at risk. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8569} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8570} The regular imam leads over the others present even if someone else is more learned, but the ruler, his deputy or the judge takes precedence when present. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8570} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8571} Most jurists (Hanafis, Malikis, Shafi'is) dislike repeating the congregation in a mosque with a regular imam unless it is off the path of people or the imam permits it; the Hanbalis allow it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8571}"
  ur: "راتب سے مراد مقررہ اور ثابت ہے؛ اس کی اصطلاحی صورتیں سنن راتبہ، مؤذنِ راتب اور امامِ راتب ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8568} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8570}"
  es: "Ratib significa fijo y establecido, y su sentido técnico conserva ese significado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8568} Entre sus usos se encuentran las sunnas regulares que siguen a las oraciones obligatorias; los juristas difieren en su número: la mayoría dice diez rak'as, y los Hanafis doce, siendo las dos anteriores al fajr las más enfatizadas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8568} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8569} En una mezquita, el muecín regular y el imán regular tienen prioridad; nadie puede llamar al adhan antes del muecín regular a menos que esté ausente y el tiempo esté en riesgo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8569} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8570} El imán habitual dirige sobre los demás presentes, incluso si hay alguien más instruido, pero el gobernante, su adjunto o el juez tienen precedencia cuando están presentes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8570} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8571} La mayoría de los juristas (hanafíes, malikíes, shafi'ís) no aprueban repetir la congregación en una mezquita con un imán habitual a menos que esté fuera del camino de la gente o que el imán lo permita; los hanbalíes lo permiten. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8571}"
  fr: "Ratib signifie fixe et établi, et son sens technique conserve cette signification. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8568} Parmi ses usages figurent les sunnas régulières qui suivent les prières obligatoires; les juristes divergent quant à leur nombre: la plupart préconisent dix rak'as, et les hanafites douze, les deux rak'as avant la prière de l'aube (fajr) étant les plus importantes pour eux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8568} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8569} Dans une mosquée, le muezzin et l'imam habituels prêchent en premier; nul ne peut appeler à l'adhan avant le muezzin habituel, sauf en cas d'absence et si l'heure de la prière est menacée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8569} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8570} L'imam titulaire préside l'office, même si une autre personne est plus savante. Toutefois, le souverain, son adjoint ou le juge prévaut en leur présence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8570} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8571} La plupart des juristes (hanafites, malikites et chaféites) désapprouvent la répétition de la prière en congrégation dans une mosquée avec un imam titulaire, sauf si elle est pratiquée à l'écart des pratiques courantes ou si l'imam l'autorise; les hanbalites, quant à eux, l'autorisent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8571}"
  tr: "Dilde 'al-rābīrī' sabit ve kararlıdır, teknik anlamı bundan sapmaz. {alıntı:fiqh-mawsua-kuveytiyya-noor-v3 s.8568} Fıkıh-mevsua-kuveytiyya-noor-v3 s.8568} Fıscid'de müssin miktarları konusunda farklı görüşler sergiler; çoğunluğu on rekat tutar, Hanefiler on iki rekat tutar ve bunları iki recr olarak onaylardı. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.8568} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8569} Camide müezzin, ücretli müezzin ve imama diğerlerinden önce öncelik verir ve azan, zaman kaybından korktuğu için geride kaldığında verilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8569} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8570} İmam, maaşı diğerlerinden öncelikli tutar; başkası daha bilgili olsa bile, ancak sultan, yardımcısı veya yargıç orada değilse ve onlar ona üstün gelirse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8570} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8571} Çoğunluk, ücretli bir imamla camide toplanmanın halkın geçimine dışında olması durumunda tekrar edilmesini sevmezdi, oysa Hanbaliler buna izin verirdi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8571}"
  id: "Dalam bahasa, 'al-rābīrī' adalah tetap dan stabil, dan makna teknisnya tidak menyimpang dari itu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8568} Di antara bab-babnya adalah Sunnah al-rawābārīt, yang mengikuti tindakan wajib. Para ahli hukum berbeda pendapat dalam jumlahnya; mayoritas memegang sepuluh rak'ah, Hanafi memegang dua belas rak'ah, dan mengonfirmasi mereka sebagai dua rak'ah Fajr. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8568} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8569} Di masjid, muezzin mengutamakan muezzin yang digaji dan imam sebelum yang lain, dan adhan tidak diberikan kecuali ketika dia tertinggal karena takut waktu berlalu. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.8569} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8570} Imam mengutamakan gaji daripada yang hadir, meskipun ada yang lebih berpengetahuan, kecuali sultan, wakilnya, atau hakim hadir dan mereka lebih unggul darinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8570} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8571} Mayoritas tidak suka mengulangi jamaah di masjid dengan imam yang dibayar jika itu di luar jalur rakyat, sedangkan Hanbal mengizinkannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8571}"
