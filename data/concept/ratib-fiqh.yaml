label:
  ar: "الراتب"
  en: "Regular (ratib): the regular sunnas, the regular muezzin and the regular imam of a mosque"
  ur: "راتب"
summary:
  ar: "الراتب في اللغة الثابت المستقر، ولا يخرج معناه الاصطلاحي عن ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8568} ومن أبوابه السنن الرواتب التي تتبع الفرائض، واختلف الفقهاء في مقدارها، فذهب الجمهور إلى عشر ركعات، وذهب الحنفية إلى اثنتي عشرة ركعة، وأكدها عندهم ركعتا الفجر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8568} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8569} وفي المسجد يُقدَّم المؤذن الراتب والإمام الراتب على غيرهما، ولا يؤذن قبله إلا عند تخلفه مع خوف فوات الوقت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8569} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8570} ويقدَّم الإمام الراتب على غيره من الحاضرين ولو كان غيره أعلم منه، إلا أن يحضر السلطان أو نائبه أو القاضي فيقدَّمون عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8570} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8571} وكره الجمهور إعادة الجماعة في مسجد له إمام راتب إذا كان في غير ممر الناس، بينما أجازها الحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8571}"
  en: "Ratib means fixed and settled, and its technical sense keeps that meaning. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8568} Among its uses are the regular sunnas that follow the obligatory prayers; the jurists differ on their number: most say ten rak'as, and the Hanafis twelve, with the two before fajr the most emphasised for them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8568} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8569} In a mosque the regular muezzin and the regular imam come first; no one may call the adhan before the regular muezzin unless he is absent and the time is at risk. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8569} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8570} The regular imam leads over the others present even if someone else is more learned, but the ruler, his deputy or the judge takes precedence when present. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8570} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8571} Most jurists (Hanafis, Malikis, Shafi'is) dislike repeating the congregation in a mosque with a regular imam unless it is off the path of people or the imam permits it; the Hanbalis allow it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8571}"
  ur: "راتب سے مراد مقررہ اور ثابت ہے؛ اس کی اصطلاحی صورتیں سنن راتبہ، مؤذنِ راتب اور امامِ راتب ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8568} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8570}"
