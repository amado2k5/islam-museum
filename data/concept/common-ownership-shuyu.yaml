id: concept/common-ownership-shuyu
class: concept
kind: legal
label:
  ar: "الشُّيُوع"
  en: "Shuyu' (undivided common ownership: sale, division, zakat, pledge, gift, lease and endowment of a shared thing)"
summary:
  ar: "الشيوع ثبوت الحق في الشيء الواحد لشخصين فأكثر دون تمييز الحصص، ويعبر عنه الفقهاء بالشركة. ويجوز بيع المشاع وقسمته بطلب الشركاء، وتجب الزكاة على الشركاء كرجل واحد عند الجمهور، ويصح رهنه وهبته ووقفه عند الجمهور، ويختلفون في رهنه ووقفه إذا كان مما يقبل القسمة، وفي إجارته لغير الشريك، والشفعة ثابتة للشريك فيه بعد البيع عند الاتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10261} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10262} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10263} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10264}"
  en: "Shuyu' is the right of two or more persons in one thing without a division of shares; the jurists call it partnership. An undivided share may be sold, and the judge must divide the common property at the request of the partners, unless the division would destroy its purpose. The partners pay zakat on a common property as one owner, according to the majority. The majority allow its pledge, gift and endowment, and the jurists differ on pledging and endowing what can be divided and on leasing it to a stranger; the partner has the right of pre-emption after a sale, by consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10261} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10262} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10263} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10264}"
