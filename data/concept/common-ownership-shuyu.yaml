id: concept/common-ownership-shuyu
class: concept
kind: legal
label:
  ar: "الشُّيُوع"
  en: "Shuyu' (undivided common ownership: sale, division, zakat, pledge, gift, lease and endowment of a shared thing)"
  es: "Shuyu' (propiedad común indivisa: venta, división, zakat, prenda, donación, arrendamiento y dotación de una cosa compartida)"
  fr: "Shuyu' (propriété commune indivise: vente, division, zakat, nantissement, don, location et dotation d'une chose partagée)"
  ur: "شیو' ⁦(غیر منقسم مشترکہ ملکیت: فروخت، تقسیم، زکوٰۃ، عہد، تحفہ، اجارہ اور مشترکہ چیز کا وقف)⁩"
summary:
  ar: "الشيوع ثبوت الحق في الشيء الواحد لشخصين فأكثر دون تمييز الحصص، ويعبر عنه الفقهاء بالشركة. ويجوز بيع المشاع وقسمته بطلب الشركاء، وتجب الزكاة على الشركاء كرجل واحد عند الجمهور، ويصح رهنه وهبته ووقفه عند الجمهور، ويختلفون في رهنه ووقفه إذا كان مما يقبل القسمة، وفي إجارته لغير الشريك، والشفعة ثابتة للشريك فيه بعد البيع عند الاتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10261} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10262} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10263} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10264}"
  en: "Shuyu' is the right of two or more persons in one thing without a division of shares; the jurists call it partnership. An undivided share may be sold, and the judge must divide the common property at the request of the partners, unless the division would destroy its purpose. The partners pay zakat on a common property as one owner, according to the majority. The majority allow its pledge, gift and endowment, and the jurists differ on pledging and endowing what can be divided and on leasing it to a stranger; the partner has the right of pre-emption after a sale, by consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10261} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10262} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10263} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10264}"
  es: "Shuyu' es el derecho de dos o más personas sobre una cosa sin división de partes; los juristas lo denominan sociedad. Una parte indivisa puede venderse, y el juez debe dividir la propiedad común a petición de los socios, a menos que la división destruya su propósito. Según la mayoría, los socios pagan el zakat sobre la propiedad común como un solo propietario. La mayoría permite su prenda, donación y dotación, y los juristas difieren en cuanto a la prenda y dotación de bienes divisibles y su arrendamiento a un tercero; el socio tiene derecho de preferencia tras la venta, por consenso. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10261} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10262} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10263} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10264}"
  fr: "Le shuyu' désigne le droit de deux personnes ou plus sur un bien indivis sans partage; les juristes le qualifient de société en nom collectif. Une part indivise peut être vendue, et le juge doit procéder au partage du bien commun à la demande des associés, sauf si ce partage en compromet l'objet. Les associés s'acquittent de la zakat sur le bien commun comme un seul propriétaire, selon l'avis majoritaire. La majorité autorise le nantissement, la donation et le legs du bien, mais les juristes divergent quant au nantissement et au legs des biens indivisibles, ainsi que quant à leur location à un tiers. L'associé dispose d'un droit de préemption après une vente, par consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10261} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10262} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10263} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10264}"
  ur: "حصص کی تقسیم کے بغیر ایک چیز میں دو یا دو سے زیادہ افراد کا حق ہے۔ فقہاء اسے شراکت کہتے ہیں۔ ایک غیر منقسم حصہ فروخت کیا جا سکتا ہے، اور جج کو شراکت داروں کی درخواست پر مشترکہ جائیداد کو تقسیم کرنا چاہیے، جب تک کہ تقسیم اس کے مقصد کو تباہ نہ کر دے۔ شراکت دار اکثریت کے مطابق ایک مشترکہ جائیداد پر ایک مالک کی حیثیت سے زکوٰۃ ادا کرتے ہیں۔ جمہور اس کے گروی، تحفہ اور وقف کی اجازت دیتے ہیں، اور فقہاء کا گروی رکھنے اور اس کو وقف کرنے اور اجنبی کو کرایہ پر دینے میں اختلاف ہے۔ پارٹنر کو اتفاق رائے سے، فروخت کے بعد پری ایمپشن کا حق حاصل ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10261} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10262} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10263} صفحہ 10264}"
