label:
  ar: الإقطاع
  en: Iqta' (land grant)
summary:
  ar: "الإقطاع عند البلاذري قطع الملوك والخلفاء الأراضي لمن استحقها أو استقطعها؛ ومن قيوده عنده أن الاستقطاع لا يلزم الإجابة: استقطع أبيض بن حمال النبي الملاحة التي بمأرب فقيل له إنها كالماء العِدّ الجاري فأبى أن يقطمه إياها، بينما أقطع علقمة بن وائل الحضرمي أرضاً بحضرموت كما روي عن أبيه؛ وأوسع من ذلك إقطاعاته في خيبر فقد أقطع الزبير أرضاً فيها نخل وشجر — ومن إقطاعات عمر بن عبد العزيز إقراره الورثة في أرض أُطعمها النبي بعد إحصائهم — فالإقطاع يدور بين التخصيص بالمرافق العامة التي لا تُقطع وبين العطاء الملكي للأرض الموات والمستصلحة."
  en: "Iqta' in al-Baladhuri is the ruler's grant of lands to those deserving or requesting them; its limits in his reports include that a request need not be granted: Abyad ibn Hammal asked the Prophet for the salt flat at Ma'rib and, being told it was like freely flowing water ('id water), he refused to allot it to him, whereas Alqama ibn Wa'il al-Hadrami — as reported from his father — was granted land in Hadramawt; broader still were the Prophet's Khaybar grants, as he allotted al-Zubayr land with palms and trees, and among Umar ibn Abd al-Aziz's arrangements his confirming the heirs in land the Prophet had provisioned after they were registered — so the iqta' runs between designation of public amenities that cannot be granted and the sovereign gift of dead or reclaimed land."
