id: concept/iqta
class: concept
kind: legal
label:
  ar: الإقطاع
  en: Iqta' (land grant)
  es: "Iqta' (concesión de tierras)"
  fr: "Iqta' (concession de terres)"
  ur: "اقتا ⁦(زمین کی امداد)⁩"
  tr: "Feodalizm"
  id: "Feodalisme"
summary:
  ar: "الإقطاع عند البلاذري قطع الملوك والخلفاء الأراضي لمن استحقها أو استقطعها؛ ومن قيوده عنده أن الاستقطاع لا يلزم الإجابة: استقطع أبيض بن حمال النبي الملاحة التي بمأرب فقيل له إنها كالماء العِدّ الجاري فأبى أن يقطمه إياها، بينما أقطع علقمة بن وائل الحضرمي أرضاً بحضرموت كما روي عن أبيه؛ وأوسع من ذلك إقطاعاته في خيبر فقد أقطع الزبير أرضاً فيها نخل وشجر — ومن إقطاعات عمر بن عبد العزيز إقراره الورثة في أرض أُطعمها النبي بعد إحصائهم — فالإقطاع يدور بين التخصيص بالمرافق العامة التي لا تُقطع وبين العطاء الملكي للأرض الموات والمستصلحة. يرى المؤلف أن إقطاع الأرض والمعدن لأجل الإحياء أداة لتوزيع الموارد على من يحسن استغلالها، ويجيزه أبو يوسف لأن الأرض إذا تركت بلا عمارة تعطل نفعها، ولا يجوز الإقطاع بما يتجاوز قدرة المُقطَع، وتسترد الأرض إذا عُطّلت ثلاث سنين."
  en: "Iqta' in al-Baladhuri is the ruler's grant of lands to those deserving or requesting them; its limits in his reports include that a request need not be granted: Abyad ibn Hammal asked the Prophet for the salt flat at Ma'rib and, being told it was like freely flowing water ('id water), he refused to allot it to him, whereas Alqama ibn Wa'il al-Hadrami — as reported from his father — was granted land in Hadramawt; broader still were the Prophet's Khaybar grants, as he allotted al-Zubayr land with palms and trees, and among Umar ibn Abd al-Aziz's arrangements his confirming the heirs in land the Prophet had provisioned after they were registered — so the iqta' runs between designation of public amenities that cannot be granted and the sovereign gift of dead or reclaimed land."
  es: "En al-Baladhuri, el iqta' es la concesión de tierras por parte del gobernante a quienes las merecen o las solicitan; sus límites, según sus relatos, incluyen que no es necesario conceder una solicitud: Abyad ibn Hammal pidió al Profeta la salina de Ma'rib y, al serle dicho que era como agua que fluye libremente ('id water), se negó a asignársela, mientras que a Alqama ibn Wa'il al-Hadrami —según relata su padre— se le concedió tierra en Hadramawt; aún más amplias fueron las concesiones del Profeta en Khaybar, ya que asignó a al-Zubayr tierra con palmeras y árboles, y entre los arreglos de Umar ibn Abd al-Aziz se encuentra la confirmación de los herederos en la tierra que el Profeta había provisto después de que fueran registrados; por lo tanto, el iqta' se sitúa entre la designación de servicios públicos que no pueden concederse y el don soberano de tierras muertas o recuperadas."
  fr: "L'iqta', selon al-Baladhuri, désigne l'octroi de terres par le souverain à ceux qui le méritent ou en font la demande. Ses limites, telles qu'elles ressortent des hadiths, incluent le fait qu'une demande n'est pas nécessairement acceptée: Abyad ibn Hammal demanda au Prophète la saline de Ma'rib et, s'étant entendu dire qu'elle était comparable à une source d'eau vive (« id water »), il refusa de la lui attribuer. En revanche, Alqama ibn Wa'il al-Hadrami – comme le rapporte son père – reçut des terres dans le Hadramaout. Les donations du Prophète à Khaybar furent encore plus vastes, puisqu'il attribua à al-Zubayr des terres plantées de palmiers et d'arbres. Parmi les dispositions prises par Umar ibn Abd al-Aziz, on peut citer la confirmation des héritiers des terres que le Prophète avait attribuées après leur enregistrement. Ainsi, l'iqta' s'étend de la désignation de biens publics non octroyables au don souverain de terres abandonnées ou gagnées sur la mer."
  ur: "البلادوری میں اقطاء حاکم کی طرف سے مستحق یا درخواست کرنے والوں کو زمینیں دینا ہے۔ اس کی روایتوں میں اس کی حدود میں یہ شامل ہے کہ درخواست کی منظوری کی ضرورت نہیں ہے: عبیاد بن حمال نے رسول اللہ سے معارب میں نمک کے فلیٹ کے لیے کہا اور جب یہ بتایا گیا کہ یہ آزادانہ بہنے والے پانی کی طرح ہے، تو آپ نے اسے دینے سے انکار کر دیا، جب کہ علقمہ بن وائل الحدرمی کو - جیسا کہ ان کے والد سے روایت ہے، کو حدرہ میں زمین دی گئی تھی۔ رسول اللہ کی خیبر کی گرانٹ اب بھی وسیع تھی، جیسا کہ آپ نے الزبیر کو کھجوروں اور درختوں کے ساتھ زمین الاٹ کی تھی، اور عمر بن عبدالعزیز کے انتظامات میں سے ان کے وارثوں کی تصدیق کے لیے جو زمین نبی نے رجسٹرڈ ہونے کے بعد فراہم کی تھی، اس لیے اقطاء ان عوامی سہولیات کے تعین کے درمیان چلتی ہے جن کو دوبارہ عطا نہیں کیا جا سکتا اور نہ ہی مردہ کو دوبارہ تحفہ دیا جا سکتا ہے۔"
  tr: "al-Baladhuri'ye göre, feodal toprak, krallar ve halifeler tarafından hak edenlere veya alanlara tahsis edilen topraktır; kısıtlamalarından biri de kesmenin cevap gerektirmemesidir: Abyad ibn Hamal al-Nabi, Marib'deki molayı aldı ve akan su gibi olduğu söylendi, ancak onu kesmeyi reddetti. Bu arada, Alqama ibn Wa'il al-Hadrami al-Hadhrami al-Hadhrami, babasının anlattığı gibi; ve daha da geniş olan Heybar'daki toprakları, el-Zubeyr al-Zubeyr al-Zubeyr al-Zubayr al-Bayr'in palmiye ve palmiye ağaçlarıyla arazi tahsis etmesi — Ömer bin Abd al-Aziz'in toprakları saydıktan sonra Peygamber tarafından beslenen toprakları kabul etmesi de vardı — feodal mülk, kesilmeyen kamu hizmetlerinin tahsis edilmesi ile ölülerin ve geri kazanılmış toprakların kraliyet tahsisiyle arasında dönüyordu. Yazar, canlandırma amacıyla arazi ve mineral mülklerinin kaynakları iyi kullanabilenler arasında dağıtmak için araçlar olduğuna inanır. Abu Yusuf buna izin verir çünkü arazi geliştirilmezse faydası etkisiz hale gelir ve arsanın kapasitesinin ötesinde araziye izin verilmez. Arazi üç yıl boyunca boşta kalmışsa geri kazanılır."
  id: "Menurut al-Baladhuri, feodalisme adalah tanah yang diberikan oleh raja dan khalifah kepada mereka yang layak atau mengambilnya; di antara pembatasan yang ia miliki adalah bahwa menahan tanah tidak memerlukan jawaban: Abyad ibn Hamal al-Nabi mengambil mullaha di Marib dan diberitahu bahwa tanah itu seperti air yang mengalir, tetapi ia menolak memotongnya. Sementara itu, Alqama ibn Wa'il al-Hadrami al-Hadrami al-Hadhrami seperti yang diceritakan oleh ayahnya; dan yang lebih luas lagi adalah wilayah feodalisnya di Khaybar, karena al-Zubayr al-Zubayr al-Zubayr al-Bayr membagikan tanah dengan pohon palem dan pohon palem — di antara tanah feodal Umar ibn Abd al-Aziz adalah pengakuannya atas tanah yang diberi makan oleh Nabi setelah menghitungnya — wilayah feodalisme berpusat pada pembagian fasilitas publik yang tidak terputus dan pemberian tanah yang telah mati dan yang direklamasi. Penulis percaya bahwa lahan dan perkebunan mineral untuk tujuan revitalisasi adalah alat untuk mendistribusikan sumber daya kepada mereka yang dapat menggunakannya dengan baik. Abu Yusuf mengizinkan hal ini karena jika lahan dibiarkan tidak dikembangkan, kegunaannya menjadi tidak efektif, dan tidak diperbolehkan tanah di luar kapasitas lahan tersebut. Tanah dipulihkan jika lahan tersebut telah diam selama tiga tahun."
