label:
  ar: "التراب والصلصال"
  en: "Dust and clay"
  ur: "مٹی اور گارا"
  es: "Polvo y arcilla"
  fr: "Poussière et argile"
summary:
  ar: "خلق الله الإنسان من تراب ثم من نطفة ثم سواك رجلاً، وخلق الإنس من صلصال من حمإ مسنون وخلق الجأن من مارج من نار، وقال الملائكة أخلقتني من نار وخلقته من طين."
  en: "God created man from dust, then from a drop, then fashioned him a man; the human from dried clay of dark mud and the jinn from smokeless flame — 'You made me of fire and made him of clay.'"
  ur: "اللہ نے انسان کو مٹی سے پھر ایک قطرے سے پیدا کیا پھر اسے مرد بنایا؛ انسان کو باسے گارے کی خشک مٹی سے اور جن کو آگ کے شعلے سے — 'تو نے مجھے آگ سے اور اسے مٹی سے بنایا۔'"
  es: "Dios creó al hombre del polvo, luego de una gota, y después lo formó como tal; al humano de arcilla seca de lodo oscuro y al genio de llama sin humo: «Me hiciste de fuego y a él de barro»."
  fr: "Dieu créa l'homme à partir de poussière, puis d'une goutte, puis lui donna la forme d'un homme; l'homme à partir d'argile séchée et de boue sombre, et le djinn à partir d'une flamme sans fumée — « Tu m'as fait de feu et tu l'as fait d'argile. »"
