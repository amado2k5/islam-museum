summary:
  ar: "خلق الله الإنسان من تراب ثم من نطفة ثم سواك رجلاً، وخلق الإنس من صلصال من حمإ مسنون وخلق الجأن من مارج من نار، وقال الملائكة أخلقتني من نار وخلقته من طين."
  en: "God created man from dust, then from a drop, then fashioned him a man; the human from dried clay of dark mud and the jinn from smokeless flame — 'You made me of fire and made him of clay.'"
  ur: "اللہ نے انسان کو مٹی سے پھر ایک قطرے سے پیدا کیا پھر اسے مرد بنایا؛ انسان کو باسے گارے کی خشک مٹی سے اور جن کو آگ کے شعلے سے — 'تو نے مجھے آگ سے اور اسے مٹی سے بنایا۔'"
