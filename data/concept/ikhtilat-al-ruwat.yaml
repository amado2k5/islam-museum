id: concept/ikhtilat-al-ruwat
class: concept
kind: term
label:
  ar: "اختلاط الرواة (من خلط من الثقات)"
  en: "Narrators' confusion (ikhtilat): trustworthy men who became confused"
summary:
  ar: "النوع الثاني والستون من علوم الحديث عند ابن الصلاح والنووي: معرفة من خلط من الثقات، أي من ساء حفظه أو اضطرب في آخر عمره لخرف أو عمى أو تلف كتب. والحكم فيه أن يُقبل ما رُوي عنهم قبل الاختلاط ولا يُقبل ما بعده أو ما شُكّ فيه، ويُعرف ذلك بتمييز الرواة عنهم: من سمع قديماً ومن سمع حديثاً. ومن أمثلته عطاء بن السائب وأبو إسحاق السبيعي وسعيد الجريري وابن أبي عروبة والمسعودي وعبد الرزاق وعارم وأبو بكر القطيعي، مع خلاف في بعضهم. وأفرده بالتأليف الحازمي ثم العلائي ثم سبط ابن العجمي {cite:tadrib-rawi-awwama-v5 p. 553-579}."
  en: "Type sixty-two of the hadith sciences in Ibn al-Salah and al-Nawawi: knowing which trustworthy narrators became confused — whose memory failed or wavered late in life through senility, blindness or the loss of their books. The rule is that what was narrated from them before the confusion is accepted, and what came after it, or cannot be dated, is not; this is settled by sorting their students into early and late hearers. Examples include Ata ibn al-Sa'ib, Abu Ishaq al-Sabi'i, Sa'id al-Jurayri, Ibn Abi Aruba, al-Mas'udi, Abd al-Razzaq, Arim and Abu Bakr al-Qati'i, some of them disputed. Al-Hazimi, then al-Ala'i, then Sibt Ibn al-Ajami wrote works devoted to it."
