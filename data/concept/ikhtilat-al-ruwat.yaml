id: concept/ikhtilat-al-ruwat
class: concept
kind: term
label:
  ar: "اختلاط الرواة ⁦(من خلط من الثقات)⁩"
  en: "Narrators' confusion (ikhtilat): trustworthy men who became confused"
  es: "Confusión de los narradores (ikhtilat): hombres dignos de confianza que se confundieron"
  fr: "Confusion des narrateurs (ikhtilat): des hommes dignes de confiance qui se sont retrouvés dans la confusion"
  ur: "راویوں کی الجھن ⁦(اختلات)⁩: ثقہ آدمی جو الجھن میں پڑ گئے۔"
  tr: "Anlatıcıların karıştırılması (güvenilir kişilerden oluşan bir karışımdan)"
  id: "Perpaduan narator (dari campuran orang-orang terpercaya)"
summary:
  ar: "النوع الثاني والستون من علوم الحديث عند ابن الصلاح والنووي: معرفة من خلط من الثقات، أي من ساء حفظه أو اضطرب في آخر عمره لخرف أو عمى أو تلف كتب. والحكم فيه أن يُقبل ما رُوي عنهم قبل الاختلاط ولا يُقبل ما بعده أو ما شُكّ فيه، ويُعرف ذلك بتمييز الرواة عنهم: من سمع قديماً ومن سمع حديثاً. ومن أمثلته عطاء بن السائب وأبو إسحاق السبيعي وسعيد الجريري وابن أبي عروبة والمسعودي وعبد الرزاق وعارم وأبو بكر القطيعي، مع خلاف في بعضهم. وأفرده بالتأليف الحازمي ثم العلائي ثم سبط ابن العجمي {cite:tadrib-rawi-awwama-v5 p. 553-579}."
  en: "Type sixty-two of the hadith sciences in Ibn al-Salah and al-Nawawi: knowing which trustworthy narrators became confused — whose memory failed or wavered late in life through senility, blindness or the loss of their books. The rule is that what was narrated from them before the confusion is accepted, and what came after it, or cannot be dated, is not; this is settled by sorting their students into early and late hearers. Examples include Ata ibn al-Sa'ib, Abu Ishaq al-Sabi'i, Sa'id al-Jurayri, Ibn Abi Aruba, al-Mas'udi, Abd al-Razzaq, Arim and Abu Bakr al-Qati'i, some of them disputed. Al-Hazimi, then al-Ala'i, then Sibt Ibn al-Ajami wrote works devoted to it."
  es: "Tipo sesenta y dos de las ciencias del hadiz en Ibn al-Salah y al-Nawawi: saber qué narradores fidedignos se confundieron —cuya memoria falló o vaciló en la vejez debido a la senilidad, la ceguera o la pérdida de sus libros—. La regla es que lo que se narró de ellos antes de la confusión se acepta, y lo que vino después, o no se puede fechar, no se acepta; esto se resuelve clasificando a sus discípulos en oyentes tempranos y tardíos. Ejemplos incluyen a Ata ibn al-Sa'ib, Abu Ishaq al-Sabi'i, Sa'id al-Jurayri, Ibn Abi Aruba, al-Mas'udi, Abd al-Razzaq, Arim y Abu Bakr al-Qati'i, algunos de ellos disputados. Al-Hazimi, luego al-Ala'i y después Sibt Ibn al-Ajami escribieron obras dedicadas a ello."
  fr: "Le soixante-deuxième type des sciences du hadith chez Ibn al-Salah et al-Nawawi consiste à identifier les rapporteurs dignes de confiance dont la mémoire a fléchi ou défailli en fin de vie, en raison de la sénilité, de la cécité ou de la perte de leurs livres. La règle veut que l'on accepte ce qui a été rapporté d'eux avant cet épisode de confusion, et que ce qui est postérieur ou indatable ne le soit pas. Cette distinction est établie en classant leurs élèves en deux groupes: ceux qui ont reçu la transmission du hadith tôt et ceux qui l'ont reçue plus tard. Parmi les exemples, on peut citer Ata ibn al-Sa'ib, Abu Ishaq al-Sabi'i, Sa'id al-Jurayri, Ibn Abi Aruba, al-Mas'udi, Abd al-Razzaq, Arim et Abu Bakr al-Qati'i, dont certains ont fait l'objet de controverses. Al-Hazimi, puis al-Ala'i, et enfin Sibt Ibn al-Ajami ont consacré des ouvrages à ce sujet."
  ur: "ابن الصلاح اور النووی میں حدیث کے علوم میں سے باسٹھ ٹائپ کریں: یہ جانتے ہوئے کہ کون سے ثقہ راوی الجھن کا شکار ہو گئے ہیں - جن کی یادداشت کمزور ہو گئی یا عمر کے آخر میں بڑھاپے، نابینا پن یا ان کی کتابوں کے ضائع ہو جانے کی وجہ سے متزلزل ہو گئی۔ قاعدہ یہ ہے کہ جو کچھ ان سے روایت کیا گیا تھا اس کے قبول ہونے سے پہلے، اور جو اس کے بعد آیا، یا تاریخ نہیں ہو سکتی، وہ نہیں ہے۔ یہ ان کے طلباء کو ابتدائی اور دیر سے سننے والوں میں چھانٹ کر طے کیا جاتا ہے۔ مثالوں میں عطاء بن السائب، ابو اسحاق السبیعی، سعید الجریری، ابن ابی عروبہ، المسعودی، عبد الرزاق، ارم اور ابوبکر القطی شامل ہیں، جن میں سے بعض نے اختلاف کیا۔ الہیثمی، پھر العلائی، پھر سبط ابن العجمی نے اس کے لیے وقف شدہ تصانیف لکھیں۔"
  tr: "İbn al-Salah ve al-Nawawi'ye göre altmış ikinci tür hadis bilimleri: Güvenilir veya kafası karışık olanları tanımak, yani hafızası zayıf olanlar veya demans, körlük ya da kitap kaybı nedeniyle hafızası bozulanlar. Hüküm, karışmadan önce onlardan rivayet edilenlerin kabul edildiği, sonrasında gelenin ya da şüpheli olanların kabul edildiği yönündedir. Bu, rivayetçileri onlardan ayırarak bilinir: uzun zaman önce duyanlar ve hadları duyanlar ith. Örnekler arasında Ata ibn al-Sa'ib, Abu Ishaq al-Subai'i, Sa'id al-Jariri, Ibn Ebi 'Araba, al-Ma'sudi, Abd al-Razzaq, 'Arim ve Ebu Bekir al-Qutai'i bulunur; bazı anlaşmazlıklar vardır. Yazılı olarak bunu özellikle belirtmiştir: el-Hazmi, sonra el-'Ala'i, ardından İbn el-Ecmi'nin torunu {alıntı:] Tadrib-Rawi-Awwama-v5 s. 553-579}."
  id: "Jenis ilmu hadis ke-enam puluh dua menurut Ibn al-Salah dan al-Nawawi: Mengenal mereka yang dapat dipercaya atau bingung, yaitu mereka yang ingatannya buruk atau yang ingatannya terganggu di kemudian hari karena demensia, kebutaan, atau kehilangan buku. Aturannya adalah apa yang diceritakan dari mereka sebelum pencampuran diterima, dan apa yang terjadi setelahnya atau yang diragukan diterima. Hal ini diketahui dengan membedakan para narator dari mereka: mereka yang mendengar lama dan mereka yang mendengar hadits. Contohnya termasuk Ata ibn al-Sa'ib, Abu Ishaq al-Subai'i, Sa'id al-Jariri, Ibn Abi 'Araba, al-Ma'sudi, Abd al-Razzaq, 'Arim, dan Abu Bakr al-Qutai'i, dengan beberapa perbedaan pendapat. Ia menyorotinya secara tertulis: al-Hazmi, lalu al-'Ala'i, lalu cucu Ibn al-Ajmi {cite::Tadrib-Rawi-awwama-V5 hlm. 553-579}."
