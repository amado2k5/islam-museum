id: concept/ilaj-awram-al-ras-wa-sut-al-mizaj
class: concept
kind: scientific
label:
  ar: "علاج أورام الرأس وسوء المزاج"
  en: "The treatment of swellings of the head and of ill-temperament"
  ur: "سر کے ورموں اور سوءِ مزاج کا علاج"
  es: "El tratamiento de las hinchazones de la cabeza y del mal humor."
  fr: "Le traitement des gonflements de la tête et des sautes d'humeur"
  tr: "Baş Tümörleri ve Kötü Ruh Hali Tedavisi"
  id: "Pengobatan Tumor Kepala dan Suasana Hati yang Buruk"
summary:
  ar: "يذكر ابن سينا مبادئ معالجة الأورام الحارة والباردة في الرأس، وسوء المزاج الحار والبارد والاحتراقي والمركب، وما يتضرر به أصحاب العلة المادية، وتغذية أصحاب أمراض الرأس {cite:canon-ibn-sina-print-v2 pp.38-44}"
  en: "Ibn Sina gives the principles of treating hot and cold swellings of the head, and hot, cold, burnt and compound ill-temperament, what the sufferers of a material complaint are harmed by, and the feeding of those with diseases of the head {cite:canon-ibn-sina-print-v2 pp.38-44}"
  ur: "ابن سینا سر کے گرم اور ٹھنڈے ورموں کے علاج کے اصول، گرم، ٹھنڈے، جھلسے ہوئے اور مرکب سوءِ مزاج کا علاج، مادی علت والے جس چیز سے نقصان اٹھاتے ہیں، اور سر کی بیماریوں والوں کی غذا بتاتا ہے {cite:canon-ibn-sina-print-v2 pp.38-44}۔"
  es: "Ibn Sina expone los principios para tratar las hinchazones de la cabeza causadas por calor y frío, así como el mal genio por calor, frío, quemaduras y compuestos, lo que perjudica a quienes padecen una dolencia material y la alimentación de quienes sufren enfermedades de la cabeza {cite:canon-ibn-sina-print-v2 pp.38-44}"
  fr: "Ibn Sina expose les principes du traitement des gonflements chauds et froids de la tête, ainsi que des mauvais tempéraments chauds, froids, brûlés et composés, ce qui nuit aux personnes souffrant d'une affection matérielle, et l'alimentation de celles atteintes de maladies de la tête {cite:canon-ibn-sina-print-v2 pp.38-44}"
  tr: "İbn Sina, baştaki sıcak ve soğuk tümörlerin tedavi prensiplerinden, sıcak ve soğuk mizaçtan, yanma ve bileşik ruh hallerinden, fiziksel rahatsızlığa sahip olanlara neyin zarar verdiğinden ve baş hastalığı olanların beslenmesinden bahseder {atıf:kanon-ibn-sina-print-v2 s.38-44}"
  id: "Ibn Sina menyebutkan prinsip pengobatan tumor panas dan dingin di kepala, temperamen panas dan dingin, pembakaran dan suasana hati majemuk, apa yang merugikan mereka yang memiliki penyakit fisik, serta nutrisi bagi mereka yang memiliki penyakit kepala {cite:canon-ibn-sina-print-v2 hlm.38-44}"
