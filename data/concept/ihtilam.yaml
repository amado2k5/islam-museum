summary:
  ar: 'الاحتلام إنزال المني في النوم، ويكون من الرجل والمرأة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1745} وقد اختلف الفقهاء في تحققه من المرأة: فالحنابلة والحنفية في ظاهر الرواية والشافعية في الثيب يرون تحققه بوصول المني إلى ظاهر الفرج، والمالكية بخروجه خارج الفرج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1745} وإذا وجد الرجل بللاً ولم يتذكر احتلاماً وجب عليه الغسل عند الجمهور، واختلف الفقهاء فيما إذا شك في البلل بين المني والمذي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1746} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1747} ولا أثر للاحتلام في الصوم باتفاق، وهو يحصل به البلوغ باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1747} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1748}'
  en: 'Ihtilam is emission of semen during sleep; it happens to both men and women. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1745} On how it is realised in a woman, the jurists differ: the Hanbalis, the Hanafis in the apparent report, and the Shafi''is for a married woman hold that it occurs when the fluid reaches the outer part of the private parts; the Malikis hold that it occurs when it leaves the passage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1745} A man who finds wetness without remembering a dream must perform ghusl by the majority; where he doubts between semen and madhy the views differ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1746} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1747} Ihtilam does not affect fasting, and by agreement it marks puberty. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1747} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1748}'
  ur: احتلام نیند میں منی خارج ہونے کو کہتے ہیں، جو مرد و عورت دونوں کو ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1745} اس سے بلوغ بالاتفاق حاصل ہوتا ہے، اور روزے پر اس کا کوئی اثر نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1747} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1748}
  es: "Ihtilam es la emisión de semen durante el sueño; sucede tanto en hombres como en mujeres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1745} En cuanto a cómo se realiza en una mujer, los juristas difieren: los Hanbalis, los Hanafis en el informe aparente, y los Shafi'is para una mujer casada sostienen que ocurre cuando el fluido llega a la parte externa de los órganos genitales; los Malikis sostienen que ocurre cuando sale del conducto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1745} Un hombre que encuentra humedad sin recordar un sueño debe realizar ghusl por mayoría; cuando duda entre semen y madhy, las opiniones difieren. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1746} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1747} El ihtilam no afecta el ayuno y, por acuerdo, marca la pubertad. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1747} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1748}"
  fr: "L'ihtilam est l'émission de sperme pendant le sommeil; elle survient aussi bien chez l'homme que chez la femme. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1745} Chez la femme, les juristes divergent quant à la manière dont elle se manifeste: les Hanbalites, les Hanafites (selon le récit apparent) et les Shafi'ites (pour une femme mariée) considèrent qu'elle se produit lorsque le liquide atteint la partie externe des parties génitales; les Malikites, quant à eux, estiment qu'elle se produit lorsqu'il sort du vagin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1745} Un homme qui constate une éjaculation sans se souvenir d'un rêve doit accomplir le ghusl (ablution majeure) selon la majorité des avis; en cas de doute entre sperme et madhy (éjaculation nocturne), les avis divergent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1746} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1747} Ihtilam n'affecte pas le jeûne et, par accord, il marque la puberté. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1747} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1748}"
  tr: "Gece emisyonu, uyku sırasında meni boşalmasıdır ve erkekler ile kadınlar arasında da gerçekleşebilir. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.1745} Hukukçular, bir kadından geçerliliği konusunda farklı görüşlerde bulunmuşlardır: Hanbali ve Hanafi ise, bakire meninin durumunda Şafi'ler ise spermin özel bölgelerin dış kısmına ulaştığında doğrulandığını düşünürken, Malikiler ise spermin özel bölgelerin dışında olduğunu düşünür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1745} Bir adam ıslak bulur ve gece salınımını hatırlamazsa, çoğunluğa göre ghusl yapmak zorundadır. Hukukçular, meni ile pre-salım arasında ıslaklık konusunda şüphe olup olmadığı konusunda farklı görüşlere sahiptir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1746} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1747} Oruç sırasında gece salınımının tesadüfi bir etkisi yoktur ve ergenliğe anlaşma yoluyla yol açar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1747} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1748}"
  id: "Emisi nokturnal adalah ejakulasi sperma saat tidur, dan dapat terjadi antara pria dan wanita. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1745} Para ahli hukum berbeda pendapat mengenai keabsahannya dari seorang wanita: Hanbal dan Hanafi menurut narasi yang tampak, dan Shafi'i dalam kasus sperma perawan, menganggapnya dikonfirmasi ketika sperma mencapai bagian luar bagian pribadi, sementara Malikis menganggapnya di luar bagian pribadi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1745} Jika seorang pria menemukan air basah dan tidak ingat emisi malam, ia harus melakukan ghusl menurut mayoritas. Para ahli hukum berbeda pendapat apakah ada keraguan tentang kelembapan antara sperma dan pra-emisi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1746} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1747} Tidak ada efek emisi nokturnal saat puasa secara kebetulan, dan itu menyebabkan pubertas dengan kesepakatan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1747} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1748}"
