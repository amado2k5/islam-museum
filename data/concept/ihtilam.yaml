id: concept/ihtilam
class: concept
kind: legal
label: { ar: "احتلام", en: "Wet dream (ihtilam)" }
summary:
  ar: "الاحتلام إنزال المني في النوم، ويكون من الرجل والمرأة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1745} وقد اختلف الفقهاء في تحققه من المرأة: فالحنابلة والحنفية في ظاهر الرواية والشافعية في الثيب يرون تحققه بوصول المني إلى ظاهر الفرج، والمالكية بخروجه خارج الفرج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1745} وإذا وجد الرجل بللاً ولم يتذكر احتلاماً وجب عليه الغسل عند الجمهور، واختلف الفقهاء فيما إذا شك في البلل بين المني والمذي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1746} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1747} ولا أثر للاحتلام في الصوم باتفاق، وهو يحصل به البلوغ باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1747} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1748}"
  en: "Ihtilam is emission of semen during sleep; it happens to both men and women. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1745} On how it is realised in a woman, the jurists differ: the Hanbalis, the Hanafis in the apparent report, and the Shafi'is for a married woman hold that it occurs when the fluid reaches the outer part of the private parts; the Malikis hold that it occurs when it leaves the passage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1745} A man who finds wetness without remembering a dream must perform ghusl by the majority; where he doubts between semen and madhy the views differ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1746} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1747} Ihtilam does not affect fasting, and by agreement it marks puberty. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1747} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1748}"
