label: { ar: "الأغذية بحسب المزاج عند ابن سينا", en: "Foods for each temperament in the Canon", ur: "مزاج کے مطابق غذائیں", es: "Alimentos para cada temperamento en el canon", fr: "Aliments pour chaque tempérament dans le Canon", tr: "İbn Sina'ya göre mizaca göre yiyecekler", id: "Makanan sesuai temperamen menurut Avicenna" }
summary:
  ar: "يوجز ابن سينا حاجة أصحاب الأمزجة من الغذاء: السوداوي إلى مرطب كثير مسخن قليل، والصفراوي إلى ما يرطب ويبرد، ومن يتولد فيه دم حار إلى أغذية باردة قليلة الغذاء، ومن يتولد فيه دم بلغمي إلى أغذية قليلة الغذاء فيها سخونة وتلطيف {cite:canon-ibn-sina-print-v1 p.229}."
  en: "Ibn Sina sets out in brief what each humoral type needs of food: the melancholic much moistening and a little warming, the bilious what moistens and cools, one whose blood is hot cold foods of little nourishment, and one whose blood is phlegmatic foods of little nourishment with warmth and attenuation {cite:canon-ibn-sina-print-v1 p.229}."
  es: "Ibn Sina expone brevemente lo que cada tipo humoral necesita de alimento: el melancólico mucha humedad y un poco de calor, el bilioso lo que humedece y enfría, aquel cuya sangre es caliente alimentos fríos de poco valor nutritivo, y aquel cuya sangre es flemática alimentos de poco valor nutritivo con calor y atenuación {cite:canon-ibn-sina-print-v1 p.229}."
  fr: "Ibn Sina expose brièvement les besoins alimentaires de chaque type humoral: le mélancolique beaucoup d'hydratation et un peu de chaleur, le bilieux ce qui hydrate et rafraîchit, celui dont le sang est chaud des aliments froids peu nourrissants, et celui dont le sang est flegmatique des aliments peu nourrissants avec chaleur et atténuation {cite:canon-ibn-sina-print-v1 p.229}."
  ur: "ابن سینا نے مختصراً بیان کیا ہے کہ ہر مزاحیہ قسم کے کھانے کی کیا ضرورت ہوتی ہے: میلانکولک بہت زیادہ تر اور تھوڑا سا گرم کرنے والا، بلیائی جو نم اور ٹھنڈا کرتا ہے، وہ جس کا خون گرم ٹھنڈا غذا ہے جس کی تھوڑی پرورش ہوتی ہے، اور وہ جس کا خون گرمی اور تپش کے ساتھ تھوڑی پرورش والی بلغمی غذا ہے۔"
  tr: "İbn Sina, mizaçları olanların yiyecek ihtiyacını özetler: bol nemlendirici ve hafif ısıtıcı için siyah mürekkep; nemlendirici ve serinletici için safra imkânı; sıcak kan üretenler için, soğuk, düşük besinli yiyecekler için; flegmatik kan üretenler için, az sıcak ve yatıştırıcı yiyecekler için. {cite:canon-ibn-sina-print-v1 s.229}."
  id: "Ibn Sina merangkum kebutuhan mereka yang bertemperamen akan makanan: tinta hitam untuk banyak pelembap dan sedikit memanaskan; empedu untuk apa yang melembapkan dan mendinginkan; bagi mereka yang menghasilkan darah panas, untuk makanan dingin dan rendah nutrisi; bagi mereka yang menghasilkan darah flegmatik, untuk makanan dengan sedikit kehangatan dan menenangkan. {cite:canon-ibn-sina-print-v1 hlm.229}."
