summary:
  ar: "يوجز ابن سينا حاجة أصحاب الأمزجة من الغذاء: السوداوي إلى مرطب كثير مسخن قليل، والصفراوي إلى ما يرطب ويبرد، ومن يتولد فيه دم حار إلى أغذية باردة قليلة الغذاء، ومن يتولد فيه دم بلغمي إلى أغذية قليلة الغذاء فيها سخونة وتلطيف {cite:canon-ibn-sina-print-v1 p.229}."
  en: "Ibn Sina sets out in brief what each humoral type needs of food: the melancholic much moistening and a little warming, the bilious what moistens and cools, one whose blood is hot cold foods of little nourishment, and one whose blood is phlegmatic foods of little nourishment with warmth and attenuation {cite:canon-ibn-sina-print-v1 p.229}."
