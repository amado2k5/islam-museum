id: concept/al-hadith-al-hasan
class: concept
kind: term
label: { ar: "الحديث الحسن", en: "The good report (hasan)", ur: "حسن حدیث" }
term: { ar: "الحسن لذاته، والحسن لغيره", en: "al-hasan li-dhatihi, al-hasan li-ghayrihi" }
summary:
  ar: "الحسن لذاته عند ابن حجر ما اجتمعت فيه شروط الصحيح إلا أن ضبط راويه خفّ، وهو يشارك الصحيح في الاحتجاج وإن كان دونه؛ والحسن لغيره ما يتوقف فيه إذا قامت قرينة ترجح قبوله، كحديث المستور إذا تعددت طرقه؛ ويفسّر قول الترمذي «حسن صحيح» بالتردد في حال الراوي عند التفرد أو بتعدد الإسناد، ويرى أن تعريف الترمذي للحسن خاص بما يقول فيه «حسن» فقط {cite:nuzhat-al-nazar-itr-bushra-2011 p. 53} {cite:nuzhat-al-nazar-itr-bushra-2011 p. 60-63}."
  en: "For Ibn Hajar the report good in itself (hasan li-dhatihi) meets all the conditions of the sound report except that its narrator's accuracy is lighter; it shares with the sound report in serving as proof, though below it; the report good through another (hasan li-ghayrihi) is one on which judgement is suspended until an indication tips it toward acceptance, as with an obscure narrator's report with several chains; he explains al-Tirmidhi's 'hasan sahih' as hesitation over a lone narrator or as two chains, and holds that al-Tirmidhi's definition of hasan covers only what he calls simply 'hasan' {cite:nuzhat-al-nazar-itr-bushra-2011 p. 53} {cite:nuzhat-al-nazar-itr-bushra-2011 p. 60-63}."
  ur: "ابن حجر کے نزدیک حسن لذاتہ وہ ہے جس میں صحیح کی تمام شرائط ہوں مگر راوی کا ضبط ہلکا ہو؛ یہ استدلال میں صحیح کی شریک ہے اگرچہ اس سے کمتر ہے؛ حسن لغیرہ وہ ہے جس میں توقف ہو اور کوئی قرینہ اس کے قبول کو ترجیح دے، جیسے مستور راوی کی حدیث جب اس کے طرق متعدد ہوں؛ وہ ترمذی کے «حسن صحیح» کی تفسیر تفرد کی صورت میں راوی کے حال میں تردد سے، یا دو سندوں سے کرتے ہیں، اور ترمذی کی حسن کی تعریف کو صرف اس سے خاص سمجھتے ہیں جسے وہ صرف «حسن» کہیں {cite:nuzhat-al-nazar-itr-bushra-2011 p. 53} {cite:nuzhat-al-nazar-itr-bushra-2011 p. 60-63}۔"
