label:
  ar: "قصة أصحاب القرية"
  en: "The story of the people of the town"
  ur: "بستی والوں کا قصہ"
  es: "La historia de la gente del pueblo"
  fr: "L'histoire des habitants de la ville"
  tr: "Köy sahiplerinin hikayesi"
  id: "Kisah para pemilik desa"
summary:
  ar: "القصة القرآنية للقرية التي جاءها المرسلون، كما يعرضها عمر عبد الكافي في سلسلة «قصة وعبر»: رسولان كُذّبا فعُزّزا بثالث، ورجل يسميه المفسرون حبيب النجار جاء يدعو قومه إلى اتباع المرسلين فقتلوه، فكان عنده مثالًا للثبات وحسن الخاتمة."
  en: "The Qur'anic story of the town to which messengers came, as Omar Abdelkafy presents it in the series Qissa wa 'Ibar: two messengers rejected and reinforced by a third, and a man the commentators call Habib al-Najjar who urged his people to follow them and was killed, for the speaker a model of steadfastness and a good end."
  ur: "اس بستی کا قرآنی قصہ جس کی طرف رسول آئے، جیسے عمر عبد الکافی سلسلہ «قصہ و عبر» میں پیش کرتے ہیں: دو رسول جھٹلائے گئے اور تیسرے سے تقویت دی گئی، اور ایک شخص جسے مفسرین حبیب النجار کہتے ہیں قوم کو رسولوں کی پیروی کی دعوت دینے آیا اور قتل کیا گیا؛ متکلم کے نزدیک ثابت قدمی اور حسنِ خاتمہ کی مثال۔"
  es: "La historia coránica de la ciudad a la que llegaron los mensajeros, tal como la presenta Omar Abdelkafy en la serie Qissa wa 'Ibar: dos mensajeros fueron rechazados y reforzados por un tercero, y un hombre al que los comentaristas llaman Habib al-Najjar, quien instó a su pueblo a seguirlos y fue asesinado, para el narrador un modelo de firmeza y un buen final."
  fr: "L'histoire coranique de la ville où arrivèrent les messagers, telle que présentée par Omar Abdelkafy dans la série Qissa wa 'Ibar: deux messagers rejetés et soutenus par un troisième, et un homme que les commentateurs appellent Habib al-Najjar qui exhorta son peuple à les suivre et fut tué, pour le narrateur un modèle de constance et une fin heureuse."
  tr: "Elçilerin geldiği köyün Kur'an hikayesi, Omar Abdel Kafi tarafından \"Hikaye ve Ders\" serisinde sunulduğu şekliyle: iki elçi yalan söyledi ve üçüncüsü tarafından güçlendirildi. Yorumcuların Habib al-Najjar dediği bir adam, halkını elçileri takip etmeye çağırdı, ancak onlar onu öldürdü. O, kararlılığın ve iyi bir sonunun örneğiydi."
  id: "Kisah Al-Qur'an tentang desa tempat para rasul datang, seperti yang disampaikan oleh Omar Abdel Kafi dalam seri \"Kisah dan Pelajaran\": dua utusan berbohong dan diperkuat oleh yang ketiga. Seorang pria yang oleh para komentator disebut Habib al-Najjar datang untuk memanggil rakyatnya mengikuti para utusan, tetapi mereka membunuhnya. Dia adalah teladan keteguhan dan akhir yang baik."
