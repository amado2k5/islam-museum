id: concept/qissat-ashab-al-qarya
class: concept
kind: term
label:
  ar: "قصة أصحاب القرية"
  en: "The story of the people of the town"
  ur: "بستی والوں کا قصہ"
summary:
  ar: "القصة القرآنية للقرية التي جاءها المرسلون، كما يعرضها عمر عبد الكافي في سلسلة «قصة وعبر»: رسولان كُذّبا فعُزّزا بثالث، ورجل يسميه المفسرون حبيب النجار جاء يدعو قومه إلى اتباع المرسلين فقتلوه، فكان عنده مثالًا للثبات وحسن الخاتمة."
  en: "The Qur'anic story of the town to which messengers came, as Omar Abdelkafy presents it in the series Qissa wa 'Ibar: two messengers rejected and reinforced by a third, and a man the commentators call Habib al-Najjar who urged his people to follow them and was killed, for the speaker a model of steadfastness and a good end."
  ur: "اس بستی کا قرآنی قصہ جس کی طرف رسول آئے، جیسے عمر عبد الکافی سلسلہ «قصہ و عبر» میں پیش کرتے ہیں: دو رسول جھٹلائے گئے اور تیسرے سے تقویت دی گئی، اور ایک شخص جسے مفسرین حبیب النجار کہتے ہیں قوم کو رسولوں کی پیروی کی دعوت دینے آیا اور قتل کیا گیا؛ متکلم کے نزدیک ثابت قدمی اور حسنِ خاتمہ کی مثال۔"
