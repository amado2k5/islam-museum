perspectives:
- tradition: sunni
  id: sunni-sharawi-judge-all
  stance:
    ar: "يُحكم بين الناس جميعاً بالحق، ولا يحابي المسلم لأنه مسلم، ولا يُدافع عن الخائن"
    en: "Judgement is between all people by truth; a Muslim is not favoured for being a Muslim, and the treacherous is not defended"
  summary:
    ar: "يرى الشعراوي أن النبي أُمر بأن يحكم بين الناس بما أراه الله، لا بين المؤمنين وحدهم، وأن الحكم بالحق يصدق دين الحاكم أمام غير المسلم {cite:tafsir-sharawi-khawatir-scan p.2605}{cite:tafsir-sharawi-khawatir-scan p.2606}. ويذكر قصة طعمة بن أبيرق الذي سرق الدرع وأودعها عند يهودي، وأن قومه طلبوا من النبي أن يبرئه لأن الحكم ضد المسلم يشيع العار بين المسلمين، فيرى أن هذا الضغط من الغريزة البشرية، وأن الآية نهت عن أن يكون الحاكم خصيماً للخائنين {cite:tafsir-sharawi-khawatir-scan p.2606}{cite:tafsir-sharawi-khawatir-scan p.2607}{cite:tafsir-sharawi-khawatir-scan p.2608}. ويقرر أن الحد ينزل على المسلم إن ارتكب الخطأ، لأن عقابه شهادة للإسلام بأنه لا يجامل أحداً {cite:tafsir-sharawi-khawatir-scan p.2607}. ويفسر أن الإثم والخطيئة يحتملهما من يرمي بريئاً بما ارتكبه {cite:tafsir-sharawi-khawatir-scan p.2618}{cite:tafsir-sharawi-khawatir-scan p.2621}. ويذكر أن النبي قضى في الحكم ضد ابن أبيرق لصالح اليهودي {cite:tafsir-sharawi-khawatir-scan p.2614}. وهذا رأيه، ولم تُعرض بعد أحكام القضاء في غير المسلمين من مصدر محدد (needs_source)."
    en: "Sha'rawi holds that the Prophet was ordered to judge between people by what God showed him, not between believers alone, and that a judgement by truth is a witness for the religion before a non-Muslim {cite:tafsir-sharawi-khawatir-scan p.2605}{cite:tafsir-sharawi-khawatir-scan p.2606}. He recounts how Tu'ma ibn Ubayriq stole a coat of mail and left it with a Jew, and how his kin asked the Prophet to clear him, fearing that a ruling against a Muslim would shame the Muslims; he holds that this pressure comes from human instinct and that the verse forbids the judge to become an advocate for the treacherous {cite:tafsir-sharawi-khawatir-scan p.2606}{cite:tafsir-sharawi-khawatir-scan p.2607}{cite:tafsir-sharawi-khawatir-scan p.2608}. He holds that the hadd falls on a Muslim who errs, since his punishment is a witness that Islam does not favour anyone {cite:tafsir-sharawi-khawatir-scan p.2607}. He reads the verse on false accusation as meaning that the one who throws a sin onto an innocent person bears both the wrong and the manifest sin {cite:tafsir-sharawi-khawatir-scan p.2618}{cite:tafsir-sharawi-khawatir-scan p.2621}. He reports that the Prophet ruled against Ibn Ubayriq in favour of the Jew {cite:tafsir-sharawi-khawatir-scan p.2614}. This is his view; the jurists' rules on judging non-Muslims are not yet set out from a named source (needs_source)."
