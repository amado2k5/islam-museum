id: concept/hukm-bayn-al-nas
class: concept
kind: legal
label:
  ar: الحكم بين الناس بالحق
  en: Judging between people by truth
summary:
  ar: "يقرر الشعراوي أن الكتاب أُنزل ليُحكم به بين الناس جميعاً لا بين المؤمنين وحدهم، ويعرض قصة رجل من بني ظفر سرق درعاً وألقى تهمتها على يهودي، فيرى أن الحكم بالحق يقع على المسلم إن أخطأ، ولا يحابي لأن الإسلام نفسه يقتضي ذلك، وأن الحاكم لا يدافع عن الخائنين {cite:tafsir-sharawi-khawatir-scan p.2605}{cite:tafsir-sharawi-khawatir-scan p.2607}{cite:tafsir-sharawi-khawatir-scan p.2608}. ويذكر حديث المرأة المخزومية في إقامة الحد على السارقة ولو كانت من الشرفاء {cite:tafsir-sharawi-khawatir-scan p.2622}."
  en: "Sha'rawi holds that the Book was sent down to judge between all people, not only between believers. He recounts the case of a man of the Banu Zafar who stole a coat of mail and laid the charge on a Jew; he holds that truth binds the judge even when the guilty party is a Muslim, that favouritism is ruled out, and that the judge does not defend the treacherous {cite:tafsir-sharawi-khawatir-scan p.2605}{cite:tafsir-sharawi-khawatir-scan p.2607}{cite:tafsir-sharawi-khawatir-scan p.2608}. He recounts the hadith of the Makhzumite woman, whose hadd for theft was carried out although a noble was involved {cite:tafsir-sharawi-khawatir-scan p.2622}."
