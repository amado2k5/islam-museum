issue:
  ar: "هل يُحكم بين المسلم وغيره بمعيار واحد، وهل يُدافع عن المذنب لأنه مسلم؟"
  en: "Is one standard applied between a Muslim and others, and may one defend a guilty person because he is a Muslim?"
