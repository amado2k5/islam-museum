id: concept/ikhdam
class: concept
kind: legal
label:
  ar: إخدام
  en: Ikhdam (providing a servant to a wife or to a bankrupt)
  es: "Ikhdam (proporcionar un sirviente a una esposa o a un quebrado)"
  fr: "Ikhdam (fournir un serviteur à une épouse ou à un failli)"
summary:
  ar: 'الإخدام لغةً إعطاء خادم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1972} وجمهور الفقهاء يوجبون على الزوج إخدام زوجته إن كانت ممن يُخدم مثلها، أو الإنفاق على خادمها الذي معها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1972} ويبحث إخدام الزوجة في النفقات، وإخدام المفلس في باب التفليس، وإخدام المحبوس فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1972}'
  en: 'Ikhdam means, in the lexicon, giving a servant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1972} The majority of jurists hold that a husband must provide a servant for his wife if she is of a class that is served, or else maintain the servant she brings with her. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1972} The servant of a wife is treated under maintenance, and that of a bankrupt or an imprisoned debtor under bankruptcy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1972}'
  es: "Ikhdam significa, en el léxico, dar un sirviente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1972} La mayoría de los juristas sostienen que un marido debe proporcionar un sirviente a su esposa si ella pertenece a una clase social que recibe servicios, o bien mantener al sirviente que ella trae consigo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1972} El sirviente de una esposa se considera dentro del régimen de manutención, y el de un deudor en quiebra o encarcelado, dentro del régimen de quiebra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1972}"
  fr: "Dans le lexique, « ikhdam » signifie « donner un serviteur ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1972} La majorité des juristes estiment qu'un mari doit fournir un serviteur à son épouse si celle-ci appartient à une catégorie sociale qui en bénéficie, ou bien entretenir le serviteur qu'elle amène avec elle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1972} Le serviteur de l'épouse est considéré comme une obligation alimentaire, et celui d'un débiteur en faillite ou emprisonné comme une obligation alimentaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1972}"
