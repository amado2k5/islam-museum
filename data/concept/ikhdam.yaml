label:
  ar: إخدام
  en: Ikhdam (providing a servant to a wife or to a bankrupt)
summary:
  ar: 'الإخدام لغةً إعطاء خادم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1972} وجمهور الفقهاء يوجبون على الزوج إخدام زوجته إن كانت ممن يُخدم مثلها، أو الإنفاق على خادمها الذي معها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1972} ويبحث إخدام الزوجة في النفقات، وإخدام المفلس في باب التفليس، وإخدام المحبوس فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1972}'
  en: 'Ikhdam means, in the lexicon, giving a servant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1972} The majority of jurists hold that a husband must provide a servant for his wife if she is of a class that is served, or else maintain the servant she brings with her. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1972} The servant of a wife is treated under maintenance, and that of a bankrupt or an imprisoned debtor under bankruptcy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1972}'
