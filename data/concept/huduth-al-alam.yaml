label: { ar: "حدوث العالم وقدمه", en: "The world's createdness or eternity", es: "La naturaleza creada o la eternidad del mundo", fr: "La création du monde ou son éternité", ur: "دنیا کی تخلیق یا ابدیت" }
summary:
  ar: "ذكر المسعودي قول طوائف الهند وفرق من اليونانيين والفلكيين بالقدم وأن الحركة الصانعة للأشخاص متى قطعت المسافة التي بين العقدة التي ابتدأت منها حتى تنتهي إليها راجعة أعادت كل ما بدأت به كهيئته وأشخاصه، وقول الطبيعيين إن علة الكون الحرارة والرطوبة وعلة الفساد البرد واليبس وأن الطبيعة لما عجزت عن تبقية الأشخاص عدلت إلى النسل، ثم أورد دليله على حدوث العالم من وجود التناهي والابتداء في أجزائه وأن الموجودات لا بد لها من محدث لا شكل له ولا مثل، وزعمت اليهود أن عمر الدنيا ستة آلاف سنة مأخذاً شرعياً وذهبت النصارى إلى ما ذهبت إليه اليهود وأما الصابئة الحرانيون والكيماريون فعلى قول اليونانيين {cite:muruj-al-dhahab p. 559-561}."
  en: "The eternity debate as al-Mas'udi stages it: Indian and Greek eternalists' great-year recurrence, the naturalists' hot-wet generation against cold-dry corruption, then his own kalam proof from the world's finite parts to a formless Maker — followed by the peoples' world-ages: the Jews' scriptural six thousand years, the Christians' agreement, and the Sabians' Greek doctrine {cite:muruj-al-dhahab p. 559-561}."
  es: "El debate sobre la eternidad tal como lo plantea al-Mas'udi: la recurrencia del gran año de los eternalistas indios y griegos, la generación cálida y húmeda de los naturalistas contra la corrupción fría y seca, luego su propia prueba kalam de las partes finitas del mundo a un Creador sin forma, seguida de las edades del mundo de los pueblos: los seis mil años escriturales de los judíos, el acuerdo de los cristianos y la doctrina griega de los sabeos {cite:muruj-al-dhahab p. 559-561}."
  fr: "Le débat sur l'éternité tel qu'al-Mas'udi le met en scène: la grande récurrence des éternalistes indiens et grecs, la génération chaude et humide des naturalistes contre la corruption froide et sèche, puis sa propre preuve kalam des parties finies du monde à un Créateur sans forme — suivie des âges du monde des peuples: les six mille ans scripturaires des Juifs, l'accord des Chrétiens et la doctrine grecque des Sabéens {cite: muruj-al-dhahab p. 559-561}."
  ur: "المسعودی کے طور پر ابدیت کی بحث اس کا آغاز کرتی ہے: ہندوستانی اور یونانی ابدیت پسندوں کی عظیم سالہ تکرار، فطرت پسندوں کی سرد خشک بدعنوانی کے خلاف گرم گیلی نسل، پھر دنیا کے محدود حصوں سے ایک بے شکل بنانے والے تک اس کا اپنا کلام ثبوت - اس کے بعد لوگوں کی عالمی عمریں: یہودیوں کا صحیفہ چھ ہزار سال، عیسائیوں کا معاہدہ، یونانی معاہدہ۔ {حوالہ: مروج الذہب ص۱۴۲۔ 559-561}۔"
