id: concept/huduth-al-alam
class: concept
kind: doctrine
label: { ar: "حدوث العالم وقدمه", en: "The world's createdness or eternity" }
summary:
  ar: "ذكر المسعودي قول طوائف الهند وفرق من اليونانيين والفلكيين بالقدم وأن الحركة الصانعة للأشخاص متى قطعت المسافة التي بين العقدة التي ابتدأت منها حتى تنتهي إليها راجعة أعادت كل ما بدأت به كهيئته وأشخاصه، وقول الطبيعيين إن علة الكون الحرارة والرطوبة وعلة الفساد البرد واليبس وأن الطبيعة لما عجزت عن تبقية الأشخاص عدلت إلى النسل، ثم أورد دليله على حدوث العالم من وجود التناهي والابتداء في أجزائه وأن الموجودات لا بد لها من محدث لا شكل له ولا مثل، وزعمت اليهود أن عمر الدنيا ستة آلاف سنة مأخذاً شرعياً وذهبت النصارى إلى ما ذهبت إليه اليهود وأما الصابئة الحرانيون والكيماريون فعلى قول اليونانيين {cite:muruj-al-dhahab p. 559-561}."
  en: "The eternity debate as al-Mas'udi stages it: Indian and Greek eternalists' great-year recurrence, the naturalists' hot-wet generation against cold-dry corruption, then his own kalam proof from the world's finite parts to a formless Maker — followed by the peoples' world-ages: the Jews' scriptural six thousand years, the Christians' agreement, and the Sabians' Greek doctrine {cite:muruj-al-dhahab p. 559-561}."
