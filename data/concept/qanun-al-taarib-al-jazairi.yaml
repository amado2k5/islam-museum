label:
  ar: "قانون التعريب الجزائري"
  en: "Algeria's Arabisation law"
  ur: "الجزائر کا قانونِ تعریب"
  fr: "La loi d'arabisation de l'Algérie"
  es: "La ley de arabización de Argelia"
summary:
  ar: "القانون رقم 91-05 المؤرخ في 16 يناير 1991 المتضمن تعميم استعمال اللغة العربية، المعدّل بالأمر رقم 96-30 المؤرخ في 21 ديسمبر 1996، وهو يوجب العربية وحدها في الإدارات والمؤسسات والمؤسسات الاقتصادية والجمعيات والوثائق الرسمية والتعليم والاجتماعات مع استثناءات محدودة للعلاقات الخارجية، كما يلخصه ملف بحثي قُدّم إلى المتحف {cite:axl-cefan-ulaval-language-legislation} {cite:algeria-watch-home} {cite:joradp-journal-officiel-algeria}."
  en: "Law No. 91-05 of 16 January 1991 on the generalisation of the use of Arabic, revised by Ordinance No. 96-30 of 21 December 1996, which requires Arabic alone in administrations, institutions, enterprises, associations, official documents, education and meetings, with limited exceptions for foreign relations, as a research file supplied to the museum summarises it {cite:axl-cefan-ulaval-language-legislation} {cite:algeria-watch-home} {cite:joradp-journal-officiel-algeria}."
  ur: "قانون نمبر 91-05 مورخہ 16 جنوری 1991 برائے عربی زبان کے استعمال کی عمومیت، جس میں حکم نمبر 96-30 مورخہ 21 دسمبر 1996 کے ذریعے ترمیم ہوئی؛ یہ انتظامیہ، اداروں، اقتصادی اداروں، انجمنوں، سرکاری دستاویزات، تعلیم اور اجلاسوں میں صرف عربی کو لازم قرار دیتا ہے اور خارجہ تعلقات میں محدود استثنا رکھتا ہے، جیسا کہ میوزیم کو پیش کی گئی ایک تحقیقی فائل اس کا خلاصہ کرتی ہے {cite:axl-cefan-ulaval-language-legislation} {cite:algeria-watch-home} {cite:joradp-journal-officiel-algeria}."
  fr: "La loi n° 91-05 du 16 janvier 1991 portant généralisation de l'utilisation de la langue arabe, révisée par l'ordonnance n° 96-30 du 21 décembre 1996, qui exige l'arabe seul dans les administrations, institutions, entreprises, associations, documents officiels, l'enseignement et les réunions, avec des exceptions limitées pour les relations extérieures, telle qu'un dossier de recherche remis au musée la résume {cite:axl-cefan-ulaval-language-legislation} {cite:algeria-watch-home} {cite:joradp-journal-officiel-algeria}."
  es: "La Ley n.º 91-05 del 16 de enero de 1991 sobre la generalización del uso de la lengua árabe, revisada por la Ordenanza n.º 96-30 del 21 de diciembre de 1996, que exige el árabe en exclusiva en las administraciones, instituciones, empresas, asociaciones, documentos oficiales, educación y reuniones, con excepciones limitadas para las relaciones exteriores, tal como la resume un expediente de investigación entregado al museo {cite:axl-cefan-ulaval-language-legislation} {cite:algeria-watch-home} {cite:joradp-journal-officiel-algeria}."
