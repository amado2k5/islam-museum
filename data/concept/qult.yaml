summary:
  ar: "القلت في الكتاب هو الماش الهندي، وهو مثل بزر الكتان وأكبر قليلا إلى الغبرة، بارد في الثانية رطب في الأولى، يذهب بالفواق ويفتت حصاة الكلى والمثانة ويستطلق البطن {cite:canon-ibn-sina-print-v1 p.660}"
  en: "Qult is in the book the Indian mash, like linseed but a little larger and dusky; cold in the second degree and moist in the first; it removes hiccup, breaks the stone of the kidneys and bladder, and loosens the belly {cite:canon-ibn-sina-print-v1 p.660}"
  ur: "قلت کتاب میں ہندی ماش ہے، جو السی کے بیج جیسا اور اس سے ذرا بڑا اور گرد آلود رنگ کی طرف مائل ہے؛ دوسرے درجے میں ٹھنڈا اور پہلے میں تر ہے؛ ہچکی کو دور کرتا ہے، گردوں اور مثانے کی پتھری کو توڑتا ہے اور پیٹ کو کھولتا ہے {cite:canon-ibn-sina-print-v1 p.660}۔"
  es: "En el libro, Qult es la papilla india, parecida a la linaza pero un poco más grande y oscura; fría en segundo grado y húmeda en primero; quita el hipo, disuelve los cálculos renales y de la vejiga, y afloja el estómago {cite:canon-ibn-sina-print-v1 p.660}"
  fr: "Le qult est décrit dans le livre comme une purée indienne, semblable à la graine de lin mais un peu plus grosse et plus sombre; froide au deuxième degré et humide au premier; elle fait disparaître le hoquet, dissout les calculs rénaux et vésicaux et soulage les maux d'estomac {cite:canon-ibn-sina-print-v1 p.660}"
  tr: "Kitaptaki kelime Hint mung fasulyesidir; keten tohumu gibi tozdan biraz büyüktür, ikincisi soğuk, ilkinde nemlidir, hıçkırır, böbrek ve mesane taşlarını kırar ve karının çözülmesine neden olur {cite:canon-ibn-sina-print-v1 s.660}"
  id: "Kata dalam buku ini adalah kacang hijau India, yang mirip biji rami dan sedikit lebih besar dari debu, dingin di biji kedua, lembap di kacang pertama, mengalami cegukan, mematahkan batu ginjal dan kandung kemih, dan menyebabkan perut larut {cite:canon-ibn-sina-print-v1 hlm.660}"
