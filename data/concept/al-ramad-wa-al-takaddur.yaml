id: "concept/al-ramad-wa-al-takaddur"
class: "concept"
kind: "scientific"
label:
  ar: "الرمد والتكدر"
  en: "Ophthalmia and turbidity (ramad, takaddur)"
  fr: "Ophtalmie et trouble (ramad, takaddur)"
  ur: "رمد اور تکدر"
  es: "Oftalmía y turbidez (ramad, takaddur)"
summary:
  ar: "الرمد منه حقيقي ومنه ما يشبهه ويسمى التكدر والتخثر وهو يسخن ويرطب ويعرض من أسباب خارجة تثيره وتحمره كالشمس والغبار والدخان والبرد أحياناً والضربة والريح العاصفة، ولا يأني بعد السبب، وأما الرمد الحقيقي فهو ورم في الملتحمة منه بسيط غير مجاوز للحد ومنه عظيم يربو فيه البياض على الحدقة فيغطيها ويسمى كيموسيس ويعرف عندنا بالوردينج {cite:canon-ibn-sina-print-v2 p.167}"
  en: "Ramad has a true kind and a resembling kind called takaddur or takhatthur — a heating and moistening from outside causes that stir and redden it: sun, dust, smoke, sometimes cold, a blow, the violent wind — not lingering after its cause; true ramad is a swelling in the conjunctiva, either simple within bounds or great, the white rising over the pupil and covering it, called chemosis and known here as wardinj {cite:canon-ibn-sina-print-v2 p.167}"
  fr: "Le ramad a une espèce vraie et une espèce ressemblante appelée takaddur ou takhatthur — un échauffement et une humectation dus à des causes extérieures qui l’agitent et le rougissent : soleil, poussière, fumée, parfois le froid, un coup, le vent violent — qui ne s’attarde pas après sa cause ; le ramad vrai est un gonflement de la conjonctive, soit simple et dans des limites, soit grand, le blanc s’élevant par-dessus la pupille et la recouvrant, ce qu’on appelle chémosis, connu ici sous le nom de wardinj {cite:canon-ibn-sina-print-v2 p.167}"
  ur: "رمد کی ایک حقیقی قسم ہے اور ایک مشابہ جسے تکدر اور تخثر کہتے ہیں — بیرونی اسباب سے گرم اور تر ہونے والی تکلیف جو اسے بھڑکا کر سرخ کرتی ہے: دھوپ، غبار، دھواں، کبھی سردی، چوٹ، تیز ہوا — اور وہ سبب کے بعد نہیں ٹھہرتی؛ حقیقی رمد ملتحمہ میں ورم ہے: یا سادہ، حد سے نہ بڑھا ہوا، یا عظیم جس میں سفیدی حدقہ پر چڑھ کر اسے ڈھانپ لیتی ہے، جسے کیموسس اور ہمارے ہاں وردینج کہتے ہیں {cite:canon-ibn-sina-print-v2 p.167}"
  es: "Ramad tiene una forma verdadera y otra similar llamada takaddur o takhatthur: un calentamiento y humectación por causas externas que lo agitan y enrojecen: sol, polvo, humo, a veces frío, un soplo, viento violento; no persiste tras su causa. El verdadero ramad es una hinchazón en la conjuntiva, ya sea simple dentro de límites o grande, la parte blanca se eleva sobre la pupila y la cubre, llamada quemosis y conocida aquí como wardinj {cite:canon-ibn-sina-print-v2 p.167}"
