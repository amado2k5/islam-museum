label:
  ar: هِبَة
  en: 'Hiba (gift: its pillars, the parties, the thing given, possession, return and conditions)'
summary:
  ar: 'الهبة في اللغة إعطاء الشيء إلى الغير بلا عوض، وفي الاصطلاح تمليك المال بلا عوض في الحال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16772} وتفترق عن العطية الأعم، وعن الهدية بأن القبول يلزم فيها عند أكثر الفقهاء، وعن الصدقة التي يُطلب بها ثواب الآخرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16772} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16773} وهي مشروعة بالكتاب والسنة والإجماع، ومندوبة، وتحرم إذا قُصد بها معصية أو إعانة على ظلم أو رشوة، وتكره إذا قُصد بها الرياء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16773} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16774} وأركانها عند الجمهور العاقدان والمعقود عليه والصيغة، وعند الحنفية الصيغة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16774} ويشترط في الواهب أهلية التبرع، فلا تصح هبة الصغير والمجنون، وتختلف المذاهب في المحجور عليه بدين أو سفه، وفي هبة المريض مرض الموت فيما زاد على الثلث، وفي هبة الأب مال ابنه بعوض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16774} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16775} وفي هبة الفضولي عند الجمهور بطلان، وعند الحنفية وقف على الإجازة، وفي هبة السكران تفصيل بين المباح والمحرم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16776} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16777} ويشترط في الموهوب أن يكون موجوداً مملوكاً للواهب متقوماً، فلا تصح هبة المعدوم والمجهول عند الجمهور، وأجاز المالكية هبة ما يقبل النقل. وتختلف المذاهب في هبة الدين لغير من هو عليه وفي هبة المشاع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16780} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16781} وتختلف المذاهب في القبض: فالحنفية والشافعية وبعض الحنابلة يشترطونه، والمالكية يرون الهبة لازمة بالعقد، وفي قول للحنابلة تصح بلا قبض. ويشترط الحنفية إذن الواهب، وألا يكون الموهوب مشغولاً بما ليس موهوباً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16782} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16783} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16785} والإيجاب وحده ركن الهبة عند الحنفية، والإيجاب والقبول عند الجمهور؛ ويصح القبول بالفعل، ويجوز تراخيه عند المالكية والحنابلة، ولا يصح تعليق الهبة عند الحنفية والشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16788} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16789} وتختلف المذاهب في الشرط المقترن بالهبة: فالجمهور يبطلون الشرط الفاسد ويصحون الهبة، والمالكية والشافعية والحنابلة في وجه يبطلون الشرط والعقد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16789} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16790} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16791} وفي الهبة بشرط العوض يختلف الفقهاء في صحته: فالجمهور يصححونه، والشافعية في مقابل الأظهر والحنابلة في قول يبطلونه؛ وفي تكييفها: بيع عند المالكية والشافعية والحنابلة في المذهب وزفر، وهبة ابتداء بيع انتهاء عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16792} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16793} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16794} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16795} وفي لزوم العوض بغير اشتراط: الحنفية والشافعية والحنابلة في المذهب لا يوجبونه إلا بالتصريح، والمالكية والحنابلة في قول يوجبونه بالعرف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16796} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16797} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16798} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16799} وتمام الهبة بقبض الموهوب عند الجمهور، والمالكية يرون الملك بالعقد وهو الأصل عند الحنابلة فيما لا يكال ولا يوزن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16799} والرجوع في الهبة: لا يجوز عند المالكية والحنابلة في المذهب والشافعية في مقابل المشهور إلا للأب فيما وهب لولده، وألحق المالكية الأم وسائر الأصول، وأجاز الحنفية الرجوع مع الكراهة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16801} ومنع الحنفية الرجوع بهلاك الموهوب أو خروجه عن الملك أو الزيادة المتصلة أو وجود العوض أو صلة الرحم المحرم أو الزوجية أو الصدقة أو موت أحد المتعاقدين أو تغيره، ومنعه المالكية بزيادة الشيء أو نقصه أو المداينة لأجل الهبة أو مرض الولد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16802} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16803} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16804} ومنعه الشافعية بخروج الشيء عن سلطنة الولد، ومنعه الحنابلة بخروجه عن ملكه أو رغبة الغير فيه أو زيادته، وأجازوا للمرأة الرجوع في صداقها عند بعض الروايات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16806} والرجوع فسخ عند الحنفية إذا كان بالتقاضي أو بالتراضي عند غير زفر، وهو هبة مبتدأة عند زفر في التراضي. ويعود الشيء إلى ملك الواهب، وإذا هلك في يد الموهوب له بعد الرجوع لم يضمن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16807} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16807}'
  en: 'Hiba in the lexical sense is giving a thing to another without return; technically it is transferring property without return at once. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16772} It differs from the wider atiya, from hadiya in that most jurists require acceptance in a gift, and from sadaqa, which seeks reward in the hereafter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16772} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16773} Gifts are lawful by the Qur''an, the sunna and consensus, recommended, forbidden when meant for sin, aid to wrongdoing or bribery, and disliked when meant for show. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16773} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16774} The pillars are, for most jurists, the two parties, the thing given and the formula; for the Hanafis only the formula. The donor must be competent; the schools differ on the debt-bound, the feeble-minded, a dying man''s gift beyond a third, and a father''s gift of his son''s property for a return. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16774} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16775} The gift of an unauthorized donor is void for most, suspended on approval for the Hanafis; a drunkard''s gift depends on whether the drink was lawful. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16776} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16777} The thing given must exist, be owned by the donor and have value; most jurists disallow gifts of the non-existent or unknown, while the Malikis allow what can be moved. The schools differ on giving a debt to a third party and on an undivided share. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16780} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16781} On possession: the Hanafis, Shafi''is and one Hanbali view require it, with donor''s leave and no encumbrance; the Malikis hold the gift binding by the contract, and a Hanbali view accepts an unpossessed gift of what is not measured. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16782} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16783} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16785} On the formula: the Hanafis count the offer alone as the pillar, the majority the offer and acceptance; acceptance may be by act; delayed acceptance is allowed by the Malikis and Hanbalis; a conditional gift is refused by the Hanafis, Shafi''is and Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16788} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16789} Conditions attached to a gift: the majority void an invalid condition and keep the gift; the Malikis, Shafi''is and one Hanbali view void both. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16790} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16791} A gift for a return: most jurists allow it, the Shafi''is in the weaker view and one Hanbali view forbid it; its nature is a sale by the Malikis, Shafi''is and Hanbalis, and a gift begun and sale completed by the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16792} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16793} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16794} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16795} Whether a return is due without stipulation: the Hanafis, Shafi''is and the Hanbali school do not require it except by statement; the Malikis and one Hanbali view require it by custom. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16796} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16797} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16798} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16799} Retraction: the majority forbid it except for the father in his son''s gift; the Malikis extend it to the mother and ascendants; the Hanafis allow it with disapproval. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16801} Impediments to retraction: for the Hanafis, the thing''s destruction, its passing out of the donee''s hands, a joined increase, a return, kinship, marriage, alms, the death of either party, or change in the thing; for the Malikis, an increase or decline, a debt contracted on account of the gift, or the donee''s illness; for the Shafi''is, leaving the donee''s control; for the Hanbalis, leaving his ownership, others'' interest in it, or an increase. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16802} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16803} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16806} A retraction is a dissolution for the Hanafis when made by judgment or by mutual consent (Zufar holds consent a new gift); the retracted thing returns to the donor, and the donee who holds it after retraction is not liable unless he exceeded. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16807} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16807}'
