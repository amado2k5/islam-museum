id: concept/hiba-fiqh
class: concept
kind: legal
label:
  ar: هِبَة
  en: 'Hiba (gift: its pillars, the parties, the thing given and possession)'
summary:
  ar: 'الهبة في اللغة إعطاء الشيء إلى الغير بلا عوض، سواء كان مالاً أو غير مال، وفي الاصطلاح تمليك المال بلا عوض في الحال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16772} وتفترق عن العطية الأعم، وعن الهدية في أن الهبة يلزم فيها القبول عند أكثر الفقهاء، وعن الصدقة في أن الصدقة تُطلب بها الآخرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16772} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16773} وهي مشروعة بالكتاب والسنة والإجماع، ومندوبة بالإجماع، وتحرم إذا قصد بها معصية أو إعانة على ظلم أو رشوة، وتكره إذا قصد بها الرياء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16773} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16774} وأركانها عند الجمهور العاقدان والمعقود عليه والصيغة، وعند الحنفية الصيغة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16774} ويشترط في الواهب أن يكون من أهل التبرع، فلا تصح هبة الصغير والمجنون، وتختلف المذاهب في المحجور بدين أو سفه، وفي هبة المريض مرض الموت فيما زاد على الثلث، وفي هبة الأب مال ابنه الصغير بعوض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16774} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16775} وتختلف المذاهب في هبة الفضولي فهي عند الجمهور باطلة، وعند الحنفية موقوفة على الإجازة، وفي هبة السكران تفصيل بين المباح والمحرم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16776} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16777} ويشترط في الموهوب أن يكون موجوداً مملوكاً للواهب متقوماً، فلا تصح هبة المعدوم والمجهول عند الجمهور، وأجاز المالكية هبة ما يقبل النقل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16780} وفي هبة الدين لغير من هو عليه خلاف، وفي هبة المشاع تفصيل: فالجمهور تجيزه، والحنفية لا تجيز المشاع القابل للقسمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16780} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16781} واختلف الفقهاء في اشتراط القبض لتمام الهبة: فالحنفية والشافعية وبعض الحنابلة يشترطونه، وقول للحنابلة يصحح العقد بلا قبض ويلزمه القبض، والمالكية يرون الهبة لازمة بالعقد وإن لم تقبض، وخلاف في الهبة بلا قبض لما يكال ويوزن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16782} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16783}'
  en: 'Hiba in the lexical sense is giving a thing to another without return, whether money or not; technically it is the transfer of property without return at once. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16772} It differs from the wider atiyya, from hadiyya in that most jurists require acceptance in a gift, and from sadaqa, which seeks reward in the hereafter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16772} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16773} Gifts are lawful by the Qur''an, the sunna and consensus, and recommended by consensus; they are forbidden when meant for sin, aid to wrongdoing or bribery, and disliked when meant for show. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16773} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16774} The pillars are, for the majority, the two parties, the thing given and the formula; for the Hanafis only the formula. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16774} The donor must be competent to give: a minor or insane person cannot give, and the schools differ on the debt-bound and the feeble-minded, on the gift of a dying man beyond a third, and on a father''s gift of his minor son''s property for a return. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16774} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16775} The schools differ on an unauthorized donor''s gift: most hold it void, the Hanafis hold it suspended on approval; a drunkard''s gift depends on whether the drink was lawful. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16776} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16777} The thing given must exist, be owned by the donor and be of value: the majority do not allow the gift of a non-existent or unknown thing, while the Malikis allow what can be moved. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16780} The schools differ on giving a debt to one other than the debtor and on giving an undivided share: the majority allow the latter; the Hanafis forbid an undivided share that can be divided. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16780} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16781} On whether possession is needed for the gift to complete: the Hanafis, Shafi''is and one Hanbali view require it; another Hanbali view and the Malikis hold the gift binding by the contract, and Abu Thawr so holds. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16782} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16783}'
