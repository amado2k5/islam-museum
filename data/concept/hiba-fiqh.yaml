id: concept/hiba-fiqh
class: concept
kind: legal
tags: [akhlaq-browser, akhlaq-hiba]
label:
  ar: هِبَة
  en: 'Hiba (gift: its pillars, the parties, the thing given, possession, return and conditions)'
  es: "Hiba (regalo: sus pilares, las partes, el objeto entregado, la posesión, la devolución y las condiciones)"
  fr: "Hiba (don: ses piliers, les parties, la chose donnée, la possession, le retour et les conditions)"
  ur: "ہبہ ⁦(تحفہ: اس کے ستون، فریق، دی گئی چیز، قبضہ، واپسی اور شرائط)⁩"
  tr: "Hiba"
  id: "Hiba"
summary:
  ar: 'الهبة في اللغة إعطاء الشيء إلى الغير بلا عوض، وفي الاصطلاح تمليك المال بلا عوض في الحال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16772} وتفترق عن العطية الأعم، وعن الهدية بأن القبول يلزم فيها عند أكثر الفقهاء، وعن الصدقة التي يُطلب بها ثواب الآخرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16772} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16773} وهي مشروعة بالكتاب والسنة والإجماع، ومندوبة، وتحرم إذا قُصد بها معصية أو إعانة على ظلم أو رشوة، وتكره إذا قُصد بها الرياء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16773} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16774} وأركانها عند الجمهور العاقدان والمعقود عليه والصيغة، وعند الحنفية الصيغة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16774} ويشترط في الواهب أهلية التبرع، فلا تصح هبة الصغير والمجنون، وتختلف المذاهب في المحجور عليه بدين أو سفه، وفي هبة المريض مرض الموت فيما زاد على الثلث، وفي هبة الأب مال ابنه بعوض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16774} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16775} وفي هبة الفضولي عند الجمهور بطلان، وعند الحنفية وقف على الإجازة، وفي هبة السكران تفصيل بين المباح والمحرم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16776} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16777} ويشترط في الموهوب أن يكون موجوداً مملوكاً للواهب متقوماً، فلا تصح هبة المعدوم والمجهول عند الجمهور، وأجاز المالكية هبة ما يقبل النقل. وتختلف المذاهب في هبة الدين لغير من هو عليه وفي هبة المشاع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16780} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16781} وتختلف المذاهب في القبض: فالحنفية والشافعية وبعض الحنابلة يشترطونه، والمالكية يرون الهبة لازمة بالعقد، وفي قول للحنابلة تصح بلا قبض. ويشترط الحنفية إذن الواهب، وألا يكون الموهوب مشغولاً بما ليس موهوباً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16782} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16783} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16785} والإيجاب وحده ركن الهبة عند الحنفية، والإيجاب والقبول عند الجمهور؛ ويصح القبول بالفعل، ويجوز تراخيه عند المالكية والحنابلة، ولا يصح تعليق الهبة عند الحنفية والشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16788} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16789} وتختلف المذاهب في الشرط المقترن بالهبة: فالجمهور يبطلون الشرط الفاسد ويصحون الهبة، والمالكية والشافعية والحنابلة في وجه يبطلون الشرط والعقد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16789} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16790} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16791} وفي الهبة بشرط العوض يختلف الفقهاء في صحته: فالجمهور يصححونه، والشافعية في مقابل الأظهر والحنابلة في قول يبطلونه؛ وفي تكييفها: بيع عند المالكية والشافعية والحنابلة في المذهب وزفر، وهبة ابتداء بيع انتهاء عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16792} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16793} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16794} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16795} وفي لزوم العوض بغير اشتراط: الحنفية والشافعية والحنابلة في المذهب لا يوجبونه إلا بالتصريح، والمالكية والحنابلة في قول يوجبونه بالعرف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16796} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16797} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16798} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16799} وتمام الهبة بقبض الموهوب عند الجمهور، والمالكية يرون الملك بالعقد وهو الأصل عند الحنابلة فيما لا يكال ولا يوزن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16799} والرجوع في الهبة: لا يجوز عند المالكية والحنابلة في المذهب والشافعية في مقابل المشهور إلا للأب فيما وهب لولده، وألحق المالكية الأم وسائر الأصول، وأجاز الحنفية الرجوع مع الكراهة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16801} ومنع الحنفية الرجوع بهلاك الموهوب أو خروجه عن الملك أو الزيادة المتصلة أو وجود العوض أو صلة الرحم المحرم أو الزوجية أو الصدقة أو موت أحد المتعاقدين أو تغيره، ومنعه المالكية بزيادة الشيء أو نقصه أو المداينة لأجل الهبة أو مرض الولد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16802} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16803} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16804} ومنعه الشافعية بخروج الشيء عن سلطنة الولد، ومنعه الحنابلة بخروجه عن ملكه أو رغبة الغير فيه أو زيادته، وأجازوا للمرأة الرجوع في صداقها عند بعض الروايات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16806} والرجوع فسخ عند الحنفية إذا كان بالتقاضي أو بالتراضي عند غير زفر، وهو هبة مبتدأة عند زفر في التراضي. ويعود الشيء إلى ملك الواهب، وإذا هلك في يد الموهوب له بعد الرجوع لم يضمن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16807} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16807}'
  en: 'Hiba in the lexical sense is giving a thing to another without return; technically it is transferring property without return at once. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16772} It differs from the wider atiya, from hadiya in that most jurists require acceptance in a gift, and from sadaqa, which seeks reward in the hereafter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16772} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16773} Gifts are lawful by the Qur''an, the sunna and consensus, recommended, forbidden when meant for sin, aid to wrongdoing or bribery, and disliked when meant for show. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16773} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16774} The pillars are, for most jurists, the two parties, the thing given and the formula; for the Hanafis only the formula. The donor must be competent; the schools differ on the debt-bound, the feeble-minded, a dying man''s gift beyond a third, and a father''s gift of his son''s property for a return. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16774} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16775} The gift of an unauthorized donor is void for most, suspended on approval for the Hanafis; a drunkard''s gift depends on whether the drink was lawful. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16776} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16777} The thing given must exist, be owned by the donor and have value; most jurists disallow gifts of the non-existent or unknown, while the Malikis allow what can be moved. The schools differ on giving a debt to a third party and on an undivided share. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16780} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16781} On possession: the Hanafis, Shafi''is and one Hanbali view require it, with donor''s leave and no encumbrance; the Malikis hold the gift binding by the contract, and a Hanbali view accepts an unpossessed gift of what is not measured. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16782} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16783} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16785} On the formula: the Hanafis count the offer alone as the pillar, the majority the offer and acceptance; acceptance may be by act; delayed acceptance is allowed by the Malikis and Hanbalis; a conditional gift is refused by the Hanafis, Shafi''is and Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16788} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16789} Conditions attached to a gift: the majority void an invalid condition and keep the gift; the Malikis, Shafi''is and one Hanbali view void both. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16790} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16791} A gift for a return: most jurists allow it, the Shafi''is in the weaker view and one Hanbali view forbid it; its nature is a sale by the Malikis, Shafi''is and Hanbalis, and a gift begun and sale completed by the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16792} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16793} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16794} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16795} Whether a return is due without stipulation: the Hanafis, Shafi''is and the Hanbali school do not require it except by statement; the Malikis and one Hanbali view require it by custom. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16796} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16797} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16798} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16799} Retraction: the majority forbid it except for the father in his son''s gift; the Malikis extend it to the mother and ascendants; the Hanafis allow it with disapproval. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16801} Impediments to retraction: for the Hanafis, the thing''s destruction, its passing out of the donee''s hands, a joined increase, a return, kinship, marriage, alms, the death of either party, or change in the thing; for the Malikis, an increase or decline, a debt contracted on account of the gift, or the donee''s illness; for the Shafi''is, leaving the donee''s control; for the Hanbalis, leaving his ownership, others'' interest in it, or an increase. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16802} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16803} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16806} A retraction is a dissolution for the Hanafis when made by judgment or by mutual consent (Zufar holds consent a new gift); the retracted thing returns to the donor, and the donee who holds it after retraction is not liable unless he exceeded. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16807} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16807}'
  es: "Hiba en el sentido léxico es dar algo a otro sin recibir nada a cambio; técnicamente es transferir propiedad sin recibir nada a cambio de inmediato. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16772} Se diferencia de la atiya más amplia, de hadiya en que la mayoría de los juristas requieren aceptación en un regalo, y de sadaqa, que busca recompensa en el más allá. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16772} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16773} Los regalos son lícitos según el Corán, la sunna y el consenso, recomendados, prohibidos cuando se pretenden para el pecado, la ayuda a la mala acción o el soborno, y desaconsejados cuando se pretenden para ostentar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16773} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16774} Los pilares son, para la mayoría de los juristas, las dos partes, la cosa dada y la fórmula; para los Hanafi solo la fórmula. El donante debe ser competente; las escuelas difieren en cuanto a los endeudados, los débiles mentales, el donativo de un moribundo más allá de un tercio, y el donativo de un padre de la propiedad de su hijo a cambio de una contraprestación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16774} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16775} El donativo de un donante no autorizado es nulo para la mayoría, suspendido con aprobación para los Hanafi; el donativo de un borracho depende de si la bebida era lícita. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16776} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16777} La cosa donada debe existir, ser propiedad del donante y tener valor; la mayoría de los juristas no permiten donaciones de lo inexistente o desconocido, mientras que los malikíes permiten lo que se puede trasladar. Las escuelas difieren en cuanto a la transmisión de una deuda a un tercero y en cuanto a una participación indivisa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16780} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16781} Sobre la posesión: los Hanafis, Shafi'is y una visión Hanbali la requieren, con permiso del donante y sin gravamen; los Malikis sostienen que el donativo es vinculante por contrato, y una visión Hanbali acepta un donativo no poseído de lo que no se mide. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16782} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16783} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16784} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16785} Sobre la fórmula: los Hanafis cuentan solo la oferta como el pilar, la mayoría la oferta y la aceptación; la aceptación podrá ser por acto; los Malikis y Hanbalis permiten la aceptación retrasada; Los Hanafis, Shafi'is y Hanbalis rechazan un regalo condicional. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16786} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16787} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16788} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16789} Condiciones adjuntas a un regalo: la mayoría anula una condición inválida y conserva el regalo; las opiniones de los malikis, los shafi'is y los hanbali anulan ambas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16790} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16791} Un regalo a cambio de algo: la mayoría de los juristas lo permiten, los shafi'ís en la opinión más débil y una opinión hanbalí lo prohíben; su naturaleza es una venta por parte de los malikíes, shafi'ís y hanbalíes, y un regalo iniciado y una venta completada por los hanafíes. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16792} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16793} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16794} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16795} Si se debe devolver sin estipulación: las escuelas Hanafis, Shafi'is y Hanbali no lo exigen excepto mediante declaración; los Malikis y una vista Hanbali lo requieren por costumbre. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16796} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16797} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16798} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16799} Retracción: la mayoría lo prohíbe excepto el padre en la donación de su hijo; los Malikis lo extienden a la madre y a los ascendientes; los hanafis lo permiten con desaprobación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16801} Impedimentos para la retractación: para los Hanafis, la destrucción de la cosa, su salida de las manos del donatario, un aumento conjunto, una devolución, parentesco, matrimonio, limosna, la muerte de cualquiera de las partes o un cambio en la cosa; para los Malikis, un aumento o disminución, una deuda contraída a causa de la donación o la enfermedad del donatario; para los Shafi'is, dejar el control del donatario; para los Hanbalis, dejar su propiedad, el interés de otros en ella o un aumento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16802} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16803} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16806} Una retractación es una disolución para los Hanafi cuando se realiza por juicio o por consentimiento mutuo (Zufar considera el consentimiento como un nuevo donativo); la cosa retractada regresa al donante, y el donatario que la posee después de la retractación no es responsable a menos que haya excedido. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16807} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16807}"
  fr: "Le terme « hiba », au sens littéral, désigne le don d'une chose à autrui sans contrepartie; techniquement, il s'agit d'un transfert de propriété immédiat et sans contrepartie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16772} Il se distingue de l'« atiya », terme plus général, de la « hadiya » (don en ce que la plupart des juristes exigent une acceptation), et de la « sadaqa » (don en échange d'une récompense dans l'au-delà). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16772} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16773} Les dons sont licites selon le Coran, la Sunna et le consensus, recommandés, interdits lorsqu'ils sont destinés à commettre un péché, à encourager le mal ou à corrompre, et déconseillés lorsqu'ils sont faits par ostentation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16773} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16774} Pour la plupart des juristes, les piliers sont les deux parties, le bien donné et la formule; pour les hanafites, seule la formule compte. Le donateur doit être capable; les écoles divergent quant au cas du donateur endetté, du donateur incapable, du don d'un mourant au-delà d'un tiers, et du don par un père des biens de son fils en contrepartie d'une contrepartie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16774} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16775} Le don d'un donateur non autorisé est nul pour la plupart des écoles, suspendu jusqu'à approbation pour les hanafites; le don d'un ivrogne dépend de la licéité de l'alcool consommé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16776} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16777} Le bien donné doit exister, appartenir au donateur et avoir une valeur; la plupart des juristes interdisent les dons de biens inexistants ou inconnus, tandis que les Malikites autorisent les biens meubles. Les écoles divergent quant au remboursement d’une dette à un tiers et à la transmission d’une part indivise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16780} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16781} Concernant la possession: les écoles hanafite, chaféite et une école hanbalite l’exigent, avec l’accord du donateur et sans charge; les malikites considèrent le don comme contraignant en vertu du contrat, et une école hanbalite accepte un don sans possession de ce qui n’est pas mesuré. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16782} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16783} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16785} Sur la formule: les Hanafis considèrent seule l'offre comme le pilier, la majorité l'offre et l'acceptation; l'acceptation peut se faire par un acte; l'acceptation différée est autorisée par les Malikis et les Hanbalis; un cadeau conditionnel est refusé par les Hanafis, les Shafi'is et les Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16788} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16789} Conditions attachées à un cadeau: la majorité annule une condition invalide et conserve le cadeau; les Malikis, Shafi'is et une vision Hanbali annulent les deux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16790} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16791} Un don contre contrepartie: la plupart des juristes l’autorisent, les Shafi’ites dans l’avis le plus faible et un avis Hanbalite l’interdisent; sa nature est une vente selon les Malikites, les Shafi’ites et les Hanbalites, et un don commencé et une vente achevée selon les Hanafites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16792} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16793} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16794} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16795} Si un retour est dû sans stipulation: les Hanafis, les Shafi'is et l'école Hanbali ne l'exigent que par déclaration; les Malikis et une vision Hanbali l'exigent par coutume. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16796} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16797} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16798} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16799} Rétractation: la majorité l'interdit sauf pour le père dans la donation de son fils; les Malikis l'étendent à la mère et aux ascendants; les Hanafis le permettent avec désapprobation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16801} Empêchements de rétractation: pour les Hanafites, la destruction de la chose, sa sortie des mains du donataire, un accroissement conjoint, un retour, la parenté, le mariage, l’aumône, le décès de l’une ou l’autre des parties, ou un changement dans la chose; pour les Malikites, un accroissement ou une diminution, une dette contractée en raison du don, ou la maladie du donataire; pour les Shafi’ites, la perte du contrôle du donataire; pour les Hanbalites, la perte de sa propriété, les intérêts d’autrui sur celle-ci, ou un accroissement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16802} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16803} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16806} Pour les Hanafites, une rétractation entraîne la dissolution du don lorsqu'elle est effectuée par jugement ou par consentement mutuel (Zufar considère le consentement comme un nouveau don); le bien rétracté retourne au donateur, et le donataire qui le détient après la rétractation n'est pas responsable, sauf s'il a dépassé le montant dû. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16807} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16807}"
  ur: "حبا لغوی معنوں میں کسی چیز کو بغیر واپسی کے دینا ہے۔ تکنیکی طور پر یہ ایک ساتھ واپسی کے بغیر جائیداد کی منتقلی کر رہا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 16772} یہ وسیع عطیہ سے مختلف ہے، حدیث سے اس میں کہ اکثر فقہاء ہدیہ میں قبولیت کا تقاضا کرتے ہیں، اور صدقہ سے جو آخرت میں اجر طلب کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16772} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16773} تحفے قرآن، سنت اور اجماع کے مطابق حلال ہیں، مستحب، حرام ہیں جب گناہ کرنے کے لیے ہوں، اور جب گناہ کرنے کے لیے ہوں، اور جب گناہ کرنا ہوں تو ناپسندیدہ ہوں۔ دکھائیں {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.16773} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16774} ستون، زیادہ تر فقہا کے نزدیک، دو فریق ہیں، دی گئی چیز اور فارمولہ؛ احناف کے لیے صرف فارمولا ہے۔ عطیہ کرنے والا اہل ہونا چاہیے؛ مکاتب میں مقروض، کمزور دماغ، مرتے ہوئے آدمی کا ایک تہائی سے زیادہ کا تحفہ، اور واپسی کے لیے باپ کے بیٹے کی جائیداد کے تحفے پر اختلاف ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16774} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16775} غیر مجاز عطیہ دہندہ کا تحفہ اکثر کے لیے باطل ہے، احناف کی منظوری پر معطل ہے۔ شرابی کا تحفہ اس بات پر منحصر ہے کہ آیا وہ مشروب حلال تھا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16776} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16777} دی گئی چیز موجود ہونی چاہیے، عطیہ دینے والے کی ملکیت ہونی چاہیے اور اس کی قیمت ہونی چاہیے۔ زیادہ تر فقہا غیر موجود یا نامعلوم کے تحفے کو مسترد کرتے ہیں، جبکہ مالکی اجازت دیتے ہیں کہ کیا منتقل کیا جا سکتا ہے۔ تیسرے فریق کو قرض دینے اور غیر منقسم حصے پر اسکولوں میں اختلاف ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16778} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16779} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16780} ص16781} قبضے کے بارے میں: حنفیہ، شافعی اور ایک حنبلی کے نزدیک عطیہ دینے والے کی رخصت اور کوئی بوجھ نہیں ہے۔ مالکی عقد کے مطابق تحفہ کو پابند کرتے ہیں، اور حنبلی نظریہ اس چیز کو قبول کرتا ہے جس کی پیمائش نہیں کی جاتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16782} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16783} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16784} ص16785} فارمولے پر: احناف صرف پیشکش کو ستون شمار کرتے ہیں، اکثریت پیشکش اور قبولیت کو۔ قبولیت عمل سے ہو سکتی ہے۔ مالکیوں اور حنبلیوں میں تاخیر سے قبولیت کی اجازت ہے۔ احناف، شافعی اور حنبلی حضرات مشروط تحفہ سے انکار کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16786} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16787} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16788} p.16789} تحفہ کے ساتھ منسلک شرائط: اکثریت ایک ناجائز شرط کو باطل کرتی ہے اور تحفہ اپنے پاس رکھتی ہے۔ مالکیہ، شافعی اور ایک حنبلی دونوں کا قول باطل ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16790} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16791} واپسی کا تحفہ: اکثر فقہاء اس کی اجازت دیتے ہیں، شافعیہ کمزور نظریہ میں ہیں اور ایک حنبلی اس سے منع کرتے ہیں۔ اس کی نوعیت مالکیوں، شافعیوں اور حنبلیوں کی طرف سے فروخت کی ہے، اور حنفیوں کی طرف سے شروع کردہ اور فروخت مکمل ہونے والا تحفہ ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16792} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص.16793} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16794} ص16795} آیا واپسی شرط کے بغیر واجب ہے: حنفیہ، شافعی اور حنبلی مکتب اس کی ضرورت نہیں سوائے بیان کے۔ مالکیہ اور ایک حنبلی کا قول حسب ضرورت اس کا تقاضا کرتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16796} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ16797} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16798} ص16799} رجوع: اکثریت اسے منع کرتی ہے سوائے باپ کے بیٹے کے تحفے میں۔ مالکی اسے ماں اور اولاد تک دیتے ہیں۔ احناف اس کی اجازت ناپسندیدگی کے ساتھ دیتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 16800} {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 16801} رجوع میں رکاوٹیں: احناف کے نزدیک چیز کا فنا ہونا، اس کا عطیہ کرنے والے کے ہاتھ سے نکل جانا، نکاح کا بڑھ جانا، شادی کا بڑھنا، شادی کا بڑھ جانا۔ یا تو پارٹی، یا چیز میں تبدیلی؛ مالکیوں کے لیے، اضافہ یا کمی، تحفہ یا عطیہ کرنے والے کی بیماری کی وجہ سے قرض۔ شافعیوں کے لیے، عطیہ کرنے والے کے اختیار کو چھوڑنا؛ حنبلیوں کے لیے، اپنی ملکیت چھوڑنا، دوسروں کی اس میں دلچسپی، یا اضافہ۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16802} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16803} p.16805} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.16806} رجوع کرنا احناف کے لیے ایک تحلیل ہے جب فیصلہ یا باہمی رضامندی سے کیا جائے ⁦(ظفر کے پاس رضامندی ایک نیا تحفہ ہے)⁩؛ واپس لینے والی چیز عطیہ کرنے والے کو واپس کردی جاتی ہے، اور عطیہ کرنے والا ذمہ دار نہیں ہے جو واپس لینے کے بعد اسے رکھتا ہے جب تک کہ وہ حد سے زیادہ نہ ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16807}"
  tr: "Dilbilimde, bir hediye, bir şeyi başkasına karşılıksız vermektir; terminolojide ise paranın mülkiyetinin hemen karşılıksız devridir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16772} Genel hediyeden ve hediyeden farklıdır; çoğu hukukçuya göre kabul zorunludur ve öteki Ahiret için ödül arayan hayırseverlikten farklıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16772} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16773} Kur'an, Sünnet ve konsensüsle yasalaştırılmış, günah için, baskı veya rüşvet için kullanılıyorsa tavsiye edilir ve yasaktır; gösteriş amaçlı ise sevilmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16773}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16774} ve sütunları, sözleşmeli ve sözleşmeli tarafların çoğunluğuna ve formüle ve Hanefilere göre formüle göre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16774} Bağışçı bağış yapmaya uygun olmalıdır, bu nedenle reşit olmayan veya akıl hastasının bağışı geçerli değildir. Okullar, borç veya aptallık nedeniyle vasi altındaki kişi, hastalık nedeniyle üçte birden fazla hasta hediyesi ve babanın oğluna tazminat olarak hediye edilmesi konusunda farklılıklar bildirir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16774} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16775} Hibah al-Fuduli'de çoğunluğa göre geçersizdir, ancak Hanefi okuluna göre ijaze üzerine kuruludur ve Hibah al-Sadran'da neyin izin verildiğiyle neyin yasak olduğu arasında ayrıntılı bir ayrım vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16776} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16777} Hediye edilen eşyanın bağışçıya ait ve dik olması gerekir; bu nedenle var olmayan ve bilinmeyen hediye çoğunluk tarafından geçerli değildir ve Malikiler devredilemeyen hediyelere izin verir. Okullar, borçlu olanlar dışında birine verilen borç ve ortak sahiplerden gelen hediyeler konusunda farklılık gösterir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16780} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16781} Okullar mülkiyet konusunda farklılık gösterir: Hanefiler, Şafiiler ve bazı Hanbaliler bunu zorunlu kılarken, Malikiler hediyeyi sözleşmeyle bağlayıcı sayar ve Hanbali'ye göre mülkiyet olmadan geçerlidir. Hanefiler bağışçının iznini gerektirir ve bağışçı hediye edilmemiş hiçbir şeyle meşgul olmamalıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16782} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16783} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16785} Hanefilere göre yalnızca teklif armağanın direğidir ve çoğunluğa göre kabul ve kabul; kabul eylemle geçerlidir, ancak Maliki ve Hanbali'ye göre hoşgörülü olmak caizdir ve Hanefiler, Şafi'ler ve Hanbalilere göre hediyenin askıya alınması geçerli değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16787}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16788} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16789} Okullar hediyeyle ilgili koşul konusunda farklılık gösterir: çoğunluk geçersiz koşulu iptal eder ve hediyeyi geçersiz kılar, Malikiler, Şafi'ler ve Hanbaliler ise koşulun ve sözleşmenin geçersizliğine karşı çıkar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16789} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16790} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16791} Tazminat şartı verilen bir hediye konusunda hukukçular geçerliliği konusunda farklı görüşe sahiptir: çoğunluk bunu düzeltirken, Şafi'ler daha belirgin ve Hanbali görüşlerinden farklı olarak reddederler; sınıflandırmada: Hanefilere göre Maliki, Şafiî ve Hanbali'lere göre satış, Hanefi'lere göre ise satışın başında yapılan satıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16792} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16793} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16794} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16795} Ve koşulsuz tazminat yükümlülüğü konusunda: Hanefi, Şafii ve Hanbali mezhebleri bunu yalnızca açıkça talep ederken, Maliki ve Hanbaliler bunu gelenek gereği zorunlu kıldıklarını savunur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16796}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16797} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16798} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16799} Hediyenin tamamlanması, hediye edilen eşyanın çoğunluğa göre alınmasıyla yapılır; Malikiler ise mülkiyeti sözleşme yoluyla görür; bu, Hanbalilere göre ölçülemeyen ve ağırlıksız madde konusunda varsayılan durumdur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16799} Hediyeye geri dönersek: Malikiler, Hanbaliler ve Şafi'lere göre, babanın çocuğuna hediye edildiği bilinen durum dışında, düşünce okulunda izin verilmez. Malikiler anneye ve diğer ilkelere atfederken, Hanafiler ise hoşnutsuzlukla başvuruya izin verdiler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16801} Ve Hanafiler, hediye edilen kişinin ölümü üzerine, mülkiyetten ayrılmalarını, sürekli eklemeyi, tazminatın varlığını yapmasını, yasaklanan aile bağlarını, evlilik, hayırseverlik, taraflardan birinin ölümü veya değişimini ve Maliki yasağını bir şeyin artırılması veya azaltılması, hediye veya çocuğun hastalığı için borçlanmanın önüne geçerler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16802} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16803} {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.16804} Şafi'ler çocuğun otoritesinden ayrılarak bunu yasaklamış, Hanbalılar ise onun mülkiyetini veya başkalarının arzusunu ya da artmasını bırakarak yasaklamıştır. Bazı rivayetler ayrıca bir kadının çeyizini geri çekmesine izin vermiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16806} ve iptal, Hanefi'ye göre dava yoluyla veya karşılıklı anlaşmayla değilse karşılıklı anlaşmayla iptal edilir ve karşılıklı anlaşma olduğunda karşılıklı anlaşmayla başlatılan bir hediyedir. Eşya bağışçının mülküne geri döner ve geri döndükten sonra bağışçının elinde ölürse garanti edilmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16807} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16807}"
  id: "Dalam linguistik, hadiah adalah memberikan sesuatu kepada orang lain tanpa kompensasi, dan dalam istilah itu, itu adalah transfer kepemilikan uang tanpa kompensasi secara langsung. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16772} Ini berbeda dari hadiah umum dan dari hadiah karena penerimaan adalah kewajiban menurut sebagian besar ahli hukum, dan dari amal yang melalui mana seseorang mencari ganjaran untuk akhirat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16772} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16773} Ini diatur oleh Al-Qur'an, Sunnah, dan konsensus, direkomendasikan, dan dilarang jika dimaksudkan untuk dosa atau membantu penindasan atau suap, dan tidak disukai jika dimaksudkan untuk pamer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16773} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16774} dan pilar-pilarnya menurut mayoritas pihak yang dikontrak dan dikontrak serta rumusnya, dan menurut Hanafi, rumusnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16774} Donatur harus memenuhi syarat untuk mendonorkan, jadi hadiah untuk anak di bawah umur atau orang gila tidak sah. Sekolah berbeda mengenai orang yang berada di bawah perwalian karena utang atau kebodohan, hadiah orang sakit karena sakit lebih dari sepertiga, dan hadiah ayah kepada anaknya sebagai kompensasi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16774} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16775} Di Hibah al-Fuduli menurut mayoritas hal ini tidak sah, tetapi menurut mazhab Hanafi ia berdiri di atas ijazah, dan di Hibah al-Sadra terdapat perbedaan rinci antara apa yang diperbolehkan dan yang dilarang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16776} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16777} Diwajibkan agar barang yang diberikan hadir, dimiliki oleh pemberi dan berdiri tegak, sehingga hadiah dari yang tidak ada dan tidak diketahui tidak sah menurut mayoritas, dan Malikis mengizinkan hadiah yang tidak dapat dipindahkan. Aliran berbeda pendapat mengenai hadiah hutang kepada orang lain selain yang berhutang dan hadiah dari pemilik bersama. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16780} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16781} Aliran berbeda dalam hal kepemilikan: Hanafi, Shafi'i, dan beberapa Hanbal membutuhkannya, sementara Malili menganggap hadiah itu mengikat melalui kontrak, dan menurut Hanbali, hadiah itu sah tanpa kepemilikan. Hanafi memerlukan izin dari pemberi, dan pemberi tidak boleh ditempati dengan apa pun yang bukan hadiah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16782} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16783} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16785} Tawaran saja adalah pilar anugerah menurut Hanafi, dan penerimaan serta penerimaan menurut mayoritas; penerimaan berlaku berdasarkan tindakan, tetapi diperbolehkan bersikap lunak menurut Maliki dan Hanbali, dan menangguhkan hadiah tidak sah menurut Hanafi, Shafi'i, dan Hanbali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16788} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16789} Aliran berbeda pendapat mengenai syarat yang terkait dengan hadiah: mayoritas membatalkan syarat tidak sah dan mengesahkan pemberian, sementara Maliki, Shafi'i, dan Hanbal menentang ketidakabsahan kondisi dan kontrak tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16789} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16790} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16791} Mengenai hadiah dengan syarat kompensasi, para ahli hukum berbeda pendapat tentang keabsahannya: mayoritas mengoreksinya, sementara Shafi'i berbeda dari pendapat yang lebih jelas dan Hanbali bahwa mereka menolaknya; dan dalam klasifikasinya: penjualan menurut Maliki, Shafi'i, dan Hanbal dalam aliran pemikiran, dan hadiah adalah penjualan di awal penjualan menurut Hanafi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16792} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16793} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16794} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16795} Dan mengenai kewajiban kompensasi tanpa syarat: aliran pemikiran Hanafi, Shafi'i, dan Hanbali tidak mewajibkannya kecuali secara eksplisit, sementara Malikis dan Hanbal berpendapat bahwa mereka mewajibkannya berdasarkan adat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16796} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16797} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16798} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16799} Penyelesaian hadiah dilakukan dengan menerima barang yang diberikan sesuai mayoritas, sementara Malikis memandang kepemilikan melalui kontrak, yang menurut Hanbal adalah default terkait materi yang tidak terukur dan tidak berbobot. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16799} Kembali ke hadiah: Menurut Maliki, Hanbali, dan Shafi'i, hal ini tidak diperbolehkan dalam aliran pemikiran kecuali dalam kasus terkenal mengenai ayah dalam apa yang diberikan kepada anaknya. Keluarga Malik mengaitkan ibu dengan prinsip lain, dan Hanafi mengizinkan penggunaan dengan ketidaksukaan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16801} Dan Hanafi mencegah pemilu atas kematian orang berbakat, kepergian dari kepemilikan, penambahan terus-menerus, keberadaan kompensasi, ikatan keluarga terlarang, pernikahan, amal, kematian atau perubahan salah satu pihak yang berkontrak, dan larangan Maliki dengan menambah atau mengurangi sesuatu, atau berutang demi hadiah atau penyakit anak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16802} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16803} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16804} Shafi'i melarangnya dengan melepaskan otoritas anak, dan Hanbalis melarangnya dengan melepaskan kepemilikan, keinginan, atau peningkatan orang lain. Beberapa narasi juga mengizinkan seorang wanita menarik kembali mas kawinnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16806} dan pencabutan dibatalkan menurut Hanafi jika dilakukan melalui litigasi atau kesepakatan bersama jika bukan kesepakatan bersama, dan itu adalah hadiah yang dimulai atas kesepakatan bersama ketika itu adalah kesepakatan bersama. Barang tersebut kembali ke properti donor, dan jika meninggal di tangan pemberi setelah dikembalikan, maka tidak dijamin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16807} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16807}"
