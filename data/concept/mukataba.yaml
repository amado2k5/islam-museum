label: { ar: "المُكَاتَبَة", en: "Contract of manumission by instalments (mukataba)", ur: "مُکاتَبہ ⁦(قسطوں پر آزادی کا معاہدہ)⁩", es: "Contrato de manumisión a plazos (mukataba)", fr: "Contrat d'affranchissement par versements (mukataba)", tr: "Yazışmalar", id: "Korespondensi" }
summary:
  ar: "المكاتبة معاقدة بين العبد وسيده على مال منجَّم يعتق العبد بأدائه، وهي تعليق للعتق بصفة على معاوضة مخصوصة. كانت معروفة في الجاهلية فأقرها الإسلام، واستدل الفقهاء عليها بقوله تعالى في سورة النور. وجمهور الفقهاء على ندبها، وذهب عكرمة وعطاء ومسروق وعمرو بن دينار إلى وجوبها إذا طلبها العبد. وأركانها المولى والعبد والصيغة والعوض، واختلف الفقهاء في البلوغ والصيغة والعوض المؤجل، ويعان المكاتب على الأداء من الزكاة. وإذا أدى ما عليه عتق، وكان ولاؤه لمولاه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14923} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14924} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14925}"
  en: "A mukataba is a contract between a slave and his master in which the slave is freed on paying a sum due in instalments; it attaches manumission to a condition within a specific exchange. It was known before Islam and Islam kept it, the jurists citing the Qur'an in Surat al-Nur. Most jurists hold it recommended; Ikrima, 'Ata', Masruq and 'Amr ibn Dinar held it obligatory when the slave asks. Its pillars are the master, the slave, the formula and the consideration. The jurists differ on the slave's majority, on the formula and on deferred consideration. The paid-up slave is freed and his walā' goes to his former master, and he may be aided from zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14923} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14924} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14925}"
  ur: "مُکاتَبہ غلام اور آقا کے درمیان قسطوں میں مال کی ادائیگی پر آزادی کا معاہدہ ہے۔ جمہور کے نزدیک یہ مستحب ہے، جب کہ بعض تابعین کے نزدیک غلام کے مطالبے پر واجب ہے۔ غلام ادائیگی کر دے تو آزاد ہو جاتا ہے اور اس کی ولاء آقا کو ملتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14923} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14925}"
  es: "Un mukataba es un contrato entre un esclavo y su amo en el que el esclavo es liberado al pagar una suma a plazos; la manumisión está supeditada a una condición dentro de un intercambio específico. Era conocido antes del Islam y el Islam lo conservó, citando los juristas el Corán en la Sura al-Nur. La mayoría de los juristas lo consideran recomendable; Ikrima, 'Ata', Masruq y 'Amr ibn Dinar lo consideraban obligatorio cuando el esclavo lo solicita. Sus pilares son el amo, el esclavo, la fórmula y la contraprestación. Los juristas difieren en cuanto a la mayoría de edad del esclavo, la fórmula y la contraprestación diferida. El esclavo que ha pagado queda liberado y su walā' (limosna) pasa a su antiguo amo, pudiendo recibir ayuda del zakat (limosna obligatoria). {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14922} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14923} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14924} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14925}"
  fr: "La mukataba est un contrat entre un esclave et son maître, par lequel l'esclave est affranchi moyennant le paiement d'une somme due en plusieurs versements; elle conditionne l'affranchissement à un échange spécifique. Ce contrat existait avant l'islam et a été maintenu par l'islam, les juristes se référant au Coran, notamment à la sourate An-Nur. La plupart des juristes le recommandent; Ikrima, Ata, Masruq et Amr ibn Dinar le considèrent comme obligatoire lorsque l'esclave en fait la demande. Ses piliers sont le maître, l'esclave, la formule et la contrepartie. Les juristes divergent quant à la majorité de l'esclave, à la formule et au paiement différé de la contrepartie. L'esclave ayant payé la somme due est affranchi et son walā' revient à son ancien maître, qui peut bénéficier de la zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14923} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14924} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14925}"
  tr: "Yazışma, bir köle ile efendisi arasında bir madendeki mülk üzerinde yapılan ve köleyi ödeme yoluyla özgür bırakan bir sözleşmedir ve bu, belirli bir şekilde takas yoluyla özgür bırakmanın bir şartıdır. İslam öncesi dönemde bilinir ve İslam tarafından onaylanır, hukukçular ise Allah'ın En-Nur suresindeki sözleriyle desteklemiştir. Hukukçuların çoğu bunu tavsiye eder ve İkrimah, Ata, Mesruk ve Amr bin Dinar kölenin talep etmesi halinde zorunlu olduğunu savunmuşlardır. Temel taşları efendi ve köle, formül ve tazminattır. Hukukçular ergenlik, formül ve ertelenmiş tazminat konusunda farklılık gösterirler. Belgeler zekat ödemekten sorumludur. Borçlu olduğunu öderse özgür kalır ve sadakati efendisine bağlıdır. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.14922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14923} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14924} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14925}"
  id: "Korespondensi adalah kontrak antara budak dan tuannya atas properti tambang yang membebaskan budak dengan pembayaran, dan merupakan syarat pembebasan dengan cara tertentu melalui pertukaran. Korespondensi ini dikenal pada era pra-Islam dan disetujui oleh Islam, dan para ahli hukum mendukungnya melalui firman Allah dalam Surah An-Nur. Mayoritas ahli hukum merekomendasikannya, dan Ikrimah, Ata, Masruq, serta Amr ibn Dinar berpendapat bahwa itu wajib jika budak memintanya. Pilarnya adalah tuan dan budak, rumus, dan kompensasi. Para ahli hukum berbeda pendapat mengenai masa pubertas, rumus, dan kompensasi yang ditunda. Dokumen bertanggung jawab untuk membayar zakat. Jika dia membayar apa yang dia hutangkan, dia dibebaskan, dan kesetiaannya adalah kepada tuannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14923} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14924} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14925}"
