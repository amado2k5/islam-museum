id: concept/mukataba
class: concept
kind: legal
label: { ar: "المُكَاتَبَة", en: "Contract of manumission by instalments (mukataba)", ur: "مُکاتَبہ (قسطوں پر آزادی کا معاہدہ)" }
summary:
  ar: "المكاتبة معاقدة بين العبد وسيده على مال منجَّم يعتق العبد بأدائه، وهي تعليق للعتق بصفة على معاوضة مخصوصة. كانت معروفة في الجاهلية فأقرها الإسلام، واستدل الفقهاء عليها بقوله تعالى في سورة النور. وجمهور الفقهاء على ندبها، وذهب عكرمة وعطاء ومسروق وعمرو بن دينار إلى وجوبها إذا طلبها العبد. وأركانها المولى والعبد والصيغة والعوض، واختلف الفقهاء في البلوغ والصيغة والعوض المؤجل، ويعان المكاتب على الأداء من الزكاة. وإذا أدى ما عليه عتق، وكان ولاؤه لمولاه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14923} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14924} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14925}"
  en: "A mukataba is a contract between a slave and his master in which the slave is freed on paying a sum due in instalments; it attaches manumission to a condition within a specific exchange. It was known before Islam and Islam kept it, the jurists citing the Qur'an in Surat al-Nur. Most jurists hold it recommended; Ikrima, 'Ata', Masruq and 'Amr ibn Dinar held it obligatory when the slave asks. Its pillars are the master, the slave, the formula and the consideration. The jurists differ on the slave's majority, on the formula and on deferred consideration. The paid-up slave is freed and his walā' goes to his former master, and he may be aided from zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14923} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14924} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14925}"
  ur: "مُکاتَبہ غلام اور آقا کے درمیان قسطوں میں مال کی ادائیگی پر آزادی کا معاہدہ ہے۔ جمہور کے نزدیک یہ مستحب ہے، جب کہ بعض تابعین کے نزدیک غلام کے مطالبے پر واجب ہے۔ غلام ادائیگی کر دے تو آزاد ہو جاتا ہے اور اس کی ولاء آقا کو ملتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14923} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14925}"
