  tr: "Temel İhtiyaçlar"
  id: "Kebutuhan Dasar"
summary:
  ar: "يرى قعدات أن الحاجات الأساسية من غذاء وكساء وماء ومسكن يجب أن تكون مكفولة لعامة الناس، وأن الاقتصاد يساهم في تأمينها {cite:qadan-manhaj-iqtisad-quran p. 67}. ويستشهد بحديث «الناس شركاء في ثلاث: الماء والكلأ والنار» دون أن يذكر مخرجه أو درجته {cite:qadan-manhaj-iqtisad-quran p. 67}. ويعدّ الخلط بين الحاجات الأساسية وغير الأساسية سبباً من أسباب الخلل الاقتصادي والصراع الطبقي {cite:qadan-manhaj-iqtisad-quran p. 57}."
  tr: "Kaadat, yiyecek, giysi, su ve barınak gibi temel ihtiyaçların genel halk için garanti altına alınması gerektiğine ve ekonominin bunların sağlanmasına katkıda bulunduğuna inanır {cite:qadan-manhaj-iqtisad-kur'an s. 67}. \"İnsanlar üç şeyin ortağıdır: su, otlak ve ateş\" hadisini kaynak veya derecesinden bahsetmeden aktarır {cite:qadan-manhaj-iqtisad-kur'an s. 67}. Temel ve temel olmayan ihtiyaçların karıştırılması ekonomik dengesizlik ve sınıf çatışmasının nedeni olarak kabul edilir {cite:qadan-manhaj-iqtisad-kur'an s. 57}."
  id: "Kaadat percaya bahwa kebutuhan dasar seperti makanan, pakaian, air, dan tempat tinggal harus dijamin bagi masyarakat umum, dan bahwa ekonomi berkontribusi pada penyediaan mereka {cite:qadan-manhaj-iqtisad-qur'an hlm. 67}. Ia menceritakan hadits \"Manusia adalah mitra tiga hal: air, padang rumput, dan api\" tanpa menyebutkan sumber atau derajat {cite:qadan-manhaj-iqtisad-qur'an hlm. 67}. Pencampuran kebutuhan dasar dan non-dasar dianggap sebagai penyebab ketidakseimbangan ekonomi dan konflik kelas {cite:qadan-manhaj-iqtisad-qur'an hlm. 57}."
