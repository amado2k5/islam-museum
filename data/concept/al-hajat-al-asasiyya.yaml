summary:
  ar: "يرى قعدات أن الحاجات الأساسية من غذاء وكساء وماء ومسكن يجب أن تكون مكفولة لعامة الناس، وأن الاقتصاد يساهم في تأمينها {cite:qadan-manhaj-iqtisad-quran p. 67}. ويستشهد بحديث «الناس شركاء في ثلاث: الماء والكلأ والنار» دون أن يذكر مخرجه أو درجته {cite:qadan-manhaj-iqtisad-quran p. 67}. ويعدّ الخلط بين الحاجات الأساسية وغير الأساسية سبباً من أسباب الخلل الاقتصادي والصراع الطبقي {cite:qadan-manhaj-iqtisad-quran p. 57}."
