id: concept/fresh-fruit-and-the-watery-humour
class: concept
kind: scientific
label: { ar: "الفواكه الرطبة والخلط المائي", en: "Fresh fruit and the watery humour", ur: "تازہ پھل اور آبی خلط", es: "Fruta fresca y humor acuoso", fr: "Des fruits frais et l'humour aqueux", tr: "Islak meyveler ve sulu karıştırma", id: "Buah basah dan pencampuran air" }
summary:
  ar: "يقول ابن سينا إن الفواكه الرطبة كالمشمش والتوت والبطيخ والخوخ والإجاص توافق غير المرتاضين الممرورين في الصيف إذا أكلت قبل الطعام، لكن الأفضل التدبير بغيرها، لأن ما يملأ الدم مائية يغلي في البدن ويهيئه للعفونة، وإن الخلط المائي قد يصير صديداً إذا بقي في العروق، وإن الرياضة بعد الفاكهة تحلله {cite:canon-ibn-sina-print-v1 pp.233-234}."
  en: "Ibn Sina says fresh fruit such as apricot, mulberry, melon, peach and plum suits the non-exercising, bilious person in summer when eaten before the meal, though it is better to manage without it, since what fills the blood with wateriness seethes in the body and readies it for putrefaction; the watery humour may turn to ichor if it stays in the vessels, and exercise after fruit disperses it {cite:canon-ibn-sina-print-v1 pp.233-234}."
  es: "Ibn Sina dice que la fruta fresca como el albaricoque, la mora, el melón, el melocotón y la ciruela es adecuada para la persona sedentaria y con tendencia biliar en verano cuando se come antes de la comida, aunque es mejor prescindir de ella, ya que lo que llena la sangre de agua hierve en el cuerpo y lo prepara para la putrefacción; el humor acuoso puede convertirse en icor si permanece en los vasos, y el ejercicio después de la fruta lo dispersa {cite:canon-ibn-sina-print-v1 pp.233-234}."
  fr: "Ibn Sina dit que les fruits frais tels que l'abricot, la mûre, le melon, la pêche et la prune conviennent à la personne bilieuse et sédentaire en été, lorsqu'ils sont consommés avant le repas, bien qu'il soit préférable de s'en passer, car ce qui remplit le sang d'eau bouillonne dans le corps et le prépare à la putréfaction; l'humeur aqueuse peut se transformer en ichor si elle reste dans les vaisseaux, et l'exercice après les fruits la disperse {cite:canon-ibn-sina-print-v1 pp.233-234}."
  ur: "ابن سینا کا کہنا ہے کہ خوبانی، شہتوت، خربوزہ، آڑو اور بیر جیسے تازہ پھل گرمیوں میں ورزش نہ کرنے والے، کھانے سے پہلے کھائے جانے والے کے لیے مناسب ہیں، حالانکہ اس کے بغیر اس کا انتظام کرنا بہتر ہے، کیونکہ جو چیز خون کو پانی سے بھرتی ہے وہ جسم میں دھکیلتی ہے اور اسے زائل کرنے کے لیے تیار کرتی ہے۔ پانی دار مزاح اگر برتنوں میں ہی رہے اور پھلوں کے منتشر ہونے کے بعد ورزش کرے تو وہ ichor میں بدل سکتا ہے۔"
  tr: "İbn Sina, kayısı, böğürtlen, karpuz, şeftali ve armut gibi nemli meyvelerin, yaz boyunca kaçan keşişler olmayanlar için yemekten önce yendiğinde uygun olduğunu söyler; ancak kanı suyla dolduran şey vücutta kaynır ve küf için hazırlar. Sulu karışım damarlarda kalırsa irin haline gelebilir ve meyve çözdükten sonra egzersiz yapılır {cite:canon-ibn-sina-print-v1 s.233-234}."
  id: "Ibn Sina mengatakan bahwa buah lembap seperti aprikot, beri, semangka, persik, dan pir cocok bagi mereka yang bukan pertapa yang melewati musim panas jika dimakan sebelum makan, tetapi lebih baik menggunakan pilihan lain, karena apa yang mengisi darah dengan air mendidih di dalam tubuh dan mempersiapkannya untuk jamur. Campuran encer ini dapat menjadi nanah jika tetap berada di pembuluh darah, dan olahraga setelah buah melarutkannya {cite:canon-ibn-sina-print-v1 hlm.233-234}."
