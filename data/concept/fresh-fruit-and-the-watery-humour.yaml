id: concept/fresh-fruit-and-the-watery-humour
class: concept
kind: scientific
label: { ar: "الفواكه الرطبة والخلط المائي", en: "Fresh fruit and the watery humour", ur: "تازہ پھل اور آبی خلط" }
summary:
  ar: "يقول ابن سينا إن الفواكه الرطبة كالمشمش والتوت والبطيخ والخوخ والإجاص توافق غير المرتاضين الممرورين في الصيف إذا أكلت قبل الطعام، لكن الأفضل التدبير بغيرها، لأن ما يملأ الدم مائية يغلي في البدن ويهيئه للعفونة، وإن الخلط المائي قد يصير صديداً إذا بقي في العروق، وإن الرياضة بعد الفاكهة تحلله {cite:canon-ibn-sina-print-v1 pp.233-234}."
  en: "Ibn Sina says fresh fruit such as apricot, mulberry, melon, peach and plum suits the non-exercising, bilious person in summer when eaten before the meal, though it is better to manage without it, since what fills the blood with wateriness seethes in the body and readies it for putrefaction; the watery humour may turn to ichor if it stays in the vessels, and exercise after fruit disperses it {cite:canon-ibn-sina-print-v1 pp.233-234}."
