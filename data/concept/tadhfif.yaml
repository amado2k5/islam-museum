summary:
  ar: "التذفيف الإجهاز على الجريح وقتله، ويختلف حكمه باختلاف مواضعه. يجوز في الجهاد على جرحى الكفار، وفي البغاة يختلف الفقهاء: فالحنفية يجيزونه إن كانت للبغاة فئة، والمالكية بحسب مصلحة الحرب، والشافعية بحسب قرب الفئة، والحنابلة لا يجيزونه بعد ترك القتال. وفي الصيد يحل المذبوح بحركته عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4903} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4904} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4905}"
  en: "Tadhfif is finishing off a wounded person to kill him, and its rule varies with the setting. In war it is allowed on wounded unbelievers. Against wounded rebels the jurists differ: the Hanafis allow it if the rebels have a group to return to, the Malikis by the interest of the fight, the Shafi'is by whether a group is near, and the Hanbalis not after the fight is over. In hunting, most jurists allow an animal whose life is only in its movement to be lawful without finishing it off. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4903} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4904} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4905}"
