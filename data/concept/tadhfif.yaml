id: concept/tadhfif
class: concept
kind: legal
label:
  ar: "التذفيف"
  en: "Tadhfif (finishing off a wounded person)"
  ur: "تذفیف ⁦(زخمی کو مکمل قتل کرنا)⁩"
  es: "Tadhfif (rematar a una persona herida)"
  fr: "Tadhfif (achever une personne blessée)"
summary:
  ar: "التذفيف الإجهاز على الجريح وقتله، ويختلف حكمه باختلاف مواضعه. يجوز في الجهاد على جرحى الكفار، وفي البغاة يختلف الفقهاء: فالحنفية يجيزونه إن كانت للبغاة فئة، والمالكية بحسب مصلحة الحرب، والشافعية بحسب قرب الفئة، والحنابلة لا يجيزونه بعد ترك القتال. وفي الصيد يحل المذبوح بحركته عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4903} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4904} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4905}"
  en: "Tadhfif is finishing off a wounded person to kill him, and its rule varies with the setting. In war it is allowed on wounded unbelievers. Against wounded rebels the jurists differ: the Hanafis allow it if the rebels have a group to return to, the Malikis by the interest of the fight, the Shafi'is by whether a group is near, and the Hanbalis not after the fight is over. In hunting, most jurists allow an animal whose life is only in its movement to be lawful without finishing it off. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4903} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4904} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4905}"
  es: "Tadhfif consiste en rematar a una persona herida para matarla, y su regla varía según el contexto. En la guerra, está permitido contra los infieles heridos. Contra los rebeldes heridos, los juristas difieren: los hanafíes lo permiten si los rebeldes tienen un grupo al que regresar, los malikíes lo consideran en función del interés de la lucha, los shafiíes si hay un grupo cerca, y los hanbalíes no lo permiten una vez terminada la lucha. En la caza, la mayoría de los juristas permiten que un animal cuya vida reside únicamente en su movimiento sea lícito sin necesidad de rematarlo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4903} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4904} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4905}"
  fr: "Le tadhfif consiste à achever une personne blessée, et sa règle varie selon le contexte. En temps de guerre, il est autorisé sur les infidèles blessés. Concernant les rebelles blessés, les juristes divergent: les hanafites l’autorisent si les rebelles ont un groupe auquel se rallier, les malikites selon l’intérêt du combat, les chaféites selon la proximité d’un groupe, et les hanbalites l’interdisent après la fin des combats. À la chasse, la plupart des juristes considèrent qu’il est licite de tuer un animal dont la vie ne tient qu’à ses mouvements, sans pour autant l’achever. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4903} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4904} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4905}"
