label:
  ar: "الفتوى على الفضائيات — نفعها وضررها"
  en: "Fatwa on the satellite channels — its benefit and harm"
issue:
  ar: "انتشرت برامج الفتوى على الفضائيات فسمعها الملايين — فهل جلبت نفعاً أم خلفت مشكلات، وإلى من يلجأ السائل؟"
summary:
  ar: "حلقة «الوسطية» عن فتوى الفضائيات التي لم تعد خاصة بالمستفتي بل يسمعها الملايين {cite:assabile-tareq-al-suwaidan al-wassitiya/ep13 00:01:30}. صوّت الشباب على سبب اللجوء إليها: سهولة الحصول عليها أولاً، و35% للوصول إلى الأعلم، و20% لإجابات غير متشددة؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep13 00:09:00} وعلى مرجع الفتوى: 43% لعلماء البلد، و15% فقط لأعلم الفضائيات، و42% للهيئات والمجامع الفقهية؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep13 00:32:30} وعلى الحل: 39% لخيار و31% للاكتفاء بالفتوى الجماعية دون الاجتهاد الفردي {cite:assabile-tareq-al-suwaidan al-wassitiya/ep13 01:08:30}."
  en: "The 'Al-Wasatiyya' episode on satellite fatwa programmes, no longer private to the questioner but heard by millions {cite:assabile-tareq-al-suwaidan al-wassitiya/ep13 00:01:30}. The youth voted on why people turn to them: ease of access first, 35% to reach the most-learned, 20% for less-strict answers; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep13 00:09:00} on whom to ask: 43% the country's scholars, only 15% satellite scholars, 42% fiqh bodies and academies; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep13 00:32:30} and on the solution: 39% for one option, 31% for restricting to collective fatwa over individual ijtihad {cite:assabile-tareq-al-suwaidan al-wassitiya/ep13 01:08:30}."
