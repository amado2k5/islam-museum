id: concept/al-fatwa-ala-al-fadaiyyat
class: concept
kind: social
label:
  ar: "الفتوى على الفضائيات — نفعها وضررها"
  en: "Fatwa on the satellite channels — its benefit and harm"
  fr: "La fatwa sur les chaînes par satellite : avantages et inconvénients"
  es: "Fatwas en los canales satelitales: sus beneficios y perjuicios."
  ur: "سیٹلائٹ چینلز پر فتویٰ - اس کا فائدہ اور نقصان"
issue:
  ar: "انتشرت برامج الفتوى على الفضائيات فسمعها الملايين — فهل جلبت نفعاً أم خلفت مشكلات، وإلى من يلجأ السائل؟"
summary:
  ar: "حلقة «الوسطية» عن فتوى الفضائيات التي لم تعد خاصة بالمستفتي بل يسمعها الملايين {cite:assabile-tareq-al-suwaidan al-wassitiya/ep13 00:01:30}. صوّت الشباب على سبب اللجوء إليها: سهولة الحصول عليها أولاً، و35% للوصول إلى الأعلم، و20% لإجابات غير متشددة؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep13 00:09:00} وعلى مرجع الفتوى: 43% لعلماء البلد، و15% فقط لأعلم الفضائيات، و42% للهيئات والمجامع الفقهية؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep13 00:32:30} وعلى الحل: 39% لخيار و31% للاكتفاء بالفتوى الجماعية دون الاجتهاد الفردي {cite:assabile-tareq-al-suwaidan al-wassitiya/ep13 01:08:30}."
  en: "The 'Al-Wasatiyya' episode on satellite fatwa programmes, no longer private to the questioner but heard by millions {cite:assabile-tareq-al-suwaidan al-wassitiya/ep13 00:01:30}. The youth voted on why people turn to them: ease of access first, 35% to reach the most-learned, 20% for less-strict answers; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep13 00:09:00} on whom to ask: 43% the country's scholars, only 15% satellite scholars, 42% fiqh bodies and academies; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep13 00:32:30} and on the solution: 39% for one option, 31% for restricting to collective fatwa over individual ijtihad {cite:assabile-tareq-al-suwaidan al-wassitiya/ep13 01:08:30}."
  fr: "Un épisode d’« Al-Wasatiyya » consacré aux émissions de fatwas par satellite : au lieu de rester entre le juriste et la personne qui le consulte, la fatwa est entendue par des millions de personnes {cite:assabile-tareq-al-suwaidan al-wassitiya/ep13 00:01:30}. Les jeunes ont voté sur les raisons d’y recourir : d’abord la facilité d’accès, puis l’accès aux plus savants pour 35 % et des réponses moins strictes pour 20 % ; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep13 00:09:00} sur les personnes à consulter : 43 % les savants du pays, 15 % seulement les savants des chaînes, et 42 % les organismes et académies du fiqh ; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep13 00:32:30} et sur la solution : 39 % ont choisi une option, 31 % la diffusion des seules fatwas collectives, à l’exclusion de l’ijtihad individuel {cite:assabile-tareq-al-suwaidan al-wassitiya/ep13 01:08:30}."
  es: "El episodio de 'Al-Wasatiyya' sobre los programas de fatwa por satélite, que ya no son privados para quien pregunta, sino que son escuchados por millones. Los jóvenes votaron sobre por qué la gente recurría a ellos: facilidad de acceso en primer lugar, 35% para llegar a los más educados, 20% para respuestas menos estrictas; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep13 00:09:00} sobre a quién preguntar: 43% de los eruditos del país, solo 15% de los eruditos por satélite, 42% de los organismos y academias de fiqh; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep13 00:32:30} y sobre la solución: 39% para una opción, 31% para restringir la fatwa colectiva sobre el ijtihad individual."
  ur: "سیٹلائٹ فتوی پروگراموں پر 'الوصطیہ' ایپی سوڈ، جو اب سائل کے لیے نجی نہیں ہے بلکہ لاکھوں لوگوں نے سنا ہے۔ نوجوانوں نے ووٹ دیا کہ لوگ ان کی طرف کیوں آئے: سب سے پہلے رسائی میں آسانی، سب سے زیادہ تعلیم یافتہ تک پہنچنے کے لیے 35%، کم سخت جوابات کے لیے 20%؛ {حوالہ: assabile-tareq-al-suwaidan al-wasitiya/ep13 00:09:00} کس سے پوچھیں: ملک کے 43% علماء، صرف 15% سیٹلائٹ علماء، 42% فقہ کے ادارے اور اکیڈمیاں؛ {حوالہ:اصابیل-طارق-السویدان الوصیتیہ/ep13 00:32:30} اور حل پر: ایک اختیار کے لیے 39%، انفرادی اجتہاد پر اجتماعی فتویٰ تک محدود کرنے کے لیے 31%۔"
