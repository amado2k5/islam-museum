label:
  ar: "مثل «بيدي لا بيد عمرو»"
  en: "The proverb 'By my own hand, not Amr's'"
  ur: "مثل «بیدی لا بید عمرو»"
  fr: "Le proverbe « Par ma main, non par celle d'Amr »"
  es: "El proverbio «Por mi mano, no por la de Amr»"
summary:
  ar: "مثل يُضرب فيمن يفضّل هزيمة نفسه على الاستسلام لخصمه، وقصته أن الزباء ملكة تدمر شربت السم من خاتمها حين أحاط بقصرها جند عمرو {cite:noonpost-16943}."
  en: "A proverb for one who prefers defeat by his own hand to surrender to his enemy; its tale is that al-Zabba, queen of Palmyra, drank the poison of her ring when Amr's soldiers surrounded her palace {cite:noonpost-16943}."
  ur: "وہ مثل جو دشمن کے آگے ہتھیار ڈالنے کے بجائے اپنے ہاتھ سے ہار قبول کرنے والے کے لیے کہی جاتی ہے؛ اس کا قصہ یہ ہے کہ تدمر کی ملکہ زباء نے عمرو کے سپاہیوں کے محل کو گھیرنے پر اپنی انگوٹھی سے زہر پی لیا {cite:noonpost-16943}۔"
  fr: "Proverbe dit de qui préfère sa propre défaite à la reddition à l'ennemi ; son histoire est que al-Zabba, reine de Palmyre, but le poison de sa bague quand les soldats d'Amr cernèrent son palais {cite:noonpost-16943}."
  es: "Proverbio que se dice de quien prefiere su propia derrota a rendirse al enemigo; su relato es que al-Zabba, reina de Palmira, bebió el veneno de su anillo cuando los soldados de Amr rodearon su palacio {cite:noonpost-16943}."
