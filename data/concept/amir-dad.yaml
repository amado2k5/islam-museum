label:
  ar: "أمير داد ⁦(أمير العدل)⁩"
  en: "Amir dad ('amir of justice', Seljuk minister of justice)"
  fr: "Amir dad (« amir de la justice », ministre seldjoukide de la Justice)"
  es: "Amir dad ('emir de justicia', ministro de justicia selyúcida)"
summary:
  ar: "أمير داد، أي «أمير العدل»، وزير العدل في العهد السلجوقي، خاصة في الأناضول، وحمل بعض الأمراء هذا الاسم لقبًا ثابتًا {cite:encyclopaedia-of-islam-2 vol. 1 p. 465}."
  en: "Amir dad, 'amir of justice', was minister of justice under the Seljuks, especially in Asia Minor, and other amirs bore this name as a fixed title {cite:encyclopaedia-of-islam-2 vol. 1 p. 465}."
  fr: "Amir dad, « amir de la justice », était le ministre de la Justice sous les Seldjoukides, en particulier en Asie Mineure, et d’autres amirs portèrent ce nom comme titre fixe {cite:encyclopaedia-of-islam-2 vol. 1 p. 465}."
  es: "Amir dad, 'emir de justicia', era ministro de justicia bajo los selyúcidas, especialmente en Asia Menor, y otros emires llevaban este nombre como título fijo {cite:encyclopaedia-of-islam-2 vol. 1 p. 465}."
