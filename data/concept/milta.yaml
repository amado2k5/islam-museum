label: { ar: "المِلْطاء", en: "Scalp wound reaching the bone (milta, samhaq) in blood money", ur: "ملطاء ⁦(کھوپڑی تک زخم)⁩", es: "Herida en el cuero cabelludo que llega al hueso (milta, samhaq) en dinero de sangre", fr: "Plaie du cuir chevelu atteignant l'os (milta, samhaq) dans l'argent du sang" }
summary:
  ar: "الملطاء هي السمحاق أو الشجة التي تخرق اللحم حتى تدنو من العظم، وفرق المالكية بينهما. وذهب جمهور الفقهاء إلى أنه لا تجب فيها دية ولا أرش مقدر، وإنما تجب فيها حكومة عدل، أما المالكية ورواية عن محمد وقول عند الشافعية فيوجبون القصاص في عمدها."
  en: "Milta is the scalp wound called samhaq, or a wound through the flesh that comes close to the bone; the Malikis separate the two. Most jurists hold that it carries no fixed blood money or fixed compensation, only a just assessment whether intentional or not; the Malikis, a report from Muhammad, and a view among the Shafi'is require retaliation for an intentional one."
  ur: "ملطاء وہ زخم ہے جو گوشت کو کاٹ کر ہڈی کے قریب پہنچ جائے، یا سمحاق ⁦(کھوپڑی کی باریک جھلی تک زخم)⁩۔ جمہور کے نزدیک اس میں مقررہ دیت یا ارش نہیں، صرف حکومتِ عدل ہے۔"
  es: "Milta es la herida en el cuero cabelludo llamada samhaq, o una herida que atraviesa la carne y llega hasta el hueso; los malikíes distinguen entre ambas. La mayoría de los juristas sostienen que no conlleva una indemnización fija por derramamiento de sangre ni una compensación fija, sino solo una valoración justa, sea intencional o no; los malikíes, un relato de Mahoma y la opinión de los shafiíes exigen represalias para una herida intencional."
  fr: "La milta désigne la plaie au cuir chevelu appelée samhaq, ou une plaie profonde atteignant presque l'os; les malikites font la distinction entre les deux. La plupart des juristes estiment qu'elle n'entraîne ni prix du sang ni compensation fixe, mais seulement une juste appréciation de son caractère intentionnel ou non; les malikites, un hadith rapporté par Mahomet et une opinion parmi les chaféites exigent une vengeance pour une blessure intentionnelle."
