label: { ar: "المِلْطاء", en: "Scalp wound reaching the bone (milta, samhaq) in blood money", ur: "ملطاء (کھوپڑی تک زخم)" }
summary:
  ar: "الملطاء هي السمحاق أو الشجة التي تخرق اللحم حتى تدنو من العظم، وفرق المالكية بينهما. وذهب جمهور الفقهاء إلى أنه لا تجب فيها دية ولا أرش مقدر، وإنما تجب فيها حكومة عدل، أما المالكية ورواية عن محمد وقول عند الشافعية فيوجبون القصاص في عمدها."
  en: "Milta is the scalp wound called samhaq, or a wound through the flesh that comes close to the bone; the Malikis separate the two. Most jurists hold that it carries no fixed blood money or fixed compensation, only a just assessment whether intentional or not; the Malikis, a report from Muhammad, and a view among the Shafi'is require retaliation for an intentional one."
  ur: "ملطاء وہ زخم ہے جو گوشت کو کاٹ کر ہڈی کے قریب پہنچ جائے، یا سمحاق (کھوپڑی کی باریک جھلی تک زخم)۔ جمہور کے نزدیک اس میں مقررہ دیت یا ارش نہیں، صرف حکومتِ عدل ہے۔"
