label: { ar: "ضبط الرخامة بالارتفاع والخيط", en: "Setting the dial by altitude and a thread", ur: "ارتفاع اور دھاگے سے رخامہ کو درست کرنا", es: "Ajuste del dial por altitud y un hilo" }
summary:
  ar: "تُنصب الرخامة بمعرفة الارتفاع الذي لا ميل له على الجهة المرسومة، ثم يُصد الارتفاع حتى إذا بلغ قدره أُديرت الرخامة حتى يقع ظل الموري على خط ما بين المشرق والمغرب، فإذا استوى ذلك استوى نصب الرخامة بعد أن يكون وجهها موزوناً غير مائل. وإن أراد الحاسب ارتفاع ساعة أو ساعتين عرفه بالحساب ثم أدار الرخامة حتى يقع ظل الموري على خط الساعة. {cite:zij-sabi-nallino-byblion pp.209-210}"
  en: "The dial is set by a known altitude on the given side. The altitude is fixed, and when it reaches the right amount the dial is turned until the shadow of the gnomon falls on the line from east to west; when that holds the dial is level, its face being plumbed and not tilted. For an altitude at one or two hours the reckoner computes it, then turns the dial until the shadow lies on the hour line. {cite:zij-sabi-nallino-byblion pp.209-210}"
  ur: "رخامہ کو معلوم ارتفاع سے مقررہ جانب میں نصب کیا جاتا ہے۔ ارتفاع مقرر کیا جاتا ہے، اور جب وہ مطلوبہ مقدار تک پہنچے تو رخامہ کو گھمایا جاتا ہے یہاں تک کہ شاخص کا سایہ مشرق اور مغرب کی لکیر پر آ جائے؛ جب یہ ہو جائے تو رخامہ افقی ہے، اس کا رخ سیدھا ہے اور جھکا ہوا نہیں۔ اگر حاسب ایک یا دو ساعت کا ارتفاع چاہے تو اسے حساب سے معلوم کرتا ہے، پھر رخامہ کو گھماتا ہے یہاں تک کہ سایہ ساعت کی لکیر پر آ جائے۔ {cite:zij-sabi-nallino-byblion pp.209-210}"
  es: "El dial se ajusta mediante una altitud conocida en el lado indicado. La altitud es fija, y cuando alcanza la cantidad correcta, se gira el dial hasta que la sombra del gnomon cae sobre la línea de este a oeste; cuando esto ocurre, el dial está nivelado, su cara está aplomada y no inclinada. Para una altitud de una o dos horas, el calibrador la calcula y luego gira el dial hasta que la sombra se sitúa sobre la línea horaria. {cite:zij-sabi-nallino-byblion pp.209-210}"
