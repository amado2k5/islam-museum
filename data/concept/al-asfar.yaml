summary:
  ar: "الأصفر: الجواد الذهبي أو لون شعلة النار أو صفرة زهرة النيلوفر، وله عرف وذنب أصفران؛ ومنه المطرف، وهو الأصفر الناصع الذي فيه سواد في القوائم."
  en: "Al-asfar: a golden or yellow horse, with a yellow mane and tail; the third colour group in Fayed's account, including al-mutarraf, a bright yellow with black legs."
  es: "Al-asfar: un caballo dorado o amarillo, con crin y cola amarillas; el tercer grupo de colores en el relato de Fayed, que incluye al-mutarraf, un caballo amarillo brillante con patas negras."
  fr: "Al-asfar: un cheval doré ou jaune, avec une crinière et une queue jaunes; le troisième groupe de couleurs dans le récit de Fayed, comprenant al-mutarraf, un jaune vif avec des jambes noires."
  ur: "الاسفار: ایک سنہری یا پیلا گھوڑا، جس میں پیلے رنگ کی ایال اور دم ہوتی ہے۔ فائد کے اکاؤنٹ میں تیسرا رنگ گروپ، بشمول المطرف، سیاہ ٹانگوں کے ساتھ ایک چمکدار پیلے رنگ کا۔"
