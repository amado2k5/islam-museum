id: concept/quranic-inscriptions-on-coins
class: concept
kind: term
label: { ar: "الآيات القرآنية على النقود الإسلامية", en: "Qur'anic inscriptions on Islamic coins", ur: "اسلامی سکوں پر قرآنی آیات" }
summary:
  ar: "نقش الآيات القرآنية على الدنانير والدراهم والفلوس، سنّه عبد الملك بن مروان سنة 77هـ بنقش سورة الإخلاص والآية 33 من سورة التوبة، ثم استعملته الدول والثائرون للتعبير عن توجهاتهم السياسية والمذهبية، كما يبين فرج الله أحمد يوسف {cite:yusuf-ayat-quraniyya-maskukat-2003 p. 24} {cite:yusuf-ayat-quraniyya-maskukat-2003 p. 25}."
  en: "The inscription of Qur'anic verses on dinars, dirhams and fulus, begun by Abd al-Malik ibn Marwan in 77 AH with Surat al-Ikhlas and al-Tawba 33 and later used by dynasties and rebels to express their political and sectarian aims, as Farajallah Ahmad Yusuf shows {cite:yusuf-ayat-quraniyya-maskukat-2003 p. 24} {cite:yusuf-ayat-quraniyya-maskukat-2003 p. 25}."
  ur: "دیناروں، درہموں اور فلوس پر قرآنی آیات کندہ کرنا، جس کی ابتدا عبد الملک بن مروان نے 77ھ میں سورۂ اخلاص اور التوبہ 33 سے کی، اور بعد میں حکومتوں اور باغیوں نے اپنے سیاسی و مسلکی رجحانات کے اظہار کے لیے اسے استعمال کیا، جیسا کہ فرج اللہ احمد یوسف دکھاتے ہیں {cite:yusuf-ayat-quraniyya-maskukat-2003 p. 25}."
