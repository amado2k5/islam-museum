id: concept/imtihan
class: concept
kind: ethical
label: { ar: "الامتهان", en: "Imtihan (use, handling and scorned work)", es: "Imtihan (uso, manejo y trabajo despreciado)", fr: "Imtihan (usage, manipulation et travail méprisé)", ur: "امتحان ⁦(استعمال، ہینڈلنگ اور حقیر کام)⁩", tr: "aşağılanma", id: "penghinaan" }
summary:
  ar: "الامتهان لغة الخدمة واستعمال الشيء وابتذاله، ويستعمل الفقهاء اللفظ بالمعنيين: الاحتراف والابتذال، والابتذال عدم صيانة الشيء وتداوله واستخدامه في العمل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3380} ويفترق عن الاستهانة والاستخفاف، لأن الاستهانة استحقار، والامتهان لا يتضمنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3380} ويطلب في بعض الأحوال كالجمعة والعيدين أن يلبس غير ثياب المهنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3380}"
  en: "Imtihan in the lexical sense is serving another or using and wearing a thing out; the jurists use the word in both senses, as trade and as wear. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3380} It differs from contempt or disdain, since contempt is treating a thing as worthless, and imtihan does not imply that. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3380} In some cases, such as Friday and the feasts, one is asked to wear something other than work clothes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3380}"
  es: "Imtihan, en sentido léxico, significa servir a otro o usar y desgastar algo; los juristas usan la palabra en ambos sentidos, como comercio y como desgaste. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3380} Se diferencia del desprecio o el desdén, ya que el desprecio consiste en tratar algo como si no tuviera valor, e imtihan no implica eso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3380} En algunos casos, como los viernes y las fiestas, se pide vestir algo distinto a la ropa de trabajo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3380}"
  fr: "L'imtihan, au sens littéral, signifie servir autrui ou utiliser et user une chose; les juristes emploient ce terme dans les deux sens, celui de commerce et celui d'usure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3380} Il se distingue du mépris ou du dédain, car le mépris consiste à considérer une chose comme sans valeur, ce qu'imtihan n'implique pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3380} Dans certains cas, comme le vendredi et les jours de fête, il est demandé de porter autre chose que des vêtements de travail. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3380}"
  ur: "لغوی معنوں میں امتحان کسی دوسرے کی خدمت کرنا یا کسی چیز کو استعمال کرنا اور پہننا ہے۔ فقہاء اس لفظ کو تجارت اور لباس دونوں معنوں میں استعمال کرتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3380} یہ حقارت یا حقارت سے مختلف ہے، کیونکہ تحقیر کسی چیز کو فضول سمجھنا ہے، اور امتحان اس پر دلالت نہیں کرتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3380} بعض صورتوں میں، جیسے جمعہ اور عیدوں میں، کام کے لباس کے علاوہ کچھ اور پہننے کو کہا جاتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 3380}"
  tr: "Meslek, hizmetin dilidir; bir şeyin kullanımı ve bayağılığıdır. Hukukçular bu terimi hem profesyonellik hem de bayağılık anlamında kullanır; kabalık, işte bir şeyi sürdürmemek, dolaştırmamak veya kullanmamak anlamına gelir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3380} Görmezden gelme ve görmezden gelmekten ayrılır, çünkü küçümseme küçümsemedir ve aşağılanma bunu kapsamaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3380} Bazı durumlarda, örneğin Cuma namazı ve bayram namalarında, profesyonel kıyafet dışında kıyafetler giymek zorunludur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3380}"
  id: "Pekerjaan adalah bahasa pelayanan, penggunaan dan kekasaran sesuatu. Ahli hukum menggunakan istilah ini dalam kedua makna: profesionalisme dan vulgaritas, dan vulgaritas berarti tidak mempertahankan, menyebarkan, atau menggunakan sesuatu dalam pekerjaan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3380} Istilah ini dibedakan dari pengabaian dan pengabaian, karena pengabaian adalah penghinaan, dan penghinaan tidak termasuk. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3380} Dalam beberapa kasus, seperti salat Jumat dan salat Idul Fitri, diwajibkan mengenakan pakaian selain pakaian profesional. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3380}"
