id: concept/imtihan
class: concept
kind: ethical
label: { ar: "الامتهان", en: "Imtihan (use, handling and scorned work)" }
summary:
  ar: "الامتهان لغة الخدمة واستعمال الشيء وابتذاله، ويستعمل الفقهاء اللفظ بالمعنيين: الاحتراف والابتذال، والابتذال عدم صيانة الشيء وتداوله واستخدامه في العمل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3380} ويفترق عن الاستهانة والاستخفاف، لأن الاستهانة استحقار، والامتهان لا يتضمنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3380} ويطلب في بعض الأحوال كالجمعة والعيدين أن يلبس غير ثياب المهنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3380}"
  en: "Imtihan in the lexical sense is serving another or using and wearing a thing out; the jurists use the word in both senses, as trade and as wear. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3380} It differs from contempt or disdain, since contempt is treating a thing as worthless, and imtihan does not imply that. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3380} In some cases, such as Friday and the feasts, one is asked to wear something other than work clothes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3380}"
