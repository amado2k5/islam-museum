label: { ar: "أجير", en: "Hired worker (ajir)", fr: "Travailleur rémunéré (ajir)", es: "Trabajador contratado (ajir)", ur: "مزدور ⁦(اجیر)⁩", tr: "Çalışan", id: "Çalışan" }
summary:
  ar: "الأجير من يعمل بأجر، وقد أمر الشرع بإعطائه أجره قبل أن يجف عرقه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1714} ومتى كان الأجير جائز التصرف مستوفياً شروط العقد، قادراً على تسليم المنفعة، وكان العمل مباحاً وجب عليه الوفاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1714} فإن كان أجيراً خاصاً وجب عليه تسليم نفسه لمستأجره وامتناعه من العمل لغيره في المدة، إلا الصلاة المفروضة. وإن كان أجيراً مشتركاً وجب عليه الوفاء بالعمل والتسليم، ويستحق الأجرة بذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1714}"
  en: "A hired worker is one who works for a wage. The law orders that his wage be paid before his sweat dries. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1714} When a worker is competent to contract, meets the conditions, can deliver the benefit and the work is lawful, he must perform the contract. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1714} A private worker must surrender himself to his employer for the term and not work for others, except for the obligatory prayers; a shared worker must do and deliver the work and is paid on delivery. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1714}"
  fr: "Un ajir est un travailleur qui fournit un travail contre salaire. La loi prescrit de lui verser son salaire avant que sa sueur ne sèche. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1714} Le travailleur doit exécuter le contrat s’il a la capacité de contracter, remplit les conditions requises, peut fournir la prestation et si le travail est licite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1714} Le travailleur engagé à titre exclusif doit se tenir à la disposition de son employeur pendant la durée convenue et ne pas travailler pour d’autres ; il reste libre d’accomplir les prières obligatoires. Le travailleur qui n’est pas engagé à titre exclusif doit exécuter et livrer le travail ; il est payé à la livraison. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1714}"
  es: "Un trabajador asalariado es aquel que trabaja por un salario. La ley ordena que se le pague el salario antes de que se seque su sudor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1714} Cuando un trabajador es competente para contratar, cumple las condiciones, puede entregar el beneficio y el trabajo es lícito, debe cumplir el contrato. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1714} Un trabajador privado debe entregarse a su empleador durante el plazo y no trabajar para otros, excepto para las oraciones obligatorias; un trabajador compartido debe realizar y entregar el trabajo y se le paga al momento de la entrega. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1714}"
  ur: "مزدور وہ ہوتا ہے جو اجرت پر کام کرتا ہے۔ قانون حکم دیتا ہے کہ اس کی اجرت اس کا پسینہ خشک ہونے سے پہلے ادا کر دی جائے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1714} جب کوئی کارکن معاہدہ کرنے کا اہل ہو، شرائط پر پورا اترتا ہو، فائدہ پہنچا سکتا ہو اور کام حلال ہو تو اسے معاہدہ کرنا چاہیے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1714} ایک پرائیویٹ ورکر کو چاہیے کہ وہ مدت کے لیے خود کو اپنے آجر کے حوالے کر دے اور فرض نمازوں کے علاوہ دوسروں کے لیے کام نہ کرے۔ ایک مشترکہ کارکن کو کام کرنا اور ڈیلیور کرنا چاہیے اور ڈیلیوری پر ادائیگی کی جاتی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص1714}"
  tr: "Ücretli kişi, ücret karşılığında çalışan kişidir ve Şeriat, terini kurumadan önce ücretinin ödenmesini emretmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1714} Ücretli kişi hareket edebiliyor ve sözleşme koşullarını yerine getirebiliyorsa, faydayı verebiliyorsa ve iş izin veriliyorsa, bunu yerine getirmelidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1714} Eğer özel ücretli işçi ise, kiralık işçisine teslim olmalı ve bu süre boyunca başkaları için çalışmaktan kaçınmalıdır, zorunlu namaz dışında. Eğer ortak ücretse, işi yerine getirmeli ve teslim etmelidir; bunun ücretini almaya haklıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1714}"
  id: "Pekerja upahan adalah seseorang yang bekerja dengan upah, dan Syariah memerintahkan agar upahnya dibayar sebelum keringatnya keringatnya habis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1714} Jika buruh dapat bergerak dan memenuhi syarat kontrak, dapat memberikan manfaat, dan bekerja diizinkan, maka mereka harus memenuhinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1714} Jika mereka adalah pekerja upahan swasta, mereka harus menyerahkan diri kepada pekerja yang disewa dan menahan diri untuk bekerja untuk orang lain selama periode ini, kecuali untuk doa wajib. Jika upah itu adalah upah umum, mereka harus melakukan dan melaksanakan pekerjaan tersebut; mereka berhak menerima pembayaran untuk itu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1714}"
