label: { ar: "أجير", en: "Hired worker (ajir)" }
summary:
  ar: "الأجير من يعمل بأجر، وقد أمر الشرع بإعطائه أجره قبل أن يجف عرقه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1714} ومتى كان الأجير جائز التصرف مستوفياً شروط العقد، قادراً على تسليم المنفعة، وكان العمل مباحاً وجب عليه الوفاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1714} فإن كان أجيراً خاصاً وجب عليه تسليم نفسه لمستأجره وامتناعه من العمل لغيره في المدة، إلا الصلاة المفروضة. وإن كان أجيراً مشتركاً وجب عليه الوفاء بالعمل والتسليم، ويستحق الأجرة بذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1714}"
  en: "A hired worker is one who works for a wage. The law orders that his wage be paid before his sweat dries. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1714} When a worker is competent to contract, meets the conditions, can deliver the benefit and the work is lawful, he must perform the contract. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1714} A private worker must surrender himself to his employer for the term and not work for others, except for the obligatory prayers; a shared worker must do and deliver the work and is paid on delivery. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1714}"
