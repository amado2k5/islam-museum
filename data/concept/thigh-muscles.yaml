label: { ar: "عضل حركة الفخذ عند ابن سينا", en: "Muscles that move the thigh in the Canon", ur: "قانون میں ران کو حرکت دینے والے پٹھے", es: "Músculos que mueven el muslo en el Canon", fr: "Muscles qui font bouger la cuisse dans le canon" }
summary:
  ar: "يرى ابن سينا أن أعظم عضل الفخذ هي التي تبسطه ثم التي تقبضه، لأن أشرف أفعالها هاتان الحركتان، والبسط أفضل لأن القيام إنما يتأتى به {cite:canon-ibn-sina-print-v1 p.74}."
  en: "Ibn Sina holds that the greatest muscles of the thigh are those that straighten it and then those that bend it, since these two movements are its noblest actions, straightening being the better since standing is accomplished by it {cite:canon-ibn-sina-print-v1 p.74}."
  es: "Ibn Sina sostiene que los músculos más importantes del muslo son los que lo enderezan y luego los que lo flexionan, ya que estos dos movimientos son sus acciones más nobles, siendo el enderezamiento el mejor puesto, puesto que se logra mediante él {cite:canon-ibn-sina-print-v1 p.74}."
  fr: "Ibn Sina soutient que les plus grands muscles de la cuisse sont ceux qui la redressent, puis ceux qui la plient, puisque ces deux mouvements sont ses actions les plus nobles, le redressement étant le meilleur car il permet de se tenir debout {cite:canon-ibn-sina-print-v1 p.74}."
