label:
  ar: الرأسمالية في نقد قعدات
  en: Capitalism as criticised by Qa'dat
  es: "El capitalismo, según la crítica de Qa'dat"
  fr: "Le capitalisme critiqué par Qa'dat"
  ur: "سرمایہ داری جیسا کہ قدات نے تنقید کی۔"
  tr: "Toplanmaları Eleştirmede Kapitalizm"
  id: "Kapitalisme dalam Mengkritik Pertemuan"
summary:
  ar: "ينقد قعدات المذهب الرأسمالي لأن هدفه تحقيق الثروة والرفاهية المادية بحرية مطلقة للفرد، فيؤدي إلى الفوضى، ويلخّص ذلك بقولهم «دعه يعمل دعه يمر» {cite:qadan-manhaj-iqtisad-quran p. 13}. ويعدّ من نتائجه الصراع الطبقي بين العمال وأرباب العمل، وانتشار الاستغلال والاحتكار والرشوة والمحسوبية {cite:qadan-manhaj-iqtisad-quran p. 13}، وأن الأجير الكادح يستغل من الفجر حتى الليل بأجر زهيد {cite:qadan-manhaj-iqtisad-quran p. 14}. ويرى أنها والشيوعية وجهان لوثنية واحدة: الأولى تدور في فلك الفرد، والثانية في فلك المادة {cite:qadan-manhaj-iqtisad-quran p. 16}."
  tr: "Kapitalist doktrini eleştirir çünkü amacı birey için mutlak özgürlükle zenginlik ve maddi refah sağlamaktır, bu da kaosa yol açar ve bunu şöyle özetler: \"Bırak çalışsın, geçsin\" {cite:qadan-manhaj-iqtisad-kuran, s. 13}. Sonuçlarını işçiler ve işverenler arasındaki sınıf mücadelesi, sömürü, tekel, rüşvet ve kayırmacılığın yayılması {cite:qadan-manhaj-iqtisad-kur'an s. 13} ve çalışkan işçinin şafaktan geceye kadar az ücretle sömürüldüğünü (cite:qadan-manhaj-iqtisad-kur'an s. 14} olarak görür. Bunu aynı paganizmin iki yüzü olarak görür: ilki birey, ikincisi madde etrafında döner {cite:qadan-manhaj-iqtisad-kur'an s. 16}."
  id: "Ia mengkritik doktrin kapitalis karena tujuannya adalah memberikan kebebasan mutlak beserta kekayaan dan kemakmuran materi bagi individu, yang menyebabkan kekacauan dan merangkumnya sebagai: \"Biarkan dia bekerja, biarkan ia lewat\" {cite:qadan-manhaj-iqtisad-quran, hlm. 13}. Ia melihat hasilnya sebagai perjuangan kelas antara pekerja dan majikan, eksploitasi, monopoli, suap, dan penyebaran favoritisme {cite:qadan-manhaj-iqtisad-qur'an hlm. 13} serta eksploitasi pekerja keras dengan upah rendah dari fajar hingga malam (cite:qadan-manhaj-iqtisad-qur'an hlm. 14}). Ia melihat ini sebagai dua sisi dari paganisme yang sama: yang pertama berpusat pada individu, yang kedua pada materi {cite:qadan-manhaj-iqtisad-qur'an hlm. 16}."
