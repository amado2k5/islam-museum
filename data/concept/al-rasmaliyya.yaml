summary:
  ar: "ينقد قعدات المذهب الرأسمالي لأن هدفه تحقيق الثروة والرفاهية المادية بحرية مطلقة للفرد، فيؤدي إلى الفوضى، ويلخّص ذلك بقولهم «دعه يعمل دعه يمر» {cite:qadan-manhaj-iqtisad-quran p. 13}. ويعدّ من نتائجه الصراع الطبقي بين العمال وأرباب العمل، وانتشار الاستغلال والاحتكار والرشوة والمحسوبية {cite:qadan-manhaj-iqtisad-quran p. 13}، وأن الأجير الكادح يستغل من الفجر حتى الليل بأجر زهيد {cite:qadan-manhaj-iqtisad-quran p. 14}. ويرى أنها والشيوعية وجهان لوثنية واحدة: الأولى تدور في فلك الفرد، والثانية في فلك المادة {cite:qadan-manhaj-iqtisad-quran p. 16}."
