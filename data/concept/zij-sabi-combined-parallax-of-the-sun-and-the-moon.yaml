label: { ar: "اختلاف منظر الشمس والقمر معاً", en: "The combined parallax of the Sun and the Moon", ur: "سورج اور چاند کا مشترکہ اختلافِ منظر", es: "La paralaje combinada del Sol y la Luna" }
summary:
  ar: "يحسب البتاني اختلاف منظر القمر مع الشمس معاً في دائرة الارتفاع، فيأخذ اختلاف منظر الشمس من الجدول الثاني ويضيفه إلى اختلاف منظر القمر، أو يُنقص منه بحسب البُعد الأبعد والأقرب، فيكون المجموع هو الاختلاف المعتمد في الرصد. {cite:zij-sabi-nallino-byblion p.120}."
  en: "Al-Battani computes the parallax of the Moon together with the Sun in the altitude circle. He takes the Sun's parallax from the second table and adds it to the Moon's, or subtracts it according to whether the distance is the farthest or nearest; the total is the parallax used in observing. {cite:zij-sabi-nallino-byblion p.120}."
  ur: "البتانی سورج کے ساتھ چاند کا اختلافِ منظر دائرۂ ارتفاع میں ایک ساتھ حساب کرتے ہیں: سورج کا اختلافِ منظر دوسرے جدول سے لے کر چاند کے اختلاف میں جمع کرتے ہیں یا بُعدِ اَبعد اور اَقرب کے لحاظ سے گھٹاتے ہیں، تو حاصل رصد میں استعمال ہونے والا اختلاف ہے۔ {cite:zij-sabi-nallino-byblion p.120}۔"
  es: "Al-Battani calcula la paralaje de la Luna junto con la del Sol en el círculo de altitud. Toma la paralaje del Sol de la segunda tabla y la suma a la de la Luna, o la resta según la distancia sea la más lejana o la más cercana; el total es la paralaje utilizada en la observación. {cite:zij-sabi-nallino-byblion p.120}."
