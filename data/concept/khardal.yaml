summary:
  ar: "خردل في الكتاب بقلة معروفة حارة يابسة إلى الرابعة، تقطع البلغم ودهنه أسخن من دهن الفجل وتهرب الهوام من دخانه، والبري منه يولد خلطا رديئا، وفيه جلاء وتحليل، وينقي الوجه ويزيل الكهبة، ويحلل الأورام الحارة وكل ورم مزمن، وينفع من الجرب والقوابي ومن وجع المفاصل وعرق النسا ومن الحميات الدائرة والعتيقة، ويضعف الطحال ويعطش، ويذكر الكتاب فيه قولا عن اختناق الرحم والباه في فقرة موسومة معلقة لحكم المؤسس {cite:canon-ibn-sina-print-v1 p.702}"
  en: "Khardal is in the book a known pot-herb, hot and dry to the fourth degree, which cuts phlegm; its oil is hotter than radish oil and vermin flee its smoke, the wild kind generates a bad humour, and it cleanses and dissolves; it clears the face and removes bruise marks, dissolves hot swellings and every chronic swelling, benefits mange and ringworm, pain of the joints and sciatica, and periodic and old fevers, reduces the spleen and makes thirsty; the book gives a statement on suffocation of the womb and on desire in a labelled section held for the founder's ruling {cite:canon-ibn-sina-print-v1 p.702}"
  ur: "خردل کتاب میں ایک معروف ترکاری ہے، چوتھے درجے تک گرم خشک، بلغم کو کاٹتی ہے؛ اس کا تیل مولی کے تیل سے زیادہ گرم ہے اور موذی جانور اس کے دھوئیں سے بھاگتے ہیں، جنگلی قسم بری خلط پیدا کرتی ہے، اور اس میں جلا اور تحلیل ہے؛ چہرہ صاف کرتی ہے اور نیل کے نشان دور کرتی ہے، گرم ورموں اور ہر پرانے ورم کو تحلیل کرتی ہے، خارش اور قوباء، جوڑوں کے درد، عرق النسا اور باری کے اور پرانے بخاروں میں نافع ہے، تلی کو گھلاتی اور پیاس لگاتی ہے؛ کتاب رحم کے اختناق اور باہ کے بارے میں ایک بات موسوم حصے میں دیتی ہے جو بانی کے فیصلے کے لیے موقوف ہے {cite:canon-ibn-sina-print-v1 p.702}۔"
