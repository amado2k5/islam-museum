label: { ar: "هِرّ", en: "Hirr (the cat: purity, sale, damage and eating)" }
summary:
  ar: "الهر في اللغة القط الذكر، والأنثى هِرّة، وهو جنس من الفصيلة السنورية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16519} وذهب الجمهور من الحنفية والمالكية والشافعية والحنابلة إلى طهارة الهر، لقول النبي إنه ليس بنجس وإنه من الطوافين، وذهب بعض الحنفية منهم الطحاوي إلى نجاسته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16520} وسؤره طاهر عند الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16520} أما بوله وروثه فنجس عند الحنفية في أظهر الروايات، ونجس عند المالكية والشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16520} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16521} وجمهور الفقهاء على جواز بيع الهر لأنه طاهر منتفع به، وخص الشافعية الجواز بالهر الأهلي، وكرهه بعض العلماء ومنهم أبو هريرة ومجاهد، واستدلوا بحديث جابر في النهي عن ثمن الكلب والسنور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16521} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16522} وإذا أتلف الهر شيئاً ضمن صاحبه عند الحنابلة والشافعية في الأصح إن كان ذلك معهوداً منه، ويضمن في الليل دون النهار عند بعض الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16522} وللفقهاء تفصيل في قتل الهر الصائل، وفيه قول بأن الهر إذا خرج أذاه عن عادة القطط جاز قتله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16523} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16524} وأكل لحم الهر حرام عند جمهور الحنفية والمالكية في قول، وعند الحنابلة في الصحيح، لحديث تحريم كل ذي ناب من السباع، ويجيزه بعض الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16524}"
  en: "Hirr in the lexical sense is the male cat, with hirra for the female; it is a species of the feline family. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16519} The majority (Hanafis, Malikis, Shafi'is and Hanbalis) hold the cat pure, on the Prophet's words that it is not impure and is among those who go about you; a Hanafi view, that of al-Tahawi, holds it impure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16520} Its remnant (su'r) is pure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16520} Its urine and dung are impure in the sounder Hanafi narration, and impure for the Malikis and Shafi'is. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16520} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16521} Most jurists allow its sale as a pure animal of use; the Shafi'is limit that to the domestic cat, and some scholars, including Abu Hurayra and Mujahid, dislike it, citing the report of Jabir on the price of the dog and the cat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16521} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16522} The Hanbalis and the sounder Shafi'i view hold the owner liable for damage a habitually destructive cat causes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16522} On killing an attacking cat, the Shafi'is permit killing only when no lesser repulse works; a habitually harmful cat may be killed according to some Shafi'i and Maliki views. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16523} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16524} Eating its flesh is forbidden by most Hanafis, the Hanbalis in the sounder view and some Malikis, and allowed by some Shafi'is. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16524}"
