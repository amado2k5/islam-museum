label: { ar: "هِرّ", en: "Hirr (the cat: purity, sale, damage and eating)", es: "Hirr (el gato: pureza, venta, daños y alimentación)", fr: "Hirr (le chat: pureté, vente, dégâts et alimentation)", ur: "ہیر ⁦(بلی: پاکیزگی، فروخت، نقصان اور کھانا)⁩", tr: "Her", id: "Setiap" }
summary:
  ar: "الهر في اللغة القط الذكر، والأنثى هِرّة، وهو جنس من الفصيلة السنورية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16519} وذهب الجمهور من الحنفية والمالكية والشافعية والحنابلة إلى طهارة الهر، لقول النبي إنه ليس بنجس وإنه من الطوافين، وذهب بعض الحنفية منهم الطحاوي إلى نجاسته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16520} وسؤره طاهر عند الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16520} أما بوله وروثه فنجس عند الحنفية في أظهر الروايات، ونجس عند المالكية والشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16520} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16521} وجمهور الفقهاء على جواز بيع الهر لأنه طاهر منتفع به، وخص الشافعية الجواز بالهر الأهلي، وكرهه بعض العلماء ومنهم أبو هريرة ومجاهد، واستدلوا بحديث جابر في النهي عن ثمن الكلب والسنور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16521} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16522} وإذا أتلف الهر شيئاً ضمن صاحبه عند الحنابلة والشافعية في الأصح إن كان ذلك معهوداً منه، ويضمن في الليل دون النهار عند بعض الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16522} وللفقهاء تفصيل في قتل الهر الصائل، وفيه قول بأن الهر إذا خرج أذاه عن عادة القطط جاز قتله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16523} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16524} وأكل لحم الهر حرام عند جمهور الحنفية والمالكية في قول، وعند الحنابلة في الصحيح، لحديث تحريم كل ذي ناب من السباع، ويجيزه بعض الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16524}"
  en: "Hirr in the lexical sense is the male cat, with hirra for the female; it is a species of the feline family. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16519} The majority (Hanafis, Malikis, Shafi'is and Hanbalis) hold the cat pure, on the Prophet's words that it is not impure and is among those who go about you; a Hanafi view, that of al-Tahawi, holds it impure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16520} Its remnant (su'r) is pure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16520} Its urine and dung are impure in the sounder Hanafi narration, and impure for the Malikis and Shafi'is. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16520} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16521} Most jurists allow its sale as a pure animal of use; the Shafi'is limit that to the domestic cat, and some scholars, including Abu Hurayra and Mujahid, dislike it, citing the report of Jabir on the price of the dog and the cat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16521} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16522} The Hanbalis and the sounder Shafi'i view hold the owner liable for damage a habitually destructive cat causes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16522} On killing an attacking cat, the Shafi'is permit killing only when no lesser repulse works; a habitually harmful cat may be killed according to some Shafi'i and Maliki views. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16523} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16524} Eating its flesh is forbidden by most Hanafis, the Hanbalis in the sounder view and some Malikis, and allowed by some Shafi'is. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16524}"
  es: "Hirr en el sentido léxico es el gato macho, con hirra para la hembra; es una especie de la familia felina. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16519} La mayoría (Hanafis, Malikis, Shafi'is y Hanbalis) consideran al gato puro, en las palabras del Profeta de que no es impuro y está entre los que van a tu alrededor; una visión Hanafi, la de al-Tahawi, lo considera impuro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16520} Su remanente (su'r) es puro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16520} Su orina y estiércol son impuros en la narración Hanafi más sólida, e impuros para los Malikis y Shafi'is. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16520} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16521} La mayoría de los juristas permiten su venta como un animal de utilidad pura; los shafi'ís lo limitan al gato doméstico, y algunos eruditos, incluidos Abu Hurayra y Mujahid, lo desaprueban, citando el informe de Jabir sobre el precio del perro y el gato. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16521} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16522} Los hanbalíes y la visión shafi'í más sólida sostienen que el dueño es responsable por los daños que causa un gato habitualmente destructivo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16522} Sobre matar a un gato que ataca, los shafi'ís permiten matarlo solo cuando ningún otro método de repelencia menor funciona; un gato habitualmente dañino puede ser matado según algunas opiniones shafi'ís y malikíes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16523} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16524} Comer su carne está prohibido por la mayoría de los hanafíes, los hanbalíes en la opinión más sólida y algunos malikíes, y permitido por algunos shafi'ís. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16524}"
  fr: "Le terme « hirr » désigne le chat mâle, tandis que « hirra » désigne la femelle; il s’agit d’une espèce de félin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16519} La majorité des écoles de pensée (hanafites, malikites, chaféites et hanbalites) considèrent le chat comme pur, se fondant sur les paroles du Prophète selon lesquelles il n’est pas impur et fait partie de ceux qui vous entourent. L’avis hanafite d’al-Tahawi, quant à lui, le considère comme impur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16520} Ses restes (su’r) sont purs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16520} Selon la tradition hanafite, considérée comme la plus fiable, son urine et ses excréments sont impurs, de même que pour les écoles malikite et chaféite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16520} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16521} La plupart des juristes autorisent sa vente en tant qu'animal d'usage pur; les chaféites limitent cette autorisation au chat domestique, et certains savants, dont Abou Hourayra et Moujahid, s'y opposent, citant le hadith de Jabir sur le prix du chien et du chat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16521} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16522} Les hanbalites et l'avis plus solide des chaféites tiennent le propriétaire responsable des dommages causés par un chat ayant des comportements destructeurs habituels. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16522} Concernant la mise à mort d'un chat agressif, les shafi'ites n'autorisent l'abattage que lorsqu'aucune autre forme de riposte n'a permis d'obtenir gain de cause; un chat habituellement dangereux peut être tué selon certaines écoles shafi'ites et malikites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16523} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16524} La consommation de sa chair est interdite par la plupart des hanafites, les hanbalites (dans leur avis le plus solide) et certains malikites, et autorisée par certains shafi'ites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16524}"
  ur: "لغوی معنوں میں ہیر نر بلی ہے، جس میں مادہ کے لیے ہیرا ہے۔ یہ بلی کے خاندان کی ایک قسم ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 16519} جمہور ⁦(حنفیہ، مالکیہ، شافعی اور حنبلی)⁩ بلی کو پاک سمجھتے ہیں، نبی کے اس قول پر کہ یہ نجس نہیں ہے اور آپ کے بارے میں جانے والوں میں سے ہے۔ حنفی کے نزدیک الطحاوی کے نزدیک اسے نجس ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص16520} اس کا بقیہ ⁦(سعر)⁩ پاک ہے۔ اس کا پیشاب اور گوبر حنفی کی صحیح روایت میں نجس ہے اور مالکیوں اور شافعیوں کے نزدیک نجس ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16520} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16521} اکثر فقہاء اس کی فروخت کو خالص استعمال کے جانور کے طور پر اجازت دیتے ہیں۔ شافعی نے اسے گھریلو بلی تک محدود کیا ہے اور بعض علماء جن میں ابو ہریرہ اور مجاہد بھی شامل ہیں، کتے اور بلی کی قیمت کے بارے میں جابر کی روایت کا حوالہ دیتے ہوئے اسے ناپسند کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16521} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16522} حنبلی اور صوتی شافعی کا نظریہ مالک کو نقصان کا ذمہ دار ٹھہراتا ہے جو بلی کی عادت سے تباہ ہو جاتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16522} حملہ آور بلی کو مارنے پر، شافعی قتل کی اجازت صرف اس صورت میں دیتے ہیں جب کوئی کم تردید کام نہ آئے۔ بعض شافعی اور مالکی نظریات کے مطابق عادت سے نقصان دہ بلی کو مارا جا سکتا ہے۔ {حوالہ:فقہ الموسوعۃ کویتیہ نور-v3 ص16523} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص16524} اس کا گوشت کھانا اکثر احناف کے نزدیک حرام ہے، حنبلی صحیح کے نزدیک اور بعض مالکیہ نے اس کی اجازت دی ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 16524}"
  tr: "Dildeki kedi erkek kedi, dişi ise kedi ve Kedi familyasından bir cinstir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16519} Hanefilerin, Malikilerin, Şafiilerin ve Hanbalilerin çoğu kedinin saflığını korurdu; çünkü Peygamber, kedi kirli değildir ve çevre gezintileri arasında yer alır, bazı Hanefiler, El-Tahavi dahil, onu kirli saymıştır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.16520} Kürkü fıkıhlara göre saf kabul edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16520} İdrarı ve dışkısına gelince, Hanefi'ye göre en açık rivayetlere göre kirli, Maliki ve Şafii'lere göre ise kirlidir. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.16520} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16521} Çoğu hukukçu, kedi satmaya izin verir çünkü saf ve faydalıdır. Şafiilerin evcil kedilere sınırlı izin verilmesi gerekirken, Abu Huraira ve Mujahid gibi bazı alimler kedi sevmez ve Jabir'in köpeklerin ve kedilerin fiyatını yasaklayan hadislerini alıntılamıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16521} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16522} Hanbali ve Şafiilere göre, kedi bir şeye zarar verirse, en doğru görüş bunun geleneksel olup olup bazı Şafiilere göre gündüz yerine gece sorumlu olduğudur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16522} Hukukçular, yaklaşan bir kedinin öldürülmesini ayrıntılı olarak belirtmişlerdir; buna, kedinin zararı kedilerin alışkanlığından sapıyorsa, onu öldürmenin caiz olduğu görüşünü de belirtmişlerdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16523} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16524} Hanafi ve Malikilerin çoğunluğuna göre kedi eti yemek yasaktır; Sahih'teki Hanbalilere göre, hadisler herhangi bir dişli hayvanın hayvanlardan yasaklandığını ve bazı Şafiilerin buna izin verdiğini belirtir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16524}"
  id: "Kucing dalam bahasa ini adalah kucing jantan, dan betina adalah kucing, dan merupakan genus dari keluarga Feline. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16519} Mayoritas Hanafi, Maliki, Shafi'i, dan Hanbali memegang kemurnian kucing, karena Nabi berkata kucing itu tidak najis dan termasuk dalam pengelilingan, sementara beberapa Hanafi, termasuk Al-Tahawi, menganggapnya tidak murni. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16520} Bulunya dianggap murni menurut para ahli hukum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16520} Adapun urin dan kotorannya, menurut Hanafi menurut riwayat yang paling jelas, dan tidak murni menurut Maliki dan Shafi'i. {cite:fiqh-mawsua-kuwaitiya-noor-v3 hlm.16520} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.16521} Mayoritas ahli hukum mengizinkan menjual kucing karena kucing itu murni dan bermanfaat. Syafi'i memiliki izin terbatas untuk kucing domestik, sementara beberapa ulama, termasuk Abu Huraira dan Mujahid, tidak menyukainya, dan mengutip hadits Jabir yang melarang harga anjing dan anak kucing. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.16521} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16522} Jika kucing merusak sesuatu, menurut Hanbalis dan Shafi'i, pandangan paling benar adalah jika itu adat, dan ia bertanggung jawab pada malam hari bukan siang hari, menurut beberapa syafi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16522} Para ahli hukum telah merinci pembunuhan kucing yang mendekat, termasuk pendapat bahwa jika bahaya kucing menyimpang dari kebiasaan kucing, maka diizinkan untuk membunuhnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16523} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16524} Makan daging kucing dilarang menurut mayoritas Hanah dan Maliki, dan menurut Hanbalis dalam Sahih, karena hadis melarang hewan bertaring dari hewan, dan beberapa Shafi'i mengizinkannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16524}"
