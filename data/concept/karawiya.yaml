summary:
  ar: "الكراويا بزر نبات معروف، تشبه أغصانه وورقه الرجلة، وقوته قريبة من الأنيسون، وهي حارة يابسة في الثانية، تطرد الرياح وتقطع القيء وتهضم، وتنفع من الفواق والخفقان."
  en: "Karawiya is the seed of a known plant whose stems and leaves resemble purslane. Its force is close to that of anise. The book classes it as hot and dry in the second degree; it expels wind, stops vomiting that follows food, warms the stomach and helps digestion, and helps hiccup and palpitation."
  ur: "کراویا ایک معروف پودے کا بیج ہے جس کی ٹہنیاں اور پتے رجلہ سے ملتے ہیں۔ اس کی قوت سونف کے قریب ہے۔ کتاب اسے دوسرے درجے میں گرم اور خشک بتاتی ہے؛ یہ ہوا کو خارج کرتا، کھانے کے بعد کی قے کو روکتا، معدے کو گرم اور ہضم کرتا ہے، اور ہچکی اور دھڑکن میں فائدہ دیتا ہے۔"
  es: "Karawiya es la semilla de una planta conocida cuyos tallos y hojas se asemejan a la verdolaga. Su potencia es similar a la del anís. El libro la clasifica como caliente y seca de segundo grado; expulsa los gases, detiene los vómitos posteriores a las comidas, calienta el estómago y facilita la digestión, además de aliviar el hipo y las palpitaciones."
