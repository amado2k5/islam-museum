label:
  ar: "العدو الداخلي"
  en: "The inner enemy"
  ur: "اندرونی دشمن"
summary:
  ar: "يعدّد الشيخ عمر عبد الكافي أعداء الإنسان، ومنها النفس الأمارة بالسوء والهوى الغالب والغضب القاهر. ويذكر أن الأعداء الأربعة هم إبليس والدنيا والنفس والهوى، ويرى أن العبد يُعان على حفظ نفسه منها إذا كان مع الله."
  en: "Sheikh Omar Abdelkafy lists the enemies that work against a person, among them a soul that commands evil, a dominant desire and an overpowering anger. He names four enemies, Iblis, the world, the self and desire, and holds that a servant is helped to guard against them when he is with God."
  ur: "شیخ عمر عبدالکافی انسان کے دشمنوں کا ذکر کرتے ہیں، جن میں برائی کا حکم دینے والا نفس، غالب خواہش اور قاہر غصہ شامل ہیں۔ وہ چار دشمن بتاتے ہیں: ابلیس، دنیا، نفس اور خواہش، اور ان کی رائے ہے کہ بندہ اللہ کے ساتھ ہو تو ان سے بچنے میں اس کی مدد کی جاتی ہے۔"
