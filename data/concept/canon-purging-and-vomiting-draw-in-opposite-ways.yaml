summary:
  ar: "يقول ابن سينا إن الإسهال يجذب من فوق ويقلع من تحت فيوافق الجذبين المخالف والموافق، وإن القيء يفعل الجذب والقلع بالعكس، وإن أقل الناس حاجة إلى الاستفراغ جيد الغذاء جيد الهضم وأهل البلدان الحارة {cite:canon-ibn-sina-print-v1 p.276}."
  en: "Ibn Sina says purging draws from above and uproots from below, so it suits both the opposite and the same-side draw, while vomiting does the reverse; those least in need of evacuation are people of good food and good digestion and the people of hot countries {cite:canon-ibn-sina-print-v1 p.276}."
