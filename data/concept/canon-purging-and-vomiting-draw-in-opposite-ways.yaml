id: concept/canon-purging-and-vomiting-draw-in-opposite-ways
class: concept
kind: scientific
label:
  ar: "الإسهال والقيء جذباً وقلعاً عند ابن سينا"
  en: "How purging and vomiting draw and uproot in the Canon"
  fr: "Attraction et déracinement par purge et vomissement dans le Canon"
  ur: "قانون میں اسہال اور قے کا کھینچنا اور اکھاڑنا"
  es: "Cómo la purga y el vómito se arrastran y se desarraigan en el Canon"
  tr: "İbn Sina'ya göre çekim ve çıkarma yoluyla ishal ve kusma"
  id: "Diare dan muntah akibat ketertarikan dan pengangkatan menurut Ibn Sina"
summary:
  ar: "يقول ابن سينا إن الإسهال يجذب من فوق ويقلع من تحت فيوافق الجذبين المخالف والموافق، وإن القيء يفعل الجذب والقلع بالعكس، وإن أقل الناس حاجة إلى الاستفراغ جيد الغذاء جيد الهضم وأهل البلدان الحارة {cite:canon-ibn-sina-print-v1 p.276}."
  en: "Ibn Sina says purging draws from above and uproots from below, so it suits both the opposite and the same-side draw, while vomiting does the reverse; those least in need of evacuation are people of good food and good digestion and the people of hot countries {cite:canon-ibn-sina-print-v1 p.276}."
  fr: "Ibn Sina attribue à la purge attraction depuis le haut et déracinement depuis le bas, adaptés à directions opposée et homolatérale ; le vomissement ferait l’inverse. Bonne alimentation, bonne digestion et pays chauds diminueraient le besoin d’évacuation {cite:canon-ibn-sina-print-v1 p.276}."
  es: "Ibn Sina dice que la purga extrae desde arriba y desarraiga desde abajo, por lo que conviene tanto a la extracción del lado opuesto como a la del mismo lado, mientras que el vómito hace lo contrario; quienes menos necesitan evacuar son las personas que comen bien y tienen buena digestión, y las personas de países cálidos {cite:canon-ibn-sina-print-v1 p.276}."
  ur: "ابن سینا کا کہنا ہے کہ صاف کرنا اوپر سے کھینچتا ہے اور نیچے سے اکھڑتا ہے، اس لیے یہ مخالف اور ایک ہی طرف کی قرعہ اندازی کے لیے موزوں ہے، جبکہ قے الٹی ہوتی ہے۔ جن لوگوں کو انخلاء کی سب سے کم ضرورت ہے وہ اچھے کھانے اور اچھے ہاضمے والے لوگ ہیں اور گرم ممالک کے لوگ ہیں"
  tr: "İbn Sina, ishalin yukarıdan çekilip aşağıdan çıkarıldığını, bu yüzden zıt ve zıt çekimlerin uyumlu olduğunu ve kusmanın hem çekim hem de çekimin zıttını tetiklediğini söyler. Kusmaya en az ihtiyacı olanlar iyi beslenen, iyi sindirilebilir ve sıcak ülkelerden gelen insanlardır {cite:canon-ibn-sina-print-v1 s.276}."
  id: "Ibn Sina mengatakan bahwa diare ditarik dari atas dan diangkat dari bawah, sehingga daya tarik yang berlawanan dan berlawanan itu kompatibel, dan muntah menyebabkan daya tarik sekaligus menarik yang berlawanan. Yang paling tidak membutuhkan muntah adalah orang yang cukup gizi, mudah dicerna, dan dari negara-negara panas {cite:canon-ibn-sina-print-v1 hlm.276}."
