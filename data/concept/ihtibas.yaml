label: { ar: "احتباس", en: "Detention and retention (ihtibas)", es: "Detención y retención (ihtibas)", fr: "Détention et rétention (ihtibas)", ur: "نظربندی اور برقراری ⁦(احتیاط)⁩" }
summary:
  ar: "الاحتباس في اللغة المنع والحبس، والفرق بينه وبين الحجر أن الاحتباس منع لصالح المحتبِس، والحجر منع لصالح المحجور عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1716} وبينه وبين الحصر أن الحصر حبس مع تضييق، والاحتباس قد لا يتضمن تضييقاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1716} ومن احتبس إنساناً أو حيواناً وجبت عليه مؤنته، ومن آثاره وجوب النفقة للزوجة المحبوسة، وأجرة الأجير الخاص بمجرد الاحتباس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1717} وتكره الصلاة مع احتباس الريح أو البول والغائط، وتسن صلاة الاستسقاء عند احتباس المطر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1717}"
  en: "Ihtibas in the lexicon is restraint and holding back. It differs from hajr, interdiction, in that restraint serves the one who holds back, while interdiction serves the person interdicted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1716} It differs from hasr, confinement with constriction, in that restraint need not include constriction. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1716} Whoever detains a person or an animal owes its maintenance; this is why a wife held back is owed maintenance, and a private worker is owed his wage simply by being held available. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1717} Prayer with wind or excrement held back is disliked, and the rain prayer is sunna when rain is withheld. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1717}"
  es: "Ihtibas en el léxico es restricción y retención. Se diferencia de hajr, interdicción, en que la restricción sirve a quien retiene, mientras que la interdicción sirve a la persona interdictada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1716} Se diferencia de hasr, confinamiento con constricción, en que la restricción no tiene por qué incluir constricción. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1716} Quien retiene a una persona o un animal debe su manutención; por eso a una esposa retenida se le debe manutención, y a un trabajador privado se le debe su salario simplemente por estar disponible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1717} La oración con viento o excremento retenido es desaconsejable, y la oración de la lluvia es sunna cuando se retiene la lluvia. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1717}"
  fr: "Dans le lexique, « ihtibas » signifie retenue et interdiction. Ce terme diffère de « hajr », l'interdiction, en ce que la retenue profite à celui qui retient, tandis que l'interdiction profite à la personne interdite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1716} Il diffère également de « hasr », la détention avec contrainte, en ce que la retenue n'implique pas nécessairement de contrainte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1716} Quiconque retient une personne ou un animal doit subvenir à ses besoins; c'est pourquoi une épouse retenue a droit à une pension alimentaire, et un travailleur privé a droit à son salaire du simple fait d'être tenu à disposition. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1717} Il est déconseillé de prier en retenant ses gaz ou ses excréments, mais la prière de la pluie est sunna lorsqu'on retient la pluie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1717}"
  ur: "لغت میں احتباس تحمل اور روک تھام ہے۔ یہ ہجر، ممانعت سے مختلف ہے، اس میں روک تھام روکنے والے کی خدمت کرتی ہے، جب کہ پابندی روکے ہوئے شخص کی خدمت کرتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1716} یہ حشر سے مختلف ہے، بندش کے ساتھ، اس میں پابندی کی ضرورت نہیں ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1716} جس نے کسی شخص یا جانور کو حراست میں لیا اس پر اس کی کفالت واجب ہے۔ یہی وجہ ہے کہ جو بیوی کو روکا گیا ہے اس پر نان نفقہ واجب الادا ہے، اور ایک پرائیویٹ ورکر کو صرف دستیاب رہنے پر اس کی اجرت واجب الادا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1717} ہوا یا فضلہ کو روک کر نماز پڑھنا مکروہ ہے اور بارش رک جانے پر بارش کی نماز سنت ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص1717}"
