id: concept/ihtibas
class: concept
kind: legal
label: { ar: "احتباس", en: "Detention and retention (ihtibas)" }
summary:
  ar: "الاحتباس في اللغة المنع والحبس، والفرق بينه وبين الحجر أن الاحتباس منع لصالح المحتبِس، والحجر منع لصالح المحجور عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1716} وبينه وبين الحصر أن الحصر حبس مع تضييق، والاحتباس قد لا يتضمن تضييقاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1716} ومن احتبس إنساناً أو حيواناً وجبت عليه مؤنته، ومن آثاره وجوب النفقة للزوجة المحبوسة، وأجرة الأجير الخاص بمجرد الاحتباس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1717} وتكره الصلاة مع احتباس الريح أو البول والغائط، وتسن صلاة الاستسقاء عند احتباس المطر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1717}"
  en: "Ihtibas in the lexicon is restraint and holding back. It differs from hajr, interdiction, in that restraint serves the one who holds back, while interdiction serves the person interdicted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1716} It differs from hasr, confinement with constriction, in that restraint need not include constriction. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1716} Whoever detains a person or an animal owes its maintenance; this is why a wife held back is owed maintenance, and a private worker is owed his wage simply by being held available. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1717} Prayer with wind or excrement held back is disliked, and the rain prayer is sunna when rain is withheld. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1717}"
