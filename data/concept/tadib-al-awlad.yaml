id: concept/tadib-al-awlad
class: concept
kind: ethical
label:
  ar: "تأديب الأولاد"
  en: "Disciplining children (ta'dib al-awlad)"
  ur: "بچوں کی تادیب"
  es: "Disciplinar a los niños (ta'dib al-awlad)"
  fr: "Discipliner les enfants (ta'dib al-awlad)"
  tr: "Çocukları Disipline Etmek"
  id: "Mendisiplinkan Anak-anak"
summary:
  ar: "تأديب الأولاد وعقوبتهم في التربية، كما يعرضه عبد الرحمن منصور في برنامج «أهالينا»: عقوبة هادفة غير انتقامية، متدرجة من النصح والإرشاد إلى الإعراض والزجر والهجر ثلاثة أيام والتوبيخ وتعليق السوط، ثم الضرب الخفيف آخر الوسائل، لا قبل العاشرة، مع التفريق بين ضرب التأديب وضرب الانتقام."
  en: "Disciplining and punishing children in upbringing, as Abd al-Rahman Mansour presents it in the programme 'Ahalina': punishment with an aim and not in revenge, graded from advice and guidance to turning away, a stern rebuke, shunning for up to three days, reprimand and hanging up the whip, and a light smack only as the last resort and never before the age of ten, with a distinction between striking to discipline and striking in revenge."
  ur: "تربیت میں بچوں کی تادیب اور سزا، جیسا کہ عبد الرحمٰن منصور پروگرام «اہالینا» میں بیان کرتے ہیں: بامقصد سزا جو انتقام نہ ہو، نصیحت اور رہنمائی سے منہ پھیرنے، جھڑکنے، تین دن تک قطع کلامی، سرزنش اور کوڑا لٹکانے تک درجہ بدرجہ، اور ہلکی مار صرف آخری چارہ کے طور پر اور دس سال سے پہلے کبھی نہیں، تادیب کی مار اور انتقام کی مار کے فرق کے ساتھ۔"
  es: "La disciplina y el castigo de los niños durante su crianza, tal como los presenta Abd al-Rahman Mansour en el programa 'Ahalina', consisten en un castigo con un propósito y no por venganza, que va desde el consejo y la orientación hasta el rechazo, una reprimenda severa, el ostracismo durante un máximo de tres días, la amonestación y el castigo físico, y una nalgada leve solo como último recurso y nunca antes de los diez años, con una distinción entre golpear para disciplinar y golpear por venganza."
  fr: "L'éducation des enfants, telle que présentée par Abd al-Rahman Mansour dans l'émission « Ahalina »: une punition intentionnelle et non vengeresse, graduée allant du conseil et de l'orientation à l'abandon, une réprimande sévère, la mise à l'écart pendant trois jours maximum, le blâme et le rangement du fouet, et une légère fessée seulement en dernier recours et jamais avant l'âge de dix ans, avec une distinction entre frapper pour discipliner et frapper par vengeance."
  tr: "Abdel Rahman Mansour'un \"Ahalina\" programında sunduğu gibi, çocukların disiplin ve yetiştirilme cezası ile yetiştirilmeleri: tavsiye ve rehberlikten geri dönmeye, azarlamaya, üç gün terk edilmeye, azarlamaya, kırbaç asmaya ve son çare olarak hafif dayağa kadar değişen, disiplin dayağı ile intikam arasında ayrım yapan kasıtlı, misilleme içermeyen bir ceza."
  id: "Mendisiplinkan anak dan hukuman mereka dalam masa kecil, seperti yang disajikan Abdel Rahman Mansour dalam program \"Ahalina\": hukuman yang disengaja, tanpa pembalasan, mulai dari nasihat dan bimbingan hingga berbalik, menegur, meninggalkan selama tiga hari, menegur, menggantung cambuk, lalu memukul ringan sebagai upaya terakhir, tidak sebelum pukul sepuluh, dengan perbedaan antara pemukulan disipliner dan balas dendam."
