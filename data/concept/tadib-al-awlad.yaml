id: concept/tadib-al-awlad
class: concept
kind: ethical
label:
  ar: "تأديب الأولاد"
  en: "Disciplining children (ta'dib al-awlad)"
  ur: "بچوں کی تادیب"
summary:
  ar: "تأديب الأولاد وعقوبتهم في التربية، كما يعرضه عبد الرحمن منصور في برنامج «أهالينا»: عقوبة هادفة غير انتقامية، متدرجة من النصح والإرشاد إلى الإعراض والزجر والهجر ثلاثة أيام والتوبيخ وتعليق السوط، ثم الضرب الخفيف آخر الوسائل، لا قبل العاشرة، مع التفريق بين ضرب التأديب وضرب الانتقام."
  en: "Disciplining and punishing children in upbringing, as Abd al-Rahman Mansour presents it in the programme 'Ahalina': punishment with an aim and not in revenge, graded from advice and guidance to turning away, a stern rebuke, shunning for up to three days, reprimand and hanging up the whip, and a light smack only as the last resort and never before the age of ten, with a distinction between striking to discipline and striking in revenge."
  ur: "تربیت میں بچوں کی تادیب اور سزا، جیسا کہ عبد الرحمٰن منصور پروگرام «اہالینا» میں بیان کرتے ہیں: بامقصد سزا جو انتقام نہ ہو، نصیحت اور رہنمائی سے منہ پھیرنے، جھڑکنے، تین دن تک قطع کلامی، سرزنش اور کوڑا لٹکانے تک درجہ بدرجہ، اور ہلکی مار صرف آخری چارہ کے طور پر اور دس سال سے پہلے کبھی نہیں، تادیب کی مار اور انتقام کی مار کے فرق کے ساتھ۔"
