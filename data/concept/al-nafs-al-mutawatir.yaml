id: concept/al-nafs-al-mutawatir
class: concept
kind: scientific
label:
  ar: "النفس المتواتر"
  en: "The frequent breath"
  fr: "La respiration fréquente"
  ur: "متواتر سانس"
  es: "La respiración frecuente"
  tr: "Tekrarlanan Nefes"
  id: "Pernapasan Berulang"
summary:
  ar: "النفس المتواتر هو الذي يقصر الزمان بينه وبين الذي قبله ومن أسبابه شدة الحاجة إذا لم تنقض بالعظم والسرعة لأنها أكثر من البلوغ إليه بهما لأن دونهما حائل من وجع أو ورم أو ضيق لمواد كثيرة أو انضغاط أو انصباب قيح أو شيء آخر من أسباب الضيق، والنفس المتواتر على ما شهد أبقراط يستتبع آفة لتجفيف الرئة وأتعاب أعضاء النفس ⁦(قول منسوب على لفظ الكتاب)⁩ {cite:canon-ibn-sina-print-v2 p.311}"
  en: "The frequent breath is the breath where the time between it and the one before is short; among its causes is the need's intensity when it is not finished off by largeness and swiftness — for the need is more than what those two can reach, since short of them stands a bar: a pain, a tumour, a narrowness from many matters, a compression, a pouring-in of pus, or another of the narrowness's causes. The frequent breath — as Hippocrates testified — entails a harm, for the drying of the lung and the tiring of the breath's organs (a saying carried on the book's wording) {cite:canon-ibn-sina-print-v2 p.311}"
  fr: "La respiration fréquente est celle où le temps entre elle et la précédente est court ; parmi ses causes figure l'intensité du besoin lorsqu'il n'est pas satisfait par la grandeur et la rapidité, car le besoin dépasse ce que ces deux peuvent atteindre, puisqu'en deçà d'elles se dresse un obstacle : une douleur, une tuméfaction, une étroitesse due à des matières abondantes, une compression, un épanchement de pus, ou une autre des causes de l'étroitesse. La respiration fréquente, comme Hippocrate en a témoigné, entraîne un dommage, en raison du dessèchement du poumon et de la fatigue des organes de la respiration (propos rapporté selon la formulation du livre) {cite:canon-ibn-sina-print-v2 p.311}"
  ur: "متواتر سانس وہ ہے جس میں اس اور اس سے پہلی سانس کے درمیان زمانہ کم ہوتا ہے؛ اس کے اسباب میں ضرورت کی شدت ہے جب وہ بڑائی اور تیزی سے پوری نہ ہو کیونکہ ضرورت ان دونوں کی پہنچ سے زیادہ ہے اور ان کے آگے کوئی حائل کھڑا ہے: درد سوجن کثیر مواد کی تنگی دباؤ صديد کا انصباب یا تنگی کا کوئی اور سبب؛ اور متواتر سانس — جیسا کہ بقراط نے گواہی دی — آفت کا پیروکار ہوتی ہے پھیپھڑے کے خشک ہونے اور تنفس کے اعضاء کے تھک جانے کی وجہ سے ⁦(کتاب کے لفظ پر منسوب قول)⁩ {cite:canon-ibn-sina-print-v2 p.311}"
  es: "La respiración frecuente es aquella en la que el tiempo entre una y otra es corto; entre sus causas se encuentra la intensidad de la necesidad cuando no se satisface con amplitud y rapidez, pues la necesidad es mayor de lo que estas dos pueden abarcar, ya que antes de ellas hay un obstáculo: un dolor, un tumor, una constricción por diversas causas, una compresión, la supuración de pus u otra causa de la constricción. La respiración frecuente —como atestiguó Hipócrates— conlleva un daño, pues reseca los pulmones y fatiga los órganos respiratorios (un dicho que se conserva en la redacción del libro) {cite:canon-ibn-sina-print-v2 p.311}."
  tr: "Mutawatir ruhu, kendisi ile öncekinden önceki ruh arasındaki zamanı kısaltan kişidir. Nedenlerinden biri, kemik ve hızla onu ele geçirmezse yoğun ihtiyaçtır; çünkü aralarında ağrı, şişlik, birçok maddenin daralması, basınç, irin akıntısı veya diğer sıkıntı nedenleri gibi bir bariyer vardır. Hipokrat'a göre, mutawatir ruh akciğerlerin susuzlaşması ve ruhun organlarının acı çekmesiyle sonuçlanır (bu ifade kitabın metnine atfedilmiştir) {cite:canon-ibn-sina-print-v2 s.311}"
  id: "Roh mutawatir adalah orang yang memperpendek waktu antara dirinya dan roh sebelumnya. Salah satu alasannya adalah kebutuhan yang sangat kuat jika tulang tidak segera mengambil alih; karena ada penghalang di antara mereka seperti rasa sakit, pembengkakan, penyempitan banyak zat, tekanan, keluarnya nanah, atau penyebab stres lainnya. Menurut Hippocrates, roh mutawatir menyebabkan dehidrasi paru-paru dan penderitaan organ jiwa (ungkapan ini dikaitkan dengan teks buku) {cite:canon-ibn-sina-print-v2 hlm.311}"
