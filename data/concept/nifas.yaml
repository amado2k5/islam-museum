label: { ar: "النِّفَاس", en: "Nifas (postnatal bleeding)", ur: "نفاس (زچگی کے بعد کا خون)" }
summary:
  ar: "النفاس في اللغة ولادة المرأة، واصطلاحاً الدم الخارج عقب الولادة عند الحنفية والشافعية، وعند المالكية الدم الخارج لأجل الولادة، وعند الحنابلة الدم الذي ترخيه الرحم مع الولادة وقبلها بيومين أو ثلاثة بأمارة وبعدها إلى تمام أربعين يوماً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15834} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15835} والنفاس دم صحيح يشبه الحيض، ويفارق الاستحاضة التي هي دم فساد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15835} ولا خلاف في أن ما يخرج بعد انفصال الولد نفاس، واختلفوا في الدم قبل الولادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15837} وأكثر مدته عند الجمهور أربعون يوماً، وعند الشافعية والمالكية في المشهور ستون يوماً، ولا حد لأقله عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15836} ويحرم على النفساء ما يحرم على الحائض من الصلاة والصوم، مع قضاء الصوم دون الصلاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15846}"
  en: "Nifas, in the lexicon, is a woman's childbirth. As a term, the Hanafis and Shafi'is define it as the blood that comes after birth; the Malikis as the blood that comes because of the birth; the Hanbalis as blood the womb sheds with the birth and two or three days before it, with a sign such as pain, and afterwards up to forty days. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15834} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15835} It is sound blood, like menstruation, and differs from istihada, which is blood of disease. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15835} Blood after the child is separated is nifas by agreement, and blood before birth is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15837} Most jurists set its longest period at forty days; the Shafi'is and the prevailing Malikis at sixty; most hold that it has no minimum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15836} A woman in nifas is forbidden what a menstruating woman is forbidden: prayer and fasting, with the fasts made up but not the prayers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15846}"
  ur: "نفاس لغت میں زچگی کو کہتے ہیں۔ اصطلاح میں حنفیہ اور شافعیہ کے نزدیک ولادت کے بعد نکلنے والا خون، مالکیہ کے نزدیک ولادت کی وجہ سے نکلنے والا خون، اور حنابلہ کے نزدیک ولادت اور اس سے دو تین دن پہلے کا خون جو علامت کے ساتھ ہو، اور اس کے بعد چالیس دن تک۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15834} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15835} یہ صحیح خون ہے جو حیض کی طرح ہے، جبکہ استحاضہ فاسد خون ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15835} جمہور کے نزدیک زیادہ سے زیادہ مدت چالیس دن ہے، اور شافعیہ اور مشہور مالکی قول میں ساٹھ دن۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15836} نفساء پر وہی پابندیاں ہیں جو حائضہ پر ہیں: نماز اور روزہ منع ہے، روزے کی قضا ہے نماز کی نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15846}"
