summary:
  ar: "الأحوال الأربعة للمؤمن كما يعرضها الشيخ عمر عبد الكافي: الشكر عند العطاء، والصبر عند المنع، والتذكر عند العلم والذكر، والتوقف عن المعصية؛ وأن الطاعة تقتضي الشكر، والمعصية الاستغفار، والنعمة التواضع."
  en: "The four states of the believer as Sheikh Omar Abdelkafy presents them: giving thanks at a gift, patience at a withholding, remembrance at knowledge and recollection, and stopping from sin; obedience calls for thanks, disobedience for seeking forgiveness, and blessing for humility."
  fr: "Les quatre états du croyant selon le cheikh Omar Abdelkafy : remercier quand on reçoit, patienter quand on ne reçoit pas, se remémorer à l’occasion du savoir et du rappel, et se détourner du péché. L’obéissance appelle la gratitude, la désobéissance la demande de pardon, et les bienfaits l’humilité."
  ur: "شیخ عمر عبدالکافی کے بیان کے مطابق مومن کے چار احوال: عطا پر شکر، منع پر صبر، علم اور ذکر پر یاد، اور گناہ سے رک جانا؛ اطاعت شکر کو، نافرمانی استغفار کو، اور نعمت تواضع کو چاہتی ہے۔"
  es: "Los cuatro estados del creyente, tal como los presenta el jeque Omar Abdelkafy: dar gracias por un regalo, tener paciencia ante una renuncia, recordar ante el conocimiento y la reflexión, y abstenerse del pecado; la obediencia exige agradecimiento, la desobediencia, buscar el perdón, y la bendición, humildad."
  tr: "Şeyh Ömer Abdul Kafi tarafından sunulan bir mümin dört hali: verirken şükran, vermediğinde sabır, bilgi ve hatırlamada anma ve günahtan kaçınma; itaat şükran gerektirir, günah af aramayı gerektirir ve bereket alçakgönüllülüktür."
  id: "Seorang mukmin disajikan oleh Sheikh Umar Abdul Kafi: rasa syukur saat memberi, kesabaran saat tidak memberi, mengingat pengetahuan dan ingatan, serta menghindari dosa; ketaatan membutuhkan rasa syukur, dosa membutuhkan pencarian pengampunan, dan berkat adalah kerendahan hati."
