summary:
  ar: "الأحوال الأربعة للمؤمن كما يعرضها الشيخ عمر عبد الكافي: الشكر عند العطاء، والصبر عند المنع، والتذكر عند العلم والذكر، والتوقف عن المعصية؛ وأن الطاعة تقتضي الشكر، والمعصية الاستغفار، والنعمة التواضع."
  en: "The four states of the believer as Sheikh Omar Abdelkafy presents them: giving thanks at a gift, patience at a withholding, remembrance at knowledge and recollection, and stopping from sin; obedience calls for thanks, disobedience for seeking forgiveness, and blessing for humility."
  ur: "شیخ عمر عبدالکافی کے بیان کے مطابق مومن کے چار احوال: عطا پر شکر، منع پر صبر، علم اور ذکر پر یاد، اور گناہ سے رک جانا؛ اطاعت شکر کو، نافرمانی استغفار کو، اور نعمت تواضع کو چاہتی ہے۔"
