id: concept/al-minha-fi-al-mihna
class: concept
kind: belief
label:
  ar: "المنحة في المحنة"
  en: "The gift within the trial (al-minha fi al-mihna)"
  fr: "Le don au cœur de l'épreuve (al-minha fi al-mihna)"
  ur: "آزمائش میں عطا"
  es: "El don dentro de la prueba (al-minha fi al-mihna)"
  tr: "Zor Durumdaki Burs"
  id: "Beasiswa dalam Kesulitan"
summary:
  ar: "يعرض عمر عبد الكافي، انطلاقًا من آية «وعسى أن تكرهوا شيئًا وهو خير لكم»، أن ظاهر الأمور غير باطنها، ويستشهد بقصص أم موسى وموسى ويوسف وهاجر وأم سلمة على أن المنحة قد تكون داخل المحنة."
  en: "Starting from the verse 'it may be that you dislike a thing while it is good for you', Omar Abdelkafy sets out that the outward appearance of events differs from their inner reality, citing the stories of Musa's mother, Musa, Yusuf, Hajar and Umm Salama to show that the gift may lie within the trial."
  fr: "Partant du verset selon lequel il se peut qu'une chose nous déplaise alors qu'elle est bonne pour nous, Omar Abdelkafy explique que l'apparence des événements diffère de leur réalité profonde. Il s'appuie sur les récits de la mère de Moïse, de Moïse, de Joseph, de Hagar et d'Umm Salama pour montrer que le don peut se trouver au cœur même de l'épreuve."
  ur: "آیت «ہو سکتا ہے تم کسی چیز کو ناپسند کرو اور وہ تمہارے لیے بہتر ہو» سے آغاز کر کے عمر عبد الکافی بیان کرتے ہیں کہ معاملات کا ظاہر ان کے باطن سے مختلف ہوتا ہے، اور ام موسیٰ، موسیٰ، یوسف، ہاجرہ اور ام سلمہ کے قصوں سے دکھاتے ہیں کہ عطا آزمائش کے اندر ہو سکتی ہے۔"
  es: "Partiendo del versículo \"puede que algo te desagrade aunque sea bueno para ti\", Omar Abdelkafy expone que la apariencia externa de los acontecimientos difiere de su realidad interna, citando las historias de la madre de Musa, Musa, Yusuf, Hajar y Umm Salama para demostrar que el don puede residir en la prueba."
  tr: "Ömer Abdelkafi, \"Ve belki de senin için iyi olan bir şeyi sevmezsin\" dizesine dayanarak, işin görünen yönünün gizli olmadığını ortaya koyar; Musa'nın annesi, Musa, Yusuf, Heger ve um Salama'nın hikayelerini örnekleyerek armağanın bu sınavın içinde olabileceğini gösterir."
  id: "Berdasarkan kalimat \"Dan mungkin kamu tidak suka sesuatu yang baik untukmu,\" Omar Abdelkafi mengungkapkan bahwa aspek yang terlihat dari masalah itu tidak disembunyikan; misalnya, ibu Musa, Musa, Yusuf, Eger, dan um Salama, dia menunjukkan bahwa anugerah itu bisa menjadi bagian dari ujian ini."
