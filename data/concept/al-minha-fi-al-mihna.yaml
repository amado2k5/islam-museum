label:
  ar: "المنحة في المحنة"
  en: "The gift within the trial (al-minha fi al-mihna)"
  ur: "آزمائش میں عطا"
summary:
  ar: "يعرض عمر عبد الكافي، انطلاقًا من آية «وعسى أن تكرهوا شيئًا وهو خير لكم»، أن ظاهر الأمور غير باطنها، ويستشهد بقصص أم موسى وموسى ويوسف وهاجر وأم سلمة على أن المنحة قد تكون داخل المحنة."
  en: "Starting from the verse 'it may be that you dislike a thing while it is good for you', Omar Abdelkafy sets out that the outward appearance of events differs from their inner reality, citing the stories of Musa's mother, Musa, Yusuf, Hajar and Umm Salama to show that the gift may lie within the trial."
  ur: "آیت «ہو سکتا ہے تم کسی چیز کو ناپسند کرو اور وہ تمہارے لیے بہتر ہو» سے آغاز کر کے عمر عبد الکافی بیان کرتے ہیں کہ معاملات کا ظاہر ان کے باطن سے مختلف ہوتا ہے، اور ام موسیٰ، موسیٰ، یوسف، ہاجرہ اور ام سلمہ کے قصوں سے دکھاتے ہیں کہ عطا آزمائش کے اندر ہو سکتی ہے۔"
