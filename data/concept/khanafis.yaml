summary:
  ar: "خنافس في الكتاب مدخل قصير يقول إن زيتها نافع لوجع الأذن إذا صب فيه، وكذلك أجرامها مسحوقة؛ نقل منسوب إلى الكتاب لا توصية {cite:canon-ibn-sina-print-v1 p.715}"
  en: "Khanafis is in the book a short entry which says that its oil benefits ear pain when poured in, and likewise its bodies powdered; a report attributed to the book, not a recommendation {cite:canon-ibn-sina-print-v1 p.715}"
  ur: "خنافس کتاب میں ایک مختصر اندراج ہے جس میں کہا گیا ہے کہ ان کا تیل کان کے درد میں ڈالنے سے نافع ہے، اور اسی طرح ان کے جسم پسے ہوئے؛ کتاب سے منسوب نقل، سفارش نہیں {cite:canon-ibn-sina-print-v1 p.715}۔"
  es: "En el libro, Khanafis aparece brevemente diciendo que su aceite alivia el dolor de oído al aplicarlo, y también sus cuerpos en polvo; un informe atribuido al libro, no una recomendación {cite:canon-ibn-sina-print-v1 p.715}."
