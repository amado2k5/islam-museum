id: concept/bir-hayawan
class: concept
kind: natural
label:
  ar: "بعر الحيوان"
  en: "Bi'r hayawan (animal dung)"
  fr: "Bi'r hayawan (excréments animaux)"
  ur: "بعرِ حیوان ⁦(جانوروں کی مینگنی)⁩"
summary:
  ar: "بعر الضبّ والجمل والماعز والغنم، يُستعمل للبرص والكلف والحزاز والرعاف والبثور والقروح والخنازير والحمّى وأوجاع المفاصل، والنزف، وبعر الماعز يابساً بصوفة يمنع سيلان الرحم، ويُذكر للسموم أيضاً {cite:canon-ibn-sina-print-v1 p.413}، {cite:canon-ibn-sina-print-v1 p.414}."
  en: "The dung of the lizard, camel, goat and sheep, used for white patches, freckles, lichen, nosebleed, pustules, ulcers, scrofula, fever and joint pain. The book also lists dried goat dung with wool for stopping a uterine discharge, and uses against poisons {cite:canon-ibn-sina-print-v1 p.413}, {cite:canon-ibn-sina-print-v1 p.414}."
  fr: "Excréments de lézard, chameau, chèvre et mouton, employés contre taches blanches, taches de rousseur, lichen, saignements de nez, pustules, ulcères, scrofules, fièvre et douleurs articulaires. Le livre mentionne aussi les crottes sèches de chèvre avec laine pour arrêter un écoulement utérin et des usages contre les poisons {cite:canon-ibn-sina-print-v1 p.413}, {cite:canon-ibn-sina-print-v1 p.414}."
  ur: "گوہ، اونٹ، بکری اور بھیڑ کی مینگنی، جو برص، جھائیوں، کائی کی بیماری، ناک کے خون، پھنسیوں، زخموں، غدودی سختی، بخار اور جوڑوں کے درد میں استعمال ہوتی ہے۔ کتاب خشک بکری کی مینگنی کو اون کے ساتھ رحم کے بہاؤ روکنے کے لیے، اور زہروں کے لیے بھی بیان کرتی ہے {cite:canon-ibn-sina-print-v1 p.413}، {cite:canon-ibn-sina-print-v1 p.414}۔"
