id: concept/shudhudh-irregularity
class: concept
kind: legal
label:
  ar: "الشُّذوذ"
  en: "Shudhudh (an irregular view or report, and acting on it)"
  es: "Shudhudh (una opinión o informe irregular, y actuar en consecuencia)"
  fr: "Shudhudh (un avis ou un rapport irrégulier, et agir en conséquence)"
  ur: "شدھود ⁦(ایک غیر منظم نقطہ نظر یا رپورٹ، اور اس پر عمل کرنا)⁩"
summary:
  ar: "الشذوذ في اللغة الانفراد عن الغير، والشاذ المنفرد أو الخارج عن الجماعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9930} والشاذ في اصطلاح الحنفية والمالكية ما قابل المشهور أو الراجح أو الصحيح، وعند المحدثين ما ليس له إلا إسناد واحد يشذ به ثقة أو غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9930} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9931} ويختلف حكم العمل بالقول الشاذ بحسب المجتهد والمقلد والعامي، فالمجتهد يرجح بالدليل، والمقلد لا يعمل إلا بالمشهور أو الراجح في مذهبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9933} وذهب الشاطبي إلى أن المقلد لا يفتي إلا بالمشهور، وقال السبكي إن للحاكم الأهل أن يحكم بما ترجح عنده من المنقول بدليل جيد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9934}"
  en: "In language shudhudh is separation from others, and a shadh is one who stands apart or leaves the group. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9930} In the usage of the Hanafis and Malikis a shadh view is one opposed to the prominent, preferred or sound view; in the usage of the hadith scholars a shadh report has a single chain in which a reliable or unreliable narrator stands alone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9930} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9931} Acting on a shadh view differs for the mujtahid, the follower and the layman: the mujtahid weighs the evidence, while the follower acts only on the prominent or preferred view of his school. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9933} Al-Shatibi holds that a follower may give a fatwa only on the prominent view, while al-Subki holds that a qualified judge may rule by a view he finds stronger on good evidence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9934}"
  es: "En el lenguaje, shudhudh es separación de los demás, y shadh es aquel que se aparta o abandona el grupo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9930} En el uso de los hanafíes y malikíes, una opinión shadh es aquella que se opone a la opinión prominente, preferida o sólida; en el uso de los eruditos del hadiz, un informe shadh tiene una sola cadena en la que un narrador fiable o no fiable se encuentra solo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9930} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9931} Actuar según una opinión shadh difiere para el mujtahid, el seguidor y el laico: el mujtahid sopesa la evidencia, mientras que el seguidor actúa solo según la opinión prominente o preferida de su escuela. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9933} Al-Shatibi sostiene que un seguidor solo puede emitir una fatwa sobre la opinión predominante, mientras que al-Subki sostiene que un juez calificado puede dictaminar sobre la opinión que considere más sólida con base en buenas pruebas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9934}"
  fr: "En linguistique, « shudhudh » signifie séparation d'avec les autres, et « shadh » désigne celui qui se tient à l'écart ou quitte le groupe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9930} Chez les Hanafites et les Malikites, une opinion « shadh » est une opinion opposée à l'opinion majoritaire, privilégiée ou considérée comme saine; chez les spécialistes du hadith, un hadith « shadh » est un récit dont la chaîne de transmission est unique et où un narrateur, fiable ou non, est isolé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9930} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9931} La conduite à tenir face à une opinion « shadh » diffère selon le mujtahid, le disciple et le profane: le mujtahid examine les preuves, tandis que le disciple se fonde uniquement sur l'opinion majoritaire ou privilégiée de son école. Al-Shatibi soutient qu'un adepte ne peut émettre une fatwa que sur la base de l'avis majoritaire, tandis qu'al-Subki estime qu'un juge compétent peut statuer selon l'avis qu'il juge le plus solide sur la base de preuves convaincantes."
  ur: "زبان میں شھد دوسروں سے علیحدگی کو کہتے ہیں، اور شھد وہ ہے جو الگ ہو جائے یا گروہ سے الگ ہو جائے۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 9930} حنفیہ اور مالکیوں کے استعمال میں شد قول ممتاز، ترجیحی یا صحیح قول کے مخالف ہے۔ علمائے حدیث کے استعمال میں شھد کی رپورٹ میں ایک سلسلہ ہوتا ہے جس میں معتبر یا غیر معتبر راوی اکیلا کھڑا ہوتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9930} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9931} مجتہد، مقلد اور عام آدمی کے لیے شدّ کے قول پر عمل کرنا مختلف ہوتا ہے: مجتہد اپنے قول یا عمل کو تولتا ہے، جب کہ اس کی پیروی کرنے والے کے قول پر عمل ہوتا ہے۔ اسکول {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9931} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9933} الشاطبی کا خیال ہے کہ پیروکار صرف نمایاں قول پر فتویٰ دے سکتا ہے، جب کہ السبکی کا خیال ہے کہ اس کے نزدیک قوی دلیل ہے کہ وہ اچھے قول پر فتویٰ دے سکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9932}"
