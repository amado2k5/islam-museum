id: concept/shudhudh-irregularity
class: concept
kind: legal
label:
  ar: "الشُّذوذ"
  en: "Shudhudh (an irregular view or report, and acting on it)"
summary:
  ar: "الشذوذ في اللغة الانفراد عن الغير، والشاذ المنفرد أو الخارج عن الجماعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9930} والشاذ في اصطلاح الحنفية والمالكية ما قابل المشهور أو الراجح أو الصحيح، وعند المحدثين ما ليس له إلا إسناد واحد يشذ به ثقة أو غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9930} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9931} ويختلف حكم العمل بالقول الشاذ بحسب المجتهد والمقلد والعامي، فالمجتهد يرجح بالدليل، والمقلد لا يعمل إلا بالمشهور أو الراجح في مذهبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9933} وذهب الشاطبي إلى أن المقلد لا يفتي إلا بالمشهور، وقال السبكي إن للحاكم الأهل أن يحكم بما ترجح عنده من المنقول بدليل جيد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9934}"
  en: "In language shudhudh is separation from others, and a shadh is one who stands apart or leaves the group. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9930} In the usage of the Hanafis and Malikis a shadh view is one opposed to the prominent, preferred or sound view; in the usage of the hadith scholars a shadh report has a single chain in which a reliable or unreliable narrator stands alone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9930} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9931} Acting on a shadh view differs for the mujtahid, the follower and the layman: the mujtahid weighs the evidence, while the follower acts only on the prominent or preferred view of his school. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9933} Al-Shatibi holds that a follower may give a fatwa only on the prominent view, while al-Subki holds that a qualified judge may rule by a view he finds stronger on good evidence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9934}"
