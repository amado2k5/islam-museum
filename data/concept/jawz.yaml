id: concept/jawz
class: concept
kind: natural
label:
  ar: "جوز"
  en: "Jawz (the walnut)"
  ur: "جوز ⁦(اخروٹ)⁩"
  es: "Mandíbula (la nuez)"
  fr: "Jawz (la noix)"
  tr: "Ceviz"
  id: "Kenari"
summary:
  ar: "الجوز المعروف، وهو حار؛ ترياقه للمحرورين السكنجبين، ولضعيفي المعدة المربى بالخل. قابض في مقلوّه وقشره، وفيه منافع للصدر والمعدة والعين والسموم، ويذكر الكتاب أن قشره يحبس نزف الطمث ورماده يمنعه، فهذه قائمة كتابية مؤشّر عليها {cite:canon-ibn-sina-print-v1 p.415} {cite:canon-ibn-sina-print-v1 p.416}."
  en: "The known walnut, hot in temperament. Its antidote for those heated by bile is sikanjabin, and for weak stomachs the walnut preserved in vinegar. Roasted and in its shell it is astringent. The book lists it for the chest, stomach, eye and poisons. It also says its shell stops menstrual bleeding and its ash prevents the menses; these are the book's listings, kept and labelled {cite:canon-ibn-sina-print-v1 p.415} {cite:canon-ibn-sina-print-v1 p.416}."
  ur: "معروف جوز، جو گرم ہے؛ صفراوی مزاج والوں کے لیے اس کا تریاق سکنجبین ہے، اور کمزور معدے والوں کے لیے سرکے میں محفوظ کیا ہوا جوز۔ بھنے ہوئے اور چھلکے سمیت یہ قابض ہے۔ کتاب اسے سینے، معدے، آنکھ اور زہروں میں مفید بیان کرتی ہے۔ کتاب کے مطابق اس کا چھلکا حیض کے خون کو روکتا ہے اور اس کی راکھ حیض کو روکتی ہے؛ یہ کتاب کی فہرست ہے، جو الگ نشان زد کر کے درج ہے {cite:canon-ibn-sina-print-v1 p.415} {cite:canon-ibn-sina-print-v1 p.416}۔"
  es: "La conocida nuez, de temperamento cálido. Su antídoto para quienes se calientan por la bilis es el sikanjabin, y para los estómagos débiles la nuez conservada en vinagre. Asada y con cáscara es astringente. El libro la menciona para el pecho, el estómago, los ojos y los venenos. También dice que su cáscara detiene el sangrado menstrual y su ceniza previene la menstruación; estas son las listas del libro, conservadas y etiquetadas {cite:canon-ibn-sina-print-v1 p.415} {cite:canon-ibn-sina-print-v1 p.416}."
  fr: "La noix, réputée pour son tempérament ardent, est utilisée comme antidote contre les brûlures d'estomac, notamment la noix conservée dans du vinaigre. Grillée et conservée dans sa coque, elle est astringente. Le livre la mentionne pour les affections de la poitrine, de l'estomac, des yeux et contre les poisons. Il indique également que sa coque arrête les saignements menstruels et que ses cendres préviennent les règles; ces usages sont répertoriés dans le livre, conservés et étiquetés {cite:canon-ibn-sina-print-v1 p.415} {cite:canon-ibn-sina-print-v1 p.416}."
  tr: "Baharatlı olan ünlü ceviz; sağlıklı mideye sahip olanlar ve zayıf mideye sahip olanlar için panzehiri sirke ile doldurulmuştur. Mukus ve kabuğu büzücüdür ve göğüs, mide, gözler ve toksinler için faydaları vardır. Kitap, kabuğunun adet kanamasını önlediğini, küllerinin ise bunu engellediğini belirtir. Bu, {cite:canon-ibn-sina-print-v1 s.415} {cite:canon-ibn-sina-print-v1 s.416} tarafından belirtilen yazılı bir listedir."
  id: "Kenari yang terkenal, yang pedas; penawarnya bagi mereka yang memiliki perut sehat dan perut lemah dicampur cuka. Kacang ini bersifat astringen pada lendir dan kulitnya, serta memiliki manfaat untuk dada, lambung, mata, dan racun. Buku tersebut menyebutkan bahwa kulitnya mencegah pendarahan menstruasi dan abunya mencegahnya. Ini adalah daftar tertulis yang ditunjukkan oleh {cite:canon-ibn-sina-print-v1 hlm.415} {cite:canon-ibn-sina-print-v1 hlm.416}."
