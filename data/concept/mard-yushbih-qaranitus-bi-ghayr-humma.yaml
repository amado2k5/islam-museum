id: concept/mard-yushbih-qaranitus-bi-ghayr-humma
class: concept
kind: scientific
label:
  ar: "مرض شبيه بقرانيطس من غير حمى"
  en: "A disease like qaranitus without fever"
  ur: "قرانیطس سے مشابہ بغیر بخار کا مرض"
  es: "Una enfermedad como la qaranitus sin fiebre."
  fr: "Une maladie comme le qaranitus sans fièvre"
  tr: "Ateşsiz Korintlilere benzer bir hastalık"
  id: "Penyakit yang mirip dengan Korintus tanpa demam"
summary:
  ar: "ينقل ابن سينا زعم بعض المتطبّبين أن مرضاً شبيهاً بقرانيطس يعرض من غير حمى، ويصف قلقه وفتكه، ثم يقول رأيه أن السبب مشاركة الدماغ لعضو كريم آخر {cite:canon-ibn-sina-print-v2 p.77}"
  en: "Ibn Sina reports the claim of some physicians that a disease like qaranitus may come without fever, describes its restlessness and its deadliness, and then gives his own view that the cause is the brain's sharing with another noble organ {cite:canon-ibn-sina-print-v2 p.77}"
  ur: "ابن سینا بعض معالجوں کا یہ دعویٰ نقل کرتا ہے کہ قرانیطس سے مشابہ ایک مرض بغیر بخار کے آ سکتا ہے، اس کی بے قراری اور ہلاکت خیزی بتاتا ہے، پھر اپنی رائے دیتا ہے کہ سبب دماغ کی کسی اور شریف عضو سے شرکت ہے {cite:canon-ibn-sina-print-v2 p.77}۔"
  es: "Ibn Sina recoge la afirmación de algunos médicos de que una enfermedad como la qaranitus puede presentarse sin fiebre, describe su inquietud y su letalidad, y luego expone su propia opinión de que la causa es que el cerebro comparte órganos con otro órgano noble {cite:canon-ibn-sina-print-v2 p.77}."
  fr: "Ibn Sina rapporte l'affirmation de certains médecins selon laquelle une maladie comme le qaranitus peut survenir sans fièvre, décrit son caractère agité et mortel, puis donne son propre avis selon lequel la cause est le partage du cerveau avec un autre organe noble {cite:canon-ibn-sina-print-v2 p.77}"
  tr: "İbn Sina, bazı hekimlerin Korintlilere benzer bir hastalığın ateşsiz görüldüğünü iddia ettiğini aktarır; bunun kaygı ve ölümünü anlatır, ardından bunun sebebinin başka bir soylu organla etkileşimi olduğunu belirtir {cite:canon-ibn-sina-print-v2 s.77}"
  id: "Ibn Sina mengutip klaim beberapa dokter bahwa penyakit mirip Korintus hadir tanpa demam, menggambarkan kecemasan dan kematiannya, lalu menyatakan bahwa alasannya adalah keterlibatan otak dengan organ mulia lain {cite:canon-ibn-sina-print-v2 hlm.77}"
