summary:
  ar: "علم قياس السطوح والأجسام. يبدأ الخوارزمي بابه فيه بأن معنى «واحد في واحد» مساحة ومعناه ذراع في ذراع، ثم يعطي قواعد تكسير المربع والمثلث والمعيّن والدائرة وقطعها والمخروط {cite:khwarizmi-jabr-cairo-1939 p.70} {cite:khwarizmi-jabr-cairo-1939 p.71}."
  en: "The science of measuring areas and volumes. Al-Khwarizmi opens his chapter on it by saying that 'one by one' means an area, a cubit by a cubit, then gives rules for the area of the square, triangle, rhombus, circle and its segments, and for the cone."
  es: "La ciencia de medir áreas y volúmenes. Al-Juarismi comienza su capítulo sobre este tema diciendo que \"uno por uno\" significa un área, un codo por un codo, y luego da reglas para el área del cuadrado, el triángulo, el rombo, el círculo y sus segmentos, y para el cono."
  fr: "La science de la mesure des aires et des volumes. Al-Khwarizmi ouvre son chapitre sur ce sujet en précisant que « un par un » signifie une aire, une coudée par une coudée, puis énonce les règles de calcul de l'aire du carré, du triangle, du losange, du cercle et de ses segments, ainsi que du cône."
