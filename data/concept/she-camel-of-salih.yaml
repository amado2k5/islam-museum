label:
  ar: "ناقة صالح"
  en: "Salih's she-camel"
  ur: "صالح کی اونٹنی"
  es: "La camella de Salih"
  fr: "La chamelle de Salih"
  tr: "Saleh'in devesi"
  id: "Unta Saleh"
summary:
  ar: "آية أُرسلت إلى ثمود: ناقة الله لها شرب يوم ولهم شرب يوم معلوم فعقروها فأخذهم العذاب بعد ثلاثة أيام، قال صالح تلك ناقة الله لكم آية."
  en: "A sign sent to Thamud: God's she-camel, with her appointed day of water and theirs; their most wretched hamstrung her and the promised punishment seized them after three days. Salih said: this is God's she-camel, a sign for you."
  ur: "ثمود کو جو نشانی دی گئی: اللہ کی اونٹنی جس کا مقررہ دن تھا اور ان کا اپنا دن؛ ان کے بدترین شخص نے اس کی کونچیں کاٹیں اور تین دن بعد وعدہ شدہ عذاب نے پکڑ لیا۔ صالح نے کہا تھا: یہ اللہ کی اونٹنی ہے تمہارے لیے نشانی۔"
  es: "Una señal enviada a Thamud: la camella de Dios, con su día señalado para el agua y el de ellos; sus más desdichados la derribaron y el castigo prometido los alcanzó después de tres días. Salih dijo: esta es la camella de Dios, una señal para ti."
  fr: "Un signe fut envoyé aux Thamoud: la chamelle de Dieu, avec son jour d’abreuvement fixé et le leur; leurs plus misérables l’ont mutilée et le châtiment promis les a frappés trois jours plus tard. Salih dit: « Voici la chamelle de Dieu, un signe pour vous. »"
  tr: "Semud'a gönderilen bir ayet: Allah'ın dişi devesi bir günde içkiye sahiptir, bilinen bir günde içir, bu yüzden onu katlediler ve ceza üç gün sonra onları ele geçirdi. Salih dedi ki, 'Bu sizin için Allah'ın dişi devesidir, bir işarettir.'"
  id: "Sebuah ayat yang dikirim kepada Thamud: Unta betina Allah minum pada hari yang diketahui, lalu mereka membantai unta itu, dan hukuman diterima setelah tiga hari. Salih berkata, 'Itulah unta betina Allah untukmu, sebuah pertanda.'"
