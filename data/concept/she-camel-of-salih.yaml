summary:
  ar: "آية أُرسلت إلى ثمود: ناقة الله لها شرب يوم ولهم شرب يوم معلوم فعقروها فأخذهم العذاب بعد ثلاثة أيام، قال صالح تلك ناقة الله لكم آية."
  en: "A sign sent to Thamud: God's she-camel, with her appointed day of water and theirs; their most wretched hamstrung her and the promised punishment seized them after three days. Salih said: this is God's she-camel, a sign for you."
  ur: "ثمود کو جو نشانی دی گئی: اللہ کی اونٹنی جس کا مقررہ دن تھا اور ان کا اپنا دن؛ ان کے بدترین شخص نے اس کی کونچیں کاٹیں اور تین دن بعد وعدہ شدہ عذاب نے پکڑ لیا۔ صالح نے کہا تھا: یہ اللہ کی اونٹنی ہے تمہارے لیے نشانی۔"
