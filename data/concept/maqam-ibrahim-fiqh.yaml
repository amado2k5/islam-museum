label: { ar: "مَقَام إِبْرَاهِيم (الأحكام الفقهية)", en: "The Station of Abraham: rulings on the two rak'as", ur: "مقامِ ابراہیم (فقہی احکام)" }
summary:
  ar: "المقام في اللغة اسم مكان من قام. وقد اختلف الفقهاء والمفسرون في تعيينه: فقيل هو الحجر المعروف عند الكعبة الذي يصلي عنده الطائفون، وقيل هو الحجر الذي ارتفع عليه إبراهيم حين بنى البيت. وفي الأحكام: يصلي الطائف بعد الطواف ركعتين عند المقام، وتختلف الأحكام في وجوبهما وسنيتهما بين المذاهب، ويقرأ فيهما عادة بالكافرون والإخلاص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14903} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14904}"
  en: "The station is, in the lexicon, a place where one stands. Jurists and exegetes differ on which it is: the stone known today beside the Ka'ba where the circling pilgrims pray, or the stone on which Abraham rose while building the House. On rulings, the pilgrim who has completed the circumambulation prays two rak'as, ideally behind the Station. The schools differ on whether these are obligatory or a sunna, and on where they may be prayed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14903} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14904}"
  ur: "مقامِ ابراہیم وہ پتھر ہے جس کے پاس طواف کے بعد دو رکعت نماز پڑھی جاتی ہے۔ فقہاء کے نزدیک یہ دو رکعتیں حنفیہ کے ہاں واجب، مالکیہ کے نزدیک بعض صورتوں میں واجب، اور شافعیہ و حنابلہ کے نزدیک سنت ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14903} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14904}"
