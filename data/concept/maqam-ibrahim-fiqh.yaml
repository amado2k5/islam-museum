class: concept
kind: legal
label: { ar: "مَقَام إِبْرَاهِيم ⁦(الأحكام الفقهية)⁩", en: "The Station of Abraham: rulings on the two rak'as", ur: "مقامِ ابراہیم ⁦(فقہی احکام)⁩", es: "La Estación de Abraham: dictamen sobre los dos rak'as", fr: "La station d'Abraham: décisions sur les deux rak'as", tr: "Makam İbrahim (Fıkıh Hükümleri)", id: "Maqam Ibrahim (Putusan Yurisprudensi)" }
summary:
  ar: "المقام في اللغة اسم مكان من قام. وقد اختلف الفقهاء والمفسرون في تعيينه: فقيل هو الحجر المعروف عند الكعبة الذي يصلي عنده الطائفون، وقيل هو الحجر الذي ارتفع عليه إبراهيم حين بنى البيت. وفي الأحكام: يصلي الطائف بعد الطواف ركعتين عند المقام، وتختلف الأحكام في وجوبهما وسنيتهما بين المذاهب، ويقرأ فيهما عادة بالكافرون والإخلاص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14903} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14904}"
  en: "The station is, in the lexicon, a place where one stands. Jurists and exegetes differ on which it is: the stone known today beside the Ka'ba where the circling pilgrims pray, or the stone on which Abraham rose while building the House. On rulings, the pilgrim who has completed the circumambulation prays two rak'as, ideally behind the Station. The schools differ on whether these are obligatory or a sunna, and on where they may be prayed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14903} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14904}"
  ur: "مقامِ ابراہیم وہ پتھر ہے جس کے پاس طواف کے بعد دو رکعت نماز پڑھی جاتی ہے۔ فقہاء کے نزدیک یہ دو رکعتیں حنفیہ کے ہاں واجب، مالکیہ کے نزدیک بعض صورتوں میں واجب، اور شافعیہ و حنابلہ کے نزدیک سنت ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14903} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14904}"
  es: "La estación es, en el léxico, un lugar donde uno se sitúa. Juristas y exégetas difieren en cuanto a cuál es: la piedra conocida hoy junto a la Kaaba donde rezan los peregrinos que la circunvalan, o la piedra sobre la que Abraham se elevó mientras construía la Casa. Según las normas, el peregrino que ha completado la circunvalación reza dos rak'as, idealmente detrás de la Estación. Las escuelas difieren en si estas son obligatorias o una sunna, y en dónde se pueden rezar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14903} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14904}"
  fr: "Dans le lexique, la station désigne un lieu où l'on se tient debout. Les juristes et les exégètes divergent quant à sa désignation: s'agit-il de la pierre connue aujourd'hui près de la Kaaba, sur laquelle les pèlerins prient lors de leur circumambulation, ou de la pierre sur laquelle Abraham se tenait debout pendant la construction de la Maison ? Selon les règles, le pèlerin qui a achevé la circumambulation accomplit deux rak'as, idéalement derrière la station. Les écoles divergent quant à leur caractère obligatoire ou sunna, et quant au lieu où elles peuvent être accomplies."
  tr: "Dil açısından 'maqam', birinin durduğu yerin adıdır. Hukukçular ve yorumcular bu isimlendirme konusunda farklı görüşlerde bulunmuştur: Kâbe yakınındaki ünlü taş olduğu söylenirken, diğerleri İbrahim'in evi inşa ederken üzerinde durduğu taş olduğunu söyler. Hükümlerde: Taif, Tawaf'tan sonra makamda iki rekat namaz kılar. Hükümler, mezhebler arasında görev ve sünnet açısından farklılık gösterir ve genellikle 'kâfir' ve 'samimiyet' ile okunur. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.14902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14903} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14904}"
  id: "Dalam bahasa, 'maqam' adalah nama tempat seseorang berdiri. Para ahli hukum dan komentator berbeda pendapat mengenai penunjukannya: dikatakan batu ini terkenal di dekat Ka'bah tempat Tawaf berdoa, dan yang lain mengatakan itu adalah batu tempat Abraham berdiri saat membangun Rumah. Dalam keputusan: Ta'if berdoa dua rak'ah setelah Tawaf di Maqam. Aturan berbeda dalam kewajiban dan Sunnah di antara aljaran, dan biasanya dibacakan dengan 'kafir' dan 'ketulusan.' {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14902} {cite:fiqh-mawsua-kuwaitiyya-kuwaitiyya-noor-v3 hlm.14903} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14904}"
