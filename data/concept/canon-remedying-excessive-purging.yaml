label: { ar: "تلافي من أفرط عليه الإسهال عند ابن سينا", en: "Remedying excessive purging in the Canon", ur: "اسہال کی زیادتی کا تدارک قانون میں" }
summary:
  ar: "يذكر ابن سينا أن الإسهال يفرط لضعف العروق أو سعة أفواهها أو لذع المسهل أو سوء المزاج، ويوصي عند الإفراط بربط الأطراف من فوق ومن أسفل وسقي قليل من الترياق أو الفولونيا والتعريق بالحمام أو البخار والقوابض والدلك والمحاجم والأضمدة والغذاء القابض المبرد {cite:canon-ibn-sina-print-v1 p.283}."
  en: "Ibn Sina says purging runs to excess through weakness of the vessels, wideness of their mouths, the sting of the purgative on them or a bad temperament, and for excess he prescribes binding the limbs above and below, a little theriac or philonium, sweating by bath or steam, astringents, rubbing, cupping, poultices and an astringent, chilled diet {cite:canon-ibn-sina-print-v1 p.283}."
