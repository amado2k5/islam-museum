id: concept/canon-remedying-excessive-purging
class: concept
kind: scientific
label:
  ar: "تلافي من أفرط عليه الإسهال عند ابن سينا"
  en: "Remedying excessive purging in the Canon"
  fr: "Remédier à la purge excessive dans le Canon"
  ur: "اسہال کی زیادتی کا تدارک قانون میں"
  es: "Remediar la purga excesiva en el Canon"
  tr: "İbn Sina'ya göre aşırı ishal olanlardan kaçının"
  id: "Hindari mereka yang mengalami diare berlebihan menurut Ibn Sina"
summary:
  ar: "يذكر ابن سينا أن الإسهال يفرط لضعف العروق أو سعة أفواهها أو لذع المسهل أو سوء المزاج، ويوصي عند الإفراط بربط الأطراف من فوق ومن أسفل وسقي قليل من الترياق أو الفولونيا والتعريق بالحمام أو البخار والقوابض والدلك والمحاجم والأضمدة والغذاء القابض المبرد {cite:canon-ibn-sina-print-v1 p.283}."
  en: "Ibn Sina says purging runs to excess through weakness of the vessels, wideness of their mouths, the sting of the purgative on them or a bad temperament, and for excess he prescribes binding the limbs above and below, a little theriac or philonium, sweating by bath or steam, astringents, rubbing, cupping, poultices and an astringent, chilled diet {cite:canon-ibn-sina-print-v1 p.283}."
  fr: "Ibn Sina attribue l’excès de purge à la faiblesse vasculaire, à de larges orifices, à l’irritation du purgatif ou à un mauvais tempérament ; il décrit ligatures des membres, peu de thériaque ou de philonium, sudation par bain ou vapeur, astringents, frictions, ventouses, cataplasmes et régime astringent refroidi {cite:canon-ibn-sina-print-v1 p.283}."
  es: "Ibn Sina dice que la purga se vuelve excesiva debido a la debilidad de los vasos, la amplitud de sus bocas, el escozor del purgante sobre ellos o un mal temperamento, y para el exceso prescribe vendar las extremidades por encima y por debajo, un poco de teriaca o filonio, sudoración por baño o vapor, astringentes, frotamiento, ventosas, cataplasmas y una dieta fría y astringente {cite:canon-ibn-sina-print-v1 p.283}."
  ur: "ابن سینا کہتے ہیں کہ برتنوں کی کمزوری، منہ کی چوڑائی، ان پر رفع حاجت کے ڈنک یا بد مزاجی کے ذریعے صفائی کی زیادتی ہوتی ہے، اور اس کی زیادتی کے لیے اوپر اور نیچے کے اعضاء کو باندھنا، تھوڑا سا تھیریاک یا فلونیم، غسل یا بھاپ سے پسینہ آنا، اسٹرینجنٹ، پیالے، کدو، ایک ٹکڑا، اور اعضاء کا استعمال تجویز کیا گیا ہے۔ غذا {حوالہ:کینن-ابن سینا-پرنٹ-v1 صفحہ 283}۔"
  tr: "İbn Sina, zayıf damarlar, geniş ağızlar, müshil yanması veya kötü ruh hali nedeniyle ishalin aşırı olduğunu belirtir. Aşırı durumlarda, uzuvların yukarıdan ve alttan bağlanmasını, biraz panzehir veya volonia içilmesini, güvercin veya buhar uygulanmasını, kelepçeler, ovalama, bandajlar ve soğutucu bıyık yiyecekler uygulanmasını önerir {cite:canon-ibn-sina-print-v1 s.283}."
  id: "Ibn Sina menyebutkan bahwa diare berlebihan karena pembuluh darah lemah, mulut yang lebar, perih dengan pencahar, atau suasana hati yang buruk. Dalam kasus berlebihan, ia menyarankan mengikat anggota tubuh dari atas dan bawah, minum sedikit penawar atau volonia, mengoleskan merpati atau uap, penjepit, menggosok, membalut, dan mendinginkan makanan astringen {cite:canon-ibn-sina-print-v1 hlm.283}."
