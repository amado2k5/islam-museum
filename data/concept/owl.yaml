summary:
  ar: "قال النبي لا عدوى ولا هامة ولا صفر: نفى طيرة العرب التي كانت تتشاءم بالبومة إذا ناحت على الدار فتقول جاءت تطلب بدم: عقيدة تحرر الطير من لعنة الطيرة."
  en: "'No contagion, no hama, no Safar': the Prophet abolished the Arabs' omen in the owl, whose screech on a house they read as a call for blood — a creed that freed the birds from the curse of augury."
  ur: "'نہ وبا کا اثر، نہ ہامہ، نہ سفر': نبی نے عربوں کی اُلو کی بدشگونی ختم کی، جس کی چیخ گھر پر موت کی دعوت سمجھی جاتی تھی — پرندے بدشگونی کے لعنت سے آزاد ہوئے۔"
  es: "'Sin contagio, sin hama, sin Safar': el Profeta abolió el presagio que los árabes tenían del búho, cuyo graznido sobre una casa interpretaban como una llamada a la venganza; una creencia que liberó a las aves de la maldición del augurio."
  fr: "« Ni contagion, ni hama, ni Safar »: le Prophète a aboli le présage que les Arabes interprétaient dans le hibou, dont le cri sur une maison était perçu comme un appel au sang – une doctrine qui a libéré les oiseaux de la malédiction de l'augure."
