summary:
  ar: "قال النبي لا عدوى ولا هامة ولا صفر: نفى طيرة العرب التي كانت تتشاءم بالبومة إذا ناحت على الدار فتقول جاءت تطلب بدم: عقيدة تحرر الطير من لعنة الطيرة."
  en: "'No contagion, no hama, no Safar': the Prophet abolished the Arabs' omen in the owl, whose screech on a house they read as a call for blood — a creed that freed the birds from the curse of augury."
