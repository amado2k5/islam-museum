label: { ar: "المَقْبَرَة", en: "Cemetery (maqbara)", ur: "قبرستان (مَقْبَرَہ)" }
summary:
  ar: "المقبرة في اللغة موضع القبور، والقبور جمع قبر، وهو المكان الذي يدفن فيه الميت. وتناول الفقهاء أحكامها: الصلاة فيها بين الكراهة والجواز والبطلان بحسب المذهب، والصلاة على الجنازة فيها، وقراءة القرآن والمشي فيها، والمبيت فيها، وانتفاع الناس بأرضها بعد دروس الميت، وملكية أشجارها، وحدودها، ووقفها، وقضاء الحاجة فيها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14908} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14912}"
  en: "A cemetery is the place of graves, the place where the dead are buried. The jurists rule on prayer in it (reprehensible for the Hanafis and forbidden where the ground is disturbed for the Shafi'is, with a dispute on doubt), funeral prayer there, recitation and walking there, staying the night, the use of its land once the dead have decayed, ownership of its trees, its boundaries, its endowment, and relieving oneself there (forbidden or reprehensible). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14908} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14912}"
  ur: "مَقْبَرہ وہ جگہ ہے جہاں مردے دفن کیے جاتے ہیں۔ فقہاء نے اس میں نماز، جنازہ، قراءتِ قرآن، سونے، زمین کے انتفاع، درختوں کی ملکیت، حدود، وقف اور قضائے حاجت کے احکام بیان کیے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14908} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14912}"
