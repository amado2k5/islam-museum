id: concept/sleep-and-wakefulness-in-the-canon
class: concept
kind: scientific
label: { ar: "النوم واليقظة عند ابن سينا", en: "Sleep and wakefulness in the Canon", ur: "قانون میں نیند اور بیداری", es: "Sueño y vigilia en el canon", fr: "Le sommeil et l'éveil dans le Canon", tr: "İbn Sina'ya göre Uyku ve Uyanıklık", id: "Tidur dan Terjaga Menurut Ibn Sina" }
summary:
  ar: "في الفصل الثالث عشر، في موجبات النوم واليقظة، يقول ابن سينا إن النوم شديد الشبه بالسكون واليقظة شديدة الشبه بالحركة، ولكن لهما خواص ينبغي أن تعتبر {cite:canon-ibn-sina-print-v1 p.130}."
  en: "In the thirteenth chapter, on the causes that lie in sleep and wakefulness, Ibn Sina says that sleep closely resembles rest and wakefulness closely resembles motion, but that each has properties to be weighed {cite:canon-ibn-sina-print-v1 p.130}."
  es: "En el decimotercer capítulo, sobre las causas que subyacen al sueño y la vigilia, Ibn Sina dice que el sueño se asemeja mucho al descanso y la vigilia se asemeja mucho al movimiento, pero que cada uno tiene propiedades que deben sopesarse {cite:canon-ibn-sina-print-v1 p.130}."
  fr: "Dans le treizième chapitre, sur les causes qui résident dans le sommeil et l'éveil, Ibn Sina dit que le sommeil ressemble beaucoup au repos et l'éveil ressemble beaucoup au mouvement, mais que chacun a des propriétés à peser {cite:canon-ibn-sina-print-v1 p.130}."
  ur: "تیرھویں باب میں نیند اور بیداری کے اسباب کے بارے میں ابن سینا کہتا ہے کہ نیند آرام سے مشابہ ہے اور بیداری حرکت سے مشابہت رکھتی ہے لیکن یہ کہ ہر ایک میں وزن کرنے کی خصوصیات ہیں۔"
  tr: "On üçüncü bölümde, uyku ve uyanıklığın nedenleri üzerine İbn Sina, uykunun hareketsizliğe çok benzediğini, uyanıklığın ise harekete çok benzediğini, ancak bunların dikkate alınması gereken özelliklere sahip olduğunu söyler {cite:canon-ibn-sina-print-v1 s.130}."
  id: "Dalam bab tiga belas, tentang penyebab tidur dan terjaga, Ibn Sina mengatakan bahwa tidur sangat mirip dengan keheningan, sementara terjaga sangat mirip dengan gerakan, tetapi keduanya memiliki sifat yang harus dipertimbangkan {cite:canon-ibn-sina-print-v1 hlm.130}."
