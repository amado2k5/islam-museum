summary:
  ar: "قصب الذريرة في الكتاب ينبت في بلاد الهند، حار يابس إلى الثانية، ملطف فيه قبض يسير، يحلل الأورام وينفع من شدخ العضل ويجلو البصر وينفع من السعال والكبد والمعدة والكلى {cite:canon-ibn-sina-print-v1 pp.644-645}"
  en: "Qasab al-dharira is in the book a reed that grows in India, hot and dry to the second degree, thinning, with a little astringency; it dissolves swellings, benefits crushing of the muscles, clears the sight and benefits the cough, the liver, the stomach and the kidneys {cite:canon-ibn-sina-print-v1 pp.644-645}"
  ur: "قصب الذریرہ کتاب میں ہند کی سرزمین میں اگتا ہے، دوسرے درجے تک گرم خشک، لطیف کرنے والا جس میں ہلکا قبض ہے؛ ورم گھلاتا، پٹھوں کی چوٹ میں نافع ہے، نظر کو جلا دیتا ہے اور کھانسی، جگر، معدے اور گردوں میں نافع ہے {cite:canon-ibn-sina-print-v1 pp.644-645}۔"
  es: "Qasab al-dharira es, según el libro, una caña que crece en la India, cálida y seca en segundo grado, delgada, con un ligero efecto astringente; disuelve las hinchazones, alivia la congestión muscular, mejora la vista y beneficia la tos, el hígado, el estómago y los riñones {cite:canon-ibn-sina-print-v1 pp.644-645}"
