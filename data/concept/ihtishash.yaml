label: { ar: "احتشاش", en: "Cutting grass (ihtishash)", es: "Cortar el césped (ihtishash)", fr: "Couper l'herbe (ihtishash)", ur: "گھاس کاٹنا ⁦(احتشاش)⁩", tr: "Çatışma", id: "Konflik" }
summary:
  ar: "الاحتشاش قطع الحشيش، ويجوز في غير الحرم ما لم يكن مملوكاً إلا بإذن مالكه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1725} وفي الحرم لا يحل قطع حشيشه غير المملوك إلا الإذخر وملحقاته، وأباح الشافعية والحنابلة وأبو يوسف في رأي الاحتشاش في الحرم لعلف الدواب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1725} وفي السرقة من الحشيش يقطع المالكية والشافعية اليد إذا أخذ من حرز وبلغ نصاباً، والحنفية لا قطع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1725} ويجوز للإمام منع الاحتشاش في مكان يجعله حمى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1726}"
  en: "Ihtishash is cutting grass. Outside the sanctuary it is lawful unless the grass is owned, in which case the owner's permission is needed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1725} Inside the sanctuary the grass that no one owns may not be cut, except idhkhir and its kind; al-Shafi'i, the Hanbalis and one view of Abu Yusuf allow cutting it to feed animals. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1725} On theft of cut grass, the Malikis and Shafi'is cut the hand if it is taken from a store and reaches the threshold, and the Hanafis do not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1725} A ruler may forbid cutting grass in a place he reserves as a protected pasture. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1726}"
  es: "Ihtishash es cortar hierba. Fuera del santuario es lícito a menos que la hierba sea propiedad de alguien, en cuyo caso se necesita el permiso del propietario. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1725} Dentro del santuario no se puede cortar la hierba que no es propiedad de nadie, excepto idkhir y su tipo; al-Shafi'i, los Hanbalis y una opinión de Abu Yusuf permiten cortarla para alimentar animales. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1725} En caso de robo de hierba cortada, los Malikis y Shafi'is cortan la mano si se toma de un almacén y llega al umbral, y los Hanafis no. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1725} Un gobernante puede prohibir cortar hierba en un lugar que reserva como pasto protegido. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1726}"
  fr: "L'ihtishash consiste à couper l'herbe. En dehors du sanctuaire, cette pratique est licite, sauf si l'herbe appartient à quelqu'un, auquel cas l'autorisation du propriétaire est requise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1725} À l'intérieur du sanctuaire, il est interdit de couper l'herbe qui n'appartient à personne, à l'exception de l'idhkhir et des espèces apparentées. Al-Shafi'i, les Hanbalites et une opinion d'Abu Yusuf autorisent sa coupe pour nourrir les animaux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1725} En cas de vol d'herbe coupée, les Malikites et les Shafi'ites infligent une coupure à la main si l'herbe est prise dans un entrepôt et atteint le seuil, contrairement aux Hanafites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1725} Un souverain peut interdire la coupe de l'herbe dans un lieu qu'il réserve comme pâturage protégé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1726}"
  ur: "احتشاش گھاس کاٹ رہا ہے۔ حرم کے باہر یہ حلال ہے جب تک کہ گھاس کی ملکیت نہ ہو، اس صورت میں مالک کی اجازت درکار ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 1725} حرم کے اندر وہ گھاس جو کسی کی ملکیت میں نہیں ہے، اذخیر اور اس کی قسم کے علاوہ نہیں کاٹی جا سکتی۔ شافعی، حنبلی اور ابو یوسف کا ایک قول جانوروں کو کھانے کے لیے اسے کاٹنے کی اجازت دیتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1725} کاٹی ہوئی گھاس چوری کرنے پر مالکیہ اور شافعی ہاتھ کاٹتے ہیں اگر دکان سے لے کر دہلیز تک پہنچ جائے اور احناف ایسا نہیں کرتے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1725} ایک حکمران اس جگہ پر گھاس کاٹنے سے منع کر سکتا ہے جسے وہ محفوظ چراگاہ کے طور پر محفوظ رکھتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص1726}"
  tr: "Haşiş, haşişin kesilmesidir ve haram dışında, sahibinin izni olmadan sahip olunmadığı sürece izinlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1725} Haram'da, İdhakhar ve aksesuarları hariç sahiplenilmemiş haşişin kesilmesi caizdir. Şafiiler, Hanbaliler ve Ebu Yusuf, hayvan yemi olarak Haram'da haşişe izin vermiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1725} Haşiş hırsızlığı durumunda, Malikiler ve Şafi'ler eli koruma altından alınıp nisaba ulaşırsa keser, ancak Hanafiler kesmezler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1725} İmam haşişi ateş yapan bir yerde engelleyebilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1726}"
  id: "Hashish adalah memotong hashish, dan diperbolehkan di luar Haram kecuali dimiliki kecuali dengan izin pemilik. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1725} Dalam Haram, hanya diperbolehkan memotong hashish yang tidak dimiliki kecuali untuk Idhakhar dan aksesorinya. Shafi'i, Hanbali, dan Abu Yusuf telah mengizinkan hashish di Haram untuk pakan ternak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1725} Dalam kasus pencurian hashish, Malikis dan Shafi'is memotong tangan jika diambil dari area yang dilindungi dan sampai ke nisab, tetapi Hanafi tidak memotongnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1725} Imam boleh mencegah hashish di tempat yang membuatnya demam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1726}"
