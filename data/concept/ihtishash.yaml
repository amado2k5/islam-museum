id: concept/ihtishash
class: concept
kind: legal
label: { ar: "احتشاش", en: "Cutting grass (ihtishash)" }
summary:
  ar: "الاحتشاش قطع الحشيش، ويجوز في غير الحرم ما لم يكن مملوكاً إلا بإذن مالكه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1725} وفي الحرم لا يحل قطع حشيشه غير المملوك إلا الإذخر وملحقاته، وأباح الشافعية والحنابلة وأبو يوسف في رأي الاحتشاش في الحرم لعلف الدواب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1725} وفي السرقة من الحشيش يقطع المالكية والشافعية اليد إذا أخذ من حرز وبلغ نصاباً، والحنفية لا قطع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1725} ويجوز للإمام منع الاحتشاش في مكان يجعله حمى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1726}"
  en: "Ihtishash is cutting grass. Outside the sanctuary it is lawful unless the grass is owned, in which case the owner's permission is needed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1725} Inside the sanctuary the grass that no one owns may not be cut, except idhkhir and its kind; al-Shafi'i, the Hanbalis and one view of Abu Yusuf allow cutting it to feed animals. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1725} On theft of cut grass, the Malikis and Shafi'is cut the hand if it is taken from a store and reaches the threshold, and the Hanafis do not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1725} A ruler may forbid cutting grass in a place he reserves as a protected pasture. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1726}"
