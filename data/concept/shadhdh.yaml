label:
  ar: "الشاذ"
  en: "Shadhdh (anomalous report)"
summary:
  ar: "الشاذ عند الشافعي أن يروي الثقة حديثاً يخالف ما روى الناس، لا أن يروي ما لا يروي غيره؛ وعند الخليلي ما ليس له إلا إسناد واحد يشذ به شيخ ثقة أو غير ثقة؛ وعند الحاكم ما تفرد به ثقة وليس له أصل بمتابع. ويرى ابن الصلاح أن قول الشافعي لا إشكال فيه، وأن التعريفين الآخرين يشكل عليهما ما ينفرد به العدل الحافظ كحديث «إنما الأعمال بالنيات»، فيفصّل: الشاذ المردود قسمان: الفرد المخالف، والفرد الذي ليس في راويه من الثقة والضبط ما يجبر تفرده {cite:muqaddima-ibn-salah-itr p. 76-80}."
  en: "For al-Shafi'i a shadhdh report is not one in which a trustworthy narrator relates what no one else does, but one in which a trustworthy narrator contradicts what others relate; for al-Khalili it is one with only a single chain, whether its sole transmitter is trustworthy or not; for al-Hakim it is one a trustworthy narrator transmits alone with no corroboration. Ibn al-Salah accepts al-Shafi'i's definition and finds the other two problematic in face of solitary reports from reliable hafizes such as 'actions are only by intentions'; he concludes that the rejected shadhdh is of two kinds: the solitary report that contradicts, and the solitary report whose narrator lacks the reliability to carry it."
