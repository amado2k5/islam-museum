id: concept/asbab-al-nuzul
class: concept
kind: discipline
label:
  ar: "أسباب النزول"
  en: "Occasions of revelation (asbab al-nuzul)"
  ur: "اسبابِ نزول"
summary:
  ar: "علم بالحوادث والأسئلة التي نزلت الآيات بسببها؛ جعله الزركشي النوع الأول من أنواع علوم القرآن، وعدّ من فوائده معرفة حكمة التشريع وفهم المعنى ودفع الإشكال وتوهم الحصر، وردّ على من زعم أنه لا طائل تحته لجريانه مجرى التاريخ."
  en: "Knowledge of the events and questions on account of which verses were revealed; al-Zarkashi made it the first type of the Qur'anic sciences, listing among its benefits knowing the wisdom behind a ruling, understanding the meaning and removing difficulties and false impressions of restriction, and rejecting the claim that it is useless because it is merely history."
  ur: "ان واقعات اور سوالات کا علم جن کے سبب آیات نازل ہوئیں؛ زرکشی نے اسے علومِ قرآن کی پہلی نوع بنایا، اور اس کے فوائد میں حکمتِ تشریع کی معرفت، معنی کا فہم، اشکال اور حصر کے وہم کا ازالہ گنوائے، اور اس دعوے کو رد کیا کہ یہ تاریخ کی طرح ہونے کی وجہ سے بے فائدہ ہے۔"
