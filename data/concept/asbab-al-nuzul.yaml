id: concept/asbab-al-nuzul
class: concept
kind: discipline
label:
  ar: "أسباب النزول"
  en: "Occasions of revelation (asbab al-nuzul)"
  fr: "Circonstances de la révélation (asbab al-nuzul)"
  ur: "اسبابِ نزول"
  es: "Ocasiones de revelación (asbab al-nuzul)"
  tr: "Vahiy Nedenleri"
  id: "Alasan Wahyu"
summary:
  ar: "علم بالحوادث والأسئلة التي نزلت الآيات بسببها؛ جعله الزركشي النوع الأول من أنواع علوم القرآن، وعدّ من فوائده معرفة حكمة التشريع وفهم المعنى ودفع الإشكال وتوهم الحصر، وردّ على من زعم أنه لا طائل تحته لجريانه مجرى التاريخ."
  en: "Knowledge of the events and questions on account of which verses were revealed; al-Zarkashi made it the first type of the Qur'anic sciences, listing among its benefits knowing the wisdom behind a ruling, understanding the meaning and removing difficulties and false impressions of restriction, and rejecting the claim that it is useless because it is merely history."
  fr: "Connaissance des événements et des questions à l’occasion desquels des versets furent révélés ; al-Zarkashi en fit le premier type des sciences coraniques, citant parmi ses bénéfices la connaissance de la sagesse d’une règle, la compréhension du sens et la levée des difficultés et des fausses impressions de restriction, et rejetant l’affirmation de son inutilité au motif qu’il ne s’agirait que d’histoire."
  ur: "ان واقعات اور سوالات کا علم جن کے سبب آیات نازل ہوئیں؛ زرکشی نے اسے علومِ قرآن کی پہلی نوع بنایا، اور اس کے فوائد میں حکمتِ تشریع کی معرفت، معنی کا فہم، اشکال اور حصر کے وہم کا ازالہ گنوائے، اور اس دعوے کو رد کیا کہ یہ تاریخ کی طرح ہونے کی وجہ سے بے فائدہ ہے۔"
  es: "El conocimiento de los acontecimientos y las cuestiones que motivaron la revelación de los versículos; al-Zarkashi lo convirtió en el primer tipo de ciencia coránica, enumerando entre sus beneficios el conocimiento de la sabiduría que hay detrás de una norma, la comprensión del significado y la eliminación de dificultades y falsas impresiones de restricción, y rechazando la afirmación de que es inútil porque es simplemente historia."
  tr: "Ayetlerin vahyine yol açan olayların ve soruların bilinmesi; El-Zarkaşi, bunu Kur'an bilimlerinin ilk türü olarak görmüş, faydalarını yasanın bilgeliği bilgisi, anlamını anlama, şüpheleri çözme ve sınırlama yanılsaması olarak görmüştür. Tarihin akışı nedeniyle altında hiçbir fayda olmadığını iddia edenleri çürütmüştür."
  id: "Pengetahuan tentang peristiwa dan pertanyaan yang mengarah pada wahyu ayat-ayat tersebut; Al-Zarkashi menganggapnya sebagai jenis pertama ilmu Al-Quran, menganggap manfaatnya sebagai pengetahuan tentang kebijaksanaan legislasi, memahami maknanya, menyelesaikan keraguan, dan ilusi pembatasan. Ia membantah mereka yang mengklaim bahwa tidak ada manfaat di baliknya karena jalannya sejarah."
