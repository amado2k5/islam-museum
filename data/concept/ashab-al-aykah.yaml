id: concept/ashab-al-aykah
class: concept
kind: term
label:
  ar: "أصحاب الأيكة"
  en: "Ashab al-Aykah (the Companions of the Thicket)"
  fr: "Ashab al-Aykah (les gens du Fourré)"
  ur: "اصحاب الایکہ"
  es: "Ashab al-Aykah (los Compañeros del Bosque)"
summary:
  ar: "قوم كذّبوا المرسلين فأُهلكوا، وذُكروا في [[passage/quran-26-176|الشعراء 176]] و[[passage/quran-15-78|الحجر 78]] و[[passage/quran-38-13|ص 13]] و[[passage/quran-50-14|ق 14]]، والأيكة الشجر الملتف أو الغيضة. وفي صلتهم بمدين خلاف عند المفسرين: ذهب الطبري وابن كثير إلى أنهم أهل مدين، وجعلهما قتادة أمتين أُرسل إليهما شعيب، وجعل ابن كثير قول قتادة ضعيفًا ورد حجتيه {cite:tafsir-tabari-quran-com on 26:176} {cite:tafsir-ibn-kathir on 26:176} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook on Shu'ayb and the Aykah}."
  en: "A people who denied the messengers and were destroyed, named in [[passage/quran-26-176|al-Shu'ara' 176]], [[passage/quran-15-78|al-Hijr 78]], [[passage/quran-38-13|Sad 13]] and [[passage/quran-50-14|Qaf 14]]; al-aykah is a dense thicket or grove. The exegetes differ on their relation to Madyan: al-Tabari and Ibn Kathir hold that they are the people of Madyan, Qatada made them two nations to whom Shu'ayb was sent, and Ibn Kathir called Qatada's view weak and answered its two arguments {cite:tafsir-tabari-quran-com on 26:176} {cite:tafsir-ibn-kathir on 26:176} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook on Shu'ayb and the Aykah}."
  fr: "Peuple qui nia les messagers et fut détruit, nommé en [[passage/quran-26-176|al-Shu'ara' 176]], [[passage/quran-15-78|al-Hijr 78]], [[passage/quran-38-13|Sad 13]] et [[passage/quran-50-14|Qaf 14]] ; al-aykah désigne un fourré dense ou un bosquet. Les exégètes divergent sur leur lien avec Madyan : al-Tabari et Ibn Kathir estiment qu’il s’agit des gens de Madyan ; Qatada en faisait deux nations auxquelles Shu'ayb fut envoyé ; Ibn Kathir jugea faible cet avis et répondit à ses deux arguments {cite:tafsir-tabari-quran-com on 26:176} {cite:tafsir-ibn-kathir on 26:176} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook on Shu'ayb and the Aykah}."
  ur: "ایک قوم جس نے رسولوں کو جھٹلایا اور ہلاک ہوئی، جس کا ذکر [[passage/quran-26-176|الشعراء 176]]، [[passage/quran-15-78|الحجر 78]]، [[passage/quran-38-13|ص 13]] اور [[passage/quran-50-14|ق 14]] میں ہے؛ ایکہ گھنی جھاڑی یا بن کو کہتے ہیں۔ مدین سے ان کے تعلق میں مفسرین کا اختلاف ہے: طبری اور ابن کثیر کے نزدیک وہ اہلِ مدین ہی ہیں، قتادہ نے انہیں دو الگ قومیں کہا جن کی طرف شعیب بھیجے گئے، اور ابن کثیر نے قتادہ کے قول کو ضعیف کہا اور اس کی دونوں دلیلوں کا جواب دیا {cite:tafsir-tabari-quran-com on 26:176} {cite:tafsir-ibn-kathir on 26:176} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook on Shu'ayb and the Aykah}۔"
  es: "Un pueblo que negó a los mensajeros y fue destruido, mencionado en [[passage/quran-26-176|al-Shu'ara' 176]], [[passage/quran-15-78|al-Hijr 78]], [[passage/quran-38-13|Sad 13]] y [[passage/quran-50-14|Qaf 14]]; al-aykah es un matorral o arboleda densa. Los exégetas difieren en su relación con Madyan: al-Tabari e Ibn Kathir sostienen que son la gente de Madyan, Qatada los identificó como dos naciones a las que Shu'ayb fue enviado, e Ibn Kathir consideró débil la opinión de Qatada y respondió a sus dos argumentos {cite:tafsir-tabari-quran-com on 26:176} {cite:tafsir-ibn-kathir on 26:176} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook on Shu'ayb and the Aykah}."
