id: concept/descending-aorta
class: concept
kind: scientific
label: { ar: "الشريان النازل عند ابن سينا", en: "The descending artery in the Canon", ur: "قانون میں اترنے والی شریان", es: "La arteria descendente en el Canon", fr: "L'artère descendante dans le Canon", tr: "İbn Sina'ya göre İnen Arter", id: "Arteri Menurun menurut Ibn Sina" }
summary:
  ar: "في الفصل الخامس يتتبع ابن سينا الشريان النازل من القلب على الصلب إلى عظم العجز، ويعدد ما يخلفه في طريقه من شعب إلى الرئة والحجاب والمعدة والكبد والطحال والأمعاء والكليتين والأنثيين {cite:canon-ibn-sina-print-v1 pp.86-87}."
  en: "In the fifth chapter Ibn Sina follows the descending artery from the heart along the spine to the sacrum and lists the branches it leaves on the way to the lung, diaphragm, stomach, liver, spleen, intestines, kidneys and testicles {cite:canon-ibn-sina-print-v1 pp.86-87}."
  es: "En el quinto capítulo, Ibn Sina sigue la arteria descendente desde el corazón a lo largo de la columna vertebral hasta el sacro y enumera las ramas que deja en su camino hacia el pulmón, el diafragma, el estómago, el hígado, el bazo, los intestinos, los riñones y los testículos {cite:canon-ibn-sina-print-v1 pp.86-87}."
  fr: "Dans le cinquième chapitre, Ibn Sina suit l'artère descendante du cœur le long de la colonne vertébrale jusqu'au sacrum et énumère les branches qu'elle laisse sur le chemin des poumons, du diaphragme, de l'estomac, du foie, de la rate, des intestins, des reins et des testicules {cite:canon-ibn-sina-print-v1 pp.86-87}."
  ur: "پانچویں باب میں ابن سینا ریڑھ کی ہڈی کے ساتھ ساتھ سیکرم تک دل سے اترتی ہوئی شریان کی پیروی کرتا ہے اور پھیپھڑوں، ڈایافرام، معدہ، جگر، تلی، آنتیں، گردے اور خصیوں کی طرف جانے والی شاخوں کی فہرست دیتا ہے۔"
  tr: "Beşinci bölümde, İbn Sina kalpten sklera üzerine inen atardamarı izler ve akciğerlere, diyaframa, mide, karaciğere, dalak, bağırsaklara, böbreklere ve kadın genital organlarına giderken bıraktığı dalları sayar {cite:canon-ibn-sina-print-v1 s.86-87}."
  id: "Pada bab kelima, Ibn Sina menelusuri arteri yang turun dari jantung ke sklera, dan menyebutkan cabang-cabang yang ditinggalkannya menuju paru-paru, diafragma, lambung, hati, limpa, usus, ginjal, dan genitalia perempuan {cite:canon-ibn-sina-print-v1 hlm.86-87}."
