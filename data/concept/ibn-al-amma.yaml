label: { ar: "ابن العمة", en: "Paternal aunt's son", es: "hijo de la tía paterna", fr: "Le fils de la tante paternelle", ur: "پھوپھی کا بیٹا" }
summary:
  ar: "تعرّف الموسوعة الفقهية الكويتية ابن العمة نسباً بأنه الولد الذكر النسبي للعمة النسبية، سواء كانت أخت الأب لأبيه وأمه أو لأبيه أو لأمه، ورضاعاً بأنه ابن أخت الأب الرضاعي، وعند الإطلاق ينصرف إلى النسبي. واتفق الفقهاء على أنه من ذوي الأرحام غير المحارم، فيسري عليه ما يسري عليهم من الصلة وجواز زواجه من ابنة خاله، وعدم وجوب النفقة عليه إن لم يكن وارثاً، على خلاف وتفصيل. وذكره الفقهاء في أبواب الميراث وصلاة الجنازة والنكاح والنفقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1465}"
  en: "The Kuwaiti encyclopedia defines a paternal aunt's son by blood as the male blood child of a blood paternal aunt, whether she is a sister of the father by both parents, by the father alone or by the mother alone; by fostering, he is the son of the foster sister of the father. Without qualification the word means the blood relation. The jurists agree that he is among those with blood-ties through a female who are not mahrams: the duty of kinship applies to him, he may marry his maternal cousin, and maintenance is not due from him unless he is an heir, with differences and detail on this. The jurists treat the rules in inheritance, the funeral prayer, marriage and maintenance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1465}"
  es: "La enciclopedia kuwaití define al hijo de sangre de una tía paterna como el hijo varón consanguíneo de una tía paterna consanguínea, ya sea que esta sea hermana del padre por ambos padres, solo por el padre o solo por la madre; por crianza, es hijo de la hermana de crianza del padre. Sin ninguna especificación, el término significa parentesco consanguíneo. Los juristas coinciden en que se encuentra entre aquellos con lazos de sangre a través de una mujer que no son mahrams: se le aplica el deber de parentesco, puede casarse con su prima materna y no está obligado a pagar manutención a menos que sea heredero, con diferencias y detalles al respecto. Los juristas tratan las normas sobre herencia, la oración fúnebre, el matrimonio y la manutención. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1465}"
  fr: "L'encyclopédie koweïtienne définit le fils d'une tante paternelle par le sang comme l'enfant mâle né d'une tante paternelle par le sang, qu'elle soit sœur du père par les deux parents, par le père seulement ou par la mère seulement; par adoption, il s'agit du fils de la sœur adoptive du père. Sans autre précision, le terme désigne le lien de sang. Les juristes s'accordent à dire qu'il fait partie de ceux qui ont des liens de sang par une femme qui n'est pas un mahram: le devoir de parenté lui incombe, il peut épouser sa cousine maternelle et il n'est pas tenu à une pension alimentaire, sauf s'il est héritier, avec des divergences et des précisions sur ce point. Les juristes traitent des règles relatives à l'héritage, à la prière funéraire, au mariage et à la pension alimentaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1465}"
  ur: "کویتی انسائیکلوپیڈیا خون کے ذریعے پھوپھی کے بیٹے کو خون کی پھوپھی کے مرد خون کے بچے کے طور پر بیان کرتا ہے، چاہے وہ دونوں والدین کی طرف سے باپ کی بہن ہو، باپ کی طرف سے یا اکیلے ماں کی طرف سے؛ پرورش سے، وہ باپ کی رضاعی بہن کا بیٹا ہے۔ اہلیت کے بغیر اس لفظ کا مطلب خون کا رشتہ ہے۔ فقہاء کا اس پر اتفاق ہے کہ وہ ان لوگوں میں سے ہے جن کے خون کے رشتے محرم نہیں ہیں: اس پر رشتہ داری کا فرض ہے، وہ اپنی خالہ زاد سے شادی کرسکتا ہے، اور اس پر نفقہ واجب نہیں ہے جب تک کہ وہ وارث نہ ہو، اس میں اختلاف اور تفصیل ہے۔ فقہا وراثت، نماز جنازہ، نکاح اور نفقہ میں احکام کا لحاظ رکھتے ہیں۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 1465}"
