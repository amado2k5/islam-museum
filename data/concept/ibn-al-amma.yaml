label: { ar: "ابن العمة", en: "Paternal aunt's son" }
summary:
  ar: "تعرّف الموسوعة الفقهية الكويتية ابن العمة نسباً بأنه الولد الذكر النسبي للعمة النسبية، سواء كانت أخت الأب لأبيه وأمه أو لأبيه أو لأمه، ورضاعاً بأنه ابن أخت الأب الرضاعي، وعند الإطلاق ينصرف إلى النسبي. واتفق الفقهاء على أنه من ذوي الأرحام غير المحارم، فيسري عليه ما يسري عليهم من الصلة وجواز زواجه من ابنة خاله، وعدم وجوب النفقة عليه إن لم يكن وارثاً، على خلاف وتفصيل. وذكره الفقهاء في أبواب الميراث وصلاة الجنازة والنكاح والنفقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1465}"
  en: "The Kuwaiti encyclopedia defines a paternal aunt's son by blood as the male blood child of a blood paternal aunt, whether she is a sister of the father by both parents, by the father alone or by the mother alone; by fostering, he is the son of the foster sister of the father. Without qualification the word means the blood relation. The jurists agree that he is among those with blood-ties through a female who are not mahrams: the duty of kinship applies to him, he may marry his maternal cousin, and maintenance is not due from him unless he is an heir, with differences and detail on this. The jurists treat the rules in inheritance, the funeral prayer, marriage and maintenance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1465}"
