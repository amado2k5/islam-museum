id: concept/naqd
class: concept
kind: legal
label: { ar: "النَّقْد", en: "Naqd (cash payment)", ur: "نقد (نقد ادائیگی)" }
summary:
  ar: "النقد في اللغة خلاف النسيئة، أي تسليم العوض فوراً، وإعطاء المال النقدي، وتمييز الجيد من الرديء، والعملة من الذهب والفضة أو غيرهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15968} والأصل وجوب الوفاء بما اتفق عليه من حلول أو تأجيل، ويجب النقد في بيع الذهب والفضة بمثلهما وفي السلم عند الجمهور، ويجوز بيع الدين ممن عليه الدين بشرط النقد في المجلس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15968} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15969} ولا يلزم النقد في الدية المؤجلة ولا في خيار الشرط، ويمتنع شرط النقد في بعض العقود عند المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15970} وخيار النقد شرط اختلف الفقهاء في جوازه، ويستقل التاجر بتعلم النقد لئلا يقع في الزيف، وأجرة النقاد على من تقع عليه المصلحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15971} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15972}"
  en: "Naqd, in the lexicon, is cash, the opposite of deferred payment; it also means handing over money in coin, telling good coin from bad, and coinage of gold, silver or other currency. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15968} A contract's agreed terms, whether cash or deferred, must be kept; exchanging gold for gold or silver for silver requires cash on both sides, and salam requires the capital to be paid in the session by most jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15968} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15969} A debt may be sold to its debtor if the price is paid before the parties part. The blood money for unintended killing is paid in instalments over three years. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15970} The buyer need not pay during an option period; a condition to pay during it is disputed, and the Malikis forbid conditional payment in some contracts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15971} A seller who pays the assayer's fee is disputed among the schools. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15972}"
  ur: "نقد لغت میں ادھار کے خلاف، یعنی فوری ادائیگی، اور اصطلاح میں کھرے سکے کو کھوٹے سے پرکھنا بھی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15968} سونے کا سونے سے اور چاندی کا چاندی سے تبادلہ نقد ہونا ضروری ہے، اور سلم میں جمہور کے نزدیک سرمایہ مجلس میں ادا ہونا چاہیے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15968} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15969} مقروض سے قرض کی بیع اس شرط پر جائز ہے کہ جدا ہونے سے پہلے ادائیگی ہو جائے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15970} خیار مدت میں خریدار پر ادائیگی واجب نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15971}"
