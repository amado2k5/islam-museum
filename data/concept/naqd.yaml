label: { ar: "النَّقْد", en: "Naqd (cash payment)", ur: "نقد ⁦(نقد ادائیگی)⁩", es: "Naqd (pago en efectivo)", fr: "Naqd (paiement en espèces)", tr: "Eleştiri", id: "Kritik" }
summary:
  ar: "النقد في اللغة خلاف النسيئة، أي تسليم العوض فوراً، وإعطاء المال النقدي، وتمييز الجيد من الرديء، والعملة من الذهب والفضة أو غيرهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15968} والأصل وجوب الوفاء بما اتفق عليه من حلول أو تأجيل، ويجب النقد في بيع الذهب والفضة بمثلهما وفي السلم عند الجمهور، ويجوز بيع الدين ممن عليه الدين بشرط النقد في المجلس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15968} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15969} ولا يلزم النقد في الدية المؤجلة ولا في خيار الشرط، ويمتنع شرط النقد في بعض العقود عند المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15970} وخيار النقد شرط اختلف الفقهاء في جوازه، ويستقل التاجر بتعلم النقد لئلا يقع في الزيف، وأجرة النقاد على من تقع عليه المصلحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15971} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15972}"
  en: "Naqd, in the lexicon, is cash, the opposite of deferred payment; it also means handing over money in coin, telling good coin from bad, and coinage of gold, silver or other currency. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15968} A contract's agreed terms, whether cash or deferred, must be kept; exchanging gold for gold or silver for silver requires cash on both sides, and salam requires the capital to be paid in the session by most jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15968} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15969} A debt may be sold to its debtor if the price is paid before the parties part. The blood money for unintended killing is paid in instalments over three years. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15970} The buyer need not pay during an option period; a condition to pay during it is disputed, and the Malikis forbid conditional payment in some contracts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15971} A seller who pays the assayer's fee is disputed among the schools. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15972}"
  ur: "نقد لغت میں ادھار کے خلاف، یعنی فوری ادائیگی، اور اصطلاح میں کھرے سکے کو کھوٹے سے پرکھنا بھی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15968} سونے کا سونے سے اور چاندی کا چاندی سے تبادلہ نقد ہونا ضروری ہے، اور سلم میں جمہور کے نزدیک سرمایہ مجلس میں ادا ہونا چاہیے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15968} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15969} مقروض سے قرض کی بیع اس شرط پر جائز ہے کہ جدا ہونے سے پہلے ادائیگی ہو جائے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15970} خیار مدت میں خریدار پر ادائیگی واجب نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15971}"
  es: "Naqd, en el léxico, es efectivo, lo opuesto al pago diferido; también significa entregar dinero en moneda, distinguir la buena moneda de la mala y acuñar oro, plata u otra moneda. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15968} Los términos acordados de un contrato, ya sea en efectivo o diferido, deben cumplirse; el intercambio de oro por oro o plata por plata requiere efectivo por ambas partes, y salam requiere que el capital se pague en la sesión por la mayoría de los juristas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15968} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15969} Una deuda puede venderse a su deudor si el precio se paga antes de que las partes se separen. La indemnización por homicidio involuntario se paga a plazos durante tres años. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15970} El comprador no tiene que pagar durante el período de opción; la condición de pagar durante este período es objeto de controversia, y los malikíes prohíben el pago condicional en algunos contratos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15971} El vendedor que paga los honorarios del ensayador es objeto de controversia entre las escuelas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15972}"
  fr: "Dans le lexique, le terme « naqd » désigne le paiement comptant, l'opposé du paiement différé; il signifie également remettre de l'argent en pièces, distinguer les bonnes pièces des mauvaises, et frapper monnaie d'or, d'argent ou d'autres devises. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15968} Les termes convenus d'un contrat, qu'il soit payable comptant ou à terme, doivent être respectés; l'échange d'or contre or ou d'argent contre argent exige un paiement comptant de part et d'autre, et le salam exige que le capital soit versé lors de la session selon la plupart des juristes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15968} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15969} Une créance peut être vendue à son débiteur si le prix est payé avant la séparation des parties. L'indemnisation pour les homicides involontaires est versée en plusieurs fois sur trois ans. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15970} L'acheteur n'est pas tenu de payer pendant la période d'option; l'obligation de payer pendant cette période est contestée, et les Malikites interdisent le paiement conditionnel dans certains contrats. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15971} Le paiement des honoraires de l'essayeur par le vendeur fait l'objet de controverses entre les écoles juridiques. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15972}"
  tr: "Dil olarak, 'nakit' 'nasi'den farklıdır; yani anında tazminat, nakit para verme, iyi ile kötü, para birimini altın, gümüş veya diğerlerinden ayırt etme anlamına gelir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15968} Temerrüt, erteleme veya gecikme konusunda üzerinde anlaşılan anlaşmanın yerine getirilmesi yükümlülüğüdür ve altın ile gümüşün satışını çoğunluk önünde barış içinde ve eşdeğer şekilde nakde olarak ödemek zorunludur. Borçlu olanlardan borç almak da bir toplantıda nakit koşuluyla satılabilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15968} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15969} Nakit ertelenmiş kan parasında veya durum seçiminde zorunlu değildir ve Maliki okuluna göre bazı sözleşmelerde nakit yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15970} Nakit seçeneği, hukukçuların kabul edilebilirliği konusunda farklı görüş bildirdiği bir koşuldur. Tüccar, eleştiriyi öğrenmekte özgürdür ki yalan söylenemez ve eleştirmenlerin ödemesi bundan fayda sağlayan tarafa aittir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15971} {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 s.15972}"
  id: "Dalam bahasa, 'uang tunai' berbeda dari 'nasi', yang berarti kompensasi langsung, memberikan uang tunai, membedakan yang baik dari yang buruk, dan mata uang dari emas, perak, atau lainnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15968} Default adalah kewajiban untuk memenuhi apa yang telah disepakati dalam hal penundaan atau penundaan, dan wajib untuk mencairkan penjualan emas dan perak dengan harga setara dan damai di hadapan mayoritas. Juga diperbolehkan menjual utang dari mereka yang berutang dengan syarat uang tunai dalam sebuah kumpulan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15968} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15969} Uang tunai tidak diperlukan dalam uang darah yang ditangguhkan atau dalam pilihan kondisi, dan uang tunai dilarang dalam beberapa kontrak menurut mazhab Maliki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15970} Pilihan uang tunai adalah syarat yang berbeda pendapat para ahli hukum tentang kebolehannya. Pedagang bebas belajar kritik agar tidak jatuh ke dalam kebohongan, dan pembayaran kepada kritikus adalah tanggung jawab siapa pun yang mendapat manfaat darinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15971} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15972}"
