label:
  ar: "وَضِيمة"
  en: "Wadima (funeral food)"
summary:
  ar: "الوضيمة في اللغة طعام المأتم، والطعام المتخذ عند المصيبة، والكلأ المجتمع، وأن يحلّ القوم بقوم قليل فيحسنون إليهم ويكرمونهم. وفي الاصطلاح الطعام المتخذ عند المصيبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478}\n\nالألفاظ ذات الصلة: الخُرْس وهو طعام الولادة أو طعام النفساء، والحذاق وهو طعام ختم القرآن للصبي. والوضيمة والخرس والحذاق كلها من الولائم، غير أن الوضيمة عند المصيبة والموت، والخرس عند السرور بالولادة، والحذاق عند حفظ القرآن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17479}\n\nحكم اتخاذ الوضيمة: إن كانت من أهل الميت فالحنفية والمالكية والشافعية والحنابلة يكرهونها، لأنها زيادة على مصيبتهم وشغل لهم وتشبه بأهل الجاهلية، وقد روي عن جرير بن عبد الله أنهم كانوا يعدّون الاجتماع إلى أهل الميت وصنع الطعام من النياحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17479}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480} وفي رأي للحنفية يُباح لأهل الميت اتخاذ الطعام، واستدلوا بحديث الرجل من الأنصار في الجنازة وما جرى بعدها من طعام المرأة، وصححه النووي في إسناده بحسب ما ذكر الكتاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480} وفصّل المالكية: إن كان الطعام لقراءة قرآن ونحوها مما يُرجى خيره للميت فلا بأس، وإلا كره، وإن أوصى الميت به كان من الثلث ووجب تنفيذه. وقال الشافعية يحرم إذا كان على الميت دين، أو في الورثة محجور عليه أو غائب، وصُنع من التركة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480} وقال الحنابلة إن الضيوف الذين يجتمعون عند أهل الميت لا يكره صنع الطعام لهم، إذا دعت الحاجة إليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480}\n\nإن كان الطعام من غير أهل الميت: اتفق الفقهاء على استحباب أن يهيئ الجيران والأقارب البعيدون طعاماً لأهل الميت يُشبعهم يومهم وليلتهم، لقوله في أهل جعفر بأن يُصنع لهم طعام، ولأنه بر ومعروف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481} وقال الحنابلة يُلحّ على أهل الميت في الأكل، وزاد الشافعية أن القسم عليهم لا بأس به إذا عُرف أنهم يبرون به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481} والمالكية والشافعية نصوا على أنه إذا اجتمع أهل الميت على محرم من ندب ولطم ونياحة فلا يجوز، والكتاب يتابع ذكر الحكم على الصفحة التالية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481}"
  en: "Wadima, lexically, is the food of a funeral gathering, the food made at a calamity, gathered pasture, and a visit in which a few people come down on a people and are treated well and honoured. For the jurists it is the food made at a calamity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478}\n\nRelated words: khurs, the food at a birth or for a woman after childbirth, and hadhdhaq, the feast at a boy's completion of the Qur'an. All three are feasts; wadima is at a calamity and death, khurs at the joy of a birth, and hadhdhaq at the memorising of the Qur'an. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17479}\n\nRuling on making a wadima when the family of the dead makes it: the Hanafis, Malikis, Shafi'is and Hanbalis dislike it, since it adds to their grief, distracts them, imitates the custom of the pre-Islamic age, and food is not made for sorrow. Jarir ibn Abd Allah is reported to have said that gathering to the family of the dead and making food was counted as wailing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17479}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480} A Hanafi view allows the family to make food, citing the account of a man of the Ansar who, after a burial, received a meal from a woman, which the book says al-Nawawi graded as sound in its chain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480} The Malikis: food for the recitation of the Qur'an or similar good for the dead is acceptable; otherwise disliked; if the dead person bequeathed it, it comes from the third and must be carried out. The Shafi'is forbid it if it is taken from the estate when the dead man has debts or heirs are minors, absent or under restraint. The Hanbalis add that where mourners are guests who come from far away, making food for them is not disliked, since it may be needed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480}\n\nFood from people other than the family: the jurists agree that it is recommended for the neighbours and distant relatives of the dead to prepare food for the family, enough for a day and a night, citing the saying to make food for the family of Ja'far, since it is righteousness and kindness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481} The Hanbalis urge the family to eat; the Shafi'is add that pressing them is acceptable where it is known that they will be pleased. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481} The Malikis and Shafi'is hold that if the family gathers for forbidden acts such as lamenting, wailing or striking the face, the gathering is not lawful; the text continues beyond p.17481. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481}"
