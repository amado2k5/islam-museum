id: concept/wadima-fiqh
class: concept
kind: legal
label:
  ar: "وَضِيمة"
  en: "Wadima (funeral food)"
  es: "Wadima (comida funeraria)"
  fr: "Wadima (nourriture funéraire)"
  ur: "ودیما ⁦(جنازے کا کھانا)⁩"
summary:
  ar: "الوضيمة في اللغة طعام المأتم، والطعام المتخذ عند المصيبة، والكلأ المجتمع، وأن يحلّ القوم بقوم قليل فيحسنون إليهم ويكرمونهم. وفي الاصطلاح الطعام المتخذ عند المصيبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478}\n\nالألفاظ ذات الصلة: الخُرْس وهو طعام الولادة أو طعام النفساء، والحذاق وهو طعام ختم القرآن للصبي. والوضيمة والخرس والحذاق كلها من الولائم، غير أن الوضيمة عند المصيبة والموت، والخرس عند السرور بالولادة، والحذاق عند حفظ القرآن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17479}\n\nحكم اتخاذ الوضيمة: إن كانت من أهل الميت فالحنفية والمالكية والشافعية والحنابلة يكرهونها، لأنها زيادة على مصيبتهم وشغل لهم وتشبه بأهل الجاهلية، وقد روي عن جرير بن عبد الله أنهم كانوا يعدّون الاجتماع إلى أهل الميت وصنع الطعام من النياحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17479}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480} وفي رأي للحنفية يُباح لأهل الميت اتخاذ الطعام، واستدلوا بحديث الرجل من الأنصار في الجنازة وما جرى بعدها من طعام المرأة، وصححه النووي في إسناده بحسب ما ذكر الكتاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480} وفصّل المالكية: إن كان الطعام لقراءة قرآن ونحوها مما يُرجى خيره للميت فلا بأس، وإلا كره، وإن أوصى الميت به كان من الثلث ووجب تنفيذه. وقال الشافعية يحرم إذا كان على الميت دين، أو في الورثة محجور عليه أو غائب، وصُنع من التركة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480} وقال الحنابلة إن الضيوف الذين يجتمعون عند أهل الميت لا يكره صنع الطعام لهم، إذا دعت الحاجة إليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480}\n\nإن كان الطعام من غير أهل الميت: اتفق الفقهاء على استحباب أن يهيئ الجيران والأقارب البعيدون طعاماً لأهل الميت يُشبعهم يومهم وليلتهم، لقوله في أهل جعفر بأن يُصنع لهم طعام، ولأنه بر ومعروف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481} وقال الحنابلة يُلحّ على أهل الميت في الأكل، وزاد الشافعية أن القسم عليهم لا بأس به إذا عُرف أنهم يبرون به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481} والمالكية والشافعية نصوا على أنه إذا اجتمع أهل الميت على محرم من ندب ولطم ونياحة فلا يجوز، والكتاب يتابع ذكر الحكم على الصفحة التالية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481}\n\nالمالكية والشافعية نصّوا على أن الطعام يُستحب ألا يُصنع لأهل الميت ويُرسل إليهم إذا اجتمعوا على محرّم من ندب ولطم ونياحة، بل يحرم إرسال الطعام إليهم لأنهم عصاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481}\n\nإجابة الدعوة إلى الوضيمة: الحنفية يرونها مستحبة، والشافعية والحنابلة والمالكية يرونها مكروهة، وذهب ابن رشد من المالكية إلى أنها مباحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481}\n\nالأكل من طعام الوضيمة: قال الحنفية لا بأس بالأكل منه. وقال المالكية لا ينبغي لأحد أن يأكل مما يصنعه أهل الميت ويجمعون الناس عليه، إلا أن يكون الصانع من الورثة بالغاً رشيداً فلا حرج. وقال الحنابلة يُكره لغير الضيوف الأكل منه، ويحرم إن كان الطعام من التركة وفي المستحقين محجور عليه، أو كان من مال الغير بغير إذنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17482}\n\nالذبح عند القبر ونقل الطعام إليه: عدّه الحنفية والمالكية والشافعية ⁦(فيما استظهره الهيتمي)⁩ والحنابلة من البدع المكروهة، لأنه من فعل الجاهلية، ولحديث «لا عقر في الإسلام»، والعَقر الذبح على القبر، ولما فيه من الرياء. وقال ابن تيمية يحرم الذبح عند القبر، ولو نذره ناذر لم يفِ به. وقال الحنابلة وضع الطعام والشراب على القبر ليأخذه الناس منكر، وإن كان في التركة محجور عليه أو غائب فهو حرام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17482}"
  en: "Wadima, lexically, is the food of a funeral gathering, the food made at a calamity, gathered pasture, and a visit in which a few people come down on a people and are treated well and honoured. For the jurists it is the food made at a calamity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478}\n\nRelated words: khurs, the food at a birth or for a woman after childbirth, and hadhdhaq, the feast at a boy's completion of the Qur'an. All three are feasts; wadima is at a calamity and death, khurs at the joy of a birth, and hadhdhaq at the memorising of the Qur'an. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17479}\n\nRuling on making a wadima when the family of the dead makes it: the Hanafis, Malikis, Shafi'is and Hanbalis dislike it, since it adds to their grief, distracts them, imitates the custom of the pre-Islamic age, and food is not made for sorrow. Jarir ibn Abd Allah is reported to have said that gathering to the family of the dead and making food was counted as wailing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17479}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480} A Hanafi view allows the family to make food, citing the account of a man of the Ansar who, after a burial, received a meal from a woman, which the book says al-Nawawi graded as sound in its chain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480} The Malikis: food for the recitation of the Qur'an or similar good for the dead is acceptable; otherwise disliked; if the dead person bequeathed it, it comes from the third and must be carried out. The Shafi'is forbid it if it is taken from the estate when the dead man has debts or heirs are minors, absent or under restraint. The Hanbalis add that where mourners are guests who come from far away, making food for them is not disliked, since it may be needed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480}\n\nFood from people other than the family: the jurists agree that it is recommended for the neighbours and distant relatives of the dead to prepare food for the family, enough for a day and a night, citing the saying to make food for the family of Ja'far, since it is righteousness and kindness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481} The Hanbalis urge the family to eat; the Shafi'is add that pressing them is acceptable where it is known that they will be pleased. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481} The Malikis and Shafi'is hold that if the family gathers for forbidden acts such as lamenting, wailing or striking the face, the gathering is not lawful; the text continues beyond p.17481. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481}\n\nThe Malikis and Shafi'is hold that it is not recommended to make food for a family that gathers for forbidden acts such as the excessive lament, striking and wailing, and to send food to them is forbidden, since they are sinners. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481}\n\nAnswering the invitation to a wadima: the Hanafis hold it recommended; the Shafi'is, Hanbalis and Malikis hold it disliked; Ibn Rushd of the Malikis holds it permitted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481}\n\nEating from the wadima food: the Hanafis say there is no harm in eating it. The Malikis say that no one should eat from food the family makes and invites people to, unless the one who made it is an adult heir of sound judgement. The Hanbalis say it is disliked for those who are not guests to eat it, and forbidden where the food is taken from the estate while one of its heirs is under restraint, or from another's property without permission. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17482}\n\nSlaughter at the grave and carrying food to it: the Hanafis, Malikis, the Shafi'is (as al-Haytami favoured) and the Hanbalis count it a disliked innovation, as a pre-Islamic practice, against the saying 'there is no slaughter in Islam', and because it invites show. Ibn Taymiyya holds slaughter at a grave forbidden, and a vow to do it is not to be kept. The Hanbalis call placing food or drink on a grave to be taken by people reprehensible, and forbidden where the estate includes a restrained or absent heir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17482}"
  es: "Wadima, léxicamente, es la comida de una reunión funeraria, la comida preparada en una calamidad, el pasto reunido y una visita en la que algunas personas descienden a un pueblo y son tratadas bien y honradas. Para los juristas es la comida preparada en una calamidad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478} Palabras relacionadas: khurs, la comida en un nacimiento o para una mujer después del parto, y hadhdhaq, el banquete en la finalización del Corán por parte de un niño. Los tres son banquetes; wadima es en una calamidad y muerte, khurs en la alegría de un nacimiento, y hadhdhaq en la memorización del Corán. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17479} Dictamen sobre la realización de un wadima cuando la familia del difunto lo hace: los hanafíes, malikíes, shafi'ís y hanbalíes lo desaprueban, ya que aumenta su dolor, los distrae, imita la costumbre de la época preislámica y la comida no se prepara para el duelo. Se dice que Jarir ibn Abd Allah afirmó que reunirse con la familia del difunto y preparar comida se consideraba un lamento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17479}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480} Una visión hanafí permite que la familia prepare comida, citando el relato de un hombre de los Ansar que, después de un entierro, recibió una comida de una mujer, que el libro dice que al-Nawawi clasificó como auténtica en su cadena. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480} Los malikíes: la comida para la recitación del Corán o un bien similar para el difunto es aceptable; de lo contrario, es desaconsejable; si la persona fallecida lo legó, proviene del tercero y debe llevarse a cabo. Los shafi'íes lo prohíben si se toma de la herencia cuando el difunto tiene deudas o los herederos son menores de edad, están ausentes o bajo restricción. Los hanbalíes añaden que cuando los dolientes son invitados que vienen de lejos, prepararles comida no es desaconsejable, puesto que puede ser necesaria. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480} Comida de personas que no son de la familia: los juristas coinciden en que es recomendable que los vecinos y parientes lejanos del difunto preparen comida para la familia, suficiente para un día y una noche, citando el dicho de preparar comida para la familia de Ja'far, puesto que es rectitud y bondad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481} Los hanbalíes instan a la familia a comer; los shafi'ís añaden que presionarlos es aceptable cuando se sabe que estarán complacidos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481} Los malikíes y shafiíes sostienen que si la familia se reúne para actos prohibidos como lamentarse, gemir o golpearse la cara, la reunión no es lícita; el texto continúa más allá de la p.17481. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481} Los malikíes y shafiíes sostienen que no es recomendable preparar comida para una familia que se reúne para actos prohibidos como el lamento excesivo, los golpes y los gemidos, y enviarles comida está prohibido, ya que son pecadores. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481} Responder a la invitación a un wadima: los hanafíes lo consideran recomendable; los shafiíes, hanbalíes y malikíes lo consideran desaconsejable; Ibn Rushd de los Malikis sostiene que está permitido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481} Comer de la comida del wadima: los Hanafíes dicen que no hay problema en comerla. Los Malikis dicen que nadie debe comer de la comida que la familia prepara e invita a la gente, a menos que quien la preparó sea un heredero adulto con buen juicio. Los Hanbalis dicen que es desaconsejable que la coman quienes no son invitados, y está prohibido cuando la comida se toma de la propiedad mientras uno de sus herederos está bajo arresto, o de la propiedad de otro sin permiso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17482} Sacrificio en la tumba y llevar comida a ella: los hanafíes, malikíes, shafiíes (como favorecía al-Haytami) y hanbalíes lo consideran una innovación reprobable, una práctica preislámica, contraria al dicho «en el Islam no hay matanza» y porque invita a la ostentación. Ibn Taymiyya considera prohibido el sacrificio en una tumba, y la promesa de realizarlo no debe cumplirse. Los hanbalíes consideran reprobable colocar comida o bebida en una tumba para que la gente la consuma, y lo prohíben cuando la herencia incluye un heredero con restricciones o ausente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17482}"
  fr: "Wadima, au sens littéral, désigne la nourriture servie lors d'un rassemblement funéraire, celle préparée en cas de calamité, le pâturage récolté, et une visite au cours de laquelle quelques personnes rendent visite à un peuple et sont bien accueillies et honorées. Pour les juristes, il s'agit de la nourriture préparée lors d'une calamité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478} Mots apparentés: khurs, la nourriture servie lors d'une naissance ou pour une femme après l'accouchement, et hadhdhaq, le festin célébré lorsqu'un garçon a terminé la mémorisation du Coran. Ces trois termes désignent des fêtes; wadima est associée à une calamité et à un décès, khurs à la joie d'une naissance, et hadhdhaq à la mémorisation du Coran. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17479} Concernant la préparation d'une wadima par la famille du défunt: les écoles hanafite, malikite, chaféite et hanbalite la désapprouvent, car elle accroît leur chagrin, les distrait, imite une coutume préislamique, et l'on ne prépare pas de nourriture pour exprimer sa douleur. Jarir ibn Abd Allah aurait dit que se réunir auprès de la famille du défunt et préparer un repas était considéré comme des lamentations. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17479}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480} L'école hanafite autorise la famille à préparer un repas, citant le récit d'un homme des Ansar qui, après un enterrement, reçut un repas d'une femme. L'ouvrage indique qu'al-Nawawi a authentifié ce récit dans sa chaîne de transmission. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480} L'école malikite autorise la préparation de nourriture pour la récitation du Coran ou d'un bien similaire pour le défunt; dans le cas contraire, elle est déconseillée. Si le défunt a légué ce bien, il est considéré comme provenant d'un tiers et doit être respecté. L'école chaféite l'interdit s'il est prélevé sur la succession, notamment lorsque le défunt avait des dettes ou si les héritiers sont mineurs, absents ou sous tutelle. Les Hanbalites ajoutent que lorsque les personnes en deuil sont des invités venus de loin, il n'est pas déconseillé de leur préparer à manger, car cela pourrait s'avérer nécessaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480} Nourriture provenant de personnes autres que la famille: les juristes s'accordent à dire qu'il est recommandé aux voisins et aux parents éloignés du défunt de préparer à manger pour la famille, en quantité suffisante pour un jour et une nuit, en citant le dicton qui enjoint de préparer à manger pour la famille de Ja'far, car c'est un acte de piété et de bienveillance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481} Les Hanbalites encouragent la famille à manger; les Shafi'ites ajoutent qu'insister est acceptable s'il est connu que cela leur fera plaisir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481} Les Malikites et les Chafi'ites estiment que si la famille se réunit pour des actes interdits tels que les lamentations, les gémissements ou les griffures, la réunion n'est pas licite; le texte se poursuit au-delà de la page 17481. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481} Les Malikites et les Chafi'ites estiment qu'il n'est pas recommandé de préparer de la nourriture pour une famille qui se réunit pour des actes interdits tels que les lamentations excessives, les griffures et les gémissements, et qu'il est interdit de leur envoyer de la nourriture, car ils sont pécheurs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481} Répondre à l'invitation à une wadima: les Hanafites le recommandent; les Chafi'ites, les Hanbalites et les Malikites le déconseillent. Ibn Rushd, de l'école malikite, l'autorise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481} Concernant la nourriture du wadima: les hanafites estiment qu'il n'y a pas de mal à en consommer. Les malikites, quant à eux, affirment que nul ne doit manger la nourriture préparée par la famille et offerte à des invités, à moins que celui qui l'a préparée ne soit un héritier majeur et sain d'esprit. Les hanbalites, enfin, la déconseillent à ceux qui ne sont pas invités d'en manger, et l'interdisent lorsque la nourriture provient du domaine alors qu'un héritier est sous contrainte, ou d'une propriété privée sans autorisation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17482} L'abattage rituel sur la tombe et le dépôt de nourriture sur celle-ci sont considérés comme une innovation déconseillée par les hanafites, les malikites, les chaféites (comme le préconisait al-Haytami) et les hanbalites. Il s'agit d'une pratique préislamique, contraire au principe « il n'y a pas d'abattage rituel en islam », et qui incite à la mise en scène. Ibn Taymiyya interdit formellement l'abattage rituel sur une tombe et déconseille de tenir un vœu en ce sens. Les hanbalites jugent répréhensible le fait de déposer de la nourriture ou des boissons sur une tombe, et l'interdisent en présence d'un héritier absent ou sous tutelle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17482}"
  ur: "ودیمہ، لغوی طور پر، جنازے کے اجتماع کا کھانا، کسی آفت کے وقت بنایا گیا کھانا، چراگاہوں کو جمع کیا جاتا ہے، اور ایسا دورہ جس میں چند لوگ کسی قوم پر اتر آتے ہیں اور ان کے ساتھ اچھا سلوک کیا جاتا ہے اور عزت دی جاتی ہے۔ فقہاء کے نزدیک یہ آفت کے وقت بنایا ہوا کھانا ہے۔ متعلقہ الفاظ: خرس، ولادت کے وقت یا ولادت کے بعد عورت کے لیے کھانا، اور ہدّاق، لڑکے کے قرآن کے ختم ہونے کی دعوت۔ تینوں عیدیں ہیں۔ ودیمہ مصیبت اور موت پر ہے، ولادت کی خوشی میں خرس ہے اور قرآن کے حفظ کرنے پر حددق ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17478}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17479} جب میت کے گھر والوں کی طرف سے ودیمہ بنانے کا حکم: حنفیہ، مالکیہ، شافعی اور حنبلی اس کو ناپسند کرتے ہیں، اس لیے ان کے اہلِ خانہ اسے ناپسند کرتے ہیں۔ زمانہ جاہلیت کا رواج، اور کھانا غم کے لیے نہیں بنایا جاتا۔ جریر بن عبداللہ ما سے مروی ہے کہ مرنے والوں کے گھر والوں کو جمع کرنا اور کھانا بنانا نوحہ میں شمار ہوتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17479}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.17480} ایک حنفی قول گھر والوں کو کھانا بنانے کی اجازت دیتا ہے، انصار کے ایک آدمی کا حوالہ دیتے ہوئے کہ جس نے دفن کرنے کے بعد ایک عورت کی طرف سے ایک کتاب الاویہ موصول کی، جس میں کہا گیا ہے: اس کی زنجیر. {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17480} مالکیہ: قرآن کی تلاوت کے لیے کھانا یا مُردوں کے لیے اس جیسی نیکی قابل قبول ہے۔ دوسری صورت میں ناپسندیدہ؛ اگر میت نے وصیت کی ہو تو تیسرے کی طرف سے آتی ہے اور اسے انجام دینا ضروری ہے۔ شافعی اس سے منع کرتے ہیں اگر وہ جائیداد سے اس صورت میں لیا جائے جب مردہ پر قرض ہو یا وارث نابالغ ہوں، غائب ہوں یا زیر حراست ہوں۔ حنبلی کہتے ہیں کہ جہاں سوگوار مہمان ہوں جو دور دراز سے آتے ہیں، ان کے لیے کھانا بنانا ناپسندیدہ ہے، کیونکہ اس کی ضرورت ہو سکتی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17480} اہل خانہ کے علاوہ دوسرے لوگوں کا کھانا: فقہاء کا اتفاق ہے کہ میت کے پڑوسیوں اور دور کے رشتہ داروں کے لیے مستحب ہے کہ اہل خانہ کے لیے ایک دن رات کا کھانا تیار کریں، اس قول کو نقل کرتے ہوئے کہ جعفر کے اہل خانہ کے لیے کھانا تیار کیا جائے، کیونکہ یہ نیکی اور احسان ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17480}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17481} حنبلی خاندان کو کھانے کی تاکید کرتے ہیں۔ شافعی کہتے ہیں کہ ان کو دبانا قابل قبول ہے جہاں یہ معلوم ہو کہ وہ خوش ہوں گے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17481} مالکیہ اور شافعیہ کا خیال ہے کہ اگر اہل خانہ حرام کاموں مثلاً نوحہ خوانی، نوحہ خوانی یا منہ پر مارنے کے لیے جمع ہوں تو یہ اجتماع حلال نہیں ہے۔ متن p.17481 سے آگے جاری ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17481} مالکیہ اور شافعیہ کا موقف ہے کہ ایسے گھر والوں کے لیے کھانا بنانا مستحب نہیں ہے جو حرام کاموں جیسے کثرت سے نوحہ خوانی، مار پیٹ اور نوحہ خوانی کے لیے جمع ہو، اور ان کے لیے کھانا بھیجنا حرام ہے، کیونکہ وہ حرامی ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17481} وادیمہ کی دعوت کا جواب دینا: احناف اسے مستحب سمجھتے ہیں۔ شافعی، حنبلی اور مالکی اسے ناپسند کرتے ہیں۔ مالکیوں میں سے ابن رشد نے اسے جائز قرار دیا ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17481} وادیمہ کھانے سے کھانا: احناف کہتے ہیں کہ کھانے میں کوئی حرج نہیں۔ مالکیوں کا کہنا ہے کہ کسی کو بھی اس کھانے میں سے کھانا نہیں کھانا چاہئے جو خاندان بناتا ہے اور لوگوں کو دعوت دیتا ہے، جب تک کہ اسے بنانے والا صحیح فیصلے کا بالغ وارث نہ ہو۔ حنبلی کہتے ہیں کہ جو لوگ مہمان نہیں ہیں ان کے لیے اس کا کھانا ناپسند ہے، اور حرام ہے جہاں جائیداد سے کھانا لیا جائے جب کہ اس کے وارثوں میں سے کوئی ایک کی پابندی میں ہو یا کسی دوسرے کے مال سے بغیر اجازت لے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17481}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17482} قبر پر ذبح کرنا اور اس پر کھانا لے جانا: حنفیہ، مالکیہ، شافعی ⁦(حنیفہ، حنوی اور فقہاء کے نزدیک اس کو ناپسندیدہ شمار کرتے ہیں)⁩ ایک قبل از اسلام عمل، اس قول کے خلاف کہ 'اسلام میں ذبیحہ نہیں ہے'، اور اس لیے کہ یہ شو کی دعوت دیتا ہے۔ ابن تیمیہ نے قبر پر ذبح کرنا حرام قرار دیا ہے اور اس کی نذر مانی ہے کہ اسے نہ رکھا جائے۔ حنبلی لوگ قبر پر کھانے پینے کی چیزیں رکھنے کو قابل مذمت اور حرام کہتے ہیں جہاں جائیداد میں روکا ہوا یا غیر حاضر وارث ہو۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص17482}"
