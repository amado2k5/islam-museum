label:
  ar: "وَضِيمة"
  en: "Wadima (funeral food)"
summary:
  ar: "الوضيمة في اللغة طعام المأتم، والطعام المتخذ عند المصيبة، والكلأ المجتمع، وأن يحلّ القوم بقوم قليل فيحسنون إليهم ويكرمونهم. وفي الاصطلاح الطعام المتخذ عند المصيبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478}\n\nالألفاظ ذات الصلة: الخُرْس وهو طعام الولادة أو طعام النفساء، والحذاق وهو طعام ختم القرآن للصبي. والوضيمة والخرس والحذاق كلها من الولائم، غير أن الوضيمة عند المصيبة والموت، والخرس عند السرور بالولادة، والحذاق عند حفظ القرآن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17479}\n\nحكم اتخاذ الوضيمة: إن كانت من أهل الميت فالحنفية والمالكية والشافعية والحنابلة يكرهونها، لأنها زيادة على مصيبتهم وشغل لهم وتشبه بأهل الجاهلية، وقد روي عن جرير بن عبد الله أنهم كانوا يعدّون الاجتماع إلى أهل الميت وصنع الطعام من النياحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17479}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480} وفي رأي للحنفية يُباح لأهل الميت اتخاذ الطعام، واستدلوا بحديث الرجل من الأنصار في الجنازة وما جرى بعدها من طعام المرأة، وصححه النووي في إسناده بحسب ما ذكر الكتاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480} وفصّل المالكية: إن كان الطعام لقراءة قرآن ونحوها مما يُرجى خيره للميت فلا بأس، وإلا كره، وإن أوصى الميت به كان من الثلث ووجب تنفيذه. وقال الشافعية يحرم إذا كان على الميت دين، أو في الورثة محجور عليه أو غائب، وصُنع من التركة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480} وقال الحنابلة إن الضيوف الذين يجتمعون عند أهل الميت لا يكره صنع الطعام لهم، إذا دعت الحاجة إليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480}\n\nإن كان الطعام من غير أهل الميت: اتفق الفقهاء على استحباب أن يهيئ الجيران والأقارب البعيدون طعاماً لأهل الميت يُشبعهم يومهم وليلتهم، لقوله في أهل جعفر بأن يُصنع لهم طعام، ولأنه بر ومعروف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481} وقال الحنابلة يُلحّ على أهل الميت في الأكل، وزاد الشافعية أن القسم عليهم لا بأس به إذا عُرف أنهم يبرون به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481} والمالكية والشافعية نصوا على أنه إذا اجتمع أهل الميت على محرم من ندب ولطم ونياحة فلا يجوز، والكتاب يتابع ذكر الحكم على الصفحة التالية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481}\n\nالمالكية والشافعية نصّوا على أن الطعام يُستحب ألا يُصنع لأهل الميت ويُرسل إليهم إذا اجتمعوا على محرّم من ندب ولطم ونياحة، بل يحرم إرسال الطعام إليهم لأنهم عصاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481}\n\nإجابة الدعوة إلى الوضيمة: الحنفية يرونها مستحبة، والشافعية والحنابلة والمالكية يرونها مكروهة، وذهب ابن رشد من المالكية إلى أنها مباحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481}\n\nالأكل من طعام الوضيمة: قال الحنفية لا بأس بالأكل منه. وقال المالكية لا ينبغي لأحد أن يأكل مما يصنعه أهل الميت ويجمعون الناس عليه، إلا أن يكون الصانع من الورثة بالغاً رشيداً فلا حرج. وقال الحنابلة يُكره لغير الضيوف الأكل منه، ويحرم إن كان الطعام من التركة وفي المستحقين محجور عليه، أو كان من مال الغير بغير إذنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17482}\n\nالذبح عند القبر ونقل الطعام إليه: عدّه الحنفية والمالكية والشافعية (فيما استظهره الهيتمي) والحنابلة من البدع المكروهة، لأنه من فعل الجاهلية، ولحديث «لا عقر في الإسلام»، والعَقر الذبح على القبر، ولما فيه من الرياء. وقال ابن تيمية يحرم الذبح عند القبر، ولو نذره ناذر لم يفِ به. وقال الحنابلة وضع الطعام والشراب على القبر ليأخذه الناس منكر، وإن كان في التركة محجور عليه أو غائب فهو حرام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17482}"
  en: "Wadima, lexically, is the food of a funeral gathering, the food made at a calamity, gathered pasture, and a visit in which a few people come down on a people and are treated well and honoured. For the jurists it is the food made at a calamity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478}\n\nRelated words: khurs, the food at a birth or for a woman after childbirth, and hadhdhaq, the feast at a boy's completion of the Qur'an. All three are feasts; wadima is at a calamity and death, khurs at the joy of a birth, and hadhdhaq at the memorising of the Qur'an. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17479}\n\nRuling on making a wadima when the family of the dead makes it: the Hanafis, Malikis, Shafi'is and Hanbalis dislike it, since it adds to their grief, distracts them, imitates the custom of the pre-Islamic age, and food is not made for sorrow. Jarir ibn Abd Allah is reported to have said that gathering to the family of the dead and making food was counted as wailing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17479}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480} A Hanafi view allows the family to make food, citing the account of a man of the Ansar who, after a burial, received a meal from a woman, which the book says al-Nawawi graded as sound in its chain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480} The Malikis: food for the recitation of the Qur'an or similar good for the dead is acceptable; otherwise disliked; if the dead person bequeathed it, it comes from the third and must be carried out. The Shafi'is forbid it if it is taken from the estate when the dead man has debts or heirs are minors, absent or under restraint. The Hanbalis add that where mourners are guests who come from far away, making food for them is not disliked, since it may be needed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480}\n\nFood from people other than the family: the jurists agree that it is recommended for the neighbours and distant relatives of the dead to prepare food for the family, enough for a day and a night, citing the saying to make food for the family of Ja'far, since it is righteousness and kindness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17480}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481} The Hanbalis urge the family to eat; the Shafi'is add that pressing them is acceptable where it is known that they will be pleased. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481} The Malikis and Shafi'is hold that if the family gathers for forbidden acts such as lamenting, wailing or striking the face, the gathering is not lawful; the text continues beyond p.17481. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481}\n\nThe Malikis and Shafi'is hold that it is not recommended to make food for a family that gathers for forbidden acts such as the excessive lament, striking and wailing, and to send food to them is forbidden, since they are sinners. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481}\n\nAnswering the invitation to a wadima: the Hanafis hold it recommended; the Shafi'is, Hanbalis and Malikis hold it disliked; Ibn Rushd of the Malikis holds it permitted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481}\n\nEating from the wadima food: the Hanafis say there is no harm in eating it. The Malikis say that no one should eat from food the family makes and invites people to, unless the one who made it is an adult heir of sound judgement. The Hanbalis say it is disliked for those who are not guests to eat it, and forbidden where the food is taken from the estate while one of its heirs is under restraint, or from another's property without permission. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17481}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17482}\n\nSlaughter at the grave and carrying food to it: the Hanafis, Malikis, the Shafi'is (as al-Haytami favoured) and the Hanbalis count it a disliked innovation, as a pre-Islamic practice, against the saying 'there is no slaughter in Islam', and because it invites show. Ibn Taymiyya holds slaughter at a grave forbidden, and a vow to do it is not to be kept. The Hanbalis call placing food or drink on a grave to be taken by people reprehensible, and forbidden where the estate includes a restrained or absent heir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17482}"
