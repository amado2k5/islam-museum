id: concept/sarir-al-asnan
class: concept
kind: scientific
label:
  ar: صرير الأسنان
  en: The grinding of the teeth
  ur: دانت پیسنا
  es: "El rechinar de los dientes"
summary:
  ar: صرير الأسنان في النوم يكون لضعف عضل الفكين وكالتشنج لها ويعرض للصبيان كثيراً ويزول إذا أدركوا، وإذا كثر صرير الأسنان وصريفها ⁦(وهو عند المحقق صوت الأسنان)⁩ في النوم أنذر بسكتة أو صرع أو تشنج أو دل على ديدان في البطن والذي من الديدان يكون ذا فترات، ويعالج المبتلى بذلك بتنقية الرأس وتدهين العنق بالأدهان الحارة العطرة التي فيها قوة قابضة من هذا الجنس {cite:canon-ibn-sina-print-v2 p.278}
  en: Teeth-grinding in sleep comes of a weakness of the jaw muscles, like a convulsion of them; it befalls boys often and goes when they grow. If the grinding and squeaking (the editor glosses sarif as the teeth's sound) in sleep runs much, it warns of stroke, epilepsy or convulsion, or points to worms in the belly — the worm kind comes in spells. The sufferer is treated by cleansing the head and anointing the neck with the hot fragrant oils having astringent power, of this kind {cite:canon-ibn-sina-print-v2 p.278}
  ur: 'نیند میں دانت پیسنا جبڑے کے پٹھوں کی کمزوری سے ہوتا ہے، گویا ان کی تشنج؛ لڑکوں کو اکثر ہوتا ہے اور جوان ہونے پر جاتا ہے؛ اگر نیند میں پیٹنا اور کڑکڑاہٹ ⁦(محقق: دانتوں کی آواز)⁩ بہت ہو تو سکتے، مرگی یا تشنج کی خبر دیتا ہے یا پیٹ کے کیڑوں کی دلیل ہے — کیڑوں والا وقفے وقفے سے ہوتا ہے؛ مبتلا کا علاج سر کی صفائی اور گردن کو گرم معطر تیلوں سے ملنا ہے جن میں قبض کی قوت ہو اسی جنس کے {cite:canon-ibn-sina-print-v2 p.278}'
  es: "El rechinamiento de dientes durante el sueño se debe a una debilidad de los músculos de la mandíbula, como una convulsión; suele afectar a los niños y desaparece al crecer. Si el rechinamiento y el chirrido (el editor interpreta sarif como el sonido de los dientes) durante el sueño son frecuentes, advierten de un derrame cerebral, epilepsia o convulsiones, o indican la presencia de lombrices intestinales; las lombrices se presentan en episodios. El paciente se trata limpiando la cabeza y ungiendo el cuello con aceites calientes y aromáticos de poder astringente, como este {cite:canon-ibn-sina-print-v2 p.278}."
