id: concept/awqat-al-salat
class: concept
kind: legal
label:
  ar: "أوقات الصلاة"
  en: "Awqat al-Salat (the prescribed times of the five prayers, the recommended and disliked times, and the rules of combining and of missed prayers)"
  fr: "Awqat al-Salat (horaires prescrits des cinq prières, moments recommandés ou déconseillés, regroupement et prières manquées)"
  es: "Awqat al-Salat (los horarios prescritos para las cinco oraciones, los horarios recomendados y desaconsejados, y las reglas para combinar y para las oraciones omitidas)"
  ur: "اوقات الصلاۃ ⁦(پانچوں نمازوں کے اوقات، مستحب اور ناپسندیدہ اوقات، اور نمازوں کو جمع کرنے اور چھوڑنے کے احکام)⁩"
  tr: "Namaz vakitleri"
  id: "Waktu doa"
summary:
  ar: "الوقت مقدار من الزمان مقدر لأمر ما، وأوقات الصلاة الأزمنة التي حددها الشارع لفعلها أداء، والوقت سبب وجوبها، فلا تصح قبله، وتكون قضاء بعد خروجه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3666} والصلوات الخمس لها أوقات بالكتاب والسنة، وحديث إمامة جبريل بيّن الأوقات، ولا خلاف في أنها خمسة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3666}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3667} ويختلف الفقهاء في أوقات الصبح والظهر والعصر والمغرب والعشاء، كالفجر الصادق، وظل المثل والمثلين، والشفق الأحمر والأبيض، والوتر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3667}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3668}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3669}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3670}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3671}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3672}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3673}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3674}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3675} ويستحب التغليس بالفجر عند الجمهور، والإبراد بالظهر في الصيف، وتعجيل المغرب، وتأخير العشاء إلى ثلث الليل أو نصفه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3672}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3673}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3674}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3675} وتكره الصلاة في ثلاثة أوقات عند الحنفية والشافعية والحنابلة: عند طلوع الشمس، وعند استوائها، وعند اصفرارها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3676}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3677} ويجوز الجمع بين الصلاتين بعذر السفر أو المطر عند الجمهور، وعند الحنفية في عرفة ومزدلفة فقط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3683}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3684} ومن لم يجد بعض الأوقات كسكان المناطق القطبية اختلف الفقهاء في تقديرها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3684}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3685}"
  en: "Awqat is the time fixed for an act; the times of prayer are those the law has set for performing a prayer on time, and the time is the cause of the obligation, so a prayer before its time is not valid, and one performed after it is a makeup. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3666} The five prayers have fixed times by the Qur'an and the Sunna, and the Gabriel report sets them out; all agree that there are five. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3666}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3667} The schools differ on the limits of dawn, noon, afternoon, sunset and night: the true dawn, the shadow of a thing equal or double its length, the red and white twilights, and the witr. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3667}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3668}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3669}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3670}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3671}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3672}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3673}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3674}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3675} Praying at the first of the dawn is lighter for men in the majority view, cooler noon prayer is recommended in summer, the sunset prayer is hastened, and the night prayer is delayed to a third or half of the night. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3672}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3673}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3674}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3675} Prayer is disliked at three times, at sunrise, at midday and at sunset, by the Hanafis, Shafi'is and Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3676}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3677} The combining of two prayers on a journey or in rain is allowed by the majority, while the Hanafis allow it only at Arafat and Muzdalifa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3683}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3684} Where the times cannot be found, as in the polar regions, the schools differ on setting estimated times. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3684}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3685}"
  fr: "Awqat désigne le temps fixé pour un acte ; les horaires de prière sont ceux que la Loi a déterminés pour accomplir une prière en son temps. Le temps est la cause de l’obligation : une prière faite avant son heure n’est donc pas valide, et après celle-ci elle constitue un rattrapage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3666} Les cinq prières ont des horaires fixés par le Coran et la sunna, que détaille le récit de Gabriel ; tous s’accordent sur leur nombre de cinq. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3666}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3667} Les écoles divergent sur les limites de l’aube, du midi, de l’après-midi, du coucher du soleil et de la nuit : l’aube véritable, l’ombre égale au simple ou au double de la hauteur d’une chose, les crépuscules rouge et blanc, et le witr. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3667}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3668}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3669}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3670}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3671}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3672}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3673}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3674}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3675} Selon la majorité, prier au début de l’aube est préférable pour les hommes ; il est recommandé d’attendre la fraîcheur pour la prière de midi en été, de hâter celle du coucher du soleil et de retarder celle de la nuit jusqu’au tiers ou à la moitié de la nuit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3672}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3673}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3674}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3675} Les hanafites, chaféites et hanbalites déconseillent la prière à trois moments : au lever du soleil, à midi et au coucher du soleil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3676}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3677} La majorité permet de regrouper deux prières en voyage ou par temps de pluie ; les hanafites ne le permettent qu’à Arafat et à Muzdalifa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3683}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3684} Lorsque certains horaires ne peuvent être constatés, comme dans les régions polaires, les écoles divergent sur leur estimation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3684}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3685}"
  es: "Awqat es el tiempo fijado para un acto; los tiempos de oración son aquellos que la ley ha establecido para realizar una oración a tiempo, y el tiempo es la causa de la obligación, por lo que una oración antes de su tiempo no es válida, y una realizada después de él es una compensación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3666} Las cinco oraciones tienen tiempos fijos por el Corán y la Sunna, y el informe de Gabriel los establece; todos están de acuerdo en que hay cinco. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3666}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3667} Las escuelas difieren en los límites del amanecer, mediodía, tarde, puesta del sol y noche: el verdadero amanecer, la sombra de una cosa igual o doble de su longitud, los crepúsculos rojo y blanco, y el witr. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3667}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3668}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3669}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3670}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3671}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3672}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3673}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3674}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3675} Orar al amanecer es más ligero para los hombres en la opinión mayoritaria, se recomienda la oración del mediodía más fresca en verano, se apresura la oración del atardecer y se retrasa la oración nocturna a un tercio o la mitad de la noche. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3672}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3673}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3674}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3675} La oración es desaconsejada en tres momentos, al amanecer, al mediodía y al atardecer, por los Hanafis, Shafi'is y Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3676}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3677} La combinación de dos oraciones en un viaje o bajo la lluvia está permitida por la mayoría, mientras que los Hanafi lo permiten sólo en Arafat y Muzdalifa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3683}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3684} Donde no se pueden encontrar los tiempos, como en las regiones polares, las escuelas difieren en el establecimiento de tiempos estimados. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3684}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3685}"
  ur: "اوقات کسی عمل کے لیے مقررہ وقت ہے۔ نماز کے اوقات وہ ہیں جو شریعت نے وقت پر نماز پڑھنے کے لیے مقرر کیے ہیں، اور وقت فرض کا سبب ہے، اس لیے وقت سے پہلے کی نماز درست نہیں، اور اس کے بعد کی نماز قضاء ہے۔ پانچوں نمازوں کے اوقات قرآن و سنت نے متعین کیے ہیں اور جبرائیل کی رپورٹ ان کا تعین کرتی ہے۔ سب متفق ہیں کہ پانچ ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3666}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3667} مدارس میں فجر، دوپہر، دوپہر، غروب آفتاب اور رات کی حدود میں فرق ہے: سچی سحر، کسی چیز کا سایہ، اس کی لمبائی اور سفیدی کے برابر یا دگنی اور سفید۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3667}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ3668}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ3669}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ3668 p.3670}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.3671}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.3672}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.3673}{cite-cowaitiy-noor-v3 p.3673}{cite ص.3674}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3675} مردوں کے لیے فجر کی پہلی نماز زیادہ تر لوگوں کے لیے ہلکی ہے، گرمیوں میں ٹھنڈی دوپہر کی نماز مستحب ہے، غروب آفتاب کی نماز میں جلدی کی جاتی ہے، اور رات کی نماز ایک تہائی یا آدھی رات تک مؤخر کی جاتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3672}{cite:fiqh-Mawsua-kuwaityya-noor-v3 p.3673}{cite:fiqh-mawsua-kuwaityya-nor-v3 p.3674}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.3674}{cite:fiqh-mawsua-kuwatiyya-noor-v3 p.3674}{cite:fiqh-mawsua-kuwatiyya-noor-v3 p.3673} احناف، شافعی اور حنبلی کے نزدیک تین وقت، طلوع آفتاب، دوپہر اور غروب آفتاب کے وقت نماز پڑھنا مکروہ ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3676}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3677} سفر میں یا بارش میں دو نمازوں کو جمع کرنا جمہور کے نزدیک جائز ہے جبکہ احناف صرف عرفات اور مزدلفہ میں اس کی اجازت دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3683}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3684} جہاں اوقات نہیں مل سکتے، جیسا کہ قطبی خطوں میں، اسکولوں میں تخمینی اوقات مقرر کرنے میں اختلاف ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3684}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3685}"
  tr: "Zaman, bir mesele için sabit bir süredir ve namaz zamanları, Kanun Verenin bu süreleri yerine getirmesi için belirttiği sürelerdir ve bu süre onların yükümlülüğünün sebebidir, bu yüzden işlem öncesinde geçerli değildir ve sona erdikten sonra telafi edilir. {atıfta bulunmak:fiqh-mawsua-kuwaitiyya-noor-v3 s.3666} Beş namazın zamanları Kur'an ve Sünnet'e göre ve Cebrayıl'ın liderliğinin hadislerine göre zamanlar arasında vardır, beş olduğu konusunda tartışma yoktur. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.3666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3667} Hukukçular, şafak, öğle, öğleden sonra, gün batımı ve İşa gibi saatler konusunda farklı görüşler sergiler; örneğin gerçek şafak, atasözün gölgesi ve iki form, kırmızı ve beyaz alacakaranlık ve ara sıra dua. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3667}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3669} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3670} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3671}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3672} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3674}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3675} Cemaatle birlikte dua ederken şafakta ghelbas (ritüel yıkama) yapılması, yazın öğlen serinlemek, Mağrip'i hızlandırmak ve İşa'yı gecenin üçte biri veya yarısına kadar ertelemek önerilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3672} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3675} Hanefiler, Şafi'ler ve Hanbali'lere göre üç kez namaz kılmak hoş karşılanmaz: gün doğumunda, gün doğumunda, gün doğumunda ve sarardığında. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3677} cemaate göre seyahat veya yağmur nedeniyle iki namazın birleştirilmesi ve Hanefi okuluna göre yalnızca Arafat ve Muzdalifah'ta mümkündür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3683} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3684} Ve kutup bölgelerinin sakinleri gibi belirli zamanları bulmayanlar, hukukçular değerlendirmelerinde farklılık gösterir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3684} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3685}"
  id: "Waktu adalah waktu yang tetap untuk suatu perkara, dan waktu shalat adalah waktu yang ditentukan oleh Pemberi Hukum untuk melaksanakannya, dan waktu adalah alasan kewajibannya, sehingga waktu tersebut tidak berlaku sebelum zat, dan disusun setelah selesai. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3666} Kelima shalat tersebut memiliki waktu sesuai Al-Qur'an dan Sunnah, serta hadis kepemimpinan Gabriel di antara zaman, tidak ada perdebatan bahwa mereka adalah lima. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3667} Para ahli hukum berbeda pendapat mengenai waktu fajar, tengah hari, sore, matahari terbenam, dan Isha, seperti fajar sejati, bayangan peribahasaan dan dua bentuk, senja merah dan putih, serta doa yang aneh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3667} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3669} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3670} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3671} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3672} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3675} Disarankan melakukan ghelbas (ritual mandi) saat fajar dalam doa bersama jemaat, mendinginkan diri di tengah hari musim panas, mempercepat Maghrib, dan menunda Isha hingga sepertiga atau setengah malam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3672} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3675} Adalah tidak disukai untuk berdoa tiga kali menurut Hanafi, Shafi'i, dan Hanbali: saat matahari terbit, saat siang, dan saat berubah menjadi kuning. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3677} Diperbolehkan menggabungkan dua shalat karena perjalanan atau hujan sesuai jamaah, dan menurut mazhab Hanafi hanya di Arafat dan Muzdalifah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3683} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3684} Dan mereka yang tidak menemukan waktu tertentu seperti penduduk wilayah kutub, para ahli hukum berbeda dalam penilaiannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3684} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3685}"
