class: concept
kind: legal
label: { ar: "أوقات الصلاة", en: "Awqat al-Salat (the prescribed times of the five prayers, the recommended and disliked times, and the rules of combining and of missed prayers)" }
summary:
  ar: "الوقت مقدار من الزمان مقدر لأمر ما، وأوقات الصلاة الأزمنة التي حددها الشارع لفعلها أداء، والوقت سبب وجوبها، فلا تصح قبله، وتكون قضاء بعد خروجه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3666} والصلوات الخمس لها أوقات بالكتاب والسنة، وحديث إمامة جبريل بيّن الأوقات، ولا خلاف في أنها خمسة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3666}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3667} ويختلف الفقهاء في أوقات الصبح والظهر والعصر والمغرب والعشاء، كالفجر الصادق، وظل المثل والمثلين، والشفق الأحمر والأبيض، والوتر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3667}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3668}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3669}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3670}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3671}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3672}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3673}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3674}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3675} ويستحب التغليس بالفجر عند الجمهور، والإبراد بالظهر في الصيف، وتعجيل المغرب، وتأخير العشاء إلى ثلث الليل أو نصفه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3672}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3673}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3674}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3675} وتكره الصلاة في ثلاثة أوقات عند الحنفية والشافعية والحنابلة: عند طلوع الشمس، وعند استوائها، وعند اصفرارها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3676}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3677} ويجوز الجمع بين الصلاتين بعذر السفر أو المطر عند الجمهور، وعند الحنفية في عرفة ومزدلفة فقط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3683}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3684} ومن لم يجد بعض الأوقات كسكان المناطق القطبية اختلف الفقهاء في تقديرها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3684}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3685}"
  en: "Awqat is the time fixed for an act; the times of prayer are those the law has set for performing a prayer on time, and the time is the cause of the obligation, so a prayer before its time is not valid, and one performed after it is a makeup. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3666} The five prayers have fixed times by the Qur'an and the Sunna, and the Gabriel report sets them out; all agree that there are five. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3666}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3667} The schools differ on the limits of dawn, noon, afternoon, sunset and night: the true dawn, the shadow of a thing equal or double its length, the red and white twilights, and the witr. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3667}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3668}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3669}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3670}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3671}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3672}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3673}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3674}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3675} Praying at the first of the dawn is lighter for men in the majority view, cooler noon prayer is recommended in summer, the sunset prayer is hastened, and the night prayer is delayed to a third or half of the night. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3672}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3673}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3674}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3675} Prayer is disliked at three times, at sunrise, at midday and at sunset, by the Hanafis, Shafi'is and Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3676}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3677} The combining of two prayers on a journey or in rain is allowed by the majority, while the Hanafis allow it only at Arafat and Muzdalifa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3683}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3684} Where the times cannot be found, as in the polar regions, the schools differ on setting estimated times. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3684}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3685}"
