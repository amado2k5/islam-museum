id: concept/zij-sabi-converting-mean-days-to-unequal-days
class: concept
kind: scientific
label: { ar: "تحويل الأيام الوسطى إلى الأيام المختلفة الموجودة", en: "Converting mean days to the unequal days found", ur: "وسطی دنوں کو پائے گئے غیر مساوی دنوں میں بدلنا" }
summary:
  ar: "يقول البتاني إن من أراد أن يحول من الأيام الوسطى التي تخرج من الجداول إلى الأيام المختلفة الموجودة عمل بعكس ذلك، فيزيد الفضل على الأيام الوسطى إذا كان عدد الأزمان أقل، وينقصه منها إذا كان عدد الأزمان هو الأكثر، فما بلغت الأيام الوسطى بعد الزيادة أو النقصان فهو المحول إلى الأيام المختلفة الموجودة {cite:zij-sabi-nallino-byblion p.79}."
  en: "Al-Battani says that whoever wants to turn from the mean days that come out of the tables to the unequal days found does the opposite: the excess is added to the mean days if the number of times is the smaller, and taken from them if the number of times is the larger; what the mean days come to after the addition or subtraction is what is turned into the unequal days found {cite:zij-sabi-nallino-byblion p.79}."
  ur: "البتانی کہتے ہیں کہ جو جدولوں سے نکلنے والے وسطی دنوں کو پائے گئے غیر مساوی دنوں میں بدلنا چاہے وہ اس کا الٹ کرے: اگر ازمان کی تعداد کم ہو تو فرق وسطی دنوں میں جمع کرے، اور اگر ازمان کی تعداد زیادہ ہو تو اس میں سے گھٹائے؛ جمع یا تفریق کے بعد وسطی دن جو بنیں وہی پائے گئے غیر مساوی دنوں میں بدلے ہوئے ہیں {cite:zij-sabi-nallino-byblion p.79}۔"
