id: concept/idkhar-fiqh
class: concept
kind: legal
label:
  ar: "ادخار"
  en: "Idkhar (saving and storing wealth: the state's reserves, individuals' savings, zakat and hoarding)"
  es: "Idkhar (ahorro y acumulación de riqueza: reservas del Estado, ahorros individuales, zakat y atesoramiento)"
  fr: "Idkhar (épargne et stockage de richesses: réserves de l'État, épargne des particuliers, zakat et thésaurisation)"
summary:
  ar: "الادخار في الاصطلاح خبء المال لوقت الحاجة، والاكتناز ما لم تُؤدَّ زكاته، والاحتكار حبس الشيء انتظاراً لغلائه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1995} ويحرم ادخار النصاب الذي لم تُؤدَّ زكاته بالاتفاق، ويجوز ادخار دونه، واختلف في ادخار الفاضل عن الحاجة بعد أداء الزكاة بين الجمهور المجيز وأبي ذر المانع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1996} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1997} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1998} وفي الدولة اتجاهات: منع الادخار، أو ادخار الفاضل للنوائب، أو البدء بأهل البلد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1996} ويجب على من عنده فاضل من الأقوات بذله لمن اضطر إليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2000}"
  en: "Saving (idkhar) is setting wealth aside for a time of need; hoarding is wealth whose zakat is unpaid, and stockpiling is withholding goods to await a rise in price. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1995} Saving unpaid wealth above the nisab is forbidden by agreement, saving below it is permitted, and the view on saving surplus after zakat is paid divides the majority, which permits it, from Abu Dharr, who forbids it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1996} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1997} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1998} For the state there are views: forbidding saving, saving surplus against calamities, or beginning with the people of the town. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1996} Whoever holds a surplus of staples must give it to one in urgent need. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2000}"
  es: "El ahorro (idkhar) consiste en apartar la riqueza para un momento de necesidad; el acaparamiento es la riqueza cuyo zakat no se ha pagado, y el almacenamiento es retener bienes a la espera de una subida de precio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1995} Ahorrar riqueza no pagada por encima del nisab está prohibido por acuerdo, ahorrar por debajo de él está permitido, y la opinión sobre ahorrar el excedente después de pagar el zakat divide a la mayoría, que lo permite, de Abu Dharr, que lo prohíbe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1996} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1997} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1998} Para el estado hay puntos de vista: prohibir el ahorro, ahorrar el excedente contra las calamidades, o comenzar con la gente del ciudad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1996} Quien tenga un excedente de alimentos básicos debe dárselo a alguien que lo necesite con urgencia. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.2000}"
  fr: "L'épargne (idkhar) consiste à mettre de côté des biens en prévision d'un besoin; la thésaurisation désigne les biens dont la zakat n'a pas été acquittée, et le stockage consiste à retenir des biens en attendant une hausse des prix. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1995} L'épargne de biens non acquittés au-delà du nisab est interdite par consensus, tandis que l'épargne en deçà est permise. Concernant l'épargne du surplus après paiement de la zakat, la majorité des savants l'autorise, contrairement à Abu Dharr qui l'interdit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1996} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1997} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1998} Pour l'État, il existe des points de vue: interdire l'épargne, épargner le surplus contre les calamités, ou commencer par le peuple du ville. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1996} Celui qui détient un surplus de produits de première nécessité doit le donner à celui qui en a un besoin urgent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2000}"
