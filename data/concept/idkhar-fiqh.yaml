label:
  ar: "ادخار"
  en: "Idkhar (saving and storing wealth: the state's reserves, individuals' savings, zakat and hoarding)"
summary:
  ar: "الادخار في الاصطلاح خبء المال لوقت الحاجة، والاكتناز ما لم تُؤدَّ زكاته، والاحتكار حبس الشيء انتظاراً لغلائه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1995} ويحرم ادخار النصاب الذي لم تُؤدَّ زكاته بالاتفاق، ويجوز ادخار دونه، واختلف في ادخار الفاضل عن الحاجة بعد أداء الزكاة بين الجمهور المجيز وأبي ذر المانع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1996} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1997} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1998} وفي الدولة اتجاهات: منع الادخار، أو ادخار الفاضل للنوائب، أو البدء بأهل البلد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1996} ويجب على من عنده فاضل من الأقوات بذله لمن اضطر إليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2000}"
  en: "Saving (idkhar) is setting wealth aside for a time of need; hoarding is wealth whose zakat is unpaid, and stockpiling is withholding goods to await a rise in price. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1995} Saving unpaid wealth above the nisab is forbidden by agreement, saving below it is permitted, and the view on saving surplus after zakat is paid divides the majority, which permits it, from Abu Dharr, who forbids it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1996} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1997} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1998} For the state there are views: forbidding saving, saving surplus against calamities, or beginning with the people of the town. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1996} Whoever holds a surplus of staples must give it to one in urgent need. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2000}"
