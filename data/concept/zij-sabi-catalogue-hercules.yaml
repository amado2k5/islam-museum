label:
  ar: "الجاثي"
  en: "Hercules (al-Jathi)"
  ur: "جاثی"
summary:
  ar: "يسمّي فهرس البتاني صورة الجاثي على ركبتيه، ويعدّ كواكبها مرتّبة من الرأس إلى الكتفين والذراعين والمرفقين والرسغين ثم الركبتين. لا تُنقل هنا مواضع هذه الكواكب، والحواشي بعد القائمة تقارن قدرها بفهارس أخرى. {cite:nallino-albatenii-opus-astronomicum pp.148}"
  en: "The catalogue names the figure al-Jathi, the one kneeling, and lists its stars from the head down through the shoulders, arms, elbows and wrists to the knees. The notes after the list compare the magnitudes with other catalogues. The positions are not transcribed here. {cite:nallino-albatenii-opus-astronomicum pp.148}"
  ur: "البتانی کے ستاروں کی فہرست میں جاثی، یعنی گھٹنوں کے بل جھکا ہوا، کی صورت ہے۔ اس کے ستارے سر سے کندھوں، بازوؤں، کہنیوں، کلائیوں اور گھٹنوں تک ترتیب سے درج ہیں۔ حواشی ان کا قدر دوسری فہرستوں سے موازنہ کرتے ہیں۔ مواضع یہاں نقل نہیں ہوئے۔ {cite:nallino-albatenii-opus-astronomicum pp.148}"
