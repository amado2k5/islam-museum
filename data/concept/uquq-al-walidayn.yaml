label:
  ar: "عقوق الوالدين"
  en: "Disobedience to parents (uquq al-walidayn)"
  ur: "والدین کی نافرمانی"
  es: "Desobediencia a los padres (uquq al-walidayn)"
  fr: "Désobéissance aux parents (uquq al-walidayn)"
  tr: "ebeveyn itaatsizliği"
  id: "ketidakpatuhan orang tua"
summary:
  ar: "عقوق الوالدين ضد البر بهما، كما يعرضه الشيخ عمر عبد الكافي: صوره من الغضب والاستخفاف والإيذاء، وما يترتب عليه في الآخرة."
  en: "Disobedience to parents, the opposite of honouring them, as Sheikh Omar Abdelkafy presents it: its forms of anger, contempt and harm, and its consequences in the Hereafter."
  ur: "والدین کی نافرمانی، جو ان کے ساتھ نیکی کی ضد ہے، شیخ عمر عبدالکافی کے بیان کے مطابق: غصے، حقارت اور ایذا کی صورتیں، اور آخرت میں اس کے نتائج۔"
  es: "La desobediencia a los padres, lo opuesto a honrarlos, tal como la presenta el jeque Omar Abdelkafy: sus formas de ira, desprecio y daño, y sus consecuencias en el Más Allá."
  fr: "La désobéissance aux parents, l'opposé du respect qu'on leur doit, telle que la présente le cheikh Omar Abdelkafy: ses formes de colère, de mépris et de préjudice, et ses conséquences dans l'au-delà."
  tr: "Şeyh Ömer Abdul Kafi tarafından sunulan ebeveynlere karşı itaatsizlik, onlara karşı görev yerine getirmek: öfke, küçümseme ve zarar biçimleri ile sonrasında Ahirette olanlar."
  id: "Ketidakpatuhan kepada orang tua terhadap kewajiban terhadap mereka, seperti yang disajikan oleh Sheikh Omar Abdul Kafi: bentuk-bentuk kemarahan, penghinaan, dan kerugian, serta apa yang terjadi di akhirat."
