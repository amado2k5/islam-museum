  ar: "يوصي ابن سينا من أراد أن يسهل أو يتقيأ أن يفرق طعامه على مرات وأن ينوع أطعمته وأشربته، لأن المعدة بذلك تشتاق إلى دفع ما فيها إلى فوق أو إلى تحت {cite:canon-ibn-sina-print-v1 p.276}."
  en: "Ibn Sina advises whoever means to purge or vomit to divide the day's food into several meals and to vary both foods and drinks, so that the stomach comes to long to push out what is in it upward or downward {cite:canon-ibn-sina-print-v1 p.276}."
