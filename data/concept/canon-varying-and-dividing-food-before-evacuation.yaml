label: { ar: "تفريق الطعام وتنويعه قبل الاستفراغ عند ابن سينا", en: "Dividing and varying food before evacuation in the Canon", ur: "استفراغ سے پہلے غذا بانٹنا اور بدلنا قانون میں", es: "Dividir y variar los alimentos antes de la evacuación en el Canon", fr: "Répartition et variété des aliments avant l'évacuation dans le Canon" }
summary:
  ar: "يوصي ابن سينا من أراد أن يسهل أو يتقيأ أن يفرق طعامه على مرات وأن ينوع أطعمته وأشربته، لأن المعدة بذلك تشتاق إلى دفع ما فيها إلى فوق أو إلى تحت {cite:canon-ibn-sina-print-v1 p.276}."
  en: "Ibn Sina advises whoever means to purge or vomit to divide the day's food into several meals and to vary both foods and drinks, so that the stomach comes to long to push out what is in it upward or downward {cite:canon-ibn-sina-print-v1 p.276}."
  es: "Ibn Sina aconseja a quien quiera purgarse o vomitar que divida la comida del día en varias comidas y varíe tanto los alimentos como las bebidas, de modo que el estómago se alargue lo suficiente como para expulsar lo que hay en él hacia arriba o hacia abajo {cite:canon-ibn-sina-print-v1 p.276}."
  fr: "Ibn Sina conseille à celui qui a l'intention de se purger ou de vomir de diviser la nourriture de la journée en plusieurs repas et de varier à la fois les aliments et les boissons, afin que l'estomac ait trop de mal à expulser ce qui s'y trouve vers le haut ou vers le bas {cite:canon-ibn-sina-print-v1 p.276}."
