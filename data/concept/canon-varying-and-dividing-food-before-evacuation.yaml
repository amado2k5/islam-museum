id: concept/canon-varying-and-dividing-food-before-evacuation
class: concept
kind: scientific
label: { ar: "تفريق الطعام وتنويعه قبل الاستفراغ عند ابن سينا", en: "Dividing and varying food before evacuation in the Canon", ur: "استفراغ سے پہلے غذا بانٹنا اور بدلنا قانون میں", es: "Dividir y variar los alimentos antes de la evacuación en el Canon", fr: "Répartition et variété des aliments avant l'évacuation dans le Canon", tr: "İbn Sina'ya göre kusmadan önce yiyecekleri ayırt etmek ve çeşitlendirmek", id: "Membedakan dan mendiversifikasi makanan sebelum muntah menurut Ibn Sina" }
summary:
  ar: "يوصي ابن سينا من أراد أن يسهل أو يتقيأ أن يفرق طعامه على مرات وأن ينوع أطعمته وأشربته، لأن المعدة بذلك تشتاق إلى دفع ما فيها إلى فوق أو إلى تحت {cite:canon-ibn-sina-print-v1 p.276}."
  en: "Ibn Sina advises whoever means to purge or vomit to divide the day's food into several meals and to vary both foods and drinks, so that the stomach comes to long to push out what is in it upward or downward {cite:canon-ibn-sina-print-v1 p.276}."
  es: "Ibn Sina aconseja a quien quiera purgarse o vomitar que divida la comida del día en varias comidas y varíe tanto los alimentos como las bebidas, de modo que el estómago se alargue lo suficiente como para expulsar lo que hay en él hacia arriba o hacia abajo {cite:canon-ibn-sina-print-v1 p.276}."
  fr: "Ibn Sina conseille à celui qui a l'intention de se purger ou de vomir de diviser la nourriture de la journée en plusieurs repas et de varier à la fois les aliments et les boissons, afin que l'estomac ait trop de mal à expulser ce qui s'y trouve vers le haut ou vers le bas {cite:canon-ibn-sina-print-v1 p.276}."
  ur: "ابن سینا مشورہ دیتے ہیں کہ جو شخص قے یا قے کا مطلب صاف کرے اسے دن کے کھانے کو کئی کھانوں میں تقسیم کرے اور کھانے پینے کی چیزوں میں فرق کرے تاکہ معدہ اس میں موجود چیزوں کو اوپر یا نیچے کی طرف دھکیلنے کے لیے لمبا ہو جائے۔"
  tr: "İbn Sina, rahatlamak veya kusmak isteyen kişinin yiyeceklerini birkaç kez ayırmasını ve yiyecek ile içeceklerini çeşitlendirmesini önerir, çünkü bunu yaparken mide içindekileri yukarı ya da aşağı itmek ister {cite:canon-ibn-sina-print-v1 s.276}."
  id: "Ibn Sina menyarankan agar siapa pun yang ingin melonggarkan atau muntah harus memisahkan makanannya beberapa kali dan mengubah makanan serta minumannya, karena dengan demikian perut ingin mendorong isi makanannya naik atau turun {cite:canon-ibn-sina-print-v1 hlm.276}."
