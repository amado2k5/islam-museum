id: concept/raqib-wa-atid
class: concept
kind: angel
label:
  ar: الرقيب والأتيد
  en: The Watcher and the Attendant
  ur: رقیب اور اتاب
summary:
  ar: اسما منسوبة في الحديث للملكين اللذين يكتبان أعمال العبد، وقيل إنهما ملائكة من أهل السماء موكلون بالكتابة؛ والقرآن يقرر أن لكل نفس حافظاً
    [[passage/quran-86-4|الطارق 4]] وكراماً كاتبين [[passage/quran-82-11|الانفطار 11]].
  en: Names given in hadith to the two angels who record a servant's deeds, said to be among the angels charged with writing; the Qur'an affirms
    a guardian over every soul [[passage/quran-86-4|al-Tariq 4]] and noble recording scribes [[passage/quran-82-11|al-Infitar 11]].
  ur: حدیث میں اس دو فرشتوں کے نام ہیں جو بندے کے اعمال لکھتے ہیں، کہا جاتا ہے کہ وہ کتابت کے فرائض والے فرشتوں میں سے ہیں؛ قرآن اس کی تصدیق کرتا
    ہے کہ ہر نفس کا حافظ ہے [[passage/quran-86-4|الطارق 4]] اور کرام کاتبین ہیں [[passage/quran-82-11|الانفطار 11]]۔
