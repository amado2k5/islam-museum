label:
  ar: "لماذا تسمى ترجمة القرآن تفسيراً؟ الزرقاني والشاطبي وابن تيمية وبكثال"
  en: "Why a translation of the Qur'an is called an interpretation: al-Zarqani, al-Shatibi, Ibn Taymiyya and Pickthall"
  ur: "قرآن کے ترجمے کو تفسیر کیوں کہا جاتا ہے: زرقانی، شاطبی، ابن تیمیہ اور پکتھال"
  fr: "Pourquoi une traduction du Coran est dite interprétation : al-Zarqani, al-Shatibi, Ibn Taymiyya et Pickthall"
  es: "Por qué una traducción del Corán se llama interpretación: al-Zarqani, al-Shatibi, Ibn Taymiyya y Pickthall"
  tr: "Kur'an'ın çevirisi neden tefsir olarak adlandırılır? El-Zürkani, El-Şatibi, İbn Teymiyye ve Bakthal"
  id: "Mengapa terjemahan Al-Qur'an disebut tafsir? Al-Zurqani, Al-Shatibi, Ibn Taymiyyah, dan Bakthal"
summary:
  ar: "يفرّق الزرقاني بين الترجمة الحرفية والترجمة التفسيرية، ويرى أن الترجمة لا تحاكي نظم القرآن العربي وإعجازه فتسمى تفسيراً بلغة أخرى، ويفرّق الشاطبي بين المعنى الأصلي الذي يمكن نقله بغير العربية والمعاني الثانوية المرتبطة بالعربية التي لا تنتقل بالترجمة، ويذكر ابن تيمية أن ترجمة القرآن خارج الصلاة جائزة بإجماع المسلمين كما يجوز تفسيره، ويكتب بكثال أن القرآن لا يمكن أن يترجم وأن عمله محاولة لتقديم معناه."
  en: "Al-Zarqani distinguishes literal from interpretive translation and holds that a translation cannot reproduce the Arabic naẓm and inimitability of the Qur'an and so is to be called tafsir in another language; al-Shatibi distinguishes the primary informative meaning, which can be conveyed in other languages, from the secondary rhetorical meanings bound to Arabic usage, which cannot; Ibn Taymiyya states that translating the Qur'an outside prayer is permissible by Muslim consensus as its tafsir is; and Pickthall writes that the Koran cannot be translated and that his work is an attempt to present its meaning."
  ur: "زرقانی لفظی ترجمے اور تفسیری ترجمے میں فرق کرتے ہیں اور سمجھتے ہیں کہ ترجمہ قرآن کے عربی نظم اور اعجاز کی نقل نہیں کر سکتا، اس لیے اسے دوسری زبان میں تفسیر کہا جائے گا؛ شاطبی اصل خبری معنی، جو دوسری زبانوں میں پہنچایا جا سکتا ہے، اور ان ثانوی بلاغی معانی میں فرق کرتے ہیں جو عربی استعمال سے بندھے ہیں اور ترجمے سے منتقل نہیں ہوتے؛ ابن تیمیہ بتاتے ہیں کہ نماز کے باہر قرآن کا ترجمہ مسلمانوں کے اجماع سے اسی طرح جائز ہے جیسے اس کی تفسیر؛ اور پکتھال لکھتے ہیں کہ قرآن کا ترجمہ نہیں ہو سکتا اور ان کا کام اس کا مفہوم پیش کرنے کی کوشش ہے۔"
  fr: "Al-Zarqani distingue la traduction littérale de la traduction interprétative et tient qu'une traduction ne peut reproduire la composition et l'inimitabilité arabes du Coran et doit donc s'appeler tafsir dans une autre langue ; al-Shatibi distingue le sens premier informatif, qui peut être rendu en d'autres langues, des sens secondaires rhétoriques liés à l'usage arabe, qui ne le peuvent pas ; Ibn Taymiyya indique que traduire le Coran hors de la prière est permis par consensus des musulmans comme l'est son tafsir ; et Pickthall écrit que le Coran ne peut être traduit et que son travail est une tentative d'en présenter le sens."
  es: "Al-Zarqani distingue la traducción literal de la interpretativa y sostiene que una traducción no puede reproducir la composición y la inimitabilidad árabes del Corán y debe llamarse por tanto tafsir en otra lengua; al-Shatibi distingue el sentido primario informativo, que puede transmitirse en otras lenguas, de los sentidos secundarios retóricos ligados al uso árabe, que no pueden; Ibn Taymiyya indica que traducir el Corán fuera de la oración es lícito por consenso de los musulmanes como lo es su tafsir; y Pickthall escribe que el Corán no puede traducirse y que su obra es un intento de presentar su sentido."
  tr: "El-Zürkâni, kelime kelime çeviri ile yorumlayıcı çeviriyi ayırt eder; çevirinin Arapça Kur'an sistemini ve mucizevi doğasını taklit etmediğine inanır; bu nedenle başka bir dilde tefsir olarak adlandırılır. El-Şatibi, Arapça dışına aktarılabilen orijinal anlam ile çeviri yoluyla aktarılmayan Arapça ile ilgili ikincil anlamlar arasında ayrım yapar. İbn Teymiyye, Kur'an'ın namaz dışı çevrilmesinin Müslümanların uzlaşmasıyla izin verildiğini ve yorumlanabileceğini belirtir; Kathal'da ise Kur'an'ın çevrilemeyeceğini ve eserinin anlamını sunmaya yönelik bir çaba olduğunu yazar."
  id: "Al-Zurqani membedakan antara terjemahan harfiah dan interpretatif, percaya bahwa terjemahan tidak meniru sistem Al-Qur'an Arab dan sifat ajaibnya, sehingga disebut tafsir dalam bahasa lain. Al-Shatibi membedakan antara makna asli yang dapat disampaikan di luar bahasa Arab dan makna sekunder yang terkait dengan bahasa Arab yang tidak disampaikan melalui terjemahan. Ibn Taymiyyah menyebutkan bahwa menerjemahkan Al-Quran di luar shalat diperbolehkan oleh kesepakatan umat Muslim dan dapat ditafsirkan, dan ia menulis dalam Kathal bahwa Al-Qur'an tidak dapat diterjemahkan dan bahwa karyanya adalah upaya untuk menyampaikan maknanya."
