issue:
  ar: "لماذا يسمي العلماء ترجمة القرآن تفسيراً أو ترجمة معاني لا قرآناً؟"
  en: "Why do scholars call a translation of the Qur'an an interpretation or a translation of meanings, not the Qur'an?"
  ur: "علماء قرآن کے ترجمے کو قرآن کے بجائے تفسیر یا ترجمۂ معانی کیوں کہتے ہیں؟"
  fr: "Pourquoi les savants disent-ils d'une traduction du Coran qu'elle est une interprétation ou une traduction de sens, non le Coran ?"
  es: "¿Por qué los sabios llaman a una traducción del Corán interpretación o traducción de sentidos y no el Corán?"
perspectives:
  - tradition: sunni
    id: al-zarqani-literal-and-interpretive-translation
    stance:
      ar: "الترجمة لا تحاكي نظم القرآن وإعجازه فهي تفسير له بلغة أخرى."
      en: "A translation cannot replicate the Qur'an's naẓm and inimitability, so it is tafsir in another language."
      ur: "ترجمہ قرآن کے نظم اور اعجاز کی نقل نہیں کر سکتا اس لیے وہ دوسری زبان میں اس کی تفسیر ہے۔"
      fr: "Une traduction ne peut reproduire la composition et l'inimitabilité du Coran : elle est un tafsir dans une autre langue."
      es: "Una traducción no puede reproducir la composición y la inimitabilidad del Corán: es tafsir en otra lengua."
    summary:
      ar: "يفرّق محمد عبد العظيم الزرقاني في مناهل العرفان، الجزء الثاني، الصفحات 29 إلى 39 و120 إلى 133 و173، بين الترجمة الحرفية والترجمة التفسيرية، ويرى أن الترجمة لا تستطيع أن تحاكي نظم القرآن العربي ولا إعجازه، فيجب أن تسمى تفسيراً للقرآن بلغة أخرى لا القرآن نفسه {cite:ablibrary-manahil-irfan-zarqani-v2-p32 p.29-39} {cite:eshia-manahil-irfan-42041-2-120 p.120} {cite:quranpedia-manahil-irfan-111-2-173 p.173}."
      en: "Muhammad Abd al-Azim al-Zarqani in Manahil al-Irfan, vol. 2, pp. 29-39, 120-133 and 173, distinguishes literal word-for-word translation from interpretive translation, and argues that a translation cannot replicate the Qur'an's Arabic naẓm or its inimitability and must therefore be called tafsir of the Qur'an in another language, not the Qur'an itself {cite:ablibrary-manahil-irfan-zarqani-v2-p32 p.29-39} {cite:eshia-manahil-irfan-42041-2-120 p.120} {cite:quranpedia-manahil-irfan-111-2-173 p.173}."
      ur: "محمد عبد العظیم زرقانی مناہل العرفان جلد 2 صفحات 29 تا 39، 120 تا 133 اور 173 میں لفظی ترجمے اور تفسیری ترجمے میں فرق کرتے ہیں، اور استدلال کرتے ہیں کہ ترجمہ قرآن کے عربی نظم اور اعجاز کی نقل نہیں کر سکتا اس لیے اسے دوسری زبان میں قرآن کی تفسیر کہنا چاہیے نہ کہ خود قرآن {cite:ablibrary-manahil-irfan-zarqani-v2-p32 p.29-39} {cite:eshia-manahil-irfan-42041-2-120 p.120} {cite:quranpedia-manahil-irfan-111-2-173 p.173}۔"
      fr: "Muhammad Abd al-Azim al-Zarqani, dans Manahil al-Irfan, vol. 2, pp. 29-39, 120-133 et 173, distingue la traduction littérale mot à mot de la traduction interprétative et soutient qu'une traduction ne peut reproduire ni la composition arabe du Coran ni son inimitabilité, et doit donc s'appeler tafsir du Coran dans une autre langue, non le Coran lui-même {cite:ablibrary-manahil-irfan-zarqani-v2-p32 p.29-39} {cite:eshia-manahil-irfan-42041-2-120 p.120} {cite:quranpedia-manahil-irfan-111-2-173 p.173}."
      es: "Muhammad Abd al-Azim al-Zarqani, en Manahil al-Irfan, vol. 2, pp. 29-39, 120-133 y 173, distingue la traducción literal palabra por palabra de la interpretativa y sostiene que una traducción no puede reproducir la composición árabe del Corán ni su inimitabilidad, y debe llamarse por tanto tafsir del Corán en otra lengua, no el Corán mismo {cite:ablibrary-manahil-irfan-zarqani-v2-p32 p.29-39} {cite:eshia-manahil-irfan-42041-2-120 p.120} {cite:quranpedia-manahil-irfan-111-2-173 p.173}."
    sources: [source/ablibrary-manahil-irfan-zarqani-v2-p32, source/eshia-manahil-irfan-42041-2-120, source/quranpedia-manahil-irfan-111-2-173]
  - tradition: sunni
    id: al-shatibi-primary-and-secondary-meanings
    stance:
      ar: "المعنى الأصلي الإخباري ينتقل بغير العربية، أما المعاني الثانوية البلاغية المرتبطة بالعربية فلا تنتقل بالترجمة."
      en: "The primary informative meaning can be conveyed in other languages; the secondary rhetorical meanings bound to Arabic cannot be transferred."
      ur: "اصل خبری معنی دوسری زبانوں میں پہنچ سکتا ہے؛ عربی سے بندھے ثانوی بلاغی معانی ترجمے سے منتقل نہیں ہوتے۔"
      fr: "Le sens premier informatif peut être rendu dans d'autres langues ; les sens secondaires rhétoriques liés à l'arabe ne peuvent être transférés."
      es: "El sentido primario informativo puede transmitirse en otras lenguas; los sentidos secundarios retóricos ligados al árabe no pueden transferirse."
    holders: [person/abu-ishaq-al-shatibi]
    summary:
      ar: "يفرّق أبو إسحاق الشاطبي في الموافقات، الجزء الثاني، بين المعنى الأصلي الإخباري، وهو ما يجوز نقله بلغات أخرى للإخبار، والمعاني الثانوية، وهي ما يرتبط بالاستعمال العربي ولا يمكن أن ينقله المترجم، وينقل مناع القطان ذلك في مباحث في علوم القرآن {cite:islamweb-library-shatibi-muwafaqat-99-342 on al-Muwafaqat vol. 2} {cite:taylorfrancis-oa-chapter-10-4324-9781003247784-22 on the open-access chapter} {cite:islamweb-qattan-mabahith-maanawiyya-translation on Manna' al-Qattan}."
      en: "Abu Ishaq al-Shatibi in al-Muwafaqat, vol. 2, distinguishes the primary informative meaning, which may be conveyed in other languages for reporting, from the secondary rhetorical meanings, bound to Arabic usage, which a translation cannot transfer; Manna' al-Qattan reports the point in Mabahith fi Ulum al-Qur'an {cite:islamweb-library-shatibi-muwafaqat-99-342 on al-Muwafaqat vol. 2} {cite:taylorfrancis-oa-chapter-10-4324-9781003247784-22 on the open-access chapter} {cite:islamweb-qattan-mabahith-maanawiyya-translation on Manna' al-Qattan}."
      ur: "ابو اسحاق شاطبی الموافقات جلد 2 میں اصل خبری معنی، جو خبر دینے کے لیے دوسری زبانوں میں منتقل کیا جا سکتا ہے، اور ثانوی بلاغی معانی میں فرق کرتے ہیں جو عربی استعمال سے بندھے ہیں اور ترجمہ انہیں منتقل نہیں کر سکتا؛ مناع القطان مباحث فی علوم القرآن میں یہ بات نقل کرتے ہیں {cite:islamweb-library-shatibi-muwafaqat-99-342 on al-Muwafaqat vol. 2} {cite:taylorfrancis-oa-chapter-10-4324-9781003247784-22 on the open-access chapter} {cite:islamweb-qattan-mabahith-maanawiyya-translation on Manna' al-Qattan}۔"
      fr: "Abu Ishaq al-Shatibi, dans al-Muwafaqat, vol. 2, distingue le sens premier informatif, qui peut être rendu dans d'autres langues pour informer, des sens secondaires rhétoriques, liés à l'usage arabe, qu'une traduction ne peut transférer ; Manna' al-Qattan rapporte ce point dans Mabahith fi Ulum al-Qur'an {cite:islamweb-library-shatibi-muwafaqat-99-342 on al-Muwafaqat vol. 2} {cite:taylorfrancis-oa-chapter-10-4324-9781003247784-22 on the open-access chapter} {cite:islamweb-qattan-mabahith-maanawiyya-translation on Manna' al-Qattan}."
      es: "Abu Ishaq al-Shatibi, en al-Muwafaqat, vol. 2, distingue el sentido primario informativo, que puede transmitirse en otras lenguas para informar, de los sentidos secundarios retóricos, ligados al uso árabe, que una traducción no puede transferir; Manna' al-Qattan transmite el punto en Mabahith fi Ulum al-Qur'an {cite:islamweb-library-shatibi-muwafaqat-99-342 on al-Muwafaqat vol. 2} {cite:taylorfrancis-oa-chapter-10-4324-9781003247784-22 on the open-access chapter} {cite:islamweb-qattan-mabahith-maanawiyya-translation on Manna' al-Qattan}."
    sources: [source/islamweb-library-shatibi-muwafaqat-99-342, source/taylorfrancis-oa-chapter-10-4324-9781003247784-22, source/islamweb-qattan-mabahith-maanawiyya-translation]
  - tradition: sunni
    id: ibn-taymiyya-translation-as-explanation-outside-prayer
    stance:
      ar: "ترجمة القرآن خارج الصلاة جائزة بإجماع المسلمين كجواز تفسيره، لأنها بيان للمعنى لا بديل من النص المنزل."
      en: "Translating the Qur'an outside prayer is permissible by Muslim consensus just as its tafsir is, being an explanation of meaning and not a substitute for the revealed text."
      ur: "نماز کے باہر قرآن کا ترجمہ مسلمانوں کے اجماع سے اسی طرح جائز ہے جیسے اس کی تفسیر، کیونکہ وہ معنی کا بیان ہے نہ کہ نازل شدہ متن کا بدل۔"
      fr: "Traduire le Coran hors de la prière est permis par consensus des musulmans comme l'est son tafsir, étant une explication du sens et non un substitut du texte révélé."
      es: "Traducir el Corán fuera de la oración es lícito por consenso de los musulmanes como lo es su tafsir, por ser una explicación del sentido y no un sustituto del texto revelado."
    holders: [person/ibn-taymiyya]
    summary:
      ar: "يذكر ابن تيمية في الجواب الصحيح لمن بدّل دين المسيح، الجزء الثاني، الصفحات 52 إلى 68 وخصوصاً الصفحة 67، أن ترجمة القرآن خارج الصلاة جائزة بإجماع المسلمين على الوجه الذي يجوز به تفسيره، فهي شرح للمعنى لا بديل من النص العربي المنزل {cite:salafcenter-2901 on article 2901} {cite:mtafsir-ibn-taymiyya-answers-to-christians-35981 on the forum thread}."
      en: "Ibn Taymiyya in al-Jawab al-Sahih li-man Baddala Din al-Masih, vol. 2, pp. 52-68, specifically p. 67, states that translating the Qur'an outside prayer is permissible by Muslim consensus in the exact manner that its tafsir is permissible, treating translation as an explanation of meaning rather than a substitute for the revealed Arabic text {cite:salafcenter-2901 on article 2901} {cite:mtafsir-ibn-taymiyya-answers-to-christians-35981 on the forum thread}."
      ur: "ابن تیمیہ الجواب الصحیح لمن بدل دین المسیح جلد 2 صفحات 52 تا 68، خصوصاً صفحہ 67، میں بتاتے ہیں کہ نماز کے باہر قرآن کا ترجمہ مسلمانوں کے اجماع سے اسی طرح جائز ہے جیسے اس کی تفسیر جائز ہے، یعنی ترجمہ معنی کی شرح ہے نہ کہ نازل شدہ عربی متن کا بدل {cite:salafcenter-2901 on article 2901} {cite:mtafsir-ibn-taymiyya-answers-to-christians-35981 on the forum thread}۔"
      fr: "Ibn Taymiyya, dans al-Jawab al-Sahih li-man Baddala Din al-Masih, vol. 2, pp. 52-68, notamment p. 67, indique que traduire le Coran hors de la prière est permis par consensus des musulmans de la même manière que l'est son tafsir, traitant la traduction comme une explication du sens plutôt que comme un substitut du texte arabe révélé {cite:salafcenter-2901 on article 2901} {cite:mtafsir-ibn-taymiyya-answers-to-christians-35981 on the forum thread}."
      es: "Ibn Taymiyya, en al-Jawab al-Sahih li-man Baddala Din al-Masih, vol. 2, pp. 52-68, en particular p. 67, indica que traducir el Corán fuera de la oración es lícito por consenso de los musulmanes del mismo modo que lo es su tafsir, tratando la traducción como una explicación del sentido y no como sustituto del texto árabe revelado {cite:salafcenter-2901 on article 2901} {cite:mtafsir-ibn-taymiyya-answers-to-christians-35981 on the forum thread}."
