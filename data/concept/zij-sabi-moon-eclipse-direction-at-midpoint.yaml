class: concept
kind: scientific
label: { ar: "جهة الظلمة في وسط كسوف القمر", en: "The direction of the darkness at the middle of a lunar eclipse", ur: "چاند گرہن کے وسط میں سیاہی کی سمت", es: "La dirección de la oscuridad en el punto medio de un eclipse lunar.", fr: "La direction de l'obscurité au centre d'une éclipse lunaire" }
summary:
  ar: "يقع انحراف الظلمة في وسط الكسوف على زاوية قائمة على فلك البروج، وذلك حيث تحدّه القوس التي تجوز على قطبي فلك البروج وعلى موضع القمر ودائرة الأفق. وتُعرف زاوية الطول المعلومة لزمن وسط الكسوف، ثم تُخرج من حد سمت طالع وسط الكسوف أو غاربه إلى خلاف جهة عرض القمر بحسب موضع القمر في الشمال أو الجنوب. {cite:zij-sabi-nallino-byblion pp.156-157}"
  en: "At the middle of the eclipse the direction of the darkness falls on a right angle to the ecliptic, where the arc through the poles of the ecliptic and the Moon's place meets the horizon. The known longitude angle for the time of mid-eclipse is found and drawn from the rising or setting point of that moment on the side opposite the Moon's latitude, depending on whether the Moon is north or south. {cite:zij-sabi-nallino-byblion pp.156-157}"
  ur: "وسط گرہن میں سیاہی کی سمت دائرۂ البروج پر قائمہ زاویہ پر پڑتی ہے، یعنی وہاں جہاں وہ قوس جو دائرۂ البروج کے قطبوں اور چاند کے مقام سے گزرتی ہے افق سے ملتی ہے۔ وسط گرہن کے وقت کا معلوم طول کا زاویہ لے کر وسط کے طالع یا غارب کے سمت سے چاند کے عرض کے مخالف جانب کھینچا جاتا ہے، چاند کے شمال یا جنوب ہونے کے لحاظ سے۔ {cite:zij-sabi-nallino-byblion pp.156-157}"
  es: "En el punto medio del eclipse, la dirección de la oscuridad incide en ángulo recto con la eclíptica, donde el arco que pasa por los polos de la eclíptica y la posición de la Luna se encuentra con el horizonte. El ángulo de longitud conocido para el momento del punto medio del eclipse se determina y traza a partir del punto de salida o puesta del Sol en ese instante, en el lado opuesto a la latitud de la Luna, según si esta se encuentra al norte o al sur. {cite:zij-sabi-nallino-byblion pp.156-157}"
  fr: "Au milieu de l'éclipse, la direction de l'obscurité est perpendiculaire à l'écliptique, là où l'arc passant par les pôles de l'écliptique et la position de la Lune rencontre l'horizon. L'angle de longitude connu pour le moment du milieu de l'éclipse est déterminé à partir du point de lever ou de coucher de l'écliptique à cet instant précis, du côté opposé à la latitude lunaire, selon que la Lune se trouve au nord ou au sud. {cite:zij-sabi-nallino-byblion pp.156-157}"
