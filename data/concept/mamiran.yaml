summary:
  ar: "ماميران خشب كعقد مائلة إلى السواد أحد من عروق الصباغين، حار يابس في آخر الثانية، جال منق، يجلو بياض الأظفار والعين وينقي الرأس ويفيد في وجع الأسنان واليرقان والمغص {cite:canon-ibn-sina-print-v1 p.570}."
  en: "Mamiran is a wood like knots leaning to black, sharper than the dyers' roots, hot and dry at the end of the second degree, cleansing and purifying; the book uses it for whiteness of the nails and of the eye, to purify the head, and for toothache, jaundice and colic {cite:canon-ibn-sina-print-v1 p.570}."
  ur: "مامیران گرہوں جیسی لکڑی ہے جو سیاہی کی طرف مائل اور رنگریزوں کی جڑوں سے تیز ہے، دوسرے درجے کے آخر میں گرم خشک، جلا دینے والی اور صاف کرنے والی؛ کتاب اسے ناخنوں اور آنکھ کی سفیدی، سر کی صفائی، دانت کے درد، یرقان اور مروڑ کے لیے استعمال کرتی ہے {cite:canon-ibn-sina-print-v1 p.570}۔"
  es: "Mamiran es una madera parecida a nudos que tienden al negro, más afilada que las raíces de los tintoreros, caliente y seca al final del segundo grado, limpiadora y purificadora; el libro la usa para blanquear las uñas y los ojos, para purificar la cabeza y para el dolor de muelas, la ictericia y los cólicos {cite:canon-ibn-sina-print-v1 p.570}."
  fr: "Le Mamiran est un bois aux nœuds noirs, plus pointu que les racines des teinturiers, chaud et sec à la fin du deuxième degré, nettoyant et purifiant; le livre l'utilise pour blanchir les ongles et les yeux, pour purifier la tête, et pour les maux de dents, la jaunisse et les coliques {cite:canon-ibn-sina-print-v1 p.570}."
