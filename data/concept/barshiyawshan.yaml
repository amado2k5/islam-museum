label:
  ar: "برشياوشان"
  en: "Barshiyawshan (a fine water herb)"
  fr: "Barshiyawshan (fine herbe aquatique)"
  ur: "برشیاوشان"
  es: "Barshiyawshan (una fina hierba acuática)"
summary:
  ar: "حشيشة دقيقة تنبت في حياض المياه والشطوط والأنهار، محلّلة ملطّفة مفتّحة، وقابضة تمنع السيلان، ينفع رمادها من الدبيلات والقروح الخبيثة، وينقّي الرئة، ويفتّت الحصاة، ومع الشراب ينفع من نهش الحيّات والكلاب {cite:canon-ibn-sina-print-v1 p.403}."
  en: "A fine herb of pools, banks and rivers. It dissolves, thins and opens, is astringent and stops flowing. Its ash helps cold abscesses and malignant ulcers, it cleanses the lung, breaks stones, and with wine helps snake and dog bites {cite:canon-ibn-sina-print-v1 p.403}."
  fr: "Fine herbe des mares, berges et rivières. Elle résout, fluidifie et ouvre, elle est astringente et arrête les écoulements. Selon le livre, sa cendre aiderait contre les abcès froids et les ulcères malins ; elle nettoierait le poumon, briserait les calculs et, avec du vin, aiderait contre les morsures de serpents et de chiens {cite:canon-ibn-sina-print-v1 p.403}."
  ur: "ایک باریک جڑی بوٹی جو تالابوں، کناروں اور دریاؤں میں اگتی ہے۔ یہ تحلیل کرتی، پتلا کرتی اور کھولتی ہے، قابض ہے اور رطوبت کا بہاؤ روکتی ہے۔ اس کی راکھ ٹھنڈے پھوڑوں اور خبیث زخموں میں کام آتی ہے، پھیپھڑوں کو صاف کرتی ہے، پتھری توڑتی ہے، اور شراب کے ساتھ سانپ اور کتے کے کاٹے میں مفید ہے {cite:canon-ibn-sina-print-v1 p.403}۔"
  es: "Una excelente hierba de estanques, riberas y ríos. Disuelve, diluye y abre, es astringente y detiene el flujo. Su ceniza ayuda a tratar abscesos fríos y úlceras malignas, limpia los pulmones, disuelve cálculos y, con vino, ayuda a aliviar las picaduras de serpientes y perros {cite:canon-ibn-sina-print-v1 p.403}."
