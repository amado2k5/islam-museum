class: concept
kind: art_form
label: { ar: "الخزف الأسود على الأبيض", en: "Black on white ware (Khurasan and Transoxiana)", ur: "سفید پر سیاہ ظروف" }
summary:
  ar: "خزف مزخرف بالأسود وحده على بطانة بيضاء تحت طلاء رصاصي شفاف، عُرف أولًا من أفراسياب وصنع في نيسابور، واستعمل في مدن المشرق الإسلامي من القرن التاسع إلى الحادي عشر، وتغلب على زخرفته الكتابة العربية {cite:wilkinson-nishapur-pottery p. 132} {cite:wilkinson-nishapur-pottery p. 133}."
  en: "Ware decorated in black alone on a white engobe under a clear lead glaze, first known from Afrasiyab and also made at Nishapur, used in the cities of the eastern Islamic lands from the ninth to the eleventh century {cite:wilkinson-nishapur-pottery p. 132} {cite:wilkinson-nishapur-pottery p. 133}."
  ur: "سفید انگوب پر صرف سیاہ رنگ سے مزین ظروف، شفاف سیسے کے لعاب کے نیچے؛ پہلے افراسیاب سے معلوم ہوئے اور نیشاپور میں بھی بنے؛ نویں سے گیارہویں صدی تک مشرقی اسلامی شہروں میں رائج {cite:wilkinson-nishapur-pottery p. 132}."
