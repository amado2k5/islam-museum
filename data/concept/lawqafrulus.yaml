summary:
  ar: "لوقفرولس حجر مصري رخو يستعمله القصارون في تبييض الثياب، قابض مجفف بلا لذع، ينفع القروح والإسهال المزمن ونفث الدم {cite:canon-ibn-sina-print-v1 p.543}."
  en: "Lawqafrulus is an Egyptian stone, soft, used by launderers to whiten clothes; astringent and drying without stinging, it is listed for ulcers, chronic diarrhoea and spitting of blood {cite:canon-ibn-sina-print-v1 p.543}."
  ur: "لوقفرولس مصری پتھر ہے، نرم، دھوبی اس سے کپڑے سفید کرتے ہیں؛ بغیر جلن کے قابض اور خشک کرنے والا، زخموں، پرانے اسہال اور خون تھوکنے میں مذکور ہے {cite:canon-ibn-sina-print-v1 p.543}۔"
  es: "Lawqafrulus es una piedra egipcia, suave, utilizada por los lavanderos para blanquear la ropa; astringente y secante sin causar escozor, se menciona para úlceras, diarrea crónica y expectoración de sangre {cite:canon-ibn-sina-print-v1 p.543}."
  fr: "Lawqafrulus est une pierre égyptienne, douce, utilisée par les blanchisseurs pour blanchir les vêtements; astringente et asséchante sans piquer, elle est répertoriée pour les ulcères, la diarrhée chronique et les crachats de sang {cite:canon-ibn-sina-print-v1 p.543}."
  tr: "Luqrols, kasaplar tarafından kıyafetleri beyazlatmak için kullanılan yumuşak bir Mısır taşıdır; kuru, yakıcı olmayan bir büzücü maddedir; ülser, kronik ishal ve kan pıhtılaşması için faydalı {cite:canon-ibn-sina-print-v1 s.543}."
  id: "Luqrols adalah batu Mesir yang lembut yang digunakan oleh tukang daging untuk memutihkan pakaian, astringen kering yang tidak menyengat, bermanfaat untuk tukak lambung, diare kronis, dan pembekuan darah {cite:canon-ibn-sina-print-v1 hlm.543}."
