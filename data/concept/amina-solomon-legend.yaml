  en: "Amina, a legendary wife of Solomon, to whom he entrusted the ring on which his dominion and wisdom depended. She gave it to a demon who had taken Solomon's form, and the ring returned to the king only after a long time {cite:encyclopaedia-of-islam-2 vol. 1 p. 460}."
