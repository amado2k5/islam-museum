label:
  ar: "أمينة زوجة سليمان ⁦(أسطورة)⁩"
  en: "Amina, the legendary wife of Solomon"
  fr: "Amina, épouse légendaire de Salomon"
  es: "Amina, la legendaria esposa de Salomón"
summary:
  ar: "أمينة، زوجة أسطورية لسليمان، أودعها الخاتم الذي كان فيه ملكه وحكمته، فسلّمته لشيطان تشبّه بسليمان، ولم يعد الخاتم إلى الملك إلا بعد زمن {cite:encyclopaedia-of-islam-2 vol. 1 p. 460}."
  en: "Amina, a legendary wife of Solomon, to whom he entrusted the ring on which his dominion and wisdom depended. She gave it to a demon who had taken Solomon's form, and the ring returned to the king only after a long time {cite:encyclopaedia-of-islam-2 vol. 1 p. 460}."
  fr: "Amina est une épouse légendaire de Salomon, qui lui confia l’anneau dont dépendaient son pouvoir et sa sagesse. Elle le remit à un démon qui avait pris l’apparence de Salomon. L’anneau ne revint au roi qu’après un long moment {cite:encyclopaedia-of-islam-2 vol. 1 p. 460}."
  es: "Amina, una esposa legendaria de Salomón, a quien él confió el anillo del que dependían su dominio y sabiduría. Ella se lo entregó a un demonio que había tomado la forma de Salomón, y el anillo regresó al rey solo después de mucho tiempo {cite:encyclopaedia-of-islam-2 vol. 1 p. 460}."
