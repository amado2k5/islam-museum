label:
  ar: "الصَّرُورة"
  en: "Sarura (one who has not yet performed the pilgrimage for himself: his proxy pilgrimage, and the payment for it)"
summary:
  ar: "الصرورة في الاصطلاح الفقهي من لم يحج عن نفسه حجة الإسلام، وهو أعم من معناه اللغوي عند ابن عابدين، وعند بعض المالكية من لم يحج قط. وكره الشافعي وابن عقيل تسميته بذلك، وحديث «لا صرورة في الإسلام» ضعيف الإسناد. والحج يقبل النيابة في الجملة، فيشترط الشافعية والحنابلة في النائب عن غيره في حجة الإسلام أن يكون قد حج عن نفسه، فإن أحرم عن غيره وقع عن نفسه، ويرد ما أخذ من النفقة؛ وأجاز الحنفية حج الصرورة مع الكراهة، ومنعه المالكية في الفرض لمستطيع صحيح. ولا يجوز عند الحنفية والمشهور عند الحنابلة أخذ أجرة على الحج عن الغير، وأجازه المالكية مع الكراهة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10367} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10368} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10369}"
  en: "In the jurists' usage a sarura is one who has not performed the pilgrimage of Islam for himself; Ibn 'Abidin takes the word more widely to include one who has made a proxy pilgrimage or a voluntary or vowed one, while some Malikis mean one who has never made the pilgrimage at all. al-Shafi'i and Ibn 'Aqil disliked the name, and the report 'there is no sarura in Islam' is weak in its chain. Pilgrimage can be done by proxy in general. The Shafi'is and Hanbalis require the proxy in the obligatory pilgrimage to have performed his own first; if a sarura does it, the pilgrimage falls for himself and he must return the expenses. The Hanafis allow it with disapproval, and the Malikis forbid a healthy capable person to make a proxy pilgrimage for an obligation. Hire for a proxy pilgrimage is forbidden by the Hanafis and by the common view of the Hanbalis, and allowed with disapproval by the Malikis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10367} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10368} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10369}"
