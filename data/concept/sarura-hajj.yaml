id: concept/sarura-hajj
class: concept
kind: legal
label:
  ar: "الصَّرُورة"
  en: "Sarura (one who has not yet performed the pilgrimage for himself: his proxy pilgrimage, and the payment for it)"
  es: "Sarura (aquel que aún no ha realizado la peregrinación por sí mismo: su peregrinación por poder y el pago correspondiente)."
  fr: "Sarura (celui qui n'a pas encore accompli le pèlerinage pour lui-même: son pèlerinage par procuration et le paiement correspondant)"
summary:
  ar: "الصرورة في الاصطلاح الفقهي من لم يحج عن نفسه حجة الإسلام، وهو أعم من معناه اللغوي عند ابن عابدين، وعند بعض المالكية من لم يحج قط. وكره الشافعي وابن عقيل تسميته بذلك، وحديث «لا صرورة في الإسلام» ضعيف الإسناد. والحج يقبل النيابة في الجملة، فيشترط الشافعية والحنابلة في النائب عن غيره في حجة الإسلام أن يكون قد حج عن نفسه، فإن أحرم عن غيره وقع عن نفسه، ويرد ما أخذ من النفقة؛ وأجاز الحنفية حج الصرورة مع الكراهة، ومنعه المالكية في الفرض لمستطيع صحيح. ولا يجوز عند الحنفية والمشهور عند الحنابلة أخذ أجرة على الحج عن الغير، وأجازه المالكية مع الكراهة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10367} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10368} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10369}"
  en: "In the jurists' usage a sarura is one who has not performed the pilgrimage of Islam for himself; Ibn 'Abidin takes the word more widely to include one who has made a proxy pilgrimage or a voluntary or vowed one, while some Malikis mean one who has never made the pilgrimage at all. al-Shafi'i and Ibn 'Aqil disliked the name, and the report 'there is no sarura in Islam' is weak in its chain. Pilgrimage can be done by proxy in general. The Shafi'is and Hanbalis require the proxy in the obligatory pilgrimage to have performed his own first; if a sarura does it, the pilgrimage falls for himself and he must return the expenses. The Hanafis allow it with disapproval, and the Malikis forbid a healthy capable person to make a proxy pilgrimage for an obligation. Hire for a proxy pilgrimage is forbidden by the Hanafis and by the common view of the Hanbalis, and allowed with disapproval by the Malikis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10367} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10368} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10369}"
  es: "En el uso de los juristas, un sarura es aquel que no ha realizado la peregrinación del Islam por sí mismo; Ibn 'Abidin utiliza el término de forma más amplia para incluir a quien ha realizado una peregrinación por poder, voluntaria o por voto, mientras que algunos malikíes se refieren a quien nunca ha realizado la peregrinación. Al-Shafi'i e Ibn 'Aqil desaprobaban este término, y el relato de que \"no hay sarura en el Islam\" tiene una cadena de transmisión débil. La peregrinación puede realizarse por poder en general. Los shafi'íes y los hanbalíes exigen que el sustituto en la peregrinación obligatoria haya realizado primero la suya propia; si un sarura la realiza, la peregrinación recae sobre él y debe devolver los gastos. Los hanafíes lo permiten con desaprobación, y los malikíes prohíben que una persona sana y capaz realice una peregrinación por poder para cumplir una obligación. El pago por una peregrinación por poder está prohibido por los hanafíes y por la opinión común de los hanbalíes, y los malikíes lo permiten con desaprobación. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10367} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10368} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10369}"
  fr: "Dans l'usage juriste, un sarura désigne celui qui n'a pas accompli le pèlerinage islamique pour lui-même. Ibn 'Abidin a une acception plus large du terme, incluant celui qui a effectué un pèlerinage par procuration, un pèlerinage volontaire ou un pèlerinage par vœu, tandis que certains malikites l'entendent par là celui qui n'a jamais accompli le pèlerinage. Al-Shafi'i et Ibn 'Aqil désapprouvaient cette appellation, et le hadith « il n'y a pas de sarura en Islam » est faible dans sa chaîne de transmission. Le pèlerinage peut généralement être effectué par procuration. Les écoles chaféite et hanbalite exigent que le mandataire pour le pèlerinage obligatoire ait accompli le sien au préalable; si un sarura le fait, le pèlerinage lui est imputé et il doit rembourser les frais. Les hanafites l'autorisent avec désapprobation, et les malikites interdisent à une personne saine et capable d'effectuer un pèlerinage par procuration pour une obligation. Le recours à un opérateur pour un pèlerinage par procuration est interdit par les hanafites et selon l'avis majoritaire des hanbalites, et autorisé avec désapprobation par les malikites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10367} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10368} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10369}"
