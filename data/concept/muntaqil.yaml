label: { ar: "المُنْتَقِل ⁦(من دين كافر إلى دين كافر)⁩", en: "The convert from one unbelieving faith to another (muntaqil)", ur: "منتقل ⁦(ایک کفر سے دوسرے کفر میں جانے والا)⁩", es: "El converso de una fe incrédula a otra (muntaqil)", fr: "Le converti d'une foi incrédule à une autre (muntaqil)" }
summary:
  ar: "المنتقل كافر تحول من دين إلى دين، وهو يختلف عن المرتد الذي خرج من الحق إلى الباطل. وفي الدين الذي يقر عليه اختلف الفقهاء، فالحنفية والمالكية يقبلون منه الجزية، والشافعية والحنابلة في رواية يلزمونه الإسلام أو العودة. ويتصل بالموضوع نكاح المسلم له، وذبيحته، وعقوبته، وإرثه."
  en: "The muntaqil is an unbeliever who has passed from one religion to another; he differs from the apostate, who left the truth for falsehood. The jurists differ on the faith he may keep. The Hanafis and Malikis accept the poll tax from him and leave him as a protected person; the Shafi'is and a Hanbali report require him to embrace Islam or return. The entry also covers marriage with him, the lawfulness of his slaughter, his punishment, and inheritance."
  ur: "منتقل وہ کافر ہے جو ایک دین سے دوسرے دین کی طرف منتقل ہو جائے، اور وہ مرتد سے مختلف ہے۔ حنفیہ اور مالکیہ اس سے جزیہ قبول کرتے ہیں، جبکہ شافعیہ اور حنابلہ کی ایک روایت کے مطابق اسلام یا پہلے دین کی طرف لوٹنا لازم ہے۔"
  es: "El muntaqil es un incrédulo que ha cambiado de religión; se diferencia del apóstata, que abandonó la verdad por la falsedad. Los juristas discrepan sobre la fe que puede conservar. Los hanafíes y los malikíes aceptan el impuesto de capitación que le impone y lo consideran una persona protegida; los shafiíes y un informe hanbalí le exigen que abrace el islam o regrese. La entrada también abarca el matrimonio con él, la licitud de su sacrificio, su castigo y la herencia."
  fr: "Le muntaqil est un incroyant qui a changé de religion; il se distingue de l’apostat, qui a abandonné la vérité pour le mensonge. Les juristes divergent quant à la religion qu’il peut pratiquer. Les hanafites et les malikites acceptent de payer la capitation à son nom et le considèrent comme une personne protégée; les chaféites et un hadith hanbalite exigent qu’il se convertisse à l’islam ou qu’il revienne à sa religion d’origine. Le texte aborde également le mariage avec lui, la licéité de son sacrifice, son châtiment et son héritage."
