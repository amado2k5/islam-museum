label: { ar: "المُنْتَقِل (من دين كافر إلى دين كافر)", en: "The convert from one unbelieving faith to another (muntaqil)", ur: "منتقل (ایک کفر سے دوسرے کفر میں جانے والا)" }
summary:
  ar: "المنتقل كافر تحول من دين إلى دين، وهو يختلف عن المرتد الذي خرج من الحق إلى الباطل. وفي الدين الذي يقر عليه اختلف الفقهاء، فالحنفية والمالكية يقبلون منه الجزية، والشافعية والحنابلة في رواية يلزمونه الإسلام أو العودة. ويتصل بالموضوع نكاح المسلم له، وذبيحته، وعقوبته، وإرثه."
  en: "The muntaqil is an unbeliever who has passed from one religion to another; he differs from the apostate, who left the truth for falsehood. The jurists differ on the faith he may keep. The Hanafis and Malikis accept the poll tax from him and leave him as a protected person; the Shafi'is and a Hanbali report require him to embrace Islam or return. The entry also covers marriage with him, the lawfulness of his slaughter, his punishment, and inheritance."
  ur: "منتقل وہ کافر ہے جو ایک دین سے دوسرے دین کی طرف منتقل ہو جائے، اور وہ مرتد سے مختلف ہے۔ حنفیہ اور مالکیہ اس سے جزیہ قبول کرتے ہیں، جبکہ شافعیہ اور حنابلہ کی ایک روایت کے مطابق اسلام یا پہلے دین کی طرف لوٹنا لازم ہے۔"
