label:
  ar: الفتح صلحاً
  en: Conquest by treaty (sulh)
summary:
  ar: "الفتح صلحاً عند البلاذري أخذ البلد باتفاق ومسالمة دون قتال: مثاله الأول عنده فدك — بعث النبي محيصة بن مسعود الأنصاري منصرفه من خيبر يدعوهم إلى الإسلام «فصالحوا رسول الله على نصف الأرض بتربتها فقبل ذلك منهم»، فبقي أهلها فيها حياة النبي وأبي بكر حتى أجلاهم عمر؛ ويقابل الصلحُ العنوةَ: الصالحون يبقون على أرضهم بشروط المصالحة وتبقى أموالهم لهم إلا ما شُرط، والمصالَحة على نصف الأرض جعلت نصف فدك فيئاً خالصاً للنبي «لأنه لم يوجف المسلمون عليه بخيل ولا ركاب»."
  en: "Fath sulhan in al-Baladhuri is taking a town by negotiated capitulation without combat: his first example is Fadak — on his return from Khaybar the Prophet sent Muhayyisa ibn Masud al-Ansari calling its people to Islam, 'and they made peace with the Prophet on half the land with its soil, and he accepted that from them', so its people remained in it through the Prophet's life and Abu Bakr's until Umar exiled them; sulh contrasts with 'anwa — treaty peoples keep their lands and property on the treaty's terms except what was stipulated, and the half-land treaty made half of Fadak pure fay' for the Prophet 'because the Muslims had not charged upon it with horse or camel'."
