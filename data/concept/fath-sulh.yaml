id: concept/fath-sulh
class: concept
kind: legal
tags: [akhlaq-browser, akhlaq-sulh]
label:
  ar: الفتح صلحاً
  en: Conquest by treaty (sulh)
  es: "Conquista por tratado (sulh)"
  fr: "Conquête par traité (sulh)"
  ur: "معاہدہ کے ذریعے فتح ⁦(سل)⁩"
  tr: "Barış içinde fetih"
  id: "Penaklukan dalam damai"
summary:
  ar: "الفتح صلحاً عند البلاذري أخذ البلد باتفاق ومسالمة دون قتال: مثاله الأول عنده فدك — بعث النبي محيصة بن مسعود الأنصاري منصرفه من خيبر يدعوهم إلى الإسلام «فصالحوا رسول الله على نصف الأرض بتربتها فقبل ذلك منهم»، فبقي أهلها فيها حياة النبي وأبي بكر حتى أجلاهم عمر؛ ويقابل الصلحُ العنوةَ: الصالحون يبقون على أرضهم بشروط المصالحة وتبقى أموالهم لهم إلا ما شُرط، والمصالَحة على نصف الأرض جعلت نصف فدك فيئاً خالصاً للنبي «لأنه لم يوجف المسلمون عليه بخيل ولا ركاب»."
  en: "Fath sulhan in al-Baladhuri is taking a town by negotiated capitulation without combat: his first example is Fadak — on his return from Khaybar the Prophet sent Muhayyisa ibn Masud al-Ansari calling its people to Islam, 'and they made peace with the Prophet on half the land with its soil, and he accepted that from them', so its people remained in it through the Prophet's life and Abu Bakr's until Umar exiled them; sulh contrasts with 'anwa — treaty peoples keep their lands and property on the treaty's terms except what was stipulated, and the half-land treaty made half of Fadak pure fay' for the Prophet 'because the Muslims had not charged upon it with horse or camel'."
  es: "Fath sulhan en al-Baladhuri es tomar una ciudad por capitulación negociada sin combate: su primer ejemplo es Fadak: a su regreso de Khaybar, el Profeta envió a Muhayyisa ibn Masud al-Ansari llamando a su gente al Islam, 'y ellos hicieron la paz con el Profeta sobre la mitad de la tierra con su suelo, y él lo aceptó de ellos', por lo que su gente permaneció allí durante la vida del Profeta y la de Abu Bakr hasta que Umar los exilió; sulh contrasta con 'anwa: los pueblos con tratados conservan sus tierras y propiedades según los términos del tratado excepto lo que fue estipulado, y el tratado de la mitad de la tierra hizo que la mitad de Fadak fuera pura fay' para el Profeta 'porque los musulmanes no habían cargado sobre ella con caballos o camellos'."
  fr: "Le terme « fath sulhan » dans al-Baladhuri désigne la prise d'une ville par capitulation négociée, sans combat: son premier exemple est Fadak. À son retour de Khaybar, le Prophète envoya Muhayyisa ibn Masud al-Ansari appeler ses habitants à l'islam. « Ils firent la paix avec le Prophète sur la moitié du territoire, et il accepta cette proposition. » Ainsi, les habitants restèrent sur place durant la vie du Prophète et d'Abu Bakr, jusqu'à leur exil par Umar. Le terme « sulhan » s'oppose à « 'anwa », où les peuples liés par un traité conservent leurs terres et leurs biens selon les termes du traité, sauf stipulation contraire. Le traité portant sur la moitié du territoire rendait la moitié de Fadak « pure fay » pour le Prophète, « car les musulmans ne l'avaient pas envahie à cheval ou à chameau »."
  ur: "البلاذری میں فتح سلحان بغیر کسی جنگ کے مذاکرات کے ذریعے ایک بستی پر قبضہ کر رہا ہے: اس کی پہلی مثال فدک ہے - خیبر سے واپسی پر نبی نے محیصہ بن مسعود الانصاری کو بھیجا کہ اس کے لوگوں کو اسلام کی دعوت دے، اور انہوں نے نبی سے آدھی زمین پر اس کی مٹی کے ساتھ صلح کر لی، اور ابو بکر کی زندگی میں یہ بات قبول کر لی اور ابو بکر کی زندگی میں ان سے صلح کر لی۔ عمر نے انہیں جلاوطن کر دیا۔ سلح 'انوا' سے متصادم ہے - معاہدے کے لوگ اپنی زمینیں اور جائیدادیں معاہدے کی شرائط پر رکھتے ہیں سوائے اس کے جو کہ مقرر کی گئی تھی، اور آدھی اراضی کے معاہدے نے فدک خالص فی کا آدھا حصہ نبی کے لیے 'کیونکہ مسلمانوں نے اس پر گھوڑے یا اونٹ کا الزام نہیں لگایا تھا'۔"
  tr: "Fetih, el-Baladhuri için bir barış antlaşmasıdır; o toprakları savaşmadan ve barış yoluyla ele geçirdi: ilk örnek Fadak'tır — Peygamber Muhase bin Mesud el-Ensari, onları İslam'a davet etmek için Haybar'dan bir heyet gönderdi, \"böylece Allah'ın Elçisi ile toprakların ve toprağın yarısı üzerinde barış yaptılar ve o da bunu kabul etti.\" Böylece, halkı Peygamber ve Ebu Bekir yaşamı boyunca orada kaldı, ta ki Ömer onları kovana kadar. Barışın zıttı baskıdır: doğrular uzlaşma koşullarında topraklarında kalır ve servetleri ancak şart koşuluyla kendilerine aittir. Toprağın yarısından fazla uzlaşma, Fadak'ın yarısını Peygamber'e saf bir armağan haline getirdi \"çünkü Müslümanlar ona cimrilik ya da at binerek karşı çıkmadılar.\""
  id: "Penaklukan tersebut adalah perjanjian damai bagi al-Baladhuri, yang mengambil tanah tersebut melalui perjanjian dan perdamaian tanpa pertempuran: contoh pertama adalah Fadak — Nabi Muhaysa ibn Mas'ud al-Ansari mengirim utusan dari Khaybar mengundang mereka ke Islam, \"sehingga mereka berdamai dengan Rasul Allah atas setengah tanah dan tanahnya, dan Dia menerima itu dari mereka.\" Dengan demikian, rakyatnya tetap di sana selama masa hidup Nabi dan Abu Bakr hingga Umar mengusir mereka. Kebalikan dari perdamaian adalah penindasan: orang benar tetap berada di tanah mereka dengan syarat rekonsiliasi, dan kekayaan mereka tetap milik mereka kecuali sesuai ketentuan. Rekonsiliasi atas setengah tanah menjadikan setengah Fadak sebagai hadiah murni kepada Nabi \"karena umat Muslim tidak melawannya dengan kekikikan atau menunggang kuda.\""
