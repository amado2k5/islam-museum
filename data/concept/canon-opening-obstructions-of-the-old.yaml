label: { ar: "تفتيح سدد المشايخ عند ابن سينا", en: "Opening the obstructions of the old in the Canon", ur: "بزرگوں کی رکاوٹیں کھولنا قانون میں" }
summary:
  ar: "يصف ابن سينا في الفصل الرابع علاج السدد التي تعرض للمشايخ، وأسهلها ما كان من شرب الشراب، بالفودنجي والفلافلي ونثر الفلفل على الشراب، وبالثوم والبصل لمن اعتادهما، وبالترياق، ثم يرطبون بالحمام والتمريخ والأغذية، ويقدم شراب العسل وقاية من السدد ووجع المفاصل، ويخص بزر الكرفس لأعضاء البول وما هو أقوى للحصوية وأدوية للرئة {cite:canon-ibn-sina-print-v1 p.253}."
  en: "In the fourth chapter Ibn Sina describes treating the obstructions that come upon the old, the easiest being those from drinking wine, with pennyroyal and long pepper and pepper scattered on the wine, with garlic and onion for those used to them, and with theriac; they are then moistened by the bath, anointing and foods; honey drink is a safeguard against obstructions and joint pain, celery seed is added for the urinary organs, something stronger for stony obstruction, and remedies for the lung {cite:canon-ibn-sina-print-v1 p.253}."
