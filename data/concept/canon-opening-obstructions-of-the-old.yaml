id: concept/canon-opening-obstructions-of-the-old
class: concept
kind: scientific
label:
  ar: "تفتيح سدد المشايخ عند ابن سينا"
  en: "Opening the obstructions of the old in the Canon"
  fr: "Lever les obstructions des vieillards dans le Canon"
  ur: "بزرگوں کی رکاوٹیں کھولنا قانون میں"
  es: "Abriendo las obstrucciones de lo antiguo en el Canon"
summary:
  ar: "يصف ابن سينا في الفصل الرابع علاج السدد التي تعرض للمشايخ، وأسهلها ما كان من شرب الشراب، بالفودنجي والفلافلي ونثر الفلفل على الشراب، وبالثوم والبصل لمن اعتادهما، وبالترياق، ثم يرطبون بالحمام والتمريخ والأغذية، ويقدم شراب العسل وقاية من السدد ووجع المفاصل، ويخص بزر الكرفس لأعضاء البول وما هو أقوى للحصوية وأدوية للرئة {cite:canon-ibn-sina-print-v1 p.253}."
  en: "In the fourth chapter Ibn Sina describes treating the obstructions that come upon the old, the easiest being those from drinking wine, with pennyroyal and long pepper and pepper scattered on the wine, with garlic and onion for those used to them, and with theriac; they are then moistened by the bath, anointing and foods; honey drink is a safeguard against obstructions and joint pain, celery seed is added for the urinary organs, something stronger for stony obstruction, and remedies for the lung {cite:canon-ibn-sina-print-v1 p.253}."
  fr: "Au chapitre 4, Ibn Sina décrit pouliot, poivre long et poivre sur vin pour les obstructions, celles du vin étant les plus faciles ; ail et oignon si habituels, thériaque puis humidification par bain, huile et aliments. Boisson miellée protégerait obstructions et douleurs articulaires, avec céleri pour voies urinaires, plus fort pour calculs, remèdes propres pour poumon {cite:canon-ibn-sina-print-v1 p.253}."
  es: "En el cuarto capítulo, Ibn Sina describe el tratamiento de las obstrucciones que se presentan en los ancianos, siendo las más fáciles las causadas por el consumo de vino, con poleo y pimienta larga y pimienta esparcida sobre el vino, con ajo y cebolla para quienes están acostumbrados a ellos, y con teriaca; luego se humedecen con el baño, la unción y los alimentos; la bebida de miel es una protección contra las obstrucciones y el dolor articular, se agrega semilla de apio para los órganos urinarios, algo más fuerte para la obstrucción por cálculos y remedios para el pulmón {cite:canon-ibn-sina-print-v1 p.253}."
