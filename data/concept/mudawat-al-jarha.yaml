id: concept/mudawat-al-jarha
class: concept
kind: scientific
label: { ar: "مداواة الجرحى في العهد النبوي", en: "Treating the wounded in the Prophet's time (mudawat al-jarha)", ur: "عہدِ نبوی میں زخمیوں کا علاج" }
summary:
  ar: "تروي كتب الحديث مداواة الجرحى في مغازي العهد النبوي: فتقول الرُّبيّع بنت معوّذ إنهن كنّ مع النبي «نسقي ونداوي الجرحى» {cite:sahih-al-bukhari 2882}، ويذكر سهل بن سعد أن فاطمة أخذت قطعة حصير فأحرقتها وألصقتها بجرح النبي يوم أحد فاستمسك الدم {cite:sahih-al-bukhari 4075}، وتروي عائشة أن النبي ضرب خيمة في المسجد ليعود سعد بن معاذ المصاب في الأكحل يوم الخندق {cite:sahih-al-bukhari 463}، ويروي جابر أنه حسم جرح سعد بمشقص {cite:hadith-api-fawazahmed0 Muslim 5748}. وهذه الروايات تُعرض هنا كما رُويت، مقابل ما كتبه ابن سينا في الجراحة والكيّ."
  en: "The hadith books report the care of the wounded in the Prophet's campaigns. Al-Rubayyi' bint Mu'awwidh says the women were with the Prophet 'giving drink and treating the wounded' {cite:sahih-al-bukhari 2882}; Sahl ibn Sa'd tells that Fatima took a piece of mat, burned it and pressed it to the Prophet's wound at Uhud, and the blood held {cite:sahih-al-bukhari 4075}; A'isha reports that the Prophet pitched a tent in the mosque to visit Sa'd ibn Mu'adh, struck in the arm vein at the Trench, from close by {cite:sahih-al-bukhari 463}; and Jabir reports that he cauterised Sa'd's wound with a broad arrowhead {cite:hadith-api-fawazahmed0 Muslim 5748}. The reports are set out here as transmitted, beside what Ibn Sina wrote on surgery and cautery."
  ur: "کتبِ حدیث عہدِ نبوی کے غزوات میں زخمیوں کی دیکھ بھال کا ذکر کرتی ہیں۔ رُبیّع بنت معوّذ کہتی ہیں کہ وہ عورتیں نبی کے ساتھ «پانی پلاتیں اور زخمیوں کا علاج کرتیں» {cite:sahih-al-bukhari 2882}۔ سہل بن سعد بتاتے ہیں کہ فاطمہ نے چٹائی کا ایک ٹکڑا لے کر جلایا اور احد کے دن نبی کے زخم پر چپکا دیا تو خون رک گیا {cite:sahih-al-bukhari 4075}۔ عائشہ روایت کرتی ہیں کہ نبی نے خندق کے دن بازو کی رگ میں زخمی سعد بن معاذ کی قریب سے عیادت کے لیے مسجد میں خیمہ لگوایا {cite:sahih-al-bukhari 463}۔ جابر روایت کرتے ہیں کہ آپ نے چوڑے پھل والے تیر سے سعد کے زخم کو داغا {cite:hadith-api-fawazahmed0 Muslim 5748}۔ یہ روایات یہاں اسی طرح پیش کی گئی ہیں جیسے نقل ہوئیں، اور ان کے پہلو میں وہ ہے جو ابن سینا نے جراحت اور داغنے کے بارے میں لکھا۔"
