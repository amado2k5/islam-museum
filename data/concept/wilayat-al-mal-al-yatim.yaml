id: concept/wilayat-al-mal-al-yatim
class: concept
kind: legal
label:
  ar: ولاية مال اليتيم
  en: Guardianship over an orphan's property
  ur: یتیم کے مال کی ولایت
summary:
  ar: "يبيّن الشعراوي أن مال اليتيم والسفيه يُدار بالحكمة والقوامة، فلا يُعطى السفيه ماله، ويُختبر اليتيم في رشده قبل تسليم المال، ويُشهد عند التسليم، ويأكل الولي الفقير بالمعروف، ويحذّر من إسراف الولي في مال اليتيم {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2011}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2013}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2014}."
  en: "Al-Sha'rawi holds that the property of an orphan or of a person unable to manage it is run with wisdom and guardianship. A foolish person is not handed his wealth. The orphan is tested for maturity before his property is delivered, the delivery is witnessed, a poor guardian may take a customary share, and wasteful spending of an orphan's money is condemned {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2011}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2013}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2014}."
wings: [living]
themes: [family-marriage-kinship, law-and-courts]
issue:
  ar: "كيف تُدار أموال اليتامى والسفهاء، ومتى تُسلَّم إلى أصحابها؟"
  en: "How are the property of orphans and of the incapable managed, and when is it handed back?"
perspectives:
  - tradition: sunni
    id: sunni-sharawi-test-then-deliver
    stance:
      ar: "يُختبر اليتيم في رشده قبل التسليم، ويأكل الولي الفقير الأمين بالمعروف"
      en: "The orphan is tested for maturity before delivery, and an honest poor guardian may take a customary share"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن الولي يدرّب اليتيم على التصرف في المال قبل بلوغ الرشد، فإذا ظهر الرشد سلّمه المال بلا تأخير، وأن الولي الفقير لا يُمنع من الولاية، وأن أجره بالمعروف، وأن التسليم يُشهد عليه {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2013}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2014}."
      en: "Sha'rawi holds that the guardian trains the orphan in managing money before he reaches maturity, hands over the property at once when maturity appears, does not bar a poor but honest guardian, and requires witnesses at delivery {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2013}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2014}."
    sources: [source/tafsir-sharawi-khawatir-scan-vol-2]
  - tradition: academic
    id: academic
    stance:
      ar: "أحكام الولاية على المال في الفقه المقارن لم تُعرض بعد"
      en: "The comparative fiqh rulings on guardianship of property are not yet set out"
    summary:
      ar: "لم يُعرض في هذا الجزء رأي فقهي مقارن في ولاية المال؛ يحتاج إلى مرجع محدد (needs_source)."
      en: "No comparative fiqh reading of guardianship of property is set out in this part of the book (needs_source)."
