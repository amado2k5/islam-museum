label: { ar: "الأكل على الشهوة الصادقة عند ابن سينا", en: "Eating only on true appetite in the Canon", ur: "قانون میں سچی بھوک پر کھانا" }
summary:
  ar: "يقول ابن سينا إن حافظ الصحة لا يأكل إلا على شهوة ولا يدافع الشهوة إذا هاجت ولم تكن كاذبة كشهوة السكارى وأصحاب التخمة، لأن الصبر على الجوع يملأ المعدة أخلاطاً صديدية رديئة {cite:canon-ibn-sina-print-v1 p.228}."
  en: "Ibn Sina says the guardian of health eats only on appetite and does not hold off a real appetite once it stirs; a false appetite, like that of the drunk or the surfeited, is no guide, and enduring hunger fills the stomach with bad, watery humours {cite:canon-ibn-sina-print-v1 p.228}."
