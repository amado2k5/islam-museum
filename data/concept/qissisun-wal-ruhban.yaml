term: { ar: "القسيسون والرهبان", en: "qissisun / ruhban" }
summary:
  ar: "يشرح رشيد رضا لفظي «القسيسين» و«الرهبان» في قوله تعالى في سورة المائدة (82): الراهب المتبتّل المنقطع في دير أو صومعة للعبادة، وقيل إن أصله من الرهبة أو من رهب الإبل؛ والقسيس رئيس ديني فوق الشماس ودون الأسقف، وأصله أن يكون من أهل العلم بدينه وكتبه. ويرى أن الآية تجمع بين العُبّاد والعلماء، وأن الرهبانية بدعة في النصرانية، وأن ذلك لا ينافي تقريب النصارى من مودة المؤمنين. وينقل أن أهل التفسير المأثور ذكروا قولين في المراد بهم: من آمن بعيسى في عهده كالحواريين، أو جماعة النجاشي."
  en: "Rida glosses the words qissisin (priests) and ruhban (monks) in Qur'an 5:82: a ruhban is a celibate devotee withdrawn to a monastery or hermitage, a word he links either to fear or to the emaciation of camels, and a qissis is a church rank above the deacon and below the bishop, whose ideal is learning in his religion and its books. He reads the verse as joining devotees and scholars, calls monasticism an innovation in Christianity, and notes two transmitted readings of who is meant: those who believed in Jesus in his time, like the disciples, or the people of the Negus."
