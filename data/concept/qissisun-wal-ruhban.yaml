label: { ar: "القسيسون والرهبان", en: "Priests and monks (qissisun and ruhban)", es: "Sacerdotes y monjes (qissisun y ruhban)", fr: "Prêtres et moines (qissisun et ruhban)" }
term: { ar: "القسيسون والرهبان", en: "qissisun / ruhban" }
summary:
  ar: "يشرح رشيد رضا لفظي «القسيسين» و«الرهبان» في قوله تعالى في سورة المائدة (82): الراهب المتبتّل المنقطع في دير أو صومعة للعبادة، وقيل إن أصله من الرهبة أو من رهب الإبل؛ والقسيس رئيس ديني فوق الشماس ودون الأسقف، وأصله أن يكون من أهل العلم بدينه وكتبه. ويرى أن الآية تجمع بين العُبّاد والعلماء، وأن الرهبانية بدعة في النصرانية، وأن ذلك لا ينافي تقريب النصارى من مودة المؤمنين. وينقل أن أهل التفسير المأثور ذكروا قولين في المراد بهم: من آمن بعيسى في عهده كالحواريين، أو جماعة النجاشي."
  en: "Rida glosses the words qissisin (priests) and ruhban (monks) in Qur'an 5:82: a ruhban is a celibate devotee withdrawn to a monastery or hermitage, a word he links either to fear or to the emaciation of camels, and a qissis is a church rank above the deacon and below the bishop, whose ideal is learning in his religion and its books. He reads the verse as joining devotees and scholars, calls monasticism an innovation in Christianity, and notes two transmitted readings of who is meant: those who believed in Jesus in his time, like the disciples, or the people of the Negus."
  es: "Rida interpreta las palabras qissisin (sacerdotes) y ruhban (monjes) en el Corán 5:82: un ruhban es un devoto célibe retirado a un monasterio o ermita, palabra que él relaciona con el temor o con la extrema delgadez de los camellos, y un qissis es un rango eclesiástico superior al del diácono e inferior al del obispo, cuyo ideal es el estudio de su religión y sus libros. Rida interpreta el versículo como una unión entre devotos y eruditos, considera el monacato una innovación en el cristianismo y señala dos lecturas transmitidas sobre a quién se refiere: aquellos que creyeron en Jesús en su tiempo, como los discípulos, o la gente del Negus."
  fr: "Rida commente les termes qissisin (prêtres) et ruhban (moines) dans le verset 5:82 du Coran: un ruhban est un dévot célibataire retiré dans un monastère ou un ermitage, terme qu’il associe soit à la crainte, soit à l’émaciation des chameaux; un qissis, quant à lui, est un ecclésiastique d’un rang supérieur à celui de diacre et inférieur à celui d’évêque, dont l’idéal est l’étude approfondie de sa religion et de ses textes sacrés. Il interprète ce verset comme unissant dévots et érudits, qualifie le monachisme d’innovation au sein du christianisme et relève deux lectures transmises quant aux personnes visées: soit ceux qui croyaient en Jésus à son époque, comme les disciples, soit le peuple du Négus."
