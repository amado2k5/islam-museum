label:
  ar: المال
  en: Mal (property)
summary:
  ar: المال في اللغة ما يملكه الإنسان من كل شيء، فما لم يملك لا يعد مالًا في اللغة كالشجر في الغابة والسمك في الماء {cite:usul-iqtisad-islami-0660 p. 51}. ويعرّفه الحنفية بأنه «ما يميل إليه الطبع ويجري فيه البذل والمنع» ويمكن ادخاره لوقت الحاجة، فيخرجون المنافع والديون والحقوق {cite:usul-iqtisad-islami-0660 p. 51}. ويرى جمهور الفقهاء أن المال أوسع، فهو «كل ما ينتفع به منفعة مباحة» عينًا كان أو منفعة أو دينًا أو حقًّا {cite:usul-iqtisad-islami-0660 p. 51}. ويقسم المال إلى نقود وعروض وديون ومنافع وحقوق، وإلى متقوّم وغير متقوّم، فالمتقوم ما حيز وأباح الشارع الانتفاع به في حال السعة، وغير المتقوم ما لم يحز أو حرّم الشارع الانتفاع به في حال السعة {cite:usul-iqtisad-islami-0660 p. 52}.
