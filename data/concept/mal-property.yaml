summary:
  ar: المال في اللغة ما يملكه الإنسان من كل شيء، فما لم يملك لا يعد مالًا في اللغة كالشجر في الغابة والسمك في الماء {cite:usul-iqtisad-islami-0660 p. 51}. ويعرّفه الحنفية بأنه «ما يميل إليه الطبع ويجري فيه البذل والمنع» ويمكن ادخاره لوقت الحاجة، فيخرجون المنافع والديون والحقوق {cite:usul-iqtisad-islami-0660 p. 51}. ويرى جمهور الفقهاء أن المال أوسع، فهو «كل ما ينتفع به منفعة مباحة» عينًا كان أو منفعة أو دينًا أو حقًّا {cite:usul-iqtisad-islami-0660 p. 51}. ويقسم المال إلى نقود وعروض وديون ومنافع وحقوق، وإلى متقوّم وغير متقوّم، فالمتقوم ما حيز وأباح الشارع الانتفاع به في حال السعة، وغير المتقوم ما لم يحز أو حرّم الشارع الانتفاع به في حال السعة {cite:usul-iqtisad-islami-0660 p. 52}.
  tr: "Dilde, zenginlik bir kişinin her şeyden sahip olduğu şeydir; sahip olunmamış olan ise dilde zenginlik olarak kabul edilmez; ormandaki ağaçlar ya da sudaki balıklar gibi {cite:usul-iqtisad-islami-0660 s. 51}. Hanafiler bunu \"doğanın vermeye ve vermeye eğilimli olduğu ve vermeye tabi olan şey\" olarak tanımlar; ihtiyaç anlarında saklanabilir, böylece fayda, borç ve haklar alabilirler {cite:usul-iqtisad-islami-0660 s. 51}. Hukukçuların çoğunluğu servetin daha geniş olduğuna inanır; \"izin verilen bir faydadan fayda sağlayan her şeydir,\" ister ayri, fayda, borç ya da hak olsun {cite:usul-iqtisad-islami-0660 s. 51}. Servet, para, teklifler, borçlar, faydalar ve haklar ile yerleşik ve kurulmamış olarak bölünür. Yerleşik mülk, yasama organı tarafından ehliyet durumlarında ondan yararlanılmasına izin verilen ve izin verilen mülktür; yasama organı ise ehliyetli durumlarda fayda sağlamadığı veya yasaklamadığı sürece yerleşik olmayan maldır. {cite:usul-iqtisad-islami-0660 s. 52}."
  id: "Dalam bahasa, kekayaan adalah apa yang dimiliki seseorang atas segala sesuatu; apa yang tidak dimiliki tidak dianggap kekayaan dalam bahasa, seperti pohon di hutan atau ikan di air {cite:usul-iqtisad-islami-0660 hlm. 51}. Kaum Hanafi mendefinisikannya sebagai \"apa yang alam cenderung lakukan dan tunduk pada pemberian dan penahanan,\" dan dapat disimpan untuk saat membutuhkan, sehingga mereka dapat mengambil manfaat, hutang, dan hak {cite:usul-iqtisad-islami-0660 hlm. 51}. Mayoritas ahli hukum percaya bahwa kekayaan lebih luas; kekayaan adalah \"segala sesuatu yang mendapat manfaat yang diperbolehkan,\" baik dalam bentuk barang, manfaat, utang, atau hak {cite:usul-iqtisad-islami-0660 hlm. 51}. Kekayaan dibagi menjadi uang, tawaran, utang, manfaat, dan hak, serta menjadi yang sudah mapan dan yang belum mapan. Properti yang telah ditetapkan adalah apa yang diizinkan dan diizinkan oleh pembuat undang-undang untuk mendapatkan manfaat darinya dalam kasus kapasitas, dan yang tidak berdiri kecuali legislator telah memberikan atau melarang manfaat darinya dalam kasus kapasitas {cite:usul-iqtisad-islami-0660 hlm. 52}."
