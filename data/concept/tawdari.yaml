  id: "kamu todrie"
summary:
  ar: "تودري في الكتاب قال ديسقوريدوس عشبة شبيهة الورق بورق الفراسيون مربع الجذر ولها أقماع فيها بزر مستطيل أسود، حار في الثانية رطب في الأولى، له حرافة كحرافة الحرف وفيه تقريح، ينفع من السرطانات التي ليست بمتقرحة ومن جميع الأورام الصلبة ومن صلابة النقرس ومن أورام أصول الأذن، ويكتحل به مع العسل فينقي قروح العين، ويعين في اللعوقات على نفث الأخلاط، ويذكر الكتاب نقلا موسوما نفعه في الباه {cite:canon-ibn-sina-print-v1 pp.686-687}"
  en: "Tawdari is in the book, Dioscorides said, a herb with leaves like the leaves of farasiyun and a square root, with cones holding an elongated black seed; hot in the second degree and moist in the first, with a pungency like the pungency of harf and some ulcerating; it benefits cancers that are not ulcerated, all hard swellings, the hardness of gout and swellings at the roots of the ear, it is used as an eye salve with honey and cleanses eye ulcers, and it helps in linctuses to bring up humours; and the book lists, as a labelled report, its benefit for desire {cite:canon-ibn-sina-print-v1 pp.686-687}"
  ur: "تودری کتاب میں، دیسقوریدوس کے مطابق، ایک جڑی بوٹی ہے جس کے پتے فراسیون کے پتوں جیسے اور جڑ چوکور ہے، اس کے خولوں میں لمبوترا کالا بیج ہوتا ہے؛ دوسرے درجے میں گرم اور پہلے میں تر ہے، اس میں حرف جیسی تیزی ہے اور کچھ زخم کر دینے کی خاصیت؛ ان سرطانوں میں نافع ہے جو پھٹے ہوئے نہ ہوں، تمام سخت ورموں میں، نقرس کی سختی میں اور کان کی جڑ کے ورموں میں؛ شہد کے ساتھ سرمے کے طور پر لگایا جاتا ہے اور آنکھ کے قرحوں کو صاف کرتا ہے، اور لعوقوں میں اخلاط کے نکلنے میں مدد دیتا ہے؛ اور کتاب منقول فہرست کے طور پر باہ میں اس کا فائدہ درج کرتی ہے {cite:canon-ibn-sina-print-v1 pp.686-687}۔"
  es: "En el libro, Dioscórides dice que el tawdari es una hierba con hojas parecidas a las del farasiyun y raíz cuadrada, con conos que contienen una semilla negra alargada; caliente en segundo grado y húmeda en primero, con un picor similar al del harf y algo ulcerante; beneficia a los cánceres no ulcerados, a todas las inflamaciones duras, a la dureza de la gota y a las inflamaciones en la base de la oreja, se usa como ungüento para los ojos con miel y limpia las úlceras oculares, y ayuda en jarabes a elevar los humores; y el libro enumera, como un informe etiquetado, su beneficio para el deseo {cite:canon-ibn-sina-print-v1 pp.686-687}"
  fr: "Le tawdari est mentionné dans le livre, dit Dioscoride, comme une plante aux feuilles semblables à celles du farasiyun et à racine carrée, portant des cônes contenant une graine noire allongée; chaude au deuxième degré et humide au premier, avec une saveur piquante comparable à celle du harf et quelque peu ulcérative; elle est bénéfique aux cancers non ulcérés, à tous les gonflements durs, à la dureté de la goutte et aux gonflements à la racine de l’oreille; elle est utilisée comme pommade ophtalmique avec du miel et nettoie les ulcères oculaires, et elle aide dans les limpides à faire remonter les humeurs; et le livre mentionne, sous forme de rapport légendé, son bienfait pour le désir {cite:canon-ibn-sina-print-v1 pp.686-687}"
  tr: "Kitapta Dioscorides, bunun Feraezya yaprağına benzer yaprak benzeri bir ot olduğunu, kare kökleri ve kozalakları siyah dikdörtgen tohumlar içerdiğini, ikincisinde sıcak, ilkinde nemli, zanaatkarlık ve ülsere benzer keskinliğe sahip olduğunu belirtmiştir. Ülsersiz kanserlerde, tüm katı tümörlerde, gut sertliğinde ve kulak köklerindeki tümörlerde faydalıdır. Göz ülserlerini arındırmak için bal ile birlikte kullanılır ve yumor üfleyerek yalamaya yardımcı olur. Kitapta \"Bah'ta faydası\" başlıklı bir anlatımdan bahsedilir {cite:canon-ibn-sina-print-v1 s.686-687}"
  id: "Dalam buku tersebut, Dioscorides mengatakan bahwa ini adalah tanaman mirip daun yang mirip dengan daun Pharaesian, dengan akar persegi dan kerucut yang mengandung biji persegi panjang hitam, panas di bagian kedua, lembap di bagian kedua, dengan ketajaman yang mirip dengan kerajinan dan ulserasi. Ini berguna untuk kanker yang tidak berluka, untuk semua tumor padat, untuk kekerasan asam urat, dan untuk tumor akar telinga. Obat ini digunakan bersama madu untuk memurnikan luka mata, dan membantu menjilat dengan meniup humor. Buku ini menyebutkan narasi berjudul \"Manfaat di Bah\" {cite:canon-ibn-sina-print-v1 hlm.686-687}"
