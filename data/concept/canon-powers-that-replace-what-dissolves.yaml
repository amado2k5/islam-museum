summary:
  ar: "يذكر ابن سينا قوتين وكل بهما حفظ البدن يخدمهما الطبيب: القوة الغاذية الطبيعية التي تخلف بدل ما يتحلل من البدن، والقوة النابضة الحيوانية التي تخلف بدل ما يتحلل من الروح، ثم القوة المغيرة التي تحول الغذاء إلى شبيه المغتذي {cite:canon-ibn-sina-print-v1 p.202}."
  en: "Ibn Sina names two powers charged with keeping the body, which the physician serves: the natural nutritive power that replaces what dissolves from the body, and the animal pulsating power that replaces what dissolves from the spirit, then the transformative power that turns food into the likeness of what is fed {cite:canon-ibn-sina-print-v1 p.202}."
