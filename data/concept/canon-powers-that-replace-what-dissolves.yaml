id: concept/canon-powers-that-replace-what-dissolves
class: concept
kind: scientific
label:
  ar: "القوى الخادمة للبدل: الغاذية والنابضة والمغيرة"
  en: "The powers that replace what dissolves: nutritive, pulsating and transformative"
  fr: "Facultés remplaçant les pertes : nutritive, pulsatile et transformatrice"
  ur: "تحلیل شدہ کا بدل دینے والی قوتیں: غاذیہ، نابضہ اور مغیرہ"
  es: "Los poderes que reemplazan lo que se disuelve: nutritivos, palpitantes y transformadores."
summary:
  ar: "يذكر ابن سينا قوتين وكل بهما حفظ البدن يخدمهما الطبيب: القوة الغاذية الطبيعية التي تخلف بدل ما يتحلل من البدن، والقوة النابضة الحيوانية التي تخلف بدل ما يتحلل من الروح، ثم القوة المغيرة التي تحول الغذاء إلى شبيه المغتذي {cite:canon-ibn-sina-print-v1 p.202}."
  en: "Ibn Sina names two powers charged with keeping the body, which the physician serves: the natural nutritive power that replaces what dissolves from the body, and the animal pulsating power that replaces what dissolves from the spirit, then the transformative power that turns food into the likeness of what is fed {cite:canon-ibn-sina-print-v1 p.202}."
  fr: "Ibn Sina nomme deux facultés chargées de conserver le corps, que sert le médecin : la nutritive naturelle remplace les pertes corporelles, la pulsatile animale celles de l’esprit ; la transformatrice rend ensuite l’aliment semblable à ce qu’il nourrit {cite:canon-ibn-sina-print-v1 p.202}."
  es: "Ibn Sina nombra dos poderes encargados de mantener el cuerpo, a los que sirve el médico: el poder nutritivo natural que reemplaza lo que se disuelve del cuerpo, y el poder pulsante animal que reemplaza lo que se disuelve del espíritu, y luego el poder transformador que convierte el alimento en la semejanza de lo que se ingiere {cite:canon-ibn-sina-print-v1 p.202}."
