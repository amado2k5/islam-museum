id: concept/tashhir-public-exposure
class: concept
kind: legal
label:
  ar: "التشهير"
  en: "Tashhir (publicly exposing or disgracing someone)"
  ur: "تشہیر (کسی کو رسوا کرنا یا اعلان کرنا)"
summary:
  ar: "التشهير إعلان الأمر وإذاعته، وحكمه يختلف بحسب المشهِّر والمشهَّر به. الأصل تحريم تشهير الناس ببعضهم بذكر العيوب، ويحرم إن كان المشهَّر به بريئاً مما يُشاع عنه، أو كان متصفاً به غير مجاهر ولا يضر غيره، لأنه من الغيبة. ويحرم تشهير الإنسان بنفسه. ويجوز تشهير من يجاهر بالمعصية، ويجب تحذير الناس من المجروحين من الرواة والشهود وأهل البدع ممن يقلَّدون في ذلك، بشرط النية الخالصة والصدق. وللحاكم التشهير تعزيراً أو مع الحد، كإقامة الحدود علانية وشهرة شاهد الزور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5204} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5205} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5206} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5207} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5208} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5209} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5210}"
  en: "Tashhir is publicising or spreading something, and its ruling depends on who does it and on the person exposed. The rule is that disgracing one Muslim before others by naming faults is forbidden; it is forbidden when the person is innocent of what is said of him, or when he has the fault but does not flaunt it and his exposure does no harm to others, since that is backbiting. A man may not expose himself. It is lawful to expose one who openly flaunts a sin; it is recommended or required to warn against those whose trustworthiness is impugned, such as narrators, witnesses and innovators whom people follow, with a sincere intention. The ruler may publicise a punishment as ta'zir or with the hadd, for example by carrying out hadd punishments in public and making a false witness known. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5204} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5205} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5206} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5207} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5208} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5209} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5210}"
