id: concept/tashhir-public-exposure
class: concept
kind: legal
label:
  ar: "التشهير"
  en: "Tashhir (publicly exposing or disgracing someone)"
  ur: "تشہیر ⁦(کسی کو رسوا کرنا یا اعلان کرنا)⁩"
  es: "Tashhir (exponer o deshonrar públicamente a alguien)"
  fr: "Tashhir (exposer ou déshonorer publiquement quelqu'un)"
summary:
  ar: "التشهير إعلان الأمر وإذاعته، وحكمه يختلف بحسب المشهِّر والمشهَّر به. الأصل تحريم تشهير الناس ببعضهم بذكر العيوب، ويحرم إن كان المشهَّر به بريئاً مما يُشاع عنه، أو كان متصفاً به غير مجاهر ولا يضر غيره، لأنه من الغيبة. ويحرم تشهير الإنسان بنفسه. ويجوز تشهير من يجاهر بالمعصية، ويجب تحذير الناس من المجروحين من الرواة والشهود وأهل البدع ممن يقلَّدون في ذلك، بشرط النية الخالصة والصدق. وللحاكم التشهير تعزيراً أو مع الحد، كإقامة الحدود علانية وشهرة شاهد الزور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5204} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5205} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5206} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5207} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5208} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5209} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5210}"
  en: "Tashhir is publicising or spreading something, and its ruling depends on who does it and on the person exposed. The rule is that disgracing one Muslim before others by naming faults is forbidden; it is forbidden when the person is innocent of what is said of him, or when he has the fault but does not flaunt it and his exposure does no harm to others, since that is backbiting. A man may not expose himself. It is lawful to expose one who openly flaunts a sin; it is recommended or required to warn against those whose trustworthiness is impugned, such as narrators, witnesses and innovators whom people follow, with a sincere intention. The ruler may publicise a punishment as ta'zir or with the hadd, for example by carrying out hadd punishments in public and making a false witness known. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5204} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5205} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5206} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5207} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5208} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5209} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5210}"
  es: "Tashhir es divulgar o difundir algo, y su norma depende de quién lo haga y de la persona expuesta. La regla es que deshonrar a un musulmán ante otros nombrando faltas está prohibido; está prohibido cuando la persona es inocente de lo que se dice de ella, o cuando tiene la falta pero no la exhibe y su exposición no perjudica a otros, ya que eso es calumnia. Un hombre no puede exponerse a sí mismo. Es lícito exponer a quien exhibe abiertamente un pecado; se recomienda o se exige advertir sobre aquellos cuya credibilidad se pone en duda, como narradores, testigos e innovadores a quienes la gente sigue, con una intención sincera. El gobernante puede divulgar un castigo como ta'zir o con hadd, por ejemplo, ejecutando castigos hadd en público y dando a conocer a un falso testigo. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5204} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5205} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5206} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5207} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5208} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5209} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5210}"
  fr: "Le tashir consiste à divulguer ou à répandre des informations, et sa validité dépend de la personne qui le pratique et de celle qui est exposée. Il est interdit de déshonorer un musulman devant les autres en révélant ses fautes; cela est également interdit lorsque la personne est innocente des faits reprochés, ou lorsqu'elle a commis la faute sans l'afficher et que sa divulgation ne nuit à personne, car cela relève de la médisance. Un homme ne peut se dénoncer lui-même. Il est licite de dénoncer celui qui affiche ouvertement un péché; il est recommandé, voire obligatoire, de mettre en garde contre ceux dont la fiabilité est mise en doute, tels que les narrateurs, les témoins et les innovateurs suivis par la population, avec une intention sincère. Le dirigeant peut rendre publique une punition par tashir ou par hadd, par exemple en appliquant publiquement les peines hadd et en révélant l'identité d'un faux témoin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5204} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5205} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5206} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5207} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5208} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5209} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5210}"
  ur: "تشہیر کسی چیز کی تشہیر یا پھیلانا ہے، اور اس کا حکم اس بات پر منحصر ہے کہ اسے کون کرتا ہے اور ظاہر کرنے والے شخص پر۔ قاعدہ یہ ہے کہ ایک مسلمان کو دوسرے کے سامنے عیب لگا کر رسوا کرنا حرام ہے۔ جب کوئی شخص اس کے بارے میں کہی گئی باتوں سے بری ہو یا اس میں کوئی عیب ہو لیکن اس کا اظہار نہ کرے اور اس کے ظاہر کرنے سے دوسروں کو کوئی نقصان نہ پہنچے تو یہ حرام ہے کیونکہ یہ غیبت ہے۔ ایک آدمی اپنے آپ کو بے نقاب نہیں کر سکتا. کھلے عام گناہ کرنے والے کو بے نقاب کرنا جائز ہے۔ ان لوگوں کے خلاف تنبیہ کرنے کی سفارش کی جاتی ہے جن کی ثقہ ہے، جیسے راوی، گواہ اور اختراعی جن کی لوگ خلوص نیت کے ساتھ پیروی کرتے ہیں۔ حاکم تعزیر کے طور پر یا حد کے ساتھ سزا کا اعلان کر سکتا ہے، مثال کے طور پر عوام میں حد کی سزا دینا اور جھوٹے گواہ کو ظاہر کرنا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5204} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5205} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5206} صفحہ 5207} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5208} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5209}"
