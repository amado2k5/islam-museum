  es: "Una piedra amarillenta traída de Abisinia, que se frota con fuerza; ayuda a eliminar las marcas que dejan las úlceras en el ojo."
  fr: "Une pierre jaunâtre provenant d'Abyssinie, à l'action abrasive; elle soulage les marques laissées par les ulcères oculaires."
