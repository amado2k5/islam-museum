id: concept/iftira
class: concept
kind: ethical
label:
  ar: "الافتراء على الخلق"
  en: "Slandering people (iftira')"
  ur: "لوگوں پر بہتان باندھنا"
summary:
  ar: "يرى عمر عبد الكافي أن الافتراء على الناس، أي أن يُقال في الإنسان ما ليس فيه، مجموعة كبائر من كذب وزور وظلم، وأن عاقبته تعود على صاحبه في حياته ورزقه، وينهى عن نقل السوء ونشره على الشبكة."
  en: "Omar Abdelkafy holds that slandering people, saying of someone what is not in him, is a bundle of major sins, lying, false witness and injustice, whose consequence returns on the slanderer in his life and livelihood, and he forbids carrying and spreading evil talk online."
  ur: "عمر عبد الکافی کے نزدیک لوگوں پر بہتان باندھنا، یعنی کسی کے بارے میں وہ کہنا جو اس میں نہیں، کبیرہ گناہوں کا مجموعہ ہے، جھوٹ، جھوٹی گواہی اور ظلم، جس کا انجام بہتان باندھنے والے کی زندگی اور روزی پر لوٹتا ہے، اور وہ بری بات آگے پہنچانے اور انٹرنیٹ پر پھیلانے سے منع کرتے ہیں۔"
