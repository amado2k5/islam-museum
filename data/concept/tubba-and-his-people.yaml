id: concept/tubba-and-his-people
class: concept
kind: term
label: { ar: "تبّع وقومه", en: "Tubba' and his people", ur: "تبع اور اس کی قوم" }
summary:
  ar: "يذكر القرآن قوم تبع مثلًا لمن أُهلكوا لإجرامهم [[passage/quran-44-37|الدخان 37]] ويعدّهم بين المكذبين [[passage/quran-50-14|ق 14]] دون أن يسمّي تبعًا أو يصف ما جرى. وتبع لقب لملوك حمير باليمن عند الطبري وابن كثير والقرطبي، ويرى القرطبي وابن كثير أن المقصود أحدهم، هو أبو كرب أسعد، الذي كسا الكعبة، وتروي كتب السيرة أنه اتبع اليهودية بحبرين من المدينة؛ ويقول الطبري عن قتادة وعائشة إنه كان رجلًا صالحًا وإن الله ذمّ قومه لا إياه {cite:tafsir-tabari-quran-com on 44:37} {cite:tafsir-qurtubi-quran-com on 44:37} {cite:tafsir-ibn-kathir on 44:37}."
  en: "The Qur'an uses the people of Tubba' as an example of those destroyed for their crimes [[passage/quran-44-37|al-Dukhan 37]] and counts them among the deniers [[passage/quran-50-14|Qaf 14]], without naming Tubba' or saying what befell them. In al-Tabari, Ibn Kathir and al-Qurtubi tubba' is a title of the Himyarite kings of Yemen; al-Qurtubi and Ibn Kathir think one of them is meant, Abu Karib As'ad, who clothed the Ka'ba and, the sira books relate, took up Judaism through two rabbis from Medina; al-Tabari reports Qatada and 'A'isha that he was a righteous man whom God did not blame, only his people {cite:tafsir-tabari-quran-com on 44:37} {cite:tafsir-qurtubi-quran-com on 44:37} {cite:tafsir-ibn-kathir on 44:37}."
  ur: "قرآن قومِ تبع کو ان لوگوں کی مثال کے طور پر لاتا ہے جو اپنے جرم کی وجہ سے ہلاک ہوئے [[passage/quran-44-37|الدخان 37]] اور انہیں جھٹلانے والوں میں گنتا ہے [[passage/quran-50-14|ق 14]]، مگر نہ تبع کا نام لیتا ہے نہ بتاتا ہے کہ ان پر کیا گزری۔ طبری، ابن کثیر اور قرطبی کے ہاں تبع یمن کے حمیری بادشاہوں کا لقب ہے؛ قرطبی اور ابن کثیر کے نزدیک مراد ان میں سے ایک ہے، یعنی ابو کرب اسعد، جس نے کعبہ پر غلاف چڑھایا اور جس کے بارے میں کتبِ سیرت بتاتی ہیں کہ مدینہ کے دو یہودی عالموں کے ذریعے وہ یہودیت کی طرف آیا؛ طبری قتادہ اور عائشہ سے نقل کرتے ہیں کہ وہ نیک آدمی تھا اور اللہ نے اس کی قوم کی مذمت کی، اس کی نہیں {cite:tafsir-tabari-quran-com on 44:37} {cite:tafsir-qurtubi-quran-com on 44:37} {cite:tafsir-ibn-kathir on 44:37}۔"
