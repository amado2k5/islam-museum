label: { ar: "تبّع وقومه", en: "Tubba' and his people", ur: "تبع اور اس کی قوم", es: "Tubba y su gente", fr: "Tubba et son peuple", tr: "Takip ve halkı", id: "Mengikuti dan orang-orangnya" }
summary:
  ar: "يذكر القرآن قوم تبع مثلًا لمن أُهلكوا لإجرامهم [[passage/quran-44-37|الدخان 37]] ويعدّهم بين المكذبين [[passage/quran-50-14|ق 14]] دون أن يسمّي تبعًا أو يصف ما جرى. وتبع لقب لملوك حمير باليمن عند الطبري وابن كثير والقرطبي، ويرى القرطبي وابن كثير أن المقصود أحدهم، هو أبو كرب أسعد، الذي كسا الكعبة، وتروي كتب السيرة أنه اتبع اليهودية بحبرين من المدينة؛ ويقول الطبري عن قتادة وعائشة إنه كان رجلًا صالحًا وإن الله ذمّ قومه لا إياه {cite:tafsir-tabari-quran-com on 44:37} {cite:tafsir-qurtubi-quran-com on 44:37} {cite:tafsir-ibn-kathir on 44:37}."
  en: "The Qur'an uses the people of Tubba' as an example of those destroyed for their crimes [[passage/quran-44-37|al-Dukhan 37]] and counts them among the deniers [[passage/quran-50-14|Qaf 14]], without naming Tubba' or saying what befell them. In al-Tabari, Ibn Kathir and al-Qurtubi tubba' is a title of the Himyarite kings of Yemen; al-Qurtubi and Ibn Kathir think one of them is meant, Abu Karib As'ad, who clothed the Ka'ba and, the sira books relate, took up Judaism through two rabbis from Medina; al-Tabari reports Qatada and 'A'isha that he was a righteous man whom God did not blame, only his people {cite:tafsir-tabari-quran-com on 44:37} {cite:tafsir-qurtubi-quran-com on 44:37} {cite:tafsir-ibn-kathir on 44:37}."
  ur: "قرآن قومِ تبع کو ان لوگوں کی مثال کے طور پر لاتا ہے جو اپنے جرم کی وجہ سے ہلاک ہوئے [[passage/quran-44-37|الدخان 37]] اور انہیں جھٹلانے والوں میں گنتا ہے [[passage/quran-50-14|ق 14]]، مگر نہ تبع کا نام لیتا ہے نہ بتاتا ہے کہ ان پر کیا گزری۔ طبری، ابن کثیر اور قرطبی کے ہاں تبع یمن کے حمیری بادشاہوں کا لقب ہے؛ قرطبی اور ابن کثیر کے نزدیک مراد ان میں سے ایک ہے، یعنی ابو کرب اسعد، جس نے کعبہ پر غلاف چڑھایا اور جس کے بارے میں کتبِ سیرت بتاتی ہیں کہ مدینہ کے دو یہودی عالموں کے ذریعے وہ یہودیت کی طرف آیا؛ طبری قتادہ اور عائشہ سے نقل کرتے ہیں کہ وہ نیک آدمی تھا اور اللہ نے اس کی قوم کی مذمت کی، اس کی نہیں {cite:tafsir-tabari-quran-com on 44:37} {cite:tafsir-qurtubi-quran-com on 44:37} {cite:tafsir-ibn-kathir on 44:37}۔"
  es: "El Corán utiliza a la gente de Tubba' como ejemplo de aquellos destruidos por sus crímenes [[passage/quran-44-37|al-Dukhan 37]] y los cuenta entre los negadores [[passage/quran-50-14|Qaf 14]], sin nombrar a Tubba' ni decir qué les sucedió. En al-Tabari, Ibn Kathir y al-Qurtubi, Tubba' es un título de los reyes himyaritas de Yemen; al-Qurtubi e Ibn Kathir piensan que se refiere a uno de ellos, Abu Karib As'ad, quien vistió la Kaaba y, según los libros de la sira, adoptó el judaísmo a través de dos rabinos de Medina; Al-Tabari informa que Qatada y Aisha dijeron que era un hombre justo a quien Dios no culpó, sino solo a su pueblo {cite:tafsir-tabari-quran-com en 44:37} {cite:tafsir-qurtubi-quran-com en 44:37} {cite:tafsir-ibn-kathir en 44:37}."
  fr: "Le Coran cite les habitants de Tubba' en exemple de ceux qui périrent pour leurs crimes [[passage/quran-44-37|al-Dukhan 37]] et les compte parmi les négateurs [[passage/quran-50-14|Qaf 14]], sans nommer Tubba' ni préciser leur sort. Selon al-Tabari, Ibn Kathir et al-Qurtubi, Tubba' est un titre des rois himyarites du Yémen; al-Qurtubi et Ibn Kathir pensent qu'il s'agit de l'un d'eux, Abu Karib As'ad, qui habilla la Kaaba et, d'après les livres de la Sira, se convertit au judaïsme auprès de deux rabbins de Médine. al-Tabari rapporte que Qatada et 'A'isha qu'il était un homme juste que Dieu n'a pas blâmé, seulement son peuple {cite:tafsir-tabari-quran-com on 44:37} {cite:tafsir-qurtubi-quran-com on 44:37} {cite:tafsir-ibn-kathir on 44:37}."
  tr: "Kur'an, Tabi halkını suçları nedeniyle yok edilenler örneği olarak gösterir [[pasaj/kuran-44-37|Ad-Dukhan 37]] ve onları inkârcılar arasında sayar [[pasaj/kuran-50-14|Q 14]] ancak Tabi'yi isimlendirmez veya olanları anlatmaz. Yemen'deki Himyarlı kralların unvanı El-Tabari, İbn Ketir ve El-Kurtubi'ye atfedilmiştir. El-Kurtubi ve İbn Kathir, onlardan birinin Kabe'yi takip eden Ebu Karb As'ad olduğuna inanırlar. Biyografiler, onun Medine'den iki piskoposla birlikte Yahudiliğe geçtiğini anlatır; el-Taberi, Katadah ve Aişe hakkında onun doğru bir adam olduğunu ve Allah'ın halkını kınadığını, kendisini değil söylediğini söyler. {cite:tafsir-tabari-quran-com on 44:37} {cite:tafsir-qurtubi-can-com on 44:37} {cite:tafsir-ibn-kathir on 44:37}"
  id: "Al-Qur'an menyebut orang-orang Tabi sebagai contoh mereka yang dihancurkan karena kejahatan mereka [[ayat/al-Qur'an-44-37|Ad-Dukhan 37]] dan menghitung mereka sebagai penyangkal [[ayat/al-Quran-50-14|Q 14]] tanpa menyebut nama Tabi atau menjelaskan apa yang terjadi. Gelar raja-raja Himyarit di Yaman diberikan kepada Al-Tabari, Ibn Kathir, dan Al-Qurtubi. Al-Qurtubi dan Ibn Kathir percaya bahwa salah satunya adalah Abu Karb As'ad, yang meliput Ka'bah. Biografi tersebut menceritakan bahwa ia memeluk Yudaisme bersama dua uskup dari Madinah; al-Tabari mengatakan tentang Qatadah dan Aisha bahwa ia adalah orang yang benar, dan bahwa Allah mengutuk umatnya, bukan dirinya. {cite:tafsir-tabari-quran-com pada 44:37} {cite:tafsir-qurtubi-quran-com pada 44:37} {cite:tafsir-ibn-kathir pada 44:37}."
