id: concept/nearness-of-foods-to-blood
class: concept
kind: scientific
label: { ar: "قرب الأغذية من جوهر الدم عند ابن سينا", en: "The nearness of foods to the substance of blood in the Canon", ur: "قانون میں غذاؤں کا خون کے جوہر سے قرب", es: "La proximidad de los alimentos a la sustancia de la sangre en el Canon", fr: "La proximité des aliments avec la substance du sang dans le Canon" }
summary:
  ar: "يذكر ابن سينا أن من الأدوية الغذائية ما هو أقرب إلى الدوائية ومنها ما هو أقرب إلى الغذائية، وأن الأغذية نفسها متفاوتة في قربها من جوهر الدم {cite:canon-ibn-sina-print-v1 pp.133-134}."
  en: "Ibn Sina notes that some medicinal foods lie nearer to being drugs and some nearer to being foods, and that foods themselves differ in how close they stand to the substance of blood {cite:canon-ibn-sina-print-v1 pp.133-134}."
  es: "Ibn Sina señala que algunos alimentos medicinales están más cerca de ser drogas y otros más cerca de ser alimentos, y que los alimentos mismos difieren en cuán cerca están de la sustancia de la sangre {cite:canon-ibn-sina-print-v1 pp.133-134}."
  fr: "Ibn Sina note que certains aliments médicinaux se rapprochent davantage des médicaments et d'autres des aliments, et que les aliments eux-mêmes diffèrent dans leur degré de proximité avec la substance du sang {cite:canon-ibn-sina-print-v1 pp.133-134}."
  ur: "ابن سینا نوٹ کرتے ہیں کہ کچھ دواؤں کی غذائیں منشیات کے زیادہ قریب ہوتی ہیں اور کچھ کھانے کی چیزوں کے قریب ہوتی ہیں، اور یہ کہ کھانے کی چیزیں خود اس بات میں مختلف ہوتی ہیں کہ وہ خون کے مادے کے کتنے قریب ہیں۔"
