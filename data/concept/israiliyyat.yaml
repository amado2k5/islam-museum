label: { ar: "الإسرائيليات", en: "Isra'iliyyat" }
issue:
  ar: "كيف يُتعامل مع ما يُروى في التفسير والقصص عن أهل الكتاب؟"
summary:
  ar: "ما يُنقل في التفسير والقصص عن أهل الكتاب من اليهود والنصارى. يذكر محمد رشيد رضا في مقدمة تفسيره أن أكثر المأثور في التفسير سرى إليه من هذا الباب، وينقل عن ابن تيمية وأحمد بن حنبل قواعد في قبولها وردها والوقوف عنها."
  en: "Reports drawn from the People of the Book, Jews and Christians, that entered tafsir and the stories of the prophets. Rashid Rida, in his introduction to the tafsir, says much of the transmitted tafsir came by this route, and reports rules on accepting, rejecting or suspending judgement on them from Ibn Taymiyya and Ahmad ibn Hanbal."
