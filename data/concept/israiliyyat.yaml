perspectives:
  - tradition: sunni
    id: ibn-taymiyya-three-cases
    stance:
      ar: "قبول ما صح، ورد ما خالف، والوقف عما لا يُعرف صحيحه من ضعيفه"
    summary:
      ar: "ينقل رضا عن ابن تيمية أن الخلاف في التفسير ينقسم إلى ما مستنده النقل وما يُعلم بغيره، وأن ما لا يمكن تمييز صحيحه من ضعيفه أكثره لا فائدة فيه. ويقول إن ما نُقل عن كتب الأنبياء، ولا يُعرف أصله، يُوقف عن تصديقه وتكذيبه، لاحتمال أن يكون محرَّفاً أو محفوظاً."
    holders: []
