    sources: [source/tafsir-manar-v01]
  - tradition: sunni
    id: ahmad-three-without-basis
    stance:
      ar: "ثلاثة لا أصل لها: التفسير والملاحم والمغازي، بحسب ما ينقله رضا"
    summary:
      ar: "ينقل رضا قول الإمام أحمد: إن التفسير والملاحم والمغازي ليس لها أصل، ويفسّر ذلك بأن الغالب عليها المراسيل، ولا يعني أنه لا يصح فيها شيء. ويرى رضا أن كلام ابن تيمية لا ينقض قول أحمد، لأن أكثرها لا يصح له سند متصل."
    holders: []
    evidence:
      - ref: source/tafsir-manar-v01
        note:
          ar: "ص 13-15"
    sources: [source/tafsir-manar-v01]
  - tradition: other
    id: rida-veil-on-tafsir
    stance:
      ar: "رأي رشيد رضا: أكثر المأثور في التفسير حجاب على القرآن"
    summary:
      ar: "يعدّ رضا هذا الكم من الروايات، الذي لا قيمة له سنداً ولا موضوعاً، شاغلاً عن مقاصد القرآن، ويدعو إلى أن تُجمع الروايات المفيدة في كتب مستقلة وتُعزى إلى مخرجيها، وأن يُذكر في التفسير ما يصح منها. هذا رأيه هو، ويقدَّم هنا بوصفه كذلك."
