label:
  ar: "حقوق الإنسان — ملف الانتهاكات في العالم العربي"
  en: "Human rights — the violations file in the Arab world"
  es: "Derechos humanos: el archivo de violaciones en el mundo árabe"
  fr: "Droits de l'homme — le bilan des violations dans le monde arabe"
  ur: "انسانی حقوق - عرب دنیا میں خلاف ورزیاں درج ہیں۔"
issue:
  ar: "ما حجم انتهاكات حقوق الإنسان في العالم العربي، وهل تنفع المواثيق الدولية، وهل يحلّها التدخل الخارجي أم الإصلاح الداخلي؟"
summary:
  ar: "حلقة «الوسطية» عن ملف حقوق الإنسان في العالم العربي. صوّت الشباب: 69% يرون المواثيق الدولية بلا قيمة عملياً و19% فائدتها محدودة؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:07:00} و72% يرون وضع الإنسان العربي أسوأ من غيره و10% لا فرق؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:36:30} و9% فقط يؤيدون التدخل الدولي و65% يرون حلّ المشكلة داخلياً. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:57:00} وناقش المتحاورون أسباباً كثقافة الاستبداد والإعلام الذي لا يعلّم الحقوق — 14 من أكثر 20 برنامجاً مشاهدةً مسلسلات — ورأوا البدء بالحقوق غير السياسية لتفادي الاصطدام {cite:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:31:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:33:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:30:00}."
  en: "The 'Al-Wasatiyya' episode on the human-rights file in the Arab world. The youth voted: 69% judged international covenants practically worthless and 19% of limited use; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:07:00} 72% judged the Arab person's situation worse than others' and 10% saw no difference; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:36:30} and only 9% endorsed international intervention while 65% saw the solution as internal. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:57:00} Panelists discussed causes — the culture of despotism and media that does not teach rights (14 of the top-20 watched programmes are serial dramas) — and advised starting with non-political rights to avoid collision {cite:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:31:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:33:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:30:00}."
  es: "El episodio de 'Al-Wasatiyya' sobre el tema de los derechos humanos en el mundo árabe. Los jóvenes votaron: el 69% consideró que los pactos internacionales eran prácticamente inútiles y el 19% de utilidad limitada; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:07:00} el 72% consideró que la situación de la persona árabe era peor que la de otras y el 10% no vio diferencia; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:36:30} y solo el 9% apoyó la intervención internacional, mientras que el 65% vio la solución como interna. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:57:00} Los panelistas discutieron las causas: la cultura del despotismo y los medios de comunicación que no enseñan los derechos (14 de los 20 programas más vistos son series dramáticas) - y recomendaron comenzar con los derechos no políticos para evitar colisiones {cite:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:31:30} {cita:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:33:00} {cita:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:30:00}."
  fr: "L'épisode d'« Al-Wasatiyya » consacré aux droits de l'homme dans le monde arabe. Le vote des jeunes: 69 % estiment que les conventions internationales sont pratiquement inutiles et 19 % qu'elles ont une utilité limitée; 72 % jugent la situation des Arabes pire que celle des autres et 10 % ne voient aucune différence; seulement 9 % approuvent une intervention internationale, tandis que 65 % considèrent que la solution réside dans des enjeux internes. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:57:00} Les panélistes ont discuté des causes — la culture du despotisme et des médias qui n'enseignent pas les droits (14 des 20 programmes les plus regardés sont des feuilletons) — et ont conseillé de commencer par les droits non politiques pour éviter les collisions {cite:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:31:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:33:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:30:00}."
  ur: "عرب دنیا میں انسانی حقوق کی فائل پر 'الوصطیہ' قسط۔ نوجوانوں نے ووٹ دیا: 69% نے بین الاقوامی معاہدوں کو عملی طور پر بیکار قرار دیا اور 19% محدود استعمال؛ {حوالہ: assabile-tareq-al-suwaidan al-wasitiya/ep10 00:07:00} 72% نے عرب شخص کی صورتحال کو دوسروں سے بدتر قرار دیا اور 10% نے کوئی فرق نہیں دیکھا۔ {حوالہ:اسابیل-طارق-السویدان الوسیطیہ/ep10 00:36:30} اور صرف 9% نے بین الاقوامی مداخلت کی توثیق کی جبکہ 65% نے اس حل کو اندرونی طور پر دیکھا۔ {حوالہ:assabile-tareq-al-suwaidan al-wasitiya/ep10 00:57:00} پینلسٹس نے اسباب پر تبادلہ خیال کیا — استبداد اور میڈیا کا کلچر جو حقوق نہیں سکھاتا ⁦(سب سے زیادہ دیکھے جانے والے 20 پروگراموں میں سے 14 سیریل ڈرامے ہیں)⁩ — اور غیر سیاسی حقوق سے شروع ہونے کا مشورہ دیا۔ al-wasitiya/ep10 00:31:30} {حوالہ:اصابیل-طارق-السویدان الوسیطیہ/ep10 00:33:00} {حوالہ:اسابیل-طارق-السویدان الوسیطیہ/ایپ10 00:30:00}۔"
