label:
  ar: "حقوق الإنسان — ملف الانتهاكات في العالم العربي"
  en: "Human rights — the violations file in the Arab world"
issue:
  ar: "ما حجم انتهاكات حقوق الإنسان في العالم العربي، وهل تنفع المواثيق الدولية، وهل يحلّها التدخل الخارجي أم الإصلاح الداخلي؟"
summary:
  ar: "حلقة «الوسطية» عن ملف حقوق الإنسان في العالم العربي. صوّت الشباب: 69% يرون المواثيق الدولية بلا قيمة عملياً و19% فائدتها محدودة؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:07:00} و72% يرون وضع الإنسان العربي أسوأ من غيره و10% لا فرق؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:36:30} و9% فقط يؤيدون التدخل الدولي و65% يرون حلّ المشكلة داخلياً. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:57:00} وناقش المتحاورون أسباباً كثقافة الاستبداد والإعلام الذي لا يعلّم الحقوق — 14 من أكثر 20 برنامجاً مشاهدةً مسلسلات — ورأوا البدء بالحقوق غير السياسية لتفادي الاصطدام {cite:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:31:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:33:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:30:00}."
  en: "The 'Al-Wasatiyya' episode on the human-rights file in the Arab world. The youth voted: 69% judged international covenants practically worthless and 19% of limited use; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:07:00} 72% judged the Arab person's situation worse than others' and 10% saw no difference; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:36:30} and only 9% endorsed international intervention while 65% saw the solution as internal. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:57:00} Panelists discussed causes — the culture of despotism and media that does not teach rights (14 of the top-20 watched programmes are serial dramas) — and advised starting with non-political rights to avoid collision {cite:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:31:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:33:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep10 00:30:00}."
