"label":
  "ar": "علامات السل"
  "en": "The signs of consumption"
  "ur": "سل کی علامات"
"summary":
  "ar": "هي أن يظهر نفث مدة بعلامة المدة على ما شرحناه من صورتها في اللون والرائحة\
    \ وغير ذلك وحمى دقية لازمة لمجاورة القلب موضع العلة تشتد مع الغذاء وعند الليل\
    \ على الجهة التي تشتد معها حمى الدق لترطيب البدن من الغذاء على ما نذكره في موضعه،\
    \ على أنه ربما تركب مع الدق فيها حميات أخرى نائبة أو ربع أو خمس وشرها الخمس ثم\
    \ شطر الغب ثم النائبة، وإذا حدث السل ظهرت أيضاً الدلائل التي عددناها في آخر باب\
    \ التقيح وفاض العرق منهم كل وقت لأن قوتهم تضعف عن إمساك الغذاء وتدبيره والحرارة\
    \ تحلل وتسيل، فإن انتفث خشكريشة لم يبق شبهة ولا سيما إذا كانت الأسباب المتأدية\
    \ إلى السل المذكور قد سلفت، وإذا أخذ البدن في الذبول والأطراف في الانحناء والشعر\
    \ في الانتثار لعدم الغذاء وفساد الفضول فقد صح، وقد يكمد اللون في الابتداء من السل\
    \ لكنه يحمر عند تصعد البخارات ويتمدد العنق والجبين وخصوصاً إذا استقر وتنتفخ أطرافهم\
    \ وخصوصاً أرجلهم في آخر الأيام وتتربل لفساد الأخلاط وموت الغريزة في الأقاصي من\
    \ البدن لرداءة المزاج، والذين سبب سلهم خلط أكال فيقذفون بزاقاً في طعم ماء البحر\
    \ مالحاً جداً، وقد يكون النبض منهم ثابتاً معتدل السرعة صغيراً وقد يعرض له ميلان\
    \ إلى الجانبين، ثم بعد ذلك يحصل في البطن قراقر وتنحني الشراسيف إلى فوق ويشتد العطش\
    \ وتبطل الشهوة للعظام لضعف القوى الطبيعية، وربما اختلف بطنه لسقوط القوة وربما\
    \ نفث خلطاً وأجرام العروق وذلك عند قرب الموت والمنفوث من العروق إن كان كباراً\
    \ فهو من الرئة وإن كان صغاراً فهو من القصبة وكثيراً ما ينفثون جصاً ولن يقذفوا\
    \ حلقاً من القصبة إلا بعد قرحة عظيمة، وفي آخره يغلظ النفث والبصاق ثم ينقطع لضعف\
    \ القوة فربما ماتوا اختناقاً وربما لم يتأخر مثل هذا النفث بل وقع في الابتداء إذا\
    \ كان السل من الجنس الرديء الكائن من مواد غليظة لا ينهضم، وإذا انقطع النفث في\
    \ آخر السل فربما لم يزيدوا على أربعة أيام وربما كان انقطاع النفث بسبب ضعف القوة\
    \ وحينئذ ربما ضاق النفس بهم إلى أن يصير كغير المحسوس، وكثيراً ما يشتد بهم السعال\
    \ ويؤدي إلى نفث الدم المتتابع فإن عولج سعالهم بالموانع للنفث هلكوا مع خفة يصيبونها\
    \ وإن تركوا يسعلون ماتوا نزفاً الموت السريع، ومن كان به سل فظهر على كفيه حب كأنه\
    \ الباقلى بعد اثنين وخمسين يوماً {cite:canon-ibn-sina-print-v2 p.357}"
  "en": "Its signs: the expectoration of matter appears, with the mark of matter as\
    \ we have described its form in colour, smell and otherwise; and an inherent hectical\
    \ fever, from the heart's neighbourhood to the seat of the disease, which strengthens\
    \ with feeding and at night in the way the hectic fever strengthens, for the body's\
    \ moistening from the food, as we shall state in its place — though other fevers\
    \ may combine with the hectic: tertian, quartan or quintan, and the worst of them\
    \ the quintan, then the semi-quotidian, then the tertian. When consumption supervenes,\
    \ the tokens we numbered at the end of the suppuration chapter also appear, and\
    \ sweat pours from them at all times, for their power is too weak to hold and\
    \ manage the nourishment, and the heat dissolves and flows; if a scaly bran-like\
    \ matter is expectorated, no doubt remains, especially when the stated causes\
    \ leading to consumption have gone before. When the body begins to wilt, the extremities\
    \ to bend, the hair to scatter — for lack of nourishment and the corruption of\
    \ the superfluities — it is confirmed. The colour may go leaden at the consumption's\
    \ beginning but reddens as the vapours mount; the neck and forehead stretch, especially\
    \ once it is settled; their extremities swell, especially the legs in the last\
    \ days, and turn watery for the corruption of the humours and the dying of the\
    \ innate heat in the far parts of the body from the badness of the temperament.\
    \ Those whose consumption's cause is a corrosive humour vomit a spittle with the\
    \ taste of sea water, very salty. The pulse may be steady, of moderate speed and\
    \ small, and a swaying to both sides may befall it; then a borborygmus arises\
    \ in the belly, the hypochondria bend upward, thirst strengthens, and the appetite\
    \ fails to the bones for the weakness of the natural powers; the belly may vary\
    \ for the fall of the power; and he may expectorate humour and vessel bodies —\
    \ this near death: what is spat of the vessels, if large, is from the lung; if\
    \ small, from the windpipe; and they often spit gypsum, and cast rings of the\
    \ windpipe only after a great ulcer. At its end the expectoration and spittle\
    \ thicken, then cease for the power's weakness — and they may die by choking;\
    \ such expectoration may not be late but occur at the start when the consumption\
    \ is of the bad kind arising from thick matters that are not digested. When the\
    \ expectoration ceases at the consumption's end they may not outlast four days;\
    \ the ceasing may be from the power's weakness, the breath narrowing until it\
    \ becomes almost insensible. Their cough often strengthens and leads to a successive\
    \ spitting of blood: if their cough is treated with the preventers of expectoration\
    \ they perish amid a relief that befalls them, and if they are left coughing they\
    \ die of bleeding, a swift death. And whoever has consumption and a grain like\
    \ beans appears on his palms — it comes after fifty-two days {cite:canon-ibn-sina-print-v2\
    \ p.357}"
  "ur": "اس کی علامات: مادہ کا نفث ظاہر ہوتا ہے مادہ کی پہچان کے ساتھ جس کی صورت رنگ\
    \ بو اور غیرہ میں ہم بیان کر چکے ہیں اور ایک لازم سوکھا حمى دل کے علت کی جگہ سے\
    \ قربت کی وجہ سے جو غذا اور رات میں بڑھتی ہے جیسے سوکھا حمى بڑھتی ہے جسم کے غذا\
    \ سے تر ہونے کی وجہ سے جیسا ہم اپنے مقام پر کہیں گے مگر اس کے ساتھ دوسری حمایاں\
    \ بھی جڑ سکتی ہیں تیسرے چوتھے یا پانچویں دن کی اور سب سے بری پانچویں پھر آدھی\
    \ روزانہ پھر تیسرے دن والی۔ جب سل ظاہر ہو تو تقيح کے باب کے آخر میں گنوائی گئی\
    \ دلیلیں بھی آتی ہیں اور ہر وقت پسینہ بہتا ہے کیونکہ قوت غذا سنبھالنے سے عاجز\
    \ ہے اور حرارت تحلیل کر کے بہاتی ہے اور اگر خشکريشہ نفث ہو تو کوئی شک نہیں رہتا\
    \ خاص طور پر جب مذکور اسباب پہلے ہو چکے ہوں۔ جب جسم مرجھانے اور سرے جھکنے اور\
    \ بال بکھرنے لگیں غذا کے نہ ہونے اور فضولات کے فساد سے تو پکا ہو گیا۔ ابتداء میں\
    \ رنگ سیسہ سا ہو سکتا ہے مگر بھاپ چڑھنے پر سرخ ہوتا ہے اور گردن اور پیشانی تن\
    \ جاتی ہیں خاص طور پر جب مستقر ہو اور سرے سوجھتے ہیں خاص طور پر آخری دنوں میں\
    \ ٹانگیں اور اخلاط کے فساد اور مزاج کی برائی سے بدن کے دور دراز میں فطری حرارت\
    \ کے مرنے سے پانی بھر جاتے ہیں۔ جن کے سل کا سبب کورا خلط ہو وہ سمندری پانی جیسا\
    \ بہت نمکین تھوک قے کرتے ہیں۔ نبض مستحکم معتدل رفتار چھوٹی ہو سکتی ہے اور اس پر\
    \ دونوں جانب میلان ہو سکتا ہے پھر پیٹ میں قراقر ہوتا ہے شراسيف اوپر جھکتی ہیں\
    \ پیاس بڑھتی ہے اور قووت طبیعی کی کمزوری سے بھوک بالکل بند ہو جاتی ہے اور قوت\
    \ کے گرنے سے پیٹ کی حالت بگڑ سکتی ہے اور موت کے قریب وہ خلط اور رگوں کے ٹکڑے نفث\
    \ کر سکتا ہے اور نفث ہونے والی رگیں بڑی ہوں تو پھیپھڑے سے چھوٹی ہوں تو نالی سے\
    \ اور اکثر جص نفث کرتے ہیں اور نالی کے حلقے صرف بڑے زخم کے بعد قے کرتے ہیں اور\
    \ آخر میں نفث اور تھوک گاڑھا ہو کر قوت کی کمزوری سے بند ہو جاتا ہے تو دم گھٹنے\
    \ سے مر سکتے ہیں اور ایسا نفث دیر سے نہیں بلکہ ابتداء میں بھی ہو سکتا ہے جب سل\
    \ بری جنس کا ہو موٹے ناگوار مواد سے اور جب سل کے آخر میں نفث بند ہو جائے تو چار\
    \ دن سے زیادہ نہ جیئں اور بند ہونا قوت کی کمزوری سے ہو سکتا ہے جس پر سانس اتنی\
    \ تنگ ہو کہ محسوس نہ ہو اور اکثر کھانسی بڑھ کر مسلسل خون کے نفث تک پہنچتی ہے اگر\
    \ کھانسی کو نفث روکنے والی چیزوں سے علاج کیا جائے تو عارضی سکون کے ساتھ ہلاک ہوتے\
    \ ہیں اور اگر کھانستے چھوڑا جائے تو خون بہنے سے جلد مرتے ہیں اور جسے سل ہو اور\
    \ اس کی ہتھیلیوں پر باقلا جیسا دانہ نکلے تو وہ باون دن کے بعد آتا ہے {cite:canon-ibn-sina-print-v2\
    \ p.357}"
