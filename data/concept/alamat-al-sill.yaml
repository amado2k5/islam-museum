"summary":
  "ar": "هي أن يظهر نفث مدة بعلامة المدة على ما شرحناه من صورتها في اللون والرائحة\
    \ وغير ذلك وحمى دقية لازمة لمجاورة القلب موضع العلة تشتد مع الغذاء وعند الليل\
    \ على الجهة التي تشتد معها حمى الدق لترطيب البدن من الغذاء على ما نذكره في موضعه،\
    \ على أنه ربما تركب مع الدق فيها حميات أخرى نائبة أو ربع أو خمس وشرها الخمس ثم\
    \ شطر الغب ثم النائبة، وإذا حدث السل ظهرت أيضاً الدلائل التي عددناها في آخر باب\
    \ التقيح وفاض العرق منهم كل وقت لأن قوتهم تضعف عن إمساك الغذاء وتدبيره والحرارة\
    \ تحلل وتسيل، فإن انتفث خشكريشة لم يبق شبهة ولا سيما إذا كانت الأسباب المتأدية\
    \ إلى السل المذكور قد سلفت، وإذا أخذ البدن في الذبول والأطراف في الانحناء والشعر\
    \ في الانتثار لعدم الغذاء وفساد الفضول فقد صح، وقد يكمد اللون في الابتداء من السل\
    \ لكنه يحمر عند تصعد البخارات ويتمدد العنق والجبين وخصوصاً إذا استقر وتنتفخ أطرافهم\
    \ وخصوصاً أرجلهم في آخر الأيام وتتربل لفساد الأخلاط وموت الغريزة في الأقاصي من\
    \ البدن لرداءة المزاج، والذين سبب سلهم خلط أكال فيقذفون بزاقاً في طعم ماء البحر\
    \ مالحاً جداً، وقد يكون النبض منهم ثابتاً معتدل السرعة صغيراً وقد يعرض له ميلان\
    \ إلى الجانبين، ثم بعد ذلك يحصل في البطن قراقر وتنحني الشراسيف إلى فوق ويشتد العطش\
    \ وتبطل الشهوة للعظام لضعف القوى الطبيعية، وربما اختلف بطنه لسقوط القوة وربما\
    \ نفث خلطاً وأجرام العروق وذلك عند قرب الموت والمنفوث من العروق إن كان كباراً\
    \ فهو من الرئة وإن كان صغاراً فهو من القصبة وكثيراً ما ينفثون جصاً ولن يقذفوا\
    \ حلقاً من القصبة إلا بعد قرحة عظيمة، وفي آخره يغلظ النفث والبصاق ثم ينقطع لضعف\
    \ القوة فربما ماتوا اختناقاً وربما لم يتأخر مثل هذا النفث بل وقع في الابتداء إذا\
    \ كان السل من الجنس الرديء الكائن من مواد غليظة لا ينهضم، وإذا انقطع النفث في\
    \ آخر السل فربما لم يزيدوا على أربعة أيام وربما كان انقطاع النفث بسبب ضعف القوة\
    \ وحينئذ ربما ضاق النفس بهم إلى أن يصير كغير المحسوس، وكثيراً ما يشتد بهم السعال\
    \ ويؤدي إلى نفث الدم المتتابع فإن عولج سعالهم بالموانع للنفث هلكوا مع خفة يصيبونها\
    \ وإن تركوا يسعلون ماتوا نزفاً الموت السريع، ومن كان به سل فظهر على كفيه حب كأنه\
    \ الباقلى بعد اثنين وخمسين يوماً {cite:canon-ibn-sina-print-v2 p.357}"
  "en": "Its signs: the expectoration of matter appears, with the mark of matter as\
    \ we have described its form in colour, smell and otherwise; and an inherent hectical\
    \ fever, from the heart's neighbourhood to the seat of the disease, which strengthens\
    \ with feeding and at night in the way the hectic fever strengthens, for the body's\
    \ moistening from the food, as we shall state in its place — though other fevers\
    \ may combine with the hectic: tertian, quartan or quintan, and the worst of them\
    \ the quintan, then the semi-quotidian, then the tertian. When consumption supervenes,\
    \ the tokens we numbered at the end of the suppuration chapter also appear, and\
    \ sweat pours from them at all times, for their power is too weak to hold and\
    \ manage the nourishment, and the heat dissolves and flows; if a scaly bran-like\
    \ matter is expectorated, no doubt remains, especially when the stated causes\
    \ leading to consumption have gone before. When the body begins to wilt, the extremities\
    \ to bend, the hair to scatter — for lack of nourishment and the corruption of\
    \ the superfluities — it is confirmed. The colour may go leaden at the consumption's\
    \ beginning but reddens as the vapours mount; the neck and forehead stretch, especially\
    \ once it is settled; their extremities swell, especially the legs in the last\
    \ days, and turn watery for the corruption of the humours and the dying of the\
    \ innate heat in the far parts of the body from the badness of the temperament.\
    \ Those whose consumption's cause is a corrosive humour vomit a spittle with the\
    \ taste of sea water, very salty. The pulse may be steady, of moderate speed and\
    \ small, and a swaying to both sides may befall it; then a borborygmus arises\
    \ in the belly, the hypochondria bend upward, thirst strengthens, and the appetite\
    \ fails to the bones for the weakness of the natural powers; the belly may vary\
    \ for the fall of the power; and he may expectorate humour and vessel bodies —\
    \ this near death: what is spat of the vessels, if large, is from the lung; if\
    \ small, from the windpipe; and they often spit gypsum, and cast rings of the\
    \ windpipe only after a great ulcer. At its end the expectoration and spittle\
    \ thicken, then cease for the power's weakness — and they may die by choking;\
    \ such expectoration may not be late but occur at the start when the consumption\
    \ is of the bad kind arising from thick matters that are not digested. When the\
    \ expectoration ceases at the consumption's end they may not outlast four days;\
    \ the ceasing may be from the power's weakness, the breath narrowing until it\
    \ becomes almost insensible. Their cough often strengthens and leads to a successive\
    \ spitting of blood: if their cough is treated with the preventers of expectoration\
    \ they perish amid a relief that befalls them, and if they are left coughing they\
    \ die of bleeding, a swift death. And whoever has consumption and a grain like\
    \ beans appears on his palms — it comes after fifty-two days {cite:canon-ibn-sina-print-v2\
    \ p.357}"
  "fr": >-
    Parmi les signes de la consomption, Ibn Sina décrit l’expectoration d’une matière reconnaissable à sa
    couleur, à son odeur et aux autres caractères qu’il a exposés. Il décrit aussi une fièvre hectique
    persistante, due à la proximité du cœur et du siège du mal. Elle s’intensifie au repas et la nuit, comme
    le fait la fièvre hectique lorsque les aliments humidifient le corps, ainsi qu’il l’explique plus loin.
    D’autres fièvres peuvent s’y ajouter, tierce, quarte ou quinte ; la pire est la quinte, puis la
    semi-quotidienne, puis la tierce. Lorsque la consomption se déclare, les signes énumérés à la fin du
    chapitre sur la suppuration se manifestent aussi. La sueur coule à toute heure, car la faculté est trop
    faible pour retenir et régir les aliments, tandis que la chaleur dissout et fait couler. L’expectoration
    d’une matière squameuse pareille au son ne laisse plus de doute, surtout si les causes déjà mentionnées
    de la consomption ont précédé. Le mal se confirme quand le corps dépérit, que les extrémités se courbent
    et que les cheveux tombent, faute de nourriture et par altération des superfluités. Au début, le teint
    peut devenir plombé, mais il rougit à mesure que les vapeurs montent. Le cou et le front se tendent,
    surtout une fois le mal installé. Les extrémités enflent, surtout les jambes dans les derniers jours, et
    se gorgent d’eau : les humeurs s’altèrent et le mauvais tempérament éteint la chaleur innée aux confins
    du corps. Ceux dont la consomption a pour cause une humeur corrosive rejettent une salive très salée, au
    goût d’eau de mer. Le pouls peut être régulier, petit et d’une vitesse modérée, et présenter une
    oscillation de part et d’autre. Ensuite apparaissent des borborygmes dans le ventre ; les hypocondres se
    recourbent vers le haut, la soif augmente et l’appétit disparaît tout à fait, par faiblesse des facultés
    naturelles. L’état des intestins peut varier à mesure que la faculté décline. Le malade peut aussi
    expectorer de l’humeur et des fragments de vaisseaux à l’approche de la mort : les gros viennent du
    poumon, les petits de la trachée. Les malades crachent souvent du gypse, mais ne rejettent des anneaux de
    trachée qu’après une grande ulcération. À la fin, les crachats et la salive épaississent, puis leur rejet
    cesse par faiblesse de la faculté, et les malades peuvent mourir étouffés. Cette expectoration n’est pas
    toujours tardive : elle se produit parfois au début dans la mauvaise forme de consomption, issue de
    matières épaisses qui ne se digèrent pas. Lorsque l’expectoration cesse à la fin de la consomption, les
    malades peuvent ne pas survivre au-delà de quatre jours. Cette cessation peut tenir à la faiblesse de la
    faculté ; la respiration se resserre alors jusqu’à devenir presque imperceptible. Souvent, la toux
    s’intensifie et provoque des crachements de sang répétés. Si elle est traitée par ce qui empêche
    l’expectoration, ils périssent malgré le soulagement éprouvé ; si on les laisse tousser, ils meurent
    rapidement d’hémorragie. Chez un malade atteint de consomption, si des grains semblables à des fèves
    apparaissent sur les paumes, c’est après cinquante-deux jours {cite:canon-ibn-sina-print-v2 p.357}.
  "ur": "اس کی علامات: مادہ کا نفث ظاہر ہوتا ہے مادہ کی پہچان کے ساتھ جس کی صورت رنگ\
    \ بو اور غیرہ میں ہم بیان کر چکے ہیں اور ایک لازم سوکھا حمى دل کے علت کی جگہ سے\
    \ قربت کی وجہ سے جو غذا اور رات میں بڑھتی ہے جیسے سوکھا حمى بڑھتی ہے جسم کے غذا\
    \ سے تر ہونے کی وجہ سے جیسا ہم اپنے مقام پر کہیں گے مگر اس کے ساتھ دوسری حمایاں\
    \ بھی جڑ سکتی ہیں تیسرے چوتھے یا پانچویں دن کی اور سب سے بری پانچویں پھر آدھی\
    \ روزانہ پھر تیسرے دن والی۔ جب سل ظاہر ہو تو تقيح کے باب کے آخر میں گنوائی گئی\
    \ دلیلیں بھی آتی ہیں اور ہر وقت پسینہ بہتا ہے کیونکہ قوت غذا سنبھالنے سے عاجز\
    \ ہے اور حرارت تحلیل کر کے بہاتی ہے اور اگر خشکريشہ نفث ہو تو کوئی شک نہیں رہتا\
    \ خاص طور پر جب مذکور اسباب پہلے ہو چکے ہوں۔ جب جسم مرجھانے اور سرے جھکنے اور\
    \ بال بکھرنے لگیں غذا کے نہ ہونے اور فضولات کے فساد سے تو پکا ہو گیا۔ ابتداء میں\
    \ رنگ سیسہ سا ہو سکتا ہے مگر بھاپ چڑھنے پر سرخ ہوتا ہے اور گردن اور پیشانی تن\
    \ جاتی ہیں خاص طور پر جب مستقر ہو اور سرے سوجھتے ہیں خاص طور پر آخری دنوں میں\
    \ ٹانگیں اور اخلاط کے فساد اور مزاج کی برائی سے بدن کے دور دراز میں فطری حرارت\
    \ کے مرنے سے پانی بھر جاتے ہیں۔ جن کے سل کا سبب کورا خلط ہو وہ سمندری پانی جیسا\
    \ بہت نمکین تھوک قے کرتے ہیں۔ نبض مستحکم معتدل رفتار چھوٹی ہو سکتی ہے اور اس پر\
    \ دونوں جانب میلان ہو سکتا ہے پھر پیٹ میں قراقر ہوتا ہے شراسيف اوپر جھکتی ہیں\
    \ پیاس بڑھتی ہے اور قووت طبیعی کی کمزوری سے بھوک بالکل بند ہو جاتی ہے اور قوت\
    \ کے گرنے سے پیٹ کی حالت بگڑ سکتی ہے اور موت کے قریب وہ خلط اور رگوں کے ٹکڑے نفث\
    \ کر سکتا ہے اور نفث ہونے والی رگیں بڑی ہوں تو پھیپھڑے سے چھوٹی ہوں تو نالی سے\
    \ اور اکثر جص نفث کرتے ہیں اور نالی کے حلقے صرف بڑے زخم کے بعد قے کرتے ہیں اور\
    \ آخر میں نفث اور تھوک گاڑھا ہو کر قوت کی کمزوری سے بند ہو جاتا ہے تو دم گھٹنے\
    \ سے مر سکتے ہیں اور ایسا نفث دیر سے نہیں بلکہ ابتداء میں بھی ہو سکتا ہے جب سل\
    \ بری جنس کا ہو موٹے ناگوار مواد سے اور جب سل کے آخر میں نفث بند ہو جائے تو چار\
    \ دن سے زیادہ نہ جیئں اور بند ہونا قوت کی کمزوری سے ہو سکتا ہے جس پر سانس اتنی\
    \ تنگ ہو کہ محسوس نہ ہو اور اکثر کھانسی بڑھ کر مسلسل خون کے نفث تک پہنچتی ہے اگر\
    \ کھانسی کو نفث روکنے والی چیزوں سے علاج کیا جائے تو عارضی سکون کے ساتھ ہلاک ہوتے\
    \ ہیں اور اگر کھانستے چھوڑا جائے تو خون بہنے سے جلد مرتے ہیں اور جسے سل ہو اور\
    \ اس کی ہتھیلیوں پر باقلا جیسا دانہ نکلے تو وہ باون دن کے بعد آتا ہے {cite:canon-ibn-sina-print-v2\
    \ p.357}"
  "es": "Sus signos: aparece la expectoración de materia, con la marca de materia tal como hemos descrito su forma en color, olor y demás; y una fiebre héctica inherente, desde la proximidad del corazón hasta el foco de la enfermedad, que se fortalece con la alimentación y por la noche como se fortalece la fiebre héctica, por la humectación del cuerpo por los alimentos, como haremos en su lugar —aunque otras fiebres pueden combinarse con la héctica: terciana, cuartana o quintana, y la peor de ellas la quintana, luego la semidiaria, luego la terciana. Cuando sobreviene la tisis, también aparecen los signos que enumeramos al final del capítulo de la supuración, y el sudor brota de ellos en todo momento, porque su poder es demasiado débil para retener y gestionar el alimento, y el calor se disuelve y fluye; si se espera una materia escamosa parecida al salvado, no queda duda, especialmente cuando las causas indicadas que conducen a la tisis han pasado antes. Cuando el cuerpo comienza a marchitarse, las extremidades a doblarse, el cabello a esparcirse —por falta de nutrición y corrupción de las superfluidades— se confirma. El color puede volverse plomizo al comienzo de la tisis, pero se enrojece a medida que aumentan los vapores; el cuello y la frente se estiran, especialmente una vez que se establece; sus extremidades se hinchan, especialmente las piernas en los últimos días, y se vuelven acuosas por la corrupción de los humores y la muerte del calor innato en las partes distales del cuerpo por la mala naturaleza del temperamento. Aquellos cuya tisis es causada por un humor corrosivo vomitan una saliva con sabor a agua de mar, muy salada. El pulso puede ser constante, de velocidad moderada y pequeño, y puede ocurrirle un balanceo hacia ambos lados; luego surge un borborigmo en el vientre, los hipocondrios se inclinan hacia arriba, la sed se intensifica y el apetito falla hasta los huesos debido a la debilidad de las facultades naturales; el vientre puede variar debido a la caída de la fuerza; y puede expectorar humor y cuerpos vasculares —esto cerca de la muerte: lo que se escupe de los vasos, si es grande, proviene del pulmón; si es pequeño, de la tráquea; y a menudo escupen yeso, y forman anillos de la tráquea solo después de una úlcera grande. Al final, la expectoración y la saliva se espesan, luego cesan por la debilidad de las fuerzas —y pueden morir asfixiados; dicha expectoración puede no ser tardía sino ocurrir al principio cuando la tisis es de la clase grave que surge de sustancias espesas que no se digieren. Cuando la expectoración cesa al final de la tisis, pueden no sobrevivir más de cuatro días; el cese puede deberse a la debilidad de las fuerzas, la respiración se estrecha hasta volverse casi imperceptible. Su tos a menudo se fortalece y conduce a una posterior expectoración de sangre: si su tos se trata con los preventivos de la expectoración, perecen en medio de un alivio que les sobreviene, y si se les deja toser, mueren de sangrado, una muerte rápida. Y quien tenga tuberculosis y le aparezcan en las palmas de las manos granos semejantes a habas, esto sucederá después de cincuenta y dos días {cite:canon-ibn-sina-print-v2 p.357}"
  "tr": "Renk, koku ve diğer durumlar açısından açıkladığımız gibi, süre işaretiyle işaretlenen bir dönem ve hastalığın bulunduğu yerde kalp yakınında gerekli olan delici ateşi oluşur; bu ateş, yemekle ve gece şiddetlenerek vücudu yiyecekten nemlendirmek için şiddetlenir. Ancak, yerine geçen bir ateş, çeyrek veya beşinci ateş, ardından yarım ghab ve ardından vekil ateşi gibi başka ateşler de eşlik edebilir. Tüberküloz meydana gelirse, listelediğimiz kanıtlar Son bölüm ise püstüller konusudur ve yiyecekleri tutma ve yönetme güçleri zayıfladığında, ısı eriyip akar. Döküntü solunduğunda şüphe yoktur, özellikle de bahsedilen tüberkülozun nedenleri daha önce gerçekleşmişse. Vücut solmaya, uzuvlar bükülmeye ve tüylerin yiyecek eksikliği ve merak kaybı nedeniyle dağılmasına başlarsa, bu geçerlidir. Renk soluk olabilir, ancak buharlar yükseldiğinde ve boyun ile alın genişlediğinde, özellikle yerleşip uzuvları, özellikle bacakları şiştiğinde, kırmızıya döner. Son günlerde, humorların bozulması ve kötü mizaç nedeniyle vücudun en uzak bölgelerinde içgüdü ölümü nedeniyle zorlanırlar. Dikenleri yiyecek karışımına neden olan ve çok tuzlu deniz suyunun tadını veren kokarcalar tükürürler. Nabızları düzenli, orta hızda, küçük olabilir ve yanlara doğru eğilim gösterebilir. Bundan sonra karında gürleme olur, yanaklar yukarı doğru eğilir, susuzluk artar ve zayıf doğal güç nedeniyle kemiklere olan arzu sona erer. Belki de karınları güç kaybı nedeniyle değişir ve bazen ölüm yaklaşırken damarlardan ve bedenlerden fırlayarak dışarı çıkarlar ve itici Damarlar büyükse akciğerden; küçükse trakeadan gelir. Genellikle alçı verirler ve büyük bir ülserden sonra boğazı soluk borusundan dışarı atmazlar. Sonunda patlama ve tükürük kalınlaşır, ardından zayıf dayanıklılık nedeniyle kesintiye uğrar. Bazen boğulma nedeniyle ölürler ya da tüberküloz zayıf tipte, sindirimi mümkün olmayan kalın maddelerden oluşmuşsa bu üfleme gecikmeden başlar. Tüberkülozun sonunda blast durursa dört günü geçemez veya kesintiye uğrayabilir. Zayıf güçten dolayı üfleme yapar ve bu durumlarda bilinçsiz hale gelerek fark edilmeyebilir. Çoğu zaman öksürük şiddetlenir ve sürekli kan üflemeye yol açar. Öksürükleri kontrendikasyonlarla tedavi edilirse, acı çeken bir ışıkla ölürler. Öksürmeye bırakılırsa, ani ölümden ölürler. Tüberküloz olan kişinin avuçlarında elli iki gün sonra bakla gibi bir tane olur {atıf:kanon-ibn-sina-print-v2 s.357}"
  "id": "Seperti dijelaskan dalam hal warna, penciuman, dan kondisi lain, periode yang ditandai dengan tanda waktu dan demam menusuk di dekat jantung terjadi di lokasi penyakit; demam ini meningkat seiring makan dan malam hari untuk melembapkan tubuh dengan makanan. Namun, demam lain juga dapat menyertainya, seperti demam seperempat atau kelima, diikuti oleh setengah ghab, dan kemudian demam pengganti. Jika tuberkulosis terjadi, bagian terakhir dari bukti yang kami sebutkan adalah tentang pustula, dan ketika kemampuannya menahan dan mengelola makanan melemah, panas larut dan mengalir pergi. Tidak diragukan lagi saat ruam terhirup, terutama jika penyebab tuberkulosis yang disebutkan sudah pernah terjadi sebelumnya. Ini berlaku jika tubuh mulai memudar, anggota tubuh mulai terpelitir, dan bulu tersebar karena kurang makanan dan hilangnya rasa ingin tahu. Warnanya mungkin pucat, tetapi ketika uap naik dan leher serta dahi melebar, terutama saat mengendap dan anggota tubuh membengkak, terutama kaki, mereka berubah merah. Dalam beberapa hari terakhir, karena penurunan mood dan temperamen yang buruk, mereka terpaksa mati secara naluriah di bagian tubuh yang paling jauh. Mereka mengeluarkan lalat bau yang durinya menyebabkan campuran makanan dan mengeluarkan rasa air laut yang sangat asin. Denyut nadi mereka teratur, sedang, mungkin kecil, dan mungkin miring ke samping. Setelah itu, terjadi gemuruh di perut, pipi memiring, haus meningkat, dan karena kekuatan alami yang lemah, keinginan akan tulang berakhir. Mungkin perut mereka berubah karena kehilangan kekuatan, dan terkadang saat kematian mendekat, mereka keluar dari pembuluh darah dan tubuh, dan pembuluh yang menolak berasal dari paru-paru jika besar; jika kecil, dari trakea. Mereka biasanya mengeluarkan lemparan dan tidak mengeluarkan tenggorokan dari tenggorokan setelah tukak besar. Akhirnya, ledakan dan air liur menjadi lebih tebal, lalu terhenti karena daya tahan yang buruk. Kadang-kadang mereka meninggal karena sesak napas, atau jika selang lemah yang terdiri dari zat kental yang tidak dapat dicerna, tiupan ini dimulai tanpa penundaan. Jika ledakan berhenti pada akhir tuberkulosis, mungkin tidak berlangsung lebih dari empat hari atau terhenti. Karena kekuatan yang lemah, ledakan ditiup dan dalam kasus ini menjadi tidak sadar dan mungkin tidak terdeteksi. Paling sering, batuk memburuk dan menyebabkan aliran darah terus-menerus. Jika batuknya diatasi dengan kontraindikasi, mereka meninggal dengan cahaya yang menyakitkan. Jika dibiarkan batuk, mereka meninggal karena kematian mendadak. Seseorang dengan tuberkulosis memiliki satu di telapak tangannya lima puluh dua hari kemudian sebagai kacang fatal {sitasi: kanon-ibn-sina-print-v2 hlm.357}"
