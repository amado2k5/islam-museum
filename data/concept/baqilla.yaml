id: concept/baqilla
class: concept
kind: natural
label:
  ar: "باقلاء"
  en: "Baqilla (fava bean)"
  fr: "Baqilla (fève)"
  ur: "باقلاء ⁦(باقلا، سیم)⁩"
summary:
  ar: "معروف، ومنه مصري ونبطي وهندي، والنبطي أشدّ قبضاً، والمصري أرطب وأقلّ غذاء، وبطيء الهضم كثير النفخ، يُجلي قليلاً، والمطبوخ في قشره كثير النفخ، وينفع من قروح العضل، ويُضمَّد بالشراب على ورم الخصية، ومع النقرس شحم الخنزير، وصلاحه بإطالة النقع وإجادة الطبخ {cite:canon-ibn-sina-print-v1 p.411}، {cite:canon-ibn-sina-print-v1 p.412}."
  en: "Known, and there are Egyptian, Nabataean and Indian kinds. The Nabataean is the most astringent, the Egyptian moister and less nourishing; the bean is slow to digest and very bloating, lightly cleansing, and its boiled form in the husk bloats much. It helps cramp of the muscles and sores of the muscles, and with wine a poultice for a swollen testicle; with pig fat, boiled, it helps gout. It is improved by long soaking and good cooking {cite:canon-ibn-sina-print-v1 p.411}, {cite:canon-ibn-sina-print-v1 p.412}."
  fr: "Plante connue, avec des espèces égyptienne, nabatéenne et indienne. La nabatéenne est la plus astringente, l’égyptienne plus humide et moins nourrissante. La fève est lente à digérer, très flatulente, légèrement nettoyante ; bouillie dans son enveloppe, elle provoque beaucoup de ballonnements. Elle serait utile aux crampes et ulcères musculaires, en cataplasme avec du vin aux testicules enflés, et en décoction avec de la graisse de porc à la goutte. Un long trempage et une bonne cuisson l’améliorent {cite:canon-ibn-sina-print-v1 p.411}, {cite:canon-ibn-sina-print-v1 p.412}."
  ur: "ایک معروف پھلی، جس کی مصری، نبطی اور ہندی قسمیں ہیں۔ نبطی سب سے زیادہ قابض، مصری تر اور کم غذائیت والی؛ یہ ہضم میں سست اور بہت پھولانے والی ہے، ہلکا سا صاف کرتی ہے، اور چھلکے سمیت پکائی ہوئی بہت پھولاتی ہے۔ یہ پٹھوں کی اینٹھن اور پٹھوں کے زخموں میں مفید، شراب کے ساتھ خصیے کے ورم پر پوٹس، اور سور کی چربی کے ساتھ گٹھیا میں۔ لمبے بھگونے اور اچھے پکانے سے بہتر ہوتی ہے {cite:canon-ibn-sina-print-v1 p.411}، {cite:canon-ibn-sina-print-v1 p.412}۔"
