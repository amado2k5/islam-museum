id: concept/shijaj-head-wounds
class: concept
kind: legal
label:
  ar: "الشِّجاج"
  en: "Shijaj (wounds to the face and head, and their penalties)"
summary:
  ar: "الشجاج جمع شجة، وهي الجراحة في الوجه أو الرأس خاصة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9916} وعدها جمهور الفقهاء عشرة أو أحد عشر نوعا: الحارصة والدامعة والدامية والباضعة والمتلاحمة والسمحاق والموضحة والهاشمة والمنقلة والآمة والدامغة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9918} وما قبل الموضحة لا أرش مقدر فيه ففيه حكومة عدل، والموضحة وما بعدها فيها أرش مقدر، ففي الموضحة خمس من الإبل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9919} والقصاص يجب في الموضحة عمدا باتفاق الفقهاء، ولا يجب فيما فوقها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9919} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9920} ولا يحكم بالقصاص أو الدية في الشجاج إلا بعد البرء عند جمهور الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9921} وإذا برئت الشجة على غير شين فلها أحكام مختلفة بين الحنفية والمالكية والحنابلة والشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9923}"
  en: "Shijaj is the plural of shajja, a wound to the face or the head only. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9916} Most jurists count ten or eleven kinds: the scratch, the weeping, the bleeding, the incision, the flesh-tearing, the simhaq, the mudiha (which exposes the bone), the hashima (which breaks it), the munaqqila (which displaces the pieces), the ama (which reaches the lining of the brain) and the damigha (which pierces it). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9918} Below the mudiha there is no fixed arsh, so a just assessment is owed; from the mudiha upward a fixed arsh applies, five camels for the mudiha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9919} Retaliation for a deliberate wound is due for the mudiha by agreement, and not for those above it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9919} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9920} Most jurists hold that retaliation or compensation for a wound is ordered only after it heals. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9921} The rules differ by school when a wound heals without a mark. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9923}"
