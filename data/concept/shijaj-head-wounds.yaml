id: concept/shijaj-head-wounds
class: concept
kind: legal
label:
  ar: "الشِّجاج"
  en: "Shijaj (wounds to the face and head, and their penalties)"
  es: "Shijaj (heridas en la cara y la cabeza, y sus castigos)"
  fr: "Shijaj (blessures au visage et à la tête, et leurs sanctions)"
  ur: "شجاج ⁦(چہرے اور سر کے زخم اور ان کی سزائیں)⁩"
  tr: "Cam"
  id: "Kaca"
summary:
  ar: "الشجاج جمع شجة، وهي الجراحة في الوجه أو الرأس خاصة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9916} وعدها جمهور الفقهاء عشرة أو أحد عشر نوعا: الحارصة والدامعة والدامية والباضعة والمتلاحمة والسمحاق والموضحة والهاشمة والمنقلة والآمة والدامغة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9918} وما قبل الموضحة لا أرش مقدر فيه ففيه حكومة عدل، والموضحة وما بعدها فيها أرش مقدر، ففي الموضحة خمس من الإبل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9919} والقصاص يجب في الموضحة عمدا باتفاق الفقهاء، ولا يجب فيما فوقها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9919} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9920} ولا يحكم بالقصاص أو الدية في الشجاج إلا بعد البرء عند جمهور الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9921} وإذا برئت الشجة على غير شين فلها أحكام مختلفة بين الحنفية والمالكية والحنابلة والشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9923}"
  en: "Shijaj is the plural of shajja, a wound to the face or the head only. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9916} Most jurists count ten or eleven kinds: the scratch, the weeping, the bleeding, the incision, the flesh-tearing, the simhaq, the mudiha (which exposes the bone), the hashima (which breaks it), the munaqqila (which displaces the pieces), the ama (which reaches the lining of the brain) and the damigha (which pierces it). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9918} Below the mudiha there is no fixed arsh, so a just assessment is owed; from the mudiha upward a fixed arsh applies, five camels for the mudiha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9919} Retaliation for a deliberate wound is due for the mudiha by agreement, and not for those above it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9919} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9920} Most jurists hold that retaliation or compensation for a wound is ordered only after it heals. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9921} The rules differ by school when a wound heals without a mark. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9923}"
  es: "Shijaj es el plural de shajja, una herida en la cara o la cabeza solamente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9916} La mayoría de los juristas cuentan diez u once tipos: el rasguño, el lloro, el sangrado, la incisión, el desgarro de la carne, el simhaq, el mudiha (que expone el hueso), el hashima (que lo rompe), el munaqqila (que desplaza los pedazos), el ama (que llega al revestimiento del cerebro) y el damigha (que lo perfora). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9918} Debajo del mudiha no hay un arsh fijo, por lo que se debe una evaluación justa; Desde el mudiha hacia arriba se aplica un arsh fijo, cinco camellos para el mudiha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9919} La represalia por una herida deliberada es debida para el mudiha por acuerdo, y no para aquellos por encima de él. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9919} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9920} La mayoría de los juristas sostienen que la represalia o compensación por una herida se ordena solo después de que sana. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9921} Las reglas difieren según la escuela cuando una herida sana sin marca. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9922} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9923}"
  fr: "Shijaj est le pluriel de shajja, une blessure au visage ou à la tête uniquement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9916} La plupart des juristes en dénombrent dix ou onze types: l’égratignure, le larmoiement, le saignement, l’incision, le déchirement de la chair, le simhaq, le mudiha (qui expose l’os), le hashima (qui le brise), le munaqqila (qui déplace les fragments), l’ama (qui atteint la méninge) et le damigha (qui la perfore). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9918} En dessous du mudiha, il n’y a pas d’arsh fixe, donc une juste évaluation est due; À partir du mudiha, une compensation fixe est appliquée, soit cinq chameaux pour le mudiha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9919} La réparation d'une blessure intentionnelle est due au mudiha par accord mutuel, et non aux personnes de rang supérieur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9919} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9920} La plupart des juristes estiment que la réparation ou l'indemnisation d'une blessure n'est ordonnée qu'après sa guérison. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9921} Les règles varient selon les écoles lorsqu'une blessure guérit sans laisser de trace. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9923}"
  ur: "شجاج شجا کی جمع ہے، صرف چہرے یا سر پر زخم۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 9916} اکثر فقہاء نے دس یا گیارہ قسمیں شمار کی ہیں: خراش، رونا، خون بہنا، چیرا، گوشت پھاڑنا، سمحق، مدیحہ ⁦(جو ہڈی کو ظاہر کرتا ہے)⁩، حاشیقنا ⁦(ہڈی کو ظاہر کرتا ہے)⁩۔ ٹکڑوں کو بے گھر کرتا ہے)، اما ⁦(جو دماغ کے استر تک پہنچتا ہے)⁩ اور دمگھا ⁦(جو اسے چھیدتا ہے)⁩۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.9917} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9918} مدیحہ کے نیچے کوئی مقررہ عرش نہیں ہے، اس لیے جائز تشخیص واجب ہے۔ مدیحہ سے اوپر کی طرف ایک مقررہ عرش لاگو ہوتا ہے، مدیحہ کے لیے پانچ اونٹ۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 9919} جان بوجھ کر زخم کا بدلہ معاہد کے ذریعہ مدیحہ کے لئے واجب ہے، نہ کہ اس سے اوپر والوں کے لئے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9919} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9920} اکثر فقہاء کا خیال ہے کہ زخم کا بدلہ یا معاوضہ ٹھیک ہونے کے بعد ہی دیا جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9921} جب زخم بغیر نشان کے ٹھیک ہو جائے تو اسکول کے اصول مختلف ہوتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9922}"
  tr: "Al-shajaj, yüz veya özellikle baş ameliyatı olan 'shaja'nın çoğuludur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9916} Hukukçuların çoğu onu on veya on bir tür olarak sınıflandırmıştır: muhafız, gözyaşlı, kanlı, istilacı, birleşmiş, peritoneal, açıklanmış, hashimah, iletilen, 'ümmet' ve dammaghah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9918} Ve açıklamadan önce gelen şeyin sabit bir arsh yoktur, çünkü adil bir yönetim içerir ve açıklama ile sonrasında gelenler önceden belirlenmiş bir arsh içerir. Açıklamada beş deve vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.. 9919} ve intikam, hukukçuların kasıtlı olarak uzlaşmasıyla netleştirilen davalarda zorunludur, üstlerinde değil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9919} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9920} Qisas veya kan parası, çoğunluğun görüşüne göre ancak beraat sonrası uyuşmazlıklarda hüküm verilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9921} Eğer argüman hatasız olarak beraat ederse, Hanefiler, Malikiler, Hanbaliler ve Şafiiler arasında farklı kararlar vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9923}"
  id: "Al-shajaj adalah jamak dari 'shaja', yaitu operasi pada wajah atau terutama kepala. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9916} Mayoritas ahli hukum mengklasifikasikannya menjadi sepuluh atau sebelas jenis: penjaga, yang menangis, yang berdarah, yang invasif, yang tergabung, yang peritoneal, yang diklarifikasi, yang dijelaskan, yang ditransmisikan, 'ummah', dan dammaghah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9918} Dan apa yang mendahului penjelasan tersebut tidak memiliki arsh yang tetap, karena ia berisi pemerintahan yang adil, dan klarifikasi serta yang berikutnya memuat arsh yang telah ditentukan. Dalam klarifikasi tersebut, terdapat lima unta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.m.. 9919} dan pembalasan wajib dalam kasus yang sengaja dijelaskan oleh konsensus para ahli hukum, dan bukan dalam kasus di atasnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9919} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9920} Qisas atau uang darah tidak diputuskan dalam kasus sengketa kecuali setelah pembebasan menurut mayoritas ahli hukum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9921} Jika argumen dibebaskan tanpa kesalahan, maka terdapat putusan yang berbeda di antara Hanafi, Maliki, Hanbali, dan Shafi'i. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9923}"
