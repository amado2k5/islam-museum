label:
  ar: "علم البيان"
  en: "The science of bayan"
  ur: "علمِ بیان"
  fr: "La science du bayan"
  es: "La ciencia del bayan"
  tr: "retorik"
  id: "retorika"
summary:
  ar: "تعريف علم البيان عند السكاكي والقزويني وابن خلدون، وسبب انحصاره عند السكاكي في الدلالات العقلية، وأقسام التشبيه عنده، وأربعة أمثلة قرآنية عدّها ابن المعتز استعارات، الزخرف 4 والإسراء 24 ومريم 4 ويس 37، مع ما قاله القرطبي والبغوي وابن كثير عند الآيات."
  en: "The definition of bayan in al-Sakkaki, al-Qazwini and Ibn Khaldun, al-Sakkaki's reason for confining it to intellectual indications, his kinds of simile, and four Qur'anic examples that Ibn al-Mu'tazz counted as metaphors, al-Zukhruf 4, al-Isra' 24, Maryam 4 and Ya Sin 37, with what al-Qurtubi, al-Baghawi and Ibn Kathir say at the verses."
  ur: "بیان کی تعریف سکاکی، قزوینی اور ابن خلدون کے ہاں، سکاکی کی وہ وجہ کہ یہ علم عقلی دلالتوں تک کیوں محدود ہے، ان کی تشبیہ کی اقسام، اور چار قرآنی مثالیں جنہیں ابن المعتز نے استعارات شمار کیا، الزخرف 4، الاسراء 24، مریم 4 اور یس 37، ان آیات پر قرطبی، بغوی اور ابن کثیر کے کہے ہوئے کے ساتھ۔"
  fr: "La définition du bayan chez al-Sakkaki, al-Qazwini et Ibn Khaldun, la raison pour laquelle al-Sakkaki le limite aux indications intellectuelles, ses sortes de comparaison, et quatre exemples coraniques qu'Ibn al-Mu'tazz comptait comme des métaphores, al-Zukhruf 4, al-Isra' 24, Maryam 4 et Ya Sin 37, avec ce que disent al-Qurtubi, al-Baghawi et Ibn Kathir à ces versets."
  es: "La definición del bayan en al-Sakkaki, al-Qazwini e Ibn Jaldún, la razón por la que al-Sakkaki lo limita a las indicaciones intelectuales, sus clases de comparación, y cuatro ejemplos coránicos que Ibn al-Mu'tazz contaba como metáforas, al-Zukhruf 4, al-Isra' 24, Maryam 4 y Ya Sin 37, con lo que dicen al-Qurtubi, al-Baghawi e Ibn Kathir en esos versículos."
  tr: "El-Sakkaki, El-Kazwini ve İbn Haldun'a göre retoriğin tanımı, bunun mantıklı göstergelerde ve onun benzetme türlerinde El-Sakkaki ile sınırlı olmasının nedeni, ayrıca İbn Mu'taz'ın metafor olarak gördüğü dört Kur'an örneği: El-Zukhruf 4, El-İsra 24, Meryem 4 ve Veys 37; ayrıca El-Kurtubi, El-Bağavi ve İbn Ketir'in ayetler hakkında söyledikleri."
  id: "Definisi retorika menurut Al-Sakkaki, Al-Qazwini, dan Ibn Khaldun, serta alasan keterbatasan retorika pada Al-Sakkaki dalam indikasi rasional dan jenis simile menurut beliau, serta empat contoh Al-Qur'an yang dianggap Ibn Al-Mu'tazz sebagai metafora: Al-Zukhruf 4, Al-Isra 24, Maryam 4, dan Wais 37, beserta apa yang dikatakan Al-Qurtubi, Al-Baghawi, dan Ibn Kathir mengenai ayat-ayat tersebut."
