label: { ar: "الساعات المعتدلة والزمانية من قوس النهار في الزيج الصابي", en: "Equal and seasonal hours from the day arc", ur: "قوس النہار سے معتدل اور زمانی ساعات", es: "Horas iguales y estacionales del arco del día", fr: "Des heures égales et saisonnières à partir de l'arc du jour" }
summary:
  ar: "يعلّم البتاني أن ساعات النهار والليل المعتدلة تُعرف بقسمة قوس النهار أو قوس الليل على خمسة عشر، وأن الساعات الزمانية، وهي أبداً اثنتا عشرة ساعة للنهار ومثلها لليل، تُعرف بقسمة القوس على اثنتي عشرة، وأن زمن ساعة أحد القوسين ينقص من ثلاثين فيبقى زمن ساعة الآخر. وله طريقة ثالثة بسدس فضل اختلاف النهار، وطريقة بالجدول. {cite:zij-sabi-nallino-byblion pp.46-47}."
  en: "Al-Battani teaches that the equal hours of the day and night come from dividing the day arc or the night arc by fifteen, and that the seasonal hours, which are always twelve for the day and as many for the night, come from dividing the arc by twelve; the time of one arc's hour taken from thirty leaves the time of the other's hour. He gives a third way by a sixth of the excess of the difference of the day, and a way by the table. {cite:zij-sabi-nallino-byblion pp.46-47}."
  ur: "البتانی سکھاتے ہیں کہ دن اور رات کے معتدل گھنٹے قوس النہار یا قوس اللیل کو پندرہ پر تقسیم کرنے سے معلوم ہوتے ہیں، اور زمانی گھنٹے، جو دن کے ہمیشہ بارہ ہوتے ہیں اور رات کے بھی اتنے، قوس کو بارہ پر تقسیم کرنے سے؛ اور ایک قوس کے گھنٹے کا زمانہ تیس سے گھٹانے پر دوسری قوس کے گھنٹے کا زمانہ بچتا ہے۔ ان کا تیسرا طریقہ اختلاف النہار کے فضل کے چھٹے حصے سے ہے اور ایک طریقہ جدول سے۔ {cite:zij-sabi-nallino-byblion pp.46-47}۔"
  es: "Al-Battani enseña que la igualdad de horas del día y la noche se obtiene dividiendo el arco diurno o nocturno entre quince, y que las horas estacionales, que siempre son doce para el día y doce para la noche, se obtienen dividiendo el arco entre doce; la hora de un arco restada de treinta da como resultado la hora del otro. Ofrece una tercera forma mediante un sexto del exceso de la diferencia del día, y otra mediante la tabla. {cite:zij-sabi-nallino-byblion pp.46-47}."
  fr: "Al-Battani enseigne que l'égalité des heures du jour et de la nuit s'obtient en divisant l'arc diurne ou l'arc nocturne par quinze, et que les heures saisonnières, toujours au nombre de douze pour le jour et douze pour la nuit, s'obtiennent en divisant l'arc par douze; la durée d'une heure d'un arc soustraite de trente donne la durée de l'heure de l'autre. Il propose une troisième méthode, basée sur un sixième de l'excédent de la différence de durée du jour, et une autre, fondée sur le tableau. {cite:zij-sabi-nallino-byblion pp.46-47}."
