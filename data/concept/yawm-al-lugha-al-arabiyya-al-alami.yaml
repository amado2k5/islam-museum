label:
  ar: "اليوم العالمي للغة العربية"
  en: "World Arabic Language Day (18 December)"
  ur: "عربی زبان کا عالمی دن"
  fr: "Journée mondiale de la langue arabe (18 décembre)"
  es: "Día Mundial de la Lengua Árabe (18 de diciembre)"
summary:
  ar: "اليوم العالمي للغة العربية، ويُحتفل به في 18 ديسمبر من كل سنة منذ 2012، كما يلخص ملف بحث قُدّم للمتحف. قررت إدارة الاتصال العالمي في الأمم المتحدة سنة 2010 تخصيص يوم لكل لغة من لغاتها الرسمية الست دعماً لتعدد اللغات والتنوع الثقافي، واختير 18 ديسمبر لأن الجمعية العامة اعتمدت فيه سنة 1973 القرار 3190 الذي أدخل العربية لغة رسمية ولغة عمل."
  en: "World Arabic Language Day, observed each year on 18 December since 2012, as a research summary supplied to the museum gives it. In 2010 the United Nations department for global communications decided to dedicate a day to each of the six official languages to support multilingualism and cultural diversity, and 18 December was chosen because on that date in 1973 the General Assembly adopted Resolution 3190, which made Arabic an official and working language."
  ur: "عربی زبان کا عالمی دن، جو 2012ء سے ہر سال 18 دسمبر کو منایا جاتا ہے، جیسا کہ عجائب گھر کو فراہم کردہ تحقیقی خلاصہ دیتا ہے۔ 2010ء میں اقوام متحدہ کے محکمہ عالمی ابلاغ نے کثیر لسانیت اور ثقافتی تنوع کی حمایت کے لیے اپنی چھ سرکاری زبانوں میں سے ہر ایک کے لیے ایک دن مختص کرنے کا فیصلہ کیا، اور 18 دسمبر اس لیے چنا گیا کہ 1973ء میں اسی تاریخ کو جنرل اسمبلی نے قرارداد 3190 منظور کی جس نے عربی کو سرکاری اور کام کی زبان بنایا۔"
  fr: "La Journée mondiale de la langue arabe, célébrée chaque année le 18 décembre depuis 2012, comme le donne une note de recherche fournie au musée. En 2010, le département de la communication globale des Nations unies décida de consacrer un jour à chacune des six langues officielles pour soutenir le multilinguisme et la diversité culturelle, et le 18 décembre fut choisi parce que ce jour de 1973 l'Assemblée générale adopta la résolution 3190, qui fit de l'arabe une langue officielle et de travail."
  es: "El Día Mundial de la Lengua Árabe, que se celebra cada año el 18 de diciembre desde 2012, según un resumen de investigación entregado al museo. En 2010 el departamento de comunicación global de las Naciones Unidas decidió dedicar un día a cada uno de los seis idiomas oficiales para apoyar el multilingüismo y la diversidad cultural, y se eligió el 18 de diciembre porque en esa fecha de 1973 la Asamblea General aprobó la resolución 3190, que hizo del árabe un idioma oficial y de trabajo."
