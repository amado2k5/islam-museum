id: "concept/al-zafara"
class: "concept"
kind: "scientific"
label:
  ar: "الظفرة"
  en: "Pterygium (zafara)"
  fr: "Le ptérygion (zafara)"
  ur: "ظفرہ"
summary:
  ar: "الظفرة زيادة من الملتحمة أو من الحجاب المحيط بالعين تبتدئ في أكثر الأمر من الموق وتجري دائماً على الملتحمة وربما غشت القرنية ونفذت عليها حتى تغطي الثقبة، ومنها أصلب وألين وقد تكون صفراء أو حمراء أو كبدية اللون، ومنها ما مجاورته للملتحمة مجاورة ملتزق فينكشط بسرعة ومنها ما مجاورته مجاورة اتحاد فيحتاج إلى سلخ، وأفضل علاجه الكشط بالحديد خصوصاً للين والصلب يشال بالصنارات ⁦(صفة الكشط والسلخ منقولة كوصف الكتاب لا كعمل)⁩ {cite:canon-ibn-sina-print-v2 p.186}"
  en: "The pterygium is an increase of the conjunctiva or of the membrane surrounding the eye, mostly beginning at the canthus and always running over the conjunctiva; it may cover the cornea and pass over it till it covers the hole; some of it is harder, some softer, and it may be yellow, red or liver-coloured; some adjoin the conjunctiva with an adherent adjoining and are scraped quickly, some with a union adjoining needing stripping; its best treatment is scraping with iron, especially the soft, while the hard is lifted with hooks ⁦(the scraping and stripping carried as the book's description, not as procedure)⁩ {cite:canon-ibn-sina-print-v2 p.186}"
  fr: "Le ptérygion est un accroissement de la conjonctive ou de la membrane qui entoure l’œil, commençant le plus souvent au canthus et courant toujours sur la conjonctive ; il peut couvrir la cornée et passer sur elle jusqu’à couvrir l’orifice ; une partie en est plus dure, une partie plus molle, et il peut être jaune, rouge ou couleur de foie ; certains adhèrent à la conjonctive par une adhérence simple et se raclent vite, d’autres par une union qui exige le détachement ; son meilleur traitement est le raclage au fer, surtout pour le mou, tandis que le dur se soulève avec des crochets ⁦(le raclage et le détachement sont rapportés comme la description du livre, non comme une procédure)⁩ {cite:canon-ibn-sina-print-v2 p.186}"
  ur: "ظفرہ ملتحمہ یا آنکھ کے گرد غشاء کا بڑھا ہوا حصہ ہے جو اکثر مآق سے شروع ہوتا ہے اور ہمیشہ ملتحمہ پر دوڑتا ہے؛ اور قرنیہ کو ڈھانپ کر اس پر چڑھ سکتا ہے یہاں تک کہ سوراخ کو ڈھانپ لے؛ اس میں سے کچھ سخت اور کچھ نرم ہوتا ہے اور پیلا، سرخ یا جگری رنگ ہو سکتا ہے؛ کچھ کی ملتحمہ سے مجاورت چپکنے والی ہوتی ہے تو جلد کھرچا جاتا ہے اور کچھ کی مجاورت اتحاد والی ہوتی ہے تو سلخ چاہتا ہے؛ اس کا بہترین علاج لوہے سے کھرچنا ہے بالخصوص نرم کا، اور سخت کو صناروں سے اٹھایا جاتا ہے ⁦(کھرچنے اور سلخ کی صفت کتاب کی روایت کے طور پر، عمل کے طور پر نہیں)⁩ {cite:canon-ibn-sina-print-v2 p.186}"
