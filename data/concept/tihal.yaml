summary:
  ar: "طحال الخنازير أجود الأطحلة، وهو رديء الكيموس، فيه بعض القبض، ويولد دماً سوداوياً، وهو بطيء الهضم."
  en: "Pig spleen is the better choice, though its chyme is poor; it has some astringency, generates black blood, and is slow to digest."
  ur: "سور کا تلی بہتر انتخاب ہے، اگرچہ اس کا کیموس ناقص ہے؛ اس میں کچھ قبض ہے، یہ سیاہ خون پیدا کرتا ہے، اور ہضم میں سست ہے۔"
  es: "El bazo de cerdo es la mejor opción, aunque su quimo es pobre; tiene cierta astringencia, genera sangre negra y es de digestión lenta."
  fr: "La rate de porc est un meilleur choix, bien que son chyme soit de mauvaise qualité; elle est légèrement astringente, produit du sang noir et est lente à digérer."
  tr: "Domuzların dalağı, dalağın en ince kısmıdır, zayıf kimidir, biraz kasılma vardır, siyah kan üretir ve sindirimi yavaştır."
  id: "Limpa babi adalah yang paling halus di antara limpa, kima yang buruk, memiliki kontraksi, menghasilkan darah hitam, dan lambat dicerna."
