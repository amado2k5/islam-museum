  ar: "مدّ الله الظل ولو شاء لجعله ساكناً ثم جعل الشمس عليه دليلاً، وآوى إليه موسى في ظل الشجرة فقال رب إني لما أنزلت إليّ من خير فقير."
  en: "God spreads the shade — had He willed He would have made it still — then set the sun as its guide; Moses rested in the shade of the tree saying 'My Lord, I am in need of whatever good You send down to me.'"
  ur: "اللہ سایہ پھیلاتا ہے — اگر چاہتا تو اسے ٹھہرا رکھتا — پھر سورج کو اس کا رہنما بنایا؛ موسیٰ درخت کے سایے میں آرام کرتے ہوئے کہا 'اے رب جو بھی بھلائی تو مجھ پر نازل کرے میں اس کا محتاج ہوں۔'"
