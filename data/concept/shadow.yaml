summary:
  ar: "مدّ الله الظل ولو شاء لجعله ساكناً ثم جعل الشمس عليه دليلاً، وآوى إليه موسى في ظل الشجرة فقال رب إني لما أنزلت إليّ من خير فقير."
  en: "God spreads the shade — had He willed He would have made it still — then set the sun as its guide; Moses rested in the shade of the tree saying 'My Lord, I am in need of whatever good You send down to me.'"
  ur: "اللہ سایہ پھیلاتا ہے — اگر چاہتا تو اسے ٹھہرا رکھتا — پھر سورج کو اس کا رہنما بنایا؛ موسیٰ درخت کے سایے میں آرام کرتے ہوئے کہا 'اے رب جو بھی بھلائی تو مجھ پر نازل کرے میں اس کا محتاج ہوں۔'"
  es: "Dios extendió la sombra —si hubiera querido, la habría mantenido quieta— y luego puso el sol como guía; Moisés descansó a la sombra del árbol diciendo: «Señor mío, necesito todo el bien que me envíes»."
  fr: "Dieu étendit l'ombre — s'il l'avait voulu, il l'aurait immobilisée — puis il plaça le soleil pour la guider; Moïse se reposa à l'ombre de l'arbre en disant: « Mon Seigneur, j'ai besoin de tout bien que tu m'accordes. »"
  tr: "Tanrı gölgeyi genişletir ve isterse onu durgun yapabilir, sonra güneşi işaret eder. Musa ağacın gölgesine sığındı ve dedi ki, \"Rabbim, gerçekten de bana iyi bir şekilde gönderdiğin şeyde fakirim.\""
  id: "Tuhan memberikan teduh, dan jika Dia menghendaki, Dia bisa membuatnya diam, lalu menjadikan matahari sebagai tandanya. Musa berlindung di bawah naungan pohon dan berkata, \"Tuhanku, sungguh aku miskin dalam apa yang Engkau kirimkan kebaikan kepadaku.\""
