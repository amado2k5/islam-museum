perspectives:
  - tradition: sunni
    id: abu-bakr-equal-stipend
    summary:
      ar: "أبو بكر كان يقسم العطاء بالسوية بين الحر والعبد والكبير والصغير والذكر والأنثى، وقال إن الفضل والسوابق ثوابها على الله، وإن العطاء معاش والتسوية فيه خير من الأثرة {cite:usul-iqtisad-islami-0660 p. 327}."
    sources: [source/usul-iqtisad-islami-0660]
  - tradition: sunni
    id: umar-merit-stipend
    summary:
      ar: "عمر فاضل بين الناس بالبلاء في الإسلام والقدم والغَناء والحاجة، وقال إن أبا بكر رأى رأياً وإن له رأياً آخر، وأراد في آخر عمره أن يسوي بين الناس {cite:usul-iqtisad-islami-0660 p. 327} {cite:usul-iqtisad-islami-0660 p. 328}. ويذكر المؤلف أن عثمان وعلياً سوّيا بين الناس {cite:usul-iqtisad-islami-0660 p. 328}."
    sources: [source/usul-iqtisad-islami-0660]
