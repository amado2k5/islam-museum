id: concept/ata-stipend
class: concept
kind: legal
label:
  ar: "العطاء"
  en: "Stipend from the public treasury (ata)"
issue:
  ar: "على أي معيار يُفرض العطاء: التسوية بين الناس أم المفاضلة بينهم؟"
summary:
  ar: "العطاء عند المؤلف مبالغ سنوية أو شهرية، وربما فورية إذا هبطت موارد كبيرة، تُدفع من فائض بيت مال المصالح لكل فرد أو رب أسرة {cite:usul-iqtisad-islami-0660 p. 326}. وقد اختلف الخلفاء في معياره: سوّى أبو بكر بين الناس، وفاضل عمر بالبلاء والسبق والغَناء والحاجة {cite:usul-iqtisad-islami-0660 p. 327}، وفرض عمر لكل مولود مئة درهم بعد الفطام {cite:usul-iqtisad-islami-0660 p. 328}."
wings: [ideas]
