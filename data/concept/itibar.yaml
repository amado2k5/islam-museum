id: concept/itibar
class: concept
kind: term
label:
  ar: "الاعتبار والمتابعات والشواهد"
  en: "I'tibar: corroboration (mutaba'at) and supporting reports (shawahid)"
summary:
  ar: "الاعتبار عند ابن الصلاح هو النظر في حال الحديث: هل تفرد به راويه أو لا، وهل هو معروف أو لا. ومثّل له ابن حبان بحديث يرويه حماد بن سلمة عن أيوب عن ابن سيرين عن أبي هريرة، فيُنظر هل رواه ثقة غير أيوب عن ابن سيرين، ثم غير ابن سيرين عن أبي هريرة، ثم صحابي غير أبي هريرة. فالمتابعة التامة أن يرويه غير حماد عن أيوب، والقاصرة ما كان أبعد من ذلك، والشاهد أن يُروى حديث آخر بمعناه؛ فإن لم يوجد شيء من ذلك تحقق التفرد المطلق. وقد يدخل في المتابعات والشواهد من لا يحتج به وحده {cite:muqaddima-ibn-salah-itr p. 82-85}."
  en: "For Ibn al-Salah i'tibar is examining a hadith to see whether its narrator is alone in it and whether it is known. Ibn Hibban illustrated it with a hadith of Hammad ibn Salama from Ayyub from Ibn Sirin from Abu Hurayra: one looks for a trustworthy narrator other than Ayyub from Ibn Sirin, then someone other than Ibn Sirin from Abu Hurayra, then a Companion other than Abu Hurayra. A complete corroboration (mutaba'a) is another narrator from Ayyub; a partial one lies further up; a supporting report (shahid) is a different hadith with the same meaning; if none is found the report is absolutely solitary. Narrators not relied on alone may still serve in corroborations and supporting reports."
