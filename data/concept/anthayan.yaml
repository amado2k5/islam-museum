label: { ar: "أنثيان", en: "Anthayan (the two testicles, and rulings on them)", fr: "Anthayan (les deux testicules et les règles qui les concernent)", es: "Anthayan (los dos testículos y las normas que los rigen)", ur: "انتھائیان ⁦(دو خصیے، اور ان کے احکام)⁩" }
summary:
  ar: "الأنثيان الخصيتان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3458} وهما من العورة المغلظة، والاختصاء حرام لنهي النبي عن الاختصاء، وفي الجناية عليهما خطأ دية، وفي العمد القصاص عند الشافعية والحنابلة والمالكية، وقال الحنفية لا قصاص فيهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3459} وفي قطع أنثي الحيوان أقوال بين الجواز والكراهة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3459}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3460}"
  en: "Anthayan are the two testicles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3458} They belong to the parts of the body that must be covered, and castration is forbidden on the report of Ibn Mas'ud, who said that they asked the Prophet whether they might castrate themselves, and he forbade it. The injury to them by error carries a diya; for deliberate injury retaliation is due according to the Shafi'is, Hanbalis and Malikis, while the Hanafis deny retaliation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3459} The jurists differ on castrating an animal between allowance and dislike. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3459}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3460}"
  fr: "Anthayan désigne les deux testicules. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3458} Ils font partie des zones du corps qui doivent être couvertes. La castration est interdite d’après le récit d’Ibn Mas'ud, selon lequel ils ont demandé au Prophète s’ils pouvaient se châtrer et il le leur a interdit. Une lésion accidentelle donne lieu à une diya. En cas de lésion volontaire, le talion s’applique selon les chaféites, les hanbalites et les malékites, tandis que les hanafites l’écartent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3459} Quant à la castration d’un animal, certains juristes la permettent et d’autres la réprouvent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3459}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3460}"
  es: "Anthayan son los dos testículos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3458} Pertenecen a las partes del cuerpo que deben estar cubiertas, y la castración está prohibida según el relato de Ibn Mas'ud, quien dijo que le preguntaron al Profeta si podían castrarse, y él lo prohibió. El daño a ellos por error conlleva una diya; para el daño deliberado se debe represalia según los shafi'is, hanbalis y malikíes, mientras que los hanafis niegan la represalia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3459} Los juristas difieren en cuanto a la castración de un animal entre permitirla y desaprobarla. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3459}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3460}"
  ur: "انتھائیان دو خصیے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3458} ان کا تعلق جسم کے ان حصوں سے ہے جن کو ڈھانپنا ضروری ہے، اور ابن مسعود کی روایت ہے کہ انہوں نے نبی سے دریافت کیا کہ کیا آپ اپنے آپ کو ڈھک سکتے ہیں، آپ نے اس سے منع فرمایا۔ غلطی سے ان کو لگنے والی چوٹ ایک دیہہ رکھتی ہے۔ دانستہ طور پر چوٹ پہنچانے پر شافعیہ، حنبلی اور مالکیہ کے نزدیک انتقام واجب ہے، جبکہ احناف انتقام کا انکار کرتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 ص3459} فقہاء کا بھتے اور ناپسندیدگی کے درمیان جانور ڈالنے میں اختلاف ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3459}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3460}"
