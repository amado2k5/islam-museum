label: { ar: "أنثيان", en: "Anthayan (the two testicles, and rulings on them)" }
summary:
  ar: "الأنثيان الخصيتان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3458} وهما من العورة المغلظة، والاختصاء حرام لنهي النبي عن الاختصاء، وفي الجناية عليهما خطأ دية، وفي العمد القصاص عند الشافعية والحنابلة والمالكية، وقال الحنفية لا قصاص فيهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3459} وفي قطع أنثي الحيوان أقوال بين الجواز والكراهة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3459}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3460}"
  en: "Anthayan are the two testicles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3458} They belong to the parts of the body that must be covered, and castration is forbidden on the report of Ibn Mas'ud, who said that they asked the Prophet whether they might castrate themselves, and he forbade it. The injury to them by error carries a diya; for deliberate injury retaliation is due according to the Shafi'is, Hanbalis and Malikis, while the Hanafis deny retaliation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3459} The jurists differ on castrating an animal between allowance and dislike. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3459}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3460}"
