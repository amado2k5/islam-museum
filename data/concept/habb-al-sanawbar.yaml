id: concept/habb-al-sanawbar
class: concept
kind: natural
label:
  ar: "حبّ الصنوبر"
  en: "Habb al-sanawbar (pine nut)"
  ur: "حب الصنوبر ⁦(چیڑ کا بیج)⁩"
  es: "Habb al-sanawbar (piñón)"
summary:
  ar: "حبّ الصنوبر ثمرة شجرة، فيه إنضاج وتليين وتحليل ولذع، وأشدّه في الطري. والكبار منه ينفع من الاسترخاء وضعف البدن أكلاً، ويجفّف الرطوبات الفاسدة فيه، والكبار والصغار ينفعان رطوبات الرئة والقيح والسعال، وقشوره وخشبه تدخل في اللعوقات."
  en: "Habb al-sanawbar is the nut of a tree. It ripens, softens, dissolves and stings, most strongly when fresh, and the sting goes if soaked in water. The large kind helps slackness and weakness of the body when eaten and dries the corrupt humours in it. The large and small kinds both help putrid moisture, pus and cough in the lung, and its shells and wood enter electuaries. The small kind is nearer a medicine than food."
  ur: "حب الصنوبر ایک درخت کا مغز ہے جو پکاتا، نرم کرتا، تحلیل کرتا اور کاٹتا ہے، تازہ ہونے پر سب سے زیادہ۔ پانی میں بھگونے سے اس کی تیزی جاتی رہتی ہے۔ بڑی قسم کھانے سے ڈھیلے پن اور بدن کی کمزوری میں مفید ہے اور اس کی فاسد رطوبات خشک کرتی ہے۔ بڑی اور چھوٹی دونوں پھیپھڑے کی گندی رطوبات، پیپ اور کھانسی میں مفید ہیں، اور ان کے چھلکے اور لکڑی لعوقات میں ڈالے جاتے ہیں۔ چھوٹی قسم غذا سے زیادہ دوا کے قریب ہے۔"
  es: "Habb al-sanawbar es la nuez de un árbol. Madura, se ablanda, se disuelve y produce una sensación de ardor, más intensa cuando está fresca, que desaparece al remojarla en agua. La variedad grande ayuda a combatir la flacidez y la debilidad corporal al consumirla y a eliminar los humores corruptos. Tanto la variedad grande como la pequeña ayudan a aliviar la humedad purulenta, el pus y la tos en los pulmones, y sus cáscaras y madera se utilizan en electuarios. La variedad pequeña se asemeja más a una medicina que a un alimento."
