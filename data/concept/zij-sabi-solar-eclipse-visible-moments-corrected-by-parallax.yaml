id: concept/zij-sabi-solar-eclipse-visible-moments-corrected-by-parallax
class: concept
kind: scientific
label: { ar: "أزمنة كسوف الشمس المرئية بعد تصحيح اختلاف المنظر", en: "The visible moments of a solar eclipse after the parallax correction", ur: "اختلافِ منظر کی تصحیح کے بعد سورج گرہن کے مرئی لمحات", es: "Los momentos visibles de un eclipse solar después de la corrección de paralaje", fr: "Les moments visibles d'une éclipse solaire après correction de la parallaxe", tr: "Paralaks düzeltmesinden sonra görülebilen güneş tutulmalarının zamanları", id: "Waktu-waktu gerhana matahari yang terlihat setelah koreksi paralaks" }
summary:
  ar: "تُعرف الأزمنة المطلقة أولاً بالحساب، ثم تُعرف الأزمنة المرئية بتصحيحها باختلاف المنظر. فإن كانت الدقائق التي بين الشمس والقمر في وقت البدء المطلق أقل من دقائق سقوطه، علمت أن القمر قد ستر الشمس قبل وقت البدء المطلق، فتنقص من ساعات البدء المطلق سدس ساعة، وتُعرف اختلاف المنظر في الطول على الرسم، وتعيد الحساب حتى يصح الموضع. وإن كانت أكثر فإن القمر لم يبلغ الموضع الذي يستر فيه شيئاً من الشمس فتزيد سدس ساعة. {cite:zij-sabi-nallino-byblion pp.166-168}"
  en: "The absolute moments are found first, and then the visible moments by correcting them for parallax. If at the absolute beginning the distance between the Sun and the Moon is less than the minutes of fall, the Moon has covered the Sun before the absolute beginning; a sixth of an hour is taken from the absolute beginning, the parallax in longitude is found on the figure, and the reckoning is repeated until the place is right. If the distance is greater, the Moon has not yet reached the covering position and a sixth of an hour is added. {cite:zij-sabi-nallino-byblion pp.166-168}"
  ur: "پہلے حساب سے مطلق لمحات معلوم ہوتے ہیں، پھر انہیں اختلافِ منظر سے درست کر کے مرئی لمحات۔ اگر مطلق آغاز پر سورج اور چاند کا فاصلہ سقوط کے دقائق سے کم ہو تو چاند آغاز سے پہلے سورج کو ڈھانپ چکا ہے؛ تب مطلق آغاز میں سے سدس گھنٹہ گھٹایا جاتا ہے، شکل پر طول میں اختلافِ منظر معلوم ہوتا ہے، اور حساب تب تک دہرایا جاتا ہے جب تک مقام درست نہ ہو۔ اگر فاصلہ زیادہ ہو تو چاند ابھی ڈھانپنے کے مقام تک نہیں پہنچا، اور سدس گھنٹہ جمع کیا جاتا ہے۔ {cite:zij-sabi-nallino-byblion pp.166-168}"
  es: "Primero se determinan los momentos absolutos y luego los momentos visibles corrigiéndolos por paralaje. Si al inicio absoluto la distancia entre el Sol y la Luna es menor que los minutos de caída, la Luna ha cubierto al Sol antes del inicio absoluto; se resta un sexto de hora al inicio absoluto, se calcula el paralaje en longitud en la figura y se repite el cálculo hasta que la posición sea correcta. Si la distancia es mayor, la Luna aún no ha alcanzado la posición de cobertura y se añade un sexto de hora. {cite:zij-sabi-nallino-byblion pp.166-168}"
  fr: "On détermine d'abord les instants absolus, puis les instants visibles en les corrigeant de la parallaxe. Si, au début absolu, la distance entre le Soleil et la Lune est inférieure à la durée de la chute, la Lune a masqué le Soleil avant ce début absolu; on soustrait alors un sixième d'heure à partir du début absolu, on calcule la parallaxe en longitude sur la figure, et on répète le calcul jusqu'à obtenir la position correcte. Si la distance est supérieure, la Lune n'a pas encore atteint sa position de masquage et on ajoute un sixième d'heure. {cite:zij-sabi-nallino-byblion pp.166-168}"
  tr: "Mutlak zamanlar önce hesaplama yoluyla belirlenir, ardından paralaks düzeltmesi yapılarak görünen zamanlar belirlenir. Güneş ve ayın mutlak başlangıcındaki dakikalar, batış dakikalarından daha az ise, ayın mutlak başlangıçtan önce güneşi örttüğü bilinir. Bu durumda, mutlak başlangıçtan bir saatin altıda biri çıkarılır, diyagram üzerinde paralaks farkı belirlenir ve konum doğru olana kadar hesaplama tekrarlanır. Dakikalar daha fazla ise, ay henüz güneşin herhangi bir bölümünü örtecek konuma ulaşmamıştır ve bir saatin altıda biri eklenir. {cite:zij-sabi-nallino-byblion pp.166-168}"
  id: "Waktu absolut ditentukan pertama-tama dengan perhitungan, kemudian waktu tampak ditentukan dengan mengoreksinya terhadap paralaks. Jika selisih menit antara matahari dan bulan pada awal absolut kurang dari selisih menit saat keduanya terbenam, maka diketahui bahwa bulan telah menutupi matahari sebelum awal absolut. Dalam hal ini, seperenam jam dikurangi dari awal absolut, perbedaan panjang paralaks ditentukan pada diagram, dan perhitungan diulang sampai posisinya benar. Jika selisih menit lebih besar, maka bulan belum mencapai posisi di mana ia menutupi sebagian matahari, dan seperenam jam ditambahkan. {cite:zij-sabi-nallino-byblion pp.166-168}"
