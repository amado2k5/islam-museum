id: concept/hisab-al-shawka-wal-musiba
class: concept
kind: doctrine
label:
  ar: "الشوكة فما فوقها: درجة أو خطيئة"
  en: "A thorn-prick or more: a rank or a sin"
  ur: "کانٹا یا اس سے بڑی تکلیف: ایک درجہ یا ایک خطا"
summary:
  ar: "ما يصيب المؤمن من شوكة فما فوقها إلا رفعه الله بها درجة أو حطّ عنه بها خطيئة، في رواية عائشة عند مسلم [[passage/muslim-api-6562]]، وعند البخاري من رواية ابن مسعود أن الله يكفّر بها سيئاته كما تحطّ الشجرة ورقها [[passage/bukhari-api-5648]]. فالحساب لا يقتصر على ما يفعله الإنسان، بل يدخل فيه ما يصيبه، وأصغر وحدة يسميها النص شوكة."
  en: "Nothing afflicts the believer, a thorn-prick or more, without God raising him a rank by it or shedding a sin from him by it, in A'isha's narration in Muslim [[passage/muslim-api-6562]], and in al-Bukhari, in Ibn Mas'ud's narration, God remits his bad deeds by it as a tree sheds its leaves [[passage/bukhari-api-5648]]. The account is not limited to what a person does; what befalls him enters it too, and the smallest unit the text names is a thorn."
  ur: "مومن کو جو بھی تکلیف پہنچتی ہے، کانٹا یا اس سے بڑی، اللہ اس سے اس کا ایک درجہ بلند کرتا ہے یا ایک خطا مٹاتا ہے، عائشہ کی روایت میں جو مسلم میں ہے [[passage/muslim-api-6562]]، اور بخاری میں ابن مسعود کی روایت میں ہے کہ اللہ اس سے اس کی برائیاں ایسے مٹاتا ہے جیسے درخت اپنے پتے جھاڑتا ہے [[passage/bukhari-api-5648]]۔ حساب صرف انسان کے کیے تک محدود نہیں بلکہ جو اسے پہنچے وہ بھی اس میں داخل ہے، اور سب سے چھوٹی اکائی جس کا نص نام لیتی ہے کانٹا ہے۔"
