id: concept/hisab-al-shawka-wal-musiba
class: concept
kind: doctrine
label:
  ar: "الشوكة فما فوقها: درجة أو خطيئة"
  en: "A thorn-prick or more: a rank or a sin"
  ur: "کانٹا یا اس سے بڑی تکلیف: ایک درجہ یا ایک خطا"
  es: "Una punzada de espina o más: un rango o un pecado"
  fr: "Une piqûre d'épine ou plus: un péché ou une faute grave"
  tr: "Çatal ve üzeri: bir derece veya günah"
  id: "Garpu dan di atas: derajat atau dosa"
summary:
  ar: "ما يصيب المؤمن من شوكة فما فوقها إلا رفعه الله بها درجة أو حطّ عنه بها خطيئة، في رواية عائشة عند مسلم [[passage/muslim-api-6562]]، وعند البخاري من رواية ابن مسعود أن الله يكفّر بها سيئاته كما تحطّ الشجرة ورقها [[passage/bukhari-api-5648]]. فالحساب لا يقتصر على ما يفعله الإنسان، بل يدخل فيه ما يصيبه، وأصغر وحدة يسميها النص شوكة."
  en: "Nothing afflicts the believer, a thorn-prick or more, without God raising him a rank by it or shedding a sin from him by it, in A'isha's narration in Muslim [[passage/muslim-api-6562]], and in al-Bukhari, in Ibn Mas'ud's narration, God remits his bad deeds by it as a tree sheds its leaves [[passage/bukhari-api-5648]]. The account is not limited to what a person does; what befalls him enters it too, and the smallest unit the text names is a thorn."
  ur: "مومن کو جو بھی تکلیف پہنچتی ہے، کانٹا یا اس سے بڑی، اللہ اس سے اس کا ایک درجہ بلند کرتا ہے یا ایک خطا مٹاتا ہے، عائشہ کی روایت میں جو مسلم میں ہے [[passage/muslim-api-6562]]، اور بخاری میں ابن مسعود کی روایت میں ہے کہ اللہ اس سے اس کی برائیاں ایسے مٹاتا ہے جیسے درخت اپنے پتے جھاڑتا ہے [[passage/bukhari-api-5648]]۔ حساب صرف انسان کے کیے تک محدود نہیں بلکہ جو اسے پہنچے وہ بھی اس میں داخل ہے، اور سب سے چھوٹی اکائی جس کا نص نام لیتی ہے کانٹا ہے۔"
  es: "Nada aflige al creyente, ni siquiera una espina, sin que Dios lo eleve de rango o le perdone un pecado, según la narración de Aisha en Muslim [[passage/muslim-api-6562]], y en al-Bujari, en la narración de Ibn Mas'ud, Dios perdona sus malas acciones como un árbol pierde sus hojas [[passage/bukhari-api-5648]]. El relato no se limita a lo que una persona hace; también incluye lo que le sucede, y la unidad más pequeña que menciona el texto es una espina."
  fr: "Rien n'afflige le croyant, pas même une épine, sans que Dieu ne l'élève en rang ou ne le délivre de ses péchés, selon le hadith rapporté par Aïcha dans Muslim [[passage/muslim-api-6562]] et, selon le hadith rapporté par al-Bukhari et Ibn Mas'ud, Dieu pardonne ses mauvaises actions comme un arbre perd ses feuilles [[passage/bukhari-api-5648]]. Ce récit ne se limite pas aux actions de l'homme; ce qui l'atteint y est également inclus, et la plus petite unité mentionnée dans le texte est une épine."
  tr: "Bir müminin başına gelen diken ya da yukarıda bir şey, Allah onu bununla diriltmez ya da günahı ondan kaldırmazsa, Müslüman'daki Aişe'nin rivayetinde [[passage/muslim-api-6562]] ve İbn Mas'ud'un Allah'ın günahlarını bir ağacın yapraklarını dökmesi gibi kefaret ettiği rivayetinde [[passage/bukhari-api-5648]] bir şeyin başına gelir. Böylece, hesaplaşma sadece bir kişinin yaptıklarıyla sınırlı kalmaz, başına gelenleri de kapsar ve metnin en küçük birim olarak adlandırdığı dikeni de kapsar."
  id: "Duri atau apapun di atas menimpa seorang mukmin kecuali Allah membangkitkannya dengan duri itu atau menghapus dosa darinya, dalam riwayat Aisha dalam Muslim [[passage/muslim-api-6562]], dan dalam Al-Bukhari dari riwayat Ibn Mas'ud bahwa Allah menebus dosa-dosanya dengan duri itu seperti pohon yang menjatuhkan daunnya [[passage/bukhari-api-5648]]. Dengan demikian, perhitungan tidak terbatas pada apa yang dilakukan seseorang, tetapi mencakup apa yang menimpanya, dan unit terkecil yang disebut teks sebagai duri."
