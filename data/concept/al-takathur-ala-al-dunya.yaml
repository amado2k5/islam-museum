id: concept/al-takathur-ala-al-dunya
class: concept
kind: ethical
label:
  ar: التكالب على الدنيا
  en: Greed for worldly gain (takathur)
  fr: "Avidité pour les biens de ce monde (takathur)"
  es: "Codicia por ganancias mundanas (takathur)"
  ur: "دنیاوی فائدے کا لالچ"
  tr: "Dünyayı hızla aşmak"
  id: "Melampaui dunia dengan cepat"
summary:
  ar: "يعرض الشيخ شلتوت التكالب على الدنيا بوصفه المسلك المقابل للتبتل: أن يركز الإنسان قواه في خدمة وجوده المادي الخاص، ويجمع ويدخر في دائرته الشخصية دون مكترث بالفضيلة أو بالشكر {cite:azhar-quran-building-society-shaltut p. 29}. ويرى أن هذه الفردية المادية تقطع الصلات الطبيعية بين الناس، وتغرس الشح، وتنمي العداوة والبغضاء {cite:azhar-quran-building-society-shaltut p. 29}. ويستشهد المؤلف بقصة صاحب الجنتين وقارون عاقبةً لمن انقطعت صلته بالآخرة أو نسي حق الله في ماله {cite:azhar-quran-building-society-shaltut p. 31}. ويخلص إلى أن الفرضين، التبتل والتكالب، كلاهما يمنع تكوين المجتمع الفاضل، وأن الواجب تطهير النفوس منهما إلى الحد الوسط {cite:azhar-quran-building-society-shaltut p. 32}."
  fr: "Le cheikh Shaltout présente la course aux biens de ce monde comme la voie opposée au tabattul : l’être humain concentre ses forces au service de sa seule existence matérielle, accumule et thésaurise dans son cercle privé, sans se soucier de vertu ni de gratitude {cite:azhar-quran-building-society-shaltut p. 29}. Il estime que cet individualisme matérialiste rompt les liens naturels entre les personnes, sème l’avarice et nourrit l’inimitié et la haine {cite:azhar-quran-building-society-shaltut p. 29}. L’auteur invoque l’histoire du possesseur des deux jardins et celle de Qaroun pour illustrer le sort de qui rompt son lien avec l’au-delà ou oublie les droits de Dieu sur ses biens {cite:azhar-quran-building-society-shaltut p. 31}. Il conclut que ces deux attitudes, retrait du monde et avidité, empêchent l’une et l’autre la formation d’une société vertueuse et qu’il faut en purifier les âmes pour atteindre le juste milieu {cite:azhar-quran-building-society-shaltut p. 32}."
  tr: "Şeyh Şaltut, dünyevi yaşam mücadelesini putperestliğin tam tersi olarak sunar: kişinin enerjisini kendi maddi varlığına hizmet etmeye, erdem veya minnettarlığa bakmadan kişisel çevresinde toplamaya ve kurtarmaya odaklamasıdır. {cite:azhar-kuran-toplum-inşa etme-şaltut s. 29}. Bu maddiyatçı bireyselliğin insanlar arasındaki doğal bağları kopardığına, açgözlülüğü aşıladığına ve düşmanlık ile nefreti beslediğine inanır {cite:azhar-kuran-inşaat-toplumu-şaltut s. 29}. Yazar, iki bahçenin sahibi ve Qarun'un hikayesini, ahiretle bağlantısı kesilenler veya Tanrı'nın servet hakkını unutanlar için bir kader olarak gösterir {cite:azhar-kuran-building-society-shaltut s. 31}. Sonuç olarak, hem tembellik hem de kavgacılık gibi varsayımların erdemli bir toplumun oluşumunu engellediğini ve ruhların bu toplumlardan ılımlı bir ölçüde arındırılması gerektiğini belirtir {cite:azhar-kuran-building-society-shaltut s. 32}."
  id: "Sheikh Shaltut menyajikan perjuangan untuk kehidupan duniawi sebagai kebalikan dari penyembahan berhala: yaitu fokus seseorang pada melayani keberadaan materi mereka, berkumpul, dan menyelamatkan di lingkungan pribadi tanpa memperhatikan kebajikan atau rasa syukur. {cite:azhar-quran-society-building-shaltut hlm. 29}. Ia percaya individualisme materialistis ini memutuskan ikatan alami di antara manusia, menanamkan keserakahan, dan memupuk permusuhan serta kebencian {cite:azhar-quran-construction-society-şaltut hlm. 29}. Penulis menggambarkan kisah pemilik dua taman dan Qarun sebagai takdir bagi mereka yang terputus dari alam baka atau melupakan hak Tuhan atas kekayaan {cite:azhar-quran-building-society-shaltut hlm. 31}. Akibatnya, ia menyatakan bahwa asumsi seperti kemalasan dan suka bertengkar menghalangi terbentuknya masyarakat yang berbudi luhur dan bahwa jiwa harus dimurnikan secara moderat dari masyarakat tersebut {cite:azhar-quran-building-society-shaltut hlm. 32}."
