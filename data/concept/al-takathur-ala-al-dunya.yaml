id: concept/al-takathur-ala-al-dunya
class: concept
kind: ethical
label:
  ar: التكالب على الدنيا
  en: Greed for worldly gain (takathur)
summary:
  ar: "يعرض الشيخ شلتوت التكالب على الدنيا بوصفه المسلك المقابل للتبتل: أن يركز الإنسان قواه في خدمة وجوده المادي الخاص، ويجمع ويدخر في دائرته الشخصية دون مكترث بالفضيلة أو بالشكر {cite:azhar-quran-building-society-shaltut p. 29}. ويرى أن هذه الفردية المادية تقطع الصلات الطبيعية بين الناس، وتغرس الشح، وتنمي العداوة والبغضاء {cite:azhar-quran-building-society-shaltut p. 29}. ويستشهد المؤلف بقصة صاحب الجنتين وقارون عاقبةً لمن انقطعت صلته بالآخرة أو نسي حق الله في ماله {cite:azhar-quran-building-society-shaltut p. 31}. ويخلص إلى أن الفرضين، التبتل والتكالب، كلاهما يمنع تكوين المجتمع الفاضل، وأن الواجب تطهير النفوس منهما إلى الحد الوسط {cite:azhar-quran-building-society-shaltut p. 32}."
