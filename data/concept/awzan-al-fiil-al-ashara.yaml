id: concept/awzan-al-fiil-al-ashara
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-sciences]
label:
  ar: "أوزان الفعل العشرة"
  en: "The ten verb forms (awzan) of Arabic"
  ur: "عربی افعال کے دس اوزان"
  fr: "Les dix formes verbales (awzan) de l'arabe"
  es: "Las diez formas verbales (awzan) del árabe"
  tr: "On fiil deseni"
  id: "Sepuluh pola kata kerja"
summary:
  ar: "جدول الأوزان من الأول إلى العاشر على جذر ك-ت-ب كما أوردها ملخص بحثي عن نظام الجذر والوزن في العربية: صيغة الماضي والمضارع بالحركات، ومثال كل وزن، ومعناه الغالب، وأرقام الصفحات في ريدنغ 2005 ورايت 1896. الوزن التاسع وزنٌ فقط ولا مادة معجمية له من هذا الجذر. أرقام الصفحات من الملخص ولم يتحقق منها المتحف."
  en: "The table of verb forms I to X on the root k-t-b as given by a research summary on the root-and-pattern system of Arabic: the perfect and imperfect patterns with vowels, an example for each form, its usual meaning, and the page numbers in Ryding 2005 and Wright 1896. Form IX is given as a pattern only, with no lexicalised verb from this root. The page numbers are the summary's and the museum did not check them."
  ur: "عربی کے جذر اور وزن کے نظام پر ایک تحقیقی خلاصے میں دیا گیا جذر ک-ت-ب پر پہلے سے دسویں وزن تک کا جدول: ماضی اور مضارع کی صیغے حرکات کے ساتھ، ہر وزن کی مثال، اس کا عام معنی، اور رائڈنگ 2005 اور رائٹ 1896 میں صفحات کے نمبر۔ نواں وزن صرف وزن کے طور پر ہے اور اس جذر سے اس کا کوئی لغوی فعل نہیں۔ صفحات کے نمبر خلاصے کے ہیں اور عجائب گھر نے ان کی جانچ نہیں کی۔"
  fr: "Le tableau des formes verbales I à X sur la racine k-t-b tel que le donne un résumé de recherche sur le système racine-schème de l'arabe : schèmes de l'accompli et de l'inaccompli avec voyelles, un exemple pour chaque forme, son sens habituel, et les numéros de page chez Ryding 2005 et Wright 1896. La forme IX n'est donnée que comme schème, sans verbe lexicalisé sur cette racine. Les numéros de page sont ceux du résumé et le musée ne les a pas vérifiés."
  es: "La tabla de las formas verbales I a X sobre la raíz k-t-b tal como la da un resumen de investigación sobre el sistema de raíz y patrón del árabe: patrones del perfecto y del imperfecto con vocales, un ejemplo de cada forma, su sentido habitual y los números de página en Ryding 2005 y Wright 1896. La forma IX se da solo como patrón, sin verbo lexicalizado sobre esta raíz. Los números de página son los del resumen y el museo no los comprobó."
  tr: "K-T-B kökü üzerindeki birinci ile onuncu ölçek tablosu, kök ve ölçü sistemi üzerine Arapça bir araştırma özetinde sunulmuştur: geçmiş ve şimdiki form, ünlülerle, her ölçüye bir örnek, baskın anlamı ve sayfa numaraları Reading 2005 ve Wright 1896'da sunulmuştur. Dokuzuncu ölçü sadece ölçüdür ve bu kökten herhangi bir sözcük materyali içermemektedir. Sayfa numaraları özetten alınmıştır ve müze tarafından doğrulanmamıştır."
  id: "Tabel skala dari yang pertama hingga kesepuluh pada akar K-T-B seperti yang disajikan dalam ringkasan penelitian tentang sistem akar dan meter dalam bahasa Arab: bentuk masa lalu dan sekarang dengan vokal, contoh setiap meter, makna dominannya, dan nomor halaman dalam Reading 2005 dan Wright 1896. Meter kesembilan hanya meter, tanpa materi leksikal dari akar ini. Nomor halaman berasal dari ringkasan dan tidak diverifikasi oleh museum."
