issue:
  ar: "هل «الأعمال» في حديث النيات كل الأعمال الاختيارية أم الأعمال الشرعية المفتقرة إلى النية، وهل النية شرط صحة أم شرط كمال؟"
  en: "Do 'actions' in the hadith of intentions mean all voluntary acts or only religious acts requiring intention, and is intention a condition of validity or of completeness?"
perspectives:
- tradition: sunni
  id: later-scholars-restrict
  stance:
    ar: "المراد بالأعمال الأعمال الشرعية المفتقرة إلى النية، وتقدير الحديث: الأعمال صحيحة أو معتبرة أو مقبولة بالنيات"
    en: "'Actions' means religious acts that require intention; the hadith is understood as: actions are valid, regarded or accepted through intentions"
  summary:
    ar: "ينقل ابن رجب أن كثيراً من المتأخرين يقدّرون الحديث على أن الأعمال صحيحة أو معتبرة أو مقبولة بالنيات، فيُخصّ من عموم الأعمال ما لا يفتقر إلى نية كالعادات من الأكل والشرب واللبس ورد الأمانات والودائع."
    en: "Ibn Rajab reports that many later scholars construe the hadith as: actions are valid, regarded or accepted through intentions, so that what needs no intention — habits such as eating, drinking and dress, or returning trusts and deposits — is excluded from its general wording."
  holders:
  - person/ibn-rajab
  evidence:
