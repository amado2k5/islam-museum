label:
  ar: النية في الأعمال
  en: Niyya (intention in deeds)
summary:
  ar: "القصد والإرادة التي يقع عنها العمل؛ يذكر ابن رجب أن للنية في كلام العلماء معنيين: أحدهما تمييز العبادات بعضها عن بعض وعن العادات، وهو المعنى الغالب في كتب الفقهاء، والثاني تمييز المقصود بالعمل — لله وحده أم لغيره — وهو المعنى الغالب في كلام السلف، وهو قرين الإخلاص؛ وفي حديث «إنما الأعمال بالنيات» رآه الشافعي ثلث العلم يدخل في سبعين باباً من الفقه، وافتتح به البخاري صحيحه."
  en: "The purpose and will behind an act; Ibn Rajab notes that intention has two senses in scholars' usage: distinguishing acts of worship from one another and from habits — the sense dominant in the jurists' books — and distinguishing the aim intended by the act, whether for God alone or for other than Him — the sense dominant among the early generations and companion to sincerity; al-Shafi'i is reported to have called the hadith 'actions are but by intentions' a third of knowledge entering seventy chapters of jurisprudence, and al-Bukhari opened his Sahih with it."
