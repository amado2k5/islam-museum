id: concept/niyya
class: concept
kind: doctrine
label:
  ar: النية في الأعمال
  en: Niyya (intention in deeds)
  es: "Niyya (intención en las acciones)"
  fr: "Niyya (intention dans les actes)"
  ur: "نیت ⁦(اعمال میں نیت)⁩"
  tr: "İş Dünyasında Niyet"
  id: "Niat dalam Bisnis"
summary:
  ar: "القصد والإرادة التي يقع عنها العمل؛ يذكر ابن رجب أن للنية في كلام العلماء معنيين: أحدهما تمييز العبادات بعضها عن بعض وعن العادات، وهو المعنى الغالب في كتب الفقهاء، والثاني تمييز المقصود بالعمل — لله وحده أم لغيره — وهو المعنى الغالب في كلام السلف، وهو قرين الإخلاص؛ وفي حديث «إنما الأعمال بالنيات» رآه الشافعي ثلث العلم يدخل في سبعين باباً من الفقه، وافتتح به البخاري صحيحه."
  en: "The purpose and will behind an act; Ibn Rajab notes that intention has two senses in scholars' usage: distinguishing acts of worship from one another and from habits — the sense dominant in the jurists' books — and distinguishing the aim intended by the act, whether for God alone or for other than Him — the sense dominant among the early generations and companion to sincerity; al-Shafi'i is reported to have called the hadith 'actions are but by intentions' a third of knowledge entering seventy chapters of jurisprudence, and al-Bukhari opened his Sahih with it."
  es: "El propósito y la voluntad detrás de un acto; Ibn Rajab señala que la intención tiene dos sentidos en el uso de los eruditos: distinguir los actos de adoración entre sí y de los hábitos —el sentido dominante en los libros de los juristas— y distinguir el objetivo que se pretende con el acto, ya sea para Dios solo o para alguien más que Él —el sentido dominante entre las primeras generaciones y compañero de la sinceridad—; se dice que al-Shafi'i llamó al hadiz \"las acciones son solo por intenciones\" un tercio del conocimiento que entra en setenta capítulos de jurisprudencia, y al-Bukhari abrió su Sahih con él."
  fr: "L'intention et la volonté qui sous-tendent un acte; Ibn Rajab note que le terme « intention » a deux sens dans l'usage des savants: distinguer les actes de culte les uns des autres et des habitudes – le sens dominant dans les ouvrages de juristes – et distinguer le but visé par l'acte, que ce soit pour Dieu seul ou pour un autre que Lui – le sens dominant parmi les premières générations et lié à la sincérité; al-Shafi'i aurait qualifié le hadith « les actions ne sont que par les intentions » de tiers du savoir introduit dans soixante-dix chapitres de jurisprudence, et al-Bukhari a ouvert son Sahih par ce hadith."
  ur: "ایک عمل کے پیچھے مقصد اور مرضی؛ ابن رجب نے نوٹ کیا ہے کہ علماء کے استعمال میں نیت کے دو حواس ہیں: عبادات کو ایک دوسرے سے اور عادات سے ممتاز کرنا - فقہاء کی کتابوں میں غالب احساس - اور عمل کے مقصد کو الگ کرنا، چاہے وہ صرف خدا کے لیے ہو یا اس کے علاوہ - ابتدائی نسلوں میں غالب احساس اور اخلاص کا ساتھی؛ شافعی نے حدیث کو 'اعمال پر نیت' کہا ہے، ایک تہائی علم فقہ کے ستر ابواب میں داخل ہے، اور بخاری نے اس سے اپنی صحیح کو کھولا ہے۔"
  tr: "Eyleme yol açan niyet ve irade; İbn Receb, alimlerin konuşmasında niyetin iki anlamı olduğunu belirtir: biri, ibadet eylemlerini birbirinden ve geleneklerden ayırmak, ki bu fıkâhların kitaplarında baskın anlamdır; ikincisi ise eylemin amaçladığı şeyi—yalnızca Allah için mi yoksa başkaları için mi—ayırt etmek; bu, ilk nesillerin konuşmasında baskın anlamdır ve samimiyetle birlikte gelir. \"Eylem sadece niyetle yapılır\" hadisinde, El-Şafi'i bilginin üçte birini yetmiş fıkıh fırtına ait olarak görmüş ve El-Buhari bu sahihini bu sözlerle açmıştır."
  id: "Niat dan kehendak yang mengarah pada tindakan; Ibn Rajab menyebutkan bahwa niat dalam pidato para ulama memiliki dua makna: satu membedakan tindakan ibadah satu sama lain dan dari adat, yang merupakan makna dominan dalam kitab-kitab para ahli hukum; yang kedua adalah membedakan apa yang dimaksudkan oleh tindakan—hanya untuk Tuhan atau untuk orang lain—yang merupakan makna utama dalam ucapan generasi awal dan disertai dengan ketulusan. Dalam hadits \"Tindakan hanya berdasarkan niat,\" Al-Shafi'i melihat sepertiga pengetahuan berasal dari tujuh puluh bab fiqh, dan Al-Bukhari membuka Sahihnya dengan itu."
