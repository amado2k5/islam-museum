- tradition: sunni
  id: early-scholars-general
  stance:
    ar: "الأعمال على عمومها لا يُخصّ منها شيء، والحديث إخبار عن أن الأعمال الاختيارية لا تقع إلا عن قصد، وأن حظ العامل من عمله نيته"
    en: "'Actions' retains its general sense with nothing excluded: the hadith states that voluntary acts do not occur without purpose, and that the doer's share of his deed is his intention"
  summary:
    ar: "يذكر ابن رجب أن آخرين أبقوا الأعمال على عمومها وحكى بعضهم ذلك عن الجمهور، ووقع في كلام ابن جرير الطبري وأبي طالب المكي وغيرهما من المتقدمين وهو ظاهر كلام الإمام أحمد؛ ويقدَّر حينئذ: الأعمال واقعة أو حاصلة بالنيات، ويأتي قوله «وإنما لكل امرئ ما نوى» إخباراً عن حكم الشرع أن ثواب العامل أو عقابه بحسب نيته."
    en: "Ibn Rajab notes that others kept 'actions' general and that some attributed this to the majority; it occurs in the words of Ibn Jarir al-Tabari and Abu Talib al-Makki and other early scholars, and is the apparent position of Imam Ahmad. The construal is then: actions occur and come about through intentions, and 'each person has only what he intended' states the law's ruling that the doer's reward or punishment follows his intention."
