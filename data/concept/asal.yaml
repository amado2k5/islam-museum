id: concept/asal
class: concept
kind: legal
label:
  ar: العَسَل
  en: 'Honey: its medicinal use and zakat (asal)'
  fr: "Le miel : son usage médicinal et sa zakat (asal)"
  ur: شہد
  es: "Miel: su uso medicinal y zakat (asal)"
  tr: "Bal"
  id: "Sayang"
summary:
  ar: العسل في اللغة لعاب النحل، وقد جعله الله شفاء للناس، والعرب تطلق الاسم على كل
    ما يُستلذ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11602}. ويجوز التداوي بالعسل،
    وقال جمهور العلماء إن في العسل شفاء للناس، كما ورد في الحديث أن أخا الرجل اشتكى
    بطنه فأمر النبي بسقيه العسل {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11603}. وذهب
    الحنفية والحنابلة إلى وجوب العشر في العسل، واستدلوا بآثار عن عمر وحديث أبي هريرة،
    وعند الحنفية يشترط كون النحل في أرض العشر، أما المالكية والشافعية فلا زكاة عندهم
    في العسل {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11603} {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.11604} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11605}. ويرى الحنابلة والزهري
    أن نصابه عشرة أفراق، وأبو حنيفة يوجب العشر في قليله وكثيره، وأبو يوسف يعتبر القيمة
    {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11605}.
  en: In the lexicon, asal is the saliva of the bee, which God made a healing for
    people; the Arabs use the word for anything found sweet {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.11602}. Using honey as medicine is permitted, and most scholars read the Qur'anic
    verse as saying that honey contains healing {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.11603}. The Hanafis and Hanbalis hold that a tenth is due on honey, relying
    on prophetic and early reports, and the Hanafis require that the bees be on tithe
    land; the Malikis and Shafi'is hold that honey carries no zakat {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.11603} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11604} {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.11605}. The Hanbalis and al-Zuhri set its threshold at ten faraq; Abu Hanifa
    requires a tenth on any amount; Abu Yusuf takes value as the measure {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.11605}.
  fr: "Dans le lexique, asal désigne la salive de l’abeille, dont Dieu a fait une guérison pour les gens ; les Arabes emploient ce mot pour tout ce qu’ils trouvent doux {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11602}. L’usage médicinal du miel est permis, et la plupart des savants comprennent le verset coranique comme affirmant que le miel contient une guérison {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11603}. Les hanafites et les hanbalites estiment qu’un dixième du miel est dû, en s’appuyant sur des récits prophétiques et anciens ; les hanafites exigent que les abeilles se trouvent sur une terre soumise à la dîme ; les malikites et les chaféites considèrent que le miel n’est pas assujetti à la zakat {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11603} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11604} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11605}. Les hanbalites et al-Zuhri fixent son seuil à dix faraq ; Abu Hanifa exige un dixième quelle que soit la quantité ; Abu Yusuf retient la valeur comme mesure {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11605}."
  ur: شہد — شفا والی غذا جسے اللہ نے مومنوں کے لیے مبارک قرار دیا اور جنت میں اس کی
    صاف نہریں بہتی ہیں۔
  es: "En el léxico, asal es la saliva de la abeja, que Dios hizo curativa para la gente; los árabes usan la palabra para cualquier cosa que se encuentre dulce {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11602}. El uso de la miel como medicina está permitido, y la mayoría de los eruditos interpretan el versículo coránico como que dice que la miel contiene curación {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11603}. Los hanafíes y los hanbalíes sostienen que se debe un diezmo sobre la miel, basándose en informes proféticos y antiguos, y los hanafíes requieren que las abejas estén en tierras de diezmo; los Malikis y Shafi'is sostienen que la miel no lleva zakat {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11603} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11604} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11605}. Los Hanbalis y al-Zuhri fijaron su umbral en diez faraq; Abu Hanifa exige un décimo sobre cualquier cantidad; Abu Yusuf toma el valor como medida {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11605}."
  tr: "Bal, dilbilimsel olarak arıların tükürüğüne atıfta bulunur ve Allah onu insanlara şifa olarak vermiştir. Araplar bu ismi zevk veren her şey için kullanırlar. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.11602}. Bal ile tedavi etmek caizdir ve çoğu alim balın insanlar için bir tedavi olduğunu söyler. Hadislerde bir adamın kardeşinin karnına şikayet ettiği ve Peygamber'in ona bal içmesini emrettiği de belirtilir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11603}. Hanafi ve Hanbaliler, Ömer ve Ebu Hureyre'nin hadislerinden rivayet ederek bal için ondalığın zorunlu olduğunu savunmuştur. Hanefilere göre, arıların ondalık topraklarında olması zorunludur, Maliki ve Şafiiler ise bal üzerinde zekat talep etmez {atıf:] fiqh-mawsua-kuwaitiyya-noor-v3 s.11603} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11604} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11605}. Hanbaliler ve al-Zuhri çoğunluğun on fark olduğunu, Abu Hanifa ondalığı hem küçük hem büyük miktarlarda borçlu tuttuğunu, Abu Yusuf ise {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11605} değerini değerlendirir."
  id: "Madu secara linguistik merujuk pada air liur lebah, dan Tuhan telah menjadikannya penyembuhan bagi manusia. Orang Arab menggunakan nama ini untuk apa pun yang menyenangkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11602}. Diperbolehkan mengobati dengan madu, dan mayoritas ulama mengatakan madu adalah obat bagi manusia. Juga disebutkan dalam hadis bahwa saudara laki-laki seseorang mengeluh di perutnya, sehingga Nabi memerintahkannya untuk minum madu {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11603}. Hanafi dan Hanbal berpendapat bahwa persepuluhan wajib untuk madu, mengutip riwayat dari Umar dan hadis Abu Huraira. Menurut Hanafi, lebah diwajibkan berada di tanah persepuluhan, sementara Malik dan Shafi'i tidak memerlukan zakat atas madu {cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 hlm.11603} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11604} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11605}. Hanbalis dan al-Zuhri berpendapat bahwa kuorum adalah sepuluh perbedaan, Abu Hanifa mewajibkan persepuluhan dalam jumlah kecil dan besar, dan Abu Yusuf mempertimbangkan nilainya {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11605}."
