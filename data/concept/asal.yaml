label:
  ar: "العَسَل"
  en: "Honey: its medicinal use and zakat (asal)"
  ur: "شہد"
summary:
  ar: "العسل في اللغة لعاب النحل، وقد جعله الله شفاء للناس، والعرب تطلق الاسم على كل ما يُستلذ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11602}. ويجوز التداوي بالعسل، وقال جمهور العلماء إن في العسل شفاء للناس، كما ورد في الحديث أن أخا الرجل اشتكى بطنه فأمر النبي بسقيه العسل {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11603}. وذهب الحنفية والحنابلة إلى وجوب العشر في العسل، واستدلوا بآثار عن عمر وحديث أبي هريرة، وعند الحنفية يشترط كون النحل في أرض العشر، أما المالكية والشافعية فلا زكاة عندهم في العسل {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11603} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11604} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11605}. ويرى الحنابلة والزهري أن نصابه عشرة أفراق، وأبو حنيفة يوجب العشر في قليله وكثيره، وأبو يوسف يعتبر القيمة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11605}."
  en: "In the lexicon, asal is the saliva of the bee, which God made a healing for people; the Arabs use the word for anything found sweet {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11602}. Using honey as medicine is permitted, and most scholars read the Qur'anic verse as saying that honey contains healing {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11603}. The Hanafis and Hanbalis hold that a tenth is due on honey, relying on prophetic and early reports, and the Hanafis require that the bees be on tithe land; the Malikis and Shafi'is hold that honey carries no zakat {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11603} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11604} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11605}. The Hanbalis and al-Zuhri set its threshold at ten faraq; Abu Hanifa requires a tenth on any amount; Abu Yusuf takes value as the measure {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11605}."
