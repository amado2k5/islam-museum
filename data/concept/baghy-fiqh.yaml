issue:
  ar: "ما حكم الخارجين على الإمام بتأويل، وهل يُكفَّر الخوارج؟"
  en: "What is the ruling on those who rise against the imam on the basis of an interpretation, and are the Khawarij to be declared unbelievers?"
  ur: "تاویل کی بنیاد پر امام کے خلاف خروج کرنے والوں کا کیا حکم ہے، اور کیا خوارج کی تکفیر کی جائے؟"
perspectives:
  - tradition: sunni-hanafi
    id: hanafi-jumhur
    stance: { ar: "الخوارج حكمهم حكم البغاة ولا يُكفَّرون", en: "The Khawarij take the ruling of rebels and are not declared unbelievers", ur: "خوارج کا حکم بغاۃ کا ہے اور ان کی تکفیر نہیں کی جاتی" }
    summary:
      ar: "ينقل ابن عابدين عن فتح القدير أن حكم الخوارج عند جمهور الفقهاء والمحدثين حكم البغاة، وأنهم لم يُكفَّروا لأن خروجهم عن تأويل وإن كان باطلاً، ويقرر أنه لا عبرة في هذا بغير الفقهاء المجتهدين. {cite:radd-al-muhtar-scan-v3 p.497}"
      en: "Ibn Abidin reports from Fath al-Qadir that for most jurists and hadith scholars the Khawarij take the ruling of rebels, and that they are not declared unbelievers because their rising rests on an interpretation, even a false one; he holds that only the mujtahid jurists count on this question."
      ur: "ابن عابدین فتح القدیر سے نقل کرتے ہیں کہ جمہور فقہاء اور محدثین کے نزدیک خوارج کا حکم بغاۃ کا ہے، اور ان کی تکفیر اس لیے نہیں کی گئی کہ ان کا خروج تاویل پر مبنی ہے اگرچہ باطل ہو؛ اور وہ کہتے ہیں کہ اس مسئلے میں مجتہد فقہاء کے سوا کسی کا اعتبار نہیں۔"
    holders: [person/ibn-al-humam, person/ibn-abidin]
    sources: [source/radd-al-muhtar-scan-v3]
  - tradition: sunni
    id: some-muhaddithun
    stance: { ar: "بعض المحدثين يكفّرون الخوارج", en: "Some hadith scholars declare the Khawarij unbelievers", ur: "بعض محدثین خوارج کی تکفیر کرتے ہیں" }
    summary:
      ar: "ينقل ابن عابدين عن فتح القدير أن بعض المحدثين ذهب إلى تكفيرهم، وأن ابن المنذر قال إنه لا يعلم أحداً وافق أهل الحديث على تكفيرهم. {cite:radd-al-muhtar-scan-v3 p.497}"
      en: "Ibn Abidin reports from Fath al-Qadir that some hadith scholars held them to be unbelievers, and that Ibn al-Mundhir said he knew of no one who agreed with the hadith scholars on this."
      ur: "ابن عابدین فتح القدیر سے نقل کرتے ہیں کہ بعض محدثین نے ان کی تکفیر کی، اور ابن المنذر نے کہا کہ انہیں کسی ایسے شخص کا علم نہیں جس نے اس میں اہلِ حدیث کی موافقت کی ہو۔"
    sources: [source/radd-al-muhtar-scan-v3]
  - tradition: sunni-hanafi
    id: ibn-abidin-najd
    stance: { ar: "رأي ابن عابدين: أتباع الحركة النجدية في زمانه مثال للخوارج", en: "Ibn Abidin's view: the followers of the Najdi movement of his time are an example of Khawarij", ur: "ابن عابدین کی رائے: ان کے زمانے کی نجدی تحریک کے پیروکار خوارج کی مثال ہیں" }
    summary:
      ar: "يرى ابن عابدين أن تكفير الخوارج للصحابة ليس شرطاً في تسميتهم، ويكفي اعتقادهم كفر من خرجوا عليه، ويمثّل لذلك بأتباع عبد الوهاب الذين خرجوا من نجد وغلبوا على الحرمين، ويصفهم بأنهم ينتسبون إلى مذهب الحنابلة لكنهم عدّوا من خالفهم مشركين واستباحوا قتال أهل السنة وعلمائهم، ويذكر أنهم هُزموا سنة 1233هـ. هذا وصفه هو وحكمه، يرويه المتحف منسوباً إليه. {cite:radd-al-muhtar-scan-v3 p.497}"
      en: "Ibn Abidin holds that the Khawarij's declaring the Companions unbelievers is not a condition of the name, and that it is enough that they hold those they rise against to be unbelievers; as an example he names the followers of Abd al-Wahhab who came out of Najd and took the two Sanctuaries, describing them as claiming the Hanbali school while counting those who differed from them as polytheists and treating the fighting of Sunnis and their scholars as lawful, and says they were defeated in 1233 AH. This description and judgement are his; the museum reports them as his."
      ur: "ابن عابدین کی رائے میں خوارج کا صحابہ کی تکفیر کرنا اس نام کی شرط نہیں، بلکہ یہ کافی ہے کہ وہ جن کے خلاف خروج کریں انہیں کافر سمجھیں؛ مثال میں وہ عبد الوہاب کے پیروکاروں کا ذکر کرتے ہیں جو نجد سے نکلے اور حرمین پر غالب آئے، اور ان کے بارے میں کہتے ہیں کہ وہ حنبلی مذہب کی طرف نسبت کرتے تھے مگر اپنے مخالفین کو مشرک سمجھتے اور اہلِ سنت اور ان کے علماء سے لڑائی کو جائز جانتے تھے، اور بتاتے ہیں کہ 1233ھ میں انہیں شکست ہوئی۔ یہ توصیف اور حکم انہی کا ہے؛ میوزیم اسے ان کی طرف منسوب کر کے نقل کرتا ہے۔"
    holders: [person/ibn-abidin]
    sources: [source/radd-al-muhtar-scan-v3]
