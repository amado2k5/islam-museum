id: concept/baghy-fiqh
class: concept
kind: legal
label:
  ar: "البغاة ⁦(أهل البغي)⁩"
  en: "Bughat (rebels against the imam)"
  ur: "بغاۃ (امام کے خلاف خروج کرنے والے)"
term: { ar: "بُغاة، بَغْي", en: "bughat, baghy" }
summary:
  ar: "البغي في اللغة الطلب، ثم اشتهر في طلب ما لا يحل من الجور والظلم؛ والباغي في عرف الفقهاء الخارج على إمام الحق. يقسم ابن عابدين في رد المحتار الخارجين عن طاعة الإمام ثلاثة: قطاع طريق، وبغاة، وخوارج، ويفرّق بينهم بالمنعة والتأويل واستحلال دماء المسلمين، وينقل أن حكم الخوارج عند جمهور الفقهاء والمحدثين حكم البغاة، ويذكر مثالاً من زمانه أتباع حركة خرجت من نجد وغلبت على الحرمين حتى ظُفر بها سنة 1233هـ؛ وهذا وصفه هو، ومنسوب إليه. {cite:radd-al-muhtar-scan-v3 p.496} {cite:radd-al-muhtar-scan-v3 p.497}"
  en: "Baghy lexically means seeking, then came to mean seeking what is not lawful, injustice and oppression; in the jurists' usage the baghi is one who rises against the rightful imam. Ibn Abidin in Radd al-Muhtar divides those who leave obedience to the imam into three, highway robbers, rebels and Khawarij, distinguished by armed strength, a claimed interpretation and the treating of Muslims' blood as lawful; he reports that for most jurists and hadith scholars the Khawarij take the ruling of rebels, and gives an example from his own time, the followers of a movement that came out of Najd and took the two Sanctuaries until it was defeated in 1233 AH; this description is his and is attributed to him."
  ur: "بغی کا لغوی معنی طلب ہے، پھر یہ ناجائز چیز، ظلم اور زیادتی کی طلب کے لیے مشہور ہو گیا؛ فقہاء کے عرف میں باغی وہ ہے جو امامِ حق کے خلاف خروج کرے۔ ابن عابدین رد المحتار میں امام کی اطاعت سے نکلنے والوں کی تین قسمیں کرتے ہیں: راہزن، بغاۃ اور خوارج، اور ان میں طاقت، تاویل اور مسلمانوں کا خون حلال سمجھنے کی بنیاد پر فرق کرتے ہیں؛ وہ نقل کرتے ہیں کہ جمہور فقہاء اور محدثین کے نزدیک خوارج کا حکم بغاۃ کا حکم ہے، اور اپنے زمانے سے ایک مثال دیتے ہیں: ایک تحریک کے پیروکار جو نجد سے نکلے اور حرمین پر غالب آئے یہاں تک کہ 1233ھ میں ان پر قابو پایا گیا؛ یہ توصیف انہی کی ہے اور انہی کی طرف منسوب ہے۔"
wings: [ideas, time]
