      en: "The position of the movement's own scholars and historians, and the academic studies, are not given here; they are to be added from their own books and from named works. The museum takes no position. (needs_source)"
      ur: "اس تحریک کے علماء اور مؤرخین کا موقف اور علمی مطالعات یہاں نقل نہیں ہوئے؛ انہیں ان کی اپنی کتابوں اور متعین مراجع سے شامل کیا جائے گا۔ میوزیم اس میں کوئی فیصلہ نہیں دیتا۔ (needs_source)"
