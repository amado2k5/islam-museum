id: concept/baghy-fiqh
class: concept
kind: legal
label:
  ar: "البغاة ⁦(أهل البغي)⁩"
  en: "Bughat (rebels against the imam)"
  fr: "Bughat (rebelles contre l’imam)"
  ur: "بغاۃ ⁦(امام کے خلاف خروج کرنے والے)⁩"
  es: "Bughat (se rebela contra el imán)"
  tr: "İsyancılar (İsyan Halkı)"
  id: "Para Pemberontak (Orang-Orang Pemberontak)"
term: { ar: "بُغاة، بَغْي", en: "bughat, baghy" }
summary:
  ar: "البغي في اللغة الطلب، ثم اشتهر في طلب ما لا يحل من الجور والظلم؛ والباغي في عرف الفقهاء الخارج على إمام الحق. يقسم ابن عابدين في رد المحتار الخارجين عن طاعة الإمام ثلاثة: قطاع طريق، وبغاة، وخوارج، ويفرّق بينهم بالمنعة والتأويل واستحلال دماء المسلمين، وينقل أن حكم الخوارج عند جمهور الفقهاء والمحدثين حكم البغاة، ويذكر مثالاً من زمانه أتباع حركة خرجت من نجد وغلبت على الحرمين حتى ظُفر بها سنة 1233هـ؛ وهذا وصفه هو، ومنسوب إليه. {cite:radd-al-muhtar-scan-v3 p.496} {cite:radd-al-muhtar-scan-v3 p.497}"
  en: "Baghy lexically means seeking, then came to mean seeking what is not lawful, injustice and oppression; in the jurists' usage the baghi is one who rises against the rightful imam. Ibn Abidin in Radd al-Muhtar divides those who leave obedience to the imam into three, highway robbers, rebels and Khawarij, distinguished by armed strength, a claimed interpretation and the treating of Muslims' blood as lawful; he reports that for most jurists and hadith scholars the Khawarij take the ruling of rebels, and gives an example from his own time, the followers of a movement that came out of Najd and took the two Sanctuaries until it was defeated in 1233 AH; this description is his and is attributed to him."
  fr: "Baghy signifie d’abord chercher, puis en est venu à désigner la recherche de l’illicite, l’injustice et l’oppression ; chez les juristes, le baghi est celui qui se soulève contre l’imam légitime. Dans le Radd al-Muhtar, Ibn Abidin distingue trois catégories de personnes rompant l’obéissance : brigands, rebelles et kharijites, selon la force armée, l’interprétation revendiquée et le fait de tenir pour licite le sang des musulmans. Il rapporte que, pour la majorité des juristes et spécialistes du hadith, les kharijites relèvent du statut des rebelles. Il cite un exemple de son époque : les partisans d’un mouvement venu du Najd qui s’empara des deux Sanctuaires avant sa défaite en 1233 H. Cette description est la sienne et lui est attribuée."
  ur: "بغی کا لغوی معنی طلب ہے، پھر یہ ناجائز چیز، ظلم اور زیادتی کی طلب کے لیے مشہور ہو گیا؛ فقہاء کے عرف میں باغی وہ ہے جو امامِ حق کے خلاف خروج کرے۔ ابن عابدین رد المحتار میں امام کی اطاعت سے نکلنے والوں کی تین قسمیں کرتے ہیں: راہزن، بغاۃ اور خوارج، اور ان میں طاقت، تاویل اور مسلمانوں کا خون حلال سمجھنے کی بنیاد پر فرق کرتے ہیں؛ وہ نقل کرتے ہیں کہ جمہور فقہاء اور محدثین کے نزدیک خوارج کا حکم بغاۃ کا حکم ہے، اور اپنے زمانے سے ایک مثال دیتے ہیں: ایک تحریک کے پیروکار جو نجد سے نکلے اور حرمین پر غالب آئے یہاں تک کہ 1233ھ میں ان پر قابو پایا گیا؛ یہ توصیف انہی کی ہے اور انہی کی طرف منسوب ہے۔"
  es: "Baghy significa léxicamente \"buscar\", y luego pasó a significar \"buscar lo ilícito\", \"injusticia\" y \"opresión\". En el uso de los juristas, el baghi es aquel que se alza contra el imán legítimo. Ibn Abidin, en Radd al-Muhtar, divide a quienes abandonan la obediencia al imán en tres grupos: bandidos, rebeldes y jariyíes, que se distinguen por su fuerza armada, una interpretación particular y el hecho de considerar lícita la sangre de los musulmanes. Relata que, para la mayoría de los juristas y eruditos del hadiz, los jariyíes adoptan la postura de los rebeldes, y da un ejemplo de su época: los seguidores de un movimiento que surgió de Najd y tomó los dos Santuarios hasta que fue derrotado en el año 1233 de la Hégira. Esta descripción es suya y se le atribuye."
  tr: "Dilde 'aği' bir şey aramak anlamına gelir, sonra haksızlık ve haksızlığa izin verilmeyen şeyleri aramasıyla ünlenir; ve hukukçuların terimiyle 'aği', hakikat imamına karşı isyan eden kişi olarak kabul edilir. İbn Abidin, Radd al-Muhtar'da İmam'a itaatsizlik edenleri üç tipe ayırır: haydutlar, saldırganlar ve Hariciler, onları koruma, yorumlama ve Müslümanların kanına izin verme yoluyla ayırır. Efericin, çoğu hukukçu ve hadis alimlerine göre Hawarij'in hükümünün isyancılarınkine benzediğini bildirir. Kendi zamanından, Necd'den çıkan ve 1233 Hicri'de fethedilen İki Kutsal Camiyi fetheden bir hareketin takipçileri örnek olarak verir; bu onun tanımıdır ve ona atfedilir. {alıntı:) radd-al-muhtar-scan-v3 s.496} {cite:radd-al-muhtar-scan-v3 s.497}"
  id: "Dalam bahasa, 'aghi' berarti mencari sesuatu, kemudian menjadi terkenal karena mencari ketidakadilan dan ketidakadilan yang tidak diperbolehkan; dan dalam istilah para ahli hukum, 'aghi' dianggap sebagai orang yang memberontak terhadap Imam kebenaran. Ibn Abidin membagi mereka yang membangkang Imam dalam Radd al-Muhtar menjadi tiga jenis: bandit, agresor, dan Kharijit, membedakan mereka melalui perlindungan, penafsiran, dan pemberian darah umat Islam. Ia melaporkan bahwa pemerintahan Khawarij, menurut mayoritas ahli hukum dan ulama hadits, mirip dengan pemerintahan pemberontak. Ia mengutip contoh dari masa pengikutnya tentang gerakan yang muncul dari Najd dan menaklukkan Dua Masjid Suci hingga ditaklukkan pada tahun 1233 H; ini adalah deskripsinya dan dikaitkan dengannya. {cite:radd-al-muhtar-scan-v3 p.496} {cite:radd-al-muhtar-scan-v3 p.497}"
