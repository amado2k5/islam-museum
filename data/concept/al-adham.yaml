label: { ar: الأدهم, en: "Al-adham (black horse)", es: "Al-adham (caballo negro)", fr: "Al-Adham (cheval noir)", ur: "الادھم ⁦(کالا گھوڑا)⁩" }
summary:
  ar: "الأدهم: الأسود الخالص، وأشد السواد ما يسمى الأدهم الغيهب؛ وفي الشاهنامة كان جياد الأبطال سوداء، وكانت الخيول السوداء تُفضّل في الحرب لقوتها."
  en: "Al-adham: the pure black horse, and the deepest black is called al-adham al-ghayhab; in the Shahnama the horses of heroes are black, and black horses were preferred in war for their strength."
  es: "Al-adham: el caballo negro puro, y el negro más profundo se llama al-adham al-ghayhab; en el Shahnama los caballos de los héroes son negros, y los caballos negros eran preferidos en la guerra por su fuerza."
  fr: "Al-adham: le cheval noir pur, et le noir le plus profond est appelé al-adham al-ghayhab; dans le Shahnama, les chevaux des héros sont noirs, et les chevaux noirs étaient préférés à la guerre pour leur force."
  ur: "الادھم: خالص سیاہ گھوڑا، اور سب سے گہرے سیاہ کو الادھم الغیب کہتے ہیں۔ شاہنامہ میں ہیروز کے گھوڑے کالے ہیں اور جنگ میں سیاہ گھوڑوں کو ان کی طاقت کے لیے ترجیح دی جاتی ہے۔"
