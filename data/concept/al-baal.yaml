label:
  ar: "ألبعل"
  en: "Al-baal (a sea plant)"
  fr: "Al-baal (une plante marine)"
  ur: "البعل ⁦(سمندری پودا)⁩"
  es: "Al-baal (una planta marina)"
  tr: "Baal"
  id: "Baal"
summary:
  ar: "دواء بحري يشبه القتّ، ينبت في الربيع، حار، ينفع الطحال جداً، ويدرّ البول {cite:canon-ibn-sina-print-v1 p.375}."
  en: "A sea drug resembling qatt (dried green fodder), which sprouts in spring. Hot; very helpful for the spleen, and it drives out urine {cite:canon-ibn-sina-print-v1 p.375}."
  fr: "Remède marin qui ressemble au qatt (fourrage vert séché) et pousse au printemps. Ibn Sina le classe comme chaud, le dit très bénéfique pour la rate et lui prête un effet diurétique {cite:canon-ibn-sina-print-v1 p.375}."
  ur: "ایک سمندری دوا جو قت سے ملتی ہے اور بہار میں اگتی ہے۔ گرم ہے؛ تلی کے لیے بہت مفید ہے اور پیشاب لاتی ہے {cite:canon-ibn-sina-print-v1 p.375}۔"
  es: "Una planta marina parecida al qatt (forraje verde seco), que brota en primavera. Caliente; muy beneficiosa para el bazo y ayuda a expulsar la orina {cite:canon-ibn-sina-print-v1 p.375}."
  tr: "Keseye benzer bir deniz ilacı ilkbaharda yetişir, sıcaktır, dalak için çok faydalı ve idrar söktürücü olarak işlev görür {cite:canon-ibn-sina-print-v1 s.375}."
  id: "Obat laut seperti kantong tumbuh di musim semi, hangat, sangat bermanfaat untuk limpa, dan berfungsi sebagai diuretik {cite:canon-ibn-sina-print-v1 hlm.375}."
