education:
  did_you_know:
    ar: الإيمان بالملائكة عند أهل السنة ركن من أركان الإيمان، نصّاً في العقيدة الطحاوية مع الإيمان بالنبيين والكتب المنزلة على المرسلين.
    en: Belief in the angels is a pillar of faith for the Sunnis, named in the Tahawi creed beside belief in the prophets and the books sent down upon the messengers.
    ur: اہلِ سنت کے نزدیک فرشتوں پر ایمان ارکانِ ایمان میں سے ہے — طحاوی عقیدہ میں انبیا اور اتاری گئی کتابوں کے ساتھ اس کا ذکر ہے۔
