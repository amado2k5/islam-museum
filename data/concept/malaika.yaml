summary:
  ur: 'نور کی مخلوق جو اللہ کی نافرمانی نہیں کرتی: حملۂ عرش، کرام کاتبین اور وحی کا امین۔'
  ar: 'الملائكة في العقيدة السنية ركن من أركان الإيمان: «ونؤمن بالملائكة والنبيين والكتب المنزلة على المرسلين ونشهد أنهم كانوا على الحق المبين» {cite:aqida-tahawiyya §72}.'
  en: 'Belief in the angels is a pillar of faith in Sunni creed: ''we believe in the angels and the prophets and the books sent down to the messengers, and we bear witness that they were upon manifest truth'' {cite:aqida-tahawiyya §72}.'
