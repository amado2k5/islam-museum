label:
  ar: الملائكة في الإسلام
  en: Angels in Islam (mala'ika)
  ur: فرشتے
  es: "Ángeles en el Islam (mala'ika)"
  fr: "Les anges en Islam (mala'ika)"
  tr: "İslam'da Melekler"
  id: "Malaikat dalam Islam"
summary:
  ar: "الملائكة في العقيدة السنية ركن من أركان الإيمان، وتقول دائرة المعارف الإسلامية إن لفظهم جمع تكسير لكلمة سامية قديمة بمعنى رسول، وإن القرآن يؤكد تمام طاعتهم لله. وتعرض المقالة ما قاله علماء أهل السنة في خلقهم من نور ومسألة عصمتهم وإبليس وهاروت وماروت وسؤال منكر ونكير وتفاضلهم مع البشر، ثم الرأي الإمامي والإسماعيلي في صلتهم بالأئمة وبمراتب العالم الروحي {cite:aqida-tahawiyya §72}."
  en: "Belief in the angels is a pillar of faith in Sunni creed {cite:aqida-tahawiyya §72}. The Encyclopaedia of Islam explains the word as the plural of an old Semitic term meaning messenger and reports the Qur'anic stress on the angels' complete obedience. It sets out Sunni discussions of their creation from light, their impeccability, Iblis, Harut and Marut, the questioning by Munkar and Nakir and their rank against humans, then the Imami and Isma'ili teachings on angels and the Imams."
  ur: "اہلِ سنت کے عقیدے میں فرشتوں پر ایمان رکنِ ایمان ہے۔ دائرۂ معارفِ اسلامیہ بتاتا ہے کہ یہ لفظ ایک قدیم سامی لفظ کی جمع ہے جس کا مطلب قاصد ہے، اور قرآن فرشتوں کی کامل اطاعت پر زور دیتا ہے۔ مضمون نور سے ان کی تخلیق، عصمت، ابلیس، ہاروت و ماروت، منکر نکیر کے سوال اور انسانوں سے ان کی فضیلت پر سنی بحثیں پیش کرتا ہے، پھر ائمہ سے ان کے تعلق پر امامی اور اسماعیلی تعلیم۔"
  es: "La creencia en los ángeles es un pilar de la fe en el credo sunita {cite:aqida-tahawiyya §72}. La Enciclopedia del Islam explica que la palabra es el plural de un antiguo término semítico que significa mensajero y destaca el énfasis coránico en la obediencia absoluta de los ángeles. Presenta las discusiones sunitas sobre su creación a partir de la luz, su impecabilidad, Iblis, Harut y Marut, el interrogatorio de Munkar y Nakir y su jerarquía con respecto a los humanos, y luego las enseñanzas imamíes e ismaelitas sobre los ángeles y los imanes."
  fr: "La croyance aux anges est un pilier de la foi sunnite (voir: aqida-tahawiyya §72). L’Encyclopédie de l’Islam explique que le terme est le pluriel d’un ancien terme sémitique signifiant « messager » et souligne l’importance accordée dans le Coran à l’obéissance absolue des anges. Elle présente les débats sunnites sur leur création à partir de la lumière, leur pureté, Iblis, Harut et Marut, les questions posées par Munkar et Nakir et leur hiérarchie par rapport aux humains, puis les enseignements imamites et ismaéliens sur les anges et les imams."
  tr: "Sünni inancında melekler inancın temel direkleridir ve İslam Ansiklopedisi, onların sözünün eski bir Semitik kelime olan elçi anlamına gelen bozuk çoğulu olduğunu ve Kur'an'ın onların Allah'a tam itaatini teyit ettiğini belirtir. Makale, Ahl-al-Sünnet âlimlerinin yaratılışları hakkındaki söylediklerini, yanmazlıkları meselesini, İblis, Harut, Marut'un, inkâr ve inkâr sorgulamalarını, insanlara üstünlüklerini, ardından İmam ve İsmaili görüşlerini ve imamlarla ve ruhani dünya saflarıyla ilişkilerini {cite:aqida-tahawiyya §72} ele alır."
  id: "Dalam ajaran Sunni, malaikat adalah tiang iman, dan Ensiklopedia Islam menyatakan bahwa kata mereka adalah bentuk jamak yang pecah dari kata Semitik kuno yang berarti utusan, dan Al-Qur'an menegaskan ketaatan penuh mereka kepada Tuhan. Artikel ini menyajikan apa yang dikatakan para ulama Ahl al-Sunnah tentang penciptaan mereka, masalah ketidaksalahan mereka, Iblis, Harut, Marut, pertanyaan tentang penyangkalan dan penyangkalan, keunggulan mereka atas manusia, lalu pandangan Imami dan Ismaili mengenai hubungan mereka dengan Imam dan jajaran dunia spiritual {cite:aqida-tahawiyya §72}."
