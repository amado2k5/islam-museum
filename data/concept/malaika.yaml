label:
  ar: الملائكة في الإسلام
  en: Angels in Islam (mala'ika)
  ur: فرشتے
summary:
  ar: "الملائكة في العقيدة السنية ركن من أركان الإيمان، وتقول دائرة المعارف الإسلامية إن لفظهم جمع تكسير لكلمة سامية قديمة بمعنى رسول، وإن القرآن يؤكد تمام طاعتهم لله. وتعرض المقالة ما قاله علماء أهل السنة في خلقهم من نور ومسألة عصمتهم وإبليس وهاروت وماروت وسؤال منكر ونكير وتفاضلهم مع البشر، ثم الرأي الإمامي والإسماعيلي في صلتهم بالأئمة وبمراتب العالم الروحي {cite:aqida-tahawiyya §72}."
  en: "Belief in the angels is a pillar of faith in Sunni creed {cite:aqida-tahawiyya §72}. The Encyclopaedia of Islam explains the word as the plural of an old Semitic term meaning messenger and reports the Qur'anic stress on the angels' complete obedience. It sets out Sunni discussions of their creation from light, their impeccability, Iblis, Harut and Marut, the questioning by Munkar and Nakir and their rank against humans, then the Imami and Isma'ili teachings on angels and the Imams."
  ur: "اہلِ سنت کے عقیدے میں فرشتوں پر ایمان رکنِ ایمان ہے۔ دائرۂ معارفِ اسلامیہ بتاتا ہے کہ یہ لفظ ایک قدیم سامی لفظ کی جمع ہے جس کا مطلب قاصد ہے، اور قرآن فرشتوں کی کامل اطاعت پر زور دیتا ہے۔ مضمون نور سے ان کی تخلیق، عصمت، ابلیس، ہاروت و ماروت، منکر نکیر کے سوال اور انسانوں سے ان کی فضیلت پر سنی بحثیں پیش کرتا ہے، پھر ائمہ سے ان کے تعلق پر امامی اور اسماعیلی تعلیم۔"
