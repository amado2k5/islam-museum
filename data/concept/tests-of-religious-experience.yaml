summary:
  ar: "معياران يقترحهما محمد إقبال للنظر في دعاوى التجربة الدينية: الاختبار العقلي، وهو التفسير النقدي الذي يبيّن هل تفضي الدعوى إلى حقيقة من طبيعة ما كشفته التجربة، والاختبار العملي، وهو الحكم على التجربة بثمارها. ويرى أن الأول شأن الفيلسوف والثاني شأن النبي، وأنه سيطبق الأول في المحاضرة الثانية."
  en: "Two criteria that Muhammad Iqbal proposes for weighing the claims of religious experience: an intellectual test, a critical interpretation asking whether the claim leads to a reality of the same character as the experience reveals; and a pragmatic test, judging the experience by its fruits. He assigns the first to the philosopher and the second to the prophet, and says he will apply the intellectual test in Lecture II."
