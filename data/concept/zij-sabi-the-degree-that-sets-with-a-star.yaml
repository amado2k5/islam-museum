id: concept/zij-sabi-the-degree-that-sets-with-a-star
class: concept
kind: scientific
label: { ar: "الدرجة التي يغيب معها الكوكب ونظيرتها", en: "The degree that sets with a star and its opposite", ur: "وہ درجہ جس کے ساتھ ستارہ غروب ہوتا ہے اور اس کا نظیر" }
summary:
  ar: "لمعرفة الدرجة التي يغيب منها الكوكب تؤخذ الأزمان التي بإزاء الدرجة النظيرة للدرجة التي تتوسط السماء مع الكوكب في ذلك الإقليم، ثم تُزاد عليها نصف اختلاف النهارين إن كان نصف قوس الكوكب أكبر، وتُنقص منها إن كان أقل، فيخرج مطلع الدرجة المقابلة للدرجة التي يغيب معها، ونظيرتها هي التي تغرب مع غروب الكوكب. {cite:zij-sabi-nallino-byblion p.54}."
  en: "To find the degree at which a star sets, one takes the times against the degree opposite to the one that culminates with the star in that clime and adds half the difference of the two days if the star's half arc is the larger or subtracts it if it is the smaller; the result is the rising of the degree opposite to the setting degree, and the opposite of that degree is the one that sets with the star. {cite:zij-sabi-nallino-byblion p.54}."
  ur: "جس درجے پر ستارہ غروب ہوتا ہے اسے جاننے کے لیے اس اقلیم میں اس درجے کے نظیر کے مقابل ازمان لیے جاتے ہیں جو ستارے کے ساتھ وسط السماء میں آتا ہے، پھر اگر ستارے کی نصف قوس بڑی ہو تو ان میں دونوں دنوں کے فرق کا نصف جمع کیا جاتا ہے، چھوٹی ہو تو گھٹایا جاتا ہے؛ نتیجہ اس درجے کے مقابل درجے کا مطلع ہے جس کے ساتھ ستارہ غروب ہوتا ہے، اور اس کا نظیر ہی ستارے کے غروب کے ساتھ ڈوبتا ہے۔ {cite:zij-sabi-nallino-byblion p.54}۔"
