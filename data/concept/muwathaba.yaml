label: { ar: "المُوَاثَبَة (في الشفعة)", en: "Prompt claim (muwathaba) to pre-emption", ur: "مواثبت (شفعہ کا فوری مطالبہ)" }
summary:
  ar: "المواثبة في اللغة الوثوب والمبادرة، وفي الشفعة طلبها على وجه السرعة والمبادرة. وهي مشروعة بالأثر «الشفعة لمن واثبها»، واختلف الفقهاء في وقتها هل هي على الفور أو تمتد، وفي الإشهاد عليها، هل هو شرط صحة أو لإثبات الحق عند الإنكار."
  en: "Muwathaba in the lexicon is leaping or hastening; in pre-emption it is the claim made at once and without delay. It is based on the saying: 'pre-emption belongs to him who leaps to claim it'. The jurists differ on whether the claim must be immediate or may extend, and on whether witnessing the claim is a condition of its validity or only a proof if the claim is denied."
  ur: "مواثبت لغت میں کودنے اور جلدی کرنے کو کہتے ہیں، اور شفعہ میں فوری مطالبہ کرنا ہے۔ فقہاء کا اختلاف ہے کہ یہ فوری ہو یا مدت تک، اور گواہ بنانا شرط ہے یا محض ثبوت کے لیے۔"
