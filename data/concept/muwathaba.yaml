label: { ar: "المُوَاثَبَة ⁦(في الشفعة)⁩", en: "Prompt claim (muwathaba) to pre-emption", ur: "مواثبت ⁦(شفعہ کا فوری مطالبہ)⁩", es: "Reclamación inmediata (muwathaba) para la preeminencia", fr: "Droit de préemption (muwathaba)", tr: "Karşılıklı Söz (Öncelikle)", id: "Janji Bersama (dalam Preemption)" }
summary:
  ar: "المواثبة في اللغة الوثوب والمبادرة، وفي الشفعة طلبها على وجه السرعة والمبادرة. وهي مشروعة بالأثر «الشفعة لمن واثبها»، واختلف الفقهاء في وقتها هل هي على الفور أو تمتد، وفي الإشهاد عليها، هل هو شرط صحة أو لإثبات الحق عند الإنكار."
  en: "Muwathaba in the lexicon is leaping or hastening; in pre-emption it is the claim made at once and without delay. It is based on the saying: 'pre-emption belongs to him who leaps to claim it'. The jurists differ on whether the claim must be immediate or may extend, and on whether witnessing the claim is a condition of its validity or only a proof if the claim is denied."
  ur: "مواثبت لغت میں کودنے اور جلدی کرنے کو کہتے ہیں، اور شفعہ میں فوری مطالبہ کرنا ہے۔ فقہاء کا اختلاف ہے کہ یہ فوری ہو یا مدت تک، اور گواہ بنانا شرط ہے یا محض ثبوت کے لیے۔"
  es: "En el léxico, Muwathaba significa apresurarse o precipitarse; en el ámbito del derecho de tanteo, se refiere a la reclamación realizada de inmediato y sin demora. Se basa en el dicho: «El derecho de tanteo pertenece a quien se apresura a reclamarlo». Los juristas discrepan sobre si la reclamación debe ser inmediata o puede extenderse, y sobre si la presencia de testigos es condición para su validez o solo prueba en caso de que la reclamación sea negada."
  fr: "Le terme « muwathaba » signifie « bondir » ou « se hâter »; en matière de préemption, il désigne une revendication faite immédiatement et sans délai. Ce concept repose sur l'adage: « La préemption appartient à celui qui se précipite pour la revendiquer ». Les juristes divergent quant à la nécessité d'une revendication immédiate ou à sa possibilité d'être différée, et quant à la question de savoir si la présence de témoins est une condition de validité de la revendication ou une simple preuve en cas de contestation."
  tr: "Dil açısından eşdeğeri sıçrama ve inisiyatiftir; önlem durumunda ise hızlı ve hızlı bir şekilde aranır. Raporda şöyle yasalaştırılmıştır: 'Öncelik, onu onaylayan kişi içindir.' O dönemde hukukçular, bunun hemen mi yoksa genişletilmiş mi olduğu ve ifade verme için bir koşul mu yoksa reddedilme durumunda hakkın mı tesis edilmesi konusunda farklı görüşteydi."
  id: "Dalam bahasa, padanan adalah lompatan dan inisiatif, sedangkan dalam kasus preemption, hal itu dicari dengan cepat dan cepat. Peraturan ini diatur dalam laporan: 'Preemption adalah untuk orang yang mengonfirmasinya.' Para ahli hukum pada waktu itu berbeda apakah itu langsung atau diperluas, dan apakah itu merupakan syarat untuk kesaksian atau untuk menetapkan hak dalam kasus penolakan."
