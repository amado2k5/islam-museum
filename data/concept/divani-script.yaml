label: { ar: "الخط الديواني", en: "Divani script", ur: "خطِ دیوانی", es: "Guion de Divani", fr: "Écriture Divani", tr: "Diwani yazısı", id: "Aksara Diwani" }
summary:
  ar: "خط ديوان السلطنة العثمانية، معناه «المنسوب إلى الديوان»، كتبت به متون الفرامين، متشابك متراص عسير القراءة، تتداخل حروفه وكلماته صاعدة قليلًا كمقدم السفينة {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 45}."
  en: "The chancery script of the Ottoman Imperial Council — \"of the divan\" — used for the body of firmans; intricate, compact and hard to read, its letters and words intertwine in a slight upward slope like a ship's bow {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 45}."
  ur: "عثمانی دیوانِ ہمایوں کا خط — «دیوان سے منسوب» — جس میں فرامین کا متن لکھا جاتا؛ پیچیدہ، گٹھا اور مشکل خواں، اس کے حروف و الفاظ کشتی کے اگلے حصے کی طرح ذرا اوپر اٹھتے ہوئے گتھے ہوتے ہیں {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 45}۔"
  es: "La escritura cancilleresca del Consejo Imperial Otomano —\"del diván\"— utilizada para el cuerpo de los firmans; intrincada, compacta y difícil de leer, sus letras y palabras se entrelazan en una ligera pendiente ascendente como la proa de un barco {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 45}."
  fr: "L'écriture de chancellerie du Conseil impérial ottoman — « du divan » — utilisée pour le corps des firmans; complexe, compacte et difficile à lire, ses lettres et ses mots s'entrelacent dans une légère pente ascendante comme la proue d'un navire {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 45}."
  tr: "Osmanlı Sultanlığı'nın Diwanı'nın yazı sistemi, 'Diwan'a atfedilen' anlamına gelir ve Framin'in metinlerini yazmak için kullanılmıştır; metinler iç içe geçmiş ve okunması zordur; harfleri ve kelimeleri geminin ön yüzü gibi hafifçe iç içe geçmiştir {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 s. 27} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 s. 45}."
  id: "Aksara Diwan Kesultanan Ottoman, yang berarti 'dikaitkan dengan Diwan,' digunakan untuk menulis teks Framin, saling terkait dan sulit dibaca, dengan huruf dan kata-katanya sedikit saling terkait seperti bagian depan kapal {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 hlm. 27} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 hlm. 45}."
