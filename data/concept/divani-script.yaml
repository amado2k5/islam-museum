  ur: "عثمانی دیوانِ ہمایوں کا خط — «دیوان سے منسوب» — جس میں فرامین کا متن لکھا جاتا؛ پیچیدہ، گٹھا اور مشکل خواں، اس کے حروف و الفاظ کشتی کے اگلے حصے کی طرح ذرا اوپر اٹھتے ہوئے گتھے ہوتے ہیں {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 45}۔"
