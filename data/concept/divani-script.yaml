  ar: "خط ديوان السلطنة العثمانية، معناه «المنسوب إلى الديوان»، كتبت به متون الفرامين، متشابك متراص عسير القراءة، تتداخل حروفه وكلماته صاعدة قليلًا كمقدم السفينة {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 45}."
