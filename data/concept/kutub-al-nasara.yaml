label: { ar: "أسفار النصارى", en: "The Christian canon" }
summary:
  ar: "ضبط ابن النديم أسفار النصارى: الصورة الحديثة وتحتوي على الأناجيل الأربعة إنجيل متى ومرقس ولوقا ويوحنا، وكتاب الحواريين ويعرف ببراكسيس، وبولس الصليح أربع وعشرون رسالة، ولهم كتب في الفقه والأحكام منها كتاب سينودس المغربي والمشرقي وكل واحد يحتوي على عدة كتب، ومن حكامهم في الشريعة والفتاوى عبد يشوع بن بهرير وكان أولاً مطران حران ثم صار مطران الموصل وحزة وله رسائل وكتب منها كتاب المرقس اليعقوبي وكان قريباً من حكمة الإسلام ونقل من كتب المنطق والفلسفة شيئاً كثيراً، ومنهم فثيون أصح الناقلين نقلاً وأحسنهم عبارة وتيادورس ويوشع بخت وحزقيل وطماثاوس ويوسع بن بد، ومن علمائهم تاوما الرباوي وله رسالة إلى أخته فيما جرى بينه وبين المخالفين بالإسكندرية ولإيليا مطران دمشق كتاب الدعاء، وأبو قره وكان أسقف الملكية بحران وله كتاب يطعن فيه على أنسطورس الرئيس {cite:fihrist-ibn-al-nadim p. 57-58}."
  en: "The four Gospels, Acts, Paul's epistles, the Synods — and the Christian scholars Abdishu, Abu Qurra and the translators {cite:fihrist-ibn-al-nadim p. 57-58}."
