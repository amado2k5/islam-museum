label: { ar: "أسفار النصارى", en: "The Christian canon", es: "El canon cristiano", fr: "Le canon chrétien", ur: "عیسائی کینن", tr: "Christian Books", id: "Buku Kristen" }
summary:
  ar: "ضبط ابن النديم أسفار النصارى: الصورة الحديثة وتحتوي على الأناجيل الأربعة إنجيل متى ومرقس ولوقا ويوحنا، وكتاب الحواريين ويعرف ببراكسيس، وبولس الصليح أربع وعشرون رسالة، ولهم كتب في الفقه والأحكام منها كتاب سينودس المغربي والمشرقي وكل واحد يحتوي على عدة كتب، ومن حكامهم في الشريعة والفتاوى عبد يشوع بن بهرير وكان أولاً مطران حران ثم صار مطران الموصل وحزة وله رسائل وكتب منها كتاب المرقس اليعقوبي وكان قريباً من حكمة الإسلام ونقل من كتب المنطق والفلسفة شيئاً كثيراً، ومنهم فثيون أصح الناقلين نقلاً وأحسنهم عبارة وتيادورس ويوشع بخت وحزقيل وطماثاوس ويوسع بن بد، ومن علمائهم تاوما الرباوي وله رسالة إلى أخته فيما جرى بينه وبين المخالفين بالإسكندرية ولإيليا مطران دمشق كتاب الدعاء، وأبو قره وكان أسقف الملكية بحران وله كتاب يطعن فيه على أنسطورس الرئيس {cite:fihrist-ibn-al-nadim p. 57-58}."
  en: "The four Gospels, Acts, Paul's epistles, the Synods — and the Christian scholars Abdishu, Abu Qurra and the translators {cite:fihrist-ibn-al-nadim p. 57-58}."
  es: "Los cuatro Evangelios, los Hechos de los Apóstoles, las epístolas de Pablo, los Sínodos y los eruditos cristianos Abdishu, Abu Qurra y los traductores {cite:fihrist-ibn-al-nadim p. 57-58}."
  fr: "Les quatre Évangiles, les Actes, les épîtres de Paul, les Synodes — et les érudits chrétiens Abdishu, Abu Qurra et les traducteurs {cite:fihrist-ibn-al-nadim p. 57-58}."
  ur: "چار انجیلیں، اعمال، پولس کے خطوط، Synods - اور عیسائی علماء عبدیشو، ابو قرہ اور مترجم {حوالہ دیتے ہیں: فہرست ابن الندیم ص. 57-58}۔"
  tr: "İbn el-Nadim, dört İncil'i—Matta, Markos, Luka ve Yuhanna—ve Praxis olarak bilinen Havariler Kitabı'nı içeren Hristiyanların Kitapları: Modern versiyonunu derledi. Doğru Pavlus yirmi dört mektup yazdı. Ayrıca fıkıh ve hükümler üzerine de yazdılar; bunlar arasında Mağrip Sinodu ve Meşriki de vardı; her biri birkaç kitap içeriyordu. Şeriat ve fetvalarda hükümdarları arasında, önce Harran, sonra Musul ve Hazza piskoposu olan Abd Joshua ibn Buhrir vardı. Markos Yakubi kitabı da dahil olmak üzere, İslam'ın hikmetine yakın olan ve mantık kitaplarından alıntılanan eserler yazdı. Felsefe bolca vardır; en gerçek ve en doğru iletimi ileden Pisyanlar da vardır; bunlar arasında Theodorus, Yeşu Bakht, Hezekiel, Timoteos ve Bad'ın oğlu Yeşu bulunur. Onların bilginleri arasında, İskenderiye'deki muhaliflerle arasında yaşananları anlatan kız kardeşine bir mektup yazan Tauma al-Rabawi, Şam piskoposu İlyas, Yalvarışlar Kitabı ve Bahreyn krallığının piskoposu olan ve cumhurbaşkanının Ansiklopedisi'ne meydan okuyan bir kitap yazan Ebu Kara da vardır."
  id: "Ibn al-Nadim menyusun Kitab Orang Kristen: Versi Modern, yang memuat empat Injil—Matius, Markus, Lukas, dan Yohanes—serta Kitab Para Rasul yang dikenal sebagai Praxis. Paulus yang Benar menulis dua puluh empat surat. Mereka juga menulis tentang yurisprudensi dan keputusan, termasuk Sinode Maghreb dan Mashriqi, masing-masing memuat beberapa kitab. Di antara penguasa mereka dalam Syariah dan fatwa adalah Abd Joshua ibn Buhrir, yang pertama kali menjadi uskup Harran, kemudian uskup Mosul dan Hazza. Ia menulis risalah, termasuk kitab Markus si Jacobite, yang dekat dengan kebijaksanaan Islam dan dikutip dari buku-buku logika Filsafat sangat melimpah, termasuk Pythian yang menyampaikan transmisi paling otentik dan akurat, termasuk Theodorus, Joshua Bakht, Yehezkiel, Timotius, dan Yosua putra Bad. Di antara para sarjana mereka adalah Tauma al-Rabawi, yang menulis surat kepada saudara perempuannya mengenai apa yang terjadi antara dia dan para lawan di Alexandria, serta Elijah, uskup Damaskus, Kitab Permohonan, dan Abu Qara, yang merupakan uskup kerajaan Bahrain dan menulis sebuah buku yang menantang Ensiklopedia presiden {cite:fihrist-ibn-al-nadim hlm. 57-58}."
