label: { ar: "نِياحة", en: "Niyaha (wailing over the dead: its ruling, the dead's punishment, and hire)" }
summary:
  ar: "النياحة في اللغة البكاء بصوت عال كالعويل، واختلفت عبارات الفقهاء في تعريفها: فعند الحنفية البكاء مع ندب الميت أي تعديد محاسنه، وعند الشافعية وأكثر المالكية رفع الصوت بالندب ولو بلا بكاء، وعند الحنابلة رفع الصوت بالندب بِرنّة أو كلام مسجّع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16701} ويفترق عن البكاء والرثاء والتعزية والنعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16702} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16703} والنياحة محرمة عند المالكية والشافعية والحنابلة، ومكروهة كراهة تحريم عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16703} وأحاديث النهي عن النياحة كثيرة، منها حديث أم عطية في البيعة وحديث عائشة في الدفن بالتراب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16703} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16704} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16705} والمالكية يفرقون في البكاء على المريض قبل موته، وعند بعضهم إباحة الصياح قبل الوفاة إذا لم يقترن بقول قبيح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16706} ويتجه جمهور الفقهاء إلى أن الميت لا يعذب بالنياحة عليه إلا إذا أوصى بها، وقال بعض الصحابة بالعذاب بالنياحة، وتأول الفقهاء ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16707} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16708} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16709} والوصية بالنياحة باطلة محرمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16709} ويجب على الإمام زجر النائحة وتعزيرها عند الجمهور، وقال غيرهم بالنهي والإمهال دون الضرب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16709} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16710} والاستئجار على النياحة باطل، والكسب منها خبيث عند الجمهور، وأجاز الحنفية الأجرة إن كانت العادة جارية بها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16710} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16711}"
  en: "Niyaha in the lexical sense is wailing aloud, as in keening; the jurists' definitions differ: for the Hanafis it is weeping with praise of the dead, its good qualities enumerated; for the Shafi'is and most Malikis it is raising the voice in lament, even without weeping; for the Hanbalis it is raising the voice in lament with a chanted or rhymed cry. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16701} It differs from weeping, elegy, condolence and the announcement of death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16702} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16703} The majority hold wailing forbidden; the Hanafis hold it disliked in the sense of forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16703} The prophetic prohibitions are many, including the report of Umm Atiyya at the pledge and that of Aisha on throwing dust into the mouths of mourners. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16703} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16704} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16705} Some Malikis allow loud weeping over a dying man when no ugly words are added. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16706} Most jurists hold that the dead is punished for wailing over him only if he bequeathed it; some reports from Umar and Ibn Umar take it otherwise, and the jurists interpret the hadith. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16707} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16708} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16709} A bequest to wail is void and forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16709} The imam must discipline a wailing woman according to the majority; others counsel and give respite without beating. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16709} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16710} Hire for wailing is void, and its earnings are unlawful according to the majority; the Hanafis allow a fee where custom makes it expected. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16710} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16711}"
