label: { ar: "نِياحة", en: "Niyaha (wailing over the dead: its ruling, the dead's punishment, and hire)", es: "Niyaha (lamento por los muertos: su dictamen, el castigo de los muertos y su remuneración)", fr: "Niyaha (lamentations sur les morts: son jugement, le châtiment des morts et sa rémunération)", ur: "نیاہ ⁦(مرنے پر نوحہ: اس کا حکم، مردہ کی سزا اور اجرت)⁩" }
summary:
  ar: "النياحة في اللغة البكاء بصوت عال كالعويل، واختلفت عبارات الفقهاء في تعريفها: فعند الحنفية البكاء مع ندب الميت أي تعديد محاسنه، وعند الشافعية وأكثر المالكية رفع الصوت بالندب ولو بلا بكاء، وعند الحنابلة رفع الصوت بالندب بِرنّة أو كلام مسجّع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16701} ويفترق عن البكاء والرثاء والتعزية والنعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16702} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16703} والنياحة محرمة عند المالكية والشافعية والحنابلة، ومكروهة كراهة تحريم عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16703} وأحاديث النهي عن النياحة كثيرة، منها حديث أم عطية في البيعة وحديث عائشة في الدفن بالتراب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16703} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16704} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16705} والمالكية يفرقون في البكاء على المريض قبل موته، وعند بعضهم إباحة الصياح قبل الوفاة إذا لم يقترن بقول قبيح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16706} ويتجه جمهور الفقهاء إلى أن الميت لا يعذب بالنياحة عليه إلا إذا أوصى بها، وقال بعض الصحابة بالعذاب بالنياحة، وتأول الفقهاء ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16707} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16708} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16709} والوصية بالنياحة باطلة محرمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16709} ويجب على الإمام زجر النائحة وتعزيرها عند الجمهور، وقال غيرهم بالنهي والإمهال دون الضرب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16709} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16710} والاستئجار على النياحة باطل، والكسب منها خبيث عند الجمهور، وأجاز الحنفية الأجرة إن كانت العادة جارية بها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16710} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16711}"
  en: "Niyaha in the lexical sense is wailing aloud, as in keening; the jurists' definitions differ: for the Hanafis it is weeping with praise of the dead, its good qualities enumerated; for the Shafi'is and most Malikis it is raising the voice in lament, even without weeping; for the Hanbalis it is raising the voice in lament with a chanted or rhymed cry. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16701} It differs from weeping, elegy, condolence and the announcement of death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16702} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16703} The majority hold wailing forbidden; the Hanafis hold it disliked in the sense of forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16703} The prophetic prohibitions are many, including the report of Umm Atiyya at the pledge and that of Aisha on throwing dust into the mouths of mourners. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16703} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16704} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16705} Some Malikis allow loud weeping over a dying man when no ugly words are added. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16706} Most jurists hold that the dead is punished for wailing over him only if he bequeathed it; some reports from Umar and Ibn Umar take it otherwise, and the jurists interpret the hadith. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16707} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16708} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16709} A bequest to wail is void and forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16709} The imam must discipline a wailing woman according to the majority; others counsel and give respite without beating. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16709} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16710} Hire for wailing is void, and its earnings are unlawful according to the majority; the Hanafis allow a fee where custom makes it expected. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16710} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16711}"
  es: "Niyaha en el sentido léxico es gemir en voz alta, como en lamento; las definiciones de los juristas difieren: para los Hanafis es llorar con alabanza de los muertos, enumerando sus buenas cualidades; para los Shafi'is y la mayoría de los Malikis es elevar la voz en lamento, incluso sin llorar; para los Hanbalis es elevar la voz en lamento con un grito cantado o rimado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16701} Se diferencia del llanto, la elegía, la condolencia y el anuncio de la muerte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16702} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16703} La mayoría considera que el gemido está prohibido; los Hanafis lo consideran desaconsejable en el sentido de prohibido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16703} Las prohibiciones proféticas son muchas, incluyendo el informe de Umm Atiyya en la promesa y el de Aisha sobre arrojar polvo en la boca de los dolientes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16703} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16704} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16705} Algunos malikíes permiten el llanto fuerte sobre un hombre moribundo cuando no se agregan palabras hirientes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16706} La mayoría de los juristas sostienen que el muerto es castigado por lamentarse sobre él solo si lo legó; Algunos informes de Umar e Ibn Umar lo toman de otra manera, y los juristas interpretan el hadiz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16707} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16708} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16709} Una petición para llorar es nula y prohibida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16709} El imán debe disciplinar a una mujer que llora según la mayoría; otros aconsejan y dan respiro sin golpear. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16709} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16710} El pago por lamentarse es nulo y sus ganancias son ilícitas según la mayoría; los hanafíes permiten una tarifa donde la costumbre lo exige. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16710} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16711}"
  fr: "Le terme « niyaha », au sens littéral, désigne les lamentations à voix haute, comme des gémissements. Les définitions des juristes divergent: pour les hanafites, il s’agit de pleurer en louant le défunt et en énumérant ses qualités; pour les chaféites et la plupart des malikites, il s’agit d’élever la voix en signe de lamentation, même sans pleurer; pour les hanbalites, il s’agit d’élever la voix en signe de lamentation, par un chant ou un cri rimé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16701} Cela diffère des pleurs, de l’élégie, des condoléances et de l’annonce du décès. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16702} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16703} La majorité considère les lamentations comme interdites; les hanafites les jugent simplement déconseillées, au sens d’interdites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16703} Les interdictions prophétiques sont nombreuses, notamment le récit d'Umm Atiyya concernant le serment et celui d'Aïcha sur le fait de jeter de la poussière dans la bouche des personnes en deuil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16703} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16704} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16705} Certains malikites autorisent les pleurs bruyants sur un mourant tant qu'aucune parole injurieuse n'est prononcée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16706} La plupart des juristes estiment que le défunt n'est puni pour ses lamentations que s'il les a lui-même léguées. Certains récits d'Umar et d'Ibn Umar présentent une version différente, et les juristes interprètent le hadith autrement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16707} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16708} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16709} Un legs destiné à engendrer des lamentations est nul et interdit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16709} L'imam doit, selon l'avis majoritaire, discipliner une femme qui pleure; d'autres conseillent et accordent un répit sans violence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16709} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16710} La rémunération des lamentations est nulle et les revenus qui en découlent sont illicites selon la majorité; les hanafites autorisent une rémunération lorsque la coutume l’exige. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16710} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16711}"
  ur: "نیاہ لغوی معنوں میں اونچی آواز میں رونا ہے، جیسا کہ کیننگ میں؛ فقہاء کی تعریفیں مختلف ہیں: احناف کے نزدیک یہ میت کی تعریف کے ساتھ رونا ہے، اس کی خوبیاں بیان کی گئی ہیں۔ شافعیوں اور اکثر مالکیوں کے لیے یہ نوحہ کی آواز بلند کر رہا ہے، یہاں تک کہ روئے بغیر۔ حنبلیوں کے لیے یہ نوحہ خوانی کے ساتھ آواز بلند کرتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16701} یہ رونے، تعزیت، تعزیت اور موت کے اعلان سے مختلف ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.16702} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16703} اکثریت نے نوحہ کو حرام قرار دیا ہے۔ احناف اسے حرام کے معنی میں ناپسندیدہ سمجھتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 16703} پیغمبرانہ ممانعتیں بہت سی ہیں جن میں بیعت میں ام عطیہ اور حضرت عائشہ ا کی سوگواروں کے منہ میں مٹی ڈالنے کی روایت بھی شامل ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16703} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16704} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16705} بعض الفاظ جب ہم مالکی سے زیادہ استعمال کرتے ہیں تو ہم اجازت نہیں دیتے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 16706} اکثر فقہاء کا خیال ہے کہ مردہ کو اس پر نوحہ کرنے کی سزا صرف اسی صورت میں دی جاتی ہے جب وہ وصیت کرتا ہو۔ عمر اور ابن عمر کی بعض روایتیں اسے دوسری صورت میں لیتے ہیں اور فقہاء حدیث کی تفسیر کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16707} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16708} {حوالہ: فقہ الموسوعة کویتیہ نور-v3 صفحہ 16709} وصیت اور وصیت کی جاتی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 16709} امام کو چاہیے کہ ایک نوحہ کرنے والی عورت کو اکثریت کے مطابق تنبیہ کرے۔ دوسروں کو مشورہ دیتے ہیں اور مار پیٹ کے بغیر مہلت دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16709} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص16710} نوحہ کرنے کا کرایہ باطل ہے، اور اس کی کمائی جمہور کے مطابق حرام ہے۔ احناف اس فیس کی اجازت دیتے ہیں جہاں حسب ضرورت اس کی توقع ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16710}"
