id: concept/hisab-al-dalala-ala-al-huda-wal-dalala
class: concept
kind: doctrine
label:
  ar: "الدعوة إلى هدى أو ضلالة: مثل أجور وآثام من تبع"
  en: "Calling to guidance or to error: the like of the rewards and sins of those who follow"
  ur: "ہدایت یا گمراہی کی دعوت: پیروی کرنے والوں کے اجر اور گناہ کے برابر"
  es: "Llamar a la guía o al error: semejantes a las recompensas y los pecados de quienes siguen"
  fr: "Appeler à la sagesse ou à l'erreur: à l'image des récompenses et des péchés de ceux qui suivent"
  tr: "Rehberlik veya yanlış yönlendirmeye çağırmak: örneğin takip edenlerin ödülleri ve günahları"
  id: "Memanggil petunjuk atau kesalahan: seperti hadiah dan dosa mereka yang mengikuti"
summary:
  ar: "من دعا إلى هدى كان له من الأجر مثل أجور من تبعه لا ينقص ذلك من أجورهم شيئا، ومن دعا إلى ضلالة كان عليه من الإثم مثل آثام من تبعه [[passage/muslim-2674]]، ومثله من سنّ في الإسلام سنة حسنة أو سنة سيئة، فله أجرها وأجر من عمل بها أو عليه وزرها ووزر من عمل بها [[passage/muslim-1017]]. وهذا حساب متصل لا ينغلق بانتهاء العمل: العدّاد يستمر ما دام هناك من يتبع، في الاتجاهين."
  en: "Whoever calls to guidance has a reward like the rewards of those who follow him, without anything being taken from theirs, and whoever calls to error bears a sin like the sins of those who follow him [[passage/muslim-2674]]; likewise whoever sets a good or a bad practice in Islam has its reward and the reward of those who act on it, or its burden and the burden of those who act on it [[passage/muslim-1017]]. This is a running account that does not close when the act ends: the counter keeps going as long as someone follows, in both directions."
  ur: "جو ہدایت کی طرف بلائے اسے پیروی کرنے والوں کے اجر کے برابر اجر ملتا ہے اور ان کے اجر میں کچھ کمی نہیں ہوتی، اور جو گمراہی کی طرف بلائے اس پر پیروی کرنے والوں کے گناہوں کے برابر گناہ ہوتا ہے [[passage/muslim-2674]]؛ اسی طرح جو اسلام میں اچھا یا برا طریقہ جاری کرے اسے اس کا اجر اور عمل کرنے والوں کا اجر ملتا ہے یا اس کا بوجھ اور عمل کرنے والوں کا بوجھ [[passage/muslim-1017]]۔ یہ چلتا ہوا کھاتہ ہے جو عمل ختم ہونے پر بند نہیں ہوتا: جب تک کوئی پیروی کرتا رہے گنتی دونوں سمتوں میں جاری رہتی ہے۔"
  es: "Quien llama a la guía tiene una recompensa igual a la de quienes lo siguen, sin que se les quite nada, y quien llama al error carga con un pecado igual a los de quienes lo siguen [[passage/muslim-2674]]; asimismo, quien establece una buena o una mala práctica en el Islam tiene su recompensa y la de quienes la practican, o su carga y la de quienes la practican [[passage/muslim-1017]]. Este es un registro continuo que no se cierra cuando termina la acción: el contador sigue avanzando mientras alguien siga, en ambas direcciones."
  fr: "Quiconque appelle à la bonne voie reçoit une récompense semblable à celle de ceux qui le suivent, sans que la leur ne soit diminuée; et quiconque appelle à l’erreur commet un péché semblable à celui de ceux qui le suivent [[passage/muslim-2674]]. De même, quiconque institue une bonne ou une mauvaise pratique en Islam en reçoit la récompense et celle de ceux qui la mettent en œuvre, ou en subit le fardeau et celui de ceux qui la mettent en œuvre [[passage/muslim-1017]]. Ce décompte est continu et ne s’arrête pas à la fin de l’acte: il se poursuit tant que quelqu’un le suit, dans les deux sens."
  tr: "Rehberi çağıran kişi, kendisini takip edenlerin ödülü gibi, ödülünü en ufak bir şekilde azaltmaz. Yanlış yola çağrı eden, onu takip edenlerin günahları gibi günah taşır [[passage/muslim-2674]]. Benzer şekilde, İslam'da iyi ya da kötü bir sünnet uygulayan kimsenin ödülü, ona göre hareket edenlerin ödülü ya da onun üzerindeki yükü ve ona göre hareket edenlerin yükü [[passage/muslim-1017]]. Bu, işin tamamlanmasıyla bitmeyen sürekli bir anlatımdır: karşı saldırı, takip edilecek biri olduğu sürece her iki yönde de devam eder."
  id: "Siapa pun yang memanggil kepada penasihat akan menerima ganjaran seperti mereka yang mengikutinya, yang tidak mengurangi ganjaran mereka sedikit pun. Siapa pun yang menyesatkan akan menanggung dosa seperti dosa mereka yang mengikutinya [[passage/muslim-2674]]. Demikian pula, siapa pun yang melaksanakan Sunnah baik atau buruk dalam Islam akan menerima ganjaran, ganjaran bagi mereka yang berbuat demikian, atau beban itu atas dirinya, dan beban mereka yang bertindak atas itu [[ayat/muslim-1017]]. Ini adalah catatan yang berkelanjutan dan tidak berakhir pada penyelesaian karya: perhitungan berlanjut selama ada seseorang untuk diikuti, ke kedua arah."
