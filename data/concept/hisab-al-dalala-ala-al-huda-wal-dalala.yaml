id: concept/hisab-al-dalala-ala-al-huda-wal-dalala
class: concept
kind: doctrine
label:
  ar: "الدعوة إلى هدى أو ضلالة: مثل أجور وآثام من تبع"
  en: "Calling to guidance or to error: the like of the rewards and sins of those who follow"
  ur: "ہدایت یا گمراہی کی دعوت: پیروی کرنے والوں کے اجر اور گناہ کے برابر"
summary:
  ar: "من دعا إلى هدى كان له من الأجر مثل أجور من تبعه لا ينقص ذلك من أجورهم شيئا، ومن دعا إلى ضلالة كان عليه من الإثم مثل آثام من تبعه [[passage/muslim-2674]]، ومثله من سنّ في الإسلام سنة حسنة أو سنة سيئة، فله أجرها وأجر من عمل بها أو عليه وزرها ووزر من عمل بها [[passage/muslim-1017]]. وهذا حساب متصل لا ينغلق بانتهاء العمل: العدّاد يستمر ما دام هناك من يتبع، في الاتجاهين."
  en: "Whoever calls to guidance has a reward like the rewards of those who follow him, without anything being taken from theirs, and whoever calls to error bears a sin like the sins of those who follow him [[passage/muslim-2674]]; likewise whoever sets a good or a bad practice in Islam has its reward and the reward of those who act on it, or its burden and the burden of those who act on it [[passage/muslim-1017]]. This is a running account that does not close when the act ends: the counter keeps going as long as someone follows, in both directions."
  ur: "جو ہدایت کی طرف بلائے اسے پیروی کرنے والوں کے اجر کے برابر اجر ملتا ہے اور ان کے اجر میں کچھ کمی نہیں ہوتی، اور جو گمراہی کی طرف بلائے اس پر پیروی کرنے والوں کے گناہوں کے برابر گناہ ہوتا ہے [[passage/muslim-2674]]؛ اسی طرح جو اسلام میں اچھا یا برا طریقہ جاری کرے اسے اس کا اجر اور عمل کرنے والوں کا اجر ملتا ہے یا اس کا بوجھ اور عمل کرنے والوں کا بوجھ [[passage/muslim-1017]]۔ یہ چلتا ہوا کھاتہ ہے جو عمل ختم ہونے پر بند نہیں ہوتا: جب تک کوئی پیروی کرتا رہے گنتی دونوں سمتوں میں جاری رہتی ہے۔"
