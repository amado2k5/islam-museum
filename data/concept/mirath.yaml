label:
  ar: "الميراث"
  en: "Inheritance (mirath)"
  ur: "میراث"
  es: "Herencia (mirath)"
  fr: "Héritage (mirath)"
  tr: "Miras"
  id: "Warisan"
summary:
  ar: "يحذّر الشيخ عمر عبد الكافي من حرمان وارث من ميراثه، ويقول إن من منع وارثا من إرثه منعه الله من إرثه في الجنة يوم القيامة (needs_source) {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:23:30}. ويذكّر بأن الله هو الذي حدّد الحدود وفرض الفرائض ووزّع المواريث، فليس للمرء أن يتدخل في توزيعها {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:23:30}."
  en: "Sheikh Omar Abdelkafy warns against denying an heir his inheritance, and says that whoever keeps an heir from his inheritance will be kept by God from his own inheritance in Paradise on the Day of Resurrection (needs_source) {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:23:30}. He reminds listeners that God is the one who set the limits, laid down the obligatory shares and distributed the estates, so a person has no right to interfere in their distribution {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:23:30}."
  ur: "شیخ عمر عبد الکافی وارث کو اس کی میراث سے محروم کرنے سے خبردار کرتے ہیں اور کہتے ہیں کہ جو کسی وارث کو اس کی میراث سے روکے گا اللہ اسے قیامت کے دن جنت میں اس کی میراث سے روک دے گا (needs_source) {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:23:30}۔ وہ یاد دلاتے ہیں کہ اللہ ہی نے حدود مقرر کیں، فرض حصے متعین کیے اور ترکے تقسیم کیے، اس لیے انسان کو ان کی تقسیم میں دخل دینے کا حق نہیں {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:23:30}۔"
  es: "El jeque Omar Abdelkafy advierte contra negarle a un heredero su herencia, y dice que quien le impida a un heredero su herencia será privado por Dios de la suya en el Paraíso el Día de la Resurrección (needs_source) {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:23:30}. Recuerda a los oyentes que Dios es quien estableció los límites, determinó las partes obligatorias y distribuyó las propiedades, por lo que una persona no tiene derecho a interferir en su distribución {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:23:30}."
  fr: "Le cheikh Omar Abdelkafy met en garde contre le fait de priver un héritier de son héritage et affirme que quiconque prive un héritier de son héritage sera lui-même privé par Dieu de son propre héritage au Paradis le Jour de la Résurrection. Il rappelle à ses auditeurs que c'est Dieu qui a fixé les limites, établi les parts obligatoires et distribué les biens, et que nul n'a donc le droit d'intervenir dans leur distribution."
  tr: "Şeyh Ömer Abdulkafi, varisinin mirasından mahrum bırakılmasına karşı uyarıda bulunur ve bir varisi mirasından mahrum bırakan kişinin Allah'ın Kıyamet Günü'nde (needs_source) cennetteki mirasını miras almasını engelleyeceğini söyler. {cite:assabile-omar-abdelkafy tafsir-al-kuran-al-kareem/ep02 00:23:30}. Sınırları koyan, yükümlülükleri koyan ve mirasları dağıtan kişinin Allah'tır, bu yüzden kimsenin dağıtımına müdahale edemez {cite:assabile-omar-abdelkafy tafsir-al-kuran-al-kareem/ep02 00:23:30}"
  id: "Sheikh Omar Abdulkafi memperingatkan agar tidak mencabut warisannya kepada ahli waris, dengan mengatakan bahwa siapa pun yang menahan ahli waris dari warisannya, Allah akan mencegahnya mewarisi warisannya di Surga pada Hari Penghakiman (needs_source) {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:23:30}. Ia menyebutkan bahwa Tuhanlah yang menetapkan batasan, menetapkan kewajiban, dan membagikan warisan, sehingga tidak ada yang boleh ikut campur dalam pembagian {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:23:30}."
