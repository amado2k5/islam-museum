id: concept/mirath
class: concept
kind: legal
label:
  ar: "الميراث"
  en: "Inheritance (mirath)"
  ur: "میراث"
summary:
  ar: "يحذّر الشيخ عمر عبد الكافي من حرمان وارث من ميراثه، ويقول إن من منع وارثا من إرثه منعه الله من إرثه في الجنة يوم القيامة (needs_source) {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:23:30}. ويذكّر بأن الله هو الذي حدّد الحدود وفرض الفرائض ووزّع المواريث، فليس للمرء أن يتدخل في توزيعها {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:23:30}."
  en: "Sheikh Omar Abdelkafy warns against denying an heir his inheritance, and says that whoever keeps an heir from his inheritance will be kept by God from his own inheritance in Paradise on the Day of Resurrection (needs_source) {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:23:30}. He reminds listeners that God is the one who set the limits, laid down the obligatory shares and distributed the estates, so a person has no right to interfere in their distribution {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:23:30}."
  ur: "شیخ عمر عبد الکافی وارث کو اس کی میراث سے محروم کرنے سے خبردار کرتے ہیں اور کہتے ہیں کہ جو کسی وارث کو اس کی میراث سے روکے گا اللہ اسے قیامت کے دن جنت میں اس کی میراث سے روک دے گا (needs_source) {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:23:30}۔ وہ یاد دلاتے ہیں کہ اللہ ہی نے حدود مقرر کیں، فرض حصے متعین کیے اور ترکے تقسیم کیے، اس لیے انسان کو ان کی تقسیم میں دخل دینے کا حق نہیں {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:23:30}۔"
