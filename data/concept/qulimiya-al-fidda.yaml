  en: "Qulimiya al-fidda (silver qulimiya, a mineral)"
  ur: "قلیمیا الفضة"
summary:
  ar: "قليميا الفضة في الكتاب قد يتخذ القليميا من الذهب والفضة والنحاس والمارقشيتا وهو ثفل يعلو السبك أو دخان، قريب من قليميا الذهب وأبرد، فيه تجفيف وجلاء باعتدال بلا لذع وخصوصا المغسول، ينفع من الجرب والقروح العسرة والرطبة في المراهم ذرورا {cite:canon-ibn-sina-print-v1 p.651}"
  en: "Qulimiya al-fidda is in the book a qulimiya that may be made from gold, silver, copper and marqashita, a dross that rises over the smelting, or a smoke; near the qulimiya of gold and colder, with drying and clearing in moderation without stinging, especially the washed; it benefits itch and stubborn and moist ulcers, in ointments as a powder {cite:canon-ibn-sina-print-v1 p.651}"
  ur: "قلیمیا الفضہ کتاب میں وہ قلیمیا ہے جو سونے، چاندی، تانبے اور مارقشیتا سے بن سکتا ہے، ایک تلچھٹ جو پگھلانے پر اوپر آتی ہے یا دھواں؛ سونے کے قلیمیا کے قریب اور اس سے زیادہ ٹھنڈا، اس میں اعتدال سے خشک کرنا اور جلا ہے بغیر جلن کے، خصوصاً دھویا ہوا؛ مرہموں میں سفوف کے طور پر خارش اور مشکل اور تر قرحوں میں نافع ہے {cite:canon-ibn-sina-print-v1 p.651}۔"
