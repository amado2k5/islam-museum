id: concept/muhla
class: concept
kind: legal
label: { ar: "المُهْلَة", en: "Respite (muhla) granted to a debtor, surety, rebels or a claimant", ur: "مہلت (مہلت دینا)" }
summary:
  ar: "المهلة في اللغة السكينة والرفق، وفي الفقه الإمهال أي إعطاء المدة لمن عليه حق أو لمن له حق ليؤدي أو يحضر أو يقدم بينته. ولها أحكام: إمهال الكفيل لإحضار المكفول، وإمهال المولي بعد مدة الإيلاء، وإمهال الشفيع لإحضار الثمن، وإمهال المكاتب عند عجزه عن النجم، وإمهال البغاة، وإمهال المدعي والمدعى عليه في الدعوى، وتأجيل تنفيذ الحد عن الحامل والمريض."
  en: "Muhla in the lexicon is calm and gentleness; in law it is the grant of time to one who owes a right, or to one who claims it, to pay, to produce a witness, or to appear. Its rules cover the surety who must produce the principal, the husband after the period of ila', the shafi' who must bring the price, the slave under a writing of freedom who cannot pay the instalment, rebels who ask for time, and the parties to a suit. The jurists also defer a stoning or retaliation until a pregnant woman has given birth, or until a sick man is healed."
  ur: "مہلت لغت میں سکون اور نرمی کو کہتے ہیں، اور فقہ میں اس سے مراد وہ مدت ہے جو حق دار یا ذمہ دار کو دی جائے تاکہ وہ ادا کرے، گواہ پیش کرے یا حاضر ہو۔ کفیل، شفیع، مکاتب، باغی اور فریقین مقدمہ کے لیے اس کے احکام بیان کیے گئے ہیں۔"
