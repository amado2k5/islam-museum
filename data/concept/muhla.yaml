label: { ar: "المُهْلَة", en: "Respite (muhla) granted to a debtor, surety, rebels or a claimant", ur: "مہلت ⁦(مہلت دینا)⁩", es: "Indulto (muhla) concedido a un deudor, fiador, rebelde o reclamante.", fr: "Répit (muhla) accordé à un débiteur, une caution, des rebelles ou un demandeur" }
summary:
  ar: "المهلة في اللغة السكينة والرفق، وفي الفقه الإمهال أي إعطاء المدة لمن عليه حق أو لمن له حق ليؤدي أو يحضر أو يقدم بينته. ولها أحكام: إمهال الكفيل لإحضار المكفول، وإمهال المولي بعد مدة الإيلاء، وإمهال الشفيع لإحضار الثمن، وإمهال المكاتب عند عجزه عن النجم، وإمهال البغاة، وإمهال المدعي والمدعى عليه في الدعوى، وتأجيل تنفيذ الحد عن الحامل والمريض."
  en: "Muhla in the lexicon is calm and gentleness; in law it is the grant of time to one who owes a right, or to one who claims it, to pay, to produce a witness, or to appear. Its rules cover the surety who must produce the principal, the husband after the period of ila', the shafi' who must bring the price, the slave under a writing of freedom who cannot pay the instalment, rebels who ask for time, and the parties to a suit. The jurists also defer a stoning or retaliation until a pregnant woman has given birth, or until a sick man is healed."
  ur: "مہلت لغت میں سکون اور نرمی کو کہتے ہیں، اور فقہ میں اس سے مراد وہ مدت ہے جو حق دار یا ذمہ دار کو دی جائے تاکہ وہ ادا کرے، گواہ پیش کرے یا حاضر ہو۔ کفیل، شفیع، مکاتب، باغی اور فریقین مقدمہ کے لیے اس کے احکام بیان کیے گئے ہیں۔"
  es: "Muhla, en el léxico, significa calma y gentileza; en derecho, es la concesión de tiempo a quien debe un derecho, o a quien lo reclama, para pagar, presentar un testigo o comparecer. Sus normas abarcan al fiador, que debe presentar al principal; al marido tras el período de ila'; al shafi', que debe aportar el precio; al esclavo con escritura de libertad que no puede pagar la cuota; a los rebeldes que solicitan una prórroga; y a las partes en un pleito. Los juristas también aplazan la lapidación o la represalia hasta que una mujer embarazada haya dado a luz o hasta que un enfermo se haya curado."
  fr: "Le terme « muhla » désigne, dans le lexique, le calme et la douceur; en droit, il s'agit de l'octroi d'un délai à celui qui doit une somme d'argent ou qui la revendique, pour payer, produire un témoin ou comparaître. Ses règles concernent la caution qui doit produire le débiteur principal, le mari après la période d'ila', le shafi' qui doit apporter le prix, l'esclave affranchi qui ne peut payer l'échéance, les rebelles qui demandent un délai et les parties à un procès. Les juristes accordent également un délai pour la lapidation ou les représailles jusqu'à l'accouchement d'une femme enceinte ou la guérison d'un malade."
