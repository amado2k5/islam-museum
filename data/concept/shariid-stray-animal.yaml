id: concept/shariid-stray-animal
class: concept
kind: legal
label:
  ar: "الشَّارِد"
  en: "Shariid (a strayed animal, and its sale, hire and slaughter)"
  es: "Shariid (un animal extraviado, y su venta, alquiler y sacrificio)"
  fr: "Shariid (un animal errant, et sa vente, sa location et son abattage)"
summary:
  ar: "الشارد في اللغة من شرد البعير إذا ند ونفر، ويختص بالحيوان، أما الآبق فيختص بالإنسان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9899} واتفق الفقهاء على تحريم بيع الشارد ونحوه مما لا يقدر البائع على تسليمه، وكذلك إجارته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9899} وذهب الجمهور إلى أن الحيوان الآنس إذا توحش فلم يقدر على ذبحه في محل الذكاة، حل بكل جرح يفضي إلى الزهوق، وخالف المالكية وطائفة فقالوا لا يحل إلا بذبحه في موضع الذكاة المعتاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9899} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9900}"
  en: "In language shariid is a strayed thing: a camel that bolts and runs off. The word fits animals, while aabiq (the runaway) fits people. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9899} The jurists agree that selling a strayed animal, or any thing the seller cannot deliver, is forbidden, and so is hiring it out. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9899} For most jurists, when a tame lawful animal goes wild and cannot be slaughtered at the usual place, it may be lawfully eaten after a wound of any kind that brings death, on the report of Rafi' ibn Khadij about a camel that bolted and was struck by a man's arrow. The Malikis, Sa'id ibn al-Musayyib, al-Layth and Rabi'a hold that a strayed animal is lawful only when slaughtered at the usual place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9899} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9900}"
  es: "En el idioma shariid es una cosa extraviada: un camello que se escapa y huye. La palabra se ajusta a los animales, mientras que aabiq (el fugitivo) se ajusta a las personas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9899} Los juristas coinciden en que vender un animal extraviado, o cualquier cosa que el vendedor no pueda entregar, está prohibido, al igual que alquilarlo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9899} Para la mayoría de los juristas, cuando un animal lícito y domesticado se vuelve salvaje y no puede ser sacrificado en el lugar habitual, puede ser comido lícitamente después de una herida de cualquier tipo que cause la muerte, según el relato de Rafi' ibn Khadij sobre un camello que se escapó y fue alcanzado por la flecha de un hombre. Los Malikis, Sa'id ibn al-Musayyib, al-Layth y Rabi'a sostienen que un animal extraviado sólo es lícito cuando se sacrifica en el lugar habitual. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9899} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9900}"
  fr: "En langue kuwaitiyya, « shariid » désigne un animal égaré: un chameau qui s’emballe et s’enfuit. Ce terme s’applique aux animaux, tandis que « aabiq » (le fugitif) s’applique aux personnes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9899} Les juristes s’accordent à dire que la vente d’un animal égaré, ou de tout bien que le vendeur ne peut livrer, est interdite, de même que sa location. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9899} Pour la plupart des juristes, lorsqu’un animal domestique licite s’emballe et ne peut être abattu à l’endroit habituel, sa consommation est licite après une blessure mortelle, quelle qu’elle soit, conformément au récit de Rafi’ ibn Khadij concernant un chameau qui s’était emballé et avait été touché par une flèche. Les Malikis, Sa'id ibn al-Musayyib, al-Layth et Rabi'a soutiennent qu'un animal égaré n'est licite que s'il est abattu à l'endroit habituel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9899} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9900}"
