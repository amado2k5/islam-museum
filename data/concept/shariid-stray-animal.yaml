id: concept/shariid-stray-animal
class: concept
kind: legal
label:
  ar: "الشَّارِد"
  en: "Shariid (a strayed animal, and its sale, hire and slaughter)"
summary:
  ar: "الشارد في اللغة من شرد البعير إذا ند ونفر، ويختص بالحيوان، أما الآبق فيختص بالإنسان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9899} واتفق الفقهاء على تحريم بيع الشارد ونحوه مما لا يقدر البائع على تسليمه، وكذلك إجارته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9899} وذهب الجمهور إلى أن الحيوان الآنس إذا توحش فلم يقدر على ذبحه في محل الذكاة، حل بكل جرح يفضي إلى الزهوق، وخالف المالكية وطائفة فقالوا لا يحل إلا بذبحه في موضع الذكاة المعتاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9899} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9900}"
  en: "In language shariid is a strayed thing: a camel that bolts and runs off. The word fits animals, while aabiq (the runaway) fits people. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9899} The jurists agree that selling a strayed animal, or any thing the seller cannot deliver, is forbidden, and so is hiring it out. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9899} For most jurists, when a tame lawful animal goes wild and cannot be slaughtered at the usual place, it may be lawfully eaten after a wound of any kind that brings death, on the report of Rafi' ibn Khadij about a camel that bolted and was struck by a man's arrow. The Malikis, Sa'id ibn al-Musayyib, al-Layth and Rabi'a hold that a strayed animal is lawful only when slaughtered at the usual place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9899} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9900}"
