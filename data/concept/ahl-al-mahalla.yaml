label: { ar: "أهل المحلة", en: "Ahl al-Mahalla (the people of a quarter, their imam, call to prayer, and their part in the oath and blood money where a body is found)", fr: "Ahl al-Mahalla (les habitants d’un quartier, leur imam, l’appel à la prière et leur rôle dans le serment et l’indemnité lorsqu’un corps est découvert)", es: "Ahl al-Mahalla (la gente de un barrio, su imán, la llamada a la oración y su participación en el juramento y la indemnización por derramamiento de sangre donde se encuentra un cadáver)", ur: "اہل محلہ ⁦(ایک چوتھائی کے لوگ، ان کا امام، اذان، اور قسم اور خون کی رقم میں ان کا حصہ جہاں لاش ملے)⁩" }
summary:
  ar: "أهل المحلة هم القوم ينزلون بموضع يعمرونه بالإقامة فيه، ولا يخرج استعمال الفقهاء عن هذا المعنى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3643} ويختلفون عن العاقلة وهم القبيلة والعشيرة، فقد يكون بينهم قرابة وقد لا تكون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3643} وإمام أهل المحلة أولى بالإمامة في مسجدهم إذا كان ممن تصح إمامته، وأذانهم يغني المصلين عن الأذان عند جمهور الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3644} وفي القسامة إذا وجد قتيل في محلة ولا يعرف قاتله، يحلف المدعي خمسين يمينا، ثم تحلف المحلة أو يغرمون الدية، وفيه خلاف وتفصيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3644}"
  en: "Ahl al-mahalla are the people who settle in a place and make it their home. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3643} They differ from the 'aqila, the clan and kin who bear blood-money, since they may or may not be related. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3643} The people of a quarter have a right to their own imam in their mosque if he is fit to lead, and by the majority their call to prayer suffices for those who hear it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3644} Where a dead body is found in a quarter and its killer is not known, the claimant swears fifty oaths; the people of the quarter then swear, or pay the blood-money, and the schools differ on the detail. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3644}"
  fr: "Les ahl al-mahalla sont les personnes qui s’établissent dans un lieu et en font leur foyer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3643} Ils se distinguent de la ‘aqila, le clan et les parents qui assument l’indemnité du sang, car ils peuvent être apparentés ou non. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3643} Les habitants d’un quartier ont droit à leur propre imam dans leur mosquée s’il a les qualités requises, et d’après la majorité des juristes, leur appel à la prière suffit à ceux qui l’entendent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3644} Si un corps est découvert dans un quartier et que le meurtrier est inconnu, le demandeur prête cinquante serments. Les habitants du quartier prêtent ensuite serment ou paient l’indemnité du sang, selon des modalités qui varient d’une école à l’autre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3644}"
  es: "Ahl al-mahalla son las personas que se establecen en un lugar y lo convierten en su hogar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3643} Se diferencian de la 'aqila, el clan y parientes que pagan la indemnización por sangre, ya que pueden o no estar relacionados. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3643} La gente de un barrio tiene derecho a su propio imán en su mezquita si es apto para dirigir, y por mayoría su llamada a la oración es suficiente para quienes la escuchan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3644} Cuando se encuentra un cadáver en un barrio y no se conoce a su asesino, el reclamante jura cincuenta juramentos; la gente del barrio jura entonces, o paga la indemnización por sangre, y las escuelas difieren en los detalles. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3644}"
  ur: "اہل محلہ وہ لوگ ہیں جو کسی جگہ کو آباد کرتے ہیں اور اسے اپنا گھر بناتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3643} وہ عقیلہ، قبیلہ اور رشتہ داروں سے مختلف ہیں جو خون بہا لیتے ہیں، کیونکہ ان کا رشتہ ہوسکتا ہے یا نہیں۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 3643} ایک چوتھائی کے لوگوں کو اپنی مسجد میں اپنے امام کا حق حاصل ہے اگر وہ امامت کے لائق ہو، اور جمہور کی طرف سے ان کی اذان سننے والوں کے لیے کافی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3644} جہاں ایک چوتھائی میں میت پائی جائے اور اس کا قاتل معلوم نہ ہو، دعویٰ کرنے والا پچاس قسمیں کھاتا ہے۔ اس کے بعد سہ ماہی کے لوگ قسم کھاتے ہیں، یا خون کی رقم ادا کرتے ہیں، اور اسکولوں میں تفصیل سے اختلاف ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 3644}"
