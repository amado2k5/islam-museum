label: { ar: "أهل المحلة", en: "Ahl al-Mahalla (the people of a quarter, their imam, call to prayer, and their part in the oath and blood money where a body is found)" }
summary:
  ar: "أهل المحلة هم القوم ينزلون بموضع يعمرونه بالإقامة فيه، ولا يخرج استعمال الفقهاء عن هذا المعنى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3643} ويختلفون عن العاقلة وهم القبيلة والعشيرة، فقد يكون بينهم قرابة وقد لا تكون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3643} وإمام أهل المحلة أولى بالإمامة في مسجدهم إذا كان ممن تصح إمامته، وأذانهم يغني المصلين عن الأذان عند جمهور الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3644} وفي القسامة إذا وجد قتيل في محلة ولا يعرف قاتله، يحلف المدعي خمسين يمينا، ثم تحلف المحلة أو يغرمون الدية، وفيه خلاف وتفصيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3644}"
  en: "Ahl al-mahalla are the people who settle in a place and make it their home. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3643} They differ from the 'aqila, the clan and kin who bear blood-money, since they may or may not be related. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3643} The people of a quarter have a right to their own imam in their mosque if he is fit to lead, and by the majority their call to prayer suffices for those who hear it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3644} Where a dead body is found in a quarter and its killer is not known, the claimant swears fifty oaths; the people of the quarter then swear, or pay the blood-money, and the schools differ on the detail. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3644}"
