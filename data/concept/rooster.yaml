summary:
  ar: "إذا سمعتم صياح الديكة فاسألوا الله من فضله فإنها رأت ملكاً: طير يوقظ للفجر ويشهد ما لا نرى، ولمثل عائشة الفروج الذي يصرخ مع الديكة."
  en: "'When you hear the crowing of roosters ask God's bounty, for they have seen an angel' — the bird that wakes for dawn and witnesses what we do not see; and Aisha's simile of the cockerel that crows with the roosters."
  ur: "'جب مرغوں کی بانگ سنو تو اللہ کا فضل مانگو کہ انہوں نے فرشتہ دیکھا' — فجر پر جگانے والا پرندہ جو وہ دیکھتا ہے جو ہم نہیں دیکھتے؛ اور عائشہ کا وہ تمثیل کہ 'چوزے کی طرح جو مرغوں کے ساتھ بانگ دیتا ہے'۔"
