id: concept/luqatah-fiqh
class: concept
kind: legal
label:
  ar: "اللُّقَطَة"
  en: "Lost property found (luqatah), fiqh rulings"
  ur: "لقطہ (گری ہوئی چیز، فقہی احکام)"
summary:
  ar: "اللُّقَطَة في اللغة الشيء الذي يُوجد ملقى فيؤخذ، وشرعاً المال الضائع من ربه يلتقطه غيره، أو الشيء الذي يجده المرء ملقى فيأخذه أمانة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13666}. وتُفرّق عن اللقيط بأن اللقيط بني آدم، واللقطة غيرهم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13681}."
  en: "Luqatah, in lexicon, is a thing found lying and taken up; in law it is property lost by its owner and picked up by another, or a thing found lying and taken as a trust {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13666}. It differs from the foundling, since the foundling is a human child and the luqatah is not {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13681}."
  ur: "لقطہ لغت میں اس چیز کو کہتے ہیں جو کہیں پڑی ملے اور اٹھائی جائے؛ شرعاً وہ مال جو اپنے مالک سے گم ہو گیا ہو اور کوئی اور اٹھا لے، یا وہ چیز جو آدمی پڑی پائے اور امانت کے طور پر اٹھا لے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13666}۔ لقیط سے یہ فرق ہے کہ لقیط انسانی بچہ ہوتا ہے اور لقطہ انسان کے سوا {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13681}۔"
