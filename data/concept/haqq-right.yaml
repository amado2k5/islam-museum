label: { ar: "الحق", en: "Right (haqq)", ur: "حق" }
summary:
  ar: "الحق في اللغة خلاف الباطل، والثبوت والوجوب، ويطلق على المال والملك والموجود الثابت، ومن معانيه النصيب والواجب واليقين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174} وفي الاصطلاح معنيان: الحكم المطابق للواقع، ويقابله الباطل، والواجب الثابت. وهو قسمان: حق الله وحق العباد. فحق الله ما لا يقبل الصلح والإسقاط كالحدود والزكاة والكفارات، وحق العبد ما يتعلق به مصلحة خاصة له ويقبل الصلح والإسقاط والمعاوضة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174} والحق أثر للحكم الشرعي، والعلاقة بينهما علاقة المسبب بالسبب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174} واختلف علماء الأصول: فمنهم من جعل الحق هو الحكم، أي خطاب الله المتعلق بأفعال المكلفين، ومنهم من جعله الفعل الذي تعلق به الخطاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7176} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7177} وقسّم القرافي التكاليف إلى ما هو لله وحده كالإيمان، وما هو للعباد وحدهم كالديون، وما اختلف فيه كحد القذف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7176} وقسّم ابن رجب حقوق العباد إلى خمسة أنواع: حق الملك، وحق التملك، وحق الانتفاع، وحق الاختصاص، وحق التعلق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7177} وأطلق الفقهاء الحق على الحقوق المالية وغيرها، وعلى الالتزامات المترتبة على العقد، وعلى الأرزاق من بيت المال، وعلى مرافق العقار، وعلى الحقوق المجردة كحق الخيار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7178} ومصدر الحق هو الله تعالى، والشريعة هي التي تثبت الحق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7178} ولكل حق ركنان: صاحبه، والمكلف بأدائه، وله محل هو الشيء المستحق، ويشترط أن يكون مشروعا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7179} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7180} ويقسم الحق باعتبارات كثيرة، منها اللزوم وعدمه، وهو ما يذكره الباب بعد ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7180} وقسّم الفقهاء الحق إلى حق الله وحق العبد الخالص وما اجتمع فيه الحقان. فحق العبد الخالص ما كان نفعه مختصا بشخص معين، كالدين والدية وحق استرداد المغصوب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7185} وفي المختلط يغلب أحد الحقين: فحد القذف يغلب فيه حق الله، فتتداخل العقوبة ولا يورث الحد ولا يسقط بعفو المقذوف، ويفوض تنفيذه إلى الإمام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7185} أما القصاص فيغلب فيه حق العبد، فلولي المقتول أن يرفع الدعوى أو لا يرفعها، وأن يعفو أو يصالح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7186} وقسّم المالكية حق العبد ثلاثة أقسام: حق على الله، وحق في الجملة، وحق على غيره من العباد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7186} وذكر الزركشي ترتيب الحقوق عند التزاحم: يقدم حق الله في الصلاة والزكاة والصوم والحج، ويقدم حق الآدمي في الإكراه والرخص، وفي تزاحم الزكاة مع دين الآدمي أقوال، والأصح تقديم حق الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7189} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7190} ولا يسقط حق الله بإسقاط العبد، ولا يجوز التحيل على إسقاط العبادات، ولا الصلح عن الحدود الخالصة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7191} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7193} ويجوز إسقاط حق العبد لمن كان جائز التصرف والمحل قابلا للإسقاط، وتشمل القابلية الأعيان والديون والمنافع والحق المطلق، وفي الاعتياض عن الحقوق خلاف بين المذاهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7194} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7196} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7197} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7198} وقسّم الشاطبي الحقوق بحسب معقولية المعنى إلى ثلاثة أقسام، والعبادات حق لله خالص لا تحتمل الشركة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7198} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7199} (المدخل متصل بعد ص 7199 ولم يكتمل.)"
  en: "Haqq means, in Arabic usage, what is established, owed or certain, the opposite of falsehood. In the jurists' terms it has two senses: a judgement that matches reality, and a duty established by the law. It falls into the right of God and the right of the servant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174} Ibn al-Qayyim: God's right admits no compromise, as in the hudud, zakat and expiations, while the servant's right admits settlement, waiver and exchange. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174} Usulis disagreed whether the right is the divine address itself or the act it binds. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7176} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7177} Al-Qarafi divides obligations into God's alone, the servant's alone, and the mixed case of slander. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7176} Ibn Rajab lists five kinds of the servant's right. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7177} Jurists also use the word for financial and non-financial entitlements, for contractual obligations, for state stipends and for easements. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7178} The source of every right is God, and the holder, the obliged party and the object of the right are its pillars; the object must be lawful. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7179} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7180} The jurists divide rights into God's pure right, the servant's pure right, and mixed rights. The servant's pure right is one whose benefit belongs to a specific person, such as debt and blood-money. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7185} In a mixed right one side prevails: slander (qadhf) is mainly God's right, so penalties merge, the penalty is not inherited, pardon does not cancel it, and the imam executes it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7185} Retaliation for killing (qisas) is mainly the servant's right, so the victim's heirs may sue or not, pardon, or settle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7186} The Malikis divide the servant's right into three: owed by God to him, owed in general, and owed by one servant to another. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7186} Al-Zarkashi sets the order when rights collide: God's rights such as prayer, zakat, fasting and pilgrimage come first, human rights come first in compulsion and concessions, and in zakat against a debt the sounder view gives God's right priority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7189} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7190} God's rights cannot be waived by people, no one may contrive to drop acts of worship, and no settlement may be made over pure hudud. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7191} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7193} The servant's right may be waived by one who is competent to dispose and whose object is waivable; waiver covers objects, debts, usufructs and unrestricted rights, and the schools disagree on taking an exchange for a right. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7194} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7196} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7197} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7198} Al-Shatibi divides rights by whether their purpose is intelligible: worship is God's pure right and admits no partner. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7198} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7199} The article continues beyond p.7199 and is not complete."
