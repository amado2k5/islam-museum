label: { ar: "الحق", en: "Right (haqq)", ur: "حق" }
summary:
  ar: "الحق في اللغة خلاف الباطل، والثبوت والوجوب، ويطلق على المال والملك والموجود الثابت، ومن معانيه النصيب والواجب واليقين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174} وفي الاصطلاح معنيان: الحكم المطابق للواقع، ويقابله الباطل، والواجب الثابت. وهو قسمان: حق الله وحق العباد. فحق الله ما لا يقبل الصلح والإسقاط كالحدود والزكاة والكفارات، وحق العبد ما يتعلق به مصلحة خاصة له ويقبل الصلح والإسقاط والمعاوضة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174} والحق أثر للحكم الشرعي، والعلاقة بينهما علاقة المسبب بالسبب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174} واختلف علماء الأصول: فمنهم من جعل الحق هو الحكم، أي خطاب الله المتعلق بأفعال المكلفين، ومنهم من جعله الفعل الذي تعلق به الخطاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7176} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7177} وقسّم القرافي التكاليف إلى ما هو لله وحده كالإيمان، وما هو للعباد وحدهم كالديون، وما اختلف فيه كحد القذف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7176} وقسّم ابن رجب حقوق العباد إلى خمسة أنواع: حق الملك، وحق التملك، وحق الانتفاع، وحق الاختصاص، وحق التعلق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7177} وأطلق الفقهاء الحق على الحقوق المالية وغيرها، وعلى الالتزامات المترتبة على العقد، وعلى الأرزاق من بيت المال، وعلى مرافق العقار، وعلى الحقوق المجردة كحق الخيار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7178} ومصدر الحق هو الله تعالى، والشريعة هي التي تثبت الحق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7178} ولكل حق ركنان: صاحبه، والمكلف بأدائه، وله محل هو الشيء المستحق، ويشترط أن يكون مشروعا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7179} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7180} ويقسم الحق باعتبارات كثيرة، منها اللزوم وعدمه، وهو ما يذكره الباب بعد ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7180} وقسّم الفقهاء الحق إلى حق الله وحق العبد الخالص وما اجتمع فيه الحقان. فحق العبد الخالص ما كان نفعه مختصا بشخص معين، كالدين والدية وحق استرداد المغصوب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7185} وفي المختلط يغلب أحد الحقين: فحد القذف يغلب فيه حق الله، فتتداخل العقوبة ولا يورث الحد ولا يسقط بعفو المقذوف، ويفوض تنفيذه إلى الإمام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7185} أما القصاص فيغلب فيه حق العبد، فلولي المقتول أن يرفع الدعوى أو لا يرفعها، وأن يعفو أو يصالح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7186} وقسّم المالكية حق العبد ثلاثة أقسام: حق على الله، وحق في الجملة، وحق على غيره من العباد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7186} وذكر الزركشي ترتيب الحقوق عند التزاحم: يقدم حق الله في الصلاة والزكاة والصوم والحج، ويقدم حق الآدمي في الإكراه والرخص، وفي تزاحم الزكاة مع دين الآدمي أقوال، والأصح تقديم حق الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7189} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7190} ولا يسقط حق الله بإسقاط العبد، ولا يجوز التحيل على إسقاط العبادات، ولا الصلح عن الحدود الخالصة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7191} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7193} ويجوز إسقاط حق العبد لمن كان جائز التصرف والمحل قابلا للإسقاط، وتشمل القابلية الأعيان والديون والمنافع والحق المطلق، وفي الاعتياض عن الحقوق خلاف بين المذاهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7194} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7196} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7197} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7198} وقسّم الشاطبي الحقوق بحسب معقولية المعنى إلى ثلاثة أقسام، والعبادات حق لله خالص لا تحتمل الشركة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7198} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7199} وتتعلق العاديات بحق الله من جهة الوضع الكلي الذي يدخل في الضروريات، وبحق العبد من جهة الجزاء في الآخرة وإجراء النعمة في الدنيا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7200} وتنقسم الحقوق بحسب التحديد إلى محدود، وغير محدود، ومختلف فيه؛ فالمحدود كالفرائض الخمس والمقادير الواجبة في الزكاة وأثمان المبيعات، وغير المحدود كالصدقات والإنفاق في سبيل الله والإنفاق على الأقارب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7201} وللمحدود أحكام منها أنه يتعلق بالذمة بمجرد وجود سببه، ولا يسقط بالسكوت أو بمضي المدة؛ أما غير المحدود فلا يتعلق بالذمة إلا بعد التحديد بالتراضي أو الصلح أو حكم القاضي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7201} ومن المختلف فيه نفقة الزوجة، إذ تثبت في الذمة عند الجمهور، بينما يرى الحنفية أنها لا تثبت إلا بفرض الحاكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7202} وتنوع التحديد بحسب صاحب الحق والمكلف به والشيء المستحق والقدر والمكان والزمان والاتجاه والعدد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7202} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7203} وتنقسم الحقوق إلى تامة لا عذر فيها، ومخففة بعذر شرعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7203} وتنقسم بحسب الانتقال إلى الورثة إلى حقوق تورث، وحقوق تثبت بالخلافة ولا تورث، وحقوق لا تورث ولا تنتقل كالولايات والوكالة واختيار الزوجات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7203} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7204} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7205} واختلف الفقهاء في إرث خيار الشرط والتعيين والعيب والقبول والمنافع والقصاص؛ فذهب المالكية والشافعية إلى توريث خيار الشرط، وذهب الحنفية والحنابلة إلى عدم توريثه، وثبت القصاص لأولياء المقتول ابتداء لا بالميراث عند أبي حنيفة ومالك والشافعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7205} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7206} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7207} وتنقسم الحقوق بحسب المالية إلى أربعة أقسام، وتنقسم أيضا إلى حق واجب ديانة، وحق واجب قضاء، وحق واجب ديانة وقضاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7207} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7208} وحق التملك والحق المباح حقان مجردان ضعيفان لا يتعلقان بمحل معين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7208} وتنقسم حقوق التملك بحسب الاختيار إلى ثلاث مراتب: حق التملك أو المباح، وهو مجرد صلاحية لا يتعلق بشيء معين، والحق الثابت أو الواجب، وهو حق في تملك شيء محدد بإرادة صاحبه بعد سبب من أسباب الملك، والحق المؤكد الذي استقر في عين معينة ولو لم تملك بعد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7209} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7210} ويمتاز الحق الثابت عن حق التملك بأنه متعلق بشيء معين ويقدر صاحبه أن يرتقي به إلى الملك بقبوله وحده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7210} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7211} والحق المؤكد يتأكد في الغنيمة بإحرازها في دار الإسلام، ويضمن بالإتلاف، ويورث إذا مات صاحبه قبل القسمة، ولا يجوز بيعه قبل القسمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7211} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7212} والحق المؤكد يشبه الملك في أنه يضمن بالإتلاف ويورث بالإجماع، ويفترق عنه بأنه لا يجوز بيعه ولا التصرف فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7213} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7214} وتنقسم الحقوق من حيث استيفاؤها إلى ما يلزم فيه الرفع إلى القضاء كالعقوبات والحقوق المتعلقة بالنكاح، وما لا يحتاج إلى قضاء كتحصيل الأعيان المستحقة ونفقة الزوجة والأولاد، وما اختلف في جواز تحصيله دون قضاء كاستيفاء الديون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7214} ويختم المدخل بالإحالة إلى مدخل «حُقّة». (اكتمل المدخل عند العنوان التالي «حُقّة» ص 7214.)"
  en: "Haqq means, in Arabic usage, what is established, owed or certain, the opposite of falsehood. In the jurists' terms it has two senses: a judgement that matches reality, and a duty established by the law. It falls into the right of God and the right of the servant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174} Ibn al-Qayyim: God's right admits no compromise, as in the hudud, zakat and expiations, while the servant's right admits settlement, waiver and exchange. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174} Usulis disagreed whether the right is the divine address itself or the act it binds. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7176} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7177} Al-Qarafi divides obligations into God's alone, the servant's alone, and the mixed case of slander. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7176} Ibn Rajab lists five kinds of the servant's right. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7177} Jurists also use the word for financial and non-financial entitlements, for contractual obligations, for state stipends and for easements. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7178} The source of every right is God, and the holder, the obliged party and the object of the right are its pillars; the object must be lawful. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7179} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7180} The jurists divide rights into God's pure right, the servant's pure right, and mixed rights. The servant's pure right is one whose benefit belongs to a specific person, such as debt and blood-money. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7185} In a mixed right one side prevails: slander (qadhf) is mainly God's right, so penalties merge, the penalty is not inherited, pardon does not cancel it, and the imam executes it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7185} Retaliation for killing (qisas) is mainly the servant's right, so the victim's heirs may sue or not, pardon, or settle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7186} The Malikis divide the servant's right into three: owed by God to him, owed in general, and owed by one servant to another. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7186} Al-Zarkashi sets the order when rights collide: God's rights such as prayer, zakat, fasting and pilgrimage come first, human rights come first in compulsion and concessions, and in zakat against a debt the sounder view gives God's right priority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7189} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7190} God's rights cannot be waived by people, no one may contrive to drop acts of worship, and no settlement may be made over pure hudud. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7191} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7193} The servant's right may be waived by one who is competent to dispose and whose object is waivable; waiver covers objects, debts, usufructs and unrestricted rights, and the schools disagree on taking an exchange for a right. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7194} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7196} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7197} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7198} Al-Shatibi divides rights by whether their purpose is intelligible: worship is God's pure right and admits no partner. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7198} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7199} Acts of custom touch God's right through the universal ordering and the servant's right in the afterlife and worldly benefit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7200} Rights divide by definition into fixed, unfixed and disputed; fixed rights (the five prayers, the zakat amounts, prices) bind the liability once their cause exists and do not lapse by silence or time, while unfixed rights (charity, spending on relatives) bind only after being fixed by agreement, settlement or a judge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7201} The maintenance of a wife is disputed: the majority hold it binding on the liability, the Hanafis only once the ruler fixes it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7202} Fixing varies with the holder, the obliged person, the object, the amount, the place, the time, the direction and the number. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7202} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7203} Rights are either complete or lightened by a lawful excuse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7203} By inheritance, rights are inherited, passed by succession without inheritance, or not transferred at all, as with offices, agency and the choice among wives. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7203} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7204} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7205} Jurists disagree on inheriting the option of stipulation, choice, defect and acceptance, and on usufructs; the Hanafis and the Hanbalis deny inheritance of the stipulated option, the Malikis and Shafiis allow it, and retaliation accrues to the victim's heirs by succession, not inheritance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7205} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7206} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7207} By financial value, rights fall into four kinds; by religious and judicial standing they are binding in conscience, binding before a court, or binding in both. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7207} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7208} The right of ownership and the permitted right are bare rights with no fixed object. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7208} Rights of acquisition are graded: the bare permitted right or right of acquisition, which has no specific object; the fixed or binding right, a right to acquire a specific thing by the holder's will once a cause of ownership exists; and the established right, which settles on a particular thing even before ownership. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7209} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7210} The fixed right differs from the bare one in that it attaches to a specific thing and its holder can raise it to ownership by acceptance alone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7210} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7211} In spoils of war the established right becomes firm when the spoils are secured inside Muslim territory; it is then compensable on destruction, inheritable on the holder's death before division, and may not be sold before division. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7211} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7212} The established right resembles ownership in that it is compensable on destruction and inheritable by consensus, but it differs in that it cannot be sold or disposed of. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7213} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7214} Rights divide by how they are enforced: those that must go to a court (penalties and marriage-related rights), those that need no court (taking a specific object, a wife's or children's maintenance), and those disputed (collecting debts). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7214} The headword closes at the next entry, hiqqa (حُقّة). The headword closes at the next entry, hiqqa, p.7214."
