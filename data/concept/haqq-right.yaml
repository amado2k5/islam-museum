id: concept/haqq-right
class: concept
kind: legal
label: { ar: "الحق", en: "Right (haqq)", ur: "حق", es: "Derecha (haqq)", fr: "Droite (haqq)", tr: "Gerçek", id: "Kebenaran" }
summary:
  ar: "الحق في اللغة خلاف الباطل، والثبوت والوجوب، ويطلق على المال والملك والموجود الثابت، ومن معانيه النصيب والواجب واليقين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174} وفي الاصطلاح معنيان: الحكم المطابق للواقع، ويقابله الباطل، والواجب الثابت. وهو قسمان: حق الله وحق العباد. فحق الله ما لا يقبل الصلح والإسقاط كالحدود والزكاة والكفارات، وحق العبد ما يتعلق به مصلحة خاصة له ويقبل الصلح والإسقاط والمعاوضة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174} والحق أثر للحكم الشرعي، والعلاقة بينهما علاقة المسبب بالسبب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174} واختلف علماء الأصول: فمنهم من جعل الحق هو الحكم، أي خطاب الله المتعلق بأفعال المكلفين، ومنهم من جعله الفعل الذي تعلق به الخطاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7176} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7177} وقسّم القرافي التكاليف إلى ما هو لله وحده كالإيمان، وما هو للعباد وحدهم كالديون، وما اختلف فيه كحد القذف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7176} وقسّم ابن رجب حقوق العباد إلى خمسة أنواع: حق الملك، وحق التملك، وحق الانتفاع، وحق الاختصاص، وحق التعلق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7177} وأطلق الفقهاء الحق على الحقوق المالية وغيرها، وعلى الالتزامات المترتبة على العقد، وعلى الأرزاق من بيت المال، وعلى مرافق العقار، وعلى الحقوق المجردة كحق الخيار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7178} ومصدر الحق هو الله تعالى، والشريعة هي التي تثبت الحق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7178} ولكل حق ركنان: صاحبه، والمكلف بأدائه، وله محل هو الشيء المستحق، ويشترط أن يكون مشروعا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7179} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7180} ويقسم الحق باعتبارات كثيرة، منها اللزوم وعدمه، وهو ما يذكره الباب بعد ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7180} وقسّم الفقهاء الحق إلى حق الله وحق العبد الخالص وما اجتمع فيه الحقان. فحق العبد الخالص ما كان نفعه مختصا بشخص معين، كالدين والدية وحق استرداد المغصوب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7185} وفي المختلط يغلب أحد الحقين: فحد القذف يغلب فيه حق الله، فتتداخل العقوبة ولا يورث الحد ولا يسقط بعفو المقذوف، ويفوض تنفيذه إلى الإمام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7185} أما القصاص فيغلب فيه حق العبد، فلولي المقتول أن يرفع الدعوى أو لا يرفعها، وأن يعفو أو يصالح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7186} وقسّم المالكية حق العبد ثلاثة أقسام: حق على الله، وحق في الجملة، وحق على غيره من العباد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7186} وذكر الزركشي ترتيب الحقوق عند التزاحم: يقدم حق الله في الصلاة والزكاة والصوم والحج، ويقدم حق الآدمي في الإكراه والرخص، وفي تزاحم الزكاة مع دين الآدمي أقوال، والأصح تقديم حق الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7189} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7190} ولا يسقط حق الله بإسقاط العبد، ولا يجوز التحيل على إسقاط العبادات، ولا الصلح عن الحدود الخالصة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7191} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7193} ويجوز إسقاط حق العبد لمن كان جائز التصرف والمحل قابلا للإسقاط، وتشمل القابلية الأعيان والديون والمنافع والحق المطلق، وفي الاعتياض عن الحقوق خلاف بين المذاهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7194} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7196} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7197} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7198} وقسّم الشاطبي الحقوق بحسب معقولية المعنى إلى ثلاثة أقسام، والعبادات حق لله خالص لا تحتمل الشركة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7198} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7199} وتتعلق العاديات بحق الله من جهة الوضع الكلي الذي يدخل في الضروريات، وبحق العبد من جهة الجزاء في الآخرة وإجراء النعمة في الدنيا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7200} وتنقسم الحقوق بحسب التحديد إلى محدود، وغير محدود، ومختلف فيه؛ فالمحدود كالفرائض الخمس والمقادير الواجبة في الزكاة وأثمان المبيعات، وغير المحدود كالصدقات والإنفاق في سبيل الله والإنفاق على الأقارب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7201} وللمحدود أحكام منها أنه يتعلق بالذمة بمجرد وجود سببه، ولا يسقط بالسكوت أو بمضي المدة؛ أما غير المحدود فلا يتعلق بالذمة إلا بعد التحديد بالتراضي أو الصلح أو حكم القاضي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7201} ومن المختلف فيه نفقة الزوجة، إذ تثبت في الذمة عند الجمهور، بينما يرى الحنفية أنها لا تثبت إلا بفرض الحاكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7202} وتنوع التحديد بحسب صاحب الحق والمكلف به والشيء المستحق والقدر والمكان والزمان والاتجاه والعدد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7202} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7203} وتنقسم الحقوق إلى تامة لا عذر فيها، ومخففة بعذر شرعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7203} وتنقسم بحسب الانتقال إلى الورثة إلى حقوق تورث، وحقوق تثبت بالخلافة ولا تورث، وحقوق لا تورث ولا تنتقل كالولايات والوكالة واختيار الزوجات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7203} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7204} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7205} واختلف الفقهاء في إرث خيار الشرط والتعيين والعيب والقبول والمنافع والقصاص؛ فذهب المالكية والشافعية إلى توريث خيار الشرط، وذهب الحنفية والحنابلة إلى عدم توريثه، وثبت القصاص لأولياء المقتول ابتداء لا بالميراث عند أبي حنيفة ومالك والشافعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7205} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7206} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7207} وتنقسم الحقوق بحسب المالية إلى أربعة أقسام، وتنقسم أيضا إلى حق واجب ديانة، وحق واجب قضاء، وحق واجب ديانة وقضاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7207} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7208} وحق التملك والحق المباح حقان مجردان ضعيفان لا يتعلقان بمحل معين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7208} وتنقسم حقوق التملك بحسب الاختيار إلى ثلاث مراتب: حق التملك أو المباح، وهو مجرد صلاحية لا يتعلق بشيء معين، والحق الثابت أو الواجب، وهو حق في تملك شيء محدد بإرادة صاحبه بعد سبب من أسباب الملك، والحق المؤكد الذي استقر في عين معينة ولو لم تملك بعد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7209} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7210} ويمتاز الحق الثابت عن حق التملك بأنه متعلق بشيء معين ويقدر صاحبه أن يرتقي به إلى الملك بقبوله وحده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7210} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7211} والحق المؤكد يتأكد في الغنيمة بإحرازها في دار الإسلام، ويضمن بالإتلاف، ويورث إذا مات صاحبه قبل القسمة، ولا يجوز بيعه قبل القسمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7211} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7212} والحق المؤكد يشبه الملك في أنه يضمن بالإتلاف ويورث بالإجماع، ويفترق عنه بأنه لا يجوز بيعه ولا التصرف فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7213} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7214} وتنقسم الحقوق من حيث استيفاؤها إلى ما يلزم فيه الرفع إلى القضاء كالعقوبات والحقوق المتعلقة بالنكاح، وما لا يحتاج إلى قضاء كتحصيل الأعيان المستحقة ونفقة الزوجة والأولاد، وما اختلف في جواز تحصيله دون قضاء كاستيفاء الديون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7214} ويختم المدخل بالإحالة إلى مدخل «حُقّة». ⁦(اكتمل المدخل عند العنوان التالي «حُقّة» ص 7214.)⁩"
  en: "Haqq means, in Arabic usage, what is established, owed or certain, the opposite of falsehood. In the jurists' terms it has two senses: a judgement that matches reality, and a duty established by the law. It falls into the right of God and the right of the servant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174} Ibn al-Qayyim: God's right admits no compromise, as in the hudud, zakat and expiations, while the servant's right admits settlement, waiver and exchange. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174} Usulis disagreed whether the right is the divine address itself or the act it binds. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7176} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7177} Al-Qarafi divides obligations into God's alone, the servant's alone, and the mixed case of slander. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7176} Ibn Rajab lists five kinds of the servant's right. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7177} Jurists also use the word for financial and non-financial entitlements, for contractual obligations, for state stipends and for easements. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7178} The source of every right is God, and the holder, the obliged party and the object of the right are its pillars; the object must be lawful. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7179} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7180} The jurists divide rights into God's pure right, the servant's pure right, and mixed rights. The servant's pure right is one whose benefit belongs to a specific person, such as debt and blood-money. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7185} In a mixed right one side prevails: slander (qadhf) is mainly God's right, so penalties merge, the penalty is not inherited, pardon does not cancel it, and the imam executes it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7185} Retaliation for killing (qisas) is mainly the servant's right, so the victim's heirs may sue or not, pardon, or settle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7186} The Malikis divide the servant's right into three: owed by God to him, owed in general, and owed by one servant to another. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7186} Al-Zarkashi sets the order when rights collide: God's rights such as prayer, zakat, fasting and pilgrimage come first, human rights come first in compulsion and concessions, and in zakat against a debt the sounder view gives God's right priority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7189} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7190} God's rights cannot be waived by people, no one may contrive to drop acts of worship, and no settlement may be made over pure hudud. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7191} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7193} The servant's right may be waived by one who is competent to dispose and whose object is waivable; waiver covers objects, debts, usufructs and unrestricted rights, and the schools disagree on taking an exchange for a right. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7194} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7196} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7197} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7198} Al-Shatibi divides rights by whether their purpose is intelligible: worship is God's pure right and admits no partner. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7198} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7199} Acts of custom touch God's right through the universal ordering and the servant's right in the afterlife and worldly benefit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7200} Rights divide by definition into fixed, unfixed and disputed; fixed rights (the five prayers, the zakat amounts, prices) bind the liability once their cause exists and do not lapse by silence or time, while unfixed rights (charity, spending on relatives) bind only after being fixed by agreement, settlement or a judge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7201} The maintenance of a wife is disputed: the majority hold it binding on the liability, the Hanafis only once the ruler fixes it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7202} Fixing varies with the holder, the obliged person, the object, the amount, the place, the time, the direction and the number. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7202} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7203} Rights are either complete or lightened by a lawful excuse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7203} By inheritance, rights are inherited, passed by succession without inheritance, or not transferred at all, as with offices, agency and the choice among wives. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7203} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7204} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7205} Jurists disagree on inheriting the option of stipulation, choice, defect and acceptance, and on usufructs; the Hanafis and the Hanbalis deny inheritance of the stipulated option, the Malikis and Shafiis allow it, and retaliation accrues to the victim's heirs by succession, not inheritance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7205} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7206} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7207} By financial value, rights fall into four kinds; by religious and judicial standing they are binding in conscience, binding before a court, or binding in both. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7207} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7208} The right of ownership and the permitted right are bare rights with no fixed object. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7208} Rights of acquisition are graded: the bare permitted right or right of acquisition, which has no specific object; the fixed or binding right, a right to acquire a specific thing by the holder's will once a cause of ownership exists; and the established right, which settles on a particular thing even before ownership. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7209} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7210} The fixed right differs from the bare one in that it attaches to a specific thing and its holder can raise it to ownership by acceptance alone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7210} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7211} In spoils of war the established right becomes firm when the spoils are secured inside Muslim territory; it is then compensable on destruction, inheritable on the holder's death before division, and may not be sold before division. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7211} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7212} The established right resembles ownership in that it is compensable on destruction and inheritable by consensus, but it differs in that it cannot be sold or disposed of. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7213} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7214} Rights divide by how they are enforced: those that must go to a court (penalties and marriage-related rights), those that need no court (taking a specific object, a wife's or children's maintenance), and those disputed (collecting debts). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7214} The headword closes at the next entry, hiqqa ⁦(حُقّة)⁩. The headword closes at the next entry, hiqqa, p.7214."
  es: "Haqq significa, en el uso árabe, lo establecido, lo debido o lo cierto, lo opuesto a la falsedad. En términos de los juristas tiene dos sentidos: un juicio que se ajusta a la realidad y un deber establecido por la ley. Se divide entre el derecho de Dios y el derecho del siervo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174} Ibn al-Qayyim: El derecho de Dios no admite compromiso, como en el hudud, el zakat y las expiaciones, mientras que el derecho del siervo admite acuerdo, renuncia e intercambio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174} Usulis discrepó sobre si el derecho es la invocación divina en sí misma o el acto que obliga. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7176} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7177} Al-Qarafi divide las obligaciones en las de Dios únicamente, las del siervo únicamente y el caso mixto de calumnia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7176} Ibn Rajab enumera cinco tipos de derechos del sirviente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7177} Los juristas también usan la palabra para derechos financieros y no financieros, obligaciones contractuales, estipendios estatales y servidumbres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7178} La fuente de todo derecho es Dios, y el titular, la parte obligada y el objeto del derecho son sus pilares; el objeto debe ser lícito. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7179} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7180} Los juristas dividen los derechos en derecho puro de Dios, derecho puro del siervo y derechos mixtos. El derecho puro del siervo es aquel cuyo beneficio pertenece a una persona específica, como la deuda y el dinero de sangre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7185} En un derecho mixto prevalece una parte: la calumnia (qadhf) es principalmente derecho de Dios, por lo que las penas se fusionan, la pena no es heredada, el perdón no la cancela y el imán la ejecuta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7185} La represalia por matar (qisas) es principalmente derecho del siervo, por lo que los herederos de la víctima pueden demandar o no, perdonar o llegar a un acuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7186} Los malikíes dividen el derecho del siervo en tres: debido por Dios a él, debido en general y debido de un siervo a otro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7186} Al-Zarkashi establece el orden cuando los derechos chocan: los derechos de Dios, como la oración, el zakat, el ayuno y la peregrinación, tienen prioridad; los derechos humanos tienen prioridad en la coacción y las concesiones; y en el zakat contra una deuda, la opinión más sólida da prioridad al derecho de Dios. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7189} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7190} Los derechos de Dios no pueden ser renunciados por las personas, nadie puede conspirar para dejar de realizar actos de adoración, y no se puede hacer ningún acuerdo sobre hudud puro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7191} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7193} El derecho del sirviente puede ser renunciado por quien sea competente para disponer y cuyo objeto sea renunciable; la renuncia abarca objetos, deudas, usufructos y derechos irrestrictos, y las escuelas discrepan sobre aceptar un intercambio por un derecho. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7194} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7196} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7197} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7198} Al-Shatibi divide los derechos según si su propósito es inteligible: la adoración es el derecho puro de Dios y no admite socios. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7198} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7199} Los actos de costumbre tocan el derecho de Dios a través del ordenamiento universal y el derecho del siervo en la otra vida y el beneficio mundano. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7200} Los derechos se dividen por definición en fijos, no fijos y controvertidos; los derechos fijos (las cinco oraciones, las cantidades del zakat, los precios) obligan a la obligación una vez que existe su causa y no caducan por silencio o tiempo, mientras que los derechos no fijos (caridad, gastos en parientes) obligan solo después de ser fijados por acuerdo, arreglo o un juez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7201} El sustento de una esposa es controvertido: la mayoría lo considera vinculante para la obligación, los Hanafis solo una vez que el gobernante lo fija. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7202} La fijación varía según el titular, la persona obligada, el objeto, la cantidad, el lugar, el tiempo, la dirección y el número. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7202} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7203} Los derechos son completos o atenuados por una excusa legal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7203} Por herencia, los derechos se heredan, se transmiten por sucesión sin herencia, o no se transfieren en absoluto, como ocurre con los cargos, la representación y la elección entre esposas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7203} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7204} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7205} Los juristas no están de acuerdo en heredar la opción de estipulación, elección, defecto y aceptación, y en usufructos; los hanafis y los hanbalis niegan la herencia de la opción estipulada, los malikis y shafiis la permiten, y la represalia recae sobre los herederos de la víctima por sucesión, no por herencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7205} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7206} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7207} Por valor financiero, los derechos se dividen en cuatro tipos; por condición religiosa y judicial son vinculantes en conciencia, vinculantes ante un tribunal o vinculantes en ambos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7207} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7208} El derecho de propiedad y el derecho permitido son derechos desnudos sin objeto fijo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7208} Los derechos de adquisición se clasifican: el derecho permitido o derecho de adquisición simple, que no tiene un objeto específico; el derecho fijo o vinculante, un derecho a adquirir una cosa específica por voluntad del titular una vez que existe una causa de propiedad; y el derecho establecido, que se asienta sobre una cosa particular incluso antes de la propiedad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7209} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7210} El derecho fijo se diferencia del derecho permitido en que se vincula a una cosa específica y su titular puede elevarla a la propiedad mediante la sola aceptación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7210} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7211} En el botín de guerra, el derecho establecido se vuelve firme cuando el botín se asegura dentro del territorio musulmán; entonces es compensable en caso de destrucción, heredable a la muerte del poseedor antes de la división, y no puede venderse antes de la división. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7211} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7212} El derecho establecido se asemeja a la propiedad en que es compensable en caso de destrucción y heredable por consenso, pero difiere en que no puede venderse ni disponerse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7213} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7214} Los derechos se dividen según cómo se hacen cumplir: aquellos que deben ir a un tribunal (penas y derechos relacionados con el matrimonio), aquellos que no necesitan un tribunal (toma de un objeto específico, manutención de la esposa o los hijos) y aquellos en disputa (cobro de deudas). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7214} La palabra principal se cierra en la siguiente entrada, hiqqa ⁦(حُقّة)⁩. La palabra principal se cierra en la siguiente entrada, hiqqa, p.7214."
  fr: "En arabe, le terme « haqq » désigne ce qui est établi, dû ou certain, à l'opposé du mensonge. Du point de vue juridique, il revêt deux sens: un jugement conforme à la réalité et une obligation légale. Il relève à la fois du droit divin et du droit du serviteur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174} Ibn al-Qayyim: Le droit divin est inaliénable, comme en témoignent les hudud, la zakat et les expiations, tandis que le droit du serviteur admet la conciliation, la renonciation et l'échange. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174} Les Usulis divergeaient quant à la nature du droit: s'agit-il de l'autorité divine elle-même ou de l'acte qu'elle impose ? {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7176} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7177} Al-Qarafi divise les obligations entre celles de Dieu seul, celles du serviteur seul et le cas mixte de calomnie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7176} Ibn Rajab énumère cinq types de droits du serviteur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7177} Les juristes utilisent également le mot pour désigner les droits financiers et non financiers, les obligations contractuelles, les allocations de l'État et les servitudes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7178} La source de tout droit est Dieu, et le titulaire, le débiteur et l'objet du droit en sont les piliers; l'objet doit être licite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7179} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7180} Les juristes distinguent les droits purs de Dieu, les droits purs du serviteur et les droits mixtes. Le droit pur du serviteur est celui dont le bénéfice revient à une personne spécifique, comme la dette et le prix du sang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7185} En cas de droit mixte, l'un des deux prévaut: la calomnie (qadhf) relève principalement du droit de Dieu, les peines se confondent donc, la peine n'est pas transmissible par héritage, le pardon ne l'annule pas et l'imam l'exécute. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7185} La vengeance pour meurtre (qisas) relève principalement du droit du serviteur, les héritiers de la victime peuvent donc intenter une action en justice, accorder le pardon ou transiger. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7186} Les Malikites divisent le droit du serviteur en trois catégories: le droit que Dieu lui doit, le droit général et le droit d'un serviteur envers un autre. Al-Zarkashi établit l'ordre de priorité en cas de conflit de droits: les droits de Dieu, tels que la prière, la zakat, le jeûne et le pèlerinage, priment; les droits humains priment en matière d'obligation et de concessions; et, pour la zakat sur une dette, l'avis le plus judicieux donne la priorité aux droits de Dieu. Les droits de Dieu sont inaliénables, nul ne peut se soustraire aux actes de culte, et aucun arrangement ne peut être conclu concernant les obligations religieuses pures (hudud). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7191} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7193} Le droit du serviteur peut être abandonné par celui qui est compétent pour disposer et dont l'objet est susceptible d'abandon; l'abandon couvre les objets, les dettes, les usufruits et les droits absolus, et les écoles divergent sur la question d'accepter un échange contre un droit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7194} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7196} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7197} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7198} Al-Shatibi divise les droits selon que leur objectif est intelligible: l'adoration est le pur droit de Dieu et n'admet aucun partenaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7198} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7199} Les actes de coutume touchent le droit de Dieu à travers l'ordre universel et le droit du serviteur dans l'au-delà et dans le bénéfice du monde. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7200} Par définition, les droits se divisent en droits fixes, droits non fixes et droits contestés. Les droits fixes (les cinq prières, le montant de la zakat, les prix) engagent la responsabilité dès l'existence de leur cause et ne s'éteignent ni par le silence ni par le temps. Les droits non fixes (la charité, les dépenses pour les proches) ne sont obligatoires qu'après avoir été fixés par accord, transaction ou décision judiciaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7201} L'obligation alimentaire envers l'épouse est sujette à controverse: la majorité la considère comme obligatoire, tandis que les hanafites ne l'exigent qu'après fixation par le souverain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7202} La fixation varie selon le titulaire, le débiteur, l'objet, le montant, le lieu, le moment, la direction et le nombre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7202} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7203} Les droits sont soit complets, soit atténués par une excuse légitime. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7203} Par héritage, les droits sont soit hérités, soit transmis par succession sans héritage, soit non transmissibles, comme c'est le cas pour les charges, le mandat et le choix entre les épouses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7203} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7204} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7205} Les juristes ne sont pas d'accord sur l'héritage de l'option de stipulation, de choix, de défaut et d'acceptation, et sur les usufruits; les Hanafis et les Hanbalis nient l'héritage de l'option stipulée, les Malikis et les Shafiis l'autorisent, et les représailles reviennent aux héritiers de la victime par succession et non par héritage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7205} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7206} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7207} Par valeur financière, les droits se répartissent en quatre types; par leur statut religieux et judiciaire, ils sont contraignants en conscience, contraignants devant un tribunal ou contraignants dans les deux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7207} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7208} Le droit de propriété et le droit autorisé sont des droits nus sans objet fixe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7208} Les droits d'acquisition sont classés en plusieurs catégories: le droit d'acquisition, qui n'a pas d'objet précis; le droit acquis, qui confère le droit d'acquérir une chose déterminée par la volonté de son titulaire dès lors qu'une cause de propriété existe; et le droit établi, qui porte sur une chose particulière avant même l'acquisition de la propriété. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7209} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7210} Le droit acquis se distingue du droit d'acquisition en ce qu'il porte sur une chose déterminée et que son titulaire peut l'élever au rang de propriété par la seule acceptation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7210} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7211} En matière de butin de guerre, le droit acquis devient ferme lorsque le butin est sécurisé en territoire musulman; il est alors indemnisable en cas de destruction, transmissible par héritage au décès du titulaire avant le partage, et ne peut être vendu avant le partage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7211} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7212} Le droit acquis s'apparente à la propriété en ce qu'il est indemnisable en cas de destruction et transmissible par consensus, mais il s'en distingue par son incapacité à être vendu ou aliéné. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7213} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7214} Les droits se divisent selon leur mode d'application: ceux qui nécessitent une intervention judiciaire (sanctions et droits liés au mariage), ceux qui ne requièrent pas de tribunal (obtention d'un bien précis, pension alimentaire pour l'épouse ou les enfants) et ceux qui font l'objet de litiges (recouvrement de créances). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7214} Le titre se termine à l'entrée suivante, hiqqa ⁦(حُقّة)⁩. Le titre se termine à l'entrée suivante, hiqqa, p. 7214."
  ur: "حق کا مطلب ہے عربی زبان میں جو چیز قائم، مقروض یا یقینی ہے، باطل کے مخالف۔ فقہاء کی اصطلاح میں اس کے دو حواس ہیں: ایک ایسا فیصلہ جو حقیقت سے میل کھاتا ہو، اور ایک فرض جو قانون نے قائم کیا ہو۔ یہ خدا کے حق اور بندے کے حق میں آتا ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 7174} ابن القیم: خدا کا حق کوئی سمجھوتہ نہیں کرتا جیسا کہ حدود، زکوٰۃ اور کفارہ میں ہے، جب کہ بندے کا حق تصفیہ، چھوٹ اور تبادلے کو تسلیم کرتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7174} اصول اس بات سے متفق نہیں ہیں کہ حق خود خدائی خطاب ہے یا اس کا پابند عمل۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.7176} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7177} القرافی نے واجبات کو خدا کے اکیلے، بندے کے اکیلے اور غیبت کی مخلوط صورت میں تقسیم کیا ہے۔ ابن رجب نے بندے کے حق کی پانچ قسمیں بیان کی ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7177} فقہاء یہ لفظ مالی اور غیر مالی استحقاق، معاہدہ کی ذمہ داریوں، ریاستی وظیفوں اور سہولتوں کے لیے بھی استعمال کرتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص7178} ہر حق کا سرچشمہ خدا ہے اور حامل، واجب الاطاعت اور حق کی چیز اس کے ستون ہیں۔ اعتراض جائز ہونا چاہیے. {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.7179} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7180} فقہاء حقوق کو خدا کے خالص حق، بندے کے خالص حق اور مخلوط حقوق میں تقسیم کرتے ہیں۔ بندے کا خالص حق وہ ہے جس کا فائدہ کسی خاص شخص کو ہو، جیسے قرض اور خون۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7185} مخلوط حق میں ایک طرف غالب ہوتا ہے: غیبت ⁦(قذف)⁩ بنیادی طور پر خدا کا حق ہے، اس لیے سزائیں مل جاتی ہیں، سزا وراثت میں نہیں ملتی، معافی اسے منسوخ نہیں کرتی، اور امام اسے انجام دیتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7185} قتل کا بدلہ ⁦(قصاص)⁩ بنیادی طور پر بندے کا حق ہے، اس لیے مقتول کے ورثا مقدمہ کر سکتے ہیں یا نہیں، معاف کر سکتے ہیں یا حل کر سکتے ہیں۔ {حوالہ: فقہ الموسوعۃ النور-v3 ص7186} مالکی بندے کے حق کو تین حصوں میں تقسیم کرتے ہیں: خدا کے ذمے اس کا مقروض، عام طور پر واجب الادا اور ایک بندے کا دوسرے کا مقروض۔ {حوالہ:فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 7186} الزرکشی جب حقوق آپس میں ٹکراتے ہیں تو ترتیب ترتیب دیتے ہیں: خدا کے حقوق جیسے نماز، زکوٰۃ، روزہ اور حج سب سے پہلے، انسانی حقوق جبر اور رعایت میں پہلے آتے ہیں، اور قرض کے مقابلہ میں زکوٰۃ میں حق بجانب خدا کا حق ادا کرتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7189} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7190} خدا کے حقوق لوگوں سے نہیں چھوٹ سکتے، کوئی بھی عبادت کو چھوڑنے کی سازش نہیں کر سکتا، اور خالص حد تک کوئی تصفیہ نہیں کیا جا سکتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7191} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7193} بندے کا حق اس شخص سے ساقط ہو سکتا ہے جو تصرف کرنے کا اہل ہو اور جس کا اعتراض ساقط ہو۔ چھوٹ اشیاء، قرضوں، استفادہ اور غیر محدود حقوق کا احاطہ کرتی ہے، اور اسکول کسی حق کے بدلے لینے پر متفق نہیں ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7194} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7196} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7197} شاطبی حقوق کو اس لحاظ سے تقسیم کرتا ہے کہ آیا ان کا مقصد قابل فہم ہے: عبادت خدا کا خالص حق ہے اور کسی کو شریک نہیں مانتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7198} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7199} رواج کے اعمال عالمگیر ترتیب کے ذریعے خدا کے حق اور آخرت اور دنیاوی فائدے میں بندے کے حق کو چھوتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7200} حقوق کی تعریف کے لحاظ سے مقررہ، غیر متعین اور متنازعہ میں تقسیم؛ مقررہ حقوق ⁦(پانچ نمازیں، زکوٰۃ کی رقمیں، قیمتیں)⁩ ذمہ داری کے پابند ہیں جب ان کا سبب موجود ہو اور خاموشی یا وقت سے ضائع نہیں ہوتا ہے، جب کہ غیر متعین حقوق ⁦(صدقہ، رشتہ داروں پر خرچ)⁩ معاہدے، تصفیہ یا جج کے ذریعے طے ہونے کے بعد ہی پابند ہوتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص7201} بیوی کے نفقہ میں اختلاف ہے: جمہور اس کو ذمہ داری کا پابند سمجھتے ہیں، حنفیہ صرف ایک بار جب حاکم اسے ٹھیک کر دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7202} تعین کرنے والے، واجب الادا شخص، چیز، مقدار، جگہ، وقت، سمت اور تعداد کے لحاظ سے مختلف ہوتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.7202} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7203} حقوق یا تو مکمل ہوتے ہیں یا جائز عذر سے ہلکے ہوتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.7203} وراثت کے ذریعے، حقوق وراثت میں ملتے ہیں، بغیر وراثت کے منتقل ہوتے ہیں، یا بالکل منتقل نہیں ہوتے، جیسا کہ دفاتر، ایجنسی اور بیویوں کے درمیان انتخاب ہوتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.7203} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7204} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7205} فقہا کا اختلاف، اختیار اور انتخاب میں اختلاف اور اختیار میں اختلاف استفادہ پر؛ حنفیہ اور حنبلی متعین کردہ اختیار کی وراثت سے انکار کرتے ہیں، مالکیہ اور شافعی اس کی اجازت دیتے ہیں، اور مقتول کے ورثا کو وراثت سے بدلہ ملتا ہے، نہ کہ میراث۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.7205} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7206} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7207} مالی قدر کے لحاظ سے، حقوق چار میں آتے ہیں۔ مذہبی اور عدالتی حیثیت سے وہ ضمیر کے پابند ہیں، عدالت کے سامنے پابند ہیں، یا دونوں میں پابند ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.7207} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7208} ملکیت کا حق اور اجازت شدہ حق بغیر کسی مقررہ چیز کے ننگے حقوق ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7208} حصول کے حقوق کی درجہ بندی کی گئی ہے: حصول کا بالکل جائز حق یا حق، جس کا کوئی خاص مقصد نہیں ہے۔ مقررہ یا پابند حق، ملکیت کی وجہ موجود ہونے کے بعد ہولڈر کی مرضی سے کسی خاص چیز کو حاصل کرنے کا حق؛ اور قائم شدہ حق، جو ملکیت سے پہلے ہی کسی خاص چیز پر طے پاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7209} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7210} مقررہ حق اس بات سے مختلف ہے کہ یہ کسی خاص چیز سے منسلک ہوتا ہے اور اس کا حامل اسے صرف قبولیت کے ذریعے ملکیت میں لے سکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.7210} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7211} غنیمت کی جنگ میں قائم شدہ حق اس وقت مضبوط ہو جاتا ہے جب مال غنیمت مسلمانوں کی سرزمین میں محفوظ ہو جاتا ہے۔ اس کے بعد یہ تباہی پر معاوضہ ہے، تقسیم سے پہلے ہولڈر کی موت پر وراثت میں ہے، اور تقسیم سے پہلے فروخت نہیں کیا جا سکتا. {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7211} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.7212} قائم شدہ حق ملکیت سے مشابہت رکھتا ہے کہ یہ تباہی پر معاوضہ ہے اور اجماع سے وراثت میں ہے، لیکن اس میں اختلاف یا فروخت نہیں کیا جا سکتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.7213} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7214} حقوق ان کے نافذ ہونے کے طریقہ سے تقسیم ہوتے ہیں: وہ جو عدالت میں جائیں ⁦(جرمانے اور شادی سے متعلق حقوق)⁩، وہ جن کے لیے بیوی یا بچوں کی کوئی خاص چیز کی ضرورت نہیں ہے۔ وہ متنازعہ ⁦(قرض جمع کرنا)⁩۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7214} سرخی اگلے اندراج پر بند ہو جاتی ہے، حقہ ⁦(حُقّة)⁩۔ ہیڈ ورڈ اگلے اندراج پر بند ہوتا ہے، حقہ، صفحہ 7214۔"
  tr: "Dilde 'haqq' yalanın zıttı, 'onay' ve 'zorunluluk' anlamına gelir. Zenginlik, mülk ve sabit varlık anlamına gelir. Anlamları arasında pay, görev ve kesinlik bulunur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7174} Terminolojide iki anlam vardır: gerçeğe karşılık gelen bir hüküm, karşıt yalanlık ve sabit bir görev. İki türden oluşur: Allah'ın hakkı ve hizmetkârların hakkı. Allah'ın hakkı, uzlaştırılamayacak veya sona erdirilemeyen hakktır; bölge, zekat ve kefaret gibi; hizmetlinin hakkı ise özel bir çıkarla ilgili olan ve uzlaşma, feragat ve takas kabul eden hakktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7174} Hak, hukuki hükmün sonucudur ve aralarındaki ilişki sebep ile sebep ilişkisidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7174} Usul âlimleri farklı görüşteydi: bazıları gerçeği hüküm koymuş, yani Allah'ın hitabını hesap vermenin eylemleriyle ilgili olarak koymuş, bazıları ise söylemin bağlı olduğu eylem yapmıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7176} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7177} Al-Karafi, yükümlülükleri yalnızca Allah'a ait olanlar (örneğin inanç) ve yalnızca hizmetkârlara ait olanlar borç olarak ve bunlar üzerindeki farklılıklar (örneğin iftira cezası) olarak ayırdı. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7176} İbn Receb insanların haklarını beş türe ayırmıştır: mülkiyet hakkı, mülkiyet hakkı, kullanım hakkı, uzmanlaşma hakkı ve haciz hakkı. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7177} Hukukçular, 'haqq'ı mali ve diğer haklara, sözleşmelerden doğan yükümlülüklere, kamu hazinesinden geçimlere, gayrimenkul olanaklarına ve opsiyon hakkı gibi soyut haklara uygulamışlardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7178} Hakkın kaynağı Yüce Allah'tır ve Şeriat, bu hakkı onaylar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7178} Her hakkın iki ayağı vardır: sahibi, ödemekle yükümlü olan ve meşrulaştırıldığı sürece haklı bir yere sahiptir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7179} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7180} Hak, gereklilik veya zorunluluk olma gibi birçok faktöre göre bölünmüştür; bu da bölümün ilerleyen bölümlerinde bahsedilmektedir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7180} Hukukçular gerçeği Tanrı'nın hakkı ile saf hizmetkârın hakkı ve gerçeğin neyle birleştiğine ayırmışlardır. Kölenin münhasır hakkı, belirli bir kişiye özgü olan borç, kan parası ve gasp edilen mülkü geri alma hakkı gibi haklardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7185} Karma durumlarda, haklardan biri geçerlidir: iftira cezası Allah'ın hakkının önüne geçer, bu yüzden ceza örtüşür ve ceza miras almaz ve ceza affedilince kaldırılmaz, infazı imama verilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7185} İntikam konusunda kölenin hakkı geçerlidir. Öldürülen kişinin vasisi dava açabilir ya da açmayabilir, affedebilir veya barışabilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7186} Maliki kategorisi hizmetçi hakkı üç türden oluşur: Tanrı üzerindeki hak, genel olarak hak ve diğer hizmetkarlar üzerindeki hak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7186} Al-Zarkashi, çatışma zamanlarında hakların düzenlenmesinden bahsetti: namaz, zekat, oruç ve hac yollarında Allah'ın haklarının önceliklendirilmesi, zorlama ve tavizlerde insan hakkının önceliklendirilmesi ve zekat ile insan dini arasındaki çatışmada görüşler vardır ve daha doğru görüş Allah'ın hakkını önceliklendirmektir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7189} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7190} Allah'ın hakkı, hizmetin kaldırılmasıyla feragat edilmez, ibadet fiillerinden vazgeçmenin etrafından dolanmak ya da saf sınırların ötesinde barış yapmak kabul edilemez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7191} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7193} Bir köle hakkından, onu elden çıkarmaya izin verilen ve yeri geri alınabilir olan birine verilmesi caizdir. Kabul edilebilirlik ise nesneleri, borçları, faydaları ve mutlak hakları kapsar. Hakların yerine geçme konusunda düşünce okulları arasında anlaşmazlıklar vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7194} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7196} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7197} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7198} Al-Shatibi, hakları anlamın makullüğüne göre üç kategoriye ayırmıştır ve ibadet, paylaşılamayan saf bir Tanrı hakkıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7198} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7199} Sıradan meseleler, Tanrı'nın evrensel statü açısından ve hizmetkârın Öbür'te ödül hakkı ile bu dünyada bereket verme hakkıyla ilgilidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7200} Haklar, sınırlı, sınırsız ve belirli kategorilere göre farklılık gösteren özgünlüklere göre ayrılır; sınırlı, beş zorunlu yükümlülük ve zekat ile satış fiyatlarındaki zorunlu tutarlar gibidir; sınırsız ise, Allah yolunda harcama ve akrabalara harcama gibidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7201} Sınırlı kararlar vardır; bunlar arasında sadece nedeni nedeniyle sorumlulukla ilgili olduğu ve sessizlik ya da zaman geçişiyle feragat edilmediği de vardır; sınırsız ise, karşılıklı anlaşma, uzlaşma veya hakimin kararıyla belirlenmedikçe sorumlulukla ilgili değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7201} Eşin nafakasının çoğunluk tarafından sorumluluk olarak belirlendiği tartışmalıdır, oysa Hanefi mezhebi bunun yalnızca hükümdarın kararıyla belirlendiğini savunur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7202} Karar, haklı sahibine, yükümlüye, ödenecek eşyaya, kader, yer, zaman, yön ve sayıya göre değişir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7202} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7203} Haklar mazeretsiz mutlak olarak bölünür ve meşru bir mazeretle seyreltir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7203} Miras hakları, miras yoluyla kurulan ancak miras alınmayan haklar ve miras veya devre dışı olmayan haklar (örneğin vasilik, ajans ve eş seçimi) olarak varislere devre olarak ayrılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7203} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7204} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7205} Hukukçular, şart, tanımlama, kusur, kabul, fayda ve misilleme seçeneğinin miras yoluyla kalıtılması konusunda farklı görüşlere sahiptir; Malikiler ve Şafi'ler ise şart seçeneğinin kalıtsal olduğunu, Hanafi ve Hanbalilerin ise kabul etmediğini savunur. Kısa, baştan itibaren mağdurun varisleri için kurulur, Abu Hanifa, Malik ve Şafii'ye göre miras yoluyla değil. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7205} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7206} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7207} Haklar finansmana göre dört kategoriye ayrılır ve ayrıca dini görev hakları, yargı görevleri ve dini görevler ile yargı hakları olarak da ayrılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7207}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7208} Mülkiyet hakkı ve izin verilen hak, belirli bir yerle ilgisi olmayan iki zayıf ve soyut haktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7208} Mülkiyet hakları seçimle üç seviyeye ayrılır: mülkiyet hakkı veya izin verilen mülkiyet hakkı, ki bu sadece belirli bir şeyle ilgisi olmayan bir haktır; sabit veya zorunlu hak, mülkiyet hakkı olan mülkiyet hakkı; ve henüz sahip olunmamış olsa bile, belirli bir mülkte tesis edilmiş onaylanmış hak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7209} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7210} Mülkiyet hakkından kurulan bir hak, belirli bir şeyle ilişkili olarak ayrılır ve sahibi, onu yalnızca kabul ederek krallığa yükseltebilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7210} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7211} Savaşta teyit edilen hak, İslam evinde edinilmesiyle doğrulanır, yok edilmeye tabi olur ve sahibi bölünmeden önce ölürse miras alır, bölünmeden önce satılmasına izin verilmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7211} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7212} Onaylanmış hak, yıkımla sorumlu olduğu ve uzlaşmayla miras kaldığı için mülkiyet gibidir; satılmasına veya elden çıkarılmasına izin verilmemesiyle ayrılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7213} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7214} Haklar, yargıya itiraz edilmesi gereken cezalar ve evlilikle ilgili haklar gibi; yasal tazminat gerektirmeyen konular (örneğin eş ve çocuklar için mal-mülk tahsilatı; ve telafi edilmeden tahsilat yapılmasının izinliliği konusunda tartışmalı olan alacaklar (örneğin borç tahsilatı) olarak ikiye ayrılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7214} Giriş, \"Haqqa\" girişine atıfta bulunarak sona erer. (Giriş şu başlıkla tamamlanmıştır: \"Haqqa\" s. 7214.) ⁩"
  id: "Dalam bahasa, 'haqq' berarti kebalikan dari kebohongan, dan 'penegasan' serta 'kewajiban.' Itu merujuk pada kekayaan, properti, dan entitas tetap. Maknanya meliputi bagian, kewajiban, dan kepastian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7174} Dalam terminologi, ada dua makna: aturan yang sesuai dengan kenyataan, kebohongan yang berlawanan, dan kewajiban tetap. Ada dua jenis: hak Allah dan hak para pelayan. Hak Allah adalah apa yang tidak dapat didamaikan atau dihapuskan, seperti hudud, zakat, dan penebusan, dan hak hamba adalah hak yang menyangkut kepentingan pribadi dan menerima rekonsiliasi, pengabaian, dan pertukaran. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7174} Hak adalah akibat dari putusan hukum, dan hubungan di antara keduanya adalah antara sebab dan sebab. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7174} Para ulama Usul berbeda: beberapa menjadikan kebenaran sebagai keputusan, yaitu ucapan Allah terkait dengan tindakan orang yang bertanggung jawab, dan beberapa menjadikan itu sebagai tindakan yang menjadi dasar wacana. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7176} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7177} Al-Qarafi membagi kewajiban menjadi yang hanya milik Allah, seperti iman, dan yang hanya milik hamba seperti hutang, dan apa yang berbeda di atasnya, seperti hukuman fitnah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7176} Ibn Rajab membagi hak orang menjadi lima jenis: hak kepemilikan, hak kepemilikan, hak usufruct, hak spesialisasi, dan hak keterikatan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7177} Para ahli hukum telah menerapkan 'haqq' pada hak keuangan dan hak lainnya, pada kewajiban yang timbul dari kontrak, pada kewajiban dari kas negara, pada fasilitas properti, dan pada hak abstrak seperti hak pilihan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7178} Sumber hak adalah Allah Yang Maha Kuasa, dan Syariahlah yang menegaskan hak tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7178} Setiap hak memiliki dua pilar: pemiliknya, yang wajib membayarnya, dan hak tersebut memiliki tempat yang merupakan barang yang sah, asalkan disahkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7179} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7180} Hak ini dibagi berdasarkan banyak pertimbangan, termasuk kebutuhan atau ketidakperluan, yang disebutkan kemudian dalam bab ini. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7180} Para ahli hukum membagi kebenaran menjadi hak Allah dan hak hamba suci, serta apa yang digabungkan oleh kebenaran. Hak eksklusif seorang budak adalah hak yang manfaatnya eksklusif bagi orang tertentu, seperti utang, uang darah, dan hak untuk mengambil kembali harta yang telah direbut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7185} Dalam kasus campuran, salah satu hak yang berlaku: hukuman hadd fitnah mengalahkan hak Allah, sehingga hukuman tumpang tindih dan hukuman tidak diwariskan atau dihapuskan dengan pengampunan terdakwa, dan eksekusinya diserahkan kepada imam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7185} Adapun pembalasan, hak budak yang berlaku. Wali orang yang dibunuh dapat mengajukan gugatan atau tidak, dan dapat mengampuni atau berdamai. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7186} Kategori hak hamba Maliki terdiri dari tiga jenis: hak atas Tuhan, hak secara umum, dan hak atas hamba lain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7186} Al-Zarkashi menyebutkan pengaturan hak di masa konflik: memprioritaskan hak Allah dalam doa, zakat, puasa, dan ziarah, memprioritaskan hak asasi manusia dalam paksaan dan konsesi, dan mengenai konflik antara zakat dan agama manusia, ada pendapat, dan pandangan yang lebih benar adalah memprioritaskan hak Allah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7189} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7190} Hak Allah tidak dilepaskan dengan penghapusan hamba, juga tidak diperbolehkan menghindari pengabaian atas ibadah, maupun membuat perdamaian melebihi batas murni. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7191} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7193} Diperbolehkan melepaskan hak budak kepada seseorang yang diizinkan untuk menjualnya dan tempatnya dapat dicabut. Penerimaan mencakup objek, hutang, manfaat, dan hak mutlak. Ada perbedaan pendapat di antara aliran pemikiran mengenai penggantian hak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7194} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7196} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7197} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7198} Al-Shatibi membagi hak menurut kewajaran makna ke dalam tiga kategori, dan penyembahan adalah hak murni Tuhan yang tidak dapat dibagi. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7198} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7199} Hal-hal biasa berkaitan dengan hak Allah dalam hal status universal yang termasuk dalam kebutuhan, dan hak hamba dalam bentuk ganjaran di akhirat dan pemberian berkah di dunia ini. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7200} Hak dibagi berdasarkan kekhususan menjadi terbatas, tidak terbatas, dan berbeda dalam kategori tertentu; terbatas seperti lima bea wajib dan jumlah yang diperlukan dalam zakat dan harga jual; yang tak terbatas seperti amal, membelanjakan demi Allah, dan membelanjakan untuk kerabat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7201} Terbatas memiliki keputusan, termasuk bahwa ia berkaitan dengan tanggung jawab hanya karena penyebabnya, dan tidak dikecualikan dengan diam atau waktu; sedangkan yang tak terbatas, tidak terkait dengan tanggung jawab kecuali setelah ditentukan melalui kesepakatan bersama, rekonsiliasi, atau putusan hakim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7201} Diperdebatkan bahwa tunjangan istri ditetapkan sebagai tanggung jawab menurut mayoritas, sedangkan aliran Hanafi berpendapat bahwa itu hanya ditetapkan oleh keputusan penguasa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7202} Penentuan bervariasi tergantung pada pemilik sah, pihak yang berwajib, hak yang harus dibayar, takdir, tempat, waktu, arah, dan jumlah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7202} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7203} Hak dibagi menjadi mutlak tanpa alasan dan dicampur oleh alasan yang sah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7203} Hak ini dibagi sesuai transfer kepada ahli waris menjadi hak warisan, hak yang ditetapkan melalui suksesi tapi tidak diwariskan, dan hak yang tidak diwariskan atau dialihkan, seperti wali, agensi, dan pilihan istri. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7203} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7204} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7205} Para ahli hukum berbeda pendapat mengenai warisan pilihan kondisi, penunjukan, cacat, penerimaan, manfaat, dan pembalasan; Malikis dan Shafi'i berpendapat bahwa pilihan syarat diwarisi, sementara Hanafi dan Hanbalis tidak menerimanya. Qisas ditetapkan untuk ahli waris korban sejak awal, bukan melalui warisan menurut Abu Hanifa, Malik, dan Shafi'i. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7205} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7206} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7207} Hak-hak dibagi menurut keuangan menjadi empat kategori, dan juga dibagi menjadi hak kewajiban agama, kewajiban yudisial, serta kewajiban agama dan hak yudisial. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7207} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7208} Hak kepemilikan dan hak yang diperbolehkan adalah dua hak lemah dan abstrak yang tidak menyangkut tempat tertentu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7208} Hak kepemilikan dibagi berdasarkan pilihan menjadi tiga tingkat: hak kepemilikan atau properti yang diperbolehkan, yang hanyalah hak yang tidak terkait dengan suatu benda tertentu; hak tetap atau wajib, yaitu hak untuk memiliki sesuatu yang ditentukan oleh wasiat pemilik berdasarkan alasan kepemilikan; dan hak yang telah dikonfirmasi yang telah ditetapkan dalam suatu properti tertentu meskipun properti tersebut belum dimiliki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7209} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7210} Hak yang ditetapkan dari hak kepemilikan dibedakan dengan terkait dengan suatu benda tertentu, dan pemegangnya dapat mengangkatnya menjadi raja dengan menerimanya saja. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7210} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7211} Hak yang dikonfirmasi dalam perang dikonfirmasi dengan memperoleh hak itu di rumah Islam, hak itu dapat dihancurkan, dan diwariskan jika pemiliknya meninggal sebelum pembagian, dan tidak diperbolehkan menjualnya sebelum pembagian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7211} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7212} Hak yang dikonfirmasi ini serupa dengan kepemilikan karena bertanggung jawab melalui penghancuran dan diwariskan melalui konsensus, dan dipisahkan darinya dengan tidak mengizinkan dijual atau dibuang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7213} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7214} Hak-hak dibagi dalam hal pemenuhan menjadi hal-hal yang memerlukan banding ke pengadilan, seperti hukuman dan hak terkait pernikahan; yang tidak memerlukan kompensasi hukum, seperti penagihan properti dan tunjangan untuk istri dan anak-anak; serta apa yang diperdebatkan tentang kelayakan penagihan tanpa menggantinya, seperti penagihan utang. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7214} Entri ini diakhiri dengan referensi pada entri \"Haqqa.\" (Entri ini diisi dengan judul berikut: \"Haqqa\" hlm. 7214.) ⁩"
