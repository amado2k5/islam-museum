label: { ar: "الحق", en: "Right (haqq)", ur: "حق" }
summary:
  ar: "الحق في اللغة خلاف الباطل، والثبوت والوجوب، ويطلق على المال والملك والموجود الثابت، ومن معانيه النصيب والواجب واليقين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174} وفي الاصطلاح معنيان: الحكم المطابق للواقع، ويقابله الباطل، والواجب الثابت. وهو قسمان: حق الله وحق العباد. فحق الله ما لا يقبل الصلح والإسقاط كالحدود والزكاة والكفارات، وحق العبد ما يتعلق به مصلحة خاصة له ويقبل الصلح والإسقاط والمعاوضة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174} والحق أثر للحكم الشرعي، والعلاقة بينهما علاقة المسبب بالسبب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174} واختلف علماء الأصول: فمنهم من جعل الحق هو الحكم، أي خطاب الله المتعلق بأفعال المكلفين، ومنهم من جعله الفعل الذي تعلق به الخطاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7176} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7177} وقسّم القرافي التكاليف إلى ما هو لله وحده كالإيمان، وما هو للعباد وحدهم كالديون، وما اختلف فيه كحد القذف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7176} وقسّم ابن رجب حقوق العباد إلى خمسة أنواع: حق الملك، وحق التملك، وحق الانتفاع، وحق الاختصاص، وحق التعلق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7177} وأطلق الفقهاء الحق على الحقوق المالية وغيرها، وعلى الالتزامات المترتبة على العقد، وعلى الأرزاق من بيت المال، وعلى مرافق العقار، وعلى الحقوق المجردة كحق الخيار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7178} ومصدر الحق هو الله تعالى، والشريعة هي التي تثبت الحق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7178} ولكل حق ركنان: صاحبه، والمكلف بأدائه، وله محل هو الشيء المستحق، ويشترط أن يكون مشروعا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7179} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7180} ويقسم الحق باعتبارات كثيرة، منها اللزوم وعدمه، وهو ما يذكره الباب بعد ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7180} (المدخل متصل بعد ص 7180 ولم يكتمل.)"
  en: "Haqq means, in Arabic usage, what is established, owed or certain, the opposite of falsehood. In the jurists' terms it has two senses: a judgement that matches reality, and a duty established by the law. It falls into the right of God and the right of the servant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174} Ibn al-Qayyim: God's right admits no compromise, as in the hudud, zakat and expiations, while the servant's right admits settlement, waiver and exchange. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174} Usulis disagreed whether the right is the divine address itself or the act it binds. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7176} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7177} Al-Qarafi divides obligations into God's alone, the servant's alone, and the mixed case of slander. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7176} Ibn Rajab lists five kinds of the servant's right. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7177} Jurists also use the word for financial and non-financial entitlements, for contractual obligations, for state stipends and for easements. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7178} The source of every right is God, and the holder, the obliged party and the object of the right are its pillars; the object must be lawful. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7179} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7180} The article continues beyond this scan and is not complete."
