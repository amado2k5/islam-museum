class: concept
kind: scientific
label: { ar: "المدة بين الهجرة ووفاة يزدجرد بالأيام", en: "The gap in days between the Hijra and the death of Yazdegerd", ur: "ہجرت اور یزدجرد کی وفات کے درمیان دنوں کا فاصلہ", es: "El lapso de días entre la Hégira y la muerte de Yazdegerd", fr: "L'intervalle de jours entre l'Hégire et la mort de Yazdegerd", tr: "Yazdegerd'in göçü ile ölümü arasındaki süre (gün olarak).", id: "Jangka waktu antara migrasi dan kematian Yazdegerd, dalam hari" }
summary:
  ar: "يحسب البتاني الفرق بين الهجرة وبين موت يزدجرد بثلاثة آلاف وستمائة وأربعة وعشرين يوماً، فيُنقص هذا العدد من أيام الهجرة للوصول إلى تاريخ الفرس من التاريخ الهجري. {cite:zij-sabi-nallino-byblion p.103}."
  en: "Al-Battani takes the gap between the Hijra and the death of Yazdegerd as 3,624 days, and subtracts this number from the Hijri day count to reach the Persian date from a Hijri one. {cite:zij-sabi-nallino-byblion p.103}."
  ur: "البتانی ہجرت اور یزدجرد کی وفات کے درمیان کا فرق 3,624 دن بتاتے ہیں، اور ہجری دنوں کی گنتی سے یہ عدد گھٹا کر ہجری تاریخ سے فارسی تاریخ تک پہنچتے ہیں۔ {cite:zij-sabi-nallino-byblion p.103}۔"
  es: "Al-Battani calcula que el lapso entre la Hégira y la muerte de Yazdegerd es de 3624 días, y resta este número del conteo de días del calendario islámico para obtener la fecha persa a partir de un día islámico. {cite:zij-sabi-nallino-byblion p.103}."
  fr: "Al-Battani considère que l'intervalle entre l'Hégire et la mort de Yazdegerd est de 3 624 jours, et soustrait ce nombre du décompte des jours hégiriens pour obtenir la date persane à partir d'une date hégirienne. {cite:zij-sabi-nallino-byblion p.103}."
  tr: "El-Battani, Hicri takvim ile Yazdegerd'in ölüm tarihi arasındaki farkı üç bin altı yüz yirmi dört gün olarak hesaplar ve bu sayıyı Hicri takvimden çıkararak Farsça tarihi Hicri takvimden elde eder. {cite:zij-sabi-nallino-byblion s.103}."
  id: "Al-Battani menghitung selisih antara Hijrah dan kematian Yazdegerd sebagai tiga ribu enam ratus dua puluh empat hari, mengurangi angka ini dari Hijrah untuk mendapatkan tanggal Persia dari kalender Hijriah. {cite:zij-sabi-nallino-byblion p.103}."
