  id: "heel"
summary:
  ar: "الكعب في الفقه العظم الناتئ عند ملتقى الساق والقدم، ويعني الحنفية به أيضاً العظم الذي في ظهر القدم عند معقد الشراك. ويجب غسل القدمين إلى الكعبين في الوضوء. ومن لم يجد نعلين في الإحرام لبس الخفين وقطعهما أسفل من الكعبين عند الجمهور. ويقطع السارق من مفصل الكعب عند أكثر الفقهاء، وحكي عن بعض السلف القطع من نصف القدم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13276} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13277}"
  en: "In jurisprudence ka'b is the protruding bone where the shin meets the foot; the Hanafis also apply the word to the bone on top of the foot at the strap line. Washing the feet up to the ankles is required in ablution. A pilgrim in the sacred state who cannot find sandals may wear leather socks, cut below the ankles, according to most jurists. Most jurists cut a thief's hand at the joint of the ankle, while some early scholars cut from the middle of the foot. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13276} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13277}"
  ur: "فقہ میں کعب وہ ابھری ہوئی ہڈی ہے جہاں پنڈلی اور پاؤں ملتے ہیں؛ حنفیہ اس لفظ کو پاؤں کے اوپر والی اس ہڈی پر بھی بولتے ہیں جو تسمے کے مقام پر ہوتی ہے۔ وضو میں دونوں پاؤں ٹخنوں تک دھونا واجب ہے۔ احرام میں جو جوتا نہ پائے وہ جمہور کے نزدیک موزے پہنے اور انہیں ٹخنوں سے نیچے کاٹ لے۔ جمہور چور کا ہاتھ ٹخنے کے جوڑ سے کاٹتے ہیں، جبکہ بعض سلف نے پاؤں کے درمیان سے کاٹنے کا قول کیا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13276} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13277}"
  es: "En jurisprudencia, ka'b es el hueso que sobresale donde la tibia se une al pie; los hanafíes también aplican el término al hueso en la parte superior del pie, a la altura de la línea del tendón. El lavado de los pies hasta los tobillos es obligatorio en la ablución. Un peregrino en estado sagrado que no encuentre sandalias puede usar calcetines de cuero, cortados por debajo de los tobillos, según la mayoría de los juristas. La mayoría de los juristas cortan la mano de un ladrón a la altura de la articulación del tobillo, mientras que algunos eruditos antiguos la cortan desde la mitad del pie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13276} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13277}"
  fr: "En jurisprudence, le terme « ka'b » désigne l'os saillant à la jonction du tibia et du pied; les hanafites l'appliquent également à l'os situé sur le dessus du pied, au niveau de la genu valgum. Le lavage des pieds jusqu'aux chevilles est obligatoire pour les ablutions. Un pèlerin en état de sacralisation qui ne trouve pas de sandales peut porter des chaussettes de cuir coupées sous les chevilles, selon la plupart des juristes. La plupart des juristes considèrent que la main d'un voleur est coupée à la cheville, tandis que certains savants anciens la coupaient au milieu du pied. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13276} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13277}"
  tr: "Fıkıhta, topuk, bacak ile ayak birleşiminde çıkan kemiktir ve Hanafiler ayrıca tuzakla bağlanan ayağın arkasındaki kemiği ifade eder. Abdest alma sırasında ayakların bileklerine kadar yıkanması zorunludur. İhremde sandalet bulamayan çorapları giymeli ve çoğunluğa göre topukların altından kesmelidir. Çoğu hukukçuya göre, hırsız topuğun eklemini keser ve bazı erken dönem bilginler ayağın yarısını kestiğini bildirmiştir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.13276} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13277}"
  id: "Dalam yurisprudensi, tumit adalah tulang yang menonjol di persimpangan kaki dan kaki, dan Hanafi juga merujuk pada tulang di belakang kaki saat ikatan perangkap. Wajib mencuci kaki hingga pergelangan kaki saat wuduk. Siapa pun yang tidak menemukan sandal di ihram harus mengenakan kaus kaki dan memotongnya di bawah tumit sesuai dengan mayoritas. Menurut sebagian besar ahli hukum, pencuri memotong sendi tumit, dan beberapa sarjana awal melaporkan memotong setengah kaki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13276} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13277}"
