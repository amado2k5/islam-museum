label:
  ar: "كَعْب"
  en: "Ankle (ka'b)"
  ur: "ٹخنہ (کعب)"
summary:
  ar: "الكعب في الفقه العظم الناتئ عند ملتقى الساق والقدم، ويعني الحنفية به أيضاً العظم الذي في ظهر القدم عند معقد الشراك. ويجب غسل القدمين إلى الكعبين في الوضوء. ومن لم يجد نعلين في الإحرام لبس الخفين وقطعهما أسفل من الكعبين عند الجمهور. ويقطع السارق من مفصل الكعب عند أكثر الفقهاء، وحكي عن بعض السلف القطع من نصف القدم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13276} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13277}"
  en: "In jurisprudence ka'b is the protruding bone where the shin meets the foot; the Hanafis also apply the word to the bone on top of the foot at the strap line. Washing the feet up to the ankles is required in ablution. A pilgrim in the sacred state who cannot find sandals may wear leather socks, cut below the ankles, according to most jurists. Most jurists cut a thief's hand at the joint of the ankle, while some early scholars cut from the middle of the foot. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13276} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13277}"
  ur: "فقہ میں کعب وہ ابھری ہوئی ہڈی ہے جہاں پنڈلی اور پاؤں ملتے ہیں؛ حنفیہ اس لفظ کو پاؤں کے اوپر والی اس ہڈی پر بھی بولتے ہیں جو تسمے کے مقام پر ہوتی ہے۔ وضو میں دونوں پاؤں ٹخنوں تک دھونا واجب ہے۔ احرام میں جو جوتا نہ پائے وہ جمہور کے نزدیک موزے پہنے اور انہیں ٹخنوں سے نیچے کاٹ لے۔ جمہور چور کا ہاتھ ٹخنے کے جوڑ سے کاٹتے ہیں، جبکہ بعض سلف نے پاؤں کے درمیان سے کاٹنے کا قول کیا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13276} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13277}"
