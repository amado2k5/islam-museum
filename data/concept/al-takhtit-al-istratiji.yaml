id: concept/al-takhtit-al-istratiji
class: concept
kind: discipline
label:
  ar: "التخطيط الاستراتيجي"
  en: "Strategic planning"
  fr: "Planification stratégique"
  ur: "سٹریٹجک منصوبہ بندی"
  es: "Planificación estratégica"
  tr: "Stratejik Planlama"
  id: "Perencanaan Strategis"
summary:
  ar: "التخطيط الاستراتيجي عند طارق السويدان: اتخاذ قرار عن اتجاه المستقبل، يبدأ من مستوى القطاع فما فوق ولخمس سنوات فأكثر، بخلاف التخطيط التشغيلي؛ ويعرض طريقة فايفر (Applied Strategic Planning) معدّلة بخبرته، من «التخطيط للتخطيط» إلى استعراض القيم."
  en: "Strategic planning as Tareq al-Suwaidan teaches it: a decision about the direction of the future, made at sector level and above and covering five years or more, unlike operational planning; he presents Pfeiffer's Applied Strategic Planning method, adjusted by his own experience, from 'planning to plan' through the values review."
  fr: "Dans l’enseignement de Tareq al-Suwaidan, la planification stratégique détermine une orientation pour l’avenir à l’échelle d’un secteur ou à un échelon supérieur et porte sur cinq ans ou davantage, à la différence de la planification opérationnelle. Il présente la méthode Applied Strategic Planning de Pfeiffer, adaptée à partir de son expérience, de la préparation du travail de planification à l’examen des valeurs."
  ur: "سٹریٹجک منصوبہ بندی جیسا کہ طارق السویدان سکھاتے ہیں: مستقبل کی سمت کے بارے میں فیصلہ، جو سیکٹر کی سطح اور اس سے اوپر اور کم از کم پانچ سال کے لیے ہوتا ہے، برخلاف آپریشنل منصوبہ بندی کے؛ وہ فائفر کی Applied Strategic Planning کی روش پیش کرتے ہیں، اپنے تجربے سے ترمیم شدہ، «منصوبہ بندی کے لیے منصوبہ بندی» سے لے کر اقدار کا جائزہ تک۔"
  es: "La planificación estratégica, tal como la enseña Tareq al-Suwaidan, es una decisión sobre la dirección del futuro, tomada a nivel sectorial o superior y que abarca cinco años o más, a diferencia de la planificación operativa; presenta el método de Planificación Estratégica Aplicada de Pfeiffer, adaptado a su propia experiencia, desde la \"planificación para planificar\" hasta la revisión de valores."
  tr: "Tariq Al-Suwaidan'dan Stratejik Planlama: Operasyonel planlamaya ek olarak, sektör düzeyinden başlayarak beş yıl veya daha uzun süre için geleceğin yönünü belirlemek; uzmanlığına göre uyarlanmış Uygulamalı Stratejik Planlama yöntemini 'planlama için planlama'dan değer değerlendirmesine kadar sunuyor."
  id: "Perencanaan Strategis dari Tariq Al-Suwaidan: Selain perencanaan operasional, ia menetapkan arah masa depan selama lima tahun atau lebih, dimulai dari tingkat sektor; menawarkan metode Perencanaan Strategis Terapan yang disesuaikan dengan keahliannya, mulai dari 'perencanaan untuk perencanaan' hingga penilaian nilai."
