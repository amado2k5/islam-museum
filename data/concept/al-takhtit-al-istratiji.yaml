id: concept/al-takhtit-al-istratiji
class: concept
kind: discipline
label:
  ar: "التخطيط الاستراتيجي"
  en: "Strategic planning"
  ur: "سٹریٹجک منصوبہ بندی"
summary:
  ar: "التخطيط الاستراتيجي عند طارق السويدان: اتخاذ قرار عن اتجاه المستقبل، يبدأ من مستوى القطاع فما فوق ولخمس سنوات فأكثر، بخلاف التخطيط التشغيلي؛ ويعرض طريقة فايفر (Applied Strategic Planning) معدّلة بخبرته، من «التخطيط للتخطيط» إلى استعراض القيم."
  en: "Strategic planning as Tareq al-Suwaidan teaches it: a decision about the direction of the future, made at sector level and above and covering five years or more, unlike operational planning; he presents Pfeiffer's Applied Strategic Planning method, adjusted by his own experience, from 'planning to plan' through the values review."
  ur: "سٹریٹجک منصوبہ بندی جیسا کہ طارق السویدان سکھاتے ہیں: مستقبل کی سمت کے بارے میں فیصلہ، جو سیکٹر کی سطح اور اس سے اوپر اور کم از کم پانچ سال کے لیے ہوتا ہے، برخلاف آپریشنل منصوبہ بندی کے؛ وہ فائفر کی Applied Strategic Planning کی روش پیش کرتے ہیں، اپنے تجربے سے ترمیم شدہ، «منصوبہ بندی کے لیے منصوبہ بندی» سے لے کر اقدار کا جائزہ تک۔"
