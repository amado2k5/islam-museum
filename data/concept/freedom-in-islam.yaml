label:
  ar: "الحرية في الإسلام"
  en: "Freedom in Islam"
  es: "Libertad en el Islam"
  fr: "La liberté en islam"
summary:
  ar: "يعرض محمد الخضر حسين الحرية بمعناها اللغوي أولًا: الخلوص والعتق، ثم بمعناها المقصود: أن تعيش الأمة في أمن واطمئنان، ويعرف كل فرد حدّه وحقوقه دون أن يعتدي أو يُحرم {cite:al-hurriyya-fi-al-islam-azhar p. 44} {cite:al-hurriyya-fi-al-islam-azhar p. 45}. ويرى أن الحرية وسط بين الإفراط والحرمان، وأن قوامها أربعة أمور: معرفة الإنسان ما له وما عليه، وشرف نفس يمنعه من الاعتداء، وإذعان للقوانين المنصفة، وعزة تمنعه من الخضوع للباطل {cite:al-hurriyya-fi-al-islam-azhar p. 45} {cite:al-hurriyya-fi-al-islam-azhar p. 46}. ويجعل التربية والتعليم أساس الحرية، فتكون الحكومة مسؤولة عن تهذيب الأخلاق وتنوير العقول قبل المحاسبة {cite:al-hurriyya-fi-al-islam-azhar p. 46} {cite:al-hurriyya-fi-al-islam-azhar p. 47}. ويرد على من فهم الحرية بوصفها اتباع الهوى أو القوة، ويقيم فسطاطها على قاعدتين هما المشورة والمساواة {cite:al-hurriyya-fi-al-islam-azhar p. 47} {cite:al-hurriyya-fi-al-islam-azhar p. 48}. وهذه قراءة المؤلف، ويعرضها بوصفها تفسيرًا إسلاميًا للحرية في مقابل مفاهيم الغرب."
  en: "Muhammad al-Khidr Husayn starts from the lexical sense of freedom as release and manumission, then from its purpose: a community living in security, where each person knows his rights and duties and is neither wronged nor deprived (pp. 44-45). He describes freedom as a mean between excess and deprivation, resting on four qualities: knowing one's rights and duties, a noble soul that refrains from aggression, submission to fair law, and a dignity that refuses wrong (pp. 45-46). Education is the base, so government must refine morals and enlighten minds first (pp. 46-47). He rejects reading freedom as following desire or force, and sets consultation and equality as its two pillars (pp. 47-48). This is the author's reading, offered as an Islamic account of freedom."
  es: "Muhammad al-Khidr Husayn parte del sentido léxico de libertad como liberación y manumisión, y luego de su propósito: una comunidad que vive en seguridad, donde cada persona conoce sus derechos y deberes y no sufre injusticias ni privaciones (pp. 44-45). Describe la libertad como un término medio entre el exceso y la privación, fundamentado en cuatro cualidades: el conocimiento de los propios derechos y deberes, un alma noble que se abstiene de la agresión, la sumisión a la ley justa y una dignidad que rechaza la injusticia (pp. 45-46). La educación es la base, por lo que el gobierno debe primero refinar la moral e iluminar las mentes (pp. 46-47). Rechaza la interpretación de la libertad como un ejercicio de deseo o fuerza, y establece la consulta y la igualdad como sus dos pilares (pp. 47-48). Esta es la interpretación del autor, presentada como una concepción islámica de la libertad."
  fr: "Muhammad al-Khidr Husayn part du sens lexical de la liberté comme libération et affranchissement, puis de sa finalité: une communauté vivant en sécurité, où chacun connaît ses droits et ses devoirs et n’est ni lésé ni privé de rien (p. 44-45). Il décrit la liberté comme un juste milieu entre excès et privation, reposant sur quatre qualités: la connaissance de ses droits et de ses devoirs, une âme noble qui s’abstient d’agression, la soumission à une loi juste et une dignité qui refuse l’injustice (p. 45-46). L’éducation en est le fondement; le gouvernement doit donc d’abord élever les mœurs et éclairer les esprits (p. 46-47). Il réfute une conception de la liberté comme obéissance au désir ou à la force, et érige la consultation et l’égalité en ses deux piliers (p. 47-48). Telle est l’interprétation de l’auteur, proposée comme une conception islamique de la liberté."
