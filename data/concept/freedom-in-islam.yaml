label:
  ar: "الحرية في الإسلام"
  en: "Freedom in Islam"
summary:
  ar: "يعرض محمد الخضر حسين الحرية بمعناها اللغوي أولًا: الخلوص والعتق، ثم بمعناها المقصود: أن تعيش الأمة في أمن واطمئنان، ويعرف كل فرد حدّه وحقوقه دون أن يعتدي أو يُحرم {cite:al-hurriyya-fi-al-islam-azhar p. 44} {cite:al-hurriyya-fi-al-islam-azhar p. 45}. ويرى أن الحرية وسط بين الإفراط والحرمان، وأن قوامها أربعة أمور: معرفة الإنسان ما له وما عليه، وشرف نفس يمنعه من الاعتداء، وإذعان للقوانين المنصفة، وعزة تمنعه من الخضوع للباطل {cite:al-hurriyya-fi-al-islam-azhar p. 45} {cite:al-hurriyya-fi-al-islam-azhar p. 46}. ويجعل التربية والتعليم أساس الحرية، فتكون الحكومة مسؤولة عن تهذيب الأخلاق وتنوير العقول قبل المحاسبة {cite:al-hurriyya-fi-al-islam-azhar p. 46} {cite:al-hurriyya-fi-al-islam-azhar p. 47}. ويرد على من فهم الحرية بوصفها اتباع الهوى أو القوة، ويقيم فسطاطها على قاعدتين هما المشورة والمساواة {cite:al-hurriyya-fi-al-islam-azhar p. 47} {cite:al-hurriyya-fi-al-islam-azhar p. 48}. وهذه قراءة المؤلف، ويعرضها بوصفها تفسيرًا إسلاميًا للحرية في مقابل مفاهيم الغرب."
  en: "Muhammad al-Khidr Husayn starts from the lexical sense of freedom as release and manumission, then from its purpose: a community living in security, where each person knows his rights and duties and is neither wronged nor deprived (pp. 44-45). He describes freedom as a mean between excess and deprivation, resting on four qualities: knowing one's rights and duties, a noble soul that refrains from aggression, submission to fair law, and a dignity that refuses wrong (pp. 45-46). Education is the base, so government must refine morals and enlighten minds first (pp. 46-47). He rejects reading freedom as following desire or force, and sets consultation and equality as its two pillars (pp. 47-48). This is the author's reading, offered as an Islamic account of freedom."
