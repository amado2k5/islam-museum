summary:
  ar: "استقصى ابن النديم أخبار ابتداء الخط العربي: قال هشام بن الكلبي أول من وضعه قوم من العرب العاربة نزلوا في عدنان بن أدد أسماؤهم أبو جاد وهواز وحطي وكلمون وصعفض وقرشات، وهم ملوك مدين الذين كان مهلكهم يوم الظلة في زمن شعيب، فوضعوا الكتابة على أسمائهم ثم وجدوا حروفاً ليست من أسمائهم وهي الثاء والخاء والذال والظاء والشين والغين فسموها الروادف، وفي كتاب مكة لعمر بن شبة أن الذي كتب العربي الجزم رجل من بني يخلد بن النضر بن كنانة، وقيل حمل الكتابة إلى قريش أبو قيس بن عبد مناف بن زهرة وقيل حرب بن أمية، وأن أول الخطوط العربية المكي ثم المدني ثم البصري ثم الكوفي وأن المكي والمدني في ألفاتهما تعويج إلى يمنة اليد وأعلى الأصابع وفي شكلهما انضجاع يسير {cite:fihrist-ibn-al-nadim p. 9-14}."
  en: "Hisham al-Kalbi's abjad-kings of Madyan, the rawadif letters, and the Makki/Madani/Basri/Kufi line {cite:fihrist-ibn-al-nadim p. 9-14}."
  es: "Los reyes abjad de Madyan de Hisham al-Kalbi, las letras rawadif y la línea Makki/Madani/Basri/Kufi {citar:fihrist-ibn-al-nadim p. 9-14}."
  fr: "Les abjad-rois de Madyan de Hisham al-Kalbi, les lettres rawadif et la lignée Makki/Madani/Basri/Kufi {cite:fihrist-ibn-al-nadim p. 9-14}."
  ur: "ہشام الکلبی کے ابجد بادشاہ مدین، روادیف خطوط، اور مکی/مدنی/بصری/کوفی سطر {حوالہ: فہرست ابن الندیم ص۔ 9-14}۔"
  tr: "İbn el-Nadim, Arap alfabesinin başlangıcını araştırmıştır: Hişam ibn el-Kalbi, Arap alfabesini ilk kuranların, Adnan ibn Addad'a yerleşen ve isimleri Ebu Jad, Hawaz, Hawtti, Kalmoon, Sa'fad ve Karşat olan bir grup Arap olduğunu söylemiştir. Bunlar, Şuayb zamanında Gölge Günü'nde yıkımları gerçekleşen Midyan krallarıydı. İsimlerini yazmış, sonra isimleri arasında olmayan harfleri bulmuşlardır; yani tha, kha, dhā, dhā, shīn ve ghīn ve bu yüzden onlara eşanlamlılar demişlerdir. Ömer ibn Şabbah'ın Mekke kitabında, Arapça'yı kesin olarak yazanın Banu'dan bir adam olduğu belirtilir Ölümsüz ibn al-Nadr ibn Kinana'dır ve yazının Kureyş Ebu Kays ibn Abd Manaf ibn Zuhra'ya aktarıldığı söylenir; Harb ibn Umeyye olduğu söylenir. En eski Arap yazıları önce Mekke, sonra Medinan, sonra Basri, sonra Kufi alfabeleridir ve Mekke ile Medine alfabeleri sağ ele ve parmakların üstüne doğru kıvrılmış, şekilleri hafifçe eğilmiştir. {atıf:Fihrist-ibn-al-Nadim s. 9-14}."
  id: "Ibn al-Nadim menyelidiki awal mula aksara Arab: Hisham ibn al-Kalbi mengatakan bahwa yang pertama menetapkannya adalah sekelompok Arab Arab yang menetap di Adnan ibn Addad dengan nama Abu Jad, Hawaz, Hawtti, Kalmoon, Sa'fad, dan Qarshat. Mereka adalah raja-raja Midian, yang kehancurannya terjadi pada Hari Bayangan pada masa Shu'ayb. Mereka menulis nama mereka dan kemudian menemukan huruf-huruf yang tidak termasuk dalam nama mereka, yaitu tha, kha, dhā, dhā, shīn, dan ghīn, sehingga mereka menyebutnya sinonim. Dalam kitab Mekah karya Umar ibn Shabbah, disebutkan bahwa yang menulis bahasa Arab dengan pasti adalah seorang pria dari Banu Abadi ibn al-Nadr ibn Kinana, dan dikatakan bahwa tulisan itu diwariskan kepada Quraysh Abu Qays ibn Abd Manaf ibn Zuhra, dan dikatakan sebagai Harb ibn Umayyah. Aksara Arab paling awal adalah Mekah, kemudian Madinah, kemudian Basri, kemudian Kufi, dan alfabet Mekah serta Madinah melengkung ke tangan kanan dan atas jari, dan bentuknya sedikit miring. {kutip: Fihrist-ibn-al-Nadim hlm. 9-14}."
