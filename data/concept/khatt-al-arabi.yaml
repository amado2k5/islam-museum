label: { ar: "الخط العربي", en: "The Arabic script" }
summary:
  ar: "استقصى ابن النديم أخبار ابتداء الخط العربي: قال هشام بن الكلبي أول من وضعه قوم من العرب العاربة نزلوا في عدنان بن أدد أسماؤهم أبو جاد وهواز وحطي وكلمون وصعفض وقرشات، وهم ملوك مدين الذين كان مهلكهم يوم الظلة في زمن شعيب، فوضعوا الكتابة على أسمائهم ثم وجدوا حروفاً ليست من أسمائهم وهي الثاء والخاء والذال والظاء والشين والغين فسموها الروادف، وفي كتاب مكة لعمر بن شبة أن الذي كتب العربي الجزم رجل من بني يخلد بن النضر بن كنانة، وقيل حمل الكتابة إلى قريش أبو قيس بن عبد مناف بن زهرة وقيل حرب بن أمية، وأن أول الخطوط العربية المكي ثم المدني ثم البصري ثم الكوفي وأن المكي والمدني في ألفاتهما تعويج إلى يمنة اليد وأعلى الأصابع وفي شكلهما انضجاع يسير {cite:fihrist-ibn-al-nadim p. 9-14}."
  en: "Hisham al-Kalbi's abjad-kings of Madyan, the rawadif letters, and the Makki/Madani/Basri/Kufi line {cite:fihrist-ibn-al-nadim p. 9-14}."
