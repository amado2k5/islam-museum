id: concept/asma-yawm-al-qiyama
class: concept
kind: belief
label:
  ar: "أسماء يوم القيامة"
  en: "The names of the Day of Resurrection"
  ur: "قیامت کے دن کے نام"
summary:
  ar: "لليوم في القرآن أسماء كثيرة كلها تصفه: يوم القيامة ويوم الدين ويوم البعث ويوم النشور ويوم الحشر ويوم الفصل ويوم الحساب ويوم التلاق ويوم التغابن ويوم الحسرة ويوم الوعيد ويوم الجمع ويوم القرار، والحاقة والقارعة والصاخة والغاشية والآزفة والواقعة {cite:tafsir-ibn-kathir}."
  en: "The Day carries many Qur'anic names, all describing it: yawm al-qiyama, yawm al-din, yawm al-ba'th, yawm al-nushur, yawm al-hashr, yawm al-fasl, yawm al-hisab, yawm al-talaq, yawm al-taghabun, yawm al-hasra, yawm al-wa'id, yawm al-jam', yawm al-qarar, al-Haqqa, al-Qari'a, al-Sakhkha, al-Ghashiya, al-Azifa and al-Waqi'a {cite:tafsir-ibn-kathir}."
  ur: "قرآن میں دن کے بہت سے نام ہیں جو سب اس کی صفات بتاتے ہیں: یوم القیامة، یوم الدین، یوم البعث، یوم النشور، یوم الحشر، یوم الفصل، یوم الحساب، یوم التلاق، یوم التغابن، یوم الحسرة، یوم الوعید، یوم الجمع، یوم القرار، اور الحاقہ، القارعہ، الصاخہ، الغاشیہ، الآزفہ، الواقعہ {cite:tafsir-ibn-kathir}۔"
