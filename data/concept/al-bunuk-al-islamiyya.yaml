id: concept/al-bunuk-al-islamiyya
class: concept
kind: legal
label:
  ar: "البنوك الإسلامية والبنوك التقليدية — الفرق والشبهات والكفاءة"
  en: "Islamic banks and conventional banks — the difference, the doubts and the performance"
  ur: "اسلامی بینک اور روایتی بینک — فرق، شبہات اور کارکردگی"
issue:
  ar: "ما الفرق الحقيقي بين البنك الإسلامي والبنك التقليدي، وهل البنوك الإسلامية القائمة سالمة من الربا والحيل، وما كفاءتها ودورها في تنمية المجتمع؟"
  en: "What is the real difference between an Islamic bank and a conventional bank, are the existing Islamic banks free of riba and legal stratagems, and how efficient are they and what part do they play in developing society?"
  ur: "اسلامی بینک اور روایتی بینک میں حقیقی فرق کیا ہے، کیا موجودہ اسلامی بینک سود اور حیلوں سے پاک ہیں، اور ان کی کارکردگی اور معاشرے کی ترقی میں ان کا کردار کیا ہے؟"
summary:
  ar: "حلقتا «الوسطية» عن البنوك الإسلامية. في الأولى قال 56% من جمهور الاستوديو إنهم لا يستطيعون تعريف الربا، و79% إنهم لا يعرفون شيئاً عن عقود المرابحة والمضاربة والتورق والسلم، وانقسموا أثلاثاً في صفاء البنوك الإسلامية؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 00:09:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 00:31:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 00:54:30} وفي الثانية اختار 65% الشراء بالمرابحة من بنك إسلامي، ورأى 57% أن إلغاء الربا غير ممكن ما دام الاقتصاد العالمي ربوياً، و49% أن دور البنوك الإسلامية في المجتمع أضعف. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:09:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:41:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 01:01:30} واتفق الضيوف على أن فوائد البنوك التقليدية ربا، واختلفوا في البنوك الإسلامية القائمة. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:15:30}"
  en: "The two 'Al-Wasatiyya' episodes on Islamic banks. In the first, 56% of the studio audience said they could not define riba, 79% that they knew nothing of the murabaha, mudaraba, tawarruq and salam contracts, and they split into thirds on whether Islamic banks are free of doubt; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 00:09:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 00:31:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 00:54:30} in the second, 65% chose to buy by murabaha from an Islamic bank, 57% thought abolishing riba impossible while the world economy runs on interest, and 49% judged Islamic banks' social role weaker. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:09:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 01:01:30} The guests agreed that conventional bank interest is riba and differed over the existing Islamic banks. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:15:30}"
  ur: "اسلامی بینکوں پر «الوسطیہ» کی دو قسطیں۔ پہلی میں اسٹوڈیو حاضرین میں سے 56% نے کہا کہ وہ سود کی تعریف نہیں کر سکتے، 79% نے کہ وہ مرابحہ، مضاربہ، تورق اور سلم کے عقود کے بارے میں کچھ نہیں جانتے، اور اسلامی بینکوں کے شبہات سے پاک ہونے پر وہ تین برابر حصوں میں بٹ گئے؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 00:09:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 00:31:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 00:54:30} دوسری میں 65% نے اسلامی بینک سے مرابحہ پر خریدنا چنا، 57% نے کہا کہ جب تک عالمی معیشت سودی ہے سود کا خاتمہ ممکن نہیں، اور 49% نے اسلامی بینکوں کا سماجی کردار کمزور تر کہا۔ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:09:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 01:01:30} مہمان اس پر متفق تھے کہ روایتی بینکوں کا سود ربا ہے، اور موجودہ اسلامی بینکوں پر ان میں اختلاف تھا۔ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:15:30}"
sensitivity: contested
perspectives:
- tradition: sunni
  id: academies-interest-is-riba
  stance:
    ar: "المجامع الفقهية الثلاثة: الفائدة المصرفية ربا محرم أخذاً وعطاءً"
    en: "The three fiqh academies: bank interest is forbidden riba, whether taken or given"
    ur: "تینوں فقہی مجامع: بینک کا سود حرام ربا ہے، لینا بھی اور دینا بھی"
  summary:
    ar: "ذكر عبد الحميد الغزالي، أستاذ الاقتصاد الإسلامي في جامعة القاهرة، أن مجمع البحوث الإسلامية في مصر حرّم الفائدة في دورته الثانية سنة 1965، وأن مجمع الفقه الإسلامي لمنظمة المؤتمر الإسلامي ومجمع رابطة العالم الإسلامي في مكة حرّماها سنة 1985 (1406هـ)؛ وقال إن الأخذ برأي فردي يبيحها وترك هذه القرارات الجماعية لا يصح؛ وعرّف الضيوف ربا النسيئة بأنه الزيادة المشروطة مقابل الأجل، وكل قرض جرّ نفعاً مشروطاً فهو ربا {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:16:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:17:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:17:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 00:16:00}."
    en: "Abd al-Hamid al-Ghazali, professor of Islamic economics at Cairo University, said Egypt's Islamic Research Academy forbade interest at its second session in 1965, and that the Fiqh Academy of the Organisation of the Islamic Conference and the Muslim World League's academy in Makka forbade it in 1985 (1406 AH); he said it is not right to take an individual opinion permitting it and leave these collective decisions; the guests defined riba al-nasi'a as a stipulated increase in return for time, and held that every loan that brings a stipulated benefit is riba {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:16:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:17:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:17:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 00:16:00}."
    ur: "جامعہ قاہرہ میں اسلامی معاشیات کے استاد عبد الحمید الغزالی نے بتایا کہ مصر کے مجمع البحوث الاسلامیہ نے 1965 میں اپنے دوسرے اجلاس میں سود کو حرام قرار دیا، اور اسلامی کانفرنس تنظیم کی فقہ اکیڈمی اور مکہ میں رابطہ عالمِ اسلامی کی اکیڈمی نے 1985 (1406ھ) میں؛ انہوں نے کہا کہ ان اجتماعی فیصلوں کو چھوڑ کر اسے جائز کہنے والی انفرادی رائے لینا درست نہیں؛ مہمانوں نے ربا النسیئہ کی تعریف مدت کے بدلے مشروط اضافہ کی، اور کہا کہ ہر وہ قرض جو مشروط نفع لائے ربا ہے {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:17:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:17:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 00:16:00}."
