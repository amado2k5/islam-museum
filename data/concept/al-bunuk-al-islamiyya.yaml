- tradition: sunni
  id: support-and-purify
  stance:
    ar: "تُدعم البنوك الإسلامية وتُصفّى من الخلافيات، وأولها التورق المنظم"
    en: "Support the Islamic banks and purge them of disputed practices, organised tawarruq first"
    ur: "اسلامی بینکوں کی حمایت ہو اور انہیں متنازع طریقوں سے پاک کیا جائے، سب سے پہلے منظم تورق سے"
  summary:
    ar: "رأى محمد البنا وإحدى الضيفات أن في البنوك الإسلامية شبهات قليلة لا تخرجها عن إسلاميتها، وأن المجامع الفقهية رفضت التورق المنظم لأنه عينة في صورة طويلة وإن أباحه أفراد، وأن على هيئات الرقابة الشرعية دوراً في التصفية؛ ورأى صلاح سلطان أن التجربة بدأت قبل تدريب موظفيها، وأن لجوءها إلى المرابحة بدل المضاربة والمشاركة صرفها عن الإنتاج إلى الاستهلاك، مع ثقته في مجالسها الشرعية {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 00:58:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 00:59:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:06:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:08:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:09:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:10:00}."
    en: "Muhammad al-Banna and one of the women guests held that Islamic banks have few doubts that do not take them out of being Islamic, that the fiqh academies rejected organised tawarruq as a drawn-out form of 'ina even though individuals permitted it, and that sharia supervisory boards have a role in purging such practices; Salah Sultan held that the experiment began before its staff were trained, and that its reliance on murabaha instead of mudaraba and musharaka turned it from production to consumption, while expressing trust in its sharia councils {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 00:58:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 00:59:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:06:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:08:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:09:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:10:00}."
    ur: "محمد البنا اور ایک خاتون مہمان کے نزدیک اسلامی بینکوں میں تھوڑے شبہات ہیں جو انہیں اسلامی ہونے سے خارج نہیں کرتے، فقہی مجامع نے منظم تورق کو رد کیا کیونکہ وہ عِینہ کی طویل شکل ہے اگرچہ بعض افراد نے اسے جائز کہا، اور شرعی نگران بورڈوں کا ان امور کی صفائی میں کردار ہے؛ صلاح سلطان کے نزدیک تجربہ عملے کی تربیت سے پہلے شروع ہوا، اور مضاربہ و مشارکہ کے بجائے مرابحہ پر انحصار نے اسے پیداوار سے صرف کی طرف موڑ دیا، تاہم انہوں نے اس کی شرعی مجالس پر اعتماد ظاہر کیا {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 00:58:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:06:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:08:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:09:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:10:00}."
