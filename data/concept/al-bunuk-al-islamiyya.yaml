  id: presenter-fixed-price-and-hope
  stance:
    ar: "رأي المقدّم: الفرق أساسي في الملكية وثبات الثمن، والبنوك الإسلامية نجحت وتحتاج إلى تصحيح وتنمية"
    en: "The presenter's view: the difference is fundamental, in ownership and in the fixed price; Islamic banks have succeeded and need correction and a development role"
    ur: "میزبان کی رائے: فرق ملکیت اور مقررہ قیمت میں بنیادی ہے؛ اسلامی بینک کامیاب ہوئے اور انہیں اصلاح اور ترقیاتی کردار کی ضرورت ہے"
  summary:
    ar: "رأي طارق السويدان (رأي المتحدث): البيع له أركان، منها الثمن، فإذا اتُّفق عليه في العقد استقر ولو كان أعلى من ثمن النقد، وهذا بيع حلال، أما إذا تغيّر بتغيّر المدة فقد اختل ركن، وهذا ما يفعله البنك التقليدي؛ وقال إنه قرأ ثلاثين تفسيراً تجعل البيع المذكور مع الربا بيع الأجل؛ ورأى أن الأمة اتفقت على أن البنوك التقليدية ربوية، وأن البنوك الإسلامية إسلامية تحتاج إلى تصحيح وتطوير وتصفية، وأن عليها أن تتجه إلى تنمية المجتمع والشباب ولا تكون دُولة بين الأغنياء {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:18:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:19:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:23:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:24:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:18:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:19:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 01:22:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 01:23:00}."
    en: "Tareq al-Suwaidan's view (speaker's opinion): a sale has pillars, among them the price; once agreed in the contract it is settled, even if higher than the cash price, and this is a lawful sale; if it changes as the term changes, a pillar is defective, and this is what the conventional bank does. He said he read thirty commentaries that take the 'sale' set against riba to be the deferred sale. He held that the community agrees conventional banks are riba banks, that Islamic banks are Islamic and need correction, development and purging, and that they must turn to developing society and the young rather than circulating wealth among the rich {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:18:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:19:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:23:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:24:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:18:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:19:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 01:22:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 01:23:00}."
    ur: "طارق السویدان کی رائے (مقرر کی رائے): بیع کے ارکان ہیں، جن میں قیمت ہے؛ عقد میں طے ہو جائے تو وہ ثابت ہو جاتی ہے، خواہ نقد قیمت سے زیادہ ہو، اور یہ جائز بیع ہے؛ اگر مدت کے ساتھ بدلے تو ایک رکن ناقص ہو گیا، اور یہی روایتی بینک کرتا ہے۔ انہوں نے کہا کہ انہوں نے تیس تفاسیر پڑھیں جو ربا کے مقابل مذکور بیع کو ادھار کی بیع سمجھتی ہیں۔ ان کے نزدیک امت کا اتفاق ہے کہ روایتی بینک سودی ہیں، اسلامی بینک اسلامی ہیں جنہیں اصلاح، ترقی اور صفائی کی ضرورت ہے، اور انہیں معاشرے اور نوجوانوں کی ترقی کی طرف آنا چاہیے نہ کہ دولت امیروں ہی میں گردش کرے {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:18:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:23:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:24:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:18:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:19:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 01:23:00}."
