- tradition: sunni
  id: same-in-substance
  stance:
    ar: "البنوك الإسلامية القائمة لا تختلف عن الربوية إلا في الشكل، والمطلوب بنك إسلامي بلا حيل"
    en: "The existing Islamic banks differ from interest banks only in form; what is needed is an Islamic bank without stratagems"
    ur: "موجودہ اسلامی بینک سودی بینکوں سے صرف شکل میں مختلف ہیں؛ ضرورت حیلوں سے پاک اسلامی بینک کی ہے"
  summary:
    ar: "رأى محمد العزيزي، أستاذ الفقه المقارن من الأردن وصاحب مشروع «بنك إسلامي لا يقوم على الحيلة الربوية»، أن كل زيادة بسبب الأجل ربا سواء جاءت بقرض أو ببيع، وأن بيع المرابحة للآمر بالشراء لا أصل له في الفقه، وأن البنوك الإسلامية القائمة ربوية في حقيقتها، واستشهد بجمال الدين عطية وبما نُسب إلى الألباني من أن فيها حيلتين؛ وهو مع البنك الإسلامي فكرةً لا مع القائم منها، ورأى أن المخططين الأوائل بنوها على المشاركة، وأنها صارت تموّل الأغنياء، ودعا إلى مراقبين شرعيين منتخبين ذوي سلطة {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:02:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:05:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:17:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:27:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:47:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 01:06:30}."
    en: "Muhammad al-Azizi, a professor of comparative fiqh from Jordan with a project for 'an Islamic bank not built on riba stratagems', held that every increase on account of time is riba, whether it comes through a loan or a sale, that murabaha to the purchase orderer has no basis in fiqh, and that the existing Islamic banks are riba banks in substance; he cited Jamal al-Din Atiyya and what he attributed to al-Albani, that there are two stratagems in it. He supports the Islamic bank as an idea, not the existing ones, held that the first planners built them on partnership, that they now finance the rich, and called for elected sharia auditors with real authority {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:02:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:05:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:17:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:27:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:47:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 01:06:30}."
    ur: "اردن سے فقہِ مقارن کے استاد محمد العزیزی، جن کا منصوبہ «سودی حیلے پر قائم نہ ہونے والا اسلامی بینک» ہے، کے نزدیک مدت کی وجہ سے ہر اضافہ ربا ہے خواہ قرض سے آئے یا بیع سے، آمر بالشراء کے لیے مرابحہ کی فقہ میں کوئی اصل نہیں، اور موجودہ اسلامی بینک حقیقت میں سودی ہیں؛ انہوں نے جمال الدین عطیہ اور البانی سے منسوب اس قول کا حوالہ دیا کہ اس میں دو حیلے ہیں۔ وہ اسلامی بینک کے تصور کے حامی ہیں، موجودہ بینکوں کے نہیں؛ ان کے نزدیک ابتدائی منصوبہ سازوں نے انہیں شراکت پر بنایا تھا، اب وہ امیروں کو سرمایہ دیتے ہیں، اور انہوں نے بااختیار منتخب شرعی نگرانوں کی دعوت دی {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:02:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:05:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:27:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:47:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 01:06:30}."
