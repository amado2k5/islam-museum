- tradition: sunni
  id: sale-not-loan
  stance:
    ar: "البنك الإسلامي يبيع سلعة يملكها بثمن ثابت، والتقليدي يُقرض نقوداً بفائدة"
    en: "The Islamic bank sells a good it owns at a fixed price; the conventional bank lends money at interest"
    ur: "اسلامی بینک اپنی ملکیت کی چیز مقررہ قیمت پر بیچتا ہے؛ روایتی بینک سود پر رقم قرض دیتا ہے"
  summary:
    ar: "رأى عبد الحميد الغزالي وحسين شحاتة، أستاذ الاقتصاد الإسلامي في الأزهر، وصلاح سلطان، المستشار الشرعي للمجلس الأعلى للشؤون الإسلامية في البحرين، أن الفرق جوهري: في المرابحة يملك البنك السلعة ويتحمل تبعة هلاكها ثم يبيعها بثمن يُتفق عليه فيثبت، والزيادة جزء من الثمن، وطريقة حساب الربح وسيلة محايدة؛ أما التقليدي فيتاجر في النقود نفسها؛ وما يتغير ثمنه بعد العقد يحرم عند سلطان من باب الغرر؛ وقال الغزالي إن البنوك الإسلامية وُجدت في بحر من الربا فأصابها غباره، وإن المودع فيها بريء من أخطائها {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 00:34:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:30:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:32:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:33:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:34:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:12:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:14:30}."
    en: "Abd al-Hamid al-Ghazali, Husayn Shahata, professor of Islamic economics at al-Azhar, and Salah Sultan, sharia adviser to Bahrain's Supreme Council for Islamic Affairs, held that the difference is fundamental: in murabaha the bank owns the good and bears the risk of its loss, then sells it at an agreed price that stays fixed; the increase is part of the price, and the method of calculating the profit is a neutral tool; the conventional bank trades in money itself; and a price that changes after the contract is forbidden in Sultan's view as gharar (uncertainty). Al-Ghazali said Islamic banks arose in a sea of riba and some of its dust settled on them, and that their depositors are innocent of their errors {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 00:34:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:30:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:32:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:33:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:34:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:12:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:14:30}."
    ur: "عبد الحمید الغزالی، ازہر میں اسلامی معاشیات کے استاد حسین شحاتہ، اور بحرین کی مجلسِ اعلیٰ برائے اسلامی امور کے شرعی مشیر صلاح سلطان کے نزدیک فرق بنیادی ہے: مرابحہ میں بینک چیز کا مالک ہوتا ہے اور اس کے ہلاک ہونے کا خطرہ اٹھاتا ہے، پھر طے شدہ قیمت پر بیچتا ہے جو ثابت رہتی ہے؛ اضافہ قیمت کا حصہ ہے اور منافع کے حساب کا طریقہ غیر جانبدار ذریعہ ہے؛ روایتی بینک خود رقم کی تجارت کرتا ہے؛ اور عقد کے بعد بدلنے والی قیمت سلطان کے نزدیک غرر کی وجہ سے حرام ہے۔ الغزالی نے کہا کہ اسلامی بینک سود کے سمندر میں پیدا ہوئے تو اس کی گرد ان پر پڑی، اور ان کے کھاتہ دار ان کی غلطیوں سے بری ہیں {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 00:34:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:30:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:32:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep35 00:34:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:12:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep34 01:14:30}."
