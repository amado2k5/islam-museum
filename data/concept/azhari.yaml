summary:
  ar: "نسبة تدل على من درس في جامعة الأزهر بالقاهرة، وتُطلق على كثيرين من علماء العالم الإسلامي {cite:encyclopaedia-of-islam-2 vol. 1 p. 870}."
  en: "A nisba denoting a person who studied at al-Azhar University in Cairo, applied to many scholars of the Islamic world {cite:encyclopaedia-of-islam-2 vol. 1 p. 870}."
  fr: "Nisba désignant une personne ayant étudié à l’université al-Azhar du Caire, portée par de nombreux savants du monde islamique {cite:encyclopaedia-of-islam-2 vol. 1 p. 870}."
  es: "Una nisba que designaba a una persona que había estudiado en la Universidad de al-Azhar en El Cairo, se aplicaba a muchos eruditos del mundo islámico {cite:encyclopaedia-of-islam-2 vol. 1 p. 870}."
  ur: "قاہرہ کی جامعہ الازہر سے تعلیم حاصل کرنے والے شخص کی طرف اشارہ کرنے والا نصاب، عالم اسلام کے بہت سے علماء پر لاگو ہوتا ہے {حوالہ: انسائیکلوپیڈیا آف اسلام-2 جلد 1 ص۔ 870}۔"
  tr: "Bu oran, Kahire'deki El-Ezher Üniversitesi'nde eğitim görenleri gösterir ve İslam dünyasının birçok alimini ifade eder {cite:encyclopaedia-of-Islam-2 cilt 1, s. 870}."
  id: "Rasio yang menunjukkan mereka yang belajar di Universitas Al-Azhar di Kairo, dan merujuk pada banyak ulama dunia Islam {cite:encyclopaedia-of-Islam-2 vol. 1, hlm. 870}."
