id: concept/al-haqq-al-amm
class: concept
kind: ethical
label:
  ar: الحق العام
  en: "The public right (al-haqq al-amm)"
  es: "El derecho público (al-haqq al-amm)"
  fr: "Le droit public (al-haqq al-amm)"
  ur: "عوامی حق ⁦(الحق العم)⁩"
  tr: "kamu hakkı"
  id: "hak publik"
summary:
  ar: "الحق العام عند قعدات هو ما يصب في القضية الإيمانية أو الحق الإلهي، ويصل إلى أربعة مستفيدين: الفرد، والجماعة، والوطن، والدين {cite:qadan-manhaj-iqtisad-quran p. 102}، {cite:qadan-manhaj-iqtisad-quran p. 103}. ويعد نصيب الجماعة المصالح العامة كالمدارس والمستشفيات والمرافق والضمان الاجتماعي {cite:qadan-manhaj-iqtisad-quran p. 103}، {cite:qadan-manhaj-iqtisad-quran p. 104}. ويجعل حفظ الوطن بإعداد القوة حقاً مشروعاً، ويرى أن ضعفه يفقده خيراته ومواده الخام {cite:qadan-manhaj-iqtisad-quran p. 104}، {cite:qadan-manhaj-iqtisad-quran p. 105}. ويجعل من نصيب الدين بناء المساجد والمراكز الثقافية وطبع الكتب {cite:qadan-manhaj-iqtisad-quran p. 105}."
  tr: "Kadat'taki kamu hakkı, inanç veya ilahi hak meselesiyle ilgilidir ve dört faydalanıcıya ulaşır: birey, grup, vatan ve din {cite:qadan-manhaj-iqtisad-kur'an s. 102}, {cite:qadan-manhaj-iqtisad-kuran s. 103}. Topluluğun payı okullar, hastaneler, altyapılar ve sosyal güvenlik gibi kamu çıkarlarını içerir {cite:qadan-manhaj-iqtisad-kur'an s. 103}, {cite:qadan-manhaj-iqtisad-kuran s. 104}. Vatanın korunmasını, güç hazırlayarak meşru bir hak haline getirir ve zayıflığını ham kaynaklarını ve kaynaklarını kaybetmek olarak görür {cite:qadan-manhaj-iqtisad-kuran s. 104}, {cite:qadan-manhaj-iqtisad-qur'an s. 105}. Bunu camiler, kültür merkezleri inşa etmek ve kitap basmak için dini bir kaynak olarak nitelendirdi {cite:qadan-manhaj-iqtisad-kur'an, s. 105}."
  id: "Hak publik dalam Kadat berkaitan dengan masalah iman atau hak ilahi dan menjangkau empat penerima manfaat: individu, kelompok, tanah air, dan agama {cite:qadan-manhaj-iqtisad-qur'an hlm. 102}, {cite:qadan-manhaj-iqtisad-quran hlm. 103}. Bagian komunitas mencakup kepentingan publik seperti sekolah, rumah sakit, infrastruktur, dan jaminan sosial {cite:qadan-manhaj-iqtisad-qur'an hlm. 103}, {cite:qadan-manhaj-iqtisad-qur'an hlm. 104}. Ini menjadikan perlindungan tanah air sebagai hak yang sah dengan menyiapkan kekuasaan dan memandang kelemahannya sebagai kehilangan sumber daya mentah dan sumber daya {cite:qadan-manhaj-iqtisad-qur'an hlm. 104}, {cite:qadan-manhaj-iqtisad-qur'an hlm. 105}. Ia menggambarkannya sebagai sumber keagamaan untuk membangun masjid, pusat budaya, dan mencetak buku {cite:qadan-manhaj-iqtisad-qur'an, hlm. 105}."
