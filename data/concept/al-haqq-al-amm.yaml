label:
  ar: الحق العام
  en: "The public right (al-haqq al-amm)"
summary:
  ar: "الحق العام عند قعدات هو ما يصب في القضية الإيمانية أو الحق الإلهي، ويصل إلى أربعة مستفيدين: الفرد، والجماعة، والوطن، والدين {cite:qadan-manhaj-iqtisad-quran p. 102}، {cite:qadan-manhaj-iqtisad-quran p. 103}. ويعد نصيب الجماعة المصالح العامة كالمدارس والمستشفيات والمرافق والضمان الاجتماعي {cite:qadan-manhaj-iqtisad-quran p. 103}، {cite:qadan-manhaj-iqtisad-quran p. 104}. ويجعل حفظ الوطن بإعداد القوة حقاً مشروعاً، ويرى أن ضعفه يفقده خيراته ومواده الخام {cite:qadan-manhaj-iqtisad-quran p. 104}، {cite:qadan-manhaj-iqtisad-quran p. 105}. ويجعل من نصيب الدين بناء المساجد والمراكز الثقافية وطبع الكتب {cite:qadan-manhaj-iqtisad-quran p. 105}."
