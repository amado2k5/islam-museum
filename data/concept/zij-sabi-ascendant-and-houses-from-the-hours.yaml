label: { ar: "إقامة الطالع والبيوت الاثني عشر من الساعات", en: "Setting the ascendant and the twelve houses from the hours", ur: "گھنٹوں سے طالع اور بارہ بیوت کا قیام", es: "Estableciendo el ascendente y las doce casas desde las horas", fr: "Définir l'ascendant et les douze maisons à partir des heures", tr: "Yükselen burcun ve on iki saat evinin belirlenmesi", id: "Menentukan ascendant dan dua belas rumah jam" }
summary:
  ar: "يبيّن البتاني كيف يُعرف الطالع وسائر البيوت الاثني عشر من الساعات المنقضية من النهار أو من الليل؛ فإن كان الوقت نهاراً أُخذت الساعات من طلوع الشمس إلى الساعة المفروضة، وإن كان ليلاً أُخذت من غروب الشمس. {cite:zij-sabi-nallino-byblion p.109}."
  en: "Al-Battani shows how to find the ascendant and the other eleven houses from the hours that have passed since sunrise or sunset. If the time is daytime the hours are taken from sunrise to the given hour; if it is night they are taken from sunset. {cite:zij-sabi-nallino-byblion p.109}."
  ur: "البتانی بتاتے ہیں کہ گزرے ہوئے گھنٹوں سے طالع اور باقی گیارہ بیوت کیسے معلوم ہوں؛ اگر وقت دن کا ہو تو گھنٹے طلوع آفتاب سے مقررہ گھنٹے تک لیے جاتے ہیں، اور اگر رات کا ہو تو غروبِ آفتاب سے۔ {cite:zij-sabi-nallino-byblion p.109}۔"
  es: "Al-Battani explica cómo hallar el ascendente y las otras once casas a partir de las horas transcurridas desde el amanecer o el atardecer. Si es de día, las horas se cuentan desde el amanecer hasta la hora indicada; si es de noche, desde el atardecer. {cite:zij-sabi-nallino-byblion p.109}."
  fr: "Al-Battani explique comment déterminer l'ascendant et les onze autres maisons à partir du temps écoulé depuis le lever ou le coucher du soleil. Le jour, on calcule le temps écoulé depuis le lever du soleil jusqu'à l'heure donnée; la nuit, on calcule le temps écoulé depuis le coucher du soleil. {cite:zij-sabi-nallino-byblion p.109}"
  tr: "El-Battani, yükselen burcun ve diğer on iki evin, gün veya gece boyunca geçen saatlerden nasıl belirlendiğini açıklıyor; gündüz ise saatler güneşin doğuşundan belirlenen saate kadar, gece ise güneşin batışına kadar alınır. {cite:zij-sabi-nallino-byblion s.109}."
  id: "Al-Battani menjelaskan bagaimana ascendant dan dua belas rumah lainnya ditentukan dari jam-jam yang telah berlalu pada siang atau malam hari; jika siang hari, jam-jam tersebut diambil dari matahari terbit hingga jam yang ditentukan, dan jika malam hari, jam-jam tersebut diambil dari matahari terbenam. {cite:zij-sabi-nallino-byblion p.109}."
