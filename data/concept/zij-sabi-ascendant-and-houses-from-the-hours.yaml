label: { ar: "إقامة الطالع والبيوت الاثني عشر من الساعات", en: "Setting the ascendant and the twelve houses from the hours", ur: "گھنٹوں سے طالع اور بارہ بیوت کا قیام" }
summary:
  ar: "يبيّن البتاني كيف يُعرف الطالع وسائر البيوت الاثني عشر من الساعات المنقضية من النهار أو من الليل؛ فإن كان الوقت نهاراً أُخذت الساعات من طلوع الشمس إلى الساعة المفروضة، وإن كان ليلاً أُخذت من غروب الشمس. {cite:zij-sabi-nallino-byblion p.109}."
  en: "Al-Battani shows how to find the ascendant and the other eleven houses from the hours that have passed since sunrise or sunset. If the time is daytime the hours are taken from sunrise to the given hour; if it is night they are taken from sunset. {cite:zij-sabi-nallino-byblion p.109}."
  ur: "البتانی بتاتے ہیں کہ گزرے ہوئے گھنٹوں سے طالع اور باقی گیارہ بیوت کیسے معلوم ہوں؛ اگر وقت دن کا ہو تو گھنٹے طلوع آفتاب سے مقررہ گھنٹے تک لیے جاتے ہیں، اور اگر رات کا ہو تو غروبِ آفتاب سے۔ {cite:zij-sabi-nallino-byblion p.109}۔"
