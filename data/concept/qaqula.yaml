summary:
  ar: "القاقلة في الكتاب كبار وصغار، والكبار كالجوزة الصغيرة سوداء تتفرك عن حب أبيض يحذو اللسان عطري، والصغار كالقرنفل في الشكل، حارة يابسة في الثالثة قابضة، تنفع من القيء والغثيان وتقوي المعدة {cite:canon-ibn-sina-print-v1 pp.642-643}"
  en: "Qaqula is in the book large and small, the large like a small nut, black, crumbling from a white grain that stings the tongue and is aromatic, the small like the clove in shape; hot and dry in the third degree, astringent, benefiting vomiting and nausea and strengthening the stomach {cite:canon-ibn-sina-print-v1 pp.642-643}"
  ur: "قاقلہ کتاب میں بڑے اور چھوٹے ہیں، بڑے چھوٹے اخروٹ جیسے کالے جو سفید دانے سے الگ ہو جاتے ہیں، زبان کو چبھتے اور خوشبودار، اور چھوٹے شکل میں قرنفل جیسے؛ تیسرے درجے میں گرم خشک، قابض، قے اور متلی میں نافع اور معدے کو قوت دینے والا {cite:canon-ibn-sina-print-v1 pp.642-643}۔"
  es: "En el libro, Qaqula se describe como grande y pequeña; la grande, como una nuez pequeña, negra, que se deshace de un grano blanco que pica la lengua y es aromática; la pequeña, con forma de clavo; caliente y seca en tercer grado, astringente, beneficiosa para los vómitos y las náuseas y fortalece el estómago. {cite:canon-ibn-sina-print-v1 pp.642-643}"
