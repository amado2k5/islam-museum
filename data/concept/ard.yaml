label:
  ar: "العَرْض"
  en: "Offering (ard) in marriage matters"
  fr: "La proposition (ard) dans les questions matrimoniales"
  ur: "عرض"
  es: "Ofrenda (ard) en asuntos matrimoniales"
  tr: "Teklif"
  id: "Penawaran"
summary:
  ar: "العرض في اللغة الإظهار والكشف، ويقال عرضت الشيء أي أظهرته، ولا يخرج استعمال الفقهاء للفظ عن معناه اللغوي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11555}. ومن أحكامه في النكاح: إذا أسلم أحد الزوجين الوثنيين أو المجوسيين، أو أسلم كتابي تزوج بوثنية أو مجوسية قبل الدخول، تعجلت الفرقة عند الشافعية والحنابلة، وتكون فسخاً لا طلاقاً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11555}. وإذا أسلم أحد الزوجين بعد الدخول فإن الشافعية وأحمد في رواية يوقفون الأمر على انقضاء العدة، فإن أسلم الآخر قبلها بقي النكاح، وإلا وقعت الفرقة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11555}. وعند الحنفية يُعرض الإسلام على الزوج أو الزوجة الذي لم يسلم، فإن أبى فُرّق بينهما، مع تفصيل في الكتابيين وغيرهم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11556}. ويجوز للمرأة أن تعرض نفسها على الرجل الصالح، ويجوز للأب أن يعرض ابنته على من يعتقد خيره وصلاحه، ولو كان متزوجاً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11557} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11558}."
  en: "In the lexicon, ard means showing and disclosing; the jurists use the word in its lexical sense {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11555}. In marriage, when one of two pagan or Magian spouses converts, or a People-of-the-Book man who married a pagan or Magian woman before consummation converts, the Shafi'is and Hanbalis hold that the separation is immediate and is an annulment (faskh), not a divorce {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11555}. If the conversion comes after consummation, the Shafi'is and, in one report, Ahmad wait until the waiting period ends: if the other spouse converts before then, the marriage stands; otherwise the separation dates from the difference of religion {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11555}. The Hanafis offer Islam to the spouse who has not converted and separate them if that spouse refuses, with distinctions for People of the Book and others {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11556}. A woman may offer herself to a righteous man, and a father may offer his daughter to one whose goodness he trusts, even if that man is already married {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11557} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11558}."
  fr: "Dans le lexique, ard signifie montrer et dévoiler ; les juristes emploient le mot dans son sens lexical {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11555}. En matière matrimoniale, lorsque l’un de deux conjoints païens ou mazdéens se convertit, ou qu’un homme des gens du Livre qui a épousé une femme païenne ou mazdéenne se convertit avant la consommation du mariage, les chaféites et les hanbalites considèrent que la séparation est immédiate et constitue une annulation (faskh), non un divorce {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11555}. Si la conversion intervient après la consommation, les chaféites et, selon un récit, Ahmad attendent la fin du délai de viduité : si l’autre conjoint se convertit avant ce terme, le mariage subsiste ; sinon, la séparation remonte à la différence de religion {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11555}. Les hanafites proposent l’islam au conjoint qui ne s’est pas converti et les séparent en cas de refus de sa part, avec des distinctions entre les gens du Livre et les autres {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11556}. Une femme peut se proposer en mariage à un homme vertueux, et un père peut proposer sa fille à quelqu’un dont il reconnaît la bonté, même si cet homme est déjà marié {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11557} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11558}."
  es: "En el léxico, ard significa mostrar y revelar; los juristas usan la palabra en su sentido léxico {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11555}. En el matrimonio, cuando uno de los dos cónyuges paganos o magos se convierte, o un hombre de la Gente del Libro que se casó con una mujer pagana o mago antes de la consumación se convierte, los shafi'ís y los hanbalíes sostienen que la separación es inmediata y es una anulación (faskh), no un divorcio {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11555}. Si la conversión ocurre después de la consumación, los shafi'ís y, en un informe, Ahmad esperan hasta que termine el período de espera: si el otro cónyuge se convierte antes, el matrimonio se mantiene; de lo contrario, la separación data de la diferencia de religión {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11555}. Los hanafíes ofrecen el Islam al cónyuge que no se ha convertido y los separan si ese cónyuge se niega, con distinciones para la Gente del Libro y los demás {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11556}. Una mujer puede ofrecerse a sí misma a un hombre justo, y un padre puede ofrecer a su hija a alguien en cuya bondad confía, incluso si ese hombre ya está casado {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11557} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11558}."
  ur: "لغت میں، ard کا مطلب ہے ظاہر کرنا اور ظاہر کرنا۔ فقہاء اس لفظ کو اس کے لغوی معنوں میں استعمال کرتے ہیں {حوالہ: فقہ معاویہ کویتیہ نور v3 صفحہ 11555}۔ نکاح میں، جب دو کافر یا مجوسی میاں بیوی میں سے کوئی ایک مذہب تبدیل کر لے، یا اہل کتاب آدمی جس نے کسی کافر یا مجوسی عورت سے شادی کر لی ہو، تو شافعی اور حنبلی کا خیال ہے کہ علیحدگی فوری ہے اور فسخ ہے، طلاق نہیں ہے۔ اگر تبدیلی ختم ہونے کے بعد ہو جائے تو شافعی اور احمد ایک رپورٹ میں عدت ختم ہونے تک انتظار کرتے ہیں: اگر دوسرا شریک حیات اس سے پہلے مذہب تبدیل کر لے تو نکاح قائم رہتا ہے۔ بصورت دیگر فرقہ مذاہب سے علیحدگی کی تاریخ ہے {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 11555}۔ احناف اس شریک حیات کو اسلام پیش کرتے ہیں جس نے مذہب تبدیل نہیں کیا ہے اور اگر وہ میاں بیوی انکار کر دے تو ان کو الگ کر دیں، اہل کتاب اور دوسروں کے لیے امتیازات کے ساتھ۔ ایک عورت اپنے آپ کو کسی نیک آدمی کے لیے پیش کر سکتی ہے، اور ایک باپ اپنی بیٹی کو کسی ایسے شخص کے لیے پیش کر سکتا ہے جس کی نیکی پر اسے بھروسہ ہو، خواہ وہ شخص پہلے سے شادی شدہ ہو"
  tr: "Dilbilimde 'arda' 'ortaya çıkarmak ve ortaya çıkarmak' anlamına gelir ve 'Bir şeyi görünür hale getirdim' denir, yani onu ortaya koydum. Hukukçuların kelimeyi kullanımı dilsel anlamından sapmaz {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.11555}. Evlilikle ilgili kararları arasında: Pagan veya Magian eşlerden biri İslam'a geçerse ya da Kitap'a müslenmişse, tamamlanmadan önce pagan veya Magian bir kadınla evlenirse, ayrılık Şafi'ler ve Hanbalilere göre hızlandırılır ve boşanma değil, iptal olarak kabul edilir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11555}. Eğer eşlerden biri tamamlandıktan sonra İslam'a geçerse, Şafi'ler ve Ahmed bir rivayette bekleme süresi bitene kadar konuyu durdurur; diğeri ondan önce Mostuba geçerse evlilik geçerliliğini korur; aksi takdirde evlilik geçerlidir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11555}. Hanefilere göre, İslam, İslam'a geçmemiş koca veya karıya sunulur ve eğer karı reddederse, Kitap'ta ve diğerlerinde ayrıntılarla aralarında ayrım yapar {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11556}. Bir kadın kendini doğru bir erkeğe sunabilir, bir baba ise evli olsa bile iyi ve doğru olduğuna inandığı birine kızını sunabilir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11557} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11558}."
  id: "Dalam linguistik, 'arda' berarti 'mengungkap dan mengungkapkan,' dan dikatakan, 'Aku telah membuat sesuatu jelas,' artinya aku mewujudkannya. Penggunaan kata ini oleh para ahli hukum tidak menyimpang dari makna linguistiknya {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11555}. Di antara putusannya tentang pernikahan: Jika salah satu pasangan pagan atau Magian memeluk Islam, atau seorang yang memeluk Kitab Suci, ia menikahi seorang wanita pagan atau Magian sebelum penyempurnaan, perpisahan dipercepat menurut Shafi'i dan Hanbali, dan dianggap sebagai pembatalan, bukan perceraian {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11555}. Jika salah satu pasangan memeluk Islam setelah pengajian, Syafi'i dan Ahmad dalam satu narasi menghentikan urusan hingga masa tunggu berakhir; jika yang lain memeluk sebelum itu, pernikahan tetap sah; jika tidak, pernikahan sah {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11555}. Menurut Hanafi, Islam dipersembahkan kepada suami atau istri yang belum memeluk Islam, dan jika menolak, ia membedakan di antara mereka, dengan rincian dalam Kitab dan lainnya {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11556}. Seorang wanita dapat menyerahkan dirinya kepada pria yang benar, dan seorang ayah dapat mempersembahkan putrinya kepada seseorang yang diyakininya baik dan benar, meskipun ia sudah menikah {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11557} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11558}."
