label:
  ar: "العَرْض"
  en: "Offering (ard) in marriage matters"
  ur: "عرض"
summary:
  ar: "العرض في اللغة الإظهار والكشف، ويقال عرضت الشيء أي أظهرته، ولا يخرج استعمال الفقهاء للفظ عن معناه اللغوي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11555}. ومن أحكامه في النكاح: إذا أسلم أحد الزوجين الوثنيين أو المجوسيين، أو أسلم كتابي تزوج بوثنية أو مجوسية قبل الدخول، تعجلت الفرقة عند الشافعية والحنابلة، وتكون فسخاً لا طلاقاً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11555}. وإذا أسلم أحد الزوجين بعد الدخول فإن الشافعية وأحمد في رواية يوقفون الأمر على انقضاء العدة، فإن أسلم الآخر قبلها بقي النكاح، وإلا وقعت الفرقة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11555}. وعند الحنفية يُعرض الإسلام على الزوج أو الزوجة الذي لم يسلم، فإن أبى فُرّق بينهما، مع تفصيل في الكتابيين وغيرهم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11556}. ويجوز للمرأة أن تعرض نفسها على الرجل الصالح، ويجوز للأب أن يعرض ابنته على من يعتقد خيره وصلاحه، ولو كان متزوجاً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11557} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11558}."
  en: "In the lexicon, ard means showing and disclosing; the jurists use the word in its lexical sense {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11555}. In marriage, when one of two pagan or Magian spouses converts, or a People-of-the-Book man who married a pagan or Magian woman before consummation converts, the Shafi'is and Hanbalis hold that the separation is immediate and is an annulment (faskh), not a divorce {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11555}. If the conversion comes after consummation, the Shafi'is and, in one report, Ahmad wait until the waiting period ends: if the other spouse converts before then, the marriage stands; otherwise the separation dates from the difference of religion {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11555}. The Hanafis offer Islam to the spouse who has not converted and separate them if that spouse refuses, with distinctions for People of the Book and others {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11556}. A woman may offer herself to a righteous man, and a father may offer his daughter to one whose goodness he trusts, even if that man is already married {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11557} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11558}."
