id: concept/istidhan
class: concept
kind: social
label:
  ar: "الاستئذان"
  en: "Isti'dhan: asking permission before entering"
  ur: "استئذان ⁦(داخلے سے پہلے اجازت)⁩"
summary:
  ar: "الاستئذان أدب الدخول على البيوت في الإسلام: لا يدخل أحد بيتا إلا بإذن وسلام، وقد أمر الله بالاستئذان ثلاثا قبل الفجر وحين الظهيرة ومن بعد العشاء، وعلّم الناس أن العين أذن، فإن لم يؤذن رجع. وهو من أجل عادات المسلمين الاجتماعية، يصون ستر البيت وحرمة أهله."
  en: "Isti'dhan is the Islamic etiquette of entering homes: no one enters a house without permission and a greeting. God commanded asking permission three times — before dawn, at midday and after the evening prayer — and taught that the eye is the permission, so whoever is not admitted turns back. It is one of the finest Muslim social customs, guarding the veil of the home and the sanctity of its people."
  ur: "استئذان اسلام میں گھروں میں داخل ہونے کا ادب ہے: کوئی گھر میں اجازت اور سلام کے بغیر داخل نہیں ہوتا۔ اللہ نے تین بار اجازت مانگنے کا حکم دیا — فجر سے پہلے، دوپہر اور عشاء کے بعد — اور سکھایا کہ آنکھ اجازت ہے؛ جسے اجازت نہ ملے وہ لوٹ جائے۔"
