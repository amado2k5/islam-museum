id: concept/istidhan
class: concept
kind: social
label:
  ar: "الاستئذان"
  en: "Isti'dhan: asking permission before entering"
  ur: "استئذان ⁦(داخلے سے پہلے اجازت)⁩"
  es: "Isti'dhan: pedir permiso antes de entrar"
  fr: "Isti'dhan: demander la permission avant d'entrer"
summary:
  ar: "الاستئذان أدب الدخول على البيوت في الإسلام: لا يدخل أحد بيتا إلا بإذن وسلام، وقد أمر الله بالاستئذان ثلاثا قبل الفجر وحين الظهيرة ومن بعد العشاء، وعلّم الناس أن العين أذن، فإن لم يؤذن رجع. وهو من أجل عادات المسلمين الاجتماعية، يصون ستر البيت وحرمة أهله."
  en: "Isti'dhan is the Islamic etiquette of entering homes: no one enters a house without permission and a greeting. God commanded asking permission three times — before dawn, at midday and after the evening prayer — and taught that the eye is the permission, so whoever is not admitted turns back. It is one of the finest Muslim social customs, guarding the veil of the home and the sanctity of its people."
  ur: "استئذان اسلام میں گھروں میں داخل ہونے کا ادب ہے: کوئی گھر میں اجازت اور سلام کے بغیر داخل نہیں ہوتا۔ اللہ نے تین بار اجازت مانگنے کا حکم دیا — فجر سے پہلے، دوپہر اور عشاء کے بعد — اور سکھایا کہ آنکھ اجازت ہے؛ جسے اجازت نہ ملے وہ لوٹ جائے۔"
  es: "Isti'dhan es la etiqueta islámica para entrar en una casa: nadie entra sin permiso y sin saludar. Dios ordenó pedir permiso tres veces: antes del amanecer, al mediodía y después de la oración vespertina. Enseñó que la mirada es la señal de permiso, por lo que quien no es admitido regresa. Es una de las mejores costumbres sociales musulmanas, que protege el hogar y la santidad de sus habitantes."
  fr: "L'isti'dhan est la règle islamique d'entrée dans une maison: nul ne pénètre dans une demeure sans permission et sans salutation. Dieu a ordonné de demander la permission trois fois – avant l'aube, à midi et après la prière du soir – et a enseigné que le regard vaut permission; ainsi, celui qui se voit refuser l'entrée doit rebrousser chemin. C'est l'une des plus belles coutumes sociales musulmanes, préservant l'intimité du foyer et le caractère sacré de ses occupants."
