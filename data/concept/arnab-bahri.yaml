id: concept/arnab-bahri
class: concept
kind: natural
label:
  ar: "أرنب بحري"
  en: "Arnab bahri (marine rabbit)"
  fr: "Arnab bahri (lapin marin)"
  ur: "ارنب بحری ⁦(سمندری خرگوش)⁩"
  es: "Arnab bahri (conejo marino)"
  tr: "deniz tavşanı"
  id: "kelinci laut"
summary:
  ar: "حيوان صدفي إلى الحمرة، دمه حار ينقّي الكلف والبهق، ورأسه محرقاً ينبت الشعر في داء الثعلب، ويُعدّ من الأدوية السمّية يقتل بتقريح الرئة {cite:canon-ibn-sina-print-v1 p.377} {cite:canon-ibn-sina-print-v1 p.378}."
  en: "A reddish shell-bearing animal. Its blood is hot and clears freckles and vitiligo; its head, burnt, regrows hair in alopecia. The book counts it among poisonous drugs, which kill by ulcerating the lung {cite:canon-ibn-sina-print-v1 p.377} {cite:canon-ibn-sina-print-v1 p.378}."
  fr: "Un animal rougeâtre pourvu d’une coquille. Son sang est chaud et fait disparaître les taches de rousseur et le vitiligo ; sa tête brûlée fait repousser les cheveux en cas d’alopécie. Le livre le compte parmi les remèdes toxiques, qui tuent en ulcérant le poumon {cite:canon-ibn-sina-print-v1 p.377} {cite:canon-ibn-sina-print-v1 p.378}."
  ur: "ایک سرخی مائل خول دار جانور۔ اس کا خون گرم ہے جو جھائیوں اور برص کو صاف کرتا ہے، اور جلا ہوا سر گنجے پن میں بال اگاتا ہے۔ کتاب اسے زہریلی دواؤں میں شمار کرتی ہے، جو پھیپھڑے میں زخم کر کے مارتی ہے {cite:canon-ibn-sina-print-v1 p.377} {cite:canon-ibn-sina-print-v1 p.378}۔"
  es: "Un animal rojizo con concha. Su sangre es caliente y elimina las pecas y el vitíligo; su cabeza, quemada, regenera el cabello en casos de alopecia. El libro lo incluye entre las drogas venenosas, que matan ulcerando el pulmón {cite:canon-ibn-sina-print-v1 p.377} {cite:canon-ibn-sina-print-v1 p.378}."
  tr: "Kabuktan kırmızıya kadar bir hayvandır, kanı sıcaktır ve melazma ile vitiligoyu arındırır, başı tilki hastalığında yanmış ve tüyler çıkar. Akciğer ülserasyonu ile öldüren toksik bir ilaç olarak kabul edilir {cite:canon-ibn-sina-print-v1 s.377} {cite:canon-ibn-sina-print-v1 s.378}."
  id: "Ia adalah hewan dari cangkang hingga merah, darahnya panas dan memurnikan melasma serta vitiligo, dan kepalanya terbakar serta tumbuh bulu pada penyakit rubah. Dianggap sebagai obat beracun yang membunuh melalui ulserasi paru-paru {cite:canon-ibn-sina-print-v1 hlm.377} {cite:canon-ibn-sina-print-v1 hlm.378}."
