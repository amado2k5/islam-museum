id: concept/hilal-fiqh
class: concept
kind: legal
label: { ar: "هِلال", en: "Hilal (the crescent and the lunar month for the law)" }
summary:
  ar: "الهلال في اللغة القمر في حالة خاصة، وفي الاصطلاح ما يُرى من المضيء من القمر أول ليلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16552} وجعل الشارع الأهلة مواقيت للناس تُؤقَّت بها المعاملات القابلة للتأجيل، والعبادات كالحج والصوم والفطر، وما يترتب عليه أثر شرعي كالعدة ومدة الرضاع ومدة الإيلاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16553} وذكر الفقهاء أن العبادات لا تُوقَّت إلا بالشرع، أما توقيت المعاملات فهو اتفاقي، ويُحمل الشهر المطلق على الهلالي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16553} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16554} ولا يُعوَّل على كبر الهلال أو صغره في تحديد أول الشهر، وإنما هو ابن ليلة الرؤية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16554}"
  en: "Hilal in the lexical sense is the moon in a particular state; technically it is the first sighting of the lit part of the moon on the first night. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16552} The law made the crescents times for people: the deferred dealings and the rites (the pilgrimage, fasting, the breaking of the fast) and the matters with legal effects, such as the waiting period, the period of nursing and the period of the oath of abstention. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16553} Jurists hold that only the lawgiver fixes the times of worship, while the times of transactions are agreed by the parties; an unqualified month is taken as a lunar month. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16553} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16554} The size of the crescent is no guide to the start of the month; what counts is the night of sighting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16554}"
