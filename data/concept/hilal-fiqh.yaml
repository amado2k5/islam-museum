label: { ar: "هِلال", en: "Hilal (the crescent and the lunar month for the law)", es: "Hilal (la luna creciente y el mes lunar para la ley)", fr: "Hilal (le croissant et le mois lunaire de la loi)", ur: "ہلال ⁦(شریعت کے لیے ہلال اور قمری مہینہ)⁩", tr: "hilal şeklinde", id: "bulan sabit" }
summary:
  ar: "الهلال في اللغة القمر في حالة خاصة، وفي الاصطلاح ما يُرى من المضيء من القمر أول ليلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16552} وجعل الشارع الأهلة مواقيت للناس تُؤقَّت بها المعاملات القابلة للتأجيل، والعبادات كالحج والصوم والفطر، وما يترتب عليه أثر شرعي كالعدة ومدة الرضاع ومدة الإيلاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16553} وذكر الفقهاء أن العبادات لا تُوقَّت إلا بالشرع، أما توقيت المعاملات فهو اتفاقي، ويُحمل الشهر المطلق على الهلالي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16553} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16554} ولا يُعوَّل على كبر الهلال أو صغره في تحديد أول الشهر، وإنما هو ابن ليلة الرؤية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16554}"
  en: "Hilal in the lexical sense is the moon in a particular state; technically it is the first sighting of the lit part of the moon on the first night. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16552} The law made the crescents times for people: the deferred dealings and the rites (the pilgrimage, fasting, the breaking of the fast) and the matters with legal effects, such as the waiting period, the period of nursing and the period of the oath of abstention. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16553} Jurists hold that only the lawgiver fixes the times of worship, while the times of transactions are agreed by the parties; an unqualified month is taken as a lunar month. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16553} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16554} The size of the crescent is no guide to the start of the month; what counts is the night of sighting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16554}"
  es: "Hilal en el sentido léxico es la luna en un estado particular; técnicamente es el primer avistamiento de la parte iluminada de la luna en la primera noche. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16552} La ley estableció los tiempos de las lunas crecientes para las personas: los tratos diferidos y los ritos (la peregrinación, el ayuno, la ruptura del ayuno) y los asuntos con efectos legales, como el período de espera, el período de lactancia y el período del juramento de abstención. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16553} Los juristas sostienen que solo el legislador fija los tiempos de culto, mientras que los tiempos de las transacciones son acordados por las partes; un mes no calificado se toma como un mes lunar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16553} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16554} El tamaño de la luna creciente no es una guía para el comienzo del mes; lo que cuenta es la noche de su aparición. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16554}"
  fr: "Le hilal, au sens littéral, désigne la lune dans un état particulier; techniquement, il s'agit de la première observation de la partie éclairée de la lune durant la première nuit du mois lunaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16552} La loi a établi les dates des différents croissants lunaires pour les personnes: les transactions différées et les rites (le pèlerinage, le jeûne, la rupture du jeûne) ainsi que les questions ayant des conséquences juridiques, telles que le délai d'attente, la période d'allaitement et la période du serment d'abstinence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16553} Les juristes estiment que seul le législateur fixe les dates des offices religieux, tandis que les dates des transactions sont convenues entre les parties; un mois non précisé est considéré comme un mois lunaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16553} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16554} La taille du croissant n'est pas un indicateur du début du mois; ce qui compte, c'est la nuit de son observation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16554}"
  ur: "ہلال لغوی معنوں میں ایک خاص حالت میں چاند ہے۔ تکنیکی طور پر یہ پہلی رات چاند کے روشن حصے کی پہلی نظر ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 16552} قانون نے لوگوں کے لیے ہلال کے اوقات بنائے ہیں: التوا کے معاملات اور عبادات ⁦(حج، روزہ، افطاری)⁩ اور شرعی اثرات کے حامل معاملات جیسے عدت، دودھ پلانے کی مدت اور عشرہ کی عدت۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16552} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16553} فقہاء کا خیال ہے کہ عبادت کے اوقات صرف قانون دینے والا مقرر کرتا ہے، جبکہ لین دین کے اوقات فریقین کے درمیان متفقہ ہوتے ہیں۔ ایک نااہل مہینے کو قمری مہینے کے طور پر لیا جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16553} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16554} ہلال کا سائز مہینے کے آغاز کے لیے کوئی رہنما نہیں ہے۔ کیا اہمیت ہے دیدار کی رات۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص16554}"
  tr: "Dilde hilal özel bir durumdur ve terminolojide aydan ilk gece görülen şeydir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16552} Yasama organı, hilal aylarını, ertelenmiş işlemleri, hac gibi ibadet eylemlerini ve bekleme süresi, emzirme süresi ve ila'nın süresi gibi yasal etkileri önlemek için belirlenmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16553} Hukukçular, ibadet işlemlerinin yalnızca İslam hukukuna göre zamanlandığını, işlemlerin zamanlamasının ise anlaşmaya göre olduğunu ve mutlak ayın Hilali'ye atfedildiğini belirtmişlerdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16553} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16554} Ayalın büyüklüğü veya küçüklüğü ayın başlangıcını belirlemek için dikkate alınmaz; aksine, görülme gecesinin oğludur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16554}"
  id: "Dalam bahasa, bulan sabit adalah kondisi khusus, dan dalam istilah adalah apa yang terlihat dari bulan pada malam pertama. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16552} Pembuat undang-undang telah menetapkan waktu bulan sabit bagi orang untuk mencegah transaksi yang ditunda, ibadah seperti Haji, puasa, dan berbuka puasa, serta konsekuensi hukum seperti masa tunggu, durasi menyusui, dan durasi Ila. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16553} Para ahli hukum menyatakan bahwa ibadah hanya ditentukan sesuai dengan hukum Islam, sedangkan waktu transaksi adalah berdasarkan kesepakatan, dan bulan absolut diberikan kepada Hilali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16553} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16554} Ukuran atau kecilnya bulan sabit tidak dijadikan dasar untuk menentukan awal bulan; melainkan, ia adalah anak dari malam penampakan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16554}"
