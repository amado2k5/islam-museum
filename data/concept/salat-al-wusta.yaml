id: concept/salat-al-wusta
class: concept
kind: belief
label:
  ar: "الصلاة الوسطى"
  en: "The middle prayer (al-salat al-wusta)"
  ur: "صلاۃ وسطیٰ"
  es: "La oración del medio (al-salat al-wusta)"
  fr: "La prière du milieu (al-salat al-wusta)"
  tr: "Orta Dua"
  id: "Doa Tengah"
summary:
  ar: "يعرض الشعراوي في تفسير قوله تعالى «حافظوا على الصلوات والصلاة الوسطى» عدة وجوه لتعيين الصلاة الوسطى: بالعدد، وبترتيب التشريع، وبعدد الركعات، وبحضور الملائكة. ويرى أن الشارع أبهمها عمداً ليحافظ المؤمن على الصلوات كلها، ويذكر أن كثيراً من العلماء يرونها صلاة المغرب {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1022} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1024} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1025}."
  en: "On the verse 'guard the prayers and the middle prayer,' Sha'rawi lists ways to identify the middle prayer: by count, by the order in which they were prescribed, by number of rak'at, and by the angels present. He holds that it was left unnamed on purpose, so that every prayer is guarded, and reports that many scholars take it to be Maghrib {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1022} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1024} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1025}."
  ur: "شعراوی آیت «حافظوا على الصلوات والصلاة الوسطى» پر صلاۃ وسطیٰ کی تعیین کے کئی طریقے بیان کرتے ہیں: گنتی کے لحاظ سے، وجوب کی ترتیب سے، رکعات کی تعداد سے اور فرشتوں کی موجودگی سے۔ ان کے نزدیک اسے مبہم رکھنا مقصود ہے تاکہ ہر نماز کی حفاظت ہو، اور وہ نقل کرتے ہیں کہ بہت سے علماء اسے مغرب کی نماز سمجھتے ہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1022} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1024} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1025}."
  es: "Sobre el versículo «guarda las oraciones y la oración del medio», Sha'rawi enumera maneras de identificar la oración del medio: por el conteo, por el orden en que fueron prescritas, por el número de rak'at y por los ángeles presentes. Él sostiene que se dejó sin nombre a propósito, para que cada oración sea guardada, e informa que muchos eruditos la consideran Maghrib {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1022} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1024} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1025}."
  fr: "Concernant le verset « gardez les prières et la prière médiane », Sha'rawi énumère les moyens d'identifier la prière médiane: par le nombre de rak'ahs, par l'ordre dans lequel elles ont été prescrites, par le nombre de rak'ahs et par la présence des anges. Il soutient qu'elle a été volontairement laissée sans nom, afin que chaque prière soit gardée, et rapporte que de nombreux savants la considèrent comme étant la prière du Maghrib (voir: Tafsir Shari'rawi Khawatir, vol. 2, p. 1022, 1024 et 1025)."
  tr: "Al-Shaarawi, \"Duaları ve orta duaları koruyun\" ayetinin yorumunda orta namazı tanımlamak için birkaç yol sunar: sayı, yasa düzeni, rak'ahların sayısı ve meleklerin varlığı ile. Kanunucan'ın bunları kasıtlı olarak gizlediğine inanır, böylece müminler tüm duaları sürdürebilsin ve birçok âlimin bunu Mağrip namazı olarak gördüğünü belirtir {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1022} {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1025}."
  id: "Al-Shaarawi menyajikan beberapa cara untuk mendefinisikan doa tengah dalam interpretasinya atas ayat \"Jaga doa dan doa tengah\": berdasarkan angka, urutan undang-undang, jumlah rak'ah, dan kehadiran malaikat. Ia percaya bahwa Sang Pemberi Hukum sengaja menutupi doa tersebut agar orang beriman dapat mempertahankan semua doa, dan ia menyebutkan bahwa banyak ulama menganggapnya sebagai doa Maghrib {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1022} {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1025}."
issue:
  ar: "أي الصلوات هي الوسطى، ولماذا لم يُعيّنها الشرع؟"
  en: "Which prayer is the middle one, and why did the law not name it?"
  ur: "کون سی نماز وسطیٰ ہے، اور شریعت نے اسے متعین کیوں نہیں کیا؟"
