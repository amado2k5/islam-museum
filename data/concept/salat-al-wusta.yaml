perspectives:
  - tradition: sunni
    id: sunni-sharawi-hidden-to-guard-all
    stance: { ar: "أُبهمت الصلاة الوسطى لتُحفظ الصلوات كلها", en: "The middle prayer is left unnamed so that all the prayers are guarded", ur: "صلاۃ وسطیٰ کو مبہم رکھا گیا تاکہ تمام نمازوں کی حفاظت ہو" }
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يرى الشعراوي أن الإبهام يجعل كل صلاة صالحة لأن تكون الوسطى، فيحافظ المؤمن على كل الصلوات، كما أبهم الله ليلة القدر فصارت ليالي {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1025}."
      en: "Sha'rawi holds that the ambiguity makes every prayer possibly the middle one, so the believer guards all of them, as God left the Night of Power unnamed so that it became many nights {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1025}."
    sources: [source/tafsir-sharawi-khawatir-scan-vol-2]
  - tradition: sunni
    id: sunni-reported-maghrib
    stance: { ar: "هي المغرب بترتيب التشريع وبعدد الركعات، وهو رأي كثير من العلماء كما ينقله الشعراوي", en: "It is Maghrib, by the order of prescription and by the number of rak'at, a view Sha'rawi reports that many scholars hold", ur: "مغرب، تشریعی ترتیب اور رکعات کی تعداد کے لحاظ سے، جیسا کہ شعراوی بہت سے علماء سے نقل کرتے ہیں" }
    holders: []
    summary:
      ar: "ينقل الشعراوي أن كثيراً من العلماء يرون أنها المغرب، لأنها الثالثة في ترتيب فرض الصلوات ولأنها ثلاث ركعات بين ركعتين وأربع، ولم يذكر أسماءهم في هذا الموضع {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1024}."
      en: "Sha'rawi reports that many scholars take it to be Maghrib: it is third in the order of prescription, and it has three rak'at between the two-rak'at Fajr and the four-rak'at prayers. He does not name them on this page {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1024}."
    sources: [source/tafsir-sharawi-khawatir-scan-vol-2]
