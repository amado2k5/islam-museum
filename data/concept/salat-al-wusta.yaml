id: concept/salat-al-wusta
class: concept
kind: belief
label:
  ar: "الصلاة الوسطى"
  en: "The middle prayer (al-salat al-wusta)"
  ur: "صلاۃ وسطیٰ"
summary:
  ar: "يعرض الشعراوي في تفسير قوله تعالى «حافظوا على الصلوات والصلاة الوسطى» عدة وجوه لتعيين الصلاة الوسطى: بالعدد، وبترتيب التشريع، وبعدد الركعات، وبحضور الملائكة. ويرى أن الشارع أبهمها عمداً ليحافظ المؤمن على الصلوات كلها، ويذكر أن كثيراً من العلماء يرونها صلاة المغرب {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1022} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1024} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1025}."
  en: "On the verse 'guard the prayers and the middle prayer,' Sha'rawi lists ways to identify the middle prayer: by count, by the order in which they were prescribed, by number of rak'at, and by the angels present. He holds that it was left unnamed on purpose, so that every prayer is guarded, and reports that many scholars take it to be Maghrib {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1022} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1024} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1025}."
  ur: "شعراوی آیت «حافظوا على الصلوات والصلاة الوسطى» پر صلاۃ وسطیٰ کی تعیین کے کئی طریقے بیان کرتے ہیں: گنتی کے لحاظ سے، وجوب کی ترتیب سے، رکعات کی تعداد سے اور فرشتوں کی موجودگی سے۔ ان کے نزدیک اسے مبہم رکھنا مقصود ہے تاکہ ہر نماز کی حفاظت ہو، اور وہ نقل کرتے ہیں کہ بہت سے علماء اسے مغرب کی نماز سمجھتے ہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1022} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1024} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1025}."
issue:
  ar: "أي الصلوات هي الوسطى، ولماذا لم يُعيّنها الشرع؟"
  en: "Which prayer is the middle one, and why did the law not name it?"
  ur: "کون سی نماز وسطیٰ ہے، اور شریعت نے اسے متعین کیوں نہیں کیا؟"
