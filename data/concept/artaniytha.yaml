summary:
  ar: "عرطنيثا في الكتاب دواء يستعمل أصله، قيل إنه بخور مريم، وينقل عن ديسقوريدوس وصفاً يقول المؤلف إنه ليس ما يعرف في زمانه، فالمعروف شوك كثيف قصير له أصل أبيض يغسل به الصوف، محلل مقطع، ينفع من أوجاع الوركين والفواق واللسع، وفي الكتاب نقل موسوم في الجنين {cite:canon-ibn-sina-print-v1 p.610}"
  en: "Artaniytha is in the book a drug whose root is used, said to be the bakhur Maryam; a description is reported from Dioscorides which the author says is not what is known in his time, the known one being a dense short thorn with a white root used to wash wool; it is dissolving and cutting, benefits pains of the hips, hiccup and stings, and the book gives a labelled listing on the foetus {cite:canon-ibn-sina-print-v1 p.610}"
  fr: "Artaniytha est, dans le livre, un remède dont on utilise la racine, dit être le bakhur Maryam ; une description est rapportée de Dioscoride, dont l’auteur dit qu’elle ne correspond pas à ce que l’on connaît en son temps, la plante connue étant une épine dense et courte à racine blanche servant à laver la laine ; il est résolutif et incisif, utile contre les douleurs des hanches, le hoquet et les piqûres, et le livre donne une mention signalée concernant le fœtus {cite:canon-ibn-sina-print-v1 p.610}"
  ur: "عرطنیثا کتاب میں ایک دوا ہے جس کی جڑ استعمال ہوتی ہے، کہا گیا کہ یہ بخور مریم ہے؛ دیسقوریدوس سے ایک وصف نقل ہے جس کے بارے میں مصنف کہتا ہے کہ یہ وہ نہیں جو اس کے زمانے میں معروف ہے، معروف تو گھنا چھوٹا کانٹا ہے جس کی جڑ سفید ہے اور اس سے اون دھوئی جاتی ہے؛ گھلانے اور کاٹنے والا ہے، کولھوں کے دردوں، ہچکی اور ڈنک میں فائدہ دیتا ہے، اور کتاب میں جنین کے بارے میں ایک موسوم نقل ہے {cite:canon-ibn-sina-print-v1 p.610}۔"
  es: "En el libro, Artaniytha es una droga cuya raíz se utiliza, supuestamente el bakhur Maryam; se cita una descripción de Dioscórides que, según el autor, no se corresponde con lo que se conocía en su época, pues lo conocido era una espina corta y densa con una raíz blanca que se usaba para lavar la lana; es disolvente y cortante, alivia dolores de cadera, hipo y picaduras, y el libro incluye una lista etiquetada en el feto {cite:canon-ibn-sina-print-v1 p.610}."
