id: concept/shair-wa-shilt
class: concept
kind: natural
label:
  ar: "شعير وشلت"
  en: "Sha'ir and shilt"
  ur: "شعیر اور شلت"
summary:
  ar: "الشعير والشلت في الكتاب معروف، والشلت نوع بلا قشر وفعله قريب من فعله، بارد يابس في الأولى، فيه جلاء وغذاؤه أقل من غذاء الحنطة وماء الشعير أقوى من سويقه وكلاهما يكسران حدة الأخلاط، ويطلى منه على الكلف، ويضمد به الأورام الصلبة والحارة والجرب المتقرح والنقرس، وماؤه ينفع من أمراض الصدر، وسويقه يمسك البطن وطبيخه يدر البول، وماؤه مبرد مرطب للحميات {cite:canon-ibn-sina-print-v1 p.682}"
  en: "Sha'ir and shilt are in the book well known, shilt being a kind without husk whose action is close to its action; cold and dry in the first degree, cleansing, nourishing less than wheat, its water stronger than its sawiq, both breaking the sharpness of humours; it is applied on freckles, as a poultice on hard and hot swellings, ulcerated scab and gout; its water benefits diseases of the chest, its sawiq binds the belly, its decoction promotes urine, and its water cools and moistens fevers {cite:canon-ibn-sina-print-v1 p.682}"
  ur: "شعیر اور شلت کتاب میں معروف ہیں، شلت بے چھلکے کی ایک قسم ہے جس کا فعل اس کے فعل کے قریب ہے؛ پہلے درجے میں سرد خشک ہے، جلا دینے والا ہے، اس کی غذا گندم سے کم ہے، اس کا پانی اس کے ستو سے زیادہ قوی ہے اور دونوں اخلاط کی تیزی کو توڑتے ہیں؛ جھائیوں پر لگایا جاتا ہے، سخت اور گرم ورموں، پھوٹنے والی خارش اور نقرس پر لیپ کیا جاتا ہے؛ اس کا پانی سینے کی بیماریوں میں نافع ہے، اس کا ستو پیٹ کو روکتا ہے، اس کا جوشاندہ پیشاب لاتا ہے، اور اس کا پانی بخاروں کے لیے ٹھنڈک اور تری دینے والا ہے {cite:canon-ibn-sina-print-v1 p.682}۔"
