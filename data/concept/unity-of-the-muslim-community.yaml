label:
  ar: وحدة الأمة الإسلامية
  en: "Unity of the Muslim community"
  es: "Unidad de la comunidad musulmana"
  fr: "Unité de la communauté musulmane"
  ur: "امت مسلمہ کا اتحاد"
summary:
  ar: "يرى أحمد عمر هاشم أن الوحدة أساس كل خير في الدنيا والآخرة، وأن الفرقة من أخطر الآفات، ويستدل بقوله تعالى في الاعتصام بحبل الله وبحديث أبي هريرة الذي يجعل الاعتصام بحبل الله أول ما يرضاه الله للمسلمين {cite:hatha-huwa-al-islam-azhar p. 114} {cite:hatha-huwa-al-islam-azhar p. 115} {cite:hatha-huwa-al-islam-azhar p. 116}. ويذكر أن الأوس والخزرج كانت بينهما عداوة طالت، فألف الإسلام بينهما؛ وهذه رواية يسوقها المؤلف بصيغة «قيل» {cite:hatha-huwa-al-islam-azhar p. 115}. ويعد العبادات الجماعية، من صلاة الجماعة والعيدين والحج والصيام والزكاة، تطبيقا عمليا للوحدة {cite:hatha-huwa-al-islam-azhar p. 118} {cite:hatha-huwa-al-islam-azhar p. 119}. ويرى أن سياسة «فرّق تسد» كانت من أسباب تمزيق الأمة، وهذا رأي المؤلف يعرض بوصفه كذلك {cite:hatha-huwa-al-islam-azhar p. 114}."
  en: "Ahmad Umar Hashim holds that unity is the basis of every good in this world and the next, and division the gravest affliction. He draws on the Qur'anic call to hold fast to God's rope and on a hadith in Sahih Muslim, presents the Aws and Khazraj reconciliation as a narrated episode, and treats congregational worship and pilgrimage as practical unity. His view that divide-and-rule weakened the Muslim nations is the author's own (pp. 114-119)."
  es: "Ahmad Umar Hashim sostiene que la unidad es la base de todo bien en este mundo y en el venidero, y la división, la más grave aflicción. Se basa en el llamado coránico a aferrarse a la cuerda de Dios y en un hadiz del Sahih Muslim, presenta la reconciliación de Aws y Khazraj como un episodio narrado y considera el culto congregacional y la peregrinación como una forma práctica de unidad. Su opinión de que la estrategia de divide y vencerás debilitó a las naciones musulmanas es propia del autor (págs. 114-119)."
  fr: "Ahmad Umar Hashim soutient que l'unité est le fondement de tout bien dans ce monde et dans l'autre, et la division le pire des maux. Il s'appuie sur l'appel coranique à s'attacher fermement à la corde de Dieu et sur un hadith du Sahih Muslim, présente la réconciliation des Aws et des Khazraj comme un épisode narré, et considère le culte en congrégation et le pèlerinage comme des manifestations concrètes de l'unité. Son opinion selon laquelle la stratégie « diviser pour mieux régner » a affaibli les nations musulmanes lui est propre (pp. 114-119)."
  ur: "احمد عمر ہاشم کا خیال ہے کہ اتحاد دنیا اور آخرت کی ہر بھلائی کی بنیاد ہے اور سب سے بڑی مصیبت کو تقسیم کرنا ہے۔ وہ خدا کی رسی کو مضبوطی سے پکڑنے کی قرآنی دعوت اور صحیح مسلم کی ایک حدیث کی طرف متوجہ کرتا ہے، اوس اور خزرج کی صلح کو ایک بیان کردہ واقعہ کے طور پر پیش کرتا ہے، اور اجتماعی عبادت اور زیارت کو عملی اتحاد کے طور پر دیکھتا ہے۔ اس کا نظریہ کہ تقسیم اور حکمرانی نے مسلم اقوام کو کمزور کیا، مصنف کا اپنا ہے ⁦(صفحہ 114-119)⁩۔"
