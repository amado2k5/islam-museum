label:
  ar: وحدة الأمة الإسلامية
  en: "Unity of the Muslim community"
summary:
  ar: "يرى أحمد عمر هاشم أن الوحدة أساس كل خير في الدنيا والآخرة، وأن الفرقة من أخطر الآفات، ويستدل بقوله تعالى في الاعتصام بحبل الله وبحديث أبي هريرة الذي يجعل الاعتصام بحبل الله أول ما يرضاه الله للمسلمين {cite:hatha-huwa-al-islam-azhar p. 114} {cite:hatha-huwa-al-islam-azhar p. 115} {cite:hatha-huwa-al-islam-azhar p. 116}. ويذكر أن الأوس والخزرج كانت بينهما عداوة طالت، فألف الإسلام بينهما؛ وهذه رواية يسوقها المؤلف بصيغة «قيل» {cite:hatha-huwa-al-islam-azhar p. 115}. ويعد العبادات الجماعية، من صلاة الجماعة والعيدين والحج والصيام والزكاة، تطبيقا عمليا للوحدة {cite:hatha-huwa-al-islam-azhar p. 118} {cite:hatha-huwa-al-islam-azhar p. 119}. ويرى أن سياسة «فرّق تسد» كانت من أسباب تمزيق الأمة، وهذا رأي المؤلف يعرض بوصفه كذلك {cite:hatha-huwa-al-islam-azhar p. 114}."
  en: "Ahmad Umar Hashim holds that unity is the basis of every good in this world and the next, and division the gravest affliction. He draws on the Qur'anic call to hold fast to God's rope and on a hadith in Sahih Muslim, presents the Aws and Khazraj reconciliation as a narrated episode, and treats congregational worship and pilgrimage as practical unity. His view that divide-and-rule weakened the Muslim nations is the author's own (pp. 114-119)."
