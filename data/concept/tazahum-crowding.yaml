id: concept/tazahum-crowding
class: concept
kind: legal
label:
  ar: "التزاحم"
  en: "Tazahum (crowding, and competing claims)"
  ur: "تزاحم ⁦(ہجوم اور متعدد حقوق کا باہم ٹکرانا)⁩"
  es: "Tazahum (aglomeración y reclamaciones en competencia)"
  fr: "Tazahum (surpopulation et revendications concurrentes)"
summary:
  ar: "التزاحم تضايق القوم أو تدافعهم في المكان، ويحرم إن أذى أحدا أو ترتب عليه محظور. وفيه أحكام: زحام المأموم في السجود، والاستلام والإشارة في الطواف، وتزاحم الغرماء في مال المفلس، وتزاحم الوصايا، والقتل بالزحام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5005} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5006} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5007} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5008}"
  en: "Tazahum is crowding, pressing against one another in a place. It is forbidden if it hurts someone or leads to a forbidden act. It covers a follower's crowding in prostration, the use of signs at the Black Stone in circumambulation, competing creditors of an insolvent debtor, competing bequests, and killing in a crowd. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5005} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5006} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5007} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5008}"
  es: "Tazahum significa aglomeración, presión entre las personas en un lugar. Está prohibido si daña a alguien o conduce a un acto prohibido. Abarca la aglomeración de seguidores en postración, el uso de signos en la Piedra Negra durante la circunvalación, los acreedores rivales de un deudor insolvente, las herencias rivales y el asesinato en una multitud. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5005} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5006} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5007} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5008}"
  fr: "Le tazahum désigne le fait de se presser les uns contre les autres dans un lieu. Il est interdit s'il nuit à autrui ou conduit à un acte interdit. Cela inclut le regroupement des fidèles lors de la prosternation, l'utilisation de signes à la Pierre Noire pendant la circumambulation, les créanciers concurrents d'un débiteur insolvable, les legs concurrents et le meurtre en foule. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5005} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5006} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5007} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5008}"
  ur: "تزہم ایک جگہ پر ایک دوسرے کے خلاف ہجوم کر رہا ہے۔ اگر اس سے کسی کو تکلیف پہنچتی ہے یا کسی حرام کام کی طرف لے جاتا ہے تو یہ حرام ہے۔ اس میں سجدے میں ایک پیروکار کا ہجوم، طواف میں حجر اسود پر نشانات کا استعمال، ایک نادہندہ قرض دار کے قرض دہندگان کا مقابلہ کرنا، وصیت کا مقابلہ کرنا، اور ہجوم میں قتل کرنا شامل ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5005} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5006} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5007} صفحہ 5008}"
