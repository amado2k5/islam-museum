summary:
  ar: "التزاحم تضايق القوم أو تدافعهم في المكان، ويحرم إن أذى أحدا أو ترتب عليه محظور. وفيه أحكام: زحام المأموم في السجود، والاستلام والإشارة في الطواف، وتزاحم الغرماء في مال المفلس، وتزاحم الوصايا، والقتل بالزحام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5005} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5006} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5007} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5008}"
  en: "Tazahum is crowding, pressing against one another in a place. It is forbidden if it hurts someone or leads to a forbidden act. It covers a follower's crowding in prostration, the use of signs at the Black Stone in circumambulation, competing creditors of an insolvent debtor, competing bequests, and killing in a crowd. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5005} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5006} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5007} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5008}"
