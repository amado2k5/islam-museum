id: concept/rada-a-fiqh
class: concept
kind: legal
tags: [akhlaq-browser, akhlaq-nikah, islamic-economy-browser, islamic-economy-money]
label:
  ar: "الرداءة"
  en: "Rada'a (poor quality): the rules on giving poor goods in zakat, on exchanging good for poor, and on the description of goods in contracts"
  ur: "گھٹیا پن"
  es: "Rada'a (mala calidad): las reglas sobre la entrega de bienes de mala calidad en el zakat, sobre el intercambio de bienes buenos por malos y sobre la descripción de los bienes en los contratos."
  fr: "Rada'a (mauvaise qualité): règles relatives au don de biens de mauvaise qualité dans le cadre de la zakat, à l'échange de biens contre des biens destinés aux pauvres et à la description des biens dans les contrats"
summary:
  ar: "الرداءة في اللغة نقيض الجودة، وهي الخسة والفساد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8695} ولا يجوز في الزكاة أن يخرج المالك الرديء عن الجيد، ويُراعى الوسط في أخذ الزكاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8695} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8696} وأكثر أهل العلم على أن الجيد والرديء من الربويات سواء في جواز البيع مع التماثل وتحريمه مع التفاضل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8696} ويشترط عدد من الفقهاء في السلم ذكر الجودة والرداءة في المسلم فيه، ويشترط المالكية والحنابلة والشافعية في الحوالة تماثل الدينين في الجودة والرداءة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8696} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8697} ولا يجب على المقرض قبول الرديء عن الجيد في القرض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8697}"
  en: "Rada'a in the lexicon is the opposite of goodness: baseness and defect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8695} One may not give poor goods in place of good ones due for zakat, and the mean is to be taken. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8695} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8696} Most jurists hold that good and poor goods of the riba kinds are alike, so exchange of equal weight is allowed and excess is forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8696} Several schools require the quality or poorness to be stated in a salam contract, and the Malikis, Hanbalis and some Shafi'is require matching quality in a transfer of debt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8696} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8697} The lender need not accept poorer goods in place of good ones in a loan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8697}"
  ur: "رداءت گھٹیا پن ہے؛ زکاۃ میں گھٹیا مال دینا جائز نہیں، اور وسط کا لحاظ رکھا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8695} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8696}"
  es: "Rada'a en el léxico es lo opuesto a bondad: bajeza y defecto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8695} No se pueden dar bienes pobres en lugar de bienes buenos debidos para zakat, y se debe tomar el término medio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8695} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8696} La mayoría de los juristas sostienen que los bienes buenos y pobres de los tipos riba son iguales, por lo que el intercambio de igual peso está permitido y el exceso está prohibido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8696} Varias escuelas requieren que la calidad o pobreza se indique en un contrato salam, y los malikíes, hanbalíes y algunos shafi'ís requieren una calidad equivalente en una transferencia de deuda. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8696} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8697} El prestamista no necesita aceptar bienes más pobres en lugar de buenos en un préstamo. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8697}"
  fr: "Dans le lexique, « rada'a » est l'opposé de « bon »: la bassesse et le défaut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8695} Il est interdit de donner des biens de mauvaise qualité à la place de biens de bonne qualité dus pour la zakat; il convient de prendre le juste milieu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8695} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8696} La plupart des juristes considèrent que les biens de bonne et de mauvaise qualité, relevant du riba, sont identiques; l'échange à poids égal est donc autorisé et l'excédent interdit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8696} Plusieurs écoles exigent que la qualité ou la pauvreté des biens soit mentionnée dans un contrat de salam, et les Malikites, les Hanbalites et certains Shafi'ites exigent une qualité équivalente lors d'un transfert de dette. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8696} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8697} Le prêteur n'est pas obligé d'accepter des biens de moindre qualité à la place de bons dans un prêt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8697}"
