id: concept/rada-a-fiqh
class: concept
kind: legal
label:
  ar: "الرداءة"
  en: "Rada'a (poor quality): the rules on giving poor goods in zakat, on exchanging good for poor, and on the description of goods in contracts"
  ur: "گھٹیا پن"
summary:
  ar: "الرداءة في اللغة نقيض الجودة، وهي الخسة والفساد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8695} ولا يجوز في الزكاة أن يخرج المالك الرديء عن الجيد، ويُراعى الوسط في أخذ الزكاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8695} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8696} وأكثر أهل العلم على أن الجيد والرديء من الربويات سواء في جواز البيع مع التماثل وتحريمه مع التفاضل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8696} ويشترط عدد من الفقهاء في السلم ذكر الجودة والرداءة في المسلم فيه، ويشترط المالكية والحنابلة والشافعية في الحوالة تماثل الدينين في الجودة والرداءة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8696} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8697} ولا يجب على المقرض قبول الرديء عن الجيد في القرض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8697}"
  en: "Rada'a in the lexicon is the opposite of goodness: baseness and defect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8695} One may not give poor goods in place of good ones due for zakat, and the mean is to be taken. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8695} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8696} Most jurists hold that good and poor goods of the riba kinds are alike, so exchange of equal weight is allowed and excess is forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8696} Several schools require the quality or poorness to be stated in a salam contract, and the Malikis, Hanbalis and some Shafi'is require matching quality in a transfer of debt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8696} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8697} The lender need not accept poorer goods in place of good ones in a loan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8697}"
  ur: "رداءت گھٹیا پن ہے؛ زکاۃ میں گھٹیا مال دینا جائز نہیں، اور وسط کا لحاظ رکھا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8695} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8696}"
