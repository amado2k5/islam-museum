label: { ar: "مضار الفضول المجتمعة عند ابن سينا", en: "The harm of gathered residues in the Canon", ur: "قانون میں جمع شدہ فضلات کے نقصانات" }
summary:
  ar: "يعدد ابن سينا وجوه ضرر الفضول التي تجتمع من الهضم بعد الهضم، فهي تعفن فتحدث أمراض العفونة، وتغير المزاج، وتورث أمراض الامتلاء، وتحدث الأورام إن انصبت إلى عضو، وتفسد بخاراتها الروح، ثم يذكر أن استفراغها بالأدوية فيه كلفة على الطبيعة {cite:canon-ibn-sina-print-v1 p.221}."
  en: "Ibn Sina lists the ways residues gathered from digestion after digestion do harm: they putrefy and bring diseases of putrefaction, upset the temperament, cause the diseases of fullness, make swellings if they pour into an organ, and their vapours spoil the spirit; he adds that expelling them with drugs is a burden on nature {cite:canon-ibn-sina-print-v1 p.221}."
