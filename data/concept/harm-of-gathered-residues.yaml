id: concept/harm-of-gathered-residues
class: concept
kind: scientific
label: { ar: "مضار الفضول المجتمعة عند ابن سينا", en: "The harm of gathered residues in the Canon", ur: "قانون میں جمع شدہ فضلات کے نقصانات", es: "El daño causado por los residuos acumulados en el cañón", fr: "Les méfaits des résidus rassemblés dans le Canon", tr: "İbn Sina'ya göre Merakın Zararları Birleşimi", id: "Dampak Rasa Ingin Tahu Bergabung Menurut Ibn Sina" }
summary:
  ar: "يعدد ابن سينا وجوه ضرر الفضول التي تجتمع من الهضم بعد الهضم، فهي تعفن فتحدث أمراض العفونة، وتغير المزاج، وتورث أمراض الامتلاء، وتحدث الأورام إن انصبت إلى عضو، وتفسد بخاراتها الروح، ثم يذكر أن استفراغها بالأدوية فيه كلفة على الطبيعة {cite:canon-ibn-sina-print-v1 p.221}."
  en: "Ibn Sina lists the ways residues gathered from digestion after digestion do harm: they putrefy and bring diseases of putrefaction, upset the temperament, cause the diseases of fullness, make swellings if they pour into an organ, and their vapours spoil the spirit; he adds that expelling them with drugs is a burden on nature {cite:canon-ibn-sina-print-v1 p.221}."
  es: "Ibn Sina enumera las formas en que los residuos acumulados de la digestión causan daño: se pudren y provocan enfermedades de putrefacción, alteran el temperamento, causan enfermedades de plenitud, producen hinchazones si se vierten en un órgano y sus vapores corrompen el espíritu; añade que expulsarlos con medicamentos es una carga para la naturaleza {cite:canon-ibn-sina-print-v1 p.221}."
  fr: "Ibn Sina énumère les façons dont les résidus accumulés après la digestion nuisent: ils se putréfient et provoquent des maladies de putréfaction, perturbent le tempérament, causent des maladies de plénitude, font des gonflements s'ils se déversent dans un organe, et leurs vapeurs corrompent l'esprit; il ajoute que les expulser avec des médicaments est un fardeau pour la nature {cite:canon-ibn-sina-print-v1 p.221}."
  ur: "ابن سینا نے ان طریقوں کی فہرست دی ہے جو ہاضمے کے بعد ہاضمہ سے جمع ہونے والی باقیات کو نقصان پہنچاتی ہیں: وہ گندگی کی بیماریاں لاتے ہیں، مزاج کو خراب کرتے ہیں، پیٹ بھرنے کی بیماریاں پیدا کرتے ہیں، اگر کسی عضو میں ڈالتے ہیں تو سوجن پیدا کرتے ہیں، اور ان کے بخارات روح کو خراب کرتے ہیں۔ انہوں نے مزید کہا کہ انہیں منشیات کے ساتھ نکالنا فطرت پر ایک بوجھ ہے"
  tr: "İbn Sina, sindirimden sonra sindirimden kaynaklanan merakın zararlı etkilerini sıralar: çürümeye, enfeksiyon hastalıklarına, ruh hali değişikliklerine ve tokluk hastalıklarına neden olur. Tümörler organa ulaşırsa ortaya çıkar ve buharları ruhu bozar. Ayrıca, ilaçlarla kusmanın doğaya maliyet getirdiğini belirtir {cite:canon-ibn-sina-print-v1 s.221}."
  id: "Ibn Sina mencantumkan efek berbahaya dari rasa ingin tahu yang menumpuk dari pencernaan setelah pencernaan: menyebabkan pembusukan, penyakit menular, perubahan suasana hati, dan menyebabkan penyakit penuh. Tumor terjadi jika mencapai organ, dan uapnya merusak jiwa. Ia juga menyebutkan bahwa memuntahkannya dengan obat menimbulkan biaya bagi alam {cite:canon-ibn-sina-print-v1 hlm.221}."
