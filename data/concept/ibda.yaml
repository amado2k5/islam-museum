label: { ar: "الإبضاع", en: "Sending capital to trade on a gratuitous basis (ibda')", es: "Envío de capital para operar de forma gratuita (ibda')", fr: "Envoi de capitaux pour commercer à titre gratuit (ibda')", ur: "بلا معاوضہ تجارت کے لیے سرمایہ بھیجنا (ibda')" }
summary:
  ar: "تعرّف الموسوعة الفقهية الكويتية الإبضاع بأنه بعث المال مع من يتّجر به تبرعاً والربح كله لرب المال، وتفرّقه عن القراض، وهو شركة في الربح، وعن القرض والوكالة. وتذكر أنه عقد جائز، وأن صيغته صريحة بلفظ الإبضاع أو البضاعة أو غير صريحة، وأن الحنفية والمالكية والشافعية والحنابلة اختلفوا في تكييف عبارة «خذه مضاربة والربح كله لي»، فعدّها الحنابلة مضاربة فاسدة، والحنفية إبضاعاً صحيحاً، والمالكية قراضاً مجازاً. وتبيّن أحكام الأمانة والتصرف والضمان، وحكم اختلاف العامل مع رب المال، وأسباب انتهاء العقد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1445} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1446} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1451}"
  en: "The Kuwaiti encyclopedia defines ibda' as sending capital with someone who trades with it as a gift, the whole profit belonging to the owner. It distinguishes it from qirad (mudaraba), a profit partnership, and from loan and agency. The Encyclopedia states that it is a valid contract and that its wording may be explicit, using the term ibda' or bidaa'a, or implicit. The four schools differ on how to classify the phrase 'take this as a mudaraba, all profit mine': the Hanbalis call it a void mudaraba, the Hanafis a valid ibda', and the Malikis a mudaraba in name only. It then treats the trustee's position, the powers of the one who sends capital and of the agent, liability, disputes between the agent and the owner, and the causes of termination. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1445} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1446} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1451}"
  es: "La enciclopedia kuwaití define el ibda' como el envío de capital a cambio de una donación, en cuyo caso la totalidad de las ganancias pertenecen al propietario. Lo distingue del qirad (mudaraba), una sociedad de lucro, así como del préstamo y la agencia. La enciclopedia afirma que se trata de un contrato válido y que su redacción puede ser explícita, utilizando el término ibda' o bidaa'a, o implícita. Las cuatro escuelas discrepan sobre cómo clasificar la frase «toma esto como una mudaraba, todas las ganancias son mías»: los hanbalíes la denominan mudaraba nula, los hanafíes un ibda' válido y los malikíes una mudaraba solo nominal. A continuación, aborda la posición del fiduciario, las facultades del que envía el capital y del agente, la responsabilidad, las disputas entre el agente y el propietario, y las causas de rescisión. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1445} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1446} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1451}"
  fr: "L'encyclopédie koweïtienne définit l'ibda' comme le don de capital à une personne qui le réinvestit à titre commercial, l'intégralité des bénéfices revenant au donateur. Elle la distingue de la qirad (mudaraba), une société en nom collectif, ainsi que du prêt et du mandat. L'encyclopédie précise qu'il s'agit d'un contrat valide et que sa formulation peut être explicite, utilisant les termes ibda' ou bidaa'a, ou implicite. Les quatre écoles de pensée divergent quant à la qualification de la phrase « prenez ceci comme une mudaraba, tous les bénéfices sont pour moi »: les hanbalites la considèrent comme une mudaraba nulle, les hanafites comme une ibda' valide et les malikites comme une mudaraba de façade. L'encyclopédie aborde ensuite le rôle du fiduciaire, les pouvoirs du donateur et du mandataire, la responsabilité, les litiges entre le mandataire et le donateur, ainsi que les causes de résiliation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1445} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1446} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1451}"
  ur: "کویتی انسائیکلوپیڈیا ibda کی تعریف کسی ایسے شخص کے ساتھ سرمایہ بھیجنے کے طور پر کرتا ہے جو اس کے ساتھ بطور تحفہ تجارت کرتا ہے، سارا منافع مالک کا ہوتا ہے۔ یہ اسے قراد ⁦(مضاربہ)⁩، منافع کی شراکت، اور قرض اور ایجنسی سے ممتاز کرتا ہے۔ انسائیکلوپیڈیا کہتا ہے کہ یہ ایک درست معاہدہ ہے اور اس کے الفاظ واضح ہو سکتے ہیں، اصطلاح ibda' یا bida'a'a، یا implicit استعمال کرتے ہوئے۔ چاروں مکاتب میں اس بات پر اختلاف ہے کہ 'اسے مضاربہ کے طور پر لے لو، تمام منافع میرا': حنبلی اسے باطل مضاربہ کہتے ہیں، حنفیہ جائز عبادت کہتے ہیں، اور مالکیہ صرف نام کے لحاظ سے مضاربہ کہتے ہیں۔ اس کے بعد ٹرسٹی کی پوزیشن، سرمایہ بھیجنے والے اور ایجنٹ کے اختیارات، ذمہ داری، ایجنٹ اور مالک کے درمیان تنازعات، اور برطرفی کے اسباب کا علاج کرتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1445} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1446}"
