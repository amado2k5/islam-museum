id: concept/ibda
class: concept
kind: legal
label: { ar: "الإبضاع", en: "Sending capital to trade on a gratuitous basis (ibda')" }
summary:
  ar: "تعرّف الموسوعة الفقهية الكويتية الإبضاع بأنه بعث المال مع من يتّجر به تبرعاً والربح كله لرب المال، وتفرّقه عن القراض، وهو شركة في الربح، وعن القرض والوكالة. وتذكر أنه عقد جائز، وأن صيغته صريحة بلفظ الإبضاع أو البضاعة أو غير صريحة، وأن الحنفية والمالكية والشافعية والحنابلة اختلفوا في تكييف عبارة «خذه مضاربة والربح كله لي»، فعدّها الحنابلة مضاربة فاسدة، والحنفية إبضاعاً صحيحاً، والمالكية قراضاً مجازاً. وتبيّن أحكام الأمانة والتصرف والضمان، وحكم اختلاف العامل مع رب المال، وأسباب انتهاء العقد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1445} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1446} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1451}"
  en: "The Kuwaiti encyclopedia defines ibda' as sending capital with someone who trades with it as a gift, the whole profit belonging to the owner. It distinguishes it from qirad (mudaraba), a profit partnership, and from loan and agency. The Encyclopedia states that it is a valid contract and that its wording may be explicit, using the term ibda' or bidaa'a, or implicit. The four schools differ on how to classify the phrase 'take this as a mudaraba, all profit mine': the Hanbalis call it a void mudaraba, the Hanafis a valid ibda', and the Malikis a mudaraba in name only. It then treats the trustee's position, the powers of the one who sends capital and of the agent, liability, disputes between the agent and the owner, and the causes of termination. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1445} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1446} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1451}"
