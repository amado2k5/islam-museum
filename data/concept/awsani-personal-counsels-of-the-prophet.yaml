id: concept/awsani-personal-counsels-of-the-prophet
class: concept
kind: ethical
tags: [wasaya-browser, wasaya-prophets, wasaya-wasiyya]
label: { ar: "وصايا النبي الشخصية لأصحابه «أوصاني» و«أوصني»", en: "The Prophet's personal counsels to individual Companions (awsani, awsini)", ur: "افرادِ صحابہ کو نبی کی ذاتی وصیتیں «اوصانی» اور «اوصنی»" }
summary:
  ar: "في كتب الحديث أخبار يقول فيها الصحابي «أوصاني» أو يقول «أوصني» فيجيبه النبي بكلمات قصيرة خاصة به: أبو هريرة يروي أن خليله أوصاه بثلاث هي صيام ثلاثة أيام من كل شهر وركعتا الضحى والوتر قبل النوم {cite:al-bidaya-wal-nihaya scan vol. 4 p. 478}، وأبو ذر يروي أنه أوصاه أن يخشى الله كأنه يراه وأن يسمع ويطيع {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 104}{cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 589}، وابن عباس يروي «احفظ الله يحفظك» {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 432}، ورجل سأله الوصية فقال له «لا تغضب» مراراً {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 343}، ومعاذ بن جبل سمع «اتق الله حيثما كنت» {cite:al-bidaya-wal-nihaya scan vol. 3 p. 110}."
  en: "The hadith books contain reports in which a Companion says awsani, 'he counselled me', or awsini, 'counsel me', and the Prophet answers with a few short words meant for that person: Abu Hurayra reports that his friend counselled him three things, fasting three days of each month, two rak'as of the forenoon prayer, and the witr before sleep {cite:al-bidaya-wal-nihaya scan vol. 4 p. 478}; Abu Dharr reports being counselled to fear God as if he saw Him and to hear and obey {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 104}{cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 589}; Ibn Abbas reports 'guard God and He will guard you' {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 432}; a man who asked for counsel was told 'do not be angry', repeated several times {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 343}; and Mu'adh ibn Jabal heard 'fear God wherever you are' {cite:al-bidaya-wal-nihaya scan vol. 3 p. 110}."
  ur: "حدیث کی کتابوں میں ایسی روایات ہیں جن میں صحابی کہتا ہے «اوصانی»، یعنی انھوں نے مجھے وصیت کی، یا «اوصنی»، یعنی مجھے وصیت کیجیے، اور نبی چند مختصر کلمات سے اسی شخص کو جواب دیتے ہیں: ابو ہریرہ روایت کرتے ہیں کہ ان کے خلیل نے انھیں تین باتوں کی وصیت کی، ہر مہینے تین روزے، چاشت کی دو رکعتیں، اور سونے سے پہلے وتر {cite:al-bidaya-wal-nihaya scan vol. 4 p. 478}؛ ابو ذر روایت کرتے ہیں کہ انھیں وصیت ہوئی کہ اللہ سے ایسے ڈریں جیسے اسے دیکھ رہے ہوں اور سنیں اور مانیں {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 104}{cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 589}؛ ابن عباس روایت کرتے ہیں «اللہ کی حفاظت کرو وہ تمھاری حفاظت کرے گا» {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 432}؛ ایک شخص نے وصیت مانگی تو بار بار فرمایا «غصہ نہ کرو» {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 343}؛ اور معاذ بن جبل نے سنا «جہاں بھی ہو اللہ سے ڈرو» {cite:al-bidaya-wal-nihaya scan vol. 3 p. 110}۔"
