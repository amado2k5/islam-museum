id: concept/awsani-personal-counsels-of-the-prophet
class: concept
kind: ethical
tags: [wasaya-browser, wasaya-prophets, wasaya-wasiyya]
label:
  ar: "وصايا النبي الشخصية لأصحابه «أوصاني» و«أوصني»"
  en: "The Prophet's personal counsels to individual Companions (awsani, awsini)"
  fr: "Les conseils personnels du Prophète à des Compagnons (awsani, awsini)"
  ur: "افرادِ صحابہ کو نبی کی ذاتی وصیتیں «اوصانی» اور «اوصنی»"
  es: "Los consejos personales del Profeta a los Compañeros individuales (awsani, awsini)"
  tr: "Peygamber'in sahabelerine verdiği kişisel buyruklar \"benim öğüdüm\" ve \"benim öğüdüm\"dür."
  id: "Perintah pribadi Nabi kepada para sahabatnya adalah \"nasihatku\" dan \"nasihatku\""
summary:
  ar: "في كتب الحديث أخبار يقول فيها الصحابي «أوصاني» أو يقول «أوصني» فيجيبه النبي بكلمات قصيرة خاصة به: أبو هريرة يروي أن خليله أوصاه بثلاث هي صيام ثلاثة أيام من كل شهر وركعتا الضحى والوتر قبل النوم {cite:al-bidaya-wal-nihaya scan vol. 4 p. 478}، وأبو ذر يروي أنه أوصاه أن يخشى الله كأنه يراه وأن يسمع ويطيع {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 104}{cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 589}، وابن عباس يروي «احفظ الله يحفظك» {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 432}، ورجل سأله الوصية فقال له «لا تغضب» مراراً {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 343}، ومعاذ بن جبل سمع «اتق الله حيثما كنت» {cite:al-bidaya-wal-nihaya scan vol. 3 p. 110}."
  en: "The hadith books contain reports in which a Companion says awsani, 'he counselled me', or awsini, 'counsel me', and the Prophet answers with a few short words meant for that person: Abu Hurayra reports that his friend counselled him three things, fasting three days of each month, two rak'as of the forenoon prayer, and the witr before sleep {cite:al-bidaya-wal-nihaya scan vol. 4 p. 478}; Abu Dharr reports being counselled to fear God as if he saw Him and to hear and obey {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 104}{cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 589}; Ibn Abbas reports 'guard God and He will guard you' {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 432}; a man who asked for counsel was told 'do not be angry', repeated several times {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 343}; and Mu'adh ibn Jabal heard 'fear God wherever you are' {cite:al-bidaya-wal-nihaya scan vol. 3 p. 110}."
  fr: "Les livres de hadith rapportent des récits où un Compagnon dit awsani, « il m’a conseillé », ou awsini, « conseille-moi », et où le Prophète répond par quelques mots destinés à cette personne : Abu Hurayra rapporte que son ami lui conseilla trois choses, jeûner trois jours par mois, accomplir deux rak'as de la prière du duha (en matinée) et le witr avant de dormir {cite:al-bidaya-wal-nihaya scan vol. 4 p. 478} ; Abu Dharr rapporte le conseil de craindre Dieu comme s’il Le voyait, d’écouter et d’obéir {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 104}{cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 589} ; Ibn Abbas rapporte « veille à Dieu, Il veillera sur toi » {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 432} ; un homme demandant conseil s’entendit répéter « ne te mets pas en colère » {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 343} ; Mu'adh ibn Jabal entendit « crains Dieu où que tu sois » {cite:al-bidaya-wal-nihaya scan vol. 3 p. 110}."
  ur: "حدیث کی کتابوں میں ایسی روایات ہیں جن میں صحابی کہتا ہے «اوصانی»، یعنی انھوں نے مجھے وصیت کی، یا «اوصنی»، یعنی مجھے وصیت کیجیے، اور نبی چند مختصر کلمات سے اسی شخص کو جواب دیتے ہیں: ابو ہریرہ روایت کرتے ہیں کہ ان کے خلیل نے انھیں تین باتوں کی وصیت کی، ہر مہینے تین روزے، چاشت کی دو رکعتیں، اور سونے سے پہلے وتر {cite:al-bidaya-wal-nihaya scan vol. 4 p. 478}؛ ابو ذر روایت کرتے ہیں کہ انھیں وصیت ہوئی کہ اللہ سے ایسے ڈریں جیسے اسے دیکھ رہے ہوں اور سنیں اور مانیں {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 104}{cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 589}؛ ابن عباس روایت کرتے ہیں «اللہ کی حفاظت کرو وہ تمھاری حفاظت کرے گا» {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 432}؛ ایک شخص نے وصیت مانگی تو بار بار فرمایا «غصہ نہ کرو» {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 343}؛ اور معاذ بن جبل نے سنا «جہاں بھی ہو اللہ سے ڈرو» {cite:al-bidaya-wal-nihaya scan vol. 3 p. 110}۔"
  es: "Los libros de hadices contienen informes en los que un Compañero dice awsani, 'me aconsejó', o awsini, 'aconséjame', y el Profeta responde con unas pocas palabras cortas destinadas a esa persona: Abu Hurayra informa que su amigo le aconsejó tres cosas, ayunar tres días de cada mes, dos rak'as de la oración de la mañana y el witr antes de dormir {cite:al-bidaya-wal-nihaya scan vol. 4 p. 478}; Abu Dharr informa que se le aconsejó temer a Dios como si lo viera y escuchar y obedecer {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 104}{cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 589}; Ibn Abbas informa 'guarda a Dios y Él te guardará' {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 432}; A un hombre que pidió consejo se le dijo \"no te enojes\", repetido varias veces {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 343}; y Mu'adh ibn Jabal escuchó \"teme a Dios dondequiera que estés\" {cite:al-bidaya-wal-nihaya scan vol. 3 p. 110}."
  tr: "Hadis kitaplarında, sahabenin \"bana öğüt verdi\" ya da \"öğüt verdi\" dediği rivayetler vardır; Peygamber ise kendi kısa sözleriyle yanıt verir: Ebu Huraira, dostunun ona her ayın üç günü, her ayın üç günü oruç tutmasını ve uyumadan önce Duha ile Witr'in iki rekâtını namazını öğütlediğini rivayet eder {cite:al-bidaya-wal-nihaya scan cilt 4, s. 478} ve Ebu Zezar ona Allah'ı görüyormuş gibi korkmasını, dinlemesini ve itaat etmesini öğütlediğini rivayet eder {citte: ibn-rajab-jami-ulum-hikam taraması cilt 2, s. 104}{cite:ibn-rajab-jami-ulum-hikam taraması cilt 2, s. 589} ve İbn Abbas şöyle der: \"Allah'ı koru, o seni korur\" {cite:ibn-rajab-jami-ulum-hikam taraması cilt 2, s. 432} ve bir adam ondan tavsiye istedi, o da \"Kızma\" defalarca dedi {cite:ibn-rajab-jami-ulum-hikam taranı cilt 2, s. 343} ve Muadh bin Jabal \"Nerede olursan ol Allah'tan kork\" diye duydu {cite:al-bidaya-wal-nihaya taranı cilt 3, s. 110}."
  id: "Dalam kitab-kitab hadis, terdapat laporan di mana sahabat berkata \"menasihati saya\" atau mengatakan \"menasihati saya,\" yang dijawab Nabi dengan kata-kata singkatnya sendiri: Abu Huraira menceritakan bahwa sahabatnya menyarankan untuk berpuasa tiga hari setiap bulan, dan berpuasa tiga hari setiap bulan, serta berdoa dua rak'ah Dua dan Witr sebelum tidur {cite:al-bidaya-wal-nihaya scan vol. 4, hlm. 478}, dan Abu Dharr menceritakan bahwa dia menasihatinya untuk takut kepada Allah seolah-olah melihat-Nya, mendengarkan dan taat {cite: Ibn-Rajab-Jami-Ulum-Hikam Scan Vol. 2, hlm. 104}{cite:Ibn-Rajab-Jami-Ulum-Hikam Scan Vol. 2, hlm. 589}, dan Ibn Abbas menceritakan, \"Lindungilah Tuhan, Dia akan melindungimu\" {cite:ibn-rajab-jami-ulum-hikam scan vol. 2, hlm. 432}, dan seorang pria meminta nasihatnya dan ia berkata, \"Jangan marah\" berulang kali {cite:ibn-rajab-jami-ulum-hikam scan vol. 2, hlm. 343}, dan Muadh bin Jabal mendengar \"Takutlah Tuhan di mana pun kau berada\" {cite:al-bidaya-wal-nihaya scan vol. 3, hlm. 110}."
