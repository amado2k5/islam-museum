summary:
  ar: "فوة الصباغين في الكتاب عفص الطعم يجلو باعتدال، يجعل بالخل على القوابي والبهق الأبيض وينقي الجلد من كل أثر، ويسقى بماء القراطن لعرق النسا والفالج، وثمره بالسكنجبين لأورام الطحال، ويفتح سدد الكبد، ويدر البول شديدا {cite:canon-ibn-sina-print-v1 pp.625-626}"
  en: "Fuwwat al-sabbaghin is in the book the dyers' root, astringent in taste and cleansing moderately; it is applied with vinegar on ringworm and white vitiligo and cleanses the skin of every mark, is given with the water of qaratin for sciatica and palsy, its fruit with oxymel for swellings of the spleen, it opens obstructions of the liver and promotes urine strongly {cite:canon-ibn-sina-print-v1 pp.625-626}"
  ur: "فوۃ الصباغین کتاب میں رنگ ریزوں کی جڑ ہے، ذائقے میں کسیلی اور اعتدال سے جلاء دینے والی؛ سرکے کے ساتھ دادر اور سفید برص پر لگائی جاتی اور جلد کو ہر نشان سے صاف کرتی ہے، قراطن کے پانی کے ساتھ عرق النسا اور فالج میں پلائی جاتی ہے، اس کا پھل سکنجبین کے ساتھ تلی کے ورموں میں دیا جاتا ہے، جگر کے سدے کھولتی ہے اور پیشاب خوب جاری کرتی ہے {cite:canon-ibn-sina-print-v1 pp.625-626}۔"
  es: "Fuwwat al-sabbaghin es en el libro la raíz de los tintoreros, de sabor astringente y moderadamente limpiadora; se aplica con vinagre sobre la tiña y el vitíligo blanco y limpia la piel de toda marca, se administra con agua de qaratin para la ciática y la parálisis, su fruto con oxímel para las inflamaciones del bazo, desbloquea las obstrucciones del hígado y promueve fuertemente la micción {cite:canon-ibn-sina-print-v1 pp.625-626}"
  fr: "Fuwwat al-sabbaghin est décrit dans le livre comme la racine des teinturiers, astringente au goût et modérément purifiante; on l’applique avec du vinaigre contre la teigne et le vitiligo blanc, et elle purifie la peau de toute marque. On l’administre avec l’eau de qaratin contre la sciatique et la paralysie, et son fruit avec de l’oxymel contre les gonflements de la rate. Elle débloque le foie et favorise fortement la diurèse. {cite:canon-ibn-sina-print-v1 pp.625-626}"
  tr: "'Tanenleri tadın' kitabındaki pigmentli aptallık tanenleri orta derecede temizlenir, kapaklara sirke ve beyaz vitiligo ile sürülür, cildi tüm izlerden arındırır, siyatik ve felç için keratin suyu verilir, meyvesine dalak tümörleri serpilir, karaciğer kapakçıkını açar ve idrara çıkmayı büyük ölçüde teşvik eder {cite:canon-ibn-sina-print-v1 s.625-626}"
  id: "Folly pigmen dalam buku 'Taste tanins' tanin dibersihkan secara moderat, diaplikasikan dengan cuka pada tutup dan vitiligo putih, membersihkan kulit dari semua jejak, diberi air keratin untuk skiatika dan kelumpuhan, buahnya ditaburi tumor limpa, membuka katup hati, dan sangat mendorong buang air kecil {cite:canon-ibn-sina-print-v1 hlm.625-626}"
