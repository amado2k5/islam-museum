label:
  ar: "فوة الصباغين"
  en: "Fuwwat al-sabbaghin (the dyers' root)"
  ur: "فوۃ الصباغین"
  es: "Fuwwat al-sabbaghin (la raíz de los tintoreros)"
  fr: "Fuwwat al-sabbaghin (la racine des teinturiers)"
  tr: "Ressamların ağzı"
