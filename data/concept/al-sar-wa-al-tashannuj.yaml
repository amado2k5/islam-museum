id: "concept/al-sar-wa-al-tashannuj"
class: "concept"
kind: "scientific"
label:
  ar: "علاقة الصرع بالتشنّج والإفاقة"
  en: "Epilepsy, convulsion and recovery"
  fr: "Épilepsie, convulsion et retour à soi"
  ur: "صرع، تشنج اور افاقہ"
  es: "Epilepsia, convulsiones y recuperación"
summary:
  ar: "لماذا يجري الصرع مجرى التشنّج لا مجرى الاسترخاء: لأن الدماغ يدفع المؤذي بالانقباض والانعصار لا بالانبساط؛ والإفاقة لاندفاع الخلط أو تحلّل الريح أو اندفاع المؤذي؛ وكل تشنج مادي ينتفع بالحمى {cite:canon-ibn-sina-print-v2 p.119}"
  en: "Why epilepsy runs the course of convulsion, not relaxation: the brain expels the harmful by contraction and squeezing, not by expansion; recovery comes with the expulsion of the humour, the dissolution of the wind, or the expulsion of the harmful; every material convulsion is helped by fever {cite:canon-ibn-sina-print-v2 p.119}"
  fr: "Pourquoi l’épilepsie suit le cours de la convulsion et non celui du relâchement : le cerveau expulse ce qui nuit par la contraction et la compression, non par la dilatation ; le retour à soi vient avec l’expulsion de l’humeur, la dissolution du vent ou l’expulsion de ce qui nuit ; toute convulsion matérielle tire profit de la fièvre {cite:canon-ibn-sina-print-v2 p.119}"
  ur: "صرع استرخاء کے بجائے تشنج کے راستے کیوں چلتا ہے: دماغ نقصان پہنچانے والے کو پھیلنے سے نہیں بلکہ سکڑنے اور نچوڑنے سے دفع کرتا ہے؛ افاقہ خلط کے دھکیل جانے یا ہوا کے تحلل یا مؤذی کے دھکیل جانے سے ہوتا ہے؛ اور ہر مادی تشنج کو بخار نفع دیتا ہے {cite:canon-ibn-sina-print-v2 p.119}۔"
  es: "Por qué la epilepsia sigue un curso convulsivo, no de relajación: el cerebro expulsa lo dañino mediante la contracción y la compresión, no mediante la expansión; la recuperación llega con la expulsión del humor, la disolución del gas o la expulsión de lo dañino; toda convulsión material se ve favorecida por la fiebre {cite:canon-ibn-sina-print-v2 p.119}"
