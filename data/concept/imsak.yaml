id: concept/imsak
class: concept
kind: legal
label: { ar: "الإمساك", en: "Imsak (holding, restraint and abstention in fiqh)", es: "Imsak (sostenimiento, restricción y abstención en fiqh)", fr: "Imsak (retenue, retenue et abstention en fiqh)", ur: "امساک ⁦( فقہ میں روک تھام اور پرہیز )⁩", tr: "kabızlık", id: "Konstipasi" }
summary:
  ar: "الإمساك في اللغة القبض والكف، واستعمله الفقهاء في مواضع: إمساك الصيد للصائد بالكلب المعلم، وإمساك الصائم عن المفطرات، وإمساك الممسك في القتل والقصاص، وإمساك الزوجة بالرجعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3393}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3394} ويختلف الفقهاء في الأكل من صيد الكلب المعلم إذا أكل منه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3394} ويلزم الإمساك عن المفطرات لمن أفطر ثم تبين أن اليوم من رمضان، وفي الإمساك في القصاص خلاف، وفي الرجعة بالإمساك بالشهوة خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3394}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3395}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3396}"
  en: "Imsak in the lexical sense is holding and restraining. Jurists use it in several places: the hunter's dog holding its prey; the faster's abstention from what breaks the fast; one who holds a victim while another kills in a retaliation case; and taking back a divorced wife. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3393}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3394} The jurists differ on eating from game that a trained dog has killed and then eaten from. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3394} One who broke the fast in the belief that it was a day of Sha'ban, and learns it was Ramadan, must abstain for the rest of the day; the holder in a killing and the return by intimacy are disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3394}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3395}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3396}"
  es: "Imsak en el sentido léxico es sostener y restringir. Los juristas lo usan en varios lugares: el perro del cazador que sostiene a su presa; la abstención del ayunante de lo que rompe el ayuno; quien sostiene a una víctima mientras otro mata en un caso de represalia; y volver con una esposa divorciada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3393}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3394} Los juristas difieren sobre comer de la caza que un perro entrenado ha matado y luego comido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3394} Quien rompió el ayuno creyendo que era un día de Sha'ban, y se entera de que era Ramadán, debe abstenerse por el resto del día; el sostener en un asesinato y el retorno por intimidad son disputados. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3394}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3395}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3396}"
  fr: "Le terme « imsak », au sens littéral, signifie « retenir » et « contraindre ». Les juristes l'emploient dans plusieurs contextes: le chien de chasse retenant sa proie; l'abstention du jeûneur de ce qui rompt le jeûne; celui qui retient une victime pendant qu'un autre la tue en représailles; et le retour d'une épouse divorcée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3393}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3394} Les juristes divergent quant à la consommation de gibier tué puis consommé par un chien dressé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3394} Celui qui a rompu le jeûne en croyant être un jour de Sha'ban et qui apprend ensuite qu'il s'agit du Ramadan doit s'abstenir pour le reste de la journée; le cas de la personne qui retient une victime lors d'un meurtre et celui de la restitution par intimité font l'objet de controverses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3394}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3395}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3396}"
  ur: "لغوی معنوں میں امساک کو تھامنا اور روکنا ہے۔ فقہاء اسے کئی جگہ استعمال کرتے ہیں: شکاری کتا اپنے شکار کو پکڑے ہوئے؛ روزہ دار کا روزہ ٹوٹنے والی چیزوں سے پرہیز ایک جو ایک شکار کو پکڑتا ہے جبکہ دوسرا انتقامی کارروائی میں مارتا ہے؛ اور طلاق یافتہ بیوی کو واپس لینا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3393}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3394} فقہاء کا اس کھیل کے کھانے میں اختلاف ہے جسے تربیت یافتہ کتے نے مارا اور پھر کھایا۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 3394} جس نے اس عقیدہ سے روزہ توڑ دیا کہ یہ شعبان کا دن ہے اور اسے معلوم ہو کہ یہ رمضان ہے تو اسے باقی دن پرہیز کرنا چاہیے۔ قتل میں ملوث اور قربت کے ذریعے واپسی میں اختلاف ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3394}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3395}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3396}"
  tr: "Dilde 'imsak' 'yakalama' ve 'kaf' anlamına gelir ve hukukçular bunu şu durumlarda kullanırlar: avcının eğitilmiş köpekten uzaklaştırılması, oruç tutan kişinin orucu bozmasını engellemek, öldürme ve intikam durumunda tutuklayan kişinin alıkonulması ve karısının geri dönmesini engellemek. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3393} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3394} Hukukçular, avlanan köpekten yemek yeme, eğer köpek ondan yeerse farklılık gösterir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3394} Orucu bozanlardan kaçınmak zorunludur ve o zaman bugün Ramazan olduğu anlaşılır. Misilleme konusunda bir fark vardır, ancak arzudan kaçınarak geri çekme konusunda farklılık vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3394} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3395} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3396}"
  id: "Dalam bahasa, 'imsak' berarti 'menangkap' dan 'kaf', dan para ahli hukum menggunakannya dalam kasus seperti: menahan pemburu dari anjing yang terlatih, menahan orang yang berpuasa agar tidak memutus puasa, menahan yang menahan dalam kasus pembunuhan dan pembalasan, serta menahan istri agar tidak kembali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3393} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3394} Para ahli hukum berbeda pendapat mengenai makan anjing buruan jika anjing itu memakan dari anjing buruan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3394} Wajib untuk menahan diri dari mereka yang memutus puasa dan kemudian menjadi jelas bahwa hari ini adalah Ramadan. Ada perbedaan antara pembalasan, tetapi mengenai penarikan dengan menahan diri dari keinginan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3394} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3395} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3396}"
