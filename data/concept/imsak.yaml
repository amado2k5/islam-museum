id: concept/imsak
class: concept
kind: legal
label: { ar: "الإمساك", en: "Imsak (holding, restraint and abstention in fiqh)" }
summary:
  ar: "الإمساك في اللغة القبض والكف، واستعمله الفقهاء في مواضع: إمساك الصيد للصائد بالكلب المعلم، وإمساك الصائم عن المفطرات، وإمساك الممسك في القتل والقصاص، وإمساك الزوجة بالرجعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3393}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3394} ويختلف الفقهاء في الأكل من صيد الكلب المعلم إذا أكل منه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3394} ويلزم الإمساك عن المفطرات لمن أفطر ثم تبين أن اليوم من رمضان، وفي الإمساك في القصاص خلاف، وفي الرجعة بالإمساك بالشهوة خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3394}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3395}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3396}"
  en: "Imsak in the lexical sense is holding and restraining. Jurists use it in several places: the hunter's dog holding its prey; the faster's abstention from what breaks the fast; one who holds a victim while another kills in a retaliation case; and taking back a divorced wife. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3393}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3394} The jurists differ on eating from game that a trained dog has killed and then eaten from. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3394} One who broke the fast in the belief that it was a day of Sha'ban, and learns it was Ramadan, must abstain for the rest of the day; the holder in a killing and the return by intimacy are disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3394}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3395}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3396}"
