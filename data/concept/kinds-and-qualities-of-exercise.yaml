label: { ar: "أنواع الرياضة وصفاتها عند ابن سينا", en: "The kinds and qualities of exercise in the Canon", ur: "قانون میں ورزش کی اقسام اور صفات", es: "Los tipos y cualidades del ejercicio en el Canon", fr: "Les types et les qualités de l'exercice dans le Canon" }
summary:
  ar: "يفتتح ابن سينا الفصل الثاني في أنواع الرياضة بتقسيمها إلى رياضة يدعو إليها عمل من أعمال الناس ورياضة خالصة تقصد لذاتها، ثم يذكر صفاتها من قلة وكثرة وشدة وضعف وسرعة وبطء وحثيث ومتراخ، وبين كل طرفين معتدل {cite:canon-ibn-sina-print-v1 p.222}."
  en: "Ibn Sina opens chapter 2, on the kinds of exercise, by dividing exercise into that which some human occupation calls for and pure exercise sought for its own sake, then names its qualities: little and much, strong and weak, quick and slow, brisk and lax, with a moderate between each pair of extremes {cite:canon-ibn-sina-print-v1 p.222}."
  es: "Ibn Sina abre el capítulo 2, sobre los tipos de ejercicio, dividiendo el ejercicio en aquel que requiere alguna ocupación humana y el ejercicio puro buscado por sí mismo, y luego nombra sus cualidades: poco y mucho, fuerte y débil, rápido y lento, enérgico y laxo, con un moderado entre cada par de extremos {cite:canon-ibn-sina-print-v1 p.222}."
  fr: "Ibn Sina ouvre le chapitre 2, sur les types d'exercice, en divisant l'exercice en celui qu'une occupation humaine requiert et l'exercice pur recherché pour lui-même, puis nomme ses qualités: peu et beaucoup, fort et faible, rapide et lent, vif et laxiste, avec un modéré entre chaque paire d'extrêmes {cite:canon-ibn-sina-print-v1 p.222}."
