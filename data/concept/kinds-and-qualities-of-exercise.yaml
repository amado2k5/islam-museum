label: { ar: "أنواع الرياضة وصفاتها عند ابن سينا", en: "The kinds and qualities of exercise in the Canon", ur: "قانون میں ورزش کی اقسام اور صفات", es: "Los tipos y cualidades del ejercicio en el Canon", fr: "Les types et les qualités de l'exercice dans le Canon", tr: "İbn Sina'ya göre spor türleri ve özellikleri", id: "Jenis Olahraga dan Karakteristiknya menurut Ibn Sina" }
summary:
  ar: "يفتتح ابن سينا الفصل الثاني في أنواع الرياضة بتقسيمها إلى رياضة يدعو إليها عمل من أعمال الناس ورياضة خالصة تقصد لذاتها، ثم يذكر صفاتها من قلة وكثرة وشدة وضعف وسرعة وبطء وحثيث ومتراخ، وبين كل طرفين معتدل {cite:canon-ibn-sina-print-v1 p.222}."
  en: "Ibn Sina opens chapter 2, on the kinds of exercise, by dividing exercise into that which some human occupation calls for and pure exercise sought for its own sake, then names its qualities: little and much, strong and weak, quick and slow, brisk and lax, with a moderate between each pair of extremes {cite:canon-ibn-sina-print-v1 p.222}."
  es: "Ibn Sina abre el capítulo 2, sobre los tipos de ejercicio, dividiendo el ejercicio en aquel que requiere alguna ocupación humana y el ejercicio puro buscado por sí mismo, y luego nombra sus cualidades: poco y mucho, fuerte y débil, rápido y lento, enérgico y laxo, con un moderado entre cada par de extremos {cite:canon-ibn-sina-print-v1 p.222}."
  fr: "Ibn Sina ouvre le chapitre 2, sur les types d'exercice, en divisant l'exercice en celui qu'une occupation humaine requiert et l'exercice pur recherché pour lui-même, puis nomme ses qualités: peu et beaucoup, fort et faible, rapide et lent, vif et laxiste, avec un modéré entre chaque paire d'extrêmes {cite:canon-ibn-sina-print-v1 p.222}."
  ur: "ابن سینا نے ورزش کی اقسام کے بارے میں باب 2 کو کھولا ہے، ورزش کو ان چیزوں میں تقسیم کر کے جس کو کچھ انسانی پیشے کہتے ہیں اور خالص ورزش اپنی خاطر کی جاتی ہے، پھر اس کی خصوصیات کا نام دیتے ہیں: کم اور زیادہ، مضبوط اور کمزور، تیز اور سست، تیز اور سست، ہر ایک انتہا کے درمیان اعتدال کے ساتھ۔"
  tr: "İbn Sina, spor türlerine ilişkin ikinci bölümü insan eylemleri için çağrılan sporlar ve tamamen çıkarcı sporlar olarak ikiye ayırarak açar, ardından kıtlık, bolluk, yoğunluk, zayıflık, hız, yavaşlık, çeviklik ve gevşeklik gibi özelliklerinden bahseder ve her iki taraf arasında ılımlı bir {cite:canon-ibn-sina-print-v1 s.222} belirtir."
  id: "Ibn Sina membuka bab kedua tentang jenis olahraga dengan membaginya menjadi olahraga yang membutuhkan tindakan manusia dan olahraga yang murni menguntungkan diri sendiri, lalu menyebutkan karakteristiknya seperti kelangkaan, kelimpahan, intensitas, kelemahan, kecepatan, kelambatan, kelincahan, dan kelonggaran, dan di antara masing-masing sisi terdapat {cite:canon-ibn-sina-print-v1 hlm.222}."
