summary:
  ar: "يفتتح ابن سينا الفصل الثاني في أنواع الرياضة بتقسيمها إلى رياضة يدعو إليها عمل من أعمال الناس ورياضة خالصة تقصد لذاتها، ثم يذكر صفاتها من قلة وكثرة وشدة وضعف وسرعة وبطء وحثيث ومتراخ، وبين كل طرفين معتدل {cite:canon-ibn-sina-print-v1 p.222}."
  en: "Ibn Sina opens chapter 2, on the kinds of exercise, by dividing exercise into that which some human occupation calls for and pure exercise sought for its own sake, then names its qualities: little and much, strong and weak, quick and slow, brisk and lax, with a moderate between each pair of extremes {cite:canon-ibn-sina-print-v1 p.222}."
