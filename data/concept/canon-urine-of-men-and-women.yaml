label: { ar: "بول الرجال والنساء والحبالى عند ابن سينا", en: "The urine of men, women, pregnant women and new mothers in the Canon", ur: "مردوں، عورتوں، حاملہ اور زچہ کا پیشاب قانون میں", es: "La orina de hombres, mujeres, mujeres embarazadas y madres recientes en el Canon", fr: "L'urine des hommes, des femmes, des femmes enceintes et des nouvelles mères dans le Canon", tr: "İbn Sina'ya göre erkek, kadın ve hamile kadınların idrarı", id: "Urine pria, wanita, dan wanita hamil menurut Ibn Sina" }
summary:
  ar: "يقارن ابن سينا في الفصل العاشر بين بول النساء وبول الرجال، ويصف بول الحبالى والنفساء وبول الرجل بعد الجماع. {cite:canon-ibn-sina-print-v1 p.197}."
  en: "In chapter ten Ibn Sina compares women's urine with men's and describes that of pregnant women, women after childbirth, and men after intercourse. {cite:canon-ibn-sina-print-v1 p.197}."
  es: "En el capítulo diez, Ibn Sina compara la orina de las mujeres con la de los hombres y describe la de las mujeres embarazadas, las mujeres después del parto y los hombres después de las relaciones sexuales. {cite:canon-ibn-sina-print-v1 p.197}."
  fr: "Au chapitre dix, Ibn Sina compare l'urine des femmes à celle des hommes et décrit celle des femmes enceintes, des femmes après l'accouchement et des hommes après un rapport sexuel. {cite:canon-ibn-sina-print-v1 p.197}."
  ur: "ابن سینا نے باب دس میں عورتوں کے پیشاب کا مردوں کے پیشاب سے موازنہ کیا ہے اور حاملہ عورتوں، ولادت کے بعد عورتوں اور جماع کے بعد مردوں کے پیشاب کو بیان کیا ہے۔ {حوالہ: کینن ابن سینا پرنٹ v1 صفحہ 197}۔"
  tr: "Onuncu bölümde, İbn Sina kadınların ve erkeklerin idrarını karşılaştırır; hamile kadınların, doğum sonrası kadınların ve erkeklerin cinsel ilişki sonrası idrarını anlatır. {atıf:kanon-ibn-sina-print-v1 s.197}."
  id: "Pada bab sepuluh, Ibn Sina membandingkan urin wanita dan pria, menggambarkan urine wanita hamil, wanita pasca melahirkan, dan urine pria setelah hubungan seksual. {cite:canon-ibn-sina-print-v1 hlm.197}."
