summary:
  ar: "المرعر في الكتاب هو السرو الجبلي منه صغير ومنه كبير، حبه حار في الأولى يابس في الثانية، مسخن ملطف مفش، ينفع الصدر والمعدة والنفخ، ويدفع ضرر لسع الهوام ويطرد الهوام والذباب، وفي الكتاب نقل موسوم في اختناق الرحم {cite:canon-ibn-sina-print-v1 p.609}"
  en: "Mar'ar is in the book the mountain cypress, some small and some large, its fruit hot in the first degree and dry in the second, warming, thinning and dispersing; it benefits the chest, the stomach and flatulence, wards off the harm of the stings of vermin and drives away vermin and flies, and the book gives a labelled listing on suffocation of the womb {cite:canon-ibn-sina-print-v1 p.609}"
  ur: "مرعر کتاب میں پہاڑی سرو ہے، کچھ چھوٹے اور کچھ بڑے، اس کا دانہ پہلے درجے میں گرم اور دوسرے میں خشک ہے، گرم کرنے والا، لطیف کرنے والا اور منتشر کرنے والا؛ سینے، معدے اور نفخ میں فائدہ دیتا ہے، موذی جانوروں کے ڈنک کے ضرر کو دور کرتا ہے اور موذی جانوروں اور مکھیوں کو بھگاتا ہے، اور کتاب میں رحم کے گھٹنے کے بارے میں ایک موسوم نقل ہے {cite:canon-ibn-sina-print-v1 p.609}۔"
  es: "En el libro, Mar'ar es el ciprés de montaña, algunos pequeños y otros grandes, cuyo fruto es caliente en el primer grado y seco en el segundo, calentando, adelgazando y dispersando; beneficia el pecho, el estómago y la flatulencia, protege contra las picaduras de alimañas y ahuyenta a los parásitos y las moscas, y el libro ofrece una lista etiquetada sobre la asfixia del útero {cite:canon-ibn-sina-print-v1 p.609}."
