id: concept/ratq-fiqh
class: concept
kind: legal
label:
  ar: "الرتق"
  en: "Ratq (the closure of the female passage): its effect on the marriage, on the option to annul, on cure, maintenance and division"
  ur: "رتق ⁦(فرج کی بندش)⁩"
  es: "Ratq (el cierre del paso femenino): su efecto en el matrimonio, en la opción de anulación, en la curación, la manutención y la división."
  fr: "Ratq (la fermeture du passage féminin): ses effets sur le mariage, sur la possibilité d’annulation, sur la guérison, la pension alimentaire et le partage"
  tr: "atalet"
  id: "inersia"
summary:
  ar: "الرتق في اللغة ضد الفتق، وفي اصطلاح الفقهاء انسداد محل الجماع باللحم أو غيره، والقرن والعفل ألفاظ قريبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8619} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8620} وللزوج خيار فسخ النكاح عند المالكية والشافعية والحنابلة إذا كانت زوجته رتقاء ولم يعلم بذلك عند العقد، وقال الحنفية لا خيار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8620} ويرى المالكية أنها تؤجل للتداوي إن طلبت، وأن الشافعية لا يجيزون إجبارها على الشق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8620} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8621} وتجب النفقة للرتقاء، ويجب قسم الزوج لها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8621}"
  en: "Ratq is the opposite of splitting; in the jurists' usage it is the closure of the place of intercourse by flesh or other matter, and qarn and 'afal are near terms. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8619} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8620} The Malikis, Shafi'is and Hanbalis give the husband an option to annul the marriage if he did not know of the closure at the contract; the Hanafis give none. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8620} The Malikis delay the case for treatment if the wife asks for it; the Shafi'is do not allow forcing the opening. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8620} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8621} Maintenance is due to her and the husband must divide his nights fairly. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8621}"
  ur: "رتق فرج کی بندش ہے؛ اس کی بنیاد پر شوہر کو نکاح فسخ کرنے کا اختیار بعض فقہاء کے نزدیک ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8619} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8620}"
  es: "Ratq es lo opuesto a la separación; en el uso de los juristas es el cierre del lugar de la relación sexual por carne u otra materia, y qarn y 'afal son términos cercanos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8619} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8620} Los malikíes, shafi'ís y hanbalíes dan al marido la opción de anular el matrimonio si no conocía el cierre en el contrato; los hanafíes no dan ninguna. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8620} Los malikíes retrasan el caso para el tratamiento si la esposa lo pide; los shafi'ís no permiten forzar la apertura. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8620} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8621} La manutención se le debe a ella y el marido debe dividir sus noches equitativamente. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8621}"
  fr: "Ratq est l'opposé de la séparation; dans l'usage juridique, il désigne la fermeture du lieu de rapport sexuel par la chair ou une autre substance, et qarn et 'afal sont des termes proches. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8619} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8620} Les écoles malikite, chaféite et hanbalite offrent au mari la possibilité d'annuler le mariage s'il ignorait la fermeture lors du contrat; l'école hanafite ne l'offre pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8620} Les écoles malikite suspendent la procédure pour permettre un traitement si l'épouse le demande; les écoles chaféites n'autorisent pas l'ouverture forcée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8620} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8621} L'entretien est dû à elle et le mari doit répartir équitablement ses nuits. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.8621}"
  tr: "Dilbilimde 'al-ratq' fıtıklaşmanın tam tersidir ve hukuk terminolojisinde ise et veya diğer şeylerle cinsel ilişki yerinin tıkanmasını ifade eder. 'qar' ve 'al-afl' terimleri ilişkili terimlerdir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.8619} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8620} Koca, eşi köle ise ve sözleşme sırasında bundan habersizse evliliği iptal etme seçeneğine sahiptir. Hanafiler ise seçenek olmadığını söylediler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8620} Malikiler, istenirse tedaviyi ertelediklerini ve Şafiilerin onu zorla ayrılmasına izin vermediklerini belirtir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8620} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8621} Destek yükselişi için ödenir ve koca bunu paylaşmak zorundadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8621}"
  id: "Dalam linguistik, 'al-ratq' adalah kebalikan dari herniasi, dan dalam terminologi yurisprudensi, istilah ini merujuk pada penyumbatan tempat berhubungan seks dengan daging atau benda lain. Istilah 'qar' dan 'al-afl' adalah istilah yang saling terkait. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8619} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8620} Suami memiliki opsi untuk membatalkan pernikahan menurut Maliki, Shafi'i, dan Hanbalis jika istrinya adalah budak dan dia tidak mengetahui hal ini saat kontrak dibuat. Hanafi mengatakan tidak ada pilihan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8620} Keluarga Malik berpendapat bahwa mereka menunda pengobatan jika diminta, dan Shafi'i tidak mengizinkan memaksanya untuk berpisah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8620} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8621} Biaya tunjangan harus dibayar untuk kenaikan pangkat, dan suami harus membaginya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8621}"
