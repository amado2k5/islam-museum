id: concept/ratq-fiqh
class: concept
kind: legal
label:
  ar: "الرتق"
  en: "Ratq (the closure of the female passage): its effect on the marriage, on the option to annul, on cure, maintenance and division"
  ur: "رتق (فرج کی بندش)"
summary:
  ar: "الرتق في اللغة ضد الفتق، وفي اصطلاح الفقهاء انسداد محل الجماع باللحم أو غيره، والقرن والعفل ألفاظ قريبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8619} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8620} وللزوج خيار فسخ النكاح عند المالكية والشافعية والحنابلة إذا كانت زوجته رتقاء ولم يعلم بذلك عند العقد، وقال الحنفية لا خيار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8620} ويرى المالكية أنها تؤجل للتداوي إن طلبت، وأن الشافعية لا يجيزون إجبارها على الشق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8620} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8621} وتجب النفقة للرتقاء، ويجب قسم الزوج لها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8621}"
  en: "Ratq is the opposite of splitting; in the jurists' usage it is the closure of the place of intercourse by flesh or other matter, and qarn and 'afal are near terms. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8619} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8620} The Malikis, Shafi'is and Hanbalis give the husband an option to annul the marriage if he did not know of the closure at the contract; the Hanafis give none. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8620} The Malikis delay the case for treatment if the wife asks for it; the Shafi'is do not allow forcing the opening. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8620} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8621} Maintenance is due to her and the husband must divide his nights fairly. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8621}"
  ur: "رتق فرج کی بندش ہے؛ اس کی بنیاد پر شوہر کو نکاح فسخ کرنے کا اختیار بعض فقہاء کے نزدیک ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8619} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8620}"
