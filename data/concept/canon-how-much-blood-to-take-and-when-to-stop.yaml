summary:
  ar: "يبين ابن سينا أن لحبس الدم وقتاً محدوداً وإن اختلف، وأن الناس يختلفون في احتمال مقدار الدم، ويذكر ما يراعى من لون الدم والنبض، وما ينذر بالغشي، ومن أسرع إليه ومن أبطأ {cite:canon-ibn-sina-print-v1 p.296}."
  en: "Ibn Sina explains that the stopping of the blood has a set time though it differs, that people differ in how much blood they bear, and gives what is watched, the colour of the blood and the pulse, what warns of faintness, and who is quick to it and who slow {cite:canon-ibn-sina-print-v1 p.296}."
