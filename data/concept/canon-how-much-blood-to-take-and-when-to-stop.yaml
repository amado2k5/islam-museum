label:
  ar: "مقدار الدم المأخوذ ومتى يحبس عند ابن سينا"
  en: "How much blood to take and when to stop in the Canon"
  fr: "Quantité de sang et arrêt de la saignée dans le Canon"
  ur: "قانون میں کتنا خون لیا جائے اور کب روکا جائے"
  es: "Cuánto de sangre extraer y cuándo detenerse en el Canon"
summary:
  ar: "يبين ابن سينا أن لحبس الدم وقتاً محدوداً وإن اختلف، وأن الناس يختلفون في احتمال مقدار الدم، ويذكر ما يراعى من لون الدم والنبض، وما ينذر بالغشي، ومن أسرع إليه ومن أبطأ {cite:canon-ibn-sina-print-v1 p.296}."
  en: "Ibn Sina explains that the stopping of the blood has a set time though it differs, that people differ in how much blood they bear, and gives what is watched, the colour of the blood and the pulse, what warns of faintness, and who is quick to it and who slow {cite:canon-ibn-sina-print-v1 p.296}."
  fr: "Ibn Sina décrit un moment d’arrêt déterminé mais variable, les tolérances individuelles, couleur sanguine et pouls à observer, avertissements de syncope et sujets plus ou moins prompts à défaillir {cite:canon-ibn-sina-print-v1 p.296}."
  es: "Ibn Sina explica que la detención de la sangre tiene un tiempo determinado, aunque este varía, que las personas difieren en la cantidad de sangre que soportan, y da lo que se observa, el color de la sangre y el pulso, lo que advierte de un desmayo, y quién es rápido en detectarlo y quién lento {cite:canon-ibn-sina-print-v1 p.296}."
