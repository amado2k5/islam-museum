id: "concept/al-awram-fi-asl-al-udhun"
class: "concept"
kind: "scientific"
label:
  ar: "الأورام التي تحدث في أصل الأذن"
  en: "The swellings arising at the ear's root (parotis)"
  fr: "Les tuméfactions à la base de l’oreille (parotis)"
  ur: "کان کی جڑ میں ہونے والے ورم"
  es: "Las inflamaciones que aparecen en la raíz de la oreja (parotis)."
summary:
  ar: "الأورام التي تحدث في أصل الأذن من جنس الأورام الحادثة في اللحوم الرخوة وخاصة اللحوم الغددي، وتسمى باريطوس وتسمى نبات الأذن، وربما بلغ من شدة ما يؤلم أن يقتل وقد يتقدمه اختلاط العقل، وهو والورم الكائن في الصماخ أقتل للشبان منه للمشايخ؛ وأسلمها ما كان على سبيل بحران حسن العلامات، وإن كان عن بحران ليس معه علامة نضج أو كان سابقاً لوقت البحران فهو رديء؛ وتكون عن مادة حارة صفراوية أو دموية أو عن سوداء أو من بلغم {cite:canon-ibn-sina-print-v2 p.232}"
  en: "The swellings arising at the ear's root are of the kind occurring in soft fleshes, especially the glandular; called parotis and the ear's growth. The pain may grow so severe it kills, and confusion of mind often precedes; it and the meatus swelling kill the young more than the old. The safest is one that comes as a crisis with good signs; a crisis without a ripening sign, or before its time, is bad. They arise from a hot bilious or sanguine matter, or from a melancholic or phlegmy one {cite:canon-ibn-sina-print-v2 p.232}"
  fr: "Les tuméfactions à la base de l’oreille surviennent dans les chairs molles, en particulier glandulaires. On les appelle parotis ou excroissances de l’oreille. Selon Ibn Sina, la douleur peut être si vive qu’elle entraîne la mort, et des troubles de l’esprit la précèdent souvent. Ces tuméfactions, comme celles du conduit auditif, tuent plus de jeunes que de personnes âgées. Les moins dangereuses surviennent lors d’une crise qui présente des signes favorables. Une crise sans signe de maturation ou qui survient avant son terme est de mauvais augure. Elles proviennent d’une matière chaude, bilieuse ou sanguine, ou d’une matière mélancolique ou flegmatique {cite:canon-ibn-sina-print-v2 p.232}"
  ur: "کان کی جڑ میں ہونے والے ورم نرم گوشتوں — خصوصاً غدودی گوشتوں — کے ورموں کی جنس سے ہیں؛ انہیں باریطوس اور کان کا نبات کہا جاتا ہے؛ درد کبھی اتنا بڑھ جاتا ہے کہ مار دیتا ہے اور اس سے پہلے اکثر ذہن کا اختلاط آتا ہے؛ یہ اور صماخ میں ہونے والا ورم جوانوں کو بوڑھوں سے زیادہ مارتے ہیں؛ ان میں محفوظ ترین وہ ہے جو بحران کے طور پر نیک علامتوں کے ساتھ ہو؛ اور اگر بحران سے ہو مگر نضج کی علامت نہ ہو یا وقت سے پہلے ہو تو برا ہے؛ اور یہ گرم صفراوی یا دمی مادے سے ہوتے ہیں یا سوداوی یا بلغمی {cite:canon-ibn-sina-print-v2 p.232}"
  es: "Las inflamaciones que aparecen en la raíz del oído son del tipo que se produce en los tejidos blandos, especialmente en la glándula; se denominan parótida y acúfenos. El dolor puede llegar a ser tan intenso que provoca la muerte, y a menudo precede a la confusión mental; tanto esta como la inflamación del meato son más mortales en jóvenes que en ancianos. Lo más seguro es cuando se presenta como una crisis con buenos síntomas; una crisis sin signos de maduración, o antes de tiempo, es de mal pronóstico. Se originan a partir de una sustancia biliar o sanguínea caliente, o de una sustancia melancólica o flemática {cite:canon-ibn-sina-print-v2 p.232}"
