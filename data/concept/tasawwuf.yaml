id: concept/tasawwuf
class: concept
kind: discipline
label:
  ar: التصوف
  en: Tasawwuf
summary:
  ar: "تعرّف دائرة المعارف الإسلامية في طبعتها الثانية التصوف بأنه ظاهرة الصوفية داخل الإسلام، وتردّ الكلمة إلى الصوف، لباس النسّاك الخشن. وتنسب نشأته إلى صحابة طلبوا مع الأحكام الظاهرة عمق النفس، وتذكر الذكر والمكاشفات والطرق والأولياء وقدوة النبي، وعمل الغزالي وابن عربي. وتسجّل اعتراض ابن تيمية على جوانب عدّها تجاوزات."
  en: "The Encyclopaedia of Islam, second edition, defines Tasawwuf as the phenomenon of mysticism within Islam, naming wool (suf), the rough garb of ascetics, as the root of the word. It traces the movement to Companions who sought inner depth alongside outward observance, and describes the roles of dhikr, visions, the orders, saints and the Prophet as model, with the work of al-Ghazali and Ibn al-Arabi. It records Ibn Taymiyya's opposition to aspects it calls abuses."
  ur: "اسلامی دائرۃ المعارف کے دوسرے ایڈیشن میں تصوف اسلام کے اندر صوفیانہ مظہر ہے، اور لفظ کی اصل صوف، یعنی زاہدوں کا کھردرا لباس، بتائی گئی ہے۔ مقالہ اس کی ابتدا ان صحابہ سے جوڑتا ہے جو ظاہری عمل کے ساتھ باطنی گہرائی چاہتے تھے، اور ذکر، رویاؤں، سلسلوں، اولیا اور نبی کے نمونہ ہونے اور غزالی اور ابن عربی کے کام کا ذکر کرتا ہے۔ وہ ابن تیمیہ کی ان پہلوؤں پر مخالفت درج کرتا ہے جنہیں وہ زیادتی کہتے تھے."
