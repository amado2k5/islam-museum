label: { ar: "الإخبات", en: "Humble tranquillity (ikhbat)", ur: "اخبات" }
summary:
  ar: "المنزلة السابعة عشرة من منازل السالكين في مدارج السالكين لابن قيم الجوزية، مأخوذة من «وبشر المخبتين»؛ تدور أقوال المفسرين فيها على التواضع والسكون إلى الله، ويجعلها الهروي أول مقامات الطمأنينة وورود المأمن من الرجوع والتردد، ويشرح ابن القيم درجاتها الثلاث وصولاً إلى استواء المدح والذم ودوام لوم النفس."
  en: "The seventeenth of the wayfarers' stations in Ibn Qayyim al-Jawziyya's Madarij al-Salikin, taken from 'give good tidings to the mukhbitin'. The exegetes' readings turn on humility and resting in God; al-Harawi makes it the first of the stations of tranquillity, the arrival at safety from turning back and wavering; Ibn al-Qayyim explains its three degrees, culminating in praise and blame becoming equal and constant self-reproach."
  ur: "ابن قیم الجوزیہ کی مدارج السالکین میں سالکین کی سترہویں منزل، جو «اور عاجزی کرنے والوں (مُخبتین) کو خوش خبری دو» سے ماخوذ ہے۔ مفسرین کے اقوال تواضع اور اللہ پر سکون کے گرد گھومتے ہیں؛ ہروی اسے اطمینان کے مقامات میں پہلا، اور واپسی اور تردد سے امن کی جگہ پر پہنچنا قرار دیتے ہیں؛ ابن القیم اس کے تین درجوں کی شرح کرتے ہیں جن کا انتہا تعریف و مذمت کا برابر ہو جانا اور نفس کو مسلسل ملامت ہے۔"
