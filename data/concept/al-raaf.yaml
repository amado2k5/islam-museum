label:
  ar: الرعاف
  en: Nosebleed
  ur: نکسیر
summary:
  ar: الرعاف قد يكون قطرات وقد يكون هائجاً لحقن شديد بسبب غلبة من الدم العالي بقوة، وربما كان الانفجار عن شبكة عروق الدماغ وشرايينه وهو غير قابل في الأكثر للعلاج، وأكثره يكون عقيب صداع والتهاب ومرض لا محالة وربما كان لبخارات حارة متصعدة؛ والكائن عن الشرايين يتميز عن الكائن عن الأوردة برقته وحمرته وحرارته، وسيلانه ينفع ويضر، وهو بحران كثير في الأمراض الحادة كالجدري والحصبة، وإن أسرف فأعقب صفرة أو رصاصية أو كمودة مع اسوداد وذبول وبرد أطراف فعاقبته محذورة وإن احتبس {cite:canon-ibn-sina-print-v2 p.236} {cite:canon-ibn-sina-print-v2 p.237}
  en: Nosebleed may come as drops or as a violent torrent from a strong domination of high blood; sometimes it bursts from the network of the brain's vessels and arteries and is mostly untreatable. It most often follows headache, inflammation and illness, and may arise from hot rising vapours. The arterial kind is told from the venous by its thinness, redness and heat. Its flow both benefits and harms, and it is a frequent crisis in many acute diseases like smallpox and measles; if it runs to excess and is followed by an unaccustomed yellowness, leadenness or duskiness with blackness, exceeding wasting and cold extremities, its outcome is to be feared even if it stops {cite:canon-ibn-sina-print-v2 p.236} {cite:canon-ibn-sina-print-v2 p.237}
  ur: نکسیر کبھی قطرہ قطرہ ہوتی ہے اور کبھی بلند خون کے غلبے سے شدید سیل کی صورت؛ کبھی دماغ کی شریانوں اور عروق کے جال کے پھٹنے سے ہوتی ہے جو اکثر علاج قبول نہیں کرتی؛ زیادہ تر سر درد، سوجن اور بیماری کے بعد آتی ہے اور کبھی گرم اٹھتے بخاروں سے؛ شریانی نکسیر نسوں والی سے باریکی، سرخی اور گرمی سے پہچانی جاتی ہے؛ اس کا بہنا نفع بھی دیتا ہے اور نقصان بھی؛ اور یہ جدری اور خسرہ جیسے کئی شدید امراض میں بحران کا کام کرتی ہے؛ اگر حد سے بڑھ جائے اور پھر غیر معمولی زردی، سیسہ پن یا سیاہی مایل رنگ، دبلاپن اور ہاتھ پاؤں کی ٹھنڈک آئے تو انجام کا خدشہ ہے خواہ بند بھی ہو جائے {cite:canon-ibn-sina-print-v2 p.236} {cite:canon-ibn-sina-print-v2 p.237}
