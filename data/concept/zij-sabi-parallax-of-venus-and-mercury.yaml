id: concept/zij-sabi-parallax-of-venus-and-mercury
class: concept
kind: scientific
label: { ar: "اختلاف المنظر في الزهرة وعطارد", en: "The parallax of Venus and Mercury", ur: "زہرہ اور عطارد کا اختلافِ منظر", es: "La paralaje de Venus y Mercurio" }
summary:
  ar: "يذكر البتاني أن اختلاف المنظر محسوس أيضاً في الزهرة وعطارد، غير أنه في عطارد أكثر لقربه من القمر، ولا سيما إذا كان في بُعده الأقرب، فيكون اختلاف منظره حينئذ مثل اختلاف منظر القمر في بُعده الأبعد. {cite:zij-sabi-nallino-byblion p.116}."
  en: "Al-Battani says the parallax is perceptible also in Venus and Mercury, but it is greater in Mercury because it is nearer the Moon, especially when Mercury is at its nearest point, where its parallax equals the Moon's parallax at the Moon's farthest point. {cite:zij-sabi-nallino-byblion p.116}."
  ur: "البتانی کہتے ہیں کہ زہرہ اور عطارد میں بھی اختلافِ منظر محسوس ہے، مگر عطارد میں یہ زیادہ ہے کیونکہ وہ چاند کے قریب ہے، خصوصاً جب وہ اپنے قریب ترین فاصلے پر ہو، تو اس وقت اس کا اختلافِ منظر چاند کے دور ترین فاصلے کے اختلافِ منظر جیسا ہوتا ہے۔ {cite:zij-sabi-nallino-byblion p.116}۔"
  es: "Al-Battani afirma que la paralaje también es perceptible en Venus y Mercurio, pero es mayor en Mercurio porque está más cerca de la Luna, especialmente cuando Mercurio se encuentra en su punto más cercano, donde su paralaje es igual al de la Luna en su punto más lejano. {cite:zij-sabi-nallino-byblion p.116}."
