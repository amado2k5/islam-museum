summary:
  ar: "عاليون في الكتاب نبات له ورق وقضبان كالحرينان وزهر أبيض مائل إلى صفرة طيب الرائحة، يسمى لأنه يجمد اللبن كالأنفحة، ينفع زهره من انفجار الدم ومن حرق النار، ويهيج أصله شهوة الجماع في نقل الكتاب {cite:canon-ibn-sina-print-v1 p.621}"
  en: "Aliyun is in the book a plant with a leaf and rods like the harinan and a white flower inclined to yellow, sweet-scented, named because it curdles milk like rennet; its flower benefits an outburst of blood and burns by fire, and its root, in the book's report, stirs desire {cite:canon-ibn-sina-print-v1 p.621}"
  ur: "عالیون کتاب میں ایک پودا ہے جس کے پتے اور شاخیں حرینان جیسی اور پھول سفیدی مائل زرد خوشبودار ہے، اسے اس نام سے اس لیے پکارتے ہیں کہ دودھ کو رینٹ کی طرح جماتا ہے؛ اس کا پھول خون کے پھوٹنے اور آگ سے جلنے میں نافع ہے، اور کتاب کے بیان کے مطابق اس کی جڑ باہ کو ابھارتی ہے {cite:canon-ibn-sina-print-v1 p.621}۔"
