  ar: "السقنقور في الكتاب ورل نيلي يصاد بمصر ويزعمون أنه من نتاج التمساح في البر، أجود ما فيه ناحية كلاه، وللكتاب فيه نقل موسوم في الباه {cite:canon-ibn-sina-print-v1 p.600}."
