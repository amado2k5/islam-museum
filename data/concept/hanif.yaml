label:
  ar: الحنيف ⁦(وصف إبراهيم)⁩
  en: Hanif (the description of Abraham)
  es: "Hanif (la descripción de Abraham)"
  fr: "Hanif (la description d'Abraham)"
  ur: "حنیف ⁦(ابراہیم کی تفصیل)⁩"
summary:
  ar: "يرى الشعراوي أن أصل كلمة الحنيف الميل في الساقين من أسفل، ثم نُقل الحنف إلى كل أمر غير مستقيم، فيكون الحنيف مَن مال عن الاعوجاج الذي كان عليه أهل زمانه. ويقرر أن إبراهيم كان على الاستقامة، لكنه جاء في عالم تسوده الوثنية والاعوجاج، فكان حنيفاً بالخروج عنه، وأن الرسل لا يأتون إلا على فساد عقدي وتشريعي طاغٍ {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1525}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1526}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1527}."
  en: "Sha'rawi holds that the root of hanif is a bend in the lower legs, and that the sense was then carried over to anything crooked. A hanif is therefore one who turns away from the crookedness of his people. He affirms that Abraham was upright, but came into a world of idolatry and crookedness, and was a hanif by turning away from it. He adds that prophets come only where there is a deep corruption of belief and law {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1525}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1526}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1527}."
  es: "Sha'rawi sostiene que la raíz de hanif es una curvatura en la parte inferior de las piernas, y que el significado se extendió a todo lo torcido. Un hanif es, por lo tanto, aquel que se aparta de la perversidad de su pueblo. Afirma que Abraham era recto, pero llegó a un mundo de idolatría y perversidad, y fue un hanif al apartarse de él. Añade que los profetas solo aparecen donde hay una profunda corrupción de la creencia y la ley {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1525}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1526}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1527}."
  fr: "Sha'rawi soutient que le terme « hanif » tire son origine d'une courbure des jambes, et que ce sens s'est ensuite étendu à tout ce qui est tordu. Un « hanif » est donc celui qui se détourne de la perversité de son peuple. Il affirme qu'Abraham était droit, mais qu'il est entré dans un monde d'idolâtrie et de perversité, et qu'il est devenu un « hanif » en s'en détournant. Il ajoute que les prophètes ne viennent que là où règne une profonde corruption des croyances et de la loi."
  ur: "شعراوی کا خیال ہے کہ حنیف کی جڑ نچلی ٹانگوں میں ایک موڑ ہے، اور یہ کہ حس پھر کسی بھی ٹیڑھی چیز تک پہنچ گئی۔ اس لیے حنیف وہ ہے جو اپنی قوم کی کجی سے منہ موڑ لے۔ وہ تصدیق کرتا ہے کہ ابراہیم راستباز تھا لیکن بت پرستی اور کجی کی دنیا میں آیا اور اس سے منہ موڑ کر حنیف تھا۔ انہوں نے مزید کہا کہ انبیاء صرف اس وقت آتے ہیں جہاں عقیدہ اور قانون کی گہرائی میں خرابی ہوتی ہو"
