issue:
  ar: "ما معنى وصف إبراهيم بالحنيف، والحنف في أصله ميل وعوج، وهو مستقيم؟"
  en: "How can Abraham be called a hanif when the root sense of the word is a bend?"
perspectives:
- tradition: sunni
  id: sunni-sharawi-turning-from-crookedness
  stance:
    ar: "الحنيف مَن مال عن الاعوجاج السائد إلى الاستقامة"
    en: "A hanif is one who turns away from the prevailing crookedness toward uprightness"
  summary:
    ar: "يرى الشعراوي أن إبراهيم كان على الاستقامة في نفسه، وأن وصفه بالحنيف يعني مَيلَه عن اعوجاج زمانه، ويقول إن الآية التي تنفي أن يكون إبراهيم يهودياً أو نصرانياً تبرئه من الديانتين لأنهما جاءتا بعده {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1525}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1526}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1527}."
    en: "Sha'rawi holds that Abraham was upright in himself, and that calling him hanif means he turned away from the crookedness of his time. He says the verse that Abraham was neither Jew nor Christian clears him of both religions, since both came after him {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1525}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1526}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1527}."
