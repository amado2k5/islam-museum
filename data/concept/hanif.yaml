label:
  ar: الحنيف (وصف إبراهيم)
  en: Hanif (the description of Abraham)
summary:
  ar: "يرى الشعراوي أن أصل كلمة الحنيف الميل في الساقين من أسفل، ثم نُقل الحنف إلى كل أمر غير مستقيم، فيكون الحنيف مَن مال عن الاعوجاج الذي كان عليه أهل زمانه. ويقرر أن إبراهيم كان على الاستقامة، لكنه جاء في عالم تسوده الوثنية والاعوجاج، فكان حنيفاً بالخروج عنه، وأن الرسل لا يأتون إلا على فساد عقدي وتشريعي طاغٍ {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1525}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1526}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1527}."
  en: "Sha'rawi holds that the root of hanif is a bend in the lower legs, and that the sense was then carried over to anything crooked. A hanif is therefore one who turns away from the crookedness of his people. He affirms that Abraham was upright, but came into a world of idolatry and crookedness, and was a hanif by turning away from it. He adds that prophets come only where there is a deep corruption of belief and law {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1525}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1526}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1527}."
