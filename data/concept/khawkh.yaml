summary:
  ar: "خوخ في الكتاب بارد في آخر الثانية رطب في الأولى دون آخرها، رطوبته سريعة العفونة، مليّن فيه قبض ما وأقبضه المقدد، والفج قابض؛ يقطع ورقه رائحة النورة إذا طلي به، ويقطر ماء ورقه في الأذن فيقتل الديدان، ودهنه ينفع من الشقيقة وأوجاع الأذن، والنضيج جيد للمعدة فيه تشهية للطعام ويلين البطن، والفج عاقل، وورقه يضمد به السرة فيقتل ديدان البطن؛ وفيه نقل موسوم عن الباه في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v1 p.713}"
  en: "Khawkh is in the book cold at the end of the second degree and moist in the first short of its end, its moisture quick to putrefy, softening with some astringency, the dried the most astringent and the unripe astringent; its leaf removes the smell of lime when applied, the water of its leaf dropped in the ear kills worms, its oil benefits migraine and pains of the ear, the ripe is good for the stomach, whets appetite and loosens the belly, the unripe binds, and its leaf is put as a poultice on the navel to kill the worms of the belly; with a labelled listing on desire in a section held for the founder's ruling {cite:canon-ibn-sina-print-v1 p.713}"
  ur: "خوخ کتاب میں دوسرے درجے کے آخر میں ٹھنڈا اور پہلے درجے میں تر ہے مگر اس کے آخر تک نہیں، اس کی تری جلد سڑ جاتی ہے، نرم کرنے والا ہے اور کچھ قبض بھی ہے، سب سے زیادہ قابض خشک کیا ہوا ہے، اور کچا قابض ہے؛ اس کا پتا لگایا جائے تو چونے کی بو دور کرتا ہے، اس کے پتے کا پانی کان میں ٹپکایا جائے تو کیڑوں کو مار دیتا ہے، اس کا تیل آدھے سر کے درد اور کان کے دردوں میں نافع ہے، پکا ہوا معدے کے لیے اچھا ہے اور کھانے کی اشتہا دیتا ہے اور پیٹ کو نرم کرتا ہے، کچا روکتا ہے، اور اس کے پتے سے ناف پر ضماد کیا جاتا ہے تو پیٹ کے کیڑوں کو مارتا ہے؛ باہ کے بارے میں ایک موسوم نقل بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v1 p.713}۔"
  es: "En el libro, Khawkh es frío al final del segundo grado y húmedo al principio de su final, su humedad se pudre rápidamente, ablandándose con cierta astringencia, el seco es el más astringente y el inmaduro también; su hoja elimina el olor a lima cuando se aplica, el agua de su hoja aplicada en el oído mata los gusanos, su aceite beneficia la migraña y los dolores de oído, el maduro es bueno para el estómago, abre el apetito y afloja el vientre, el inmaduro aprieta, y su hoja se coloca como cataplasma en el ombligo para matar los gusanos del vientre; con una lista etiquetada sobre el deseo en una sección reservada para el dictamen del fundador {cite:canon-ibn-sina-print-v1 p.713}"
  fr: "Le khawkh est décrit dans le livre comme froid à la fin du deuxième degré et humide au premier degré, son humidité se putréfiant rapidement, s'adoucissant avec une certaine astringence; le khawkh séché est le plus astringent et le khawkh non mûr est également astringent; sa feuille élimine l'odeur de chaux lorsqu'elle est appliquée; l'eau de sa feuille versée dans l'oreille tue les vers; son huile est bénéfique pour les migraines et les douleurs de l'oreille; le khawkh mûr est bon pour l'estomac, stimule l'appétit et détend l'estomac; le khawkh non mûr constipe; et sa feuille est appliquée en cataplasme sur le nombril pour tuer les vers intestinaux; avec une liste légendée sur le désir dans une section réservée à la décision du fondateur {cite:canon-ibn-sina-print-v1 p.713}"
