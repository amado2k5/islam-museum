id: concept/order-of-foods-within-a-meal
class: concept
kind: scientific
label: { ar: "ترتيب الأغذية في الوجبة", en: "The order of foods within a meal", ur: "ایک کھانے میں غذاؤں کی ترتیب", es: "El orden de los alimentos dentro de una comida.", fr: "L'ordre des aliments dans un repas" }
summary:
  ar: "يقول ابن سينا إن للأغذية في استعمالها ترتيباً يراعيه حافظ الصحة، فلا يتناول الرقيق السريع الهضم على غذاء قوي أصلب منه فينهضم قبله ويفسد، ويتناول بعد الطعام المزلق طعاماً قوياً صلباً ينزلق معه، ولا يتناول السمك عقيب رياضة متعبة، وبعض أصحاب المعدة الرخوة ينتفعون بقابض قبل الطعام {cite:canon-ibn-sina-print-v1 p.230}."
  en: "Ibn Sina says foods have an order of use that the guardian of health should heed: a thin, quickly digested food must not follow a stronger, harder one, which it would outrun and spoil; after a slippery food a firm one follows to carry it; fish is not eaten after tiring exercise; and some with slack stomachs benefit from something astringent before the meal {cite:canon-ibn-sina-print-v1 p.230}."
  es: "Ibn Sina dice que los alimentos tienen un orden de uso que el guardián de la salud debe respetar: un alimento ligero y de rápida digestión no debe seguir a uno más fuerte y duro, ya que lo superaría y lo estropearía; después de un alimento resbaladizo, sigue uno firme para transportarlo; no se come pescado después de un ejercicio agotador; y algunas personas con estómagos blandos se benefician de algo astringente antes de la comida {cite:canon-ibn-sina-print-v1 p.230}."
  fr: "Ibn Sina dit que les aliments ont un ordre d'utilisation que le gardien de la santé doit respecter: un aliment léger et rapidement digéré ne doit pas suivre un aliment plus fort et plus dur, qu'il surpasserait et gâcherait; après un aliment glissant, un aliment ferme suit pour le transporter; le poisson n'est pas consommé après un exercice fatigant; et certaines personnes à l'estomac mou bénéficient de quelque chose d'astringent avant le repas {cite:canon-ibn-sina-print-v1 p.230}."
