id: concept/order-of-foods-within-a-meal
class: concept
kind: scientific
label: { ar: "ترتيب الأغذية في الوجبة", en: "The order of foods within a meal", ur: "ایک کھانے میں غذاؤں کی ترتیب" }
summary:
  ar: "يقول ابن سينا إن للأغذية في استعمالها ترتيباً يراعيه حافظ الصحة، فلا يتناول الرقيق السريع الهضم على غذاء قوي أصلب منه فينهضم قبله ويفسد، ويتناول بعد الطعام المزلق طعاماً قوياً صلباً ينزلق معه، ولا يتناول السمك عقيب رياضة متعبة، وبعض أصحاب المعدة الرخوة ينتفعون بقابض قبل الطعام {cite:canon-ibn-sina-print-v1 p.230}."
  en: "Ibn Sina says foods have an order of use that the guardian of health should heed: a thin, quickly digested food must not follow a stronger, harder one, which it would outrun and spoil; after a slippery food a firm one follows to carry it; fish is not eaten after tiring exercise; and some with slack stomachs benefit from something astringent before the meal {cite:canon-ibn-sina-print-v1 p.230}."
