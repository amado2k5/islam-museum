id: concept/tashbik-interlacing-fingers
class: concept
kind: legal
label:
  ar: "التشبيك"
  en: "Tashbik (interlacing the fingers)"
  ur: "تشبیک ⁦(انگلیوں کو آپس میں ڈالنا)⁩"
  es: "Tashbik (entrelazando los dedos)"
  fr: "Tashbik (entrelacement des doigts)"
  tr: "Ağ Oluşturma"
  id: "Jaringan"
summary:
  ar: "التشبيك إدخال أصابع اليد في أصابع الأخرى. أجمع الفقهاء على كراهته في الصلاة، وكرهه الحنفية والشافعية والحنابلة في المسجد لمن ينتظر الصلاة لأنه في حكم الصلاة، ولا يكره بعد الفراغ عند الجمهور، ولا يكره عند المالكية إلا في الصلاة. ويكره في خطبة الجمعة عند غير المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5179} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5180} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5181} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5182}"
  en: "Tashbik is putting the fingers of one hand between those of the other. The jurists agree it is disliked in prayer. Hanafis, Shafiis and Hanbalis dislike it in the mosque while waiting for prayer, since waiting counts as prayer; after the prayer the majority do not dislike it, even in the mosque, citing the hadith of Dhu al-Yadayn. Malikis dislike it only during prayer, and the others dislike it during the Friday sermon. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5179} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5180} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5181} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5182}"
  es: "Tashbik consiste en colocar los dedos de una mano entre los de la otra. Los juristas coinciden en que es desaconsejable durante la oración. Los hanafíes, shafiíes y hanbalíes lo desaconsejan en la mezquita mientras se espera la oración, ya que la espera cuenta como oración; después de la oración, la mayoría no lo desaconseja, ni siquiera en la mezquita, citando el hadiz de Dhu al-Yadayn. Los malikíes lo desaconsejan solo durante la oración, y los demás lo desaconsejan durante el sermón del viernes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5179} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5180} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5181} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5182}"
  fr: "Le tashbik consiste à placer les doigts d'une main entre ceux de l'autre. Les juristes s'accordent à dire que ce geste est déconseillé pendant la prière. Les hanafites, les chaféites et les hanbalites le désapprouvent à la mosquée pendant l'attente de la prière, car l'attente compte comme une prière; après la prière, la majorité ne le désapprouve pas, même à la mosquée, se référant au hadith de Dhu al-Yadayn. Les malikites le désapprouvent uniquement pendant la prière, et les autres le désapprouvent pendant le sermon du vendredi."
  ur: "تشبیق ایک ہاتھ کی انگلیوں کو دوسرے ہاتھ کے درمیان رکھنا ہے۔ فقہاء کا اتفاق ہے کہ نماز میں اسے ناپسند ہے۔ حنفیہ، شافعی اور حنبلی مسجد میں نماز کے انتظار میں اسے ناپسند کرتے ہیں، کیونکہ انتظار نماز میں شمار ہوتا ہے۔ نماز کے بعد جمہور اسے ناپسند نہیں کرتے حتیٰ کہ مسجد میں بھی ذی الیدین کی حدیث کا حوالہ دیتے ہیں۔ مالکی اسے صرف نماز کے دوران ناپسند کرتے ہیں، اور دوسرے جمعہ کے خطبہ میں اسے ناپسند کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5179} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5180} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5181} صفحہ 5182}"
  tr: "Birbirine geçme, bir elin parmaklarını diğer elin parmaklarına sokmaktır. Hukukçular oybirliğiyle namaz sırasında hoşlanmazdı, Hanefiler, Şafiiler ve Hanbaliler ise camide namaz bekleyenler için bunu sevmez çünkü namaz olarak kabul edilir. Çoğunluğa göre tamamlandıktan sonra sevilmez ve Malikiler tarafından sadece namaz sırasında sevilmez. Cuma vaazında Maliki olmayanlara göre sevilmez. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.5179} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5180} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5181} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5182}"
  id: "Interlocking adalah memasukkan jari satu tangan ke jari tangan lainnya. Para ahli hukum secara bulat tidak menyukainya saat shalat, dan Hanafi, Shafi'i, dan Hanbal tidak menyukainya di masjid bagi mereka yang menunggu shalat karena dianggap sebagai shalat. Itu tidak dibenci setelah selesai menurut mayoritas, dan tidak dibenci oleh Maliki kecuali saat shalat. Ini tidak disukai dalam khotbah Jumat menurut non-Maliki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5179} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.5182} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5181} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5182}"
