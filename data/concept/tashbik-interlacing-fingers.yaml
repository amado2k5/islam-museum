label:
  ar: "التشبيك"
  en: "Tashbik (interlacing the fingers)"
  ur: "تشبیک (انگلیوں کو آپس میں ڈالنا)"
summary:
  ar: "التشبيك إدخال أصابع اليد في أصابع الأخرى. أجمع الفقهاء على كراهته في الصلاة، وكرهه الحنفية والشافعية والحنابلة في المسجد لمن ينتظر الصلاة لأنه في حكم الصلاة، ولا يكره بعد الفراغ عند الجمهور، ولا يكره عند المالكية إلا في الصلاة. ويكره في خطبة الجمعة عند غير المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5179} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5180} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5181} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5182}"
  en: "Tashbik is putting the fingers of one hand between those of the other. The jurists agree it is disliked in prayer. Hanafis, Shafiis and Hanbalis dislike it in the mosque while waiting for prayer, since waiting counts as prayer; after the prayer the majority do not dislike it, even in the mosque, citing the hadith of Dhu al-Yadayn. Malikis dislike it only during prayer, and the others dislike it during the Friday sermon. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5179} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5180} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5181} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5182}"
