summary:
  ar: "قشر هندي قابض جداً، جيد لنفث الدم ولذات الجنب، وينفع من قروح الأمعاء. {cite:canon-ibn-sina-print-v1 p.446}"
  en: "A very astringent Indian bark, good for coughing up blood and pleurisy, and it helps ulcers of the intestines. {cite:canon-ibn-sina-print-v1 p.446}"
  ur: "یہ ایک ہندی چھال ہے جو بہت قابض ہے؛ خون تھوکنے اور ذات الجنب کے لیے مفید ہے اور آنتوں کے زخموں میں کام آتی ہے۔ {cite:canon-ibn-sina-print-v1 p.446}"
  es: "Una corteza india muy astringente, buena para expectorar sangre y para la pleuresía, y ayuda con las úlceras intestinales. {cite:canon-ibn-sina-print-v1 p.446}"
  fr: "Une écorce indienne très astringente, efficace contre la toux sanglante et la pleurésie, et qui soulage les ulcères intestinaux. {cite:canon-ibn-sina-print-v1 p.446}"
  tr: "Hint peelingi çok büzücüdür, kan pompalaması ve plevrit için iyidir ve bağırsak ülserleri için faydalıdır. {cite:canon-ibn-sina-print-v1 s.446}"
  id: "Indian peel sangat astringen, baik untuk memompa darah dan pleuritis, serta bermanfaat untuk tukak lambung usus. {cite:canon-ibn-sina-print-v1 hlm.446}"
