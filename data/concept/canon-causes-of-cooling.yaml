summary:
  ar: "في الفصل الثاني من الجملة الثانية يعدد ابن سينا المبردات، وهي الحركة المفرطة والسكون المفرط وكثرة الغذاء وقلته المفرطتان والغذاء والدواء البارد وإفراط الاحتباس والاستفراغ والانفعالات المفرطة وغيرها، ثم تحصر في ستة أجناس {cite:canon-ibn-sina-print-v1 p.144}."
  en: "In the second chapter of the second part Ibn Sina lists the cooling agents: excessive motion and excessive rest, excess and extreme scarcity of food, cold food and drug, excess of retention and of evacuation, excessive passions and more, which are then reduced to six genera {cite:canon-ibn-sina-print-v1 p.144}."
