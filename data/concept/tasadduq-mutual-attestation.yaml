id: concept/tasadduq-mutual-attestation
class: concept
kind: legal
label:
  ar: "التصادق"
  en: "Tasadduq (mutual attestation of a claim)"
  ur: "تصادق ⁦(دعوی کی باہمی تصدیق)⁩"
  es: "Tasadduq (atestación mutua de una reclamación)"
  fr: "Tasadduq (attestation mutuelle d'une revendication)"
summary:
  ar: "التصادق تصديق المتعاقدين أو المتداعيين أحدهما الآخر، وهو ضد التكاذب. وهو ملزم إذا تعلق بحقوق العباد أو بحقوق الله التي لا تدرأ بالشبهات، ولا عبرة به في حقوق الله التي تدرأ بالشبهات كالحدود إلا بالبينة. ويصح من البالغ العاقل المختار، ويكون بلفظ أو إشارة أو كتابة أو سكوت، ويشترط أن يكون المصادَق أهلاً للاستحقاق. ولا يثبت النكاح بالتصادق عند غير المالكية، والعدة حق لله فلا تسقط بالتصادق، ويكتفى بتصديق الزوجة زوجها في دعوى الإعسار. ولا يجوز الرجوع عن التصديق في حقوق الآدميين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5215} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5216} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5217} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5218}"
  en: "Tasadduq is two parties, or the claimant and the party claimed against, confirming each other's word; it is the opposite of contradicting. It binds when it concerns human rights or rights of God that doubts do not avert; for rights of God that doubts avert, such as the hadd penalties, it counts only with proof. It is valid from a sane, free adult, by word, sign, writing or silence, and the one confirmed must be entitled. Marriage is not proved by mutual confirmation for non-Malikis, since witnesses are required; the waiting period is a right of God and not dropped by confirmation; a wife's confirmation of her husband's claim to poverty stands in place of proof. Retracting a confirmation is not accepted for human rights, but a confession to a hadd may be retracted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5215} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5216} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5217} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5218}"
  es: "Tasadduq implica que dos partes, o el reclamante y la parte demandada, confirmen la palabra de la otra; es lo opuesto a la contradicción. Es vinculante cuando se trata de derechos humanos o derechos divinos que no se pueden revocar; para los derechos divinos que sí se pueden revocar, como las penas hadd, solo es válido con prueba. Es válido para un adulto sano y libre, mediante palabra, signo, escrito o silencio, y quien recibe la confirmación debe tener derecho a ella. El matrimonio no se prueba mediante confirmación mutua para los no malikíes, ya que se requieren testigos; el período de espera es un derecho divino y no se elimina con la confirmación; la confirmación de la esposa sobre la condición de pobreza de su esposo sustituye a la prueba. La retractación de una confirmación no se acepta en materia de derechos humanos, pero sí se puede retractar una confesión de hadd. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5215} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5216} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5217} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5218}"
  fr: "Le tasadduq consiste en la confirmation mutuelle des paroles de deux parties, ou du demandeur et de la partie adverse; il est l’opposé d’une contradiction. Il est contraignant lorsqu’il s’agit de droits humains ou de droits divins incontestables; pour les droits divins incontestables, tels que les peines du hadd, seule une preuve est valable. Il est valable pour une personne majeure, saine d’esprit et libre, par la parole, un signe, un écrit ou le silence, et la personne confirmée doit être en droit de le faire. Le mariage n’est pas prouvé par confirmation mutuelle pour les non-Malikites, car des témoins sont requis; le délai d’attente est un droit divin et n’est pas aboli par la confirmation; la confirmation par l’épouse de la déclaration de pauvreté de son mari tient lieu de preuve. La rétractation d’une confirmation n’est pas acceptée en matière de droits humains, mais une confession à un hadd peut être rétractée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5215} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5216} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5217} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5218}"
  ur: "تصدق دو فریق ہیں، یا دعویدار اور فریق جس کے خلاف دعویٰ کیا گیا ہے، ایک دوسرے کی بات کی تصدیق کرتے ہیں۔ یہ متضاد کے برعکس ہے. جب یہ انسانی حقوق یا خدا کے حقوق سے متعلق ہے تو اس کا پابند ہوتا ہے کہ شکوک ٹلتے نہیں ہیں۔ خدا کے حقوق کے لیے جن سے شکوک و شبہات کو ٹالتے ہیں، جیسے حد کی سزا، یہ صرف ثبوت کے ساتھ شمار ہوتا ہے۔ یہ ایک سمجھدار، آزاد بالغ سے، لفظ، نشانی، تحریر یا خاموشی سے درست ہے، اور جس کی تصدیق ہو اس کا حقدار ہونا ضروری ہے۔ غیر ملکیوں کے لیے باہمی تصدیق سے نکاح ثابت نہیں ہوتا، کیونکہ گواہوں کی ضرورت ہوتی ہے۔ عدت خدا کا حق ہے اور تصدیق سے نہیں چھوڑی جاتی۔ بیوی کی اپنے شوہر کے غربت کے دعوے کی تصدیق ثبوت کی جگہ کھڑی ہے۔ توثیق واپس لینا انسانی حقوق کے لیے قابل قبول نہیں ہے، لیکن حد کے اعتراف کو واپس لیا جا سکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5215} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5216} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5217} صفحہ 5218}"
