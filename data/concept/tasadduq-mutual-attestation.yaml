label:
  ar: "التصادق"
  en: "Tasadduq (mutual attestation of a claim)"
  ur: "تصادق (دعوی کی باہمی تصدیق)"
summary:
  ar: "التصادق تصديق المتعاقدين أو المتداعيين أحدهما الآخر، وهو ضد التكاذب. وهو ملزم إذا تعلق بحقوق العباد أو بحقوق الله التي لا تدرأ بالشبهات، ولا عبرة به في حقوق الله التي تدرأ بالشبهات كالحدود إلا بالبينة. ويصح من البالغ العاقل المختار، ويكون بلفظ أو إشارة أو كتابة أو سكوت، ويشترط أن يكون المصادَق أهلاً للاستحقاق. ولا يثبت النكاح بالتصادق عند غير المالكية، والعدة حق لله فلا تسقط بالتصادق، ويكتفى بتصديق الزوجة زوجها في دعوى الإعسار. ولا يجوز الرجوع عن التصديق في حقوق الآدميين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5215} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5216} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5217} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5218}"
  en: "Tasadduq is two parties, or the claimant and the party claimed against, confirming each other's word; it is the opposite of contradicting. It binds when it concerns human rights or rights of God that doubts do not avert; for rights of God that doubts avert, such as the hadd penalties, it counts only with proof. It is valid from a sane, free adult, by word, sign, writing or silence, and the one confirmed must be entitled. Marriage is not proved by mutual confirmation for non-Malikis, since witnesses are required; the waiting period is a right of God and not dropped by confirmation; a wife's confirmation of her husband's claim to poverty stands in place of proof. Retracting a confirmation is not accepted for human rights, but a confession to a hadd may be retracted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5215} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5216} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5217} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5218}"
