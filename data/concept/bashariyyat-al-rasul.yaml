id: concept/bashariyyat-al-rasul
class: concept
kind: doctrine
label:
  ar: "بشرية الرسول"
  en: "The humanity of the Messenger (bashariyyat al-rasul)"
  fr: "L’humanité du Messager (bashariyyat al-rasul)"
  ur: "رسول کی بشریت"
  es: "La humanidad del Mensajero (bashariyyat al-rasul)"
  tr: "Elçinin İnsanlığı"
  id: "Kemanusiaan Sang Utusan"
summary:
  ar: "يرى الشعراوي أن بشرية الرسول ضرورية لتمام الرسالة، لأنه لا بد أن يكون من جنس قومه ليكون قدوة يطبق المنهج أمامهم، ولأن غير البشر لا يطاق منهجه. ويعرض اعتراض الكفار على بشرية الرسول، ويذكر أن أهل مكة عرّفوا النبي بالصدق والأمانة قبل الرسالة، وأن شكوكهم كانت مفتعلة {cite:tafsir-sharawi-khawatir-scan p.196} {cite:tafsir-sharawi-khawatir-scan p.197}. هذا تفسيره ويُنسب إليه."
  en: "Sha'rawi holds that the Messenger's humanity is necessary for the completeness of the message: he must be of his people's kind to be a model who applies the method before them, and a non-human could not be followed. He sets out the disbelievers' objection to the humanity of the Messenger, and notes that the Meccans knew him as truthful and trustworthy before the mission, so their doubts were contrived {cite:tafsir-sharawi-khawatir-scan p.196} {cite:tafsir-sharawi-khawatir-scan p.197}. This is Sha'rawi's reading and is attributed to him."
  fr: "Sha'rawi tient l’humanité du Messager pour nécessaire à la plénitude du message : appartenir au même genre que son peuple lui permet d’être un modèle appliquant la méthode devant lui ; un être non humain ne pourrait être suivi. Il expose l’objection des non-croyants à cette humanité et observe que les Mecquois le savaient véridique et digne de confiance avant la mission : leurs doutes seraient donc fabriqués {cite:tafsir-sharawi-khawatir-scan p.196} {cite:tafsir-sharawi-khawatir-scan p.197}. Cette lecture lui est attribuée."
  ur: "شعراوی کے نزدیک رسول کی بشریت رسالت کی تکمیل کے لیے ضروری ہے، کیونکہ اسے اپنی قوم کی جنس سے ہونا چاہیے تاکہ وہ ان کے سامنے منہج پر عمل کر کے نمونہ بنے، اور غیر بشر کے منہج کی پیروی نہیں ہو سکتی۔ وہ کفار کے اعتراض کا ذکر کرتے ہیں کہ رسول بشر ہیں، اور کہتے ہیں کہ اہل مکہ نبوت سے پہلے انہیں سچا اور امانتدار جانتے تھے، اس لیے ان کے شبہات گھڑے ہوئے تھے {cite:tafsir-sharawi-khawatir-scan p.196} {cite:tafsir-sharawi-khawatir-scan p.197}۔ یہ شعراوی کی تفسیر ہے اور ان کی طرف منسوب ہے۔"
  es: "Sha'rawi sostiene que la humanidad del Mensajero es necesaria para la plenitud del mensaje: debe pertenecer a su pueblo para ser un modelo que aplique el método ante ellos, y un ser no humano no podría ser seguido. Expone la objeción de los incrédulos a la humanidad del Mensajero y señala que los mecanos lo conocían como veraz y digno de confianza antes de la misión, por lo que sus dudas eran infundadas {cite:tafsir-sharawi-khawatir-scan p.196} {cite:tafsir-sharawi-khawatir-scan p.197}. Esta es la interpretación de Sha'rawi y se le atribuye."
  tr: "El-Şaarawi, El-Şaaravi'nin insanlığının mesajın tamamlanması için vazgeçilmez olduğuna inanır; çünkü onun kendi halkıyla aynı türden olması gerekir ki önlerindeki metodolojiyi uygulayabilsin, ayrıca insan olmayanlar onun yöntemini tolere edemez. İnamsızların Resser'in insanlığına itirazlarını sunarak, Mekke halkının Peygamber'i mesajdan önce doğruluğu ve güvenilirliği nedeniyle tanıdıklarını, şüphelerinin uydurma olduğunu belirtir {cite:tafsir-sharawi-khawatir-scan s.196} {cite:tafsir-sharawi-khawatir-s.197}. Bu onun yorumudur ve ona atfedilir."
  id: "Al-Shaarawi percaya bahwa kemanusiaan Rasul adalah hal yang penting untuk penyelesaian pesan, karena ia harus setara dengan umatnya untuk menjadi teladan dalam menerapkan metodologi yang ada di hadapan mereka, dan karena non-manusia tidak dapat mentolerir metodenya. Ia menyampaikan keberatan kaum kafir terhadap kemanusiaan Rasulullah, menyebutkan bahwa rakyat Mekah mengenal Nabi karena kejujuran dan kepercayaannya sebelum pesan itu, dan keraguan mereka hanyalah rekaan {cite:tafsir-sharawi-khawatir-scan hlm.196} {cite:tafsir-sharawi-khawatir-scan hlm.197}. Ini adalah tafsir-sharawi-khawatir-scan hlm.197}. Ini adalah tafsirnya dan dikaitkan dengannya."
