id: concept/bashariyyat-al-rasul
class: concept
kind: doctrine
label:
  ar: "بشرية الرسول"
  en: "The humanity of the Messenger (bashariyyat al-rasul)"
  ur: "رسول کی بشریت"
summary:
  ar: "يرى الشعراوي أن بشرية الرسول ضرورية لتمام الرسالة، لأنه لا بد أن يكون من جنس قومه ليكون قدوة يطبق المنهج أمامهم، ولأن غير البشر لا يطاق منهجه. ويعرض اعتراض الكفار على بشرية الرسول، ويذكر أن أهل مكة عرّفوا النبي بالصدق والأمانة قبل الرسالة، وأن شكوكهم كانت مفتعلة {cite:tafsir-sharawi-khawatir-scan p.196} {cite:tafsir-sharawi-khawatir-scan p.197}. هذا تفسيره ويُنسب إليه."
  en: "Sha'rawi holds that the Messenger's humanity is necessary for the completeness of the message: he must be of his people's kind to be a model who applies the method before them, and a non-human could not be followed. He sets out the disbelievers' objection to the humanity of the Messenger, and notes that the Meccans knew him as truthful and trustworthy before the mission, so their doubts were contrived {cite:tafsir-sharawi-khawatir-scan p.196} {cite:tafsir-sharawi-khawatir-scan p.197}. This is Sha'rawi's reading and is attributed to him."
  ur: "شعراوی کے نزدیک رسول کی بشریت رسالت کی تکمیل کے لیے ضروری ہے، کیونکہ اسے اپنی قوم کی جنس سے ہونا چاہیے تاکہ وہ ان کے سامنے منہج پر عمل کر کے نمونہ بنے، اور غیر بشر کے منہج کی پیروی نہیں ہو سکتی۔ وہ کفار کے اعتراض کا ذکر کرتے ہیں کہ رسول بشر ہیں، اور کہتے ہیں کہ اہل مکہ نبوت سے پہلے انہیں سچا اور امانتدار جانتے تھے، اس لیے ان کے شبہات گھڑے ہوئے تھے {cite:tafsir-sharawi-khawatir-scan p.196} {cite:tafsir-sharawi-khawatir-scan p.197}۔ یہ شعراوی کی تفسیر ہے اور ان کی طرف منسوب ہے۔"
