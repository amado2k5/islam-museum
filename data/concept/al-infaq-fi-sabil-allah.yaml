id: concept/al-infaq-fi-sabil-allah
class: concept
kind: ethical
label:
  ar: الإنفاق في سبيل الله
  en: Spending in the way of God (infaq)
summary:
  ar: "يعرض الشيخ شلتوت الإنفاق في سبيل الله ركناً من أركان بناء المجتمع، ويلاحظ أن القرآن لا يذكر الإيمان في بعض السور إلا مقروناً بالإنفاق {cite:azhar-quran-building-society-shaltut p. 108}{cite:azhar-quran-building-society-shaltut p. 109}. ويرى أن القرآن جعل إطعام الفقير والمسكين موضع العقبة التي لا بد من اقتحامها للوصول إلى السعادة، وأن ترك الحض على الإطعام من علامات التكذيب بالدين {cite:azhar-quran-building-society-shaltut p. 110}. ويرسم المؤلف دوائر الإنفاق ثلاثاً: دائرة الأهل والأقارب، ودائرة الفقراء والمساكين الذين لا يقدرون على العمل، ودائرة المصالح العامة كالمصانع الحربية والمستشفيات والمعاهد العلمية {cite:azhar-quran-building-society-shaltut p. 113}{cite:azhar-quran-building-society-shaltut p. 114}. ويفرق بين المسكين الحقيقي وبين من يتخذ التسول صنعة، ويقترح تنظيم الأحياء لمعرفة المحتاجين {cite:azhar-quran-building-society-shaltut p. 115}{cite:azhar-quran-building-society-shaltut p. 116}{cite:azhar-quran-building-society-shaltut p. 117}."
