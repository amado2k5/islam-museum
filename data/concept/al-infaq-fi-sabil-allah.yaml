id: concept/al-infaq-fi-sabil-allah
class: concept
kind: ethical
tags: [islamic-economy-browser, islamic-economy-waqf]
label:
  ar: الإنفاق في سبيل الله
  en: Spending in the way of God (infaq)
  fr: "La dépense dans le chemin de Dieu (infaq)"
  es: "Gastar en el camino de Dios (infaq)"
  ur: "راہ خدا میں خرچ کرنا ⁦(انفاق)⁩"
  tr: "Allah yolunda harcama"
  id: "Jangan habiskan uang demi Allah"
summary:
  ar: "يعرض الشيخ شلتوت الإنفاق في سبيل الله ركناً من أركان بناء المجتمع، ويلاحظ أن القرآن لا يذكر الإيمان في بعض السور إلا مقروناً بالإنفاق {cite:azhar-quran-building-society-shaltut p. 108}{cite:azhar-quran-building-society-shaltut p. 109}. ويرى أن القرآن جعل إطعام الفقير والمسكين موضع العقبة التي لا بد من اقتحامها للوصول إلى السعادة، وأن ترك الحض على الإطعام من علامات التكذيب بالدين {cite:azhar-quran-building-society-shaltut p. 110}. ويرسم المؤلف دوائر الإنفاق ثلاثاً: دائرة الأهل والأقارب، ودائرة الفقراء والمساكين الذين لا يقدرون على العمل، ودائرة المصالح العامة كالمصانع الحربية والمستشفيات والمعاهد العلمية {cite:azhar-quran-building-society-shaltut p. 113}{cite:azhar-quran-building-society-shaltut p. 114}. ويفرق بين المسكين الحقيقي وبين من يتخذ التسول صنعة، ويقترح تنظيم الأحياء لمعرفة المحتاجين {cite:azhar-quran-building-society-shaltut p. 115}{cite:azhar-quran-building-society-shaltut p. 116}{cite:azhar-quran-building-society-shaltut p. 117}."
  fr: "Le cheikh Shaltut présente la dépense dans le chemin de Dieu comme l'un des piliers de la construction de la société, et observe que le Coran, dans certaines sourates, ne mentionne la foi qu'associée à la dépense {cite:azhar-quran-building-society-shaltut p. 108}{cite:azhar-quran-building-society-shaltut p. 109}. Il estime que le Coran a fait de l'action de nourrir le pauvre et l'indigent la pente escarpée qu'il faut gravir pour parvenir au bonheur, et que ne pas inciter à nourrir autrui compte parmi les signes du démenti de la religion {cite:azhar-quran-building-society-shaltut p. 110}. L'auteur trace trois cercles de la dépense : celui de la famille et des proches, celui des pauvres et des indigents incapables de travailler, et celui des intérêts publics, comme les usines d'armement, les hôpitaux et les instituts scientifiques {cite:azhar-quran-building-society-shaltut p. 113}{cite:azhar-quran-building-society-shaltut p. 114}. Il distingue le véritable indigent de celui qui fait de la mendicité un métier, et propose d'organiser les quartiers pour connaître les nécessiteux {cite:azhar-quran-building-society-shaltut p. 115}{cite:azhar-quran-building-society-shaltut p. 116}{cite:azhar-quran-building-society-shaltut p. 117}."
  tr: "Şeyh Şaltut, Allah yolunda harcamayı toplum inşa etmenin temel direği olarak sunar ve Kur'an'ın bazı bölümlerde imandan bahsetmediğini, ancak buna harcama eşlik ettiğinde {cite:azhar-quran-building-society-shaltut s. 108} {cite:azhar-quran-building-society-shaltut s. 109}} ile birlikte bahsedildiğini belirtir. Kur'an'ın yoksul ve muhtaçları beslemeyi mutluluğa ulaşmak için aşılması gereken bir engel haline getirdiğine ve beslenmeye teşvik edilmesinin dinin reddi anlamına geldiğini belirtir {cite:azhar-kuran-building-society-shaltut s. 110}. Yazar, harcamaların üç çemberini özetler: akrabalar ve aile çemberi, çalışamayan yoksul ve muhtaçlar çemberi ile savaş fabrikaları, hastaneler ve bilimsel enstitüler gibi kamu çıkarları çemberi {cite:azhar-quran-building-society-shaltut s. 113}{cite:azhar-quran-building-society-shaltut s. 114}. Gerçekten yoksullar ile dilenciliği meslek edenler arasında ayrım yapar ve ihtiyacı olanları belirlemek için mahallelerin organize edilmesini önerir {cite:azhar-quran-building-society-shaltut s. 115}{cite:azhar-quran-building-society-shaltut s. 116}{cite:azhar-quran-building-society-shaltut s. 117}."
  id: "Sheikh Shaltut menyajikan pengeluaran di jalan Allah sebagai pilar fundamental membangun masyarakat dan mencatat bahwa dalam beberapa bagian Al-Qur'an tidak disebutkan iman, tetapi ketika pengeluaran menyertainya, disebutkan bersama {cite:azhar-quran-building-society-shaltut hlm. 108} {cite:azhar-quran-building-society-shaltut hlm. 109}}. Ia menyatakan bahwa Al-Qur'an menjadikan memberi makan orang miskin dan membutuhkan sebagai hambatan yang harus diatasi untuk mencapai kebahagiaan dan bahwa mendorong nutrisi berarti menolak agama {cite:azhar-quran-building-society-shaltut hlm. 110}. Penulis merangkum tiga lingkaran pengeluaran: lingkaran kerabat dan keluarga, lingkaran orang miskin dan membutuhkan yang tidak bisa bekerja, dan lingkaran kepentingan publik seperti pabrik perang, rumah sakit, dan lembaga ilmiah {cite:azhar-quran-building-society-shaltut hlm. 113}{cite:azhar-quran-building-society-shaltut hlm. 114}. Ia benar-benar membedakan antara orang miskin dan mereka yang berprofesi mengemis dan menyarankan pengorganisasian lingkungan untuk mengidentifikasi mereka yang membutuhkan {cite:azhar-quran-building-society-shaltut hlm. 115}{cite:azhar-quran-building-society-shaltut hlm. 116}{cite:azhar-quran-building-society-shaltut hlm. 117}."
