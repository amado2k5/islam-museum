tags: [arabiyya-browser, arabiyya-world]
label:
  ar: "العربية في الجزائر"
  en: "Arabic in Algeria"
  ur: "الجزائر میں عربی"
  fr: "L'arabe en Algérie"
  es: "El árabe en Argelia"
summary:
  ar: "مكانة العربية في الجزائر كما تقولها دائرة المعارف البريطانية وكتاب حقائق العالم: لغة وطنية رسمية منذ 1990 وسياسة تعريب منذ الاستقلال حلّت بها محل الفرنسية لغة للتعليم الابتدائي والثانوي، ولهجات عربية قريبة مما في المغرب وتونس، والأمازيغية وطنية سنة 2002 ورسمية سنة 2016 وبعض لهجاتها القبائلية والشاوية والمزابية والطارقية. ويصف الكتاب الفرنسية بلغة تواصل، والموسوعة تصف التعريب. وأُضيف نص الحكم الدستوري بلغته الأصلية كما ورد في ملخص بحثي لم يتحقق المتحف منه على الصفحة."
  en: "The place of Arabic in Algeria as the Encyclopaedia Britannica and The World Factbook state it: the official national language since 1990 and an Arabization policy since independence that replaced French as the language of primary and secondary teaching; Arabic dialects close to those of Morocco and Tunisia; Tamazight national in 2002 and official in 2016, with Kabyle, Shawiya, Mzab and Tuareg among its dialects. The Factbook calls French a lingua franca, while the encyclopedia describes Arabization. The constitutional text is added in its original wording, as supplied in a research summary that the museum did not check against the page."
  ur: "الجزائر میں عربی کا مقام جیسا انسائیکلوپیڈیا برٹانیکا اور ورلڈ فیکٹ بک بیان کرتی ہیں: 1990 سے سرکاری قومی زبان اور آزادی کے بعد سے تعریب کی پالیسی جس نے ابتدائی اور ثانوی تعلیم کی زبان کے طور پر فرانسیسی کی جگہ لی؛ مراکش اور تیونس سے ملتے جلتے عربی لہجے؛ امازیغی 2002 میں قومی اور 2016 میں سرکاری، جس کے لہجوں میں قبائلی، شاوی، مزابی اور طوارقی ہیں۔ فیکٹ بک فرانسیسی کو رابطے کی زبان کہتی ہے جبکہ برٹانیکا تعریب کا بیان کرتی ہے۔ آئینی حکم کی عبارت اصل زبان میں شامل کی گئی ہے، جیسی ایک تحقیقی خلاصے میں ملی جسے متحف نے صفحے سے نہیں جانچا۔"
  fr: "La place de l'arabe en Algérie selon l'Encyclopaedia Britannica et The World Factbook : langue nationale officielle depuis 1990 et politique d'arabisation depuis l'indépendance qui a remplacé le français comme langue d'enseignement primaire et secondaire ; dialectes arabes proches de ceux du Maroc et de la Tunisie ; tamazight nationale en 2002 et officielle en 2016, avec le kabyle, le chaoui, le mozabite et le touareg parmi ses dialectes. Le Factbook appelle le français lingua franca, tandis que l'encyclopédie décrit l'arabisation. Le texte constitutionnel est ajouté dans sa langue d'origine, tel que fourni par un résumé de recherche que le musée n'a pas vérifié sur la page."
  es: "El lugar del árabe en Argelia según la Encyclopaedia Britannica y The World Factbook: lengua nacional oficial desde 1990 y una política de arabización desde la independencia que sustituyó al francés como lengua de la enseñanza primaria y secundaria; dialectos árabes cercanos a los de Marruecos y Túnez; el tamazight nacional en 2002 y oficial en 2016, con el cabilio, el chaui, el mozabita y el tuareg entre sus dialectos. El Factbook llama al francés lengua franca, mientras que la enciclopedia describe la arabización. Se añade el texto constitucional en su lengua original, tal como lo entrega un resumen de investigación que el museo no verificó en la página."
