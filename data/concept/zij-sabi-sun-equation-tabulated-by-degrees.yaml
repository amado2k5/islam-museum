id: concept/zij-sabi-sun-equation-tabulated-by-degrees
class: concept
kind: scientific
label: { ar: "جدول تعديل الشمس درجةً درجة", en: "The Sun's equation tabulated degree by degree", ur: "سورج کے تعدیل کا جدول درجہ بہ درجہ", es: "La ecuación del Sol tabulada grado por grado", fr: "L'équation du Soleil tabulée degré par degré" }
summary:
  ar: "يقول البتاني إنه حصّل على هذا الرسم الاختلاف لدرجة درجة، وأثبته في الجداول من نقطة البعد الأبعد، وإن على هذا الرسم يعمل تعديل القمر المفرد وتعديل الكواكب الأوسط الذي هو نصف قطر فلك تدوير كل واحد منها {cite:zij-sabi-nallino-byblion p.76}."
  en: "Al-Battani says that by this figure he worked out the variation degree by degree and entered it in the tables, starting from the point of greatest distance, and that by the same figure the Moon's single equation and the planets' mean equation are made, which is the radius of the epicycle of each of them {cite:zij-sabi-nallino-byblion p.76}."
  ur: "البتانی کہتے ہیں کہ اسی نقشے کے مطابق انہوں نے اختلاف کو درجہ بہ درجہ حاصل کیا اور اوج کے نقطے سے جدولوں میں درج کیا، اور اسی نقشے پر چاند کا منفرد تعدیل اور سیاروں کا وسطی تعدیل، جو ان میں سے ہر ایک کے فلکِ تدویر کا نصف قطر ہے، بنایا جاتا ہے {cite:zij-sabi-nallino-byblion p.76}۔"
  es: "Al-Battani dice que con esta cifra calculó la variación grado por grado y la introdujo en las tablas, partiendo del punto de mayor distancia, y que con la misma cifra se elaboran la ecuación única de la Luna y la ecuación media de los planetas, que es el radio del epiciclo de cada uno de ellos {cite:zij-sabi-nallino-byblion p.76}."
  fr: "Al-Battani dit qu'à partir de cette figure, il a calculé la variation degré par degré et l'a inscrite dans les tables, en partant du point de plus grande distance, et qu'à partir de la même figure sont faites l'équation unique de la Lune et l'équation moyenne des planètes, qui est le rayon de l'épicycle de chacune d'elles {cite:zij-sabi-nallino-byblion p.76}."
