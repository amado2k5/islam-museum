  en: "Pardon (afw) in purity, worship, contracts and penalties"
  ur: "عفو"
summary:
  ar: "العفو في اللغة الإسقاط، ويطلق أيضاً على الكثرة والذهاب والإعطاء، وفي الاصطلاح يستعمله الفقهاء غالباً بمعنى الإسقاط والتجاوز، ويفرق عن الصفح والمغفرة والإسقاط والصلح {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11675}. ويختلف حكمه بحسب الحق، فإن كان الحق خالصاً للعبد استحب العفو، وإن كان حقاً لله كالحدود فلا عفو فيه بعد الرفع إلى الحاكم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11675}. ومن أحكامه في العبادات العفو عن يسير بعض النجاسات، والخلاف فيه بين المذاهب في الدم والقيح وطين الشوارع، وعن بعض ما بين النصابين من الأنعام في الزكاة، وعن بعض المفطرات في الصوم، وعن المخيط والطيب ناسياً في الحج {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11680}. ومن أحكامه في المعاملات العفو عن الشفعة، والدائن عن المدين، والمرأة أو الزوج أو الولي عن الصداق {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11680} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11681}. وفي القصاص يُشرع العفو، وإذا عفا بعض المستحقين سقط القصاص عند الجمهور وانقلب نصيب الآخر مالاً، واختلفوا في أثر العفو عن الجناية، وفي أهلية العافي، وفي العفو على مال {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11683} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11690}. ولا عفو في حد الزنا والسرقة، واختلفوا في حد القذف، وأجاز الجمهور العفو في التعزير بحسب حق الآدمي أو حق السلطنة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11691} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11693}."
  en: "In the lexicon, afw means removing or pardoning, and also abundance, going away and giving; the jurists use it mainly for dropping or overlooking a right {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11674}. It is distinguished from pardon by forgiveness of the wrong (safh) and from the forgiveness of sins (maghfira), dropping a right (isqat) and settlement (sulh) {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11675}. Its ruling depends on the right: pardon is recommended where the right is purely the individual's; where the right belongs to God, as in the fixed punishments, there is no pardon once the matter is before the judge {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11675}. In worship, the schools disagree on pardon for small amounts of impurity, such as blood, pus and street mud, on the interval between the two thresholds of the camel and the cattle tax, on some things that do not break the fast, and on forgotten wearing of sewn clothes or perfume during pilgrimage {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11680}. In contracts, pardon of pre-emption, of a debt, and of a dower are treated {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11680} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11681}. In retaliation, pardon is lawful and recommended; if one of several heirs pardons, the retaliation falls and the others' shares become money, by the consensus the text reports; the schools differ on the effect of pardon during injury, on the capacity of the pardoner, and on settlement for money {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11683} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11690}. There is no pardon for the fixed punishments of adultery and theft; the jurists differ on slander, and pardon in discretionary punishment (ta'zir) is allowed where it concerns a person's right or the ruler's discretion {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11691} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11693}."
