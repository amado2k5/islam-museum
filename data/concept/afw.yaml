label:
  ar: "العَفْو"
  en: "Pardon (afw) in purity, worship, contracts and penalties"
  fr: "Le pardon (afw) en matière de pureté, de culte, de contrats et de peines"
  ur: "عفو"
  es: "Perdón (afw) en pureza, culto, contratos y penas"
  tr: "af"
  id: "af"
summary:
  ar: "العفو في اللغة الإسقاط، ويطلق أيضاً على الكثرة والذهاب والإعطاء، وفي الاصطلاح يستعمله الفقهاء غالباً بمعنى الإسقاط والتجاوز، ويفرق عن الصفح والمغفرة والإسقاط والصلح {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11675}. ويختلف حكمه بحسب الحق، فإن كان الحق خالصاً للعبد استحب العفو، وإن كان حقاً لله كالحدود فلا عفو فيه بعد الرفع إلى الحاكم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11675}. ومن أحكامه في العبادات العفو عن يسير بعض النجاسات، والخلاف فيه بين المذاهب في الدم والقيح وطين الشوارع، وعن بعض ما بين النصابين من الأنعام في الزكاة، وعن بعض المفطرات في الصوم، وعن المخيط والطيب ناسياً في الحج {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11680}. ومن أحكامه في المعاملات العفو عن الشفعة، والدائن عن المدين، والمرأة أو الزوج أو الولي عن الصداق {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11680} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11681}. وفي القصاص يُشرع العفو، وإذا عفا بعض المستحقين سقط القصاص عند الجمهور وانقلب نصيب الآخر مالاً، واختلفوا في أثر العفو عن الجناية، وفي أهلية العافي، وفي العفو على مال {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11683} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11690}. ولا عفو في حد الزنا والسرقة، واختلفوا في حد القذف، وأجاز الجمهور العفو في التعزير بحسب حق الآدمي أو حق السلطنة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11691} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11693}."
  en: "In the lexicon, afw means removing or pardoning, and also abundance, going away and giving; the jurists use it mainly for dropping or overlooking a right {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11674}. It is distinguished from pardon by forgiveness of the wrong (safh) and from the forgiveness of sins (maghfira), dropping a right (isqat) and settlement (sulh) {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11675}. Its ruling depends on the right: pardon is recommended where the right is purely the individual's; where the right belongs to God, as in the fixed punishments, there is no pardon once the matter is before the judge {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11675}. In worship, the schools disagree on pardon for small amounts of impurity, such as blood, pus and street mud, on the interval between the two thresholds of the camel and the cattle tax, on some things that do not break the fast, and on forgotten wearing of sewn clothes or perfume during pilgrimage {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11680}. In contracts, pardon of pre-emption, of a debt, and of a dower are treated {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11680} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11681}. In retaliation, pardon is lawful and recommended; if one of several heirs pardons, the retaliation falls and the others' shares become money, by the consensus the text reports; the schools differ on the effect of pardon during injury, on the capacity of the pardoner, and on settlement for money {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11683} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11690}. There is no pardon for the fixed punishments of adultery and theft; the jurists differ on slander, and pardon in discretionary punishment (ta'zir) is allowed where it concerns a person's right or the ruler's discretion {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11691} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11693}."
  fr: "Dans le lexique, afw signifie supprimer ou pardonner, mais aussi abondance, départ et don ; les juristes l’emploient surtout pour la renonciation à un droit ou le fait de passer outre {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11674}. Il est distingué du pardon qui efface le tort (safh), de la rémission des péchés (maghfira), de l’abandon d’un droit (isqat) et du règlement amiable (sulh) {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11675}. Son statut dépend du droit concerné : le pardon est recommandé lorsque le droit appartient exclusivement à l’individu ; lorsqu’il appartient à Dieu, comme dans les peines fixes, il n’y a pas de pardon une fois l’affaire portée devant le juge {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11675}. Dans le culte, les écoles divergent sur la tolérance de petites quantités d’impureté, telles que le sang, le pus et la boue des rues, sur l’intervalle entre les deux seuils de l’imposition sur les chameaux et les bovins, sur certaines choses qui ne rompent pas le jeûne, et sur le port par oubli de vêtements cousus ou de parfum pendant le pèlerinage {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11680}. Dans les contrats, la renonciation au droit de préemption, à une dette et au douaire est traitée {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11680} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11681}. Dans le talion, le pardon est licite et recommandé ; si l’un de plusieurs héritiers pardonne, le talion tombe et les parts des autres deviennent pécuniaires, selon le consensus rapporté par le texte ; les écoles divergent sur l’effet du pardon pendant la blessure, sur la capacité de celui qui pardonne et sur le règlement pécuniaire {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11683} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11690}. Il n’y a pas de pardon pour les peines fixes de l’adultère et du vol ; les juristes divergent sur la calomnie, et le pardon en matière de peine discrétionnaire (ta'zir) est permis lorsqu’il concerne le droit d’une personne ou le pouvoir discrétionnaire du gouvernant {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11691} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11693}."
  es: "En el léxico, afw significa quitar o perdonar, y también abundancia, irse y dar; los juristas lo usan principalmente para dejar pasar o pasar por alto un derecho {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11674}. Se distingue del perdón por perdón de la falta (safh) y del perdón de los pecados (maghfira), dejar pasar un derecho (isqat) y liquidación (sulh) {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11675}. Su dictamen depende del derecho: se recomienda el perdón cuando el derecho es puramente del individuo; cuando el derecho pertenece a Dios, como en los castigos fijos, no hay perdón una vez que el asunto está ante el juez {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11675}. En el culto, las escuelas discrepan sobre el perdón de pequeñas cantidades de impureza, como sangre, pus y barro de la calle, sobre el intervalo entre los dos umbrales del impuesto del camello y del ganado, sobre algunas cosas que no rompen el ayuno y sobre el olvido de usar ropa cosida o perfume durante la peregrinación {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11680}. En los contratos, se trata el perdón del derecho de tanteo, de una deuda y de una dote {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11680} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11681}. En represalia, el indulto es lícito y recomendable; si uno de varios herederos perdona, la represalia cae y las acciones de los demás se convierten en dinero, por consenso informa el texto; las escuelas difieren sobre el efecto del perdón durante una lesión, sobre la capacidad del perdonador y sobre la liquidación por dinero p.11689} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11690}. No hay perdón para las penas fijadas por adulterio y robo; Los juristas difieren en cuanto a la calumnia, y el perdón en el castigo discrecional (ta'zir) está permitido cuando se refiere al derecho de una persona o a la discreción del gobernante {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11691} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11693}."
  ur: "لغت میں، afw کا مطلب ہے ہٹانا یا معاف کرنا، اور کثرت، جانا اور دینا بھی۔ فقہاء اسے بنیادی طور پر کسی حق کو چھوڑنے یا نظر انداز کرنے کے لیے استعمال کرتے ہیں یہ معافی سے گناہوں کی معافی ⁦(صف)⁩ اور گناہوں کی معافی ⁦(مغفرہ)⁩، حق کو چھوڑنے ⁦(اسقاط)⁩ اور حل ⁦(سلح)⁩ سے ممتاز ہے۔ اس کا حکم حق پر منحصر ہے: جہاں حق خالصتاً فرد کا ہو وہاں معافی کی سفارش کی جاتی ہے۔ جہاں حق خدا کا ہے، جیسا کہ مقررہ سزاؤں میں ہے، جب معاملہ جج کے سامنے ہو تو کوئی معافی نہیں ہوتی۔ عبادات میں مکاتب قلیل مقدار میں نجاست جیسے خون، پیپ اور گلی کی کیچڑ، اونٹ اور مویشیوں کے ٹیکس کے درمیان وقفہ پر، روزہ نہ ٹوٹنے والی بعض چیزوں پر، اور حج کے دوران بھولے سے سلے ہوئے کپڑے یا خوشبو پہننے پر معاف کرنے پر متفق نہیں ہیں۔ p.11676} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.11679} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11680}۔ معاہدوں میں، قبل از وقت معافی، قرض اور مہر کی معافی کا معاملہ کیا جاتا ہے {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11680} بدلے میں معافی جائز اور مستحب ہے۔ اگر متعدد ورثاء میں سے کوئی ایک معاف کر دے تو انتقامی کارروائی گر جائے گی اور دوسرے کے حصص رقم ہو جائیں گے، متن کی اطلاع کے مطابق؛ چوٹ کے وقت معافی کے اثر، معاف کرنے والے کی صلاحیت اور رقم کے تصفیہ پر مکاتب میں اختلاف ہے {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11689} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11690}۔ زنا اور چوری کی مقررہ سزاؤں کی معافی نہیں ہے۔ غیبت پر فقہاء کا اختلاف ہے، اور صوابدیدی سزا ⁦(تذیر)⁩ میں معافی کی اجازت ہے جہاں اس کا تعلق کسی شخص کے حق یا حاکم کی صوابدید سے ہو۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 11693}۔"
  tr: "Af dilinde feragatname anlamına gelir ve aynı zamanda bolluk, gitme ve verme anlamına gelir. Terminolojide, hukukçular genellikle feragat ve sınırları aşma anlamında kullanırlar. Af, aff, affetme, feragat ve uzlaşma {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11675} ile ayrılır. Kararı haklara göre değişir: eğer hak tamamen hizmetkâra aitse, affetmek tavsiye edilir; eğer Tanrı için bir haksa, örneğin hudud, hakime sevk edildikten sonra af yoktur {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11675}. İbadetteki hükümleri arasında küçük kirliliklerin bile affedilmesi, okullar arasında sokaklarda kan, irin ve çamur ile ilgili anlaşmazlıklar, zekattaki iki kişi arasındaki bazı ritüel işler, oruç sırasında oruç bozan bazı şeyler ve Hac sırasında unutulmuş dikiş ve kokulama yer alır {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11680}. İşlemlerdeki kararları arasında öncelikten feragat etme, alacaklının borçludan, eş, koca veya vasi çeyizden muaf tutulması {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11680} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11681} yer alır. İntikam olarak, af yasalaştırılır. Bazı hak sahibi kişiler affederse, intikam çoğunluk tarafından feragat edilir ve diğerinin para payı geri alınır. Suçun affının etkisi, af alma uygunluğu ve mal affı konusunda anlaşmazlıklar vardır {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11690}. Zina ve hırsızlık cezasında af yoktur. İftira cezası konusunda anlaşmazlıklar vardır. Çoğunluk, kişinin veya sultanlığın hakkına göre takdire bağlı cezalarda affı kabul eder {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11691} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11693}."
  id: "Dalam bahasa amnesti, artinya penolakan dan juga berarti kelimpahan, meninggalkan, dan memberi. Dalam terminologi, ahli hukum umumnya menggunakannya untuk menyebut penolakan dan melintasi batas. Amnesti, pengampunan, pengampunan, penyerahan diri, dan rekonsiliasi {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11675} dibedakan dengan {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11675}. Keputusan bervariasi menurut hak: jika hak sepenuhnya milik hamba, pengampunan disarankan; jika hak itu adalah hak Tuhan, misalnya hudud, tidak ada pengampunan setelah dirujuk ke hakim {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11675}. Di antara ketentuan dalam ibadah adalah pengampunan atas kotoran kecil sekalipun, perselisihan antar sekolah di jalanan tentang darah, nanah, dan lumpur, beberapa ritual antara dua orang dalam zakat, beberapa hal yang memutus puasa saat berpuasa, dan jahitan serta bau yang terlupakan saat Haji {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11680}. Di antara keputusan dalam transaksi tersebut adalah pengecualian prioritas, membebaskan kreditur dari mas kawin debitur, pasangan, suami, atau wali {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11680} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11681}. Sebagai balas dendam, amnesti diberikan. Jika beberapa penerima manfaat memaafkan, balas dendam dihapuskan oleh mayoritas dan bagian uang yang lain dipulihkan. Ada perbedaan pendapat mengenai efek pengampunan, kelayakan untuk amnesti, dan pengampunan harta {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11690}. Tidak ada amnesti untuk perselingkuhan dan pencurian. Ada perbedaan pendapat mengenai hukuman untuk pencemaran nama baik. Mayoritas menerima amnesti dalam hukuman diskresi sesuai dengan hak orang atau kesultanan {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11691} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11693}."
