label: { ar: "احتجام", en: "Cupping (ihtijam)" }
summary:
  ar: "الاحتجام طلب الحجامة، والحجامة تطبيب يترتب عليه ما يترتب على التطبيب، كجواز نظر الحاجم إلى عورة المحجوم عند الضرورة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1718} ودم الحجامة نجس كغيره، ويجزئ المسح في تطهير مكان الجرح للضرورة، ويجب تنزيه المسجد عن الحجامة فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1718} وضمان ما تلف بفعل الحجام يذكره الفقهاء في الجنايات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1718}"
  en: "Ihtijam is asking for cupping. Cupping is a medical act with the consequences of medicine; for instance, the cupper may look at the private parts of the cupped person in necessity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1718} The blood of cupping is impure like other blood, though wiping suffices to clean the wound out of necessity, and the mosque must be kept free of cupping. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1718} Liability for harm caused by the cupper is treated under injuries. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1718}"
