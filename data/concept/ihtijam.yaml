id: concept/ihtijam
class: concept
kind: legal
label: { ar: "احتجام", en: "Cupping (ihtijam)", es: "Ventosaterapia (ihtijam)", fr: "Ventouses (ihtijam)", ur: "سنگی ⁦(احتجام)⁩", tr: "Protesto", id: "Protes" }
summary:
  ar: "الاحتجام طلب الحجامة، والحجامة تطبيب يترتب عليه ما يترتب على التطبيب، كجواز نظر الحاجم إلى عورة المحجوم عند الضرورة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1718} ودم الحجامة نجس كغيره، ويجزئ المسح في تطهير مكان الجرح للضرورة، ويجب تنزيه المسجد عن الحجامة فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1718} وضمان ما تلف بفعل الحجام يذكره الفقهاء في الجنايات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1718}"
  en: "Ihtijam is asking for cupping. Cupping is a medical act with the consequences of medicine; for instance, the cupper may look at the private parts of the cupped person in necessity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1718} The blood of cupping is impure like other blood, though wiping suffices to clean the wound out of necessity, and the mosque must be kept free of cupping. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1718} Liability for harm caused by the cupper is treated under injuries. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1718}"
  es: "Ihtijam solicita la ventosaterapia. La ventosaterapia es un acto médico con las consecuencias propias de la medicina; por ejemplo, el terapeuta puede examinar las partes íntimas de la persona tratada si es necesario. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1718} La sangre de la ventosaterapia es impura como cualquier otra sangre, aunque basta con limpiar la herida por necesidad, y la mezquita debe mantenerse libre de ventosaterapia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1718} La responsabilidad por los daños causados por el terapeuta se rige por las leyes de lesiones personales. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1718}"
  fr: "Ihtijam demande une ventousothérapie. La ventousothérapie est un acte médical qui comporte des conséquences médicales; par exemple, le praticien peut, si nécessaire, examiner les parties intimes de la personne qui reçoit les ventouses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1718} Le sang utilisé pour la ventousothérapie est impur comme tout autre sang, bien qu'un simple essuyage suffise à nettoyer la plaie en cas de nécessité, et la pratique de la ventousothérapie doit être interdite dans les mosquées. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1718} La responsabilité pour les dommages causés par le praticien de la ventousothérapie relève du droit des préjudices. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1718}"
  ur: "احتجام سنگی مانگ رہا ہے۔ سنگی دوا کے نتائج کے ساتھ ایک طبی عمل ہے؛ مثال کے طور پر، کپر ضرورت کے طور پر سنگی والے شخص کی شرمگاہ کو دیکھ سکتا ہے۔ فقہ الموسوعۃ کویتیہ نور ص 1718 ص 1718 سینگی کا خون بھی دوسرے خون کی طرح نجس ہے، البتہ زخم کو صاف کرنے کے لیے مسح کرنا کافی ہے اور مسجد کو سینگی سے پاک رکھنا ضروری ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1718} کپپر سے ہونے والے نقصان کی ذمہ داری زخموں کے تحت علاج کی جاتی ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص1718}"
  tr: "Kupa terapisi, kupa alma talebidir ve bardak tedavisi, tedavi sonucunda ortaya çıkan tıbbi tedavidir; örneğin, kupa yapan kişinin gerektiğinde kupa kullanan kişinin özel bölgelerine bakmasına izin verilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1718} Kupa kanı diğerleri gibi kirlidir ve silme işlemi yara bölgesini zorunluluktan temizlemek için yeterlidir; cami orada kupa kullanılmadan korunmalıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1718} Ve kupa ceza davalarında hukukçular tarafından verilen zarardan sorumlu tutulur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1718}"
  id: "Cupping adalah permintaan bekam, dan cupping adalah perawatan medis yang dihasilkan dari perawatan tersebut, seperti izin bagi orang yang cupping untuk melihat bagian pribadi orang yang dicupping jika diperlukan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1718} Darah cupping tidak murni seperti yang lain, dan mengelap cukup untuk memurnikan area luka karena kebutuhan, dan masjid harus dijaga agar tidak dibekam di sana. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1718} Dan tanggung jawab atas kerusakan yang disebabkan oleh bekam disebutkan oleh para ahli hukum dalam kasus pidana. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1718}"
