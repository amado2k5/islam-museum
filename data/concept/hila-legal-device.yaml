label: { ar: "الحيلة", en: "Hila (legal device)", ur: "حیلہ" }
summary:
  ar: "الحيلة لغة الحذق في تدبير الأمور وتقليب الفكر للوصول إلى المقصود، واصطلاحا سلوك طرق خفية يتوصل بها إلى حصول الغرض، وتكون في الغالب مما فيه خبث وقد تكون حكمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7495} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7496} وتفرق عن الخدعة والغرور والتدبير والكيد والمكر والتورية والذريعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7496} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7497} وتنقسم الحيل باعتبار مشروعيتها إلى مشروعة ومحرمة؛ فالمشروعة ما يتخلص بها من المآثم أو يتوصل بها إلى الحلال والحقوق، ولا تهدم أصلا مشروعا؛ ومنها ما تكون الحيلة محرمة ويقصد بها المشروع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7497}  والحيل المشروعة ثلاثة أنواع، منها ما تكون محرمة في نفسها ويقصد بها المشروع، ومنها ما تكون مباحة ويقصد بها محرم، ومنها ما تكون غير موضوعة للمحرم؛ والأولى كالشهادة الزور في إثبات الحق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7497} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7498} وتستدل المدونة بأدلة إباحة الحيل المشروعة: كالتحيل على التخلص من الكفار، ومباشرة الأسباب المشروعة، والتحيل على إحراز الدم بكلمة الكفر عند الإكراه، والخروج من الحرام إلى الحلال كحيلة أيوب في الضغث وحيلة التمر الجنيب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7498} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7499} وتقوم الحيل المحرمة على المخادعة والتلبيس، ومن أمثلتها التحليل في النكاح، وبيع العينة، وتحايل اليهود على الشحوم، وحيلتهم في السبت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7499} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7500} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7501}"
  en: "Hila (legal device) is lexically skill in arranging affairs and turning the mind to reach the aim; technically it is a hidden path to an end, often with some baseness but sometimes wisdom. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7495} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7496} It is distinguished from deceit, delusion, planning, plotting, guile, allusion and the means to evil (dhari'a). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7496} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7497} Devices are lawful or unlawful by their standing: lawful devices free one from sin or reach what is lawful or due, and do not undo a lawful principle; some are unlawful means to a lawful end. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7497}  Devices are of three kinds: one is unlawful in itself but aimed at a lawful end, like a false witness brought to prove a right; one is lawful in itself but aimed at a forbidden end, like travelling to rob; one is not meant for the forbidden but used for it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7497} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7498} Lawful devices are backed by proofs: escape from the unbelievers, the use of lawful causes, the utterance of unbelief under compulsion to save life, and escape from the unlawful to the lawful as in the case of the sick man's bundle of twigs and the Khaybar dates. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7498} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7499} Unlawful devices rest on deceit and fraud; examples include the marriage of the one who restores a divorced wife, the 'sale of return' (inah), the Jews' trick with fat, and their trick on the Sabbath. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7499} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7500} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7501}"
  ur: "حیلہ لغت میں امور کی تدبیر میں مہارت اور مقصد تک پہنچنے کے لیے ذہن کو گھمانا ہے، اور اصطلاح میں ایسے پوشیدہ راستے اختیار کرنا جن سے مقصد حاصل ہو، جو اکثر کسی خباثت میں ہوتا ہے مگر کبھی حکمت پر مبنی بھی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7495} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7496} یہ دھوکہ، غرور، تدبیر، کید، مکر، توریہ اور ذریعہ سے ممیز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7496} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7497} حیلے اپنی حیثیت کے لحاظ سے جائز یا ناجائز ہیں؛ جائز حیلے گناہ سے بچاتے ہیں یا حلال و حق تک پہنچاتے ہیں اور کوئی جائز اصل نہیں ڈھاتے؛ اور بعض حیلے ناجائز ذرائع ہوتے ہیں جو جائز مقصد کے لیے کیے جائیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7497}  حیلوں کی تین اقسام ہیں: ایک وہ جو خود ناجائز ہے اور مقصد جائز کے لیے ہو، جیسے جھوٹی گواہی سے حق ثابت کرنا؛ دوسری وہ جو خود جائز ہو مگر مقصد ناجائز ہو، جیسے ڈاکے کے لیے سفر؛ تیسری وہ جو ناجائز کے لیے بنائی ہی نہ گئی ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7497} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7498} جائز حیلوں کے دلائل: کفار سے نجات کی تدبیر، جائز اسباب کو اختیار کرنا، جبر میں کلمہ کفر سے جان بچانا، اور حرام سے حلال کی طرف نکلنا جیسے حضرت ایوب کی جھاڑو کی مثال اور خیبر کی کھجوروں کا واقعہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7498} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7499} ناجائز حیلے دھوکہ اور فریب پر مبنی ہیں؛ ان کی مثالیں نکاح میں حلالہ، بیع عینہ، یہود کا چربی کا حیلہ اور سبت کا حیلہ ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7499} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7500} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7501}"
