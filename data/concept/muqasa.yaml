label: { ar: "المُقَاصَّة", en: "Set-off of debts (muqasa)", ur: "مُقاصّہ ⁦(قرض کی باہمی ادائیگی)⁩", es: "Compensación de deudas (muqasa)", fr: "Compensation des dettes (muqasa)", tr: "açıklık", id: "pembersihan" }
summary:
  ar: "المقاصة في اللغة مصدر قاصه، وفي الاصطلاح إسقاط دين مطلوب لشخص على غريمه في مقابلة دين مطلوب من ذلك الشخص لغريمه، وهي طريقة من طرق قضاء الديون. وهي جائزة بالمنقول والمعقول، وتكون اختيارية بتراضي المتداينين أو جبرية بتقابل الدينين بشروط. وقد اختلف الفقهاء في شروطها بحسب الجنس والوصف والحلول والأجل، وطبقوها على الزكاة والنفقة والغصب والوديعة والوكالة والسلم والكفالة والوقف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14891} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14892} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14893} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14902}"
  en: "Muqasa is the set-off of a debt owed to a person against a debt that person owes his debtor, one of the ways debts are discharged. It is lawful by transmitted and rational evidence, voluntary by the consent of both parties or compelled when two debts meet under conditions. The jurists differ on the conditions by kind, quality, due date and term, and apply it to zakat, maintenance, usurpation, deposits, agency, salam, guarantee, waqf and bequest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14891} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14892} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14893} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14902}"
  ur: "مُقاصّہ دو قرضوں کو ایک دوسرے کے مقابل ساقط کرنا ہے۔ یہ جائز ہے اور اس کی شرائط جنس، وصف، حلول اور مدت کے اعتبار سے فقہاء کے ہاں مختلف ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14891} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14893}"
  es: "Muqasa es la compensación de una deuda contraída con una persona por una deuda que esa persona tiene con su deudor, una de las formas en que se cancelan las deudas. Es lícita mediante prueba transmitida y racional, voluntaria por consentimiento de ambas partes o forzosa cuando dos deudas coinciden bajo ciertas condiciones. Los juristas difieren en las condiciones según el tipo, la calidad, la fecha de vencimiento y el plazo, y la aplican al zakat, la manutención, la usurpación, los depósitos, la agencia, el salam, la garantía, el waqf y el legado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14891} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14892} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14893} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14902}"
  fr: "La muqasa est la compensation d'une dette due à une personne par une dette que cette personne doit à son débiteur; c'est l'un des moyens d'acquitter une dette. Elle est licite sur la base de preuves transmises et rationnelles, volontaire avec le consentement des deux parties, ou imposée lorsque deux dettes se rejoignent sous certaines conditions. Les juristes divergent quant à ces conditions, qui varient selon la nature, la nature, l'échéance et la durée de la compensation. La muqasa s'applique notamment à la zakat, à la pension alimentaire, à l'usurpation, aux dépôts, au mandat, au salam, à la garantie, au waqf et au legs."
  tr: "Dilbilimde 'mukassah', 'kasah' ('kasah') kelimesinin fiil isimidir ve terminolojide, bir kişinin rakibine olan borcundan feragat edilmesi ve borçların tasfiye yöntemidir. Bu, devretme ve makul bir bedel yoluyla kabul edilebilir ve alacaklıların karşılıklı rızasıyla gönüllü olabilir veya iki borcun karşılıklı karşılıklılığı ile zorunlu olabilir. Hukukçular, cinsiyet, tanım, vade tarihleri açısından şartlarda farklılık göstermiş ve bunu zekat, nafaka, gasp, mevduat, acente, barış, garanti ve vakıf için uygulamışlardır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.14891} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14892} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14893} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14902}"
  id: "Dalam linguistik, 'mukassah' adalah kata benda dari 'qasah' ('qasah'), dan dalam terminologi, ini adalah penghapusan utang yang dimiliki seseorang kepada lawannya, serta merupakan metode penyelesaian utang. Ini diperbolehkan melalui transfer dan pertimbangan yang wajar, dan dapat bersifat sukarela atas persetujuan bersama para kreditur atau wajib melalui timbal balik dua utang dengan syarat. Para ahli hukum berbeda pendapat mengenai syaratnya berdasarkan jenis kelamin, deskripsi, tanggal jatuh tempo, dan telah menerapkannya pada zakat, alimony, pengambilalihan, deposit, agensi, perdamaian, jaminan, dan wakaf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14891} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14892} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14893} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14902}"
