id: concept/muqasa
class: concept
kind: legal
label: { ar: "المُقَاصَّة", en: "Set-off of debts (muqasa)", ur: "مُقاصّہ (قرض کی باہمی ادائیگی)" }
summary:
  ar: "المقاصة في اللغة مصدر قاصه، وفي الاصطلاح إسقاط دين مطلوب لشخص على غريمه في مقابلة دين مطلوب من ذلك الشخص لغريمه، وهي طريقة من طرق قضاء الديون. وهي جائزة بالمنقول والمعقول، وتكون اختيارية بتراضي المتداينين أو جبرية بتقابل الدينين بشروط. وقد اختلف الفقهاء في شروطها بحسب الجنس والوصف والحلول والأجل، وطبقوها على الزكاة والنفقة والغصب والوديعة والوكالة والسلم والكفالة والوقف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14891} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14892} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14893} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14902}"
  en: "Muqasa is the set-off of a debt owed to a person against a debt that person owes his debtor, one of the ways debts are discharged. It is lawful by transmitted and rational evidence, voluntary by the consent of both parties or compelled when two debts meet under conditions. The jurists differ on the conditions by kind, quality, due date and term, and apply it to zakat, maintenance, usurpation, deposits, agency, salam, guarantee, waqf and bequest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14891} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14892} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14893} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14902}"
  ur: "مُقاصّہ دو قرضوں کو ایک دوسرے کے مقابل ساقط کرنا ہے۔ یہ جائز ہے اور اس کی شرائط جنس، وصف، حلول اور مدت کے اعتبار سے فقہاء کے ہاں مختلف ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14891} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14893}"
