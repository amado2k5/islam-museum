label:
  ar: "اللُّحُوق"
  en: "Attachment of descent (luhuq), fiqh rulings"
  ur: "لحوق ⁦(نسب کا ثبوت، فقہی احکام)⁩"
  es: "Adhesión de la descendencia (luhuq), normas de fiqh"
  fr: "Attachement de filiation (luhuq), règles de fiqh"
  tr: "yetişmek"
  id: "mengejar ketertinggalan"
summary:
  ar: "اللحوق في اللغة الإدراك، وكل شيء أدرك شيئاً فهو لاحق به؛ ويستعمل الفقهاء المادة في ثبوت النسب، والتحاق الذمي والمرتد بدار الحرب، وإلحاق جنين المذكاة بأمه في الحل، وإلحاق صغار السائمة في الزكاة، ولحوق توابع المبيع به، وعند الأصوليين بمعنى القياس {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13589}."
  en: "Luhuq, in lexicon, is attaining or overtaking; jurists use the root for the attachment of descent, for a dhimmi or apostate going over to the land of war, for attaching the foetus of a slaughtered animal to its dam for lawfulness, for attaching young grazing animals to the zakat count, for attaching accessories to a sale, and in the usul sense for analogy {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13589}."
  ur: "لحوق لغت میں ادراک کو کہتے ہیں، اور جو چیز کسی کو پا لے وہ اس کے ساتھ لاحق ہے؛ فقہاء یہ مادہ نسب کے ثبوت، ذمی اور مرتد کے دارالحرب جانے، جانور کے جنین کو ماں کے ساتھ حلت میں لاحق کرنے، زکوٰۃ میں چھوٹے مویشیوں کو ملانے، فروخت کی ضمنی چیزوں کے لحوق، اور اصولیین کے ہاں قیاس کے معنی میں استعمال کرتے ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13589}۔"
  es: "Luhuq, en léxico, es alcanzar o superar; los juristas usan la raíz para la vinculación de la descendencia, para un dhimmi o apóstata que pasa a la tierra de guerra, para vincular el feto de un animal sacrificado a su madre para la licitud, para vincular los animales jóvenes de pastoreo al conteo del zakat, para vincular accesorios a una venta y en el sentido usul para analogía {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13589}."
  fr: "Luhuq, dans le lexique, signifie atteindre ou rattraper; les juristes utilisent la racine pour l'attachement de la descendance, pour un dhimmi ou un apostat passant au pays de la guerre, pour attacher le fœtus d'un animal abattu à sa mère pour la légalité, pour attacher les jeunes animaux de pâturage au calcul de la zakat, pour attacher les accessoires à une vente, et dans le sens usul pour l'analogie {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13589}."
  tr: "Dilde 'birleşmek' algı anlamına gelir ve bir şeye ulaşan her şey onunla ilişkilidir. Hukukçular kökü soyu belirlemek için kullanırlar; bir zimmi ile dinden dönmenin savaş yerine bağlanması, bir kadının fetusunun annesine yasal statüde bağlanması, genç kadınların zekata bağlanması, satılan zekatı satan kişinin akrabalarının bağlanması ve usul bilginlerine göre bu benzetme anlamına gelir {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.13589}."
  id: "Dalam bahasa, 'penggabungan' berarti persepsi, dan segala sesuatu yang mencapai sesuatu berkaitan dengannya. Para ahli hukum menggunakan akar kata untuk menetapkan garis keturunan, penggabungan dhimmi dan murtad dengan tempat perang, pengikatan janin wanita dengan ibunya dalam status hukum, keterikatan wanita muda pada zakat, keterikatan kerabat yang menjualnya, dan menurut para sarjana usul, ini berarti analogi {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13589}."
