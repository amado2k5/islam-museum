id: concept/luhuq-nasab-fiqh
class: concept
kind: legal
label:
  ar: "اللُّحُوق"
  en: "Attachment of descent (luhuq), fiqh rulings"
  ur: "لحوق (نسب کا ثبوت، فقہی احکام)"
summary:
  ar: "اللحوق في اللغة الإدراك، وكل شيء أدرك شيئاً فهو لاحق به؛ ويستعمل الفقهاء المادة في ثبوت النسب، والتحاق الذمي والمرتد بدار الحرب، وإلحاق جنين المذكاة بأمه في الحل، وإلحاق صغار السائمة في الزكاة، ولحوق توابع المبيع به، وعند الأصوليين بمعنى القياس {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13589}."
  en: "Luhuq, in lexicon, is attaining or overtaking; jurists use the root for the attachment of descent, for a dhimmi or apostate going over to the land of war, for attaching the foetus of a slaughtered animal to its dam for lawfulness, for attaching young grazing animals to the zakat count, for attaching accessories to a sale, and in the usul sense for analogy {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13589}."
  ur: "لحوق لغت میں ادراک کو کہتے ہیں، اور جو چیز کسی کو پا لے وہ اس کے ساتھ لاحق ہے؛ فقہاء یہ مادہ نسب کے ثبوت، ذمی اور مرتد کے دارالحرب جانے، جانور کے جنین کو ماں کے ساتھ حلت میں لاحق کرنے، زکوٰۃ میں چھوٹے مویشیوں کو ملانے، فروخت کی ضمنی چیزوں کے لحوق، اور اصولیین کے ہاں قیاس کے معنی میں استعمال کرتے ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13589}۔"
