label: { ar: "القلاع عند الصبيان عند ابن سينا", en: "Thrush in infants in the Canon", ur: "قانون میں بچوں کے منہ کے چھالے", es: "Zorzal en bebés en el Canon", fr: "Muguet chez les nourrissons dans le Canon" }
summary:
  ar: "يبين ابن سينا أن قلاع الصبيان كثير لرقة غشاء الفم واللسان، وأن أردأه الفحمي الأسود القاتل وأسلمه الأبيض والأحمر، ويذكر أدوية مجففة ومنظفة بالتدريج من الأخف إلى الأقوى {cite:canon-ibn-sina-print-v1 pp.214-215}."
  en: "Ibn Sina explains that thrush is frequent in infants because the lining of the mouth and tongue is so soft, that the worst kind is the black, charcoal-like and deadly one and the safest the white and the red, and he lists drying and cleansing remedies from the lightest to the stronger {cite:canon-ibn-sina-print-v1 pp.214-215}."
  es: "Ibn Sina explica que la candidiasis es frecuente en los bebés porque el revestimiento de la boca y la lengua es muy suave, que el peor tipo es el negro, parecido al carbón y mortal, y el más seguro el blanco y el rojo, y enumera remedios secantes y limpiadores desde el más suave hasta el más fuerte {cite:canon-ibn-sina-print-v1 pp.214-215}."
  fr: "Ibn Sina explique que le muguet est fréquent chez les nourrissons parce que la muqueuse de la bouche et de la langue est si douce, que le pire type est le noir, semblable à du charbon et mortel, et les plus sûrs le blanc et le rouge, et il énumère les remèdes asséchants et nettoyants du plus léger au plus fort {cite:canon-ibn-sina-print-v1 pp.214-215}."
