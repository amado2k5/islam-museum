summary:
  ar: "يبين ابن سينا أن قلاع الصبيان كثير لرقة غشاء الفم واللسان، وأن أردأه الفحمي الأسود القاتل وأسلمه الأبيض والأحمر، ويذكر أدوية مجففة ومنظفة بالتدريج من الأخف إلى الأقوى {cite:canon-ibn-sina-print-v1 pp.214-215}."
  en: "Ibn Sina explains that thrush is frequent in infants because the lining of the mouth and tongue is so soft, that the worst kind is the black, charcoal-like and deadly one and the safest the white and the red, and he lists drying and cleansing remedies from the lightest to the stronger {cite:canon-ibn-sina-print-v1 pp.214-215}."
