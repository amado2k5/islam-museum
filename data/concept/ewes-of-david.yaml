summary:
  ar: "دخل الخصمان على داود: لأحدهما تسع وتسعون نعجة وللآخر نعجة واحدة يطلب أن يضمّها إلى نعاجه فحكم داود بظلمه ثم أدرك أنه افتُتن فاستغفر ربه."
  en: "Two litigants climbed into David's sanctuary: one had ninety-nine ewes, the other one ewe which the first sought to add to his own. David judged the first unjust, then knew he had been tried and asked his Lord's forgiveness."
  ur: "دو جھگڑنے والے داؤد کے محراب میں چڑھ آئے: ایک کے پاس ننانوے بھیڑیں تھیں اور دوسرے کی ایک بھیڑ جسے پہلا اپنے ریوڑ میں ملانا چاہتا تھا۔ داؤد نے پہلے کو ظالم ٹھہرایا پھر جان گئے کہ آزمائے گئے اور اپنے رب سے بخشش مانگی۔"
