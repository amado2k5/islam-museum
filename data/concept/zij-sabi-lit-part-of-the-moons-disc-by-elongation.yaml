label: { ar: "الجزء المضيء من قرص القمر بحسب بُعده عن الشمس", en: "The lit part of the Moon's disc by its elongation from the Sun", ur: "سورج سے فاصلے کے لحاظ سے چاند کے قرص کا روشن حصہ", es: "La parte iluminada del disco de la Luna por su elongación desde el Sol." }
summary:
  ar: "يقدّر البتاني الجزء المضيء من قرص القمر الذي يُرى من الأرض بأجزاء من خمسة عشر جزءاً، فيكون الضوء كاملاً عند الخمس عشرة، ويعطي نسبتين لمقدار البعد الذي يزيد جزءاً واحداً من الضوء، وإحداهما مشوشة في المسح الضوئي. {cite:zij-sabi-nallino-byblion p.94}."
  en: "Al-Battani measures the lit part of the Moon's disc seen from the Earth in parts of fifteen, so that full light is fifteen. He gives two ratios for how much elongation adds one part of light, and one of them is damaged in the scan. {cite:zij-sabi-nallino-byblion p.94}."
  ur: "البتانی زمین سے دکھائی دینے والے چاند کے قرص کے روشن حصے کو پندرہ اجزاء میں ناپتے ہیں، تو پورا نور پندرہ پر ہوتا ہے۔ وہ دو نسبتیں دیتے ہیں کہ کتنی درازی سے روشنی کا ایک جزو بڑھتا ہے، جن میں سے ایک اسکین میں خراب ہے۔ {cite:zij-sabi-nallino-byblion p.94}۔"
  es: "Al-Battani mide la parte iluminada del disco lunar vista desde la Tierra en fracciones de quince, de modo que la luz plena equivale a quince. Proporciona dos proporciones para calcular cuánta elongación añade una fracción de luz, y una de ellas está dañada en el escaneo. {cite:zij-sabi-nallino-byblion p.94}."
