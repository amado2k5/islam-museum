label:
  ar: التطير والفرع
  en: Tatayyur — ill omens
  ur: تطیر
summary:
  ar: "التطير شرك صغير نهى عنه النبي وأبطله: الطيرة ليست بشيء وخيرها الفأل الحسن؛ من ردته الطيرة فقد أشرك — فرق بين بشارة ترسلها الله ووهن يزرعه الشيطان {cite:sunan-abi-dawud} {cite:sahih-al-bukhari}."
  en: "Ill-omen belief is minor shirk the Prophet abolished: the omen is nothing, and its best is the good word; whoever lets an omen turn him back has associated partners — the line between God's glad tiding and Satan's seed of weakness {cite:sunan-abi-dawud} {cite:sahih-al-bukhari}."
  ur: "بدشگونی لینا نبی نے منسوخ کر دیا چھوٹا شرک ہے: تطیر کچھ نہیں، اس کا بہترین حصہ اچھے الفاظ کی نیک فال ہے؛ جسے تطیر نے روک دیا اس نے شرک کیا — اللہ کی بشارت اور شیطان کے کمزوری کے بیج میں فرق {cite:sunan-abi-dawud} {cite:sahih-al-bukhari}۔"
