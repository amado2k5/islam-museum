id: concept/al-tatayyur
class: concept
kind: belief
label:
  ar: التطير والفرع
  en: Tatayyur — ill omens
  fr: "Tatayyur : croyance aux mauvais présages"
  ur: تطیر
  es: "Tatayyur — malos presagios"
summary:
  ar: "التطير شرك صغير نهى عنه النبي وأبطله: الطيرة ليست بشيء وخيرها الفأل الحسن؛ من ردته الطيرة فقد أشرك — فرق بين بشارة ترسلها الله ووهن يزرعه الشيطان {cite:sunan-abi-dawud} {cite:sahih-al-bukhari}."
  en: "Ill-omen belief is minor shirk the Prophet abolished: the omen is nothing, and its best is the good word; whoever lets an omen turn him back has associated partners — the line between God's glad tiding and Satan's seed of weakness {cite:sunan-abi-dawud} {cite:sahih-al-bukhari}."
  fr: "La croyance aux mauvais présages est une forme mineure d’associationnisme (shirk) que le Prophète a abolie : le présage ne vaut rien et ce qu’il a de meilleur est la bonne parole ; celui qui se laisse détourner par un présage a donné des associés à Dieu. Le texte oppose ainsi la bonne nouvelle que Dieu envoie au découragement que sème Satan {cite:sunan-abi-dawud} {cite:sahih-al-bukhari}."
  ur: "بدشگونی لینا نبی نے منسوخ کر دیا چھوٹا شرک ہے: تطیر کچھ نہیں، اس کا بہترین حصہ اچھے الفاظ کی نیک فال ہے؛ جسے تطیر نے روک دیا اس نے شرک کیا — اللہ کی بشارت اور شیطان کے کمزوری کے بیج میں فرق {cite:sunan-abi-dawud} {cite:sahih-al-bukhari}۔"
  es: "La creencia en malos presagios es un shirk menor que el Profeta abolió: el presagio no es nada, y lo mejor es la buena palabra; quien deja que un presagio lo haga retroceder tiene socios asociados: la línea entre la buena nueva de Dios y la semilla de debilidad de Satanás {cite:sunan-abi-dawud} {cite:sahih-al-bukhari}."
