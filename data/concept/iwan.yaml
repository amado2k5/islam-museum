summary:
  ar: "قاعة مقبوة مفتوحة الواجهة على صحن، عنصر قديم يرجع إلى العمارة البارثية والساسانية قبل الإسلام، صار صحن الإيوانات من فارس أساس المدارس في القاهرة {cite:yeomans-islamic-cairo-2006 p.116}."
  en: "An open-fronted vaulted hall facing a courtyard, an ancient element going back to Parthian and Sassanian architecture; the Persian iwan-courtyard plan became the basis of Cairo's madrasas {cite:yeomans-islamic-cairo-2006 p.116}."
  es: "Una sala abovedada con la fachada abierta que da a un patio, un elemento antiguo que se remonta a la arquitectura parta y sasánida; el plano persa de iwan-patio se convirtió en la base de las madrasas de El Cairo {cite:yeomans-islamic-cairo-2006 p.116}."
  fr: "Une salle voûtée ouverte sur une cour, un élément ancien remontant à l'architecture parthe et sassanide; le plan persan iwan-cour intérieure est devenu la base des madrasas du Caire {cite:yeomans-islamic-cairo-2006 p.116}."
  ur: "ایک کھلا سامنے والا والٹڈ ہال جس کے سامنے صحن ہے، ایک قدیم عنصر جو پارتھین اور ساسانی فن تعمیر کی طرف جاتا ہے۔ فارسی ایوان صحن کا منصوبہ قاہرہ کے مدارس کی بنیاد بنا۔"
  tr: "Avluda açık cepheli, tonozlu bir salon, İslam öncesi Part ve Sasani mimarisine dayanan eski bir unsurdur. Faris'ten gelen iwanların avlusu, Kahire'deki okulların temelini oluşturdu {cite:yeomans-Islamic-cairo-2006 s.116}."
  id: "Aula berkubah dengan fasad terbuka di halaman, elemen kuno yang berasal dari arsitektur Parthia dan Sassanian sebelum Islam. Halaman para iwan dari Faris menjadi dasar sekolah-sekolah di Kairo {cite:yeomans-Islamic-cairo-2006 hlm.116}."
