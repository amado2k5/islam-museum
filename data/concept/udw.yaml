id: concept/udw
class: concept
kind: legal
label:
  ar: "العُضْو"
  en: "The limb (udw) and its rulings in purity, injury and burial"
  ur: "عضو (جسم کا حصہ)"
summary:
  ar: "العضو في اللغة كل عظم وافر باللحم، سواء من إنسان أو حيوان، وأصله القطع والتفريق، ويطلق على جزء متميز من جسد الإنسان أو الحيوان {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11653}. ومن أحكامه في الطهارة أن الفرض يتعلق بالباقي من العضو المقطوع، فإن قطع من فوق المرفق أو الكعب سقط الغسل عما قطع، وعند المالكية لا يغسل المقطوع من المرفق، واتفق الفقهاء على أن الزائد إذا نبت في محل الفرض وجب غسله، واختلفوا في غير محل الفرض {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11654} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11655}. والعضو المبان من الحي يدفن بغير غسل وصلاة، أما من الميت فإن وجد أكثر من نصفه غسل وصلي عليه عند الحنفية، وعند الشافعية والحنابلة يصلى على كل عضو من مسلم علم موته {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11655} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11656}. والعضو المبان من الحيوان الحي ميتة إلا السمك والجراد، ومن الإنسان يجب فيه القصاص عمداً إن أمكن التماثل، والدية أو الأرش فيما سوى ذلك {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11656}."
  en: "In the lexicon, udw is any bone surrounded by flesh, of a person or an animal; its root sense is cutting and separating, and it refers to a distinct part of the body {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11653}. In purity, the duty of washing attaches to what remains of an amputated limb: if the cut is above the elbow or ankle, washing of what is cut off falls away; the Malikis do not wash the stump of an elbow {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11654}. The jurists agree that an extra limb growing in the place of washing must be washed; they differ when it grows elsewhere {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11654} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11655}. A limb separated from a living person is buried without washing or prayer; for a dead person's separated part, the Hanafis and Malikis wash and pray over it only where it is more than half the body, while the Shafi'is and the main Hanbali view pray over any part of a dead Muslim whose death is known {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11655} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11656}. A limb cut from a living animal is carrion, except fish and locusts; a human limb is subject to retaliation when deliberately injured where it can be matched, and otherwise to blood-money or an assessed award {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11656}."
