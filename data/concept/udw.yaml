id: concept/udw
class: concept
kind: legal
label:
  ar: "العُضْو"
  en: "The limb (udw) and its rulings in purity, injury and burial"
  ur: "عضو ⁦(جسم کا حصہ)⁩"
  es: "La extremidad (udw) y sus normas en materia de pureza, lesiones y entierro."
  fr: "Le membre (udw) et ses règles en matière de pureté, de blessure et d'inhumation"
  tr: "üye"
  id: "anggota"
summary:
  ar: "العضو في اللغة كل عظم وافر باللحم، سواء من إنسان أو حيوان، وأصله القطع والتفريق، ويطلق على جزء متميز من جسد الإنسان أو الحيوان {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11653}. ومن أحكامه في الطهارة أن الفرض يتعلق بالباقي من العضو المقطوع، فإن قطع من فوق المرفق أو الكعب سقط الغسل عما قطع، وعند المالكية لا يغسل المقطوع من المرفق، واتفق الفقهاء على أن الزائد إذا نبت في محل الفرض وجب غسله، واختلفوا في غير محل الفرض {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11654} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11655}. والعضو المبان من الحي يدفن بغير غسل وصلاة، أما من الميت فإن وجد أكثر من نصفه غسل وصلي عليه عند الحنفية، وعند الشافعية والحنابلة يصلى على كل عضو من مسلم علم موته {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11655} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11656}. والعضو المبان من الحيوان الحي ميتة إلا السمك والجراد، ومن الإنسان يجب فيه القصاص عمداً إن أمكن التماثل، والدية أو الأرش فيما سوى ذلك {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11656}."
  en: "In the lexicon, udw is any bone surrounded by flesh, of a person or an animal; its root sense is cutting and separating, and it refers to a distinct part of the body {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11653}. In purity, the duty of washing attaches to what remains of an amputated limb: if the cut is above the elbow or ankle, washing of what is cut off falls away; the Malikis do not wash the stump of an elbow {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11654}. The jurists agree that an extra limb growing in the place of washing must be washed; they differ when it grows elsewhere {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11654} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11655}. A limb separated from a living person is buried without washing or prayer; for a dead person's separated part, the Hanafis and Malikis wash and pray over it only where it is more than half the body, while the Shafi'is and the main Hanbali view pray over any part of a dead Muslim whose death is known {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11655} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11656}. A limb cut from a living animal is carrion, except fish and locusts; a human limb is subject to retaliation when deliberately injured where it can be matched, and otherwise to blood-money or an assessed award {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11656}."
  es: "En el léxico, udw es cualquier hueso rodeado de carne, de una persona o un animal; su sentido raíz es cortar y separar, y se refiere a una parte distinta del cuerpo {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11653}. En pureza, el deber de lavar se aplica a lo que queda de una extremidad amputada: si el corte está por encima del codo o el tobillo, se elimina el lavado de lo cortado; los malikíes no lavan el muñón de un codo {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11654}. Los juristas concuerdan en que una extremidad adicional que crece en el lugar del lavado debe lavarse; difieren cuando crece en otro lugar {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11654} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11655}. Una extremidad separada de una persona viva se entierra sin lavar ni rezar; para la parte separada de una persona muerta, los hanafíes y malikíes lavan y rezan sobre ella solo cuando es más de la mitad del cuerpo, mientras que los shafi'ís y la visión principal hanbalí rezan sobre cualquier parte de un musulmán muerto cuya muerte se conoce {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11655} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11656}. Una extremidad cortada de un animal vivo es carroña, excepto peces y langostas; Una extremidad humana está sujeta a represalias cuando se lesiona deliberadamente, siempre que se pueda igualar, y de lo contrario a una indemnización por sangre o una compensación evaluada {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11656}."
  fr: "Dans le lexique, udw désigne tout os entouré de chair, qu'il appartienne à une personne ou à un animal; son sens premier est « couper » et « séparer », et il se réfère à une partie distincte du corps {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11653}. En matière de pureté, le devoir de lavage s'applique à ce qui reste d'un membre amputé: si la coupure se situe au-dessus du coude ou de la cheville, le lavage de la partie coupée est dispensé; les Malikites ne lavent pas le moignon d'un coude {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11654}. Les juristes s'accordent à dire qu'un membre supplémentaire poussant à l'endroit où le lavage est effectué doit également être lavé. Les règles diffèrent selon que la plante pousse ailleurs {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11654} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11655}. Un membre séparé d'une personne vivante est enterré sans ablution ni prière; pour la partie séparée d'une personne décédée, les hanafites et les malikites ne lavent et ne prient dessus que si elle représente plus de la moitié du corps, tandis que les chaféites et l'école hanbalite majoritaire prient sur toute partie d'un musulman décédé dont le décès est connu {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11655} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11656}. Un membre coupé d'un animal vivant est considéré comme de la charogne, à l'exception des poissons et des sauterelles. un membre humain est sujet à des représailles lorsqu'il est délibérément blessé lorsqu'il peut être égalé, et sinon à une prime de sang ou à une indemnité évaluée {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11656}."
  ur: "لغت میں، udw کسی بھی ہڈی کو کہتے ہیں جو گوشت سے گھری ہوئی ہو، کسی شخص یا جانور کی؛ اس کی جڑ کاٹنا اور الگ کرنا ہے، اور اس سے مراد جسم کے ایک الگ حصے کی طرف ہے طہارت میں، کٹے ہوئے اعضاء کی باقیات کو دھونے کا فرض ہے: اگر کٹ کہنی یا ٹخنے سے اوپر ہو تو کٹی ہوئی چیز کا دھونا ضائع ہو جاتا ہے۔ مالکی کہنی کا سٹمپ نہیں دھوتے۔ فقہاء اس بات پر متفق ہیں کہ دھونے کی جگہ پر بڑھنے والے اعضاء کو دھونا ضروری ہے۔ جب یہ کسی اور جگہ بڑھتا ہے تو ان میں اختلاف ہوتا ہے {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11654} زندہ شخص سے الگ ہونے والا عضو دھوئے یا نماز کے بغیر دفن کیا جاتا ہے۔ میت کے الگ الگ حصے کے لیے احناف اور مالکیہ صرف اس جگہ پر غسل کرتے ہیں جہاں وہ نصف سے زیادہ ہو، جبکہ شافعی اور مرکزی حنبلی مسلک کے نزدیک مردہ مسلمان کے کسی ایسے عضو پر نماز پڑھی جاتی ہے جس کی موت معلوم ہو۔ صفحہ 11656}۔ مچھلی اور ٹڈیوں کے علاوہ زندہ جانور سے کاٹا جانے والا عضو مردار ہے۔ انسانی اعضاء کو انتقامی کارروائی کا نشانہ بنایا جاتا ہے جب جان بوجھ کر زخمی کیا جاتا ہے جہاں اس کا مقابلہ کیا جا سکتا ہے، اور دوسری صورت میں خون کی رقم یا تشخیص شدہ ایوارڈ کے لیے"
  tr: "Dilde, organ, insan ya da hayvandan olsun, et açısından zengin herhangi bir kemiktir ve kökeni kesim ve ayrımdır. İnsan veya hayvan vücudunun ayrı bir bölümünü ifade eder {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11653}. Arınma ile ilgili kararlarından biri, zorunlu yükümlülüğün kesilen uzvun kalan kısmına uygulanmasıdır. Eğer dirsek veya topuk üzerinde kesilirse, kesilen parçadan yıkama kaldırılır; oysa Malikis'e göre kesilen kısım dirsekten yıkanmaz. Hukukçular, zorunlu eylem yerine fazlalık oluşursa yıkanması gerektiği konusunda hemfikirdir, ancak zorunlu olmayan durumlarda farklı görüşler vardır {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11655}. Canlı bir uzuv, yıkanmadan veya namaz yapılmadan gömülür. Ölü bir uzuv ise yarıdan fazlası bulunursa, Hanefilere göre yıkanır ve üzerinde namaz kılılır. Şafi'ler ve Hanelilere göre, cenaze naması ölümünü bilen her Müslüman üyesi üzerine kılınır {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11655} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11656}. Yaşayan uzuv, balıklar ve çekirgeler dışında ölüdür ve insanların mümkünse intikam, kan parası veya başka bir şey için tazminat talep etmesi kasıtlıdır {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11656}."
  id: "Dalam bahasa, organ adalah tulang yang kaya daging, baik dari manusia maupun hewan, dan asalnya adalah pemotongan dan pemisahan. Organ ini merujuk pada bagian tubuh manusia atau hewan yang berbeda {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11653}. Di antara putusan tentang pemurnian adalah bahwa kewajiban wajib berlaku untuk bagian anggota tubuh yang diamputasi. Jika dipotong di atas siku atau tumit, pencucian dibebaskan dari potongan yang dipotong, sedangkan menurut Malikis, bagian yang dipotong tidak dicuci dari siku. Para ahli hukum sepakat bahwa jika kelebihan tumbuh menggantikan tindakan wajib, maka harus dicuci, tetapi mereka berbeda dalam kasus yang tidak wajib {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11655}. Anggota tubuh yang masih hidup dikuburkan tanpa dicuci atau didoakan. Sedangkan anggota tubuh yang mati, jika ditemukan lebih dari setengahnya, maka dicuci dan didalat sesuai dengan Hanafi. Menurut Shafi'i dan Hanbali, shalat pemakaman dilakukan untuk setiap anggota Muslim yang mengetahui kematiannya {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11655} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11656}. Anggota tubuh yang masih hidup sudah mati kecuali ikan dan belalang, dan memang disengaja bagi manusia untuk mencari pembalasan jika memungkinkan, serta uang darah atau kompensasi untuk hal lain {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11656}."
