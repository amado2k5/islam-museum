summary:
  ar: "الحاشا نبات صغير شوكي، حار يابس في الثالثة، يحلّل ويقطع حتى الدم المنعقد، ويُذكر أنه يمنع اقشعرار الشتاء، وينفع من الأورام البلغمية وعرق النسا وأوجاع الصدر والهضم، ويُذكر أنه يدرّ البول والطمث ويطرد الديدان."
  en: "Hasha is a small thorny plant, hot and dry in the third degree. It dissolves and cuts even clotted blood, and the book says it stops winter shivering. It helps phlegmy swellings, sciatica, chest pains and digestion, and it is said to bring urine and the menses and expel worms."
  ur: "حاشا ایک چھوٹا کانٹے دار پودا ہے، تیسرے درجے میں گرم اور خشک۔ یہ جمے ہوئے خون تک کو تحلیل اور کاٹتا ہے، اور کتاب کہتی ہے کہ یہ سردی کی کپکپی روکتا ہے۔ بلغمی سوجن، عرق النسا، سینے کے درد اور ہضم میں مفید ہے، اور کہا گیا ہے کہ یہ پیشاب اور حیض لاتا اور کیڑے نکالتا ہے۔"
  es: "Hasha es una planta pequeña y espinosa, de naturaleza cálida y seca, perteneciente al tercer grado. Disuelve y fluidifica incluso la sangre coagulada, y el libro afirma que alivia los escalofríos invernales. Ayuda con la hinchazón causada por flemas, la ciática, los dolores de pecho y la digestión, y se dice que favorece la micción y la menstruación, además de expulsar los parásitos intestinales."
  fr: "Le haschisch est une petite plante épineuse, chaude et sèche au troisième degré. Il dissout et coupe même le sang coagulé, et le livre dit qu'il soulage les frissons hivernaux. Il aide à traiter les œdèmes purulents, la sciatique, les douleurs thoraciques et les troubles digestifs, et on dit qu'il favorise la diurèse et les menstruations et qu'il expulse les vers intestinaux."
