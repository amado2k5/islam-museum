id: concept/zij-sabi-four-forms-of-venus-and-mercury-beside-the-sun
class: concept
kind: scientific
label: { ar: "الأحوال الأربعة للزهرة وعطارد عند الشمس", en: "The four forms of Venus and Mercury beside the sun", ur: "سورج کے پاس زہرہ اور عطارد کے چار احوال", es: "Las cuatro formas de Venus y Mercurio junto al sol.", fr: "Les quatre formes de Vénus et de Mercure près du soleil", tr: "Venüs ve Merkür'ün Güneş'e göre dört evresi", id: "Empat fase Venus dan Merkurius dalam kaitannya dengan Matahari" }
summary:
  ar: "أما الزهرة فإن حاصتها المعدلة إذا كانت من صفر إلى قبة فهي في طلوع المشيات، وذلك حين تكون على أفق المغرب وهي عند ذلك أسرع حركة من الشمس. وفي الحد التالي تغرب في المساء، حين تبطئ وترجع وتلحقها الشمس، ثم تطلع في الصباح وهي أبطأ حركة من الشمس، وفي الحد الأخير تغرب بالصباح حتى تلحق الشمس وتختفي بالشعاع وهي عند ذلك أسرع حركة من الشمس. وأما عطارد فأحواله مثل ما حُدد في حال الزهرة. {cite:zij-sabi-nallino-byblion pp.180-181}"
  en: "For Venus, when the corrected anomaly runs over one range she rises in the evening, when she is on the western horizon and at her fastest. Over the next range she sets in the evening as she slows, turns back and is overtaken by the Sun; over the next she rises in the morning at her slowest; over the last she sets in the morning until the Sun overtakes her and hides her in the rays, when she is again fastest. Mercury follows the same forms as Venus. The range boundaries are given in abjad letters that are partly garbled. {cite:zij-sabi-nallino-byblion pp.180-181}"
  ur: "زہرہ کی تصحیح شدہ خاصہ جب ایک حد میں ہو تو وہ شام کو طلوع کرتی ہے، جب وہ مغربی افق پر اور سب سے تیز حرکت میں ہو۔ اگلی حد میں وہ شام کو غروب ہوتی ہے، جب سست پڑتی ہے، لوٹتی ہے اور سورج اسے پکڑ لیتا ہے؛ اس کے بعد وہ صبح کو سب سے سست حرکت میں طلوع کرتی ہے، اور آخری حد میں صبح غروب ہوتی ہے یہاں تک کہ سورج اسے شعاع میں چھپا لیتا ہے، جب وہ پھر سب سے تیز ہوتی ہے۔ عطارد کی احوال زہرہ کی طرح ہیں۔ حدوں کی حدیں ابجدی حروف میں ہیں جو جزوی طور پر بگڑی ہوئی ہیں۔ {cite:zij-sabi-nallino-byblion pp.180-181}"
  es: "Para Venus, cuando la anomalía corregida recorre una franja, sale por la tarde, cuando se encuentra en el horizonte occidental y alcanza su máxima velocidad. En la siguiente franja, se pone por la tarde a medida que disminuye su velocidad, gira y es superada por el Sol; en la siguiente, sale por la mañana en su velocidad más baja; en la última, se pone por la mañana hasta que el Sol la supera y la oculta entre sus rayos, momento en el que vuelve a alcanzar su máxima velocidad. Mercurio sigue las mismas formas que Venus. Los límites de las franjas se indican con letras abjad parcialmente ilegibles. {cite:zij-sabi-nallino-byblion pp.180-181}"
  fr: "Pour Vénus, lorsque l'anomalie corrigée s'étend sur une zone, elle se lève le soir, à l'horizon ouest, et atteint sa vitesse maximale. Sur la zone suivante, elle se couche le soir en ralentissant, puis fait demi-tour et est rattrapée par le Soleil; sur la zone suivante, elle se lève le matin à sa vitesse minimale; sur la dernière, elle se couche le matin jusqu'à ce que le Soleil la rattrape et la masque dans ses rayons, moment où elle atteint à nouveau sa vitesse maximale. Mercure suit les mêmes schémas que Vénus. Les limites des zones sont indiquées par des lettres abjad partiellement illisibles. {cite:zij-sabi-nallino-byblion pp.180-181}"
  tr: "Venüs'e gelince, sıfırdan kubbe şekline kadar ayarlanmış evresi, meridyenlerin doğuşunda, batı ufkunun üzerinde olduğunda ve o sırada güneşten daha hızlı hareket ettiğinde gerçekleşir. Bir sonraki sınırda, akşam batar, yavaşlar ve geri döner, güneş de ona yetişir. Sonra sabah doğar, güneşten daha yavaş hareket eder. Son sınırda, sabah batar, güneşe yetişene ve güneş ışığında kaybolana kadar, o sırada güneşten daha hızlı hareket eder. Merkür'e gelince, koşulları Venüs için belirlenenlere benzer. {cite:zij-sabi-nallino-byblion pp.180-181}"
  id: "Adapun Venus, fase yang disesuaikan, jika dari nol hingga kubah, adalah pada saat meridian terbit, ketika berada di atas cakrawala barat dan pada saat itu bergerak lebih cepat daripada matahari. Pada batas berikutnya, ia terbenam di malam hari, ketika melambat dan kembali, dan matahari menyusulnya. Kemudian ia terbit di pagi hari, bergerak lebih lambat daripada matahari. Pada batas terakhir, ia terbenam di pagi hari hingga menyusul matahari dan menghilang dalam cahaya matahari, dan pada saat itu bergerak lebih cepat daripada matahari. Adapun Merkurius, kondisinya serupa dengan yang ditentukan untuk Venus. {cite:zij-sabi-nallino-byblion pp.180-181}"
