label: { ar: "الأحوال الأربعة للزهرة وعطارد عند الشمس", en: "The four forms of Venus and Mercury beside the sun", ur: "سورج کے پاس زہرہ اور عطارد کے چار احوال" }
summary:
  ar: "أما الزهرة فإن حاصتها المعدلة إذا كانت من صفر إلى قبة فهي في طلوع المشيات، وذلك حين تكون على أفق المغرب وهي عند ذلك أسرع حركة من الشمس. وفي الحد التالي تغرب في المساء، حين تبطئ وترجع وتلحقها الشمس، ثم تطلع في الصباح وهي أبطأ حركة من الشمس، وفي الحد الأخير تغرب بالصباح حتى تلحق الشمس وتختفي بالشعاع وهي عند ذلك أسرع حركة من الشمس. وأما عطارد فأحواله مثل ما حُدد في حال الزهرة. {cite:zij-sabi-nallino-byblion pp.180-181}"
  en: "For Venus, when the corrected anomaly runs over one range she rises in the evening, when she is on the western horizon and at her fastest. Over the next range she sets in the evening as she slows, turns back and is overtaken by the Sun; over the next she rises in the morning at her slowest; over the last she sets in the morning until the Sun overtakes her and hides her in the rays, when she is again fastest. Mercury follows the same forms as Venus. The range boundaries are given in abjad letters that are partly garbled. {cite:zij-sabi-nallino-byblion pp.180-181}"
  ur: "زہرہ کی تصحیح شدہ خاصہ جب ایک حد میں ہو تو وہ شام کو طلوع کرتی ہے، جب وہ مغربی افق پر اور سب سے تیز حرکت میں ہو۔ اگلی حد میں وہ شام کو غروب ہوتی ہے، جب سست پڑتی ہے، لوٹتی ہے اور سورج اسے پکڑ لیتا ہے؛ اس کے بعد وہ صبح کو سب سے سست حرکت میں طلوع کرتی ہے، اور آخری حد میں صبح غروب ہوتی ہے یہاں تک کہ سورج اسے شعاع میں چھپا لیتا ہے، جب وہ پھر سب سے تیز ہوتی ہے۔ عطارد کی احوال زہرہ کی طرح ہیں۔ حدوں کی حدیں ابجدی حروف میں ہیں جو جزوی طور پر بگڑی ہوئی ہیں۔ {cite:zij-sabi-nallino-byblion pp.180-181}"
