label: { ar: "الصحة", en: "Health (al-sihha)", es: "Salud (al-sihha)", fr: "Santé (al-sihha)", ur: "صحت ⁦(الصححہ)⁩", tr: "Sağlık", id: "Kesehatan" }
summary:
  ar: "تقسم الكتب الأولى من القانون أحوال بدن الإنسان، عن جالينوس، إلى ثلاث: الصحة، والمرض، وحال متوسطة بينهما {cite:canon-ibn-sina-print-v1 p.104}. والصحة عنده هيئة يكون بها بدن الإنسان في مزاجه وتركيبه بحيث يصدر عنه الأفعال كلها صحيحة سليمة {cite:canon-ibn-sina-print-v1 p.104}. وغاية الطب أن يحفظ الصحة حاصلة ويستردّها زائلة {cite:canon-ibn-sina-print-v1 p.13}."
  en: "The first book of the Canon, citing Galen, divides the states of the body into three: health, disease, and an intermediate state between them {cite:canon-ibn-sina-print-v1 p.104}. Health is a condition in which the body, in its temperament and composition, performs all its actions correctly and soundly {cite:canon-ibn-sina-print-v1 p.104}. The aim of medicine is to keep health when it is present and to restore it when it is lost {cite:canon-ibn-sina-print-v1 p.13}."
  es: "El primer libro del Canon, citando a Galeno, divide los estados del cuerpo en tres: salud, enfermedad y un estado intermedio entre ambos {cite:canon-ibn-sina-print-v1 p.104}. La salud es un estado en el que el cuerpo, en su temperamento y composición, realiza todas sus funciones de forma correcta y sana {cite:canon-ibn-sina-print-v1 p.104}. El objetivo de la medicina es mantener la salud cuando está presente y restaurarla cuando se pierde {cite:canon-ibn-sina-print-v1 p.13}."
  fr: "Le premier livre du Canon, citant Galien, divise les états du corps en trois: la santé, la maladie et un état intermédiaire entre les deux {cite:canon-ibn-sina-print-v1 p.104}. La santé est un état dans lequel le corps, par son tempérament et sa composition, accomplit toutes ses fonctions correctement et sainement {cite:canon-ibn-sina-print-v1 p.104}. Le but de la médecine est de maintenir la santé lorsqu’elle est présente et de la rétablir lorsqu’elle est perdue {cite:canon-ibn-sina-print-v1 p.13}."
  ur: "کینن کی پہلی کتاب، گیلن کا حوالہ دیتے ہوئے، جسم کی حالتوں کو تین حصوں میں تقسیم کرتی ہے: صحت، بیماری، اور ان کے درمیان درمیانی حالت۔ صحت ایک ایسی حالت ہے جس میں جسم اپنے مزاج اور ساخت کے لحاظ سے اپنے تمام اعمال صحیح اور صحیح طریقے سے انجام دیتا ہے۔ دوا کا مقصد یہ ہے کہ جب وہ موجود ہو تو صحت کو برقرار رکھنا اور جب یہ ضائع ہو جائے تو اسے بحال کرنا ہے۔"
  tr: "Kanonun erken kitapları, Galen'e göre insan vücudunun koşullarını üçe ayırır: sağlık, hastalık ve aralarındaki ara durum {atıf:kanon-ibn-sina-print-v1 s.104}. Sağlık, insan vücudunun mizaç ve yapı bakımından tüm eylemlerin geçerli ve sağlam olduğu bir biçimdir {atıf:kanon-ibn-sina-print-v1 s.104}. Tıbbın amacı, sağlığı olduğu gibi korumak ve geçici hale getirmektir {cite:canon-ibn-sina-print-v1 s.13}."
  id: "Buku-buku awal kanon membagi kondisi tubuh manusia, menurut Galenus, menjadi tiga: kesehatan, penyakit, dan keadaan antara keduanya {cite:canon-ibn-sina-print-v1 hlm.104}. Kesehatan adalah bentuk di mana tubuh manusia berada dalam temperamen dan strukturnya, sehingga semua tindakan valid dan sehat {cite:canon-ibn-sina-print-v1 hlm.104}. Tujuan kedokteran adalah menjaga kesehatan apa adanya dan mengembalikannya ke kondisi sementara {cite:canon-ibn-sina-print-v1 hlm.13}."
