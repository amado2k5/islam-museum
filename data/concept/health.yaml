label: { ar: "الصحة", en: "Health (al-sihha)" }
summary:
  ar: "تقسم الكتب الأولى من القانون أحوال بدن الإنسان، عن جالينوس، إلى ثلاث: الصحة، والمرض، وحال متوسطة بينهما {cite:canon-ibn-sina-print-v1 p.104}. والصحة عنده هيئة يكون بها بدن الإنسان في مزاجه وتركيبه بحيث يصدر عنه الأفعال كلها صحيحة سليمة {cite:canon-ibn-sina-print-v1 p.104}. وغاية الطب أن يحفظ الصحة حاصلة ويستردّها زائلة {cite:canon-ibn-sina-print-v1 p.13}."
  en: "The first book of the Canon, citing Galen, divides the states of the body into three: health, disease, and an intermediate state between them {cite:canon-ibn-sina-print-v1 p.104}. Health is a condition in which the body, in its temperament and composition, performs all its actions correctly and soundly {cite:canon-ibn-sina-print-v1 p.104}. The aim of medicine is to keep health when it is present and to restore it when it is lost {cite:canon-ibn-sina-print-v1 p.13}."
