label: { ar: "الأكدرية", en: "Akdariyya (a named inheritance case)" }
summary:
  ar: "الأكدرية مسألة في الفرائض، ورثتها زوج وأم وجد وأخت لأب وأم أو لأب، وفيها ثلاثة مذاهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3236} مذهب زيد بن ثابت، وبه أخذ الشافعية والحنابلة، أن الأخت ترث أولا بالفرض ثم تصير عصبة مع الجد، فتصح المسألة من سبعة وعشرين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3236}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3237} وأخذ الحنفية بقول أبي بكر وابن عباس، فتسقط الأخت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3237} وقول عمر وابن مسعود أن للأخت النصف وللجد السدس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3237}"
  en: "Akdariyya is a named case in inheritance involving a husband, a mother, a grandfather and a full or paternal sister, with three positions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3236} Zayd ibn Thabit's view, followed by the Shafi'is and Hanbalis, makes the sister a sharer first and then an agnate with the grandfather, so the case is settled from twenty-seven. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3236}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3237} The Hanafis followed Abu Bakr and Ibn Abbas, so that the sister drops out. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3237} Umar and Ibn Mas'ud give the sister half and the grandfather a sixth. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3237}"
