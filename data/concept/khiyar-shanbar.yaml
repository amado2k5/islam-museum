summary:
  ar: "خيار شنبر في الكتاب منه كابلي ومنه بصري ويحمل من الهند إلى البصرة وغيرها، وأجوده ما يؤخذ عن القصب البراق الدسم؛ معتدل في الحر والبرد رطب، محلل ملين، ينفع من الأورام الحارة في الأحشاء ومن النقرس ومن الخوانيق ومن اليرقان ووجع الكبد، ويلين البطن ويخرج المرة المحرقة والبلغم بلا أذى، وفيه نقل موسوم عن الحبالى في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v1 p.707}"
  en: "Khiyar shanbar is in the book of two kinds, Kabuli and Basri, brought from India to Basra and elsewhere, the best being that taken from the shining, oily cane (qasab); moderate in hot and cold and moist, dissolving and softening, it benefits hot swellings in the organs, gout, quinsy, jaundice and liver pain, and loosens the belly and brings out burnt humour and phlegm without harm, with a labelled listing on pregnant women in a section held for the founder's ruling {cite:canon-ibn-sina-print-v1 p.707}"
  ur: "خیار شنبر کتاب میں ایک کابلی اور ایک بصری قسم کا ہے اور ہند سے بصرہ اور دوسرے شہروں کو لایا جاتا ہے، اور بہترین وہ ہے جو چمکدار چکنی قصب ⁦(نلی)⁩ سے لیا جائے؛ گرمی اور سردی میں معتدل اور تر، تحلیل کرنے والا اور نرم کرنے والا، اندرونی گرم ورموں، نقرس، خوانیق، یرقان اور جگر کے درد میں نافع ہے، اور پیٹ کو نرم کرتا ہے اور جلی ہوئی مرہ اور بلغم کو بغیر ضرر کے نکالتا ہے، اور حاملہ عورتوں کے بارے میں ایک موسوم نقل بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v1 p.707}۔"
  es: "El khiyar shanbar se encuentra en el libro en dos tipos, kabuli y basri, traídos de la India a Basora y otros lugares, siendo el mejor el extraído de la caña brillante y aceitosa (qasab); moderado en calor y frío y húmedo, disuelve y suaviza, beneficia las inflamaciones calientes en los órganos, la gota, la amigdalitis, la ictericia y el dolor de hígado, y afloja el vientre y expulsa el humor quemado y la flema sin causar daño, con una lista etiquetada para mujeres embarazadas en una sección reservada para el dictamen del fundador {cite:canon-ibn-sina-print-v1 p.707}"
  fr: "Le Khiyar shanbar est mentionné dans le livre sous deux formes, Kabuli et Basri, importée d'Inde à Bassora et ailleurs. La meilleure est celle extraite de la canne luisante et huileuse (qasab). Modérée en cas de chaleur, de froid et d'humidité, elle dissout et adoucit. Elle est bénéfique pour les gonflements chauds des organes, la goutte, les angines, la jaunisse et les douleurs hépatiques. Elle décontracte l'estomac et élimine les humeurs brûlées et les mucosités sans danger. Une section, réservée à la décision du fondateur, contient une liste commentée pour les femmes enceintes. {cite:canon-ibn-sina-print-v1 p.707}"
