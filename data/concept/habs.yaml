id: concept/habs
class: concept
kind: legal
label: { ar: "الحبس", en: "Habs (imprisonment and detention)", ur: "حبس" }
summary:
  ar: "الحبس في الاصطلاح تعويق الشخص ومنعه من التصرف بنفسه والخروج إلى أشغاله. وقد أجمع الفقهاء على مشروعيته، وهو عند الجمهور فرع من التعزير، ويكون للعقوبة أو للاستيثاق بالتهمة، ولا يحدد الجمهور حدا أعلى لمدته فيفوض ذلك إلى القاضي، ويكون أحيانا مؤبدا أو مبهم المدة، وينتهي بالموت أو بالتوبة أو بعفو صاحب الحق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6741} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6742} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6743} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6744} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6745} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6746} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6747} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6748} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6749} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6750} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6751} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6752} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6753} ويفرد الفقهاء للنساء والخنثى والأحداث أحكاما في الحبس، وتحكم المعاملات والنفقة والإيلاء واللعان وصفات السجان ومراقبة الدولة للسجون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6776} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6777} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6789}"
  en: "In the technical sense habs is holding a person back, preventing him from acting for himself and going about his affairs. Jurists agree that it is lawful. Most treat it as a branch of discretionary punishment (ta'zir), used either as a penalty or to secure a suspect, and most set no upper limit on its length, leaving that to the judge. It may be open-ended or for life, and it ends with death, repentance or the pardon of the person wronged. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6741} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6742} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6743} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6744} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6745} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6746} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6747} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6748} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6749} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6750} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6751} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6752} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6753} Jurists also set rules for women, ambiguous and juvenile detainees, the prisoner's transactions, maintenance and oaths, the prohibited forms of discipline, and the jailer's qualities and the state's duty to oversee prisons. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6776} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6777} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6789}"
  ur: "فقہ میں حبس کا مطلب کسی شخص کو روکنا اور اسے اپنے کام کاج اور تصرف سے باز رکھنا ہے۔ فقہاء کے نزدیک اس کی شرعی حیثیت متفق علیہ ہے، اور جمہور کے نزدیک یہ تعزیر کی ایک شاخ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6741} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6745} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6749} فقہاء نے عورتوں، خنثیٰ، نابالغوں، قیدی کے تصرفات، نفقہ، ایلاء، ممنوعہ تادیب، جیلر کی صفات اور ریاست کی نگرانی کے احکام بھی بیان کیے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6776} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6777} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6789}"
