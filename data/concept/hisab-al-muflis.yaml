id: concept/hisab-al-muflis
class: concept
kind: doctrine
label:
  ar: "المفلس: المقاصة بالحسنات والسيئات"
  en: "The bankrupt: settling wrongs in good and bad deeds"
  ur: "مفلس: نیکیوں اور برائیوں سے حساب چکانا"
  es: "El deudor insolvente: saldar cuentas por actos buenos y malos."
  fr: "Le failli: réparer les torts par de bonnes et de mauvaises actions"
  tr: "İflas Olanlar: İyi ve Kötü Davranışlar İçin Tazminat"
  id: "The Bankrupt: Kompensasi atas Perbuatan Baik dan Buruk"
summary:
  ar: "سأل النبي أصحابه عن المفلس، فقالوا: من لا درهم له ولا متاع، فبيّن أن المفلس من أمته من يأتي يوم القيامة بصلاة وصيام وزكاة، وقد شتم هذا وقذف هذا وأكل مال هذا وسفك دم هذا وضرب هذا، فيُعطى هذا من حسناته وهذا من حسناته، فإن فنيت حسناته قبل أن يُقضى ما عليه أُخذ من خطاياهم فطُرحت عليه [[passage/muslim-2581]]، وعند البخاري الحثّ على التحلل من المظالم قبل يوم لا دينار فيه ولا درهم [[passage/bukhari-api-6534]]. وهو النص الذي يجعل الحسنات والسيئات عملة تُنقل بين الحسابات، ويختم به الجدول لأنه يبيّن أن الرصيد المجموع قد يُدفع لغير صاحبه."
  en: "The Prophet asked his Companions who the bankrupt is; they said: one with no dirham and no goods. He explained that the bankrupt of his community is the one who comes on the Day of Resurrection with prayer, fasting and alms, having insulted this one, slandered that one, consumed the wealth of another, shed the blood of another and struck another; each is paid from his good deeds, and if they run out before what he owes is settled, their sins are taken and laid on him [[passage/muslim-2581]]; al-Bukhari carries the urging to settle wrongs before a day with neither dinar nor dirham [[passage/bukhari-api-6534]]. This is the text that makes good and bad deeds a currency moved between accounts, and it closes the table because it shows that a balance gathered may be paid out to someone else."
  ur: "نبی نے صحابہ سے پوچھا کہ مفلس کون ہے؛ انہوں نے کہا: جس کے پاس نہ درہم ہو نہ سامان۔ آپ نے بتایا کہ میری امت کا مفلس وہ ہے جو قیامت کے دن نماز، روزہ اور زکوٰۃ لے کر آئے گا مگر اس نے کسی کو گالی دی، کسی پر تہمت لگائی، کسی کا مال کھایا، کسی کا خون بہایا اور کسی کو مارا ہوگا؛ ہر ایک کو اس کی نیکیوں سے دیا جائے گا، اور اگر حق ادا ہونے سے پہلے نیکیاں ختم ہو گئیں تو ان کی خطائیں لے کر اس پر ڈال دی جائیں گی [[passage/muslim-2581]]، اور بخاری میں اس دن سے پہلے زیادتیوں کی تلافی کی ترغیب ہے جس میں نہ دینار ہوگا نہ درہم [[passage/bukhari-api-6534]]۔ یہ وہ نص ہے جو نیکیوں اور برائیوں کو ایسا سکہ بناتی ہے جو کھاتوں کے درمیان منتقل ہوتا ہے، اور جدول اسی پر ختم ہوتا ہے کیونکہ یہ بتاتی ہے کہ جمع شدہ نیکیاں کسی اور کو ادا ہو سکتی ہیں۔"
  es: "El Profeta preguntó a sus Compañeros quién era el insolvente; ellos respondieron: aquel que no tenía ni dirham ni bienes. Explicó que el insolvente de su comunidad es aquel que, en el Día de la Resurrección, con oración, ayuno y limosna, ha insultado a uno, calumniado a otro, consumido la riqueza de otro, derramado la sangre de otro y golpeado a otro; cada uno recibe una compensación de sus buenas obras, y si estas se agotan antes de que se salde su deuda, sus pecados se le imputan [[passage/muslim-2581]]; al-Bujari transmite la exhortación a reparar las faltas antes de un día sin dinares ni dirhams [[passage/bukhari-api-6534]]. Este es el texto que convierte las buenas y malas obras en una moneda que circula entre cuentas, y cierra la tabla porque muestra que un saldo acumulado puede ser entregado a otra persona."
  fr: "Le Prophète demanda à ses Compagnons qui était le failli; ils répondirent: celui qui n'avait ni dinar ni biens. Il expliqua que le failli de sa communauté est celui qui se présente au Jour de la Résurrection avec prière, jeûne et aumône, après avoir insulté un homme, calomnié un autre, dilapidé les biens d'un autre, versé le sang d'un autre et frappé un troisième. Chacun est payé de ses bonnes actions, et si celles-ci s'épuisent avant que sa dette ne soit réglée, ses péchés lui sont imputés [[passage/muslim-2581]]. Al-Bukhari exhorte à régler ses torts avant un jour où l'on ne possède ni dinar ni dirham [[passage/bukhari-api-6534]]. Ce texte établit que les bonnes et les mauvaises actions constituent une monnaie circulant entre les comptes, et il conclut que le solde accumulé peut être versé à autrui."
  tr: "Peygamber, iflas eden arkadaşlarına sordu ve onlar şöyle dedi: Dirhem ve mal varlığı olmayan kişi. Kendi ulusundan iflas edenin, Kıyamet Günü'nde namaz, oruç ve zekatla gelen, ona hakaret eden, diğerini karalayan, başkasının malını tüketen, başkasının kanını döken ve birini döven kişi olduğunu açıkladı. Bu kişi iyi işlerinden ve diğerine iyi işlerinden verilir. Eğer iyi işleri borçları ödenmeden önce tükenirse, günahlarından alınır ve cezalandırılır [[passage/muslim-2581]]. El-Buhari'ye göre, ne dinar ne de dirhem olmayacağı bir günden önce kötülüklerden kurtulmayı öğütler [[passage/bukhari-api-6534]]. Bu metin, iyi ve kötü işleri hesaplar arasında dolaşan bir para birimi haline getirir ve tabloyu bitirir çünkü biriken bakiye sahibinden başka birine ödenebileceğini gösterir."
  id: "Nabi bertanya kepada para sahabatnya tentang orang bangkrut, dan mereka berkata: Orang yang tidak memiliki dirham maupun harta benda. Ia menjelaskan bahwa orang bangkrut dari bangsanya adalah orang yang datang pada Hari Kiamatawan dengan doa, puasa, dan zakat, dan telah menghina orang itu, memfitnah orang lain, menghabiskan harta orang lain, menumpahkan darah orang lain, dan memukul orang lain. Ia diberikan orang ini dari amal baiknya dan orang itu dari amal baiknya. Jika amal baiknya habis sebelum hutangnya dilunasi, ia akan diambil dari dosa-dosa mereka dan akan dihukum [[passage/muslim-2581]]. Menurut Al-Bukhari, ia mendesak untuk membebaskan diri dari kesalahan sebelum hari ketika tidak ada dinar maupun dirham [[passage/bukhari-api-6534]]. Ini adalah teks yang menjadikan perbuatan baik dan perbuatan buruk sebagai mata uang yang bergerak antar akun, dan menutup tabel karena menunjukkan bahwa sisa yang terkumpul dapat dibayarkan kepada orang lain selain pemiliknya."
