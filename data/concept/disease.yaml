id: concept/disease
class: concept
kind: scientific
label: { ar: "المرض", en: "Disease (al-marad)" }
summary:
  ar: "يعرّف ابن سينا المرض بأنه هيئة غير طبيعية في بدن الإنسان يجب عنها بالذات آفة في الفعل، وذلك إما مزاج غير طبيعي وإما تركيب غير طبيعي {cite:canon-ibn-sina-print-v1 p.103}. ويفرّقه من السبب، وهو ما يتقدم فيجب عنه حال من أحوال البدن، ومن العرض، وهو ما يتبع الهيئة؛ فالعفونة سبب، والحمى مرض، والعطش والصداع عَرَضان {cite:canon-ibn-sina-print-v1 p.103}. وتُعرض أسباب الأمراض في التعليم الثاني من الفن الثاني {cite:canon-ibn-sina-print-v1 p.112}."
  en: "Ibn Sina defines disease as an unnatural state of the body from which an injury to function follows directly, either an unnatural temperament or an unnatural composition {cite:canon-ibn-sina-print-v1 p.103}. He separates it from the cause, which comes first and brings about a state of the body, and from the symptom, which follows the state. His example: putrefaction is a cause, fever is a disease, and thirst and headache are symptoms {cite:canon-ibn-sina-print-v1 p.103}. The causes of diseases are treated in the second section of Fann 2 {cite:canon-ibn-sina-print-v1 p.112}."
