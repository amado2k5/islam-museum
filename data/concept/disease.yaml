id: concept/disease
class: concept
kind: scientific
label:
  ar: المرض
  en: Disease (al-marad)
  ur: المرض
  es: "Enfermedad (al-marad)"
  fr: "Maladie (al-marad)"
  tr: "Hastalık"
  id: "Penyakit"
summary:
  ur: ابن سینا کے نزدیک بدن کی غیر فطری حالت جس سے عمل میں خلل آئے — سبب، مرض اور
    عرض میں فرق۔
  ar: يعرّف ابن سينا المرض بأنه هيئة غير طبيعية في بدن الإنسان يجب عنها بالذات آفة
    في الفعل، وذلك إما مزاج غير طبيعي وإما تركيب غير طبيعي {cite:canon-ibn-sina-print-v1
    p.103}. ويفرّقه من السبب، وهو ما يتقدم فيجب عنه حال من أحوال البدن، ومن العرض،
    وهو ما يتبع الهيئة؛ فالعفونة سبب، والحمى مرض، والعطش والصداع عَرَضان {cite:canon-ibn-sina-print-v1
    p.103}. وتُعرض أسباب الأمراض في التعليم الثاني من الفن الثاني {cite:canon-ibn-sina-print-v1
    p.112}.
  en: 'Ibn Sina defines disease as an unnatural state of the body from which an injury
    to function follows directly, either an unnatural temperament or an unnatural
    composition {cite:canon-ibn-sina-print-v1 p.103}. He separates it from the cause,
    which comes first and brings about a state of the body, and from the symptom,
    which follows the state. His example: putrefaction is a cause, fever is a disease,
    and thirst and headache are symptoms {cite:canon-ibn-sina-print-v1 p.103}. The
    causes of diseases are treated in the second section of Fann 2 {cite:canon-ibn-sina-print-v1
    p.112}.'
  es: "Ibn Sina define la enfermedad como un estado anormal del cuerpo del cual se deriva directamente una alteración de su funcionamiento, ya sea por un temperamento anormal o por una constitución anormal {cite:canon-ibn-sina-print-v1 p.103}. La distingue entre la causa, que precede y produce el estado del cuerpo, y el síntoma, que sigue al estado. Su ejemplo: la putrefacción es una causa, la fiebre es una enfermedad, y la sed y el dolor de cabeza son síntomas {cite:canon-ibn-sina-print-v1 p.103}. Las causas de las enfermedades se tratan en la segunda sección de Fann 2 {cite:canon-ibn-sina-print-v1 p.112}."
  fr: "Ibn Sina définit la maladie comme un état anormal du corps, duquel découle directement une altération de sa fonction, due soit à un tempérament anormal, soit à une constitution anormale (voir canon d'Ibn Sina, vol. 1, p. 103). Il la distingue de la cause, qui précède et induit cet état, et du symptôme, qui en découle. À titre d'exemple, il cite la putréfaction comme cause, la fièvre comme maladie, et la soif et les maux de tête comme symptômes (voir canon d'Ibn Sina, vol. 1, p. 103). Les causes des maladies sont traitées dans la deuxième section du livre II de Fann (voir canon d'Ibn Sina, vol. 1, p. 112)."
  tr: "İbn Sina, hastalığı insan vücudunda anormal bir biçim olarak tanımlar; bu form, kendisi eylemde bir kusur gerektirir; ya anormal bir mizaç ya da anormal bir bileşim {cite:canon-ibn-sina-print-v1 s.103}. Hastalığı, önce gelen neden olan sebepten ayırır, bu yüzden bedenin bir durumu ve görünüşe bağlı bir durum olarak kabul edilmelidir; çürüme bir neden, ateş bir hastalıktır ve susuzluk ile baş ağrısı iki belirtidir {cite:canon-ibn-sina-print-v1 s.103}. Hastalıkların nedenleri ikinci sanatın ikinci eğitiminde sunulur {cite:canon-ibn-sina-print-v1 s.112}."
  id: "Ibn Sina mendefinisikan penyakit sebagai bentuk abnormal dalam tubuh manusia yang sendiri membutuhkan cacat dalam tindakan, baik temperamen abnormal atau komposisi abnormal {cite:canon-ibn-sina-print-v1 hlm.103}. Ia membedakannya dari sebab, yang merupakan yang pertama kali, sehingga penyakit harus dianggap sebagai keadaan tubuh dan kondisi yang bergantung pada penampilan; karena pembusukan adalah penyebab, demam adalah penyakit, dan haus serta sakit kepala adalah dua gejala {cite:canon-ibn-sina-print-v1 hlm.103}. Penyebab penyakit disajikan dalam pendidikan kedua seni kedua {cite:canon-ibn-sina-print-v1 hlm.112}."
