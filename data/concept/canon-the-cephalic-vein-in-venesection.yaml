id: concept/canon-the-cephalic-vein-in-venesection
class: concept
kind: scientific
label: { ar: "القيفال في الفصد عند ابن سينا", en: "The cephalic vein in venesection in the Canon", ur: "قانون میں فصد میں قیفال", es: "La vena cefálica en la venosección en el Canon", fr: "La veine céphalique lors de la saignée dans le Canon" }
summary:
  ar: "يذكر ابن سينا أن القيفال أسلم عروق اليد، وأن فصده الطويل أبطأ التحاماً لأنه مفصلي، ويبين كيف يتجنب الخطأ فيه وما يطلب إذا لم يوجد {cite:canon-ibn-sina-print-v1 p.294}."
  en: "Ibn Sina says the cephalic is the safest vein of the arm, that its lengthwise opening is slower to close because it lies at a joint, and shows how error in it is avoided and what is sought if it cannot be found {cite:canon-ibn-sina-print-v1 p.294}."
  es: "Ibn Sina dice que la cefálica es la vena más segura del brazo, que su abertura longitudinal tarda más en cerrarse porque se encuentra en una articulación, y muestra cómo se evita el error en ella y qué se busca si no se puede encontrar {cite:canon-ibn-sina-print-v1 p.294}."
  fr: "Ibn Sina dit que la veine céphalique est la veine la plus sûre du bras, que son ouverture longitudinale se ferme plus lentement car elle se situe au niveau d'une articulation, et montre comment l'erreur est évitée et ce qu'il faut rechercher si elle ne peut être trouvée {cite:canon-ibn-sina-print-v1 p.294}."
  ur: "ابن سینا کا کہنا ہے کہ سیفیلک بازو کی سب سے محفوظ رگ ہے، کہ اس کی لمبائی کی طرف کھلنا بند ہونے میں سست ہے کیونکہ یہ ایک جوڑ پر ہوتا ہے، اور یہ ظاہر کرتا ہے کہ اس میں غلطی سے کیسے بچا جاتا ہے اور اگر یہ نہ مل سکے تو کیا تلاش کیا جاتا ہے۔"
