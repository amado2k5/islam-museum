label: { ar: "القيفال في الفصد عند ابن سينا", en: "The cephalic vein in venesection in the Canon", ur: "قانون میں فصد میں قیفال", es: "La vena cefálica en la venosección en el Canon" }
summary:
  ar: "يذكر ابن سينا أن القيفال أسلم عروق اليد، وأن فصده الطويل أبطأ التحاماً لأنه مفصلي، ويبين كيف يتجنب الخطأ فيه وما يطلب إذا لم يوجد {cite:canon-ibn-sina-print-v1 p.294}."
  en: "Ibn Sina says the cephalic is the safest vein of the arm, that its lengthwise opening is slower to close because it lies at a joint, and shows how error in it is avoided and what is sought if it cannot be found {cite:canon-ibn-sina-print-v1 p.294}."
  es: "Ibn Sina dice que la cefálica es la vena más segura del brazo, que su abertura longitudinal tarda más en cerrarse porque se encuentra en una articulación, y muestra cómo se evita el error en ella y qué se busca si no se puede encontrar {cite:canon-ibn-sina-print-v1 p.294}."
