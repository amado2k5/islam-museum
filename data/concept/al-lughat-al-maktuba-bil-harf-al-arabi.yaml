id: concept/al-lughat-al-maktuba-bil-harf-al-arabi
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-script]
label:
  ar: "اللغات المكتوبة بالحرف العربي"
  en: "Languages written in the Arabic script"
  ur: "عربی رسم الخط میں لکھی جانے والی زبانیں"
  fr: "Les langues écrites en caractères arabes"
  es: "Las lenguas escritas en caracteres árabes"
summary:
  ar: "إحدى عشرة لغة كُتبت أو تُكتب بالحرف العربي مع ما أضافته إليه من حروف وما جرى لكل منها: الفارسية والأردية والبشتو والكردية السورانية والأويغورية والملايو الجاوية والتركية العثمانية والسواحيلية والهوسا والولوف والسندية، كما يعرضها جدول في ملف بحثي قُدّم إلى المتحف؛ بعضها أبقى الحرف العربي وبعضها استبدل به اللاتيني أو السيريلي {cite:openarabic-perso-arabic-alphabet} {cite:wikipedia-arabic-script-en}."
  en: "Eleven languages written or once written in the Arabic script, with the letters each added and what became of each: Persian, Urdu, Pashto, Sorani Kurdish, Uyghur, Jawi Malay, Ottoman Turkish, Swahili, Hausa, Wolof and Sindhi, as a table in a research file supplied to the museum sets them out; some kept the Arabic script and some replaced it with Latin or Cyrillic {cite:openarabic-perso-arabic-alphabet} {cite:wikipedia-arabic-script-en}."
  ur: "گیارہ زبانیں جو عربی رسم الخط میں لکھی گئیں یا لکھی جاتی ہیں، ہر ایک نے اس میں جو حروف بڑھائے اور ہر ایک کا جو انجام ہوا: فارسی، اردو، پشتو، سورانی کردی، اویغور، جاوی ملائی، عثمانی ترکی، سواحلی، ہاؤسا، ولوف اور سندھی، جیسا کہ عجائب گھر کو پیش کی گئی ایک تحقیقی فائل کا جدول انہیں پیش کرتا ہے؛ کچھ نے عربی رسم الخط برقرار رکھا اور کچھ میں اس کی جگہ لاطینی یا سیریلی آ گئی {cite:openarabic-perso-arabic-alphabet} {cite:wikipedia-arabic-script-en}۔"
  fr: "Onze langues écrites, ou autrefois écrites, en caractères arabes, avec les lettres que chacune y a ajoutées et ce qu'il en est advenu : le persan, l'ourdou, le pachto, le kurde sorani, l'ouïghour, le malais jawi, le turc ottoman, le swahili, le haoussa, le wolof et le sindhi, tels qu'un tableau d'un dossier de recherche remis au musée les présente ; certaines ont gardé l'écriture arabe et d'autres l'ont remplacée par le latin ou le cyrillique {cite:openarabic-perso-arabic-alphabet} {cite:wikipedia-arabic-script-en}."
  es: "Once lenguas escritas, o escritas en otro tiempo, en caracteres árabes, con las letras que cada una añadió y lo que fue de cada una: persa, urdu, pastún, kurdo sorani, uigur, malayo yaui, turco otomano, suajili, hausa, wolof y sindhi, tal como las presenta una tabla de un archivo de investigación entregado al museo; unas conservaron la escritura árabe y otras la sustituyeron por la latina o la cirílica {cite:openarabic-perso-arabic-alphabet} {cite:wikipedia-arabic-script-en}."
