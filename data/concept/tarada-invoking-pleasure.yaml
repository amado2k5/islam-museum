id: concept/tarada-invoking-pleasure
class: concept
kind: legal
label:
  ar: "الترضي"
  en: "Tarada (invoking God's pleasure upon a person)"
  ur: "ترضی ⁦(کسی کے لیے رضائے الٰہی کی دعا)⁩"
  es: "Tarada (invocar la complacencia de Dios sobre una persona)"
  fr: "Tarada (invocation de la faveur divine sur une personne)"
summary:
  ar: "الترضي طلب الرضا، وهو الدعاء بالرضا لمن يذكر، ويختلف حكمه باختلاف المترضى عنه: يستحب الترضي عمن اختلف في نبوته، ويستحب في الصحابة باتفاق، ويجوز لغيرهم من السلف والعلماء، وينبغي المحافظة على كتابته، ويترضى سامع ذكر الصحابة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4968}"
  en: "Tarada is asking for pleasure, that is, the formula of God's pleasure upon someone. Its ruling depends on who is named: it is recommended for those whose prophethood is disputed, agreed to be recommended for the Companions, and allowed for other early scholars and the righteous. The writer should keep writing it, and a listener should also invoke it when the Companions are named. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4968}"
  es: "Tarada es una petición de placer, es decir, la fórmula del agrado de Dios sobre alguien. Su validez depende de a quién se mencione: se recomienda para aquellos cuya profecía es cuestionada, se recomienda para los Compañeros y se permite para otros eruditos primitivos y los justos. El autor debe seguir escribiéndola, y el oyente también debe invocarla cuando se mencionen los Compañeros. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4968}"
  fr: "La Tarada est une demande d'agrément, c'est-à-dire la formule de l'agrément divin envers une personne. Sa validité dépend de la personne nommée: elle est recommandée pour ceux dont la prophétie est contestée, il est admis qu'elle soit recommandée pour les Compagnons, et elle est autorisée pour d'autres savants des premiers siècles et les justes. Celui qui l'écrit doit la répéter, et l'auditeur doit également l'invoquer lorsque les Compagnons sont nommés. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4968}"
  ur: "تارا خوشی مانگ رہا ہے، یعنی کسی پر خدا کی خوشنودی کا فارمولا۔ اس کا حکم اس بات پر منحصر ہے کہ کس کا نام لیا گیا ہے: یہ ان لوگوں کے لیے مستحب ہے جن کی نبوت میں اختلاف ہے، صحابہ کے لیے تجویز کیے جانے پر اتفاق ہے، اور دوسرے ابتدائی علماء اور صالحین کے لیے اس کی اجازت ہے۔ لکھنے والے کو لکھتے رہنا چاہیے اور سننے والے کو بھی چاہیے کہ جب صحابہ کا نام لیا جائے تو اسے پکارے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 4967}"
