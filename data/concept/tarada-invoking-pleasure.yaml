label:
  ar: "الترضي"
  en: "Tarada (invoking God's pleasure upon a person)"
  ur: "ترضی (کسی کے لیے رضائے الٰہی کی دعا)"
summary:
  ar: "الترضي طلب الرضا، وهو الدعاء بالرضا لمن يذكر، ويختلف حكمه باختلاف المترضى عنه: يستحب الترضي عمن اختلف في نبوته، ويستحب في الصحابة باتفاق، ويجوز لغيرهم من السلف والعلماء، وينبغي المحافظة على كتابته، ويترضى سامع ذكر الصحابة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4968}"
  en: "Tarada is asking for pleasure, that is, the formula of God's pleasure upon someone. Its ruling depends on who is named: it is recommended for those whose prophethood is disputed, agreed to be recommended for the Companions, and allowed for other early scholars and the righteous. The writer should keep writing it, and a listener should also invoke it when the Companions are named. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4968}"
