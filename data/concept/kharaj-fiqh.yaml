id: concept/kharaj-fiqh
class: concept
kind: legal
label:
  ar: الخراج ⁦(الموسوعة الفقهية)⁩
  en: Kharaj (land levy, fiqh entry)
  ur: خراج ⁦(فقہی اصطلاح)⁩
  es: "Kharaj (impuesto sobre la tierra, entrada al fiqh)"
  fr: "Kharaj (prélèvement foncier, entrée du fiqh)"
  tr: "Kharaj (Hukuk Ansiklopedisi)"
  id: "Kharaj (Ensiklopedia Yurisprudensi)"
summary:
  ar: 'الخراج لغة الغلة الحاصلة من الشيء، ويطلق على الأجرة وعلى الإتاوة أو الضريبة. والخرج والخراج بمعنى واحد عند أبي عبيدة والليث، وفرق أبو عمرو بن العلاء بينهما: فالخرج ما تبرعت به، والخراج ما لزمك أداؤه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7575}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7576} وفي الاصطلاح للخراج معنيان: عام، وهو الأموال التي تتولى الدولة جبايتها وصرفها، وخاص، وهو الوظيفة أو الضريبة التي يفرضها الإمام على الأرض الخراجية النامية، وعرفه الماوردي وأبو يعلى بأنه ما وضع على رقاب الأرض من حقوق تؤدى عنها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7576} ومن ألفاظه في الاصطلاح: جزية الأرض، وأجرة الأرض، والطسق، وهي كلمة فارسية معربة وردت في كتاب عمر إلى عثمان بن حنيف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7576}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7577} وتتميز عن الغنيمة والفيء والجزية والخمس والعشر، فالجزية على الرؤوس لا على الأرض، والعشر زكاة الأرض العشرية التي يملكها مسلم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7577} ولما اتسعت الفتوحات في خلافة عمر بن الخطاب رأى ألا تقسم الأرض المفتوحة عنوة بين الفاتحين، بل توقف على جميع المسلمين ويضرب عليها خراج معلوم، فاختلف الصحابة في البداية، وذكر أبو يوسف أن بلال بن رباح كان من أشد المخالفين، واستدل عمر بآية الحشر في الفيء، واستشار المهاجرين والأنصار حتى استقر الأمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7578}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7579} واحتج الفقهاء لمشروعيته بالقرآن والسنة والمصلحة: ومن السنة حديث «منعت العراق درهمها وقفيزها» الذي فيه إخبار بما سيقع من ضرب الخراج، وقسمة النبي نصف خيبر لمصلحة المسلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7580}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7581} ومن المصالح: تأمين مورد مالي ثابت للأجيال، وعدم حصر الثروة في فئة، وعمارة الأرض بالزراعة لأن أهلها أعلم بها، وفي هذا قول معاذ بن جبل لعمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7581}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7582} والخراج واجب على كل من بيده أرض خراجية نامية، مسلما كان أو كافرا، صغيرا أو كبيرا، عاقلا أو مجنونا، رجلا أو امرأة، لأنه مؤونة الأرض النامية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7580} ومن أنواعه باعتبار المأخوذ: خراج الوظيفة وهو شيء في الذمة يتعلق بالتمكن من الزراعة، وقد وظفه عمر على أرض السواد ومصر والشام، وخراج المقاسمة وهو جزء شائع من الخارج كالربع والخمس، وقد قرره المهدي العباسي بدلا من الوظيفة، ويقال إنه كان سببه نقص السعر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7582}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7583}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7584} وباعتبار الأرض: الخراج الصلحي، وهو ما صولح عليه أهلها على بقائها بيدهم بخراج معلوم، والخراج العنوي، وهو ما افتتح عنوة بعد أن وقفه الإمام على المسلمين، ويدخل فيه ما جلا عنه أهله خوفا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7584} والأرض الخراجية نوعان عند الكلام على أنواعها: ما صولح المسلمون أهلها عليها، وما جلا عنها أهلها خوفا وفزعا دون قتال، وهي عند جمهور الفقهاء وقف على المسلمين بمجرد الاستيلاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7584}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7585} شروط الأرض الخراجية أن تكون خراجية، فلا تجب الوظيفة على الأرض العشرية، وأن تكون نامية حقيقة بالغلة أو تقديرا بصلاحيتها للزراعة، فلا خراج على الدور ولا على الموات غير الصالح للزراعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7585}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7586} وإذا انتقلت الأرض العشرية إلى ذمي جوز الجمهور بيعها له، ومنعه مالك وأحمد في رواية، ثم اختلفوا فيما يجب عليه: فالشافعية والحنابلة في الراجح لا تصير خراجية، وأبو حنيفة وزفر يصيرها خراجية، ومالك وأبو يوسف يضاعفون عليه العشر، ومحمد بن الحسن يبقيها عشرية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7586}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7587} وفي إحياء الذمي للموات بإذن الإمام خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7588} ومقدار الخراج عند الحنفية قفيز ودرهم في الجريب الصالح للزراعة، وخمسة دراهم للرطبة، وعشرة للكرم، ونهاية الطاقة نصف الخارج؛ وعند مالك لا يتقيد بتقدير سابق بل يجتهد الإمام مستعينا بأهل الخبرة؛ وعند الشافعية مقادير عثمان بن حنيف، ومنها درهمان للشعير وأربعة للحنطة؛ وعند الحنابلة درهم وقفيز، وثمانية دراهم للنخل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7588}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7589} وفي الزيادة والنقصان على تقدير عمر: أجازهما الشافعية وأحمد في رواية ومحمد بن الحسن، وأجاز أبو حنيفة النقصان دون الزيادة، وأجاز أحمد في رواية الزيادة دون النقصان، ومنعهما في رواية ثالثة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7589}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7590} ويراعى في تقدير الخراج جودة التربة، وخفة مؤونة السقي فالأمطار والأنهار أكثر مما يسقى بالبئر، ونوع الزرع أو الثمر، وقرب الأرض من المدن والأسواق، وترك نسبة للنوائب كما في خرص الثمار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7590}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7591}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7592} وقت الوجوب يختلف بنوع الخراج: فخراج المقاسمة يجب عند كمال الزرع ويتكرر بتكرر الخارج، وخراج الوظيفة يؤخذ مرة في السنة، فإن كان على مساحة الأرض فعند نهاية السنة القمرية، وإن كان على مساحة الزرع فعند نهاية السنة الشمسية؛ وعند أبي حنيفة يجب في أول السنة بشرط بقاء الأرض النامية في يد المكلف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7592}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7593} والتعجيل أجازه الحنفية والحنابلة لسنة أو سنتين، ويرده الحنابلة مطلقا، ويرده الحنفية إن بقي المأخوذ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7593}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7594} وإذا تأخر صاحب الأرض، فإن كان موسرا حُبس حتى يؤدي إلا أن يباع له مال، وإن كان معسرا أُنظر، ويبقى دينا في ذمته، ولا يسقط الخراج عند الشافعية والحنابلة والصاحبين، ويسقط عند أبي حنيفة كالجزية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7594}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7595} ويطالب به من بيده الأرض، وإذا أجرها أو أعارها فالخراج على المالك في قول الجمهور، والغاصب يضمن الخراج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7595} والذي يقدر الخراج ويطالب به ويصرفه هو الإمام العادل، ولا يجوز لأحد أن يوزعه بنفسه، ومن أدى إلى إمام جائر سقط عنه عند جماهير الفقهاء، وعلى البغاة إذا جبوا الخراج في بلد غلبوا عليه يسقط عن أهله عند الجماهير، ويوجب المالكية الإعادة، والمحاربون لا يسقط عنهم الخراج بالدفع إليهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7596}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7597}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7598} وعامل الخراج وكيل عن الإمام لا يقسم ما جباه إلا بإذنه، ويشترط فيه الإسلام والحرية والأمانة والكفاية والعلم والفقه، ولا يولى الذمي تقدير الخراج عند جمهور الفقهاء، ويستدل لذلك بقوله تعالى «لا تتخذوا بطانة من دونكم» وبأثر عمر في الكاتب النصراني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7599}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7600} آداب العامل أن يرفق بأهل الخراج فيوزعه بقدر الغلة، وأن يعدل فلا يحابي، وأن يكون عفيفا فلا يقبل رشوة ولا هدية، لأن هدايا العمال عند الخطابي سحت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7601}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7602}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7603} وعلى الإمام مراقبة العمال بمن يوثق بدينه وأمانته، وأن يرزقهم رواتب تكفيهم، كما قال أبو عبيدة لعمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7604} والتقبيل ⁦(القبالة أو التضمين)⁩: أن يتكفل شخص بتحصيل الخراج لنفسه مقابل قدر معين، وقد ظهر في العصر الأموي وانتشر في العباسي، فرده أحمد وأبو يوسف وأبو عبيد والماوردي، وذكروا ما يتبعه من الظلم، وأجازه أبو يوسف إن أمن الإمام الظلم ورضي أهل الخراج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7604}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7605}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7606} ومسقطات الخراج: أولا انعدام صلاحية الأرض للزراعة بآفة خارجة عن فعل الإنسان، فيسقط الخراج عند الجماهير، فإن أمكن إصلاحها أصلحها الإمام من سهم المصالح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7606}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7607} ثانيا تعطيل الأرض: إن كان من غير صاحبها فلا خراج، وإن كان بتفريطه سقط خراج المقاسمة وأمر بزراعتها، ولا يسقط خراج الوظيفة عند الحنفية والشافعية والحنابلة، ويسقط عند المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7607}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7608} ثالثا هلاك الزرع بآفة سماوية قبل الحصاد يسقط المقاسمة، وعند الحنفية يسقط الوظيفة بشرطين: ألا يبقى من السنة ثلاثة أشهر تتسع للزراعة، وأن يبقى من الزرع أقل من ضعف الخراج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7608}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7609} رابعا إسقاط الإمام الخراج عن شخص لمصلحة: أجازه الحنابلة وأبو يوسف، ومنعه محمد بن الحسن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7610} خامسا البناء على الأرض الخراجية: يبقى الخراج عند الجمهور من المالكية والشافعية والحنابلة، ويسقط عند الحنفية، ويرى الماوردي السقوط للبناء الضروري دون الزائد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7610}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7611} سادسا إسلام المالك أو انتقال الأرض إلى مسلم: لا يسقط الخراج العنوي باتفاق، والصلحي يسقط عند الجمهور لحديث العلاء بن الحضرمي، ولا يسقط عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7611}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7612} واجتماع العشر والخراج على مسلم يملك الأرض الخراجية: يوجبه الجمهور من المالكية والشافعية والحنابلة، ويمنعه الحنفية، ويستدلون بحديث «لا يجتمع على المسلم خراج وعشر» وبأثر عمر في الدهقانة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7612}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7613} ومصارف الخراج كمصارف الفيء في مصالح المسلمين، من أرزاق المقاتلة والقضاة والعلماء، وعمارة المساجد والطرق والقناطر وسد الثغور؛ ولا يخمس عند الجمهور من الحنفية والمالكية والحنابلة، ويخمسه الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7613}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7614} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7615}'
  en: 'Kharaj is lexically the yield of a thing, and it can mean a rent or a levy or tax. Abu Ubayd and al-Layth treat kharj and kharaj as one word, while Abu Amr ibn al-Ala'' distinguishes them: kharj is what one gives freely, kharaj what one must pay. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7575}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7576} As a technical term it has a general sense, the funds the state collects and spends, and a particular sense, the duty the Imam imposes on productive land; al-Mawardi and Abu Ya''la define it as the rights laid on the necks of land and paid for it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7576} Other names for it are land jizya, land rent, and tasq, a Persian word that appears in Umar''s letter to Uthman ibn Hunayf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7576}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7577} It is distinct from ghanima, fay'', jizya (a levy on persons, not land), khums and ''ushr (the tithe on land owned by a Muslim). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7577} When conquests grew under Umar ibn al-Khattab, he decided not to divide land taken by force among the conquerors but to hold it as an endowment for all Muslims, with a fixed kharaj on its cultivators. Companions first differed; Abu Yusuf reports that Bilal ibn Rabah was among the strongest objectors; Umar argued from the verses on fay'' in Surat al-Hashr and consulted the Emigrants and the Helpers until the matter was settled. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7578}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7579} Jurists base its legitimacy on the Qur''an, the Sunna and public interest. The Sunna cited includes the report ''Iraq withheld its dirham and qafiz'' (a prophetic foretelling of the kharaj imposed on land), and the Prophet''s division of half of Khaybar for the needs of the community. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7580}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7581} The interests cited are a stable revenue for future generations, keeping wealth from concentrating in one group, and keeping land cultivated by those who know it best; Mu''adh ibn Jabal''s advice to Umar is quoted for this. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7581}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7582} Kharaj is due on every holder of productive kharaj land, Muslim or not, adult or minor, sane or insane, man or woman, since it is the cost of the land''s yield. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7580} By form of levy there is kharaj al-wazifa, a fixed sum owed on the land''s area and crop type whatever it yields, which Umar imposed on al-Sawad, Egypt and Syria; and kharaj al-muqasama, a share of the produce such as a quarter or a fifth, which al-Mahdi introduced in place of the fixed sum, a change that the text connects to falling prices. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7582}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7583}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7584} By status of the land there is sulhi kharaj, levied on land whose people made terms to keep it, and ''anwi kharaj, levied on land taken by force and held for all Muslims, including land its people left in fear without fighting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7584} Kharaj lands are of two kinds: those settled by treaty, and those abandoned out of fear without battle, which by most jurists become an endowment for Muslims upon seizure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7584}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7585} Conditions for kharaj land: it must be kharaj land, so the wazifa is not owed on ''ushri land; and it must be productive in fact (by yield) or in estimate (by fitness for cultivation), so no kharaj falls on houses or on barren land unfit for farming. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7585}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7586} When ''ushri land passes to a dhimmi, most jurists allow the sale; Malik and one report of Ahmad forbid it. They then differ on what falls due: the Shafiis and the preferred Hanbali view keep it non-kharaj; Abu Hanifa and Zufar make it kharaj; Malik and Abu Yusuf double the ''ushr on the dhimmi; Muhammad al-Shaybani keeps it ''ushri. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7586}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7587} Whether a dhimmi may revive barren land with the Imam''s leave is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7588} The amounts: the Hanafis levy a qafiz and a dirham on each arable jarib, five dirhams on clover and ten on vines, with the ceiling at half the yield; Malik sets no fixed sum and leaves it to the Imam''s judgement with experts; the Shafiis follow the figures of Uthman ibn Hunayf (two dirhams on barley, four on wheat); the Hanbalis set a dirham and a qafiz, and eight dirhams on palms. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7588}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7589} On raising or lowering Umar''s figures, the Shafiis, one report of Ahmad, Muhammad al-Shaybani and one report of Abu Yusuf allow both; Abu Hanifa allows only lowering; a second report of Ahmad allows only raising; a third report forbids both. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7589}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7590} The assessor considers soil quality, the cost of irrigation (rain and river water cost less than well water), the crop or fruit, nearness to towns and markets, and leaves a margin for calamities, as the Prophet did in the estimation of fruit for zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7590}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7591}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7592} When it is due depends on the type: a share levy (muqasama) is due at harvest and recurs with each yield; a fixed levy (wazifa) is taken once a year, by the lunar year for land area and the solar year for crop area; Abu Hanifa has it due at the start of the year on condition the land stays productive. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7592}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7593} Advance payment was allowed by the Hanafis and Hanbalis for a year or two; the Hanbalis refund it in all cases, the Hanafis only if the sum still exists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7593}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7594} On default, a solvent holder is jailed until he pays unless goods are sold for it; an insolvent holder is given time and the debt stays. The Shafiis, the Hanbalis and the two companions of Abu Hanifa do not drop it; Abu Hanifa drops it on insolvency, as he does the jizya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7594}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7595} The duty falls on whoever holds the land; if it is let or lent, most jurists place it on the owner, while a usurper owes it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7595} The Imam, just in his rule, assesses, demands and disburses it; no one may distribute it himself; whoever pays an unjust ruler is generally released. Where rebels seize a town and collect it, most jurists release the payers; the Malikis require repayment. Brigands do not release the payer, since the sum is seized by force. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7596}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7597}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7598} The collector (amil) acts as the Imam''s agent and may not distribute the sum without leave; the conditions are Islam, freedom, trustworthiness, sufficiency, knowledge and understanding (a dhimmi is not appointed to assess it, most jurists say, citing the verse on not taking an inner circle from outside the believers and Umar''s refusal of a Christian scribe). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7599}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7600} The collector should be gentle, dividing the levy according to each harvest; just, without favour; and chaste, taking no bribe or gift, since Khattabi calls officials'' gifts unlawful. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7601}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7602}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7603} The Imam must supervise the collectors through men of trust, and pay them salaries that suffice, as Abu Ubayda told Umar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7604} Farming out the levy (qabala or tadmin): a person undertakes to collect it for himself at a fixed price; it appeared under the Umayyads and spread under the Abbasids. Ahmad, Abu Yusuf, Abu Ubayd and al-Mawardi rejected it for the injustice it brings, while Abu Yusuf allowed it where the Imam is secure from injustice and the payers consent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7604}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7605}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7606} Causes of remission: first, the land''s loss of fitness for cultivation through an event beyond human action, which by most jurists remits the levy; where it can be repaired the Imam repairs it from the public-interest share. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7606}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7607} Second, idleness: if it comes from outside the owner, the levy lapses; if by the owner''s neglect, the share-levy lapses and he is ordered to farm; the fixed levy is not remitted by the Hanafis, Shafiis and Hanbalis, but is by the Malikis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7607}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7608} Third, a crop lost to a heavenly blow before harvest remits the share-levy; for the fixed levy the Hanafis require two things: fewer than three months remain for another sowing, and the surviving crop is less than twice the levy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7608}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7609} Fourth, the Imam''s remission for a public interest: allowed by the Hanbalis and Abu Yusuf, forbidden by Muhammad al-Shaybani. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7610} Fifth, building on kharaj land: most Malikis, Shafiis and Hanbalis keep the levy; the Hanafis drop it; al-Mawardi drops it only for a necessary dwelling. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7610}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7611} Sixth, conversion of the owner or sale to a Muslim: the conquered-land
    levy never lapses; the treaty levy lapses by most jurists, citing a report of al-Ala'' ibn al-Hadrami, but not by the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7611}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7612} Joint ''ushr and kharaj on a Muslim: most Malikis, Shafiis and Hanbalis require both; the Hanafis require only kharaj, citing the report that no Muslim pays both and Umar''s order on a Nahr al-Malik convert. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7612}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7613} Uses of kharaj follow those of fay'': the soldiers'' pay, judges, scholars, mosques, roads, bridges and frontier defence; most Hanafis, Malikis and Hanbalis do not take a fifth of it, while the Shafiis do. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7613}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7614} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7615}'
  ur: 'خراج لغت میں کسی چیز کی پیداوار یا آمدنی کو کہتے ہیں، اور اجرت یا ٹیکس کے معنی میں بھی آتا ہے۔ ابو عبید اور لیث کے نزدیک خرج اور خراج ایک ہیں، جبکہ ابو عمرو بن العلاء کے نزدیک خرج وہ ہے جو تم بطور احسان دو، اور خراج وہ جو تم پر لازم ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7575}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7576} اصطلاح میں خراج کے دو معنی ہیں: عام، یعنی وہ اموال جن کی وصولی اور خرچ ریاست کرتی ہے، اور خاص، یعنی وہ ٹیکس جو امام زرخیز زمین پر لگائے؛ ماوردی اور ابو یعلیٰ کے نزدیک یہ زمین کی گردن پر لازم وہ حقوق ہیں جو اس کے عوض ادا کیے جائیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7576} اس کے دیگر نام جزیۃ الارض، اجرۃ الارض اور طسق ہیں، جو فارسی لفظ ہے اور عمر کے عثمان بن حنیف کو لکھے خط میں آیا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7576}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7577} یہ غنیمت، فیء، جزیہ، خمس اور عشر سے مختلف ہے؛ جزیہ سروں پر ہوتا ہے زمین پر نہیں، اور عشر مسلمان کی ملکیتی زمین کی زکوٰۃ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7577} عمر بن خطاب کے دور میں فتوحات بڑھیں تو انہوں نے طاقت سے فتح کی گئی زمین فاتحین میں تقسیم نہ کی بلکہ تمام مسلمانوں کے لیے وقف رکھی اور کاشت کاروں پر معین خراج لگایا؛ ابتدا میں صحابہ میں اختلاف ہوا، ابو یوسف کے مطابق بلال بن رباح سب سے زیادہ مخالف تھے، اور عمر نے سورۂ حشر کی فیء والی آیات سے استدلال کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7578}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7579} اس کی شرعی بنیاد قرآن، سنت اور مصلحت ہیں؛ سنت میں «منعت العراق درهمها وقفيزها» والی حدیث اور نبی کا خیبر کے نصف کو مسلمانوں کی مصلحت کے لیے رکھنا پیش کیا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7580}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7581} مصالح میں آنے والی نسلوں کے لیے مستقل آمدنی، دولت کا ایک گروہ میں سمٹنے سے بچاؤ، اور زمین کی آبادکاری شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7581}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7582} خراج ہر اس شخص پر واجب ہے جس کے پاس زرخیز خراجی زمین ہو، خواہ مسلمان ہو یا کافر، بالغ ہو یا نابالغ، عاقل ہو یا مجنون، مرد ہو یا عورت۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7580} اس کی اقسام میں خراج الوظیفہ ہے، یعنی زمین کے رقبے اور فصل کی نوعیت پر مقرر رقم، جو عمر نے سواد، مصر اور شام پر لگائی، اور خراج المقاسمہ ہے، یعنی پیداوار کا ایک حصہ، جو مہدی عباسی نے وظیفہ کی جگہ مقرر کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7582}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7583}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7584} زمین کی حیثیت کے لحاظ سے خراج صلحی ⁦(صلح کے ذریعے زمین والوں کے قبضے میں رہنے پر لیا جانے والا)⁩ اور خراج عنوی ⁦(طاقت سے فتح شدہ زمین پر، جو امام مسلمانوں کے لیے وقف کر دے)⁩ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7584}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7585} خراجی زمین کی شرط یہ ہے کہ وہ خراجی ہو، اس لیے عشری زمین پر وظیفہ واجب نہیں؛ اور وہ حقیقی یا تقدیری طور پر نامی ہو، اس لیے گھروں اور کاشت کے قابل نہ زمین پر خراج نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7585}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7586} عشری زمین ذمی کو منتقل ہو تو جمہور بیع کو جائز کہتے ہیں، مالک اور احمد کی ایک روایت منع کرتے ہیں؛ پھر اس پر لازم ہونے والی چیز میں اختلاف ہے: شافعیہ اور حنابلہ کے راجح قول میں زمین خراجی نہیں بنتی، ابو حنیفہ اور زفر اسے خراجی بناتے ہیں، مالک اور ابو یوسف عشر دوگنا لیتے ہیں، اور محمد بن حسن اسے عشری رکھتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7586}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7587} ذمی کا امام کی اجازت سے مردہ زمین آباد کرنا مختلف فیہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7588} مقدار: حنفیہ کے نزدیک کاشت کے قابل جریب پر ایک قفیز اور ایک درہم، رطبہ پر پانچ درہم، انگور پر دس درہم، اور انتہائی حد پیداوار کا نصف ہے؛ مالک کے نزدیک کوئی مقررہ رقم نہیں بلکہ امام اہلِ خبرہ کی مدد سے اجتہاد کرے؛ شافعیہ عثمان بن حنیف کی مقدار لیتے ہیں، جن میں جَو پر دو درہم اور گندم پر چار درہم ہیں؛ حنابلہ کے نزدیک ایک درہم اور ایک قفیز، اور کھجور پر آٹھ درہم۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7588}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7589} عمر کی مقدار میں کمی بیشی پر: شافعیہ، احمد کی ایک روایت، محمد بن حسن اور ابو یوسف کی ایک روایت دونوں کو جائز کہتے ہیں؛ ابو حنیفہ صرف کمی کو، احمد کی ایک روایت صرف زیادتی کو جائز کہتی ہے، اور تیسری روایت دونوں کو منع کرتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7589}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7590} خراج طے کرتے وقت زمین کی زرخیزی، آبپاشی کی مشقت ⁦(بارش اور دریا کا پانی بُرین کے پانی سے سستا ہے)⁩، فصل یا پھل کی نوعیت، شہر اور بازار سے قربت، اور آفات کے لیے گنجائش کو ملحوظ رکھا جائے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7590}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7591}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7592} وجوب کا وقت نوع کے لحاظ سے ہے: خراج مقاسمہ کاشت کے مکمل ہونے پر واجب ہوتا ہے اور پیداوار کے ساتھ دہرایا جاتا ہے؛ خراج وظیفہ سال میں ایک بار لیا جاتا ہے، زمین کے رقبے پر قمری سال کے آخر میں، اور فصل کے رقبے پر شمسی سال کے آخر میں؛ ابو حنیفہ کے نزدیک سال کے آغاز میں، اس شرط پر کہ زمین نامی رہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7592}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7593} حنفیہ اور حنابلہ نے ایک دو سال کی پیشگی وصولی جائز کہی؛ حنابلہ ہر صورت میں واپس کرتے ہیں، حنفیہ اس صورت میں جب لی ہوئی رقم باقی ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7593}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7594} تاخیر کی صورت میں صاحبِ حیثیت کو ادائیگی تک قید کیا جائے گا، اور تنگدست کو مہلت دی جائے گی اور قرض ذمے میں رہے گا؛ شافعیہ، حنابلہ اور صاحبین کے نزدیک یہ ساقط نہیں ہوتا، جبکہ ابو حنیفہ کے نزدیک جزیہ کی طرح ساقط ہو جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7594}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7595} واجب زمین کے قبضہ دار پر ہوتا ہے؛ اگر زمین اجارے یا عاریت پر دی ہو تو جمہور کے نزدیک مالک پر ہے، اور غاصب پر بھی واجب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7595} خراج عادل امام مقرر کرتا، طلب کرتا اور خرچ کرتا ہے، کوئی شخص خود تقسیم نہیں کر سکتا؛ جابر امام کو دینے سے جمہور کے نزدیک ذمہ بری ہو جاتا ہے۔ باغیوں کے قبضے والے شہر میں جو خراج وصول ہو وہ جمہور کے نزدیک ساقط ہے، مالکیہ دوبارہ ادا کرنے کو کہتے ہیں؛ ڈاکوؤں کو دینے سے ذمہ بری نہیں ہوتا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7596}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7597}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7598} عامل امام کا وکیل ہوتا ہے اور اجازت کے بغیر تقسیم نہیں کر سکتا؛ شرائط میں اسلام، آزادی، امانت، کفایت، علم و فقہ شامل ہیں، اور جمہور کے نزدیک ذمی کو خراج کی تقدیر پر مقرر نہیں کیا جاتا، جس کی دلیل «لا تتخذوا بطانة» اور عمر کا نصرانی کاتب سے انکار ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7599}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7600} عامل کے آداب یہ ہیں کہ وہ اہلِ خراج کے ساتھ نرمی کرے، پیداوار کے مطابق وصولی کرے، عدل کرے اور کسی کی رعایت نہ کرے، اور پاکدامن ہو کہ رشوت یا تحفہ نہ لے؛ خطابی کے نزدیک عمال کے تحفے حرام ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7601}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7602}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7603} امام پر لازم ہے کہ عمال کی نگرانی امین لوگوں سے کرائے اور انہیں کافی وظیفہ دے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7604} ٹھیکہ ⁦(قبالہ یا تضمین)⁩ میں کوئی شخص مقررہ رقم کے عوض خراج خود وصول کرنے کا ذمہ لیتا ہے؛ یہ اموی دور میں ظاہر ہوا اور عباسی دور میں پھیلا، احمد، ابو یوسف، ابو عبید اور ماوردی نے اسے ظلم کے سبب رد کیا، جبکہ ابو یوسف نے کہا کہ اگر امام ظلم سے محفوظ ہو اور اہلِ خراج راضی ہوں تو حرج نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7604}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7605}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7606} خراج کے ساقط ہونے کی صورتیں: پہلی، زمین کا کاشت کے قابل نہ رہنا کسی آفت سے، جس پر جمہور کے نزدیک خراج ساقط ہوتا ہے، اور قابل اصلاح ہو تو امام مصالح کے حصے سے اسے درست کرے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7606}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7607} دوسری، زمین کا معطل رہنا: اگر یہ مالک کی کوتاہی سے نہ ہو تو خراج نہیں، کوتاہی سے ہو تو مقاسمہ ساقط ہوتا ہے اور اسے کاشت کا حکم دیا جاتا ہے؛ خراج وظیفہ حنفیہ، شافعیہ اور حنابلہ کے نزدیک ساقط نہیں ہوتا، مالکیہ کے نزدیک ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7607}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7608} تیسری، قبل از کٹائی آسمانی آفت سے فصل تباہ ہو تو مقاسمہ ساقط ہوتا ہے؛ حنفیہ کے نزدیک وظیفہ کے ساقط ہونے کی دو شرطیں ہیں: سال میں تین مہینے بھی بوائی کے لیے باقی نہ ہوں، اور بچی ہوئی فصل خراج کے دگنے سے کم ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7608}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7609} چوتھی، امام کا مصلحت کے تحت کسی سے خراج معاف کرنا: حنابلہ اور ابو یوسف نے جائز کہا، محمد بن حسن نے منع کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7610} پانچویں، خراجی زمین پر تعمیر: جمہور مالکیہ، شافعیہ اور حنابلہ کے نزدیک خراج باقی رہتا ہے، حنفیہ کے نزدیک ساقط ہوتا ہے، اور ماوردی ضروری رہائش کے لیے ساقط کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7610}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7611} چھٹی، مالک کا اسلام لانا یا زمین کا کسی مسلمان کو منتقل ہونا: عنوی خراج باتفاق ساقط نہیں ہوتا، صلحی خراج جمہور کے نزدیک حدیثِ علاء بن حضرمی کی بنا پر ساقط ہو جاتا ہے، حنفیہ کے نزدیک نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7611}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7612} مسلمان پر عشر اور خراج کا اجتماع: جمہور مالکیہ، شافعیہ اور حنابلہ اسے واجب کہتے ہیں، حنفیہ منع کرتے ہیں اور «لا يجتمع على المسلم خراج وعشر» اور عمر کے دہقانہ کے بارے میں اثر سے استدلال کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7612}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7613} خراج کے مصارف فیء کے مصارف جیسے ہیں: فوجیوں، قاضیوں اور علماء کے وظائف، مساجد، سڑکوں، پلوں اور سرحدوں کی حفاظت؛ جمہور حنفیہ، مالکیہ اور حنابلہ اس کا خمس نہیں نکالتے، شافعیہ نکالتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7613}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7614} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7615}'
  es: "Kharaj es léxicamente el rendimiento de una cosa, y puede significar un alquiler o un gravamen o impuesto. Abu Ubayd y al-Layth tratan kharj y kharaj como una sola palabra, mientras que Abu Amr ibn al-Ala' los distingue: kharj es lo que uno da libremente, kharaj lo que uno debe pagar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7575}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7576} Como término técnico tiene un sentido general, los fondos que el estado recauda y gasta, y un sentido particular, el deber que el Imam impone sobre la tierra productiva; al-Mawardi y Abu Ya'la lo definen como los derechos establecidos sobre los límites de la tierra y pagados por ellos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7576} Otros nombres para este lugar son jizya terrestre, renta de la tierra y tasq, una palabra persa que aparece en la carta de Umar a Uthman ibn Hunayf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7576}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7577} Es distinto de ghanima, fay', jizya (un impuesto sobre las personas, no sobre la tierra), khums y 'ushr (el diezmo sobre la tierra propiedad de un musulmán). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7577} Cuando las conquistas aumentaron bajo Umar ibn al-Khattab, decidió no dividir la tierra tomada por la fuerza entre los conquistadores, sino mantenerla como una dotación para todos los musulmanes, con un kharaj fijo para sus cultivadores. Los Compañeros discreparon inicialmente; Abu Yusuf informa que Bilal ibn Rabah fue uno de los más firmes opositores; Umar argumentó a partir de los versículos sobre fay' en Surat al-Hashr y consultó a los Emigrantes y los Ayudantes hasta que se resolvió el asunto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7578}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7579} Los juristas basan su legitimidad en el Corán, la Sunna y el interés público. La Sunna citada incluye el informe 'Irak retuvo su dirham y qafiz' (una predicción profética del kharaj impuesto a la tierra), y la división por parte del Profeta de la mitad de Khaybar para las necesidades de la comunidad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7580}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7581} Los intereses citados son un ingreso estable para las generaciones futuras, evitar que la riqueza se concentre en un solo grupo y mantener la tierra cultivada por aquellos que mejor la conocen; para esto se cita el consejo de Mu'adh ibn Jabal a Umar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7581}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7582} El kharaj es exigible a todo poseedor de tierras productivas de kharaj, musulmán o no, adulto o menor, cuerdo o demente, hombre o mujer, puesto que es el costo del rendimiento de la tierra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7580} Por forma de gravamen está el kharaj al-wazifa, una suma fija adeudada sobre el área de la tierra y el tipo de cultivo que sea que produzca, que Umar impuso en al-Sawad, Egipto y Siria; y el kharaj al-muqasama, una parte de la producción como un cuarto o un quinto, que al-Mahdi introdujo en lugar de la suma fija, un cambio que el texto relaciona con la caída de los precios. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7582}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7583}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7584} Según el estatus de la tierra, hay sulhi kharaj, gravado sobre la tierra cuyos habitantes hicieron condiciones para conservarla, y 'anwi kharaj, gravado sobre la tierra tomada por la fuerza y mantenida para todos los musulmanes, incluyendo la tierra que sus habitantes abandonaron por miedo sin luchar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7584} Las tierras kharaj son de dos tipos: las establecidas por tratado y las abandonadas por miedo sin batalla, que según la mayoría de los juristas se convierten en una dotación para los musulmanes tras su confiscación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7584}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7585} Condiciones para la tierra kharaj: debe ser tierra kharaj, por lo que el wazifa no se debe en la tierra 'ushri; y debe ser productiva de hecho (por rendimiento) o en estimación (por aptitud para el cultivo), por lo que ningún kharaj cae en casas o en tierra estéril no apta para la agricultura. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7585}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7586} Cuando la tierra 'ushri pasa a un dhimmi, la mayoría de los juristas permiten la venta; Malik y un informe de Ahmad la prohíben. Luego difieren en lo que se debe: los shafiíes y la opinión preferida hanbalí la mantienen no kharaj; Abu Hanifa y Zufar lo convierten en kharaj; Malik y Abu Yusuf duplican el 'ushr sobre el dhimmi; Muhammad al-Shaybani lo mantiene 'ushri. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7586}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7587} Se discute si un dhimmi puede revivir una tierra árida con el permiso del Imam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7588} Las cantidades: los hanafis cobran un qafiz y un dirham por cada jarib cultivable, cinco dirhams por el trébol y diez por las vides, con un límite máximo de la mitad del rendimiento; Malik no fija una suma fija y la deja al criterio del Imam y de los expertos; Los shafiíes siguen las cifras de Uthman ibn Hunayf (dos dirhams sobre cebada, cuatro sobre trigo); los hanbalíes fijaron un dirham y un qafiz, y ocho dirhams sobre palmas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7588}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7589} En cuanto a subir o bajar las cifras de Umar, los shafiíes, un informe de Ahmad, Muhammad al-Shaybani y un informe de Abu Yusuf permiten ambas; Abu Hanifa permite solo bajar; un segundo informe de Ahmad permite solo subir; un tercer informe prohíbe ambas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7589}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7590} El evaluador considera la calidad del suelo, el costo del riego (el agua de lluvia y de río cuesta menos que el agua de pozo), el cultivo o la fruta, la proximidad a pueblos y mercados, y deja un margen para calamidades, como lo hizo el Profeta en la estimación de la fruta para el zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7590}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7591}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7592} El momento en que se debe depende del tipo: un gravamen de participación (muqasama) se debe en la cosecha y se repite con cada producción; Se cobra un impuesto fijo (wazifa) una vez al año, por año lunar para la superficie de tierra y por año solar para la superficie de cultivo; Abu Hanifa lo exige al comienzo del año con la condición de que la tierra siga siendo productiva. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7592}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7593} Los hanafíes y los hanbalíes permitían el pago por adelantado durante uno o dos años; los hanbalíes lo reembolsan en todos los casos, los hanafíes solo si la suma aún existe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7593}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7594} En caso de impago, un tenedor solvente es encarcelado hasta que pague a menos que venda bienes para ello; a un tenedor insolvente se le da un plazo y la deuda permanece. Los shafiíes, los hanbalíes y los dos compañeros de Abu Hanifa no lo eximen; Abu Hanifa lo exime por insolvencia, como lo hace con la jizya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7594}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7595} El deber recae sobre quien posee la tierra; si está arrendada o prestada, la mayoría de los juristas la colocan sobre el propietario, mientras que un usurpador la debe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7595} El Imam, justo en su gobierno, lo evalúa, lo exige y lo distribuye; nadie puede distribuirlo por sí mismo; quien paga a un gobernante injusto generalmente es liberado. Cuando los rebeldes se apoderan de una ciudad y lo recaudan, la mayoría de los juristas liberan a los pagadores; los malikíes exigen el reembolso. Los bandidos no liberan al pagador, ya que la suma es confiscada por la fuerza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7596}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7597}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7598} El recaudador (amil) actúa como agente del Imam y no puede distribuir la suma sin permiso; las condiciones son Islam, libertad, confiabilidad, suficiencia, conocimiento y comprensión (no se designa a un dhimmi para evaluarla, dicen la mayoría de los juristas, citando el versículo sobre no tomar un círculo interno de fuera de los creyentes y la negativa de Umar a un escriba cristiano). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7599}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7600} El recaudador debe ser amable, dividiendo el impuesto según cada cosecha; justo, sin favoritismos; y casto, sin aceptar sobornos ni regalos, ya que Khattabi considera ilícitos los regalos de los funcionarios. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7601}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7602}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7603} El Imam debe supervisar a los recaudadores a través de hombres de confianza y pagarles salarios suficientes, como Abu Ubayda le dijo a Umar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7604} El arrendamiento del impuesto (qabala o tadmin): una persona se compromete a recaudarlo por sí misma a un precio fijo; apareció bajo los Omeyas y se extendió bajo los Abasíes. Ahmad, Abu Yusuf, Abu Ubayd y al-Mawardi lo rechazaron por la injusticia que conlleva, mientras que Abu Yusuf lo permitió cuando el Imam está a salvo de la injusticia y los contribuyentes dan su consentimiento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7604}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7605}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7606} Causas de remisión: primero, la pérdida de aptitud de la tierra para el cultivo debido a un evento más allá de la acción humana, lo cual, según la mayoría de los juristas, remite el gravamen; donde se puede reparar, el Imam lo repara de la parte del interés público. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7606}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7607} Segundo, la ociosidad: si proviene de fuera del propietario, el gravamen caduca; si por negligencia del propietario, el gravamen de la parte caduca y se le ordena cultivar; el impuesto fijo no lo remiten los hanafis, shafiis y hanbalis, sino los malikis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7607}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7608} En tercer lugar, una cosecha perdida por un golpe celestial antes de la cosecha remite el impuesto sobre las acciones; Para el impuesto fijo los Hanafis exigen dos cosas: quedan menos de tres meses para otra siembra y la cosecha superviviente es menos del doble del impuesto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7608}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7609} Cuarto, la remisión del Imam por un interés público: permitida por los Hanbalis y Abu Yusuf, prohibida por Muhammad al-Shaybani. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7610} Quinto, construcción en tierras kharaj: la mayoría de los malikíes, shafiíes y hanbalíes mantienen el impuesto; los hanafíes lo eliminan; al-Mawardi lo elimina solo para una vivienda necesaria. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7610}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7611} Sexto, conversión del propietario o venta a un musulmán: el impuesto sobre tierras conquistadas nunca caduca; el impuesto sobre tratados caduca según la mayoría de los juristas, citando un informe de al-Ala' ibn al-Hadrami, pero no según los hanafíes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7611}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7612} 'ushr y kharaj conjuntos para un musulmán: la mayoría de los malikíes, shafiíes y hanbalíes requieren ambos; los hanafíes solo requieren kharaj, citando el informe de que ningún musulmán paga ambos y la orden de Umar sobre un converso de Nahr al-Malik. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7612}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7613} Los usos de kharaj siguen los de fay': el salario de los soldados, jueces, eruditos, mezquitas, caminos, puentes y defensa de fronteras; la mayoría de los hanafíes, malikíes y hanbalíes no toman una quinta parte, mientras que los shafiíes sí. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7613}{cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7614} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7615}"
  fr: "Le terme « kharaj » signifie littéralement le rendement d'une chose et peut désigner un loyer, une taxe ou un impôt. Abu Ubayd et al-Layth considèrent « kharj » et « kharaj » comme un seul et même mot, tandis qu'Abu Amr ibn al-Ala' les distingue: « kharj » désigne ce que l'on donne librement, « kharaj » ce que l'on doit payer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7575}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7576} En tant que terme technique, il possède un sens général, désignant les fonds que l'État perçoit et dépense, et un sens particulier, désignant l'obligation imposée par l'Imam sur les terres productives; al-Mawardi et Abu Ya'la le définissent comme les droits fonciers et les redevances qui en découlent. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.7576} Ses autres noms sont jizya foncier, rente foncière et tasq, un mot persan qui apparaît dans la lettre d'Umar à Uthman ibn Hunayf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7576}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7577} Il est distinct du ghanima, du fay', de la jizya (un prélèvement sur les personnes et non sur la terre), du khums et de l'ushr (la dîme sur la terre appartenant à un musulman). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7577} Lorsque les conquêtes s'intensifièrent sous le règne d'Umar ibn al-Khattab, il décida de ne pas partager les terres prises par la force entre les conquérants, mais de les considérer comme une dot pour tous les musulmans, assortie d'un kharaj fixe pour leurs cultivateurs. Les Compagnons eurent d'abord des divergences; Abu Yusuf rapporte que Bilal ibn Rabah fut parmi les plus fervents opposants. Umar s'appuya sur les versets relatifs au fay' dans la sourate al-Hashr et consulta les Émigrants et les Auxiliaires jusqu'à ce que la question soit tranchée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7578}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7579} Les juristes fondent sa légitimité sur le Coran, la Sunna et l'intérêt public. La Sunna citée inclut le récit selon lequel « l'Irak a retenu ses dirhams et ses qafiz » (une prédiction prophétique du kharaj imposé sur les terres), et le partage par le Prophète de la moitié de Khaybar pour les besoins de la communauté. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7580}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7581} Les intérêts mentionnés sont la garantie d'un revenu stable pour les générations futures, la prévention de la concentration des richesses entre les mains d'un seul groupe et le maintien de la terre cultivée par ceux qui la connaissent le mieux; à ce sujet, les conseils de Mu'adh ibn Jabal à Umar sont cités. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7581}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7582} Le kharaj est dû par tout propriétaire de terre productive soumise à kharaj, musulman ou non, adulte ou mineur, sain d'esprit ou non, homme ou femme, car il correspond au coût du rendement de la terre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7580} Il existe deux formes de prélèvement: le kharaj al-wazifa, une somme fixe due en fonction de la superficie et du type de culture, quel que soit le rendement, imposée par Umar à al-Sawad (Égypte et Syrie); et le kharaj al-muqasama, une part de la production (un quart ou un cinquième, par exemple), introduite par al-Mahdi en remplacement de la somme fixe, un changement que le texte associe à la baisse des prix. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7582}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7583}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7584} Selon le statut des terres, on distingue le sulhi kharaj, imposé sur les terres dont les habitants ont convenu de les conserver, et l'anwi kharaj, imposé sur les terres prises par la force et conservées pour tous les musulmans, y compris celles que leurs habitants ont abandonnées par crainte, sans combattre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7584} Les terres soumises au kharaj sont de deux types: celles qui ont fait l'objet d'un traité et celles qui ont été abandonnées par crainte, sans combat, lesquelles, selon la plupart des juristes, deviennent une dot pour les musulmans dès leur saisie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7584}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7585} Conditions pour les terres kharaj: il doit s’agir d’une terre kharaj, afin que la wazifa ne soit pas due sur une terre 'ushri; et elle doit être productive en réalité (par son rendement) ou estimée (par son aptitude à la culture), de sorte qu’aucune terre kharaj ne s’applique aux maisons ou aux terres stériles impropres à l’agriculture. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7585}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7586} Lorsqu’une terre 'ushri est transmise à un dhimmi, la plupart des juristes autorisent la vente; Malik et un hadith rapporté par Ahmad l’interdisent. Ils divergent ensuite sur les sommes dues: les Shafi’ites et l’avis hanbalite majoritaire la considèrent comme non-kharaj; Abu Hanifa et Zufar en font du kharaj; Malik et Abu Yusuf doublent le 'ushr sur le dhimmi; Muhammad al-Shaybani le garde 'ushri. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7586}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7587} La question de savoir si un dhimmi peut faire revivre une terre stérile avec la permission de l'Imam est controversée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7588} Les montants: les Hanafis prélèvent un qafiz et un dirham sur chaque jarib arable, cinq dirhams sur le trèfle et dix sur la vigne, avec un plafond à la moitié du rendement; Malik ne fixe aucune somme fixe et s'en remet au jugement de l'Imam et des experts; Les chaféites suivent les chiffres d'Uthman ibn Hunayf (deux dirhams sur l'orge, quatre sur le blé); les hanbalites attribuent un dirham et un qafiz, et huit dirhams aux palmiers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7588}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7589} Concernant l'élévation ou l'abaissement des chiffres d'Umar, les chaféites, un hadith rapporté par Ahmad, Muhammad al-Shaybani et un hadith rapporté par Abu Yusuf autorisent les deux; Abu Hanifa n'autorise que l'abaissement; un autre hadith rapporté par Ahmad n'autorise que l'élévation; un troisième hadith interdit les deux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7589}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7590} L'évaluateur prend en compte la qualité du sol, le coût de l'irrigation (l'eau de pluie et l'eau de rivière coûtent moins cher que l'eau de puits), la récolte ou le fruit, la proximité des villes et des marchés, et prévoit une marge pour les calamités, comme le Prophète le faisait dans l'estimation des fruits pour la zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7590}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7591}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7592} Le moment où elle est due dépend du type: une contribution (muqasama) est due à la récolte et se renouvelle à chaque récolte; Une redevance fixe (wazifa) est perçue annuellement, selon le calendrier lunaire pour les terres et le calendrier solaire pour les terres cultivées. Selon l'école hanafite, elle est exigible en début d'année, à condition que les terres restent productives. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7592}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7593} Les hanafites et les hanbalites autorisaient un paiement anticipé d'un ou deux ans; les hanbalites remboursent systématiquement cette somme, tandis que les hanafites ne la remboursent que si le solde est encore disponible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7593}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7594} En cas de défaut de paiement, le créancier solvable est emprisonné jusqu'à règlement, sauf si la dette est recouvrée par la vente de biens; le créancier insolvable bénéficie d'un délai de paiement et la dette est maintenue. Les Shafi'ites, les Hanbalites et les deux compagnons d'Abu Hanifa ne l'abandonnent pas; Abu Hanifa l'abandonne en cas d'insolvabilité, de même que la jizya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7594}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7595} L'obligation incombe à celui qui détient la terre; si elle est louée ou prêtée, la plupart des juristes l'imposent au propriétaire, tandis qu'un usurpateur en est redevable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7595} L'Imam, agissant avec justice, évalue, réclame et verse la jizya; nul ne peut la distribuer lui-même; celui qui la verse à un dirigeant injuste est généralement libéré. Lorsque des rebelles s'emparent d'une ville et la perçoivent, la plupart des juristes libèrent les payeurs; les Malikites exigent le remboursement. Les brigands ne libèrent pas le payeur, car la somme est saisie par la force. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7596}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7597}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7598} Le collecteur (amil) agit comme mandataire de l'imam et ne peut distribuer la somme sans autorisation; les conditions requises sont l'islam, la liberté, la fiabilité, la suffisance, la connaissance et la compréhension (un dhimmi n'est pas désigné pour l'évaluer, selon la plupart des juristes, citant le verset interdisant de prendre un cercle restreint en dehors des croyants et le refus d'Umar d'un scribe chrétien). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7599}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7600} Le collecteur doit être bienveillant, répartissant la taxe selon chaque récolte; juste, sans favoritisme; et chaste, n’acceptant ni pot-de-vin ni cadeau, car Khattabi déclare illicites les présents des fonctionnaires. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7601}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7602}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7603} L’imam doit superviser les collecteurs par l’intermédiaire d’hommes de confiance et leur verser des salaires suffisants, comme Abu Ubayda l’a conseillé à Umar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7604} La sous-traitance de la perception de la redevance (qabala ou tadmin) consiste pour une personne à s'engager à la percevoir elle-même à un prix fixe; cette pratique est apparue sous les Omeyyades et s'est répandue sous les Abbassides. Ahmad, Abu Yusuf, Abu Ubayd et al-Mawardi l'ont rejetée en raison de l'injustice qu'elle engendre, tandis qu'Abu Yusuf l'a autorisée lorsque l'imam est à l'abri de toute injustice et que les contribuables y consentent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7604}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7605}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7606} Causes de remise: premièrement, la perte d’aptitude de la terre à la culture suite à un événement indépendant de la volonté humaine, ce qui, selon la plupart des juristes, entraîne la remise de la taxe; lorsque la terre peut être réparée, l’imam la répare sur la part d’intérêt public. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7606}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7607} Deuxièmement, l’oisiveté: si elle provient d’une cause extérieure au propriétaire, la taxe est annulée; si elle résulte de la négligence du propriétaire, la taxe de part est annulée et il est enjoint de cultiver la terre. le prélèvement fixe n'est pas remis par les Hanafis, les Shafiis et les Hanbalis, mais par les Malikis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7607}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7608} Troisièmement, une récolte perdue à cause d'un coup céleste avant la récolte remet le prélèvement sur la part; Pour le prélèvement fixe, les Hanafis exigent deux choses: il reste moins de trois mois pour un autre semis, et la récolte restante est inférieure au double du prélèvement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7608}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7609} Quatrièmement, la rémission de l'Imam pour un intérêt public: autorisée par les Hanbalis et Abu Yusuf, interdite par Muhammad al-Shaybani. Cinquièmement, la construction sur des terres conquises (kharaj): la plupart des écoles malikite, chaféite et hanbalite maintiennent la taxe; les hanafites l’abandonnent; al-Mawardi ne l’abandonne que pour une habitation nécessaire. Sixièmement, la conversion du propriétaire ou la vente à un musulman: la taxe sur les terres conquises ne s’éteint jamais; la taxe issue du traité s’éteint selon la plupart des juristes, citant un rapport d’al-Ala’ ibn al-Hadrami, mais pas selon les hanafites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7611}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7612} Concernant le versement conjoint de l'ushr et du kharaj à un musulman: la plupart des écoles malikites, chaféites et hanbalites exigent les deux; les hanafites n'exigent que le kharaj, se basant sur le hadith selon lequel aucun musulman ne verse les deux et sur l'ordre d'Umar concernant un converti de Nahr al-Malik. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7612}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7613} L'utilisation du kharaj suit celle du fay': la solde des soldats, les juges, les savants, les mosquées, les routes, les ponts et la défense des frontières; la plupart des hanafites, malikites et hanbalites n'en prélèvent pas un cinquième, contrairement aux chaféites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7613}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7614} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7615}"
  tr: "'Kharaj' terimi, bir şeyden elde edilen getiriyi ifade eder ve kira, gasp veya vergi anlamına gelir. Abu Ubeyde ve Al-Layth'a göre harc ve kharaj aynı anlama gelir ve Abu Amr ibn Al-Ala bunları ayırır: kharj, bağış yaptığın şeydir, kharaj ise ödemekle yükümlü olduğun şeydir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7575} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7576} Terminolojide kharaj'ın iki anlamı vardır: genel, yani devlet tarafından toplanan ve harcanan fonlar ve özel, imamın gelişmekte olan vergi arazisine uyguladığı işlev veya vergi. Al-Mawardi ve Abu Ya'la, bunu, araziye verilen ve kendi adına ödenen haklar olarak tanımlamışlardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7576} Terminolojik terimleri arasında: cizyat al-'ard, 'ajra al-ard' ve 'al-tasq' vardır; bu, Umar'ın Osman ibn Hunayf'a yazdığı kitabda Arapça Farsça bir kelimedir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7576} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7577} Ganimet, fay, cizya, beşte bir ve ondalıklardan ayrılır; cizye baş üzerindedir, toprakta değil, ondalık ise bir Müslümanın sahip olduğu ondalık toprak üzerinde zekattır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7577} Ömer bin el-Hattab'ın halifeliği sırasında fetihler genişlediğinde, fethedilen toprakların zorla fatihler arasında paylaştırılmamasına, tüm Müslümanlara sabit bir vergi uygulanmasına karar verdi. Sahabeler başlangıçta farklı görüşteydi ve Ebu Yusuf, Bilal bin Rabah'ın en sert muhaliflerden biri olduğunu belirtti. Ömer, fief'te toplanma ayetini kanıt olarak gösterdi, mesele istikrara kavuşana kadar Mühacir ve Ensar'a danıştı. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7578} {Kaynak:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.. 7579} Fıskihler, Kur'an, Sünnet ve kamu yararına dayanarak meşruiyetini desteklemiştir: Sünnet arasında \"Irak dirhemlerini ve parasını kesti\" hadisi vardır; bu hadis vergilerin uygulanması ve Peygamber'in Haybar'ın Müslümanlar yararına ikiye bölünmesini bildirir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7580} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7581} Faydaları arasında: nesiller boyu istikrarlı bir mali kaynak sağlamak, serveti tek bir kategoriye kalmak yerine toprakları tarımla işlendirmek ve halkın en iyisini bildiği için toprağı tarımla işlemek. Bu, Mu'adh bin Jabal'ın Ömer için söylediği bir sözdür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7581} {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.7582} Kharaj, gelişmekte olan Kharaji toprağına sahip herkese, ister Müslüman ister gayrimüslim, genç ya da yaşlı, aklı başında ya da akli, erkek ya da kadın, büyüyen toprakların sağlandığı için zorunludur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7580} Türleri arasında, alınanlar arasında: Kharaj al-Wazah, yani tarım yeteneğiyle ilgili bir şeydir. Umar, bunu Al-Sawad, Mısır ve Levant topraklarında kullanmıştır. Kharaj al-Muqasama, dış bölgede bir çeyrek ve khums gibi yaygın bir yer olan bir yerdir ve al-Mehdi al-Abbasi tarafından iş yerine kurulmuştur ve bunun sebebinin düşük fiyat olduğu söylenir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7582} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7583} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7584} Toprak göz önüne alındığında: sahiplerinin ellerinde kalmayı kabul ettiği barışçıl kharaj ve imam tarafından Müslümanlara tahsis edildikten sonra zorla açılan ve halkının korkudan kaçtıklarını içeren varsayımsal kharaj. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7584} Harici toprakları türleri tartışılırken iki türden oluşur: halkı onunla barışanlar ve korku ve panikle savaşmadan kaçanlar. Çoğu hukukçuya göre, Müslümanlar ele geçirir ele geçirmez bir yerleşim yeri olarak kabul edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7584} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7585} Vergi amaçlı arazi koşulları vergilendirilmelidir; ondalık arazide herhangi bir iş zorunlu değildir ve gerçekten verimli şekilde veya tarıma uygunluğunun bir tahmini olarak ekili olmalıdır. Evde veya tarım için uygun olmayan arazide khara yoktur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7585} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7586} Eğer ondalık toprağı bir zimmiye devredilirse, çoğunluk ona satışına izin verir. Malik ve Ahmed bir rivayette onu yasaklamış, sonra zorunlu olanı reddetmişlerdir: Tercih edilen görüşe göre Şafiiler ve Hanbaliler vergi, Ebu Hanifa ve Zafar vergi saymaz, Malik ve Ebu Yusuf ondalığı iki katına çıkarır, Muhammed ibn al-Hasan ise ondalığı saklar. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7586} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7587} İmam izniyle ölen için zimminin yeniden canlandırılması konusunda bir anlaşmazlık vardır. {atı:fiqh-mawsua-kuwaitiyya-noor-v3 s.7588} Hanafilere göre kharaj miktarı tarım için uygun bir kese için bir kafiz ve bir dirhem, taze hurma için beş dirhem, bağlar için on dirhem ve enerjinin sonu dış kısmın yarısıdır; Malik'e göre, önceden tahmin edilmez, imam uzmanların yardımıyla çabalar; Şafiilere göre miktarlar Osman bin Hunayf içindir, arpa için iki dirhem ve buğday için dört dirhem; Hanbalilere göre bir dirhem ve bir dirhem palmiye ağaçları için sekiz dirhemdir. {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s.7588} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7589} Ve Umar'ın tahminine göre artış ve azalma hakkında: Şafiiler ve Ahmed bir rivayette ve Muhammed ibn al-Hasan izin verdi, Ebu Hanifa azaltıma izin verdi ama eklemeye izin vermedi, Ahmed ise azalma olmadan artışa izin verdi ve üçüncü bir rivayette bunları yasakladılar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7589} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7590} Kharaj tahmininde, toprak kalitesi ve hafif sulama kaynakları dikkate alınır; çünkü yağmur ve nehirler iyi sulananlardan daha fazladır, ürün veya meyve türü, arazinin şehirlere ve pazarlara yakınlığı ve meyve hasadında olduğu gibi felaketlerin atılması dikkate alınır. {cite:fiqh-mawsua-kuveytiyya-noor-v3 s.7590} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7591} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7592} Yükümlülük süresi vergi türüne göre değişir: vergi vergisi (kharaj) dikim tamamlandığında ödenir ve dış verginin tekrarlanmasıyla tekrarlanır. Verginin kharajı yılda bir kez alınır. Eğer arazi alanındaysa, ay yılının sonunda; ekim alanında ise güneş yılının sonunda; Abu Hanifa'ya göre, yetişen arazi sorumlu kişinin elinde kaldığı sürece yıl başında zorunludur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7592} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7593} Hanefi ve Hanbali hızlandırma yetkisi Hanafi ve Hanbali tarafından bir veya iki yıl süreyle verilir ve Hanbaliler bunu tamamen reddeder, ödünç alınan eşya kalırsa Hanafi reddeder. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7593} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7594} Toprak sahibi geç kalırsa, zengin ise, para satılmadıkça ödeme yapılana kadar geri tutulur. Eğer iflas etmişse, bakınız ve borç sorumluluğunda kalır. Harac, Şafiiler, Hanbaliler ve Sahabeler tarafından feragat edilmez, Abu Hanifa'ya göre ise cizye gibi feragat edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7594} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7595} ve topraktan talep eder, kiralarsa veya ödünç verirse, kharaj çoğunluğa göre sahibine aittir ve gaspçı kharajdan sorumludur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7595} kharajı hesaplayan, talep eden ve harcayan kişi adil imamdır ve kimse kendisi dağıtamaz. Haksız bir imama götüren kişi, çoğu hukukçu tarafından muaftır. Hakim oldukları topraklarda kharaj toplayan isyancılar için, halk tarafından sahiplerinden muaf tutulur. Maliki vergisi iade gerektirir ve savaşçılar kharajdan muaf tutulmazlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7596} {alıntı:fiqh-mawsua-kuveytiyya-noor-v3 s.7597}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7598} Vergi toplayıcı, İmam adına bir vekildir ve borçluluğunu ancak onun izni olmadan böler. İslam, özgürlük, güvenilirlik, toplumsallık, bilgi ve fıkıh gereklidir. Dhimmi, çoğu hukukçuya göre kharaj mütebiri olarak atanmaz. Bu, \"Yanınızdan yakın hizmetkâr alma\" ayeti ve Hristiyan yazardaki Umar'ın rivayetiyle desteklenir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7599} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7600} İşçinin görgü kuralları, vergi halkına karşı nazik olmak, vergiyi getirisine göre dağıtmak, adil olmak, kayırmacılık yapmamak, iffetli olmak ve rüşvet ya da hediye almamaktır; çünkü Al-Hattabi'ye göre işçilerin hediyeleri caiz sayılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7601} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7602} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7603} İmam, dinine ve güvenilirliğine güvendiği kişilerle işçileri denetlemeli ve onları tatmin edecek maaş vermelidir, tıpkı Abu Ubayde'nin Umar'a söylediği gibi. {atı:fiqh-mawsua-kuwaitiyya-noor-v3 s.7604} Ve kıbleb (kıbala veya tektamin): bir kişinin kendisi için kharaj toplama sorumluluğunu belirli bir miktar karşılığında üstlenmesi. Bu durum Emevi döneminde ortaya çıkmış ve Abbasi döneminde yayılmıştır. Ahmed, Ebu Yusuf, Ebu Ubeyd ve El-Mavardi bunu çürütmüş, ardından gelen adaletsizliği belirtmiştir. Ebu Yusuf, İmam adaletsizliği sağlarsa ve Kharaj halkı tatmin olursa buna izin vermiştir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7604} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7605} {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 s. 7606} ve vergi muafiyetleri: Birincisi, insan etkisinin ötesinde bir zararlı nedeniyle arazi tarıma uygun değildir, bu yüzden vergi kitleler tarafından muaf tutulur. Eğer onarılabilirse, imam çıkar payından onu düzeltir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7606} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7607} İkincisi: Toprağın ihmal edilmesi: eğer sahibi tarafından değilse vergi alınmaz; ama ihmal edilirse, bölünme vergisi kaldırılır ve dikilmesi emredilir. Görev vergisi Hanefi, Şafii ve Hanbali mezhebine göre değil, Malikilere göre kaldırılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7607} {atı:fiqh-mawsua-kuwaitiyya-noor-v3 s.7608} Üçüncü: Hasat öncesi göksel bir veba ile mahsul bir ürün yok edilmesi bölünmeyi geçersiz kılar ve Hanefilere göre işlev iki şartla geçersiz sayılır: yılın üç ayı ekim için yeterli kalmıyor ve kharajın iki katından az kalması. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7608} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7609} Dördüncü: İmamın bir kişiden çıkar uğruna vergi muafiyeti: Hanbaliler ve Ebu Yusuf buna izin verdi, Muhammed ibn al-Hasan ise yasakladı. {atı:fiqh-mawsua-kuwaitiyya-noor-v3 s.7610} Beşinci: Harici topraklarında inşaat: Kharaj, Maliki, Şafii ve Hanbalilerin çoğunluğuna göre kalır, ancak Hanefilere göre feragat edilir. Al-Mawardi bunun gereklilikten kaynaklandığını, aşırılıktan değil kabul eder. {alıntı:fiqh-mawsua-kuveytiyya-noor-v3 s.7610} {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s.7611} Altıncı: Mülk sahibinin İslamı veya arazinin bir Müslümana devri: Noter esaslı vergi anlaşmayla kaldırılmaz, Salhi vergisi çoğunluk tarafından Al-Alaa ibn al-Hadrami'nin hadislerine göre kaldırılır ve Hanefilere göre muaf tutulmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7611} {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.. 7612} Kharaj toprağına sahip bir Müslümanın ondalık ve kharaj birleşimi: Malikiler, Şafiiler ve Hanbalilerin çoğu bunu yasaklar ve bunu 'Bir Müslüman khaz ve ondalık biriktirmez' hadisi ile Ömer'in dihkana'daki raporuna dayandırırlar. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7612} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7613} ve kharaj harcamaları, savaşçıların, hakimlerin ve alimlerin geçim kaynaklarından elde edilen fonlar gibidir; cami, yol, köprü ve sınır köprülerinin inşasından elde edilen fonlar gibidir; Hanefi, Maliki ve Hanbali âlimlerinin çoğuna göre hums ödenmez, ancak hums Şafiiler tarafından ödenir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7613} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7614} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7615}"
  id: "Istilah 'kharaj' adalah istilah untuk hasil yang diperoleh dari sesuatu, dan merujuk pada sewa, pemerasan, atau pajak. Al-kharj dan kharaj memiliki makna yang sama menurut Abu Ubaidah dan Al-Layth, dan Abu Amr ibn Al-Ala membedakan keduanya: kharj adalah apa yang Anda sumbangkan, dan kharaj adalah apa yang wajib Anda bayar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7575} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7576} Dalam terminologi, kharaj memiliki dua makna: umum, yaitu dana yang dikumpulkan dan digunakan oleh negara, dan spesifik, yaitu fungsi atau pajak yang dikenakan oleh Imam atas tanah pajak yang sedang berkembang. Al-Mawardi dan Abu Ya'la mendefinisikannya sebagai hak-hak yang diberikan atas tanah yang dibayarkan atas nama mereka. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7576} Di antara istilah terminologisnya adalah: jizyat al-'ard, 'ajra al-ard', dan 'al-tasq', yang merupakan kata Persia yang diarabadikan yang disebutkan dalam kitab Umar kepada Uthman ibn Hunayf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7576} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7577} Ini dibedakan dari rampasan, fay, jizya, seperlima, dan persepuluhan; jizya berada di atas kepala, bukan di tanah, dan persepuluhan adalah zakat atas tanah persepuluhan milik seorang Muslim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7577} Ketika penaklukan berkembang selama kekhalifahan Umar ibn al-Khattab, ia memutuskan bahwa tanah yang ditaklukkan tidak boleh dibagi paksa di antara para penakluk, melainkan memberlakukan pajak tetap kepada semua Muslim. Para Sahabat awalnya berbeda pendapat, dan Abu Yusuf menyebutkan bahwa Bilal ibn Rabah adalah salah satu penentang paling keras. Umar mengutip ayat pengumpulan di wilayah sebagai bukti, berkonsultasi dengan Muhajirun dan Ansar sampai masalah itu stabil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7578} {cite:fiqh-mawsua-Kuwaitiyya-noor-v3 hlm. 7579} Para ahli hukum mendukung legitimasinya berdasarkan Al-Qur'an, Sunnah, dan kepentingan umum: Di antara Sunnah adalah hadits \"Irak menahan dirham dan uangnya,\" yang menginformasikan tentang pemungutan pajak dan pembagian Khaybar oleh Nabi menjadi dua demi kepentingan umat Islam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7580} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7581} Di antara manfaatnya adalah: menjamin sumber daya keuangan yang stabil untuk generasi, tidak membatasi kekayaan pada satu kategori, dan mengolah tanah melalui pertanian karena rakyatnya yang paling tahu. Ini adalah perpatah Mu'adh ibn Jabal untuk Umar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7581} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7582} Kharaj wajib bagi siapa pun yang memiliki tanah Kharaji yang sedang berkembang, baik Muslim maupun non-Muslim, muda atau tua, waras atau gila, pria atau wanita, karena itu adalah penyediaan tanah yang berkembang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7580} Di antara jenisnya, dengan mempertimbangkan yang dipilih: Kharaj al-Wazah, yang berkaitan dengan kemampuan bertani. Umar menggunakannya di tanah Al-Sawad, Mesir, dan Levant. Kharaj al-Muqasama, yang merupakan bagian umum dari luar seperti seperempat dan satu khum, didirikan oleh al-Mahdi al-Abbasi sebagai pengganti pekerjaan, dan dikatakan alasannya adalah harga yang rendah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7582} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7583} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7584} Mempertimbangkan tanah: kharaj damai, yang disepakati pemiliknya untuk tetap berada di tangan mereka dengan pajak yang diketahui, dan kharaj konsep, yang dibuka secara paksa setelah Imam memberikannya kepada umat Islam, dan mencakup apa yang ditinggalkan oleh rakyatnya karena ketakutan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7584} Tanah Kharij memiliki dua jenis jika membahas jenisnya: mereka yang rakyatnya telah berdamai dengannya, dan mereka yang penduduknya melarikan diri karena takut dan panik tanpa berperang. Menurut mayoritas ahli hukum, tanah ini dianggap sebagai penyelesaian bagi Muslim segera setelah mereka merebutnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7584} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7585} Syarat untuk tanah pajak harus dikenakan pajak; tidak ada pekerjaan yang wajib pada tanah persepuluhan, dan harus benar-benar dibudidayakan dengan hasil atau sebagai perkiraan kelayakannya untuk pertanian. Tidak ada khara di rumah atau di tanah yang tidak cocok untuk pertanian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7585} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7586} Jika tanah persepuluhan dialihkan ke dhimmi, mayoritas mengizinkan penjualannya kepadanya. Malik dan Ahmad melarangnya dalam narasi, maka mereka berbeda pendapat tentang apa yang wajib: Shafi'i dan Hanbalis menurut pandangan yang dipilih tidak menganggapnya pajak, Abu Hanifa dan Zafar menganggapnya pajak, Malik dan Abu Yusuf menggandakan persepuluhan, dan Muhammad ibn al-Hasan menyimpan persepuluhan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7586} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7587} Ada perselisihan mengenai kebangkitan dhimmi untuk almarhum atas izin Imam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7588} Jumlah kharaj menurut Hanafi adalah satu qafiz dan satu dirham untuk kantong yang cocok untuk pertanian, lima dirham untuk kurma segar, sepuluh untuk kebun anggur, dan ujung energinya setengah dari luar; menurut Malik, seseorang tidak bergantung pada perkiraan sebelumnya tetapi imam berusaha dengan bantuan para ahli; menurut syafi'i, jumlahnya untuk Uthman ibn Hunayf, termasuk dua dirham untuk jelai dan empat untuk gandum; menurut Hanbali, satu dirham dan satu dirham serta delapan dirham untuk pohon palem. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7588} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7589} Dan mengenai peningkatan dan penurunan menurut perkiraan Umar: syafi'i dan Ahmad dalam satu riwayat dan Muhammad ibn al-Hasan mengizinkan mereka, Abu Hanifa mengizinkan pengurangan tetapi tidak penambahan, dan Ahmad mengizinkan peningkatan tanpa pengurangan, dan mereka melarangnya dalam riwayat ketiga. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7589} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7590} Dalam memperkirakan kharaj, kualitas tanah dan sumber daya irigasi ringan diperhitungkan, karena hujan dan sungai lebih melimpah daripada irigasi yang baik, jenis tanaman atau buah, kedekatan tanah dengan kota dan pasar, serta penghilangan bencana seperti dalam panen buah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm. 7590} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7591} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7592} Waktu kewajiban bervariasi sesuai jenis pajak: pajak pajak (kharaj) harus dibayar setelah penanaman selesai dan diulang dengan penergian pajak eksternal. Kharaj bea diambil sekali setahun. Jika di area tanah, itu terjadi pada akhir tahun lunar; jika di area penanaman, berarti di akhir tahun matahari; menurut Abu Hanifa, wajib pada awal tahun, asalkan lahan tanam tetap berada di tangan orang yang bertanggung jawab. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7592} {cite:fiqh-mawsua-Kuwaitiyya-noor-v3 hlm.. 7593} Izin Hanafi dan Hanbali untuk mempercepat diberikan oleh Hanafi dan Hanbali selama satu atau dua tahun, dan Hanbal menolaknya secara mutlak, dan Hanafi menolaknya jika barang pinjaman tetap ada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7593} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7594} Jika pemilik tanah terlambat, jika dia kaya, dia ditahan sampai pembayaran dilakukan kecuali dia dijual uang. Jika dia bangkrut, lihat, dan utang tetap menjadi tanggung jawabnya. Kharaj tidak dihapuskan menurut Shafi'i, Hanbali, dan Para Sahabat, dan menurut Abu Hanifa, itu dibebaskan seperti jizya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7594} {cite:fiqh-mawsua-kuwaitiya-noor-v3 hlm.7595} dan mengklaimnya dari tanah, dan jika dia menyewa atau meminjamkannya, kharaj menjadi milik pemilik menurut mayoritas, dan perebut kekuasaan bertanggung jawab atas kharaj tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7595} Orang yang memperkirakan, menuntut, dan membelanjakan kharaj adalah imam yang adil, dan tidak ada yang boleh membagikannya sendiri. Siapa pun yang membawa imam yang tidak adil dibebaskan dari kharaj oleh mayoritas ahli hukum. Bagi pemberontak yang mengumpulkan kharaj di tanah yang mereka kuasai, kharaj itu dibebaskan dari pemiliknya oleh massa. Tugas Maliki memerlukan pengembalian, dan para prajurit tidak dibebaskan dari kharaj dengan membayarnya kepada mereka. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7596} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7597} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7598} Pemungut pajak adalah agen atas nama Imam yang tidak membagi hutangnya, kecuali dengan izinnya. Islam, kebebasan, kepercayaan, kebersamaan, pengetahuan, dan yurisprudensi diperlukan. Dhimmi tidak diangkat sebagai penilai kharaj menurut mayoritas ahli hukum. Hal ini didukung oleh ayat \"Jangan ambil pelayan dekat selain kamu\" dan narasi Umar dalam karya penulis Kristen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7599} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7600} Etika pekerja adalah bersikap baik kepada rakyat pajak dan membagikannya sesuai hasil, adil tanpa pilih kasih, dan suci serta tidak menerima suap atau hadiah, karena menurut Al-Khattabi, hadiah pekerja dianggap diperbolehkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7601} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7602} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7603} Imam harus mengawasi pekerja bersama mereka yang dipercayainya dalam agama dan kepercayaannya, serta memberikan gaji yang sesuai dengan mereka, seperti yang dikatakan Abu Ubaidah kepada Umar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7604} Dan qiblab (qibala atau taktamin): ketika seseorang mengambil tanggung jawab untuk mengumpulkan kharaj untuk dirinya sendiri sebagai imbalan sejumlah jumlah. Ini muncul pada era Umayyah dan menyebar selama masa Abbasiyah. Ahmad, Abu Yusuf, Abu Ubaid, dan Al-Mawardi membantahnya, menyebutkan ketidakadilan yang menyusul. Abu Yusuf mengizinkannya jika imam berhasil mendapatkan ketidakadilan dan rakyat kharaj merasa puas. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7604} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7605} {cite:fiqh-mawsua-Kuwaitiyya-noor-v3 hlm.. 7606} dan pembebasan pajak: Pertama, tanah tidak layak dibudidayakan karena hama yang tidak dapat dilakukan manusia, sehingga pajak dibebaskan oleh massa. Jika dapat diperbaiki, imam akan mengoreksinya dari bagian bunga. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7606} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7607} Kedua: Mengabaikan tanah: jika tanah itu bukan milik pemiliknya, maka tidak ada pajak; tetapi jika diabaikan, pajak pembagian dihapuskan dan diperintahkan untuk ditanam. Pajak atas fungsi ini tidak dibebaskan menurut mazhab Hanafi, Shafi'i, dan Hanbali, melainkan menurut Maliki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7607} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7608} Ketiga: Penghancuran hasil panen akibat wabah surga sebelum panen membatalkan pembagian tersebut, dan menurut Hanafi, fungsi ini dibatalkan dalam dua syarat: tidak ada tiga bulan tersisa dalam setahun yang cukup untuk penanaman, dan kurang dari dua kali kharaj yang tersisa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7608} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7609} Keempat: Penghapusan pajak oleh Imam demi keuntungan: Hanbalis dan Abu Yusuf mengizinkannya, dan Muhammad ibn al-Hasan melarangnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm. 7610} Kelima: Pembangunan di tanah Kharij: Kharaj tetap ada menurut mayoritas Maliki, Shafi'i, dan Hanbali, tetapi dibebaskan menurut Hanafi. Al-Mawardi menganggapnya karena pembangunan yang diperlukan, bukan berlebihan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7610} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7611} Keenam: Islam pemilik atau penyerahan tanah kepada seorang Muslim: Pajak berbasis notaris tidak dibebaskan berdasarkan kesepakatan, dan pajak salhi dibebaskan oleh mayoritas menurut hadits Al-Alaa ibn al-Hadrami, dan tidak dihapuskan menurut Hanafi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7611} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm. 7612} Penggabungan persepuluhan dan kharaj pada Muslim yang memiliki tanah kharaj: mayoritas Maliki, Shafi'i, dan Hanbal melarangnya, dan mereka mendasarkannya pada hadits 'Seorang Muslim tidak mengumpulkan kharaj dan persepuluhan' serta laporan Umar dalam Dihqana. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7612} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7613} dan pengeluaran kharaj seperti dana umat Islam, dari mata pencaharian para pejuang, hakim, dan ulama, serta pembangunan masjid, jalan, jembatan, dan jembatan perbatasan; menurut mayoritas ulama Hanafi, Maliki, dan Hanbali, khums bukanlah khum yang dibayar, melainkan khum dibayar oleh syafi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7613} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7614} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7615}"
