id: concept/kharaj-fiqh
class: concept
kind: legal
label:
  ar: الخراج (الموسوعة الفقهية)
  en: Kharaj (land levy, fiqh entry)
  ur: خراج (فقہی اصطلاح)
summary:
  ar: 'الخراج لغة الغلة الحاصلة من الشيء، ويطلق على الأجرة وعلى الإتاوة أو الضريبة. والخرج والخراج بمعنى واحد عند أبي عبيدة والليث، وفرق أبو عمرو بن العلاء بينهما: فالخرج ما تبرعت به، والخراج ما لزمك أداؤه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7575}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7576} وفي الاصطلاح للخراج معنيان: عام، وهو الأموال التي تتولى الدولة جبايتها وصرفها، وخاص، وهو الوظيفة أو الضريبة التي يفرضها الإمام على الأرض الخراجية النامية، وعرفه الماوردي وأبو يعلى بأنه ما وضع على رقاب الأرض من حقوق تؤدى عنها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7576} ومن ألفاظه في الاصطلاح: جزية الأرض، وأجرة الأرض، والطسق، وهي كلمة فارسية معربة وردت في كتاب عمر إلى عثمان بن حنيف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7576}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7577} وتتميز عن الغنيمة والفيء والجزية والخمس والعشر، فالجزية على الرؤوس لا على الأرض، والعشر زكاة الأرض العشرية التي يملكها مسلم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7577} ولما اتسعت الفتوحات في خلافة عمر بن الخطاب رأى ألا تقسم الأرض المفتوحة عنوة بين الفاتحين، بل توقف على جميع المسلمين ويضرب عليها خراج معلوم، فاختلف الصحابة في البداية، وذكر أبو يوسف أن بلال بن رباح كان من أشد المخالفين، واستدل عمر بآية الحشر في الفيء، واستشار المهاجرين والأنصار حتى استقر الأمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7578}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7579} واحتج الفقهاء لمشروعيته بالقرآن والسنة والمصلحة: ومن السنة حديث «منعت العراق درهمها وقفيزها» الذي فيه إخبار بما سيقع من ضرب الخراج، وقسمة النبي نصف خيبر لمصلحة المسلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7580}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7581} ومن المصالح: تأمين مورد مالي ثابت للأجيال، وعدم حصر الثروة في فئة، وعمارة الأرض بالزراعة لأن أهلها أعلم بها، وفي هذا قول معاذ بن جبل لعمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7581}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7582} والخراج واجب على كل من بيده أرض خراجية نامية، مسلما كان أو كافرا، صغيرا أو كبيرا، عاقلا أو مجنونا، رجلا أو امرأة، لأنه مؤونة الأرض النامية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7580} ومن أنواعه باعتبار المأخوذ: خراج الوظيفة وهو شيء في الذمة يتعلق بالتمكن من الزراعة، وقد وظفه عمر على أرض السواد ومصر والشام، وخراج المقاسمة وهو جزء شائع من الخارج كالربع والخمس، وقد قرره المهدي العباسي بدلا من الوظيفة، ويقال إنه كان سببه نقص السعر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7582}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7583}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7584} وباعتبار الأرض: الخراج الصلحي، وهو ما صولح عليه أهلها على بقائها بيدهم بخراج معلوم، والخراج العنوي، وهو ما افتتح عنوة بعد أن وقفه الإمام على المسلمين، ويدخل فيه ما جلا عنه أهله خوفا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7584} والأرض الخراجية نوعان عند الكلام على أنواعها: ما صولح المسلمون أهلها عليها، وما جلا عنها أهلها خوفا وفزعا دون قتال، وهي عند جمهور الفقهاء وقف على المسلمين بمجرد الاستيلاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7584}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7585}'
  en: 'Kharaj is lexically the yield of a thing, and it can mean a rent or a levy or tax. Abu Ubayd and al-Layth treat kharj and kharaj as one word, while Abu Amr ibn al-Ala'' distinguishes them: kharj is what one gives freely, kharaj what one must pay. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7575}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7576} As a technical term it has a general sense, the funds the state collects and spends, and a particular sense, the duty the Imam imposes on productive land; al-Mawardi and Abu Ya''la define it as the rights laid on the necks of land and paid for it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7576} Other names for it are land jizya, land rent, and tasq, a Persian word that appears in Umar''s letter to Uthman ibn Hunayf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7576}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7577} It is distinct from ghanima, fay'', jizya (a levy on persons, not land), khums and ''ushr (the tithe on land owned by a Muslim). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7577} When conquests grew under Umar ibn al-Khattab, he decided not to divide land taken by force among the conquerors but to hold it as an endowment for all Muslims, with a fixed kharaj on its cultivators. Companions first differed; Abu Yusuf reports that Bilal ibn Rabah was among the strongest objectors; Umar argued from the verses on fay'' in Surat al-Hashr and consulted the Emigrants and the Helpers until the matter was settled. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7578}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7579} Jurists base its legitimacy on the Qur''an, the Sunna and public interest. The Sunna cited includes the report ''Iraq withheld its dirham and qafiz'' (a prophetic foretelling of the kharaj imposed on land), and the Prophet''s division of half of Khaybar for the needs of the community. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7580}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7581} The interests cited are a stable revenue for future generations, keeping wealth from concentrating in one group, and keeping land cultivated by those who know it best; Mu''adh ibn Jabal''s advice to Umar is quoted for this. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7581}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7582} Kharaj is due on every holder of productive kharaj land, Muslim or not, adult or minor, sane or insane, man or woman, since it is the cost of the land''s yield. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7580} By form of levy there is kharaj al-wazifa, a fixed sum owed on the land''s area and crop type whatever it yields, which Umar imposed on al-Sawad, Egypt and Syria; and kharaj al-muqasama, a share of the produce such as a quarter or a fifth, which al-Mahdi introduced in place of the fixed sum, a change that the text connects to falling prices. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7582}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7583}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7584} By status of the land there is sulhi kharaj, levied on land whose people made terms to keep it, and ''anwi kharaj, levied on land taken by force and held for all Muslims, including land its people left in fear without fighting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7584} Kharaj lands are of two kinds: those settled by treaty, and those abandoned out of fear without battle, which by most jurists become an endowment for Muslims upon seizure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7584}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7585}'
  ur: 'خراج لغت میں کسی چیز کی پیداوار یا آمدنی کو کہتے ہیں، اور اجرت یا ٹیکس کے معنی میں بھی آتا ہے۔ ابو عبید اور لیث کے نزدیک خرج اور خراج ایک ہیں، جبکہ ابو عمرو بن العلاء کے نزدیک خرج وہ ہے جو تم بطور احسان دو، اور خراج وہ جو تم پر لازم ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7575}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7576} اصطلاح میں خراج کے دو معنی ہیں: عام، یعنی وہ اموال جن کی وصولی اور خرچ ریاست کرتی ہے، اور خاص، یعنی وہ ٹیکس جو امام زرخیز زمین پر لگائے؛ ماوردی اور ابو یعلیٰ کے نزدیک یہ زمین کی گردن پر لازم وہ حقوق ہیں جو اس کے عوض ادا کیے جائیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7576} اس کے دیگر نام جزیۃ الارض، اجرۃ الارض اور طسق ہیں، جو فارسی لفظ ہے اور عمر کے عثمان بن حنیف کو لکھے خط میں آیا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7576}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7577} یہ غنیمت، فیء، جزیہ، خمس اور عشر سے مختلف ہے؛ جزیہ سروں پر ہوتا ہے زمین پر نہیں، اور عشر مسلمان کی ملکیتی زمین کی زکوٰۃ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7577} عمر بن خطاب کے دور میں فتوحات بڑھیں تو انہوں نے طاقت سے فتح کی گئی زمین فاتحین میں تقسیم نہ کی بلکہ تمام مسلمانوں کے لیے وقف رکھی اور کاشت کاروں پر معین خراج لگایا؛ ابتدا میں صحابہ میں اختلاف ہوا، ابو یوسف کے مطابق بلال بن رباح سب سے زیادہ مخالف تھے، اور عمر نے سورۂ حشر کی فیء والی آیات سے استدلال کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7578}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7579} اس کی شرعی بنیاد قرآن، سنت اور مصلحت ہیں؛ سنت میں «منعت العراق درهمها وقفيزها» والی حدیث اور نبی کا خیبر کے نصف کو مسلمانوں کی مصلحت کے لیے رکھنا پیش کیا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7580}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7581} مصالح میں آنے والی نسلوں کے لیے مستقل آمدنی، دولت کا ایک گروہ میں سمٹنے سے بچاؤ، اور زمین کی آبادکاری شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7581}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7582} خراج ہر اس شخص پر واجب ہے جس کے پاس زرخیز خراجی زمین ہو، خواہ مسلمان ہو یا کافر، بالغ ہو یا نابالغ، عاقل ہو یا مجنون، مرد ہو یا عورت۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7580} اس کی اقسام میں خراج الوظیفہ ہے، یعنی زمین کے رقبے اور فصل کی نوعیت پر مقرر رقم، جو عمر نے سواد، مصر اور شام پر لگائی، اور خراج المقاسمہ ہے، یعنی پیداوار کا ایک حصہ، جو مہدی عباسی نے وظیفہ کی جگہ مقرر کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7582}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7583}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7584} زمین کی حیثیت کے لحاظ سے خراج صلحی (صلح کے ذریعے زمین والوں کے قبضے میں رہنے پر لیا جانے والا) اور خراج عنوی (طاقت سے فتح شدہ زمین پر، جو امام مسلمانوں کے لیے وقف کر دے) ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7584}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7585}'
