id: concept/kharaj-fiqh
class: concept
kind: legal
label:
  ar: الخراج (الموسوعة الفقهية)
  en: Kharaj (land levy, fiqh entry)
  ur: خراج (فقہی اصطلاح)
summary:
  ar: 'الخراج لغة الغلة الحاصلة من الشيء، ويطلق على الأجرة وعلى الإتاوة أو الضريبة. والخرج والخراج بمعنى واحد عند أبي عبيدة والليث، وفرق أبو عمرو بن العلاء بينهما: فالخرج ما تبرعت به، والخراج ما لزمك أداؤه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7575}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7576} وفي الاصطلاح للخراج معنيان: عام، وهو الأموال التي تتولى الدولة جبايتها وصرفها، وخاص، وهو الوظيفة أو الضريبة التي يفرضها الإمام على الأرض الخراجية النامية، وعرفه الماوردي وأبو يعلى بأنه ما وضع على رقاب الأرض من حقوق تؤدى عنها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7576} ومن ألفاظه في الاصطلاح: جزية الأرض، وأجرة الأرض، والطسق، وهي كلمة فارسية معربة وردت في كتاب عمر إلى عثمان بن حنيف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7576}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7577} وتتميز عن الغنيمة والفيء والجزية والخمس والعشر، فالجزية على الرؤوس لا على الأرض، والعشر زكاة الأرض العشرية التي يملكها مسلم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7577} ولما اتسعت الفتوحات في خلافة عمر بن الخطاب رأى ألا تقسم الأرض المفتوحة عنوة بين الفاتحين، بل توقف على جميع المسلمين ويضرب عليها خراج معلوم، فاختلف الصحابة في البداية، وذكر أبو يوسف أن بلال بن رباح كان من أشد المخالفين، واستدل عمر بآية الحشر في الفيء، واستشار المهاجرين والأنصار حتى استقر الأمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7578}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7579} واحتج الفقهاء لمشروعيته بالقرآن والسنة والمصلحة: ومن السنة حديث «منعت العراق درهمها وقفيزها» الذي فيه إخبار بما سيقع من ضرب الخراج، وقسمة النبي نصف خيبر لمصلحة المسلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7580}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7581} ومن المصالح: تأمين مورد مالي ثابت للأجيال، وعدم حصر الثروة في فئة، وعمارة الأرض بالزراعة لأن أهلها أعلم بها، وفي هذا قول معاذ بن جبل لعمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7581}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7582} والخراج واجب على كل من بيده أرض خراجية نامية، مسلما كان أو كافرا، صغيرا أو كبيرا، عاقلا أو مجنونا، رجلا أو امرأة، لأنه مؤونة الأرض النامية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7580} ومن أنواعه باعتبار المأخوذ: خراج الوظيفة وهو شيء في الذمة يتعلق بالتمكن من الزراعة، وقد وظفه عمر على أرض السواد ومصر والشام، وخراج المقاسمة وهو جزء شائع من الخارج كالربع والخمس، وقد قرره المهدي العباسي بدلا من الوظيفة، ويقال إنه كان سببه نقص السعر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7582}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7583}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7584} وباعتبار الأرض: الخراج الصلحي، وهو ما صولح عليه أهلها على بقائها بيدهم بخراج معلوم، والخراج العنوي، وهو ما افتتح عنوة بعد أن وقفه الإمام على المسلمين، ويدخل فيه ما جلا عنه أهله خوفا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7584} والأرض الخراجية نوعان عند الكلام على أنواعها: ما صولح المسلمون أهلها عليها، وما جلا عنها أهلها خوفا وفزعا دون قتال، وهي عند جمهور الفقهاء وقف على المسلمين بمجرد الاستيلاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7584}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7585} شروط الأرض الخراجية أن تكون خراجية، فلا تجب الوظيفة على الأرض العشرية، وأن تكون نامية حقيقة بالغلة أو تقديرا بصلاحيتها للزراعة، فلا خراج على الدور ولا على الموات غير الصالح للزراعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7585}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7586} وإذا انتقلت الأرض العشرية إلى ذمي جوز الجمهور بيعها له، ومنعه مالك وأحمد في رواية، ثم اختلفوا فيما يجب عليه: فالشافعية والحنابلة في الراجح لا تصير خراجية، وأبو حنيفة وزفر يصيرها خراجية، ومالك وأبو يوسف يضاعفون عليه العشر، ومحمد بن الحسن يبقيها عشرية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7586}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7587} وفي إحياء الذمي للموات بإذن الإمام خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7588} ومقدار الخراج عند الحنفية قفيز ودرهم في الجريب الصالح للزراعة، وخمسة دراهم للرطبة، وعشرة للكرم، ونهاية الطاقة نصف الخارج؛ وعند مالك لا يتقيد بتقدير سابق بل يجتهد الإمام مستعينا بأهل الخبرة؛ وعند الشافعية مقادير عثمان بن حنيف، ومنها درهمان للشعير وأربعة للحنطة؛ وعند الحنابلة درهم وقفيز، وثمانية دراهم للنخل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7588}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7589} وفي الزيادة والنقصان على تقدير عمر: أجازهما الشافعية وأحمد في رواية ومحمد بن الحسن، وأجاز أبو حنيفة النقصان دون الزيادة، وأجاز أحمد في رواية الزيادة دون النقصان، ومنعهما في رواية ثالثة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7589}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7590} ويراعى في تقدير الخراج جودة التربة، وخفة مؤونة السقي فالأمطار والأنهار أكثر مما يسقى بالبئر، ونوع الزرع أو الثمر، وقرب الأرض من المدن والأسواق، وترك نسبة للنوائب كما في خرص الثمار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7590}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7591}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7592} وقت الوجوب يختلف بنوع الخراج: فخراج المقاسمة يجب عند كمال الزرع ويتكرر بتكرر الخارج، وخراج الوظيفة يؤخذ مرة في السنة، فإن كان على مساحة الأرض فعند نهاية السنة القمرية، وإن كان على مساحة الزرع فعند نهاية السنة الشمسية؛ وعند أبي حنيفة يجب في أول السنة بشرط بقاء الأرض النامية في يد المكلف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7592}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7593} والتعجيل أجازه الحنفية والحنابلة لسنة أو سنتين، ويرده الحنابلة مطلقا، ويرده الحنفية إن بقي المأخوذ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7593}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7594} وإذا تأخر صاحب الأرض، فإن كان موسرا حُبس حتى يؤدي إلا أن يباع له مال، وإن كان معسرا أُنظر، ويبقى دينا في ذمته، ولا يسقط الخراج عند الشافعية والحنابلة والصاحبين، ويسقط عند أبي حنيفة كالجزية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7594}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7595} ويطالب به من بيده الأرض، وإذا أجرها أو أعارها فالخراج على المالك في قول الجمهور، والغاصب يضمن الخراج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7595} والذي يقدر الخراج ويطالب به ويصرفه هو الإمام العادل، ولا يجوز لأحد أن يوزعه بنفسه، ومن أدى إلى إمام جائر سقط عنه عند جماهير الفقهاء، وعلى البغاة إذا جبوا الخراج في بلد غلبوا عليه يسقط عن أهله عند الجماهير، ويوجب المالكية الإعادة، والمحاربون لا يسقط عنهم الخراج بالدفع إليهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7596}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7597}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7598} وعامل الخراج وكيل عن الإمام لا يقسم ما جباه إلا بإذنه، ويشترط فيه الإسلام والحرية والأمانة والكفاية والعلم والفقه، ولا يولى الذمي تقدير الخراج عند جمهور الفقهاء، ويستدل لذلك بقوله تعالى «لا تتخذوا بطانة من دونكم» وبأثر عمر في الكاتب النصراني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7599}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7600} آداب العامل أن يرفق بأهل الخراج فيوزعه بقدر الغلة، وأن يعدل فلا يحابي، وأن يكون عفيفا فلا يقبل رشوة ولا هدية، لأن هدايا العمال عند الخطابي سحت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7601}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7602}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7603} وعلى الإمام مراقبة العمال بمن يوثق بدينه وأمانته، وأن يرزقهم رواتب تكفيهم، كما قال أبو عبيدة لعمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7604} والتقبيل (القبالة أو التضمين): أن يتكفل شخص بتحصيل الخراج لنفسه مقابل قدر معين، وقد ظهر في العصر الأموي وانتشر في العباسي، فرده أحمد وأبو يوسف وأبو عبيد والماوردي، وذكروا ما يتبعه من الظلم، وأجازه أبو يوسف إن أمن الإمام الظلم ورضي أهل الخراج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7604}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7605}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7606} ومسقطات الخراج: أولا انعدام صلاحية الأرض للزراعة بآفة خارجة عن فعل الإنسان، فيسقط الخراج عند الجماهير، فإن أمكن إصلاحها أصلحها الإمام من سهم المصالح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7606}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7607} ثانيا تعطيل الأرض: إن كان من غير صاحبها فلا خراج، وإن كان بتفريطه سقط خراج المقاسمة وأمر بزراعتها، ولا يسقط خراج الوظيفة عند الحنفية والشافعية والحنابلة، ويسقط عند المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7607}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7608} ثالثا هلاك الزرع بآفة سماوية قبل الحصاد يسقط المقاسمة، وعند الحنفية يسقط الوظيفة بشرطين: ألا يبقى من السنة ثلاثة أشهر تتسع للزراعة، وأن يبقى من الزرع أقل من ضعف الخراج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7608}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7609} رابعا إسقاط الإمام الخراج عن شخص لمصلحة: أجازه الحنابلة وأبو يوسف، ومنعه محمد بن الحسن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7610} خامسا البناء على الأرض الخراجية: يبقى الخراج عند الجمهور من المالكية والشافعية والحنابلة، ويسقط عند الحنفية، ويرى الماوردي السقوط للبناء الضروري دون الزائد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7610}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7611} سادسا إسلام المالك أو انتقال الأرض إلى مسلم: لا يسقط الخراج العنوي باتفاق، والصلحي يسقط عند الجمهور لحديث العلاء بن الحضرمي، ولا يسقط عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7611}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7612} واجتماع العشر والخراج على مسلم يملك الأرض الخراجية: يوجبه الجمهور من المالكية والشافعية والحنابلة، ويمنعه الحنفية، ويستدلون بحديث «لا يجتمع على المسلم خراج وعشر» وبأثر عمر في الدهقانة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7612}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7613} ومصارف الخراج كمصارف الفيء في مصالح المسلمين، من أرزاق المقاتلة والقضاة والعلماء، وعمارة المساجد والطرق والقناطر وسد الثغور؛ ولا يخمس عند الجمهور من الحنفية والمالكية والحنابلة، ويخمسه الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7613}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7614}'
  en: 'Kharaj is lexically the yield of a thing, and it can mean a rent or a levy or tax. Abu Ubayd and al-Layth treat kharj and kharaj as one word, while Abu Amr ibn al-Ala'' distinguishes them: kharj is what one gives freely, kharaj what one must pay. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7575}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7576} As a technical term it has a general sense, the funds the state collects and spends, and a particular sense, the duty the Imam imposes on productive land; al-Mawardi and Abu Ya''la define it as the rights laid on the necks of land and paid for it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7576} Other names for it are land jizya, land rent, and tasq, a Persian word that appears in Umar''s letter to Uthman ibn Hunayf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7576}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7577} It is distinct from ghanima, fay'', jizya (a levy on persons, not land), khums and ''ushr (the tithe on land owned by a Muslim). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7577} When conquests grew under Umar ibn al-Khattab, he decided not to divide land taken by force among the conquerors but to hold it as an endowment for all Muslims, with a fixed kharaj on its cultivators. Companions first differed; Abu Yusuf reports that Bilal ibn Rabah was among the strongest objectors; Umar argued from the verses on fay'' in Surat al-Hashr and consulted the Emigrants and the Helpers until the matter was settled. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7578}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7579} Jurists base its legitimacy on the Qur''an, the Sunna and public interest. The Sunna cited includes the report ''Iraq withheld its dirham and qafiz'' (a prophetic foretelling of the kharaj imposed on land), and the Prophet''s division of half of Khaybar for the needs of the community. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7580}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7581} The interests cited are a stable revenue for future generations, keeping wealth from concentrating in one group, and keeping land cultivated by those who know it best; Mu''adh ibn Jabal''s advice to Umar is quoted for this. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7581}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7582} Kharaj is due on every holder of productive kharaj land, Muslim or not, adult or minor, sane or insane, man or woman, since it is the cost of the land''s yield. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7580} By form of levy there is kharaj al-wazifa, a fixed sum owed on the land''s area and crop type whatever it yields, which Umar imposed on al-Sawad, Egypt and Syria; and kharaj al-muqasama, a share of the produce such as a quarter or a fifth, which al-Mahdi introduced in place of the fixed sum, a change that the text connects to falling prices. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7582}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7583}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7584} By status of the land there is sulhi kharaj, levied on land whose people made terms to keep it, and ''anwi kharaj, levied on land taken by force and held for all Muslims, including land its people left in fear without fighting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7584} Kharaj lands are of two kinds: those settled by treaty, and those abandoned out of fear without battle, which by most jurists become an endowment for Muslims upon seizure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7584}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7585} Conditions for kharaj land: it must be kharaj land, so the wazifa is not owed on ''ushri land; and it must be productive in fact (by yield) or in estimate (by fitness for cultivation), so no kharaj falls on houses or on barren land unfit for farming. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7585}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7586} When ''ushri land passes to a dhimmi, most jurists allow the sale; Malik and one report of Ahmad forbid it. They then differ on what falls due: the Shafiis and the preferred Hanbali view keep it non-kharaj; Abu Hanifa and Zufar make it kharaj; Malik and Abu Yusuf double the ''ushr on the dhimmi; Muhammad al-Shaybani keeps it ''ushri. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7586}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7587} Whether a dhimmi may revive barren land with the Imam''s leave is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7588} The amounts: the Hanafis levy a qafiz and a dirham on each arable jarib, five dirhams on clover and ten on vines, with the ceiling at half the yield; Malik sets no fixed sum and leaves it to the Imam''s judgement with experts; the Shafiis follow the figures of Uthman ibn Hunayf (two dirhams on barley, four on wheat); the Hanbalis set a dirham and a qafiz, and eight dirhams on palms. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7588}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7589} On raising or lowering Umar''s figures, the Shafiis, one report of Ahmad, Muhammad al-Shaybani and one report of Abu Yusuf allow both; Abu Hanifa allows only lowering; a second report of Ahmad allows only raising; a third report forbids both. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7589}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7590} The assessor considers soil quality, the cost of irrigation (rain and river water cost less than well water), the crop or fruit, nearness to towns and markets, and leaves a margin for calamities, as the Prophet did in the estimation of fruit for zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7590}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7591}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7592} When it is due depends on the type: a share levy (muqasama) is due at harvest and recurs with each yield; a fixed levy (wazifa) is taken once a year, by the lunar year for land area and the solar year for crop area; Abu Hanifa has it due at the start of the year on condition the land stays productive. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7592}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7593} Advance payment was allowed by the Hanafis and Hanbalis for a year or two; the Hanbalis refund it in all cases, the Hanafis only if the sum still exists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7593}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7594} On default, a solvent holder is jailed until he pays unless goods are sold for it; an insolvent holder is given time and the debt stays. The Shafiis, the Hanbalis and the two companions of Abu Hanifa do not drop it; Abu Hanifa drops it on insolvency, as he does the jizya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7594}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7595} The duty falls on whoever holds the land; if it is let or lent, most jurists place it on the owner, while a usurper owes it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7595} The Imam, just in his rule, assesses, demands and disburses it; no one may distribute it himself; whoever pays an unjust ruler is generally released. Where rebels seize a town and collect it, most jurists release the payers; the Malikis require repayment. Brigands do not release the payer, since the sum is seized by force. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7596}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7597}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7598} The collector (amil) acts as the Imam''s agent and may not distribute the sum without leave; the conditions are Islam, freedom, trustworthiness, sufficiency, knowledge and understanding (a dhimmi is not appointed to assess it, most jurists say, citing the verse on not taking an inner circle from outside the believers and Umar''s refusal of a Christian scribe). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7599}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7600} The collector should be gentle, dividing the levy according to each harvest; just, without favour; and chaste, taking no bribe or gift, since Khattabi calls officials'' gifts unlawful. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7601}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7602}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7603} The Imam must supervise the collectors through men of trust, and pay them salaries that suffice, as Abu Ubayda told Umar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7604} Farming out the levy (qabala or tadmin): a person undertakes to collect it for himself at a fixed price; it appeared under the Umayyads and spread under the Abbasids. Ahmad, Abu Yusuf, Abu Ubayd and al-Mawardi rejected it for the injustice it brings, while Abu Yusuf allowed it where the Imam is secure from injustice and the payers consent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7604}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7605}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7606} Causes of remission: first, the land''s loss of fitness for cultivation through an event beyond human action, which by most jurists remits the levy; where it can be repaired the Imam repairs it from the public-interest share. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7606}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7607} Second, idleness: if it comes from outside the owner, the levy lapses; if by the owner''s neglect, the share-levy lapses and he is ordered to farm; the fixed levy is not remitted by the Hanafis, Shafiis and Hanbalis, but is by the Malikis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7607}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7608} Third, a crop lost to a heavenly blow before harvest remits the share-levy; for the fixed levy the Hanafis require two things: fewer than three months remain for another sowing, and the surviving crop is less than twice the levy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7608}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7609} Fourth, the Imam''s remission for a public interest: allowed by the Hanbalis and Abu Yusuf, forbidden by Muhammad al-Shaybani. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7610} Fifth, building on kharaj land: most Malikis, Shafiis and Hanbalis keep the levy; the Hanafis drop it; al-Mawardi drops it only for a necessary dwelling. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7610}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7611} Sixth, conversion of the owner or sale to a Muslim: the conquered-land
    levy never lapses; the treaty levy lapses by most jurists, citing a report of al-Ala'' ibn al-Hadrami, but not by the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7611}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7612} Joint ''ushr and kharaj on a Muslim: most Malikis, Shafiis and Hanbalis require both; the Hanafis require only kharaj, citing the report that no Muslim pays both and Umar''s order on a Nahr al-Malik convert. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7612}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7613} Uses of kharaj follow those of fay'': the soldiers'' pay, judges, scholars, mosques, roads, bridges and frontier defence; most Hanafis, Malikis and Hanbalis do not take a fifth of it, while the Shafiis do. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7613}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7614}'
  ur: 'خراج لغت میں کسی چیز کی پیداوار یا آمدنی کو کہتے ہیں، اور اجرت یا ٹیکس کے معنی میں بھی آتا ہے۔ ابو عبید اور لیث کے نزدیک خرج اور خراج ایک ہیں، جبکہ ابو عمرو بن العلاء کے نزدیک خرج وہ ہے جو تم بطور احسان دو، اور خراج وہ جو تم پر لازم ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7575}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7576} اصطلاح میں خراج کے دو معنی ہیں: عام، یعنی وہ اموال جن کی وصولی اور خرچ ریاست کرتی ہے، اور خاص، یعنی وہ ٹیکس جو امام زرخیز زمین پر لگائے؛ ماوردی اور ابو یعلیٰ کے نزدیک یہ زمین کی گردن پر لازم وہ حقوق ہیں جو اس کے عوض ادا کیے جائیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7576} اس کے دیگر نام جزیۃ الارض، اجرۃ الارض اور طسق ہیں، جو فارسی لفظ ہے اور عمر کے عثمان بن حنیف کو لکھے خط میں آیا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7576}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7577} یہ غنیمت، فیء، جزیہ، خمس اور عشر سے مختلف ہے؛ جزیہ سروں پر ہوتا ہے زمین پر نہیں، اور عشر مسلمان کی ملکیتی زمین کی زکوٰۃ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7577} عمر بن خطاب کے دور میں فتوحات بڑھیں تو انہوں نے طاقت سے فتح کی گئی زمین فاتحین میں تقسیم نہ کی بلکہ تمام مسلمانوں کے لیے وقف رکھی اور کاشت کاروں پر معین خراج لگایا؛ ابتدا میں صحابہ میں اختلاف ہوا، ابو یوسف کے مطابق بلال بن رباح سب سے زیادہ مخالف تھے، اور عمر نے سورۂ حشر کی فیء والی آیات سے استدلال کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7578}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7579} اس کی شرعی بنیاد قرآن، سنت اور مصلحت ہیں؛ سنت میں «منعت العراق درهمها وقفيزها» والی حدیث اور نبی کا خیبر کے نصف کو مسلمانوں کی مصلحت کے لیے رکھنا پیش کیا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7580}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7581} مصالح میں آنے والی نسلوں کے لیے مستقل آمدنی، دولت کا ایک گروہ میں سمٹنے سے بچاؤ، اور زمین کی آبادکاری شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7581}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7582} خراج ہر اس شخص پر واجب ہے جس کے پاس زرخیز خراجی زمین ہو، خواہ مسلمان ہو یا کافر، بالغ ہو یا نابالغ، عاقل ہو یا مجنون، مرد ہو یا عورت۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7580} اس کی اقسام میں خراج الوظیفہ ہے، یعنی زمین کے رقبے اور فصل کی نوعیت پر مقرر رقم، جو عمر نے سواد، مصر اور شام پر لگائی، اور خراج المقاسمہ ہے، یعنی پیداوار کا ایک حصہ، جو مہدی عباسی نے وظیفہ کی جگہ مقرر کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7582}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7583}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7584} زمین کی حیثیت کے لحاظ سے خراج صلحی (صلح کے ذریعے زمین والوں کے قبضے میں رہنے پر لیا جانے والا) اور خراج عنوی (طاقت سے فتح شدہ زمین پر، جو امام مسلمانوں کے لیے وقف کر دے) ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7584}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7585} خراجی زمین کی شرط یہ ہے کہ وہ خراجی ہو، اس لیے عشری زمین پر وظیفہ واجب نہیں؛ اور وہ حقیقی یا تقدیری طور پر نامی ہو، اس لیے گھروں اور کاشت کے قابل نہ زمین پر خراج نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7585}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7586} عشری زمین ذمی کو منتقل ہو تو جمہور بیع کو جائز کہتے ہیں، مالک اور احمد کی ایک روایت منع کرتے ہیں؛ پھر اس پر لازم ہونے والی چیز میں اختلاف ہے: شافعیہ اور حنابلہ کے راجح قول میں زمین خراجی نہیں بنتی، ابو حنیفہ اور زفر اسے خراجی بناتے ہیں، مالک اور ابو یوسف عشر دوگنا لیتے ہیں، اور محمد بن حسن اسے عشری رکھتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7586}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7587} ذمی کا امام کی اجازت سے مردہ زمین آباد کرنا مختلف فیہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7588} مقدار: حنفیہ کے نزدیک کاشت کے قابل جریب پر ایک قفیز اور ایک درہم، رطبہ پر پانچ درہم، انگور پر دس درہم، اور انتہائی حد پیداوار کا نصف ہے؛ مالک کے نزدیک کوئی مقررہ رقم نہیں بلکہ امام اہلِ خبرہ کی مدد سے اجتہاد کرے؛ شافعیہ عثمان بن حنیف کی مقدار لیتے ہیں، جن میں جَو پر دو درہم اور گندم پر چار درہم ہیں؛ حنابلہ کے نزدیک ایک درہم اور ایک قفیز، اور کھجور پر آٹھ درہم۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7588}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7589} عمر کی مقدار میں کمی بیشی پر: شافعیہ، احمد کی ایک روایت، محمد بن حسن اور ابو یوسف کی ایک روایت دونوں کو جائز کہتے ہیں؛ ابو حنیفہ صرف کمی کو، احمد کی ایک روایت صرف زیادتی کو جائز کہتی ہے، اور تیسری روایت دونوں کو منع کرتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7589}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7590} خراج طے کرتے وقت زمین کی زرخیزی، آبپاشی کی مشقت (بارش اور دریا کا پانی بُرین کے پانی سے سستا ہے)، فصل یا پھل کی نوعیت، شہر اور بازار سے قربت، اور آفات کے لیے گنجائش کو ملحوظ رکھا جائے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7590}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7591}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7592} وجوب کا وقت نوع کے لحاظ سے ہے: خراج مقاسمہ کاشت کے مکمل ہونے پر واجب ہوتا ہے اور پیداوار کے ساتھ دہرایا جاتا ہے؛ خراج وظیفہ سال میں ایک بار لیا جاتا ہے، زمین کے رقبے پر قمری سال کے آخر میں، اور فصل کے رقبے پر شمسی سال کے آخر میں؛ ابو حنیفہ کے نزدیک سال کے آغاز میں، اس شرط پر کہ زمین نامی رہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7592}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7593} حنفیہ اور حنابلہ نے ایک دو سال کی پیشگی وصولی جائز کہی؛ حنابلہ ہر صورت میں واپس کرتے ہیں، حنفیہ اس صورت میں جب لی ہوئی رقم باقی ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7593}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7594} تاخیر کی صورت میں صاحبِ حیثیت کو ادائیگی تک قید کیا جائے گا، اور تنگدست کو مہلت دی جائے گی اور قرض ذمے میں رہے گا؛ شافعیہ، حنابلہ اور صاحبین کے نزدیک یہ ساقط نہیں ہوتا، جبکہ ابو حنیفہ کے نزدیک جزیہ کی طرح ساقط ہو جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7594}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7595} واجب زمین کے قبضہ دار پر ہوتا ہے؛ اگر زمین اجارے یا عاریت پر دی ہو تو جمہور کے نزدیک مالک پر ہے، اور غاصب پر بھی واجب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7595} خراج عادل امام مقرر کرتا، طلب کرتا اور خرچ کرتا ہے، کوئی شخص خود تقسیم نہیں کر سکتا؛ جابر امام کو دینے سے جمہور کے نزدیک ذمہ بری ہو جاتا ہے۔ باغیوں کے قبضے والے شہر میں جو خراج وصول ہو وہ جمہور کے نزدیک ساقط ہے، مالکیہ دوبارہ ادا کرنے کو کہتے ہیں؛ ڈاکوؤں کو دینے سے ذمہ بری نہیں ہوتا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7596}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7597}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7598} عامل امام کا وکیل ہوتا ہے اور اجازت کے بغیر تقسیم نہیں کر سکتا؛ شرائط میں اسلام، آزادی، امانت، کفایت، علم و فقہ شامل ہیں، اور جمہور کے نزدیک ذمی کو خراج کی تقدیر پر مقرر نہیں کیا جاتا، جس کی دلیل «لا تتخذوا بطانة» اور عمر کا نصرانی کاتب سے انکار ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7599}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7600} عامل کے آداب یہ ہیں کہ وہ اہلِ خراج کے ساتھ نرمی کرے، پیداوار کے مطابق وصولی کرے، عدل کرے اور کسی کی رعایت نہ کرے، اور پاکدامن ہو کہ رشوت یا تحفہ نہ لے؛ خطابی کے نزدیک عمال کے تحفے حرام ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7601}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7602}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7603} امام پر لازم ہے کہ عمال کی نگرانی امین لوگوں سے کرائے اور انہیں کافی وظیفہ دے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7604} ٹھیکہ (قبالہ یا تضمین) میں کوئی شخص مقررہ رقم کے عوض خراج خود وصول کرنے کا ذمہ لیتا ہے؛ یہ اموی دور میں ظاہر ہوا اور عباسی دور میں پھیلا، احمد، ابو یوسف، ابو عبید اور ماوردی نے اسے ظلم کے سبب رد کیا، جبکہ ابو یوسف نے کہا کہ اگر امام ظلم سے محفوظ ہو اور اہلِ خراج راضی ہوں تو حرج نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7604}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7605}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7606} خراج کے ساقط ہونے کی صورتیں: پہلی، زمین کا کاشت کے قابل نہ رہنا کسی آفت سے، جس پر جمہور کے نزدیک خراج ساقط ہوتا ہے، اور قابل اصلاح ہو تو امام مصالح کے حصے سے اسے درست کرے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7606}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7607} دوسری، زمین کا معطل رہنا: اگر یہ مالک کی کوتاہی سے نہ ہو تو خراج نہیں، کوتاہی سے ہو تو مقاسمہ ساقط ہوتا ہے اور اسے کاشت کا حکم دیا جاتا ہے؛ خراج وظیفہ حنفیہ، شافعیہ اور حنابلہ کے نزدیک ساقط نہیں ہوتا، مالکیہ کے نزدیک ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7607}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7608} تیسری، قبل از کٹائی آسمانی آفت سے فصل تباہ ہو تو مقاسمہ ساقط ہوتا ہے؛ حنفیہ کے نزدیک وظیفہ کے ساقط ہونے کی دو شرطیں ہیں: سال میں تین مہینے بھی بوائی کے لیے باقی نہ ہوں، اور بچی ہوئی فصل خراج کے دگنے سے کم ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7608}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7609} چوتھی، امام کا مصلحت کے تحت کسی سے خراج معاف کرنا: حنابلہ اور ابو یوسف نے جائز کہا، محمد بن حسن نے منع کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7610} پانچویں، خراجی زمین پر تعمیر: جمہور مالکیہ، شافعیہ اور حنابلہ کے نزدیک خراج باقی رہتا ہے، حنفیہ کے نزدیک ساقط ہوتا ہے، اور ماوردی ضروری رہائش کے لیے ساقط کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7610}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7611} چھٹی، مالک کا اسلام لانا یا زمین کا کسی مسلمان کو منتقل ہونا: عنوی خراج باتفاق ساقط نہیں ہوتا، صلحی خراج جمہور کے نزدیک حدیثِ علاء بن حضرمی کی بنا پر ساقط ہو جاتا ہے، حنفیہ کے نزدیک نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7611}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7612} مسلمان پر عشر اور خراج کا اجتماع: جمہور مالکیہ، شافعیہ اور حنابلہ اسے واجب کہتے ہیں، حنفیہ منع کرتے ہیں اور «لا يجتمع على المسلم خراج وعشر» اور عمر کے دہقانہ کے بارے میں اثر سے استدلال کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7612}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7613} خراج کے مصارف فیء کے مصارف جیسے ہیں: فوجیوں، قاضیوں اور علماء کے وظائف، مساجد، سڑکوں، پلوں اور سرحدوں کی حفاظت؛ جمہور حنفیہ، مالکیہ اور حنابلہ اس کا خمس نہیں نکالتے، شافعیہ نکالتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7613}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7614}'
