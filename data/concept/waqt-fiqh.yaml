label:
  ar: "وَقْت"
  en: "Waqt (time, fiqh)"
summary:
  ar: "الوقت في اللغة مقدار من الزمان مفروض لأمر ما، أو نهاية الزمان المفروض للعمل، ومنه ميقات الحج؛ وفي الاصطلاح مقدار من الدهر، أو مقدار من الزمن المفروض لأمر ما أو للعمل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17573}\n\nالألفاظ ذات الصلة: الساعة، وهي الوقت من ليل أو نهار، وتُطلق على القيامة والموت، والدهر، وهو الزمان قلّ أو كثر؛ والوقت جزء من الدهر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17573}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17574}\n\nأولاً: أفضل الأوقات. أجمع الفقهاء على أن بعض الأوقات أفضل من بعض بما أودعه الله فيها من فضله، لا بصفات قائمة فيها، ويرجع تفضيلها إلى ما ينيل الله العباد فيها من فضله؛ واستدل ابن رجب بالأشهر الحرم وبالحج وشهر رمضان وليلة القدر والعشر من ذي الحجة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17574}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17575}\n\nثانياً: وقت الحيض، وأقله وأكثره، وأقل الطهر وأكثره، وتفصيله في باب الحيض والطهر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17575}\n\nثالثاً: وقت الأذان: اتفقوا على أنه وقت الصلاة المفروضة، ولا يجوز قبله إلا في الفجر، لما فيه من الإلباس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17575}\n\nرابعاً: وقت الصلاة: الصلوات الخمس مؤقتة بمواقيت معلومة باتفاق، وتفصيلها في أوقات الصلاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17575}\n\nخامساً: وقت وجوب الزكاة: اتفقوا على أن الأنعام والأثمان وعروض التجارة يُشترط فيها حولان الحول، لحديث «ليس في مال زكاة حتى يحول عليه الحول»، وأن زكاة الثمار والزروع تجب عند الحصاد، والمعادن والركاز عند الحصول عليها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17576}\n\nسادساً: وقت وجوب صوم رمضان: حلول الشهر، ويتحقق برؤية هلال رمضان ليلة الثلاثين من شعبان، أو بإكمال شعبان ثلاثين يوماً، لقوله تعالى في سورة البقرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17576}"
  en: "Waqt, lexically, is a fixed measure of time set for a matter, or the end of the time fixed for an act, as in the miqat of the pilgrimage; technically it is a measure of time, or of time fixed for a thing or an act. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17573}\n\nRelated words: sa'a, the hour, which can mean any moment, and is used for the Last Hour and for death; and dahr, which can mean any length of time. Waqt is a part of dahr. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17573}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17574}\n\nFirst, the best times: the jurists agree that some times are better than others by the favour God has placed in them, not by qualities within them; Ibn Rajab cites the sacred months, the pilgrimage, Ramadan, the Night of Power and the first ten days of Dhu al-Hijja. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17574}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17575}\n\nSecond, the time of menstruation, its least and greatest length, and the least and greatest length of purity, detailed under their headings. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17575}\n\nThird, the time of the call to prayer: the jurists agree it is the time of the prescribed prayer; it may not be called before the time, except for dawn, since that would confuse people. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17575}\n\nFourth, the times of prayer: the five prayers are fixed by agreement; detail under the prayer times. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17575}\n\nFifth, the time when zakat becomes due: the jurists agree that livestock, money and trade goods require a full year in the owner's hands, on the saying that there is no zakat on property until a year has passed over it; crops and fruit are due at harvest; minerals and buried treasure when obtained. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17576}\n\nSixth, the time when the fast of Ramadan becomes due: the month's arrival, shown by seeing the new moon on the evening of the thirtieth of Sha'ban, or by completing thirty days of Sha'ban, on the verse of sura al-Baqara. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17576}"
