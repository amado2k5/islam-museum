label:
  ar: "وَقْت"
  en: "Waqt (time, fiqh)"
  es: "Waqt (tiempo, fiqh)"
summary:
  ar: "الوقت في اللغة مقدار من الزمان مفروض لأمر ما، أو نهاية الزمان المفروض للعمل، ومنه ميقات الحج؛ وفي الاصطلاح مقدار من الدهر، أو مقدار من الزمن المفروض لأمر ما أو للعمل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17573}\n\nالألفاظ ذات الصلة: الساعة، وهي الوقت من ليل أو نهار، وتُطلق على القيامة والموت، والدهر، وهو الزمان قلّ أو كثر؛ والوقت جزء من الدهر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17573}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17574}\n\nأولاً: أفضل الأوقات. أجمع الفقهاء على أن بعض الأوقات أفضل من بعض بما أودعه الله فيها من فضله، لا بصفات قائمة فيها، ويرجع تفضيلها إلى ما ينيل الله العباد فيها من فضله؛ واستدل ابن رجب بالأشهر الحرم وبالحج وشهر رمضان وليلة القدر والعشر من ذي الحجة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17574}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17575}\n\nثانياً: وقت الحيض، وأقله وأكثره، وأقل الطهر وأكثره، وتفصيله في باب الحيض والطهر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17575}\n\nثالثاً: وقت الأذان: اتفقوا على أنه وقت الصلاة المفروضة، ولا يجوز قبله إلا في الفجر، لما فيه من الإلباس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17575}\n\nرابعاً: وقت الصلاة: الصلوات الخمس مؤقتة بمواقيت معلومة باتفاق، وتفصيلها في أوقات الصلاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17575}\n\nخامساً: وقت وجوب الزكاة: اتفقوا على أن الأنعام والأثمان وعروض التجارة يُشترط فيها حولان الحول، لحديث «ليس في مال زكاة حتى يحول عليه الحول»، وأن زكاة الثمار والزروع تجب عند الحصاد، والمعادن والركاز عند الحصول عليها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17576}\n\nسادساً: وقت وجوب صوم رمضان: حلول الشهر، ويتحقق برؤية هلال رمضان ليلة الثلاثين من شعبان، أو بإكمال شعبان ثلاثين يوماً، لقوله تعالى في سورة البقرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17576}\n\nالحج: وقت إحرام الحج عند جمهور الفقهاء شوال وذو القعدة وعشر من ذي الحجة، لقوله تعالى في سورة البقرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17577} والعمرة وقتها جميع السنة، واختلفوا في الأوقات التي تكره فيها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17577}\n\nأقسام العبادات باعتبار وقت الأداء: مطلقة وموقتة، وتفصيله في باب الأداء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17577} وأداء العبادة عند ضيق الوقت، والقضاء بعد فوات الوقت، وتوقيت خصال الفطرة، ووقت العقيقة: كلها تحال إلى أبوابها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17577}\n\nقاعدة إضافة الحادث إلى أقرب أوقاته: إذا وقع حادث واختلف في زمن وقوعه نُسب إلى أقرب الأوقات إلى الحال ما لم يثبت نسبته إلى زمن بعيد. ومن تطبيقاتها: أن الزوجة إذا ادعت طلاق الفار في مرض الموت وطلبت الإرث وقال الورثة إنه طلاق في الصحة، فالقول لها لأن الطلاق يُضاف إلى الوقت الأقرب؛ وأن البيع الذي يدعيه المحجور عليه بعد الحجر يُقدّم قوله لأن وقوع البيع بعد الحجر أقرب زمناً؛ وأن البائع إذا أبرأ المشتري من العيوب الموجودة عند العقد فالقول للمشتري في العيب الحادث بعد العقد، لأن عدم العيب أصل؛ وأن الأب إذا باع مال ولده فادعى الابن أن البيع بعد البلوغ فالقول للابن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17577}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17578}"
  en: "Waqt, lexically, is a fixed measure of time set for a matter, or the end of the time fixed for an act, as in the miqat of the pilgrimage; technically it is a measure of time, or of time fixed for a thing or an act. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17573}\n\nRelated words: sa'a, the hour, which can mean any moment, and is used for the Last Hour and for death; and dahr, which can mean any length of time. Waqt is a part of dahr. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17573}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17574}\n\nFirst, the best times: the jurists agree that some times are better than others by the favour God has placed in them, not by qualities within them; Ibn Rajab cites the sacred months, the pilgrimage, Ramadan, the Night of Power and the first ten days of Dhu al-Hijja. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17574}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17575}\n\nSecond, the time of menstruation, its least and greatest length, and the least and greatest length of purity, detailed under their headings. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17575}\n\nThird, the time of the call to prayer: the jurists agree it is the time of the prescribed prayer; it may not be called before the time, except for dawn, since that would confuse people. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17575}\n\nFourth, the times of prayer: the five prayers are fixed by agreement; detail under the prayer times. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17575}\n\nFifth, the time when zakat becomes due: the jurists agree that livestock, money and trade goods require a full year in the owner's hands, on the saying that there is no zakat on property until a year has passed over it; crops and fruit are due at harvest; minerals and buried treasure when obtained. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17576}\n\nSixth, the time when the fast of Ramadan becomes due: the month's arrival, shown by seeing the new moon on the evening of the thirtieth of Sha'ban, or by completing thirty days of Sha'ban, on the verse of sura al-Baqara. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17576}\n\nHajj: the time for entering the pilgrimage state is, for the majority of jurists, the months of Shawwal, Dhu al-Qa'da and the first ten days of Dhu al-Hijja, on the verse of sura al-Baqara. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17577} The umra may be performed at any time of the year, and the jurists differ on the times when it is disliked. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17577}\n\nWorship divided by its time of performance: unrestricted and time-bound, detailed under performance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17577} Performing an act when the time is short, making up what is missed, the timing of the natural practices of purity, and the time of the aqiqa are all treated under their own headings. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17577}\n\nThe maxim of attributing an event to the nearest time: when an event occurs and its time is disputed, it is attributed to the time nearest the present, unless it is proved to belong to a distant time. Examples the book gives: a wife claims that her husband divorced her during a terminal illness and seeks inheritance, while the heirs say it was during his health; the word of the wife prevails, since the divorce is referred to the nearer time, unless the heirs prove that the husband died in health. A restricted person, or his guardian, who claims a sale was made after the judgement of restriction is believed, since the later date is nearer; a buyer must prove the earlier date. A buyer who was released from defects present at the contract is believed on a defect arising later, because the absence of defect is the default. A father who sold his son's property is believed to have sold it before the son's majority when the son claims a sale after majority, since majority is the nearer time and the father must prove the default was broken. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17577}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17578}"
  es: "Waqt, léxicamente, es una medida fija de tiempo establecida para un asunto, o el final del tiempo fijado para un acto, como en el miqat de la peregrinación; técnicamente es una medida de tiempo, o de tiempo fijado para una cosa o un acto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17573} Palabras relacionadas: sa'a, la hora, que puede significar cualquier momento, y se usa para la Última Hora y para la muerte; y dahr, que puede significar cualquier duración de tiempo. Waqt es parte de dahr. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17573}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17574} Primero, los mejores momentos: los juristas están de acuerdo en que algunos momentos son mejores que otros por el favor que Dios ha puesto en ellos, no por cualidades dentro de ellos; Ibn Rajab cita los meses sagrados, la peregrinación, Ramadán, la Noche del Poder y los primeros diez días de Dhu al-Hijja. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17574}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17575} Segundo, el tiempo de la menstruación, su duración mínima y máxima, y la duración mínima y máxima de pureza, detallada bajo sus encabezados. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17575} Tercero, el tiempo de la llamada a la oración: los juristas están de acuerdo en que es el tiempo de la oración prescrita; no se puede llamar antes de la hora, excepto al amanecer, ya que eso confundiría a la gente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17575} Cuarto, los tiempos de oración: las cinco oraciones están fijadas por acuerdo; detalles bajo los tiempos de oración. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17575} Quinto, el momento en que el zakat se vuelve exigible: los juristas están de acuerdo en que el ganado, el dinero y los bienes comerciales requieren un año completo en manos del propietario, bajo el dicho de que no hay zakat sobre la propiedad hasta que haya transcurrido un año sobre ella; las cosechas y los frutos se deben en el momento de la cosecha; los minerales y los tesoros enterrados cuando se obtienen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17576} Sexto, el momento en que se debe el ayuno de Ramadán: la llegada del mes, mostrada al ver la luna nueva en la noche del treinta de Sha'ban, o al completar treinta días de Sha'ban, en el versículo de la sura al-Baqara. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17576} Hajj: el momento para entrar en estado de peregrinación es, para la mayoría de los juristas, los meses de Shawwal, Dhu al-Qa'da y los primeros diez días de Dhu al-Hijja, en el versículo de la sura al-Baqara. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17577} La umra puede realizarse en cualquier época del año, y los juristas difieren en los momentos en que es desaconsejable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17577} El culto dividido por su tiempo de realización: sin restricciones y con límite de tiempo, detallado en la realización. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17577} Realizar un acto cuando el tiempo es corto, recuperar lo perdido, el momento de las prácticas naturales de pureza y el momento de la aqiqa se tratan bajo sus propios epígrafes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17577} La máxima de atribuir un evento al tiempo más cercano: cuando ocurre un evento y se disputa su tiempo, se le atribuye al tiempo más cercano al presente, a menos que se demuestre que pertenece a un tiempo lejano. Ejemplos que da el libro: una esposa afirma que su esposo la divorció durante una enfermedad terminal y busca la herencia, mientras que los herederos dicen que fue durante su salud; la palabra de la esposa prevalece, ya que el divorcio se refiere al tiempo más cercano, a menos que los herederos demuestren que el esposo murió con salud. A una persona restringida, o a su tutor, que afirma que una venta se realizó después de la sentencia de restricción se le cree, ya que la fecha posterior es más cercana; un comprador debe probar la fecha anterior. A un comprador que fue liberado de los defectos presentes en el contrato se le cree sobre un defecto que surge posteriormente, porque la ausencia de defecto es la falta. Se considera que un padre que vendió la propiedad de su hijo la vendió antes de que este alcanzara la mayoría de edad, cuando el hijo reclama una venta posterior a dicha mayoría, ya que la mayoría de edad es el momento más cercano y el padre debe probar que se incumplió el incumplimiento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17577}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17578}"
