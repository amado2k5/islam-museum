id: concept/arkan-al-iman
class: concept
kind: doctrine
label:
  ar: "أركان الإيمان الستة"
  en: "The six pillars of faith"
  fr: "Les six piliers de la foi"
  ur: "ایمان کے چھ ارکان"
  es: "Los seis pilares de la fe"
  tr: "İnancın Altı Sütunu"
  id: "Enam Pilar Iman"
summary:
  ar: "أركان الإيمان هي الأصول التي أجاب بها النبي حين سأله جبريل عن الإيمان: أن يؤمن العبد بالله وملائكته وكتبه ورسله واليوم الآخر وبالقدر خيره وشره {cite:sharh-tahawiyya-ibn-abi-al-izz p.235}. يقول ابن أبي العز في شرح الطحاوية إن الإيمان بالملائكة والنبيين والكتب المنزلة «من أركان الإيمان»، ويستدل بآيتي [[passage/quran-2-285|البقرة 285]] و[[passage/quran-2-177|البقرة 177]] وبآية [[passage/quran-4-136|النساء 136]]، ويصفها بأنها الأصول التي اتفقت عليها الأنبياء والرسل {cite:sharh-tahawiyya-ibn-abi-al-izz p.235}. وينقل عن أبي طالب المكي أن الأركان سبعة، بزيادة الإيمان بالقدر والإيمان بالجنة والنار على الخمسة، ويقول: «وهذا حق» {cite:sharh-tahawiyya-ibn-abi-al-izz p.237}. ولفظ البخاري من حديث أبي هريرة: الإيمان بالله وملائكته ولقائه ورسله والإيمان بالبعث {cite:sahih-al-bukhari 50}."
  en: "The pillars of faith are the foundations the Prophet gave when Jibril asked him about faith: belief in God, His angels, His books, His messengers, the Last Day and the decree, its good and its ill {cite:sharh-tahawiyya-ibn-abi-al-izz p.235}. Ibn Abi al-'Izz, in his commentary on the Tahawi creed, says belief in the angels, the prophets and the revealed books is 'among the pillars of faith', cites [[passage/quran-2-285|al-Baqara 285]], [[passage/quran-2-177|al-Baqara 177]] and [[passage/quran-4-136|al-Nisa' 136]], and calls them the foundations on which the prophets and messengers agreed {cite:sharh-tahawiyya-ibn-abi-al-izz p.235}. He reports from Abu Talib al-Makki that the pillars are seven, adding belief in the decree and belief in Paradise and the Fire to the five, and says: 'this is true' {cite:sharh-tahawiyya-ibn-abi-al-izz p.237}. Al-Bukhari's wording from Abu Hurayra is: belief in God, His angels, the meeting with Him, His messengers, and belief in the resurrection {cite:sahih-al-bukhari 50}."
  fr: "Les piliers de la foi sont les fondements que le Prophète donna lorsque Jibril l’interrogea sur la foi : la foi en Dieu, en Ses anges, en Ses livres, en Ses messagers, au Jour dernier et au décret, dans son bien et dans son mal {cite:sharh-tahawiyya-ibn-abi-al-izz p.235}. Ibn Abi al-'Izz, dans son commentaire de la profession de foi d’al-Tahawi, dit que la foi aux anges, aux prophètes et aux livres révélés est « parmi les piliers de la foi », cite [[passage/quran-2-285|al-Baqara 285]], [[passage/quran-2-177|al-Baqara 177]] et [[passage/quran-4-136|al-Nisa' 136]], et les appelle les fondements sur lesquels les prophètes et les messagers se sont accordés {cite:sharh-tahawiyya-ibn-abi-al-izz p.235}. Il rapporte d’Abu Talib al-Makki que les piliers sont sept, ajoutant aux cinq la foi au décret et la foi au Paradis et au Feu, et dit : « cela est vrai » {cite:sharh-tahawiyya-ibn-abi-al-izz p.237}. La formulation d’al-Bukhari d’après Abu Hurayra est : la foi en Dieu, en Ses anges, en la rencontre avec Lui, en Ses messagers et la foi en la résurrection {cite:sahih-al-bukhari 50}."
  ur: "ارکانِ ایمان وہ اصول ہیں جو نبی نے اس وقت بتائے جب جبرائیل نے ایمان کے بارے میں پوچھا: اللہ، اس کے فرشتوں، اس کی کتابوں، اس کے رسولوں، یومِ آخرت اور اچھی بری تقدیر پر ایمان {cite:sharh-tahawiyya-ibn-abi-al-izz p.235}۔ ابن ابی العز شرحِ طحاویہ میں کہتے ہیں کہ فرشتوں، نبیوں اور نازل شدہ کتابوں پر ایمان «ارکانِ ایمان میں سے» ہے، اور [[passage/quran-2-285|البقرہ 285]]، [[passage/quran-2-177|البقرہ 177]] اور [[passage/quran-4-136|النساء 136]] سے استدلال کرتے ہیں، اور انھیں وہ اصول کہتے ہیں جن پر انبیا اور رسول متفق رہے {cite:sharh-tahawiyya-ibn-abi-al-izz p.235}۔ وہ ابو طالب مکی سے نقل کرتے ہیں کہ ارکان سات ہیں، یعنی پانچ پر تقدیر پر ایمان اور جنت و دوزخ پر ایمان کا اضافہ، اور کہتے ہیں: «یہ حق ہے» {cite:sharh-tahawiyya-ibn-abi-al-izz p.237}۔ بخاری میں ابو ہریرہ کی روایت کے الفاظ یہ ہیں: اللہ، اس کے فرشتوں، اس کی ملاقات، اس کے رسولوں پر ایمان اور دوبارہ اٹھائے جانے پر ایمان {cite:sahih-al-bukhari 50}۔"
  es: "Los pilares de la fe son los fundamentos que el Profeta dio cuando Jibril le preguntó acerca de la fe: la creencia en Dios, Sus ángeles, Sus libros, Sus mensajeros, el Último Día y el decreto, su bien y su mal {cite:sharh-tahawiyya-ibn-abi-al-izz p.235}. Ibn Abi al-'Izz, en su comentario sobre el credo Tahawi, dice que la creencia en los ángeles, los profetas y los libros revelados está \"entre los pilares de la fe\", cita [[passage/quran-2-285|al-Baqara 285]], [[passage/quran-2-177|al-Baqara 177]] y [[passage/quran-4-136|al-Nisa' 136]], y los llama los fundamentos sobre los que los profetas y mensajeros concordaron {cite:sharh-tahawiyya-ibn-abi-al-izz p.235}. Relata de Abu Talib al-Makki que los pilares son siete, añadiendo la creencia en el decreto y la creencia en el Paraíso y el Fuego a los cinco, y dice: \"esto es cierto\" {cite:sharh-tahawiyya-ibn-abi-al-izz p.237}. La formulación de Al-Bujari, según Abu Hurayra, es: creencia en Dios, Sus ángeles, el encuentro con Él, Sus mensajeros y la creencia en la resurrección {cita:sahih-al-bujari 50}."
  tr: "İman sütunları, Cebrayıl iman hakkında Peygamber'in ona sorduğunda yanıtladığı ilkelerdir: hizmetkârın Tanrı'ya, Meleklerine, kitaplarına, elçilerine, Ahahiyete ve kader, hem iyi hem kötü olanlara inandığıdır. {cite:) Şerh-Tahawiyya-ibn-abi-al-izz s.235}. İbn Ebi el-Tahaviye üzerine yazdığı tefsirinde, meleklere, peygamberlere ve vahiye edilmiş kitaplara olan inancın \"inancın temel direklerinden biri\" olduğunu belirtir ve [[pasaj/kuran-2-2-285|El-Bakarah 285]] ve [[pasaj/kuran-2-177|El-Bakara 177]] ayetleri ile [[pasaj/kuran-4-136|An-Nisa 136]] ayetlerini aktararak, bunları peygamberler ve elçilerin üzerinde uzlaştığı ilkeler olarak tanımlar {cite:sharh-tahawiyya-ibn-abi-al-izz s.235} olarak tanımlar. Ebu Talib el-Makki'den rivayet edilir ki, sütunlar yedi direktir; kaderin önüyle inanç ve cennet ile cehenneme inanç beş ayetten fazladır ve şöyle der: \"Ve bu gerçektir\" {atıf:şerh-tahawiyya-ibn-abi-al-izz s.237}. Ebu Hureyre'nin hadisinden al-Buhari'nin ifadesi şudur: Allah'a, meleklerine, elçileriyle buluşma ve dirilişe inanç {atı:sahih-al-bukhari 50}."
  id: "Pilar-pilar iman adalah prinsip-prinsip yang dijawab Nabi ketika Gabriel bertanya tentang iman: bahwa hamba percaya kepada Tuhan, malaikat-Nya, kitab-Nya, utusan-Nya, Hari Terakhir, dan takdir, baik maupun yang buruk. {cite:sharh-tahawiyya-ibn-abi-al-izz hlm.235}. Ibn Abi al-Izz mengatakan dalam komentarnya tentang Al-Tahawiyya bahwa iman kepada malaikat, nabi, dan kitab wahyu adalah \"salah satu pilar iman,\" dan ia mengutip ayat-ayat [[ayat/al-quran-2-285|Al-Baqarah 285]] dan [[ayat/al-quran-2-177|Al-Baqarah 177]] dan ayat [[ayat/al-quran-4-136|An-Nisa 136]], menggambarkan mereka sebagai prinsip-prinsip yang disepakati oleh para nabi dan rasul {cite:sharh-tahawiyya-ibn-abi-al-izz hlm.235}. Dinawayatkan dari Abu Talib al-Makki bahwa tiang-tiang itu berjumlah tujuh, dengan peningkatan iman pada takdir dan kepercayaan pada Surga dan Neraka di atas kelima pilar, dan ia berkata: \"Dan inilah kebenaran\" {cite:sharh-tahawiyya-ibn-abi-al-izz hlm.237}. Kata-kata al-Bukhari dari hadits Abu Huraira adalah: iman kepada Allah, malaikat-Nya, bertemu dengan utusan-Nya, dan iman pada kebangkitan {cite:sahih-al-bukhari 50}."
