    en: "Talbis is mixing truth with falsehood, including concealing the tidings of the Prophet"
  summary:
    ar: "يرى الشعراوي أن أكبر تلبيس هو إنكار البشارة بالنبي مع إعلان الإيمان بموسى وعيسى، وأن ذلك كان يعرفه بعضهم في أنفسهم {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1538}."
    en: "Sha'rawi holds that the greatest talbis was denying the tidings of the Prophet while professing faith in Moses and Jesus, and that some of them knew this in their hearts {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1538}."
