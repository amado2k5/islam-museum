id: concept/talbis-al-haqq
class: concept
kind: doctrine
label:
  ar: التلبيس بين الحق والباطل
  en: Mixing truth with falsehood (talbis al-haqq)
summary:
  ar: "يرى الشعراوي أن التلبيس هو إدخال شيء في شيء حتى يتغير المنظر، كالذي يلبس ثوبه، وأن الآية تتحدث عن محاولة بعض أهل الكتاب إلباس الحق بالباطل، ومن ذلك في تقديره تحريف الكتب وإنكار البشارة بالنبي مع وجودها فيها. ويرى أن هذا التلبيس لا يخفى على أهل العلم منهم {cite:tafsir-sharawi-khawatir-scan p.1537}{cite:tafsir-sharawi-khawatir-scan p.1538}."
  en: "Sha'rawi holds that talbis means putting one thing into another so that the appearance changes, as a garment is worn over the body. He reads the verse as referring to an attempt by some People of the Book to mix truth with falsehood. In his view this included altering the scriptures and denying the good tidings of the Prophet that they contained. He says this concealment was not hidden from their own learned men {cite:tafsir-sharawi-khawatir-scan p.1537}{cite:tafsir-sharawi-khawatir-scan p.1538}."
