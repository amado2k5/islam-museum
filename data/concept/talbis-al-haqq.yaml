issue:
  ar: "هل يعد تحريف الكتب وكتمان البشارات من التلبيس الذي تتحدث عنه الآية؟ وكيف يتعامل المسلم مع قراءة الآية في سياق أهل الكتاب؟"
  en: "Does the verse refer to altering scripture and concealing its tidings? How should its context among the People of the Book be read?"
perspectives:
- tradition: sunni
  id: sunni-sharawi-concealment
  stance:
    ar: "التلبيس هو خلط الحق بالباطل، ومنه كتمان البشارة بالنبي"
    en: "Talbis is mixing truth with falsehood, including concealing the tidings of the Prophet"
  summary:
    ar: "يرى الشعراوي أن أكبر تلبيس هو إنكار البشارة بالنبي مع إعلان الإيمان بموسى وعيسى، وأن ذلك كان يعرفه بعضهم في أنفسهم {cite:tafsir-sharawi-khawatir-scan p.1538}."
    en: "Sha'rawi holds that the greatest talbis was denying the tidings of the Prophet while professing faith in Moses and Jesus, and that some of them knew this in their hearts {cite:tafsir-sharawi-khawatir-scan p.1538}."
