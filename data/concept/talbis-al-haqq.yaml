id: concept/talbis-al-haqq
class: concept
kind: doctrine
label:
  ar: التلبيس بين الحق والباطل
  en: Mixing truth with falsehood (talbis al-haqq)
  es: "Mezclar la verdad con la falsedad (talbis al-haqq)"
  fr: "Mélanger la vérité et le mensonge (talbis al-haqq)"
  ur: "حق کو باطل کے ساتھ ملانا ⁦(تلبیس الحق)⁩"
  tr: "Doğru ile Yanlış Arasındaki Karışıklık"
  id: "Kebingungan antara benar dan salah"
summary:
  ar: "يرى الشعراوي أن التلبيس هو إدخال شيء في شيء حتى يتغير المنظر، كالذي يلبس ثوبه، وأن الآية تتحدث عن محاولة بعض أهل الكتاب إلباس الحق بالباطل، ومن ذلك في تقديره تحريف الكتب وإنكار البشارة بالنبي مع وجودها فيها. ويرى أن هذا التلبيس لا يخفى على أهل العلم منهم {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1537}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1538}."
  en: "Sha'rawi holds that talbis means putting one thing into another so that the appearance changes, as a garment is worn over the body. He reads the verse as referring to an attempt by some People of the Book to mix truth with falsehood. In his view this included altering the scriptures and denying the good tidings of the Prophet that they contained. He says this concealment was not hidden from their own learned men {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1537}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1538}."
  es: "Sha'rawi sostiene que talbis significa introducir una cosa dentro de otra de manera que su apariencia cambie, como cuando se usa una prenda sobre el cuerpo. Interpreta el versículo como una referencia al intento de algunos Gente del Libro de mezclar la verdad con la falsedad. En su opinión, esto incluía alterar las escrituras y negar las buenas nuevas del Profeta que contenían. Afirma que este ocultamiento no pasó desapercibido para sus propios sabios {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1537}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1538}."
  fr: "Sha'rawi soutient que « talbis » signifie insérer une chose dans une autre de manière à en modifier l'apparence, à l'image d'un vêtement que l'on enfile sur le corps. Il interprète ce verset comme faisant référence à une tentative de certains Gens du Livre de mêler vérité et mensonge. Selon lui, cela impliquait d'altérer les Écritures et de nier la bonne nouvelle du Prophète qu'elles contenaient. Il affirme que cette dissimulation n'était pas cachée à leurs propres savants {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1537}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1538}."
  ur: "شعراوی کا خیال ہے کہ تلبیس کا مطلب ہے ایک چیز کو دوسری چیز میں ڈالنا تاکہ ظاہری شکل بدل جائے جیسا کہ جسم پر لباس پہنا جاتا ہے۔ وہ اس آیت کو کچھ اہل کتاب کی طرف سے حق کو باطل کے ساتھ ملانے کی کوشش کا حوالہ دیتے ہوئے پڑھتا ہے۔ ان کے خیال میں اس میں صحیفوں میں ردوبدل کرنا اور نبی کی بشارت کو جھٹلانا شامل تھا۔ ان کا کہنا ہے کہ یہ بات ان کے اپنے اہل علم سے پوشیدہ نہیں تھی۔"
  tr: "Al-Shaarawi, aldatmanın bir şeye bir şey katmak olduğunu, görünüş değişene kadar, örneğin birinin giysisini giymesi gibi olduğunu ve ayetin Kitap Ahmi'nin bazı kişilerin gerçeği yalanla karıştırma çabasından, kitapların çarpıtılması ve Peygamber'in müjdesini inkar etme çabasından bahsettiğine inanır. Bu aldatmacanın aralarındaki alimlerden saklanmadığına inanır {cite:tafsir-sharawi-khawatir-scan-vol-2 s.1537}{cite:tafsir-sharawi-khawatir-scan-vol-2 s.1538}."
  id: "Al-Shaarawi percaya bahwa penipuan adalah memasukkan sesuatu ke dalam sesuatu sampai penampilannya berubah, seperti seseorang yang mengenakan jubahnya, dan bahwa ayat tersebut menyebutkan upaya beberapa Tokoh Kitab untuk mencampuradukkan kebenaran dengan kebohongan, termasuk penilaiannya yang memutarbalikkan kitab-kitab dan menyangkal kabar gembira Nabi meskipun ada di dalamnya. Ia percaya bahwa penipuan ini tidak disembunyikan dari para ulama di antara mereka {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1537}{cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1538}."
