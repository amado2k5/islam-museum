id: concept/siyasa-governance
class: concept
kind: legal
label:
  ar: "السياسة الشرعية في الحكم"
  en: "Siyasa (governance under the law, in the Mawsu'a)"
  es: "Siyasa (gobernanza bajo la ley, en Mawsu'a)"
  fr: "Siyasa (gouvernance selon la loi, dans le Mawsu'a)"
  ur: "سیاست ⁦(قانون کے تحت حکومت، موصوف میں)⁩"
summary:
  ar: "السياسة في اللغة القيام على الشيء بما يصلحه، وفي الاصطلاح معنيان: معنى عام يتصل بالدولة والسلطة وهو استصلاح الخلق وتدبير أمورهم، ومعنى يتصل بالعقوبة وهو فعل شيء من الحاكم لمصلحة يراها دون دليل جزئي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9867} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9868} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9869} وذهب الحنفية والمالكية والحنابلة إلى أن للسلطان سلوك السياسة في تدبير أمور الناس وفق ضوابط الشرع، وتقسم السياسة إلى ظالمة محرمة وعادلة معتبرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9870} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9871} وتقوم على سيادة الشريعة والشورى والعدل، وتشمل الإمامة وواجباتها، وتعيين العمال، والمال، والولايات كالجيش والقضاء والصدقات، والعقوبة سياسة كالتعزير والتغريب والقتل في جرائم معينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9872} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9874} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9880} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9882}"
  en: "In language siyasa is the upkeep of a thing in the way that sets it right. The technical sense has two meanings: a general one, the government of the state and of power, meaning the guidance of people to what saves them and the management of their affairs; and a penal one, where the ruler acts for a benefit he sees without a specific text. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9867} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9868} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9869} The Hanafis, Malikis and Hanbalis hold that the ruler may pursue siyasa in managing people's affairs within the criteria of the law; siyasa is divided into unjust, which the law forbids, and just, which it allows. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9870} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9871} It rests on the sovereignty of the law, consultation and justice; it covers the imamate and its duties, the appointment and oversight of agents, the treasury, the army, the judiciary and zakat administration; and penal siyasa such as discretionary punishment, exile and killing in certain crimes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9872} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9874} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9880} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9882}"
  es: "En el lenguaje, siyasa es el mantenimiento de algo de manera que lo haga correcto. El sentido técnico tiene dos significados: uno general, el gobierno del estado y del poder, es decir, la guía de las personas hacia lo que las salva y la administración de sus asuntos; y uno penal, donde el gobernante actúa por un beneficio que ve sin un texto específico. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9867} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9868} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9869} Los hanafíes, malikíes y hanbalíes sostienen que el gobernante puede ejercer siyasa al administrar los asuntos de las personas dentro de los criterios de la ley; siyasa se divide en injusto, que la ley prohíbe, y justo, que permite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9870} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9871} Se basa en la soberanía de la ley, la consulta y la justicia; abarca el imamato y sus deberes, el nombramiento y la supervisión de los agentes, el tesoro, el ejército, el poder judicial y la administración del zakat; y la siyasa penal, como el castigo discrecional, el exilio y la muerte en ciertos delitos. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9872} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9874} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9880} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9882}"
  fr: "En langage, la siyasa désigne l'entretien d'une chose de manière à la maintenir en bonne santé. Au sens technique, elle revêt deux significations: une signification générale, celle du gouvernement de l'État et du pouvoir, c'est-à-dire la direction du peuple vers ce qui le préserve et la gestion de ses affaires; et une signification pénale, lorsque le souverain agit dans l'intérêt qu'il perçoit, sans texte spécifique. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9867} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9868} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9869} Les écoles hanafite, malikite et hanbalite estiment que le souverain peut exercer la siyasa dans la gestion des affaires du peuple, dans le respect des critères de la loi; la siyasa se divise en deux catégories: l'injuste, interdite par la loi, et la juste, autorisée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9870} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9871} Elle repose sur la souveraineté de la loi, la consultation et la justice; elle couvre l'imamat et ses devoirs, la nomination et la supervision des agents, le trésor, l'armée, le pouvoir judiciaire et l'administration de la zakat; et les peines siyasa telles que la punition discrétionnaire, l'exil et la mise à mort dans certains crimes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9872} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9874} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9880} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9882}"
  ur: "زبان میں سیاسہ کسی چیز کو درست طریقے سے برقرار رکھنے کو کہتے ہیں۔ تکنیکی معنوں کے دو معنی ہیں: ایک عمومی، ریاست اور اقتدار کی حکومت، یعنی لوگوں کی رہنمائی اس چیز کی طرف جو انہیں بچاتی ہے اور ان کے معاملات کا انتظام۔ اور ایک جرمانہ، جہاں حکمران کسی فائدے کے لیے کام کرتا ہے جسے وہ بغیر کسی مخصوص متن کے دیکھتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص9867} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص9868} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص9869} حنفیہ اور مالکیہ کا حکم ہے کہ حنفیہ اور مالکیہ اس پر قائل ہیں۔ قانون کے معیار کے اندر لوگوں کے معاملات کو منظم کرنا؛ siyasa کو غیر منصفانہ میں تقسیم کیا گیا ہے، جس سے قانون منع کرتا ہے، اور منصفانہ، جس کی وہ اجازت دیتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.9870} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.9871} یہ قانون کی حاکمیت، مشاورت اور انصاف پر منحصر ہے۔ یہ امامت اور اس کے فرائض، ایجنٹوں کی تقرری اور نگرانی، خزانہ، فوج، عدلیہ اور زکوٰۃ انتظامیہ کا احاطہ کرتا ہے۔ اور تعزیری سزا جیسے صوابدیدی سزا، جلاوطنی اور بعض جرائم میں قتل۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ9872} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ9874} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ9880} صفحہ 9882}"
