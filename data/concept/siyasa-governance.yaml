id: concept/siyasa-governance
class: concept
kind: legal
label:
  ar: "السياسة الشرعية في الحكم"
  en: "Siyasa (governance under the law, in the Mawsu'a)"
summary:
  ar: "السياسة في اللغة القيام على الشيء بما يصلحه، وفي الاصطلاح معنيان: معنى عام يتصل بالدولة والسلطة وهو استصلاح الخلق وتدبير أمورهم، ومعنى يتصل بالعقوبة وهو فعل شيء من الحاكم لمصلحة يراها دون دليل جزئي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9867} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9868} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9869} وذهب الحنفية والمالكية والحنابلة إلى أن للسلطان سلوك السياسة في تدبير أمور الناس وفق ضوابط الشرع، وتقسم السياسة إلى ظالمة محرمة وعادلة معتبرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9870} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9871} وتقوم على سيادة الشريعة والشورى والعدل، وتشمل الإمامة وواجباتها، وتعيين العمال، والمال، والولايات كالجيش والقضاء والصدقات، والعقوبة سياسة كالتعزير والتغريب والقتل في جرائم معينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9872} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9874} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9880} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9882}"
  en: "In language siyasa is the upkeep of a thing in the way that sets it right. The technical sense has two meanings: a general one, the government of the state and of power, meaning the guidance of people to what saves them and the management of their affairs; and a penal one, where the ruler acts for a benefit he sees without a specific text. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9867} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9868} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9869} The Hanafis, Malikis and Hanbalis hold that the ruler may pursue siyasa in managing people's affairs within the criteria of the law; siyasa is divided into unjust, which the law forbids, and just, which it allows. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9870} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9871} It rests on the sovereignty of the law, consultation and justice; it covers the imamate and its duties, the appointment and oversight of agents, the treasury, the army, the judiciary and zakat administration; and penal siyasa such as discretionary punishment, exile and killing in certain crimes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9872} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9874} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9880} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9882}"
