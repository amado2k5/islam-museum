label: { ar: "النهار الذي يدوم شهوراً والفلك الرحاوي في الزيج الصابي", en: "Days lasting months and the millstone sphere", ur: "مہینوں لمبے دن اور رحوی فلک", es: "Días que duran meses y la esfera de la piedra de molino", fr: "Des jours qui durent des mois et la sphère de la meule", tr: "Aylar süren gün ve Sabi astronomik çizelgesindeki değirmen taşı.", id: "Hari yang berlangsung selama berbulan-bulan dan batu penggiling dalam bagan astronomi Sabi" }
summary:
  ar: "فيما وراء الخط الذي بعده ست وستون درجة يُعلم طول النهار من جدول الميل، فيطول النهار فيه شهراً وشهرين وثلاثة وأكثر وأقل، ويقابله مثله من الليل، إلى أن ينتهي إلى الخط الذي ارتفاع القطب فيه تسعون جزءاً. هناك تكون السنة كلها يوماً واحداً نصفه نهار ونصفه ليل، ويقع القطب الشمالي فوق سمت الرؤوس ويكون معدل النهار على الأفق، ودوران الفلك رحاوي. {cite:zij-sabi-nallino-byblion pp.27-28}."
  en: "Beyond the line at 66 degrees the length of the day is known from the declination table: the day lasts a month, two, three, more or less, with a night to match, up to the line where the pole stands ninety parts high. There the whole year is one day, half day and half night; the north pole is at the zenith, the equator lies on the horizon, and the rotation of the heavens is millstone-like. {cite:zij-sabi-nallino-byblion pp.27-28}."
  ur: "۶۶ درجے والے خط سے آگے دن کی لمبائی جدول المیل سے معلوم ہوتی ہے: دن ایک مہینہ، دو، تین یا کم و بیش ہوتا ہے اور رات اسی کے برابر، یہاں تک کہ اس خط تک پہنچا جائے جس پر قطب کی بلندی نوے جز ہے۔ وہاں پورا سال ایک ہی دن ہے جس کا نصف دن اور نصف رات ہے؛ شمالی قطب سمت الرأس پر ہوتا ہے، معدل النہار افق پر پڑتا ہے اور فلک کی گردش رحوی ہوتی ہے۔ {cite:zij-sabi-nallino-byblion pp.27-28}۔"
  es: "Más allá de la línea de 66 grados, la duración del día se conoce a partir de la tabla de declinación: el día dura un mes, dos, tres, más o menos, con una noche equivalente, hasta la línea donde el polo se encuentra a noventa partes de altura. Allí, todo el año es un día, medio día y media noche; el polo norte está en el cenit, el ecuador se sitúa en el horizonte y la rotación de los cielos es como la de una piedra de molino. {cite:zij-sabi-nallino-byblion pp.27-28}."
  fr: "Au-delà de la ligne à 66 degrés, la durée du jour est connue grâce à la table de déclinaison: le jour dure un mois, deux, trois, plus ou moins, avec une nuit d'égale durée, jusqu'à la ligne où le pôle culmine à 90 parties de la hauteur de la Terre. Là, l'année entière se résume à un jour, un demi-jour et une demi-nuit; le pôle Nord est au zénith, l'équateur se situe à l'horizon, et la rotation du ciel est comparable à celle d'une meule. {cite:zij-sabi-nallino-byblion pp.27-28}."
  tr: "66 derecelik çizginin ötesinde, günün uzunluğu sapma tablosundan belirlenir. Gün bir ay, iki ay, üç ay veya daha fazla uzar ve gece de benzer bir miktarda uzar, ta ki kutup yüksekliğinin 90 dereceye ulaştığı çizgiye ulaşana kadar. Orada, tüm yıl bir gün, yarım gün ve yarım gecedir. Kuzey Kutbu tam tepededir, gün uzunluğu ufuktadır ve gök küresi döner. {cite:zij-sabi-nallino-byblion pp.27-28}"
  id: "Di luar garis 66 derajat, panjang hari ditentukan dari tabel deklinasi. Hari bertambah panjang satu bulan, dua bulan, tiga bulan, atau lebih, dan malam bertambah panjang dengan jumlah yang sama, hingga mencapai garis di mana ketinggian kutub adalah 90 derajat. Di sana, sepanjang tahun adalah satu hari, setengah hari dan setengah malam. Kutub Utara berada tepat di atas kepala, panjang hari berada di cakrawala, dan bola langit berputar. {cite:zij-sabi-nallino-byblion pp.27-28}"
