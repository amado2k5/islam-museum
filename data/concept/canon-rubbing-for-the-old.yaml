id: concept/canon-rubbing-for-the-old
class: concept
kind: scientific
label:
  ar: "دلك المشايخ عند ابن سينا"
  en: "Rubbing for the old in the Canon"
  fr: "Frictions des personnes âgées dans le Canon"
  ur: "بزرگوں کی مالش قانون میں"
  es: "Frotando para los viejos en el Canon"
summary:
  ar: "يوجز ابن سينا في الفصل الخامس أن دلك المشايخ ينبغي أن يكون معتدلاً في الكيف والكم غير متعرض للأعضاء الضعيفة، بخرق خشنة أو بأيد مجردة، فينفعهم ويمنع نوائب علل أعضائهم، وينفعهم الحمام مع الدلك. وقد اختلطت في الطبعة كلمات في وسط الفصل فلم تؤخذ {cite:canon-ibn-sina-print-v1 pp.253-254}."
  en: "In the fifth chapter Ibn Sina says briefly that rubbing the old must be moderate in kind and amount and must not fall on the weak organs, using rough cloths or bare hands; it benefits them and prevents bouts of illness in their organs, and the bath with rubbing benefits them. Some words in the middle of the chapter are garbled in the printing and are not taken {cite:canon-ibn-sina-print-v1 pp.253-254}."
  fr: "Au chapitre 5, Ibn Sina décrit brièvement des frictions modérées en type et quantité, épargnant les organes faibles, au linge rugueux ou à mains nues : elles seraient bénéfiques, préviendraient les accès de maladie des organes, comme le bain accompagné de frictions. Certains mots altérés au milieu du chapitre imprimé ne sont pas repris {cite:canon-ibn-sina-print-v1 pp.253-254}."
  es: "En el quinto capítulo, Ibn Sina afirma brevemente que frotar a los ancianos debe ser moderado en tipo y cantidad, y no debe recaer sobre los órganos débiles, utilizando paños ásperos o las manos desnudas; esto los beneficia y previene episodios de enfermedad en sus órganos, y el baño con frotamiento también los beneficia. Algunas palabras en la parte central del capítulo aparecen distorsionadas en la impresión y no se han incluido {cite:canon-ibn-sina-print-v1 pp.253-254}."
  ur: "پانچویں باب میں ابن سینا مختصراً کہتے ہیں کہ پرانے کو رگڑنا اعتدال اور مقدار میں ہونا چاہیے اور کمزور اعضاء پر کھردرے کپڑے یا ننگے ہاتھوں سے نہیں گرنا چاہیے۔ یہ ان کو فائدہ پہنچاتا ہے اور ان کے اعضاء کی بیماری کو روکتا ہے، اور رگڑ کر غسل کرنے سے فائدہ ہوتا ہے۔ باب کے وسط میں کچھ الفاظ طباعت میں گڑبڑ کر دیے گئے ہیں اور نہیں لیے گئے ہیں {حوالہ:کینن ابن سینا پرنٹ-v1 صفحہ 253-254}۔"
