id: concept/canon-rubbing-for-the-old
class: concept
kind: scientific
label: { ar: "دلك المشايخ عند ابن سينا", en: "Rubbing for the old in the Canon", ur: "بزرگوں کی مالش قانون میں" }
summary:
  ar: "يوجز ابن سينا في الفصل الخامس أن دلك المشايخ ينبغي أن يكون معتدلاً في الكيف والكم غير متعرض للأعضاء الضعيفة، بخرق خشنة أو بأيد مجردة، فينفعهم ويمنع نوائب علل أعضائهم، وينفعهم الحمام مع الدلك. وقد اختلطت في الطبعة كلمات في وسط الفصل فلم تؤخذ {cite:canon-ibn-sina-print-v1 pp.253-254}."
  en: "In the fifth chapter Ibn Sina says briefly that rubbing the old must be moderate in kind and amount and must not fall on the weak organs, using rough cloths or bare hands; it benefits them and prevents bouts of illness in their organs, and the bath with rubbing benefits them. Some words in the middle of the chapter are garbled in the printing and are not taken {cite:canon-ibn-sina-print-v1 pp.253-254}."
