id: concept/walad-fiqh
class: concept
tags: [bunuwwa-browser]
kind: legal
label:
  ar: "وَلد"
  en: "Walad (child, fiqh)"
  es: "Walad (niño, fiqh)"
summary:
  ar: "الولد في اللغة المولود، ويُقال للواحد والجمع والصغير والكبير والذكر والأنثى. والابن عند الجرجاني حيوان ذكر يتولد من نطفة شخص من نوعه، وخص الابن بالذكر والولد بالذكر والأنثى؛ والبنت مؤنث الابن؛ والحفيد ولد الولد؛ والسبط ولد الابن والبنت عند اللغويين، وعند الشافعية يخص ولد البنت، وعند الحنابلة يطلق على كليهما؛ والذرية تطلق عند الجمهور على الأبناء والبنات وأولادهم، ومن الحنابلة من أخرج أولاد البنات؛ والنسل أعم من الولد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17905}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17906}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17907}\n\nالولد يتبع خير الأبوين ديناً باتفاق الفقهاء، فلو كان أحد الزوجين مسلماً فالولد مسلم، وإن أسلم أحد الأبوين وله ولد صغير صار الولد مسلماً بإسلامه، نظراً للولد. وعند الحنفية لو كان أحدهما كتابياً والآخر مجوسياً فالولد كتابي، لأن المجوسية شر، ويشترط لتبعية الولد لخير الأبوين اتحاد الدار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17907}\n\nيتبع الولد أبويه في الدين، ويكون الحكم بالتبعية ديناً أو دار الإسلام، فإن كان الصغير في دارنا والأب في دار الكفر أُلحق بالمسلمين حكماً، ولا يتبع الأب إن كان الأب في دار الإسلام والصغير في دار الكفر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17908}\n\nردة الصبي المميز. أبو يوسف وزفر والشافعي وقول لأحمد يقولون إنها لا تصح، لأن أقوال الصبي غير معتبرة في الضار؛ وأبو حنيفة ومحمد والمالكية والمشهور عن أحمد يحكمون بها، لأن الإسلام يتعلق به كمال العقل دون البلوغ. وإذا ثبتت ردته ترتبت عليه أحكام الردة: لا يرث ولا يورث، وتبين امرأته، ولا يصلى عليه، ويجبر على الإسلام؛ ولا يُقتل لأن القتل عقوبة وليس من أهلها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17908}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17909}\n\nيُسن الأذان في يمنى أذني المولود، والإقامة في يسراهما. ويُقدم في الصلاة على الميت أبوه ثم ابنه ثم ابن ابنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17909}\n\nإمامة ولد الزنى وولد اللعان تفصيلهما في مواضعهما؛ والحنابلة لا بأس بإمامة الولد المنفي باللعان إذا سلم دينه وكان صالحاً للإمامة، وقالت عائشة في ولد الزنى «ليس عليه من خطيئة أبويه شيء». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17909}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910}\n\nلا يجوز بالاتفاق دفع الزكاة إلى الولد من المزكي، لاتصال منافع الأملاك بينهما. وزكاة الفطر يخرجها الشخص عن نفسه وعمن تلزمه نفقته ومنهم الأولاد، وفي إخراجها عن الولد الذي مات أو ولد بعد الوجوب خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910}\n\nيجوز عند جمهور الفقهاء حج الولد عن والديه، لحديث المرأة من خثعم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910}\n\nنسب الولد يثبت من أمه بالولادة، ومن أبيه بالفراش والإقرار والبينة، ولا ينتفي إلا باللعان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910}\n\nالتضحية عن الولد. إذا كان الولد كبيراً فلا تجب على والده، وإن كان صغيراً ولا مال له فعند الحنفية روى الحسن عن أبي حنيفة وجوبها، وعنه لا تجب ويستحب من مال الأب؛ وإذا كان للصبي مال فيضحي عنه أبوه أو وصيه عند أبي حنيفة وأبي يوسف، خلافاً لمحمد وزفر. والمالكية يسنّون التضحية عن الأبوين الفقيرين والولد الصغير حتى يبلغ الذكر، والشافعية يجيزونها للأب والجد من ماله فقط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17911}\n\nالعقيقة، وهي ما يُذبح عن المولود شكراً لله، سنة عند الشافعية والحنابلة، ومندوبة عند المالكية، ومباحة عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17911}\n\nمن أحكام الولد المتصلة بالوالدين ومنها: الختان ⁦(قطع القلفة من الذكر والنواة من الأنثى، وفيه الوجوب والسنية)⁩، وتسميته، وحضانته، وإرضاعه ونفقته وتعليمه وتأديبه، ووجوب طاعة الولد لوالديه في غير معصية وبرهما، ودعاء الولد لوالده، والنهي عن دعاء الوالد على ولده، وكراهة أن يدعو الولد أباه باسمه عند الحنفية، ويُسن ذلك عند الشافعية أن لا يسمي الولد أباه باسمه؛ وهذه الأحكام مفصلة في مواضعها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17912}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17913}\n\nتفضيل بعض الأولاد في العطية. الحنفية والمالكية والشافعية يستحبون التسوية، والحنابلة وأبو يوسف يوجبونها. وتفضيلهم في المحبة لا بأس به عند الحنفية لأنها عمل القلب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17913}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17914}\n\nهبة المشغول. عند الحنفية لا تجوز هبة الدار المشغولة بمتاع الواهب، وتصح هبة الدار المعارة، وللأب الرجوع في هبة ولده عند المالكية والشافعية والحنابلة في المذهب، ويمنع الحنفية وأحمد في رواية ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17914}\n\nالوقف على الأولاد: الأولاد الصلبيون ذكوراً وإناثاً يدخلون بالاتفاق، وأولاد الأولاد مختلف فيهم. وفي الوصية للأقارب: الحنفية لا يدخل الوالدان والولد في ظاهر الرواية، والحنابلة وقول عند الشافعية يدخلونهما، والشافعية في الأصح لا يدخل الوالدان ولا الولد لكن الجد والأحفاد يدخلون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17914}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915}\n\nيسن للولد أن يعدل في العطية لوالديه، وإن فضل فليفضل الأم، قال الدارمي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915}\n\nاستئذان الوالدين في السفر: كل سفر يشتد فيه الخطر لا يخرج الولد إليه بغير إذنهما عند الحنفية، وكل سفر لا يشتد فيه الخطر يجوز له الخروج إليه إذا لم يضيعهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915}\n\nلا يجوز الجهاد إلا بإذن الأبوين، بحسب ما ورد في الصفحة التالية من المادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915}\n\nالجهاد لا يجوز إلا بإذن الأبوين المسلمين، أو بإذن أحدهما إن كان الآخر كافراً، إلا إذا تعين الجهاد، كأن ينزل العدو بقوم من المسلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17916}\n\nأخذ الأبوين من مال ولدهما. جمهور الفقهاء: لا يأخذ الوالد من مال ولده شيئاً إلا عند الحاجة؛ والحنفية يفرّقون بين أن يكونا في المصر فيأكل الوالد الفقير بغير شيء، وأن يكونا في مفازة فيأكل بالقيمة. والحنابلة يجيزون للأب أن يأخذ من مال ولده ما شاء، بشرطين: ألا يجحف بالابن، وألا يعطيه لولد آخر. واستدلوا بحديث «أنت ومالك لأبيك»، وبأن الله جعل الولد موهوباً لأبيه. ونقل ابن هانئ عن أحمد أنه لا يقطع الوالد إذا أخذ من مال ولده، وأنه لا تتصدق المرأة من مال ابنها إلا بإذنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17916}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17917}\n\nالخلع على نفقة الولد وإرضاعه. الولد الفطيم: لا يصح الخلع على نفقته إلا بمدة معينة، لأن نفقته تمتد عمره. والرضيع: يصح الخلع على إرضاعه ونفقته، وإن لم يوقتا تُرضعه الأم حولين كاملين، لقوله تعالى «والوالدات يرضعن أولادهن حولين كاملين لمن أراد أن يتم الرضاعة»، ولقوله «لا رضاع بعد فصال». وإن عاد الزوج أو ماتت الزوجة أو الولد قبل تمام المدة رجع الزوج ببقية النفقة عند الحنفية والحنابلة؛ والشافعية لا يصححون الخلع بغير توقيت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17917}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17918}\n\nالخلع على حضانة الولد. الحنفية يصححون الخلع ويبطلون الشرط، لأن حق الولد أن يكون عند أمه ما كان إليها محتاجاً؛ والمالكية يجيزون الخلع على إسقاط حضانة الأم ويصير الأب أحق بها، ما لم يخش ضرر أو يتعلق القلب بالأم. والشافعية لا تسقط حضانة الأم بنكاحها غير أبي الطفل إذا اختلعت بالحضانة مدة معلومة، لأنها إجارة لازمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17918}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919}\n\nميراث الولد يثبت بين الولد ووالديه بشروط، وولد الزنى ينسب إلى أمه ويرث بجهتها فقط، وولد اللعان لا توارث بينه وبين الملاعن لانتفاء نسبه منه؛ وتفاصيلها في مواضعها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919}\n\nالنذر بذبح الولد. الحنفية: القياس لا شيء عليه، والاستحسان يلزمه شاة، ولو كان له أولاد فشاة عن كل ولد، وهو قول أبي حنيفة ومحمد، والحنابلة في رواية. والمالكية لا شيء عليه، والشافعية لا يصح نذره لأنه ليس بقربة. وروي عن أحمد في امرأة نذرت نحر ولدها أن تذبح كبشاً عن كل ولد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919}\n\nولد الميتة. من استهل أو صدر منه ما يعرف به حياته أخذ حكم الأحياء في الأحكام، ومن ولد ميتاً فإنه ولد في حق غيره تنتهي به العدة، والدم بعده نفاس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919}\n\nأما حكم الولد في حق نفسه من تغسيله والصلاة عليه والإرث والوصية فتفصيله في مواضعه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17920}\n\nبيع الأب مال ولده القاصر: يجوز بالاتفاق في الجملة لانتفاء التهمة وإشفاقه؛ ويجوز للجد عند الحنفية والشافعية لأن له الولاية على المال، ولا يجوز عند المالكية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17920}\n\nبيع الوكيل مال موكله لولده أو شراؤه له. الحنفية والمالكية والشافعية والحنابلة في رواية يمنعون بيعه لولده الصغير، لأنه كالبيع من نفسه ولا يجمع الواحد طرفي العقد. وفي الولد الكبير: الحنفية والشافعية في مقابل الأصح والحنابلة في رواية يمنعونه، والمالكية وأبو يوسف ومحمد يجيزونه بمثل القيمة، والشافعية في الأصح يجيزونه، والحنابلة في الرواية الثانية بشرطين: أن يزيد الوكيل في النداء، وأن يتولى النداء غيره؛ والحنفية يجيزونه إذا كانت الوكالة بعموم المشيئة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17920}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17921}\n\nشراء الرجل لنفسه من مال ولده الطفل، وشراؤه له من نفسه: يجوز عند الفقهاء للأب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17921}\n\nقبض الأب المال الذي اشتراه من ولده: عند الحنفية الأب لا يصير قابضاً بنفس البيع، ولا يبرأ من الثمن حتى ينصب القاضي وكيلاً للصغير فيقبضه؛ وعند المالكية إذا اتحدت يد القابض والمقبض وقع القبض بالنية؛ والحنابلة يجيزون للأب أن يوجب ويقبل ويقبض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17921}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17922}\n\nولاية الولد لاستيفاء القصاص: يثبت لكل ورثة المقتول صغيرهم وكبيرهم، وتفصيله في القصاص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17922}\n\nقتل الولد. يحرم على الوالد قتل ولده، لقوله تعالى «ولا تقتلوا أولادكم من إملاق»، ولحديث ابن مسعود «أن تقتل ولدك تخاف أن يطعم معك». فإذا قتل الوالد ولده لم يُقتص منه عند جمهور الفقهاء، والجد لا يُقتص منه بولد ولده؛ والمالكية يفصّلون فيقتصون إن أضجعه فذبحه أو بقر بطنه، ولا يُقتص إن قتله بالسيف أو العصا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17922}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17923}\n\nقتل الولد بوالديه: يُقتل الولد بكل واحد من الوالدين عند جمهور الفقهاء، لعموم الآيات والأحاديث، ولأن الحاجة إلى الزجر في جانب الولد، ولأن الأب أعظم حرمة من الأجنبي فلا يُترك القصاص فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17923}\n\nقتل الوالد ولده ليس عليه قصاص عند جمهور الفقهاء، فقد أهدرت جنايته على نفس الولد؛ وأحمد في رواية يقول إن الابن لا يُقتل بأبيه، لأن الأب لا تقبل شهادته له. ومن قتل الباغي أو العادل أحد أبويه أو ولده في القتال لضرورته فلا ضمان، وفي غيره يضمن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17924}\n\nشهادة الولد لوالده والعكس لا تجوز، وتجوز شهادة أحدهما على الآخر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17924}\n\nدخول الولد في العاقلة: المالكية والحنفية في قول والحنابلة في إحدى الروايتين يدخل الآباء والأبناء في تحمل الدية، والشافعية والحنفية في قول آخر والحنابلة في الرواية الثانية لا يدخلون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17924}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17925}\n\nسرقة الوالد من مال ولده، والعكس. جمهور الفقهاء لا قطع في سرقة الوالد من مال ولده، لحديث «أنت ومالك لأبيك» و«إن أولادكم من كسبكم»، ولأن الحدود تُدرأ بالشبهات. وأبو ثور وابن المنذر يقطعان الأب، لظاهر آية السرقة. وأما الولد إذا سرق من مال أبيه فالجمهور لا قطع عليه، والمالكية وأحمد في رواية والخرقي يقطعونه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17925}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17926}\n\nقذف الوالد ولده. الحنفية والمالكية في المذهب والشافعية والحنابلة لا يُحَد الوالد بقذف ولده، قياساً على عدم قتله به، ويُعزَّر عند الشافعية والحنفية؛ ومن قذف امرأة ورثها ولده لم يحد إن لم يشاركه فيها غيره؛ وللمالكية في قول يطالب الابن بحد القذف على أبويه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17926}\n\nإسقاط حد الحرابة عن الولد. الحنفية يسقطون حد الحرابة إذا كان ولد للمقطوع عليه الطريق أو ذو رحم محرم منه، لوجود شبهة الإذن بالتناول عادة، والحدود تُدرأ بالشبهات؛ والشافعية والحنابلة يقولون بذلك في أخذ الولد مال أبيه حرابة، أما قتل الولد أباه فيوجب القصاص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17926}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17927}\n\nولد الأضحية: بعض الفقهاء يوجبون ذبحه معها، وبعضهم لا يوجب، وتفصيله في الأضحية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17927}\n\nولد الشاة إذا كان على صورة كلب: الحنفية يفصلون بالتجربة ⁦(الشرب، الأكل، ظهور الأمعاء أو الكرش)⁩ في الحل والحرمة، والشافعية يتركونه ورعاً ما لم يترجح بالخلقة الحل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17927}"
  en: "Walad (a child) in the language is one born; it is used for one or many, for a small or a grown child, and for a male or a female. Ibn (a son), in al-Jurjani's definition, is a male born from the seed of another of its kind, and the Mawsu'a notes that the son is male while the child (walad) may be either sex. Bint (a daughter) is the feminine of ibn. Hafid (a grandchild) is a child's child. Sibt (a grandson by a daughter, in the lexicographers' usage) is applied by the Shafi'is to a daughter's child, and by the Hanbalis to both kinds of grandchild. Dhurriyya (descendants) means in the majority's usage the children, daughters and their children, while some Hanbalis exclude the children of daughters. Nasl (offspring) is wider than walad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17905}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17906}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17907}\n\nThe child follows the better of its parents in religion, by agreement of the jurists. If one spouse is Muslim the child is Muslim; if one parent converts and the child is young, the child becomes Muslim with him, for the child's benefit. The Hanafis hold that if one parent is a People of the Book and the other a Magian, the child is a People of the Book, since Magianism is worse. The Hanafis require for the child to follow the better parent that the two share one abode. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17907}\n\nThe child follows the religion of his parents where the rule of following applies. If the child is in our land and the father in the abode of unbelief, the child is treated as a Muslim by ruling; but the child does not follow a father who is in the abode of Islam while the child is in the abode of unbelief. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17908}\n\nThe apostasy of a discerning boy. Abu Yusuf, Zufar, al-Shafi'i and a view of Ahmad hold that it is not valid, since a boy's words have no effect for harm. Abu Hanifa, Muhammad, the Malikis and the known view of Ahmad rule it valid, since Islam depends on sound reason, not puberty. Once his apostasy is established, the rulings of apostasy apply: he does not inherit or pass on an estate, his wife is separated from him, no funeral prayer is made over him, and he is compelled to return to Islam; but he is not killed, because killing is a punishment and he is not of the kind to bear it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17908}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17909}\n\nAt birth the call to prayer is recited in the right ear of the newborn, and the summons in the left. In the funeral prayer for a dead person, the father comes first, then the son, then the son's son. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17909}\n\nOn leading prayer by the son of an illegitimate union or of li'an, the rulings are set out in their own places. The Hanbalis see no harm in the imamate of a child disowned by li'an if his religion is sound and he is fit to lead; 'A'isha said of the child of illegitimacy that he bears nothing of his parents' sin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17909}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910}\n\nBy agreement, zakat may not be given to one's own child, since the benefits of property are joined between them. A person pays zakat al-fitr for himself and for those whose maintenance is due, including his children; there is a difference on paying it for a child who died or was born after the obligation arose. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910}\n\nBy the majority, a child may perform the pilgrimage on behalf of his parents, on the report of the woman of Khath'am who asked whether she might do it for her aged father. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910}\n\nA child's lineage is established from the mother by birth, and from the father by the marriage bed, acknowledgement or evidence; it ends only by li'an. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910}\n\nOn sacrifice for a child: if the child is grown, his father is not obliged; if he is a minor without property, the Hanafis report from al-Hasan from Abu Hanifa that it is obligatory, and another narration that it is not obligatory but recommended from the father's own money. If the minor has property, his father or executor sacrifices from it, according to Abu Hanifa and Abu Yusuf, against Muhammad and Zufar. The Malikis make it a sunna for the parent to sacrifice for poor parents and for a young child until the boy reaches puberty; the Shafi'is allow it only for the father and grandfather from their own money. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17911}\n\nThe 'aqiqa, the animal slaughtered for a newborn in thanks to God, is a sunna for the Shafi'is and Hanbalis, recommended for the Malikis and permitted for the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17911}\n\nAmong the rulings that bind the child to his parents are: circumcision (cutting the foreskin of a male and the membrane of a female, obligatory for some and sunna for others); naming; custody; suckling; maintenance; education; discipline; the duty of the child to obey and honour his parents in what is not sinful; the child's prayer for his father; the prohibition on a parent's curse on his child; the Hanafi dislike of a son calling his father by his name, and the Shafi'i recommendation that a child not name his father by name. These are set out in their own places. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17912}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17913}\n\nPreference among children in gifts. The Hanafis, Malikis and Shafi'is recommend equality; the Hanbalis and Abu Yusuf make it obligatory. Preference in affection is not blamed by the Hanafis, since affection is an act of the heart. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17913}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17914}\n\nGift of an occupied thing. The Hanafis hold that a house still occupied by the donor's goods cannot be given, while a lent house may be given; the father may take back a gift to his child, according to the Malikis, the Shafi'is and the school view of the Hanbalis, which the Hanafis and a Hanbali narration deny. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17914}\n\nAn endowment for one's children includes children of both sexes by agreement, and their children are a matter of difference. In a bequest to relatives, the Hanafis do not include parents or children in the apparent view; the Hanbalis and one Shafi'i view include them; the sounder Shafi'i view excludes them but includes grandparents and grandchildren. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17914}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915}\n\nIt is sunna for a child to be just in his gifts to his parents, and if he prefers one, al-Darimi says he should prefer the mother. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915}\n\nLeave of parents for travel. The Hanafis hold that for a journey in which danger is great, the child may not go without his parents' leave; for a journey without great danger he may go if he does not neglect them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915}\n\nJihad requires the permission of the parents, as the next part of the entry sets out. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915}\n\nJihad is not valid without the leave of Muslim parents, or the leave of one of them when the other is an unbeliever, unless jihad has become an individual duty, as when the enemy attacks a group of Muslims. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17916}\n\nParents taking from the child's property. The majority hold that a father may take from his child's property only in need. The Hanafis distinguish: if they are in a town, a poor father may eat without payment; if in the desert and without food, he may eat at its value. The Hanbalis allow a father to take from his child's property what he wishes, and to own it, if the father is in need, on two conditions: it must not injure the child, and he must not give what he takes to another child. They cite the saying 'you and your property belong to your father', and that God calls the child a gift to the father. Ibn Hani' records Ahmad's view that a father who takes from his son's property is not punished as a thief, and that a mother may not give from her son's property except with his leave. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17916}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17917}\n\nKhul' on a child's maintenance or suckling. For a weaned child, khul' on his maintenance is valid only for a fixed term, since his maintenance runs for his whole life. For a suckling, khul' on his suckling and maintenance is valid, and if no term is fixed the mother suckles him for two full years, on the verse 'mothers suckle their children two full years for whoever wishes to complete the suckling', and on the saying 'there is no suckling after weaning'. If the husband returns, or the wife or the child dies before the term ends, the husband recovers the balance of the maintenance according to the Hanafis and Hanbalis; the Shafi'is do not allow khul' without a fixed term. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17917}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17918}\n\nKhul' on custody of the child. The Hanafis allow the khul' and void the condition, since the child's right is to be with his mother while he needs her. The Malikis allow a khul' on the mother's custody, and custody then passes to the father, unless harm is feared or the child's heart is attached to the mother. The Shafi'is hold that the mother's custody does not end by her marrying someone other than the child's father if the khul' fixed a term, since it is a binding hire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17918}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919}\n\nThe child's inheritance is established between the child and his parents on conditions; the child of illegitimacy is ascribed to his mother and inherits only through her; the child of li'an does not inherit from the one who disowned him, since his lineage is denied. The details are set out in their places. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919}\n\nA vow to slaughter one's child. The Hanafis: by analogy nothing is due, but by juristic preference a sheep is due, and for several children a sheep for each; this is the view of Abu Hanifa and Muhammad and one Hanbali narration. The Malikis say nothing is due; the Shafi'is say the vow is invalid, since it is not an act of devotion. On a narration of Ahmad about a woman who vowed to slaughter her children, she sacrifices a ram for each child. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919}\n\nThe child born dead. If the newborn cries or shows signs of life, he is ruled as living. If he is born dead, he is a child in the sense that the waiting period ends with his birth, and blood afterwards is the blood of childbirth. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919}\n\nThe rulings on the child in his own right, such as his washing, the funeral prayer over him, and his inheritance and bequests, are set out under their own headings. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17920}\n\nA father selling his minor child's property. This is allowed by agreement in general, since the suspicion is removed and a father is more solicitous than another. The Hanafis and Shafi'is allow the grandfather to do it too, since he holds authority over property as the father does; the Malikis and Hanbalis deny it, since the grandfather has no authority over the child's property. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17920}\n\nAn agent selling his principal's property to the principal's child, or buying for him. The Hanafis, Malikis, Shafi'is and a Hanbali narration forbid selling it to a minor child, since it is like selling to oneself and one person cannot join both sides of a contract. For an adult child, the Hanafis, the Shafi'is in the opposite of the sounder view and a Hanbali narration forbid it; the Malikis and Abu Yusuf and Muhammad allow it at the value; the sounder Shafi'i view allows it; the second Hanbali narration allows it on two conditions, that the agent outbids in the auction and that another conducts the auction. The Hanafis allow it when the agency was given in general terms. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17920}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17921}\n\nA father buying for himself from his child's property, or selling to him, is allowed by the jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17921}\n\nThe father's receipt of what he bought from his child. The Hanafis hold that a father does not become the receiver by the sale alone, and is not discharged from the price until the judge appoints a trustee for the child to receive it from him and return it to him as a deposit. The Malikis hold that where the giver and receiver are one hand, receipt occurs by intention. The Hanbalis allow the father to make the offer, accept and receive. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17921}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17922}\n\nThe child's right to retaliation for a killing belongs to all the heirs of the slain, young and old, male and female, as set out under retaliation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17922}\n\nKilling a child. A parent may not kill his child, on the verse 'do not kill your children for fear of poverty' and on the saying that the gravest sin is to kill one's child for fear that he will eat with you. If a father kills his child, the majority hold that he is not retaliated against, and a grandfather is not retaliated against for his grandson; the Malikis distinguish: he is retaliated against if he lays the child down and slaughters him or splits his belly, and not if he strikes him with a sword or a stick. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17922}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17923}\n\nA child who kills his parents is retaliated against for each parent, according to the majority, by the general texts and the reasons: the need for deterrence lies with the child, a parent loves his child for the child's own sake rather than for his own, and the father has greater sanctity than a stranger. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17923}\n\nA father's killing of his child carries no retaliation by the majority, since his offence against the child's life is void; Ahmad in one narration says the son is not killed for his father, because the father's testimony for his son is not accepted. A killing of a parent or child by a just or rebel party in the course of fighting, where the fighting requires it, is not liable; outside the necessity of fighting, it is liable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17924}\n\nThe testimony of a child for a parent, or a parent for a child, is not admitted; the testimony of one for the other is admitted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17924}\n\nThe inclusion of parents and children in the 'aqila (the kin who share blood-money): the Malikis, a Hanafi view and one Hanbali view include them; the Shafis, another Hanafi view and the second Hanbali view do not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17924}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17925}\n\nTheft by a parent from his child's property, and the reverse. The majority hold that a parent is not amputated for stealing from his child's property, on the sayings 'you and your property belong to your father' and 'your children are from your earnings', since hudud are averted by doubts. Abu Thawr and Ibn al-Mundhir amputate a father, by the apparent text of the verse of theft. For a child stealing from his parent, the majority do not amputate him, while the Malikis, a Hanbali narration and al-Kharaqi amputate him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17925}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17926}\n\nA parent's slander of his child. The Hanafis, the school of the Malikis, the Shafi'is and the Hanbalis do not punish a parent for slandering his child, by analogy with his non-retaliation for killing him; the Shafi'is and Hanafis discipline him for abuse. A parent who inherits a slander against a woman from his child is not punished unless others share the right. One Maliki view allows the son to claim the slander penalty against his parents. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17926}\n\nA child's brigandage (hirabah) against his parent. The Hanafis remove the hudud of brigandage if the victim's child or an unlawful relative is the brigand, since there is an apparent permission to take property at home, and hudud are averted by doubts; the Shafis and Hanbalis agree for a child who takes his father's property as a brigand. A child who kills his father by brigandage is still liable to retaliation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17926}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17927}\n\nThe young of a sacrifice: some jurists require it to be slaughtered with its mother, others do not; details are under sacrifice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17927}\n\nThe kid of a goat that looks like a dog: the Hanafis decide its lawfulness by tests (drinking, eating, whether it has intestines or a paunch). The Shafis leave it as a matter of caution unless its shape points to lawfulness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17927}"
  es: "Walad (niño/niña) en el idioma es aquel que nace; se usa para uno o muchos, para un niño pequeño o un niño mayor, y para un varón o una niña. Ibn (hijo), en la definición de al-Jurjani, es un varón nacido de la semilla de otro de su especie, y el Mawsu'a señala que el hijo es varón mientras que el niño (walad) puede ser de cualquier sexo. Bint (hija) es el femenino de ibn. Hafid (nieto/nieta) es el hijo de un niño. Sibt (nieto por hija, en el uso de los lexicógrafos) es aplicado por los shafi'is al hijo de una hija, y por los hanbalis a ambos tipos de nieto. Dhurriyya (descendientes) significa en el uso mayoritario los hijos, hijas y sus hijos, mientras que algunos hanbalis excluyen a los hijos de las hijas. Nasl (descendencia) es más amplio que walad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17905}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17906}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17907} El niño sigue al mejor de sus padres en religión, por acuerdo de los juristas. Si un cónyuge es musulmán, el niño es musulmán; si un padre se convierte y el niño es pequeño, el niño se convierte al Islam con él, para beneficio del niño. Los hanafíes sostienen que si un padre es Gente del Libro y el otro mago, el niño es Gente del Libro, ya que el magianismo es peor. Los hanafíes exigen que para que el niño siga al mejor padre, ambos compartan una misma morada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17907} El niño sigue la religión de sus padres donde se aplica la regla de seguimiento. Si el niño está en nuestra tierra y el padre en la morada de la incredulidad, el niño es tratado como musulmán por ley; pero el niño no sigue a un padre que está en la morada del Islam mientras el niño está en la morada de la incredulidad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17908} La apostasía de un niño discernidor. Abu Yusuf, Zufar, al-Shafi'i y una opinión de Ahmad sostienen que no es válida, ya que las palabras de un niño no tienen efecto de daño. Abu Hanifa, Muhammad, los Malikis y la opinión conocida de Ahmad dictaminan que es válida, ya que el Islam depende de la razón sana, no de la pubertad. Una vez establecida su apostasía, se aplican las normas de apostasía: no hereda ni transmite bienes, su esposa se separa de él, no se realiza ninguna oración fúnebre por él y se le obliga a regresar al Islam; pero no se le mata, porque matar es un castigo y él no es de los que pueden soportarlo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17908}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17909} Al nacer, la llamada a la oración se recita en el oído derecho del recién nacido y la invocación en el izquierdo. En la oración fúnebre por una persona fallecida, primero va el padre, luego el hijo y luego el hijo del hijo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17909} Sobre dirigir la oración por el hijo de una unión ilegítima o de li'an, las normas se establecen en sus propios lugares. Los hanbalíes no ven ningún problema en el imamato de un niño repudiado por li'an si su religión es sana y es apto para dirigir; 'Aisha dijo del hijo de ilegitimidad que no lleva nada del pecado de sus padres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17909}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910} Por acuerdo, el zakat no puede darse al propio hijo, ya que los beneficios de la propiedad se unen entre ellos. Una persona paga zakat al-fitr por sí misma y por aquellos cuyo sustento se debe, incluidos sus hijos; Hay una diferencia en pagarlo por un niño que murió o nació después de que surgió la obligación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910} Por la mayoría, un niño puede realizar la peregrinación en nombre de sus padres, según el informe de la mujer de Khath'am que preguntó si podía hacerlo por su anciano padre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910} El linaje de un niño se establece de la madre por nacimiento, y del padre por el lecho matrimonial, reconocimiento o evidencia; termina solo por li'an. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910} Sobre el sacrificio por un niño: si el niño es adulto, su padre no está obligado; Si es menor de edad sin propiedades, los Hanafis informan de al-Hasan de Abu Hanifa que es obligatorio, y otra narración dice que no es obligatorio pero sí recomendable con el propio dinero del padre. Si el menor tiene propiedades, su padre o albacea sacrifica de ellas, según Abu Hanifa y Abu Yusuf, en contra de Muhammad y Zufar. Los Malikis hacen sunna que el padre sacrifique por padres pobres y por un niño pequeño hasta que el niño alcance la pubertad; los Shafi'is lo permiten solo para el padre y el abuelo con su propio dinero. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17911} La 'aqiqa, el animal sacrificado para un recién nacido en agradecimiento a Dios, es sunna para los Shafi'is y Hanbalis, recomendada para los Malikis y permitida para los Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17911} Entre las normas que vinculan al niño con sus padres se encuentran: la circuncisión (corte del prepucio de un varón y de la membrana de una mujer, obligatoria para algunos y sunna para otros); la denominación; la custodia; la lactancia; el sustento; la educación; la disciplina; el deber del niño de obedecer y honrar a sus padres en lo que no es pecaminoso; la oración del niño por su padre; la prohibición de que un padre maldiga a su hijo; la desaprobación hanafí de que un hijo llame a su padre por su nombre, y la recomendación shafi'í de que un niño no nombre a su padre. Estas se establecen en sus propios lugares. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17912}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17913} Preferencia entre los niños en los regalos. Los hanafíes, malikíes y shafiíes recomiendan la igualdad; los hanbalíes y Abu Yusuf la hacen obligatoria. La preferencia en el afecto no es censurada por los hanafíes, ya que el afecto es un acto del corazón. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17913}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17914} Donación de una cosa ocupada. Los hanafíes sostienen que una casa aún ocupada por los bienes del donante no puede ser donada, mientras que una casa prestada sí puede ser donada; el padre puede recuperar un regalo para su hijo, según los malikíes, los shafiíes y la visión de la escuela de los hanbalíes, que los hanafíes y una narración hanbalí niegan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17914} Una dotación para los hijos incluye a los hijos de ambos sexos por acuerdo, y los hijos de estos son una cuestión de diferencia. En un legado a parientes, los Hanafis no incluyen a los padres ni a los hijos en la opinión aparente; los Hanbalis y una opinión Shafi'i los incluyen; la opinión Shafi'i más sólida los excluye pero incluye a los abuelos y nietos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17914}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915} Es sunna que un hijo sea justo en sus donaciones a sus padres, y si prefiere a uno, al-Darimi dice que debe preferir a la madre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915} Permiso de los padres para viajar. Los Hanafis sostienen que para un viaje en el que el peligro es grande, el niño no puede ir sin el permiso de sus padres; para un viaje sin gran peligro puede ir si no los descuida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915} La yihad requiere el permiso de los padres, como se establece en la siguiente parte de la entrada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915} La yihad no es válida sin el permiso de los padres musulmanes, o el permiso de uno de ellos cuando el otro es un incrédulo, a menos que la yihad se haya convertido en un deber individual, como cuando el enemigo ataca a un grupo de musulmanes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17916} Padres tomando de la propiedad del hijo. La mayoría sostiene que un padre puede tomar de la propiedad de su hijo solo en caso de necesidad. Los hanafíes distinguen: si están en una ciudad, un padre pobre puede comer sin pagar; si están en el desierto y sin comida, puede comer por su valor. Los hanbalíes permiten que un padre tome de la propiedad de su hijo lo que desee y la posea, si el padre está necesitado, bajo dos condiciones: no debe dañar al niño y no debe dar lo que toma a otro niño. Citan el dicho \"tú y tu propiedad pertenecen a tu padre\", y que Dios llama al hijo un regalo para el padre. Ibn Hani' registra la opinión de Ahmad de que un padre que toma de la propiedad de su hijo no es castigado como ladrón, y que una madre no puede dar de la propiedad de su hijo excepto con su permiso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17916}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17917} Khul' sobre la manutención o lactancia de un niño. Para un niño destetado, el khul' sobre su manutención es válido solo por un plazo fijo, ya que su manutención es de por vida. Para un lactante, el khul' sobre su lactancia y manutención es válido, y si no se fija un plazo, la madre lo amamanta durante dos años completos, según el versículo 'las madres amamantan a sus hijos dos años completos para quien desee completar la lactancia', y según el dicho 'no hay lactancia después del destete'. Si el esposo regresa, o la esposa o el niño mueren antes de que termine el plazo, el esposo recupera el saldo de la manutención según los Hanafis y Hanbalis; los Shafi'is no permiten el khul' sin un plazo fijo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17917}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17918} Khul' sobre la custodia del niño. Los Hanafis permiten el khul' y anulan la condición, ya que el derecho del niño es estar con su madre mientras la necesite. Los Malikis permiten un khul' sobre la custodia de la madre, y la custodia pasa entonces al padre, a menos que se tema algún daño o el corazón del niño esté apegado a la madre. Los Shafi'is sostienen que la custodia de la madre no termina cuando ella se casa con alguien que no es el padre del niño si el khul' fijó un plazo, ya que es un contrato vinculante. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17918}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919} La herencia del niño se establece entre el niño y sus padres bajo ciertas condiciones; el hijo ilegítimo se atribuye a su madre y hereda solo a través de ella; el hijo de li'an no hereda de quien lo desheredó, ya que su linaje es negado. Los detalles se establecen en sus lugares. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919} Un voto de sacrificar a un hijo. Los Hanafis: por analogía no se debe nada, pero por preferencia jurídica se debe una oveja, y para varios hijos una oveja por cada uno; esta es la opinión de Abu Hanifa y Muhammad y una narración Hanbali. Los Malikis dicen que no se debe nada; Los shafi'ís dicen que el voto es inválido, ya que no es un acto de devoción. En una narración de Ahmad sobre una mujer que juró sacrificar a sus hijos, ella sacrifica un carnero por cada hijo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919} El niño nacido muerto. Si el recién nacido llora o muestra signos de vida, se le considera vivo. Si nace muerto, es un niño en el sentido de que el período de espera termina con su nacimiento, y la sangre posterior es la sangre del parto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919} Las normas sobre el niño en su propio derecho, como su lavado, la oración fúnebre sobre él y su herencia y legados, se establecen bajo sus propios encabezados. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17920} Un padre que vende la propiedad de su hijo menor. Esto se permite por acuerdo en general, ya que se elimina la sospecha y un padre es más solícito que otro. Los hanafíes y shafi'ís permiten que el abuelo también lo haga, ya que tiene autoridad sobre la propiedad como lo hace el padre; los malikíes y hanbalíes lo niegan, ya que el abuelo no tiene autoridad sobre la propiedad del niño. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17920} Un agente que vende la propiedad de su principal al hijo del principal, o que compra para él. Los hanafíes, malikíes, shafi'ís y una narración hanbalí prohíben venderla a un niño menor de edad, ya que es como venderse a uno mismo y una persona no puede unirse a ambas partes de un contrato. Para un hijo adulto, los hanafíes, los shafi'ís en contra de la opinión más sólida y una narración hanbalí lo prohíben; los malikíes y Abu Yusuf y Muhammad lo permiten al valor; la opinión shafi'í más sólida lo permite; La segunda narración hanbalí lo permite bajo dos condiciones: que el agente supere la oferta en la subasta y que otro dirija la subasta. Los hanafíes lo permiten cuando la agencia se otorgó en términos generales. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17920}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17921} Que un padre compre para sí mismo de la propiedad de su hijo, o que le venda, está permitido por los juristas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17921} El padre recibe lo que compró de su hijo. Los hanafíes sostienen que un padre no se convierte en receptor por la sola venta, y no queda liberado del precio hasta que el juez designe un fideicomisario para que el hijo lo reciba de él y se lo devuelva como depósito. Los malikíes sostienen que cuando el dador y el receptor son una mano, la recepción ocurre por intención. Los hanbalíes permiten que el padre haga la oferta, acepte y reciba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17921}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17922} El derecho del niño a la represalia por un homicidio pertenece a todos los herederos del asesinado, jóvenes y ancianos, varones y mujeres, como se establece en represalia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17922} Matar a un niño. Un padre no puede matar a su hijo, en el versículo 'no matarás a tus hijos por temor a la pobreza' y en el dicho de que el pecado más grave es matar a un hijo por temor a que coma contigo. Si un padre mata a su hijo, la mayoría sostiene que no se le castiga, y un abuelo no se le castiga por su nieto; los malikíes distinguen: se le castiga si acuesta al niño y lo mata o le abre el vientre, y no si lo golpea con una espada o un palo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17922}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17923} Un hijo que mata a sus padres se castiga por cada padre, según la mayoría, por los textos generales y las razones: la necesidad de disuasión recae en el hijo, un padre ama a su hijo por el bien del hijo más que por el suyo propio, y el padre tiene mayor santidad que un extraño. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17923} El asesinato de un hijo por parte de un padre no conlleva represalia por parte de la mayoría, ya que su ofensa contra la vida del niño es nula; Ahmad en una narración dice que el hijo no es asesinado por su padre, porque el testimonio del padre a favor de su hijo no es aceptado. El asesinato de un padre o un hijo por parte de un bando justo o rebelde en el curso de la lucha, cuando la lucha lo requiere, no es punible; fuera de la necesidad de la lucha, sí lo es. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17924} El testimonio de un hijo a favor de un padre, o de un padre a favor de un hijo, no es admitido; el testimonio de uno a favor del otro sí es admitido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17924} La inclusión de padres e hijos en la 'aqila (los parientes que comparten el dinero de sangre): los malikíes, una visión hanafí y una visión hanbalí los incluyen; los shafiíes, otra visión hanafí y la segunda visión hanbalí no. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17924}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17925} Robo por parte de un padre de la propiedad de su hijo, y viceversa. La mayoría sostiene que un padre no es amputado por robar de la propiedad de su hijo, en los dichos 'tú y tu propiedad pertenecen a tu padre' y 'tus hijos son de tus ganancias', ya que los hudud se evitan por dudas. Abu Thawr e Ibn al-Mundhir amputan a un padre, según el texto aparente del versículo del robo. Para un hijo que roba a su padre, la mayoría no lo amputan, mientras que los Malikis, una narración Hanbali y al-Kharaqi lo amputan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17925}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17926} La calumnia de un padre contra su hijo. Los Hanafis, la escuela de los Malikis, los Shafi'is y los Hanbalis no castigan a un padre por calumniar a su hijo, por analogía con su falta de represalia por matarlo; los Shafi'is y los Hanafis lo disciplinan por abuso. Un padre que hereda una calumnia contra una mujer de su hijo no es castigado a menos que otros compartan el derecho. Una opinión malikí permite que el hijo reclame la pena por calumnia contra sus padres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17926} Bandidaje (hirabah) de un hijo contra su padre. Los hanafíes eliminan el hudud del bandidaje si el hijo de la víctima o un pariente ilegítimo es el bandido, ya que hay un permiso aparente para tomar propiedad en el hogar, y los hudud se evitan por dudas; los shafiíes y los hanbalíes están de acuerdo para un hijo que toma la propiedad de su padre como bandido. Un hijo que mata a su padre mediante bandidaje todavía es responsable de represalias. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17926}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17927} La cría de un sacrificio: algunos juristas exigen que se sacrifique con su madre, otros no; los detalles se encuentran en el apartado de sacrificio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17927} El cabrito que parece un perro: los hanafíes deciden su licitud mediante pruebas (beber, comer, si tiene intestinos o panza). Los shafiíes lo dejan por precaución a menos que su forma indique licitud. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17927}"
