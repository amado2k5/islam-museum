label:
  ar: "وَلد"
  en: "Walad (child, fiqh)"
summary:
  ar: "الولد في اللغة المولود، ويُقال للواحد والجمع والصغير والكبير والذكر والأنثى. والابن عند الجرجاني حيوان ذكر يتولد من نطفة شخص من نوعه، وخص الابن بالذكر والولد بالذكر والأنثى؛ والبنت مؤنث الابن؛ والحفيد ولد الولد؛ والسبط ولد الابن والبنت عند اللغويين، وعند الشافعية يخص ولد البنت، وعند الحنابلة يطلق على كليهما؛ والذرية تطلق عند الجمهور على الأبناء والبنات وأولادهم، ومن الحنابلة من أخرج أولاد البنات؛ والنسل أعم من الولد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17905}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17906}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17907}\n\nالولد يتبع خير الأبوين ديناً باتفاق الفقهاء، فلو كان أحد الزوجين مسلماً فالولد مسلم، وإن أسلم أحد الأبوين وله ولد صغير صار الولد مسلماً بإسلامه، نظراً للولد. وعند الحنفية لو كان أحدهما كتابياً والآخر مجوسياً فالولد كتابي، لأن المجوسية شر، ويشترط لتبعية الولد لخير الأبوين اتحاد الدار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17907}"
  en: "Walad (a child) in the language is one born; it is used for one or many, for a small or a grown child, and for a male or a female. Ibn (a son), in al-Jurjani's definition, is a male born from the seed of another of its kind, and the Mawsu'a notes that the son is male while the child (walad) may be either sex. Bint (a daughter) is the feminine of ibn. Hafid (a grandchild) is a child's child. Sibt (a grandson by a daughter, in the lexicographers' usage) is applied by the Shafi'is to a daughter's child, and by the Hanbalis to both kinds of grandchild. Dhurriyya (descendants) means in the majority's usage the children, daughters and their children, while some Hanbalis exclude the children of daughters. Nasl (offspring) is wider than walad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17905}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17906}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17907}\n\nThe child follows the better of its parents in religion, by agreement of the jurists. If one spouse is Muslim the child is Muslim; if one parent converts and the child is young, the child becomes Muslim with him, for the child's benefit. The Hanafis hold that if one parent is a People of the Book and the other a Magian, the child is a People of the Book, since Magianism is worse. The Hanafis require for the child to follow the better parent that the two share one abode. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17907}"
