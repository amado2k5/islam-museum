id: concept/walad-fiqh
class: concept
tags: [bunuwwa-browser]
kind: legal
label:
  ar: "وَلد"
  en: "Walad (child, fiqh)"
  es: "Walad (niño, fiqh)"
  fr: "Walad (enfant, fiqh)"
  ur: "ولاد ⁦(بچہ، فقہ)⁩"
  tr: "Çocuk"
  id: "Nak."
summary:
  ar: "الولد في اللغة المولود، ويُقال للواحد والجمع والصغير والكبير والذكر والأنثى. والابن عند الجرجاني حيوان ذكر يتولد من نطفة شخص من نوعه، وخص الابن بالذكر والولد بالذكر والأنثى؛ والبنت مؤنث الابن؛ والحفيد ولد الولد؛ والسبط ولد الابن والبنت عند اللغويين، وعند الشافعية يخص ولد البنت، وعند الحنابلة يطلق على كليهما؛ والذرية تطلق عند الجمهور على الأبناء والبنات وأولادهم، ومن الحنابلة من أخرج أولاد البنات؛ والنسل أعم من الولد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17905}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17906}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17907}\n\nالولد يتبع خير الأبوين ديناً باتفاق الفقهاء، فلو كان أحد الزوجين مسلماً فالولد مسلم، وإن أسلم أحد الأبوين وله ولد صغير صار الولد مسلماً بإسلامه، نظراً للولد. وعند الحنفية لو كان أحدهما كتابياً والآخر مجوسياً فالولد كتابي، لأن المجوسية شر، ويشترط لتبعية الولد لخير الأبوين اتحاد الدار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17907}\n\nيتبع الولد أبويه في الدين، ويكون الحكم بالتبعية ديناً أو دار الإسلام، فإن كان الصغير في دارنا والأب في دار الكفر أُلحق بالمسلمين حكماً، ولا يتبع الأب إن كان الأب في دار الإسلام والصغير في دار الكفر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17908}\n\nردة الصبي المميز. أبو يوسف وزفر والشافعي وقول لأحمد يقولون إنها لا تصح، لأن أقوال الصبي غير معتبرة في الضار؛ وأبو حنيفة ومحمد والمالكية والمشهور عن أحمد يحكمون بها، لأن الإسلام يتعلق به كمال العقل دون البلوغ. وإذا ثبتت ردته ترتبت عليه أحكام الردة: لا يرث ولا يورث، وتبين امرأته، ولا يصلى عليه، ويجبر على الإسلام؛ ولا يُقتل لأن القتل عقوبة وليس من أهلها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17908}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17909}\n\nيُسن الأذان في يمنى أذني المولود، والإقامة في يسراهما. ويُقدم في الصلاة على الميت أبوه ثم ابنه ثم ابن ابنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17909}\n\nإمامة ولد الزنى وولد اللعان تفصيلهما في مواضعهما؛ والحنابلة لا بأس بإمامة الولد المنفي باللعان إذا سلم دينه وكان صالحاً للإمامة، وقالت عائشة في ولد الزنى «ليس عليه من خطيئة أبويه شيء». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17909}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910}\n\nلا يجوز بالاتفاق دفع الزكاة إلى الولد من المزكي، لاتصال منافع الأملاك بينهما. وزكاة الفطر يخرجها الشخص عن نفسه وعمن تلزمه نفقته ومنهم الأولاد، وفي إخراجها عن الولد الذي مات أو ولد بعد الوجوب خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910}\n\nيجوز عند جمهور الفقهاء حج الولد عن والديه، لحديث المرأة من خثعم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910}\n\nنسب الولد يثبت من أمه بالولادة، ومن أبيه بالفراش والإقرار والبينة، ولا ينتفي إلا باللعان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910}\n\nالتضحية عن الولد. إذا كان الولد كبيراً فلا تجب على والده، وإن كان صغيراً ولا مال له فعند الحنفية روى الحسن عن أبي حنيفة وجوبها، وعنه لا تجب ويستحب من مال الأب؛ وإذا كان للصبي مال فيضحي عنه أبوه أو وصيه عند أبي حنيفة وأبي يوسف، خلافاً لمحمد وزفر. والمالكية يسنّون التضحية عن الأبوين الفقيرين والولد الصغير حتى يبلغ الذكر، والشافعية يجيزونها للأب والجد من ماله فقط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17911}\n\nالعقيقة، وهي ما يُذبح عن المولود شكراً لله، سنة عند الشافعية والحنابلة، ومندوبة عند المالكية، ومباحة عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17911}\n\nمن أحكام الولد المتصلة بالوالدين ومنها: الختان ⁦(قطع القلفة من الذكر والنواة من الأنثى، وفيه الوجوب والسنية)⁩، وتسميته، وحضانته، وإرضاعه ونفقته وتعليمه وتأديبه، ووجوب طاعة الولد لوالديه في غير معصية وبرهما، ودعاء الولد لوالده، والنهي عن دعاء الوالد على ولده، وكراهة أن يدعو الولد أباه باسمه عند الحنفية، ويُسن ذلك عند الشافعية أن لا يسمي الولد أباه باسمه؛ وهذه الأحكام مفصلة في مواضعها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17912}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17913}\n\nتفضيل بعض الأولاد في العطية. الحنفية والمالكية والشافعية يستحبون التسوية، والحنابلة وأبو يوسف يوجبونها. وتفضيلهم في المحبة لا بأس به عند الحنفية لأنها عمل القلب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17913}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17914}\n\nهبة المشغول. عند الحنفية لا تجوز هبة الدار المشغولة بمتاع الواهب، وتصح هبة الدار المعارة، وللأب الرجوع في هبة ولده عند المالكية والشافعية والحنابلة في المذهب، ويمنع الحنفية وأحمد في رواية ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17914}\n\nالوقف على الأولاد: الأولاد الصلبيون ذكوراً وإناثاً يدخلون بالاتفاق، وأولاد الأولاد مختلف فيهم. وفي الوصية للأقارب: الحنفية لا يدخل الوالدان والولد في ظاهر الرواية، والحنابلة وقول عند الشافعية يدخلونهما، والشافعية في الأصح لا يدخل الوالدان ولا الولد لكن الجد والأحفاد يدخلون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17914}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915}\n\nيسن للولد أن يعدل في العطية لوالديه، وإن فضل فليفضل الأم، قال الدارمي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915}\n\nاستئذان الوالدين في السفر: كل سفر يشتد فيه الخطر لا يخرج الولد إليه بغير إذنهما عند الحنفية، وكل سفر لا يشتد فيه الخطر يجوز له الخروج إليه إذا لم يضيعهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915}\n\nلا يجوز الجهاد إلا بإذن الأبوين، بحسب ما ورد في الصفحة التالية من المادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915}\n\nالجهاد لا يجوز إلا بإذن الأبوين المسلمين، أو بإذن أحدهما إن كان الآخر كافراً، إلا إذا تعين الجهاد، كأن ينزل العدو بقوم من المسلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17916}\n\nأخذ الأبوين من مال ولدهما. جمهور الفقهاء: لا يأخذ الوالد من مال ولده شيئاً إلا عند الحاجة؛ والحنفية يفرّقون بين أن يكونا في المصر فيأكل الوالد الفقير بغير شيء، وأن يكونا في مفازة فيأكل بالقيمة. والحنابلة يجيزون للأب أن يأخذ من مال ولده ما شاء، بشرطين: ألا يجحف بالابن، وألا يعطيه لولد آخر. واستدلوا بحديث «أنت ومالك لأبيك»، وبأن الله جعل الولد موهوباً لأبيه. ونقل ابن هانئ عن أحمد أنه لا يقطع الوالد إذا أخذ من مال ولده، وأنه لا تتصدق المرأة من مال ابنها إلا بإذنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17916}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17917}\n\nالخلع على نفقة الولد وإرضاعه. الولد الفطيم: لا يصح الخلع على نفقته إلا بمدة معينة، لأن نفقته تمتد عمره. والرضيع: يصح الخلع على إرضاعه ونفقته، وإن لم يوقتا تُرضعه الأم حولين كاملين، لقوله تعالى «والوالدات يرضعن أولادهن حولين كاملين لمن أراد أن يتم الرضاعة»، ولقوله «لا رضاع بعد فصال». وإن عاد الزوج أو ماتت الزوجة أو الولد قبل تمام المدة رجع الزوج ببقية النفقة عند الحنفية والحنابلة؛ والشافعية لا يصححون الخلع بغير توقيت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17917}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17918}\n\nالخلع على حضانة الولد. الحنفية يصححون الخلع ويبطلون الشرط، لأن حق الولد أن يكون عند أمه ما كان إليها محتاجاً؛ والمالكية يجيزون الخلع على إسقاط حضانة الأم ويصير الأب أحق بها، ما لم يخش ضرر أو يتعلق القلب بالأم. والشافعية لا تسقط حضانة الأم بنكاحها غير أبي الطفل إذا اختلعت بالحضانة مدة معلومة، لأنها إجارة لازمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17918}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919}\n\nميراث الولد يثبت بين الولد ووالديه بشروط، وولد الزنى ينسب إلى أمه ويرث بجهتها فقط، وولد اللعان لا توارث بينه وبين الملاعن لانتفاء نسبه منه؛ وتفاصيلها في مواضعها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919}\n\nالنذر بذبح الولد. الحنفية: القياس لا شيء عليه، والاستحسان يلزمه شاة، ولو كان له أولاد فشاة عن كل ولد، وهو قول أبي حنيفة ومحمد، والحنابلة في رواية. والمالكية لا شيء عليه، والشافعية لا يصح نذره لأنه ليس بقربة. وروي عن أحمد في امرأة نذرت نحر ولدها أن تذبح كبشاً عن كل ولد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919}\n\nولد الميتة. من استهل أو صدر منه ما يعرف به حياته أخذ حكم الأحياء في الأحكام، ومن ولد ميتاً فإنه ولد في حق غيره تنتهي به العدة، والدم بعده نفاس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919}\n\nأما حكم الولد في حق نفسه من تغسيله والصلاة عليه والإرث والوصية فتفصيله في مواضعه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17920}\n\nبيع الأب مال ولده القاصر: يجوز بالاتفاق في الجملة لانتفاء التهمة وإشفاقه؛ ويجوز للجد عند الحنفية والشافعية لأن له الولاية على المال، ولا يجوز عند المالكية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17920}\n\nبيع الوكيل مال موكله لولده أو شراؤه له. الحنفية والمالكية والشافعية والحنابلة في رواية يمنعون بيعه لولده الصغير، لأنه كالبيع من نفسه ولا يجمع الواحد طرفي العقد. وفي الولد الكبير: الحنفية والشافعية في مقابل الأصح والحنابلة في رواية يمنعونه، والمالكية وأبو يوسف ومحمد يجيزونه بمثل القيمة، والشافعية في الأصح يجيزونه، والحنابلة في الرواية الثانية بشرطين: أن يزيد الوكيل في النداء، وأن يتولى النداء غيره؛ والحنفية يجيزونه إذا كانت الوكالة بعموم المشيئة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17920}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17921}\n\nشراء الرجل لنفسه من مال ولده الطفل، وشراؤه له من نفسه: يجوز عند الفقهاء للأب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17921}\n\nقبض الأب المال الذي اشتراه من ولده: عند الحنفية الأب لا يصير قابضاً بنفس البيع، ولا يبرأ من الثمن حتى ينصب القاضي وكيلاً للصغير فيقبضه؛ وعند المالكية إذا اتحدت يد القابض والمقبض وقع القبض بالنية؛ والحنابلة يجيزون للأب أن يوجب ويقبل ويقبض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17921}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17922}\n\nولاية الولد لاستيفاء القصاص: يثبت لكل ورثة المقتول صغيرهم وكبيرهم، وتفصيله في القصاص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17922}\n\nقتل الولد. يحرم على الوالد قتل ولده، لقوله تعالى «ولا تقتلوا أولادكم من إملاق»، ولحديث ابن مسعود «أن تقتل ولدك تخاف أن يطعم معك». فإذا قتل الوالد ولده لم يُقتص منه عند جمهور الفقهاء، والجد لا يُقتص منه بولد ولده؛ والمالكية يفصّلون فيقتصون إن أضجعه فذبحه أو بقر بطنه، ولا يُقتص إن قتله بالسيف أو العصا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17922}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17923}\n\nقتل الولد بوالديه: يُقتل الولد بكل واحد من الوالدين عند جمهور الفقهاء، لعموم الآيات والأحاديث، ولأن الحاجة إلى الزجر في جانب الولد، ولأن الأب أعظم حرمة من الأجنبي فلا يُترك القصاص فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17923}\n\nقتل الوالد ولده ليس عليه قصاص عند جمهور الفقهاء، فقد أهدرت جنايته على نفس الولد؛ وأحمد في رواية يقول إن الابن لا يُقتل بأبيه، لأن الأب لا تقبل شهادته له. ومن قتل الباغي أو العادل أحد أبويه أو ولده في القتال لضرورته فلا ضمان، وفي غيره يضمن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17924}\n\nشهادة الولد لوالده والعكس لا تجوز، وتجوز شهادة أحدهما على الآخر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17924}\n\nدخول الولد في العاقلة: المالكية والحنفية في قول والحنابلة في إحدى الروايتين يدخل الآباء والأبناء في تحمل الدية، والشافعية والحنفية في قول آخر والحنابلة في الرواية الثانية لا يدخلون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17924}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17925}\n\nسرقة الوالد من مال ولده، والعكس. جمهور الفقهاء لا قطع في سرقة الوالد من مال ولده، لحديث «أنت ومالك لأبيك» و«إن أولادكم من كسبكم»، ولأن الحدود تُدرأ بالشبهات. وأبو ثور وابن المنذر يقطعان الأب، لظاهر آية السرقة. وأما الولد إذا سرق من مال أبيه فالجمهور لا قطع عليه، والمالكية وأحمد في رواية والخرقي يقطعونه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17925}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17926}\n\nقذف الوالد ولده. الحنفية والمالكية في المذهب والشافعية والحنابلة لا يُحَد الوالد بقذف ولده، قياساً على عدم قتله به، ويُعزَّر عند الشافعية والحنفية؛ ومن قذف امرأة ورثها ولده لم يحد إن لم يشاركه فيها غيره؛ وللمالكية في قول يطالب الابن بحد القذف على أبويه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17926}\n\nإسقاط حد الحرابة عن الولد. الحنفية يسقطون حد الحرابة إذا كان ولد للمقطوع عليه الطريق أو ذو رحم محرم منه، لوجود شبهة الإذن بالتناول عادة، والحدود تُدرأ بالشبهات؛ والشافعية والحنابلة يقولون بذلك في أخذ الولد مال أبيه حرابة، أما قتل الولد أباه فيوجب القصاص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17926}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17927}\n\nولد الأضحية: بعض الفقهاء يوجبون ذبحه معها، وبعضهم لا يوجب، وتفصيله في الأضحية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17927}\n\nولد الشاة إذا كان على صورة كلب: الحنفية يفصلون بالتجربة ⁦(الشرب، الأكل، ظهور الأمعاء أو الكرش)⁩ في الحل والحرمة، والشافعية يتركونه ورعاً ما لم يترجح بالخلقة الحل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17927}"
  en: "Walad (a child) in the language is one born; it is used for one or many, for a small or a grown child, and for a male or a female. Ibn (a son), in al-Jurjani's definition, is a male born from the seed of another of its kind, and the Mawsu'a notes that the son is male while the child (walad) may be either sex. Bint (a daughter) is the feminine of ibn. Hafid (a grandchild) is a child's child. Sibt (a grandson by a daughter, in the lexicographers' usage) is applied by the Shafi'is to a daughter's child, and by the Hanbalis to both kinds of grandchild. Dhurriyya (descendants) means in the majority's usage the children, daughters and their children, while some Hanbalis exclude the children of daughters. Nasl (offspring) is wider than walad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17905}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17906}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17907}\n\nThe child follows the better of its parents in religion, by agreement of the jurists. If one spouse is Muslim the child is Muslim; if one parent converts and the child is young, the child becomes Muslim with him, for the child's benefit. The Hanafis hold that if one parent is a People of the Book and the other a Magian, the child is a People of the Book, since Magianism is worse. The Hanafis require for the child to follow the better parent that the two share one abode. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17907}\n\nThe child follows the religion of his parents where the rule of following applies. If the child is in our land and the father in the abode of unbelief, the child is treated as a Muslim by ruling; but the child does not follow a father who is in the abode of Islam while the child is in the abode of unbelief. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17908}\n\nThe apostasy of a discerning boy. Abu Yusuf, Zufar, al-Shafi'i and a view of Ahmad hold that it is not valid, since a boy's words have no effect for harm. Abu Hanifa, Muhammad, the Malikis and the known view of Ahmad rule it valid, since Islam depends on sound reason, not puberty. Once his apostasy is established, the rulings of apostasy apply: he does not inherit or pass on an estate, his wife is separated from him, no funeral prayer is made over him, and he is compelled to return to Islam; but he is not killed, because killing is a punishment and he is not of the kind to bear it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17908}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17909}\n\nAt birth the call to prayer is recited in the right ear of the newborn, and the summons in the left. In the funeral prayer for a dead person, the father comes first, then the son, then the son's son. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17909}\n\nOn leading prayer by the son of an illegitimate union or of li'an, the rulings are set out in their own places. The Hanbalis see no harm in the imamate of a child disowned by li'an if his religion is sound and he is fit to lead; 'A'isha said of the child of illegitimacy that he bears nothing of his parents' sin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17909}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910}\n\nBy agreement, zakat may not be given to one's own child, since the benefits of property are joined between them. A person pays zakat al-fitr for himself and for those whose maintenance is due, including his children; there is a difference on paying it for a child who died or was born after the obligation arose. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910}\n\nBy the majority, a child may perform the pilgrimage on behalf of his parents, on the report of the woman of Khath'am who asked whether she might do it for her aged father. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910}\n\nA child's lineage is established from the mother by birth, and from the father by the marriage bed, acknowledgement or evidence; it ends only by li'an. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910}\n\nOn sacrifice for a child: if the child is grown, his father is not obliged; if he is a minor without property, the Hanafis report from al-Hasan from Abu Hanifa that it is obligatory, and another narration that it is not obligatory but recommended from the father's own money. If the minor has property, his father or executor sacrifices from it, according to Abu Hanifa and Abu Yusuf, against Muhammad and Zufar. The Malikis make it a sunna for the parent to sacrifice for poor parents and for a young child until the boy reaches puberty; the Shafi'is allow it only for the father and grandfather from their own money. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17911}\n\nThe 'aqiqa, the animal slaughtered for a newborn in thanks to God, is a sunna for the Shafi'is and Hanbalis, recommended for the Malikis and permitted for the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17911}\n\nAmong the rulings that bind the child to his parents are: circumcision (cutting the foreskin of a male and the membrane of a female, obligatory for some and sunna for others); naming; custody; suckling; maintenance; education; discipline; the duty of the child to obey and honour his parents in what is not sinful; the child's prayer for his father; the prohibition on a parent's curse on his child; the Hanafi dislike of a son calling his father by his name, and the Shafi'i recommendation that a child not name his father by name. These are set out in their own places. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17912}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17913}\n\nPreference among children in gifts. The Hanafis, Malikis and Shafi'is recommend equality; the Hanbalis and Abu Yusuf make it obligatory. Preference in affection is not blamed by the Hanafis, since affection is an act of the heart. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17913}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17914}\n\nGift of an occupied thing. The Hanafis hold that a house still occupied by the donor's goods cannot be given, while a lent house may be given; the father may take back a gift to his child, according to the Malikis, the Shafi'is and the school view of the Hanbalis, which the Hanafis and a Hanbali narration deny. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17914}\n\nAn endowment for one's children includes children of both sexes by agreement, and their children are a matter of difference. In a bequest to relatives, the Hanafis do not include parents or children in the apparent view; the Hanbalis and one Shafi'i view include them; the sounder Shafi'i view excludes them but includes grandparents and grandchildren. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17914}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915}\n\nIt is sunna for a child to be just in his gifts to his parents, and if he prefers one, al-Darimi says he should prefer the mother. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915}\n\nLeave of parents for travel. The Hanafis hold that for a journey in which danger is great, the child may not go without his parents' leave; for a journey without great danger he may go if he does not neglect them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915}\n\nJihad requires the permission of the parents, as the next part of the entry sets out. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915}\n\nJihad is not valid without the leave of Muslim parents, or the leave of one of them when the other is an unbeliever, unless jihad has become an individual duty, as when the enemy attacks a group of Muslims. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17916}\n\nParents taking from the child's property. The majority hold that a father may take from his child's property only in need. The Hanafis distinguish: if they are in a town, a poor father may eat without payment; if in the desert and without food, he may eat at its value. The Hanbalis allow a father to take from his child's property what he wishes, and to own it, if the father is in need, on two conditions: it must not injure the child, and he must not give what he takes to another child. They cite the saying 'you and your property belong to your father', and that God calls the child a gift to the father. Ibn Hani' records Ahmad's view that a father who takes from his son's property is not punished as a thief, and that a mother may not give from her son's property except with his leave. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17916}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17917}\n\nKhul' on a child's maintenance or suckling. For a weaned child, khul' on his maintenance is valid only for a fixed term, since his maintenance runs for his whole life. For a suckling, khul' on his suckling and maintenance is valid, and if no term is fixed the mother suckles him for two full years, on the verse 'mothers suckle their children two full years for whoever wishes to complete the suckling', and on the saying 'there is no suckling after weaning'. If the husband returns, or the wife or the child dies before the term ends, the husband recovers the balance of the maintenance according to the Hanafis and Hanbalis; the Shafi'is do not allow khul' without a fixed term. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17917}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17918}\n\nKhul' on custody of the child. The Hanafis allow the khul' and void the condition, since the child's right is to be with his mother while he needs her. The Malikis allow a khul' on the mother's custody, and custody then passes to the father, unless harm is feared or the child's heart is attached to the mother. The Shafi'is hold that the mother's custody does not end by her marrying someone other than the child's father if the khul' fixed a term, since it is a binding hire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17918}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919}\n\nThe child's inheritance is established between the child and his parents on conditions; the child of illegitimacy is ascribed to his mother and inherits only through her; the child of li'an does not inherit from the one who disowned him, since his lineage is denied. The details are set out in their places. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919}\n\nA vow to slaughter one's child. The Hanafis: by analogy nothing is due, but by juristic preference a sheep is due, and for several children a sheep for each; this is the view of Abu Hanifa and Muhammad and one Hanbali narration. The Malikis say nothing is due; the Shafi'is say the vow is invalid, since it is not an act of devotion. On a narration of Ahmad about a woman who vowed to slaughter her children, she sacrifices a ram for each child. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919}\n\nThe child born dead. If the newborn cries or shows signs of life, he is ruled as living. If he is born dead, he is a child in the sense that the waiting period ends with his birth, and blood afterwards is the blood of childbirth. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919}\n\nThe rulings on the child in his own right, such as his washing, the funeral prayer over him, and his inheritance and bequests, are set out under their own headings. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17920}\n\nA father selling his minor child's property. This is allowed by agreement in general, since the suspicion is removed and a father is more solicitous than another. The Hanafis and Shafi'is allow the grandfather to do it too, since he holds authority over property as the father does; the Malikis and Hanbalis deny it, since the grandfather has no authority over the child's property. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17920}\n\nAn agent selling his principal's property to the principal's child, or buying for him. The Hanafis, Malikis, Shafi'is and a Hanbali narration forbid selling it to a minor child, since it is like selling to oneself and one person cannot join both sides of a contract. For an adult child, the Hanafis, the Shafi'is in the opposite of the sounder view and a Hanbali narration forbid it; the Malikis and Abu Yusuf and Muhammad allow it at the value; the sounder Shafi'i view allows it; the second Hanbali narration allows it on two conditions, that the agent outbids in the auction and that another conducts the auction. The Hanafis allow it when the agency was given in general terms. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17920}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17921}\n\nA father buying for himself from his child's property, or selling to him, is allowed by the jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17921}\n\nThe father's receipt of what he bought from his child. The Hanafis hold that a father does not become the receiver by the sale alone, and is not discharged from the price until the judge appoints a trustee for the child to receive it from him and return it to him as a deposit. The Malikis hold that where the giver and receiver are one hand, receipt occurs by intention. The Hanbalis allow the father to make the offer, accept and receive. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17921}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17922}\n\nThe child's right to retaliation for a killing belongs to all the heirs of the slain, young and old, male and female, as set out under retaliation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17922}\n\nKilling a child. A parent may not kill his child, on the verse 'do not kill your children for fear of poverty' and on the saying that the gravest sin is to kill one's child for fear that he will eat with you. If a father kills his child, the majority hold that he is not retaliated against, and a grandfather is not retaliated against for his grandson; the Malikis distinguish: he is retaliated against if he lays the child down and slaughters him or splits his belly, and not if he strikes him with a sword or a stick. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17922}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17923}\n\nA child who kills his parents is retaliated against for each parent, according to the majority, by the general texts and the reasons: the need for deterrence lies with the child, a parent loves his child for the child's own sake rather than for his own, and the father has greater sanctity than a stranger. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17923}\n\nA father's killing of his child carries no retaliation by the majority, since his offence against the child's life is void; Ahmad in one narration says the son is not killed for his father, because the father's testimony for his son is not accepted. A killing of a parent or child by a just or rebel party in the course of fighting, where the fighting requires it, is not liable; outside the necessity of fighting, it is liable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17924}\n\nThe testimony of a child for a parent, or a parent for a child, is not admitted; the testimony of one for the other is admitted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17924}\n\nThe inclusion of parents and children in the 'aqila (the kin who share blood-money): the Malikis, a Hanafi view and one Hanbali view include them; the Shafis, another Hanafi view and the second Hanbali view do not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17924}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17925}\n\nTheft by a parent from his child's property, and the reverse. The majority hold that a parent is not amputated for stealing from his child's property, on the sayings 'you and your property belong to your father' and 'your children are from your earnings', since hudud are averted by doubts. Abu Thawr and Ibn al-Mundhir amputate a father, by the apparent text of the verse of theft. For a child stealing from his parent, the majority do not amputate him, while the Malikis, a Hanbali narration and al-Kharaqi amputate him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17925}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17926}\n\nA parent's slander of his child. The Hanafis, the school of the Malikis, the Shafi'is and the Hanbalis do not punish a parent for slandering his child, by analogy with his non-retaliation for killing him; the Shafi'is and Hanafis discipline him for abuse. A parent who inherits a slander against a woman from his child is not punished unless others share the right. One Maliki view allows the son to claim the slander penalty against his parents. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17926}\n\nA child's brigandage (hirabah) against his parent. The Hanafis remove the hudud of brigandage if the victim's child or an unlawful relative is the brigand, since there is an apparent permission to take property at home, and hudud are averted by doubts; the Shafis and Hanbalis agree for a child who takes his father's property as a brigand. A child who kills his father by brigandage is still liable to retaliation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17926}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17927}\n\nThe young of a sacrifice: some jurists require it to be slaughtered with its mother, others do not; details are under sacrifice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17927}\n\nThe kid of a goat that looks like a dog: the Hanafis decide its lawfulness by tests (drinking, eating, whether it has intestines or a paunch). The Shafis leave it as a matter of caution unless its shape points to lawfulness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17927}"
  es: "Walad (niño/niña) en el idioma es aquel que nace; se usa para uno o muchos, para un niño pequeño o un niño mayor, y para un varón o una niña. Ibn (hijo), en la definición de al-Jurjani, es un varón nacido de la semilla de otro de su especie, y el Mawsu'a señala que el hijo es varón mientras que el niño (walad) puede ser de cualquier sexo. Bint (hija) es el femenino de ibn. Hafid (nieto/nieta) es el hijo de un niño. Sibt (nieto por hija, en el uso de los lexicógrafos) es aplicado por los shafi'is al hijo de una hija, y por los hanbalis a ambos tipos de nieto. Dhurriyya (descendientes) significa en el uso mayoritario los hijos, hijas y sus hijos, mientras que algunos hanbalis excluyen a los hijos de las hijas. Nasl (descendencia) es más amplio que walad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17905}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17906}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17907} El niño sigue al mejor de sus padres en religión, por acuerdo de los juristas. Si un cónyuge es musulmán, el niño es musulmán; si un padre se convierte y el niño es pequeño, el niño se convierte al Islam con él, para beneficio del niño. Los hanafíes sostienen que si un padre es Gente del Libro y el otro mago, el niño es Gente del Libro, ya que el magianismo es peor. Los hanafíes exigen que para que el niño siga al mejor padre, ambos compartan una misma morada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17907} El niño sigue la religión de sus padres donde se aplica la regla de seguimiento. Si el niño está en nuestra tierra y el padre en la morada de la incredulidad, el niño es tratado como musulmán por ley; pero el niño no sigue a un padre que está en la morada del Islam mientras el niño está en la morada de la incredulidad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17908} La apostasía de un niño discernidor. Abu Yusuf, Zufar, al-Shafi'i y una opinión de Ahmad sostienen que no es válida, ya que las palabras de un niño no tienen efecto de daño. Abu Hanifa, Muhammad, los Malikis y la opinión conocida de Ahmad dictaminan que es válida, ya que el Islam depende de la razón sana, no de la pubertad. Una vez establecida su apostasía, se aplican las normas de apostasía: no hereda ni transmite bienes, su esposa se separa de él, no se realiza ninguna oración fúnebre por él y se le obliga a regresar al Islam; pero no se le mata, porque matar es un castigo y él no es de los que pueden soportarlo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17908}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17909} Al nacer, la llamada a la oración se recita en el oído derecho del recién nacido y la invocación en el izquierdo. En la oración fúnebre por una persona fallecida, primero va el padre, luego el hijo y luego el hijo del hijo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17909} Sobre dirigir la oración por el hijo de una unión ilegítima o de li'an, las normas se establecen en sus propios lugares. Los hanbalíes no ven ningún problema en el imamato de un niño repudiado por li'an si su religión es sana y es apto para dirigir; 'Aisha dijo del hijo de ilegitimidad que no lleva nada del pecado de sus padres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17909}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910} Por acuerdo, el zakat no puede darse al propio hijo, ya que los beneficios de la propiedad se unen entre ellos. Una persona paga zakat al-fitr por sí misma y por aquellos cuyo sustento se debe, incluidos sus hijos; Hay una diferencia en pagarlo por un niño que murió o nació después de que surgió la obligación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910} Por la mayoría, un niño puede realizar la peregrinación en nombre de sus padres, según el informe de la mujer de Khath'am que preguntó si podía hacerlo por su anciano padre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910} El linaje de un niño se establece de la madre por nacimiento, y del padre por el lecho matrimonial, reconocimiento o evidencia; termina solo por li'an. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910} Sobre el sacrificio por un niño: si el niño es adulto, su padre no está obligado; Si es menor de edad sin propiedades, los Hanafis informan de al-Hasan de Abu Hanifa que es obligatorio, y otra narración dice que no es obligatorio pero sí recomendable con el propio dinero del padre. Si el menor tiene propiedades, su padre o albacea sacrifica de ellas, según Abu Hanifa y Abu Yusuf, en contra de Muhammad y Zufar. Los Malikis hacen sunna que el padre sacrifique por padres pobres y por un niño pequeño hasta que el niño alcance la pubertad; los Shafi'is lo permiten solo para el padre y el abuelo con su propio dinero. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17911} La 'aqiqa, el animal sacrificado para un recién nacido en agradecimiento a Dios, es sunna para los Shafi'is y Hanbalis, recomendada para los Malikis y permitida para los Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17911} Entre las normas que vinculan al niño con sus padres se encuentran: la circuncisión (corte del prepucio de un varón y de la membrana de una mujer, obligatoria para algunos y sunna para otros); la denominación; la custodia; la lactancia; el sustento; la educación; la disciplina; el deber del niño de obedecer y honrar a sus padres en lo que no es pecaminoso; la oración del niño por su padre; la prohibición de que un padre maldiga a su hijo; la desaprobación hanafí de que un hijo llame a su padre por su nombre, y la recomendación shafi'í de que un niño no nombre a su padre. Estas se establecen en sus propios lugares. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17912}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17913} Preferencia entre los niños en los regalos. Los hanafíes, malikíes y shafiíes recomiendan la igualdad; los hanbalíes y Abu Yusuf la hacen obligatoria. La preferencia en el afecto no es censurada por los hanafíes, ya que el afecto es un acto del corazón. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17913}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17914} Donación de una cosa ocupada. Los hanafíes sostienen que una casa aún ocupada por los bienes del donante no puede ser donada, mientras que una casa prestada sí puede ser donada; el padre puede recuperar un regalo para su hijo, según los malikíes, los shafiíes y la visión de la escuela de los hanbalíes, que los hanafíes y una narración hanbalí niegan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17914} Una dotación para los hijos incluye a los hijos de ambos sexos por acuerdo, y los hijos de estos son una cuestión de diferencia. En un legado a parientes, los Hanafis no incluyen a los padres ni a los hijos en la opinión aparente; los Hanbalis y una opinión Shafi'i los incluyen; la opinión Shafi'i más sólida los excluye pero incluye a los abuelos y nietos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17914}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915} Es sunna que un hijo sea justo en sus donaciones a sus padres, y si prefiere a uno, al-Darimi dice que debe preferir a la madre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915} Permiso de los padres para viajar. Los Hanafis sostienen que para un viaje en el que el peligro es grande, el niño no puede ir sin el permiso de sus padres; para un viaje sin gran peligro puede ir si no los descuida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915} La yihad requiere el permiso de los padres, como se establece en la siguiente parte de la entrada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915} La yihad no es válida sin el permiso de los padres musulmanes, o el permiso de uno de ellos cuando el otro es un incrédulo, a menos que la yihad se haya convertido en un deber individual, como cuando el enemigo ataca a un grupo de musulmanes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17916} Padres tomando de la propiedad del hijo. La mayoría sostiene que un padre puede tomar de la propiedad de su hijo solo en caso de necesidad. Los hanafíes distinguen: si están en una ciudad, un padre pobre puede comer sin pagar; si están en el desierto y sin comida, puede comer por su valor. Los hanbalíes permiten que un padre tome de la propiedad de su hijo lo que desee y la posea, si el padre está necesitado, bajo dos condiciones: no debe dañar al niño y no debe dar lo que toma a otro niño. Citan el dicho \"tú y tu propiedad pertenecen a tu padre\", y que Dios llama al hijo un regalo para el padre. Ibn Hani' registra la opinión de Ahmad de que un padre que toma de la propiedad de su hijo no es castigado como ladrón, y que una madre no puede dar de la propiedad de su hijo excepto con su permiso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17916}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17917} Khul' sobre la manutención o lactancia de un niño. Para un niño destetado, el khul' sobre su manutención es válido solo por un plazo fijo, ya que su manutención es de por vida. Para un lactante, el khul' sobre su lactancia y manutención es válido, y si no se fija un plazo, la madre lo amamanta durante dos años completos, según el versículo 'las madres amamantan a sus hijos dos años completos para quien desee completar la lactancia', y según el dicho 'no hay lactancia después del destete'. Si el esposo regresa, o la esposa o el niño mueren antes de que termine el plazo, el esposo recupera el saldo de la manutención según los Hanafis y Hanbalis; los Shafi'is no permiten el khul' sin un plazo fijo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17917}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17918} Khul' sobre la custodia del niño. Los Hanafis permiten el khul' y anulan la condición, ya que el derecho del niño es estar con su madre mientras la necesite. Los Malikis permiten un khul' sobre la custodia de la madre, y la custodia pasa entonces al padre, a menos que se tema algún daño o el corazón del niño esté apegado a la madre. Los Shafi'is sostienen que la custodia de la madre no termina cuando ella se casa con alguien que no es el padre del niño si el khul' fijó un plazo, ya que es un contrato vinculante. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17918}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919} La herencia del niño se establece entre el niño y sus padres bajo ciertas condiciones; el hijo ilegítimo se atribuye a su madre y hereda solo a través de ella; el hijo de li'an no hereda de quien lo desheredó, ya que su linaje es negado. Los detalles se establecen en sus lugares. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919} Un voto de sacrificar a un hijo. Los Hanafis: por analogía no se debe nada, pero por preferencia jurídica se debe una oveja, y para varios hijos una oveja por cada uno; esta es la opinión de Abu Hanifa y Muhammad y una narración Hanbali. Los Malikis dicen que no se debe nada; Los shafi'ís dicen que el voto es inválido, ya que no es un acto de devoción. En una narración de Ahmad sobre una mujer que juró sacrificar a sus hijos, ella sacrifica un carnero por cada hijo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919} El niño nacido muerto. Si el recién nacido llora o muestra signos de vida, se le considera vivo. Si nace muerto, es un niño en el sentido de que el período de espera termina con su nacimiento, y la sangre posterior es la sangre del parto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919} Las normas sobre el niño en su propio derecho, como su lavado, la oración fúnebre sobre él y su herencia y legados, se establecen bajo sus propios encabezados. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17920} Un padre que vende la propiedad de su hijo menor. Esto se permite por acuerdo en general, ya que se elimina la sospecha y un padre es más solícito que otro. Los hanafíes y shafi'ís permiten que el abuelo también lo haga, ya que tiene autoridad sobre la propiedad como lo hace el padre; los malikíes y hanbalíes lo niegan, ya que el abuelo no tiene autoridad sobre la propiedad del niño. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17920} Un agente que vende la propiedad de su principal al hijo del principal, o que compra para él. Los hanafíes, malikíes, shafi'ís y una narración hanbalí prohíben venderla a un niño menor de edad, ya que es como venderse a uno mismo y una persona no puede unirse a ambas partes de un contrato. Para un hijo adulto, los hanafíes, los shafi'ís en contra de la opinión más sólida y una narración hanbalí lo prohíben; los malikíes y Abu Yusuf y Muhammad lo permiten al valor; la opinión shafi'í más sólida lo permite; La segunda narración hanbalí lo permite bajo dos condiciones: que el agente supere la oferta en la subasta y que otro dirija la subasta. Los hanafíes lo permiten cuando la agencia se otorgó en términos generales. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17920}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17921} Que un padre compre para sí mismo de la propiedad de su hijo, o que le venda, está permitido por los juristas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17921} El padre recibe lo que compró de su hijo. Los hanafíes sostienen que un padre no se convierte en receptor por la sola venta, y no queda liberado del precio hasta que el juez designe un fideicomisario para que el hijo lo reciba de él y se lo devuelva como depósito. Los malikíes sostienen que cuando el dador y el receptor son una mano, la recepción ocurre por intención. Los hanbalíes permiten que el padre haga la oferta, acepte y reciba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17921}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17922} El derecho del niño a la represalia por un homicidio pertenece a todos los herederos del asesinado, jóvenes y ancianos, varones y mujeres, como se establece en represalia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17922} Matar a un niño. Un padre no puede matar a su hijo, en el versículo 'no matarás a tus hijos por temor a la pobreza' y en el dicho de que el pecado más grave es matar a un hijo por temor a que coma contigo. Si un padre mata a su hijo, la mayoría sostiene que no se le castiga, y un abuelo no se le castiga por su nieto; los malikíes distinguen: se le castiga si acuesta al niño y lo mata o le abre el vientre, y no si lo golpea con una espada o un palo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17922}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17923} Un hijo que mata a sus padres se castiga por cada padre, según la mayoría, por los textos generales y las razones: la necesidad de disuasión recae en el hijo, un padre ama a su hijo por el bien del hijo más que por el suyo propio, y el padre tiene mayor santidad que un extraño. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17923} El asesinato de un hijo por parte de un padre no conlleva represalia por parte de la mayoría, ya que su ofensa contra la vida del niño es nula; Ahmad en una narración dice que el hijo no es asesinado por su padre, porque el testimonio del padre a favor de su hijo no es aceptado. El asesinato de un padre o un hijo por parte de un bando justo o rebelde en el curso de la lucha, cuando la lucha lo requiere, no es punible; fuera de la necesidad de la lucha, sí lo es. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17924} El testimonio de un hijo a favor de un padre, o de un padre a favor de un hijo, no es admitido; el testimonio de uno a favor del otro sí es admitido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17924} La inclusión de padres e hijos en la 'aqila (los parientes que comparten el dinero de sangre): los malikíes, una visión hanafí y una visión hanbalí los incluyen; los shafiíes, otra visión hanafí y la segunda visión hanbalí no. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17924}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17925} Robo por parte de un padre de la propiedad de su hijo, y viceversa. La mayoría sostiene que un padre no es amputado por robar de la propiedad de su hijo, en los dichos 'tú y tu propiedad pertenecen a tu padre' y 'tus hijos son de tus ganancias', ya que los hudud se evitan por dudas. Abu Thawr e Ibn al-Mundhir amputan a un padre, según el texto aparente del versículo del robo. Para un hijo que roba a su padre, la mayoría no lo amputan, mientras que los Malikis, una narración Hanbali y al-Kharaqi lo amputan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17925}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17926} La calumnia de un padre contra su hijo. Los Hanafis, la escuela de los Malikis, los Shafi'is y los Hanbalis no castigan a un padre por calumniar a su hijo, por analogía con su falta de represalia por matarlo; los Shafi'is y los Hanafis lo disciplinan por abuso. Un padre que hereda una calumnia contra una mujer de su hijo no es castigado a menos que otros compartan el derecho. Una opinión malikí permite que el hijo reclame la pena por calumnia contra sus padres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17926} Bandidaje (hirabah) de un hijo contra su padre. Los hanafíes eliminan el hudud del bandidaje si el hijo de la víctima o un pariente ilegítimo es el bandido, ya que hay un permiso aparente para tomar propiedad en el hogar, y los hudud se evitan por dudas; los shafiíes y los hanbalíes están de acuerdo para un hijo que toma la propiedad de su padre como bandido. Un hijo que mata a su padre mediante bandidaje todavía es responsable de represalias. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17926}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17927} La cría de un sacrificio: algunos juristas exigen que se sacrifique con su madre, otros no; los detalles se encuentran en el apartado de sacrificio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17927} El cabrito que parece un perro: los hanafíes deciden su licitud mediante pruebas (beber, comer, si tiene intestinos o panza). Los shafiíes lo dejan por precaución a menos que su forma indique licitud. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17927}"
  fr: "Walad (enfant) désigne, en hébreu, un enfant né. Ce terme s'emploie pour un seul enfant ou plusieurs, petit ou grand, garçon ou fille. Ibn (fils), selon la définition d'al-Jurjani, est un fils né de la semence d'un autre fils du même sexe. La Mawsu'a précise que le fils est un homme, tandis que l'enfant (walad) peut être de sexe masculin ou féminin. Bint (fille) est le féminin d'ibn. Hafid (petit-enfant) désigne l'enfant d'un enfant. Sibt (petit-fils d'une fille, selon l'usage des lexicographes) est employé par les chaféites pour désigner l'enfant d'une fille, et par les hanbalites pour désigner les deux types de petits-enfants. Dhurriyya (descendants) désigne, dans l'usage majoritaire, les enfants, les filles et leurs enfants, bien que certains hanbalites excluent les enfants des filles. Nasl (descendance) a un sens plus large que walad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17905}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17906}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17907} L'enfant suit le parent le plus vertueux en matière de religion, selon l'avis unanime des juristes. Si l'un des époux est musulman, l'enfant l'est aussi; si l'un des parents se convertit et que l'enfant est jeune, il se convertit à l'islam avec lui, pour son propre bien. Les hanafites considèrent que si l'un des parents est un Gens du Livre et l'autre un mage, l'enfant est un Gens du Livre, le magisme étant considéré comme pire. Les hanafites exigent que, pour que l'enfant suive le parent le plus vertueux, les deux parents partagent le même domicile. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17907} L'enfant suit la religion de ses parents là où la règle de la filiation s'applique. Si l'enfant se trouve sur notre terre et le père dans un pays non croyant, l'enfant est considéré comme musulman par la loi; mais l'enfant ne suit pas un père qui est musulman tandis que lui-même se trouve dans un pays non croyant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17908} L'apostasie d'un garçon perspicace. Abu Yusuf, Zufar, al-Shafi'i et une opinion d'Ahmad estiment qu'elle n'est pas valable, car les paroles d'un garçon ne peuvent nuire. Abu Hanifa, Muhammad, les Malikites et l'opinion communément admise d'Ahmad la jugent valable, car l'islam repose sur la raison saine et non sur la puberté. Une fois son apostasie établie, les règles relatives à l'apostasie s'appliquent: il est déshérité, son épouse est séparée de lui, aucune prière funéraire n'est accomplie pour lui et il est contraint de se convertir à l'islam; toutefois, il n'est pas mis à mort, car la mise à mort est un châtiment qu'il ne serait pas capable de supporter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17908}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17909} À la naissance, l'appel à la prière est récité dans l'oreille droite du nouveau-né et la convocation dans l'oreille gauche. Lors de la prière funéraire pour un défunt, le père est cité en premier, suivi du fils, puis du petit-fils. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17909} Concernant la direction de la prière par le fils d'une union illégitime ou d'un rejet (li'an), les règles sont exposées dans des passages spécifiques. Les Hanbalites ne voient aucun inconvénient à l'imamat d'un enfant renié par un rejet (li'an) si sa religion est saine et qu'il est apte à diriger la prière; Aïcha a dit de l'enfant illégitime qu'il ne porte rien du péché de ses parents. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17909}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910} Par convention, la zakat ne peut être versée à son propre enfant, car les droits sur les biens sont communs entre eux. Une personne paie la zakat al-fitr pour elle-même et pour ceux à qui elle doit une pension alimentaire, y compris ses enfants. Il existe une différence quant au paiement du pèlerinage pour un enfant décédé ou né après l'apparition de cette obligation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910} Selon la majorité, un enfant peut accomplir le pèlerinage au nom de ses parents, conformément au témoignage de la femme de Khath'am qui avait demandé si elle pouvait le faire pour son père âgé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910} La filiation d'un enfant est établie par la naissance par sa mère et par le mariage par le père, la reconnaissance ou une preuve; elle ne s'éteint que par le li'an. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910} Concernant le sacrifice pour un enfant: si l'enfant est adulte, son père n'est pas tenu à cette obligation. Si l'enfant est mineur et sans propriété, les Hanafites rapportent d'al-Hasan, d'après Abu Hanifa, que le sacrifice est obligatoire. Une autre narration indique qu'il n'est pas obligatoire mais recommandé, et qu'il est effectué sur les fonds propres du père. Si l'enfant possède des biens, son père ou son exécuteur testamentaire effectue le sacrifice sur ces biens, selon Abu Hanifa et Abu Yusuf, contrairement à l'avis de Muhammad et Zufar. Les Malikites prescrivent comme sunna le sacrifice par les parents pour les parents pauvres et pour un jeune enfant jusqu'à sa puberté; les Chafi'ites l'autorisent uniquement pour le père et le grand-père, sur leurs propres fonds. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17911} L'aqiqa, l'animal sacrifié pour un nouveau-né en remerciement à Dieu, est une sunna pour les Chafi'ites et les Hanbalites, recommandée pour les Malikites et permise pour les Hanafites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17911} Parmi les règles qui lient l'enfant à ses parents figurent: la circoncision (l'ablation du prépuce chez le garçon et du méat urinaire chez la fille, obligatoire pour certains et sunna pour d'autres); le choix du nom; la garde; l'allaitement; l'entretien; l'éducation; la discipline; le devoir de l'enfant d'obéir à ses parents et de les honorer dans ce qui n'est pas un péché; la prière de l'enfant pour son père; l'interdiction pour un parent de maudire son enfant; la désapprobation hanafite qu'un fils appelle son père par son nom, et la recommandation shafi'ite qu'un enfant ne nomme pas son père. Ces règles sont exposées séparément. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17912}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17913} Préférence entre les enfants pour les cadeaux. Les hanafites, les malikites et les chaféites recommandent l'égalité; les hanbalites et Abou Yusuf la rendent obligatoire. Les hanafites ne blâment pas les préférences affectives, car l'affection relève du cœur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17913}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17914} Don d'un bien occupé. Les hanafites estiment qu'une maison encore occupée par les biens du donateur ne peut être donnée, tandis qu'une maison prêtée peut l'être; le père peut reprendre un don fait à son enfant, selon les malikites, les chaféites et l'école hanbalite, ce que les hanafites et une tradition hanbalite contestent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17914} Une dot pour ses enfants inclut, par accord mutuel, les enfants des deux sexes; quant à leurs propres enfants, l’interprétation fait débat. Dans un legs à des proches, les hanafites, selon leur avis général, n’incluent ni les parents ni les enfants; les hanbalites et une opinion chaféite les incluent; l’avis chaféite, plus solide, les exclut, mais inclut les grands-parents et les petits-enfants. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17914}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915} Il est sunna pour un enfant d’être juste dans ses legs à ses parents, et s’il a une préférence, al-Darimi recommande de privilégier la mère. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915} Autorisation des parents pour voyager. Les hanafites estiment que pour un voyage présentant un grand danger, l'enfant ne peut partir sans l'autorisation de ses parents; pour un voyage sans grand danger, il peut partir s'il ne les néglige pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915} Le jihad requiert la permission des parents, comme l'indique la suite de cet article. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915} Le jihad n'est pas valide sans l'autorisation des parents musulmans, ou sans l'autorisation de l'un d'eux si l'autre est non-musulman, sauf si le jihad est devenu un devoir individuel, par exemple lorsque l'ennemi attaque un groupe de musulmans. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17916} Les parents qui prennent sur les biens de leur enfant. La majorité des rabbins estiment qu'un père ne peut prendre sur les biens de son enfant qu'en cas de besoin. Les hanafites font une distinction: si la famille se trouve en ville, un père pauvre peut manger gratuitement; si, dans le désert, il manque de nourriture, il peut manger à sa juste valeur. Les hanbalites autorisent un père à prendre sur les biens de son enfant ce qu'il souhaite, et à en devenir propriétaire, s'il est dans le besoin, sous deux conditions: cela ne doit pas nuire à l'enfant, et il ne doit pas donner ce qu'il prend à un autre enfant. Ils citent le dicton « toi et tes biens appartiennent à ton père », et le fait que Dieu considère l'enfant comme un don fait au père. Ibn Hani rapporte l'avis d'Ahmad selon lequel un père qui prend sur les biens de son fils n'est pas puni comme un voleur, et qu'une mère ne peut donner sur les biens de son fils sans son autorisation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17916}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17917} Le khul' (retrait) de la pension alimentaire d'un enfant est valable pour une durée déterminée, car cette pension lui est due toute sa vie. Pour un enfant allaité, le khul' (retrait) de l'allaitement est valable. Si aucune durée n'est fixée, la mère allaite l'enfant pendant deux ans, conformément au verset « les mères allaitent leurs enfants deux ans, à qui veut bien les allaiter » et au dicton « il n'y a plus d'allaitement après le sevrage ». Si le mari revient, ou si la femme ou l'enfant décède avant la fin de la période de retraite, le mari recouvre le solde de la pension alimentaire selon les écoles hanafite et hanbalite; l'école shafi'ite n'autorise pas le khul' sans durée fixée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17917}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17918} Le khul' relatif à la garde de l'enfant. Les Hanafites autorisent le khul' et annulent la condition, considérant que l'enfant a le droit d'être avec sa mère tant qu'il en a besoin. Les Malikites autorisent le khul' relatif à la garde de la mère, et la garde est alors confiée au père, sauf si l'on craint un préjudice ou si l'enfant est profondément attaché à sa mère. Les Shafi'ites estiment que la garde de la mère ne prend pas fin si elle se remarie avec un autre homme que le père de l'enfant si le khul' a fixé une durée, car il s'agit d'un engagement contractuel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17918}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919} L'héritage de l'enfant est établi entre lui et ses parents sous certaines conditions; l'enfant né hors mariage est rattaché à sa mère et n'hérite que par elle; l'enfant né d'un li'an n'hérite pas de celui qui l'a renié, puisque sa filiation est contestée. Les détails sont exposés en leur lieu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919} Un vœu d'immoler son enfant. Les Hanafites: par analogie, rien n'est dû, mais par préférence juridique, un mouton est dû, et pour plusieurs enfants, un mouton pour chacun; c'est l'avis d'Abu Hanifa et de Muhammad, ainsi que d'une narration hanbalite. Les Malikites disent qu'aucun dû; Les chaféites affirment que ce vœu est invalide, car il ne constitue pas un acte de dévotion. Selon un hadith rapporté par Ahmad, une femme ayant fait vœu d'immoler ses enfants sacrifia un bélier pour chacun d'eux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919} L'enfant mort-né. Si le nouveau-né pleure ou montre des signes de vie, il est considéré comme vivant. S'il est mort-né, il est considéré comme un enfant en ce sens que la période d'attente prend fin avec sa naissance, et le sang versé ensuite est celui de l'accouchement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919} Les règles concernant l'enfant en tant que tel, telles que ses ablutions, la prière funéraire pour lui, son héritage et ses legs, sont exposées dans des sections spécifiques. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17920} Un père vendant les biens de son enfant mineur. Ceci est généralement autorisé par accord mutuel, car le soupçon est levé et un père est plus attentionné qu'un autre. Les écoles hanafite et chaféite l'autorisent également, car il détient l'autorité sur les biens au même titre que le père; les écoles malikite et hanbalite le refusent, car le grand-père n'a aucune autorité sur les biens de l'enfant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17920} Un mandataire vendant un bien de son mandant à l'enfant de ce dernier, ou l'achetant pour son compte. Les écoles hanafite, malikite, chaféite et une narration hanbalite interdisent la vente à un enfant mineur, car cela équivaut à se vendre à soi-même et une seule personne ne peut être à la fois partie et partie d'un contrat. Pour un enfant majeur, les écoles hanafite, chaféite (à l'inverse de l'avis le plus solide) et une narration hanbalite l'interdisent; les écoles malikite, Abou Yusuf et Muhammad l'autorisent à la valeur du bien; l'avis chaféite le plus solide l'autorise également. La seconde narration hanbalite l'autorise sous deux conditions: que l'agent surenchérisse lors de la vente aux enchères et qu'une autre personne dirige cette dernière. Les hanafites l'autorisent lorsque le mandat a été donné en termes généraux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17920}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17921} Les juristes autorisent un père à acheter pour lui-même un bien appartenant à son enfant, ou à lui en vendre un. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17921} Le père reçoit ce qu'il a acheté à son enfant. Les hanafites estiment que le père ne devient pas le bénéficiaire de la seule vente et n'est libéré de son obligation de payer le prix que lorsque le juge désigne un administrateur pour que l'enfant reçoive le bien et le lui restitue à titre de dépôt. Les Malikites considèrent que lorsque le donateur et le bénéficiaire sont une seule et même personne, la réception est intentionnelle. Les Hanbalites autorisent le père à faire l'offre, à l'accepter et à la recevoir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17921}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17922} Le droit de l'enfant à la vengeance pour un meurtre appartient à tous les héritiers de la victime, jeunes et vieux, hommes et femmes, comme indiqué dans la section relative à la vengeance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17922} Tuer un enfant. Un parent ne peut tuer son enfant, conformément au verset « Ne tuez pas vos enfants par crainte de la pauvreté » et à l'adage selon lequel le péché le plus grave est de tuer son enfant par crainte qu'il mange avec vous. Si un père tue son enfant, la majorité considère qu'il n'est pas puni de représailles, et un grand-père n'est pas puni de représailles pour le meurtre de son petit-fils; les Malikites font une distinction: il y a représailles s'il allonge l'enfant et l'égorge ou lui fend le ventre, mais non s'il le frappe avec une épée ou un bâton. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17922}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17923} Un enfant qui tue ses parents est puni de représailles pour chacun d'eux, selon la majorité, en vertu des textes généraux et pour les raisons suivantes: la nécessité de dissuasion incombe à l'enfant, un parent aime son enfant pour lui-même plutôt que pour son propre intérêt, et le père a une plus grande sainteté qu'un étranger. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17923} Le meurtre d'un enfant par un père n'entraîne pas de représailles de la part de la majorité, car son acte contre la vie de l'enfant est nul. Ahmad rapporte dans une narration que le fils n'est pas tué pour son père, car le témoignage du père en faveur de son fils n'est pas recevable. Le meurtre d'un parent ou d'un enfant par un parti juste ou rebelle au cours d'un combat, lorsque celui-ci l'exige, n'est pas passible de poursuites; en dehors de toute nécessité de combat, il l'est. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17924} Le témoignage d'un enfant en faveur d'un parent, ou d'un parent en faveur d'un enfant, n'est pas admis; le témoignage de l'un en faveur de l'autre est admis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17924} L'inclusion des parents et des enfants dans l''aqila (les proches qui partagent le prix du sang): les Malikites, une opinion hanafite et une opinion hanbalite les incluent; les Chafisites, une autre opinion hanafite et la seconde opinion hanbalite ne les incluent pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17924}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17925} Le vol commis par un parent sur les biens de son enfant, et inversement. La majorité considère qu'un parent n'est pas amputé pour avoir volé sur les biens de son enfant, en se basant sur les dictons « toi et tes biens appartiennent à ton père » et « tes enfants sont issus de tes revenus », car les hudud sont évités par le doute. Abou Thawr et Ibn al-Mundhir préconisent l'amputation du père, se fondant sur le texte apparent du verset relatif au vol. Concernant l'enfant qui vole son parent, la majorité des rabbins ne le punissent pas, contrairement aux Malikites, à une narration hanbalite et à al-Kharaqi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17925}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17926} Quant à la calomnie d'un enfant par un parent, les Hanafites, l'école malikite, les Chafi'ites et les Hanbalites ne la punissent pas, par analogie avec l'absence de représailles suite à un meurtre; les Chafi'ites et les Hanafites la sanctionnent en cas de mauvais traitements. Un parent qui hérite d'une calomnie contre une femme transmise par son enfant n'est pas puni, sauf si d'autres personnes partagent ce droit. Selon une opinion malikite, le fils peut réclamer la peine pour calomnie contre ses parents. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17926} Le brigandage (hiraba) commis par un enfant contre son parent est punissable. Les hanafites lèvent la peine de brigandage (hudud) si l'auteur du brigandage est l'enfant de la victime ou un parent illégitime, car il y a une permission apparente de s'emparer des biens du foyer, et les doutes écartent la peine; les chaféites et les hanbalites s'accordent sur le cas d'un enfant qui s'empare des biens de son père en tant que brigand. Un enfant qui tue son père par brigandage reste passible de représailles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17926}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17927} Le petit d'un sacrifice: certains juristes exigent qu'il soit immolé avec sa mère, d'autres non; voir les détails à l'article « sacrifice ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17927} Le chevreau d'une chèvre qui ressemble à un chien: les hanafites déterminent sa licéité par des tests (boire, manger, présence d'intestins ou de ventre). Les chaféites laissent la question en suspens par prudence, à moins que son apparence ne soit un signe de licéité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17927}"
  ur: "ولاد ⁦(ایک بچہ)⁩ زبان میں پیدا ہونے والا ہے۔ یہ ایک یا کئی کے لیے، چھوٹے یا بڑے بچے کے لیے، اور مرد یا عورت کے لیے استعمال ہوتا ہے۔ ابن ⁦(ایک بیٹا)⁩، الجرجانی کی تعریف میں، اپنی قسم کے کسی اور بیج سے پیدا ہونے والا نر ہے، اور موصوف نے نوٹ کیا ہے کہ بیٹا مرد ہے جبکہ بچہ ⁦(والد)⁩ یا تو جنس ہو سکتا ہے۔ بنت ⁦(ایک بیٹی)⁩ ابن کی نسائی ہے۔ حفید ⁦(ایک پوتا)⁩ ایک بچے کا بچہ ہے۔ سبط ⁦(ایک بیٹی کی طرف سے ایک پوتا، لغت نگاروں کے استعمال میں)⁩ شافعیوں نے بیٹی کے بچے پر لاگو کیا ہے، اور حنبلیوں کے ذریعہ دونوں قسم کے پوتے پر۔ ظھریہ ⁦(اولاد)⁩ کا مطلب اکثر کے استعمال میں اولاد، بیٹیاں اور ان کی اولاد ہے، جبکہ بعض حنبلی بیٹیوں کے بچوں کو خارج کرتے ہیں۔ نسل ⁦(اولاد)⁩ ولاد سے زیادہ وسیع ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ17905}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ17906}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ17907} بچہ اپنے والدین کے موافق مذہب کے مطابق بہتر طریقے سے پیروی کرتا ہے۔ اگر میاں بیوی میں سے ایک مسلمان ہے تو بچہ مسلمان ہے۔ اگر والدین میں سے کوئی ایک مذہب تبدیل کرتا ہے اور بچہ جوان ہے تو بچہ اس کے ساتھ مسلمان ہو جاتا ہے، بچے کے فائدے کے لیے۔ احناف کا خیال ہے کہ اگر والدین میں سے ایک اہل کتاب اور دوسرا مجوسی ہو تو بچہ اہل کتاب ہے، کیونکہ جادوگری بدتر ہے۔ احناف کا تقاضا ہے کہ بچے کے لیے بہتر والدین کی پیروی کی جائے کہ دونوں ایک ہی گھر میں شریک ہوں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17907} بچہ اپنے والدین کے مذہب کی پیروی کرتا ہے جہاں پیروی کا قاعدہ لاگو ہوتا ہے۔ اگر بچہ ہماری سرزمین میں ہو اور باپ کفر کے گھر میں ہو تو بچے کو حکم کے ذریعے مسلمان سمجھا جاتا ہے۔ لیکن بچہ ایسے باپ کی پیروی نہیں کرتا جو اسلام کے گھر میں ہو اور بچہ کفر کے گھر میں ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17908} سمجھدار لڑکے کا ارتداد۔ ابو یوسف، ظفر، شافعی اور احمد کا قول ہے کہ یہ صحیح نہیں ہے، کیونکہ لڑکے کی بات سے کوئی نقصان نہیں ہوتا۔ ابوحنیفہ، محمد، مالکیہ اور احمد کا معروف قول اسے صحیح قرار دیتا ہے، کیونکہ اسلام کا دارومدار عقل پر ہے، بلوغت پر نہیں۔ ایک بار جب اس کا ارتداد قائم ہو جاتا ہے، تو ارتداد کے احکام لاگو ہوتے ہیں: وہ کسی جائیداد کا وارث یا منتقلی نہیں کرتا، اس کی بیوی اس سے جدا ہو جاتی ہے، اس پر نماز جنازہ نہیں پڑھی جاتی، اور اسے اسلام کی طرف لوٹنے پر مجبور کیا جاتا ہے۔ لیکن اسے قتل نہیں کیا جائے گا، کیونکہ قتل ایک سزا ہے اور وہ اسے برداشت کرنے کے قابل نہیں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17908}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17909} پیدائش کے وقت نوزائیدہ کے دائیں کان میں اذان اور بائیں طرف اذان دی جاتی ہے۔ مرنے والے کی نماز جنازہ میں پہلے باپ آتا ہے، پھر بیٹا، پھر بیٹے کا بیٹا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17909} ناجائز ملن یا لعان کے بیٹے کی طرف سے نماز کی امامت کرنے پر احکام اپنی اپنی جگہ پر متعین ہیں۔ حنبلی اس بچے کی امامت میں کوئی حرج نہیں دیکھتے جو لعان سے انکاری ہو اگر اس کا مذہب صحیح ہو اور وہ امامت کے لائق ہو۔ عائشہ ا نے ناجائز بچے کے بارے میں کہا کہ وہ اپنے والدین کے گناہ کا بوجھ نہیں اٹھاتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17909}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910} معاہدے کے مطابق، زکوٰۃ کسی کے اپنے بچے کو نہیں دی جا سکتی، کیونکہ جائیداد کے فوائد دونوں کے درمیان مل جاتے ہیں۔ ایک شخص اپنے لیے اور ان لوگوں کے لیے جن کا کفالت واجب ہے، بشمول اس کے بچوں کے لیے فطرانہ ادا کرتا ہے۔ فرض ہونے کے بعد مرنے والے یا پیدا ہونے والے بچے کی ادائیگی میں فرق ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17910} اکثریت کے اعتبار سے، بچہ اپنے والدین کی طرف سے حج کر سکتا ہے، خثعم کی عورت کی رپورٹ پر جس نے پوچھا کہ کیا وہ اپنے بوڑھے باپ کے لیے حج کر سکتی ہے؟ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17910} بچے کا نسب پیدائش کے اعتبار سے ماں سے اور باپ سے نکاح، اقرار یا ثبوت سے قائم ہوتا ہے۔ یہ صرف لیان سے ختم ہوتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17910} بچے کی قربانی: اگر بچہ بڑا ہو جائے تو اس کے والد پر واجب نہیں ہے۔ اگر مال کے بغیر نابالغ ہے تو احناف نے امام حسن سے ابو حنیفہ سے روایت کیا ہے کہ واجب ہے اور دوسری روایت میں ہے کہ واجب نہیں ہے بلکہ باپ کے پیسے سے مستحب ہے۔ اگر نابالغ کے پاس جائیداد ہو تو اس کا باپ یا وصی اس میں سے قربانی کرے، ابو حنیفہ اور ابو یوسف کے نزدیک محمد اور زفر کے خلاف۔ مالکیوں نے والدین کے لیے غریب والدین اور چھوٹے بچے کے لیے قربانی کرنا سنت قرار دیا ہے جب تک کہ لڑکا بلوغت کو نہ پہنچ جائے۔ شافعی اپنے پیسے سے صرف باپ اور دادا کے لیے اجازت دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17910}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17911} عقیقہ، خدا کے شکر میں نومولود کے لیے ذبح کیا جانے والا جانور، مالکیہ اور حنبلی حضرات کے لیے سنت ہے، اور تابعین کے نزدیک مستحب ہے۔ حنفیہ۔ {حوالہ: فقہ الموسوعۃ النور-v3 ص17911} جو احکام بچے کو اس کے والدین کے ساتھ باندھتے ہیں ان میں سے یہ ہیں: ختنہ ⁦(مرد کی چمڑی اور عورت کی جھلی کاٹنا، بعض کے لیے واجب اور بعض کے لیے سنت)⁩؛ نام دینا تحویل دودھ پلانے والی دیکھ بھال تعلیم نظم و ضبط بچے کا فرض ہے کہ وہ اپنے والدین کی اطاعت کرے اور ان کی عزت کرے جو گناہ نہیں ہے۔ اپنے باپ کے لیے بچے کی دعا؛ اپنے بچے پر والدین کی لعنت کی ممانعت؛ حنفی اس بات کو ناپسند کرتے ہیں کہ بیٹا اپنے باپ کو اس کے نام سے پکارے، اور شافعی کی سفارش ہے کہ بچہ اپنے باپ کا نام نہ رکھے۔ یہ اپنی اپنی جگہ پر مرتب ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17912}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17913} تحائف میں بچوں میں ترجیح۔ حنفیہ، مالکی اور شافعی برابری کی تجویز کرتے ہیں۔ حنبلی اور ابو یوسف نے اسے واجب قرار دیا ہے۔ حنفیہ کے نزدیک محبت میں ترجیح کو قصوروار نہیں ٹھہرایا جاتا کیونکہ محبت دل کا عمل ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17913}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17914} زیر قبضہ چیز کا تحفہ۔ احناف کا خیال ہے کہ جس گھر میں ابھی بھی عطیہ دینے والے کا سامان ہے وہ نہیں دیا جا سکتا، جبکہ کرایہ کا مکان دیا جا سکتا ہے۔ مالکیوں، شافعیوں اور حنبلیوں کے مکتبہ فکر کے مطابق باپ اپنے بچے کو تحفہ واپس لے سکتا ہے، جس کا حنفیہ اور حنبلی روایت انکار کرتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17914} کسی کے بچوں کے وقف میں دونوں جنسوں کے بچے بھی شامل ہیں اور ان کے بچے فرق کا معاملہ ہیں۔ رشتہ داروں کے لیے وصیت میں حنفیہ ظاہری طور پر والدین یا اولاد کو شامل نہیں کرتے۔ حنبلی اور ایک شافعی کا قول ان میں شامل ہے۔ شافعی کا نظریہ ان کو خارج کرتا ہے لیکن ان میں دادا دادی اور پوتے شامل ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17914}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915} بچے کے لیے یہ سنت ہے کہ وہ اپنے والدین کے تحفے میں صرف ہو، اور اگر وہ کسی کو ترجیح دے تو الدارمی کہتے ہیں کہ اسے ماں کو ترجیح دینی چاہیے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17915} سفر کے لیے والدین کی رخصت۔ احناف کا خیال ہے کہ جس سفر میں خطرہ بہت زیادہ ہو، بچہ اپنے والدین کی رخصت کے بغیر نہیں جا سکتا۔ بغیر کسی خطرے کے سفر کے لیے وہ جا سکتا ہے اگر وہ ان کو نظرانداز نہ کرے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17915} جہاد کے لیے والدین کی اجازت درکار ہوتی ہے، جیسا کہ اندراج کا اگلا حصہ بیان کیا گیا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17915} مسلمان والدین کی اجازت کے بغیر یا ان میں سے ایک کی رخصت کے بغیر جہاد درست نہیں جب کہ دوسرا کافر ہو، جب تک کہ جہاد انفرادی فریضہ نہ بن جائے جیسا کہ دشمن مسلمانوں کے کسی گروہ پر حملہ کرتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17916} والدین کا بچے کے مال سے لینا۔ اکثریت کا خیال ہے کہ ایک باپ اپنے بچے کی جائیداد سے صرف ضرورت مند لے سکتا ہے۔ حنفیہ فرق کرتے ہیں: اگر وہ کسی شہر میں ہوں تو غریب باپ بغیر معاوضہ کھا سکتا ہے۔ اگر ریگستان میں اور کھانے کے بغیر، وہ اس کی قیمت پر کھا سکتا ہے۔ حنبلی والد کو اجازت دیتے ہیں کہ وہ اپنے بچے کے مال میں سے جو چاہے لے لے اور اگر باپ کو ضرورت ہو تو دو شرطوں پر اس کا مالک بننا چاہیے: اس سے بچے کو کوئی نقصان نہیں پہنچانا چاہیے اور نہ ہی وہ دوسرے بچے کو دینا چاہیے۔ وہ اس قول کا حوالہ دیتے ہیں کہ 'آپ اور آپ کی جائیداد آپ کے والد کی ہے'، اور یہ کہ خدا بچے کو باپ کے لیے تحفہ قرار دیتا ہے۔ ابن ہانی نے احمد کا یہ قول نقل کیا ہے کہ جو باپ اپنے بیٹے کا مال لیتا ہے اسے چور کی سزا نہیں دی جاتی اور یہ کہ ماں اپنے بیٹے کے مال میں سے اس کی رخصت کے بغیر نہیں دے سکتی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17916}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17917} بچے کی پرورش یا دودھ پلانے پر خلع۔ دودھ چھڑانے والے بچے کے لیے، اس کے نفقہ پر خلع صرف ایک معینہ مدت کے لیے جائز ہے، کیونکہ اس کی نفقہ اس کی پوری زندگی کے لیے ہے۔ دودھ پلانے کے لیے اس کے دودھ پلانے اور نفقہ پر خلع صحیح ہے، اور اگر کوئی مدت مقرر نہ ہو تو ماں اسے پورے دو سال دودھ پلاتی ہے، اس آیت پر 'مائیں اپنے بچوں کو پورے دو سال دودھ پلاتی ہیں جو کوئی دودھ پلانا چاہے' اور اس قول پر 'دودھ چھڑانے کے بعد دودھ نہیں پلاتا'۔ اگر شوہر واپس آجائے، یا بیوی یا بچہ مدت پوری ہونے سے پہلے فوت ہو جائے، تو حنفیہ اور حنبلیوں کے مطابق شوہر سے نفقہ کا توازن بحال ہو جائے گا۔ شافعی بغیر معینہ مدت کے خلع کی اجازت نہیں دیتے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17917}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17918} بچے کی حفاظت پر خلع۔ حنفیہ خلع کی اجازت دیتے ہیں اور شرط کو باطل کرتے ہیں، کیونکہ بچے کا حق یہ ہے کہ وہ اپنی ماں کے ساتھ اس کی ضرورت کے وقت رہے۔ مالکی ماں کی تحویل میں خلع کی اجازت دیتے ہیں، اور اس کے بعد اس کی تحویل والد کے سپرد کردی جاتی ہے، الا یہ کہ کسی نقصان کا اندیشہ ہو یا بچے کا دل ماں سے لگا ہوا ہو۔ شافعیوں کا خیال ہے کہ اگر خلع نے ایک مدت مقرر کی ہو تو اس کے بچے کے باپ کے علاوہ کسی اور سے شادی کرنے سے ماں کی تحویل ختم نہیں ہوتی، کیونکہ یہ ایک واجب الادا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17918}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919} بچے کی وراثت بچے اور اس کے والدین کے درمیان شرائط پر قائم ہوتی ہے۔ ناجائز بچہ اپنی ماں سے منسوب ہوتا ہے اور صرف اس کے ذریعے وراثت پاتا ہے۔ لعان کا بچہ اس سے وراثت میں نہیں آتا جس نے اس سے انکار کیا، کیونکہ اس کا نسب منکر ہے۔ تفصیلات اپنی جگہ پر بیان کی گئی ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17919} بچے کو ذبح کرنے کی نذر۔ حنفیہ: قیاس کے اعتبار سے کوئی چیز واجب نہیں ہے، لیکن فقہی ترجیح کے لحاظ سے ایک بھیڑ واجب ہے، اور کئی بچوں کے لیے ہر ایک کے بدلے ایک بکری۔ یہ ابو حنیفہ اور محمد اور ایک حنبلی روایت ہے۔ مالکی کہتے ہیں کہ کچھ واجب نہیں ہے۔ شافعی کہتے ہیں کہ نذر باطل ہے کیونکہ یہ عبادت نہیں ہے۔ ایک عورت کے بارے میں احمد کی روایت ہے جس نے اپنے بچوں کو ذبح کرنے کی نذر مانی تھی، وہ ہر بچے کے لیے ایک مینڈھا قربان کرتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17919} مردہ پیدا ہونے والا بچہ۔ اگر نوزائیدہ روتا ہے یا زندگی کے آثار دکھاتا ہے، تو اسے زندہ سمجھا جاتا ہے۔ اگر وہ مردہ پیدا ہوا ہے تو وہ اس لحاظ سے بچہ ہے کہ اس کی پیدائش کے ساتھ ہی عدت ختم ہو جاتی ہے اور اس کے بعد خون ولادت کا خون ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17919} بچے کے بارے میں اس کے اپنے احکام جیسے اس کا غسل، اس کی نماز جنازہ اور اس کی وراثت اور وصیتیں ان کے اپنے عنوانات میں بیان کی گئی ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17920} ایک باپ اپنے نابالغ بچے کی جائیداد بیچ رہا ہے۔ عام طور پر معاہدے کے ذریعے اس کی اجازت دی جاتی ہے، کیونکہ شبہ کو دور کر دیا جاتا ہے اور ایک باپ دوسرے سے زیادہ پرجوش ہوتا ہے۔ حنفیہ اور شافعی دادا کو بھی اس کی اجازت دیتے ہیں، کیونکہ وہ جائیداد پر باپ کی طرح اختیار رکھتے ہیں۔ مالکیہ اور حنبلی اس کا انکار کرتے ہیں، کیونکہ دادا کو بچے کی جائیداد پر کوئی اختیار نہیں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17920} ایک ایجنٹ جو اپنے پرنسپل کی جائیداد پرنسپل کے بچے کو بیچ رہا ہے، یا اس کے لیے خرید رہا ہے۔ حنفیہ، مالکیہ، شافعی اور ایک حنبلی روایت میں اسے نابالغ بچے کو فروخت کرنے سے منع کیا گیا ہے، کیونکہ یہ اپنے آپ کو بیچنے کے مترادف ہے اور ایک شخص عقد کے دونوں فریقوں میں شامل نہیں ہو سکتا۔ بالغ بچے کے لیے، حنفیہ، شافعی اس قول کے مخالف ہیں اور حنبلی روایت اس سے منع کرتی ہے۔ مالکی اور ابو یوسف اور محمد اس کی اجازت دیتے ہیں۔ شافعی کا قول اس کی اجازت دیتا ہے۔ دوسری حنبلی روایت دو شرطوں پر اس کی اجازت دیتی ہے، ایک ایجنٹ نیلامی میں آگے نکلتا ہے اور دوسرا نیلامی کرتا ہے۔ احناف اس کی اجازت دیتے ہیں جب ایجنسی کو عام شرائط میں دیا گیا ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17920}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17921} باپ کا اپنے بچے کی جائیداد سے اپنے لیے خریدنا یا اسے بیچنا فقہاء کے نزدیک جائز ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17921} باپ کی رسید جو اس نے اپنے بچے سے خریدی تھی۔ احناف کا خیال ہے کہ باپ اکیلے فروخت سے وصول کنندہ نہیں بنتا، اور اس وقت تک قیمت سے بری نہیں ہوتا جب تک کہ جج بچے کے لیے ایک ٹرسٹی مقرر نہ کرے جو اس سے وصول کرے اور اسے بطور امانت واپس کرے۔ مالکیوں کا خیال ہے کہ جہاں دینے والا اور لینے والا ایک ہاتھ ہو وہاں وصولی نیت سے ہوتی ہے۔ حنبلی والد کو پیشکش کرنے، قبول کرنے اور قبول کرنے کی اجازت دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17921}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17922} قتل کا بدلہ لینے کا بچے کا حق مقتول کے تمام ورثاء کا ہے، جوان اور بوڑھے، مرد و عورت، مرد اور عورت سب کا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17922} بچے کو قتل کرنا۔ ماں باپ اپنے بچے کو قتل نہیں کر سکتے، آیت ''غربت کے خوف سے اپنے بچوں کو قتل نہ کرو'' اور اس قول پر کہ سب سے بڑا گناہ یہ ہے کہ کسی کے بچے کو اس خوف سے قتل کر دیا جائے کہ وہ تمہارے ساتھ کھائے گا۔ اگر کوئی باپ اپنے بچے کو مارتا ہے، تو اکثریت کا خیال ہے کہ اس سے بدلہ نہیں لیا جاتا، اور دادا سے اس کے پوتے کا بدلہ نہیں لیا جاتا۔ مالکی فرق کرتے ہیں: اگر وہ بچے کو لٹا کر ذبح کردے یا اس کا پیٹ پھاڑ دے تو اس سے بدلہ لیا جاتا ہے، اور اگر وہ اسے تلوار یا لاٹھی سے مارتا ہے تو اس سے بدلہ لیا جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17922}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17923} جو بچہ اپنے والدین کو قتل کرتا ہے اس کا بدلہ ہر والدین سے لیا جاتا ہے، اکثریت کے مطابق، عام نصوص اور اسباب کے مطابق: بچے کو اس کی محبت کی ضرورت ہے۔ بچے کے لیے اپنی ذات کی بجائے اپنے لیے اور باپ کی حرمت اجنبی سے زیادہ ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17923} ایک باپ کا اپنے بچے کو قتل کرنے پر اکثریت کی طرف سے کوئی انتقام نہیں لیا جاتا، کیونکہ بچے کی جان کے خلاف اس کا جرم باطل ہے۔ احمد نے ایک روایت میں کہا ہے کہ بیٹا اپنے باپ کے لیے نہیں مارا جاتا، کیونکہ باپ کی اپنے بیٹے کے لیے گواہی قبول نہیں ہوتی۔ لڑائی کے دوران عادل یا باغی فریق کی طرف سے والدین یا بچے کا قتل، جہاں لڑائی کی ضرورت ہو، ذمہ دار نہیں ہے۔ لڑائی کی ضرورت سے باہر، یہ ذمہ دار ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17924} والدین کے لیے بچے کی گواہی، یا بچے کے لیے والدین کی گواہی قبول نہیں کی جاتی۔ ایک کی گواہی دوسرے کے لیے تسلیم کی جاتی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17924} عقیلہ میں والدین اور اولاد کو شامل کرنا: مالکیہ، حنفی اور ایک حنبلی مسلک ان میں شامل ہے۔ شافعیوں کا، ایک اور حنفی کا اور دوسرا حنبلی کا قول نہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17924}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17925} والدین کی طرف سے اپنے بچے کی جائیداد سے چوری، اور الٹا۔ جمہور کا خیال ہے کہ 'تم اور تمہاری جائیداد تمہارے باپ کی ہے' اور 'تمہاری اولاد تمہاری کمائی سے ہے' کے اقوال پر ماں باپ کو اپنے بچے کی جائیداد سے چوری کرنے پر کاٹ نہیں دیا جاتا، کیونکہ ہدد شک سے بچاتا ہے۔ ابو ثور اور ابن المنذر نے چوری کی آیت کے ظاہری متن کے مطابق باپ کا کاٹ دیا۔ اگر کوئی بچہ اپنے والدین سے چوری کرتا ہے، تو جمہور اس کا کاٹ نہیں کرتے، جب کہ مالکیہ، حنبلی روایت اور الخراقی اسے کاٹ دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17925}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17926} والدین کا اپنے بچے پر بہتان۔ حنفیہ، مالکیوں، شافعیوں اور حنبلیوں کا مکتب، والدین کو اپنے بچے کی غیبت کرنے پر سزا نہیں دیتے، اس کے قتل کے بدلے میں نہ لینے کے مترادف ہے۔ شافعی اور احناف اسے بدسلوکی کے لیے تادیب کرتے ہیں۔ ایک ماں باپ جو اپنے بچے کی طرف سے کسی عورت پر بہتان لگاتا ہے اسے سزا نہیں ملتی جب تک کہ دوسرے حق میں شریک نہ ہوں۔ ایک مالکی نظریہ بیٹے کو اجازت دیتا ہے کہ وہ اپنے والدین کے خلاف تہمت کی سزا کا دعوی کرے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17926} ایک بچے کا اپنے والدین کے خلاف بریگینڈیج ⁦(حیرابہ)⁩۔ احناف اگر مقتول کا بچہ یا کوئی غیر قانونی رشتہ دار لٹیرا ہو تو غارت گری کی حد کو ختم کر دیتے ہیں، کیونکہ گھر میں جائیداد لینے کی ظاہری اجازت ہے، اور حدد شک سے ٹل جاتا ہے۔ شافعی اور حنبلی اس بچے کے حق میں متفق ہیں جو اپنے باپ کی جائداد کو چور کے طور پر لیتا ہے۔ ایک بچہ جو اپنے باپ کو بریگینڈیج سے مارتا ہے وہ اب بھی انتقامی کارروائی کا ذمہ دار ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17926}{cite:fiqh-Mawsua-kuwaitiyya-noor-v3 p.17927} قربانی کا بچہ: بعض فقہاء اس کی ماں کے ساتھ ذبح کرنے کا مطالبہ کرتے ہیں، بعض نہیں کرتے۔ تفصیلات قربانی کے تحت ہیں. بکری کا بچہ جو کتے کی طرح نظر آتا ہے: احناف اس کے حلال ہونے کا فیصلہ کرتے ہیں ⁦(پینے، کھانے، چاہے اس کی آنتیں ہوں یا مسواک)⁩۔ شافعی احتیاط کے طور پر اسے چھوڑ دیتے ہیں جب تک کہ اس کی شکل حلال نہ ہو۔ {حوالہ: فقہ موسوعۃ کویتیہ نور v3 ص17927}"
  tr: "Dilde 'erkek' 'maulad' (doğmuş) anlamına gelir ve tekil, çoğul, genç, yaşlı, erkek ve dişi anlamına gelir. Al-Jurjani'ye göre, 'oğul' kendi türünden bir kişinin sperminden doğan erkek hayvandır. Oğlu erkek, oğlu erkek ve dişi olarak belirtir; kız oğlun dişil formudur; torun erkeğin oğludur; torun oğlun oğludur; ve dilbilimcilere göre kız; Şafiiler arasında ise kızın oğluna özgüdür; Hanbalilerde ise her ikisine atıfta bulunur; 'yavru' ise çoğunluk tarafından oğullar, kızlar ve onların çocukları için kullanılır. Hanbaliler arasında çocuklar oğulların en yaygın olanıdır. {alıntı:] fiqh-mawsua-kuwaitiyya-noor-v3 s.17905} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17906} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17907} Çocuk, hukukçuların uzlaştığına göre iki ebeveynin en iyisini dini olarak takip eder. Eşlerden biri Müslüman ise, çocuk Müslümandır, ancak bir ebeveyn Müslüman olur ve küçük bir çocuğu olursa, çocuk çocuk sayesinde Müslüman olur. Hanefilere göre, biri Kitapçı, diğeri Magian ise, çocuk Kitap'tır, çünkü Zerdüştler kötüdür. Bir çocuğun en iyi ebeveynlerle ilişkilendirilebilmesi için evin birliği gereklidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17907} Çocuk, dinde ebeveynlerini takip eder ve bağımlılık hükmü ya din ya da İslam evidir. Eğer küçük çocuk bizim evimizdeyse ve baba inançsızlık diyarındaysa, Müslümanlar üzerinde bir hüküm sayılır; baba İslam diyarındaysa, çocuk ise inandırıcılık evindeyse baba takip edilmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17908} Seçkin çocuğun dinden dönmesi. Abu Yusuf, Zafar, Al-Shafi'i ve Ahmed'den bir söz bunların geçerli olmadığını çünkü çocuğun sözlerinin zararlı (zararlı) olarak görülmediğini söyler; Abu Hanifa, Muhammed, Malikiler ve Ahmed'in ünlü rivayeti onlara göre yargılar, çünkü İslam ergenliğe ulaşmadan önce aklın mükemmelliğiyle ilgilenir. Eğer dinden dönmesi kanıtlanırsa, dinden dönme hükümleri ona uygulanır: ne miras alır ne de miras alır; karısı tanımlanır; dua edilmez; zorla İslam'a geçer; öldürülmez çünkü öldürme bir cezadır ve ailesinden değildir. {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.17908} {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17909} Ezanın yeni doğanın sağ kulağına çağrılması ve sol tarafında kalması tavsiye edilir. Cenaze namazında, önce ölenin babası, sonra oğlu, sonra torunu öncelik alır. {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.. 17909} Zina çocuğunun imamı ile aydınlık çocuğu kendi yerlerinde ayrıntılı olarak belirtilmiştir; Hanbaliler, li'an tarafından sürgün edilen bir çocuğun imatı, dinini benimsemiş ve imalığa uygun ise ona liderlik etmeyi kabul eder. Aişe, zina çocuğu hakkında şöyle demiştir: \"Ebeveynlerinin günahıyla hiçbir ilgisi yoktur.\" {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.17909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17910} Zakat ödeyen çocuğa zekat ödeyenin bir çocuğa zekat ödemesi anlaşmayla kabul edilemez, çünkü aralarındaki mal yardımları bağlantılıdır. Zekat al-Fitr, kendisi ve ona bakmakla yükümlü olanlar, çocuklar da dahil olmak üzere, tarafından ödenir. Yükümlülükten sonra ölen veya doğan çocuk adına zekat ödenmesi konusunda anlaşmazlık vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17910} Çoğu hukukçuya göre, bir çocuğun ebeveynleri adına hac yapması Khath'amlı bir kadının hadisi nedeniyle caizdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17910} Bir çocuğun soyu annesinden doğumla, babasından yatak, kabul ve kanıtla belirlenir ve sadece lanetle geçersiz kılınır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17910} Çocuk adına kurban vermek. Çocuk yaşlıysa, babası için zorunlu değildir, genç ve serveti olmasa bile. Hanefilere göre, El-Hasan Ebu Hanife'den bunun zorunlu olduğunu, ancak ondan zorunlu olmadığını ve babanın servetinden tavsiye edildiğini rivayet etmiştir; ve çocuğun serveti varsa, babası veya vasisi onun adına fedakarlık yapar, Muhammed ve Zafer'e aykırı olarak Ebu Hanifa ve Ebu Yusuf'a göre. Malikiler, fakir ebeveynler ve küçük çocuk için kurban yapılmasını olgunluğa ulaşana kadar tavsiye ederken, Şafiiler sadece baba ve büyükbaba için kendi servetinden kurban vermeyi kabul eder. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.17910} {cit:fiqh-mawsua-kuwaitiyya-noor-v3 s.17911} Akikah, yani yeni doğan için Allah'a şükrederek kesilen şeydir; Şafiilere ve Hanbalilere göre bir sünnettir, Malikilere göre tavsiye edilir ve Hanefilere göre mücaizdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17911} Çocuğun ebeveynleriyle ilgili hükümler arasında: sünnet (erkek ve dişi sünnet derisinin kesilmesi zorunlu ve küçümsenmiştir), isimlendirme, velayeti, emzirilmesi, bakımı, eğitimi ve disiplini, çocuğun ebeveynlerine günah dışında itaat etme ve onlara saygı gösterme yükümlülüğü, çocuğun babası için dua etmesi, babanın çocuğu için dua etmesinin yasaklanması, Hanefi'lere göre çocuğun babasını kendi adıyla çağırmasının hoşlanmaması ve Şafi'lere göre çocuğun babasını kendi adıyla adlandırmaması gerektiği; bu hükümler ilgili yerlerinde ayrıntılı olarak belirtilmiştir. {atı:fiqh-mawsua-kuwaitiyya-noor-v3 s.17912} {cit:fiqh-mawsua-kuwaitiyya-noor-v3 s. 17913} Bazı çocuklara hediyelerde tercih edilir. Hanefiler, Malikiler ve Şafiiler eşit olmayı önerirken, Hanbalılar ve Ebu Yusuf bunu zorunlu kılar. Hanafilere göre aşkta tercihleri kabul edilir çünkü bu kalbin işidir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17914} İşgal edilen evin hediyesi. Hanefilere göre, bağışçının eşyalarıyla dolu bir evin hediye edilmesi yasaktır ve ödünç alınan evin hediyesi geçerlidir. Baba, oğlunun hediyesini Malikiler, Şafiiler ve Hanbaliler tarafından reddedilebilir, ancak Hanafi ve Ahmad bunu anlatamaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17914} Çocuklar için vakıf: melezlenmiş çocuklar, hem erkek hem de kız, anlaşmayla dahil edilir ve çocuklar hakkında bir anlaşmazlık vardır. Akrabalar vasiyetinde: Hanefi okulu görünürdeki anlatıma göre ebeveynleri ve çocukları içermez, ancak Hanbali ve Şafii görüşü onları içerir. Şafii görüşü, ne ebeveynlerin ne de çocukların dahil edildiği, ancak büyükbaba ve torunların dahil edildiği yönündedir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17915} Çocuğun ebeveynlerine hediyelerde adil olması önerilir, isterse annesini tercih etmelidir, dedi Al-Darimi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17915} Seyahat için ebeveyn izni istemek: Hanefilere göre tehlikenin büyük olduğu herhangi bir yolculukta, çocuk izni olmadan dışarı çıkmamalıdır ve tehlikenin şiddetli olmadığı her yolculuk, kaybetmezse izin verilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17915} Cihad, makalenin bir sonraki sayfasında belirtildiği gibi, ebeveynlerin izni olmadan izin verilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17915} Cihad, ancak Müslüman ebeveynlerin izni veya diğeri inançsızsa birinin izniyle, cihad gerekli olmadıkça, örneğin düşman bir grup Müslümanla indiğinde izin verilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17916} Ebeveynler çocuklarının servetinden alırlardı. Hukukçuların çoğunluğu: Bir baba, çocuğunun parasından sadece gerekli olduğunda hiçbir şey almaz; Hanafiler, Mısır'da olmak ile fakir ebeveynin başka hiçbir şey yememesi ile sadece fiyatına yemek yediği yerde olmak arasında ayrım yapar. Hanbaliler, babanın çocuğunun servetinden istediğini almasına iki şartla izin verir: oğula kötülük etmemesi ve başka bir çocuğa vermemesi. \"Sen ve malın babana aittir\" hadisini ve Tanrı'nın çocuğu babasına hediye ettiğini aktardılar. İbn Hani, Ahmad'ın babanın oğlunun servetinden sadaka vermediğini, kadının ise oğlunun parasından sadece onun izniyle sadaka vermediğini aktardı. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17916} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17917} Çocuğun bakımı ve emzirilmesi üzerine Khula'. Yorgun çocuk: Kul', kendi masraflarıyla geçerli değildir, ancak belirli bir süre için, çünkü onun desteği ömrünü uzatır. Ve bebek: Hula' emzirmek ve desteklemek için geçerlidir, doymasalar bile anne onu iki tam yıl emzirir, Allah'ın dediği gibi: 'Anneler, emzirmeyi tamamlamak isteyen için çocuklarını iki tam yıl emzirebilir' ve ayrıca 'Sütten kesildikten sonra emzirme olmaz.' demektedir. Koca dönerse veya karısı ya da çocuk adet bitmeden ölürse, koca kalan nafasını Hanafi ve Hanbali'ye göre geri verir; Şafi'ler ise uygun bir süre olmadan khul'u onaylamazlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17918} Çocuğun velayeti üzerine Khula'. Hanafiler khul'u düzeltir ve şartı geçersiz kılar, çünkü çocuğun annesinden ihtiyacı olanı alma hakkı vardır; Malikiler ise annenin velayeti alındığında khul'a izin verir, bu da babayı daha fazla hak eder, ancak zarar görme korkusu yoksa veya anneye kalp bağlıysa. Şafi'ler, annenin velayetinden sadece çocuğun babası için evlilik yoluyla feragat etmezler, çünkü çocuk belirli bir süre için velayetle boşanırsa, bu bağlayıcı bir kira sözleşmesidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17919} Bir çocuğun mirası, belirli koşullar altında çocuk ile ebeveynleri arasında kurulur. Zina çocuğu annesine atfedilir ve sadece onun yanında miras alınır; il'an'ın çocuğu ise lanetli kişiden miras kalmaz çünkü soyu onda yoktur; ayrıntılar kendi yerlerindedir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17919} Çocuğu kesme yemini. Hanefiler: Bu benzetme onun için geçerli değildir ve istihsan, her yavru için yavru olsa bile koyunu zorunlu kılar; bu, Ebu Hanife, Muhammed ve Hanbalilerin rivayetteki görüşüdür. Malikiler itiraz etmez ve Şafiiler onun yeminini geçerli saymazlar çünkü yakın akraba değildir. Ahmad'dan, her çocuk için bir koç kurban etmeye yemin eden bir kadından bahsedilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17919} Ölülerin çocuğu. Hayatına başlayan veya hayatı olan kişi, hükümlerde yaşayanlardan doğmuş sayılır; ölü doğan ise bekleme süresi sona eren başka bir kadından doğar ve ondan sonraki kan doğum sonrası olarak kabul edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17919} Çocuğun kendisiyle ilgili kuralları, örneğin onu yıkamak, dua etmek, miras vermek ve miras bırakmak, belirli yerlerinde ayrıntılı olarak belirtilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17920} Babanın malını küçük bir çocuğun satması, suçlama ve merhamet nedeniyle genel anlaşmayla mümkündür; Hanafi ve Şafi'lere göre büyükbaba için bu serbesttir çünkü mal üzerinde vasi vardır, ancak Maliki ve Hanbali'ye göre değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17920} Ajan, asıl malını çocuğuna satar veya onun için satın alır. Hanefiler, Malikiler, Şafiiler ve Hanbaliler bir rivayette, küçük çocuğuna satmayı yasaklar; çünkü bu, kendi başına satmak gibidir ve taraflardan hiçbiri sözleşmeyi uzlaştırmaz. En büyük oğul söz konusu olduğunda: Hanafi ve Şafiiler, en gerçek görüşün aksine, ve Hanbaliler bir rivayette onu yasaklar. Malikiler, Ebu Yusuf ve Muhammed ona aynı değeri verir, en doğru görüşte Şafiiler ise izin verir. İkinci rivayetteki Hanbaliler bunu iki şartla verir: aracın çağrıda artması ve çağrıyı başkasının üstlenmesi; ve Hanefiler ise, eğer söz genel iradesiyle olursa izin verir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17920} {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17921} Bir adam, çocuğunun parasından kendisi için satın alır, kendisi için ise satın alır: hukukçulara göre babanın bunu yapması caizdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17921} Baba, oğlundan aldığı parayı alır: Hanefilere göre, baba aynı satışta alıcı olmaz ve hâkim reşit olmaya bir vekil atayana kadar fiyattan muaf tutulmaz; Malikilere göre, alıcı ile alıcının eli birleştirilirse, mülkiyet niyetle yapılır; ve Hanbaliler babanın almasına, kabul etmesine ve almasına izin verir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17921} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17922} Çocuğun intikam toplama vesayeti: Ölenin tüm varisleri için, genç ya da yaşlı olsun, belirlenir ve intikamda ayrıntılı olarak belirtilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17922} Çocuğu öldürmek. Bir babanın çocuğunu öldürmesi yasaktır, Allah şöyle der: \"Ve çocuklarını yoksulluktan öldürme,\" ve İbn Mes'ud'un hadisinde: \"Çocuğunu seninle besleneceğinden korkarak öldürürsen.\" Bir baba oğlunu öldürürse, çoğu hukukçuya göre ondan intikam alması gerekmez. Dedenin oğlundan intikam alması gerekmez; Malikiler belirtir; eğer onu yatırırsa karnını kestirir, ama kılıç ya da sopayla öldürürse intikam almaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17923} Bir çocuğun ebeveynleri tarafından öldürülmesi: Çoğu hukukçuya göre, çocuk her ebeveyn tarafından öldürülür; çünkü ayetler ve hadisler çok fazladır, çocuğun azarlaması gerekliliği ve baba yabancıdan daha dokunulmaz olduğu için misilleme göz ardı edilmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17923} Çoğu hukukçuya göre, bir baba oğlunu misilleme almadan öldürür; çünkü suçu çocuğun kendi hayatına harcanmıştır; Ahmad, oğlunun babası tarafından öldürülmediğini, çünkü ifadesinin kabul edilmediğini anlatır. Zorunluluktan dövüşürken bir isyancıyı ya da sadece bir ebeveynini ya da çocuklarını öldüren kişi sorumluluk almaz, ancak diğer durumlarda sorumludur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17924} Çocuğun babasına tanıklık etmesi ve babasının da babasına tanıklığı kabul edilemez, birinin tanıklığı diğerine karşı kabul edilebilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17924} Çocuğun 'aqilah'a girişi: Malikiler ve Hanafiler bir görüştedir, bir rivayette Hanbaliler ebeveynleri ve çocukları kan parasını taşımaya dahil ederken, Şafi'ler ve Hanafiler başka bir görüşte, Hanbaliler ise ikinci rivayette onları dahil etmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17924}{Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 s.. 17925} Bir ebeveynin çocuğunun malından çalınması, tersi de geçerlidir. Çoğu hukukçu, bir babanın çocuğunun malından çaldığını söylemez; hadislere dayanarak: \"Sen ve malın babana aittir\" ve \"Gerçekten çocukların senin gelir kaynağındır\" ve cezalar şüpheyle önlenir. Ebu Savr ve İbn el-Mundhir, hırsızlık ayetinin görünürdeki anlamına dayanarak babayı kestirirler. Çocuk ise, eğer babasının malından çalarsa, çoğunluk onu kesmez. Malikiler, Ahmed ve El-Khariqi bunu kestiklerini rivayet eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17925} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17926} Baba oğlunu attı. Şafii ve Hanbali okullarındaki Hanafi ve Malikiler, çocuğunu iftira ederek babayı sınırlamaz; bunu yaparak onu öldürmeyi yasak kılar ve Şafi'ler ile Hanefilere göre 'azar' olarak kabul edilir. Çocuğundan miras kalan bir kadına iftira atan, başkalarıyla paylaşmadıkça cezalandırılmaz. Malikiler, oğlun ebeveynlerine karşı iftira cezası talep ettiğini savunur. {alıntı:) fiqh-mawsua-kuwaitiyya-noor-v3 s.17926} Hirabah cezası çocuk için kaldırılır. Hanafiler, çocuk kesilmiş bir çocuğun çocuğu veya yasak bir rahme sahipse, onunla cinsel ilişkiye izin verildiği şüphesiyle Hirabah cezasını bırakır ve hudud cezaları şüpheyle kaçınılır. Şafi'ler ve Hanbaliler, bunun çocuğun babasının parasını intikam olarak aldığında geçerli olduğunu, ancak çocuğun öldürülmesinin intikam gerektirdiğini söyler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17926} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17927} Kurbanın çocuğu: Bazı fiqhler onu onunla kesmeyi isterken, bazıları istemez ve ayrıntıları kurban sunusunda yer alır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17927} Köpek formundaysa koyunun yavruları: Hanafiler, izin ve yasak konusunda deneme (içme, yeme, bağırsak veya karın görünümü) ile ayırt ederlerken, Şafi'ler ise doğası gereği tercih edilmedikçe onu dindar olarak kabul ederler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17927}"
  id: "Dalam bahasa ini, 'anak laki-laki' berarti 'maulad' (lahir), dan merujuk pada tunggal, jamak, muda, tua, laki-laki, dan perempuan. Menurut Al-Jurjani, 'anak laki-laki' adalah hewan jantan yang lahir dari sperma seseorang sejenisnya. Ia menetapkan anak laki-laki sebagai laki-laki, dan anak laki-laki sebagai laki-laki dan perempuan; putri adalah bentuk feminin dari putra; cucu laki-laki adalah putra laki-laki; cucu laki-laki adalah putra laki-laki; dan putri menurut ahli bahasa; di antara umat Syafi'i, itu khusus untuk putra perempuan; dan di antara Hanbali, merujuk pada keduanya; dan 'keturunan' digunakan oleh mayoritas untuk merujuk pada putra, putri, dan anak-anak mereka. Di antara Hanbali, keturunan adalah yang paling umum di antara kedua putra. {cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 P.17905} {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 P.17906} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17907} Anak mengikuti yang terbaik dari kedua orang tua berdasarkan agama, menurut konsensus para ahli hukum. Jika salah satu pasangan adalah Muslim, maka anak itu Muslim, tetapi jika salah satu orang tua memeluk agama dan memiliki anak kecil, anak tersebut menjadi Muslim karena anak tersebut. Menurut Hanafi, jika satu adalah seorang Kitab dan yang lain seorang Majus, maka anak itu adalah Kitab karena Zoroaster itu jahat. Agar seorang anak dapat berafiliasi dengan orang tua terbaik, persatuan rumah tangga diperlukan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17907} Anak mengikuti orang tuanya dalam agama, dan keputusan tentang ketergantungan adalah agama atau rumah Islam. Jika anak di bawah umur berada di rumah kita dan ayahnya di tanah kafir, ia dianggap sebagai aturan atas umat Islam, dan ayah tidak diikuti jika ayahnya berada di tanah Islam dan anak berada di rumah kafir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17908} Murtad anak laki-laki terhormat. Abu Yusuf, Zafar, Al-Shafi'i, dan sebuah pepatah Ahmad mengatakan bahwa mereka tidak valid karena pernyataan anak itu tidak dianggap berbahaya (berbahaya); Abu Hanifa, Muhammad, Maliki, dan riwayat terkenal dari Ahmad menilai mereka, karena Islam membahas kesempurnaan akal sebelum mencapai masa pubertas. Jika murtadnya terbukti, hukum murtad berlaku untuknya: ia tidak mewarisi maupun mewarisi; istrinya diidentifikasi; ia tidak diarahkan untuk dijadikan solat; ia dipaksa masuk Islam; ia tidak dibunuh karena membunuh adalah hukuman dan bukan dari keluarganya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17908} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17909} Disarankan untuk memanggil adhan ke telinga kanan bayi baru lahir, dan tetap di sisi kiri mereka. Dalam shalat pemakaman, ayah almarhum, kemudian putranya, kemudian cucunya, menjadi prioritas utama. {cite:fiqh-mawsua-Kuwaitiyya-noor-v3 hlm. 17909} Imamate anak perzinaan dan anak penerangan dirinci di tempatnya masing-masing; Hanbalis menganggap diperbolehkan memimpin imamate anak yang diasingkan oleh li'an jika ia telah memeluk agamanya dan layak untuk imamat. Aisha berkata tentang anak perzinahan, \"Ia tidak ada hubungannya dengan dosa orang tuanya.\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17910} Tidak diperbolehkan berdasarkan kesepakatan untuk membayar zakat kepada anak dari pembayar zakat, karena hubungan antara manfaat harta di antara mereka. Zakat al-Fitr dibayarkan oleh seseorang atas nama dirinya sendiri dan mereka yang berkewajiban untuk menafkahinya, termasuk anak-anak. Ada perbedaan pendapat tentang membayarnya atas nama anak yang meninggal atau lahir setelah kewajiban tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17910} Menurut mayoritas ahli hukum, diperbolehkan bagi seorang anak untuk melakukan Haji atas nama orang tuanya, berdasarkan hadits seorang wanita dari Khath'am. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17910} Garis keturunan seorang anak ditetapkan dari ibunya melalui kelahiran, dan dari ayahnya melalui tempat tidur, pengakuan, dan bukti, dan hanya dibatalkan dengan kutukan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17910} Pengorbanan atas nama anak. Jika anak itu sudah tua, maka tidak wajib bagi ayahnya, meskipun ia masih muda dan tidak memiliki kekayaan. Menurut Hanafi, Al-Hasan menceritakan dari Abu Hanifa bahwa itu wajib, tetapi dari dia tidak wajib dan direkomendasikan dari kekayaan ayah; dan jika anak itu memiliki kekayaan, ayah atau wali mengorbankan itu atas namanya menurut Abu Hanifa dan Abu Yusuf, berbeda dengan Muhammad dan Zafar. Umat Malik merekomendasikan pengorbanan atas nama orang tua miskin dan anak kecil sampai ia dewasa, sementara Syafi'i hanya mengizinkannya untuk ayah dan kakek dari kekayaannya sendiri. {cite:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 hlm.17910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17911} Aqiqah, yang disembelih untuk bayi baru lahir sebagai tanda syukur kepada Allah, adalah Sunnah menurut Shafi'i dan Hanbali, direkomendasikan menurut Maliki, dan diperbolehkan menurut Hanafi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17911} Di antara putusan yang berkaitan dengan orang tua anak, termasuk: sunat (memotong kulup inti laki-laki dan perempuan, yang wajib dan diabaikan), penamaan namanya, hak asuh, menyusui, pemeliharaan, pendidikan, dan disiplin, kewajiban anak untuk taat kepada orang tua dengan cara selain dosa dan menghormati mereka, permohonan anak kepada ayahnya, larangan ayah berdoa untuk anaknya, ketidaksukaan anak memanggil ayahnya dengan nama sendiri menurut Hanafi, dan Sunnah menurut Syafi'ah bahwa anak tidak boleh menamai ayahnya dengan namanya; aturan-aturan ini dirinci di tempatnya masing-masing. {cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 hlm.17912} {cite:fiqh-mawsua-Kuwaitiyya-noor-v3 hlm. 17913} Preferensi untuk beberapa anak dalam hadiah. Hanafi, Maliki, dan Shafi'i merekomendasikan penyetatan, sementara Hanbal dan Abu Yusuf mengikutinya. Preferensi mereka dalam cinta diperbolehkan menurut Hanafi karena itu adalah pekerjaan hati. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17914} Hadiah rumah yang ditempati. Menurut Hanafi, tidak diperbolehkan memberikan rumah yang ditempati oleh barang-barang pemberi itu, dan hadiah rumah pinjaman sah. Ayah dapat mencabut hadiah putranya menurut Maliki, Shafi'i, dan Hanbal dalam aliran pemikiran, tetapi Hanafi dan Ahmad dilarang menceritakan hal ini. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17914} Wakaf untuk anak-anak: anak kandungan, baik laki-laki maupun perempuan, dimasukkan berdasarkan kesepakatan, dan ada perselisihan tentang anak-anak. Dalam wasiat untuk kerabat: sekolah Hanafi tidak memasukkan orang tua dan anak sesuai dengan narasi yang jelas, tetapi pandangan Hanbal dan Shafi'i memasukkan mereka. Pandangan Shafi'i adalah bahwa baik orang tua maupun anak tidak termasuk, melainkan kakek dan cucu-cucu termasuk. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17915} Disarankan agar anak bersikap adil dalam memberikan hadiah kepada orang tuanya, dan jika ia mau, ia harus lebih memilih ibu, kata Al-Darimi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17915} Meminta izin orang tua untuk bepergian: Setiap perjalanan di mana bahaya besar, anak tidak boleh keluar tanpa izin menurut Hanafi, dan perjalanan di mana bahaya tidak parah diperbolehkan jika mereka tidak kehilangan mereka. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17915} Jihad tidak diperbolehkan kecuali dengan izin orang tua, seperti yang dinyatakan di halaman artikel berikutnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17915} Jihad tidak diperbolehkan kecuali dengan izin orang tua Muslim, atau dengan izin salah satu jika yang lain bukan penganut beriman, kecuali jihad diperlukan, seperti ketika musuh turun bersama sekelompok Muslim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17916} Orang tua mengambil dari kekayaan anaknya. Mayoritas ahli hukum: Seorang ayah tidak mengambil apa pun dari uang anaknya kecuali jika diperlukan; Hanafi membedakan antara berada di Mesir dan orang tua miskin makan tanpa apa-apa, dan berada di tempat makan dengan harga yang dibayar. Hanbalis mengizinkan ayah mengambil apa pun yang diinginkan dari kekayaan anaknya, dengan dua syarat: tidak menyakiti anak dan tidak memberikannya kepada anak lain. Mereka mengutip hadits \"Kamu dan harta bendamu milik ayahmu,\" dan bahwa Tuhan memberikan anak itu kepada ayahnya. Ibn Hani mengutip Ahmad yang mengatakan bahwa ayah tidak memberi amal dari kekayaan anaknya, dan bahwa seorang wanita tidak memberikan amal dari uang anaknya kecuali dengan izin ayahnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17916} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17917} Khula' tentang pemeliharaan dan menyusui anak. Anak yang lelah: Kul' tidak berlaku atas biaya sendiri kecuali untuk jangka waktu tertentu, karena nafkahnya memperpanjang hidupnya. Dan bayi: Khula' sah untuk menyusui dan mendukungnya, meskipun belum kenyang, ibu akan menyusui selama dua tahun penuh, seperti yang dikatakan Allah: 'Ibu boleh menyusui anaknya selama dua tahun penuh untuk siapa pun yang ingin menyelesaikan menyusui,' dan juga dalam pepatah, 'Tidak ada menyusui setelah disapih.' Jika suami kembali atau istri atau anak meninggal sebelum masa itu berakhir, suami mengembalikan sisa tunjangan sesuai dengan Hanafi dan Hanbali; Syafi'i tidak mengesahkan khul' tanpa waktu yang tepat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17918} Khula' tentang hak asuh anak. Para Hanafi mengoreksi khul' dan membatalkan syarat tersebut, karena anak berhak mendapatkan apa yang dibutuhkan dari ibunya; Malikis mengizinkan khul' setelah hak asuh ibu dicabut, sehingga ayah lebih berhak atas hak asuh tersebut, kecuali ada ketakutan akan bahaya atau hati melekat pada ibu. Syafi tidak melepaskan hak asuh ibu melalui pernikahan kecuali ayah anak jika ia bercerai dengan hak asuh untuk jangka waktu yang diketahui, karena itu adalah sewa yang mengikat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17919} Pewarisan anak ditetapkan antara anak dan orang tuanya dengan syarat tertentu. Anak perselingkuhan dikaitkan dengan ibunya dan hanya diwariskan dari pihak ibunya, dan anak il'an tidak diwariskan dari orang yang terkutuk karena garis keturunannya tidak ada; rincian ada di tempatnya masing-masing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17919} Sumpah untuk menyembelih anak. Hanafi: Analogi ini tidak berlaku baginya, dan istihsan mewajibkan seekor domba, meskipun dia memiliki keturunan untuk setiap keturunan, yang merupakan pandangan Abu Hanifa, Muhammad, dan Hanbalis dalam sebuah narasi. Keluarga Malik tidak keberatan, dan para Syafi'i tidak menganggap sumpahnya sah karena dia bukan kerabat dekat. Cerita ini diceritakan dari Ahmad tentang seorang wanita yang bersumpah untuk mengorbankan seekor domba jantan untuk setiap anak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17919} Anak dari orang mati. Siapa pun yang memulai atau memiliki apa yang dikenal sebagai hidupnya dianggap lahir dari orang hidup dalam keputusan, dan siapa pun yang lahir mati lahir dari orang lain yang masa tunggunya berakhir, dan darah setelahnya dianggap pasca melahirkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17919} Adapun keputusan mengenai anak mengenai dirinya sendiri, seperti membasuhnya, berdoa untuknya, warisan, dan mewariskan, dirinci di tempat-tempat spesifiknya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17920} Penjualan properti ayah oleh anak di bawah umur diperbolehkan berdasarkan kesepakatan umum karena tidak ada tuduhan dan belas kasihan; menurut Hanafi dan Shafi'i diperbolehkan bagi kakek karena ia memiliki hak asuh atas properti tersebut, tetapi tidak menurut Malikis dan Hanbali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17920} Agen menjual properti prinsipalnya kepada anaknya atau membelinya untuknya. Hanafi, Maliki, Shafi'i, dan Hanbalis dalam narasi melarang menjual properti tersebut kepada anaknya yang masih di bawah umur karena itu seperti menjualnya sendiri, dan tidak ada pihak yang mendamaikan kontrak. Dalam kasus putra sulung: Hanafi dan Shafi'i, berbeda dengan pandangan paling otentik, dan Hanbalis dalam satu narasi melarangnya. Maliki, Abu Yusuf, dan Muhammad mengizinkannya dengan nilai yang sama, dan Shafi'i dalam pandangan yang paling benar mengizinkannya. Hanbal dalam narasi kedua mengizinkannya dengan dua syarat: bahwa agen meningkatkan panggilan, dan bahwa orang lain mengambil alih panggilan; dan Hanafi mengizinkannya jika agensi dilakukan berdasarkan kehendak umum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17920} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17921} Seorang pria membeli untuk dirinya sendiri dari uang anaknya, dan membeli untuk dirinya sendiri dari dirinya sendiri: menurut para ahli hukum, ayah diperbolehkan melakukannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17921} Ayah menerima uang yang dibelinya dari putranya: Menurut Hanafi, ayah tidak menjadi penerima untuk penjualan yang sama, juga tidak dibebaskan dari harga sampai hakim menunjuk agen untuk anak di bawah umur dan mengambil alih; menurut Maliki, jika tangan penerima dan penerima disatukan, kepemilikan dilakukan dengan sengaja; dan Hanbalis mengizinkan ayah untuk mendapatkan, menerima, dan menerima. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17921} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17922} Hak asuh anak untuk mengumpulkan balasan: Hak asuh ditetapkan untuk semua ahli waris almarhum, baik muda maupun tua, dan dirinci sebagai pembalasan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17922} Membunuh anak. Dilarang bagi seorang ayah untuk membunuh anaknya, seperti yang dikatakan Allah: \"Dan jangan membunuh anakmu karena kemiskinan,\" dan dalam hadis Ibn Mas'ud: \"Jika kamu membunuh anakmu karena takut dia akan diberi makan bersamamu.\" Jika seorang ayah membunuh anaknya, menurut mayoritas ahli hukum, dia tidak diwajibkan untuk membalas dendam darinya. Kakek tidak diwajibkan untuk membalas dari anaknya; para Malik menentukan, dan jika dia membaringkannya, dia membantai atau membantai perutnya, tetapi jika dia membunuhnya dengan pedang atau tongkat, dia tidak akan menerima pembalasan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17923} Membunuh anak oleh orang tuanya: Menurut mayoritas ahli hukum, anak dibunuh oleh masing-masing orang tua, karena banyaknya ayat dan hadis yang umum, kebutuhan untuk teguran dari anak, dan karena ayah lebih tak terganggu daripada orang luar, sehingga pembalasan tidak dihilangkan dalam kasusnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17923} Seorang ayah membunuh anaknya tanpa pembalasan menurut mayoritas ahli hukum, karena kejahatannya sia-sia demi nyawa anak itu sendiri; Ahmad menceritakan bahwa seorang anak tidak dibunuh oleh ayahnya karena kesaksiannya tidak diterima. Siapa pun yang membunuh pemberontak atau hanya salah satu orang tua atau anaknya dalam pertarungan karena kebutuhan, tidak ada tanggung jawab, tetapi dalam kasus lain, dia bertanggung jawab. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17924} Kesaksian anak kepada ayahnya dan sebaliknya tidak diperbolehkan, dan kesaksian salah satu diperbolehkan melawan yang lain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17924} Entri anak ke 'aqilah: Mali dan Hanafi memiliki satu pendapat, dan Hanbal dalam satu narasi memasukkan orang tua dan anak dalam membawa uang darah, sementara Shafi'i dan Hanafi dalam pendapat lain dan Hanbal dalam narasi kedua tidak memasukkan mereka. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17924}{cite:fiqh-mawsua-Kuwaitiyya-noor-v3 hlm. 17925} Pencurian orang tua dari harta anaknya, dan sebaliknya. Mayoritas ahli hukum tidak mengatakan bahwa seorang ayah mencuri dari harta anaknya, berdasarkan hadits: \"Kamu dan harta benda milik ayahmu\" dan \"Memang, anakmu adalah penghasilmu,\" dan karena hukuman yang ditetapkan dihindari oleh keraguan. Abu Thawr dan Ibn al-Mundhir memutuskan hubungan dengan ayah, berdasarkan makna ayat pencurian yang jelas. Adapun anak, jika dia mencuri dari harta ayahnya, mayoritas tidak memotongnya. Maliki, Ahmad, dan Al-Khariqi menceritakan bahwa mereka memotongnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17925} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17926} Ayah itu melemparkan anaknya. Hanafi dan Malik di sekolah Shafi'i dan Hanbali tidak membatasi ayah dengan memfitnah anaknya, berdasarkan larangan membunuhnya dengan itu, dan ia dianggap 'azar' menurut Shafi'i dan Hanafi. Siapa pun yang memfitnah wanita yang diwariskan anaknya tidak akan dihukum kecuali ia membagikannya kepada orang lain. Maliki berpendapat bahwa anak menuntut hukuman pencemaran nama baik terhadap orang tuanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17926} Hukuman Hirabah dibatalkan untuk anak tersebut. Hanafi menghapus hukuman Hirabah jika anak itu anak dari anak yang dipisahkan atau memiliki rahim terlarang, karena dicurigai diizinkan berhubungan seks dengannya, dan hukuman hudud dihindari dengan keraguan. Syafi'i dan Hanbal mengatakan ini berlaku ketika seorang anak mengambil uang ayahnya sebagai bentuk pembalasan, tetapi membunuh anak memerlukan pembalasan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17926} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17927} Anak dari korban: Beberapa ahli hukum mengharuskan disembelih bersamanya, sementara yang lain tidak, dan rinciannya tercantum dalam persembahan kurban. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17927} Keturunan domba jika berbentuk anjing: Hanafi membedakan melalui ujian (minum, makan, penampilan usus atau perut) mengenai kelayakan dan larangan, sedangkan Shafi'i membiarkannya sebagai saleh kecuali memang lebih disukai secara alami. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17927}"
