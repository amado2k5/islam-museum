id: concept/walad-fiqh
class: concept
kind: legal
label:
  ar: "وَلد"
  en: "Walad (child, fiqh)"
summary:
  ar: "الولد في اللغة المولود، ويُقال للواحد والجمع والصغير والكبير والذكر والأنثى. والابن عند الجرجاني حيوان ذكر يتولد من نطفة شخص من نوعه، وخص الابن بالذكر والولد بالذكر والأنثى؛ والبنت مؤنث الابن؛ والحفيد ولد الولد؛ والسبط ولد الابن والبنت عند اللغويين، وعند الشافعية يخص ولد البنت، وعند الحنابلة يطلق على كليهما؛ والذرية تطلق عند الجمهور على الأبناء والبنات وأولادهم، ومن الحنابلة من أخرج أولاد البنات؛ والنسل أعم من الولد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17905}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17906}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17907}\n\nالولد يتبع خير الأبوين ديناً باتفاق الفقهاء، فلو كان أحد الزوجين مسلماً فالولد مسلم، وإن أسلم أحد الأبوين وله ولد صغير صار الولد مسلماً بإسلامه، نظراً للولد. وعند الحنفية لو كان أحدهما كتابياً والآخر مجوسياً فالولد كتابي، لأن المجوسية شر، ويشترط لتبعية الولد لخير الأبوين اتحاد الدار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17907}\n\nيتبع الولد أبويه في الدين، ويكون الحكم بالتبعية ديناً أو دار الإسلام، فإن كان الصغير في دارنا والأب في دار الكفر أُلحق بالمسلمين حكماً، ولا يتبع الأب إن كان الأب في دار الإسلام والصغير في دار الكفر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17908}\n\nردة الصبي المميز. أبو يوسف وزفر والشافعي وقول لأحمد يقولون إنها لا تصح، لأن أقوال الصبي غير معتبرة في الضار؛ وأبو حنيفة ومحمد والمالكية والمشهور عن أحمد يحكمون بها، لأن الإسلام يتعلق به كمال العقل دون البلوغ. وإذا ثبتت ردته ترتبت عليه أحكام الردة: لا يرث ولا يورث، وتبين امرأته، ولا يصلى عليه، ويجبر على الإسلام؛ ولا يُقتل لأن القتل عقوبة وليس من أهلها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17908}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17909}\n\nيُسن الأذان في يمنى أذني المولود، والإقامة في يسراهما. ويُقدم في الصلاة على الميت أبوه ثم ابنه ثم ابن ابنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17909}\n\nإمامة ولد الزنى وولد اللعان تفصيلهما في مواضعهما؛ والحنابلة لا بأس بإمامة الولد المنفي باللعان إذا سلم دينه وكان صالحاً للإمامة، وقالت عائشة في ولد الزنى «ليس عليه من خطيئة أبويه شيء». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17909}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910}\n\nلا يجوز بالاتفاق دفع الزكاة إلى الولد من المزكي، لاتصال منافع الأملاك بينهما. وزكاة الفطر يخرجها الشخص عن نفسه وعمن تلزمه نفقته ومنهم الأولاد، وفي إخراجها عن الولد الذي مات أو ولد بعد الوجوب خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910}\n\nيجوز عند جمهور الفقهاء حج الولد عن والديه، لحديث المرأة من خثعم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910}\n\nنسب الولد يثبت من أمه بالولادة، ومن أبيه بالفراش والإقرار والبينة، ولا ينتفي إلا باللعان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910}\n\nالتضحية عن الولد. إذا كان الولد كبيراً فلا تجب على والده، وإن كان صغيراً ولا مال له فعند الحنفية روى الحسن عن أبي حنيفة وجوبها، وعنه لا تجب ويستحب من مال الأب؛ وإذا كان للصبي مال فيضحي عنه أبوه أو وصيه عند أبي حنيفة وأبي يوسف، خلافاً لمحمد وزفر. والمالكية يسنّون التضحية عن الأبوين الفقيرين والولد الصغير حتى يبلغ الذكر، والشافعية يجيزونها للأب والجد من ماله فقط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17911}\n\nالعقيقة، وهي ما يُذبح عن المولود شكراً لله، سنة عند الشافعية والحنابلة، ومندوبة عند المالكية، ومباحة عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17911}\n\nمن أحكام الولد المتصلة بالوالدين ومنها: الختان (قطع القلفة من الذكر والنواة من الأنثى، وفيه الوجوب والسنية)، وتسميته، وحضانته، وإرضاعه ونفقته وتعليمه وتأديبه، ووجوب طاعة الولد لوالديه في غير معصية وبرهما، ودعاء الولد لوالده، والنهي عن دعاء الوالد على ولده، وكراهة أن يدعو الولد أباه باسمه عند الحنفية، ويُسن ذلك عند الشافعية أن لا يسمي الولد أباه باسمه؛ وهذه الأحكام مفصلة في مواضعها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17912}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17913}\n\nتفضيل بعض الأولاد في العطية. الحنفية والمالكية والشافعية يستحبون التسوية، والحنابلة وأبو يوسف يوجبونها. وتفضيلهم في المحبة لا بأس به عند الحنفية لأنها عمل القلب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17913}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17914}\n\nهبة المشغول. عند الحنفية لا تجوز هبة الدار المشغولة بمتاع الواهب، وتصح هبة الدار المعارة، وللأب الرجوع في هبة ولده عند المالكية والشافعية والحنابلة في المذهب، ويمنع الحنفية وأحمد في رواية ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17914}\n\nالوقف على الأولاد: الأولاد الصلبيون ذكوراً وإناثاً يدخلون بالاتفاق، وأولاد الأولاد مختلف فيهم. وفي الوصية للأقارب: الحنفية لا يدخل الوالدان والولد في ظاهر الرواية، والحنابلة وقول عند الشافعية يدخلونهما، والشافعية في الأصح لا يدخل الوالدان ولا الولد لكن الجد والأحفاد يدخلون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17914}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915}\n\nيسن للولد أن يعدل في العطية لوالديه، وإن فضل فليفضل الأم، قال الدارمي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915}\n\nاستئذان الوالدين في السفر: كل سفر يشتد فيه الخطر لا يخرج الولد إليه بغير إذنهما عند الحنفية، وكل سفر لا يشتد فيه الخطر يجوز له الخروج إليه إذا لم يضيعهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915}\n\nلا يجوز الجهاد إلا بإذن الأبوين، بحسب ما ورد في الصفحة التالية من المادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915}\n\nالجهاد لا يجوز إلا بإذن الأبوين المسلمين، أو بإذن أحدهما إن كان الآخر كافراً، إلا إذا تعين الجهاد، كأن ينزل العدو بقوم من المسلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17916}\n\nأخذ الأبوين من مال ولدهما. جمهور الفقهاء: لا يأخذ الوالد من مال ولده شيئاً إلا عند الحاجة؛ والحنفية يفرّقون بين أن يكونا في المصر فيأكل الوالد الفقير بغير شيء، وأن يكونا في مفازة فيأكل بالقيمة. والحنابلة يجيزون للأب أن يأخذ من مال ولده ما شاء، بشرطين: ألا يجحف بالابن، وألا يعطيه لولد آخر. واستدلوا بحديث «أنت ومالك لأبيك»، وبأن الله جعل الولد موهوباً لأبيه. ونقل ابن هانئ عن أحمد أنه لا يقطع الوالد إذا أخذ من مال ولده، وأنه لا تتصدق المرأة من مال ابنها إلا بإذنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17916}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17917}\n\nالخلع على نفقة الولد وإرضاعه. الولد الفطيم: لا يصح الخلع على نفقته إلا بمدة معينة، لأن نفقته تمتد عمره. والرضيع: يصح الخلع على إرضاعه ونفقته، وإن لم يوقتا تُرضعه الأم حولين كاملين، لقوله تعالى «والوالدات يرضعن أولادهن حولين كاملين لمن أراد أن يتم الرضاعة»، ولقوله «لا رضاع بعد فصال». وإن عاد الزوج أو ماتت الزوجة أو الولد قبل تمام المدة رجع الزوج ببقية النفقة عند الحنفية والحنابلة؛ والشافعية لا يصححون الخلع بغير توقيت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17917}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17918}\n\nالخلع على حضانة الولد. الحنفية يصححون الخلع ويبطلون الشرط، لأن حق الولد أن يكون عند أمه ما كان إليها محتاجاً؛ والمالكية يجيزون الخلع على إسقاط حضانة الأم ويصير الأب أحق بها، ما لم يخش ضرر أو يتعلق القلب بالأم. والشافعية لا تسقط حضانة الأم بنكاحها غير أبي الطفل إذا اختلعت بالحضانة مدة معلومة، لأنها إجارة لازمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17918}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919}\n\nميراث الولد يثبت بين الولد ووالديه بشروط، وولد الزنى ينسب إلى أمه ويرث بجهتها فقط، وولد اللعان لا توارث بينه وبين الملاعن لانتفاء نسبه منه؛ وتفاصيلها في مواضعها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919}\n\nالنذر بذبح الولد. الحنفية: القياس لا شيء عليه، والاستحسان يلزمه شاة، ولو كان له أولاد فشاة عن كل ولد، وهو قول أبي حنيفة ومحمد، والحنابلة في رواية. والمالكية لا شيء عليه، والشافعية لا يصح نذره لأنه ليس بقربة. وروي عن أحمد في امرأة نذرت نحر ولدها أن تذبح كبشاً عن كل ولد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919}\n\nولد الميتة. من استهل أو صدر منه ما يعرف به حياته أخذ حكم الأحياء في الأحكام، ومن ولد ميتاً فإنه ولد في حق غيره تنتهي به العدة، والدم بعده نفاس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919}"
  en: "Walad (a child) in the language is one born; it is used for one or many, for a small or a grown child, and for a male or a female. Ibn (a son), in al-Jurjani's definition, is a male born from the seed of another of its kind, and the Mawsu'a notes that the son is male while the child (walad) may be either sex. Bint (a daughter) is the feminine of ibn. Hafid (a grandchild) is a child's child. Sibt (a grandson by a daughter, in the lexicographers' usage) is applied by the Shafi'is to a daughter's child, and by the Hanbalis to both kinds of grandchild. Dhurriyya (descendants) means in the majority's usage the children, daughters and their children, while some Hanbalis exclude the children of daughters. Nasl (offspring) is wider than walad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17905}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17906}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17907}\n\nThe child follows the better of its parents in religion, by agreement of the jurists. If one spouse is Muslim the child is Muslim; if one parent converts and the child is young, the child becomes Muslim with him, for the child's benefit. The Hanafis hold that if one parent is a People of the Book and the other a Magian, the child is a People of the Book, since Magianism is worse. The Hanafis require for the child to follow the better parent that the two share one abode. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17907}\n\nThe child follows the religion of his parents where the rule of following applies. If the child is in our land and the father in the abode of unbelief, the child is treated as a Muslim by ruling; but the child does not follow a father who is in the abode of Islam while the child is in the abode of unbelief. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17908}\n\nThe apostasy of a discerning boy. Abu Yusuf, Zufar, al-Shafi'i and a view of Ahmad hold that it is not valid, since a boy's words have no effect for harm. Abu Hanifa, Muhammad, the Malikis and the known view of Ahmad rule it valid, since Islam depends on sound reason, not puberty. Once his apostasy is established, the rulings of apostasy apply: he does not inherit or pass on an estate, his wife is separated from him, no funeral prayer is made over him, and he is compelled to return to Islam; but he is not killed, because killing is a punishment and he is not of the kind to bear it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17908}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17909}\n\nAt birth the call to prayer is recited in the right ear of the newborn, and the summons in the left. In the funeral prayer for a dead person, the father comes first, then the son, then the son's son. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17909}\n\nOn leading prayer by the son of an illegitimate union or of li'an, the rulings are set out in their own places. The Hanbalis see no harm in the imamate of a child disowned by li'an if his religion is sound and he is fit to lead; 'A'isha said of the child of illegitimacy that he bears nothing of his parents' sin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17909}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910}\n\nBy agreement, zakat may not be given to one's own child, since the benefits of property are joined between them. A person pays zakat al-fitr for himself and for those whose maintenance is due, including his children; there is a difference on paying it for a child who died or was born after the obligation arose. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910}\n\nBy the majority, a child may perform the pilgrimage on behalf of his parents, on the report of the woman of Khath'am who asked whether she might do it for her aged father. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910}\n\nA child's lineage is established from the mother by birth, and from the father by the marriage bed, acknowledgement or evidence; it ends only by li'an. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910}\n\nOn sacrifice for a child: if the child is grown, his father is not obliged; if he is a minor without property, the Hanafis report from al-Hasan from Abu Hanifa that it is obligatory, and another narration that it is not obligatory but recommended from the father's own money. If the minor has property, his father or executor sacrifices from it, according to Abu Hanifa and Abu Yusuf, against Muhammad and Zufar. The Malikis make it a sunna for the parent to sacrifice for poor parents and for a young child until the boy reaches puberty; the Shafi'is allow it only for the father and grandfather from their own money. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17910}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17911}\n\nThe 'aqiqa, the animal slaughtered for a newborn in thanks to God, is a sunna for the Shafi'is and Hanbalis, recommended for the Malikis and permitted for the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17911}\n\nAmong the rulings that bind the child to his parents are: circumcision (cutting the foreskin of a male and the membrane of a female, obligatory for some and sunna for others); naming; custody; suckling; maintenance; education; discipline; the duty of the child to obey and honour his parents in what is not sinful; the child's prayer for his father; the prohibition on a parent's curse on his child; the Hanafi dislike of a son calling his father by his name, and the Shafi'i recommendation that a child not name his father by name. These are set out in their own places. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17912}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17913}\n\nPreference among children in gifts. The Hanafis, Malikis and Shafi'is recommend equality; the Hanbalis and Abu Yusuf make it obligatory. Preference in affection is not blamed by the Hanafis, since affection is an act of the heart. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17913}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17914}\n\nGift of an occupied thing. The Hanafis hold that a house still occupied by the donor's goods cannot be given, while a lent house may be given; the father may take back a gift to his child, according to the Malikis, the Shafi'is and the school view of the Hanbalis, which the Hanafis and a Hanbali narration deny. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17914}\n\nAn endowment for one's children includes children of both sexes by agreement, and their children are a matter of difference. In a bequest to relatives, the Hanafis do not include parents or children in the apparent view; the Hanbalis and one Shafi'i view include them; the sounder Shafi'i view excludes them but includes grandparents and grandchildren. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17914}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915}\n\nIt is sunna for a child to be just in his gifts to his parents, and if he prefers one, al-Darimi says he should prefer the mother. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915}\n\nLeave of parents for travel. The Hanafis hold that for a journey in which danger is great, the child may not go without his parents' leave; for a journey without great danger he may go if he does not neglect them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915}\n\nJihad requires the permission of the parents, as the next part of the entry sets out. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17915}\n\nJihad is not valid without the leave of Muslim parents, or the leave of one of them when the other is an unbeliever, unless jihad has become an individual duty, as when the enemy attacks a group of Muslims. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17916}\n\nParents taking from the child's property. The majority hold that a father may take from his child's property only in need. The Hanafis distinguish: if they are in a town, a poor father may eat without payment; if in the desert and without food, he may eat at its value. The Hanbalis allow a father to take from his child's property what he wishes, and to own it, if the father is in need, on two conditions: it must not injure the child, and he must not give what he takes to another child. They cite the saying 'you and your property belong to your father', and that God calls the child a gift to the father. Ibn Hani' records Ahmad's view that a father who takes from his son's property is not punished as a thief, and that a mother may not give from her son's property except with his leave. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17916}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17917}\n\nKhul' on a child's maintenance or suckling. For a weaned child, khul' on his maintenance is valid only for a fixed term, since his maintenance runs for his whole life. For a suckling, khul' on his suckling and maintenance is valid, and if no term is fixed the mother suckles him for two full years, on the verse 'mothers suckle their children two full years for whoever wishes to complete the suckling', and on the saying 'there is no suckling after weaning'. If the husband returns, or the wife or the child dies before the term ends, the husband recovers the balance of the maintenance according to the Hanafis and Hanbalis; the Shafi'is do not allow khul' without a fixed term. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17917}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17918}\n\nKhul' on custody of the child. The Hanafis allow the khul' and void the condition, since the child's right is to be with his mother while he needs her. The Malikis allow a khul' on the mother's custody, and custody then passes to the father, unless harm is feared or the child's heart is attached to the mother. The Shafi'is hold that the mother's custody does not end by her marrying someone other than the child's father if the khul' fixed a term, since it is a binding hire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17918}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919}\n\nThe child's inheritance is established between the child and his parents on conditions; the child of illegitimacy is ascribed to his mother and inherits only through her; the child of li'an does not inherit from the one who disowned him, since his lineage is denied. The details are set out in their places. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919}\n\nA vow to slaughter one's child. The Hanafis: by analogy nothing is due, but by juristic preference a sheep is due, and for several children a sheep for each; this is the view of Abu Hanifa and Muhammad and one Hanbali narration. The Malikis say nothing is due; the Shafi'is say the vow is invalid, since it is not an act of devotion. On a narration of Ahmad about a woman who vowed to slaughter her children, she sacrifices a ram for each child. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919}\n\nThe child born dead. If the newborn cries or shows signs of life, he is ruled as living. If he is born dead, he is a child in the sense that the waiting period ends with his birth, and blood afterwards is the blood of childbirth. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17919}"
