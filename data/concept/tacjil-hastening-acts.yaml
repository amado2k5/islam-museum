class: concept
kind: legal
label:
  ar: "التعجيل"
  en: "Ta'jil (doing a thing early: repentance, burial, debt, breaking the fast, the pilgrim's early departure, prayer before its time, zakat and expiations)"
  ur: "تعجیل (کام کو جلد کرنا: توبہ، تجہیز، قرض، افطار، حاجی کی جلد روانگی، اور وقت سے پہلے عبادت)"
summary:
  ar: "التعجيل الإتيان بالفعل قبل وقته المحدد شرعاً، أو في أول وقته. وهو مشروع في مواضع، كالتوبة فهي واجبة على الفور، وتجهيز الميت مندوب، وأداء الدين واجب عند استحقاقه، وتعجيل الفطر سنة، والتعجيل بالنفر في اليوم الثاني من التشريق رخصة، والصلاة قبل وقتها غير مشروعة إلا في حالات الجمع، وتعجيل الزكاة قبل الحول مختلف فيه، وتعجيل الكفارة بعد السبب مختلف فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5385} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5386} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5387} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5388} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5389} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5390} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5391} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5392}"
  en: "Ta'jil is doing a thing before its set time, or at the very beginning of it. It is lawful in several cases: repentance, which is due at once; the burial, which is recommended once death is certain; payment of a debt when due, which is required; breaking the fast at sunset, which is a sunna; the pilgrim's early departure on the second day of the tashriq, which is a concession; prayer before its time, unlawful except in combining; zakat before the year, disputed; and expiations after their cause, disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5385} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5386} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5387} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5388} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5389} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5390} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5391} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5392}"
