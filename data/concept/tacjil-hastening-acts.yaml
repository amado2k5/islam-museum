label:
  ar: "التعجيل"
  en: "Ta'jil (doing a thing early: repentance, burial, debt, breaking the fast, the pilgrim's early departure, prayer before its time, zakat and expiations)"
  ur: "تعجیل ⁦(کام کو جلد کرنا: توبہ، تجہیز، قرض، افطار، حاجی کی جلد روانگی، اور وقت سے پہلے عبادت)⁩"
  es: "Ta'jil (hacer algo antes de tiempo: arrepentimiento, entierro, deuda, romper el ayuno, la partida temprana del peregrino, la oración antes de su tiempo, zakat y expiaciones)"
  fr: "Ta'jil (accomplir une chose en avance: repentir, enterrement, dette, rupture du jeûne, départ anticipé du pèlerin, prière avant l'heure, zakat et expiations)"
summary:
  ar: "التعجيل الإتيان بالفعل قبل وقته المحدد شرعاً، أو في أول وقته. وهو مشروع في مواضع، كالتوبة فهي واجبة على الفور، وتجهيز الميت مندوب، وأداء الدين واجب عند استحقاقه، وتعجيل الفطر سنة، والتعجيل بالنفر في اليوم الثاني من التشريق رخصة، والصلاة قبل وقتها غير مشروعة إلا في حالات الجمع، وتعجيل الزكاة قبل الحول مختلف فيه، وتعجيل الكفارة بعد السبب مختلف فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5385} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5386} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5387} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5388} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5389} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5390} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5391} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5392}"
  en: "Ta'jil is doing a thing before its set time, or at the very beginning of it. It is lawful in several cases: repentance, which is due at once; the burial, which is recommended once death is certain; payment of a debt when due, which is required; breaking the fast at sunset, which is a sunna; the pilgrim's early departure on the second day of the tashriq, which is a concession; prayer before its time, unlawful except in combining; zakat before the year, disputed; and expiations after their cause, disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5385} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5386} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5387} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5388} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5389} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5390} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5391} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5392}"
  es: "Ta'jil es hacer algo antes de su tiempo establecido, o al comienzo mismo del mismo. Es lícito en varios casos: el arrepentimiento, que debe realizarse de inmediato; el entierro, que se recomienda una vez que la muerte es segura; el pago de una deuda cuando vence, que es obligatorio; romper el ayuno al atardecer, que es una sunna; la salida temprana del peregrino el segundo día del tashriq, que es una concesión; la oración antes de su tiempo, ilícita excepto en combinación; el zakat antes del año, que es discutible; y las expiaciones después de su causa, que son discutibles. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5385} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5386} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5387} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5388} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5389} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5390} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5391} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5392}"
  fr: "Le ta'jil consiste à accomplir une chose avant son heure prévue, ou dès son début. Il est licite dans plusieurs cas: le repentir, qui est dû immédiatement; l'inhumation, recommandée lorsque le décès est certain; le paiement d'une dette à son échéance, qui est obligatoire; la rupture du jeûne au coucher du soleil, qui est une sunna; le départ anticipé du pèlerin le deuxième jour du tashriq, qui est une permission; la prière avant son heure, illicite sauf si elle est combinée; la zakat avant l'année, sujette à controverse; et les expiations après leur date d'échéance, sujettes à controverse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5385} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5386} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5387} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5388} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5389} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5390} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5391} {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.5392}"
