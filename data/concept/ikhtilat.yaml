id: concept/ikhtilat
class: concept
kind: legal
label:
  ar: اختلاط
  en: Ikhtilat (mixing of things and of men and women)
  es: "Ikhtilat (mezcla de cosas y de hombres y mujeres)"
  fr: "Ikhtilat (mélange des choses et des hommes et des femmes)"
summary:
  ar: 'الاختلاط ضم شيء إلى شيء، ويتعدد حكمه بحسب أثره: التحريم فيما اجتمع فيه الحلال والحرام، والتحري فيما اختلط فيه الطاهر بالنجس، والضمان في الوديعة، وبطلان الوصية إذا خلط الموصى به. وفي اختلاط الرجال بالنساء يحرم ما فيه خلوة أو تبرج أو لهو، ويجوز عند الحاجة المشروعة مع مراعاة قواعد الشريعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1938} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1940}.'
  en: 'Ikhtilat is joining one thing to another; its ruling varies with its effect: forbidden where lawful and forbidden are combined, a matter for search where pure and impure are mixed, a liability in a deposit, and voiding a bequest where the bequeathed thing is mixed; in the mixing of men and women what involves seclusion, display or amusement is forbidden, and it is lawful for a lawful need within the rules of the law. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1938} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1940}.'
  es: "Ikhtilat es la unión de una cosa con otra; su regla varía según su efecto: prohibido donde se combinan lo lícito y lo ilícito, objeto de búsqueda donde se mezclan lo puro y lo impuro, obligación en un depósito y anulación de un legado donde lo legado está mezclado; en la mezcla de hombres y mujeres, lo que implica aislamiento, exhibición o diversión está prohibido, y es lícito para una necesidad lícita dentro de las reglas de la ley. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1938} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1940}."
  fr: "L'ikhtilat consiste à joindre une chose à une autre; son statut varie selon son effet: elle est interdite lorsque licite et illicite sont combinés, elle fait l'objet d'une recherche lorsque pur et impur sont mélangés, elle constitue une obligation dans le cadre d'un dépôt et elle annule un legs lorsque la chose léguée est mélangée; dans la mixité des hommes et des femmes, ce qui implique l'isolement, l'exhibitionnisme ou le divertissement est interdit, mais licite pour un besoin légitime dans le respect des règles de la loi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1938} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1940}."
