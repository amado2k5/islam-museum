label:
  ar: اختلاط
  en: Ikhtilat (mixing of things and of men and women)
summary:
  ar: 'الاختلاط ضم شيء إلى شيء، ويتعدد حكمه بحسب أثره: التحريم فيما اجتمع فيه الحلال والحرام، والتحري فيما اختلط فيه الطاهر بالنجس، والضمان في الوديعة، وبطلان الوصية إذا خلط الموصى به. وفي اختلاط الرجال بالنساء يحرم ما فيه خلوة أو تبرج أو لهو، ويجوز عند الحاجة المشروعة مع مراعاة قواعد الشريعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1938} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1940}.'
  en: 'Ikhtilat is joining one thing to another; its ruling varies with its effect: forbidden where lawful and forbidden are combined, a matter for search where pure and impure are mixed, a liability in a deposit, and voiding a bequest where the bequeathed thing is mixed; in the mixing of men and women what involves seclusion, display or amusement is forbidden, and it is lawful for a lawful need within the rules of the law. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1938} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1940}.'
