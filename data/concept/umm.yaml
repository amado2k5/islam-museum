label: { ar: "الأم", en: "Umm (the mother: her rights, status and rulings in fiqh)", es: "Umm (la madre: sus derechos, estatus y normas en el fiqh)", fr: "Umm (la mère: ses droits, son statut et les décisions en matière de fiqh)", ur: "ام ⁦(ماں: اس کے حقوق، حیثیت اور فقہ میں احکام)⁩" }
summary:
  ar: "بر الوالدين واجب على المسلم وإن كانا فاسقين أو كافرين، ومن الأم أولى من الأب بالبر، لحديث: «أمك ثم أمك ثم أمك ثم أبوك». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3397} وأجمعوا على تحريم نكاح الأم النسبية والرضاعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3397} ويجب الإنفاق على الوالدين إن لم يكن لهما كسب ولا مال، وتثبت الحضانة للأم المسلمة، وللأم في الميراث أحوال: السدس، والثلث، وثلث الباقي في مسألتي الغراوين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3398}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3399} ولا يقاد الوالد بولده، ولا تقطع الأم في سرقة مال ولدها، ولا تقبل شهادة الفرع لأصله عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3399}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3400}"
  en: "Honouring the parents is obligatory for a Muslim, even if they are sinful or unbelievers; the mother takes precedence, following the hadith 'your mother, then your mother, then your mother, then your father'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3397} Marriage to a mother by blood or by milk is forbidden by consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3397} Maintenance is due to parents with no earnings or property; custody goes first to a Muslim mother; the mother has three inheritance cases, a sixth, a third, and a third of the remainder in the two named cases. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3398}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3399} A parent is not retaliated against for killing a child, a mother is not cut off for stealing her child's property, and most jurists do not accept one's testimony for the other. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3399}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3400}"
  es: "Honrar a los padres es obligatorio para un musulmán, incluso si son pecadores o no creyentes; la madre tiene precedencia, según el hadiz 'tu madre, luego tu madre, luego tu madre, luego tu padre'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3397} El matrimonio con una madre por sangre o por leche está prohibido por consenso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3397} La manutención se debe a los padres sin ingresos ni propiedades; la custodia corresponde primero a una madre musulmana; la madre tiene tres casos de herencia, un sexto, un tercio y un tercio del remanente en los dos casos mencionados. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3398}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3399} Un padre no es objeto de represalias por matar a un hijo, una madre no es desheredada por robar la propiedad de su hijo, y la mayoría de los juristas no aceptan el testimonio de uno en lugar del del otro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3399}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3400}"
  fr: "Le respect des parents est obligatoire pour un musulman, même s'ils sont pécheurs ou mécréants; la mère prime, conformément au hadith « ta mère, puis ta mère, puis ta mère, puis ton père ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3397} Le mariage avec une mère, qu'elle soit par le sang ou par le lait, est interdit par consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3397} Une pension alimentaire est due aux parents sans revenus ni biens; la garde des enfants revient en premier lieu à la mère musulmane; celle-ci possède trois parts d'héritage: un sixième, un tiers et un tiers du reste des deux parts déjà attribuées. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3398}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3399} On ne punit pas un parent qui tue son enfant, on ne déshérite pas une mère qui vole les biens de son enfant, et la plupart des juristes n'acceptent pas le témoignage d'une personne contre celle d'une autre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3399}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3400}"
  ur: "والدین کی تعظیم ایک مسلمان پر واجب ہے، خواہ وہ گناہ گار ہوں یا کافر۔ ماں کو فوقیت حاصل ہے، حدیث کے مطابق 'تمہاری ماں، پھر تمہاری ماں، پھر تمہاری ماں، پھر تمہارا باپ'۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3397} خون یا دودھ کے ذریعے ماں سے نکاح اجماع سے حرام ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3397} کفالت والدین پر ہے جس کی کوئی کمائی یا جائیداد نہیں ہے۔ سب سے پہلے مسلمان ماں کی تحویل میں جاتا ہے۔ ماں کے پاس وراثت کے تین مقدمات ہیں، ایک چھٹا، ایک تہائی، اور ایک تہائی باقی دو مقدمات میں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3398}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3399} بچے کو قتل کرنے پر والدین سے انتقام نہیں لیا جاتا، ماں کو اپنے بچے کا مال چوری کرنے پر نہیں کاٹا جاتا، اور اکثر فقہا دوسرے کی گواہی کو قبول نہیں کرتے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3399}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3400}"
