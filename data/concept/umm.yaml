label: { ar: "الأم", en: "Umm (the mother: her rights, status and rulings in fiqh)" }
summary:
  ar: "بر الوالدين واجب على المسلم وإن كانا فاسقين أو كافرين، ومن الأم أولى من الأب بالبر، لحديث: «أمك ثم أمك ثم أمك ثم أبوك». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3397} وأجمعوا على تحريم نكاح الأم النسبية والرضاعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3397} ويجب الإنفاق على الوالدين إن لم يكن لهما كسب ولا مال، وتثبت الحضانة للأم المسلمة، وللأم في الميراث أحوال: السدس، والثلث، وثلث الباقي في مسألتي الغراوين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3398}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3399} ولا يقاد الوالد بولده، ولا تقطع الأم في سرقة مال ولدها، ولا تقبل شهادة الفرع لأصله عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3399}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3400}"
  en: "Honouring the parents is obligatory for a Muslim, even if they are sinful or unbelievers; the mother takes precedence, following the hadith 'your mother, then your mother, then your mother, then your father'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3397} Marriage to a mother by blood or by milk is forbidden by consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3397} Maintenance is due to parents with no earnings or property; custody goes first to a Muslim mother; the mother has three inheritance cases, a sixth, a third, and a third of the remainder in the two named cases. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3398}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3399} A parent is not retaliated against for killing a child, a mother is not cut off for stealing her child's property, and most jurists do not accept one's testimony for the other. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3399}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3400}"
