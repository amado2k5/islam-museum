summary:
  ar: "عرقون في الكتاب نبات ينقل عن ديسقوريدوس أن ورقه كورق شقائق النعمان وأصله مستدير حماس يؤكل، يحلل الرياح، ويذكر صنفا آخر ورقه كالملوخية ولا فائدة له في الطب عند الكتاب {cite:canon-ibn-sina-print-v1 p.621}"
  en: "Irqun is in the book a plant whose leaf, as reported from Dioscorides, is like that of the anemone and whose root is round and pungent and eaten; it dissolves wind, and the book mentions a second kind with a leaf like mallow that has no use in medicine {cite:canon-ibn-sina-print-v1 p.621}"
  ur: "عرقون کتاب میں ایک پودا ہے جس کے پتے، دیسقوریدوس سے نقل کے مطابق، شقائق النعمان کے پتوں جیسے اور جڑ گول تیز ذائقے والی کھائی جانے والی ہے؛ ہوا کو تحلیل کرتا ہے، اور کتاب ایک اور قسم کا ذکر کرتی ہے جس کے پتے ملوخیہ جیسے ہیں اور طب میں اس کا کوئی فائدہ نہیں {cite:canon-ibn-sina-print-v1 p.621}۔"
  es: "En el libro, Irqun es una planta cuya hoja, según Dioscórides, es como la de la anémona y cuya raíz es redonda, picante y comestible; disuelve el viento, y el libro menciona una segunda especie con una hoja parecida a la malva que no tiene utilidad en medicina {cite:canon-ibn-sina-print-v1 p.621}."
