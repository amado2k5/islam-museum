label:
  ar: "طين مطلق"
  en: "Tin mutlaq (earth of all places)"
  ur: "طین مطلق"
  es: "Tin mutlaq (tierra de todos los lugares)"
  fr: "Tin mutlaq (terre de tous les lieux)"
  tr: "tam bir çamur"
  id: "lumpur mutlak"
summary:
  ar: "طين كل المواضع، كله مبرد، مجفف جال، والطين الحار من الأرض الشمسية يشد الأبدان الرهلة، وينفع المستسقين والمطحولين طلاء."
  en: "Earth from all places, all cooling; a drying and cleansing earth, and the hot earth of sunny ground firms loose flesh and helps those with dropsy and spleen trouble when applied."
  ur: "ہر جگہ کی مٹی، سب ٹھنڈک دینے والی؛ خشک کرنے والی اور صاف کرنے والی، اور دھوپ والی زمین کی گرم مٹی ڈھیلا گوشت کستی ہے اور استسقاء اور تلی کے مریضوں کو لیپ سے فائدہ دیتی ہے۔"
  es: "Tierra de todas partes, toda refrescante; una tierra que seca y limpia, y la tierra caliente de los terrenos soleados reafirma la carne flácida y ayuda a quienes padecen hidropesía y problemas de bazo cuando se aplica."
  fr: "De la terre de tous les lieux, rafraîchissante; une terre asséchante et purificatrice, et la terre chaude des terres ensoleillées raffermit la chair flasque et aide ceux qui souffrent d'hydropisie et de troubles de la rate lorsqu'on l'applique."
  tr: "Soğutulmuş, kurutulmuş ve kurutulmuş kil—ve güneş dünyasından gelen sıcak kil, vücudu sıkılaştırır ve yağmur arayanlara ve dönüşenlere bir kaplama olarak fayda sağlar."
  id: "Tanah liat dari semua tempat—dingin, kering, dan kering—dan tanah liat panas dari bumi matahari mengencangkan tubuh dan menguntungkan mereka yang mencari hujan dan yang berubah sebagai lapisan lapisan."
