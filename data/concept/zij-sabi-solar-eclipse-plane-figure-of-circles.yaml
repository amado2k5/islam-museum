class: concept
kind: scientific
label: { ar: "تصوير كسوف الشمس بالدوائر على السطح", en: "Drawing a solar eclipse as circles on a plane", ur: "سورج گرہن کو سطح پر دائروں سے دکھانا" }
summary:
  ar: "يُرسم دائرة نصف القطرين على مركز ومعها دائرة نصف القطر الشمسي على المركز نفسه، ويُقسم كل من الدائرتين بخطين متقاطعين على زوايا قائمة، وتُعلَّم عليهما جهات الآفاق. ثم يُؤخذ عرض القمر المرئي لبدء الكسوف ولوسطه ولتمام الانجلاء فتُعلَّم العلامات على الخط المقسوم، وتُرسم دوائر القمر عليها، فما وقع من دائرة الشمس داخل دائرة القمر لوسط الكسوف فهو ما ينكسف من الشمس. وتتماس دائرة بدء الكسوف ودائرة تمام الانجلاء مع دائرة الشمس. {cite:zij-sabi-nallino-byblion pp.173-175}"
  en: "A circle of the sum of the radii is drawn around a centre, with the solar circle inside it on the same centre. Both circles are divided by two crossing lines at right angles and the horizon directions are marked. The visible latitudes at the beginning, the middle and the end are then laid off on the dividing line, and the circles of the Moon are drawn through them; the part of the solar circle that falls inside the middle Moon circle is the part eclipsed. The circles for the beginning and the end touch the solar circle. {cite:zij-sabi-nallino-byblion pp.173-175}"
  ur: "ایک مرکز کے گرد نصف قطروں کے مجموعے کا دائرہ کھینچا جاتا ہے، اور اسی مرکز پر اندر سورج کا دائرہ۔ دونوں دائرے دو متقاطع خطوط سے قائمہ زاویوں پر تقسیم ہوتے ہیں اور افقی سمتیں نشان زد ہوتی ہیں۔ پھر آغاز، وسط اور اختتام کے مرئی عرض تقسیمی خط پر رکھے جاتے ہیں اور ان سے چاند کے دائرے کھینچے جاتے ہیں؛ سورج کے دائرے کا جو حصہ وسط کے چاند کے دائرے کے اندر آئے وہی گرہن زدہ ہے۔ آغاز اور اختتام کے دائرے سورج کے دائرے کو چھوتے ہیں۔ {cite:zij-sabi-nallino-byblion pp.173-175}"
