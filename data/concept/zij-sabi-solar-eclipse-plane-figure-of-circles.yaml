id: concept/zij-sabi-solar-eclipse-plane-figure-of-circles
class: concept
kind: scientific
label: { ar: "تصوير كسوف الشمس بالدوائر على السطح", en: "Drawing a solar eclipse as circles on a plane", ur: "سورج گرہن کو سطح پر دائروں سے دکھانا", es: "Dibujar un eclipse solar como círculos en un plano.", fr: "Représenter une éclipse solaire par des cercles sur un plan", tr: "Bir yüzey üzerindeki daireler kullanarak güneş tutulmasının fotoğrafını çekmek.", id: "Memotret gerhana matahari menggunakan lingkaran di permukaan." }
summary:
  ar: "يُرسم دائرة نصف القطرين على مركز ومعها دائرة نصف القطر الشمسي على المركز نفسه، ويُقسم كل من الدائرتين بخطين متقاطعين على زوايا قائمة، وتُعلَّم عليهما جهات الآفاق. ثم يُؤخذ عرض القمر المرئي لبدء الكسوف ولوسطه ولتمام الانجلاء فتُعلَّم العلامات على الخط المقسوم، وتُرسم دوائر القمر عليها، فما وقع من دائرة الشمس داخل دائرة القمر لوسط الكسوف فهو ما ينكسف من الشمس. وتتماس دائرة بدء الكسوف ودائرة تمام الانجلاء مع دائرة الشمس. {cite:zij-sabi-nallino-byblion pp.173-175}"
  en: "A circle of the sum of the radii is drawn around a centre, with the solar circle inside it on the same centre. Both circles are divided by two crossing lines at right angles and the horizon directions are marked. The visible latitudes at the beginning, the middle and the end are then laid off on the dividing line, and the circles of the Moon are drawn through them; the part of the solar circle that falls inside the middle Moon circle is the part eclipsed. The circles for the beginning and the end touch the solar circle. {cite:zij-sabi-nallino-byblion pp.173-175}"
  ur: "ایک مرکز کے گرد نصف قطروں کے مجموعے کا دائرہ کھینچا جاتا ہے، اور اسی مرکز پر اندر سورج کا دائرہ۔ دونوں دائرے دو متقاطع خطوط سے قائمہ زاویوں پر تقسیم ہوتے ہیں اور افقی سمتیں نشان زد ہوتی ہیں۔ پھر آغاز، وسط اور اختتام کے مرئی عرض تقسیمی خط پر رکھے جاتے ہیں اور ان سے چاند کے دائرے کھینچے جاتے ہیں؛ سورج کے دائرے کا جو حصہ وسط کے چاند کے دائرے کے اندر آئے وہی گرہن زدہ ہے۔ آغاز اور اختتام کے دائرے سورج کے دائرے کو چھوتے ہیں۔ {cite:zij-sabi-nallino-byblion pp.173-175}"
  es: "Se traza un círculo cuya suma es igual a la de sus radios alrededor de un centro, con el círculo solar dentro de él, sobre el mismo centro. Ambos círculos se dividen mediante dos líneas perpendiculares que se cruzan, y se marcan las direcciones del horizonte. A continuación, se trazan las latitudes visibles al principio, en el medio y al final sobre la línea divisoria, y se dibujan los círculos de la Luna a través de ellos; la parte del círculo solar que queda dentro del círculo lunar central es la parte eclipsada. Los círculos del principio y del final tocan el círculo solar. {cite:zij-sabi-nallino-byblion pp.173-175}"
  fr: "On trace un cercle dont le rayon est la somme des rayons autour d'un centre, le cercle solaire étant inscrit à l'intérieur de ce cercle et centré au même endroit. Les deux cercles sont divisés par deux lignes perpendiculaires qui se croisent, et les directions de l'horizon sont marquées. Les latitudes visibles au début, au milieu et à la fin sont ensuite reportées sur la ligne de division, et les cercles de la Lune sont tracés à travers ces lignes; la portion du cercle solaire qui se trouve à l'intérieur du cercle lunaire central est la portion éclipsée. Les cercles du début et de la fin sont tangents au cercle solaire. {cite:zij-sabi-nallino-byblion pp.173-175}"
  tr: "Merkezde iki yarıçapın yarıçapı kadar bir daire çizilir ve aynı merkezde güneş yarıçapı kadar bir daire daha çizilir. Bu dairelerin her biri daha sonra dik açıyla kesişen iki çizgiyle bölünür ve bu çizgiler üzerinde ana yönler işaretlenir. Tutulmanın başlangıcında, ortasında ve sonunda ayın görünen genişliği ölçülür ve bölünen çizgi üzerinde işaretlenir. Bu çizgiler üzerinde ayın çemberleri çizilir ve tutulmanın ortasında ayın çemberi içinde kalan güneş yörüngesinin kısmı, güneşin tutulan kısmıdır. Tutulmanın başlangıcındaki çember ve tutulmanın sonundaki çember, güneşin çemberine teğettir. {cite:zij-sabi-nallino-byblion pp.173-175}"
  id: "Sebuah lingkaran dengan jari-jari kedua matahari digambar di tengah, dan sebuah lingkaran dengan jari-jari matahari digambar di pusat yang sama. Masing-masing lingkaran ini kemudian dibagi oleh dua garis yang berpotongan tegak lurus, dan arah mata angin ditandai pada garis-garis ini. Lebar bulan yang terlihat pada awal, tengah, dan akhir gerhana kemudian diukur dan ditandai pada garis yang dibagi. Lingkaran bulan digambar pada garis-garis ini, dan bagian orbit matahari yang berada di dalam lingkaran bulan pada tengah gerhana adalah bagian matahari yang mengalami gerhana. Lingkaran pada awal gerhana dan lingkaran pada akhir gerhana bersinggungan dengan lingkaran matahari. {cite:zij-sabi-nallino-byblion pp.173-175}"
