id: concept/al-sunna-al-nabawiyya
class: concept
kind: term
label:
  ar: السنة النبوية
  en: The Prophetic Sunna
  fr: "La Sunna prophétique"
  es: "La Sunna profética"
summary:
  ar: "السنة في اللغة الطريقة، محمودةً كانت أو مذمومة، وهي عند المحدثين كل ما أُثر عن النبي من قول أو فعل أو تقرير أو صفة خَلقية أو خُلقية أو سيرة قبل البعثة وبعدها، وعند الأصوليين ما نُقل عنه من قول أو فعل أو تقرير يثبت حكماً شرعياً {cite:manhaj-tawthiq-al-sunna-azhar p. 24}{cite:manhaj-tawthiq-al-sunna-azhar p. 25}. وهي الأصل الثاني للأحكام بعد القرآن: القرآن يُتعبد بلفظه ونُقل بالتواتر، والسنة لفظها غير متعبد به، والمقطوع به جملتها لا تفصيلها، وهي بيان للكتاب {cite:manhaj-tawthiq-al-sunna-azhar p. 22}. ونقل المؤلف عن الشافعي أن الحكمة المقرونة بالكتاب في الآيات هي السنة، وأنها ما صدر عن النبي من أحكام وأقوال في معرض التشريع، وهو ما ذهب إليه جمهور المحققين {cite:manhaj-tawthiq-al-sunna-azhar p. 26}{cite:manhaj-tawthiq-al-sunna-azhar p. 27}. ويعدّ الشيخ علي الخفيف السنة تابعة للقرآن مبينة له: تفصّل مجمله وتقيّد مطلقه وتخصّص عامه، ولا تخالفه ولا تأتي بشريعة جديدة لا يدل عليها القرآن دلالة إجمالية {cite:makanat-al-sunna-azhar p. 30}{cite:makanat-al-sunna-azhar p. 31}{cite:makanat-al-sunna-azhar p. 38}."
  fr: "Dans l’usage courant, la sunna est une manière d’agir, qu’elle soit louable ou blâmable. Pour les spécialistes du hadith, elle comprend tout ce qui est transmis du Prophète : paroles, actes, approbations, traits physiques ou moraux et biographie avant et après le début de sa mission. Pour les spécialistes des fondements du droit, elle désigne ce qui est transmis de lui comme parole, acte ou approbation qui établit une règle de droit religieux {cite:manhaj-tawthiq-al-sunna-azhar p. 24}{cite:manhaj-tawthiq-al-sunna-azhar p. 25}. Elle est le deuxième fondement des règles après le Coran : la récitation des mots mêmes du Coran est un acte d’adoration et son texte est transmis par des voies multiples concordantes (tawatur). Tel n’est pas le statut du libellé de la Sunna, dont l’ensemble est tenu pour certain, mais non chaque détail ; elle explicite le Livre {cite:manhaj-tawthiq-al-sunna-azhar p. 22}. L’auteur rapporte qu’al-Shafi’i identifie la sagesse associée au Livre dans les versets à la Sunna, c’est-à-dire aux règles et aux paroles du Prophète énoncées dans un cadre législatif. C’est aussi la position de la majorité des savants qui ont examiné la question {cite:manhaj-tawthiq-al-sunna-azhar p. 26}{cite:manhaj-tawthiq-al-sunna-azhar p. 27}. Le cheikh Ali al-Khafif considère que la Sunna suit le Coran et en explicite le sens : elle détaille ses énoncés synthétiques, restreint ceux qui sont formulés sans restriction et précise la portée de ceux qui sont généraux. Elle ne le contredit pas et n’introduit pas de législation nouvelle qui ne soit pas indiquée, au moins dans ses grandes lignes, dans le Coran {cite:makanat-al-sunna-azhar p. 30}{cite:makanat-al-sunna-azhar p. 31}{cite:makanat-al-sunna-azhar p. 38}."
