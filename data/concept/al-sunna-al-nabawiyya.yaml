label:
  ar: السنة النبوية
  en: The Prophetic Sunna
summary:
  ar: "السنة في اللغة الطريقة، محمودةً كانت أو مذمومة، وهي عند المحدثين كل ما أُثر عن النبي من قول أو فعل أو تقرير أو صفة خَلقية أو خُلقية أو سيرة قبل البعثة وبعدها، وعند الأصوليين ما نُقل عنه من قول أو فعل أو تقرير يثبت حكماً شرعياً {cite:manhaj-tawthiq-al-sunna-azhar p. 24}{cite:manhaj-tawthiq-al-sunna-azhar p. 25}. وهي الأصل الثاني للأحكام بعد القرآن: القرآن يُتعبد بلفظه ونُقل بالتواتر، والسنة لفظها غير متعبد به، والمقطوع به جملتها لا تفصيلها، وهي بيان للكتاب {cite:manhaj-tawthiq-al-sunna-azhar p. 22}. ونقل المؤلف عن الشافعي أن الحكمة المقرونة بالكتاب في الآيات هي السنة، وأنها ما صدر عن النبي من أحكام وأقوال في معرض التشريع، وهو ما ذهب إليه جمهور المحققين {cite:manhaj-tawthiq-al-sunna-azhar p. 26}{cite:manhaj-tawthiq-al-sunna-azhar p. 27}. ويعدّ الشيخ علي الخفيف السنة تابعة للقرآن مبينة له: تفصّل مجمله وتقيّد مطلقه وتخصّص عامه، ولا تخالفه ولا تأتي بشريعة جديدة لا يدل عليها القرآن دلالة إجمالية {cite:makanat-al-sunna-azhar p. 30}{cite:makanat-al-sunna-azhar p. 31}{cite:makanat-al-sunna-azhar p. 38}."
