label: { ar: "المساكن وأثرها في البدن عند ابن سينا", en: "Dwellings and their effects on the body in the Canon", ur: "قانون میں مسکن اور بدن پر ان کا اثر", es: "Las viviendas y sus efectos en el cuerpo en el canon.", fr: "Les habitations et leurs effets sur le corps dans le Canon", tr: "İbn Sina'ya göre ikametgahlar ve beden üzerindeki etkileri", id: "Tempat tinggal dan pengaruhnya pada tubuh menurut Ibn Sina" }
summary:
  ar: "في الفصل الحادي عشر، في موجبات المساكن، يعيد ابن سينا بإيجاز ما ذكره عن المساكن في باب تغيرات الهواء على ترتيب آخر، ولا يبالي بتكرار بعض ما سلف {cite:canon-ibn-sina-print-v1 p.126}."
  en: "In the eleventh chapter, on the causes that lie in dwellings, Ibn Sina restates briefly, in another order, what he said of dwellings in the chapter on changes of the air, and does not mind repeating some of it {cite:canon-ibn-sina-print-v1 p.126}."
  es: "En el capítulo once, sobre las causas que residen en las viviendas, Ibn Sina reitera brevemente, en otro orden, lo que dijo sobre las viviendas en el capítulo sobre los cambios del aire, y no le importa repetir algo de ello {cite:canon-ibn-sina-print-v1 p.126}."
  fr: "Dans le onzième chapitre, sur les causes qui résident dans les habitations, Ibn Sina reprend brièvement, dans un autre ordre, ce qu'il a dit des habitations dans le chapitre sur les changements de l'air, et ne voit aucun inconvénient à en répéter une partie {cite:canon-ibn-sina-print-v1 p.126}."
  ur: "گیارھویں باب میں مکانات کے اسباب پر ابن سینا نے مختصراً ایک اور ترتیب میں بیان کیا ہے کہ اس نے ہوا کی تبدیلی کے باب میں مکانات کے بارے میں کیا کہا ہے اور اس میں سے کچھ کو دہرانے میں کوئی اعتراض نہیں ہے۔"
  tr: "On birinci bölümde, konutların nedenleri üzerine, İbn Sina, hava değişimleri bölümünde konutlar hakkında bahsettiği şeyleri farklı bir sırayla tekrarlar, önceki {cite:canon-ibn-sina-print-v1 s.126} gibi bazı ifadeleri tereddüt etmeden tekrarlar."
  id: "Pada bab sebelas, tentang penyebab tempat tinggal, Ibn Sina secara singkat mengulangi apa yang ia sebutkan tentang tempat tinggal dalam bab perubahan udara dalam urutan berbeda, tanpa ragu mengulangi beberapa dari sebelumnya {cite:canon-ibn-sina-print-v1 hlm.126}."
