summary:
  ar: "في الفصل الحادي عشر، في موجبات المساكن، يعيد ابن سينا بإيجاز ما ذكره عن المساكن في باب تغيرات الهواء على ترتيب آخر، ولا يبالي بتكرار بعض ما سلف {cite:canon-ibn-sina-print-v1 p.126}."
  en: "In the eleventh chapter, on the causes that lie in dwellings, Ibn Sina restates briefly, in another order, what he said of dwellings in the chapter on changes of the air, and does not mind repeating some of it {cite:canon-ibn-sina-print-v1 p.126}."
  es: "En el capítulo once, sobre las causas que residen en las viviendas, Ibn Sina reitera brevemente, en otro orden, lo que dijo sobre las viviendas en el capítulo sobre los cambios del aire, y no le importa repetir algo de ello {cite:canon-ibn-sina-print-v1 p.126}."
  fr: "Dans le onzième chapitre, sur les causes qui résident dans les habitations, Ibn Sina reprend brièvement, dans un autre ordre, ce qu'il a dit des habitations dans le chapitre sur les changements de l'air, et ne voit aucun inconvénient à en répéter une partie {cite:canon-ibn-sina-print-v1 p.126}."
