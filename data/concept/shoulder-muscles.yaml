id: concept/shoulder-muscles
class: concept
kind: scientific
label: { ar: "عضل حركة العضد عند ابن سينا", en: "Muscles that move the upper arm in the Canon", ur: "قانون میں بازو کو حرکت دینے والے پٹھے", es: "Músculos que mueven el brazo superior en el Canon", fr: "Muscles qui mobilisent le bras dans le canon", tr: "İbn Sina'da humerus hareketi kası", id: "Otot gerakan humerus pada Avicenna" }
summary:
  ar: "يذكر ابن سينا لمفصل الكتف ثلاث عضل تأتيها من الصدر وتجذبها إلى أسفل، وعضلتين من ناحية الخاصرة، وخمس عضل من عظم الكتف، وعضلة ذات رأسين {cite:canon-ibn-sina-print-v1 pp.68-69}."
  en: "For the shoulder joint Ibn Sina lists three muscles coming from the chest and drawing it down, two from the flank, five from the shoulder blade, and a two-headed muscle {cite:canon-ibn-sina-print-v1 pp.68-69}."
  es: "Para la articulación del hombro, Ibn Sina enumera tres músculos que salen del pecho y lo tiran hacia abajo, dos del flanco, cinco del omóplato y un músculo de dos cabezas {cite:canon-ibn-sina-print-v1 pp.68-69}."
  fr: "Pour l'articulation de l'épaule, Ibn Sina énumère trois muscles venant de la poitrine et la tirant vers le bas, deux du flanc, cinq de l'omoplate et un muscle à deux têtes {cite:canon-ibn-sina-print-v1 pp.68-69}."
  ur: "کندھے کے جوڑ کے لیے ابن سینا نے تین عضلات درج کیے ہیں جو سینے سے آتے ہیں اور اسے نیچے کھینچتے ہیں، دو پہلو سے، پانچ کندھے کے بلیڈ سے، اور دو سروں والا عضلہ۔"
  tr: "İbn Sina, göğüsten çıkan ve onu aşağı çeken üç kas, yan tarafta iki kas, omuz kemiğinde beş kas ve bir pazıdan bahseder {cite:canon-ibn-sina-print-v1 s.68-69}."
  id: "Ibn Sina menyebutkan tiga otot yang keluar dari dada dan menariknya ke bawah, dua otot di sisi tubuh, lima otot di tulang bahu, dan sebuah bisep {cite:canon-ibn-sina-print-v1 hlm.68-69}."
