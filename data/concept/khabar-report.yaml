label: { ar: "الخبر", en: "Khabar (report and its kinds; its evidential force)", ur: "خبر" }
summary:
  ar: "الخبر لغة ما ينقل ويتحدث به، وعند المحدثين مرادف للحديث في الغالب، والأثر أعم من الخبر في إطلاقاته، والنبأ خبر ذو فائدة عظيمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7537} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7538} ينقسم الخبر عن خاص إلى الإقرار والبينة والدعوى، وعن عام إلى الرواية والحكم والفتوى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7538} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7539} يقبل خبر الثقة بنجاسة الماء أو الثوب أو الطعام إذا بيّن السبب، ولا يقبل خبر الكافر والفاسق والمجنون في ذلك، واختلف في خبر الصبي المميز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7539} ويقبل خبر الثقة عن القبلة عند الجمهور، ولا يقبل خبر الكافر والمجنون والصبي غير المميز، واختلف في الصبي المميز والفاسق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7540} وفي رؤية هلال رمضان: يقبل خبر الواحد العدل عند الشافعية والحنابلة وأبي حنيفة في رواية، والحنفية يشترطون عددا من الشهود إن كانت السماء صحوا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7540} "
  en: "Khabar (report) lexically is what is conveyed and spoken of; among the traditionists it usually means the same as hadith, athar is wider, and naba' is a report of great benefit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7537} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7538} A report about a particular matter is confession, testimony or claim; a report about a general matter is narration, judgement or legal opinion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7538} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7539} A trusted man's report that water, cloth or food is impure is accepted when he states the cause; an unbeliever, a sinner or a madman is not believed in impurity, and the discerning child is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7539} The report of a trusted man about the qibla is accepted by the majority; the unbeliever, the mad and the non-discerning child are rejected, and the discerning child and the sinner are disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7540} On the sighting of the Ramadan crescent, the Shafiis, Hanbalis and a Hanafi report accept one just witness; the Hanafis require several witnesses when the sky is clear. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7540} "
  ur: "خبر لغت میں اس چیز کو کہتے ہیں جو نقل کی جائے اور بیان کی جائے؛ محدثین کے نزدیک یہ عام طور پر حدیث کے ہم معنی ہے، اثر اس سے عام ہے، اور نبأ وہ خبر ہے جس کی بڑی فائدہ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7537} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7538} خاص امر کی خبر اقرار، بینہ یا دعوی ہے، اور عام امر کی خبر روایت، حکم یا فتویٰ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7538} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7539} عادل شخص کی خبر کہ پانی، کپڑا یا کھانا ناپاک ہے، سبب بیان کرنے پر قبول ہے؛ کافر، فاسق اور مجنون کی خبر نجاست میں قبول نہیں، اور ممیز بچے کے بارے میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7539} قبلے کی خبر جمہور کے نزدیک ثقہ شخص کی قابل قبول ہے؛ کافر، مجنون اور غیر ممیز بچہ مردود ہیں، اور ممیز بچے اور فاسق میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7540} رمضان کے چاند کی رؤیت میں شافعیہ، حنابلہ اور امام ابوحنیفہ کی ایک روایت کے مطابق ایک عادل شخص کی خبر قبول ہے، جبکہ حنفیہ صاف آسمان میں متعدد گواہ شرط کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7540} "
