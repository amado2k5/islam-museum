label: { ar: "موضع الكوكب المتحير من اليوم والساعة", en: "The mean position of a wandering planet from the day and hour", ur: "دن اور گھنٹے سے متحیر سیارے کا موضع", es: "La posición media de un planeta errante desde el día y la hora", fr: "La position moyenne d'une planète errante en fonction du jour et de l'heure" }
summary:
  ar: "لمعرفة موضع الكوكب المتحير من فلك البروج يُعرف وسط الكوكب في اليوم المطلوب والساعة المفروضة بأي التاريخين شئت، عربياً أو رومياً، ويُعرف وسط الشمس في الوقت نفسه. فإن كان الحساب لزحل والمشتري والمريخ نُقص وسط أيها شئت من وسط الشمس فما بقي فهو المقام. وإن كان الحساب للزهرة وعطارد فإن الذي يخرج من الجدول هو حاصة الكوكب ووسط الشمس، وهما المستعملان بدلاً من وسطيهما. {cite:zij-sabi-nallino-byblion pp.175-176}"
  en: "To find where a wandering planet lies on the ecliptic, its mean is found for the required day and the given hour, under either the Arab or the Roman dating, and the Sun's mean is found for the same moment. For Saturn, Jupiter and Mars, the planet's mean is subtracted from the Sun's mean and the remainder is the anomaly used. For Venus and Mercury the table gives the planet's anomaly together with the Sun's mean, and these two are used in place of the planet's own mean and the Sun's mean. {cite:zij-sabi-nallino-byblion pp.175-176}"
  ur: "متحیر سیارے کا فلکِ البروج پر مقام معلوم کرنے کے لیے مطلوبہ دن اور دیے گئے گھنٹے کے لیے، عربی یا رومی تاریخ میں سے جو چاہیں، سیارے کا وسط معلوم کیا جاتا ہے، اور اسی لمحے کا سورج کا وسط۔ زحل، مشتری اور مریخ کے لیے سورج کے وسط میں سے سیارے کا وسط گھٹایا جاتا ہے اور باقی مقام ہے۔ زہرہ اور عطارد کے لیے جدول سے جو قیمت نکلتی ہے وہ سیارے کی خاصہ اور سورج کا وسط ہے، اور یہ دونوں اپنے اپنے وسط کی جگہ لیتے ہیں۔ {cite:zij-sabi-nallino-byblion pp.175-176}"
  es: "Para determinar la posición de un planeta errante en la eclíptica, se calcula su media para el día y la hora requeridos, según el calendario árabe o romano, y la media del Sol para el mismo instante. Para Saturno, Júpiter y Marte, se resta la media del planeta a la media del Sol y el resultado es la anomalía utilizada. Para Venus y Mercurio, la tabla proporciona la anomalía del planeta junto con la media del Sol, y estas dos se utilizan en lugar de la media del planeta y la media del Sol. {cite:zij-sabi-nallino-byblion pp.175-176}"
  fr: "Pour déterminer la position d'une planète errante sur l'écliptique, on calcule sa moyenne pour le jour et l'heure donnés, selon le calendrier arabe ou romain, et on calcule la moyenne du Soleil au même instant. Pour Saturne, Jupiter et Mars, on soustrait la moyenne de la planète à celle du Soleil, et le résultat correspond à l'anomalie. Pour Vénus et Mercure, le tableau indique l'anomalie de la planète ainsi que sa moyenne solaire; ces deux valeurs sont utilisées à la place de la moyenne propre à la planète et de la moyenne solaire. {cite:zij-sabi-nallino-byblion pp.175-176}"
