summary:
  ar: "القرظ في الكتاب، نقلا عن ديسقوريدوس، عصارة شجرة شوكية تنبت بمصر وغيرها يسميها بعض الناس أقاقيا، ومنها يكون الصمغ العربي، ويذكر الكتاب علامات جيدها ورديئها وصنفا آخر أصغر ينبت في قيادوقيا أضعف قوة، وأن قوتها مغرية تقمع حدة الأدوية الحارة إذا خلطت بها {cite:canon-ibn-sina-print-v1 pp.660-661}"
  en: "Qaraz is in the book, on the authority of Dioscorides, the sap of a thorny tree that grows in Egypt and elsewhere, which some people call aqaqiya; gum arabic comes from the same thorn; the book gives the marks of its good and poor kinds, and another, smaller kind that grows in Cappadocia and is weaker, and says that its power is gluey and curbs the sharpness of hot drugs when mixed with them {cite:canon-ibn-sina-print-v1 pp.660-661}"
  ur: "قرظ کتاب میں، دیسقوریدوس کے حوالے سے، ایک کانٹے دار درخت کا عرق ہے جو مصر اور دوسری جگہوں میں اگتا ہے اور بعض لوگ اسے اقاقیا کہتے ہیں؛ گوند عربی اسی کانٹے دار درخت سے ہوتی ہے؛ کتاب اس کی اچھی اور ناقص قسموں کی علامتیں اور قیادوقیا میں اگنے والی ایک چھوٹی اور کمزور قسم بتاتی ہے، اور یہ کہ اس کی قوت چپکنے والی ہے جو گرم دواؤں میں ملانے پر ان کی تیزی کو دباتی ہے {cite:canon-ibn-sina-print-v1 pp.660-661}۔"
  es: "En el libro, según Dioscórides, Qaraz es la savia de un árbol espinoso que crece en Egipto y otros lugares, al que algunos llaman aqaqiya; la goma arábiga proviene de la misma espina. El libro describe las características de sus variedades buenas y malas, y otra variedad más pequeña que crece en Capadocia y es más débil, y dice que su poder es pegajoso y reduce la agudeza de las drogas calientes cuando se mezcla con ellas {cite:canon-ibn-sina-print-v1 pp.660-661}."
  fr: "Le qaraz est mentionné dans le livre, d'après Dioscoride, comme la sève d'un arbre épineux poussant en Égypte et ailleurs, que certains appellent aqaqiya; la gomme arabique provient de la même épine; le livre donne les caractéristiques de ses bonnes et mauvaises variétés, ainsi que d'une autre variété, plus petite, qui pousse en Cappadoce et est plus faible, et dit que son pouvoir est collant et atténue la force des drogues chaudes lorsqu'il y est mélangé {cite:canon-ibn-sina-print-v1 pp.660-661}"
