summary:
  ar: "الإسفيداج رماد الرصاص والآنك، شديد التلطيف إذا اتُّخذ بالخلّ؛ يليّن الأورام الباردة، وينبت اللحم في القروح، وينفع من شقاق المقعدة، والحاشية تعدّه سامّاً {cite:canon-ibn-sina-print-v1 p.369} {cite:canon-ibn-sina-print-v1 p.370}."
  en: "Isfidaj is the ash of lead and anak; made with vinegar it is very thinning. It softens cold swellings, grows flesh in ulcers and helps fissure of the anus. A footnote calls it toxic {cite:canon-ibn-sina-print-v1 p.369} {cite:canon-ibn-sina-print-v1 p.370}."
  ur: "اسفیداج سیسے اور آنک کی راکھ ہے؛ سرکے کے ساتھ بنانے سے بہت لطیف ہوتا ہے۔ یہ ٹھنڈی سوجن کو نرم کرتا، زخموں میں گوشت اگاتا اور مقعد کے شگاف میں مفید ہے؛ حاشیہ اسے زہریلا بتاتا ہے {cite:canon-ibn-sina-print-v1 p.369} {cite:canon-ibn-sina-print-v1 p.370}۔"
