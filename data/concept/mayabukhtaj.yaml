summary:
  ar: "الميبختج في الكتاب هو عصير العنب المطبوخ، يعين على النفث ويقع في شراب الخشخاش المعروف بدياقوذا، وينفع من وجع الكلى والمثانة {cite:canon-ibn-sina-print-v1 p.574}."
  en: "Maybukhtaj, in the book, is boiled grape juice; it aids expectoration and enters the poppy syrup known as diaquda, and helps pain of the kidneys and bladder {cite:canon-ibn-sina-print-v1 p.574}."
  ur: "میبختج کتاب میں پکایا ہوا انگور کا رس ہے؛ یہ بلغم نکالنے میں مدد دیتا ہے اور خشخاش کے اس شربت میں شامل ہوتا ہے جو دیاقوذا کہلاتا ہے، اور گردوں اور مثانے کے درد میں مفید ہے {cite:canon-ibn-sina-print-v1 p.574}۔"
  es: "Maybukhtaj, en el libro, es jugo de uva hervido; ayuda a expectorar y entra en el jarabe de amapola conocido como diaquda, y ayuda al dolor de los riñones y la vejiga {cite:canon-ibn-sina-print-v1 p.574}."
  fr: "Le maybukhtaj, dans le livre, est du jus de raisin bouilli; il aide à l'expectoration et entre dans le sirop de pavot connu sous le nom de diaquda, et aide à soulager les douleurs des reins et de la vessie {cite:canon-ibn-sina-print-v1 p.574}."
