summary:
  ar: "القوقي في الكتاب حيوان بحري قوته قريبة من قوة جندبيدستر، وينفع لحمه من الصرع، ويذكر الكتاب أنه ينفع من اختناق الرحم {cite:canon-ibn-sina-print-v1 p.659}"
  en: "Qawqi is in the book a sea animal whose power is near that of jandbidastar; its flesh benefits epilepsy; and the book lists that it benefits suffocation of the womb {cite:canon-ibn-sina-print-v1 p.659}"
  ur: "قوقی کتاب میں ایک سمندری جانور ہے جس کی قوت جندبیدستر کی قوت کے قریب ہے؛ اس کا گوشت مرگی میں نافع ہے؛ اور کتاب میں درج ہے کہ یہ رحم کے گھٹنے میں نافع ہے {cite:canon-ibn-sina-print-v1 p.659}۔"
  es: "En el libro, Qawqi es un animal marino cuyo poder es similar al de Jandbidastar; su carne es beneficiosa para la epilepsia; y el libro menciona que también es beneficiosa para la asfixia uterina {cite:canon-ibn-sina-print-v1 p.659}."
  fr: "Le qawqi est décrit dans le livre comme un animal marin dont la puissance est proche de celle du jandbidastar; sa chair est bénéfique en cas d’épilepsie; et le livre indique qu’elle est bénéfique en cas d’asphyxie utérine {cite:canon-ibn-sina-print-v1 p.659}"
  tr: "Kitaptaki guguk, gundbeidster'a yakın güce sahip bir deniz hayvanıdır ve eti epilepsiye karşı faydalıdır. Kitapta rahim boğulmasına yardımcı olduğu belirtilir {cite:canon-ibn-sina-print-v1 s.659}"
  id: "Cuckoo dalam buku adalah hewan laut dengan kekuatan mendekati gundbeidster, dan dagingnya bermanfaat untuk melawan epilepsi. Buku menyebutkan bahwa cuckoo bermanfaat untuk mencekik rahim {cite:canon-ibn-sina-print-v1 hlm.659}"
