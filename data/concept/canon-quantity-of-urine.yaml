id: concept/canon-quantity-of-urine
class: concept
kind: scientific
label:
  ar: "كثرة البول وقلته عند ابن سينا"
  en: "Abundant and scanty urine in the Canon"
  fr: "Urine abondante ou rare dans le Canon"
  ur: "پیشاب کی زیادتی اور کمی قانون میں"
  es: "Orina abundante y escasa en el Canon"
  tr: "İbn Sina'ya göre aşırı idrara çıkma ve nadirlik"
  id: "Buang air kecil berlebihan dan kelangkaannya menurut Ibn Sina"
summary:
  ar: "يعرض ابن سينا في الفصل السابع دلالات كمية البول: القليل يدل على ضعف القوى، والكثير على ذوبان أو استفراغ فضول، ويفرق بينهما بحال القوة، ويذكر البول المختلف والقطري. {cite:canon-ibn-sina-print-v1 pp.196-197}."
  en: "In chapter seven Ibn Sina sets out what the amount of urine shows: scanty shows weak strength, abundant shows melting or purging of waste, told apart by the state of strength, and he describes erratic and dripping urine. {cite:canon-ibn-sina-print-v1 pp.196-197}."
  fr: "Au chapitre 7, Ibn Sina interprète la quantité d’urine : rareté, faiblesse des forces ; abondance, fonte ou évacuation de déchets, distinguées par l’état des forces. Il décrit aussi l’urine irrégulière et goutte à goutte. {cite:canon-ibn-sina-print-v1 pp.196-197}."
  es: "En el capítulo siete, Ibn Sina expone lo que indica la cantidad de orina: escasa muestra debilidad, abundante indica disolución o purga de desechos, diferenciadas por el estado de fuerza, y describe la orina irregular y el goteo. {cite:canon-ibn-sina-print-v1 pp.196-197}."
  ur: "باب سات میں ابن سینا بیان کرتا ہے کہ پیشاب کی مقدار کیا ظاہر کرتی ہے: کم ہونا کمزور طاقت کو ظاہر کرتا ہے، کثرت سے فضلہ کے پگھلنے یا صاف ہونے کو ظاہر کرتا ہے، طاقت کی حالت سے الگ بتاتا ہے، اور وہ بے ترتیب اور ٹپکنے والے پیشاب کو بیان کرتا ہے۔ {حوالہ: کینن ابن سینا پرنٹ v1 صفحہ 196-197}۔"
  tr: "Yedinci bölümde, İbn Sina idrar miktarının göstergelerini sunar: az miktarda idrar zayıf kuvveti, büyük miktar ise fazla idrarın çözünmesini veya kusmasını gösterir; bunları güçle ayırır ve farklı ile damlacık idrarı belirtir. {cite:canon-ibn-sina-print-v1 s.196-197}."
  id: "Pada bab tujuh, Ibn Sina menyajikan indikasi jumlah urin: sedikit menunjukkan kekuatan lemah, dan jumlah besar menunjukkan pelarutan atau muntah berlebihan, membedakan keduanya berdasarkan kekuatan dan menyebutkan urine yang berbeda dan tetesan. {cite:canon-ibn-sina-print-v1 hlm.196-197}."
