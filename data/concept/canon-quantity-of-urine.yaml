  ar: "يعرض ابن سينا في الفصل السابع دلالات كمية البول: القليل يدل على ضعف القوى، والكثير على ذوبان أو استفراغ فضول، ويفرق بينهما بحال القوة، ويذكر البول المختلف والقطري. {cite:canon-ibn-sina-print-v1 pp.196-197}."
  en: "In chapter seven Ibn Sina sets out what the amount of urine shows: scanty shows weak strength, abundant shows melting or purging of waste, told apart by the state of strength, and he describes erratic and dripping urine. {cite:canon-ibn-sina-print-v1 pp.196-197}."
