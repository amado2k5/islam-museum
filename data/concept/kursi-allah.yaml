id: concept/kursi-allah
class: concept
kind: belief
label: { ar: "الكرسي", en: "The Kursi (seat of God)", ur: "کرسی" }
summary:
  ar: "يفسر الشعراوي الكرسي بأنه السلطان والقهر والقدرة والملك، ويستشهد بالعرف في أن القعود على الكرسي يدل على استتباب الأمر، ويذكر حديث أبي ذر في أن الكرسي بالنسبة للعرش كحلقة في فلاة، ويرى أن الآية تبين عظمة الكرسي بأنه وسع السموات والأرض {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1104} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1105}."
  en: "Sha'rawi glosses the kursi as sovereignty, power and dominion, drawing on usage in which sitting on a seat shows a matter is settled. He reports the hadith of Abu Dhar on the kursi and the throne, and reads the verse as showing the kursi's vastness in that it encompasses the heavens and earth {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1104} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1105}."
  ur: "شعراوی کرسی کو اقتدار، غلبے، قدرت اور بادشاہی کے معنی میں لیتے ہیں، اور اس عرف سے دلیل لاتے ہیں کہ کرسی پر بیٹھنا امر کے مستحکم ہونے کی علامت ہے۔ وہ ابوذر کی حدیث کا ذکر کرتے ہیں کہ کرسی عرش کے مقابلے میں ایک ویران میدان میں حلقے کی طرح ہے، اور آیت کی دلیل سے اس کی وسعت بیان کرتے ہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1104} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1105}۔"
