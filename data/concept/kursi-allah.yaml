id: concept/kursi-allah
class: concept
kind: belief
label: { ar: "الكرسي", en: "The Kursi (seat of God)", ur: "کرسی", es: "El Kursi (asiento de Dios)", fr: "Le Kursi (siège de Dieu)", tr: "Başkan", id: "Kursi" }
summary:
  ar: "يفسر الشعراوي الكرسي بأنه السلطان والقهر والقدرة والملك، ويستشهد بالعرف في أن القعود على الكرسي يدل على استتباب الأمر، ويذكر حديث أبي ذر في أن الكرسي بالنسبة للعرش كحلقة في فلاة، ويرى أن الآية تبين عظمة الكرسي بأنه وسع السموات والأرض {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1104} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1105}."
  en: "Sha'rawi glosses the kursi as sovereignty, power and dominion, drawing on usage in which sitting on a seat shows a matter is settled. He reports the hadith of Abu Dhar on the kursi and the throne, and reads the verse as showing the kursi's vastness in that it encompasses the heavens and earth {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1104} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1105}."
  ur: "شعراوی کرسی کو اقتدار، غلبے، قدرت اور بادشاہی کے معنی میں لیتے ہیں، اور اس عرف سے دلیل لاتے ہیں کہ کرسی پر بیٹھنا امر کے مستحکم ہونے کی علامت ہے۔ وہ ابوذر کی حدیث کا ذکر کرتے ہیں کہ کرسی عرش کے مقابلے میں ایک ویران میدان میں حلقے کی طرح ہے، اور آیت کی دلیل سے اس کی وسعت بیان کرتے ہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1104} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1105}۔"
  es: "Sha'rawi interpreta el kursi como soberanía, poder y dominio, basándose en el uso en el que sentarse en un asiento muestra que un asunto está resuelto. Relata el hadiz de Abu Dhar sobre el kursi y el trono, y lee el versículo como una muestra de la inmensidad del kursi, ya que abarca los cielos y la tierra {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1104} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1105}."
  fr: "Sha'rawi interprète le kursi comme symbole de souveraineté, de pouvoir et de domination, s'appuyant sur l'usage selon lequel s'asseoir sur un siège signifie qu'une affaire est réglée. Il rapporte le hadith d'Abu Dhar sur le kursi et le trône, et lit le verset comme illustrant l'immensité du kursi, qui englobe les cieux et la terre {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1104} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1105}."
  tr: "Al-Shaarawi, Kursi'yi otorite, boyun eğdirme, güç ve egemenlik olarak yorumlar; Kursi'nin üzerinde oturmanın meselenin istikrarını gösterdiği geleneğine atıfta bulunur. Ayrıca Ebu Dharr'ın hadisinden bahseder; Kursi, tahta göre çölde bir halka gibi durur ve bu ayetin Kursi'nin büyüklüğünü gökleri ve yeri kapsadığını gösterdiğine inanır {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1104} {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1105}."
  id: "Al-Shaarawi menafsirkan Kursi sebagai otoritas, penaklukan, kekuasaan, dan kedaulatan, dengan merujuk pada kebiasaan bahwa duduk di atas Kursi menunjukkan stabilitas masalah. Ia juga menyebutkan hadits Abu Dharr bahwa Kursi seperti cincin di padang gurun relatif terhadap Takhta, dan ia percaya bahwa ayat tersebut menunjukkan kebesaran Kursi yang mencakup langit dan bumi {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1104} {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1105}."
