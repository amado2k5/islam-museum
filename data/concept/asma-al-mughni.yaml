summary:
  ar: 'المغني: المغني لمن شاء من عباده الموسّع عليهم من فضله. الاسم رقم 89 في التعداد الوارد في حديث الترمذي عن أسماء الله الحسنى.'
  en: al-Mughni — The Enricher. Name 89 in the enumeration of the most beautiful names in the Tirmidhi hadith.
  fr: "al-Mughni — Celui qui enrichit. Nom 89 dans l’énumération des plus beaux noms du hadith de Tirmidhi."
  ur: 'المغني: مغنی — جو اپنے بندوں میں سے جسے چاہے فضل سے غنی کرے۔ اسمائے حسنیٰ کی ترمذی والی گنتی میں نمبر 89۔'
  es: "al-Mughni — El Enriquecedor. Nombre número 89 en la enumeración de los nombres más bellos en el hadiz de Tirmidhi."
  tr: "El-Mughni: Kulları arasında istediği, onları cükletinden genişleten şarkıcı. El-Tirmidi'nin Allah'ın İsimleri hakkındaki hadislerde adı 89."
  id: "Al-Mughni: penyanyi yang dikehendaki-Nya di antara para hamba-Nya, yang memperluas mereka dari karunia-Nya. Nama nomor 89 dalam jumlah yang disebutkan dalam hadis Al-Tirmidhi tentang Nama-nama Allah."
