label: { ar: "الخط المنسوب والأقلام الستة", en: "Proportional script and the six pens (al-aqlam al-sitta)", ur: "خطِ منسوب اور اقلامِ ستہ" }
summary:
  ar: "نظرية وضعها ابن مقلة تضبط أشكال الحروف بنسب محسوبة على الألف والنقطة، وقنّن بها ستة خطوط: النسخ والثلث والمحقق والريحان والتوقيع والرقاع، ثم جوّدها ابن البواب وياقوت المستعصمي {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 25}."
  en: "The theory, first put forward by Ibn Muqla, of calibrating letter shapes by ratios based on the alif and the rhomboid dot; with it he canonised six scripts — naskh, thuluth, muhaqqaq, rayhan, tawqi' and riqa' — later refined by Ibn al-Bawwab and Yaqut al-Musta'simi {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 25}."
  ur: "ابن مقلہ کا پیش کردہ نظریہ جس میں حروف کی شکلیں الف اور نقطے پر مبنی تناسب سے منضبط ہوتی ہیں؛ اس سے انہوں نے چھ خطوط نسخ، ثلث، محقق، ریحان، توقیع اور رقاع مقرر کیے، جنہیں ابن البواب اور یاقوت مستعصمی نے نکھارا {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 25}۔"
