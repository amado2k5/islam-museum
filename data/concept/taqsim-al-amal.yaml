summary:
  ar: "تقسيم العمل (division of labor) عند طارق السويدان: مبدأ استنبطه آدم سميث من مراقبة مصنع دبابيس فرفع إنتاجه عشرة أضعاف؛ نظرية عظيمة في الصناعة، لكنه يحذّر من تطبيقها في عالم الخدمات حيث الموظف الشامل أسرع وأفضل."
  en: "Division of labour as Tareq al-Suwaidan presents it: the principle Adam Smith drew from watching a pin factory, multiplying its output tenfold; a great theory for industry, but he warns against applying it to services, where the 'complete employee' is faster and better."
  ur: "تقسیم محنت، جیسا کہ طارق السویدان پیش کرتے ہیں: وہ اصول جو ایڈم اسمتھ نے پن کی فیکٹری دیکھ کر اخذ کیا جس سے پیداوار دس گنا بڑھی؛ صنعت کے لیے عمدہ نظریہ، مگر وہ خدمات کے میدان میں اس کے اطلاق سے خبردار کرتے ہیں جہاں «مکمل ملازم» تیز اور بہتر ہے۔"
