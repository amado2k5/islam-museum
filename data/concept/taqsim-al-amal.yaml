summary:
  ar: "تقسيم العمل (division of labor) عند طارق السويدان: مبدأ استنبطه آدم سميث من مراقبة مصنع دبابيس فرفع إنتاجه عشرة أضعاف؛ نظرية عظيمة في الصناعة، لكنه يحذّر من تطبيقها في عالم الخدمات حيث الموظف الشامل أسرع وأفضل."
  en: "Division of labour as Tareq al-Suwaidan presents it: the principle Adam Smith drew from watching a pin factory, multiplying its output tenfold; a great theory for industry, but he warns against applying it to services, where the 'complete employee' is faster and better."
  ur: "تقسیم محنت، جیسا کہ طارق السویدان پیش کرتے ہیں: وہ اصول جو ایڈم اسمتھ نے پن کی فیکٹری دیکھ کر اخذ کیا جس سے پیداوار دس گنا بڑھی؛ صنعت کے لیے عمدہ نظریہ، مگر وہ خدمات کے میدان میں اس کے اطلاق سے خبردار کرتے ہیں جہاں «مکمل ملازم» تیز اور بہتر ہے۔"
  es: "La división del trabajo, tal como la presenta Tareq al-Suwaidan: el principio que Adam Smith extrajo al observar una fábrica de alfileres, multiplicando su producción por diez; una gran teoría para la industria, pero advierte contra su aplicación a los servicios, donde el \"empleado completo\" es más rápido y mejor."
  fr: "La division du travail telle que Tareq al-Suwaidan la présente: le principe qu'Adam Smith a tiré de l'observation d'une fabrique d'épingles, multipliant sa production par dix; une excellente théorie pour l'industrie, mais il met en garde contre son application aux services, où « l'employé complet » est plus rapide et meilleur."
  tr: "Tariq Al-Suwaidan'ın İşBölümü: Adam Smith'in iğne şeklinde bir fabrikayı izlemek ve üretimini on kat artırmakla türettiği bir ilke; endüstride harika bir teori, ancak genel çalışan daha hızlı ve daha iyi olduğu hizmet dünyasında uygulanmaması konusunda uyarır."
  id: "Pembagian Kerja oleh Tariq Al-Suwaidan: Prinsip yang Adam Turunkan dari memantau pabrik berbentuk pin dan meningkatkan outputnya sepuluh kali lipat; teori yang hebat di industri, tetapi ia memperingatkan agar tidak diterapkan di dunia jasa, di mana karyawan secara keseluruhan lebih cepat dan lebih baik."
