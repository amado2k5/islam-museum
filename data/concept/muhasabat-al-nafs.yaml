summary:
  ar: "يقترح عمر عبد الكافي برنامجًا يوميًا للقلب مع الجوارح من أربع مراحل: المشارطة عند صلاة الصبح، والمراقبة طوال اليوم، والمحاسبة قبل النوم، ثم المعاتبة، ويرى أن الجوارح تعمل عند القلب كما يعمل العمال عند مديرهم."
  en: "Omar Abdelkafy proposes a daily programme for the heart and the limbs in four stages: setting conditions at dawn prayer, watchfulness through the day, taking account before sleep, and then reproach; he holds that the limbs work for the heart as workers for their manager."
  ur: "عمر عبد الکافی دل اور اعضا کے لیے چار مرحلوں کا روزانہ پروگرام تجویز کرتے ہیں: فجر کے وقت شرط باندھنا، دن بھر نگرانی، سونے سے پہلے محاسبہ، پھر ملامت؛ ان کے نزدیک اعضا دل کے لیے ایسے کام کرتے ہیں جیسے کارکن اپنے مینیجر کے لیے۔"
