id: concept/zij-sabi-the-stars-place-on-the-ecliptic-opposite-sides
class: concept
kind: scientific
label: { ar: "موضع الكوكب من فلك البروج إذا اختلفت الجهتان", en: "The place of a star on the ecliptic when the two directions differ", ur: "ستارے کا فلک البروج میں مقام جب دونوں جہتیں مختلف ہوں", es: "La posición de una estrella en la eclíptica cuando las dos direcciones difieren", fr: "La position d'une étoile sur l'écliptique lorsque les deux directions diffèrent", tr: "İki tarafın farklı olması durumunda gezegenin zodyak üzerindeki konumu", id: "Posisi planet dalam kaitannya dengan zodiak jika kedua sisinya berbeda" }
summary:
  ar: "وإذا كان بعد الكوكب عن معدل النهار وميل الجزء الذي يتوسط السماء معه في جهتين مختلفتين فإن وجه العمل أن يُجمعا فيصير مجموعهما البعد المعدّل، ثم تُضرب الأوتار وتُقسم بترتيب آخر يُنتج وتر الميل المعدّل وما يترتب عليه، إلى أن يخرج اختلاف الكوكب، ثم يُستعمل مثل الرسم الأول حتى يُعلم الجزء الذي فيه الكوكب من فلك البروج. {cite:zij-sabi-nallino-byblion p.60}."
  en: "If the star's distance from the equator and the declination of the part culminating with it are in two different directions, the way is to add them, the sum becoming the corrected distance; the chords are then multiplied and divided in another order giving the chord of the corrected declination and what follows from it, until the difference of the star comes out, and the first procedure is then applied until the part of the ecliptic in which the star stands is known. {cite:zij-sabi-nallino-byblion p.60}."
  ur: "اگر ستارے کا معدل النہار سے بعد اور اس جزء کا میل جو اس کے ساتھ وسط السماء میں آتا ہے دو مختلف جہتوں میں ہوں تو عمل کی صورت یہ ہے کہ دونوں کو جمع کیا جائے، مجموعہ بعدِ معدّل بنے؛ پھر اوتار کو دوسری ترتیب سے ضرب و تقسیم دی جاتی ہے جس سے میلِ معدّل کا وتر اور اس پر مرتب ہونے والی چیزیں نکلتی ہیں، یہاں تک کہ ستارے کا اختلاف نکل آئے، پھر پہلا طریقہ برتا جاتا ہے حتیٰ کہ فلک البروج کا وہ جزء معلوم ہو جائے جس میں ستارہ ہے۔ {cite:zij-sabi-nallino-byblion p.60}۔"
  es: "Si la distancia de la estrella al ecuador y la declinación de la parte que culmina con ella apuntan en direcciones diferentes, se suman, obteniéndose así la distancia corregida. A continuación, se multiplican y dividen las cuerdas en otro orden, dando como resultado la cuerda de la declinación corregida y lo que se deduce de ella, hasta obtener la diferencia de la estrella. Finalmente, se aplica el primer procedimiento hasta conocer la parte de la eclíptica en la que se encuentra la estrella. {cite:zij-sabi-nallino-byblion p.60}."
  fr: "Si la distance de l'étoile à l'équateur et la déclinaison du segment de l'écliptique qui la précède sont dans deux directions différentes, on les additionne; la somme obtenue correspond à la distance corrigée. On multiplie ensuite les cordes et on divise à nouveau pour obtenir la corde de la déclinaison corrigée. On poursuit ainsi l'opération jusqu'à déterminer la position de l'étoile sur l'écliptique. On applique alors la première procédure jusqu'à connaître la position de l'étoile sur l'écliptique. {cite:zij-sabi-nallino-byblion p.60}."
  tr: "Eğer gezegenin ekliptikten uzaklığı ve onunla kesişen gökyüzü bölgesinin eğimi iki farklı yöndeyse, işlem, ayarlanmış uzaklığı elde etmek için bunları toplamaktır. Daha sonra, ayarlanmış eğimin kirişini ve sonuçlarını elde etmek için kirişler başka bir sırayla çarpılır ve bölünür, ta ki gezegenin tutulması belirlenene kadar. Ardından, gezegenin bulunduğu ekliptik bölgesini belirlemek için ilk şemadakiyle aynı yöntem kullanılır. {cite:zij-sabi-nallino-byblion s.60}."
  id: "Jika jarak planet dari ekliptika dan kemiringan bagian langit yang ditengahinya berada dalam dua arah yang berbeda, maka prosedurnya adalah menjumlahkannya untuk mendapatkan jarak yang disesuaikan. Kemudian, tali busur dikalikan dan dibagi dengan urutan lain untuk menghasilkan tali busur kemiringan yang disesuaikan dan konsekuensinya, hingga gerhana planet ditentukan. Kemudian, metode yang sama seperti pada diagram pertama digunakan untuk menentukan bagian ekliptika tempat planet tersebut berada. {cite:zij-sabi-nallino-byblion p.60}."
