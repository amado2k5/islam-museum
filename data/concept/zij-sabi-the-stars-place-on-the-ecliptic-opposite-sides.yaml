id: concept/zij-sabi-the-stars-place-on-the-ecliptic-opposite-sides
class: concept
kind: scientific
label: { ar: "موضع الكوكب من فلك البروج إذا اختلفت الجهتان", en: "The place of a star on the ecliptic when the two directions differ", ur: "ستارے کا فلک البروج میں مقام جب دونوں جہتیں مختلف ہوں" }
summary:
  ar: "وإذا كان بعد الكوكب عن معدل النهار وميل الجزء الذي يتوسط السماء معه في جهتين مختلفتين فإن وجه العمل أن يُجمعا فيصير مجموعهما البعد المعدّل، ثم تُضرب الأوتار وتُقسم بترتيب آخر يُنتج وتر الميل المعدّل وما يترتب عليه، إلى أن يخرج اختلاف الكوكب، ثم يُستعمل مثل الرسم الأول حتى يُعلم الجزء الذي فيه الكوكب من فلك البروج. {cite:zij-sabi-nallino-byblion p.60}."
  en: "If the star's distance from the equator and the declination of the part culminating with it are in two different directions, the way is to add them, the sum becoming the corrected distance; the chords are then multiplied and divided in another order giving the chord of the corrected declination and what follows from it, until the difference of the star comes out, and the first procedure is then applied until the part of the ecliptic in which the star stands is known. {cite:zij-sabi-nallino-byblion p.60}."
  ur: "اگر ستارے کا معدل النہار سے بعد اور اس جزء کا میل جو اس کے ساتھ وسط السماء میں آتا ہے دو مختلف جہتوں میں ہوں تو عمل کی صورت یہ ہے کہ دونوں کو جمع کیا جائے، مجموعہ بعدِ معدّل بنے؛ پھر اوتار کو دوسری ترتیب سے ضرب و تقسیم دی جاتی ہے جس سے میلِ معدّل کا وتر اور اس پر مرتب ہونے والی چیزیں نکلتی ہیں، یہاں تک کہ ستارے کا اختلاف نکل آئے، پھر پہلا طریقہ برتا جاتا ہے حتیٰ کہ فلک البروج کا وہ جزء معلوم ہو جائے جس میں ستارہ ہے۔ {cite:zij-sabi-nallino-byblion p.60}۔"
