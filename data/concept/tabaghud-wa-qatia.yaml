label:
  ar: "التباغض والقطيعة"
  en: "Mutual hatred and estrangement"
  es: "Odio mutuo y distanciamiento"
  fr: "Haine et éloignement mutuels"
summary:
  ar: "التباغض والقطيعة: نقيض الأخوة — الحسد، والهجر، والظن السيئ، والغيبة؛ حذّرت النصوص منها باعتبارها حالقة الدين ومفسدة الأخوة، ونهت عن هجر المسلم أخاه فوق ثلاثة أيام."
  en: "Mutual hatred and estrangement: the contrary of brotherhood — envy, desertion, bad suspicion and backbiting; the texts warn they 'shave the religion' and rot brotherhood, forbidding a Muslim to shun his brother beyond three days."
  es: "El odio mutuo y el distanciamiento: lo contrario de la hermandad; la envidia, el abandono, la mala sospecha y la calumnia. Los textos advierten que \"debilitan la religión\" y corrompen la hermandad, prohibiendo a un musulmán evitar a su hermano durante más de tres días."
  fr: "Haine mutuelle et éloignement: le contraire de la fraternité — l'envie, la désertion, les soupçons malveillants et la médisance; les textes avertissent qu'ils « corrompent la religion » et pourrissent la fraternité, interdisant à un musulman de fuir son frère plus de trois jours."
