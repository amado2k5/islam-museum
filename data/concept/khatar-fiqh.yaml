id: concept/khatar-fiqh
class: concept
kind: term
label:
  ar: الخطر
  en: Khatar (mortal danger and risk)
  ur: خطر
summary:
  ar: 'الخَطر لغة الإشراف على الهلاك وخوف التلف، وأمر خطر أي متردد بين أن يوجد وألا يوجد، والمخاطرة المراهنة؛ وتعريض النفس لخطر الهلاك حرام باتفاق، لأن حفظها من أهم مقاصد الشريعة، ومنه قوله تعالى في البقرة عن ترك الإلقاء باليد إلى التهلكة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7729} الرخص المتعلقة بالخطر: يباح بالخطر أكل الميتة للمضطر وإساغة الغصة بالخمر عند الخوف على النفس، ويجب قطع العضو المتآكل إذا كان في تركه خطر على النفس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7729}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7730} المشقة إذا بلغت حد الخطر على النفس والأطراف توجب الترخيص: يجب التيمم إذا خيف من الماء على النفس أو العضو، ويسقط وجوب الحج بخطر السفر، ويحرم ركوب البحر إن غلب الهلاك، ويسقط الصوم عن المريض والمرضع والحامل إن خيف عليها أو على الرضيع والجنين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7730} ويستثنى الجهاد فيجوز تعريض النفس فيه، وقد حرم الانهزام؛ ويستثنى دفع الصائل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7730}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7731} التعرض للخطر بإزالة غدة أو عضو متآكل: يحرم إذا كان في القطع خطر على النفس وزاد على خطر البقاء، ويجوز إذا لم يكن خطر أو كان خطر البقاء أكبر؛ وإذا قطعه أجنبي بلا إذن فمات فعليه القصاص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7731}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7732} عقود المخاطرة هي ما يتردد بين الوجود والعدم وحصول الربح أو عدمه، كالرهان والقمار، والسبق مشروع بشروط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7732}'
  en: 'Khatar is lexically the brink of ruin and fear of loss, a matter hanging between happening and not happening; wagering is mukhatara. Exposing oneself to mortal danger is forbidden by agreement, since preserving life is among the highest aims of the law; the verse on not casting oneself into ruin is cited. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7729} Dispensations for danger: carrion may be eaten by one forced by hunger, wine may be used to swallow a choking morsel when life is at risk, and a diseased organ must be cut if leaving it risks life. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7729}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7730} Hardship that reaches the danger to life or limb brings relief: dry ablution is required when water threatens life or a limb, the Hajj lapses when the journey is risky, sea travel is forbidden if death is likely, and fasting lapses for the sick, the nursing and the pregnant if their life or the infant is endangered. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7730} Jihad is an exception, and it is allowed to risk life in it, since hardship is its nature; flight from a larger enemy is forbidden; and repelling an aggressor is also excepted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7730}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7731} Removing a gland or a diseased organ: forbidden when cutting endangers life more than leaving it, and allowed when there is no danger or leaving it is worse; a stranger who cuts it without leave owes retaliation if the patient dies. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7731}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7732} Contracts of risk are those that hang between being and not being and between gain and loss, like wagers and gambling; the race is lawful on conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7732}'
  ur: 'خطر لغت میں ہلاکت کے قریب ہونا اور تلف کا خوف ہے، اور کسی چیز کا ہونے نہ ہونے کے بیچ معلق ہونا؛ مخاطرہ شرط لگانا۔ جان کو ہلاکت میں ڈالنا بالاتفاق حرام ہے کیونکہ جان کی حفاظت شریعت کے بڑے مقاصد میں سے ہے، اور سورہ بقرہ کی اس آیت سے استدلال کیا جاتا ہے جو ہاتھوں کو ہلاکت میں ڈالنے سے روکتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7729} خطر سے متعلق رخصتیں: مجبور کے لیے مردار کھانا جائز ہے، جان کے خوف میں نگلے ہوئے لقمے کے لیے شراب سے گھونٹ لینا، اور متآکل عضو کو کاٹنا واجب ہے جب اس کو چھوڑنا جان کے لیے خطرہ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7729}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7730} مشقت جب جان یا عضو کے خطرے تک پہنچے تو رخصت دیتی ہے: پانی سے جان یا عضو کو خطرہ ہو تو تیمم واجب، خطرناک سفر سے حج ساقط، موت کا غالب گمان ہو تو سمندری سفر ناجائز، اور بیمار، دودھ پلانے والی اور حاملہ کو جان یا بچے کا خطرہ ہو تو روزہ ساقط۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7730} جہاد مستثنیٰ ہے، اس میں جان کو خطرے میں ڈالنا جائز ہے کیونکہ مشقت اس کی ماہیت ہے؛ بڑے دشمن سے بھاگنا ناجائز ہے؛ حملہ آور کو دفع کرنا بھی مستثنیٰ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7730}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7731} غدود یا متآکل عضو کو کاٹنا: حرام ہے جب کاٹنے کا خطرہ چھوڑنے سے زیادہ ہو، اور جائز ہے جب خطرہ نہ ہو یا چھوڑنے کا خطرہ زیادہ ہو؛ اجنبی اجازت کے بغیر کاٹے اور مریض مر جائے تو قصاص ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7731}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7732} مخاطرے کے معاملات وہ ہیں جو وجود اور عدم، اور نفع اور نقصان کے درمیان معلق ہوں، جیسے شرط اور جوا؛ سبق (دوڑ) شرائط کے ساتھ جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7732}'
