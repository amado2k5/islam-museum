summary:
  ar: "يقسم ابن سينا الأعراض بحسب علاقتها الزمنية بالمرض إلى مؤقتة تبتدئ وتنقطع معه، وغير موقتة تتبعه تارة ولا تتبعه أخرى، وما يأتي آخر الأمر كعلامات البحران والنضج والعطب {cite:canon-ibn-sina-print-v1 pp.154-155}."
  en: "Ibn Sina sorts symptoms by their timing against the disease: those fixed to it, beginning and ending with it, those with no known time that sometimes follow it and sometimes not, and those that come at the end, the signs of crisis, of ripening and of ruin {cite:canon-ibn-sina-print-v1 pp.154-155}."
