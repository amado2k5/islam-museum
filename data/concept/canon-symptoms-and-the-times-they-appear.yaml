id: concept/canon-symptoms-and-the-times-they-appear
class: concept
kind: scientific
label: { ar: "الأعراض بحسب أوقات ظهورها عند ابن سينا", en: "Symptoms by the time they appear in the Canon", ur: "ظاہر ہونے کے وقت کے لحاظ سے اعراض، قانون کے مطابق", es: "Síntomas para cuando aparecen en el Canon", fr: "Les symptômes au moment où ils apparaissent dans le canon" }
summary:
  ar: "يقسم ابن سينا الأعراض بحسب علاقتها الزمنية بالمرض إلى مؤقتة تبتدئ وتنقطع معه، وغير موقتة تتبعه تارة ولا تتبعه أخرى، وما يأتي آخر الأمر كعلامات البحران والنضج والعطب {cite:canon-ibn-sina-print-v1 pp.154-155}."
  en: "Ibn Sina sorts symptoms by their timing against the disease: those fixed to it, beginning and ending with it, those with no known time that sometimes follow it and sometimes not, and those that come at the end, the signs of crisis, of ripening and of ruin {cite:canon-ibn-sina-print-v1 pp.154-155}."
  es: "Ibn Sina clasifica los síntomas según su cronología en relación con la enfermedad: aquellos fijos a ella, que comienzan y terminan con ella, aquellos sin un momento conocido que a veces la siguen y a veces no, y aquellos que aparecen al final, los signos de crisis, de maduración y de ruina {cite:canon-ibn-sina-print-v1 pp.154-155}."
  fr: "Ibn Sina classe les symptômes selon leur chronologie par rapport à la maladie: ceux qui y sont liés, commençant et se terminant avec elle, ceux dont le moment est inconnu et qui la suivent parfois et parfois non, et ceux qui viennent à la fin, les signes de crise, de maturation et de ruine {cite:canon-ibn-sina-print-v1 pp.154-155}."
  ur: "ابن سینا بیماری کے خلاف علامات کو ان کے اوقات کے لحاظ سے ترتیب دیتے ہیں: جو اس کے ساتھ طے شدہ ہیں، اس کے ساتھ شروع اور ختم ہیں، وہ وقت معلوم نہیں جو کبھی اس کی پیروی کرتے ہیں اور کبھی نہیں، اور جو آخر میں آتے ہیں، بحران کی علامات، پکنے اور بربادی کی نشانیاں۔"
