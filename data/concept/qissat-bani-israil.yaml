id: concept/qissat-bani-israil
class: concept
kind: term
label:
  ar: "قصة بني إسرائيل في القرآن"
  en: "The story of the Children of Israel in the Qur'an"
  ur: "قرآن میں بنی اسرائیل کا قصہ"
summary:
  ar: "يرى الشعراوي أن الله اختار قصة بني إسرائيل لأنها أكثر القصص معجزات وأنبياء، لأنهم كانوا أكثر الأمم عصيانا، وأن النعمة التي يذكّرهم بها تشمل نجاة أبنائهم من الذبح، وأن قراءته لآيات الإسراء تتعلق بالوقت الحاضر، وهي قراءة معاصرة يعرضها صاحبها {cite:tafsir-sharawi-khawatir-scan p.285} {cite:tafsir-sharawi-khawatir-scan p.314} {cite:tafsir-sharawi-khawatir-scan p.315} {cite:tafsir-sharawi-khawatir-scan p.327} {cite:tafsir-sharawi-khawatir-scan p.331}."
  en: "Sha'rawi holds that God chose the story of the Children of Israel because it contains the most miracles and prophets, because they were the most disobedient of peoples, and that the favour He reminds them of includes the rescue of their sons from slaughter. He reads a passage in al-Isra as applying to a later time, a contemporary political reading presented only as his view {cite:tafsir-sharawi-khawatir-scan p.285} {cite:tafsir-sharawi-khawatir-scan p.314} {cite:tafsir-sharawi-khawatir-scan p.315} {cite:tafsir-sharawi-khawatir-scan p.327} {cite:tafsir-sharawi-khawatir-scan p.331}."
  ur: "شعراوی کے نزدیک اللہ نے بنی اسرائیل کا قصہ اس لیے منتخب کیا کیونکہ اس میں سب سے زیادہ معجزات اور انبیاء ہیں، کیونکہ وہ سب سے زیادہ نافرمان قوم تھے، اور جس نعمت کی یاد دلائی گئی اس میں ان کے بیٹوں کا ذبح سے نجات پانا شامل ہے۔ وہ سورۃ الاسراء کی ایک آیت کو بعد کے زمانے پر لاگو کرتے ہیں، یہ ایک معاصر سیاسی تشریح ہے جو صرف ان کی رائے کے طور پر پیش کی گئی ہے {cite:tafsir-sharawi-khawatir-scan p.285} {cite:tafsir-sharawi-khawatir-scan p.314} {cite:tafsir-sharawi-khawatir-scan p.315} {cite:tafsir-sharawi-khawatir-scan p.327} {cite:tafsir-sharawi-khawatir-scan p.331}۔"
wings: [ideas]
themes: [islam-and-judaism]
periods: [period/prophetic-era]
regions: [global]
issue:
  ar: "لماذا اختار القرآن قصة بني إسرائيل بهذا الحجم، وكيف تُفهم الآيات التي تشير إلى مستقبلهم؟"
  en: "Why does the Qur'an give the story of the Children of Israel such weight, and how are the verses that point to their future to be understood?"
perspectives:
  - tradition: sunni
    id: sunni-sharawi
    stance:
      ar: "القصة اختيرت لكثرة معجزاتها وعصيان القوم، والآيات المتعلقة بالمستقبل تُفهم على ما يقرره"
      en: "The story was chosen for its many miracles and the disobedience of the people; the verses about the future are read as he holds"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن الله ذكر بني إسرائيل بنعمه وبمعاصيهم حتى لا يقال إنه قسا عليهم، وأن الآيات في الإسراء تتحدث عن إفساد مرتين ثم عن رد الكرة، ويرى أن ذلك يتعلق بالوقت الحاضر {cite:tafsir-sharawi-khawatir-scan p.314} {cite:tafsir-sharawi-khawatir-scan p.315}، وهو تأويل معاصر يعرضه صاحبه ولم يُراجع ولا يُعتمد."
      en: "Sha'rawi holds that God reminds the Children of Israel of His favours and of their disobedience so that no one says He was harsh with them. He reads the verses of al-Isra about two corruptions and a later return as applying to the present time, a contemporary reading presented by its author and not checked or endorsed here {cite:tafsir-sharawi-khawatir-scan p.314} {cite:tafsir-sharawi-khawatir-scan p.315}."
    sources: [source/tafsir-sharawi-khawatir-scan]
  - tradition: academic
    id: academic
    stance:
      ar: "الدراسات التاريخية لهجرة الهكسوس وصلتها ببني إسرائيل لم تُضف بعد"
      en: "Historical studies of the Hyksos and any link to the Children of Israel are not yet added"
    summary:
      ar: "يذكر الشعراوي أن الهكسوس من أهل بني إسرائيل، ولم تُعرض هنا دراسة علمية لهذه الصلة، وتحتاج إلى مراجع محددة قبل أن تُعرض. الصلة التي يذكرها لم تُراجع."
      en: "Sha'rawi says the Hyksos were of the Children of Israel. No academic study of this link is set out here; it needs named sources, and the link he states has not been checked."
    sources: []
  - tradition: other
    id: other
    stance:
      ar: "روايات اليهود والتقاليد الأخرى لم تُضف بعد"
      en: "Jewish and other traditions' accounts are not yet added"
    summary:
      ar: "لم تُعرض هنا روايات بني إسرائيل من تقاليدهم أو من التقاليد الأخرى، ولم تُراجع."
      en: "The accounts of the Children of Israel in their own traditions and in other traditions are not set out here and are not checked."
    sources: []
