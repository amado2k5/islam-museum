  en: "In chapter nine Ibn Sina describes urine by age: infants' milky and whitish, boys' thicker, young men's fiery and moderate, middle-aged men's whitish and thin, and the old thinnest and whitest. {cite:canon-ibn-sina-print-v1 p.197}."
