id: concept/canon-urine-by-age
class: concept
kind: scientific
label: { ar: "البول بحسب الأعمار عند ابن سينا", en: "Urine by age in the Canon", ur: "عمر کے لحاظ سے پیشاب قانون میں", es: "Orina por edad en el Canon", fr: "L'urine selon l'âge dans le Canon" }
summary:
  ar: "يصف ابن سينا في الفصل التاسع أبوال الأسنان: الأطفال أبوالهم إلى اللبنية والبياض، والصبيان أغلظ، والشبان إلى الناري واعتدال القوام، والكهول إلى البياض والرقة، والمشايخ أرق وأبيض. {cite:canon-ibn-sina-print-v1 p.197}."
  en: "In chapter nine Ibn Sina describes urine by age: infants' milky and whitish, boys' thicker, young men's fiery and moderate, middle-aged men's whitish and thin, and the old thinnest and whitest. {cite:canon-ibn-sina-print-v1 p.197}."
  es: "En el capítulo nueve, Ibn Sina describe la orina según la edad: la de los bebés es lechosa y blanquecina, la de los niños es más espesa, la de los jóvenes es ardiente y moderada, la de los hombres de mediana edad es blanquecina y ligera, y la de los ancianos es la más ligera y blanca. {cite:canon-ibn-sina-print-v1 p.197}."
  fr: "Au chapitre neuf, Ibn Sina décrit l'urine en fonction de l'âge: celle des nourrissons est laiteuse et blanchâtre, celle des garçons est plus épaisse, celle des jeunes hommes est abondante et d'épaisseur moyenne, celle des hommes d'âge moyen est blanchâtre et fluide, et celle des personnes âgées est la plus fluide et la plus blanche. {cite:canon-ibn-sina-print-v1 p.197}."
  ur: "باب نو میں ابن سینا عمر کے لحاظ سے پیشاب کی وضاحت کرتا ہے: نوزائیدہ بچوں کا دودھیا اور سفید، لڑکوں کا موٹا، جوان مردوں کا تیز اور اعتدال پسند، درمیانی عمر کے مردوں کا گورا اور پتلا، اور بوڑھا سب سے پتلا اور سفید۔ {حوالہ: کینن ابن سینا پرنٹ v1 صفحہ 197}۔"
