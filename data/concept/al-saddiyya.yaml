id: "concept/al-saddiyya"
class: "concept"
kind: "scientific"
label:
  ar: "السدية"
  en: "Saddiyya (little pustular flesh in the eyeball)"
  fr: "Saddiyya (petite chair pustuleuse dans le globe oculaire)"
  ur: "سدیہ"
summary:
  ar: "السدية لحيمة بثرية تزيد في المقلة، فإن كان عند الموق فالأصوب أن ينكأ ثم يعالج بعلاج الغرب أو يكحل بأدوية الظفرة وما يجري مجراها، وإن كان مع البياض والسواد فعلاجه علاج الظفرة ⁦(أسماء الأكحال لا تحمل)⁩ {cite:canon-ibn-sina-print-v2 p.195}"
  en: "The saddiyya is a little pustular flesh that grows in the eyeball; if at the canthus it is best pricked then treated with the gharb's treatment or collyriated with the pterygium drugs and their like; if accompanied by white and black, its treatment is the pterygium's ⁦(kohl names are not carried)⁩ {cite:canon-ibn-sina-print-v2 p.195}"
  fr: "La saddiyya est une petite chair pustuleuse qui croît dans le globe oculaire ; si elle se trouve au canthus, le mieux est de la piquer puis de la traiter par le traitement du gharb ou de la soigner par collyre avec les remèdes du ptérygion et leurs semblables ; si elle s’accompagne de blanc et de noir, son traitement est celui du ptérygion ⁦(les noms des khôls ne sont pas reproduits)⁩ {cite:canon-ibn-sina-print-v2 p.195}"
  ur: "سدیہ ایک چھوٹا بثری گوشت ہے جو مقلہ میں بڑھتا ہے؛ اگر مآق پر ہو تو اولیٰ یہ ہے کہ اسے چبھویا جائے پھر غرب کے علاج سے علاج کیا جائے یا ظفرہ کی ادویہ اور اس جیسی چیزوں سے سرمہ لگایا جائے؛ اور اگر سفید اور سیاہ کے ساتھ ہو تو اس کا علاج ظفرہ کا علاج ہے ⁦(سرموں کے نام منقول نہیں)⁩ {cite:canon-ibn-sina-print-v2 p.195}"
