id: concept/asbab-al-malinkhuliya-al-dimaghiyya
class: concept
kind: scientific
label:
  ar: "أسباب المالنخوليا في الدماغ نفسه"
  en: "Causes of melancholia in the brain itself"
  fr: "Causes de la mélancolie dans le cerveau lui-même"
  ur: "خود دماغ میں مالنخولیا کے اسباب"
  es: "Causas de la melancolía en el propio cerebro"
  tr: "Melankolinin beyindeki nedenleri"
  id: "Penyebab melankolia di otak itu sendiri"
summary:
  ar: "يذكر ابن سينا أن سبب المالنخوليا في الدماغ إما سوء مزاج بارد يابس بلا مادة، وإما مع مادة في العروق أو متشربة في جرم الدماغ أو مؤذية بكيفيتها، وأنها كثيراً ما تكون انتقالاً من الصرع {cite:canon-ibn-sina-print-v2 p.103}"
  en: "Ibn Sina says the cause of melancholia in the brain is either a cold, dry bad temperament without matter, or a matter in the vessels, soaked into the body of the brain or harmful by its quality, and that it is often a passing over from epilepsy {cite:canon-ibn-sina-print-v2 p.103}"
  fr: "Ibn Sina dit que la mélancolie cérébrale a pour cause soit un mauvais tempérament froid et sec sans matière, soit une matière dans les vaisseaux, imprégnant le corps du cerveau ou nuisible par sa qualité, et qu’elle est souvent une transformation de l’épilepsie {cite:canon-ibn-sina-print-v2 p.103}"
  ur: "ابن سینا کہتا ہے کہ دماغ میں مالنخولیا کا سبب یا تو مادے کے بغیر سرد خشک بدمزاجی ہے، یا مادہ ہے جو رگوں میں ہو، دماغ کے جرم میں رچا ہو یا اپنی کیفیت سے نقصان دے، اور یہ اکثر صرع سے منتقل ہو کر آتا ہے {cite:canon-ibn-sina-print-v2 p.103}۔"
  es: "Ibn Sina afirma que la causa de la melancolía en el cerebro es un mal temperamento frío y seco, sin materia, o una materia en los vasos sanguíneos, que se introduce en el cuerpo del cerebro o es dañina por su naturaleza, y que a menudo se trata de una transición de la epilepsia {cite:canon-ibn-sina-print-v2 p.103}."
  tr: "İbn Sina, beyindeki melankolinin nedeninin ya soğuk, kuru bir ruh hali olduğunu, ya da damarlarda bir madde olduğunu, ya da beyin sapında kirlenmiş ya da zararlı olduğunu belirtir ve bunun genellikle epilepsiden kaynaklanan bir bulaşım olduğunu {atıf:kanon-ibn-sina-print-v2 s.103}"
  id: "Ibn Sina menyebutkan bahwa penyebab melankolia di otak adalah suasana hati dingin dan kering tanpa substansi, atau dengan zat di pembuluh darah, atau termurni di batang otak, atau berbahaya pada sifatnya, dan seringkali merupakan transmisi dari epilepsi {cite:canon-ibn-sina-print-v2 hlm.103}"
