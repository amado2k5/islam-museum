id: concept/dawa-al-muallim-al-ajami
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-lisan]
label:
  ar: "دعوى أن بشراً أعجمياً يعلّم النبي"
  en: "The claim that a foreign man taught the Prophet"
  ur: "یہ دعویٰ کہ ایک عجمی شخص نبی کو سکھاتا تھا"
  fr: "L'allégation d'un maître étranger du Prophète"
  es: "La alegación de un maestro extranjero del Profeta"
summary:
  ar: "زعم مشركو مكة أن بشراً يعلّم النبي ما يتلوه، فردّت آية النحل 103 بأن لسان من يشيرون إليه أعجمي وهذا لسان عربي مبين. اختلف المفسرون في اسم الرجل: بلعام، ويعيش، وجبر، ويسار وجبر، وسلمان الفارسي، وكاتب ارتدّ؛ وضعّف ابن كثير والقرطبي القول بسلمان لأن الآية مكية وهو أسلم بالمدينة."
  en: "The polytheists of Mecca claimed that a human being taught the Prophet what he recited; verse 16:103 answers that the tongue of the man they point to is foreign while this is clear Arabic. The commentators differ on his name: Bal'am, Ya'ish, Jabr, Yasar and Jabr, Salman al-Farisi, or a scribe who apostatised. Ibn Kathir and al-Qurtubi judge the Salman report weak because the verse is Meccan and Salman became a Muslim in Medina."
  ur: "مکہ کے مشرکین نے دعویٰ کیا کہ کوئی انسان نبی کو وہ سکھاتا ہے جو وہ تلاوت کرتے ہیں۔ آیت النحل 103 جواب دیتی ہے کہ جس شخص کی طرف وہ اشارہ کرتے ہیں اس کی زبان عجمی ہے جبکہ یہ زبان صاف عربی ہے۔ مفسرین اس شخص کے نام میں مختلف ہیں: بلعام، یعیش، جبر، یسار اور جبر، سلمان فارسی، یا ایک کاتب جو مرتد ہو گیا۔ ابن کثیر اور قرطبی سلمان والے قول کو کمزور قرار دیتے ہیں کیونکہ آیت مکی ہے اور سلمان مدینہ میں مسلمان ہوئے۔"
  fr: "Les polythéistes de La Mecque prétendaient qu'un être humain enseignait au Prophète ce qu'il récitait ; le verset 16:103 répond que la langue de l'homme qu'ils désignent est étrangère alors que celle-ci est un arabe clair. Les commentateurs divergent sur son nom : Bal'am, Ya'ish, Jabr, Yasar et Jabr, Salman al-Farisi, ou un scribe qui apostasia. Ibn Kathir et al-Qurtubi jugent faible le récit de Salman, car le verset est mecquois et Salman est devenu musulman à Médine."
  es: "Los politeístas de La Meca afirmaron que un ser humano enseñaba al Profeta lo que recitaba; el versículo 16:103 responde que la lengua del hombre al que señalan es extranjera, mientras que esta es un árabe claro. Los comentaristas difieren sobre su nombre: Bal'am, Ya'ish, Jabr, Yasar y Jabr, Salman al-Farisi, o un escriba que apostató. Ibn Kathir y al-Qurtubi consideran débil el relato de Salman, porque el versículo es mecano y Salman se hizo musulmán en Medina."
