label:
  ar: "إذن"
  en: "Idhn (permission: the Lawgiver's, the owner's, the right holder's and the judge's)"
  ur: "اذن (اجازت: شارع، مالک، صاحبِ حق اور قاضی کی طرف سے)"
summary:
  ar: "الإذن في الفقه إطلاق الفعل والإباحة، ويكون عاما أو خاصا بحسب المأذون له والتصرف والوقت والمكان. ويصدر من الشارع للتيسير ورفع الحرج وإباحة المحرم عند الضرورة، ومن المالك في ماله، ومن صاحب الحق في حقه، ومن القاضي فيما يتوقف نفاذه على إذنه. ${S} p.2025} ${S} p.2026} ${S} p.2028} ${S} p.2030} ${S} p.2031}"
  en: "In law, idhn is permission to act, making an act lawful, and it is general or specific according to the person permitted and the act, time or place. It comes from the Lawgiver for ease, lifting hardship and making forbidden things lawful in necessity; from the owner over his property; from the holder of a right over his right; and from the judge where the validity of an act depends on his leave. ${S} p.2025} ${S} p.2026} ${S} p.2028} ${S} p.2030} ${S} p.2031}"
  ur: "فقہ میں اذن کسی فعل کی اجازت اور اباحت ہے، جو مأذون لہ، تصرف، وقت یا جگہ کے اعتبار سے عام یا خاص ہو سکتی ہے۔ یہ شارع کی طرف سے آسانی، مشقت کے دفع اور ضرورت میں ممنوع چیز کی اباحت کے لیے، مالک کی طرف سے اپنے مال میں، صاحبِ حق کی طرف سے اپنے حق میں، اور قاضی کی طرف سے اس تصرف میں ہوتی ہے جس کا نفاذ اس کے اذن پر موقوف ہو۔ ${S} p.2025} ${S} p.2026} ${S} p.2028} ${S} p.2030} ${S} p.2031}"
