id: concept/submission-of-creation
class: concept
kind: doctrine
label:
  ar: إسلام الكون ⁦(الطوع والكره)⁩
  en: The submission of creation (willing and unwilling)
  es: "La sumisión de la creación (voluntaria y no voluntaria)"
  fr: "La soumission de la création (volontaire et involontaire)"
  tr: "Evrenin İslamı (İstekli ve Hoşlanmama)"
  id: "Islam Alam Semesta (Kesediaan dan Ketidaksukaan)"
summary:
  ar: "يرى الشعراوي أن كل ما في السماوات والأرض أسلم لله طوعاً أو كرهاً، والطوع في غير المكلفين طاعة التسخير، والكره فيما لا اختيار للإنسان فيه، كالميلاد والموت والمرض. ويقرر أن الإسلام الاختياري للمؤمن هو أن يوافق منهج الله بالافعل والتجنب، وأن الكون ينسجم حين ينسجم الإنسان معه. ويرفض أن يُفهم الكره بالإكراه على الدين {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1577}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1579}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1581}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1582}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1583}."
  en: "Sha'rawi holds that all that is in the heavens and the earth has submitted to God, willingly or unwillingly. For beings not under obligation, willing submission is the obedience of subjection, and unwilling submission is what the human has no choice over, such as birth, death and sickness. He holds that the chosen submission of the believer is to match God's law by doing and refraining, and that the universe is in harmony when the human is in harmony with it. He rejects reading unwilling submission as compulsion in religion {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1577}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1579}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1581}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1582}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1583}."
  es: "Sha'rawi sostiene que todo lo que existe en los cielos y en la tierra se ha sometido a Dios, voluntaria o involuntariamente. Para los seres que no están obligados, la sumisión voluntaria implica obediencia, mientras que la sumisión involuntaria es aquello sobre lo que el ser humano no tiene control, como el nacimiento, la muerte y la enfermedad. Afirma que la sumisión elegida por el creyente consiste en acatar la ley de Dios mediante la acción y la abstención, y que el universo está en armonía cuando el ser humano está en armonía con él. Rechaza leer la sumisión involuntaria como compulsión en la religión {cita:tafsir-sharawi-khawatir-scan-vol-2 p.1577}{cita:tafsir-sharawi-khawatir-scan-vol-2 p.1579}{cita:tafsir-sharawi-khawatir-scan-vol-2 p.1581}{citar:tafsir-sharawi-khawatir-scan-vol-2 p.1582}{citar:tafsir-sharawi-khawatir-scan-vol-2 p.1583}."
  fr: "Sha'rawi soutient que tout ce qui est dans les cieux et sur la terre s'est soumis à Dieu, de gré ou de force. Pour les êtres non soumis à l'obligation, la soumission volontaire est l'obéissance par assujettissement, tandis que la soumission involontaire correspond à ce sur quoi l'être humain n'a aucun contrôle, comme la naissance, la mort et la maladie. Il affirme que la soumission choisie du croyant consiste à se conformer à la loi divine par ses actes et ses abstentions, et que l'univers est en harmonie lorsque l'être humain est en harmonie avec lui. Il rejette la lecture de la soumission involontaire comme une contrainte religieuse p.1581}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1582}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1583}."
  ur: "شعراوی کا خیال ہے کہ جو کچھ آسمانوں اور زمین میں ہے وہ اپنی مرضی سے یا ناخوشی سے خدا کے سپرد کر دیا ہے۔ ذمہ داری کے تحت نہ ہونے والے مخلوقات کے لیے، رضامندی سے سر تسلیم خم کرنا تابعداری کی اطاعت ہے، اور ناپسندیدہ تسلیم و رضا وہ ہے جس پر انسان کے پاس کوئی اختیار نہیں ہے، جیسے کہ پیدائش، موت اور بیماری۔ اس کا خیال ہے کہ مومن کا منتخب کردہ تسلیم خدا کے قانون سے عمل اور پرہیز کے ساتھ مطابقت رکھتا ہے، اور یہ کہ کائنات اس وقت ہم آہنگ ہے جب انسان اس سے ہم آہنگ ہو۔ وہ مذہب میں جبر کے طور پر غیر رضامندی سے جمع کروانے کو مسترد کرتا ہے صفحہ 1581}{حوالہ:تفسیر-شراوی-خواطر-سکین-جلد-2 صفحہ1582}{حوالہ:تفسیر-شعروی-خواطر-اسکین-جلد-2 صفحہ 1583}۔"
  tr: "Al-Shaarawi, gökteki ve yeryüzündeki her şeyin isteyerek ya da isteksizce Tanrı'ya teslim olduğuna ve hesap vermeyecek bireylere itaatin boyun eğdirime itaat ve doğum, ölüm ve hastalık gibi insanların seçeneği olmayan konularda hoşnutsuzluk olduğunu savunur. Seçilmiş İslam'ın, inanan için Tanrı'nın yöntemine eylem ve kaçınma yoluyla katılmak olduğunu ve evrenin insanlar onunla uyum sağladığında uyum sağladığını belirtir. Dine karşı zorlamayı anlamayı reddediyor {cite:tafsir-sharawi-khawatir-scan-vol-2 s.1577}{cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1579}{cite:tafsir-sharawi-khawatir-scan-vol-2 s.1581}{cite:tafsir-sharawi-khawatir-scan-vol-vol-cilt 2 s.1582}{cite:tafsir-sharawi-khawatir-scan-vol-2 s.1583}."
  id: "Al-Shaarawi percaya bahwa segala sesuatu di langit dan bumi tunduk kepada Allah, baik dengan sukarela maupun tidak, dan bahwa ketaatan bagi individu yang tidak bertanggung jawab adalah ketaatan terhadap penaklukan, serta ketidaksukaan pada hal-hal yang tidak bisa dipilih manusia, seperti kelahiran, kematian, dan penyakit. Ia menyatakan bahwa Islam yang dipilih bagi orang beriman adalah untuk menyetujui metode Allah melalui tindakan dan penghindaran, dan bahwa alam semesta akan selaras ketika manusia menyelaraskan dengannya. Dia menolak memahami paksaan terhadap agama {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1577}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1579}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1581}{cite:tafsir-sharawi-khawatir-scan-vol-vol-2 p.1582}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1583} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1583}."
