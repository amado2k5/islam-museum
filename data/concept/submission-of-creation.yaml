id: concept/submission-of-creation
class: concept
kind: doctrine
label:
  ar: إسلام الكون (الطوع والكره)
  en: The submission of creation (willing and unwilling)
summary:
  ar: "يرى الشعراوي أن كل ما في السماوات والأرض أسلم لله طوعاً أو كرهاً، والطوع في غير المكلفين طاعة التسخير، والكره فيما لا اختيار للإنسان فيه، كالميلاد والموت والمرض. ويقرر أن الإسلام الاختياري للمؤمن هو أن يوافق منهج الله بالافعل والتجنب، وأن الكون ينسجم حين ينسجم الإنسان معه. ويرفض أن يُفهم الكره بالإكراه على الدين {cite:tafsir-sharawi-khawatir-scan p.1577}{cite:tafsir-sharawi-khawatir-scan p.1579}{cite:tafsir-sharawi-khawatir-scan p.1581}{cite:tafsir-sharawi-khawatir-scan p.1582}{cite:tafsir-sharawi-khawatir-scan p.1583}."
  en: "Sha'rawi holds that all that is in the heavens and the earth has submitted to God, willingly or unwillingly. For beings not under obligation, willing submission is the obedience of subjection, and unwilling submission is what the human has no choice over, such as birth, death and sickness. He holds that the chosen submission of the believer is to match God's law by doing and refraining, and that the universe is in harmony when the human is in harmony with it. He rejects reading unwilling submission as compulsion in religion {cite:tafsir-sharawi-khawatir-scan p.1577}{cite:tafsir-sharawi-khawatir-scan p.1579}{cite:tafsir-sharawi-khawatir-scan p.1581}{cite:tafsir-sharawi-khawatir-scan p.1582}{cite:tafsir-sharawi-khawatir-scan p.1583}."
