issue:
  ar: "ماذا يعني الطوع والكره في إسلام ما في الكون لله؟ وهل يعني الكره الإكراه على الدين أو على الخدمة؟"
  en: "What do willing and unwilling submission mean for all of creation? Does unwilling submission mean compulsion in religion or compulsion to serve?"
perspectives:
- tradition: sunni
  id: sunni-sharawi-involuntary-not-compulsion
  stance:
    ar: "الكره هو ما لا اختيار للإنسان فيه، لا الإكراه على الدين"
    en: "Unwilling submission is what lies outside a person's choice, not compulsion in religion"
  summary:
    ar: "يرى الشعراوي أن الكره في الآية يعني الأمور التي تقع على الإنسان بلا اختياره، وأن ما نُقل عن بعض العلماء من أن الكره هو خدمة العبيد بالقوة لا يصح، لأن الآية الصريحة تنفي الإكراه في الدين {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1582}."
    en: "Sha'rawi holds that the unwilling submission in the verse means things that befall a person without his choice. He rejects the view, which he says some scholars reported, that unwilling submission means the forced service of slaves, since God has said there is no compulsion in religion {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1582}."
