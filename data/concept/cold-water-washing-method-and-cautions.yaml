label: { ar: "طريقة الاغتسال بالماء البارد وتحرزاته عند ابن سينا", en: "The method and cautions of washing in cold water in the Canon", ur: "قانون میں ٹھنڈے پانی سے غسل کا طریقہ اور احتیاطیں" }
summary:
  ar: "يصف ابن سينا طريقة الاغتسال بالماء البارد بعد الرياضة، فيشتد الدلك قبله وتكون الرياضة معتدلة وأسرع قليلاً من المعتاد، ثم يدخل الماء دفعة ويلبث بقدر النشاط وقبل القشعريرة، ويبدأ في أسخن يوم في الصيف وقت الهاجرة، ويتجنبه عقيب الجماع والطعام والقيء، ويقول إنه يهزم الحار الغريزي إلى الداخل ثم يقويه أضعافاً {cite:canon-ibn-sina-print-v1 p.227}."
  en: "Ibn Sina describes washing in cold water after exercise: the rubbing before it is made firmer and the exercise kept moderate though a little quicker than usual, then the person enters the water all at once and stays as long as he feels lively and before shivering; he starts on the hottest summer day at noon, avoids it after intercourse, food or vomiting, and says it drives the innate heat inward and then strengthens it many times over {cite:canon-ibn-sina-print-v1 p.227}."
