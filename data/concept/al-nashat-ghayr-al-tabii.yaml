tags: [islamic-economy-browser, islamic-economy-money]
label:
  ar: النشاط غير الطبيعي
  en: "Unnatural activity: intermediation and extraction"
  es: "Actividad no natural: intermediación y extracción"
  fr: "Activité non naturelle: intermédiation et extraction"
  ur: "غیر فطری سرگرمی: ثالثی اور نکالنا"
  tr: "anormal aktivite"
  id: "aktivitas abnormal"
summary:
  ar: "يميز قعدات بين النشاط الإنساني المتوازن، الذي هو نتاج المفاهيم الإسلامية، والنشاط غير الطبيعي الذي هو نتاج خلل في سلوك الأفراد أو في سلوك من يتولون الإنتاج وإدارته {cite:qadan-manhaj-iqtisad-quran p. 83}. ويرى أن فئة تقف على طريق الإنتاج فتبتز جهد المنتجين عن طريق الإدارة أو التسويق أو الوساطة {cite:qadan-manhaj-iqtisad-quran p. 83}، وأن نهب الموارد الخام في البلاد المستعمرة حوّل الإنسان من منتج إلى مستهلك {cite:qadan-manhaj-iqtisad-quran p. 84}."
  tr: "Kaadat, İslami kavramların ürünü olan dengeli insan faaliyeti ile bireylerin davranışlarındaki veya üretim ve yönetimden sorumluların davranışlarındaki bir kusurdan kaynaklanan doğal olmayan faaliyet arasında ayrım yapar {cite:qadan-manhaj-iqtisad-kur'an s. 83}. Üretim yolunda duran ve üreticilerin çabalarını yönetim, pazarlama veya arabuluculuk yoluyla sömüren bir grup görür {cite:qadan-manhaj-iqtisad-kur'an s. 83} ve sömürge ülkelerinde ham kaynakların yağmalanmasının insanları üreticiden tüketiciye dönüştürdüğünü {cite:qadan-manhaj-iqtisad-kur'an s. 84} görür."
  id: "Kaadat membedakan antara aktivitas manusia yang seimbang, yang merupakan produk dari konsep Islam, dan aktivitas tidak alami yang diakibatkan oleh cacat perilaku individu atau mereka yang bertanggung jawab atas produksi dan manajemen {cite:qadan-manhaj-iqtisad-qur'an hlm. 83}. Kaadat melihat sekelompok yang menghalangi produksi dan mengeksploitasi upaya produsen melalui manajemen, pemasaran, atau mediasi {cite:qadan-manhaj-iqtisad-qur'an hlm. 83} dan melihat bahwa penjarahan sumber daya mentah di negara kolonial mengubah orang dari produsen menjadi konsumen {cite:qadan-manhaj-iqtisad-qur'an hlm. 84}."
