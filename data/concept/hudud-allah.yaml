id: concept/hudud-allah
class: concept
kind: ethical
label:
  ar: "حدود الله"
  en: "The limits of God (hudud Allah)"
  ur: "حدودِ الٰہی"
  es: "Los límites de Dios (hudud Allah)"
  fr: "Les limites de Dieu (hudud Allah)"
summary:
  ar: "يقرأ الشعراوي «حدود الله» في الميراث والنكاح وغيرهما على أنها فواصل تمنع التباس الحق بالحق أو بالباطل، ويفرّق بين حد الملكية الذي يُمنع فيه التعدي، وحد الجوار الذي يُمنع فيه الضرر، وبين النهي الذي يُنهى فيه عن الاقتراب من الشيء، والأمر الذي يُنهى فيه عن تجاوزه {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2036}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2037}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2038}. ويذكر مدخل «حدود» في الموسوعة الفقهية أن الحد في اللغة المنع، وأن حدود الله محارمه، وفي الاصطلاح عند الشافعية والحنابلة عقوبة مقدرة وجبت حقاً لله تعالى، ويجتمع فيها حق الله وحق العبد كالقذف، وعند بعض الفقهاء تدخل فيها عقوبة القصاص لأنها مقدرة بتقدير الشارع، ويطلق لفظ الحد على جرائم الحدود مجازاً. {cite:fiqh-mawsua-noor-doc p.129-131}"
  en: "Al-Sha'rawi reads the 'limits of God' in inheritance, marriage and other rulings as separators that stop one right from merging with another or with wrong. He distinguishes an ownership limit, which must not be crossed, from a neighbourly limit, which prevents harm, and a command, which must not be exceeded, from a prohibition, which must not be approached {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2036}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2037}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2038}. The encyclopedia's hudud entry records that the word means prevention in the lexicon and that the limits of God are His prohibitions; technically, for the Shafi'is and Hanbalis, it is a penalty fixed as due to God, in which God's right and man's right may meet as in slander, while some jurists let retribution enter it because it too is fixed by the Lawgiver, and the term is applied by extension to the crimes themselves. {cite:fiqh-mawsua-noor-doc p.129-131}."
  ur: "شعراوی وراثت اور نکاح وغیرہ کے احکام میں «حدودِ الٰہی» کو ایسی فاصل لکیریں سمجھتے ہیں جو ایک حق کو دوسرے حق یا باطل سے ملنے نہیں دیتیں۔ وہ ملکیت کی حد ⁦(جس سے تجاوز نہ ہو)⁩ اور ہمسائیگی کی حد ⁦(جو نقصان سے روکے)⁩ میں فرق کرتے ہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2036}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2037}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2038}۔"
  es: "Al-Sha'rawi interpreta los \"límites de Dios\" en la herencia, el matrimonio y otras normas como separadores que impiden que un bien se fusione con otro o con un mal. Distingue un límite de propiedad, que no debe ser traspasado, de un límite de vecindad, que previene el daño, y un mandato, que no debe ser excedido, de una prohibición, a la que no debe acercarse {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2036}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2037}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2038}. La entrada hudud de la enciclopedia registra que la palabra significa prevención en el léxico y que los límites de Dios son Sus prohibiciones; Técnicamente, para los shafiíes y hanbalíes, se trata de un castigo establecido como debido a Dios, en el que el derecho de Dios y el derecho del hombre pueden confluir como en la calumnia; mientras que algunos juristas permiten que se incluya la retribución, ya que también está fijada por el Legislador, y el término se aplica por extensión a los delitos mismos. {cite:fiqh-mawsua-noor-doc p.129-131}."
  fr: "Al-Sha'rawi interprète les « limites de Dieu » en matière d'héritage, de mariage et autres règles comme des séparations empêchant un droit de se confondre avec un autre ou avec un tort. Il distingue une limite de propriété, qu'il ne faut pas franchir, d'une limite de bon voisinage, qui prévient le préjudice, et un commandement, qu'il ne faut pas transgresser, d'une interdiction, qu'il ne faut pas approcher {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2036}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2037}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2038}. L'entrée hudud de l'encyclopédie indique que le mot signifie prévention dans le lexique et que les limites de Dieu sont Ses interdictions; Techniquement, pour les écoles chaféite et hanbalite, il s'agit d'une peine fixée par Dieu, où le droit divin et le droit humain peuvent se rejoindre, comme dans le cas de la calomnie. Certains juristes y incluent la notion de rétribution, car elle aussi est fixée par le Législateur, et le terme s'applique par extension aux crimes eux-mêmes. {cite:fiqh-mawsua-noor-doc p.129-131}"
