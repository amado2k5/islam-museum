issue:
  ar: "ماذا يعني أن تكون أحكام الله «حدوداً»، وكيف تُفهم حدود الأمر والنهي؟"
  en: "What does it mean for God's rulings to be 'limits', and how are the limits of command and prohibition understood?"
  ur: "احکامِ الٰہی کو «حدود» کہنے کا کیا مطلب ہے، اور امر و نہی کی حدیں کیسے سمجھی جائیں؟"
