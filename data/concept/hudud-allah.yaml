id: concept/hudud-allah
class: concept
kind: ethical
label:
  ar: "حدود الله"
  en: "The limits of God (hudud Allah)"
  ur: "حدودِ الٰہی"
summary:
  ar: "يقرأ الشعراوي «حدود الله» في الميراث والنكاح وغيرهما على أنها فواصل تمنع التباس الحق بالحق أو بالباطل، ويفرّق بين حد الملكية الذي يُمنع فيه التعدي، وحد الجوار الذي يُمنع فيه الضرر، وبين النهي الذي يُنهى فيه عن الاقتراب من الشيء، والأمر الذي يُنهى فيه عن تجاوزه {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2036}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2037}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2038}. ويذكر مدخل «حدود» في الموسوعة الفقهية أن الحد في اللغة المنع، وأن حدود الله محارمه، وفي الاصطلاح عند الشافعية والحنابلة عقوبة مقدرة وجبت حقاً لله تعالى، ويجتمع فيها حق الله وحق العبد كالقذف، وعند بعض الفقهاء تدخل فيها عقوبة القصاص لأنها مقدرة بتقدير الشارع، ويطلق لفظ الحد على جرائم الحدود مجازاً. {cite:fiqh-mawsua-noor-doc p.129-131}"
  en: "Al-Sha'rawi reads the 'limits of God' in inheritance, marriage and other rulings as separators that stop one right from merging with another or with wrong. He distinguishes an ownership limit, which must not be crossed, from a neighbourly limit, which prevents harm, and a command, which must not be exceeded, from a prohibition, which must not be approached {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2036}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2037}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2038}. The encyclopedia's hudud entry records that the word means prevention in the lexicon and that the limits of God are His prohibitions; technically, for the Shafi'is and Hanbalis, it is a penalty fixed as due to God, in which God's right and man's right may meet as in slander, while some jurists let retribution enter it because it too is fixed by the Lawgiver, and the term is applied by extension to the crimes themselves. {cite:fiqh-mawsua-noor-doc p.129-131}."
  ur: "شعراوی وراثت اور نکاح وغیرہ کے احکام میں «حدودِ الٰہی» کو ایسی فاصل لکیریں سمجھتے ہیں جو ایک حق کو دوسرے حق یا باطل سے ملنے نہیں دیتیں۔ وہ ملکیت کی حد ⁦(جس سے تجاوز نہ ہو)⁩ اور ہمسائیگی کی حد ⁦(جو نقصان سے روکے)⁩ میں فرق کرتے ہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2036}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2037}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2038}۔"
