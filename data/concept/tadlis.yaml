label:
  ar: "التدليس"
  en: "Tadlis (concealment of a defect in a contract)"
  ur: "تدلیس ⁦(عیب چھپانا)⁩"
  es: "Tadlis (ocultación de un defecto en un contrato)"
  fr: "Tadlis (dissimulation d'un vice de contrat)"
summary:
  ar: "التدليس كتمان عيب السلعة عن المشتري، وهو عند المحدثين قسمان: تدليس الإسناد وتدليس الشيوخ. والتدليس حرام بالنص، ويثبت به الخيار في كل معاوضة عند جمهور الفقهاء بشرط ألا يعلم المدلس عليه بالعيب قبل العقد. ويؤدب المدلس تعزيرا. وفي عقد النكاح يثبت الخيار عند الجمهور، بخلاف الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4897} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4898} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4899} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4900}"
  en: "Tadlis is hiding a defect in goods from the buyer. Among the hadith scholars it has two kinds, concealing the chain of narration and concealing the name of a teacher. Tadlis is forbidden by text, and gives a right of option in every exchange, by the majority of jurists, provided the deceived party did not know of the defect before the contract. The deceiver is disciplined by discretionary penalty. In marriage the majority hold that a right of annulment arises, unlike the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4897} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4898} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4899} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4900}"
  es: "El tadlis consiste en ocultar un defecto en los bienes al comprador. Entre los estudiosos del hadiz, existen dos tipos: ocultar la cadena de transmisión y ocultar el nombre del maestro. El tadlis está prohibido por los textos y otorga un derecho de opción en cada transacción, según la mayoría de los juristas, siempre que la parte engañada desconociera el defecto antes del contrato. El engañador es sancionado con una pena discrecional. En el matrimonio, la mayoría sostiene que surge el derecho a la anulación, a diferencia de los hanafíes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4897} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4898} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4899} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4900}"
  fr: "Le tadlis consiste à dissimuler un défaut d'un bien à l'acheteur. Parmi les spécialistes du hadith, on distingue deux types de tadlis: la dissimulation de la chaîne de transmission et la dissimulation du nom du maître. Le tadlis est interdit par les textes et, selon la majorité des juristes, confère un droit de rétractation lors de tout échange, à condition que la partie trompée ignorât le défaut avant la conclusion du contrat. Le trompeur est passible d'une sanction discrétionnaire. En matière de mariage, la majorité considère qu'un droit d'annulation est applicable, contrairement à l'école hanafite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4897} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4898} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4899} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4900}"
