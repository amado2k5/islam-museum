  en: "Tadlis (concealment of a defect in a contract)"
  ur: "تدلیس (عیب چھپانا)"
summary:
  ar: "التدليس كتمان عيب السلعة عن المشتري، وهو عند المحدثين قسمان: تدليس الإسناد وتدليس الشيوخ. والتدليس حرام بالنص، ويثبت به الخيار في كل معاوضة عند جمهور الفقهاء بشرط ألا يعلم المدلس عليه بالعيب قبل العقد. ويؤدب المدلس تعزيرا. وفي عقد النكاح يثبت الخيار عند الجمهور، بخلاف الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4897} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4898} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4899} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4900}"
  en: "Tadlis is hiding a defect in goods from the buyer. Among the hadith scholars it has two kinds, concealing the chain of narration and concealing the name of a teacher. Tadlis is forbidden by text, and gives a right of option in every exchange, by the majority of jurists, provided the deceived party did not know of the defect before the contract. The deceiver is disciplined by discretionary penalty. In marriage the majority hold that a right of annulment arises, unlike the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4897} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4898} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4899} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4900}"
