id: concept/dhurriyyat-adam-fi-zahrih
class: concept
kind: doctrine
label:
  ar: "ذرية آدم مطمورة فيه"
  en: "Adam's descendants latent in him"
  ur: "آدم میں ان کی نسل کا پوشیدہ ہونا"
summary:
  ar: "يرى الشعراوي أن ذرية آدم كانت مطمورة فيه عند الخلق، وأن الحياة متصلة منذ آدم، وأن في كل إنسان جزءا من آدم، وأن الملائكة سجدت لآدم وذريته {cite:tafsir-sharawi-khawatir-scan p.239} {cite:tafsir-sharawi-khawatir-scan p.240}."
  en: "Sha'rawi holds that Adam's descendants were latent in him at creation, that life has been continuous since Adam, that each person carries a part of Adam, and that the angels prostrated to Adam and his descendants {cite:tafsir-sharawi-khawatir-scan p.239} {cite:tafsir-sharawi-khawatir-scan p.240}."
  ur: "شعراوی کے نزدیک آدم کی ذریت ان کی تخلیق کے وقت ان میں پوشیدہ تھی، زندگی آدم سے لے کر اب تک متصل ہے، ہر انسان میں آدم کا ایک حصہ ہے، اور فرشتوں نے آدم اور ان کی ذریت کو سجدہ کیا {cite:tafsir-sharawi-khawatir-scan p.239} {cite:tafsir-sharawi-khawatir-scan p.240}۔"
wings: [ideas]
themes: [cosmology-and-creation]
periods: [period/prophetic-era]
regions: [global]
issue:
  ar: "هل تحمل الذرية في آدم وجودا قبل الخلق، وكيف تُفهم اتصال الحياة من آدم؟"
  en: "Did the descendants exist in Adam before their creation, and how is the continuity of life from Adam to be understood?"
perspectives:
  - tradition: sunni
    id: sunni-sharawi
    stance:
      ar: "الذرية مطمورة في آدم، والحياة متصلة منه إلى يوم القيامة"
      en: "The descendants were latent in Adam, and life has continued from him to the Day of Resurrection"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن الخطاب بصيغة الجمع في الآية يدل على أن الذرية كانت مطمورة في ظهر آدم، ويصف اتصال الحياة بسلسلة من الخلايا الحية التي تنتقل من الأب إلى الابن {cite:tafsir-sharawi-khawatir-scan p.239} {cite:tafsir-sharawi-khawatir-scan p.240}."
      en: "Sha'rawi holds that the plural address in the verse shows that the descendants were latent in Adam's loins, and he describes the continuity of life as a chain of living cells passed from father to son {cite:tafsir-sharawi-khawatir-scan p.239} {cite:tafsir-sharawi-khawatir-scan p.240}."
    sources: [source/tafsir-sharawi-khawatir-scan]
