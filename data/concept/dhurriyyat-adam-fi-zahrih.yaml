    stance:
      ar: "قراءة علمية أو تاريخية لاتصال الحياة لم تُضف بعد"
      en: "A scientific or historical reading of the continuity of life is not yet added"
    summary:
      ar: "لم تُعرض في هذه الصفحات دراسة علمية لتسلسل الحياة، وتحتاج إلى مرجع محدد قبل أن تُعرض. كلام الشعراوي هنا عن الخلايا والجزيئات لا يُعتمد علميا قبل مراجعته."
      en: "No scientific study of the continuity of life is set out in these pages. His statements about cells and molecules are not to be treated as scientific findings until they are checked against named sources."
