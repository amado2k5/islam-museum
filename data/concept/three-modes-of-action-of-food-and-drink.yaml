label: { ar: "أنواع فعل المأكول والمشروب في البدن عند ابن سينا", en: "The three ways food and drink act on the body in the Canon", ur: "قانون میں کھانے پینے کی چیزوں کے بدن پر اثر کی تین صورتیں" }
summary:
  ar: "في الفصل الخامس عشر، في موجبات ما يؤكل ويشرب، يقسم ابن سينا فعل المأكول والمشروب في بدن الإنسان إلى ثلاثة وجوه: فعل بكيفيته فقط، وفعل بعنصره، وفعل بجملة جوهره، وينبه إلى أن ألفاظ هذه الوجوه قد تتقارب في الاستعمال اللغوي وأنه يصطلح عليها معاني بعينها {cite:canon-ibn-sina-print-v1 p.131}."
  en: "In the fifteenth chapter, on the causes that lie in what is eaten and drunk, Ibn Sina divides the action of food and drink on the human body into three: action by its quality alone, action by its element, and action by the whole of its substance. He notes that the three terms come close in ordinary usage and that he fixes a particular sense for each {cite:canon-ibn-sina-print-v1 p.131}."
