id: concept/three-modes-of-action-of-food-and-drink
class: concept
kind: scientific
label: { ar: "أنواع فعل المأكول والمشروب في البدن عند ابن سينا", en: "The three ways food and drink act on the body in the Canon", ur: "قانون میں کھانے پینے کی چیزوں کے بدن پر اثر کی تین صورتیں", es: "Las tres formas en que los alimentos y las bebidas actúan sobre el cuerpo en el Canon", fr: "Les trois façons dont les aliments et les boissons agissent sur le corps dans le Canon" }
summary:
  ar: "في الفصل الخامس عشر، في موجبات ما يؤكل ويشرب، يقسم ابن سينا فعل المأكول والمشروب في بدن الإنسان إلى ثلاثة وجوه: فعل بكيفيته فقط، وفعل بعنصره، وفعل بجملة جوهره، وينبه إلى أن ألفاظ هذه الوجوه قد تتقارب في الاستعمال اللغوي وأنه يصطلح عليها معاني بعينها {cite:canon-ibn-sina-print-v1 p.131}."
  en: "In the fifteenth chapter, on the causes that lie in what is eaten and drunk, Ibn Sina divides the action of food and drink on the human body into three: action by its quality alone, action by its element, and action by the whole of its substance. He notes that the three terms come close in ordinary usage and that he fixes a particular sense for each {cite:canon-ibn-sina-print-v1 p.131}."
  es: "En el capítulo quince, sobre las causas que residen en lo que se come y se bebe, Ibn Sina divide la acción de los alimentos y las bebidas sobre el cuerpo humano en tres: acción por su cualidad, acción por su elemento y acción por la totalidad de su sustancia. Observa que los tres términos son similares en el uso común y que él asigna un significado particular a cada uno {cite:canon-ibn-sina-print-v1 p.131}."
  fr: "Dans le quinzième chapitre, consacré aux causes inhérentes à l'alimentation et à la boisson, Ibn Sina distingue trois actions des aliments et des boissons sur le corps humain: l'action par leur qualité seule, l'action par leur élément et l'action par la substance dans son ensemble. Il remarque que ces trois termes sont proches dans l'usage courant et qu'il attribue à chacun une signification particulière."
  ur: "پندرہویں باب میں کھانے پینے کی چیزوں میں پائے جانے والے اسباب کے بارے میں ابن سینا نے انسانی جسم پر کھانے پینے کے عمل کو تین حصوں میں تقسیم کیا ہے: عمل صرف اس کے معیار سے، عمل اس کے عنصر سے، اور عمل اس کے تمام مادّہ سے۔ وہ نوٹ کرتا ہے کہ تینوں اصطلاحات عام استعمال میں قریب آتی ہیں اور وہ ہر ایک کے لیے ایک خاص معنی طے کرتا ہے {cite:canon-ibn-sina-print-v1 p.131}۔"
