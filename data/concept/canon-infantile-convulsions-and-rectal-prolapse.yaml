summary:
  ar: "يذكر ابن سينا ريح الصبيان، وقد ذكر علاجه في باب أمراض الرأس، ويضيف مسحوقاً من الصعتر والجندبيدستر والكمون، ثم خروج المقعدة وعلاجه بطبيخ قابضات يقعد الصبي فيه فاتراً {cite:canon-ibn-sina-print-v1 p.219}."
  en: "Ibn Sina mentions infantile convulsions, whose treatment he gave under diseases of the head, and adds a powder of thyme, castoreum and cumin; then prolapse of the rectum, treated by a decoction of astringents in which the child sits lukewarm {cite:canon-ibn-sina-print-v1 p.219}."
