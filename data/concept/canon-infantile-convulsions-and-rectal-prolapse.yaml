id: concept/canon-infantile-convulsions-and-rectal-prolapse
class: concept
kind: scientific
label:
  ar: "ريح الصبيان وخروج المقعدة عند ابن سينا"
  en: "Infantile convulsions and rectal prolapse in the Canon"
  fr: "Convulsions infantiles et prolapsus rectal dans le Canon"
  ur: "قانون میں بچوں کے جھٹکے اور مقعد کا باہر نکلنا"
  es: "Convulsiones infantiles y prolapso rectal en el Canon"
  tr: "Çocukların Rüzgarı ve İbn Sina'daki Oturumun Çıkışı"
  id: "Angin Anak Laki-laki dan Keluarnya Sidang di Ibn Sina"
summary:
  ar: "يذكر ابن سينا ريح الصبيان، وقد ذكر علاجه في باب أمراض الرأس، ويضيف مسحوقاً من الصعتر والجندبيدستر والكمون، ثم خروج المقعدة وعلاجه بطبيخ قابضات يقعد الصبي فيه فاتراً {cite:canon-ibn-sina-print-v1 p.219}."
  en: "Ibn Sina mentions infantile convulsions, whose treatment he gave under diseases of the head, and adds a powder of thyme, castoreum and cumin; then prolapse of the rectum, treated by a decoction of astringents in which the child sits lukewarm {cite:canon-ibn-sina-print-v1 p.219}."
  fr: "Ibn Sina renvoie les convulsions aux maladies céphaliques, ajoute poudre de thym, castoréum et cumin, puis décrit bain de siège tiède astringent pour prolapsus rectal {cite:canon-ibn-sina-print-v1 p.219}."
  es: "Ibn Sina menciona las convulsiones infantiles, cuyo tratamiento dio bajo enfermedades de la cabeza, y agrega un polvo de tomillo, castóreo y comino; luego el prolapso del recto, tratado con una decocción de astringentes en la que el niño se sienta tibio {cite:canon-ibn-sina-print-v1 p.219}."
  ur: "ابن سینا نے نوزائیدہ آکشیپ کا ذکر کیا ہے، جس کا علاج اس نے سر کے امراض میں دیا تھا، اور اس میں تھیم، کاسٹوریم اور زیرہ کا پاؤڈر شامل کیا ہے۔ اس کے بعد ملاشی کے پھیلنے کا علاج اسٹرینجنٹ کے کاڑھے سے کیا جاتا ہے جس میں بچہ نیم گرم بیٹھتا ہے۔"
  tr: "İbn Sina, çocukların rüzgarından bahseder ve baş hastalıkları bölümünde tedavisinden bahseder; kekik, boncuk ve kimyon tozu ekleyip, oturma yerini kaldırıp çocuğun tembelce oturduğu bir sıkma kabıyla tedavi eder {cite:canon-ibn-sina-print-v1 s.219}."
  id: "Ibn Sina menyebutkan angin anak laki-laki, dan ia menyebutkan pengobatannya dalam bab penyakit kepala, menambahkan bubuk thyme, manik-manik, dan jinten, lalu melepas tempat duduknya dan merawatnya dengan wadah peras di mana anak laki-laki itu duduk malas {cite:canon-ibn-sina-print-v1 hlm.219}."
