id: concept/zij-sabi-returned-chords-the-versed-sine
class: concept
kind: scientific
label: { ar: "الوتر الراجع والقوس الراجعة في الزيج الصابي", en: "The returned chord and returned arc (the versed sine)", ur: "وتر راجع اور قوس راجعہ یعنی جیبِ معکوس" }
summary:
  ar: "يعرّف البتاني الوتر الراجع بطريقة عملية: إذا كان العدد المراد وتره الراجع أقل من تسعين درجة فينقص من تسعين ويعرف وتر الباقي وينقص من الستين فهو الوتر الراجع، وإن كان أكثر من تسعين فيعرف وتر ما زاد على التسعين ويزاد على الستين. ثم يعلم عكس ذلك لمعرفة القوس الراجعة من وترها. {cite:zij-sabi-nallino-byblion pp.20-21}."
  en: "Al-Battani defines the returned chord by a working rule: if the number whose returned chord is wanted is less than ninety degrees, it is subtracted from ninety, the chord of the remainder is found and subtracted from sixty, giving the returned chord; if more than ninety, the chord of the excess over ninety is found and added to sixty. He then gives the reverse rule to find the returned arc from its chord. {cite:zij-sabi-nallino-byblion pp.20-21}."
  ur: "البتانی وتر راجع کی ایک عملی تعریف کرتے ہیں: اگر جس عدد کا وتر راجع مطلوب ہو وہ نوے درجے سے کم ہو تو اسے نوے میں سے گھٹائیں، باقی کا وتر معلوم کریں اور اسے ساٹھ میں سے گھٹائیں، تو وہی وتر راجع ہے؛ اور اگر نوے سے زیادہ ہو تو نوے پر زائد کا وتر معلوم کر کے ساٹھ میں جمع کریں۔ پھر وہ اس کا الٹ بتاتے ہیں کہ وتر سے قوس راجعہ کیسے معلوم ہو۔ {cite:zij-sabi-nallino-byblion pp.20-21}۔"
