label: { ar: "الوتر الراجع والقوس الراجعة في الزيج الصابي", en: "The returned chord and returned arc (the versed sine)", ur: "وتر راجع اور قوس راجعہ یعنی جیبِ معکوس", es: "El acorde devuelto y el arco devuelto (el seno invertido)", fr: "L'accord et l'arc retournés (le sinus versifié)", tr: "Sabian astronomik tablolarında geriye doğru hareket eden kiriş ve geriye doğru hareket eden yay.", id: "Tali busur retrograde dan busur retrograde dalam tabel astronomi Sabian" }
summary:
  ar: "يعرّف البتاني الوتر الراجع بطريقة عملية: إذا كان العدد المراد وتره الراجع أقل من تسعين درجة فينقص من تسعين ويعرف وتر الباقي وينقص من الستين فهو الوتر الراجع، وإن كان أكثر من تسعين فيعرف وتر ما زاد على التسعين ويزاد على الستين. ثم يعلم عكس ذلك لمعرفة القوس الراجعة من وترها. {cite:zij-sabi-nallino-byblion pp.20-21}."
  en: "Al-Battani defines the returned chord by a working rule: if the number whose returned chord is wanted is less than ninety degrees, it is subtracted from ninety, the chord of the remainder is found and subtracted from sixty, giving the returned chord; if more than ninety, the chord of the excess over ninety is found and added to sixty. He then gives the reverse rule to find the returned arc from its chord. {cite:zij-sabi-nallino-byblion pp.20-21}."
  ur: "البتانی وتر راجع کی ایک عملی تعریف کرتے ہیں: اگر جس عدد کا وتر راجع مطلوب ہو وہ نوے درجے سے کم ہو تو اسے نوے میں سے گھٹائیں، باقی کا وتر معلوم کریں اور اسے ساٹھ میں سے گھٹائیں، تو وہی وتر راجع ہے؛ اور اگر نوے سے زیادہ ہو تو نوے پر زائد کا وتر معلوم کر کے ساٹھ میں جمع کریں۔ پھر وہ اس کا الٹ بتاتے ہیں کہ وتر سے قوس راجعہ کیسے معلوم ہو۔ {cite:zij-sabi-nallino-byblion pp.20-21}۔"
  es: "Al-Battani define la cuerda resultante mediante una regla práctica: si el número cuya cuerda se busca es menor de noventa grados, se le resta de noventa, se halla la cuerda del resto y se le resta de sesenta, obteniendo así la cuerda resultante; si es mayor de noventa, se halla la cuerda del exceso y se le suma sesenta. A continuación, proporciona la regla inversa para hallar el arco resultante a partir de su cuerda. {cite:zij-sabi-nallino-byblion pp.20-21}."
  fr: "Al-Battani définit la corde retournée par une règle pratique: si le nombre dont on cherche la corde retournée est inférieur à 90 degrés, on le soustrait de 90, on calcule la corde du reste et on la soustrait de 60, ce qui donne la corde retournée; s’il est supérieur à 90, on calcule la corde de l’excédent au-delà de 90 et on l’ajoute à 60. Il donne ensuite la règle inverse pour trouver l’arc retourné à partir de sa corde. {cite:zij-sabi-nallino-byblion pp.20-21}."
  tr: "El-Battani, geriye doğru kirişi pratik olarak şöyle tanımlar: İstenen derece sayısı doksandan az ise, doksanı çıkarın, kalan derecenin kirişini belirleyin ve altmışı çıkarın; bu geriye doğru kiriştir. Doksandan büyük ise, doksanı aşan derecenin kirişini belirleyin ve altmış ekleyin. Daha sonra, kirişinden geriye doğru yayı belirlemek için tersi yapılır. {cite:zij-sabi-nallino-byblion pp.20-21}."
  id: "Al-Battani mendefinisikan tali busur retrograde secara praktis: jika jumlah derajat yang diinginkan kurang dari sembilan puluh, kurangi sembilan puluh, tentukan tali busur dari derajat yang tersisa, dan kurangi enam puluh; ini adalah tali busur retrograde. Jika lebih besar dari sembilan puluh, tentukan tali busur dari derajat yang melebihi sembilan puluh dan tambahkan enam puluh. Kemudian, kebalikannya dilakukan untuk menentukan busur retrograde dari tali busurnya. {cite:zij-sabi-nallino-byblion pp.20-21}."
