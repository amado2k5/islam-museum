id: concept/opaque-white-ware
class: concept
kind: art_form
label: { ar: "الخزف الأبيض المعتم", en: "Opaque white ware", ur: "غیر شفاف سفید ظروف", es: "Vajilla blanca opaca", fr: "vaisselle blanche opaque", tr: "Opak beyaz porselen", id: "Porselen putih buram" }
summary:
  ar: "فخار مغطى بطلاء رصاصي أبيض معتم بالقصدير، صُنع بكثرة في الشرق الأدنى في القرنين التاسع والعاشر، واستعمله خزافو العراق بأثر بالغ تقليدًا للخزف الصيني الأبيض، وقلدته نيسابور {cite:wilkinson-nishapur-pottery p. 221}."
  en: "Earthenware covered with a lead glaze made opaque white with tin, widely made in the Near East in the ninth and tenth centuries, used to great effect in Iraq to imitate white Chinese ware, and imitated at Nishapur {cite:wilkinson-nishapur-pottery p. 221}."
  ur: "قلعی سے غیر شفاف سفید کیے گئے سیسے کے لعاب والے ظروف، نویں دسویں صدی میں مشرقِ قریب میں عام؛ عراق میں چینی سفید ظروف کی نقل میں استعمال ہوئے اور نیشاپور میں ان کی نقل ہوئی {cite:wilkinson-nishapur-pottery p. 221}."
  es: "Cerámica cubierta con un vidriado de plomo que se volvía blanco opaco con estaño, muy producida en el Cercano Oriente en los siglos IX y X, utilizada con gran éxito en Irak para imitar la cerámica blanca china, e imitada en Nishapur {cite:wilkinson-nishapur-pottery p. 221}."
  fr: "Faïence recouverte d'une glaçure au plomb rendue opaque blanche avec de l'étain, largement fabriquée au Proche-Orient aux IXe et Xe siècles, utilisée avec grand succès en Irak pour imiter la faïence blanche chinoise, et imitée à Nishapur {cite:wilkinson-nishapur-pottery p. 221}."
  tr: "9. ve 10. yüzyıllarda Yakın Doğu'da yaygın olarak üretilen, Iraklı çömlekçiler tarafından beyaz Çin porselenini derin bir taklitle kullanan ve Nishapur tarafından taklit edilen koyu beyaz kurşun boya ile kaplanmış çömlekler, Nişapur da bunu taklit etmiştir {atıf:Wilkinson-Nishapur-pottery s. 221}."
  id: "Keramik yang dilapisi cat timah putih gelap dengan timah, dibuat secara luas di Timur Dekat pada abad ke-9 dan ke-10, dan digunakan oleh pembuat tembikar Irak dengan tiruan mendalam dari porselen putih Tionghoa, dan Nishapur menirunya {kutip: Wilkinson-Nishapur-tembikar hlm. 221}."
