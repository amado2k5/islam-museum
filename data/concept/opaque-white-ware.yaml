label: { ar: "الخزف الأبيض المعتم", en: "Opaque white ware", ur: "غیر شفاف سفید ظروف" }
summary:
  ar: "فخار مغطى بطلاء رصاصي أبيض معتم بالقصدير، صُنع بكثرة في الشرق الأدنى في القرنين التاسع والعاشر، واستعمله خزافو العراق بأثر بالغ تقليدًا للخزف الصيني الأبيض، وقلدته نيسابور {cite:wilkinson-nishapur-pottery p. 221}."
  en: "Earthenware covered with a lead glaze made opaque white with tin, widely made in the Near East in the ninth and tenth centuries, used to great effect in Iraq to imitate white Chinese ware, and imitated at Nishapur {cite:wilkinson-nishapur-pottery p. 221}."
  ur: "قلعی سے غیر شفاف سفید کیے گئے سیسے کے لعاب والے ظروف، نویں دسویں صدی میں مشرقِ قریب میں عام؛ عراق میں چینی سفید ظروف کی نقل میں استعمال ہوئے اور نیشاپور میں ان کی نقل ہوئی {cite:wilkinson-nishapur-pottery p. 221}."
