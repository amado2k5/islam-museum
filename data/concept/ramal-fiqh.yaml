id: concept/ramal-fiqh
class: concept
kind: legal
label:
  ar: "الرمل"
  en: "Ramal: the brisk walk in the first three circuits of the tawaf"
  ur: "رمل (طواف کے تین چکروں میں تیز چلنا)"
summary:
  ar: "الرَّمَل في اللغة الهرولة، وهو الإسراع في المشي مع هز الكتفين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8995} وحكمه التكليفي أنه سنة من سنن الطواف، يسن في الأشواط الثلاثة الأولى من كل طواف يعقبه سعي، وعليه جمهور الفقهاء، وهو خاص بالرجال دون النساء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8995}"
  en: "Ramal is the brisk walk: hurrying in one's steps while swaying the shoulders. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8995} Its ruling is that it is a sunna of the tawaf, recommended in the first three circuits of every tawaf that is followed by sa'y, as the majority of jurists hold, and it is for men only, not women. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8995}"
  ur: "رمل تیز قدموں سے چلنے کو کہتے ہیں، جس میں کندھے ہلائے جاتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8995} جمہور فقہا کے نزدیک یہ طواف کی سنت ہے، جو ہر اس طواف میں پہلے تین چکروں میں مسنون ہے جس کے بعد سعی ہو، اور یہ صرف مردوں کے لیے ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8995}"
