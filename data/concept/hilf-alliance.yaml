label: { ar: "الحِلف", en: "Hilf (alliance and inheritance by alliance)", ur: "حِلف (معاہدہ اور حلف کی وراثت)" }
summary:
  ar: "الحِلف لغة العهد والمعاقدة على التناصر، وكانت الأحلاف في الجاهلية تعقد بين فرد وقبيلة، أو بين فرد وفرد، أو بين قبيلتين، كحلف المطيبين وحلف الفضول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7251} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7252} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7253} وكان الحليف يمنع حليفه ويتحمل عنه جرائره، وقد أبطل الإسلام منه التناصر على الباطل والتوارث دون ذوي الأرحام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7253} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7254} وفي الحديث: لا حلف في الإسلام، وأيما حلف كان في الجاهلية لم يزده الإسلام إلا شدة؛ وحمله بعضهم على حلف التوارث والنصرة على الباطل، وأجاز آخرون التحالف على الخير والنصرة على الحق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7254} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7257} وكان التوارث بالحلف معمولا به ثم نُسخ، واختلف في الناسخ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7257} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7258} وذهب الجمهور إلى أن التوارث بالحلف منسوخ، وذهب الحنفية والحكم وحماد ورواية عن أحمد إلى بقائه بعد سائر الورثة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7258} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7259} وعند الحنفية يعقل الحليف عن مولاه بالولاء ولا ينتقل عنه إلا برضاه، وقال الجمهور: لا عقل بالحلف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7260} والتحالف بين طائفتين يجيزه بعض العلماء للتناصر على الحق ودفع الظلم، ويمنعه أكثر العلماء اعتمادا على ظاهر الحديث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7260} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7261} ويُختم المدخل بالعنوان التالي «حلق» في ص 7261. "
  en: "Hilf is lexically a covenant or alliance for mutual support; in pre-Islamic Arabia alliances bound an individual to a clan, two individuals, or two clans, as in the alliance of the perfumed and the alliance of the virtuous. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7251} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7252} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7253} The ally protected his partner and bore his offences, and Islam forbade alliances for wrong or for inheritance beyond blood kin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7253} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7254} The hadith 'no alliance in Islam, and whatever alliance existed in the age of ignorance Islam only strengthened' is read by some as forbidding alliances for inheritance and support in wrong, and by others as allowing alliances for good and for right. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7254} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7257} Inheritance by alliance was first practised and then abrogated, and the jurists differ on the abrogating verse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7257} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7258} The majority hold inheritance by alliance abrogated; the Hanafis, al-Hakam, Hammad and a report from Ahmad hold it survives after the other heirs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7258} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7259} For the Hanafis an alliance holder pays the blood-money for his patron and cannot shift his loyalty without consent; the majority deny that any blood-money arises from alliance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7260} An alliance between two groups is allowed by some scholars for mutual support in right and the removal of wrong, and forbidden by most on the apparent reading of the hadith. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7260} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7261} The entry closes at the next headword, halq (حلق), on p.7261. "
  ur: "حلف لغت میں عہد اور باہمی مدد کا معاہدہ ہے؛ جاہلیت میں یہ معاہدے فرد اور قبیلے، دو افراد یا دو قبیلوں کے درمیان ہوتے تھے، جیسے حلفِ مطیبین اور حلفِ فضول۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7251} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7252} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7253} حلیف اپنے حلیف کی حفاظت کرتا اور اس کے جرائم کا بوجھ اٹھاتا تھا، اور اسلام نے باطل پر مدد اور رشتے داروں کے بغیر وراثت کو ختم کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7253} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7254} حدیث «لا حلف في الإسلام» کی تعبیر میں بعض نے وراثت اور باطل پر مدد کے حلف کو ممنوع سمجھا، اور بعض نے خیر اور حق کی مدد کے حلف کو جائز رکھا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7254} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7257} ابتداءً حلف کی وراثت رائج تھی پھر منسوخ ہوئی، اور ناسخ میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7257} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7258} جمہور کے نزدیک حلف کی وراثت منسوخ ہے، جبکہ حنفیہ، حکم، حماد اور امام احمد کی ایک روایت کے مطابق یہ باقی ہے اور دیگر ورثاء کے بعد آتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7258} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7259} حنفیہ کے نزدیک حلیف اپنے مولیٰ کی طرف سے دیت ادا کرتا ہے اور اس کی ولاء سے رضامندی کے بغیر نہیں نکل سکتا؛ جمہور کے نزدیک حلف سے عقل (دیت) لازم نہیں آتی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7260} دو گروہوں کے درمیان حلف کو بعض علماء حق کی مدد اور ظلم دفع کرنے کے لیے جائز کہتے ہیں، اور اکثر علماء ظاہرِ حدیث پر اعتماد کرتے ہوئے ممنوع۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7260} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7261} یہ مدخل p.7261 پر اگلے مدخل «حلق» پر ختم ہوتا ہے۔ "
