label:
  ar: "السفاني"
  en: "Al-sifani (thought to be camel pasture)"
  fr: "Al-sifani (plante que l’on pense broutée par les chameaux)"
  ur: "السفانی ⁦(اونٹ کا چارہ سمجھا جاتا ہے)⁩"
summary:
  ar: "يُظن أنه رعي الإبل، وهو ينقّي الكليتين جداً، وشديد النفع من عضّة الكلب الكَلِب {cite:canon-ibn-sina-print-v1 p.375} {cite:canon-ibn-sina-print-v1 p.376}."
  en: "Thought to be camel pasture. It cleanses the kidneys strongly and is very useful against the bite of a rabid dog {cite:canon-ibn-sina-print-v1 p.375} {cite:canon-ibn-sina-print-v1 p.376}."
  fr: "On pense qu’il s’agit d’une plante broutée par les chameaux. Le livre lui prête une forte action purificatrice sur les reins et la dit très utile contre la morsure d’un chien enragé {cite:canon-ibn-sina-print-v1 p.375} {cite:canon-ibn-sina-print-v1 p.376}."
  ur: "خیال کیا جاتا ہے کہ یہ اونٹ کا چارہ ہے۔ یہ گردوں کو خوب صاف کرتا ہے اور باؤلے کتے کے کاٹے میں بہت مفید ہے {cite:canon-ibn-sina-print-v1 p.375} {cite:canon-ibn-sina-print-v1 p.376}۔"
