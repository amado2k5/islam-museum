id: concept/al-arabiyya-fi-lebanon
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-world]
label:
  ar: "العربية في لبنان"
  en: "Arabic in Lebanon"
  ur: "لبنان میں عربی"
  fr: "L'arabe au Liban"
  es: "El árabe en el Líbano"
  tr: "Lübnan'da Arapça"
  id: "Bahasa Arab di Lebanon"
summary:
  ar: "ما وُجد عن العربية في لبنان: المادة 11 من الدستور في العربية والفرنسية كما يعرضها Constitute، ووصف دراسة مكتبة الكونغرس لأشكال العربية والعامية اللبنانية والفرنسية والإنجليزية والأرمنية والسريانية واقتراح الكتابة بالعامية، وتصنيف الشامية عند مانشستر وGlottolog، مع ما لم يُعثر عليه. وأُضيف نص الحكم الدستوري بلغته الأصلية كما ورد في ملخص بحثي لم يتحقق المتحف منه على الصفحة."
  en: "What was found on Arabic in Lebanon: Article 11 of the Constitution on Arabic and French as the Constitute Project shows it, the Library of Congress study's account of the forms of Arabic, Lebanese colloquial, French, English, Armenian and Syriac and the proposal to write the colloquial, and the Levantine classification at Manchester and Glottolog, with what was not found. The constitutional text is added in its original wording, as supplied in a research summary that the museum did not check against the page."
  ur: "لبنان میں عربی کے بارے میں جو ملا: دستور کی دفعہ 11 عربی اور فرانسیسی پر جیسا Constitute دکھاتا ہے، لائبریری آف کانگریس کی تحقیق کا عربی کی صورتوں، لبنانی عامی، فرانسیسی، انگریزی، آرمینی اور سریانی کا بیان اور عامی لکھنے کی تجویز، اور مانچسٹر اور Glottolog میں شامی گروہ کی درجہ بندی، اور جو نہیں ملا اس کے ساتھ۔ آئینی حکم کی عبارت اصل زبان میں شامل کی گئی ہے، جیسی ایک تحقیقی خلاصے میں ملی جسے متحف نے صفحے سے نہیں جانچا۔"
  fr: "Ce qui a été trouvé sur l'arabe au Liban : l'article 11 de la Constitution sur l'arabe et le français tel que le montre le Constitute Project, le compte rendu de l'étude de la Bibliothèque du Congrès sur les formes de l'arabe, le parler libanais, le français, l'anglais, l'arménien et le syriaque et la proposition d'écrire le parlé, et la classification levantine chez Manchester et Glottolog, avec ce qui n'a pas été trouvé. Le texte constitutionnel est ajouté dans sa langue d'origine, tel que fourni par un résumé de recherche que le musée n'a pas vérifié sur la page."
  es: "Lo que se encontró sobre el árabe en el Líbano: el artículo 11 de la Constitución sobre el árabe y el francés tal como lo muestra el Constitute Project, el relato del estudio de la Biblioteca del Congreso sobre las formas del árabe, el hablado libanés, el francés, el inglés, el armenio y el siríaco y la propuesta de escribir el hablado, y la clasificación levantina en Manchester y Glottolog, con lo que no se halló. Se añade el texto constitucional en su lengua original, tal como lo entrega un resumen de investigación que el museo no verificó en la página."
  tr: "Lübnan'da Arapça hakkında bulunanlar: Anayasa'nın Arapça ve Fransızca 11. maddesi, Constitutione tarafından sunulan şekilde, Kongre Kütüphanesi'nin Arapça, Lübnan günlük Arapça, Fransızca, İngilizce, Ermenice ve Süryanice biçimlerini incelemesinin tanımı, günlük Arapça yazma önerisi, Manchester ve Glottolog tarafından Levantin sınıflandırılması ve bulunamayanlar yer almaktadır. Anayasa kararının metni, müzenin sayfada doğrulamadığı bir araştırma özetinde belirtildiği üzere orijinal dilinde eklenmiştir."
  id: "Item yang ditemukan tentang bahasa Arab di Lebanon: Pasal 11 Konstitusi dalam bahasa Arab dan Prancis, yang disajikan oleh Konstitusi, definisi studi Perpustakaan Kongres tentang bahasa Arab, formulir harian Lebanon dalam bahasa Arab, Prancis, Inggris, Armenia, dan Suryani, rekomendasi penulisan harian bahasa Arab, klasifikasi Levant oleh Manchester dan Glottolog, serta materi yang tidak tersedia. Teks keputusan Konstitusi ditambahkan dalam bahasa aslinya seperti yang tercantum dalam ringkasan penelitian yang tidak diverifikasi oleh museum di halaman tersebut."
