id: concept/shu-um-omen
class: concept
kind: belief
label:
  ar: "الشُّؤْم"
  en: "Shu'um (ill omen) and tatayyur (taking omens)"
summary:
  ar: "الشؤم في اللغة الشر، والتشاؤم توقع الشر، وكانت العرب تتطير بالطير إذا مرت بها فتذهب شمالا أو يمينا، فنهى الشرع عن ذلك بقوله لا طيرة ولا هامة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9901} ويرى بعض الحنابلة كراهة التشاؤم دون الفأل، وذهب آخرون إلى أن الطيرة من الكبائر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9903} وفي الحديث أن الشؤم في الفرس والمرأة والدار، وقد أنكرت عائشة أن يكون هذا من قول النبي وحملته على الجاهلية، وحمله مالك وابن قتيبة وبعض علماء الحديث على ظاهره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9904} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9903}"
  en: "In language shu'um is ill, and tashaum is expecting ill; the Arabs used to take omens from birds that flew by, to left or right, and the law forbade this with the words there is no tatayyur and no hamah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9901} Some Hanbalis hold tashaum disliked but not fal, and others hold omen-taking among the grave sins. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9903} The hadith names three things where ill omen lies: the horse, the woman and the house; Aisha denied that the Prophet said it and read it as a custom of the time of ignorance, while Malik, Ibn Qutayba and some hadith scholars read it at face value. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9904} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9903}"
