id: concept/shu-um-omen
class: concept
kind: belief
label:
  ar: "الشُّؤْم"
  en: "Shu'um (ill omen) and tatayyur (taking omens)"
  es: "Shu'um (mal augurio) y tatayyur (dando augurios)"
  fr: "Shu'um (mauvais présage) et tatayyur (prendre des présages)"
  ur: "شوم ⁦(بدشگونی)⁩ اور تطیور ⁦(شگون لینا)⁩"
  tr: "uğursuz"
  id: "mengancam"
summary:
  ar: "الشؤم في اللغة الشر، والتشاؤم توقع الشر، وكانت العرب تتطير بالطير إذا مرت بها فتذهب شمالا أو يمينا، فنهى الشرع عن ذلك بقوله لا طيرة ولا هامة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9901} ويرى بعض الحنابلة كراهة التشاؤم دون الفأل، وذهب آخرون إلى أن الطيرة من الكبائر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9903} وفي الحديث أن الشؤم في الفرس والمرأة والدار، وقد أنكرت عائشة أن يكون هذا من قول النبي وحملته على الجاهلية، وحمله مالك وابن قتيبة وبعض علماء الحديث على ظاهره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9904} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9903}"
  en: "In language shu'um is ill, and tashaum is expecting ill; the Arabs used to take omens from birds that flew by, to left or right, and the law forbade this with the words there is no tatayyur and no hamah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9901} Some Hanbalis hold tashaum disliked but not fal, and others hold omen-taking among the grave sins. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9903} The hadith names three things where ill omen lies: the horse, the woman and the house; Aisha denied that the Prophet said it and read it as a custom of the time of ignorance, while Malik, Ibn Qutayba and some hadith scholars read it at face value. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9904} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9903}"
  es: "En el idioma shu'um es enfermo, y tashaum es esperar mal; los árabes solían tomar presagios de las aves que volaban a la izquierda o a la derecha, y la ley prohibió esto con las palabras no hay tatayyur ni hamah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9901} Algunos hanbalíes consideran que tashaum es desaconsejable pero no fal, y otros consideran que tomar presagios es uno de los pecados graves. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9903} El hadiz nombra tres cosas donde reside un mal presagio: el caballo, la mujer y la casa; Aisha negó que el Profeta lo dijera y lo leyó como una costumbre de la época de la ignorancia, mientras que Malik, Ibn Qutayba y algunos eruditos del hadiz lo leyeron literalmente. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9904} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9903}"
  fr: "En langue arabe, « shu'um » signifie malade et « tashaum » signifie s'attendre au mal. Les Arabes avaient coutume d'interpréter le passage des oiseaux, à gauche ou à droite, pour prédire le mauvais présage, ce que la loi interdit formellement, affirmant qu'il n'y a ni tatayyur ni hamah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9901} Certains hanbalites considèrent le tashaum comme désapprouvé mais non comme un péché grave, tandis que d'autres le classent parmi les péchés les plus graves. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9903} Le hadith cite trois choses porteuses de mauvais présage: le cheval, la femme et la maison. Aïcha a nié que le Prophète ait tenu ces propos et les a considérés comme une coutume de l'époque préislamique, tandis que Malik, Ibn Qutayba et certains spécialistes du hadith les ont pris au pied de la lettre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9904} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9903}"
  ur: "زبان میں شوم بیمار ہے اور تشوم بیمار ہونے کی توقع ہے۔ عرب ان پرندوں سے شگون لیتے تھے جو بائیں یا دائیں طرف اڑتے تھے، اور شریعت نے اس بات سے منع کیا ہے کہ تطیور اور حماہ نہیں ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 9901} بعض حنبلی تشوم کو ناپسندیدہ سمجھتے ہیں لیکن فال نہیں، اور بعض کبیرہ گناہوں میں سے شگون کو سمجھتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.9902} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9903} حدیث میں تین چیزوں کے نام ہیں جن میں نحوست ہے: گھوڑا، عورت اور گھر۔ عائشہ ا نے انکار کیا کہ نبی نے اسے کہا تھا اور اسے زمانہ جاہلیت کے رواج کے طور پر پڑھا تھا، جب کہ مالک، ابن قتیبہ اور بعض محدثین نے اسے قدر کی نگاہ سے پڑھا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9904}"
  tr: "Dilde 'felaket' kötülük anlamına gelirken, kötümserlik kötülük demektir. Araplar, kuşlar geçip kuzeye ya da sağa giderse uçururdu. Şeriat bunu, 'Ne kuş ne de gülümseme vardır.' diyerek yasakladı. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.9901} Bazı Hanbalılar alametsiz karamsarlığı sevmezken, diğerleri 'tira'nın başlıca günahlardan biri olduğunu düşünür. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.9902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9903} Hadislerde, felaketin Perslerde, kadında ve evde olduğu söylenir. Aişe bunun Peygamber'in sözlerinden kaynaklandığını reddetmiş ve bunu İslam öncesi döneme atfetmiş, Malik, İbn Kutaybah ve bazı hadis âlimleri ise bunu kelimesi kelimesine yorumlamıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9904} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9903}"
  id: "Dalam bahasa tersebut, 'malapetaka' berarti jahat, dan pesimisme berarti jahat. Orang Arab biasa menerbangkan burung jika mereka lewat dan pergi ke utara atau ke kanan. Syariah melarang hal ini dengan mengatakan, 'Tidak ada burung maupun senyuman.' {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9901} Beberapa Hanbal tidak menyukai pesimisme tanpa pertanda, sementara yang lain berpendapat bahwa 'tira' adalah salah satu dosa utama. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9903} Dalam hadits, dikatakan bahwa kesialan ada pada orang Persia, wanita, dan rumah. Aisha menyangkal bahwa ini berasal dari firman Nabi dan mengaitkannya pada era pra-Islam, dan Malik, Ibn Qutaybah, serta beberapa ulama hadis menafsirkannya secara harfiah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9904} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9903}"
