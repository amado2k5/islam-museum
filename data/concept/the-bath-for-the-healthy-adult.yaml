id: concept/the-bath-for-the-healthy-adult
class: concept
kind: scientific
label: { ar: "الحمام للصحيح البالغ عند ابن سينا", en: "The bath for the healthy adult in the Canon", ur: "قانون میں صحت مند بالغ کے لیے حمام", es: "El baño para el adulto sano en el Canon", fr: "Le bain pour l'adulte en bonne santé dans le Canon" }
summary:
  ar: "يقول ابن سينا في الفصل الخامس، في الاستحمام وذكر الحمامات، إن من يدبره هنا بدنه نقي فلا حاجة به إلى الاستحمام المحلل، وإنما يحتاج إلى الحمام ليستفيد حرارة لطيفة وترطيباً معتدلاً، فلا يطيلوا اللبث فيه ويفارقوه حين يبتدئ التحلل، ولا يبادر المرتاض إلى الحمام حتى يستريح بالتمام {cite:canon-ibn-sina-print-v1 p.226}."
  en: "In chapter 5, on bathing and the baths, Ibn Sina says the person whose regimen he describes here has a clean body and needs no dissolving bath, only a gentle heat and moderate moistening; he should not stay long, should leave when dissolving begins, and the exerciser should not hurry to the bath until fully rested {cite:canon-ibn-sina-print-v1 p.226}."
  es: "En el capítulo 5, sobre el baño y los baños, Ibn Sina dice que la persona cuyo régimen describe aquí tiene un cuerpo limpio y no necesita un baño disolvente, solo un calor suave y una humectación moderada; no debe permanecer mucho tiempo, debe irse cuando comience la disolución, y el que se ejercita no debe apresurarse al baño hasta que esté completamente descansado {cite:canon-ibn-sina-print-v1 p.226}."
  fr: "Dans le chapitre 5, sur le bain et les bains, Ibn Sina dit que la personne dont il décrit le régime a un corps propre et n'a pas besoin de bain dissolvant, seulement d'une chaleur douce et d'une humidification modérée; elle ne doit pas rester longtemps, doit partir lorsque la dissolution commence, et le pratiquant ne doit pas se précipiter au bain avant d'être complètement reposé {cite:canon-ibn-sina-print-v1 p.226}."
  ur: "باب 5 میں غسل اور حمام کے بارے میں ابن سینا کہتا ہے کہ جس شخص کا طریقہ وہ یہاں بیان کرتا ہے اس کا جسم صاف ہے اور اسے تحلیل نہ کرنے والے غسل کی ضرورت ہے، صرف ہلکی گرمی اور معتدل رطوبت؛ اسے زیادہ دیر نہیں ٹھہرنا چاہیے، جب گھلنا شروع ہو جائے تو اسے چھوڑ دینا چاہیے، اور ورزش کرنے والے کو غسل کے لیے جلدی نہیں کرنی چاہیے جب تک کہ مکمل آرام نہ کر لے۔"
