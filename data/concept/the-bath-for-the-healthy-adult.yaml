label: { ar: "الحمام للصحيح البالغ عند ابن سينا", en: "The bath for the healthy adult in the Canon", ur: "قانون میں صحت مند بالغ کے لیے حمام" }
summary:
  ar: "يقول ابن سينا في الفصل الخامس، في الاستحمام وذكر الحمامات، إن من يدبره هنا بدنه نقي فلا حاجة به إلى الاستحمام المحلل، وإنما يحتاج إلى الحمام ليستفيد حرارة لطيفة وترطيباً معتدلاً، فلا يطيلوا اللبث فيه ويفارقوه حين يبتدئ التحلل، ولا يبادر المرتاض إلى الحمام حتى يستريح بالتمام {cite:canon-ibn-sina-print-v1 p.226}."
  en: "In chapter 5, on bathing and the baths, Ibn Sina says the person whose regimen he describes here has a clean body and needs no dissolving bath, only a gentle heat and moderate moistening; he should not stay long, should leave when dissolving begins, and the exerciser should not hurry to the bath until fully rested {cite:canon-ibn-sina-print-v1 p.226}."
