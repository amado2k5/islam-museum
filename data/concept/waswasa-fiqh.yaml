id: concept/waswasa-fiqh
class: concept
kind: legal
tags: [jinn-devils-browser, jd-devils, magic-browser, magic-waswasah]
label:
  ar: وَسْوَسة
  en: Waswasa (whispering doubts and scrupulosity)
  es: "Waswasa (susurros de dudas y escrupulosidad)"
  fr: "Waswasa (doutes et scrupules murmurés)"
  ur: "وسواسہ ⁦( شکوک و شبہات کا اظہار)⁩"
summary:
  ar: 'الوسوسة والوِسواس في اللغة الصوت الخفي، وهي في الاستعمال الفقهي على معانٍ: حديث النفس وما يقع فيها من التردد، وما يلقيه الشيطان في روع الإنسان، وما ينشأ عن المبالغة في الاحتياط والتورع حتى يعيد الشخص الفعل مراراً، والموسوس المختلّ في عقله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17195}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17196} وحديث النفس المرفوع عن الأمة ما لم يقترن به قول أو عمل، فلا إثم فيه ولا يقع به طلاق ولا نذر، لحديث «إن الله تجاوز لأمتي عما وسوست به أنفسها». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17197} ومدافعة حديث النفس في الصلاة مشروعة، والخشوع فضيلة؛ وفي بطلان الصلاة بغلبة الوسواس اختلف فقهاء الحنابلة: ابن تيمية لا يبطلها، وابن حامد وابن الجوزي يبطلانها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17197}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17198} والوسوسة الشيطانية تُدفع بذكر الله، وقد قسّم الغزالي الوسواس بحسب مصدره إلى ثلاثة أصناف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17198}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17199} ومما يعرض للمؤمن من وساوس الكفر، وقد عدّ ابن تيمية ذلك دليلاً على صريح الإيمان ما دام صاحبه يكرهه ويدفعه، أما من أجاب هذه الوساوس فقد يكفر أو ينافق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17199}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17200} والوسوسة الناشئة عن المبالغة في الورع خروج عن الورع إلى التشدد في الدين، وقد نبّه الفقهاء إلى أن الشيء الذي لا يتنازعه دليلان بين الحل والحرمة، وأن الوهم المجرد لا يُعتد به؛ ومن أمثلته ترك التزوج في بلد كبير خشية محرم، ومن الأمثلة الواردة في السنة قول النبي في امرأة قالت إنها أرضعت المتزوج، وقوله لسودة: «احتجبي منه». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17200}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17201} وذكر الجويني وابن الجوزي صوراً من أفعال الموسوسين، من الإسراف في الماء والغسل المتكرر للثوب الطاهر، وقالوا إن الشريعة سمحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17201}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17202} وسبب الوسوسة سوء فهم قاعدة الاحتياط واتقاء الشبهات، ومن علاجه الاقتداء بهدي السلف وترك التشدد؛ وقد نهى النبي عن الغلو والتشدد في الدين وعن الإسراف في الوضوء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17202}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17203} ومن الأحكام الخاصة بالموسوس: أن النجاسة المرئية تزال بالقلع، وتقدر الغسلات في حقه بثلاث، وكراهة البول في مكان الاستحمام، وانتضاح الفرج بالماء بعد الاستنجاء عند الشافعية والحنابلة، وهو عند الحنفية مما يُنضح ولا يلتفت إليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17203}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17204} ويستمر الموسوس في الوضوء ولا يستأنف إذا كان الشك وهماً، والمالكية يحكمون بأن شكه كالعدم، والمأموم يتابع إمامه ولا يتخلف إلا لعذر خلقي لا لوسوسة ظاهرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17204}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17205} وأما الموسوس المغلوب على عقله فلا يقع طلاقه ولا تقع منه ردة، وقد أجمعوا على عدم وقوع طلاق زائل العقل كما نقل ابن القيم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17205}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17206}'
  en: 'Waswasa and wiswas in the lexicon mean a faint sound. In jurists'' usage it has four senses: the passing thought and the hesitation within it; what Satan casts into a person''s mind; the scruple that comes from excessive caution and scrupulousness, so that a person repeats an act many times; and the waswas, a man whose mind is disordered. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17195}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17196} A passing thought is forgiven to this community as long as no word or deed follows, so that a thought of theft or of divorce brings no sin and no divorce or vow takes effect, on the report that God overlooks for my community what its souls whisper. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17197} Repelling passing thoughts in prayer is lawful, and attentiveness is a virtue; Hanbali jurists differ on whether a prayer is void when whispering dominates it: Ibn Taymiyya says no, while Ibn Hamid and Ibn al-Jawzi say yes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17197}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17198} Satanic whispering is repelled by remembrance of God, and al-Ghazali divides it into three kinds according to its source. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17198}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17199} Believers too suffer whispers of unbelief; Ibn Taymiyya holds that such a whisper that the believer hates and repels is a sign of pure faith, while one who answers it may fall into unbelief or hypocrisy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17199}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17200} The scruple that comes from excess in caution is an exit from scrupulousness into rigidity; the jurists note that a matter not contested by two sound indicators is either clearly lawful or clearly forbidden, and that a bare imagined possibility carries no weight. Examples given include refusing marriage in a large city for fear of an unmentioned close relative, and the cases in the sunna of the woman who claimed to have suckled the groom and of the instruction to Sawda to veil from her half-brother. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17200}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17201} Al-Juwayni and Ibn al-Jawzi describe the practices of such people, including wasting water and washing clean clothes again and again, and note that the law is easy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17201}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17202} The cause is a mistaken reading of the principle of caution and of avoiding doubtful things; the remedy is to follow the path of the early generations and avoid rigidity, as the Prophet warned against excess in religion and in ablution. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17202}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17203} Rules for the scrupulous person: a visible impurity is removed by peeling it off and the washes are counted as three for him; urinating where one bathes is disliked; sprinkling the private parts after cleansing is recommended by the Shafi''is and Hanbalis to cut off doubt, and the Hanafis allow that the one who is often troubled should sprinkle and then disregard any doubt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17203}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17204} If doubt about the intention in ablution is mere imagination, the person continues without repeating; the Malikis hold that a scrupulous person''s doubt counts as nothing; and a follower keeps pace with the imam and lags only for a real physical reason. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17204}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17205} A waswas who is out of his mind cannot divorce and his words cannot be apostasy; Ibn al-Qayyim reports this as agreed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17205}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17206}'
  es: "Waswasa y wiswas en el léxico significan un sonido débil. En el uso de los juristas tiene cuatro sentidos: el pensamiento pasajero y la vacilación dentro de él; lo que Satanás arroja a la mente de una persona; el escrúpulo que proviene de la precaución y escrupulosidad excesivas, de modo que una persona repite un acto muchas veces; y el waswas, un hombre cuya mente está desordenada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17195}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17196} Un pensamiento pasajero es perdonado a esta comunidad siempre que no le siga ninguna palabra o acción, de modo que un pensamiento de robo o de divorcio no trae pecado y ningún divorcio o voto surte efecto, en el informe de que Dios pasa por alto para mi comunidad lo que sus almas susurran. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17197} Repeler los pensamientos pasajeros en la oración es lícito, y la atención es una virtud; los juristas hanbalíes difieren sobre si una oración es nula cuando el susurro la domina: Ibn Taymiyya dice que no, mientras que Ibn Hamid e Ibn al-Jawzi dicen que sí. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17197}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17198} El susurro satánico es repelido por el recuerdo de Dios, y al-Ghazali lo divide en tres tipos según su origen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17198}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17199} Los creyentes también sufren susurros de incredulidad; Ibn Taymiyya sostiene que tal susurro que el creyente odia y rechaza es un signo de fe pura, mientras que quien lo responde puede caer en la incredulidad o la hipocresía. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17199}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17200} El escrúpulo que proviene del exceso de precaución es una salida de la escrupulosidad a la rigidez; los juristas señalan que un asunto no disputado por dos indicadores sólidos es claramente lícito o claramente prohibido, y que una mera posibilidad imaginada no tiene peso. Entre los ejemplos que se dan se incluyen negarse a contraer matrimonio en una gran ciudad por temor a un pariente cercano no mencionado, y los casos en la sunna de la mujer que afirmó haber amamantado al novio y de la instrucción a Sawda de cubrirse con un velo ante su medio hermano. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17200}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17201} Al-Juwayni e Ibn al-Jawzi describen las prácticas de tales personas, incluyendo el desperdicio de agua y el lavado de ropa limpia una y otra vez, y señalan que la ley es fácil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17201}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17202} La causa es una lectura errónea del principio de precaución y de evitar cosas dudosas; El remedio es seguir el camino de las primeras generaciones y evitar la rigidez, como advirtió el Profeta contra el exceso en la religión y en la ablución. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17202}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17203} Reglas para la persona escrupulosa: una impureza visible se elimina desprendiéndola y los lavados se cuentan como tres para él; orinar donde uno se baña es desaconsejable; rociar las partes íntimas después de la limpieza es recomendado por los shafi'is y hanbalis para cortar la duda, y los hanafis permiten que quien a menudo está preocupado rocíe y luego deseche cualquier duda. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17203}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17204} Si la duda sobre la intención en la ablución es mera imaginación, la persona continúa sin repetir; los malikíes sostienen que la duda de una persona escrupulosa no cuenta como nada; y un seguidor mantiene el ritmo del imán y se retrasa solo por una razón física real. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17204}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17205} Un waswas que está fuera de sí no puede divorciarse y sus palabras no pueden ser apostasía; Ibn al-Qayyim informa que esto es aceptado. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.17205}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.17206}"
  fr: "Dans le lexique, waswasa et wiswas signifient un faible son. En jurisme, ce terme a quatre sens: la pensée passagère et l’hésitation qu’elle suscite; ce que Satan inspire; le scrupule né d’une prudence et d’une scrupulosité excessives, qui poussent à répéter un acte; et waswas, un homme dont l’esprit est désordonné. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17195}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17196} Une pensée passagère est pardonnée à cette communauté tant qu’elle n’est suivie d’aucune parole ni d’aucun acte. Ainsi, une pensée de vol ou de divorce n’est pas considérée comme un péché et aucun divorce ni vœu n’est exaucé, car Dieu ferme les yeux sur les murmures de mes âmes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17197} Il est licite de repousser les pensées parasites pendant la prière, et l'attention est une vertu. Les juristes hanbalites divergent quant à la validité d'une prière dominée par les murmures: Ibn Taymiyya répond par la négative, tandis qu'Ibn Hamid et Ibn al-Jawzi la jugent positive. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17197}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17198} Les murmures sataniques sont repoussés par le souvenir de Dieu, et al-Ghazali les distingue en trois catégories selon leur origine. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17198}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17199} Les croyants aussi sont sujets aux murmures d'incroyance; Ibn Taymiyya soutient qu'un tel murmure, que le croyant abhorre et repousse, est un signe de foi pure, tandis que celui qui y répond risque de sombrer dans l'incroyance ou l'hypocrisie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17199}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17200} Le scrupule qui découle d'une prudence excessive conduit de la scrupulosité à la rigidité; les juristes notent qu'une question non contestée par deux indices solides est soit clairement licite, soit clairement illicite, et qu'une simple possibilité imaginée est sans valeur. Parmi les exemples cités figurent le refus de se marier dans une grande ville par crainte d'un proche parent non mentionné, ainsi que les cas, dans la Sunna, de la femme qui prétendait avoir allaité le marié et de l'injonction faite à Sawda de se voiler devant son demi-frère. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17200}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17201} Al-Juwayni et Ibn al-Jawzi décrivent les pratiques de ces personnes, notamment le gaspillage d'eau et le lavage répété de vêtements propres, et soulignent la simplicité de la loi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17201}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17202} La cause réside dans une interprétation erronée du principe de prudence et de l'abstention face au doute. Le remède consiste à suivre la voie des premières générations et à éviter la rigidité, car le Prophète a mis en garde contre les excès en matière de religion et d'ablutions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17202}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17203} Règles pour la personne scrupuleuse: une impureté visible est éliminée en la pelant, et les ablutions sont comptabilisées comme trois; il est déconseillé d'uriner là où l'on se lave; les écoles chaféite et hanbalite recommandent d'asperger les parties intimes après la purification afin de dissiper tout doute, et l'école hanafite autorise celui qui est souvent troublé à procéder à cette aspersion puis à ignorer tout doute. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17203}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17204} Si le doute concernant l'intention lors des ablutions relève de la simple imagination, la personne poursuit sans répéter. Les Malikites estiment que le doute d'une personne scrupuleuse est sans importance; un fidèle suit le rythme de l'imam et ne s'interrompt que pour une raison physique réelle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17204}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17205} Un waswas qui a perdu la raison ne peut divorcer et ses paroles ne peuvent constituer une apostasie; Ibn al-Qayyim rapporte cela comme étant admis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17205}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17206}"
  ur: "لغت میں وسواس اور وسواس کا مطلب ایک مدھم آواز ہے۔ فقہاء کے استعمال میں اس کے چار حواس ہیں: گزرتا ہوا خیال اور اس کے اندر کی ہچکچاہٹ۔ شیطان ایک شخص کے دماغ میں کیا ڈالتا ہے؛ بہت زیادہ احتیاط اور بے احتیاطی سے پیدا ہونے والی بدگمانی، تاکہ ایک شخص ایک عمل کو کئی بار دہرائے؛ اور وسوس، ایک آدمی جس کا دماغ خراب ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17195}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17196} اس جماعت کے لیے ایک گزری ہوئی سوچ اس وقت تک معاف کر دی جاتی ہے جب تک کہ کوئی قول یا عمل اس پر عمل نہ کرے، تاکہ چوری یا طلاق کا خیال آئے اور اس سے طلاق یا طلاق کا کوئی اثر نہ ہو۔ میری برادری کو نظر انداز کرتا ہے جو اس کی روحیں سرگوشیاں کرتی ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17197} نماز میں خیالات کو دور کرنا حلال ہے اور توجہ ایک نیکی ہے۔ حنبلی فقہاء کا اس میں اختلاف ہے کہ آیا سرگوشی کے غلبہ سے نماز باطل ہے: ابن تیمیہ کہتے ہیں نہیں، جبکہ ابن حمید اور ابن الجوزی کہتے ہیں ہاں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17197}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17198} شیطانی وسوسہ کو ذکر الٰہی سے دفع کیا جاتا ہے، اور الغزالی نے اسے اپنے ماخذ کے مطابق تین قسموں میں تقسیم کیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17198}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17199} مومنوں کو بھی کفر کے وسوسوں کا سامنا کرنا پڑتا ہے۔ ابن تیمیہ کا خیال ہے کہ ایسی سرگوشی جس سے مومن نفرت کرے اور دفع کرے خالص ایمان کی علامت ہے، جبکہ اس کا جواب دینے والا کفر یا منافقت میں پڑ سکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17199}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17200} بے احتیاطی جو حد سے زیادہ احتیاط سے آتی ہے وہ بے حیائی سے سختی کی طرف نکلنا ہے۔ فقہاء نوٹ کرتے ہیں کہ جس معاملے کا مقابلہ دو صوتی اشارے سے نہیں کیا گیا ہے وہ یا تو واضح طور پر حلال ہے یا واضح طور پر حرام ہے، اور یہ کہ ایک تصوراتی امکان میں کوئی وزن نہیں ہے۔ دی گئی مثالوں میں نام نہاد قریبی رشتہ دار کے خوف سے بڑے شہر میں شادی سے انکار، اور اس عورت کی سنت میں مقدمات جس نے دولہا کو دودھ پلانے کا دعویٰ کیا تھا اور سودہ کو اپنے سوتیلے بھائی کی طرف سے پردہ کرنے کی ہدایت شامل ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17200}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.17201} الجوینی اور ابن الجوزی ایسے لوگوں کے معمولات کو بیان کرتے ہیں جن میں پانی ضائع کرنا اور بار بار کپڑے دھونا آسان نہیں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17201}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17202} وجہ احتیاط اور مشتبہ چیزوں سے بچنے کے اصول کا غلط پڑھنا ہے۔ اس کا علاج یہ ہے کہ ابتدائی نسلوں کے راستے پر چلیں اور سختی سے بچیں، جیسا کہ نبی نے دین اور وضو میں زیادتی سے خبردار کیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17202}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17203} ضعیف آدمی کے لیے احکام: ظاہری نجاست کو چھیلنے سے دور ہو جاتی ہے اور اس کے دھونے کو تین شمار کیا جاتا ہے۔ پیشاب کرنا جہاں غسل کرنا ناپسندیدہ ہے۔ شافعیہ اور حنبلیوں نے شبہات کو دور کرنے کے لیے صفائی کے بعد شرمگاہ پر چھڑکنے کی سفارش کی ہے، اور احناف اس بات کی اجازت دیتے ہیں کہ جو اکثر پریشان ہوتا ہے اسے چھڑکنا چاہیے اور پھر کسی شک کو نظر انداز کرنا چاہیے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17203}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17204} اگر وضو میں نیت کے بارے میں شک محض خیالی ہو تو آدمی بغیر دہرائے جاری رکھتا ہے۔ مالکیوں کا خیال ہے کہ ایک غیرت مند شخص کا شک کچھ بھی نہیں ہے۔ اور ایک پیروکار امام کے ساتھ چلتا ہے اور صرف ایک حقیقی جسمانی وجہ سے پیچھے رہتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17204}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17205} ایک وسواس جو اپنے دماغ سے باہر ہو وہ طلاق نہیں دے سکتا اور اس کے الفاظ ارتداد نہیں ہو سکتے۔ ابن قیم نے اسے متفق علیہ روایت کیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17205}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17206}"
