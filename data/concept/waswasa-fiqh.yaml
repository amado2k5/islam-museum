label:
  ar: وَسْوَسة
  en: Waswasa (whispering doubts and scrupulosity)
summary:
  ar: 'الوسوسة والوِسواس في اللغة الصوت الخفي، وهي في الاستعمال الفقهي على معانٍ: حديث النفس وما يقع فيها من التردد، وما يلقيه الشيطان في روع الإنسان، وما ينشأ عن المبالغة في الاحتياط والتورع حتى يعيد الشخص الفعل مراراً، والموسوس المختلّ في عقله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17195}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17196} وحديث النفس المرفوع عن الأمة ما لم يقترن به قول أو عمل، فلا إثم فيه ولا يقع به طلاق ولا نذر، لحديث «إن الله تجاوز لأمتي عما وسوست به أنفسها». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17197} ومدافعة حديث النفس في الصلاة مشروعة، والخشوع فضيلة؛ وفي بطلان الصلاة بغلبة الوسواس اختلف فقهاء الحنابلة: ابن تيمية لا يبطلها، وابن حامد وابن الجوزي يبطلانها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17197}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17198} والوسوسة الشيطانية تُدفع بذكر الله، وقد قسّم الغزالي الوسواس بحسب مصدره إلى ثلاثة أصناف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17198}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17199} ومما يعرض للمؤمن من وساوس الكفر، وقد عدّ ابن تيمية ذلك دليلاً على صريح الإيمان ما دام صاحبه يكرهه ويدفعه، أما من أجاب هذه الوساوس فقد يكفر أو ينافق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17199}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17200} والوسوسة الناشئة عن المبالغة في الورع خروج عن الورع إلى التشدد في الدين، وقد نبّه الفقهاء إلى أن الشيء الذي لا يتنازعه دليلان بين الحل والحرمة، وأن الوهم المجرد لا يُعتد به؛ ومن أمثلته ترك التزوج في بلد كبير خشية محرم، ومن الأمثلة الواردة في السنة قول النبي في امرأة قالت إنها أرضعت المتزوج، وقوله لسودة: «احتجبي منه». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17200}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17201} وذكر الجويني وابن الجوزي صوراً من أفعال الموسوسين، من الإسراف في الماء والغسل المتكرر للثوب الطاهر، وقالوا إن الشريعة سمحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17201}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17202} وسبب الوسوسة سوء فهم قاعدة الاحتياط واتقاء الشبهات، ومن علاجه الاقتداء بهدي السلف وترك التشدد؛ وقد نهى النبي عن الغلو والتشدد في الدين وعن الإسراف في الوضوء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17202}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17203} ومن الأحكام الخاصة بالموسوس: أن النجاسة المرئية تزال بالقلع، وتقدر الغسلات في حقه بثلاث، وكراهة البول في مكان الاستحمام، وانتضاح الفرج بالماء بعد الاستنجاء عند الشافعية والحنابلة، وهو عند الحنفية مما يُنضح ولا يلتفت إليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17203}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17204} ويستمر الموسوس في الوضوء ولا يستأنف إذا كان الشك وهماً، والمالكية يحكمون بأن شكه كالعدم، والمأموم يتابع إمامه ولا يتخلف إلا لعذر خلقي لا لوسوسة ظاهرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17204}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17205} وأما الموسوس المغلوب على عقله فلا يقع طلاقه ولا تقع منه ردة، وقد أجمعوا على عدم وقوع طلاق زائل العقل كما نقل ابن القيم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17205}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17206}'
  en: 'Waswasa and wiswas in the lexicon mean a faint sound. In jurists'' usage it has four senses: the passing thought and the hesitation within it; what Satan casts into a person''s mind; the scruple that comes from excessive caution and scrupulousness, so that a person repeats an act many times; and the waswas, a man whose mind is disordered. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17195}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17196} A passing thought is forgiven to this community as long as no word or deed follows, so that a thought of theft or of divorce brings no sin and no divorce or vow takes effect, on the report that God overlooks for my community what its souls whisper. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17197} Repelling passing thoughts in prayer is lawful, and attentiveness is a virtue; Hanbali jurists differ on whether a prayer is void when whispering dominates it: Ibn Taymiyya says no, while Ibn Hamid and Ibn al-Jawzi say yes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17197}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17198} Satanic whispering is repelled by remembrance of God, and al-Ghazali divides it into three kinds according to its source. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17198}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17199} Believers too suffer whispers of unbelief; Ibn Taymiyya holds that such a whisper that the believer hates and repels is a sign of pure faith, while one who answers it may fall into unbelief or hypocrisy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17199}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17200} The scruple that comes from excess in caution is an exit from scrupulousness into rigidity; the jurists note that a matter not contested by two sound indicators is either clearly lawful or clearly forbidden, and that a bare imagined possibility carries no weight. Examples given include refusing marriage in a large city for fear of an unmentioned close relative, and the cases in the sunna of the woman who claimed to have suckled the groom and of the instruction to Sawda to veil from her half-brother. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17200}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17201} Al-Juwayni and Ibn al-Jawzi describe the practices of such people, including wasting water and washing clean clothes again and again, and note that the law is easy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17201}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17202} The cause is a mistaken reading of the principle of caution and of avoiding doubtful things; the remedy is to follow the path of the early generations and avoid rigidity, as the Prophet warned against excess in religion and in ablution. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17202}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17203} Rules for the scrupulous person: a visible impurity is removed by peeling it off and the washes are counted as three for him; urinating where one bathes is disliked; sprinkling the private parts after cleansing is recommended by the Shafi''is and Hanbalis to cut off doubt, and the Hanafis allow that the one who is often troubled should sprinkle and then disregard any doubt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17203}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17204} If doubt about the intention in ablution is mere imagination, the person continues without repeating; the Malikis hold that a scrupulous person''s doubt counts as nothing; and a follower keeps pace with the imam and lags only for a real physical reason. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17204}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17205} A waswas who is out of his mind cannot divorce and his words cannot be apostasy; Ibn al-Qayyim reports this as agreed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17205}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17206}'
