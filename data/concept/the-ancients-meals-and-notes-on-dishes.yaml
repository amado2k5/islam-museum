summary:
  ar: "يختم ابن سينا الفصل السابع بذكر أن أصحاب الرياضة في الزمان القديم هربوا من خلط الأغذية فاقتصروا على اللحم في الغذاء وعلى الخبز في العشاء، وبأن أفضل أوقات الأكل صيفاً أبردها، ثم ملاحظات في الكباب والشورباج والعنب على الرؤوس المشوية والطيهوج والفروج ومرق الفروج والدجاج المشوي والحلاوات، ويقول إن مضرة الخبز إذا لم ينهضم أكثر من مضرة اللحم إذا لم ينهضم {cite:canon-ibn-sina-print-v1 pp.235-236}."
  en: "Ibn Sina closes chapter 7 by noting that the exercisers of ancient times fled from mixing foods by limiting themselves to meat at the midday meal and bread at supper, and that the best time to eat in summer is the coolest; he then offers notes on roasted meat, shurbaj, grapes on roasted heads, partridge, chicken, chicken broth and sweets, and says undigested bread does more harm than undigested meat {cite:canon-ibn-sina-print-v1 pp.235-236}."
