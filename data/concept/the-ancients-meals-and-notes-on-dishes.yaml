id: concept/the-ancients-meals-and-notes-on-dishes
class: concept
kind: scientific
label: { ar: "وجبات الأقدمين وملاحظات في الأطعمة", en: "The ancients' meals and notes on dishes", ur: "اگلوں کے کھانے اور مختلف پکوانوں پر ملاحظات", es: "Las comidas de los antiguos y notas sobre los platos.", fr: "Les repas des anciens et leurs notes sur les plats", tr: "Yaşlıların Yemekleri ve Yiyecekler Üzerine Notlar", id: "Makanan Para Tetua dan Catatan tentang Makanan" }
summary:
  ar: "يختم ابن سينا الفصل السابع بذكر أن أصحاب الرياضة في الزمان القديم هربوا من خلط الأغذية فاقتصروا على اللحم في الغذاء وعلى الخبز في العشاء، وبأن أفضل أوقات الأكل صيفاً أبردها، ثم ملاحظات في الكباب والشورباج والعنب على الرؤوس المشوية والطيهوج والفروج ومرق الفروج والدجاج المشوي والحلاوات، ويقول إن مضرة الخبز إذا لم ينهضم أكثر من مضرة اللحم إذا لم ينهضم {cite:canon-ibn-sina-print-v1 pp.235-236}."
  en: "Ibn Sina closes chapter 7 by noting that the exercisers of ancient times fled from mixing foods by limiting themselves to meat at the midday meal and bread at supper, and that the best time to eat in summer is the coolest; he then offers notes on roasted meat, shurbaj, grapes on roasted heads, partridge, chicken, chicken broth and sweets, and says undigested bread does more harm than undigested meat {cite:canon-ibn-sina-print-v1 pp.235-236}."
  es: "Ibn Sina cierra el capítulo 7 señalando que los practicantes de ejercicio de la antigüedad evitaban mezclar alimentos limitándose a comer carne en la comida del mediodía y pan en la cena, y que el mejor momento para comer en verano es cuando hace más fresco; luego ofrece notas sobre carne asada, shurbaj, uvas sobre cabezas asadas, perdiz, pollo, caldo de pollo y dulces, y dice que el pan sin digerir hace más daño que la carne sin digerir {cite:canon-ibn-sina-print-v1 pp.235-236}."
  fr: "Ibn Sina conclut le chapitre 7 en notant que les pratiquants de l'Antiquité évitaient de mélanger les aliments en se limitant à la viande au repas de midi et au pain au souper, et que le meilleur moment pour manger en été est le plus frais; il donne ensuite des notes sur la viande rôtie, le shurbaj, les raisins sur des têtes rôties, la perdrix, le poulet, le bouillon de poulet et les sucreries, et dit que le pain non digéré fait plus de mal que la viande non digérée {cite:canon-ibn-sina-print-v1 pp.235-236}."
  ur: "ابن سینا باب 7 کو یہ نوٹ کرتے ہوئے ختم کرتا ہے کہ قدیم زمانے کے ورزش کرنے والے کھانے میں ملاوٹ سے بھاگتے تھے اور دوپہر کے کھانے میں گوشت اور رات کے کھانے میں روٹی تک محدود رہتے تھے، اور گرمیوں میں کھانے کا بہترین وقت ٹھنڈا ہوتا ہے۔ اس کے بعد وہ بھنے ہوئے گوشت، شورباز، بھنے ہوئے سروں پر انگور، تیتر، چکن، چکن کے شوربے اور مٹھائیوں پر نوٹ پیش کرتا ہے اور کہتا ہے کہ ہضم نہ ہونے والی روٹی ہضم نہ ہونے والے گوشت سے زیادہ نقصان کرتی ہے۔"
  tr: "İbn Sina, yedinci bölümü eski zamanların sporcularının yiyecekleri karıştırmaktan kaçındıklarını, öğle yemeğinde et ve akşam yemeğinde ekmekle yetindiklerini, yazın en iyi yemek zamanlarının en serin zamanlar olduğunu, ardından kebap, şorbę, ızgara başlı üzüm, fırınlanmış tavuk, et suyu, ızgara tavuk ve tatlılar üzerine gözlemler yaparak bitirir. Ekmeğin sindirilmezse zararının, sindirilmezse etin zararından daha büyük olduğunu söyler {cite:canon-ibn-sina-print-v1 s.235-236}."
  id: "Ibn Sina menutup bab tujuh dengan menyebutkan bahwa para olahragawan zaman kuno menghindari mencampur makanan dan membatasi diri pada daging untuk makan siang dan roti untuk makan malam, dan bahwa waktu terbaik untuk makan di musim panas adalah yang paling sejuk, diikuti oleh pengamatan tentang kebab, shorbaj, anggur di kepala panggang, ayam panggang, kaldu, ayam panggang, dan makanan manis. Ia mengatakan bahwa bahaya roti jika tidak dicerna lebih besar daripada bahaya daging jika tidak dicerna {cite:canon-ibn-sina-print-v1 hlm.235-236}."
