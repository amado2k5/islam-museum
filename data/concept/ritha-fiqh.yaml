label:
  ar: "الرثاء"
  en: "Ritha' (praising the dead in verse or speech): its meaning and its ruling"
  ur: "مرثیہ"
summary:
  ar: "الرثاء في اللغة الترحم على الميت وبكاؤه ومدحه وتعداد محاسنه، وعند الفقهاء مدح الميت وذكر محاسنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8622} ويفرق عن التأبين وهو البكاء على الميت والثناء عليه، وعن الندب وهو ذكر محاسن الميت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8622} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8623} لا بأس عند الحنفية بترثية الميت بشعر أو غيره، لكن يُكره الإفراط في مدحه، لا سيما عند جنازته، وكره النووي ذكر آبائه وخصائله، والأولى الاستغفار له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8623} وعند الحنابلة ما يُهيّج المصيبة من وعظ أو إنشاد شعر فهو من النياحة المنهي عنها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8623}"
  en: "Ritha' in the lexicon is compassion for the dead, weeping, praise and recounting his virtues, and in the jurists' sense it is praising the dead and recounting his good qualities. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8622} It is distinguished from ta'bin, weeping and praising the dead, and from nadb, recounting his virtues. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8622} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8623} The Hanafis allow an elegy in verse or prose, but dislike excessive praise, especially at the funeral; al-Nawawi disliked recounting the dead's ancestors, and preferred asking forgiveness for him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8623} The Hanbalis count as forbidden wailing whatever stirs grief through preaching or recited verse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8623}"
  ur: "مرثیہ میں میت کی خوبیاں بیان کرنا جائز ہے، مگر حد سے زیادہ تعریف مکروہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8623}"
