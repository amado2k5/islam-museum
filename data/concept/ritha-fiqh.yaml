label:
  ar: "الرثاء"
  en: "Ritha' (praising the dead in verse or speech): its meaning and its ruling"
  ur: "مرثیہ"
  es: "Ritha' (alabanza a los muertos en verso o palabra): su significado y su normativa"
  fr: "Ritha' (louange aux morts en vers ou en paroles): sa signification et sa règle"
  tr: "Ağıt"
  id: "Elegi"
summary:
  ar: "الرثاء في اللغة الترحم على الميت وبكاؤه ومدحه وتعداد محاسنه، وعند الفقهاء مدح الميت وذكر محاسنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8622} ويفرق عن التأبين وهو البكاء على الميت والثناء عليه، وعن الندب وهو ذكر محاسن الميت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8622} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8623} لا بأس عند الحنفية بترثية الميت بشعر أو غيره، لكن يُكره الإفراط في مدحه، لا سيما عند جنازته، وكره النووي ذكر آبائه وخصائله، والأولى الاستغفار له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8623} وعند الحنابلة ما يُهيّج المصيبة من وعظ أو إنشاد شعر فهو من النياحة المنهي عنها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8623}"
  en: "Ritha' in the lexicon is compassion for the dead, weeping, praise and recounting his virtues, and in the jurists' sense it is praising the dead and recounting his good qualities. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8622} It is distinguished from ta'bin, weeping and praising the dead, and from nadb, recounting his virtues. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8622} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8623} The Hanafis allow an elegy in verse or prose, but dislike excessive praise, especially at the funeral; al-Nawawi disliked recounting the dead's ancestors, and preferred asking forgiveness for him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8623} The Hanbalis count as forbidden wailing whatever stirs grief through preaching or recited verse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8623}"
  ur: "مرثیہ میں میت کی خوبیاں بیان کرنا جائز ہے، مگر حد سے زیادہ تعریف مکروہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8623}"
  es: "Ritha' en el léxico es compasión por el difunto, llanto, alabanza y relato de sus virtudes, y en el sentido de los juristas es alabar al difunto y relatar sus buenas cualidades. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8622} Se distingue de ta'bin, llanto y alabanza al difunto, y de nadb, relato de sus virtudes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8622} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8623} Los hanafíes permiten una elegía en verso o prosa, pero desaprueban la alabanza excesiva, especialmente en el funeral; al-Nawawi desaprobaba el relato de los antepasados del difunto y prefería pedir perdón por él. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8623} Los hanbalis cuentan como llanto prohibido cualquier cosa que provoque dolor a través de la predicación o la recitación de versos. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8623}"
  fr: "Dans le lexique, « ritha' » désigne la compassion pour le défunt, les pleurs, les louanges et le récit de ses vertus; pour les juristes, il s'agit de louer le défunt et de rappeler ses qualités. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8622} On le distingue de « ta'bin », qui consiste à pleurer et à louer le défunt, et de « nadb », qui consiste à rappeler ses vertus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8622} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8623} L'école hanafite autorise l'élégie en vers ou en prose, mais désapprouve les louanges excessives, surtout lors des funérailles; al-Nawawi, quant à lui, n'appréciait guère qu'on relate la généalogie du défunt et préférait qu'on implore le pardon pour lui. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.8623} Les Hanbalis considèrent comme interdit de pleurer tout ce qui suscite le chagrin à travers la prédication ou les vers récités. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8623}"
  tr: "Dilbilimde, ağıt, ölenlere merhamet göstermek, ağlamak, onları övmek ve erdemlerini saymak anlamına gelir. Hukukçular arasında, ölenleri övmek ve erdemlerinden bahsetmek anlamına gelir. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.8622} Bu ağıt, ölen için ağlayıp övmek olan ağıtla, merhumun erdemlerini anmak olan ağıttan farklıdır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.8622} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8623} Hanefilere göre, vefat edenleri şiirle veya başka bir şekilde övmek caizdir, ancak özellikle cenazelerinde aşırı övgüden hoşlanmazlar. An-Nawawi atalarından ve erdemlerinden bahsetmeyi sevmezdi ve onun için af dilemek tercih edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8623} Hanbalilere göre, vaaz vermek veya şiir okumak gibi felaketi tetikleyen şeyler yasak bir ağıt olarak kabul edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8623}"
  id: "Dalam linguistik, elegi merujuk pada belas kasihan kepada almarhum, menangis, memuji mereka, dan menyebutkan kebajikan mereka. Di antara ahli hukum, elegi merujuk pada memuji yang telah meninggal dan menyebutkan kebajikan mereka. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8622} Ini berbeda dengan eulogi, yang menangis atas almarhum dan memuji mereka, dan dari ratapan, yang merupakan pengenang akan kebajikan almarhum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8622} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8623} Menurut Hanafi, diperbolehkan memuji almarhum dengan puisi atau lainnya, tetapi mereka tidak suka pujian berlebihan, terutama saat pemakaman mereka. An-Nawawi tidak suka menyebut leluhur dan kebajikannya, dan lebih baik meminta pengampunan untuknya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8623} Menurut Hanbalis, apa yang memicu bencana seperti berkhotbah atau membacakan puisi dianggap sebagai ratapan yang dilarang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8623}"
