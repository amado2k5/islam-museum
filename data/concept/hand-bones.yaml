label: { ar: "عظام الرسغ والكف والأصابع عند ابن سينا", en: "Wrist, hand and finger bones in the Canon", ur: "قانون میں کلائی، ہتھیلی اور انگلیوں کی ہڈیاں", es: "Huesos de la muñeca, la mano y los dedos en el Canon", fr: "Os du poignet, de la main et des doigts dans le canon" }
summary:
  ar: "يصف ابن سينا الرسغ من عظام كثيرة سبعة أصلية وثامن زائد، ثم مشط الكف من أربعة عظام، ثم الأصابع من ثلاثة عظام لكل منها ما عدا الإبهام {cite:canon-ibn-sina-print-v1 pp.55-57} {cite:canon-ibn-sina-print-v1 p.60}."
  en: "Ibn Sina describes the wrist as many bones, seven principal and one extra; the metacarpus as four bones; and the fingers as three bones each except the thumb {cite:canon-ibn-sina-print-v1 pp.55-57} {cite:canon-ibn-sina-print-v1 p.60}."
  es: "Ibn Sina describe la muñeca como muchos huesos, siete principales y uno adicional; el metacarpo como cuatro huesos; y los dedos como tres huesos cada uno, excepto el pulgar {cite:canon-ibn-sina-print-v1 pp.55-57} {cite:canon-ibn-sina-print-v1 p.60}."
  fr: "Ibn Sina décrit le poignet comme étant composé de nombreux os, sept principaux et un supplémentaire; le métacarpe comme étant composé de quatre os; et les doigts comme étant composés de trois os chacun, à l'exception du pouce {cite:canon-ibn-sina-print-v1 pp.55-57} {cite:canon-ibn-sina-print-v1 p.60}."
  ur: "ابن سینا کلائی کو کئی ہڈیوں کے طور پر بیان کرتے ہیں، سات اصل اور ایک اضافی؛ metacarpus چار ہڈیوں کے طور پر؛ اور انگلیاں تین ہڈیوں کے طور پر ہر ایک انگوٹھے کے علاوہ {حوالہ: کینون ابن سینا پرنٹ-v1 صفحہ 55-57}"
