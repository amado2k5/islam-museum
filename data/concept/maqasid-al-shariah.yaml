label: { ar: "مَقَاصِد الشَّرِيعَة", en: "Objectives of the Shari'a (maqasid al-shari'a)", ur: "مقاصدِ شریعت" }
summary:
  ar: "مقاصد الشريعة جمع مقصد، وهي عند الأصوليين المعاني والحكم التي يلاحظها الشارع في جميع أحوال التشريع أو معظمها، بحيث لا تختص ملاحظتها بنوع خاص من أحكام الشريعة. وقسّمها الشاطبي ثلاثة أقسام: ضرورية، وحاجية، وتحسينية، وتفصيلها في الملحق الأصولي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14891}"
  en: "The objectives of the Shari'a are the purposes and wisdoms that the Lawgiver intends across all or most of the rulings, not confined to one kind of ruling. Al-Shatibi divides them into three: necessities (daruriyyat), needs (hajiyyat) and refinements (tahsiniyyat). Their detail is in the usul appendix. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14891}"
  ur: "مقاصدِ شریعت وہ حکمتیں اور مقاصد ہیں جنہیں شارع احکام کے اکثر یا تمام حصوں میں ملحوظ رکھتا ہے۔ شاطبی انہیں ضروری، حاجی اور تحسینی تین اقسام میں بانٹتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14891}"
