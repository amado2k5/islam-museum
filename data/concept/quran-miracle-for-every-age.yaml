id: concept/quran-miracle-for-every-age
class: concept
kind: doctrine
label: { ar: "إعجاز القرآن يتجدد مع كل عصر", en: "The Quran's inimitability renewed in every age" }
summary:
  ar: "يرى الشعراوي أن إعجاز القرآن لا يقف عند زمن نزوله، بل يُعطي كل جيل إعجازاً فيما برع فيه ذلك الجيل، ويستدل بآيات سورة الروم وبآية بسط الأرض في سورة ق. هذا رأيه يُنسب إليه، ولم تُعرض معه آراء أخرى بعد {cite:tafsir-sharawi-khawatir-scan p.12}."
  en: "Sha'rawi holds that the Quran's inimitability does not end with its revelation but gives each generation a sign in what that generation excels at. He cites the verses on the Romans and the verse on the spreading of the earth. This is his view and is attributed to him; other views are not yet presented."
