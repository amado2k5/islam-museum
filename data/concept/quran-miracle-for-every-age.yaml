periods: [period/prophetic-era]
regions: [global]
issue:
  ar: "هل يتجدد إعجاز القرآن مع تقدم العلم، وكيف تُفهم آياته الكونية؟"
  en: "Does the Quran's inimitability renew as knowledge advances, and how are its cosmic verses to be understood?"
perspectives:
  - tradition: sunni
    id: sharawi-renewed-miracle
    stance:
      ar: "الإعجاز متجدد بتجدد العلوم"
      en: "Inimitability is renewed as knowledge advances"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقول الشعراوي إن القرآن معجزة إلى قيام الساعة، وإن الله يكشف من أسرار الكون ما يزيد فهم عطاءات القرآن {cite:tafsir-sharawi-khawatir-scan p.9}{cite:tafsir-sharawi-khawatir-scan p.12}."
      en: "Sha'rawi says the Quran is a miracle until the Hour, and that God reveals from the secrets of the cosmos what makes the Quran's gifts more understood {cite:tafsir-sharawi-khawatir-scan p.9}{cite:tafsir-sharawi-khawatir-scan p.12}."
