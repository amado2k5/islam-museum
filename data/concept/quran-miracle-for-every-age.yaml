id: concept/quran-miracle-for-every-age
class: concept
kind: doctrine
label: { ar: "إعجاز القرآن يتجدد مع كل عصر", en: "The Quran's inimitability renewed in every age", es: "La inimitable naturaleza del Corán se renueva en cada época.", fr: "Le caractère inimitable du Coran se renouvelle à chaque époque.", ur: "ہر دور میں قرآن کی بے مثالیت کی تجدید ہوتی رہی" }
tags: ["nubuwat-browser", "nubuwat-muajizat", arabiyya-browser, arabiyya-ijaz]
summary:
  ar: "يرى الشعراوي أن إعجاز القرآن لا يقف عند زمن نزوله، بل يُعطي كل جيل إعجازاً فيما برع فيه ذلك الجيل، ويستدل بآيات سورة الروم وبآية بسط الأرض في سورة ق. هذا رأيه يُنسب إليه، ولم تُعرض معه آراء أخرى بعد {cite:tafsir-sharawi-khawatir-scan p.12}."
  en: "Sha'rawi holds that the Quran's inimitability does not end with its revelation but gives each generation a sign in what that generation excels at. He cites the verses on the Romans and the verse on the spreading of the earth. This is his view and is attributed to him; other views are not yet presented."
  es: "Sha'rawi sostiene que la inimitabilidad del Corán no termina con su revelación, sino que otorga a cada generación una señal de aquello en lo que sobresale. Cita los versículos sobre los romanos y el versículo sobre la expansión de la tierra. Esta es su opinión, que se le atribuye; aún no se han presentado otras posturas."
  fr: "Sha'rawi soutient que le caractère inimitable du Coran ne s'arrête pas à sa révélation, mais qu'il offre à chaque génération un signe révélant son domaine d'excellence. Il cite les versets relatifs aux Romains et celui sur l'expansion de la terre. Cette opinion lui est attribuée; d'autres points de vue n'ont pas encore été présentés."
  ur: "شعراوی کا خیال ہے کہ قرآن کی مماثلت اس کے نزول کے ساتھ ختم نہیں ہوتی بلکہ ہر نسل کو اس بات کی نشانی دیتی ہے کہ وہ نسل کس چیز پر سبقت لے جاتی ہے۔ اس نے رومیوں پر آیات اور زمین کے پھیلنے کی آیت کا حوالہ دیا۔ یہ اس کا قول ہے اور اس کی طرف منسوب ہے۔ دیگر خیالات ابھی تک پیش نہیں کیے گئے ہیں."
