id: "concept/iltisaq-al-jafnayn"
class: "concept"
kind: "scientific"
label:
  ar: "التصاق الجفن بالمقلة"
  en: "Adhesion of the lid to the eyeball"
  ur: "پلک کا مقلہ سے چپکنا"
  es: "Adhesión del párpado al globo ocular"
  fr: "Adhérence de la paupière au globe oculaire"
summary:
  ar: "قد يعرض للجفن أن يلتصق بالمقلة إما بالملتحمة وإما بالقرنية وإما بكليهما وقد يكون في أحد جانبي الموق وقد يكون إلى الوسط كما قد يكون شاملاً، والسبب فيه إما قروح حديثة وإما خرق الكحال إذا لقط من المقلة سبلاً أو كشط ظفرة أو حك من الجفن جرباً ثم لم يكو بما يكوى به ولم يراع كل وقت ما يجب أن يراعى فيه حتى التصق {cite:canon-ibn-sina-print-v2 p.195}"
  en: "The lid may come to adhere to the eyeball, either at the conjunctiva, the cornea, or both; it may be on one side of the canthus, or toward the middle, or total; its cause is either recent ulcers, or the oculist's error when he excised a sabal from the ball, scraped a pterygium or rubbed a scab from the lid and then did not cauterise with the strong cautery described and did not watch every moment what had to be watched till it adhered {cite:canon-ibn-sina-print-v2 p.195}"
  ur: "پلک مقلہ سے چپک سکتی ہے یا ملتحمہ سے یا قرنیہ سے یا دونوں سے؛ اور مآق کے ایک جانب ہو سکتا ہے یا وسط کی طرف یا مکمل؛ اس کا سبب یا تو نئے قرحے ہیں یا کحال کی غلطی جب وہ مقلہ سے سبل لقط کرے یا ظفرہ کھرچے یا پلک سے جرب مالے اور پھر مذکور سخت داغ سے نہ داغے اور ہر وقت اس کی رعایت نہ کرے جو رعایت چاہیے یہاں تک کہ چپک جائے {cite:canon-ibn-sina-print-v2 p.195}"
  es: "El párpado puede llegar a adherirse al globo ocular, ya sea en la conjuntiva, la córnea o ambas; puede ser en un lado del canto, hacia el centro o total; su causa son úlceras recientes o un error del oculista al extirpar un sabal del globo ocular, raspar un pterigión o frotar una costra del párpado y luego no cauterizar con la cauterización fuerte descrita ni vigilar en todo momento lo que debía vigilarse hasta que se adhiriera {cite:canon-ibn-sina-print-v2 p.195}"
  fr: "La paupière peut adhérer au globe oculaire, soit au niveau de la conjonctive, soit au niveau de la cornée, soit aux deux; cette adhérence peut se situer d'un côté du canthus, au milieu de la paupière, ou être totale; elle est causée soit par des ulcères récents, soit par une erreur de l'ophtalmologiste qui, après avoir excisé une croûte du globe oculaire, gratté un ptérygion ou frotté une croûte de la paupière, n'a pas cautérisé avec le bistouri électrique puissant décrit et n'a pas surveillé attentivement l'adhérence. {cite:canon-ibn-sina-print-v2 p.195}"
