summary:
  ar: "يختم ابن سينا الفصل الثالث بمقارنة طرق الاستفراغ: الإسهال يجذب من فوق ويقلع من تحت فهو موافق للجذبين المخالف والموافق، والقيء يفعل الجذب والقلع بالعكس، والفصد يختلف حاله بحسب المواضع التي يؤخذ منها الدم، وأقل الناس حاجة إلى الاستفراغ من كان جيد الغذاء والهضم وأصحاب البلدان الحارة {cite:canon-ibn-sina-print-v1 p.276}."
  en: "Ibn Sina closes the third chapter by comparing the ways of evacuating: purging draws from above and uproots from below, so it suits both the opposite and the like kind of drawing; vomiting draws and uproots the other way round; the effect of venesection varies with the place from which blood is taken; and those who least need evacuation are those with good food and good digestion and the people of hot countries {cite:canon-ibn-sina-print-v1 p.276}."
