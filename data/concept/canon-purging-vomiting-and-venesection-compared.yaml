id: concept/canon-purging-vomiting-and-venesection-compared
class: concept
kind: scientific
label:
  ar: "المقارنة بين الإسهال والقيء والفصد عند ابن سينا"
  en: "Purging, vomiting and venesection compared in the Canon"
  fr: "Comparaison de purge, vomissement et saignée dans le Canon"
  ur: "اسہال، قے اور فصد کا موازنہ قانون میں"
  es: "Comparación de la purga, el vómito y la venesección en el Canon"
  tr: "İbn Sina'ya göre ishal, kusma ve flebitin karşılaştırılması"
  id: "Perbandingan antara diare, muntah, dan flebitis menurut Ibn Sina"
summary:
  ar: "يختم ابن سينا الفصل الثالث بمقارنة طرق الاستفراغ: الإسهال يجذب من فوق ويقلع من تحت فهو موافق للجذبين المخالف والموافق، والقيء يفعل الجذب والقلع بالعكس، والفصد يختلف حاله بحسب المواضع التي يؤخذ منها الدم، وأقل الناس حاجة إلى الاستفراغ من كان جيد الغذاء والهضم وأصحاب البلدان الحارة {cite:canon-ibn-sina-print-v1 p.276}."
  en: "Ibn Sina closes the third chapter by comparing the ways of evacuating: purging draws from above and uproots from below, so it suits both the opposite and the like kind of drawing; vomiting draws and uproots the other way round; the effect of venesection varies with the place from which blood is taken; and those who least need evacuation are those with good food and good digestion and the people of hot countries {cite:canon-ibn-sina-print-v1 p.276}."
  fr: "Ibn Sina clôt le chapitre 3 : purge attirant du haut et déracinant du bas, pour directions opposée et semblable ; vomissement inverse ; saignée selon lieu prélevé ; moindre besoin avec bonne alimentation, digestion et pays chauds {cite:canon-ibn-sina-print-v1 p.276}."
  es: "Ibn Sina cierra el tercer capítulo comparando las formas de evacuación: la purga extrae desde arriba y arranca desde abajo, por lo que se adapta tanto al tipo de extracción opuesto como al mismo; el vómito extrae y arranca en sentido contrario; el efecto de la venesección varía según el lugar de donde se toma la sangre; y quienes menos necesitan evacuación son aquellos con buena alimentación y buena digestión y la gente de países cálidos {cite:canon-ibn-sina-print-v1 p.276}."
  ur: "ابن سینا تیسرا باب خالی کرنے کے طریقوں کا موازنہ کرتے ہوئے ختم کرتا ہے: صاف کرنا اوپر سے کھینچتا ہے اور نیچے سے اکھاڑتا ہے، لہذا یہ مخالف اور اسی طرح کی دونوں قسموں کے مطابق ہے۔ قے دوسری طرف کھینچتی اور اکھاڑ دیتی ہے۔ وینسییکشن کا اثر اس جگہ سے مختلف ہوتا ہے جہاں سے خون لیا جاتا ہے۔ اور جن لوگوں کو کم از کم انخلاء کی ضرورت ہے وہ وہ ہیں جو اچھی خوراک اور اچھا ہاضمہ رکھتے ہیں اور گرم ممالک کے لوگ ہیں"
  tr: "İbn Sina, üçüncü bölümü kusma yöntemlerini karşılaştırarak bitirir: ishal yukarıdan çekilir ve aşağıdan atılır, böylece zıt ve karşılık gelen çekime karşılık gelir; kusma çekim ve çekim yapar, tam tersi de geçerlidir; flegmiyopati kan alındığı yerlere göre değişir. Kusmaya en az ihtiyacı olanlar, iyi beslenmiş ve sindirilebilir olanlar ve sıcak ülkelerden gelenlerdir {cite:canon-ibn-sina-print-v1 s.276}."
  id: "Ibn Sina menutup bab ketiga dengan membandingkan metode muntah: diare diambil dari atas dan dikeluarkan dari bawah, sehingga sesuai dengan daya tarik yang berlawanan dan sesuai; muntah menyebabkan tarikan dan ekstraksi dan sebaliknya; flegmiopati bervariasi tergantung tempat darah diambil. Yang paling tidak membutuhkan muntah adalah mereka yang cukup nutrisi dan mudah dicerna serta berasal dari daerah panas {cite:canon-ibn-sina-print-v1 hlm.276}."
