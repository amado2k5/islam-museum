id: concept/canon-which-humours-vomit-readily
class: concept
kind: scientific
label: { ar: "أي الأخلاط يتقيأ بسهولة عند ابن سينا", en: "Which humours vomit readily in the Canon", ur: "کون سے اخلاط آسانی سے قے میں نکلتے ہیں قانون میں", es: "¿Qué humores vomitan fácilmente en el Canon?", fr: "Quels humeurs vomissent facilement dans le Canon", tr: "İbn Sina'ya göre hangi humorlar kolayca kusar?", id: "Humor mana yang menurut Avicenna mudah muntah?" }
summary:
  ar: "يقول ابن سينا إن من الأخلاط ما هو سريع الإجابة إلى القيء كالصفراء، ومنها ما هو مستعص عليه كالسوداء، ومنها ما له حال وحال كالبلغم، وإن المحموم إسهاله أصوب من تقيئه، وإن من خلطه نازل كأصحاب زلق الأمعاء تقيؤه محال {cite:canon-ibn-sina-print-v1 p.278}."
  en: "Ibn Sina says some humours answer vomiting quickly, as bile does, others resist it, as black bile does, and others go either way, as phlegm does, that for a feverish person purging is sounder than vomiting, and that vomiting is impossible for those whose humour runs downward, as with the lientery {cite:canon-ibn-sina-print-v1 p.278}."
  es: "Ibn Sina dice que algunos humores responden rápidamente al vómito, como lo hace la bilis, otros lo resisten, como lo hace la bilis negra, y otros van en ambos sentidos, como lo hace la flema, que para una persona febril la purga es más saludable que el vómito, y que el vómito es imposible para aquellos cuyo humor corre hacia abajo, como en el caso de la lientería {cite:canon-ibn-sina-print-v1 p.278}."
  fr: "Ibn Sina dit que certaines humeurs réagissent rapidement aux vomissements, comme la bile, d'autres y résistent, comme la bile noire, et d'autres encore vont dans les deux sens, comme le flegme; que pour une personne fiévreuse, la purge est plus saine que les vomissements, et que les vomissements sont impossibles pour ceux dont l'humeur descend, comme avec le litière {cite:canon-ibn-sina-print-v1 p.278}."
  ur: "ابن سینا کہتے ہیں کہ بعض مزاح نگار قے کا جلد جواب دیتے ہیں، جیسا کہ پت کرتا ہے، دوسرے اس کے خلاف مزاحمت کرتے ہیں، جیسا کہ سیاہ پت کرتا ہے، اور دوسرے اس کی مزاحمت کرتے ہیں، جیسا کہ بلغم کرتا ہے، کہ بخار میں مبتلا شخص کے لیے قے سے صاف کرنا زیادہ بہتر ہے، اور جن کا مزاح نیچے کی طرف جاتا ہے ان کے لیے قے ناممکن ہے، جیسا کہ لنٹری کے ساتھ۔ صفحہ 278}۔"
  tr: "İbn Sina, bazı humorların kusmaya hızlıca yanıt verdiğini, örneğin safra gibi; bazılarının siyah mürekkep gibi direnilmesinin zor; bazılarının balgam gibi bir duruma ve duruma sahip olduğunu; ateşli bir kişide ishalin kusmadan daha doğru olduğunu, bağırsak kayganlığı olanlar gibi düşük bağırsakla karıştıranların kusmaya imkansız olduğunu söyler. {cite:canon-ibn-sina-print-v1 s.278}."
  id: "Ibn Sina mengatakan bahwa beberapa humor merespons dengan cepat terhadap muntah, seperti empedu; beberapa sulit ditolak, seperti tinta hitam; beberapa memiliki kondisi dan kondisi seperti dahak; dan bahwa diare pada orang demam lebih akurat daripada muntah, dan mereka yang mencampurkannya dengan usus rendah, seperti yang licin usus, menyebabkan muntah tidak mungkin terjadi. {cite:canon-ibn-sina-print-v1 hlm.278}."
