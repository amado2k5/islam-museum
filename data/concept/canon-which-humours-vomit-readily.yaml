id: concept/canon-which-humours-vomit-readily
class: concept
kind: scientific
label: { ar: "أي الأخلاط يتقيأ بسهولة عند ابن سينا", en: "Which humours vomit readily in the Canon", ur: "کون سے اخلاط آسانی سے قے میں نکلتے ہیں قانون میں" }
summary:
  ar: "يقول ابن سينا إن من الأخلاط ما هو سريع الإجابة إلى القيء كالصفراء، ومنها ما هو مستعص عليه كالسوداء، ومنها ما له حال وحال كالبلغم، وإن المحموم إسهاله أصوب من تقيئه، وإن من خلطه نازل كأصحاب زلق الأمعاء تقيؤه محال {cite:canon-ibn-sina-print-v1 p.278}."
  en: "Ibn Sina says some humours answer vomiting quickly, as bile does, others resist it, as black bile does, and others go either way, as phlegm does, that for a feverish person purging is sounder than vomiting, and that vomiting is impossible for those whose humour runs downward, as with the lientery {cite:canon-ibn-sina-print-v1 p.278}."
