label: { ar: "تدبير المزاج الحار الرطب عند ابن سينا", en: "The regimen of the hot and moist temperament in the Canon", ur: "گرم تر مزاج کی تدبیر قانون میں" }
summary:
  ar: "يذكر ابن سينا أن أصحاب المزاج الحار الرطب بعرض العفونة وانصباب المواد إلى الأعضاء، فتكون رياضتهم كثيرة التحليل لينة لئلا تظهر في الأخلاط بثور، وأن يرتاضوا بعد الاستفراغ ويستحموا قبل الطعام ويعنوا بنفض الفضول كلها ويحتاطوا في الربيع بالفصد والاستفراغ {cite:canon-ibn-sina-print-v1 p.256}."
  en: "Ibn Sina says that those of hot and moist temperament are liable to putrefaction and to matter flowing to the organs, so their exercise should be gentle and much dissolving, lest pustules arise in the humours; they exercise after evacuation, bathe before the meal, attend to shaking off all superfluities, and take care in spring with venesection and evacuation {cite:canon-ibn-sina-print-v1 p.256}."
