id: concept/canon-regimen-of-the-hot-and-moist-temperament
class: concept
kind: scientific
label:
  ar: "تدبير المزاج الحار الرطب عند ابن سينا"
  en: "The regimen of the hot and moist temperament in the Canon"
  fr: "Régime du tempérament chaud et humide dans le Canon"
  ur: "گرم تر مزاج کی تدبیر قانون میں"
  es: "El régimen del temperamento cálido y húmedo en el Canon"
  tr: "İbn Sina'ya göre sıcak ve ıslak ruh halini yönetmek"
  id: "Mengelola suasana hati panas dan basah menurut Ibn Sina"
summary:
  ar: "يذكر ابن سينا أن أصحاب المزاج الحار الرطب بعرض العفونة وانصباب المواد إلى الأعضاء، فتكون رياضتهم كثيرة التحليل لينة لئلا تظهر في الأخلاط بثور، وأن يرتاضوا بعد الاستفراغ ويستحموا قبل الطعام ويعنوا بنفض الفضول كلها ويحتاطوا في الربيع بالفصد والاستفراغ {cite:canon-ibn-sina-print-v1 p.256}."
  en: "Ibn Sina says that those of hot and moist temperament are liable to putrefaction and to matter flowing to the organs, so their exercise should be gentle and much dissolving, lest pustules arise in the humours; they exercise after evacuation, bathe before the meal, attend to shaking off all superfluities, and take care in spring with venesection and evacuation {cite:canon-ibn-sina-print-v1 p.256}."
  fr: "Selon Ibn Sina, le chaud-humide prédispose à la putréfaction et aux afflux vers les organes : exercice doux mais fortement dissolvant pour éviter des pustules dans les humeurs, exercice après évacuation, bain avant repas, élimination de tous les superflus et précautions printanières par saignée et évacuation {cite:canon-ibn-sina-print-v1 p.256}."
  es: "Ibn Sina dice que aquellos de temperamento cálido y húmedo son propensos a la putrefacción y a la acumulación de materia en los órganos, por lo que su ejercicio debe ser suave y muy disolvente, para evitar que surjan pústulas en los humores; se ejercitan después de la evacuación, se bañan antes de las comidas, se preocupan por eliminar todas las superfluidades y tienen cuidado en primavera con la flebotomía y la evacuación {cite:canon-ibn-sina-print-v1 p.256}."
  ur: "ابن سینا کہتے ہیں کہ گرم اور مرطوب مزاج کے لوگ اعضاء کی طرف بہنے والے مادے کے زائل ہوتے ہیں، لہٰذا ان کی ورزش نرم اور زیادہ گھلنے والی ہونی چاہیے، ایسا نہ ہو کہ مزاح میں آبلے پیدا ہوں۔ وہ انخلاء کے بعد ورزش کرتے ہیں، کھانے سے پہلے غسل کرتے ہیں، تمام ضرورتوں کو دور کرنے کے لیے حاضر ہوتے ہیں، اور موسم بہار میں نس بندی اور انخلا کے ساتھ خیال رکھتے ہیں {حوالہ:کینن-ابن-سینا-پرنٹ-v1 p.256}۔"
  tr: "İbn Sina, sıcak, nemli mizaca sahip ve organlarına çok çeşitli çürük ve madde salgısı olan kişilerin, vücutlarında su toplaması oluşmasını önlemek için sık ve nazik egzersiz yapmaları gerektiğini belirtir. Kusma sonrası idrara çıkmalı, yemekten önce yıkanmalı, tüm meraklarını atmaya özen göstermeli ve ilkbaharda flebit ve kusmaya karşı dikkatli olmalıdırlar {cite:canon-ibn-sina-print-v1 s.256}."
  id: "Ibn Sina menyebutkan bahwa mereka yang memiliki temperamen panas dan lembap dengan berbagai jenis pembusukan dan zat yang mengalir ke organ mereka harus berolahraga secara rutin dan lembut untuk mencegah munculnya lepuhan pada bau. Mereka harus buang air kecil setelah muntah, mandi sebelum makan, berhati-hati menghilangkan rasa ingin tahu, dan berhati-hati di musim semi terhadap flebitis dan muntah {cite:canon-ibn-sina-print-v1 hlm.256}."
