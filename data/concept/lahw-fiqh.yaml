id: concept/lahw-fiqh
class: concept
kind: legal
label:
  ar: "اللَّهْو"
  en: "Lahw (diversion and amusement), fiqh rulings"
  ur: "لہو (تفریح اور کھیل تماشا)، فقہی احکام"
summary:
  ar: "اللهو في اللغة كل باطل ألهى عن الخير وعما يعنى، وهو عند الطرطوشي ترويح النفس بما لا تقتضيه الحكمة، وقد يكنى به عن الجماع لأنه يلهي القلب؛ وعند الفقهاء يغلب فيه المعنى اللغوي، وهو كل ما يتلذذ به الإنسان فيلهيه ثم ينقضي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13708}. والحكم الأصلي أن كل ما يتلهى به الإنسان مما لا يفيد في الدنيا ولا في الآخرة فائدة دينية فهو باطل، إلا الرمي بالقوس وتأديب الفرس وملاعبة الأهل، فإنها حق لاتصالها بما يفيد {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13708}."
  en: "Lahw, in lexicon, is any falsehood that distracts from good and from what matters; al-Tartushi defines it as relaxing the soul with what wisdom does not call for, and al-Qurtubi notes that it is sometimes used as a euphemism for intercourse, since it diverts the heart. In fiqh the lexical sense largely holds: whatever a person enjoys and is diverted by, and which then passes {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13708}. The basic ruling is that any diversion that brings no religious benefit in this world or the next is vain, except archery, training a horse and playing with one's wife, which are right because they serve useful ends {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13708}."
  ur: "لہو لغت میں ہر اس باطل چیز کو کہتے ہیں جو انسان کو بھلائی اور اہم امور سے غافل کر دے؛ طرطوشی کے نزدیک یہ نفس کو ایسی چیز سے بہلانا ہے جس کا تقاضا حکمت نہ کرے، اور قرطبی کے بقول جماع کو بھی لہو سے تعبیر کیا جاتا ہے کیونکہ وہ دل کو بہلاتا ہے۔ فقہاء کے استعمال میں عموماً یہی لغوی معنی رہتا ہے: ہر وہ چیز جس سے انسان لذت لیتا ہے اور جو ختم ہو جاتی ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13708}۔ اصل حکم یہ ہے کہ ہر وہ تفریح جس میں دین یا دنیا کا کوئی فائدہ نہ ہو باطل ہے، سوائے تیر اندازی، گھوڑے کی تربیت اور بیوی سے دل لگی کے، کیونکہ یہ کسی مفید مقصد سے جڑی ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13708}۔"
