id: concept/canon-calming-the-gut-after-a-purge
class: concept
kind: scientific
label:
  ar: "تسكين المعي بعد الإسهال عند ابن سينا"
  en: "Calming the gut after a purge in the Canon"
  fr: "Apaiser l’intestin après purge dans le Canon"
  ur: "اسہال کے بعد آنتوں کو سکون دینا قانون میں"
  es: "Calmar el intestino después de una purga en el Canon"
  tr: "İbn Sina'ya göre ishal sonrası ağrı kesicileri"
  id: "Analgesia setelah diare menurut Ibn Sina"
summary:
  ar: "يوصي ابن سينا بعد الدواء بماء الشعير لدفع غائلة المسهل، وللبارد المزاج البلغمي حرفاً مغسولاً بماء حار وزيت، وللحار بزرقطونا بماء بارد ودهن بنفسج وسكر، وللمعتدل بزر الكتان، ولمن خاف سحجاً الطين الأرمني بماء الرمان، وتأخير السكنجبين يومين أو ثلاثة {cite:canon-ibn-sina-print-v1 pp.281-282}."
  en: "Ibn Sina recommends after the drug barley water to turn aside the purgative's harm, washed cress with hot water and oil for the cold, phlegmatic person, psyllium with cold water, violet oil and sugar for the hot, flaxseed for the moderate, Armenian clay with pomegranate water for fear of abrasion, and putting off oxymel for two or three days {cite:canon-ibn-sina-print-v1 pp.281-282}."
  fr: "Après le remède, Ibn Sina conseille eau d’orge contre ses méfaits ; cresson lavé, eau chaude et huile au tempérament froid phlegmatique ; psyllium, eau froide, huile de violette et sucre au chaud ; lin au modéré ; argile arménienne et eau de grenade en crainte d’érosion ; attente de deux ou trois jours pour l’oxymel {cite:canon-ibn-sina-print-v1 pp.281-282}."
  es: "Ibn Sina recomienda después del medicamento agua de cebada para contrarrestar el daño del purgante, berro lavado con agua caliente y aceite para la persona fría y flemática, psyllium con agua fría, aceite de violeta y azúcar para la persona caliente, linaza para la persona moderada, arcilla armenia con agua de granada para el temor a la abrasión, y posponer el oxímel durante dos o tres días {cite:canon-ibn-sina-print-v1 pp.281-282}."
  ur: "ابن سینا تجویز کرتا ہے کہ دوائی کے بعد جو کے پانی کو جراثیم کے نقصان کو دور کرنے کے لیے، سردی کے لیے گرم پانی اور تیل سے دھویا جائے، بلغمی کے لیے ٹھنڈے پانی کے ساتھ سائیلیم، گرم کے لیے بنفشی تیل اور چینی، معتدل کے لیے فلیکسیڈ، ارمینی مٹی کو انار کے پانی کے ساتھ دو یا تین دن تک کھرچنے کے خوف سے ڈالیں۔ {حوالہ:کینن ابن سینا پرنٹ v1 صفحہ 281-282}۔"
  tr: "İbn Sina, müshilin müshilini atmak için ilaçtan sonra arpa suyu; soğuk flegmatik mizaçlı olanlar için mektup sıcak su ve yağla; sıcak olanlar için sarı kaşıkla, soğuk su, menekşe yağı ve şekerle; ılımlı biri için keten tohumu; korkanlar için ise Ermeni kilini nar suyu ile öğütmek; ve iki yerleşimi iki ya da üç gün geciktirmek {cite:canon-ibn-sina-print-v1 s.281-282}."
  id: "Ibn Sina merekomendasikan air jelai setelah pengobatan untuk mengusir pencahar; bagi yang memiliki temperamen flegmatik dingin, surat harus dicuci dengan air panas dan minyak; untuk yang panas, dengan sendok kuning dengan air dingin, minyak violet, dan gula; untuk orang sedang, dengan biji rami; dan bagi yang takut, menggiling tanah liat Armenia dengan air delima; dan menunda dua pemukiman tersebut selama dua atau tiga hari {cite:canon-ibn-sina-print-v1 hlm.281-282}."
