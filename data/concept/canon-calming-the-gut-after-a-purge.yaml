summary:
  ar: "يوصي ابن سينا بعد الدواء بماء الشعير لدفع غائلة المسهل، وللبارد المزاج البلغمي حرفاً مغسولاً بماء حار وزيت، وللحار بزرقطونا بماء بارد ودهن بنفسج وسكر، وللمعتدل بزر الكتان، ولمن خاف سحجاً الطين الأرمني بماء الرمان، وتأخير السكنجبين يومين أو ثلاثة {cite:canon-ibn-sina-print-v1 pp.281-282}."
  en: "Ibn Sina recommends after the drug barley water to turn aside the purgative's harm, washed cress with hot water and oil for the cold, phlegmatic person, psyllium with cold water, violet oil and sugar for the hot, flaxseed for the moderate, Armenian clay with pomegranate water for fear of abrasion, and putting off oxymel for two or three days {cite:canon-ibn-sina-print-v1 pp.281-282}."
