label: { ar: "مثال كوكبين بينهما ستون درجة في الطول", en: "The worked example of two stars sixty degrees apart in longitude", ur: "طول میں ساٹھ درجے کے فاصلے والے دو ستاروں کی مثال", es: "El ejemplo resuelto de dos estrellas separadas por sesenta grados de longitud.", fr: "Exemple concret de deux étoiles séparées de soixante degrés en longitude" }
summary:
  ar: "يرسم البتاني قطعة من فلك البروج عليها نقطتان وقطب للبروج، ويفرض أحد الكوكبين في موضعه على الفلك والآخر مائلاً عنه في العرض على قوس من دائرة تجوز على القطبين. ثم يضرب مثالاً: قوس الطول بين الكوكبين ستون جزءاً، وعرض أحدهما ثلاثون جزءاً، فيبين بالنسب في الشكل الكري أن البعد الحقيقي بينهما يختلف عن الستين التي في الطول وحدها. {cite:zij-sabi-nallino-byblion pp.61-63}."
  en: "Al-Battani draws a piece of the ecliptic with two points on it and a pole of the ecliptic, and puts one of the two stars in its place on the circle and the other off it in latitude on an arc of the circle through the poles. He then takes an example: the arc of longitude between the two stars is sixty parts and the latitude of one of them is thirty parts, and he shows by proportions in the spherical figure that the true distance between them differs from the sixty of longitude alone. {cite:zij-sabi-nallino-byblion pp.61-63}."
  ur: "البتانی فلک البروج کا ایک ٹکڑا بناتے ہیں جس پر دو نقطے ہیں اور بروج کا ایک قطب، اور دونوں ستاروں میں سے ایک کو فلک پر اپنی جگہ اور دوسرے کو عرض میں اس سے ہٹا ہوا دونوں قطبوں سے گزرنے والے دائرے کی قوس پر فرض کرتے ہیں۔ پھر ایک مثال دیتے ہیں: دونوں ستاروں کے درمیان طول کی قوس ساٹھ اجزاء ہے اور ایک کا عرض تیس اجزاء، اور کرے کی شکل میں نسبتوں سے دکھاتے ہیں کہ ان کے درمیان حقیقی فاصلہ اکیلے طول کے ساٹھ سے مختلف ہے۔ {cite:zij-sabi-nallino-byblion pp.61-63}۔"
  es: "Al-Battani dibuja un segmento de la eclíptica con dos puntos y un polo, y sitúa una de las dos estrellas en su lugar sobre el círculo, y la otra fuera de él, en latitud, sobre un arco del círculo que pasa por los polos. A continuación, pone un ejemplo: el arco de longitud entre las dos estrellas es de sesenta partes y la latitud de una de ellas es de treinta partes, y demuestra mediante proporciones en la figura esférica que la distancia real entre ellas difiere de las sesenta partes de longitud. {cite:zij-sabi-nallino-byblion pp.61-63}."
  fr: "Al-Battani trace un segment de l'écliptique comportant deux points et un pôle. Il place l'une des deux étoiles sur le cercle et l'autre hors de celui-ci, en latitude, sur un arc de cercle passant par les pôles. Il prend ensuite un exemple: l'arc de longitude entre les deux étoiles mesure soixante parties et la latitude de l'une d'elles est de trente parties. Il démontre, par des proportions sur une figure sphérique, que la distance réelle entre elles diffère de la seule mesure de longitude de soixante parties. {cite:zij-sabi-nallino-byblion pp.61-63}."
