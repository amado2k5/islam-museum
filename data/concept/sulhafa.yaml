id: concept/sulhafa
class: concept
kind: natural
label:
  ar: "سلحفاة"
  en: "Sulhafa (the tortoise or turtle)"
  ur: "سلحفاة"
  es: "Sulhafa (la tortuga terrestre o acuática)"
  fr: "Sulhafa (la tortue)"
  tr: "Kaplumbağa"
  id: "Kura-kura"
summary:
  ar: "السلحفاة في الكتاب صنفان بري وبحري، قيل إن دم البري مشوياً ينفع من الصرع، ومرارتها للقلاع، وبيضها لسعال الصبيان، ومرارتها لطوخ للخناق، ودم البحري مع الأنفحة جيد من نهش الهوام ولمن سقي اليتوع {cite:canon-ibn-sina-print-v1 p.601}."
  en: "Sulhafa is in the book of two kinds, land and sea; the blood of the land kind roasted is said to help epilepsy, its gall is for thrush, its egg for the cough of children, its gall a smear for quinsy, and the blood of the sea kind with rennet is good against the bites of vermin and for one given spurge to drink {cite:canon-ibn-sina-print-v1 p.601}."
  ur: "سلحفاۃ کتاب میں دو قسم کی ہے: خشکی کی اور سمندر کی؛ کہا گیا کہ خشکی والی کا بھنا ہوا خون مرگی میں مفید ہے، اس کا پتّا چھالوں کے لیے، اس کا انڈا بچوں کی کھانسی کے لیے اور اس کا پتّا خناق پر لیپ کے لیے ہے، اور سمندری کا خون انفحہ کے ساتھ زہریلے کیڑوں کے کاٹنے میں اور اس شخص کے لیے مفید ہے جسے یتوع پلایا گیا ہو {cite:canon-ibn-sina-print-v1 p.601}۔"
  es: "Sulhafa está en el libro de dos tipos, tierra y mar; se dice que la sangre del tipo tierra asada ayuda con la epilepsia, su bilis es para la candidiasis, su huevo para la tos de los niños, su bilis un ungüento para el amigdalitis, y la sangre del tipo mar con cuajo es buena contra las picaduras de parásitos y para una persona dada a beber euforbia {cite:canon-ibn-sina-print-v1 p.601}."
  fr: "Sulhafa est mentionné dans le livre comme étant de deux sortes, terrestre et marine; le sang de l'espèce terrestre rôti est censé aider contre l'épilepsie, sa bile est contre le muguet, son œuf contre la toux des enfants, sa bile en frottis contre l'angine, et le sang de l'espèce marine avec de la présure est bon contre les piqûres de vermine et pour celui qui a reçu de l'euphorbe à boire {cite:canon-ibn-sina-print-v1 p.601}."
  tr: "Kitaptaki kaplumbağa iki türdendir: yabani ve denizci. Kızarmış yabani kanın epilepsi için faydalı, safra kesesi kaleler için, yumurtaları çocukların öksürükleri için, safra kesesi boğaz sokması için kullanılır ve deniz kanı koklamasıyla zararlılara avlanma ve söğütleri sulayanlara iyi gelir {cite:canon-ibn-sina-print-v1 s.601}."
  id: "Kura-kura dalam buku ini terdiri dari dua jenis: liar dan laut. Dikatakan bahwa darah liar panggang bermanfaat untuk epilepsi, kantong empedunya untuk benteng, telurnya untuk batuk anak-anak, kantong empedu untuk sengatan tenggorokan, dan darah laut, dengan baunya, baik untuk memangsa hama dan bagi mereka yang menyiram pohon willow {cite:canon-ibn-sina-print-v1 hlm.601}."
