summary:
  ar: "الحلق لغة إزالة الشعر، ويطلق أيضا على الحلقوم، والاستحداد حلق العانة، والنتف نزع الشعر من أصوله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7261} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7262} ويرى الحنفية أن السنة في شعر رأس الرجل الفرق أو الحلق، ويرى المالكية حلق الرأس بدعة غير محرمة لغير المتحلل من الإحرام، ويرى الشافعية لا بأس به للتنظيف، وعن أحمد روايتان في كراهته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7262} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7263} ويكره القزع وهو حلق بعض الرأس دون بعض، ولا تحلق المرأة رأسها إلا لضرورة عند الحنفية والمالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7263} ويستحب عند جمهور الفقهاء حلق رأس المولود في اليوم السابع والتصدق بوزن شعره فضة، ويرى الحنابلة عدم حلق شعر المولودة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7263} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7264} وحلق الشارب عند الحنفية سنة، وعند المالكية يقص ولا يحلق، وعند الشافعية يكره حلقه، وعند الحنابلة يسن حفه أو قص طرفه؛ وحلق اللحية منهي عنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7264} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7265} ويحرم على المحرم حلق رأسه أو رأس غيره حتى يفرغ من أداء نسكه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7265} والحلق أو التقصير للتحلل نسك عند الحنفية والمالكية والشافعية في أظهر القولين والحنابلة في المذهب، وعند بعض الشافعية وأحمد في قول إطلاق من محظور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7265} ويجزئ حلق جميع الرأس بالاتفاق، وعند الحنفية يجزئ ربع الرأس مع الكراهة، وعند الشافعية ثلاث شعرات، وعند المالكية والحنابلة لا يجزئ حلق بعض الرأس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7266} والمرأة تقصر ولا تحلق للتحلل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7265} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7266} ويسن حلق العانة للرجل لأنه من الفطرة، ويجوز حلق الإبط لمن شق عليه النتف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7267} ويسن عند الجمهور حلق رأس الكافر إذا أسلم، ويحرم عند الحنفية والحنابلة حلق رأس الميت، ويكره عند المالكية، ولا يحلق عند الشافعية في الأصح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7268} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7269} والحلق في اللغة يطلق على الحلقوم، وتتعلق به أحكام في الصوم والإرضاع وغيرهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7269} ويختم المدخل بالعنوان التالي «حلّ» على ص 7270. "
  en: "Halq lexically is removing hair, and also names the throat; istihdad is shaving the pubic area and naf't is plucking hair at its roots. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7261} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7262} For Hanafis the sunna for a man's head is parting or shaving; for the Malikis shaving the head is a permitted innovation outside the state of ihram; for the Shafiis there is no harm in it for cleanliness; Ahmad has two reports on its dislike. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7262} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7263} Shaving part of the head (qaza') is disliked; a woman may not shave her head except out of necessity among the Hanafis and Malikis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7263} Most jurists recommend shaving a newborn's head on the seventh day and giving the weight of the hair in silver in alms; the Hanbalis do not shave a girl's hair. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7263} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7264} For the Hanafis shaving the moustache is a sunna; for the Malikis it is trimmed not shaved; for the Shafiis shaving it is disliked; for the Hanbalis trimming or clipping its edge is sunna; shaving the beard is forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7264} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7265} A person in ihram may not shave his own head or another's until both have finished the rite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7265} Shaving or cutting the hair to leave ihram is a rite for the Hanafis, Malikis, the more authoritative Shafii view and the Hanbali school, and a mere release from a prohibition for some Shafiis and Ahmad in one report. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7265} Shaving the whole head suffices by agreement; the Hanafis accept a quarter of the head with dislike; the Shafiis accept three hairs; the Malikis and Hanbalis reject shaving part of the head. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7266} A woman cuts rather than shaves for leaving ihram. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7265} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7266} Shaving the pubic hair is recommended for men as part of the natural practice, and shaving the armpit is permitted for one who finds plucking hard. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7267} Most jurists recommend shaving a convert's head; the Hanafis and Hanbalis forbid shaving a dead person's head, the Malikis dislike it, and the Shafiis in the sounder view do not shave it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7268} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7269} The word also names the throat, to which rules on fasting and suckling attach. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7269} The entry closes at the next headword, halla (حلّ), on p.7270. "
  ur: "حلق لغت میں بال صاف کرنے کو کہتے ہیں، اور حلقوم کے لیے بھی آتا ہے؛ استحداد زیرِ ناف کے بال صاف کرنا ہے، اور نتف بالوں کو جڑ سے اکھاڑنا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7261} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7262} حنفیہ کے نزدیک مرد کے سر کے بالوں میں سنت مانگ نکالنا یا منڈوانا ہے؛ مالکیہ کے نزدیک احرام سے باہر سر منڈوانا بدعت غیر حرام ہے؛ شافعیہ صفائی کے لیے اس میں حرج نہیں سمجھتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7262} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7263} سر کا کچھ حصہ منڈوانا (قزع) مکروہ ہے، اور عورت ضرورت کے بغیر سر نہیں منڈوا سکتی، حنفیہ اور مالکیہ کے نزدیک۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7263} جمہور کے نزدیک نومولود کے سر کے بال ساتویں دن منڈوانا اور ان کے وزن کے برابر چاندی صدقہ کرنا مستحب ہے؛ حنابلہ بچی کے بال نہیں منڈواتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7263} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7264} حنفیہ کے نزدیک مونچھ منڈوانا سنت ہے، مالکیہ کے نزدیک قینچی سے کاٹی جاتی ہے، شافعیہ منڈوانا مکروہ کہتے ہیں، اور داڑھی منڈوانا منع ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7264} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7265} محرم اپنے یا کسی اور کے سر کا حلق نہیں کر سکتا جب تک ادائے نسک سے فارغ نہ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7265} احرام سے نکلنے کے لیے حلق یا تقصیر جمہور کے نزدیک نسک ہے، جبکہ بعض شافعیہ اور امام احمد کی ایک روایت میں یہ محظور سے رہائی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7265} پورے سر کا حلق بالاتفاق کافی ہے؛ حنفیہ چوتھائی سر کو مکروہ کے ساتھ جائز کہتے ہیں، شافعیہ تین بال کافی سمجھتے ہیں، مالکیہ اور حنابلہ بعض سر کے حلق کو ناکافی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7266} عورت کے لیے احرام سے نکلنے کے لیے حلق کے بجائے تقصیر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7265} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7266} مرد کے لیے زیرِ ناف بال صاف کرنا مستحب ہے کیونکہ یہ فطرت میں شامل ہے، اور جس پر نوچنا دشوار ہو اس کے لیے بغل کے بال منڈوانا جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7267} جمہور کے نزدیک مسلمان ہونے والے کے سر کا حلق مسنون ہے؛ حنفیہ اور حنابلہ میت کے سر کا حلق حرام کہتے ہیں، مالکیہ مکروہ، اور شافعیہ اصح قول میں نہیں کرتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7268} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7269} یہ لفظ حلقوم کے معنی میں بھی آتا ہے جس سے روزے اور دودھ پلانے کے احکام متعلق ہوتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7269} یہ مدخل p.7270 پر اگلے مدخل «حلّ» پر ختم ہوتا ہے۔ "
