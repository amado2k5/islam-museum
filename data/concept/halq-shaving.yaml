id: concept/halq-shaving
class: concept
kind: legal
label: { ar: "الحلق", en: "Halq (shaving and cutting hair)", ur: "حلق", es: "Halq (afeitado y corte de pelo)", fr: "Halq (rasage et coupe de cheveux)", tr: "Küpeler", id: "Anting" }
summary:
  ar: "الحلق لغة إزالة الشعر، ويطلق أيضا على الحلقوم، والاستحداد حلق العانة، والنتف نزع الشعر من أصوله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7261} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7262} ويرى الحنفية أن السنة في شعر رأس الرجل الفرق أو الحلق، ويرى المالكية حلق الرأس بدعة غير محرمة لغير المتحلل من الإحرام، ويرى الشافعية لا بأس به للتنظيف، وعن أحمد روايتان في كراهته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7262} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7263} ويكره القزع وهو حلق بعض الرأس دون بعض، ولا تحلق المرأة رأسها إلا لضرورة عند الحنفية والمالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7263} ويستحب عند جمهور الفقهاء حلق رأس المولود في اليوم السابع والتصدق بوزن شعره فضة، ويرى الحنابلة عدم حلق شعر المولودة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7263} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7264} وحلق الشارب عند الحنفية سنة، وعند المالكية يقص ولا يحلق، وعند الشافعية يكره حلقه، وعند الحنابلة يسن حفه أو قص طرفه؛ وحلق اللحية منهي عنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7264} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7265} ويحرم على المحرم حلق رأسه أو رأس غيره حتى يفرغ من أداء نسكه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7265} والحلق أو التقصير للتحلل نسك عند الحنفية والمالكية والشافعية في أظهر القولين والحنابلة في المذهب، وعند بعض الشافعية وأحمد في قول إطلاق من محظور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7265} ويجزئ حلق جميع الرأس بالاتفاق، وعند الحنفية يجزئ ربع الرأس مع الكراهة، وعند الشافعية ثلاث شعرات، وعند المالكية والحنابلة لا يجزئ حلق بعض الرأس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7266} والمرأة تقصر ولا تحلق للتحلل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7265} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7266} ويسن حلق العانة للرجل لأنه من الفطرة، ويجوز حلق الإبط لمن شق عليه النتف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7267} ويسن عند الجمهور حلق رأس الكافر إذا أسلم، ويحرم عند الحنفية والحنابلة حلق رأس الميت، ويكره عند المالكية، ولا يحلق عند الشافعية في الأصح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7268} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7269} والحلق في اللغة يطلق على الحلقوم، وتتعلق به أحكام في الصوم والإرضاع وغيرهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7269} ويختم المدخل بالعنوان التالي «حلّ» على ص 7270. "
  en: "Halq lexically is removing hair, and also names the throat; istihdad is shaving the pubic area and naf't is plucking hair at its roots. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7261} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7262} For Hanafis the sunna for a man's head is parting or shaving; for the Malikis shaving the head is a permitted innovation outside the state of ihram; for the Shafiis there is no harm in it for cleanliness; Ahmad has two reports on its dislike. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7262} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7263} Shaving part of the head (qaza') is disliked; a woman may not shave her head except out of necessity among the Hanafis and Malikis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7263} Most jurists recommend shaving a newborn's head on the seventh day and giving the weight of the hair in silver in alms; the Hanbalis do not shave a girl's hair. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7263} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7264} For the Hanafis shaving the moustache is a sunna; for the Malikis it is trimmed not shaved; for the Shafiis shaving it is disliked; for the Hanbalis trimming or clipping its edge is sunna; shaving the beard is forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7264} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7265} A person in ihram may not shave his own head or another's until both have finished the rite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7265} Shaving or cutting the hair to leave ihram is a rite for the Hanafis, Malikis, the more authoritative Shafii view and the Hanbali school, and a mere release from a prohibition for some Shafiis and Ahmad in one report. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7265} Shaving the whole head suffices by agreement; the Hanafis accept a quarter of the head with dislike; the Shafiis accept three hairs; the Malikis and Hanbalis reject shaving part of the head. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7266} A woman cuts rather than shaves for leaving ihram. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7265} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7266} Shaving the pubic hair is recommended for men as part of the natural practice, and shaving the armpit is permitted for one who finds plucking hard. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7267} Most jurists recommend shaving a convert's head; the Hanafis and Hanbalis forbid shaving a dead person's head, the Malikis dislike it, and the Shafiis in the sounder view do not shave it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7268} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7269} The word also names the throat, to which rules on fasting and suckling attach. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7269} The entry closes at the next headword, halla ⁦(حلّ)⁩, on p.7270. "
  ur: "حلق لغت میں بال صاف کرنے کو کہتے ہیں، اور حلقوم کے لیے بھی آتا ہے؛ استحداد زیرِ ناف کے بال صاف کرنا ہے، اور نتف بالوں کو جڑ سے اکھاڑنا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7261} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7262} حنفیہ کے نزدیک مرد کے سر کے بالوں میں سنت مانگ نکالنا یا منڈوانا ہے؛ مالکیہ کے نزدیک احرام سے باہر سر منڈوانا بدعت غیر حرام ہے؛ شافعیہ صفائی کے لیے اس میں حرج نہیں سمجھتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7262} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7263} سر کا کچھ حصہ منڈوانا ⁦(قزع)⁩ مکروہ ہے، اور عورت ضرورت کے بغیر سر نہیں منڈوا سکتی، حنفیہ اور مالکیہ کے نزدیک۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7263} جمہور کے نزدیک نومولود کے سر کے بال ساتویں دن منڈوانا اور ان کے وزن کے برابر چاندی صدقہ کرنا مستحب ہے؛ حنابلہ بچی کے بال نہیں منڈواتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7263} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7264} حنفیہ کے نزدیک مونچھ منڈوانا سنت ہے، مالکیہ کے نزدیک قینچی سے کاٹی جاتی ہے، شافعیہ منڈوانا مکروہ کہتے ہیں، اور داڑھی منڈوانا منع ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7264} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7265} محرم اپنے یا کسی اور کے سر کا حلق نہیں کر سکتا جب تک ادائے نسک سے فارغ نہ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7265} احرام سے نکلنے کے لیے حلق یا تقصیر جمہور کے نزدیک نسک ہے، جبکہ بعض شافعیہ اور امام احمد کی ایک روایت میں یہ محظور سے رہائی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7265} پورے سر کا حلق بالاتفاق کافی ہے؛ حنفیہ چوتھائی سر کو مکروہ کے ساتھ جائز کہتے ہیں، شافعیہ تین بال کافی سمجھتے ہیں، مالکیہ اور حنابلہ بعض سر کے حلق کو ناکافی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7266} عورت کے لیے احرام سے نکلنے کے لیے حلق کے بجائے تقصیر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7265} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7266} مرد کے لیے زیرِ ناف بال صاف کرنا مستحب ہے کیونکہ یہ فطرت میں شامل ہے، اور جس پر نوچنا دشوار ہو اس کے لیے بغل کے بال منڈوانا جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7267} جمہور کے نزدیک مسلمان ہونے والے کے سر کا حلق مسنون ہے؛ حنفیہ اور حنابلہ میت کے سر کا حلق حرام کہتے ہیں، مالکیہ مکروہ، اور شافعیہ اصح قول میں نہیں کرتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7268} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7269} یہ لفظ حلقوم کے معنی میں بھی آتا ہے جس سے روزے اور دودھ پلانے کے احکام متعلق ہوتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7269} یہ مدخل p.7270 پر اگلے مدخل «حلّ» پر ختم ہوتا ہے۔ "
  es: "Halq léxicamente es quitar el cabello, y también nombra la garganta; istihdad es afeitar el área púbica y naf't es arrancar el cabello de raíz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7261} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7262} Para los hanafíes, la sunna para la cabeza de un hombre es la raya o el afeitado; para los malikíes, afeitarse la cabeza es una innovación permitida fuera del estado de ihram; para los shafiíes no hay daño en ello para la limpieza; Ahmad tiene dos informes sobre su desagrado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7262} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7263} Afeitar parte de la cabeza (qaza') es desagrado; Una mujer no puede afeitarse la cabeza excepto por necesidad entre los Hanafis y Malikis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7263} La mayoría de los juristas recomiendan afeitar la cabeza de un recién nacido al séptimo día y dar el peso del cabello en plata como limosna; los Hanbalis no afeitan el cabello de una niña. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7263} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7264} Para los Hanafis afeitarse el bigote es una sunna; para los Malikis se recorta, no se afeita; para los Shafiis afeitarlo es desaconsejable; para los Hanbalis recortar o recortar su borde es una sunna; afeitarse la barba está prohibido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7264} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7265} Una persona en ihram no puede afeitarse la cabeza ni la de otra persona hasta que ambas hayan terminado el rito. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7265} Afeitarse o cortarse el pelo para salir del ihram es un rito para los hanafíes, los malikíes, la visión shafií más autorizada y la escuela hanbalí, y una mera liberación de una prohibición para algunos shafiíes y ahmad en un informe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7265} Afeitarse toda la cabeza es suficiente por acuerdo; los hanafíes aceptan un cuarto de la cabeza con desagrado; los shafiíes aceptan tres cabellos; Los malikíes y los hanbalíes rechazan afeitar parte de la cabeza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7266} Una mujer se corta en lugar de afeitarse para salir del ihram. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7265} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7266} Afeitarse el vello púbico es recomendable para los hombres como parte de la práctica natural, y afeitarse la axila está permitido para quien encuentra difícil depilarse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7267} La mayoría de los juristas recomiendan afeitar la cabeza de un converso; los hanafíes y los hanbalíes prohíben afeitar la cabeza de una persona muerta, a los malikíes no les gusta, y los shafiíes en la opinión más sólida no la afeitan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7268} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7269} La palabra también nombra la garganta, a la que se asocian las reglas sobre el ayuno y la lactancia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7269} La entrada se cierra en la siguiente palabra clave, halla ⁦(حلّ)⁩, en la página 7270."
  fr: "Halq signifie littéralement enlever les poils et désigne également la gorge; istihdad désigne le rasage du pubis et naf't l'épilation à la racine. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7261} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7262} Pour les Hanafites, la sunna concernant la tête d'un homme est de se raser la tête ou de se faire une raie; pour les Malikites, se raser la tête est une innovation permise en dehors de l'état d'ihram; pour les Chafiites, cela ne présente aucun inconvénient pour des raisons de propreté; Ahmad rapporte deux hadiths qui le déconseillent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7262} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7263} Se raser une partie de la tête (qaza') est déconseillé. Selon les écoles hanafite et malikite, une femme ne peut se raser la tête qu'en cas de nécessité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7263} La plupart des juristes recommandent de raser la tête d'un nouveau-né le septième jour et de donner en aumône l'équivalent du poids des cheveux en argent; les hanbalites ne rasent pas les cheveux des filles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7263} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7264} Pour les hanafites, se raser la moustache est une sunna; pour les malikites, elle est taillée et non rasée; pour les chaféites, se raser la moustache est déconseillé; pour les hanbalites, tailler ou couper les bords de la moustache est une sunna; se raser la barbe est interdit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7264} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7265} Une personne en état d'ihram ne peut se raser la tête ni celle d'autrui avant que les deux n'aient accompli le rite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7265} Se raser ou se couper les cheveux pour sortir de l'ihram est un rite pour les hanafites, les malikites, l'école chaféite (plus autorisée) et l'école hanbalite, et une simple levée d'une interdiction pour certains chaféites et Ahmad, selon un hadith. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7265} Se raser la tête entière suffit par consensus; les hanafites acceptent un quart de la tête avec réticence; les chaféites acceptent trois cheveux. Les Malikites et les Hanbalites rejettent le rasage partiel de la tête. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7266} Une femme se coupe les cheveux plutôt que de se raser la tête pour sortir de l'ihram. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7265} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7266} Le rasage des poils pubiens est recommandé aux hommes, conformément à la pratique courante, et le rasage des aisselles est permis à celui qui a des difficultés à s'épiler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7267} La plupart des juristes recommandent de raser la tête d'un converti; les Hanafites et les Hanbalites interdisent de raser la tête d'un défunt, les Malikites y sont réticents, et les Chafiites, dans leur avis le plus solide, ne le font pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7268} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7269} Ce mot désigne également la gorge, à laquelle sont rattachées les règles relatives au jeûne et à l'allaitement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7269} L'entrée se termine au mot-clé suivant, halla ⁦(حلّ)⁩, à la page 7270."
  tr: "Boğaz, tüy alma dilidir, 'halqum' olarak da adlandırılır, 'istihdad' ise kasık bölgesinin tıraş edilmesi ve köklerinden tüylerin koparılması anlamına gelir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7261} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7262} Hanafiler, bir erkeğin saçının sünnetinin tıraş olmak ya da tıraş olmak olduğuna inanır. Malikiler başın tıraş edilmesini, ihramdan kurtulmamışlar için yasak olmayan bir yenilik olarak kabul ederler. Şafiiler ise bunun arınma için caiz olduğuna inanır. Ahmad'ın iki rivayeti hoşlanmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7262} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7263} Başın bir kısmının tıraş edilmesi ama diğerinin tıraş edilmemesi hoş karşılanmaz; Hanafi ve Malikilere göre bir kadın ancak zorunluluktan kafasını tıraş etmelidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7263} Çoğu hukukçuya göre, yenidoğanın başının yedinci gün tıraş edilmesi ve saçının ağırlığına eşit sadaka olarak gümüş olarak verilmesi tavsiye edilir. Hanbaliler, yenidoğanın saçının tıraş edilmemesi gerektiğini savunur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7263} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7264} Hanefilere göre bıyığı tıraş etmek sünnettir, Malikilere göre tıraş edilmez ama tıraş edilmez, Şafiilere göre tıraş olmak sevilmez ve hanbalilere göre tıraş etmek veya uçları kesmek sünnettir; sakalı tıraş etmek yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7264} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7265} Hacının ritüelini tamamlayana kadar kendi başını veya başkasının başını tıraş etmesi yasaktır. {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.. 7265} Hanefiler, Malikiler ve Şafiilere göre en belirgin görüşlere göre tıraş veya kısaltma bir ritüeldir; Haneliler ise düşünce okulunda bunun genel olarak yasak olduğunu söyler. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7265} Tüm başın tıraş edilmesi konsensüsle yeterlidir; Hanefilere göre, sevilmeyenler için başın dörtte biri yeterlidir; Şafiilere göre üç tüy; ve Maliki ile Hanelilere göre başın bir kısmını tıraş etmek yeterli değildir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7266} Bir kadın saçını kısaltır ancak yasadışı arınma için tıraş etmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7265} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7266} Bir erkeğin kasık bölgesini tıraş etmesi önerilir çünkü bu doğaldır ve sert burnu olan biri için koltuk altını tıraş etmek caizdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7267} Çoğunluğa göre, gayrimüslimlerin kafasını tıraş etmek önerilir, ancak Hanafi ve Hanbalilere göre ölen kişinin başını tıraş etmek yasaktır, ancak Malikiler tarafından sevilmez ve en doğru görüşe göre tıraş Şafiilere göre yapılmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7268} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7269} Dilde 'halqum' (boğaz) olarak adlandırılır ve oruç, emzirme ve diğer kurallarla ilgilidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7269} ve giriş şu başlıkla sona erer: 'Çözüm', s. 7270'te."
  id: "Tenggorokan adalah bahasa penghilangan bulu, juga disebut 'halqum', 'istihdad' berarti mencukur area kemaluan, dan mencabut rambut dari akarnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7261} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7262} Kaum Hanafi percaya bahwa Sunnah untuk rambut pria adalah mencukur atau mencukur. Kaum Malik menganggap mencukur kepala sebagai inovasi yang tidak dilarang bagi mereka yang belum dibebaskan dari ihram. Para Syafi'i percaya bahwa itu diperbolehkan untuk penyucian. Ahmad memiliki dua riwayat yang tidak disukai. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7262} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7263} Tidak disukai mencukur sebagian kepala tetapi tidak yang lain, dan seorang wanita tidak boleh mencukur kepala kecuali karena kebutuhan, menurut Hanafi dan Maliki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7263} Menurut mayoritas ahli hukum, disarankan untuk mencukur kepala bayi baru lahir pada hari ketujuh dan memberikan amal setara dengan berat rambutnya seperti perak. Para Hanbal berpendapat bahwa rambut bayi baru lahir tidak boleh dicukur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7263} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7264} Mencukur kumis adalah Sunnah menurut Hanafi, menurut Maliki kumis dipotong tapi tidak dicukur, menurut Shafi'i tidak suka mencukur, dan menurut Hanbali, Sunnah untuk mencukur atau memangkas ujung jenggot; mencukur jenggot dilarang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7264} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7265} Dilarang bagi peziarah untuk mencukur kepala atau kepala orang lain sampai selesai melakukan ritualnya. {cite:fiqh-mawsua-Kuwaitiyya-noor-v3 hlm. 7265} Mencukur atau memendekkan untuk melonggarkan adalah ritual menurut Hanafi, Maliki, dan Shafi'i menurut pendapat yang paling jelas, sementara Hanbalis dalam aliran pemikiran, sementara beberapa Shafi'i dan Ahmad mengatakan hal itu umumnya dilarang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7265} Mencukur seluruh kepala sudah cukup berdasarkan konsensus; menurut Hanafi, seperempat kepala sudah cukup jika tidak disukai; menurut Shafi'i, tiga helai rambut; dan menurut Malikis dan Hanbali, mencukur sebagian kepala tidak cukup. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7266} Seorang wanita memendekkan rambutnya tetapi tidak mencukur demi penyucian yang tidak sah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7265} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7266} Disarankan bagi pria untuk mencukur area kemaluan karena itu alami, dan diperbolehkan mencukur ketiak bagi seseorang yang memiliki hidung keras. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7267} Menurut mayoritas, mencukur kepala non-Muslim dianjurkan, tetapi menurut Hanafi dan Hanbali, mencukur kepala orang yang telah meninggal dilarang, tetapi tidak disukai oleh Maliki, dan menurut pendapat yang paling benar, mencukur tidak dilakukan menurut Sy'i'i. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7268} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7269} Dalam bahasa ini, 'halqum' disebut 'halqum' (tenggorokan), dan berkaitan dengan aturan tentang puasa, menyusui, dan lainnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7269} dan entri ini diakhiri dengan judul berikut: 'Solusi' pada hlm. 7270."
