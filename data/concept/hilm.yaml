summary:
  ar: "الحلم في درس الشيخ عمر عبد الكافي صفة لله قبل أن يكون خلقا للعبد: فالله حليم لا يعجل بالعقوبة حتى على المجرمين، ويدعو الشيخ المسلم إلى أن يتحلم مع الناس. ومن أمثلته عنده رجل من العرب استُفز في رهان فبقي ساكنا (needs_source). {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep06 00:49:30}"
  en: "In Sheikh Omar Abdelkafy's lessons, forbearance is first a quality of God: He is forbearing and does not hasten punishment even for criminals. He urges the believer to be forbearing with people, and gives as an example an Arab who stayed calm when a wager was set to provoke him (needs_source). {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep06 00:49:30}"
  ur: "شیخ عمر عبدالکافی کے درسوں میں حلم پہلے اللہ کی صفت ہے: وہ حلیم ہے اور مجرموں پر بھی سزا میں جلدی نہیں کرتا۔ وہ مومن کو لوگوں کے ساتھ حلم اختیار کرنے کی دعوت دیتے ہیں، اور ایک عرب کی مثال دیتے ہیں جو شرط کے ذریعے اشتعال دلائے جانے پر پرسکون رہا (needs_source)۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep06 00:49:30}"
  es: "En las enseñanzas del jeque Omar Abdelkafy, la paciencia es, ante todo, una cualidad de Dios: Él es indulgente y no apresura el castigo, ni siquiera para los criminales. Exhorta al creyente a ser paciente con los demás y pone como ejemplo a un árabe que mantuvo la calma cuando se propuso una apuesta para provocarlo (needs_source). {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep06 00:49:30}"
  fr: "Dans les enseignements du cheikh Omar Abdelkafy, la patience est avant tout une qualité divine: Il est patient et ne hâte pas le châtiment, même pour les criminels. Il exhorte le croyant à la patience envers autrui et cite l’exemple d’un Arabe qui resta calme lorsqu’un pari fut proposé pour le provoquer (source nécessaire). {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep06 00:49:30}"
  tr: "Şeyh Ömer Abdul Kafi'nin dersindeki sabır, Allah'ın bir özelliğidir, o bir hizmetten yaratılmıştır: Allah sabırlıdır ve suçlular için bile cezayı hızlandırmaz; Müslüman şeyhi insanlara karşı sabırlı olmaya çağırır. Bunun bir örneği, onunla bir bahse giren ve sessiz kalan bir Arap adamıdır (needs_source). {cite:assabile-omar-abdelkafy tafsir-al-kuran-al-kareem/ep06 00:49:30}"
  id: "Kesabaran dalam pelajaran Sheikh Omar Abdul Kafi adalah sifat Tuhan sebelum Dia menjadi ciptaan seorang hamba: Tuhan itu pemaaf dan tidak mempercepat hukuman bahkan bagi penjahat, dan Dia memanggil sheikh Muslim untuk bersabar dengan orang lain. Contohnya adalah seorang pria Arab yang diprovokasi oleh taruhan dan tetap diam (needs_source). {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep06 00:49:30}"
