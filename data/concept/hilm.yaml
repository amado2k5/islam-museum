label:
  ar: "الحلم"
  en: "Forbearance (hilm)"
  ur: "حلم"
summary:
  ar: "الحلم في درس الشيخ عمر عبد الكافي صفة لله قبل أن يكون خلقا للعبد: فالله حليم لا يعجل بالعقوبة حتى على المجرمين، ويدعو الشيخ المسلم إلى أن يتحلم مع الناس. ومن أمثلته عنده رجل من العرب استُفز في رهان فبقي ساكنا (needs_source). {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep06 00:49:30}"
  en: "In Sheikh Omar Abdelkafy's lessons, forbearance is first a quality of God: He is forbearing and does not hasten punishment even for criminals. He urges the believer to be forbearing with people, and gives as an example an Arab who stayed calm when a wager was set to provoke him (needs_source). {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep06 00:49:30}"
  ur: "شیخ عمر عبدالکافی کے درسوں میں حلم پہلے اللہ کی صفت ہے: وہ حلیم ہے اور مجرموں پر بھی سزا میں جلدی نہیں کرتا۔ وہ مومن کو لوگوں کے ساتھ حلم اختیار کرنے کی دعوت دیتے ہیں، اور ایک عرب کی مثال دیتے ہیں جو شرط کے ذریعے اشتعال دلائے جانے پر پرسکون رہا (needs_source)۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep06 00:49:30}"
