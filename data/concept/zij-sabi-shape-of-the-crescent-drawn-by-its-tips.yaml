label: { ar: "شكل الهلال ومنظره بحسب طرفيه", en: "The shape of the crescent and its look according to its tips", ur: "طرفین کے مطابق ہلال کی شکل اور منظر", es: "La forma de la media luna y su aspecto según sus puntas.", fr: "La forme du croissant et son aspect selon ses pointes", tr: "Hilalin şekli ve görünümü, iki ucuna göre", id: "Bentuk dan penampakan bulan sabit menurut kedua ujungnya" }
summary:
  ar: "يصف البتاني رسم الهلال على الحالة التي يُرى عليها من اعتدال طرفيه وميلهما عن نطاق البروج، ومقدار ما فيه من الضوء، فيرسم دائرة القمر وقطعة الضوء فيها بحسب البُعد عن الشمس بالأجزاء، ويُعرف ميل الطرفين على خط الاعتدال. {cite:zij-sabi-nallino-byblion p.135}."
  en: "Al-Battani describes how to draw the crescent as it is seen: the evenness of its two tips, their tilt from the zodiac belt, and the amount of light. One draws the Moon's circle and the lit part within it according to the distance from the Sun in parts, and finds the tilt of the two tips against the line of equinox. {cite:zij-sabi-nallino-byblion p.135}."
  ur: "البتانی بیان کرتے ہیں کہ ہلال کو کس طرح بنایا جائے جیسا وہ نظر آتا ہے: اس کے دونوں طرفین کا اعتدال، بروجی پٹی سے ان کا میل، اور روشنی کی مقدار۔ چاند کا دائرہ اور اس میں روشن حصہ سورج کے فاصلے کے اجزاء کے مطابق کھینچا جاتا ہے، اور دونوں طرفوں کا میل خطِ اعتدال کے مقابل معلوم کیا جاتا ہے۔ {cite:zij-sabi-nallino-byblion p.135}۔"
  es: "Al-Battani describe cómo dibujar la luna creciente tal como se ve: la simetría de sus dos puntas, su inclinación con respecto al cinturón zodiacal y la cantidad de luz. Se dibuja el círculo de la Luna y la parte iluminada dentro de él según la distancia al Sol en partes, y se halla la inclinación de las dos puntas con respecto a la línea del equinoccio. {cite:zij-sabi-nallino-byblion p.135}."
  fr: "Al-Battani décrit comment dessiner le croissant de lune tel qu'on le voit: l'égalisation de ses deux extrémités, leur inclinaison par rapport à la ceinture zodiacale et la quantité de lumière. On trace le cercle lunaire et la partie éclairée à l'intérieur en fonction de la distance au Soleil, et on détermine l'inclinaison des deux extrémités par rapport à la ligne de l'équinoxe. {cite:zij-sabi-nallino-byblion p.135}."
  tr: "El-Battani, hilalin çizimini, ekinokslardaki görünür durumuna ve ekliptiğe göre eğimine, ayrıca içerdiği ışık miktarına dayanarak tanımlar. Ayın çemberini ve içindeki ışık miktarını, güneşe olan uzaklığına göre parçalar halinde çizer ve uçlarının ekinoks çizgisine göre eğimini belirler. {cite:zij-sabi-nallino-byblion s.135}."
  id: "Al-Battani menjelaskan cara menggambar bulan sabit berdasarkan keadaan tampak bulan pada saat ekuinoks dan kemiringannya relatif terhadap ekliptika, serta jumlah cahaya yang dikandungnya. Ia menggambar lingkaran bulan dan bagian cahaya di dalamnya sesuai dengan jaraknya dari matahari dalam beberapa bagian, dan menentukan kemiringan ujung-ujungnya relatif terhadap garis ekuinoks. {cite:zij-sabi-nallino-byblion p.135}."
