label: { ar: "شكل الهلال ومنظره بحسب طرفيه", en: "The shape of the crescent and its look according to its tips", ur: "طرفین کے مطابق ہلال کی شکل اور منظر" }
summary:
  ar: "يصف البتاني رسم الهلال على الحالة التي يُرى عليها من اعتدال طرفيه وميلهما عن نطاق البروج، ومقدار ما فيه من الضوء، فيرسم دائرة القمر وقطعة الضوء فيها بحسب البُعد عن الشمس بالأجزاء، ويُعرف ميل الطرفين على خط الاعتدال. {cite:zij-sabi-nallino-byblion p.135}."
  en: "Al-Battani describes how to draw the crescent as it is seen: the evenness of its two tips, their tilt from the zodiac belt, and the amount of light. One draws the Moon's circle and the lit part within it according to the distance from the Sun in parts, and finds the tilt of the two tips against the line of equinox. {cite:zij-sabi-nallino-byblion p.135}."
  ur: "البتانی بیان کرتے ہیں کہ ہلال کو کس طرح بنایا جائے جیسا وہ نظر آتا ہے: اس کے دونوں طرفین کا اعتدال، بروجی پٹی سے ان کا میل، اور روشنی کی مقدار۔ چاند کا دائرہ اور اس میں روشن حصہ سورج کے فاصلے کے اجزاء کے مطابق کھینچا جاتا ہے، اور دونوں طرفوں کا میل خطِ اعتدال کے مقابل معلوم کیا جاتا ہے۔ {cite:zij-sabi-nallino-byblion p.135}۔"
