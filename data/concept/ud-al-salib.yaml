summary:
  ar: "عود الصليب في الكتاب نبات ينقل عن ديسقوريدوس وصفه ذكرا وأنثى، ينفع من الكابوس ولذع المعدة وأوجاع البطن والكلى والمثانة واليرقان وحصى الصبيان، ويذكر الكتاب فيه منافع لنزف الرحم ولمن لم تستنظف من النفاس {cite:canon-ibn-sina-print-v1 p.623}"
  en: "Ud al-salib is in the book a plant whose male and female kinds are described from Dioscorides; it benefits nightmare, burning of the stomach, pains of the belly, kidneys and bladder, jaundice and the stones of children, and the book lists uses for bleeding of the womb and for women not yet cleansed after childbirth {cite:canon-ibn-sina-print-v1 p.623}"
  ur: "عود الصلیب کتاب میں ایک پودا ہے جس کی نر اور مادہ قسموں کا وصف دیسقوریدوس سے نقل ہے؛ کابوس، معدے کی جلن، پیٹ، گردوں اور مثانے کے دردوں، یرقان اور بچوں کی پتھری میں نافع ہے، اور کتاب اس کے رحم کے خون بہنے اور نفاس کے بعد صفائی نہ پانے والی عورتوں کے لیے فوائد بھی بتاتی ہے {cite:canon-ibn-sina-print-v1 p.623}۔"
