id: concept/tacyin-specification
class: concept
kind: legal
label:
  ar: التعيين
  en: Ta'yin (specification of an object, intention or term)
  ur: تعیین ⁦(کسی چیز کو متعین کرنا)⁩
  es: "Ta'yin (especificación de un objeto, intención o término)"
  fr: "Ta'yin (spécification d'un objet, d'une intention ou d'un terme)"
  tr: "Atama"
  id: "Pengangkatan"
summary:
  ar: 'التعيين لغة تخصيص الشيء من بين أمثاله، واصطلاحا جعل الشيء متميزا عن غيره بحيث لا يشاركه سواه، ويضاده الإبهام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5553} والتعيين عند الأصوليين يقابل التخيير في الواجب، فالواجب المعين كصلاة الظهر، والمبهم بين أقسام محصورة كخصال كفارة اليمين، وأنكرت المعتزلة الواجب المخير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5553} ويجب في الصلاة الفرض تعيين نيتها ظهرا أو عصرا، وفي السنن ذوات الوقت أو السبب خلاف. ويجب على المأموم نية الاقتداء دون تعيين الإمام، وعند الحنفية إن عينه فأخطأ بطلت صلاته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5553} ويجب تعيين النية في صوم رمضان والقضاء والكفارة والنذر عند الجمهور، وقال الحنفية ومعهم رواية عن أحمد إن مطلق النية يكفي في رمضان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5554} وفي البيع يتعين الواحد من النقدين الغالب في البلد، فإن تعددت النقود غير الغالبة اشترط تعيينها لفظا، وإن تساوت صح بغير تعيين. وكذلك يجب تعيين الأجل في السلم، وعند الجمهور مكان الوفاء إذا كان فيه مؤونة، ويتعين مكان العقد عرفا إذا لم تكن مؤونة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5554} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5555} ويشترط لصحة البيع معلومية المبيع والثمن، فلا يصح بيع شاة من قطيع، ولا بيع بالقيمة أو بحكم فلان، والحنفية يعدون ذلك من الفاسد الذي يصح في المجلس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5555} وفي تعيين الدراهم والدنانير بالتعيين في العقد: الشافعية والحنابلة يقولون تتعين، والحنفية والمالكية لا تتعين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5555} وخيار التعيين عند الحنفية: أن يشتري أحد ثوبين أو أحد ثلاثة على أن يختار المشتري أيها شاء، ولا يجوز على أربعة، ويشترط النص عليه. ويرى الشافعية والحنابلة أن البيع بهذه الصورة باطل للجهالة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5555} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5556} ولا يجوز تعيين المسلم فيه، بل يكون دينا في الذمة، لأن السلم في عين يهدد بالتلف قبل التسليم، ولا يجوز السلم في ثمرة بستان بعينه، ومنه حديث ابن سلام في بني قينقاع، وقد نقل ابن المنذر الإجماع على بطلانه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5556} وفي الوكالة يتقيد الوكيل بالمعين إذا كان للموكل غرض فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5557} وفي الإجارة يجب تعيين نوع المنفعة والمدة، وأجاز بعض فقهاء السلف إجارة المجهولات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5557} وفي الطلاق لو قال: إحداكما طالق ونوى واحدة بعينها طلقت، ويلزمه التعيين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5557} وفي الدعوى يجب تعيين المدعى به: في العين الذكورة والأنوثة والسن واللون والنوع، وفي النقد الجنس والنوع والقدر والوصف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5557}'
  en: 'Ta''yin (specification) is in language singling out a thing from its like, and in law making a thing distinct so that nothing shares it; its opposite is ibham (vagueness). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5553} In the usulis'' usage it contrasts with choice among obligations: a specified obligation such as the noon prayer, and a vague one among a set number of options, such as the expiations for an oath; the Mu''tazila denied an obligation of choice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5553} A compulsory prayer must be named in intention as noon or afternoon; the follower must intend to follow an imam but need not name him, and for the Hanafis a wrongly named imam invalidates the prayer. Naming the optional prayers is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5553} Most jurists require the fast of Ramadan, a make-up fast, an expiation or a vow to be named in intention; the Hanafis and one Hanbali view allow a general intention for Ramadan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5554} In a sale, the currency most common in the town is taken as specified when one prevails; when several prevail, the currency must be named in words; when they are equal, the sale is valid without naming. The term must be named in a salam, and most jurists require the place of delivery when it has burden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5554} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5555} A sale needs a known object and known price: a sheep from a flock, or a price by value, by another''s ruling, or at what people sell, is not valid, and the Hanafis count this as defective but correctable at the session. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5555} On whether a specified coin is bound by specification in the contract, the Shafiis and Hanbalis say yes, the Hanafis and Malikis say no. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5555} The Hanafi option of specification: one buys one of two or three garments, the buyer choosing later; four are not allowed, and the contract must say so. The Shafiis and Hanbalis void such a sale for uncertainty. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5555} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5556} The salam object may not be specified but must be a debt, since a specified object may perish before delivery; a salam in the fruit of a named orchard is void, as Ibn al-Mundhir reports the consensus, following the report about the Jews of Banu Qaynuqa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5556} An agent bound to a named buyer or a named time or place must keep to it, unless the principal had no interest in it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5557} A lease must specify the kind of benefit and its term; some early jurists allowed leasing unknowns. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5557} If a man says one of my two wives is divorced and intends one, that wife is divorced, and he must specify. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5557} A claim must specify the thing claimed: an animal''s sex, age, colour and kind, or a sum''s kind, quantity and description. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5557}'
  ur: 'تعیین لغت میں کسی چیز کو اس کے ہم جنسوں میں سے الگ کرنے کو کہتے ہیں، اور اصطلاح میں کسی چیز کو دوسرے سے ممتاز کرنا تاکہ اس میں کوئی شریک نہ ہو؛ اس کی ضد ابہام ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5553} اصولیین کے ہاں تعیین واجب تخییری کے مقابل ہے: معین واجب جیسے ظہر کی نماز، اور مبہم جو محدود اقسام میں ہو جیسے قسم کے کفارے کی خصلتیں؛ معتزلہ نے واجب تخییری کا انکار کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5553} فرض نماز میں نیت میں ظہر یا عصر متعین کرنا لازم ہے، مقتدی پر امام کی اقتداء کی نیت لازم ہے مگر امام کا نام لینا لازم نہیں، اور حنفیہ کے نزدیک نام لے کر غلطی ہو تو نماز باطل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5553} جمہور کے نزدیک رمضان، قضا، کفارہ اور نذر کے روزے میں نیت کی تعیین واجب ہے، جبکہ حنفیہ اور احمد کی ایک روایت کے مطابق رمضان میں مطلق نیت کافی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5554} بیع میں جب ایک ہی سکہ غالب ہو تو وہی متعین ہوتا ہے، اور متعدد سکے ہوں تو الفاظ میں تعیین ضروری ہے، اور مساوی ہوں تو بغیر تعیین بیع صحیح ہے۔ سلم میں مدت کی تعیین لازم ہے، اور جمہور کے نزدیک ادائیگی کی جگہ کی تعیین لازم ہے جب وہاں بوجھ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5554} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5555} بیع کے لیے مبیع اور ثمن کا معلوم ہونا شرط ہے؛ ریوڑ میں سے ایک بکری یا قیمت کسی اور کے فیصلے پر رکھنا درست نہیں، اور حنفیہ اسے فاسد کہتے ہیں جو مجلس میں درست ہو سکتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5555} عین کو تعیین سے متعین کرنا: شافعیہ اور حنابلہ کے نزدیک دراہم و دنانیر متعین ہو جاتے ہیں، حنفیہ اور مالکیہ کے نزدیک نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5555} حنفیہ کا خیار تعیین: دو یا تین کپڑوں میں سے ایک خریدا جائے اور خریدار بعد میں چنے، چار میں جائز نہیں، اور صراحت ضروری ہے؛ شافعیہ اور حنابلہ جہالت کی وجہ سے ایسی بیع باطل کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5555} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5556} سلم میں مسلم فیہ متعین نہیں بلکہ ذمہ کا دین ہونا چاہیے؛ کسی متعین باغ کے پھل میں سلم باطل ہے، اور ابن المنذر نے اس پر اجماع نقل کیا، بنو قینقاع کے یہودیوں کی روایت کے مطابق۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5556} وکیل معین خریدار یا معین وقت یا جگہ کا پابند ہے جب موکل کی غرض اس میں ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5557} اجارے میں منفعت کی نوعیت اور مدت متعین ہونی چاہیے، اور بعض سلف نے مجہول چیزوں کی اجارہ کی اجازت دی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5557} اگر کوئی کہے کہ تم میں سے ایک طلاق ہے اور کسی ایک کی نیت کرے تو وہی طلاق ہوگی، اور تعیین لازم ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5557} دعوے میں مدعا بہ متعین ہونا چاہیے: جانور کی جنس، عمر، رنگ اور نوع، اور نقد کی جنس، نوع، مقدار اور وصف۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5557}'
  es: "Ta'yin (especificación) es en el lenguaje distinguir una cosa de su semejante, y en la ley hacer una cosa distinta de modo que nada la comparta; su opuesto es ibham (vaguedad). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5553} En el uso de los usulis contrasta con la elección entre obligaciones: una obligación específica como la oración del mediodía, y una vaga entre un número determinado de opciones, como las expiaciones por un juramento; los Mu'tazila negaron una obligación de elección. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5553} Una oración obligatoria debe ser nombrada en la intención como mediodía o tarde; el seguidor debe tener la intención de seguir a un imán pero no necesita nombrarlo, y para los Hanafis un imán mal nombrado invalida la oración. La denominación de las oraciones opcionales es objeto de controversia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5553} La mayoría de los juristas exigen que el ayuno de Ramadán, un ayuno compensatorio, una expiación o un voto se mencionen en la intención; los hanafíes y una visión hanbalí permiten una intención general para Ramadán. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5554} En una venta, se toma la moneda más común en la ciudad según lo especificado cuando prevalece una; cuando prevalecen varias, la moneda debe nombrarse con palabras; cuando son iguales, la venta es válida sin nombrarla. El término debe mencionarse en un salam, y la mayoría de los juristas exigen el lugar de entrega cuando tiene carga. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5554} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5555} Una venta necesita un objeto conocido y un precio conocido: una oveja de un rebaño, o un precio por valor, por la decisión de otro, o al que la gente vende, no es válido, y los Hanafi lo consideran defectuoso pero corregible en la sesión. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5555} Sobre si una moneda específica está vinculada por la especificación en el contrato, los Shafii y Hanbali dicen que sí, los Hanafi y Maliki dicen que no. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5555} La opción Hanafi de especificación: uno compra una de dos o tres prendas, el comprador elige después; no se permiten cuatro, y el contrato debe decirlo. Los shafiíes y hanbalíes anulan tal venta por incertidumbre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5555} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5556} El objeto del salam no puede estar especificado, pero debe ser una deuda, ya que un objeto especificado puede perecer antes de la entrega; un salam en el fruto de un huerto nombrado es nulo, como informa Ibn al-Mundhir sobre el consenso, siguiendo el informe sobre los judíos de Banu Qaynuqa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5556} Un agente obligado a un comprador nombrado o a un tiempo o lugar nombrado debe cumplirlo, a menos que el principal no tuviera interés en ello. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5557} Un contrato de arrendamiento debe especificar el tipo de beneficio y su duración; algunos juristas antiguos permitieron arrendar lo desconocido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5557} Si un hombre dice que una de sus dos esposas está divorciada y pretende que otra lo esté, esa esposa está divorciada y debe especificarlo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5557} Una reclamación debe especificar la cosa reclamada: el sexo, la edad, el color y la especie de un animal, o el tipo, la cantidad y la descripción de una suma. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5557}"
  fr: "Le terme « ta'yin » (spécification) désigne, en langage, le fait de distinguer une chose de ses semblables, et, en droit, de rendre une chose unique et incomparable; son contraire est « ibham » (imprécision). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5553} Chez les usulis, il s'oppose au choix entre les obligations: une obligation spécifique, comme la prière de midi, et une obligation imprécise parmi un nombre défini d'options, comme les expiations pour un serment; les Mu'tazilites niaient l'existence d'une obligation de choix. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5553} Une prière obligatoire doit être intentionnellement nommée comme étant celle de midi ou de l'après-midi; le fidèle doit avoir l'intention de suivre un imam, mais n'est pas tenu de le nommer, et pour les Hanafites, un imam mal nommé invalide la prière. La question de la dénomination des prières surérogatoires est controversée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5553} La plupart des juristes exigent que le jeûne du Ramadan, un jeûne de rattrapage, une expiation ou un vœu soit nommé dans l'intention; les hanafites et une opinion hanbalite autorisent une intention générale pour le Ramadan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5554} Lors d'une vente, la monnaie la plus courante dans la ville est retenue si elle est unique; si plusieurs monnaies sont courantes, la monnaie doit être nommée; si elles sont égales, la vente est valable sans dénomination. Le terme doit être mentionné dans une salutation, et la plupart des juristes exigent le lieu de livraison lorsqu'il y a charge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5554} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5555} Une vente requiert un objet et un prix connus: un mouton d’un troupeau, un prix basé sur la valeur, sur une décision d’autrui ou sur les prix pratiqués, n’est pas valable. Les Hanafites considèrent cela comme un vice de forme, rectifiable toutefois lors de la session. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5555} Concernant la question de savoir si une pièce de monnaie spécifiée est liée par une spécification dans le contrat, les Shafi'ites et les Hanbalites répondent par l’affirmative, tandis que les Hanafites et les Malikites répondent par la négative. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5555} L’option hanafite de spécification: l’acheteur acquiert un vêtement parmi deux ou trois, le choix final lui revenant ultérieurement; quatre vêtements ne sont pas autorisés et le contrat doit le préciser. Les écoles chaféite et hanbalite invalident une telle vente pour cause d'incertitude. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5555} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5556} L'objet du salam ne peut être spécifié mais doit constituer une dette, car un objet spécifié peut périr avant sa livraison; un salam portant sur les fruits d'un verger nommé est nul, conformément au consensus rapporté par Ibn al-Mundhir, suivant le récit concernant les Juifs de Banu Qaynuqa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5556} Un mandataire lié à un acheteur nommé, à une date ou à un lieu précis doit respecter son engagement, sauf si le mandant n'y avait aucun intérêt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5557} Un bail doit préciser la nature du bénéfice et sa durée; certains juristes anciens autorisaient les baux portant sur des biens inconnus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5557} Si un homme déclare que l’une de ses deux épouses est divorcée et qu’il souhaite se remarier, cette épouse est considérée comme divorcée, et il doit le préciser. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5557} Une revendication doit préciser l’objet de la revendication: le sexe, l’âge, la couleur et l’espèce d’un animal, ou la nature, la quantité et la description d’une somme. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5557}"
  tr: "Dilsel olarak, adlandırma, bir şeyin eşdeğerleri arasında tanımlanmasıdır ve teknik olarak, bir şeyi diğerlerinden ayırır ki kimse onu paylaşmaz, karşıtı ise belirsizliktir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5553} usul bilginlerine göre, belirtmek yükümlülüklerde seçim yapmaya eşdeğerdir. Belirtilen yükümlülük, Dhuhr namazına benzer; belirsiz olan, yemin için kefaret gibi sınırlı kategorilere ayrılır. Mu'tazililer isteğe bağlı yükümlülüğü reddetti. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5553} Zorunlu namazlarda niyet öğle veya öğleden sonra belirtilmelidir, ancak Sünnetler arasında zaman veya akıl konusunda anlaşmazlık vardır. Takipçi, imam atamadan örneği takip etmeyi amaçlamalıdır, ancak Hanefi'ye göre, eğer tanımlarsa ve hata yaparsa, duası geçersiz sayılır. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.5553} Ramazan oruçunda niyet, çoğunluğa göre kaçırılmış oruçlar, kefaret ve yeminler şeklinde belirtilmelidir. Hanefiler, Ahmad'dan bir rivayetle birlikte, Ramazan'da mutlak niyetin yeterli olduğunu söylediler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5554} Satışlarda, ülkede iki para biriminden birinin çoğunluk olması gerekir. Birden fazla baskın olmayan para birimi varsa, bunların sözlü olarak belirtilmesi gerekir; eşitse belirtilmeden geçerlidir. Benzer şekilde, son tarih selamda belirtilmeli, çoğunluğa göre ise ödeme yeri şarttır. Hüküm yoksa sözleşme yeri gelenekseldir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5554} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5555} Satışın geçerliliği için satılan eşyanın ve fiyatın bilinmesi gerekir. Bir sürüden koyun satmak ya da değer veya falancının kararıyla satmak geçerli değildir. Hanafiler bunu bir toplantıda geçerli olan geçersiz olanlar arasında sayırlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5555} Dirhem ve dinarların sözleşmelerde belirtilmesiyle ilgili olarak: Şafiiler ve Hanbaliler bunların belirtildiğini söylerken, Hanafileri ve Malikiler belirtilmemiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5555} Hanafilere göre belirtme seçeneği, alıcının iki giysiden birini veya üç giysiden birini satın alabilir ve alıcı istediği kıyafeti seçebilir; dört tane almak yasaktır ve açık şart gereklidir. Şafi'ler ve Hanbaliler, bu şekilde satışın cehalet nedeniyle geçersiz olduğunu kabul eder. {cite:cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5555} {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.5556} Burada bir Müslüman belirtmek caiz değildir; aksine, belirli bir yerde barış, doğumdan önce zarar tehdidi yarattığı için borç borcudur ve belirli bir meyve bahçesinin meyvesi için selam ödemek caiz değildir. Örneğin, İbn Selam'ın Banu Qaynuka ile ilgili hadisi ve İbn al-Mundhir onun geçersizliği konusunda uzlaşı iletmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5556} Vekaletnamede, vekilin bir amacı varsa, temsilci atanan kişiye bağlıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5557} Kira sözleşmesinde, fayda türü ve süre belirtilmelidir ve bazı erken hukukçular bilinmeyen kadınların kiralanmasına izin vermiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5557} Boşanmada, biriniz boşanmış ve belirli bir niyetiniz boşanmış derse, şartname gereklidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5557} Davada davalı şu şekilde tanımlanmalıdır: gözde, erkeklikte, kadınlıkta, yaşta, renkte ve cinsiyette; eleştiride cinsiyet, cinsiyet, kader ve tanımda. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5557}"
  id: "Secara linguistik, penamaan adalah penentuan sesuatu di antara padanannya, dan secara teknis, penetapan membuat sesuatu berbeda dari yang lain sehingga tidak ada orang lain yang berbagi, dan kebalikannya adalah ambiguitas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5553} Menurut para ulama usul, menentukan setara dengan pilihan kewajiban. Kewajiban yang ditentukan mirip dengan shalat Dhuhr, dan ambiguitas dibagi menjadi kategori terbatas seperti penebusan sumpah. Mu'tazilites menolak kewajiban opsional tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5553} Dalam shalat wajib, niat harus ditentukan pada tengah hari atau sore, tetapi ada perbedaan pendapat di antara Sunnah dengan waktu atau akal. Pengikut harus berniat mengikuti contoh tanpa menunjuk imam, tetapi menurut Hanafi, jika ia mengidentifikasi dan melakukan kesalahan, doanya menjadi tidak sah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5553} Niat harus ditentukan dalam puasa Ramadan, mengganti puasa yang terlewat, penebusan, dan janji sesuai dengan mayoritas. Hanafi, bersama dengan narasi dari Ahmad, mengatakan bahwa niat mutlak sudah cukup dalam Ramadan. {cite:fiqh-mawsua-kuwaitiya-noor-v3 hlm.5554} Dalam penjualan, salah satu dari dua mata uang harus menjadi mayoritas di negara tersebut. Jika ada beberapa mata uang non-dominan, penentuan secara lisan diperlukan; jika sama, itu sah tanpa penjelasan. Demikian pula, tenggat waktu harus ditentukan dalam salam, dan menurut mayoritas, tempat pembayaran diperlukan jika ada ketentuan. Tempat kontrak adalah kebiasaan jika tidak ada ketentuan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5554} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5555} Untuk keabsahan penjualan, perlu diketahui barang yang dijual dan harganya. Tidak sah menjual domba dari kawanan, maupun menjualnya berdasarkan nilai atau keputusan si anu. Hanafi menganggap ini sebagai salah satu yang tidak sah dalam sebuah pertemuan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5555} Mengenai penetapan dirham dan dinar berdasarkan penunjukan dalam kontrak: Shafi'i dan Hanbal mengatakan bahwa domba tersebut ditentukan, sedangkan Hanafi dan Maliki tidak. {cite:fiqh-mawsua-Kuwaitiyya-noor-v3 hlm.. 5555} Pilihan untuk menentukan menurut Hanafi adalah pembeli dapat membeli salah satu dari dua pakaian atau salah satu dari tiga pakaian dengan pembeli memilih mana yang diinginkan; tidak diperbolehkan membeli empat, dan syarat eksplisit diperlukan. Syafi'i dan Hanbal berpendapat bahwa penjualan dengan cara ini tidak sah karena ketidaktahuan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5555} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5556} Tidak diperbolehkan mencantumkan Muslim dalam hal itu; melainkan itu adalah utang yang diwajibkan, karena perdamaian di suatu tempat mengancam kerusakan sebelum pengiriman, dan tidak diperbolehkan membayar salam atas buah kebun tertentu. Misalnya, hadits Ibn Salam mengenai Banu Qaynuqa, dan Ibn al-Mundhir menyampaikan konsensus tentang ketidakabsahannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5556} Dalam surat kuasa, agen terikat oleh yang ditunjuk jika prinsipal memiliki tujuan di dalamnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5557} Dalam sewa, jenis manfaat dan durasi harus ditentukan, dan beberapa ahli hukum awal mengizinkan menyewa wanita yang tidak dikenal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5557} Dalam perceraian, jika salah satu dari Anda mengatakan: salah satu dari Anda bercerai dan satu niat spesifik bercerai, maka spesifikasi diperlukan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5557} Dalam gugatan, tergugat harus diidentifikasi: dalam mata, maskulinitas, feminitas, usia, warna kulit, dan gender; dalam kritik, gender, gender, takdir, dan deskripsi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5557}"
