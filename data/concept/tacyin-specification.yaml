id: concept/tacyin-specification
class: concept
kind: legal
label:
  ar: التعيين
  en: Ta'yin (specification of an object, intention or term)
  ur: تعیین (کسی چیز کو متعین کرنا)
summary:
  ar: 'التعيين لغة تخصيص الشيء من بين أمثاله، واصطلاحا جعل الشيء متميزا عن غيره بحيث لا يشاركه سواه، ويضاده الإبهام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5553} والتعيين عند الأصوليين يقابل التخيير في الواجب، فالواجب المعين كصلاة الظهر، والمبهم بين أقسام محصورة كخصال كفارة اليمين، وأنكرت المعتزلة الواجب المخير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5553} ويجب في الصلاة الفرض تعيين نيتها ظهرا أو عصرا، وفي السنن ذوات الوقت أو السبب خلاف. ويجب على المأموم نية الاقتداء دون تعيين الإمام، وعند الحنفية إن عينه فأخطأ بطلت صلاته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5553} ويجب تعيين النية في صوم رمضان والقضاء والكفارة والنذر عند الجمهور، وقال الحنفية ومعهم رواية عن أحمد إن مطلق النية يكفي في رمضان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5554} وفي البيع يتعين الواحد من النقدين الغالب في البلد، فإن تعددت النقود غير الغالبة اشترط تعيينها لفظا، وإن تساوت صح بغير تعيين. وكذلك يجب تعيين الأجل في السلم، وعند الجمهور مكان الوفاء إذا كان فيه مؤونة، ويتعين مكان العقد عرفا إذا لم تكن مؤونة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5554} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5555} ويشترط لصحة البيع معلومية المبيع والثمن، فلا يصح بيع شاة من قطيع، ولا بيع بالقيمة أو بحكم فلان، والحنفية يعدون ذلك من الفاسد الذي يصح في المجلس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5555} وفي تعيين الدراهم والدنانير بالتعيين في العقد: الشافعية والحنابلة يقولون تتعين، والحنفية والمالكية لا تتعين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5555} وخيار التعيين عند الحنفية: أن يشتري أحد ثوبين أو أحد ثلاثة على أن يختار المشتري أيها شاء، ولا يجوز على أربعة، ويشترط النص عليه. ويرى الشافعية والحنابلة أن البيع بهذه الصورة باطل للجهالة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5555} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5556} ولا يجوز تعيين المسلم فيه، بل يكون دينا في الذمة، لأن السلم في عين يهدد بالتلف قبل التسليم، ولا يجوز السلم في ثمرة بستان بعينه، ومنه حديث ابن سلام في بني قينقاع، وقد نقل ابن المنذر الإجماع على بطلانه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5556} وفي الوكالة يتقيد الوكيل بالمعين إذا كان للموكل غرض فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5557} وفي الإجارة يجب تعيين نوع المنفعة والمدة، وأجاز بعض فقهاء السلف إجارة المجهولات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5557} وفي الطلاق لو قال: إحداكما طالق ونوى واحدة بعينها طلقت، ويلزمه التعيين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5557} وفي الدعوى يجب تعيين المدعى به: في العين الذكورة والأنوثة والسن واللون والنوع، وفي النقد الجنس والنوع والقدر والوصف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5557}'
  en: 'Ta''yin (specification) is in language singling out a thing from its like, and in law making a thing distinct so that nothing shares it; its opposite is ibham (vagueness). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5553} In the usulis'' usage it contrasts with choice among obligations: a specified obligation such as the noon prayer, and a vague one among a set number of options, such as the expiations for an oath; the Mu''tazila denied an obligation of choice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5553} A compulsory prayer must be named in intention as noon or afternoon; the follower must intend to follow an imam but need not name him, and for the Hanafis a wrongly named imam invalidates the prayer. Naming the optional prayers is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5553} Most jurists require the fast of Ramadan, a make-up fast, an expiation or a vow to be named in intention; the Hanafis and one Hanbali view allow a general intention for Ramadan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5554} In a sale, the currency most common in the town is taken as specified when one prevails; when several prevail, the currency must be named in words; when they are equal, the sale is valid without naming. The term must be named in a salam, and most jurists require the place of delivery when it has burden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5554} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5555} A sale needs a known object and known price: a sheep from a flock, or a price by value, by another''s ruling, or at what people sell, is not valid, and the Hanafis count this as defective but correctable at the session. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5555} On whether a specified coin is bound by specification in the contract, the Shafiis and Hanbalis say yes, the Hanafis and Malikis say no. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5555} The Hanafi option of specification: one buys one of two or three garments, the buyer choosing later; four are not allowed, and the contract must say so. The Shafiis and Hanbalis void such a sale for uncertainty. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5555} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5556} The salam object may not be specified but must be a debt, since a specified object may perish before delivery; a salam in the fruit of a named orchard is void, as Ibn al-Mundhir reports the consensus, following the report about the Jews of Banu Qaynuqa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5556} An agent bound to a named buyer or a named time or place must keep to it, unless the principal had no interest in it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5557} A lease must specify the kind of benefit and its term; some early jurists allowed leasing unknowns. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5557} If a man says one of my two wives is divorced and intends one, that wife is divorced, and he must specify. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5557} A claim must specify the thing claimed: an animal''s sex, age, colour and kind, or a sum''s kind, quantity and description. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5557}'
  ur: 'تعیین لغت میں کسی چیز کو اس کے ہم جنسوں میں سے الگ کرنے کو کہتے ہیں، اور اصطلاح میں کسی چیز کو دوسرے سے ممتاز کرنا تاکہ اس میں کوئی شریک نہ ہو؛ اس کی ضد ابہام ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5553} اصولیین کے ہاں تعیین واجب تخییری کے مقابل ہے: معین واجب جیسے ظہر کی نماز، اور مبہم جو محدود اقسام میں ہو جیسے قسم کے کفارے کی خصلتیں؛ معتزلہ نے واجب تخییری کا انکار کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5553} فرض نماز میں نیت میں ظہر یا عصر متعین کرنا لازم ہے، مقتدی پر امام کی اقتداء کی نیت لازم ہے مگر امام کا نام لینا لازم نہیں، اور حنفیہ کے نزدیک نام لے کر غلطی ہو تو نماز باطل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5553} جمہور کے نزدیک رمضان، قضا، کفارہ اور نذر کے روزے میں نیت کی تعیین واجب ہے، جبکہ حنفیہ اور احمد کی ایک روایت کے مطابق رمضان میں مطلق نیت کافی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5554} بیع میں جب ایک ہی سکہ غالب ہو تو وہی متعین ہوتا ہے، اور متعدد سکے ہوں تو الفاظ میں تعیین ضروری ہے، اور مساوی ہوں تو بغیر تعیین بیع صحیح ہے۔ سلم میں مدت کی تعیین لازم ہے، اور جمہور کے نزدیک ادائیگی کی جگہ کی تعیین لازم ہے جب وہاں بوجھ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5554} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5555} بیع کے لیے مبیع اور ثمن کا معلوم ہونا شرط ہے؛ ریوڑ میں سے ایک بکری یا قیمت کسی اور کے فیصلے پر رکھنا درست نہیں، اور حنفیہ اسے فاسد کہتے ہیں جو مجلس میں درست ہو سکتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5555} عین کو تعیین سے متعین کرنا: شافعیہ اور حنابلہ کے نزدیک دراہم و دنانیر متعین ہو جاتے ہیں، حنفیہ اور مالکیہ کے نزدیک نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5555} حنفیہ کا خیار تعیین: دو یا تین کپڑوں میں سے ایک خریدا جائے اور خریدار بعد میں چنے، چار میں جائز نہیں، اور صراحت ضروری ہے؛ شافعیہ اور حنابلہ جہالت کی وجہ سے ایسی بیع باطل کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5555} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5556} سلم میں مسلم فیہ متعین نہیں بلکہ ذمہ کا دین ہونا چاہیے؛ کسی متعین باغ کے پھل میں سلم باطل ہے، اور ابن المنذر نے اس پر اجماع نقل کیا، بنو قینقاع کے یہودیوں کی روایت کے مطابق۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5556} وکیل معین خریدار یا معین وقت یا جگہ کا پابند ہے جب موکل کی غرض اس میں ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5557} اجارے میں منفعت کی نوعیت اور مدت متعین ہونی چاہیے، اور بعض سلف نے مجہول چیزوں کی اجارہ کی اجازت دی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5557} اگر کوئی کہے کہ تم میں سے ایک طلاق ہے اور کسی ایک کی نیت کرے تو وہی طلاق ہوگی، اور تعیین لازم ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5557} دعوے میں مدعا بہ متعین ہونا چاہیے: جانور کی جنس، عمر، رنگ اور نوع، اور نقد کی جنس، نوع، مقدار اور وصف۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5557}'
