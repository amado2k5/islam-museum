label:
  ar: "مجالس العلم"
  en: "Study circles (majalis al-'ilm)"
  ur: "علمی مجالس"
summary:
  ar: "مجالس العلم حلقات يجتمع فيها الناس لتلقّي العلم الشرعي في المسجد أو غيره. ويرى الشيخ عمر عبد الكافي أن القلب لا يستغني عنها، لأن خطبة الجمعة وحدها لا تكفي لشحنه طوال الأسبوع، وأن الأشرطة والقنوات لا تغني عن حضورها."
  en: "Study circles are gatherings in which people come together to receive religious knowledge, in a mosque or elsewhere. Sheikh Omar Abdelkafy holds that the heart cannot do without them, since the Friday sermon alone is not enough to sustain it through the week, and that tapes and channels are no substitute for attending."
  ur: "علمی مجالس وہ حلقے ہیں جن میں لوگ مسجد یا کسی اور جگہ دینی علم حاصل کرنے کے لیے جمع ہوتے ہیں۔ شیخ عمر عبد الکافی کے نزدیک دل ان سے بے نیاز نہیں، کیونکہ صرف جمعہ کا خطبہ پورے ہفتے کے لیے کافی نہیں، اور کیسٹیں اور چینل ان میں حاضری کا بدل نہیں۔"
