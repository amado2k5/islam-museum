summary:
  ar: "الكلب في الحديث أهل الصيد والماشية والزرع، ونهى النبي عن ثمنه ومن اقتنى كلباً إلا كلب صيد أو ماشية أو حرث نقص من عمله كل يوم قيراطان، وأُبيح قتل الكلب العقور وهو محرم."
  en: "In the hadith the dog belongs to hunting, the herd and the field; the Prophet forbade its price, and whoever keeps a dog — except a hunting, herding or farm dog — loses two qirats of reward each day; the rabid dog may be killed even in ihram."
  ur: "حدیث میں کتا شکار، ریوڑ اور کھیت کا ساتھی ہے؛ نبی نے اس کی قیمت لینے سے منع فرمایا اور جو کتا رکھے سوائے شکاری، چرواہے یا کھیت کے اس کا اجر روزانہ دو قیراط گھٹتا ہے؛ پاگل کتے کا قتل احرام میں بھی جائز ہے۔"
