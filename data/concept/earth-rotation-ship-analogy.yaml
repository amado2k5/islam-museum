label: { ar: "مسألة حركة الأرض وتمثيل السفينة عند أهل الهيئة", en: "The earth's rotation and the ship analogy in Islamic astronomy", ur: "اہلِ ہیئت کے ہاں حرکتِ زمین اور کشتی کی تمثیل" }
summary:
  ar: "نقاش في كتب الهيئة من القرن الثالث عشر إلى السادس عشر، عند الكاتبي وقطب الدين الشيرازي والشريف الجرجاني وغرس الدين الحلبي، استُعمل فيه تمثيل السفينة وركابها لبحث الحركة العرضية وإمكان دوران الأرض على محورها، مع بقاء القول بسكونها في المركز {cite:heinen-islamic-cosmology p. 26} {cite:heinen-islamic-cosmology p. 27} {cite:heinen-islamic-cosmology p. 28}."
  en: "A discussion in astronomical works from the thirteenth to the sixteenth century — al-Katibi, Qutb al-Din al-Shirazi, al-Sharif al-Jurjani, Gars al-Din al-Halabi — using the analogy of a ship and its passengers to examine accidental motion and the possibility of the earth's daily rotation, while affirming its rest at the centre {cite:heinen-islamic-cosmology p. 26} {cite:heinen-islamic-cosmology p. 27} {cite:heinen-islamic-cosmology p. 28}."
  ur: "تیرہویں سے سولہویں صدی تک ہیئت کی کتابوں میں — کاتبی، قطب الدین شیرازی، شریف جرجانی، غرس الدین حلبی — کشتی اور مسافروں کی تمثیل سے عرضی حرکت اور زمین کی محوری گردش کے امکان کی بحث، جبکہ مرکز میں اس کے سکون کا قول برقرار رہا {cite:heinen-islamic-cosmology p. 27}."
