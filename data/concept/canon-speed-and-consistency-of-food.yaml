summary:
  ar: "يضيف ابن سينا إلى الكمية والكيفية فصلين في الغذاء، هما سرعة النفوذ أو بطؤه، وقوام الدم المتولد منه غليظاً متماسكاً أو رقيقاً سريع التحلل، ويبين متى يؤثر كل نوع ومتى يتوقى {cite:canon-ibn-sina-print-v1 p.268}."
  en: "Ibn Sina adds two further distinctions in food beyond amount and quality: how fast or slowly it penetrates, and the consistency of the blood it yields, thick and firm or thin and quickly dissolved, and he shows when each kind is preferred and when avoided {cite:canon-ibn-sina-print-v1 p.268}."
