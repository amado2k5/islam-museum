id: concept/canon-speed-and-consistency-of-food
class: concept
kind: scientific
label: { ar: "سرعة نفوذ الغذاء وقوام ما يتولد منه عند ابن سينا", en: "The speed and consistency of food in the Canon", ur: "غذا کی رفتار اور اس سے بننے والے خون کی غلظت قانون میں", es: "La velocidad y la consistencia de los alimentos en el Canon", fr: "La rapidité et la constance de la cuisson des aliments dans le Canon" }
summary:
  ar: "يضيف ابن سينا إلى الكمية والكيفية فصلين في الغذاء، هما سرعة النفوذ أو بطؤه، وقوام الدم المتولد منه غليظاً متماسكاً أو رقيقاً سريع التحلل، ويبين متى يؤثر كل نوع ومتى يتوقى {cite:canon-ibn-sina-print-v1 p.268}."
  en: "Ibn Sina adds two further distinctions in food beyond amount and quality: how fast or slowly it penetrates, and the consistency of the blood it yields, thick and firm or thin and quickly dissolved, and he shows when each kind is preferred and when avoided {cite:canon-ibn-sina-print-v1 p.268}."
  es: "Ibn Sina añade dos distinciones más en los alimentos, además de la cantidad y la calidad: la rapidez o lentitud con que penetran y la consistencia de la sangre que producen, espesa y firme o líquida y que se disuelve rápidamente, y muestra cuándo se prefiere cada tipo y cuándo se debe evitar {cite:canon-ibn-sina-print-v1 p.268}."
  fr: "Ibn Sina ajoute deux autres distinctions dans la nourriture au-delà de la quantité et de la qualité: la vitesse ou la lenteur de sa pénétration, et la consistance du sang qu'elle produit, épais et ferme ou fin et rapidement dissous, et il montre quand chaque type est préféré et quand il est évité {cite:canon-ibn-sina-print-v1 p.268}."
  ur: "ابن سینا خوراک میں مقدار اور معیار سے ہٹ کر دو مزید امتیازات کا اضافہ کرتا ہے: یہ کتنی تیزی سے یا آہستہ سے داخل ہوتا ہے، اور خون کی مستقل مزاجی، گاڑھا اور مضبوط یا پتلا اور جلدی تحلیل ہوتا ہے، اور وہ بتاتا ہے کہ کب ہر قسم کو ترجیح دی جاتی ہے اور کب پرہیز کیا جاتا ہے۔"
