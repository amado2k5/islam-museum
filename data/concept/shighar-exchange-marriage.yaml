label:
  ar: "الشِّغار"
  en: "Shighar (exchange marriage without a dower: its definition and the rulings of the four schools)"
summary:
  ar: "الشغار نكاح كان في الجاهلية، وهو أن يزوج الرجل وليته لآخر على أن يزوجه الآخر وليته، ويكون بضع كل منهما صداقا للأخرى دون مهر. ويختلف الفقهاء في حكمه: فالحنفية يصححون النكاح ويبطلون التسمية ويوجبون مهر المثل، والمالكية يفسخونه قبل البناء وبعده في صريحه، والشافعية والحنابلة يبطلونه في أصل صورته مع تفصيل في تسمية المهر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10098} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10099} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10100} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10102}"
  en: "Shighar was a marriage of the pre-Islamic period, in which a man gave his female dependent to another on condition that the other gave his own female dependent, with neither receiving a dower, each one's pudendum serving as the dower of the other. The four schools differ. The Hanafis hold the marriage valid, the condition void and the dower due at the level of a comparable dower. The Malikis annul the explicit form before and after consummation. The Shafi'is and Hanbalis void it in its basic form, with distinctions where a dower is named. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10098} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10099} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10100} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10102}"
