summary:
  ar: "يسمّي الفهرس صورة الغراب، ومن كواكبها ما في المنقار، ويذكر أنه قرب الهيدرا، أي الشجاع. لا تُنقل المواضع هنا. {cite:nallino-albatenii-opus-astronomicum pp.172}"
  en: "The catalogue names the figure al-Ghurab, the crow. One of its stars lies in the beak, which the list places near the Hydra, called ash-Shuja', the serpent. Positions are not transcribed here. {cite:nallino-albatenii-opus-astronomicum pp.172}"
  ur: "فہرست میں غراب کی صورت ہے، اور اس کا ایک ستارہ چونچ میں ہے جو ہائیڈرا، یعنی الشجاع کے قریب بتایا گیا ہے۔ مواضع یہاں نقل نہیں ہوئے۔ {cite:nallino-albatenii-opus-astronomicum pp.172}"
  es: "El catálogo denomina a la figura al-Ghurab, el cuervo. Una de sus estrellas se encuentra en el pico, que la lista sitúa cerca de la Hidra, llamada ash-Shuja', la serpiente. Las posiciones no se transcriben aquí. {cite:nallino-albatenii-opus-astronomicum pp.172}"
  fr: "Le catalogue nomme la figure al-Ghurab, le corbeau. L'une de ses étoiles se trouve dans son bec, que la liste place près de l'Hydre, appelée ash-Shuja', le serpent. Les positions ne sont pas transcrites ici. {cite:nallino-albatenii-opus-astronomicum pp.172}"
  tr: "Dizin, kuzgunun görüntüsünü adlandırır ve takımyıldızları arasında gagalı kuzgun takımyıldızını da belirtir; ayrıca Hydra'nın, yani cesur olanın yakınında olduğunu da söyler. Konumlar burada yazıya dökülmemiştir. {cite:nallino-albatenii-opus-astronomicum pp.172}"
  id: "Indeks tersebut menyebutkan gambar burung gagak, dan di antara rasi bintangnya terdapat rasi bintang paruh, dan menyebutkan bahwa burung gagak tersebut berada di dekat Hydra, yaitu, sang pemberani. Lokasi-lokasi tersebut tidak dicantumkan di sini. {cite:nallino-albatenii-opus-astronomicum pp.172}"
