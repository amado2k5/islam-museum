label:
  ar: "أسباب التشنج"
  en: "Causes of convulsion"
  fr: "Causes de la convulsion"
  ur: "تشنج کے اسباب"
  es: "Causas de las convulsiones"
  tr: "Spazm nedenleri"
  id: "Penyebab kejang"
summary:
  ar: "التشنج المادي قد يعرض كثيراً على سبيل انتقال من المادة كما يعرض عقيب الخوانيق وذات الجنب والسرسام؛ والذي ليس من مادة يعرض من حر وغلبة يبس فينتقص طولاً وعرضاً وينشوي، وقد يقع لشيء مؤذٍ ينفر عنه العصب ويجتمع لدفعه كوجع أو خلط حار لاذع أو كيفية سمية أو برد شديد {cite:canon-ibn-sina-print-v2 p.143}"
  en: "Material convulsion often occurs by way of transfer of the matter, as after the suffocating anginas, pleurisy and phrenitis; what is not of matter occurs from heat and prevailing dryness, so it shrinks in length and breadth and shrivels, and it may befall for a hurtful thing the nerve shrinks from and gathers to repel — a pain, a hot stinging humour, a poisonous quality, or severe cold {cite:canon-ibn-sina-print-v2 p.143}"
  fr: "La convulsion matérielle survient souvent par transfert de matière, comme après les angines suffocantes, la pleurésie et la phrénitis ; celle qui ne vient pas de matière naît de la chaleur et d’une sécheresse dominante, entraînant rétrécissement en longueur et en largeur et racornissement ; elle peut venir d’une chose nuisible que le nerf fuit en se contractant pour la repousser — douleur, humeur chaude et piquante, qualité toxique ou froid intense {cite:canon-ibn-sina-print-v2 p.143}"
  ur: "مادی تشنج اکثر مادے کی منتقلی کی صورت میں ہوتا ہے جیسا کہ خوانق، ذات الجنب اور سرسام کے بعد گزرتا ہے؛ اور جو مادے سے نہ ہو وہ حر اور غالبی یبس سے ہوتا ہے تو وہ طولاً اور عرضاً گھٹ جاتا ہے اور سوکھ جاتا ہے، اور وہ کسی ایسی تکلیف دہ چیز سے بھی واقع ہو سکتا ہے جس سے عصب بچنے اور اس کے دفع کے لیے جمع ہو، جیسے درد یا گرم لذع دار خلط یا سمی کیفیت یا سخت سردی {cite:canon-ibn-sina-print-v2 p.143}۔"
  es: "La convulsión material suele producirse por transferencia de materia, como después de las anginas asfixiantes, la pleuresía y la frenitis; lo que no es materia se produce por el calor y la sequedad predominante, por lo que se contrae en longitud y anchura y se arruga, y puede ocurrir por algo dañino que el nervio rechaza y contrae para repeler: un dolor, un humor caliente y urente, una sustancia tóxica o un frío intenso {cite:canon-ibn-sina-print-v2 p.143}"
  tr: "Fiziksel kramplar genellikle sincaplar, kukla ve girdap gibi malzemenin iletimiyle ortaya çıkabilir; bu, ısıya ve baskınlığa maruz kalan ve kuruyan bir maddeden kaynaklanmaz; bu madde uzunluk, genişlik ve kuruluğu azaltır. Ayrıca sinirin itip ittiği zararlı bir şeyle de karşılaşabilir; bu ağrı, sıcak ve keskin bir karışım ya da bir tür toksisite veya şiddetli soğuk {cite:canon-ibn-sina-print-v2 s.143}"
  id: "Kram fisik sering terjadi sebagai transmisi materi, seperti pada tupai, boneka, dan pusaran; yang bukan berasal dari zat yang terpapar panas dan dominasi yang mengering, mengurangi panjang, lebar, dan kekeringan. Mungkin juga terjadi pada sesuatu yang berbahaya bahwa saraf menolak dan bergabung untuk mendorongnya pergi sebagai rasa sakit, campuran panas dan tajam, atau bentuk toksisitas atau dingin parah {cite:canon-ibn-sina-print-v2 hlm.143}"
