tags: [arabiyya-browser, arabiyya-dialects]
label:
  ar: "لهجة الخليج"
  en: "The Gulf dialects"
  ur: "خلیجی بولیاں"
  fr: "Les dialectes du Golfe"
  es: "Los dialectos del Golfo"
summary:
  ar: "ما قُرئ عن كلام الخليج: ما تقوله دائرة المعارف البريطانية في مقالي قطر والبحرين عن العربية الخليجية والإنجليزية والفارسية، وما ينقله السيوطي في المزهر عن عبد القيس وأزد عُمان في البحرين وعن اللخلخانية في لغة أعراب الشحر وعُمان. ولم يُعثر على وصف لخصائص اللهجة الخليجية المعاصرة ولا على عدد متكلميها. وأضاف لاحقاً ملخص بحثي قُدّم إلى المتحف أقساماً عن التصنيف وأبرز الخصائص وأعداد المتكلمين؛ ولم يفتح المتحف الصفحات التي يستشهد بها."
  en: "What was read of the speech of the Gulf: what the Encyclopaedia Britannica says in its articles on Qatar and Bahrain of Gulf Arabic, English and Persian, and what al-Suyuti relays in al-Muzhir of Abd al-Qays and the Azd of Oman in Bahrain and of lakhlakhaniyya in the language of the Bedouin of al-Shihr and Oman. No description of the features of the contemporary Gulf dialect, and no count of its speakers, was found. A research summary supplied to the museum later added sections on classification, main features and speaker numbers; the museum did not open the pages it cites."
  ur: "خلیج کے کلام کے بارے میں جو پڑھا گیا: انسائیکلوپیڈیا برٹانیکا قطر اور بحرین کے اپنے مقالوں میں خلیجی عربی، انگریزی اور فارسی کے بارے میں کیا کہتا ہے، اور سیوطی المزہر میں بحرین میں عبد القیس اور ازد عمان کے بارے میں اور شحر اور عمان کے بدوؤں کی زبان میں لخلخانیہ کے بارے میں کیا نقل کرتے ہیں۔ آج کی خلیجی بولی کی خصوصیات کی کوئی توصیف اور اس کے بولنے والوں کی کوئی تعداد نہیں ملی۔ بعد میں عجائب گھر کو فراہم کردہ ایک تحقیقی خلاصے نے درجہ بندی، نمایاں خصوصیات اور بولنے والوں کی تعداد کے حصے شامل کیے؛ عجائب گھر نے اس کے حوالہ کردہ صفحات نہیں کھولے۔"
  fr: "Ce qui a été lu sur le parler du Golfe : ce que dit l'Encyclopaedia Britannica dans ses articles sur le Qatar et Bahreïn de l'arabe du Golfe, de l'anglais et du persan, et ce qu'al-Suyuti relaie dans al-Muzhir d'Abd al-Qays et des Azd d'Oman à Bahreïn et de la lakhlakhaniyya dans la langue des Bédouins d'al-Shihr et d'Oman. Aucune description des traits du dialecte du Golfe contemporain, ni aucun décompte de ses locuteurs, n'a été trouvée. Un dossier de recherche fourni au musée a ajouté ensuite des sections sur la classification, les principaux traits et le nombre de locuteurs ; le musée n'a pas ouvert les pages qu'il cite."
  es: "Lo que se leyó sobre el habla del Golfo: lo que dice la Encyclopaedia Britannica en sus artículos sobre Catar y Baréin acerca del árabe del Golfo, el inglés y el persa, y lo que al-Suyuti transmite en al-Muzhir sobre Abd al-Qays y los Azd de Omán en Baréin y sobre la lakhlakhaniyya en la lengua de los beduinos de al-Shihr y Omán. No se halló ninguna descripción de los rasgos del dialecto del Golfo contemporáneo ni un recuento de sus hablantes. Un archivo de investigación entregado al museo añadió después secciones sobre la clasificación, los rasgos principales y el número de hablantes; el museo no abrió las páginas que cita."
