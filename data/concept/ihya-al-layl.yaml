id: concept/ihya-al-layl
class: concept
kind: legal
label:
  ar: إحياء الليل
  en: Reviving the night (worship through the night)
summary:
  ar: إحياء الليل قضاؤه أو أكثره بالعبادة، والمستحب منه الدعاء والاستغفار في الأسحار، ويحيى الليل بالصلاة والذكر والقرآن، ويستحب إحياء الليالي المخصوصة كالعشر الأواخر من رمضان وليالي الأعياد، ويكره عند الشافعية والحنابلة إحياء الليل كله إلا في الليالي المخصوصة، وتكره عند بعض المذاهب الاجتماعات المتخذة لإحياء ليالي بعينها كنصف شعبان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1881} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1882} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1883} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1884} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1885} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1886} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1887}.
  en: Reviving the night means spending the night or most of it in worship, through prayer, remembrance and recitation; supplication and seeking forgiveness are best at dawn, and particular nights such as the last ten of Ramadan and the festival nights are recommended; the Shafi'is and Hanbalis dislike reviving the whole night except on those nights, and some schools dislike gatherings for particular nights such as the middle of Sha'ban. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1881} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1882} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1883} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1884} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1885} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1886} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1887}.
