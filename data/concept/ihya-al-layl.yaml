label:
  ar: إحياء الليل
  en: Reviving the night (worship through the night)
  es: "Reviviendo la noche (adoración durante la noche)"
  fr: "Raviver la nuit (adoration durant la nuit)"
  ur: "رات کو زندہ کرنا ⁦(رات بھر عبادت کرنا)⁩"
  tr: "Gece Uyanışı"
  id: "Kebangkitan Malam"
summary:
  ar: إحياء الليل قضاؤه أو أكثره بالعبادة، والمستحب منه الدعاء والاستغفار في الأسحار، ويحيى الليل بالصلاة والذكر والقرآن، ويستحب إحياء الليالي المخصوصة كالعشر الأواخر من رمضان وليالي الأعياد، ويكره عند الشافعية والحنابلة إحياء الليل كله إلا في الليالي المخصوصة، وتكره عند بعض المذاهب الاجتماعات المتخذة لإحياء ليالي بعينها كنصف شعبان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1881} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1882} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1883} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1884} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1885} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1886} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1887}.
  en: Reviving the night means spending the night or most of it in worship, through prayer, remembrance and recitation; supplication and seeking forgiveness are best at dawn, and particular nights such as the last ten of Ramadan and the festival nights are recommended; the Shafi'is and Hanbalis dislike reviving the whole night except on those nights, and some schools dislike gatherings for particular nights such as the middle of Sha'ban. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1881} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1882} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1883} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1884} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1885} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1886} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1887}.
  es: "Revivir la noche significa pasar la noche o la mayor parte de ella en adoración, a través de la oración, el recuerdo y la recitación; la súplica y la búsqueda del perdón son mejores al amanecer, y se recomiendan noches particulares como las últimas diez de Ramadán y las noches festivas; a los shafi'is y hanbalis no les gusta revivir toda la noche excepto en esas noches, y algunas escuelas no aprueban las reuniones para noches particulares como la mitad de Sha'ban. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1881} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1882} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1883} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1884} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1885} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1886} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1887}."
  fr: "Raviver la nuit signifie passer la nuit, ou la majeure partie d'entre elle, en adoration, par la prière, le souvenir et la récitation; les supplications et les demandes de pardon sont optimales à l'aube, et certaines nuits, comme les dix dernières du Ramadan et les nuits des fêtes, sont recommandées; les Shafi'ites et les Hanbalites n'apprécient pas de raviver toute la nuit en dehors de ces nuits-là, et certaines écoles n'aiment pas les rassemblements pour certaines nuits, comme le milieu du mois de Sha'ban. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1881} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1882} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1883} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1884} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1885} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1886} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1887}."
  ur: "رات کو زندہ کرنے کا مطلب ہے کہ رات یا اس کا زیادہ تر حصہ عبادت میں گزارنا، نماز، ذکر اور تلاوت کے ذریعے۔ فجر کے وقت دعا اور استغفار کرنا افضل ہے، اور خاص راتیں جیسے رمضان کے آخری عشرہ اور تہوار کی راتیں مستحب ہیں۔ شافعی اور حنبلی ان راتوں کے علاوہ پوری رات کو زندہ کرنا ناپسند کرتے ہیں، اور بعض مکاتب خاص راتوں جیسے کہ نصف شعبان کے لیے اجتماعات کو ناپسند کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1881} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1882} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1883} صفحہ 1884} {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 1885} {حوالہ:فقہ-موسوع کویتیہ-نور-v3 ص1886} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص1887}"
  tr: "Geceyi canlandırmak, çoğunlukla ibadet için geçirilmelidir. Şafak öncesi namazlarda dua etmek ve af dilemek önerilir. Ayrıca geceyi dua, anma ve Kur'an ile canlandırmak önerilir. Ramazan'ın son on gecesi ve bayram geceleri gibi belirli gecelerde tüm gece geçirmek önerilir. Şafi'ler ve Hanbalilere göre, belirlenmiş geceler dışında tüm gece geçirmek hoş karşılanmaz. Bazı düşünce okulları, Şaban ortası gibi belirli geceleri kutlamak için düzenlenen toplantılardan hoşlanmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1881} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1882} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1883} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1884} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1885} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1886} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1887}."
  id: "Menghidupkan kembali malam berarti menghabiskan sebagian besar waktu dalam ibadah. Disarankan untuk memohon dan memohon pengampunan selama salat sebelum fajar. Juga disarankan untuk menghidupkan kembali malam dengan doa, mengenang, dan Al-Qur'an. Disarankan untuk menghabiskan seluruh malam pada malam-malam tertentu seperti sepuluh malam terakhir Ramadan dan malam Idul Fitri. Menurut Syafi'i dan Hanbali, tidak disukai untuk menghabiskan seluruh malam kecuali pada malam-malam yang ditentukan. Beberapa aliran pemikiran tidak menyukai pertemuan yang diadakan untuk merayakan malam-malam tertentu, seperti tengah Sha'ban. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1881} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1882} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1883} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1884} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1885} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1886} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1887}."
