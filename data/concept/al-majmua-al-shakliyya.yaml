id: concept/al-majmua-al-shakliyya
class: concept
kind: term
label:
  ar: "المجموعة الشكلية (Nominal Group)"
  en: "The nominal group technique"
  ur: "نومینل گروپ تکنیک"
summary:
  ar: "المجموعة الشكلية (nominal group) طريقة لإدارة الاجتماعات ابتكرتها جامعة ويسكونسن بعد دراسة أكثر من عشرة آلاف اجتماع — تعطي عند السويدان أربعة أضعاف النتائج في ربع الوقت — بخطوات: العناوين الفرعية، الكتابة الفردية، جمع الآراء بلا تكرار، الاعتراضات والاستفسارات فقط، ثم التصويت."
  en: "The nominal group technique, a meeting method devised at the University of Wisconsin after studying more than ten thousand meetings — which al-Suwaidan reports gives four times the results in a quarter of the time — by steps: sub-headings, individual silent writing, collecting all views without repetition, objections and inquiries only, then voting."
  ur: "نومینل گروپ تکنیک، اجلاس چلانے کا ایک طریقہ جو وسکانسن یونیورسٹی نے دس ہزار سے زائد اجلاسوں کے مطالعے کے بعد وضع کیا — سویدان کے بقول یہ چوتھے وقت میں چار گنا نتائج دیتی ہے — مراحل: فرعی عناوین، انفرادی خاموش تحریر، بلا تکرار رائے کا ارتکاز، صرف اعتراضات و استفسارات، پھر ووٹ۔"
