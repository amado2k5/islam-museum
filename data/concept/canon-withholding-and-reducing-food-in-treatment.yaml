label: { ar: "منع الغذاء وتقليله في العلاج عند ابن سينا", en: "Withholding and reducing food in treatment in the Canon", ur: "علاج میں غذا روکنا اور گھٹانا قانون میں", es: "Retención y reducción de alimentos en el tratamiento según el Canon", fr: "La restriction et la réduction des apports alimentaires dans le cadre d'un traitement selon le canon", tr: "İbn Sinna'ya göre tedavide gıdaların önlenmesi ve azaltılması", id: "Pencegahan dan pengurangan makanan dalam pengobatan menurut Avicenna" }
summary:
  ar: "يبين ابن سينا متى يمنع الطبيب الغذاء ومتى يقلله، وأن التقليل يكون من جهة الكمية ومن جهة الكيفية ومن اجتماعهما، وأن الفرق بين الجهتين أن غذاء قد يكثر مقداره ويقل غذاؤه كالبقول والفواكه، وغذاء قد يقل مقداره ويكثر غذاؤه كالبيض {cite:canon-ibn-sina-print-v1 p.267}."
  en: "Ibn Sina explains when the physician withholds food and when he reduces it, that reduction may be in quantity, in quality or in both together, and that the two differ: some food is large in amount yet low in nourishment, such as pulses and fruit, and some is small in amount yet highly nourishing, such as eggs {cite:canon-ibn-sina-print-v1 p.267}."
  es: "Ibn Sina explica que cuando el médico retiene alimentos y cuando los reduce, esa reducción puede ser en cantidad, en calidad o en ambas a la vez, y que las dos difieren: algunos alimentos son abundantes pero poco nutritivos, como las legumbres y la fruta, y otros son escasos pero muy nutritivos, como los huevos {cite:canon-ibn-sina-print-v1 p.267}."
  fr: "Ibn Sina explique que lorsque le médecin retient de la nourriture et lorsqu'il la réduit, cette réduction peut concerner la quantité, la qualité ou les deux à la fois, et que les deux diffèrent: certains aliments sont en grande quantité mais pauvres en nutriments, comme les légumineuses et les fruits, et d'autres sont en petite quantité mais très nutritifs, comme les œufs {cite:canon-ibn-sina-print-v1 p.267}."
  ur: "ابن سینا وضاحت کرتے ہیں کہ جب طبیب خوراک کو روکتا ہے اور جب وہ اسے کم کرتا ہے تو وہ کمی مقدار میں ہو سکتی ہے، معیار میں یا دونوں میں ایک ساتھ، اور یہ کہ دونوں میں فرق ہے: کچھ خوراک مقدار میں زیادہ لیکن غذائیت میں کم ہوتی ہیں، جیسے دالیں اور پھل، اور کچھ مقدار میں بہت کم لیکن بہت زیادہ غذائیت بخش ہوتے ہیں، جیسے انڈے۔"
  tr: "İbn Sina, bir doktorun ne zaman yiyeceği kestirip ne zaman azalttığını ve bu azaltmanın miktar, kalite ve kombinasyondan kaynaklandığını açıklar. İkisi arasındaki fark, bir yiyeceğin miktar artıp azalması, baklagiller ve meyveler gibi, bir yiyeceğin ise miktarı azalıp miktarı artması gibi, örneğin yumurta {cite:canon-ibn-sina-print-v1 s.267} olmasıdır."
  id: "Ibn Sina menjelaskan kapan dokter menahan makanan dan kapan menurunkannya, dan bahwa pengurangan itu disebabkan oleh jumlah, kualitas, dan kombinasi. Perbedaan antara keduanya adalah bahwa makanan dapat meningkat dalam jumlah dan berkurang, seperti legum dan buah-buahan, dan makanan yang bisa berkurang dalam jumlah tetapi meningkat, seperti telur {cite:canon-ibn-sina-print-v1 hlm.267}."
