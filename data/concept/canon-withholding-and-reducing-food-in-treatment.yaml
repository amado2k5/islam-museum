label: { ar: "منع الغذاء وتقليله في العلاج عند ابن سينا", en: "Withholding and reducing food in treatment in the Canon", ur: "علاج میں غذا روکنا اور گھٹانا قانون میں" }
summary:
  ar: "يبين ابن سينا متى يمنع الطبيب الغذاء ومتى يقلله، وأن التقليل يكون من جهة الكمية ومن جهة الكيفية ومن اجتماعهما، وأن الفرق بين الجهتين أن غذاء قد يكثر مقداره ويقل غذاؤه كالبقول والفواكه، وغذاء قد يقل مقداره ويكثر غذاؤه كالبيض {cite:canon-ibn-sina-print-v1 p.267}."
  en: "Ibn Sina explains when the physician withholds food and when he reduces it, that reduction may be in quantity, in quality or in both together, and that the two differ: some food is large in amount yet low in nourishment, such as pulses and fruit, and some is small in amount yet highly nourishing, such as eggs {cite:canon-ibn-sina-print-v1 p.267}."
