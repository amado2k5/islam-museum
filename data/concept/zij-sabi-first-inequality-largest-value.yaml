label: { ar: "أكبر قيمة للاختلاف المفرد عند القمر", en: "The largest value of the Moon's single inequality", ur: "چاند کے واحد اختلاف کی سب سے بڑی قدر" }
summary:
  ar: "أكثر ما يبلغ الاختلاف المفرد للقمر خمسة أجزاء ودقيقة واحدة، ونصف قطر فلك التدوير المقابل له خمسة أجزاء وربع بالنسبة إلى الستين نصف القطر، وهي النسبة التي ذكرها بطليموس. {cite:zij-sabi-nallino-byblion p.78}."
  en: "The single inequality of the Moon reaches at most five parts and one minute. The radius of the epicycle that matches it is five and a quarter parts against sixty for the radius, the ratio Ptolemy gives. {cite:zij-sabi-nallino-byblion p.78}."
  ur: "چاند کا واحد اختلاف زیادہ سے زیادہ پانچ اجزاء اور ایک دقیقہ تک جاتا ہے۔ اس کے مطابق فلکِ تدویر کا نصف قطر ساٹھ کے مقابلے میں پانچ اجزاء اور ایک چوتھائی ہے، جو بطلیموس کی بیان کردہ نسبت ہے۔ {cite:zij-sabi-nallino-byblion p.78}۔"
