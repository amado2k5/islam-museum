label:
  ar: "يَوم الجمعة"
  en: "Yawm al-Jumu'a (Friday, fiqh)"
summary:
  ar: "يوم الجمعة آخر أيام الأسبوع، وكان يسمى قبل الإسلام يوم العروبة، وقيل إن كعب بن لوي أول من سماها الجمعة، وقيل إنما سميت في الإسلام لاجتماع الناس في المسجد. يتميز عند الفقهاء بأحكام منها وجوب صلاة الجمعة على الذكور البالغين، وسنية الغسل لها عند الجمهور واختلافهم في وقته وفي كونه لليوم أو للصلاة، وكراهة إفراده بالصوم عند الجمهور، وساعة الإجابة فيه، واستحباب التزين، والمنع من البيع عند النداء إليها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18016} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18017} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18021}"
  en: "Yawm al-jumu'a is the last day of the week; before Islam it was called the day of al-'Aruba, and some say Ka'b ibn Lu'ayy first named it al-jumu'a, while others say it was named in Islam for the gathering in the mosque. In fiqh it carries rules of its own: the Friday prayer is an individual duty on adult Muslim males; the washing for it is sunna on the majority view, with disputes over its time and whether it is for the day or the prayer; fasting it alone is disliked on the majority view; it holds an hour of answered prayer; adornment is recommended; and sale is forbidden at the call to the prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18016} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18017} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18021}"
