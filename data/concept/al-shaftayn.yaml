summary:
  ar: "الشفتان خلقتا غطاء للفم والأسنان ومحبساً للعاب ومعيناً للناس على الكلام وجمالاً، وقد خلقتا من لحم وعصب وهي شظايا العضل المطيف به {cite:canon-ibn-sina-print-v2 p.283}"
  en: "The lips were created a cover for the mouth and the teeth, a holder-back of the saliva, a help for people in speech, and a beauty; they were created of flesh and nerve, being shreds of the muscle surrounding it {cite:canon-ibn-sina-print-v2 p.283}"
  ur: "ہونٹ منہ اور دانتوں کے لیے ڈھانپ، لعاب کے لیے روک، لوگوں کے لیے کلام میں مدد اور جمال کے طور پر پیدا کیے گئے؛ اور وہ گوشت اور اعصاب سے بنے ہیں اور اس کے گرد کے پٹھوں کے ٹکڑے ہیں {cite:canon-ibn-sina-print-v2 p.283}"
