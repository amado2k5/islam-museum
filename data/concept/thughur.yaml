label: { ar: "الثغور", en: "The Thughur (Frontier Marches)" }
summary:
  ar: "الثغور عند البلاذري: كانت ثغور المسلمين الشامية أيام عمر وعثمان أنطاكية وغيرها من المدن التي سماها الرشيد فيما بعد «العواصم»، فكان المسلمون يغزون ما وراءها كما يغزون ما وراء طرسوس، وكان بين الإسكندرونة وطرسوس حصون ومسالح للروم ربما أخلاه أهلها هرباً وربما شُحنت بالمقاتلة، وقيل إن هرقل نقل أهل تلك الحصون معه عند جلائه من أنطاكية لئلا يعمّر المسلمون ما بينها وبين بلاد الروم؛ وكانت بنو أمية تغزو الروم بأهل الشام والجزيرة صائفة وشاتية وترتّب الحفظة في السواحل وتقيم المراكب للغزو، فلما ولي أبو جعفر المنصور تتبع حصون السواحل ومدنها فعمّرها وحصّنها وبنى ما احتاج إلى البناء منها وفعل مثل ذلك بمدن الثغور، ثم استتم المهدي ما بقي وزاد في شحنها، وأقام هارون من الصناعة والغزو ما لم يقم قبله وقسم الأموال في الثغور والسواحل، وأمر المتوكل سنة 247 بترتيب المراكب في جميع السواحل وأن تشحن بالمقاتلة؛ ومن مشاهير عواصمها المصيصة وطرسوس ومرعش والحدث وسيس وقنقرة."
  en: "The Thughur — in al-Baladhuri: the Muslims' Syrian marches in Umar's and Uthman's days were Antioch and the cities al-Rashid later called the 'Awasim, the Muslims raiding beyond them as they now raid beyond Tarsus; between Alexandretta and Tarsus lay Byzantine forts and watchposts that their people sometimes abandoned in flight or filled with fighters, Heraclius reportedly removing their people with him on leaving Antioch so the Muslims could not settle the land between; the Umayyads raided the Byzantines with the people of Syria and the Jazira summer and winter, posting coastal watchmen and keeping raiding ships, then Abu Ja'far al-Mansur went through the coastal fortresses and cities, restoring, fortifying and building what needed building and doing likewise for the march cities, al-Mahdi completed what remained and reinforced them, Harun carried fortification and raiding to a pitch unmatched before him and disbursed funds through the marches, and al-Mutawakkil in year 247 ordered ships stationed on every coast manned with fighters; among its famous strongholds are Masisa, Tarsus, Mar'ash, al-Hadath, Sis and Qanqara."
