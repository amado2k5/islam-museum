label: { ar: "الثغور", en: "The Thughur (Frontier Marches)", es: "El Thughur (Marchas Fronterizas)", fr: "Les Thugs (Marches frontalières)", ur: "تھغور ⁦(فرنٹیئر مارچ)⁩", tr: "sınırlar", id: "perbatasan" }
summary:
  ar: "الثغور عند البلاذري: كانت ثغور المسلمين الشامية أيام عمر وعثمان أنطاكية وغيرها من المدن التي سماها الرشيد فيما بعد «العواصم»، فكان المسلمون يغزون ما وراءها كما يغزون ما وراء طرسوس، وكان بين الإسكندرونة وطرسوس حصون ومسالح للروم ربما أخلاه أهلها هرباً وربما شُحنت بالمقاتلة، وقيل إن هرقل نقل أهل تلك الحصون معه عند جلائه من أنطاكية لئلا يعمّر المسلمون ما بينها وبين بلاد الروم؛ وكانت بنو أمية تغزو الروم بأهل الشام والجزيرة صائفة وشاتية وترتّب الحفظة في السواحل وتقيم المراكب للغزو، فلما ولي أبو جعفر المنصور تتبع حصون السواحل ومدنها فعمّرها وحصّنها وبنى ما احتاج إلى البناء منها وفعل مثل ذلك بمدن الثغور، ثم استتم المهدي ما بقي وزاد في شحنها، وأقام هارون من الصناعة والغزو ما لم يقم قبله وقسم الأموال في الثغور والسواحل، وأمر المتوكل سنة 247 بترتيب المراكب في جميع السواحل وأن تشحن بالمقاتلة؛ ومن مشاهير عواصمها المصيصة وطرسوس ومرعش والحدث وسيس وقنقرة."
  en: "The Thughur — in al-Baladhuri: the Muslims' Syrian marches in Umar's and Uthman's days were Antioch and the cities al-Rashid later called the 'Awasim, the Muslims raiding beyond them as they now raid beyond Tarsus; between Alexandretta and Tarsus lay Byzantine forts and watchposts that their people sometimes abandoned in flight or filled with fighters, Heraclius reportedly removing their people with him on leaving Antioch so the Muslims could not settle the land between; the Umayyads raided the Byzantines with the people of Syria and the Jazira summer and winter, posting coastal watchmen and keeping raiding ships, then Abu Ja'far al-Mansur went through the coastal fortresses and cities, restoring, fortifying and building what needed building and doing likewise for the march cities, al-Mahdi completed what remained and reinforced them, Harun carried fortification and raiding to a pitch unmatched before him and disbursed funds through the marches, and al-Mutawakkil in year 247 ordered ships stationed on every coast manned with fighters; among its famous strongholds are Masisa, Tarsus, Mar'ash, al-Hadath, Sis and Qanqara."
  es: "El Thughur — en al-Baladhuri: las marchas sirias de los musulmanes en los días de Umar y Uthman fueron Antioquía y las ciudades que al-Rashid luego llamó 'Awasim, los musulmanes saqueando más allá de ellas como ahora saquean más allá de Tarso; entre Alejandría y Tarso se encontraban fuertes y puestos de vigilancia bizantinos que su gente a veces abandonaba en la huida o llenaba de combatientes, según se dice Heraclio se llevó a su gente consigo al salir de Antioquía para que los musulmanes no pudieran asentarse en la tierra intermedia; Los omeyas atacaron a los bizantinos junto con la gente de Siria y Jazira durante el verano y el invierno, apostando vigías costeros y manteniendo barcos de asalto. Luego, Abu Ja'far al-Mansur recorrió las fortalezas y ciudades costeras, restaurando, fortificando y construyendo lo que era necesario, e hizo lo mismo con las ciudades de la frontera. Al-Mahdi completó lo que quedaba y las reforzó. Harún llevó la fortificación y los asaltos a un nivel sin precedentes y distribuyó fondos por las fronteras. Al-Mutawakkil, en el año 247, ordenó que se estacionaran barcos en todas las costas con combatientes a bordo; entre sus famosas fortalezas se encuentran Masisa, Tarsus, Mar'ash, al-Hadath, Sis y Qanqara."
  fr: "Le Thughur — selon al-Baladhuri: les marches syriennes des musulmans à l'époque d'Umar et d'Uthman étaient Antioche et les villes qu'al-Rashid a plus tard appelées les 'Awasim, les musulmans menant des raids au-delà d'elles comme ils le font maintenant au-delà de Tarse; entre Alexandrette et Tarse se trouvaient des forts et des postes de guet byzantins que leurs habitants abandonnaient parfois en fuyant ou remplissaient de combattants, Héraclius ayant apparemment emmené leur peuple avec lui en quittant Antioche afin que les musulmans ne puissent pas s'installer sur la terre entre; Les Omeyyades, avec les populations de Syrie et de Jazira, pillaient les Byzantins été comme hiver, postant des guetteurs côtiers et entretenant des navires de pillage. Puis, Abou Ja'far al-Mansur parcourut les forteresses et les villes côtières, restaurant, fortifiant et construisant ce qui devait l'être, et fit de même pour les villes des marches. Al-Mahdi acheva les travaux restants et les renforça. Harun porta les fortifications et les raids à un niveau inégalé et distribua des fonds dans les marches. Enfin, en l'an 247, al-Mutawakkil ordonna de stationner des navires armés de combattants sur chaque côte. Parmi ses places fortes les plus célèbres figurent Masisa, Tarse, Mar'ash, al-Hadath, Sis et Qanqara."
  ur: "ثغور - البلادھوری میں: عمر اور عثمان کے زمانے میں مسلمانوں کے شامی مارچ انطاکیہ تھے اور الرشید کے شہروں کو بعد میں 'عواصم' کہا جاتا ہے، مسلمان ان سے آگے چھاپہ مارتے ہیں جیسا کہ وہ اب ترسس سے آگے چھاپے مارتے ہیں۔ الیگزینڈریٹا اور ترسوس کے درمیان بازنطینی قلعے اور چوکیاں بچھی تھیں جنہیں ان کے لوگ بعض اوقات پرواز میں چھوڑ دیتے تھے یا جنگجوؤں سے بھر جاتے تھے، ہیراکلئس نے مبینہ طور پر انطاکیہ سے نکلتے وقت اپنے لوگوں کو اپنے ساتھ ہٹا دیا تھا تاکہ مسلمان درمیان کی زمین کو آباد نہ کر سکیں۔ امویوں نے شام کے لوگوں کے ساتھ جزیرہ اور موسم سرما میں بازنطینیوں پر چڑھائی کی، ساحلی چوکیداروں کو تعینات کیا اور بحری جہازوں کی نگرانی کی، پھر ابو جعفر المنصور ساحلی قلعوں اور شہروں سے گزرے، جس کی ضرورت تھی عمارت کی بحالی، مضبوطی اور تعمیر کرتے رہے اور مارچ والے شہروں کے لیے اسی طرح کام کرتے رہے، المہدی اور حریرعون نے جو کچھ بھی کیا، وہ مکمل کیا، اور ان کے لیے حریّن فوجیں باقی رہیں۔ اس کے سامنے بے مثال پچ اور مارچوں کے ذریعے فنڈز تقسیم کیے، اور المتوکل نے سال 247 میں جنگجوؤں کے ساتھ ہر ساحل پر تعینات بحری جہازوں کا حکم دیا۔ اس کے مشہور گڑھوں میں مسیسا، ترسوس، مرش، الحدث، سیس اور قنقرہ ہیں۔"
  tr: "Al-Baladhuri'ye göre sınırlar: Ömer ve Osman döneminde Levant Müslümanlarının sınırları Antakya ve daha sonra 'başkent' olarak adlandırılan diğer şehirlerdi. Müslümanlar hem Tarsus'un ötesinde hem de Tarsus'un ötesine yağmalar düzenlerdi. İskenderiye ile Tarsus arasında, Romalılar için kaleler ve yerleşimler vardı; bazıları sakinlerini kaçmak için tahliye eder ve bazen savaşa yeniden enerji toplardı. Herakleios'un, Antakya'dan ayrılırken bu kalelerin halkını da yanında taşıdığı söylenir, böylece Müslümanlar Romalıların topraklarıyla arasındaki alanı inşa etmesinler. Emeviler, yaz ve kış aylarında Levant ve yarımada halkıyla birlikte Romalılara saldırırdı Kıyılara muhafızlar atandı ve gemiler işgal için konuşlandırıldı. Ebu Ca'fer el-Mansur göreve başladığında, kıyılardaki kaleleri ve şehirleri takip etti, inşa etti ve tahkim etti, yapılması gerekenleri inşa etti ve sınır şehirlerinde de aynı şekilde yapıldı. Sonra el-Mehdi kalanları tamamladı ve deniz taşımacılığını artırdı. Harun, daha önce kurulmamış tekneler ve seferler kurdu ve serveti sınır ve kıyılara dağıttı. 247 Hicri yılında, el-Mutevakkil, tüm kıyılar boyunca gemilerin düzenlenmesini ve savaşçılarla yüklenmesini emretti; ünlü başkentleri arasında El-Masisa, Tarsus, Maraş, Hadath, Sis ve Qonqara vardı."
  id: "Perbatasan menurut al-Baladhuri: Perbatasan Muslim Levant pada masa Umar dan Utsman adalah Antiokhia dan kota-kota lain yang kemudian disebut 'ibu kota.' Muslim akan menyerang di luar mereka serta di luar Tarsus. Di antara Alexandria dan Tarsus, terdapat benteng dan pemukiman bagi orang Romawi, beberapa penduduknya mengungsi untuk melarikan diri dan kadang-kadang kembali bertempur. Dikatakan bahwa Heraclius memindahkan penduduk benteng-benteng itu bersamanya setelah meninggalkan Antiokhia agar Muslim tidak membangun wilayah antara benteng itu dan tanah Romawi. Umayyah biasa menyerang Romawi bersama orang-orang Levant dan semenanjung baik musim panas maupun musim dingin Penjaga ditugaskan di pesisir dan kapal-kapal ditempatkan untuk invasi. Ketika Abu Ja'far al-Mansur menjabat, ia melacak benteng dan kota di pesisir, membangun dan memperkuatnya, serta membangun apa yang perlu dibangun, melakukan hal yang sama di kota-kota perbatasan. Kemudian al-Mahdi menyelesaikan sisa dan meningkatkan pengiriman mereka. Harun membangun kerajinan dan ekspedisi yang belum pernah didirikan sebelumnya, dan membagikan kekayaan di perbatasan dan pesisir. Pada tahun 247 H, al-Mutawakkil memerintahkan penempatan kapal di sepanjang semua pantai dan dimuat dengan pesawat tempur; di antara ibu kotanya yang terkenal adalah Al-Masisa, Tarsus, Marash, Hadath, Sis, dan Qonqara."
