summary:
  ar: "عند العجز عظمان يمنة ويسرة يتصلان في الوسط بمفصل موثق، وهما كالأساس لجميع العظام الفوقانية والحامل الناقل للسفلانية {cite:canon-ibn-sina-print-v1 p.57}."
  en: "At the sacrum there are two bones, right and left, joined in the middle by a secured joint; they are like the foundation of all the bones above and carry and transmit to those below {cite:canon-ibn-sina-print-v1 p.57}."
  es: "En el sacro hay dos huesos, derecho e izquierdo, unidos en el medio por una articulación segura; son como el fundamento de todos los huesos superiores y los sostienen y transmiten a los inferiores {cite:canon-ibn-sina-print-v1 p.57}."
  fr: "Au niveau du sacrum, il y a deux os, droit et gauche, réunis au milieu par une articulation solide; ils sont comme la fondation de tous les os au-dessus et portent et transmettent à ceux en dessous {cite:canon-ibn-sina-print-v1 p.57}."
  ur: "سیکرم میں دو ہڈیاں ہیں، دائیں اور بائیں، درمیان میں ایک محفوظ جوڑ کے ذریعے جڑی ہوئی ہیں۔ وہ اوپر کی تمام ہڈیوں کی بنیاد کی طرح ہیں اور نیچے کی ہڈیوں کو لے جاتے ہیں اور منتقل کرتے ہیں"
