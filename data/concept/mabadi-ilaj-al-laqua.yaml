id: "concept/mabadi-ilaj-al-laqua"
class: "concept"
kind: "scientific"
label:
  ar: "مبادئ علاج اللقوة"
  en: "Principles of the treatment of facial palsy"
  ur: "لقوہ کے علاج کے اصول"
  es: "Principios del tratamiento de la parálisis facial"
  fr: "Principes du traitement de la paralysie faciale"
  tr: "Güç Terapisi Prensipleri"
  id: "Prinsip Terapi Kekuatan"
summary:
  ar: "الحزم هو أن لا يحرك الملقو إلى السابع وقال قوم إلى الرابع، ويغذى بما يلطف في اليوم الثاني بحقنة شديدة اللين؛ والمبادرة إلى الغراغر في الابتداء ضارة، والاستعجال إلى الدواء الحاد من أضر الأشياء وأردا المعالجة أن تجفف المادة وتغلظها وييبس العصب {cite:canon-ibn-sina-print-v2 p.155}"
  en: "Prudence is not to move the laqua patient until the seventh — some said the fourth — and he is fed what lightens on the second day, with a very soft clyster; hastening to gargles at the start is harmful, and rushing to the sharp medicine is among the most harmful things, the worst of treatment being to dry and thicken the matter and dry out the nerve {cite:canon-ibn-sina-print-v2 p.155}"
  ur: "احتیاط یہ ہے کہ ملقو کو ساتویں دن تک نہ ہلایا جائے، اور بعض نے کہا چوتھے دن تک، اور دوسرے دن اسے ہلکی غذا اور بہت نرم حقنے سے دی جائے؛ اور ابتدا میں غراروں کی طرف جلدی نقصان دہ ہے، اور تیز دوا کی طرف جلدی سب سے زیادہ نقصان دہ چیزوں میں ہے، اور علاج کی بدترین صورت یہ ہے کہ مادے کو خشک اور گاڑھا کر دیا جائے اور عصب کو خشک کر دیا جائے {cite:canon-ibn-sina-print-v2 p.155}۔"
  es: "La prudencia consiste en no mover al paciente con diarrea hasta el séptimo día —algunos decían el cuarto— y se le administra lo que se alivia al segundo día, con un enema muy suave; apresurarse a hacer gárgaras al principio es perjudicial, y precipitarse a la medicina fuerte es una de las cosas más dañinas, siendo el peor tratamiento resecar y espesar la materia y resecar el nervio {cite:canon-ibn-sina-print-v2 p.155}"
  fr: "Par prudence, il est conseillé de ne pas déplacer le patient atteint de diarrhée avant le septième jour — certains disaient le quatrième — et de le nourrir avec ce qui s'allège le deuxième jour, avec un lavement très doux; se hâter de faire des gargarismes au début est nuisible, et se précipiter sur les médicaments forts est parmi les choses les plus néfastes, le pire traitement étant d'assécher et d'épaissir la matière et d'assécher le nerf {cite:canon-ibn-sina-print-v2 p.155}"
  tr: "Kararlılık, konuşmacıyı yedinci güne kadar hareket ettirmemek, bazıları ise dördüncü güne kadar hareket ettirmek ve ikinci gün hafif bir enjeksiyonla beslenmektir; ilk gargara için acele etmek zararlıdır ve keskin ilaca koşmak en zararlı şeylerden biridir. Tedavi maddeyi kurutup koyulaştırır ve sinirin kurumasına neden olur {cite:canon-ibn-sina-print-v2 s.155}"
  id: "Tekad adalah untuk tidak memindahkan pembicara sampai hari ketujuh, dan beberapa orang mengatakan sampai hari keempat, dan diberi nutrisi dengan suntikan lembut pada hari kedua; terburu-buru ke kumur awal berbahaya, dan terburu-buru menggunakan obat tajam adalah salah satu hal yang paling berbahaya. Pengobatan ini akan mengeringkan dan mengental zat serta menyebabkan saraf menjadi kering {cite:canon-ibn-sina-print-v2 hlm.155}"
