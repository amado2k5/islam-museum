class: concept
kind: scientific
label: { ar: "جدول الميل بأسطره الأربعة وطريقة قراءته", en: "The declination table in four rows and how to read it", ur: "میل کا جدول چار سطروں میں اور اس کی قراءت", es: "La tabla de declinación en cuatro filas y cómo leerla.", fr: "Tableau de déclinaison en quatre lignes et comment le lire", tr: "Dört çizgiden oluşan eğim grafiği ve nasıl okunacağı", id: "Grafik kemiringan dengan empat garis dan cara membacanya" }
summary:
  ar: "يضع البتاني جدول الميل في أربعة أسطر للأعداد: في الأول أعداد البروج من جزء إلى تسعين، وفي الثاني ما ينقص أعداد الأول من المائة والثمانين، وفي الثالث ما يزيد أعداد الأول على المائة والثمانين، وفي الرابع ما ينقص أعداد الأول من الثلثمائة والستين، ليعلم أن العدد إذا وقع في الأول والثاني فالميل شمالي وإن وقع في الأخيرين فجنوبي. ثم يبين كيف يؤخذ الميل مع الدقائق بتناسب الفضل بين ميلي درجتين متتاليتين. {cite:zij-sabi-nallino-byblion pp.22-23}."
  en: "Al-Battani sets the declination table with four rows of numbers: the first with the numbers of the signs from one part to ninety, the second what the first row's numbers fall short of 180, the third what they exceed 180 by, and the fourth what they fall short of 360, so that when a number falls in the first or second the declination is north and when in the last two south. He then shows how the declination is taken with minutes, by proportion on the difference between the declinations of two successive degrees. {cite:zij-sabi-nallino-byblion pp.22-23}."
  ur: "البتانی میل کا جدول اعداد کی چار سطروں میں رکھتے ہیں: پہلی میں بروج کے اعداد ایک جزء سے نوے تک، دوسری میں وہ جو پہلی کے اعداد کو ایک سو اسّی میں سے گھٹاتے ہیں، تیسری میں وہ جو پہلی کے اعداد کو ایک سو اسّی پر بڑھاتے ہیں، اور چوتھی میں وہ جو پہلی کے اعداد کو تین سو ساٹھ میں سے گھٹاتے ہیں، تاکہ جب عدد پہلی یا دوسری میں آئے تو میل شمالی ہو اور آخری دو میں آئے تو جنوبی۔ پھر وہ بتاتے ہیں کہ دقائق کے ساتھ میل دو متواتر درجوں کے میل کے فرق پر نسبت سے کیسے لیا جاتا ہے۔ {cite:zij-sabi-nallino-byblion pp.22-23}۔"
  es: "Al-Battani establece la tabla de declinación con cuatro filas de números: la primera con los números de los signos desde una parte hasta noventa, la segunda con los números de la primera fila que faltan para 180, la tercera con los que superan 180, y la cuarta con los que faltan para 360, de modo que cuando un número cae en la primera o segunda fila la declinación es norte, y cuando cae en las dos últimas, sur. Luego muestra cómo se toma la declinación en minutos, en proporción a la diferencia entre las declinaciones de dos grados sucesivos. {cite:zij-sabi-nallino-byblion pp.22-23}."
  fr: "Al-Battani établit le tableau de déclinaison avec quatre lignes de nombres: la première avec les valeurs des signes allant de 1/40 à 90, la deuxième avec les valeurs de la première ligne inférieures à 180, la troisième avec les valeurs supérieures à 180, et la quatrième avec les valeurs inférieures à 360. Ainsi, lorsqu'une valeur se trouve dans la première ou la deuxième ligne, la déclinaison est nord, et lorsqu'elle se trouve dans les deux dernières, sud. Il montre ensuite comment la déclinaison est calculée en minutes, proportionnellement à la différence entre les déclinaisons de deux degrés successifs. {cite:zij-sabi-nallino-byblion pp.22-23}."
  tr: "El-Battani, sayılar için dört satırda eğim tablosunu ortaya koyar: birincisi 1'den 90'a kadar olan burçların sayıları için, ikincisi 180'den küçük sayılar için, üçüncüsü 180'den büyük sayılar için ve dördüncüsü 360'tan küçük sayılar için. Bu, bir sayının birinci veya ikinci satıra düşmesi durumunda eğimin kuzeye, son iki satıra düşmesi durumunda ise güneye olduğunu göstermek içindir. Daha sonra, ardışık iki derecenin eğimleri arasındaki farkı oranlayarak eğimin dakika cinsinden nasıl hesaplanacağını açıklar. {cite:zij-sabi-nallino-byblion pp.22-23}."
  id: "Al-Battani menyajikan tabel kemiringan dalam empat baris untuk angka-angka: baris pertama untuk angka-angka zodiak dari satu hingga sembilan puluh, baris kedua untuk angka-angka kurang dari seratus delapan puluh, baris ketiga untuk angka-angka lebih besar dari seratus delapan puluh, dan baris keempat untuk angka-angka kurang dari tiga ratus enam puluh. Ini untuk menunjukkan bahwa jika suatu angka berada di baris pertama atau kedua, kemiringannya adalah utara, dan jika berada di dua baris terakhir, kemiringannya adalah selatan. Kemudian ia menjelaskan cara menghitung kemiringan dengan menit dengan memproporsikan perbedaan antara kemiringan dua derajat berurutan. {cite:zij-sabi-nallino-byblion pp.22-23}."
