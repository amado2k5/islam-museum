id: concept/al-ghayb-al-mutlaq
class: concept
kind: doctrine
label:
  ar: "الغيب المطلق"
  en: "Absolute unseen (al-ghayb al-mutlaq)"
  fr: "L’invisible absolu (al-ghayb al-mutlaq)"
  ur: "غیبِ مطلق"
  es: "Absoluto invisible (al-ghayb al-mutlaq)"
  tr: "Mutlak Görünmez"
  id: "Absolut Tak Terlihat"
summary:
  ar: "يفرق الشعراوي بين الغيب النسبي، وهو ما يعلمه غيري، والغيب المطلق، وهو ما لا مقدمات له ولا يعلمه إلا الله، ويرى أن علم الله يشمل ما يُسر وما يُخفى وما يُعلن {cite:tafsir-sharawi-khawatir-scan p.252} {cite:tafsir-sharawi-khawatir-scan p.253}."
  en: "Sha'rawi distinguishes the relative unseen, which others may know, from the absolute unseen, which has no precursors and which only God knows. He holds that God's knowledge covers what is secret, what is hidden and what is declared {cite:tafsir-sharawi-khawatir-scan p.252} {cite:tafsir-sharawi-khawatir-scan p.253}."
  fr: "Sha’rawi distingue l’invisible relatif, que d’autres peuvent connaître, de l’invisible absolu, qui n’a pas de signes avant-coureurs et que Dieu seul connaît. Selon lui, le savoir de Dieu englobe le secret, le caché et ce que l’on déclare {cite:tafsir-sharawi-khawatir-scan p.252} {cite:tafsir-sharawi-khawatir-scan p.253}."
  ur: "شعراوی نسبی غیب، یعنی جو دوسرے جانتے ہوں، اور غیبِ مطلق میں فرق کرتے ہیں، جس کی کوئی پیشگی علامت نہیں اور جسے صرف اللہ جانتا ہے۔ ان کے نزدیک اللہ کا علم چھپی، پوشیدہ اور ظاہر ہر بات کو گھیرے ہوئے ہے {cite:tafsir-sharawi-khawatir-scan p.252} {cite:tafsir-sharawi-khawatir-scan p.253}۔"
  es: "Sha'rawi distingue lo relativo invisible, que otros pueden conocer, de lo absoluto invisible, que no tiene precursores y que solo Dios conoce. Sostiene que el conocimiento de Dios abarca lo secreto, lo oculto y lo declarado {cite:tafsir-sharawi-khawatir-scan p.252} {cite:tafsir-sharawi-khawatir-scan p.253}."
  tr: "El-Şaarawi, göreceli görünmeyen, yani başkalarının bildiği şey olan, ve önkoşulsuz olan ve yalnızca Tanrı'nın bildiği mutlak görünmez arasında ayrım yapar. Tanrı'nın bilgisinin kolay, gizli ve vahiy edileni içerdiğine inanır {atıf:tafsir-sharawi-khawatir-scan s.252} {cite:tafsir-sharawi-khawatir-scan s.253}."
  id: "Al-Shaarawi membedakan antara yang relatif tak terlihat, yaitu apa yang diketahui orang lain, dan yang tak bersyarat serta yang absolut yang hanya diketahui oleh Tuhan. Ia percaya bahwa pengetahuan Tuhan mengandung yang mudah, tersembunyi, dan terungkap {citation:tafsir-sharawi-khawatir-scan hlm.252} {cite:tafsir-sharawi-khawatir-scan hlm.253}."
