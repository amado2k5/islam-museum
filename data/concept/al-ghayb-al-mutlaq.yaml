id: concept/al-ghayb-al-mutlaq
class: concept
kind: doctrine
label:
  ar: "الغيب المطلق"
  en: "Absolute unseen (al-ghayb al-mutlaq)"
  ur: "غیبِ مطلق"
summary:
  ar: "يفرق الشعراوي بين الغيب النسبي، وهو ما يعلمه غيري، والغيب المطلق، وهو ما لا مقدمات له ولا يعلمه إلا الله، ويرى أن علم الله يشمل ما يُسر وما يُخفى وما يُعلن {cite:tafsir-sharawi-khawatir-scan p.252} {cite:tafsir-sharawi-khawatir-scan p.253}."
  en: "Sha'rawi distinguishes the relative unseen, which others may know, from the absolute unseen, which has no precursors and which only God knows. He holds that God's knowledge covers what is secret, what is hidden and what is declared {cite:tafsir-sharawi-khawatir-scan p.252} {cite:tafsir-sharawi-khawatir-scan p.253}."
  ur: "شعراوی نسبی غیب، یعنی جو دوسرے جانتے ہوں، اور غیبِ مطلق میں فرق کرتے ہیں، جس کی کوئی پیشگی علامت نہیں اور جسے صرف اللہ جانتا ہے۔ ان کے نزدیک اللہ کا علم چھپی، پوشیدہ اور ظاہر ہر بات کو گھیرے ہوئے ہے {cite:tafsir-sharawi-khawatir-scan p.252} {cite:tafsir-sharawi-khawatir-scan p.253}۔"
