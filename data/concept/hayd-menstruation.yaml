id: concept/hayd-menstruation
class: concept
kind: legal
label: { ar: "الحيض", en: "Hayd (menstruation)", ur: "حیض" }
summary:
  ar: "الحيض لغة السيلان، وهو في الشرع دم ينفضه رحم المرأة السليمة في أوقات معلومة، وتعددت التعريفات بحسب المذاهب، والحيض والنفاس مختلفان في المفهوم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7458} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7461} ويفرق المدخل بين الحيض والطهر والقرء والاستحاضة والنفاس؛ فالاستحاضة سيلان دم في غير أوقاته المعتادة، والنفاس الدم الخارج بعد الولادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7460} ويجب على المرأة تعلم أحكام الحيض لما يترتب عليه من عبادات ومعاملات، ولا يعدم الحيض الأهلية، وركنه عند الحنفية بروز الدم من الفرج الداخل إلى الخارج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7461}  ومن شروط الحيض عند الجمهور أن يكون الدم خارجا من الرحم لا بسبب ولادة، وأن يتقدمه طهر خمسة عشر يوما، وألا ينقص عن أقله، وأن يكون في سن الحيض؛ وزاد الحنفية والحنابلة أن لا تكون حاملا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7462} والصفرة والكدرة في أيام الحيض حيض عند الجمهور، وليستا بحيض بعد الطهر عند الحنفية والحنابلة؛ ولهم تفصيل في ألوان الدم الستة عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7463} وأقل سن تحيض فيه المرأة تسع سنين قمرية عند الجمهور، وأكثرها عند الحنابلة خمسون سنة، والحنفية والشافعية لا يحدون، والمالكية لهم تفاصيل بالعرف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7463} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7464} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7465} وفي حيض الحامل تفصيل: يعتبر أكثر الحيض في الشهور المختلفة عشرين أو ثلاثين يوما عند المالكية، وأقل الحيض يوم وليلة عند الشافعية والحنابلة، وأكثره خمسة عشر يوما، وغالبه ست أو سبع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7467} والمرأة أقسام: المبتدأة وهي التي لم يتقدم لها حيض، والمعتادة وهي التي عرفت حيضها وطهرها، والمتحيرة وهي التي نسيت عادتها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7467} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7468} والمبتدأة إذا رأت الدم في زمن الإمكان ولم ينقص عن أقله أو يزد على أكثره فهو حيض، ويجري الصفرة والكدرة مجرى الحيض عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7467} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7468} وإذا انقطع الدم دون أكثر الحيض طهرت، وعند الحنابلة تغتسل عند أقل الحيض وتصلي وتصوم فيما جاوزه احتياطا؛ وإذا استمر الدم وجاوز أكثر الحيض فالحنفية يجعلون الحيض عشرة والطهر عشرين، والمالكية يرون مكثها خمسة عشر يوما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7468} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7469} وتثبت العادة عند الحنابلة بثلاث مرات، وعند الشافعية والحنفية بتكرار ما يتعلق بالدم والطهر، ويختلف محمد وأبو يوسف فيما يصير عادة بمرة، وتنقطع العادة بمخالفة متكررة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7470}  المعتادة إذا وافق الدم عادتها فأيامه حيض وما بعده طهر، وإن انقطع دون العادة فإنها تطهر، واختلف الفقهاء في وطئها وفي الصلاة عند الانقطاع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7471} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7472} وإذا عاد الدم بعد انقطاعه فالحنفية والمالكية والشافعية والحنابلة يختلفون: فالشافعية بالسحب أي أن الكل حيض بشروط، والحنابلة يرون الطهر الخالص طهرا، وعند الحنفية يبطل حكم الطهر إن عاد الدم في مدة أكثر الحيض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7471} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7472} وإذا جاوز دم المعتادة عادتها، فالحنفية يردون المرأة إلى عادتها ما لم تنتقل، والطهر عند أكثرهم ستة أشهر إلا ساعة، وفي قول شهران؛ والمالكية يستظهرون ثلاثة أيام بعد عادتهم، ويزيدون على كل تكرار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7472} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7473} وتنتقل العادة عند الحنفية بحسب الزمن والعدد إذا جاوز الدم العشرة، وتنتقل عند المالكية والشافعية والحنابلة تقدما وتأخرا وزيادة ونقصا؛ والحنابلة لا يعتبرون الخارج عن العادة حيضا حتى يتكرر ثلاثا أو مرتين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7474} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7475} والعادة متفقة إن تساوت أيامها، ومختلفة مرتبة أو غير مرتبة، وفي المختلفة يعمل المرأة على النوبة أو تجلس الأقل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7476} وفي التلفيق قولان: قول التلفيق بأن يحسب أيام الدم فقط، وقول السحب بأن تحسب أيام الدم والطهر كلها حيضا بشروط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7476} وأكثر الطهر لا حد له، وأقله عند الحنفية والمالكية والشافعية خمسة عشر يوما، وعند الحنابلة ثلاثة عشر يوما، احتجاجا بأثر عن علي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7476} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7477}  واختلف الفقهاء في النقاء المتخلل بين أيام الحيض: فالحنفية والشافعية يجعلونه حيضا، والمالكية والحنابلة طهرا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7478} ودم الحامل: الحنفية والحنابلة يرونه دم علة وفساد لحديث النهي عن وطء الحامل حتى تضع، والمالكية والشافعية يرونه حيضا إن توافرت شروطه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7478} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7479} والطهر عند الحنفية صحيح إن بلغ خمسة عشر يوما بين دمين صحيحين خالصا، وفاسد إن نقص أو خالطه دم، وتام إن بلغ خمسة عشر ولو فاسدا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7479} والحيض علامة من علامات البلوغ التي يحصل بها التكليف، ولا يصح غسل الحائض عند الجمهور لرفع الجنابة في زمن الحيض، وغسل الحيض يجب بانقطاع الدم وتطييب موضعه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7479} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7480} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7481}  وتسقط الصلاة عن الحائض بإجماع الفقهاء، ولا تقضيها، وتقضي الصوم، وتعليل ذلك بحديث عائشة، ويحرم عليها أداؤها، وسجود التلاوة والشكر في معنى الصلاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7482} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7483} وتجب الصلاة على من طهرت في أول الوقت عند بعضهم، ويسقط الوجوب إن طرأ الحيض في وقت يسقط فيه، وفي آخر الوقت يتفاوت الفقهاء في مقدار الإدراك: الحنفية بقدر تكبيرة التحريمة وزمن الغسل، والمالكية بركعة، والشافعية والحنابلة بتكبيرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7483} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7484} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7485} ويحرم الصوم على الحائض مطلقا، ويجب عليها صوم اليوم إذا طهرت قبل الفجر، واختلفوا في المدة التي يجزئها فيها صوم اليوم: الحنفية يشترطون زمن الغسل والتحريمة، والمالكية يكتفون بالعلامة، والشافعية والحنابلة يكتفون بانقطاع الدم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7485} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7486}  وفي الحج لا يمنع الحيض شيئا من أعمال الحج إلا الطواف، وأغسال الحج مسنونة للحائض؛ ومن الطواف: القدوم سنة والإفاضة ركن والوداع واجب، وللحائض أن تنفر بلا وداع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7486} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7487} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7488} وقراءة القرآن ممنوعة عند الجمهور، والحنفية يفرقون بين القصد والدعاء، ويمنعون قراءة المركبات دون المفردات، والشافعية يمنعون ولو بعض آية، والحنابلة يمنعون آية فصاعدا، والمالكية يجيزونها أثناء سيلان الدم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7488} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7489} وحرم الحيض على الحائض أن تدخل المسجد عند الحنفية والمالكية، والشافعية والحنابلة يحرمون المرور إن خافت التلويث؛ وفي مصلى العيد اختلاف، وتصح صلاة الجنازة في مصلاها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7490} وأجمع الفقهاء على تحريم وطء الحائض في الفرج، واختلفوا في الاستمتاع بما بين السرة والركبة؛ فجمهور المذاهب يمنعونه، والحنابلة يجيزون ما دون الفرج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7490} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7491} وفي كفارة وطء الحائض يوجب الحنابلة نصف دينار، ويستحب الحنفية والشافعية الصدقة بدينار أو نصفه بحسب وقت الدم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7491} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7492} ولا يحل الوطء حتى ينقطع الدم ويغتسل عند الجمهور؛ والحنفية يفرقون بين انقطاع الدم لأكثر الحيض ولأقله ولتمام العادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7492} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7493} وطلاق الحائض حرام وهو من البدعي، لحديث ابن عمر، وجمهور الفقهاء على وقوعه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7493} ويُختم الحيض بمسائل عامة: لا يجوز منع الحيض بالدواء عند الحنابلة إلا بإذن الزوج وبشرط أمن الضرر؛ وادعاء الحيض يقبل منها إن أمكن؛ والنفاس يخالف الحيض في العدة والبلوغ والاستبراء وغيرها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7494} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7495}"
  en: "Hayd (menstruation) is lexically a flowing; in the law it is blood that a healthy womb expels at fixed times, and the definitions differ by school; hayd and nifas are different in meaning. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7458} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7461} The article distinguishes hayd from tuhr (purity), qur' (a period which is both), istihada (blood outside its times) and nifas (blood after birth). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7460} A woman must learn the rules of menstruation because they govern worship and dealings, the monthly courses do not remove legal capacity, and the Hanafi condition is the emergence of the blood from the inner to the outer part. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7461}  Among the conditions of menstruation the majority require blood issuing from the womb not from childbirth, a preceding purity of fifteen days, a flow not less than the least period, and an age of menstruation; the Hanafis and Hanbalis add that she is not pregnant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7462} Yellowness and turbidity during the days of menses count as menses for the majority, and do not after purity for the Hanafis and Hanbalis; the Hanafis list six colours of the blood. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7463} The least age for menstruation is nine lunar years for the majority, the Hanbalis put the greatest age at fifty, the Hanafis and Shafiis set none, and the Malikis judge by custom. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7463} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7464} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7465} For a pregnant woman who bleeds, the Malikis set the longest menses at twenty or thirty days by month, the least at a day and a night in the Shafii and Hanbali view, the longest at fifteen days, and the common course at six or seven days. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7467} A woman is a first-timer (no prior course), a woman of habit (known course and purity), or confused (has forgotten her habit). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7467} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7468} A first-timer whose blood comes at a time it can (and within the least and greatest lengths) has menstruation, and yellowish or turbid discharge counts as menses for the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7467} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7468} If the blood stops before the greatest length she is pure; the Hanbalis bathe at the least length and pray and fast in the rest as a precaution; if the flow continues past the greatest length, the Hanafis count ten days as menses and twenty as purity each month. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7468} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7469} A woman of habit has one rule for the blood: the blood must come at the time of her habit. It is confirmed by three cycles on the Hanbali and Shafii views and by repetition on the Hanafi view; the Hanafis differ on whether one change becomes a new habit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7470}  When a habitual woman's blood matches her habit, its days are menses and the rest purity; when it stops before the habit she is pure but the schools differ on intercourse and prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7471} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7472} When blood returns after a break, the Shafiis count the break as menses under conditions, the Hanbalis count a clear purity as purity, and the Hanafis cancel the purity if the blood returns within the greatest length. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7471} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7472} When a habitual woman's blood exceeds her habit, the Hanafis return her to her habit unless the habit has changed and set the purity at six months less an hour (a view of the Hanafi scholars), the Malikis add three days of caution to her habit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7472} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7473} Habit changes on the Hanafi view by time and count once blood exceeds ten days; the Malikis, Shafiis and Hanbalis let habit move earlier or later, grow or shrink; the Hanbalis count nothing outside the habit as menses until it recurs three times or twice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7474} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7475} A habit is even when its days match, or uneven in order or out of order; with an uneven habit the woman follows the rotation if she knows it, otherwise sits for the least. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7476} On patching blood with purity there are two views: the patching view counts only the days of blood, the drawing view counts both as menses under conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7476} There is no limit to the greatest purity; the least is fifteen days for the Hanafis, Malikis and Shafiis, and thirteen for the Hanbalis on a report from Ali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7476} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7477}  Scholars differ on whether the clear interval between two bleedings is menstruation: the Hanafis and Shafiis count it as menses, the Malikis and Hanbalis as purity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7478} The menses of a pregnant woman: the Hanafis and Hanbalis treat it as illness, a point from the hadith forbidding intercourse with a pregnant woman until birth, while the Malikis and Shafiis treat it as menses when its conditions are met. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7478} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7479} Hanafi purity is sound if it lasts fifteen days or more between sound bleedings and unmixed, unsound if shorter or mixed, and complete if of fifteen days even if unsound. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7479} Menstruation is a mark of puberty that brings duty; a woman's bath to lift major impurity during menses is invalid for the majority; the bath after menses is due when the flow stops, with the place perfumed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7479} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7480} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7481}  Scholars agree that prayer falls from a menstruating woman and she does not make it up, while she makes up the fast; the ground is the hadith of Aisha; she may not perform it, and prostration of recitation and of thanks count as prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7482} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7483} A woman who becomes pure at the start of the time of prayer owes it on some views, and the duty drops if the menses comes at a time that drops it; at the end of the time the schools differ on how much time counts: the Hanafis one opening takbir plus the time for the bath, the Malikis one rak'a, the Shafiis and Hanbalis one takbir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7483} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7484} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7485} Fasting is forbidden to the menstruating woman; if she becomes pure before dawn she owes that day's fast, and the schools differ on how much time she needs: the Hanafis require time for the bath and the opening takbir, the Malikis accept a sign, the Shafiis and Hanbalis accept the end of the blood. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7485} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7486}  In the pilgrimage, menses prevents nothing but the circumambulation: baths for the pilgrim are recommended, the arrival circuit is a sunna, the farewell circuit is obligatory on most views, and she may leave without it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7486} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7487} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7488} Recitation of the Quran is forbidden on the majority view; the Hanafis forbid reciting full phrases but not single words; the Shafiis forbid even part of a verse; the Hanbalis forbid a verse and more; the Malikis allow it while the blood flows. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7488} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7489} The schools forbid a menstruating woman to enter the mosque (the Hanafis and Malikis absolutely; the Shafiis and Hanbalis forbid passing through it if she fears soiling it); the place of the festival prayer is disputed, while funeral prayer ground is allowed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7490} All agree that intercourse in the private part is forbidden to a menstruating woman; the schools differ on enjoyment between navel and knee, which most forbid, and the Hanbalis allow everything below the private part. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7490} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7491} Expiation for intercourse during menses is half a dinar for the Hanbalis; the Hanafis and Shafiis recommend a dinar or half according to the time of the blood. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7491} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7492} Intercourse is lawful only when the blood has stopped and she has bathed (majority); the Hanafis distinguish stopping at the greatest length, at the least, or at the end of the habit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7492} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7493} Divorcing a menstruating woman is forbidden and is a form of innovative divorce, by the report of Ibn Umar, and the majority hold that it takes effect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7493} The article closes with general matters: the Hanbalis allow a woman to take a lawful drug to stop menses only with her husband's leave and no harm; a woman's claim of menses is accepted when possible; nifas differs from hayd in the waiting period, the attainment of puberty, the purging of the womb, and the limit of the period. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7494} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7495}"
  ur: "حیض لغت میں بہنے کو کہتے ہیں، اور شرع میں وہ خون ہے جو صحت مند رحم متعین اوقات میں خارج کرتا ہے؛ مذاہب کی تعریفیں مختلف ہیں، اور حیض و نفاس کے معنی مختلف ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7458} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7461} مدخل حیض کو طہر، قرء، استحاضہ اور نفاس سے ممیز کرتا ہے؛ استحاضہ عادت کے اوقات سے باہر خون بہنا ہے، اور نفاس ولادت کے بعد کا خون۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7460} عورت پر حیض کے احکام سیکھنا لازم ہے کیونکہ اس پر عبادات اور معاملات کا دار و مدار ہے؛ حیض اہلیت ختم نہیں کرتا، اور حنفیہ کے نزدیک اس کا رکن خون کا اندرونی حصے سے بیرونی حصے تک نکلنا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7461}  جمہور کے نزدیک حیض کی شرائط میں یہ ہے کہ خون رحم سے ہو نہ کہ ولادت سے، اس سے پہلے پندرہ دن کی طہارت ہو، کم سے کم مدت سے کم نہ ہو، اور عمر حیض کی ہو؛ حنفیہ اور حنابلہ حاملہ نہ ہونے کی شرط بھی بڑھاتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7462} ایام حیض میں زردی اور کدورت جمہور کے نزدیک حیض ہے، جبکہ طہر کے بعد حنفیہ اور حنابلہ کے نزدیک حیض نہیں؛ حنفیہ خون کے چھ رنگ شمار کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7463} حیض کی کم از کم عمر جمہور کے نزدیک نو قمری سال ہے، حنابلہ زیادہ سے زیادہ عمر پچاس سال بتاتے ہیں، حنفیہ اور شافعیہ کوئی حد نہیں رکھتے، اور مالکیہ عرف پر فیصلہ کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7463} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7464} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7465} حاملہ کو خون آنے کی صورت میں مالکیہ کے نزدیک ہر ماہ کا زیادہ سے زیادہ حیض بیس یا تیس دن، شافعیہ اور حنابلہ کے نزدیک کم سے کم ایک دن اور ایک رات، زیادہ سے زیادہ پندرہ دن، اور عام طور پر چھ یا سات دن۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7467} عورتیں تین قسم کی ہیں: مبتدأہ (جس کا پہلے حیض نہ ہوا ہو)، معتادہ (جس کی عادت اور طہر معلوم ہو)، اور متحیرہ (جو اپنی عادت بھول گئی ہو)۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7467} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7468} مبتدأہ کو زمانۂ امکان میں جو خون آئے اور وہ کم سے کم یا زیادہ سے زیادہ حد کے خلاف نہ ہو تو وہ حیض ہے، اور جمہور کے نزدیک زردی اور کدورت بھی حیض کے حکم میں ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7467} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7468} اگر خون زیادہ سے زیادہ مدت سے پہلے رک جائے تو وہ پاک ہے؛ حنابلہ کے نزدیک کم سے کم مدت پر غسل کرکے باقی ایام میں احتیاطاً نماز اور روزہ کریں گی؛ اگر خون زیادہ مدت سے بھی بڑھ جائے تو حنفیہ دس دن حیض اور بیس دن طہر شمار کرتے ہیں، اور مالکیہ پندرہ دن بیٹھنے کا حکم دیتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7468} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7469} جس عورت کی عادت معلوم ہو، اس کے لیے خون کے اوقات عادت کے مطابق ہوں؛ حنابلہ اور شافعیہ کے نزدیک تین بار اور حنفیہ کے نزدیک بار بار تکرار سے عادت بنتی ہے، اور حنفیہ کا اختلاف ہے کہ ایک بار کا تغیر عادت بنے یا نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7470}  عادت کے مطابق خون آئے تو ایام حیض ہیں اور باقی طہر؛ عادت سے پہلے رک جائے تو وہ پاک ہے، اور وطء اور نماز کے بارے میں مذاہب کا اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7471} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7472} خون رک کر دوبارہ آئے تو شافعیہ کے نزدیک شرائط کے ساتھ سب حیض ہے، حنابلہ خالص طہر کو طہر مانتے ہیں، اور حنفیہ کے نزدیک زیادہ سے زیادہ مدت میں واپسی پر طہر باطل ہو جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7471} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7472} جب معتادہ کا خون عادت سے بڑھ جائے تو حنفیہ اسے عادت کی طرف لوٹاتے ہیں جب تک عادت تبدیل نہ ہوئی ہو، اور طہر کی مدت چھ ماہ سے ایک ساعت کم، جبکہ مالکیہ عادت کے بعد تین دن احتیاطاً ٹھہرانے کے قائل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7472} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7473} حنفیہ کے نزدیک جب خون دس دن سے بڑھ جائے تو عادت وقت اور عدد کے اعتبار سے منتقل ہوتی ہے؛ مالکیہ، شافعیہ اور حنابلہ کے نزدیک عادت آگے یا پیچھے، زیادہ یا کم ہو سکتی ہے، اور حنابلہ عادت سے ہٹ کر خون کو تین یا دو بار تکرار کے بغیر حیض نہیں مانتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7474} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7475} عادت متفق ہو سکتی ہے یا مختلف (مرتب یا غیر مرتب)، اور مختلف عادت میں نوبت معلوم ہو تو اس پر عمل، ورنہ کم ترین مدت پر بیٹھنا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7476} تلفیق کے بارے میں دو قول ہیں: تلفیق میں صرف خون کے ایام شمار ہوتے ہیں، اور سحب میں شرائط کے ساتھ خون اور طہر دونوں حیض شمار ہوتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7476} زیادہ سے زیادہ طہر کی کوئی حد نہیں؛ کم سے کم حنفیہ، مالکیہ اور شافعیہ کے نزدیک پندرہ دن اور حنابلہ کے نزدیک تیرہ دن، جو حضرت علی کے ایک اثر پر مبنی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7476} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7477}  حیض کے دوران دو خونوں کے درمیان صاف حصہ حیض ہے یا طہر، اس میں اختلاف ہے: حنفیہ اور شافعیہ اسے حیض، مالکیہ اور حنابلہ طہر کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7478} حاملہ کا خون: حنفیہ اور حنابلہ اسے بیماری کا خون کہتے ہیں، حدیث «لا توطأ حامل حتى تضع» کی بنا پر، جبکہ مالکیہ اور شافعیہ شرائط پوری ہونے پر اسے حیض مانتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7478} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7479} حنفیہ کے نزدیک طہر صحیح وہ ہے جو دو صحیح خونوں کے درمیان خالص پندرہ دن یا زیادہ ہو، فاسد وہ ہے جو کم ہو یا اس میں خون ملا ہو، اور تام وہ ہے جو پندرہ دن کا ہو چاہے فاسد ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7479} حیض بلوغ کی علامت ہے جس سے تکلیف عائد ہوتی ہے؛ جمہور کے نزدیک حالت حیض میں جنابت کا غسل درست نہیں، اور حیض کے بعد غسل خون رکنے پر واجب ہوتا ہے، اور جگہ کو خوشبودار کرنا مستحب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7479} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7480} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7481}  علماء کا اتفاق ہے کہ حیض میں نماز ساقط ہے اور اس کی قضا نہیں، جبکہ روزے کی قضا ہے، اور اس کی دلیل حضرت عائشہ کی روایت ہے؛ نماز پڑھنا حرام ہے، اور سجدہ تلاوت و شکر بھی نماز کے حکم میں ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7482} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7483} جو عورت وقت کے اول میں پاک ہو اس پر بعض کے نزدیک نماز واجب ہے، اور ایسے وقت میں حیض آنے پر وجوب ساقط ہو جاتا ہے؛ آخر وقت میں مدت کا اعتبار مختلف ہے: حن