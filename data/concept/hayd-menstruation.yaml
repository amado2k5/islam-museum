id: concept/hayd-menstruation
class: concept
kind: legal
label: { ar: "الحيض", en: "Hayd (menstruation)", ur: "حیض", es: "Menstruación", fr: "Menstruation" }
summary:
  ar: "الحيض لغة السيلان، وهو في الشرع دم ينفضه رحم المرأة السليمة في أوقات معلومة، وتعددت التعريفات بحسب المذاهب، والحيض والنفاس مختلفان في المفهوم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7458} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7461} ويفرق المدخل بين الحيض والطهر والقرء والاستحاضة والنفاس؛ فالاستحاضة سيلان دم في غير أوقاته المعتادة، والنفاس الدم الخارج بعد الولادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7460} ويجب على المرأة تعلم أحكام الحيض لما يترتب عليه من عبادات ومعاملات، ولا يعدم الحيض الأهلية، وركنه عند الحنفية بروز الدم من الفرج الداخل إلى الخارج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7461}  ومن شروط الحيض عند الجمهور أن يكون الدم خارجا من الرحم لا بسبب ولادة، وأن يتقدمه طهر خمسة عشر يوما، وألا ينقص عن أقله، وأن يكون في سن الحيض؛ وزاد الحنفية والحنابلة أن لا تكون حاملا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7462} والصفرة والكدرة في أيام الحيض حيض عند الجمهور، وليستا بحيض بعد الطهر عند الحنفية والحنابلة؛ ولهم تفصيل في ألوان الدم الستة عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7463} وأقل سن تحيض فيه المرأة تسع سنين قمرية عند الجمهور، وأكثرها عند الحنابلة خمسون سنة، والحنفية والشافعية لا يحدون، والمالكية لهم تفاصيل بالعرف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7463} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7464} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7465} وفي حيض الحامل تفصيل: يعتبر أكثر الحيض في الشهور المختلفة عشرين أو ثلاثين يوما عند المالكية، وأقل الحيض يوم وليلة عند الشافعية والحنابلة، وأكثره خمسة عشر يوما، وغالبه ست أو سبع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7467} والمرأة أقسام: المبتدأة وهي التي لم يتقدم لها حيض، والمعتادة وهي التي عرفت حيضها وطهرها، والمتحيرة وهي التي نسيت عادتها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7467} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7468} والمبتدأة إذا رأت الدم في زمن الإمكان ولم ينقص عن أقله أو يزد على أكثره فهو حيض، ويجري الصفرة والكدرة مجرى الحيض عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7467} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7468} وإذا انقطع الدم دون أكثر الحيض طهرت، وعند الحنابلة تغتسل عند أقل الحيض وتصلي وتصوم فيما جاوزه احتياطا؛ وإذا استمر الدم وجاوز أكثر الحيض فالحنفية يجعلون الحيض عشرة والطهر عشرين، والمالكية يرون مكثها خمسة عشر يوما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7468} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7469} وتثبت العادة عند الحنابلة بثلاث مرات، وعند الشافعية والحنفية بتكرار ما يتعلق بالدم والطهر، ويختلف محمد وأبو يوسف فيما يصير عادة بمرة، وتنقطع العادة بمخالفة متكررة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7470}  المعتادة إذا وافق الدم عادتها فأيامه حيض وما بعده طهر، وإن انقطع دون العادة فإنها تطهر، واختلف الفقهاء في وطئها وفي الصلاة عند الانقطاع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7471} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7472} وإذا عاد الدم بعد انقطاعه فالحنفية والمالكية والشافعية والحنابلة يختلفون: فالشافعية بالسحب أي أن الكل حيض بشروط، والحنابلة يرون الطهر الخالص طهرا، وعند الحنفية يبطل حكم الطهر إن عاد الدم في مدة أكثر الحيض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7471} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7472} وإذا جاوز دم المعتادة عادتها، فالحنفية يردون المرأة إلى عادتها ما لم تنتقل، والطهر عند أكثرهم ستة أشهر إلا ساعة، وفي قول شهران؛ والمالكية يستظهرون ثلاثة أيام بعد عادتهم، ويزيدون على كل تكرار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7472} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7473} وتنتقل العادة عند الحنفية بحسب الزمن والعدد إذا جاوز الدم العشرة، وتنتقل عند المالكية والشافعية والحنابلة تقدما وتأخرا وزيادة ونقصا؛ والحنابلة لا يعتبرون الخارج عن العادة حيضا حتى يتكرر ثلاثا أو مرتين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7474} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7475} والعادة متفقة إن تساوت أيامها، ومختلفة مرتبة أو غير مرتبة، وفي المختلفة يعمل المرأة على النوبة أو تجلس الأقل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7476} وفي التلفيق قولان: قول التلفيق بأن يحسب أيام الدم فقط، وقول السحب بأن تحسب أيام الدم والطهر كلها حيضا بشروط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7476} وأكثر الطهر لا حد له، وأقله عند الحنفية والمالكية والشافعية خمسة عشر يوما، وعند الحنابلة ثلاثة عشر يوما، احتجاجا بأثر عن علي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7476} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7477}  واختلف الفقهاء في النقاء المتخلل بين أيام الحيض: فالحنفية والشافعية يجعلونه حيضا، والمالكية والحنابلة طهرا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7478} ودم الحامل: الحنفية والحنابلة يرونه دم علة وفساد لحديث النهي عن وطء الحامل حتى تضع، والمالكية والشافعية يرونه حيضا إن توافرت شروطه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7478} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7479} والطهر عند الحنفية صحيح إن بلغ خمسة عشر يوما بين دمين صحيحين خالصا، وفاسد إن نقص أو خالطه دم، وتام إن بلغ خمسة عشر ولو فاسدا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7479} والحيض علامة من علامات البلوغ التي يحصل بها التكليف، ولا يصح غسل الحائض عند الجمهور لرفع الجنابة في زمن الحيض، وغسل الحيض يجب بانقطاع الدم وتطييب موضعه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7479} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7480} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7481}  وتسقط الصلاة عن الحائض بإجماع الفقهاء، ولا تقضيها، وتقضي الصوم، وتعليل ذلك بحديث عائشة، ويحرم عليها أداؤها، وسجود التلاوة والشكر في معنى الصلاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7482} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7483} وتجب الصلاة على من طهرت في أول الوقت عند بعضهم، ويسقط الوجوب إن طرأ الحيض في وقت يسقط فيه، وفي آخر الوقت يتفاوت الفقهاء في مقدار الإدراك: الحنفية بقدر تكبيرة التحريمة وزمن الغسل، والمالكية بركعة، والشافعية والحنابلة بتكبيرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7483} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7484} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7485} ويحرم الصوم على الحائض مطلقا، ويجب عليها صوم اليوم إذا طهرت قبل الفجر، واختلفوا في المدة التي يجزئها فيها صوم اليوم: الحنفية يشترطون زمن الغسل والتحريمة، والمالكية يكتفون بالعلامة، والشافعية والحنابلة يكتفون بانقطاع الدم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7485} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7486}  وفي الحج لا يمنع الحيض شيئا من أعمال الحج إلا الطواف، وأغسال الحج مسنونة للحائض؛ ومن الطواف: القدوم سنة والإفاضة ركن والوداع واجب، وللحائض أن تنفر بلا وداع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7486} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7487} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7488} وقراءة القرآن ممنوعة عند الجمهور، والحنفية يفرقون بين القصد والدعاء، ويمنعون قراءة المركبات دون المفردات، والشافعية يمنعون ولو بعض آية، والحنابلة يمنعون آية فصاعدا، والمالكية يجيزونها أثناء سيلان الدم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7488} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7489} وحرم الحيض على الحائض أن تدخل المسجد عند الحنفية والمالكية، والشافعية والحنابلة يحرمون المرور إن خافت التلويث؛ وفي مصلى العيد اختلاف، وتصح صلاة الجنازة في مصلاها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7490} وأجمع الفقهاء على تحريم وطء الحائض في الفرج، واختلفوا في الاستمتاع بما بين السرة والركبة؛ فجمهور المذاهب يمنعونه، والحنابلة يجيزون ما دون الفرج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7490} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7491} وفي كفارة وطء الحائض يوجب الحنابلة نصف دينار، ويستحب الحنفية والشافعية الصدقة بدينار أو نصفه بحسب وقت الدم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7491} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7492} ولا يحل الوطء حتى ينقطع الدم ويغتسل عند الجمهور؛ والحنفية يفرقون بين انقطاع الدم لأكثر الحيض ولأقله ولتمام العادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7492} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7493} وطلاق الحائض حرام وهو من البدعي، لحديث ابن عمر، وجمهور الفقهاء على وقوعه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7493} ويُختم الحيض بمسائل عامة: لا يجوز منع الحيض بالدواء عند الحنابلة إلا بإذن الزوج وبشرط أمن الضرر؛ وادعاء الحيض يقبل منها إن أمكن؛ والنفاس يخالف الحيض في العدة والبلوغ والاستبراء وغيرها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7494} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7495}"
  en: "Hayd (menstruation) is lexically a flowing; in the law it is blood that a healthy womb expels at fixed times, and the definitions differ by school; hayd and nifas are different in meaning. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7458} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7461} The article distinguishes hayd from tuhr (purity), qur' (a period which is both), istihada (blood outside its times) and nifas (blood after birth). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7460} A woman must learn the rules of menstruation because they govern worship and dealings, the monthly courses do not remove legal capacity, and the Hanafi condition is the emergence of the blood from the inner to the outer part. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7461}  Among the conditions of menstruation the majority require blood issuing from the womb not from childbirth, a preceding purity of fifteen days, a flow not less than the least period, and an age of menstruation; the Hanafis and Hanbalis add that she is not pregnant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7462} Yellowness and turbidity during the days of menses count as menses for the majority, and do not after purity for the Hanafis and Hanbalis; the Hanafis list six colours of the blood. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7463} The least age for menstruation is nine lunar years for the majority, the Hanbalis put the greatest age at fifty, the Hanafis and Shafiis set none, and the Malikis judge by custom. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7463} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7464} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7465} For a pregnant woman who bleeds, the Malikis set the longest menses at twenty or thirty days by month, the least at a day and a night in the Shafii and Hanbali view, the longest at fifteen days, and the common course at six or seven days. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7467} A woman is a first-timer (no prior course), a woman of habit (known course and purity), or confused (has forgotten her habit). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7467} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7468} A first-timer whose blood comes at a time it can (and within the least and greatest lengths) has menstruation, and yellowish or turbid discharge counts as menses for the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7467} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7468} If the blood stops before the greatest length she is pure; the Hanbalis bathe at the least length and pray and fast in the rest as a precaution; if the flow continues past the greatest length, the Hanafis count ten days as menses and twenty as purity each month. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7468} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7469} A woman of habit has one rule for the blood: the blood must come at the time of her habit. It is confirmed by three cycles on the Hanbali and Shafii views and by repetition on the Hanafi view; the Hanafis differ on whether one change becomes a new habit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7470}  When a habitual woman's blood matches her habit, its days are menses and the rest purity; when it stops before the habit she is pure but the schools differ on intercourse and prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7471} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7472} When blood returns after a break, the Shafiis count the break as menses under conditions, the Hanbalis count a clear purity as purity, and the Hanafis cancel the purity if the blood returns within the greatest length. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7471} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7472} When a habitual woman's blood exceeds her habit, the Hanafis return her to her habit unless the habit has changed and set the purity at six months less an hour (a view of the Hanafi scholars), the Malikis add three days of caution to her habit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7472} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7473} Habit changes on the Hanafi view by time and count once blood exceeds ten days; the Malikis, Shafiis and Hanbalis let habit move earlier or later, grow or shrink; the Hanbalis count nothing outside the habit as menses until it recurs three times or twice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7474} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7475} A habit is even when its days match, or uneven in order or out of order; with an uneven habit the woman follows the rotation if she knows it, otherwise sits for the least. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7476} On patching blood with purity there are two views: the patching view counts only the days of blood, the drawing view counts both as menses under conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7476} There is no limit to the greatest purity; the least is fifteen days for the Hanafis, Malikis and Shafiis, and thirteen for the Hanbalis on a report from Ali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7476} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7477}  Scholars differ on whether the clear interval between two bleedings is menstruation: the Hanafis and Shafiis count it as menses, the Malikis and Hanbalis as purity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7478} The menses of a pregnant woman: the Hanafis and Hanbalis treat it as illness, a point from the hadith forbidding intercourse with a pregnant woman until birth, while the Malikis and Shafiis treat it as menses when its conditions are met. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7478} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7479} Hanafi purity is sound if it lasts fifteen days or more between sound bleedings and unmixed, unsound if shorter or mixed, and complete if of fifteen days even if unsound. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7479} Menstruation is a mark of puberty that brings duty; a woman's bath to lift major impurity during menses is invalid for the majority; the bath after menses is due when the flow stops, with the place perfumed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7479} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7480} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7481}  Scholars agree that prayer falls from a menstruating woman and she does not make it up, while she makes up the fast; the ground is the hadith of Aisha; she may not perform it, and prostration of recitation and of thanks count as prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7482} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7483} A woman who becomes pure at the start of the time of prayer owes it on some views, and the duty drops if the menses comes at a time that drops it; at the end of the time the schools differ on how much time counts: the Hanafis one opening takbir plus the time for the bath, the Malikis one rak'a, the Shafiis and Hanbalis one takbir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7483} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7484} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7485} Fasting is forbidden to the menstruating woman; if she becomes pure before dawn she owes that day's fast, and the schools differ on how much time she needs: the Hanafis require time for the bath and the opening takbir, the Malikis accept a sign, the Shafiis and Hanbalis accept the end of the blood. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7485} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7486}  In the pilgrimage, menses prevents nothing but the circumambulation: baths for the pilgrim are recommended, the arrival circuit is a sunna, the farewell circuit is obligatory on most views, and she may leave without it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7486} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7487} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7488} Recitation of the Quran is forbidden on the majority view; the Hanafis forbid reciting full phrases but not single words; the Shafiis forbid even part of a verse; the Hanbalis forbid a verse and more; the Malikis allow it while the blood flows. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7488} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7489} The schools forbid a menstruating woman to enter the mosque (the Hanafis and Malikis absolutely; the Shafiis and Hanbalis forbid passing through it if she fears soiling it); the place of the festival prayer is disputed, while funeral prayer ground is allowed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7490} All agree that intercourse in the private part is forbidden to a menstruating woman; the schools differ on enjoyment between navel and knee, which most forbid, and the Hanbalis allow everything below the private part. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7490} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7491} Expiation for intercourse during menses is half a dinar for the Hanbalis; the Hanafis and Shafiis recommend a dinar or half according to the time of the blood. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7491} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7492} Intercourse is lawful only when the blood has stopped and she has bathed (majority); the Hanafis distinguish stopping at the greatest length, at the least, or at the end of the habit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7492} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7493} Divorcing a menstruating woman is forbidden and is a form of innovative divorce, by the report of Ibn Umar, and the majority hold that it takes effect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7493} The article closes with general matters: the Hanbalis allow a woman to take a lawful drug to stop menses only with her husband's leave and no harm; a woman's claim of menses is accepted when possible; nifas differs from hayd in the waiting period, the attainment of puberty, the purging of the womb, and the limit of the period. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7494} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7495}"
  ur: "حیض لغت میں بہنے کو کہتے ہیں، اور شرع میں وہ خون ہے جو صحت مند رحم متعین اوقات میں خارج کرتا ہے؛ مذاہب کی تعریفیں مختلف ہیں، اور حیض و نفاس کے معنی مختلف ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7458} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7461} مدخل حیض کو طہر، قرء، استحاضہ اور نفاس سے ممیز کرتا ہے؛ استحاضہ عادت کے اوقات سے باہر خون بہنا ہے، اور نفاس ولادت کے بعد کا خون۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7460} عورت پر حیض کے احکام سیکھنا لازم ہے کیونکہ اس پر عبادات اور معاملات کا دار و مدار ہے؛ حیض اہلیت ختم نہیں کرتا، اور حنفیہ کے نزدیک اس کا رکن خون کا اندرونی حصے سے بیرونی حصے تک نکلنا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7461}  جمہور کے نزدیک حیض کی شرائط میں یہ ہے کہ خون رحم سے ہو نہ کہ ولادت سے، اس سے پہلے پندرہ دن کی طہارت ہو، کم سے کم مدت سے کم نہ ہو، اور عمر حیض کی ہو؛ حنفیہ اور حنابلہ حاملہ نہ ہونے کی شرط بھی بڑھاتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7462} ایام حیض میں زردی اور کدورت جمہور کے نزدیک حیض ہے، جبکہ طہر کے بعد حنفیہ اور حنابلہ کے نزدیک حیض نہیں؛ حنفیہ خون کے چھ رنگ شمار کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7463} حیض کی کم از کم عمر جمہور کے نزدیک نو قمری سال ہے، حنابلہ زیادہ سے زیادہ عمر پچاس سال بتاتے ہیں، حنفیہ اور شافعیہ کوئی حد نہیں رکھتے، اور مالکیہ عرف پر فیصلہ کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7463} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7464} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7465} حاملہ کو خون آنے کی صورت میں مالکیہ کے نزدیک ہر ماہ کا زیادہ سے زیادہ حیض بیس یا تیس دن، شافعیہ اور حنابلہ کے نزدیک کم سے کم ایک دن اور ایک رات، زیادہ سے زیادہ پندرہ دن، اور عام طور پر چھ یا سات دن۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7467} عورتیں تین قسم کی ہیں: مبتدأہ ⁦(جس کا پہلے حیض نہ ہوا ہو)⁩، معتادہ ⁦(جس کی عادت اور طہر معلوم ہو)⁩، اور متحیرہ ⁦(جو اپنی عادت بھول گئی ہو)⁩۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7467} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7468} مبتدأہ کو زمانۂ امکان میں جو خون آئے اور وہ کم سے کم یا زیادہ سے زیادہ حد کے خلاف نہ ہو تو وہ حیض ہے، اور جمہور کے نزدیک زردی اور کدورت بھی حیض کے حکم میں ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7467} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7468} اگر خون زیادہ سے زیادہ مدت سے پہلے رک جائے تو وہ پاک ہے؛ حنابلہ کے نزدیک کم سے کم مدت پر غسل کرکے باقی ایام میں احتیاطاً نماز اور روزہ کریں گی؛ اگر خون زیادہ مدت سے بھی بڑھ جائے تو حنفیہ دس دن حیض اور بیس دن طہر شمار کرتے ہیں، اور مالکیہ پندرہ دن بیٹھنے کا حکم دیتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7468} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7469} جس عورت کی عادت معلوم ہو، اس کے لیے خون کے اوقات عادت کے مطابق ہوں؛ حنابلہ اور شافعیہ کے نزدیک تین بار اور حنفیہ کے نزدیک بار بار تکرار سے عادت بنتی ہے، اور حنفیہ کا اختلاف ہے کہ ایک بار کا تغیر عادت بنے یا نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7470}  عادت کے مطابق خون آئے تو ایام حیض ہیں اور باقی طہر؛ عادت سے پہلے رک جائے تو وہ پاک ہے، اور وطء اور نماز کے بارے میں مذاہب کا اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7471} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7472} خون رک کر دوبارہ آئے تو شافعیہ کے نزدیک شرائط کے ساتھ سب حیض ہے، حنابلہ خالص طہر کو طہر مانتے ہیں، اور حنفیہ کے نزدیک زیادہ سے زیادہ مدت میں واپسی پر طہر باطل ہو جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7471} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7472} جب معتادہ کا خون عادت سے بڑھ جائے تو حنفیہ اسے عادت کی طرف لوٹاتے ہیں جب تک عادت تبدیل نہ ہوئی ہو، اور طہر کی مدت چھ ماہ سے ایک ساعت کم، جبکہ مالکیہ عادت کے بعد تین دن احتیاطاً ٹھہرانے کے قائل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7472} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7473} حنفیہ کے نزدیک جب خون دس دن سے بڑھ جائے تو عادت وقت اور عدد کے اعتبار سے منتقل ہوتی ہے؛ مالکیہ، شافعیہ اور حنابلہ کے نزدیک عادت آگے یا پیچھے، زیادہ یا کم ہو سکتی ہے، اور حنابلہ عادت سے ہٹ کر خون کو تین یا دو بار تکرار کے بغیر حیض نہیں مانتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7474} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7475} عادت متفق ہو سکتی ہے یا مختلف ⁦(مرتب یا غیر مرتب)⁩، اور مختلف عادت میں نوبت معلوم ہو تو اس پر عمل، ورنہ کم ترین مدت پر بیٹھنا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7476} تلفیق کے بارے میں دو قول ہیں: تلفیق میں صرف خون کے ایام شمار ہوتے ہیں، اور سحب میں شرائط کے ساتھ خون اور طہر دونوں حیض شمار ہوتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7476} زیادہ سے زیادہ طہر کی کوئی حد نہیں؛ کم سے کم حنفیہ، مالکیہ اور شافعیہ کے نزدیک پندرہ دن اور حنابلہ کے نزدیک تیرہ دن، جو حضرت علی کے ایک اثر پر مبنی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7476} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7477}  حیض کے دوران دو خونوں کے درمیان صاف حصہ حیض ہے یا طہر، اس میں اختلاف ہے: حنفیہ اور شافعیہ اسے حیض، مالکیہ اور حنابلہ طہر کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7478} حاملہ کا خون: حنفیہ اور حنابلہ اسے بیماری کا خون کہتے ہیں، حدیث «لا توطأ حامل حتى تضع» کی بنا پر، جبکہ مالکیہ اور شافعیہ شرائط پوری ہونے پر اسے حیض مانتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7478} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7479} حنفیہ کے نزدیک طہر صحیح وہ ہے جو دو صحیح خونوں کے درمیان خالص پندرہ دن یا زیادہ ہو، فاسد وہ ہے جو کم ہو یا اس میں خون ملا ہو، اور تام وہ ہے جو پندرہ دن کا ہو چاہے فاسد ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7479} حیض بلوغ کی علامت ہے جس سے تکلیف عائد ہوتی ہے؛ جمہور کے نزدیک حالت حیض میں جنابت کا غسل درست نہیں، اور حیض کے بعد غسل خون رکنے پر واجب ہوتا ہے، اور جگہ کو خوشبودار کرنا مستحب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7479} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7480} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7481}  علماء کا اتفاق ہے کہ حیض میں نماز ساقط ہے اور اس کی قضا نہیں، جبکہ روزے کی قضا ہے، اور اس کی دلیل حضرت عائشہ کی روایت ہے؛ نماز پڑھنا حرام ہے، اور سجدہ تلاوت و شکر بھی نماز کے حکم میں ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7482} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7483} جو عورت وقت کے اول میں پاک ہو اس پر بعض کے نزدیک نماز واجب ہے، اور ایسے وقت میں حیض آنے پر وجوب ساقط ہو جاتا ہے؛ آخر وقت میں مدت کا اعتبار مختلف ہے: حنفیہ تکبیر تحریمہ اور غسل کے وقت کے برابر، مالکیہ ایک رکعت، شافعیہ اور حنابلہ ایک تکبیر کے برابر۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7483} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7484} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7485} حالتِ حیض میں روزہ حرام ہے، اور اگر فجر سے پہلے پاک ہو جائے تو اس دن کا روزہ لازم ہے؛ کتنی مدت درکار ہے اس میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7485} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7486}  حج میں حیض طواف کے سوا کسی کام میں رکاوٹ نہیں؛ حاجیہ کے لیے احرام اور مکہ میں داخلے کے غسل مسنون ہیں؛ طواف قدوم سنت، طواف افاضہ رکن اور طواف وداع واجب ہے، اور حائضہ بغیر طواف وداع کے لوٹ سکتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7486} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7487} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7488} جمہور کے نزدیک حیض میں قرآن کی تلاوت حرام ہے؛ حنفیہ کامل جملے کی تلاوت سے منع کرتے ہیں مگر الفاظ کی نہیں؛ شافعیہ آیت کا حصہ بھی منع کرتے ہیں، حنابلہ ایک آیت یا زیادہ کو منع، اور مالکیہ خون بہنے کی حالت میں جائز کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7488} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7489} حنفیہ اور مالکیہ کے نزدیک حائضہ کو مسجد میں داخل ہونا مطلقاً حرام ہے، جبکہ شافعیہ اور حنابلہ گزرنے کو اس صورت میں حرام کہتے ہیں جب مسجد آلودہ ہونے کا خوف ہو؛ عید گاہ میں اختلاف ہے، اور جنازہ گاہ میں جانا جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7490} فرج میں وطء بالاتفاق حرام ہے، اور ناف سے گھٹنے تک کے استمتاع میں اختلاف ہے؛ جمہور اسے منع کرتے ہیں، جبکہ حنابلہ فرج کے سوا ہر چیز کی اجازت دیتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7490} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7491} حیض کے دوران وطء کا کفارہ حنابلہ کے نزدیک نصف دینار ہے، اور حنفیہ و شافعیہ خون کے وقت کے اعتبار سے ایک یا آدھے دینار کی صدقہ کو مستحب کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7491} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7492} جمہور کے نزدیک خون رکنے اور غسل کے بعد ہی وطء حلال ہے؛ حنفیہ اکثر مدت، کم از کم مدت اور تمام عادت پر خون رکنے کے فرق کے قائل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7492} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7493} حائضہ کو طلاق دینا حرام اور بدعی طلاق ہے، جیسا کہ ابن عمر کی روایت میں ہے، اور جمہور کے نزدیک یہ واقع ہو جاتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7493} مدخل کا اختتام عمومی مسائل پر ہے: حنابلہ کے نزدیک دوا سے حیض روکنا شوہر کی اجازت اور نقصان کے خوف نہ ہونے کی صورت میں جائز ہے؛ حیض کا دعویٰ ممکن ہو تو مانا جاتا ہے؛ اور نفاس حیض سے عدت، بلوغ، استبراء اور مدت میں مختلف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7494} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7495}"
  es: "Hayd (menstruación) es léxicamente fluido; en la ley es sangre la que un útero sano expulsa en momentos determinados, y las definiciones difieren según la escuela; hayd y nifas tienen un significado diferente. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7458} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7459} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7460} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7461} El artículo distingue hayd de tuhr (pureza), qur' (un período que es ambos), istihada (sangre fuera de sus tiempos) y nifas (sangre después del nacimiento). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7460} Una mujer debe aprender las reglas de la menstruación porque rigen el culto y los tratos, los cursos mensuales no eliminan la capacidad legal, y la condición Hanafi es la emergencia de la sangre de la parte interna a la externa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7461} Entre las condiciones de la menstruación, la mayoría requiere sangre que sale del útero y no del parto, una pureza previa de quince días, un flujo no menor que el período más corto y una edad de menstruación; los Hanafi y Hanbali agregan que no está embarazada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7462} El color amarillento y la turbidez durante los días de la menstruación cuentan como menstruación para la mayoría, y no después de la pureza para los Hanafis y Hanbalis; los Hanafis enumeran seis colores de la sangre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7463} La edad mínima para la menstruación es de nueve años lunares para la mayoría, los Hanbalis establecen la edad máxima en cincuenta, los Hanafis y Shafiis no establecen ninguna, y los Malikis juzgan por costumbre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7463} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7464} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7465} Para una mujer embarazada que sangra, los Malikis establecen la menstruación más larga en veinte o treinta días al mes, la más corta en un día y una noche según la visión Shafii y Hanbali, la más larga en quince días y el curso común en seis o siete días. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7467} Una mujer es primeriza (sin curso previo), mujer de costumbre (curso conocido y pureza), o confundida (ha olvidado su costumbre). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7467} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7468} Una primeriza cuya sangre llega en el momento en que puede (y dentro de las longitudes mínima y máxima) tiene menstruación, y el flujo amarillento o turbio cuenta como menstruación para la mayoría. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7467} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7468} Si la sangre se detiene antes de la longitud máxima, ella es pura; los hanbalíes se bañan en la longitud mínima y rezan y ayunan en el resto como precaución; si el flujo continúa más allá de la longitud máxima, los hanafíes cuentan diez días como menstruación y veinte como pureza cada mes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7468} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7469} Una mujer de hábito tiene una regla para la sangre: la sangre debe venir en el momento de su hábito. Se confirma por tres ciclos en las opiniones hanbalíes y shafiíes y por repetición en la opinión hanafí; los hanafíes difieren en si un cambio se convierte en un nuevo hábito. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7470} Cuando la sangre de una mujer habitual coincide con su hábito, sus días son menstruación y el resto pureza; cuando se detiene antes del hábito, ella es pura, pero las escuelas difieren en cuanto a la relación sexual y la oración. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7471} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7472} Cuando la sangre regresa después de una interrupción, los shafiíes cuentan la interrupción como menstruación bajo ciertas condiciones, los hanbalíes cuentan una pureza clara como pureza, y los hanafíes cancelan la pureza si la sangre regresa dentro de la mayor duración. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7471} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7472} Cuando la sangre de una mujer habitual excede su hábito, los Hanafi la devuelven a su hábito a menos que el hábito haya cambiado y establecen la pureza en seis meses menos una hora (una opinión de los eruditos Hanafi), los Malikis agregan tres días de precaución a su hábito. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7472} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7473} El hábito cambia en la visión Hanafi por tiempo y cuenta una vez que la sangre excede los diez días; los Malikis, Shafiis y Hanbalis permiten que el hábito se mueva antes o después, crezca o disminuya; los Hanbalis no cuentan nada fuera del hábito como menstruación hasta que se repite tres veces o dos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7474} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7475} Un hábito es uniforme cuando sus días coinciden, o desigual en orden o fuera de orden; con un hábito desigual, la mujer sigue la rotación si la conoce, de lo contrario se sienta para el menor tiempo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7476} Sobre el parche de sangre con pureza hay dos puntos de vista: el punto de parche cuenta solo los días de sangre, el punto de extracción cuenta ambos como menstruación bajo condiciones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7476} No hay límite para la mayor pureza; el menor es de quince días para los Hanafi, Maliki y Shafii, y trece para los Hanbali según un informe de Ali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7476} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7477} Los eruditos difieren sobre si el intervalo claro entre dos sangrados es menstruación: los Hanafis y Shafiis lo cuentan como menstruación, los Malikis y Hanbalis como pureza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7478} La menstruación de una mujer embarazada: los Hanafis y Hanbalis la tratan como enfermedad, un punto del hadiz que prohíbe el coito con una mujer embarazada hasta el parto, mientras que los Malikis y Shafiis la tratan como menstruación cuando se cumplen sus condiciones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7478} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7479} La pureza Hanafi es sólida si dura quince días o más entre sangrados sanos y no mezclados, no sólida si es más corta o mezclada, y completa si es de quince días incluso si no es sólida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7479} La menstruación es una marca de la pubertad que trae consigo un deber; el baño de una mujer para eliminar la impureza mayor durante la menstruación es inválido para la mayoría; el baño después de la menstruación debe hacerse cuando cesa el flujo, con el lugar perfumado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7479} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7480} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7481} Los eruditos concuerdan en que la oración se pierde para una mujer menstruante y ella no la recupera, mientras que recupera el ayuno; el fundamento es el hadiz de Aisha; ella no puede realizarla, y la postración de recitación y de agradecimiento cuenta como oración. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7482} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7483} Una mujer que se purifica al comienzo del tiempo de oración la debe según algunas opiniones, y el deber se pierde si la menstruación llega en un momento que la pierde; Al final del tiempo, las escuelas difieren en cuánto tiempo cuenta: los Hanafis un takbir de apertura más el tiempo para el baño, los Malikis un rak'a, los Shafiis y Hanbalis un takbir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7483} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7484} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7485} El ayuno está prohibido para la mujer menstruante; si se purifica antes del amanecer, debe el ayuno de ese día, y las escuelas difieren en cuánto tiempo necesita: los Hanafis requieren tiempo para el baño y el takbir de apertura, los Malikis aceptan una señal, los Shafiis y Hanbalis aceptan el final de la sangre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7485} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7486} En la peregrinación, la menstruación no impide más que la circunvalación: se recomiendan baños para la peregrina, el circuito de llegada es una sunna, el circuito de despedida es obligatorio en la mayoría de las visitas y puede salir sin él. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7486} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7487} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7488} La recitación del Corán está prohibida según la opinión mayoritaria; los hanafis prohíben recitar frases completas pero no palabras sueltas; los Shafiis prohíben incluso parte de un verso; Los hanbalíes prohíben un versículo y más; los malikíes lo permiten mientras fluye la sangre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7488} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7489} Las escuelas prohíben a una mujer menstruante entrar en la mezquita (los hanafíes y los malikíes absolutamente; los shafiíes y los hanbalíes prohíben pasar por ella si teme ensuciarla); el lugar de la oración festiva es disputado, mientras que el lugar de oración funeraria está permitido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7490} Todos están de acuerdo en que el coito en la parte privada está prohibido para una mujer menstruante; las escuelas difieren en el disfrute entre el ombligo y la rodilla, que la mayoría prohíbe, y los hanbalíes permiten todo por debajo de la parte privada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7490} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7491} La expiación por coito durante la menstruación es medio dinar para los Hanbalis; los Hanafis y Shafiis recomiendan un dinar o medio según el tiempo de la sangre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7491} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7492} El coito es lícito solo cuando la sangre ha cesado y ella se ha bañado (mayoría de edad); los Hanafis distinguen entre detenerse en la mayor duración, en la menor o al final del hábito. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7492} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7493} Divorciarse de una mujer menstruante está prohibido y es una forma de divorcio innovador, según el informe de Ibn Umar, y la mayoría sostiene que tiene efecto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7493} El artículo concluye con asuntos generales: los hanbalíes permiten que una mujer tome un medicamento lícito para detener la menstruación solo con el permiso de su esposo y sin daño alguno; la afirmación de una mujer sobre la menstruación se acepta cuando es posible; nifas difiere de hayd en el período de espera, el logro de la pubertad, la purga del útero y el límite del período. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7494} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7495}"
  fr: "Hayd (menstruation) est lexicalement un fluide; dans la loi, c'est le sang qu'un ventre sain expulse à des moments fixes, et les définitions diffèrent selon les écoles; Hayd et Nifas ont des significations différentes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7458} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7461} L'article distingue le hayd du tuhr (pureté), du qur' (une période qui est les deux), de l'istihada (le sang en dehors de son temps) et du nifas (le sang après la naissance). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7460} Une femme doit connaître les règles relatives aux menstruations car elles régissent le culte et les relations humaines; les règles mensuelles n’altèrent pas la capacité juridique, et la condition hanafite est l’écoulement du sang de l’intérieur vers l’extérieur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7461} Parmi les conditions des menstruations, la majorité exige que le sang provienne de l’utérus et non d’un accouchement, qu’elle ait été pure pendant quinze jours au préalable, que le flux soit au moins aussi abondant que les règles les plus légères, et qu’elle ait atteint l’âge des menstruations; les hanafites et les hanbalites ajoutent qu’elle n’est pas enceinte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7462} La jaunisse et la turbidité du sang pendant les menstruations sont considérées comme des menstruations par la majorité des femmes, mais pas après la purification par les hanafites et les hanbalites; les hanafites recensent six couleurs de sang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7463} L’âge minimum des premières menstruations est de neuf années lunaires pour la majorité des femmes, les hanbalites fixent l’âge maximum à cinquante ans, les hanafites et les chaféites ne fixent aucun âge minimum, et les malikites se basent sur la coutume. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7463} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7464} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7465} Pour une femme enceinte qui saigne, les Malikites fixent les menstruations les plus longues à vingt ou trente jours par mois, les plus courtes à un jour et une nuit selon les points de vue Shafi'i et Hanbali, les plus longues à quinze jours et la durée commune à six ou sept jours. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7467} Une femme peut être primipare (sans cycle menstruel antérieur), régulière (cycle connu et pureté) ou confuse (ayant oublié son cycle). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7467} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7468} Une femme qui a ses premières règles et dont les saignements surviennent à un moment opportun (dans les limites minimales et maximales) a ses menstruations; des pertes jaunâtres ou troubles sont considérées comme des menstruations pour la majorité des femmes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7467} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7468} Si les saignements cessent avant la durée maximale des menstruations, la femme est considérée comme pure. Les Hanbalites se baignent lorsque les saignements sont les moins abondants et prient et jeûnent par précaution pendant le reste du temps. Si les saignements se poursuivent au-delà de la durée maximale des menstruations, les Hanafites comptent dix jours comme menstruations et vingt jours comme période de pureté chaque mois. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7468} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7469} Une femme ayant ses règles doit respecter une règle concernant ses menstruations: celles-ci doivent survenir au moment de ses règles. Cette règle est confirmée par trois cycles selon les écoles Hanbalite et Shafi'ite, et par la répétition selon l'école Hanafite. Les Hanafites divergent quant à savoir si un changement de règles constitue une nouvelle habitude. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7470} Lorsque les saignements d'une femme ayant ses règles correspondent à la durée de ses menstruations, ces jours sont considérés comme des menstruations et le reste comme une période de pureté; lorsqu'ils cessent avant les menstruations, elle est considérée comme pure, mais les écoles divergent quant aux rapports sexuels et à la prière. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7471} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7472} Lorsque les saignements reviennent après une interruption, les chaféites considèrent cette interruption comme des menstruations sous certaines conditions, les hanbalites considèrent une absence totale de saignements comme une période de pureté, et les hanafites annulent la pureté si les saignements reviennent dans le délai le plus long entre les menstruations. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7471} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7472} Lorsqu'une femme ayant ses règles dépasse la durée de ses menstruations, les Hanafites la remettent en état de règles, sauf si celles-ci ont changé. Ils fixent la période de pureté à six mois moins une heure (avis des savants hanafites), tandis que les Malikites ajoutent trois jours de précaution à ses règles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7472} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7473} Selon l'école hanafite, les règles changent en fonction du temps et du décompte des jours de règles dès que les saignements dépassent dix jours. Les Malikites, les Chafiites et les Hanbalites laissent les règles évoluer, les faisant s'allonger ou se raccourcir. Les Hanbalites ne considèrent comme menstrues les périodes de règles autres que celles prévues jusqu'à leur récurrence deux ou trois fois. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7474} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7475} Une période de règles est dite paire lorsque ses jours sont concordants, ou impaire dans son ordre ou désordonnée; dans ce dernier cas, la femme suit le cycle si elle le connaît, sinon elle attend le moins longtemps possible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7476} Concernant le prélèvement de sang en cas de pureté, deux avis existent: celui du prélèvement seul ne compte que les jours de sang, celui du prélèvement les compte tous les deux comme menstrues sous certaines conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7476} Il n'y a pas de limite à la plus grande pureté; La durée minimale est de quinze jours pour les hanafites, les malikites et les chaféites, et de treize jours pour les hanbalites, selon un hadith rapporté par Ali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7476} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7477} Les savants divergent quant à la nature de l'intervalle entre deux saignements: les hanafites et les chaféites le considèrent comme des menstruations, tandis que les malikites et les hanbalites le considèrent comme une période de pureté. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7478} Concernant les menstruations d'une femme enceinte, les hanafites et les hanbalites les considèrent comme une maladie, se référant à un hadith interdisant les rapports sexuels avec une femme enceinte jusqu'à l'accouchement, tandis que les malikites et les chaféites les considèrent comme des menstruations lorsque les conditions requises sont réunies. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7478} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7479} Selon le rite hanafite, la pureté est considérée comme saine si elle dure quinze jours ou plus entre deux saignements sains et purs; elle est considérée comme non saine si elle est plus courte ou mixte; et elle est complète si elle dure quinze jours, même non sains. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7479} Les menstruations marquent la puberté et entraînent des obligations; le bain rituel d’une femme pendant ses règles pour purifier l’organisme de ses impuretés majeures est invalide pour la majorité; le bain rituel après les menstruations est obligatoire à la fin des saignements, et le lieu doit être parfumé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7479} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7480} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7481} Les savants s'accordent à dire que la prière est suspendue pour une femme indisposée pendant ses menstruations et qu'elle ne la rattrape pas, même si elle rattrape le jeûne. Cette opinion se fonde sur le hadith d'Aïcha: la femme ne peut pas accomplir la prière, et la prosternation pour la récitation et les remerciements compte comme prière. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7482} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7483} Selon certains avis, une femme qui devient pure au début de l'heure de la prière doit accomplir cette obligation, et cette obligation est suspendue si les menstruations surviennent à un moment où elle est suspendue. À la fin du temps imparti, les écoles divergent quant à la durée du jeûne: les Hanafites prennent en compte le takbir d’ouverture et le temps du bain rituel; les Malikites, une rak’a; les Chafiites et les Hanbalites, un seul takbir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7483} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7484} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7485} Le jeûne est interdit à la femme indisposée; si elle a ses règles avant l’aube, elle doit jeûner ce jour-là, et les écoles divergent quant à la durée nécessaire: les Hanafites exigent le temps du bain rituel et le takbir d’ouverture; les Malikites acceptent un signe; les Chafiites et les Hanbalites acceptent la fin des règles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7485} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7486} Dans le pèlerinage, les règles n'empêchent rien d'autre que la circumambulation: les bains pour le pèlerin sont recommandés, le circuit d'arrivée est une sunna, le circuit d'adieu est obligatoire sur la plupart des points de vue, et il peut repartir sans. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7486} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7487} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7488} La récitation du Coran est interdite selon l'opinion majoritaire; les Hanafis interdisent de réciter des phrases complètes mais pas des mots isolés; les Shafiis interdisent même une partie d’un vers; Les Hanbalites interdisent un verset et plus encore; les Malikites l'autorisent pendant les menstruations. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7488} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7489} Les écoles interdisent à une femme indisposée d'entrer dans la mosquée (les Hanafites et les Malikites de manière absolue; les Shafi'ites et les Hanbalites interdisent le passage si elle craint de la souiller); le lieu de la prière des fêtes est sujet à controverse, tandis que l'espace de prière funéraire est autorisé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7490} Tous s'accordent à dire que les rapports sexuels avec les parties intimes sont interdits à une femme indisposée; les écoles divergent quant à la zone de plaisir entre le nombril et le genou, zone que la plupart interdisent, tandis que les Hanbalites autorisent tout ce qui se trouve en dessous des parties intimes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7490} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7491} L'expiation pour un rapport sexuel pendant les menstruations est d'un demi-dinar pour les Hanbalites; les Hanafites et les Shafiites recommandent un dinar ou un demi-dinar selon la durée des saignements. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7491} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7492} Les rapports sexuels ne sont licites que lorsque les saignements ont cessé et que la femme s'est lavée (majorité); les Hanafites font la distinction entre l'arrêt des saignements au plus long terme, au plus court terme ou à la fin des règles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7492} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7493} Divorcer d'une femme menstruée est interdit et constitue une forme de divorce innovant, selon un hadith rapporté par Ibn Umar. La majorité des juristes estiment que ce divorce est effectif. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7493} L'article se termine par des points généraux: l'école hanbalite autorise une femme à prendre un médicament licite pour interrompre ses menstruations uniquement avec l'accord de son mari et sans préjudice; la revendication des menstruations par une femme est acceptée lorsque cela est possible; le nifas diffère du hayd par la durée du délai d'attente, l'atteinte de la puberté, la purge de l'utérus et la limite de la période. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7494} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7495}"
