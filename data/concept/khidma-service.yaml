summary:
  ar: "الخدمة لغة المهنة، والخادم يقع على الذكر والأنثى، ويفرق المدخل بين الخدمة والمهنة (الحذق والعمل) والعمل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7560} ويحرم عند الجمهور أن تخدم الأجنبية الرجل الأعزب في بيته إذا كانت الخدمة تتطلب الخلوة، ولا فرق بين الحرة والأمة والجميلة وغيرها؛ وأجاز بعض الفقهاء استخدامها مع الكراهة، وأحمد يفرق بين الحرة والأمة ويمنع الخلوة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7561} ولا يصح أن يخدم المرأة رجل بالغ لا يحل له النظر إليها إلا محرم أو صبي أو مملوك أو ممسوح، أما الخدمة الظاهرة كقضاء الحوائج من السوق فيجوز للرجل الأجنبي أن يتولاها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7561} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7562} ولا يجوز للمسلم أن يخدم الكافر بإجارة أو إعارة، ويجوز أن يؤجر نفسه لعمل معين في الذمة كالخياطة، ويجوز إعارة العبد المسلم لعمل معين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7562} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7563} ويجب على الوالد أن يخدم ولده الصغير أو المريض أو العاجز إذا كان فقيرا، واختلف الفقهاء في خدمة الولد لوالده، فالحنفية والمالكية يمنعونها، والحنابلة والشافعية يكرهونها تنزيها؛ وإخدام الزوجة يجب على الزوج إن كان لا يليق بها خدمة نفسها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7563}  وتجب على الزوج خدمة زوجته من الإخدام إن كانت لا تخدم نفسها، وعلى الحنفية إن امتنعت من الطحن والخبز ممن لا تخدم أو بها علة فعليه طعام مهيأ، وجمهور الفقهاء يوجبون خادما واحدا، والمالكية وأبو يوسف يوجبون أكثر إن كان حالها يقتضيه؛ وليس للزوج تبديل خادمها إلا لريبة أو خيانة، وإخدام المعسر محل خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7564} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7565} ويشترط في الخادم أن يكون امرأة مسلمة أو صبيا مميزا أو محرما أو ممسوحا، ويختلف الفقهاء في خدمة الذمية للمسلمة، ونفقة الخادم تشمل الطعام والمسكن والملبس عند جمهور الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7566} وإذا طلبت الزوجة أجرة الخادم أو نفقته فلا يلزم الزوج قبول ذلك عند الشافعية والحنابلة، لأن في إخدامها توفيرا على حقوقه وترفيها وفواتا لخدمتها لنفسها؛ ويرى الحنفية أنه لا يجوز لها أخذ الأجرة على خدمتها لزوجها أو لنفسها لأنها تصير كالرشوة على عمل واجب، إلا إذا كان بها علة أو كانت من بنات الأشراف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7567} واختلفوا فيما لو قال الزوج إنه يخدمها بنفسه ليسقط عنه مؤنة الخادم: فالحنفية والشافعية في الأصح والحنابلة في الراجح على أنه ليس له ذلك ولا تلزمها الموافقة، والمالكية على أن له ذلك وتلزمها الرضا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7567} وإعسار الزوج بنفقة الخادمة لا يوجب طلاقها عند الفقهاء، وتثبت النفقة في ذمته عند الشافعية والحنابلة، وتسقط عند الحنفية والمالكية لأن المعسر لم يؤت شيئا فلا يكلف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7567} وفي فطرة الخادم: إن كانت الخادمة مستأجرة بمال الزوجة فلا فطرة على الزوج، وإن كانت مملوكة لها أو ممن يلزم خادم مثلها ثم أخدمها الزوج بنفقته فعليه فطرتها، وإن أخدمها بعبده أو أمته فزكاة الفطر عليه بسبب ملكه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7568} وخدمة الزوجة لزوجها جائزة باتفاق، والجمهور على أنها غير واجبة، والحنفية على أنها واجبة ديانة لا قضاء، والمالكية وأبو ثور وجماعة على وجوب الأعمال الباطنة بالعادة، مستدلين بقضاء النبي في خدمة علي وفاطمة وبحديث أمر الزوج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7569} وخدمة الحر زوجته جائزة عند الجمهور وتقبلها، ويحرم عند الحنفية جعل خدمته لها مهرا، وتصح تسميته مهرا إن كان رعي غنم أو زرع أرض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7569} واتفق الفقهاء على جواز خدمة الكافر للمسلم، وعلى جواز إجارة المسلم نفسه للكافر في عمل معين في الذمة، ولا يجوز إجارة النفس لعمل محرم كعصر الخمر ورعي الخنازير. وفي إجارة المسلم للكافر أو إعارته للخدمة: الحنفية يجيزون ذلك مع الكراهة، والمالكية يقسمونه إلى جائز ومكروه ومحظور وحرام، والشافعية يحرمون الخدمة المباشرة وغير المباشرة ويؤمر بإزالة يده عنه، والحنابلة على الرواية الصحيحة يحرمون إجارة المسلم أو إعارته للكافر للخدمة، وفي الرواية الأخرى يجوز مع الكراهة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7570}"
  en: "Khidma (service) lexically is a trade; a servant may be male or female. The entry separates service from craft (mihna) and from work ('amal). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7560} The majority forbid a non-mahram woman to serve a single man in his house when the service needs seclusion, without distinction between free and slave, or handsome and plain; some jurists allow it with dislike, and Ahmad distinguishes free from slave and bars seclusion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7561} A grown man who may not look at a woman may not serve her in private, except a mahram, a boy, a slave or a eunuch; outside service, like buying what she needs in the market, may be done by a stranger. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7561} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7562} A Muslim may not serve an unbeliever by hire or loan, but he may contract for a particular task such as sewing, and a Muslim slave may be lent for a specific task. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7562} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7563} A father must serve his poor, young, sick or incapable child; the Hanafis and Malikis forbid a child to make his parent serve him, while the Hanbalis and Shafiis dislike it; a husband must provide a servant for a wife whose rank forbids her to serve herself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7563}  A husband must provide a servant for a wife who cannot serve herself by rank or illness; if she refuses to grind and bake and cannot serve, he must bring ready food; the majority require one servant, while the Malikis and Abu Yusuf allow more when her standing needs it. He may not change her servant unless there is suspicion or betrayal, and providing a servant for a poor husband is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7564} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7565} The servant must be a Muslim woman, a discerning boy, a mahram or a eunuch; a dhimmi woman serving a Muslim woman is disputed, and the servant's keep covers food, housing and clothing for the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7566} If the wife asks for wages or the servant's keep, the Shafiis and Hanbalis do not oblige the husband to accept, since her serving him saves his rights and comfort; the Hanafis hold that she may not take wages for serving her husband or herself, as this resembles a bribe for a duty, unless she is ill or of a noble family. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7567} If the husband offers to serve her himself to drop the servant's cost, the Hanafis, the sounder Shafii view and the preferred Hanbali view say he may not and she need not accept; the Malikis say he may and she must agree. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7567} Poverty of the husband in paying for a servant does not justify divorce; the debt stays on him according to the Shafiis and Hanbalis, and falls away for the Hanafis and Malikis, since no one is charged beyond what he has been given. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7567} On the servant's zakat al-fitr: if the servant is hired with the wife's own money the husband owes nothing; if she is her own slave or one the husband must maintain, the duty follows the maintenance; if he serves her with his own slave or maid, he pays for that slave by ownership. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7568} A wife serving her husband is permitted by all; the majority say it is not obliged, the Hanafis say it is owed religiously, not judicially, and the Malikis and others require inner household work by custom, citing the case of Ali and Fatima and a hadith on the wife's obedience. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7569} A free husband serving his wife is permitted by the majority, and she may accept it; the Hanafis forbid making his service her mahr, though it is valid as a mahr if it is herding her flock or working her land. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7569} The jurists agree that a Muslim may be served by an unbeliever, and that a Muslim may hire himself out to an unbeliever for a defined task, but not for forbidden work such as pressing wine or herding pigs. On hire or loan of a Muslim to an unbeliever for service: the Hanafis permit it with dislike; the Malikis divide it into permitted, disliked, forbidden and unlawful; the Shafiis forbid both direct and indirect service and order the hire ended; the sound Hanbali view forbids it, while another view permits it with dislike. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7570}"
  ur: "خدمت لغت میں پیشے کو کہتے ہیں، خادم مرد اور عورت دونوں پر بولا جاتا ہے؛ مدخل خدمت کو مہنہ (مہارت) اور عمل سے ممیز کرتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7560} جمہور کے نزدیک اجنبی عورت کا تنہا مرد کے گھر میں خدمت کرنا حرام ہے جب خدمت میں خلوت ہو، آزاد اور باندی یا خوبصورت اور عام میں فرق نہیں؛ بعض فقہاء کراہت کے ساتھ جائز کہتے ہیں، اور امام احمد آزاد اور باندی میں فرق کرتے ہیں اور خلوت سے منع کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7561} بالغ مرد جس کا عورت کی طرف دیکھنا جائز نہیں وہ اس کی نجی خدمت نہیں کر سکتا، سوائے محرم، لڑکے، غلام یا ممسوح کے؛ البتہ ظاہری خدمت جیسے بازار سے ضرورت کی چیز لانا اجنبی مرد بھی کر سکتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7561} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7562} مسلمان کافر کی خدمت اجارہ یا عاریت سے نہیں کر سکتا، البتہ کسی معین کام جیسے سلائی کا معاہدہ جائز ہے، اور مسلمان غلام معین کام کے لیے عاریتاً دیا جا سکتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7562} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7563} باپ پر فقیر، کم عمر، بیمار یا عاجز بچے کی خدمت لازم ہے؛ حنفیہ اور مالکیہ بچے کا والد سے خدمت لینا منع کرتے ہیں، جبکہ حنابلہ اور شافعیہ اسے مکروہ کہتے ہیں؛ شوہر پر بیوی کو خادم فراہم کرنا لازم ہے جب اس کا مرتبہ خود خدمت کرنے سے مانع ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7563}  شوہر پر بیوی کے لیے خادم فراہم کرنا لازم ہے اگر اس کا مرتبہ یا بیماری خود خدمت سے مانع ہو؛ اگر وہ پیسنے اور روٹی پکانے سے انکار کرے اور خود خدمت کے قابل نہ ہو تو شوہر تیار کھانا لائے۔ جمہور ایک خادم لازم کرتے ہیں، جبکہ مالکیہ اور ابو یوسف مرتبے کے مطابق زیادہ کو لازم کہتے ہیں؛ شوہر خادم بدل نہیں سکتا جب تک بدگمانی یا خیانت نہ ہو، اور تنگ دست شوہر پر خادم فراہم کرنے میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7564} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7565} خادم مسلمان عورت، سمجھدار لڑکا، محرم یا ممسوح ہو؛ ذمیہ کا مسلمان عورت کی خدمت کرنا مختلف فیہ ہے، اور جمہور کے نزدیک خادم کا نفقہ کھانے، رہائش اور لباس پر مشتمل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7566} اگر بیوی خادم کی اجرت یا نفقہ مانگے تو شافعیہ اور حنابلہ کے نزدیک شوہر پر اسے قبول کرنا لازم نہیں، کیونکہ اس کی خدمت شوہر کے حقوق اور آرام کی بچت ہے؛ حنفیہ کے نزدیک بیوی اپنے شوہر یا اپنی خدمت پر اجرت نہیں لے سکتی کیونکہ یہ واجب کام پر رشوت کے مشابہ ہے، سوائے اس کے کہ وہ بیمار ہو یا شریف خاندان سے ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7567} اگر شوہر کہے کہ وہ خود بیوی کی خدمت کرے گا تاکہ خادم کا خرچ ختم ہو تو حنفیہ، شافعیہ کا صحیح قول اور حنابلہ کا راجح قول اسے ناجائز کہتے ہیں اور بیوی پر اس کی رضامندی لازم نہیں؛ مالکیہ کے نزدیک جائز ہے اور بیوی پر رضا لازم ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7567} شوہر کی تنگ دستی سے خادم کا نفقہ طلاق کا سبب نہیں بنتا؛ شافعیہ اور حنابلہ کے نزدیک یہ قرض کی طرح شوہر کے ذمے رہتا ہے، جبکہ حنفیہ اور مالکیہ کے نزدیک ساقط ہو جاتا ہے کیونکہ جسے کچھ دیا ہی نہ گیا ہو اس پر بوجھ نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7567} خادم کا صدقۂ فطر: اگر خادم بیوی کے اپنے مال سے کرائے پر ہو تو شوہر پر فطرہ نہیں؛ اگر وہ بیوی کی مملوکہ ہو یا شوہر پر اس کا نفقہ لازم ہو تو فطرہ نفقے کے تابع ہے؛ اگر شوہر اپنا غلام یا لونڈی خدمت کے لیے دے تو ملکیت کی وجہ سے فطرہ اسی پر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7568} بیوی کا شوہر کی خدمت کرنا سب کے نزدیک جائز ہے؛ جمہور کے نزدیک واجب نہیں، حنفیہ کے نزدیک دیانتاً واجب ہے نہ کہ قضاءً، اور مالکیہ اور ابو ثور وغیرہ کے نزدیک گھر کے اندرونی کام عرف کے مطابق لازم ہیں، علی اور فاطمہ کے واقعے اور بیوی کی اطاعت کی حدیث سے استدلال کرتے ہوئے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7569} آزاد شوہر کا بیوی کی خدمت کرنا جمہور کے نزدیک جائز ہے اور بیوی اسے قبول کر سکتی ہے؛ حنفیہ کے نزدیک شوہر کی خدمت کو مہر بنانا ناجائز ہے، البتہ بکریاں چرانا یا زمین کاشت کرنا مہر کے طور پر درست ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7569} فقہاء کا اتفاق ہے کہ کافر کی خدمت مسلمان کے لیے جائز ہے، اور مسلمان کسی معین کام کے لیے کافر کا ملازم بن سکتا ہے، مگر حرام کام جیسے شراب نچوڑنا یا سور چرانا ناجائز ہے۔ کافر کے لیے مسلمان کی اجارہ یا عاریت پر خدمت میں حنفیہ کراہت کے ساتھ جائز کہتے ہیں؛ مالکیہ اسے جائز، مکروہ، ممنوع اور حرام میں تقسیم کرتے ہیں؛ شافعیہ براہ راست اور بالواسطہ خدمت دونوں کو حرام کہتے ہیں اور ملازمت ختم کرنے کا حکم دیتے ہیں؛ حنابلہ کے صحیح قول کے مطابق یہ ناجائز ہے اور دوسری روایت کراہت کے ساتھ جائز کہتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7570}"
