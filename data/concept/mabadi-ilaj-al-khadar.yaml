id: "concept/mabadi-ilaj-al-khadar"
class: "concept"
kind: "scientific"
label:
  ar: "مبادئ إيلاج الخدر"
  en: "Principles of treating numbness"
  ur: "خدر کے علاج کے اصول"
summary:
  ar: "علاج الخدر على ما قيل في الرعشة بعينه، إلا أنه إن كان عن دم غالب وقامت دلالة الامتلاء نفع الفصد البالغ في الأكثر وحده مع إصلاح التدبير وتجفيف الغذاء، ولا يقتصر على معالجة الموضع بل يعالج مبدأ العصب السالك إليه، ومن النافع رياضة العضو ودوام تحريكه {cite:canon-ibn-sina-print-v2 p.159} {cite:canon-ibn-sina-print-v2 p.160}"
  en: "Numbness's treatment is the very one given under tremor; but when it is from prevailing blood with the proofs of repletion standing, a thorough venesection mostly removes it alone, with correction of regimen and drying of food; one must not treat only the spot but the origin of the nerve reaching it, and among the useful is exercising the organ and keeping it moving {cite:canon-ibn-sina-print-v2 p.159} {cite:canon-ibn-sina-print-v2 p.160}"
  ur: "خدر کا علاج وہی ہے جو رعشہ میں کہا گیا؛ لیکن اگر وہ غالب خون سے ہو اور امتلاء کی دلیلیں قائم ہوں تو غالباً مکمل فصد ہی اسے دور کر دیتا ہے، تدبیر کی اصلاح اور غذا کی خشکی کے ساتھ؛ صرف مقام کے علاج پر اکتفا نہیں کیا جاتا بلکہ اس عصب کی ابتدا کا علاج کیا جاتا ہے جو وہاں جاتی ہے، اور مفید میں عضو کی ریاضت اور اسے مسلسل حرکت دینا ہے {cite:canon-ibn-sina-print-v2 p.159} {cite:canon-ibn-sina-print-v2 p.160}"
