id: "concept/mabadi-ilaj-al-khadar"
class: "concept"
kind: "scientific"
label:
  ar: "مبادئ إيلاج الخدر"
  en: "Principles of treating numbness"
  ur: "خدر کے علاج کے اصول"
  es: "Principios para el tratamiento del entumecimiento"
  fr: "Principes du traitement de l'engourdissement"
  tr: "Uyuşukluk İlkeleri Giriş"
  id: "Prinsip Mati Rasa Pengantar"
summary:
  ar: "علاج الخدر على ما قيل في الرعشة بعينه، إلا أنه إن كان عن دم غالب وقامت دلالة الامتلاء نفع الفصد البالغ في الأكثر وحده مع إصلاح التدبير وتجفيف الغذاء، ولا يقتصر على معالجة الموضع بل يعالج مبدأ العصب السالك إليه، ومن النافع رياضة العضو ودوام تحريكه {cite:canon-ibn-sina-print-v2 p.159} {cite:canon-ibn-sina-print-v2 p.160}"
  en: "Numbness's treatment is the very one given under tremor; but when it is from prevailing blood with the proofs of repletion standing, a thorough venesection mostly removes it alone, with correction of regimen and drying of food; one must not treat only the spot but the origin of the nerve reaching it, and among the useful is exercising the organ and keeping it moving {cite:canon-ibn-sina-print-v2 p.159} {cite:canon-ibn-sina-print-v2 p.160}"
  ur: "خدر کا علاج وہی ہے جو رعشہ میں کہا گیا؛ لیکن اگر وہ غالب خون سے ہو اور امتلاء کی دلیلیں قائم ہوں تو غالباً مکمل فصد ہی اسے دور کر دیتا ہے، تدبیر کی اصلاح اور غذا کی خشکی کے ساتھ؛ صرف مقام کے علاج پر اکتفا نہیں کیا جاتا بلکہ اس عصب کی ابتدا کا علاج کیا جاتا ہے جو وہاں جاتی ہے، اور مفید میں عضو کی ریاضت اور اسے مسلسل حرکت دینا ہے {cite:canon-ibn-sina-print-v2 p.159} {cite:canon-ibn-sina-print-v2 p.160}"
  es: "El tratamiento del entumecimiento es el mismo que se aplica en caso de temblor; pero cuando se debe a la sangre predominante y hay evidencia de saciedad, una flebotomía completa suele ser suficiente para eliminarlo, junto con la corrección del régimen y la restricción alimentaria. No se debe tratar solo la zona afectada, sino también el origen del nervio que la inerva, y entre las medidas útiles se encuentra el ejercicio del órgano y mantenerlo en movimiento {cite:canon-ibn-sina-print-v2 p.159} {cite:canon-ibn-sina-print-v2 p.160}"
  fr: "Le traitement de l'engourdissement est le même que celui administré en cas de tremblements; mais lorsqu'il est dû à une hémorragie et que les signes de satiété sont avérés, une saignée complète suffit généralement à le faire disparaître, associée à une correction du régime alimentaire et à une alimentation déshydratée. Il ne faut pas traiter uniquement la zone affectée, mais aussi l'origine du nerf qui l'irrigue. Parmi les mesures utiles, on peut citer l'exercice de l'organe et sa mobilisation. {cite:canon-ibn-sina-print-v2 p.159} {cite:canon-ibn-sina-print-v2 p.160}"
  tr: "Uyuşma tedavisi, belirtildiği gibi, titremeye özgüdür, ancak baskın kandan kaynaklanıyorsa ve tokluk belirtisi varsa, en etkili tedavi sadece şiddetli flebitoma için uygun gıda yönetimi ve kurutulmasıdır. Bu tedavi sadece bölgenin tedavisiyle sınırlı kalmaz, aynı zamanda sinirin içinden geçme prensibini de ele alır. Faydalılar arasında uzvun egzersizi ve sürekli hareket ettirilmesi {cite:canon-ibn-sina-print-v2 s.159} {cite:canon-ibn-sina-print-v2 s.160}"
  id: "Pengobatan mati rasa, seperti yang disebutkan, spesifik pada tremor, tetapi jika berasal dari darah dominan dan indikasi kenyang sudah terbukti, pengobatan paling efektif adalah hanya untuk flesitoma berat dengan pengelolaan dan pengeringan makanan yang tepat. Pengobatan ini tidak terbatas pada area tersebut tetapi juga menangani prinsip saraf yang melaluinya. Salah satu manfaat adalah melatih anggota tubuh dan terus menggerakkannya {cite:canon-ibn-sina-print-v2 hlm.159} {cite:canon-ibn-sina-print-v2 hlm.160}"
