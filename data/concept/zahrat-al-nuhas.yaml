label:
  ar: "زهرة النحاس"
  en: "Zahrat al-nuhas (copper flower)"
  ur: "زہرۃ النحاس ⁦(تانبے کا پھول)⁩"
  es: "Zahrat al-nuhas (flor de cobre)"
  fr: "Zahrat al-nuhas (fleur de cuivre)"
  tr: "Bakır çiçeği"
  id: "Bunga tembaga"
summary:
  ar: "زهرة النحاس قابضة أكّالة لذّاعة، تأكل اللحم الزائد، وتجفف قروح الأذن، والأبيض منها إذا نُفخ في الأذن ينفع الصمم المزمن. {cite:canon-ibn-sina-print-v1 p.465}"
  en: "Copper flower is astringent, eats away and stings; it eats proud flesh and dries ear sores, and the white kind blown into the ear helps chronic deafness. {cite:canon-ibn-sina-print-v1 p.465}"
  ur: "زہرۃ النحاس قابض، گلانے والی اور جلن دار ہے؛ زائد گوشت کھا جاتی ہے، کان کے زخم سکھاتی ہے، اور اس کی سفید قسم کان میں پھونکی جائے تو پرانے بہرے پن میں مفید ہے۔ {cite:canon-ibn-sina-print-v1 p.465}"
  es: "La flor de cobre es astringente, corroe y produce escozor; elimina la grasa de los oídos y seca las llagas, y la variedad blanca, soplada en el oído, ayuda a la sordera crónica. {cite:canon-ibn-sina-print-v1 p.465}"
  fr: "La fleur de cuivre est astringente, ronge et pique; elle ronge les tissus orgueilleux et assèche les plaies de l'oreille, et la variété blanche, soufflée dans l'oreille, soulage la surdité chronique. {cite:canon-ibn-sina-print-v1 p.465}"
  tr: "Bakırçiçeği, büzücü, aşındırıcı ve keskin kokulu bir bitkidir. Fazla eti eritir ve kulak yaralarını kurutur. Beyaz çeşidi, kulağa üflendiğinde kronik sağırlık için faydalıdır. {cite:canon-ibn-sina-print-v1 s.465}"
  id: "Copperflower adalah tanaman yang bersifat astringen, korosif, dan berbau menyengat. Tanaman ini mengikis daging berlebih dan mengeringkan luka di telinga. Varietas putihnya, jika ditiup ke telinga, bermanfaat untuk mengatasi tuli kronis. {cite:canon-ibn-sina-print-v1 p.465}"
