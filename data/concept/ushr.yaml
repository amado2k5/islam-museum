label:
  ar: "العُشْر"
  en: "Tithe on the trade of non-Muslims (ushr)"
  ur: "عشر"
summary:
  ar: "العشر في اللغة الجزء من عشرة أجزاء، وهو في الاصطلاح يطلق على عشر التجارات والبياعات، وعلى عشر الصدقات أو زكاة الخارج من الأرض، ويقتصر البحث هنا على عشر التجارة، وهو ما يفرض على أموال أهل الذمة المعدة للتجارة إذا نقلوها من بلد إلى بلد داخل بلاد الإسلام {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11608}. ويؤخذ العشر من تجارة غير المسلمين عند دخولهم بها دار الإسلام، واستدل له الفقهاء بالسنة والإجماع والمعقول، ولا يؤخذ من تجارة المسلمين غير الزكاة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11609} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11610} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11612}. واختلف الفقهاء في من يؤخذ منه، فالمستأمنون والذميون والحربيون، ومنهم من يشترط البلوغ والعقل والذكورة وبلوغ النصاب والفراغ من الدين {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11611} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11613} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11614} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11615} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11616}. وتختلف المقادير، فيؤخذ من الذمي عند الحنفية والحنابلة نصف العشر، وعند المالكية العشر كاملاً إلا في الطعام المجلوب إلى مكة والمدينة، والشافعية يجعلونه إلى رأي الإمام {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11616} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11617}. ويستوفيه الإمام أو الوالي أو من يوليه العشر، ويتولاه العاشر، وذكر الفقهاء شروطه وما يراعيه، وذكروا بيان القبالة وهي التضمين، وانتقدها بعض الفقهاء كابن عابدين {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11619} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11620} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11621} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11622}. ويسقط بالإسلام، ويجوز للإمام إسقاطه عن بعض التجار للمصلحة، ويصرف في مصارف الفيء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11622} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11623}."
  en: "In the lexicon, ushr is a tenth. As a technical term it is either the tithe on trade and sales or the tithe on produce or zakat on what the land yields; this entry treats the tithe on trade, which is levied on goods of non-Muslims carried for trade from one town of the Muslim lands to another {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11608}. It is taken from non-Muslim merchants when they enter the territory of Islam with their goods, on the basis of a prophetic report, a consensus of the early community and reasoning about the protection the state gives to traders; Muslim merchants owe nothing beyond zakat {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11609} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11610} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11612}. The liable persons are treaty-merchants, protected non-Muslims and enemy merchants under safe-conduct, and the schools set further conditions: adulthood, sanity, male sex, a threshold, and freedom from debt, which some schools reject {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11611} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11613} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11614} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11615} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11616}. The rate differs: the Hanafis and Hanbalis take half a tenth from a protected non-Muslim, the Malikis a full tenth except on grain brought to Mecca and Medina, and the Shafi'is leave it to the imam's terms {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11616} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11617}. The imam or governor is entitled to collect it, through a collector who must be a Muslim, free, knowledgeable and able to protect traders; farming the collection out is treated and disliked by some jurists {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11619} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11620} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11621} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11622}. It lapses on conversion and may be waived by the imam for goods the Muslims need, and it is spent on the fay' purposes {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11622} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11623}."
