id: concept/ushr
class: concept
kind: legal
label:
  ar: "العُشْر"
  en: "Tithe on the trade of non-Muslims (ushr)"
  ur: "عشر"
  es: "Diezmo sobre el comercio de no musulmanes (ushr)"
  fr: "Dîme sur le commerce des non-musulmans (ushr)"
summary:
  ar: "العشر في اللغة الجزء من عشرة أجزاء، وهو في الاصطلاح يطلق على عشر التجارات والبياعات، وعلى عشر الصدقات أو زكاة الخارج من الأرض، ويقتصر البحث هنا على عشر التجارة، وهو ما يفرض على أموال أهل الذمة المعدة للتجارة إذا نقلوها من بلد إلى بلد داخل بلاد الإسلام {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11608}. ويؤخذ العشر من تجارة غير المسلمين عند دخولهم بها دار الإسلام، واستدل له الفقهاء بالسنة والإجماع والمعقول، ولا يؤخذ من تجارة المسلمين غير الزكاة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11609} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11610} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11612}. واختلف الفقهاء في من يؤخذ منه، فالمستأمنون والذميون والحربيون، ومنهم من يشترط البلوغ والعقل والذكورة وبلوغ النصاب والفراغ من الدين {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11611} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11613} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11614} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11615} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11616}. وتختلف المقادير، فيؤخذ من الذمي عند الحنفية والحنابلة نصف العشر، وعند المالكية العشر كاملاً إلا في الطعام المجلوب إلى مكة والمدينة، والشافعية يجعلونه إلى رأي الإمام {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11616} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11617}. ويستوفيه الإمام أو الوالي أو من يوليه العشر، ويتولاه العاشر، وذكر الفقهاء شروطه وما يراعيه، وذكروا بيان القبالة وهي التضمين، وانتقدها بعض الفقهاء كابن عابدين {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11619} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11620} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11621} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11622}. ويسقط بالإسلام، ويجوز للإمام إسقاطه عن بعض التجار للمصلحة، ويصرف في مصارف الفيء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11622} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11623}."
  en: "In the lexicon, ushr is a tenth. As a technical term it is either the tithe on trade and sales or the tithe on produce or zakat on what the land yields; this entry treats the tithe on trade, which is levied on goods of non-Muslims carried for trade from one town of the Muslim lands to another {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11608}. It is taken from non-Muslim merchants when they enter the territory of Islam with their goods, on the basis of a prophetic report, a consensus of the early community and reasoning about the protection the state gives to traders; Muslim merchants owe nothing beyond zakat {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11609} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11610} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11612}. The liable persons are treaty-merchants, protected non-Muslims and enemy merchants under safe-conduct, and the schools set further conditions: adulthood, sanity, male sex, a threshold, and freedom from debt, which some schools reject {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11611} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11613} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11614} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11615} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11616}. The rate differs: the Hanafis and Hanbalis take half a tenth from a protected non-Muslim, the Malikis a full tenth except on grain brought to Mecca and Medina, and the Shafi'is leave it to the imam's terms {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11616} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11617}. The imam or governor is entitled to collect it, through a collector who must be a Muslim, free, knowledgeable and able to protect traders; farming the collection out is treated and disliked by some jurists {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11619} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11620} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11621} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11622}. It lapses on conversion and may be waived by the imam for goods the Muslims need, and it is spent on the fay' purposes {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11622} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11623}."
  es: "En el léxico, ushr es una décima parte. Como término técnico, es el diezmo sobre el comercio y las ventas o el diezmo sobre los productos o zakat sobre lo que produce la tierra; esta entrada trata el diezmo sobre el comercio, que se cobra sobre las mercancías de los no musulmanes transportadas para el comercio de una ciudad de tierras musulmanas a otra {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11608}. Se toma de los comerciantes no musulmanes cuando entran en el territorio del Islam con sus mercancías, sobre la base de un informe profético, un consenso de la comunidad primitiva y el razonamiento sobre la protección que el estado brinda a los comerciantes; Los comerciantes musulmanes no deben nada más que el zakat {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11609} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11610} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11612}. Las personas responsables son comerciantes tratados por tratados, protegidos no musulmanes y comerciantes enemigos bajo salvoconducto, y las escuelas establecen condiciones adicionales: edad adulta, cordura, sexo masculino, un umbral y libertad de deudas, que algunas escuelas rechazan {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.11611} p.11613} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11614} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11615} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11616}. La tasa difiere: los hanafíes y hanbalíes toman la mitad de la décima parte de un no musulmán protegido, los malikíes una décima parte completa excepto sobre el grano llevado a La Meca y Medina, y los shafiíes lo dejan a los términos del imán {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11616} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11617}. El imán o gobernador tiene derecho a recaudarla, a través de un recaudador que debe ser musulmán, libre, informado y capaz de proteger a los comerciantes; Algunos juristas tratan y desagradan la explotación de la colección {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11619} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11620} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11621} {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.11622}. Caduca con la conversión y el imán puede renunciar a él para bienes que los musulmanes necesitan, y se gasta en los propósitos del hada {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11622} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11623}."
  fr: "Dans le lexique, l'ushr désigne un dixième. Techniquement, il s'agit soit de la dîme sur le commerce et les ventes, soit de la dîme sur les produits agricoles ou de la zakat sur les récoltes de la terre. Cette entrée traite de la dîme sur le commerce, prélevée sur les marchandises des non-musulmans transportées à des fins commerciales d'une ville à l'autre en territoire musulman {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11608}. Elle est perçue auprès des marchands non-musulmans lorsqu'ils entrent en territoire islamique avec leurs marchandises, sur la base d'un hadith, d'un consensus de la communauté primitive et du raisonnement relatif à la protection accordée par l'État aux commerçants. Les marchands musulmans ne doivent rien au-delà de la zakat {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11609} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11610} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11612}. Les personnes responsables sont des marchands traités, des non-musulmans protégés et des marchands ennemis sous sauf-conduit, et les écoles fixent des conditions supplémentaires: l'âge adulte, la santé mentale, le sexe masculin, un seuil et l'absence de dettes, que certaines écoles rejettent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11614} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11615} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11616}. Le taux varie: les Hanafites et les Hanbalites prélèvent un demi-dixième sur les revenus d’un non-musulman protégé, les Malikites un dixième entier sauf sur les céréales apportées à La Mecque et à Médine, et les Shafi’ites s’en remettent à l’imam {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11616} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11617}. L’imam ou le gouverneur est habilité à le percevoir par l’intermédiaire d’un collecteur qui doit être musulman, libre, instruit et capable de protéger les commerçants. l'exploitation de la collection est traitée et détestée par certains juristes {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.11619} {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.11620} {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.11621} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11622}. Il expire lors de la conversion et peut être annulé par l'imam pour les biens dont les musulmans ont besoin, et il est dépensé à des fins de fay {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.11622} {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.11623}."
  ur: "لغت میں عشر دسواں ہے۔ ایک تکنیکی اصطلاح کے طور پر یہ یا تو تجارت اور فروخت پر دسواں حصہ ہے یا پیداوار پر دسواں حصہ یا زمین کی پیداوار پر زکوٰۃ ہے۔ اس اندراج میں تجارت پر دسواں حصہ لیا جاتا ہے، جو غیر مسلموں کے سامان پر عائد کیا جاتا ہے جو مسلم سرزمین کے ایک شہر سے دوسرے شہر میں تجارت کے لیے لے جاتے ہیں یہ غیر مسلم تاجروں سے لیا جاتا ہے جب وہ اپنے سامان کے ساتھ اسلام کی سرزمین میں داخل ہوتے ہیں، ایک پیشن گوئی کی رپورٹ کی بنیاد پر، ابتدائی برادری کے اتفاق اور ریاست تاجروں کو جو تحفظ فراہم کرتی ہے اس کے بارے میں استدلال؛ مسلمان تاجروں پر زکوٰۃ کے علاوہ کچھ واجب نہیں {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11609} ذمہ دار افراد معاہدے کے سوداگر، غیر مسلموں اور دشمن تاجروں کو محفوظ طرز عمل کے تحت تحفظ فراہم کرتے ہیں، اور مکاتب نے مزید شرائط مقرر کی ہیں: جوانی، عقل، مردانہ جنس، ایک حد، اور قرض سے آزادی، جسے بعض مکاتب نے مسترد کر دیا ہے {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11613} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11614} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11615} صفحہ 11616}۔ شرح مختلف ہے: حنفیہ اور حنبلی محفوظ غیر مسلم سے نصف دسواں حصہ لیتے ہیں، مالکی مکہ اور مدینہ سے لائے گئے غلہ کے علاوہ پورا دسواں حصہ لیتے ہیں، اور شافعی اسے امام کی شرائط پر چھوڑ دیتے ہیں۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 11617}۔ امام یا گورنر اس کو جمع کرنے کا حقدار ہے، ایک کلکٹر کے ذریعے جو ایک مسلمان، آزاد، باشعور اور تاجروں کی حفاظت کرنے کے قابل ہو۔ کچھ فقہاء کے نزدیک کھیتی باڑی کرنا اور اسے ناپسندیدہ سمجھا جاتا ہے {حوالہ:فقہ-موسوع کویتیہ-نور-v3 صفحہ 11619} {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص11622}۔ یہ تبدیلی کے بعد ختم ہو جاتی ہے اور مسلمانوں کے لیے ضروری سامان کے لیے امام کی طرف سے اسے معاف کیا جا سکتا ہے، اور اسے فضیلت کے مقاصد کے لیے خرچ کیا جاتا ہے {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 11622}"
