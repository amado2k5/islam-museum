id: concept/household-goods-shawra
class: concept
kind: legal
label:
  ar: "الشَّورة"
  en: "Shawra (the household goods a wife brings or is given: whose they are and the husband's use of them)"
  es: "Shawra (los enseres domésticos que trae o recibe la esposa: de quién son y el uso que les da el marido)"
  fr: "Shawra (les biens ménagers qu'une femme apporte ou qui lui sont offerts: à qui ils appartiennent et l'usage qu'en fait le mari)"
  ur: "شورہ ⁦(گھریلو سامان جو بیوی لاتی ہے یا دی جاتی ہے: وہ ہیں اور شوہر کا ان کا استعمال)⁩"
summary:
  ar: "الشورة متاع البيت من فراش وغطاء ولباس، وهي عند المالكية ما يحتاج إليه البيت من الأدوات. ويجب للزوجة على زوجها ما تقوم به حياتها من نفقة وكسوة وما تحتاج إليه من المتاع، وهو محل اتفاق. وليس للزوج الانتفاع بما تملكه الزوجة من متاع بغير رضاها عند الجمهور، وقال المالكية له الانتفاع إذا قبضت صداقها، وإن لم تقبضه فله منعها من التصرف الذي يزيل الملك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10257} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10258} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10259}"
  en: "Shawra is the household goods: bedding, covering and clothing, and in Maliki usage the implements the house needs. A wife is owed from her husband what keeps her alive, food and clothing and the goods she needs, which is agreed. Most jurists hold that the husband may not use goods the wife owns without her leave. The Malikis allow him use if she has received her dower; if not, he may stop her from disposing of the goods in a way that ends her ownership. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10257} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10258} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10259}"
  es: "Shawra se refiere a los enseres domésticos: ropa de cama, mantas y vestimenta, y en la tradición malikí, a los utensilios que necesita la casa. El marido le debe a la esposa lo necesario para subsistir: comida, ropa y los bienes que necesita, según lo acordado. La mayoría de los juristas sostienen que el marido no puede usar los bienes de la esposa sin su permiso. Los malikíes le permiten usarlos si ella ha recibido su dote; de lo contrario, él puede impedirle disponer de los bienes de forma que se extinga su propiedad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10257} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10258} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10259}"
  fr: "Le terme « shawra » désigne les biens ménagers: literie, couvertures et vêtements. Selon l’usage malikite, il s’agit des ustensiles nécessaires au bon fonctionnement du foyer. L’épouse a droit de son mari à ce qui lui permet de vivre, de se nourrir, de se vêtir et de subvenir à ses besoins, ce qui est convenu. La plupart des juristes estiment que le mari ne peut utiliser les biens de sa femme sans son consentement. Les malikites l’y autorisent si elle a reçu sa dot; dans le cas contraire, il peut l’empêcher de disposer des biens de manière à mettre fin à son droit de propriété. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10257} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10258} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10259}"
  ur: "شاورہ گھریلو سامان ہے: بستر، چادر اور کپڑے، اور مالکی استعمال میں گھر کی ضرورت کے آلات۔ بیوی پر اس کے شوہر کا مقروض ہے جو اسے زندہ رکھتا ہے، خوراک، لباس اور اس کی ضرورت کا سامان، جس پر اتفاق ہے۔ اکثر فقہاء کا خیال ہے کہ شوہر بیوی کی ملکیت میں موجود سامان اس کی رخصت کے بغیر استعمال نہیں کر سکتا۔ اگر اسے مہر مل گیا ہو تو مالکی اسے استعمال کرنے کی اجازت دیتے ہیں۔ اگر نہیں، تو وہ اسے سامان کو اس طرح ٹھکانے لگانے سے روک سکتا ہے جس سے اس کی ملکیت ختم ہو جائے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10257} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10258}"
