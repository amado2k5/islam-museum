id: concept/household-goods-shawra
class: concept
kind: legal
label:
  ar: "الشَّورة"
  en: "Shawra (the household goods a wife brings or is given: whose they are and the husband's use of them)"
summary:
  ar: "الشورة متاع البيت من فراش وغطاء ولباس، وهي عند المالكية ما يحتاج إليه البيت من الأدوات. ويجب للزوجة على زوجها ما تقوم به حياتها من نفقة وكسوة وما تحتاج إليه من المتاع، وهو محل اتفاق. وليس للزوج الانتفاع بما تملكه الزوجة من متاع بغير رضاها عند الجمهور، وقال المالكية له الانتفاع إذا قبضت صداقها، وإن لم تقبضه فله منعها من التصرف الذي يزيل الملك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10257} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10258} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10259}"
  en: "Shawra is the household goods: bedding, covering and clothing, and in Maliki usage the implements the house needs. A wife is owed from her husband what keeps her alive, food and clothing and the goods she needs, which is agreed. Most jurists hold that the husband may not use goods the wife owns without her leave. The Malikis allow him use if she has received her dower; if not, he may stop her from disposing of the goods in a way that ends her ownership. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10257} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10258} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10259}"
