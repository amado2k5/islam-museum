summary:
  ar: "يفتتح ابن سينا الفصل الثالث، في كيف ومتى يجب أن يستفرغ، بأن الأشياء التي تدل على صواب الحكم في الاستفراغ عشرة، وتورد الصفحة منها الامتلاء والسحنة والسن والفصل وهواء البلد وعادة الاستفراغ والصناعة، ثم يعدد الأحوال التي تمنع الاستفراغ {cite:canon-ibn-sina-print-v1 p.273}."
  en: "Ibn Sina opens the third chapter, on how and when to evacuate, saying that ten things indicate the right judgment about evacuation; the page names among them fullness, complexion, age, season, the air of the country, habit of evacuation and craft, and he then lists the states that forbid evacuating {cite:canon-ibn-sina-print-v1 p.273}."
