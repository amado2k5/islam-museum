id: concept/canon-when-evacuation-is-withheld
class: concept
kind: scientific
label: { ar: "موانع الاستفراغ عند ابن سينا", en: "What forbids evacuation in the Canon", ur: "وہ باتیں جو استفراغ سے روکتی ہیں قانون میں", es: "¿Qué prohíbe la evacuación en el Canon?", fr: "Qu'est-ce qui interdit l'évacuation dans le Canon ?" }
summary:
  ar: "يفتتح ابن سينا الفصل الثالث، في كيف ومتى يجب أن يستفرغ، بأن الأشياء التي تدل على صواب الحكم في الاستفراغ عشرة، وتورد الصفحة منها الامتلاء والسحنة والسن والفصل وهواء البلد وعادة الاستفراغ والصناعة، ثم يعدد الأحوال التي تمنع الاستفراغ {cite:canon-ibn-sina-print-v1 p.273}."
  en: "Ibn Sina opens the third chapter, on how and when to evacuate, saying that ten things indicate the right judgment about evacuation; the page names among them fullness, complexion, age, season, the air of the country, habit of evacuation and craft, and he then lists the states that forbid evacuating {cite:canon-ibn-sina-print-v1 p.273}."
  es: "Ibn Sina abre el tercer capítulo, sobre cómo y cuándo evacuar, diciendo que diez cosas indican el juicio correcto sobre la evacuación; la página menciona entre ellas la plenitud, la tez, la edad, la estación, el aire del país, el hábito de evacuación y la técnica, y luego enumera los estados que prohíben la evacuación {cite:canon-ibn-sina-print-v1 p.273}."
  fr: "Ibn Sina ouvre le troisième chapitre, sur comment et quand évacuer, en disant que dix choses indiquent le bon jugement concernant l'évacuation; la page cite parmi elles la satiété, le teint, l'âge, la saison, l'air du pays, l'habitude d'évacuer et la compétence, et il énumère ensuite les états qui interdisent l'évacuation {cite:canon-ibn-sina-print-v1 p.273}."
  ur: "ابن سینا تیسرا باب کھولتے ہیں، کس طرح اور کب نکالنا ہے، یہ کہتے ہوئے کہ دس چیزیں انخلاء کے بارے میں صحیح فیصلے پر دلالت کرتی ہیں۔ ان میں صفحہ کے نام پرپورنیت، رنگت، عمر، موسم، ملک کی ہوا، نقل مکانی کی عادت اور ہنر شامل ہیں، اور پھر وہ ان ریاستوں کی فہرست بناتا ہے جو انخلاء سے منع کرتی ہیں۔"
