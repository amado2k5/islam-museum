class: concept
kind: legal
label:
  ar: "الروث"
  en: "Rawth: animal dung, its purity or impurity, its effect on prayer, its use in cleansing, and its sale"
  ur: "روث (جانوروں کی لید)"
summary:
  ar: "الروث لغة رجيع ذي الحافر، ويستعمله الفقهاء في رجيع غيره كالإبل والغنم، والخثى للبقر، والبعر للإبل والغنم، والذرق للطيور، والعذرة للآدمي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9038} والمالكية والحنابلة والشافعية في وجه يرون أن روث ما يؤكل لحمه طاهر، واستدلوا بالحديث في الصلاة في مرابض الغنم، أما روث غير المأكول فنجس عندهم، والحنفية والشافعية على المذهب يرون نجاسة روث كل الحيوانات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9038} وعند أبي حنيفة نجاسة الروث غليظة، لأن فيه نصا على نجاسته، وعند الصاحبين أبي يوسف ومحمد خفيفة لاختلاف العلماء فيها، فإن أصاب الثوب منه أكثر من قدر الدرهم لم تصح الصلاة فيه عند أبي حنيفة، وقال الصاحبان: يجزئ حتى يفحش. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9039} والمالكية يعفون عما أصاب الخف والنعل من أرواث الدواب في الطرق، أما الثوب والبدن فلا عفو فيهما، وعند أحمد يعفى عن يسير فضلات السباع والبغل والحمار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9040} وفي الاستنجاء بالروث يمنعه الشافعية والحنابلة وجمهور المالكية، ويكرهه الحنفية، فإن فعل من خالف فالحنفية والمالكية وابن تيمية يعتدون بالإنقاء، أما الشافعية وجمهور الحنابلة فلا يعتدون به، واستدلوا بحديث أبي هريرة وحديث ابن مسعود في زاد الجن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9040} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9041} وأما بيع الروث فيرجع فيه إلى مادة زبل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9041}"
  en: "Rawth is the dung of an animal with hooves in the lexicon; the jurists use it for the dung of any animal, such as camels and sheep. The dung of cows is khatha, of camels and sheep ba'r, of birds dhurq, and of humans 'adhra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9038} The Malikis, Hanbalis and, in one view, the Shafi'is hold that the dung of an animal whose meat is eaten is pure, citing the hadith permitting prayer in sheepfolds; the dung of an animal not eaten is impure for them, and the Hanafis and, according to the school's preferred view, the Shafi'is hold all dung impure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9038} Abu Hanifa holds dung to be gross impurity, because a text declares it impure, while Abu Yusuf and Muhammad hold it light impurity, since the scholars differ about it. Thus a garment with more than a dirham's worth of dung on it does not validate prayer for Abu Hanifa, while the two companions allow it unless it is excessive. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9039} The Malikis excuse what falls on shoes and sandals from beasts' dung in the roads, but not on clothes or the body; Ahmad excuses a little of the droppings of beasts of prey, mules and donkeys. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9040} On cleaning with dung, the Shafi'is, Hanbalis and most Malikis forbid it, and the Hanafis dislike it; if someone does so anyway, the Hanafis, Malikis and Ibn Taymiyya count it if it cleans, while the Shafi'is and most Hanbalis do not, relying on the hadiths of Abu Hurayra and of Ibn Mas'ud about the provision of the jinn. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9040} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9041} The sale of dung is treated under the entry on zibl. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9041}"
  ur: "روث لغت میں ذی الحافر جانور کی لید کو کہتے ہیں، اور فقہا اس لفظ کو اونٹ اور بکری وغیرہ کی لید کے لیے بھی استعمال کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9038} مالکیہ، حنابلہ اور شافعیہ کے ایک قول کے مطابق جس جانور کا گوشت کھایا جائے اس کا روث پاک ہے، جبکہ حنفیہ اور شافعیہ کے مذہب میں ہر جانور کا روث نجس ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9038} امام ابو حنیفہ کے نزدیک نجاستِ غلیظہ ہے، جبکہ صاحبین کے نزدیک خفیفہ؛ امام ابو حنیفہ کے مطابق کپڑے پر درہم سے زیادہ ہو تو نماز درست نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9039} مالکیہ جوتے کے بارے میں معافی دیتے ہیں، کپڑے پر نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9040} استنجاء میں روث سے صفائی جمہور کے نزدیک ناجائز ہے، اور اگر کوئی کرے تو حنفیہ اور مالکیہ کے نزدیک صفائی ہو جاتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9040} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9041} روث کی بیع کے لیے مادہ زبل دیکھیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9041}"
