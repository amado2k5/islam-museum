label:
  ar: "الروث"
  en: "Rawth: animal dung, its purity or impurity, its effect on prayer, its use in cleansing, and its sale"
  ur: "روث ⁦(جانوروں کی لید)⁩"
  es: "Rawth: estiércol animal, su pureza o impureza, su efecto en la oración, su uso en la purificación y su venta."
  fr: "Rawth: excréments d’animaux, leur pureté ou leur impureté, leur effet sur la prière, leur utilisation pour la purification et leur vente"
  tr: "gübre"
  id: "kotoran"
summary:
  ar: "الروث لغة رجيع ذي الحافر، ويستعمله الفقهاء في رجيع غيره كالإبل والغنم، والخثى للبقر، والبعر للإبل والغنم، والذرق للطيور، والعذرة للآدمي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9038} والمالكية والحنابلة والشافعية في وجه يرون أن روث ما يؤكل لحمه طاهر، واستدلوا بالحديث في الصلاة في مرابض الغنم، أما روث غير المأكول فنجس عندهم، والحنفية والشافعية على المذهب يرون نجاسة روث كل الحيوانات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9038} وعند أبي حنيفة نجاسة الروث غليظة، لأن فيه نصا على نجاسته، وعند الصاحبين أبي يوسف ومحمد خفيفة لاختلاف العلماء فيها، فإن أصاب الثوب منه أكثر من قدر الدرهم لم تصح الصلاة فيه عند أبي حنيفة، وقال الصاحبان: يجزئ حتى يفحش. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9039} والمالكية يعفون عما أصاب الخف والنعل من أرواث الدواب في الطرق، أما الثوب والبدن فلا عفو فيهما، وعند أحمد يعفى عن يسير فضلات السباع والبغل والحمار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9040} وفي الاستنجاء بالروث يمنعه الشافعية والحنابلة وجمهور المالكية، ويكرهه الحنفية، فإن فعل من خالف فالحنفية والمالكية وابن تيمية يعتدون بالإنقاء، أما الشافعية وجمهور الحنابلة فلا يعتدون به، واستدلوا بحديث أبي هريرة وحديث ابن مسعود في زاد الجن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9040} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9041} وأما بيع الروث فيرجع فيه إلى مادة زبل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9041}"
  en: "Rawth is the dung of an animal with hooves in the lexicon; the jurists use it for the dung of any animal, such as camels and sheep. The dung of cows is khatha, of camels and sheep ba'r, of birds dhurq, and of humans 'adhra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9038} The Malikis, Hanbalis and, in one view, the Shafi'is hold that the dung of an animal whose meat is eaten is pure, citing the hadith permitting prayer in sheepfolds; the dung of an animal not eaten is impure for them, and the Hanafis and, according to the school's preferred view, the Shafi'is hold all dung impure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9038} Abu Hanifa holds dung to be gross impurity, because a text declares it impure, while Abu Yusuf and Muhammad hold it light impurity, since the scholars differ about it. Thus a garment with more than a dirham's worth of dung on it does not validate prayer for Abu Hanifa, while the two companions allow it unless it is excessive. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9039} The Malikis excuse what falls on shoes and sandals from beasts' dung in the roads, but not on clothes or the body; Ahmad excuses a little of the droppings of beasts of prey, mules and donkeys. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9040} On cleaning with dung, the Shafi'is, Hanbalis and most Malikis forbid it, and the Hanafis dislike it; if someone does so anyway, the Hanafis, Malikis and Ibn Taymiyya count it if it cleans, while the Shafi'is and most Hanbalis do not, relying on the hadiths of Abu Hurayra and of Ibn Mas'ud about the provision of the jinn. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9040} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9041} The sale of dung is treated under the entry on zibl. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9041}"
  ur: "روث لغت میں ذی الحافر جانور کی لید کو کہتے ہیں، اور فقہا اس لفظ کو اونٹ اور بکری وغیرہ کی لید کے لیے بھی استعمال کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9038} مالکیہ، حنابلہ اور شافعیہ کے ایک قول کے مطابق جس جانور کا گوشت کھایا جائے اس کا روث پاک ہے، جبکہ حنفیہ اور شافعیہ کے مذہب میں ہر جانور کا روث نجس ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9038} امام ابو حنیفہ کے نزدیک نجاستِ غلیظہ ہے، جبکہ صاحبین کے نزدیک خفیفہ؛ امام ابو حنیفہ کے مطابق کپڑے پر درہم سے زیادہ ہو تو نماز درست نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9039} مالکیہ جوتے کے بارے میں معافی دیتے ہیں، کپڑے پر نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9040} استنجاء میں روث سے صفائی جمہور کے نزدیک ناجائز ہے، اور اگر کوئی کرے تو حنفیہ اور مالکیہ کے نزدیک صفائی ہو جاتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9040} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9041} روث کی بیع کے لیے مادہ زبل دیکھیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9041}"
  es: "Rawth es el estiércol de un animal con pezuñas en el léxico; los juristas lo usan para el estiércol de cualquier animal, como camellos y ovejas. El estiércol de las vacas es khatha, el de los camellos y las ovejas ba'r, el de las aves dhurq y el de los humanos 'adhra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9038} Los malikíes, hanbalíes y, según una opinión, los shafiíes sostienen que el estiércol de un animal cuya carne se come es puro, citando el hadiz que permite la oración en los rediles; el estiércol de un animal que no se come es impuro para ellos, y los hanafíes y, según la opinión preferida de la escuela, los shafiíes sostienen que todo el estiércol es impuro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9038} Abu Hanifa considera el estiércol una impureza grave, porque un texto lo declara impuro, mientras que Abu Yusuf y Muhammad lo consideran una impureza leve, ya que los eruditos difieren al respecto. Por lo tanto, una prenda con más de un dirham de estiércol no valida la oración para Abu Hanifa, mientras que los dos compañeros lo permiten a menos que sea excesivo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9039} Los malikíes excusan lo que cae sobre los zapatos y sandalias del estiércol de las bestias en los caminos, pero no sobre la ropa o el cuerpo; Ahmad excusa un poco de los excrementos de las bestias de presa, mulas y asnos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9040} Sobre la limpieza con estiércol, los shafi'íes, hanbalíes y la mayoría de los malikíes la prohíben, y los hanafíes la desaprueban; si alguien lo hace de todos modos, los hanafíes, malikíes e Ibn Taymiyya la consideran válida si limpia, mientras que los shafi'íes y la mayoría de los hanbalíes no, basándose en los hadices de Abu Hurayra y de Ibn Mas'ud sobre la provisión de los genios. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9040} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9041} La venta de estiércol se trata en la entrada sobre zibl. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9041}"
  fr: "Le terme « rawth » désigne, dans le lexique, les excréments d'un animal à sabots; les juristes l'emploient pour désigner les excréments de tout animal, comme les chameaux et les moutons. Les excréments de vaches sont appelés « khatha », ceux de chameaux et de moutons « ba'r », ceux d'oiseaux « dhurq » et ceux des humains « 'adhra ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9038} Les Malikites, les Hanbalites et, selon une certaine opinion, les Chafi'ites considèrent que les excréments d'un animal dont on consomme la viande sont purs, se fondant sur le hadith autorisant la prière dans les bergeries; les excréments d'un animal non consommé sont impurs à leurs yeux, tandis que les Hanafites et, selon l'avis majoritaire de cette école, les Chafi'ites considèrent tous les excréments comme impurs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9038} Abou Hanifa considère les excréments comme une impureté grave, car un texte les déclare impurs, tandis qu'Abou Yusuf et Muhammad les considèrent comme une impureté légère, les savants divergeant à ce sujet. Ainsi, pour Abou Hanifa, un vêtement souillé d'excréments d'une valeur supérieure à un dirham ne valide pas la prière, alors que les deux compagnons l'autorisent, sauf en cas d'excès. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9039} Les Malikites excusent les excréments d'animaux trouvés sur les chemins et tombés sur les chaussures et les sandales, mais pas ceux tombés sur les vêtements ou le corps; Ahmad excuse une petite quantité d'excréments de bêtes de proie, de mules et d'ânes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9040} Concernant le nettoyage avec de la bouse, les écoles chaféite, hanbalite et la plupart des écoles malikites l'interdisent, et les écoles hanafites le désapprouvent; si quelqu'un le fait malgré tout, les écoles hanafite, malikite et Ibn Taymiyya le considèrent comme valide s'il nettoie, tandis que les écoles chaféite et la plupart des écoles hanbalites ne le considèrent pas, se fondant sur les hadiths d'Abu Hurayra et d'Ibn Mas'ud concernant la subsistance des djinns. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9040} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9041} La vente de bouse est traitée dans l'article relatif au zibl. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9041}"
  tr: "'Gübre' terimi, toynak gübresi için dilsel terimdir ve fihihiler deve ve koyun, sığır için turba, deve ve koyunlar için 'ba'r', kuşlar için 'dharaq' ve insanlar için 'aḥra' gibi diğer gübre türleri için kullanırlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9038} Malikiler, Hanbaliler ve Şafi'ler, yenilen etin gübresinin saf olduğunu savunur ve koyun dinlenme yerlerinde namaz kılınmasıyla ilgili hadisleri aktarırlar; oysa yenmemiş gübre onlara göre kirli sayılır. Hanafi ve Şafi'ler, kendi okullarına göre, tüm hayvanların gübresini kirli sayırlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9038} Abu Hanifa'ya göre, gübrenin kirliliği ağırdır çünkü açıkça kirli olduğunu belirtir. İki sahabe Ebu Yusuf ve Muhammed'e göre, alimler arasında anlaşmazlık nedeniyle hafiftir. Eğer giysi dirhem miktarından fazlaysa, namaz Ebu Hanifa'ya göre geçerli değildir. İki âlim şöyle demiştir: Müstehcen olana kadar yeterlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9039} Malikiler, çorap ve sandaletleri yollardaki hayvansal mirastan muaf tutar, giysi ve beden ise affedilmez. Ahmed'e göre, küçük hayvan, katır ve eşek dışkısından muaftırlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.. 9040} Gübreli istinje konusunda Şafiiler, Hanbaliler ve Malikilerin çoğunluğu bunu yasaklar, Hanafiler ise hoşlanmaz. Birisi karşı çıkarsa, Hanefiler, Malikiler ve İbn Teymiyye yanılmaz sayılırken, Şafiiler ve Hanbelilerin çoğunluğu bunu geçerli saymaz ve Cin sağlanmasıyla ilgili Ebu Huraira ve İbn Mas'ud'un hadislerini alıntılamışlardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9040} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9041} Gübreye satışı ise gübre malzemesini ifade eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9041}"
  id: "Istilah 'kotoran adalah istilah linguistik untuk kotoran kuku, dan ahli hukum menggunakannya untuk jenis kotoran lain seperti unta dan domba, gambut untuk sapi, 'ba'r' untuk unta dan domba, 'dharaq' untuk burung, dan 'aḥra' untuk manusia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9038} Maliki, Hanbali, dan Shafi'i berpendapat bahwa kotoran daging yang dimakan adalah murni, dan mereka mengutip hadis tentang shalat di tempat peristirahatan domba, sedangkan kotoran yang tidak dimakan dianggap tidak murni menurut mereka. Hanafi dan syafi'i, menurut aliran mereka, menganggap kotoran semua hewan tidak suci. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9038} Menurut Abu Hanifa, kotoran kotoran berat karena secara eksplisit menyatakan kotorannya. Menurut dua sahabat Abu Yusuf dan Muhammad, kotoran itu ringan karena perbedaan pendapat para ulama. Jika pakaian lebih dari jumlah dirham, shalat tidak sah menurut Abu Hanifa. Kedua ulama itu berkata: Cukup sampai menjadi cabul. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9039} Keluarga Malik dibebaskan dari warisan hewan di jalan, sedangkan pakaian dan tubuh tidak diampuni. Menurut Ahmad, mereka dibebaskan dari kotoran kecil seperti ternak, keledai, dan keledai. {cite:fiqh-mawsua-Kuwaitiyya-noor-v3 hlm. 9040} Mengenai istinja dengan kotoran, Shafi'i, Hanbali, dan mayoritas Malik melarangnya, dan Hanafi tidak menyukainya. Jika ada yang tidak setuju, Hanafi, Maliki, dan Ibn Taymiyyah dianggap tidak pernah salah, sementara Syafi'i dan mayoritas Hanbalis tidak menganggapnya sah dan telah mengutip hadits Abu Huraira dan Ibn Mas'ud mengenai penyediaan jin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9040} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9041} Adapun penjualan kotoran, itu merujuk pada bahan kotoran kandang ternak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9041}"
