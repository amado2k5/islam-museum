summary:
  ar: "عنب الثعلب في الكتاب خمسة أنواع ينقل وصفها عن ديسقوريدوس، منها البستاني المأكول ومنها المنوم ومنها المجنن ومنها القاتل، بارد في الأولى يابس في الثانية، ينفع من الأورام الحارة والصداع وأوجاع العين، وفيه تحذير صريح من أن المخدر منه يحدث الجنون إذا أكثر منه وأن بعضه قاتل {cite:canon-ibn-sina-print-v1 p.612}"
  en: "Inab al-tha'lab is in the book of five kinds whose descriptions are reported from Dioscorides, among them the garden kind that is eaten, the sleep-inducing, the maddening and the deadly; cold in the first degree and dry in the second, it benefits hot swellings, headache and pains of the eye, and the book carries a plain warning that the narcotic kind causes madness in excess and that some kinds kill {cite:canon-ibn-sina-print-v1 p.612}"
  ur: "عنب الثعلب کتاب میں پانچ اقسام کا ہے جن کا وصف دیسقوریدوس سے نقل ہے، ان میں باغی جو کھایا جاتا ہے، نیند لانے والا، پاگل کرنے والا اور قاتل ہیں؛ پہلے درجے میں سرد اور دوسرے میں خشک، گرم ورموں، سر درد اور آنکھ کے دردوں میں فائدہ دیتا ہے، اور کتاب میں واضح تنبیہ ہے کہ نشہ آور قسم زیادہ لینے سے جنون پیدا کرتی ہے اور بعض اقسام مار ڈالتی ہیں {cite:canon-ibn-sina-print-v1 p.612}۔"
  es: "Inab al-tha'lab se encuentra en el libro de cinco tipos cuyas descripciones se recogen de Dioscórides, entre ellos el tipo de jardín que se come, el somnífero, el enloquecedor y el mortal; frío en el primer grado y seco en el segundo, beneficia las hinchazones calientes, los dolores de cabeza y los dolores de ojos, y el libro contiene una clara advertencia de que el tipo narcótico causa locura en exceso y que algunos tipos matan {cite:canon-ibn-sina-print-v1 p.612}"
  fr: "L'Inab al-tha'lab figure dans le livre des cinq sortes dont Dioscoride rapporte les descriptions, parmi lesquelles la sorte comestible, celle qui provoque le sommeil, celle qui rend fou et celle qui est mortelle; froide au premier degré et sèche au second, elle est bénéfique en cas de gonflements chauds, de maux de tête et de douleurs oculaires. Le livre contient un avertissement clair: la sorte narcotique peut rendre fou en excès et certaines sortes peuvent tuer. {cite:canon-ibn-sina-print-v1 p.612}"
