label:
  ar: "العَرْصَة"
  en: "Courtyard or open plot (arsa)"
  fr: "Cour ou parcelle ouverte (arsa)"
  ur: "عرصہ"
  es: "Patio o parcela abierta (arsa)"
summary:
  ar: "العرصة في اللغة ساحة الدار، وهي البقعة الواسعة التي ليس فيها بناء، وقيل كل موضع واسع لا بناء فيه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11549}. والفقهاء يستعملونها بمعنيين: أخص وهو ساحة الدار بين بيوتها، وأعم وهو القطعة من الأرض سواء كانت بين الدور أم لا {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11549}. وتتصل بها الحريم وهو ما حول الشيء من حقوقه ومرافقه، والفناء وهو ما اتصل بالشيء معداً لمصالحه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11550}. وتدخل العرصة في البيع إذا قيل أرض أو ساحة أو بقعة فيها بناء وشجر، وتثبت الشفعة فيها على خلاف بين المذاهب، فالمالكية لا يرون الشفعة في العرصة، والشافعية والحنابلة يشترطون إمكان القسمة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11552}. وفي الأيمان والوصية تختلف الأحكام، فمن حلف لا يدخل الدار فانهدمت وصارت ساحة لم يحنث عند الجمهور، ومن أوصى بعرصة فبناها عدّ ذلك رجوعاً عند الحنفية والشافعية والحنابلة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11553} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11554}."
  en: "In the lexicon, arsa is the courtyard of a house, an open wide space with no building on it; some say any open place without building {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11549}. Jurists use it in two senses: a narrow one, the open yard between houses, and a broader one, any plot of land whether or not it lies between houses {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11549}. Related words are hareem, what surrounds a thing and serves its rights and uses, and fina', what extends from a thing and serves its purposes {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11550}. In a sale, an arsa with a building and trees on it enters the sale when described as land, courtyard or plot; pre-emption over it is disputed: the Malikis deny pre-emption over the courtyard, while the Shafi'is and Hanbalis tie it to whether the plot can be divided {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11552}. In oaths and bequests the rules differ: a person who swears not to enter a house that collapses into a courtyard does not breach the oath according to the majority, and building on a bequeathed courtyard counts as retraction according to the Hanafis, Shafi'is and Hanbalis {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11553} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11554}."
  fr: "Dans le lexique, arsa désigne la cour d’une maison, un vaste espace ouvert sans construction ; certains disent tout lieu ouvert sans construction {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11549}. Les juristes l’emploient dans deux sens : un sens restreint, la cour ouverte entre les maisons, et un sens plus large, toute parcelle de terre, qu’elle soit ou non située entre des maisons {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11549}. Les termes connexes sont hareem, ce qui entoure une chose et sert ses droits et ses usages, et fina', ce qui s’étend à partir d’une chose et sert ses fins {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11550}. Dans une vente, une arsa portant une construction et des arbres est comprise dans la vente lorsqu’elle est décrite comme terre, cour ou parcelle ; la préemption à son égard est discutée : les malikites refusent la préemption sur la cour, tandis que les chaféites et les hanbalites la font dépendre de la possibilité de diviser la parcelle {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11552}. Pour les serments et les legs, les règles diffèrent : une personne qui jure de ne pas entrer dans une maison qui s’effondre et devient une cour ne rompt pas son serment selon la majorité, et construire sur une cour léguée vaut révocation selon les hanafites, les chaféites et les hanbalites {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11553} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11554}."
  es: "En el léxico, arsa es el patio de una casa, un espacio abierto y amplio sin ningún edificio; algunos dicen cualquier lugar abierto sin edificios {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11549}. Los juristas lo usan en dos sentidos: uno restringido, el patio abierto entre casas, y uno más amplio, cualquier parcela de tierra, esté o no ubicada entre casas {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11549}. Palabras relacionadas son hareem, lo que rodea una cosa y sirve a sus derechos y usos, y fina', lo que se extiende de una cosa y sirve a sus propósitos {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11550}. En una venta, un arsa con un edificio y árboles en él entra en la venta cuando se describe como terreno, patio o parcela; el derecho de tanteo sobre él es disputado: los malikíes niegan el derecho de tanteo sobre el patio, mientras que los shafi'ís y hanbalíes lo vinculan a si la parcela se puede dividir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11552}. En juramentos y legados las reglas difieren: una persona que jura no entrar en una casa que se derrumba en un patio no incumple el juramento según la mayoría, y construir en un patio legado cuenta como retractación según los Hanafi, Shafi'i y Hanbali {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11553} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11554}."
  ur: "لغت میں ارسہ گھر کا صحن ہے، ایک کھلی چوڑی جگہ جس پر کوئی عمارت نہ ہو۔ بعض کہتے ہیں کہ بغیر عمارت کے کھلی جگہ {حوالہ: فقہ معاویہ کویتیہ نور v3 صفحہ 11549}۔ فقہاء اسے دو معنوں میں استعمال کرتے ہیں: ایک تنگ، مکانوں کے درمیان کھلا صحن، اور ایک وسیع، زمین کا کوئی بھی پلاٹ چاہے وہ مکانات کے درمیان ہو یا نہ ہو۔ متعلقہ الفاظ حریم ہیں، جو چیز کو گھیرے ہوئے ہے اور اس کے حقوق اور استعمال کو پورا کرتا ہے اور فنا، جو چیز سے پھیلا ہوا ہے اور اس کے مقاصد کو پورا کرتا ہے۔ فروخت میں، عمارت اور درختوں کے ساتھ ارسا فروخت میں داخل ہوتا ہے جب اسے زمین، صحن یا پلاٹ کہا جاتا ہے۔ اس پر قبل از تخفیف اختلافی ہے: مالکیہ صحن پر قبل از تخفیف کا انکار کرتے ہیں، جبکہ شافعیہ اور حنبلی اس بات سے جوڑتے ہیں کہ آیا پلاٹ کو تقسیم کیا جاسکتا ہے قسموں اور وصیتوں میں احکام مختلف ہیں: جو شخص صحن میں گرنے والے گھر میں داخل نہ ہونے کی قسم کھاتا ہے وہ جمہور کے مطابق قسم کی خلاف ورزی نہیں کرتا، اور وصیت شدہ صحن پر تعمیر کرنا احناف، شافعیہ اور حنبلیوں کے نزدیک اعتکاف شمار ہوتا ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 11554}۔"
