label:
  ar: "العَرْصَة"
  en: "Courtyard or open plot (arsa)"
  ur: "عرصہ"
summary:
  ar: "العرصة في اللغة ساحة الدار، وهي البقعة الواسعة التي ليس فيها بناء، وقيل كل موضع واسع لا بناء فيه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11549}. والفقهاء يستعملونها بمعنيين: أخص وهو ساحة الدار بين بيوتها، وأعم وهو القطعة من الأرض سواء كانت بين الدور أم لا {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11549}. وتتصل بها الحريم وهو ما حول الشيء من حقوقه ومرافقه، والفناء وهو ما اتصل بالشيء معداً لمصالحه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11550}. وتدخل العرصة في البيع إذا قيل أرض أو ساحة أو بقعة فيها بناء وشجر، وتثبت الشفعة فيها على خلاف بين المذاهب، فالمالكية لا يرون الشفعة في العرصة، والشافعية والحنابلة يشترطون إمكان القسمة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11552}. وفي الأيمان والوصية تختلف الأحكام، فمن حلف لا يدخل الدار فانهدمت وصارت ساحة لم يحنث عند الجمهور، ومن أوصى بعرصة فبناها عدّ ذلك رجوعاً عند الحنفية والشافعية والحنابلة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11553} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11554}."
  en: "In the lexicon, arsa is the courtyard of a house, an open wide space with no building on it; some say any open place without building {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11549}. Jurists use it in two senses: a narrow one, the open yard between houses, and a broader one, any plot of land whether or not it lies between houses {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11549}. Related words are hareem, what surrounds a thing and serves its rights and uses, and fina', what extends from a thing and serves its purposes {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11550}. In a sale, an arsa with a building and trees on it enters the sale when described as land, courtyard or plot; pre-emption over it is disputed: the Malikis deny pre-emption over the courtyard, while the Shafi'is and Hanbalis tie it to whether the plot can be divided {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11552}. In oaths and bequests the rules differ: a person who swears not to enter a house that collapses into a courtyard does not breach the oath according to the majority, and building on a bequeathed courtyard counts as retraction according to the Hanafis, Shafi'is and Hanbalis {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11553} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11554}."
