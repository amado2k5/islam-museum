summary:
  ar: "العقوبة في اللغة اسم من العقاب، وهي في الاصطلاح الجزاء المقرر على المعصية، وقيل ما يلحق الإنسان مستحقاً على الجريمة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11776}. وتنقسم باعتبار أنواعها إلى القصاص والحد والتعزير، وباعتبار تعلقها بحق الله أو بحق العباد أو بالحقين، وباعتبار كمالها أو قصورها أو اجتماع معنى العبادة فيها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11777}. ومن عقوبات أخرى الغرة والأرش، والحرمان من الميراث والوصية للقاتل لحديث «ليس للقاتل شيء من الميراث» {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11777} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11778}. والحدود مقدرة شرعاً وهي الزنا والقذف والشرب والسرقة والحرابة باتفاق، وفيها الردة والبغي مع خلاف {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11778}. والتعزير عقوبة غير مقدرة مشروعة للردع والإصلاح، ويجوز فيه الجلد والحبس والتوبيخ ونحوها، ولا يجوز فيه الضرب المتلف أو صفع الوجه أو الحرق أو حلق اللحية {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11779}. وأجاز بعض الفقهاء اجتماع العقوبات في الجريمة الواحدة إذا اختلفت صفتها، وتتداخل الحدود المتحدة الجنس والموجب {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11780}."
  en: "In the lexicon, uquba is a penalty, a noun from 'iqab; as a term it is the penalty fixed for a wrong, or what falls on a person as a deserved consequence of an offence {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11776}. Penalties are classed by kind, as retaliation, fixed punishment (hadd) and discretionary punishment (ta'zir); by whether the right belongs to God, to people, or to both; and by whether they are complete, incomplete or carry an element of worship {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11777}. Other penalties include the ghurra for a foetus and the arsh for an injury, and the killer's loss of inheritance and bequest, on the prophetic instruction that the killer has no share in the inheritance {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11777} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11778}. The fixed punishments are determined by the law: illicit intercourse, false accusation, drinking, theft and brigandage, and by disagreement, apostasy and rebellion {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11778}. Discretionary punishment is not fixed by the law and serves to deter and reform; flogging, imprisonment and reproof are allowed, while maiming, slapping the face, burning and shaving the beard are not {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11779}. Some jurists allow penalties of different kinds to be combined for one offence, and penalties of the same kind and cause overlap {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11780}."
  es: "En el léxico, uquba es un castigo, un sustantivo derivado de 'iqab; como término, es el castigo fijado por una falta, o lo que recae sobre una persona como consecuencia merecida de una ofensa {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11776}. Los castigos se clasifican por tipo, como represalia, castigo fijo (hadd) y castigo discrecional (ta'zir); por si el derecho pertenece a Dios, a las personas o a ambos; y por si son completos, incompletos o conllevan un elemento de culto {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11777}. Otras penas incluyen el ghurra por un feto y el arsh por una lesión, y la pérdida de herencia y legado del asesino, en la instrucción profética de que el asesino no tiene parte en la herencia {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11777} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11778}. Los castigos fijos están determinados por la ley: coito ilícito, falsa acusación, bebida, robo y bandidaje, y por desacuerdo, apostasía y rebelión {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11778}. El castigo discrecional no está fijado por la ley y sirve para disuadir y reformar; Se permiten los azotes, el encarcelamiento y la reprimenda, mientras que la mutilación, las bofetadas, las quemaduras y el afeitado de la barba no lo están {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11779}. Algunos juristas permiten que se combinen penas de diferentes tipos para un mismo delito, y que las penas del mismo tipo y causa se superpongan {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11780}."
  fr: "Dans le lexique, uquba est une peine, un nom dérivé de 'iqab; en tant que terme, il désigne la peine infligée pour une faute, ou ce qui arrive à une personne comme conséquence méritée d'une infraction {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11776}. Les peines sont classées selon leur nature: représailles, châtiment fixe (hadd) et châtiment discrétionnaire (ta'zir); selon que le droit appartient à Dieu, aux hommes ou aux deux; et selon qu'elles sont complètes, incomplètes ou comportent un élément d'adoration {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11777}. D'autres peines incluent la ghurra pour un fœtus et l'arsh pour une blessure, ainsi que la perte de l'héritage et du legs pour le meurtrier, conformément à l'enseignement prophétique selon lequel le meurtrier n'a aucune part à l'héritage {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11777} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11778}. Les peines fixes sont déterminées par la loi: relations sexuelles illicites, fausse accusation, ivresse, vol et brigandage, ainsi que, pour désaccord, apostasie et rébellion {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11778}. La peine discrétionnaire n'est pas fixée par la loi et sert à dissuader et à réformer. La flagellation, l'emprisonnement et la réprimande sont autorisés, tandis que les mutilations, les gifles, les brûlures et le rasage de la barbe ne le sont pas {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11779}. Certains juristes autorisent le cumul de peines de nature différente pour une même infraction, ainsi que le chevauchement des peines de même nature et de même cause {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11780}."
  ur: "لغت میں، عقوبہ ایک سزا ہے، 'اقاب' سے ایک اسم؛ ایک اصطلاح کے طور پر یہ جرم کے لیے مقرر کردہ جرمانہ ہے، یا جرم کے مستحق نتیجے کے طور پر کسی شخص پر کیا پڑتا ہے۔ سزاؤں کو قسم کے لحاظ سے درجہ بندی کیا جاتا ہے، جیسا کہ انتقامی، مقررہ سزا ⁦(حد)⁩ اور صوابدیدی سزا ⁦(تذیر)⁩؛ چاہے حق خدا کا ہے، لوگوں کا یا دونوں کا۔ اور چاہے وہ مکمل ہوں، نامکمل ہوں یا عبادت کا کوئی عنصر رکھتے ہوں دیگر تعزیرات میں جنین کے لیے غرا اور چوٹ کے لیے عرش، اور قاتل کا وراثت اور وصیت سے محروم ہونا، اس نبوی ہدایت پر کہ قاتل کا وراثت میں کوئی حصہ نہیں ہے۔ صفحہ 11778}۔ مقررہ سزائیں قانون کے ذریعے متعین ہوتی ہیں: ناجائز جماع، جھوٹا الزام، شراب نوشی، چوری اور چوری، اور اختلاف، ارتداد اور بغاوت سے۔ صوابدیدی سزا قانون کے ذریعہ طے نہیں کی گئی ہے اور یہ روکنے اور اصلاح کا کام کرتی ہے۔ کوڑے مارنے، قید کرنے اور ملامت کرنے کی اجازت ہے، جبکہ معذوری، چہرے پر تھپڑ مارنا، داڑھی کو جلانا اور منڈوانا جائز نہیں ہے۔ بعض فقہاء ایک جرم کے لیے مختلف قسم کی سزاؤں کو جمع کرنے کی اجازت دیتے ہیں، اور ایک ہی قسم کے جرمانے اور ایک ہی قسم کے جرمانے {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11779}"
  tr: "Ceza, dilsel olarak bir ceza biçimini ifade eder ve terminolojide günah için verilen cezadır. Suçu işlemeye hak eden bir kişinin başına gelenlerin olduğu söylenir {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.11776}. Türlerine göre ayrılırlar: qisa, hudud ve ta'zir; Allah'ın hakkı, hizmetkârların hakları veya iki hakla ilişkileri; ve mükemmelliklerine, eksikliklerine veya ibadete eşzamanlı anlamlarına {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11777}. Diğer cezalar arasında 'al-ghara' ve 'arsh', mirastan mahrum bırakma ve katile vasiyet etme yer alır; bunlar arasında 'katilin mirası yoktur' hadisine göre {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11777} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11778} yer alır. Hudud cezaları İslam hukukuna göre zina, iftira, içki, hırsızlık ve anlaşmayla wagaroot dahil olmak üzere belirlenmiştir ve dinden dönme ve baskı ile anlaşmazlık içerir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11778}. Ta'zir, caydırıcılık ve islah için öngörülmemiş, belirlenmemiş bir cezadır ve kırbaçlama, hapis, azarlama ve benzeri cezalar kabul edilebilir. Ağır dayak, yüze tokat atma, yakma veya sakalın tıraş edilmesi dahil değildir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11779}. Bazı hukukçular, bir suçun doğası farklıysa ve aynı cinsiyetin sınırları ile nedeni örtüşüyorsa cezaların birleştirilmesine izin vermiştir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11780}."
  id: "Hukuman secara linguistik merujuk pada bentuk hukuman, dan dalam terminologi, hukuman yang ditetapkan untuk dosa. Dikatakan bahwa apa yang menimpa seseorang yang layak melakukan kejahatan {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11776}. Mereka dibagi menurut jenisnya: qisa, hudud, dan ta'zir; hubungannya dengan hak Allah, hak para pelayan, atau dua hak tersebut; serta kesempurnaan, kekurangan, atau makna ibadah yang bersamaan {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11777}. Hukuman lain termasuk 'al-ghara' dan 'arsh', pencabutan warisan, dan wasiat kepada pembunuh, menurut hadits 'Pembunuh tidak memiliki warisan' {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11777} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11778}. Hukuman hudud diatur oleh hukum Islam, termasuk perzinahan, fitnah, minum, pencurian, dan wagaroot dengan persetujuan, termasuk murtad dan penindasan, dengan perselisihan {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11778}. Ta'zir adalah hukuman yang tidak ditentukan dan tidak ditetapkan untuk pencegahan dan reformasi, serta hukuman cambuk, penjara, teguran, dan hukuman serupa diperbolehkan. Tidak termasuk pemukulan berat, tamparan wajah, pembakaran, atau pencukuran jenggot {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11779}. Beberapa ahli hukum mengizinkan kombinasi hukuman dalam satu kejahatan jika sifatnya berbeda dan batas gender yang sama serta penyebab tumpang tindih {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11780}."
