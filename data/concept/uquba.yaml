id: concept/uquba
class: concept
kind: legal
label:
  ar: "العُقُوبَة"
  en: "Punishment (uquba): fixed, retaliatory and discretionary"
  ur: "سزا (عقوبت)"
summary:
  ar: "العقوبة في اللغة اسم من العقاب، وهي في الاصطلاح الجزاء المقرر على المعصية، وقيل ما يلحق الإنسان مستحقاً على الجريمة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11776}. وتنقسم باعتبار أنواعها إلى القصاص والحد والتعزير، وباعتبار تعلقها بحق الله أو بحق العباد أو بالحقين، وباعتبار كمالها أو قصورها أو اجتماع معنى العبادة فيها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11777}. ومن عقوبات أخرى الغرة والأرش، والحرمان من الميراث والوصية للقاتل لحديث «ليس للقاتل شيء من الميراث» {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11777} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11778}. والحدود مقدرة شرعاً وهي الزنا والقذف والشرب والسرقة والحرابة باتفاق، وفيها الردة والبغي مع خلاف {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11778}. والتعزير عقوبة غير مقدرة مشروعة للردع والإصلاح، ويجوز فيه الجلد والحبس والتوبيخ ونحوها، ولا يجوز فيه الضرب المتلف أو صفع الوجه أو الحرق أو حلق اللحية {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11779}. وأجاز بعض الفقهاء اجتماع العقوبات في الجريمة الواحدة إذا اختلفت صفتها، وتتداخل الحدود المتحدة الجنس والموجب {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11780}."
  en: "In the lexicon, uquba is a penalty, a noun from 'iqab; as a term it is the penalty fixed for a wrong, or what falls on a person as a deserved consequence of an offence {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11776}. Penalties are classed by kind, as retaliation, fixed punishment (hadd) and discretionary punishment (ta'zir); by whether the right belongs to God, to people, or to both; and by whether they are complete, incomplete or carry an element of worship {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11777}. Other penalties include the ghurra for a foetus and the arsh for an injury, and the killer's loss of inheritance and bequest, on the prophetic instruction that the killer has no share in the inheritance {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11777} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11778}. The fixed punishments are determined by the law: illicit intercourse, false accusation, drinking, theft and brigandage, and by disagreement, apostasy and rebellion {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11778}. Discretionary punishment is not fixed by the law and serves to deter and reform; flogging, imprisonment and reproof are allowed, while maiming, slapping the face, burning and shaving the beard are not {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11779}. Some jurists allow penalties of different kinds to be combined for one offence, and penalties of the same kind and cause overlap {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11780}."
