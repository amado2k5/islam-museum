id: concept/tacmim-generalisation
class: concept
kind: legal
label:
  ar: التعميم
  en: Ta'mim (generalisation in purification, supplication and alms)
  ur: تعمیم (وضو، دعا اور زکوٰۃ میں عمومیت)
summary:
  ar: 'التعميم لغة جعل الشيء عاما شاملا، ويستعمله الفقهاء بهذا المعنى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5530} في الوضوء يجب تعميم كل عضو يجب غسله بالماء، واتفق الفقهاء عدا الزهري على أن الأذنين ليستا من الوجه، وخالف الحنابلة في داخل الفم والأنف فأوجبوا غسلهما، والأئمة الثلاثة يعتبرون غسل ظاهر الأنف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5530} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5531} ويجب إزالة الطين أو العجين الملتصق بالأظفار حتى يصل الماء، واغتفر بعض الحنفية وبعض الشافعية ذلك للخباز والعامل في الطين، وقال المالكية يعفى عن وسخ الأظفار ما لم يتفاحش. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5531} وفي الغسل يجب تعميم الجسد كله بالماء، واختلفوا في المضمضة والاستنشاق، فأوجبهما الحنفية والحنابلة، وقال المالكية والشافعية بغسل الظاهر فقط. ويجب إيصال الماء إلى منابت الشعر، ونقض الضفائر التي لا يصل الماء إلى باطنها إلا بنقضها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5532} وفي التيمم اختلفوا في تعميم المسح: فأوجب المالكية والشافعية والحنابلة تعميم الوجه ومنه اللحية، وقال الحنفية إن تعميم الوجه واليدين في التيمم شرط لا ركن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533} والتعميم في الدعاء سنة، والحديث الذي يفضل دعاء أمة محمد رحمة عامة نقله الخطيب وابن عدي وأنكره ابن عدي، وفي حديث الأعرابي الذي دعا لنفسه ولمحمد ولم يدع لأحد معهما قال النبي: لقد تحجرت واسعا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533} وتعميم الأصناف الثمانية في الزكاة غير واجب عند الجمهور، وأوجبه الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533} والدعوة العامة إلى الولائم (الجفلى) تجوز إجابتها عند الجمهور، وأجازها الحنابلة مع الكراهة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533}'
  en: 'Ta''mim means in language making a thing general and comprehensive, and the jurists use it in this sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5530} In ablution every part that must be washed must be reached by water. Except al-Zuhri, the jurists agree that the ears are not part of the face; the Hanbalis differ on the inside of mouth and nose and make them obligatory, while the other three schools require only the outer nose. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5530} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5531} Clay or dough stuck under the nails must be removed so that water reaches the skin; some Hanafis and Shafiis excuse the baker and the clay worker, and the Malikis excuse nail dirt unless it is excessive. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5531} In the full bath the whole body must be reached, with the inside of mouth and nose a point of dispute: the Hanafis and Hanbalis require it, the Malikis and Shafiis do not. Water must reach the roots of hair, and plaited locks must be unbraided if water cannot reach beneath. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5532} In tayammum the schools differ on covering the face: the Malikis, Shafiis and Hanbalis require covering the whole face, including the beard; the Hanafis hold the covering of the face and hands a condition, not a pillar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533} Generality in supplication is recommended. A report that the dearest prayer to God is one that asks mercy for the community of Muhammad as a whole was given by al-Khatib, and Ibn Adi rejected it; a bedouin who prayed for himself and Muhammad only was told he had narrowed a wide mercy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533} Covering all eight categories of zakat recipients is not obligatory for most jurists; the Shafiis require it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533} A general invitation to a feast (al-juffa) may be accepted by most jurists; the Hanbalis allow it with dislike. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533}'
  ur: 'تعمیم لغت میں کسی چیز کو عام اور شامل بنانے کو کہتے ہیں، اور فقہاء اس لفظ کو اسی معنی میں استعمال کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5530} وضو میں ہر وہ عضو جسے دھونا واجب ہے اس تک پانی پہنچنا ضروری ہے۔ زہری کے سوا فقہاء کا اتفاق ہے کہ کان چہرے کا حصہ نہیں؛ حنابلہ نے منہ اور ناک کے اندرونی حصے کو دھونا واجب کہا، جبکہ ائمہ ثلاثہ کے نزدیک ناک کا ظاہری حصہ کافی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5530} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5531} ناخنوں کے نیچے لگی مٹی یا آٹا ہٹانا ضروری ہے تاکہ پانی جلد تک پہنچے؛ بعض حنفیہ اور شافعیہ نے نانبائی اور مٹی کا کام کرنے والے کے لیے رعایت دی، اور مالکیہ کے نزدیک ناخنوں کی میل معاف ہے جب تک زیادہ نہ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5531} غسل میں پورے بدن کا پانی تک پہنچنا ضروری ہے؛ منہ اور ناک کے اندرونی حصے میں حنفیہ اور حنابلہ کے نزدیک کلی اور ناک میں پانی ڈالنا فرض ہے، جبکہ مالکیہ اور شافعیہ کے نزدیک ظاہر کا دھونا کافی ہے۔ بالوں کی جڑوں تک پانی پہنچانا اور جوڑے کھولنا ضروری ہے اگر اندر پانی نہ پہنچے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5532} تیمم میں مسح کے تعمیم پر اختلاف ہے: مالکیہ، شافعیہ اور حنابلہ داڑھی سمیت پورے چہرے کا مسح واجب کہتے ہیں، جبکہ حنفیہ کے نزدیک چہرے اور ہاتھوں کا تعمیم شرط ہے، رکن نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533} دعا میں تعمیم سنت ہے۔ ایک روایت کہ سب سے پسندیدہ دعا امت محمد کے لیے عام رحمت کی دعا ہے، خطیب نے نقل کی اور ابن عدی نے اسے ناپسند کیا؛ اور اعرابی کا واقعہ جس نے صرف اپنے اور محمد کے لیے دعا کی، اس پر فرمایا گیا کہ تم نے وسیع رحمت کو تنگ کر دیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533} زکوٰۃ کے آٹھوں مصارف میں تعمیم جمہور کے نزدیک واجب نہیں، جبکہ شافعیہ واجب کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533} عام دعوت (جفلی) کو جمہور کے نزدیک قبول کرنا جائز ہے، اور حنابلہ کے نزدیک کراہت کے ساتھ جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533}'
