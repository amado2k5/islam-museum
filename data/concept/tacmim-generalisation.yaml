label:
  ar: التعميم
  en: Ta'mim (generalisation in purification, supplication and alms)
  ur: تعمیم ⁦(وضو، دعا اور زکوٰۃ میں عمومیت)⁩
  es: "Ta'mim (generalización en purificación, súplica y limosna)"
  fr: "Ta'mim (généralisation en matière de purification, de supplication et d'aumône)"
  tr: "Dairesel"
  id: "Lingkaran"
summary:
  ar: 'التعميم لغة جعل الشيء عاما شاملا، ويستعمله الفقهاء بهذا المعنى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5530} في الوضوء يجب تعميم كل عضو يجب غسله بالماء، واتفق الفقهاء عدا الزهري على أن الأذنين ليستا من الوجه، وخالف الحنابلة في داخل الفم والأنف فأوجبوا غسلهما، والأئمة الثلاثة يعتبرون غسل ظاهر الأنف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5530} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5531} ويجب إزالة الطين أو العجين الملتصق بالأظفار حتى يصل الماء، واغتفر بعض الحنفية وبعض الشافعية ذلك للخباز والعامل في الطين، وقال المالكية يعفى عن وسخ الأظفار ما لم يتفاحش. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5531} وفي الغسل يجب تعميم الجسد كله بالماء، واختلفوا في المضمضة والاستنشاق، فأوجبهما الحنفية والحنابلة، وقال المالكية والشافعية بغسل الظاهر فقط. ويجب إيصال الماء إلى منابت الشعر، ونقض الضفائر التي لا يصل الماء إلى باطنها إلا بنقضها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5532} وفي التيمم اختلفوا في تعميم المسح: فأوجب المالكية والشافعية والحنابلة تعميم الوجه ومنه اللحية، وقال الحنفية إن تعميم الوجه واليدين في التيمم شرط لا ركن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533} والتعميم في الدعاء سنة، والحديث الذي يفضل دعاء أمة محمد رحمة عامة نقله الخطيب وابن عدي وأنكره ابن عدي، وفي حديث الأعرابي الذي دعا لنفسه ولمحمد ولم يدع لأحد معهما قال النبي: لقد تحجرت واسعا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533} وتعميم الأصناف الثمانية في الزكاة غير واجب عند الجمهور، وأوجبه الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533} والدعوة العامة إلى الولائم ⁦(الجفلى)⁩ تجوز إجابتها عند الجمهور، وأجازها الحنابلة مع الكراهة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533}'
  en: 'Ta''mim means in language making a thing general and comprehensive, and the jurists use it in this sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5530} In ablution every part that must be washed must be reached by water. Except al-Zuhri, the jurists agree that the ears are not part of the face; the Hanbalis differ on the inside of mouth and nose and make them obligatory, while the other three schools require only the outer nose. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5530} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5531} Clay or dough stuck under the nails must be removed so that water reaches the skin; some Hanafis and Shafiis excuse the baker and the clay worker, and the Malikis excuse nail dirt unless it is excessive. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5531} In the full bath the whole body must be reached, with the inside of mouth and nose a point of dispute: the Hanafis and Hanbalis require it, the Malikis and Shafiis do not. Water must reach the roots of hair, and plaited locks must be unbraided if water cannot reach beneath. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5532} In tayammum the schools differ on covering the face: the Malikis, Shafiis and Hanbalis require covering the whole face, including the beard; the Hanafis hold the covering of the face and hands a condition, not a pillar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533} Generality in supplication is recommended. A report that the dearest prayer to God is one that asks mercy for the community of Muhammad as a whole was given by al-Khatib, and Ibn Adi rejected it; a bedouin who prayed for himself and Muhammad only was told he had narrowed a wide mercy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533} Covering all eight categories of zakat recipients is not obligatory for most jurists; the Shafiis require it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533} A general invitation to a feast (al-juffa) may be accepted by most jurists; the Hanbalis allow it with dislike. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533}'
  ur: 'تعمیم لغت میں کسی چیز کو عام اور شامل بنانے کو کہتے ہیں، اور فقہاء اس لفظ کو اسی معنی میں استعمال کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5530} وضو میں ہر وہ عضو جسے دھونا واجب ہے اس تک پانی پہنچنا ضروری ہے۔ زہری کے سوا فقہاء کا اتفاق ہے کہ کان چہرے کا حصہ نہیں؛ حنابلہ نے منہ اور ناک کے اندرونی حصے کو دھونا واجب کہا، جبکہ ائمہ ثلاثہ کے نزدیک ناک کا ظاہری حصہ کافی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5530} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5531} ناخنوں کے نیچے لگی مٹی یا آٹا ہٹانا ضروری ہے تاکہ پانی جلد تک پہنچے؛ بعض حنفیہ اور شافعیہ نے نانبائی اور مٹی کا کام کرنے والے کے لیے رعایت دی، اور مالکیہ کے نزدیک ناخنوں کی میل معاف ہے جب تک زیادہ نہ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5531} غسل میں پورے بدن کا پانی تک پہنچنا ضروری ہے؛ منہ اور ناک کے اندرونی حصے میں حنفیہ اور حنابلہ کے نزدیک کلی اور ناک میں پانی ڈالنا فرض ہے، جبکہ مالکیہ اور شافعیہ کے نزدیک ظاہر کا دھونا کافی ہے۔ بالوں کی جڑوں تک پانی پہنچانا اور جوڑے کھولنا ضروری ہے اگر اندر پانی نہ پہنچے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5532} تیمم میں مسح کے تعمیم پر اختلاف ہے: مالکیہ، شافعیہ اور حنابلہ داڑھی سمیت پورے چہرے کا مسح واجب کہتے ہیں، جبکہ حنفیہ کے نزدیک چہرے اور ہاتھوں کا تعمیم شرط ہے، رکن نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533} دعا میں تعمیم سنت ہے۔ ایک روایت کہ سب سے پسندیدہ دعا امت محمد کے لیے عام رحمت کی دعا ہے، خطیب نے نقل کی اور ابن عدی نے اسے ناپسند کیا؛ اور اعرابی کا واقعہ جس نے صرف اپنے اور محمد کے لیے دعا کی، اس پر فرمایا گیا کہ تم نے وسیع رحمت کو تنگ کر دیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533} زکوٰۃ کے آٹھوں مصارف میں تعمیم جمہور کے نزدیک واجب نہیں، جبکہ شافعیہ واجب کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533} عام دعوت ⁦(جفلی)⁩ کو جمہور کے نزدیک قبول کرنا جائز ہے، اور حنابلہ کے نزدیک کراہت کے ساتھ جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533}'
  es: "Ta'mim significa en el lenguaje hacer algo general y completo, y los juristas lo usan en este sentido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5530} En la ablución, toda parte que deba lavarse debe ser alcanzada por el agua. Excepto al-Zuhri, los juristas están de acuerdo en que las orejas no son parte de la cara; los Hanbalis difieren en el interior de la boca y la nariz y las hacen obligatorias, mientras que las otras tres escuelas requieren solo la nariz externa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5530} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5531} La arcilla o masa pegada debajo de las uñas debe ser retirada para que el agua llegue a la piel; algunos Hanafis y Shafiis eximen al panadero y al trabajador de arcilla, y los Malikis eximen la suciedad de las uñas a menos que sea excesiva. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5531} En el baño completo se debe alcanzar todo el cuerpo, siendo el interior de la boca y la nariz un punto de disputa: los Hanafis y Hanbalis lo requieren, los Malikis y Shafiis no. El agua debe llegar a las raíces del cabello, y los mechones trenzados deben deshacerse si el agua no puede llegar debajo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5532} En el tayammum las escuelas difieren en cuanto a cubrirse la cara: los Malikis, Shafiis y Hanbalis requieren cubrirse toda la cara, incluyendo la barba; los Hanafis consideran que cubrirse la cara y las manos es una condición, no un pilar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533} Se recomienda la generalidad en la súplica. Al-Khatib informó que la oración más querida a Dios es la que pide misericordia para la comunidad de Muhammad en su conjunto, e Ibn Adi la rechazó; a un beduino que oró solo por sí mismo y por Muhammad se le dijo que había restringido una amplia misericordia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533} Cubrir las ocho categorías de receptores de zakat no es obligatorio para la mayoría de los juristas; los shafiíes lo requieren. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533} La mayoría de los juristas pueden aceptar una invitación general a un banquete (al-juffa); los Hanbali lo permiten con disgusto. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533}"
  fr: "En langage courant, le terme « ta'mim » signifie généraliser et élargir une notion, et c'est dans ce sens que les juristes l'emploient. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5530} Lors des ablutions, toute partie du corps devant être lavée doit être atteinte par l'eau. À l'exception d'al-Zuhri, les juristes s'accordent à dire que les oreilles ne font pas partie du visage; les hanbalites divergent quant au lavage de l'intérieur de la bouche et du nez, qu'ils rendent obligatoire, tandis que les trois autres écoles n'exigent que le lavage de l'extérieur du nez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5530} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5531} Il faut retirer toute trace d'argile ou de pâte collée sous les ongles afin que l'eau atteigne la peau; certains hanafites et shafiites dispensent le boulanger et le potier de ce lavage, et les malikites l'autorisent sauf en cas d'excès. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5531} Lors du bain complet, le corps entier doit être lavé. Le lavage de l'intérieur de la bouche et du nez fait débat: les hanafites et les hanbalites l'exigent, contrairement aux malikites et aux chaféites. L'eau doit atteindre la racine des cheveux, et les tresses doivent être défaites si l'eau ne peut pas pénétrer en dessous. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5532} Concernant le tayammum, les écoles divergent sur le fait de se couvrir le visage: les malikites, les chaféites et les hanbalites exigent de se couvrir tout le visage, y compris la barbe; les hanafites considèrent que se couvrir le visage et les mains est une condition, et non un pilier. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533} Il est recommandé d'exprimer ses supplications de manière générale. Al-Khatib rapporte que la prière la plus chère à Dieu est celle qui implore la miséricorde pour la communauté de Muhammad dans son ensemble, mais Ibn Adi la rejette; un bédouin qui pria pour lui-même et pour Muhammad seulement s'est vu dire qu'il avait restreint une large miséricorde. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533} La plupart des juristes n'exigent pas que les huit catégories de bénéficiaires de la zakat soient incluses; les chaféites, en revanche, l'imposent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533} La plupart des juristes peuvent accepter une invitation générale à un festin (al-juffa). les Hanbalis le permettent avec aversion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533}"
  tr: "Genelleştirme, dilsel olarak bir şeyi genel ve kapsamlı yapmak anlamına gelir ve hukukçular bunu bu anlamda kullanırlar. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.5530} Abdestörde, suyla yıkanması gereken her uzuv genelleştirilmelidir. Zuhri hariç, hukukçular kulakların yüzün bir parçası olmadığı konusunda hemfikirdir. Hanbalılar ağız ve burnun içi konusunda anlaşmazlık yaşadıkları için onları yıkamayı zorunlu kılarlar. Üç imam burnun dış kısmının yıkanmasını yıkanmış sayar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5530} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5531} Tırnaklara yapışan kil veya macun su ulaşana kadar çıkarılmalıdır. Bazı Hanafi ve bazı Şafiiler fırıncı ve kil işçisi için bunu mazur görür. Malikiler çivi kirinin ahlaksız olmadığı sürece muaf olduğunu söyler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5531} Ghusl'da tüm vücut suyla kaplanmalıdır. Durulama ve soluma konusunda anlaşmazlık vardır, bu yüzden Hanafi ve Hanbali bunları zorunlu kılarken, Malikiler ve Şafi'ler sadece dış kısmın yıkanması gerektiğini söyler. Su saç köklerine getirilmeli ve iç kısmına ulaşamayan örgüler ancak çıkarılarak çıkarılmalıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5531}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5532} Tayammum konusunda silmenin genelleştirilmesi konusunda görüş ayrılığı vardır: Malikiler, Şafiiler ve Hanbaliler yüzü ve sakalı kapatmayı zorunlu kılardı. Hanafiler, yüzü ve elleri tayammumla örtmenin bir koşul olduğunu, bir sütun olmadığını söylerdi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5532} {Kaynak:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 s. 5533} Genelleştirici dua sünnettir ve Muhammed milletinin duasını genel bir merhamet olarak savunan hadis El-Hatib ve İbn Adi tarafından aktarılmış, İbn Adi tarafından reddedilmiştir. Kendisi ve Muhammed için namaz kılan ama kimse için namaz kılmayan bedevilerin hadislerinde Peygamber şöyle dedi: Çok katı oldum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5533} Sekiz zekat kategorisini genellemek çoğunluğa göre zorunlu değildir ve Şafiiler bunu zorunlu kılar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5533} Genel ziyafet daveti (jafla) çoğunluk tarafından kabul edilebilir ve Hanbaliler bunu hoşnutsuzlukla kabul eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5533}"
  id: "Generalisasi secara linguistik berarti membuat sesuatu yang umum dan komprehensif, dan para ahli hukum menggunakannya dalam arti ini. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5530} Dalam wudhu, setiap anggota tubuh yang harus dicuci dengan air harus digeneralisasi. Kecuali Zuhri, para ahli hukum setuju bahwa telinga bukan bagian dari wajah. Hanbalis tidak setuju mengenai bagian dalam mulut dan hidung, sehingga mencucinya wajib. Ketiga imam menganggap mencuci bagian luar hidung harus dicuci. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5530} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5531} Tanah liat atau pasta yang menempel pada paku harus diangkat sampai air sampai ke sana. Beberapa Hanafi dan beberapa Syafi'i membenarkan ini untuk pembuat roti dan pekerja tanah liat. Umat Malik mengatakan bahwa kotoran paku dibebaskan kecuali jika tidak bermoral. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5531} Dalam ghusl, seluruh tubuh harus ditutupi air. Ada perbedaan pendapat mengenai bilas dan inhalasi, sehingga Hanafi dan Hanbali mewajibkannya, sementara Maliki dan Shafi mengatakan hanya bagian luar yang harus dicuci. Air harus dibawa ke akar rambut, dan kepang yang tidak dapat dibersihkan air harus dibersihkan kecuali dengan menghilangkannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5532} Mengenai tayammum, ada perbedaan pendapat mengenai generalisasi penghapusan: Maliki, Shafi'i, dan Hanbalis wajib menutupi wajah, termasuk janggut. Para Hanahi mengatakan bahwa menutupi wajah dan tangan dengan tayammum adalah sebuah kondisi, bukan pilar. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.5532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5533} Doa yang menggeneralisasi adalah Sunnah, dan hadis yang mendukung doa bangsa Muhammad sebagai rahmat umum disampaikan oleh Al-Khatib dan Ibn Adi, dan ditolak oleh Ibn Adi. Dalam hadis umat Badui yang berdoa untuk dirinya dan Muhammad tetapi tidak berdoa untuk siapa pun bersama mereka, Nabi berkata: Aku telah menjadi sangat kaku. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5533} Generalisasi delapan kategori zakat bukanlah kewajiban menurut mayoritas, dan Shafi'i mewajibkannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5533} Undangan umum untuk pesta (jafla) diperbolehkan diterima oleh mayoritas, dan Hanbalis mengizinkannya dengan tidak suka. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533}"
