summary:
  ar: "العظاءة في الكتاب حيوان يشبه سام أبرص أخضر بطيء الحركة، وينقل عن ديسقوريدوس أن قوتها ضعيفة، تدخل في مراهم مأكلة وملائمة، وينفع من الجرب، ويحلق ذنبها الشعر {cite:canon-ibn-sina-print-v1 pp.620-621}"
  en: "Azaa is in the book an animal like the gecko, green and slow, whose power, as reported from Dioscorides, is weak; it enters corrosive and soothing ointments, benefits scab, and its tail removes hair {cite:canon-ibn-sina-print-v1 pp.620-621}"
  fr: "Dans le livre, l’azaa est un animal semblable au gecko, vert et lent, dont le pouvoir, rapporté d’après Dioscoride, est faible ; il entre dans des onguents corrosifs et apaisants, est dit utile contre la gale, et sa queue aurait un effet dépilatoire {cite:canon-ibn-sina-print-v1 pp.620-621}"
  ur: "عظاءة کتاب میں ایک جانور ہے جو چھپکلی سے ملتا جلتا، سبز اور سست رفتار ہے، دیسقوریدوس سے نقل ہے کہ اس کی قوت کمزور ہے؛ یہ کھانے اور نرم کرنے والے مرہموں میں شامل ہوتی ہے، خارش میں نافع ہے اور اس کی دم بال اتارتی ہے {cite:canon-ibn-sina-print-v1 pp.620-621}۔"
  es: "Azaa es descrito en el libro como un animal parecido al gecko, verde y lento, cuyo poder, según Dioscórides, es débil; se utiliza en ungüentos corrosivos y calmantes, beneficia las costras y su cola elimina el vello. {cite:canon-ibn-sina-print-v1 pp.620-621}"
  tr: "Kitaptaki büyük hayvan, yavaş hareket eden yeşil cüzzamlı Sam'e benzer. Dioscorides'ten bildirildiğine göre dayanıklılığı zayıftır, yenilebilir ve uygun merhemlerde kullanılır, uyuz için faydalı olur ve kuyruğu saçlarını tıraş eder {cite:canon-ibn-sina-print-v1 s.620-621}"
  id: "Hewan besar dalam buku ini mirip dengan Sam, seekor kusta hijau yang bergerak lambat. Dilaporkan dari Dioscorides bahwa kekuatannya lemah, digunakan dalam salep yang dapat dimakan dan sesuai, bermanfaat untuk kudis, dan ekornya mencukur bulunya {cite:canon-ibn-sina-print-v1 hlm.620-621}"
