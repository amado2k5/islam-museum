summary:
  ar: "القياس في الاصطلاح الأصولي إلحاق فرع بأصل في حكمه لعلة جامعة؛ يعده الشافعي في الرسالة من أدلة الخبر مع الكتاب والسنة والإجماع {cite:risala-shafii}. ويصنف الغزالي في المستصفى القياس أربعة أنواع مرتبة: المؤثر وهو ما ظهر تأثير علته بنص أو إجماع أو سبر حاصر، ثم المناسب، ثم الشبه، وأدناها الطرد؛ وأعلى مراتب المؤثر ما كان في معنى الأصل فينبغي أن يقر به حتى منكر القياس، وأدنى الأقيسة الطرد فينبغي أن ينكره كل قائل بالقياس. {cite:mustasfa p.654-657} ويجعل أركان القياس أربعة: الأصل والفرع والعلة والحكم، ويشترط في الأصل ثمانية شروط أهمها ثبوت حكمه وتثبته الطريق السمعي الشرعي وكونه أصلاً لا فرعاً لأصل آخر. {cite:mustasfa p.669-672}"
  en: "Qiyas in usul usage is extending a root case's ruling to a branch case for a shared cause; al-Shafi'i counts it in the Risala among the proofs alongside the Book, the Sunna and ijma' {cite:risala-shafii}. Al-Ghazali's Mustasfa ranks four kinds of qiyas: the effective (mu'aththir), whose cause's effect appears by text, consensus or exhaustive inquiry; then the suitable (munasib); then the resembling (shibh); and lowest the mere parallel (tard) — whose highest degree, «in the meaning of the root», even a denier of qiyas should accept, while the mere parallel is what every proponent of qiyas should reject. {cite:mustasfa p.654-657} He makes qiyas rest on four pillars — root, branch, cause and ruling — and sets eight conditions on the root, chief among them that its ruling be established and established by a revealed pathway, and that it be a root and not itself a branch of another root. {cite:mustasfa p.669-672}"
  es: "Qiyas en el uso usul es extender el dictamen de un caso raíz a un caso derivado para una causa común; al-Shafi'i lo cuenta en la Risala entre las pruebas junto con el Libro, la Sunna y el ijma' {cite:risala-shafii}. El Mustasfa de Al-Ghazali clasifica cuatro tipos de qiyas: el efectivo (mu'aththir), cuyo efecto de la causa aparece por texto, consenso o investigación exhaustiva; luego el adecuado (munasib); luego el semejante (shibh); y el más bajo el mero paralelo (tard), cuyo grado más alto, «en el significado de la raíz», incluso un negacionista del qiyas debería aceptar, mientras que el mero paralelo es lo que todo defensor del qiyas debería rechazar. {cite:mustasfa p.654-657} Él fundamenta el qiyas en cuatro pilares: raíz, rama, causa y regente, y establece ocho condiciones para la raíz, entre las que destacan que su regente esté establecido y se establezca mediante un camino revelado, y que sea una raíz y no una rama de otra raíz. {cite:mustasfa p.669-672}"
  fr: "Le qiyas, en usage usul, consiste à étendre la décision d'un cas fondamental à un cas dérivé pour une cause commune. Al-Shafi'i le compte dans la Risala parmi les preuves, au même titre que le Coran, la Sunna et l'ijma' (citation: risala-shafii). Le Mustasfa d'Al-Ghazali distingue quatre types de qiyas: le qiyas efficace (mu'aththir), dont l'effet de la cause apparaît par le texte, le consensus ou une enquête exhaustive; le qiyas convenable (munasib); le qiyas ressemblant (shibh); et le qiyas simple (tard), au degré le plus bas. Ce dernier, « dans le sens du fondement », devrait être accepté même par un négationniste du qiyas, tandis que le qiyas simple devrait être rejeté par tous ses partisans. {cite:mustasfa p.654-657} Il fonde le qiyas sur quatre piliers — la racine, la branche, la cause et la règle — et fixe huit conditions à la racine, dont la principale est que sa règle soit établie et établie par une voie révélée, et qu'elle soit une racine et non une branche d'une autre racine. {cite:mustasfa p.669-672}"
  ur: "اصول کے استعمال میں قیاس ایک مشترکہ وجہ کے لیے روٹ کیس کے فیصلے کو برانچ کیس تک بڑھا رہا ہے۔ شافعی اسے رسالہ میں کتاب و سنت اور اجماع کے ساتھ دلائل میں شمار کرتے ہیں۔ الغزالی کی مصحف میں چار قسم کے قیاس ہیں: مؤثر ⁦(معاثیر)⁩ جس کا اثر متن، اجماع یا مکمل تحقیقات سے ظاہر ہوتا ہے۔ پھر موزوں ⁦(مناسب)⁩؛ پھر مشابہت (shibh)؛ اور سب سے کم متوازی ⁦(ترد)⁩ - جس کی اعلی ترین ڈگری، \"جڑ کے معنی میں\"، حتیٰ کہ قیاس کے منکر کو بھی قبول کرنا چاہیے، جب کہ محض متوازی وہ ہے جسے قیاس کے ہر حامی کو رد کرنا چاہیے۔ وہ قیاس کو چار ستونوں یعنی جڑ، شاخ، سبب اور حکم پر ٹھہراتا ہے اور جڑ پر آٹھ شرطیں مقرر کرتا ہے، ان میں سے اہم یہ ہے کہ اس کا حکم کسی ظاہری راستے سے قائم اور قائم ہو، اور یہ کہ وہ جڑ ہو نہ کہ خود دوسری جڑ کی شاخ۔ {حوالہ: مصطفٰی ص669-672}"
