summary:
  ar: "القياس في الاصطلاح الأصولي إلحاق فرع بأصل في حكمه لعلة جامعة؛ يعده الشافعي في الرسالة من أدلة الخبر مع الكتاب والسنة والإجماع {cite:risala-shafii}. ويصنف الغزالي في المستصفى القياس أربعة أنواع مرتبة: المؤثر وهو ما ظهر تأثير علته بنص أو إجماع أو سبر حاصر، ثم المناسب، ثم الشبه، وأدناها الطرد؛ وأعلى مراتب المؤثر ما كان في معنى الأصل فينبغي أن يقر به حتى منكر القياس، وأدنى الأقيسة الطرد فينبغي أن ينكره كل قائل بالقياس. {cite:mustasfa p.654-657} ويجعل أركان القياس أربعة: الأصل والفرع والعلة والحكم، ويشترط في الأصل ثمانية شروط أهمها ثبوت حكمه وتثبته الطريق السمعي الشرعي وكونه أصلاً لا فرعاً لأصل آخر. {cite:mustasfa p.669-672}"
  en: "Qiyas in usul usage is extending a root case's ruling to a branch case for a shared cause; al-Shafi'i counts it in the Risala among the proofs alongside the Book, the Sunna and ijma' {cite:risala-shafii}. Al-Ghazali's Mustasfa ranks four kinds of qiyas: the effective (mu'aththir), whose cause's effect appears by text, consensus or exhaustive inquiry; then the suitable (munasib); then the resembling (shibh); and lowest the mere parallel (tard) — whose highest degree, «in the meaning of the root», even a denier of qiyas should accept, while the mere parallel is what every proponent of qiyas should reject. {cite:mustasfa p.654-657} He makes qiyas rest on four pillars — root, branch, cause and ruling — and sets eight conditions on the root, chief among them that its ruling be established and established by a revealed pathway, and that it be a root and not itself a branch of another root. {cite:mustasfa p.669-672}"
