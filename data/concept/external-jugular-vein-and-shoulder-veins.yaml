summary:
  ar: "يصف ابن سينا الوداج الظاهر وكيف يتكون من قسمين يلتقيان، وما يتفرع منه من الكتفي والقيفال، وانقسامه إلى جزء باطن إلى الفكين واللسان وجزء ظاهر إلى الرأس والأذنين {cite:canon-ibn-sina-print-v1 p.90}."
  en: "Ibn Sina describes the external jugular vein and how it forms from two parts that meet, what branches from it as the scapular and cephalic veins, and how it divides into an inner part to the jaws and tongue and an outer part to the head and ears {cite:canon-ibn-sina-print-v1 p.90}."
  es: "Ibn Sina describe la vena yugular externa y cómo se forma a partir de dos partes que se unen, de qué se ramifican las venas escapular y cefálica, y cómo se divide en una parte interna hacia las mandíbulas y la lengua y una parte externa hacia la cabeza y las orejas {cite:canon-ibn-sina-print-v1 p.90}."
  fr: "Ibn Sina décrit la veine jugulaire externe et comment elle se forme à partir de deux parties qui se rejoignent, quelles branches en partent comme les veines scapulaire et céphalique, et comment elle se divise en une partie interne vers les mâchoires et la langue et une partie externe vers la tête et les oreilles {cite:canon-ibn-sina-print-v1 p.90}."
