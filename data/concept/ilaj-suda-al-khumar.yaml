id: concept/ilaj-suda-al-khumar
class: concept
kind: scientific
label:
  ar: "علاج صداع الخمار"
  en: "Treatment of the hangover headache"
  ur: "خمار کے صداع کا علاج"
  es: "Tratamiento del dolor de cabeza por resaca"
  fr: "Traitement des maux de tête liés à la gueule de bois"
summary:
  ar: "يذكر ابن سينا أن أول ما يجب في صداع الخمار تنقية المعدة ثم النوم والتبريد والترطيب والتغذية الخفيفة، ويحذّر من أمور تضر {cite:canon-ibn-sina-print-v2 pp.65-66}"
  en: "Ibn Sina says that the first need in the hangover headache is to cleanse the stomach, then sleep, cooling, moistening and light feeding, and he warns against things that harm {cite:canon-ibn-sina-print-v2 pp.65-66}"
  ur: "ابن سینا کہتا ہے کہ خمار کے صداع میں پہلی ضرورت معدے کی صفائی ہے، پھر نیند، ٹھنڈک، تری اور ہلکی غذا، اور وہ نقصان دینے والی چیزوں سے خبردار کرتا ہے {cite:canon-ibn-sina-print-v2 pp.65-66}۔"
  es: "Ibn Sina dice que la primera necesidad en el dolor de cabeza por resaca es limpiar el estómago, luego dormir, refrescarse, humedecerse y comer ligero, y advierte contra las cosas que dañan {cite:canon-ibn-sina-print-v2 pp.65-66}"
  fr: "Ibn Sina affirme que le premier besoin en cas de maux de tête dus à la gueule de bois est de nettoyer l'estomac, puis de dormir, de se rafraîchir, de s'hydrater et de manger légèrement, et il met en garde contre les choses qui peuvent nuire {cite:canon-ibn-sina-print-v2 pp.65-66}"
