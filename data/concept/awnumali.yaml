summary:
  ar: "أونومالي دهن ثخين حار جداً يتحلّب من شجرة حلوة؛ ينفع من الجرب المتقرح وأوجاع المفاصل، ويذكر الكتاب تأثيره المُسبِت المُرخي {cite:canon-ibn-sina-print-v1 p.362}."
  en: "Awnumali is a very hot, thick oil that exudes from a sweet tree. It helps scabies that has broken into ulcers and joint pains. The book also describes its sluggish, relaxing effect {cite:canon-ibn-sina-print-v1 p.362}."
  fr: "L’awnumali est une huile très chaude et épaisse qui suinte d’un arbre doux. Elle est présentée comme utile contre la gale devenue ulcéreuse et les douleurs articulaires. Le livre décrit aussi son effet d’engourdissement et de relâchement {cite:canon-ibn-sina-print-v1 p.362}."
  ur: "اومالی ایک بہت گرم، گاڑھا تیل ہے جو ایک میٹھے درخت سے رستا ہے؛ یہ پھوڑوں میں بدلی ہوئی خارش اور جوڑوں کے درد میں مفید ہے۔ کتاب اس کے سست کرنے والے اور ڈھیلا کرنے والے اثر کا ذکر کرتی ہے {cite:canon-ibn-sina-print-v1 p.362}۔"
