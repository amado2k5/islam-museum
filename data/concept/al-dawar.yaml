id: concept/al-dawar
class: concept
kind: scientific
label:
  ar: "الدوار والسدر"
  en: "Vertigo (dawar) and giddiness (sadar)"
  fr: "Vertige (dawar) et étourdissement (sadar)"
  ur: "دوار اور سدر"
  es: "Vértigo (dawar) y vértigo (sadar)"
summary:
  ar: "يبدأ ابن سينا المقالة الخامسة بالدوار: أن يتخيل لصاحبه أن الأشياء تدور عليه وأن دماغه وبدنه يدور فلا يملك أن يثبت، ويفرق بينه وبين الصرع وبين السدر {cite:canon-ibn-sina-print-v2 p.113}"
  en: "Ibn Sina opens the fifth maqala with dawar: the person imagines that things are turning around him and that his brain and body are turning, so that he cannot stand firm; he separates it from epilepsy and from sadar {cite:canon-ibn-sina-print-v2 p.113}"
  fr: "Ibn Sina ouvre la cinquième maqala par le dawar : la personne imagine que les choses tournent autour d’elle et que son cerveau et son corps tournent, si bien qu’elle ne peut se tenir fermement ; il le distingue de l’épilepsie et du sadar {cite:canon-ibn-sina-print-v2 p.113}"
  ur: "ابن سینا پانچویں مقالے کا آغاز دوار سے کرتا ہے: مریض کو خیال ہوتا ہے کہ چیزیں اس پر گھوم رہی ہیں اور اس کا دماغ اور بدن گھوم رہا ہے، چنانچہ وہ ٹھہر نہیں سکتا؛ وہ اسے صرع اور سدر سے ممتاز کرتا ہے {cite:canon-ibn-sina-print-v2 p.113}۔"
  es: "Ibn Sina abre el quinto maqala con dawar: la persona imagina que las cosas giran a su alrededor y que su cerebro y su cuerpo giran, de modo que no puede mantenerse firme; lo distingue de la epilepsia y del sadar {cite:canon-ibn-sina-print-v2 p.113}"
