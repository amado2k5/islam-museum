id: "concept/ilaj-al-gharb"
class: "concept"
kind: "scientific"
label:
  ar: "علاج الغرب"
  en: "Treating the gharb"
  ur: "غرب کا علاج"
  es: "Tratando el gharb"
summary:
  ar: "الغرب ورم مزمن وأخفه الحديث، فالحديث يعالج بأدوية مسهلة وأما المزمن فعلاجه الحقيقي الكي أو ما يقوم مقامه، وإن أريد دواء غير الكي فأفضله أن يعصر حتى يخرج ما فيه ثم يغسل بشراب قابض ويقطر فيه ومن أفضل تدبيره أن يسبر غوره بميل ويلف عليه قطنة تغمس في الأدوية وتجعل فيه ويشد بعصابة ويلزم السكون، وإذا بلغ العظم فلا بد من شقه والكشف عن باطنه وأخذ اللحم الميت ثم التدبير بحسب حال العظم ⁦(مواضع الكي والثقب وصفة عمل اليد كما وردت لا تفصّل كوصفة عمل)⁩ {cite:canon-ibn-sina-print-v2 p.182} {cite:canon-ibn-sina-print-v2 p.183}"
  en: "The gharb is a chronic swelling whose lightest is the recent: the recent is treated with resolving drugs; the true treatment of the chronic is the cautery described or what stands in its place; if a drug other than cautery is wanted, the best is to squeeze till what is inside comes out, then wash with an astringent drink and drop into it; among its best management is to probe its depth with a probe, wind cotton on it soaked in the drugs and place it in, bind with a bandage and keep still; if it reaches the bone there is no help but incising it, laying open its inside and taking the dead flesh, then managing according to the bone's state ⁦(the cautery and perforation sites and the hand-work are carried as the book's account, not as instruction)⁩ {cite:canon-ibn-sina-print-v2 p.182} {cite:canon-ibn-sina-print-v2 p.183}"
  ur: "غرب ایک مزمن ورم ہے جس کا ہلکا ترین نیا ہوتا ہے: نئے کا علاج تحلیل کرنے والی ادویہ سے؛ اور مزمن کا حقیقی علاج بیان شدہ داغ ہے یا اس کا قائم مقام؛ اور اگر داغ کے سوا دوا چاہیے تو افضل یہ ہے کہ نچوڑا جائے تا اندر کی چیز نکل آئے پھر قابض شراب سے دھو کر اس میں قطروں سے ٹپکایا جائے؛ اور اس کی بہترین تدبیر یہ ہے کہ میل سے اس کی گہرائی ناپی جائے، میل پر روئی لپیٹی جائے جو ادویہ میں بگھو کر اس میں رکھی جائے، اور پٹی باندھ کر سکون اختیار کیا جائے؛ اور جب ہڈی تک پہنچ جائے تو چیر کر اندر کھولنا اور مردہ گوشت نکالنا ضروری، پھر ہڈی کی حالت کے مطابق تدبیر ⁦(داغ اور ثقب کے مقامات اور ہاتھ کے کام کی صفت کتاب کی روایت کے طور پر آئی، ہدایت کے طور پر نہیں)⁩ {cite:canon-ibn-sina-print-v2 p.182} {cite:canon-ibn-sina-print-v2 p.183}"
  es: "El gharb es una inflamación crónica, cuya forma más leve es la reciente: la reciente se trata con medicamentos que la resuelven; el verdadero tratamiento de la crónica es la cauterización descrita o lo que la sustituya; si se desea un medicamento distinto a la cauterización, lo mejor es comprimir hasta que salga lo que hay dentro, luego lavar con una bebida astringente y dejar caer gotas en ella; entre sus mejores tratamientos se encuentra sondear su profundidad con una sonda, enrollar algodón empapado en los medicamentos y colocarlo dentro, vendar y mantener inmóvil; si llega al hueso, no hay más remedio que incidirlo, abrir su interior y extraer la carne muerta, luego tratarlo según el estado del hueso (los sitios de cauterización y perforación y el trabajo manual se presentan como relato del libro, no como instrucciones) {cite:canon-ibn-sina-print-v2 p.182} {cite:canon-ibn-sina-print-v2 p.183}"
