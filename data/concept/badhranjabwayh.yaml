id: concept/badhranjabwayh
class: concept
kind: natural
label:
  ar: "باذرنجبويه"
  en: "Badhranjabwayh (melissa, lemon balm)"
  fr: "Badhranjabwayh (mélisse)"
  ur: "باذرنجبویہ ⁦(ملیسا)⁩"
  es: "Badhranjabwayh (melisa, toronjil)"
  tr: "Zencefil"
  id: "Jahe"
summary:
  ar: "هو الماليسا. حار يابس في الثانية، ومفرّح مقوٍّ للقلب، يذهب الخفقان، وينفع من جميع العلل البلغمية والسوداوية، وينفع من الجرب السوداوي، ويذهب بالبخر، وينفع من سدد الدماغ، ويعين على الهضم، وينفع من الفواق، ويطيّب النكهة جداً {cite:canon-ibn-sina-print-v1 p.398}، {cite:canon-ibn-sina-print-v1 p.399}."
  en: "The book identifies it as melissa (lemon balm). Hot and dry in the second degree. It gladdens and strengthens the heart, stops palpitation, helps all phlegmatic and black-bile disorders, helps black scabies, removes bad breath, helps obstructions of the brain, aids digestion, helps hiccup, and greatly sweetens the breath {cite:canon-ibn-sina-print-v1 p.398}, {cite:canon-ibn-sina-print-v1 p.399}."
  fr: "Le livre l’identifie à la mélisse. Chaude et sèche au deuxième degré, elle réjouirait et fortifierait le cœur, arrêterait les palpitations, aiderait contre tous les troubles phlegmatiques et de bile noire, la gale noire et les obstructions du cerveau, supprimerait la mauvaise haleine, faciliterait la digestion et aiderait contre le hoquet, tout en parfumant fortement l’haleine {cite:canon-ibn-sina-print-v1 p.398}, {cite:canon-ibn-sina-print-v1 p.399}."
  ur: "کتاب اسے ملیسا ⁦(لیموں کی گھاس)⁩ بتاتی ہے۔ دوسرے درجے میں گرم اور خشک۔ یہ فرحت دیتی اور دل کو قوت دیتی ہے، دھڑکن ختم کرتی ہے، بلغمی اور سودا کی تمام بیماریوں میں نفع دیتی ہے، سیاہ خارش میں نفع دیتی ہے، منہ کی بدبو دور کرتی ہے، دماغ کی رکاوٹ میں نفع دیتی ہے، ہضم میں مدد دیتی ہے، ہچکی میں نفع دیتی ہے، اور سانس کو بہت خوشبودار کرتی ہے {cite:canon-ibn-sina-print-v1 p.398}، {cite:canon-ibn-sina-print-v1 p.399}۔"
  es: "El libro la identifica como melisa (bálsamo de limón). Caliente y seca en segundo grado. Alegra y fortalece el corazón, detiene las palpitaciones, ayuda con todos los trastornos flemáticos y de bilis negra, ayuda con la sarna negra, elimina el mal aliento, ayuda con las obstrucciones cerebrales, ayuda a la digestión, ayuda con el hipo y endulza mucho el aliento {cite:canon-ibn-sina-print-v1 p.398}, {cite:canon-ibn-sina-print-v1 p.399}."
  tr: "Malissa'dır. İkincisinde sıcak ve kurudur, neşelidir, kalbi güçlendirir, çarpıntıyı hafifletir, tüm flegmatik ve melankolik rahatsızlıklar için faydalıdır, siyah kabuk tedavisine yardımcı olur, buharlaşmayı azaltır, beyin tıkanıklığına yardımcı olur, sindirimi destekler, hıçkırıklara yardımcı olur ve lezzeti büyük ölçüde iyileştirir {cite:canon-ibn-sina-print-v1 s.398}, {cite:canon-ibn-sina-print-v1 s.399}."
  id: "Itu adalah malissa. Panas dan kering di bagian kedua, ceria, memperkuat jantung, meredakan palpitasi, bermanfaat untuk semua penyakit flegmatik dan melankolis, membantu dengan kerak hitam, meredakan penguapan, membantu penyumbatan otak, membantu pencernaan, membantu cegukan, dan sangat meningkatkan rasa {cite:canon-ibn-sina-print-v1 hlm.398}, {cite:canon-ibn-sina-print-v1 hlm.399}."
