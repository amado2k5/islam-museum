label:
  ar: "النَّهْر"
  en: "Nahr (river)"
  ur: "نہر ⁦(دریائے آب)⁩"
  es: "Nahr (río)"
  fr: "Nahr (rivière)"
  tr: "Nehir"
  id: "Sungai"
summary:
  ar: "النهر في اللغة مجرى الماء العذب والماء الجاري المتسع، وعند الفقهاء المجرى الواسع للماء فوق الساقية وهو مجرى كبير لا يحتاج إلى الكرى في كل حين. وقسمه الفقهاء إلى عام غير مملوك لأحد كنهر النيل ودجلة والفرات وسيحون وجيحون، ومملوك لشخص أو أكثر، ولبناء أحكامهما تفصيل في حق الانتفاع والقسمة وكري الأنهار وما ينحسر عنه الماء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16214} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16215}"
  en: "Nahr, in the lexicon, is a channel of fresh water, a wide running stream; for the jurists it is a channel for water larger than an irrigation canal, one that does not need constant dredging. They divide rivers into the public, unowned kind, such as the Nile, Tigris, Euphrates, Jayhun and Sayhun, and the kind owned by one or more persons, each with its own rulings on the right of use, the division of water, the dredging of rivers, and land from which the water recedes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16214} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16215}"
  ur: "نہر لغت میں میٹھے پانی کی رواں وسیع نہر ہے؛ فقہاء کے نزدیک وہ وسیع مجرا جو ساقیہ سے بڑا ہو اور ہر وقت کرائی ⁦(مٹی نکالنا)⁩ کا محتاج نہ ہو۔ فقہاء نے نہر کو عام غیر مملوک ⁦(جیسے نیل، دجلہ، فرات، سیحون، جیحون)⁩ اور ایک یا زیادہ اشخاص کے مملوک میں تقسیم کیا، اور ہر ایک کے حقِ انتفاع، تقسیمِ آب، کرائی اور انحسارِ آب سے کھلی زمین کے احکام الگ ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16214} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16215}"
  es: "Nahr, en el léxico, es un canal de agua dulce, un arroyo ancho y corriente; para los juristas, es un canal de agua mayor que un canal de riego, uno que no necesita dragado constante. Dividen los ríos en públicos, sin dueño, como el Nilo, el Tigris, el Éufrates, el Jayhun y el Sayhun, y los que pertenecen a una o más personas, cada uno con sus propias normas sobre el derecho de uso, la distribución del agua, el dragado de los ríos y las tierras de las que se retira el agua. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16214} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16215}"
  fr: "Dans le lexique, le terme « nahr » désigne un canal d'eau douce, un large cours d'eau; pour les juristes, il s'agit d'un canal plus important qu'un canal d'irrigation, ne nécessitant pas de dragage constant. Ils distinguent les rivières publiques, sans propriétaire, telles que le Nil, le Tigre, l'Euphrate, le Jayhun et le Sayhun, et les rivières privées, chacune ayant ses propres règles concernant le droit d'usage, le partage des eaux, le dragage et les terres inondées."
  tr: "Dilde nehir, tatlı suyun akışını ve geniş, akan suyu ifade eder. Hukukçulara göre, su çarkının üzerindeki geniş su kanalıdır; bu büyük bir akarsu olup sürekli akıntıya ihtiyaç duymaz. Hukukçular onu Nil, Dicle, Fırat, Sihon ve Jahun gibi kimsenin sahip olmadığı ve bir veya daha fazla kişinin sahip olduğu bir yıla ayırırlar. Kararlarını oluşturmak için kullanım hakkı, bölünme, nehirlerin sulaması ve su tedarikini azaltan unsurları detaylandırırlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16214} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16215}"
  id: "Dalam bahasa, sungai merujuk pada aliran air tawar dan air yang luas dan mengalir. Menurut ahli hukum, sungai adalah saluran air yang lebar di atas roda air, yang merupakan aliran besar yang tidak memerlukan aliran terus-menerus. Para ahli hukum membaginya menjadi satu tahun yang tidak dimiliki siapa pun, seperti Sungai Nil, Tigris, Efrat, Sihon, dan Jahun, dan dimiliki oleh satu atau lebih orang. Untuk membangun keputusan, mereka merinci hak usufruct, pembagian bagian, irigasi sungai, dan apa yang mengurangi pasokan air. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.16214} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16215}"
