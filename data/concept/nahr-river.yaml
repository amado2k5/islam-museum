label:
  ar: "النَّهْر"
  en: "Nahr (river)"
  ur: "نہر (دریائے آب)"
summary:
  ar: "النهر في اللغة مجرى الماء العذب والماء الجاري المتسع، وعند الفقهاء المجرى الواسع للماء فوق الساقية وهو مجرى كبير لا يحتاج إلى الكرى في كل حين. وقسمه الفقهاء إلى عام غير مملوك لأحد كنهر النيل ودجلة والفرات وسيحون وجيحون، ومملوك لشخص أو أكثر، ولبناء أحكامهما تفصيل في حق الانتفاع والقسمة وكري الأنهار وما ينحسر عنه الماء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16214} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16215}"
  en: "Nahr, in the lexicon, is a channel of fresh water, a wide running stream; for the jurists it is a channel for water larger than an irrigation canal, one that does not need constant dredging. They divide rivers into the public, unowned kind, such as the Nile, Tigris, Euphrates, Jayhun and Sayhun, and the kind owned by one or more persons, each with its own rulings on the right of use, the division of water, the dredging of rivers, and land from which the water recedes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16214} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16215}"
  ur: "نہر لغت میں میٹھے پانی کی رواں وسیع نہر ہے؛ فقہاء کے نزدیک وہ وسیع مجرا جو ساقیہ سے بڑا ہو اور ہر وقت کرائی (مٹی نکالنا) کا محتاج نہ ہو۔ فقہاء نے نہر کو عام غیر مملوک (جیسے نیل، دجلہ، فرات، سیحون، جیحون) اور ایک یا زیادہ اشخاص کے مملوک میں تقسیم کیا، اور ہر ایک کے حقِ انتفاع، تقسیمِ آب، کرائی اور انحسارِ آب سے کھلی زمین کے احکام الگ ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16214} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16215}"
