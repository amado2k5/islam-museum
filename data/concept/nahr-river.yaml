issue:
  ar: "كيف ينتفع الناس بالنهر العام والخاص، وكيف يقسم ماؤه بين أهل أعلاه وأسفله وبين الشركاء؟"
  en: "How may people use a public or a private river, and how is its water divided between those above and below it and between co-owners?"
  ur: "عام اور خاص نہر سے لوگ کیسے فائدہ اٹھا سکتے ہیں، اور اس کا پانی اوپر اور نیچے والوں اور شرکاء میں کیسے بانٹا جائے؟"
