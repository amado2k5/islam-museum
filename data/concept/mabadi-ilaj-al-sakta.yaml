id: "concept/mabadi-ilaj-al-sakta"
class: "concept"
kind: "scientific"
label:
  ar: "مبادئ علاج السكتة"
  en: "Principles of the treatment of apoplexy"
  ur: "سکتہ کے علاج کے اصول"
summary:
  ar: "علاج السكتة بحسب سببها: الكائن من أذى من خارج بتدبير السبب، والذي من مشاركة بتدبير العضو المشارك، والذي من الدم بالفصد في الوقت وإرسال دم كثير فيفيق في الحال ثم الحقن؛ والذي من البلغم بمستفرغات قوية وتسخين تدريجي، والقيء يسخّن مزاج الرؤوس الباردة الرطبة {cite:canon-ibn-sina-print-v2 p.132} {cite:canon-ibn-sina-print-v2 p.133} {cite:canon-ibn-sina-print-v2 p.134}"
  en: "Apoplexy is treated by its cause: that from an outside hurt by managing the cause, that from a partner organ by managing that organ, that of blood by immediate venesection letting much blood — he recovers at once — then clysters; that of phlegm by strong evacuants and gradual warming, while vomiting warms the temperament of cold moist heads {cite:canon-ibn-sina-print-v2 p.132} {cite:canon-ibn-sina-print-v2 p.133} {cite:canon-ibn-sina-print-v2 p.134}"
  ur: "سکتہ کا علاج اس کے سبب کے لحاظ سے: باہر کی تکلیف سے ہونے والا اس سبب کے تدبیر سے، شریک عضو سے ہونے والا اس عضو کے تدبیر سے، خون والا فوراً فصد سے کہ کثیر خون نکالا جائے تو وہ وہیں جاگ اٹھتا ہے پھر حقن؛ اور بلغم والا مضبوط مستفرغات اور درجہ بدرجہ تسخین سے، اور قے سرد مرطوب سروں کے مزاج کو گرم کرتی ہے {cite:canon-ibn-sina-print-v2 p.132} {cite:canon-ibn-sina-print-v2 p.133} {cite:canon-ibn-sina-print-v2 p.134}۔"
