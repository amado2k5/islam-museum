  ar: "أغلاجون"
  en: "Aghlajun (aloeswood)"
  fr: "Aghlajun (bois d’aloès)"
  ur: "اغلاجون ⁦(عود)⁩"
  es: "Aghlajun (árbol de aloe)"
  tr: "Aglagon"
  id: "Aglagon"
summary:
  ar: "خشب عطر من الهند والغرب، يدخل في الزينة والبخور، ويذكر الكتاب أنه ينفع من قرحة الأمعاء والمغص {cite:canon-ibn-sina-print-v1 p.356}."
  en: "Scented wood from India and the west, used for ornament and incense. The book says it helps ulcers of the intestines and gripes {cite:canon-ibn-sina-print-v1 p.356}."
  fr: "Bois odorant venu de l’Inde et de l’Occident, employé pour la parure et les fumigations. Le livre dit qu’il soulage les ulcères des intestins et les coliques {cite:canon-ibn-sina-print-v1 p.356}."
  ur: "ہندوستان اور مغرب کی خوشبودار لکڑی، جو زینت اور لوبان میں استعمال ہوتی ہے؛ کتاب کے مطابق یہ آنتوں کے زخم اور مروڑ میں فائدہ دیتی ہے {cite:canon-ibn-sina-print-v1 p.356}۔"
  es: "Madera aromática de la India y Occidente, utilizada para ornamentación e incienso. El libro afirma que ayuda con las úlceras intestinales y los cólicos {cite:canon-ibn-sina-print-v1 p.356}."
  tr: "Hindistan ve Batı'dan gelen kokulu bir ağaç, süsleme ve tütsü için kullanılır ve kitapta bağırsak ülserleri ile kolik için faydalı olduğu belirtilir {cite:canon-ibn-sina-print-v1 s.356}."
  id: "Pohon harum dari India dan Barat digunakan untuk dekorasi dan dupa, dan buku tersebut menyatakan bahwa pohon ini bermanfaat untuk tukak lambung dan kolik {cite:canon-ibn-sina-print-v1 hlm.356}."
