summary:
  ar: "الأذن عضو خلق للسمع، جعل له صدف معوج ليحبس جميع الصوت ويوجب طنينه، وثقب يأخذ في العظم الحجري ملولب معوج لتطويل مسافة الهواء إلى داخل مع قصر تحته لئلا يغافص باطنه الحر والبرد المفرطان؛ وثقب الأذن يؤدي إلى جوبة فيها هواء راكد سطحها الإنسي مفروش بليف العصب السابع الوارد من الزوج الخامس من أزواج العصب الدماغي، فإذا تأدى الموج الصوتي إلى ما هناك أدركه السمع، وهذه العصبة في أحوال السمع كالجليدية في أحوال الإبصار والصماخ كالثقبة العنبية {cite:canon-ibn-sina-print-v2 p.217}"
  en: "The ear is an organ created for hearing: given a coiled shell to hold all sound and keep its resonance, and a hole entering the stony bone coiled and curved to lengthen the air's path inward over a short depth, lest over-hot and over-cold surprise its inside but reach it gradually. The ear's hole leads to a cavity holding still air whose inner surface is paved with fibres of the seventh nerve coming from the fifth pair of the brain's nerves; when the sound wave arrives there hearing perceives it — this nerve is to the states of hearing as the icy humour is to the states of sight, and the meatus as the uveal aperture {cite:canon-ibn-sina-print-v2 p.217}"
  ur: "کان سماعت کے لیے پیدا کیا گیا عضو ہے: اس کے لیے پیچ دار صدف بنایا گیا کہ ساری آواز سمیٹ کر اس کی گونج قائم رکھے، اور ایک سوراخ جو پتھر کی ہڈی میں داؤر اور پیچ دار داخل ہوتا ہے تاکہ ہوا کے اندر جانے کا راستہ لمبا ہو اگرچہ گہرائی کم ہو، کہ اندر کو نہایت گرم اور نہایت سرد نہ گھات لگائیں بل آہستہ پہنچیں؛ اور کان کا سوراخ ایک گوبہ تک پہنچتا ہے جس میں ساکن ہوا ہے اور جس کا اندرونی پردہ دماغی اعصاب کے پانچویں جوڑے سے آنے والے ساتویں عصب کے ریشوں سے بچھا ہوا ہے؛ جب آواز کی لہر وہاں پہنچتی ہے تو سماعت اسے پا لیتی ہے — یہ عصبہ سماعت کے احوال میں وہی ہے جو جلیدیہ بصر کے احوال میں ہے، اور صماخ وہی جو عنبی ثقبہ {cite:canon-ibn-sina-print-v2 p.217}"
  es: "El oído es un órgano creado para oír: posee una concha enrollada para contener el sonido y mantener su resonancia, y un orificio que penetra en el hueso pétreo, enrollado y curvado para alargar el recorrido del aire hacia el interior en una corta profundidad, para evitar que el calor o el frío excesivos sorprendan su interior, sino que lo alcancen gradualmente. El orificio del oído conduce a una cavidad que contiene aire estancado, cuya superficie interna está revestida de fibras del séptimo nervio craneal, provenientes del quinto par de nervios cerebrales; cuando la onda sonora llega allí, el oído la percibe. Este nervio es a los estados de audición lo que el humor vítreo es a los estados de visión, y el meato es a la abertura uveal. {cite:canon-ibn-sina-print-v2 p.217}"
