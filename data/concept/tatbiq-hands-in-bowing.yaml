id: concept/tatbiq-hands-in-bowing
class: concept
kind: legal
label:
  ar: "التطبيق"
  en: "Tatbiq (placing one palm on the other between the knees in bowing)"
  ur: "تطبیق ⁦(رکوع میں ہاتھ گھٹنوں کے درمیان رکھنا)⁩"
  es: "Tatbiq (colocar una palma sobre la otra entre las rodillas en señal de reverencia)"
  fr: "Tatbiq (placer une paume sur l'autre entre les genoux en s'inclinant)"
summary:
  ar: "التطبيق أن يجعل المصلي بطن إحدى كفيه على بطن الأخرى ويجعلهما بين ركبتيه وفخذيه في الركوع. ويرى جمهور الفقهاء كراهته، لنهي الصحابة عنه وأمرهم بوضع الأيدي على الركب، وحديث مصعب بن سعد عن أبيه. وكان عبد الله بن مسعود وأصحابه علقمة والأسود يرون أنه السنة، ويرى النووي أنهم لم يبلغهم الناسخ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5305} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5306}"
  en: "Tatbiq is the worshipper placing the back of one palm on the back of the other and setting them between his knees and thighs in bowing. Most jurists dislike it, on the report of Musab ibn Sad who was told that the early practice was abrogated and that the hands are to be placed on the knees. Ibn Masud and his companions Alqama and al-Aswad held tatbiq to be the sunna, and an-Nawawi explains that the abrogation had not reached them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5305} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5306}"
  es: "Tatbiq es la práctica en la que el devoto coloca el dorso de una mano sobre el dorso de la otra, entre las rodillas y los muslos, al inclinarse. La mayoría de los juristas la desaprueban, según el relato de Musab ibn Sad, a quien se le informó que la práctica antigua había sido abrogada y que las manos debían colocarse sobre las rodillas. Ibn Masud y sus compañeros Alqama y al-Aswad consideraban que el tatbiq era la sunna, y an-Nawawi explica que la abrogación no les había llegado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5305} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5306}"
  fr: "Le tatbiq consiste pour le fidèle à placer le dos d'une paume contre le dos de l'autre et à les positionner entre ses genoux et ses cuisses lors de la prosternation. La plupart des juristes désapprouvent cette pratique, se basant sur le témoignage de Musab ibn Sad, à qui l'on avait rapporté que cette pratique ancienne avait été abrogée et que les mains devaient désormais être placées sur les genoux. Ibn Masud et ses compagnons Alqama et al-Aswad considéraient le tatbiq comme une sunna, et an-Nawawi explique que l'abrogation ne leur était pas encore parvenue."
  ur: "تشبیق وہ ہے کہ نمازی ایک ہتھیلی کی پشت کو دوسری کی پشت پر رکھے اور رکوع میں اپنے گھٹنوں اور رانوں کے درمیان رکھے۔ اکثر فقہاء نے مصعب بن سعد کی اس روایت کو ناپسند کیا ہے کہ جن کے بارے میں کہا گیا تھا کہ ابتدائی عمل منسوخ ہے اور ہاتھ گھٹنوں پر رکھنا ہے۔ ابن مسعود اور ان کے اصحاب علقمہ اور اسود نے تبک کو سنت قرار دیا ہے اور نووی بیان کرتے ہیں کہ ان تک منسوخ نہیں ہوا تھا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5305}"
