label:
  ar: "التطبيق"
  en: "Tatbiq (placing one palm on the other between the knees in bowing)"
  ur: "تطبیق (رکوع میں ہاتھ گھٹنوں کے درمیان رکھنا)"
summary:
  ar: "التطبيق أن يجعل المصلي بطن إحدى كفيه على بطن الأخرى ويجعلهما بين ركبتيه وفخذيه في الركوع. ويرى جمهور الفقهاء كراهته، لنهي الصحابة عنه وأمرهم بوضع الأيدي على الركب، وحديث مصعب بن سعد عن أبيه. وكان عبد الله بن مسعود وأصحابه علقمة والأسود يرون أنه السنة، ويرى النووي أنهم لم يبلغهم الناسخ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5305} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5306}"
  en: "Tatbiq is the worshipper placing the back of one palm on the back of the other and setting them between his knees and thighs in bowing. Most jurists dislike it, on the report of Musab ibn Sad who was told that the early practice was abrogated and that the hands are to be placed on the knees. Ibn Masud and his companions Alqama and al-Aswad held tatbiq to be the sunna, and an-Nawawi explains that the abrogation had not reached them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5305} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5306}"
