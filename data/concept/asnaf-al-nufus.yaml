id: concept/asnaf-al-nufus
class: concept
kind: term
label:
  ar: "أصناف النفوس البشرية"
  en: "The three classes of souls"
  fr: "Les trois catégories d’âmes"
  es: "Las tres clases de almas"
  ur: "روحوں کے تین طبقات"
  tr: "İnsan ruhlarının türleri"
  id: "Jenis-jenis jiwa manusia"
summary:
  ar: "قرر ابن خلدون أن قوى الإدراك مرتبة: الحس الظاهر بآلاته ثم الحس المشترك الذي يدرك المحسوسات في حالة واحدة ثم الخيال الذي يمثل الشيء مجرداً عن المواد وآلتهما البطن الأول من الدماغ، ثم الواهمة لإدراك المعاني المتعلقة بالشخصيات والحافظة لإيداع المدركات وآلتهما البطن المؤخر، ثم قوة الفكر وآلتها البطن الأوسط، والنفوس البشرية ثلاثة أصناف: صنف عاجز عن الوصول إلى الإدراك الروحاني منقطع بالمدارك الحسية والخيالية وإليه تنتهي مدارك العلماء في الغالب، وصنف متوجه نحو الإدراك الروحاني الذي لا يفتقر إلى الآلات البدنية يمرسح في فضاء المشاهدات الباطنية وهي مدارك العلماء الأولياء أهل المعارف الربانية وهي الحاصلة بعد الموت لأهل السعادة في البرزخ، وصنف مفطور على الانسلاخ من البشرية جملة إلى الملائكة من الأفق الأعلى في لحظة يحصل له شهود الملأ الأعلى وسماع الخطاب الإلهي وهؤلاء الأنبياء، وهي حالة الوحي، والتلقي من الملك والرجوع إلى المدارك البشرية كله في لحظة واحدة ليس في زمان ولذلك سمي وحياً لأن الوحي في اللغة الإسراع، وحالة الدوي رتبة الأنبياء غير المرسلين وحالة تمثل الملك رجلاً يخاطب رتبة المرسلين وهي أكمل {cite:muqaddima-ibn-khaldun p. 94-95}."
  en: "From common sense to imagination to wahima to thought — then three souls: the earthbound, the saintly, and the prophetic who slough off humanity in an instant {cite:muqaddima-ibn-khaldun p. 94-95}."
  fr: "Du sens commun à l’imagination, puis à la wahima et à la pensée — ensuite trois âmes : celle qui reste attachée à la terre, celle des saints et celle des prophètes qui se dépouillent de l’humanité en un instant {cite:muqaddima-ibn-khaldun p. 94-95}."
  es: "Del sentido común a la imaginación a la wahima al pensamiento, luego tres almas: la terrenal, la santa y la profética que se despoja de la humanidad en un instante {cite:muqaddima-ibn-khaldun p. 94-95}."
  ur: "عقل سے لے کر تخیل تک وحیما تک فکر تک - پھر تین روحیں: زمینی، ولی، اور پیغمبر جو انسانیت کو ایک لمحے میں ختم کر دیتے ہیں۔ 94-95}۔"
  tr: "İbn Haldun, algı yetilerinin sıralandığını ortaya koymuştur: görünen duyu ve mekanizmaları, sonra duyuları tek bir durumda algılayan sağduyu, sonra maddelerden kopuk bir şeyi temsil eden hayal gücü ve onların aracı beynin birinci karnıdır; sonra kişiliklerle ilgili anlamları algılayan yanılsama ve algıları ve onların aracını bırakan hafıza arka midedir, sonra düşüncenin gücü ve aracı orta karındır ve insan ruhları üç tiptir: bir kategori, ruhsal algıya ulaşamayan ve duyusal ve hayal gücüyle algılanan, genellikle alimlerin algılarının sona erdiği kategori ve algıya yönelik bir kategori Fiziksel araçlardan yoksun olmayan ruhani olan, Barzakh'taki mutlu insanlar için ölümden sonra gerçekleşen bilgili azizlerin ve ilahi bilgiye sahip olanların içsel gözlemler alanında dolaşır. O, insanlıktan bir bütün olarak meleklere en yüksek ufuktan ayrılmak için doğmuş bir yazardır; en yüksek toplantının tanıkları ilahi söylemi ve bu peygamberleri duyurken. Bu, vahiy hali, kraldan almak ve tüm insan alemlerine tek bir anda, zamanda değil, dönmek halidir. Bu nedenle, vahiy olarak adlandırılır çünkü dilde vahiydir Acele ve rezonans durumu, gönderilmeyen peygamberlerin rütbesi ve elçilerin rütbesine hitap eden bir adamı temsil eden kralın durumudur; bu durum daha eksiksizdir {atıf:muqaddima-ibn-haldun s. 94-95}."
  id: "Ibn Khaldun menetapkan bahwa kemampuan persepsi diurutkan: indera yang tampak dengan mekanismenya, lalu akal sehat, yang menangkap indera dalam satu keadaan, kemudian imajinasi, yang mewakili sesuatu yang terpisah dari zat dan alatnya adalah perut pertama otak, kemudian ilusi untuk memahami makna yang berkaitan dengan kepribadian dan memori untuk menyimpan persepsi dan alatnya adalah perut belakang, lalu kekuatan berpikir dan alatnya adalah perut tengah, dan jiwa manusia terdiri dari tiga jenis: satu kategori yang tidak mampu mencapai persepsi spiritual, terputus dari persepsi sensorik dan imajinatif yang biasanya menjadi titik persepsi para cendekiawan, dan kategori yang berorientasi pada persepsi Yang spiritual, yang tidak kekurangan alat fisik, mengembara dalam ranah pengamatan batin, yaitu ranah para santo terpelajar dan penguasa pengetahuan ilahi, yang terjadi setelah kematian bagi orang-orang kebahagiaan di Barzakh. Dia adalah penulis yang lahir untuk terpisah dari kemanusiaan secara keseluruhan kepada malaikat dari cakrawala tertinggi pada saat ketika saksi pertemuan tertinggi mendengar khotbah ilahi dan para nabi ini terjadi. Ini adalah keadaan wahyu, menerima dari raja, dan kembali ke semua alam manusia dalam satu momen, bukan dalam waktu. Karena alasan ini, disebut wahyu karena wahyu dalam bahasa Tergesa-gesa, dan keadaan resonansi adalah pangkat nabi yang tidak diutus, dan kasus raja mewakili seorang pria yang berbicara dengan pangkat utusan, yang lebih lengkap {cite:muqaddima-ibn-khaldun hlm. 94-95}."
