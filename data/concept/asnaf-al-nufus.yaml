id: concept/asnaf-al-nufus
class: concept
kind: term
label: { ar: "أصناف النفوس البشرية", en: "The three classes of souls" }
summary:
  ar: "قرر ابن خلدون أن قوى الإدراك مرتبة: الحس الظاهر بآلاته ثم الحس المشترك الذي يدرك المحسوسات في حالة واحدة ثم الخيال الذي يمثل الشيء مجرداً عن المواد وآلتهما البطن الأول من الدماغ، ثم الواهمة لإدراك المعاني المتعلقة بالشخصيات والحافظة لإيداع المدركات وآلتهما البطن المؤخر، ثم قوة الفكر وآلتها البطن الأوسط، والنفوس البشرية ثلاثة أصناف: صنف عاجز عن الوصول إلى الإدراك الروحاني منقطع بالمدارك الحسية والخيالية وإليه تنتهي مدارك العلماء في الغالب، وصنف متوجه نحو الإدراك الروحاني الذي لا يفتقر إلى الآلات البدنية يمرسح في فضاء المشاهدات الباطنية وهي مدارك العلماء الأولياء أهل المعارف الربانية وهي الحاصلة بعد الموت لأهل السعادة في البرزخ، وصنف مفطور على الانسلاخ من البشرية جملة إلى الملائكة من الأفق الأعلى في لحظة يحصل له شهود الملأ الأعلى وسماع الخطاب الإلهي وهؤلاء الأنبياء، وهي حالة الوحي، والتلقي من الملك والرجوع إلى المدارك البشرية كله في لحظة واحدة ليس في زمان ولذلك سمي وحياً لأن الوحي في اللغة الإسراع، وحالة الدوي رتبة الأنبياء غير المرسلين وحالة تمثل الملك رجلاً يخاطب رتبة المرسلين وهي أكمل {cite:muqaddima-ibn-khaldun p. 94-95}."
  en: "From common sense to imagination to wahima to thought — then three souls: the earthbound, the saintly, and the prophetic who slough off humanity in an instant {cite:muqaddima-ibn-khaldun p. 94-95}."
