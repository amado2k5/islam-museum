id: concept/bukhr-al-fam
class: concept
kind: scientific
label:
  ar: بخر الفم
  en: Foetor of the mouth (bad breath)
  fr: "Fétidité buccale (mauvaise haleine)"
  ur: منہ کی بدبو
summary:
  ar: البخر إما أن يكون مبدؤه اللثة لعفونة منها أو لاسترخاء يعرض لها أو عفونة فيها بغير الرطوبات وأكثر هذا المزاج حار وإما أن يكون مبدؤه فم المعدة لخلط عفن في فم المعدة إما صفراوي أو بلغمي وقد تكون من نواحي الرئة كما يعرض لأصحاب السل، وأما ما كان من اللثة فيجب أن يعتنى بتنقية الأسنان دائماً وغسلها من هذا الجنس فإن نجع وإلا أمضغ من هذا الجنس وجعل على اللثة ما يقبض من هذا الجنس وتمضمض من هذا الجنس فإن ظهرت العفونة استعمل من هذا الجنس وإن كان الخلط صفراوياً عفناً في المعدة أو في جلدة الفم فالفواكه المبردة على الريق من هذا الجنس وإن كان بلغمياً استعمل القيء أولاً وما ينقي فم المعدة وجعل غذاءه المطجنات وقل شرب الماء الكثير وهجر الفواكه والبقول الرطبة واتخذ مساويكه من الأشجار المرة المقطعة من هذا الجنس ⁦(الأسماء والنسخ مطروحة)⁩ {cite:canon-ibn-sina-print-v2 p.264} {cite:canon-ibn-sina-print-v2 p.265}
  en: 'Foetor of the mouth begins either from the gum — its own putrefaction, a relaxation occurring in it, or a putrefaction there without the moistures, this temperament mostly hot — or from the mouth of the stomach for a putrid humour there, bilious or phlegmy, or from the lung''s quarters as occurs to the consumptive. For what comes from the gum, cleaning the teeth is always cared for and washing them of this kind; if that profits, well; otherwise chewing of this kind is done, an astringing thing of this kind laid on the gum and rinsing of this kind; if the putrefaction shows plain, stronger things of this kind are used. If the humour is bilious-putrid in the stomach or the mouth''s skin, the cooling fruits on an empty stomach of this kind profit most; if phlegmy, vomiting is used first with what purifies the stomach''s mouth, his food the stews, much water-drinking lessened, fruits and moist herbs abandoned, and his tooth-sticks taken from the bitter cutting trees of this kind (the names and recipes left out) {cite:canon-ibn-sina-print-v2 p.264} {cite:canon-ibn-sina-print-v2 p.265}'
  fr: "Elle proviendrait des gencives — putréfaction propre, relâchement ou putréfaction sans humidités, de tempérament surtout chaud —, de l’orifice gastrique contenant une humeur putride bilieuse ou phlegmatique, ou du poumon comme chez le phtisique. Pour l’origine gingivale, le livre préconise nettoyage et lavage dentaires ; sans bénéfice, mastication, astringent gingival et rinçage d’un type indiqué ; si la putréfaction devient manifeste, des moyens plus forts. Une humeur bilieuse putride de l’estomac ou de la muqueuse buccale appellerait surtout des fruits rafraîchissants à jeun ; une humeur phlegmatique, d’abord le vomissement nettoyant l’orifice gastrique, puis des ragoûts, moins d’eau, abandon des fruits et herbes humides et bâtonnets dentaires d’arbres amers et incisifs. Noms et recettes omis {cite:canon-ibn-sina-print-v2 p.264} {cite:canon-ibn-sina-print-v2 p.265}"
  ur: 'منہ کی بدبو کا آغاز یا تو لثے سے ہوتا ہے — اس کی اپنی بوسیدگی، اس میں آنے والا استرخا یا رطوبتوں کے بغیر بوسیدگی، اور یہ مزاج اکثر گرم ہوتا ہے — یا معدے کے منہ سے جب وہاں بوسیدہ خلط ہو صفراوی یا بلغمی، یا پھیپھڑے کی طرف سے جیسا سل والوں کو ہوتا ہے؛ جو لثے سے ہو اس میں دانتوں کی ہمیشہ صفائی کی دیکھ بھال اور اسی جنس سے دھونا واجب ہے؛ اگر نفع ہو تو ورنہ اسی جنس کی چیز چبائی جائے، لثے پر اسی جنس کی قابض چیز رکھی جائے اور اسی جنس سے مضمضہ ہو؛ اگر بوسیدگی کھل کر ظاہر ہو تو اسی جنس کی قوی چیزیں استعمال ہوں؛ اگر خلط معدہ یا منہ کی کھال میں صفراوی بوسیدہ ہو تو خالی پیٹ اسی جنس کے ٹھنڈے پھل سب سے زیادہ نفع دیتے ہیں؛ اور اگر بلغمی ہو تو پہلے قی اور معدے کے منہ کو صاف کرنے والی چیز، خوراک طبخ، زیادہ پانی کم، پھل اور تر ساگ ترک اور مسواک اسی جنس کے کڑوے کاٹنے والے درختوں کی ہو ⁦(نام اور نسخے مطروح)⁩ {cite:canon-ibn-sina-print-v2 p.264} {cite:canon-ibn-sina-print-v2 p.265}'
