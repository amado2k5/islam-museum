id: concept/ibrisam
class: concept
kind: natural
label:
  ar: "إبريسم"
  en: "Ibrisam (silk)"
  ur: "ابریسم ⁦(ریشم)⁩"
  es: "Ibrisam (seda)"
  fr: "Ibrisam (soie)"
summary:
  ar: "الحرير، ويُعدّ من المفرّحات القلبية، حار في الأولى يابس فيها. أفضله الخام، وينفع صلابة الرئة بتلطيفه وتنشيفه من غير لذع، وإذا اتُّخذ منه كحل نفع ومنع الدمعة ونشّف القروح في العين {cite:canon-ibn-sina-print-v1 p.374} {cite:canon-ibn-sina-print-v1 p.375}."
  en: "Silk, counted among the heart-exhilarating drugs; hot in the first degree and dry in it. The raw kind is best. It helps hardness of the lung by thinning and drying without burning, and as a kohl it helps the eye, prevents tearing and dries sores in the eye {cite:canon-ibn-sina-print-v1 p.374} {cite:canon-ibn-sina-print-v1 p.375}."
  ur: "ریشم، جو دل کو خوش کرنے والی دواؤں میں شمار ہوتا ہے؛ پہلے درجے میں گرم اور اسی میں خشک ہے۔ کچا ریشم بہتر ہے۔ یہ بغیر جلن کے تلطیف اور خشکی کے ذریعے پھیپھڑوں کی سختی میں نفع دیتا ہے، اور کحل کے طور پر آنکھ کو فائدہ دیتا، آنسو روکتا اور آنکھ کے زخم خشک کرتا ہے {cite:canon-ibn-sina-print-v1 p.374} {cite:canon-ibn-sina-print-v1 p.375}۔"
  es: "Seda, considerada una droga estimulante para el corazón; caliente en primer grado y seca en él. La seda cruda es la mejor. Ayuda a la dureza de los pulmones al adelgazarlos y secarlos sin quemarlos, y como kohl ayuda a los ojos, previene el lagrimeo y seca las llagas oculares {cite:canon-ibn-sina-print-v1 p.374} {cite:canon-ibn-sina-print-v1 p.375}."
  fr: "La soie, comptée parmi les remèdes stimulants pour le cœur, est chaude et sèche au premier degré. La soie brute est la meilleure. Elle contribue à l'assèchement des poumons en les fluidifiant et en les asséchant sans les brûler, et, utilisée comme khôl, elle est bénéfique pour les yeux, prévient les larmoiements et assèche les plaies oculaires. {cite:canon-ibn-sina-print-v1 p.374} {cite:canon-ibn-sina-print-v1 p.375}"
