label: { ar: "الخالة", en: "Khala (maternal aunt)", ur: "خالہ" }
summary:
  ar: "الخالة أخت الأم، والأم كل من انتسبت إليها بولادة، حقيقة أو مجازا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7534} والخالة بالنسب أو الرضاع محرمة في النكاح باتفاق المسلمين، لقوله تعالى في المحرمات، وحديث: يحرم من الرضاع ما يحرم من النسب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7534} وهي من ذوي الأرحام بالنسب، فتوريثها محل خلاف: الشافعية والمالكية لا يورثونهم، والحنفية والحنابلة يورثونهم عند فقد العصبة وذوي الفروض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7535} وللخالة حق الحضانة، ولا نفقة لها عند الجمهور، والحنفية يوجبون النفقة للخالة بالنسب، والخالة بالرضاع لا حضانة لها ولا نفقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7535} "
  en: "The khala (maternal aunt) is the mother's sister, the mother being whoever bore one, in fact or by extension. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7534} A maternal or milk-aunt is forbidden in marriage by consensus, by the Quranic list of the forbidden and the saying that what is forbidden by kinship is forbidden by suckling. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7534} As a kinswoman by blood she is among the kin who are not sharers or agnates, and her inheritance is disputed: the Shafiis and Malikis deny it, the Hanafis and Hanbalis grant it when agnates and sharers are absent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7535} She has the right of custody; the majority deny maintenance to her, the Hanafis oblige maintenance to a blood aunt; a milk-aunt has neither custody nor maintenance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7535} "
  ur: "خالہ ماں کی بہن کو کہتے ہیں، اور ماں وہ ہے جس نے جنا ہو، حقیقتاً یا مجازاً۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7534} نسبی یا رضاعی خالہ سے نکاح حرام ہے، جس پر مسلمانوں کا اتفاق ہے، قرآن کی محرمات کی فہرست اور حدیث «يحرم من الرضاع ما يحرم من النسب» کی بنا پر۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7534} نسب کی بنا پر خالہ ذوی الارحام میں سے ہے، اور ان کی وراثت میں اختلاف ہے: شافعیہ اور مالکیہ وراثت نہیں دیتے، جبکہ حنفیہ اور حنابلہ عصبہ اور صاحب فرض کی عدم موجودگی میں دیتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7535} خالہ کو حق حضانت حاصل ہے؛ جمہور کے نزدیک نفقہ نہیں، حنفیہ نسبی خالہ کا نفقہ لازم کہتے ہیں، جبکہ رضاعی خالہ کو نہ حضانت ہے نہ نفقہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7535} "
