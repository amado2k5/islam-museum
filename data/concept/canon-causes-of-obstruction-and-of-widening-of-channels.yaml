label: { ar: "أسباب السدة وضيق المجاري واتساعها عند ابن سينا", en: "The causes of obstruction and of narrowing and widening of the channels in the Canon", ur: "بند پڑنے اور نالیوں کے تنگ اور کشادہ ہونے کے اسباب، قانون کے مطابق" }
summary:
  ar: "في الفصلين السادس والسابع يذكر ابن سينا أن السدة تحدث بوقوع شيء غريب في المجرى، جنسا أو مقدارا أو كيفية، أو بالتحام المنفذ أو انطباقه، وأن المجاري تتسع لضعف الماسكة أو حركة قوية من الدافعة أو أدوية مرخية، وتضيق لأضداد ذلك {cite:canon-ibn-sina-print-v1 p.145}."
  en: "In chapters 6 and 7 Ibn Sina says that obstruction arises when something foreign lodges in a channel, foreign in kind, amount or quality, or when the passage is joined shut or squeezed, and that channels widen through weakness of the retentive power, strong movement of the expulsive power or relaxing drugs, and narrow through the opposites {cite:canon-ibn-sina-print-v1 p.145}."
