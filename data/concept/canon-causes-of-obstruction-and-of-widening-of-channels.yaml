id: concept/canon-causes-of-obstruction-and-of-widening-of-channels
class: concept
kind: scientific
label:
  ar: "أسباب السدة وضيق المجاري واتساعها عند ابن سينا"
  en: "The causes of obstruction and of narrowing and widening of the channels in the Canon"
  fr: "Causes d’obstruction, de rétrécissement et de dilatation dans le Canon"
  ur: "بند پڑنے اور نالیوں کے تنگ اور کشادہ ہونے کے اسباب، قانون کے مطابق"
  es: "Las causas de obstrucción y de estrechamiento y ensanchamiento de los canales en el Canon"
  tr: "Barajın nedenleri ve kanalizasyonun daralması ile genişlemesi İbn Sina'ya göre"
  id: "Penyebab bendungan dan penyempitan serta pelebaran saluran pembuangan menurut Ibn Sina"
summary:
  ar: "في الفصلين السادس والسابع يذكر ابن سينا أن السدة تحدث بوقوع شيء غريب في المجرى، جنسا أو مقدارا أو كيفية، أو بالتحام المنفذ أو انطباقه، وأن المجاري تتسع لضعف الماسكة أو حركة قوية من الدافعة أو أدوية مرخية، وتضيق لأضداد ذلك {cite:canon-ibn-sina-print-v1 p.145}."
  en: "In chapters 6 and 7 Ibn Sina says that obstruction arises when something foreign lodges in a channel, foreign in kind, amount or quality, or when the passage is joined shut or squeezed, and that channels widen through weakness of the retentive power, strong movement of the expulsive power or relaxing drugs, and narrow through the opposites {cite:canon-ibn-sina-print-v1 p.145}."
  fr: "Aux chapitres 6 et 7, Ibn Sina attribue l’obstruction à un corps étranger par genre, quantité ou qualité, ou à une fermeture ou compression ; la dilatation à faiblesse rétentive, forte expulsion ou remèdes relâchants ; le rétrécissement aux contraires {cite:canon-ibn-sina-print-v1 p.145}."
  es: "En los capítulos 6 y 7, Ibn Sina dice que la obstrucción surge cuando algo extraño se aloja en un canal, extraño en tipo, cantidad o calidad, o cuando el paso se cierra o se estrecha, y que los canales se ensanchan por la debilidad del poder de retención, el fuerte movimiento del poder de expulsión o las drogas relajantes, y se estrechan por los opuestos {cite:canon-ibn-sina-print-v1 p.145}."
  ur: "ابواب 6 اور 7 میں ابن سینا کا کہنا ہے کہ رکاوٹ اس وقت پیدا ہوتی ہے جب غیر ملکی چیز کسی چینل میں، قسم، مقدار یا معیار کے لحاظ سے غیر ملکی ہو، یا جب راستہ بند ہو یا نچوڑا جائے، اور یہ راستے برقرار رکھنے کی طاقت کی کمزوری، خارج کرنے والی طاقت کی مضبوط حرکت یا آرام دہ دوائیوں کے ذریعے وسیع ہو جائیں، اور {مضبوطی کے ذریعے تنگ ہو جائیں۔ صفحہ 145}۔"
  tr: "Altıncı ve yedinci bölümlerde, İbn Sina, bir tıkanıklığın derede tuhaf bir şey meydana geldiğinde—tür, miktar veya biçimde—ya da nüfuz edici aracın birleşmesi veya uygulanması sonucu meydana geldiğinde ve geçitlerin zayıf tutuş, dürtüden gelen güçlü hareket veya rahatlatıcı ilaçlar nedeniyle genişlediğini ve zıttlarına daraldığını belirtir {cite:canon-ibn-sina-print-v1 s.145}."
  id: "Pada bab enam dan tujuh, Ibn Sina menyebutkan bahwa penyumbatan terjadi ketika sesuatu yang aneh terjadi dalam aliran—dalam jenis, jumlah, atau cara—atau melalui fusi atau aplikasi penetrator atau aplikasinya, dan bahwa bagian-bagian tersebut mengembang karena cengkeraman lemah, gerakan kuat dari impuls, atau obat relaksan, dan menyusut ke lawannya {cite:canon-ibn-sina-print-v1 hlm.145}."
