id: concept/canon-causes-of-the-ease-of-pain
class: concept
kind: scientific
label:
  ar: "أسباب سكون الوجع عند ابن سينا"
  en: "The causes of the ease of pain in the Canon"
  fr: "Causes d’apaisement de la douleur dans le Canon"
  ur: "درد کے سکون کے اسباب، قانون کے مطابق"
  es: "Las causas de la facilidad del dolor en el Canon"
summary:
  ar: "في الفصل الحادي والعشرين يذكر ابن سينا أن سكون الوجع إما بما يقطع السبب الموجب له ويستفرغه كالشبت وبزر الكتان ضماداً، وإما بما يرطّب وينوّم كالمسكرات، وإما بما يبرّد فيخدّر كالمخدرات، ويرى أن المسكّن الحقيقي هو الأول {cite:canon-ibn-sina-print-v1 pp.150-151}."
  en: "In chapter 21 Ibn Sina says pain eases either by what cuts off and evacuates its cause, as dill and flaxseed do as a poultice, or by what moistens and puts to sleep, like intoxicants, or by what cools and numbs, like narcotics, and he holds that the true soother is the first {cite:canon-ibn-sina-print-v1 pp.150-151}."
  fr: "Au chapitre 21, Ibn Sina distingue suppression et évacuation de la cause, comme par cataplasme d’aneth et lin ; humidification et sommeil par les enivrants ; refroidissement et engourdissement par les narcotiques. Seul le premier serait un véritable apaisant {cite:canon-ibn-sina-print-v1 pp.150-151}."
  es: "En el capítulo 21, Ibn Sina dice que el dolor se alivia ya sea por lo que corta y evacua su causa, como lo hacen el eneldo y la linaza en forma de cataplasma, o por lo que humedece y adormece, como los intoxicantes, o por lo que refresca y adormece, como los narcóticos, y sostiene que el verdadero calmante es el primero {cite:canon-ibn-sina-print-v1 pp.150-151}."
  ur: "باب 21 میں ابن سینا کہتا ہے کہ درد یا تو اس چیز سے کم ہوتا ہے جو اس کے سبب کو کاٹتی اور نکال دیتی ہے، جیسا کہ دال اور فلاس سیڈ پولٹیس کی طرح کرتے ہیں، یا ان چیزوں سے جو نشہ آور چیزوں کی طرح، یا اس چیز سے جو ٹھنڈی اور بے حسی کرتی ہے، جیسے منشیات، اور اس کا خیال ہے کہ حقیقی سکون دینے والا پہلا ہے: صفحہ 150-151}۔"
