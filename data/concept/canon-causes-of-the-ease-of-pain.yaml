label: { ar: "أسباب سكون الوجع عند ابن سينا", en: "The causes of the ease of pain in the Canon", ur: "درد کے سکون کے اسباب، قانون کے مطابق" }
summary:
  ar: "في الفصل الحادي والعشرين يذكر ابن سينا أن سكون الوجع إما بما يقطع السبب الموجب له ويستفرغه كالشبت وبزر الكتان ضماداً، وإما بما يرطّب وينوّم كالمسكرات، وإما بما يبرّد فيخدّر كالمخدرات، ويرى أن المسكّن الحقيقي هو الأول {cite:canon-ibn-sina-print-v1 pp.150-151}."
  en: "In chapter 21 Ibn Sina says pain eases either by what cuts off and evacuates its cause, as dill and flaxseed do as a poultice, or by what moistens and puts to sleep, like intoxicants, or by what cools and numbs, like narcotics, and he holds that the true soother is the first {cite:canon-ibn-sina-print-v1 pp.150-151}."
