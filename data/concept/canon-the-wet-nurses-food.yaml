id: concept/canon-the-wet-nurses-food
class: concept
kind: scientific
label: { ar: "غذاء المرضعة وما يفسد اللبن", en: "The wet nurse's food and what spoils milk", ur: "دایہ کی غذا اور دودھ بگاڑنے والی چیزیں", es: "La comida de la nodriza y lo que echa a perder la leche", fr: "L'alimentation de la nourrice et ce qui fait tourner le lait", tr: "Emzirme ve sütü bozan şeyler", id: "Memberi makan menyusui dan apa yang merusak ASI" }
summary:
  ar: "إذا أصابت المرضعة شرائطها وجب أن يجاد غذاؤها، فيجعل من الحنطة والخندريس ولحوم الخرفان والجداء والسمك غير العفن ولا الصلب اللحم، والخس واللوز والبندق، ويحذر من شر البقول للبن كالجرجير والخردل والباذروج، وفي النعناع قوة من ذلك {cite:canon-ibn-sina-print-v1 pp.205-206}."
  en: "Once the wet nurse meets her conditions, her food must be of good quality: wheat, old wine, meat of lambs and kids, fish whose flesh is neither rotten nor hard, with lettuce, almonds and hazelnuts, while the worst herbs for her milk are rocket, mustard and basil, and mint has some of that force {cite:canon-ibn-sina-print-v1 pp.205-206}."
  es: "Una vez que la nodriza cumple con sus condiciones, su comida debe ser de buena calidad: trigo, vino añejo, carne de cordero y cabrito, pescado cuya carne no esté ni podrida ni dura, con lechuga, almendras y avellanas, mientras que las peores hierbas para su leche son la rúcula, la mostaza y la albahaca, y la menta tiene algo de esa fuerza {cite:canon-ibn-sina-print-v1 pp.205-206}."
  fr: "Une fois que la nourrice a rempli ses conditions, sa nourriture doit être de bonne qualité: blé, vieux vin, viande d'agneaux et de chevreaux, poisson dont la chair n'est ni pourrie ni dure, avec de la laitue, des amandes et des noisettes, tandis que les pires herbes pour son lait sont la roquette, la moutarde et le basilic, et la menthe a une certaine force {cite:canon-ibn-sina-print-v1 pp.205-206}."
  ur: "ایک بار گیلی نرس اپنی شرائط پر پورا اترنے کے بعد، اس کا کھانا اچھے معیار کا ہونا چاہیے: گندم، پرانی شراب، بھیڑوں اور بچوں کا گوشت، مچھلی جن کا گوشت نہ تو سڑا ہوا ہو اور نہ ہی سخت، لیٹش، بادام اور ہیزلنٹس کے ساتھ، جب کہ اس کے دودھ کے لیے سب سے بری جڑی بوٹیاں راکٹ، سرسوں اور تلسی ہیں، اور پودینہ میں اس میں سے کچھ ہے۔ {حوالہ:کینن ابن سینا پرنٹ v1 صفحہ 205-206}۔"
  tr: "Emziren bir kadın kaburgalarından etkilenirse, yiyeceği affedilmelidir; böylece buğday, nohut, kuzu eti, inekler ve balıklar küflü veya katı et olmaz; ayrıca marul, badem ve fındık da öyle. Roka, hardal ve badruj gibi baklagillerin zararına karşı uyarır. Nane böyle bir güce sahiptir. {cite:canon-ibn-sina-print-v1 s.205-206}."
  id: "Jika seorang wanita menyusui terpengaruh oleh tulang rusuknya, makanannya harus dimaafkan, sehingga gandum, kacang arab, daging domba, sapi, dan ikan bukanlah daging yang berjamur atau padat, begitu juga selada, almond, dan kacang hazel. Ia memperingatkan tentang bahaya legum seperti rutula, mustard, dan badruj. Mint memiliki kekuatan seperti ini. {cite:canon-ibn-sina-print-v1 hlm.205-206}."
