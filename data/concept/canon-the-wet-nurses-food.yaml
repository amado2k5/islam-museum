summary:
  ar: "إذا أصابت المرضعة شرائطها وجب أن يجاد غذاؤها، فيجعل من الحنطة والخندريس ولحوم الخرفان والجداء والسمك غير العفن ولا الصلب اللحم، والخس واللوز والبندق، ويحذر من شر البقول للبن كالجرجير والخردل والباذروج، وفي النعناع قوة من ذلك {cite:canon-ibn-sina-print-v1 pp.205-206}."
  en: "Once the wet nurse meets her conditions, her food must be of good quality: wheat, old wine, meat of lambs and kids, fish whose flesh is neither rotten nor hard, with lettuce, almonds and hazelnuts, while the worst herbs for her milk are rocket, mustard and basil, and mint has some of that force {cite:canon-ibn-sina-print-v1 pp.205-206}."
