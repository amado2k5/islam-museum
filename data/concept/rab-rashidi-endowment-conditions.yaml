id: concept/rab-rashidi-endowment-conditions
class: concept
kind: term
label:
  ar: "شروط وقف الربع الرشيدي"
  en: "Conditions of the Rab-i Rashidi endowment"
  ur: "ربعِ رشیدی کے وقف کی شرائط"
  fr: "Conditions de la fondation pieuse du Rab-i Rashidi"
  es: "Condiciones de la fundación pía del Rab-i Rashidi"
summary:
  ar: "نص الوقفية التي أصدرها رشيد الدين لأبواب البر في الربع الرشيدي بتبريز كما يرويه هو في مقدمة جامع التواريخ. تقضي بأن يُستكتب كل عام نسخة كاملة من مصنفاته بالعربية وأخرى بالفارسية، على قطع بغدادي كبير وبخط جيد، وأن تُقابل بالأصل، وأن تُجلّد. وأن تُرسل النسخ إلى مدن الإسلام الكبرى، وأن تُودع في مدارس تلك المدن تحت إشراف مدرس. ويُخصص لأجرة الكتابة نصف حاصل الأوقاف، وتُعرض النسخ على قضاة تبريز ليوقّعوا عليها {cite:jami-al-tawarikh-khashshab-1960 p. 199}{cite:jami-al-tawarikh-khashshab-1960 p. 200}{cite:jami-al-tawarikh-khashshab-1960 p. 201}{cite:jami-al-tawarikh-khashshab-1960 p. 202}. ويذكر المؤلف أيضاً أن النسّاخ وقعت لهم أغلاط، وأن الأصل المحفوظ في قبة الربع لا يُخرج منه، وأن الفقهاء المقيمين في البقعة لهم الأولوية في الاستنساخ {cite:jami-al-tawarikh-khashshab-1960 p. 203}{cite:jami-al-tawarikh-khashshab-1960 p. 204}."
  en: "The terms of the endowment deed that Rashid al-Din issued for the charitable purposes of the Rab-i Rashidi in Tabriz, as he gives them in the preface to the Jami al-Tawarikh. Each year a complete copy of his works was to be made in Arabic and in Persian, on large Baghdadi paper, in a fine hand, collated with the original and bound. Copies were to be sent to the great cities of Islam and placed in their madrasas under a teacher. Half of the endowment's income was assigned to the copying, and the copies were to be certified by the judges of Tabriz {cite:jami-al-tawarikh-khashshab-1960 p. 199}{cite:jami-al-tawarikh-khashshab-1960 p. 200}{cite:jami-al-tawarikh-khashshab-1960 p. 201}{cite:jami-al-tawarikh-khashshab-1960 p. 202}. The author also says that copyists made errors, that the original kept in the dome of the Rab was not to leave the site, and that jurists resident there had priority in copying {cite:jami-al-tawarikh-khashshab-1960 p. 203}{cite:jami-al-tawarikh-khashshab-1960 p. 204}."
  ur: "رشید الدین کے وقف نامے کی شرائط، جیسا کہ انہوں نے جامع التواریخ کے دیباچے میں بیان کیا ہے۔ تبریز کے ربعِ رشیدی کے خیراتی کاموں کے لیے ہر سال ان کی تصانیف کی ایک مکمل نقل عربی اور فارسی دونوں میں بڑے بغدادی کاغذ پر، خوش خطی کے ساتھ، اصل سے مقابلہ کر کے اور جلد بند کر کے تیار کرانی تھی۔ نقلیں اسلام کے بڑے شہروں کو بھیجی جانی تھیں اور وہاں کے مدارس میں ایک مدرس کی نگرانی میں رکھی جانی تھیں۔ نقل کی اجرت کے لیے وقف کی آمدنی کا نصف مقرر تھا، اور نقلیں تبریز کے قاضیوں سے تصدیق کرانی تھیں {cite:jami-al-tawarikh-khashshab-1960 p. 199}{cite:jami-al-tawarikh-khashshab-1960 p. 200}{cite:jami-al-tawarikh-khashshab-1960 p. 201}{cite:jami-al-tawarikh-khashshab-1960 p. 202}۔ مصنف یہ بھی کہتے ہیں کہ نقل کرنے والوں سے غلطیاں ہوئیں، کہ ربع کے گنبد میں محفوظ اصل نسخہ وہاں سے باہر نہیں جائے گا، اور وہاں مقیم فقہا کو نقل میں ترجیح حاصل ہوگی {cite:jami-al-tawarikh-khashshab-1960 p. 203}{cite:jami-al-tawarikh-khashshab-1960 p. 204}۔"
  fr: "Les termes de l'acte de fondation que Rashid al-Din établit pour les œuvres pies du Rab-i Rashidi à Tabriz, tels qu'il les donne dans la préface du Jami al-Tawarikh. Chaque année, une copie complète de ses œuvres devait être faite en arabe et en persan, sur grand papier de Bagdad, d'une belle écriture, collationnée sur l'original et reliée. Les copies devaient être envoyées aux grandes villes de l'islam et déposées dans leurs madrasas sous la responsabilité d'un professeur. La moitié du revenu de la fondation était affectée à la copie, et les copies devaient être certifiées par les juges de Tabriz {cite:jami-al-tawarikh-khashshab-1960 p. 199}{cite:jami-al-tawarikh-khashshab-1960 p. 200}{cite:jami-al-tawarikh-khashshab-1960 p. 201}{cite:jami-al-tawarikh-khashshab-1960 p. 202}. L'auteur note aussi que des copistes ont commis des erreurs, que l'original conservé dans la coupole du Rab ne devait pas en sortir, et que les juristes résidant sur place avaient la priorité pour la copie {cite:jami-al-tawarikh-khashshab-1960 p. 203}{cite:jami-al-tawarikh-khashshab-1960 p. 204}."
  es: "Los términos de la escritura de fundación que Rashid al-Din dictó para las obras pías del Rab-i Rashidi en Tabriz, tal como los da en el prefacio del Jami al-Tawarikh. Cada año debía hacerse una copia completa de sus obras en árabe y en persa, en papel bagdadí grande y con buena letra, cotejada con el original y encuadernada. Las copias debían enviarse a las grandes ciudades del islam y depositarse en sus madrasas bajo un maestro. La mitad de la renta de la fundación se destinaba a la copia, y las copias debían ser certificadas por los jueces de Tabriz {cite:jami-al-tawarikh-khashshab-1960 p. 199}{cite:jami-al-tawarikh-khashshab-1960 p. 200}{cite:jami-al-tawarikh-khashshab-1960 p. 201}{cite:jami-al-tawarikh-khashshab-1960 p. 202}. El autor afirma también que los copistas cometieron errores, que el original guardado en la cúpula del Rab no debía salir del recinto y que los juristas residentes tenían prioridad para copiar {cite:jami-al-tawarikh-khashshab-1960 p. 203}{cite:jami-al-tawarikh-khashshab-1960 p. 204}."
