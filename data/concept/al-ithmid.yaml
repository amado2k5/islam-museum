id: concept/al-ithmid
class: concept
kind: scientific
label:
  ar: "الإثمد والكحل"
  en: "Ithmid and kohl (al-ithmid wa-l-kuhl)"
  fr: "Ithmid et khôl (al-ithmid wa-l-kuhl)"
  ur: "اثمد اور سرمہ"
  es: "Ithmid y kohl (al-ithmid wa-l-kuhl)"
  tr: "Al-Ithmad ve Kohl"
  id: "Al-Ithmad ve Kohl"
summary:
  ar: "الإثمد حجر الكحل الأسود، ويقول ابن قيم الجوزية إن أفضله ما يؤتى به من أصبهان {cite:zad-al-maad p.695}. وروى أبو داود أن النبي أمر بالإثمد المروح عند النوم وقال: «ليتقه الصائم» {cite:sunan-abi-dawud 2377}، وروى ابن ماجه «عليكم بالإثمد فإنه يجلو البصر وينبت الشعر» {cite:sunan-ibn-majah 3495}. ويذكر ابن القيم عدد الاكتحال: ثلاثاً في كل عين، أو ثلاثاً في اليمنى واثنتين في اليسرى، ويحكي في الوتر قولين في مذهب أحمد وغيره {cite:zad-al-maad p.695} {cite:zad-al-maad p.696}."
  en: "Ithmid is the black stone of kohl, and Ibn Qayyim al-Jawziyya says the best comes from Isfahan {cite:zad-al-maad p.695}. Abu Dawud reports that the Prophet ordered scented ithmid at bedtime and said 'let the fasting person avoid it' {cite:sunan-abi-dawud 2377}, and Ibn Majah reports 'hold to ithmid, for it clears the sight and makes the hair grow' {cite:sunan-ibn-majah 3495}. Ibn al-Qayyim gives the number of applications: three in each eye, or three in the right and two in the left, and records two views on the odd number in Ahmad's school and others {cite:zad-al-maad p.695} {cite:zad-al-maad p.696}."
  fr: "L’ithmid est la pierre noire dont on tire le khôl. Selon Ibn Qayyim al-Jawziyya, la meilleure vient d’Ispahan {cite:zad-al-maad p.695}. Abu Dawud rapporte que le Prophète prescrivait l’ithmid parfumé au coucher et disait : « Que celui qui jeûne s’en abstienne » {cite:sunan-abi-dawud 2377}. Ibn Majah rapporte : « Employez l’ithmid, car il clarifie la vue et fait pousser les poils » {cite:sunan-ibn-majah 3495}. Ibn al-Qayyim indique le nombre d’applications : trois dans chaque œil, ou trois dans le droit et deux dans le gauche. Il signale deux avis sur le nombre impair dans l’école d’Ahmad et ailleurs {cite:zad-al-maad p.695} {cite:zad-al-maad p.696}."
  ur: "اثمد سرمے کا کالا پتھر ہے، اور ابن قیم الجوزیہ کہتے ہیں کہ بہترین وہ ہے جو اصفہان سے آتا ہے {cite:zad-al-maad p.695}۔ ابو داود میں ہے کہ نبی نے سونے کے وقت خوشبو ملا اثمد لگانے کا حکم دیا اور فرمایا: «روزہ دار اس سے بچے» {cite:sunan-abi-dawud 2377}، اور ابن ماجہ میں ہے: «اثمد کو لازم پکڑو، یہ بینائی کو جلا دیتا ہے اور بال اگاتا ہے» {cite:sunan-ibn-majah 3495}۔ ابن القیم سرمہ لگانے کی تعداد بتاتے ہیں: ہر آنکھ میں تین بار، یا دائیں میں تین اور بائیں میں دو، اور وتر کے بارے میں امام احمد کے مذہب وغیرہ میں دو اقوال نقل کرتے ہیں {cite:zad-al-maad p.695} {cite:zad-al-maad p.696}۔"
  es: "Ithmid es la piedra negra del kohl, e Ibn Qayyim al-Jawziyya dice que la mejor proviene de Isfahán {cite:zad-al-maad p.695}. Abu Dawud informa que el Profeta ordenó usar ithmid perfumado antes de acostarse y dijo: \"Que la persona que ayuna lo evite\" {cite:sunan-abi-dawud 2377}, e Ibn Majah informa: \"Conserven el ithmid, pues aclara la vista y hace crecer el cabello\" {cite:sunan-ibn-majah 3495}. Ibn al-Qayyim da el número de aplicaciones: tres en cada ojo, o tres en el derecho y dos en el izquierdo, y registra dos opiniones sobre el número impar en la escuela de Ahmad y otras {cite:zad-al-maad p.695} {cite:zad-al-maad p.696}."
  tr: "El-İtmed, siyah sürme taşıdır ve İbn Kayyim el-Cevziyyah en iyisinin İsfahan'dan getirilen taş olduğunu söyler {alıntı:zad-al-maad s.695}. Ebu Davud, Peygamber'in uyurken yünün seyreltilmesini emrediğini ve \"Oruç tutan kişi bundan korunsun\" dediğini rivayet etmiş {atıf:sunan-abi-dawud 2377} ve İbn Majah şöyle anlatmıştır: \"İtamad kullanmalısın, çünkü gözü temizler ve saçların uzamasına neden olur\" {atıf:sunan-ibn-majah 3495}. İbn al-Kayyim, sürgünün sayısını her gözde üç, sağ gözde üç, solda iki olarak belirtir ve Ahmad okulu ve diğerlerine göre tuhaf namazlarla ilgili iki görüş aktarır {cite:zad-al-maad s.695} {cite:zad-al-maad s.696}."
  id: "Al-Itmad adalah batu kohl hitam, dan Ibn Qayyim al-Jawziyyah mengatakan batu terbaik adalah yang dibawa dari Isfahan {kutipan: zad-al-maad hlm.695}. Abu Dawud menceritakan bahwa Nabi memerintahkan agar wol dicairkan saat tidur dan berkata, \"Biarlah orang yang berpuasa dilindungi darinya\" {atribusi: Sunan-abi-Dawud 2377}, dan Ibn Majah menceritakan sebagai berikut: \"Kamu harus menggunakannya karena membersihkan mata dan menyebabkan rambut tumbuh\" {atribusi: Sunan-ibn-Majah 3495}. Ibn al-Qayyim menyatakan jumlah orang buangan sebagai tiga di setiap mata, tiga di mata kanan, dan dua di kiri, serta berbagi dua pandangan tentang doa aneh menurut mazhab Ahmad dan lainnya {cite:zad-al-maad hlm.695} {cite:zad-al-maad hlm.696}."
