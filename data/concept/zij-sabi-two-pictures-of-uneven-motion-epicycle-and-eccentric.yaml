label: { ar: "تصويران لاختلاف الحركة: فلك التدوير والفلك الخارج المركز", en: "Two pictures of uneven motion: the epicycle and the eccentric", ur: "غیر یکساں حرکت کی دو تصویریں: فلکِ تدویر اور خارج المرکز", es: "Dos imágenes de movimiento desigual: el epiciclo y el excéntrico.", fr: "Deux images de mouvement irrégulier: l'épicycle et l'excentrique", tr: "Hareket farklılığının iki gösterimi: episikl ve ektosiklik.", id: "Dua penggambaran perbedaan gerak: epikikel dan ektosena." }
summary:
  ar: "يذكر البتاني أن بطليموس بيّن وأوضح أن الحركات المختلفة ترى وتظن على جهتين: إحداهما أن يتوهم للكوكب فلك مركزه مركز فلك البروج وعلى هذا الفلك فلك آخر صغير غير محيط بالأرض يجري مركزه على الدائرة الكبيرة، ويتحرك الكوكب في الصغير، والثانية أن يتوهم فلك آخر مركزه غير مركز الأول يقطع دائرته في موضعين {cite:zij-sabi-nallino-byblion pp.71-72}."
  en: "Al-Battani says that Ptolemy showed and made clear that uneven motions are seen and supposed in two ways: in one, a sphere is imagined for the planet whose centre is the centre of the zodiac, with a second, small sphere carried upon it that does not enclose the earth, its centre running on the circle of the great sphere while the planet moves in the small one; in the other, a further sphere is imagined whose centre is not the centre of the first and which cuts its circle in two places {cite:zij-sabi-nallino-byblion pp.71-72}."
  ur: "البتانی بتاتے ہیں کہ بطلیموس نے واضح کیا ہے کہ غیر یکساں حرکتیں دو طرح دیکھی اور سمجھی جاتی ہیں: ایک یہ کہ ستارے کے لیے ایک فلک تصور کیا جائے جس کا مرکز فلک البروج کا مرکز ہو، اور اس پر ایک اور چھوٹا فلک لٹکا ہو جو زمین کو گھیرے نہ، جس کا مرکز بڑے فلک کے دائرے پر چلے اور ستارہ چھوٹے فلک میں حرکت کرے؛ دوسری یہ کہ ایک اور فلک تصور کیا جائے جس کا مرکز پہلے کے مرکز سے مختلف ہو اور جو اس کے دائرے کو دو جگہوں پر کاٹے {cite:zij-sabi-nallino-byblion pp.71-72}۔"
  es: "Al-Battani dice que Ptolomeo mostró y dejó claro que los movimientos desiguales se ven y se suponen de dos maneras: en una, se imagina una esfera para el planeta cuyo centro es el centro del zodíaco, con una segunda esfera pequeña llevada sobre ella que no encierra la tierra, cuyo centro corre sobre el círculo de la gran esfera mientras el planeta se mueve en la pequeña; en la otra, se imagina una esfera adicional cuyo centro no es el centro de la primera y que corta su círculo en dos lugares {cite:zij-sabi-nallino-byblion pp.71-72}."
  fr: "Al-Battani affirme que Ptolémée a montré et clarifié que les mouvements inégaux sont perçus et supposés de deux manières: d'une part, on imagine une sphère pour la planète dont le centre est le centre du zodiaque, avec une seconde sphère plus petite portée dessus qui n'entoure pas la terre, son centre se déplaçant sur le cercle de la grande sphère tandis que la planète se déplace dans la petite; d'autre part, on imagine une autre sphère dont le centre n'est pas le centre de la première et qui coupe son cercle en deux endroits {cite:zij-sabi-nallino-byblion pp.71-72}."
  tr: "El-Battani, Batlamyus'un farklı hareketlerin iki şekilde görüldüğünü ve düşünüldüğünü açıkladığını belirtir: Birincisi, gezegenin merkezi ekliptiğin merkezi olan bir yörüngesi olduğunu ve bu yörünge üzerinde, merkezi büyük daire üzerinde olan ve Dünya'yı çevrelemeyen başka bir küçük yörünge olduğunu ve gezegenin bu küçük yörüngede hareket ettiğini hayal etmektir. İkincisi ise, merkezi birincisinin merkezi olmayan ve dairesini iki yerden kesen başka bir yörünge hayal etmektir. {cite:zij-sabi-nallino-byblion pp.71-72}"
  id: "Al-Battani menyebutkan bahwa Ptolemy menjelaskan dan mengklarifikasi bahwa gerakan yang berbeda dilihat dan dipikirkan dalam dua cara: pertama, dengan membayangkan bahwa planet memiliki orbit yang pusatnya adalah pusat ekliptika, dan pada orbit ini terdapat orbit kecil lain yang tidak mengelilingi bumi yang pusatnya berada pada lingkaran besar, dan planet bergerak di orbit kecil tersebut. Kedua, dengan membayangkan orbit lain yang pusatnya bukan pusat orbit pertama, dan orbit tersebut memotong lingkarannya di dua tempat {cite:zij-sabi-nallino-byblion pp.71-72}."
