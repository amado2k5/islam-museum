label:
  ar: "قبور الأنبياء: ما تقرره الأحاديث وما تنسبه الكتب"
  en: "The graves of the prophets: what the hadith establish and what the books attribute"
  ur: "انبیا کی قبریں: احادیث کیا ثابت کرتی ہیں اور کتابیں کیا منسوب کرتی ہیں"
  es: "Las tumbas de los profetas: lo que establecen los hadices y lo que atribuyen los libros."
  fr: "Les tombes des prophètes: ce que les hadiths établissent et ce que les livres attribuent"
  tr: "Peygamberlerin Mezarları: Hadislerin Doğruladığı Ve Kitapların Atfettiği Şeyler."
  id: "Makam Para Nabi: Apa yang dikonfirmasi oleh hadis dan atribusi dalam buku-buku."
summary:
  ar: "تروي «السيرة» عن أبي بكر أن النبي يُدفن حيث يُقبض {cite:ibn-hisham-sira scan p. 672}، ويروي البخاري عن أبي هريرة أن النبي قال في قبر موسى «لو كنت ثم لأريتكم قبره تحت الكثيب الأحمر» {cite:fath-al-bari scan vol. 1 p. 5}، ويروي مسلم أنه مرّ بموسى يصلي في قبره {cite:fath-al-bari scan vol. 1 p. 11}، ويروي البخاري التحذير من اتخاذ قبور الأنبياء مساجد {cite:sahih-al-bukhari 1330}. ويذكر ابن كثير قبر إبراهيم وإسحاق ويعقوب بالخليل ويقول إنه متلقى بالتواتر وإن تعيين الموضع منه لا خبر صحيح فيه {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 239}، ويورد اختلاف الروايات في قبر آدم ونوح وهود {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 73} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 121} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 143}. ولا يقرر السجل صحة أي تعيين."
  en: "The Sira reports from Abu Bakr that a prophet is buried where he is taken {cite:ibn-hisham-sira scan p. 672}; al-Bukhari reports from Abu Hurayra the Prophet's saying on Musa's grave, 'I would show you his grave under the red dune' {cite:fath-al-bari scan vol. 1 p. 5}; Muslim reports that he passed Musa praying in his grave {cite:fath-al-bari scan vol. 1 p. 11}; and al-Bukhari reports the warning against taking prophets' graves as places of worship {cite:sahih-al-bukhari 1330}. Ibn Kathir gives the grave of Ibrahim, Ishaq and Yaqub at Hebron as received by continuous transmission, while saying there is no sound report fixing its place within the enclosure {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 239}, and sets out differing reports on the graves of Adam, Nuh and Hud {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 73} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 121} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 143}. The record does not affirm any identification."
  ur: "«سیرت» ابو بکر سے روایت کرتی ہے کہ نبی وہیں دفن ہوتا ہے جہاں قبض ہو {cite:ibn-hisham-sira scan p. 672}؛ بخاری ابو ہریرہ سے موسیٰ کی قبر کے بارے میں نبی کا قول لاتے ہیں «میں تمھیں ان کی قبر سرخ ٹیلے کے نیچے دکھاتا» {cite:fath-al-bari scan vol. 1 p. 5}؛ مسلم روایت کرتے ہیں کہ نبی موسیٰ کے پاس سے گزرے جو قبر میں نماز پڑھ رہے تھے {cite:fath-al-bari scan vol. 1 p. 11}؛ اور بخاری انبیا کی قبروں کو سجدہ گاہ بنانے سے تنبیہ روایت کرتے ہیں {cite:sahih-al-bukhari 1330}۔ ابن کثیر خلیل میں ابراہیم، اسحاق اور یعقوب کی قبر کو تواتر سے منقول بتاتے ہیں اور کہتے ہیں کہ اس کے اندر جگہ کی تعیین کی کوئی صحیح خبر نہیں {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 239}، اور آدم، نوح اور ہود کی قبروں کے بارے میں مختلف روایات لاتے ہیں {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 73} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 121} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 143}۔ یہ اندراج کسی تعیین کی تصدیق نہیں کرتا۔"
  es: "La Sira informa de Abu Bakr que un profeta es enterrado donde es llevado {cite:ibn-hisham-sira scan p. 672}; al-Bujari informa de Abu Hurayra que el Profeta dijo en la tumba de Musa: 'Te mostraré su tumba bajo la duna roja' {cite:fath-al-bari scan vol. 1 p. 5}; Muslim informa que pasó junto a Musa orando en su tumba {cite:fath-al-bari scan vol. 1 p. 11}; y al-Bujari informa la advertencia contra tomar las tumbas de los profetas como lugares de culto {cite:sahih-al-bukhari 1330}. Ibn Kathir da la tumba de Ibrahim, Ishaq y Yaqub en Hebrón como recibida por transmisión continua, mientras que dice que no hay un informe sólido que fije su lugar dentro del recinto {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 239}, y expone diferentes informes sobre las tumbas de Adán, Nuh y Hud {cita:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 73} {cita: qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 121} {cita: qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 143}. El registro no afirma ninguna identificación."
  fr: "La Sira rapporte d'après Abou Bakr qu'un prophète est enterré là où il est transporté (cite: Ibn Hisham Sira, p. 672); al-Boukhari rapporte d'après Abou Hourayra les paroles du Prophète sur la tombe de Moïse: « Je vous montrerais sa tombe sous la dune rouge » (cite: Fath al-Bari, vol. 1, p. 5); Muslim rapporte avoir croisé Moïse en prière sur sa tombe (cite: Fath al-Bari, vol. 1, p. 11); et al-Boukhari rapporte la mise en garde contre le fait de considérer les tombes des prophètes comme des lieux de culte (cite: Sahih al-Boukhari, p. 1330). Ibn Kathir indique que les tombes d'Ibrahim, d'Isaac et de Jacob se trouvent à Hébron, selon une tradition orale continue, tout en précisant qu'il n'existe aucun hadith fiable fixant leur emplacement exact à l'intérieur de l'enceinte (cite: Qisas al-Anbiya, Ibn Kathir, p. 1330). 239}, et présente des rapports différents sur les tombes d'Adam, Nuh et Hud {cite: qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 73} {cite: qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 121} {cite: qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 143}. Le dossier n’affirme aucune identification."
  tr: "'Sira', Ebu Bekir'den Peygamber'in gömülü olduğu yerde gömülü olduğunu rivayet eder {atıf:ibn-hisham-sira tarama s. 672} ve El-Buhari, Ebu Huraira'dan Peygamber'in Musa'nın mezarı hakkında şöyle dediğini rivayet eder: \"Eğer öyle olsaydım, sana onun mezarını Kızıl Kum Tepesi'nin altındaki mezarını gösterirdim\" {atıf:fath-al-bari taraması cilt 1, s. 5}. Müslüman, Musa'nın mezarında namaz kılırken geçtiğini anlatır {atıf:fath-al-bari taraması cilt 1, s. 11} ve El-Buhari ayrıca peygamberlerin mezarlarını camiye dönüştürmeme konusunda uyarıyı da aktarır {cite:sahih-al-bukhari 1330}. İbn Kathir, İbrahim, İshak ve Yakup'un Hebron'daki mezarlarından bahseder ve bunun toplu iletimle aktarıldığını söyler, ancak konum gerçek değildir {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook s. 239} ve ayrıca Adem, Nuh ve Hud'un mezarları hakkında farklı anlatımlar yapmaktadır {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook s. 73} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook taranması s. 121} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook taranı s. 143}. Kayıt, herhangi bir atıfın doğruluğunu doğrulamamaktadır."
  id: "'Sira' menceritakan dari Abu Bakr bahwa Nabi dimakamkan di tempat ia dimakamkan {cite:ibn-hisham-sira scan hlm. 672}, dan Al-Bukhari menceritakan dari Abu Huraira bahwa Nabi berkata tentang makam Musa: \"Jika saya ada, maka saya akan menunjukkan makamnya di bawah Bukit Merah\" {cite:fath-al-bari scan vol. 1, hlm. 5}. Muslim menceritakan bahwa ia melewati Musa saat berdoa di makamnya {cite:fath-al-bari scan vol. 1, hlm. 11}, dan Al-Bukhari juga menceritakan peringatan agar tidak mengubah makam nabi menjadi masjid {cite:sahih-al-bukhari 1330}. Ibn Kathir menyebutkan makam Abraham, Ishak, dan Yakub di Hebron dan mengatakan bahwa makam tersebut ditransmisikan melalui transmisi massal, meskipun lokasinya tidak otentik {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan hlm. 239}, dan ia juga menyebutkan narasi yang berbeda mengenai makam Adam, Nuh, dan Hud {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan hlm. 73} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan hlm. 121} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan hlm. 143}. Catatan tersebut tidak mengonfirmasi keakuratan atribusi apa pun."
