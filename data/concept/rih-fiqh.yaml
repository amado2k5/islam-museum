label:
  ar: "الريح"
  en: "Rih: wind, flatulence, and related legal rulings in Islamic jurisprudence"
  ur: "ریح ⁦(ہوا، ریح خارج ہونا اور اس کے فقہی احکام)⁩"
  es: "Rih: gases, flatulencia y normas legales relacionadas en la jurisprudencia islámica."
  fr: "Rih: vent, flatulences et règles juridiques connexes en jurisprudence islamique"
  tr: "Rüzgar"
  id: "Angin"
summary:
  ar: "الريح لغة الهواء المسير بين السماء والأرض وتطلق أيضا على الرائحة والغلبة، ولا يخرج المعنى الفقهي عن ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9045} يستحب عند هبوب الريح الدعاء بسؤال خيرها والاستعاذة من شرها ويكره سبها، كما يستحب عند الشافعية والحنابلة صلاة ركعتين عند اشتداد الريح المظلمة قياسا على الكسوف، ويجمع الفقهاء على أن خروج الريح من الدبر ينقض الوضوء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9046} الريح الخارجة من الدبر طاهرة العين فلا تنجس الثياب المبتلة ولا يشرع لها استنجاء، ويجب إزالة ريح النجاسة عند تطهير المتنجس ويعفى عن الرائحة إن تعسرت إزالتها، ويكره إخراج الريح عمدا في المسجد، ولا يثبت حد الخمر بمجرد وجود ريحها في الفم عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9047} يكره قضاء الحاجة في مهب الريح تحرزا من رشاش النجاسة، ويباح التخلف عن صلاة الجمعة والجماعة عند اشتداد الريح الباردة ليلا للمشقة ودفعا للحرج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9048}"
  en: "Rih lexically signifies wind moving between heaven and earth, as well as scent and power, and its fiqh usage reflects these meanings. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9045} When wind blows, it is recommended to pray for its good and seek refuge from its harm while reviling it is disliked; the Shafi'is and Hanbalis recommend performing two prayer units during intense winds analogous to eclipse prayers, and scholars agree that passing wind from the anus invalidates ablution. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9046} The wind that exits the body is ritually pure in substance and does not pollute wet garments, nor is cleansing with water (istinja') prescribed for it, while removing the foul smell of impurities during purification is obligatory unless it proves exceptionally difficult, intentionally passing wind in mosques is disliked, and detecting the scent of wine on someone's breath does not establish a penal legal penalty according to the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9047} Relieving oneself facing wind is disliked to avoid impurity splashback, and missing Friday and congregational prayers is excused during fierce, cold night winds due to hardship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9048}"
  ur: "ریح کا لغوی معنی زمین و آسمان کے درمیان چلنے والی ہوا ہے اور خوشبو و غلبے پر بھی اس کا اطلاق ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9045} تیز ہوا کے وقت دعا مانگنا اور اسے برا بھلا کہنے سے بچنا مستحب ہے، شدید آندھی پر شوافع اور حنابلہ کے نزدیک کسوف کی مانند نماز مستحب ہے، اور پیٹھ کے راستے ہوا کا نکلنا بالاتفاق وضو کو توڑ دیتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9046} خارج ہونے والی ہوا کی ذات پاک ہے لہٰذا وہ بھیگے ہوئے کپڑے کو ناپاک نہیں کرتی اور اس کے بعد استنجا مشروع نہیں ہے، جبکہ ناپاکی کو دھوتے وقت اس کی بو دور کرنا واجب ہے بجز مشقت کے، مسجد میں جان بوجھ کر ہوا خارج کرنا مکروہ ہے، اور منہ سے شراب کی بو آنے سے جمہور کے نزدیک حد قائم نہیں ہوتی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9047} ہوا کے رخ پر پیشاب یا رفع حاجت کرنا چھینٹوں سے بچنے کے لیے مکروہ ہے، اور رات کے وقت سخت سرد آندھی میں جمعہ و جماعت سے غیر حاضری کی رخصت دی گئی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9048}"
  es: "Rih significa léxicamente viento que se mueve entre el cielo y la tierra, así como aroma y poder, y su uso en el fiqh refleja estos significados. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9045} Cuando sopla el viento, se recomienda orar por su bien y buscar refugio de su daño, mientras que insultarlo es desaconsejable; los shafi'is y hanbalis recomiendan realizar dos unidades de oración durante vientos intensos, análogas a las oraciones de eclipse, y los eruditos coinciden en que expulsar gases por el ano invalida la ablución. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9046} El viento que sale del cuerpo es ritualmente puro en sustancia y no contamina las vestiduras mojadas, ni se prescribe la purificación con agua (istinja') para él, mientras que eliminar el mal olor de las impurezas durante la purificación es obligatorio a menos que resulte excepcionalmente difícil, expulsar gases intencionalmente en las mezquitas es desaconsejable, y detectar el olor a vino en el aliento de alguien no constituye una pena legal penal según la mayoría. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9047} Orinar de cara al viento es desaconsejable para evitar salpicaduras de impurezas, y faltar a las oraciones del viernes y a las oraciones en congregación está excusado durante vientos nocturnos fuertes y fríos debido a dificultades. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9048}"
  fr: "Le terme « rih » signifie lexicalement le vent qui circule entre le ciel et la terre, ainsi que parfum et force, et son usage en jurisprudence islamique (fiqh) reflète ces significations. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9045} Lorsque le vent souffle, il est recommandé de prier pour son bien et de se protéger de son mal, tandis que le maudire est déconseillé; les écoles chaféite et hanbalite recommandent d’accomplir deux unités de prière lors de vents intenses, à l’instar des prières d’éclipse, et les savants s’accordent à dire que l’émission de gaz par l’anus invalide les ablutions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9046} Le gaz qui sort du corps est rituellement pur et ne souille pas les vêtements humides. Il n'est pas prescrit de le purifier avec de l'eau (istinja'). En revanche, il est obligatoire d'éliminer les odeurs nauséabondes lors de la purification, sauf en cas de difficulté exceptionnelle. Il est déconseillé de péter intentionnellement dans les mosquées. Détecter une odeur de vin sur l'haleine d'une personne n'entraîne pas de sanction pénale selon la majorité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9047} Il est déconseillé d'uriner face au vent afin d'éviter les éclaboussures d'impuretés. Enfin, il est excusé de manquer la prière du vendredi et les prières en congrégation en cas de vents nocturnes violents et froids, en raison de la difficulté de l'exécution de la prière. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9048}"
  tr: "Rüzgar, gökyüzü ile yer arasında dolaşan havanın dilidir ve aynı zamanda koku ve hakimiyeti ifade eder; fihil anlamı bundan sapmaz. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.9045} Rüzgar estiğinde iyiliği için dua etmek ve kötülüğünden sığınmak tavsiye edilir, ancak lanetlenmesi hoş karşılanmaz. Benzer şekilde, Şafi'ler ve Hanbali'lere göre, karanlık rüzgar güçlü olduğunda iki raket namaz kılmak önerilir, bu tutulmaya benzer. Hukukçular oybirliğiyle anüsten gelen rüzgarın abdest almayı geçersiz kıldığını kabul ederler. {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 s. 9046} Anüsten gelen rüzgar gözün temizliğindedir, bu yüzden ıslak giysileri kirletmez ve istinja için reçete edilmez. Temizlik yapılırken kirli kokusu giderilmelidir ve çıkarılması zor ise koku muaf tutulur. Camide rüzgarın kasıtlı olarak dışarı atılması hoş karşılanmaz; alkolün cezası sadece cemaat arasında kokusu ağızdaysa belirlenmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9047} Kirli maddeleri püskürtmemek için rüzgarda rahatlamak hoş karşılanmaz; gece soğuk rüzgar şiddetlendiğinde cuma ve cemaat namazlarını kaçırmak da zorluğu ve sıkıntıyı hafifletmek için kabul edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9048}"
  id: "Angin adalah bahasa udara yang bergerak antara langit dan bumi, dan juga merujuk pada aroma dan dominasi, dan makna yurisprudensi tidak menyimpang dari itu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9045} Disarankan ketika angin bertiup untuk berdoa atas kebaikannya dan mencari perlindungan dari kejahatannya, tetapi tidak suka mengutuknya. Demikian pula, menurut Syafi'i dan Hanbali, disarankan untuk berdoa dua rak'ah saat angin gelap kencang, mirip dengan gerhana. Para ahli hukum sepakat bahwa angin yang datang dari anus membatalkan wudhu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9046} Angin yang keluar dari anus adalah murni mata, sehingga tidak memurnikan pakaian basah dan tidak diresepkan untuk istinja. Bau kotoran harus dihilangkan saat memurnikan kotoran, dan bau tersebut dibebaskan jika sulit dihilangkan. Tidak disukai untuk sengaja mengusir angin di masjid, dan hukuman untuk alkohol tidak ditetapkan hanya jika baunya ada di mulut di antara jemaat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9047} Tidak disukai untuk buang air kecil di angin agar tidak menyemprot kotoran, dan diperbolehkan melewatkan shalat Jumat dan jamaah ketika angin dingin semakin kuat di malam hari untuk mengurangi kesulitan dan kesedihan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9048}"
