label:
  ar: "الريح"
  en: "Rih: wind, flatulence, and related legal rulings in Islamic jurisprudence"
  ur: "ریح (ہوا، ریح خارج ہونا اور اس کے فقہی احکام)"
summary:
  ar: "الريح لغة الهواء المسير بين السماء والأرض وتطلق أيضا على الرائحة والغلبة، ولا يخرج المعنى الفقهي عن ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9045} يستحب عند هبوب الريح الدعاء بسؤال خيرها والاستعاذة من شرها ويكره سبها، كما يستحب عند الشافعية والحنابلة صلاة ركعتين عند اشتداد الريح المظلمة قياسا على الكسوف، ويجمع الفقهاء على أن خروج الريح من الدبر ينقض الوضوء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9046} الريح الخارجة من الدبر طاهرة العين فلا تنجس الثياب المبتلة ولا يشرع لها استنجاء، ويجب إزالة ريح النجاسة عند تطهير المتنجس ويعفى عن الرائحة إن تعسرت إزالتها، ويكره إخراج الريح عمدا في المسجد، ولا يثبت حد الخمر بمجرد وجود ريحها في الفم عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9047} يكره قضاء الحاجة في مهب الريح تحرزا من رشاش النجاسة، ويباح التخلف عن صلاة الجمعة والجماعة عند اشتداد الريح الباردة ليلا للمشقة ودفعا للحرج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9048}"
  en: "Rih lexically signifies wind moving between heaven and earth, as well as scent and power, and its fiqh usage reflects these meanings. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9045} When wind blows, it is recommended to pray for its good and seek refuge from its harm while reviling it is disliked; the Shafi'is and Hanbalis recommend performing two prayer units during intense winds analogous to eclipse prayers, and scholars agree that passing wind from the anus invalidates ablution. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9046} The wind that exits the body is ritually pure in substance and does not pollute wet garments, nor is cleansing with water (istinja') prescribed for it, while removing the foul smell of impurities during purification is obligatory unless it proves exceptionally difficult, intentionally passing wind in mosques is disliked, and detecting the scent of wine on someone's breath does not establish a penal legal penalty according to the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9047} Relieving oneself facing wind is disliked to avoid impurity splashback, and missing Friday and congregational prayers is excused during fierce, cold night winds due to hardship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9048}"
  ur: "ریح کا لغوی معنی زمین و آسمان کے درمیان چلنے والی ہوا ہے اور خوشبو و غلبے پر بھی اس کا اطلاق ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9045} تیز ہوا کے وقت دعا مانگنا اور اسے برا بھلا کہنے سے بچنا مستحب ہے، شدید آندھی پر شوافع اور حنابلہ کے نزدیک کسوف کی مانند نماز مستحب ہے، اور پیٹھ کے راستے ہوا کا نکلنا بالاتفاق وضو کو توڑ دیتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9046} خارج ہونے والی ہوا کی ذات پاک ہے لہٰذا وہ بھیگے ہوئے کپڑے کو ناپاک نہیں کرتی اور اس کے بعد استنجا مشروع نہیں ہے، جبکہ ناپاکی کو دھوتے وقت اس کی بو دور کرنا واجب ہے بجز مشقت کے، مسجد میں جان بوجھ کر ہوا خارج کرنا مکروہ ہے، اور منہ سے شراب کی بو آنے سے جمہور کے نزدیک حد قائم نہیں ہوتی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9047} ہوا کے رخ پر پیشاب یا رفع حاجت کرنا چھینٹوں سے بچنے کے لیے مکروہ ہے، اور رات کے وقت سخت سرد آندھی میں جمعہ و جماعت سے غیر حاضری کی رخصت دی گئی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9048}"
