label: { ar: "بعد الكوكب عن معدل النهار من ارتفاعه في وسط السماء", en: "The distance of a star from the equator from its altitude at midheaven", ur: "ستارے کا معدل النہار سے بعد وسط السماء کے ارتفاع کے ذریعے", es: "La distancia de una estrella al ecuador desde su altitud en el medio cielo." }
summary:
  ar: "يتناول الباب الخامس والعشرون معرفة الجزء الذي فيه الكوكب وعرضه من قبل بعده عن معدل النهار وما يتوسط السماء معه، إذا عُلم ذلك بقياس ارتفاع الكوكب في وسط السماء. وأول ذلك أخذ ارتفاعه في وسط السماء ومعرفة الفضل بينه وبين ارتفاع رأس الحمل في ذلك البلد، فهو بعده عن معدل النهار، شمالياً إن كان الارتفاع أكثر من ارتفاع أول الحمل، وجنوبياً إن كان أقل. {cite:zij-sabi-nallino-byblion pp.58-59}."
  en: "Chapter 25 deals with finding the part of the ecliptic in which a star stands and its latitude, from its distance from the equator and the part culminating with it, when this is known by measuring the altitude of the star at midheaven. The first step is to take its altitude at midheaven and find the excess between it and the altitude of the first of Aries in that place; that is its distance from the equator, northern if the altitude is more than the altitude of the first of Aries and southern if less. {cite:zij-sabi-nallino-byblion pp.58-59}."
  ur: "پچیسواں باب اس جزء کی پہچان کا ہے جس میں ستارہ ہے اور اس کے عرض کی، اس کے معدل النہار سے بعد اور اس کے ساتھ وسط السماء میں آنے والے جزء کے ذریعے، جب یہ وسط السماء میں ستارے کے ارتفاع کی پیمائش سے معلوم ہو۔ پہلا قدم وسط السماء میں اس کا ارتفاع لینا اور اس شہر میں حمل کے آغاز کے ارتفاع سے اس کا فرق جاننا ہے؛ یہی اس کا معدل النہار سے بعد ہے، شمالی اگر ارتفاع حمل کے ارتفاع سے زیادہ ہو اور جنوبی اگر کم ہو۔ {cite:zij-sabi-nallino-byblion pp.58-59}۔"
  es: "El capítulo 25 trata sobre cómo determinar la posición de una estrella en la eclíptica y su latitud, a partir de su distancia al ecuador y la parte que coincide con él, cuando esta se conoce midiendo la altitud de la estrella en el medio cielo. El primer paso consiste en tomar su altitud en el medio cielo y calcular la diferencia entre esta y la altitud del primero de Aries en ese punto; es decir, su distancia al ecuador: norte si la altitud es mayor que la del primero de Aries y sur si es menor. {cite:zij-sabi-nallino-byblion pp.58-59}."
