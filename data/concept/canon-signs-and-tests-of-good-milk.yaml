summary:
  ar: "يصف ابن سينا اللبن المحمود بقوامه ولونه ورائحته وطعمه ومقداره وتشابه أجزائه، ويذكر اختبارين: التقطير على الظفر، وإلقاء شيء من المر في زجاجة وتحريكه لمعرفة الجبنية والمائية {cite:canon-ibn-sina-print-v1 p.207}."
  en: "Ibn Sina describes good milk by its consistency, colour, smell, taste, quantity and evenness of parts, and names two tests: a drop on the fingernail, and a little myrrh put in a glass and stirred to learn how cheesy or watery it is {cite:canon-ibn-sina-print-v1 p.207}."
