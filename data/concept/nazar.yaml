id: concept/nazar
class: concept
kind: legal
label: { ar: "النَّظَر", en: "Nazar (looking) and its rulings", ur: "نظر (دیکھنا) اور اس کے احکام" }
summary:
  ar: "النظر في اللغة حس العين أو تأمل الشيء بها، ويراد به أحياناً الحفظ والتأمل، والرؤية أخص منه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15762} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15763} وأحكامه تختلف بحسب المنظور إليه، فالنظر إلى المرأة الأجنبية الشابة إلى ما عدا الوجه والكفين محرم بالاتفاق، وفي الوجه والكفين أربعة أقوال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15763} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15767} والنظر بشهوة إلى كل ما لا يحل محرم، والنظر إلى الصغيرة بشهوة حرام، ويباح للمحارم النظر بغير شهوة إلى مواضع الزينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15769} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15770} ويباح النظر للحاجة كالخطبة والعلاج والقضاء والشهادة والمعاملة والتعليم بقدر الحاجة، وينفى الإثم عن النظرة الأولى غير المقصودة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15788} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15792}"
  en: "Nazar, in the lexicon, is the sense of sight or considering a thing with the eye; it can also mean keeping or contemplating, and ru'ya (seeing) is narrower. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15762} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15763} Its rulings vary with the person looked at. For a man looking at a young foreign woman, all of her body except the face and hands is forbidden by agreement, and the face and hands carry four views. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15763} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15767} Looking with desire is forbidden in every case, and looking at a girl with desire is forbidden at any age; a man may look without desire at a mahram's places of adornment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15769} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15770} Looking is allowed for need, such as proposing, treatment, judging, testimony, dealing and teaching, only to the extent of the need. The first unintended glance is forgiven. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15788} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15792}"
  ur: "نظر لغت میں آنکھ کا دیکھنا یا کسی چیز پر غور کرنا ہے، اور اس سے حفاظت اور غور بھی مراد ہوتا ہے، جبکہ رؤیت اس سے خاص ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15762} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15763} دیکھے جانے والے شخص کے اعتبار سے احکام مختلف ہیں۔ جوان اجنبی عورت کے چہرے اور ہاتھوں کے علاوہ بدن کو دیکھنا بالاتفاق حرام ہے، جبکہ چہرے اور ہاتھوں کے بارے میں چار اقوال ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15763} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15767} شہوت کے ساتھ دیکھنا ہر صورت حرام ہے، اور محرموں کی زینت کی جگہوں کو بغیر شہوت دیکھنا جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15769} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15770} حاجت (نکاح کی پیشکش، علاج، فیصلہ، گواہی، لین دین اور تعلیم) کے لیے بقدرِ ضرورت دیکھنے کی اجازت ہے، اور بے ارادہ پہلی نظر معاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15788}"
