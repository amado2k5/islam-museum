id: concept/kaff-al-nafs
class: concept
kind: legal
label:
  ar: "كَفُّ النَّفْس"
  en: "Restraining the self (kaff al-nafs)"
  ur: "نفس کو روکنا (کفّ النفس)"
summary:
  ar: "كف النفس عند الأصوليين الانتهاء عن المنهي عنه، وهو فعل يتعلق به التكليف، فلا تكليف بالنهي قبل إقبال النفس على الفعل المنهي عنه. وترتب الثواب على الكف عن المنهي عنه، ويشترط بعضهم أن يكون الكف بقصد الامتثال. والترك أعم منه لأنه يشمل المأمور والمنهي والحقوق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13406} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13407} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13408}"
  en: "In the terminology of the usulis, restraining the self is ceasing from what is forbidden. It is an act that the law can address, so a prohibition presupposes that the soul is inclined to the forbidden act; a prohibition cannot be addressed before the soul desires it. Restraint from the forbidden earns reward, and some require that it be done with the intention of obedience. Leaving is wider, since it covers what is commanded, forbidden and rights. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13406} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13407} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13408}"
  ur: "اصولیین کے نزدیک کفّ النفس منع کی گئی چیز سے رکنا ہے، جو ایسا فعل ہے جس پر تکلیف متعلق ہو سکتی ہے؛ لہٰذا نفس کے اس فعل کی طرف مائل ہونے سے پہلے نہی کی تکلیف نہیں۔ منع کی گئی چیز سے کفّ پر ثواب ملتا ہے، اور بعض کے نزدیک اطاعت کی نیت شرط ہے۔ ترک اس سے عام ہے کیونکہ وہ امر، نہی اور حقوق سب کو شامل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13406} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13407} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13408}"
