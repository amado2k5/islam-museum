label:
  ar: "علامات الصرع بحسب الخلط"
  en: "Signs of epilepsy by humour"
  ur: "خلط کے لحاظ سے صرع کی علامات"
summary:
  ar: "علامات الصرع بحسب خلطه: البلغمي ريق زبدي غليظ وبول كالزجاج الذائب وجبن وكسل؛ والسوداوي قيء سوداوي وطباع مائل إلى اختلاط الذهن؛ والدموي ثقل وبلادة مع حمرة العين أو درور الأوداج؛ والصفراوي أشدّ تأذياً وأقصر مدة {cite:canon-ibn-sina-print-v2 p.123} {cite:canon-ibn-sina-print-v2 p.124}"
  en: "The signs of epilepsy by its humour: phlegmatic — frothy thick saliva, urine like molten glass, cowardice and laziness; melancholic — black vomit and a temper inclining to confusion; sanguine — heaviness and dullness with redness of the eye or throbbing jugulars; bilious — sharpest suffering and shortest duration {cite:canon-ibn-sina-print-v2 p.123} {cite:canon-ibn-sina-print-v2 p.124}"
  ur: "اپنے خلط کے لحاظ سے صرع کی علامات: بلغمی — زبدی گاڑھا رال اور پگھلے شیشے جیسا پیشاب، بزدلی اور سستی؛ سوداوی — سوداوی قے اور ذہن کے اختلاط کی طرف مائل طبع؛ دموی — آنکھ کی سرخی یا اوداج کے درور کے ساتھ گرانی اور بلادت؛ صفراوی — سب سے سخت تکلیف اور مختصر ترین مدت {cite:canon-ibn-sina-print-v2 p.123} {cite:canon-ibn-sina-print-v2 p.124}۔"
