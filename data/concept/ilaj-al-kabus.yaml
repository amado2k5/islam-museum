id: concept/ilaj-al-kabus
class: concept
kind: scientific
label:
  ar: "علاج الكابوس"
  en: "Treatment of al-kabus"
  ur: "کابوس کا علاج"
  es: "Tratamiento de al-kabus"
summary:
  ar: "يذكر ابن سينا أن علاج الكابوس الاستفراغ بما يخرج كل خلط، ثم تقوية الرأس بالقانون الكلي، وأن لا يطول الكلام فيه لما تقدم؛ ولا تُنقل الوصفات ولا المقادير {cite:canon-ibn-sina-print-v2 p.118}"
  en: "Ibn Sina says the treatment of al-kabus is evacuation by what brings out each humour, then strengthening the head by the general rule, and that the discussion need not be long, for what came before suffices; recipes and quantities are not reproduced {cite:canon-ibn-sina-print-v2 p.118}"
  ur: "ابن سینا کہتا ہے کہ کابوس کا علاج ہر خلط کو نکالنے والی شے سے استفراغ ہے، پھر عام قانون کے مطابق سر کو قوت دینا، اور یہ کہ اس میں بات لمبی نہ کی جائے کیونکہ گزشتہ کافی ہے؛ نسخے اور مقداریں نقل نہیں کی گئیں {cite:canon-ibn-sina-print-v2 p.118}۔"
  es: "Ibn Sina afirma que el tratamiento de al-kabus consiste en la evacuación según lo que expulsa cada humor, para luego fortalecer la cabeza con la regla general, y que la discusión no necesita ser larga, pues lo anterior es suficiente; no se reproducen recetas ni cantidades {cite:canon-ibn-sina-print-v2 p.118}."
