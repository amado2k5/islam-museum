id: concept/zij-sabi-chord-of-one-degree-by-interpolation
class: concept
kind: scientific
label: { ar: "وتر الجزء الواحد بالتقريب عند البتاني", en: "The chord of one degree by approximation in al-Battani", ur: "البتانی کے ہاں ایک درجے کے وتر کا تقریبی استخراج", es: "La cuerda de un grado por aproximación en al-Battani", fr: "La corde d'un degré par approximation dans al-Battani" }
summary:
  ar: "يقرر البتاني أن بعض الأوتار، كوتر الجزء الواحد وما يتضاعف منه، لا يمكن استخراجه بالحساب على طريق البرهان كما تستخرج الأوتار الأخرى، لكنه يعلم بالبرهان أن نسبة وتر القوس الصغرى إلى قوسها أعظم من نسبة وتر القوس العظمى إلى قوسها، فيستعين بوتري الجزء والنصف والنصف والربع المعلومين، ويأخذ وتر الثلاثة الأرباع ويزيد عليه ثلثه ليجعله وتر الجزء الواحد. {cite:zij-sabi-nallino-byblion p.18}."
  en: "Al-Battani states that some chords, such as that of one degree and its multiples, cannot be derived by calculation along the road of proof as the others are, but it is known by proof that the ratio of the chord of a smaller arc to its arc is greater than that of a larger arc, so he relies on the known chords of a degree and a half and of a half and a quarter, and takes the chord of three quarters of a degree and adds a third of it to make the chord of one degree. {cite:zij-sabi-nallino-byblion p.18}."
  ur: "البتانی طے کرتے ہیں کہ بعض اوتار، جیسے ایک درجے کا وتر اور اس کے اضعاف، دوسرے اوتار کی طرح برہانی حساب سے نہیں نکالے جا سکتے، لیکن برہان سے معلوم ہے کہ چھوٹی قوس کے وتر کی اپنی قوس سے نسبت بڑی قوس کے وتر کی اپنی قوس سے نسبت سے زیادہ ہے؛ چنانچہ وہ ڈیڑھ درجے اور سوا درجے کے معلوم اوتار سے مدد لیتے ہیں، تین چوتھائی درجے کا وتر لے کر اس میں اس کا تہائی جوڑ دیتے ہیں اور اسے ایک درجے کا وتر بناتے ہیں۔ {cite:zij-sabi-nallino-byblion p.18}۔"
  es: "Al-Battani afirma que algunas cuerdas, como la de un grado y sus múltiplos, no pueden derivarse mediante cálculo siguiendo el mismo procedimiento que las demás, pero se sabe por demostración que la razón entre la cuerda de un arco menor y su arco es mayor que la de un arco mayor. Por lo tanto, se basa en las cuerdas conocidas de un grado y medio y de un grado y medio y un cuarto, y toma la cuerda de tres cuartos de grado y le suma un tercio para obtener la cuerda de un grado. {cite:zij-sabi-nallino-byblion p.18}."
  fr: "Al-Battani affirme que certaines cordes, comme celle d'un degré et ses multiples, ne peuvent être obtenues par le calcul selon la méthode de la démonstration classique. Cependant, il est établi que le rapport de la corde d'un arc plus petit à son arc est supérieur à celui d'un arc plus grand. Il s'appuie donc sur les cordes connues d'un degré et demi et d'un demi-quart, et prend la corde de trois quarts de degré à laquelle il ajoute un tiers pour obtenir la corde d'un degré. {cite:zij-sabi-nallino-byblion p.18}."
