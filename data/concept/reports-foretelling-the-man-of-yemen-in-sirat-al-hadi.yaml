id: concept/reports-foretelling-the-man-of-yemen-in-sirat-al-hadi
class: concept
kind: doctrine
label:
  ar: أخبار «صاحب اليمن» في مقدمة سيرة الهادي
  en: The reports of "the man of Yemen" in the preface of Sirat al-Hadi
  ur: سیرت الہادی کے مقدمے میں «صاحب یمن» کی روایات
summary:
  ar: تجمع المقدمة أخباراً وأبياتاً منسوبة إلى علي ومحمد الباقر وغيرهما، تذكر خروج رجل من أهل البيت في اليمن بعد سنة 280هـ، ثم يستدل الرواة بها على الهادي بعد أن بحثوا فيمن خرج قبله ولم يجدوا فيه الصفات.
  en: The preface gathers reports and verses attributed to Ali, Muhammad al-Baqir and others that foretell the rising of a man of the Prophet's family in Yemen after 280 AH, and the narrators then point to al-Hadi, after saying they looked at those who had risen before him and found the qualities in none.
  ur: مقدمہ علی، محمد باقر وغیرہ سے منسوب روایات اور اشعار جمع کرتا ہے جو 280ھ کے بعد یمن میں اہل بیت کے ایک شخص کے خروج کی خبر دیتے ہیں، اور راوی پھر ہادی کی طرف اشارہ کرتے ہیں، یہ کہنے کے بعد کہ انہوں نے ان سے پہلے اٹھنے والوں کو دیکھا اور کسی میں یہ صفات نہ پائیں۔
