id: concept/zij-sabi-moon-eclipse-latitude-change-between-moments
class: concept
kind: scientific
label: { ar: "تغير عرض القمر بين أزمنة الكسوف", en: "The change of the Moon's latitude between the moments", ur: "لمحات کے درمیان چاند کے عرض کی تبدیلی", es: "El cambio de la latitud de la Luna entre los momentos", fr: "Le changement de latitude de la Lune entre les moments" }
summary:
  ar: "يُضاف إلى زمن السقوط نصف سدسه، ثم يُنقص من حركة العرض لوقت الاستقبال، فيُعرف عرض القمر لبدء الكسوف المطلق؛ ثم تُزاد الدقائق نفسها مع نصف سدسها على حركة العرض ليُعرف عرضه لتمام الانجلاء المطلق. والعمل بين الزمنين هو تعديل مقدار العرض بالسير الحقيقي للقمر. {cite:zij-sabi-nallino-byblion pp.152-153}"
  en: "A half-sixth of the fall minutes is added to them and the result subtracted from the latitude motion at the time of opposition, giving the Moon's latitude at the absolute start of the eclipse. The same minutes with a half-sixth added are then placed on the latitude motion to give the latitude at the absolute end. The procedure adjusts the latitude across the two moments. {cite:zij-sabi-nallino-byblion pp.152-153}"
  ur: "سقوط کے دقائق میں ان کا نصف سدس جمع کیا جاتا ہے، پھر یہ حاصل مقابلے کے وقت کی عرض کی حرکت میں سے گھٹایا جاتا ہے، تو مطلق آغاز پر چاند کا عرض معلوم ہوتا ہے۔ اسی دقائق کو نصف سدس کے ساتھ عرض کی حرکت پر رکھ کر مطلق اختتام کا عرض ملتا ہے۔ یہ طریقہ دو لمحات کے درمیان عرض کی تصحیح ہے۔ {cite:zij-sabi-nallino-byblion pp.152-153}"
  es: "Se les suma medio sexto de los minutos de caída y el resultado se resta del movimiento de latitud en el momento de la oposición, obteniendo así la latitud de la Luna al inicio absoluto del eclipse. Los mismos minutos, con medio sexto añadido, se aplican al movimiento de latitud para obtener la latitud al final absoluto. Este procedimiento ajusta la latitud en ambos momentos. {cite:zij-sabi-nallino-byblion pp.152-153}"
  fr: "On ajoute un demi-sixième aux minutes de la chute et on soustrait le résultat du mouvement de latitude au moment de l'opposition, ce qui donne la latitude de la Lune au début absolu de l'éclipse. On ajoute ensuite ces mêmes minutes, auxquelles on a ajouté un demi-sixième, au mouvement de latitude pour obtenir la latitude à la fin absolue de l'éclipse. Cette procédure permet de corriger la latitude entre ces deux instants. {cite:zij-sabi-nallino-byblion pp.152-153}"
