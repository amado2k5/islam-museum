id: concept/canon-thick-clear-urine-and-thin-dyed-urine
class: concept
kind: scientific
label: { ar: "البول الغليظ المشف والرقيق المصبوغ عند ابن سينا", en: "Thick clear urine and thin dyed urine in the Canon", ur: "گاڑھا شفاف اور پتلا رنگین پیشاب قانون میں", es: "Orina espesa y transparente y orina diluida teñida en el cañón", fr: "Urine épaisse et claire et urine fine et colorée dans le Canon" }
summary:
  ar: "يفرق ابن سينا بين الغليظ المشف والرقيق بحركة الموج والزبد، ويبين أن الرقيق الكثير الصبغ ليس صبغه من نضج بل من اختلاط المرة، وأن النضج يظهر في القوام قبل اللون {cite:canon-ibn-sina-print-v1 p.190}."
  en: "Ibn Sina tells thick clear urine from thin by the motion of its waves and its froth, and says a thin urine heavily dyed owes the dye not to ripening but to a mixing of bile, since ripening shows in consistency before colour {cite:canon-ibn-sina-print-v1 p.190}."
  es: "Ibn Sina distingue la orina espesa y clara de la diluida por el movimiento de sus ondas y su espuma, y dice que una orina diluida muy teñida debe el tinte no a la maduración sino a una mezcla de bilis, ya que la maduración se muestra en la consistencia antes que en el color {cite:canon-ibn-sina-print-v1 p.190}."
  fr: "Ibn Sina distingue l'urine épaisse et claire de l'urine fine par le mouvement de ses vagues et de son écume, et dit qu'une urine fine fortement colorée doit sa couleur non pas à la maturation mais à un mélange de bile, puisque la maturation se manifeste par la consistance avant la couleur {cite:canon-ibn-sina-print-v1 p.190}."
  ur: "ابن سینا اپنی لہروں اور اس کے جھاگ کی حرکت سے پتلے سے موٹے صاف پیشاب کو کہتے ہیں، اور کہتے ہیں کہ ایک پتلا پیشاب جو بہت زیادہ رنگا ہوا ہے، رنگ کے پکنے پر نہیں بلکہ پت کے اختلاط کا مرہون منت ہے، کیونکہ پکنا رنگ سے پہلے مستقل مزاجی سے ظاہر ہوتا ہے۔"
