summary:
  ar: "يفرق ابن سينا بين الغليظ المشف والرقيق بحركة الموج والزبد، ويبين أن الرقيق الكثير الصبغ ليس صبغه من نضج بل من اختلاط المرة، وأن النضج يظهر في القوام قبل اللون {cite:canon-ibn-sina-print-v1 p.190}."
  en: "Ibn Sina tells thick clear urine from thin by the motion of its waves and its froth, and says a thin urine heavily dyed owes the dye not to ripening but to a mixing of bile, since ripening shows in consistency before colour {cite:canon-ibn-sina-print-v1 p.190}."
