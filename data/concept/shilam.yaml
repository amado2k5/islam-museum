summary:
  ar: "الشيلم في الكتاب حشيشة تنبت بين الحنطة، لطيف جلاء محلل، ويطلى مع الكبريت على البهق، ويحلل الأورام والخنازير، ويطلى على القروح والقوباء، ويضمد به عرق النسا، ويسكر ويسدر، ويذكر الكتاب نقلا موسوما أن التبخير به يعين على الحبل {cite:canon-ibn-sina-print-v1 p.672}"
  en: "Shilam is in the book a herb growing among wheat, subtle, cleansing and dissolving; smeared with sulphur it is used on bahaq, it dissolves swellings and scrofula, is smeared on ulcers and ringworm, and is applied as a poultice for sciatica; it intoxicates and dazes; and the book lists, as a labelled report, that fumigation with it helps conception {cite:canon-ibn-sina-print-v1 p.672}"
  ur: "شیلم کتاب میں ایک گھاس ہے جو گندم کے بیچ اگتی ہے، لطیف، جلا دینے والی اور تحلیل کرنے والی؛ گندھک کے ساتھ بہق پر لگائی جاتی ہے، ورموں اور خنازیر کو تحلیل کرتی ہے، قرحوں اور دانوں پر لگائی جاتی ہے، اور عرق النسا پر لیپ کی جاتی ہے؛ نشہ اور سرسام کی کیفیت پیدا کرتی ہے؛ اور کتاب منقول فہرست کے طور پر درج کرتی ہے کہ اس کی دھونی حمل میں مدد دیتی ہے {cite:canon-ibn-sina-print-v1 p.672}۔"
  es: "En el libro, Shilam es una hierba que crece entre el trigo, sutil, limpiadora y disolvente; untada con azufre se usa en bahaq, disuelve hinchazones y escrófula, se aplica sobre úlceras y tiña, y se usa como cataplasma para la ciática; intoxica y aturde; y el libro enumera, como un informe etiquetado, que la fumigación con ella ayuda a la concepción {cite:canon-ibn-sina-print-v1 p.672}"
  fr: "Le Shilam est décrit dans le livre comme une herbe poussant parmi les blés, subtile, purifiante et dissolvante; enduite de soufre, elle est utilisée contre la bahaq, dissout les gonflements et la scrofule, est appliquée sur les ulcères et la teigne, et sert de cataplasme pour la sciatique; elle enivre et étourdit; et le livre mentionne, sous forme de rapport, que la fumigation avec cette plante favorise la conception {cite:canon-ibn-sina-print-v1 p.672}"
  tr: "Kitapta shalem, buğday arasında yetişen, nazik ve tükenmiş, vitiligo üzerinde kükürtle kaplı, tümörleri ve domuzları çözen, ülser ve herpes'i kapatan, siyatik sarkar, sarhoş edici ve yatıştıran bir ottur ve kitapta buharlaştırmanın ipi yardımcı olduğu başlıklı bir alıntıda belirtilir {cite:canon-ibn-sina-print-v1 s.672}"
  id: "Dalam buku ini, shalem adalah rumput yang tumbuh di antara gandum, lembut dan menipis, dilapisi belerang pada vitiligo, melarutkan tumor dan babi, melapisi tukak lambung dan herpes, melapisi sciatica, memabukkan dan menenangkan, dan buku ini menyebutkan dalam kutipan berjudul bahwa menguapkannya membantu tali {cite:canon-ibn-sina-print-v1 hlm.672}"
