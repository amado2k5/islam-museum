label:
  ar: "اللَّحْم"
  en: "Meat (lahm), fiqh rulings"
  ur: "گوشت (فقہی احکام)"
summary:
  ar: "اللحم في اللغة واللَّحَم لغتان، وهو من جسم الحيوان والطير الجزء العضلي الرخو بين الجلد والعظم، ولحم كل شيء لُبّه؛ وجمعه ألحم ومحوم ولحام ولحمان {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13579}. والطعام أعم منه، لأنه كل ما يؤكل {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13579}."
  en: "Lahm, in lexicon, is the flesh of an animal or bird, the soft muscular part between the skin and the bone; the core of anything is also its lahm; its plurals are luhum, lihām and lahman. Taʿam, food, is wider, since it is anything eaten {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13579}."
  ur: "لحم لغت میں جانور یا پرندے کا وہ نرم عضلاتی حصہ ہے جو کھال اور ہڈی کے درمیان ہوتا ہے، اور ہر چیز کا گودا بھی اس کا لحم کہلاتا ہے؛ جمع لُحوم، لِحام اور لُحمان ہے۔ طعام اس سے عام ہے، کیونکہ ہر کھانے کی چیز طعام ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13579}۔"
