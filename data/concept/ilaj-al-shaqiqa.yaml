id: concept/ilaj-al-shaqiqa
class: concept
kind: scientific
label:
  ar: "علاج الشقيقة"
  en: "Treatment of migraine"
  ur: "شقیقہ کا علاج"
  es: "Tratamiento de la migraña"
  fr: "Traitement de la migraine"
  tr: "Migren tedavisi"
  id: "Pengobatan migrain"
summary:
  ar: "يذكر ابن سينا مبدأ علاج الشقيقة بالاستفراغ على نحو ما في البيضة، وتدبير ذات الدور وتبديل المزاج بعد التنقية، وأن المزمن بارد يحتاج إلى التحليل وما يسخّن بقوة؛ ولا تُنقل الوصفات ولا طرق الاستعمال {cite:canon-ibn-sina-print-v2 p.74} {cite:canon-ibn-sina-print-v2 p.75}"
  en: "Ibn Sina gives the principle of treating migraine as evacuation, as for the bayda, the management of the periodic kind with a change of temperament after cleansing, and that the long-standing kind is cold and needs dissolving and strong warming; recipes and methods of application are not reproduced {cite:canon-ibn-sina-print-v2 p.74} {cite:canon-ibn-sina-print-v2 p.75}"
  ur: "ابن سینا شقیقہ کے علاج کا اصول استفراغ بتاتا ہے جیسا بیضہ میں ہے، باری والی قسم کی تدبیر اور صفائی کے بعد مزاج بدلنا، اور یہ کہ پرانی قسم ٹھنڈی ہے اور اسے تحلیل اور قوت سے گرم کرنے کی حاجت ہے؛ نسخے اور استعمال کے طریقے نقل نہیں کیے گئے {cite:canon-ibn-sina-print-v2 p.74} {cite:canon-ibn-sina-print-v2 p.75}۔"
  es: "Ibn Sina da el principio de tratar la migraña como una evacuación, en cuanto a la bayda, el manejo del tipo periódico con un cambio de temperamento después de la limpieza, y que el tipo crónico es frío y necesita disolución y un fuerte calentamiento; las recetas y métodos de aplicación no se reproducen {cite:canon-ibn-sina-print-v2 p.74} {cite:canon-ibn-sina-print-v2 p.75}"
  fr: "Ibn Sina donne comme principe le traitement de la migraine par l'évacuation, et pour la bayda, la prise en charge de la forme périodique avec un changement d'humeur après purification, tandis que la forme chronique est froide et nécessite une dissolution et un réchauffement intense; les recettes et les modes d'application ne sont pas reproduits. {cite:canon-ibn-sina-print-v2 p.74} {cite:canon-ibn-sina-print-v2 p.75}"
  tr: "İbn Sina, migrenin bir şekilde yumurtaya kusması, kendi işlevlerini yönetmesi ve arıtmadan sonra ruh halinin değişmesi ilkesinden bahseder; kronik soğuk algınlığının analiz gerektirdiğini ve güçlü ısındığını belirtir; ne tarifler ne de kullanım yöntemleri aktarılmaz; {cite:canon-ibn-sina-print-v2 s.74} {cite:canon-ibn-sina-print-v2 s.75}"
  id: "Ibn Sina menyebutkan prinsip mengobati migrain dengan cara muntah ke dalam telur, mengelola fungsinya sendiri, dan mengubah suasana hati setelah pemurnian, dan bahwa flu kronis memerlukan analisis dan sangat dipanaskan; baik resep maupun metode penggunaan tidak ditransmisikan {cite:canon-ibn-sina-print-v2 hlm.74} {cite:canon-ibn-sina-print-v2 hlm.75}"
