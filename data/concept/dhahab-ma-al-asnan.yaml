id: concept/dhahab-ma-al-asnan
class: concept
kind: scientific
label:
  ar: ذهاب ماء الأسنان
  en: The loss of the teeth's moisture
  ur: دانتوں کی رطوبت کا جانا
summary:
  ar: ذهاب ماء الأسنان أن تكون السن لا تحتمل شيئاً بارداً أو حاراً أو صلباً وأكثره من برد وهو مقدمة لوجع الأسنان، فإن كان السبب برداً استعمل ما وصف من هذا الجنس والتكميد الدائم بما وصف فإن لم يسكن دلك بما وصف من القوي وإن كان السبب مزاجاً حاراً وهو قليل يدل عليه لون اللثة وملمسها وملمس الأسنان وجب أن يدام تمريخها بما وصف من المبررات ويستعمل عليه لعاب ما وصف ومضغ ما وصف ⁦(الأسماء مطروحة)⁩ {cite:canon-ibn-sina-print-v2 p.278-279}
  en: The teeth's moisture going means the tooth cannot bear anything cold, hot or hard; it comes mostly from cold and is a prelude to toothache. If the cause is cold, what he described of this kind is used with constant compressing by what he described; if that does not calm it, it is rubbed with the strong things he described; if the cause is a hot temperament — which is rare, told by the gum's colour and feel and the teeth's feel — they are kept anointed with the cooling things he described, and the mucilage and chew of this kind are used on it (names left out) {cite:canon-ibn-sina-print-v2 p.278-279}
  ur: دانتوں کی رطوبت کا جانا یہ ہے کہ دانت کچھ سرد، گرم یا سخت برداشت نہ کرے؛ یہ اکثر سرد سے ہوتا ہے اور دانت کے درد کی پیش بندی ہے؛ سبب سرد ہو تو اسی جنس کی اس کی بیان کردہ چیزیں اور اس کے بتائے مستقل سیک استعمال ہوں، سکون نہ پائے تو اس کی بیان کردہ قوی چیزوں سے مالش؛ اور سبب گرم مزاج ہو — جو کم ہے اور مسوڑھے کے رنگ اور مس اور دانتوں کے مس سے پہچانا جاتا ہے — تو اس کی بیان کردہ ٹھنڈی چیزوں سے مسلسل ملنا چاہیے اور اسی جنس کا لعاب اور چبائی جانے والی چیز استعمال ہو ⁦(نام مطروح)⁩ {cite:canon-ibn-sina-print-v2 p.278-279}
