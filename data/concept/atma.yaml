label: { ar: "الأطمة", en: "Atma (fire-spring)" }
summary:
  ar: "عين النار التي تنبع من الأرض عند المسعودي، ومن آطام الأرض أطمة صقلية المعروفة بألبركان، وأطمة وادي برهوت من بلاد حضرموت والشحر، وأطمة بلاد الزابج من بحر الصين، وأطمة بلاد أسك بين فارس والأهواز من أعمال أرجان ترى نارها من نحو عشرين فرسخاً، وأطمة النومان ببلاد ماسبدان تظهر النار من وسط مائها ولا يطفئها ورود الماء وهي من عجائب العالم {cite:muruj-al-dhahab p. 357-358}."
  en: "al-Mas'udi's term for a spring of fire rising from the earth — Sicily's al-Burkan, Wadi Barhut in Hadramawt, the vents of Zabaj and Ask near Arrajan, and the burning water of Nu'man in Masabadhan, one of the world's wonders {cite:muruj-al-dhahab p. 357-358}."
