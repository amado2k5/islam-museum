label:
  ar: "الأطمة"
  en: "Atma (fire-spring)"
  fr: "Atma (source de feu)"
  es: "Atma (manantial de fuego)"
  ur: "آتما ⁦(آگ کا چشمہ)⁩"
  tr: "Al-Atma"
  id: "Al-Atma"
summary:
  ar: "عين النار التي تنبع من الأرض عند المسعودي، ومن آطام الأرض أطمة صقلية المعروفة بألبركان، وأطمة وادي برهوت من بلاد حضرموت والشحر، وأطمة بلاد الزابج من بحر الصين، وأطمة بلاد أسك بين فارس والأهواز من أعمال أرجان ترى نارها من نحو عشرين فرسخاً، وأطمة النومان ببلاد ماسبدان تظهر النار من وسط مائها ولا يطفئها ورود الماء وهي من عجائب العالم {cite:muruj-al-dhahab p. 357-358}."
  en: "al-Mas'udi's term for a spring of fire rising from the earth — Sicily's al-Burkan, Wadi Barhut in Hadramawt, the vents of Zabaj and Ask near Arrajan, and the burning water of Nu'man in Masabadhan, one of the world's wonders {cite:muruj-al-dhahab p. 357-358}."
  fr: "Terme d’al-Mas'udi pour une source de feu jaillissant de la terre — al-Burkan en Sicile, le Wadi Barhut au Hadramawt, les bouches de Zabaj et d’Ask près d’Arrajan, et l’eau brûlante de Nu'man au Masabadhan, une des merveilles du monde {cite:muruj-al-dhahab p. 357-358}."
  es: "El término que usaba al-Mas'udi para referirse a un manantial de fuego que brota de la tierra: al-Burkan en Sicilia, Wadi Barhut en Hadramawt, las fumarolas de Zabaj y Ask cerca de Arrajan, y el agua ardiente de Nu'man en Masabadhan, una de las maravillas del mundo {cite:muruj-al-dhahab p. 357-358}."
  ur: "زمین سے نکلنے والے آگ کے چشمے کے لیے المسعودی کی اصطلاح - سسلی کا البرکان، حضرموت میں وادی برہوت، اراجان کے قریب زباج اور اسک کے سوراخ، اور مسابدان میں نعمان کا جلتا ہوا پانی، دنیا کے عجائبات میں سے ایک ہے۔ 357-358}۔"
  tr: "Al-Mas'udi'ye göre topraktan doğan Ateş Pınarı, yeryüzünün kaynakları arasında Sicilya'nın Atama'sı (Al-Burkan), Hadramaut ve Al-Shahr topraklarından Barhut Vadisi'nin Atama'sı, Çin Denizi'nin Zabaj bölgesinin Atma'sı, Arjan bölgeleri arasında Fars ile Ahvaz arasında bulunan Ask Atma'sı (ateşi yaklaşık yirmi farsakh'tan görülür) ve Masbadan topraklarındaki Numanların Atma'sı bulunur; burada ateş suyun ortasından çıkar ve su gülleri tarafından sönmez; bu dünyanın harikalarından biridir {atıf:muruj-al-dhahab s. 357-358}"
  id: "Mata Air Api, yang berasal dari bumi menurut Al-Mas'udi, dan di antara sumber bumi adalah Atama dari Sisilia, yang dikenal sebagai Al-Burkan, Atama dari Lembah Barhut dari tanah Hadramaut dan Al-Shahr, Atma dari wilayah Zabaj di Laut Cina, Atma Ask, antara Persia dan Ahvaz, di antara wilayah Arjan, yang apinya terlihat dari sekitar dua puluh farsakh, dan Atma orang Numan di tanah Masbadan, di mana api muncul dari tengah airnya dan tidak dipadamkan oleh mawar air, yang merupakan salah satu keajaiban dunia {cite:muruj-al-dhahab hlm. 357-358}."
