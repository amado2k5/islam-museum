summary:
  ar: "يذكر ابن سينا أن من العلامات ما يدل في ظاهر الأعضاء، وهي مأخوذة إما من المحسوسات الخاصة كاللون واللمس، وإما من المحسوسات المشتركة كخلق الأعضاء وأوضاعها وحركاتها، وقد تدل على أحوال باطنة {cite:canon-ibn-sina-print-v1 p.155}."
  en: "Ibn Sina says some signs show on the outside of the organs, taken either from the special sensibles such as colour and touch, or from the common sensibles such as the make, position and movement of the organs, and they may point to inner states {cite:canon-ibn-sina-print-v1 p.155}."
