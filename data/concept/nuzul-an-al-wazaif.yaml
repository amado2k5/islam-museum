id: concept/nuzul-an-al-wazaif
class: concept
kind: legal
label:
  ar: "الاعتياض عن الحقوق المجردة والنزول عن الوظائف بمال"
  en: "Compensation for bare rights and giving up posts for money"
  ur: "مجرد حقوق کا عوض اور مال کے بدلے وظائف سے دست برداری"
term: { ar: "النُّزول عن الوظائف، الاعتياض عن الحقوق المجرّدة", en: "nuzul an al-wazaif, i'tiyad an al-huquq al-mujarrada" }
summary:
  ar: "الحقوق المجردة، كحق الشفعة وحق الزوجة في القسم، لا يجوز في أصل المذهب الحنفي أخذ العوض عنها، ومقتضى ذلك منع أخذ المال على النزول عن وظائف الأوقاف كالإمامة والخطابة. يذكر ابن عابدين في رد المحتار أن كثيرين أفتوا بجواز النزول عن الوظائف بمال اعتباراً للعرف، ويرى أن الجواز يقوم على نظائر في المذهب، وأن المسألة ظنية، والأولى أن يكون بعدها إبراء عام. {cite:radd-al-muhtar-bulaq-v4 p.21} {cite:radd-al-muhtar-bulaq-v4 p.22}"
  en: "In the basic Hanafi doctrine no compensation may be taken for bare rights, such as the right of pre-emption or a wife's right to her turn, which implies that money may not be taken for giving up waqf posts such as imam or preacher. Ibn Abidin in Radd al-Muhtar reports that many gave fatwa permitting the giving up of posts for money on the strength of custom, holds that permission rests on parallels within the school, that the question is a matter of probable judgement, and that it is better to follow it with a general release."
  ur: "اصل حنفی مذہب میں مجرد حقوق، جیسے حقِ شفعہ یا بیوی کا باری کا حق، کا عوض لینا جائز نہیں، جس کا تقاضا یہ ہے کہ اوقاف کے وظائف، جیسے امامت اور خطابت، سے دست برداری پر مال نہ لیا جائے۔ ابن عابدین رد المحتار میں بتاتے ہیں کہ بہت سوں نے عرف کی بنا پر مال کے بدلے وظائف سے دست برداری کے جواز کا فتویٰ دیا، ان کی رائے میں جواز مذہب کے نظائر پر قائم ہے، مسئلہ ظنی ہے، اور بہتر ہے کہ اس کے بعد ابراءِ عام ہو۔"
