- tradition: sunni-hanafi
  id: aqida-tahawiyya
  stance:
    ar: الإيمان إقرار باللسان وتصديق بالجَنان
    en: Iman is affirmation by the tongue and assent of the heart
  summary:
    ar: يقول أبو جعفر الطحاوي في عقيدته التي نسبها إلى أبي حنيفة وأبي يوسف ومحمد بن الحسن إن الإيمان «هو الإقرار باللسان، والتصديق بالجَنان»، وإنه واحد وأهله في أصله سواء، يتفاضلون بالخشية والتقى.
    en: Abu Ja'far al-Tahawi, in the creed he attributes to Abu Hanifa, Abu Yusuf and Muhammad ibn al-Hasan, says iman is "affirmation by the tongue and assent of the heart", that it is one and its people
      are equal in its root, differing in fear of God and piety.
