  id: aqida-wasitiyya
  stance:
    ar: الإيمان قول وعمل، قول القلب واللسان وعمل القلب واللسان والجوارح، يزيد بالطاعة وينقص بالمعصية
    en: 'Iman is speech and action: speech of the heart and tongue and action of the heart, tongue and limbs; it increases with obedience and decreases with disobedience'
  summary:
    ar: 'يقول ابن تيمية في العقيدة الواسطية إن من أصول أهل السنة «أن الدين والإيمان قول وعمل: قول القلب واللسان، وعمل القلب واللسان والجوارح، وأن الإيمان يزيد بالطاعة وينقص بالمعصية»، ولا يسلب الفاسق من
      أهل الملة الإيمان بالكلية ولا يخلّده في النار، بل هو «مؤمن ناقص الإيمان».'
    en: Ibn Taymiyya says in al-Wasitiyya that among the principles of Ahl al-Sunna is that religion and iman are speech and action, speech of the heart and tongue and action of the heart, tongue and limbs,
      increasing with obedience and decreasing with disobedience; the sinner of the community is not stripped of iman entirely nor made to stay in the Fire forever, but is a believer deficient in iman.
  holders:
