- tradition: sunni-hanbali
  id: ibn-rajab-jami
  stance:
    ar: الإسلام المطلق يتضمن الإيمان كله، والتصديق القائم بالقلوب متفاضل، ويُنفى اسم الإيمان عمن ترك بعض واجباته
    en: Islam unqualified includes all of iman; the hearts' assent varies in degree, and the name iman is denied of one who abandons some of its duties
  summary:
    ar: 'يفصّل ابن رجب في شرح حديث جبريل أن اسم الإسلام إذا أُطلق أو اقترن به المدح دخل فيه الإيمان كله من التصديق وغيره، وأن اسم الإيمان يُنفى عمّن ترك شيئاً من واجباته — كما في حديث «لا يزني الزاني حين يزني وهو مؤمن» — بخلاف اسم الإسلام الذي لا ينتفي إلا بما ينافيه بالكلية؛ وأن التصديق القائم بالقلوب متفاضل، وهو ما يختاره ويعزوه إلى أصح الروايتين عن أحمد؛ ويذكر أن الاختلاف في مسمى الإيمان أول خلاف وقع في الأمة: خلاف الخوارج للصحابة ثم المعتزلة بالمنزلة بين المنزلتين ثم المرجئة في الفاسق مؤمناً كاملاً؛ ويقرر في شرح حديث «بني الإسلام على خمس» أن الإيمان بالله ورسوله داخل في ضمن الإسلام؛ ويبين في شرح حديث «لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه» أن المراد بنفي الإيمان نفي بلوغ حقيقته ونهايته، فإنه يُنفى كثيراً لانتفاء بعض أركانه وواجباته، وأن مرتكب الصغائر لا يزول عنه اسم الإيمان بالكلية.'
    en: In his commentary on the Jibril hadith Ibn Rajab explains that when islam is named alone, or coupled with praise, it includes all of iman — assent and more — while the name iman is denied of one who abandons some of its duties, as in the hadith "the adulterer is not a believer while he commits adultery", unlike the name islam which lapses only through what negates it entirely; that the hearts' assent varies in degree, the position he chooses and attributes to the sounder of Ahmad's two reports; and that the dispute over the meaning of iman was the first dispute in the community — the Khawarij against the Companions, then the Mu'tazila's intermediate rank, then the Murji'a's complete believer despite grave sin; in his commentary on "Islam is built on five" he states that iman in God and His Messenger is included within islam; and in his commentary on "none of you believes until he loves for his brother what he loves for himself" he clarifies that the negation of iman is of attaining its reality and perfection, iman being often negated for the absence of some pillars and duties, while the name is never wholly stripped for lesser sins.
