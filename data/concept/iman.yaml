- tradition: sunni-hanafi
  id: ibn-abi-al-izz
  stance:
    ar: الاختلاف بين أبي حنيفة وبقية أئمة أهل السنة في الإيمان اختلاف صوري، ونزاع لفظي لا يترتب عليه فساد اعتقاد
    en: The difference between Abu Hanifa and the other imams of Ahl al-Sunna on iman is formal, a verbal dispute from which no corruption of belief follows
  summary:
    ar: 'يعرض ابن أبي العز الحنفي في شرح الطحاوية أقوال الناس في الإيمان: قول جمهور السلف أنه تصديق بالجنان وإقرار باللسان وعمل بالأركان، وقول كثير من الحنفية كالطحاوي أنه الإقرار باللسان والتصديق بالجنان، ثم يقول إن الاختلاف بين أبي حنيفة والأئمة الباقين من أهل السنة اختلاف صوري، إذ يتفقون على أن مرتكب الكبيرة لا يخرج من الإيمان، فهو «نزاع لفظي لا يترتب عليه فساد اعتقاد».'
    en: 'Ibn Abi al-Izz al-Hanafi sets out in his commentary on the Tahawi creed the positions on iman: the majority of the early generations that it is assent of the heart, affirmation of the tongue and action of the limbs, and many of the Hanafis, like al-Tahawi, that it is affirmation by the tongue and assent of the heart; he then says the difference between Abu Hanifa and the other imams of Ahl al-Sunna is formal, since they agree that the committer of a grave sin does not leave iman, so it is a verbal dispute from which no corruption of belief follows.'
