- tradition: sunni-ashari
  id: maqalat-ashari
  stance:
    ar: الإيمان قول وعمل يزيد وينقص، والإسلام عندهم غير الإيمان
    en: Iman is speech and action, it increases and decreases, and Islam is distinct from iman in their view
  summary:
    ar: يذكر الأشعري أن الإيمان عند أهل الحديث والسنة هو الإيمان بالله وملائكته وكتبه ورسله وبالقدر خيره وشره، وأنهم «يقرون بأن الإيمان قول وعمل، يزيد وينقص»، وأن الإسلام عندهم غير الإيمان.
    en: Al-Ash'ari reports that for the hadith scholars and Ahl al-Sunna iman is belief in God, His angels, books, messengers and the decree, good and evil; they affirm that iman is speech and action, increasing and decreasing, and that Islam is distinct from iman in their view.
