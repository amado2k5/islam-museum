id: concept/iman
education:
  did_you_know:
    ar: "حدّد حديث جبريل أركان الإيمان: الإيمان بالله وملائكته وكتبه ورسله واليوم الآخر والقدر خيره وشره."
    en: "The Gabriel hadith defines the pillars of faith: belief in God, His angels, His books, His messengers, the Last Day, and divine decree, its good and its ill."
    ur: "حدیث جبرائیل ایمان کے ارکان بیان کرتی ہے: اللہ، اس کے فرشتے، کتابیں، رسول، روزِ آخرت اور تقدیرِ خیر و شر پر ایمان۔"
    sources: [source/sahih-al-bukhari-bugha, source/aqida-tahawiyya]
class: concept
kind: doctrine
label:
  ar: الإيمان
  en: Iman (faith)
summary:
  ar: 'التصديق بأركان العقيدة كما بيّنها النبي في حديث جبريل: أن يؤمن الإنسان بالله وملائكته وكتابه ولقائه ورسله وبالبعث الآخر {cite:sahih-ibn-khuzayma p.1070}؛ وفي ترجمة البخاري لباب قول النبي «بني الإسلام على خمس» أن الإيمان «قول وفعل، ويزيد وينقص»، وهو موقف أهل الحديث الذي افتتح به كتاب الإيمان {cite:sahih-al-bukhari-bugha p.13}.'
  en: 'Belief in the articles of the creed as the Prophet set them out in the hadith of Jibril: belief in God, His angels, His book, meeting Him, His messengers and the resurrection {cite:sahih-ibn-khuzayma p.1070}; al-Bukhari''s chapter heading on the words "Islam is built on five" states that iman is speech and action, which increases and decreases {cite:sahih-al-bukhari-bugha p.13}.'
