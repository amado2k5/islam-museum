label:
  ar: الإيمان
  en: Iman (faith)
summary:
  ar: 'التصديق بأركان العقيدة كما بيّنها النبي في حديث جبريل: أن يؤمن الإنسان بالله وملائكته وكتبه ولقائه ورسله وبالبعث؛ وفي ترجمة البخاري لباب أمور الإيمان أنه «قول وفعل، يزيد وينقص»، وهو موقف أهل الحديث الذي افتتح به كتاب الإيمان.'
  en: 'Belief in the articles of the creed as the Prophet set them out in the hadith of Jibril: belief in God, His angels, His books, meeting Him, His messengers and the resurrection; al-Bukhari''s chapter heading on the branches of iman states
    that it is speech and action, which increases and decreases.'
