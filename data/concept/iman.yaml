- tradition: sunni-maturidi
  id: maturidi-via-ibn-abi-al-izz
  stance:
    ar: الإيمان التصديق بالقلب، والإقرار باللسان ركن زائد (كما ينقله ابن أبي العز عن الماتريدي)
    en: Iman is assent of the heart, and affirmation by the tongue is an additional pillar (as Ibn Abi al-Izz reports of al-Maturidi)
  summary:
    ar: 'ينقل ابن أبي العز أن من الحنفية «من يقول: إن الإقرار باللسان ركن زائد، ليس بأصلي، وإلى هذا ذهب أبو منصور الماتريدي»، ويذكر في حصره للأقوال أن الإيمان بالقلب وحده هو «التصديق كما قاله أبو منصور الماتريدي». وهذا نقل عن الماتريدي وليس من كتبه هو، ولم تُقرأ كتبه بعد.'
    en: Ibn Abi al-Izz reports that among the Hanafis there are those who say affirmation by the tongue is an additional pillar and not an essential one, and that this is the view of Abu Mansur al-Maturidi, and in his survey he gives iman in the heart alone as assent, as al-Maturidi said. This is a report about al-Maturidi and not from his own books, which have not yet been read.
  holders:
  - person/abu-mansur-al-maturidi
  evidence:
