    ar: الإيمان قول باللسان وعمل بالأركان وعقد بالجنان، يزيد بالطاعة وينقص بالمعصية
    en: Iman is speech of the tongue, action of the limbs and conviction of the heart; it increases with obedience and decreases with disobedience
  summary:
    ar: 'يقول ابن قدامة المقدسي في لمعة الاعتقاد: «والإيمان قول باللسان، وعمل بالأركان، وعقد بالجنان، يزيد بالطاعة، وينقص بالعصيان»، ويستدل بآية سورة البينة على أن العبادة والإخلاص والصلاة والزكاة من الدين، وبحديث «الإيمان بضع وسبعون شعبة».'
    en: Ibn Qudama al-Maqdisi says in Lum'at al-I'tiqad that iman is speech of the tongue, action of the limbs and conviction of the heart, increasing with obedience and decreasing with disobedience; he cites the verse of al-Bayyina that worship, sincerity, prayer and zakat are part of the religion, and the hadith that iman has seventy-odd branches.
