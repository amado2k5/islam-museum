id: concept/al-barzakh
class: concept
kind: belief
label:
  ar: البرزخ
  en: Al-barzakh
  fr: "Le barzakh"
  ur: برزخ
  es: "Al-barzakh"
  tr: "Kıstık"
  id: "Kıstık"
summary:
  ar: "الحاجز بين الدنيا والآخرة الذي تبقى فيه الأرواح إلى يوم يبعثون؛ فيه نعيم القبر وعذابه على ما جاء في النصوص {cite:aqida-tahawiyya} {cite:tafsir-ibn-kathir}."
  en: "The barrier between this world and the next in which souls remain until the day they are raised; in it are the grave's bliss and its punishment as the texts report {cite:aqida-tahawiyya} {cite:tafsir-ibn-kathir}."
  fr: "La barrière entre ce monde et le suivant, où demeurent les âmes jusqu’au jour de leur résurrection. Les textes y situent la félicité de la tombe et son châtiment {cite:aqida-tahawiyya} {cite:tafsir-ibn-kathir}."
  ur: "دنیا اور آخرت کے درمیان وہ حائل جہاں ارواح قیامت تک رہتے ہیں؛ اسی میں قبر کا عذاب اور نعیم ہے جیسا کہ نصوص میں آیا ہے {cite:aqida-tahawiyya} {cite:tafsir-ibn-kathir}۔"
  es: "La barrera entre este mundo y el siguiente en la que las almas permanecen hasta el día en que resucitan; en ella se encuentran la dicha de la tumba y su castigo, como informan los textos {cite:aqida-tahawiyya} {cite:tafsir-ibn-kathir}."
  tr: "Bu dünya ile ahiret arasındaki engel, ruhların dirildikleri güne kadar kaldığı yerde, {cite:aqida-tahawiyya} {cite:tafsir-ibn-kathir} metinlerinde belirtildiği gibi, mezarın mutluluğu ve cezasıdır."
  id: "Penghalang antara dunia ini dan akhirat, di mana jiwa tetap berada sampai hari mereka dibangkitkan, adalah kebahagiaan dan hukuman kubur, seperti yang dinyatakan dalam teks {cite:aqida-tahawiyya} {cite:tafsir-ibn-kathir}."
