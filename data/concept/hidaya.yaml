label:
  ar: الهداية (هداية الدلالة وهداية المعونة)
  en: Guidance (indication and help)
summary:
  ar: "يرى الشعراوي أن الهداية نوعان: هداية الدلالة، وهي التي يهدي الله بها الناس جميعاً فيدلهم على الطريق، وهداية المعونة والتيسير، وهي جائزة لمن آمن واستجاب، فيزيده الله هدى ويعينه على الطاعة. ويعرض مثل الشرطي الذي يدل السائل على الطريق، ثم يزيده العون إن شكره. ويقرأ استفهام الآية عن هداية من كفر بعد إيمانه بأنه إنكار لهداية المعونة لا لهداية الدلالة {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1597}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1598}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1599}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1601}."
  en: "Sha'rawi holds that guidance has two kinds. Guidance of indication, which God gives to all people by showing them the way, and guidance of help and ease, which is given to whoever believes and responds, so that God increases his guidance and helps him to obey. He gives the example of a policeman who points a traveller to the road and then helps him more if he is thankful. He reads the question in the verse about how God could guide those who disbelieved after believing as a denial of the guidance of help, not of indication {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1597}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1598}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1599}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1601}."
