perspectives:
- tradition: sunni
  id: sunni-sharawi-guidance
  stance:
    ar: "الهداية دلالة عامة ومعونة خاصة بالمؤمن، والداعي يدل ولا يُعين"
    en: "Guidance is general showing and a particular help for the believer; the caller shows and does not enable"
  summary:
    ar: "يذكر الشعراوي أن الهداية تأتي بمعنى الدلالة وبمعنى الإعانة، فالله هدى الناس جميعاً بالدلالة، ومن آمن به أعانه ومكّن له {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2524}. ويستدل بأن الله أثبت هداية الرسول ونفاها في آيتين، فيفسر النفي بالمعونة والإثبات بالدلالة {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2525}. ويرى أن من اكتسب الضلال لا سبيل له إلى الهداية، فالسبيل هو الممتنع وليس الهداية وحدها {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2525}. وهذا رأيه في موضع تفسيره، ولم تُعرض بعد أقوال المتكلمين في معنى الهداية من مصدر محدد (needs_source)."
    en: "Sha'rawi holds that guidance comes in the sense of showing and in the sense of enabling: God guides all people by showing, and enables those who believe in Him {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2524}. He reads two verses which deny and affirm the Prophet's guidance as denying enabling and affirming showing {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2525}. He holds that one who has earned misguidance has no path to guidance, since what is closed is the path itself and not guidance alone {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2525}. This is his view at this point; the views of the theologians on the meaning of guidance are not yet set out from a named source (needs_source)."
