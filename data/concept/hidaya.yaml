label:
  ar: "الهداية: الدلالة والمعونة"
  en: "Guidance: showing and enabling (hidaya)"
summary:
  ar: "يميّز الشعراوي بين معنيين للهداية: الدلالة، وهي بيان الطريق يعمّ الله بها الناس جميعاً، والمعونة والتمكين، وهي خاصة بمن آمن. ويمثّل لذلك بالشرطي الذي يدل المسافر على الطريق ثم يحمله على السير فيه، ويقرر أن النبي يدلّ على الحق ولا يُعين عليه، وأن إضلال الله للمنافقين جزاء ما اكتسبوه من أعمال {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2524}{cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2525}."
  en: "Sha'rawi distinguishes two senses of guidance: showing, which God extends to all people, and enabling, which is for those who believe. He illustrates this with a traffic policeman who shows a traveller the road and does not force him to take it, and holds that the Prophet shows the truth but does not enable it; and that God's misguidance of the hypocrites is the consequence of what they earned {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2524}{cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2525}."
