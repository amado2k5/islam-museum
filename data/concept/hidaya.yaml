id: concept/hidaya
class: concept
kind: doctrine
label:
  ar: الهداية ⁦(هداية الدلالة وهداية المعونة)⁩
  en: Guidance (indication and help)
  es: "Orientación (indicación y ayuda)"
  fr: "Conseils (indications et aide)"
  ur: "رہنمائی ⁦(اشارہ اور مدد)⁩"
  tr: "Rehberlik (anlam rehberliği ve yardımın yönlendirilmesi)"
  id: "Panduan (panduan makna dan panduan bantuan)"
summary:
  ar: "يرى الشعراوي أن الهداية نوعان: هداية الدلالة، وهي التي يهدي الله بها الناس جميعاً فيدلهم على الطريق، وهداية المعونة والتيسير، وهي جائزة لمن آمن واستجاب، فيزيده الله هدى ويعينه على الطاعة. ويعرض مثل الشرطي الذي يدل السائل على الطريق، ثم يزيده العون إن شكره. ويقرأ استفهام الآية عن هداية من كفر بعد إيمانه بأنه إنكار لهداية المعونة لا لهداية الدلالة {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1597}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1598}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1599}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1601}."
  en: "Sha'rawi holds that guidance has two kinds. Guidance of indication, which God gives to all people by showing them the way, and guidance of help and ease, which is given to whoever believes and responds, so that God increases his guidance and helps him to obey. He gives the example of a policeman who points a traveller to the road and then helps him more if he is thankful. He reads the question in the verse about how God could guide those who disbelieved after believing as a denial of the guidance of help, not of indication {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1597}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1598}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1599}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1601}."
  es: "Sha'rawi sostiene que la guía tiene dos tipos: la guía de indicación, que Dios da a todas las personas mostrándoles el camino, y la guía de ayuda y facilidad, que se da a quien cree y responde, de modo que Dios aumenta su guía y le ayuda a obedecer. Pone el ejemplo de un policía que señala el camino a un viajero y luego le ayuda más si este se muestra agradecido. Interpreta la pregunta del versículo sobre cómo Dios podría guiar a quienes descreyeron después de creer como una negación de la guía de ayuda, no de la de indicación {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1597}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1598}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1599}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1601}."
  fr: "Sha'rawi soutient que la guidance est de deux ordres. La guidance par l'indication, que Dieu dispense à tous les hommes en leur montrant le chemin, et la guidance par l'aide et le réconfort, accordée à celui qui croit et obéit, afin que Dieu renforce sa guidance et l'aide à suivre son appel. Il prend l'exemple d'un policier qui indique la route à un voyageur et l'aide davantage s'il le remercie. Il interprète la question posée dans le verset, à savoir comment Dieu pourrait guider ceux qui ont mécru après avoir cru, comme une négation de la guidance par l'aide, et non par l'indication."
  ur: "شعراوی کا خیال ہے کہ ہدایت کی دو قسمیں ہیں۔ اشارہ کی ہدایت، جو خدا تمام لوگوں کو راستہ دکھا کر دیتا ہے، اور مدد اور آسانی کی ہدایت، جو اس شخص کو دی جاتی ہے جو ایمان لاتا ہے اور اس پر عمل کرتا ہے، تاکہ خدا اس کی ہدایت میں اضافہ کرے اور اس کی اطاعت میں مدد کرے۔ وہ ایک پولیس والے کی مثال دیتا ہے جو ایک مسافر کو سڑک کی طرف اشارہ کرتا ہے اور پھر اگر وہ شکر ادا کرتا ہے تو اس کی مزید مدد کرتا ہے۔ اس نے آیت میں یہ سوال پڑھا کہ خدا ان لوگوں کی رہنمائی کیسے کر سکتا ہے جنہوں نے ایمان لانے کے بعد کافروں کو مدد کی ہدایت کے انکار کے طور پر ہدایت کی ہے، نہ کہ اشارہ سے۔ صفحہ 1598}{حوالہ:تفسیر-شعروی-خواطر-سکین-جلد-2 صفحہ1599}{حوالہ:تفسیر-شعروی-خواطر-اسکین-جلد-2 صفحہ 1601}۔"
  tr: "El-Şaarawi, rehberliğin iki türden olduğuna inanır: Tanrı'nın tüm insanları yola yönlendirerek yönlendirdiği rehberlik ve yardım ve kolaylaştırma rehberliği, inanan ve cevap verenlere verilen bir ödüldür; böylece Tanrı onları rehberlikte artırır ve itaatte destekler. Soru soran kişiyi yola yönlendiren ve teşekkür ederse yardımını artıran bir koşullayıcı örneği sunar. Ayetin sorgusu, yardım rehberliğinin reddi olduğuna inanan kişinin rehberliği hakkındadır; {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1597}{cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1598}{cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1599}{cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1601}{cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1601}."
  id: "Al-Shaarawi percaya bahwa bimbingan ada dua jenis: bimbingan dari petunjuk, yang Tuhan tuntun semua orang dengan membimbing mereka ke jalan, dan bimbingan bantuan serta fasilitasi, yang merupakan ganjaran bagi mereka yang percaya dan merespons, sehingga Tuhan meningkatkan mereka dalam bimbingan dan membantu mereka dalam ketaatan. Dia memberikan contoh seorang pembentuk yang membimbing penanya ke jalan, lalu meningkatkan bantuannya jika dia bersyukur. Pertanyaan ayat ini dibacakan tentang bimbingan seseorang yang tidak percaya setelah percaya bahwa itu adalah penolakan atas bimbingan bantuan, bukan panduan dari indikasi {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1597}{cite:tafsir-sharawi-khawatir-scan-vol-vol-2 hlm.1598}{cite:tafsir-sharawi-khawatir-scan-vol-vol-2 hlm.1599}{cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1601}."
