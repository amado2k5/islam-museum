issue:
  ar: "هل الهداية نوعان: دلالة عامة لكل مكلف، ومعونة خاصة بمن آمن؟"
  en: "Is guidance of two kinds, a general indication to every person and a special help to the believer?"
perspectives:
- tradition: sunni
  id: sunni-sharawi-two-kinds
  stance:
    ar: "الهداية دلالة عامة للجميع، ومعونة خاصة لمن آمن"
    en: "Guidance is a general indication to all and a particular help to the one who believes"
  summary:
    ar: "يقرر الشعراوي أن الله هدى الناس جميعاً بالدلالة، وأن المعونة لا تُعطى لمن لم يؤمن بالدلالة، ويستدل بقوله إن الذين اهتدوا زادهم هدى، وأن المعونة تقتضي فعلاً من المُعان {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1597}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1601}."
    en: "Sha'rawi holds that God has guided all people by indication, and that help is not given to one who has not believed in the indication. He draws on the verse that those who are guided are increased in guidance, and holds that help requires an act on the part of the one helped {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1597}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1601}."
