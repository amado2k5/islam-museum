summary:
  ar: "بقلة معروفة، حارة يابسة إلى الثانية، تجفف الرطوبات، وتنفع من القلاع، وقد تحدث عسر الهضم ووجع الحلق."
  en: "A well-known herb, hot and dry to the second degree; it dries humours and helps thrush, but may cause difficult digestion and throat pain."
  ur: "ایک معروف بوٹی، دوسرے درجے تک گرم اور خشک؛ رطوبتیں خشک کرتی ہے اور قلاع میں فائدہ دیتی ہے، مگر ہضم میں دشواری اور حلق میں درد پیدا کر سکتی ہے۔"
  es: "Hierba muy conocida, de naturaleza caliente y seca en segundo grado; seca los humores y ayuda a combatir la candidiasis oral, pero puede causar dificultad para la digestión y dolor de garganta."
  fr: "Plante bien connue, chaude et sèche au deuxième degré; elle assèche les humeurs et aide à traiter le muguet, mais peut provoquer une digestion difficile et des maux de gorge."
  tr: "Bilinen bir kıtlık, saniye boyunca sıcak ya da kuru, nemi kurutur, pamukçuk için faydalıdır ve hazımsızlık ile boğaz ağrısına neden olabilir."
  id: "Kelangkaan yang diketahui, dari panas hingga kering hingga detik, mengeringkan kelembapan, bermanfaat bagi sariwan, dan dapat menyebabkan gangguan pencernaan serta sakit tenggorokan."
