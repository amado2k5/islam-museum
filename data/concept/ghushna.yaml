summary:
  ar: "غوشنة في الكتاب جنس من الكمأة والفطر يجفف فينضم كالغضروف، شكله شكل كأس على كرش صغيرة متشنجة، ويؤكل في الحموضات، وليس في برد سائر الكمأة، وليس برديء الخلط كالكمأة {cite:canon-ibn-sina-print-v1 p.726}"
  en: "Ghushna is in the book a kind of truffle and mushroom which dries and so contracts like cartilage, its shape the shape of a cup on a small, shrivelled stomach (kirsh), and it is eaten among the sours; it is not in the coldness of the other truffles, and it is not bad in humour as the truffle is {cite:canon-ibn-sina-print-v1 p.726}"
  ur: "غوشنہ کتاب میں کمأۃ اور فطر کی ایک قسم ہے جو خشک ہوتی ہے تو غضروف کی طرح سمٹ جاتی ہے، اس کی شکل ایک چھوٹے سکڑے ہوئے کرش پر پیالے کی سی ہے، اور وہ کھٹی چیزوں میں کھائی جاتی ہے؛ وہ باقی کمأۃ کی ٹھنڈک میں نہیں، اور کمأۃ کی طرح بری خلط والی نہیں {cite:canon-ibn-sina-print-v1 p.726}۔"
