summary:
  ar: "موقف الشيخ عمر عبد الكافي من البرامج والقنوات التي تعرض الخرافة والتنجيم والهزل، ومسؤولية من يعدّها ويقدّمها ويرعاها أمام الله والناس، ورأيه في وجوب ترك مشاهدتها."
  en: "Sheikh Omar Abdelkafy's position on programmes and channels that present superstition, fortune-telling and frivolity, the responsibility of those who make, present and sponsor them before God and people, and his view that they should not be watched."
  ur: "شیخ عمر عبدالکافی کا موقف ان پروگراموں اور چینلوں پر جو توہم پرستی، نجومی پیش گوئی اور مسخرہ پن پیش کرتے ہیں، ان کے بنانے، پیش کرنے اور سرپرستی کرنے والوں کی اللہ اور لوگوں کے سامنے ذمہ داری، اور ان کے نہ دیکھنے کی ان کی رائے۔"
