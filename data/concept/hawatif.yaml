label: { ar: "الهواتف", en: "The hawatif (calling voices)", es: "Las hawatif (voces que llaman)", fr: "Les hawatif (voix appelantes)", ur: "حطیف ⁦(بلانے والی آوازیں)⁩", tr: "Telefonlar", id: "Telepon" }
summary:
  ar: "الأصوات المسموعة من غير جسم مرئي، كثرت في العرب وأكثرها أيام مولد النبي وأولية مبعثه عند المسعودي، وتنازع الناس فيها فذهب فريق إلى أنها تعرض من التوحد في القفار والتفرد في الأدوية فإذا توحد الإنسان تفكر وإذا جبن داخلته الظنون الكاذبة والسوداوية فصورت له الأصوات والأشخاص كما يعرض لذوي الوسواس {cite:muruj-al-dhahab p. 473}."
  en: "Voices heard without a visible body — commonest (al-Mas'udi says) around the Prophet's birth and mission; the naturalist reading traces them to the fancies bred by desert solitude and melancholy {cite:muruj-al-dhahab p. 473}."
  es: "Voces escuchadas sin un cuerpo visible: más comunes (dice al-Mas'udi) en torno al nacimiento y la misión del Profeta; la lectura naturalista las remonta a las fantasías engendradas por la soledad del desierto y la melancolía {cite:muruj-al-dhahab p. 473}."
  fr: "Des voix entendues sans corps visible — les plus courantes (selon al-Mas'udi) autour de la naissance et de la mission du Prophète; la lecture naturaliste les attribue aux fantaisies engendrées par la solitude et la mélancolie du désert {cite:muruj-al-dhahab p. 473}."
  ur: "آوازیں جو بغیر کسی مرئی جسم کے سنی جاتی ہیں — سب سے عام ⁦(المسعودی کہتے ہیں)⁩ پیغمبر کی ولادت اور مشن کے ارد گرد؛ فطرت پسند مطالعہ انہیں صحرا کی تنہائی اور اداسی سے پیدا ہونے والی پسندوں کا پتہ لگاتا ہے۔ 473}۔"
  tr: "Görünür beden olmadan duyulan sesler Araplar arasında yaygındı; bunların çoğu Peygamber'in doğum günlerinde ve el-Mes'udi'ye göre görevinin başlangıcında gerçekleşirdi. Bazıları bunların çöllerde terk edilme ve tıpta tekel olarak ortaya çıktığını söyledi. Bir kişi birleştiğinde düşünür ve korkaklaştığında yanlış ve karamsar şüpheler ortaya çıkar; böylece sesler ve insanlar onun için tasvir edilir, bu takıntılı düşüncelere gösterildiği gibi {cite:muruj-al-dhahab, s. 473}."
  id: "Suara yang terdengar tanpa tubuh yang terlihat umum di kalangan orang Arab, sebagian besar pada masa kelahiran Nabi dan awal misinya menurut al-Mas'udi. Orang-orang berdebat tentang mereka, dengan beberapa mengatakan bahwa suara itu terwujud sebagai pengabaian di padang pasir dan monopoli dalam dunia medis. Ketika seseorang bersatu, pikirnya, dan ketika dia menjadi pengecut, muncul kecurigaan palsu dan pesimis, demikian pula suara dan orang digambarkan untuknya, seperti yang ditunjukkan kepada mereka yang memiliki pikiran obsesif {cite:muruj-al-dhahab, hlm. 473}."
