label: { ar: "الهواتف", en: "The hawatif (calling voices)" }
summary:
  ar: "الأصوات المسموعة من غير جسم مرئي، كثرت في العرب وأكثرها أيام مولد النبي وأولية مبعثه عند المسعودي، وتنازع الناس فيها فذهب فريق إلى أنها تعرض من التوحد في القفار والتفرد في الأدوية فإذا توحد الإنسان تفكر وإذا جبن داخلته الظنون الكاذبة والسوداوية فصورت له الأصوات والأشخاص كما يعرض لذوي الوسواس {cite:muruj-al-dhahab p. 473}."
  en: "Voices heard without a visible body — commonest (al-Mas'udi says) around the Prophet's birth and mission; the naturalist reading traces them to the fancies bred by desert solitude and melancholy {cite:muruj-al-dhahab p. 473}."
