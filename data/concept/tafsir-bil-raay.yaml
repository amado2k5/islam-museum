label: { ar: "التفسير بالرأي", en: "Tafsir by opinion (bi'l-ra'y)", es: "Tafsir por opinión (bi'l-ra'y)", fr: "Tafsir par opinion (bi'l-ra'y)", ur: "تفسیر بذریعہ قول ⁦(بل الرائع)⁩" }
issue:
  ar: "متى يكون التفسير بالرأي مذموماً، ومتى يكون جائزاً؟"
summary:
  ar: "التفسير الذي يقوم على الرأي المجرد. ينقل محمد رشيد رضا عن ابن تيمية أن الخطأ فيه يأتي من جهتين: أن يُحمل القرآن على مذهب يعتقده المفسر فيصير المذهب أصلاً والقرآن فرعاً، وأن يُفسَّر بمجرد دلالة اللغة دون النظر إلى المتكلم به والمنزَّل عليه والمخاطَب به."
  en: "Tafsir that rests on opinion alone. Rashid Rida, quoting Ibn Taymiyya, says error comes in two ways: reading the Qur'an into a doctrine the interpreter already holds, so that the doctrine becomes the root and the Qur'an its branch; and explaining it by Arabic usage alone, without regard to its speaker, its first recipient and its addressees."
  es: "Tafsir que se basa únicamente en la opinión. Rashid Rida, citando a Ibn Taymiyya, afirma que el error se produce de dos maneras: interpretando el Corán según una doctrina que el intérprete ya sostiene, de modo que la doctrina se convierte en la raíz y el Corán en su rama; y explicándolo únicamente según el uso del árabe, sin tener en cuenta a su hablante, a su primer receptor ni a sus destinatarios."
  fr: "L'exégèse coranique (tafsir) fondée uniquement sur l'opinion. Rashid Rida, citant Ibn Taymiyya, affirme que l'erreur provient de deux sources: d'une part, lire le Coran à travers le prisme d'une doctrine déjà professée par l'interprète, faisant ainsi de la doctrine la racine et du Coran la branche; d'autre part, l'expliquer uniquement par l'usage arabe, sans tenir compte de son orateur, de son premier destinataire ni de ses destinataires."
  ur: "تفسیر جس کا انحصار صرف رائے پر ہو۔ راشد ردا، ابن تیمیہ کا حوالہ دیتے ہوئے کہتے ہیں کہ غلطی دو طرح سے آتی ہے: قرآن کو اس نظریے میں پڑھنا جو مفسر پہلے سے رکھتا ہے، تاکہ نظریہ جڑ بن جائے اور قرآن اس کی شاخ؛ اور اس کے بولنے والے، اس کے پہلے وصول کنندہ اور اس کے مخاطبین کی پرواہ کیے بغیر صرف عربی استعمال سے اس کی وضاحت کرنا۔"
