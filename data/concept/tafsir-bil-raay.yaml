label: { ar: "التفسير بالرأي", en: "Tafsir by opinion (bi'l-ra'y)" }
issue:
  ar: "متى يكون التفسير بالرأي مذموماً، ومتى يكون جائزاً؟"
summary:
  ar: "التفسير الذي يقوم على الرأي المجرد. ينقل محمد رشيد رضا عن ابن تيمية أن الخطأ فيه يأتي من جهتين: أن يُحمل القرآن على مذهب يعتقده المفسر فيصير المذهب أصلاً والقرآن فرعاً، وأن يُفسَّر بمجرد دلالة اللغة دون النظر إلى المتكلم به والمنزَّل عليه والمخاطَب به."
  en: "Tafsir that rests on opinion alone. Rashid Rida, quoting Ibn Taymiyya, says error comes in two ways: reading the Qur'an into a doctrine the interpreter already holds, so that the doctrine becomes the root and the Qur'an its branch; and explaining it by Arabic usage alone, without regard to its speaker, its first recipient and its addressees."
