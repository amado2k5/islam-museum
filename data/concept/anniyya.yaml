id: concept/anniyya
class: concept
kind: term
label:
  ar: "الأنِّيَّة (الوجود، الإنّية)"
  en: "Anniyya (thatness, existence)"
summary:
  ar: "مصطلح فلسفي مشتق من «أنّ»، ترجمة لفظية لتعبير أرسطو «هو أنه يوجد»، أي كون الشيء موجودًا، ويقابل الماهية؛ وكثيرًا ما تُستعمل كذلك بمعنى الوجود أو الكون في كتب الفلاسفة الإسلاميين {cite:encyclopaedia-of-islam-2 vol. 1 p. 537}."
  en: "A philosophical term from the particle 'anna, 'that', a literal rendering of Aristotle's 'that it is'; it means the fact that a thing exists, in contrast to its quiddity (mahiyya), and is used by Muslim philosophers in the sense of existence {cite:encyclopaedia-of-islam-2 vol. 1 p. 537}."
