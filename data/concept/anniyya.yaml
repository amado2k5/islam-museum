id: concept/anniyya
class: concept
kind: term
label:
  ar: "الأنِّيَّة ⁦(الوجود، الإنّية)⁩"
  en: "Anniyya (thatness, existence)"
  fr: "Anniyya (le fait d’être, existence)"
  es: "Anniyya (esencia, existencia)"
  ur: "عنیہ ⁦(وہ پن، وجود)⁩"
summary:
  ar: "مصطلح فلسفي مشتق من «أنّ»، ترجمة لفظية لتعبير أرسطو «هو أنه يوجد»، أي كون الشيء موجودًا، ويقابل الماهية؛ وكثيرًا ما تُستعمل كذلك بمعنى الوجود أو الكون في كتب الفلاسفة الإسلاميين {cite:encyclopaedia-of-islam-2 vol. 1 p. 537}."
  en: "A philosophical term from the particle 'anna, 'that', a literal rendering of Aristotle's 'that it is'; it means the fact that a thing exists, in contrast to its quiddity (mahiyya), and is used by Muslim philosophers in the sense of existence {cite:encyclopaedia-of-islam-2 vol. 1 p. 537}."
  fr: "Terme philosophique dérivé de la particule 'anna, « que », qui traduit littéralement le « fait qu’une chose est » chez Aristote. Il désigne le fait qu’une chose existe, par opposition à sa quiddité (mahiyya), et les philosophes musulmans l’emploient au sens d’existence {cite:encyclopaedia-of-islam-2 vol. 1 p. 537}."
  es: "Un término filosófico derivado de la partícula 'anna', 'que', una traducción literal del 'que es' de Aristóteles; significa el hecho de que una cosa existe, en contraste con su quiddidad (mahiyya), y es utilizado por los filósofos musulmanes en el sentido de existencia {cite:encyclopaedia-of-islam-2 vol. 1 p. 537}."
  ur: "ذرہ 'انا،' وہ' سے ایک فلسفیانہ اصطلاح، ارسطو کے 'یہ ہے' کا لفظی ترجمہ؛ اس کا مطلب یہ ہے کہ کوئی چیز موجود ہے، اس کی قلت ⁦(مہیہ)⁩ کے برعکس، اور مسلم فلسفیوں نے اسے وجود کے معنی میں استعمال کیا ہے۔ 1 ص۔ 537}۔"
