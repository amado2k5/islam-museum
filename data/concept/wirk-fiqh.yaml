label:
  ar: وَرِك
  en: Wirk (the hip; tawarruk and retaliation)
  es: "Wirk (la cadera; tawarruk y represalia)"
  fr: "Wirk (la hanche; tawarruk et représailles)"
  ur: "کام ⁦(ہپ؛ توارق اور انتقام)⁩"
  tr: "belki"
  id: "panggul"
summary:
  ar: 'الوِرك في اللغة مفصل الفخذ بالساق، وللإنسان وركان فوق الفخذين، ولا يخرج الاصطلاح عن اللغة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17165}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17166} والتورّك في الجلوس للتشهد مستحب في الجملة، فالمالكية يرونه في كل جلوس في الصلاة، والشافعية والحنابلة في التشهد الأخير، والحنابلة لا يرونه في صلاة ليس فيها إلا تشهد واحد كالصبح والجمعة، والحنفية يجعلون الافتراش للرجل والتورّك للمرأة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17166}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17167} وقد اختلف الحنابلة في التورّك في تشهد سجود السهو، وقال القاضي بالتورّك فيه مطلقاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17167} وفي القصاص اتفق الفقهاء في الجملة على وجوب القصاص في قطع الرجل من أصل الورك، لإمكان المماثلة، إذا توفرت شروط القصاص في الأطراف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17167} وفي دية الرِّجل إذا قطعت من الورك خلاف: فجمهور المالكية والحنابلة وأبو يوسف يرون أن الدية خمسون من الإبل كما في حديث عمرو بن حزم، بينما يرى أبو حنيفة ومحمد والشافعية والقاضي من الحنابلة أن يوجب مع دية القدم حكومة عدل فيما فوق الكعبين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17167}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17168} وإذا قُطعت الرجل من الكعبين ثم قُطعت من الركبة أو الورك وجبت حكومة في المقطوع ثانياً باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17168}'
  en: 'Wirk (hip) in the lexicon is the joint between the thigh and the leg; a person has two, above the thighs, and the technical sense does not depart from this. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17165}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17166} Sitting with the hip down (tawarruk) in the tashahhud is recommended in general. The Malikis apply it to every sitting in prayer; the Shafi''is and Hanbalis to the final tashahhud; the Hanbalis do not apply it to prayers with only one tashahhud, such as dawn and Friday prayers; the Hanafis prescribe spreading the leg (iftirash) for men and tawarruk for women. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17166}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17167} The Hanbalis differ on tawarruk in the tashahhud after forgetfulness prostrations; al-Qadi applies it in every such tashahhud. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17167} On retaliation, the jurists agree in general that a leg cut at its root in the hip is subject to retaliation, since equal cutting is possible, once the general conditions for retaliation on limbs are met. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17167} On the blood-money for a leg cut at the hip there is disagreement: the majority of Malikis and Hanbalis and Abu Yusuf hold that the full sum of fifty camels applies, as in the report of Amr ibn Hazm; Abu Hanifa, Muhammad, the Shafi''is and al-Qadi among the Hanbalis add an assessed compensation for the part above the ankles to the sum for the foot. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17167}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17168} When a leg is cut at the ankle and then at the knee or hip, an assessed compensation is owed for the second cut by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17168}'
  es: "Wirk (cadera) en el léxico es la articulación entre el muslo y la pierna; una persona tiene dos, por encima de los muslos, y el sentido técnico no se aparta de esto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17165}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17166} Sentarse con la cadera hacia abajo (tawarruk) en el tashahhud es recomendable en general. Los malikíes lo aplican a cada sesión de oración; los shafiíes y los hanbalíes al tashahhud final; los hanbalíes no lo aplican a las oraciones con un solo tashahhud, como las oraciones del amanecer y del viernes; los hanafíes prescriben extender la pierna (iftirash) para los hombres y tawarruk para las mujeres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17166}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17167} Los hanbalíes difieren en tawarruk en el tashahhud después de las postraciones de olvido; al-Qadi lo aplica en cada tashahhud de este tipo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17167} En cuanto a la represalia, los juristas coinciden en general en que una pierna cortada en su raíz en la cadera está sujeta a represalia, ya que es posible un corte igual, una vez que se cumplen las condiciones generales para la represalia en las extremidades. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17167} Sobre la compensación por una pierna cortada a la altura de la cadera hay desacuerdo: la mayoría de los malikíes y hanbalíes y Abu Yusuf sostienen que se aplica la suma completa de cincuenta camellos, como en el informe de Amr ibn Hazm; Abu Hanifa, Muhammad, los shafi'íes y al-Qadi entre los hanbalíes añaden una compensación calculada por la parte por encima de los tobillos a la suma por el pie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17167}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17168} Cuando una pierna se corta a la altura del tobillo y luego a la altura de la rodilla o la cadera, se debe una compensación calculada por el segundo corte por acuerdo. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.17168}"
  fr: "Dans le lexique, le terme « wirk » (hanche) désigne l'articulation entre la cuisse et la jambe; une personne possède deux hanches, situées au-dessus des cuisses, et le sens technique reste le même. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17165}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17166} Il est généralement recommandé de s'asseoir avec les hanches abaissées (tawarruk) pendant le tashahhud. Les Malikites l'appliquent à chaque position assise pendant la prière; les Chafi'ites et les Hanbalites au tashahhud final; les Hanbalites ne l'appliquent pas aux prières ne comportant qu'un seul tashahhud, comme la prière de l'aube et la prière du vendredi; les Hanafites prescrivent l'écartement des jambes (iftirash) pour les hommes et le tawarruk pour les femmes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17166}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17167} Les Hanbalites divergent sur le tawarruk lors du tashahhud suivant les prosternations d'oubli; al-Qadi l'applique systématiquement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17167} Concernant la riposte, les juristes s'accordent généralement à dire qu'une entaille à la jambe à sa base, au niveau de la hanche, est susceptible de représailles, une fois les conditions générales de riposte sur les membres remplies. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17167} Concernant le prix du sang pour une jambe coupée à la hanche, il existe une divergence d'opinions: la majorité des Malikites et des Hanbalites, ainsi qu'Abu Yusuf, estiment que la somme totale de cinquante chameaux est applicable, conformément au hadith rapporté par Amr ibn Hazm; Abu Hanifa, Muhammad, les Shafi'ites et al-Qadi, parmi les Hanbalites, ajoutent une compensation forfaitaire pour la partie située au-dessus des chevilles à la somme due pour le pied. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17167}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17168} Lorsqu'une jambe est coupée à la cheville puis au genou ou à la hanche, une compensation forfaitaire est due pour la seconde coupure, d'un commun accord. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17168}"
  ur: "لغت میں ورک ⁦(ہپ)⁩ ران اور ٹانگ کے درمیان جوڑ ہے۔ ایک شخص کی رانوں کے اوپر دو ہیں، اور تکنیکی احساس اس سے الگ نہیں ہوتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17165}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17166} تشہد میں کولہے کو نیچے کر کے بیٹھنا عمومی طور پر مستحب ہے۔ مالکیہ اسے نماز میں ہر بیٹھنے پر لگاتے ہیں۔ شافعی اور حنبلی آخری تشہد تک؛ حنبلی اسے صرف ایک تشہد والی نمازوں پر لاگو نہیں کرتے، جیسے فجر اور جمعہ کی نماز۔ احناف نے مردوں کے لیے ٹانگ پھیلانا اور عورتوں کے لیے توارق تجویز کیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17166}{cite:فقہ-موسوع-کویتیہ-نور-v3 ص17167} حنبلیوں کا تشہد میں بھولنے کے سجدوں کے بعد توارق پر اختلاف ہے۔ القدی ہر اس طرح کے تشہد میں اس کا اطلاق کرتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17167} جوابی کارروائی کے بارے میں فقہاء کا اتفاق ہے کہ کولہے کی جڑ میں ٹانگ کاٹنا انتقامی کارروائی سے مشروط ہے کیونکہ اعضاء پر انتقام کی عمومی شرائط پوری ہونے کے بعد برابر کاٹنا ممکن ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17167} کولہے پر ٹانگ کٹوانے کی رقم پر اختلاف ہے: جمہور مالکیہ اور حنبلی اور ابو یوسف کا خیال ہے کہ پچاس اونٹوں کی پوری جمع ہوتی ہے جیسا کہ عمرو بن حزم کی روایت میں ہے۔ حنبلیوں میں سے ابو حنیفہ، محمد، شافعی اور القادی ٹخنوں کے اوپر والے حصے کا معاوضہ پاؤں کی رقم میں شامل کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17167}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17168} جب ٹانگ ٹخنے اور پھر گھٹنے یا کولہے پر کٹی ہو تو معاوضہ دوسری کٹ کے معاہدے کے ذریعے ادا کیا جاتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص17168}"
  tr: "Arapçada \"kalça\" kelimesi, uyluk ve bacak arasındaki eklemi ifade eder. İnsanlarda uylukların üzerinde iki kalça bulunur ve bu bağlamdaki kullanım, dilsel anlamdan sapmaz. Teşehhüd (iman şahitliği) sırasında teverruk pozisyonunda oturmak genellikle tavsiye edilir. Malikiler, namazın her oturuşunda bunu tavsiye ederken, Şafiiler ve Hanbeliler sadece son teşehhüdde tavsiye ederler. Hanbeliler, sabah namazı ve cuma namazı gibi tek teşehhüdlü namazlarda bunu tavsiye etmezler. Hanefiler, erkekler için iftiraş pozisyonunu, kadınlar için ise teverruk pozisyonunu tavsiye ederler. Hanbeliler, unutma secdesi (sahv secdesi) sırasında teverruk pozisyonu konusunda farklı görüşlere sahiptir; bir yargıç, her durumda tavsiye edildiğini belirtmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17167} Misilleme konusunda, hukukçular genel olarak, denklik olasılığı nedeniyle, kalçadan bacağın kesilmesi durumunda misillemenin farz olduğu konusunda hemfikirdir; ancak uzuv kesilmesi durumunda misilleme için gereken şartların yerine getirilmesi gerekir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17167} Kalçadan kesilen bir bacak için kan parası konusunda görüş ayrılığı vardır: Malikilerin, Hanbelilerin ve Ebu Yusuf'un çoğunluğu, Amr ibn Hazm'ın hadisinde belirtildiği gibi, kan parasının elli deve olduğunu savunmaktadır. Bununla birlikte, Ebu Hanife, Muhammed, Şafiiler ve Hanbelilerden bir kadı, ayak için kan parasına ek olarak, ayak bileklerinin üstündeki bölge için de adil bir tazminat ödenmesi gerektiğini savunmaktadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17167}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17168} Eğer bir erkeğin bacağı önce ayak bileklerinden sonra tekrar dizden veya kalçadan kesilirse, ikinci ampütasyon için uzlaşmayla tazminat ödenmesi gerekir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17168}"
  id: "Kata \"pinggul\" dalam bahasa Arab merujuk pada persendian antara paha dan tungkai. Manusia memiliki dua pinggul di atas paha, dan penggunaan dalam konteks ini tidak menyimpang dari makna linguistiknya. Postur duduk dalam posisi tawarruk selama tasyahhud (kesaksian iman) umumnya dianjurkan. Mazhab Maliki menganggapnya dianjurkan dalam setiap duduk selama shalat, sedangkan mazhab Syafi'i dan Hanbali menganggapnya dianjurkan hanya pada tasyahhud terakhir. Mazhab Hanbali tidak menganggapnya dianjurkan dalam shalat yang hanya memiliki satu tasyahhud, seperti shalat Subuh dan shalat Jumat. Mazhab Hanafi menganggap posisi iftirash untuk laki-laki dan posisi tawarruk untuk perempuan. Mazhab Hanbali berbeda pendapat mengenai posisi tawarruk selama tasyahhud sujud sahwi, dengan hakim menyatakan bahwa posisi tersebut dianjurkan dalam semua kasus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17167} Mengenai pembalasan, para ahli hukum umumnya sepakat bahwa pembalasan wajib dilakukan untuk amputasi kaki di pinggul, karena adanya kemungkinan kesetaraan, asalkan syarat-syarat pembalasan untuk amputasi anggota tubuh terpenuhi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17167} Terdapat perbedaan pendapat mengenai uang darah untuk amputasi kaki di pinggul: mayoritas mazhab Maliki, Hanbali, dan Abu Yusuf berpendapat bahwa uang darahnya adalah lima puluh unta, sebagaimana disebutkan dalam hadits Amr ibn Hazm. Namun, Abu Hanifa, Muhammad, mazhab Syafi'i, dan hakim dari mazhab Hanbali berpendapat bahwa, selain uang darah untuk kaki, kompensasi yang adil juga harus dibayarkan untuk area di atas pergelangan kaki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17167}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17168} Jika kaki seseorang diamputasi pada bagian mata kaki dan kemudian pada bagian lutut atau pinggul, kompensasi harus diberikan untuk amputasi kedua, berdasarkan konsensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hal.17168}"
