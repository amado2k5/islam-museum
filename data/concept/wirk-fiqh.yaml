id: concept/wirk-fiqh
class: concept
kind: legal
label:
  ar: وَرِك
  en: Wirk (the hip; tawarruk and retaliation)
summary:
  ar: 'الوِرك في اللغة مفصل الفخذ بالساق، وللإنسان وركان فوق الفخذين، ولا يخرج الاصطلاح عن اللغة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17165}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17166} والتورّك في الجلوس للتشهد مستحب في الجملة، فالمالكية يرونه في كل جلوس في الصلاة، والشافعية والحنابلة في التشهد الأخير، والحنابلة لا يرونه في صلاة ليس فيها إلا تشهد واحد كالصبح والجمعة، والحنفية يجعلون الافتراش للرجل والتورّك للمرأة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17166}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17167} وقد اختلف الحنابلة في التورّك في تشهد سجود السهو، وقال القاضي بالتورّك فيه مطلقاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17167} وفي القصاص اتفق الفقهاء في الجملة على وجوب القصاص في قطع الرجل من أصل الورك، لإمكان المماثلة، إذا توفرت شروط القصاص في الأطراف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17167} وفي دية الرِّجل إذا قطعت من الورك خلاف: فجمهور المالكية والحنابلة وأبو يوسف يرون أن الدية خمسون من الإبل كما في حديث عمرو بن حزم، بينما يرى أبو حنيفة ومحمد والشافعية والقاضي من الحنابلة أن يوجب مع دية القدم حكومة عدل فيما فوق الكعبين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17167}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17168} وإذا قُطعت الرجل من الكعبين ثم قُطعت من الركبة أو الورك وجبت حكومة في المقطوع ثانياً باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17168}'
  en: 'Wirk (hip) in the lexicon is the joint between the thigh and the leg; a person has two, above the thighs, and the technical sense does not depart from this. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17165}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17166} Sitting with the hip down (tawarruk) in the tashahhud is recommended in general. The Malikis apply it to every sitting in prayer; the Shafi''is and Hanbalis to the final tashahhud; the Hanbalis do not apply it to prayers with only one tashahhud, such as dawn and Friday prayers; the Hanafis prescribe spreading the leg (iftirash) for men and tawarruk for women. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17166}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17167} The Hanbalis differ on tawarruk in the tashahhud after forgetfulness prostrations; al-Qadi applies it in every such tashahhud. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17167} On retaliation, the jurists agree in general that a leg cut at its root in the hip is subject to retaliation, since equal cutting is possible, once the general conditions for retaliation on limbs are met. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17167} On the blood-money for a leg cut at the hip there is disagreement: the majority of Malikis and Hanbalis and Abu Yusuf hold that the full sum of fifty camels applies, as in the report of Amr ibn Hazm; Abu Hanifa, Muhammad, the Shafi''is and al-Qadi among the Hanbalis add an assessed compensation for the part above the ankles to the sum for the foot. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17167}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17168} When a leg is cut at the ankle and then at the knee or hip, an assessed compensation is owed for the second cut by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17168}'
