summary:
  ar: "السترة في الفقه ما يتخذه المصلي بين يديه ليمنع المرور؛ تفصّل الموسوعة الفقهية الكويتية مقدار السترة وصفتها وكيفية نصبها وموقف المصلي منها {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  en: "The sutrah in fiqh is the screen a worshipper sets before him to bar passers-by; the Kuwaiti Fiqh Encyclopedia details its size, description, placement and the worshipper's stance toward it {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  es: "La sutrah en fiqh es la pantalla que un creyente coloca frente a sí para impedir el paso a los transeúntes; la Enciclopedia de Fiqh de Kuwait detalla su tamaño, descripción, ubicación y la postura del creyente hacia ella {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  fr: "La sutra en fiqh est l'écran qu'un adorateur place devant lui pour empêcher les passants de passer; l'Encyclopédie koweïtienne de fiqh détaille sa taille, sa description, son emplacement et la position de l'adorateur à son égard {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  ur: "فقہ میں سترہ وہ پردہ ہے جو ایک نمازی راہگیروں کو روکنے کے لیے اپنے سامنے رکھتا ہے۔ کویتی فقہ انسائیکلو پیڈیا اس کی جسامت، تفصیل، مقام اور اس کے بارے میں نمازی کے موقف کی تفصیلات بیان کرتا ہے۔"
