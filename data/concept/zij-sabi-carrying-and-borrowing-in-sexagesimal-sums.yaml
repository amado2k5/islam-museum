label: { ar: "الحمل والاستقراض في جمع الأجناس الستينية وطرحها", en: "Carrying and borrowing in sexagesimal sums", ur: "ستینی اجناس کے جمع و تفریق میں حمل اور قرض", es: "Transporte y préstamo en cantidades sexagesimales", fr: "Ports et emprunts en sommes sexagésimales", tr: "Altmışlık sayıların toplama ve çıkarma işlemlerinde gebelik ve ödünç alma", id: "Kehamilan dan peminjaman dalam penjumlahan dan pengurangan seksagesimal" }
summary:
  ar: "يعلّم البتاني كيف يُحمل الفائض إلى الجنس الأعلى كلما جاوز الستين، وكيف يُستقرض من الجنس الأعلى واحد يُحسب ستين عند الحاجة إلى الطرح، وكيف تسقط الأدوار الكاملة التي مقدار الواحد منها ثلثمائة وستون جزءاً عند جمع الدرج وتحتسب البقية، وتضاف دور إلى المجتمع إذا قصرت الدرج عن الطرح. {cite:zij-sabi-nallino-byblion p.13}."
  en: "Al-Battani teaches how a surplus is carried to the next higher order whenever it passes sixty, how one is borrowed from the order above and counted as sixty when a subtraction needs it, how whole revolutions of 360 parts are dropped when degrees are added and the remainder kept, and how a revolution is added to the sum when the degrees fall short of the subtraction. {cite:zij-sabi-nallino-byblion p.13}."
  ur: "البتانی سکھاتے ہیں کہ جب کوئی جنس ساٹھ سے بڑھے تو زائد حصہ اوپر کی جنس میں کیسے منتقل ہوتا ہے، تفریق کی ضرورت پر اوپر کی جنس سے ایک کو کیسے ساٹھ شمار کر کے لیا جاتا ہے، درجے جمع کرتے وقت ۳۶۰ درجوں کے مکمل دور کیسے ساقط کیے جاتے ہیں اور باقی رکھا جاتا ہے، اور جب درجے تفریق کے لیے کم پڑیں تو مجموعے میں ایک دور کیسے بڑھایا جاتا ہے۔ {cite:zij-sabi-nallino-byblion p.13}۔"
  es: "Al-Battani enseña cómo un excedente se traslada al siguiente orden superior cuando supera los sesenta, cómo se toma prestado uno del orden superior y se cuenta como sesenta cuando una resta lo requiere, cómo se descartan revoluciones completas de 360 partes cuando se suman grados y se conserva el resto, y cómo se añade una revolución a la suma cuando los grados son inferiores a la resta. {cite:zij-sabi-nallino-byblion p.13}."
  fr: "Al-Battani explique comment un excédent est reporté à l'ordre supérieur lorsqu'il dépasse soixante, comment on emprunte une unité à l'ordre supérieur et on la compte comme soixante lors d'une soustraction, comment on supprime les tours entiers de 360 parties lors de l'addition de degrés et qu'on conserve le reste, et comment on ajoute un tour à la somme lorsque le nombre de degrés est inférieur à celui de la soustraction. {cite:zij-sabi-nallino-byblion p.13}."
  tr: "Al-Battani, fazlalık altmışı aştığında bir üst cinsiyete nasıl aktarılacağını, çıkarma gerektiğinde bir üst cinsiyetten altmış değerinde bir birim nasıl ödünç alınacağını, adımları toplarken ve kalanı hesaplarken her biri üç yüz altmış parça değerinde olan tam sayıların nasıl atılacağını ve adımlar çıkarma işleminden az ise toplamaya bir sayı nasıl ekleneceğini öğretir. {cite:zij-sabi-nallino-byblion s.13}."
  id: "Al-Battani mengajarkan cara membawa kelebihan ke jenis kelamin yang lebih tinggi berikutnya setiap kali melebihi enam puluh, cara meminjam satu dari jenis kelamin yang lebih tinggi berikutnya yang dihitung sebagai enam puluh ketika pengurangan diperlukan, cara menghilangkan seluruh putaran, yang masing-masing bernilai tiga ratus enam puluh bagian, ketika menambahkan langkah dan menghitung sisanya, dan menambahkan satu putaran ke jumlah jika langkahnya kurang dari pengurangan. {cite:zij-sabi-nallino-byblion p.13}."
