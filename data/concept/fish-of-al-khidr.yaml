id: concept/fish-of-al-khidr
class: concept
kind: natural
label:
  ar: "حوت الخضر"
  en: "The fish of al-Khidr"
  ur: "خضر کی مچھلی"
  es: "El pez de al-Khidr"
  fr: "Le poisson d'al-Khidr"
  tr: "yeşil balina"
  id: "paus hijau"
summary:
  ar: "سمكة أخذها موسى وفتاه زاداً فأخذت سبيلها في البحر سرباً عند الصخرة فكان ذلك علامة لقاء موسى بالخضر الذي أنساه الشيطان أن يذكره."
  en: "The fish Moses and his servant took for provision; at the rock it made its way into the sea in a tunnel — the sign of Moses' meeting with al-Khidr, which Satan made the servant forget to mention."
  ur: "وہ مچھلی جو موسیٰ اور ان کے نوجوان نے زاد راہ لی؛ چٹان پر وہ سمندر میں سرنگ کی طرح سرک گئی — موسیٰ کی خضر سے ملاقات کی نشانی جسے شیطان نے نوجوان کو بھلا دیا۔"
  es: "El pez que Moisés y su siervo tomaron como sustento, al llegar a la roca, se adentró en el mar a través de un túnel, señal del encuentro de Moisés con al-Khidr, que Satanás hizo que el siervo olvidara mencionar."
  fr: "Le poisson que Moïse et son serviteur prirent pour se nourrir; au rocher, il se fraya un chemin jusqu'à la mer par un tunnel — signe de la rencontre de Moïse avec al-Khidr, que Satan fit oublier au serviteur de mentionner."
  tr: "Musa ve kızı Zada bir balık yakaladı ve onu kayanın yakınındaki denizde bir sürü yakaladı. Bu, Musa'nın Al-Khidr ile buluşmasının bir işaretiydi; Şeytan Al-Khidr'i bahsetmeyi unutmuştu."
  id: "Seekor ikan ditangkap oleh Musa dan gadisnya Zada, dan ditangkap oleh sekawanan ikan di laut dekat batu. Ini adalah tanda pertemuan Musa dengan Al-Khidr, yang lupa disebutkan oleh Setan."
