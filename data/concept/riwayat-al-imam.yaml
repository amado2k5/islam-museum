id: concept/riwayat-al-imam
class: concept
kind: term
label:
  ar: الروايات عن الإمام أحمد
  en: "The reports from Imam Ahmad"
issue:
  ar: إذا تعارضت أقوال الإمام في المسألة الواحدة، فأيّها يُنسب إليه مذهباً؟
  en: "When the Imam's statements on a single question conflict, which of them is attributed to him as the school's position?"
summary:
  ar: ما نُقل عن الإمام أحمد من أقوال في المسألة الواحدة، وطريقة الأصحاب في الجمع بينها وترجيح إحداها، وهي أساس المذهب في الفقه.
  en: "The statements transmitted from Imam Ahmad on a single question, and how his companions reconciled them and preferred one over another; they are the school's foundation in jurisprudence."
