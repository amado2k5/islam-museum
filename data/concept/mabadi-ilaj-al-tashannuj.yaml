label:
  ar: "مبادئ علاج التشنج"
  en: "Principles of the treatment of convulsion"
  ur: "تشنج کے علاج کے اصول"
  es: "Principios del tratamiento de las convulsiones"
  fr: "Principes du traitement des convulsions"
summary:
  ar: "الكائن عن ضربة يعالج بالنطولات المرخية، والكائن من الأذى فإن كان لشرب شيء فبما تعرف في أبواب السموم، وإن كان لحمى فبالترطيب الشديد للدماغ والعصب والعضلات ولزوم البيت البارد، وإن كان لوجع فتسكين الوجه بعد النظر فيه وقطع سببه، وإن كان عن يبس فعلاجه يصعب {cite:canon-ibn-sina-print-v2 p.147}"
  en: "What arises from a blow is treated with relaxing fomentations; what from injury — if from drinking something, by what is known in the chapters of poisons, if from fever by strong moistening of brain, nerve and muscles and staying in a cold house, if from pain by calming the pain after examining it and cutting its cause; what is from dryness is hard to treat {cite:canon-ibn-sina-print-v2 p.147}"
  ur: "جو ضربت سے ہو اس کا علاج رخی کرنے والے نطولات سے ہوتا ہے، اور جو تکلیف سے ہو تو اگر کسی چیز کے پینے سے ہو تو جیسا زہروں کے ابواب میں پہچانا جاتا ہے، اور اگر بخار سے ہو تو دماغ، عصب اور عضلات کی سخت ترطیب اور ٹھنڈے گھر میں رہنے سے، اور اگر درد سے ہو تو اس کی جانچ کے بعد درد کی تسکین اور اس کے سبب کا قطع سے؛ اور جو یبس سے ہو اس کا علاج مشکل ہے {cite:canon-ibn-sina-print-v2 p.147}۔"
  es: "Lo que surge de un golpe se trata con fomentaciones relajantes; lo que surge de una lesión, si es por ingerir algo, con lo que se conoce en los capítulos de venenos; si es por fiebre, con una fuerte humectación del cerebro, los nervios y los músculos y permaneciendo en una casa fría; si es por dolor, calmándolo después de examinarlo y cortando su causa; lo que es por sequedad es difícil de tratar {cite:canon-ibn-sina-print-v2 p.147}"
  fr: "Ce qui résulte d'un coup est traité par des fomentations relaxantes; ce qui résulte d'une blessure — si c'est dû à l'ingestion d'une substance, par les remèdes décrits dans les chapitres sur les poisons; si c'est dû à la fièvre, par une forte hydratation du cerveau, des nerfs et des muscles et par un séjour dans une maison froide; si c'est dû à la douleur, par le soulagement de la douleur après l'avoir examinée et en avoir éliminé la cause; ce qui est dû à la sécheresse est difficile à traiter {cite:canon-ibn-sina-print-v2 p.147}"
