id: concept/cat-in-hadith
class: concept
kind: legal
label:
  ar: "الهرة في الحديث"
  en: "The cat in the hadith"
  ur: "حدیث میں بلی"
summary:
  ar: "في باب «تحريم تعذيب الهرة ونحوها من الحيوان الذي لا يؤذى» من صحيح مسلم، يروي ابن عمر وأبو هريرة عن النبي أن امرأة عُذّبت في هرة حبستها حتى ماتت، فدخلت النار؛ لا هي أطعمتها وسقتها حين حبستها، ولا تركتها تأكل من خشاش الأرض {cite:sahih-muslim ch-taḥrīm-taʿdhīb-al-hirra}. والحديث أصل في وجوب الإحسان إلى الحيوان الذي في عهدة الإنسان، وفي أن الإمساك عن الطعام والشراب لمن حُبس حيوانه ذنب يُعذَّب عليه."
  en: "In the chapter 'the prohibition of torturing a cat and the like of an animal that does no harm' in Sahih Muslim, Ibn Umar and Abu Hurayra transmit from the Prophet that a woman was punished because of a cat she had shut up until it died; she entered the Fire, since she neither fed it nor gave it drink while she held it, nor let it go to eat from the vermin of the earth {cite:sahih-muslim ch-taḥrīm-taʿdhīb-al-hirra}. The hadith is the basis for the duty to care for an animal in one's keeping, and for the view that withholding food and drink from a confined animal is a sin."
  ur: "صحیح مسلم کے باب «تحریم تعذیب الہرۃ ونحوہا من الحیوان الذی لا یؤذی» میں ابن عمر اور ابو ہریرہ نبی سے نقل کرتے ہیں کہ ایک عورت ایک بلی کی وجہ سے عذاب میں ڈالی گئی جسے اس نے باندھ رکھا یہاں تک کہ وہ مر گئی؛ وہ آگ میں داخل ہوئی، کیونکہ نہ اس نے اسے کھلایا پلایا جب اسے باندھا، اور نہ چھوڑا کہ زمین کے کیڑوں مکوڑوں سے کھا لیتی {cite:sahih-muslim ch-taḥrīm-taʿdhīb-al-hirra}۔ یہ حدیث جانور کی دیکھ بھال کے وجوب اور قید کیے گئے جانور کو کھانے پانی سے محروم رکھنے کے گناہ ہونے کی بنیاد ہے۔"
