summary:
  ar: "يذكر ابن سينا ورم الحلق بين الفم والمريء، وربما امتد إلى العضل وخرز القفا، وعلاجه بتليين الطبيعة بشيافة ثم ربّ التوت، ثم خرخرة عظيمة في النوم وعلاجها لعوق بزر الكتان أو الكمون بالعسل {cite:canon-ibn-sina-print-v1 p.219}."
  en: "Ibn Sina mentions a swelling of the throat between the mouth and the gullet, which may spread to the muscles and the vertebrae of the nape, treated by loosening the bowels with a suppository and then mulberry rob, and then loud snoring in sleep, treated by licking flaxseed or cumin with honey {cite:canon-ibn-sina-print-v1 p.219}."
