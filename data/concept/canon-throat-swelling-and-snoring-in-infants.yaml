label: { ar: "ورم الحلق والخرخرة عند الصبيان عند ابن سينا", en: "Throat swelling and loud snoring in infants in the Canon", ur: "قانون میں بچوں کے حلق کی سوجن اور خراٹے", es: "Hinchazón de garganta y ronquidos fuertes en bebés en el Canon", fr: "Enflure de la gorge et ronflements bruyants chez les nourrissons dans le Canon" }
summary:
  ar: "يذكر ابن سينا ورم الحلق بين الفم والمريء، وربما امتد إلى العضل وخرز القفا، وعلاجه بتليين الطبيعة بشيافة ثم ربّ التوت، ثم خرخرة عظيمة في النوم وعلاجها لعوق بزر الكتان أو الكمون بالعسل {cite:canon-ibn-sina-print-v1 p.219}."
  en: "Ibn Sina mentions a swelling of the throat between the mouth and the gullet, which may spread to the muscles and the vertebrae of the nape, treated by loosening the bowels with a suppository and then mulberry rob, and then loud snoring in sleep, treated by licking flaxseed or cumin with honey {cite:canon-ibn-sina-print-v1 p.219}."
  es: "Ibn Sina menciona una hinchazón de la garganta entre la boca y el esófago, que puede extenderse a los músculos y las vértebras de la nuca, tratada ablandando los intestinos con un supositorio y luego con mora, y luego ronquidos fuertes durante el sueño, tratados lamiendo semillas de lino o comino con miel {cite:canon-ibn-sina-print-v1 p.219}."
  fr: "Ibn Sina mentionne un gonflement de la gorge entre la bouche et l'œsophage, qui peut s'étendre aux muscles et aux vertèbres de la nuque, traité en ramollissant les intestins avec un suppositoire puis de la râle de mûrier, puis des ronflements bruyants pendant le sommeil, traités en léchant des graines de lin ou du cumin avec du miel {cite:canon-ibn-sina-print-v1 p.219}."
