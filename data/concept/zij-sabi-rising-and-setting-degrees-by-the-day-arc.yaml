label: { ar: "طريقة ثانية للطالع والغارب بقوس النهار", en: "A second way to the rising and setting degrees by the day arc", ur: "طلوع و غروب کے درجات کا دوسرا طریقہ قوسِ نہار کے ساتھ", es: "Una segunda forma de calcular los grados de salida y puesta del día según el arco", fr: "Une deuxième méthode pour calculer les degrés de lever et de coucher selon l'arc du jour", tr: "Günün doğuş ve batış noktalarını belirlemek için ikinci bir yöntem.", id: "Metode kedua untuk menentukan titik terbit dan terbenamnya matahari." }
summary:
  ar: "يذكر البتاني جهة أخرى: تؤخذ أزمان مطالع الجزء الذي يتوسط السماء مع الكوكب في الفلك المستقيم، فيُزاد عليها نصف قوس نهار الكوكب وكذلك يُنقص منها نصفها، فالمزيد عليه هو مطالع نظير الدرجة التي يغيب منها، والمنقوص منه هو مطالع الدرجة التي يطلع معها في الإقليم، ثم تؤخذ الدرج بإزائها في الجدول. {cite:zij-sabi-nallino-byblion p.54}."
  en: "Al-Battani gives another way: take the rising times of the part that culminates with the star in the right sphere, add the half day arc of the star to them and also take it from them; the sum is the rising of the opposite of the degree at which the star sets, and the remainder is the rising of the degree with which it rises in the clime, and the degrees against them are then taken from the table. {cite:zij-sabi-nallino-byblion p.54}."
  ur: "البتانی ایک اور طریقہ بتاتے ہیں: وہ جزء جو ستارے کے ساتھ وسط السماء میں آتا ہے اس کے فلک مستقیم کے مطالع کے ازمان لیے جائیں، ان میں ستارے کی نصف قوسِ نہار جمع بھی کی جائے اور گھٹائی بھی جائے؛ مجموعہ اس درجے کے نظیر کا مطلع ہے جس پر ستارہ ڈوبتا ہے، اور باقی اس درجے کا مطلع ہے جس کے ساتھ وہ اقلیم میں طلوع ہوتا ہے، پھر جدول میں ان کے مقابل درجے لیے جاتے ہیں۔ {cite:zij-sabi-nallino-byblion p.54}۔"
  es: "Al-Battani propone otro método: tomar las horas de salida de la parte que culmina con la estrella en la esfera derecha, sumarles el arco de medio día de la estrella y restarles también el resto; la suma es la salida del opuesto al grado en el que se pone la estrella, y el resto es la salida del grado con el que sale en el clima, y los grados opuestos se toman de la tabla. {cite:zij-sabi-nallino-byblion p.54}."
  fr: "Al-Battani propose une autre méthode: prendre les heures de lever de la partie qui culmine avec l’étoile dans la sphère droite, y ajouter la demi-journée d’arc de l’étoile et la soustraire; la somme correspond au lever du côté opposé au degré auquel l’étoile se couche, et le reste au lever du côté opposé au degré auquel elle se lève dans le climat. Les degrés opposés sont ensuite relevés dans la table. {cite:zij-sabi-nallino-byblion p.54}."
  tr: "El-Battani başka bir yöntemden de bahseder: Gezegenin düz gök küresinde bulunduğu gökyüzünün ortasındaki kısmın doğuş zamanları alınır ve bunlara gezegenin gündüz yay süresinin yarısı eklenir, yarısı da çıkarılır. Eklenen miktar, battığı dereceye karşılık gelen doğuş zamanıdır ve çıkarılan miktar ise bölgede yükseldiği dereceye karşılık gelen doğuş zamanıdır. Daha sonra ilgili dereceler tabloda alınır. {cite:zij-sabi-nallino-byblion s.54}."
  id: "Al-Battani menyebutkan metode lain: Waktu terbit bagian yang berada di tengah langit dengan planet di bola langit lurus diambil, dan setengah busur siang hari planet ditambahkan ke dalamnya, dan setengahnya dikurangi darinya. Jumlah yang ditambahkan adalah waktu terbit yang sesuai dengan derajat dari mana planet itu terbenam, dan jumlah yang dikurangi adalah waktu terbit yang sesuai dengan derajat di mana planet itu terbit di wilayah tersebut. Kemudian derajat yang sesuai diambil dalam tabel. {cite:zij-sabi-nallino-byblion p.54}."
