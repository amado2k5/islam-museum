label: { ar: "طريقة ثانية للطالع والغارب بقوس النهار", en: "A second way to the rising and setting degrees by the day arc", ur: "طلوع و غروب کے درجات کا دوسرا طریقہ قوسِ نہار کے ساتھ" }
summary:
  ar: "يذكر البتاني جهة أخرى: تؤخذ أزمان مطالع الجزء الذي يتوسط السماء مع الكوكب في الفلك المستقيم، فيُزاد عليها نصف قوس نهار الكوكب وكذلك يُنقص منها نصفها، فالمزيد عليه هو مطالع نظير الدرجة التي يغيب منها، والمنقوص منه هو مطالع الدرجة التي يطلع معها في الإقليم، ثم تؤخذ الدرج بإزائها في الجدول. {cite:zij-sabi-nallino-byblion p.54}."
  en: "Al-Battani gives another way: take the rising times of the part that culminates with the star in the right sphere, add the half day arc of the star to them and also take it from them; the sum is the rising of the opposite of the degree at which the star sets, and the remainder is the rising of the degree with which it rises in the clime, and the degrees against them are then taken from the table. {cite:zij-sabi-nallino-byblion p.54}."
  ur: "البتانی ایک اور طریقہ بتاتے ہیں: وہ جزء جو ستارے کے ساتھ وسط السماء میں آتا ہے اس کے فلک مستقیم کے مطالع کے ازمان لیے جائیں، ان میں ستارے کی نصف قوسِ نہار جمع بھی کی جائے اور گھٹائی بھی جائے؛ مجموعہ اس درجے کے نظیر کا مطلع ہے جس پر ستارہ ڈوبتا ہے، اور باقی اس درجے کا مطلع ہے جس کے ساتھ وہ اقلیم میں طلوع ہوتا ہے، پھر جدول میں ان کے مقابل درجے لیے جاتے ہیں۔ {cite:zij-sabi-nallino-byblion p.54}۔"
