id: concept/al-hadith-al-nabawi
class: concept
kind: term
label: { ar: "الحديث النبوي", en: "Hadith", fr: "Le hadith", es: "Hadiz" }
summary:
  ar: "الحديث النبوي ما أُثر عن النبي من قول أو فعل أو تقرير أو وصف، يصل إلينا بسند ينتهي إليه؛ وهو المصدر الثاني من مصادر الإسلام بعد القرآن: يبيّن مجمله ويقرر تفاصيل العبادة والمعاملة والسيرة والأخلاق. جُمع في مصنفات مرتبة على الأبواب أو على مسانيد الرواة، أشهرها الكتب الستة. وتعرض دائرة المعارف الإسلامية نشأته وجمعه وتدوينه وتصنيفه إلى صحيح وحسن وضعيف، وتعرض نقد الرواة وعلوم الحديث، ثم آراء الباحثين الغربيين فيه، كل ذلك منسوبًا إلى أصحابه."
  en: "Hadith is what is transmitted of the Prophet's words, deeds, tacit approvals and descriptions, reaching us through a chain of narrators ending at him; it is Islam's second source after the Qur'an, expounding its generals and fixing the details of worship, dealings, biography and conduct. It was gathered into works arranged by legal chapter or by narrator's musnad, most famously the six books. The Encyclopaedia of Islam traces its growth in authority, its collection and grading as sound, good or weak, the criticism of transmitters and the sciences of hadith, and sets out, labelled as theirs, the views of Western scholars."
  fr: "Le hadith transmet les paroles, les actes, les approbations tacites et les descriptions du Prophète par une chaîne de transmetteurs qui remonte jusqu’à lui. Deuxième source de l’islam après le Coran, il en explique les énoncés généraux et précise les détails du culte, des relations entre les personnes, de la biographie du Prophète et de la conduite. Il a été réuni dans des ouvrages classés par chapitre juridique ou par musnad de transmetteur, dont les plus connus sont les six livres. L’Encyclopaedia of Islam retrace l’essor de son autorité, sa mise en recueil, son classement en authentique, bon ou faible, la critique des transmetteurs et les sciences du hadith ; elle présente aussi les avis des chercheurs occidentaux, en les leur attribuant."
  ur: "حدیثِ نبوی وہ ہے جو نبی کے قول، فعل، تقریر اور وصف میں سے منقول ہو اور ایسی سند سے ہم تک پہنچے جو ان پر ختم ہوتی ہے؛ یہ قرآن کے بعد اسلام کا دوسرا ماخذ ہے جو عبادت، معاملات، سیرت اور اخلاق کی تفصیل متعین کرتا ہے۔ اسے ابواب یا راویوں کی مسانید پر مرتب کتابوں میں جمع کیا گیا، جن میں مشہور ترین کتبِ ستہ ہیں۔ اسلامی انسائیکلوپیڈیا اس کے مقام کے ارتقا، جمع و تدوین، صحیح، حسن اور ضعیف کی درجہ بندی، راویوں کی تنقید اور علومِ حدیث کو بیان کرتی ہے، اور مغربی علما کی آرا کو انھی کی طرف منسوب کر کے پیش کرتی ہے۔"
  es: "El hadiz es la transmisión de las palabras, acciones, aprobaciones tácitas y descripciones del Profeta, que nos llega a través de una cadena de narradores que culmina en él. Es la segunda fuente del Islam después del Corán, ya que expone sus principios generales y establece los detalles de la adoración, las relaciones, la biografía y la conducta. Se recopiló en obras organizadas por capítulo legal o por la cadena de transmisión (musnad) del narrador, siendo los seis libros los más conocidos. La Enciclopedia del Islam analiza su creciente autoridad, su recopilación y clasificación como fiable, buena o débil, la crítica a los transmisores y las ciencias del hadiz, y presenta, atribuyéndolas como propias, las opiniones de los eruditos occidentales."
