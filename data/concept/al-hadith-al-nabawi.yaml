label: { ar: "الحديث النبوي", en: "Hadith" }
summary:
  ar: "الحديث النبوي ما أُثر عن النبي من قول أو فعل أو تقرير أو وصف، يصل إلينا بسند ينتهي إليه؛ وهو المصدر الثاني من مصادر الإسلام بعد القرآن: يبيّن مجمله ويقرر تفاصيل العبادة والمعاملة والسيرة والأخلاق. جُمع في مصنفات مرتبة على الأبواب أو على مسانيد الرواة، أشهرها الكتب الستة. وتعرض دائرة المعارف الإسلامية نشأته وجمعه وتدوينه وتصنيفه إلى صحيح وحسن وضعيف، وتعرض نقد الرواة وعلوم الحديث، ثم آراء الباحثين الغربيين فيه، كل ذلك منسوبًا إلى أصحابه."
  en: "Hadith is what is transmitted of the Prophet's words, deeds, tacit approvals and descriptions, reaching us through a chain of narrators ending at him; it is Islam's second source after the Qur'an, expounding its generals and fixing the details of worship, dealings, biography and conduct. It was gathered into works arranged by legal chapter or by narrator's musnad, most famously the six books. The Encyclopaedia of Islam traces its growth in authority, its collection and grading as sound, good or weak, the criticism of transmitters and the sciences of hadith, and sets out, labelled as theirs, the views of Western scholars."
  ur: "حدیثِ نبوی وہ ہے جو نبی کے قول، فعل، تقریر اور وصف میں سے منقول ہو اور ایسی سند سے ہم تک پہنچے جو ان پر ختم ہوتی ہے؛ یہ قرآن کے بعد اسلام کا دوسرا ماخذ ہے جو عبادت، معاملات، سیرت اور اخلاق کی تفصیل متعین کرتا ہے۔ اسے ابواب یا راویوں کی مسانید پر مرتب کتابوں میں جمع کیا گیا، جن میں مشہور ترین کتبِ ستہ ہیں۔ اسلامی انسائیکلوپیڈیا اس کے مقام کے ارتقا، جمع و تدوین، صحیح، حسن اور ضعیف کی درجہ بندی، راویوں کی تنقید اور علومِ حدیث کو بیان کرتی ہے، اور مغربی علما کی آرا کو انھی کی طرف منسوب کر کے پیش کرتی ہے۔"
