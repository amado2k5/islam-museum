id: concept/hadath-impurity
class: concept
kind: legal
label: { ar: "الحدث ⁦(الطهارة من الحدث)⁩", en: "Ritual impurity (hadath)", ur: "حدث ⁦(طہارت کا حکم)⁩", es: "Impureza ritual (hadath)", fr: "Impureté rituelle (hadath)", tr: "Etkinlik (Olaydan Arınma)", id: "Peristiwa (Pemurnian dari Peristiwa)" }
summary:
  ar: "الحدث في اللغة الوقوع والتجدد، وفي الاصطلاح الفقهي وصف حكمي يحل بالأعضاء يزيل الطهارة ويمنع صحة الصلاة ونحوها، ويكون في أعضاء الوضوء في الحدث الأصغر وفي جميع البدن في الحدث الأكبر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6921} وقد يطلق على أسباب الوضوء أو الغسل، فالحنفية يعرفونه بخروج النجس من الآدمي معتادا كان أو غير معتاد، والمالكية بالخارج المعتاد من المخرج المعتاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6922} وخروج الخارج المعتاد من السبيلين ناقض بالاتفاق، وأما الدود والحصى والدم ونحوها فمختلف فيها: فالحنفية والشافعية والحنابلة يعدونها أحداثا، والمالكية لا يعدون غير المعتاد حدثا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6924} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6925} والنوم ناقض عند الجمهور بحسب هيئة النائم، فالحنفية يعدون المضطجع والمتكئ، والمالكية النوم الثقيل، والشافعية يفصلون بالتمكين من المقعدة، والحنابلة يفصلون بين المضطجع والقاعد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6928} ومس الفرج واللمس بالشهوة وقبلة الفم عند الجمهور من الأسباب المختلف فيها، والحنفية لا يعتبرون مس المرأة من الأحداث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6930} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6932} والقهقهة في الصلاة ناقضة عند الحنفية، وليست حدثا عند الجمهور، وأكل لحم الإبل ناقض عند الحنابلة وقول للشافعي، وغسل الميت لا يوجب الوضوء عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6933} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6934} ويحرم بالحدث الأصغر الصلاة بإجماع، والطواف عند جمهور الفقهاء، ومس المصحف، وما يحرم على المحدث حدثا أصغر يحرم على المحدث حدثا أكبر بطريق الأولى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6938} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6940} ويحرم على المحدث حدثا أكبر تلاوة القرآن بقصد التلاوة، والاعتكاف، والمكث في المسجد، والصيام بالحيض والنفاس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6941} ويرتفع الحدث الأكبر بالغسل، والأصغر بالغسل والوضوء، والتيمم بدل عند الجمهور لا يرفع الحدث بل يبيح الصلاة للضرورة، وعند الحنفية هو بدل مطلق يرفع الحدث إلى وجود الماء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6941}"
  en: "Impurity (hadath) is a legal quality that settles on the limbs, removes ritual purity and bars valid prayer and similar acts; it lies in the washed limbs for the minor kind and in the whole body for the major kind. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6921} The term also names the causes that require ablution or bathing: the Hanafis define it as the emission of impurity from a human being, whether customary or not, and the Malikis as the customary emission from the customary passage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6922} Customary emission from the two passages breaks ablution by agreement; worms, pebbles, blood and the like are disputed: the Hanafis, Shafi'is and Hanbalis count them, while the Malikis do not count an unusual discharge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6924} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6925} Sleep breaks ablution for the majority depending on posture: the Hanafis count lying or reclining, the Malikis heavy sleep, the Shafi'is distinguish whether the seat is firmly on the ground, and the Hanbalis separate the reclining from the sitting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6928} Touching the private parts, touching with desire and the kiss on the mouth are among the disputed causes; the Hanafis do not count touching a woman. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6930} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6932} Laughter in prayer breaks the prayer for the Hanafis but is not a cause for the majority; eating camel meat breaks ablution for the Hanbalis and one Shafi'i view; washing a corpse does not require ablution for the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6933} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6934} The minor impurity forbids prayer by consensus, the circumambulation for the majority, and touching the Qur'an; whatever is forbidden by the minor impurity is forbidden by the major impurity a fortiori. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6938} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6940} The major impurity additionally forbids reciting the Qur'an with intent to recite, seclusion in the mosque, staying in the mosque, and fasting for a menstruating or post-partum woman. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6941} Ritual washing lifts the major impurity, and ablution or washing lifts the minor; tayammum is a substitute which, for the majority, does not lift impurity but allows prayer in necessity, while for the Hanafis it is a general substitute that lifts impurity until water is found. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6941}"
  es: "La impureza (hadath) es una cualidad legal que se asienta en las extremidades, elimina la pureza ritual e impide la oración válida y actos similares; reside en las extremidades lavadas para el tipo menor y en todo el cuerpo para el tipo mayor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6921} El término también nombra las causas que requieren ablución o baño: los hanafíes la definen como la emisión de impureza de un ser humano, sea habitual o no, y los malikíes como la emisión habitual del conducto habitual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6922} La emisión habitual de los dos conductos rompe la ablución por acuerdo; los gusanos, guijarros, sangre y similares son objeto de controversia: los hanafíes, shafi'ís y hanbalíes los cuentan, mientras que los malikíes no cuentan una descarga inusual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6924} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6925} El sueño interrumpe la ablución para la mayoría dependiendo de la postura: los Hanafis cuentan estar acostado o reclinado, los Malikis el sueño profundo, los Shafi'is distinguen si el asiento está firmemente en el suelo, y los Hanbalis separan el reclinado de la posición sentada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6928} Tocar las partes íntimas, tocar con deseo y el beso en la boca se encuentran entre las causas disputadas; los Hanafis no cuentan tocar a una mujer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6930} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6932} La risa en la oración rompe la oración para los hanafíes, pero no es una causa para la mayoría; comer carne de camello rompe la ablución para los hanbalíes y una opinión shafi'í; lavar un cadáver no requiere ablución para la mayoría. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6933} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6934} La impureza menor prohíbe la oración por consenso, la circunvalación para la mayoría y tocar el Corán; todo lo que está prohibido por la impureza menor está prohibido por la impureza mayor a fortiori. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6936} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6937} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6938} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6940} La impureza principal además prohíbe recitar el Corán con la intención de recitar, la reclusión en la mezquita, permanecer en la mezquita y ayunar a una mujer que está menstruando o en posparto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6941} El lavado ritual elimina la impureza mayor, y la ablución o el lavado elimina la menor; el tayammum es un sustituto que, para la mayoría, no elimina la impureza pero permite la oración en caso de necesidad, mientras que para los hanafíes es un sustituto general que elimina la impureza hasta que se encuentra agua. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6941}"
  fr: "L'impureté (hadath) est une impureté légale qui se dépose sur les membres, altère la pureté rituelle et invalide la prière et les actes similaires; elle se situe dans les membres lavés pour l'impureté mineure et dans le corps entier pour l'impureté majeure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6921} Ce terme désigne également les causes qui requièrent l'ablution ou le bain rituel: les Hanafites la définissent comme l'émission d'impuretés par un être humain, qu'elle soit habituelle ou non, et les Malikites comme l'émission habituelle par les voies urinaires habituelles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6922} L'émission habituelle par les deux voies urinaires invalide l'ablution par consensus; la présence de vers, de cailloux, de sang, etc., fait débat: les Hanafites, les Chafiites et les Hanbalites les prennent en compte, tandis que les Malikites ne considèrent pas comme impureté un écoulement inhabituel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6924} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6925} Le sommeil interrompt les ablutions pour la majorité des fidèles, selon la posture: les hanafites considèrent comme annulation la position couchée ou semi-allongée, les malikites comme annulation du sommeil profond, les chaféites font la distinction entre la position assise et la position semi-allongée, et les hanbalites distinguent la position assise de la position semi-allongée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6928} Toucher les parties intimes, toucher avec désir et embrasser sur la bouche font partie des causes controversées; les hanafites ne considèrent pas comme annulation le fait de toucher une femme. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6930} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6932} Le rire pendant la prière invalide la prière pour les Hanafites, mais pas pour la majorité; la consommation de viande de chameau invalide les ablutions pour les Hanbalites et selon une opinion Shafi'ite; laver un cadavre ne requiert pas d'ablutions pour la majorité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6933} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6934} L'impureté mineure interdit la prière par consensus, la circumambulation pour la majorité, et le contact avec le Coran; tout ce qui est interdit par l'impureté mineure est a fortiori interdit par l'impureté majeure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6938} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6940} L'impureté majeure interdit en outre la récitation du Coran avec l'intention de le réciter, l'isolement dans la mosquée, le séjour dans la mosquée et le jeûne pour une femme en période de règles ou en post-partum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6941} Les ablutions rituelles lèvent l'impureté majeure, et les ablutions lèvent l'impureté mineure; le tayammum est un substitut qui, pour la majorité, ne lève pas l'impureté mais permet la prière en cas de nécessité, tandis que pour les hanafites, il s'agit d'un substitut général qui lève l'impureté jusqu'à ce que l'eau soit trouvée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6941}"
  ur: "نجاست ⁦(حدث)⁩ ایک قانونی خوبی ہے جو اعضاء پر جم جاتی ہے، رسم کی پاکیزگی کو دور کرتی ہے اور صحیح نماز اور اسی طرح کے اعمال کو روکتی ہے۔ یہ چھوٹی قسم کے دھوئے ہوئے اعضاء میں اور بڑی قسم کے لیے پورے جسم میں ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 6921} یہ اصطلاح ان اسباب کا بھی نام دیتی ہے جن کے لیے وضو یا غسل ضروری ہے: احناف اسے انسان سے نجاست کا اخراج کہتے ہیں، خواہ وہ رواج ہو یا نہ ہو، اور مالکیہ اس کو روایت سے خارج ہونے والی نجاست سے تعبیر کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6922} دونوں اقتباسات سے حسب روایت اخراج اتفاق سے وضو ٹوٹ جاتا ہے۔ کیڑے، کنکریاں، خون وغیرہ میں اختلاف ہے: حنفیہ، شافعی اور حنبلی ان کو شمار کرتے ہیں، جب کہ مالکیہ غیر معمولی اخراج کو شمار نہیں کرتے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 6924} {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 6925} جمہور کے لیے کرنسی کے اعتبار سے نیند ٹوٹ جاتی ہے: حنفیہ لیٹنا یا لیٹنا شمار کرتے ہیں، مالکیہ کا لیٹنا یا ٹیک لگانا، مالکیہ کی نشست بھاری ہے، خواہ شائقین زمین پر سوئے، زمین پر بیٹھنے کی وجہ سے سوتے ہیں۔ حنبلی لیٹنے کو بیٹھنے سے الگ کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6927} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص6928} شرمگاہ کو چھونا، شہوت سے چھونا اور منہ پر بوسہ دینا اختلافی اسباب میں سے ہیں۔ حنفیہ عورت کو چھونا شمار نہیں کرتے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ6929} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ6930} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ6931} ص6932} نماز میں ہنسنے سے احناف کی نماز ٹوٹ جاتی ہے لیکن جمہور کے لیے باعث نہیں ہے۔ اونٹ کا گوشت کھانے سے حنبلی اور ایک شافعی کا وضو ٹوٹ جاتا ہے۔ میت کو دھونے کے لیے جمہور کے لیے وضو ضروری نہیں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص6933} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6934} معمولی نجاست اجماع سے نماز، جمہور کے لیے طواف اور قرآن کو چھونا سے منع کرتی ہے۔ جو چیز معمولی نجاست سے حرام ہے وہ بڑی نجاست سے حرام ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ6936} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ6937} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ6938} ص6939 {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص6940} بڑی نجاست اس کے علاوہ تلاوت کی نیت سے قرآن کی تلاوت، مسجد میں خلوت، مسجد میں قیام اور حیض یا نفلی عورت کے لیے روزہ رکھنے سے بھی منع کرتی ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 ص6941} رسم دھونے سے بڑی نجاست دور ہوتی ہے، اور وضو یا غسل نابالغ کو دور کرتا ہے۔ تیمم ایک ایسا نعم البدل ہے جو جمہور کے نزدیک نجاست کو نہیں اٹھاتا بلکہ بوقت ضرورت نماز کی اجازت دیتا ہے، جب کہ احناف کے نزدیک یہ ایک عام متبادل ہے جو پانی ملنے تک نجاست کو دور کرتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص6941}"
  tr: "Dilbilimde 'hadat' meydana gelme ve yenilenme anlamına gelirken, fıkhih terminolojisinde ise saflığı ortadan kaldıran ve dua ile benzeri konuların geçerliliğini engelleyen uzuvlar için kullanılan hukuki bir terimdir. Küçük kirlilik sırasında abdest alma uzuvlarında, büyük kirlilik sırasında ise vücutta bulunur. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.6921} Abdest alma veya ritüel yıkamanın nedenlerine atıfta bulunabilir. Hanafiler bunu bir kişiden kirli madde boşaltımı olarak tanımlar; olağan olsun ya da olmasın, Malikiler ise olağan boşaltmanın dışında sayılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6922} İki yoldan olağan çıkış oybirliğiyle geçersizdir. Solucanlar, çakıllar, kan ve benzerleri konusunda anlaşmazlık vardır: Hanefiler, Şafiiler ve Hanbaliler bunları kirli olarak kabul ederken, Malikiler olağan dışı hiçbir şeyi kirlilik olarak görmezler. {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.. 6924} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6925} Çoğunluğa göre, uyuyan kişinin görünümüne göre uyku geçersiz sayılır. Hanafiler uyuyan ve koltuk kişiyi uyuyan kişi olarak görür, Malikiler ağır uyku olarak kabul eder, Şafiiler oturan kişiden ayrı, Hanbaliler ise yatan ile oturan arasında ayrı bulunur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6928} Çoğunluğa göre özel bölgelere dokunmak, arzu ile dokunmak ve ağız öpmek tartışmalı görüşlerin nedenlerindendir ve Hanefi okulu kadına dokunmayı küçük bir eylem olarak görmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6930} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6932} Hanefi okuluna göre namaz sırasında kahkaha geçersiz sayılır ve çoğunluğa göre hadis olarak kabul edilmez. Deve eti yemek Hanbali'ye göre geçersizdir, çoğunluğa göre ise ölülerin yıkanması için abdest alma gerekmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6933} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6934} Küçük kirli maddelerin çoğuna göre Kur'an'a dokunması oybirliğiyle yasaktır, küçük bir kirlilik için yasak olan şeyin hadis âliminin birinci görüşe göre büyük hadis yapması yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6938} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6940} Büyük bir kirliliğe sahip kişinin (hahaad) Kur'an'ı okumak, itilaf etmek, camide kalması ve adet dönemi ile doğum sonrası kanama sırasında oruç tutması yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6941} Büyük kirlilik ghusl ile, küçük kirlilik ise gusl ve abdest alma ile yükseltilir. Tayammum, kirliliği kaldırmayan ancak zorunluluktan namaz kılan çoğunluğun yerine geçen bir ikamedir. Hanefilere göre, kirliliği suyun varlığına yükselten mutlak bir ikamedir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6941}"
  id: "Dalam linguistik, 'hadath' berarti terjadinya dan pembaruan, dan dalam terminologi yurisprudensi, istilah ini berlaku untuk anggota tubuh yang menghilangkan kemurnian dan menghalangi keabsahan doa serta hal-hal serupa. Istilah ini ditemukan pada anggota tubuh saat wudhu saat kotoran ringan dan di seluruh tubuh selama ketidakmurnian besar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6921} Istilah ini dapat merujuk pada penyebab wudhu atau ritual mencuci. Hanafi mendefinisikannya sebagai pembuangan kotoran dari seseorang, baik biasa maupun tidak, sementara Mali menganggapnya di luar limbah biasa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6922} Keluar biasa dari kedua jalan tersebut secara bulat tidak sah. Adapun cacing, kerikil, darah, dan sejenisnya, ada perbedaan pendapat: Hanafi, Shafi'i, dan Hanbal menganggapnya sebagai kotoran, sedangkan Maliki tidak menganggap sesuatu yang aneh sebagai kotoran. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm. 6924} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6925} Menurut mayoritas, tidur dianggap tidak sah berdasarkan penampilan orang yang tidur. Hanafi menganggap yang tidur dan duduk malas adalah orang yang tidur, Maliki menganggap tidur berat, Shafi'i terpisah dari yang duduk, dan Hanbal memisahkan antara yang berbaring dan duduk. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6928} Menyentuh bagian pribadi, menyentuh dengan hasrat, dan mencium mulut menurut mayoritas adalah alasan pendapat yang diperdebatkan, dan aliran Hanafi tidak menganggap menyentuh wanita sebagai tindakan kecil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6930} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6932} Tawa saat salat dianggap tidak sah menurut mazhab Hanafi dan tidak dianggap hadits menurut mayoritas. Makan daging unta tidak sah menurut Hanbali, menurut syafi'i, dan mencuci orang yang meninggal tidak memerlukan wudhu menurut mayoritas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6933} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6934} Secara bulat dilarang untuk kotoran kecil, Tawaf menurut mayoritas ahli hukum, yang menyentuh Al-Qur'an, dan apa yang dilarang untuk ketidakmurnian kecil dilarang bagi ulama hadis melakukan hadis besar menurut pendapat pertama. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6938} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6940} Dilarang bagi orang yang memiliki najis besar (hahaad) untuk membaca Al-Qur'an dengan niat membaca, i'tikaf, tinggal di masjid, dan berpuasa selama menstruasi dan pendarahan pasca melahirkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6941} Kotoran utama meningkat oleh ghusl, dan kotoran kecil meningkat dengan ghusl dan wudhu. Tayammum adalah pengganti mayoritas yang tidak menghilangkan kotoran tetapi mengizinkan shalat karena kebutuhan. Menurut Hanafi, ini adalah pengganti mutlak yang mengangkat kotoran menjadi kehadiran air. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6941}"
