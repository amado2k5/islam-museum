label: { ar: "الحدث (الطهارة من الحدث)", en: "Ritual impurity (hadath)", ur: "حدث (طہارت کا حکم)" }
summary:
  ar: "الحدث في اللغة الوقوع والتجدد، وفي الاصطلاح الفقهي وصف حكمي يحل بالأعضاء يزيل الطهارة ويمنع صحة الصلاة ونحوها، ويكون في أعضاء الوضوء في الحدث الأصغر وفي جميع البدن في الحدث الأكبر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6921} وقد يطلق على أسباب الوضوء أو الغسل، فالحنفية يعرفونه بخروج النجس من الآدمي معتادا كان أو غير معتاد، والمالكية بالخارج المعتاد من المخرج المعتاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6922} وخروج الخارج المعتاد من السبيلين ناقض بالاتفاق، وأما الدود والحصى والدم ونحوها فمختلف فيها: فالحنفية والشافعية والحنابلة يعدونها أحداثا، والمالكية لا يعدون غير المعتاد حدثا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6924} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6925} والنوم ناقض عند الجمهور بحسب هيئة النائم، فالحنفية يعدون المضطجع والمتكئ، والمالكية النوم الثقيل، والشافعية يفصلون بالتمكين من المقعدة، والحنابلة يفصلون بين المضطجع والقاعد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6928} ومس الفرج واللمس بالشهوة وقبلة الفم عند الجمهور من الأسباب المختلف فيها، والحنفية لا يعتبرون مس المرأة من الأحداث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6930} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6932} والقهقهة في الصلاة ناقضة عند الحنفية، وليست حدثا عند الجمهور، وأكل لحم الإبل ناقض عند الحنابلة وقول للشافعي، وغسل الميت لا يوجب الوضوء عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6933} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6934} ويحرم بالحدث الأصغر الصلاة بإجماع، والطواف عند جمهور الفقهاء، ومس المصحف، وما يحرم على المحدث حدثا أصغر يحرم على المحدث حدثا أكبر بطريق الأولى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6938} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6940} ويحرم على المحدث حدثا أكبر تلاوة القرآن بقصد التلاوة، والاعتكاف، والمكث في المسجد، والصيام بالحيض والنفاس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6941} ويرتفع الحدث الأكبر بالغسل، والأصغر بالغسل والوضوء، والتيمم بدل عند الجمهور لا يرفع الحدث بل يبيح الصلاة للضرورة، وعند الحنفية هو بدل مطلق يرفع الحدث إلى وجود الماء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6941}"
  en: "Impurity (hadath) is a legal quality that settles on the limbs, removes ritual purity and bars valid prayer and similar acts; it lies in the washed limbs for the minor kind and in the whole body for the major kind. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6921} The term also names the causes that require ablution or bathing: the Hanafis define it as the emission of impurity from a human being, whether customary or not, and the Malikis as the customary emission from the customary passage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6922} Customary emission from the two passages breaks ablution by agreement; worms, pebbles, blood and the like are disputed: the Hanafis, Shafi'is and Hanbalis count them, while the Malikis do not count an unusual discharge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6924} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6925} Sleep breaks ablution for the majority depending on posture: the Hanafis count lying or reclining, the Malikis heavy sleep, the Shafi'is distinguish whether the seat is firmly on the ground, and the Hanbalis separate the reclining from the sitting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6928} Touching the private parts, touching with desire and the kiss on the mouth are among the disputed causes; the Hanafis do not count touching a woman. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6930} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6932} Laughter in prayer breaks the prayer for the Hanafis but is not a cause for the majority; eating camel meat breaks ablution for the Hanbalis and one Shafi'i view; washing a corpse does not require ablution for the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6933} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6934} The minor impurity forbids prayer by consensus, the circumambulation for the majority, and touching the Qur'an; whatever is forbidden by the minor impurity is forbidden by the major impurity a fortiori. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6938} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6940} The major impurity additionally forbids reciting the Qur'an with intent to recite, seclusion in the mosque, staying in the mosque, and fasting for a menstruating or post-partum woman. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6941} Ritual washing lifts the major impurity, and ablution or washing lifts the minor; tayammum is a substitute which, for the majority, does not lift impurity but allows prayer in necessity, while for the Hanafis it is a general substitute that lifts impurity until water is found. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6941}"
