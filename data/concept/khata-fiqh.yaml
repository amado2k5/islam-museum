id: concept/khata-fiqh
class: concept
kind: term
label:
  ar: الخطأ
  en: Khata' (error, unintended act)
  ur: خطأ
summary:
  ar: 'الخطأ لغة نقيض الصواب، وأخطأ الطريق عدل عنه، وأخطأ الرامي الغرض لم يصبه؛ والخطيئة الذنب والإثم، وخطىء إذا تعمد وأخطأ إذا لم يتعمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7652}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7653} اصطلاحا فعل يصدر من الإنسان بلا قصد إليه عند مباشرة أمر مقصود سواه، وعرفه الكمال بن الهمام بأن يقصد بالفعل غير المحل الذي يقصد به الجناية، كالمضمضة تسري إلى حلق الصائم، والرمي إلى صيد فيصيب آدميا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7653} الغلط عند جمهور الفقهاء يساوي الخطأ؛ وفرق بعض المالكية بأن الخطأ متعلق بالجنان والغلط باللسان، لكن يأخذ الغلط حكم الخطأ؛ وفرق أبو هلال العسكري بأن الغلط وضع الشيء في غير موضعه وقد يكون صوابا في نفسه، والخطأ لا يكون صوابا على وجه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7653} وجمهور الفقهاء يعبرون عما يجري على اللسان بغير قصد بلفظ الخطأ، والمالكية يعبرون عما يتعلق بالاعتقاد بالغلط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7654} الألفاظ المتقاربة: النسيان والسهو والغفلة والذهول، والإكراه (حمل الغير على ما لا يرضاه، وهو مختار غير ملجأ)، والهزل (أن لا يراد باللفظ معنى)، والجهل (بسيط أو مركب)؛ والمخطئ غير مكلف فيما أخطأ فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7654}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7655} الجهل والخطأ عذر في المنهيات دون المأمورات، ولا يعتبر عذرا في حقوق الآدميين فيضمن الجاهل والمخطئ ما أتلفاه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7655} اختلف الأصوليون في وصف فعل المخطئ بالحل والحرمة؛ الأسنوي يرى أن الحل والحرمة من الأحكام المتعلقة بالمكلفين فلا يوصف، والشاطبي يرى أن الخطأ والنسيان من مرتبة العفو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7655}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7656} جمهور الفقهاء على أن الخطأ عذر في إسقاط بعض حقوق الله لا كلها، ويستدلون بحديث «رفع عن أمتي الخطأ والنسيان»؛ وحقوق العباد لا تسقط بالخطأ، فيجب ضمان المتلفات والديات، لأن الضمان من خطاب الوضع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7656}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7657} القرطبي يفصل: قسم لا يسقط باتفاق كالغرامات والديات والصلوات المفروضة، وقسم يسقط باتفاق كالقصاص والنطق بكلمة الكفر، وقسم مختلف فيه كمن أكل ناسيا في رمضان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7657} قاعدة «لا عبرة بالظن البين خطؤه» عند الحنفية والشافعية، ومن تطبيقاتها أن من ظن ضيق وقت الفجر فصلاه قبل العشاء ثم بان سعة الوقت أعاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7658}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7659} ومن تطبيقات الشافعية: من ظن أنه متطهر فصلى ثم بان حدثه، أو ظن أن إمامه مسلم فبان كافرا، فالصلاة باطلة في الغالب؛ والمالكية يعبرون بقاعدة الظهور والانكشاف، وابن رجب يورد قواعد في من تصرف في شيء يظن أنه لا يملكه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7659}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7660} الخطأ في الطهارة: من اجتهد في إناء أو ثوب ثم ظهر نجسا لزمته الإعادة عند الحنفية والشافعية وقول عند المالكية، وعند الحنابلة لا تدخل المسألة على قواعدهم؛ والخطأ في نية الوضوء: إذا نوى رفع حدث غيره فالتداخل يرفع الجميع عند المالكية والشافعية والحنابلة إن لم يكن عمدا؛ والحنفية لا يشترطون النية في الوضوء والغسل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7661}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7662} الخطأ في الغسل والتيمم: نية رفع جنابة الجماع وكانت من احتلام لا تضر عند الشافعية والحنفية؛ وإذا نوت الحائض رفع الجنابة دون الحيض ففيه خلاف عند المالكية؛ والجنب يتيمم ناسيا لجنابته ففيه قولان عند مالك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7662}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7663} وما زال الباب مفتوحا في الصفحات التالية. في التيمم: المالكية وابن مسلمة يجوزون، والشافعية يصححون نية استباحة الصلاة بالحدث الأصغر لمن كان جنبا غلطا، والحنابلة يشترطون تعيين ما يتيمم له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7664} من كان في رحله ماء فأخطأه فطلبه ولم يجده فتيمم وصلى أجزأه عند المالكية والحنابلة ووجه عند الشافعية، والوجه الآخر عندهم يوجب الإعادة لتفريطه في حفظ الرحل. وإذا علم بالماء فظن أنه نفد فتيمم وصلى أعاد عند الحنفية والمالكية والأصح عند الشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7664}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7665} الخطأ في النية في الصلاة: إذا كان الشيء لا يشترط تعيينه لم يضر الخطأ فيه، كتعيين المكان والزمان، ويضر الخطأ فيما يشترط تعيينه كالخطأ من الظهر إلى العصر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7665} ومن أمثلة الاقتداء: الخطأ في معرفة الإمام لا يضر عند الأكثر، ومن نوى الصلاة على زيد فبان غيره لم تصح عند جمهور المذاهب، والخطأ في جنس الميت خلاف عند الحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7665}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7666} صلاة القضاء والأداء والخطأ في اليوم: المالكية يحكمون بصحتها غالبا، والحنفية والشافعية يبطلونها إلا في صور، والحنابلة يصححون القضاء بنية أداء إذا بان الخلاف في الظن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7666}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7667} الخطأ في دخول الوقت: الصلاة قبل الوقت باطلة باتفاق، عمدا أو خطأ؛ وتشترط عند الشافعية المعرفة اليقينية أو الظن المعتبر، وعند الحنابلة يكفي غلبة الظن، فإذا تبين أنه صلى قبل الوقت أعاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7667}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7668} الخطأ في القبلة: الحنفية يجيزون الاجتهاد ولا إعادة على من أخطأ بعد التحري؛ والمالكية يعيدون في الوقت مع ظهور العلامات إن استدبر أو انحرف؛ والشافعية قولان عند تيقن الخطأ؛ والحنابلة لا إعادة على المجتهد، والبصير في الحضر والأعمى بلا دليل يعيدان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7668} الخطأ في القراءة: الحنفية يفرقون بين الخطأ في الإعراب الذي لا يغير المعنى فلا تفسد، والتغيير الفاحش فتفسد في قول المتقدمين، وفي الحروف والكلمات يبحثون في تبديل الحرف والتقديم والتأخير والزيادة والنقص؛ ويعتبرون الكلمة المتقاربة في المعنى مما لا يفسد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7668}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7669}'
  en: 'Khata'' is lexically the opposite of right; one who misses the way strays from it, and an archer who misses the target has not hit it; khati''a is a sin, the verb with intent being khatiya and without intent akhta''a. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7652}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7653} Technically it is an act done without intent toward the object of the act: Kamal ibn al-Humam gives the example of rinsing the mouth that reaches a fasting man''s throat, and shooting at game that hits a human. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7653} Most jurists treat ghalat as equal to khata''; some Malikis distinguish that khata'' is in the heart and ghalat in the tongue, yet ghalat takes khata''s ruling; Abu Hilal al-''Askari distinguishes that ghalat is placing a thing out of its place and may be right in itself, while khata'' is never right in any way. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7653} Most jurists use khata'' for what slips from the tongue without intent, while the Malikis use ghalat for what concerns belief. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7654} Near terms are forgetfulness, inattention, distraction and heedlessness; compulsion (forcing another against his will, short of compulsion that removes choice); jest (speaking without meaning); and ignorance, simple or compound; the one in error is not responsible for what he erred in. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7654}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7655} Ignorance and error excuse in what is forbidden, not in what is commanded; they excuse nothing in the rights of persons, so the ignorant and mistaken pay for what they destroy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7655} The usulis differ on whether the act of one in error can be called lawful or unlawful: al-Asnawi holds that lawful and unlawful apply to accountable persons, so the error is not described; al-Shatibi holds that error and forgetfulness are in a zone of pardon. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7655}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7656} Most jurists hold that error excuses some of God''s rights but not all, citing the report "God has lifted from my community error and forgetfulness"; the rights of people are not lifted by error, so destroyed property and blood-money are owed, since that is a rule of ruling not of commanding. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7656}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7657} Al-Qurtubi distinguishes: the kind that is never lifted, such as fines, blood-money and the obligatory prayers; the kind always lifted, such as retaliation and uttering unbelief under duress; and the disputed kind, such as one who eats in Ramadan by forgetting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7657} The maxim "no weight is given to a clearly mistaken assumption" is held by the Hanafis and Shafiis; a case: one who thought the dawn was near and prayed it before the missed isha, then saw the time was long, must repeat the dawn prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7658}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7659} Shafii cases: one who thought himself pure, prayed, and then his impurity appeared, or who prayed behind an imam he thought Muslim who proved an unbeliever, and so on, mostly void. The Malikis use the maxim of clear manifestation; Ibn Rajab sets out rules on one who disposes of what he thinks he does not own. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7659}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7660} Error in purity: one who judges a vessel or cloth by guesswork and then finds it impure must repeat, by the Hanafis, Shafiis and one Maliki view; the Hanbalis do not apply the same rule. Error in the intention for wudu: by agreement of Malikis, Shafiis and Hanbalis the lesser intention can be overtaken; the Hanafis do not require intention for wudu or washing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7661}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7662} Error in the intention for the major washing and dry ablution: intending the washing for sexual impurity when it came from a wet dream is not harmful for the Shafiis and Hanafis; a menstruating woman intending only the major impurity raises a Maliki dispute. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7662}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7663} The entry continues in the following pages. On dry ablution: the Malikis and Ibn Maslama permit it, the Shafiis accept a mistaken intention for the minor state when one is in the major, and the Hanbalis require the purpose to be specified. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7664} One who had water in his baggage, forgot it, searched, found none, dry-ablutes and prays: valid for the Malikis, one Shafii view and the Hanbalis; the other Shafii view requires repetition for his neglect of the baggage. One who knew of the water but thought it was used up must repeat, by the Hanafis, Malikis, the sounder Shafii view and the Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7664}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7665} In prayer intention: where the thing need not be specified, error does no harm, as with the place, the time and the number of units; where it must be specified, error harms, as with a noon prayer intended as an afternoon one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7665} On following an imam: error about his identity usually does no harm; intending to pray over one person and finding another invalidates the funeral prayer by most schools, and the Hanbalis differ on the sex of the dead. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7665}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7666} On ada'' and qada'' and the wrong day: the Malikis generally validate; the Hanafis and Shafiis invalidate except in certain cases; the Hanbalis validate qada'' with a mistaken ada'' intention when the error shows against belief. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7666}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7667} On prayer before the time: invalid by agreement, whether by design or error. The Shafiis require certain knowledge or a valid estimate; the Hanbalis accept a strong estimate, and repeat if the prayer proves early. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7667}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7668} On error in the qibla: the Hanafis accept ijtihad without repetition; the Malikis repeat within the time if clear signs were present and one faced the wrong way; the Shafiis have two views once error is certain; the Hanbalis require no repetition for the ijtihad, but the sighted at home and the blind without a guide repeat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7668} On error in recitation: the Hanafis distinguish errors of inflection, which do not invalidate unless they change the meaning badly, from errors of letters and words, and treat near-synonyms as harmless. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7668}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7669}'
  ur: 'خطأ لغت میں صواب کی ضد ہے؛ راستہ سے بھٹکنا، اور تیر انداز کا نشانے سے چوک جانا؛ خطیئہ گناہ اور جرم ہے، جان بوجھ کر ہو تو خطِئ اور بغیر ارادے کے ہو تو اخطأ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7652}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7653} اصطلاح میں یہ وہ فعل ہے جو کسی مقصود کام کے دوران بغیر ارادے کے صادر ہو؛ کمال بن الہمام کے نزدیک یہ ہے کہ فعل کا قصد کسی اور محل کا ہو جس پر جنایت ہو، جیسے روزہ دار کے حلق میں کلی کا پانی پہنچنا، یا شکار پر تیر چلانا اور آدمی کو لگ جانا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7653} جمہور کے نزدیک غلط خطأ کے برابر ہے؛ بعض مالکیہ کے نزدیک خطأ دل سے متعلق ہے اور غلط زبان سے، مگر غلط خطأ کا حکم لیتا ہے؛ ابو ہلال عسکری کے نزدیک غلط کسی چیز کو غلط جگہ رکھنا ہے جو اپنی ذات میں درست ہو سکتی ہے، جبکہ خطأ کسی وجہ سے درست نہیں ہوتی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7653} جمہور فقہاء زبان سے بغیر ارادے کے نکلنے والی بات کو خطأ کہتے ہیں، جبکہ مالکیہ عقیدے سے متعلق چیز کو غلط کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7654} قریب المعنی الفاظ: بھول، سہو، غفلت، ذہول؛ اکراہ (دوسرے کو وہ کام کرانا جو وہ نہ چاہے)؛ ہزل (لفظ بے معنی بولنا)؛ اور جہل (سادہ یا مرکب)؛ خطا کرنے والا اس میں غیر مکلف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7654}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7655} جہل اور خطأ منہیات میں عذر ہیں، مأمورات میں نہیں؛ حقوق العباد میں عذر نہیں، اس لیے جاہل اور خطا کار جو تلف کریں اس کا ضمان دیتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7655} اصولیوں کا اختلاف ہے کہ خطا کار کے فعل کو حلال یا حرام کہا جائے یا نہیں؛ اسنوی کے نزدیک یہ مکلفین کے احکام ہیں تو اس پر وصف نہیں؛ شاطبی کے نزدیک خطأ اور نسیان عفو کے درجے میں ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7655}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7656} جمہور کے نزدیک خطأ اللہ کے بعض حقوق میں عذر ہے، کل میں نہیں؛ حدیث «رفع عن أمتي الخطأ والنسيان» سے استدلال کیا گیا؛ حقوق العباد خطأ سے ساقط نہیں ہوتے، اس لیے تلف شدہ مال اور دیت لازم ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7656}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7657} قرطبی کی تفصیل: ایک قسم جو کبھی ساقط نہیں ہوتی جیسے تاوان، دیت اور فرض نمازیں؛ دوسری جو بالاتفاق ساقط ہوتی ہے جیسے قصاص اور کفر کا کلمہ؛ اور تیسری مختلف فیہ جیسے رمضان میں بھول کر کھانا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7657} قاعدہ «لا عبرة بالظن البين خطؤه» حنفیہ اور شافعیہ کے نزدیک؛ مثال: کسی نے فجر کا وقت تنگ سمجھ کر فجر پڑھ لی اور بعد میں عشاء کی قضا کا وقت وسیع نکلا تو فجر دوبارہ پڑھے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7658}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7659} شافعیہ کی مثالیں: کسی نے خود کو باوضو سمجھ کر نماز پڑھی پھر بے وضو نکلا، یا کافر امام کو مسلم سمجھ کر اقتدا کی؛ مالکیہ ظہور و انکشاف کا قاعدہ بیان کرتے ہیں؛ ابن رجب ایسے تصرف کے قواعد بیان کرتے ہیں جو اپنی ملک نہ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7659}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7660} طہارت میں خطا: برتن یا کپڑے میں اجتہاد سے پاک سمجھ کر استعمال کیا پھر نجس نکلا تو حنفیہ، شافعیہ اور مالکیہ کے ایک قول میں اعادہ لازم؛ وضو کی نیت میں خطا: مالکیہ، شافعیہ اور حنابلہ کے نزدیک دوسرے حدث کی نیت پر تداخل سے رفع ہو جاتا ہے؛ حنفیہ وضو اور غسل میں نیت شرط نہیں کرتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7661}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7662} غسل اور تیمم میں خطا: احتلام کے بعد جنابتِ جماع کی نیت شافعیہ اور حنفیہ کے نزدیک مضر نہیں؛ حائضہ نے صرف جنابت کی نیت کی تو مالکیہ میں اختلاف ہے؛ جنب نے بھول کر حدث کی نیت سے تیمم کیا تو امام مالک سے دو قول ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7662}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7663} یہ مدخل اگلے صفحات میں جاری ہے۔ تیمم میں: مالکیہ اور ابن مسلمہ جائز کہتے ہیں، شافعیہ جنب کے لیے حدث اصغر کی غلط نیت صحیح کہتے ہیں، حنابلہ مقصد متعین کرنے کو شرط کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7664} جس کے سامان میں پانی تھا اور بھول کر تلاش کر کے نہ ملا تو تیمم سے نماز مالکیہ، شافعیہ کے ایک قول اور حنابلہ کے نزدیک درست ہے، شافعیہ کے دوسرے قول میں سامان کی حفاظت میں کوتاہی پر اعادہ لازم ہے۔ جس کو پانی کا علم تھا مگر گمان کیا کہ ختم ہو گیا، وہ حنفیہ، مالکیہ، شافعیہ کے اصح اور حنابلہ کے نزدیک اعادہ کرے گا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7664}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7665} نیت میں خطا: جس چیز کا متعین کرنا شرط نہیں اس میں خطا مضر نہیں جیسے جگہ، وقت اور رکعتوں کی تعداد؛ اور جس کا تعین شرط ہے اس میں مضر ہے جیسے ظہر کی نیت سے عصر ادا کرنا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7665} امام کی شناخت میں خطا اکثر کے نزدیک مضر نہیں؛ کسی ایک کا جنازہ پڑھنے کی نیت کی اور دوسرا نکلا تو جمہور کے نزدیک نماز باطل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7665}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7666} ادا اور قضا اور غلط دن کی نیت: مالکیہ اکثر صحیح قرار دیتے ہیں، حنفیہ اور شافعیہ کچھ صورتوں کے سوا باطل کہتے ہیں، حنابلہ قضا کو ادا کی نیت سے صحیح مانتے ہیں جب گمان کا خلاف ظاہر ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7666}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7667} وقت سے پہلے نماز باتفاق باطل ہے؛ شافعیہ یقین یا معتبر گمان مانگتے ہیں، حنابلہ غالب گمان کافی سمجھتے ہیں اور وقت سے پہلے نکلنے پر اعادہ کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7667}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7668} قبلے میں خطا: حنفیہ اجتہاد کو کافی سمجھتے ہیں؛ مالکیہ علامات ظاہر ہوں تو وقت میں اعادہ کرتے ہیں؛ شافعیہ خطا یقینی ہونے پر دو قول رکھتے ہیں؛ حنابلہ مجتہد پر اعادہ نہیں کرتے، مگر حضر میں بینا اور بغیر رہنما کے نابینا اعادہ کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7668} قراءت میں خطا: حنفیہ اعراب کی غلطی کو، جو معنی نہ بدلے، مضر نہیں مانتے، اور فاحش تبدیلی کو متقدمین کے نزدیک مفسد؛ حروف اور کلمات میں بدلاؤ، تقدیم و تاخیر، زیادتی اور کمی کی تفصیل دیتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7668}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7669}'
