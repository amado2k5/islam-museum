id: concept/khata-fiqh
class: concept
kind: term
label:
  ar: الخطأ
  en: Khata' (error, unintended act)
  ur: خطأ
  es: "Khata' (error, acto no intencionado)"
  fr: "Khata' (erreur, acte involontaire)"
  tr: "Hata"
  id: "Kesalahan"
summary:
  ar: 'الخطأ لغة نقيض الصواب، وأخطأ الطريق عدل عنه، وأخطأ الرامي الغرض لم يصبه؛ والخطيئة الذنب والإثم، وخطىء إذا تعمد وأخطأ إذا لم يتعمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7652}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7653} اصطلاحا فعل يصدر من الإنسان بلا قصد إليه عند مباشرة أمر مقصود سواه، وعرفه الكمال بن الهمام بأن يقصد بالفعل غير المحل الذي يقصد به الجناية، كالمضمضة تسري إلى حلق الصائم، والرمي إلى صيد فيصيب آدميا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7653} الغلط عند جمهور الفقهاء يساوي الخطأ؛ وفرق بعض المالكية بأن الخطأ متعلق بالجنان والغلط باللسان، لكن يأخذ الغلط حكم الخطأ؛ وفرق أبو هلال العسكري بأن الغلط وضع الشيء في غير موضعه وقد يكون صوابا في نفسه، والخطأ لا يكون صوابا على وجه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7653} وجمهور الفقهاء يعبرون عما يجري على اللسان بغير قصد بلفظ الخطأ، والمالكية يعبرون عما يتعلق بالاعتقاد بالغلط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7654} الألفاظ المتقاربة: النسيان والسهو والغفلة والذهول، والإكراه ⁦(حمل الغير على ما لا يرضاه، وهو مختار غير ملجأ)⁩، والهزل ⁦(أن لا يراد باللفظ معنى)⁩، والجهل ⁦(بسيط أو مركب)⁩؛ والمخطئ غير مكلف فيما أخطأ فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7654}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7655} الجهل والخطأ عذر في المنهيات دون المأمورات، ولا يعتبر عذرا في حقوق الآدميين فيضمن الجاهل والمخطئ ما أتلفاه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7655} اختلف الأصوليون في وصف فعل المخطئ بالحل والحرمة؛ الأسنوي يرى أن الحل والحرمة من الأحكام المتعلقة بالمكلفين فلا يوصف، والشاطبي يرى أن الخطأ والنسيان من مرتبة العفو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7655}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7656} جمهور الفقهاء على أن الخطأ عذر في إسقاط بعض حقوق الله لا كلها، ويستدلون بحديث «رفع عن أمتي الخطأ والنسيان»؛ وحقوق العباد لا تسقط بالخطأ، فيجب ضمان المتلفات والديات، لأن الضمان من خطاب الوضع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7656}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7657} القرطبي يفصل: قسم لا يسقط باتفاق كالغرامات والديات والصلوات المفروضة، وقسم يسقط باتفاق كالقصاص والنطق بكلمة الكفر، وقسم مختلف فيه كمن أكل ناسيا في رمضان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7657} قاعدة «لا عبرة بالظن البين خطؤه» عند الحنفية والشافعية، ومن تطبيقاتها أن من ظن ضيق وقت الفجر فصلاه قبل العشاء ثم بان سعة الوقت أعاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7658}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7659} ومن تطبيقات الشافعية: من ظن أنه متطهر فصلى ثم بان حدثه، أو ظن أن إمامه مسلم فبان كافرا، فالصلاة باطلة في الغالب؛ والمالكية يعبرون بقاعدة الظهور والانكشاف، وابن رجب يورد قواعد في من تصرف في شيء يظن أنه لا يملكه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7659}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7660} الخطأ في الطهارة: من اجتهد في إناء أو ثوب ثم ظهر نجسا لزمته الإعادة عند الحنفية والشافعية وقول عند المالكية، وعند الحنابلة لا تدخل المسألة على قواعدهم؛ والخطأ في نية الوضوء: إذا نوى رفع حدث غيره فالتداخل يرفع الجميع عند المالكية والشافعية والحنابلة إن لم يكن عمدا؛ والحنفية لا يشترطون النية في الوضوء والغسل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7661}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7662} الخطأ في الغسل والتيمم: نية رفع جنابة الجماع وكانت من احتلام لا تضر عند الشافعية والحنفية؛ وإذا نوت الحائض رفع الجنابة دون الحيض ففيه خلاف عند المالكية؛ والجنب يتيمم ناسيا لجنابته ففيه قولان عند مالك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7662}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7663} وما زال الباب مفتوحا في الصفحات التالية. في التيمم: المالكية وابن مسلمة يجوزون، والشافعية يصححون نية استباحة الصلاة بالحدث الأصغر لمن كان جنبا غلطا، والحنابلة يشترطون تعيين ما يتيمم له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7664} من كان في رحله ماء فأخطأه فطلبه ولم يجده فتيمم وصلى أجزأه عند المالكية والحنابلة ووجه عند الشافعية، والوجه الآخر عندهم يوجب الإعادة لتفريطه في حفظ الرحل. وإذا علم بالماء فظن أنه نفد فتيمم وصلى أعاد عند الحنفية والمالكية والأصح عند الشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7664}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7665} الخطأ في النية في الصلاة: إذا كان الشيء لا يشترط تعيينه لم يضر الخطأ فيه، كتعيين المكان والزمان، ويضر الخطأ فيما يشترط تعيينه كالخطأ من الظهر إلى العصر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7665} ومن أمثلة الاقتداء: الخطأ في معرفة الإمام لا يضر عند الأكثر، ومن نوى الصلاة على زيد فبان غيره لم تصح عند جمهور المذاهب، والخطأ في جنس الميت خلاف عند الحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7665}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7666} صلاة القضاء والأداء والخطأ في اليوم: المالكية يحكمون بصحتها غالبا، والحنفية والشافعية يبطلونها إلا في صور، والحنابلة يصححون القضاء بنية أداء إذا بان الخلاف في الظن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7666}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7667} الخطأ في دخول الوقت: الصلاة قبل الوقت باطلة باتفاق، عمدا أو خطأ؛ وتشترط عند الشافعية المعرفة اليقينية أو الظن المعتبر، وعند الحنابلة يكفي غلبة الظن، فإذا تبين أنه صلى قبل الوقت أعاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7667}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7668} الخطأ في القبلة: الحنفية يجيزون الاجتهاد ولا إعادة على من أخطأ بعد التحري؛ والمالكية يعيدون في الوقت مع ظهور العلامات إن استدبر أو انحرف؛ والشافعية قولان عند تيقن الخطأ؛ والحنابلة لا إعادة على المجتهد، والبصير في الحضر والأعمى بلا دليل يعيدان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7668} الخطأ في القراءة: الحنفية يفرقون بين الخطأ في الإعراب الذي لا يغير المعنى فلا تفسد، والتغيير الفاحش فتفسد في قول المتقدمين، وفي الحروف والكلمات يبحثون في تبديل الحرف والتقديم والتأخير والزيادة والنقص؛ ويعتبرون الكلمة المتقاربة في المعنى مما لا يفسد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7668}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7669} الخطأ في القراءة يتصل بالمأموم: المالكية يبحثون في صلاة المقتدي باللاحن، فيبطلها بعض المالكية مطلقا أو على تفصيل، ويصححونها إذا عجز اللاحن عن التعلم؛ والشافعية يصححون الاقتداء بمن لحنه لا يغير المعنى، ويبطلونه في الفاتحة إن غيّر معناها ولم يحسن؛ والحنابلة يعدون الأمي من لا يحسن الفاتحة أو يحيل معناها، ولا تصح إمامته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7670}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7671} الكلام في الصلاة: الحنفية يبطلون الصلاة بالكلام ناسيا أو عامدا أو مخطئا، والتفريق عند غيرهم بين اليسير الذي لا يفسد والكثير الذي يفسدها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7671} سهو الإمام: إذا أخبره اثنان يثق بقولهما لزمه الرجوع إليهما عند الأئمة الثلاثة، والشافعي يرى أنه إن غلب على ظنه خطؤهما لم يعمل بقولهما؛ وإن تيقن صوابه لم يتابعهما عند الحنفية والمالكية والشافعية في الصحيح والحنابلة في الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7672} الخطأ في صلاة الخوف: إذا رأوا سوادا فظنوه عدوا فصلوا صلاة شدة الخوف ثم بان خلافه، فالحنفية والحنابلة وقول عند الشافعية يوجبون الإعادة، والمالكية لا إعادة عليهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7672}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7673} الزكاة: الخرص إذا ظهرت الثمرة أكثر مما خرص يؤخذ زكاة الزائد عند المالكية؛ وإذا ادعى المالك نقص الخرص قبل قوله عند الحنابلة إن كان محتملا؛ والشافعية يفصلون بحسب قدر الغلط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7673}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7674} الخطأ في مصرف الزكاة: إذا دفعها إلى من ظنه من أهلها فبان خلافه، فالحنفية وقول للشافعية يجزئ؛ وأبو يوسف والحنابلة والصحيح عند الشافعية إن كان الدافع الإمام يسترد من المدفوع ويعيد؛ وقال الحنابلة لا تجزئ إن دفعها لكافر أو لمن لا يستحقها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7674}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7675} الصوم: إذا أطلق الصائم نية صوم رمضان أو أخطأ وصفه صح صومه عند الحنفية وقول عند غيرهم، لأن الوقت متعين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7675} من أفطر ناسيا فلا كفارة، والخطأ في المضمضة فدخل الماء: يبطل الصوم ويلزم القضاء دون الكفارة عند الحنفية والمالكية وقول للشافعية؛ ولا يبطل عند الحنابلة وقول للشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7676} الخطأ في الوقت: من أكل على ظن أن الفجر لم يطلع فبان طلوعه أو أفطر على ظن غروب الشمس، عليه القضاء دون الكفارة عند الجمهور؛ والحنابلة يوجبون القضاء والكفارة في الجماع ولو مخطئا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7676}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7677} الحج: إذا أخطأ الناس فوقفوا يوم العاشر أجزأ عند الحنفية والشافعية والحنابلة، والمالكية يفصلون بحسب كثرة الخطأ؛ وإن وقفوا في الثامن ظنا أنه التاسع لم يجزئ عند الحنفية والمالكية والشافعية في الأصح؛ والحنابلة يجزئهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7677}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7678} إذا أخطأ الحجيج موضع الوقوف فوقفوا في غير عرفة لزمهم القضاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7679} قتل صيد الحرم أو من المحرمين حرام يجب فيه الجزاء عمدا كان أو خطأ، باتفاق الفقهاء؛ والحنفية والمالكية يسوون بين العمد والخطأ في محظورات الإحرام، والشافعية والحنابلة يفرقون بين الإتلاف والتمتع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7679} الخطأ في الأضحية: إذا ذبح كل من رجلين أضحية الآخر خطأ، فالحنفية والحنابلة يجزئ عنهما ولا ضمان استحسانا، والقياس الضمان؛ والمالكية لا يجزئ عندهم ويضمن كل منهما قيمة شاة صاحبه؛ والشافعية يضمن ما بين القيمتين ويجزئ كل منهما إن كانت واجبة بنذر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7680} بيع المخطئ: الحنفية يرون البيع الذي يجري على اللسان خطأ منعقدا فاسدا، والمالكية والشافعية والحنابلة يرونه غير منعقد لاشتراط العلم والقصد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7680}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7681} الغلط في المبيع: إذا وقع الغلط في جنس المبيع أو تفاوت فاحش، فالحنفية عدا الكرخي يرونه مانعا من انعقاد العقد، والكرخي يراه فاسدا؛ والمالكية لا يعتدون بالغلط الذي لم يعلمه العاقد الآخر، وإن سمى أحدهما الشيء بغير اسمه فلا يلزم الشراء ولا البيع عند الجميع، والشافعية والحنابلة يبطلون البيع بالجهل بالمبيع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7681}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7682} الإجارة: النقاد والقباني إذا أخطأ فلا ضمان عليه عند الحنفية والشافعية والحنابلة، والحنابلة يقيدون ذلك بكونه حاذقا أمينا، والشافعية يضمنون القباني في الوزن؛ والأجير المشترك يضمن بالتعدي أو التفريط الجسيم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7682}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7683} خطأ الكاتب: الحنفية يفرقون بين الخطأ في كل ورقة أو بعضها في تقدير الأجرة، والشافعية يوجبون أرش الورق إن كان الغلط فاحشا ولا أجرة له، وإلا له الأجرة ويلزمه الإصلاح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7683} الطبيب والخاتن والحجام: لا ضمان عليهم إذا فعلوا المأذون فيه بشرطين، أن يكونوا حاذقين، وألا تجني أيديهم فيتجاوزوا المحل؛ وإذا تجاوزوا ضمنوا عمدا كان أو خطأ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.7683}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7684} خطأ وصف اللقطة: الحنفية يشترطون إصابة العلامات كلها؛ والمالكية يفرقون بين الخطأ في العفاص والوكاء والخطأ في قدر الدراهم، وابن رشد يعتبر الغلط تصور الشيء على خلاف ما هو عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7684} الغلط في الشفعة: إذا قال المشتري اشتريت بمائة فعفا الشفيع ثم بان الشراء بخمسين، فالشافعية والحنابلة يبقى على شفعته؛ والحنفية يبقى على شفعته إن بان الثمن أقل مما أخبر، لأن الرضا بني على كثرة الثمن؛ والمالكية يبقى على شفعته إذا بان الثمن أقل ويحلف أنه أسقط لأجل الكذب في الثمن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7684}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7685} الخطأ في الأخذ بالشفعة: إذا قيل للشفيع إن فلانا اشترى نصيب شريكه فسلم شفعته لحسن سيرته، ثم بان أن الشراء كان مشتركا مع غيره، فله الشفعة عند الجمهور لأنه إنما رضي بمشاركة من ظنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7685}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7686} النكاح: الحنفية يرون أن اللفظ المحرف بالتصحيف لا ينعقد به النكاح، والمعنى المفهوم من لفظ عامي مشهور يصح عند الحنفية والشافعية والحنابلة في رواية؛ والغلط في اسم الزوجة يمنع الانعقاد إلا إذا كانت حاضرة فأشار إليها، والشافعية والحنابلة يفرقون بين التسمية والإشارة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7686}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7687} الغلط في الزوجة: من زفت إليه امرأة غير زوجته ووطئها فعليه مهر المثل، ولا حد، ويثبت النسب؛ والشافعية والحنابلة يفصلون في تزويج الأب والابن امرأتين فيقع الغلط في الزفاف، فيفسخ النكاحان ويلزم كلا مهر مثل موطوءته، والحنابلة يسقطون مهر الموطوءة عن زوجها لأنها شريكة في الفسخ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7687}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7688} طلاق المخطئ: لا يقع عند الشافعية والحنابلة إذا سبق اللسان بلا قصد، ويقع عند الحنفية لأن الغفلة عن معنى اللفظ يصعب الوقوف عليها، والمالكية يشترطون قصد النطق بالصيغة لا مدلولها، ومن سبق لسانه فيقبل قوله ديانة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7688} الجنايات خطأ: الواجب في القتل الخطأ الدية على العاقلة والكفارة على القاتل، والحرمان من الميراث عند الجمهور؛ والواجب فيما دون النفس خطأ دية كاملة أو نسبة منها بحسب الجراح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7688}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7689} جناية الإنسان على نفسه خطأ: الحنفية والمالكية والشافعية لا دية؛ والحنابلة في الأظهر على عاقلته ديته لورثته أو أرش جرحه إذا زاد على الثلث؛ والكفارة تجب عند الشافعية والحنابلة دون الحنفية والمالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7689} التصادم خطأ: خلاف في أن يضمن كل واحد ما تلف من الآخر أو نصف القيمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7689} خرق السفينة خطأ: الشافعية يجعلون الخرق المهلك عامدا فيه القصاص أو الدية، وخرقها للإصلاح شبه عمد، وإن أصاب غير موضع الإصلاح فخطأ محض؛ والحنفية يفرقون في ضمان الملاح بين ما كان بفعله وما لم يكن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7690} الخطأ في اليمين: الحنفية يوجبون الكفارة إن حنث بيمين سبق اللسان إليها؛ والكمال بن الهمام يخالف في انعقاد يمين المخطئ؛ والمالكية يفرقون بين سبق اللسان بلفظ اليمين فيلزم اليمين، وانتقال اللفظ عند إرادة غيره فيديّن؛ والشافعية لا تنعقد اليمين بلا قصد، ويصدق الحالف في غير الطلاق والعتاق والإيلاء؛ والحنابلة لا إثم ولا كفارة فيما سبق من غير قصد، إلا في الطلاق والعتاق على ما ظنه صادقا.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7690}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7691} الخطأ في اليمين والحنث: الحنفية يوجبون الكفارة في الحنث ولو بالإكراه أو النسيان؛ والمالكية يعدون الحنث بالخطأ، فمن حلف لا يدخل دار فلان فدخلها يظنها غيرها حنث؛ والشافعية قولان، والراجح عدم الحنث للحديث عن رفع الخطأ والنسيان؛ والحنابلة لا كفارة في الإكراه والنسيان، ويقع الطلاق والعتاق إذا فعل المحلوف عليه ناسيا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7692}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7693} الغلط في القسمة: الشافعية والحنابلة يقبلون دعوى الغلط بالبينة، ويقبلون دعوى الغلط في قسمة الإجبار مع البينة، ولا يقبل في قسمة التراضي إلا ببينة؛ والحنفية يحلفون الشركاء عند عدم البينة؛ والمالكية يفرقون بين الجور والغلط المتفاحش الذي يثبت بقول أهل المعرفة فتنقض القسمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7693}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7694} الغلط في الإقرار: الشافعية في الأصح يقبلون رجوع المقر بقوله غلطت، والمال يترك في يده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7694} الغلط في الشهادة: الحنفية يقبلون رجوع الشاهد العدل بعد الحكم إن قال وهمت في بعض الشهادة؛ والمالكية والشافعية والحنابلة يفرقون بين ما قبل الحكم وما بعده وبين الدم والمال؛ ورجوع شهود القصاص والحد بعد الحكم يوقف الاستيفاء، والدية في مال الشهود إن قالوا أخطأنا، والشهود إن رجعوا بخطأ لا يعزرون عند الجمهور، والحنفية يرون التعزير بالرجوع أيضا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7694}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7695}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7695}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7696} الخطأ في القضاء: مدار نقض الحكم تبين الخطأ في الاجتهاد أو في السبب؛ وأما الحد والتعزير فإن أخطأ الإمام بقطع اليسار بدل اليمين فالحنفية لا ضمان عند أبي حنيفة وعند زفر يضمن، والمالكية يجزئ القطع الخطأ بين المتساويين، والشافعية تجب على العاقلة أو بيت المال، والحنابلة يضمنون ما زاد على الحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7696}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7697}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7697}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7698} الخطأ في القصاص: الحنفية على أن الضامن للدية إذا زاد القطع في القصاص عند أبي حنيفة؛ والمالكية يقتص بقدر الزيادة المتعمدة؛ والشافعية يوجبون القود في الزيادة عمدا والأرش خطأ؛ والحنابلة يوجبون أرش الزيادة الخطأ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7698} الخطأ في الفتوى: الحنفية يختلفون في تضمين المفتي؛ والمالكية يضمنون المقلد إن تولى الفعل بفتواه؛ والشافعية وأبو إسحاق يضمنون إن كان أهلا؛ والحنابلة يضمنون الحاكم والمفتي إن بان الخطأ في دليل قاطع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7699}'
  en: 'Khata'' is lexically the opposite of right; one who misses the way strays from it, and an archer who misses the target has not hit it; khati''a is a sin, the verb with intent being khatiya and without intent akhta''a. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7652}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7653} Technically it is an act done without intent toward the object of the act: Kamal ibn al-Humam gives the example of rinsing the mouth that reaches a fasting man''s throat, and shooting at game that hits a human. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7653} Most jurists treat ghalat as equal to khata''; some Malikis distinguish that khata'' is in the heart and ghalat in the tongue, yet ghalat takes khata''s ruling; Abu Hilal al-''Askari distinguishes that ghalat is placing a thing out of its place and may be right in itself, while khata'' is never right in any way. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7653} Most jurists use khata'' for what slips from the tongue without intent, while the Malikis use ghalat for what concerns belief. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7654} Near terms are forgetfulness, inattention, distraction and heedlessness; compulsion (forcing another against his will, short of compulsion that removes choice); jest (speaking without meaning); and ignorance, simple or compound; the one in error is not responsible for what he erred in. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7654}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7655} Ignorance and error excuse in what is forbidden, not in what is commanded; they excuse nothing in the rights of persons, so the ignorant and mistaken pay for what they destroy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7655} The usulis differ on whether the act of one in error can be called lawful or unlawful: al-Asnawi holds that lawful and unlawful apply to accountable persons, so the error is not described; al-Shatibi holds that error and forgetfulness are in a zone of pardon. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7655}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7656} Most jurists hold that error excuses some of God''s rights but not all, citing the report "God has lifted from my community error and forgetfulness"; the rights of people are not lifted by error, so destroyed property and blood-money are owed, since that is a rule of ruling not of commanding. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7656}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7657} Al-Qurtubi distinguishes: the kind that is never lifted, such as fines, blood-money and the obligatory prayers; the kind always lifted, such as retaliation and uttering unbelief under duress; and the disputed kind, such as one who eats in Ramadan by forgetting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7657} The maxim "no weight is given to a clearly mistaken assumption" is held by the Hanafis and Shafiis; a case: one who thought the dawn was near and prayed it before the missed isha, then saw the time was long, must repeat the dawn prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7658}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7659} Shafii cases: one who thought himself pure, prayed, and then his impurity appeared, or who prayed behind an imam he thought Muslim who proved an unbeliever, and so on, mostly void. The Malikis use the maxim of clear manifestation; Ibn Rajab sets out rules on one who disposes of what he thinks he does not own. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7659}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7660} Error in purity: one who judges a vessel or cloth by guesswork and then finds it impure must repeat, by the Hanafis, Shafiis and one Maliki view; the Hanbalis do not apply the same rule. Error in the intention for wudu: by agreement of Malikis, Shafiis and Hanbalis the lesser intention can be overtaken; the Hanafis do not require intention for wudu or washing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7661}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7662} Error in the intention for the major washing and dry ablution: intending the washing for sexual impurity when it came from a wet dream is not harmful for the Shafiis and Hanafis; a menstruating woman intending only the major impurity raises a Maliki dispute. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7662}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7663} The entry continues in the following pages. On dry ablution: the Malikis and Ibn Maslama permit it, the Shafiis accept a mistaken intention for the minor state when one is in the major, and the Hanbalis require the purpose to be specified. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7664} One who had water in his baggage, forgot it, searched, found none, dry-ablutes and prays: valid for the Malikis, one Shafii view and the Hanbalis; the other Shafii view requires repetition for his neglect of the baggage. One who knew of the water but thought it was used up must repeat, by the Hanafis, Malikis, the sounder Shafii view and the Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7664}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7665} In prayer intention: where the thing need not be specified, error does no harm, as with the place, the time and the number of units; where it must be specified, error harms, as with a noon prayer intended as an afternoon one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7665} On following an imam: error about his identity usually does no harm; intending to pray over one person and finding another invalidates the funeral prayer by most schools, and the Hanbalis differ on the sex of the dead. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7665}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7666} On ada'' and qada'' and the wrong day: the Malikis generally validate; the Hanafis and Shafiis invalidate except in certain cases; the Hanbalis validate qada'' with a mistaken ada'' intention when the error shows against belief. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7666}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7667} On prayer before the time: invalid by agreement, whether by design or error. The Shafiis require certain knowledge or a valid estimate; the Hanbalis accept a strong estimate, and repeat if the prayer proves early. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7667}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7668} On error in the qibla: the Hanafis accept ijtihad without repetition; the Malikis repeat within the time if clear signs were present and one faced the wrong way; the Shafiis have two views once error is certain; the Hanbalis require no repetition for the ijtihad, but the sighted at home and the blind without a guide repeat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7668} On error in recitation: the Hanafis distinguish errors of inflection, which do not invalidate unless they change the meaning badly, from errors of letters and words, and treat near-synonyms as harmless. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7668}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7669} On error in recitation as it affects the follower: the Malikis examine prayer behind a faulty reciter, some voiding it outright or by detail, and validating it where the reciter cannot learn; the Shafiis validate following one whose fault does not change the meaning, and void it where the opening chapter''s sense is changed and he cannot correct it; the Hanbalis treat one who cannot recite the opening chapter, or whose faults change its meaning, as unfit to lead. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7670}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7671} Speech in prayer: the Hanafis void the prayer by speech done in forgetfulness, intent or error; others separate slight speech, which does not void, from much speech, which does. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7671} The imam\''s doubt: if two whom he trusts tell him of an error, he must go by them, by the three Imams; al-Shafii holds that if he judges their error likely he need not follow them; if he is certain of his own correctness, the Hanafis, Malikis, the sounder Shafii view and most Hanbalis do not follow the followers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7672} Error in the fear prayer: if the troops saw a dark shape and took it for an enemy, prayed the prayer of extreme fear, and it proved otherwise, the Hanafis, Hanbalis and one Shafii view require repetition; the Malikis do not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7672}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7673} Zakat: if the fruit proves more than the estimate, the Malikis take zakat on the excess; if the owner claims the estimate was too high, the Hanbalis accept his word if the claim is plausible; the Shafiis distinguish by the size of the error. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7673}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7674} Error in the recipient of zakat: if it is given to one thought eligible who proves not, the Hanafis and one Shafii view hold it valid; Abu Yusuf, the Hanbalis and the sounder Shafii view, when the giver is the ruler, let the sum be recovered; the Hanbalis hold it invalid if given to an unbeliever or to one not eligible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7674}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7675} Fasting: whoever gives a general intention for Ramadan, or errs in its description, has a valid fast by the Hanafis and one view of others, since the time is fixed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7675} One who breaks the fast by forgetfulness owes no expiation. Water entering by mistake while rinsing voids the fast and requires only a make-up by the Hanafis, Malikis and one Shafii view; the Hanbalis and another Shafii view hold it does not void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7676} Error about the time: one who ate on the belief that dawn had not broken, or broke the fast on the belief that the sun had set, owes a make-up but no expiation by most jurists; the Hanbalis require both make-up and expiation for intercourse, even by mistake. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7676}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7677} Hajj: if the pilgrims all erred and stood on the tenth, the Hanafis, Shafiis and Hanbalis hold it valid;
    the Malikis distinguish by how many erred; standing on the eighth in the belief it was the ninth is invalid for the Hanafis, Malikis and the sounder Shafii view, valid for the Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7677}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7678} Erring in the place of standing and standing outside Arafat requires a make-up. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7679} Killing game in the sacred precinct, or game by one in the state of ihram, is forbidden and carries a compensation whether done by intent or error, by agreement; the Hanafis and Malikis treat errors and intent alike for the prohibitions of ihram, while the Shafiis and Hanbalis distinguish destruction from enjoyment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7679} On error in a sacrifice: if two men each slaughter the other''s victim by mistake, the Hanafis and Hanbalis count it valid and owe nothing, by istihsan (the analogical rule would require a debt); the Malikis hold it invalid, each owing the other the value; the Shafiis require paying the difference in value, and each victim counts if it was owed by a vow. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7680} Sale by error: the Hanafis hold a sale spoken by slip to be concluded but void for lack of consent; the Malikis, Shafiis and Hanbalis hold it not concluded, since the sale needs knowledge and intent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7680}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7681} Error in the subject of sale: on a mistake of kind or a gross difference, the Hanafis except al-Karkhi hold the contract not concluded, al-Karkhi holds it void; the Malikis disregard an error the other party did not know; if one names the thing wrongly, the buyer is not bound and neither is the seller by agreement; the Shafiis and Hanbalis void a sale of an unknown thing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7681}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7682} Hire: the appraiser who errs owes nothing by the Hanafis, Shafiis and Hanbalis (the Hanbalis require skill and trust); the Shafiis make a scale-man liable for weighing errors; the paid worker who loses goods through transgression or gross neglect is liable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7682}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7683} Scribe: the Hanafis divide the error by the leaves affected, and the Shafiis give a fee for correct work, make the scribe pay for paper if the error is gross, and require him to correct. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7683} Physician, circumciser and cupper: no liability for what they do with leave, provided they are skilled and do not exceed the proper place; exceeding it makes them liable whether by intent or error. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7683}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7684} Error in describing lost property: the Hanafis require every sign to match; the Malikis distinguish errors in the bag, string and coins; Ibn Rushd takes error to mean conceiving a thing differently from what it is. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7684} Error in shuf''a: if the buyer said he paid a hundred, the pre-emptor waived his right, and the price proved fifty, the Shafiis and Hanbalis keep his right; the Hanafis keep it if the price proved lower than stated, since his consent rested on the higher figure; the Malikis keep it where the price proved lower, the claimant swearing that he waived because of the lie about the price. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7684}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7685} On error in shuf''a: if the pre-emptor was told that a certain man had bought his partner''s share and waived his right out of good opinion of the buyer, and it proved he had bought with another, the majority keep his right, since his consent was to that partner alone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7685}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7686} Marriage: the Hanafis hold that a text garbled by mispronunciation does not conclude the contract, while a common usage meaning the marriage is valid by the Hanafis, Shafiis and a Hanbali view; error in the bride\''s name prevents the contract unless she is present and indicated, where the Shafiis and Hanbalis distinguish naming from pointing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7686}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7687} Error in the bride: whoever has intercourse with a woman brought to him by mistake owes the proper dower and no hadd; the lineage stands. The Shafiis and Hanbalis treat a father and son who marry two women and consummate by mistake: both contracts are dissolved and each owes the dower of the one he consummated; the Hanbalis remit the dower to the husband, since she shared in the dissolution. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7687}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7688} Divorce by slip: the Shafiis and Hanbalis hold that a divorce said by slip without intent does not take effect; the Hanafis hold it does, since the lapse of mind is hard to test; the Malikis require intent to speak the formula, not its meaning, and a slip is accepted in the judge\''s ruling if proven. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7688} Injuries by error: the price of unintended homicide is owed by the killer\''s kin with expiation by the killer, and loss of inheritance by most jurists; for lesser injuries a full sum or a share of the full sum by the wound. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7688}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7689} Self-injury by error: the Hanafis, Malikis and Shafiis owe nothing; the Hanbalis (preferred view) owe the sum to the heirs from the kin if it exceeds a third; expiation is owed by the Shafiis and Hanbalis but not the Hanafis and Malikis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7689} Collision by error: the jurists differ on whether each must make good the other\''s loss or pay half the value. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7689} Holing a boat by error: the Shafiis treat a deliberate fatal hole as retaliation or blood-money and a hole for repair as quasi-intentional; a hole elsewhere is pure error; the Hanafis distinguish the boatman\''s liability by whether the damage was by his act. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7690} Error in oaths: the Hanafis require expiation on breach of an oath spoken by slip; Ibn al-Humam disputes that the oath of one in error is binding; the Malikis distinguish a slip of the tongue (oath is binding) from a switch of word while meaning another (the speaker is believed in conscience); the Shafiis hold an oath spoken without intent is not binding, except the oath of divorce, freeing or vow; the Hanbalis hold no sin and no expiation for an oath spoken without intent, except divorce and manumission on a past fact believed true. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7690}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7691} On oath and breach by error: the Hanafis require expiation on breach even under compulsion or forgetfulness; the Malikis hold breach by error counts, as when one swears not to enter a house and enters it thinking it is another; the Shafiis have two views, the preferred one that there is no breach, citing the report that error and forgetfulness are lifted; the Hanbalis require no expiation under compulsion or forgetfulness, but divorce and manumission take effect if the sworn act is done in forgetfulness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7692}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7693} Error in division: the Shafiis and Hanbalis accept a claim of error with proof; for a compulsory division the claim needs proof, and for a consensual one the division is annulled only on proof; the Hanafis have the partners swear if there is no proof; the Malikis distinguish wrong made by intent from error, and annul only where the error is gross and known to the experts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7693}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7694} Error in an admission: the sounder Shafii view accepts an admission retracted as an error, and the property stays with the admitter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7694} Error in testimony: the Hanafis accept a just witness who says after the judgment that he erred in part; the Malikis, Shafiis and Hanbalis distinguish before and after the ruling and blood from property; if witnesses to retaliation or a hadd retract after the ruling and say they erred, the penalty is suspended and the blood-money falls on their property; most jurists do not discipline witnesses who retract by error. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7694}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7695}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7695}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7696} Error in judgment: the ruling is set aside when the error in reasoning or in the cause shows; a ruler who cuts the left hand instead of the right is not liable by Abu Hanifa, but liable by Zufar; the Malikis allow a wrong cut between equals; the Shafiis put the sum on the kin or the public treasury; the Hanbalis make good the excess over the hadd. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7696}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7697}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7697}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7698} Error in retaliation: the Hanafis hold that one who exceeds an intended cut and kills owes the blood-money by Abu Hanifa; the Malikis retaliate for the excess intended; the Shafiis require retaliation for an intended excess and a fine for an error; the Hanbalis fine for the error. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7698} Error in a fatwa: the Hanafis differ on whether the mufti is liable; the Malikis hold a follower liable if he acts on the fatwa, a mufti who is only a teacher not; the Shafiis (and Abu Ishaq) make the mufti liable if he is qualified; the Hanbalis make both judge and mufti liable where the error is against a clear text. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7699}'
  ur: 'خطأ لغت میں صواب کی ضد ہے؛ راستہ سے بھٹکنا، اور تیر انداز کا نشانے سے چوک جانا؛ خطیئہ گناہ اور جرم ہے، جان بوجھ کر ہو تو خطِئ اور بغیر ارادے کے ہو تو اخطأ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7652}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7653} اصطلاح میں یہ وہ فعل ہے جو کسی مقصود کام کے دوران بغیر ارادے کے صادر ہو؛ کمال بن الہمام کے نزدیک یہ ہے کہ فعل کا قصد کسی اور محل کا ہو جس پر جنایت ہو، جیسے روزہ دار کے حلق میں کلی کا پانی پہنچنا، یا شکار پر تیر چلانا اور آدمی کو لگ جانا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7653} جمہور کے نزدیک غلط خطأ کے برابر ہے؛ بعض مالکیہ کے نزدیک خطأ دل سے متعلق ہے اور غلط زبان سے، مگر غلط خطأ کا حکم لیتا ہے؛ ابو ہلال عسکری کے نزدیک غلط کسی چیز کو غلط جگہ رکھنا ہے جو اپنی ذات میں درست ہو سکتی ہے، جبکہ خطأ کسی وجہ سے درست نہیں ہوتی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7653} جمہور فقہاء زبان سے بغیر ارادے کے نکلنے والی بات کو خطأ کہتے ہیں، جبکہ مالکیہ عقیدے سے متعلق چیز کو غلط کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7654} قریب المعنی الفاظ: بھول، سہو، غفلت، ذہول؛ اکراہ ⁦(دوسرے کو وہ کام کرانا جو وہ نہ چاہے)⁩؛ ہزل ⁦(لفظ بے معنی بولنا)⁩؛ اور جہل ⁦(سادہ یا مرکب)⁩؛ خطا کرنے والا اس میں غیر مکلف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7654}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7655} جہل اور خطأ منہیات میں عذر ہیں، مأمورات میں نہیں؛ حقوق العباد میں عذر نہیں، اس لیے جاہل اور خطا کار جو تلف کریں اس کا ضمان دیتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7655} اصولیوں کا اختلاف ہے کہ خطا کار کے فعل کو حلال یا حرام کہا جائے یا نہیں؛ اسنوی کے نزدیک یہ مکلفین کے احکام ہیں تو اس پر وصف نہیں؛ شاطبی کے نزدیک خطأ اور نسیان عفو کے درجے میں ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7655}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7656} جمہور کے نزدیک خطأ اللہ کے بعض حقوق میں عذر ہے، کل میں نہیں؛ حدیث «رفع عن أمتي الخطأ والنسيان» سے استدلال کیا گیا؛ حقوق العباد خطأ سے ساقط نہیں ہوتے، اس لیے تلف شدہ مال اور دیت لازم ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7656}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7657} قرطبی کی تفصیل: ایک قسم جو کبھی ساقط نہیں ہوتی جیسے تاوان، دیت اور فرض نمازیں؛ دوسری جو بالاتفاق ساقط ہوتی ہے جیسے قصاص اور کفر کا کلمہ؛ اور تیسری مختلف فیہ جیسے رمضان میں بھول کر کھانا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7657} قاعدہ «لا عبرة بالظن البين خطؤه» حنفیہ اور شافعیہ کے نزدیک؛ مثال: کسی نے فجر کا وقت تنگ سمجھ کر فجر پڑھ لی اور بعد میں عشاء کی قضا کا وقت وسیع نکلا تو فجر دوبارہ پڑھے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7658}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7659} شافعیہ کی مثالیں: کسی نے خود کو باوضو سمجھ کر نماز پڑھی پھر بے وضو نکلا، یا کافر امام کو مسلم سمجھ کر اقتدا کی؛ مالکیہ ظہور و انکشاف کا قاعدہ بیان کرتے ہیں؛ ابن رجب ایسے تصرف کے قواعد بیان کرتے ہیں جو اپنی ملک نہ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7659}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7660} طہارت میں خطا: برتن یا کپڑے میں اجتہاد سے پاک سمجھ کر استعمال کیا پھر نجس نکلا تو حنفیہ، شافعیہ اور مالکیہ کے ایک قول میں اعادہ لازم؛ وضو کی نیت میں خطا: مالکیہ، شافعیہ اور حنابلہ کے نزدیک دوسرے حدث کی نیت پر تداخل سے رفع ہو جاتا ہے؛ حنفیہ وضو اور غسل میں نیت شرط نہیں کرتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7661}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7662} غسل اور تیمم میں خطا: احتلام کے بعد جنابتِ جماع کی نیت شافعیہ اور حنفیہ کے نزدیک مضر نہیں؛ حائضہ نے صرف جنابت کی نیت کی تو مالکیہ میں اختلاف ہے؛ جنب نے بھول کر حدث کی نیت سے تیمم کیا تو امام مالک سے دو قول ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7662}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7663} یہ مدخل اگلے صفحات میں جاری ہے۔ تیمم میں: مالکیہ اور ابن مسلمہ جائز کہتے ہیں، شافعیہ جنب کے لیے حدث اصغر کی غلط نیت صحیح کہتے ہیں، حنابلہ مقصد متعین کرنے کو شرط کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7664} جس کے سامان میں پانی تھا اور بھول کر تلاش کر کے نہ ملا تو تیمم سے نماز مالکیہ، شافعیہ کے ایک قول اور حنابلہ کے نزدیک درست ہے، شافعیہ کے دوسرے قول میں سامان کی حفاظت میں کوتاہی پر اعادہ لازم ہے۔ جس کو پانی کا علم تھا مگر گمان کیا کہ ختم ہو گیا، وہ حنفیہ، مالکیہ، شافعیہ کے اصح اور حنابلہ کے نزدیک اعادہ کرے گا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7664}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7665} نیت میں خطا: جس چیز کا متعین کرنا شرط نہیں اس میں خطا مضر نہیں جیسے جگہ، وقت اور رکعتوں کی تعداد؛ اور جس کا تعین شرط ہے اس میں مضر ہے جیسے ظہر کی نیت سے عصر ادا کرنا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7665} امام کی شناخت میں خطا اکثر کے نزدیک مضر نہیں؛ کسی ایک کا جنازہ پڑھنے کی نیت کی اور دوسرا نکلا تو جمہور کے نزدیک نماز باطل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7665}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7666} ادا اور قضا اور غلط دن کی نیت: مالکیہ اکثر صحیح قرار دیتے ہیں، حنفیہ اور شافعیہ کچھ صورتوں کے سوا باطل کہتے ہیں، حنابلہ قضا کو ادا کی نیت سے صحیح مانتے ہیں جب گمان کا خلاف ظاہر ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7666}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7667} وقت سے پہلے نماز باتفاق باطل ہے؛ شافعیہ یقین یا معتبر گمان مانگتے ہیں، حنابلہ غالب گمان کافی سمجھتے ہیں اور وقت سے پہلے نکلنے پر اعادہ کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7667}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7668} قبلے میں خطا: حنفیہ اجتہاد کو کافی سمجھتے ہیں؛ مالکیہ علامات ظاہر ہوں تو وقت میں اعادہ کرتے ہیں؛ شافعیہ خطا یقینی ہونے پر دو قول رکھتے ہیں؛ حنابلہ مجتہد پر اعادہ نہیں کرتے، مگر حضر میں بینا اور بغیر رہنما کے نابینا اعادہ کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7668} قراءت میں خطا: حنفیہ اعراب کی غلطی کو، جو معنی نہ بدلے، مضر نہیں مانتے، اور فاحش تبدیلی کو متقدمین کے نزدیک مفسد؛ حروف اور کلمات میں بدلاؤ، تقدیم و تاخیر، زیادتی اور کمی کی تفصیل دیتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7668}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7669} قراءت میں خطأ مقتدی کے بارے میں: مالکیہ لحن والے امام کی اقتدا میں بعض کے نزدیک مطلقاً اور بعض کے نزدیک تفصیل سے نماز باطل ہے، اور جو تعلیم پر قادر نہ ہو اس کی نماز صحیح ہے؛ شافعیہ معنی نہ بدلنے والے لحن کے ساتھ اقتدا صحیح کہتے ہیں اور سورہ فاتحہ کا معنی بدل جائے تو باطل؛ حنابلہ جو فاتحہ درست نہ پڑھ سکے اس کی امامت صحیح نہیں کہتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7670}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7671} نماز میں کلام: حنفیہ بھول، عمد یا خطا میں کلام سے نماز باطل کہتے ہیں؛ دوسرے تھوڑے کلام اور زیادہ کلام میں فرق کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7671} امام کا شک: اگر دو معتبر آدمی سہو کی خبر دیں تو ائمہ ثلاثہ کے نزدیک امام ان کی بات مانے؛ شافعی کے نزدیک اگر ان کی خطا کا غالب گمان ہو تو نہ مانے؛ اور اگر اپنی درستگی کا یقین ہو تو حنفیہ، مالکیہ، شافعیہ کے اصح اور حنابلہ کے اکثر کے نزدیک پیروی نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7672} خوف کی نماز میں خطا: سیاہ شے کو دشمن سمجھ کر شدت خوف کی نماز پڑھ لی پھر خلاف نکلا تو حنفیہ، حنابلہ اور شافعیہ کے ایک قول کے نزدیک اعادہ لازم؛ مالکیہ اعادہ نہیں کہتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7672}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7673} زکوٰۃ: خرص کے بعد پھل زیادہ نکلے تو مالکیہ زیادتی کی زکوٰۃ لیتے ہیں؛ مالک کا کمی کا دعویٰ حنابلہ کے نزدیک ممکن ہو تو قبول ہے؛ شافعیہ غلطی کی مقدار کے لحاظ سے فرق کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7673}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7674} زکوٰۃ کے مستحق میں خطا: مستحق سمجھ کر دی گئی زکوٰۃ حنفیہ اور شافعیہ کے ایک قول کے نزدیک جائز ہے؛ ابو یوسف، حنابلہ اور شافعیہ کا اصح قول کہ اگر دینے والا امام ہو تو واپس لی جائے گی؛ حنابلہ کافر یا غیر مستحق کو دینے پر ناجائز کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7674}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7675} روزہ: رمضان کی عام نیت یا اس کے وصف میں خطا کرنے والے کا روزہ حنفیہ اور دوسروں کے ایک قول کے مطابق درست ہے، کیونکہ وقت متعین ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7675} بھول کر کھانے والے پر کفارہ نہیں؛ کلی میں پانی غلطی سے حلق میں چلا جائے تو حنفیہ، مالکیہ اور شافعیہ کے ایک قول میں روزہ ٹوٹ جائے گا اور صرف قضا ہوگی؛ حنابلہ اور شافعیہ کے ایک قول میں نہیں ٹوٹتا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7676} وقت میں خطا: فجر طلوع نہ ہونے کے گمان پر کھایا یا سورج غروب کے گمان پر افطار کیا تو جمہور کے نزدیک صرف قضا؛ حنابلہ کے نزدیک جماع میں قضا اور کفارہ دونوں ہیں، خطا سے ہو تب بھی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7676}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7677} حج: سب حاجیوں کی غلطی سے دسویں کو وقوف کیا تو حنفیہ، شافعیہ اور حنابلہ کے نزدیک جائز؛ مالکیہ غلطی کرنے والوں کی تعداد کے لحاظ سے فرق کرتے ہیں؛ آٹھویں کو نویں کے گمان سے وقوف حنفیہ، مالکیہ اور شافعیہ کے اصح قول میں ناجائز، حنابلہ کے نزدیک جائز۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7677}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7678} موقف کی جگہ میں غلطی کر کے عرفات کے سوا وقوف کیا تو قضا لازم ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7679} حرم کا شکار یا احرام والے کا شکار قتل کرنا حرام ہے اور جزا واجب ہے، عمد ہو یا خطا، بالاتفاق؛ حنفیہ اور مالکیہ احرام کی ممنوعات میں عمد و خطا برابر رکھتے ہیں، شافعیہ اور حنابلہ ہلاک کرنے اور فائدہ اٹھانے میں فرق کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7679} قربانی میں خطأ: اگر دو شخص ایک دوسرے کا جانور غلطی سے ذبح کریں تو حنفیہ اور حنابلہ کے نزدیک استحساناً دونوں کی قربانی ہو جاتی ہے اور تاوان نہیں؛ مالکیہ کے نزدیک جائز نہیں اور ہر ایک دوسرے کو قیمت دے؛ شافعیہ دونوں جانوروں کی قیمت کا فرق دیتے ہیں اور نذر کی واجب قربانی میں ہر ایک درست ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7680} خطأ سے بیع: حنفیہ کے نزدیک زبان کی پھسلن سے بیع منعقد ہو کر فاسد ہے، مالکیہ، شافعیہ اور حنابلہ کے نزدیک منعقد ہی نہیں کیونکہ علم اور ارادہ شرط ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7680}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7681} مبیع میں غلطی: جنس کی غلطی یا فاحش تفاوت پر حنفیہ ⁦(سوائے کرخی)⁩ کے نزدیک عقد منعقد نہیں ہوتا، کرخی اسے فاسد کہتے ہیں؛ مالکیہ دوسرے فریق کو معلوم نہ ہونے والی غلطی کا اعتبار نہیں کرتے؛ شافعیہ اور حنابلہ نامعلوم چیز کی بیع کو باطل کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7681}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7682} اجارہ: ناقد یا قباّنی غلطی کرے تو حنفیہ، شافعیہ اور حنابلہ کے نزدیک ضمان نہیں ⁦(حنابلہ ماہر اور امین ہونا شرط کہتے ہیں)⁩؛ شافعیہ وزن میں غلطی پر قباّنی کو ضامن کہتے ہیں؛ اجیرِ مشترک تعدی یا سنگین کوتاہی سے ضامن ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7682}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7683} کاتب کی غلطی: حنفیہ ہر ورق میں غلطی یا بعض میں غلطی کے لحاظ سے اجرت میں فرق کرتے ہیں؛ شافعیہ فاحش غلطی پر کاتب کو کاغذ کا تاوان دیتے ہیں، ورنہ اجرت لیتا ہے اور اصلاح لازم
    ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7683} طبیب، ختنہ کرنے والے اور حجام: جائز کام کرنے پر ضمان نہیں بشرطیکہ ماہر ہوں اور محل سے تجاوز نہ کریں؛ تجاوز پر عمد ہو یا خطا، ضامن ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7683}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7684} گمشدہ مال کے اوصاف میں غلطی: حنفیہ تمام علامات کا مطابق ہونا شرط کہتے ہیں؛ مالکیہ تھیلی، ڈوری اور سکّوں کی غلطی میں فرق کرتے ہیں؛ ابن رشد کے نزدیک غلطی سے مراد چیز کو اس کے خلاف سمجھنا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7684} شفعہ میں غلطی: خریدار نے سو کہہ کر شفیع سے دستبرداری لی اور قیمت پچاس نکلی تو شافعیہ اور حنابلہ کے نزدیک شفعہ باقی ہے؛ حنفیہ کے نزدیک بھی باقی ہے جب قیمت کم نکلے کیونکہ رضا زیادہ قیمت پر مبنی تھی؛ مالکیہ کم قیمت کی صورت میں شفعہ باقی کہتے ہیں اور شفیع قسم کھا کر کہے کہ دستبرداری قیمت کے جھوٹ کی وجہ سے تھی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7684}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7685} شفعہ میں غلطی: شفیع کو کہا گیا کہ فلاں نے اس کے شریک کا حصہ خریدا ہے، اس نے حسن ظن سے شفعہ چھوڑ دیا، پھر معلوم ہوا کہ شراء کسی اور کے ساتھ مشترک تھا تو جمہور کے نزدیک شفعہ باقی ہے کیونکہ اس کی رضا صرف اسی شریک کے ساتھ تھی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7685}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7686} نکاح: حنفیہ کے نزدیک تحریف شدہ لفظ سے نکاح منعقد نہیں ہوتا، جبکہ عامی کا مشہور لفظ جس کا معنی نکاح ہو حنفیہ، شافعیہ اور حنابلہ کی ایک روایت کے مطابق صحیح ہے؛ بیوی کے نام کی غلطی انعقاد سے مانع ہے سوائے اس کے کہ وہ حاضر ہو اور اشارہ کیا گیا ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7686}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7687} بیوی کی غلطی: جس شخص کے پاس غلطی سے کوئی اور عورت لائی جائے اور وہ اس سے وطی کرے تو اس پر مہر مثل ہے، حد نہیں، اور نسب ثابت ہوگا؛ باپ اور بیٹے نے دو عورتوں سے نکاح کیا اور غلطی سے وطی ہوئی تو شافعیہ اور حنابلہ دونوں نکاح فسخ کرتے ہیں اور ہر ایک پر اپنی موطوءہ کا مہر مثل لازم ہے؛ حنابلہ موطوءہ کا مہر شوہر پر نہیں ڈالتے کیونکہ وہ فسخ میں شریک ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7687}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7688} غلطی سے طلاق: شافعیہ اور حنابلہ کے نزدیک بغیر ارادے کے زبان سے نکلی طلاق واقع نہیں ہوتی؛ حنفیہ کے نزدیک واقع ہو جاتی ہے کیونکہ معنی سے غفلت کا پتہ لگانا مشکل ہے؛ مالکیہ صیغہ بولنے کا ارادہ شرط کہتے ہیں، اور سبقتِ لسان ثابت ہو تو دیانت میں قبول ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7688} خطأ کی جنایات: قتل خطأ میں دیت عاقلہ پر اور کفارہ قاتل پر، جمہور کے نزدیک وراثت سے محرومی؛ نفس سے کمتر جنایت میں پوری دیت یا زخم کے تناسب سے حصہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7688}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7689} اپنے آپ کو خطأ زخمی کرنا: حنفیہ، مالکیہ اور شافعیہ کے نزدیک دیت نہیں؛ حنابلہ کے اظہر قول میں ورثہ کو عاقلہ دیتا ہے اگر تہائی سے زیادہ ہو؛ کفارہ شافعیہ اور حنابلہ کے نزدیک لازم ہے، حنفیہ اور مالکیہ کے نزدیک نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7689} تصادم میں خطأ: اس بات میں اختلاف ہے کہ ہر ایک دوسرے کا نقصان بھرے یا آدھی قیمت دے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7689} کشتی میں خطأ سوراخ: شافعیہ عمدًا ہلاک کرنے والا سوراخ قصاص یا دیت کا باعث سمجھتے ہیں، مرمت کے لیے سوراخ شبہِ عمد اور دوسری جگہ کا سوراخ محض خطأ؛ حنفیہ ملاح کے ضمان میں فرق کرتے ہیں کہ نقصان اس کے فعل سے ہوا یا نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7690} قسم میں خطأ: حنفیہ زبان سے بے ساختہ نکلی قسم توڑنے پر کفارہ لازم کرتے ہیں؛ ابن الہمام اس کی انعقاد میں اختلاف کرتے ہیں؛ مالکیہ بے ساختہ قسم کے لفظ کو لازم اور لفظ بدلنے کو دیانت میں قبول کرتے ہیں؛ شافعیہ بغیر ارادے کی قسم کو منعقد نہیں مانتے سوائے طلاق، آزادی اور ایلاء کے؛ حنابلہ بغیر ارادے کی قسم پر گناہ اور کفارہ نہیں مانتے سوائے طلاق اور آزادی کے جو گزشتہ بات پر سچ سمجھ کر کہی گئی ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7690}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7691} قسم اور حنث میں خطأ: حنفیہ جبر یا بھول کے باوجود حنث پر کفارہ لازم کرتے ہیں؛ مالکیہ غلطی سے حنث کو حنث مانتے ہیں؛ شافعیہ کے دو قول ہیں، راجح یہ کہ حنث نہیں، «رفع الخطأ والنسيان» کی بنا پر؛ حنابلہ جبر اور بھول میں کفارہ نہیں مانتے، مگر بھول میں محلوف علیہ کام ہو جائے تو طلاق اور آزادی واقع ہو جاتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7692}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7693} تقسیم میں غلطی: شافعیہ اور حنابلہ دعوے کے لیے ثبوت کی شرط رکھتے ہیں؛ حنفیہ بینہ نہ ہونے پر شرکاء سے قسم لیتے ہیں؛ مالکیہ جان بوجھ کی زیادتی اور غلطی میں فرق کرتے ہیں، اور ماہرین کے ثبوت پر فاحش غلطی سے تقسیم باطل۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7693}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7694} اقرار میں غلطی: شافعیہ کے اصح قول میں اقرار سے رجوع قبول ہے اور مال اسی کے قبضے میں رہے گا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7694} گواہی میں غلطی: حنفیہ فیصلے کے بعد عادل گواہ کا کہنا کہ کچھ میں غلطی ہوئی قبول کرتے ہیں؛ مالکیہ، شافعیہ اور حنابلہ فیصلے سے پہلے اور بعد اور خون اور مال میں فرق کرتے ہیں؛ قصاص اور حد کی گواہی سے فیصلہ کے بعد رجوع ہو تو سزا روک دی جاتی ہے اور دیت گواہوں کے مال پر ہوگی؛ جمہور کے نزدیک خطا سے رجوع کرنے والے گواہ کو تعزیر نہیں ہوتی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7694}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7695}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7695}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7696} فیصلے میں خطأ: فیصلہ اس وقت کالعدم ہوتا ہے جب استدلال یا سبب میں غلطی ظاہر ہو؛ دائیں کی جگہ بائیں ہاتھ کاٹنے پر ابو حنیفہ کے نزدیک ضمان نہیں، زفر کے نزدیک ضمان ہے؛ مالکیہ برابر کے درمیان غلط کٹ کو کافی کہتے ہیں؛ شافعیہ عاقلہ یا بیت المال پر ڈالتے ہیں؛ حنابلہ حد سے زیادہ کا ضمان لیتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7696}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7697}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7697}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7698} قصاص میں خطأ: حنفیہ ابو حنیفہ کے نزدیک زیادتی کے ساتھ قتل پر دیت لازم کرتے ہیں؛ مالکیہ زائد حصے کا ارادی ہونے پر قصاص لیتے ہیں؛ شافعیہ عمدی زیادتی پر قود اور خطأ پر ارش؛ حنابلہ خطأ کی زیادتی پر ارش۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7698} فتوے میں خطأ: حنفیہ مفتی کے ضامن ہونے میں مختلف ہیں؛ مالکیہ مقلد کو ضامن مانتے ہیں اگر وہ فتوے پر عمل کرے؛ شافعیہ \u2066\u2066\u2066⁦(ابو اسحاق)⁩\u2069\u2069\u2069 اہل ہو تو ضامن؛ حنابلہ کے نزدیک قاضی اور مفتی دونوں ضامن ہیں جب خطأ قطعی دلیل کے خلاف ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7699}'
  es: "Khata' es léxicamente lo opuesto a correcto; quien pierde el camino se desvía de él, y un arquero que falla el blanco no lo ha alcanzado; khati'a es un pecado, el verbo con intención es khatiya y sin intención akhta'a. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7652}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7653} Técnicamente es un acto realizado sin intención hacia el objeto del acto: Kamal ibn al-Humam da el ejemplo de enjuagarse la boca que llega a la garganta de un hombre en ayunas, y disparar a la caza que golpea a un humano. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7653} La mayoría de los juristas tratan ghalat como igual a khata'; Algunos malikíes distinguen que khata' está en el corazón y ghalat en la lengua, sin embargo, ghalat toma el dictamen de khata; Abu Hilal al-'Askari distingue que ghalat es colocar una cosa fuera de su lugar y puede ser correcto en sí mismo, mientras que khata' nunca es correcto de ninguna manera. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7653} La mayoría de los juristas usan khata' para lo que se escapa de la lengua sin intención, mientras que los malikíes usan ghalat para lo que concierne a la creencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7654} Los términos cercanos son olvido, falta de atención, distracción y descuido; coacción (obligar a otro contra su voluntad, sin llegar a la coacción que elimina la elección); broma (hablar sin sentido); e ignorancia, simple o compuesta; El que está en error no es responsable de aquello en lo que se equivocó. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7654}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7655} La ignorancia y el error excusan en lo prohibido, no en lo ordenado; no excusan nada en los derechos de las personas, por lo que los ignorantes y los equivocados pagan por lo que destruyen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7655} Los usulis difieren en si el acto de uno que está en error puede llamarse lícito o ilícito: al-Asnawi sostiene que lo lícito y lo ilícito se aplican a las personas responsables, por lo que el error no se describe; al-Shatibi sostiene que el error y el olvido están en una zona de perdón. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7655}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7656} La mayoría de los juristas sostienen que el error excusa algunos de los derechos de Dios, pero no todos, citando el informe \"Dios ha quitado de mi comunidad el error y el olvido\"; los derechos de las personas no se quitan por el error, por lo que se deben bienes destruidos y dinero de sangre, ya que esa es una regla de gobierno, no de mandato. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7656}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7657} Al-Qurtubi distingue: el tipo que nunca se quita, como las multas, el dinero de sangre y las oraciones obligatorias; el tipo que siempre se quita, como la represalia y la declaración de incredulidad bajo coacción; y el tipo disputado, como aquel que come en Ramadán por olvido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7657} La máxima \"no se le da peso a una suposición claramente errónea\" es sostenida por los Hanafis y Shafiis; un caso: aquel que pensó que el amanecer estaba cerca y lo rezó antes de la isha perdida, luego vio que el tiempo era largo, debe repetir la oración del amanecer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7658}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7659} Casos Shafii: aquel que se pensó puro, rezó, y luego se manifestó su impureza, o aquel que rezó detrás de un imán que creía musulmán que resultó ser un incrédulo, y así sucesivamente, en su mayoría nulos. Los Malikis usan la máxima de manifestación clara; Ibn Rajab establece reglas sobre quien dispone de lo que cree que no posee. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7659}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7660} Error en la pureza: quien juzga un recipiente o tela por conjetura y luego lo encuentra impuro debe repetir, según los Hanafis, Shafiis y una opinión Maliki; los Hanbalis no aplican la misma regla. Error en la intención para el wudu: por acuerdo de Malikis, Shafiis y Hanbalis, la intención menor puede ser superada; los Hanafis no requieren intención para el wudu o lavado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7661}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7662} Error en la intención para el lavado mayor y la ablución seca: la intención del lavado para la impureza sexual cuando proviene de un sueño húmedo no es dañina para los shafiíes y hanafíes; una mujer menstruante que solo pretende la impureza mayor plantea una disputa malikí. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7662}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7663} La entrada continúa en las páginas siguientes. Sobre la ablución seca: los malikíes e Ibn Maslama la permiten, los shafiíes aceptan una intención errónea para el estado menor cuando uno está en el mayor, y los hanbalíes requieren que se especifique el propósito. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7664} Quien tenía agua en su equipaje, la olvidó, la buscó, no la encontró, se ablutó y rezó: válido para los malikíes, una visión shafií y los hanbalíes; la otra visión shafií requiere repetición por su negligencia del equipaje. Quien sabía del agua pero pensó que se había agotado debe repetir, según los hanafíes, los malikíes, la visión shafií más sólida y los hanbalíes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7664}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7665} En la intención de la oración: donde no es necesario especificar la cosa, el error no causa daño, como con el lugar, la hora y el número de unidades; donde debe especificarse, el error causa daño, como con una oración del mediodía que se pretende hacer por la tarde. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7665} Sobre seguir a un imán: el error sobre su identidad generalmente no causa daño; tener la intención de orar por una persona y encontrar a otra invalida la oración fúnebre según la mayoría de las escuelas, y los hanbalíes difieren en cuanto al sexo del difunto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7665}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7666} Sobre ada' y qada' y el día equivocado: los malikíes generalmente validan; los hanafíes y shafiíes invalidan excepto en ciertos casos; los hanbalíes validan qada' con una intención errónea de ada' cuando el error muestra que va en contra de la creencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7666}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7667} Sobre la oración antes de tiempo: inválida por acuerdo, ya sea por intención o error. Los shafiíes requieren cierto conocimiento o una estimación válida; los hanbalíes aceptan una estimación fuerte y repiten si la oración resulta temprana. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7667}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7668} Sobre el error en la qibla: los hanafíes aceptan ijtihad sin repetición; los malikíes repiten dentro del tiempo si había señales claras y uno miraba en la dirección equivocada; los shafiíes tienen dos puntos de vista una vez que el error es seguro; los hanbalíes no requieren repetición para el ijtihad, pero los videntes en casa y los ciegos sin guía repiten. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7668} Sobre el error en la recitación: los hanafíes distinguen los errores de flexión, que no invalidan a menos que cambien el significado gravemente, de los errores de letras y palabras, y tratan los casi sinónimos como inofensivos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7668}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7669} Sobre el error en la recitación en cuanto afecta al seguidor: los malikíes examinan la oración detrás de un recitador defectuoso, algunos la anulan por completo o por detalle, y la validan cuando el recitador no puede aprender; los shafiíes validan seguir a uno cuyo error no cambia el significado, y la anulan cuando el sentido del capítulo inicial cambia y él no puede corregirlo; Los hanbalíes consideran que quien no puede recitar el capítulo inicial, o cuyas faltas cambian su significado, no es apto para liderar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7670}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7671} Habla en la oración: los hanafíes anulan la oración por hablar por olvido, intención o error; otros separan el habla leve, que no la anula, del habla abundante, que sí la anula. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7671} La duda del imán: si dos personas en quienes confía le dicen de un error, debe seguirlos, a los tres imanes; al-Shafii sostiene que si juzga que su error es probable, no necesita seguirlos; si está seguro de su propia corrección, los hanafíes, los malikíes, la opinión shafií más sólida y la mayoría de los hanbalíes no siguen a los seguidores. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7672} Error en la oración del temor: si las tropas vieron una forma oscura y la tomaron por un enemigo, rezaron la oración del temor extremo, y resultó ser lo contrario, los Hanafis, Hanbalis y una opinión Shafii requieren repetición; los Malikis no. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7672}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7673} Zakat: si la fruta resulta ser más de lo estimado, los Malikis toman zakat sobre el excedente; si el propietario afirma que la estimación fue demasiado alta, los Hanbalis aceptan su palabra si la afirmación es plausible; los Shafiis distinguen por la magnitud del error. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7673}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7674} Error en el receptor del zakat: si se da a alguien considerado elegible que demuestra no serlo, los hanafíes y una opinión shafií lo consideran válido; Abu Yusuf, los hanbalíes y la opinión shafií más sólida, cuando el dador es el gobernante, que se recupere la suma; los hanbalíes lo consideran inválido si se da a un incrédulo o a alguien no elegible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7674}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7675} Ayuno: quien da una intención general para Ramadán, o se equivoca en su descripción, tiene un ayuno válido según los Hanafis y una opinión de otros, ya que el tiempo está fijado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7675} Quien rompe el ayuno por olvido no debe expiación. El agua que entra por error al enjuagarse anula el ayuno y solo requiere una compensación según los Hanafis, Malikis y una opinión Shafii; los Hanbalis y otra opinión Shafii sostienen que no lo anula. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7676} Error sobre el tiempo: quien comió creyendo que no había amanecido, o rompió el ayuno creyendo que el sol se había puesto, debe una compensación pero no expiación según la mayoría de los juristas; los Hanbalis requieren tanto compensación como expiación por el coito, incluso por error. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7676}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7677} Hajj: si todos los peregrinos se equivocaron y se pararon el décimo, los Hanafis, Shafiis y Hanbalis lo consideran válido; los Malikis distinguen por cuántos se equivocaron; pararse el octavo creyendo que era el noveno es inválido para los Hanafis, Malikis y la opinión más sólida de Shafii, válida para los Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7677}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7678} Errar en el lugar de estar de pie y estar fuera de Arafat requiere una compensación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7679} Matar animales de caza en el recinto sagrado, o cazar por alguien en estado de ihram, está prohibido y conlleva una compensación ya sea que se haga por intención o error, por acuerdo; los Hanafi y los Maliki tratan los errores y la intención por igual para las prohibiciones del ihram, mientras que los Shafii y los Hanbali distinguen la destrucción del disfrute. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7679} Sobre el error en un sacrificio: si dos hombres sacrifican por error a la víctima del otro, los Hanafis y Hanbalis lo consideran válido y no deben nada, por istihsan (la regla analógica requeriría una deuda); los Malikis lo consideran inválido, debiendo cada uno al otro el valor; los Shafiis requieren pagar la diferencia de valor, y cada víctima cuenta si se debía por un voto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7680} Venta por error: los Hanafis sostienen que una venta verbalizada por error se considera concluida pero es nula por falta de consentimiento; los Malikis, Shafiis y Hanbalis sostienen que no se ha concluido, ya que la venta necesita conocimiento e intención. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7680}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7681} Error en el objeto de la venta: en caso de error de tipo o diferencia grave, los Hanafis, excepto al-Karkhi, consideran que el contrato no se ha celebrado, al-Karkhi lo considera nulo; los Malikis ignoran un error que la otra parte desconocía; si se nombra la cosa erróneamente, el comprador no está obligado y el vendedor tampoco por acuerdo; los Shafiis y los Hanbalis anulan la venta de una cosa desconocida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7681}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7682} Contratación: el tasador que se equivoca no debe nada según los Hanafis, Shafiis y Hanbalis (los Hanbalis requieren habilidad y confianza); los Shafiis hacen responsable al encargado de la balanza por errores de pesaje; el trabajador asalariado que pierde mercancías por transgresión o negligencia grave es responsable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7682}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7683} Escriba: los Hanafis dividen el error por las hojas afectadas, y los Shafiis dan una tarifa por el trabajo correcto, hacen que el escriba pague por el papel si el error es grave y le exigen que lo corrija. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7683} Médico, circuncidador y cuper: no hay responsabilidad por lo que hacen con permiso, siempre que sean hábiles y no excedan el lugar apropiado; excederlo los hace responsables ya sea por intención o error. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7683}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7684} Error al describir propiedad perdida: los Hanafis requieren que cada signo coincida; los Malikis distinguen errores en la bolsa, el cordón y las monedas; Ibn Rushd entiende por error concebir una cosa de manera diferente a como es. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7684} Error en shuf'a: si el comprador dijo que pagó cien, el preceptor renunció a su derecho, y el precio resultó ser cincuenta, los shafiíes y hanbalíes conservan su derecho; los hanafíes lo conservan si el precio resultó ser menor al declarado, ya que su consentimiento se basó en la cifra más alta; los malikíes lo conservan cuando el precio resultó ser menor, el reclamante jurando que renunció debido a la mentira sobre el precio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7684}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7685} Sobre el error en shuf'a: si al preemptioner se le dijo que cierto hombre había comprado la parte de su socio y había renunciado a su derecho por buena opinión del comprador, y se demostró que había comprado con otro, la mayoría mantiene su derecho, ya que su consentimiento fue solo para ese socio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7685}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7686} Matrimonio: los hanafíes sostienen que un texto distorsionado por una mala pronunciación no concluye el contrato, mientras que un uso común que significa matrimonio es válido según los hanafíes, los shafiíes y una visión hanbalí; El error en el nombre de la novia impide el contrato a menos que ella esté presente y se indique, donde los shafiíes y los hanbalíes distinguen nombrar de señalar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7686}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7687} Error en la novia: quien tenga relaciones sexuales con una mujer que le fue traída por error debe la dote adecuada y no hadd; el linaje se mantiene. Los shafiíes y los hanbalíes tratan a un padre y un hijo que se casan con dos mujeres y consuman el matrimonio por error: ambos contratos se disuelven y cada uno debe la dote de la que consumó; los hanbalíes remiten la dote al marido, puesto que ella participó en la disolución. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7687}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7688} Divorcio por lapsus: los shafiíes y los hanbalíes sostienen que un divorcio dicho por lapsus sin intención no surte efecto; los hanafíes sostienen que sí, puesto que el lapso de mente es difícil de probar; los malikíes requieren intención para pronunciar la fórmula, no su significado, y un lapsus es aceptado en el fallo del juez si se prueba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7688} Lesiones por error: el precio del homicidio involuntario lo deben los familiares del asesino, con la expiación por parte del asesino y la pérdida de la herencia por la mayoría de los juristas; para lesiones menores una suma total o una parte de la suma total por la herida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7688}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7689} Autolesiones por error: los Hanafis, Malikis y Shafiis no deben nada; los Hanbali (visión preferida) deben la suma a los herederos de los parientes si excede un tercio; Los Shafiis y Hanbalis deben expiación, pero no los Hanafis y Malikis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7689} Colisión por error: los juristas difieren en si cada uno debe compensar la pérdida del otro o pagar la mitad del valor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7689} Perforar un barco por error: los shafiíes tratan una perforación fatal deliberada como represalia o dinero de sangre y una perforación para reparación como cuasi intencional; una perforación en otro lugar es puro error; los hanafíes distinguen la responsabilidad del barquero por si el daño fue por su acto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7690} Error en los juramentos: los hanafíes requieren expiación por incumplimiento de un juramento dicho por lapsus; Ibn al-Humam disputa que el juramento de uno en error sea vinculante; Los malikíes distinguen un lapsus linguae (el juramento es vinculante) de un cambio de palabra mientras se quiere decir otra (se cree al hablante en conciencia); los shafiíes sostienen que un juramento dicho sin intención no es vinculante, excepto el juramento de divorcio, liberación o voto; los hanbalíes sostienen que no hay pecado ni expiación por un juramento dicho sin intención, excepto el divorcio y la manumisión sobre un hecho pasado que se cree verdadero. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7690}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7691} Sobre el juramento y la violación por error: los hanafíes requieren expiación por violación incluso bajo coacción u olvido; los malikíes sostienen que la violación por error cuenta, como cuando uno jura no entrar en una casa y entra en ella pensando que es otra; los shafiíes tienen dos puntos de vista, el preferido es que no hay violación, citando el informe de que el error y el olvido se levantan; Los hanbalíes no requieren expiación bajo coacción u olvido, pero el divorcio y la manumisión surten efecto si el acto jurado se realiza por olvido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7692}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7693} Error en la división: los shafiíes y los hanbalíes aceptan una reclamación de error con prueba; para una división obligatoria la reclamación necesita prueba, y para una consensual la división se anula solo con prueba; los hanafíes hacen jurar a los socios si no hay prueba; los malikíes distinguen el mal hecho por intención del error, y anulan solo cuando el error es grave y conocido por los expertos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7693}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7694} Error en una admisión: la visión shafií más sólida acepta una admisión retractada como un error, y la propiedad permanece con el admitidor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7694} Error en el testimonio: los hanafíes aceptan a un testigo justo que dice después del juicio que erró en parte; los malikíes, shafiíes y hanbalíes distinguen antes y después del fallo y sangre de propiedad; si los testigos de represalia o hadd se retractan después del fallo y dicen que erraron, la pena se suspende y el dinero de sangre cae sobre su propiedad; la mayoría de los juristas no disciplinan a los testigos que se retractan por error. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7694}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7695}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7695}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7696} Error de juicio: el fallo se anula cuando se demuestra el error de razonamiento o de causa; un gobernante que corta la mano izquierda en lugar de la derecha no es responsable ante Abu Hanifa, sino ante Zufar; los malikíes permiten un corte erróneo entre iguales; los shafiíes ponen la suma en el kin o en el tesoro público; los hanbalíes compensan el exceso sobre el hadd. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.7696}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.7697}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.7697}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.7698} Error en la represalia: los Hanafis sostienen que quien excede el objetivo previsto y mata debe el dinero de sangre de Abu Hanifa; los Maliki toman represalias por el exceso pretendido; los Shafiis exigen represalias por un exceso intencionado y una multa por un error; Los Hanbalis multan por el error. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7698} Error en una fatwa: los hanafíes difieren en cuanto a la responsabilidad del muftí; los malikíes responsabilizan a un seguidor si actúa conforme a la fatwa, pero no a un muftí que solo sea maestro; los shafiíes (y Abu Ishaq) responsabilizan al muftí si está cualificado; los hanbalíes responsabilizan tanto al juez como al muftí cuando el error contradice un texto claro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7699}"
  fr: "Khata' est lexicalement l'antonyme de « droit »; celui qui rate le chemin s'en éloigne, et un archer qui manque sa cible ne l'a pas atteinte; khati'a est un péché, le verbe avec intention étant khatiya et sans intention akhta'a. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7652}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7653} Techniquement, il s'agit d'un acte accompli sans intention envers l'objet de l'acte: Kamal ibn al-Humam donne l'exemple du rinçage de la bouche qui atteint la gorge d'un homme à jeun, et du tir sur du gibier qui atteint un être humain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7653} La plupart des juristes considèrent ghalat comme équivalent à khata'; Certains malikites distinguent la khata', qui relève du cœur, de la ghalat, qui relève de la langue. Cependant, la ghalat est soumise à la règle de la khata'. Abu Hilal al-'Askari précise que la ghalat consiste à déplacer une chose de sa place et peut être juste en soi, tandis que la khata' n'est jamais juste. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7653} La plupart des juristes utilisent le terme khata' pour désigner ce qui s'échappe de la langue involontairement, tandis que les malikites utilisent le terme ghalat pour ce qui concerne la croyance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7654} Les termes proches sont l'oubli, l'inattention, la distraction et l'insouciance; la contrainte (le fait de forcer quelqu'un contre son gré, à l'exception de la contrainte qui supprime le libre arbitre); la plaisanterie (parler sans réfléchir); et l'ignorance, simple ou composée. Celui qui est dans l'erreur n'est pas responsable de son erreur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7654}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7655} L'ignorance et l'erreur excusent ce qui est interdit, non ce qui est commandé; elles n'excusent rien en matière de droits des personnes, aussi les ignorants et les égarés paient-ils pour ce qu'ils détruisent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7655} Les usulis divergent quant à la licéité ou l'illicéité de l'acte commis dans l'erreur: al-Asnawi considère que licite et illicite s'appliquent aux personnes responsables, l'erreur n'est donc pas qualifiée de telle ou telle. al-Shatibi, quant à lui, considère que l'erreur et l'oubli relèvent du domaine du pardon. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7655}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7656} La plupart des juristes estiment que l'erreur excuse certains droits de Dieu, mais pas tous, citant le hadith: « Dieu a éloigné de ma communauté l'erreur et l'oubli ». Les droits des personnes ne sont pas levés par l'erreur; ainsi, les biens détruits et le prix du sang restent dus, car il s'agit d'une règle de jugement et non d'un commandement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7656}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7657} Al-Qurtubi établit une distinction: les dettes qui ne sont jamais levées, telles que les amendes, le prix du sang et les prières obligatoires; Les fautes suivantes sont toujours acceptées: la vengeance et l’incroyance proférée sous la contrainte; et les fautes contestées, comme celle de manger pendant le Ramadan par oubli. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7657} La maxime « on ne tient pas compte d’une supposition manifestement erronée » est partagée par les écoles hanafite et chaféite. Exemple: celui qui, croyant l’aube proche, a prié avant la prière de l’Isha manquée, puis s’est aperçu que le temps était long, doit refaire la prière de l’aube. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7658}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7659} Cas chaféites: celui qui se croyait pur, a prié, puis son impureté est apparue, ou qui a prié derrière un imam qu’il croyait musulman et qui s’est révélé incroyant, etc., sont généralement considérés comme non valides. Les Malikites utilisent la maxime de la manifestation claire; Ibn Rajab établit des règles concernant celui qui dispose de ce qu'il croit ne pas posséder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7659}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7660} Erreur de pureté: celui qui juge un récipient ou un tissu par conjecture et le trouve impur doit recommencer, selon les Hanafites, les Shafiites et une opinion malikite; les Hanbalites n'appliquent pas cette règle. Erreur d'intention pour les ablutions: de l'avis des Malikites, des Shafiites et des Hanbalites, une intention moindre peut être acceptée; les Hanafites n'exigent pas d'intention pour les ablutions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7661}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7662} Erreur d'intention concernant les ablutions majeures et les ablutions sèches: selon les écoles chaféite et hanafite, le fait d'effectuer les ablutions pour purifier une impureté sexuelle suite à un rêve érotique n'est pas préjudiciable; en revanche, pour une femme menstruée, l'intention de se purifier uniquement des impuretés majeures soulève une controverse malikite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7662}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7663} La suite de cet article se trouve dans les pages suivantes. Concernant les ablutions sèches: les malikites et Ibn Maslama les autorisent, les chaféites acceptent une intention erronée de se purifier des impuretés mineures alors qu'on est déjà en état d'impureté majeure, et les hanbalites exigent que le but soit précisé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7664} Celui qui avait de l'eau dans ses bagages, l'a oubliée, l'a cherchée, n'en a pas trouvé, se purifie et prie: ceci est valable pour les Malikites, une opinion chaféite et les Hanbalites; l'autre opinion chaféite exige une nouvelle prière en raison de cet oubli. Celui qui savait qu'il y avait de l'eau mais pensait l'avoir épuisée doit renouveler sa prière, selon les Hanafites, les Malikites, l'opinion chaféite la plus solide et les Hanbalites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7664}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7665} Concernant l'intention de prière: lorsque l'élément n'a pas besoin d'être précisé, l'erreur est sans conséquence, comme pour le lieu, l'heure et le nombre d'unités; lorsque l'élément doit être précisé, l'erreur est préjudiciable, comme pour la prière de midi voulue comme celle de l'après-midi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7665} Concernant le suivi d'un imam: une erreur sur son identité est généralement sans conséquence; si l'on souhaite prier pour une personne et qu'on en trouve une autre, la prière funéraire est invalidée par la plupart des écoles, et les Hanbalites divergent sur le sexe du défunt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7665}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7666} Concernant l'ada' et le qada', ainsi que le jour erroné: les Malikites valident généralement; les Hanafites et les Shafi'ites invalident, sauf dans certains cas; les Hanbalites valident le qada' avec une intention erronée d'ada' lorsque l'erreur est contraire à la croyance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7666}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7667} Concernant la prière accomplie avant l'heure: elle est invalide par consensus, que ce soit intentionnel ou par erreur. Les chaféites exigent une connaissance certaine ou une estimation valable; les hanbalites acceptent une estimation fiable et refont la prière si elle est accomplie trop tôt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7667}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7668} Concernant l'erreur de qibla: les hanafites acceptent l'ijtihad sans répétition; les malikites refont la prière dans l'heure si des signes clairs étaient présents et que l'on s'est orienté dans la mauvaise direction; les chaféites ont deux avis lorsque l'erreur est certaine; Les Hanbalites n'exigent aucune répétition pour l'ijtihad, mais les voyants chez eux et les aveugles sans guide répètent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7668} Concernant l'erreur de récitation: les Hanafites distinguent les erreurs d'inflexion, qui n'invalident pas la prière sauf si elles en modifient gravement le sens, des erreurs de lettres et de mots, et considèrent les quasi-synonymes comme inoffensifs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7668}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7669} Concernant l'erreur de récitation et son impact sur le fidèle: les Malikites examinent la prière derrière un récitateur fautif, certains l'invalidant purement et simplement ou par des détails, et la validant lorsque le récitateur ne peut apprendre. Les chaféites valident la récitation de la sourate initiatique lorsque l'erreur n'en modifie pas le sens, et l'invalident lorsque le sens de la sourate initiatique est altéré et que l'imam ne peut le corriger. Les hanbalites considèrent comme inapte à diriger la prière celui qui ne peut réciter la sourate initiatique ou dont les erreurs en modifient le sens. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7670}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7671} Paroles pendant la prière: les hanafites invalident la prière par des paroles prononcées par oubli, intention ou erreur; d'autres distinguent les paroles brèves, qui n'invalident pas la prière, des paroles abondantes, qui l'invalident. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7671} Le doute de l'imam: si deux personnes de confiance lui signalent une erreur, il doit suivre leur avis, ainsi que celui des trois imams; al-Shafi'i soutient que s'il juge leur erreur probable, il n'est pas tenu de les suivre. S'il est certain de sa propre exactitude, les Hanafites, les Malikites, l'avis shafi'ite le plus solide et la plupart des Hanbalites ne suivent pas les autres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7672} Erreur dans la prière de crainte: si les troupes ont aperçu une forme sombre et l'ont prise pour un ennemi, ont récité la prière de crainte extrême, et que cela s'est avéré être autre chose, les Hanafites, les Hanbalites et un avis shafi'ite exigent une répétition; les Malikites ne l'exigent pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7672}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7673} Zakat: si la récolte s'avère plus abondante que prévu, les Malikites prélèvent la zakat sur le surplus; si le propriétaire prétend que l'estimation était trop élevée, les Hanbalites acceptent sa parole si l'affirmation est plausible; Les shafi'ites font une distinction selon l'ampleur de l'erreur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7673}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7674} Erreur concernant le bénéficiaire de la zakat: si elle est versée à une personne considérée comme éligible mais qui ne l'est pas, les hanafites et une opinion shafi'ite la considèrent valide; selon Abu Yusuf, les hanbalites et l'opinion shafi'ite la plus solide, lorsque le donateur est le dirigeant, la somme doit être recouvrée; les hanbalites la considèrent invalide si elle est versée à un incroyant ou à une personne non éligible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7674}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7675} Jeûne: selon l’école hanafite et une autre école, quiconque exprime une intention générale pour le Ramadan, ou se trompe dans sa formulation, a un jeûne valide, car la durée est fixe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7675} Celui qui rompt le jeûne par oubli n’a pas d’expiation à payer. L’eau qui entre accidentellement dans la vaisselle lors du rinçage annule le jeûne et ne requiert qu’un rattrapage selon les écoles hanafite, malikite et une école chaféite; les écoles hanbalite et une autre école chaféite considèrent que cela ne l’annule pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7676} Erreur sur l'heure: celui qui a mangé en croyant que l'aube n'était pas encore levée, ou qui a rompu le jeûne en croyant que le soleil était couché, doit rattraper le repas manqué mais pas payer d'expiation selon la plupart des juristes; les Hanbalites exigent à la fois rattraper le repas manqué et payer d'expiation pour les rapports sexuels, même par erreur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7676}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7677} Hajj: si tous les pèlerins se sont trompés et sont restés le dixième jour, les Hanafites, les Shafiites et les Hanbalites considèrent cela comme valide; les Malikites font une distinction selon le nombre de personnes qui se sont trompées; Se tenir sur le huitième point en croyant qu'il s'agit du neuvième est invalide pour les écoles hanafite, malikite et shafi'ite (plus rigoureuse), mais valide pour l'école hanbalite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7677}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7678} Se tromper de point de vue ou se tenir hors d'Arafat requiert une réparation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7679} Tuer du gibier dans l'enceinte sacrée, ou chasser du gibier en état d'ihram, est interdit et entraîne une compensation, que ce soit intentionnel ou non, par accord mutuel; les écoles hanafite et malikite traitent l'erreur et l'intention de la même manière concernant les interdictions de l'ihram, tandis que les écoles shafi'ite et hanbalite distinguent la destruction de la jouissance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7679} Concernant l'erreur dans un sacrifice: si deux hommes immolent chacun la victime de l'autre par erreur, les Hanafites et les Hanbalites considèrent le sacrifice comme valide et n'imposent aucune dette, par istihsan (la règle analogique exigerait une dette); les Malikites le considèrent comme invalide, chacun devant à l'autre la valeur du sacrifice; les Chafiites exigent le paiement de la différence de valeur, et chaque victime est comptabilisée si elle était due par un vœu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7680} Vente par erreur: les Hanafites considèrent qu'une vente conclue par inadvertance est valable mais nulle faute de consentement; les Malikites, les Chafiites et les Hanbalites considèrent qu'elle n'est pas conclue, car la vente requiert connaissance et intention. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7680}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7681} Erreur sur l'objet de la vente: en cas d'erreur de nature ou de différence majeure, les Hanafites, à l'exception d'al-Karkhi, considèrent que le contrat n'est pas conclu; al-Karkhi le déclare nul; les Malikites ne tiennent pas compte d'une erreur que l'autre partie ignorait; si la désignation de la chose est erronée, ni l'acheteur ni le vendeur ne sont liés par accord; les Shafi'ites et les Hanbalites annulent la vente d'une chose inconnue. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7681}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7682} L'évaluateur qui commet une erreur n'est pas responsable selon les écoles hanafite, chaféite et hanbalite (les hanbalites exigent compétence et confiance); les chaféites rendent le peseur responsable des erreurs de pesée; le salarié qui perd des marchandises par transgression ou négligence grave est responsable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7682}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7683} Le scribe: les hanafites répartissent l'erreur entre les feuilles concernées, tandis que les chaféites rémunèrent le scribe pour un travail correct, lui font payer le papier en cas d'erreur importante et exigent qu'il corrige l'erreur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7683} Médecin, circonciseur et ventouser: aucune responsabilité ne leur est engagée pour les actes qu’ils accomplissent avec permission, pourvu qu’ils soient compétents et qu’ils n’outrepassent pas leurs limites; tout dépassement de ces limites les rend responsables, que ce soit intentionnel ou par erreur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7683}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7684} Erreur dans la description d’un objet perdu: les hanafites exigent que tous les signes correspondent; les malikites font la distinction entre les erreurs concernant le sac, la ficelle et les pièces de monnaie; Ibn Rushd considère qu’une erreur consiste à concevoir une chose différemment de ce qu’elle est. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7684} Erreur de shuf'a: si l'acheteur a déclaré avoir payé cent, que le préempteur a renoncé à son droit et que le prix s'est avéré être de cinquante, les Shafi'ites et les Hanbalites conservent son droit; les Hanafites le conservent si le prix s'est avéré inférieur à celui déclaré, puisque son consentement reposait sur le chiffre le plus élevé; les Malikites le conservent lorsque le prix s'est avéré inférieur, le demandeur jurant qu'il a renoncé en raison du mensonge sur le prix. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7684}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7685} En cas d'erreur dans la shuf'a: si le préempteur est informé qu'un certain homme a acheté la part de son associé et a renoncé à son droit par égard pour l'acheteur, et qu'il est prouvé qu'il a acheté avec un autre, la majorité conserve son droit, puisque son consentement était valable uniquement pour cet associé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7685}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7686} Mariage: les Hanafites considèrent qu'un texte déformé par une mauvaise prononciation ne conclut pas le contrat, tandis qu'un usage courant signifiant que le mariage est valide selon les Hanafites, les Shafi'ites et une opinion hanbalite; Une erreur dans le nom de la mariée empêche la validité du contrat, sauf si elle est présente et désignée. Les écoles shafi'ite et hanbalite distinguent le fait de nommer la mariée de le désigner. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7686}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7687} Erreur concernant la mariée: celui qui a des relations sexuelles avec une femme qui lui a été amenée par erreur doit s'acquitter de la dot et est dispensé de hadd; la filiation est maintenue. Les écoles chaféite et hanbalite traitent le cas d'un père et de son fils qui épousent deux femmes et consomment le mariage par erreur: les deux contrats sont dissous et chacun doit la dot de celle avec qui il a consommé le mariage; les hanbalites restituent la dot au mari, puisqu'elle a participé à la dissolution. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7687}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7688} Divorce par lapsus: les chaféites et les hanbalites estiment qu'un divorce prononcé par lapsus sans intention est sans effet; les hanafites estiment qu'il est valable, car l'oubli est difficile à prouver; les malikites exigent l'intention de prononcer la formule, et non sa signification, et le lapsus est accepté par le juge s'il est prouvé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7688} Blessures par erreur: le prix d'un homicide involontaire est dû par les proches du tueur avec expiation par le tueur et perte d'héritage par la plupart des juristes; pour les blessures mineures, une somme totale ou une part de la somme totale par la plaie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7688}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7689} Automutilation par erreur: les Hanafis, Malikis et Shafiis ne doivent rien; les Hanbalis (vue préférée) doivent la somme aux héritiers des parents si elle dépasse le tiers; l'expiation est due par les Shafiis et les Hanbalis mais pas par les Hanafis et les Malikis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7689} Collision par erreur: les juristes divergent quant à savoir si chacun doit réparer le préjudice subi par l’autre ou payer la moitié de la valeur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7689} Perforation accidentelle d’une embarcation: les chaféites considèrent une perforation mortelle délibérée comme une vengeance ou un prix du sang, et une perforation destinée à la réparation comme quasi intentionnelle; une perforation ailleurs est une pure erreur; les hanafites distinguent la responsabilité du batelier selon que le dommage résulte ou non de son acte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7690} Erreur dans les serments: les hanafites exigent une expiation en cas de violation d’un serment prononcé par inadvertance; Ibn al-Humam conteste la validité du serment prêté par erreur. Les Malikites distinguent le lapsus (le serment est contraignant) de l'erreur de sens (le locuteur est cru en conscience); les Chafiites considèrent qu'un serment prononcé sans intention n'est pas contraignant, sauf le serment de divorce, d'affranchissement ou de vœu; les Hanbalites ne considèrent ni péché ni expiation pour un serment prononcé sans intention, sauf le divorce et l'affranchissement fondés sur un fait passé considéré comme véridique. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7690}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7691} Concernant le serment et la violation par erreur: les Hanafites exigent une expiation en cas de violation, même sous la contrainte ou par oubli; les Malikites considèrent que la violation par erreur est valable, par exemple lorsqu'on jure de ne pas entrer dans une maison et qu'on y entre en pensant qu'il s'agit d'une autre; les Chafiites ont deux avis, le préféré étant qu'il n'y a pas de violation, citant le hadith selon lequel l'erreur et l'oubli sont levés; Les Hanbalites n'exigent aucune expiation en cas de contrainte ou d'oubli, mais le divorce et l'affranchissement sont effectifs même si l'acte sous serment a été accompli par oubli. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7692}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7693} Erreur de partage: les Shafi'ites et les Hanbalites acceptent une allégation d'erreur justifiée par une preuve; pour un partage obligatoire, la preuve est requise, et pour un partage par consentement mutuel, le partage n'est annulé que sur preuve; les Hanafites exigent un serment des époux en l'absence de preuve; les Malikites distinguent la faute intentionnelle de l'erreur et n'annulent que si l'erreur est manifeste et connue des experts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7693}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7694} Erreur dans un aveu: l’avis shafi’ite, plus solide, considère qu’un aveu rétracté est une erreur, et le bien reste acquis à celui qui l’a admis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7694} Erreur dans un témoignage: les hanafites acceptent un témoin juste qui déclare après le jugement avoir partiellement erré; les malikites, les shafi’ites et les hanbalites font la distinction entre l’avant et l’après jugement, et entre le sang versé et la propriété; si des témoins dans une affaire de représailles ou de hadd se rétractent après le jugement et reconnaissent leur erreur, la peine est suspendue et le prix du sang est versé sur leurs biens; la plupart des juristes ne sanctionnent pas les témoins qui se rétractent par erreur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7694}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7695}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7695}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7696} Erreur de jugement: la décision est annulée lorsque l’erreur de raisonnement ou de cause est manifeste; un dirigeant qui coupe la main gauche au lieu de la droite n’est pas responsable selon Abu Hanifa, mais l’est selon Zufar; les Malikites admettent une erreur de coupe entre égaux; les Shafi’ites imputent la somme à la famille ou au trésor public; les Hanbalites compensent l’excédent par rapport au hadd. } Erreur dans les représailles: les Hanafis estiment que celui qui dépasse le seuil prévu et tue doit payer le prix du sang d'Abu Hanifa; les Malikis ripostent aux excès envisagés; les Shafiis exigent des représailles pour un excès intentionnel et une amende pour une erreur; les Hanbalis amendent pour l'erreur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7698} Erreur dans une fatwa: les Hanafites divergent quant à la responsabilité du mufti; les Malikites tiennent pour responsable le fidèle qui agit selon la fatwa, mais pas le mufti qui n’est qu’un enseignant; les Chafiites (et Abou Ishaq) rendent le mufti responsable s’il est qualifié; les Hanbalites tiennent pour responsables à la fois le juge et le mufti lorsque l’erreur est contraire à un texte clair. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7699}"
  tr: "Hata dilsel olarak doğruluğun tam tersi anlamına gelir; yol yanlışsa düzeltilir; atıcı amacı yanlış yaparsa vurulmaz; günah günah ve günahtır, kasıtlı ise hata, kasıtlı değilse hata olur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7652} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7653} Teknik olarak, bir kişinin amaçlanan eylem dışında bir amacı yerine getirirken kasıtsız olarak yaptığı bir eylemdir. Al-Kamal ibn al-Hummam tarafından, oruç tutan kişinin ağzını çalkalamak ve bir kişiye zarar veren bir oyun atmak gibi amaçlanan suçun dışında bir eylemi amaçlamak olarak tanımlanmıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7653} Çoğu hukukçuya göre, hata hataya eşdeğerdir; bazı Malikiler hatanın delilikle, hata dile ilgili olduğunu savunurken, hata hata olarak kabul edilir; Abu Hilal al-Askari ise hatanın bir şeyi yanlış yerine koymak olduğunu ve kendisi doğru olabileceğini, ancak hatanın her durumda doğru olmadığını savunmuştur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7653} Hukukçuların çoğu, dilde istemeden olanları 'hata' kelimesiyle ifade ederken, Malikiler hataya inanmakla ilgili olanı ifade eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7654} İlgili terimler: unutkanlık, unutkanlık, dikkatsizlik, şaşkınlık, zorlama (başkalarını onaylamadıkları ama sığınak olmayan şeyleri yapmaya zorlamak), şaka (kelimenin hiçbir anlamı olmadığını), cehalet (basit veya karmaşık); hata yapan hatasından sorumlu değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7654} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7655} Cehalet ve hata, emirler için değil, yasaklar için mazerettir ve insan hakları için mazeret olarak kabul edilmez; çünkü cahil ve yoldan sapanlar yıktıklarından sorumludur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.. 7655} Usul (usul) âlimleri, suçlunun eylemini caiz ve yasak olarak tanımlamakta farklılık gösterirler; Al-Asnawi, caiz ve yasaklamanın hesap verebilirle ilgili hükümler olduğunu ve tarif edilemediğini savunurken, Al-Shatibi hata ve unutkanlığın af olarak kabul edildiğini savunur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7655} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7656} Çoğu hukukçu, hatanın Allah'ın bazı haklarından vazgeçmek için bir bahane olduğunu kabul eder, hepsinden değil ve 'Hata ve unutkanlık ulusumdan kaldırılır' hadisini kullanırlar; hizmetkârların hakları yanlışlıkla feragat edilmez, bu nedenle zararcılar ve kan parası için sorumluluk zorunludur, çünkü sorumluluk yerleşik otoritenin söyleminden kaynaklanır. {Cite:Fiqh-Mawsua-Kuwaitiyya-NOOR-V3 s.. 7656} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7657} Al-Qurtubi şunları detaylandırır: anlaşmayla vazgeçilmeyen yemin, para cezası, kan parası ve namazlar gibi; yemin anlaşmayla geçersiz sayılır, örneğin ceza ve inkarsızlık sözü söylemek; ve tartışmalı bir kısmı, Ramazan ayında yemek yemeyi unutan biri gibi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7657} Hanafi ve Şafi'lere göre \"Açık şüphe hatasıdır\" kuralı vardır. Uygulamaları arasında, şafak vaktinin kısa olduğunu düşünen kişinin onu İsha'nın önünde kılması, zaman yeterli olur ve tekrar etmesidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7658} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7659} Şafii uygulamaları arasında: Kim kendini temizlenmiş sanırsa namaz kılar ve sonra haberi netleşirse ya da imamının Müslüman olduğunu sanıp sonra kâfir görünürse, namaz çoğunlukla geçersizdir; Malikiler bunu görünür ve görünme ilkesine göre yorumlar, İbn Receb ise sahip olmadığını düşündüğü bir şeyi yapan kişi için kurallar getirir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7659} {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7660} Arınma hatası: Bir kabı veya giysiyi örtmeye çalışır ve sonra kirli görünürse, bu Hanafi ve Şafiilere göre tekrarlanmalıdır ve Malikilere göre Hanbaliler konuyu kendi kurallarına göre değerlendirmezler. Abdest alma niyetindeki hata: Yeni bir şeyi kaldırmak istiyorsan, Malikiler, Şafiiler ve Hanbalilere göre örtüşme kaldırılır, kasıtlı olmadıkça; Hanefiler ise abdest alma ve ritüel banyo için niyet gerektirmez. {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.7661} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7662} Güsl ve tayammumda hata: Cinsel ilişki sırasında janabah'ın çıkarılması niyeti, Şafi'ler ve Hanefi'lere göre zararlı olmayan gece salınımı biçimi olarak kabul edilir; regl olan bir kadın regl olmadan önce janabahı çıkarmayı planlıyorsa, Malikiler arasında anlaşmazlık vardır; janabah (janab) için tayammum yapar ve janabahını unutur, bu da Malik tarafından desteklenir. {cite:fiqh-mawsua-kuveytiyya-noor-v3 s.7662} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7663} Kapı aşağıdaki sayfalarda açık kalır. Tayammum: Maliki ve İbn Maslamah izin verir, Şafi'ler yanlış bir janabah (büyük ritüel kirlilik) olan birine küçük küçük kirlilikle namaz kılma niyetini doğrudur ve Hanbaliler tayammumun ne için yapıldığını belirtmelerini ister. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7664} Yolculukta suyu olan ve hata yapan, onu arar ama bulamazsa, sonra teyammum eder ve namaz kılar; bu Maliki ve Hanbali'ye göre yeterlidir, başka bir görüşe göre Şafii'lere göre ise diğer görüş eyerin ezberlenme ihmali nedeniyle tekrar gerektirir. Eğer suyu bilir ve suyun bittiğini düşünürse, teyammum eder ve tekrar Hanafi ve Maliki'lere göre namaz kılar; doğru görüş Şafi'ler ve Hani'lere göre olur. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7664} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7665} Dua sırasında niyet hatası: Bir şey şart olarak belirtilmemişse, hata ona zarar vermez, örneğin yer ve zaman belirtmek gibi. Belirtilmesi gerekenlerdeki hata zararlıdır, örneğin Dhuhr'dan Asr'a. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7665} Aşağıdaki örneklere örnekler: İmamın tanımlanmasındaki hatalar çoğuna göre zarar vermez; birisi Zaid için namaz kılmak istiyorsa, bu çoğu mezhebe göre geçerli değildir. Ölen kişinin türüyle ilgili hatalar Hanbaliler tarafından kabul edilmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7665} {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.. 76666} Kada Namazı, Gün Kadına Yapılan Imza ve Hatalar: Malikiler genellikle namazın özgünlüğüne hükmederken, Hanefiler ve Şafiiler bunu bazı durumlar dışında geçersiz kılar; Hanbaliler ise varsayımlarda bir fark varsa bunu yapmak amacıyla Kada'yı düzeltirler. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7667} Zamanı girme hatası: Zaman öncesi namaz kılmak kasıtlı ya da yanlışlıkla geçersizdir; Şafiilere göre belirli bilgi veya geçerli varsayım gerekirken, Hanbalilere göre şüphenin baskını yeterlidir; eğer namaz zamanından önce namaz kıldığı tespit edilirse, tekrar eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7667} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7668} Kıblede hata: Hanafiler ictihada izin verir ve incelemeden sonra hata yapanlar için tekrarlamaz; Malikiler işaretler ortaya çıktığında geri dönerler veya saparlarsa bunu tekrarlarlar; Şafiiler hata kesin olduğunda iki görüşe sahiptir; Hanbalılar muctihid için tekrarlamaz, şehirdeki anlayışlı ve delil olmadan körler tekrar eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7668} Okuma hatası: Hanafiler, anlamı değiştirmeyen ve geçersiz kılmayan dilbilgisi çekimindeki hatalar ile önceki akademisyenleri bozan büyük değişiklikleri ayırt ederler. Harfler ve kelimeler konusunda, harf değiştirme, ilerleme, gecikme, ekleme ve eksiklik konularını tartışırlar; bozmayan kelimelere anlam olarak yakın olan kelimeleri ele alırlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7669} Okudaki hata takipçiye aittir: Malikiler, takipçinin duasını melodiyle birlikte inceler, bazı Malikiler ise onu doğrudan veya ayrıntılı olarak geçersiz kılar, melodiyi yapan kişi öğrenemezse düzeltir; Şafi'ler, melodileri anlamı değiştirmeyen birinin doğru taklidi ve anlamı değişip iyi yapılmazsa Al-Fatiha'da geçersiz kılarlar; Hanbaliler ise Al-Fatiha'yı iyi okumayan veya anlamını değiştiren okuma yazma bilmeyen kişiyi kabul eder ve onun liderliği geçersiz sayılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7670} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7671} Dua sırasında konuşma: Hanafiler, duayı unutkan, kasıtlı veya yanlış konuşmalarla geçersiz kılar ve diğerleri arasında geçersiz kılmayan az miktar ile geçersiz kılan büyük miktar arasında ayrım yaparlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7671} İmamın hatası: İki kişi ona bilgi verirse ve o onların sözlerine güvenirse, onları üç imamla birlikte ifade etmelidir. Al-Shafi'i, hatalarından ikna olursa onların sözüne göre hareket etmediğine; doğruluğundan emin ise Sahih'teki Hanefi, Maliki ve Şafiilere ve çoğunlukta Hanbelilere göre onları takip etmediğine inanır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7672} Korku duasında hata: Karanlığı görüp onu düşman sanırlarsa, yoğun korku duası edilir, o zaman tam tersi ortaya çıkar. Hanefiler, Hanbaliler ve Şafiiler bunu tekrarlamayı gerektirir, ancak Malikiler tekrar etmek zorunda değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7672} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7673} Zekat: Meyve kharlardan daha fazla görünürse, fazladan zekat Malikilere göre alınır; sahibi Hanbali görüşünden önce harsın eksik olduğunu iddia ederse, mümkünse; ve Şafi'ler hatanın boyutuna göre ayrı çıkar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7673}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7674} Zekatı harcamada hata: Eğer zekat birine verilirse, hak ettiğini düşünürse ve tam tersi açıktır. Hanafi ve Şafiiler bunun yeterli olduğunu savunur; Ebu Yusuf ve Hanbaliler ve doğru görüş Şafiilere göredir: Eğer ödeyen imamsa, ödenen miktardan geri almalı ve geri vermelidir; Hanbaliler, bunun gayrimüslim birine veya hak etmeyen birine verilmesinin yeterli olmadığını söyler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7675} Oruç: Oruç tutan kişi Ramazan orucu niyetinde yaparsa veya yanlışlıkla tarif ederse, orucu Hanefilere göre geçerli, ancak diğerleri bunun sabit olduğunu söyler, çünkü zaman sabittir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7675} Unutkanlıkla orucu bozan kişi kefaret talep etmez. Yıkama hatası ve su suya girmesi orucu geçersiz kılar; Hanafi ve Malikilere göre kefaret olmadan orucu uydurmak gerekir; ancak Haneliler ve Şafiilere göre geçersiz kılınmaz. {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s.. 7676} Zamanlama hatası: Şafak henüz doğmadığını düşünerek yemek yiyip orucu bozarsa ya da orucu koyduğu düşünerek bozarsa, orucu çoğunluğa göre kefaret ödemeden tamamlamak zorundadır; Haneliler orucu telafi etmek ve ilişki için kefaret yapmak ister, yanlışlıkla bile olsa. {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.7676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7677} Hac: İnsanlar hata yapıp onuncu evde durursa, Hanefi, Şafiî ve Hanelilere göre yeterlidir, Malikiler ise hata sıklığına göre ayrılır; ancak sekizinci sınıfta durup dokuzuncu Hanefi, Maliki ve Şafi'lere göre yeterli olmadığını düşünürlerse; Hanbaliler yeterlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7677}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7678} Hacılar ayakta durma pozisyonlarında hata yapar ve Arafah dışındaki yerlerde dururlarsa, orucu telafi etmek zorundadırlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7679} Haram'da veya ihramda avlanmayı öldürmek, yasaktır; bunun için kasıtlı ya da kazara ceza verilir, hukukçuların mutabakatıyla cezalandırılır; Hanafi ve Malikiler ihram yasaklarında kasıtlı ve tesadüfi eylemleri eşitlerken, Şafiiler ve Hanbeliler yıkım ile zevk arasında ayrım yapar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7679} Kurbanda hata: Her iki kişi de diğerinin kurbanını yanlışlıkla katederse, Hanafi ve Hanbali kayırmacılık sorumluluğu olmadan yeterlidir ve benzetme sorumluluktur; Malikiler onlar için yeterli değildir ve her biri diğerinin koyunlarının değerinden sorumludur; Şafiiler iki değer arasındaki fiyatı sorumlu tutar ve her biri yemin ile zorunluysa yeterlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7680} Yanlış olanın satışı: Hanafi halkı yanlışlıkla yapılan bir satışı geçersiz sayarken, Malikiler, Şafiiler ve Hanbaliler bilgi ve niyet gerekliliği nedeniyle geçersiz sayar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7680} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7681} Satılan üründe hata: Hata satılan ürünün türünde meydana gelirse veya eşya arasında önemli bir tutarsızlık varsa, Hanefiler, Al-Karkhi hariç, bunu sözleşmenin sonuçlandırılmasının öncüsü olarak kabul eder, Al-Karkhi ise geçersiz sayar. Malikiler, diğer yüklenicinin bilmediği bir hatayı kabul etmez ve biri kendi adı dışında bir şey söylerse, herkesin alım veya satımı zorunlu değildir. Şafiiler ve Hanbaliler, satılan ürünün bilgisizliği nedeniyle satışı geçersiz kılar. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7681} {Cite:fiqh-mawsua-kuwaitiyya-noor-v3 s. 7682} İcara: Eleştirmenler ve el-Kabbani hata yaparsa, Hanefi, Şafii ve Hanbalilere göre ona karşı bir sorumluluk yoktur. Hanbaliler bunu yetenekli ve güvenilir olmakla sınırlar, Şafiiler ise el-Kabani'yi ağırlık olarak sorumlu tutar; ortak ücret ise ağır ihmal veya ihmalkarlık için sorumludur. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7682} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7683} Yazarın hatası: Hanafiler, ücret tahmininde her kağıttaki hataları veya bazılarını ayırt eder, Şafiiler ise hata ağır ve ücret içermiyorsa kağıdın karşılanmasını ister; aksi takdirde ücret olur ve düzeltilmelidir. {Cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7683} Doktor, sünnetçi ve berber: İki şartla yetkilendirileni yaparlarsa sorumlu değillerdir: yetenekli olmaları ve ellerinin kanuna aykırı olmaması; ve ihlal ederlerse, kasıtlı ya da kazara sorumludurlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7683} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7684} Sahnenin betiminde hata: Hanafiler tüm işaretlerin doğru olmasını ister; Malikiler 'al-'afa' ve 'al-waka'daki hataları dirhem miktarındaki hataları ayırt eder. İbn Rüşd, hatanı, bir şeyin kendisine aykırı algı olarak görür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7684} Öncelik hatası: Alıcı 'Yüz dolara aldım' derse, aracı affeder ve satın alma elli dolara yapılır. Şafi'ler ve Hanbaliler öncelikli haklarında kalır; Hanefiler ise fiyat bildirilenden düşük görünürse önceliklerini sürdürür, çünkü rıza yüksek fiyata dayanır; ve Maliki okulu fiyat düşerse ve fiyat hakkında yalan söylediği için feragat edildiğini yemin ederse önceliklerini sürdürür. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.7684} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7685} Önlemin uygulanmasındaki hata: Aracıya, falancının ortağının hissesini satın aldığı ve iyi davranışları nedeniyle aracılık ettiği söyleniyorsa ve satın almanın başka bir kişiyle ortak yapıldığı gösterilirse, çoğunluğa göre öncelik hakkına sahiptir çünkü sadece kendi düşüncelerini paylaşmayı kabul etmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7685} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7686} Evlilik: Hanafiler, bir kelimenin bozulma sonucu bozulmasının evliliği geçerli kılmadığını savunur. Anlaşılan anlam, Hanefiler, Şafi'ler ve Hanbalilerde rivayetlerde geçerli olan bilinen bir günlük terimden gelir; karının adındaki bir hata, evliliği ancak o hazır değilse engeller, bu yüzden kadın ona hitap eder. Şafiiler ve Hanbaliler isim verme ile işaret etme arasında ayrım yapar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7686} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7687} Eşle ilgili hata: Kendi eşi dışında bir kadınla evlenen ve onunla ilişkiye giren kişi, eşdeğer çeyiz ödemek, hadd cezası olmakla yükümlü ve soy belirlenmelidir. Şafiiler ve Hanbaliler, iki eşin babası ile oğlu arasındaki evliliği ayırır; bu nedenle evlilik iptal edilir ve her biri mutawa'nın çeyizi kadar çeyiz ödemekle yükümlüdür. Hanbaliler, mütevanın çeyizini kocasından feragat eder çünkü o, evliliğin iptalinde ortak olur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7687} {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.7688} Yanlış boşanma: Şafi'ler ve Hanbali'lere göre, dilin istemeden konuşulması durumunda bu gerçekleşmez ve Hanafiler tarafından anlamının ihmal edilmesi zor olduğu için kabul edilir. Malikiler, kelimenin anlamını değil, telaffuz niyetini isterler. Dilin önünde konuşan din olarak kabul edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7688} Yanlış suçlar: Kazara öldürmede yükümlülük, 'aqilah'ta kan parası, katilin kefareti ve çoğunluğa göre mirastan mahrum bırakılmasıdır; yanlışlıkla yaşam süresinden az olan durumlarda ise tam kan parası veya yaralara göre bir yüzdesidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7688} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7689} Bir kişinin kendine karşı işlediği suç bir hatadır: Hanefiler, Malikiler ve Şafiiler kan parası ödemezler; Hanbalılar 'akilah'ın varislerine kan parası ödediğini veya yarasının üçte birini aştığında onu serpeceğini söyler; ve kefaret Şafi'ler ve Hanbali'lere göre zorunludur, Hanafi ve Malikilere göre değil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7689} Çarpışma yanlıştır: Her iki tarafın diğerine verilen zarardan veya değerinin yarısından sorumlu olduğu konusunda bir anlaşmazlık vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7689} Gemiyi kırmak bir hatadır: Şafiiler, ölümcül bir ihlali kasıtlı olarak görür; bu ihlal için qisa veya kan parası gerekir ve tamir için ihlal etmek yarı-kasıtlıdır. Eğer tamir konusu değilse, bu tamamen hatadır; Hanefiler, denizcinin sorumluluğunu yaptığı ile yapmadığı arasındaki farkı ayırır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7690} Yeminde hata: Hanafiler, dil yemin etmeden önce bozarsa kefaret ister; Al-Kamal ibn al-Humam yanlışların yemininin geçerliliği konusunda anlaşmazlık gösterir; Malikiler, yemini bağlayan ilk dili ve başkasının isteğiyle kelimenin aktarılması ikamete yol açar; Şafiiler yemin etmeden yemin etmez ve yemin boşanma, özgürleşme ve ila'da kabul edilir; Haneliler ise daha önce istemeden yapılan günah veya kefaret işlemezler, sadece boşanma ve özgürlükte doğru olduğunu düşündükleri haldedir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7690} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7691} Yeminlerde hatalar ve günahlar: Hanafiler, yemini bozmak için zorlama veya unutkanlık yoluyla bile olsa, kefaret ister; Malikiler yemin bozmayı yanlış sayar, bu yüzden yemin eden falancının evine girmez ve diğerleri bunun kanunu çiğnediğini düşünür. Şafi'lerin iki görüşü vardır ve tercih edilen görüş, hata ve unutkanlığı ortadan kaldırmak için kanunu çiğnememektir. Hanbaliler, zorlama ve unutkanlık için kefaret yoktur ve yemin eden kişi unutursa boşanma ve özgürleşme gerçekleşir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7693} Bölünme hatası: Şafiiler ve Hanbaliler, delil ile zorlamanın bölünmesindeki hata iddiasını kabul ederler ve karşılıklı anlaşmanın bölünmesi sadece kanıtla kabul edilir; Hanefiler kanıt yoksa ortaklara yemin ederler; Malikiler, bilgili kişilerin görüşüyle ortaya çıkan adaletsizlik ile açık hatayı ayırt eder ve böylece bölünmeyi geçersiz kılar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7693} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7694} İtirafta hata: Şafiiler, en doğru görüşe göre, kabul edilen kişinin geri çekilmesini 'Ben hata yaptım' diyerek kabul ederler ve para onun elinde bırakılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7694} Tanıklıkta hata: Hanafiler, bir tanık konuşursa ve bir tanıklık konusunda yanılıyorsa, karardan sonra adil bir tanığın geri dönmesini kabul ederler; Malikiler, Şafiiler ve Hanbaliler hükümden önce ve sonra gelenleri ve kan ile zenginliği ayırt ederler; kısa ve hudud şahitlerinin karardan sonra geri çekilmesi, 'İstizm' toplanmasını durdurur; tanıkların hata yaptıklarını söylerlerse kan parası vardır; ve yanlışlıkla geri dönen tanıklar çoğunluk önünde 'ta'zir' olarak anılmaz. Hanefiler de ta'ziri geri çekerek kabul ederler. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7694} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7695} {cite:fiqh-mawsua-kuveytiyya-noor-v3 s.7695} {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7696} Hükmü bozmanın dayanağı, ictihad veya akldaki hatayı netleştirmektir; hudud ve ta'zir için ise, imam sağdan değil soldan keserek hata yaptıysa, Ebu Hanifa'ya göre Hanafi sorumlu değildir ve Zafar'a göre sorumludur. Malikiler eşitler arasında yanlış kesim yapar, Şafiiler bunu 'akilaya veya kamu hazinesine uygular, Hanbaliler ise hadd sınırını aşan her şeyden sorumludur. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7696} {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7697} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7697}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7698} İntikamda hata: Hanafiler, Abu Hanifa'ya göre kesinti artarsa kan parası ödemek zorunda olacağını; Malikilerin kasıtlı artışa göre misillem talep ettiğini; Şafiilerin artışı kasıtlı olarak talep ettiğini ancak ödeme yanlış olduğunu belirtir; Hanbalilerin yanlış artışın ödenmesini talep ettiğini belirtirler. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7698} Fetvadaki hata: Hanafiler müftüyü dahil etmekte farklıdır; Malikiler, takipçisi fetvasına göre hareket ederse sorumlu tutar; Şafiiler ve Ebu İshaq onu yetkin ise sorumlu tutar; Hanbalılar ise hata kesin delillerde ortaya çıkarsa hakimi ve müftüyü sorumlu tutar. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7699}"
  id: "Kesalahan secara linguistik berarti kebalikan dari kebenaran; jika jalannya salah, maka dikoreksi; jika penembak salah tujuan, ia tidak terkena; dosa adalah dosa dan dosa, dan kesalahan jika disengaja, dan kesalahan jika tidak disengaja. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7652} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7653} Secara teknis, ini adalah tindakan yang dilakukan oleh seseorang tanpa niat saat melakukan tujuan selain tindakan yang dimaksudkan. Al-Kamal ibn al-Hummam mendefinisikan tindakan ini sebagai niat melakukan tindakan selain kejahatan yang dimaksudkan, seperti membilas mulut orang yang berpuasa, dan melempar permainan yang melukai seseorang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7653} Menurut mayoritas ahli hukum, kesalahan setara dengan kesalahan; beberapa Malikis berpendapat bahwa kesalahan berkaitan dengan kegilaan dan kesalahan pada lidah, tetapi kesalahan dianggap sebagai kesalahan; Abu Hilal al-Askari berpendapat bahwa kesalahan adalah menempatkan sesuatu di tempat yang salah, dan mungkin benar pada dirinya sendiri, tetapi kesalahan tidak benar dalam hal apa pun. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7653} Mayoritas ahli hukum mengungkapkan apa yang terjadi secara tidak sengaja di lidah dengan kata 'kesalahan', sementara Maliki mengungkapkan apa yang berkaitan dengan kepercayaan pada kesalahan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7654} Istilah terkait: lupa, lupa, kelalaian, kebingungan, paksaan (memaksa orang lain melakukan sesuatu yang tidak mereka setujui, yang dipilih tapi bukan tempat berlindung), bercanda (bahwa kata itu tidak berarti apa-apa), kebodohan (sederhana atau rumit); orang yang salah tidak bertanggung jawab atas kesalahannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7654} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7655} Ketidaktahuan dan kesalahan adalah alasan untuk larangan, bukan perintah, dan tidak dianggap alasan hak asasi manusia, karena orang bodoh dan tersesat bertanggung jawab atas apa yang telah mereka hancurkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm. 7655} Para ulama usul berbeda pendapat dalam menggambarkan perbuatan pelaku sebagai diperbolehkan dan dilarang; Al-Asnawi berpendapat bahwa kebolehan dan larangan adalah putusan yang berkaitan dengan pihak yang bertanggung jawab dan tidak dapat dijelaskan, sementara Al-Shatibi berpendapat bahwa kesalahan dan kelupaan dianggap sebagai pengampunan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7655} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7656} Mayoritas ahli hukum setuju bahwa kesalahan adalah alasan untuk melepaskan beberapa hak Allah, bukan semua, dan mereka menggunakan hadits 'Kesalahan dan kelupaan telah dicabut dari bangsaku'; hak hamba tidak dihapuskan secara keliru, sehingga tanggung jawab atas pengganti rugi dan uang darah adalah wajib, karena tanggung jawab berasal dari pidato otoritas yang sudah ditetapkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm. 7656} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7657} Al-Qurtubi rinci: sumpah yang tidak dilepaskan dengan persetujuan, seperti denda, uang darah, dan doa yang ditetapkan; sumpah dibatalkan dengan kesepakatan, seperti pembalasan dan mengucapkan kata-kata ketidakpercayaan; dan bagian yang diperdebatkan, seperti seseorang yang lupa makan saat Ramadan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7657} Aturan \"Tidak ada keraguan tentang kecurigaan yang jelas adalah kesalahannya\" menurut Hanafi dan Shafi'i. Di antara penerapannya adalah siapa pun yang menganggap waktu fajar itu singkat, ia berdoa di hadapan Isha, lalu waktu menjadi cukup, ia ulangi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7658} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7659} Di antara aplikasi Syaf'i: Siapa pun yang merasa dirinya telah disucikan, berdoa lalu berkhasnya menjadi jelas, atau menganggap imamnya Muslim lalu tampak sebagai kafir, maka solat itu sebagian besar tidak sah; umat Maliki menafsirkannya menurut prinsip kelihatan dan pembocoran, dan Ibn Rajab memberikan aturan mengenai seseorang yang bertindak dalam sesuatu yang dianggap tidak dimilikinya. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7659} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7660} Kesalahan dalam penyucian: Siapa pun yang berusaha menutupi wadah atau pakaian lalu tampak tidak suci, harus diulang menurut Hanafi dan Shafi'i, dan menurut Maliki, Hanbalis tidak menganggap masalah itu sesuai aturan mereka. Kesalahan dalam niat mandi: jika seseorang berniat menghilangkan sesuatu yang baru, maka tumpang tindih itu diangkat oleh semua menurut Maliki, Shafi'i, dan Hanbali, kecuali disengaja; Hanafi tidak memerlukan niat untuk wudhu dan mandi ritual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7661} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7662} Kesalahan dalam ghusl dan tayammum: Niat untuk menghilangkan janabah saat berhubungan seksual dianggap sebagai bentuk emisi nokturnal, yang menurut Shafi'i dan Hanafi tidak berbahaya; jika seorang wanita yang sedang menstruasi bermaksud melepas janabah sebelum menstruasi, maka ada perbedaan pendapat di antara Maliki; untuk janabah (janab) ia melakukan tayammum dengan lupa janabahnya, yang didukung oleh Malik. {cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 hlm.7662} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7663} Pintu tetap terbuka pada halaman-halaman berikut. Dalam tayammum: Malikis dan Ibn Maslamah mengizinkan, para Syafi'i benar dalam niat untuk mengizinkan shalat dengan sedikit najis bagi seseorang yang salah sebagai janabah (ketidakmurnian ritual besar), dan para Hanbal mensyaratkan penjelasan apa yang dilakukan tayammum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7664} Siapa pun yang membawa air dalam perjalanannya dan melakukan kesalahan, mencarinya tetapi tidak menemukannya, maka ia melakukan tayammum dan berdoa, yang menurut Malik dan Hanbali, dan pandangan lain menurut Sy'i'i, sedangkan pandangan lain memerlukan pengulangan karena kelalaian dalam menghafal pelana. Jika ia mengetahui tentang air dan merasa telah habis, maka ia melakukan tayammum dan berdoa lagi sesuai dengan Hanafi dan Maliki, dan pandangan yang benar adalah menurut Shafi'i dan Hanbali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7664} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7665} Kesalahan dalam niat dalam doa: Jika sesuatu tidak ditetapkan sebagai syarat, kesalahan tidak merugikan, seperti menentukan tempat dan waktu. Kesalahan dalam apa yang harus ditentukan adalah berbahaya, seperti dari Dhuhr ke Asr. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7665} Contoh contoh berikut: Kesalahan dalam mengidentifikasi imam tidak merugikan menurut kebanyakan orang; jika seseorang berniat shalat atas Zaid, itu tidak sah menurut mayoritas aliran. Kesalahan mengenai jenis almarhum tidak disetujui oleh Hanbali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7665} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.76666} Doa Qada, Pelaksanaan, dan Kesalahan pada Hari Itu: Para Malik biasanya memutuskan keasliannya, sementara Hanafi dan Shafi'i membatalkannya kecuali dalam kasus tertentu, dan Hanbalis mengoreksi Qada dengan niat melakukannya jika ada perbedaan dugaan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7667} Kesalahan dalam memasuki waktu: Berdoa sebelum waktu tidak sah karena kebetulan, baik sengaja maupun salah; menurut syafi'i, pengetahuan tertentu atau dugaan yang sah diperlukan, sementara menurut Hanbali, kecurigaan yang lebih besar sudah cukup; jika ditemukan bahwa dia berdoa sebelum waktu, dia mengulanginya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7667} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7668} Kesalahan dalam qibla: Hanafi mengizinkan ijtihad dan tidak mengulanginya bagi mereka yang melakukan kesalahan setelah diselidiki; Maliki mengulanginya pada saat tanda-tanda muncul jika mereka berbalik atau menyimpang; Shafi'i memiliki dua pendapat ketika kesalahan itu pasti; Hanbal tidak mengulanginya untuk mujtahid, dan yang bijaksana di kota dan buta tanpa bukti mengulang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7668} Kesalahan dalam membaca: Hanafi membedakan antara kesalahan infleksi gramatikal gramatikal yang tidak mengubah makna dan tidak membatalkannya, dan perubahan besar yang merusak para sarjana sebelumnya. Mengenai huruf dan kata, mereka membahas substitusi huruf, kemajuan, penundaan, penambahan, dan penghilangan; mereka menganggap kata-kata yang dekat maknanya dengan apa yang tidak rusak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7669} Kesalahan dalam pembacaan berkaitan dengan pengikut: Umat Malik menyelidiki doa pengikut dengan melodi, dan beberapa Malik membatalkannya secara langsung atau rinci, dan memperbaikinya jika yang membuat melodi gagal belajar; Syafi'i meniru seseorang yang melodinya tidak mengubah makna, dan mereka membatalkannya dalam Al-Fatiha jika maknanya berubah dan tidak dilakukan dengan baik; dan Hanbal menganggap orang buta huruf yang tidak mengucapkan Al-Fatiha dengan baik atau mengubah maknanya, dan kepemimpinannya tidak sah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7670} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7671} Pidato dalam doa: Para Hanafi membatalkan doa dengan ucapan yang lupa, disengaja, atau keliru, dan membedakan antara jumlah kecil yang tidak membatalkannya dan yang besar yang membatalkannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7671} Kesalahan Imam: Jika dua orang memberitahunya dan dia mempercayai pernyataan mereka, dia harus merujuk kepada mereka bersama tiga imam. Al-Shafi'i percaya bahwa jika dia yakin akan kesalahan mereka, dia tidak bertindak atas pernyataan itu; dan jika dia yakin akan kebenarannya, dia tidak mengikuti mereka sesuai dengan Hanafi, Maliki, dan Shafi'i dalam Sahih dan mayoritas Hanbali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7672} Kesalahan dalam doa ketakutan: Jika mereka melihat kegelapan dan mengira itu musuh, mereka berdoa dengan ketakutan yang mendalam, maka sebaliknya menjadi jelas. Hanafi, Hanbali, dan Shafi'i mengharuskan pengulangannya, tetapi Maliki tidak mengharuskan pengulangannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7672} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7673} Zakat: Jika buah tampak lebih banyak daripada khars, zakat atas kelebihan diambil sesuai Maliki; jika pemilik mengklaim khars hilang sebelum pendapat Hanbali, jika memungkinkan; dan Shafi'is terpisah sesuai tingkat kesalahan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7674} Kesalahan dalam membelanjakan zakat: Jika diberikan kepada seseorang yang dianggap berhak, dan sebaliknya jelas. Hanafi dan syafi'i berpendapat bahwa itu sudah cukup; Abu Yusuf dan Hanbali, dan pandangan yang benar menurut para Shafi'i: jika pembayar adalah imam, ia harus memulihkan jumlah yang telah dibayar dan mengembalikannya; Hanbal mengatakan tidak cukup jika diberikan kepada non-Muslim atau kepada seseorang yang tidak pantas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7675} Puasa: Jika orang yang berpuasa berniat berpuasa Ramadan atau salah menggambarkannya, puasanya sah menurut Hanafi, tetapi yang lain mengatakan itu tetap karena waktunya tetap. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7675} Siapa pun yang membatalkan puasa karena lupa tidak memerlukan penebusan. Kesalahan dalam membilas dan air masuk ke air membatalkan puasa, dan menebus puasa tanpa penebusan diperlukan menurut Hanafi dan Maliki, menurut Shafi'i; tetapi tidak dibatalkan menurut Hanbalis dan menurut Shafi'i. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.. 7676} Kesalahan waktu: Siapa pun yang makan dengan mengira fajar belum muncul lalu memutus puasa, atau membatalkan puasa dengan berpikir telah ditetapkan, harus menebus puasa tanpa membayar penebusan menurut mayoritas; Hanbalis mengharuskan menebus puasa dan penebusan untuk hubungan seksual meskipun keliru. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7677} Haji: Jika orang salah dan berdiri pada yang sepuluh, itu sudah cukup menurut Hanafi, Shafi'i, dan Hanbali, serta Maliki memisahkan menurut frekuensi kesalahan; tetapi jika mereka berdiri pada kedelapan dengan berpikir bahwa yang kesembilan tidak cukup menurut Hanafi, Maliki, dan Shafi'i dalam pandangan paling benar; Hanbalis sudah cukup. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7677} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7678} Jika para peziarah melakukan kesalahan dalam posisi berdiri dan berhenti di tempat selain Arafah, mereka harus menebus puasa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7679} Pembunuhan berburu di Haram atau di antara mereka yang di ihram dilarang, yang hukumannya pantas, baik disengaja maupun tidak sengaja, atas kesepakatan para ahli hukum; Hanafi dan Malik menyamakan tindakan sengaja dan kebetulan dalam larangan Ihram, sementara Shafi'i dan Hanbal membedakan antara kehancuran dan kenikmatan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7679} Kesalahan dalam pengorbanan: Jika keduanya menyembelih korban satu sama lain secara kesalahan, maka Hanafi dan Hanbal cukup bagi mereka tanpa tanggung jawab atas pilih kasih, dan analogi adalah kewajiban; Maliki tidak cukup bagi mereka dan masing-masing bertanggung jawab atas nilai domba yang lain; Syafi'i memegang harga antara kedua nilai tersebut dan masing-masing cukup jika diwajibkan berdasarkan sumpah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7680} Penjualan orang yang salah: Hanafi menganggap penjualan yang dilakukan secara keliru dan tidak sah, sementara Maliki, Shafi'i, dan Hanbal menganggapnya tidak sah karena persyaratan pengetahuan dan niat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7680} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7681} Kesalahan pada barang yang terjual: Jika kesalahan terjadi pada jenis barang yang dijual atau terdapat perbedaan signifikan pada barang tersebut, Hanafi, kecuali Al-Karkhi, menganggapnya sebagai pendahuluan untuk penandatanganan kontrak, dan Al-Karkhi menganggapnya tidak sah. Keluarga Maliki tidak menganggap kesalahan yang tidak diketahui oleh kontraktor lain, dan jika salah satu dari mereka menyebut sesuatu selain namanya, maka tidak mengikat bagi semua orang untuk membeli atau menjual. Syafi'i dan Hanbali membatalkan penjualan karena ketidaktahuan terhadap barang yang dijual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7682} Ijara: Jika para kritikus dan al-Qabbani salah, tidak ada tanggung jawab atas dirinya menurut Hanafi, Shafi'i, dan Hanbali. Hanbalis membatasi ini hanya pada keahlian dan kepercayaan, sementara Shafi'i menganggap al-Qabbani bertanggung jawab dari berat; dan upah bersama bertanggung jawab atas kelalaian atau kelalaian serius. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7682} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7683} Kesalahan penulis: Hanafi membedakan antara kesalahan dalam setiap makalah atau beberapa dalam memperkirakan biaya, sementara Shafi'i mengharuskan makalah ditanggung jika kesalahan tersebut berat dan tidak dikenakan biaya; jika tidak, itu adalah biaya dan harus diperbaiki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7683} Dokter, penyuhat, dan tukang cukur: Mereka tidak bertanggung jawab jika melakukan apa yang diizinkan dengan dua syarat: bahwa mereka terampil dan tangan mereka tidak melanggar hukum; dan jika mereka melanggar, mereka bertanggung jawab baik secara sengaja maupun tidak sengaja. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7683} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7684} Kesalahan dalam mendeskripsikan adegan: Hanafi mensyaratkan semua tanda benar; Maliki membedakan antara kesalahan dalam 'al-'afas' dan 'al-waka' serta kesalahan dalam jumlah dirham. Ibn Rushd menganggap kesalahan sebagai persepsi sesuatu yang bertentangan dengan apa adanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7684} Kesalahan dalam preemption: Jika pembeli berkata, 'Saya membeli seharga seratus,' penopah mengampuni dan kemudian pembelian menjadi lima puluh. Shafi'i dan Hanbalis tetap berada di preemption mereka; Hanafi tetap berada di preemption jika harga tampak lebih rendah dari yang dilaporkan, karena persetujuan didasarkan pada harga yang tinggi; dan mazhab Maliki mempertahankan preemption jika harga menjadi lebih rendah dan ia bersumpah bahwa harga itu dibebaskan karena berbohong tentang harga tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7684} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7685} Kesalahan dalam menerapkan preemption (pre-emption): Jika dikatakan kepada penderita bahwa si anu telah membeli bagian pasangannya, dan ia menerima perantaraan karena perilaku baiknya, lalu ditunjukkan bahwa pembelian dilakukan bersama dengan orang lain, ia memiliki preemption menurut mayoritas karena ia hanya setuju untuk berbagi apa yang ia pikirkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7685} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7686} Pernikahan: Kaum Hanafi berpendapat bahwa kata yang terdistorsi oleh distorsi tidak memvalidasi pernikahan. Makna yang dipahami berasal dari istilah sehari-hari yang terkenal yang berlaku menurut Hanafi, Shafi'i, dan Hanbalis dalam sebuah narasi; kesalahan dalam nama istri mencegah pernikahan kecuali ia hadir, sehingga ia merujuk padanya. Syafi'i dan Hanbal membedakan antara penamaan dan penunjukan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7686} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7687} Kesalahan mengenai istri: Siapa pun yang menikah dengan wanita selain istrinya sendiri dan berhubungan seks dengannya bertanggung jawab atas mas kawin yang setara, tidak ada hukuman hadd, dan garis keturunan harus ditetapkan. Syafi'i dan Hanbal memisahkan pernikahan antara ayah dan anak dari dua istri, sehingga kesalahan terjadi dalam pernikahan, sehingga pernikahan dibatalkan dan masing-masing wajib membayar mas kawin yang setara dengan mas kawin mutawa'a. Hanbalis melepaskan mas kawin mutawa'a dari suaminya karena dia adalah mitra dalam pembatalan pernikahan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7687} {cite::fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7688} Perceraian yang salah: Menurut Shafi'i dan Hanbali, ini tidak terjadi jika lidah diucapkan tanpa sengaja, dan dianggap oleh Hanafi karena mengabaikan makna kata itu sulit ditentukan. Orang Malik mengharuskan niat untuk mengucapkan kata-kata tersebut, bukan maknanya. Siapa pun yang berbicara sebelum bahasa diterima sebagai agama. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7688} Kejahatan yang salah: Kewajiban dalam pembunuhan tidak sengaja adalah uang darah atas 'aqilah dan penebusan pada pembunuh, serta pencabutan warisan menurut mayoritas; kewajiban untuk kasus yang kurang dari nyawa karena kesalahan adalah uang darah penuh atau persentasenya sesuai luka. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7688} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7689} Kejahatan seseorang terhadap dirinya sendiri adalah kesalahan: Hanafi, Maliki, dan Shafi'i tidak membayar uang darah; Hanbal berpendapat bahwa 'aqilah membayar uang darah kepada ahli warisnya atau menyemburkan lukanya jika melebihi sepertiga; dan penebusan adalah wajib menurut Shafi'i dan Hanbali, bukan Hanafi dan Maliki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7689} Tabrakan keliru: Ada perselisihan bahwa masing-masing pihak bertanggung jawab atas kerusakan pada pihak lain atau setengah nilainya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7689} Merusak kapal adalah kesalahan: Syafi'i menganggap pelanggaran fatal sebagai tindakan yang disengaja di mana qisa atau uang darah diperlukan, dan membocorkannya untuk diperbaiki adalah hampir disengaja. Jika bukan objek perbaikan, maka itu murni kesalahan; para Hanafi membedakan antara tanggung jawab pelaut antara apa yang ia lakukan dan apa yang tidak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7690} Kesalahan dalam sumpah: Hanafi menuntut penebusan jika seseorang melanggar sumpah sebelum lidah mengucapkannya; Al-Kamal ibn al-Humam tidak setuju mengenai keabsahan sumpah orang yang salah; Malik membedakan antara bahasa pertama dengan mengucapkan sumpah yang mengikat sumpah, dan transfer kata atas kehendak orang lain mengarah pada keyakinan; Syafi tidak mengucapkan sumpah tanpa sengaja, dan sumpah diterima kecuali dalam perceraian, pembebasan, dan Ila; Hanbalis tidak melakukan dosa atau penebusan atas apa yang sebelumnya dilakukan tanpa sengaja, kecuali dalam perceraian dan pembebasan sesuai dengan yang mereka anggap benar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7690} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7691} Kesalahan dalam sumpah dan pelanggaran: Hanafi menuntut penebusan atas pelanggaran sumpah meskipun dengan paksaan atau lupa; Maliki menganggap melanggar sumpah sebagai kesalahan, jadi siapa pun yang bersumpah tidak masuk ke rumah si anu dan masuk ke sana dan orang lain mengira itu melanggar hukum. Para Shafi'i memiliki dua pendapat, dan pandangan yang disukai adalah tidak melanggar hukum untuk menghilangkan kesalahan dan pelupaan. Hanbalis mengatakan tidak ada penebusan atas paksaan dan pelupaan, dan perceraian serta pembebasan terjadi jika orang yang bersumpah kepadanya lupa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7693} Kesalahan dalam pembagian: Syafi'i dan Hanbalis menerima klaim kesalahan dengan bukti, dan mereka menerima klaim kesalahan dalam membagi paksaan dengan bukti, dan pembagian kesepakatan bersama hanya diterima dengan bukti; Hanafi bersumpah pada mitra ketika tidak ada bukti; Maliki membedakan antara ketidakadilan dan kesalahan terang-terangan yang dibuktikan oleh pendapat orang yang berpengetahuan, sehingga membatalkan pembagian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7693} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7694} Kesalahan dalam pengakuan: Syafi'is, dalam pandangan yang paling benar, menerima pencabutan orang yang diakui dengan mengatakan 'Saya salah,' dan uang itu ditinggalkan kepadanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7694} Kesalahan dalam kesaksian: Hanafi menerima pengembalian saksi yang adil setelah putusan jika ia berbicara dan ia salah tentang beberapa kesaksian; Maliki, Shafi'i, dan Hanbal membedakan antara apa yang terjadi sebelum dan sesudah putusan serta antara darah dan kekayaan; penarikan saksi qisa dan hudud setelah putusan menghentikan pengumpulan 'Istiz'; uang darah menjadi hak milik saksi jika mereka mengatakan telah melakukan kesalahan; dan saksi yang kembali karena kesalahan tidak disebut 'ta'zir di hadapan mayoritas.' Hanafi juga menganggap ta'zir sebagai penarikan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7694} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7695} {cite:fiqh-mawsua-Kuwaitiyya-noor-v3 hlm. 7695} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7696} Kesalahan dalam penilaian: Dasar pembatalan putusan adalah untuk memperjelas kesalahan dalam ijtihad atau akal; adapun hudud dan ta'zir, jika imam melakukan kesalahan dengan memotong kiri bukan kanan, Hanafi tidak bertanggung jawab menurut Abu Hanifa, dan menurut Zafar, dia bertanggung jawab. Malikis cukup dengan kesalahan pemotongan antara yang setara, Shafi'i memaksakannya pada 'aqila atau kas negara, dan Hanbal bertanggung jawab atas apa pun yang melebihi batas hadd. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7696} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7697} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7697} {cite:fiqh-mawsua-kuwaitiya-noor-v3 hlm.7698} Kesalahan dalam pembalasan: Hanafi berpendapat bahwa yang bertanggung jawab atas uang darah jika potongan meningkat sebagai pembalasan menurut Abu Hanifa; Malik menuntut pembalasan sesuai dengan peningkatan yang disengaja; Shafi'i menuntut pembayaran kenaikan dengan sengaja tetapi pembayaran itu keliru; Hanbal menuntut pembayaran kenaikan yang salah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7698} Kesalahan dalam fatwa: Hanafi berbeda dalam memasukkan mufti; Malik menuntut pengikut jika bertindak sesuai fatwanya; Shafi'i dan Abu Ishaq menuntut jika ia kompeten; Hanbal menuntut hakim dan mufti jika kesalahan tersebut jelas dalam bukti definitif. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7699}"
