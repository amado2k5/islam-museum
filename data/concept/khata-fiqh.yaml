id: concept/khata-fiqh
class: concept
kind: term
label:
  ar: الخطأ
  en: Khata' (error, unintended act)
  ur: خطأ
summary:
  ar: الخطأ لغة نقيض الصواب، وأخطأ الطريق عدل عنه، وأخطأ الرامي الغرض لم يصبه؛ والخطيئة الذنب والإثم، وخطىء إذا تعمد وأخطأ إذا لم يتعمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7652}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7653} اصطلاحا فعل يصدر من الإنسان بلا قصد إليه عند مباشرة أمر مقصود سواه، وعرفه الكمال بن الهمام بأن يقصد بالفعل غير المحل الذي يقصد به الجناية، كالمضمضة تسري إلى حلق الصائم، والرمي إلى صيد فيصيب آدميا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7653} الغلط عند جمهور الفقهاء يساوي الخطأ؛ وفرق بعض المالكية بأن الخطأ متعلق بالجنان والغلط باللسان، لكن يأخذ الغلط حكم الخطأ؛ وفرق أبو هلال العسكري بأن الغلط وضع الشيء في غير موضعه وقد يكون صوابا في نفسه، والخطأ لا يكون صوابا على وجه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7653}
  en: 'Khata'' is lexically the opposite of right; one who misses the way strays from it, and an archer who misses the target has not hit it; khati''a is a sin, the verb with intent being khatiya and without intent akhta''a. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7652}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7653} Technically it is an act done without intent toward the object of the act: Kamal ibn al-Humam gives the example of rinsing the mouth that reaches a fasting man''s throat, and shooting at game that hits a human. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7653} Most jurists treat ghalat as equal to khata''; some Malikis distinguish that khata'' is in the heart and ghalat in the tongue, yet ghalat takes khata''s ruling; Abu Hilal al-''Askari distinguishes that ghalat is placing a thing out of its place and may be right in itself, while khata'' is never right in any way. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7653}'
  ur: خطأ لغت میں صواب کی ضد ہے؛ راستہ سے بھٹکنا، اور تیر انداز کا نشانے سے چوک جانا؛ خطیئہ گناہ اور جرم ہے، جان بوجھ کر ہو تو خطِئ اور بغیر ارادے کے ہو تو اخطأ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7652}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7653} اصطلاح میں یہ وہ فعل ہے جو کسی مقصود کام کے دوران بغیر ارادے کے صادر ہو؛ کمال بن الہمام کے نزدیک یہ ہے کہ فعل کا قصد کسی اور محل کا ہو جس پر جنایت ہو، جیسے روزہ دار کے حلق میں کلی کا پانی پہنچنا، یا شکار پر تیر چلانا اور آدمی کو لگ جانا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7653} جمہور کے نزدیک غلط خطأ کے برابر ہے؛ بعض مالکیہ کے نزدیک خطأ دل سے متعلق ہے اور غلط زبان سے، مگر غلط خطأ کا حکم لیتا ہے؛ ابو ہلال عسکری کے نزدیک غلط کسی چیز کو غلط جگہ رکھنا ہے جو اپنی ذات میں درست ہو سکتی ہے، جبکہ خطأ کسی وجہ سے درست نہیں ہوتی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7653}
