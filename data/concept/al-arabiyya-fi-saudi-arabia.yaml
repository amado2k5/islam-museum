label:
  ar: "العربية في السعودية"
  en: "Arabic in Saudi Arabia"
  ur: "سعودی عرب میں عربی"
  fr: "L'arabe en Arabie saoudite"
  es: "El árabe en Arabia Saudita"
summary:
  ar: "ما وُجد عن مكانة العربية في السعودية: نص النظام الأساسي كما يعرضه موقع Constitute، وما تقوله الموسوعة ودراسة مكتبة الكونغرس عن الحجاز واللغة المشتركة وتنوع الأقاليم، وتصنيفات اللهجات عند جامعة مانشستر وGlottolog. وتقول الصفحة ما لم يُعثر عليه بدل أن تسدّه بتقدير."
  en: "What was found on the place of Arabic in Saudi Arabia: the text of the Basic Law as the Constitute Project shows it, what the encyclopedia and the Library of Congress study say of the Hejaz, the common language and the diversity of the regions, and the dialect classifications of the University of Manchester and Glottolog. The page says what was not found rather than filling it with an estimate."
  ur: "سعودی عرب میں عربی کے مقام کے بارے میں جو ملا: بنیادی نظامِ حکم کا متن جیسا Constitute دکھاتا ہے، انسائیکلوپیڈیا اور لائبریری آف کانگریس کی تحقیق کا حجاز، مشترک زبان اور علاقوں کے تنوع پر بیان، اور مانچسٹر یونیورسٹی اور Glottolog کی بولیوں کی درجہ بندیاں۔ جو نہیں ملا صفحہ اسے اندازے سے بھرنے کے بجائے بتاتا ہے۔"
  fr: "Ce qui a été trouvé sur la place de l'arabe en Arabie saoudite : le texte de la Loi fondamentale tel que le montre le Constitute Project, ce que disent l'encyclopédie et l'étude de la Bibliothèque du Congrès du Hedjaz, de la langue commune et de la diversité des régions, et les classifications des dialectes de l'université de Manchester et de Glottolog. La page dit ce qui n'a pas été trouvé au lieu de le combler par une estimation."
  es: "Lo que se encontró sobre el lugar del árabe en Arabia Saudita: el texto de la Ley Fundamental tal como lo muestra el Constitute Project, lo que dicen la enciclopedia y el estudio de la Biblioteca del Congreso sobre el Hiyaz, la lengua común y la diversidad de las regiones, y las clasificaciones de dialectos de la Universidad de Manchester y de Glottolog. La página dice lo que no se encontró en lugar de rellenarlo con una estimación."
