id: concept/al-arabiyya-fi-saudi-arabia
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-world]
label:
  ar: "العربية في السعودية"
  en: "Arabic in Saudi Arabia"
  ur: "سعودی عرب میں عربی"
  fr: "L'arabe en Arabie saoudite"
  es: "El árabe en Arabia Saudita"
  tr: "Suudi Arabistan'da Arapça"
  id: "Bahasa Arab di Arab Saudi"
summary:
  ar: "ما وُجد عن مكانة العربية في السعودية: نص النظام الأساسي كما يعرضه موقع Constitute، وما تقوله الموسوعة ودراسة مكتبة الكونغرس عن الحجاز واللغة المشتركة وتنوع الأقاليم، وتصنيفات اللهجات عند جامعة مانشستر وGlottolog. وتقول الصفحة ما لم يُعثر عليه بدل أن تسدّه بتقدير. وأُضيف نص الحكم الدستوري بلغته الأصلية كما ورد في ملخص بحثي لم يتحقق المتحف منه على الصفحة."
  en: "What was found on the place of Arabic in Saudi Arabia: the text of the Basic Law as the Constitute Project shows it, what the encyclopedia and the Library of Congress study say of the Hejaz, the common language and the diversity of the regions, and the dialect classifications of the University of Manchester and Glottolog. The page says what was not found rather than filling it with an estimate. The constitutional text is added in its original wording, as supplied in a research summary that the museum did not check against the page."
  ur: "سعودی عرب میں عربی کے مقام کے بارے میں جو ملا: بنیادی نظامِ حکم کا متن جیسا Constitute دکھاتا ہے، انسائیکلوپیڈیا اور لائبریری آف کانگریس کی تحقیق کا حجاز، مشترک زبان اور علاقوں کے تنوع پر بیان، اور مانچسٹر یونیورسٹی اور Glottolog کی بولیوں کی درجہ بندیاں۔ جو نہیں ملا صفحہ اسے اندازے سے بھرنے کے بجائے بتاتا ہے۔ آئینی حکم کی عبارت اصل زبان میں شامل کی گئی ہے، جیسی ایک تحقیقی خلاصے میں ملی جسے متحف نے صفحے سے نہیں جانچا۔"
  fr: "Ce qui a été trouvé sur la place de l'arabe en Arabie saoudite : le texte de la Loi fondamentale tel que le montre le Constitute Project, ce que disent l'encyclopédie et l'étude de la Bibliothèque du Congrès du Hedjaz, de la langue commune et de la diversité des régions, et les classifications des dialectes de l'université de Manchester et de Glottolog. La page dit ce qui n'a pas été trouvé au lieu de le combler par une estimation. Le texte constitutionnel est ajouté dans sa langue d'origine, tel que fourni par un résumé de recherche que le musée n'a pas vérifié sur la page."
  es: "Lo que se encontró sobre el lugar del árabe en Arabia Saudita: el texto de la Ley Fundamental tal como lo muestra el Constitute Project, lo que dicen la enciclopedia y el estudio de la Biblioteca del Congreso sobre el Hiyaz, la lengua común y la diversidad de las regiones, y las clasificaciones de dialectos de la Universidad de Manchester y de Glottolog. La página dice lo que no se encontró en lugar de rellenarlo con una estimación. Se añade el texto constitucional en su lengua original, tal como lo entrega un resumen de investigación que el museo no verificó en la página."
  tr: "Suudi Arabistan'da Arapça'nın statüsü hakkında bulunanlar: Constitute web sitesinde sunulan statü metni, ansiklopedinin söyledikleri, Kongre Kütüphanesi'nin Hicaz çalışması, ortak dil, bölgesel çeşitlilik, Manchester Üniversitesi ve Glottolog'daki lehçe sınıflandırmaları. Sayfa, tahminle kapatmak yerine bulunamayanları söylüyor. Anayasa kararının metnini, müzenin sayfada doğrulamadığı bir araştırma özetinde bulunduğu şekliyle orijinal diliyle ekledim."
  id: "Tentang status bahasa Arab di Arab Saudi: teks status yang disajikan di situs web Constituent, apa yang dikatakan ensiklopedia, studi Hejaz di Perpustakaan Kongres, bahasa umum, keberagaman regional, klasifikasi dialek di Universitas Manchester dan Glottolog. Halaman tersebut mengatakan apa yang tidak dapat ditemukan alih-alih ditutup dengan tebakan. Saya menambahkan teks keputusan konstitusional dalam bahasa aslinya seperti yang tercantum dalam ringkasan penelitian yang tidak diverifikasi museum di halaman tersebut."
