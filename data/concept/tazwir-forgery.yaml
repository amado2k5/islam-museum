id: concept/tazwir-forgery
class: concept
kind: legal
label:
  ar: "التزوير"
  en: "Tazwir (forgery and falsification, including false testimony)"
  ur: "تزویر (جھوٹ گھڑنا، جعل سازی اور جھوٹی گواہی)"
summary:
  ar: "التزوير تحسين الشيء ووصفه بخلاف صفته حتى يتوهم السامع أنه حق، وهو محرم في الشهادة والأفعال والنقود والموازين والمستندات، وقد استثني منه الكذب في الحرب وتطييب خاطر الزوجة والإصلاح بين الناس. وفي شهادة الزور يختلف الفقهاء في نفوذ القضاء ظاهرا وباطنا، وفي وجوب القصاص أو الدية على الشهود. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5025} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5026} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5027} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5030} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5031} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5034}"
  en: "Tazwir is making a thing look other than it is, decorating it so that the hearer takes falsehood for truth. It is forbidden in testimony, in acts, in coin, weights and measures, and in documents. Exceptions are lying in war, soothing one's wife, and reconciling people. In false testimony the schools differ on whether a ruling takes effect outwardly and inwardly, and on whether retaliation or blood-money is owed by the false witnesses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5025} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5026} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5027} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5030} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5031} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5034}"
