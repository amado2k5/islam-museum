id: concept/tazwir-forgery
class: concept
kind: legal
label:
  ar: "التزوير"
  en: "Tazwir (forgery and falsification, including false testimony)"
  ur: "تزویر ⁦(جھوٹ گھڑنا، جعل سازی اور جھوٹی گواہی)⁩"
  es: "Tazwir (falsificación y alteración, incluyendo falso testimonio)"
  fr: "Tazwir (faux et contrefaçon, y compris faux témoignage)"
  tr: "Sahtecilik"
  id: "Pemalsuan"
summary:
  ar: "التزوير تحسين الشيء ووصفه بخلاف صفته حتى يتوهم السامع أنه حق، وهو محرم في الشهادة والأفعال والنقود والموازين والمستندات، وقد استثني منه الكذب في الحرب وتطييب خاطر الزوجة والإصلاح بين الناس. وفي شهادة الزور يختلف الفقهاء في نفوذ القضاء ظاهرا وباطنا، وفي وجوب القصاص أو الدية على الشهود. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5025} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5026} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5027} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5030} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5031} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5034}"
  en: "Tazwir is making a thing look other than it is, decorating it so that the hearer takes falsehood for truth. It is forbidden in testimony, in acts, in coin, weights and measures, and in documents. Exceptions are lying in war, soothing one's wife, and reconciling people. In false testimony the schools differ on whether a ruling takes effect outwardly and inwardly, and on whether retaliation or blood-money is owed by the false witnesses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5025} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5026} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5027} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5030} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5031} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5034}"
  es: "Tazwir consiste en hacer que algo parezca distinto de lo que es, embelleciéndolo de tal manera que quien lo escucha confunda la falsedad con la verdad. Está prohibido en testimonios, actos, monedas, pesas y medidas, y documentos. Las excepciones son mentir en la guerra, consolar a la esposa y reconciliar a las personas. En el caso del falso testimonio, las escuelas discrepan sobre si una resolución tiene efecto externo e interno, y sobre si los falsos testigos deben pagar represalias o indemnización. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5025} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5026} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5027} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5030} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5031} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5034}"
  fr: "Le tazwir consiste à déformer la réalité, à l'embellir de manière à ce que l'auditeur prenne le mensonge pour la vérité. Il est interdit dans les témoignages, les actes, la monnaie, les poids et mesures, et les documents. Font exception le mensonge à la guerre, le fait d'apaiser son épouse et la réconciliation. En matière de faux témoignage, les écoles divergent quant à la portée de la décision (extérieure et intérieure) et quant à l'obligation de représailles ou de compensation financière pour les faux témoins. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5025} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5026} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5027} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5030} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5031} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5034}"
  ur: "تجویر کسی چیز کو اس کے سوا کچھ اور بناتا ہے، اسے سجاتا ہے تاکہ سننے والا باطل کو حق کے لیے لے جائے۔ یہ گواہی میں، اعمال میں، سکے، تول اور پیمانہ اور دستاویزات میں حرام ہے۔ مستثنیات جنگ میں جھوٹ بولنا، اپنی بیوی کو تسلی دینا، اور لوگوں میں صلح کرنا ہیں۔ جھوٹی گواہی میں مکاتب اس بات پر اختلاف رکھتے ہیں کہ آیا کوئی حکم ظاہری اور باطنی طور پر اثر انداز ہوتا ہے، اور اس پر کہ جھوٹے گواہوں پر انتقامی کارروائی یا خونریزی واجب الادا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5025} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5026} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5027} صفحہ 5030} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5031} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5034}"
  tr: "Sahtecilik, bir şeyin özniteliğine aykırı şekilde güçlendirilmesi ve tanımlanmasıdır; böylece dinleyici onun doğru olduğunu düşünür. Tanıklıkta, eylemlerde, parada, terazide ve belgelerde yasaktır. Savaşta yalan söylemek, karıyı yatıştırmak ve insanlar arasında uzlaşma istisnalardır. Sahte tanıklık konusunda hukukçular, yargının görünür ve gizli geçerliliği ile tanıklar üzerindeki kısa veya kan parası yükümlülüğü konusunda farklı görüşlere sahiptir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.5025} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5026} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5027} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5030} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5031}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5034}"
  id: "Pemalsuan adalah peningkatan sesuatu dan deskripsinya yang bertentangan dengan sifatnya sehingga pendengar menganggapnya benar. Dilarang dalam kesaksian, tindakan, uang, timbangan, dan dokumen. Berbohong dalam perang, menenangkan istri, dan rekonsiliasi di antara orang adalah pengecualian. Mengenai kesaksian palsu, ahli hukum berbeda pendapat tentang keabsahan yang tampak dan tersembunyi dari peradilan, serta kewajiban qisa atau uang darah pada saksi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5025} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5026} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5027} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5030} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5031} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5034}"
