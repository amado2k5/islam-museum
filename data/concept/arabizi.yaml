summary:
  ar: "نظام كتابة لاتيني غير رسمي للعامية العربية في الرسائل القصيرة ومواقع التواصل، يمزج الحروف اللاتينية بأرقام مثل 2 للهمزة و3 للعين و7 للحاء و9 للصاد أو القاف؛ ونشأ في أواخر التسعينيات ومطلع الألفية في عصر الآسكي، كما يعرضه ملف بحثي قُدّم إلى المتحف {cite:awej-tls-arabizi-12-1-pdf} {cite:ala-journals-uni-lj-3arabizi-69} {cite:jlls-arabizi-3962}."
  en: "An informal Latin-letter writing system for colloquial Arabic in text messages and social media, mixing Latin letters with numerals such as 2 for the hamza, 3 for the ayn, 7 for the ha and 9 for the sad or qaf; it arose in the late 1990s and early 2000s in the ASCII era, as a research file supplied to the museum presents it {cite:awej-tls-arabizi-12-1-pdf} {cite:ala-journals-uni-lj-3arabizi-69} {cite:jlls-arabizi-3962}."
  ur: "بول چال کی عربی کے لیے لاطینی حروف میں ایک غیر رسمی نظامِ تحریر، جو ٹیکسٹ پیغامات اور سماجی رابطوں میں استعمال ہوتا ہے اور لاطینی حروف کو اعداد کے ساتھ ملاتا ہے، جیسے ہمزہ کے لیے 2، عین کے لیے 3، حاء کے لیے 7 اور صاد یا قاف کے لیے 9؛ یہ 1990 کی دہائی کے اواخر اور 2000 کی دہائی کے آغاز میں اسکی (ASCII) کے دور میں پیدا ہوا، جیسا کہ عجائب گھر کو پیش کی گئی ایک تحقیقی فائل اسے پیش کرتی ہے {cite:awej-tls-arabizi-12-1-pdf} {cite:ala-journals-uni-lj-3arabizi-69} {cite:jlls-arabizi-3962}."
  fr: "Un système d'écriture informel en lettres latines pour l'arabe dialectal dans les SMS et les réseaux sociaux, mêlant lettres latines et chiffres comme 2 pour la hamza, 3 pour le 'ayn, 7 pour le ha et 9 pour le sad ou le qaf ; il est apparu à la fin des années 1990 et au début des années 2000, à l'ère de l'ASCII, tel qu'un dossier de recherche remis au musée le présente {cite:awej-tls-arabizi-12-1-pdf} {cite:ala-journals-uni-lj-3arabizi-69} {cite:jlls-arabizi-3962}."
  es: "Un sistema de escritura informal en letras latinas para el árabe coloquial en mensajes de texto y redes sociales, que mezcla letras latinas con numerales como 2 para la hamza, 3 para la ayn, 7 para la ha y 9 para la sad o la qaf; surgió a finales de los años noventa y principios de los 2000, en la era del ASCII, tal como lo presenta un expediente de investigación entregado al museo {cite:awej-tls-arabizi-12-1-pdf} {cite:ala-journals-uni-lj-3arabizi-69} {cite:jlls-arabizi-3962}."
  tr: "SMS ve sosyal medya sitelerinde Arapça gündelik dilde kullanılan gayri resmi bir Latince yazı sistemi; Latin harflerini hamza için 2, 'ayn için 3, 'ha' için 7 ve sad veya qaf için 9 gibi sayılarla birleştirir; Ascian döneminde 1990'ların sonları ve 2000'lerin başında ortaya çıkmış olup, müzeye gönderilen bir araştırma dosyasında da sergilenmektedir {cite:awej-tls-arabizi-12-1-pdf} {cite:ala-journals-uni-lj-3arabizi-69} {cite:jlls-arabizi-3962}."
  id: "Sistem penulisan Latin informal untuk bahasa Arab sehari-hari di situs SMS dan media sosial, menggabungkan huruf Latin dengan angka seperti 2 untuk hamza, 3 untuk 'ayn, 7 untuk 'ha', dan 9 untuk sad atau qaf; sistem ini berasal dari akhir 1990-an dan awal 2000-an selama era Ascian, dan juga dipamerkan dalam berkas penelitian yang dikirim ke museum {cite:awej-tls-arabizi-12-1-pdf} {cite:ala-journals-uni-lj-3arabizi-69} {cite:jlls-arabizi-3962}"
