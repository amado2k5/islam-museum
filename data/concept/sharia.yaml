id: concept/sharia
class: concept
kind: legal
label:
  ar: الشريعة
  en: Sharia
summary:
  ar: "الشريعة في الاستعمال الإسلامي هي القواعد والأحكام التي تنظم حياة المسلمين، المستمدة من حيث الأصل من القرآن والحديث، وهي وثيقة الصلة بالفقه، أي النقاش العلمي في الشريعة الإلهية. وتتتبع مقالة دائرة المعارف الإسلامية الكلمة في القرآن والحديث وفي الأدب اليهودي والمسيحي والإسلامي، وتصف أصول الفقه والاجتهاد، ودور القاضي والمفتي، وتحولات الشريعة منذ القرن التاسع عشر، وحالتها في جنوب شرق آسيا."
  en: "In Islamic usage, sharia is the body of rules and regulations governing Muslim life, derived in principle from the Qur'an and hadith and closely tied to fiqh, the scholarly discussion of divine law. The Encyclopaedia of Islam article traces the word in the Qur'an and hadith and in Jewish, Christian and Muslim writing, and describes usul al-fiqh and ijtihad, the roles of the judge and the mufti, changes since the nineteenth century, and its place in South-East Asia."
  ur: "اسلامی استعمال میں شریعت ان قواعد اور احکام کا نام ہے جو مسلمانوں کی زندگی کو منظم کرتے ہیں، اصولاً قرآن اور حدیث سے ماخوذ ہیں اور فقہ سے، یعنی الٰہی شریعت پر علمی بحث سے، گہرا تعلق رکھتے ہیں۔ دائرہ معارف اسلامیہ کا مقالہ اس لفظ کو قرآن، حدیث اور یہودی، عیسائی اور مسلم تحریروں میں دیکھتا ہے، اور اصول فقہ، اجتہاد، قاضی اور مفتی کے کردار، انیسویں صدی کے بعد کی تبدیلیوں اور جنوب مشرقی ایشیا میں اس کی حالت بیان کرتا ہے۔"
