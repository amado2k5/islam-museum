id: concept/buqla-yamaniyya
class: concept
kind: natural
label:
  ar: "البقلة اليمانية"
  en: "Al-buqla al-yamaniyya (a cooling herb)"
  fr: "Al-buqla al-yamaniyya (herbe rafraîchissante)"
  ur: "بقلۃ یمانیہ"
  es: "Al-buqla al-yamaniyya (una hierba refrescante)"
summary:
  ar: "مائية كالقطف لا طعم لها، وهي أشد ترطيباً من الخس والقرع، وغذاؤها يسير. باردة رطبة في الثانية. ضماد للأورام الحارة، وأصلها يُضمّد به للشهدية، وعصارتها مع دهن الورد تنفع من الصداع، وطبيخها بدهن اللوز وماء الرمان الحلو ينفع السعال ويسكّن العطش الحار {cite:canon-ibn-sina-print-v1 p.391}."
  en: "A watery herb like the qitf, without taste, more moistening than lettuce or gourd, with little food value. Cold and moist in the second degree. A poultice for hot swellings; its root is applied to ulcers of the type called shahdiyya; its juice mixed with rose oil helps headache; its decoction with almond oil and sweet pomegranate juice helps cough and calms hot thirst {cite:canon-ibn-sina-print-v1 p.391}."
  fr: "Herbe aqueuse comme le qitf, sans goût, plus humidifiante que laitue ou courge et peu nourrissante. Froide et humide au deuxième degré. Cataplasme pour gonflements chauds ; racine appliquée aux ulcères shahdiyya ; suc avec huile de rose contre les céphalées ; décoction avec huile d’amande et jus de grenade douce contre toux et soif chaude {cite:canon-ibn-sina-print-v1 p.391}."
  ur: "یہ پانی دار بوٹی ہے جو قطف جیسی ہے، اس کا کوئی ذائقہ نہیں، اور یہ کاہو اور کدو سے زیادہ تر کرتی ہے، اور اس کی غذا کم ہے۔ دوسرے درجے میں ٹھنڈی اور تر۔ گرم ورموں پر ضماد کے طور پر لگتی ہے، اس کی جڑ شہدیہ زخموں پر لگائی جاتی ہے، اس کا رس گلاب کے تیل میں ملا کر سر درد میں نفع دیتا ہے، اور بادام کے تیل اور میٹھے انار کے پانی کے ساتھ اس کا جوشاندہ کھانسی میں نفع دیتا ہے اور گرم پیاس بجھاتا ہے {cite:canon-ibn-sina-print-v1 p.391}۔"
  es: "Hierba acuosa como el qitf, insípida, más humectante que la lechuga o la calabaza, con poco valor nutritivo. Fría y húmeda en segundo grado. Cataplasma para hinchazones calientes; su raíz se aplica a úlceras del tipo llamado shahdiyya; su jugo mezclado con aceite de rosa ayuda al dolor de cabeza; su decocción con aceite de almendras y jugo de granada dulce ayuda a la tos y calma la sed caliente {cite:canon-ibn-sina-print-v1 p.391}."
