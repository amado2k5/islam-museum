summary:
  ar: "اللبلاب محلل مفتح، معتدل إلى حرارة ويبس لين، ومنه المعروف بحبل المساكين، وينفع في الخراجات وحرق النار ووجع الأذن والكبد والطحال {cite:canon-ibn-sina-print-v1 p.545} {cite:canon-ibn-sina-print-v1 p.546}."
  en: "Lablab dissolves and opens; it is balanced toward some heat and a soft dryness, and includes the kind known as the beggars' rope; it is listed for abscesses, burns, earache, the liver and the spleen {cite:canon-ibn-sina-print-v1 p.545} {cite:canon-ibn-sina-print-v1 p.546}."
  ur: "لبلاب تحلیل اور تفتیح کرنے والا ہے، حرارت اور نرم خشکی کی طرف معتدل مائل، اور اس کی ایک قسم حبل المساکین کہلاتی ہے؛ پھوڑوں، آگ کے جلنے، کان کے درد، جگر اور تلی میں مذکور ہے {cite:canon-ibn-sina-print-v1 p.545} {cite:canon-ibn-sina-print-v1 p.546}۔"
  es: "Lablab se disuelve y se abre; está equilibrado hacia algo de calor y una suave sequedad, e incluye el tipo conocido como cuerda de mendigo; se menciona para abscesos, quemaduras, dolor de oído, el hígado y el bazo {cite:canon-ibn-sina-print-v1 p.545} {cite:canon-ibn-sina-print-v1 p.546}."
