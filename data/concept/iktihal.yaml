summary:
  ar: "الاكتحال هو وضع الكحل في العين، وهو مستحب وترا عند الشافعية والحنابلة، ويجوز عند الحنفية ما لم يُقصد به التزين للتكبر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3232}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3233} وفيه أحكام تتعلق بالإحرام والصيام والعدة والاعتكاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3233}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3234}"
  en: "Iktihal is applying kohl to the eye. The Shafi'is and Hanbalis recommend an odd number of applications; the Hanafis allow it unless it is meant as pride in adornment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3232}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3233} Its rulings touch on ihram, fasting, the waiting period and i'tikaf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3233}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3234}"
