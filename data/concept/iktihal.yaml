label: { ar: "الاكتحال", en: "Iktihal (applying kohl to the eye)", es: "Iktihal (aplicación de kohl en el ojo)", fr: "Iktihal (application de khôl sur l'œil)" }
summary:
  ar: "الاكتحال هو وضع الكحل في العين، وهو مستحب وترا عند الشافعية والحنابلة، ويجوز عند الحنفية ما لم يُقصد به التزين للتكبر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3232}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3233} وفيه أحكام تتعلق بالإحرام والصيام والعدة والاعتكاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3233}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3234}"
  en: "Iktihal is applying kohl to the eye. The Shafi'is and Hanbalis recommend an odd number of applications; the Hanafis allow it unless it is meant as pride in adornment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3232}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3233} Its rulings touch on ihram, fasting, the waiting period and i'tikaf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3233}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3234}"
  es: "Iktihal es la aplicación de kohl en los ojos. Los shafi'íes y hanbalíes recomiendan un número impar de aplicaciones; los hanafíes lo permiten a menos que se trate de un adorno o adorno. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3232}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3233} Sus normas abordan el ihram, el ayuno, el período de espera y el i'tikaf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3233}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3234}"
  fr: "L'iktihal consiste à appliquer du khôl sur les yeux. Les écoles chaféite et hanbalite recommandent un nombre impair d'applications; l'école hanafite l'autorise, sauf s'il s'agit d'un ornement ostentatoire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3232}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3233} Ses règles concernent l'ihram, le jeûne, la période d'attente et l'i'tikaf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3233}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3234}"
