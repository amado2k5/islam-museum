id: concept/al-idtirar-fi-al-akl
class: concept
kind: legal
label:
  ar: "الاضطرار إلى المحرم من الطعام"
  en: "Necessity permits the forbidden food"
summary:
  ar: "يرى الشعراوي أن الإباحة للمضطر رخصة من الله بقدر الحاجة لا تجاوزها، وأن المضطر لا يملأ بطنه بالمحرم، وأن حق المالك في الماء مقدم في الضرورة، وأن الله غفور رحيم لأن المضطر لم يرتكب ذنباً. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.719}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.720}"
  en: "Sha'rawi holds that permission for the one compelled by necessity is a concession from God limited to the need, that the compelled person does not fill his belly with the forbidden, that the owner's right to water takes precedence in necessity, and that God's forgiveness and mercy at the end of the verse is for one who committed no sin {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.719}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.720}."
wings: [ideas]
themes: [worship-and-the-pillars, ethics-and-character]
periods: [period/prophetic-era]
regions: [global]
issue:
  ar: "ما حدّ الإباحة عند الضرورة، وهل يتقدم حق المالك على حاجة المضطر؟"
  en: "What is the limit of permission under necessity, and does the owner's right come before the needy person's need?"
perspectives:
  - tradition: sunni
    id: sharawi-necessity-limit
    stance:
      ar: "الضرورة تبيح بقدرها، ولا تُحل المحرم تحليلاً دائماً، وحق المالك مقدم"
      en: "Necessity permits only to the measure of need, does not make the forbidden lawful for good, and the owner's right comes first"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقول الشعراوي إن المضطر يأخذ على قدر استبقاء الحياة ولا يعتقد أن المحرم صار حلالاً، وإن حق من يملك الماء مقدم، لأن الاضطرار لا يدفع الضرر إلى غيره، وإن قوله الجملة الأخيرة من [[passage/quran-2-173|الآية 173 من البقرة]] يعني أن المسألة فيها إثم أبيح للضرورة ثم يعود الحكم إذا زالت. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.719}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.720}"
      en: "Sha'rawi says the compelled person takes only what keeps him alive and does not hold that the forbidden has become lawful; the owner of the water has the prior right, since necessity may not push harm onto another; and the closing clause of the verse means the matter still carries sin that is permitted for necessity, reverting to the ruling when necessity ends {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.719}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.720}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
  - tradition: sunni
    id: scope-note-jurists
    stance:
      ar: "أقوال الفقهاء في حد الضرورة وقدرها لم تُدخل من مصدر مراجَع في هذه الدفعة"
      en: "Jurists' views on the measure of necessity are not entered from a checked source in this batch"
    holders: []
    summary:
      ar: "لم تُدخل هنا تفاصيل المذاهب في حد الضرورة وفي تقديم حق المالك، ولا الرأي الأكاديمي ولا الآراء الأخرى. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.720}"
      en: "The schools' detail on the measure of necessity and on the owner's prior right, the academic view and other views are not entered here {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.720}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
