summary:
  ar: "يذكر ابن سينا علامات أصناف الدوار من البخارات القديمة في الدماغ ثم بحسب الخلط ⁦(بلغم وصفراء ودم وسوداء)⁩ {cite:canon-ibn-sina-print-v2 p.115}"
  en: "Ibn Sina gives the signs of the kinds of vertigo from old vapours in the brain and then by humour (phlegm, bile, blood, black bile) {cite:canon-ibn-sina-print-v2 p.115}"
  fr: "Ibn Sina donne les signes des espèces de vertige dues aux vapeurs anciennes dans le cerveau, puis selon l’humeur (phlegme, bile, sang, bile noire) {cite:canon-ibn-sina-print-v2 p.115}"
  ur: "ابن سینا دماغ کی پرانی بخارات سے دوار کی قسموں کی علامات اور پھر خلط کے لحاظ سے ⁦(بلغم، صفراء، خون، سودا)⁩ علامات بتاتا ہے {cite:canon-ibn-sina-print-v2 p.115}۔"
  es: "Ibn Sina da los signos de los tipos de vértigo por vapores antiguos en el cerebro y luego por humores (flema, bilis, sangre, bilis negra) {cite:canon-ibn-sina-print-v2 p.115}"
  tr: "İbn Sina, beyindeki eski buharlardan kaynaklanan baş dönmesi belirtilerini belirtir ve ardından karışıma göre (balgam, sarı, kan ve siyahlık) {atıf:kanon-ibn-sina-print-v2 s.115}"
  id: "Ibn Sina menggambarkan gejala pusing yang disebabkan oleh uap lama di otak dan kemudian menurut campuran (dahak, kuning, darah, dan kehitaman) {kutipan: kanon-ibn-sina-print-v2 hlm.115}"
