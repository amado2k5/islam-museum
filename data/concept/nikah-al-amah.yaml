id: concept/nikah-al-amah
class: concept
kind: legal
label:
  ar: "نكاح الأَمَة"
  en: "Marriage to a slave woman (nikah al-amah)"
  ur: "لونڈی سے نکاح"
summary:
  ar: "يبيّن الشعراوي أن نكاح الأمة المؤمنة مشروط بإذن مولاها، وأن مهرها يُؤدى بالمعروف، وأن الأمة إن زنت بعد الإحصان فعليها نصف عقوبة المحصنة، وأنه لا يباح للمسلم القادر على الحرة أن ينكح الأمة إلا عند الحاجة وخوف العنت. ويذكر أن الحكم من مقاصده تصفية الرق لأن الولد يتبع أمه في الرق {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2125}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2130}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2121}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2122}."
  en: "Al-Sha'rawi says marriage to a believing slave woman needs her owner's permission, that her dower is paid in the customary way, and that if she commits zina after marriage her penalty is half that of a free married woman. A Muslim who can marry a free woman may marry a slave woman only in need and fear of sin. He says one purpose of the ruling is to end slavery, since a child follows the mother's status {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2121}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2122}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2125}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2130}."
  ur: "شعراوی بیان کرتے ہیں کہ مومنہ لونڈی سے نکاح کے لیے اس کے مالک کی اجازت لازم ہے، اس کا مہر دستور کے مطابق ادا ہو، اور شادی کے بعد بدکاری کی صورت میں اس کی سزا آزاد شادی شدہ عورت کی سزا کا نصف ہے۔ ان کے مطابق آزاد عورت سے نکاح کی استطاعت رکھنے والا لونڈی سے صرف ضرورت اور گناہ کے خوف کی صورت میں نکاح کرے {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2121}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2122}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2125}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2130}۔"
wings: [ideas]
themes: [family-marriage-kinship]
issue:
  ar: "متى يجوز نكاح الأمة، وما أثر ذلك على الولد وعلى عقوبة الزنا؟"
  en: "When is marriage to a slave woman permitted, and what follows for the child and for the penalty for zina?"
  ur: "لونڈی سے نکاح کب جائز ہے، اور اس کا بچے اور زنا کی سزا پر کیا اثر ہے؟"
perspectives:
  - tradition: sunni
    id: sunni-sharawi-conditions-and-end-of-slavery
    stance:
      ar: "نكاح الأمة جائز بشروط ومع الحاجة، ومقصده تصفية الرق"
      en: "Marriage to a slave woman is permitted under conditions and in need, and its purpose is to end slavery"
      ur: "لونڈی سے نکاح شرائط اور ضرورت کے ساتھ جائز ہے، اور اس کا مقصد غلامی کا خاتمہ ہے"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي الشروط من الآية ويضيف أن الحكم يصفّي الرق، ويذكر أن بعض الفقهاء يشترطون ألا يجد الرجل ما يتزوج به حرة وأن تكون الأمة مؤمنة وأن يخشى الوقوع في الإثم، وهي شروط يعرضها الهامش دون تسمية أصحابها {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2130}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2121}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2122}."
      en: "Sha'rawi draws the conditions from the verse and adds that the ruling aims to end slavery. He reports, in a footnote, that some jurists require that the man lack the means to marry a free woman, that the slave woman be a believer, and that he fear sin; the jurists are not named {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2121}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2122}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2130}."
      ur: "شعراوی آیت سے شرائط لیتے ہیں اور کہتے ہیں کہ حکم کا مقصد غلامی ختم کرنا ہے۔ حاشیے میں مذکور ہے کہ بعض فقہاء شرط لگاتے ہیں کہ آدمی آزاد عورت سے نکاح کی استطاعت نہ رکھتا ہو، لونڈی مومنہ ہو، اور گناہ کا خوف ہو؛ فقہاء کے نام نہیں دیے گئے {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2121}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2122}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2130}۔"
    sources: [source/tafsir-sharawi-khawatir-scan-vol-2]
