id: concept/ihraz
class: concept
kind: legal
label: { ar: "إحراز", en: "Keeping in a safe place (ihraz)", es: "Guardar en un lugar seguro (ihraz)", fr: "Conserver dans un endroit sûr (ihraz)", ur: "محفوظ جگہ پر رکھنا ⁦(احراز)⁩", tr: "Başarı", id: "Prestasi" }
summary:
  ar: "الإحراز لغة حفظ الشيء وصيانته عن الأخذ، وعرّفه النسفي بأنه جعل الشيء في الحرز، وهو الموضع الحصين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1763} ويبحث الإحراز في السرقة عند شروطها، وفي العقود التي يترتب بها ضمان كالوديعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1764}"
  en: "Ihraz in the lexicon is keeping a thing and guarding it from being taken. Al-Nasafi defines it as placing a thing in a safe store. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1763} It is treated under the conditions of theft and in contracts that carry liability, such as deposit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1764}"
  es: "En el léxico, ihraz significa guardar algo y protegerlo para que no sea robado. Al-Nasafi lo define como colocar algo en una caja fuerte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1763} Se considera un término aplicable en casos de robo y en contratos que implican responsabilidad, como los depósitos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1764}"
  fr: "Dans le lexique, le terme « ihraz » désigne la conservation d'un bien et sa protection contre le vol. Al-Nasafi le définit comme le fait de placer un bien dans un lieu sûr. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1763} Il est abordé dans le cadre du vol et des contrats engageant la responsabilité, tels que les dépôts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1764}"
  ur: "لغت میں احراز کسی چیز کو رکھنا اور اسے لینے سے بچانا ہے۔ النصفی نے اس کی تعریف کسی چیز کو محفوظ اسٹور میں رکھنے سے کی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1763} اس کا علاج چوری کی شرائط کے تحت اور ان معاہدوں میں کیا جاتا ہے جن میں ذمہ داری ہوتی ہے، جیسے کہ ڈپازٹ۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص1764}"
  tr: "'İhraz' dili, bir şeyin alınmasını önlemek ve korumaktır; el-Nasafi ise eşyayı kasaya koymak olarak tanımlamıştır; bu kasa korunan yerdir. {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s.1763} Al-Ihriz, hırsızlığı kendi koşulları ve depozito gibi sorumluluk içeren sözleşmelerde inceler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1764}"
  id: "Bahasa 'ihraz' adalah pelestarian dan perlindungan sesuatu agar tidak diambil, dan al-Nasafi mendefinisikannya sebagai menempatkan barang tersebut ke dalam brankas, yang merupakan tempat yang dilindungi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1763} Al-Ihriz memeriksa pencurian di bawah syaratnya dan dalam kontrak yang menimbulkan tanggung jawab seperti deposit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1764}"
