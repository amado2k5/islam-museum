label: { ar: "إحراز", en: "Keeping in a safe place (ihraz)" }
summary:
  ar: "الإحراز لغة حفظ الشيء وصيانته عن الأخذ، وعرّفه النسفي بأنه جعل الشيء في الحرز، وهو الموضع الحصين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1763} ويبحث الإحراز في السرقة عند شروطها، وفي العقود التي يترتب بها ضمان كالوديعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1764}"
  en: "Ihraz in the lexicon is keeping a thing and guarding it from being taken. Al-Nasafi defines it as placing a thing in a safe store. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1763} It is treated under the conditions of theft and in contracts that carry liability, such as deposit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1764}"
