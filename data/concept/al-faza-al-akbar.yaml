id: concept/al-faza-al-akbar
class: concept
kind: belief
label:
  ar: "الفزع الأكبر"
  en: "The Greatest Terror"
  fr: "La plus grande terreur"
  ur: "الفزع الأكبر"
  es: "El mayor terror"
summary:
  ar: "الفزع الأكبر في تفسير السلف أعظم أهوال يوم القيامة — يوم النفخ في الصور وانقضاض الأهوال على الخلائق — ينجو منه عباد الله: «لا يحزنهم الفزع الأكبر وتتلقاهم الملائكة» {cite:tafsir-ibn-kathir} {cite:mufhim-qurtubi-v7}."
  en: "The Greatest Terror in the early exegetes is the severest fright of the Day — the blast and the terrors falling upon creation — from which God's servants are safe: 'the Greatest Terror shall not grieve them, and the angels shall receive them' {cite:tafsir-ibn-kathir} {cite:mufhim-qurtubi-v7}."
  fr: "Pour les premiers exégètes, la plus grande terreur est l’effroi le plus intense du Jour : le souffle et les terreurs qui s’abattent sur la création. Les serviteurs de Dieu en sont préservés : la plus grande terreur ne les afflige pas et les anges les accueillent {cite:tafsir-ibn-kathir} {cite:mufhim-qurtubi-v7}."
  ur: "سلف کے مفسرین کے نزدیک الفزع الأكبر قیامت کے دن کی بڑی ہولناکی ہے — صور کی پھونک اور مخلوق پر اہوال کا نازل ہونا — جس سے اللہ کے بندے محفوظ ہیں {cite:tafsir-ibn-kathir} {cite:mufhim-qurtubi-v7}۔"
  es: "El Terror Mayor en los primeros exégetas es el susto más severo del Día —la explosión y los terrores que caen sobre la creación— del cual los siervos de Dios están a salvo: «El Terror Mayor no los afligirá, y los ángeles los recibirán» {cite:tafsir-ibn-kathir} {cite:mufhim-qurtubi-v7}."
