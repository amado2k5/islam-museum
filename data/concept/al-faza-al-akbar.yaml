label:
  ar: "الفزع الأكبر"
  en: "The Greatest Terror"
  ur: "الفزع الأكبر"
summary:
  ar: "الفزع الأكبر في تفسير السلف أعظم أهوال يوم القيامة — يوم النفخ في الصور وانقضاض الأهوال على الخلائق — ينجو منه عباد الله: «لا يحزنهم الفزع الأكبر وتتلقاهم الملائكة» {cite:tafsir-ibn-kathir} {cite:mufhim-qurtubi-v7}."
  en: "The Greatest Terror in the early exegetes is the severest fright of the Day — the blast and the terrors falling upon creation — from which God's servants are safe: 'the Greatest Terror shall not grieve them, and the angels shall receive them' {cite:tafsir-ibn-kathir} {cite:mufhim-qurtubi-v7}."
  ur: "سلف کے مفسرین کے نزدیک الفزع الأكبر قیامت کے دن کی بڑی ہولناکی ہے — صور کی پھونک اور مخلوق پر اہوال کا نازل ہونا — جس سے اللہ کے بندے محفوظ ہیں {cite:tafsir-ibn-kathir} {cite:mufhim-qurtubi-v7}۔"
