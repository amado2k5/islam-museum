label:
  ar: "البقلة الحمقاء"
  en: "Baqla hamqa (purslane)"
  fr: "Baqla hamqa (pourpier)"
  ur: "بقلۃ الحمقاء ⁦(پرسلین)⁩"
  es: "Baqla hamqa (verdolaga)"
  tr: "Aptal semizotu"
  id: "Burung purslane bodoh"
summary:
  ar: "بقلة معروفة، عصارتها أبلغ ما فيها فعلاً، قامعة للصفراء، قابضة تمنع النزف والسيلانات المزمنة، وتنفع من الحمرة والأورام الحارة والصداع الحار والرمد، وتنفع الكبد الملتهبة والمعدة الملتهبة، وفيها ما يذكره الكتاب من حبس نزف الحيض ومن زيادة الباه {cite:canon-ibn-sina-print-v1 p.405}."
  en: "A well-known herb whose juice is its strongest part. Cold and moist, it is strongly against bile, astringent, stops bleeding and chronic flow, helps inflamed swellings, hot headache and eye inflammation, and inflamed liver and stomach. The book also lists that it stops menstrual bleeding and that it increases desire {cite:canon-ibn-sina-print-v1 p.405}."
  fr: "Herbe connue dont le suc est la partie la plus forte. Froide et humide, fortement opposée à la bile et astringente, elle arrêterait les saignements et écoulements chroniques, aiderait contre gonflements enflammés, céphalées chaudes, inflammation de l’œil, du foie et de l’estomac. Le livre mentionne aussi l’arrêt des règles et l’accroissement du désir {cite:canon-ibn-sina-print-v1 p.405}."
  ur: "ایک معروف بقلہ، جس کا رس اس کا سب سے زیادہ مؤثر حصہ ہے۔ سرد اور تر، صفرا کو سخت دبانے والا، قابض جو خون بہنا اور پرانا بہاؤ روکتا ہے، سوجن اور گرم ورم، گرم سردرد اور آشوبِ چشم میں مفید، اور سوجی ہوئی جگر اور معدے کے لیے مفید ہے۔ کتاب یہ بھی درج کرتی ہے کہ یہ حیض کا خون روکتا ہے اور جماع کی رغبت بڑھاتا ہے {cite:canon-ibn-sina-print-v1 p.405}۔"
  es: "Hierba muy conocida cuyo jugo es su componente más potente. Fría y húmeda, es muy eficaz contra la bilis, astringente, detiene el sangrado y la hemorragia crónica, ayuda con la inflamación, el dolor de cabeza intenso y la inflamación ocular, así como con la inflamación del hígado y el estómago. El libro también menciona que detiene el sangrado menstrual y que aumenta el deseo sexual {cite:canon-ibn-sina-print-v1 p.405}."
  tr: "Gerçekten en güçlü olan ve safra baskılayıcı, büzülen, kanamayı ve kronik bel soğukluğunu önleyen, eritrositlerden, sıcak tümörlerden, sıcak baş ağrılarından ve konjonktivitten fayda sağlayan iyi bilinen bir kıtlıktır ve iltihaplı karaciğer ile midelere fayda sağlar. Kitapta adet kanamasını durdurmak ve bah artışı hakkında bahsedilenleri içerir {cite:canon-ibn-sina-print-v1 s.405}."
  id: "Ini adalah kelangkaan yang terkenal, dengan cairan yang benar-benar paling kuat, menekan empedu, astringen, mencegah perdarahan dan gonore kronis, mendapat manfaat dari eritrosit, tumor panas, sakit kepala panas, dan konjungtivitis, serta bermanfaat bagi hati dan lambung yang meradang. Buku ini memuat apa yang disebutkan dalam buku tentang menghentikan pendarahan menstruasi dan meningkatkan bah {cite:canon-ibn-sina-print-v1 hlm.405}."
