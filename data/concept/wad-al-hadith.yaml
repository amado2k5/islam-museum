class: concept
kind: term
label:
  ar: وضع الحديث
  en: Fabrication of hadith (wad' al-hadith)
  es: "Fabricación de hadices (wad' al-hadith)"
  fr: "Fabrication de hadiths (wad' al-hadith)"
  ur: "حدیث کی تشکیل ⁦(واد الحدیث)⁩"
  tr: "Hadis Durumu"
  id: "Situasi Hadis"
summary:
  ar: "نشأ الوضع بعد التحكيم ومقتل الإمام علي حين تفرقت الأحزاب، فحاول كل حزب تأييد دعواه بالقرآن والسنة، فلما تعذّر تحريف القرآن لكثرة حفاظه اتجهوا إلى السنة فزادوا فيها {cite:manhaj-tawthiq-al-sunna-azhar p. 37}. ومن أسبابه: الأحزاب السياسية، والزنادقة أعداء الإسلام، والشعوبية، والقصاصون والوعاظ، والتزلف إلى الحكام، والخلافات المذهبية والكلامية {cite:manhaj-tawthiq-al-sunna-azhar p. 39}. وقد وضع المحدثون علامات يُعرف بها الوضع في السند والمتن، كركاكة اللفظ وفساد المعنى ومخالفة النص القطعي؛ وقال ابن القيم إن معرفة الموضوع من غير النظر في السند لا تكون إلا لمن تضلّع في السنة الصحيحة {cite:manhaj-tawthiq-al-sunna-azhar p. 46}{cite:manhaj-tawthiq-al-sunna-azhar p. 47}{cite:manhaj-tawthiq-al-sunna-azhar p. 48}. ويذكر الشيخ علي الخفيف سبعة أمور يعدّها أهل الحديث دلائل على الوضع في المتن: ركاكة المعنى، وفساده بمخالفة العقل أو الحس أو قطعي التاريخ، ومخالفة الكتاب أو السنة المتواترة أو الإجماع القطعي، ومخالفة الوقائع التاريخية الثابتة، وصدوره من راوٍ متعصب لمذهبه، والإفراط في الثواب أو الوعيد على عمل صغير، وأن يتعلق بأمر عظيم الوقوع ثم لا يرويه إلا واحد {cite:makanat-al-sunna-azhar p. 47}{cite:makanat-al-sunna-azhar p. 48}{cite:makanat-al-sunna-azhar p. 49}. ويرى أن تطبيق هذه الضوابط يختلف باختلاف الناقدين، وأنها تفيد غلبة الظن لا القطع {cite:makanat-al-sunna-azhar p. 50}{cite:makanat-al-sunna-azhar p. 52}{cite:makanat-al-sunna-azhar p. 53}."
  tr: "Durum, tahkim ve İmam Ali'nin öldürülmesinden sonra ortaya çıktı; partiler ayrıldı, bu yüzden her iki taraf da iddiasını Kuran ve Sünnet'e dayanarak desteklemeye çalıştı. Kur'an'ı ezberleyen çok sayıda kişi nedeniyle çarpıtmak imkansız hale gelince, Sünnet'e yöneldiler ve onu artırdılar {atıf:manhaj-tavsiq-al-sunna-azhar s. 37}. Nedenleri arasında siyasi partiler, İslam düşmanı sapkınlar, şuubiyet, ceza beraberler ve vaizler, yöneticilere iltifat, mezhepsel ve teolojik anlaşmazlıklar {cite:manhaj-tawthiq-al-sunna-azhar s. 39}. Hadis âlimleri, zincirdeki rivayet ve metnin tanımlanmasını sağlayan garip ifadeler, anlamın geçersizliği ve kesin metnin çelişkisi gibi işaretler ortaya koymuşlardır; İbn al-Kayyim, zinciri incelemeden konunun bilgisinin ancak özgün Sünnet'e iyi hakim olanlar için mümkün olduğunu söylemiştir {cite:manhaj-tavsiq-al-sunna-azhar s. 46}{cite:manhaj-tavsiq-al-sunna-azhar s. 48}. Şeyh Ali Al-Kilic, hadis alimlerinin metinde uydurma kanıtı olarak gördüğü yedi şeyden bahseder: zayıf anlam, akla karşı gelerek yozlaşma, duyusal veya kesin tarihlere meydan okuma, Kur'an veya mutevatir sünneti ya da kesin uzlaşı ile çelişme, yerleşik tarihsel gerçeklerle çelişme, kendi mezhebine mensup fanatik bir rivayetçiden gelmek, küçük işler için aşırı ödül veya uyarı ve yalnızca bir kişinin anlattığı büyük bir olayla ilgili olmak {cite:makanat-al-sunna-azhar s. 47}{cite:makanat-al-sunna-azhar s. 48}{cite:makanat-al-sunna-azhar s. 49}. Bu kontrollerin eleştirmenler arasında farklılık gösterdiğine ve kesinlikten çok şüphenin baskın olduğunu gösterdiğine inanıyor {cite:makanat-al-sunna-azhar s. 50}{cite:makanat-al-sunna-azhar s. 52}{cite:makanat-al-sunna-azhar s. 53}."
  id: "Situasi ini muncul setelah arbitrase dan pembunuhan Imam Ali ketika kedua pihak terpecah, sehingga masing-masing pihak berusaha mendukung klaimnya berdasarkan Al-Qur'an dan Sunnah. Ketika menjadi tidak mungkin lagi memutarbalikkan Al-Qur'an karena banyaknya pengapalnya, mereka beralih ke Sunnah dan meningkatkannya {cite:manhaj-tawthiq-al-sunna-azhar hlm. 37}. Di antara penyebabnya: partai politik, bidat yang menjadi musuh Islam, shu'ubiyyah, pembawa balasan dan penceramah, pujian kepada penguasa, serta perselisihan sektarian dan teologis {cite:manhaj-tawthiq-al-sunna-azhar hlm. 39}. Para ulama Hadis telah menetapkan tanda-tanda yang menentukan narasi dalam rantai dan teks, seperti kata-kata yang canggung, ketidakabsahan makna, dan kontradiksi teks definitif; Ibn al-Qayyim mengatakan bahwa pengetahuan tentang subjek tanpa memeriksa rantai hanya mungkin bagi mereka yang menguasai Sunnah yang otentik {cite:manhaj-tawthiq-al-sunna-azhar hlm. 46}{cite:manhaj-tawthiq-al-sunna-azhar hlm. 48}. Sheikh Ali Al-Khafif menyebutkan tujuh hal yang dianggap sebagai bukti palsu oleh ulama hadis dalam teks: makna lemah, korupsi karena menentang akal, tanggal-tanggal indera, atau definitif, bertentangan dengan Al-Qur'an atau Sunnah mutawatir atau konsensus definitif, bertentangan dengan fakta sejarah yang sudah mapan, datang dari narator fanatik dari sekolahnya, hadiah atau peringatan berlebihan untuk perbuatan kecil, dan terkait dengan peristiwa besar yang hanya diceritakan oleh satu {cite:makanat-al-sunna-azhar hlm. 47}{cite:makanat-al-sunna-azhar hlm. 48}{cite:makanat-al-sunna-azhar hlm. 49}. Ia percaya bahwa penerapan kontrol ini bervariasi di antara para kritikus, dan bahwa hal ini menunjukkan dominasi kecurigaan daripada kepastian {cite:makanat-al-sunna-azhar hlm. 50}{cite:makanat-al-sunna-azhar hlm. 52}{cite:makanat-al-sunna-azhar hlm. 53}."
