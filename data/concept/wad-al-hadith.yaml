label:
  ar: وضع الحديث
  en: Fabrication of hadith (wad' al-hadith)
summary:
  ar: "نشأ الوضع بعد التحكيم ومقتل الإمام علي حين تفرقت الأحزاب، فحاول كل حزب تأييد دعواه بالقرآن والسنة، فلما تعذّر تحريف القرآن لكثرة حفاظه اتجهوا إلى السنة فزادوا فيها {cite:manhaj-tawthiq-al-sunna-azhar p. 37}. ومن أسبابه: الأحزاب السياسية، والزنادقة أعداء الإسلام، والشعوبية، والقصاصون والوعاظ، والتزلف إلى الحكام، والخلافات المذهبية والكلامية {cite:manhaj-tawthiq-al-sunna-azhar p. 39}. وقد وضع المحدثون علامات يُعرف بها الوضع في السند والمتن، كركاكة اللفظ وفساد المعنى ومخالفة النص القطعي؛ وقال ابن القيم إن معرفة الموضوع من غير النظر في السند لا تكون إلا لمن تضلّع في السنة الصحيحة {cite:manhaj-tawthiq-al-sunna-azhar p. 46}{cite:manhaj-tawthiq-al-sunna-azhar p. 47}{cite:manhaj-tawthiq-al-sunna-azhar p. 48}. ويذكر الشيخ علي الخفيف سبعة أمور يعدّها أهل الحديث دلائل على الوضع في المتن: ركاكة المعنى، وفساده بمخالفة العقل أو الحس أو قطعي التاريخ، ومخالفة الكتاب أو السنة المتواترة أو الإجماع القطعي، ومخالفة الوقائع التاريخية الثابتة، وصدوره من راوٍ متعصب لمذهبه، والإفراط في الثواب أو الوعيد على عمل صغير، وأن يتعلق بأمر عظيم الوقوع ثم لا يرويه إلا واحد {cite:makanat-al-sunna-azhar p. 47}{cite:makanat-al-sunna-azhar p. 48}{cite:makanat-al-sunna-azhar p. 49}. ويرى أن تطبيق هذه الضوابط يختلف باختلاف الناقدين، وأنها تفيد غلبة الظن لا القطع {cite:makanat-al-sunna-azhar p. 50}{cite:makanat-al-sunna-azhar p. 52}{cite:makanat-al-sunna-azhar p. 53}."
