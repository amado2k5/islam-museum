summary:
  ar: "الهندبا صنفان، بري وبستاني، ويجري مجرى الخسّ، وأنفعه للكبد أمرّه، ويضمّد به النقرس، ويسكّن الغثي ويقوي المعدة. {cite:canon-ibn-sina-print-v1 p.449}"
  en: "Hindaba has two kinds, wild and garden; it is like lettuce, the most bitter is best for the liver, it is applied to gout, and it soothes nausea and strengthens the stomach. {cite:canon-ibn-sina-print-v1 p.449}"
  ur: "ہندبا کی دو قسمیں ہیں، جنگلی اور باغی؛ یہ سلاد کے پتے کی طرح ہے، جگر کے لیے سب سے کڑی قسم بہتر ہے، گاؤٹ پر لگایا جاتا ہے، اور متلی کو سکون دیتا اور معدے کو مضبوط کرتا ہے۔ {cite:canon-ibn-sina-print-v1 p.449}"
  es: "La hindaba tiene dos variedades: silvestre y cultivada. Es similar a la lechuga; la más amarga es la mejor para el hígado, se usa para la gota, alivia las náuseas y fortalece el estómago. {cite:canon-ibn-sina-print-v1 p.449}"
  fr: "L'hindaba se présente sous deux formes: sauvage et cultivée. Elle ressemble à la laitue; la plus amère est la meilleure pour le foie, elle est utilisée contre la goutte, soulage les nausées et fortifie l'estomac. {cite:canon-ibn-sina-print-v1 p.449}"
  tr: "İki türü vardır: yabani ve bahçecilik. Marul yoluyla akar, karaciğere fayda sağlar, gut hastalığını iyileştirir, bulantıyı yatıştırır ve mideye destek verir. {cite:canon-ibn-sina-print-v1 s.449}"
  id: "Ada dua jenis: liar dan hortikultura. Selada mengalir melalui selada, bermanfaat untuk hati, menyembuhkan asam urat, meredakan mual, dan memperkuat lambung. {cite:canon-ibn-sina-print-v1 hlm.449}"
