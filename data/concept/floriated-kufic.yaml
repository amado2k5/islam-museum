label: { ar: "الكوفي المورَّق ⁦(المزهَّر)⁩", en: "Floriated Kufic", ur: "مورّق ⁦(پھول دار)⁩ کوفی", es: "Cúfico florido" }
summary:
  ar: "أسلوب من الكوفي تنبت فيه من أطراف الحروف وقوائمها أوراق وسيقان وأزهار، اشتهرت به كتابات العمائر الفاطمية في مصر، وإن سبقها في مصر بقرن على الأقل {cite:okane-monumental-calligraphy-fatimid-egypt p. 1}."
  en: "A style of Kufic in which leaves, stems and blossoms sprout from the ends and uprights of letters, famous in the monumental inscriptions of Fatimid Egypt though attested there at least a century earlier {cite:okane-monumental-calligraphy-fatimid-egypt p. 1}."
  ur: "کوفی کا ایک اسلوب جس میں حروف کے سروں اور عمودی حصوں سے پتے، تنے اور پھول نکلتے ہیں، فاطمی مصر کے عمارتی کتبات میں مشہور، اگرچہ وہاں کم از کم ایک صدی پہلے سے موجود {cite:okane-monumental-calligraphy-fatimid-egypt p. 1}۔"
  es: "Un estilo de escritura cúfica en el que brotan hojas, tallos y flores de los extremos y los lóbulos de las letras, famoso en las inscripciones monumentales del Egipto fatimí, aunque atestiguado allí al menos un siglo antes {cite:okane-monumental-calligraphy-fatimid-egypt p. 1}."
