id: concept/floriated-kufic
class: concept
kind: art_form
label: { ar: "الكوفي المورَّق ⁦(المزهَّر)⁩", en: "Floriated Kufic", ur: "مورّق ⁦(پھول دار)⁩ کوفی" , fr: "Coufique fleuri" }
summary:
  fr: "Le coufique fleuri décore de feuilles, tiges et fleurs les extrémités et hampes du [[concept/kufic-script|Kufic]]. Célèbre dans l'Égypte fatimide, il n'en est pas une invention, souligne [[person/bernard-okane|Bernard O'Kane]]. Un siècle avant l'arrivée fatimide au Caire, Mubarak al-Makki grava une stèle de dhu l-hijja 243/mars 858, aujourd'hui au musée d'Art islamique du Caire, parmi les premiers exemples mûrs. Avant la conquête, l'inscription de Khadija al-Taraifi, enterrée dans la Petite Qarafa le 20 shawwal 347/4 janvier 959, constitue un chef-d'œuvre légèrement fleuri ; le panneau du vizir ikhchidide Ibn al-Furat, 355/966, en est un autre exemple. {cite:okane-monumental-calligraphy-fatimid-egypt p. 1}"
  ar: "أسلوب من الكوفي تنبت فيه من أطراف الحروف وقوائمها أوراق وسيقان وأزهار، اشتهرت به كتابات العمائر الفاطمية في مصر، وإن سبقها في مصر بقرن على الأقل {cite:okane-monumental-calligraphy-fatimid-egypt p. 1}."
  en: "A style of Kufic in which leaves, stems and blossoms sprout from the ends and uprights of letters, famous in the monumental inscriptions of Fatimid Egypt though attested there at least a century earlier {cite:okane-monumental-calligraphy-fatimid-egypt p. 1}."
  ur: "کوفی کا ایک اسلوب جس میں حروف کے سروں اور عمودی حصوں سے پتے، تنے اور پھول نکلتے ہیں، فاطمی مصر کے عمارتی کتبات میں مشہور، اگرچہ وہاں کم از کم ایک صدی پہلے سے موجود {cite:okane-monumental-calligraphy-fatimid-egypt p. 1}۔"
