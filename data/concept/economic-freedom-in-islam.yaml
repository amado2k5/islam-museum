label:
  ar: الحرية الاقتصادية في الإسلام
  en: Economic freedom in Islam
  es: "Libertad económica en el Islam"
  fr: "La liberté économique en islam"
  ur: "اسلام میں معاشی آزادی"
  tr: "İslam'da Ekonomik Özgürlük"
  id: "Kebebasan Ekonomi dalam Islam"
summary:
  ar: "يتتبع المؤلف مصطلح الحرية الاقتصادية من الطبيعيين في فرنسا في القرن الثامن عشر، وشعارهم «دعه يعمل دعه يمرّ»، ثم إعلان حقوق الإنسان سنة 1789م، ثم المذهب الفردي الحر الذي يرى أن اليد الخفية تحقق التوازن {cite:usul-iqtisad-islami-0660 p. 72}. ويرى أن المذهب الحر يقوم على ثلاثة عناصر: الملكية الخاصة لوسائل الإنتاج، والمشروع الحر، والمنافسة النسبية {cite:usul-iqtisad-islami-0660 p. 76}. ويقرر المؤلف أن الحرية في الإسلام تحرير للإنسان من الرق والإكراه والفقر والجوع والجهل والخوف، وأن حرية كل واحد تنتهي حيث تبدأ حرية غيره {cite:usul-iqtisad-islami-0660 p. 37} {cite:usul-iqtisad-islami-0660 p. 38} {cite:usul-iqtisad-islami-0660 p. 78}. ومن قيودها: منع الاحتكار والربا والغش والتغرير وتعطيل الأرض واكتناز المال، وأن للدولة أن تجبر الباعة على البيع إذا احتكروا {cite:usul-iqtisad-islami-0660 p. 80} {cite:usul-iqtisad-islami-0660 p. 81}. ويختم بأنها حرية في التعمير لا في التدمير، وفي النفع لا في الضرر {cite:usul-iqtisad-islami-0660 p. 82}. يرى المؤلف أن العبادات والعقائد تحتاج إلى نص، أما المعاملات فمبنية على الإباحة، وأن المحرمات محدودة مفصلة والمباحات غير محدودة، وأن المذاهب متفقة على حرية التعاقد واختلفت في مدى حرية الشروط، وأوسعها الحنبلي."
  tr: "Yazar, ekonomik özgürlük terimini on sekizinci yüzyıl Fransa'sındaki doğa bilimcilerinden, \"Bırak çalışsın, geçsin\" sloganını, ardından 1789'daki İnsan Hakları Bildirgesi'ni ve ardından görünmez eli dengeleyen özgür bireyci doktrini takip eder {cite:usul-iqtisad-islami-0660 s. 72}. Özgür doktrinin üç unsura dayandığına inanır: üretim araçlarının özel mülkiyeti, serbest girişim ve göreli rekabet {cite:usul-iqtisad-islami-0660 s. 76}. Yazar, İslam'da özgürlüğün, bir kişinin kölelikten, zorlamadan, yoksulluktan, açlıktan, cehaletten ve korkudan kurtuluşudur ve her bireyin özgürlüğünün başkalarının özgürlüğünün başladığı yerde sona erdiğini belirtir {cite:usul-iqtisad-islami-0660 s. 37} {cite:usul-iqtisad-islami-0660 s. 38} {cite:usul-iqtisad-islami-0660 s. 78}. Kısıtlamaları arasında şunlar yer alır: tekel, tefecilik, dolandırıcılık, aldatma, arazi bozulması ve para biriktirme yasaklanması ve devletin satıcıları tekelleştirirse satmaya zorlayabileceği {cite:usul-iqtisad-islami-0660 s. 80} {cite:usul-iqtisad-islami-0660 s. 81}. Başarının yıkım değil, kalkınmada özgürlük ve zararda değil, fayda olduğu sonucuna varır {cite:usul-iqtisad-islami-0660 s. 82}. Yazar, ibadet ve inançların açık metinler gerektirdiğine, işlemlerin ise izin verilebilirliğe dayandığına, yasakların sınırlı ve ayrıntılı olduğuna, izin verilen şeylerin ise sınırsız olduğuna inanır. Düşünce okulları sözleşme özgürlüğü konusunda hemfikir ve koşulların özgürlüğü kapsamı konusunda farklılık gösterir; Hanbali bilgini bunları genişletir."
  id: "Penulis menelusuri istilah kebebasan ekonomi dari para naturalis di Prancis abad kedelapan belas, slogan mereka \"Biarkan ia bekerja, biarkan ia lewat,\" lalu Deklarasi Hak Asasi Manusia pada tahun 1789, dan kemudian doktrin individualis bebas yang melihat tangan tak terlihat sebagai penyeimbang {cite:usul-iqtisad-islami-0660 hlm. 72}. Ia percaya bahwa doktrin bebas didasarkan pada tiga elemen: kepemilikan pribadi atas alat produksi, usaha bebas, dan persaingan relatif {cite:usul-iqtisad-islami-0660 hlm. 76}. Penulis menyatakan bahwa kebebasan dalam Islam adalah pembebasan seseorang dari perbudakan, paksaan, kemiskinan, kelaparan, ketidaktahuan, dan ketakutan, dan bahwa kebebasan setiap orang berakhir di mana kebebasan orang lain dimulai {cite:usul-iqtisad-islami-0660 hlm. 37} {cite:usul-iqtisad-islami-0660 hlm. 38} {cite:usul-iqtisad-islami-0660 hlm. 78}. Di antara pembatasannya adalah: melarang monopoli, riba, penipuan, penipuan, penggangguan tanah, dan penimbunan uang, serta negara dapat memaksa penjual menjual jika mereka memonopoli {cite:usul-iqtisad-islami-0660 hlm. 80} {cite:usul-iqtisad-islami-0660 hlm. 81} Ia menyimpulkan bahwa kebebasan dalam pembangunan, bukan kehancuran, dan dalam manfaat, bukan dalam bahaya {cite:usul-iqtisad-islami-0660 hlm. 82}. Penulis percaya bahwa tindakan ibadah dan kepercayaan memerlukan teks eksplisit, sementara transaksi didasarkan pada diperbolehkan, dan larangan terbatas dan rinci, dan hal-hal yang diperbolehkan tidak terbatas. Aliran pemikiran sepakat tentang kebebasan kontrak dan berbeda dalam tingkat kebebasan kondisi, dengan sarjana Hanbali memperluasnya."
