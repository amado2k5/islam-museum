label:
  ar: الحرية الاقتصادية في الإسلام
  en: Economic freedom in Islam
summary:
  ar: 'يتتبع المؤلف مصطلح الحرية الاقتصادية من الطبيعيين في فرنسا في القرن الثامن عشر، وشعارهم «دعه يعمل دعه يمرّ»، ثم إعلان حقوق الإنسان سنة 1789م، ثم المذهب الفردي الحر الذي يرى أن اليد الخفية تحقق التوازن {cite:usul-iqtisad-islami-0660 p. 72}. ويرى أن المذهب الحر يقوم على ثلاثة عناصر: الملكية الخاصة لوسائل الإنتاج، والمشروع الحر، والمنافسة النسبية {cite:usul-iqtisad-islami-0660 p. 76}. ويقرر المؤلف أن الحرية في الإسلام تحرير للإنسان من الرق والإكراه والفقر والجوع والجهل والخوف، وأن حرية كل واحد تنتهي حيث تبدأ حرية غيره {cite:usul-iqtisad-islami-0660 p. 37} {cite:usul-iqtisad-islami-0660 p. 38} {cite:usul-iqtisad-islami-0660 p. 78}. ومن قيودها: منع الاحتكار والربا والغش والتغرير وتعطيل الأرض واكتناز المال، وأن للدولة أن تجبر الباعة على البيع إذا احتكروا {cite:usul-iqtisad-islami-0660 p. 80} {cite:usul-iqtisad-islami-0660 p. 81}. ويختم بأنها حرية في التعمير لا في التدمير، وفي النفع لا في الضرر {cite:usul-iqtisad-islami-0660 p. 82}.'
