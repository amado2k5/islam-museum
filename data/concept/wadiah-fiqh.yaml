id: concept/wadiah-fiqh
class: concept
kind: legal
label:
  ar: وَدِيعة
  en: Wadi'a (deposit)
summary:
  ar: 'الوديعة في اللغة ما استُودع، والجمع ودائع، وهي المال الموضوع عند الغير ليحفظه، وزاد الحنابلة: بلا عوض، والإيداع تسليط الغير على حفظ ماله، وزاد الحنابلة: تبرّعاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17054} وتتصل بالإعارة لأن اليد فيهما عند بعض الفقهاء يد أمانة، وبـاللقطة لأن يد الملتقط أثناء الحول يد أمانة، وتتميز عن الغصب، وهو أخذ الشيء ظلماً وقهراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17055} ومشروعيتها ثابتة بالسنة وبالإجماع في الجملة، وفي الحديث الأمر بأداء الأمانة إلى من ائتمن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17056} والخلاف في حكم الوديعة في بعض الأحوال: للمعتمد من القولين الكراهة لا الحرمة فيما ذُكر من صورة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17058} وفي حقيقتها قولان: الجمهور (المالكية والحنابلة والشافعية على الأصح) أنها عقد توكيل خاص، لأنها إقامة الغير مقام المودِع في الحفظ دون التصرف، والحنفية يعبّرون عنها بأنها عقد تسليط الغير على حفظ ماله صراحة أو دلالة، وبعض الشافعية يرى أنها مجرد إذن، فلا تكون وديعة بل أمانة شرعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17058}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17059} وإذا عزل المودِع نفسه، فعلى القول بأنها إذن يلغو العزل وتبقى الوديعة، وعلى القول بأنها عقد تنفسخ ويبقى المال أمانة شرعية يجب ردها عند التمكن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17059} وخصائص عقدها ثلاث: أنها جائزة من الجانبين، يستطيع كل منهما فسخها متى شاء، وأنها عقد أمانة لا عقد ضمان، والأصل فيها التبرع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17059}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17060}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17061} وأركانها عند الجمهور ثلاثة: الصيغة، والعاقدان، والمحل؛ وعند الحنفية الإيجاب والقبول، ويكفي فيهما الصريح والكناية والفعل والدلالة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17062}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17063} ولا أجرة للوديع على الحفظ إلا باشتراط أو عرف أو أن يكون ممن يتخذ الحفظ مهنة، والحنابلة يمنعون اشتراط العوض على الوديعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17062} وشرط المودِع الأهلية: العقل والتمييز عند الحنفية، والبلوغ والعقل والرشد عند الجمهور. فلا تصح وديعة المجنون والصبي غير العاقل، ويضمن الوديع إن قبلها منهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17064}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17066} وفي استيداع الصبي المميز أربعة أقوال، أولها للأكثر من المالكية والشافعية والحنابلة: أنه لا يصح استيداعه مميزاً أو غير مميز، لأن الحفظ مقصود ولا أهلية للصبي فيه، فلو تلفت عنده لم يضمن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17066} أما الصبي المميز فعند الحنفية يصح إيداعه إن كان مأذوناً له في التجارة، وعند ابن رشد يصح أن يكون وكيلاً أميناً، وعند ابن عرفة يجوز إذا ظُنّ صونه عنده.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17067}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17068} ويُشترط في العين المودعة عند الحنفية والمالكية أن تكون مالاً، فلا يصح إيداع الميتة والدم، وعند الشافعية والحنابلة أن تكون مالاً أو مختصاً، فلا يصح إيداع الخمر المحرّمة وآلات اللهو.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17069}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17070} وتصح عند جمهور الفقهاء إيداع الصكوك والوثائق، ويصح إيداع العقار عند الجمهور خلافاً لابن عرفة الذي اشترط كونها منقولة.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17070} والوديعة أمانة في يد الوديع، فلا ضمان عليه إلا بتعدٍّ أو تفريط، وهو قول جمهور الفقهاء، وعليه إجماع فقهاء الأمصار.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17071}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17072} وعند الحنفية يفرّق بين الوديعة بأجر وبغيره، فيضمن الوديع بالأجر ما يمكن التحرز منه، والمالكية والشافعية لا يفرّقون.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17072}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17073} ويبطل شرط الضمان على الأمين عند الجمهور، ويبطل عند الحنفية والشافعية شرط عدم الضمان عن التعدي.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17073}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17074} والقول قول الوديع في الهلاك مع يمينه عند جمهور الفقهاء، والشافعية والحنابلة يشترطون البينة على السبب الظاهر كالحريق والغرق، وعند المالكية يحلف المتهم وحده على المشهور.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17074}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17075} والقول قول الوديع في الرد مع يمينه عند جمهور الفقهاء، وعند المالكية تلزمه البينة إن كان قبضها بقصد التوثّق.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17075}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17076} والزوائد المتولدة من الوديعة لصاحبها، والنفقة عليه، فإن غاب ولم يأذن رفع الوديع الأمر إلى الحاكم، وللفقهاء في الإنفاق بغير إذن الحاكم ثلاثة أقوال، فالحنفية والشافعية لا يرجع الوديع فيما أنفق، والمالكية يرجع بما أنفق إذا ثبت بالبينة، والحنابلة يرجعون على تفصيل.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17076}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17077}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17078}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17079} ويجب على الوديع الحفظ في حرز المثل، فإن عيّن المالك حرزاً لم يجز النقل إلى ما دونه، وإن نقلها إلى مثله أو أحفظ منه فلا ضمان.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17079}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17080}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17125}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17126} وللوديع أن يحفظ الوديعة بنفسه أو بعياله الذين يحفظ عندهم ماله، ولا يودعها عند أجنبي إلا لعذر.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17081}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17093}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17094} وفي مدة حفظ الوديعة عند انقطاع خبر صاحبها أربعة أقوال: عند الحنفية يحفظها حتى يعلم موته أو حياته، وعند المالكية ينتظر بها أقصى ما يحيا مثله ثم تُدفع لورثته أو تُتصدّق عنه، وعند الشافعية تُحفظ أبداً أو تُعطى القاضي، وعند الحنابلة يجوز التصدق بها بنية غرمها.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17082}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17083} ويجب رد الوديعة فور طلبها، فإن أخّرها بغير عذر فتلفت ضمنها، والأعذار المسوّغة للتأخير كالليل وقضاء الحاجة وخشية الهلاك، وعند الحنفية تشمل الأعذار المعنوية كالخوف من ظالم.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17083}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17084} والرد يكون بالتخلية بين الوديعة ومالكها في مكان الإيداع دون حمل، ولا يلزم الوديع نقلها إلى دار المالك.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17087}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17088} وإذا مات الوديع ووجدت الوديعة بعينها في تركته فهي أمانة في يد الوارث يلزمه ردها، وإذا وجدت مكتوباً عليها أنها وديعة فللفقهاء قولان في وجوب التسليم بالخط وحده.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17088}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17089} وإتلاف الوديعة بغير إذن صاحبها محرّم وموجب للضمان باتفاق، ولو أمر المالك بإتلافها ففيه قولان، والأكثر على عدم الضمان، وتجويز رد بدلها من المثليات عند المالكية يسقط الضمان، وعند غيرهم لا يسقط.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17089}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17090}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17091}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17092} وإذا ضاعت الوديعة بسبب امتناع الوديع من نقلها من الحريق، ففيه قولان: الحنفية والحنابلة يضمنون، والشافعية لا يضمنون.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17092} وإيداع الوديعة عند غيره دون إذن المالك ولا عذر تعدّ يضمنه فيه جمهور الفقهاء، ويجوز الاستعانة بالغير في حملها وحفظها.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17092}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17093}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17094} وخلط الوديعة بغيرها إذا أمكن تمييزها فلا ضمان، وإذا تعذّر التمييز ضمن عند الحنفية والشافعية والحنابلة، وعند المالكية يضمن إذا خلطها بغير جنسها.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17094}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17095}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17096}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17097} والسفر بالوديعة يجوز بإذن المالك، وبغير إذنه يختلف الفقهاء في الضمان بحسب الخوف والحاجة وإمكان الرد.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17098}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17099}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17100} والتجارة بالوديعة بغير إذن تعدٍّ يوجب الضمان، واختلفوا في الربح على خمسة أقوال: لصاحب الوديعة، أو لبيت المال، أو يُتصدّق به، أو للوديع، أو يُقسم بينهما.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17100}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17101}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17102}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17103} والاستعمال بإذن المالك جائز، وبغير إذنه تعدٍّ يوجب الضمان ويلزم أجرة المثل عند المالكية والشافعية.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17104}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17105}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17106} والتصرف في الوديعة بالبيع أو الإجارة أو الرهن بغير إذن المالك تعدٍّ يوجب الضمان، وعند الحنفية يكون البيع فضولياً موقوفاً على الإجازة.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17109}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17110}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17111} وجحود الوديعة بعد طلب المالك يصيّر الوديع خائناً ضامناً عند الجمهور، وللحنفية سبعة شروط لذلك، وللشافعية استثناءات.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17112}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17113} وتضييع الوديعة، وترك تعهد الحيوان المودع، ونسيانها، وتجهيلها عند الموت، من موجبات الضمان عند بعض المذاهب، ويختلفون فيما إذا نهاه المالك.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17116}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17117}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17118}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17119}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17121}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17122} وينتهي عقد الإيداع بالموت أو الجنون أو عزل أحد الطرفين أو انتقال الملك أو الجحود، ويبقى المال بعدها أمانة شرعية يجب ردها.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17127}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17128}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17129}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17130} وإذا تنازعت الوديعة أكثر من جهة أو اختلف الوديع والمودِع في أصل الإذن أو صفة المقبوض، فللفقهاء قواعد مفصّلة في البينة واليمين والقسمة.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17133}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17134}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17135}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17136}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17137}'
  en: 'The deposit (wadi''a) is property placed with another to keep; the Hanbalis add: without return. Making someone a depositary is granting another custody of one''s property; the Hanbalis add: as a gift. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17054} It is close to the loan of use, since the hand in both is a trust for some jurists, and to found property, since the finder''s hand during the year is a trust; it differs from usurpation, which is seizing property by force and wrong. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17055} Its lawfulness rests on the sunna and on general consensus, and a report orders the return of trusts to their owner. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17056} On the ruling for some cases the text gives two opinions, prohibition and disapproval, and the printed preference is disapproval. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17058} On its nature there are two views: most jurists (Malikis, Hanbalis and, in the preferred view, Shafi''is) call it a restricted agency, since the depositary keeps but does not dispose; the Hanafis describe it as an express or implied grant to another of custody over one''s property; some Shafi''is call it a mere permission, which makes the holder a trustee rather than a depositary. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17058}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17059} If the depositor withdraws, on the permission view the withdrawal is void and the deposit stands; on the contract view the deposit ends and the property stays in hand as a trust that must be returned once possible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17059} Its three features: it is a contract either party may end at will, it is a trust contract rather than a guarantee, and it is gratuitous in origin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17059}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17060}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17061} The pillars are the formula, the two parties and the object according to most jurists; the Hanafis count an offer and an acceptance, which may be express, by allusion, or by act. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17062}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17063} The depositary may not charge for keeping unless agreed, customary, or a professional; the Hanbalis forbid stipulating a fee for the deposit itself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17062} Capacity for the depositor is discernment according to the Hanafis and full adulthood, sanity and good judgement according to most jurists; a deposit made by a child or an insane person is not valid, and the depositary who takes it bears liability. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17064}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17066} On a discerning child there are four views. Most Malikis, Shafi''is and Hanbalis hold that a child cannot be a depositary at all, so a loss in his hands brings no liability; the Hanafis allow a child licensed to trade; Ibn Rushd allows a discerning child to act as an agent; Ibn Arafa allows it when the holder expects him to keep it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17066}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17067}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17068} The object must be property for the Hanafis and Malikis, which excludes carrion and blood; for the Shafi''is and Hanbalis it must be property or specially owned, which excludes forbidden wine and instruments of play. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17069}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17070} Most jurists allow deeds and documents to be deposited, and most allow immovable property, against Ibn Arafa, who requires movables. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17070} The deposit is a trust in the depositary''s hand, so there is no liability without transgression or negligence, a view held by most jurists and reported as consensus by Ibn al-Mundhir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17071}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17072} For the Hanafis a paid depositary is liable for avoidable loss, while Malikis and Shafi''is make no such distinction. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17072}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17073} A stipulation that the depositary bears liability is void according to most jurists, and a stipulation that excludes liability for transgression is void for the Hanafis and Shafi''is. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17073}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17074} The depositary''s word on loss is accepted with his oath according to most jurists; the Shafi''is and Hanbalis require proof of an apparent cause such as fire or flood, while for the Malikis, in the preferred view, only an accused depositary swears. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17074}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17075} His word on return is accepted with his oath according to most jurists; for the Malikis he needs witnesses if he took the deposit as a security. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17075}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17076} The increase of a deposit belongs to its owner, by consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17076} Upkeep falls on the owner. When milk or fruit is at risk of spoiling, the Hanafis allow sale with the judge''s permission, and a sale without one is valid where no judge can be reached. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17077} When the owner is absent, the Hanafis and Shafi''is refer the matter to the judge, and the Hanbalis let the judge spend from the owner''s property or sell, rent or borrow for him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17077}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17078} On spending without the judge''s leave there are three views: the Hanafis and Shafi''is give no right of recovery, the Malikis allow recovery of proven costs, and the Hanbalis allow it under conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17078}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17079} The depositary must keep the deposit as he keeps his own property; where the owner has named a place he must keep it there, a lesser place makes him liable, and an equal or better place does not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17079}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17080} Where no place is named, he keeps it in a place customarily safe for such goods, and the standard varies with time and place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17080} The depositary may keep the deposit himself or with dependants whom he trusts with his own property; placing it with others is a transgression for most jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17081} When the owner has been absent for long, there are four views on how long to keep it: the Hanafis keep it until the owner''s death or life is known; the Malikis wait as long as such a person could live and then pass it to heirs or give it in charity; the Shafi''is keep it or hand it to the judge and, once hope is lost, to the public treasury; the Hanbalis allow charity with intent to guarantee repayment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17082}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17083} The deposit must be returned at once on demand; delay without excuse makes the depositary liable if it is lost. Recognised excuses include night, prayer, and a fear for one''s safety, which the Hanafis extend to moral threats. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17083}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17084} Return is made by letting the owner take the deposit where it lies, without carrying it to his house. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17087}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17088} If the depositary dies and the deposit is found in his estate, it is a trust in his heirs'' hands, which they must return to the owner. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17088}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17089} Destroying a deposit without the owner''s leave is forbidden and makes the depositary liable by consensus; if the owner ordered its destruction there are two views. Replacing a destroyed deposit does not remove liability for the Hanafis, Shafi''is and Hanbalis; the Malikis excuse fungible goods that are replaced in kind. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17089}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17090}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17091}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17092} Giving a deposit to a third party without leave or excuse is a transgression that makes the depositary liable, although some allow it for a trusted person when there is a real need. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17092}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17093}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17094} Mixing a deposit with other goods so that it can still be separated brings no liability; where separation is impossible or hard, the Hanafis, Shafi''is and Hanbalis hold the mixer liable, and the Malikis hold him liable when the goods differ in kind. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17094}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17095}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17096}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17097} Travel with the deposit is allowed with the owner''s leave; without it the jurists differ on liability according to safety, need and ability to return. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17098}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17099}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17100} Trading with the deposit without leave is a transgression that makes the depositary liable, and there are five views on the profit: to the owner, to the public treasury, to be given in charity, to the depositary, or to be shared between them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17100}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17101}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17102}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17103} Use with leave is lawful; use without leave is a transgression that brings liability and, for the Malikis and Shafi''is, payment of the customary hire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17104}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17105}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17106} Lending, renting, pledging or selling the deposit without leave is a transgression that brings liability; for the Hanafis a sale without leave stands only if the owner approves. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17109}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17110}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17111} Denial of a deposit after the owner''s demand makes the depositary a usurper and liable, and the Hanafis set seven conditions for this. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17112}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17113} Waste, neglect of an animal entrusted to him, forgetting the deposit, and failure to name it in a will when death is near can all bring liability, though the jurists differ on the detail. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17116}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17117}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17118}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17121}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17122} The contract ends by death or insanity of either party, by withdrawal or removal of the depositary, by transfer of the property, or by denial; the property then stays with the holder as a trust that must be returned. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17127}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17128}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17129}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17130} Disputes over the deposit cover whether a depositary may sue a usurper to recover it, and how several depositaries share custody and loss. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17131}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17132} Where the depositor and the depositary disagree on the terms of the deposit, on what was received, or on who owns a deposit claimed by two people, the jurists give rules on proof, oath and division. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17133}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17134}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17135}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17136}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17137}'
