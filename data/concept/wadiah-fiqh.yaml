label:
  ar: وَدِيعة
  en: Wadi'a (deposit)
summary:
  ar: 'الوديعة في اللغة ما استُودع، والجمع ودائع، وهي المال الموضوع عند الغير ليحفظه، وزاد الحنابلة: بلا عوض، والإيداع تسليط الغير على حفظ ماله، وزاد الحنابلة: تبرّعاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17054} وتتصل بالإعارة لأن اليد فيهما عند بعض الفقهاء يد أمانة، وبـاللقطة لأن يد الملتقط أثناء الحول يد أمانة، وتتميز عن الغصب، وهو أخذ الشيء ظلماً وقهراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17055} ومشروعيتها ثابتة بالسنة وبالإجماع في الجملة، وفي الحديث الأمر بأداء الأمانة إلى من ائتمن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17056} والخلاف في حكم الوديعة في بعض الأحوال: للمعتمد من القولين الكراهة لا الحرمة فيما ذُكر من صورة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17058} وفي حقيقتها قولان: الجمهور (المالكية والحنابلة والشافعية على الأصح) أنها عقد توكيل خاص، لأنها إقامة الغير مقام المودِع في الحفظ دون التصرف، والحنفية يعبّرون عنها بأنها عقد تسليط الغير على حفظ ماله صراحة أو دلالة، وبعض الشافعية يرى أنها مجرد إذن، فلا تكون وديعة بل أمانة شرعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17058}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17059} وإذا عزل المودِع نفسه، فعلى القول بأنها إذن يلغو العزل وتبقى الوديعة، وعلى القول بأنها عقد تنفسخ ويبقى المال أمانة شرعية يجب ردها عند التمكن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17059} وخصائص عقدها ثلاث: أنها جائزة من الجانبين، يستطيع كل منهما فسخها متى شاء، وأنها عقد أمانة لا عقد ضمان، والأصل فيها التبرع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17059}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17060}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17061} وأركانها عند الجمهور ثلاثة: الصيغة، والعاقدان، والمحل؛ وعند الحنفية الإيجاب والقبول، ويكفي فيهما الصريح والكناية والفعل والدلالة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17062}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17063} ولا أجرة للوديع على الحفظ إلا باشتراط أو عرف أو أن يكون ممن يتخذ الحفظ مهنة، والحنابلة يمنعون اشتراط العوض على الوديعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17062} وشرط المودِع الأهلية: العقل والتمييز عند الحنفية، والبلوغ والعقل والرشد عند الجمهور. فلا تصح وديعة المجنون والصبي غير العاقل، ويضمن الوديع إن قبلها منهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17064}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17066} وفي استيداع الصبي المميز أربعة أقوال، أولها للأكثر من المالكية والشافعية والحنابلة: أنه لا يصح استيداعه مميزاً أو غير مميز، لأن الحفظ مقصود ولا أهلية للصبي فيه، فلو تلفت عنده لم يضمن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17066}'
  en: 'The deposit (wadi''a) is property placed with another to keep; the Hanbalis add: without return. Making someone a depositary is granting another custody of one''s property; the Hanbalis add: as a gift. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17054} It is close to the loan of use, since the hand in both is a trust for some jurists, and to found property, since the finder''s hand during the year is a trust; it differs from usurpation, which is seizing property by force and wrong. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17055} Its lawfulness rests on the sunna and on general consensus, and a report orders the return of trusts to their owner. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17056} On the ruling for some cases the text gives two opinions, prohibition and disapproval, and the printed preference is disapproval. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17058} On its nature there are two views: most jurists (Malikis, Hanbalis and, in the preferred view, Shafi''is) call it a restricted agency, since the depositary keeps but does not dispose; the Hanafis describe it as an express or implied grant to another of custody over one''s property; some Shafi''is call it a mere permission, which makes the holder a trustee rather than a depositary. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17058}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17059} If the depositor withdraws, on the permission view the withdrawal is void and the deposit stands; on the contract view the deposit ends and the property stays in hand as a trust that must be returned once possible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17059} Its three features: it is a contract either party may end at will, it is a trust contract rather than a guarantee, and it is gratuitous in origin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17059}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17060}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17061} The pillars are the formula, the two parties and the object according to most jurists; the Hanafis count an offer and an acceptance, which may be express, by allusion, or by act. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17062}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17063} The depositary may not charge for keeping unless agreed, customary, or a professional; the Hanbalis forbid stipulating a fee for the deposit itself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17062} Capacity for the depositor is discernment according to the Hanafis and full adulthood, sanity and good judgement according to most jurists; a deposit made by a child or an insane person is not valid, and the depositary who takes it bears liability. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17064}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17066} On a discerning child there are four views; the first, held by most Malikis, Shafi''is and Hanbalis, is that a child cannot be a depositary at all, because the purpose is keeping and the child lacks the capacity for it, so a loss in his hands brings no liability. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17066}'
