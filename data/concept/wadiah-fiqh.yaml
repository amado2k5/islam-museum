id: concept/wadiah-fiqh
class: concept
kind: legal
tags: [akhlaq-browser, akhlaq-ariya]
label:
  ar: وَدِيعة
  en: Wadi'a (deposit)
  es: "Wadi'a (depósito)"
  fr: "Ouadi'a (dépôt)"
summary:
  ar: 'الوديعة في اللغة ما استُودع، والجمع ودائع، وهي المال الموضوع عند الغير ليحفظه، وزاد الحنابلة: بلا عوض، والإيداع تسليط الغير على حفظ ماله، وزاد الحنابلة: تبرّعاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17054} وتتصل بالإعارة لأن اليد فيهما عند بعض الفقهاء يد أمانة، وبـاللقطة لأن يد الملتقط أثناء الحول يد أمانة، وتتميز عن الغصب، وهو أخذ الشيء ظلماً وقهراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17055} ومشروعيتها ثابتة بالسنة وبالإجماع في الجملة، وفي الحديث الأمر بأداء الأمانة إلى من ائتمن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17056} والخلاف في حكم الوديعة في بعض الأحوال: للمعتمد من القولين الكراهة لا الحرمة فيما ذُكر من صورة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17058} وفي حقيقتها قولان: الجمهور ⁦(المالكية والحنابلة والشافعية على الأصح)⁩ أنها عقد توكيل خاص، لأنها إقامة الغير مقام المودِع في الحفظ دون التصرف، والحنفية يعبّرون عنها بأنها عقد تسليط الغير على حفظ ماله صراحة أو دلالة، وبعض الشافعية يرى أنها مجرد إذن، فلا تكون وديعة بل أمانة شرعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17058}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17059} وإذا عزل المودِع نفسه، فعلى القول بأنها إذن يلغو العزل وتبقى الوديعة، وعلى القول بأنها عقد تنفسخ ويبقى المال أمانة شرعية يجب ردها عند التمكن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17059} وخصائص عقدها ثلاث: أنها جائزة من الجانبين، يستطيع كل منهما فسخها متى شاء، وأنها عقد أمانة لا عقد ضمان، والأصل فيها التبرع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17059}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17060}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17061} وأركانها عند الجمهور ثلاثة: الصيغة، والعاقدان، والمحل؛ وعند الحنفية الإيجاب والقبول، ويكفي فيهما الصريح والكناية والفعل والدلالة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17062}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17063} ولا أجرة للوديع على الحفظ إلا باشتراط أو عرف أو أن يكون ممن يتخذ الحفظ مهنة، والحنابلة يمنعون اشتراط العوض على الوديعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17062} وشرط المودِع الأهلية: العقل والتمييز عند الحنفية، والبلوغ والعقل والرشد عند الجمهور. فلا تصح وديعة المجنون والصبي غير العاقل، ويضمن الوديع إن قبلها منهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17064}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17066} وفي استيداع الصبي المميز أربعة أقوال، أولها للأكثر من المالكية والشافعية والحنابلة: أنه لا يصح استيداعه مميزاً أو غير مميز، لأن الحفظ مقصود ولا أهلية للصبي فيه، فلو تلفت عنده لم يضمن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17066} أما الصبي المميز فعند الحنفية يصح إيداعه إن كان مأذوناً له في التجارة، وعند ابن رشد يصح أن يكون وكيلاً أميناً، وعند ابن عرفة يجوز إذا ظُنّ صونه عنده.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17067}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17068} ويُشترط في العين المودعة عند الحنفية والمالكية أن تكون مالاً، فلا يصح إيداع الميتة والدم، وعند الشافعية والحنابلة أن تكون مالاً أو مختصاً، فلا يصح إيداع الخمر المحرّمة وآلات اللهو.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17069}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17070} وتصح عند جمهور الفقهاء إيداع الصكوك والوثائق، ويصح إيداع العقار عند الجمهور خلافاً لابن عرفة الذي اشترط كونها منقولة.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17070} والوديعة أمانة في يد الوديع، فلا ضمان عليه إلا بتعدٍّ أو تفريط، وهو قول جمهور الفقهاء، وعليه إجماع فقهاء الأمصار.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17071}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17072} وعند الحنفية يفرّق بين الوديعة بأجر وبغيره، فيضمن الوديع بالأجر ما يمكن التحرز منه، والمالكية والشافعية لا يفرّقون.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17072}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17073} ويبطل شرط الضمان على الأمين عند الجمهور، ويبطل عند الحنفية والشافعية شرط عدم الضمان عن التعدي.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17073}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17074} والقول قول الوديع في الهلاك مع يمينه عند جمهور الفقهاء، والشافعية والحنابلة يشترطون البينة على السبب الظاهر كالحريق والغرق، وعند المالكية يحلف المتهم وحده على المشهور.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17074}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17075} والقول قول الوديع في الرد مع يمينه عند جمهور الفقهاء، وعند المالكية تلزمه البينة إن كان قبضها بقصد التوثّق.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17075}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17076} والزوائد المتولدة من الوديعة لصاحبها، والنفقة عليه، فإن غاب ولم يأذن رفع الوديع الأمر إلى الحاكم، وللفقهاء في الإنفاق بغير إذن الحاكم ثلاثة أقوال، فالحنفية والشافعية لا يرجع الوديع فيما أنفق، والمالكية يرجع بما أنفق إذا ثبت بالبينة، والحنابلة يرجعون على تفصيل.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17076}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17077}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17078}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17079} ويجب على الوديع الحفظ في حرز المثل، فإن عيّن المالك حرزاً لم يجز النقل إلى ما دونه، وإن نقلها إلى مثله أو أحفظ منه فلا ضمان.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17079}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17080}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17125}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17126} وللوديع أن يحفظ الوديعة بنفسه أو بعياله الذين يحفظ عندهم ماله، ولا يودعها عند أجنبي إلا لعذر.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17081}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17093}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17094} وفي مدة حفظ الوديعة عند انقطاع خبر صاحبها أربعة أقوال: عند الحنفية يحفظها حتى يعلم موته أو حياته، وعند المالكية ينتظر بها أقصى ما يحيا مثله ثم تُدفع لورثته أو تُتصدّق عنه، وعند الشافعية تُحفظ أبداً أو تُعطى القاضي، وعند الحنابلة يجوز التصدق بها بنية غرمها.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17082}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17083} ويجب رد الوديعة فور طلبها، فإن أخّرها بغير عذر فتلفت ضمنها، والأعذار المسوّغة للتأخير كالليل وقضاء الحاجة وخشية الهلاك، وعند الحنفية تشمل الأعذار المعنوية كالخوف من ظالم.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17083}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17084} والرد يكون بالتخلية بين الوديعة ومالكها في مكان الإيداع دون حمل، ولا يلزم الوديع نقلها إلى دار المالك.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17087}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17088} وإذا مات الوديع ووجدت الوديعة بعينها في تركته فهي أمانة في يد الوارث يلزمه ردها، وإذا وجدت مكتوباً عليها أنها وديعة فللفقهاء قولان في وجوب التسليم بالخط وحده.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17088}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17089} وإتلاف الوديعة بغير إذن صاحبها محرّم وموجب للضمان باتفاق، ولو أمر المالك بإتلافها ففيه قولان، والأكثر على عدم الضمان، وتجويز رد بدلها من المثليات عند المالكية يسقط الضمان، وعند غيرهم لا يسقط.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17089}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17090}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17091}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17092} وإذا ضاعت الوديعة بسبب امتناع الوديع من نقلها من الحريق، ففيه قولان: الحنفية والحنابلة يضمنون، والشافعية لا يضمنون.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17092} وإيداع الوديعة عند غيره دون إذن المالك ولا عذر تعدّ يضمنه فيه جمهور الفقهاء، ويجوز الاستعانة بالغير في حملها وحفظها.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17092}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17093}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17094} وخلط الوديعة بغيرها إذا أمكن تمييزها فلا ضمان، وإذا تعذّر التمييز ضمن عند الحنفية والشافعية والحنابلة، وعند المالكية يضمن إذا خلطها بغير جنسها.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17094}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17095}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17096}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17097} والسفر بالوديعة يجوز بإذن المالك، وبغير إذنه يختلف الفقهاء في الضمان بحسب الخوف والحاجة وإمكان الرد.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17098}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17099}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17100} والتجارة بالوديعة بغير إذن تعدٍّ يوجب الضمان، واختلفوا في الربح على خمسة أقوال: لصاحب الوديعة، أو لبيت المال، أو يُتصدّق به، أو للوديع، أو يُقسم بينهما.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17100}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17101}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17102}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17103} والاستعمال بإذن المالك جائز، وبغير إذنه تعدٍّ يوجب الضمان ويلزم أجرة المثل عند المالكية والشافعية.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17104}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17105}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17106} والتصرف في الوديعة بالبيع أو الإجارة أو الرهن بغير إذن المالك تعدٍّ يوجب الضمان، وعند الحنفية يكون البيع فضولياً موقوفاً على الإجازة.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17109}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17110}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17111} وجحود الوديعة بعد طلب المالك يصيّر الوديع خائناً ضامناً عند الجمهور، وللحنفية سبعة شروط لذلك، وللشافعية استثناءات.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17112}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17113} وتضييع الوديعة، وترك تعهد الحيوان المودع، ونسيانها، وتجهيلها عند الموت، من موجبات الضمان عند بعض المذاهب، ويختلفون فيما إذا نهاه المالك.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17116}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17117}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17118}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17119}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17121}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17122} وينتهي عقد الإيداع بالموت أو الجنون أو عزل أحد الطرفين أو انتقال الملك أو الجحود، ويبقى المال بعدها أمانة شرعية يجب ردها.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17127}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17128}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17129}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17130} وإذا تنازعت الوديعة أكثر من جهة أو اختلف الوديع والمودِع في أصل الإذن أو صفة المقبوض، فللفقهاء قواعد مفصّلة في البينة واليمين والقسمة.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17133}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17134}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17135}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17136}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17137}'
  en: 'The deposit (wadi''a) is property placed with another to keep; the Hanbalis add: without return. Making someone a depositary is granting another custody of one''s property; the Hanbalis add: as a gift. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17054} It is close to the loan of use, since the hand in both is a trust for some jurists, and to found property, since the finder''s hand during the year is a trust; it differs from usurpation, which is seizing property by force and wrong. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17055} Its lawfulness rests on the sunna and on general consensus, and a report orders the return of trusts to their owner. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17056} On the ruling for some cases the text gives two opinions, prohibition and disapproval, and the printed preference is disapproval. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17058} On its nature there are two views: most jurists (Malikis, Hanbalis and, in the preferred view, Shafi''is) call it a restricted agency, since the depositary keeps but does not dispose; the Hanafis describe it as an express or implied grant to another of custody over one''s property; some Shafi''is call it a mere permission, which makes the holder a trustee rather than a depositary. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17058}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17059} If the depositor withdraws, on the permission view the withdrawal is void and the deposit stands; on the contract view the deposit ends and the property stays in hand as a trust that must be returned once possible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17059} Its three features: it is a contract either party may end at will, it is a trust contract rather than a guarantee, and it is gratuitous in origin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17059}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17060}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17061} The pillars are the formula, the two parties and the object according to most jurists; the Hanafis count an offer and an acceptance, which may be express, by allusion, or by act. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17062}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17063} The depositary may not charge for keeping unless agreed, customary, or a professional; the Hanbalis forbid stipulating a fee for the deposit itself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17062} Capacity for the depositor is discernment according to the Hanafis and full adulthood, sanity and good judgement according to most jurists; a deposit made by a child or an insane person is not valid, and the depositary who takes it bears liability. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17064}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17066} On a discerning child there are four views. Most Malikis, Shafi''is and Hanbalis hold that a child cannot be a depositary at all, so a loss in his hands brings no liability; the Hanafis allow a child licensed to trade; Ibn Rushd allows a discerning child to act as an agent; Ibn Arafa allows it when the holder expects him to keep it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17066}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17067}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17068} The object must be property for the Hanafis and Malikis, which excludes carrion and blood; for the Shafi''is and Hanbalis it must be property or specially owned, which excludes forbidden wine and instruments of play. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17069}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17070} Most jurists allow deeds and documents to be deposited, and most allow immovable property, against Ibn Arafa, who requires movables. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17070} The deposit is a trust in the depositary''s hand, so there is no liability without transgression or negligence, a view held by most jurists and reported as consensus by Ibn al-Mundhir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17071}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17072} For the Hanafis a paid depositary is liable for avoidable loss, while Malikis and Shafi''is make no such distinction. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17072}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17073} A stipulation that the depositary bears liability is void according to most jurists, and a stipulation that excludes liability for transgression is void for the Hanafis and Shafi''is. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17073}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17074} The depositary''s word on loss is accepted with his oath according to most jurists; the Shafi''is and Hanbalis require proof of an apparent cause such as fire or flood, while for the Malikis, in the preferred view, only an accused depositary swears. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17074}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17075} His word on return is accepted with his oath according to most jurists; for the Malikis he needs witnesses if he took the deposit as a security. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17075}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17076} The increase of a deposit belongs to its owner, by consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17076} Upkeep falls on the owner. When milk or fruit is at risk of spoiling, the Hanafis allow sale with the judge''s permission, and a sale without one is valid where no judge can be reached. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17077} When the owner is absent, the Hanafis and Shafi''is refer the matter to the judge, and the Hanbalis let the judge spend from the owner''s property or sell, rent or borrow for him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17077}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17078} On spending without the judge''s leave there are three views: the Hanafis and Shafi''is give no right of recovery, the Malikis allow recovery of proven costs, and the Hanbalis allow it under conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17078}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17079} The depositary must keep the deposit as he keeps his own property; where the owner has named a place he must keep it there, a lesser place makes him liable, and an equal or better place does not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17079}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17080} Where no place is named, he keeps it in a place customarily safe for such goods, and the standard varies with time and place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17080} The depositary may keep the deposit himself or with dependants whom he trusts with his own property; placing it with others is a transgression for most jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17081} When the owner has been absent for long, there are four views on how long to keep it: the Hanafis keep it until the owner''s death or life is known; the Malikis wait as long as such a person could live and then pass it to heirs or give it in charity; the Shafi''is keep it or hand it to the judge and, once hope is lost, to the public treasury; the Hanbalis allow charity with intent to guarantee repayment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17082}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17083} The deposit must be returned at once on demand; delay without excuse makes the depositary liable if it is lost. Recognised excuses include night, prayer, and a fear for one''s safety, which the Hanafis extend to moral threats. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17083}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17084} Return is made by letting the owner take the deposit where it lies, without carrying it to his house. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17087}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17088} If the depositary dies and the deposit is found in his estate, it is a trust in his heirs'' hands, which they must return to the owner. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17088}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17089} Destroying a deposit without the owner''s leave is forbidden and makes the depositary liable by consensus; if the owner ordered its destruction there are two views. Replacing a destroyed deposit does not remove liability for the Hanafis, Shafi''is and Hanbalis; the Malikis excuse fungible goods that are replaced in kind. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17089}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17090}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17091}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17092} Giving a deposit to a third party without leave or excuse is a transgression that makes the depositary liable, although some allow it for a trusted person when there is a real need. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17092}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17093}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17094} Mixing a deposit with other goods so that it can still be separated brings no liability; where separation is impossible or hard, the Hanafis, Shafi''is and Hanbalis hold the mixer liable, and the Malikis hold him liable when the goods differ in kind. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17094}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17095}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17096}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17097} Travel with the deposit is allowed with the owner''s leave; without it the jurists differ on liability according to safety, need and ability to return. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17098}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17099}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17100} Trading with the deposit without leave is a transgression that makes the depositary liable, and there are five views on the profit: to the owner, to the public treasury, to be given in charity, to the depositary, or to be shared between them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17100}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17101}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17102}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17103} Use with leave is lawful; use without leave is a transgression that brings liability and, for the Malikis and Shafi''is, payment of the customary hire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17104}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17105}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17106} Lending, renting, pledging or selling the deposit without leave is a transgression that brings liability; for the Hanafis a sale without leave stands only if the owner approves. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17109}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17110}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17111} Denial of a deposit after the owner''s demand makes the depositary a usurper and liable, and the Hanafis set seven conditions for this. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17112}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17113} Waste, neglect of an animal entrusted to him, forgetting the deposit, and failure to name it in a will when death is near can all bring liability, though the jurists differ on the detail. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17116}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17117}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17118}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17121}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17122} The contract ends by death or insanity of either party, by withdrawal or removal of the depositary, by transfer of the property, or by denial; the property then stays with the holder as a trust that must be returned. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17127}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17128}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17129}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17130} Disputes over the deposit cover whether a depositary may sue a usurper to recover it, and how several depositaries share custody and loss. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17131}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17132} Where the depositor and the depositary disagree on the terms of the deposit, on what was received, or on who owns a deposit claimed by two people, the jurists give rules on proof, oath and division. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17133}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17134}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17135}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17136}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17137}'
  es: "El depósito (wadi'a) es la propiedad puesta con otra persona para su custodia; los hanbalíes añaden: sin devolución. Hacer a alguien depositario es otorgarle a otro la custodia de la propiedad de uno; los hanbalíes añaden: como un regalo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17054} Es similar al préstamo de uso, ya que la mano en ambos casos es un fideicomiso para algunos juristas, y a la propiedad encontrada, ya que la mano del hallador durante el año es un fideicomiso; difiere de la usurpación, que es apoderarse de la propiedad por la fuerza y de manera ilícita. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17055} Su licitud se basa en la sunna y en el consenso general, y un informe ordena la devolución de los fideicomisos a su dueño. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17056} Sobre el dictamen para algunos casos el texto da dos opiniones, prohibición y desaprobación, y la preferencia impresa es la desaprobación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17058} Sobre su naturaleza hay dos puntos de vista: la mayoría de los juristas (malikis, hanbalis y, en el punto de vista preferido, shafi'is) lo llaman una agencia restringida, ya que el depositario guarda pero no dispone; los hanafíes lo describen como una concesión expresa o implícita a otro de custodia sobre la propiedad de uno; algunos shafi'is lo llaman un mero permiso, lo que convierte al poseedor en un fideicomisario en lugar de un depositario. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17058}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17059} Si el depositante retira, en la visión del permiso el retiro es nulo y el depósito permanece; en la visión del contrato el depósito termina y la propiedad permanece en la mano como un fideicomiso que debe devolverse tan pronto como sea posible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17059} Sus tres características: es un contrato que cualquiera de las partes puede terminar a voluntad, es un contrato de fideicomiso en lugar de una garantía, y es gratuito en su origen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17059}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17060}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17061} Los pilares son la fórmula, las dos partes y el objeto según la mayoría de los juristas; Los Hanafis cuentan una oferta y una aceptación, que pueden ser expresas, por alusión o por acto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17062}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17063} El depositario no podrá cobrar por su conservación a menos que se acuerde, sea costumbre o sea un profesional; Los Hanbali prohíben estipular una tarifa por el depósito en sí. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17062} La capacidad del depositante es discernimiento según los Hanafis y plena adultez, cordura y buen juicio según la mayoría de los juristas; un depósito hecho por un niño o una persona demente no es válido, y el depositario que lo recibe tiene responsabilidad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17064}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17066} Sobre un niño discernidor hay cuatro puntos de vista. La mayoría de los Malikis, Shafi'is y Hanbalis sostienen que un niño no puede ser depositario en absoluto, por lo que una pérdida en sus manos no genera responsabilidad; los Hanafis permiten que un niño tenga licencia para comerciar; Ibn Rushd permite que un niño discernidor actúe como agente; Ibn Arafa lo permite cuando el poseedor espera que lo conserve. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17066}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17067}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17068} El objeto debe ser propiedad de los Hanafis y Malikis, lo que excluye la carroña y la sangre; para los Shafi'is y Hanbalis debe ser propiedad o propiedad especial, lo que excluye el vino y los instrumentos de juego prohibidos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17069}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17070} La mayoría de los juristas permiten que se depositen escrituras y documentos, y la mayoría permite bienes inmuebles, contra Ibn Arafa, quien requiere bienes muebles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17070} El depósito es un fideicomiso en manos del depositario, por lo que no hay responsabilidad sin transgresión o negligencia, una opinión sostenida por la mayoría de los juristas y reportada como consenso por Ibn al-Mundhir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17071}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17072} Para los hanafíes, un depositario pagado es responsable de la pérdida evitable, mientras que los malikíes y shafi'ís no hacen tal distinción. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17072}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17073} Una estipulación que hace que el depositario sea responsable es nula según la mayoría de los juristas, y una estipulación que excluye la responsabilidad por transgresión es nula para los Hanafis y Shafi'is. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17073}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17074} La palabra del depositario sobre la pérdida se acepta con su juramento según la mayoría de los juristas; los Shafi'is y Hanbalis requieren prueba de una causa aparente como incendio o inundación, mientras que para los Malikis, en la opinión preferida, solo jura un depositario acusado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17074}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17075} Su palabra al regresar es aceptada con su juramento según la mayoría de los juristas; para los malikíes necesita testigos si tomó el depósito como garantía. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17075}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17076} El aumento de un depósito pertenece a su dueño, por consenso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17076} El mantenimiento recae sobre el dueño. Cuando la leche o la fruta corren el riesgo de echarse a perder, los Hanafis permiten la venta con el permiso del juez, y una venta sin uno es válida cuando no se puede contactar al juez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17077} Cuando el propietario está ausente, los Hanafis y Shafi'is remiten el asunto al juez, y los Hanbalis permiten que el juez gaste de la propiedad del propietario o venda, alquile o pida prestado para él. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17077}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17078} Sobre el gasto sin el permiso del juez hay tres puntos de vista: los Hanafis y Shafi'is no dan derecho a recuperación, los Malikis permiten la recuperación de los costos probados, y los Hanbalis lo permiten bajo condiciones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17078}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17079} El depositario debe guardar el depósito como guarda su propia propiedad; cuando el propietario ha designado un lugar, debe guardarlo allí, un lugar menor lo hace responsable, y un lugar igual o mejor no. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17079}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17080} Cuando no se designa un lugar, lo guarda en un lugar usualmente seguro para tales bienes, y el estándar varía según el tiempo y el lugar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17080} El depositario puede conservar el depósito él mismo o con dependientes a quienes confía sus propios bienes; ponerlo con otros es una transgresión para la mayoría de los juristas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17081} Cuando el propietario ha estado ausente por mucho tiempo, hay cuatro puntos de vista sobre cuánto tiempo conservarlo: los hanafíes lo conservan hasta la muerte del propietario o se conoce su vida; los malikíes esperan mientras tal persona pueda vivir y luego lo pasan a los herederos o lo dan en caridad; los shafiíes lo conservan o lo entregan al juez y, una vez perdida la esperanza, al tesoro público; los hanbalíes permiten la caridad con la intención de garantizar el reembolso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17082}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17083} El depósito debe devolverse inmediatamente a petición; la demora sin justificación hace responsable al depositante si se pierde. Las excusas reconocidas incluyen la noche, la oración y el temor por la seguridad personal, que los Hanafis extienden a las amenazas morales. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17083}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17084} La devolución se realiza permitiendo que el propietario tome el depósito donde se encuentra, sin llevarlo a su casa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17087}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17088} Si el depositario muere y el depósito se encuentra en su patrimonio, es un fideicomiso en manos de sus herederos, quienes deben devolver al propietario. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17088}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17089} Destruir un depósito sin el permiso del propietario está prohibido y hace al depositario responsable por consenso; si el propietario ordenó su destrucción, hay dos puntos de vista. Reemplazar un depósito destruido no elimina la responsabilidad para los Hanafi, Shafi'i y Hanbali; los Malikis excusan los bienes fungibles que se reemplazan en especie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17089}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17090}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17091}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17092} Entregar un depósito a un tercero sin permiso ni excusa es una transgresión que hace responsable al depositante, aunque algunos lo permiten para una persona de confianza cuando hay una necesidad real. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17092}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17093}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17094} Mezclar un depósito con otros bienes de manera que aún pueda separarse no genera responsabilidad; cuando la separación es imposible o difícil, los hanafíes, shafi'ís y hanbalíes responsabilizan al mezclador, y los malikíes lo responsabilizan cuando los bienes difieren en especie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17094}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17095}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17096}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17097} Se permite viajar con el depósito con el permiso del propietario; sin él, los juristas difieren en cuanto a la responsabilidad según la seguridad, la necesidad y la capacidad de regresar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17098}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17099}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17100} Operar con el depósito sin permiso es una transgresión que hace responsable al depositario, y hay cinco puntos de vista sobre la ganancia: para el propietario, para el tesoro público, para ser dada en caridad, para el depositario o para ser compartida entre ellos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17100}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17101}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17102}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17103} El uso con permiso es lícito; el uso sin permiso es una transgresión que conlleva responsabilidad y, para los malikíes y shafiíes, el pago del alquiler habitual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17104}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17105}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17106} Prestar, alquilar, pignorar o vender el depósito sin permiso es una transgresión que conlleva responsabilidad; para los hanafíes, una venta sin permiso solo es válida si el propietario la aprueba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17109}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17110}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17111} La negación de un depósito después de la demanda del propietario convierte al depositario en un usurpador y responsable, y los Hanafis establecieron siete condiciones para esto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17112}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17113} El desperdicio, la negligencia de un animal confiado a él, el olvido del depósito y la falta de nombrarlo en un testamento cuando la muerte está cerca pueden generar responsabilidad, aunque los juristas difieren en el detalle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17116}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17117}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17118}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17121}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17122} El contrato termina por la muerte o la locura de cualquiera de las partes, por el retiro o la remoción del depositario, por la transferencia de la propiedad o por la negación; la propiedad entonces permanece con el titular como un fideicomiso que debe ser devuelto. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.17127}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.17128}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.17129}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.17130} Las disputas sobre el depósito cubren si un depositario puede demandar a un usurpador para recuperarlo y cómo varios depositarios comparten la custodia y la pérdida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17131}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17132} Cuando el depositante y el depositario no están de acuerdo sobre los términos del depósito, sobre lo que se recibió o sobre quién posee un depósito reclamado por dos personas, los juristas dan reglas sobre prueba, juramento y división. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.17133}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.17134}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.17135}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.17136}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.17137}"
  fr: "Le dépôt (wadi'a) consiste à confier un bien à une autre personne pour qu'elle le garde; les Hanbalites précisent: sans restitution. Nommer quelqu'un revient à lui confier la garde de ses biens; les Hanbalites ajoutent: à titre de donation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17054} Il est proche du prêt d'usage, car dans les deux cas, la main est considérée comme un dépôt fiduciaire par certains juristes, et de la propriété trouvée, car la main du découvreur durant l'année est considérée comme un dépôt fiduciaire; il diffère de l'usurpation, qui consiste à s'emparer d'un bien par la force et de manière illégale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17055} Sa licéité repose sur la sunna et sur le consensus général, et un hadith ordonne la restitution des biens déposés à leur propriétaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17056} Concernant la décision à prendre dans certains cas, le texte présente deux avis: l’interdiction et la désapprobation. L’avis majoritaire est celui de la désapprobation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17058} Quant à sa nature, deux points de vue s’affrontent: la plupart des juristes (malikites, hanbalites et, selon l’avis majoritaire, shafi’ites) la qualifient de mandat restreint, puisque le dépositaire conserve les biens sans pouvoir en disposer; les hanafites la décrivent comme une délégation expresse ou tacite de garde; certains shafi’ites la considèrent comme une simple permission, ce qui fait du détenteur un fiduciaire plutôt qu’un dépositaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17058}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17059} Si le déposant retire son dépôt, selon l'interprétation de la permission, le retrait est nul et le dépôt demeure valide; selon l'interprétation du contrat, le dépôt prend fin et le bien reste détenu en fiducie et doit être restitué dès que possible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17059} Ses trois caractéristiques: il s'agit d'un contrat que chaque partie peut résilier à son gré, il s'agit d'un contrat de fiducie plutôt que d'une garantie, et il est à titre gratuit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17059}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17060}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17061} Les piliers sont la formule, les deux parties et l'objet selon la plupart des juristes; les Hanafis comptent une offre et une acceptation, qui peuvent être expresses, par allusion ou par acte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17062}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17063} Le dépositaire ne peut facturer la conservation sauf accord, usage ou professionnel; les Hanbalis interdisent de stipuler des frais pour le dépôt lui-même. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17062} Selon l'école hanafite, la capacité du déposant repose sur le discernement, tandis que la plupart des juristes s'accordent sur la pleine majorité, la santé mentale et le bon jugement. Un dépôt effectué par un enfant ou une personne atteinte de troubles mentaux est invalide, et le dépositaire qui le reçoit en est responsable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17064}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17066} Concernant l'enfant capable de discernement, quatre avis divergent. La plupart des écoles malikite, chaféite et hanbalite considèrent qu'un enfant ne peut être dépositaire, et qu'une perte entre ses mains n'entraîne donc aucune responsabilité. L'école hanafite autorise un enfant titulaire d'une licence commerciale. Ibn Rushd autorise un enfant capable de discernement à agir comme mandataire. Ibn Arafa l'autorise lorsque le dépositaire s'attend à ce qu'il conserve les fonds. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17066}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17067}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17068} L'objet doit être la propriété des Hanafis et des Malikis, ce qui exclut les charognes et le sang; pour les Shafi'ites et les Hanbalis, il doit s'agir d'une propriété ou d'une propriété spéciale, ce qui exclut le vin et les instruments de jeu interdits. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17069}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17070} La plupart des juristes autorisent le dépôt d'actes et de documents, et la plupart autorisent les biens immobiliers, contre Ibn Arafa, qui exige des biens meubles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17070} Le dépôt est confié au dépositaire; par conséquent, sa responsabilité n'est engagée qu'en cas de faute ou de négligence, une opinion partagée par la plupart des juristes et rapportée comme consensus par Ibn al-Mundhir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17071}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17072} Pour les hanafites, un dépositaire rémunéré est responsable des pertes évitables, tandis que les malikites et les chaféites ne font pas une telle distinction. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17072}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17073} Selon la plupart des juristes, une clause stipulant la responsabilité du dépositaire est nulle, et selon les écoles hanafite et chaféite, une clause excluant la responsabilité en cas de transgression est nulle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17073}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17074} La parole du dépositaire en cas de perte est acceptée avec son serment selon la plupart des juristes; les chaféites et les hanbalites exigent la preuve d'une cause apparente telle qu'un incendie ou une inondation, tandis que pour les malikites, selon l'avis privilégié, seul le dépositaire mis en cause prête serment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17074}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17075} Selon la plupart des juristes, sa parole, une fois rendue, est acceptée avec son serment; pour les Malikites, il a besoin de témoins s’il a reçu le dépôt à titre de garantie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17075}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17076} L’accroissement d’un dépôt appartient à son propriétaire, par consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17076} Les frais d’entretien incombent au propriétaire. Lorsque le lait ou les fruits risquent de se gâter, les Hanafites autorisent leur vente avec l'accord du juge; une vente sans autorisation est valable lorsqu'aucun juge n'est joignable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17077} En cas d'absence du propriétaire, les Hanafites et les Shafi'ites renvoient l'affaire au juge, tandis que les Hanbalites autorisent ce dernier à dépenser sur les biens du propriétaire, à vendre, louer ou emprunter pour son compte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17077}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17078} Concernant les dépenses effectuées sans autorisation du juge, trois avis divergent: les Hanafites et les Shafi'ites n'accordent aucun droit de recouvrement; les Malikites autorisent le recouvrement des frais justifiés; et les Hanbalites l'autorisent sous certaines conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17078}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17079} Le dépositaire doit conserver le dépôt comme s'il conservait ses propres biens; si le propriétaire a désigné un lieu, il doit le conserver à cet endroit; un lieu moins sûr engage sa responsabilité, tandis qu'un lieu équivalent ou supérieur ne l'engage pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17079}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17080} En l'absence de lieu désigné, il conserve le dépôt dans un lieu habituellement sûr pour ce type de biens, et les normes varient selon le temps et le lieu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17080} Le dépositaire peut conserver le dépôt lui-même ou le confier à des personnes de confiance à qui il a confié ses propres biens; le confier à autrui est considéré comme une transgression par la plupart des juristes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17081} En cas d’absence prolongée du propriétaire, quatre avis divergent quant à la durée de conservation: les Hanafites le conservent jusqu’au décès du propriétaire ou jusqu’à ce que l’on connaisse sa vie; les Malikites attendent la durée de vie de la personne concernée, puis le transmettent aux héritiers ou le donnent en aumône; les Chafi’ites le conservent ou le remettent au juge et, en dernier recours, au trésor public; les Hanbalites autorisent le don en aumône avec l’intention de garantir le remboursement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17082}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17083} Le dépôt doit être restitué immédiatement sur demande; tout retard injustifié engage la responsabilité du dépositaire en cas de perte. Parmi les excuses reconnues figurent la nuit, la prière et la crainte pour sa sécurité, que les Hanafites étendent aux menaces morales. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17083}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17084} La restitution s'effectue en laissant le propriétaire reprendre le dépôt sur place, sans qu'il ait à le transporter à son domicile. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17087}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17088} Si le dépositaire décède et que le dépôt est retrouvé dans sa succession, il constitue un dépôt fiduciaire entre les mains de ses héritiers, qui doivent le restituer au propriétaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17088}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17089} La destruction d'un dépôt sans l'autorisation du propriétaire est interdite et engage la responsabilité du dépositaire par consensus; si le propriétaire a ordonné sa destruction, deux avis divergent. Le remplacement d'un dépôt détruit n'exonère pas de responsabilité pour les hanafites, les chaféites et les hanbalites; les malikites exonèrent les biens fongibles remplacés à l'identique. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17089}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17090}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17091}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17092} Confier un dépôt à un tiers sans autorisation ni excuse est une transgression qui rend le dépositaire responsable, bien que certains l'autorisent pour une personne de confiance lorsqu'il y a un réel besoin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17092}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17093}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17094} Le fait de mélanger un dépôt avec d'autres marchandises de manière à ce qu'il puisse encore être séparé n'entraîne aucune responsabilité; lorsque la séparation est impossible ou difficile, les Hanafites, les Shafi'ites et les Hanbalites tiennent le mélangeur responsable, et les Malikites le tiennent responsable lorsque les marchandises diffèrent par nature. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17094}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17095}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17096}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17097} Le voyage avec la caution est autorisé avec l'accord du propriétaire; sans elle, les juristes divergent sur la responsabilité en fonction de la sécurité, du besoin et de la capacité de retour. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17098}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17099}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17100} Le commerce avec le dépôt sans autorisation est une transgression qui rend le dépositaire responsable, et il existe cinq points de vue sur le profit: au propriétaire, au trésor public, à donner à une œuvre de charité, au dépositaire, ou à partager entre eux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17100}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17101}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17102}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17103} L'utilisation avec permission est licite; l'utilisation sans permission est une transgression qui entraîne une responsabilité et, pour les Malikites et les Shafi'ites, le paiement du loyer coutumier. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17104}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17105}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17106} Prêter, louer, nantir ou vendre le dépôt sans autorisation est une transgression qui entraîne une responsabilité; pour les Hanafites, une vente sans autorisation n'est valable que si le propriétaire l'approuve. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17109}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17110}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17111} Le refus d'un dépôt après la demande du propriétaire fait du dépositaire un usurpateur et l'engage à payer. Les hanafites ont établi sept conditions à cet effet. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17112}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17113} Le gaspillage, la négligence d'un animal confié, l'oubli du dépôt et l'omission de le mentionner dans un testament à l'approche de la mort peuvent tous engager la responsabilité du dépositaire, bien que les juristes divergent sur les modalités précises. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17116}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17117}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17118}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17121}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17122} Le contrat prend fin en cas de décès ou d'incapacité de l'une des parties, de retrait ou de révocation du dépositaire, de transfert de la propriété ou de refus; la propriété reste alors entre les mains du détenteur à titre de fiducie et doit être restituée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17127}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17128}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17129}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17130} Les litiges concernant le dépôt portent sur la question de savoir si un dépositaire peut poursuivre un usurpateur pour le récupérer et sur la manière dont plusieurs dépositaires partagent la garde et la perte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17131}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17132} Lorsque le déposant et le dépositaire sont en désaccord sur les conditions du dépôt, sur ce qui a été reçu ou sur qui est propriétaire d'un dépôt revendiqué par deux personnes, les juristes donnent des règles sur la preuve, le serment et le partage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17133}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17134}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17135}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17136}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17137}"
