summary:
  ar: "يوم الميزان في القرآن والسنة: اليوم الذي يوضع فيه الميزان لوزن الأعمال، يذكر أنه من أشراط الساعة، وأن فيه من الفزع ما لا يوصف، وأن الله يضع الميزان الحق."
  en: "The Day of the Scale in Qur'an and Sunnah: the day the Scale is set to weigh deeds — a sign of the Hour, a day of indescribable terror, when God sets up the true Scale."
  ur: "یوم میزان قرآن و سنت میں: وہ دن جب اعمال کے وزن کے لیے میزان رکھا جاتا ہے — ساعت کی نشانیوں میں سے، ایک ایسا دن جس کا خوف بیان نہیں کیا جا سکتا، جب اللہ سچا میزان رکھتا ہے۔"
