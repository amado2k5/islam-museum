id: concept/canon-foam-of-urine
class: concept
kind: scientific
label:
  ar: "زبد البول عند ابن سينا"
  en: "Foam of urine in the Canon"
  fr: "Écume urinaire dans le Canon"
  ur: "پیشاب کی جھاگ قانون میں"
  es: "Espuma de orina en el cañón"
  tr: "İbn Sina'ya göre idrar köpüğü"
  id: "Busa urin menurut Ibn Sina"
summary:
  ar: "يفتتح ابن سينا الفصل الخامس في الدلالات المأخوذة من زبد البول، فيذكر أصله من الريح في الماء، ودلالته بلونه وحجمه وقلته وكثرته ومكثه. {cite:canon-ibn-sina-print-v1 p.192}."
  en: "Ibn Sina opens chapter five on the signs taken from the foam of urine: its origin in wind within the liquid, and what its colour, size, amount and staying power show. {cite:canon-ibn-sina-print-v1 p.192}."
  fr: "Au chapitre 5, Ibn Sina examine l’écume urinaire, née de vents dans le liquide, et ses indices de couleur, volume, quantité et persistance. {cite:canon-ibn-sina-print-v1 p.192}."
  es: "Ibn Sina abre el capítulo cinco con los signos que se pueden observar en la espuma de la orina: su origen en el viento dentro del líquido, y lo que indican su color, tamaño, cantidad y persistencia. {cite:canon-ibn-sina-print-v1 p.192}."
  ur: "ابن سینا نے پانچویں باب کو پیشاب کے جھاگ سے لی گئی علامات پر کھولا ہے: اس کی اصل مائع کے اندر ہوا سے ہوتی ہے، اور اس کا رنگ، سائز، مقدار اور قیام کی طاقت کیا ہے۔ {حوالہ: کینن ابن سینا پرنٹ v1 صفحہ 192}۔"
  tr: "İbn Sina, beşinci bölümü idrar köpüğünden türetilen anlamlarla açar; suyun içindeki rüzgardan kaynaklandığı, rengi, boyutu, kıtlığı, bolluğu ve süresini belirtir. {atıf:kanon-ibn-sina-baskı-v1 s.192}."
  id: "Ibn Sina membuka bab kelima dengan makna yang berasal dari busa urin, menyebutkan asal-usulnya dari angin dalam air, warna, ukuran, kelangkaan, kelimpahan, dan durasi. {cite:canon-ibn-sina-print-v1 hlm.192}."
