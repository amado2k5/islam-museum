id: concept/tawidh-amulets-and-incantations
class: concept
kind: legal
label:
  ar: التعويذ
  en: Ta'widh (amulets and incantations)
  ur: تعویذ (منکے، دم اور تعویذ)
summary:
  ar: 'التعويذ لغة من العوذ أي الالتجاء، وهو الرقية أو ما يعاذ به، واصطلاحا يشمل الرقى والتمائم ونحوها مما هو مشروع وغير مشروع، والرقية أخص منه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533} والتمائم خيوط أو خرزات يعلقها العرب على الأولاد اتقاء العين، والودعة شيء أبيض يجلب من البحر يعلق للغرض نفسه، والتولة خرز أو تعويذ يقصد به تحبيب الزوجة أو الزوج، والنشرة رقية أو كتابة تغسل ويسقاها المريض، والرتيمة خيط يربط للتذكر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5534} وينقسم الحكم بحسب ما يتخذ منه التعويذ: ما لا يعرف معناه فجمهور الفقهاء على تحريمه، وحمل الوعيد في النهي على الاعتقاد بأن الخرزة تدفع الآفات، وما كان بكلام الله أو بأسمائه باللسان العربي المفهوم فجائز عند الجمهور بشرط الاعتقاد بأن التأثير من الله، وما كان بأسماء غير الله فمكروه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5535} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5536} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5537} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5538} وخالف الشعبي وسعيد بن جبير وقتادة وجماعة في الرقى فرأوا تركها أولى توكلا على الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5538} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5539} وفي النفث عند الرقى قال النووي إن العلماء أجمعوا على جوازه، واستحبه الجمهور، واستدلوا بما روي عن عائشة في نفث النبي بالمعوذات على أهله، وخالف إبراهيم وعكرمة والحكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5536} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5537} والنشرة جائزة عند جمهور الحنفية والشافعية والحنابلة، ومنعها ابن عبد السلام من المالكية والحسن وإبراهيم النخعي، ومنعها مجاهد في كتابة الآيات ثم غسلها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5537} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5538} والرتيمة للتذكر لا تكره عند ابن عابدين لأن لها غرضا صحيحا، وتكره عند آخرين لأنها عبث، والرتيمة بمعنى الخيط المعلق في العنق لدفع الضرر من الجاهلية منهي عنها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5538} والاستشفاء بالقرآن محل خلاف: فقيل شفاء للقلوب فقط، وقال جمهور الفقهاء إنه شفاء للأبدان بالرقية، فيقرأ على المريض ويتحرى المناسب، ويستدل بخبر أبي سعيد الخدري في الفاتحة وأجرة الرقية. وأنكر ابن حجر الخبر الذي فيه ترك الرقى إلا بالمعوذات، وبين أن الاستعاذة والاستعانة بالله مشروعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5540} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5541} ويجوز الاستشفاء بالأدعية والأذكار المأثورة، كما في خبر عثمان بن أبي العاص في وضع اليد على موضع الألم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5541} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5542} وأما التولة فحرام عند الحنفية، لأنها سحر، وقال ابن رسلان من الشافعية إن ما يتحبب به من كلام مباح أو زينة أو مأكول لا يعتقد فيه إلا الخاصية بتقدير الله فالظاهر جوازه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5542} والعين حق عند جمهور العلماء، ويصيب المال والإنسان والحيوان، وأنكر بعض الطبائعيين والمبتدعة ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5542} ومن وقاية العين قراءة الأدعية والآيات، وأن يبرك العائن على ما أعجبه، واسترقاء العين، وأن يؤمر العائن بالوضوء ثم يغتسل منه المعين. وعرف ابن بطال وجوب تجنب المعروف بالإصابة، وقال النووي إنه القول الصحيح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5544} وكان أهل الجاهلية يعلقون التمائم ويظنون أنها تدفع البلاء، فأبطلها الإسلام، ونهى عنها بالأحاديث في التميمة والودعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5544} وتعليق الخرز والخيوط والعظام على الإنسان حرام، وتعليق ما كتب فيه الرقى المجهولة حرام، وتعليق القرآن والأدعية المأثورة مختلف فيه، فجوزه عبد الله بن عمرو بن العاص وأحمد في رواية، ومنعه ابن مسعود وابن عباس وحذيفة وعقبة بن عامر وابن حكيم وجمع من التابعين وأحمد في رواية، سدا للذريعة، وشرط المجيزون أن يكون في قصبة أو رقعة، وألا يحمل عند الجماع والغائط، وألا يكون لدفع بلاء قبل وقوعه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5545} وتعليق التعويذ على الحيوان الطاهر يكره، وعلى النجس حرام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5545} ويرى القائلون بالجواز أنه لا بأس بتعليق التعويذ على الجنب والحائض إذا كان ملفوفا أو مخروزا بأديم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5546} ورقية الكافر للمسلم مختلف فيها: جوزها الحنفية والشافعي ورواية عن مالك بالقرآن وذكر الله، وكرهها مالك في رواية، ورقية المسلم للكافر جائزة بالاتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5546} وأخذ الأجرة على التعاويذ والرقى جائز عند جمهور الفقهاء، وكرهه الزهري على القرآن مطلقا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5546}'
  en: 'Ta''widh is in language from ''udha, to seek refuge, a charm or what one seeks protection by; in law it covers incantations (ruqa) and amulets (tamima) and the like, lawful and unlawful, and ruqya is narrower. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533} A tamima is a thread or beads hung on children against the evil eye; a wadi''a is a white object from the sea hung for the same purpose; a tawla is an object meant to make a wife or husband fond; a nushra is an incantation or writing washed and given to drink; a ratima is a thread tied to remember a need. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5534} The ruling depends on the material: charms in an unknown tongue are forbidden by most jurists, and the warning in the reports is read as applying to belief that the bead averts harm. Charms of God''s words or names in Arabic that can be understood are allowed by most, on condition that the power is God''s. Charms with names other than God''s are disliked. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5535} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5536} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5537} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5538} Al-Sha''bi, Sa''id ibn Jubayr, Qatada and others disliked incantation as a matter of trust in God. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5538} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5539} On breathing over the sick during incantation, al-Nawawi reports agreement that it is allowed and most recommend it; others such as Ibrahim and Ikrima dissent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5536} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5537} The nushra is allowed by most Hanafis, Shafiis and Hanbalis; Ibn Abd al-Salam among the Malikis, al-Hasan and al-Nakha''i forbid it, and Mujahid disliked writing verses and washing them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5537} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5538} The ratima for memory is not disliked by Ibn Abidin, and disliked by others as idle; the ratima hung on the neck in the time of ignorance is forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5538} Healing by the Qur''an is disputed: some say it is healing of hearts only, while most jurists permit reciting it over the sick, choosing a suitable passage; a report of Abu Sa''id al-Khudri on the Opening chapter and a fee is cited, and Ibn Hajar discusses the report that only the protective surahs may be used. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5540} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5541} Healing by approved prayers and remembrance is allowed by agreement, as in the report of Uthman ibn Abi al-As with the hand on the place of pain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5541} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5542} The tawla is forbidden by the Hanafis as a form of sorcery; Ibn Rislan of the Shafiis thought an object with permitted speech or food, believed to have a property by God''s decree, is allowed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5542} Most scholars hold the evil eye real and able to harm property, people and animals; some naturalists and innovators denied it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5542} Protection from the evil eye includes reciting prayers, the one who admires blessing what he admires, seeking a cure by incantation, and ordering the one who causes the evil eye to wash, the victim then bathing in the water; Ibn Battal said a known eye-striker should be restrained, which Nawawi calls the sound view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5544} The people of ignorance hung amulets for protection, which Islam abolished in the reports on the tamima and the wadi''a. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5544} Hanging beads, threads or bones on a person is forbidden. Hanging writing of unknown charms is forbidden. Hanging Qur''an or approved prayers is disputed: allowed by Abd Allah ibn Amr ibn al-As and one view of Ahmad; forbidden by Ibn Mas''ud, Ibn Abbas, Hudhayfa, Uqba ibn Amir, Ibn Hakim, many Successors and one view of Ahmad, to block the means. Those who allow it require it to be in a tube or on a strip, not worn during intercourse or relief, and only after the harm has come. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5544} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5545} Hanging an amulet on a clean animal is disliked; on an unclean one it is forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5545} Those who allow amulets see no harm in a junub or menstruating woman wearing one that is wrapped or sewn in leather. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5546} Whether a non-Muslim may recite over a Muslim is disputed: the Hanafis, al-Shafi''i and one view of Malik allow it with the Qur''an and the name of God, while Malik in another view disliked it. A Muslim reciting over a non-Muslim is allowed by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5546} Taking a fee for amulets and incantations is allowed by most jurists; al-Zuhri disliked it for the Qur''an in all cases. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5546}'
  ur: 'تعویذ لغت میں عوذ سے ہے یعنی پناہ لینا، جس سے پناہ مانگی جائے وہ عوذہ یا تعویذ۔ اصطلاح میں یہ دم، تمیمہ وغیرہ سب کو شامل ہے، جائز بھی اور ناجائز بھی، اور رقیہ اس سے خاص ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533} تمیمہ دھاگے یا منکے ہیں جو بچوں کو نظر سے بچانے کے لیے لٹکائے جاتے تھے، ودعہ سمندر کی ایک سفید چیز اسی مقصد سے، تولہ محبت پیدا کرنے کے لیے، نشرہ دم یا تحریر جسے دھو کر مریض کو پلایا جائے، اور رتیمہ یاد رکھنے کے لیے انگلی میں باندھا جانے والا دھاگہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5533} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5534} حکم چیز کے مطابق بدلتا ہے: جس کا معنی معلوم نہ ہو اسے جمہور ناجائز کہتے ہیں، اور وعید کو اس اعتقاد پر محمول کرتے ہیں کہ منکا آفات کو دفع کرتا ہے۔ اللہ کے کلام یا اسماء سے عربی میں جو سمجھ میں آئے وہ جمہور کے نزدیک جائز ہے، شرط یہ کہ تاثیر اللہ کی طرف سے ہو۔ غیر اللہ کے ناموں سے دم مکروہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5535} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5536} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5537} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5538} شعبی، سعید بن جبیر اور قتادہ وغیرہ نے دم کو توکل کے خلاف جان کر ترک کو بہتر کہا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5538} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5539} دم کے وقت پھونکنے پر امام نووی کہتے ہیں کہ اس کے جواز پر اتفاق ہے، اور جمہور مستحب کہتے ہیں، جبکہ ابراہیم، عکرمہ اور حکم اس کے مخالف ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5536} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5537} نشرہ حنفیہ، شافعیہ اور حنابلہ کے جمہور کے نزدیک جائز ہے، ابن عبد السلام (مالکی)، حسن اور نخعی منع کرتے ہیں، اور مجاہد نے آیات لکھ کر دھونے کو ناپسند کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5537} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5538} یاد کے لیے رتیمہ ابن عابدین کے نزدیک مکروہ نہیں، اور دوسروں کے نزدیک عبث ہونے کی وجہ سے مکروہ ہے، اور زمانہ جاہلیت کا گلے میں ڈالا گیا دھاگہ منع ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5538} قرآن سے شفا میں اختلاف ہے: بعض کے نزدیک یہ دلوں کی شفا ہے، جبکہ جمہور مریض پر پڑھنے کو جائز کہتے ہیں، سورۃ الفاتحہ اور اجرت کی روایت ابو سعید خدری سے نقل کی جاتی ہے، اور ابن حجر نے اس روایت کا جواب دیا جس میں صرف معوذات کا ذکر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5540} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5541} ماثور دعاؤں اور اذکار سے شفا بالاتفاق جائز ہے، جیسے عثمان بن ابی العاص کی روایت میں تکلیف والی جگہ پر ہاتھ رکھنا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5541} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5542} حنفیہ کے نزدیک تولہ حرام ہے کیونکہ یہ جادو ہے؛ شافعیہ کے ابن رسلان کے نزدیک مباح کلام، زینت یا کھانے کی چیز جس کے بارے میں یہ اعتقاد نہ ہو کہ وہ بذات خود اثر کرتی ہے، جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5542} جمہور علماء کے نزدیک نظر لگنا حق ہے، اور یہ مال، انسان اور جانور کو لگتی ہے، جبکہ بعض طبیعیین اور بدعتیوں نے اس کا انکار کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5542} نظر سے بچاؤ کے طریقے: دعائیں اور آیات پڑھنا، نظر لگانے والے کا برکت کی دعا کرنا، دم کروانا، اور نظر لگانے والے کو وضو کرکے اس پانی سے غسل دینے کا حکم؛ ابن بطال کے مطابق معروف نظر لگانے والے کو روکا جائے، اور نووی نے اسے صحیح قول کہا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5544} زمانہ جاہلیت کے لوگ تمائم لٹکاتے تھے، اسلام نے انہیں باطل کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5544} انسان پر منکے، دھاگے یا ہڈیاں لٹکانا حرام ہے، اور مجہول دم لکھ کر لٹکانا حرام۔ قرآن یا ماثور دعائیں لٹکانے میں اختلاف ہے: عبد اللہ بن عمرو بن العاص اور احمد کی ایک روایت جائز کہتی ہے، جبکہ ابن مسعود، ابن عباس، حذیفہ، عقبہ بن عامر، ابن حکیم اور بہت سے تابعین، اور احمد کی ایک روایت، ذریعہ بند کرنے کے لیے منع کرتے ہیں۔ جواز کے قائل شرط لگاتے ہیں کہ وہ نلکی یا پرچی میں ہو، جماع اور رفع حاجت کے وقت نہ اٹھایا جائے، اور بلا آنے سے پہلے نہ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5544} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5545} پاک جانور پر تعویذ لٹکانا مکروہ ہے اور نجس جانور پر حرام۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5545} جواز کے قائل جنبی اور حائضہ کے لیے ایسے تعویذ میں حرج نہیں سمجھتے جو لپیٹا گیا ہو یا چمڑے میں سلا گیا ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5546} کافر کا مسلمان پر دم کرنا مختلف فیہ ہے: حنفیہ، شافعی اور مالک کی ایک روایت کے مطابق قرآن اور اللہ کے ذکر سے جائز ہے، جبکہ مالک کی ایک روایت میں ناپسند ہے۔ مسلمان کا کافر پر دم کرنا بالاتفاق جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5546} تعویذ اور دم پر اجرت لینا جمہور فقہاء کے نزدیک جائز ہے، اور زہری نے قرآن پر اجرت کو مطلقاً مکروہ کہا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5546}'
