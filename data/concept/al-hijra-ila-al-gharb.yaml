label:
  ar: "الهجرة إلى الغرب — أمل أم ألم (هجرة العقول)"
  en: "Emigration to the West — hope or pain (the brain drain)"
issue:
  ar: "هل الهجرة إلى الغرب حل أم مشكلة، وما حجم هجرة الكفاءات العربية، وكيف توقف النزيف؟"
summary:
  ar: "حلقة «الوسطية» عن الهجرة إلى الغرب. صوّت الشباب: 34% يقبلون الهجرة فوراً و26% يترددون و40% لا يقبلون؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 00:09:00} و84% يرون الظاهرة كبيرة وخطيرة. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 00:38:00} وأرقام عرضها المقدم: 54% من المبعوثين لا يعودون، و50% من الأطباء و29% من المهندسين؛ و75% من الفئة العلمية في المهاجرين إلى أمريكا. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 00:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 00:16:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 00:17:00} وخلُص المتحاورون إلى أن 2 مليون كفاءة تهاجر سنوياً — والأمم يطوّرها 1-2% — والحل بيئة جاذبة: حكم رشيد وحقوق إنسان ودولة قانون ورفاه. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 01:17:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 01:17:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 01:18:00}"
  en: "The 'Al-Wasatiyya' episode on emigration to the West. The youth voted: 34% would emigrate immediately, 26% would hesitate, 40% would not; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 00:09:00} and 84% saw the phenomenon as large and dangerous. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 00:38:00} The host's figures: 54% of scholarship students never return, 50% of doctors and 29% of engineers; and 75% of the scientist class among migrants to America. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 00:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 00:16:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 00:17:00} The panel concluded that 2 million high-skilled leave yearly — while nations are developed by their 1-2% — and the cure is an attracting environment: good governance, human rights, rule of law and a welfare state. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 01:17:00} {cite:assabile-tareq-al-suwaidan/al-wassitiya/ep11 01:17:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 01:18:00}"
