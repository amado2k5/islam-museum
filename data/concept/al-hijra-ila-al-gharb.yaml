id: concept/al-hijra-ila-al-gharb
class: concept
kind: social
label:
  ar: "الهجرة إلى الغرب — أمل أم ألم ⁦(هجرة العقول)⁩"
  en: "Emigration to the West — hope or pain (the brain drain)"
  fr: "L'émigration vers l'Occident : espoir ou douleur (la fuite des cerveaux)"
  es: "La emigración a Occidente: ¿esperanza o sufrimiento? (la fuga de cerebros)"
  ur: "مغرب کی طرف ہجرت - امید یا درد ⁦(دماغ کی نالی)⁩"
issue:
  ar: "هل الهجرة إلى الغرب حل أم مشكلة، وما حجم هجرة الكفاءات العربية، وكيف توقف النزيف؟"
summary:
  ar: "حلقة «الوسطية» عن الهجرة إلى الغرب. صوّت الشباب: 34% يقبلون الهجرة فوراً و26% يترددون و40% لا يقبلون؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 00:09:00} و84% يرون الظاهرة كبيرة وخطيرة. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 00:38:00} وأرقام عرضها المقدم: 54% من المبعوثين لا يعودون، و50% من الأطباء و29% من المهندسين؛ و75% من الفئة العلمية في المهاجرين إلى أمريكا. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 00:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 00:16:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 00:17:00} وخلُص المتحاورون إلى أن 2 مليون كفاءة تهاجر سنوياً — والأمم يطوّرها 1-2% — والحل بيئة جاذبة: حكم رشيد وحقوق إنسان ودولة قانون ورفاه. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 01:17:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 01:17:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 01:18:00}"
  en: "The 'Al-Wasatiyya' episode on emigration to the West. The youth voted: 34% would emigrate immediately, 26% would hesitate, 40% would not; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 00:09:00} and 84% saw the phenomenon as large and dangerous. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 00:38:00} The host's figures: 54% of scholarship students never return, 50% of doctors and 29% of engineers; and 75% of the scientist class among migrants to America. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 00:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 00:16:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 00:17:00} The panel concluded that 2 million high-skilled leave yearly — while nations are developed by their 1-2% — and the cure is an attracting environment: good governance, human rights, rule of law and a welfare state. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 01:17:00} {cite:assabile-tareq-al-suwaidan/al-wassitiya/ep11 01:17:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 01:18:00}"
  fr: "L'épisode d'« Al-Wasatiyya » sur l'émigration vers l'Occident. Les jeunes ont voté : 34 % émigreraient immédiatement, 26 % hésiteraient, 40 % ne le feraient pas ; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 00:09:00} et 84 % jugeaient le phénomène important et dangereux. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 00:38:00} Les chiffres du présentateur : 54 % des boursiers ne reviennent jamais, de même que 50 % des médecins et 29 % des ingénieurs ; et 75 % de la catégorie scientifique parmi les migrants vers l'Amérique. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 00:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 00:16:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 00:17:00} Les intervenants ont conclu que 2 millions de personnes hautement qualifiées partent chaque année, alors que les nations se développent grâce à leurs 1 à 2 %, et que le remède est un environnement attractif : bonne gouvernance, droits de l'homme, État de droit et État-providence. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 01:17:00} {cite:assabile-tareq-al-suwaidan/al-wassitiya/ep11 01:17:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 01:18:00}"
  es: "El episodio de 'Al-Wasatiyya' sobre la emigración a Occidente. Los jóvenes votaron: el 34% emigraría inmediatamente, el 26% dudaría, el 40% no lo haría; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 00:09:00} y el 84% vio el fenómeno como grande y peligroso. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 00:38:00} Las cifras del presentador: el 54% de los estudiantes becados nunca regresan, el 50% de los médicos y el 29% de los ingenieros; y el 75% de la clase científica entre los migrantes a América. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 00:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 00:16:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep11 00:17:00} El panel concluyó que 2 millones de profesionales altamente cualificados se marchan cada año —mientras que las naciones se desarrollan gracias a su 1-2%— y la solución es un entorno atractivo: buena gobernanza, derechos humanos, estado de derecho y un estado de bienestar. {cita:assabile-tareq-al-suwaidan al-wassitiya/ep11 01:17:00} {cita:assabile-tareq-al-suwaidan/al-wassitiya/ep11 01:17:30} {cita:assabile-tareq-al-suwaidan al-wassitiya/ep11 01:18:00}"
  ur: "مغرب کی طرف ہجرت پر 'الوصطیہ' کا واقعہ۔ نوجوانوں نے ووٹ دیا: 34% فوری طور پر ہجرت کریں گے، 26% جھجکیں گے، 40% نہیں کریں گے۔ {حوالہ:اسابیل-طارق-السویدان الوسیطیہ/ep11 00:09:00} اور 84% نے اس رجحان کو بڑا اور خطرناک دیکھا۔ {حوالہ:assabile-tareq-al-suwaidan al-wasitiya/ep11 00:38:00} میزبان کے اعداد و شمار: 54% اسکالرشپ طلبا کبھی واپس نہیں آتے، 50% ڈاکٹرز اور 29% انجینئرز؛ اور 75% سائنس دانوں کی کلاس امریکہ جانے والوں میں۔ {حوالہ:اسابیل-طارق-السویدان الوسیطیہ/ایپ11 00:16:00} {حوالہ:اسابیل-طارق-السویدان الوسیطیہ/ایپ11 00:16:30} {حوالہ:اسابیل-طارق-السویدان الصویتیہ:00:16:00} یہ نتیجہ اخذ کیا کہ 2 ملین اعلی ہنر مند سالانہ چھٹی - جب کہ قومیں ان کے 1-2٪ سے ترقی کرتی ہیں - اور علاج ایک پرکشش ماحول ہے: اچھی حکمرانی، انسانی حقوق، قانون کی حکمرانی اور ایک فلاحی ریاست۔ {حوالہ:اسابیل-طارق-السویدان الوسیطیہ/ایپ11 01:17:00} {حوالہ:اسابیل-طارق-السویدان/ال-وصیتیہ/ایپ11 01:17:30} {حوالہ:اصابیل-طارق-السویطان الوسیع:10/10}"
