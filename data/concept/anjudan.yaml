id: concept/anjudan
class: concept
kind: natural
label:
  ar: "أنجدان"
  en: "Anjudan (ferula-like resin plant)"
  fr: "Anjudan (plante résineuse semblable à la férule)"
  ur: "انجدان"
  es: "Anjudan (planta de resina parecida a una férula)"
summary:
  ar: "أنجدان أبيض وأسود، والأسود أقوى ولا يدخل في الأغذية؛ ملطّف، ينفع من الدبيلات الباطنة والخنازير وأوجاع المفاصل، ويفتّق الشهوة {cite:canon-ibn-sina-print-v1 p.358} {cite:canon-ibn-sina-print-v1 p.359}."
  en: "Anjudan comes in white and black kinds; the black is stronger and not used in foods. It thins, helps inner abscesses, scrofula and joint pains, and sharpens appetite {cite:canon-ibn-sina-print-v1 p.358} {cite:canon-ibn-sina-print-v1 p.359}."
  fr: "Le livre distingue une variété blanche et une noire ; la noire est plus forte et n’entre pas dans les aliments. La plante aurait une action atténuante, soulagerait les abcès internes, les écrouelles et les douleurs articulaires, et aiguiserait l’appétit {cite:canon-ibn-sina-print-v1 p.358} {cite:canon-ibn-sina-print-v1 p.359}."
  ur: "انجدان سفید اور سیاہ دو قسم کا ہے؛ سیاہ زیادہ طاقتور ہے اور غذا میں استعمال نہیں ہوتا۔ یہ لطیف کرتا، اندرونی پھوڑوں، غدود کی سوجن اور جوڑوں کے درد میں مفید ہے، اور بھوک بڑھاتا ہے {cite:canon-ibn-sina-print-v1 p.358} {cite:canon-ibn-sina-print-v1 p.359}۔"
  es: "Anjudan se presenta en variedades blanca y negra; la negra es más fuerte y no se utiliza en alimentos. Tiene propiedades fluidificantes, ayuda con abscesos internos, escrófula y dolores articulares, y estimula el apetito {cite:canon-ibn-sina-print-v1 p.358} {cite:canon-ibn-sina-print-v1 p.359}."
