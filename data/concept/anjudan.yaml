summary:
  ar: "أنجدان أبيض وأسود، والأسود أقوى ولا يدخل في الأغذية؛ ملطّف، ينفع من الدبيلات الباطنة والخنازير وأوجاع المفاصل، ويفتّق الشهوة {cite:canon-ibn-sina-print-v1 p.358} {cite:canon-ibn-sina-print-v1 p.359}."
  en: "Anjudan comes in white and black kinds; the black is stronger and not used in foods. It thins, helps inner abscesses, scrofula and joint pains, and sharpens appetite {cite:canon-ibn-sina-print-v1 p.358} {cite:canon-ibn-sina-print-v1 p.359}."
  ur: "انجدان سفید اور سیاہ دو قسم کا ہے؛ سیاہ زیادہ طاقتور ہے اور غذا میں استعمال نہیں ہوتا۔ یہ لطیف کرتا، اندرونی پھوڑوں، غدود کی سوجن اور جوڑوں کے درد میں مفید ہے، اور بھوک بڑھاتا ہے {cite:canon-ibn-sina-print-v1 p.358} {cite:canon-ibn-sina-print-v1 p.359}۔"
