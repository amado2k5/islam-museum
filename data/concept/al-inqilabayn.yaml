summary:
  ar: "الانقلابان هما نقطتا غاية البعد عن معدل النهار شمالاً وجنوباً: انقلاب الصيف في أول السرطان، وانقلاب الشتاء في أول الجدي. وفي انقلاب الصيف يكون النهار أطول ما يكون والليل أقصر، وفي انقلاب الشتاء بالعكس {cite:farghani-elements-astronomy p. 112}{cite:farghani-elements-astronomy p. 150}{cite:farghani-elements-astronomy p. 155}{cite:farghani-elements-astronomy p. 156}."
  en: "The two solstices are the points of greatest distance from the equinoctial circle, north and south: the summer solstice at the beginning of Cancer, and the winter solstice at the beginning of Capricorn. The day is longest at the summer solstice and shortest at the winter solstice {cite:farghani-elements-astronomy p. 112}{cite:farghani-elements-astronomy p. 150}{cite:farghani-elements-astronomy p. 155}{cite:farghani-elements-astronomy p. 156}."
