id: concept/nafaqat-al-murdia
class: concept
kind: legal
label:
  ar: "نفقة المرضعة"
  en: "Maintenance of the nursing mother"
  ur: "دودھ پلانے والی ماں کی نفقہ"
  es: "Mantenimiento de la madre lactante"
summary:
  ar: "نفقة المرضعة حق للأم المرضعة في طعامها وكسوتها وسكناها، قرره قوله تعالى وعلى المولود له رزقهن وكسوتهن بالمعروف في آية الرضاع من سورة البقرة، فالأب ينفق على من ترضع ولده حتى فصاله، وإن اختلفا فالرضاع أولى بالأم ثم بمن قبلها الولد منها، ولا يضار والدة بولدها ولا مولود له بولده."
  en: "The maintenance of the nursing mother is the right of the mother who suckles, in her food, clothing and lodging, laid down in the verse of suckling in Sura al-Baqara — upon the father of the child is their provision and clothing in fairness — so the father maintains the woman who nurses his child until weaning, and if the parents differ the suckling belongs first to the mother then to whoever the child accepts, and no mother is to be harmed on account of her child nor the father on account of his."
  ur: "دودھ پلانے والی ماں کی نفقہ اس ماں کا حق ہے جو بچے کو دودھ پلاتی ہے — اس کے کھانے، پہننے اور رہنے میں — سورۃ بقرہ کی رضاعت والی آیت نے یہ مقرر کیا کہ باپ پر ہے ان کی رزق اور لباس معروف طور پر، پس باپ اس عورت کی نفقہ کرتا ہے جو اس کے بچے کو دودھ پلائے یہاں تک کہ دودھ چھڑے، اور اگر ماں باپ اختلاف کریں تو دودھ پہلے ماں کا ہے پھر اس کا جسے بچہ قبول کرے، اور نہ ماں کو اس کے بچے کی وجہ سے نقصان پہنچایا جائے نہ باپ کو۔"
  es: "El sustento de la madre lactante es un derecho de la madre que amamanta, en su alimento, vestimenta y alojamiento, establecido en el versículo de la lactancia en Sura al-Baqara: sobre el padre del niño recae su provisión y vestimenta con equidad; por lo tanto, el padre mantiene a la mujer que amamanta a su hijo hasta el destete, y si los padres difieren, la lactancia pertenece primero a la madre y luego a quien el niño acepte, y ninguna madre debe ser perjudicada por causa de su hijo ni el padre por causa del suyo."
