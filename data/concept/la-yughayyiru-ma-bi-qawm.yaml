id: concept/la-yughayyiru-ma-bi-qawm
class: concept
kind: doctrine
label:
  ar: "لا يغير الله ما بقوم حتى يغيروا ما بأنفسهم"
  en: "God does not change a people's state until they change what is in themselves"
  es: "Dios no cambia el estado de un pueblo hasta que ellos mismos cambian lo que hay en sí mismos."
  fr: "Dieu ne change pas l'état d'un peuple tant que celui-ci ne change pas ce qui est en lui."
  ur: "خدا کسی قوم کی حالت اس وقت تک نہیں بدلتا جب تک کہ وہ اپنی حالت کو نہ بدلیں۔"
summary:
  ar: "يجعل عرجون هذه السنة من أوضح السنن الاجتماعية: الله لا يغيّر ما بالناس من عافية ونعمة حتى يغيّروا ما بأنفسهم من طاعة وإحسان، وهي سنة شاملة في الخير والشر {cite:sunan-allah-fi-al-mujtama-azhar p. 52}. والأماني الكاذبة والصراخ الذي لا يصحبه عمل جاد لا وزن له في هذه السنن {cite:sunan-allah-fi-al-mujtama-azhar p. 52}. ويربط الكتاب بين السنة وبين الفطرة التي فطر الله الناس عليها، فإذا غيروها بسوء التصرف أنزل بهم العقاب ليتذكروا، فإن عادوا إلى الخير رفعه الله عنهم {cite:sunan-allah-fi-al-mujtama-azhar p. 51-52}. وتُستدل السنة بآيتي الرعد 11 والأنفال 52-53 على آل فرعون وأمثالهم {cite:sunan-allah-fi-al-mujtama-azhar p. 53-54}."
  en: "Arjun treats this as one of the clearest social sunan: God does not withdraw a blessing or health from a people until they change the obedience or good they practise, and the sunan works both for good and for evil {cite:sunan-allah-fi-al-mujtama-azhar p. 52}. Empty wishes and outcry without serious action carry no weight in these sunan {cite:sunan-allah-fi-al-mujtama-azhar p. 52}."
  es: "Arjun considera esto como uno de los sunan sociales más claros: Dios no retira una bendición o salud a un pueblo hasta que este cambia la obediencia o el bien que practica, y el sunan funciona tanto para el bien como para el mal {cite:sunan-allah-fi-al-mujtama-azhar p. 52}. Los deseos vacíos y las protestas sin acciones serias no tienen peso en estos sunan {cite:sunan-allah-fi-al-mujtama-azhar p. 52}."
  fr: "Arjun considère cela comme l'un des sunna sociaux les plus clairs: Dieu ne retire ni sa bénédiction ni sa santé à un peuple tant que celui-ci ne modifie pas son obéissance ou ses bonnes actions, et le sunna agit aussi bien pour le bien que pour le mal {cite:sunan-allah-fi-al-mujtama-azhar p. 52}. Les vœux pieux et les protestations sans action concrète sont vains à l'égard de ces sunna {cite:sunan-allah-fi-al-mujtama-azhar p. 52}."
  ur: "ارجن اسے سب سے واضح سماجی سنن میں سے ایک کے طور پر مانتے ہیں: خدا کسی قوم سے اس وقت تک کوئی نعمت یا صحت واپس نہیں لیتا جب تک کہ وہ ان کی اطاعت یا نیکی کو تبدیل نہ کر لیں، اور سنن اچھے اور برے دونوں کے لیے کام کرتا ہے۔ 52}۔ خالی خواہشات اور سنجیدہ عمل کے بغیر چیخ و پکار ان سنن میں کوئی وزن نہیں رکھتی۔ 52}۔"
