id: concept/la-yughayyiru-ma-bi-qawm
class: concept
kind: doctrine
label:
  ar: "لا يغير الله ما بقوم حتى يغيروا ما بأنفسهم"
  en: "God does not change a people's state until they change what is in themselves"
summary:
  ar: "يجعل عرجون هذه السنة من أوضح السنن الاجتماعية: الله لا يغيّر ما بالناس من عافية ونعمة حتى يغيّروا ما بأنفسهم من طاعة وإحسان، وهي سنة شاملة في الخير والشر {cite:sunan-allah-fi-al-mujtama-azhar p. 52}. والأماني الكاذبة والصراخ الذي لا يصحبه عمل جاد لا وزن له في هذه السنن {cite:sunan-allah-fi-al-mujtama-azhar p. 52}. ويربط الكتاب بين السنة وبين الفطرة التي فطر الله الناس عليها، فإذا غيروها بسوء التصرف أنزل بهم العقاب ليتذكروا، فإن عادوا إلى الخير رفعه الله عنهم {cite:sunan-allah-fi-al-mujtama-azhar p. 51-52}. وتُستدل السنة بآيتي الرعد 11 والأنفال 52-53 على آل فرعون وأمثالهم {cite:sunan-allah-fi-al-mujtama-azhar p. 53-54}."
  en: "Arjun treats this as one of the clearest social sunan: God does not withdraw a blessing or health from a people until they change the obedience or good they practise, and the sunan works both for good and for evil {cite:sunan-allah-fi-al-mujtama-azhar p. 52}. Empty wishes and outcry without serious action carry no weight in these sunan {cite:sunan-allah-fi-al-mujtama-azhar p. 52}."
