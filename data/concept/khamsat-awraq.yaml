  id: "Lima Daun"
summary:
  ar: "خمسة أوراق في الكتاب هو قنطافلون، قوي التجفيف بلا حدة ولا حرافة ولا لذع، يضمد به للنزف فيقطعه، وينفع من الدبيلات والخنازير والصلابات البلغمية والداحس والنملة والجمرة والجرب، ومن أوجاع المفاصل وعرق النسا والقيلة، ويمضمض بطبيخ أصله للسن الوجعة والقلاع، ويغرغر به لخشونة الحلق، وعصارة أصله لوجع الرئة والكبد واليرقان، وينفع أصله من الإسهال وقروح الأمعاء والبواسير ومن الحميات والربع، وعصارة أصله دواء قتال {cite:canon-ibn-sina-print-v1 pp.716-717}"
  en: "Khamsat awraq is in the book qantaflun, strongly drying without sharpness, pungency or sting, it is put as a poultice on bleeding and cuts it, and benefits abscesses, scrofula, phlegmatic hardnesses, felon, namla, jamra and mange, pains of the joints, sciatica and hernia, the decoction of its root is used to rinse an aching tooth and thrush and to gargle for roughness of the throat, the juice of its root is for pain of the lung, liver pain and jaundice, its root benefits diarrhoea, ulcers of the intestines, haemorrhoids, fevers and quartan fever, and the juice of its root is a deadly drug {cite:canon-ibn-sina-print-v1 pp.716-717}"
  ur: "خمسۃ اوراق کتاب میں قنطافلون ہے، بغیر تیزی، حرافت اور چبھن کے سخت خشک کرنے والا، خون بہنے پر ضماد کیا جائے تو اسے روکتا ہے، اور پھوڑوں، خنازیر، بلغمی سختیوں، داحس، نملہ، جمرہ اور خارش میں، جوڑوں کے دردوں، عرق النسا اور قیلہ میں نافع ہے، اس کی جڑ کے جوشاندے سے دردناک دانت اور قلاع کے لیے کلی کی جاتی ہے اور حلق کی کھردراہٹ کے لیے غرارہ، اس کی جڑ کا رس پھیپھڑے اور جگر کے درد اور یرقان کے لیے ہے، اس کی جڑ دست، آنتوں کے زخموں، بواسیر، بخاروں اور ربع میں نافع ہے، اور اس کی جڑ کا رس مہلک دوا ہے {cite:canon-ibn-sina-print-v1 pp.716-717}۔"
  es: "Khamsat awraq se encuentra en el libro qantaflun, es de acción secante intensa sin agudeza, picor ni irritación, se aplica como cataplasma sobre hemorragias y las detiene, y beneficia abscesos, escrófula, endurecimientos flemáticos, panadizos, namla, jamra y sarna, dolores articulares, ciática y hernias, la decocción de su raíz se usa para enjuagar un diente dolorido y candidiasis, y para hacer gárgaras para la aspereza de garganta, el jugo de su raíz es para el dolor de pulmón, dolor de hígado e ictericia, su raíz beneficia la diarrea, úlceras intestinales, hemorroides, fiebres y fiebre cuartana, y el jugo de su raíz es una droga mortal {cite:canon-ibn-sina-print-v1 pp.716-717}"
  fr: "Le khamsat awraq est mentionné dans le livre Qantaflun. Il est décrit comme fortement asséchant, sans être piquant ni irritant. Appliqué en cataplasme sur les saignements, il les stoppe. Il est bénéfique en cas d'abcès, de scrofule, de duretés phlegmatiques, de phéromones, de namla, de jamra et de gale, de douleurs articulaires, de sciatique et de hernie. La décoction de sa racine est utilisée en rinçage dentaire pour soulager les maux de dents et le muguet, ainsi qu'en gargarisme pour apaiser les irritations de la gorge. Le jus de sa racine est indiqué pour les douleurs pulmonaires et hépatiques, la jaunisse, la diarrhée, les ulcères intestinaux, les hémorroïdes, les fièvres et la fièvre quarte. Le jus de sa racine est considéré comme un remède mortel. {cite:canon-ibn-sina-print-v1 pp.716-717}"
  tr: "Kitapta beş yaprak Qantaflon'dur; keskinlik, keskinlik veya yakma olmadan güçlü kurutma sağlar. Kanamayı bandajlamak ve kesmek için kullanılır. Frengi, domuzlar, flegmatik sertlik, ishal, şarbon, şarbon ve uyuzlaşma için faydalıdır. Eklem ağrısı, siyatik ve göksel hastalıklar için kullanılır. Diş ağrısı ve ardıç için orijinal güveç ile durulanır, boğaz pürüzleri için gargara yapılır, akciğer ağrısı, karaciğer ve sarılık için çıkarılır. Orijinal ekstresi ishal, bağırsak ülserleri, hemoroid, ateş ve dörtlüler için faydalıdır. Ekstresi savaşçı bir ilaçtır {cite:canon-ibn-sina-print-v1 s.716-717}"
  id: "Lima daun dalam buku ini adalah Qantaflon, pengeringan kuat tanpa rasa tajam, tajam, atau perih. Digunakan untuk membalut pendarahan dan memotongnya. Obat ini bermanfaat untuk sifilis, babi, kekerasan flegmatik, diare, antraks, antraks, dan kudis. Digunakan untuk nyeri sendi, sciatica, dan penyakit surgawi. Digunakan dengan semur yang awalnya untuk sakit gigi dan sarias, dikumur untuk tenggorokan kasar, diekstrak untuk nyeri paru-paru, hati, dan kuning. Ekstrak aslinya bermanfaat untuk diare, tukak lambung usus, wasir, demam, dan empat kebun. Ekstraknya adalah obat lawan {cite:canon-ibn-sina-print-v1 hlm.716-717}"
