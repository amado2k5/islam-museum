id: concept/alamat-al-suda-bi-al-musharaka
class: concept
kind: scientific
label:
  ar: "علامات الصداع الكائن بالمشاركة"
  en: "Signs of headache by sharing"
  fr: "Signes de la céphalée par participation"
  ur: "مشارکت سے ہونے والے صداع کی علامات"
summary:
  ar: "يبيّن ابن سينا كيف يُعرف الصداع الكائن بمشاركة عضو آخر، وكيف يُفرَّق بين ما بدأ من المعدة وما بدأ من الدماغ، وكيف تدل جهة الألم في الرأس على العضو المشارك؛ وفيه سطر موسوم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v2 pp.52-53}"
  en: "Ibn Sina shows how headache by sharing with another organ is known, how what began in the stomach is told from what began in the brain, and how the side of the pain in the head points to the sharing organ; the record has a labelled line in a section held for the founder's ruling {cite:canon-ibn-sina-print-v2 pp.52-53}"
  fr: "Ibn Sina montre comment reconnaître la céphalée par participation d’un autre organe, distinguer ce qui a commencé dans l’estomac de ce qui a commencé dans le cerveau, et déduire de la localisation de la douleur quel organe participe au mal. La notice comporte une mention signalée dans une section réservée à la décision du fondateur {cite:canon-ibn-sina-print-v2 pp.52-53}."
  ur: "ابن سینا بتاتا ہے کہ دوسرے عضو کی مشارکت سے ہونے والا صداع کیسے پہچانا جاتا ہے، جو معدے سے شروع ہوا اور جو دماغ سے، ان میں فرق کیسے کیا جاتا ہے، اور سر میں درد کی جہت شریک عضو پر کیسے دلالت کرتی ہے؛ اس میں ایک موسوم سطر بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v2 pp.52-53}۔"
