id: concept/tajdid
class: concept
kind: term
label:
  ar: "التجديد في الفكر الإسلامي"
  en: "Renewal (tajdid) in Islamic thought"
  es: "Renovación (tajdid) en el pensamiento islámico"
  fr: "Le renouveau (tajdid) dans la pensée islamique"
  ur: "اسلامی فکر میں تجدید ⁦(تجدید)⁩"
issue:
  ar: "ما التجديد الذي تحتاجه الشريعة، ومن يقوم به، وما حدوده؟"
summary:
  ar: "يعرض عباس شومان التجديد بوصفه لازمة من لوازم الشريعة، لا تقوم بحاجات الناس دونه؛ وأحكامه القطعية قليلة، أما الفروع الاجتهادية فتتغير الفتوى فيها بتغير الزمان والمكان والأحوال، ويستشهد بالقرافي في اعتبار العرف. ويرى أن التجديد لا يكون إلا من المؤهلين المتجردين من الهوى والمصلحة، وأنه يُرفض حين يُستخدم لتحريض على الفوضى أو لخدمة انتماء سياسي أو طائفي. ويذكر حديث تجديد الدين على رأس كل مئة عام، ويقرر أنه لا يعني أن التجديد لا يكون إلا كل مئة عام. {cite:nazarat-fi-al-tajdid-azhar p. 16} {cite:nazarat-fi-al-tajdid-azhar p. 12} {cite:nazarat-fi-al-tajdid-azhar p. 22}"
  en: "Shouman presents renewal as a necessary feature of the Islamic law: the fixed rulings are few, while most branch rulings are open to change with time, place and circumstance. He reports the century-renewer tradition, the author's own reading that renewal is continuous, and his view that renewal by unqualified people or for partisan aims is rejected."
  es: "Shouman presenta la renovación como un elemento esencial del derecho islámico: las normas fijas son escasas, mientras que la mayoría de las normas secundarias están sujetas a cambios según el tiempo, el lugar y las circunstancias. Describe la tradición de renovación centenaria, su propia interpretación de que la renovación es continua y su postura de que la renovación llevada a cabo por personas no cualificadas o con fines partidistas es inaceptable."
  fr: "Shouman présente le renouvellement comme une caractéristique essentielle du droit islamique: les règles fixes sont peu nombreuses, tandis que la plupart des règles d’interprétation sont susceptibles d’évoluer selon le temps, le lieu et les circonstances. Il relate la tradition des rénovateurs séculaires, sa propre interprétation du renouvellement comme un processus continu, et son rejet du renouvellement par des personnes incompétentes ou à des fins partisanes."
  ur: "شومن تجدید کو اسلامی قانون کی ایک ضروری خصوصیت کے طور پر پیش کرتا ہے: مقررہ احکام چند ہیں، جب کہ زیادہ تر شاخوں کے احکام وقت، جگہ اور حالات کے ساتھ بدلنے کے لیے کھلے ہیں۔ وہ صدی کی تجدید کرنے والی روایت کی اطلاع دیتا ہے، مصنف کا اپنا پڑھنا کہ تجدید مسلسل جاری ہے، اور اس کا خیال ہے کہ نااہل لوگوں کی طرف سے یا متعصبانہ مقاصد کے لیے تجدید کو مسترد کر دیا جاتا ہے۔"
