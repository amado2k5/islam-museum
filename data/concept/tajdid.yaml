id: concept/tajdid
class: concept
kind: term
label:
  ar: "التجديد في الفكر الإسلامي"
  en: "Renewal (tajdid) in Islamic thought"
issue:
  ar: "ما التجديد الذي تحتاجه الشريعة، ومن يقوم به، وما حدوده؟"
summary:
  ar: "يعرض عباس شومان التجديد بوصفه لازمة من لوازم الشريعة، لا تقوم بحاجات الناس دونه؛ وأحكامه القطعية قليلة، أما الفروع الاجتهادية فتتغير الفتوى فيها بتغير الزمان والمكان والأحوال، ويستشهد بالقرافي في اعتبار العرف. ويرى أن التجديد لا يكون إلا من المؤهلين المتجردين من الهوى والمصلحة، وأنه يُرفض حين يُستخدم لتحريض على الفوضى أو لخدمة انتماء سياسي أو طائفي. ويذكر حديث تجديد الدين على رأس كل مئة عام، ويقرر أنه لا يعني أن التجديد لا يكون إلا كل مئة عام. {cite:nazarat-fi-al-tajdid-azhar p. 16} {cite:nazarat-fi-al-tajdid-azhar p. 12} {cite:nazarat-fi-al-tajdid-azhar p. 22}"
  en: "Shouman presents renewal as a necessary feature of the Islamic law: the fixed rulings are few, while most branch rulings are open to change with time, place and circumstance. He reports the century-renewer tradition, the author's own reading that renewal is continuous, and his view that renewal by unqualified people or for partisan aims is rejected."
