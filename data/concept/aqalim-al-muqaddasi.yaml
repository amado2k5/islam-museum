summary:
  ar: "تقسيم المقدسي مملكة الإسلام أربعة عشر إقليماً: ستة للعرب ⁦(جزيرة العرب، العراق، أقور، الشام، مصر، المغرب)⁩ وثمانية للعجم ⁦(المشرق، الديلم، الرحاب، الجبال، خوزستان، فارس، كرمان، السند)⁩ {cite:muqaddasi-ahsan-taqasim-bga-1877 p.19} {cite:muqaddasi-ahsan-taqasim-bga-1877 p.20}."
  en: "Al-Muqaddasi's division of the realm of Islam into fourteen regions: six Arab (Jazirat al-Arab, Iraq, Aqur, Sham, Misr, the Maghrib) and eight non-Arab (al-Mashriq, al-Daylam, al-Rihab, al-Jibal, Khuzistan, Fars, Kirman, al-Sind)."
  fr: "La division du domaine de l’Islam par al-Muqaddasi en quatorze régions : six arabes (Jazirat al-Arab, Irak, Aqur, Sham, Misr, Maghreb) et huit non arabes (al-Mashriq, al-Daylam, al-Rihab, al-Jibal, Khuzistan, Fars, Kirman, al-Sind)."
  es: "La división del reino del Islam por parte de Al-Muqaddasi en catorce regiones: seis árabes (Jazirat al-Arab, Irak, Aqur, Sham, Egipto, el Magreb) y ocho no árabes (al-Mashriq, al-Daylam, al-Rihab, al-Jibal, Juzistán, Fars, Kirman, al-Sind)."
  ur: "المقدسی نے دائرہ اسلام کو چودہ خطوں میں تقسیم کیا: چھ عرب ⁦(جزیرات العرب، عراق، عقور، شام، مصر، مغرب)⁩ اور آٹھ غیر عرب ⁦(المشرق، الدیلام، الریحاب، الجبل، خوزستان، فارس، الکرمان،)⁩۔"
  tr: "El-Makdisi, İslam krallığını on dört bölgeye böldü: altısı Araplar için (Arap Yarımadası, Irak, Akur, Şam, Mısır, Fas) ve sekiz bölge Arap olmayanlar için (Doğu, Daylam, El-Rihab, dağlar, Huzistan, Fars, Kirman, Sindh) {cite:muqaddasi-ahsan-taqasim-bga-1877 s.19} {cite:muqaddasi-ahsan-taqasim-bga-1877 s.20}."
  id: "Al-Maqdisi membagi kerajaan Islam menjadi empat belas wilayah: enam untuk orang Arab (Semenanjung Arab, Irak, Aqur, Levant, Mesir, Maroko) dan delapan untuk non-Arab (Timur, Daylam, Al-Rihab, pegunungan, Khuzestan, Fars, Kerman, Sindh) {cite:muqaddasi-ahsan-taqasim-bga-1877 hlm.19} {cite:muqaddasi-ahsan-taqasim-bga-1877 hlm.20}."
