id: concept/al-hamd-lillah
class: concept
kind: term
label:
  ar: "الحمد لله"
  en: "Al-hamd lillah (praise belongs to God)"
  ur: "الحمد للہ"
summary:
  ar: "قول «الحمد لله» الذي تفتتح به الفاتحة. يرى الشعراوي أن الحمد يشمل ذات الله وصفاته ونعمه ومنهجه وقضاءه، وأن الله علّم عباده الحمد بكلمتين ليستوي فيهما العالم والأمي، وأن النعمة تسبق الإنسان من شروق الشمس ونزول المطر وجريان الهواء إلى تسخير الكون له، وأن الحمد ينتقل من العقل إلى القلب ثم إلى الجوارح، وأن حمد الله يجب حتى على ما يكرهه الإنسان لأن قضاءه خير {cite:tafsir-sharawi-khawatir-scan p.55} {cite:tafsir-sharawi-khawatir-scan p.56} {cite:tafsir-sharawi-khawatir-scan p.58} {cite:tafsir-sharawi-khawatir-scan p.61} {cite:tafsir-sharawi-khawatir-scan p.63}. هذا تفسيره ويُنسب إليه."
  en: "The phrase 'praise belongs to God' with which the Fatiha opens. Sha'rawi holds that praise covers God's essence, attributes, favours, method and decree; that God taught the praise in two words so that the learned and the unlettered share it equally; that favours precede the human, from sunrise and rain to the subjection of the cosmos; that praise moves from reason to heart to the limbs; and that praise is owed even for what one dislikes, since its decree is good {cite:tafsir-sharawi-khawatir-scan p.55} {cite:tafsir-sharawi-khawatir-scan p.56} {cite:tafsir-sharawi-khawatir-scan p.58} {cite:tafsir-sharawi-khawatir-scan p.61} {cite:tafsir-sharawi-khawatir-scan p.63}. This is Sha'rawi's reading and is attributed to him."
  ur: "وہ فقرہ «الحمد للہ» جس سے فاتحہ شروع ہوتی ہے۔ شعراوی کے نزدیک حمد اللہ کی ذات، صفات، نعمتوں، منہج اور فیصلے سب کو شامل ہے۔ اللہ نے دو کلمات میں حمد سکھائی تاکہ عالم اور ان پڑھ دونوں برابر ہوں۔ نعمتیں انسان سے پہلے موجود ہیں، سورج کی روشنی اور بارش سے لے کر کائنات کے تسخیر تک۔ حمد عقل سے دل اور پھر اعضا تک پہنچتی ہے، اور جو چیز انسان کو ناپسند ہو اس پر بھی حمد واجب ہے کیونکہ اللہ کا فیصلہ بہتر ہوتا ہے {cite:tafsir-sharawi-khawatir-scan p.55} {cite:tafsir-sharawi-khawatir-scan p.56} {cite:tafsir-sharawi-khawatir-scan p.58} {cite:tafsir-sharawi-khawatir-scan p.61} {cite:tafsir-sharawi-khawatir-scan p.63}۔ یہ شعراوی کی تفسیر ہے اور ان کی طرف منسوب ہے۔"
