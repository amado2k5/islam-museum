issue:
  ar: "ما المقصود بالفناء في كلام الصوفية، وأي أنواعه محمود وأيها مذموم؟"
  en: "What is meant by annihilation in the words of the Sufis, and which of its kinds is praiseworthy and which blameworthy?"
  ur: "صوفیہ کے کلام میں فنا سے کیا مراد ہے، اور اس کی کون سی قسم قابلِ تعریف اور کون سی قابلِ مذمت ہے؟"
