    summary: { ar: "الفناء عن إرادة ما سوى الله هو أول الإسلام وآخره؛ والفناء عن شهود السوى يعرض لغلبة الحال، وقد زل فيه قوم فظنوه اتحاداً، ولم يقع فيه أكابر الصحابة؛ والفناء عن وجود السوى قول أهل الاتحاد.", en: "Annihilation from willing anything but God is the beginning and end of Islam; annihilation from witnessing others comes from an overwhelming state, some slipped in it and took it for union, and the great Companions did not fall into it; annihilation from the existence of others is the doctrine of union.", ur: "غیر اللہ کے ارادے سے فنا اسلام کا آغاز و انجام ہے؛ غیر کے شہود سے فنا غلبۂ حال سے ہوتی ہے، اس میں کچھ لوگ پھسل کر اسے اتحاد سمجھ بیٹھے، اور بڑے صحابہ اس میں نہیں پڑے؛ غیر کے وجود سے فنا اہلِ اتحاد کا قول ہے۔" }
