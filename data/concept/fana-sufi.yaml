label: { ar: "الفناء ⁦(في اصطلاح الصوفية)⁩", en: "Annihilation (fana') in Sufi usage", ur: "فنا (صوفیہ کی اصطلاح میں)" }
summary:
  ar: "لفظ صوفي يدل على غياب العبد عن غير الله في إرادته أو شهوده؛ قسمه ابن تيمية ثلاثة أنواع: فناء عن إرادة ما سوى الله وهو عنده المحمود الذي عليه الأنبياء والأولياء الكمل، وفناء عن شهود السوى يعرض لكثير من السالكين لغلبة الحال وفيه نقص، وفناء عن وجود السوى يعدّه قول أهل الاتحاد."
  en: "A Sufi term for the servant's absence from all but God in his will or his witnessing. Ibn Taymiyya divided it into three kinds: annihilation from willing anything but God, which he held to be the praiseworthy kind of the prophets and the perfect friends of God; annihilation from witnessing anything else, which befalls many wayfarers when a state overwhelms them and which he held deficient; and annihilation from the existence of anything else, which he counted the doctrine of the people of union."
