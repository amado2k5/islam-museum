label: { ar: "النَّائِحَة", en: "The mourning woman (na'iha)", ur: "نائحہ" }
summary:
  ar: "النائحة في اللغة المرأة التي تبكي على الميت وتعدد محاسنه. ويرى الفقهاء أن النائحة تعزر وتحبس حتى تتوب، ومما روي عن عمر أنه ضربها لما سمع نواحها، وقال إنها تؤذي الموتى في قبورهم والأحياء في دورهم، وإنها تنهى عن الصبر وتأمر بالجزع. وذكر الشيزري أن المحتسب يعزر النائحة ويمنعها من المآتم والمقابر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15427}"
  en: "In the lexicon, a na'iha is a woman who weeps over the dead and recounts their virtues. The jurists hold that she is disciplined and held until she repents. A report related by al-Awza'i says that Umar struck a mourning woman, saying she troubles the dead in their graves and the living in their houses, forbids patience which God commands, and urges despair which God forbids. Al-Shayzari says the market inspector disciplines a wailing woman and bars her from funerals and graves. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15427}"
  ur: "نائحہ وہ عورت ہے جو میت پر رو کر اس کے اوصاف بیان کرے۔ فقہاء کے نزدیک اسے تعزیر دی جائے گی اور توبہ تک روکا جائے گا۔ محتسب اسے جنازوں اور قبرستانوں سے روکتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15427}"
