label: { ar: "النَّائِحَة", en: "The mourning woman (na'iha)", ur: "نائحہ", es: "La mujer de luto (na'iha)", fr: "La femme en deuil (na'iha)", tr: "ağlama", id: "ratapan" }
summary:
  ar: "النائحة في اللغة المرأة التي تبكي على الميت وتعدد محاسنه. ويرى الفقهاء أن النائحة تعزر وتحبس حتى تتوب، ومما روي عن عمر أنه ضربها لما سمع نواحها، وقال إنها تؤذي الموتى في قبورهم والأحياء في دورهم، وإنها تنهى عن الصبر وتأمر بالجزع. وذكر الشيزري أن المحتسب يعزر النائحة ويمنعها من المآتم والمقابر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15427}"
  en: "In the lexicon, a na'iha is a woman who weeps over the dead and recounts their virtues. The jurists hold that she is disciplined and held until she repents. A report related by al-Awza'i says that Umar struck a mourning woman, saying she troubles the dead in their graves and the living in their houses, forbids patience which God commands, and urges despair which God forbids. Al-Shayzari says the market inspector disciplines a wailing woman and bars her from funerals and graves. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15427}"
  ur: "نائحہ وہ عورت ہے جو میت پر رو کر اس کے اوصاف بیان کرے۔ فقہاء کے نزدیک اسے تعزیر دی جائے گی اور توبہ تک روکا جائے گا۔ محتسب اسے جنازوں اور قبرستانوں سے روکتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15427}"
  es: "En el léxico, una na'iha es una mujer que llora por los muertos y relata sus virtudes. Los juristas sostienen que se la castiga y se la retiene hasta que se arrepienta. Un relato de al-Awza'i dice que Umar golpeó a una mujer en duelo, diciéndole que perturbaba a los muertos en sus tumbas y a los vivos en sus casas, que prohibía la paciencia que Dios ordena e incitaba a la desesperación que Dios prohíbe. Al-Shayzari dice que el inspector del mercado castiga a una mujer que llora desconsoladamente y le prohíbe asistir a funerales y tumbas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15427}"
  fr: "Dans le lexique, une na'iha est une femme qui pleure les morts et récite leurs mérites. Les juristes estiment qu'elle est punie et retenue jusqu'à ce qu'elle se repente. Un hadith rapporté par al-Awza'i indique qu'Umar frappa une femme en deuil, lui reprochant de troubler les morts dans leurs tombes et les vivants dans leurs maisons, d'interdire la patience ordonnée par Dieu et d'inciter au désespoir proscrit. Al-Shayzari rapporte que l'inspecteur du marché punit une femme en pleurs et lui interdit l'accès aux funérailles et aux tombes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15427}"
  tr: "Dilbilimde, yas tutan kadın, ölen için ağlayan ve erdemleri sayısız olan kadındır. Hukukçular, yas tutan kadının cezalandırılıp tövbe edene kadar hapsedildiğine inanırlar. Ömer'den, kadının ağıtlarını duyduğunda onu dövdüğü, mezarlarındaki ölülere ve evlerinde yaşayanlara zarar verdiğini, sabrı yasakladığını ve sıkıntıyı emrettiğini anlatır. El-Şizari, Muhtasib'in yas tutan kadını onurlandırdığını ve onun yas tutmasını ve mezarlıkları engellemesini engeller. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.15427}"
  id: "Dalam linguistik, wanita berduka adalah wanita yang menangis untuk almarhum dan kebajikan yang banyak. Ahli hukum percaya bahwa wanita yang berduka dihukum dan dipenjara sampai dia bertobat. Dinawayatkan dari Umar bahwa dia memukulnya ketika mendengar tangisan wanita itu, mengatakan bahwa wanita itu menyakiti orang mati di makam dan orang hidup di rumah mereka, melarang kesabaran, dan memerintahkan penderitaan. Al-Shizari menyebutkan bahwa Muhtasib menghormati wanita yang berduka dan mencegahnya berkabung serta di pemakaman. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15427}"
