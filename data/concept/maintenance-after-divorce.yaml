id: concept/maintenance-after-divorce
class: concept
kind: legal
label:
  ar: نفقة المطلقة المرضع والرضيع
  en: Maintenance of the divorced nursing mother and infant
  ur: طلاق یافتہ دودھ پلانے والی ماں اور بچے کا نفقہ
  es: "Manutención de la madre lactante divorciada y del bebé"
  fr: "Entretien de la mère divorcée allaitante et de son nourrisson"
  tr: "Emziren ve Boşanmış Kadın Bebek için Nafaka"
  id: "Tunjangan untuk Wanita yang Menyusui dan Bayi yang Bercerai"
summary:
  ar: "يقرّر الشعراوي من آية البقرة 233 أن الرزق والكسوة على المولود له ⁦(الأب)⁩، وأنهما للمطلقات المرضعات في الأصل لا للزوجات عموماً، وأن الإنفاق يُقدَّر بالمعروف ولا يُكلَّف أحد فوق طاقته، وأن على الوارث مثل ذلك إذا مات الأب {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1005} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1006}."
  en: "From al-Baqara 2:233 Sha'rawi holds that maintenance and clothing fall on the father, the one to whom the child is born, and that they are owed to divorced nursing mothers rather than to wives in general; that it is measured by custom and nobody is charged beyond capacity; and that the heir bears the same duty if the father dies {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1005} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1006}."
  es: "De al-Baqara 2:233 Sha'rawi sostiene que el sustento y la vestimenta recaen sobre el padre, aquel a quien le nace el niño, y que se deben a las madres lactantes divorciadas en lugar de a las esposas en general; que se mide por costumbre y a nadie se le cobra más allá de su capacidad; y que el heredero tiene el mismo deber si el padre muere {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1005} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1006}."
  fr: "D'après al-Baqara 2:233, Sha'rawi soutient que l'entretien et l'habillement incombent au père, celui qui a donné naissance à l'enfant, et qu'ils sont dus aux mères allaitantes divorcées plutôt qu'aux épouses en général; que cela est mesuré par la coutume et que personne n'est tenu au-delà de ses capacités; et que l'héritier a le même devoir si le père décède {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1005} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1006}."
  ur: "البقرہ 2:233 سے شعراوی کا خیال ہے کہ نفقہ اور لباس باپ پر آتا ہے، جس سے بچہ پیدا ہوتا ہے، اور یہ کہ وہ عام طور پر بیویوں کی بجائے مطلقہ دودھ پلانے والی ماؤں کے مقروض ہیں۔ کہ یہ اپنی مرضی کے مطابق ماپا جاتا ہے اور کسی سے گنجائش سے زیادہ چارج نہیں لیا جاتا ہے۔ اور یہ کہ اگر باپ فوت ہو جائے تو وارث پر بھی یہی فرض ہے {حوالہ: تفسیر شعراوی خوااتیر اسکین جلد 2 صفحہ 1005}"
  tr: "El-Şaarawi, 233. ayetten beri geçim ve giysilerin kendisinden doğan çocuğun (babanın) sorumluluğunda olduğunu ve bunların aslında boşanmış emziren kadınlar için olduğunu, genel olarak eşler için olmadığını belirtir. Harcamalar iyiliğe göre hesaplanır ve kimse imkânının ötesinde bir yük taşımaz, baba ölürse varis aynı olur {atıf:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1005} {cite:tafsir-sharawi-khawatir-scan-vol-vol-cilt 2 s.1006}."
  id: "Al-Shaarawi menetapkan dari ayat 233 bahwa pemeliharaan dan pakaian adalah tanggung jawab anak yang dilahirkan olehnya (ayah), dan bahwa awalnya untuk wanita menyusui yang telah bercerai, bukan untuk istri secara umum. Pengeluaran diestimasi berdasarkan kebaikan dan tidak ada yang terbebani melebihi kemampuannya, dan pewaris sama jika ayahnya meninggal {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1005} {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1006}."
issue: { ar: "على من تجب نفقة المطلقة المرضع والرضيع، ولمن تكون؟", en: "On whom does the maintenance of the divorced nursing mother and infant fall, and to whom is it owed?" }
