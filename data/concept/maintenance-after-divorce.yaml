perspectives:
  - tradition: sunni
    id: sunni-sharawi-father-bears-upkeep
    stance: { en: "The father bears the upkeep, measured by custom and capacity", ar: "الأب يتحمل النفقة بالمعروف وبحسب الطاقة" }
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      en: "Sha'rawi places the duty on the father by the wording 'the one to whom the child is born', and warns that neither mother nor father may be harmed by the other on the child's account {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1005} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1006}. He explains the duty of the heir in the same way {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1006}."
      ar: "يضع الشعراوي التكليف على الأب بعبارة «المولود له»، ويحذّر من أن يضر أيٌّ من الأم والأب الآخر بسبب الولد {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1005} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1006}، ويشرح واجب الوارث على الوجه نفسه {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1006}."
