id: concept/maintenance-after-divorce
class: concept
kind: legal
label:
  ar: نفقة المطلقة المرضع والرضيع
  en: Maintenance of the divorced nursing mother and infant
  ur: طلاق یافتہ دودھ پلانے والی ماں اور بچے کا نفقہ
summary:
  ar: "يقرّر الشعراوي من آية البقرة 233 أن الرزق والكسوة على المولود له (الأب)، وأنهما للمطلقات المرضعات في الأصل لا للزوجات عموماً، وأن الإنفاق يُقدَّر بالمعروف ولا يُكلَّف أحد فوق طاقته، وأن على الوارث مثل ذلك إذا مات الأب {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1005} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1006}."
  en: "From al-Baqara 2:233 Sha'rawi holds that maintenance and clothing fall on the father, the one to whom the child is born, and that they are owed to divorced nursing mothers rather than to wives in general; that it is measured by custom and nobody is charged beyond capacity; and that the heir bears the same duty if the father dies {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1005} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1006}."
issue: { ar: "على من تجب نفقة المطلقة المرضع والرضيع، ولمن تكون؟", en: "On whom does the maintenance of the divorced nursing mother and infant fall, and to whom is it owed?" }
