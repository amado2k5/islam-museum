label: { ar: "المصر والقصبة والمدينة عند المقدسي", en: "Misr, qasaba and town in al-Muqaddasi", fr: "Misr, qasaba et ville chez al-Muqaddasi", es: "Misr, qasaba y ciudad de al-Muqaddasi" }
term: { ar: "المصر", en: "misr" }
summary:
  ar: "في زيادة من مخطوطة القسطنطينية تثبتها حاشية طبعة دي خويه، مراتب البلاد عند المقدسي: الأمصار كالملوك والقصبات كالحجّاب والمدن كالجند والقرى كالرجّالة؛ وينقل في معنى «المصر» أقوال الفقهاء وأهل اللغة والعامة ثم يقرر اصطلاحه: المصر كل بلد حلّه السلطان الأعظم وجُمعت إليه الدواوين {cite:muqaddasi-ahsan-taqasim-bga-1877 p.19}."
  en: "In an addition from the Constantinople manuscript given in de Goeje's apparatus, al-Muqaddasi's ranking of settlements: amsar like kings, qasabat like chamberlains, towns like soldiers and villages like foot-soldiers; he gives the jurists', philologists' and common usages of 'misr' and then his own: every town where the supreme ruler resides and the government offices are gathered."
  fr: "Dans un ajout du manuscrit de Constantinople reproduit dans l'apparat critique de de Goeje, al-Muqaddasi hiérarchise les établissements humains : les amsar sont comme les rois, les qasabat comme les chambellans, les villes comme les soldats et les villages comme les fantassins. Il présente le sens de « misr » chez les juristes, chez les philologues et dans l'usage courant, puis le sien : toute ville où réside le souverain suprême et où sont réunis les bureaux du gouvernement."
  es: "En una adición del manuscrito de Constantinopla que aparece en el aparato crítico de de Goeje, se encuentra la clasificación de asentamientos de al-Muqaddasi: amsar como reyes, qasabat como chambelanes, ciudades como soldados y aldeas como soldados de infantería; da los usos de 'misr' de los juristas, filólogos y el uso común, y luego el suyo propio: cada ciudad donde reside el gobernante supremo y se reúnen las oficinas gubernamentales."
