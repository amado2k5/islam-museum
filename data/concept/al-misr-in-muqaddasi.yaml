label: { ar: "المصر والقصبة والمدينة عند المقدسي", en: "Misr, qasaba and town in al-Muqaddasi", fr: "Misr, qasaba et ville chez al-Muqaddasi", es: "Misr, qasaba y ciudad de al-Muqaddasi", ur: "مصر، قصبہ اور قصبہ المقدسی میں", tr: "Mısır, Kasbah ve el-Makdisi'ye göre şehir", id: "Mesir menurut Kasbah dan al-Maqdisi" }
term: { ar: "المصر", en: "misr" }
summary:
  ar: "في زيادة من مخطوطة القسطنطينية تثبتها حاشية طبعة دي خويه، مراتب البلاد عند المقدسي: الأمصار كالملوك والقصبات كالحجّاب والمدن كالجند والقرى كالرجّالة؛ وينقل في معنى «المصر» أقوال الفقهاء وأهل اللغة والعامة ثم يقرر اصطلاحه: المصر كل بلد حلّه السلطان الأعظم وجُمعت إليه الدواوين {cite:muqaddasi-ahsan-taqasim-bga-1877 p.19}."
  en: "In an addition from the Constantinople manuscript given in de Goeje's apparatus, al-Muqaddasi's ranking of settlements: amsar like kings, qasabat like chamberlains, towns like soldiers and villages like foot-soldiers; he gives the jurists', philologists' and common usages of 'misr' and then his own: every town where the supreme ruler resides and the government offices are gathered."
  fr: "Dans un ajout du manuscrit de Constantinople reproduit dans l'apparat critique de de Goeje, al-Muqaddasi hiérarchise les établissements humains : les amsar sont comme les rois, les qasabat comme les chambellans, les villes comme les soldats et les villages comme les fantassins. Il présente le sens de « misr » chez les juristes, chez les philologues et dans l'usage courant, puis le sien : toute ville où réside le souverain suprême et où sont réunis les bureaux du gouvernement."
  es: "En una adición del manuscrito de Constantinopla que aparece en el aparato crítico de de Goeje, se encuentra la clasificación de asentamientos de al-Muqaddasi: amsar como reyes, qasabat como chambelanes, ciudades como soldados y aldeas como soldados de infantería; da los usos de 'misr' de los juristas, filólogos y el uso común, y luego el suyo propio: cada ciudad donde reside el gobernante supremo y se reúnen las oficinas gubernamentales."
  ur: "ڈی گوج کے آلات میں دیے گئے قسطنطنیہ کے مخطوطہ کے علاوہ، المقدسی کی بستیوں کی درجہ بندی: بادشاہوں کی طرح امصار، ایوانوں کی طرح قصابات، سپاہیوں کی طرح شہر اور پیدل سپاہیوں کی طرح گاؤں؛ وہ فقہاء، ماہرین فلکیات اور 'مصر' کے عام استعمالات دیتا ہے اور پھر اس کا اپنا: ہر وہ قصبہ جہاں حاکم اعلیٰ رہتا ہے اور سرکاری دفاتر جمع ہوتے ہیں۔"
  tr: "Konstantinopolis el yazmasından yapılan bir eklemede, de Khoye'nin baskısındaki kenar notlarıyla doğrulanan, el-Makdisi'ye göre toprakların sıralamaları şöyledir: krallar gibi şehirler, örtü gibi kasabalar, askerler gibi şehirler ve insanlar gibi köyler; \"Mısır\" anlamıyla ilgili hukukçuların, dilbilimcilerin ve genel halkın sözlerini alıntılar ve ardından terminolojisini belirler: Mısır, en büyük sultanın yerleştiği ve diwanların toplandığı herhangi bir ülkedir {cite:muqaddasi-ahsan-taqasim-bga-1877 s.19}."
  id: "Dalam tambahan dari manuskrip Konstantinopel, yang dikonfirmasi oleh catatan pinggir dalam edisi de Khoye, menurut al-Maqdisi, peringkat wilayah adalah sebagai berikut: kota seperti raja, kota seperti perlindungan, kota seperti tentara, dan desa seperti manusia; Ia mengutip kata-kata para ahli hukum, ahli bahasa, dan masyarakat umum mengenai makna \"Mesir\" lalu mendefinisikan terminologinya: Mesir adalah negara mana pun di mana sultan terbesar menetap dan tempat para diwan berkumpul {cite:muqaddasi-ahsan-taqasim-bga-1877 hlm.19}."
