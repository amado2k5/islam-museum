term: { ar: "المصر", en: "misr" }
summary:
  ar: "في زيادة من مخطوطة القسطنطينية تثبتها حاشية طبعة دي خويه، مراتب البلاد عند المقدسي: الأمصار كالملوك والقصبات كالحجّاب والمدن كالجند والقرى كالرجّالة؛ وينقل في معنى «المصر» أقوال الفقهاء وأهل اللغة والعامة ثم يقرر اصطلاحه: المصر كل بلد حلّه السلطان الأعظم وجُمعت إليه الدواوين {cite:muqaddasi-ahsan-taqasim-bga-1877 p.19}."
  en: "In an addition from the Constantinople manuscript given in de Goeje's apparatus, al-Muqaddasi's ranking of settlements: amsar like kings, qasabat like chamberlains, towns like soldiers and villages like foot-soldiers; he gives the jurists', philologists' and common usages of 'misr' and then his own: every town where the supreme ruler resides and the government offices are gathered."
