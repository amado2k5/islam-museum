  fr: "Kazuran (herbe à langue de bœuf)"
summary:
  ar: "الكازوران حشيشة سماها العرب لسان الثور، وأهل فارس يسمونها كزوان، وخاصيتها التفريح وإزالة الغم، ويؤجل الكتاب الكلام في منافعها إلى باب اللام عند لسان الثور."
  en: "Kazuran is a herb the Arabs called lisan al-thawr, the ox-tongue, and the Persians call kazwan. Its property is to gladden and remove gloom. The book defers the full account of its uses to the letter lam, under ox-tongue."
  ur: "کازوران ایک جڑی بوٹی ہے جسے عرب لسان الثور یعنی بیل کی زبان کہتے تھے، اور فارس والے کزوان۔ اس کی خاصیت خوش کرنا اور غم دور کرنا ہے۔ کتاب اس کے فوائد کا پورا بیان لام کے باب میں لسان الثور کے تحت مؤخر کرتی ہے۔"
  es: "Kazuran es una hierba que los árabes llamaban lisan al-thawr, lengua de buey, y los persas kazwan. Su propiedad es alegrar y disipar la tristeza. El libro pospone la descripción completa de sus usos hasta la letra lam, bajo el título \"lengua de buey\"."
  fr: "Le kazuran est une plante que les Arabes appellent lisan al-thawr, la langue de bœuf, et que les Perses nomment kazwan. On lui attribue la propriété de réjouir et de chasser la tristesse. L'ouvrage renvoie à la lettre lam, sous l'entrée « langue de bœuf », pour en donner une description complète des usages."
