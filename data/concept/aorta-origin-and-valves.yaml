summary:
  ar: "الشريان الآخر الأكبر من الشريانين النابتين من القلب يسميه ابن سينا باسم أرسطوطاليس أورطي، فيرسل عند منبته شعبتين تحيطان بالقلب ثم ينقسم إلى هابط أعظم وصاعد أصغر، وعلى مخرجه ثلاثة أغشية صلبة {cite:canon-ibn-sina-print-v1 p.84}."
  en: "The other, larger artery growing from the heart Ibn Sina calls, by Aristotle's name for it, the aorta; at its start it sends two branches round the heart and then divides into a greater descending and a smaller ascending part, and its outlet carries three hard membranes {cite:canon-ibn-sina-print-v1 p.84}."
