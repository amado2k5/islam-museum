label: { ar: "أصل الأورطي وأغشيته عند ابن سينا", en: "The origin of the aorta and its membranes in the Canon", fr: "L’origine de l’aorte et ses membranes dans le Canon", ur: "قانون میں اورطی کا مبدأ اور اس کی جھلیاں", es: "El origen de la aorta y sus membranas en el Canon" }
summary:
  ar: "الشريان الآخر الأكبر من الشريانين النابتين من القلب يسميه ابن سينا باسم أرسطوطاليس أورطي، فيرسل عند منبته شعبتين تحيطان بالقلب ثم ينقسم إلى هابط أعظم وصاعد أصغر، وعلى مخرجه ثلاثة أغشية صلبة {cite:canon-ibn-sina-print-v1 p.84}."
  en: "The other, larger artery growing from the heart Ibn Sina calls, by Aristotle's name for it, the aorta; at its start it sends two branches round the heart and then divides into a greater descending and a smaller ascending part, and its outlet carries three hard membranes {cite:canon-ibn-sina-print-v1 p.84}."
  fr: "L’autre artère issue du cœur, la plus grande, est appelée par Ibn Sina du nom que lui donne Aristote : l’aorte ; à son origine, elle émet deux branches autour du cœur, puis se divise en une partie descendante plus grande et une partie ascendante plus petite, et son orifice porte trois membranes dures {cite:canon-ibn-sina-print-v1 p.84}."
  es: "La otra arteria, más grande, que nace del corazón, es llamada por Ibn Sina, según el nombre que le dio Aristóteles, aorta; en su inicio envía dos ramas alrededor del corazón y luego se divide en una parte descendente mayor y una ascendente menor, y su salida lleva tres membranas duras {cite:canon-ibn-sina-print-v1 p.84}."
  ur: "دل سے نکلنے والی دوسری بڑی شریان ابن سینا اسے ارسطو کے نام سے شہ رگ کہتے ہیں۔ اس کے شروع میں یہ دل کے گرد دو شاخیں بھیجتا ہے اور پھر ایک بڑے نزولی اور چھوٹے چڑھنے والے حصے میں تقسیم ہو جاتا ہے، اور اس کے آؤٹ لیٹ میں تین سخت جھلییں ہوتی ہیں۔"
