summary:
  ar: "سمّاه مالك مع الأسد والنمر والذئب فيما يعقر الناس فيحل قتله في الحرم: السبع العادي فدية لا يؤخذ بها المحرم."
  en: "Malik named it with the lion, the leopard and the wolf among the beasts that attack people, whose killing is lawful in the sanctuary — the charging predator is no ransom on the pilgrim."
  ur: "مالک نے اسے شیر، تیندوے اور بھیڑیے کے ساتھ ان درندوں میں گنا جو انسان پر جھپٹتے ہیں جن کا قتل حرم میں جائز ہے۔"
  es: "Malik le puso ese nombre en honor al león, el leopardo y el lobo, entre las bestias que atacan a las personas, cuya muerte es lícita en el santuario; el depredador que ataca no supone ningún rescate para el peregrino."
  fr: "Malik l'a nommé ainsi, en référence au lion, au léopard et au loup, parmi les bêtes qui attaquent les hommes, et dont la mise à mort est licite dans le sanctuaire — le prédateur qui charge n'est pas une rançon pour le pèlerin."
