summary:
  ar: "المرداسنج هو الآنك المحرق، قابض مجفف، مادة للمراهم، قاتل إذا شرب لأنه يحبس البول وينفخ البطن ويضيق النفس، ويستعمل للجلد والقروح والعين {cite:canon-ibn-sina-print-v1 p.559} {cite:canon-ibn-sina-print-v1 p.560}."
  en: "Mirdasanj is burnt lead, astringent and drying and the base of ointments; it is deadly when drunk, for it suppresses urine, bloats the belly and tightens the breath, and is used for the skin, ulcers and the eye {cite:canon-ibn-sina-print-v1 p.559} {cite:canon-ibn-sina-print-v1 p.560}."
  ur: "مرداسنج جلایا ہوا سیسہ ہے، قابض، خشک کرنے والا اور مرہموں کی بنیاد؛ پینے سے مہلک ہے کیونکہ پیشاب روکتا، پیٹ پھلاتا اور سانس تنگ کرتا ہے، اور جلد، زخموں اور آنکھ میں استعمال ہوتا ہے {cite:canon-ibn-sina-print-v1 p.559} {cite:canon-ibn-sina-print-v1 p.560}۔"
  es: "Mirdasanj es plomo quemado, astringente y secante, y la base de ungüentos; es mortal si se bebe, ya que suprime la orina, hincha el vientre y dificulta la respiración, y se usa para la piel, las úlceras y los ojos {cite:canon-ibn-sina-print-v1 p.559} {cite:canon-ibn-sina-print-v1 p.560}."
