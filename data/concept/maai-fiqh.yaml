label:
  ar: "المائع"
  en: "Liquid (mai'): purification by liquids, their contamination and cleansing"
  ur: "مائع ⁦(سیال)⁩: مائعات سے طہارت، ان کا نجس ہونا اور پاک کرنا"
  es: "Líquido (mai'): purificación mediante líquidos, su contaminación y limpieza."
  fr: "Liquide (mai'): purification par les liquides, leur contamination et leur nettoyage"
  tr: "Sıvı"
  id: "Cairan"
summary:
  ar: "المائع في اللغة السائل والذائب، ومعناه الاصطلاحي لا يخرج عن اللغوي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13792}. ومن أحكامه: رفع الحدث وإزالة الخبث بالمائع، فجمهور الفقهاء لا يرفعان إلا بالماء المطلق، وقال غيرهم يرفع كل مائع طاهر قالع {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13793}. وتنجس المائعات: قال المالكية والشافعية والحنابلة في أولى الروايات إن ما سوى الماء المطلق يتنجس بملاقاة النجاسة، والحنفية وإحدى روايات أحمد يرون أن المائع لا ينجس إلا بما ينجس به الماء، وعند ابن عابدين حكم سائر المائعات كالماء في الأصح {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13793-13794}. وجمهور الفقهاء على أن المائع المتنجس لا يطهر، بخلاف الدهون كالزيت والسمن فإنها تطهر بالغسل عند بعضهم، والزئبق مستثنى عند بعض الشافعية والحنابلة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13795-13796}. وانتفاع الحنفية والمالكية والحنابلة بودك الميتة ممنوع، والشافعية يجيزون الاستصباح بالدهن النجس خارج المسجد مع الكراهة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13796-13797}."
  en: "Mai', in lexicon, is a liquid or a melting thing, and its technical sense does not depart from this {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13792}. Among its rulings: purification by liquids. Most jurists hold that only absolute water lifts the minor ritual impurity and removes physical impurity; others allow any pure liquid that cleans {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13793}. On contamination, the Malikis, Shafi'is and, in the stronger narration, the Hanbalis hold that any liquid other than absolute water becomes impure on touching an impurity; the Hanafis and one narration of Ahmad hold that a liquid is impure only by what makes water impure; Ibn Abidin says the stronger view is that all liquids are like water {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13793-13794}. Most jurists hold that a contaminated liquid cannot be cleansed, unlike oils and ghee which some say can be washed; mercury is excepted by some Shafi'is and Hanbalis {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13795-13796}. The Hanafis, Malikis and Hanbalis forbid using the fat of a carrion for anything, including lamps; the Shafi'is allow lighting with contaminated oil outside the mosque, with reluctance {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13796-13797}."
  ur: "مائع لغت میں سیال اور پگھلنے والی چیز کو کہتے ہیں، اور اصطلاحی معنی لغوی سے الگ نہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13792}۔ مائعات سے طہارت کے بارے میں جمہور کے نزدیک حدث دور کرنے اور نجاست زائل کرنے کے لیے صرف مطلق پانی کافی ہے، دوسرے فقہاء ہر پاک مائع کو جائز کہتے ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13793}۔ نجاست لگنے سے مائعات کے ناپاک ہونے میں مالکیہ، شافعیہ اور حنابلہ کی اولیٰ روایت کے مطابق مطلق پانی کے سوا ہر مائع نجس ہو جاتا ہے؛ حنفیہ اور احمد کی ایک روایت کے مطابق مائع وہی چیز نجس کرتی ہے جو پانی کو کرتی ہے؛ ابن عابدین کے نزدیک اصح یہ ہے کہ سب مائعات پانی کی طرح ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13793-13794}۔ جمہور کے نزدیک نجس مائع پاک نہیں ہوتا، سوائے تیل اور گھی کے جو بعض کے نزدیک دھونے سے پاک ہو جاتے ہیں؛ پارہ ⁦(زئبق)⁩ بعض شافعیہ اور حنابلہ کے نزدیک مستثنیٰ ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13795-13796}۔ حنفیہ، مالکیہ اور حنابلہ کے نزدیک مردار کی چربی سے کسی بھی طرح نفع اٹھانا منع ہے؛ شافعیہ مسجد سے باہر نجس تیل سے چراغ جلانا مکروہ کے ساتھ جائز کہتے ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13796-13797}۔"
  es: "Mai', en el léxico, es un líquido o una cosa que se derrite, y su sentido técnico no se aparta de esto {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13792}. Entre sus reglas: purificación por líquidos. La mayoría de los juristas sostienen que solo el agua absoluta levanta la impureza ritual menor y elimina la impureza física; otros permiten cualquier líquido puro que limpie {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13793}. Sobre la contaminación, los malikíes, shafi'ís y, en la narración más fuerte, los hanbalíes sostienen que cualquier líquido que no sea agua absoluta se vuelve impuro al tocar una impureza; los hanafíes y una narración de Ahmad sostienen que un líquido es impuro solo por lo que hace impuro al agua; Ibn Abidin afirma que la opinión más extendida es que todos los líquidos son como el agua {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13793-13794}. La mayoría de los juristas sostienen que un líquido contaminado no puede limpiarse, a diferencia de los aceites y el ghee, que algunos afirman que sí pueden lavarse; algunos shafiíes y hanbalíes exceptúan el mercurio {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13795-13796}. Los hanafíes, malikíes y hanbalíes prohíben el uso de la grasa de un animal carroñero para cualquier fin, incluidas las lámparas; los shafiíes permiten, con reticencia, el uso de aceite contaminado para iluminar fuera de la mezquita {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13796-13797}."
  fr: "Le terme « mai' », dans le lexique, désigne un liquide ou une substance fondante, et son sens technique ne s'en écarte pas {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13792}. Parmi ses règles: la purification par les liquides. La plupart des juristes estiment que seule l'eau pure dissipe l'impureté rituelle mineure et élimine l'impureté physique; d'autres autorisent tout liquide pur qui purifie {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13793}. Concernant la contamination, les Malikites, les Shafi'ites et, dans la version la plus rigoureuse, les Hanbalites, considèrent que tout liquide autre que l'eau pure devient impur au contact d'une impureté; les Hanafites et une version d'Ahmad estiment qu'un liquide n'est impur que par ce qui rend l'eau impure. Ibn Abidin affirme que l'avis le plus répandu est que tous les liquides sont assimilables à l'eau (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.13793-13794). La plupart des juristes estiment qu'un liquide souillé ne peut être purifié, contrairement aux huiles et au ghee qui, selon certains, peuvent être lavés; le mercure fait exception pour certains chaféites et hanbalites (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.13795-13796). Les hanafites, les malikites et les hanbalites interdisent l'utilisation de la graisse de charogne, même pour l'éclairage; les chaféites autorisent, avec réticence, l'éclairage à l'huile souillée hors de la mosquée (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.13796-13797)."
  tr: "Dilbilimde 'sıvı' 'sıvı ve çözünmüş'dür ve teknik anlamı dilbilimden farklı değildir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13792}. Hükümleri arasında kirlerin ve sıvı ile saflığın giderilmesi yer alır. Hukukçuların çoğu suyu sadece mutlak suyla uzaklaştırırken, diğerleri suyu saf, dağılmış sıvıdan uzaklaştırdığını söylemiştir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13793}. Sıvılar kirlenir: Malikiler, Şafiiler ve Hanbaliler en eski rivayetlerde, mutlak su dışındaki her şeyin kirle temas ettiğinde kirli olduğunu söyler. Hanafi ve Ahmed'in bir rivayeti, bir sıvının ancak suyu kirli yapan şeyle kirli hale geldiğini savunur. İbn Abidin'e göre, diğer sıvılar üzerindeki hüküm en doğru görüşte su gibidir {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.13793-13794}. Çoğu hukukçu, kirli sıvıların saflaşmadığını, yağ ve sade kare yağ gibi yağların ise bazılarına göre yıkanarak arıttığını, cıvanın ise bazı Şafi'ler ve Hanbaliler tarafından muaf tutulduğunu savunur {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13795-13796}. Hanefiler, Malikiler ve Hanelilerin ölü yağdan faydalanması yasaktır ve Şafiiler sabah cami dışında saf yağla vakit geçirmelerine hoşnutsuzlukla izin verir {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.13796-13797}."
  id: "Dalam linguistik, 'cair' adalah 'cair dan larut,' dan makna teknisnya tidak berbeda dari linguistik {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13792}. Di antara putusannya adalah menghilangkan kotoran dan menghilangkan kotoran dengan cairan. Mayoritas ahli hukum hanya menghilangkan air dengan air absolut, sementara yang lain mengatakan air tersebut diambil dari cairan murni yang tersebar {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13793}. Cairan menjadi najis: Maliki, syafi'i, dan Hanbal mengatakan dalam riwayat paling awal bahwa apa pun selain air mutlak menjadi tidak murni saat bersentuhan dengan ketidakmurnian. Hanafi dan salah satu riwayat Ahmad menyatakan bahwa cairan hanya menjadi kotor oleh apa yang membuat air menjadi tidak murni. Menurut Ibn Abidin, aturan tentang cairan lain serupa dengan air dalam pandangan yang paling benar {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13793-13794}. Mayoritas ahli hukum berpendapat bahwa cairan yang tidak murni tidak menjadi murni, berbeda dengan lemak seperti minyak dan ghee, yang menurut sebagian orang dimurnikan dengan dicuci, dan merkuri dibebaskan oleh beberapa Shafi'i dan Hanbal {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13795-13796}. Hanafi, Maliki, dan Hanbal dilarang mendapatkan manfaat dari minyak mati, dan para Shafi'i mengizinkan mengeluarkan minyak najis di pagi hari di luar masjid dengan ketidaksukaan {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13796-13797}."
