id: concept/maai-fiqh
class: concept
kind: legal
label:
  ar: "المائع"
  en: "Liquid (mai'): purification by liquids, their contamination and cleansing"
  ur: "مائع (سیال): مائعات سے طہارت، ان کا نجس ہونا اور پاک کرنا"
summary:
  ar: "المائع في اللغة السائل والذائب، ومعناه الاصطلاحي لا يخرج عن اللغوي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13792}. ومن أحكامه: رفع الحدث وإزالة الخبث بالمائع، فجمهور الفقهاء لا يرفعان إلا بالماء المطلق، وقال غيرهم يرفع كل مائع طاهر قالع {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13793}. وتنجس المائعات: قال المالكية والشافعية والحنابلة في أولى الروايات إن ما سوى الماء المطلق يتنجس بملاقاة النجاسة، والحنفية وإحدى روايات أحمد يرون أن المائع لا ينجس إلا بما ينجس به الماء، وعند ابن عابدين حكم سائر المائعات كالماء في الأصح {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13793-13794}. وجمهور الفقهاء على أن المائع المتنجس لا يطهر، بخلاف الدهون كالزيت والسمن فإنها تطهر بالغسل عند بعضهم، والزئبق مستثنى عند بعض الشافعية والحنابلة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13795-13796}. وانتفاع الحنفية والمالكية والحنابلة بودك الميتة ممنوع، والشافعية يجيزون الاستصباح بالدهن النجس خارج المسجد مع الكراهة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13796-13797}."
  en: "Mai', in lexicon, is a liquid or a melting thing, and its technical sense does not depart from this {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13792}. Among its rulings: purification by liquids. Most jurists hold that only absolute water lifts the minor ritual impurity and removes physical impurity; others allow any pure liquid that cleans {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13793}. On contamination, the Malikis, Shafi'is and, in the stronger narration, the Hanbalis hold that any liquid other than absolute water becomes impure on touching an impurity; the Hanafis and one narration of Ahmad hold that a liquid is impure only by what makes water impure; Ibn Abidin says the stronger view is that all liquids are like water {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13793-13794}. Most jurists hold that a contaminated liquid cannot be cleansed, unlike oils and ghee which some say can be washed; mercury is excepted by some Shafi'is and Hanbalis {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13795-13796}. The Hanafis, Malikis and Hanbalis forbid using the fat of a carrion for anything, including lamps; the Shafi'is allow lighting with contaminated oil outside the mosque, with reluctance {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13796-13797}."
  ur: "مائع لغت میں سیال اور پگھلنے والی چیز کو کہتے ہیں، اور اصطلاحی معنی لغوی سے الگ نہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13792}۔ مائعات سے طہارت کے بارے میں جمہور کے نزدیک حدث دور کرنے اور نجاست زائل کرنے کے لیے صرف مطلق پانی کافی ہے، دوسرے فقہاء ہر پاک مائع کو جائز کہتے ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13793}۔ نجاست لگنے سے مائعات کے ناپاک ہونے میں مالکیہ، شافعیہ اور حنابلہ کی اولیٰ روایت کے مطابق مطلق پانی کے سوا ہر مائع نجس ہو جاتا ہے؛ حنفیہ اور احمد کی ایک روایت کے مطابق مائع وہی چیز نجس کرتی ہے جو پانی کو کرتی ہے؛ ابن عابدین کے نزدیک اصح یہ ہے کہ سب مائعات پانی کی طرح ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13793-13794}۔ جمہور کے نزدیک نجس مائع پاک نہیں ہوتا، سوائے تیل اور گھی کے جو بعض کے نزدیک دھونے سے پاک ہو جاتے ہیں؛ پارہ (زئبق) بعض شافعیہ اور حنابلہ کے نزدیک مستثنیٰ ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13795-13796}۔ حنفیہ، مالکیہ اور حنابلہ کے نزدیک مردار کی چربی سے کسی بھی طرح نفع اٹھانا منع ہے؛ شافعیہ مسجد سے باہر نجس تیل سے چراغ جلانا مکروہ کے ساتھ جائز کہتے ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13796-13797}۔"
