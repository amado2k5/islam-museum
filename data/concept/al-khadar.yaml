  ar: "الخدر"
  en: "Numbness (khadar)"
  fr: "Engourdissement (khadar)"
  ur: "خدر"
summary:
  ar: "لفظة الخدر تستعمل في الكتب استعمالاً مختلفاً فربما جعلت لفظة الخدر مرادفة للفظة الرعشة، وأما ابن سينا وكثير من الناس فيستعملونها على هذا الوجه: الخدر علة آلية تحدث للحس اللمسي آفة إما بطلاناً وإما نقصاناً مع رعشة إن كان ⁦(فصل مفتوح، يستكمل في الحزمة التالية)⁩ {cite:canon-ibn-sina-print-v2 p.158}"
  en: "The word khadar is used variously in the books: sometimes the word numbness is made synonymous with the word tremor; but Ibn Sina and many people use it in this sense: khadar is an instrumental disorder producing a lesion in the tactile sense, either abolition or lessening, with tremor if — (the chapter opens here and continues in the next packet) {cite:canon-ibn-sina-print-v2 p.158}"
  fr: "Le mot khadar a plusieurs emplois dans les livres : on donne parfois à « engourdissement » le même sens qu’à « tremblement ». Mais Ibn Sina et beaucoup d’autres entendent par khadar une affection des organes qui produit une lésion du toucher, avec abolition ou diminution de la sensibilité, et tremblement si — (le chapitre commence ici et se poursuit dans le lot suivant) {cite:canon-ibn-sina-print-v2 p.158}"
  ur: "خدر کا لفظ کتابوں میں مختلف طرح استعمال ہوتا ہے، تو کبھی خدر کے لفظ کو رعشہ کے لفظ کا مرادف بنایا جاتا ہے؛ اور ابن سینا اور بہت سے لوگ اسے اسی معنی پر استعمال کرتے ہیں: خدر ایک آلی علت ہے جو لمسی حس میں آفت پیدا کرتی ہے، یا باطل کر کے یا کم کر کے، رعشہ کے ساتھ اگر ہو ⁦(یہ فصل یہاں کھلتا ہے اور اگلی حزم میں جاری رہے گا)⁩ {cite:canon-ibn-sina-print-v2 p.158}۔"
