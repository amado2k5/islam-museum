summary:
  ar: "ثلج في الكتاب رديء للمشايخ ولمن تتولد فيه الأخلاط الباردة، وماء الثلج يسكن وجع الأسنان الحارة، وهو ضار للعصب لحبسه البخارات الحارة عن التحلل، وضار للمعدة خصوصا التي تتولد فيها أخلاط باردة، ويعطش لجمعه الحرارة {cite:canon-ibn-sina-print-v1 p.698}"
  en: "Thalj is in the book bad for the elderly and for those in whom cold humours arise; snow water calms hot toothache, but it harms the sinew by confining hot vapours and preventing their dissolving, harms the stomach, especially one in which cold humours arise, and makes thirsty by gathering heat {cite:canon-ibn-sina-print-v1 p.698}"
  ur: "ثلج کتاب میں بوڑھوں اور ان لوگوں کے لیے برا ہے جن میں سرد خلطیں پیدا ہوتی ہیں؛ برف کا پانی گرم دانت درد کو تسکین دیتا ہے، لیکن گرم بخارات کو تحلیل سے روک کر پٹھوں کو نقصان دیتا ہے، معدے کو نقصان دیتا ہے خصوصاً جس میں سرد خلطیں پیدا ہوں، اور حرارت جمع کر کے پیاس لگاتا ہے {cite:canon-ibn-sina-print-v1 p.698}۔"
  es: "En el libro, el thalj es malo para los ancianos y para aquellos en quienes surgen humores fríos; el agua de nieve calma el dolor de muelas caliente, pero daña los tendones al contener los vapores calientes e impedir su disolución, daña el estómago, especialmente aquel en el que surgen humores fríos, y produce sed al acumular calor {cite:canon-ibn-sina-print-v1 p.698}"
