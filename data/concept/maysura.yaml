id: concept/maysura
class: concept
kind: legal
label: { ar: "المَيْسَرَة (الإنظار إلى الميسرة)", en: "Ease of means (maysura) and respite for a debtor in hardship", ur: "میسرہ (تنگدست مقروض کو مہلت دینا)" }
summary:
  ar: "الميسرة في اللغة اليسر والغنى، وهي ضد العسرة. واتفق الفقهاء على أن المدين الموسر الذي حل دينه يجب عليه الوفاء دون مماطلة، فمن امتنع مع القدرة كان ظالماً. أما المدين المعسر الذي ثبت إعساره عند القاضي أو عند الغريم فيستحب إنظاره إلى الميسرة، واستدلوا بقوله تعالى في آية الدين، وبأحاديث في فضل الإنظار: من أنظر معسراً له بكل يوم صدقة قبل أن يحل الدين، ومن أنظر معسراً أو وضع عنه أظله الله في ظله، وحديث الرجل الذي كان يتجاوز عن المعسر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15378} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15379}"
  en: "Maysura means ease and wealth, the opposite of hardship. The jurists agree that a debtor who is able to pay a due debt must pay without delay; one who refuses while able is a wrongdoer. A debtor whose insolvency is established before the judge or the creditor should be given respite until he is at ease. The jurists cite the verse on debt and hadiths praising respite: whoever grants respite to a debtor in hardship earns a charity for each day before the debt falls due, and whoever grants respite or remits the debt is shaded by God; and the story of the man who forgave those in hardship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15378} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15379}"
  ur: "میسرہ کا مطلب آسودگی اور مال کی فراوانی ہے، جو تنگی کی ضد ہے۔ فقہاء کا اتفاق ہے کہ جو مقروض ادا کرنے کی قدرت رکھتا ہو اور قرض کی مدت پوری ہو جائے تو اس پر ٹال مٹول کے بغیر ادائیگی لازم ہے۔ جو تنگدست ثابت ہو جائے اس کے لیے آسانی تک مہلت دینا مستحب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15378} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15379}"
