label: { ar: "المَيْسَرَة ⁦(الإنظار إلى الميسرة)⁩", en: "Ease of means (maysura) and respite for a debtor in hardship", ur: "میسرہ ⁦(تنگدست مقروض کو مہلت دینا)⁩", es: "Facilidad de medios (maysura) y alivio para un deudor en dificultades.", fr: "Facilité d'accès (maysura) et répit pour un débiteur en difficulté" }
summary:
  ar: "الميسرة في اللغة اليسر والغنى، وهي ضد العسرة. واتفق الفقهاء على أن المدين الموسر الذي حل دينه يجب عليه الوفاء دون مماطلة، فمن امتنع مع القدرة كان ظالماً. أما المدين المعسر الذي ثبت إعساره عند القاضي أو عند الغريم فيستحب إنظاره إلى الميسرة، واستدلوا بقوله تعالى في آية الدين، وبأحاديث في فضل الإنظار: من أنظر معسراً له بكل يوم صدقة قبل أن يحل الدين، ومن أنظر معسراً أو وضع عنه أظله الله في ظله، وحديث الرجل الذي كان يتجاوز عن المعسر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15378} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15379}"
  en: "Maysura means ease and wealth, the opposite of hardship. The jurists agree that a debtor who is able to pay a due debt must pay without delay; one who refuses while able is a wrongdoer. A debtor whose insolvency is established before the judge or the creditor should be given respite until he is at ease. The jurists cite the verse on debt and hadiths praising respite: whoever grants respite to a debtor in hardship earns a charity for each day before the debt falls due, and whoever grants respite or remits the debt is shaded by God; and the story of the man who forgave those in hardship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15378} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15379}"
  ur: "میسرہ کا مطلب آسودگی اور مال کی فراوانی ہے، جو تنگی کی ضد ہے۔ فقہاء کا اتفاق ہے کہ جو مقروض ادا کرنے کی قدرت رکھتا ہو اور قرض کی مدت پوری ہو جائے تو اس پر ٹال مٹول کے بغیر ادائیگی لازم ہے۔ جو تنگدست ثابت ہو جائے اس کے لیے آسانی تک مہلت دینا مستحب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15378} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15379}"
  es: "Maysura significa facilidad y riqueza, lo opuesto a la adversidad. Los juristas coinciden en que un deudor que puede pagar una deuda vencida debe hacerlo sin demora; quien se niega a pagar estando en condiciones de hacerlo comete una injusticia. A un deudor cuya insolvencia se establece ante el juez o el acreedor se le debe conceder un plazo hasta que se recupere. Los juristas citan el versículo sobre la deuda y hadices que alaban el plazo: quien concede un plazo a un deudor en apuros obtiene una caridad por cada día antes de que venza la deuda, y quien concede un plazo o condona la deuda está protegido por Dios; y la historia del hombre que perdonó a los afligidos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15378} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15379}"
  fr: "Maysura signifie aisance et prospérité, à l'opposé de la difficulté. Les juristes s'accordent à dire qu'un débiteur solvable doit s'acquitter de sa dette sans délai; celui qui refuse de payer alors qu'il en a les moyens commet une injustice. Un débiteur dont l'insolvabilité est établie devant le juge ou le créancier doit bénéficier d'un délai jusqu'à ce que sa situation financière s'améliore. Les juristes citent le verset relatif à la dette et les hadiths faisant l'éloge du délai: quiconque accorde un délai à un débiteur en difficulté mérite une aumône pour chaque jour de retard, et quiconque accorde un délai ou remet la dette est protégé par Dieu; et l'histoire de l'homme qui pardonna à ceux qui étaient dans l'épreuve. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15378} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15379}"
