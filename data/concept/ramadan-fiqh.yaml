label:
  ar: "رمضان"
  en: "Ramadan (the month of fasting): its name, the sighting of its crescent, its special features, and the virtues and acts of worship recommended in it"
  ur: "رمضان ⁦(ماہ صیام)⁩"
  es: "Ramadán (el mes de ayuno): su nombre, la observación de su luna creciente, sus características especiales y las virtudes y actos de adoración recomendados en él."
summary:
  ar: "رمضان اسم للشهر المعروف، قيل سمي بذلك لوقوعه في أيام رمض الحر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8986} ويثبت شهر رمضان برؤية هلاله، فإن تعذرت أُكمل شعبان ثلاثين يوما، واختلف الفقهاء في عدد الشهود: فالحنفية والشافعية والحنابلة يكتفون بعدل واحد، والمالكية لا يثبتونه إلا بعدلين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8986} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8987} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8988} ويتفق الفقهاء على اعتبار شهادة عدلين في هلال شوال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8988} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8989} ويختص رمضان بنزول القرآن، وبفرضية صيامه وهي مجمع عليها، وبفضل الصدقة فيه، وبليلة القدر، وبسنية التراويح والاعتكاف في العشر الأواخر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8989} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8990} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8991} وتستحب فيه مدارسة القرآن، ويتأكد فيه تفطير الصائم والعمرة، وقد اختلف الفقهاء في الأفضل بين التكسب والتفرغ للعبادة فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8991} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8992}"
  en: "Ramadan is the name of the known month; it is said to have been named for the season of intense heat when the Arabs gave the months their names. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8986} The month is established by sighting the crescent; if that is impossible, Sha'ban is completed to thirty days. The jurists differ on the number of witnesses: the Hanafis, Shafi'is and Hanbalis accept one just witness, while the Malikis require two. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8986} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8987} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8988} The jurists agree that the end of Ramadan (the crescent of Shawwal) needs two witnesses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8988} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8989} Ramadan is distinguished by the revelation of the Qur'an in it, by the obligation of its fast (agreed by the community), by the excellence of charity in it, by the night of power, and by the recommended taraweeh and i'tikaf in its last ten nights. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8989} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8990} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8991} Studying and reciting the Qur'an are especially recommended in it, feeding those who are fasting and the lesser pilgrimage are especially stressed, and the jurists differ on whether earning a living or devoting oneself to worship is better in it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8991} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8992}"
  ur: "رمضان ماہ صیام ہے؛ اس کا چاند دیکھ کر ثبوت ہوتا ہے، ورنہ شعبان کے تیس دن پورے کیے جاتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8986} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8989} اس میں قرآن کا نزول، روزے کی فرضیت، شب قدر، تراویح اور آخری عشرے کا اعتکاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8989} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8990}"
  es: "Ramadán es el nombre del mes conocido; se dice que fue nombrado por la estación de calor intenso cuando los árabes daban sus nombres a los meses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8986} El mes se establece al observar la luna creciente; si eso es imposible, Sha'ban se completa a treinta días. Los juristas difieren en el número de testigos: los Hanafis, Shafi'is y Hanbalis aceptan un testigo justo, mientras que los Malikis requieren dos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8986} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8987} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8988} Los juristas coinciden en que el final de Ramadán (la luna creciente de Shawwal) necesita dos testigos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8988} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8989} El Ramadán se distingue por la revelación del Corán en él, por la obligación de su ayuno (acordado por la comunidad), por la excelencia de la caridad en él, por la noche del poder y por el taraweeh y el i'tikaf recomendados en sus últimas diez noches. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8989} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8990} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8991} Se recomienda especialmente estudiar y recitar el Corán, se enfatiza especialmente la alimentación de quienes ayunan y la peregrinación menor, y los juristas difieren sobre si es mejor ganarse la vida o dedicarse a la adoración. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8991} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8992}"
