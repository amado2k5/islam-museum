  ar: "الزيتون والزيت المعتصر منه؛ زيت الأنفاق من الزيتون الفجّ أجود الزيت للأصحاء، والزيت العتيق والعكر والورق والصمغ لها مواضع في الكتاب. {cite:canon-ibn-sina-print-v1 p.469}"
