id: concept/afat-al-shamm
class: concept
kind: scientific
label:
  ar: آفة الشم
  en: The disorder of smell
  ur: شمّ کی آفت
summary:
  ar: الشم تدخله الآفة كسائر الأفعال فلا يخلو إما أن يبطل وإما أن يضعف وإما أن يتغير ويفسد، وبطلانه وضعفه إما عن الطيب والمنتن جميعاً وإما عن حس أحدهما، وفساده إما أن يشم روائح خبيئة غير موجودة وإما أن يستطيب غير المستطاب ويكره المستطاب؛ وسببه سوء مزاج مفرد أو خلط رديء في مقدم الدماغ وبطنيه أو في الحلمتين، أو شدة في العظم المشاشي عن خلط أو ريح أو ورم أو سرطان أو نبات لحم زائد أو سدة في الحجاب الذي فوقه، وكثيراً ما يحدث من أدوية استعملت أو قطورات سخنت المزاج أو أخدرت وبردت، وقد يكون من ضربة أو سقطة {cite:canon-ibn-sina-print-v2 p.235}
  en: 'Smell suffers disorder like every other faculty: it is either abolished, weakened, or changed and corrupted. Abolition and weakness may be toward both the pleasant and the foul, or toward the sense of one of them; corruption is of two kinds — smelling hidden odours that are not there, or finding foul smells pleasant and hating the pleasant. Its cause is a bad simple temperament or a bad humour in the front of the brain and its ventricles or in the mamillary pair themselves, or hardness in the sieve bone from a humour, wind, swelling, cancer, a growth of superfluous flesh, or an occlusion in the membrane above it; it often arises from drugs used or drops dripped that heated or numbed and chilled the temperament, and may come from a blow or a fall harming the bone {cite:canon-ibn-sina-print-v2 p.235}'
  ur: 'شمّ کو بھی ہر فعل کی طرح آفت پہنچتی ہے: یا تو بالکل باطل ہوتی ہے یا کمزور یا بگڑ کر فاسد؛ بطلان اور کمزوری خوشبو اور بدبو دونوں کے بارے میں ہو سکتی ہے یا صرف ایک کے؛ اور فساد دو قسم کا ہے — چھپی ہوئی بو محسوس کرنا جو موجود نہیں، یا ناپسندیدہ بو کو خوشبو سمجھنا اور خوشبو سے کراہت؛ اس کا سبب یا تو مقدم دماغ اور اس کے بطینوں یا خود دونوں چوچی نما زائدوں میں برا مفرد مزاج یا بری مخلوط ہے، یا چھالنی ہڈی میں سختی کسی خلط، ریح، ورم، سرطان، اضافی گوشت کے نبات یا اوپر کے پردے کی سدہ سے؛ اور اکثر استعمال کی گئی ادویہ یا ٹپکائے گئے قطروں سے پیدا ہوتی ہے جو مزاج کو گرم یا سن اور ٹھنڈا کر دیتے ہیں، اور ضرب یا گرنے سے بھی ہو سکتی ہے {cite:canon-ibn-sina-print-v2 p.235}'
