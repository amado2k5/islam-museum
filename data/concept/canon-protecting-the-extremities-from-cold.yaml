id: concept/canon-protecting-the-extremities-from-cold
class: concept
kind: scientific
label:
  ar: "حفظ الأطراف عن ضرر البرد عند ابن سينا"
  en: "Protecting the extremities from cold in the Canon"
  fr: "Protection des extrémités contre le froid dans le Canon"
  ur: "سردی کے ضرر سے اطراف کی حفاظت قانون میں"
  es: "Protección de las extremidades contra el frío en el Canon"
summary:
  ar: "يفرد ابن سينا الفصل الخامس لحفظ الأطراف عن ضرر البرد: يدلكها المسافر أولاً حتى تسخن ثم يطليها بدهن حار من الأدهان العطرة، ولا يضيق الخف بحيث لا يتحرك العضو، فإن حركة العضو من أسباب دفع البرد، ويغشى العضو بكاغد وشعر أو وبر، ويحذر من فقدان الحس {cite:canon-ibn-sina-print-v1 p.264}."
  en: "Ibn Sina devotes the fifth chapter to protecting the extremities from the harm of cold: the traveller first rubs them until warm and then coats them with a hot oil among the scented oils, does not make the boot so tight that the limb cannot move, since movement is one of the things that repel cold, covers the limb with paper and hair or fur, and watches for loss of sensation {cite:canon-ibn-sina-print-v1 p.264}."
  fr: "Au chapitre 5, Ibn Sina décrit friction réchauffante puis huile aromatique chaude, chaussure permettant le mouvement qui repousserait le froid, couverture de papier et poils ou fourrure, et surveillance de la perte de sensation {cite:canon-ibn-sina-print-v1 p.264}."
  es: "Ibn Sina dedica el quinto capítulo a proteger las extremidades del daño del frío: el viajero primero las frota hasta que se calientan y luego las cubre con un aceite caliente entre los aceites perfumados, no aprieta tanto la bota que la extremidad no pueda moverse, ya que el movimiento es una de las cosas que repelen el frío, cubre la extremidad con papel y pelo o piel, y vigila la pérdida de sensibilidad {cite:canon-ibn-sina-print-v1 p.264}."
  ur: "ابن سینا نے پانچواں باب انتہاؤں کو سردی کے نقصان سے بچانے کے لیے مختص کیا ہے: مسافر پہلے ان کو گرم ہونے تک رگڑتا ہے اور پھر خوشبو دار تیلوں کے درمیان گرم تیل سے لیپ کرتا ہے، بوٹ کو اتنا تنگ نہیں کرتا کہ اعضاء حرکت نہ کرسکے، کیونکہ حرکت سردی کو دور کرنے والی چیزوں میں سے ایک ہے، اعضاء کو ڈھانپتی ہے اور بالوں کے جھڑنے یا جھڑنے کے لیے۔ {حوالہ:کینن ابن سینا پرنٹ v1 صفحہ 264}۔"
