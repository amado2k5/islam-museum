label: { ar: "حفظ الأطراف عن ضرر البرد عند ابن سينا", en: "Protecting the extremities from cold in the Canon", ur: "سردی کے ضرر سے اطراف کی حفاظت قانون میں" }
summary:
  ar: "يفرد ابن سينا الفصل الخامس لحفظ الأطراف عن ضرر البرد: يدلكها المسافر أولاً حتى تسخن ثم يطليها بدهن حار من الأدهان العطرة، ولا يضيق الخف بحيث لا يتحرك العضو، فإن حركة العضو من أسباب دفع البرد، ويغشى العضو بكاغد وشعر أو وبر، ويحذر من فقدان الحس {cite:canon-ibn-sina-print-v1 p.264}."
  en: "Ibn Sina devotes the fifth chapter to protecting the extremities from the harm of cold: the traveller first rubs them until warm and then coats them with a hot oil among the scented oils, does not make the boot so tight that the limb cannot move, since movement is one of the things that repel cold, covers the limb with paper and hair or fur, and watches for loss of sensation {cite:canon-ibn-sina-print-v1 p.264}."
