label:
  ar: "الأفسنتين"
  en: "Afsantin (wormwood in Arabic pharmacology)"
  fr: "Afsantin (l’absinthe en pharmacologie arabe)"
  es: "Afsantina (ajenjo en la farmacología árabe)"
summary:
  ar: "اسم عربي معرّب عن اليونانية للشيح العادي (Artemisia absinthium) وأنواع متشابهة، ويُسمى في كتب الطب قشوث رومي؛ عرفه الصيادلة المسلمون عن المصادر الكلاسيكية، وكانت أجوده ما ينبت في صور وطرسوس، واستعملوا زهرته الصفراء في الطب {cite:encyclopaedia-of-islam-2 vol. 1 p. 261}."
  en: "Arabic term, from the Greek apsinthion, for common wormwood (Artemisia absinthium) and similar plants; in medical writings it is called kashuth rumi. Muslim pharmacologists took its uses from classical sources, rated the wormwood of Tyre and Tarsus best, and used its yellow flower as a tonic, vermifuge and diuretic {cite:encyclopaedia-of-islam-2 vol. 1 p. 261}."
  fr: "Terme arabe, du grec apsinthion, désignant l’absinthe commune (Artemisia absinthium) et des plantes similaires ; dans les écrits médicaux, elle est appelée kashuth rumi. Les pharmacologues musulmans en empruntèrent les usages aux sources classiques, jugeaient l’absinthe de Tyr et de Tarse la meilleure, et employaient sa fleur jaune comme tonique, vermifuge et diurétique {cite:encyclopaedia-of-islam-2 vol. 1 p. 261}."
  es: "Término árabe, derivado del griego apsinthion, para el ajenjo común (Artemisia absinthium) y plantas similares; en textos médicos se le denomina kashuth rumi. Los farmacólogos musulmanes tomaron sus usos de fuentes clásicas, consideraron que el ajenjo de Tiro y Tarso era el mejor y utilizaron su flor amarilla como tónico, vermífugo y diurético {cite:encyclopaedia-of-islam-2 vol. 1 p. 261}."
