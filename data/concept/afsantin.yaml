label:
  ar: "الأفسنتين"
  en: "Afsantin (wormwood in Arabic pharmacology)"
summary:
  ar: "اسم عربي معرّب عن اليونانية للشيح العادي (Artemisia absinthium) وأنواع متشابهة، ويُسمى في كتب الطب قشوث رومي؛ عرفه الصيادلة المسلمون عن المصادر الكلاسيكية، وكانت أجوده ما ينبت في صور وطرسوس، واستعملوا زهرته الصفراء في الطب {cite:encyclopaedia-of-islam-2 vol. 1 p. 261}."
  en: "Arabic term, from the Greek apsinthion, for common wormwood (Artemisia absinthium) and similar plants; in medical writings it is called kashuth rumi. Muslim pharmacologists took its uses from classical sources, rated the wormwood of Tyre and Tarsus best, and used its yellow flower as a tonic, vermifuge and diuretic {cite:encyclopaedia-of-islam-2 vol. 1 p. 261}."
