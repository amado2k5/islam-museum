label:
  ar: النبي والرسول (الفرق بين البلاغ والأسوة)
  en: Prophet and messenger (the difference between conveying and exemplifying)
summary:
  ar: "يرى الشعراوي أن الرسول مرسل للتبليغ والأسوة معاً، أي يحمل المنهج ويطبقه ثم يبلّغه، وأن النبي مرسل للأسوة السلوكية، فلا يكون واسطة تبليغ. ويبيّن أن الحكمة في الكتاب والنبوة والحكم قد تكون لمن ليس رسولاً ولا نبياً، ويستشهد بوصية لقمان لابنه، ويعرض ذلك دون حكم {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1561}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1562}."
  en: "Sha'rawi holds that a messenger is sent both to convey and to serve as an example, carrying the law, applying it and then delivering it, while a prophet is sent to serve as an example in conduct and is not an intermediary of conveyance. He adds that wisdom may be given to someone who is neither prophet nor messenger, and cites the advice of Luqman to his son. He presents this without a verdict {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1561}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1562}."
