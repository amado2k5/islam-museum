issue:
  ar: "هل الرسول والنبي شيئان متمايزان في الوظيفة، أم لفظان لمعنى واحد؟"
  en: "Are the messenger and the prophet distinct in function, or two words for one office?"
perspectives:
- tradition: sunni
  id: sunni-sharawi-function
  stance:
    ar: "الرسول للتبليغ والأسوة، والنبي للأسوة السلوكية"
    en: "The messenger conveys and exemplifies; the prophet exemplifies in conduct"
  summary:
    ar: "يقرر الشعراوي أن كلا منهما مرسل من الله، وأن الرسول مرسل للبلاغ والأسوة، وأن النبي مرسل للأسوة فقط، ويقول إن الحاجة إلى الأسوة السلوكية تتضح في زمن يكون فيه المنهج موجوداً ولكن حمل النفس عليه مفقود {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1562}."
    en: "Sha'rawi holds that both are sent by God, that the messenger is sent for conveyance and example, and that the prophet is sent for example only. He says the need for exemplary conduct is clear in a time when the law exists but the soul is not made to keep it {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1562}."
