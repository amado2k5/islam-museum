id: concept/ifas
class: concept
kind: legal
label:
  ar: "العِفَاص"
  en: "The wrapping of found property (ifas) and its use as a mark"
  ur: "عفاص (لقطہ کا ظرف)"
summary:
  ar: "العفاص في اللغة الوعاء الذي تكون فيه النفقة من جلد أو خرقة أو غيرهما، ويطلق على الجلد الذي يلبس رأس القارورة، وهو في الاصطلاح الوعاء الذي تكون فيه اللقطة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11668}. والعفاص من علامات معرفة اللقطة، والأصل فيه الحديث في اللقطة بأن يعرف الواكئ والعفاص، ويعرّفها سنة، ثم يمسكها أو ينفقها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11669}. ولا يكفي عند جمهور الفقهاء معرفة العفاص وحده لاستحقاق اللقطة، بل ينضم إليه الوكاء والوزن والعدد والجنس أو أغلبها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11669} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11670}. وفصل المالكية فيمن عرف العفاص والوكاء، أو العفاص فقط، فتدفع اللقطة في الأولى دون يمين على المشهور، ولا تدفع في الثانية حالاً بل يُنتظر غيره، وذكر أصبغ اليمين لمن عرف العدد والوزن {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11670}."
  en: "In the lexicon, ifas is the container in which money is kept, of leather or cloth, and it is also the cap of a bottle; as a term it is the container in which found property is kept {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11668}. The ifas is one of the marks by which found property is recognised, on the basis of a prophetic instruction to know the tie and the container, announce the find for a year and then keep it or let it go {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11669}. Most jurists hold that knowing the ifas alone does not entitle a claimant to the property; it must be joined with the other marks, such as the tie, the weight, the number, the kind, or most of them {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11669} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11670}. The Malikis distinguish: a claimant who knows the ifas and the tie is given the find without oath, on the preferred view; one who knows only the ifas must wait while others may come; Asbagh requires an oath from one who knows the count and weight {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11670}."
