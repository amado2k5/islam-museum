label:
  ar: "العِفَاص"
  en: "The wrapping of found property (ifas) and its use as a mark"
  ur: "عفاص ⁦(لقطہ کا ظرف)⁩"
  es: "El envoltorio de la propiedad encontrada (ifas) y su uso como marca"
  fr: "L'emballage des biens trouvés (ifas) et son utilisation comme marque"
  tr: "Al-Afas"
  id: "Al-Afas"
summary:
  ar: "العفاص في اللغة الوعاء الذي تكون فيه النفقة من جلد أو خرقة أو غيرهما، ويطلق على الجلد الذي يلبس رأس القارورة، وهو في الاصطلاح الوعاء الذي تكون فيه اللقطة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11668}. والعفاص من علامات معرفة اللقطة، والأصل فيه الحديث في اللقطة بأن يعرف الواكئ والعفاص، ويعرّفها سنة، ثم يمسكها أو ينفقها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11669}. ولا يكفي عند جمهور الفقهاء معرفة العفاص وحده لاستحقاق اللقطة، بل ينضم إليه الوكاء والوزن والعدد والجنس أو أغلبها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11669} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11670}. وفصل المالكية فيمن عرف العفاص والوكاء، أو العفاص فقط، فتدفع اللقطة في الأولى دون يمين على المشهور، ولا تدفع في الثانية حالاً بل يُنتظر غيره، وذكر أصبغ اليمين لمن عرف العدد والوزن {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11670}."
  en: "In the lexicon, ifas is the container in which money is kept, of leather or cloth, and it is also the cap of a bottle; as a term it is the container in which found property is kept {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11668}. The ifas is one of the marks by which found property is recognised, on the basis of a prophetic instruction to know the tie and the container, announce the find for a year and then keep it or let it go {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11669}. Most jurists hold that knowing the ifas alone does not entitle a claimant to the property; it must be joined with the other marks, such as the tie, the weight, the number, the kind, or most of them {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11669} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11670}. The Malikis distinguish: a claimant who knows the ifas and the tie is given the find without oath, on the preferred view; one who knows only the ifas must wait while others may come; Asbagh requires an oath from one who knows the count and weight {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11670}."
  es: "En el léxico, ifas es el recipiente en el que se guarda el dinero, de cuero o tela, y también es la tapa de una botella; como término es el recipiente en el que se guarda la propiedad encontrada {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11668}. El ifas es una de las marcas por las cuales se reconoce la propiedad encontrada, sobre la base de una instrucción profética de conocer el vínculo y el recipiente, anunciar el hallazgo durante un año y luego conservarlo o dejarlo ir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11669}. La mayoría de los juristas sostienen que conocer el ifas por sí solo no da derecho a un reclamante a la propiedad; debe unirse con las otras marcas, como el lazo, el peso, el número, el tipo o la mayoría de ellas {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11669} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11670}. Los Malikis distinguen: a un reclamante que conoce los ifas y el lazo se le da el hallazgo sin juramento, en la opinión preferida; uno que conoce solo los ifas debe esperar mientras otros pueden venir; Asbagh requiere un juramento de uno que conoce el conteo y el peso {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11670}."
  fr: "Dans le lexique, l'ifas désigne le récipient, en cuir ou en tissu, dans lequel on conserve l'argent, ainsi que le bouchon d'une bouteille; il désigne également le contenant dans lequel on conserve les objets trouvés (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.11668). L'ifas est l'un des signes permettant d'identifier les objets trouvés, conformément à une instruction prophétique enjoignant de connaître le lien et le contenant, de déclarer la découverte pendant un an, puis de la conserver ou de la laisser (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.11669). La plupart des juristes estiment que la simple connaissance de l'ifas ne confère pas à celui qui la réclame le droit à la propriété. Il doit être associé aux autres marques, telles que le lien, le poids, le nombre, l'espèce, ou la plupart d'entre elles {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11669} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11670}. Les Malikites font la distinction suivante: selon l'avis privilégié, le demandeur qui connaît les ifas et le lien reçoit la trouvaille sans serment; celui qui ne connaît que les ifas doit attendre que d'autres se présentent; l'Asbagh exige un serment de celui qui connaît le nombre et le poids {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11670}."
  ur: "لغت میں افاس وہ برتن ہے جس میں رقم رکھی جاتی ہے، چمڑے یا کپڑے کی، اور یہ بوتل کی ٹوپی بھی ہے۔ ایک اصطلاح کے طور پر یہ وہ کنٹینر ہے جس میں جائیداد رکھی گئی ہے {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11668}۔ افاس ان نشانات میں سے ایک ہے جس کے ذریعے ملنے والی جائیداد کو پہچانا جاتا ہے، ایک نبوی ہدایت کی بنیاد پر ٹائی اور کنٹینر کو جاننے کے لیے، ایک سال کے لیے تلاش کا اعلان کریں اور پھر اسے رکھیں یا چھوڑ دیں۔ اکثر فقہاء کا خیال ہے کہ صرف افاس کو جاننا ہی جائیداد کا دعویدار نہیں بنتا۔ اسے دوسرے نشانات کے ساتھ جوڑا جانا چاہیے، جیسے کہ ٹائی، وزن، تعداد، قسم، یا ان میں سے اکثر {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11669} مالکی فرق کرتے ہیں: ایک دعویدار جو افاس اور ٹائی کو جانتا ہے، ترجیحی نقطہ نظر پر، قسم کے بغیر تلاش کیا جاتا ہے؛ جو شخص صرف افاس کو جانتا ہے اسے انتظار کرنا چاہئے جب تک کہ دوسرے آ سکتے ہیں۔ اصبغ کے لیے ایسے شخص سے قسم کی ضرورت ہوتی ہے جو گنتی اور وزن کا علم رکھتا ہو۔"
  tr: "Dilde, 'al-'afas' nafakanın deri, bez veya diğer eşyalardan yapıldığı kaptır. Şişenin üstüne giyilen deriyi ifade eder. Terminoloji açısından, 'al-'afas'ın ('al-laqh-mawsua-kuwaitiyya-noor-v3 s.11668} 'al-'afas' olduğu kaptır. 'al-'afas', 'al-'ul-' (sözde) ve 'al-'afas'ı bildiğinin işaretidir; o zaman kişinin onları tutması veya harcaması gerekir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11669}. Hukukçuların çoğuna göre, 'al-'Afas'ı bilmek tek başına ceza için yeterli değildir; bunun yerine, 'al-'Afas' ('al-'aws') dahil edilir; ağırlık, sayı, cinsiyet veya çoğu dahil edilir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11669} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11670}. Malikiler, 'al-'afas ile 'waka'yı bilenleri ya da sadece 'al-'afas'ları ayırır: ilk durumda, 'al-'afas' bilinen afas üzerine yemin edilmeden ödenir, ikinci durumda ise hemen ödenmez, beklenmektedir. Yemin, sayı ve ağırlığı bilenler için belirtilir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11670}."
  id: "Dalam bahasa, 'al-'afas' adalah wadah di mana tunjangan dibuat dari kulit, kain lap, atau barang lain. Ini merujuk pada kulit yang dikenakan di atas botol. Dalam terminologi, ini adalah wadah di mana 'al-'afas' ('al-laqh-mawsua-kuwaitiyya-noor-v3 hlm.11668} adalah 'al-'afas'. 'al-'afas' adalah tanda mengetahui 'al-'ul-'(seharusnya) dan 'al-'afas', maka dia harus memegang atau menggunakannya {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11669}. Menurut mayoritas ahli hukum, mengetahui 'al-'Afas saja tidak cukup untuk memenuhi syarat untuk dipukul; sebaliknya, 'al-'Afas' ('al-'aws) termasuk, berat, jumlah, jenis kelamin, atau sebagian besar {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11669} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11670}. Suku Malik membedakan antara mereka yang mengenal 'al-'afas dan 'waka', atau hanya 'al-'afas: dalam kasus pertama, 'al-'afas' dibayar tanpa sumpah pada yang terkenal, dan dalam kasus kedua tidak langsung dibayar tetapi ditunggu. Sumpah ini disebutkan bagi mereka yang mengetahui jumlah dan beratnya {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11670}."
