id: concept/al-izdiwajiyya-al-lughawiyya-fi-al-arabiyya
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-lisan]
label:
  ar: "الازدواجية اللغوية في العربية"
  en: "Diglossia in Arabic"
  ur: "عربی میں لسانی دوگانگی"
  fr: "La diglossie en arabe"
  es: "La diglosia en árabe"
summary:
  ar: "ما يقوله ملخص بحثي عن الازدواجية اللغوية في العربية: تعريف فرغسون سنة 1959 لحال لغوية تتعايش فيها صورتان من اللغة الواحدة بوظائف متكاملة، والعربية المحكية المثقفة عند ميتشل والحسن، وسلّم المستويات الخمسة عند السعيد بدوي سنة 1973، ورأي هولز سنة 2004 في أن الفصحى والعاميات ليست خانات مغلقة. لم يفتح المتحف الصفحات التي يستشهد بها."
  en: "What a research summary says of diglossia in Arabic: Ferguson's 1959 definition of a stable situation in which two varieties of one language have complementary functions, Educated Spoken Arabic in Mitchell and El-Hassan, El-Said Badawi's five levels of 1973, and Holes's view of 2004 that standard Arabic and the dialects are not closed compartments. The museum did not open the pages it cites."
  ur: "ایک تحقیقی خلاصہ عربی میں لسانی دوگانگی کے بارے میں جو کہتا ہے: فرگوسن کی 1959 کی تعریف کہ ایک مستحکم صورت حال میں ایک ہی زبان کی دو قسمیں تکمیلی کاموں کے ساتھ جیتی ہیں، میچل اور الحسن کے ہاں تعلیم یافتہ طبقے کی بول چال کی عربی، السعید بدوی کے 1973 کے پانچ درجے، اور ہولز کی 2004 کی رائے کہ فصیح عربی اور بولیاں بند خانے نہیں۔ عجائب گھر نے جن صفحات کا حوالہ دیا انہیں نہیں کھولا۔"
  fr: "Ce que dit un résumé de recherche de la diglossie en arabe : la définition de Ferguson en 1959 d'une situation stable où deux variétés d'une même langue ont des fonctions complémentaires, l'arabe parlé éduqué chez Mitchell et El-Hassan, les cinq niveaux d'El-Said Badawi en 1973, et l'avis de Holes en 2004 selon lequel l'arabe standard et les dialectes ne sont pas des compartiments clos. Le musée n'a pas ouvert les pages qu'il cite."
  es: "Lo que dice un resumen de investigación sobre la diglosia en árabe: la definición de Ferguson en 1959 de una situación estable en que dos variedades de una misma lengua tienen funciones complementarias, el árabe hablado educado en Mitchell y El-Hassan, los cinco niveles de El-Said Badawi en 1973, y la opinión de Holes en 2004 de que el árabe estándar y los dialectos no son compartimentos cerrados. El museo no abrió las páginas que cita."
