  en: "Aqhwan (the white and the red kinds of this flower)"
  ur: "اقحوان"
summary:
  ar: "الأقحوان في الكتاب منه أبيض ومنه أشقر والأبيض أقوى، وهو قضبان دقيقة عليها زهر أبيض، حادّ الرائحة والطعم؛ حارّ في الثالثة يابس في الثانية، مسخّن منضج يفتح السدد، وفي الأحمر قبض ومنع للسيلان؛ ينفع من أوجاع الأذن والتواء العصب والنواصير والقروح الخبيثة والربو، ويحلّل الدم الجامد في المعدة والمثانة، ويفتّت الحصاة، ويدرّ البول بقوة، وينفع من أورام المقعدة والبواسير والقولنج ووجع المثانة وصلابة الطحال؛ ويذكر الكتاب فيه أقوالاً عن الطمث والرحم في فقرة موسومة معلّقة لحكم المؤسس {cite:canon-ibn-sina-print-v1 pp.354-355}"
  en: "In the book aqhwan has a white kind and a yellow-red kind, the white being stronger; it is fine stalks bearing a white flower, sharp in smell and taste; hot in the third degree and dry in the second, warming, ripening and opening obstructions, and in the red kind there is astringency and holding back of flows; it is listed for ear pains, twisting of the nerve, fistulas, malignant ulcers and asthma, it dissolves clotted blood in the stomach and bladder, crushes stone, promotes urine strongly, and helps swellings of the anus, piles, colic, pain of the bladder and hardness of the spleen; the book also gives statements on the menses and the womb in a labelled section held for the founder's ruling {cite:canon-ibn-sina-print-v1 pp.354-355}"
  ur: "اقحوان کتاب میں ایک سفید قسم کا ہے اور ایک زردی مائل سرخ، اور سفید زیادہ قوی ہے؛ یہ باریک ٹہنیاں ہیں جن پر سفید پھول ہے، تیز بو اور تیز ذائقے والا؛ تیسرے درجے میں گرم اور دوسرے میں خشک ہے، گرم کرنے والا، پکانے والا اور رکاوٹیں کھولنے والا، اور سرخ قسم میں قبض اور بہاؤ روکنے کی صفت ہے؛ کان کے دردوں، عصب کے مڑنے، ناسوروں، خبیث زخموں اور دمے میں مذکور ہے، معدے اور مثانے کے جمے ہوئے خون کو تحلیل کرتا ہے، پتھری کو توڑتا ہے، پیشاب کو قوت سے جاری کرتا ہے، اور مقعد کے ورم، بواسیر، قولنج، مثانے کے درد اور تلی کی سختی میں مفید ہے؛ کتاب حیض اور رحم کے بارے میں اقوال موسوم حصے میں دیتی ہے جو بانی کے فیصلے کے لیے موقوف ہے {cite:canon-ibn-sina-print-v1 pp.354-355}۔"
