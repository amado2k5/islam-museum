label: { ar: "عروق الرجل المفصودة عند ابن سينا", en: "The veins of the leg in venesection in the Canon", ur: "قانون میں پاؤں کی کھولی جانے والی رگیں" , fr: "Les veines de la jambe dans la saignée selon le Canon" }
summary:
  fr: "Ibn Sina nomme les veines de la jambe que l'on ouvre : la veine sciatique, la saphène, la veine du creux du genou et celle qui passe derrière le tendon d'Achille. Il précise leur emplacement et leurs usages contre la sciatique, la goutte et les hémorroïdes, ainsi que pour provoquer les règles {cite:canon-ibn-sina-print-v1 p.297}."
  ar: "يذكر ابن سينا عروق الرجل التي تفصد: عرق النسا والصافن وعرق مأبض الركبة والعرق خلف العرقوب، وموضع كل منها ومنافعه في أوجاع عرق النسا والنقرس والبواسير وإدرار الطمث {cite:canon-ibn-sina-print-v1 p.297}."
  en: "Ibn Sina names the veins of the leg that are opened, the sciatic vein, the saphena, the vein of the hollow of the knee and the vein behind the Achilles tendon, with the place of each and its uses in sciatica, gout, piles and bringing on the menses {cite:canon-ibn-sina-print-v1 p.297}."
