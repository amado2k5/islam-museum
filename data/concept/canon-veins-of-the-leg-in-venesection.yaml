id: concept/canon-veins-of-the-leg-in-venesection
class: concept
kind: scientific
label: { ar: "عروق الرجل المفصودة عند ابن سينا", en: "The veins of the leg in venesection in the Canon", ur: "قانون میں پاؤں کی کھولی جانے والی رگیں", es: "Las venas de la pierna en la venosección en el Canon", fr: "Les veines de la jambe lors de la saignée dans le Canon", tr: "İbn Sina'ya göre adamın ayrılmış damarları", id: "Urat Terpisah Manusia menurut Ibn Sina" }
summary:
  ar: "يذكر ابن سينا عروق الرجل التي تفصد: عرق النسا والصافن وعرق مأبض الركبة والعرق خلف العرقوب، وموضع كل منها ومنافعه في أوجاع عرق النسا والنقرس والبواسير وإدرار الطمث {cite:canon-ibn-sina-print-v1 p.297}."
  en: "Ibn Sina names the veins of the leg that are opened, the sciatic vein, the saphena, the vein of the hollow of the knee and the vein behind the Achilles tendon, with the place of each and its uses in sciatica, gout, piles and bringing on the menses {cite:canon-ibn-sina-print-v1 p.297}."
  es: "Ibn Sina nombra las venas de la pierna que se abren, la vena ciática, la safena, la vena del hueco de la rodilla y la vena detrás del tendón de Aquiles, con el lugar de cada una y sus usos en la ciática, la gota, las hemorroides y para inducir la menstruación {cite:canon-ibn-sina-print-v1 p.297}."
  fr: "Ibn Sina nomme les veines de la jambe qui sont ouvertes, la veine sciatique, la veine saphène, la veine du creux du genou et la veine derrière le tendon d'Achille, avec la place de chacune et ses utilisations dans la sciatique, la goutte, les hémorroïdes et pour provoquer les menstruations {cite:canon-ibn-sina-print-v1 p.297}."
  ur: "ابن سینا نے ٹانگ کی کھلی ہوئی رگوں، sciatic vein، saphena، گھٹنے کے کھوکھلے حصے کی رگ اور Achilles tendon کے پیچھے کی رگ کے نام بتائے ہیں، ہر ایک کی جگہ اور اس کے استعمال sciatica، gout، piles اور حیض آنے میں کیا جاتا ہے۔"
  tr: "İbn Sina, fıtık yapan adamın damarlarından bahseder: siyatik, safen damarlar, diz kapağı damarları ve aşil arkasındaki damar, siyatik, gut, hemoroid ve adet kanamasında her birinin konumu ve faydaları {cite:canon-ibn-sina-print-v1 s.297}."
  id: "Ibn Sina menyebutkan pembuluh darah pria yang mengalami hernia: sciatica, vena saphenous, pembuluh darah tempurung lutut, dan vena di belakang achilles, serta lokasi dan manfaat masing-masing pada sciatica, asam urat, wasir, dan perdarahan menstruasi {cite:canon-ibn-sina-print-v1 hlm.297}."
