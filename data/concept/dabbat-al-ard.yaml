summary:
  ar: "دابة تخرج من الأرض قرب قيام الساعة تكلم الناس أن الناس كانوا بآياتنا لا يوقنون؛ عدّها النبي في العشر من العلامات الكبرى {cite:sahih-muslim} {cite:tafsir-ibn-kathir}."
  en: "A beast brought forth from the earth near the Hour that speaks to people because they would not believe in God's signs; the Prophet counted it among the ten major signs {cite:sahih-muslim} {cite:tafsir-ibn-kathir}."
  ur: "قیامت کے قریب زمین سے ایک جانور نکالا جائے گا جو لوگوں سے کلام کرے گا کہ وہ ہماری آیات پر یقین نہیں رکھتے تھے؛ نبی نے اسے دس بڑی نشانیوں میں شمار فرمایا {cite:sahih-muslim} {cite:tafsir-ibn-kathir}۔"
