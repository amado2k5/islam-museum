summary:
  ar: الخشوع لغة السكون والتذلل، وخشع في صلاته ودعائه أقبل بقلبه على ذلك، ومنه خشعت الأرض إذا سكنت واطمأنت؛ والخشوع ضراعة في الجوارح أكثر، والضراعة في القلب أكثر؛ والتخشع تكلف الخشوع، وقال قتادة هو الخوف وغض البصر في الصلاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7640} الخضوع التواضع ويكون في البدن، والإخبات ملازمة الطاعة والسكون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7641} جمهور الفقهاء على أن الخشوع في الصلاة سنة، لأن من يفكر في أمر دنيوي تصح صلاته ما دام ضابطا أفعالها، ويسن للمصلي أن يخشع بقلبه وجوارحه، بألا يحضر فيه غير الصلاة، وألا يعبث بجسده أو ثيابه، ويستحضر أنه بين يدي الملك الذي يعلم السر وأخفى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7641} الأصل في طلب الخشوع قوله تعالى «قد أفلح المؤمنون الذين هم في صلاتهم خاشعون»، وفسره علي بلين القلب وكف الجوارح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7642} يستحب للمصلي أن يتدبر القراءة ويفرغ قلبه من الشواغل ولا يسترسل مع حديث النفس، لأن حضور القلب فراغه عن غير ما هو فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7642} جمهور الفقهاء يرون أن الصلاة صحيحة مع ترك الخشوع، لأنها لا تبطل بعمل القلب، لكنه مكروه ولا ثواب معه؛ وبعض فقهاء المذاهب جعلوه فرضا لا تبطل الصلاة بتركه لأنه معفو عنه، أو فرضا تبطل بتركه، أو شرطا في جزء منها، وحدده بعضهم عند تكبيرة الإحرام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7642}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7643} والخشوع المذموم هو المتكلف أمام الناس بمطأطأة الرأس والتباكي، وهو من خداع الشيطان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7643}
  en: 'Khushu\'' is lexically stillness and humility; one who is humble in prayer or supplication turns his heart wholly to it, from the phrase the earth is still when it settles. Khushu\'' is more often in the limbs, and dara\'' (submission) more often in the heart; takhshu\'' is forced humility, and Qatada called it fear and lowered gaze in prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7640} Khudu\'' is lowliness, found in the body; ikhbat is steady obedience and stillness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7641} Most jurists hold that khushu\'' in prayer is a sunna, not a pillar, since someone thinking of worldly matters still has a valid prayer while he keeps its acts. The worshipper should be humble in heart and limbs: attend to nothing but the prayer, not fidget with his body or clothes, and recall that he stands before the King who knows the secret and the most hidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7641} The basis for seeking humility in prayer is the verse "the believers prosper, those who are humble in their prayer"; Ali explained it as a softened heart and restrained limbs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7642} The worshipper should ponder the recitation and empty his heart of distraction and not follow the flow of his thoughts, since presence of heart is being free from anything but what one is engaged in. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7642} Most jurists hold that prayer is valid without humility, since it is not voided by the heart''s act, though it is disliked and earns no reward; some schools made it a pillar that is excused, a pillar whose lack voids the prayer, or a condition for part of it, which some fix at the opening takbir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7642}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7643} Blameworthy humility is the feigned kind before people, with bowed head and weeping, a deception of Satan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7643}'
  ur: خشوع لغت میں سکون اور عاجزی ہے، نماز یا دعا میں دل کو اسی طرف لگانا؛ زمین خشع تب کہلاتی ہے جب وہ ٹھہر جائے؛ خشوع اعضا میں زیادہ اور ضراعت دل میں زیادہ ہوتی ہے؛ قتادہ کے نزدیک نماز میں خوف اور نگاہ نیچی رکھنا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7640} خضوع تواضع ہے جو بدن میں ہوتا ہے، اور اخبات مسلسل اطاعت اور سکون ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7641} جمہور کے نزدیک نماز میں خشوع سنت ہے، کیونکہ دنیاوی خیال میں گم شخص کی نماز بھی درست رہتی ہے جب تک وہ افعال کی پابندی کرے؛ نمازی دل اور اعضا سے خشوع اختیار کرے، صرف نماز کا خیال رکھے، جسم یا کپڑوں سے نہ کھیلے، اور یاد رکھے کہ وہ اس بادشاہ کے سامنے کھڑا ہے جو چھپی اور اس سے بھی مخفی بات جانتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7641} نماز میں خشوع کی اصل آیت «قد أفلح المؤمنون الذين هم في صلاتهم خاشعون» ہے، جسے علی رضی اللہ عنہ نے دل کی نرمی اور اعضاء کے رکنے سے تعبیر کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7642} نمازی کو قراءت پر غور کرنا چاہیے اور دل کو دوسری مصروفیات سے خالی رکھنا چاہیے، کیونکہ دل کی حاضری یہی ہے کہ آدمی اسی میں لگا ہو جس میں ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7642} جمہور کے نزدیک خشوع کے بغیر بھی نماز درست ہے کیونکہ دل کے عمل سے نماز باطل نہیں ہوتی، البتہ مکروہ ہے اور ثواب نہیں؛ بعض مذاہب کے فقہاء نے اسے فرض، یا ایسا فرض جس کا ترک معاف ہو، یا نماز کے ایک حصے کی شرط قرار دیا، جسے بعض نے تکبیر تحریمہ کے وقت قرار دیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7642}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7643} مذموم خشوع وہ تکلف ہے جو لوگوں کے سامنے سر جھکا کر اور رو کر کیا جائے، جو شیطان کا فریب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7643}
