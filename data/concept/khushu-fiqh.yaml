label:
  ar: الخشوع
  en: Khushu' (humility in prayer)
  ur: خشوع
summary:
  ar: الخشوع لغة السكون والتذلل، وخشع في صلاته ودعائه أقبل بقلبه على ذلك، ومنه خشعت الأرض إذا سكنت واطمأنت؛ والخشوع ضراعة في الجوارح أكثر، والضراعة في القلب أكثر؛ والتخشع تكلف الخشوع، وقال قتادة هو الخوف وغض البصر في الصلاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7640} الخضوع التواضع ويكون في البدن، والإخبات ملازمة الطاعة والسكون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7641} جمهور الفقهاء على أن الخشوع في الصلاة سنة، لأن من يفكر في أمر دنيوي تصح صلاته ما دام ضابطا أفعالها، ويسن للمصلي أن يخشع بقلبه وجوارحه، بألا يحضر فيه غير الصلاة، وألا يعبث بجسده أو ثيابه، ويستحضر أنه بين يدي الملك الذي يعلم السر وأخفى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7641}
  en: 'Khushu\'' is lexically stillness and humility; one who is humble in prayer or supplication turns his heart wholly to it, from the phrase the earth is still when it settles. Khushu\'' is more often in the limbs, and dara\'' (submission) more often in the heart; takhshu\'' is forced humility, and Qatada called it fear and lowered gaze in prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7640} Khudu\'' is lowliness, found in the body; ikhbat is steady obedience and stillness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7641} Most jurists hold that khushu\'' in prayer is a sunna, not a pillar, since someone thinking of worldly matters still has a valid prayer while he keeps its acts. The worshipper should be humble in heart and limbs: attend to nothing but the prayer, not fidget with his body or clothes, and recall that he stands before the King who knows the secret and the most hidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7641}'
  ur: خشوع لغت میں سکون اور عاجزی ہے، نماز یا دعا میں دل کو اسی طرف لگانا؛ زمین خشع تب کہلاتی ہے جب وہ ٹھہر جائے؛ خشوع اعضا میں زیادہ اور ضراعت دل میں زیادہ ہوتی ہے؛ قتادہ کے نزدیک نماز میں خوف اور نگاہ نیچی رکھنا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7640} خضوع تواضع ہے جو بدن میں ہوتا ہے، اور اخبات مسلسل اطاعت اور سکون ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7641} جمہور کے نزدیک نماز میں خشوع سنت ہے، کیونکہ دنیاوی خیال میں گم شخص کی نماز بھی درست رہتی ہے جب تک وہ افعال کی پابندی کرے؛ نمازی دل اور اعضا سے خشوع اختیار کرے، صرف نماز کا خیال رکھے، جسم یا کپڑوں سے نہ کھیلے، اور یاد رکھے کہ وہ اس بادشاہ کے سامنے کھڑا ہے جو چھپی اور اس سے بھی مخفی بات جانتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7641}
