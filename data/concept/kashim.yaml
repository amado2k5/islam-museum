summary:
  ar: "الكاشم نبات هو الانجدان الرومي عند الحاشية، وبزره وأصله عند الكتاب مسخن مجفف في الثالثة، يطرد الرياح ويفتح ويحلل وينضج الهضم، وينفع المعدة، ويسهّل الديدان، وينفع من اللسع فيما يقال."
  en: "Kashim is, by the editor's note, the Roman inj'dan. The book says its seed and root warm and dry in the third degree; they expel wind, open, resolve, and aid digestion; they help the stomach, purge worms, and help against stings, as is said."
  ur: "کاشم حاشیے کے مطابق رومی انجدان ہے۔ کتاب کہتی ہے کہ اس کا بیج اور جڑ تیسرے درجے میں گرم اور خشک ہیں؛ یہ ہوا کو خارج، کھولنے، تحلیل کرنے اور ہضم کو پختہ کرنے والے ہیں، معدے کو فائدہ دیتے ہیں، کیڑے نکالتے ہیں اور ڈنک میں فائدہ دیتے ہیں، جیسا کہ کہا جاتا ہے۔"
  es: "Según la nota del editor, Kashim es el inj'dan romano. El libro dice que su semilla y raíz son cálidas y secas en tercer grado; expulsan los gases, abren, resuelven y ayudan a la digestión; ayudan al estómago, purgan los parásitos intestinales y protegen contra las picaduras, como se menciona."
  fr: "D'après la note de l'éditeur, le kashim correspond à l'inj'dan romain. Le livre indique que sa graine et sa racine, chaudes et sèches au troisième degré, chassent les gaz, libèrent les toxines et facilitent la digestion; elles sont bénéfiques pour l'estomac, purifient les vers intestinaux et protègent contre les piqûres."
