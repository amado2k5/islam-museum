label: { ar: "التقية", en: "Taqiyya (dissimulation)", es: "Taqiyya (disimulación)", fr: "Taqiyya (dissimulation)", ur: "تخریب کاری", tr: "Taqiyya", id: "Taqiyya" }
summary:
  ar: "التقية عند الشيعة جزء مكمل لتعاليمهم تواصوا به وعدّوهم بذلك، وهي عندهم النظام السري في شؤونهم: إذا أراد إمام الخروج على الخليفة وضع نظاماً وتدابير وأعلم أصحابه فتكتموه وأظهروا الطاعة حتى تتم الخطط، وإذا أحسوا ضرراً من كافر أو سني داروه وحاروه وأظهروا الموافقة؛ وروى الكليني عن أبي عبد الله «تسعة أعشار الدين في التقية ولا دين لمن لا تقية له»، وفسّروا بها أعمال الأئمة — سكوت علي على أبي بكر وعمر وعثمان تقية، ومصالحة الحسن معاوية تقية — وكانت سبباً في تحميل الكلام معاني خفية وباطناً تفهمه الخاصة، وعلى عكسهم قالت الخوارج: لا تجوز التقية بحال {cite:duha-islam p. 876-878}."
  en: "Taqiyya — the Shi'i doctrine of protective dissimulation: 'nine-tenths of religion is taqiyya' in al-Kulayni's report; the secret system by which imams' followers concealed their designs, and which generated the esoteric reading of speech {cite:duha-islam p. 876-878}."
  es: "Taqiyya: la doctrina chiíta de la disimulación protectora: \"nueve décimas partes de la religión son taqiyya\" en el informe de al-Kulayni; el sistema secreto mediante el cual los seguidores de los imanes ocultaban sus designios y que generó la lectura esotérica del discurso {cite:duha-islam p. 876-878}."
  fr: "La taqiyya — la doctrine chiite de dissimulation protectrice: « neuf dixièmes de la religion sont la taqiyya » dans le rapport d'al-Kulayni; le système secret par lequel les disciples des imams dissimulaient leurs desseins et qui a engendré la lecture ésotérique du discours {cite: duha-islam p. 876-878}."
  ur: "تقیہ - حفاظتی بھیس کا شیعہ نظریہ: الکلینی کی رپورٹ میں 'دین کا نویں حصہ تقیہ' ہے۔ وہ خفیہ نظام جس کے ذریعے ائمہ کے پیروکار اپنے ڈیزائن کو چھپاتے تھے، اور جس نے تقریر کی باطنی پڑھائی کو جنم دیا تھا۔ 876-878}۔"
  tr: "Şiiler arasında takiye, öğretilerinin tamamlayıcı bir parçasıdır; ona tavsiye verip karşı çıktılar. Onlar için bu, işlerinde gizli bir sistemdir: bir imam halifeye karşı isyan etmek isterse, bir sistem ve önlemler koyar, sahabeleri bilgili olur, bunu gizler ve planlar tamamlanana kadar itaat gösterirler. Eğer bir kâfir ya da sünniden zarar hissederlerse, onu ihbar ederler, karşı çıkarlar ve onay gösterirler. El-Kuleyni Ebu Abdullah'tan şöyle rivayet etti: \"Dokuzda dokuz dinin takiye'de olduğu ve tekıyiyesi olmayan biri için din yoktur.\" Bunu imamların eylemleri olarak yorumladılar—Ali'nin Ebu Bekir, Ömer ve Osman üzerindeki sessizliği ve el-Hasan Muaviye'nin takiyye ile barışması—bu da konuşmanın gizli ve gizli anlamlarla aktarılmasına yol açtı ve bu da onun özel olarak anladığı anlamlardı. Buna karşılık, Harijiler şöyle derlerdi: Takiyye hiçbir koşulda izin verilmez. {alıntı:) Duha-Islam, s. 876-878}."
  id: "Taqiyya di antara Syiah adalah bagian pelengkap dari ajaran mereka, yang mereka sarankan dan lawan. Bagi mereka, itu adalah sistem rahasia dalam urusan mereka: jika seorang imam ingin memberontak terhadap khalifah, ia menetapkan sistem dan langkah-langkah, dan para sahabatnya berpengetahuan, mereka menyembunyikannya dan menunjukkan ketaatan sampai rencana selesai. Jika mereka merasakan ada kerugian dari kafir atau Sunni, mereka melaporkannya, menentangnya, dan menunjukkan persetujuan. Al-Kulayni menceritakan dari Abu Abdullah: \"Sembilan persepuluh agama adalah taqiyya, dan tidak ada agama bagi seseorang tanpa taqiyya.\" Mereka menafsirkannya sebagai tindakan para imam—diamnya Ali atas Abu Bakr, Umar, dan Uthman, serta rekonsiliasi Muawiya al-Hasan dengan taqiyya—yang menyebabkan ucapan disampaikan dengan makna tersembunyi dan tersembunyi yang ia pahami secara pribadi. Sebaliknya, Kharijit berkata: taqiyya tidak diperbolehkan dalam keadaan apapun. {cite:Duha-Islam, hlm. 876-878}."
