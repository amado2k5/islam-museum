id: concept/taqiyya
class: concept
kind: doctrine
label: { ar: "التقية" }
summary:
  ar: "التقية عند الشيعة جزء مكمل لتعاليمهم تواصوا به وعدّوهم بذلك، وهي عندهم النظام السري في شؤونهم: إذا أراد إمام الخروج على الخليفة وضع نظاماً وتدابير وأعلم أصحابه فتكتموه وأظهروا الطاعة حتى تتم الخطط، وإذا أحسوا ضرراً من كافر أو سني داروه وحاروه وأظهروا الموافقة؛ وروى الكليني عن أبي عبد الله «تسعة أعشار الدين في التقية ولا دين لمن لا تقية له»، وفسّروا بها أعمال الأئمة — سكوت علي على أبي بكر وعمر وعثمان تقية، ومصالحة الحسن معاوية تقية — وكانت سبباً في تحميل الكلام معاني خفية وباطناً تفهمه الخاصة، وعلى عكسهم قالت الخوارج: لا تجوز التقية بحال {cite:duha-islam p. 876-878}."
  en: "Taqiyya — the Shi'i doctrine of protective dissimulation: 'nine-tenths of religion is taqiyya' in al-Kulayni's report; the secret system by which imams' followers concealed their designs, and which generated the esoteric reading of speech {cite:duha-islam p. 876-878}."
