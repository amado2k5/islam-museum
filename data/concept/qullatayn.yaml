id: concept/qullatayn
class: concept
kind: legal
label: { ar: "القلتان", en: "The two qullas (qullatayn)", ur: "قلتین (دو قلے)" }
term: { ar: "قُلّتان، مثنى قُلّة", en: "qullatayn, dual of qulla (a large jar)" }
issue: { ar: "ما مقدار الماء الذي لا ينجس بمجرد ملاقاة النجاسة، وهل يُحدّ بالقلتين؟", en: "How much water stays pure on contact with impurity, and is the limit two qullas?" }
summary:
  ar: "القلتان حدّ لمقدار الماء ورد في حديث ابن عمر «إذا كان الماء قلتين لم يحمل الخبث»، أخرجه أبو داود في باب ما ينجس الماء؛ وفسّر الخطابي «لم يحمل الخبث» بأنه يدفعه عن نفسه، وجعل القلة أكبر القلال وهي قلال هجر، وحكى تقديرها بخمس قرب أو خمسمائة رطل، وذكر أن ممن قال بهذا الحد الشافعي وأحمد وإسحاق وأبا عبيد وأبا ثور وابن خزيمة {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 43-45}."
  en: "The two qullas are a measure of water named in Ibn 'Umar's report 'when the water is two qullas it does not carry impurity', which Abu Dawud gives in the chapter on what makes water impure; al-Khattabi explains 'does not carry impurity' as 'repels it', takes the qulla to be the largest jar, the jars of Hajar, relates estimates of five waterskins or five hundred ratls, and names al-Shafi'i, Ahmad, Ishaq, Abu 'Ubayd, Abu Thawr and Ibn Khuzayma among those who held this limit {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 43-45}."
  ur: "قلتین پانی کی وہ مقدار ہے جو ابن عمر کی حدیث «جب پانی دو قلے ہو تو وہ نجاست نہیں اٹھاتا» میں آئی ہے، جسے ابو داؤد نے باب ما ینجس الماء میں روایت کیا؛ خطابی نے «نجاست نہیں اٹھاتا» کو «اسے اپنے سے دفع کرتا ہے» کے معنی میں لیا، قلہ کو سب سے بڑا مٹکا یعنی ہجر کے قلے قرار دیا، اس کا اندازہ پانچ مشکیں یا پانچ سو رطل نقل کیا، اور اس حد کے قائلین میں شافعی، احمد، اسحاق، ابو عبید، ابو ثور اور ابن خزیمہ کا نام لیا {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 43-45}۔"
definitions:
  - { tradition: sunni-shafii, text: { ar: "قال الخطابي: القلة قد تكون الإناء الصغير وقد تكون الجرة الكبيرة، والمراد في الحديث الكبيرة، وهي قلال هجر المعلومة المقدار، وقدّرها العلماء بخمس قرب، ومنهم من قدرها بخمسمائة رطل." }, sources: [source/sunan-abi-dawud-ibn-hazm-1997-v1] }
perspectives:
  - tradition: sunni-shafii
    id: khattabi-qullatayn-limit
    standing: main
    stance: { ar: "الماء إذا بلغ قلتين لم ينجس بملاقاة النجاسة، وما دونهما ينجس", en: "Water of two qullas or more is not made impure by contact; less than that is" }
    summary: { ar: "يرى الخطابي أن الحديث ورد مورد الفصل بين المقدار الذي ينجس والذي لا ينجس، ويحتج له برواية عاصم بن المنذر «فإنه لا ينجس»، ويذكر من قال به: الشافعي وأحمد وإسحاق وأبو عبيد وأبو ثور وابن خزيمة؛ ويجيب عمن طعن في إسناده بالاضطراب بأن الخطأ في إحدى الروايتين متروك والصواب معمول به، وأن أئمة الحديث صححوه.", en: "Al-Khattabi holds that the report draws the line between water that becomes impure and water that does not, citing 'Asim ibn al-Mundhir's wording 'it does not become impure', and names al-Shafi'i, Ahmad, Ishaq, Abu 'Ubayd, Abu Thawr and Ibn Khuzayma; to those who fault its chain as confused he answers that the faulty version is set aside and the correct one used, and that the masters of hadith declared it sound." }
