id: concept/qullatayn
class: concept
kind: legal
label: { ar: "القلتان", en: "The two qullas (qullatayn)", ur: "قلتین ⁦(دو قلے)⁩", es: "Las dos qullas (qullatayn)", fr: "Les deux qullas (qullatayn)", tr: "El-Kaltan", id: "Al-Qaltan" }
term: { ar: "قُلّتان، مثنى قُلّة", en: "qullatayn, dual of qulla (a large jar)" }
issue: { ar: "ما مقدار الماء الذي لا ينجس بمجرد ملاقاة النجاسة، وهل يُحدّ بالقلتين؟", en: "How much water stays pure on contact with impurity, and is the limit two qullas?" }
summary:
  ar: "القلتان حدّ لمقدار الماء ورد في حديث ابن عمر «إذا كان الماء قلتين لم يحمل الخبث»، أخرجه أبو داود في باب ما ينجس الماء؛ وفسّر الخطابي «لم يحمل الخبث» بأنه يدفعه عن نفسه، وجعل القلة أكبر القلال وهي قلال هجر، وحكى تقديرها بخمس قرب أو خمسمائة رطل، وذكر أن ممن قال بهذا الحد الشافعي وأحمد وإسحاق وأبا عبيد وأبا ثور وابن خزيمة {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 43-45}."
  en: "The two qullas are a measure of water named in Ibn 'Umar's report 'when the water is two qullas it does not carry impurity', which Abu Dawud gives in the chapter on what makes water impure; al-Khattabi explains 'does not carry impurity' as 'repels it', takes the qulla to be the largest jar, the jars of Hajar, relates estimates of five waterskins or five hundred ratls, and names al-Shafi'i, Ahmad, Ishaq, Abu 'Ubayd, Abu Thawr and Ibn Khuzayma among those who held this limit {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 43-45}."
  ur: "قلتین پانی کی وہ مقدار ہے جو ابن عمر کی حدیث «جب پانی دو قلے ہو تو وہ نجاست نہیں اٹھاتا» میں آئی ہے، جسے ابو داؤد نے باب ما ینجس الماء میں روایت کیا؛ خطابی نے «نجاست نہیں اٹھاتا» کو «اسے اپنے سے دفع کرتا ہے» کے معنی میں لیا، قلہ کو سب سے بڑا مٹکا یعنی ہجر کے قلے قرار دیا، اس کا اندازہ پانچ مشکیں یا پانچ سو رطل نقل کیا، اور اس حد کے قائلین میں شافعی، احمد، اسحاق، ابو عبید، ابو ثور اور ابن خزیمہ کا نام لیا {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 43-45}۔"
  es: "Las dos qullas son una medida de agua mencionada en el informe de Ibn 'Umar: \"cuando el agua tiene dos qullas, no lleva impurezas\", que Abu Dawud da en el capítulo sobre lo que hace que el agua sea impura; al-Khattabi explica \"no lleva impurezas\" como \"las repele\", toma la qulla como la jarra más grande, las jarras de Hajar, relata estimaciones de cinco odres de agua o quinientos ratls, y nombra a al-Shafi'i, Ahmad, Ishaq, Abu 'Ubayd, Abu Thawr e Ibn Khuzayma entre aquellos que sostenían este límite {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 43-45}."
  fr: "Les deux qullas sont une mesure d'eau mentionnée dans le récit d'Ibn 'Umar: « lorsque l'eau atteint deux qullas, elle ne porte pas d'impureté », information reprise par Abu Dawud dans le chapitre traitant de ce qui rend l'eau impure; al-Khattabi explique « ne porte pas d'impureté » comme « la repousse », considère le qulla comme la plus grande jarre, les jarres de Hajar, rapporte des estimations de cinq outres ou cinq cents ratls, et cite al-Shafi'i, Ahmad, Ishaq, Abu 'Ubayd, Abu Thawr et Ibn Khuzayma parmi ceux qui ont adopté cette limite {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 43-45}."
  tr: "İki kilatan su miktarı için bir sınırdır. İbn Ömer'in hadisinde şöyle anılır: \"Su iki kila, kirli olmaz,\" Ebu Davud tarafından suyu arındıran bölümde anlatılır; El-Hattabi \"kirlilik taşımaz\" diye kendisi için ödeme yapan kişi olarak yorumlamış ve kakı (küçük kila) kagalın en büyüğü olarak kabul etmiş, bunun küçük bir tehlike olduğunu ve beş kırr yani beş yüz pound olarak tahmin ettiğini bildirmiştir. Bu sınırı söyleyenler arasında El-Şafii, Ahmed, İshaq, Ebu Ubaid, Ebu Tewr ve İbn Huzeymah olduğunu belirtmiştir {atıf:sunan-abi-dawud-ibn-hazm-1997-v1, s. 43-45}."
  id: "Dua qilatan tersebut merupakan batas jumlah air. Disebutkan dalam hadits Ibn Umar: \"Jika airnya dua qila, maka tidak membawa kemurnian,\" yang diceritakan oleh Abu Dawood dalam bab tentang apa yang memurnikan air; Al-Khattabi menafsirkan \"tidak membawa kemurnian\" sebagai seseorang yang membayarnya sendiri, dan menganggap qalaq (qila kecil) sebagai yang terbesar di antara qalaal, yang merupakan bahaya kecil, dan ia melaporkan perkiraannya sebagai lima qirr atau lima ratus pound. Ia menyebutkan bahwa di antara mereka yang mengatakan batas ini adalah Al-Shafi'i, Ahmad, Ishaq, Abu Ubaid, Abu Thawr, dan Ibn Khuzaymah {cite:sunan-abi-dawud-ibn-hazm-1997-v1, hlm. 43-45}."
definitions:
  - { tradition: sunni-shafii, text: { ar: "قال الخطابي: القلة قد تكون الإناء الصغير وقد تكون الجرة الكبيرة، والمراد في الحديث الكبيرة، وهي قلال هجر المعلومة المقدار، وقدّرها العلماء بخمس قرب، ومنهم من قدرها بخمسمائة رطل." }, sources: [source/sunan-abi-dawud-ibn-hazm-1997-v1] }
