label: { ar: "المَيْتَة", en: "Carrion (mayta) and the rulings on dead animals", ur: "مردار ⁦(میتہ)⁩ اور اس کے احکام", es: "Carroña (mayta) y las normas sobre animales muertos", fr: "Charogne (mayta) et les décisions concernant les animaux morts" }
summary:
  ar: "الميتة في الشرع هي الحيوان الميت غير المذكى، وتشمل المنخنقة والموقوذة والمتردية والنطيحة وما أكل السبع، وما ذبح على النصب، والعضو المبان من الحي. وأجمع الفقهاء على تحريم أكلها في حالة السعة والاختيار، وأجازوا أكلها عند الاضطرار بقدر ما يسد الرمق عند الجمهور. واختلفوا في وجوب الأكل وإباحته وندبه، وفي التداوي بها، وفي نجاستها. وفيها خلاف في الانتفاع بجلدها بعد الدباغ وصوفها وعظمها وإنفحتها وبيضها ولبنها وشحمها، واستثنى الجمهور ميتة البحر والجراد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15349} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15350} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15351} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15353} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15363}"
  en: "In law carrion (mayta) is an animal that dies without proper slaughter (tadhkiya). It covers the strangled, the beaten to death, the fallen, the gored, what a beast of prey has eaten, what was slaughtered on a stone altar, and a limb cut from a living animal. The jurists agree that eating it is forbidden in ease and choice; in necessity they permit it, for the majority only enough to keep alive. They differ on whether eating it is obligatory, permitted or recommended, on treating with it, and on its impurity. They also differ on the use of its hide after tanning, its wool, bone, rennet, eggs, milk and fat. The majority exempt the carrion of the sea and of locusts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15349} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15350} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15351} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15353} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15363}"
  ur: "شریعت میں مردار وہ جانور ہے جو شرعی ذبح ⁦(تذکیہ)⁩ کے بغیر مرا ہو۔ اس کا کھانا آسانی کی حالت میں حرام ہے، اور مجبوری میں جمہور کے نزدیک صرف اتنا جائز ہے جس سے جان بچ جائے۔ سمندری مردار اور ٹڈی کو جمہور مستثنیٰ کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15349} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15363}"
  es: "En derecho, la carroña (mayta) es un animal que muere sin un sacrificio adecuado (tadhkiya). Incluye a los animales estrangulados, golpeados hasta la muerte, caídos, corneados, lo que ha comido una bestia de presa, lo que fue sacrificado en un altar de piedra y una extremidad cortada de un animal vivo. Los juristas coinciden en que comerla está prohibido en caso de necesidad o elección; en caso de necesidad, la permiten, para la mayoría solo lo suficiente para sobrevivir. Discuten sobre si comerla es obligatorio, permitido o recomendable, sobre su uso en rituales y sobre su impureza. También difieren sobre el uso de su piel después del curtido, su lana, huesos, cuajo, huevos, leche y grasa. La mayoría exime de esta prohibición la carroña marina y de langostas. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15349} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15350} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15351} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15352} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15353} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15363}"
  fr: "En droit, la charogne (mayta) désigne un animal mort sans abattage rituel (tadhkiya). Sont inclus les animaux étranglés, battus à mort, tombés, encornés, ce qu'une bête de proie a mangé, ce qui a été sacrifié sur un autel de pierre, et les membres prélevés sur un animal vivant. Les juristes s'accordent sur le fait que sa consommation est interdite par choix et par facilité; ils l'autorisent par nécessité, la majorité se limitant à la quantité nécessaire à la survie. Ils divergent quant au caractère obligatoire, permis ou recommandé de sa consommation, quant à son utilisation à des fins médicinales, et quant à son impureté. Ils divergent également quant à l'utilisation de sa peau après tannage, de sa laine, de ses os, de sa présure, de ses œufs, de son lait et de sa graisse. La majorité exclut les charognes marines et celles des sauterelles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15349} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15350} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15351} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15353} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15363}"
