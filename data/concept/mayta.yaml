id: concept/mayta
class: concept
kind: legal
label: { ar: "المَيْتَة", en: "Carrion (mayta) and the rulings on dead animals", ur: "مردار (میتہ) اور اس کے احکام" }
summary:
  ar: "الميتة في الشرع هي الحيوان الميت غير المذكى، وتشمل المنخنقة والموقوذة والمتردية والنطيحة وما أكل السبع، وما ذبح على النصب، والعضو المبان من الحي. وأجمع الفقهاء على تحريم أكلها في حالة السعة والاختيار، وأجازوا أكلها عند الاضطرار بقدر ما يسد الرمق عند الجمهور. واختلفوا في وجوب الأكل وإباحته وندبه، وفي التداوي بها، وفي نجاستها. وفيها خلاف في الانتفاع بجلدها بعد الدباغ وصوفها وعظمها وإنفحتها وبيضها ولبنها وشحمها، واستثنى الجمهور ميتة البحر والجراد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15349} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15350} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15351} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15353} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15363}"
  en: "In law carrion (mayta) is an animal that dies without proper slaughter (tadhkiya). It covers the strangled, the beaten to death, the fallen, the gored, what a beast of prey has eaten, what was slaughtered on a stone altar, and a limb cut from a living animal. The jurists agree that eating it is forbidden in ease and choice; in necessity they permit it, for the majority only enough to keep alive. They differ on whether eating it is obligatory, permitted or recommended, on treating with it, and on its impurity. They also differ on the use of its hide after tanning, its wool, bone, rennet, eggs, milk and fat. The majority exempt the carrion of the sea and of locusts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15349} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15350} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15351} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15353} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15363}"
  ur: "شریعت میں مردار وہ جانور ہے جو شرعی ذبح (تذکیہ) کے بغیر مرا ہو۔ اس کا کھانا آسانی کی حالت میں حرام ہے، اور مجبوری میں جمہور کے نزدیک صرف اتنا جائز ہے جس سے جان بچ جائے۔ سمندری مردار اور ٹڈی کو جمہور مستثنیٰ کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15349} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15363}"
