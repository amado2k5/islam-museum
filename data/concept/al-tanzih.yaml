id: concept/al-tanzih
class: concept
kind: doctrine
label: { ar: "تنزيه الله عن الولد والمماثلة", en: "Divine transcendence (tanzih): God above offspring and likeness", fr: "Transcendance divine (tanzih) : Dieu au-delà de toute filiation et ressemblance", es: "Trascendencia divina (tanzih): Dios por encima de la descendencia y la semejanza." }
summary:
  ar: "تنزيه الله عند الشعراوي أنه لا يُماثل خلقه لا في الذات ولا في الصفات ولا في الأفعال، ومن ذلك نفي الولد، فلا يُتخذ الولد لحاجة إلى بقاء النوع أو معونة أو ضمان حياة، والكون كله خاضع لله. ويحاجّ بأن الولد إن كان مخلوقاً فليس إلهاً، وإن كان إلهاً فهم ثلاثة. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.547}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.548}"
  en: "Tanzih, in Sha'rawi's account, is God's transcendence over likeness with His creatures in essence, attributes and acts. It includes denying that God has a son: a son is taken for the need to keep a kind alive, for help or for security of life, none of which applies to God, and everything in heaven and earth is subject to Him. He argues that a son is either a creature, and so not a god, or a god, and then there would be three gods {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.547}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.548}."
  fr: "Pour al-Sha'rawi, le tanzih désigne la transcendance de Dieu, qui ne ressemble pas à ses créatures par son essence, ses attributs ou ses actes. Cela implique de nier que Dieu ait un fils : on cherche à avoir un fils pour perpétuer son espèce, obtenir de l’aide ou assurer sa vie, mais aucun de ces besoins ne s’applique à Dieu et tout, dans les cieux et sur la terre, lui est soumis. Il soutient qu’un fils serait soit une créature, et donc non un dieu, soit un dieu, et qu’il y aurait alors trois dieux {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.547}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.548}."
  es: "En la explicación de Sha'rawi, Tanzih es la trascendencia de Dios sobre la semejanza con sus criaturas en esencia, atributos y actos. Esto implica negar que Dios tenga un hijo: un hijo se considera necesario para mantener viva una especie, para obtener ayuda o para garantizar la vida, nada de lo cual se aplica a Dios, y todo en el cielo y en la tierra está sujeto a Él. Argumenta que un hijo es o bien una criatura, y por lo tanto no un dios, o bien un dios, y entonces habría tres dioses {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.547}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.548}."
