id: concept/al-tanzih
class: concept
kind: doctrine
label: { ar: "تنزيه الله عن الولد والمماثلة", en: "Divine transcendence (tanzih): God above offspring and likeness" }
summary:
  ar: "تنزيه الله عند الشعراوي أنه لا يُماثل خلقه لا في الذات ولا في الصفات ولا في الأفعال، ومن ذلك نفي الولد، فلا يُتخذ الولد لحاجة إلى بقاء النوع أو معونة أو ضمان حياة، والكون كله خاضع لله. ويحاجّ بأن الولد إن كان مخلوقاً فليس إلهاً، وإن كان إلهاً فهم ثلاثة. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.547}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.548}"
  en: "Tanzih, in Sha'rawi's account, is God's transcendence over likeness with His creatures in essence, attributes and acts. It includes denying that God has a son: a son is taken for the need to keep a kind alive, for help or for security of life, none of which applies to God, and everything in heaven and earth is subject to Him. He argues that a son is either a creature, and so not a god, or a god, and then there would be three gods {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.547}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.548}."
wings: [ideas]
themes: [creed]
periods: [period/prophetic-era]
regions: [global]
issue:
  ar: "كيف يُنزَّه الله عن الولد والمماثلة مع بقاء الكلام في صفاته كاملة؟"
  en: "How is God declared free of offspring and of likeness while His perfect attributes are affirmed?"
perspectives:
  - tradition: sunni
    id: sunni-sharawi-argument-from-need
    stance:
      ar: "الولد يُتخذ لحاجة، والله منزّه عنها: لا تتغير قدرته ولا حياته بالولد"
      en: "A son is taken out of need, and God is free of need: His power and life are not increased by a son"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يبني الشعراوي الحجة على أن اتخاذ الولد يقع لبقاء النوع أو لمعونة أو لضمان حياة، وأن الله حيّ أزلاً لا يحتاج إلى ذلك، وأن الكون لم يتغير بوجود الولد المزعوم. ويقول إن الكمال لله قبل الخلق وبعده، وإن الولد لو وُجد فهو إما مخلوق وإما إله، فيلزم أحد الأمرين. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.547}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.548}"
      en: "Sha'rawi builds his case on the claim that a son is taken for keeping a kind alive, for help or for security of life, and that God is living from eternity and needs none of these; he adds that the world was not changed by the alleged son. A son would be either a creature or a god, and the argument follows from that {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.547}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.548}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
  - tradition: sunni
    id: sunni-scope-note
    stance:
      ar: "ما زالت أقوال المفسرين والعلماء في الرد على الولد دون مصدر في هذه الدفعة"
      en: "The classical exegetes' and theologians' replies on offspring are not yet entered from a source"
    holders: []
    summary:
      ar: "لم تُدخل بعد أقوال المفسرين والمتكلمين في الرد على نسبة الولد لله، ولا الرأي الأكاديمي في تاريخ هذه النسبة عند أهل الكتاب، ولا الآراء الأخرى. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.548}"
      en: "The replies of classical exegetes and theologians to the claim of divine offspring are not yet entered, nor the academic history of that claim among the People of the Book, nor other views."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
