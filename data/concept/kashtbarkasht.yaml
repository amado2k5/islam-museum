label:
  ar: "كشت بركشت"
  en: "Kasht barkasht (a twining plant)"
  ur: "کشت برکشت"
  es: "Kasht barkasht (una planta entrelazada)"
  fr: "Kasht barkasht (une plante volubile)"
  tr: "Barkasht'ta yetiştirilmiştir"
  id: "Dibudidayakan di Barkasht"
summary:
  ar: "كشت بركشت شيء يلتف بعضه على بعض في خيوط، وهو عند الكتاب حار يابس في الثانية، لطيف جدا، والكتاب يرى أن قوته قوة البدشكان."
  en: "Kasht barkasht is a twining thing made of threads wound together, mostly five to a root. The book classes it as hot and dry in the second degree and very fine, and holds that its force is that of badshakan."
  ur: "کشت برکشت ایک لپٹا ہوا شے ہے جو دھاگوں کی طرح ایک دوسرے پر لپٹی ہوئی ہوتی ہے، اکثر پانچ تک، اور ایک جڑ سے لپٹی ہوتی ہے۔ کتاب اسے دوسرے درجے میں گرم اور خشک اور نہایت باریک بتاتی ہے، اور اس کی قوت بدشکان جیسی مانتی ہے۔"
  es: "Kasht barkasht es una cosa entrelazada hecha de hilos enrollados, generalmente cinco por raíz. El libro la clasifica como caliente y seca de segundo grado y muy fina, y sostiene que su fuerza es la de badshakan."
  fr: "Le Kasht barkasht est un tissu tressé composé de fils enroulés ensemble, généralement cinq par racine. Le livre le classe comme chaud et sec, de degré 2, et très fin, et affirme que sa force est celle du badshakan."
  tr: "Kasht Barkasht, iplikler halinde birbirine dolanan bir şeydir ve kitaba göre, ikincisi sıcak ve kuru, çok naziktir; kitap onun gücünü Badshkanların gücü olarak görür."
  id: "Kasht Barkasht adalah sesuatu yang berpilin menjadi benang, dan menurut buku, yang kedua terasa panas dan kering, sangat lembut, dan buku menganggap kekuatannya adalah kekuatan Badshkan."
