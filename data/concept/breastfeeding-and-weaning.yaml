perspectives:
  - tradition: sunni
    id: sunni-sharawi-natural-fact
    stance: { en: "The suckling is stated as a natural fact, not as a command", ar: "الإرضاع يُعرض خبراً واقعاً لا أمراً" }
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      en: "Sha'rawi notes that the verse states mothers' suckling in the declarative form, presenting it as a natural and unavoidable fact rather than an order that could be obeyed or disobeyed {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1005}. He records that the father is the one charged with the nursing mother's upkeep, because the child is attributed to the father {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1005}."
      ar: "ينبّه الشعراوي إلى أن الآية أوردت إرضاع الوالدات بصيغة الخبر، فجعلته أمراً طبيعياً واقعاً لا أمراً يُطاع أو يُعصى {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1005}، ويذكر أن نفقة المرضعة على الأب لانتساب الولد إليه {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1005}."
    sources: [source/tafsir-sharawi-khawatir-scan-vol-2]
  - tradition: sunni
    id: sunni-sharawi-consent-to-wean
    stance: { en: "Weaning before two years needs the parents' mutual consent and consultation", ar: "الفطام قبل العامين يحتاج إلى تراض بين الأبوين وتشاور" }
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      en: "Sha'rawi reads the words 'by mutual consent and consultation' as keeping a shared concern for the child even after the parents separate, so that the child is not deprived of either parent's tenderness {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1007}."
      ar: "يقرأ الشعراوي عبارة «عن تراضٍ منهما وتشاوُر» على أنها تُبقي الشأن المشترك للطفل قائماً بعد الفرقة، فلا يُحرم الطفل من عاطفة أيٍّ من أبويه {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1007}."
    sources: [source/tafsir-sharawi-khawatir-scan-vol-2]
sources: [source/tafsir-sharawi-khawatir-scan-vol-2]
