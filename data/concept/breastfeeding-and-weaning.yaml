id: concept/breastfeeding-and-weaning
class: concept
kind: legal
label:
  ar: الرضاعة والفصال
  en: Breastfeeding and weaning
  fr: "Allaitement et sevrage"
  ur: دودھ پلانا اور دودھ چھڑانا
  es: "Lactancia materna y destete"
  tr: "Emzirme ve sütten kesilme"
  id: "Menyusui dan menyapih"
summary:
  ar: "يعرض الشعراوي في تفسير آية الرضاع ⁦(البقرة 233)⁩ مدة الرضاعة وحقّ الرضيع على أبويه، ويجعل النفقة على الأب، ويعالج الفِصال بالتراضي والتشاور، ويرى أن الآية تحمي الطفل من أثر الطلاق {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1004} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1005}."
  en: "In his commentary on the nursing verse (al-Baqara 2:233), Sha'rawi treats the period of suckling, the child's claim on both parents, and the duty of maintenance, which he places on the father; he reads weaning as a matter for mutual consent and consultation, and holds that the verse protects the child from the effects of divorce {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1004} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1005}."
  fr: "Dans son commentaire d’al-Baqara 2:233, Sha'rawi traite de la durée de l’allaitement, du droit de l’enfant envers ses deux parents et de l’entretien qu’il attribue au père. Il comprend le sevrage comme une décision de consentement et consultation mutuels et considère le verset comme une protection de l’enfant contre les effets du divorce {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1004} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1005}."
  es: "En su comentario sobre el versículo de la lactancia (al-Baqara 2:233), Sha'rawi trata el período de lactancia, el derecho del niño a ambos padres y el deber de manutención, que él pone sobre el padre; interpreta el destete como un asunto de consentimiento y consulta mutuos, y sostiene que el versículo protege al niño de los efectos del divorcio {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1004} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1005}."
  ur: "دودھ پلانے والی آیت ⁦(البقرہ 2:233)⁩ کی تفسیر میں شعراوی نے دودھ پلانے کی مدت، ماں باپ دونوں پر بچے کا دعویٰ، اور کفالت کا فرض، جو وہ باپ پر ڈالتا ہے، کو قرار دیتا ہے۔ وہ دودھ چھڑانے کو باہمی رضامندی اور مشاورت کے لیے پڑھتا ہے، اور یہ کہتا ہے کہ یہ آیت بچے کو طلاق کے اثرات سے بچاتی ہے {حوالہ:تفسیر-شعروی-خواطر-سکن-جلد-2 صفحہ 1004}"
  tr: "El-Şaaravi, emzirme ayetinin (Al-Baqarah 233) yorumunda, emzirme süresini ve bebeğin ebeveynleri üzerindeki hakkını sunar, nafakayı babaya yükler ve ayrılıkları karşılıklı rıza ve danışma ile ele alır. Ayetin çocuğu boşanmanın etkilerinden koruduğunu düşünür {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1004} {cite:tafsir-sharawi-khawatir-scan-vol-2 s.1005}."
  id: "Al-Shaarawi, dalam penafsirannya atas ayat tentang menyusui (Al-Baqarah 233), memaparkan durasi menyusui dan hak bayi atas orang tuanya, memberikan nafkah kepada ayah, dan menangani perpisahan dengan kesepakatan dan konsultasi bersama. Ia percaya bahwa ayat ini melindungi anak dari dampak perceraian {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1004} {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1005}."
issue: { ar: "كيف يقرأ الشعراوي مدة الرضاعة ونفقة المرضع وحق الطفل بعد الطلاق؟", en: "How does Sha'rawi read the period of suckling, the nursing mother's maintenance and the child's right after divorce?" }
