id: concept/breastfeeding-and-weaning
class: concept
kind: legal
label:
  ar: الرضاعة والفصال
  en: Breastfeeding and weaning
  ur: دودھ پلانا اور دودھ چھڑانا
summary:
  ar: "يعرض الشعراوي في تفسير آية الرضاع (البقرة 233) مدة الرضاعة وحقّ الرضيع على أبويه، ويجعل النفقة على الأب، ويعالج الفِصال بالتراضي والتشاور، ويرى أن الآية تحمي الطفل من أثر الطلاق {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1004} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1005}."
  en: "In his commentary on the nursing verse (al-Baqara 2:233), Sha'rawi treats the period of suckling, the child's claim on both parents, and the duty of maintenance, which he places on the father; he reads weaning as a matter for mutual consent and consultation, and holds that the verse protects the child from the effects of divorce {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1004} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1005}."
issue: { ar: "كيف يقرأ الشعراوي مدة الرضاعة ونفقة المرضع وحق الطفل بعد الطلاق؟", en: "How does Sha'rawi read the period of suckling, the nursing mother's maintenance and the child's right after divorce?" }
wings: [ideas]
themes: [family-marriage-kinship, law-and-courts]
periods: [period/prophetic-era]
regions: [global]
relations:
  - { type: related_to, target: passage/quran-2-233 }
