summary:
  ar: "الرامك في الكتاب بارد يابس، قابض لطيف عاقل يمنع انصباب المواد ويسكن الحرارة، ويقوي المعدة مع ماء الآس ويعقل البطن {cite:canon-ibn-sina-print-v1 p.664}"
  en: "Ramik is in the book cold and dry, astringent, subtle and binding, it stops the pouring of humours and calms heat, strengthens the stomach with myrtle water and binds the belly {cite:canon-ibn-sina-print-v1 p.664}"
  ur: "رامک کتاب میں ٹھنڈا خشک ہے، قابض، لطیف اور قبض کرنے والا، مادوں کے بہاؤ کو روکتا اور حرارت کو سکون دیتا ہے، آس کے پانی کے ساتھ معدے کو قوت دیتا ہے اور پیٹ کو باندھتا ہے {cite:canon-ibn-sina-print-v1 p.664}۔"
  es: "En el libro, Ramik es frío y seco, astringente, sutil y aglutinante; detiene el derramamiento de humores y calma el calor, fortalece el estómago con agua de mirto y aprieta el vientre {cite:canon-ibn-sina-print-v1 p.664}"
  fr: "Ramik est décrit dans le livre comme froid et sec, astringent, subtil et fortifiant; il arrête le flux des humeurs et calme la chaleur, fortifie l'estomac avec de l'eau de myrte et resserre le ventre {cite:canon-ibn-sina-print-v1 p.664}"
