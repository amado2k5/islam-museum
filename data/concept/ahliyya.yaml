id: concept/ahliyya
class: concept
kind: term
label: { ar: "الأهلية", en: "Ahliyya (legal capacity: to have rights and duties, and to act; its stages from the womb to full maturity, and what impairs it)" }
summary:
  ar: "الأهلية لغة الصلاحية، وهي نوعان: أهلية وجوب، وهي صلاحية الإنسان لوجوب الحقوق له وعليه، وأهلية أداء، وهي صلاحية صدور الفعل منه على وجه يعتد به شرعا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3647} ومناطها الإنسان في أطواره: الجنين، ثم الطفولة، ثم التمييز، ثم البلوغ، ثم الرشد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3648}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3649}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3650}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3651} وأهلية الوجوب تثبت كاملة منذ الولادة، وناقصة للجنين، وأهلية الأداء تكون قاصرة بالتمييز وكاملة بالبلوغ والعقل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3649}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3650} وتتأثر الأهلية بعوارض سماوية كالجنون والعته والنوم والإغماء والمرض والرق والحيض والنفاس والموت، ومكتسبة كالجهل والسكر والهزل والسفه والسفر والخطأ والإكراه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3657}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3658}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3659}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3660}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3661}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3662}"
  en: "Ahliyya is lexically suitability, and it is of two kinds: capacity to have rights and duties, the capacity of liability; and capacity to act, that is to perform acts recognised by the law. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3647} Its bearer passes through the stages of the foetus, childhood, discernment, puberty and maturity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3648}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3649}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3650}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3651} Liability is complete from birth and incomplete for the foetus; the capacity to act is partial at discernment and full with puberty and reason. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3649}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3650} It is affected by heavenly impediments such as madness, imbecility, sleep, fainting, illness, slavery, menstruation, childbirth and death, and by acquired ones such as ignorance, drunkenness, jest, folly, travel, error and coercion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3657}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3658}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3659}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3660}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3661}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3662}"
