id: concept/ahliyya
class: concept
kind: term
label: { ar: "الأهلية", en: "Ahliyya (legal capacity: to have rights and duties, and to act; its stages from the womb to full maturity, and what impairs it)", fr: "Ahliyya (capacité juridique : avoir des droits et des obligations et accomplir des actes ; ses étapes de la vie fœtale à la pleine maturité et ses entraves)", es: "Ahliyya (capacidad jurídica: tener derechos y deberes, y actuar; sus etapas desde la gestación hasta la plena madurez, y lo que la menoscaba)", ur: "اہلیہ ⁦(قانونی صلاحیت: حقوق و فرائض کا حامل ہونا، اور عمل کرنا؛ اس کے رحم سے مکمل بلوغ تک کے مراحل، اور اس میں کون سی چیزیں خراب ہوتی ہیں)⁩", tr: "Uygunluk", id: "Kelayakan" }
summary:
  ar: "الأهلية لغة الصلاحية، وهي نوعان: أهلية وجوب، وهي صلاحية الإنسان لوجوب الحقوق له وعليه، وأهلية أداء، وهي صلاحية صدور الفعل منه على وجه يعتد به شرعا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3647} ومناطها الإنسان في أطواره: الجنين، ثم الطفولة، ثم التمييز، ثم البلوغ، ثم الرشد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3648}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3649}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3650}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3651} وأهلية الوجوب تثبت كاملة منذ الولادة، وناقصة للجنين، وأهلية الأداء تكون قاصرة بالتمييز وكاملة بالبلوغ والعقل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3649}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3650} وتتأثر الأهلية بعوارض سماوية كالجنون والعته والنوم والإغماء والمرض والرق والحيض والنفاس والموت، ومكتسبة كالجهل والسكر والهزل والسفه والسفر والخطأ والإكراه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3657}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3658}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3659}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3660}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3661}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3662}"
  en: "Ahliyya is lexically suitability, and it is of two kinds: capacity to have rights and duties, the capacity of liability; and capacity to act, that is to perform acts recognised by the law. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3647} Its bearer passes through the stages of the foetus, childhood, discernment, puberty and maturity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3648}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3649}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3650}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3651} Liability is complete from birth and incomplete for the foetus; the capacity to act is partial at discernment and full with puberty and reason. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3649}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3650} It is affected by heavenly impediments such as madness, imbecility, sleep, fainting, illness, slavery, menstruation, childbirth and death, and by acquired ones such as ignorance, drunkenness, jest, folly, travel, error and coercion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3657}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3658}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3659}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3660}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3661}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3662}"
  fr: "Au sens lexical, ahliyya signifie aptitude. On distingue la capacité de jouissance, qui permet d’être titulaire de droits et d’obligations, et la capacité d’exercice, qui permet d’accomplir des actes reconnus par le droit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3647} La personne passe par les étapes de la vie fœtale, de l’enfance, du discernement, de la puberté et de la maturité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3648}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3649}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3650}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3651} La capacité de jouissance est entière dès la naissance et incomplète chez le fœtus. La capacité d’exercice est partielle au stade du discernement et pleine avec la puberté et la raison. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3649}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3650} La capacité est affectée par des empêchements dits célestes, comme la folie, la déficience intellectuelle, le sommeil, l’évanouissement, la maladie, l’esclavage, les règles, l’accouchement et la mort, et par des empêchements acquis, comme l’ignorance, l’ivresse, la plaisanterie, la prodigalité, le voyage, l’erreur et la contrainte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3657}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3658}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3659}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3660}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3661}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3662}"
  es: "Ahliyya es léxicamente idoneidad, y es de dos tipos: capacidad para tener derechos y deberes, la capacidad de responsabilidad; y capacidad para actuar, es decir, para realizar actos reconocidos por la ley. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3647} Su portador pasa por las etapas del feto, la infancia, el discernimiento, la pubertad y la madurez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3648}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3649}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3650}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3651} La responsabilidad es completa desde el nacimiento e incompleta para el feto; La capacidad de actuar es parcial en el discernimiento y plena con la pubertad y la razón. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3649}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3650} Se ve afectada por impedimentos celestiales como la locura, la imbecilidad, el sueño, el desmayo, la enfermedad, la esclavitud, la menstruación, el parto y la muerte, y por impedimentos adquiridos como la ignorancia, la embriaguez, la broma, la necedad, los viajes, el error y la coacción. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3657}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3658}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3659}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3660}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3661}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3662}"
  ur: "اہلیہ لغت کے اعتبار سے موزوں ہے، اور یہ دو طرح کی ہے: حقوق و فرائض کی اہلیت، ذمہ داری کی صلاحیت۔ اور عمل کرنے کی صلاحیت، یعنی قانون کے ذریعے تسلیم شدہ کام انجام دینا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3647} اس کا حامل جنین، بچپن، سمجھداری، بلوغت اور بلوغت کے مراحل سے گزرتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3648}{cite:fiqh-Mawsua-kuwaityya-noor-v3 p.3649}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.3650}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.3650}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.3649}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.3650}{cite:fiqh-mawsua-kuwaitiy-noor-v3 p.3649} ذمہ داری پیدائش سے مکمل ہے اور جنین کے لیے نامکمل ہے۔ عمل کرنے کی صلاحیت فہم میں جزوی اور بلوغت اور عقل سے بھری ہوئی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3649}{cite:fiqh-Mawsua-kuwaitiyya-noor-v3 p.3650} یہ آسمانی رکاوٹوں سے متاثر ہوتا ہے جیسے کہ جنون، بے خوابی، نیند، بیہوشی، بیماری، غلامی، غلامی، مردانہ موت اور ایک مرد کی موت۔ جہالت، شرابی، مذاق، حماقت، سفر، غلطی اور جبر۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3657}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ3658}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ3659}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ3658 صفحہ 3660}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ3661}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3662}"
  tr: "Dilsel olarak kapasite geçerliliktir; bu iki türden oluşur: yetenek ve yükümlülük, yani bir kişinin kendisi ve hakkına sahip haklarını koruma kapasitesi ve İslam hukukuna göre geçerli sayılan bir şekilde gerçekleştirdiği bir eylemin geçerliliğidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3647} Bir kişi için aşamalı referansı şudur: fetüs, sonra çocukluk, sonra ayırt etme, sonra ergenlik, sonra yetişkinlik. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3648} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3649} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3650} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3651} Yükümlülük kapasitesi doğuştan tam, fetüste eksik ve yapma kapasitesi ayırt etme ile sınırlıdır ancak olgunluk ve zekâ ile tamamlanmıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3649} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3650} Uygunluk, delilik, demans, uyku, bayılma, hastalık, kölelik, adet görme, doğum sonrası kanama ve ölüm gibi ilahi belirtiler ile cehalet, sarhoşluk, eğlence, aptallık, seyahat, hata ve zorlama gibi edinilmiş durumlar tarafından etkilenir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3657} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3658} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3659} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3660} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3661} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3662}"
  id: "Secara linguistik, kapasitas adalah validitas; terdiri dari dua jenis: kemampuan dan kewajiban, yaitu kemampuan untuk melindungi diri sendiri dan hak-hak yang menjadi hak seseorang, serta keabsahan suatu tindakan yang dilakukan dengan cara yang dianggap sah menurut hukum Islam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3647} Bagi seseorang, referensi bertahapnya adalah: janin, lalu masa kanak-kanak, kemudian pembedaan, kemudian masa remaja, kemudian dewasa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3648} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3649} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3650} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3651} Kapasitas kewajiban secara inheren lengkap, tidak ada pada janin, dan kemampuan untuk melakukan terbatas oleh kecerdasan tetapi disempurnakan oleh kedewasaan dan kecerdasan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3649} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3650} Kebugaran dipengaruhi oleh tanda-tanda ilahi seperti kegilaan, demensia, tidur, pingsan, penyakit, perbudakan, menstruasi, perdarahan pasca melahirkan, dan kematian, serta kondisi yang diperoleh seperti ketidaktahuan, mabuk, hiburan, kebodohan, perjalanan, kesalahan, dan paksaan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3657} {cite:Fiqh-mawsua-kuwaitiyya-noor-v3 p.3658} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3659} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3660} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3661} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3662}"
