summary:
  ar: "شجرة مباركة زيتونة لا شرقية ولا غربية يكاد زيتها يضيء ولو لم تمسسه نار، ومما تنبت الأرض الزيتون والنخل والأعناب، وشجرة تخرج من طور سيناء تنبت بالدهن."
  en: "A blessed olive tree neither eastern nor western whose oil would almost glow though fire never touched it; of what the earth brings forth are olives, palms and vines, and a tree issuing from Mount Sinai producing oil."
  ur: "مبارک زیتون کا درخت نہ مشرقی نہ مغربی جس کا تیل بغیر آگ لگے روشنی دے سکتا ہو؛ زمین کی پیداوار میں زیتون، کھجور اور انگور ہیں اور طورِ سینا سے ایسا درخت نکلتا ہے جو تیل دیتا ہے۔"
  es: "Un olivo bendito, ni oriental ni occidental, cuyo aceite casi brillaría aunque el fuego jamás lo tocara; de lo que la tierra produce son olivos, palmeras y vides, y un árbol que brota del Monte Sinaí y produce aceite."
  fr: "Un olivier béni, ni oriental ni occidental, dont l'huile brillerait presque sans que le feu ne la touche jamais; de ce que la terre produit sont des oliviers, des palmiers et des vignes, et un arbre issu du mont Sinaï qui produit de l'huile."
