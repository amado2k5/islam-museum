id: "concept/qanun-tadbir-al-ramad"
class: "concept"
kind: "scientific"
label:
  ar: "قانون تدبير الرمد والنوازل إلى العين"
  en: "The shared regimen for ophthalmia and catarrhs to the eye"
  ur: "رمد اور آنکھ کی طرف نوازل کی مشترک تدبیر"
  es: "El régimen compartido para la oftalmía y los catarros oculares"
  fr: "Le traitement commun pour l'ophtalmie et les catarrhes oculaires"
  tr: "Göz Hastalıkları ve Göz Vakalarının Yönetimi Kanunu"
  id: "Undang-Undang Manajemen Oftalmologi dan Kasus Mata"
summary:
  ar: "القانون المشترك في تدبير الرمد وسائر أمراض العين المادية تقليل الغذاء وتخفيفه واختيار ما يولد خلطاً محموداً واجتناب كل مبخر وسوء هضم وإدامة لين الطبيعة والفصد الموافق لجميع أنواعه، وصرف البصر عن البياض والشعاع والبيت الظليم والنوم، والحمام بعد الاستفراغ أفضل علاجه، واجتناب تدهين الرأس وتقطير الدهن في الأذن واستفراغ مبدأ المادة وجذبها إلى ضد الجهة {cite:canon-ibn-sina-print-v2 p.170}"
  en: "The shared canon in the regimen of ramad and the eye's material diseases: lessen and lighten food, choose what breeds a laudable humour, shun every vaporous and ill-digesting thing, keep the bowels loose, and venesection — which suits all its kinds; turn the sight from white and glare, keep a darkened house and bring sleep; the bath after evacuation is its best treatment; shun oiling the head and dripping oil into the ear; evacuate the matter's source and draw it to the opposite side {cite:canon-ibn-sina-print-v2 p.170}"
  ur: "رمد اور آنکھ کے مادی امراض کی مشترک تدبیر کا قانون: غذا کم اور ہلکی کرنا، محمود خلط پیدا کرنے والی چننا، ہر مبخر اور سوء ہضم سے بچنا، قیام طبیعت برقرار رکھنا، اور فصد جو اس کی تمام اقسام کو موافق ہے؛ بینائی کو سفیدی اور چمک سے ہٹانا، گھر تاریک اور نیند برقرار؛ استفراغ کے بعد حمام اس کا بہترین علاج ہے؛ سر میں تیل ملنا اور کان میں تیل ٹپکانا بچنا؛ مادے کے ماخذ کا استفراغ اور اسے مخالف جانب کھینچنا {cite:canon-ibn-sina-print-v2 p.170}"
  es: "El canon compartido en el régimen del Ramadán y las enfermedades oculares materiales: disminuir y aligerar la comida, elegir lo que produce un humor loable, evitar todo lo vaporoso y difícil de digerir, mantener los intestinos sueltos y la flebotomía, que es adecuada para todos los tipos; apartar la vista del blanco y el resplandor, mantener la casa oscura y propiciar el sueño; el baño después de la evacuación es su mejor tratamiento; evitar engrasar la cabeza y gotear aceite en el oído; evacuar la fuente de la materia y llevarla al lado opuesto {cite:canon-ibn-sina-print-v2 p.170}"
  fr: "Le canon commun relatif au régime du ramad et aux maladies oculaires matérielles: réduire et alléger la nourriture, choisir ce qui favorise une humeur louable, éviter tout ce qui est vaporeux et difficile à digérer, maintenir un transit intestinal régulier et pratiquer la saignée – qui convient à tous les types de maladies; détourner la vue de la lumière blanche et de l’éblouissement, maintenir la maison dans l’obscurité et favoriser le sommeil; le bain après l’évacuation est le meilleur traitement; éviter de se huiler la tête et de verser de l’huile dans l’oreille; évacuer la source du problème et la diriger vers le côté opposé {cite:canon-ibn-sina-print-v2 p.170}"
  tr: "Konjonktivit ve diğer tüm fiziksel göz hastalıklarının yönetiminde yaygın hukuk, yiyecekleri azaltmak ve seyreltmek, takdire şayan bir karışım oluşturan ürünleri seçmek, tüm tütsü maddelerinden kaçınmak, sindirimi bozmak, doğanın yumuşaklığını korumak ve her türlü türü ortadan kaldırmak, kusma sonrası beyazlık, ışınlar, karanlık evler, uyku ve güvercinlerden dikkati başka yöne çekmek, başı yağlamamaktan, kulağa yağ damlatmaktan kaçınmak, maddeyi baştan kusmak ve diğer tarafa çekmek {cite:canon-ibn-sina-print-v2 s.170}"
  id: "Hukum umum dalam mengelola konjungtivitis dan semua penyakit mata fisik lainnya adalah mengurangi dan mengencerkan makanan, memilih campuran yang terpuji, menghindari semua zat dupa, pencernaan yang buruk, dan menjaga kelembutan alam serta menghilangkan segala jenis, mengalihkan perhatian dari kulit putih, sinar, rumah gelap, tidur, dan merpati setelah muntah sebagai pengobatan terbaik, menghindari melumasi kepala, meneteskan lemak ke telinga, memuntahkan zat itu sejak awal, dan menariknya ke sisi lain {cite:canon-ibn-sina-print-v2 hlm.170}"
