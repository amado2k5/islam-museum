id: "concept/qanun-tadbir-al-ramad"
class: "concept"
kind: "scientific"
label:
  ar: "قانون تدبير الرمد والنوازل إلى العين"
  en: "The shared regimen for ophthalmia and catarrhs to the eye"
  ur: "رمد اور آنکھ کی طرف نوازل کی مشترک تدبیر"
summary:
  ar: "القانون المشترك في تدبير الرمد وسائر أمراض العين المادية تقليل الغذاء وتخفيفه واختيار ما يولد خلطاً محموداً واجتناب كل مبخر وسوء هضم وإدامة لين الطبيعة والفصد الموافق لجميع أنواعه، وصرف البصر عن البياض والشعاع والبيت الظليم والنوم، والحمام بعد الاستفراغ أفضل علاجه، واجتناب تدهين الرأس وتقطير الدهن في الأذن واستفراغ مبدأ المادة وجذبها إلى ضد الجهة {cite:canon-ibn-sina-print-v2 p.170}"
  en: "The shared canon in the regimen of ramad and the eye's material diseases: lessen and lighten food, choose what breeds a laudable humour, shun every vaporous and ill-digesting thing, keep the bowels loose, and venesection — which suits all its kinds; turn the sight from white and glare, keep a darkened house and bring sleep; the bath after evacuation is its best treatment; shun oiling the head and dripping oil into the ear; evacuate the matter's source and draw it to the opposite side {cite:canon-ibn-sina-print-v2 p.170}"
  ur: "رمد اور آنکھ کے مادی امراض کی مشترک تدبیر کا قانون: غذا کم اور ہلکی کرنا، محمود خلط پیدا کرنے والی چننا، ہر مبخر اور سوء ہضم سے بچنا، قیام طبیعت برقرار رکھنا، اور فصد جو اس کی تمام اقسام کو موافق ہے؛ بینائی کو سفیدی اور چمک سے ہٹانا، گھر تاریک اور نیند برقرار؛ استفراغ کے بعد حمام اس کا بہترین علاج ہے؛ سر میں تیل ملنا اور کان میں تیل ٹپکانا بچنا؛ مادے کے ماخذ کا استفراغ اور اسے مخالف جانب کھینچنا {cite:canon-ibn-sina-print-v2 p.170}"
