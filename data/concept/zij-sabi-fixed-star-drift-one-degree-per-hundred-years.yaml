label: { ar: "انتقال الثوابت درجة في كل مائة سنة عند بطليموس", en: "The drift of the fixed stars by one degree in each hundred years as Ptolemy had it", ur: "بطلیموس کے مطابق ثوابت کا ہر سو سال میں ایک درجہ انتقال", es: "La deriva de las estrellas fijas en un grado cada cien años, como lo había planteado Ptolomeo.", fr: "La dérive des étoiles fixes d'un degré tous les cent ans, comme l'affirmait Ptolémée." }
summary:
  ar: "يذكر النص أن بطليموس ذكر أن الحركة فيما وجده بأرصاده وعلى حسب ما عُمل عليه من قبله تكون في كل مائة سنة درجة واحدة، ولم يكن بين أرصاد بطليموس والأرصاد التي قيس إليها من المدة ما يوجب أن يظهر معه في مثل هذه الحركة تغيير بيّن. وبين الرصد الذي رصده بطليموس والرصد الذي قيس إليه زهاء مائتي سنة، فلما طال الزمان ظهرت الحركة في كل ستة وستين سنة درجة. ومن اختلاف هذين المسيرين وقعت الزيادة مع الكل. {cite:zij-sabi-nallino-byblion pp.195-196}"
  en: "The text says that Ptolemy's observations gave a drift of one degree every hundred years, and that the interval between Ptolemy's observations and those they were compared with was too short to show a clear change in such a motion. The gap between Ptolemy's observation and the one compared with it was about two hundred years, and as time lengthened the drift showed as one degree in every sixty-six years. The difference between the two rates accounts for the excess. {cite:zij-sabi-nallino-byblion pp.195-196}"
  ur: "متن کہتا ہے کہ بطلیموس کے رصدوں سے یہ حرکت ہر سو سال میں ایک درجہ معلوم ہوئی، اور بطلیموس کے رصدوں اور ان سے موازنہ کیے گئے رصدوں کے درمیان مدت اتنی کم تھی کہ ایسی حرکت میں واضح تبدیلی ظاہر نہ ہو سکی۔ بطلیموس کے رصد اور جس سے موازنہ ہوا اس کے درمیان تقریباً دو سو سال تھے، اور زمانہ طویل ہونے پر یہ حرکت ہر چھیاسٹھ سال میں ایک درجہ ظاہر ہوئی۔ انہی دو رفتاروں کے فرق سے زیادتی پیدا ہوئی۔ {cite:zij-sabi-nallino-byblion pp.195-196}"
  es: "El texto indica que las observaciones de Ptolomeo arrojaron una desviación de un grado cada cien años, y que el intervalo entre las observaciones de Ptolomeo y las comparadas con ella era demasiado corto para mostrar un cambio claro en dicho movimiento. El intervalo entre la observación de Ptolomeo y la comparada con ella fue de aproximadamente doscientos años, y a medida que transcurría el tiempo, la desviación se manifestó como un grado cada sesenta y seis años. La diferencia entre ambas tasas explica el exceso. {cite:zij-sabi-nallino-byblion pp.195-196}"
  fr: "Le texte indique que les observations de Ptolémée révélaient une dérive d'un degré tous les cent ans, et que l'intervalle entre ces observations et celles auxquelles elles étaient comparées était trop court pour mettre en évidence une variation significative de ce mouvement. L'écart entre l'observation de Ptolémée et celle à laquelle elle était comparée était d'environ deux cents ans, et, avec l'allongement du temps, la dérive s'est avérée être d'un degré tous les soixante-six ans. La différence entre les deux taux explique l'excédent. {cite:zij-sabi-nallino-byblion pp.195-196}"
