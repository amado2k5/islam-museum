label:
  ar: "بلوط"
  en: "Ballut (oak)"
  fr: "Ballut (chêne)"
  ur: "بلوط ⁦(بلوط کا درخت)⁩"
  es: "Ballut (roble)"
  tr: "meşe"
  id: "ek"
summary:
  ar: "معروف وقابض، والشاهبلوط أقلّه قبضاً، وأشدّه قبضاً جفته وهو قشره الداخل، ثمره ينفع للأورام الحارة في ابتدائها، وورقه يلزق الجراحات إذا سُحق ونُثر، ويمنع سعي القلاع والقروح الساعية إذا أُحرق، وينفع من رطوبة المعدة، وينفع من السحج وقروح الأمعاء {cite:canon-ibn-sina-print-v1 p.408}، {cite:canon-ibn-sina-print-v1 p.409}."
  en: "A known astringent tree. The sweet chestnut-type oak is the least astringent; its inner bark is the most astringent. Its fruit helps early hot swellings, its leaf closes wounds when crushed and sprinkled, burnt and used it stops thrush and creeping ulcers, it helps damp stomach, abrasion and ulcers of the intestines {cite:canon-ibn-sina-print-v1 p.408}, {cite:canon-ibn-sina-print-v1 p.409}."
  fr: "Arbre connu et astringent. Le type châtaignier est le moins astringent ; son écorce intérieure est la plus astringente. Son fruit serait utile au début des gonflements chauds ; ses feuilles broyées et saupoudrées fermeraient les plaies ; brûlé et employé, il arrêterait le muguet et les ulcères rampants, aiderait contre l’humidité gastrique, les érosions et les ulcères intestinaux {cite:canon-ibn-sina-print-v1 p.408}, {cite:canon-ibn-sina-print-v1 p.409}."
  ur: "ایک معروف قابض درخت۔ شاہ بلوط سب سے کم قابض ہے؛ سب سے زیادہ قابض اس کی جِفت یعنی اندرونی چھال ہے۔ اس کا پھل گرم ورموں کی ابتدا میں مفید ہے، پتا کچل کر چھڑکنے سے زخم جوڑتا ہے، جلا کر استعمال کرنے سے منہ کی پھپھوندی اور رینگنے والے چھالے روکتا ہے، معدے کی تری اور آنتوں کی رگڑ اور زخم میں مفید ہے {cite:canon-ibn-sina-print-v1 p.408}، {cite:canon-ibn-sina-print-v1 p.409}۔"
  es: "Un árbol conocido por sus propiedades astringentes. El roble castaño es el menos astringente; su corteza interna es la más astringente. Su fruto ayuda a aliviar las inflamaciones incipientes, sus hojas cierran heridas al ser trituradas y espolvoreadas, quemadas y usadas detienen la candidiasis oral y las úlceras rastreras, ayuda con la humedad estomacal, las abrasiones y las úlceras intestinales {cite:canon-ibn-sina-print-v1 p.408}, {cite:canon-ibn-sina-print-v1 p.409}."
  tr: "Bilinen ve büzüleyicidir. En çok kabız olanı meşe ağacıdır, en şiddetlisi ise kuru deridir. Meyvesi, sıcak tümörlerin başlangıcında faydalıdır. Yaprakları ezilip dağıldığında yaralara yapışır, yandığında ardıç ve yaraların iyileşmesini engeller ve mide nemi ile bağırsak ülserleri için faydalıdır {cite:canon-ibn-sina-print-v1 s.408}, {cite:canon-ibn-sina-print-v1 s.409}."
  id: "Pohon ini dikenal dan astringen. Yang paling sembelit adalah pohon ek, dan yang paling parah adalah kulitnya yang kering. Buahnya bermanfaat untuk tumor panas saat muncul. Daunnya menempel pada luka saat dihancurkan dan tersebar, mencegah penyembuhan sariawan dan luka jika terbakar, serta bermanfaat untuk kelembapan lambung dan tukak lambung {cite:canon-ibn-sina-print-v1 hlm.408}, {cite:canon-ibn-sina-print-v1 hlm.409}."
