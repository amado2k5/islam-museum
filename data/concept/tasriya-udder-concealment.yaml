id: concept/tasriya-udder-concealment
class: concept
kind: legal
label:
  ar: "التصرية"
  en: "Tasriya (leaving a beast's udder unmilked to deceive a buyer)"
  ur: "تصریہ (خریدار کو دھوکہ دینے کے لیے جانور کا تھن نہ دوہنا)"
summary:
  ar: "التصرية أن يترك البائع حلب الناقة أو غيرها عمداً مدة قبل بيعها ليوهم المشتري كثرة اللبن. وهي حرام بالاتفاق إذا قصد بها الإيهام، لأنها تدليس وإضرار. وهي عيب يثبت الخيار للمشتري عند مالك والشافعي وأحمد وأبي يوسف، ولا يثبت عند أبي حنيفة. والعوض عن اللبن صاع من تمر عند أحمد والشافعية في الصحيح، وصاع من غالب قوت البلد عند مالك، وقيمة اللبن عند أبي يوسف. ويشترط ألا يعلم المشتري قبل الشراء، وأن يقصد البائع التصرية، وأن يرد بعد الحلب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5238} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5239} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5240} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5241}"
  en: "Tasriya is when a seller deliberately leaves a she-camel or other beast unmilked before sale so the buyer thinks it gives much milk. It is forbidden by consensus when intended to deceive, as deceit and harm. It is a defect that gives the buyer an option according to Malik, al-Shafii, Ahmad and Abu Yusuf, and not according to Abu Hanifa. The compensation for the milk is a sa of dates according to Ahmad and the sounder Shafii view, a sa of the staple food of the town according to Malik, and the value of the milk according to Abu Yusuf. The buyer must not have known before buying, the seller must have intended it, and the beast must be returned after milking. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5238} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5239} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5240} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5241}"
