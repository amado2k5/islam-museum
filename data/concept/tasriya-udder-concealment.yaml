id: concept/tasriya-udder-concealment
class: concept
kind: legal
label:
  ar: "التصرية"
  en: "Tasriya (leaving a beast's udder unmilked to deceive a buyer)"
  ur: "تصریہ ⁦(خریدار کو دھوکہ دینے کے لیے جانور کا تھن نہ دوہنا)⁩"
  es: "Tasriya (dejar la ubre de un animal sin ordeñar para engañar al comprador)"
  fr: "Tasriya (ne pas traire le pis d'une bête pour tromper un acheteur)"
  tr: "Kararname"
  id: "Dekrit"
summary:
  ar: "التصرية أن يترك البائع حلب الناقة أو غيرها عمداً مدة قبل بيعها ليوهم المشتري كثرة اللبن. وهي حرام بالاتفاق إذا قصد بها الإيهام، لأنها تدليس وإضرار. وهي عيب يثبت الخيار للمشتري عند مالك والشافعي وأحمد وأبي يوسف، ولا يثبت عند أبي حنيفة. والعوض عن اللبن صاع من تمر عند أحمد والشافعية في الصحيح، وصاع من غالب قوت البلد عند مالك، وقيمة اللبن عند أبي يوسف. ويشترط ألا يعلم المشتري قبل الشراء، وأن يقصد البائع التصرية، وأن يرد بعد الحلب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5238} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5239} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5240} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5241}"
  en: "Tasriya is when a seller deliberately leaves a she-camel or other beast unmilked before sale so the buyer thinks it gives much milk. It is forbidden by consensus when intended to deceive, as deceit and harm. It is a defect that gives the buyer an option according to Malik, al-Shafii, Ahmad and Abu Yusuf, and not according to Abu Hanifa. The compensation for the milk is a sa of dates according to Ahmad and the sounder Shafii view, a sa of the staple food of the town according to Malik, and the value of the milk according to Abu Yusuf. The buyer must not have known before buying, the seller must have intended it, and the beast must be returned after milking. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5238} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5239} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5240} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5241}"
  es: "La tasriya se produce cuando un vendedor deja deliberadamente una camella u otro animal sin ordeñar antes de la venta, para que el comprador crea que produce mucha leche. Está prohibida por consenso cuando se pretende engañar, ya que constituye un engaño y un perjuicio. Es un defecto que otorga al comprador una opción según Malik, al-Shafii, Ahmad y Abu Yusuf, pero no según Abu Hanifa. La compensación por la leche es un sa de dátiles según Ahmad y la opinión más sólida de Shafii, un sa del alimento básico de la ciudad según Malik, y el valor de la leche según Abu Yusuf. El comprador no debe haber tenido conocimiento de esto antes de la compra, el vendedor debe haberlo planeado y el animal debe ser devuelto después del ordeño. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5238} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5239} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5240} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5241}"
  fr: "La tasriya consiste pour un vendeur à laisser délibérément une chamelle ou un autre animal non trait avant la vente afin de faire croire à l'acheteur qu'il produit beaucoup de lait. Cette pratique est unanimement interdite lorsqu'elle est commise dans le but de tromper, car elle constitue une tromperie et un préjudice. Selon Malik, al-Shafi'i, Ahmad et Abu Yusuf, il s'agit d'un défaut qui offre une option à l'acheteur, contrairement à l'avis d'Abu Hanifa. La compensation pour le lait est un sa de dattes selon Ahmad et l'avis plus solide de l'école shafi'ite, un sa de l'aliment de base de la ville selon Malik, et la valeur du lait selon Abu Yusuf. L'acheteur ne doit pas avoir eu connaissance de la tasriya avant l'achat, le vendeur doit l'avoir fait intentionnellement, et l'animal doit être restitué après la traite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5238} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5239} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5240} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5241}"
  ur: "تسریہ وہ ہے جب بیچنے والا جان بوجھ کر اونٹنی یا دوسرے جانور کو فروخت سے پہلے بغیر دودھ کے چھوڑ دیتا ہے تاکہ خریدار کے خیال میں یہ بہت زیادہ دودھ دیتی ہے۔ یہ اجماع کی طرف سے حرام ہے جب دھوکہ دینا، دھوکہ دہی اور نقصان کے طور پر. یہ وہ عیب ہے جو خریدار کو مالک، شافعی، احمد اور ابو یوسف کے مطابق اختیار دیتا ہے، نہ کہ ابو حنیفہ کے نزدیک۔ دودھ کا معاوضہ احمد اور شافعی کے نزدیک کھجور کا ایک صاع ہے، مالک کے نزدیک شہر کی خوراک کا ایک صاع ہے اور ابو یوسف کے نزدیک دودھ کی قیمت ہے۔ خریدار کو خریدنے سے پہلے معلوم نہیں ہونا چاہیے، بیچنے والے نے اس کا ارادہ کیا ہو گا، اور حیوان کو دودھ دینے کے بعد واپس کر دینا چاہیے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5238} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5239} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5240} صفحہ 5241}"
  tr: "Al-Tasiriyah, satıcının dişi deveyi veya başka bir şeyi sağımayı satmadan önce kasıtlı olarak bırakarak alıcıyı büyük miktarda süt sanmasına kandırmasıdır. Aldatma amacıyla yapılıyorsa oybirliğiyle yasaktır, çünkü bu tadlis (tadlis) ve zarardır. Bu, alıcıya Malik, Al-Shafi'i, Ahmed ve Abu Yusuf'a göre seçenekli bir kusurdur, ancak Abu Hanifa'ya göre değildir. Süt için verilen tazminat, Ahmed ve Sahih'e göre hurma ve Şafi'lerin sa'sı, sahibine göre ülkenin çoğu yiyeceğinin sa'sı ve Abu Yusuf'a göre sütün değeridir. Alıcının satın almadan önce bilmemesi, satıcının kurban açıklamasını amaçlaması ve sütün sağımdan sonra geri verilmesi şarttır. {alıntı:) fiqh-mawsua-kuwaitiyya-noor-v3 s.5238} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5239} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5240} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5241}"
  id: "Al-Tasiriyah adalah bahwa penjual sengaja membiarkan memerah unta betina atau lainnya untuk sementara waktu sebelum menjualnya untuk menipu pembeli agar mengira akan mengambil susu dalam jumlah besar. Tindakan ini secara bulat dilarang jika dimaksudkan untuk menipu, karena itu adalah tadlis (tadli) dan merugi. Ini adalah cacat yang ditentukan bagi pembeli dengan opsi menurut Malik, Al-Shafi'i, Ahmad, dan Abu Yusuf, tetapi tidak menurut Abu Hanifa. Kompensasi untuk susu adalah sa' kurma menurut Ahmad dan Shafi'i dalam Sahih, sa' dari sebagian besar makanan negara menurut pemilik, dan nilai susu menurut Abu Yusuf. Pembeli diwajibkan tidak mengetahui sebelum membeli, bahwa penjual bermaksud penjelasan pengorbanan, dan susu dikembalikan setelah diperah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5238} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5239} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5240} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5241}"
