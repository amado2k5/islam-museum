id: concept/freedom-of-honour-in-islam
class: concept
kind: ethical
label:
  ar: "الحرية في الأعراض"
  en: "Freedom of honour in Islam"
  es: "Libertad de honor en el Islam"
  fr: "La liberté d'honneur en islam"
  ur: "اسلام میں عزت کی آزادی"
  tr: "Belirtilerin serbestliği"
  id: "Kebebasan gejala"
summary:
  ar: "يرى محمد الخضر حسين أن الإنسان يحب أن يُحفظ عرضه من الطعن، وأن الشرع يجعل العرض كالدم واللحم في الحرمة، فلا يحل لأحد أن ينشر عيوب غيره المستورة {cite:al-hurriyya-fi-al-islam-azhar p. 84} {cite:al-hurriyya-fi-al-islam-azhar p. 85}. ويستثني من ذلك ما يقتضيه درء المفسدة، كأن يُبيّن عيب الرجل لمن يعزم على معاملته أو مصاهرته نصيحة له {cite:al-hurriyya-fi-al-islam-azhar p. 85} {cite:al-hurriyya-fi-al-islam-azhar p. 86}. ويستثني كذلك من أعلن فسقه وهتك ستره بنفسه، فلا يُعد ذكره غيبة على هذا النحو {cite:al-hurriyya-fi-al-islam-azhar p. 85}. ويربط الكاتب بين قوة إرادة الإنسان في صون عرضه وارتفاع همته، وضعفها وانحطاطه {cite:al-hurriyya-fi-al-islam-azhar p. 84}."
  en: "Muhammad al-Khidr Husayn holds that a person naturally wants his honour kept free from attack, and that the law treats honour as sacred as blood and flesh, so no one may spread another's hidden faults (pp. 84-85). He allows an exception where preventing harm requires it, such as disclosing a man's fault in sincere counsel to someone about to marry into his family or deal with him (pp. 85-86). He also excludes a person who has openly displayed his own wrongdoing, whose case is not backbiting in the same sense (p. 85). He links a strong will for guarding one's honour to a high aim, and a weak will to decline (p. 84)."
  es: "Muhammad al-Khidr Husayn sostiene que, naturalmente, toda persona desea que su honor permanezca intacto, y que la ley considera el honor tan sagrado como la sangre y la carne, por lo que nadie puede divulgar las faltas ocultas de otro (págs. 84-85). Admite una excepción cuando la prevención de daños lo exige, como revelar la falta de un hombre en un consejo sincero a alguien que está a punto de casarse con un miembro de su familia o de hacer negocios con él (págs. 85-86). También excluye a quien ha exhibido abiertamente su propia falta, cuyo caso no constituye difamación en el mismo sentido (pág. 85). Vincula una fuerte voluntad de proteger el honor con un propósito elevado, y una débil voluntad de renunciar a él (pág. 84)."
  fr: "Muhammad al-Khidr Husayn soutient qu'il est naturel pour une personne de vouloir préserver son honneur et que la loi le considère comme sacré, au même titre que le sang et la chair; nul ne peut donc divulguer les fautes cachées d'autrui (p. 84-85). Il admet une exception lorsque la prévention d'un préjudice l'exige, par exemple lorsqu'il s'agit de révéler la faute d'un homme dans le cadre d'un conseil sincère à une personne sur le point d'épouser un membre de sa famille ou de faire affaire avec lui (p. 85-86). Il exclut également celui qui a publiquement reconnu sa propre faute, ce qui ne relève pas de la médisance au même titre que la médisance (p. 85). Il associe une forte volonté de préserver son honneur à un idéal élevé et une faible volonté de décliner (p. 84)."
  ur: "محمد الخضر حسین کا خیال ہے کہ ایک شخص فطری طور پر چاہتا ہے کہ اس کی عزت کو حملے سے پاک رکھا جائے، اور یہ کہ قانون عزت کو خون اور گوشت کی طرح مقدس سمجھتا ہے، اس لیے کوئی بھی دوسرے کے چھپے ہوئے عیبوں کو نہ پھیلا سکے ⁦(صفحہ 84-85)⁩۔ وہ ایک استثناء کی اجازت دیتا ہے جہاں نقصان کو روکنے کی ضرورت ہوتی ہے، جیسے کہ کسی شخص کو اپنے خاندان میں شادی کرنے یا اس کے ساتھ معاملہ کرنے کے بارے میں مخلصانہ مشورے میں آدمی کی غلطی کا انکشاف کرنا ⁦(صفحہ 85-86)⁩۔ وہ ایسے شخص کو بھی خارج کرتا ہے جس نے کھلم کھلا اپنی غلطی کا مظاہرہ کیا ہو، جس کا معاملہ اسی معنی میں غیبت نہ ہو ⁦(ص 85)⁩۔ وہ اپنی عزت کی حفاظت کے لیے مضبوط ارادے کو اعلیٰ مقصد سے جوڑتا ہے، اور کمزور ارادے کو زوال کے لیے ⁦(ص 84)⁩۔"
  tr: "Muhammed El-Hidr Hüseyin, bir kişinin onurunu saldırıya uğramaktan koruması gerektiğine ve Şeriatın onuru kutsallıkta kan ve et gibi koyduğuna, bu yüzden gizli olanların kusurlarını açığa çıkarmasının izin verilmediğine inanır. {cite:al-hurriyya-fi-al-islam-azhar s. 84} {cite:al-hurriyya-fi-al-islam-azhar s. 85}. Zararı önlemek için gerekli olanlarda istisnalar yapar; örneğin, bir erkeğin hatasını ona tavsiye olarak davranmak veya evlenmek isteyen birine göstermek {cite:al-hurriyya-fi-al-islam-azhar s. 85} {cite:al-hurriyya-fi-al-islam-azhar s. 86}. Ayrıca, ahlaksızlığını ilan eden ve kendi kimliğini ihlal edenleri de dışlar; bu nedenle onları bu şekilde anmak sırt iğneme sayılmaz, {cite:al-hurriyya-fi-al-islam-azhar s. 85}. Yazar, bir kişinin onurunu koruma iradesinin gücünü ve hırsının yükseltilmesini, zayıflığını ve düşüşünü ilişkilendirir {cite:al-hurriyya-fi-al-islam-azhar s. 84}."
  id: "Muhammad Al-Khidr Hussein percaya bahwa seseorang harus melindungi kehormatannya dari serangan, dan bahwa Syariah menempatkan kehormatan seperti darah dan daging dalam kesucian, sehingga tidak diperbolehkan bagi siapa pun untuk mengungkapkan kesalahan orang lain yang tersembunyi. {cite:al-hurriyya-fi-al-islam-azhar hlm. 84} {cite:al-hurriyya-fi-al-islam-azhar hlm. 85}. Ia membuat pengecualian terhadap hal-hal yang diperlukan untuk mencegah bahaya, seperti menunjukkan kesalahan seorang pria kepada seseorang yang berniat memperlakukan atau menikahinya sebagai nasihat {cite:al-hurriyya-fi-al-islam-azhar hlm. 85} {cite:al-hurriyya-fi-al-islam-azhar hlm. 86}. Ia juga mengecualikan mereka yang menyatakan ketidakmoralannya dan melanggar penutup diri sendiri, sehingga menyebutkan mereka tidak dianggap sebagai fitnah seperti ini {cite:al-hurriyya-fi-al-islam-azhar hlm. 85}. Penulis mengaitkan kekuatan kehendak seseorang untuk menjaga kehormatan dan peningkatan ambisinya, serta kelemahan dan kemundurannya {cite:al-hurriyya-fi-al-islam-azhar hlm. 84}."
