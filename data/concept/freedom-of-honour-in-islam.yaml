id: concept/freedom-of-honour-in-islam
class: concept
kind: ethical
label:
  ar: "الحرية في الأعراض"
  en: "Freedom of honour in Islam"
summary:
  ar: "يرى محمد الخضر حسين أن الإنسان يحب أن يُحفظ عرضه من الطعن، وأن الشرع يجعل العرض كالدم واللحم في الحرمة، فلا يحل لأحد أن ينشر عيوب غيره المستورة {cite:al-hurriyya-fi-al-islam-azhar p. 84} {cite:al-hurriyya-fi-al-islam-azhar p. 85}. ويستثني من ذلك ما يقتضيه درء المفسدة، كأن يُبيّن عيب الرجل لمن يعزم على معاملته أو مصاهرته نصيحة له {cite:al-hurriyya-fi-al-islam-azhar p. 85} {cite:al-hurriyya-fi-al-islam-azhar p. 86}. ويستثني كذلك من أعلن فسقه وهتك ستره بنفسه، فلا يُعد ذكره غيبة على هذا النحو {cite:al-hurriyya-fi-al-islam-azhar p. 85}. ويربط الكاتب بين قوة إرادة الإنسان في صون عرضه وارتفاع همته، وضعفها وانحطاطه {cite:al-hurriyya-fi-al-islam-azhar p. 84}."
  en: "Muhammad al-Khidr Husayn holds that a person naturally wants his honour kept free from attack, and that the law treats honour as sacred as blood and flesh, so no one may spread another's hidden faults (pp. 84-85). He allows an exception where preventing harm requires it, such as disclosing a man's fault in sincere counsel to someone about to marry into his family or deal with him (pp. 85-86). He also excludes a person who has openly displayed his own wrongdoing, whose case is not backbiting in the same sense (p. 85). He links a strong will for guarding one's honour to a high aim, and a weak will to decline (p. 84)."
