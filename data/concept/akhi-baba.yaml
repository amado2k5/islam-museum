label:
  ar: "أخي بابا"
  en: "Akhi Baba (title of the guild shaykh and tanners' head)"
  fr: "Akhi Baba (titre du cheikh des corporations et du chef des tanneurs)"
  es: "Akhi Baba (título del jeque del gremio y jefe de los curtidores)"
  ur: "اکی بابا ⁦(گلڈ شیخ اور ٹینرز کے سربراہ کا عنوان)⁩"
  tr: "Kardeşim babam"
  id: "Saudaraku, ayahku"
summary:
  ar: "أخي بابا لقب شيخ تكيّة أخي إوران في قرشهير، ويُمنح كذلك لنوابه في الطوائف الحرفية بالأناضول والروملي والبوسنة، وخاصة طائفة الدباغين وأهل الجلود، ولرؤسائها؛ ومهمته الأساسية تلقين المتدرجين بالتحزيم ⁦(شد الكمربند)⁩ في الطائفة، وكانت لهم السلطة على أغلب الطوائف التركية حتى إلغاء الطوائف القديمة سنة 1908م {cite:encyclopaedia-of-islam-2 vol. 1 p. 345-346}."
  en: "Akhi Baba was the title of the shaykh of the tekke of Akhi Evran at Kirshehir, and was also given to his delegates in the Turkish guilds of Anatolia, Rumelia and Bosnia, especially those of the tanners and leather workers, and to the heads of those guilds. Its main task was to initiate apprentices by the girding ceremony; the Akhi Babas came to control most Turkish guilds until the old guilds were abolished in 1908 {cite:encyclopaedia-of-islam-2 vol. 1 p. 345-346}."
  fr: "Akhi Baba était le titre du cheikh du tekke d’Akhi Evran à Kirshehir. Il était également donné à ses délégués dans les corporations turques d’Anatolie, de Roumélie et de Bosnie, surtout chez les tanneurs et autres artisans du cuir, ainsi qu’aux chefs de ces corporations. Sa fonction principale était d’initier les apprentis par la cérémonie de la ceinture. Les Akhi Babas en vinrent à contrôler la plupart des corporations turques jusqu’à l’abolition des anciennes corporations en 1908 {cite:encyclopaedia-of-islam-2 vol. 1 p. 345-346}."
  es: "Akhi Baba era el título del shaykh de la tekke de Akhi Evran en Kirshehir, y también se otorgaba a sus delegados en los gremios turcos de Anatolia, Rumelia y Bosnia, especialmente a los de curtidores y trabajadores del cuero, y a los jefes de dichos gremios. Su principal tarea era iniciar a los aprendices mediante la ceremonia de ceñido; los Akhi Babas llegaron a controlar la mayoría de los gremios turcos hasta que los antiguos gremios fueron abolidos en 1908 {cite:encyclopaedia-of-islam-2 vol. 1 p. 345-346}."
  ur: "اخی بابا کو کرشیر میں اکی ایورن کے ٹیکے کے شیخ کا خطاب تھا، اور اناطولیہ، رومیلیا اور بوسنیا کے ترک گلڈز میں ان کے مندوبین کو بھی دیا گیا تھا، خاص طور پر چمڑے اور چمڑے کے کام کرنے والوں اور ان گلڈوں کے سربراہوں کو۔ اس کا بنیادی کام گارڈنگ کی تقریب کے ذریعے اپرنٹس کو شروع کرنا تھا۔ اکی بابا زیادہ تر ترک گلڈز کو کنٹرول کرنے میں آ گئے یہاں تک کہ 1908 میں پرانے گلڈز کو ختم کر دیا گیا۔ 1 ص۔ 345-346}۔"
  tr: "Kardeşim Baba, Karşehir'deki Akhi Uran Tekkiyeh'inin Şeyhi unvanıdır ve ayrıca Anadolu, Romelia ve Bosna'daki zanaat tarikatlarındaki yardımcılarına, özellikle tabakçılara ve deri işçilerine ve liderlerine verilir. Ana görevi, mezunlara mezhep içinde kemer takmayı (kemeri sıkmayı) öğretmektir ve 1908'de eski tarikatların kaldırılmasına kadar çoğu Türk mezhebi üzerinde yetki elinde tuttular {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 345-346}."
  id: "Saudaraku Baba adalah gelar Sheikh dari Akhi Uran Tekkiyeh di Karşehir dan juga diberikan kepada asistennya dalam ordo kerajinan di Anatolia, Romelia, dan Bosnia, terutama para penyamak kulit, pengrajin kulit, dan pemimpin. Tugas utamanya adalah mengajarkan lulusan cara memakai sabuk (mengencangkan ikat pinggang) di dalam sekte, dan mereka memegang otoritas atas sebagian besar sekte Turki hingga penghapusan tarekat lama pada tahun 1908 {cite:Encyclopaedia-of-Islam-2, vol. 1, hlm. 345-346}."
