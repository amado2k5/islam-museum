label:
  ar: "أخي بابا"
  en: "Akhi Baba (title of the guild shaykh and tanners' head)"
summary:
  ar: "أخي بابا لقب شيخ تكيّة أخي إوران في قرشهير، ويُمنح كذلك لنوابه في الطوائف الحرفية بالأناضول والروملي والبوسنة، وخاصة طائفة الدباغين وأهل الجلود، ولرؤسائها؛ ومهمته الأساسية تلقين المتدرجين بالتحزيم (شد الكمربند) في الطائفة، وكانت لهم السلطة على أغلب الطوائف التركية حتى إلغاء الطوائف القديمة سنة 1908م {cite:encyclopaedia-of-islam-2 vol. 1 p. 345-346}."
  en: "Akhi Baba was the title of the shaykh of the tekke of Akhi Evran at Kirshehir, and was also given to his delegates in the Turkish guilds of Anatolia, Rumelia and Bosnia, especially those of the tanners and leather workers, and to the heads of those guilds. Its main task was to initiate apprentices by the girding ceremony; the Akhi Babas came to control most Turkish guilds until the old guilds were abolished in 1908 {cite:encyclopaedia-of-islam-2 vol. 1 p. 345-346}."
