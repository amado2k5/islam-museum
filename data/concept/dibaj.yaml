label:
  ar: "الديباج"
  en: "Dibaj (brocade woven of silk)"
  ur: "دیباج ⁦(ریشمی کپڑا)⁩"
  es: "Dibaj (brocado tejido de seda)"
  fr: "Dibaj (brocart tissé en soie)"
  tr: "Brokar"
  id: "Brokat"
summary:
  ar: "الديباج ضرب من الثياب سداه ولحمته من الإبريسم، أي الحرير الطبيعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8309} وأحكامه في الجملة أحكام الحرير، ولم يذكر الفقهاء أحكاما خاصة به إلا في بعض الفروع، ومنها أن الحنفية كرهوا الاستجمار بخرقة الديباج لإفساد المال من غير ضرورة، وجوزه الشافعية حتى للرجال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8309} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8309}"
  en: "Dibaj is a kind of cloth whose warp and weft are of silk, that is natural silk. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8309} Its general rules are those of silk, and the jurists give no separate rules for it except in some particular cases; the Hanafis disliked wiping oneself with a piece of dibaj as wasting property without need, while the Shafi'is allowed it even for men because such use is not treated as ordinary use of it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8309} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8309}"
  ur: "دیباج ایسا کپڑا ہے جس کا تانا اور بانا ریشم کا ہو۔ اس کے احکام عموماً ریشم کے احکام ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8309}"
  es: "El dibaj es un tipo de tela cuya urdimbre y trama son de seda, es decir, seda natural. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8309} Sus reglas generales son las de la seda, y los juristas no establecen reglas específicas para él, salvo en algunos casos particulares; los hanafíes desaprobaban limpiarse con un trozo de dibaj por considerarlo un desperdicio innecesario, mientras que los shafiíes lo permitían incluso para los hombres, ya que dicho uso no se considera un uso ordinario. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8309} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8309}"
  fr: "Le dibaj est un type de tissu dont la chaîne et la trame sont en soie naturelle. Ses règles générales sont celles de la soie, et les juristes ne donnent pas de règles spécifiques, sauf dans certains cas particuliers. Les hanafites désapprouvent de s'essuyer avec un morceau de dibaj, considérant cela comme un gaspillage inutile, tandis que les shafi'ites l'autorisent même pour les hommes, car cet usage n'est pas considéré comme un usage ordinaire."
  tr: "Dibaj, kumaşı ve atkı kısmı ipekten, yani doğal ipekten yapılmış bir giysi türüdür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8309} Genel olarak hükümleri ipekle ilgilidir ve hukukçular bazı dallarda bununla ilgili belirli kararlar belirtmişlerdir; bunlar arasında Hanafilerin serveti gereksiz yere bozmak için brokar kumaş kullanmaktan hoşlanmadıklarını ve Şafi'lerin erkekler için bile izin verdiğini belirtmişlerdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8309} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8309}"
  id: "Dibaj adalah jenis pakaian yang kain dan pakannya terbuat dari sutra, yaitu sutra alami. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8309} Peraturan umumnya adalah sutra, dan para ahli hukum hanya menyebutkan aturan spesifik tentangnya di beberapa cabang, termasuk bahwa Hanafi tidak suka menggunakan kain brokat untuk merusak kekayaan secara tidak perlu, dan Shafi'i mengizinkannya bahkan untuk pria. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8309} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8309}"
