summary:
  ar: "الديباج ضرب من الثياب سداه ولحمته من الإبريسم، أي الحرير الطبيعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8309} وأحكامه في الجملة أحكام الحرير، ولم يذكر الفقهاء أحكاما خاصة به إلا في بعض الفروع، ومنها أن الحنفية كرهوا الاستجمار بخرقة الديباج لإفساد المال من غير ضرورة، وجوزه الشافعية حتى للرجال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8309} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8309}"
  en: "Dibaj is a kind of cloth whose warp and weft are of silk, that is natural silk. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8309} Its general rules are those of silk, and the jurists give no separate rules for it except in some particular cases; the Hanafis disliked wiping oneself with a piece of dibaj as wasting property without need, while the Shafi'is allowed it even for men because such use is not treated as ordinary use of it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8309} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8309}"
  ur: "دیباج ایسا کپڑا ہے جس کا تانا اور بانا ریشم کا ہو۔ اس کے احکام عموماً ریشم کے احکام ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8309}"
