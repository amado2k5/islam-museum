  es: "Una piedra templada en aceite y usada con agua; se dice que las alimañas huyen de ella."
  fr: "Une pierre trempée dans l'huile et utilisée avec de l'eau; on dit que la vermine la fuit."
  tr: "Yağla söndürülen ve suyla kullanılan bir taştır ve zavallıların kaçmasına yardımcı olduğu söylenir."
  id: "Batu yang dipadamkan dengan minyak dan digunakan dengan air, dan dikatakan bahwa batu itu membantu para penderita melarikan diri."
