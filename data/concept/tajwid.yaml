summary:
  ar: "التجويد علم إخراج الحروف من مخارجها وأداء القراءة على وجهها؛ صنّف الشاطبي منظومته «حرز الأماني ووجه التهاني» — الشاطبية — متنًا جامعًا فيه {cite:matn-shatibiyya-ghawthani-2010}."
  en: "Tajwid is the science of articulating the letters from their points of articulation and performing the recitation properly; al-Shatibi composed his poem 'Hirz al-Amani' — the Shatibiyya — as its comprehensive matn {cite:matn-shatibiyya-ghawthani-2010}."
  es: "Tajwid es la ciencia de articular las letras desde sus puntos de articulación y realizar la recitación correctamente; al-Shatibi compuso su poema 'Hirz al-Amani' — el Shatibiyya — como su matn completo {cite:matn-shatibiyya-ghawthani-2010}."
  fr: "Le Tajwid est la science de l'articulation des lettres à partir de leurs points d'articulation et de l'exécution correcte de la récitation; al-Shatibi a composé son poème 'Hirz al-Amani' — la Shatibiyya — comme son matn complet {cite:matn-shatibiyya-ghawthani-2010}."
  ur: "تجوید حروف کو ان کے نقطہ نظر سے بیان کرنے اور تلاوت کو صحیح طریقے سے انجام دینے کی سائنس ہے۔ الشاطبی نے اپنی نظم 'حرز الامانی' - شاطبیہ - کو اس کی جامع متن کے طور پر ترتیب دیا ہے۔"
  tr: "Tacvid, harflerin artikülasyon noktalarından telafi edilip yüzlerinde okuma yapımı bilimidir; El-Şatibi, \"Hariz al-Amani wa Wajh al-Tahani\" adlı şiirini yazmıştır — Al-Shatibiyyah — bu metinde derlenmiştir {cite:matn-shatibiyya-ghawthani-2010}."
  id: "Tajweed adalah ilmu mengartikulasikan huruf dari titik artikulasi mereka dan melakukan pembacaan di wajah mereka; Al-Shatibi menyusun puisinya \"Hariz al-Amani wa Wajh al-Tahani\" — Al-Shatibiyyah — sebuah teks yang disusun di dalamnya {cite:matn-shatibiyya-ghawthani-2010}."
