summary:
  ar: "غرب في الكتاب شجرة يستعمل لحاؤها وصمغها ويتولد عليها بورق جيد، وزهرها وورقها وعصارتهما مجففة بلا لذع وفيها عفوصة، ولحاؤها أيبس؛ ويذكر الكتاب نفعا للثآليل والجراح الطرية والنقرس ووجع الأذن والحزاز وظلمة البصر ونفث الدم، وأن عصارته تخرج العلق {cite:canon-ibn-sina-print-v1 p.726}"
  en: "Gharab is in the book a tree whose bark and gum are used and on which a good bawraq forms; its flower, leaf and their juice are drying without stinging and have an astringency, and its bark is drier; the book records benefit for warts, fresh wounds, gout, earache, hazaz, dimness of sight and spitting of blood, and says that its juice expels leeches {cite:canon-ibn-sina-print-v1 p.726}"
  ur: "غرب کتاب میں ایک درخت ہے جس کی چھال اور گوند استعمال ہوتی ہے اور جس پر اچھا بَورق بنتا ہے؛ اس کا پھول، پتا اور ان کا رس بغیر چبھن کے خشک کرنے والے ہیں اور ان میں قبض ہے، اور اس کی چھال زیادہ خشک ہے؛ کتاب مسوں، تازہ زخموں، نقرس، کان کے درد، حزاز، نظر کی دھندلاہٹ اور خون تھوکنے میں فائدہ بتاتی ہے، اور کہتی ہے کہ اس کا رس جونکوں کو نکالتا ہے {cite:canon-ibn-sina-print-v1 p.726}۔"
  es: "Gharab es, según el libro, un árbol cuya corteza y resina se utilizan y del cual se forma un buen bawraq; su flor, hoja y su savia son secantes sin causar escozor y tienen astringencia, y su corteza es más seca; el libro registra beneficios para las verrugas, heridas recientes, gota, dolor de oído, hazaz, visión borrosa y sangrado, y dice que su savia expulsa las sanguijuelas {cite:canon-ibn-sina-print-v1 p.726}"
