id: concept/fitnat-al-dajjal
class: concept
kind: doctrine
label:
  ar: فتنة الدجال
  en: The Trial of the Dajjal
  ur: دجال کا فتنہ
summary:
  ar: "فتنة الدجال من أعظم فتن آخر الزمان: يفتن الناس بالإيمان والكفر والرزق، ويمر عليه سبعون يوما في كل يوم ألف سنة إلا يوم يكون كسبعون سنة، ومن آمن به وكفر بالله دخل الجنة، ومن كفر به وآمن بالله دخل النار."
  en: "The Dajjal's trial is the greatest trial of the last days: he tests people in faith, disbelief and provision, passing over them for decades; each day is like a thousand years except one like seventy years. Whoever believes in him and disbelieves God enters paradise, and whoever disbelieves him and believes God enters hell."
  ur: "دجال کا فتنہ آخر زمانے کا عظیم فتنہ ہے: وہ لوگوں کو ایمان، کفر اور رزق میں آزماتا ہے، اور سات دہائیوں تک ان پر گزرتا ہے جس میں ہر دن ایک ہزار سال جیسا ہوتا ہے سوائے ایک دن کے جو ستر سال جیسا ہے۔ جس نے اس پر ایمان لایا اور اللہ کا انکار کیا وہ جنت میں، اور جس نے اس کا انکار کیا اور اللہ پر ایمان لایا وہ آگ میں۔"
