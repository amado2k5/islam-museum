id: concept/fitnat-al-dajjal
class: concept
kind: doctrine
label:
  ar: فتنة الدجال
  en: The Trial of the Dajjal
  ur: دجال کا فتنہ
  es: "El juicio del Dajjal"
  fr: "Le procès du Dajjal"
  tr: "Deccal'in Baştan Çıkarılması"
  id: "Godaan Antikristus"
summary:
  ar: "فتنة الدجال من أعظم فتن آخر الزمان: يفتن الناس بالإيمان والكفر والرزق، ويمر عليه سبعون يوما في كل يوم ألف سنة إلا يوم يكون كسبعون سنة، ومن آمن به وكفر بالله دخل الجنة، ومن كفر به وآمن بالله دخل النار."
  en: "The Dajjal's trial is the greatest trial of the last days: he tests people in faith, disbelief and provision, passing over them for decades; each day is like a thousand years except one like seventy years. Whoever believes in him and disbelieves God enters paradise, and whoever disbelieves him and believes God enters hell."
  ur: "دجال کا فتنہ آخر زمانے کا عظیم فتنہ ہے: وہ لوگوں کو ایمان، کفر اور رزق میں آزماتا ہے، اور سات دہائیوں تک ان پر گزرتا ہے جس میں ہر دن ایک ہزار سال جیسا ہوتا ہے سوائے ایک دن کے جو ستر سال جیسا ہے۔ جس نے اس پر ایمان لایا اور اللہ کا انکار کیا وہ جنت میں، اور جس نے اس کا انکار کیا اور اللہ پر ایمان لایا وہ آگ میں۔"
  es: "La prueba del Dajjal es la más grande de los últimos días: pone a prueba a las personas en fe, incredulidad y provisión, pasando por alto durante décadas; cada día es como mil años, excepto uno que es como setenta. Quien cree en él y no cree en Dios entra en el paraíso, y quien no cree en él y cree en Dios entra en el infierno."
  fr: "L'épreuve du Dajjal est la plus grande des dernières années: il met à l'épreuve la foi, l'incrédulité et la subsistance des hommes, les ignorant pendant des décennies; chaque jour est comme mille ans, sauf un qui est comme soixante-dix ans. Quiconque croit en lui et ne croit pas en Dieu entrera au Paradis, et quiconque ne croit pas en lui et croit en Dieu entrera en Enfer."
  tr: "Deccal'in sınavı, kıyamet zamanlarının en büyük sınavlarından biridir: İnsanları iman, inançsızlık ve erzakla sınar ve her gün yetmiş gün geçer, bin yıl hariç, bir gün yetmiş yıl hariç. O'na inanan ve Tanrı'ya inanmayan cennete girer; ona inanmaz ve Tanrı'ya inanan cehenneme girer."
  id: "Ujian Antikristus adalah salah satu ujian terbesar di akhir zaman: Dia menguji orang dengan iman, ketidakpercayaan, dan penyediaan, dan tujuh puluh hari berlalu baginya setiap hari, seribu tahun, kecuali hari yang mirip tujuh puluh tahun. Siapa pun yang percaya dan tidak percaya akan Tuhan akan masuk Surga, dan siapa pun yang tidak percaya dan percaya akan masuk ke Neraka."
