summary:
  ar: "يذكر ابن سينا أن اللحم الأحمر الكثير يدل على الرطوبة والحرارة، واليسير بلا شحم كثير على اليبس والحرارة، وأن السمين والشحم يدلان على البرودة، وأن قلتهما تدل على الحرارة {cite:canon-ibn-sina-print-v1 p.159}."
  en: "Ibn Sina says much red flesh points to moisture and heat, a little with no great fat to dryness and heat, that fat and suet point to cold, and that their scarcity points to heat {cite:canon-ibn-sina-print-v1 p.159}."
