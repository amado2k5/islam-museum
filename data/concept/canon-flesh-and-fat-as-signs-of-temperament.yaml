id: concept/canon-flesh-and-fat-as-signs-of-temperament
class: concept
kind: scientific
label:
  ar: "اللحم والشحم دليلان على المزاج عند ابن سينا"
  en: "Flesh and fat as signs of temperament in the Canon"
  fr: "Chair et graisse comme signes du tempérament dans le Canon"
  ur: "گوشت اور چربی بطور علامتِ مزاج، قانون کے مطابق"
  es: "La carne y la grasa como signos de temperamento en el canon."
  tr: "İbn Sina'ya göre et ve yağ, mizacın iki göstergesidir."
  id: "Daging dan lemak adalah dua indikator temperamen menurut Ibn Sina."
summary:
  ar: "يذكر ابن سينا أن اللحم الأحمر الكثير يدل على الرطوبة والحرارة، واليسير بلا شحم كثير على اليبس والحرارة، وأن السمين والشحم يدلان على البرودة، وأن قلتهما تدل على الحرارة {cite:canon-ibn-sina-print-v1 p.159}."
  en: "Ibn Sina says much red flesh points to moisture and heat, a little with no great fat to dryness and heat, that fat and suet point to cold, and that their scarcity points to heat {cite:canon-ibn-sina-print-v1 p.159}."
  fr: "Selon Ibn Sina, chair rouge abondante indiquerait humide et chaud ; rare sans graisse abondante, sec et chaud ; graisse et suif, froid ; leur rareté, chaleur {cite:canon-ibn-sina-print-v1 p.159}."
  es: "Ibn Sina dice que mucha carne roja apunta a la humedad y al calor, poca con poca grasa a la sequedad y al calor, que la grasa y el sebo apuntan al frío, y que su escasez apunta al calor {cite:canon-ibn-sina-print-v1 p.159}."
  ur: "ابن سینا کا کہنا ہے کہ بہت زیادہ سرخ گوشت نمی اور گرمی کی طرف اشارہ کرتا ہے، تھوڑا سا خشکی اور گرمی کی طرف بہت زیادہ چربی نہیں ہے، وہ چربی اور سوٹ سردی کی طرف اشارہ کرتا ہے، اور یہ کہ ان کی کمی گرمی کی طرف اشارہ کرتی ہے۔"
  tr: "İbn Sina, çok sayıda kırmızı etin nem ve sıcaklığı gösterdiğini, az miktarda yağın ise kuruluk ve sıcaklığı gösterdiğini, yağ ve yağın soğukluğu, kıtlığının ise ısıyı gösterdiğini belirtir {cite:canon-ibn-sina-print-v1 s.159}."
  id: "Ibn Sina menyebutkan bahwa banyak daging merah menunjukkan kelembapan dan panas, sementara sedikit kurang lemak menunjukkan kekeringan dan panas, dan lemak dan lemak menunjukkan dingin, sementara kelangkaannya menunjukkan panas {cite:canon-ibn-sina-print-v1 hlm.159}."
