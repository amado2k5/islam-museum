summary:
  ar: "البحر مسخّر تخرجون منه حلية تلبسونها وترون الفلك مواخر فيه ولتبتغوا من فضله، ومرج البحرين يلتقيان بينهما برزخ لا يبغيان، وماؤه طهور وصيده حلال."
  en: "The sea is made serviceable: from it you bring ornaments you wear and you see the ships ploughing through it that you may seek His bounty; He loosed the two seas meeting with a barrier between them they do not transgress; its water is pure and its game lawful."
  ur: "سمندر مسخر ہے: اس سے تم پہننے کے زیور نکالتے ہو اور جہاز کو اس میں چیرتا دیکھتے ہو کہ تم اس کا فضل تلاش کرو؛ اس نے دو سمندر بہا دیے ملتے ہیں ان کے درمیان حاجز ہے وہ حد نہیں پار کرتے؛ اس کا پانی پاک اور شکار حلال ہے۔"
