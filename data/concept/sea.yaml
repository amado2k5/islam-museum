  id: "Laut"
summary:
  ar: "البحر مسخّر تخرجون منه حلية تلبسونها وترون الفلك مواخر فيه ولتبتغوا من فضله، ومرج البحرين يلتقيان بينهما برزخ لا يبغيان، وماؤه طهور وصيده حلال."
  en: "The sea is made serviceable: from it you bring ornaments you wear and you see the ships ploughing through it that you may seek His bounty; He loosed the two seas meeting with a barrier between them they do not transgress; its water is pure and its game lawful."
  ur: "سمندر مسخر ہے: اس سے تم پہننے کے زیور نکالتے ہو اور جہاز کو اس میں چیرتا دیکھتے ہو کہ تم اس کا فضل تلاش کرو؛ اس نے دو سمندر بہا دیے ملتے ہیں ان کے درمیان حاجز ہے وہ حد نہیں پار کرتے؛ اس کا پانی پاک اور شکار حلال ہے۔"
  es: "El mar es útil: de él traes adornos que usas y ves los barcos surcándolo para que busques su generosidad; Él desató los dos mares que se encuentran con una barrera entre ellos que no transgreden; sus aguas son puras y su caza lícita."
  fr: "La mer est rendue utile: d'elle tu tires les ornements que tu portes et tu vois les navires la fendre afin que tu puisses rechercher Sa grâce; Il a déchaîné les deux mers qui se rencontrent, une barrière entre elles qu'elles ne franchissent pas; son eau est pure et sa pêche licite."
  tr: "Deniz, takmak için süsler çıkardığınız ve sonunda yıldızları gördüğünüz, bolluğunu aradığınız bir yerdir. Denizlerin çayırı, suyu saf ve avlanmaya uygun olan istenmeyen bir Barzakh'la buluşur."
  id: "Laut adalah tempat di mana Anda mengeluarkan perhiasan untuk dikenakan dan melihat bintang-bintang di ujungnya, mencari hasil perhatiannya. Padang rumput laut bertemu dengan Barzakh yang tidak diinginkan, airnya murni dan berburu sah."
