id: concept/anat-marriage-slave
class: concept
kind: legal
label:
  ar: "العَنَت"
  en: "Hardship and fear of sin ('anat) in marrying a slave-woman"
  ur: "عنت (گناہ کا خوف)"
summary:
  ar: "العنت في اللغة المشقة والهلاك والإثم، وفي اصطلاح الفقهاء الزنا والفجور، وبهذا فسروا قوله تعالى في نكاح الأمة لمن خشي العنت {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11882}. واتفق الفقهاء على جواز نكاح الأمة المسلمة لمن لم يجد طولاً لنكاح الحرة وخاف العنت، وهذا قول عامة العلماء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11883}. ومع ذلك فالصبر عن نكاح الأمة أفضل {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11883}. وقال جمهور الفقهاء، الشافعية والحنابلة والمشهور عند المالكية، إن الأصل تحريم نكاح الأمة إلا إذا اجتمعت الشروط، وإن الحنفية أجازوه بشروط أخف {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11883} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11884}. ويرى المالكية جواز نكاح الأمة لمن كانت أمته مملوكة له أو لولده بتفصيل عندهم، وأما نكاح المالك أمته فلا يجوز لتنافي الملكية والمملوكية {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11884}."
  en: "In the lexicon, 'anat is hardship, ruin and sin; among the jurists it means adultery and lewdness, and this is how they read the Qur'anic permission to marry a slave-woman for one who fears 'anat {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11882}. The jurists agree that a believing slave-woman may be married by one who cannot afford a free wife and fears 'anat, and this is the view of most scholars {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11883}. Still, patience in avoiding such a marriage is better {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11883}. The majority (Shafi'is, Hanbalis and the preferred Maliki view) hold that the basic rule is that marrying a slave-woman is forbidden unless the conditions are met, while the Hanafis allow it on lighter conditions {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11883} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11884}. The Malikis allow marrying a slave-woman owned by one's own slave, with distinctions, but a master may not marry his own slave-woman, since ownership and being owned conflict {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11884}."
