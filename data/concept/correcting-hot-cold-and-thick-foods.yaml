label: { ar: "تدارك ضرر الأغذية الحارة والباردة والغليظة", en: "Correcting the harm of hot, cold and thick foods", ur: "گرم، ٹھنڈی اور غلیظ غذاؤں کے نقصان کی اصلاح" }
summary:
  ar: "يذكر ابن سينا أن ضرر الأغذية الحارة يتدارك بالسكنجبين ولا سيما البزوري، والباردة يتبعها ماء العسل وشرابه والكموني، والغليظة يتبعها حار المزاج سكنجبيناً قوي البزور ويتبعها بارد المزاج شيئاً من الفلافلي والفوذنجي {cite:canon-ibn-sina-print-v1 p.233}."
  en: "Ibn Sina says the harm of hot foods is made good with oxymel, above all the seed oxymel; cold foods are followed by honey water and its syrup and kammuni; and after thick food the hot-tempered take a strong seed oxymel while the cold-tempered take a little of falafili and pennyroyal {cite:canon-ibn-sina-print-v1 p.233}."
