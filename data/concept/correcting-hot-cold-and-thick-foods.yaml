id: concept/correcting-hot-cold-and-thick-foods
class: concept
kind: scientific
label: { ar: "تدارك ضرر الأغذية الحارة والباردة والغليظة", en: "Correcting the harm of hot, cold and thick foods", ur: "گرم، ٹھنڈی اور غلیظ غذاؤں کے نقصان کی اصلاح", es: "Cómo corregir los efectos nocivos de los alimentos calientes, fríos y espesos.", fr: "Corriger les méfaits des aliments chauds, froids et épais", tr: "Acılı, soğuk ve kaba yiyeceklerin zararını azaltmak", id: "Mengurangi bahaya makanan pedas, dingin, dan kasar" }
summary:
  ar: "يذكر ابن سينا أن ضرر الأغذية الحارة يتدارك بالسكنجبين ولا سيما البزوري، والباردة يتبعها ماء العسل وشرابه والكموني، والغليظة يتبعها حار المزاج سكنجبيناً قوي البزور ويتبعها بارد المزاج شيئاً من الفلافلي والفوذنجي {cite:canon-ibn-sina-print-v1 p.233}."
  en: "Ibn Sina says the harm of hot foods is made good with oxymel, above all the seed oxymel; cold foods are followed by honey water and its syrup and kammuni; and after thick food the hot-tempered take a strong seed oxymel while the cold-tempered take a little of falafili and pennyroyal {cite:canon-ibn-sina-print-v1 p.233}."
  es: "Ibn Sina dice que el daño de los alimentos calientes se contrarresta con oxímel, sobre todo con oxímel de semillas; a los alimentos fríos les sigue agua con miel y su jarabe y kammuni; y después de la comida espesa, los de temperamento irascible toman un oxímel de semillas fuerte, mientras que los de temperamento frío toman un poco de falafili y poleo {cite:canon-ibn-sina-print-v1 p.233}."
  fr: "Ibn Sina dit que les méfaits des aliments chauds sont compensés par l'oxymel, surtout l'oxymel de graines; les aliments froids sont suivis d'eau miellée et de son sirop et de kammuni; et après les aliments épais, les personnes au tempérament chaud prennent un oxymel de graines fort tandis que les personnes au tempérament froid prennent un peu de falafili et de menthe pouliot {cite:canon-ibn-sina-print-v1 p.233}."
  ur: "ابن سینا کا کہنا ہے کہ گرم کھانوں کے نقصان کو آکسیمل سے بہتر بنایا جاتا ہے، سب سے بڑھ کر بیج آکسیمل سے۔ ٹھنڈے کھانے کے بعد شہد کا پانی اور اس کا شربت اور کمونی۔ اور گاڑھا کھانے کے بعد گرم مزاج والے ایک مضبوط بیج آکسیمل لیتے ہیں جبکہ ٹھنڈے مزاج والے تھوڑا سا فالافیلی اور پینی رائل لیتے ہیں۔"
  tr: "İbn Sina, acılı yiyeceklerin zararının özellikle bzouri olmak üzere sangjibin ile telafi edildiğini belirtir; soğuk yiyeceklerin ardından bal suyu, şurup ve kimyon gelir; iri yiyeceklerin ardından sıcak sinirli sakangbina, yani güçlü tohumlar; soğuk temperli yiyecekler ise falafel ve fudhangi gibi bir miktardır {cite:canon-ibn-sina-print-v1 s.233}."
  id: "Ibn Sina menyebutkan bahwa bahaya makanan pedas dikompensasi oleh sangjibin, terutama bzouri; makanan dingin diikuti oleh madu air, sirup, dan jinten; yang kasar diikuti oleh sakangbina yang temperamen panas, biji kuat; dan yang temperamental dingin agak mirip dengan falafel dan fudhangi {cite:canon-ibn-sina-print-v1 hlm.233}."
