label:
  ar: الغضب
  en: Ghadab (anger)
  es: "Ghadab (ira)"
  fr: "Ghadab (colère)"
  ur: "غضب ⁦(غصہ)⁩"
  tr: "Öfke"
  id: "Kemarahan"
summary:
  ar: "انفعال النفس عند الإساءة أو المخالفة، يستعظم الشرع التحرز منه؛ جاء رجل إلى النبي فقال «أوصني» فقال «لا تغضب» فردد مراراً قال «لا تغضب»، وفي رواية سأله «علمني شيئاً ولا تكثر علي لعلي أعيه» وفي أخرى «دلني على عمل يدخلني الجنة» فكان الجواب واحداً؛ يستنبط ابن رجب أن تكرار الجواب على السؤال المتجدد يدل على أن الغضب جماع الشر وأن التحرز منه جماع الخير، ويعد أبو عمرو بن الصلاح عن أبي محمد بن أبي زيد «لا تغضب» أحد الأحاديث الأربعة التي يتفرع منها جماع آداب الخير، ومن تعريفات حسن الخلق عند الإمام أحمد «أن لا تغضب ولا تحتدد»، وعند إسحاق بن راهويه «بسط الوجه وأن لا تغضب»."
  en: "The soul's agitation at offence or opposition, from which the sharia magnifies the call to guard; a man came to the Prophet saying 'counsel me' and he answered 'do not become angry', the man repeating his request several times and receiving the same answer — one route has 'teach me something and do not make it long that I may retain it', another 'point me to a deed that admits me to Paradise' — the answer one in every case; Ibn Rajab infers that repeating the answer to the renewed request shows anger to be the sum of evil and guarding against it the sum of good; Abu Amr ibn al-Salah reports from Abu Muhammad ibn Abi Zayd that 'do not become angry' is one of the four hadiths from which all the conduct of goodness branches, and among the definitions of good character are Ahmad's 'that you not become angry or fierce' and Ishaq ibn Rahuya's 'a cheerful face and not becoming angry'."
  es: "La agitación del alma ante la ofensa o la oposición, de la cual la sharia magnifica el llamado a la protección; un hombre se acercó al Profeta diciendo 'aconséjame' y él respondió 'no te enojes', el hombre repitió su petición varias veces y recibió la misma respuesta: una ruta fue 'enséñame algo y no lo hagas muy largo para que pueda retenerlo', otra 'insértame una acción que me admita en el Paraíso', la respuesta fue la misma en todos los casos; Ibn Rajab infiere que repetir la respuesta a la petición renovada muestra que la ira es la suma del mal y la protección contra ella la suma del bien; Abu Amr ibn al-Salah informa de Abu Muhammad ibn Abi Zayd que 'no te enojes' es uno de los cuatro hadices de los cuales se ramifica toda la conducta de bondad, y entre las definiciones de buen carácter están la de Ahmad 'que no te enojes ni seas feroz' y la de Ishaq ibn Rahuya 'un rostro alegre y no enojarse'."
  fr: "L'agitation de l'âme face à l'offense ou à l'opposition, dont la charia tire l'appel à la vigilance; un homme vint trouver le Prophète et lui dit: « Conseil-moi », et celui-ci lui répondit: « Ne te mets pas en colère. » L'homme répéta sa demande à plusieurs reprises et reçut la même réponse: tantôt « Enseigne-moi quelque chose, mais ne t'attarde pas trop, afin que je puisse le retenir », tantôt « Indique-moi une action qui me fasse entrer au Paradis » – la réponse étant toujours la même. Ibn Rajab en déduit que répéter la réponse à la demande renouvelée montre que la colère est le comble du mal et s'en prémunir, le comble du bien. Abu Amr ibn al-Salah rapporte d'après Abu Muhammad ibn Abi Zayd que « ne te mets pas en colère » est l'un des quatre hadiths dont découlent toutes les bonnes conduites, et parmi les définitions du bon caractère figurent celles d'Ahmad: « ne te mets pas en colère et ne sois pas féroce » et d'Ishaq ibn Rahuya: « un visage joyeux et ne te mets pas en colère »."
  ur: "جرم یا مخالفت پر روح کی مشتعل، جس سے شریعت حفاظت کی دعوت کو بڑا کرتی ہے۔ ایک آدمی نبی کے پاس آیا کہ 'مجھے نصیحت کرو' اور اس نے جواب دیا 'غصہ نہ کرو'، اس شخص نے کئی بار اپنی درخواست دہرائی اور ایک ہی جواب ملا - ایک راستہ ہے 'مجھے کچھ سکھاؤ اور اسے زیادہ نہ کرو کہ میں اسے برقرار رکھوں'، دوسرا 'مجھے ایک ایسے عمل کی طرف اشارہ کریں جو مجھے جنت میں لے جائے' - جواب ہر معاملے میں ایک ہے۔ ابن رجب نے اس بات کا اندازہ لگایا ہے کہ تجدید کی درخواست کے جواب کو دہرانا غصہ کو برائی کا مجموعہ اور اس سے بچاؤ کو اچھائی کا مجموعہ ظاہر کرتا ہے۔ ابو عمرو بن الصلاح ابو محمد بن ابی زید سے روایت کرتے ہیں کہ 'غصہ نہ کرو' ان چار احادیث میں سے ایک ہے جن سے حسن سلوک کی تمام شاخیں نکلتی ہیں، اور حسن اخلاق کی تعریفوں میں احمد کا 'غصہ نہ کرنا' اور اسحاق بن راہویہ کا 'خوش چہرہ اور غصہ نہ ہونا' ہے۔"
  tr: "Ruhun hakaret veya itaatsizlik sırasında verdiği tepki Şeriat tarafından kesinlikle yasaktır. Bir adam Peygamber'e gelip, 'Bana öğüt ver,' dedi. Ve o dedi ki, 'Kızma,' ve defalarca 'Kızma.' diye cevap verdi. Bir rivayette, 'Bana bir şey öğret ve benim için artırma ki yapabileyim,' diğerinde, diğerinde, 'Beni cennete götürecek bir işe yönlendir' diye sordu ve cevap aynıydı. İbn Receb, tekrar eden soruya verilen tekrarlanan yanıtın öfkenin kötülüğün birleşimi olduğunu ve ondan kaçınmanın iyiliğin toplanması olduğunu gösterdiğini çıkarır. Ebu Amr ibn al-Salah, Ebu Muhammed bin Ebi Zeyd'in 'Kızma' sözünü iyiliğin görgü kurallarının dört hadisinden biri olarak kabul eder. İmam Ahmed'e göre iyi karakterin tanımları arasında 'kızmamak ya da keskin olmak', İshaq bin Rahvey'e göre ise 'yüzünü göstermek ve kızmamak'tır."
  id: "Reaksi jiwa ketika menyinggung atau membangkang sangat dilarang oleh Syariah. Seorang pria datang kepada Nabi dan berkata, 'Nasihatlah saya,' lalu dia berkata, 'Jangan marah,' dan dia berulang kali menjawab, 'Jangan marah.' Dalam salah satu riwayat, dia bertanya, 'Ajari saya sesuatu dan jangan tambahkan untuk saya agar saya bisa melakukannya,' dan dalam cerita lain, 'Tunjukkan saya pada perbuatan yang akan mengizinkan saya ke Surga,' dan jawabannya sama. Ibn Rajab menyimpulkan bahwa jawaban berulang atas pertanyaan yang diulang menunjukkan bahwa amarah adalah gabungan kejahatan dan menghindarinya adalah pengumpulan kebaikan. Abu Amr ibn al-Salah menganggap 'Jangan marah' dari Abu Muhammad ibn Abi Zayd sebagai salah satu dari empat hadits yang menjadi dasar etika kebaikan. Di antara definisi watak baik menurut Imam Ahmad adalah 'tidak marah atau tajam,' dan menurut Ishaq ibn Rahwayh 'memamerkan wajah dan tidak marah.'"
