label:
  ar: الغضب
  en: Ghadab (anger)
summary:
  ar: "انفعال النفس عند الإساءة أو المخالفة، يستعظم الشرع التحرز منه؛ جاء رجل إلى النبي فقال «أوصني» فقال «لا تغضب» فردد مراراً قال «لا تغضب»، وفي رواية سأله «علمني شيئاً ولا تكثر علي لعلي أعيه» وفي أخرى «دلني على عمل يدخلني الجنة» فكان الجواب واحداً؛ يستنبط ابن رجب أن تكرار الجواب على السؤال المتجدد يدل على أن الغضب جماع الشر وأن التحرز منه جماع الخير، ويعد أبو عمرو بن الصلاح عن أبي محمد بن أبي زيد «لا تغضب» أحد الأحاديث الأربعة التي يتفرع منها جماع آداب الخير، ومن تعريفات حسن الخلق عند الإمام أحمد «أن لا تغضب ولا تحتدد»، وعند إسحاق بن راهويه «بسط الوجه وأن لا تغضب»."
  en: "The soul's agitation at offence or opposition, from which the sharia magnifies the call to guard; a man came to the Prophet saying 'counsel me' and he answered 'do not become angry', the man repeating his request several times and receiving the same answer — one route has 'teach me something and do not make it long that I may retain it', another 'point me to a deed that admits me to Paradise' — the answer one in every case; Ibn Rajab infers that repeating the answer to the renewed request shows anger to be the sum of evil and guarding against it the sum of good; Abu Amr ibn al-Salah reports from Abu Muhammad ibn Abi Zayd that 'do not become angry' is one of the four hadiths from which all the conduct of goodness branches, and among the definitions of good character are Ahmad's 'that you not become angry or fierce' and Ishaq ibn Rahuya's 'a cheerful face and not becoming angry'."
