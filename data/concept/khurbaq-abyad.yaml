summary:
  ar: "خربق أبيض في الكتاب نبات ينقل الكتاب وصفه عن ديسقوريدوس، ورقه شبيه بلسان الحمل أو السلق البري إلا أنه أقصر، ثخين أسود يضرب إلى الحمرة، وعروقه كثيرة دقاق من رأس واحد مستطيل، وينبت في أماكن جبلية؛ حار يابس في أوساط الثالثة، الأبيض أشد مرارة والأسود أشد حرارة، ويهيج العطاس إذا شم سحيقه، ويحد البصر، ويقيئ بقوة وفيه خطر الاختناق، ويقتل الإفراط منه الناس وهو سم للكلاب والخنازير، وطرق استعماله وتدبير شاربه متروكة {cite:canon-ibn-sina-print-v1 pp.705-707}"
  en: "Khurbaq abyad is in the book a plant whose description is taken from Dioscorides, its leaf like plantain-tongue or wild chard but shorter, thick, black tending to red, with many thin roots from one elongated head, growing in mountain places; hot and dry in the middle of the third degree, the white more bitter and the black hotter, it provokes sneezing when its powder is smelt, sharpens sight, makes one vomit strongly with the risk of choking, and excess of it kills people while it is a poison to dogs and pigs; the ways of using it and of managing the one who takes it are left out {cite:canon-ibn-sina-print-v1 pp.705-707}"
  ur: "خربق ابیض کتاب میں ایک نبات ہے جس کا وصف دیسقوریدوس سے نقل ہے، پتا لسان الحمل یا جنگلی چقندر جیسا مگر اس سے چھوٹا، موٹا، سیاہ جو سرخی کی طرف مائل ہے، اور بہت سی باریک جڑیں ایک لمبے سر سے، اور پہاڑی جگہوں میں اگتا ہے؛ تیسرے درجے کے وسط میں گرم خشک، سفید زیادہ تلخ اور سیاہ زیادہ گرم، اس کا سفوف سونگھنے سے چھینک آتی ہے، نظر کو تیز کرتا ہے، زور سے قے کراتا ہے اور اس میں گھٹنے کا خطرہ ہے، اور اس کی زیادتی لوگوں کو مار دیتی ہے اور یہ کتوں اور سوروں کے لیے زہر ہے؛ اس کے استعمال اور پینے والے کی تدبیر کے طریقے چھوڑ دیے گئے {cite:canon-ibn-sina-print-v1 pp.705-707}۔"
  es: "Khurbaq abyad es, en el libro, una planta cuya descripción se toma de Dioscórides; su hoja es similar a la del plátano o la acelga silvestre, pero más corta, gruesa, negra con tendencia al rojo, con muchas raíces delgadas que salen de una cabeza alargada, que crece en zonas montañosas; es cálida y seca en el tercer grado medio, la blanca es más amarga y la negra más picante, provoca estornudos al oler su polvo, agudiza la vista, provoca vómitos fuertes con riesgo de asfixia, y su exceso mata a las personas, mientras que es venenosa para perros y cerdos; se omiten las formas de usarla y de tratar a quien la toma {cite:canon-ibn-sina-print-v1 pp.705-707}."
  fr: "Le khurbaq abyad est décrit dans le livre comme une plante, d'après Dioscoride: ses feuilles ressemblent à celles du bananier ou de la bette sauvage, mais elles sont plus courtes, épaisses, noires tirant sur le rouge, et possèdent de nombreuses racines fines issues d'une tige allongée. Elle pousse en montagne. De nature chaude et sèche, elle est particulièrement amère pour la partie blanche et plus piquante pour la partie noire. Son odeur, lorsqu'on sent sa poudre, provoque des éternuements, aiguise la vue, provoque de violents vomissements pouvant entraîner l'étouffement, et sa consommation excessive est mortelle pour l'homme. Elle est également toxique pour les chiens et les porcs. Les modes d'utilisation et les précautions à prendre pour celui qui la consomme ne sont pas mentionnés. {cite:canon-ibn-sina-print-v1 pp.705-707}"
