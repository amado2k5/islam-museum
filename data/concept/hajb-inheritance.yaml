id: concept/hajb-inheritance
class: concept
kind: legal
label: { ar: "حجب في الميراث", en: "Blocking of heirs (hajb)", ur: "حجب میراث" }
summary:
  ar: "الحجب في الميراث منع من قام به سبب الإرث من إرثه كله، ويسمى حجب حرمان، أو من أوفر حظيه، ويسمى حجب نقصان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6832} وحجب الحرمان بالوصف كالقتل والرق لا يدخل على الستة من الورثة وهم الأبوان والزوجان والابن والبنت، وبالشخص كحجب الأخ بالأب والابن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6833} وحجب النقصان يكون لخمسة من الورثة: الزوجين، والأم، وبنت الابن، والأخت لأب، والأخوة لأم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6832} ومن قواعده أن الأقرب يحجب الأبعد، وأن الأقوى قرابة يحجب الأضعف، وأن من يدلي إلى الميت بوارث لا يرث معه إلا أولاد الأم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6833} واختلف الفقهاء في حجب الإخوة الأشقاء والإخوة لأب بالجد: فالحنفية يرون أن الجد يحجبهم، وجمهور المالكية والشافعية والحنابلة وصاحبا أبي حنيفة يرون أن الجد يرث معهم ولا يحجبهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6833} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6834} وأجمع الفقهاء على أن الجدة تحجب بالأم، واختلفوا في حجب الجدة من جهة الأب، وفي حجب القربى من الجدات للبعدى من الجهة الأخرى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6834} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6835} وعامة الفقهاء على أن من لا يرث لمانع كالقتل أو الرق لا يحجب غيره، وخالف عبد الله بن مسعود فقال إن المحروم يحجب غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6835}"
  en: "Hajb (blocking) in inheritance is the barring of an heir from the whole share, called hajb hirman, or from a larger share to a smaller one, called hajb nuqsan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6832} Exclusion by a quality, such as killing or slavery, does not reach the six heirs who cannot be excluded: the two parents, the spouses, the son and the daughter; exclusion by a person, such as a brother blocked by the father or the son, is the other kind. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6833} Reduction (nuqsan) affects five heirs: the two spouses, the mother, the son's daughter, the sister by the father, and the maternal siblings. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6832} Among the general rules, the nearer heir blocks the more remote, the stronger tie blocks the weaker, and whoever is linked to the deceased through an heir inherits only with the mother's children. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6833} The jurists differ on whether the grandfather blocks full and paternal brothers: the Hanafis hold that he does, while the majority and the two companions of Abu Hanifa hold that he inherits with them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6833} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6834} The grandmother is blocked by the mother, and the jurists differ on the paternal grandmother and on whether a nearer grandmother on one side blocks a remoter one on the other. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6834} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6835} Most jurists hold that an heir excluded for a bar such as killing or slavery does not block others, but Ibn Mas'ud held that a deprived heir still blocks. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6835}"
