id: concept/hajb-inheritance
class: concept
kind: legal
label: { ar: "حجب في الميراث", en: "Blocking of heirs (hajb)", ur: "حجب میراث", es: "Bloqueo de herederos (hajb)", fr: "Blocage des héritiers (hajb)", tr: "Miras Kesintisi", id: "Penahanan warisan" }
summary:
  ar: "الحجب في الميراث منع من قام به سبب الإرث من إرثه كله، ويسمى حجب حرمان، أو من أوفر حظيه، ويسمى حجب نقصان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6832} وحجب الحرمان بالوصف كالقتل والرق لا يدخل على الستة من الورثة وهم الأبوان والزوجان والابن والبنت، وبالشخص كحجب الأخ بالأب والابن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6833} وحجب النقصان يكون لخمسة من الورثة: الزوجين، والأم، وبنت الابن، والأخت لأب، والأخوة لأم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6832} ومن قواعده أن الأقرب يحجب الأبعد، وأن الأقوى قرابة يحجب الأضعف، وأن من يدلي إلى الميت بوارث لا يرث معه إلا أولاد الأم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6833} واختلف الفقهاء في حجب الإخوة الأشقاء والإخوة لأب بالجد: فالحنفية يرون أن الجد يحجبهم، وجمهور المالكية والشافعية والحنابلة وصاحبا أبي حنيفة يرون أن الجد يرث معهم ولا يحجبهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6833} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6834} وأجمع الفقهاء على أن الجدة تحجب بالأم، واختلفوا في حجب الجدة من جهة الأب، وفي حجب القربى من الجدات للبعدى من الجهة الأخرى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6834} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6835} وعامة الفقهاء على أن من لا يرث لمانع كالقتل أو الرق لا يحجب غيره، وخالف عبد الله بن مسعود فقال إن المحروم يحجب غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6835}"
  en: "Hajb (blocking) in inheritance is the barring of an heir from the whole share, called hajb hirman, or from a larger share to a smaller one, called hajb nuqsan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6832} Exclusion by a quality, such as killing or slavery, does not reach the six heirs who cannot be excluded: the two parents, the spouses, the son and the daughter; exclusion by a person, such as a brother blocked by the father or the son, is the other kind. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6833} Reduction (nuqsan) affects five heirs: the two spouses, the mother, the son's daughter, the sister by the father, and the maternal siblings. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6832} Among the general rules, the nearer heir blocks the more remote, the stronger tie blocks the weaker, and whoever is linked to the deceased through an heir inherits only with the mother's children. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6833} The jurists differ on whether the grandfather blocks full and paternal brothers: the Hanafis hold that he does, while the majority and the two companions of Abu Hanifa hold that he inherits with them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6833} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6834} The grandmother is blocked by the mother, and the jurists differ on the paternal grandmother and on whether a nearer grandmother on one side blocks a remoter one on the other. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6834} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6835} Most jurists hold that an heir excluded for a bar such as killing or slavery does not block others, but Ibn Mas'ud held that a deprived heir still blocks. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6835}"
  es: "Hajb (bloqueo) en la herencia es la exclusión de un heredero de la totalidad de la parte, llamada hajb hirman, o de una parte mayor a una menor, llamada hajb nuqsan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6832} La exclusión por una cualidad, como el asesinato o la esclavitud, no alcanza a los seis herederos que no pueden ser excluidos: los dos padres, los cónyuges, el hijo y la hija; la exclusión por una persona, como un hermano bloqueado por el padre o el hijo, es el otro tipo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6833} La reducción (nuqsan) afecta a cinco herederos: los dos cónyuges, la madre, la hija del hijo, la hermana por parte del padre y los hermanos maternos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6832} Entre las reglas generales, el heredero más cercano bloquea al más lejano, el vínculo más fuerte bloquea al más débil, y quien esté vinculado al difunto a través de un heredero hereda solo con los hijos de la madre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6833} Los juristas difieren en cuanto a si el abuelo bloquea a los hermanos de padre y madre: los hanafíes sostienen que sí, mientras que la mayoría y los dos compañeros de Abu Hanifa sostienen que hereda con ellos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6833} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6834} La abuela está bloqueada por la madre, y los juristas difieren en cuanto a la abuela paterna y en si una abuela más cercana de un lado bloquea a una más lejana del otro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6834} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6835} La mayoría de los juristas sostienen que un heredero excluido por una prohibición como el asesinato o la esclavitud no bloquea a otros, pero Ibn Mas'ud sostuvo que un heredero privado aún bloquea. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6835}"
  fr: "Le hajb (blocage) en matière successorale consiste à exclure un héritier de la totalité de sa part (hajb hirman) ou à réduire sa part (hajb nuqsan). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6832} L'exclusion par un motif, tel que le meurtre ou l'esclavage, n'affecte pas les six héritiers qui ne peuvent être exclus: les deux parents, les époux, le fils et la fille. L'exclusion par une personne, comme un frère exclu par le père ou le fils, est une autre forme d'exclusion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6833} La réduction (nuqsan) affecte cinq héritiers: les deux époux, la mère, la fille du fils, la sœur du père et les frères et sœurs du côté maternel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6832} Parmi les règles générales, l'héritier le plus proche empêche l'héritier plus éloigné, le lien le plus fort empêche l'héritier le plus faible, et celui qui est lié au défunt par un héritier n'hérite qu'avec les enfants de sa mère. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6833} Les juristes divergent quant à savoir si le grand-père empêche l'héritage des frères germains et des frères paternels: les hanafites estiment que oui, tandis que la majorité et les deux compagnons d'Abu Hanifa estiment qu'il hérite avec eux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6833} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6834} La grand-mère est bloquée par la mère, et les juristes divergent quant à la grand-mère paternelle et quant à savoir si une grand-mère plus proche d'un côté bloque une grand-mère plus éloignée de l'autre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6834} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6835} La plupart des juristes estiment qu'un héritier exclu pour un motif tel que le meurtre ou l'esclavage n'empêche pas les autres, mais Ibn Mas'ud soutenait qu'un héritier déshérité constitue néanmoins un obstacle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6835}"
  ur: "وراثت میں حج ⁦(روکنا)⁩ وارث کو پورے حصہ سے روکنا ہے، جسے حج حرمین کہتے ہیں، یا بڑے حصے سے چھوٹے حصے تک، جسے حج نقسان کہتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6832} قتل یا غلامی جیسی خوبی سے اخراج ان چھ وارثوں تک نہیں پہنچتا جنہیں خارج نہیں کیا جاسکتا: دو والدین، میاں بیوی، بیٹا اور بیٹی؛ کسی شخص کی طرف سے اخراج، جیسے کہ ایک بھائی جسے باپ یا بیٹے نے روک دیا ہے، دوسری قسم ہے۔ {حوالہ:فقہ الموسوعۃ کویتیہ نور-v3 ص6833} تخفیف ⁦(نقسان)⁩ پانچ وارثوں کو متاثر کرتی ہے: دو میاں بیوی، ماں، بیٹے کی بیٹی، باپ کی طرف سے بہن، اور ماموں بہن بھائی۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 6832} عام اصولوں میں سے، قریبی وارث زیادہ دور کو روکتا ہے، مضبوط بندھن کمزور کو روکتا ہے، اور جو وارث کے ذریعے میت سے تعلق رکھتا ہے وہ صرف ماں کے بچوں کو وراثت میں ملتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 6833} فقہاء کا اس میں اختلاف ہے کہ آیا دادا مکمل اور پھوپھی بھائیوں کو روکتے ہیں: احناف اس پر عمل کرتے ہیں، جب کہ اکثریت اور ابوحنیفہ کے دو اصحاب کا خیال ہے کہ وہ ان کے ساتھ میراث ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص6833} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص6834} دادی ماں کی طرف سے مسدود ہے، اور فقہاء کا اس بات پر اختلاف ہے کہ دادی کی طرف سے دادی کو روکا جائے گا اور آیا ایک طرف دادی کو دوسری طرف۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6834} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6835} اکثر فقہاء کا خیال ہے کہ قتل یا غلامی جیسی بار سے خارج ہونے والا وارث دوسروں کو مسدود نہیں کرتا، لیکن ابن مسعودیر نے اس کو روکا ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص6835}"
  tr: "Mirasta kesinti, mirası veren kişinin tüm mirasından miras almasını engeller; buna mahrum bırakma veya en zenginlerden kesinti denir ve buna kesinti eksikliği denir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6832} Tanım yoluyla yoksunluğun kesinilmesi, örneğin cinayet ve kölelik, altı varis için geçerli değildir: ebeveynler, eşler, oğul ve kız; kişi tarafından, bu, baba ve oğuldan bir kardeşin kesilmesi gibidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6833} Eksikliğin kesilmesi beş varis için geçerlidir: eş, anne, oğlun kızı, babanın kız kardeşi ve annenin kardeşleri. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6832} Kurallarından biri, en yakın olanın daha uzak olanı tutmak, güçlünün zayıfla akraba olması ve merhuma varis veren kişinin sadece annenin çocuklarından miras almasıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6833} Hukukçular, baba tarafından kardeşlerin büyükbaba tarafından saklanması konusunda farklı görüşlere sahiptir: Hanafiler büyükbabanın kardeşleri tutmaması gerektiğini savunurken, Malikiler, Şafiiler, Hanbaliler ve Ebu Hanife'nin sahabelerinin çoğu büyükbabanın onlarla birlikte miras aldığını ve onları dışlamadığını savunur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6833} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6834} Hukukçular, büyükannenin baba tarafında örtü takması konusunda oybirliğiyle hemfikirdi; baba tarafında büyükannenin peçesi ve diğer tarafta akrabaların büyükannelerden örtülmesi konusunda farklı görüşler vardı. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6834} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6835} Hukukçuların çoğunluğu, bir engelden, örneğin öldürme veya kölelikten miras almayanın, başkasını da engellememesi gerektiğini savunur. Abdullah ibn Mas'ud ise buna katılmadı ve mahrum bırakılanların başkalarını geri tuttuğunu söyledi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6835}"
  id: "Penahanan warisan mencegah orang yang menyebabkan warisan mewarisi seluruh warisannya, yang disebut menahan kekurangan, atau menahan dari yang terkaya di antara yang terkaya, dan ini disebut menahan kekurangan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6832} Menahan pencabutan berdasarkan deskripsi, seperti pembunuhan dan perbudakan, tidak berlaku untuk enam ahli waris: orang tua, pasangan, anak laki-laki, dan putri, dan oleh pribadi, ini seperti menahan saudara laki-laki dari ayah dan anak laki-laki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6833} Penolakan kekurangan berlaku untuk lima ahli waris: pasangan, ibu, anak perempuan anak laki-laki, saudara perempuan ayah, dan saudara kandung dari ibu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6832} Salah satu aturannya adalah yang paling dekat adalah menahan yang lebih jauh, yang lebih kuat berhubungan dengan yang lemah, dan siapa pun yang memberikan ahli waris kepada yang telah meninggal hanya mewarisi dari anak-anak ibu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6833} Para ahli hukum berbeda pendapat mengenai penahanan saudara dari pihak ayah oleh kakek: Hanafi berpendapat bahwa kakek harus menahan mereka, sementara mayoritas Maliki, Shafi'i, Hanbali, dan sahabat Abu Hanifa berpendapat bahwa kakek mewarisi bersama mereka dan tidak mengecualikan mereka. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6833} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6834} Para ahli hukum sepakat bahwa nenek harus dibalut oleh ibu, berbeda pada kerudung nenek di pihak ayah, dan kerabat dari nenek di sisi lain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6834} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6835} Mayoritas ahli hukum berpendapat bahwa seseorang yang tidak mewarisi dari rintangan, seperti pembunuhan atau perbudakan, tidak boleh menahan orang lain. Abdullah ibn Mas'ud tidak setuju, mengatakan bahwa yang terpinggirkan menahan orang lain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6835}"
