id: concept/al-khitab-al-islami
class: concept
kind: term
label:
  ar: "الخطاب الإسلامي المعاصر — النضج والانفعال"
  en: "The contemporary Islamic discourse — maturity versus reactivity"
  fr: "Le discours islamique contemporain — maturité ou réactivité"
  es: "El discurso islámico contemporáneo: madurez versus reactividad."
  ur: "عصری اسلامی گفتگو - پختگی بمقابلہ رد عمل"
  tr: "Çağdaş İslami Söylem — Olgunluk ve Duygu"
  id: "Wacana Islam Kontemporer — Kedewasaan dan Emosi"
issue:
  ar: "هل الخطاب الإسلامي المعاصر في أغلبه ناضج أم انفعالي، وأين المشكلة الأكبر — في المضمون أم في الشكل؟"
summary:
  ar: "حلقة «الوسطية» عن الخطاب الإسلامي المعاصر. عرّفه مجمع الفقه الإسلامي كما نقل المقدم: «طريقة التعبير التي تبين حقائق الإسلام وشرائعه في مجالات الحياة» — فالنقاش عن المبلّغين لا النص. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:04:30} وانقسم الجمهور: 51% انفعالي و49% ناضج؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:03:30} و67% يرون المشكلة في المضمون مقابل 33% في الشكل؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:28:00} و51% يرون المراجعة ضرورة داخلية و49% استجابةً لضغط خارجي؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:47:30} و76% أيّدوا خطابين مختلفين للداخل والخارج مقابل 24% لخطاب واحد. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:56:30}"
  en: "The 'Al-Wasatiyya' episode on the contemporary Islamic discourse. The International Islamic Fiqh Academy definition quoted by the host: 'the manner of expression conveying Islam's truths and laws across life's fields' — the debate concerns the conveyers, not the text. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:04:30} The audience split 51% reactive vs 49% mature; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:03:30} 67% saw the bigger problem in content vs 33% in form; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:28:00} 51% saw revision as an internal necessity vs 49% a response to outside pressure; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:47:30} and 76% endorsed two different discourses for inside and outside vs 24% for one. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:56:30}"
  fr: "L’épisode d’« Al-Wasatiyya » consacré au discours islamique contemporain. La définition de l’Académie internationale du fiqh islamique citée par l’animateur : « la manière d’exprimer les vérités et les lois de l’islam dans les domaines de la vie » — le débat concerne ceux qui transmettent, non le texte. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:04:30} Le public s’est partagé : 51 % réactif contre 49 % mûr ; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:03:30} 67 % voyaient le plus grand problème dans le contenu contre 33 % dans la forme ; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:28:00} 51 % voyaient dans la révision une nécessité intérieure contre 49 % une réponse à une pression extérieure ; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:47:30} et 76 % ont approuvé deux discours différents pour l’intérieur et l’extérieur contre 24 % pour un seul. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:56:30}"
  es: "El episodio de 'Al-Wasatiyya' sobre el discurso islámico contemporáneo. La definición de la Academia Internacional de Fiqh Islámico citada por el presentador: 'la manera de expresión que transmite las verdades y leyes del Islam a través de los campos de la vida': el debate se refiere a los transmisores, no al texto. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:04:30} La audiencia se dividió 51% reactivo vs 49% maduro; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:03:30} 67% vio el mayor problema en el contenido vs 33% en la forma; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:28:00} 51% vio la revisión como una necesidad interna vs 49% como una respuesta a la presión externa; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:47:30} y el 76% respaldó dos discursos diferentes para el interior y el exterior frente al 24% que apoyó uno. {cita:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:56:30}"
  ur: "عصری اسلامی گفتگو پر 'الوصطیہ' قسط۔ بین الاقوامی اسلامی فقہ اکیڈمی کی تعریف میزبان کے ذریعہ نقل کی گئی ہے: 'اظہار کا طریقہ زندگی کے تمام شعبوں میں اسلام کی سچائیوں اور قوانین کو پہنچانے کا' - بحث کا تعلق متن سے نہیں بلکہ کنویرز سے ہے۔ {حوالہ:اسابیل-طارق-السویدان الوصیتیہ/ep02 00:04:30} سامعین 51% ری ایکٹو بمقابلہ 49% بالغ؛ {حوالہ:اسابیل-طارق-السویدان الوصیتیہ/ep02 00:03:30} 67% نے مواد میں بڑا مسئلہ دیکھا بمقابلہ 33% فارم میں؛ {حوالہ:اسابیل-طارق-السویدان الوصیتیہ/ep02 00:28:00} 51% نے نظر ثانی کو اندرونی ضرورت کے طور پر دیکھا بمقابلہ 49% بیرونی دباؤ کے ردعمل کے طور پر۔ {حوالہ:اصابیل-طارق-السویدان الوصیتیہ/ep02 00:47:30} اور 76% نے اندر اور باہر کے لیے دو مختلف مکالموں کی توثیق کی بمقابلہ 24% ایک کے لیے۔ {حوالہ:اسابیل-طارق-السویدان الوسیطیہ/ep02 00:56:30}"
  tr: "\"Ilımlılık\" bölümü, çağdaş İslami söylem hakkında. İslami Fiqh Akademisi, sunucunun aktardığı şekilde tanımladı: \"Yaşam alanlarında İslam'ın gerçeklerini ve yasalarını netleştiren ifade yöntemi\" — tartışma metin değil, taşıyıcılar hakkındadır. {cite:assabile-tareq-al-suwaidan al-wasitiya/ep02 00:04:30} İzleyici kitlesi bölünmüştü: %51 duygusal ve %49 olgun; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:03:30} ve %67 sorunu içerikte görürken, %33 biçimde; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:28:00}, %51'i derlemeyi içsel bir gereklilik olarak görüyor, %49'u dış baskıya yanıt olarak görüyor; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:47:30} ve %76'sı içeride ve dışarıda iki farklı konuşmayı desteklerken, bir konuşma için %24 var. {kaynak:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:56:30}"
  id: "Bagian \"moderasi\" membahas wacana Islam kontemporer. Akademi Fiqh Islam mendefinisikannya seperti yang disampaikan oleh pembicara: \"Metode ekspresi yang memperjelas kebenaran dan hukum Islam di ruang hidup\" — diskusinya bukan tentang teks, melainkan tentang pembawa cerita. {cite:assabile-tareq-al-suwaidan al-wasitiya/ep02 00:04:30} Audiensnya terbagi: 51% emosional dan 49% dewasa; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:03:30} dan 67% melihat masalahnya dalam isi, sementara 33% melihatnya dalam bentuknya; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:28:00}, 51% melihat kompilasi sebagai persyaratan internal, 49% melihatnya sebagai respons terhadap tekanan eksternal; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:47:30} dan 76% mendukung dua percakapan berbeda secara dalam dan luar, sementara 24% mendukung satu percakapan. {source:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:56:30}"
