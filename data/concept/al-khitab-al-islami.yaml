    ar: "دافع محمود رشدان عن نضج الخطاب: قوة التجديد فيه أكثر من قوة الجمود، والحركات الإسلامية الكبرى تتبنى الديمقراطية آليةً وتمارسها داخلياً أكثر من أحزاب تحمل اسمها، ومرجعيات كالقرضاوي ومحمد الغزالي وزنُهم أعلى من مردّدي الفضائيات. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:19:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:20:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:21:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:41:30}"
