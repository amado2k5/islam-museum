  summary:
    ar: "حذّر الجورشي من ازدواجية الخطاب في عصر اتصال معولم يفضح التناقض؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:57:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:59:00} وقال سيد فايز إن المضمون يختلف بالمخاطَب — للمسلم ولغير المسلم وللشاب وللكهل؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 01:02:00} وخلص المقدم إلى «إسلام واحد له مستويات»: مخاطبة كلٍّ بما يناسبه كما أرسل الرسول معاذاً بالتوحيد أولاً. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 01:05:00}"
