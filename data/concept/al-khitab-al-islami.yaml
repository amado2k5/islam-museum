id: concept/al-khitab-al-islami
class: concept
kind: term
label:
  ar: "الخطاب الإسلامي المعاصر — النضج والانفعال"
  en: "The contemporary Islamic discourse — maturity versus reactivity"
issue:
  ar: "هل الخطاب الإسلامي المعاصر في أغلبه ناضج أم انفعالي، وأين المشكلة الأكبر — في المضمون أم في الشكل؟"
summary:
  ar: "حلقة «الوسطية» عن الخطاب الإسلامي المعاصر. عرّفه مجمع الفقه الإسلامي كما نقل المقدم: «طريقة التعبير التي تبين حقائق الإسلام وشرائعه في مجالات الحياة» — فالنقاش عن المبلّغين لا النص. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:04:30} وانقسم الجمهور: 51% انفعالي و49% ناضج؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:03:30} و67% يرون المشكلة في المضمون مقابل 33% في الشكل؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:28:00} و51% يرون المراجعة ضرورة داخلية و49% استجابةً لضغط خارجي؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:47:30} و76% أيّدوا خطابين مختلفين للداخل والخارج مقابل 24% لخطاب واحد. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:56:30}"
  en: "The 'Al-Wasatiyya' episode on the contemporary Islamic discourse. The International Islamic Fiqh Academy definition quoted by the host: 'the manner of expression conveying Islam's truths and laws across life's fields' — the debate concerns the conveyers, not the text. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:04:30} The audience split 51% reactive vs 49% mature; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:03:30} 67% saw the bigger problem in content vs 33% in form; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:28:00} 51% saw revision as an internal necessity vs 49% a response to outside pressure; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:47:30} and 76% endorsed two different discourses for inside and outside vs 24% for one. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:56:30}"
perspectives:
- tradition: other
  id: reactive-and-fragmented
  stance:
    ar: "انفعالي في الغالب — بل خطابات متعددة متعارضة"
  summary:
    ar: "رأى بسام العموش أنه ليس خطاباً واحداً بل خطابات — رسمي ودعوي وحزبي — متعارضة ومنفعلة (مثال: الديمقراطية كفر عند بعضهم وآلية عند آخرين). {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:06:30} وقاس محمود سيد ضغيم النضج على مقاصد الشريعة فرأى الانفعالية أغلب. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:08:30} ولخص صلاح الدين الجورشي الخلل في أربعة: مشكلة المنهج (البدء بالنتيجة)، والفجوة بين الخطاب والواقع، والتراثية (خوض في مسائل تجاوزها العصر)، والارتكاز على رد الفعل فلا تراكم معرفي. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:14:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:17:30} ورأى خالد حروب أكثره متطرفاً، وأخطره الخطاب الإقصائي تجاه «الآخر» داخل المجتمع نفسه. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:29:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep02 00:30:00}"
