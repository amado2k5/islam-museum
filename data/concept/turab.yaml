  en: "Turab (earth and dust)"
  ur: "تراب (مٹی اور غبار)"
summary:
  ar: "التراب ظاهر الأرض، وهو اسم جنس، ويفهم من كلام الفقهاء أن الرمل ونحاتة الصخر ليسا منه، وإن أُعطيا حكمه في بعض المذاهب. يصح التيمم بكل تراب طاهر له غبار يعلق باليد، ويزيل الشافعية والحنابلة النجاسة بالتراب مع الماء في ولوغ الكلب، والحنفية والمالكية لا يوجبونه. وأكل التراب يبطل الصوم عمدا. ويختلف الفقهاء في بيع التراب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4912} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4916}"
  en: "Turab is the surface of the earth, a generic noun; the jurists imply that sand and rock dust are not turab, though some schools give them its ruling. Tayammum is valid with any clean earth that has dust clinging to the hand. The Shafi'is and Hanbalis require earth with water to clean the vessel licked by a dog, while the Hanafis and Malikis do not. Eating earth deliberately breaks a fast, and the jurists differ on selling it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4912} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4916}"
