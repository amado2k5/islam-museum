summary:
  ar: "التراب ظاهر الأرض، وهو اسم جنس، ويفهم من كلام الفقهاء أن الرمل ونحاتة الصخر ليسا منه، وإن أُعطيا حكمه في بعض المذاهب. يصح التيمم بكل تراب طاهر له غبار يعلق باليد، ويزيل الشافعية والحنابلة النجاسة بالتراب مع الماء في ولوغ الكلب، والحنفية والمالكية لا يوجبونه. وأكل التراب يبطل الصوم عمدا. ويختلف الفقهاء في بيع التراب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4912} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4916}"
  en: "Turab is the surface of the earth, a generic noun; the jurists imply that sand and rock dust are not turab, though some schools give them its ruling. Tayammum is valid with any clean earth that has dust clinging to the hand. The Shafi'is and Hanbalis require earth with water to clean the vessel licked by a dog, while the Hanafis and Malikis do not. Eating earth deliberately breaks a fast, and the jurists differ on selling it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4912} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4916}"
  es: "Turab es la superficie de la tierra, un sustantivo genérico; los juristas implican que la arena y el polvo de roca no son turab, aunque algunas escuelas los consideran como tal. El tayammum es válido con cualquier tierra limpia que tenga polvo adherido a la mano. Los shafi'íes y los hanbalíes exigen tierra con agua para limpiar el recipiente lamido por un perro, mientras que los hanafíes y los malikíes no. Comer tierra deliberadamente rompe el ayuno, y los juristas difieren sobre su venta. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4912} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4913} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4914} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4915} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4916}"
  fr: "Turab désigne la surface de la terre, un nom générique. Les juristes considèrent généralement que le sable et la poussière de roche ne sont pas considérés comme du turab, bien que certaines écoles leur attribuent cette qualification. Le tayammum est valable avec toute terre propre dont la main est encore recouverte de poussière. Les écoles chaféite et hanbalite exigent de la terre mélangée à de l'eau pour nettoyer un récipient léché par un chien, contrairement aux écoles hanafite et malikite. Manger de la terre délibérément rompt le jeûne, et les juristes divergent quant à sa vente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4912} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4916}"
  ur: "تراب زمین کی سطح ہے، ایک عام اسم؛ فقہاء اس بات پر دلالت کرتے ہیں کہ ریت اور چٹان کی خاک تراب نہیں ہیں، حالانکہ بعض مکاتب اس کا حکم دیتے ہیں۔ تیمم ہر ایسی پاک زمین سے درست ہے جس میں دھول ہاتھ سے چمٹی ہوئی ہو۔ شافعی اور حنبلیوں کے نزدیک کتے کے چاٹنے والے برتن کو صاف کرنے کے لیے پانی کے ساتھ مٹی کی ضرورت ہوتی ہے، جبکہ حنفیہ اور مالکیہ ایسا نہیں کرتے۔ زمین جان بوجھ کر کھانے سے روزہ ٹوٹ جاتا ہے، اور اسے بیچنے میں فقہاء کا اختلاف ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.4912} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4913} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4914} صفحہ 4915} {حوالہ: فقہ معاویہ کویتیہ نور v3 صفحہ 4916}"
  tr: "Toprak, toprağın yüzeyidir ve bir cinstir. Hukukçuların ifadelerinden, kum ve kaya oymacılığının topraktan olmadığı anlaşılır, ancak bazı okullarda bu hükümler verilmiştir. Tayammum, elde sarkan tozlu saf topraklar için geçerlidir ve Şafi'ler ile Hanbaliler, köpek toprak girdiğinde topraktan kirleri ve suyu temizler, Hanafi ve Malikiler ise buna ihtiyaç duymazlar. Toprağı yemek orucu kasıtlı olarak geçersiz kılar. Hukukçular toprak satışı konusunda farklı görüşlere sahiptir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4912} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4916}"
  id: "Tanah adalah permukaan bumi, dan merupakan sebuah genus. Dari pernyataan para ahli hukum, dipahami bahwa ukiran pasir dan batu bukanlah dari tanah tersebut, meskipun keputusannya diberikan dalam beberapa aliran. Tayammum berlaku untuk tanah murni yang berdebu dan menggantung dengan tangan, dan Shafi'i serta Hanbalis menghilangkan kotoran dari tanah bersama air ketika anjing masuk, sementara Hanafi dan Malik tidak mewajibkannya. Memakan tanah secara sengaja membatalkan puasa. Para ahli hukum berbeda pendapat mengenai penjualan tanah. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.4912} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4916}"
