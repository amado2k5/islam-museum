id: concept/canon-spasm-and-tetanus-in-infants
class: concept
kind: scientific
label: { ar: "التشنج والكزاز عند الصبيان عند ابن سينا", en: "Spasm and tetanus in infants in the Canon", ur: "قانون میں بچوں کا تشنج اور کزاز", es: "Espasmos y tétanos en lactantes en el Canon", fr: "Spasmes et tétanos chez les nourrissons dans le Canon", tr: "İbn Sina'ya göre erkek çocuklarda spazm ve tetanoz", id: "Kejang dan tetanus pada anak laki-laki menurut Ibn Sina" }
summary:
  ar: "يذكر ابن سينا التشنج الذي يعرض للصبيان وخصوصاً عند نبات الأسنان، وسببه في الأكثر فساد الهضم مع ضعف العصب، وعلاجه بالأدهان، ثم الكزاز، وما إذا كان من يبس عقيب الحميات والإسهال {cite:canon-ibn-sina-print-v1 pp.212-213}."
  en: "Ibn Sina mentions the spasm that befalls infants, above all at teething, mostly from spoiled digestion with weakness of the nerve and treated with oils, then tetanus, and the case where it comes from dryness after fevers and diarrhoea {cite:canon-ibn-sina-print-v1 pp.212-213}."
  es: "Ibn Sina menciona el espasmo que afecta a los bebés, sobre todo durante la dentición, principalmente debido a una digestión deficiente con debilidad del nervio y tratado con aceites, luego el tétanos, y el caso en que se debe a la sequedad después de fiebres y diarrea {cite:canon-ibn-sina-print-v1 pp.212-213}."
  fr: "Ibn Sina mentionne le spasme qui frappe les nourrissons, surtout lors des poussées dentaires, principalement dû à une mauvaise digestion avec faiblesse du nerf et traité avec des huiles, puis le tétanos, et le cas où il provient de la sécheresse après des fièvres et des diarrhées {cite:canon-ibn-sina-print-v1 pp.212-213}."
  ur: "ابن سینا نے اس اینٹھن کا تذکرہ کیا ہے جو نوزائیدہ بچوں میں سب سے بڑھ کر دانت نکلنے کے وقت ہوتی ہے، زیادہ تر ہضم خراب ہونے سے اعصاب کی کمزوری اور تیل سے علاج کیا جاتا ہے، پھر تشنج، اور اس صورت میں جہاں یہ بخار اور اسہال کے بعد خشکی سے آتا ہے۔"
  tr: "İbn Sina, özellikle diş bitkisinde erkek çocuklarda meydana gelen spazmları, esas olarak zayıflamış sinirlerle zayıflamış sindirim ve yağlarla tedavi edilen, ardından tetanosla tedavi edilen ve ateş ile ishal sonrası susuzluğun olup olmadığı gibi konuları belirtir {cite:canon-ibn-sina-print-v1 s.212-213}."
  id: "Ibn Sina menyebutkan kejang yang terjadi pada anak laki-laki, terutama pada tanaman gigi, terutama disebabkan oleh pencernaan yang buruk dengan saraf yang lemah, diobati dengan minyak, kemudian tetanus, dan apakah dehidrasi terjadi setelah demam dan diare {cite:canon-ibn-sina-print-v1 hlm.212-213}."
