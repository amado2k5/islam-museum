summary:
  ar: "يذكر ابن سينا التشنج الذي يعرض للصبيان وخصوصاً عند نبات الأسنان، وسببه في الأكثر فساد الهضم مع ضعف العصب، وعلاجه بالأدهان، ثم الكزاز، وما إذا كان من يبس عقيب الحميات والإسهال {cite:canon-ibn-sina-print-v1 pp.212-213}."
  en: "Ibn Sina mentions the spasm that befalls infants, above all at teething, mostly from spoiled digestion with weakness of the nerve and treated with oils, then tetanus, and the case where it comes from dryness after fevers and diarrhoea {cite:canon-ibn-sina-print-v1 pp.212-213}."
