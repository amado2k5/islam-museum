summary:
  ar: "الرازيانج في الكتاب بزره يشبه بزر الكرفس، قريب القوة من البري لكنه أضعف، والبري أشد حرارة ويبسا وأولى بالثالثة والبستاني في الثانية، يفتح السدد ويحد البصر، وينفع من الغثيان والتهاب المعدة ومن الحميات المزمنة ومن نهش الهوام، ويذكر الكتاب في الطمث والنفساء نقلا موسوما {cite:canon-ibn-sina-print-v1 p.664}"
  en: "Razyanaj is in the book a plant whose seed resembles celery seed, near the wild kind in power but weaker; the wild is hotter and drier and belongs to the third degree, and the garden kind is in the second; it opens obstructions and sharpens sight, benefits nausea and burning of the stomach, chronic fevers and the bites of vermin, and the book lists a labelled report on menses and the woman after childbirth {cite:canon-ibn-sina-print-v1 p.664}"
  ur: "رازیانج کتاب میں ایک پودا ہے جس کا بیج کرفس کے بیج جیسا ہے، قوت میں جنگلی کے قریب مگر اس سے کمزور؛ جنگلی زیادہ گرم اور خشک ہے اور تیسرے درجے کے زیادہ قریب، اور باغی دوسرے درجے میں ہے؛ رکاوٹیں کھولتا ہے اور بینائی تیز کرتا ہے، متلی اور معدے کی جلن، پرانے بخاروں اور زہریلے جانوروں کے کاٹنے میں نافع ہے، اور کتاب حیض اور زچہ کے بارے میں منقول فہرست درج کرتی ہے {cite:canon-ibn-sina-print-v1 p.664}۔"
  es: "En el libro, Razyanaj es una planta cuya semilla se asemeja a la del apio, de potencia similar a la silvestre pero más débil; la silvestre es más caliente y seca y pertenece al tercer grado, mientras que la cultivada pertenece al segundo; elimina obstrucciones y agudiza la vista, alivia las náuseas y el ardor de estómago, las fiebres crónicas y las picaduras de parásitos, y el libro incluye un informe detallado sobre la menstruación y la mujer después del parto {cite:canon-ibn-sina-print-v1 p.664}."
