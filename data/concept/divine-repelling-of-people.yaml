id: concept/divine-repelling-of-people
class: concept
kind: belief
label: { ar: "دفع الله الناس بعضهم ببعض", en: "God repelling some people by others", ur: "اللہ کا لوگوں کو ایک دوسرے سے دفع کرنا" }
summary:
  ar: "يرى الشعراوي أن الآية التي فيها دفع الناس بعضهم ببعض قضية كونية: لا تفسد الأرض بسيطرة قوة واحدة، والتوازن بين القوى يحفظ العالم، وأن دفع الشر يجري بأيدي الخلق {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1057} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1058} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1059}."
  en: "Sha'rawi holds that the verse on God repelling some people by others states a cosmic law. The earth would be corrupted if one power ruled alone; balance between powers keeps the world in order, and God repels evil through human hands {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1057} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1058} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1059}."
  ur: "شعراوی کے نزدیک اللہ کا لوگوں کو ایک دوسرے سے دفع کرنا، جس سے زمین فساد سے بچتی ہے، ایک کائناتی قانون ہے: اگر ایک ہی طاقت حاوی ہو تو دنیا بگڑ جائے، اور طاقتوں کا توازن دنیا کو قائم رکھتا ہے، اور اللہ برائی کو انسانوں کے ہاتھوں سے دفع کرتا ہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1057} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1058} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1059}۔"
