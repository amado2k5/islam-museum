id: concept/divine-repelling-of-people
class: concept
kind: belief
label: { ar: "دفع الله الناس بعضهم ببعض", en: "God repelling some people by others", ur: "اللہ کا لوگوں کو ایک دوسرے سے دفع کرنا", es: "Dios repeliendo a algunas personas por otras", fr: "Dieu repoussant certains par d'autres", tr: "Tanrı insanları birbirine itti", id: "Tuhan mendorong manusia saling bertentangan" }
summary:
  ar: "يرى الشعراوي أن الآية التي فيها دفع الناس بعضهم ببعض قضية كونية: لا تفسد الأرض بسيطرة قوة واحدة، والتوازن بين القوى يحفظ العالم، وأن دفع الشر يجري بأيدي الخلق {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1057} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1058} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1059}."
  en: "Sha'rawi holds that the verse on God repelling some people by others states a cosmic law. The earth would be corrupted if one power ruled alone; balance between powers keeps the world in order, and God repels evil through human hands {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1057} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1058} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1059}."
  ur: "شعراوی کے نزدیک اللہ کا لوگوں کو ایک دوسرے سے دفع کرنا، جس سے زمین فساد سے بچتی ہے، ایک کائناتی قانون ہے: اگر ایک ہی طاقت حاوی ہو تو دنیا بگڑ جائے، اور طاقتوں کا توازن دنیا کو قائم رکھتا ہے، اور اللہ برائی کو انسانوں کے ہاتھوں سے دفع کرتا ہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1057} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1058} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1059}۔"
  es: "Sha'rawi sostiene que el versículo sobre Dios repeliendo a algunas personas por medio de otras establece una ley cósmica. La tierra se corrompería si un solo poder gobernara; el equilibrio entre poderes mantiene el orden en el mundo, y Dios repele el mal a través de las manos humanas {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1057} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1058} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1059}."
  fr: "Sha'rawi soutient que le verset où Dieu repousse certains hommes par d'autres énonce une loi cosmique. La Terre serait corrompue si une seule puissance régnait en maître; l'équilibre entre les puissances maintient l'ordre du monde, et Dieu repousse le mal par l'intermédiaire des hommes {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1057} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1058} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1059}."
  tr: "El-Şaarawi, insanların birbirini ittiği ayetin evrensel bir mesele olduğuna inanır: Dünya tek bir gücün kontrolüyle yozlaşmaz, güçler arasındaki denge dünyayı korur ve kötülüğün püskürtülmesi yaratılışın elleriyle gerçekleştirilir {cite:tafsir-sharawi-khawatir-scan-cilt 2 s.1057} {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1059}."
  id: "Al-Shaarawi percaya bahwa ayat di mana manusia saling mendorong adalah isu universal: bumi tidak terkorupsi oleh kendali satu kekuatan saja, keseimbangan antara kekuatan menjaga dunia, dan bahwa pengusiran kejahatan dilakukan oleh tangan ciptaan {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1057} {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1059}."
