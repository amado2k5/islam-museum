summary:
  ar: "الربيتاع في الكتاب حجر كالسرطان، بارد رطب في الثانية، ينشف ويجلو، ويحد البصر، وبه يختم الكتاب كلامه في حرف الراء ويذكر أن جملة ما ذكر فيه من الأدوية خمسة وعشرون {cite:canon-ibn-sina-print-v1 p.670}"
  en: "Rabita' is in the book a stone like the crab, cold and moist in the second degree, drying and cleansing, and it sharpens sight; with it the book ends its discourse on the letter ra and states that the sum of the drugs mentioned in it is twenty-five {cite:canon-ibn-sina-print-v1 p.670}"
  ur: "ربیتاع کتاب میں کیکڑے جیسا ایک پتھر ہے، دوسرے درجے میں ٹھنڈا تر، خشک کرنے والا اور جلا دینے والا، اور بینائی تیز کرتا ہے؛ اس کے ساتھ کتاب حرف را کا کلام ختم کرتی ہے اور بتاتی ہے کہ اس میں ذکر کی گئی دواؤں کا مجموعہ پچیس ہے {cite:canon-ibn-sina-print-v1 p.670}۔"
  es: "Rabita' es en el libro una piedra como el cangrejo, fría y húmeda en segundo grado, secante y purificadora, y agudiza la vista; con ella el libro termina su discurso sobre la letra ra y afirma que la suma de las drogas mencionadas en ella es veinticinco {cite:canon-ibn-sina-print-v1 p.670}"
