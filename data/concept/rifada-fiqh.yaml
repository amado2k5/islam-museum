id: concept/rifada-fiqh
class: concept
kind: legal
label:
  ar: "الرفادة"
  en: "Rifada (the provision for pilgrims, which Quraysh collected in the pre-Islamic period): its meaning, its related posts, and its standing in law"
  ur: "رفادہ ⁦(حجاج کی امداد)⁩"
  es: "Rifada (la provisión para peregrinos, que los Quraysh recopilaron en el período preislámico): su significado, sus publicaciones relacionadas y su estatus legal."
  fr: "La rifada (l'aumône pour les pèlerins, collectée par les Qurayshites avant l'islam): sa signification, les postes qui y sont liés et son statut juridique."
summary:
  ar: "الرفادة في اللغة العطاء والصلة، وكانت قريش في الجاهلية تجمع مالا لإطعام الحجاج في الموسم، وكانت الرفادة والسقاية لبني هاشم، والسدانة واللواء لبني عبد الدار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8797} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8798} وهي مما تفتخر به قريش، وأنكر الله على من جعل سقاية الحاج كمن آمن بالله واليوم الآخر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8798} والرفادة مشروعة في الإسلام إقرارا لها لأنها إكرام للحجاج وصدقة على الفقراء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8798}"
  en: "Rifada in the lexicon is a gift or a support; in the pre-Islamic period Quraysh collected money at the pilgrimage season to feed the pilgrims, the rifada and the water-service belonging to the Banu Hashim, and the keeping of the Ka'ba and the banner to the Banu 'Abd al-Dar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8797} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8798} Quraysh took pride in these offices, and God rebuked those who made the watering of pilgrims equal to faith in God and the Last Day. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8798} Islam allowed the rifada as a kindness to pilgrims and as alms to the poor among them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8798}"
  ur: "رفادہ جاہلیت میں قریش کا حاجیوں کو کھلانے کے لیے جمع کیا گیا مال تھا، جسے اسلام نے حاجیوں کے اکرام اور صدقے کے معنی میں باقی رکھا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8797} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8798}"
  es: "Rifada en el léxico es un regalo o un apoyo; en el período preislámico, los Quraysh recolectaban dinero en la temporada de peregrinación para alimentar a los peregrinos, la rifada y el servicio de agua pertenecientes a los Banu Hashim, y el cuidado de la Kaaba y el estandarte a los Banu 'Abd al-Dar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8797} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8798} Los Quraysh se enorgullecían de estos oficios, y Dios reprendió a aquellos que equiparaban el suministro de agua a los peregrinos con la fe en Dios y el Último Día. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8798} El Islam permitió la rifada como una bondad hacia los peregrinos y como limosna para los pobres entre ellos. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8798}"
  fr: "Dans le lexique, le terme « rifada » désigne un don ou un soutien. À l'époque préislamique, les Qurayshites collectaient de l'argent pendant la saison du pèlerinage pour nourrir les pèlerins, assurer le service de la rifada et de l'approvisionnement en eau, tandis que la garde de la Kaaba et de l'étendard incombait aux Banu 'Abd al-Dar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8797} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8798} Les Qurayshites tiraient fierté de ces fonctions, et Dieu réprimanda ceux qui assimilaient l'approvisionnement en eau des pèlerins à la foi en Dieu et au Jour dernier. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8798} L'islam a autorisé la rifada comme une forme de bienveillance envers les pèlerins et comme une aumône aux plus démunis parmi eux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8798}"
