id: concept/rifada-fiqh
class: concept
kind: legal
label:
  ar: "الرفادة"
  en: "Rifada (the provision for pilgrims, which Quraysh collected in the pre-Islamic period): its meaning, its related posts, and its standing in law"
  ur: "رفادہ (حجاج کی امداد)"
summary:
  ar: "الرفادة في اللغة العطاء والصلة، وكانت قريش في الجاهلية تجمع مالا لإطعام الحجاج في الموسم، وكانت الرفادة والسقاية لبني هاشم، والسدانة واللواء لبني عبد الدار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8797} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8798} وهي مما تفتخر به قريش، وأنكر الله على من جعل سقاية الحاج كمن آمن بالله واليوم الآخر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8798} والرفادة مشروعة في الإسلام إقرارا لها لأنها إكرام للحجاج وصدقة على الفقراء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8798}"
  en: "Rifada in the lexicon is a gift or a support; in the pre-Islamic period Quraysh collected money at the pilgrimage season to feed the pilgrims, the rifada and the water-service belonging to the Banu Hashim, and the keeping of the Ka'ba and the banner to the Banu 'Abd al-Dar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8797} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8798} Quraysh took pride in these offices, and God rebuked those who made the watering of pilgrims equal to faith in God and the Last Day. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8798} Islam allowed the rifada as a kindness to pilgrims and as alms to the poor among them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8798}"
  ur: "رفادہ جاہلیت میں قریش کا حاجیوں کو کھلانے کے لیے جمع کیا گیا مال تھا، جسے اسلام نے حاجیوں کے اکرام اور صدقے کے معنی میں باقی رکھا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8797} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8798}"
