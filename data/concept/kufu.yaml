id: concept/kufu
class: concept
kind: legal
label:
  ar: "كُفْء"
  en: "Equal in marriage (kufu)"
  ur: "کفو (ہم پلہ)"
summary:
  ar: "الكفء في اللغة النظير والمساوي، وفي الفقه من يصلح أن يكون زوجاً للمرأة. وتزويج المرأة بالكفء واجب على الأولياء الذين لهم حق الإجبار عند جمهور الفقهاء، ولا يجوز للولي غير المجبر تزويجها بغير كفء دون رضاها، فإن زوجها بغير كفء برضاها جاز، وإذا طلبت المرأة كفئاً فامتنع الولي صار عاضلاً وناب القاضي عنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13281} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13282} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13283}"
  en: "Kufu in the lexicon is the equal, the peer; in marriage it is the man fit to be a woman's husband. Guardians with the power to compel marriage must marry a woman to an equal, and a guardian without compulsion may not marry her to a non-equal without her consent. If she consents, a marriage to a non-equal is allowed. If she asks for a suitable man and the guardian refuses, he is obstructive and the judge takes his place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13281} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13282} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13283}"
  ur: "کفو لغت میں ہم مثل اور برابر کو کہتے ہیں، اور نکاح میں وہ شخص جو عورت کا شوہر بننے کے لائق ہو۔ جمہور کے نزدیک جن اولیاء کو جبری نکاح کا اختیار ہے ان پر لازم ہے کہ عورت کی شادی کفو سے کریں، اور جس ولی کو جبر کا اختیار نہ ہو اس کے لیے بغیر رضا کے غیر کفو سے نکاح جائز نہیں۔ عورت کی رضا سے غیر کفو میں نکاح جائز ہے۔ اگر عورت کسی کفو کا مطالبہ کرے اور ولی انکار کرے تو وہ عاضل ہے اور قاضی اس کی جگہ نکاح کرے گا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13281} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13282} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13283}"
