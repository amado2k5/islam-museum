label:
  ar: اختصاص
  en: Ikhtisas (exclusivities of the Prophet in rulings of conduct)
summary:
  ar: 'الاختصاص الانفراد بالشيء دون الغير، ومن له حق الاختصاص الشارع أو أحد العباد بولاية أو ملك. وفي خصائص النبي: البحث فيها جائز عند الجمهور، وتنقسم إلى أحكام تكليفية لا تتعدى إليه، ومزايا أخروية، وفضائل دنيوية، ومعجزات، وأمور خلقية، ويقتصر البحث على الأحكام التكليفية. وهي واجبة (كقيام الليل والوتر والضحى والسواك والأضحية والمشاورة ومصابرة العدو وتغيير المنكر)، ومحرمة (كأخذ الصدقات، والإهداء للاستكثار، ونظم الشعر، وإمساك من كرهته، ونكاح الكتابية والأمة)، ومباحة (كالصلاة بعد العصر). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1905} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1906} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1908} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1912} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1913}. ومن المباح له: الصلاة على الغائب، وصيام الوصال، والقتال بمكة، ودخولها بغير إحرام، والقضاء بعلمه ولنفسه، وقبول الهدية، والصفي والخمس، وتعدد الزوجات دون مهر أو ولي؛ ومن الفضائل تخصيص من يشاء بما يشاء، وكون النبي أولى بالمؤمنين من أنفسهم، وفي الجمع بين اسمه وكنيته خلاف زال عند المالكية والشافعية بوفاته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1916}.'
  en: 'Ikhtisas (exclusivity): being singled out by something; it may be granted by the Lawgiver or by a person through authority or ownership. The study of the Prophet''s exclusivities is lawful for the majority; they fall into rulings of conduct that do not pass to his community, otherworldly privileges, worldly virtues, miracles and bodily matters, and this entry is limited to the first kind. Some were obligatory for him (night prayer, witr, duha, siwak, sacrifice, consultation, standing against a superior enemy, changing wrong), some forbidden (taking alms, giving for more, poetry, keeping an unwanted wife, marrying a non-Muslim or a slave), and some permitted (prayer after ''Asr). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1905} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1906} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1908} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1912} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1913}. Permitted to him alone: praying over the absent dead, continuous fasting, fighting in Mecca, entering it without ihram, judging by his own knowledge and in his own case, accepting gifts, the safi and the fifth, and marriage to more than four women without a dower or guardian; among the honours: singling out whom he will with what he will, and being closer to the believers than themselves; the combination of his name and kunya is disputed, and the Malikis and Shafi''is hold it lawful after his death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1916}.'
