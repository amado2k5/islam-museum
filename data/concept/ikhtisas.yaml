id: concept/ikhtisas
class: concept
kind: legal
label:
  ar: اختصاص
  en: Ikhtisas (exclusivities of the Prophet in rulings of conduct)
  es: "Ikhtisas (exclusividades del Profeta en las normas de conducta)"
  fr: "Ikhtisas (exclusivités du Prophète dans les règles de conduite)"
  ur: "اختصاص ⁦(حکمِ اخلاق میں رسول اللہ کی تخصیصات)⁩"
  tr: "Uzmanlık"
  id: "Spesialisasi"
summary:
  ar: 'الاختصاص الانفراد بالشيء دون الغير، ومن له حق الاختصاص الشارع أو أحد العباد بولاية أو ملك. وفي خصائص النبي: البحث فيها جائز عند الجمهور، وتنقسم إلى أحكام تكليفية لا تتعدى إليه، ومزايا أخروية، وفضائل دنيوية، ومعجزات، وأمور خلقية، ويقتصر البحث على الأحكام التكليفية. وهي واجبة ⁦(كقيام الليل والوتر والضحى والسواك والأضحية والمشاورة ومصابرة العدو وتغيير المنكر)⁩، ومحرمة ⁦(كأخذ الصدقات، والإهداء للاستكثار، ونظم الشعر، وإمساك من كرهته، ونكاح الكتابية والأمة)⁩، ومباحة ⁦(كالصلاة بعد العصر)⁩. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1905} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1906} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1908} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1912} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1913}. ومن المباح له: الصلاة على الغائب، وصيام الوصال، والقتال بمكة، ودخولها بغير إحرام، والقضاء بعلمه ولنفسه، وقبول الهدية، والصفي والخمس، وتعدد الزوجات دون مهر أو ولي؛ ومن الفضائل تخصيص من يشاء بما يشاء، وكون النبي أولى بالمؤمنين من أنفسهم، وفي الجمع بين اسمه وكنيته خلاف زال عند المالكية والشافعية بوفاته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1916}. وفي الخصائص الأخرى: لا يُتقدم بين يديه، ومن سبّه يُقتل، ومن دعاه يجيب، ولا يورث، وأزواجه أمهات المؤمنين؛ وفي الأزمنة والأماكن: اختصت ليلة القدر ورمضان والعيدان وأيام التشريق والجمعة ويوم عرفة ونصف شعبان وعاشوراء ويوم الشك والأيام البيض وشعبان بأحكام مستحبة أو مكروهة أو محرمة، واختصت الكعبة بوجوب الإحياء بالحج وتوجه الصلاة إليها والصلاة في جوفها خلاف، واختص الحرم بمنع دخول الكفار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1919} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1920} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1921}. وفي حرم مكة: لا يدخله الكفار بعد عامهم، وتصح الصلاة فيه بثواب مضاعف، وتحرم فيه الصيد والقتال وسفك الدماء والشجر، وتقام فيه الحدود على من جنى داخله، وفي المدينة حرم عند الجمهور لا عند الحنفية، ولا يستوطنها الذمي، ويستحب الموت فيها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1923} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1924}. وفي المساجد والماء: خُص مسجد النبي بأفضلية الصلاة ومشروعية شد الرحال، ومسجد قباء بثواب العمرة، وزمزم بآداب الشرب؛ وفي الولاية والملك: يجب أن يحقق الاختصاص مصلحة المولى عليه، فالولاية أمانة، وتصرف المالك لا يُنشئ ضرراً ولا فساداً، فلا يوصي بأكثر من الثلث ولا يخص بعض الأولاد بغير سبب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1924} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1925} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1926}.'
  en: 'Ikhtisas (exclusivity): being singled out by something; it may be granted by the Lawgiver or by a person through authority or ownership. The study of the Prophet''s exclusivities is lawful for the majority; they fall into rulings of conduct that do not pass to his community, otherworldly privileges, worldly virtues, miracles and bodily matters, and this entry is limited to the first kind. Some were obligatory for him (night prayer, witr, duha, siwak, sacrifice, consultation, standing against a superior enemy, changing wrong), some forbidden (taking alms, giving for more, poetry, keeping an unwanted wife, marrying a non-Muslim or a slave), and some permitted (prayer after ''Asr). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1905} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1906} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1908} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1912} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1913}. Permitted to him alone: praying over the absent dead, continuous fasting, fighting in Mecca, entering it without ihram, judging by his own knowledge and in his own case, accepting gifts, the safi and the fifth, and marriage to more than four women without a dower or guardian; among the honours: singling out whom he will with what he will, and being closer to the believers than themselves; the combination of his name and kunya is disputed, and the Malikis and Shafi''is hold it lawful after his death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1916}. Further: none may anticipate him or raise his voice before him, whoever reviles him is killed, whoever he calls must answer, he leaves no inheritance, and his wives are mothers of the believers; among times and places, the Night of Power, Ramadan, the two festivals, the days of tashriq, Friday, the day of Arafat, the middle of Sha''ban, Ashura, the day of doubt, the white days and Sha''ban have recommended, disliked or forbidden rulings; the Ka''ba is singled out for its revival by hajj, its direction in prayer, and disputed prayer inside it; the sanctuary of Mecca is closed to unbelievers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1919} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1920} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1921}. The sanctuary of Mecca: unbelievers may not enter after their year; prayer in it earns multiplied reward; hunting, fighting, bloodshed and cutting its trees are forbidden, and the hudud are applied to offences committed inside it; Medina is a sanctuary according to the majority but not the Hanafis; a dhimmi may not settle there; death in it is recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1923} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1924}. On mosques and water: the Prophet''s mosque is singled out for the superiority of prayer and lawful travel, Quba'' for the reward of umra, and Zamzam for the manners of drinking; on authority and ownership: exclusivity must serve the interest of the one under care, authority is a trust, and an owner''s disposition must cause no harm, so he may not bequeath more than a third nor favour some children without cause. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1924} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1925} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1926}.'
  es: "Ikhtisas (exclusividad): ser distinguido por algo; puede ser otorgado por el Legislador o por una persona mediante autoridad o propiedad. El estudio de las exclusividades del Profeta es lícito para la mayoría; se dividen en normas de conducta que no se transmiten a su comunidad, privilegios sobrenaturales, virtudes mundanas, milagros y asuntos corporales, y esta entrada se limita al primer tipo. Algunas eran obligatorias para él (oración nocturna, witr, duha, siwak, sacrificio, consulta, resistir a un enemigo superior, enmendar un error), algunas prohibidas (tomar limosna, dar por más, poesía, mantener una esposa no deseada, casarse con un no musulmán o un esclavo), y algunas permitidas (oración después de 'Asr). {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1905} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1906} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1907} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1908} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1909} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1910} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1911} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1912} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1913}. Permitido solo a él: orar por los muertos ausentes, el ayuno continuo, luchar en La Meca, entrar en ella sin ihram, juzgar por su propio conocimiento y en su propio caso, aceptar regalos, el safi y el quinto, y casarse con más de cuatro mujeres sin dote ni tutor; entre los honores: escoger a quien quiera con lo que quiera, y estar más cerca de los creyentes que ellos mismos; la combinación de su nombre y kunya es disputada, y los malikíes y shafiíes la consideran lícita después de su muerte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1916}. Además: nadie puede anticiparse a él ni alzar su voz delante de él, quien lo insulte será asesinado, quienquiera que él llame deberá responder, no deja herencia y sus esposas son madres de los creyentes; entre los tiempos y lugares, la Noche del Poder, Ramadán, las dos festividades, los días de tashriq, el viernes, el día de Arafat, la mitad de Sha'ban, Ashura, el día de la duda, los días blancos y Sha'ban tienen dictámenes recomendados, desaconsejados o prohibidos; la Kaaba se distingue por su reanimación mediante el hajj, su dirección en la oración y la oración disputada en su interior; El santuario de La Meca está cerrado a los incrédulos. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1917} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1918} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1919} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1920} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1921}. El santuario de La Meca: los incrédulos no podrán entrar después de su año; la oración en él gana recompensa multiplicada; están prohibidos la caza, la lucha, el derramamiento de sangre y la tala de árboles, y se aplican los hudud a los delitos cometidos en su interior; Medina es un santuario para la mayoría, pero no para los hanafis; Un dhimmi no puede establecerse allí; se recomienda morir allí. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1923} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1924}. Sobre las mezquitas y el agua: la mezquita del Profeta se distingue por la superioridad de la oración y el viaje lícito, Quba' por la recompensa de la umra, y Zamzam por las maneras de beber; sobre la autoridad y la propiedad: la exclusividad debe servir al interés de quien está bajo cuidado, la autoridad es un fideicomiso, y la disposición de un propietario no debe causar daño, por lo que no puede legar más de un tercio ni favorecer a algunos hijos sin causa. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1924} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1925} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1926}."
  fr: "Ikhtisas (exclusivité): privilège accordé par quelque chose de particulier; il peut être conféré par le Législateur ou par une personne en vertu de son autorité ou de sa propriété. L’étude des exclusivités du Prophète est licite pour la majorité; elles relèvent de règles de conduite qui ne s’appliquent pas à sa communauté, de privilèges spirituels, de vertus terrestres, de miracles et de questions corporelles. Le présent article se limite aux premières. Certaines étaient obligatoires pour lui (la prière nocturne, le witr, le duha, le siwak, le sacrifice, la consultation, la résistance face à un ennemi supérieur, la correction d’une injustice), d’autres interdites (accepter l’aumône, donner davantage, la poésie, garder une épouse non désirée, épouser une non-musulmane ou une esclave), et d’autres encore permises (la prière après la prière de l’après-midi). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1905} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1906} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1908} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1911} {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.1912} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1913}. Il lui est permis à lui seul: de prier pour les défunts absents, de jeûner continuellement, de combattre à La Mecque, d’y entrer sans ihram, de juger selon sa propre connaissance et dans son propre cas, d’accepter des dons, le safi et le cinquième, et d’épouser plus de quatre femmes sans dot ni tuteur; parmi les honneurs: de choisir qui il veut avec ce qu’il veut, et d’être plus proche des croyants qu’eux-mêmes; la combinaison de son nom et de sa kunya est controversée, et les Malikites et les Shafi’ites la considèrent comme licite après sa mort. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1916}. De plus: nul ne peut le devancer ni élever la voix avant lui, quiconque l'insulte est mis à mort, quiconque il appelle doit répondre, il ne laisse aucun héritage, et ses épouses sont les mères des croyants; parmi les temps et les lieux, la Nuit du Destin, le Ramadan, les deux fêtes, les jours de tashriq, le vendredi, le jour d'Arafat, le milieu de Sha'ban, Achoura, le jour du doute, les jours blancs et Sha'ban ont des règles recommandées, déconseillées ou interdites; la Ka'ba est particulièrement remarquable pour sa renaissance lors du hajj, son orientation dans la prière et la prière controversée qui s'y déroule; le sanctuaire de La Mecque est fermé aux incroyants. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1919} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1920} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1921}. Le sanctuaire de La Mecque: les incroyants ne peuvent pas y entrer après leur an; la prière y rapporte une récompense multipliée; la chasse, les combats, l'effusion de sang et l'abattage d'arbres sont interdits, et les hudud sont appliqués aux délits commis à l'intérieur; Médine est un sanctuaire selon la majorité mais pas les Hanafis; Un dhimmi ne peut s'y installer; il est recommandé d'y mourir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1923} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1924}. Concernant les mosquées et l'eau: la mosquée du Prophète est privilégiée pour la prière et les voyages licites, Quba' pour la récompense de la umra, et Zamzam pour les bonnes manières de boire; concernant l'autorité et la propriété: l'exclusivité doit servir l'intérêt de celui qui est sous sa tutelle, l'autorité est une responsabilité, et les dispositions du propriétaire ne doivent causer aucun préjudice; il ne peut donc léguer plus d'un tiers de ses biens ni favoriser certains enfants sans raison valable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1924} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1925} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1926}."
  ur: "اختصاص ⁦(خصوصیت)⁩: کسی چیز سے الگ ہونا۔ یہ قانون دینے والے یا کسی شخص کی طرف سے اختیار یا ملکیت کے ذریعے عطا کیا جا سکتا ہے۔ نبی کی خصوصیت کا مطالعہ جمہور کے لیے جائز ہے۔ وہ اخلاق کے احکام میں آتے ہیں جو اس کی برادری، دوسری دنیاوی مراعات، دنیاوی فضائل، معجزات اور جسمانی معاملات تک نہیں پہنچتے اور یہ داخلہ پہلی قسم تک محدود ہے۔ کچھ اس کے لیے واجب تھے ⁦(رات کی نماز، وتر، دوحہ، مسواک، قربانی، مشورہ، برتر دشمن کے خلاف کھڑا ہونا، غلط بدلنا)⁩، کچھ حرام ⁦(صدقہ لینا، زیادہ دینا، شعر کہنا، ناپسندیدہ بیوی رکھنا، غیر مسلم یا غلام سے شادی کرنا)⁩ اور کچھ جائز ⁦(عصر کے بعد کی نماز)⁩۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1905} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1906} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1907} p.1908} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.1909} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1910} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1912} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1913}۔ اس کے لیے اکیلے کے لیے جائز ہے: غائب میت پر نماز پڑھنا، مسلسل روزہ رکھنا، مکہ میں جنگ کرنا، بغیر احرام کے داخل ہونا، اپنے علم اور اپنے معاملے میں فیصلہ کرنا، تحفہ قبول کرنا، صفی اور پانچواں، اور چار سے زائد عورتوں سے بغیر مہر یا سرپرست کے نکاح؛ اعزازات میں سے: جس کو چاہے اپنے ساتھ الگ کر دے، اور مومنوں کے اپنے سے زیادہ قریب ہونا۔ اس کے نام اور کنیت کے امتزاج میں اختلاف ہے، اور مالکیہ اور شافعی اسے اس کی موت کے بعد حلال قرار دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ1914} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1915} مزید: نہ کوئی اس کا اندازہ لگا سکتا ہے اور نہ ہی اس کے سامنے آواز بلند کرتا ہے، جو اسے گالی دیتا ہے اسے قتل کر دیا جاتا ہے، جسے وہ پکارتا ہے اسے ضرور جواب دینا چاہیے، وہ کوئی میراث نہیں چھوڑتا، اور اس کی بیویاں مومنوں کی مائیں ہیں۔ اوقات اور مقامات میں سے شب قدر، رمضان، دو تہوار، ایام تشریق، جمعہ، یوم عرفات، نصف شعبان، عاشورہ، شبہ کا دن، ایامِ سفید اور شعبان میں مستحب، ناپسندیدہ یا ممنوع احکام ہیں؛ کعبہ کو اس کے احیاء کے لیے حج کے ذریعے، نماز میں اس کی سمت، اور اس کے اندر متنازعہ نماز کے لیے مخصوص کیا گیا ہے۔ مکہ کا حرم کافروں کے لیے بند ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1917} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1918} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1919} صفحہ 1920} {حوالہ: فقہ معاویہ کویتیہ نور v3 صفحہ 1921}۔ مکہ کی حرمت: کافر اپنے سال کے بعد داخل نہیں ہو سکتے۔ اس میں نماز پڑھنے سے کئی گنا ثواب ملتا ہے۔ شکار، لڑائی، خونریزی اور اس کے درختوں کو کاٹنا حرام ہے، اور اس کے اندر ہونے والے جرائم پر حدد کا اطلاق ہوتا ہے۔ مدینہ جمہور کے نزدیک حرم ہے لیکن احناف کے نزدیک نہیں۔ ذمی وہاں بس نہیں سکتا۔ اس میں موت کی سفارش کی جاتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1922} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1923} مساجد اور پانی کے بارے میں: مسجد نبوی کو نماز کی فضیلت اور حلال سفر کے لیے، قبا کو عمرے کے ثواب کے لیے اور زمزم کو پینے کے آداب کے لیے مخصوص کیا گیا ہے۔ اختیار اور ملکیت پر: خصوصیت کو زیر نگہداشت کے مفاد کو پورا کرنا چاہیے، اختیار ایک امانت ہے، اور مالک کے مزاج کو کوئی نقصان نہیں پہنچانا چاہیے، اس لیے وہ ایک تہائی سے زیادہ وصیت نہیں کر سکتا اور نہ ہی بغیر کسی وجہ کے کچھ بچوں کی طرفداری کر سکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ1924} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1925}"
  tr: "Münhasır yetki bir şeye özeldir, başkalarına değil; münhasır yetkiye sahip olan kişi Kanuniyetçi veya vasi ya da mülkiyeti olan herhangi bir hizmetkârdır. Peygamber'in özellikleri hakkında: Bunları araştırmak çoğunluğa göre izinlidir ve ona uygulanmayan zorunlu hükümler, ruhani erdemler, dünyevi erdemler, mucizeler ve ahlaki konulara bölünür. Araştırma sadece zorunlu hükümlerle sınırlıdır. Bunlar zorunludur (gece namazı, vitr, duha, misvak, kurban, danışma, düşmanla mücadele ve kötülüğü değiştirme gibi), yasaktır (örneğin sadaka almak, çoğaltmak için hediye vermek, şiir yazmak, sevilmeyen şeylerden kaçınmak, Kitap Ehli ile Ümmet arasında evlilik) ve izinlidir (örneğin Asr'dan sonra namaz kılmak). {atı:fiqh-mawsua-kuwaitiyya-noor-v3 s.1905} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1906} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1908} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1912} {cit:fiqh-mawsua-kuwaitiyya-noor-v3 s.. 1913}. Onun için izin verilenler arasında: devamsızlar için dua etmek, oruç tutmak, Mekke'de savaşmak, İhrama girmeden girmek, bilgisiyle ve kendisi için hüküm vermek, hediye kabul etmek, ritüeli ve humları yapmak ve çeyiz veya vasi olmadan birden fazla eş sahibi olmak; erdemler arasında istediği gibi kişiyi belirlemek ve Peygamber'in müminlere kendilerinden daha fazla hak sahibi olmasıdır. Adı ile kunya (kunyah) birleştirilmesi konusunda bir anlaşmazlık vardır ve bu, onun ölümüyle birlikte Malikiler ve Şafiiler arasında ortadan kalkmıştır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.1914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1916}. Diğer özelliklerde: önünde olmamalı, ona hakaret eden öldürülür, çağıran karşılık verir ama miras almaz; eşleri ise müminlerin anneleridir; zaman ve yerlerde: Leylat Kadr, Ramazan, çubuklar, Taşreek günleri, Cuma, Arafah Günü, Şaban ortası, Aşura, Şüphe Günü, Beyaz Günler ve Şaban önerilen, sevilmez veya yasak hükümler için belirlenmiştir. Kabe, Hacı canlandırma ve ona dua etme yükümlülüğüne özgönüldür, oysa içindeki namaz farklıdır. Kutsal kutsal yer, özellikle kâfirlerin girişini engellemek içindir. {alıntı:) fiqh-mawsua-kuwaitiyya-noor-v3 s.1917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1919} {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.1920} {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.1921}. Mekke kutsal alanında: gayrimüslimler yıllarından sonra buraya girmemeli, namaz iki kat ödüllü olarak geçerli, avlanma, kavga, kan dökme yasaktır, ağaçlar yasaktır ve içinde günah işleyenlere cezalar uygulanır. Medine'de çoğunluğa (kutsal) kabul edilir, Hanefilere değil, zimmilerde yaşanmaz, orada ölmek tavsiye edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1923} {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.1924}. Camiler ve su ile ilgili olarak: Peygamber Camii namaz erdemi ve yolculuk meşruiyeti için, Quba Camii Ümre'nin ödülü için, Zamzam ise içme görgü kuralları için ayrılmıştır; ve vesayet ve mülkiyet konusunda: münhasır yetki, efendinin üzerindeki yararına hizmet etmelidir, çünkü vasilik bir güven teşkilatıdır ve sahibin davranışı zarar veya yozlaşmaya yol açmaz, bu yüzden üçte birden fazlasını miras bırakmaz ve bazı çocukları sebepsiz yere dışlamaz. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.1924} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1925}."
  id: "Kewenangan eksklusif hanya berlaku untuk sesuatu dan bukan untuk orang lain, dan siapa pun yang berhak atas otoritas eksklusif adalah Pemberi Hukum atau hamba yang memiliki hak asuh atau kepemilikan. Mengenai sifat-sifat Nabi: Penelitian diperbolehkan menurut mayoritas dan dibagi menjadi aturan wajib yang tidak berlaku untuknya, kebajikan spiritual, kebajikan duniawi, mukjizat, dan urusan moral. Penelitian terbatas pada aturan wajib. Peraturan tersebut wajib (seperti shalat malam, Witr, Duha, miswak, pengorbanan, konsultasi, bertahan melawan musuh, dan mengubah kejahatan), dan dilarang (seperti menerima sedekah, memberi hadiah untuk melimpah, menulis puisi, menahan diri dari apa yang tidak disukai, pernikahan antara Umat dan Umat), dan diperbolehkan (seperti shalat setelah Asr). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1905} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1906} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1908} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1912} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm. 1913}. Di antara yang diperbolehkan baginya adalah: berdoa untuk yang tidak hadir, berpuasa puasa persatuan, berperang di Mekah, masuk tanpa memasuki Ihram, membuat penilaian dengan pengetahuan dan untuk dirinya sendiri, menerima hadiah, melaksanakan ritual dan khum, serta memiliki banyak istri tanpa mahar atau wali; di antara kebajikan adalah menunjuk siapa pun yang diinginkan sesuai keinginannya, dan Nabi lebih berhak atas orang beriman daripada diri mereka sendiri. Ada perselisihan tentang penggabungan namanya dan kunya (kunyah) yang telah hilang di antara umat Malik dan Shafi'i setelah kematiannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1916} Dalam karakteristik lain: dia tidak boleh berada di depannya, siapa pun yang menghina akan dibunuh, siapa pun yang memanggilnya akan menjawab tetapi tidak mewarisi, dan istrinya adalah Ibu bagi orang beriman; dan pada waktu dan tempat: Laylat al-Qadr, Ramadan, tongkat, hari Tashreeq, Jumat, Hari Arafah, tengah Sha'ban, Ashura, Hari Keraguan, Hari Putih, dan Sha'ban ditetapkan untuk aturan yang direkomendasikan, tidak disukai, atau dilarang. Ka'bah khusus untuk kewajiban menghidupkan kembali Haji dan mengarahkan shalat kepadanya, sementara shalat di dalamnya berbeda. Tempat suci khusus untuk mencegah masuknya orang kafir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1919} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1920} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1921}. Di tempat suci Mekah: non-Muslim tidak boleh masuk setelah tahun mereka, shalat berlaku di sana dengan ganjaran ganda, berburu, bertarung, pertumpahan darah, dan pohon dilarang, dan hukuman dijatuhkan kepada mereka yang berdosa di dalamnya. Di Madinah, tempat suci adalah untuk mayoritas (sanctuary), bukan bagi Hanafi, dan dhimmi tidak dihuni, dan disarankan untuk meninggal di sana. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1923} {cite::Fiqh-Mawsua-Kuwaitiyya-Noor-V3 hlm.1924}. Mengenai masjid dan air: Masjid Nabi ditetapkan untuk kebajikan shalat dan keabsahan perjalanan, Masjid Quba untuk hadiah Umrah, dan Zamzam untuk etiket minum; dan mengenai hak asuh dan kepemilikan: otoritas eksklusif harus menguntungkan tuan atas dirinya, karena perwalian adalah amanah, dan perilaku pemilik tidak menyebabkan kerugian atau korupsi, sehingga ia tidak mewariskan lebih dari sepertiga atau mengecualikan beberapa anak tanpa alasan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1924} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1925} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1926}."
