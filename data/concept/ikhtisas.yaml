label:
  ar: اختصاص
  en: Ikhtisas (exclusivities of the Prophet in rulings of conduct)
summary:
  ar: 'الاختصاص الانفراد بالشيء دون الغير، ومن له حق الاختصاص الشارع أو أحد العباد بولاية أو ملك. وفي خصائص النبي: البحث فيها جائز عند الجمهور، وتنقسم إلى أحكام تكليفية لا تتعدى إليه، ومزايا أخروية، وفضائل دنيوية، ومعجزات، وأمور خلقية، ويقتصر البحث على الأحكام التكليفية. وهي واجبة (كقيام الليل والوتر والضحى والسواك والأضحية والمشاورة ومصابرة العدو وتغيير المنكر)، ومحرمة (كأخذ الصدقات، والإهداء للاستكثار، ونظم الشعر، وإمساك من كرهته، ونكاح الكتابية والأمة)، ومباحة (كالصلاة بعد العصر). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1905} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1906} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1908} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1912} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1913}.'
  en: 'Ikhtisas (exclusivity): being singled out by something; it may be granted by the Lawgiver or by a person through authority or ownership. The study of the Prophet''s exclusivities is lawful for the majority; they fall into rulings of conduct that do not pass to his community, otherworldly privileges, worldly virtues, miracles and bodily matters, and this entry is limited to the first kind. Some were obligatory for him (night prayer, witr, duha, siwak, sacrifice, consultation, standing against a superior enemy, changing wrong), some forbidden (taking alms, giving for more, poetry, keeping an unwanted wife, marrying a non-Muslim or a slave), and some permitted (prayer after ''Asr). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1905} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1906} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1908} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1912} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1913}.'
