label: { ar: "الخال", en: "Khal (maternal uncle; inheritance and guardianship)", ur: "خال" }
summary:
  ar: "الخال لغة أخو الأم وإن علت، وأخت الأم خالة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7532} والخال من ذوي الأرحام باتفاق الفقهاء في التوريث، وذو الرحم كل قريب ليس بذي فرض ولا عصبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7532} فالحنفية والحنابلة يورثون الخال عند فقد العصبة وذوي الفرض، لقوله تعالى: وأولو الأرحام بعضهم أولى ببعض، وحديث: الخال وارث من لا وارث له؛ والمالكية والشافعية لا يورثونه، ويكون المال لبيت المال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7533} وفي ولاية الخال على الصغيرة في التزويج، يرى جمهور الفقهاء أنه لا ولاية له لأنه ليس عصبة، والحنفية يرون أنه يزوج الصغيرة عند فقد ولي أقرب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7533}  وليس للخال ولاية على مال الصغير باتفاق الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7534}"
  en: "Khal (maternal uncle) lexically is the mother's brother however far up; the mother's sister is the khala. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7532} By consensus the maternal uncle is among the kin who are not sharers or agnates, and inherits as such. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7532} The Hanafis and Hanbalis let the maternal uncle inherit when agnates and sharers are absent, on the Quranic verse on the closer of kin and the saying 'the maternal uncle inherits from one who has no heir'; the Malikis and Shafiis deny him inheritance, and the estate goes to the treasury. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7533} On the maternal uncle's guardianship of a minor girl in marriage, the majority deny it since he is not an agnate, while the Hanafis let him marry her when no nearer guardian exists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7533}  The maternal uncle has no guardianship over a minor's property, on which the jurists agree. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7534}"
  ur: "خال لغت میں ماں کے بھائی کو کہتے ہیں، خواہ اوپر تک ہو؛ ماں کی بہن کو خالہ کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7532} فقہاء کے اتفاق سے خال ذوی الارحام میں سے ہے، اور ذو الرحم وہ قریبی ہے جو نہ صاحب فرض ہو نہ عصبہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7532} حنفیہ اور حنابلہ عصبہ اور صاحبِ فرض کی عدم موجودگی میں خال کو وارث مانتے ہیں، آیت «أولو الأرحام» اور حدیث «الخال وارث من لا وارث له» سے استدلال کرتے ہوئے؛ مالکیہ اور شافعیہ اسے وارث نہیں مانتے اور مال بیت المال کو جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7533} چھوٹی لڑکی کے نکاح میں خال کی ولایت پر جمہور کے نزدیک ولایت نہیں، کیونکہ وہ عصبہ نہیں؛ حنفیہ کے نزدیک قریب تر ولی نہ ہو تو خال نکاح کر سکتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7533}  خال کو چھوٹے بچے کے مال پر ولایت نہیں، اس پر فقہاء کا اتفاق ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7534}"
