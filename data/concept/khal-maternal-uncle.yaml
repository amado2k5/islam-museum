id: concept/khal-maternal-uncle
class: concept
kind: legal
label: { ar: "الخال", en: "Khal (maternal uncle; inheritance and guardianship)", ur: "خال", es: "Khal (tío materno; herencia y tutela)", fr: "Khal (oncle maternel; héritage et tutelle)", tr: "Amca", id: "Paman" }
summary:
  ar: "الخال لغة أخو الأم وإن علت، وأخت الأم خالة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7532} والخال من ذوي الأرحام باتفاق الفقهاء في التوريث، وذو الرحم كل قريب ليس بذي فرض ولا عصبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7532} فالحنفية والحنابلة يورثون الخال عند فقد العصبة وذوي الفرض، لقوله تعالى: وأولو الأرحام بعضهم أولى ببعض، وحديث: الخال وارث من لا وارث له؛ والمالكية والشافعية لا يورثونه، ويكون المال لبيت المال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7533} وفي ولاية الخال على الصغيرة في التزويج، يرى جمهور الفقهاء أنه لا ولاية له لأنه ليس عصبة، والحنفية يرون أنه يزوج الصغيرة عند فقد ولي أقرب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7533}  وليس للخال ولاية على مال الصغير باتفاق الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7534}"
  en: "Khal (maternal uncle) lexically is the mother's brother however far up; the mother's sister is the khala. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7532} By consensus the maternal uncle is among the kin who are not sharers or agnates, and inherits as such. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7532} The Hanafis and Hanbalis let the maternal uncle inherit when agnates and sharers are absent, on the Quranic verse on the closer of kin and the saying 'the maternal uncle inherits from one who has no heir'; the Malikis and Shafiis deny him inheritance, and the estate goes to the treasury. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7533} On the maternal uncle's guardianship of a minor girl in marriage, the majority deny it since he is not an agnate, while the Hanafis let him marry her when no nearer guardian exists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7533}  The maternal uncle has no guardianship over a minor's property, on which the jurists agree. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7534}"
  ur: "خال لغت میں ماں کے بھائی کو کہتے ہیں، خواہ اوپر تک ہو؛ ماں کی بہن کو خالہ کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7532} فقہاء کے اتفاق سے خال ذوی الارحام میں سے ہے، اور ذو الرحم وہ قریبی ہے جو نہ صاحب فرض ہو نہ عصبہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7532} حنفیہ اور حنابلہ عصبہ اور صاحبِ فرض کی عدم موجودگی میں خال کو وارث مانتے ہیں، آیت «أولو الأرحام» اور حدیث «الخال وارث من لا وارث له» سے استدلال کرتے ہوئے؛ مالکیہ اور شافعیہ اسے وارث نہیں مانتے اور مال بیت المال کو جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7533} چھوٹی لڑکی کے نکاح میں خال کی ولایت پر جمہور کے نزدیک ولایت نہیں، کیونکہ وہ عصبہ نہیں؛ حنفیہ کے نزدیک قریب تر ولی نہ ہو تو خال نکاح کر سکتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7533}  خال کو چھوٹے بچے کے مال پر ولایت نہیں، اس پر فقہاء کا اتفاق ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7534}"
  es: "Khal (tío materno) léxicamente es el hermano de la madre, sin importar su grado de parentesco; la hermana de la madre es la khala. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7532} Por consenso, el tío materno está entre los parientes que no son copartícipes ni agnados, y hereda como tal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7532} Los hanafíes y hanbalíes permiten que el tío materno herede cuando no hay agnados ni copartícipes, según el versículo coránico sobre el pariente más cercano y el dicho \"el tío materno hereda de quien no tiene heredero\"; los malikíes y shafiíes le niegan la herencia, y la propiedad pasa al tesoro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7533} Sobre la tutela del tío materno sobre una menor en matrimonio, la mayoría la niega ya que no es agnado, mientras que los hanafíes le permiten casarse con ella cuando no existe un tutor más cercano. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7533} El tío materno no tiene tutela sobre los bienes de una menor, en lo cual coinciden los juristas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7534}"
  fr: "Le terme « khal » (oncle maternel) désigne le frère de la mère, quel que soit son degré de parenté; la sœur de la mère est appelée « khala ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7532} Par consensus, l’oncle maternel fait partie des parents qui ne sont ni agnats ni cohéritiers, et hérite à ce titre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7532} Les écoles hanafite et hanbalite accordent l’héritage à l’oncle maternel en l’absence d’agnats et de cohéritiers, se fondant sur le verset coranique relatif au parent le plus proche et sur le dicton « l’oncle maternel hérite de celui qui n’a pas d’héritier ». Les écoles malikite et chaféite, quant à elles, le déshéritent et le patrimoine revient au trésor public. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7533} Concernant la tutelle de l'oncle maternel sur une fille mineure en vue de son mariage, la majorité la refuse car il n'est pas apparenté à la mère, tandis que les hanafites l'autorisent à l'épouser en l'absence de tuteur plus proche. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7533} L'oncle maternel n'a pas de tutelle sur les biens d'une mineure, point sur lequel les juristes s'accordent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7534}"
  tr: "Anne tarafından amca, hasta olsa bile anne tarafından amcanın kardeşidir ve anne tarafından teyze de anne tarafından amcadır. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.7532} Anne tarafından amca, hukukçuların miras konusundaki uzlaşmasına göre akraba akrabaları arasındadır; akraba ise ne zorunlu ne de ortak olan akrabadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7532} Hanafi ve Hanbalılar, akrabalık ve sabit akrabalarını kaybettiklerinde anne tarafından amcanı miras alır; Allah'ın dediği gibi: 'Akraba olanlar birbirine daha çok hak kazanır' ve hadisler: 'Annenin amcası, varisi olmayanların varisidir.' Malikiler ve Şafi'ler miras almaz, servet kamu hazinesine aittir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7533} Amcanın evlilikteki küçük çocuğa vesayet hakkında, hukukçuların çoğu onun akraba olmadığı için vesayeti olmadığını düşünürken, Hanafiler yakın bir vasisi kaybedilirse küçük bir çocuğu evlendirir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7533} Anne tarafından amca, hukukçuların mutabakatıyla küçük çocuğun malvarlığı üzerinde vasi yoktur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7534}"
  id: "Paman dari pihak ibu adalah saudara dari paman dari pihak ibu, meskipun dia sakit, dan bibi dari pihak ibu adalah paman dari pihak ibu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7532} Paman dari pihak ibu adalah kerabat dari kerabat, menurut konsensus para ahli hukum tentang warisan, dan kerabat adalah kerabat yang bukan wajib maupun asosiasi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7532} Hanafi dan Hanbal mewarisi paman dari pihak ibu setelah kehilangan kekerabatan dan kerabat tetap, seperti yang dikatakan Allah: 'Mereka yang kerabat lebih berhak satu sama lain,' dan hadits: 'Paman dari pihak ibu adalah ahli waris dari mereka yang tidak memiliki ahli waris.' Mali dan Shafi'i tidak mewarisinya, dan kekayaan tersebut menjadi milik kas negara. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7533} Mengenai hak asuh paman atas anak di bawah umur dalam pernikahan, mayoritas ahli hukum percaya bahwa dia tidak memiliki hak asuh karena dia bukan kerabat yang tidak berkerabat, sementara Hanafi berpendapat bahwa dia menikahkan anak di bawah umur jika wali dekat hilang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7533} Paman dari pihak ibu tidak memiliki hak asuh atas harta anak di bawah umur berdasarkan kesepakatan para ahli hukum. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7534}"
