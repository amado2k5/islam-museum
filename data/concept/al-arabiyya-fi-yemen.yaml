label:
  ar: "العربية في اليمن"
  en: "Arabic in Yemen"
  ur: "یمن میں عربی"
  fr: "L'arabe au Yémen"
  es: "El árabe en Yemen"
summary:
  ar: "ما وُجد عن العربية في اليمن: نص الدستور في ترجمة الأمم المتحدة على موقع Constitute، وعبارة الموسوعة أن الناس يتكلمون لهجات مختلفة من العربية، وأسماء اللهجات اليمنية في شجرة Glottolog، مع بيان ما لم يُعثر عليه. وأُضيف نص الحكم الدستوري بلغته الأصلية كما ورد في ملخص بحثي لم يتحقق المتحف منه على الصفحة."
  en: "What was found on Arabic in Yemen: the text of the constitution in the United Nations translation on the Constitute Project, the encyclopedia's statement that the people speak various dialects of Arabic, and the names of the Yemeni varieties in Glottolog's tree, with a statement of what was not found. The constitutional text is added in its original wording, as supplied in a research summary that the museum did not check against the page."
  ur: "یمن میں عربی کے بارے میں جو ملا: Constitute پر اقوام متحدہ کے ترجمے میں دستور کا متن، انسائیکلوپیڈیا کا یہ بیان کہ لوگ عربی کی مختلف بولیاں بولتے ہیں، اور Glottolog کے شجرے میں یمنی اقسام کے نام، اور جو نہیں ملا اس کا بیان۔ آئینی حکم کی عبارت اصل زبان میں شامل کی گئی ہے، جیسی ایک تحقیقی خلاصے میں ملی جسے متحف نے صفحے سے نہیں جانچا۔"
  fr: "Ce qui a été trouvé sur l'arabe au Yémen : le texte de la constitution dans la traduction des Nations unies sur le Constitute Project, l'affirmation de l'encyclopédie que les gens parlent divers dialectes de l'arabe, et les noms des variétés yéménites dans l'arbre de Glottolog, avec l'énoncé de ce qui n'a pas été trouvé. Le texte constitutionnel est ajouté dans sa langue d'origine, tel que fourni par un résumé de recherche que le musée n'a pas vérifié sur la page."
  es: "Lo que se encontró sobre el árabe en Yemen: el texto de la constitución en la traducción de las Naciones Unidas en el Constitute Project, la afirmación de la enciclopedia de que la gente habla diversos dialectos del árabe, y los nombres de las variedades yemeníes en el árbol de Glottolog, con el enunciado de lo que no se halló. Se añade el texto constitucional en su lengua original, tal como lo entrega un resumen de investigación que el museo no verificó en la página."
