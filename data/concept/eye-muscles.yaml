label: { ar: "عضل المقلة والجفن عند ابن سينا", en: "Muscles of the eyeball and eyelid in the Canon", ur: "قانون میں آنکھ اور پلک کے پٹھے", es: "Músculos del globo ocular y del párpado en el Canon", fr: "Muscles du globe oculaire et de la paupière dans le Canon", tr: "İbn Sina'nın Göz Kapağı ve Göz Kapağı Kası", id: "Kelopak Mata dan Otot Kelopak Mata Ibn Sina" }
summary:
  ar: "يجعل ابن سينا عضل المقلة ستاً، ويذكر أن الجفن الأعلى وحده يتحرك، وأن لفتحه عضلة ولإغماضه عضلتين {cite:canon-ibn-sina-print-v1 pp.61-62}."
  en: "Ibn Sina makes the muscles of the eyeball six, and says that only the upper eyelid moves, with one muscle to open it and two to close it {cite:canon-ibn-sina-print-v1 pp.61-62}."
  es: "Ibn Sina afirma que el globo ocular tiene seis músculos y dice que solo el párpado superior se mueve, con un músculo para abrirlo y dos para cerrarlo {cite:canon-ibn-sina-print-v1 pp.61-62}."
  fr: "Ibn Sina fait des muscles du globe oculaire six, et dit que seule la paupière supérieure bouge, avec un muscle pour l'ouvrir et deux pour la fermer {cite:canon-ibn-sina-print-v1 pp.61-62}."
  ur: "ابن سینا آنکھ کی پتلی کے پٹھوں کو چھ بناتا ہے، اور کہتا ہے کہ صرف اوپری پلک حرکت کرتی ہے، ایک پٹھے سے اسے کھولنا ہے اور دو بند کرنے کے لیے۔"
  tr: "İbn Sina, göz küresi kasını altı yapar; sadece üst göz kapağının hareket ettiğini, açıklığının bir kas olduğunu ve kapanışın iki kası olduğunu belirtir {cite:canon-ibn-sina-print-v1 s.61-62}."
  id: "Ibn Sina membuat otot bola mata menjadi enam, menyebutkan bahwa hanya kelopak mata atas yang bergerak, bukaannya memiliki otot, dan penutupnya memiliki dua otot {cite:canon-ibn-sina-print-v1 hlm.61-62}."
