label: { ar: "خلقة العضو وقوة الدواء عند ابن سينا", en: "The build of the organ and the strength of the drug in the Canon", ur: "عضو کی ساخت اور دوا کی قوت قانون میں" }
summary:
  ar: "يبين ابن سينا أن خلقة العضو تحدد قوة الدواء المحتاج إليه: فالعضو سهل المنافذ المتخلخل يكفيه دواء لطيف معتدل، والكثيف الذي لا تجويف له يحتاج إلى دواء قوي، ويرتب الأعضاء من الأحوج إلى القوي إلى الأقل حاجة {cite:canon-ibn-sina-print-v1 pp.268-269}."
  en: "Ibn Sina shows that the build of an organ fixes the strength of the drug it needs: an organ with easy passages and a loose texture is enough served by a mild, moderate drug, while a dense organ with no cavity needs a strong one, and he ranks organs from those needing the strongest drug to those needing least {cite:canon-ibn-sina-print-v1 pp.268-269}."
