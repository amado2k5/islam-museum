id: concept/canon-organ-build-and-drug-strength
class: concept
kind: scientific
label:
  ar: "خلقة العضو وقوة الدواء عند ابن سينا"
  en: "The build of the organ and the strength of the drug in the Canon"
  fr: "Structure de l’organe et force du remède dans le Canon"
  ur: "عضو کی ساخت اور دوا کی قوت قانون میں"
  es: "La estructura del órgano y la potencia del fármaco en el Canon"
  tr: "İbn Sina'ya göre organın yaratılışı ve tıbbın gücü"
  id: "Penciptaan Organ dan Kekuatan Kedokteran menurut Ibn Sina"
summary:
  ar: "يبين ابن سينا أن خلقة العضو تحدد قوة الدواء المحتاج إليه: فالعضو سهل المنافذ المتخلخل يكفيه دواء لطيف معتدل، والكثيف الذي لا تجويف له يحتاج إلى دواء قوي، ويرتب الأعضاء من الأحوج إلى القوي إلى الأقل حاجة {cite:canon-ibn-sina-print-v1 pp.268-269}."
  en: "Ibn Sina shows that the build of an organ fixes the strength of the drug it needs: an organ with easy passages and a loose texture is enough served by a mild, moderate drug, while a dense organ with no cavity needs a strong one, and he ranks organs from those needing the strongest drug to those needing least {cite:canon-ibn-sina-print-v1 pp.268-269}."
  fr: "Ibn Sina adapte la force à la structure : passages aisés et tissu lâche appelleraient douceur modérée, densité et absence de cavité force ; il classe les organes selon ce besoin {cite:canon-ibn-sina-print-v1 pp.268-269}."
  es: "Ibn Sina muestra que la constitución de un órgano determina la potencia del fármaco que necesita: un órgano con conductos fáciles y textura suelta se beneficia de un fármaco suave y moderado, mientras que un órgano denso sin cavidad necesita uno fuerte, y clasifica los órganos desde los que necesitan el fármaco más potente hasta los que necesitan el menos {cite:canon-ibn-sina-print-v1 pp.268-269}."
  ur: "ابن سینا سے پتہ چلتا ہے کہ عضو کی تعمیر اس کی ضرورت کی دوائی کی طاقت کو ٹھیک کرتی ہے: آسان حصّہ اور ڈھیلی ساخت والا عضو ہلکی، اعتدال پسند دوا سے کام کرتا ہے، جب کہ ایک گھنے عضو جس میں گہا نہیں ہوتا ہے، کو مضبوط کی ضرورت ہوتی ہے، اور وہ اعضاء کو مضبوط ترین دوا کی ضرورت والے افراد سے کم از کم ضرورت مندوں میں درجہ بندی کرتا ہے۔ صفحہ 268-269}۔"
  tr: "İbn Sina, organın bileşiminin gereken ilacın gücünü belirlediğini açıklar: organın gözenekleri kolay ve gözeneklidir ve hafif, ılımlı bir ilaçla yeterince tedavi edilir; çürüğü olmayan yoğun bir organ güçlü bir ilaç gerektirir; organlar en muhtaçtan en az ihtiyaç duyulanlara kadar düzenlenir {cite:canon-ibn-sina-print-v1 s.268-269}."
  id: "Ibn Sina menjelaskan bahwa komposisi organ menentukan kekuatan obat yang dibutuhkan: organ memiliki pori-pori yang mudah berpori dan cukup diobati dengan obat ringan dan sedang; organ yang padat tanpa rongga membutuhkan obat yang kuat; organ diatur dari yang paling membutuhkan hingga yang paling tidak dibutuhkan {cite:canon-ibn-sina-print-v1 hlm.268-269}."
