summary:
  ar: "المغرة أجودها النقي الذي يربو في الماء، باردة في الأولى يابسة في الثانية، فيها تغرية وقبض، تنفع أوجاع الكبد، وأقوى من المختوم في حبس البطن، وتقتل الدود {cite:canon-ibn-sina-print-v1 p.568}."
  en: "Maghra: the best is the pure kind that swells in water, cold in the first degree and dry in the second, with a gluing and astringent force, helping liver pains, stronger than the sealed earth in restraining the belly, and killing worms {cite:canon-ibn-sina-print-v1 p.568}."
  ur: "مغرہ: بہترین وہ خالص ہے جو پانی میں پھول جائے، پہلے درجے میں ٹھنڈی اور دوسرے میں خشک، جس میں چپکانے اور قبض کی قوت ہے؛ جگر کے دردوں میں مفید، پیٹ روکنے میں مختوم سے زیادہ قوی، اور کیڑوں کو مارتی ہے {cite:canon-ibn-sina-print-v1 p.568}۔"
  es: "Maghra: la mejor es la pura que se hincha en agua, fría en primer grado y seca en segundo, con una fuerza adhesiva y astringente, que ayuda con los dolores de hígado, más fuerte que la tierra sellada para contener el vientre y matar gusanos {cite:canon-ibn-sina-print-v1 p.568}."
  fr: "Maghra: la meilleure est la variété pure qui gonfle dans l'eau, froide au premier degré et sèche au second, avec une force adhésive et astringente, aidant les douleurs du foie, plus forte que la terre scellée pour contenir le ventre et tuer les vers {cite:canon-ibn-sina-print-v1 p.568}."
  tr: "Muğra, suda yetişen, ilkinde soğuk, ikincisinde kuru olan en saf muğradır; baştan çıkarma ve kasılma içerir, karaciğer ağrıları için faydalıdır, karın hapsedildiğinden daha güçlüdür ve solucanları öldürür {cite:canon-ibn-sina-print-v1 s.568}."
  id: "Mughrah adalah yang murni terbaik, tumbuh dalam air, dingin pada yang pertama dan kering pada yang kedua, mengandung godaan dan kontraksi, bermanfaat untuk nyeri hati, lebih kuat daripada tertutup saat menahan perut, dan membunuh cacing {cite:canon-ibn-sina-print-v1 hlm.568}."
