  id: maqalat-ashari
  stance:
    ar: معرفة حق السلف والأخذ بفضائلهم والإمساك عما شجر بينهم
    en: Knowing the due of the early generations, taking their merits and refraining from what arose between them
  summary:
    ar: يذكر الأشعري أنهم يعرفون حق السلف الذين اختارهم الله لصحبة نبيه ويأخذون بفضائلهم ويمسكون عما شجر بينهم صغيرهم وكبيرهم.
    en: Al-Ash'ari reports they know the due of the early generations whom God chose for the companionship of His prophet, take their merits and refrain from what arose between them, small and great.
