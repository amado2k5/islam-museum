  id: aqida-wasitiyya
  stance:
    ar: سلامة القلوب والألسنة للصحابة، والإمساك عما شجر بينهم، مع عدم القول بعصمتهم
    en: Safe hearts and tongues toward the Companions, refraining from what arose between them, without claiming their infallibility
  summary:
    ar: يقول ابن تيمية إن من أصول أهل السنة سلامة قلوبهم وألسنتهم لأصحاب رسول الله، وإنهم يمسكون عما شجر بين الصحابة، ويرون أن ما يُروى من مساوئهم منه ما هو كذب ومنه ما زيد فيه ونقص، وأنهم فيه معذورون مجتهدون مصيبون أو مخطئون، ولا يعتقدون عصمة كل واحد منهم.
    en: Ibn Taymiyya says among the principles of Ahl al-Sunna is the soundness of their hearts and tongues towards the Companions of the Messenger of God; they refrain from what arose between the Companions, holding that some of what is reported of their faults is false and some has been added to or cut down, that they are excused in it as scholars who were right or wrong, and they do not hold each of them infallible.
