  stance:
    ar: محبتهم وعدم التبرؤ من أحد منهم وألا يُذكروا إلا بخير
    en: Loving them, disowning none, and mentioning them only well
  summary:
    ar: يقول الطحاوي إنه يحب أصحاب رسول الله ولا يتبرأ من أحد منهم ولا يذكرهم إلا بخير، وإن من أحسن القول فيهم وفي أزواج النبي وذريته فقد برئ من النفاق.
