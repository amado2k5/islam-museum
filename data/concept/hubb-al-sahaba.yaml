  id: lumat-al-itiqad
  stance:
    ar: محبتهم وذكر محاسنهم والكف عن ذكر مساوئهم وما شجر بينهم
    en: Loving them, mentioning their merits and refraining from their faults and what arose between them
  summary:
    ar: 'يقول ابن قدامة إن من السنة «تولي أصحاب رسول الله ومحبتهم، وذكر محاسنهم، والترحم عليهم، والاستغفار لهم، والكف عن ذكر مساوئهم، وما شجر بينهم»، ويذكر الترضي عن أزواج النبي ويقول في عائشة إن من قذفها بما برأها الله منه فقد كفر، ويقول: «ومعاوية خال المؤمنين، وكاتب وحي الله، أحد خلفاء المسلمين».'
    en: Ibn Qudama says it is of the sunna to take the Companions as friends and love them, mention their merits, ask mercy and forgiveness for them and refrain from mentioning their faults and what arose between them; he adds God's good pleasure on the Prophet's wives, says whoever slanders Aisha with what God declared her free of has disbelieved, and calls Mu'awiya the maternal uncle of the believers, a scribe of God's revelation and one of the caliphs of the Muslims.
