label:
  ar: محبة الصحابة وحكم الكلام فيهم (في العقيدة الطحاوية)
  en: Love of the Companions and how to speak of them (in the Tahawi creed)
summary:
  ar: قول الطحاوي بمحبة أصحاب النبي وعدم التبرؤ من أحد منهم وألا يُذكروا إلا بخير، وأن من أحسن القول فيهم وفي أزواج النبي وذريته فقد برئ من النفاق.
  en: al-Tahawi's statement that the Prophet's Companions are loved, that none is disowned, that they are mentioned only well, and that whoever speaks well of them, of the Prophet's wives and of his descendants has cleared himself of hypocrisy.
