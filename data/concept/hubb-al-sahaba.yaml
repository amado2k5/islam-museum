id: concept/hubb-al-sahaba
education:
  did_you_know:
    ar: "من العقيدة الطحاوية حب أصحاب النبي وعدم التبرؤ من أحد منهم وألا يُذكروا إلا بخير، ومن أحسن القول فيهم وفي أهل بيته برئ من النفاق."
    en: "Al-Tahawi's creed holds love for the Prophet's companions, disowning none of them, speaking of them only with good — and good words about them and his household clear one of hypocrisy."
    ur: "طحاوی عقیدے میں نبی کے صحابہ سے محبت ہے، کسی سے برأت نہیں اور ان کا ذکر صرف خیر سے ہوتا ہے — ان اور اہلِ بیت کے بارے میں اچھی بات کرنے والا نفاق سے پاک ہے۔"
    sources: [source/aqida-tahawiyya, source/lumat-al-itiqad]
class: concept
kind: doctrine
label:
  ar: محبة الصحابة وحكم الكلام فيهم (في العقيدة الطحاوية)
  en: Love of the Companions and how to speak of them (in the Tahawi creed)
summary:
  ar: قول الطحاوي بمحبة أصحاب النبي وعدم التبرؤ من أحد منهم وألا يُذكروا إلا بخير، وأن من أحسن القول فيهم وفي أزواج النبي وذريته فقد برئ من النفاق.
  en: al-Tahawi's statement that the Prophet's Companions are loved, that none is disowned, that they are mentioned only well, and that whoever speaks well of them, of the Prophet's wives and of his descendants has cleared himself of hypocrisy.
