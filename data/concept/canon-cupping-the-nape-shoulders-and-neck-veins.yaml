label:
  ar: "الحجامة على النقرة والكاهل والأخدعين عند ابن سينا"
  en: "Cupping on the nape, the withers and the two neck veins in the Canon"
  fr: "Ventouses sur nuque, haut du dos et veines cervicales dans le Canon"
  ur: "قانون میں گدی، کندھے کے اوپری حصے اور دونوں اخدعین پر حجامہ"
summary:
  ar: "يذكر ابن سينا أن الحجامة على النقرة خليفة الأكحل وعلى الكاهل خليفة الباسليق وعلى الأخدعين خليفة القيفال، ويعدد منافع كل موضع وأضراره {cite:canon-ibn-sina-print-v1 p.300}."
  en: "Ibn Sina says cupping on the nape stands in for the median cutaneous vein, on the withers for the basilic and on the neck veins for the cephalic, and lists the benefits and harms of each place {cite:canon-ibn-sina-print-v1 p.300}."
  fr: "Selon Ibn Sina, les ventouses de nuque remplaceraient la veine médiane cutanée, celles du haut du dos la basilique, celles des veines cervicales la céphalique ; il présente leurs bienfaits et méfaits supposés {cite:canon-ibn-sina-print-v1 p.300}."
