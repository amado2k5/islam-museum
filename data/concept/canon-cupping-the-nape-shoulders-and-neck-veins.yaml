id: concept/canon-cupping-the-nape-shoulders-and-neck-veins
class: concept
kind: scientific
label:
  ar: "الحجامة على النقرة والكاهل والأخدعين عند ابن سينا"
  en: "Cupping on the nape, the withers and the two neck veins in the Canon"
  fr: "Ventouses sur nuque, haut du dos et veines cervicales dans le Canon"
  ur: "قانون میں گدی، کندھے کے اوپری حصے اور دونوں اخدعین پر حجامہ"
  es: "Ahuecamiento en la nuca, la cruz y las dos venas del cuello en el Canon"
  tr: "İbn Sina'ya göre göbek, omuz ve aldatıcılar"
  id: "Cangkem di pusar, bahu, dan penipu menurut Ibn Sina"
summary:
  ar: "يذكر ابن سينا أن الحجامة على النقرة خليفة الأكحل وعلى الكاهل خليفة الباسليق وعلى الأخدعين خليفة القيفال، ويعدد منافع كل موضع وأضراره {cite:canon-ibn-sina-print-v1 p.300}."
  en: "Ibn Sina says cupping on the nape stands in for the median cutaneous vein, on the withers for the basilic and on the neck veins for the cephalic, and lists the benefits and harms of each place {cite:canon-ibn-sina-print-v1 p.300}."
  fr: "Selon Ibn Sina, les ventouses de nuque remplaceraient la veine médiane cutanée, celles du haut du dos la basilique, celles des veines cervicales la céphalique ; il présente leurs bienfaits et méfaits supposés {cite:canon-ibn-sina-print-v1 p.300}."
  es: "Ibn Sina dice que la ventosaterapia en la nuca representa la vena cutánea mediana, en la cruz la basílica y en las venas del cuello la cefálica, y enumera los beneficios y perjuicios de cada lugar {cite:canon-ibn-sina-print-v1 p.300}."
  ur: "ابن سینا کا کہنا ہے کہ نیپ پر سینی لگانا درمیانی جلد کی رگ کے لیے، بیسلک کے لیے مرجھانے والے حصے پر اور سیفالک کے لیے گردن کی رگوں کے لیے کھڑا ہے، اور ہر جگہ کے فائدے اور نقصانات کی فہرست دیتا ہے۔"
  tr: "İbn Sina, naqra üzerindeki kupaların siyah gözün halefi olduğunu, omuzun baslığın halefi ve kalipultun aldatıcıların halefi olduğunu belirtir ve her yerin faydalarını ve zararlarını sıralar {cite:canon-ibn-sina-print-v1 s.300}."
  id: "Ibn Sina menyebutkan bahwa cupping pada naqra adalah penerus mata lebam, bahu adalah penerus basliq, dan kalipult adalah penerus para penipu, serta ia mencantumkan manfaat dan kerugian dari setiap tempat {cite:canon-ibn-sina-print-v1 hlm.300}."
