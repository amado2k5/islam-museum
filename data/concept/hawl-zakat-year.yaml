label: { ar: "الحَوْل", en: "Hawl (the lunar year in zakat)", ur: "حول (زکوٰۃ کا سال)" }
summary:
  ar: "الحول لغة السنة، ويأتي بمعنى القوة والتغير والإقامة، وسميت السنة حولا لدوران الشمس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7419} والحول شرط لوجوب الزكاة في نصاب السائمة والأثمان وعروض التجارة، لحديث: لا زكاة في مال حتى يحول عليه الحول، لأن هذه الأموال مرصدة للنماء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7419} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7420} أما الزرع والثمار والمعدن فلا يشترط فيها الحول، وفي المعدن من جنس الأثمان الزكاة عند كل حول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7420} وابتداء الحول من حين ملك النصاب، وإذا استفاد مالا من جنس ما عنده، فإن كان من نمائه ضم إليه وزكي بحوله، وإن كان من غير نمائه فللحنفية أنه يضم، وللشافعية والحنابلة يستقبل له حول مستقل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7420} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7421} ويشترط الجمهور وجود النصاب طوال الحول، والحنفية يشترطونه في أوله وآخره، وينقطع الحول بهلاك كل النصاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7421} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7422} وإبدال نصاب الزكاة بجنسه لا يقطع الحول عند المالكية والحنابلة، ويقطعه عند الحنفية والشافعية في السائمة، وإبداله بغير جنسه يقطع الحول باتفاق، وإن قصد الفرار من الزكاة لم تسقط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7422} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7423}  ويذكر المدخل أن الحول في الرضاع: فالشافعية والحنابلة والصاحبان يشترطون ألا يبلغ الرضيع حولين، وقال المالكية يضر شهران زيادة، وقال أبو حنيفة حولان ونصف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7424}"
  en: "Hawl lexically is a year, and also has the senses of strength, change and staying; the year was so named from the turning of the sun. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7419} A year is a condition for zakat on grazing livestock, gold and silver and trade goods, on the saying 'no zakat on property until a year passes over it', because such property is kept for increase. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7419} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7420} Crops, fruits and minerals need no year; a mineral of the kind of money is due every year. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7420} The year begins when the nisab is owned; gains of the same kind as the principal join it when they grow from it, while an independent gain has its own year for the Shafiis and Hanbalis; the Hanafis join it, the Malikis for livestock only. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7420} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7421} The majority require the nisab throughout the year, the Hanafis at its beginning and end, and the year ends when the whole nisab perishes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7421} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7422} Exchanging the nisab for the same kind does not break the year for the Malikis and Hanbalis, but does for the Hanafis and Shafiis in livestock; exchanging for another kind breaks it by agreement, and an exchange made to evade zakat does not remove the duty. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7422} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7423}  The article also notes the age limit for suckling as a bar to marriage: the Shafiis, Hanbalis and the two disciples require the child to be under two years, the Malikis allow two months over, and Abu Hanifa allows two years and a half. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7424}"
  ur: "حول لغت میں سال کو کہتے ہیں، اور اس کے معانی قوت، تغیر اور قیام بھی ہیں؛ سال کو اس لیے حول کہا گیا کہ سورج کے گھومنے سے وہ پورا ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7419} سائمہ جانوروں، سونے چاندی اور تجارتی سامان میں زکوٰۃ کے وجوب کے لیے سال شرط ہے، کیونکہ یہ اموال نمو کے لیے رکھے جاتے ہیں، اور حدیث «لا زكاة في مال حتى يحول عليه الحول» اس کی دلیل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7419} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7420} کھیتی، پھل اور معدن کے لیے سال شرط نہیں؛ اور سکّوں کی جنس کی معدن میں ہر سال زکوٰۃ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7420} سال نصاب کی ملکیت سے شروع ہوتا ہے؛ اصل مال کی جنس کا منافع اصل کے ساتھ جڑ جاتا ہے، جبکہ الگ حاصل ہونے والے مال کا شافعیہ اور حنابلہ کے نزدیک الگ سال ہے، حنفیہ اسے ملاتے ہیں اور مالکیہ صرف مویشی میں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7420} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7421} جمہور کے نزدیک سال بھر نصاب کا موجود ہونا شرط ہے، حنفیہ اول و آخر میں شرط رکھتے ہیں، اور پورا نصاب ہلاک ہونے سے سال ٹوٹ جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7421} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7422} اپنی جنس میں نصاب کے بدلنے سے مالکیہ اور حنابلہ کے نزدیک سال نہیں ٹوٹتا، جبکہ حنفیہ اور شافعیہ کے نزدیک سائمہ میں ٹوٹتا ہے؛ دوسری جنس سے بدلنے پر سال باتفاق ٹوٹ جاتا ہے، اور زکوٰۃ سے بچنے کی نیت سے بدلنے پر زکوٰۃ ساقط نہیں ہوتی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7422} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7423}  مدخل میں رضاع کی حد کا بھی ذکر ہے: شافعیہ، حنابلہ اور صاحبین کے نزدیک دودھ پینے والا دو سال سے کم کا ہو، مالکیہ دو ماہ زیادہ کی گنجائش دیتے ہیں، اور امام ابو حنیفہ کے نزدیک دو سال اور نصف۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7424}"
