summary:
  ar: "قال محمد بن إبراهيم التيمي تستحب العقيقة ولو بعصفور: أصغر الطير يقف في مقام الذبيحة عند فقهاء المدينة، باب لطف الشريعة بالضعيف."
  en: "'The aqiqa is liked even with a sparrow' — Muhammad ibn Ibrahim al-Taymi: the smallest of birds can stand in the sacrifice's place with Medina's jurists, a door to the law's gentleness toward the weak."
  ur: "'عقیقہ چڑیا سے بھی جائز ہے' — محمد بن ابراہیم تیمی: مدینہ کے فقہاء کے نزدیک سب سے چھوٹا پرندہ بھی قربانی کی جگہ کھڑا ہو سکتا ہے۔"
  es: "«La aqiqa es apreciada incluso por un gorrión» — Muhammad ibn Ibrahim al-Taymi: el más pequeño de los pájaros puede ocupar el lugar del sacrificio junto a los juristas de Medina, una puerta a la gentileza de la ley hacia los débiles."
  fr: "« L’aqiqa est appréciée même par un moineau » — Muhammad ibn Ibrahim al-Taymi: le plus petit des oiseaux peut se tenir à la place du sacrifice auprès des juristes de Médine, une porte vers la douceur de la loi envers les faibles."
  tr: "Muhammed bin İbrahim el-Teymi şöyle demiştir: Akikah kuşla bile tavsiye edilir: Medine hukukçularının zayıflara karşı Şeriat'ın hoşgörüsüne dair bölümüne göre en küçük kuş kurban yerinde durur."
  id: "Muhammad ibn Ibrahim al-Taymi berkata: Aqiqah dianjurkan bahkan dengan burung: burung terkecil berdiri di tempat korban menurut para ahli hukum Madinah, bab tentang kelonggaran Syariah terhadap yang lemah."
