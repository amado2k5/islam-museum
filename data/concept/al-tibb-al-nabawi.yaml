label:
  ar: "الطب النبوي"
  en: "Prophetic medicine (al-tibb al-nabawi)"
  ur: "طبِ نبوی"
summary:
  ar: "الطب النبوي هو ما ورد في هدي النبي من معالجة الأبدان، كما يعرضه ابن قيم الجوزية في زاد المعاد. ويقسم ابن القيم علاج النبي إلى ثلاثة أنواع: بالأدوية الطبيعية، وبالأدوية الإلهية، وبالمركب من الأمرين {cite:zad-al-maad p.597}. وأساس الباب عنده أحاديث إثبات الدواء، منها «لكل داء دواء» عند مسلم {cite:sahih-muslim 5741} و«ما أنزل الله داء إلا أنزل له شفاء» عند البخاري {cite:sahih-al-bukhari 5678}، ويرى أن التداوي لا ينافي التوكل {cite:zad-al-maad p.593}."
  en: "Prophetic medicine is what the reports preserve of the Prophet's guidance in treating the body, as Ibn Qayyim al-Jawziyya presents it in Zad al-Ma'ad. Ibn al-Qayyim sorts the Prophet's treatment into three kinds: by natural drugs, by divine remedies, and by a combination of the two {cite:zad-al-maad p.597}. The chapter rests for him on the reports that every disease has a remedy, among them 'every disease has a remedy' in Muslim {cite:sahih-muslim 5741} and 'God sent down no disease without sending down a cure for it' in al-Bukhari {cite:sahih-al-bukhari 5678}; he holds that seeking treatment does not conflict with trust in God {cite:zad-al-maad p.593}."
  ur: "طبِ نبوی سے مراد وہ ہے جو احادیث میں بدنوں کے علاج کے بارے میں نبی کی ہدایت کے طور پر محفوظ ہے، جیسا کہ ابن قیم الجوزیہ نے «زاد المعاد» میں پیش کیا ہے۔ ابن القیم نبی کے علاج کو تین قسموں میں بانٹتے ہیں: طبعی دواؤں سے، الٰہی دواؤں سے، اور دونوں کے مرکب سے {cite:zad-al-maad p.597}۔ ان کے نزدیک اس باب کی بنیاد دوا کے ثبوت کی احادیث ہیں، جن میں مسلم کی «ہر بیماری کی دوا ہے» {cite:sahih-muslim 5741} اور بخاری کی «اللہ نے کوئی بیماری نہیں اتاری مگر اس کی شفا بھی اتاری» {cite:sahih-al-bukhari 5678} شامل ہیں؛ اور وہ علاج کو توکل کے منافی نہیں سمجھتے {cite:zad-al-maad p.593}۔"
