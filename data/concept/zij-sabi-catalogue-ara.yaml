summary:
  ar: "يذكر الفهرس صورة المجمرة، ويقول إنها تُسمّى الربيح، ويعدّ كواكبها، ثم تأتي بعدها صورة الإكليل الجنوبي في الصفحة نفسها. {cite:zij-sabi-nallino-byblion pp.273}"
  en: "The catalogue gives the figure of al-Mijmara, the Censer, which it says is also called al-Rabih. Its stars are listed, and the Southern Crown follows on the same page. {cite:zij-sabi-nallino-byblion pp.273}"
  ur: "فہرست مجمرہ یعنی انگیٹھی کی صورت دیتی ہے، جسے متن ربیح بھی کہتا ہے۔ اس کے ستارے درج ہیں اور اسی صفحے پر جنوبی اکلیل کی صورت آتی ہے۔ {cite:zij-sabi-nallino-byblion pp.273}"
  es: "El catálogo incluye la figura de al-Mijmara, el Incensario, que también se conoce como al-Rabih. Se enumeran sus estrellas, y en la misma página aparece la Corona del Sur. {cite:zij-sabi-nallino-byblion pp.273}"
