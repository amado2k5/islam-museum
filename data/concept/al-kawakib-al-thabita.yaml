id: concept/al-kawakib-al-thabita
class: concept
kind: scientific
label: { ar: "الكواكب الثابتة", en: "The fixed stars", fr: "Les étoiles fixes", es: "Las estrellas fijas" }
summary:
  ar: "الكواكب التي لا تتغير مواضعها فيما بينها، وتتحرك جميعاً من المشرق إلى المغرب حركة واحدة، ويضيف إليها الفرغاني حركة بطيئة على قطبي فلك البروج مقدارها درجة في كل مائة سنة، ودورها ستة وثلاثون ألف سنة. وعدّ الفرغاني منها ألفاً واثنين وعشرين كوكباً في ستة أقدار، خمسة عشر منها في القدر الأول. {cite:farghani-elements-astronomy p. 55}{cite:farghani-elements-astronomy p. 80}"
  en: "The stars whose positions relative to one another do not change. They share one motion from east to west with the sphere of stars, and al-Farghani adds a slow motion of one degree per hundred years around the poles of the zodiac, completed in 36,000 years. He counts 1,022 stars in six magnitudes, fifteen of them in the first {cite:farghani-elements-astronomy p. 55}{cite:farghani-elements-astronomy p. 80}."
  fr: "Les étoiles dont les positions relatives ne changent pas. Elles partagent avec la sphère des étoiles un mouvement d’est en ouest ; al-Farghani y ajoute un mouvement lent d’un degré par siècle autour des pôles du zodiaque, accompli en 36 000 ans. Il compte 1 022 étoiles réparties en six magnitudes, dont quinze de première magnitude {cite:farghani-elements-astronomy p. 55}{cite:farghani-elements-astronomy p. 80}."
  es: "Las estrellas cuyas posiciones relativas entre sí no cambian. Comparten un movimiento de este a oeste con la esfera de las estrellas, y al-Farghani añade un movimiento lento de un grado cada cien años alrededor de los polos del zodíaco, que se completa en 36.000 años. Cuenta 1.022 estrellas en seis magnitudes, quince de ellas en la primera {cite:farghani-elements-astronomy p. 55}{cite:farghani-elements-astronomy p. 80}."
