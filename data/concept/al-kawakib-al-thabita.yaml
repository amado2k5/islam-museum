summary:
  ar: "الكواكب التي لا تتغير مواضعها فيما بينها، وتتحرك جميعاً من المشرق إلى المغرب حركة واحدة، ويضيف إليها الفرغاني حركة بطيئة على قطبي فلك البروج مقدارها درجة في كل مائة سنة، ودورها ستة وثلاثون ألف سنة. وعدّ الفرغاني منها ألفاً واثنين وعشرين كوكباً في ستة أقدار، خمسة عشر منها في القدر الأول. {cite:farghani-elements-astronomy p. 55}{cite:farghani-elements-astronomy p. 80}"
  en: "The stars whose positions relative to one another do not change. They share one motion from east to west with the sphere of stars, and al-Farghani adds a slow motion of one degree per hundred years around the poles of the zodiac, completed in 36,000 years. He counts 1,022 stars in six magnitudes, fifteen of them in the first {cite:farghani-elements-astronomy p. 55}{cite:farghani-elements-astronomy p. 80}."
