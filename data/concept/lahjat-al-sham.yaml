id: concept/lahjat-al-sham
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-dialects]
label:
  ar: "اللهجة الشامية"
  en: "The Levantine dialect"
  ur: "شامی بولی"
  fr: "Le dialecte levantin"
  es: "El dialecto levantino"
summary:
  ar: "ما قُرئ عن كلام الشام: تقسيم دائرة المعارف البريطانية لمجموعات اللهجات، وما ينقله السيوطي عن الفارابي في عرب الأطراف المجاورين للشام، وقول ابن خلدون في لسان الأمصار واختلاف المشرق والمغرب والأندلس. ولم يُعثر على وصف لخصائص اللهجة الشامية ولا على عدد متكلميها، فالصفحة قصيرة على قدر ما قُرئ."
  en: "What was read of the speech of the Levant: the Encyclopaedia Britannica's division of the dialect groups, what al-Suyuti relays from al-Farabi on the Arabs of the edge adjoining the Levant, and Ibn Khaldun on the speech of the cities and the differences of east, west and al-Andalus. No description of the features of the Levantine dialect, and no count of its speakers, was found, so the page is short as far as what was read goes."
  ur: "شام کے کلام کے بارے میں جو پڑھا گیا: انسائیکلوپیڈیا برٹانیکا کی لہجوں کے گروہوں کی تقسیم، اور سیوطی فارابی سے شام سے ملحق اطراف کے عربوں کے بارے میں جو نقل کرتے ہیں، اور شہروں کی زبان اور مشرق، مغرب اور اندلس کے اختلاف کے بارے میں ابن خلدون کا قول۔ شامی بولی کی خصوصیات کی کوئی توصیف اور اس کے بولنے والوں کی کوئی تعداد نہیں ملی، اس لیے صفحہ مختصر ہے، جتنا پڑھا گیا اس کے مطابق۔"
  fr: "Ce qui a été lu sur le parler du Levant : la division des groupes dialectaux de l'Encyclopaedia Britannica, ce qu'al-Suyuti relaie d'al-Farabi sur les Arabes de la marge voisine du Levant, et Ibn Khaldun sur le parler des villes et les différences de l'est, de l'ouest et d'al-Andalus. Aucune description des traits du dialecte levantin, ni aucun décompte de ses locuteurs, n'a été trouvée, de sorte que la page est brève, autant que va ce qui a été lu."
  es: "Lo que se leyó sobre el habla del Levante: la división de los grupos dialectales de la Encyclopaedia Britannica, lo que al-Suyuti transmite de al-Farabi sobre los árabes del margen contiguo al Levante, e Ibn Jaldún sobre el habla de las ciudades y las diferencias del este, el oeste y al-Ándalus. No se halló ninguna descripción de los rasgos del dialecto levantino ni un recuento de sus hablantes, de modo que la página es breve, en la medida de lo que se leyó."
