  en: "The Lesser Bear"
  ur: "دب اصغر"
  es: "El oso menor"
  fr: "La Petite Ourse"
summary:
  ar: "يبدأ فهرس الكواكب الثابتة في الزيج بصورة الدب الأصغر، فيذكر كواكبها واحداً بعد واحد، ويبدأ بالكوكب الذي على طرف ذنب هذا الدب، ثم الذي على أصل ذنبه. وتُكتب مواضع كل كوكب من الطول والعرض في جدول مقابل، ولم تُنقل أرقامه هنا. {cite:zij-sabi-nallino-byblion pp.245}"
  en: "The star catalogue opens with the figure of the Lesser Bear. Its stars are listed one by one, beginning with the star on the tip of its tail and then the star at the root of its tail. Each star's longitude and latitude stand in a table beside it; those figures are not transcribed here. {cite:zij-sabi-nallino-byblion pp.245}"
  ur: "ستاروں کی فہرست دب اصغر کی صورت سے شروع ہوتی ہے۔ اس کے ستارے ایک ایک کر کے درج ہیں، پہلے دم کی نوک پر والا ستارہ اور پھر دم کی جڑ والا۔ ہر ستارے کا طول اور عرض ساتھ کے جدول میں ہے؛ وہ عددی قیمتیں یہاں نقل نہیں کی گئیں۔ {cite:zij-sabi-nallino-byblion pp.245}"
  es: "El catálogo estelar comienza con la figura de la Osa Menor. Sus estrellas se enumeran una por una, comenzando por la estrella en la punta de su cola y luego la estrella en la base de la misma. La longitud y latitud de cada estrella se muestran en una tabla junto a ella; estos datos no se transcriben aquí. {cite:zij-sabi-nallino-byblion pp.245}"
  fr: "Le catalogue des étoiles s'ouvre sur la figure de la Petite Ourse. Ses étoiles sont énumérées une à une, en commençant par celle située à l'extrémité de sa queue, puis celle à sa base. La longitude et la latitude de chaque étoile figurent dans un tableau à côté d'elle; ces données ne sont pas retranscrites ici. {cite:zij-sabi-nallino-byblion pp.245}"
