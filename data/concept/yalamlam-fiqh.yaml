summary:
  ar: "يلملم جبل بتهامة جنوب مكة، وهو ميقات أهل اليمن ثبت بالنص، وقال النبي إن المواقيت لأهلها ولمن مر عليها من غير أهلها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18004}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18005}"
  en: "Yalamlam is a mountain of Tihama south of Mecca and the miqat of the people of Yemen, fixed by a text; the miqats belong to their own people and to whoever passes through them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18004}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18005}"
  es: "Yalamlam es una montaña de Tihama al sur de La Meca y el miqat del pueblo de Yemen, establecido por un texto; los miqats pertenecen a su propio pueblo y a quienquiera que los atraviese. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18004}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18005}"
  fr: "Yalamlam est une montagne de Tihama, au sud de La Mecque, et le miqat du peuple yéménite, fixé par un texte; les miqats appartiennent à leur peuple et à quiconque les traverse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18004}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18005}"
  ur: "یلملم مکہ کے جنوب میں تہامہ کا ایک پہاڑ اور یمن کے لوگوں کا میقات ہے، جسے متن کے ذریعے مقرر کیا گیا ہے۔ میقات ان کے اپنے لوگوں کے ہیں اور جو بھی ان سے گزرتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 18004}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 18005}"
  tr: "Yalamlam, Mekke'nin güneyinde, Tihama'da bulunan bir dağdır ve metinsel delillerle belirlendiği üzere Yemen halkı için mikat (ihram giymek için belirlenmiş yer) noktasıdır. Peygamberimiz şöyle buyurmuştur: \"Mikatlar, hem kendi halkı için hem de kendi halkı dışından geçenler içindir.\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18004}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18005}"
  id: "Yalamlam adalah sebuah gunung di Tihama, selatan Mekah, dan merupakan miqat (tempat yang ditentukan untuk mengenakan ihram) bagi penduduk Yaman, sebagaimana dibuktikan oleh bukti tekstual. Nabi Muhammad SAW bersabda bahwa miqat diperuntukkan bagi penduduknya dan bagi orang-orang yang melewatinya selain penduduknya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18004}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18005}"
