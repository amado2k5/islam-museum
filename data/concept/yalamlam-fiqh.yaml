label:
  ar: "يَلَمْلَم"
  en: "Yalamlam (miqat of Yemen, fiqh)"
  es: "Yalamlam (miqat de Yemen, fiqh)"
  fr: "Yalamlam (miqat du Yémen, fiqh)"
  ur: "یلملم ⁦(یمن کی میقات، فقہ)⁩"
  tr: "Yalamlam"
