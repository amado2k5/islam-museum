label:
  ar: شقوق اللسان
  en: Fissures of the tongue
  ur: زبان کی شقیں
  es: "Fisuras de la lengua"
summary:
  ar: في علاج الشقوق في اللسان لعاب من هذا الجنس يمسكه في الفم ويتجرعه وتناول الأكارع والبيض النيمبرشت ومما جرب فيه الزبد الحادث من تدلك قطع من هذا الجنس ⁦(مجرب منقول والأسماء مطروحة)⁩ {cite:canon-ibn-sina-print-v2 p.260}
  en: 'For the treatment of the fissures in the tongue: a mucilage of this kind held in the mouth and swallowed, eating trotters and soft-cooked eggs, and among the tried is the fresh butter made by rubbing pieces of this kind (a tried report carried; the names left out) {cite:canon-ibn-sina-print-v2 p.260}'
  ur: 'زبان کی شقوں کے علاج میں اسی جنس کا لعاب منہ میں رکھ کر نگلا جائے اور پائے اور نیم برشت انڈے کھائے جائیں؛ اور آزمائے ہوئے میں اسی جنس کے ٹکڑوں کو مالنے سے بننے والا تازہ مکھن ہے ⁦(منقولہ آزمودہ؛ نام مطروح)⁩ {cite:canon-ibn-sina-print-v2 p.260}'
  es: "Para el tratamiento de las fisuras en la lengua: un mucílago de este tipo que se mantiene en la boca y se traga, comer manitas de cerdo y huevos pasados por agua, y entre los remedios probados está la mantequilla fresca hecha frotando trozos de este tipo (se llevó un informe probado; se omitieron los nombres) {cite:canon-ibn-sina-print-v2 p.260}"
