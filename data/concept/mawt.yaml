summary:
  ar: "الموت في اللغة ضد الحياة، وفي الاصطلاح مفارقة الروح للجسد، ويعلق الفقهاء أحكامه بأماراته الظاهرة. وهو على ثلاثة أقسام: حقيقي، وحكمي، وتقديري. وللموت أثر على الحقوق المالية والشخصية والمختلطة، وعلى الالتزامات الشرعية كالزكاة والكفارات والنفقة والحج والصلاة والصوم، وعلى العقود كالبيع والسلم والإجارة والمساقاة والمزارعة والحوالة والرهن والكفالة والهبة والعارية والوكالة والشركة والمضاربة والجعالة والنذر."
  en: "Death in the lexicon is the opposite of life; in law it is the departure of the soul from the body, and the jurists tie its rulings to its visible signs. It is real, legal or presumed. The entry covers its effect on the rights of the dead: property rights, personal rights and mixed rights such as options, pre-emption and retaliation; the reward of his good works and of prayer for him; the visit to the grave; the state of the soul in the intermediate life; and on his obligations: alms, expiations, maintenance, pilgrimage, prayer, fasting; and on the contracts into which he entered, such as sale, salam, lease, irrigation partnership, tenancy, assignment, pledge, surety, gift, loan, agency, partnership, profit-sharing, reward for a task, vows and promises."
  ur: "موت لغت میں زندگی کی ضد ہے، اور فقہی اصطلاح میں روح کا جسم سے جدا ہونا ہے۔ اس کی تین قسمیں حقیقی، حکمی اور تقدیری ہیں۔ فقہاء نے میت کے مالی، شخصی اور مختلط حقوق، اس کی ذمہ داریوں جیسے زکات، کفارہ، نفقہ، حج، نماز اور روزہ، اور اس کے عقود جیسے بیع، سلم، اجارہ، وکالت، شرکت اور مضاربت پر اس کے اثرات بیان کیے ہیں۔"
  es: "En el léxico, la muerte es lo opuesto a la vida; en derecho, es la separación del alma del cuerpo, y los juristas vinculan sus resoluciones a sus signos visibles. Puede ser real, legal o presunta. La entrada abarca su efecto sobre los derechos del difunto: derechos de propiedad, derechos personales y derechos mixtos como opciones, derecho de tanteo y resarcimiento; la recompensa por sus buenas obras y por las oraciones por él; la visita a la tumba; el estado del alma en la vida intermedia; y sobre sus obligaciones: limosnas, expiaciones, manutención, peregrinación, oración, ayuno; y sobre los contratos que celebró, tales como venta, salam, arrendamiento, sociedad de riego, tenencia, cesión, prenda, fianza, donación, préstamo, agencia, sociedad, participación en las ganancias, recompensa por una tarea, votos y promesas."
  fr: "Dans le langage courant, la mort est l'opposé de la vie; en droit, elle correspond au départ de l'âme du corps, et les juristes fondent leurs décisions sur ses signes visibles. Elle peut être réelle, légale ou présumée. L'article traite de ses effets sur les droits du défunt: droits patrimoniaux, droits personnels et droits mixtes tels que les options, le droit de préemption et le droit de représailles; la récompense de ses bonnes œuvres et des prières pour lui; la visite de sa tombe; l'état de son âme dans l'au-delà; et sur ses obligations: aumônes, expiations, entretien, pèlerinage, prière, jeûne; ainsi que sur les contrats qu'il a conclus, tels que la vente, le salami, le bail, le partenariat d'irrigation, le fermage, la cession, le gage, le cautionnement, la donation, le prêt, le mandat, le partenariat, le partage des bénéfices, la rémunération d'une tâche, les vœux et les promesses."
