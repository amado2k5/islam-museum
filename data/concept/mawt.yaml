summary:
  ar: "الموت في اللغة ضد الحياة، وفي الاصطلاح مفارقة الروح للجسد، ويعلق الفقهاء أحكامه بأماراته الظاهرة. وهو على ثلاثة أقسام: حقيقي، وحكمي، وتقديري. وللموت أثر على الحقوق المالية والشخصية والمختلطة، وعلى الالتزامات الشرعية كالزكاة والكفارات والنفقة والحج والصلاة والصوم، وعلى العقود كالبيع والسلم والإجارة والمساقاة والمزارعة والحوالة والرهن والكفالة والهبة والعارية والوكالة والشركة والمضاربة والجعالة والنذر."
  en: "Death in the lexicon is the opposite of life; in law it is the departure of the soul from the body, and the jurists tie its rulings to its visible signs. It is real, legal or presumed. The entry covers its effect on the rights of the dead: property rights, personal rights and mixed rights such as options, pre-emption and retaliation; the reward of his good works and of prayer for him; the visit to the grave; the state of the soul in the intermediate life; and on his obligations: alms, expiations, maintenance, pilgrimage, prayer, fasting; and on the contracts into which he entered, such as sale, salam, lease, irrigation partnership, tenancy, assignment, pledge, surety, gift, loan, agency, partnership, profit-sharing, reward for a task, vows and promises."
  ur: "موت لغت میں زندگی کی ضد ہے، اور فقہی اصطلاح میں روح کا جسم سے جدا ہونا ہے۔ اس کی تین قسمیں حقیقی، حکمی اور تقدیری ہیں۔ فقہاء نے میت کے مالی، شخصی اور مختلط حقوق، اس کی ذمہ داریوں جیسے زکات، کفارہ، نفقہ، حج، نماز اور روزہ، اور اس کے عقود جیسے بیع، سلم، اجارہ، وکالت، شرکت اور مضاربت پر اس کے اثرات بیان کیے ہیں۔"
