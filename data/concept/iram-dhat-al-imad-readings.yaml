id: concept/iram-dhat-al-imad-readings
class: concept
kind: term
label: { ar: "قراءات إرم ذات العماد", en: "The readings of Iram dhat al-'imad", ur: "ارم ذات العماد کی تعبیریں", es: "Las lecturas de Iram dhat al-'imad", fr: "Les lectures d'Iram dhat al-'imad" }
summary:
  ar: "يذكر القرآن إرم ذات العماد مرة واحدة بعد عاد [[passage/quran-89-7|الفجر 7]]، واختلف المفسرون فيها: قبيلة من عاد أو جدهم أو أمة قديمة عند الطبري ومجاهد وقتادة وابن إسحاق، أو مدينة هي دمشق عند سعيد المقبري وعكرمة والإسكندرية عند القرظي، ورجّح الطبري وابن كثير أنها قبيلة. وأما المدينة الذهبية التي بناها شداد وقصة ابن قلابة وكعب فقد عدّها ابن كثير من خرافات الإسرائيليين، وجعلها المسعودي من صنعة القصاص، وردّها ابن خلدون {cite:tafsir-tabari-quran-com on 89:7} {cite:tafsir-ibn-kathir on 89:8} {cite:muruj-al-dhahab OpenITI text vol. 1 p. 270} {cite:muqaddima-ibn-khaldun on the errors of historians}."
  en: "The Qur'an names Iram dhat al-'imad once, after 'Ad [[passage/quran-89-7|al-Fajr 7]], and the exegetes differed: a tribe of 'Ad, their ancestor or an ancient nation in al-Tabari, Mujahid, Qatada and Ibn Ishaq, or a city, Damascus for Sa'id al-Maqburi and 'Ikrima and Alexandria for al-Qurazi; al-Tabari and Ibn Kathir preferred a tribe. The golden city of Shaddad and the story of Ibn Qilaba and Ka'b were judged by Ibn Kathir to belong to the Israelite fables, by al-Mas'udi to be the storytellers' craft, and were rejected by Ibn Khaldun {cite:tafsir-tabari-quran-com on 89:7} {cite:tafsir-ibn-kathir on 89:8} {cite:muruj-al-dhahab OpenITI text vol. 1 p. 270} {cite:muqaddima-ibn-khaldun on the errors of historians}."
  ur: "قرآن ارم ذات العماد کا ذکر عاد کے بعد صرف ایک بار کرتا ہے [[passage/quran-89-7|الفجر 7]]، اور مفسرین کا اختلاف رہا: طبری، مجاہد، قتادہ اور ابن اسحاق کے ہاں عاد کا ایک قبیلہ، ان کا جدّ یا ایک قدیم قوم، یا ایک شہر، جو سعید مقبری اور عکرمہ کے ہاں دمشق اور قرظی کے ہاں اسکندریہ ہے؛ طبری اور ابن کثیر نے قبیلہ ہونے کو ترجیح دی۔ شداد کے بنائے ہوئے سنہری شہر اور ابن قلابہ و کعب کے قصے کو ابن کثیر نے بنی اسرائیل کی خرافات میں شمار کیا، مسعودی نے قصہ گو لوگوں کی کاریگری کہا، اور ابن خلدون نے رد کیا {cite:tafsir-tabari-quran-com on 89:7} {cite:tafsir-ibn-kathir on 89:8} {cite:muruj-al-dhahab OpenITI text vol. 1 p. 270} {cite:muqaddima-ibn-khaldun on the errors of historians}۔"
  es: "El Corán nombra a Iram dhat al-'imad una vez, después de 'Ad [[passage/quran-89-7|al-Fajr 7]], y los exégetas discreparon: una tribu de 'Ad, su antepasado o una nación antigua en al-Tabari, Mujahid, Qatada e Ibn Ishaq, o una ciudad, Damasco para Sa'id al-Maqburi y 'Ikrima y Alejandría para al-Qurazi; al-Tabari e Ibn Kathir prefirieron una tribu. La ciudad dorada de Shaddad y la historia de Ibn Qilaba y Ka'b fueron juzgadas por Ibn Kathir como pertenecientes a las fábulas israelitas, por al-Mas'udi como un oficio de los narradores, y fueron rechazadas por Ibn Khaldun {cite:tafsir-tabari-quran-com en 89:7} {cite:tafsir-ibn-kathir en 89:8} {cite:muruj-al-dhahab OpenITI text vol. 1 p. 270} {cite:muqaddima-ibn-khaldun sobre los errores de los historiadores}."
  fr: "Le Coran nomme Iram dhat al-'imad une fois, après 'Ad [[passage/quran-89-7|al-Fajr 7]], et les exégètes ont divergé: une tribu de 'Ad, leur ancêtre ou une nation ancienne selon al-Tabari, Mujahid, Qatada et Ibn Ishaq, ou une ville, Damas pour Sa'id al-Maqburi et 'Ikrima et Alexandrie pour al-Qurazi; al-Tabari et Ibn Kathir préféraient une tribu. La cité dorée de Shaddad et l'histoire d'Ibn Qilaba et de Ka'b furent jugées par Ibn Kathir comme appartenant aux fables israélites, par al-Mas'udi comme étant l'art des conteurs, et furent rejetées par Ibn Khaldun {cite:tafsir-tabari-quran-com on 89:7} {cite:tafsir-ibn-kathir on 89:8} {cite:muruj-al-dhahab OpenITI text vol. 1 p. 270} {cite:muqaddima-ibn-khaldun on the errors of historians}."
