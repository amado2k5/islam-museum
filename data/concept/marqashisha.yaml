label:
  ar: "مارقشيثا"
  en: "Marqashitha (a stone of four kinds)"
  ur: "مارقشیثا"
summary:
  ar: "مارقشيثا حجر أصناف، ذهبي وفضي ونحاسي وحديدي، حار في الثانية يابس في الثالثة، فيه قبض وإسخان وإنضاج وتحليل وجلاء، ولا تظهر منفعته ما لم ينعم دقه {cite:canon-ibn-sina-print-v1 p.563}."
  en: "Marqashitha is a stone of several kinds, golden, silver, copper and iron, hot in the second degree and dry in the third, astringent, warming, ripening, dissolving and cleansing, whose benefit shows only when it is ground fine {cite:canon-ibn-sina-print-v1 p.563}."
  ur: "مارقشیثا ایک پتھر ہے جس کی قسمیں سنہری، چاندی جیسی، تانبے جیسی اور لوہے جیسی ہیں؛ دوسرے درجے میں گرم اور تیسرے میں خشک، قابض، گرم کرنے والا، پکانے والا، تحلیل کرنے والا اور جلا دینے والا، اور باریک پیسے بغیر اس کا فائدہ ظاہر نہیں ہوتا {cite:canon-ibn-sina-print-v1 p.563}۔"
