label: { ar: "تحول البول من الرقة إلى الغلظ أو الصفاء عند ابن سينا", en: "Urine turning from thin to thick, or from thick to clear, in the Canon", ur: "پیشاب کا پتلے سے گاڑھا یا گاڑھے سے صاف ہونا قانون میں", es: "La orina cambia de líquida a espesa, o de espesa a transparente, en el Canon", fr: "L'urine qui passe de fluide à épaisse, ou d'épaisse à claire, dans le Canon" }
summary:
  ar: "يذكر ابن سينا ثلاث حالات ينظر فيها بحسب تحول البول: أن يبال رقيقاً ثم يغلظ، أو غليظاً ثم يصفو ويرسب، أو حالة وسطى بينهما، ويبين أن البول المائي الذي يبقى مائياً دليل عدم النضج {cite:canon-ibn-sina-print-v1 p.190}."
  en: "Ibn Sina gives three cases by how urine changes: passed thin then thickening, passed thick then clearing and depositing, or a middle state between them, and says water-like urine that stays water-like shows lack of ripening {cite:canon-ibn-sina-print-v1 p.190}."
  es: "Ibn Sina da tres casos según cómo cambia la orina: orina diluida que luego se espesa, orina espesa que luego se aclara y se deposita, o un estado intermedio entre ellos, y dice que la orina acuosa que permanece acuosa muestra falta de maduración {cite:canon-ibn-sina-print-v1 p.190}."
  fr: "Ibn Sina donne trois cas selon la façon dont l'urine change: passée fluide puis s'épaississant, passée épaisse puis s'éclaircissant et se déposant, ou un état intermédiaire entre eux, et dit qu'une urine semblable à de l'eau qui reste semblable à de l'eau montre un manque de maturation {cite:canon-ibn-sina-print-v1 p.190}."
