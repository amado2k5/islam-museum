summary:
  ar: "ولاية العهد في الاصطلاح: عهد الإمام في حياته بالخلافة إلى واحد ليكون إماماً للمسلمين بعده، وهي من طرق انعقاد الإمامة، وصورتها أن يستخلف الإمام شخصاً عيّنه في حياته، ويُعبّر عنها بقوله «عهدت إليه»، كما عهد أبو بكر إلى عمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17897}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17898}\n\nشروط صحتها أن يكون الإمام جامعاً لشروط الإمامة، وأن يقبل المستخلف في حياة الإمام، وأن يتراخى القبول عن الاستخلاف، وأن يتحرى الإمام الأصلح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17898}\n\nويجوز أن تكون الخلافة لأكثر من واحد بالترتيب، فإن مات الأول في حياة الإمام فالخلافة للثاني، وإن مات الإمام والثلاثة أحياء فلمن انتصب منهم أن يعهد بها إلى غير الأخيرين، ولا يملك أهل البيعة أن يبايعوا غير الثاني إذا لم يعهد الإمام إلى أحد. ولا يشترط موافقة أهل الحل والعقد. وجعل الإمام الأمر شورى بين جمع كما فعل عمر بين ستة من الصحابة فكالاستخلاف، ولا يعيّن أهل الشورى ولياً قبل موت الإمام إلا بإذنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17898}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17899}\n\nوالإمام يجوز له أن يوصي بالخلافة لمن رآه صالحاً، وإن استعفى المستخلف أو الموصى له بعد القبول لم ينعزل حتى يُعفى ويوجد غيره، ويصح استخلاف الغائب إذا عُلمت حياته. وللإمام تبديل ولي العهد لأن الخلافة انتهت إليه، وليس لولي العهد نقلها إلى غيره، ولا عزل نفسه إلا بالتراضي مع الإمام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17899}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17900}"
  en: "The designation of a successor (wilayat al-'ahd) in the technical sense is the imam's appointment, during his life, of one person to be imam of the Muslims after him. It is one of the ways in which the imamate is established. It is done by the imam naming a person and saying 'I have entrusted him to you' ('ahidtu ilayhi'), as Abu Bakr named 'Umar in a letter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17897}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17898}\n\nIts conditions: the imam must have the qualities of the imamate; the designated person must accept during the imam's life; acceptance must be later than the designation; and the imam must seek the most suitable person. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17898}\n\nThe succession may pass to more than one, in order. If the first dies during the imam's life, the second succeeds; if the imam dies while three are living and the first has taken the office, he may designate someone other than the last two. If the imam designates no one, the electors may not choose anyone but the second. Consent of the people who bind and loose is not required. If the imam makes the matter a consultation among a group, as 'Umar did among six Companions, the effect is like designation; the consultative group may not name a successor before the imam dies unless he permits it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17898}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17899}\n\nThe imam may bequeath the succession to one he sees as suitable, and if the designee asks to be excused after accepting, he is not removed until he is excused and another is found. The designation of an absent person is valid if his life is known. The imam may change the designated successor, since the office has come to him, but the successor may not transfer it to another, nor remove himself except by agreement with the imam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17899}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17900}"
  es: "La designación de un sucesor (wilayat al-'ahd) en sentido técnico es el nombramiento por parte del imán, durante su vida, de una persona para ser imán de los musulmanes después de él. Es una de las formas en que se establece el imamato. Se hace cuando el imán nombra a una persona y dice 'Te lo he encomendado' ('ahidtu ilayhi'), como Abu Bakr nombró a 'Umar en una carta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17897}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17898} Sus condiciones: el imán debe tener las cualidades del imamato; la persona designada debe aceptar durante la vida del imán; la aceptación debe ser posterior a la designación; y el imán debe buscar a la persona más adecuada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17898} La sucesión puede pasar a más de uno, en orden. Si el primero muere durante la vida del imán, el segundo lo sucede; si el imán muere mientras tres viven y el primero ha asumido el cargo, puede designar a alguien distinto de los dos últimos. Si el imán no designa a nadie, los electores no pueden elegir a nadie más que al segundo. No se requiere el consentimiento de las personas que atan y desatan. Si el imán realiza una consulta entre un grupo, como hizo 'Umar entre seis Compañeros, el efecto es como una designación; el grupo consultivo no puede nombrar un sucesor antes de que el imán muera a menos que él lo permita. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17898}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17899} El imán puede legar la sucesión a quien considere idóneo, y si el designado solicita ser excusado después de aceptar, no será destituido hasta que sea excusado y se encuentre a otro. La designación de una persona ausente es válida si se conoce su vida. El imán puede cambiar al sucesor designado, puesto que el cargo le ha sido asignado, pero el sucesor no puede transferirlo a otro, ni renunciar a sí mismo salvo por acuerdo con el imán. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17899}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17900}"
  fr: "La désignation d'un successeur (wilayat al-'ahd), au sens technique du terme, consiste pour l'imam à nommer, de son vivant, une personne pour lui succéder à la tête des musulmans. C'est l'un des moyens d'établir l'imamat. L'imam désigne alors une personne et déclare: « Je te le confie » (« ahidtu ilayhi »), comme Abou Bakr le fit pour Omar dans une lettre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17897}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17898} Les conditions de cette désignation sont les suivantes: l'imam doit posséder les qualités requises pour l'imamat; la personne désignée doit accepter cette nomination du vivant de l'imam; cette acceptation doit être postérieure à la désignation; et l'imam doit rechercher la personne la plus apte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17898} La succession peut être transmise à plusieurs personnes, à tour de rôle. Si le premier imam décède du vivant de ce dernier, le second lui succède. Si l'imam décède alors que trois imams sont encore en vie et que le premier a pris ses fonctions, il peut désigner une personne autre que les deux derniers. Si l'imam ne désigne personne, les électeurs ne peuvent choisir que le second. Le consentement des personnes habilitées à lier et délier n'est pas requis. Si l'imam consulte un groupe à ce sujet, comme 'Umar l'a fait avec six Compagnons, cela équivaut à une désignation; le groupe consulté ne peut nommer de successeur avant le décès de l'imam, sauf autorisation de sa part. L’imam peut désigner un successeur qu’il juge apte à prendre la relève. Si le successeur désigné demande à être excusé après avoir accepté, il reste en fonction jusqu’à ce qu’il soit excusé et qu’un autre successeur soit trouvé. La désignation d’une personne absente est valable si son identité est connue. L’imam peut changer le successeur désigné, puisque la charge lui est revenue, mais le successeur ne peut ni la céder à un tiers, ni se retirer sans l’accord de l’imam."
  ur: "تکنیکی لحاظ سے جانشین ⁦(ولایت الاحد)⁩ کا عہدہ امام کی اپنی زندگی کے دوران، ایک شخص کو اپنے بعد مسلمانوں کا امام مقرر کرنا ہے۔ یہ امامت کے قیام کے طریقوں میں سے ایک ہے۔ یہ امام کسی شخص کا نام لیتے ہوئے اور کہتے ہیں کہ 'میں نے اسے آپ کے سپرد کیا ہے' ⁦('احدتو الیحی')⁩ جیسا کہ ابوبکر نے ایک خط میں عمر کا نام لیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17897}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17898} اس کی شرائط: امام میں امامت کی صفات ہونی چاہئیں۔ نامزد شخص کو امام کی زندگی کے دوران قبول کرنا ضروری ہے؛ قبولیت عہدہ سے بعد میں ہونی چاہیے؛ اور امام کو مناسب ترین شخص کی تلاش کرنی چاہیے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17898} جانشینی ترتیب کے لحاظ سے ایک سے زیادہ ہو سکتی ہے۔ اگر امام کی زندگی میں پہلا مر جائے تو دوسرا کامیاب ہو جاتا ہے۔ اگر امام تین زندہ ہوتے ہوئے فوت ہو جائے اور پہلے نے عہدہ سنبھال لیا ہو تو وہ آخری دو کے علاوہ کسی اور کو نامزد کر سکتا ہے۔ اگر امام کسی کو نامزد نہیں کرتا ہے تو انتخاب کرنے والے دوسرے کے علاوہ کسی کو منتخب نہیں کرسکتے ہیں۔ باندھنے اور ڈھیلے کرنے والے لوگوں کی رضامندی کی ضرورت نہیں ہے۔ اگر امام اس معاملے کو کسی گروہ کے درمیان مشورے کا ذریعہ بناتا ہے جیسا کہ عمر نے چھ صحابہ میں کیا تھا تو اس کا اثر عہدہ کی طرح ہے۔ مشاورتی گروپ امام کی وفات سے پہلے کسی جانشین کا نام نہیں لے سکتا جب تک کہ وہ اس کی اجازت نہ دے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17898}{cite:fiqh-Mawsua-kuwaitiyya-noor-v3 p.17899} امام جس کو مناسب سمجھے اسے جانشینی کی وصیت کر سکتا ہے، اور اگر نامزد کرنے والا عذر طلب کرے جب تک کہ اسے قبول نہ کیا جائے اور اسے معاف نہ کر دیا جائے۔ غیر حاضر شخص کا عہدہ درست ہے اگر اس کی جان معلوم ہو۔ امام متعین جانشین کو تبدیل کر سکتا ہے، چونکہ عہدہ اس کے پاس آیا ہے، لیکن جانشین اسے کسی دوسرے کو منتقل نہیں کر سکتا اور نہ ہی امام کے ساتھ معاہدے کے علاوہ خود کو ہٹا سکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17899}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17900}"
  tr: "İslam hukukunda \"İmamın halifeliği\" terimi, İmam'ın hayattayken kendisinden sonra Müslümanlara önderlik edecek bir halef atamasını ifade eder. Bu, İmamlığın tesis edilmesinin yöntemlerinden biridir. Süreç, İmam'ın hayattayken, \"Ona halifeliği emanet ettim\" diyerek, örneğin Ebu Bekir'in Ömer'e yaptığı gibi, bir halef atamasını içerir. Geçerlilik şartları şunlardır: İmam'ın imamlığın gereklerini yerine getirmesi, atanan halefin İmam'ın hayattayken atamayı kabul etmesi, kabulün atamadan sonraya ertelenmesi ve İmam'ın en uygun adayı seçmesi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17898} Halifelik, halefiyet sırasına göre birden fazla kişi tarafından yürütülebilir. İlk halife İmam'ın hayattayken ölürse, halifelik ikincisine geçer. İmam, üçü de hayatta iken vefat ederse, atanmış olan kişi son ikisi dışında başka birini atayabilir. İmam birini atamadığı takdirde, İmam'a biat edenlerin ikinci kişiden başkasına biat etmelerine izin verilmez. Yetkili ve nüfuz sahibi kişilerin onayı gerekmez. İmam, Ömer'in altı Sahabe ile yaptığı gibi, bir grup arasında bir konsey kurabilir; bu, bir halef atamaya benzer. Konsey, İmam'ın ölümünden önce, onun izni olmadan bir vasi atayamaz. İmam, uygun gördüğü kişiyi halef olarak atayabilir. Atanan halef veya atanan kişi kabul ettikten sonra istifa ederse, resmen görevden alınana ve uygun bir halef bulunana kadar görevden alınmaz. İmam, yokluğunda ve hayatı biliniyorsa halef atayabilir. İmam, halifelik kendisine geçtiği için Veliaht Prensi değiştirebilir. Veliaht Prens, halifeliği başkasına devredemez ve İmam ile karşılıklı anlaşma dışında istifa edemez."
  id: "Dalam yurisprudensi Islam, istilah \"suksesi Imam\" merujuk pada penunjukan Imam, selama masa hidupnya, terhadap seorang pengganti untuk memimpin umat Islam setelahnya. Ini adalah salah satu metode untuk menegakkan Imamah. Prosesnya melibatkan Imam yang menunjuk seorang pengganti yang ditunjuk selama masa hidupnya, yang diungkapkan dengan mengatakan, \"Aku telah mempercayakan kekhalifahan kepadanya,\" seperti yang dilakukan Abu Bakar kepada Umar. Syarat-syarat keabsahannya adalah bahwa Imam harus memenuhi persyaratan Imamah, bahwa pengganti yang ditunjuk harus menerima penunjukan tersebut selama masa hidup Imam, bahwa penerimaan tersebut harus ditunda hingga setelah penunjukan, dan bahwa Imam harus memilih kandidat yang paling tepat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17898} Kekhalifahan dapat dipegang oleh lebih dari satu orang sesuai urutan suksesi. Jika yang pertama meninggal selama masa hidup Imam, kekhalifahan beralih ke yang kedua. Jika Imam wafat sementara ketiga orang tersebut masih hidup, orang yang telah ditunjuk dapat menunjuk orang lain selain dua orang terakhir. Mereka yang berjanji setia kepada Imam tidak diperbolehkan berjanji setia kepada siapa pun selain orang kedua jika Imam belum menunjuk seseorang. Persetujuan dari orang-orang yang berwenang dan berpengaruh tidak diperlukan. Imam dapat membentuk dewan di antara sekelompok orang, seperti yang dilakukan Umar dengan enam Sahabat, yang mirip dengan menunjuk pengganti. Dewan tersebut tidak boleh menunjuk wali sebelum wafatnya Imam kecuali dengan izinnya. Imam dapat menunjuk pengganti siapa pun yang dianggapnya cocok. Jika pengganti yang ditunjuk atau penerima yang ditunjuk mengundurkan diri setelah diterima, ia tidak dicopot dari jabatannya sampai ia secara resmi dibebaskan dan pengganti yang cocok ditemukan. Imam dapat menunjuk pengganti jika ia tidak hadir dan keberadaannya diketahui. Imam dapat mengganti Putra Mahkota, karena kekhalifahan telah beralih kepadanya. Putra Mahkota tidak dapat menyerahkannya kepada orang lain, dan ia juga tidak dapat mengundurkan diri kecuali dengan persetujuan bersama dengan Imam."
