label:
  ar: "وِلاية العهد"
  en: "Wilayat al-'ahd (designation of a successor, fiqh)"
summary:
  ar: "ولاية العهد في الاصطلاح: عهد الإمام في حياته بالخلافة إلى واحد ليكون إماماً للمسلمين بعده، وهي من طرق انعقاد الإمامة، وصورتها أن يستخلف الإمام شخصاً عيّنه في حياته، ويُعبّر عنها بقوله «عهدت إليه»، كما عهد أبو بكر إلى عمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17897}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17898}\n\nشروط صحتها أن يكون الإمام جامعاً لشروط الإمامة، وأن يقبل المستخلف في حياة الإمام، وأن يتراخى القبول عن الاستخلاف، وأن يتحرى الإمام الأصلح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17898}\n\nويجوز أن تكون الخلافة لأكثر من واحد بالترتيب، فإن مات الأول في حياة الإمام فالخلافة للثاني، وإن مات الإمام والثلاثة أحياء فلمن انتصب منهم أن يعهد بها إلى غير الأخيرين، ولا يملك أهل البيعة أن يبايعوا غير الثاني إذا لم يعهد الإمام إلى أحد. ولا يشترط موافقة أهل الحل والعقد. وجعل الإمام الأمر شورى بين جمع كما فعل عمر بين ستة من الصحابة فكالاستخلاف، ولا يعيّن أهل الشورى ولياً قبل موت الإمام إلا بإذنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17898}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17899}\n\nوالإمام يجوز له أن يوصي بالخلافة لمن رآه صالحاً، وإن استعفى المستخلف أو الموصى له بعد القبول لم ينعزل حتى يُعفى ويوجد غيره، ويصح استخلاف الغائب إذا عُلمت حياته. وللإمام تبديل ولي العهد لأن الخلافة انتهت إليه، وليس لولي العهد نقلها إلى غيره، ولا عزل نفسه إلا بالتراضي مع الإمام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17899}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17900}"
  en: "The designation of a successor (wilayat al-'ahd) in the technical sense is the imam's appointment, during his life, of one person to be imam of the Muslims after him. It is one of the ways in which the imamate is established. It is done by the imam naming a person and saying 'I have entrusted him to you' ('ahidtu ilayhi'), as Abu Bakr named 'Umar in a letter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17897}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17898}\n\nIts conditions: the imam must have the qualities of the imamate; the designated person must accept during the imam's life; acceptance must be later than the designation; and the imam must seek the most suitable person. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17898}\n\nThe succession may pass to more than one, in order. If the first dies during the imam's life, the second succeeds; if the imam dies while three are living and the first has taken the office, he may designate someone other than the last two. If the imam designates no one, the electors may not choose anyone but the second. Consent of the people who bind and loose is not required. If the imam makes the matter a consultation among a group, as 'Umar did among six Companions, the effect is like designation; the consultative group may not name a successor before the imam dies unless he permits it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17898}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17899}\n\nThe imam may bequeath the succession to one he sees as suitable, and if the designee asks to be excused after accepting, he is not removed until he is excused and another is found. The designation of an absent person is valid if his life is known. The imam may change the designated successor, since the office has come to him, but the successor may not transfer it to another, nor remove himself except by agreement with the imam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17899}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17900}"
