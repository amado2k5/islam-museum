id: "concept/butlan-al-basar"
class: "concept"
kind: "scientific"
label:
  ar: "بطلان البصر"
  en: "Loss of sight (butlan al-basar)"
  fr: "Perte de la vue (butlan al-basar)"
  ur: "بصر کا بطلان"
  es: "Pérdida de la vista (butlan al-basar)"
  tr: "Görsel geçersizlik"
  id: "Cacat penglihatan"
summary:
  ar: "بطلان البصر قد يقع من أسباب ضعف البصر إذا أفرطت، وقد يكون وأجزاء العين الظاهرة سليمة في جوهرها أو قد أصابتها آفة؛ فإن كانت الثقبة على حال صحتها فإما أن يكون هناك سدة مائية أو تكون السدة في القصبة المجوفة لشيء واقف في أنبوبتها أو لانطباق عرض لها من جفاف أو استرخاء أو ورم أو لانهتاك، أو تكون الجليدية زالت عن محاذاة الثقبة أو فسد مزاجها فلم تصلح أن تكون آلة للإبصار، وأكثر ما يعرض ذلك لرطوبة تغلب عليها جداً أو ليبوسة تغلب عليها فتجتمع إلى ذاتها وتستحصف وتسمى هذه العلة علقوماً {cite:canon-ibn-sina-print-v2 p.215} {cite:canon-ibn-sina-print-v2 p.216}"
  en: "Loss of sight may come from the causes of weak sight pushed to the extreme; it may occur while the visible parts of the eye are sound in substance or after a consuming or dissolving lesion. If the pupil keeps its healthy state, there is either a watery occlusion, or the occlusion is in the hollow nerve — something standing in its tube, a closure befalling it from dryness, relaxation or a swelling, or its rupture — or the icy humour has shifted from facing the aperture or its temperament has corrupted so it can no longer serve as the instrument of sight; most often that comes of a moisture overwhelming it or a dryness overwhelming it so it gathers into itself and shrinks, and this cause is called alqum {cite:canon-ibn-sina-print-v2 p.215} {cite:canon-ibn-sina-print-v2 p.216}"
  fr: "Selon le livre, elle peut venir des causes de faiblesse visuelle poussées à l’extrême, avec parties visibles intactes ou après lésion consumante ou résolutive. Si la pupille demeure saine, l’obstruction serait aqueuse ou située dans le nerf creux : contenu dans son canal, fermeture par sécheresse, relâchement, gonflement ou rupture. L’humeur glaciale peut aussi s’être déplacée face à l’ouverture ou avoir changé de tempérament, ne servant plus la vision ; souvent par humidité excessive ou sécheresse la contractant et la rétrécissant, cause nommée alqum {cite:canon-ibn-sina-print-v2 p.215} {cite:canon-ibn-sina-print-v2 p.216}"
  ur: "بصر کا بطلان ضعف بصر کے اسباب کے انتہا کو پہنچنے سے ہو سکتا ہے؛ یہ آنکھ کے ظاہر اجزا کے ذاتی طور پر سالم ہونے پر بھی ہو سکتا ہے اور کسی جلانے یا بگاڑنے والی آفت کے بعد بھی؛ اگر ثقبہ اپنی صحت پر ہو تو یا تو پانی والی سدہ ہے یا سدہ مجوف نالی میں ہے — اس کی نلی میں کھڑی شے، خشکی، استرخا یا ورم سے اس کا بند ہو جانا، یا اس کا پھٹنا — یا جلیدیہ ثقبے کے محاذی سے ہٹ گیا ہے یا اس کا مزاج بگڑ گیا ہے کہ وہ بصر کی آلہ رہنے کے قابل نہ رہی؛ اور اکثر یہ اس لیے ہوتا ہے کہ رطوبت اس پر نہایت غالب آ جائے یا خشکی غالب آئے تو وہ اپنے آپ میں سمیٹ کر سکڑ جائے اور اس علت کو علقوم کہتے ہیں {cite:canon-ibn-sina-print-v2 p.215} {cite:canon-ibn-sina-print-v2 p.216}"
  es: "La pérdida de visión puede deberse a causas de visión débil llevadas al extremo; puede ocurrir mientras las partes visibles del ojo están sanas o después de una lesión que consume o disuelve. Si la pupila se mantiene sana, existe una oclusión acuosa, o la oclusión se encuentra en el nervio óptico (algo que obstruye su conducto, un cierre debido a sequedad, relajación o inflamación, o su ruptura), o el humor vítreo se ha desplazado de la abertura o su temperamento se ha corrompido, de modo que ya no puede funcionar como instrumento de la visión; con mayor frecuencia, esto se debe a una humedad excesiva o a una sequedad excesiva, de modo que se contrae y se encoge, y esta causa se denomina alqum {cite:canon-ibn-sina-print-v2 p.215} {cite:canon-ibn-sina-print-v2 p.216}"
  tr: "Görme engelliliği, aşırı derecede kötü görmeye neden olabilir. Gözün görünür kısımları esasen sağlam olabilir veya bir lezyon olabilir; delinme sağlıklıysa su bloğu olabilir, boş tüpteki tıkanıklık tüpünde duran bir şeyden kaynaklanabilir, kuruluk, gevşeme, şişlik veya kaybolma, buzulun delinme hizasından kaybolmuş olması ya da görsel yardımcı olmaya uygun olmaması nedeniyle. Bunların çoğu aşırı nem veya aşırı kuruluktan kaynaklanır; bu da kendi üzerinde birikerek çözünür. Bu duruma 'Alqooma' denir {cite:canon-ibn-sina-print-v2 s.215} {cite:canon-ibn-sina-print-v2 s.216}}"
  id: "Ketidakmampuan penglihatan dapat terjadi sebagai penyebab penglihatan buruk jika terlalu berlebihan. Bisa jadi bagian mata yang terlihat pada dasarnya utuh atau memiliki lesi; jika tusukan sehat, bisa jadi berupa blok air, atau penyumbatan pada tabung berongga disebabkan oleh sesuatu yang berdiri di dalam tabungnya, atau karena kekeringan, rileks, pembengkakan, atau hilang, atau gletser telah menghilang dari posisi tusukan, atau tidak cocok sebagai alat bantu visual. Sebagian besar dari ini disebabkan oleh kelembapan berlebihan atau kekeringan berlebihan, yang menumpuk pada dirinya sendiri dan larut. Kondisi ini disebut 'Alqooma' {cite:canon-ibn-sina-print-v2 hlm.215} {cite:canon-ibn-sina-print-v2 hlm.216}"
