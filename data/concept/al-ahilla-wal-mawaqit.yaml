id: concept/al-ahilla-wal-mawaqit
class: concept
kind: scientific
label:
  ar: "الأهلة والمواقيت"
  en: "The crescents and the set times (mawaqit)"
summary:
  ar: "يرى الشعراوي أن الأهلة مواقيت للناس والحج، وأن الشمس تعين اليوم والقمر يعين الشهر، وأن العبادات مرتبطة بالقمر حتى تدور في فصول السنة، وأن الزمان والمكان قد يتقدم أحدهما على الآخر في الحكم. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.806}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.810}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.811}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.812}"
  en: "Sha'rawi holds that the crescents are set times for people and for the pilgrimage, that the sun fixes the day and the moon the month, that worship is tied to the lunar months so that it turns through the seasons, and that time and place may each take precedence in a ruling {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.806}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.810}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.811}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.812}."
wings: [ideas]
themes: [sacred-time, astronomy-and-timekeeping]
periods: [period/prophetic-era]
regions: [arabia]
issue:
  ar: "لماذا جُعل الهلال معيار التوقيت في العبادات، وما الفرق بين الزمان والمكان في الميقات؟"
  en: "Why is the crescent the measure of worship's timing, and how do time and place differ in a set time?"
perspectives:
  - tradition: sunni
    id: sharawi-crescent-timing
    stance:
      ar: "الهلال مواقيت للناس والحج، والعبادات بالقمر لتدور في فصول السنة"
      en: "The crescents are set times for people and the pilgrimage; worship is timed by the moon so that it turns through the seasons"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقول الشعراوي إن الحق ربط العبادات بآيات الكون الظاهرة كالهلال، وإن الشمس للنهار والقمر للشهر، وإن الحساب بالقمر أضبط عند أهل زمانه، وإن الزمان والمكان يتعاقبان في تحديد الميقات، كرابغ ميقاتاً لأهل مصر، والصوم بالزمن في كل مكان. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.810}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.811}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.812}"
      en: "Sha'rawi says God tied worship to visible signs of creation such as the crescent, that the sun marks the day and the moon the month, that the moon is more precise for reckoning as people of his time found, and that time and place take turns in fixing a set time: Rabigh as the station for Egyptians, and the fast by time everywhere {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.810}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.811}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.812}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
  - tradition: sunni
    id: scope-note-astronomy-claims
    stance:
      ar: "أقوال الشعراوي في علم الفلك والكسوف لم تُراجع من مصدر علمي في هذه الدفعة"
      en: "Sha'rawi's astronomical statements on eclipses and the sun and moon were not checked against a scientific source in this batch"
    holders: []
    summary:
      ar: "يذكر الشعراوي تفسيراً للكسوف وأرقاماً عن حجم الشمس، وهي أقوال عامة في الكتاب لم تُعرض هنا على مصدر علمي، ولا تُعد معلومة مراجعة. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.809}"
      en: "Sha'rawi gives an account of eclipses and figures for the sun's size; these are general statements in the scan, not checked against a scientific source and not treated as verified {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.809}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
