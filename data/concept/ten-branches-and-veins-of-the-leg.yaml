summary:
  ar: "يعد ابن سينا من كل قسم من قسمي الأجوف النازل عشر شعب إلى الأرداف والعجز والرحم والمثانة والقبل والفخذ، ثم يتتبع ما يبقى إلى الركبة والساق والقدم حتى الصافن، ويختم تشريح الأعضاء المتشابهة الأجزاء {cite:canon-ibn-sina-print-v1 pp.92-93}."
  en: "From each of the two parts of the descending hollow vein Ibn Sina counts ten branches to the buttocks, sacrum, womb, bladder, pudenda and thigh, then follows what remains through knee, shank and foot to the saphenous vein, and closes the anatomy of the organs of similar parts {cite:canon-ibn-sina-print-v1 pp.92-93}."
