id: concept/ten-branches-and-veins-of-the-leg
class: concept
kind: scientific
label: { ar: "الفروع العشرة وأوردة الرجل عند ابن سينا", en: "The ten branches and the veins of the leg in the Canon", ur: "قانون میں دس شاخیں اور ٹانگ کی رگیں", es: "Las diez ramas y las venas de la pierna en el Canon", fr: "Les dix branches et les veines de la jambe dans le Canon", tr: "İbn Sina'ya göre adamın on dalı ve damarları", id: "Sepuluh Cabang dan Urat Manusia menurut Ibn Sina" }
summary:
  ar: "يعد ابن سينا من كل قسم من قسمي الأجوف النازل عشر شعب إلى الأرداف والعجز والرحم والمثانة والقبل والفخذ، ثم يتتبع ما يبقى إلى الركبة والساق والقدم حتى الصافن، ويختم تشريح الأعضاء المتشابهة الأجزاء {cite:canon-ibn-sina-print-v1 pp.92-93}."
  en: "From each of the two parts of the descending hollow vein Ibn Sina counts ten branches to the buttocks, sacrum, womb, bladder, pudenda and thigh, then follows what remains through knee, shank and foot to the saphenous vein, and closes the anatomy of the organs of similar parts {cite:canon-ibn-sina-print-v1 pp.92-93}."
  es: "Desde cada una de las dos partes de la vena hueca descendente, Ibn Sina cuenta diez ramas hacia las nalgas, el sacro, el útero, la vejiga, los genitales y el muslo, luego sigue lo que queda a través de la rodilla, la pierna y el pie hasta la vena safena, y cierra la anatomía de los órganos de partes similares {cite:canon-ibn-sina-print-v1 pp.92-93}."
  fr: "De chacune des deux parties de la veine creuse descendante, Ibn Sina compte dix branches vers les fesses, le sacrum, l'utérus, la vessie, les parties génitales et la cuisse, puis suit ce qui reste à travers le genou, la jambe et le pied jusqu'à la veine saphène, et termine l'anatomie des organes des parties similaires {cite:canon-ibn-sina-print-v1 pp.92-93}."
  ur: "اُترتی ہوئی کھوکھلی رگ کے دو حصوں میں سے ہر ایک سے ابن سینا کولہوں، سیکرم، رحم، مثانے، پڈینڈا اور ران تک دس شاخیں گنتا ہے، پھر گھٹنے، پنڈلی اور پاؤں کے ذریعے سیفینوس رگ تک جو بچ جاتا ہے اس کا پیچھا کرتا ہے، اور اسی طرح کے حصوں کے اعضاء کی اناٹومی کو بند کرتا ہے۔ صفحہ 92-93}۔"
  tr: "İbn Sina, boşluğun her iki parçasından kalça, sakrum, rahm, mesane, ön cephe ve uyluğa inen on dal sayar, ardından kalanları diz, bacak ve ayağa saphenous kısma kadar izler ve benzer parçaların anatomisini tamamlar {cite:canon-ibn-sina-print-v1 s.92-93}."
  id: "Ibn Sina menghitung dari masing-masing dua bagian rongga sepuluh cabang yang turun ke bokong, sakrum, rahim, kandung kemih, prefront, dan paha, lalu menelusuri sisa hingga lutut, kaki, dan kaki hingga bagian saféna, dan menyimpulkan anatomi bagian serupa {cite:canon-ibn-sina-print-v1 hlm.92-93}."
