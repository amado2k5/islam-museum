summary:
  ar: "ترنجبين في الكتاب طل أكثر ما يسقط بخراسان وما وراء النهر وأكثر وقوعه في بلاد المؤلف على الحاج، أجوده الطري الأبيض، معتدل إلى الحرارة، مليّن صالح للجلاء، ينفع من السعال ويليّن الصدر ويسكن العطش ويسهل الصفراء برفق وإسهاله بخاصية فيه {cite:canon-ibn-sina-print-v1 p.687}"
  en: "Taranjabin is in the book a dew that falls mostly in Khurasan and Transoxiana and falls mostly in the author's own lands on al-hajj; the best is the fresh white; moderate tending to heat, softening and good for cleansing; it benefits cough, softens the chest, calms thirst and loosens yellow bile gently, its loosening being by a property in it {cite:canon-ibn-sina-print-v1 p.687}"
  ur: "ترنجبین کتاب میں ایک اوس ہے جو زیادہ تر خراسان اور ماوراء النہر میں گرتی ہے اور مصنف کے اپنے علاقوں میں زیادہ تر الحاج پر؛ سب سے اچھا تازہ سفید ہے؛ حرارت کی طرف معتدل، نرم کرنے والا اور جلا کے لیے موزوں؛ کھانسی میں نافع ہے، سینے کو نرم کرتا ہے، پیاس کو سکون دیتا ہے اور صفرا کو نرمی سے خارج کرتا ہے، اور اس کا اسہال اس میں موجود ایک خاصیت سے ہے {cite:canon-ibn-sina-print-v1 p.687}۔"
