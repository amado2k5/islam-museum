summary:
  ar: "يحصي ابن سينا في الفصل الثالث عشرة أجناس من الدلائل يعرف بها حال المزاج: الملمس، واللحم والشحم، والشعر، ولون البدن، وهيئة الأعضاء، وسرعة الانفعال، والنوم واليقظة، والأفعال، ودفع الفضول، وأحوال قوى النفس {cite:canon-ibn-sina-print-v1 pp.158-163}."
  en: "In the third chapter Ibn Sina counts ten genera of signs by which the state of temperament is learned: touch, flesh and fat, hair, body colour, state of the organs, speed of reaction, sleep and waking, functions, expulsion of waste, and the powers of the soul {cite:canon-ibn-sina-print-v1 pp.158-163}."
