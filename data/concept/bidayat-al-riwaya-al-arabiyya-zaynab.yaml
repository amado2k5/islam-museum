label:
  ar: "بدايات الرواية العربية ورواية «زينب» سنة 1913"
  en: "The beginnings of the Arabic novel: Zaynab (1913)"
  ur: "عربی ناول کی ابتدا اور «زینب» (1913)"
  fr: "Les débuts du roman arabe : Zaynab (1913)"
  es: "Los comienzos de la novela árabe: Zaynab (1913)"
  tr: "Arap romanının ve 1913'teki 'Zeynab' romanının başlangıcı"
  id: "Awal Mula Novel Arab dan Novel 'Zainab' pada tahun 1913"
summary:
  ar: "رواية «زينب» لمحمد حسين هيكل، كُتبت في فرنسا ونُشرت سنة 1913 باسم مستعار هو «مصري فلاح»، وتُعدّ في التأريخ الأدبي أول رواية عربية فنية، كما يعرض ملخص بحثي قُدّم إلى المتحف {cite:britannica-muhammad-husayn-haykal} {cite:britannica-arabic-literature-the-short-story}."
  en: "Muhammad Husayn Haykal's Zaynab, written in France and published in 1913 under the pseudonym 'a peasant Egyptian', widely regarded in literary history as the first true Arabic novel, as a research summary supplied to the museum presents it {cite:britannica-muhammad-husayn-haykal} {cite:britannica-arabic-literature-the-short-story}."
  ur: "محمد حسین ہیکل کا ناول «زینب»، جو فرانس میں لکھا گیا اور 1913 میں «ایک مصری کسان» کے قلمی نام سے چھپا، ادبی تاریخ میں پہلا باقاعدہ عربی ناول سمجھا جاتا ہے، جیسا میوزیم کو دیا گیا تحقیقی خلاصہ پیش کرتا ہے {cite:britannica-muhammad-husayn-haykal} {cite:britannica-arabic-literature-the-short-story}۔"
  fr: "Zaynab de Muhammad Husayn Haykal, écrit en France et publié en 1913 sous le pseudonyme « un paysan égyptien », largement tenu dans l'histoire littéraire pour le premier vrai roman arabe, tel que le présente une synthèse de recherche remise au musée {cite:britannica-muhammad-husayn-haykal} {cite:britannica-arabic-literature-the-short-story}."
  es: "Zaynab de Muhammad Husayn Haykal, escrita en Francia y publicada en 1913 con el seudónimo «un campesino egipcio», considerada en la historia literaria como la primera verdadera novela árabe, tal como la presenta un resumen de investigación entregado al museo {cite:britannica-muhammad-husayn-haykal} {cite:britannica-arabic-literature-the-short-story}."
  tr: "Muhammed Hüseyin Heikal'in \"Zeynab\" adlı romanı Fransa'da yazılmış ve 1913 yılında \"Mısırlı Köylü\" takma adıyla yayımlanmıştır. Edebiyat tarihindeki ilk Arap sanat romanı olarak kabul edilir. Ayrıca müzeye sunulan bir araştırma özetini de sunar {cite:britannica-muhammad-husayn-haykal} {cite:britannica-arabic-literature-the-short-story}."
  id: "Novel \"Zainab\" karya Muhammad Hussein Heikal ditulis di Prancis dan diterbitkan pada tahun 1913 dengan nama samaran \"Petani Mesir.\" Novel ini dianggap sebagai novel seni Arab pertama dalam sejarah sastra. Novel ini juga menyajikan ringkasan penelitian yang diserahkan ke museum {cite:britannica-muhammad-husayn-haykal} {cite:britannica-arabic-literature-the-short-story}."
