summary:
  ar: "الزراوند ثلاثة أصناف: المدحرج والطويل والطيّب، وكلها حارة يابسة، وفيها جلاء وتفتيح وتلطيف، وتُذكر لها منافع للجراح والمفاصل والرأس والصدر والغذاء، ويُذكر أنها تُخرج الشوك والسلى وتقع في فصل النفساء بقول مُعلَّم."
  en: "Zarawand has three kinds: the rounded (madahraj), the long (tawil) and the fragrant (tayyib). All are hot and dry, cleansing, opening and thinning; the book lists uses for wounds, joints, the head, the chest and digestion, and labels the claims on thorns, the afterbirth and the womb as the book's own listings for the founder's ruling."
  ur: "زراوند کی تین قسمیں ہیں: مدحرج، طویل اور طیب۔ تینوں گرم اور خشک ہیں، صاف کرنے، کھولنے اور باریک کرنے والی ہیں؛ کتاب زخموں، جوڑوں، سر، سینے اور ہضم کے فوائد درج کرتی ہے، اور کانٹوں، ⁦(مابعد ولادت جھلی)⁩ اور رحم کے دعوؤں کو مُعلَّم فہرست کے طور پر بانیِ ادارہ کے فیصلے کے لیے درج کرتی ہے۔"
