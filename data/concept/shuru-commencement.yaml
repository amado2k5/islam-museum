id: concept/shuru-commencement
class: concept
kind: legal
label:
  ar: "الشُّرُوع"
  en: "Shuru' (commencing an act and its binding effect in worship and contracts)"
  es: "Shuru' (el inicio de un acto y su efecto vinculante en el culto y los contratos)"
  fr: "Shuru' (commencer un acte et son effet contraignant dans le culte et les contrats)"
  ur: "شورو ⁦(کسی عمل کا آغاز اور عبادات اور معاہدوں میں اس کا پابند اثر)⁩"
summary:
  ar: "الشروع لغة الأخذ في الأمر والدخول فيه، واصطلاحا يتحقق في العبادات بالفعل مقرونا بالنية، وفي المعاملات بالقول أو ما يقوم مقامه، وفي الجنايات بالفعل. وما فرضه الله على المكلف يجب إتمامه بعد الشروع إلا لضرورة، والنفل يختلف الفقهاء في لزوم إتمامه، والمعاملات كالبيع والوقف والعارية تتم بالإيجاب والقبول، وتختلف الأحكام في الهبة والوقف بين الجمهور وأبي حنيفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10064} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10065} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10066} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10068}"
  en: "Shuru' in language is taking up an act and entering it. In law it is made in worship by the act joined to intention, in contracts by words or what stands in their place, and in crimes and prescribed penalties by the act alone. A duty imposed by God must be completed once begun unless necessity prevents it; the jurists differ on whether a voluntary act must be completed. Sale, endowment and loan are completed by offer and acceptance, and the jurists differ on whether a gift or an endowment binds on its own. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10064} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10065} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10066} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10068}"
  es: "Shuru' en el lenguaje significa tomar un acto y completarlo. En derecho, se realiza en el culto mediante el acto unido a la intención, en los contratos mediante las palabras o lo que las sustituye, y en los delitos y penas prescritas mediante el acto mismo. Un deber impuesto por Dios debe completarse una vez iniciado, a menos que la necesidad lo impida; los juristas difieren sobre si un acto voluntario debe completarse. La venta, la donación y el préstamo se completan mediante la oferta y la aceptación, y los juristas difieren sobre si un regalo o una donación es vinculante por sí mismo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10064} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10065} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10066} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10068}"
  fr: "En langage, le terme « shuru » désigne l'engagement dans un acte. En droit, il s'applique au culte par l'acte accompagné d'une intention, aux contrats par les mots ou ce qui les remplace, et aux crimes et peines prescrites par l'acte seul. Un devoir imposé par Dieu doit être accompli une fois commencé, sauf nécessité contraire; les juristes divergent quant à l'obligation d'achever un acte volontaire. La vente, la dot et le prêt sont conclus par l'offre et l'acceptation, et les juristes divergent quant au caractère contraignant d'un don ou d'une dot. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10064} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10065} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10066} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10068}"
  ur: "زبان میں شورو ایک عمل اٹھانا اور اس میں داخل ہونا ہے۔ قانون میں یہ عبادت میں نیت کے ساتھ جڑے ہوئے عمل سے، الفاظ کے ذریعے معاہدے یا جو اپنی جگہ کھڑا ہے، اور صرف ایکٹ کے ذریعے جرائم اور مقررہ سزاؤں میں بنایا جاتا ہے۔ خدا کی طرف سے عائد کردہ ایک فرض کو ایک بار شروع کرنے کے بعد مکمل کیا جانا چاہئے جب تک کہ ضرورت اسے روک نہ دے؛ فقہا کا اس بارے میں اختلاف ہے کہ آیا رضاکارانہ عمل کو مکمل کرنا ضروری ہے۔ فروخت، وقف اور قرض پیش کش اور قبولیت سے مکمل ہوتے ہیں، اور فقہاء کا اس بات پر اختلاف ہے کہ تحفہ یا وقف خود ہی پابند ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10064} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10065} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10066} صفحہ 10068}"
