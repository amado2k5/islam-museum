id: concept/shuru-commencement
class: concept
kind: legal
label:
  ar: "الشُّرُوع"
  en: "Shuru' (commencing an act and its binding effect in worship and contracts)"
summary:
  ar: "الشروع لغة الأخذ في الأمر والدخول فيه، واصطلاحا يتحقق في العبادات بالفعل مقرونا بالنية، وفي المعاملات بالقول أو ما يقوم مقامه، وفي الجنايات بالفعل. وما فرضه الله على المكلف يجب إتمامه بعد الشروع إلا لضرورة، والنفل يختلف الفقهاء في لزوم إتمامه، والمعاملات كالبيع والوقف والعارية تتم بالإيجاب والقبول، وتختلف الأحكام في الهبة والوقف بين الجمهور وأبي حنيفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10064} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10065} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10066} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10068}"
  en: "Shuru' in language is taking up an act and entering it. In law it is made in worship by the act joined to intention, in contracts by words or what stands in their place, and in crimes and prescribed penalties by the act alone. A duty imposed by God must be completed once begun unless necessity prevents it; the jurists differ on whether a voluntary act must be completed. Sale, endowment and loan are completed by offer and acceptance, and the jurists differ on whether a gift or an endowment binds on its own. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10064} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10065} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10066} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10068}"
