id: "concept/alamat-al-kazaz"
class: "concept"
kind: "scientific"
label:
  ar: "علامات الكزاز والتمدد"
  en: "Signs of tetanus and extension"
  fr: "Les signes du tétanos et de l’extension"
  ur: "كزاز اور تمدد کی علامات"
summary:
  ar: "علامات التمدد مطلقاً ألا يجيب العضو إلى الانقباض؛ والكزاز إن كان إلى قدام فالشخص كالمخنوق مختنق الوجه والعين وربما خيل أنه يضحك ورأسه منجذب إلى قدام ولا يستطيع الالتفات، وإن كان إلى خلف وجدت الرأس والكتفين والعضلة منجذبة إلى خلف {cite:canon-ibn-sina-print-v2 p.153}"
  en: "The signs of extension absolutely are that the organ does not answer to contraction; forward tetanus shows the man as though strangled, face and eye suffused, perhaps seeming to smile, his head drawn forward unable to turn; backward tetanus shows head, shoulders and muscle drawn backward {cite:canon-ibn-sina-print-v2 p.153}"
  fr: "Les signes de l’extension absolue sont que l’organe ne répond pas à la contraction ; le tétanos antérieur montre l’homme comme s’il était étranglé, le visage et l’œil injectés, semblant parfois sourire, la tête tirée vers l’avant, incapable de se retourner ; le tétanos postérieur montre la tête, les épaules et le muscle tirés vers l’arrière {cite:canon-ibn-sina-print-v2 p.153}"
  ur: "تمدد کی مطلق علامتیں یہ ہیں کہ عضو انقباض پر جواب نہ دے؛ اور اگر کزاز آگے کی طرف ہو تو شخص ایسا ہوتا ہے جیسا گلا گھوٹا گیا ہو، چہرہ اور آنکھ اختناق میں، اور شاید ایسا خیال ہو جیسے وہ ہنس رہا ہے، اور اس کا سر آگے کی طرف کھچا ہو اور وہ مڑ نہیں سکتا؛ اور اگر پیچھے کی طرف ہو تو سر، کندھے اور عضلہ پیچھے کی طرف کھچے پائے جاتے ہیں {cite:canon-ibn-sina-print-v2 p.153}۔"
