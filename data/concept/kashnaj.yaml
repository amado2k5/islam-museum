summary:
  ar: "الكشنج شيء من جنس الكمأة والفطر لذيذ جداً يكثر فيما وراء النهر وخراسان، بارد دون برد الكمأة، غليظ مطفئ {cite:canon-ibn-sina-print-v1 p.528}."
  en: "Kashnaj is something of the truffle and mushroom kind, very tasty, common in Transoxiana and Khurasan; cold, but less than other truffles, thick and quenching {cite:canon-ibn-sina-print-v1 p.528}."
  ur: "کشنج کمأۃ اور کھمبی کی جنس کی ایک چیز ہے، نہایت لذیذ، ماوراء النہر اور خراسان میں بہت ملتی ہے؛ ٹھنڈی ہے مگر دوسری کمأۃ سے کم، گاڑھی اور بجھانے والی {cite:canon-ibn-sina-print-v1 p.528}۔"
  es: "Kashnaj es algo parecido a las trufas y los hongos, muy sabroso, común en Transoxiana y Jorasán; frío, pero menos que otras trufas, denso y refrescante {cite:canon-ibn-sina-print-v1 p.528}."
  fr: "Le kashnaj est une sorte de truffe et de champignon, très savoureux, courant en Transoxiane et au Khorasan; froid, mais moins que les autres truffes, épais et désaltérant {cite:canon-ibn-sina-print-v1 p.528}."
