id: concept/niran-al-arab
class: concept
kind: social
label: { ar: "نيران العرب", en: "The fires of the Arabs", ur: "عربوں کی آگیں", es: "Los fuegos de los árabes", fr: "Les feux des Arabes", tr: "Arap ateşleri", id: "Kebakaran Arab" }
summary:
  ar: "النيران التي يعدّدها الجاحظ في كتاب الحيوان مما كانت العرب توقده أو تذكره: نار الاستمطار في الجاهلية، ونار الحلف، ونار المسافر الذي لا يحبون رجوعه، ونار الإنذار، ونار الحرتين، ونار الغيلان، ونار الصيد، ونار التهويل على الأسد، ونار الوسم، ونار القرى، ونار الحرب على المجاز، مع نيران ذكرها القرآن كنار القربان ونار موسى ونار إبراهيم {cite:hayawan-jahiz-ilmiyya-2003-v2 p. 488} {cite:hayawan-jahiz-ilmiyya-2003-v2 p. 492} {cite:hayawan-jahiz-ilmiyya-2003-v2 p. 504} {cite:hayawan-jahiz-ilmiyya-2003-v3 p. 73}."
  en: "The fires al-Jahiz lists in Kitab al-Hayawan as kindled or spoken of by the Arabs: the pre-Islamic rain-seeking fire, the fire of alliance, the fire lit behind an unwanted traveller, the warning fire, the fire of the two lava fields, the ghouls' fire, the hunting fire, the fire to scare lions, the branding fire, the fire of hospitality and, figuratively, the fire of war, beside fires named in the Qur'an such as the fire of the offering and the fires of Moses and Abraham {cite:hayawan-jahiz-ilmiyya-2003-v2 p. 488} {cite:hayawan-jahiz-ilmiyya-2003-v2 p. 492} {cite:hayawan-jahiz-ilmiyya-2003-v2 p. 504} {cite:hayawan-jahiz-ilmiyya-2003-v3 p. 73}."
  ur: "وہ آگیں جو جاحظ کتاب الحیوان میں گناتے ہیں جنہیں عرب جلاتے یا جن کا ذکر کرتے تھے: جاہلیت میں بارش مانگنے کی آگ، حلف کی آگ، ناپسندیدہ مسافر کے پیچھے جلائی جانے والی آگ، انتباہ کی آگ، حرّتین کی آگ، غیلان کی آگ، شکار کی آگ، شیر ڈرانے کی آگ، داغنے کی آگ، مہمان نوازی کی آگ اور مجازاً جنگ کی آگ، اور قرآن میں مذکور آگیں جیسے قربانی کی آگ اور موسیٰ و ابراہیم کی آگ {cite:hayawan-jahiz-ilmiyya-2003-v2 p. 488} {cite:hayawan-jahiz-ilmiyya-2003-v2 p. 492} {cite:hayawan-jahiz-ilmiyya-2003-v2 p. 504} {cite:hayawan-jahiz-ilmiyya-2003-v3 p. 73}۔"
  es: "Los fuegos que al-Jahiz enumera en Kitab al-Hayawan como encendidos o mencionados por los árabes: el fuego preislámico para buscar la lluvia, el fuego de la alianza, el fuego encendido detrás de un viajero no deseado, el fuego de advertencia, el fuego de los dos campos de lava, el fuego de los ghouls, el fuego de caza, el fuego para asustar a los leones, el fuego de marcar, el fuego de la hospitalidad y, figurativamente, el fuego de la guerra, además de los fuegos nombrados en el Corán como el fuego de la ofrenda y los fuegos de Moisés y Abraham {cite:hayawan-jahiz-ilmiyya-2003-v2 p. 488} {cite:hayawan-jahiz-ilmiyya-2003-v2 p. 492} {cite:hayawan-jahiz-ilmiyya-2003-v2 p. 504} {cita:hayawan-jahiz-ilmiyya-2003-v3 p. 73}."
  fr: "Les feux mentionnés par al-Jahiz dans son Kitab al-Hayawan comme ayant été allumés ou évoqués par les Arabes sont: le feu préislamique pour invoquer la pluie, le feu d’alliance, le feu allumé derrière un voyageur indésirable, le feu d’avertissement, le feu des deux champs de lave, le feu des goules, le feu de chasse, le feu pour effrayer les lions, le feu du marquage, le feu de l’hospitalité et, au sens figuré, le feu de la guerre, outre les feux cités dans le Coran tels que le feu de l’offrande et les feux de Moïse et d’Abraham {cite:hayawan-jahiz-ilmiyya-2003-v2 p. 488} {cite:hayawan-jahiz-ilmiyya-2003-v2 p. 492} {cite:hayawan-jahiz-ilmiyya-2003-v2 p. 504} {cite:hayawan-jahiz-ilmiyya-2003-v3 p. 73}."
  tr: "Hayvanlar Kitabı'nda Al-Jahiz'in listelediği ve Arapların yakmak veya hatırlamak için kullandığı ateşler: İslam öncesi dönemde yağmur ateşi, ittifak ateşi, dönmeyi sevmeyen yolcunun ateşi, uyarı ateşi, iki özgür insanın ateşi, vahşi ateş, av ateşi, aslana karşı korkutma ateşi, damgalama ateşi, köylerin ateşi, savaş ateşi mecazi anlamda; Kur'an'da bahsedilen kurban ateşi, Musa'nın ateşi ve İbrahim'in ateşi {cite:hayawan-jahiz-ilmiyya-2003-v2 s. 488} {cite:hayawan-jahiz-ilmiyya-2003-v2 s. 73}."
  id: "Api yang disebutkan oleh Al-Jahiz dalam Kitab Binatang, yang digunakan orang Arab untuk menyalakan atau mengenang: api hujan di era pra-Islam, api aliansi, api pengembara yang tidak suka kembali, api peringatan, api dua orang merdeka, api liar, api berburu, api intimidasi terhadap singa, api penandaan, api desa, api perang secara metaforis, bersama dengan api yang disebutkan dalam Al-Qur'an seperti api pengorbanan, api Musa, dan api Abraham {cite:hayawan-jahiz-ilmiyya-2003-v2 hlm. 488} {cite:hayawan-jahiz-ilmiyya-2003-v2 hlm. 73} {cite:hayawan-jahiz-ilmiyya-2003-v2 hlm. 73}."
