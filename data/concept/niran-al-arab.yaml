id: concept/niran-al-arab
class: concept
kind: social
label: { ar: "نيران العرب", en: "The fires of the Arabs", ur: "عربوں کی آگیں" }
summary:
  ar: "النيران التي يعدّدها الجاحظ في كتاب الحيوان مما كانت العرب توقده أو تذكره: نار الاستمطار في الجاهلية، ونار الحلف، ونار المسافر الذي لا يحبون رجوعه، ونار الإنذار، ونار الحرتين، ونار الغيلان، ونار الصيد، ونار التهويل على الأسد، ونار الوسم، ونار القرى، ونار الحرب على المجاز، مع نيران ذكرها القرآن كنار القربان ونار موسى ونار إبراهيم {cite:hayawan-jahiz-ilmiyya-2003-v2 p. 488} {cite:hayawan-jahiz-ilmiyya-2003-v2 p. 492} {cite:hayawan-jahiz-ilmiyya-2003-v2 p. 504} {cite:hayawan-jahiz-ilmiyya-2003-v3 p. 73}."
  en: "The fires al-Jahiz lists in Kitab al-Hayawan as kindled or spoken of by the Arabs: the pre-Islamic rain-seeking fire, the fire of alliance, the fire lit behind an unwanted traveller, the warning fire, the fire of the two lava fields, the ghouls' fire, the hunting fire, the fire to scare lions, the branding fire, the fire of hospitality and, figuratively, the fire of war, beside fires named in the Qur'an such as the fire of the offering and the fires of Moses and Abraham {cite:hayawan-jahiz-ilmiyya-2003-v2 p. 488} {cite:hayawan-jahiz-ilmiyya-2003-v2 p. 492} {cite:hayawan-jahiz-ilmiyya-2003-v2 p. 504} {cite:hayawan-jahiz-ilmiyya-2003-v3 p. 73}."
  ur: "وہ آگیں جو جاحظ کتاب الحیوان میں گناتے ہیں جنہیں عرب جلاتے یا جن کا ذکر کرتے تھے: جاہلیت میں بارش مانگنے کی آگ، حلف کی آگ، ناپسندیدہ مسافر کے پیچھے جلائی جانے والی آگ، انتباہ کی آگ، حرّتین کی آگ، غیلان کی آگ، شکار کی آگ، شیر ڈرانے کی آگ، داغنے کی آگ، مہمان نوازی کی آگ اور مجازاً جنگ کی آگ، اور قرآن میں مذکور آگیں جیسے قربانی کی آگ اور موسیٰ و ابراہیم کی آگ {cite:hayawan-jahiz-ilmiyya-2003-v2 p. 488} {cite:hayawan-jahiz-ilmiyya-2003-v2 p. 492} {cite:hayawan-jahiz-ilmiyya-2003-v2 p. 504} {cite:hayawan-jahiz-ilmiyya-2003-v3 p. 73}۔"
