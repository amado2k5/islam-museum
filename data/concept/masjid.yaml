label:
  ar: "المسجد"
  en: "Mosque (masjid)"
  ur: "مسجد"
summary:
  ar: "يروي الشيخ حديثاً معناه أن الله إذا أراد العذاب بأهل الأرض نظر إلى عُمّار المساجد فرفع العذاب عنهم (needs_source) {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep01 00:00:30}. ويقارن بين حال المؤمن في المسجد وحال المنافق فيه {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep01 00:00:30}."
  en: "The Sheikh relates a hadith to the effect that when God wills punishment for the people of the earth, He looks to those who build and frequent the mosques and lifts the punishment from them (needs_source) {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep01 00:00:30}. He contrasts the condition of the believer in the mosque with that of the hypocrite in it {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep01 00:00:30}."
  ur: "شیخ ایک حدیث بیان کرتے ہیں جس کا مفہوم ہے کہ اللہ جب اہلِ زمین پر عذاب کا ارادہ کرتا ہے تو مسجدیں آباد کرنے والوں کی طرف دیکھ کر ان سے عذاب ہٹا دیتا ہے (needs_source) {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep01 00:00:30}۔ وہ مسجد میں مومن کی حالت اور مسجد میں منافق کی حالت کا فرق بیان کرتے ہیں {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep01 00:00:30}۔"
