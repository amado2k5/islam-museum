label:
  ar: علم آخر الزمان
  en: Islamic eschatology
  fr: "Eschatologie islamique"
  ur: علم آخر الزمان
  es: "escatología islámica"
summary:
  ar: "علم آخر الزمان في العقيدة الإسلامية ما يتعلق بالموت وأشراط الساعة والبعث والحساب والجزاء؛ تفرد الطحاوية وشرحها بابا في الإيمان بأشراط الساعة وتقرر أن الناس أفردوا أحاديثها في مصنفات مشهورة {cite:aqida-tahawiyya} {cite:sharh-tahawiyya-ibn-abi-al-izz}."
  en: "Islamic eschatology is the part of the creed concerned with death, the signs of the Hour, resurrection, reckoning and recompense; the Tahawiyya and its Sharh devote a chapter to belief in the signs of the Hour, noting that scholars devoted whole works to its hadiths {cite:aqida-tahawiyya} {cite:sharh-tahawiyya-ibn-abi-al-izz}."
  fr: "L’eschatologie islamique est la partie de la profession de foi consacrée à la mort, aux signes de l’Heure, à la résurrection, au jugement et à la rétribution ; la Tahawiyya et son Sharh consacrent un chapitre à la croyance aux signes de l’Heure, en notant que des savants ont consacré des ouvrages entiers à ses hadiths {cite:aqida-tahawiyya} {cite:sharh-tahawiyya-ibn-abi-al-izz}."
  es: "La escatología islámica es la parte del credo que se ocupa de la muerte, los signos de la Hora, la resurrección, el juicio y la retribución; la Tahawiyya y su Sharh dedican un capítulo a la creencia en los signos de la Hora, señalando que los eruditos dedicaron obras enteras a sus hadices {cite:aqida-tahawiyya} {cite:sharh-tahawiyya-ibn-abi-al-izz}."
