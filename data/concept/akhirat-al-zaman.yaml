summary:
  ar: "علم آخر الزمان في العقيدة الإسلامية ما يتعلق بالموت وأشراط الساعة والبعث والحساب والجزاء؛ تفرد الطحاوية وشرحها بابا في الإيمان بأشراط الساعة وتقرر أن الناس أفردوا أحاديثها في مصنفات مشهورة {cite:aqida-tahawiyya} {cite:sharh-tahawiyya-ibn-abi-al-izz}."
  en: "Islamic eschatology is the part of the creed concerned with death, the signs of the Hour, resurrection, reckoning and recompense; the Tahawiyya and its Sharh devote a chapter to belief in the signs of the Hour, noting that scholars devoted whole works to its hadiths {cite:aqida-tahawiyya} {cite:sharh-tahawiyya-ibn-abi-al-izz}."
