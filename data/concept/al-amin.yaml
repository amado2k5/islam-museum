label: { ar: "الأمين ⁦(لقب النبي قبل البعثة)⁩", en: "al-Amin, the Trustworthy (the Prophet's title before his mission)", fr: "al-Amin, le Digne de confiance (titre du Prophète avant sa mission)", es: "al-Amin, el Confiable (título del Profeta antes de su misión)", ur: "الامین، امانت دار ⁦(اپنے مشن سے پہلے نبی کا لقب)⁩" }
summary:
  ar: "اللقب الذي سمّت به قريش محمداً قبل النبوة لما جمع فيه من الخصال المرضية والأمانة؛ وبه هتفوا حين دخل عليهم حَكَماً في وضع الحجر الأسود عند بناء الكعبة."
  en: "The title by which Quraysh called Muhammad before prophethood for the trustworthiness and good qualities they saw in him; they cried it out when he entered as arbiter over the Black Stone during the rebuilding of the Kaaba."
  fr: "Le titre par lequel Quraysh appelait Muhammad avant la prophétie, en raison de la probité et des bonnes qualités qu’ils voyaient en lui ; ils le crièrent lorsqu’il entra pour arbitrer au sujet de la Pierre noire lors de la reconstruction de la Kaaba."
  es: "El título con el que los Quraysh llamaban a Mahoma antes de su profecía, debido a la confiabilidad y las buenas cualidades que veían en él; lo gritaron cuando entró como árbitro de la Piedra Negra durante la reconstrucción de la Kaaba."
  ur: "وہ لقب جس سے قریش نے نبوت سے پہلے محمد کو امانت اور اچھی صفات کی وجہ سے پکارا تھا۔ جب وہ خانہ کعبہ کی تعمیر نو کے دوران حجر اسود پر ثالث کے طور پر داخل ہوئے تو انہوں نے اسے پکارا۔"
