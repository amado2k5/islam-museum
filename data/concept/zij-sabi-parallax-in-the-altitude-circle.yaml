label: { ar: "اختلاف منظر القمر في دائرة الارتفاع", en: "The Moon's parallax in the altitude circle", ur: "دائرۂ ارتفاع میں چاند کا اختلافِ منظر", es: "La paralaje de la Luna en el círculo de altitud", fr: "La parallaxe de la Lune dans le cercle d'altitude" }
summary:
  ar: "لمعرفة اختلاف منظر القمر في دائرة الارتفاع يُؤخذ ارتفاع القمر في الوقت المطلوب، ثم يُعرف بُعده عن سمت الرأس، ويُحسب بالأوتار ما ينقص الارتفاع من تسعين، فيخرج اختلاف المنظر بالدقائق على الدائرة. {cite:zij-sabi-nallino-byblion p.118}."
  en: "To find the Moon's parallax in the altitude circle, one takes the Moon's altitude at the time sought and its distance from the zenith, and by chords computes how much the altitude falls short of ninety degrees. The parallax then comes out in minutes on that circle. {cite:zij-sabi-nallino-byblion p.118}."
  ur: "چاند کے دائرۂ ارتفاع میں اختلافِ منظر کے لیے مطلوبہ وقت پر چاند کا ارتفاع لیا جاتا ہے، پھر سمتِ راس سے اس کا فاصلہ معلوم ہوتا ہے، اور اوتار سے حساب ہوتا ہے کہ ارتفاع نوے درجے سے کتنا کم ہے، تو دائرے پر اختلافِ منظر دقائق میں نکلتا ہے۔ {cite:zij-sabi-nallino-byblion p.118}۔"
  es: "Para hallar la paralaje de la Luna en el círculo de altitud, se toma la altitud de la Luna en el momento buscado y su distancia al cenit, y mediante cuerdas se calcula cuánto se desvía la altitud de los noventa grados. La paralaje se obtiene entonces en minutos en ese círculo. {cite:zij-sabi-nallino-byblion p.118}."
  fr: "Pour déterminer la parallaxe de la Lune sur le cercle de hauteur, on prend en compte la hauteur de la Lune à l'instant recherché et sa distance au zénith, puis on calcule, à l'aide des cordes, de combien la hauteur s'écarte de 90 degrés. La parallaxe est alors exprimée en minutes sur ce cercle. {cite:zij-sabi-nallino-byblion p.118}."
