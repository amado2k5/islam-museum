id: concept/hisab-tark-al-sayyia
class: concept
kind: doctrine
label:
  ar: "ترك السيئة بعد الهمّ بها: حسنة كاملة"
  en: "A bad deed intended and then left: one full good deed"
  ur: "برائی کا ارادہ کر کے چھوڑ دینا: ایک پوری نیکی"
summary:
  ar: "من همّ بسيئة فلم يعملها كتبها الله عنده حسنة كاملة [[passage/muslim-0131]]، وفي رواية أبي هريرة أن ما يحدّث به العبد نفسه من سيئة يُغفر له ما لم يعمله [[passage/muslim-0129]]. فالسيئة المتروكة لا تبقى صفرا في الحساب، بل تنقلب إلى خانة الحسنات."
  en: "Whoever intends a bad deed and does not do it, God writes it with Him as one full good deed [[passage/muslim-0131]]; in Abu Hurayra's narration, a bad deed a servant only speaks of within himself is forgiven him so long as he does not do it [[passage/muslim-0129]]. A bad deed left behind does not stay at zero in the account: it moves to the column of good deeds."
  ur: "جو برائی کا ارادہ کرے اور اسے نہ کرے، اللہ اسے اپنے ہاں ایک پوری نیکی لکھتا ہے [[passage/muslim-0131]]، اور ابو ہریرہ کی روایت میں ہے کہ بندہ جس برائی کی صرف دل میں بات کرے وہ اسے معاف ہے جب تک اسے نہ کرے [[passage/muslim-0129]]۔ چھوڑی ہوئی برائی حساب میں صفر نہیں رہتی بلکہ نیکیوں کے خانے میں چلی جاتی ہے۔"
