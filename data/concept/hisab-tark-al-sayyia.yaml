id: concept/hisab-tark-al-sayyia
class: concept
kind: doctrine
label:
  ar: "ترك السيئة بعد الهمّ بها: حسنة كاملة"
  en: "A bad deed intended and then left: one full good deed"
  ur: "برائی کا ارادہ کر کے چھوڑ دینا: ایک پوری نیکی"
  es: "Una mala acción planeada y luego abandonada: una buena acción completa"
  fr: "Une mauvaise action intentionnelle puis abandonnée: une bonne action complète"
  tr: "Kötü bir eylemi endişelendikten sonra bırakmak: tamamen iyi bir eylem"
  id: "Meninggalkan perbuatan buruk setelah khawatir: perbuatan baik yang lengkap"
summary:
  ar: "من همّ بسيئة فلم يعملها كتبها الله عنده حسنة كاملة [[passage/muslim-0131]]، وفي رواية أبي هريرة أن ما يحدّث به العبد نفسه من سيئة يُغفر له ما لم يعمله [[passage/muslim-0129]]. فالسيئة المتروكة لا تبقى صفرا في الحساب، بل تنقلب إلى خانة الحسنات."
  en: "Whoever intends a bad deed and does not do it, God writes it with Him as one full good deed [[passage/muslim-0131]]; in Abu Hurayra's narration, a bad deed a servant only speaks of within himself is forgiven him so long as he does not do it [[passage/muslim-0129]]. A bad deed left behind does not stay at zero in the account: it moves to the column of good deeds."
  ur: "جو برائی کا ارادہ کرے اور اسے نہ کرے، اللہ اسے اپنے ہاں ایک پوری نیکی لکھتا ہے [[passage/muslim-0131]]، اور ابو ہریرہ کی روایت میں ہے کہ بندہ جس برائی کی صرف دل میں بات کرے وہ اسے معاف ہے جب تک اسے نہ کرے [[passage/muslim-0129]]۔ چھوڑی ہوئی برائی حساب میں صفر نہیں رہتی بلکہ نیکیوں کے خانے میں چلی جاتی ہے۔"
  es: "Quien tiene la intención de hacer una mala acción y no la lleva a cabo, Dios la registra con Él como una buena acción completa [[passage/muslim-0131]]; en la narración de Abu Hurayra, una mala acción de la que un siervo solo habla en su interior le es perdonada siempre que no la realice [[passage/muslim-0129]]. Una mala acción que queda pendiente no se queda en cero en la cuenta: pasa a la columna de las buenas acciones."
  fr: "Quiconque projette une mauvaise action et ne la commet pas, Dieu l'inscrit à Son compte comme une bonne action complète [[passage/muslim-0131]]. Selon le récit d'Abu Hurayra, une mauvaise action dont un serviteur parle seulement en lui-même lui est pardonnée tant qu'il ne la commet pas [[passage/muslim-0129]]. Une mauvaise action non commise ne reste pas à zéro dans le compte: elle est portée au passif des bonnes actions."
  tr: "Günah işleyip yapmayan Allah bunu onunla birlikte tam bir iyilik olarak kaydeder [[passage/muslim-0131]]. Ebu Huraira'nın rivayetinde, bir hizmetlinin günaha yaptığı şey, yapmadığı şey için affedilir [[passage/muslim-0129]]. Terk edilen kötülük hesapta sıfır olarak kalmaz, aksine iyi işler kategorisine girer."
  id: "Siapa pun yang berbuat dosa tetapi tidak melakukannya, Allah akan mencatatnya sebagai perbuatan baik sepenuhnya bersamanya [[ayat/muslim-0131]]. Dalam riwayat Abu Huraira, apa yang dilakukan seorang hamba atas dosa diampuni atas apa yang tidak dilakukannya [[ayat/muslim-0129]]. Kejahatan yang ditinggalkan tidak tetap nol dalam perhitungan, melainkan berubah menjadi kategori perbuatan baik."
