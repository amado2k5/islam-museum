id: concept/ant-in-hadith
class: concept
kind: legal
label:
  ar: "النملة في الحديث"
  en: "The ant in the hadith"
  ur: "حدیث میں چیونٹی"
summary:
  ar: "نهى النبي، في رواية أبي داود بإسناد عن ابن عباس، عن قتل أربعة من الدواب: النملة والنحلة والهدهد والصرد {cite:sunan-abi-dawud}. وقد نقل الفقهاء هذا النهي في باب الصيد والذبائح، وناقشوا هل علته الاحترام أو مجرد النهي عن قتل ما لا يؤذي. والنملة في القرآن مذكورة في سورة النمل حين ذكرت قرية النمل مع سليمان، وهذا ذكر قرآني لا يُروى منه خبر تاريخي مؤرخ هنا [[passage/quran-27-18|سورة النمل، الآية 18]]."
  en: "The Prophet forbade killing four kinds of creatures, the ant, the bee, the hoopoe and the shrike, according to a report in Abu Dawud from Ibn Abbas, with a sound chain as the jurists describe it {cite:sunan-abi-dawud}. Jurists cite this prohibition in the chapters on hunting and slaughter, and they debate whether its reason is respect for the creature or simply the prohibition of killing what does no harm. The ant appears in the Quran in Surat al-Naml, where the valley of the ants is mentioned with Solomon, a passage recorded here by reference only [[passage/quran-27-18|Surat al-Naml, verse 18]]."
  ur: "نبی نے چار جانوروں کے قتل سے منع فرمایا: چیونٹی، شہد کی مکھی، ہدہد اور صرد، ابوداؤد کی روایت میں ابن عباس سے {cite:sunan-abi-dawud}۔ فقہاء اس ممانعت کو شکار اور ذبح کے ابواب میں ذکر کرتے ہیں اور بحث کرتے ہیں کہ اس کی علت احترام ہے یا محض وہ جانور جو نقصان نہیں دیتا اسے مارنے کی ممانعت۔ چیونٹی کا ذکر قرآن میں سورۃ النمل میں ہے جہاں سلیمان کے ساتھ چیونٹیوں کی وادی کا ذکر آتا ہے [[passage/quran-27-18|سورۃ النمل، آیت 18]]۔"
