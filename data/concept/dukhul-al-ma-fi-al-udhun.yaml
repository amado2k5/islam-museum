id: "concept/dukhul-al-ma-fi-al-udhun"
class: "concept"
kind: "scientific"
label:
  ar: "دخول الماء في الأذن"
  en: "Water entering the ear"
  ur: "کان میں پانی کا داخل ہونا"
summary:
  ar: "قد يدخل الماء في الأذن إذا لم يصبها المستحم والمغتسل فيؤذي ويورم أصل الأذنين ويوجع وجعاً شديداً؛ ومما ينفع أن يمتص بأنبوبة امتصاصاً يجذبه دفعة، وربما أخرجه السعال والعطاس، وقد يستخرج بما يعرف من الآلات، وربما أغنى في القليل صب الأدهان في الأذن وصب الألبان الفاترة مراراً متتابعة ⁦⁦(أسماء الأدوية والضمادات لا تحمل، وسطر لبن النساء سطر موسوم مطروح لحكم المؤسس)⁩⁩ {cite:canon-ibn-sina-print-v2 p.230} {cite:canon-ibn-sina-print-v2 p.231}"
  en: "Water may enter the ear if the bather and washer do not protect it; it hurts, swells the ears' roots and gives severe pain. What helps: drawing it out with a tube in one pull; cough and sneeze may expel it; it may be drawn out with the known instruments; for a little of it, pouring oils in the ear and warm milks several times running may suffice ⁦(drug and dressing names are not carried; the woman's-milk line is a labelled listing for the founder's ruling)⁩ {cite:canon-ibn-sina-print-v2 p.230} {cite:canon-ibn-sina-print-v2 p.231}"
  ur: "اگر نہانے اور دھونے والے کان کی حفاظت نہ کریں تو پانی کان میں داخل ہو سکتا ہے؛ وہ تکلیف دیتا ہے، کانوں کی جڑ سوجا دیتا ہے اور سخت درد کرتا ہے؛ نفع دیتا ہے کہ نلی سے ایک بار میں چوم کر نکالا جائے؛ کھانسی اور چھینک بھی اسے نکال سکتی ہے؛ اور معروف آلات سے بھی نکالا جا سکتا ہے؛ اور تھوڑے میں کان میں تیل ڈالنا اور گرم دودھ کئی بار لگاتار ڈالنا کافی ہو سکتا ہے ⁦⁦(ادویہ اور پٹیوں کے نام منقول نہیں؛ عورتوں کے دودھ کی سطر بانی کے فیصلے کے لیے موسوم فہرست ہے)⁩⁩ {cite:canon-ibn-sina-print-v2 p.230} {cite:canon-ibn-sina-print-v2 p.231}"
