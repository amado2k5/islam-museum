id: "concept/dukhul-al-ma-fi-al-udhun"
class: "concept"
kind: "scientific"
label:
  ar: "دخول الماء في الأذن"
  en: "Water entering the ear"
  ur: "کان میں پانی کا داخل ہونا"
  es: "El agua entra en el oído"
  fr: "De l'eau qui entre dans l'oreille"
  tr: "Kulağa giren su"
  id: "Air masuk ke telinga"
summary:
  ar: "قد يدخل الماء في الأذن إذا لم يصبها المستحم والمغتسل فيؤذي ويورم أصل الأذنين ويوجع وجعاً شديداً؛ ومما ينفع أن يمتص بأنبوبة امتصاصاً يجذبه دفعة، وربما أخرجه السعال والعطاس، وقد يستخرج بما يعرف من الآلات، وربما أغنى في القليل صب الأدهان في الأذن وصب الألبان الفاترة مراراً متتابعة ⁦⁦(أسماء الأدوية والضمادات لا تحمل، وسطر لبن النساء سطر موسوم مطروح لحكم المؤسس)⁩⁩ {cite:canon-ibn-sina-print-v2 p.230} {cite:canon-ibn-sina-print-v2 p.231}"
  en: "Water may enter the ear if the bather and washer do not protect it; it hurts, swells the ears' roots and gives severe pain. What helps: drawing it out with a tube in one pull; cough and sneeze may expel it; it may be drawn out with the known instruments; for a little of it, pouring oils in the ear and warm milks several times running may suffice ⁦(drug and dressing names are not carried; the woman's-milk line is a labelled listing for the founder's ruling)⁩ {cite:canon-ibn-sina-print-v2 p.230} {cite:canon-ibn-sina-print-v2 p.231}"
  ur: "اگر نہانے اور دھونے والے کان کی حفاظت نہ کریں تو پانی کان میں داخل ہو سکتا ہے؛ وہ تکلیف دیتا ہے، کانوں کی جڑ سوجا دیتا ہے اور سخت درد کرتا ہے؛ نفع دیتا ہے کہ نلی سے ایک بار میں چوم کر نکالا جائے؛ کھانسی اور چھینک بھی اسے نکال سکتی ہے؛ اور معروف آلات سے بھی نکالا جا سکتا ہے؛ اور تھوڑے میں کان میں تیل ڈالنا اور گرم دودھ کئی بار لگاتار ڈالنا کافی ہو سکتا ہے ⁦⁦(ادویہ اور پٹیوں کے نام منقول نہیں؛ عورتوں کے دودھ کی سطر بانی کے فیصلے کے لیے موسوم فہرست ہے)⁩⁩ {cite:canon-ibn-sina-print-v2 p.230} {cite:canon-ibn-sina-print-v2 p.231}"
  es: "Puede entrar agua en el oído si la persona que se baña o lava no lo protege; duele, inflama las raíces del oído y causa dolor intenso. Lo que ayuda: extraerla con un tubo de una sola vez; toser y estornudar pueden expulsarla; se puede extraer con los instrumentos conocidos; para una pequeña cantidad, verter aceites en el oído y leche tibia varias veces puede ser suficiente (no se incluyen nombres de medicamentos ni apósitos; la línea de leche materna es una lista etiquetada para la regla del fundador) {cite:canon-ibn-sina-print-v2 p.230} {cite:canon-ibn-sina-print-v2 p.231}"
  fr: "L'eau peut pénétrer dans l'oreille si la personne qui se baigne ou se lave ne la protège pas; cela provoque des douleurs, un gonflement des racines de l'oreille et une vive douleur. Ce qui aide: l'aspirer avec un tube en une seule fois; la toux et les éternuements peuvent l'expulser; on peut l'aspirer avec les instruments connus; pour une petite quantité, verser plusieurs fois de l'huile dans l'oreille et du lait chaud peut suffire (les noms des médicaments et des pansements ne sont pas mentionnés; la mention du lait maternel est une référence à la décision du fondateur). {cite:canon-ibn-sina-print-v2 p.230} {cite:canon-ibn-sina-print-v2 p.231}"
  tr: "Banyo yapan veya banyo yapan su dokunmazsa kulağa girebilir, bu da yaralanmaya, kulaklıkların şişmesine ve şiddetli ağrıya yol açabilir; bir emiş tüpüyle emmek faydalıdır, bu tüp anında çeker, bazen öksürmek veya hapşırmak da dışarı atabilir. Bilinen aletlerle çıkarılabilir ya da kulağa tekrar tekrar ılık süt dökülerek biraz zenginleştirilebilir (ilaç ve pansuman isimleri dayanılmaz ve kadın sütü çizgisi kurucunun kararının çıkarılması olarak işaretlenmiş bir çizgidir) {cite:canon-ibn-sina-print-v2 s.230} {cite:canon-ibn-sina-print-v2 s.231}"
  id: "Air dapat masuk ke telinga jika tidak disentuh oleh perenang atau yang berenang, menyebabkan cedera, pembengkakan pada earbud, dan rasa sakit yang parah; berguna untuk menyedotnya dengan tabung hisap yang menariknya dalam sekejap, dan terkadang batuk atau bersin mengeluarkannya. Air dapat diekstrak menggunakan alat yang sudah dikenal, atau mungkin diperkaya sedikit dengan menuangkan susu hangat ke telinga berulang kali dan berulang kali (nama obat dan perban tidak tertahankan, dan garis susu wanita adalah garis yang ditandai sebagai pengurangan dari putusan pendiri) {cite:canon-ibn-sina-print-v2 hlm.230} {cite:canon-ibn-sina-print-v2 hlm.231}"
