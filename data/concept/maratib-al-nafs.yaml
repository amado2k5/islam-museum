id: concept/maratib-al-nafs
class: concept
kind: ethical
label:
  ar: "مراتب النفس الإنسانية"
  en: "The degrees of the human soul"
  ur: "انسانی نفس کے مراتب"
summary:
  ar: "يرى عمر عبد الكافي أن النفس الإنسانية أعقد ما خلق الله، وأن الله قسم الأنفس كما قسم الأرزاق: الأمارة بالسوء واللوامة والمطمئنة والراضية والمرضية والملهمة، وفوقها النفس الكاملة، نفس النبي، التي تُقاس بها النفوس."
  en: "Omar Abdelkafy holds that the human soul is the most complex thing God created, and that God divided souls as He divided provision: the soul that commands evil, the self-reproaching, the tranquil, the content, the well-pleasing and the inspired, and above them the perfect soul, the Prophet's, by which souls are measured."
  ur: "عمر عبد الکافی کے نزدیک انسانی نفس اللہ کی سب سے پیچیدہ تخلیق ہے، اور اللہ نے نفوس کو ایسے تقسیم کیا جیسے رزق: برائی کا حکم دینے والا، ملامت کرنے والا، مطمئن، راضی، پسندیدہ اور الہام یافتہ، اور ان سب کے اوپر کامل نفس، یعنی نبی کا نفس، جس سے نفوس ناپے جاتے ہیں۔"
