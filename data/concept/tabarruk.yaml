label:
  ar: التبرك
  en: Tabarruk (seeking blessing)
  ur: تبرک
  es: "Tabarruk (buscando bendición)"
  fr: "Tabarruk (en quête de bénédiction)"
  tr: "Kutsama"
  id: "Berkat"
summary:
  ar: "التبرك طلب البركة؛ تعالج الموسوعة الفقهية الكويتية صوره المشروعة كالتبرك بالبسملة والحمدلة وبماء زمزم وببعض الأزمنة والأماكن {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  en: "Tabarruk is seeking blessing; the Kuwaiti Fiqh Encyclopedia treats its sanctioned forms — through the basmala and hamdala, the water of Zamzam, and certain times and places {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  es: "Tabarruk busca la bendición; la Enciclopedia de Fiqh de Kuwait trata sus formas sancionadas: a través de la basmala y la hamdala, el agua de Zamzam y ciertos momentos y lugares {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  fr: "Tabarruk recherche la bénédiction; l'Encyclopédie Fiqh koweïtienne traite de ses formes sanctionnées — à travers la basmala et la hamdala, l'eau de Zamzam, et certains moments et lieux {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  ur: "تبرک برکت کا طلبگار ہے۔ کویتی فقہ انسائیکلو پیڈیا اپنی منظور شدہ شکلوں کا علاج کرتا ہے — بسم اللہ اور حمدالہ، آب زمزم، اور مخصوص اوقات اور مقامات کے ذریعے۔"
  tr: "Bereket aramak bir kutsama dileğidir; Kuveyt Fıkıh Ansiklopedisi, kutsama aramak gibi belirlenmiş biçimleri ele alır; örneğin Basmala, Hamdalah, Zamzam suyu ile kutsama aramak ve bazı zaman ve yerlerde {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  id: "Mencari berkat adalah permintaan untuk berkat; Ensiklopedia Hukum Kuwait membahas bentuk-bentuk yang ditetapkan seperti mencari berkat dengan Basmala, Hamdalah, air Zamzam, dan pada waktu dan tempat tertentu {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
