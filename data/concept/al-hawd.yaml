label: { ar: "الحوض ⁦(حوض النبي يوم القيامة)⁩", en: "The Basin (al-Hawd) of the Prophet on the Day of Resurrection", fr: "Le Bassin (al-Hawd) du Prophète au Jour de la Résurrection", ur: "حوض ⁦(قیامت کے دن نبی کا حوض)⁩", es: "La pila (al-Hawd) del Profeta en el Día de la Resurrección" }
summary:
  ur: "قیامت میں نبی کا حوض جس کا پانی دودھ سے سفید اور شہد سے میٹھا ہے؛ جو اسے پی لے پھر کبھی پیاسا نہ ہو۔"
  ar: "من مسائل الإيمان باليوم الآخر عند أهل السنة: أن للنبي حوضاً يرده المؤمنون يوم القيامة، ماؤه أبيض من اللبن وأحلى من العسل، وآنيته كعدد النجوم، ومن شرب منه لم يظمأ بعده. أفرد له ابن أبي عاصم باباً في كتاب السنة، وروى فيه أن من الصحابة من رد على من أنكره، وقال إن أخباره توجب العلم."
  en: "Part of belief in the Last Day for Ahl al-Sunna: that the Prophet has a Basin to which the believers come on the Day of Resurrection, its water whiter than milk and sweeter than honey, its cups as many as the stars, and whoever drinks from it never thirsts again. Ibn Abi Asim gave it a chapter in Kitab al-Sunna, relating that Companions answered those who denied it, and stated that its reports yield knowledge."
  fr: "La foi au Jour dernier, pour les sunnites, comprend la croyance au Bassin du Prophète, auquel se rendent les croyants le Jour de la Résurrection. Son eau est plus blanche que le lait et plus douce que le miel, et ses coupes sont aussi nombreuses que les étoiles ; qui y boit n’a plus jamais soif. Ibn Abi Asim lui consacre un chapitre dans le Kitab al-Sunna. Il rapporte que des Compagnons ont répondu à ceux qui niaient le Bassin et affirme que les récits à son sujet produisent une connaissance."
  es: "Parte de la creencia en el Día del Juicio Final para Ahl al-Sunna es que el Profeta tiene una pila a la que acuden los creyentes en el Día de la Resurrección, cuya agua es más blanca que la leche y más dulce que la miel, con tantas copas como estrellas, y quien bebe de ella jamás vuelve a tener sed. Ibn Abi Asim le dedicó un capítulo en Kitab al-Sunna, donde relata que los Compañeros respondieron a quienes la negaban y afirmaron que sus relatos aportan conocimiento."
