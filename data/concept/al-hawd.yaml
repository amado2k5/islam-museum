label: { ar: "الحوض (حوض النبي يوم القيامة)", en: "The Basin (al-Hawd) of the Prophet on the Day of Resurrection", ur: "حوض (قیامت کے دن نبی کا حوض)" }
summary:
  ar: "من مسائل الإيمان باليوم الآخر عند أهل السنة: أن للنبي حوضاً يرده المؤمنون يوم القيامة، ماؤه أبيض من اللبن وأحلى من العسل، وآنيته كعدد النجوم، ومن شرب منه لم يظمأ بعده. أفرد له ابن أبي عاصم باباً في كتاب السنة، وروى فيه أن من الصحابة من رد على من أنكره، وقال إن أخباره توجب العلم."
  en: "Part of belief in the Last Day for Ahl al-Sunna: that the Prophet has a Basin to which the believers come on the Day of Resurrection, its water whiter than milk and sweeter than honey, its cups as many as the stars, and whoever drinks from it never thirsts again. Ibn Abi Asim gave it a chapter in Kitab al-Sunna, relating that Companions answered those who denied it, and stated that its reports yield knowledge."
