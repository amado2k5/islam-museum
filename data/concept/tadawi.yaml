label:
  ar: "التداوي"
  en: "Seeking treatment (tadawi)"
  ur: "علاج اور دوا ⁦(تداوی)⁩"
  es: "Buscando tratamiento (tadawi)"
  fr: "Recherche de traitement (tadawi)"
summary:
  ar: "التداوي مشروع في الجملة. فجمهور الفقهاء يرون إباحته، والشافعية والقاضي وابن عقيل وابن الجوزي من الحنابلة يستحبونه، وجمهور الحنابلة يرون تركه أفضل. ولا يجوز التداوي بالمحرم والنجس إلا عند الضرورة وبشروط يختلف فيها الفقهاء، والرقية جائزة بكلام الله وأسمائه بشروط. وفي المحرم يوجب التطيب فدية، وللمريض رخص في لبس الحرير والتداوي بالذهب في الأنف والأسنان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4886} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4888} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4890} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4891}"
  en: "Treatment is lawful in general. Most jurists hold it permitted; the Shafi'is, al-Qadi, Ibn Aqil and Ibn al-Jawzi among the Hanbalis hold it recommended; most Hanbalis hold that leaving it is better. Treatment with what is unlawful or impure is forbidden except in necessity, under conditions the schools dispute; recitation with God's words and names is allowed under conditions. For a muhrim, scent used in treatment requires ransom; for the sick, silk and gold for the nose and teeth are allowed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4886} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4888} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4890} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4891}"
  es: "El tratamiento es lícito en general. La mayoría de los juristas lo consideran permitido; los shafiíes, al-Qadi, Ibn Aqil e Ibn al-Jawzi, entre los hanbalíes, lo recomiendan; la mayoría de los hanbalíes opinan que es mejor evitarlo. El tratamiento con sustancias ilícitas o impuras está prohibido, salvo en casos de necesidad y bajo condiciones que generan controversia entre las escuelas; la recitación de las palabras y nombres de Dios está permitida bajo ciertas condiciones. Para un muhrim, el perfume utilizado en el tratamiento requiere un rescate; para los enfermos, se permite el uso de seda y oro para la nariz y los dientes. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4886} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4888} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4890} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4891}"
  fr: "Les soins sont généralement licites. La plupart des juristes les autorisent; parmi les hanbalites, les chaféites, al-Qadi, Ibn Aqil et Ibn al-Jawzi les recommandent; la plupart des hanbalites estiment qu'il est préférable de s'en abstenir. Tout traitement illicite ou impur est interdit, sauf nécessité et sous certaines conditions, divergeant d'écoles juridiques. La récitation des paroles et des noms de Dieu est permise sous certaines conditions. Pour un muhrim (prêt à mourir en Égypte), le parfum utilisé pour les soins doit être payé en compensation; pour les malades, l'utilisation de soie et d'or pour le nez et les dents est autorisée."
