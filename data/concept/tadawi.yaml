label:
  ar: "التداوي"
  en: "Seeking treatment (tadawi)"
  ur: "علاج اور دوا (تداوی)"
summary:
  ar: "التداوي مشروع في الجملة. فجمهور الفقهاء يرون إباحته، والشافعية والقاضي وابن عقيل وابن الجوزي من الحنابلة يستحبونه، وجمهور الحنابلة يرون تركه أفضل. ولا يجوز التداوي بالمحرم والنجس إلا عند الضرورة وبشروط يختلف فيها الفقهاء، والرقية جائزة بكلام الله وأسمائه بشروط. وفي المحرم يوجب التطيب فدية، وللمريض رخص في لبس الحرير والتداوي بالذهب في الأنف والأسنان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4886} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4888} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4890} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4891}"
  en: "Treatment is lawful in general. Most jurists hold it permitted; the Shafi'is, al-Qadi, Ibn Aqil and Ibn al-Jawzi among the Hanbalis hold it recommended; most Hanbalis hold that leaving it is better. Treatment with what is unlawful or impure is forbidden except in necessity, under conditions the schools dispute; recitation with God's words and names is allowed under conditions. For a muhrim, scent used in treatment requires ransom; for the sick, silk and gold for the nose and teeth are allowed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4886} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4888} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4890} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4891}"
