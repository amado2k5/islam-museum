summary:
  ar: "سمّى النبي خمساً من الدواب فواسق يقتلن في الحل والحرم: الفأرة والعقرب والغراب والحدأة والكلب العقور لما فيهن من أذى."
  en: "The Prophet named five creatures vermin that may be killed in and out of the sanctuary: the mouse, the scorpion, the crow, the kite and the rabid dog, for the harm they do."
  ur: "نبی نے پانچ جانوروں کو مؤذی قرار دیا کہ حرم کے اندر اور باہر مارے جا سکتے ہیں: چوہا، بچّھو، کوّا، چیل اور پاگل کتا ان کے نقصان کی بنا پر۔"
  es: "El Profeta mencionó cinco criaturas consideradas alimañas que pueden ser eliminadas dentro y fuera del santuario: el ratón, el escorpión, el cuervo, el milano y el perro rabioso, por el daño que causan."
  fr: "Le Prophète a désigné cinq créatures comme de la vermine qu'il convient de tuer à l'intérieur et à l'extérieur du sanctuaire: la souris, le scorpion, le corbeau, le milan et le chien enragé, en raison du mal qu'ils causent."
  tr: "Peygamber, sığınakta ve sığınakta öldürülmesi gereken beş vahşi hayvanı adlandırdı: fare, akrep, karga, uçurtma ve aç köpek, çünkü verdikleri zarar yüzünden."
  id: "Nabi menyebutkan lima hewan liar yang akan dibunuh di tempat suci dan tempat suci: tikus, kalajengking, gagak, layang-layang, dan anjing yang rakus karena bahaya yang mereka sebabkan."
