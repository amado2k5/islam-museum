id: concept/islamization
class: concept
kind: social
label:
  ar: الأسلمة
  en: Islamization
  ur: اسلامی شکل
  es: "Islamización"
  fr: "islamisation"
  tr: "İslamlaşma"
  id: "Islamisasi"
summary:
  ar: "الأسلمة تحول المجتمعات إلى الإسلام اعتناقا ومؤسسات؛ تسجل كتب الفتوح دخول الناس في الإسلام بعد الفتوح، وتصف الدراسة الأكاديمية التحول بالتدريجي عبر القرون {cite:futuh-buldan-maarif-1407} {cite:bulliet-conversion-1979}."
  en: "Islamization is societies' turning to Islam in belief and institutions; the conquest literature records people entering Islam after the futuh, while academic study describes the transformation as gradual across centuries {cite:futuh-buldan-maarif-1407} {cite:bulliet-conversion-1979}."
  es: "La islamización es el giro de las sociedades hacia el Islam en creencias e instituciones; la literatura de la conquista registra que las personas se convirtieron al Islam después del futuh, mientras que el estudio académico describe la transformación como gradual a lo largo de los siglos {cite:futuh-buldan-maarif-1407} {cite:bulliet-conversion-1979}."
  fr: "L'islamisation est le passage des sociétés à l'islam en matière de croyances et d'institutions; la littérature de conquête relate l'entrée des peuples dans l'islam après le futuh, tandis que les études universitaires décrivent la transformation comme progressive au fil des siècles {cite:futuh-buldan-maarif-1407} {cite:bulliet-conversion-1979}."
  ur: "اسلامائزیشن معاشرے کا عقیدہ اور اداروں میں اسلام کی طرف رجوع کرنا ہے۔ فتوحات کا لٹریچر فتوح کے بعد اسلام میں داخل ہونے والے لوگوں کو ریکارڈ کرتا ہے، جبکہ علمی مطالعہ صدیوں میں ہونے والی تبدیلی کو بتدریج بیان کرتا ہے"
  tr: "İslamlaşma, toplumları bağlılık ve kurumlar yoluyla İslam'a dönüştürür; fetih kitapları, fetihlerden sonra insanların İslam'a girişini kaydeder ve akademik çalışmalar yüzyıllar boyunca kademeli dönüşümü anlatır {cite:futuh-buldan-maarif-1407} {cite:bulliet-conversion-1979}."
  id: "Islamisasi mengubah masyarakat menjadi Islam melalui kepatuhan dan institusi; buku-buku penaklukan mencatat masuknya orang ke Islam setelah penaklukan, dan studi akademis menggambarkan transformasi bertahap selama berabad-abad {cite:futuh-buldan-maarif-1407} {cite:bulliet-conversion-1979}."
