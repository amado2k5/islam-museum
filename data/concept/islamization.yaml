  ar: "الأسلمة تحول المجتمعات إلى الإسلام اعتناقا ومؤسسات؛ تسجل كتب الفتوح دخول الناس في الإسلام بعد الفتوح، وتصف الدراسة الأكاديمية التحول بالتدريجي عبر القرون {cite:futuh-buldan-maarif-1407} {cite:bulliet-conversion-1979}."
