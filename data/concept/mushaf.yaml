label:
  ar: "المصحف"
  en: "Mushaf"
  es: "Corán"
  fr: "Mushaf"
  ur: "مصحف"
summary:
  ar: المصحف في اصطلاح علوم القرآن الأوراق التي جُمع فيها القرآن مع ترتيب آياته وسوره جميعاً على الوجه الذي أجمعت عليه الأمة أيام عثمان، وهو من «أصحفه» أي جمع فيه الصحف، فكأن دفتيه ملحوظان في معناه، ويُفرَّق عن «الصحف» التي جُمعت في عهد أبي بكر وكانت سوراً مرتبة آياتها فقط {cite:manahil-irfan-sabt p. 323} {cite:manahil-irfan-sabt p. 324}.
  en: A mushaf, in the vocabulary of the Qur'anic sciences, is the leaves in which the Qur'an is gathered with the order of both its verses and suras as the community agreed in Uthman's time; the word is from "ashafahu", to gather the suhuf in it, so its two covers are felt in its meaning, and it is distinguished from the suhuf of Abu Bakr's time, which had the verses of each sura in order only {cite:manahil-irfan-sabt p. 323} {cite:manahil-irfan-sabt p. 324}.
  ur: مصحف علومِ قرآن کی اصطلاح میں وہ اوراق ہیں جن میں آیات اور سورتوں دونوں کی ترتیب کے ساتھ قرآن جمع ہو جیسا عثمان کے زمانے میں امت نے اتفاق کیا؛ لفظ «اصحفہ» سے ہے یعنی اس میں صحف جمع کیے گئے، اس لیے اس کے دونوں دفتے اس کے معنی میں ملحوظ ہیں، اور یہ ابو بکر کے عہد کے «صحف» سے مختلف ہے جن میں صرف ہر سورت کی آیات مرتب تھیں {cite:manahil-irfan-sabt p. 323} {cite:manahil-irfan-sabt p. 324}۔
  es: "Un mushaf, en el vocabulario de las ciencias coránicas, son las hojas en las que se reúne el Corán con el orden de sus versículos y suras según lo acordado por la comunidad en la época de Uthman; la palabra proviene de \"ashafahu\", que significa reunir el suhuf en él, por lo que sus dos cubiertas se perciben en su significado, y se distingue del suhuf de la época de Abu Bakr, que tenía los versículos de cada sura en orden solamente {cite:manahil-irfan-sabt p. 323} {cite:manahil-irfan-sabt p. 324}."
  fr: "Dans le vocabulaire des sciences coraniques, un mushaf est le recueil de feuilles dans lequel le Coran est rassemblé, avec l'ordre de ses versets et de ses sourates tel que la communauté s'y était accordée à l'époque d'Uthman; le mot vient de « ashafahu », rassembler le suhuf, de sorte que ses deux couvertures sont ressenties dans sa signification, et il se distingue du suhuf de l'époque d'Abu Bakr, qui ne contenait que les versets de chaque sourate dans l'ordre {cite:manahil-irfan-sabt p. 323} {cite:manahil-irfan-sabt p. 324}."
