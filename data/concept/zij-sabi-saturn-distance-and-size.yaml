label: { ar: "بُعد زحل وعظم جرمه وقطره", en: "The distance, size and diameter of Saturn", ur: "زحل کا بُعد، جرم اور قطر", es: "La distancia, el tamaño y el diámetro de Saturno", fr: "La distance, la taille et le diamètre de Saturne", tr: "Satürn'ün uzaklığı, boyutu ve çapı", id: "Jarak, ukuran, dan diameter Saturnus" }
summary:
  ar: "يذكر النص أن عظم زحل يتفاوت بين بعده الأقرب والأبعد، وأن بعده الأوسط نحو خمسة عشر ألفاً وخمسمائة مع رقم آخر مشوش، وأن قطره في بعده الأوسط جزء من ثمانية عشر من قطر الشمس، وأن قطره مثل قطر الأرض أربع مرات وسدساً وقليلاً، وأن عظم جرمه مثل عظم الأرض قريباً من تسع وسبعين مرة، {cite:zij-sabi-nallino-byblion p.189}"
  en: "The text says Saturn's size varies between its nearest and farthest positions, that its mean distance is about fifteen thousand and five hundred, the last figure being garbled, and that its mean diameter is one eighteenth of the Sun's. Its diameter is about four and a sixth times the Earth's, and its bulk about seventy-nine times the Earth's. {cite:zij-sabi-nallino-byblion p.189}"
  ur: "متن کہتا ہے کہ زحل کا جسم اس کے قریب اور دور ترین مقامات کے درمیان بدلتا ہے، اس کا وسطی بُعد تقریباً پندرہ ہزار اور پانچ سو ہے، آخری عدد بگڑا ہوا ہے، اور وسطی قطر سورج کے قطر کا اٹھارہواں حصہ۔ اس کا قطر زمین کے قطر سے تقریباً چار اور ایک سدس گنا، اور جرم تقریباً اناسی گنا۔ {cite:zij-sabi-nallino-byblion p.189}"
  es: "El texto indica que el tamaño de Saturno varía entre sus posiciones más cercana y más lejana, que su distancia media es de aproximadamente quince mil quinientos (esta última cifra está ilegible) y que su diámetro medio es un dieciochoavo del del Sol. Su diámetro es aproximadamente cuatro veces y un sexto mayor que el de la Tierra, y su volumen, unas setenta y nueve veces mayor. {cite:zij-sabi-nallino-byblion p.189}"
  fr: "Le texte indique que la taille de Saturne varie entre ses positions les plus proches et les plus éloignées, que sa distance moyenne est d'environ quinze mille cinq cents (le dernier chiffre étant erroné), et que son diamètre moyen est un dix-huitième de celui du Soleil. Son diamètre est environ quatre fois et un sixième de celui de la Terre, et sa masse environ soixante-dix-neuf fois supérieure. {cite:zij-sabi-nallino-byblion p.189}"
  tr: "Metinde, Satürn'ün boyutunun en yakın ve en uzak mesafeler arasında değiştiği, orta mesafesinin yaklaşık on beş bin beş yüz olduğu (başka bir kafa karıştırıcı sayı ile birlikte), orta mesafedeki çapının Güneş'in çapının on sekizde biri olduğu, çapının Dünya'nın çapının dört buçuk katı ve biraz daha fazlası olduğu ve gövdesinin boyutunun Dünya'nın boyutunun yaklaşık yetmiş dokuz katı olduğu belirtiliyor. {cite:zij-sabi-nallino-byblion s.189}"
  id: "Teks tersebut menyatakan bahwa ukuran Saturnus bervariasi antara jarak terdekat dan terjauhnya, bahwa jarak tengahnya sekitar lima belas ribu lima ratus dengan angka lain yang membingungkan, bahwa diameternya pada jarak tengahnya adalah seperdelapan belas dari diameter matahari, bahwa diameternya seperti diameter bumi empat seperenam kali dan sedikit lebih, dan bahwa ukuran tubuhnya seperti ukuran bumi hampir tujuh puluh sembilan kali, {cite:zij-sabi-nallino-byblion p.189}"
