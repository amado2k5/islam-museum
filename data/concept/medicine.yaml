id: concept/medicine
class: concept
kind: discipline
label: { ar: "الطب", en: "Medicine", es: "Medicamento", fr: "Médecine", ur: "دوائی" }
summary:
  ar: "عرّف ابن سينا الطب بأنه علم يُتعرَّف منه أحوال بدن الإنسان من جهة ما يصح ويزول عن الصحة، ليُحفظ ما حصل منها ويُستردّ ما زال {cite:canon-ibn-sina-print-v1 p.13}. ومن موضوعاته الأركان والأمزجة والأخلاط والأعضاء والأرواح والقوى والأفعال، ويعرف أسباب الصحة والمرض على أربعة أصناف: مادية وفاعلية وصورية وتمامية {cite:canon-ibn-sina-print-v1 p.14} {cite:canon-ibn-sina-print-v1 p.15}."
  en: "Ibn Sina defines medicine as the science that studies the human body insofar as it is healthy or departs from health, in order to keep health and restore it when lost {cite:canon-ibn-sina-print-v1 p.13}. Its subjects include the elements, temperaments, humours, organs, spirits, powers and actions, and it knows the causes of health and disease in four kinds: material, efficient, formal and final {cite:canon-ibn-sina-print-v1 p.14} {cite:canon-ibn-sina-print-v1 p.15}."
  es: "Ibn Sina define la medicina como la ciencia que estudia el cuerpo humano en cuanto a su salud y su deterioro, con el fin de mantenerla y restaurarla cuando se pierde {cite:canon-ibn-sina-print-v1 p.13}. Sus temas incluyen los elementos, los temperamentos, los humores, los órganos, los espíritus, las facultades y las acciones, y conoce las causas de la salud y la enfermedad en cuatro tipos: materiales, eficientes, formales y finales {cite:canon-ibn-sina-print-v1 p.14} {cite:canon-ibn-sina-print-v1 p.15}."
  fr: "Ibn Sina définit la médecine comme la science qui étudie le corps humain, dans la mesure où il est sain ou malade, afin de préserver la santé et de la rétablir lorsqu'elle est perdue {cite:canon-ibn-sina-print-v1 p.13}. Ses sujets comprennent les éléments, les tempéraments, les humeurs, les organes, les esprits, les forces et les actions, et elle connaît les causes de la santé et de la maladie en quatre catégories: matérielles, efficientes, formelles et finales {cite:canon-ibn-sina-print-v1 p.14} {cite:canon-ibn-sina-print-v1 p.15}."
  ur: "ابن سینا طب کی تعریف اس سائنس کے طور پر کرتا ہے جو انسانی جسم کو صحت مند رکھنے یا صحت سے دور ہونے کا مطالعہ کرتی ہے، تاکہ صحت کو برقرار رکھا جا سکے اور کھو جانے پر اسے بحال کیا جا سکے۔ اس کے مضامین میں عناصر، مزاج، مزاح، اعضاء، روح، قوتیں اور اعمال شامل ہیں اور یہ صحت اور بیماری کے اسباب کو چار اقسام میں جانتا ہے: مادی، موثر، رسمی اور حتمی"
