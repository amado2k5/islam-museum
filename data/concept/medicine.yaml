label: { ar: "الطب", en: "Medicine" }
summary:
  ar: "عرّف ابن سينا الطب بأنه علم يُتعرَّف منه أحوال بدن الإنسان من جهة ما يصح ويزول عن الصحة، ليُحفظ ما حصل منها ويُستردّ ما زال {cite:canon-ibn-sina-print p.2}. ومن موضوعاته الأركان والمزاجات والأخلاط والأعضاء والقوى والأفعال، ومن أسبابه المادية والفاعلية والصورية والتمامية {cite:canon-ibn-sina-print p.3}."
  en: "Ibn Sina defines medicine as the science that studies the human body in so far as it is healthy or moves away from health, in order to keep health and restore it when lost {cite:canon-ibn-sina-print p.2}. Its subjects include the elements, temperaments, humours, organs, powers and actions, and it must know four kinds of cause: material, efficient, formal and final {cite:canon-ibn-sina-print p.3}."
definitions:
  - tradition: sunni-hanafi
    text: { ar: "علم يتعرف منه أحوال بدن الإنسان من جهة ما يصح ويزول عن الصحة، ليحفظ الصحة حاصلة ويستردها زائلة.", en: "The science by which the states of the human body are known, insofar as it is healthy or departs from health, in order to preserve health and restore it." }
    sources: [source/canon-ibn-sina-print]
