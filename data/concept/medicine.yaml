id: concept/medicine
class: concept
kind: discipline
label: { ar: "الطب", en: "Medicine" }
summary:
  ar: "عرّف ابن سينا الطب بأنه علم يُتعرَّف منه أحوال بدن الإنسان من جهة ما يصح ويزول عن الصحة، ليُحفظ ما حصل منها ويُستردّ ما زال {cite:canon-ibn-sina-print-v1 p.13}. ومن موضوعاته الأركان والأمزجة والأخلاط والأعضاء والأرواح والقوى والأفعال، ويعرف أسباب الصحة والمرض على أربعة أصناف: مادية وفاعلية وصورية وتمامية {cite:canon-ibn-sina-print-v1 p.14} {cite:canon-ibn-sina-print-v1 p.15}."
  en: "Ibn Sina defines medicine as the science that studies the human body insofar as it is healthy or departs from health, in order to keep health and restore it when lost {cite:canon-ibn-sina-print-v1 p.13}. Its subjects include the elements, temperaments, humours, organs, spirits, powers and actions, and it knows the causes of health and disease in four kinds: material, efficient, formal and final {cite:canon-ibn-sina-print-v1 p.14} {cite:canon-ibn-sina-print-v1 p.15}."
wings: [ideas]
definitions:
  - tradition: academic
    text: { ar: "علم يتعرف منه أحوال بدن الإنسان من جهة ما يصح ويزول عن الصحة، ليحفظ الصحة حاصلة ويستردها زائلة.", en: "The science by which the states of the human body are known, insofar as it is healthy or departs from health, in order to preserve health and restore it." }
