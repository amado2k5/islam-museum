label:
  ar: "جلد"
  en: "Jild (hide and skin)"
  ur: "جلد ⁦(کھال)⁩"
  es: "Jild (piel y cuero)"
  fr: "Jild (peau et cuir)"
  tr: "Cilt"
  id: "Kulit"
summary:
  ar: "جلد الحيوان، وخيره جلود الرضع لرطوبتها؛ غذاؤه قليل لزج، وجلد الأفعى محرقاً ينفع داء الثعلب، وجلد الماعز المسلوخ يمنع آفة الضربة، وينفع القروح الخبيثة والجرب {cite:canon-ibn-sina-print-v1 p.426}."
  en: "Animal skin. The best is the skin of sucklings, for its moisture. Its food is scant and sticky. Burnt snake skin is a plaster for fox-mange; a fresh goat skin laid on a blow stops the harm, and the book lists it for malignant ulcers and scabies {cite:canon-ibn-sina-print-v1 p.426}."
  ur: "جانور کی کھال۔ بہترین شیر خوار جانوروں کی کھال ہے کیونکہ اس میں نمی ہے؛ اس کی غذا کم اور چپچپی ہے۔ جلا ہوا سانپ کا چمڑا داد ثعلب پر لیپ ہے؛ بکری کی تازہ کھال زخم پر رکھنے سے بیماری روکتی ہے، اور کتاب اسے خبیث زخموں اور خارش میں مفید بیان کرتی ہے {cite:canon-ibn-sina-print-v1 p.426}۔"
  es: "Piel de animal. La mejor es la piel de los lactantes, por su humedad. Su alimento es escaso y pegajoso. La piel de serpiente quemada sirve como emplasto para la sarna del zorro; una piel de cabra fresca colocada sobre una herida detiene el daño, y el libro la menciona para úlceras malignas y sarna {cite:canon-ibn-sina-print-v1 p.426}."
  fr: "Peau animale. La meilleure est la peau des nourrissons, pour son humidité. Leur nourriture est maigre et collante. La peau de serpent brûlée sert de cataplasme contre la gale du renard; une peau de chèvre fraîche appliquée sur une blessure en stoppe les dégâts, et le livre la mentionne pour les ulcères malins et la gale {cite:canon-ibn-sina-print-v1 p.426}."
  tr: "Hayvan derisi, tercihen nemli olduğu için bebek derisi, hafif yapışkan bir besindir, yılan derisi tilki hastalığına fayda sağlayan yanıktır, derisi derisi vuruş hastalığını önler ve kötü huylu yaralar ile uyuz etkiler {cite:canon-ibn-sina-print-v1 s.426}."
  id: "Kulit hewan, sebaiknya kulit bayi karena kelembapannya, adalah makanan yang agak lengket, kulit ular adalah luka bakar yang menguntungkan penyakit rubah, kulit kambing yang dikuliti mencegah wabah akibat serangan dan mendukung luka ganas serta kudis {cite:canon-ibn-sina-print-v1 hlm.426}."
