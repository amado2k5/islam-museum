  ar: "القسب في الكتاب تمر الأدفال، معتدل الحر يابس، فيه قبض، يحبس الطبع ويقوي المعدة {cite:canon-ibn-sina-print-v1 p.646}"
  en: "Qasb is in the book the date of the adfal, moderately hot and dry, with astringency in it, which stops the bowel and strengthens the stomach {cite:canon-ibn-sina-print-v1 p.646}"
  ur: "قسب کتاب میں ادفال کی کھجور ہے، اعتدال والی گرم اور خشک، اس میں قبض ہے، پیٹ کو روکتی اور معدے کو قوت دیتی ہے {cite:canon-ibn-sina-print-v1 p.646}۔"
  es: "Qasb es en el libro la fecha del adfal, moderadamente caliente y seco, con astringencia en él, que detiene el intestino y fortalece el estómago {cite:canon-ibn-sina-print-v1 p.646}"
  fr: "Le Qasb est mentionné dans le livre comme la date de l'adfal, modérément chaud et sec, avec une astringence qui arrête le transit intestinal et fortifie l'estomac {cite:canon-ibn-sina-print-v1 p.646}"
  tr: "Kitapta Kaba, adfalın tarihidir; ılımlı sıcak ve kurudur, kabızlık içerir, mizacını dizginler ve mideyi güçlendirir {cite:canon-ibn-sina-print-v1 s.646}"
  id: "Dalam buku ini, Qabas adalah tanggal adfal, yang cukup panas dan kering, mengandung sembelit, menahan temperamen, dan memperkuat lambung {cite:canon-ibn-sina-print-v1 hlm.646}"
