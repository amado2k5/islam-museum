id: concept/external-senses
class: concept
kind: scientific
label: { ar: "الحواس الظاهرة عند ابن سينا", en: "The outer senses in the Canon", ur: "قانون میں ظاہری حواس", es: "Los sentidos externos en el Canon", fr: "Les sens extérieurs dans le Canon", tr: "İbn Sina'ya göre görünür duyular", id: "Indra yang tampak menurut Avicenna" }
summary:
  ar: "في الفصل الخامس يقسم ابن سينا القوة النفسانية إلى مدركة ومحركة، والمدركة إلى ظاهرة هي الحسية وباطنة، ويذكر أن الحواس الظاهرة خمس عند قوم وثمان عند آخرين {cite:canon-ibn-sina-print-v1 pp.99-100}."
  en: "In the fifth chapter Ibn Sina divides the psychic faculty into perceptive and motive, and the perceptive into outer, the senses, and inner, and says the outer senses are five for some and eight for others {cite:canon-ibn-sina-print-v1 pp.99-100}."
  es: "En el quinto capítulo, Ibn Sina divide la facultad psíquica en perceptiva y motivacional, y la perceptiva en externa, los sentidos, e interna, y dice que los sentidos externos son cinco para algunos y ocho para otros {cite:canon-ibn-sina-print-v1 pp.99-100}."
  fr: "Dans le cinquième chapitre, Ibn Sina divise la faculté psychique en perceptive et motivationnelle, et la perceptive en externe, les sens, et interne, et dit que les sens externes sont au nombre de cinq pour certains et de huit pour d'autres {cite:canon-ibn-sina-print-v1 pp.99-100}."
  ur: "پانچویں باب میں ابن سینا نے نفسیاتی فیکلٹی کو ادراک اور مقصد میں تقسیم کیا ہے اور ادراک کو ظاہری، حواس اور باطنی میں تقسیم کیا ہے اور کہا ہے کہ بیرونی حواس کچھ کے لیے پانچ ہیں اور دوسروں کے لیے آٹھ ہیں۔"
  tr: "Beşinci bölümde İbn Sina, psikolojik yetkiyi algısal ve hareketli olarak, algılananı ise duyusal ve içsel bir olguya ayırır. Görünür duyuların bazılarına göre beş, bazılarına göre sekiz olduğunu belirtir {atıf:kanon-ibn-sina-print-v1 s.99-100}."
  id: "Pada bab kelima, Ibn Sina membagi fakultas psikologis menjadi perseptual dan bergerak, serta yang dirasakan menjadi fenomena yang bersifat sensorik dan batin. Ia menyebutkan bahwa indera yang tampak adalah lima menurut sebagian dan delapan menurut yang lain {cite:canon-ibn-sina-print-v1 hlm.99-100}."
