id: concept/zij-sabi-star-distance-from-the-meridian-line
class: concept
kind: scientific
label: { ar: "بعد الكوكب عن خط وسط السماء", en: "The distance of a star from the meridian line", ur: "ستارے کا خطِ نصف النہار سے بعد" }
summary:
  ar: "يبدأ الباب الثاني والعشرون بمعرفة ارتفاع الكواكب من قبل ساعات الليل، ومنه معرفة بعد الكوكب عن خط وسط السماء. تؤخذ الدرجة التي تتوسط السماء في ذلك الوقت والطالعة والغاربة، ثم تُحسب الأزمان بين جزء وسط السماء والجزء الذي يتوسط السماء مع الكوكب في الفلك المستقيم، فيكون الفرق بعده عن الخط، يُنقص إن كانت درجة الكوكب شرقية وتُنقص العكس إن غربية. {cite:zij-sabi-nallino-byblion pp.56-57}."
  en: "Chapter 22 begins with finding the altitudes of stars from the hours of the night, and within it the distance of the star from the meridian line. One takes the degree that culminates at that time, the rising degree and the setting degree, and then works out the times between the part at midheaven and the part that culminates with the star in the right sphere; the difference is its distance from the line, taking the one from the other according to whether the star's degree is on the east or the west of midheaven. {cite:zij-sabi-nallino-byblion pp.56-57}."
  ur: "بائیسواں باب رات کی ساعتوں سے ستاروں کے ارتفاع کی پہچان سے شروع ہوتا ہے، اور اسی میں ستارے کا خطِ وسط السماء سے بعد بھی ہے۔ اس وقت وسط السماء کا درجہ، طالع اور غارب درجے لیے جاتے ہیں، پھر وسط السماء کے جزء اور اس جزء کے درمیان ازمان نکالے جاتے ہیں جو فلک مستقیم میں ستارے کے ساتھ وسط السماء میں آتا ہے؛ فرق اس کا خط سے بعد ہے، جسے ستارے کے درجے کے وسط السماء کے مشرق یا مغرب میں ہونے کے لحاظ سے ایک کو دوسرے میں سے گھٹایا جاتا ہے۔ {cite:zij-sabi-nallino-byblion pp.56-57}۔"
