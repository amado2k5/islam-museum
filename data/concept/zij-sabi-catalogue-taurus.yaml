summary:
  ar: "الثور هو الصورة البروجية التي تلي الحمل. يبدأ الفهرس بالكوكب الشمالي من أربعة كواكب في أحد أقسام الصورة، ثم يتابع الصورة. الثريا تأتي بعد صفحات بعنوانها الخاص. لا تُنقل المواضع هنا. {cite:nallino-albatenii-opus-astronomicum pp.155}"
  en: "Taurus, al-Thawr, the bull, follows Aries in the zodiac group. The list opens with the northern one of four stars in one part of the figure and continues through the figure. The Pleiades, al-Thurayya, follow a few pages later under their own heading. Positions are not transcribed here. {cite:nallino-albatenii-opus-astronomicum pp.155}"
  ur: "ثور، یعنی بیل، حمل کے بعد برجی گروہ میں آتا ہے۔ فہرست اس کے چار ستاروں میں سے شمالی ستارے سے شروع ہوتی ہے اور صورت کے باقی حصے گنتی ہے۔ ثریا، یعنی Pleiades، چند صفحات بعد اپنے الگ عنوان کے ساتھ درج ہے۔ مواضع یہاں نقل نہیں ہوئے۔ {cite:nallino-albatenii-opus-astronomicum pp.155}"
  es: "Tauro, al-Thawr, el toro, sigue a Aries en el grupo zodiacal. La lista comienza con la estrella septentrional de las cuatro que aparecen en una parte de la figura y continúa a lo largo de la misma. Las Pléyades, al-Thurayya, aparecen unas páginas más adelante bajo su propio epígrafe. Las posiciones no se transcriben aquí. {cite:nallino-albatenii-opus-astronomicum pp.155}"
  fr: "Le Taureau (al-Thawr) suit le Bélier dans le zodiaque. La liste commence par l'étoile la plus septentrionale des quatre étoiles figurant dans une partie de la figure et se poursuit tout au long de celle-ci. Les Pléiades (al-Thurayya) apparaissent quelques pages plus loin, sous leur propre rubrique. Leurs positions ne sont pas indiquées ici. {cite:nallino-albatenii-opus-astronomicum pp.155}"
  tr: "Boğa, Koç burcunu takip eden zodyak burcudur. Dizin, burcun bir bölümündeki dört gezegenden en kuzeydekiyle başlar ve ardından devam eder. Pleiades, kendi başlığıyla sayfalar sonra gelir. Konumlar burada yazılmamıştır. {cite:nallino-albatenii-opus-astronomicum pp.155}"
  id: "Taurus adalah tanda zodiak yang mengikuti Aries. Indeks dimulai dengan planet paling utara dari empat planet dalam satu bagian tanda tersebut, lalu berlanjut. Pleiades muncul beberapa halaman kemudian dengan judul tersendiri. Posisi tidak ditranskripsikan di sini. {cite:nallino-albatenii-opus-astronomicum pp.155}"
