label:
  ar: "الخبرة والخدمة وتطوير الذات"
  en: "Experience versus service, and self-development"
  ur: "تجربہ بمقابلہ خدمت، اور خود ترقی"
summary:
  ar: "الفرق بين الخبرة والخدمة عند طارق السويدان: سنوات العمل لا تتراكم خبرةً إلا بالتطوير المستمر، ومعاييره الدنيا لها: كتابان شهرياً، وثلاث دورات سنوياً، ومتابعة مجلة متخصصة وأخرى ثقافية، ومتابعة عالمَين في التخصص."
  en: "Experience versus service in Tareq al-Suwaidan's teaching: years of work do not add up to experience without continuous development, whose minimum standards he sets as two books a month, three courses a year, one specialist and one general journal, and following two scholars of one's field."
  ur: "طارق السویدان کی تعلیم میں تجربہ بمقابلہ خدمت: کام کے سال مسلسل ترقی کے بغیر تجربے میں نہیں جمع ہوتے؛ اس کے کم از کم معیار: ماہ میں دو کتابیں، سال میں تین کورس، ایک تخصصی اور ایک عام جریدے کی متابعت، اور اپنے شعبے کے دو علما کی پیروی۔"
