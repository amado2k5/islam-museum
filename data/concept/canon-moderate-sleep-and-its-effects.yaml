id: concept/canon-moderate-sleep-and-its-effects
class: concept
kind: scientific
label:
  ar: "النوم المعتدل وفوائده عند ابن سينا"
  en: "Moderate sleep and its effects in the Canon"
  fr: "Sommeil modéré et effets dans le Canon"
  ur: "معتدل نیند اور اس کے فائدے قانون میں"
  es: "El sueño moderado y sus efectos en el Canon"
  tr: "İbn Sina'ya göre Orta Derecede Uyku ve Faydaları"
  id: "Tidur Sedang dan Manfaatnya menurut Ibn Sina"
summary:
  ar: "يفتتح ابن سينا الفصل التاسع في النوم واليقظة بأن سبب النوم الطبيعي قيل في موضعه، ثم يبين أن النوم المعتدل يمكن القوة الطبيعية من أفعالها ويريح القوة النفسانية ويمنع تحلل الروح فيهضم الطعام ويتدارك الضعف، وأنه مرطب مسخن ينفع المشايخ {cite:canon-ibn-sina-print-v1 pp.240-241}."
  en: "Ibn Sina opens the ninth chapter, on sleep and waking, by saying the cause of natural sleep was dealt with in its place, then shows that moderate sleep lets the natural faculty do its work, rests the psychic faculty and holds back the dissolving of the spirit, so that food is digested and weakness made good, and that it moistens and warms and most benefits the old {cite:canon-ibn-sina-print-v1 pp.240-241}."
  fr: "Au chapitre 9, Ibn Sina renvoie la cause du sommeil naturel à sa place, puis décrit sommeil modéré libérant la faculté naturelle, reposant la psychique, retenant la dissipation de l’esprit, favorisant digestion et restauration des forces, humidifiant et chauffant surtout au bénéfice des vieillards {cite:canon-ibn-sina-print-v1 pp.240-241}."
  es: "Ibn Sina abre el noveno capítulo, sobre el sueño y la vigilia, diciendo que la causa del sueño natural se trató en su lugar, luego muestra que el sueño moderado permite que la facultad natural haga su trabajo, descansa la facultad psíquica y frena la disolución del espíritu, de modo que los alimentos se digieren y la debilidad se cura, y que humedece y calienta y beneficia mucho a los ancianos {cite:canon-ibn-sina-print-v1 pp.240-241}."
  ur: "ابن سینا نویں باب کا آغاز نیند اور جاگنے پر کرتے ہوئے کرتے ہیں، فطری نیند کا سبب اس کی جگہ بیان کیا گیا، پھر یہ بتاتے ہیں کہ اعتدال پسند نیند فطری قوت کو اپنا کام کرنے دیتی ہے، نفسیاتی قوت کو آرام دیتی ہے اور روح کی تحلیل کو روکتی ہے، تاکہ کھانا ہضم ہوتا ہے اور کمزوری اچھی ہوتی ہے، اور یہ کہ پرانے کو گرم اور زیادہ تر فائدہ دیتی ہے۔ {حوالہ:کینن ابن سینا پرنٹ v1 صفحہ 240-241}۔"
  tr: "İbn Sina, uyku ve uyanıklık üzerine dokuzuncu bölümü doğal uykunun sebebinin doğru yerinde söylendiğini belirterek açar. Daha sonra, orta dereceli uykunun etkilerinden doğal güç sağladığını, psikolojik gücü gevşettiğini, ruhun yiyeceklerin çürümesini önlediğini ve zayıflığı giderdiğini açıklar. Ayrıca şeyhler için faydalı olan nemlendirici bir ısıtıcı madde olduğunu da açıklar {cite:canon-ibn-sina-print-v1 s.240-241}."
  id: "Ibn Sina membuka bab kesembilan tentang tidur dan kesadaran dengan menyatakan bahwa alasan tidur alami dinyatakan pada tempat yang tepat. Ia kemudian menjelaskan bahwa tidur sedang memberikan kekuatan alami dari tindakannya, merilekskan kekuatan psikologis, mencegah jiwa membusuk makanan, dan mengatasi kelemahan. Ia juga menjelaskan bahwa ini adalah agen pemanas pelembap yang bermanfaat bagi para sheikh {cite:canon-ibn-sina-print-v1 hlm.240-241}."
