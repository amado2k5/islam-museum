summary:
  ar: "يفتتح ابن سينا الفصل التاسع في النوم واليقظة بأن سبب النوم الطبيعي قيل في موضعه، ثم يبين أن النوم المعتدل يمكن القوة الطبيعية من أفعالها ويريح القوة النفسانية ويمنع تحلل الروح فيهضم الطعام ويتدارك الضعف، وأنه مرطب مسخن ينفع المشايخ {cite:canon-ibn-sina-print-v1 pp.240-241}."
  en: "Ibn Sina opens the ninth chapter, on sleep and waking, by saying the cause of natural sleep was dealt with in its place, then shows that moderate sleep lets the natural faculty do its work, rests the psychic faculty and holds back the dissolving of the spirit, so that food is digested and weakness made good, and that it moistens and warms and most benefits the old {cite:canon-ibn-sina-print-v1 pp.240-241}."
