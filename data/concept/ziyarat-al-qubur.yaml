periods: [period/prophetic-era]
regions: [global]
issue:
  ar: "ما الذي تقصده زيارة القبور في الشرع، وما الذي يخرجها إلى البدعة؟"
  en: "What is a grave visit for in the law, and what turns it into an innovation?"
