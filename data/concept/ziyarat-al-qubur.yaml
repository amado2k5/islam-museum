label: { ar: "زيارة القبور", en: "Visiting graves", es: "Visitar tumbas", fr: "Visiter les tombes" }
summary:
  ar: "زيارة القبور مشروعة بقصد الاعتبار بالآخرة والسلام على أهلها والدعاء لهم، وقد أذن فيها النبي؛ أما زيارتها بقصد الصلاة عندها أو الطواف بها أو الاستغاثة بأصحابها فبدعة وشرك عند ابن قيم الجوزية، كما يعرضه منتخب «إغاثة اللهفان»."
  en: "Visiting graves is lawful for the sake of remembering the hereafter, greeting those buried and praying for them, as the Prophet allowed. Visiting in order to pray there, circle the grave or seek help from its occupant is, in Ibn Qayyim's view as the extract presents it, an innovation and a form of shirk."
  es: "Visitar tumbas es lícito para recordar la vida después de la muerte, saludar a los sepultados y orar por ellos, como lo permitió el Profeta. Sin embargo, visitar una tumba para orar, circunvalarla o pedir ayuda a su ocupante es, según la opinión de Ibn Qayyim, tal como se presenta en el extracto, una innovación y una forma de politeísmo."
  fr: "Il est permis de se rendre sur les tombes pour se souvenir de l'au-delà, saluer les défunts et prier pour eux, comme l'a autorisé le Prophète. En revanche, s'y rendre dans le but d'y prier, de faire le tour de la tombe ou de solliciter l'aide du défunt est, selon Ibn Qayyim, tel que présenté dans l'extrait, une innovation et une forme d'associationnisme (shirk)."
