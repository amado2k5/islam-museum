id: concept/ziyarat-al-qubur
class: concept
kind: legal
label: { ar: "زيارة القبور", en: "Visiting graves" }
summary:
  ar: "زيارة القبور مشروعة بقصد الاعتبار بالآخرة والسلام على أهلها والدعاء لهم، وقد أذن فيها النبي؛ أما زيارتها بقصد الصلاة عندها أو الطواف بها أو الاستغاثة بأصحابها فبدعة وشرك عند ابن قيم الجوزية، كما يعرضه منتخب «إغاثة اللهفان»."
  en: "Visiting graves is lawful for the sake of remembering the hereafter, greeting those buried and praying for them, as the Prophet allowed. Visiting in order to pray there, circle the grave or seek help from its occupant is, in Ibn Qayyim's view as the extract presents it, an innovation and a form of shirk."
