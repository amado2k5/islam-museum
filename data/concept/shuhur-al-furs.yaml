label: { ar: "شهور الفرس", en: "The Persian months" }
summary:
  ar: "شهور الفرس كلها ثلاثون يوماً: فرورديماه وأول يوم منه النيروز وبينه وبين المهرجان مائة وأربعة وسبعون يوماً، ثم أرديبهشت ماه وخرداذ ماه وتيرماه ومرداذماه وشهريورماه ومهرماه ويوم السادس عشر منه المهرجان، وأبانماه فيه أبان روز وفي آخره خمسة أيام الفرودجان، وآذرماه وأول يوم منه يخرج الكوسج راكباً بغاله بالعراق وأرض فارس، ثم ديماه وبهمناه واسفندارمذماه، وبعد الشهور خمسة أيام النسية {cite:muruj-al-dhahab p. 507-508}."
  en: "The Persian year of twelve thirty-day months — Farwardin opening on Nowruz, Mihrmah's sixteenth the Mihragan, Aban's feast-days and the five Furudjan at its end, Adharmah's first day bringing the Kawsaj's mule-ride through Iraq and Fars, then Day, Bahman and Isfandarmadh, with the five stolen days after {cite:muruj-al-dhahab p. 507-508}."
