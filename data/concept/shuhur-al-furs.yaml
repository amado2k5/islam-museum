label: { ar: "شهور الفرس", en: "The Persian months", es: "Los meses persas", fr: "Les mois persans", ur: "فارسی مہینے", tr: "Fars ayları", id: "Bulan-bulan Persia" }
summary:
  ar: "شهور الفرس كلها ثلاثون يوماً: فرورديماه وأول يوم منه النيروز وبينه وبين المهرجان مائة وأربعة وسبعون يوماً، ثم أرديبهشت ماه وخرداذ ماه وتيرماه ومرداذماه وشهريورماه ومهرماه ويوم السادس عشر منه المهرجان، وأبانماه فيه أبان روز وفي آخره خمسة أيام الفرودجان، وآذرماه وأول يوم منه يخرج الكوسج راكباً بغاله بالعراق وأرض فارس، ثم ديماه وبهمناه واسفندارمذماه، وبعد الشهور خمسة أيام النسية {cite:muruj-al-dhahab p. 507-508}."
  en: "The Persian year of twelve thirty-day months — Farwardin opening on Nowruz, Mihrmah's sixteenth the Mihragan, Aban's feast-days and the five Furudjan at its end, Adharmah's first day bringing the Kawsaj's mule-ride through Iraq and Fars, then Day, Bahman and Isfandarmadh, with the five stolen days after {cite:muruj-al-dhahab p. 507-508}."
  es: "El año persa de doce meses de treinta días: Farwardin comienza en Nowruz, el decimosexto de Mihrmah en Mihragan, los días festivos de Aban y los cinco Furudjan al final, el primer día de Adharmah trae el paseo en mula de Kawsaj a través de Irak y Fars, luego Day, Bahman e Isfandarmadh, con los cinco días robados después {cite:muruj-al-dhahab p. 507-508}."
  fr: "L'année perse de douze mois de trente jours — Farwardin s'ouvrant sur Nowruz, le seizième Mihrmah le Mihragan, les jours de fête d'Aban et les cinq Furudjan à sa fin, le premier jour d'Adharmah apportant la chevauchée de mules du Kawsaj à travers l'Irak et le Fars, puis Day, Bahman et Isfandarmadh, avec les cinq jours volés après {cite:muruj-al-dhahab p. 507-508}."
  ur: "بارہ تیس دنوں کا فارسی سال - نوروز کو فروردین کا آغاز، مہرمہ کی سولہویں مہرگان، ابان کی عید کے دن اور اس کے اختتام پر پانچ فرودجان، ادرمہ کا پہلا دن عراق اور فارس سے کاواسج کی خچر کی سواری لاتا ہے، پھر یوم، بہمن اور اسفند لین کے ساتھ پانچ دنوں کے بعد۔ {حوالہ: مروج الذہب ص۱۴۲۔ 507-508}۔"
  tr: "Perslerin tüm ayları otuz günden oluşur: Farwurdimah, ilk günü Nowruz'dur ve bayram ile arasında yüz yetmiş dört gün vardır, ardından Ordibehesht ve Khordad Mah, Tirmah, Mardāmah, Shahrīrmah ve Mahramah ayları ve festivalin on altıncı günü gelir. Günleri, bayram olan Aban Gül ayı ve sonunda Farudjan'ın beş günüdür. Azramah ve bu ayın ilk günü, Kusaj katırına binerek Irak ve İran topraklarında, ardından Dimah, Bahmanah ve İsfandarmahah'a çıkar. Aylardan sonra beş gün unutulmaz günlerdir {atıf:Muruj-al-Dhahab, s. 507-508}."
  id: "Semua bulan orang Persia terdiri dari tiga puluh hari: Farwurdimah, hari pertamanya adalah Nowruz, dan antara hari itu dan festival adalah seratus tujuh puluh empat hari, kemudian bulan Ordibehesht dan Khordad Mah, Tirmah, Mardāmah, Shahrīrmah, dan Mahramah, dan hari keenam belas festival. Hari-harinya adalah festival, yang merupakan bulan Mawar Aban, dan pada akhir lima hari Farudjan. Azramah, dan pada hari pertama bulan ini, Kusaj pergi menunggang keledainya di Irak dan tanah Persia, kemudian Dimah, Bahmanah, dan Isfandarmahah. Setelah bulan-bulan, lima hari adalah hari yang melupakan {cite:Muruj-al-Dhahab, hlm. 507-508}."
