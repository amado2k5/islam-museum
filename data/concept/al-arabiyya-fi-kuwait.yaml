label:
  ar: "العربية في الكويت"
  en: "Arabic in Kuwait"
  ur: "کویت میں عربی"
  fr: "L'arabe au Koweït"
  es: "El árabe en Kuwait"
summary:
  ar: "ما وُجد عن العربية في الكويت: المادتان 3 و82 من الدستور كما يعرضهما Constitute، وإشارتان عابرتان في دراسة مكتبة الكونغرس إلى الفارسية وإلى عمال آسيويين لا يتكلمون العربية، واسم اللهجة الكويتية الحضرية في شجرة Glottolog، مع بيان ما لم يُعثر عليه."
  en: "What was found on Arabic in Kuwait: Articles 3 and 82 of the Constitution as the Constitute Project shows them, two passing remarks in the Library of Congress study on Farsi and on Asian workers who do not speak Arabic, and the name of the Kuwaiti Hadari variety in Glottolog's tree, with a statement of what was not found."
  ur: "کویت میں عربی کے بارے میں جو ملا: دستور کی دفعات 3 اور 82 جیسا Constitute دکھاتا ہے، لائبریری آف کانگریس کی تحقیق کے فارسی اور عربی نہ بولنے والے ایشیائی کارکنوں پر دو سرسری اشارے، اور Glottolog کے شجرے میں کویتی حضری قسم کا نام، اور جو نہیں ملا اس کا بیان۔"
  fr: "Ce qui a été trouvé sur l'arabe au Koweït : les articles 3 et 82 de la Constitution tels que les montre le Constitute Project, deux remarques en passant de l'étude de la Bibliothèque du Congrès sur le persan et sur des travailleurs asiatiques qui ne parlent pas l'arabe, et le nom de la variété hadari koweïtienne dans l'arbre de Glottolog, avec l'énoncé de ce qui n'a pas été trouvé."
  es: "Lo que se encontró sobre el árabe en Kuwait: los artículos 3 y 82 de la Constitución tal como los muestra el Constitute Project, dos observaciones de pasada del estudio de la Biblioteca del Congreso sobre el persa y sobre trabajadores asiáticos que no hablan árabe, y el nombre de la variedad hadari kuwaití en el árbol de Glottolog, con el enunciado de lo que no se halló."
