summary:
  ar: "ذراريح في الكتاب حيوان يشبه الفسافس إلا أنه أحمر، حار حريف معفن محرق، ينقل الكتاب أنه يقلع الثآليل ويطلى به على الأورام السرطانية والجرب والقوابي، وقيل إنه يقلع الظفرة، وفيه تقارير عن أثر القليل منه في البول وعن ضرره الشديد في المثانة والبدن؛ وفيه نقل موسوم عن الطمث في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v1 p.720}"
  en: "Dharariih is in the book an animal that resembles the fasafis except that it is red, hot, acrid, putrefying and burning; the book reports that it removes warts and is applied to cancerous swellings, scab and qawabi, it is said to remove pterygium, and it carries reports on its action on urine in small amounts and on its severe harm to the bladder and body; it has a labelled listing on menses in a section held for the founder's ruling {cite:canon-ibn-sina-print-v1 p.720}"
  ur: "ذراریح کتاب میں ایک جانور ہے جو فسافس سے مشابہ ہے مگر سرخ ہے، گرم، تیز، سڑانے والا اور جلانے والا؛ کتاب نقل کرتی ہے کہ یہ مسوں کو ہٹاتا ہے اور سرطانی ورموں، جرب اور قوابی پر لگایا جاتا ہے، کہا گیا کہ یہ ناخنہ کو دور کرتا ہے، اور اس کے تھوڑے سے پیشاب پر اثر اور مثانے اور بدن کو شدید نقصان کی رپورٹیں اس میں ہیں؛ حیض کے بارے میں ایک موسوم نقل بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v1 p.720}۔"
  es: "En el libro, Dharariih es un animal que se asemeja al fasafis, excepto que es rojo, caliente, acre, putrefacto y ardiente; el libro informa que elimina las verrugas y se aplica a hinchazones cancerosas, costras y qawabi; se dice que elimina el pterigión, y contiene informes sobre su acción en la orina en pequeñas cantidades y sobre el daño severo que causa a la vejiga y al cuerpo; tiene una lista etiquetada sobre la menstruación en una sección reservada para el dictamen del fundador {cite:canon-ibn-sina-print-v1 p.720}"
  fr: "Le Dharariih est décrit dans le livre comme un animal ressemblant au fasafis, à ceci près qu'il est rouge, chaud, âcre, putréfiant et brûlant. Le livre rapporte qu'il enlève les verrues et est appliqué sur les tumeurs cancéreuses, les croûtes et le qawabi. Il est dit qu'il guérit le ptérygion et il contient des rapports sur son action sur l'urine en petites quantités et sur ses graves effets néfastes sur la vessie et le corps. Il comporte une section, sous forme de légende, consacrée aux menstruations et réservée à l'avis du fondateur. {cite:canon-ibn-sina-print-v1 p.720}"
  tr: "Kitapta yosuna benzeyen ama kırmızı, sıcak, baharatlı, çürümüş ve yanan bir hayvandan bahsedilir. Kitapta siğilleri çıkardığı ve kanserli tümörler, uyuz ve qabileri kaplamak için kullanıldığı belirtilir. Dhabı çıkardığı söylenir. İdrarda az miktarda iz ve mesane ile vücuda ciddi zarar verdiğine dair raporlar içerir; ayrıca kurucunun kuralı hakkında yorum yapan bir bölümde adet başlıklı bir alıntı vardır {cite:canon-ibn-sina-print-v1 s.720}"
  id: "Buku ini menyebutkan hewan yang menyerupai lumut tetapi merah, panas, pedas, busuk, dan terbakar. Buku ini melaporkan bahwa hewan ini menghilangkan kutil dan digunakan untuk melapisi tumor kanker, kudis, dan qabi. Dikatakan dapat menghilangkan dhab. Buku ini memuat laporan tentang jejak sedikit urin dan kerusakan parah pada kandung kemih dan tubuh; dan ada kutipan berjudul tentang menstruasi dalam bagian yang mengomentari aturan pendiri {cite:canon-ibn-sina-print-v1 hlm.720}"
