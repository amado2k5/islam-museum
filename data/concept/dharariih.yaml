summary:
  fr: "L'ouvrage décrit un animal semblable aux fasafis mais rouge, chaud, âcre, putréfiant et brûlant. Il enlèverait les verrues et serait appliqué aux tuméfactions cancéreuses, à la gale et aux qawabi, et retirerait le ptérygion. Sont rapportés ses effets diurétiques à faible quantité et ses dommages graves à la vessie et au corps ; une mention des règles figure dans une section en attente de décision du fondateur {cite:canon-ibn-sina-print-v1 p.720}."
  ar: "ذراريح في الكتاب حيوان يشبه الفسافس إلا أنه أحمر، حار حريف معفن محرق، ينقل الكتاب أنه يقلع الثآليل ويطلى به على الأورام السرطانية والجرب والقوابي، وقيل إنه يقلع الظفرة، وفيه تقارير عن أثر القليل منه في البول وعن ضرره الشديد في المثانة والبدن؛ وفيه نقل موسوم عن الطمث في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v1 p.720}"
  en: "Dharariih is in the book an animal that resembles the fasafis except that it is red, hot, acrid, putrefying and burning; the book reports that it removes warts and is applied to cancerous swellings, scab and qawabi, it is said to remove pterygium, and it carries reports on its action on urine in small amounts and on its severe harm to the bladder and body; it has a labelled listing on menses in a section held for the founder's ruling {cite:canon-ibn-sina-print-v1 p.720}"
  ur: "ذراریح کتاب میں ایک جانور ہے جو فسافس سے مشابہ ہے مگر سرخ ہے، گرم، تیز، سڑانے والا اور جلانے والا؛ کتاب نقل کرتی ہے کہ یہ مسوں کو ہٹاتا ہے اور سرطانی ورموں، جرب اور قوابی پر لگایا جاتا ہے، کہا گیا کہ یہ ناخنہ کو دور کرتا ہے، اور اس کے تھوڑے سے پیشاب پر اثر اور مثانے اور بدن کو شدید نقصان کی رپورٹیں اس میں ہیں؛ حیض کے بارے میں ایک موسوم نقل بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v1 p.720}۔"
