label: { ar: "مياه المطر والآبار والقنى عند ابن سينا", en: "Rain, well and underground channel waters in the Canon", ur: "قانون میں بارش، کنووں اور قناتوں کے پانی", es: "Aguas pluviales, de pozos y de canales subterráneos en el Cañón", fr: "Eau de pluie, eau de puits et eau des canaux souterrains dans le Canon", tr: "İbn Sina'da yağmur suyu, kuyular ve kanallar", id: "Air hujan, sumur, dan kanal di Ibn Sina" }
summary:
  ar: "يذكر ابن سينا أن من المياه الفاضلة ماء المطر، وخصوصاً الصيفي ومن سحاب راعد، بخلاف ما يكون من سحاب ذي رياح عاصفة فهو كدر مغشوش الجوهر. لكن العفونة تبادر إلى ماء المطر لشدة رقته، فتضر بالصدر والصوت، ويقل قبوله للعفونة إذا بودر إلى إغلائه، وتؤمن مضرته بتناول الحموضات {cite:canon-ibn-sina-print-v1 p.136}."
  en: "Ibn Sina counts rain water among the excellent waters, especially summer rain from thundering cloud, as opposed to rain from cloud driven by violent winds, which is turbid and of mixed substance. Because it is so thin, however, putrefaction comes quickly to rain water and harms the chest and the voice. It is less open to putrefaction if boiled promptly, and its harm is made safe by taking sour things {cite:canon-ibn-sina-print-v1 p.136}."
  es: "Ibn Sina considera que el agua de lluvia es excelente, especialmente la lluvia de verano proveniente de nubes tormentosas, a diferencia de la lluvia de nubes impulsadas por vientos violentos, que es turbia y de consistencia mixta. Sin embargo, debido a su baja viscosidad, el agua de lluvia se pudre rápidamente y daña el pecho y la voz. Es menos propensa a la putrefacción si se hierve de inmediato, y su daño se mitiga consumiendo alimentos ácidos {cite:canon-ibn-sina-print-v1 p.136}."
  fr: "Ibn Sina compte l'eau de pluie parmi les eaux excellentes, en particulier la pluie d'été due aux orages, par opposition à la pluie chassée par des vents violents, qui est trouble et de composition hétérogène. Cependant, sa grande fluidité la rend sujette à la putréfaction et peut nuire à la poitrine et à la voix. Elle est moins sujette à la putréfaction si elle est bouillie rapidement, et ses effets néfastes sont atténués par la consommation d'aliments acides {cite:canon-ibn-sina-print-v1 p.136}."
  ur: "ابن سینا بارش کے پانی کو بہترین پانیوں میں شمار کرتا ہے، خاص طور پر گرجنے والے بادل سے موسم گرما میں ہونے والی بارش، اس کے برعکس بادل سے آنے والی بارش جو کہ پرتشدد ہواؤں سے ہوتی ہے، جو کہ گندگی اور مخلوط مادہ سے ہوتی ہے۔ چونکہ یہ بہت پتلا ہے، تاہم، بارش کے پانی میں گڑبڑ جلدی آتی ہے اور سینے اور آواز کو نقصان پہنچاتی ہے۔ اگر اسے فوری طور پر ابال لیا جائے تو اس کا نقصان کم ہوتا ہے اور کھٹی چیزوں کو کھانے سے اس کے نقصانات کو محفوظ کیا جاتا ہے۔"
  tr: "İbn Sina, saf sular arasında yağmur suyu, özellikle yaz suyu ve gök gürültüsü bulutları olduğunu, fırtınalı rüzgarlı bulutların ise bozuk doğaya sahip bulutların aksine, belirtir. Ancak çürümüş olanlar, aşırı hassaslığı nedeniyle yağmur suyuna koşar; bu da göğüs ve sese zarar verir, kaynatıldığında çürümeyi kabullenme azalır ve zararı asit tüketimiyle doğrulanır {cite:canon-ibn-sina-print-v1 s.136}."
  id: "Ibn Sina menyebutkan bahwa di antara air murni terdapat air hujan, terutama air musim panas, dan awan petir, berbeda dengan awan dengan angin badai, yang merupakan awan dengan sifat terdistorsi. Namun, awan busuk mengalir ke air hujan karena sangat sensitif, yang merusak dada dan suara, dan penerimaan peluruhannya berkurang jika direbus, dan kerusakannya dikonfirmasi dengan konsumsi asam {cite:canon-ibn-sina-print-v1 hlm.136}."
