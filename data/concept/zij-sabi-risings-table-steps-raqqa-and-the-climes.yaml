label: { ar: "مطالع البروج بالرقة درجة درجة وفي الأقاليم بعشر درجات في الزيج الصابي", en: "The risings tables: degree by degree for al-Raqqa, ten by ten for the climes", ur: "رقہ کے لیے درجہ بہ درجہ اور اقلیموں کے لیے دس دس درجے کے مطالع کے جدول", es: "Las tablas de ascensos: grado por grado para al-Raqqa, diez por diez para los climas.", fr: "Tableaux des hausses: degré par degré pour al-Raqqa, dix par dix pour les climats", tr: "Rakka'da burçların yükselişi, Sabii astronomik tablolarına göre birer derece, diğer bölgelerde ise onar derece olarak ölçülür.", id: "Terbitnya zodiak di Raqqa diukur satu derajat setiap kali, dan di wilayah lain diukur sepuluh derajat, menurut tabel astronomi Sabian." }
summary:
  ar: "يثبت البتاني مطالع البروج بمدينة الرقة على تفاضل درجة كاملة، وفي باقي الأقاليم على تفاضل عشر درجات، لقلة الاختلاف الواقع بين المطالع في مقدار هذا التفاضل، ويجعل التفاضل في زيادة النهار بين الجداول خطوة أدق من نصف الساعة ليصح عمل المطالع ويُحكم. {cite:zij-sabi-nallino-byblion p.44}."
  en: "Al-Battani sets down the risings of the signs for the city of al-Raqqa at a step of a whole degree, and for the other climes at a step of ten degrees, because the difference between the risings is small over a step of that size, and he makes the step in the increase of the day between the tables finer than half an hour so that the use of the risings is exact and sound. {cite:zij-sabi-nallino-byblion p.44}."
  ur: "البتانی رقہ شہر کے لیے بروج کے مطالع ایک پورے درجے کے وقفے پر اور باقی اقلیموں کے لیے دس درجے کے وقفے پر درج کرتے ہیں، کیونکہ اتنے وقفے میں مطالع کے بیچ کا فرق کم ہوتا ہے، اور جدولوں کے بیچ دن کی زیادتی کا وقفہ آدھے گھنٹے سے باریک رکھتے ہیں تاکہ مطالع کا عمل درست اور محکم ہو۔ {cite:zij-sabi-nallino-byblion p.44}۔"
  es: "Al-Battani establece las elevaciones de los signos para la ciudad de al-Raqqa con un intervalo de un grado completo, y para los demás climas con un intervalo de diez grados, porque la diferencia entre las elevaciones es pequeña en un intervalo de ese tamaño, y hace que el incremento del día entre las tablas sea menor que media hora para que el uso de las elevaciones sea exacto y correcto. {cite:zij-sabi-nallino-byblion p.44}."
  fr: "Al-Battani établit les levers des signes pour la ville d'al-Raqqa par incréments d'un degré entier, et pour les autres régions par incréments de dix degrés, car la différence entre les levers est faible sur une telle échelle. Il effectue également un pas de moins d'une demi-heure dans l'augmentation du jour entre les tables, afin que l'utilisation des levers soit exacte et fiable. {cite:zij-sabi-nallino-byblion p.44}."
  tr: "El-Battani, burçların doğuş noktalarını Rakka şehrinde bir derecelik bir farkla, diğer bölgelerde ise on derecelik bir farkla belirler; bunun nedeni, doğuş noktaları arasındaki farkın büyüklüğünün küçük olmasıdır. Doğuş noktalarının doğruluğunu ve güvenilirliğini sağlamak için, tablolar arasındaki gün uzunluğu farkını yarım saatten daha hassas bir adımda belirler. {cite:zij-sabi-nallino-byblion s.44}"
  id: "Al-Battani menetapkan titik terbit zodiak di kota Raqqa dengan selisih satu derajat, dan di wilayah lain dengan selisih sepuluh derajat, karena perbedaan kecil dalam besarnya selisih antara titik terbit tersebut. Ia membuat perbedaan panjang hari antara tabel dengan langkah yang lebih tepat daripada setengah jam untuk memastikan keakuratan dan keandalan titik terbit. {cite:zij-sabi-nallino-byblion p.44}."
