id: concept/zij-sabi-moon-above-or-below-the-earth-for-parallax
class: concept
kind: scientific
label: { ar: "القمر فوق الأرض أو تحتها عند حساب المنظر", en: "Whether the Moon is above or below the horizon in the parallax reckoning", ur: "منظر کے حساب میں چاند زمین کے اوپر ہے یا نیچے", es: "Si la Luna está por encima o por debajo del horizonte en el cálculo de paralaje", fr: "Que la Lune soit au-dessus ou en dessous de l'horizon dans le calcul de la parallaxe", tr: "Paralaks hesaplanırken Ay'ın Dünya'nın üstünde mi yoksa altında mı olduğu dikkate alınır.", id: "Saat menghitung paralaks, bulan berada di atas atau di bawah Bumi." }
summary:
  ar: "قبل تطبيق اختلاف المنظر يعرف الحاسب هل القمر فوق الأرض أو تحتها: فإن كان الجزء الذي فيه القمر بين الجزء الغارب والجزء الطالع ويلي وسط السماء فهو فوق الأرض، وإن خالف ذلك فهو تحت الأرض. {cite:zij-sabi-nallino-byblion p.125}."
  en: "Before applying the parallax the reckoner decides whether the Moon is above or below the ground: if the Moon's degree lies between the setting degree and the rising degree and on the side of mid-heaven, it is above the ground; if not, it is below. {cite:zij-sabi-nallino-byblion p.125}."
  ur: "منظر کا اطلاق کرنے سے پہلے حساب دان یہ طے کرتا ہے کہ چاند زمین کے اوپر ہے یا نیچے: اگر چاند کا درجہ غروب کرنے والے درجے اور طلوع کرنے والے درجے کے درمیان ہو اور وسط السماء کی جانب ہو تو وہ اوپر ہے، ورنہ نیچے۔ {cite:zij-sabi-nallino-byblion p.125}۔"
  es: "Antes de aplicar la paralaje, el observador decide si la Luna está por encima o por debajo del suelo: si el grado de la Luna se encuentra entre el grado de puesta y el grado de salida y del lado del medio cielo, está por encima del suelo; de lo contrario, está por debajo. {cite:zij-sabi-nallino-byblion p.125}."
  fr: "Avant d'appliquer la parallaxe, l'observateur détermine si la Lune est au-dessus ou en dessous du sol: si le degré de la Lune se situe entre le degré du coucher et le degré du lever, et du côté du milieu du ciel, elle est au-dessus du sol; sinon, elle est en dessous. {cite:zij-sabi-nallino-byblion p.125}."
  tr: "Paralaks efekti uygulanmadan önce, bilgisayar ayın Dünya'nın üstünde mi yoksa altında mı olduğunu belirler: eğer ayın bulunduğu kısım batan ve doğan kısımlar arasında ve gökyüzünün ortasına yakınsa, Dünya'nın üstündedir; aksi takdirde, Dünya'nın altındadır. {cite:zij-sabi-nallino-byblion s.125}."
  id: "Sebelum menerapkan efek paralaks, komputer menentukan apakah bulan berada di atas atau di bawah Bumi: jika bagian yang berisi bulan berada di antara bagian terbenam dan terbit dan berada di dekat tengah langit, maka bulan berada di atas Bumi; jika tidak, bulan berada di bawah Bumi. {cite:zij-sabi-nallino-byblion p.125}."
