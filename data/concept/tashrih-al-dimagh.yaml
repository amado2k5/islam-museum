summary:
  ar: "يصف ابن سينا الدماغ جوهراً حجابياً ومخياً وتجاويف مملوءة روحاً، ويذكر مزاجه وغشاءيه وبطونه الثلاثة ومجرييه لدفع الفضول {cite:canon-ibn-sina-print-v2 pp.5-9}"
  en: "Ibn Sina describes the brain as a membranous substance, a marrow-like substance and cavities filled with spirit, and gives its temperament, its two membranes, its three ventricles and its two channels for expelling superfluities {cite:canon-ibn-sina-print-v2 pp.5-9}"
  ur: "ابن سینا دماغ کو ایک حجابی جوہر، ایک مخی جوہر اور روح سے بھرے ہوئے خانوں کی صورت میں بیان کرتا ہے، اور اس کا مزاج، اس کی دو جھلیاں، اس کے تین بطون اور فضلات نکالنے کی دو گزرگاہیں ذکر کرتا ہے {cite:canon-ibn-sina-print-v2 pp.5-9}۔"
  es: "Ibn Sina describe el cerebro como una sustancia membranosa, una sustancia similar a la médula y cavidades llenas de espíritu, y da su temperamento, sus dos membranas, sus tres ventrículos y sus dos canales para expulsar superfluidades {cite:canon-ibn-sina-print-v2 pp.5-9}"
