summary:
  ar: "يفرق ابن سينا بين الأبيض بمعنى المشف الرقيق والأبيض الحقيقي الغليظ، ويذكر أنواع الأبيض الحقيقي المخاطي والدسمي والإهالي والشبيه بالمني ودلالة كل منها {cite:canon-ibn-sina-print-v1 p.187}."
  en: "Ibn Sina separates white in the sense of thin and transparent from true white, which is thick, and lists the kinds of true white, mucous, fatty, tallowy and semen-like, and what each shows {cite:canon-ibn-sina-print-v1 p.187}."
  es: "Ibn Sina separa el blanco en el sentido de fino y transparente del blanco verdadero, que es espeso, y enumera los tipos de blanco verdadero, mucoso, graso, sebáceo y parecido al semen, y lo que muestra cada uno {cite:canon-ibn-sina-print-v1 p.187}."
  fr: "Ibn Sina distingue le blanc au sens de fin et transparent du vrai blanc, qui est épais, et énumère les types de vrai blanc, muqueux, gras, suif et semblable à du sperme, et ce que chacun montre {cite:canon-ibn-sina-print-v1 p.187}."
