id: concept/canon-signs-of-fullness
class: concept
kind: scientific
label:
  ar: "علامات الامتلاء عند ابن سينا"
  en: "The signs of fullness in the Canon"
  fr: "Signes de pléthore dans le Canon"
  ur: "بھراؤ کی علامات قانون میں"
  es: "Los signos de plenitud en el Canon"
  tr: "İbn Sina'ya göre doluluk belirtileri"
  id: "Tanda-tanda kepenuhan menurut Avicenna"
summary:
  ar: "يجمع ابن سينا علامات الامتلاء جملة، ثم يفرق بين علامات الامتلاء بحسب الأوعية وبحسب القوة، ويذكر الأحلام الدالة على كل منهما {cite:canon-ibn-sina-print-v1 p.164}."
  en: "Ibn Sina gathers the signs of fullness in general, then separates those of fullness of the vessels from those of fullness of the faculty, and notes the dreams that point to each {cite:canon-ibn-sina-print-v1 p.164}."
  fr: "Ibn Sina rassemble les signes généraux de pléthore, distingue pléthore des vaisseaux et de la faculté, puis note les rêves propres à chacune {cite:canon-ibn-sina-print-v1 p.164}."
  es: "Ibn Sina reúne los signos de plenitud en general, luego separa los de plenitud de los vasos de los de plenitud de la facultad, y anota los sueños que apuntan a cada uno {cite:canon-ibn-sina-print-v1 p.164}."
  ur: "ابن سینا عام طور پر معموری کی علامات کو جمع کرتا ہے، پھر برتنوں کی معموری کی علامتوں کو فیکلٹی کے مکمل ہونے سے الگ کرتا ہے، اور ان خوابوں کو نوٹ کرتا ہے جو ہر ایک کی طرف اشارہ کرتے ہیں۔"
  tr: "İbn Sina, doluluk işaretlerini bütünüyle toplar, ardından doluluk işaretlerini kaplar ve güçlere göre ayırır ve her {cite:canon-ibn-sina-print-v1 s.164} gösteren rüyalardan bahseder."
  id: "Ibn Sina mengumpulkan tanda-tanda kepenuhan secara keseluruhan, lalu membedakan antara tanda-tanda kepenuhan berdasarkan wadah dan kekuatan, dan menyebutkan mimpi-mimpi yang menunjukkan masing-masing {cite:canon-ibn-sina-print-v1 hlm.164}."
