summary:
  ar: "المتاجرة بالنقود عند المؤلف: إذا كانت المبادلة نقداً بنقد من جنس واحد فلا بد من التقابض وعدم التفاضل، وإذا اختلف النقدان جاز التفاضل مع التقابض يداً بيد، وهي عمليات المصارفة {cite:usul-iqtisad-islami-0660 p. 355}. أما نقد بنقد أحدهما معجل والآخر مؤجل فغير جائز، لأنه ذريعة إلى ربا النسيئة {cite:usul-iqtisad-islami-0660 p. 355}."
  tr: "Yazara göre para ticareti: Eğer değişim nakit karşılığında aynı türden para ise, karşılıklı değişim gereklidir ve ayrım yoktur. İki para birimi farklıysa, el ele değişim yapılabilir; bunlar değişim işlemleridir {cite:usul-iqtisad-islami-0660 s. 355}. Nakit değişim ise biri hızlandırılır, diğeri ertelenir, bu kabul edilemez çünkü bu tefecilik için bir bahanedir {cite:usul-iqtisad-islami-0660, s. 355}."
  id: "Perdagangan uang menurut penulis: Jika pertukaran adalah uang tunai dengan uang yang sama, maka pertukaran timbal balik diperlukan dan tidak ada pembedaan. Jika kedua mata uang berbeda, diperbolehkan untuk pertukaran tangan kosong, yang merupakan operasi pertukaran {cite:usul-iqtisad-islami-0660 hlm. 355}. Adapun pertukaran tunai, satu dipercepat dan yang lain ditunda, tidak diperbolehkan, karena itu adalah dalih untuk riba {cite:usul-iqtisad-islami-0660, hlm. 355}."
