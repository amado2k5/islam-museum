label: { ar: "القيافة", en: "Qiyafa (likeness-reading)" }
summary:
  ar: "صناعة الجاهلية في إلحاق الأشكال بأشباهها وقفو الأثر: تنازع الناس فيها فأثبتها قوم لأن الأشباه تنزع ولا يجوز أن يكون الولد غير مشبه لأبيه في جهة من الجهات، وأنكرها آخرون لأن التشابه في حد الإنسانية لا يوجب الإلحاق؛ وهي من خواص العرب عند المسعودي، للقائف الفطن المتدرب، والقيافة لبني مدلج وأحياء مضر بن نزار لما كان من فعل بني نزار الأربعة حين وصفوا الجمل الشارد قيافة، وأهل المياه أكهن وأهل البر الفائح أقوف، وبأرض الجفار بين مصر والشام قصاص يقصون آثار الأقدام على الرمل فيعرفون أصحابها ولم يروهم، وقفت القافة بقريش إلى باب غار ثور حين الهجرة فحجبهم الله بما كان من نسج العنكبوت وقول القائف إلى هنا انتهت الأقدام، وتنازع الفقهاء في الحكم بها فأثبتها قوم لتصديق النبي محرزاً المدلجي وأنكرها آخرون لإلحاقه الولد بأبيه مع عدم التشابه حين قال لعل عرقاً نزع {cite:muruj-al-dhahab p. 478-481}. ويقال إن الكهانة لليمن والزجر لبني أسد والقيافة لبني مدلج وأحياء مضر لما كان من فعل بني نزار الأربعة في نعتهم البعير الشارد، وأهل المياه أكهن وأهل البر الفائح أقوف وأهل الجبال والقفار أزجر وأعرف، وبأرض الجفار بين مصر والشام قوم يعرفون آخذ ثمرهم بأثره بعد سنين، ورأى المسعودي بهذه الأرض القصاص يطوفون في الرمل يخبرون ولاة المنازل أي الناس طرقها، وذهب قوم من فقهاء الأمصار إلى الحكم بالقيافة تصديقاً للنبي محرزاً المدلجي وأنكره جماعة بحديث لعل عرقاً نزع وقصة شريك بن سحهاء {cite:muruj-al-dhahab p. 480-481}"
  en: "The art of tracing likeness — reading footprints and kinship resemblance: debated by the ancients, a speciality of Banu Mudlij and the Mudar tribes, famous in the Jafar trackers and in the Qurashi pursuers whom the spider's web turned back at the cave of Thawr; jurists disputed its evidential force {cite:muruj-al-dhahab p. 478-481}."
