label: { ar: "القيافة", en: "Qiyafa (likeness-reading)", es: "Qiyafa (lectura de la semejanza)", fr: "Qiyafa (lecture de ressemblance)", ur: "قیافہ ⁦(مشابہت پڑھنا)⁩", tr: "El-Qayafa", id: "Al-Qayafa" }
summary:
  ar: "صناعة الجاهلية في إلحاق الأشكال بأشباهها وقفو الأثر: تنازع الناس فيها فأثبتها قوم لأن الأشباه تنزع ولا يجوز أن يكون الولد غير مشبه لأبيه في جهة من الجهات، وأنكرها آخرون لأن التشابه في حد الإنسانية لا يوجب الإلحاق؛ وهي من خواص العرب عند المسعودي، للقائف الفطن المتدرب، والقيافة لبني مدلج وأحياء مضر بن نزار لما كان من فعل بني نزار الأربعة حين وصفوا الجمل الشارد قيافة، وأهل المياه أكهن وأهل البر الفائح أقوف، وبأرض الجفار بين مصر والشام قصاص يقصون آثار الأقدام على الرمل فيعرفون أصحابها ولم يروهم، وقفت القافة بقريش إلى باب غار ثور حين الهجرة فحجبهم الله بما كان من نسج العنكبوت وقول القائف إلى هنا انتهت الأقدام، وتنازع الفقهاء في الحكم بها فأثبتها قوم لتصديق النبي محرزاً المدلجي وأنكرها آخرون لإلحاقه الولد بأبيه مع عدم التشابه حين قال لعل عرقاً نزع {cite:muruj-al-dhahab p. 478-481}. ويقال إن الكهانة لليمن والزجر لبني أسد والقيافة لبني مدلج وأحياء مضر لما كان من فعل بني نزار الأربعة في نعتهم البعير الشارد، وأهل المياه أكهن وأهل البر الفائح أقوف وأهل الجبال والقفار أزجر وأعرف، وبأرض الجفار بين مصر والشام قوم يعرفون آخذ ثمرهم بأثره بعد سنين، ورأى المسعودي بهذه الأرض القصاص يطوفون في الرمل يخبرون ولاة المنازل أي الناس طرقها، وذهب قوم من فقهاء الأمصار إلى الحكم بالقيافة تصديقاً للنبي محرزاً المدلجي وأنكره جماعة بحديث لعل عرقاً نزع وقصة شريك بن سحهاء {cite:muruj-al-dhahab p. 480-481}"
  en: "The art of tracing likeness — reading footprints and kinship resemblance: debated by the ancients, a speciality of Banu Mudlij and the Mudar tribes, famous in the Jafar trackers and in the Qurashi pursuers whom the spider's web turned back at the cave of Thawr; jurists disputed its evidential force {cite:muruj-al-dhahab p. 478-481}."
  es: "El arte de rastrear semejanzas —leer huellas y semejanza de parentesco— fue objeto de debate entre los antiguos, una especialidad de los Banu Mudlij y las tribus Mudar, famosas en los rastreadores Jafar y en los perseguidores Qurashi a quienes la telaraña hizo retroceder en la cueva de Thawr; los juristas disputaron su fuerza probatoria {cite:muruj-al-dhahab p. 478-481}."
  fr: "L'art de tracer les ressemblances — lire les empreintes et les ressemblances de parenté: débattu par les anciens, une spécialité des Banu Mudlij et des tribus Mudar, célèbre chez les pisteurs Jafar et chez les poursuivants Qurashi que la toile d'araignée a repoussés dans la grotte de Thawr; les juristes ont contesté sa force probante {cite:muruj-al-dhahab p. 478-481}."
  ur: "مماثلت کا پتہ لگانے کا فن - پیروں کے نشانات اور قرابت کی مشابہت کو پڑھنا: قدیموں کی طرف سے بحث کی گئی، بنو مدلج اور مدر قبائل کی ایک خاصیت، جعفر ٹریکروں اور قریشیوں کے تعاقب میں مشہور ہیں جن کا غار ثور میں مکڑی کا جالا واپس پلٹ گیا؛ فقہاء نے اس کی ظاہری قوت سے اختلاف کیا {حوالہ: مروج الذہب ص۔ 478-481}۔"
  tr: "İslam öncesi sanat, şekillerin benzerliklerine bağlanması ve izlerin askıya alınması: insanlar buna itiraz etti, bu yüzden bazıları benzerlikler ortadan kalktığı için bunu ortaya koydu ve bir çocuğun babasından hiçbir şekilde farklı olması kabul edilemez. Diğerleri ise insanlık açısından benzerlik bağlanmayı gerektirmediği için bunu reddetti; bu, bilge ve eğitimli kafiyeci El-Mes'udi'ye göre Arapların bir özelliğidir; çünkü dört Banu Nizar'ın başıboş deve Kıyafe'yi, su halkı en bol olanı ve toprak halkı bol Akuf ve Cafar diyarını tanımlarken yaptıkları eylemler nedeniyle Mısır ile Levant arasında, sahiplerinin kimliği belirlenmek için kumda ayak izleri izlendiği ancak onları görmedikleri bir misilleme vardır. Kervan, göç sırasında Kureyş ile birlikte Thawr Mağarası'nın kapısında durdu, ancak Tanrı, örümceğin dokuması ve Kayef'in ayakların burada bittiğini söylemesi nedeniyle onları sakladı. Hukukçular bu karara itiraz etti, bazıları Peygamber'e inandığını ve El-Medacı'yı onayladı, bazıları ise çocuğun babasıyla bağlantılı olduğunu iddia etti, ancak belki bir damar çıkarılmış dediğinde benzerlik yoktu {cite:muruj-al-dhahab, s. 478-481}. Falın Yemen için, azarlamanın Banu Asad için, El-Kıyafa'nın Banu Mudlij için olduğu ve Mudar mahallelerinin dört Banu Nizar'ın onları başıboş deve olarak tanımlaması nedeniyle olduğu söylenir. Su halkı en falcı, toprak halkı en yatıştırıcı, çöl halkı en çok kahin, dağ ve çöl halkı ise daha akıllıca ve bilgilidir. Mısır ile Levant arasındaki Jafar topraklarında, meyvelerini yıllar sonra bilen insanlar vardır. El-Mes'udi bu toprağı bir intikam olarak gördü; kumda dolaşıyor, evlerin yöneticilerine, yani halka anlatıyordu. Kayyafe'nin yönettiği eyaletlerden bazı fıhiller, Peygamber'i onaylamak için El-Mudlaji'yi onayladı, bazıları ise belki bir ırkın kaldırıldığını söyleyen bir hadis ve Şerik ibn Sahha'nın hikayesini anlatarak reddetti {alıntı:] Muruj-al-Dhahab, s. 480-481}"
  id: "Seni pra-Islam dalam menempelkan bentuk pada kemiripan mereka dan penangguhan jejak: orang-orang memperdebatkannya, sehingga beberapa menetapkannya karena kesamaan dihilangkan, dan tidak diperbolehkan bagi seorang anak untuk berbeda dengan ayahnya dalam hal apa pun. Yang lain menyangkalnya karena kesamaan dalam hal kemanusiaan tidak memerlukan keterikatan; ini adalah ciri khas orang Arab menurut Al-Mas'udi, seorang pengiring rima yang bijak dan terlatih, Qayyafah Banu Madlij dan hidup Mudar ibn Nizar, karena tindakan keempat Banu Nizar ketika mereka menggambarkan unta liar Qiyafah, orang air yang paling produktif, dan penduduk tanah ini Aquf yang melimpah, serta tanah Jafar Antara Mesir dan Levant, terjadi pembalasan di mana jejak kaki digambar di pasir untuk mengidentifikasi pemiliknya tetapi belum pernah melihatnya. Karavan berdiri bersama Quraisy di gerbang Gua Thawr selama migrasi, tetapi Tuhan menahan mereka karena tenunan laba-laba dan kata-kata Qayef bahwa kaki berakhir di sini. Para ahli hukum membantah keputusan itu, sehingga beberapa menganggapnya percaya kepada Nabi, mengonfirmasi Al-Madlaji, sementara yang lain menyangkal karena anak itu terkait dengan ayahnya, meskipun tidak ada kesamaan ketika dia mengatakan mungkin ada pembuluh darah yang diangkat {cite:muruj-al-dhahab, hlm. 478-481}. Dikatakan bahwa ramalan untuk Yaman, teguran untuk Banu Asad, Al-Qiyafa untuk Banu Mudlij, dan lingkungan Mudar adalah akibat tindakan empat Banu Nizar yang menggambarkan mereka sebagai unta liar. Orang air adalah ramalan paling banyak, penduduk tanah ini paling menenangkan, penduduk gurun adalah yang paling menenangkan, dan penduduk gunung serta gurun lebih mudah dibantah dan berpengetahuan. Di tanah Jafar, antara Mesir dan Levant, ada orang-orang yang mengetahui buah mereka setelah bertahun-tahun. Al-Mas'udi melihat tanah ini sebagai pembalasan, beredar di pasir, memberitahu penguasa rumah, yaitu rakyat. Beberapa ahli hukum dari provinsi yang diperintah oleh Qayyafah untuk menguatkan Nabi, mengonfirmasi Al-Mudlaji, sementara beberapa menolaknya dengan hadits bahwa mungkin suatu ras telah dihilangkan, dan kisah Sharik ibn Sahha' {cite:muruj-al-dhahab, hlm. 480-481}"
