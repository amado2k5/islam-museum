id: concept/al-yaqza-wa-al-sahar
class: concept
kind: scientific
label:
  ar: "اليقظة والسهر"
  en: "Wakefulness and sleeplessness (al-yaqza wa al-sahar)"
  fr: "La veille et l’insomnie (al-yaqza wa al-sahar)"
  ur: "بیداری اور بے خوابی ⁦(اليقظة والسهر)⁩"
  es: "Vigilia e insomnio (al-yaqza wa al-sahar)"
  tr: "Dikkat ve geç saatlere kadar uyanık kalmak"
  id: "Perhatian dan tetap terjaga sampai larut malam"
summary:
  ar: "يعرّف ابن سينا اليقظة والسهر ويعدّ أسباب السهر من حر ويبس وبورقية الرطوبة ووجع وفكر وضوء وسوء هضم وحميات وورم {cite:canon-ibn-sina-print-v2 p.94}"
  en: "Ibn Sina defines wakefulness and sleeplessness and lists the causes of sleeplessness: heat and dryness, the nitrous quality of moisture, pain, thought, light, bad digestion, fevers and swelling {cite:canon-ibn-sina-print-v2 p.94}"
  fr: "Ibn Sina définit la veille et l’insomnie et énumère les causes de l’insomnie : la chaleur et la sécheresse, la qualité nitreuse de l’humidité, la douleur, la pensée, la lumière, la mauvaise digestion, les fièvres et la tuméfaction {cite:canon-ibn-sina-print-v2 p.94}"
  ur: "ابن سینا بیداری اور بے خوابی کی تعریف کرتا ہے اور بے خوابی کے اسباب گنواتا ہے: گرمی اور خشکی، نمی کی نمکینی ⁦(بورقیة)⁩، درد، فکر، روشنی، بدہضمی، بخار اور سوجن {cite:canon-ibn-sina-print-v2 p.94}۔"
  es: "Ibn Sina define la vigilia y el insomnio y enumera las causas del insomnio: calor y sequedad, la cualidad nitrosa de la humedad, dolor, pensamientos, luz, mala digestión, fiebres e hinchazón {cite:canon-ibn-sina-print-v2 p.94}"
  tr: "İbn Sina, uyanıklığı ve geç saatlere kadar uyanık kalmasıyla bilinir ve geç saatlere kadar uyanık kalmanın nedenlerini sıcaklık, kuruluk, nem, ağrı, düşünce, ışık, hazımsızlık, ateş ve şişlik olarak görür {cite:canon-ibn-sina-print-v2 s.94}"
  id: "Ibn Sina dikenal karena kewaspadaannya dan tetap terjaga hingga larut malam, dan ia mengaitkan alasan begadang adalah suhu, kekeringan, kelembapan, rasa sakit, pikiran, cahaya, gangguan pencernaan, demam, dan pembengkakan {cite:canon-ibn-sina-print-v2 hlm.94}"
