- tradition: other
  id: single-report-yields-certainty
  stance:
    ar: يذهب فريق إلى أن خبر الآحاد يفيد العلم أو اليقين، ويرى الكتاب أن هذا القول يخالف ما استقر عند المحققين
    en: A group holds that a single report yields knowledge or certainty; the book regards this as contrary to what the verifiers settled
  summary:
    ar: "يذكر شلتوت أن بعض العلماء، ومنهم كما في هامش الكتاب ابن حزم في «الأحكام»، قالوا إن خبر الواحد يفيد اليقين، ثم يعرض ردّ البزدوي عليهم وقوله إن ذلك دعوى تُدفع بالبيان. النص لا يسمّي كل القائلين، وهذا عرض الكتاب لا عرض مصدر الرأي نفسه."
    en: "Shaltut notes that some scholars, the footnote naming Ibn Hazm's al-Ihkam, held that a single report gives certainty, and then gives al-Bazdawi's rejoinder that the claim is refuted by explanation; the text does not name every holder, so this is the book's presentation, not the position's own text."
