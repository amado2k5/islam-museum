id: concept/proof-of-belief
class: concept
kind: doctrine
label:
  ar: طريق ثبوت العقيدة
  en: How belief is established
  es: "Cómo se establece la creencia"
  fr: "Comment la croyance s'établit"
  ur: "عقیدہ کیسے قائم ہوتا ہے۔"
summary:
  ar: "مسألة في أصول الدين: بأي دليل تثبت العقيدة؟ يرى محمود شلتوت، ناقلاً عن المتكلمين والأصوليين، أن الإيمان المطلوب لا يحصله إلا دليل قطعي؛ فالدليل العقلي المنتهي إلى الحس أو الضرورة يفيد اليقين، والنقل يفيد اليقين إذا كان متواتراً في ثبوته نصاً في دلالته، أما خبر الآحاد فلا تثبت به العقيدة عند جمهور المحققين، والإجماع المعتبر في العقيدة هو ما عُلم من الدين بالضرورة."
  en: "A question in the principles of religion: by what proof is belief established? Mahmud Shaltut, reporting the theologians and jurists, holds that the required faith needs a conclusive proof; rational proof ending in sense or necessity gives certainty, transmitted proof gives certainty when it is mutawatir in transmission and clear in meaning, and a single report (ahad) does not establish creed for the majority of the verifying scholars."
  es: "Una cuestión fundamental en los principios de la religión es: ¿con qué prueba se establece la creencia? Mahmud Shaltut, citando a teólogos y juristas, sostiene que la fe requerida necesita una prueba concluyente; la prueba racional que culmina en sentido o necesidad da certeza, la prueba transmitida da certeza cuando es mutawatir en su transmisión y clara en su significado, y un solo relato (ahad) no establece el credo para la mayoría de los eruditos verificadores."
  fr: "Une question relative aux principes de la religion: par quelle preuve la croyance est-elle établie ? Mahmud Shaltut, rapportant les théologiens et les juristes, soutient que la foi requise nécessite une preuve concluante; la preuve rationnelle, fondée sur le sens ou la nécessité, apporte la certitude; la preuve transmise apporte la certitude lorsqu’elle est transmise de manière mutawatir et claire dans sa signification; et un seul hadith ne suffit pas à établir un credo pour la majorité des savants vérificateurs."
  ur: "اصول دین میں ایک سوال: عقیدہ کس دلیل سے قائم ہوتا ہے؟ محمود شلتوت، ماہرین الہیات اور فقہا کی رپورٹنگ کرتے ہوئے کہتے ہیں کہ مطلوبہ عقیدے کے لیے ایک حتمی ثبوت کی ضرورت ہے۔ عقلی ثبوت معنوں یا ضرورت پر ختم ہونے سے یقین حاصل ہوتا ہے، نقل شدہ ثبوت اس صورت میں یقینی بناتا ہے جب وہ نقل میں متواتر اور معنی میں واضح ہو، اور ایک روایت ⁦(احد)⁩ جمہور علماء کے نزدیک عقیدہ قائم نہیں کرتی۔"
