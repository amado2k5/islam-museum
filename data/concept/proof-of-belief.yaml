id: concept/proof-of-belief
class: concept
kind: doctrine
label:
  ar: طريق ثبوت العقيدة
  en: How belief is established
summary:
  ar: "مسألة في أصول الدين: بأي دليل تثبت العقيدة؟ يرى محمود شلتوت، ناقلاً عن المتكلمين والأصوليين، أن الإيمان المطلوب لا يحصله إلا دليل قطعي؛ فالدليل العقلي المنتهي إلى الحس أو الضرورة يفيد اليقين، والنقل يفيد اليقين إذا كان متواتراً في ثبوته نصاً في دلالته، أما خبر الآحاد فلا تثبت به العقيدة عند جمهور المحققين، والإجماع المعتبر في العقيدة هو ما عُلم من الدين بالضرورة."
  en: "A question in the principles of religion: by what proof is belief established? Mahmud Shaltut, reporting the theologians and jurists, holds that the required faith needs a conclusive proof; rational proof ending in sense or necessity gives certainty, transmitted proof gives certainty when it is mutawatir in transmission and clear in meaning, and a single report (ahad) does not establish creed for the majority of the verifying scholars."
wings: [ideas]
themes:
- creed
periods:
- period/prophetic-era
regions:
- global
issue:
  ar: "هل يثبت خبر الآحاد عقيدة، أم يقتصر على العمل والظن؟"
  en: "Can a single report (khabar al-ahad) establish a creed, or does it yield only action and probability?"
perspectives:
- tradition: sunni
  id: majority-of-verifiers
  stance:
    ar: خبر الآحاد لا يفيد اليقين فلا تثبت به العقيدة، والإجماع الملزم في العقيدة ما كان معلوماً من الدين بالضرورة
    en: A single report gives no certainty and so cannot establish creed; the binding consensus in creed is what is known from religion by necessity
  summary:
    ar: "ينقل شلتوت عن البزدوي والغزالي والإسنوي وغيرهم أن خبر الآحاد لا يفيد إلا الظن، وأن الشارع أجاز الظن في الفروع العملية لا في قواعد أصول الدين؛ وينقل عن الشافعي وابن حزم أن الإجماع الحجة هو ما لا خلاف فيه ويُعلم بالتواتر. ويعد الكتاب هذا موقف المحققين، لا موقف كل أهل الحديث."
    en: "Shaltut reports from al-Bazdawi, al-Ghazali, al-Isnawi and others that a single report yields only probability, and that the law allowed probability in practical branches but not in the principles of religion; from al-Shafi'i and Ibn Hazm he reports that the consensus which binds is one known without dispute and by mass transmission."
  evidence:
  - ref: source/al-islam-aqida-wa-shariah-azhar
    note:
      ar: "الباب الثاني، طريق ثبوت العقيدة، ص 89 إلى 93 و100 إلى 102 و112 إلى 113 من PDF"
      en: "Part two, how belief is established, PDF pp. 89 to 93, 100 to 102 and 112 to 113"
