id: concept/birr-al-umm
class: concept
kind: ethical
label:
  ar: "بر الأم"
  en: "Dutifulness to the mother (birr al-umm)"
  fr: "Bonté envers la mère (birr al-umm)"
  ur: "ماں کے ساتھ نیکی"
summary:
  ar: "بر الأم في السنة مقدم على بر الأب ثلاث مرات في خبر أبي هريرة «أمك ثم أمك ثم أمك ثم أبوك»، وفي خبر طاوس بن كيسان فدىت أمك بأبي وأمي، والجنة تحت أقدام الأمهات، ومن برها إطعامها وكسوتها وحسن الكلام معها وطاعتها في المعروف وصلة من كانت تصله."
  en: "Dutifulness to the mother in the Sunnah precedes the father three times in Abu Hurayra's report 'your mother, then your mother, then your mother, then your father', and in Tawus ibn Kaysan's report the mother is ransomed for with father and mother; Paradise lies beneath mothers' feet, and of her birr are feeding her, clothing her, speaking kindly to her, obeying her in the good and joining the ties she used to join."
  fr: "Dans la Sunna, la mère précède trois fois le père dans le récit d’Abu Hurayra ; celui de Tawus ibn Kaysan emploie pour elle la formule du sacrifice du père et de la mère. Le Paradis est sous les pieds des mères. La bonté envers elle comprend nourriture, vêtements, paroles aimables, obéissance dans le bien et maintien des liens qu’elle entretenait."
  ur: "سنت میں ماں کے ساتھ نیکی باپ سے تین بار مقدم ہے، ابو ہریرہ کی خبر میں «تمہاری ماں، پھر تمہاری ماں، پھر تمہاری ماں، پھر تمہارے باپ»، اور طاؤس بن کیسان کی خبر میں ماں کے لیے ماں باپ فدا ہیں؛ جنت ماؤں کے قدموں تلے ہے، اور اس کی نیکی میں اسے کھلانا، پہنانا، اچھی بات کرنا، نیکی میں اطاعت اور ان رشتوں کو جوڑنا جنہیں وہ جوڑتی تھیں۔"
