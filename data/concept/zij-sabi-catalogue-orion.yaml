summary:
  ar: "يسمّي فهرس البتاني الصورة الجبّار، ويعدّ كواكب رأسه وكتفه والجلد الذي يحمله في يده اليسرى والحزام والسيف ومقبضه، ويسمّي الكوكب المضيء في نهاية قدمه اليسرى رِجل الجوزاء. ويذكر المحقق أن اسم المِقلَد لأحد الكواكب أُعيد بالتخمين. مواضعها لم تُنقل هنا. {cite:nallino-albatenii-opus-astronomicum pp.168}"
  en: "The catalogue names the figure al-Jabbar, the giant (gigas). It lists the stars of the head, shoulder, the skin carried in the left hand, the belt, the sword and its hilt, and calls the bright star at the end of the left foot rijl al-Jawza', the foot of al-Jawza'. The editor notes that the name al-Miglad, the flail, for one star is restored by conjecture. Positions are not transcribed here. {cite:nallino-albatenii-opus-astronomicum pp.168}"
  ur: "فہرست میں جبار، یعنی دیو، کی صورت ہے۔ اس کے ستارے سر، کندھے، اس کھال میں جو وہ بائیں ہاتھ میں لیے ہے، کمربند، تلوار اور اس کے دستے میں گنے گئے ہیں۔ بائیں پاؤں کے سرے کے روشن ستارے کو رجل الجوزاء کہا گیا ہے۔ مرتب بتاتا ہے کہ ایک ستارے کا نام المقلد کسی اور ماخذ میں نہیں ملتا اور قیاس سے بحال کیا گیا ہے۔ مواضع یہاں نقل نہیں ہوئے۔ {cite:nallino-albatenii-opus-astronomicum pp.168}"
  es: "El catálogo denomina a la figura al-Jabbar, el gigante (gigas). Enumera las estrellas de la cabeza, el hombro, la piel que sostiene en la mano izquierda, el cinturón, la espada y su empuñadura, y llama a la estrella brillante al final del pie izquierdo rijl al-Jawza', el pie de al-Jawza'. El editor señala que el nombre al-Miglad, el flagelo, para una estrella se restablece por conjetura. Las posiciones no se transcriben aquí. {cite:nallino-albatenii-opus-astronomicum pp.168}"
  fr: "Le catalogue nomme la figure al-Jabbar, le géant (gigas). Il répertorie les étoiles de la tête, de l'épaule, de la peau tenue dans la main gauche, de la ceinture, de l'épée et de sa poignée, et nomme l'étoile brillante à l'extrémité du pied gauche rijl al-Jawza', le pied d'al-Jawza'. L'éditeur note que le nom al-Miglad, le fléau, pour une étoile est rétabli par conjecture. Les positions ne sont pas transcrites ici. {cite:nallino-albatenii-opus-astronomicum pp.168}"
  tr: "Al-Battani'nin dizini, Orion takımyıldızını adlandırır ve başının, omzunun, sol elinde tuttuğu derinin, kemerinin, kılıcının ve kılıç kabzasının gezegenlerini listeler. Sol ayağının ucundaki parlak gezegene İkizler Bacağı adını verir. Editör, gezegenlerden birinin taklitçisinin adının varsayım yoluyla tekrarlandığını belirtir. Konumları burada kaydedilmemiştir. {cite:nallino-albatenii-opus-astronomicum pp.168}"
  id: "Indeks Al-Battani menyebutkan rasi bintang Orion, dan mencantumkan planet-planet di kepala, bahu, kulit yang dipegangnya di tangan kiri, ikat pinggang, pedang, dan gagangnya. Ia menyebut planet terang di ujung kaki kirinya sebagai Kaki Gemini. Editor mencatat bahwa nama peniru salah satu planet diulang berdasarkan dugaan. Posisinya tidak dicatat di sini. {cite:nallino-albatenii-opus-astronomicum pp.168}"
