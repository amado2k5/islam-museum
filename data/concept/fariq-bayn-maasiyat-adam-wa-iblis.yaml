id: concept/fariq-bayn-maasiyat-adam-wa-iblis
class: concept
kind: doctrine
label:
  ar: "الفرق بين معصية آدم ومعصية إبليس"
  en: "The difference between Adam's sin and Iblis's"
  ur: "آدم اور ابلیس کی نافرمانی میں فرق"
summary:
  ar: "يرى الشعراوي أن خطأ آدم كان غفلة، وأنه اعترف وتاب فتقبّل الله توبته، وأن إبليس استكبر فرد الأمر على الآمر فكان كفرا، وأن الخطيئة الموروثة التي تحتاج مخلّصا لا أصل لها عنده {cite:tafsir-sharawi-khawatir-scan p.269} {cite:tafsir-sharawi-khawatir-scan p.272} {cite:tafsir-sharawi-khawatir-scan p.273} {cite:tafsir-sharawi-khawatir-scan p.274}."
  en: "Sha'rawi holds that Adam's error was heedlessness; that he confessed and repented, and God accepted his repentance; that Iblis was proud and answered the command with a refusal, which was disbelief; and that the inherited sin requiring a redeemer has no basis in his view {cite:tafsir-sharawi-khawatir-scan p.269} {cite:tafsir-sharawi-khawatir-scan p.272} {cite:tafsir-sharawi-khawatir-scan p.273} {cite:tafsir-sharawi-khawatir-scan p.274}."
  ur: "شعراوی کے نزدیک آدم کی لغزش غفلت تھی، انہوں نے اعتراف کیا اور توبہ کی تو اللہ نے قبول کی۔ ابلیس نے تکبر کیا اور حکم کو حکم دینے والے کے سامنے رد کیا، جو کفر ہے۔ ان کے نزدیک وہ موروثی گناہ جس کے لیے نجات دہندہ چاہیے کوئی بنیاد نہیں رکھتا {cite:tafsir-sharawi-khawatir-scan p.269} {cite:tafsir-sharawi-khawatir-scan p.272} {cite:tafsir-sharawi-khawatir-scan p.273} {cite:tafsir-sharawi-khawatir-scan p.274}۔"
wings: [ideas]
themes: [creed]
periods: [period/prophetic-era]
regions: [global]
issue:
  ar: "هل خطيئة آدم موروثة تحتاج إلى مخلص، أم هي خطأ قد تاب الله عليه؟"
  en: "Is Adam's sin inherited and in need of a redeemer, or was it an error for which God accepted repentance?"
perspectives:
  - tradition: sunni
    id: sunni-sharawi
    stance:
      ar: "خطأ آدم قد تاب الله عليه، والخطيئة لا تورث، وذنب إبليس كفر بالاستكبار"
      en: "Adam's error was pardoned after repentance; sin is not inherited; Iblis's was disbelief through pride"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يفرق الشعراوي بين الخطأ الذي يُصوَّب والخطيئة التي يُعاقب عليها، ويقرر أن آدم أخطأ فصوّب الله له، وأن الخطيئة لا تورث {cite:tafsir-sharawi-khawatir-scan p.269}، ويقارن بين اعتراف آدم وتكبر إبليس {cite:tafsir-sharawi-khawatir-scan p.273}."
      en: "Sha'rawi distinguishes an error that is corrected from a sin that is punished. He holds that Adam erred and was guided, that sin is not inherited, and he compares Adam's acknowledgement with Iblis's pride {cite:tafsir-sharawi-khawatir-scan p.269} {cite:tafsir-sharawi-khawatir-scan p.273}."
    sources: [source/tafsir-sharawi-khawatir-scan]
  - tradition: academic
    id: academic
    stance:
      ar: "دراسة مقارنة لفكرة الخطيئة الأصلية لم تُضف بعد"
      en: "A comparative study of the idea of original sin is not yet added"
    summary:
      ar: "لم تُعرض في هذه الصفحات دراسة لفكرة الخطيئة الأصلية في الديانات الأخرى، وتحتاج إلى مرجع محدد."
      en: "No comparative study of original sin in other religions is set out in these pages; it needs a named source."
    sources: []
  - tradition: other
    id: other
    stance:
      ar: "الرأي الذي يرد عليه الشعراوي"
      en: "The view he rejects, as he describes it"
    summary:
      ar: "يصف الشعراوي قولا يقول بضرورة مخلّص يفدي العالم، ولم يُنقل نص هذا القول من مصدره، ولم يُراجع."
      en: "Sha'rawi describes a view that a redeemer is needed to ransom the world; the view is not quoted from its source here and has not been checked."
