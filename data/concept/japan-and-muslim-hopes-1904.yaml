label: { ar: "اليابان وآمال المسلمين بعد 1904", en: "Japan and Muslim hopes after 1904", es: "Japón y las esperanzas musulmanas después de 1904", fr: "Le Japon et les espoirs musulmans après 1904" }
summary:
  ar: "يعرض شكيب أرسلان في فصل الجامعة الإسلامية كيف تابع المسلمون انتصار اليابان على روسيا سنة 1904 وتفاءلوا به، وينقل عن صحافة مصرية وعن شيخ صيني قولهم إن إسلام اليابان قد يغيّر مسار السياسة الإسلامية. ويذكر أن اليابان استقبلت وفداً إسلامياً بالحفاوة لكنها لم تُظهر رغبة في الدخول في الإسلام، ويرى أن الأثر الدائم كان توطيد علاقات ودية بين الشعوب المسلمة وشعوب آسية غير المسلمة. يعرض هذا كما نقله المؤلف عن الصحافة والمجالس، ولا يعدّه أدلة على نيات اليابان."
  en: "In the Pan-Islamic chapter Arslan records how Muslims cheered Japan's victory over Russia in 1904, quoting an Egyptian newspaper and a Chinese Muslim scholar who thought Japanese conversion might change the course of Islamic politics. He reports that Japan welcomed a Muslim delegation warmly but showed no interest in converting, and he sees the lasting result as friendlier ties between Muslim peoples and non-Muslim Asian nations. This is drawn from the press and gatherings as Arslan reports them, not evidence of Japan's intentions."
  es: "En el capítulo sobre el panislamismo, Arslan relata cómo los musulmanes celebraron la victoria de Japón sobre Rusia en 1904, citando un periódico egipcio y a un erudito musulmán chino que creía que la conversión de los japoneses podría cambiar el rumbo de la política islámica. Informa que Japón recibió con entusiasmo a una delegación musulmana, pero no mostró interés en la conversión, y considera que el resultado duradero fue un fortalecimiento de las relaciones entre los pueblos musulmanes y las naciones asiáticas no musulmanas. Esta información se basa en la prensa y las reuniones tal como las relata Arslan, y no constituye una prueba de las intenciones de Japón."
  fr: "Dans le chapitre consacré au panislamisme, Arslan relate comment les musulmans ont applaudi la victoire du Japon sur la Russie en 1904, citant un journal égyptien et un érudit musulman chinois qui pensait qu'une conversion des Japonais pourrait modifier le cours de la politique islamique. Il rapporte que le Japon a chaleureusement accueilli une délégation musulmane, mais n'a manifesté aucun intérêt pour la conversion, et il voit dans cette victoire un renforcement des liens entre les peuples musulmans et les nations asiatiques non musulmanes. Ces observations sont tirées de la presse et des réunions telles qu'Arslan les rapporte, et ne constituent pas une preuve des intentions du Japon."
