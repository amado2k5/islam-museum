summary:
  ar: "يعرض شكيب أرسلان في فصل الجامعة الإسلامية كيف تابع المسلمون انتصار اليابان على روسيا سنة 1904 وتفاءلوا به، وينقل عن صحافة مصرية وعن شيخ صيني قولهم إن إسلام اليابان قد يغيّر مسار السياسة الإسلامية. ويذكر أن اليابان استقبلت وفداً إسلامياً بالحفاوة لكنها لم تُظهر رغبة في الدخول في الإسلام، ويرى أن الأثر الدائم كان توطيد علاقات ودية بين الشعوب المسلمة وشعوب آسية غير المسلمة. يعرض هذا كما نقله المؤلف عن الصحافة والمجالس، ولا يعدّه أدلة على نيات اليابان."
  en: "In the Pan-Islamic chapter Arslan records how Muslims cheered Japan's victory over Russia in 1904, quoting an Egyptian newspaper and a Chinese Muslim scholar who thought Japanese conversion might change the course of Islamic politics. He reports that Japan welcomed a Muslim delegation warmly but showed no interest in converting, and he sees the lasting result as friendlier ties between Muslim peoples and non-Muslim Asian nations. This is drawn from the press and gatherings as Arslan reports them, not evidence of Japan's intentions."
