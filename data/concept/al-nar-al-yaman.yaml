id: concept/al-nar-al-yaman
class: concept
kind: belief
label:
  ar: النار الخارجة من اليمن
  en: The Fire from Yemen
  fr: "Le Feu du Yémen"
  ur: یمن سے نکلنے والی آگ
  es: "El fuego de Yemen"
  tr: "Yemen'den çıkan yangın"
  id: "Kebakaran di Yaman"
summary:
  ar: "آخر العلامات الكبرى: نار تخرج من قعر عدن من حضرموت تسوق الناس إلى المحشر تحط معهم حيث حطوا وتبيت حيث باتوا {cite:sahih-muslim} {cite:sahih-al-bukhari}."
  en: "The last of the major signs: a fire coming out of the depth of Aden in Hadramawt that drives people to the gathering place — halting where they halt and resting where they rest {cite:sahih-muslim} {cite:sahih-al-bukhari}."
  fr: "Le dernier des grands signes : un feu sortant du fond d'Aden, dans le Hadramaout, qui pousse les gens vers le lieu du rassemblement, faisant halte là où ils font halte et se reposant là où ils se reposent {cite:sahih-muslim} {cite:sahih-al-bukhari}."
  ur: "بڑی نشانیوں میں آخری: حضرموت کے قعرِ عدن سے آگ نکلے گی جو لوگوں کو محشر کی طرف ہانکے گی — جہاں وہ ٹھہریں وہیں ٹھہرے اور جہاں وہ سوئیں وہیں رات گزارے {cite:sahih-muslim} {cite:sahih-al-bukhari}۔"
  es: "La última de las señales principales: un fuego que sale de las profundidades de Adén en Hadramawt que lleva a la gente al lugar de reunión, deteniéndose donde se detienen y descansando donde descansan {cite:sahih-muslim} {cite:sahih-al-bukhari}."
  tr: "Son büyük işaretler: Hadremaut'tan Aden'in derinliklerinden çıkan bir ateş, insanları toplanmaya sürükler, yerleştikleri yerde dinlenirler ve geceyi geçirdikleri yerde geçirirler {atıf:sahih-al-bukhari}."
  id: "Tanda-tanda besar terakhir: api yang datang dari kedalaman Aden dari Hadremaut mendorong orang-orang untuk berkumpul, mereka beristirahat di tempat mereka menetap, dan bermalam di tempat mereka beristirahat {atribusi: sahih-al-bukhari}."
