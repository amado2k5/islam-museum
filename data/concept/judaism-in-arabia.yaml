id: concept/judaism-in-arabia
education:
  did_you_know:
    ar: "يعرض الرحيق دخول اليهودية جزيرة العرب في دورين: بعد خراب بختنصر لفلسطين سنة ٥٨٧ق.م ثم بعد خراب أورشليم الثاني سنة ٧٠م."
    en: "Al-Rahiq traces Judaism's entry into Arabia in two waves: after Nebuchadnezzar's ruin of Palestine in 587 BCE, then after Jerusalem's second destruction in 70 CE."
    ur: "الرحیق جزیرۂ عرب میں یہودیت کے داخلے کو دو موجوں میں بیان کرتا ہے: بخت نصر کی فلسطین کی تباہی ⁦(587ق م)⁩ کے بعد، پھر یروشلم کی دوسری تباہی ⁦(70ء)⁩ کے بعد۔"
    sources: [source/mubarakpuri-raheeq, source/qalb-jazirat-al-arab]
class: concept
kind: belief
label: { ar: "اليهودية في جزيرة العرب قبل الإسلام", en: "Judaism in Arabia before Islam", es: "El judaísmo en Arabia antes del Islam", fr: "Le judaïsme en Arabie avant l'islam", ur: "اسلام سے پہلے عرب میں یہودیت", tr: "İslam öncesi Arap Yarımadası'nda Yahudilik", id: "Yudaisme di Semenanjung Arab sebelum Islam" }
summary:
  ar: "دخلت اليهودية جزيرة العرب في دورين على الأقل في عرض الرحيق المختوم: هجرة اليهود إلى شمالي الحجاز بعد تخريب بختنصر فلسطين سنة 587 ق.م، ثم بعد احتلال الرومان فلسطين سنة 70م حين رحلت قبائل عديدة إلى يثرب وخيبر وتيماء وأنشأت القرى والآطام؛ وكانت القبائل اليهودية المشهورة عند مجيء الإسلام خيبر والنضير والمصطلق وقريظة وقينقاع، وزاد السمهودي عددها على عشرين؛ ودخلت اليمن من قبل تبّان أسعد أبي كرب."
  en: "Judaism reached Arabia in at least two stages in al-Raheeq al-Makhtum's account: Jewish migration to northern Hijaz after Nebuchadnezzar's destruction of Palestine in 587 BCE, then after the Roman occupation of Palestine in 70 CE, when many tribes settled Yathrib, Khaybar and Tayma and built villages and forts; the well-known Jewish tribes at the coming of Islam were Khaybar, al-Nadir, al-Mustaliq, Qurayza and Qaynuqa, and al-Samhudi counts more than twenty; it entered Yemen through Tuban As'ad Abu Karib."
  es: "El judaísmo llegó a Arabia en al menos dos etapas, según el relato de al-Raheeq al-Makhtum: la migración judía al norte de Hiyaz tras la destrucción de Palestina por Nabucodonosor en el 587 a. C., y luego tras la ocupación romana de Palestina en el 70 d. C., cuando muchas tribus se asentaron en Yathrib, Khaybar y Tayma y construyeron aldeas y fortalezas; las tribus judías más conocidas a la llegada del Islam eran Khaybar, al-Nadir, al-Mustaliq, Qurayza y Qaynuqa, y al-Samhudi menciona más de veinte; entró en Yemen a través de Tuban As'ad Abu Karib."
  fr: "D'après le récit d'al-Raheeq al-Makhtum, le judaïsme a atteint l'Arabie en au moins deux étapes: la migration juive vers le nord du Hedjaz après la destruction de la Palestine par Nabuchodonosor en 587 avant notre ère, puis après l'occupation romaine de la Palestine en 70 de notre ère, lorsque de nombreuses tribus s'installèrent à Yathrib, Khaybar et Tayma et y construisirent des villages et des forts; les tribus juives les plus connues à l'arrivée de l'islam étaient Khaybar, al-Nadir, al-Mustaliq, Qurayza et Qaynuqa, et al-Samhudi en compte plus de vingt; il pénétra au Yémen par Tuban As'ad Abu Karib."
  ur: "الرحیق المختم کے بیان میں کم از کم دو مراحل میں یہودیت عرب تک پہنچی: 587 قبل مسیح میں نبوکدنضر کے فلسطین کی تباہی کے بعد شمالی حجاز کی طرف یہودیوں کی ہجرت، پھر 70 عیسوی میں فلسطین پر رومیوں کے قبضے کے بعد، جب بہت سے قبائل نے یثرب، تبرک اور گاؤں کو آباد کیا۔ اسلام کے آنے کے وقت مشہور یہودی قبائل خیبر، النضیر، المصطلق، قریظہ اور قینقہ تھے، اور السمھودی کی تعداد بیس سے زیادہ تھی۔ یہ طوبان اسد ابو کریب کے راستے یمن میں داخل ہوا۔"
  tr: "Yahudilik, mühürlü nektar sunusunda en az iki aşamada Arap Yarımadası'na girdi: MÖ 587'de Filistin'deki Bakhteser'in yıkımından sonra Yahudilerin kuzey Hicaz'a göçü, ardından 70 yılında Roma'nın Filistin'i fethetmesiyle birçok kabile Yathrib, Khaybar ve Tayma'ya göç ederek köyler ve yerleşimler kurdu; İslam dönemindeki ünlü Yahudi kabileleri Haybar, Nadir, Al-Mustaliq, Qurayza ve Qaynuqa idi. Samhudilerin sayısı yirmiden fazlaydı; Yemen'e ise Taban As'ad Abu Karb girdi."
  id: "Yudaisme memasuki Semenanjung Arab setidaknya dalam dua tahap dalam persembahan nektar tertutup: migrasi orang Yahudi ke Hejaz utara setelah penghancuran Bakhteser di Palestina pada tahun 587 SM, kemudian setelah penaklukan Romawi atas Palestina pada tahun 70 M, ketika banyak suku bermigrasi ke Yathrib, Khaybar, dan Tayma, mendirikan desa dan pemukiman; suku Yahudi yang terkenal pada masa Islam adalah Khaybar, Nadir, Al-Mustaliq, Qurayza, dan Qaynuqa. Samhudi berjumlah lebih dari dua puluh; dan Yaman dimasuki oleh Taban As'ad Abu Karb."
