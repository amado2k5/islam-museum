id: concept/judaism-in-arabia
education:
  did_you_know:
    ar: "يعرض الرحيق دخول اليهودية جزيرة العرب في دورين: بعد خراب بختنصر لفلسطين سنة ٥٨٧ق.م ثم بعد خراب أورشليم الثاني سنة ٧٠م."
    en: "Al-Rahiq traces Judaism's entry into Arabia in two waves: after Nebuchadnezzar's ruin of Palestine in 587 BCE, then after Jerusalem's second destruction in 70 CE."
    ur: "الرحیق جزیرۂ عرب میں یہودیت کے داخلے کو دو موجوں میں بیان کرتا ہے: بخت نصر کی فلسطین کی تباہی (587ق م) کے بعد، پھر یروشلم کی دوسری تباہی (70ء) کے بعد۔"
    sources: [source/mubarakpuri-raheeq, source/qalb-jazirat-al-arab]
class: concept
kind: belief
label: { ar: "اليهودية في جزيرة العرب قبل الإسلام", en: "Judaism in Arabia before Islam" }
summary:
  ar: "دخلت اليهودية جزيرة العرب في دورين على الأقل في عرض الرحيق المختوم: هجرة اليهود إلى شمالي الحجاز بعد تخريب بختنصر فلسطين سنة 587 ق.م، ثم بعد احتلال الرومان فلسطين سنة 70م حين رحلت قبائل عديدة إلى يثرب وخيبر وتيماء وأنشأت القرى والآطام؛ وكانت القبائل اليهودية المشهورة عند مجيء الإسلام خيبر والنضير والمصطلق وقريظة وقينقاع، وزاد السمهودي عددها على عشرين؛ ودخلت اليمن من قبل تبّان أسعد أبي كرب."
  en: "Judaism reached Arabia in at least two stages in al-Raheeq al-Makhtum's account: Jewish migration to northern Hijaz after Nebuchadnezzar's destruction of Palestine in 587 BCE, then after the Roman occupation of Palestine in 70 CE, when many tribes settled Yathrib, Khaybar and Tayma and built villages and forts; the well-known Jewish tribes at the coming of Islam were Khaybar, al-Nadir, al-Mustaliq, Qurayza and Qaynuqa, and al-Samhudi counts more than twenty; it entered Yemen through Tuban As'ad Abu Karib."
