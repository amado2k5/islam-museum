summary:
  ar: "يسمّي الفهرس صورة العقرب بالاسم نفسه، ويذكر قلب العقرب، وهو الكوكب الأحمر وسط الكواكب الثلاثة المضيئة في الصدر. تُعدّ الكواكب من العين إلى الفقرات، ويكمل القسم حتى الشوكة في الصفحة التالية. مواضعها لم تُنقل هنا. {cite:nallino-albatenii-opus-astronomicum pp.161}"
  en: "The catalogue names the figure al-'Aqrab, the scorpion, and gives its red star qalb al-'aqrab, the heart of the scorpion, as the middle of three bright stars in the chest. Its stars are counted from the eyes down the vertebrae, and the section continues to the sting on the next page. Positions are not transcribed here. {cite:nallino-albatenii-opus-astronomicum pp.161}"
  ur: "فہرست میں عقرب کی صورت ہے، اور اس کا سرخ ستارہ قلب العقرب ہے، جو سینے کے تین روشن ستاروں کے درمیان ہے۔ ستارے آنکھوں کے درمیان سے ریڑھ کی ہڈیوں کے ساتھ گنے گئے ہیں، اور ڈنک کا حصہ اگلے صفحے پر ہے۔ مواضع یہاں نقل نہیں ہوئے۔ {cite:nallino-albatenii-opus-astronomicum pp.161}"
