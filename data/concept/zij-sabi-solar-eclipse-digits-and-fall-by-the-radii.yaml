id: concept/zij-sabi-solar-eclipse-digits-and-fall-by-the-radii
class: concept
kind: scientific
label: { ar: "أصابع كسوف الشمس ودقائق سقوطه", en: "The digits of a solar eclipse and its fall minutes", ur: "سورج گرہن کی انگلیاں اور سقوط کے دقائق", es: "Los dígitos de un eclipse solar y sus minutos de caída", fr: "Les chiffres d'une éclipse solaire et ses minutes de chute", tr: "Güneş tutulmasının parmakları ve düşüşünün dakikaları", id: "Jari-jari gerhana matahari dan menit-menit saat terjadinya." }
summary:
  ar: "تُضرب دقائق نصف القطرين المطلقة في نفسها، وتُطرح من عرض القمر المرئي مضروباً في مثله، ويؤخذ جذر الباقي فيخرج دقائق السقوط المطلقة، ثم يُقسم على سبق القمر لساعة ليصير ساعات السقوط. وتُطرح ساعات السقوط من ساعات وسط الكسوف لبدء الكسوف المطلق، وتُزاد عليها لتمام الانجلاء المطلق. وتصير الأصابع بضرب الفضل في عدد الأصابع المعتاد من قطر الشمس. {cite:zij-sabi-nallino-byblion pp.165-166}"
  en: "The absolute half-sum of the radii is multiplied by itself and the square of the visible latitude is subtracted from it; the root of the remainder gives the absolute minutes of fall. Divided by the Moon's hourly motion they give the hours of fall, which subtracted from the hours of mid-eclipse fix the absolute beginning, and added fix the absolute end. The digits are the difference between the half-sum and the latitude, multiplied by twelve and divided by the Sun's diameter. {cite:zij-sabi-nallino-byblion pp.165-166}"
  ur: "مطلق نصف المجموع کو اپنے آپ سے ضرب دے کر اس میں سے مرئی عرض کا مربع گھٹایا جاتا ہے، اور باقی کا جذر مطلق سقوط کے دقائق دیتا ہے۔ انہیں چاند کی فی گھنٹہ حرکت پر تقسیم کرنے سے سقوط کے گھنٹے ملتے ہیں، جو وسط کے گھنٹوں میں سے گھٹانے سے مطلق آغاز اور جمع کرنے سے مطلق اختتام طے کرتے ہیں۔ انگلیاں نصف المجموع اور عرض کے فرق کو بارہ سے ضرب دے کر سورج کے قطر پر تقسیم کرنے سے نکلتی ہیں۔ {cite:zij-sabi-nallino-byblion pp.165-166}"
  es: "La mitad absoluta de la suma de los radios se multiplica por sí misma y se le resta el cuadrado de la latitud visible; la raíz cuadrada del resto da los minutos absolutos de caída. Divididos por el movimiento horario de la Luna, dan las horas de caída, que restadas de las horas del punto medio del eclipse fijan el inicio absoluto, y sumadas fijan el final absoluto. Los dígitos son la diferencia entre la mitad de la suma y la latitud, multiplicada por doce y dividida por el diámetro del Sol. {cite:zij-sabi-nallino-byblion pp.165-166}"
  fr: "On multiplie la moitié de la somme absolue des rayons par elle-même, puis on soustrait le carré de la latitude visible; la racine carrée du reste donne les minutes de chute absolues. Divisées par le mouvement horaire de la Lune, ces minutes donnent les heures de chute, qui, soustraites des heures du milieu de l’éclipse, fixent le début absolu, et ajoutées, la fin absolue. Les chiffres restants correspondent à la différence entre la moitié de la somme et la latitude, multipliée par douze et divisée par le diamètre du Soleil. {cite:zij-sabi-nallino-byblion pp.165-166}"
  tr: "Mutlak yarıçapların dakikaları kendileriyle çarpılır ve ayın görünür genişliğinin kendiyle çarpımından çıkarılır. Kalanın karekökü alınarak mutlak batış dakikaları elde edilir ve bu daha sonra ayın bir saatlik ilerlemesine bölünerek batış saatleri bulunur. Batış saatleri, tutulmanın ortası saatlerinden çıkarılarak mutlak tutulmanın başlangıcı belirlenir ve mutlak tutulmanın sonu için bunlara eklenir. Parmak sayısı, fazlalık güneş çapının normal parmak sayısıyla çarpılarak elde edilir. {cite:zij-sabi-nallino-byblion pp.165-166}"
  id: "Menit jari-jari absolut dikalikan dengan dirinya sendiri, dan dikurangi dari lebar bulan yang terlihat yang juga dikalikan dengan dirinya sendiri. Akar kuadrat dari sisanya diambil untuk mendapatkan menit terbenam absolut, yang kemudian dibagi dengan satu jam pergeseran bulan untuk mendapatkan jam terbenam. Jam terbenam dikurangi dari jam pertengahan gerhana untuk menentukan awal gerhana absolut, dan ditambahkan untuk menentukan akhir gerhana absolut. Jumlah jari diperoleh dengan mengalikan kelebihan tersebut dengan jumlah jari diameter matahari yang biasa. {cite:zij-sabi-nallino-byblion pp.165-166}"
