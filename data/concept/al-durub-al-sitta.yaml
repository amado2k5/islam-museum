label: { ar: "الضروب الستة ⁦(أنواع المعادلات عند الخوارزمي)⁩", en: "The six types of equation (al-Khwarizmi)", fr: "Les six types d’équations (al-Khwarizmi)", es: "Los seis tipos de ecuaciones (al-Juarismi)", ur: "مساوات کی چھ اقسام ⁦(الخوارزمی)⁩", tr: "Altı Tip (Al-Khwarizmi'ye göre denklem türleri)", id: "Enam Jenis (Jenis persamaan menurut Al-Khwarizmi)" }
term: { ar: "الضروب الستة", en: "al-durub al-sitta" }
summary:
  ar: "تقسيم الخوارزمي لمعادلات الدرجة الأولى والثانية ذات المعاملات الموجبة إلى ستة ضروب: ثلاثة مفردة ⁦(أموال تعدل جذوراً، وأموال تعدل عدداً، وجذور تعدل عدداً)⁩ وثلاثة مقترنة ⁦(أموال وجذور تعدل عدداً، وأموال وعدد تعدل جذوراً، وجذور وعدد تعدل أموالاً)⁩ {cite:khwarizmi-jabr-cairo-1939 p.31} {cite:khwarizmi-jabr-cairo-1939 p.32}."
  en: "Al-Khwarizmi's division of first- and second-degree equations with positive terms into six types: three simple (squares equal roots, squares equal number, roots equal number) and three compound (squares and roots equal number, squares and number equal roots, roots and number equal squares)."
  fr: "Al-Khwarizmi répartit les équations du premier et du second degré à termes positifs en six types : trois simples (les carrés égalent les racines, les carrés égalent un nombre, les racines égalent un nombre) et trois composés (les carrés et les racines égalent un nombre, les carrés et un nombre égalent les racines, les racines et un nombre égalent les carrés)."
  es: "La división de Al-Juarismi de las ecuaciones de primer y segundo grado con términos positivos en seis tipos: tres simples (los cuadrados son iguales a las raíces, los cuadrados son iguales al número, las raíces son iguales al número) y tres compuestas (los cuadrados y las raíces son iguales al número, los cuadrados y el número son iguales a las raíces, las raíces y el número son iguales a los cuadrados)."
  ur: "الخوارزمی کی مثبت اصطلاحات کے ساتھ پہلی اور دوسری ڈگری کی مساوات کی چھ اقسام میں تقسیم: تین سادہ ⁦(مربع مساوی جڑیں، مربع مساوی نمبر، جڑیں برابر نمبر)⁩ اور تین مرکب ⁦(مربع اور جڑیں برابر نمبر، مربع اور عدد برابر جڑیں، جڑیں اور عدد برابر مربع)⁩۔"
  tr: "Al-Khwarizmi, pozitif katsayıya sahip birinci ve ikinci derece denklemleri altı tipe ayırmıştır: üç tekil (para değiştiren kökler, para modifiye sayılar ve kökler sayıları değiştiren) ve üç çiftli (para ve kök değiştiren sayılar, para ve sayı değiştiren kökler ve kökler değiştiren paralar) {cite:khwarizmi-jabr-cairo-1939 s.31} {cite:khwarizmi-jabr-cairo-1939 s.32}."
  id: "Al-Khwarizmi membagi persamaan derajat pertama dan kedua dengan koefisien positif menjadi enam jenis: tiga tunggal (akar penukar uang, bilangan yang mengubah uang, dan bilangan pengubah akar) dan tiga (angka perubahan uang dan akar, akar uang dan pengubah angka, serta akar penukar uang) {cite:khwarizmi-jabr-cairo-1939 hlm.31} {cite:khwarizmi-jabr-cairo-1939 hlm.32}."
