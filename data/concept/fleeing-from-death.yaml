perspectives:
  - tradition: sunni
    id: sunni-sharawi-no-date-or-cause
    stance: { ar: "أبهم القرآن الزمان والمكان والسبب لتعم العبرة، ولا يحتاج الأمر إلى تحديد", en: "The Qur'an leaves time, place and cause unnamed so that the lesson is general and needs no pinning down", ur: "قرآن نے زمانہ، مقام اور سبب مبہم رکھا تاکہ سبق عام رہے" }
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يرى الشعراوي أن تحديد الزمان والمكان والأشخاص يُضعف القصة ويجعلها خاصة بوقتها، وأن الإبهام يعطيها حياة في كل زمان ومكان، وأن الموت والحياة أمر تسخيري لا يتعلق بقتال أو غيره {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1032} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1036}."
      en: "Sha'rawi holds that fixing the time, place and people would weaken the story and confine it to one moment, while leaving it unnamed gives it life in every age. He holds that death and life are by compulsory decree and are not tied to fighting or anything else {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1032} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1036}."
    sources: [source/tafsir-sharawi-khawatir-scan-vol-2]
  - tradition: sunni
    id: sunni-reported-causes
    stance: { ar: "ينقل الشعراوي أن المفسرين قالوا إن السبب وباء، وقالوا إنه عدو، ولا يرجّح بينهما", en: "Sha'rawi reports that exegetes said the cause was a plague, or an enemy; he does not choose between them", ur: "شعراوی نقل کرتے ہیں کہ مفسرین نے وبا یا دشمن کو سبب کہا؛ وہ ان میں ترجیح نہیں دیتے" }
    holders: []
    summary:
      ar: "ينقل الشعراوي أن بعض المفسرين قالوا إن الخروج كان فراراً من وباء، وبعضهم قال إنه فرار من عدو، ويرى أن الآية لم تحدد السبب، فلا يتغير معنى العبرة بأيهما {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1031} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1035}."
      en: "Sha'rawi reports that some exegetes said they fled a plague and others that they fled an enemy. He holds that the verse does not name the cause, and the lesson does not change either way {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1031} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1035}."
    sources: [source/tafsir-sharawi-khawatir-scan-vol-2]
