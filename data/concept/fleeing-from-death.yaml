id: concept/fleeing-from-death
class: concept
kind: belief
label:
  ar: "الفرار من الموت"
  en: "Fleeing from death"
  ur: "موت سے فرار"
summary:
  ar: "يتناول الشعراوي في تفسير آية 243 قصة الذين خرجوا من ديارهم حذر الموت، فيرى أن القرآن أبهم زمانهم ومكانهم وسبب خروجهم عمداً، وأن الموت والحياة بيد الله تسخيراً لا يردّه الحذر، ويذكر أقوال المفسرين في السبب دون ترجيح {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1030} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1031} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1037}."
  en: "On verse 243, about those who left their homes in fear of death, Sha'rawi holds that the Qur'an leaves their time, place and cause unnamed on purpose. He argues that death and life are in God's hand by compulsion, and that caution cannot avert what God decrees. He reports the exegetes' differing causes without weighing them {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1030} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1031} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1037}."
  ur: "آیت 243 پر، جو لوگ موت کے ڈر سے اپنے گھروں سے نکلے، شعراوی کہتے ہیں کہ قرآن ان کا زمانہ، مقام اور سبب جان بوجھ کر مبہم رکھتا ہے۔ ان کے نزدیک موت و حیات اللہ کے ہاتھ میں تسخیری طور پر ہیں اور احتیاط تقدیر کو نہیں ٹال سکتی۔ وہ مفسرین کے مختلف اسباب نقل کرتے ہیں مگر ان میں ترجیح نہیں دیتے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1030} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1031} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1037}."
issue:
  ar: "لماذا أبهم القرآن سبب الخروج من الديار حذر الموت، وما معنى أن الموت والحياة بأمر الله التسخيري؟"
  en: "Why does the Qur'an leave the cause of leaving home in fear of death unnamed, and what does it mean that life and death are by God's compulsory decree?"
  ur: "قرآن نے موت کے ڈر سے گھر چھوڑنے کا سبب کیوں مبہم رکھا، اور موت و حیات کے تسخیری امر کا کیا مطلب ہے؟"
