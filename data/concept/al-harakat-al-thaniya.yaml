id: concept/al-harakat-al-thaniya
class: concept
kind: scientific
label: { ar: "الحركة الثانية", en: "The second motion (the planets' own motion along the zodiac)", fr: "Le deuxième mouvement (mouvement propre des planètes le long du zodiaque)", es: "El segundo movimiento (el propio movimiento de los planetas a lo largo del zodíaco)", ur: "دوسری حرکت ⁦(رقم کے ساتھ سیاروں کی اپنی حرکت)⁩", tr: "İkinci bölüm", id: "Bab kedua" }
summary:
  ar: "الحركة الثانية هي حركة الشمس والكواكب الخاصة بها في فلك البروج من المغرب إلى المشرق، وتجري على قطبين آخرين خارجين عن قطبي الحركة الأولى، وهي عكس الحركة الأولى في الاتجاه {cite:farghani-elements-astronomy p. 116}{cite:farghani-elements-astronomy p. 148}."
  en: "The second motion is the proper motion of the sun and planets along the zodiac from west to east, about poles outside those of the first motion, and opposite to it in direction {cite:farghani-elements-astronomy p. 116}{cite:farghani-elements-astronomy p. 148}."
  fr: "Le deuxième mouvement est le mouvement propre du Soleil et des planètes le long du zodiaque, d’ouest en est. Il s’effectue autour de pôles distincts de ceux du premier mouvement et en sens opposé {cite:farghani-elements-astronomy p. 116}{cite:farghani-elements-astronomy p. 148}."
  es: "El segundo movimiento es el movimiento propio del sol y los planetas a lo largo del zodíaco de oeste a este, alrededor de polos fuera de los del primer movimiento y opuestos a él en dirección {cite:farghani-elements-astronomy p. 116}{cite:farghani-elements-astronomy p. 148}."
  ur: "دوسری حرکت سورج اور سیاروں کی رقم کے ساتھ مغرب سے مشرق کی طرف صحیح حرکت ہے، پہلی حرکت کے باہر کے قطبوں کے بارے میں، اور اس کے مخالف سمت میں۔ 116}{حوالہ دیں:فرغانی-عناصر-فلکیات صفحہ۔ 148}۔"
  tr: "İkinci hareket, burçta güneş ve gezegenlerinin batıdan doğuya hareketidir ve ilk hareketin kutuplarının dışındaki iki kutupta gerçekleşir; bu da {cite:farghani-elements-astronomy s. 116} {cite:farghani-elements-astronomy s. 148} yönündeki ilk hareketin tam tersidir."
  id: "Gerakan kedua adalah pergerakan barat ke timur matahari dan planet dalam tanda, yang terjadi pada dua kutub di luar kutub gerakan pertama; ini adalah kebalikan persis dari gerakan pertama ke arah {cite:Farghani-Elements-Astronomy hlm. 116} {cite:Farghani-Elements-Astronomy hlm. 148}."
