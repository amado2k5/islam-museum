summary:
  ar: "مدخل قصير في الكلب: بوله على الثآليل، وإنكار جالينوس لما يُدّعى في لبنه ودمه، ودم الكلب الكلب لنهوشه ولسم السهام الأرمينية {cite:canon-ibn-sina-print-v1 p.535}."
  en: "A short entry on the dog: its urine on warts, Galen's rejection of what is claimed for its milk and blood, and the blood of the rabid dog for its bites and for the poison of Armenian arrows {cite:canon-ibn-sina-print-v1 p.535}."
  ur: "کتے پر ایک مختصر مدخل: اس کا پیشاب مسوں پر، اس کے دودھ اور خون کے بارے میں کیے گئے دعووں کی جالینوس کی تردید، اور باؤلے کتے کا خون اس کے کاٹے اور ارمنی تیروں کے زہر کے لیے {cite:canon-ibn-sina-print-v1 p.535}۔"
  es: "Una breve entrada sobre el perro: su orina sobre las verrugas, el rechazo de Galeno a lo que se afirma sobre su leche y sangre, y la sangre del perro rabioso para sus mordeduras y para el veneno de las flechas armenias {cite:canon-ibn-sina-print-v1 p.535}."
