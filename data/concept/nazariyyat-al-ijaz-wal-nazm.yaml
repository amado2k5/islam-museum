label:
  ar: "كتب الإعجاز: الرماني والخطابي والباقلاني وعبد القاهر الجرجاني"
  en: "The books on inimitability: al-Rummani, al-Khattabi, al-Baqillani and Abd al-Qahir al-Jurjani"
  ur: "اعجاز کی کتابیں: رمانی، خطابی، باقلانی اور عبد القاہر جرجانی"
  fr: "Les livres sur l'inimitabilité : al-Rummani, al-Khattabi, al-Baqillani et Abd al-Qahir al-Jurjani"
  es: "Los libros sobre la inimitabilidad: al-Rummani, al-Khattabi, al-Baqillani y Abd al-Qahir al-Jurjani"
  tr: "Mucizeler kitapları: El-Romani, El-Hattabi, El-Baqillani ve Abdül-Kahir el-Jurcani"
  id: "Kitab-kitab mukjizat: Al-Rumani, Al-Khattabi, Al-Baqillani, dan Abd al-Qahir al-Jurjani"
summary:
  ar: "أربعة كتب في وجه إعجاز القرآن: الرماني يعدد سبع جهات وعشرة أقسام للبلاغة، والخطابي يقيمه على لفظ حامل ومعنى قائم به ورباط ناظم، والباقلاني يذكر ثلاث جهات وينقد مطلع امرئ القيس بيتاً بيتاً، وعبد القاهر الجرجاني يرده إلى النظم وهو توخي معاني النحو ويحلل آية هود 44. ثم القول بالصرفة وردّ الباقلاني والسيوطي عليه."
  en: "Four books on what makes the Qur'an inimitable: al-Rummani lists seven aspects and ten parts of eloquence; al-Khattabi rests it on a carrying word, a meaning that rests on it and a bond that arranges them; al-Baqillani names three aspects and criticises the opening verse of Imru' al-Qays line by line; and Abd al-Qahir al-Jurjani traces it to nazm, the following of grammar's meanings, analysing Hud 44. Then the view of sarfa and its rejection by al-Baqillani and al-Suyuti."
  ur: "قرآن کے اعجاز کی وجہ پر چار کتابیں: رمانی سات جہتیں اور بلاغت کی دس اقسام گنتے ہیں؛ خطابی اسے اٹھانے والے لفظ، اس پر قائم معنی اور جوڑنے والے رباط پر قائم کرتے ہیں؛ باقلانی تین جہتیں بتاتے ہیں اور امرؤ القیس کے مطلع پر شعر بہ شعر نقد کرتے ہیں؛ اور عبد القاہر جرجانی اسے نظم کی طرف لوٹاتے ہیں جو نحو کے معانی کی پیروی ہے اور ہود 44 کا تجزیہ کرتے ہیں۔ پھر صرفہ کا قول اور اس پر باقلانی اور سیوطی کا رد۔"
  fr: "Quatre livres sur ce qui rend le Coran inimitable : al-Rummani énumère sept aspects et dix parties de l'éloquence ; al-Khattabi le fonde sur un mot porteur, un sens qui repose sur lui et un lien qui les ordonne ; al-Baqillani nomme trois aspects et critique l'ouverture d'Imru' al-Qays vers par vers ; et Abd al-Qahir al-Jurjani le ramène au nazm, le suivi des sens de la grammaire, en analysant Hud 44. Puis l'avis de la sarfa et son rejet par al-Baqillani et al-Suyuti."
  es: "Cuatro libros sobre lo que hace inimitable el Corán: al-Rummani enumera siete aspectos y diez partes de la elocuencia; al-Khattabi lo funda en una palabra que porta, un sentido que descansa en ella y un vínculo que las ordena; al-Baqillani nombra tres aspectos y critica el comienzo de Imru' al-Qays verso por verso; y Abd al-Qahir al-Jurjani lo reduce al nazm, el seguimiento de los sentidos de la gramática, analizando Hud 44. Luego la opinión de la sarfa y su rechazo por al-Baqillani y al-Suyuti."
  tr: "Kur'an'ın mucizevi doğası üzerine dört kitap: Al-Rumani yedi yönü ve on bölüm söylemini sıralar; El-Hattabi bunu taşıyıcı bir söz, onunla birlikte duran bir anlam ve şairin bağı üzerine kurar; El-Baqillani üç yönden bahseder ve İmru' el-Kais'in açılış satırını ayet ayet eleştirir; Abdül-Kahir el-Cumreceni ise şiire geri döner; şiire döner; bu şiir dilbilgisel anlamlara odaklanır ve Hud 44 ayetini analiz eder. Sonra saf biçim üzerine tartışma ve el-Baqillani ile el-Süyuti'nin buna karşı reddetmeleri."
  id: "Empat buku tentang sifat ajaib Al-Qur'an: Al-Rumani merinci tujuh aspek dan sepuluh bagian retorika; Al-Khattabi menegaskannya pada kata yang memiliki, makna yang berdiri bersamanya, dan ikatan penyair; Al-Baqillani menyebutkan tiga arah dan mengkritik baris pembuka Imru' al-Qais ayat demi bait; dan Abd al-Qahir al-Jurjani mengembalikannya ke puisi, yang berfokus pada makna gramatikal dan menganalisis ayat Hud 44. Kemudian pembahasan tentang bentuk murni, dan bantahan al-Baqillani serta al-Suyuti terhadapnya."
