id: concept/ibaha
class: concept
kind: legal
label: { ar: "الإباحة", en: "Permissibility (ibaha)" }
summary:
  ar: "تعرّف الموسوعة الكويتية الإباحة في باب آثارها بأنها ما لا يترتب على الفعل المباح معه إثم. وتقسمها من حيث مصدرها إلى أصلية، وهي ما بقي على الأصل دون نص، وشرعية، وهي ما ورد فيه نص بالتخيير؛ ومن حيث الكلية والجزئية إلى أربعة أقسام، وتقسم إذن العباد إلى ما يُراد به الاستهلاك وما يُراد به الانتفاع فقط. ومن آثارها رفع الإثم والحرج، والاختصاص بالمنفعة، وأنها لا تنافي الضمان في الجملة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1405} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1406} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1407}"
  en: "The Kuwaiti encyclopedia, in its section on the effects of permissibility, describes it as an act on which no sin follows. It divides it by source into original (what remains on its default state with no text) and legislated (where a text gives the choice), and by whole and part into four kinds; it divides people's leave into consumption and mere use. Its effects include lifting sin and difficulty, the holder's exclusive use of the benefit, and, in general, it does not exclude liability for damage."
