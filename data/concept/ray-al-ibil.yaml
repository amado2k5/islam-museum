label:
  ar: "رعي الإبل"
  en: "Ray al-ibil"
  ur: "رعی الابل"
summary:
  ar: "رعي الإبل في الكتاب حار لطيف مجفف في الثانية، ويقال إن الإبل لا يضرها سم الحيات والهوام لما يحصل لها من هذا الرعي من الترياقية، ويسقى لنهش الهوام {cite:canon-ibn-sina-print-v1 p.662}"
  en: "Ray al-ibil is in the book hot, subtle and drying in the second degree; it is said that the camels are not harmed by the venom of snakes and vermin because of the theriac quality they gain from this pasture; and it is given for the bites of vermin {cite:canon-ibn-sina-print-v1 p.662}"
  ur: "رعی الابل کتاب میں دوسرے درجے میں گرم، لطیف اور خشک کرنے والا ہے؛ کہا جاتا ہے کہ اونٹوں کو سانپوں اور زہریلے جانوروں کا زہر اس چراگاہ سے ملنے والی تریاقی خاصیت کی وجہ سے نقصان نہیں دیتا؛ اور اسے زہریلے جانوروں کے کاٹنے کے لیے پلایا جاتا ہے {cite:canon-ibn-sina-print-v1 p.662}۔"
