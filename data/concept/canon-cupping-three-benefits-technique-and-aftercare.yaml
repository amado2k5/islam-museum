label:
  ar: "منافع الحجامة الثلاثة وطريقتها وما بعدها عند ابن سينا"
  en: "The three benefits of cupping, its technique and aftercare in the Canon"
  fr: "Trois bienfaits supposés, technique et suites des ventouses dans le Canon"
  ur: "قانون میں حجامہ کے تین فوائد، طریقہ اور بعد کی احتیاط"
  es: "Los tres beneficios de la ventosaterapia, su técnica y cuidados posteriores en Canon."
summary:
  ar: "يعدد ابن سينا ثلاث فوائد للحجامة، ثم يشرح طريقة العمل بالمشرط والمحجمة وما يفعل عند ورم موضع الالتصاق، ويختم بغذاء المحتجم وسنه وما يتناوله الصفراوي بعد الحجامة {cite:canon-ibn-sina-print-v1 p.301}."
  en: "Ibn Sina lists three benefits of cupping, then describes how to work with the lancet and the cup and what to do if the place where it clings swells, and ends with the cupped person's food, his age and what a bilious person takes after it {cite:canon-ibn-sina-print-v1 p.301}."
  fr: "Ibn Sina énumère trois bienfaits, décrit lancette et ventouse et le gonflement gênant son retrait, puis traite alimentation, âge et soins du tempérament bilieux {cite:canon-ibn-sina-print-v1 p.301}."
  es: "Ibn Sina enumera tres beneficios de la ventosaterapia, luego describe cómo trabajar con la lanceta y la ventosa y qué hacer si se inflama el lugar donde se adhiere, y termina con la alimentación de la persona que recibe la ventosaterapia, su edad y lo que una persona con problemas biliares toma después {cite:canon-ibn-sina-print-v1 p.301}."
