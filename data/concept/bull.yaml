id: concept/bull
class: concept
kind: natural
label:
  ar: "بلّ"
  en: "Bull (the Indian cucumber)"
  fr: "Bull (concombre indien)"
  ur: "بلّ ⁦(ہندی ککڑی)⁩"
  es: "Toro (el pepino indio)"
  tr: "Yasa"
  id: "Bill"
summary:
  ar: "قثاء هندي، شبيه بقثاء الكبر، مرّ ويشبه الزنجبيل. حار يابس في الثانية، وعند بعضهم في الثالثة. قابض يقوّي الأحشاء، ينفع من صلابة العصب ورطوبته وأمراضه الباردة كالفالج واللقوة، ويوقد نار المعدة وينفع من القيء، ويدخل في الجوارشنات، ويعقل البطن ويفش الرياح {cite:canon-ibn-sina-print-v1 p.397}، {cite:canon-ibn-sina-print-v1 p.398}."
  en: "The Indian cucumber, like the large cucumber but bitter, and resembling ginger. Hot and dry in the second degree, and in the third degree according to some. Astringent, it strengthens the organs. It helps hardness and dampness of the nerves and their cold disorders such as paralysis and facial palsy, kindles the stomach's fire, helps vomiting, enters the electuaries, binds the belly, and dispels wind {cite:canon-ibn-sina-print-v1 p.397}, {cite:canon-ibn-sina-print-v1 p.398}."
  fr: "Concombre indien semblable au grand concombre, mais amer et ressemblant au gingembre. Chaud et sec au deuxième degré, au troisième selon certains. Astringent, il fortifierait les organes, aiderait contre induration, humidité et troubles froids des nerfs — paralysie et paralysie faciale —, attiserait le feu gastrique et aiderait contre les vomissements. Il entre dans les électuaires, resserrerait le ventre et dissiperait les vents {cite:canon-ibn-sina-print-v1 p.397}, {cite:canon-ibn-sina-print-v1 p.398}."
  ur: "یہ ہندی ککڑی ہے، جو بڑی ککڑی جیسی مگر کڑوی اور ادرک سے ملتی جلتی ہے۔ دوسرے درجے میں گرم اور خشک، اور بعض کے نزدیک تیسرے درجے میں۔ قابض ہے اور اعضاء کو قوت دیتی ہے؛ اعصاب کی سختی اور تری اور ان کی سرد بیماریوں، جیسے فالج اور لقوہ، میں نفع دیتی ہے، معدے کی آگ بھڑکاتی ہے اور قے میں نفع دیتی ہے، جوارشنوں میں داخل ہوتی ہے، پیٹ باندھتی اور ہوا منتشر کرتی ہے {cite:canon-ibn-sina-print-v1 p.397}، {cite:canon-ibn-sina-print-v1 p.398}۔"
  es: "El pepino indio, como el pepino grande pero amargo, y parecido al jengibre. Caliente y seco en segundo grado, y en tercer grado según algunos. Astringente, fortalece los órganos. Ayuda con la dureza y la humedad de los nervios y sus trastornos por frío como la parálisis y la parálisis facial, enciende el fuego del estómago, ayuda a vomitar, entra en los electuarios, aprieta el vientre y disipa los gases {cite:canon-ibn-sina-print-v1 p.397}, {cite:canon-ibn-sina-print-v1 p.398}."
  tr: "Hint skümü, yaşlı tufta benzer, acı ve zencefile benzer. İkinci tüyde sıcak ve kuru, üçüncüsünde bazılarında ise kurudur. İç organları güçlendiren, sinir sertliği, nem ve felç ile güçsüzlük gibi soğuk rahatsızlıklarından faydalanan, mide ateşini ateşleyen, kusmaya yardımcı olan, mideye giren, karnı güçlendiren ve rüzgarı hafifleten {cite:canon-ibn-sina-print-v1 s.397}, {cite:canon-ibn-sina-print-v1 s.398}."
  id: "Indian tucum, mirip dengan tuft tua, pahit dan menyerupai jahe. Panas dan kering pada yang kedua, dan pada sebagian pada yang ketiga. Astringen yang memperkuat isi perut mendapat manfaat dari kekerasan saraf, kelembapan, dan penyakit dingin seperti kelumpuhan dan kelemahan, menyalakan api perut, membantu muntah, masuk ke perut, menguatkan perut, dan meredakan angin {cite:canon-ibn-sina-print-v1 hlm.397}, {cite:canon-ibn-sina-print-v1 hlm.398}."
