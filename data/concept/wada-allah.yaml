label:
  ar: "وعد الله"
  en: "God's promise (wa'd Allah)"
  ur: "اللہ کا وعدہ"
summary:
  ar: "وعد الله كما يعرضه الشيخ عمر عبد الكافي في الحلقة العاشرة من سلسلة «الفوز المبين»: الله أصدق من كل وعد، ووعده للمؤمنين بالجنة حق، ومثال الأب والابن، ودلالة صيغة الفعل الماضي في الآية، وما يطمئن المؤمن إلى الوعد، ومقارنة الوعد بوفاء الناس بوعودهم."
  en: "God's promise as Sheikh Omar Abdelkafy presents it in the tenth lesson of 'Al Fawzu Al Moubeen': God is truer than any promise and His promise to the believers of Paradise is true; the example of the father and the son; what the past tense in the verse signifies; what reassures the believer about the promise; and a comparison between God's promise and people's keeping of their own word."
  ur: "اللہ کا وعدہ جیسا کہ شیخ عمر عبدالکافی نے سلسلہ «الفوز المبین» کے دسویں درس میں پیش کیا: اللہ ہر وعدے سے سچا ہے اور مومنوں سے جنت کا اس کا وعدہ حق ہے؛ باپ اور بیٹے کی مثال؛ آیت میں ماضی کی صورت کا مطلب؛ مومن کو وعدے پر کیا چیز مطمئن کرتی ہے؛ اور اللہ کے وعدے کا لوگوں کے اپنے وعدوں کی پاسداری سے موازنہ۔"
