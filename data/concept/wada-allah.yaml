label:
  ar: "وعد الله"
  en: "God's promise (wa'd Allah)"
  ur: "اللہ کا وعدہ"
  es: "La promesa de Dios (wa'd Allah)"
  fr: "La promesse de Dieu (wa'd Allah)"
summary:
  ar: "وعد الله كما يعرضه الشيخ عمر عبد الكافي في الحلقة العاشرة من سلسلة «الفوز المبين»: الله أصدق من كل وعد، ووعده للمؤمنين بالجنة حق، ومثال الأب والابن، ودلالة صيغة الفعل الماضي في الآية، وما يطمئن المؤمن إلى الوعد، ومقارنة الوعد بوفاء الناس بوعودهم."
  en: "God's promise as Sheikh Omar Abdelkafy presents it in the tenth lesson of 'Al Fawzu Al Moubeen': God is truer than any promise and His promise to the believers of Paradise is true; the example of the father and the son; what the past tense in the verse signifies; what reassures the believer about the promise; and a comparison between God's promise and people's keeping of their own word."
  ur: "اللہ کا وعدہ جیسا کہ شیخ عمر عبدالکافی نے سلسلہ «الفوز المبین» کے دسویں درس میں پیش کیا: اللہ ہر وعدے سے سچا ہے اور مومنوں سے جنت کا اس کا وعدہ حق ہے؛ باپ اور بیٹے کی مثال؛ آیت میں ماضی کی صورت کا مطلب؛ مومن کو وعدے پر کیا چیز مطمئن کرتی ہے؛ اور اللہ کے وعدے کا لوگوں کے اپنے وعدوں کی پاسداری سے موازنہ۔"
  es: "La promesa de Dios, tal como la presenta el jeque Omar Abdelkafy en la décima lección de 'Al Fawzu Al Moubeen': Dios es más verdadero que cualquier promesa y su promesa del Paraíso a los creyentes es verdadera; el ejemplo del padre y el hijo; el significado del tiempo pasado en el versículo; lo que tranquiliza al creyente acerca de la promesa; y una comparación entre la promesa de Dios y el cumplimiento de la palabra por parte de las personas."
  fr: "La promesse de Dieu telle que le cheikh Omar Abdelkafy la présente dans la dixième leçon d'« Al Fawzu Al Moubeen »: Dieu est plus véridique que toute promesse et Sa promesse de Paradis aux croyants est vraie; l'exemple du père et du fils; la signification du passé dans le verset; ce qui rassure le croyant quant à la promesse; et une comparaison entre la promesse de Dieu et le respect de la parole donnée par les hommes."
