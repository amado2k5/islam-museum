  fr: "Sisalyus (la plante que le livre nomme sisalyus)"
summary:
  ar: "السيساليوس في الكتاب نبات ينقل ديسقوريدوس وصفه بأصنافه، ورقه شبيه بورق الرازيانج وله إكليل كإكليل الشبث وأصل طويل طيب الرائحة، حار يابس في الثانية، محلل ملطف مسكن للأوجاع الباطنة مذيب للبلغم الجامد، ينفع من الصرع والربو والسعال المزمن وأوجاع الظهر والكلى والمعدة، وفي الكتاب نقل موسوم في الرحم والطمث {cite:canon-ibn-sina-print-v1 p.592}."
  en: "Sisalyus is in the book a plant described by Dioscorides in several kinds, its leaf like that of fennel with an umbel like dill and a long root of good scent, hot and dry in the second degree, dissolving and thinning, calming inner pains and melting hard phlegm; the book lists it for epilepsy, asthma, chronic cough and pains of the back, kidneys and stomach, with a labelled listing on the womb and menses {cite:canon-ibn-sina-print-v1 p.592}."
  ur: "سیسالیوس کتاب میں ایک پودا ہے جس کی مختلف اقسام دیسقوریدوس کے حوالے سے بیان ہوئی ہیں، اس کا پتا سونف کے پتے جیسا ہے، سویا جیسا گچھا اور لمبی خوشبودار جڑ رکھتا ہے، دوسرے درجے میں گرم خشک، گھلانے اور لطیف کرنے والا، اندرونی دردوں کو تسکین دینے والا اور جمے ہوئے بلغم کو پگھلانے والا؛ کتاب اسے مرگی، دمے، پرانی کھانسی، کمر، گردوں اور معدے کے دردوں کے لیے گنواتی ہے، اور رحم و حیض کے بارے میں ایک موسوم نقل دیتی ہے {cite:canon-ibn-sina-print-v1 p.592}۔"
  es: "Sisalyus es en el libro una planta descrita por Dioscórides en varios tipos, su hoja como la del hinojo con una umbela como el eneldo y una raíz larga de buen aroma, caliente y seca en segundo grado, disuelta y adelgazante, calmando dolores internos y derritiendo la flema dura; el libro la enumera para la epilepsia, el asma, la tos crónica y los dolores de espalda, riñones y estómago, con una lista etiquetada para el útero y la menstruación {cite:canon-ibn-sina-print-v1 p.592}."
  fr: "Le sisalyus est décrit dans le livre comme une plante par Dioscoride sous plusieurs formes, sa feuille ressemblant à celle du fenouil avec une ombelle semblable à celle de l'aneth et une longue racine odorante, chaude et sèche au deuxième degré, dissolvante et fluidifiante, calmant les douleurs internes et faisant fondre les mucosités dures; le livre le mentionne pour l'épilepsie, l'asthme, la toux chronique et les douleurs du dos, des reins et de l'estomac, avec une mention sur l'utérus et les menstruations {cite:canon-ibn-sina-print-v1 p.592}."
