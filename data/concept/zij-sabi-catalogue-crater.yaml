label:
  ar: "الكأس"
  en: "Crater (al-Ka's)"
  ur: "کاسہ"
  es: "Cráter (de al-Ka)"
summary:
  ar: "يسمّي الفهرس صورة الكأس بالعربية، وباسمه اليوناني كراتير. تقع كواكبها على حافة الكأس وعروتيه. والمحقّق يذكر أن ورقة من المخطوطة الإسكوريالية، كانت تضم أول كواكب الكأس وكواكب السفينة والهيدرا، مفقودة. لا تُنقل المواضع. {cite:nallino-albatenii-opus-astronomicum pp.172}"
  en: "The catalogue names the figure al-Ka's, the cup (poculum), and its heading gives the Greek krater. Its stars lie on the lip and the handles. The editor notes that a leaf of the Escorial manuscript, which carried the first stars of the Cup and the stars of the Ship and the Hydra, is missing. Positions are not transcribed here. {cite:nallino-albatenii-opus-astronomicum pp.172}"
  ur: "فہرست میں پیالے کی صورت عربی نام الکاس اور یونانی نام کراٹیر کے ساتھ آتی ہے۔ اس کے ستارے پیالے کے کنارے اور دستوں پر ہیں۔ مرتب بتاتا ہے کہ اسکوریال کے مخطوطے کا وہ ورق، جس میں پیالے کے پہلے ستارے، جہاز اور ہائیڈرا کے ستارے تھے، موجود نہیں۔ مواضع یہاں نقل نہیں ہوئے۔ {cite:nallino-albatenii-opus-astronomicum pp.172}"
  es: "El catálogo denomina a la figura al-Ka's, la copa (poculum), y su encabezado indica el cráter griego. Sus estrellas se encuentran en el borde y las asas. El editor señala que falta una hoja del manuscrito de El Escorial, que contenía las primeras estrellas de la Copa y las estrellas de la Nave y la Hidra. Las posiciones no se transcriben aquí. {cite:nallino-albatenii-opus-astronomicum pp.172}"
