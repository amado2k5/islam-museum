id: concept/desire-shahwa
class: concept
kind: legal
label:
  ar: "الشَّهْوة"
  en: "Shahwa (desire: its effect on touch and ablution, on fasting and pilgrimage, on looking, on marriage by touch and on the breaking of the marriage bond)"
  es: "Shahwa (deseo: su efecto sobre el tacto y la ablución, sobre el ayuno y la peregrinación, sobre la mirada, sobre el matrimonio por contacto y sobre la ruptura del vínculo matrimonial)"
  fr: "Shahwa (désir: son effet sur le toucher et l'ablution, sur le jeûne et le pèlerinage, sur le regard, sur le mariage par le toucher et sur la rupture du lien matrimonial)"
summary:
  ar: "الشهوة توقان النفس إلى المستلذات، وقال الماوردي إن إعطاء النفس حظها من المباح بالتوسط. ولها آثار في الفقه: فالحنفية لا ينقضون الوضوء بلمس المرأة إلا بمباشرة فاحشة، والمالكية والحنابلة يقيدون النقض بالشهوة، والشافعية ينقضونه بالالتقاء مطلقا. وإنزال المني بالنظر المستديم يفسد الصوم عند المالكية والحنابلة، ولا يفسده عند الحنفية والشافعية. ويحرم النظر بشهوة إلى المرأة أجنبية كانت أو محرما إلا الزوجة. وتثبت حرمة المصاهرة بالمس والنظر بشهوة عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10236} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10237} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10238} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10239} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10241} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10242} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10243}"
  en: "Shahwa is the longing of the self for pleasant things. Al-Mawardi held that the self should be given a measured share of what is lawful. It has effects in law. The Hanafis break ablution by touch only with gross contact; the Malikis and Hanbalis limit breach by touch to touch with desire; the Shafi'is make any contact of skin a breach. Emission by sustained looking breaks the fast in the view of the Malikis and Hanbalis but not in that of the Hanafis and Shafi'is. Looking with desire at a woman is forbidden, whether she is a stranger or one's kin, except one's wife. The Hanafis hold that touch or look with desire makes a marriage forbidden as in the case of unlawful intercourse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10236} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10237} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10238} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10239} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10241} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10242} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10243}"
  es: "Shahwa es el anhelo del yo por cosas placenteras. Al-Mawardi sostenía que al yo se le debe dar una porción medida de lo lícito. Tiene efectos en la ley. Los hanafíes rompen la ablución por contacto solo con contacto grueso; los malikíes y hanbalíes limitan la ruptura por contacto al contacto con deseo; los shafiíes consideran que cualquier contacto de la piel constituye una ruptura. La emisión por mirada prolongada rompe el ayuno según los malikíes y hanbalíes, pero no según los hanafíes y shafiíes. Mirar con deseo a una mujer está prohibido, sea extraña o pariente, excepto a la esposa. Los hanafíes sostienen que tocar o mirar con deseo hace que el matrimonio sea ilícito, como en el caso de relaciones sexuales ilícitas. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10236} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10237} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10238} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10239} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10241} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10242} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10243}"
  fr: "La shahwa désigne le désir de l'âme pour les choses agréables. Al-Mawardi estimait que l'âme devait recevoir une part mesurée de ce qui est licite. Ce désir a des conséquences juridiques. Les hanafites rompent les ablutions par le toucher uniquement en cas de contact grossier; les malikites et les hanbalites limitent la rupture du jeûne par le toucher au toucher motivé par le désir; les chaféites considèrent tout contact de la peau comme une rupture. L'émission par un regard prolongé rompt le jeûne selon les malikites et les hanbalites, mais pas selon les hanafites et les chaféites. Regarder une femme avec désir est interdit, qu'elle soit étrangère ou parente, à l'exception de son épouse. Les hanafites considèrent que toucher ou regarder avec désir rend le mariage illicite, comme dans le cas d'une relation sexuelle illicite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10236} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10237} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10238} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10239} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10241} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10242} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10243}"
