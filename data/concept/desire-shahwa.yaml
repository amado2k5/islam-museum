id: concept/desire-shahwa
class: concept
kind: legal
label:
  ar: "الشَّهْوة"
  en: "Shahwa (desire: its effect on touch and ablution, on fasting and pilgrimage, on looking, on marriage by touch and on the breaking of the marriage bond)"
summary:
  ar: "الشهوة توقان النفس إلى المستلذات، وقال الماوردي إن إعطاء النفس حظها من المباح بالتوسط. ولها آثار في الفقه: فالحنفية لا ينقضون الوضوء بلمس المرأة إلا بمباشرة فاحشة، والمالكية والحنابلة يقيدون النقض بالشهوة، والشافعية ينقضونه بالالتقاء مطلقا. وإنزال المني بالنظر المستديم يفسد الصوم عند المالكية والحنابلة، ولا يفسده عند الحنفية والشافعية. ويحرم النظر بشهوة إلى المرأة أجنبية كانت أو محرما إلا الزوجة. وتثبت حرمة المصاهرة بالمس والنظر بشهوة عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10236} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10237} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10238} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10239} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10241} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10242} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10243}"
  en: "Shahwa is the longing of the self for pleasant things. Al-Mawardi held that the self should be given a measured share of what is lawful. It has effects in law. The Hanafis break ablution by touch only with gross contact; the Malikis and Hanbalis limit breach by touch to touch with desire; the Shafi'is make any contact of skin a breach. Emission by sustained looking breaks the fast in the view of the Malikis and Hanbalis but not in that of the Hanafis and Shafi'is. Looking with desire at a woman is forbidden, whether she is a stranger or one's kin, except one's wife. The Hanafis hold that touch or look with desire makes a marriage forbidden as in the case of unlawful intercourse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10236} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10237} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10238} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10239} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10241} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10242} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10243}"
