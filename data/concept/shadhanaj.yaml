summary:
  ar: "الشاذنج في الكتاب يوجد في المعدن ويحفر على حجر الشاذنج من معادن مصر وقد يغش، غير المغسول حار في الأولى يابس إلى الثالثة والمغسول بارد إلى الثانية يابس إلى الثالثة، فيه قبض شديد وقوة مانعة وإسخان ما وتجفيف بالغ، يستعمل ذرورا على اللحم الزائد، ويجلو قروح العين ويدملها وينفع من خشونة الأجفان والرمد وآثار قروح العين، ويسقى لعسر البول، ويذكر الكتاب نقلا موسوما أثره في الطمث والمني {cite:canon-ibn-sina-print-v1 pp.680-681}"
  en: "Shadhanaj is in the book found in the mine and dug upon the stone of shadhanaj from the mines of Egypt, and it may be adulterated; the unwashed is hot in the first degree and dry to the third, and the washed cold to the second and dry to the third; it has strong astringency, a preventive power, some heating and a thorough drying, is used as a dusting on proud flesh, cleanses and heals ulcers of the eye, benefits roughness of the eyelids, ophthalmia and the scars of eye ulcers, and is given to drink for difficulty of urine; the book lists, as a labelled report, its effect on the menses and semen {cite:canon-ibn-sina-print-v1 pp.680-681}"
  ur: "شاذنج کتاب میں کان میں پایا جاتا ہے اور مصر کی کانوں میں شاذنج کے پتھر پر کھودا جاتا ہے اور اس میں ملاوٹ ہو سکتی ہے؛ بغیر دھلا پہلے درجے میں گرم اور تیسرے تک خشک ہے اور دھلا دوسرے تک سرد اور تیسرے تک خشک؛ اس میں سخت قبض، روکنے والی قوت، کچھ گرمی اور بھرپور خشکی ہے، زائد گوشت پر چھڑکنے کے طور پر استعمال ہوتا ہے، آنکھ کے قرحوں کو صاف کرتا اور بھرتا ہے، پپوٹوں کی کھردرائی، آشوبِ چشم اور آنکھ کے قرحوں کے نشانات میں نافع ہے، اور پیشاب کی دشواری میں پلایا جاتا ہے؛ اور کتاب منقول فہرست کے طور پر حیض اور منی پر اس کا اثر درج کرتی ہے {cite:canon-ibn-sina-print-v1 pp.680-681}۔"
  es: "Shadhanaj se encuentra en el libro hallado en la mina y excavado en la piedra de shadhanaj de las minas de Egipto, y puede estar adulterado; el sin lavar es caliente en el primer grado y seco en el tercero, y el lavado frío en el segundo y seco en el tercero; tiene una fuerte astringencia, un poder preventivo, cierto calor y un secado completo, se usa como polvo sobre la piel orgullosa, limpia y cura las úlceras oculares, beneficia la aspereza de los párpados, la oftalmía y las cicatrices de las úlceras oculares, y se da para beber en caso de dificultad para orinar; el libro enumera, como un informe etiquetado, su efecto sobre la menstruación y el semen {cite:canon-ibn-sina-print-v1 pp.680-681}"
  fr: "Le shadhanaj est mentionné dans un livre trouvé dans la mine et extrait de la pierre de shadhanaj provenant des mines d'Égypte. Il peut être falsifié. Le shadhanaj non lavé est chaud au premier degré et sec au troisième, tandis que le shadhanaj lavé est froid au deuxième degré et sec au troisième. Il possède une forte astringence, des propriétés préventives, un léger effet chauffant et un pouvoir asséchant. Il est utilisé en poudre sur les parties érogènes, nettoie et guérit les ulcères oculaires, soulage la rugosité des paupières, l'ophtalmie et les cicatrices d'ulcères oculaires, et est donné en boisson en cas de difficulté à uriner. Le livre mentionne, sous forme de rapport, son effet sur les menstruations et le sperme. {cite:canon-ibn-sina-print-v1 pp.680-681}"
  tr: "Kitaptaki shanaj metalde bulunur ve Mısır'ın minerallerinden biri olan shananj taşına kazınmıştır; sahte olabilir. Yıkanmamış olan, birincide sıcak, üçüncüde sıcak, ikincide soğuk, üçüncüsünde kurudur. Şiddetli sıkılık, güç, ısınma ve şiddetli kurutma ile sınırlıdır. Fazla et için bir tedavi olarak kullanılır, göz ülserlerini giderir, haşlar ve pürüzlü göz kapakları, konjonktivit ve göz ülserleri için faydalıdır. İdrar kaçırma tedavisi olarak verilir. Kitapta 'Adet ve meni üzerindeki etkisi' başlıklı bir anlatımdan bahsedilir {cite:canon-ibn-sina-print-v1 s.680-681}"
  id: "Shanaj dalam buku ini ditemukan pada logam dan diukir pada batu shananj, salah satu mineral Mesir, dan mungkin palsu. Tidak dicuci dipanaskan dari yang pertama kering hingga ketiga, dan yang dicuci dingin untuk yang kedua, kering hingga ketiga. Shanaj ini memiliki kekakuan parah, menghambat kekuatan, pemanasan, dan pengeringan parah. Shanaj digunakan sebagai obat pada kulit berlebih, meredakan luka mata, merebusnya, dan bermanfaat untuk kelopak mata kasar, konjungtivitis, dan luka mata. Obat ini diberikan sebagai obat untuk inkontinensia saluran kemih. Buku ini menyebutkan sebuah narasi berjudul Pengaruhnya pada menstruasi dan sperma {cite:canon-ibn-sina-print-v1 hlm.680-681}"
