id: concept/taswiya-equality
class: concept
kind: legal
label:
  ar: "التسوية"
  en: "Taswiya (equality and levelling: rows, bowing, zakat shares, wives, judges, gifts, shuf'a, public places, graves)"
  ur: "تسویہ (برابری: صفیں، رکوع، زکوٰۃ کے مصارف، بیویوں، قاضی کے فیصلے، عطیات، شفعہ، عام راستے اور قبر)"
summary:
  ar: "التسوية لغة العدل والإنصاف، ويقابلها الجور، ويراد بها في الفقه المساواة في مواطن كثيرة: تسوية الصفوف في الصلاة وتسوية الظهر في الركوع، والتسوية بين الأصناف الثمانية في الزكاة، والتسوية بين الزوجات في القسم، وبين الخصمين في مجلس القضاء، وبين الأولاد في العطية، وبين المستحقين في الشفعة، وبين الناس في المرافق العامة، وتسوية القبر بالأرض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5124} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5133} وتجب التسوية في القسم بين الزوجات وفي المساواة بين الخصمين عند القاضي باتفاق، وتتنوع أحكام غيرها بين الوجوب والاستحباب بحسب المذهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5128} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5129} وفي عطية الأولاد يرى الحنابلة وجوب التسوية، والجمهور استحبابها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5130}"
  en: "Taswiya means justice and fairness in the language; its opposite is injustice. In the jurists' use it means equality in many matters: levelling the rows and the back in bowing in prayer, equal shares among the eight categories in zakat, equal turns among wives, equal treatment of two litigants before the judge, equal gifts among children, equal shares among those entitled to pre-emption, equal use of public places, and levelling the grave. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5124} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5133} Equal turns among wives and equal treatment of litigants are required by agreement; the other matters range between obligation and recommendation according to the school. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5128} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5129} On equal gifts to children, the Hanbalis hold it obligatory and the majority hold it recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5130}"
