id: concept/taswiya-equality
class: concept
kind: legal
label:
  ar: "التسوية"
  en: "Taswiya (equality and levelling: rows, bowing, zakat shares, wives, judges, gifts, shuf'a, public places, graves)"
  ur: "تسویہ ⁦(برابری: صفیں، رکوع، زکوٰۃ کے مصارف، بیویوں، قاضی کے فیصلے، عطیات، شفعہ، عام راستے اور قبر)⁩"
  es: "Taswiya (igualdad y nivelación: filas, reverencias, reparto del zakat, esposas, jueces, regalos, shuf'a, lugares públicos, tumbas)"
  fr: "Taswiya (égalité et égalisation: rangs, prosternations, parts de zakat, épouses, juges, cadeaux, shuf'a, lieux publics, tombes)"
summary:
  ar: "التسوية لغة العدل والإنصاف، ويقابلها الجور، ويراد بها في الفقه المساواة في مواطن كثيرة: تسوية الصفوف في الصلاة وتسوية الظهر في الركوع، والتسوية بين الأصناف الثمانية في الزكاة، والتسوية بين الزوجات في القسم، وبين الخصمين في مجلس القضاء، وبين الأولاد في العطية، وبين المستحقين في الشفعة، وبين الناس في المرافق العامة، وتسوية القبر بالأرض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5124} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5133} وتجب التسوية في القسم بين الزوجات وفي المساواة بين الخصمين عند القاضي باتفاق، وتتنوع أحكام غيرها بين الوجوب والاستحباب بحسب المذهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5128} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5129} وفي عطية الأولاد يرى الحنابلة وجوب التسوية، والجمهور استحبابها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5130}"
  en: "Taswiya means justice and fairness in the language; its opposite is injustice. In the jurists' use it means equality in many matters: levelling the rows and the back in bowing in prayer, equal shares among the eight categories in zakat, equal turns among wives, equal treatment of two litigants before the judge, equal gifts among children, equal shares among those entitled to pre-emption, equal use of public places, and levelling the grave. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5124} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5133} Equal turns among wives and equal treatment of litigants are required by agreement; the other matters range between obligation and recommendation according to the school. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5128} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5129} On equal gifts to children, the Hanbalis hold it obligatory and the majority hold it recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5130}"
  es: "Taswiya significa justicia y equidad en el idioma; su opuesto es injusticia. En el uso de los juristas significa igualdad en muchos asuntos: nivelar las filas y la espalda al inclinarse en la oración, partes iguales entre las ocho categorías en zakat, turnos iguales entre las esposas, trato igualitario de dos litigantes ante el juez, regalos iguales entre los hijos, partes iguales entre los que tienen derecho de preferencia, uso igualitario de los lugares públicos y nivelación de la tumba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5124} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5133} Los turnos iguales entre las esposas y el trato igualitario de los litigantes son requeridos por acuerdo; los demás asuntos varían entre obligación y recomendación según la escuela. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5128} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5129} En cuanto a la igualdad de regalos para los niños, los hanbalis lo consideran obligatorio y la mayoría lo considera recomendado. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5130}"
  fr: "En kuwa, Taswiya signifie justice et équité; son contraire est l’injustice. Du point de vue des juristes, ce terme désigne l’égalité dans de nombreux domaines: alignement des rangs et du dos lors de la prière, parts égales de la zakat entre les huit catégories, tours égaux entre les épouses, traitement égal des deux parties devant le juge, égalité des dons entre les enfants, parts égales entre les personnes ayant droit à la préemption, usage égal des lieux publics et nivellement des tombes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5124} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5133} L’égalité des tours entre les épouses et le traitement égal des parties sont des exigences contractuelles; pour les autres points, il s’agit d’obligations ou de recommandations, selon l’école rabbinique. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5128} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5129} Sur l'égalité des cadeaux aux enfants, les Hanbalis le considèrent comme obligatoire et la majorité le considèrent comme recommandé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5130}"
  ur: "تسویہ کا مطلب زبان میں انصاف اور انصاف ہے۔ اس کے برعکس ظلم ہے. فقہا کے استعمال میں اس کا مطلب بہت سے معاملات میں برابری ہے: نماز میں رکوع میں صف اور پیٹھ برابر کرنا، زکوٰۃ میں آٹھ قسموں میں برابر کا حصہ، بیویوں کے درمیان مساوی باری، جج کے سامنے دو مدعیان کے ساتھ یکساں سلوک، بچوں کے درمیان مساوی تحفہ، قبلہ اول کے حقداروں میں مساوی حصہ، عوامی مقامات کا مساوی استعمال، اور قبر کو برابر کرنا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5124} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5133} ازواج مطہرات کے درمیان مساوی موڑ اور مدعا علیہان کے ساتھ یکساں سلوک معاہدہ کی ضرورت ہے۔ دیگر معاملات اسکول کے مطابق ذمہ داری اور سفارش کے درمیان ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5128} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5129} بچوں کو مساوی تحفہ دینے پر، حنبلی اسے واجب سمجھتے ہیں اور اکثریت اسے مستحب سمجھتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 5130}"
