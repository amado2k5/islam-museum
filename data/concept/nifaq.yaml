label:
  ar: النفاق
  en: Hypocrisy (nifaq)
summary:
  ar: "النفاق في الحديث الثامن والأربعين من زيادات ابن رجب يعرف بعلاماته العملية: «أربع من كن فيه كان منافقاً وإن كانت خصلة منهن فيه كانت فيه خصلة من النفاق حتى يدعها: من إذا حدث كذب وإذا وعد أخلف وإذا خاصم فجر وإذا عاهد غدر» — فاجتماعها كمال النفاق ووجود الواحدة خصلة منه لا كفر بها وحدها، وفي لفظ أبي هريرة «وإن صام وصلى وزعم أنه مسلم»؛ ورد ابن رجب تأويل من مال إلى الإرجاء فحمل الحديث على منافقي عهد النبي خاصة برواية محمد المحرم عن عطاء عن جابر وقال إنه كذب والمحرم معروف بالكذب (جامع العلوم والحكم ص 901)."
  en: "Hypocrisy in the forty-eighth hadith of Ibn Rajab's additions is known by its practical marks: 'four traits — whoever has them all is a hypocrite, and whoever has one of them has a trait of hypocrisy until he gives it up: when he speaks he lies, when he promises he breaks his word, when he disputes he behaves wickedly, and when he pledges he betrays' — their totality is perfected hypocrisy while a single one is a trait of it without constituting unbelief alone; Abu Hurayra's wording adds 'though he fast and pray and claim to be a Muslim'; Ibn Rajab rejects the interpretation of those leaning to irja' who confined the hadith to the hypocrites of the Prophet's era via Muhammad al-Muharram's report from Ata' from Jabir — calling it a lie, al-Muharram being a known liar (Jami' al-Ulum wal-Hikam p. 901)."
