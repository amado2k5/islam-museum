label:
  ar: النفاق
  en: Hypocrisy (nifaq)
  es: "Hipocresía (nifaq)"
  fr: "Hypocrisie (nifaq)"
  ur: "منافقت ⁦(نفاق)⁩"
summary:
  ar: "النفاق في الحديث الثامن والأربعين من زيادات ابن رجب يعرف بعلاماته العملية: «أربع من كن فيه كان منافقاً وإن كانت خصلة منهن فيه كانت فيه خصلة من النفاق حتى يدعها: من إذا حدث كذب وإذا وعد أخلف وإذا خاصم فجر وإذا عاهد غدر» — فاجتماعها كمال النفاق ووجود الواحدة خصلة منه لا كفر بها وحدها، وفي لفظ أبي هريرة «وإن صام وصلى وزعم أنه مسلم»؛ ورد ابن رجب تأويل من مال إلى الإرجاء فحمل الحديث على منافقي عهد النبي خاصة برواية محمد المحرم عن عطاء عن جابر وقال إنه كذب والمحرم معروف بالكذب ⁦(جامع العلوم والحكم ص 901)⁩."
  en: "Hypocrisy in the forty-eighth hadith of Ibn Rajab's additions is known by its practical marks: 'four traits — whoever has them all is a hypocrite, and whoever has one of them has a trait of hypocrisy until he gives it up: when he speaks he lies, when he promises he breaks his word, when he disputes he behaves wickedly, and when he pledges he betrays' — their totality is perfected hypocrisy while a single one is a trait of it without constituting unbelief alone; Abu Hurayra's wording adds 'though he fast and pray and claim to be a Muslim'; Ibn Rajab rejects the interpretation of those leaning to irja' who confined the hadith to the hypocrites of the Prophet's era via Muhammad al-Muharram's report from Ata' from Jabir — calling it a lie, al-Muharram being a known liar (Jami' al-Ulum wal-Hikam p. 901)."
  es: "La hipocresía en el hadiz número cuarenta y ocho de las adiciones de Ibn Rajab se conoce por sus características prácticas: \"cuatro rasgos: quien los tiene todos es un hipócrita, y quien tiene uno de ellos tiene un rasgo de hipocresía hasta que lo abandona: cuando habla miente, cuando promete rompe su palabra, cuando discute se comporta malvadamente y cuando jura traiciona\". Su totalidad es hipocresía perfeccionada, mientras que uno solo es un rasgo de ella sin constituir incredulidad por sí solo. La redacción de Abu Hurayra añade: \"aunque ayune, rece y afirme ser musulmán\". Ibn Rajab rechaza la interpretación de aquellos que se inclinan por irja' que limitaron el hadiz a los hipócritas de la era del Profeta a través del informe de Muhammad al-Muharram de Ata' de Jabir, calificándolo de mentira, siendo al-Muharram un mentiroso conocido (Jami' al-Ulum wal-Hikam p. 901)."
  fr: "L'hypocrisie dans le quarante-huitième hadith des ajouts d'Ibn Rajab est reconnue par ses signes pratiques: « quatre traits — celui qui les possède tous est hypocrite, et celui qui n'en possède qu'un seul a un trait d'hypocrisie jusqu'à ce qu'il y renonce: lorsqu'il parle, il ment, lorsqu'il promet, il manque à sa parole, lorsqu'il conteste, il agit mal, et lorsqu'il s'engage, il trahit » — leur totalité constitue l'hypocrisie parfaite, tandis qu'un seul en est un trait sans constituer à lui seul l'incroyance; la formulation d'Abu Hurayra ajoute: « bien qu'il jeûne, prie et se prétende musulman »; Ibn Rajab rejette l'interprétation de ceux qui penchent pour l'irja' qui ont limité le hadith aux hypocrites de l'époque du Prophète via le rapport de Muhammad al-Muharram d'après Ata' de Jabir — le qualifiant de mensonge, al-Muharram étant un menteur connu (Jami' al-Ulum wal-Hikam p. 901)."
  ur: "ابن رجب کے اضافے کی اڑتالیسویں حدیث میں منافقت اس کے عملی نشانات سے معلوم ہوتی ہے: چار خصلتیں جس میں یہ سب ہوں وہ منافق ہے اور جس میں ان میں سے ایک بھی ہو اس میں نفاق کی ایک خصلت ہے جب تک کہ وہ اسے ترک نہ کرے، جب بات کرے تو جھوٹ بولے، جب وعدہ کرے تو وعدہ خلافی کرے، جب وعدہ خلافی کرے تو جھوٹ بولے۔ خیانت' - ان کی مکملیت مکمل منافقت ہے جبکہ ایک واحد اس کی خصوصیت ہے بغیر کفر کی تشکیل کے۔ ابوہریرہ کے الفاظ میں اضافہ ہوتا ہے 'حالانکہ وہ روزہ رکھتا ہے اور نماز پڑھتا ہے اور مسلمان ہونے کا دعویٰ کرتا ہے'۔ ابن رجب نے ارجاء کی طرف جھکاؤ رکھنے والوں کی اس تاویل کو رد کیا ہے جنہوں نے حدیث کو محمد المحرم نے عطاء سے جابر کی روایت کے ذریعے نبی کے دور کے منافقین تک محدود کر دیا - اسے جھوٹ قرار دیا، محرم کو معروف جھوٹا قرار دیا ⁦(جامع العلوم والحکم ص 901)⁩۔"
