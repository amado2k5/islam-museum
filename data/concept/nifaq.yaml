  id: sunni-sharawi-hypocrites
  stance:
    ar: "النفاق إظهار الإسلام وإخفاء الكفر، والمنافق يطلب الأمان من الفريقين فيتقلب بينهما"
    en: "Hypocrisy is showing Islam and hiding unbelief; the hypocrite seeks safety from both sides and shifts between them"
  summary:
    ar: "يرى الشعراوي أن المنافق يُظهر الإيمان بلسانه ويُخفي الكفر في قلبه، ويحاول أن يحفظ مكانه مع الفريقين، فيقلق على مستقبل الإسلام، ولذلك تمنى أن يكون المؤمنون مثله {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2525}{cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2526}. ويذكر أن المنافقين لا يقفون من الإيمان موقف الحياد بل موقف العناد {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2529}. ويصف الآيات بأنها في قوم يريدون الأمان من الفريقين، فإن لم يعتزلوا ويلقوا السلم ويكفوا أيديهم جاز أخذهم، وإن اعتزلوا ولم يقاتلوا فلهم الأمان {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2534}{cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2536}. وهذا رأيه في موضع تفسيره، ولم تُعرض بعد أقوال المفسرين والمتكلمين في هذه الآيات من مصدر محدد (needs_source)."
    en: "Sha'rawi holds that the hypocrite shows belief with his tongue and hides unbelief in his heart, and tries to keep his place with both camps, so he is anxious about Islam's future; that is why he wishes the believers were like him {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2525}{cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2526}. He notes that the hypocrites stand against faith with hostility, not neutrality {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2529}. He reads the verses as describing people who want safety from both sides: if they neither withdraw nor offer peace and hold their hands, they may be seized; if they withdraw and do not fight, they are safe {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2534}{cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2536}. This is his view; the views of exegetes and theologians on these verses are not yet set out from a named source (needs_source)."
