class: concept
label: { ar: "تقسيم العلوم عند حاجي خليفة", en: "Classifications of the sciences by Hajji Khalifa", es: "Clasificaciones de las ciencias por Hajji Khalifa", fr: "Classifications des sciences par Hajji Khalifa", ur: "حاجی خلیفہ کے ذریعہ علوم کی درجہ بندی", tr: "Hacı Halife'ye göre bilim bölümü", id: "Pembagian ilmu pengetahuan menurut Haji Khalifa" }
kind: discipline
summary:
  ar: "جمع حاجي خليفة في الفصل الرابع من مقدمة كشف الظنون تقسيمات أصحاب الموضوعات للعلوم: فالتقسيم الأول للعلامة الحفيد قسّم العلوم المدونة إلى ما دونه المتشرعة لبيان ألفاظ القرآن والسنة وإثبات الأحكام الاعتقادية والعملية ومدخلية الفنون الأدبية، وما دونه الفلاسفة لتحقيق الأشياء؛ وعد في علوم المتشرعة علم القراءة والحديث وأصوله والتفسير والكلام والفقه وأصوله والأدب وللخواص من الصوفية علم التصوف، ونازع في إدراج المناظرة والجدل فناسب عد الخلاف من الشرعيات إذ دونه المتشرعة ولم يدونه الحكماء؛ والتقسيم الثاني في الفوائد الخاقانية قسم العلوم إلى نظرية غير متعلقة بكيفية عمل وعملية متعلقة بها، وإلى آلية مقصودة لغيرها وغير آلية مقصودة بذواتها، ورجع معنى الآلي إلى معنى العملي {cite:kashf-zunun-furqan p. 70-72}."
  en: "In Kashf al-Zunun's fourth fasl Hajji Khalifa gathers the classifiers' schemes: the Allama al-Hafid's bipartition into sciences written by the shar'-scholars (qira'a, hadith, tafsir, kalam, fiqh, usul, adab, plus the Sufis' tasawwuf) versus the philosophers', his own ruling that jadal belongs to the shar'i fold since the hakims never codified it, and the Fawa'id Khaqaniyya's nazari/amali and instrumental/non-instrumental splits {cite:kashf-zunun-furqan p. 70-72}."
  es: "En el cuarto fasl de Kashf al-Zunun, Hajji Khalifa reúne los esquemas de los clasificadores: la bipartición de Allama al-Hafid en ciencias escritas por los eruditos shar'i frente a las escritas por los filósofos, su propia decisión de que el jadal pertenece al ámbito shar'i ya que los hakims nunca lo codificaron, y las divisiones nazari/amali e instrumental/no instrumental de la Fawa'id Khaqaniyya {cite:kashf-zunun-furqan p. 70-72}."
  fr: "Dans le quatrième fasl de Kashf al-Zunun, Hajji Khalifa rassemble les schémas des classificateurs: la bipartition d'Allama al-Hafid en sciences écrites par les érudits de la charia contre celles des philosophes, sa propre décision selon laquelle le jadal appartient au giron de la charia puisque les hakims ne l'ont jamais codifié, et les divisions nazari/amali et instrumentales/non instrumentales de la Khaqaniyya Fawa'id {cite:kashf-zunun-furqan p. 70-72}."
  ur: "کشف الزنون کے چوتھے فصیل میں حاجی خلیفہ نے درجہ بندی کرنے والوں کی تدبیریں جمع کی ہیں: علامہ حفید کا فلسفیوں کے مقابلے میں شرعی علماء کے لکھے ہوئے علوم میں دو حصوں کی تقسیم، ان کا اپنا یہ حکم کہ جدل کا تعلق شرعی حلقہ سے ہے چونکہ فقیہ اور خاشقجی نے کبھی بھی فقیہ اور خاشقجی کے اصولوں کو بیان نہیں کیا۔ نظری/امالی اور سازی/غیر سازی تقسیم {حوالہ: کشف-زنون-فرقان ص۔ 70-72}۔"
  tr: "Kaşf el-Zunun'un girişinin dördüncü bölümünde, Hacı Halife, bilim konularının yazarlarının sınıflandırmalarını derledi: Alim El-Hafid'in ilk bölümü, kayıtlı bilimleri, yasama organlarının Kur'an ve Sünnet'in sözlerini açıklamak, doktrinsel ve pratik hükümler koymak, edebi sanatların tanıtımı ve filozofların işleri gerçekleştirmek için yazdıkları olarak ayırdı; yasama organının bilimleri arasında okuma bilimi, hadis ve onun ilkeleri olarak değerlendirildi, tefsir, teoloji, fıkıh ve ilkeleri, edebiyat. Sufiler arasındaki seçkinler için Sufizmi bir bilim olarak kabul etti ve münazara ile münakaşanın dahil edilmesini reddetti; bu nedenle, bilginlerin değil, bilginlerin değil, bilginlerin kaydettiği meşru olanlar arasındaki anlaşmazlığı değerlendirmek uygun oldu. İkinci bölüm, Khakaniyya faydalarında, bilimleri nasıl çalıştıkları ve uygulamalarıyla ilgisi olmayan teorilere ve başkalarına yönelik bir mekanizmaya ayırdı; kendi başına kasıtlı bir mekanizma değildi. 'Otomatik' kelimesinin anlamı pratik (cite:) kavramına geri döndü {cite:) Kaşf-Zunun-Furqan, s. 70-72}."
  id: "Dalam bab keempat pengantar Kashf al-Zunun, Haji Khalifa menyusun klasifikasi para penulis topik ilmu pengetahuan: Pembagian pertama oleh ulama Al-Hafid membagi ilmu yang tercatat menjadi apa yang ditulis oleh para legislator untuk memperjelas kata-kata Al-Qur'an dan Sunnah, menetapkan aturan doktrinal dan praktis, serta pengenalan seni sastra, dan apa yang ditulis para filsuf untuk mewujudkan sesuatu; ia mempertimbangkan di antara ilmu legislatif ilmu bacaan, hadis, prinsipnya, tafsir, teologi, yurisprudensi dan prinsipnya, sastra. Bagi elit di antara para Sufi, ia menganggap Sufisme sebagai sebuah ilmu, dan ia memperdebatkan adanya debat dan debat, sehingga tepat untuk mempertimbangkan perbedaan pendapat di antara yang sah, karena para ulama mencatatnya dan bukan yang bijaksana. Pembagian kedua, dalam manfaat Khaqaniyya, membagi ilmu menjadi teori-teori yang tidak terkait dengan cara kerja dan praktiknya, dan menjadi mekanisme yang ditujukan untuk orang lain dan bukan mekanisme yang disengaja itu sendiri. Makna 'otomatis' dikembalikan ke praktik {cite:Kashf-Zunun-Furqan, hlm. 70-72}."
