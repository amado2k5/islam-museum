id: concept/taqsim-al-ulum-hajji-khalifa
class: concept
label: { ar: "تقسيم العلوم عند حاجي خليفة" }
kind: discipline
summary:
  ar: "جمع حاجي خليفة في الفصل الرابع من مقدمة كشف الظنون تقسيمات أصحاب الموضوعات للعلوم: فالتقسيم الأول للعلامة الحفيد قسّم العلوم المدونة إلى ما دونه المتشرعة لبيان ألفاظ القرآن والسنة وإثبات الأحكام الاعتقادية والعملية ومدخلية الفنون الأدبية، وما دونه الفلاسفة لتحقيق الأشياء؛ وعد في علوم المتشرعة علم القراءة والحديث وأصوله والتفسير والكلام والفقه وأصوله والأدب وللخواص من الصوفية علم التصوف، ونازع في إدراج المناظرة والجدل فناسب عد الخلاف من الشرعيات إذ دونه المتشرعة ولم يدونه الحكماء؛ والتقسيم الثاني في الفوائد الخاقانية قسم العلوم إلى نظرية غير متعلقة بكيفية عمل وعملية متعلقة بها، وإلى آلية مقصودة لغيرها وغير آلية مقصودة بذواتها، ورجع معنى الآلي إلى معنى العملي {cite:kashf-zunun-furqan p. 70-72}."
  en: "In Kashf al-Zunun's fourth fasl Hajji Khalifa gathers the classifiers' schemes: the Allama al-Hafid's bipartition into sciences written by the shar'-scholars (qira'a, hadith, tafsir, kalam, fiqh, usul, adab, plus the Sufis' tasawwuf) versus the philosophers', his own ruling that jadal belongs to the shar'i fold since the hakims never codified it, and the Fawa'id Khaqaniyya's nazari/amali and instrumental/non-instrumental splits {cite:kashf-zunun-furqan p. 70-72}."
