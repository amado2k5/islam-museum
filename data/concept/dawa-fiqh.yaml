label:
  ar: "الدعوة ⁦(في الفقه)⁩"
  en: "Da'wa (the fiqh article: call, invitation and summons)"
  ur: "دعوت ⁦(فقہی اصطلاح)⁩"
  es: "Da'wa (el artículo de fiqh: llamado, invitación y convocatoria)"
  fr: "Da'wa (l'article de fiqh: appel, invitation et convocation)"
summary:
  ar: "الدعوة في الفقه تشمل ثلاثة معانٍ تعالجها الموسوعة: تبليغ الدين والدخول فيه، والمناداة وطلب الحضور، والطعام الذي يُدعى إليه. وتأخذ الدعوة حكم ما تدعو إليه؛ فدعوة الإسلام فرض لازم على المسلمين فرض كفاية على الراجح، وتجب الإجابة إلى ما يدعو إليه أمر واجب، وتكون مستحبة أو مباحة في أكثر دعوات الطعام، وتسقط الإجابة بأعذار وموانع معروفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8166} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8167} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8168}"
  en: "In fiqh the word da'wa covers three senses the encyclopedia treats: conveying the religion and entering it, calling someone and asking them to attend, and the food to which one invites people. A call takes the ruling of what it summons to: calling to Islam is a binding duty, a collective obligation on the Muslims according to the stronger view; answering a summons to a required act is binding, while answering most meal invitations is recommended or permitted; there are recognised excuses that end the duty to answer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8166} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8167} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8168}"
  ur: "فقہ میں دعوت کے تین معنی لیے گئے ہیں: دین کی تبلیغ اور اس میں داخل ہونے کی طلب، بلانا اور حاضری کا مطالبہ، اور وہ کھانا جس کی طرف لوگوں کو بلایا جائے۔ دعوت کا حکم اسی چیز کا حکم لیتا ہے جس کی طرف بلایا جائے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8166} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8182}"
  es: "En fiqh, la palabra da'wa abarca tres sentidos que la enciclopedia trata: transmitir la religión e ingresar a ella, llamar a alguien e invitarlo a asistir, y la comida a la que se invita a la gente. Una llamada se rige por la norma de aquello a lo que convoca: llamar al Islam es un deber vinculante, una obligación colectiva para los musulmanes según la opinión más fuerte; responder a una llamada para realizar un acto requerido es vinculante, mientras que responder a la mayoría de las invitaciones a comer es recomendable o permisible; existen excusas reconocidas que eximen del deber de responder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8166} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8167} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8168}"
  fr: "En jurisprudence islamique (fiqh), le mot da'wa recouvre trois sens que l'encyclopédie aborde: la transmission de la religion et l'entrée dans celle-ci, l'invitation à participer à un repas et l'invitation à un repas. Un appel est soumis à la règle de ce à quoi il invite: appeler à l'islam est un devoir obligatoire, une obligation collective pour les musulmans selon l'avis le plus strict; répondre à un appel à un acte requis est obligatoire, tandis que répondre à la plupart des invitations à un repas est recommandé ou permis; il existe des excuses reconnues qui dispensent de l'obligation de répondre."
