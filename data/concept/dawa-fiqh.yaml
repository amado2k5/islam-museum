label:
  ar: "الدعوة (في الفقه)"
  en: "Da'wa (the fiqh article: call, invitation and summons)"
  ur: "دعوت (فقہی اصطلاح)"
summary:
  ar: "الدعوة في الفقه تشمل ثلاثة معانٍ تعالجها الموسوعة: تبليغ الدين والدخول فيه، والمناداة وطلب الحضور، والطعام الذي يُدعى إليه. وتأخذ الدعوة حكم ما تدعو إليه؛ فدعوة الإسلام فرض لازم على المسلمين فرض كفاية على الراجح، وتجب الإجابة إلى ما يدعو إليه أمر واجب، وتكون مستحبة أو مباحة في أكثر دعوات الطعام، وتسقط الإجابة بأعذار وموانع معروفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8166} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8167} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8168}"
  en: "In fiqh the word da'wa covers three senses the encyclopedia treats: conveying the religion and entering it, calling someone and asking them to attend, and the food to which one invites people. A call takes the ruling of what it summons to: calling to Islam is a binding duty, a collective obligation on the Muslims according to the stronger view; answering a summons to a required act is binding, while answering most meal invitations is recommended or permitted; there are recognised excuses that end the duty to answer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8166} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8167} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8168}"
  ur: "فقہ میں دعوت کے تین معنی لیے گئے ہیں: دین کی تبلیغ اور اس میں داخل ہونے کی طلب، بلانا اور حاضری کا مطالبہ، اور وہ کھانا جس کی طرف لوگوں کو بلایا جائے۔ دعوت کا حکم اسی چیز کا حکم لیتا ہے جس کی طرف بلایا جائے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8166} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8182}"
