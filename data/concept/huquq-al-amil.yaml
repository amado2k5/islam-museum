label:
  ar: "العلاقة بين العامل وصاحب العمل"
  en: "The relation between worker and employer"
  ur: "مزدور اور آجر کا تعلق"
summary:
  ar: "يرى عمر عبد الكافي أن المؤسسات لا تنتج بالإدارة والتخطيط وحدهما بل بمنظومة حب بين الإدارة والعاملين، وأن ظلم الموظف أو بخسه أجره أو تكليفه فوق طاقته تطفيف وظلم، ويحذّر من دعوة المظلوم."
  en: "Omar Abdelkafy holds that institutions are productive not by management and planning alone but by a system of love between management and workers, and that wronging an employee, shorting his pay or overloading him is short measure and injustice; he warns against the prayer of the wronged."
  ur: "عمر عبد الکافی کے نزدیک ادارے صرف انتظام اور منصوبہ بندی سے نہیں بلکہ انتظامیہ اور کارکنوں کے درمیان محبت کے نظام سے پیداواری بنتے ہیں، اور ملازم پر ظلم، اس کی اجرت میں کمی یا طاقت سے زیادہ بوجھ ڈالنا ناپ تول میں کمی اور ظلم ہے؛ وہ مظلوم کی بددعا سے خبردار کرتے ہیں۔"
