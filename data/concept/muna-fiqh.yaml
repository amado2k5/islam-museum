id: concept/muna-fiqh
class: concept
kind: legal
label:
  ar: "المُؤْنَة"
  en: "Mu'na (cost and maintenance): zakat, hire, usurped goods, waqf and loan"
  ur: "مؤنہ (خرچ اور نگہداشت): زکات، اجارہ، غصب، وقف اور عاریت"
summary:
  ar: "المؤنة في اللغة الثقل، والمؤنة عند الفقهاء الكُلفة، أي ما يتكلفه الإنسان من نفقة ونحوها، وكثيراً ما يعبّر الفقهاء بالمؤنة عن النفقة، وقال الشرقاوي إن المؤنة أعم من النفقة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13783-13784}. ومن أحكامها: مؤنة الزرع والثمار في الزكاة، وقد اختلف فيها المالكية والشافعية والحنابلة والحنفية {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13784-13785}؛ ومؤنة الإجارة على قسمين: رد العين المستأجرة، وما يحتاجه المستأجر أثناء المدة، فالمؤنة الثانية على المؤجر باتفاق، وتختلف المذاهب في شرط النفقة على المستأجر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13785-13788}؛ ومؤنة رد المغصوب على الغاصب، وإن نُقل المغصوب إلى بلد آخر فللمالكية والحنفية والشافعية والحنابلة تفصيل {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13788-13790}؛ ومؤنة الموقوف من غلته أو على شرط الواقف، والحنفية يبدؤون من غلة الوقف بعمارته، وإذا تعطلت منافعه فللشافعية تكون النفقة من بيت المال {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13790-13791}؛ ومؤنة العارية هل تكون على المستعير أو المعير، وكذلك مؤنة ردها، والخلاف فيهما مذكور {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13791-13792}."
  en: "Mu'na, in lexicon, is burden; in fiqh it is the cost a person bears, such as maintenance and similar expense. Jurists often use mu'na for nafaqa (support), and al-Sharqawi holds that mu'na is wider than nafaqa {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13783-13784}. Its rulings cover: the costs of crops and fruit in zakat, where the schools differ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13784-13785}; hire, where the cost of returning the hired thing is distinguished from the cost of keeping it during the term, the latter falling on the lessor by consensus while the schools differ on making food or fodder a condition on the hirer {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13785-13788}; the cost of returning usurped goods, which falls on the usurper, and the case where goods are carried to another town {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13788-13790}; the cost of waqf property, paid from its yield or as the founder stipulated, and from the treasury (bayt al-mal) when it has no yield according to the Shafi'is {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13790-13791}; and the cost of a loaned object, whether it falls on the borrower or the lender, and of its return {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13791-13792}."
  ur: "مؤنہ لغت میں بوجھ کو کہتے ہیں؛ فقہ میں یہ وہ خرچ ہے جو انسان پر پڑتا ہے، جیسے نان نفقہ وغیرہ۔ فقہاء اکثر نفقہ کی جگہ مؤنہ بولتے ہیں، اور شرقاوی کے نزدیک مؤنہ نفقہ سے زیادہ عام ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13783-13784}۔ اس کے احکام میں زکات میں کھیتی اور پھل کا خرچ، جس میں مذاہب مختلف ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13784-13785}؛ اجارہ میں چیز واپس کرنے کا خرچ اور مدت کے دوران رکھنے کا خرچ، جس میں مؤجر پر دوسری صورت کا خرچ بالاتفاق ہے، اور شرط کے بارے میں اختلاف ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13785-13788}؛ غصب شدہ چیز کی واپسی کا خرچ غاصب پر ہے، اور اگر چیز دوسرے شہر لے جائی گئی ہو تو مذاہب میں تفصیل ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13788-13790}؛ وقف کا خرچ اس کی آمدنی سے یا واقف کی شرط کے مطابق ہوتا ہے، اور شافعیہ کے نزدیک منافع معطل ہوں تو خرچ بیت المال سے ہوگا {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13790-13791}؛ اور عاریت کی مؤنہ اور اس کی واپسی کا خرچ مستعیر پر ہے یا معیر پر، اس میں اختلاف ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13791-13792}۔"
