id: concept/muna-fiqh
class: concept
kind: legal
label:
  ar: "المُؤْنَة"
  en: "Mu'na (cost and maintenance): zakat, hire, usurped goods, waqf and loan"
  ur: "مؤنہ ⁦(خرچ اور نگہداشت)⁩: زکات، اجارہ، غصب، وقف اور عاریت"
  es: "Mu'na (costo y mantenimiento): zakat, alquiler, bienes usurpados, waqf y préstamo"
  fr: "Mu'na (frais et entretien): zakat, loyer, biens usurpés, waqf et prêt"
  tr: "Hükümler"
  id: "Ketentuan"
summary:
  ar: "المؤنة في اللغة الثقل، والمؤنة عند الفقهاء الكُلفة، أي ما يتكلفه الإنسان من نفقة ونحوها، وكثيراً ما يعبّر الفقهاء بالمؤنة عن النفقة، وقال الشرقاوي إن المؤنة أعم من النفقة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13783-13784}. ومن أحكامها: مؤنة الزرع والثمار في الزكاة، وقد اختلف فيها المالكية والشافعية والحنابلة والحنفية {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13784-13785}؛ ومؤنة الإجارة على قسمين: رد العين المستأجرة، وما يحتاجه المستأجر أثناء المدة، فالمؤنة الثانية على المؤجر باتفاق، وتختلف المذاهب في شرط النفقة على المستأجر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13785-13788}؛ ومؤنة رد المغصوب على الغاصب، وإن نُقل المغصوب إلى بلد آخر فللمالكية والحنفية والشافعية والحنابلة تفصيل {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13788-13790}؛ ومؤنة الموقوف من غلته أو على شرط الواقف، والحنفية يبدؤون من غلة الوقف بعمارته، وإذا تعطلت منافعه فللشافعية تكون النفقة من بيت المال {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13790-13791}؛ ومؤنة العارية هل تكون على المستعير أو المعير، وكذلك مؤنة ردها، والخلاف فيهما مذكور {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13791-13792}."
  en: "Mu'na, in lexicon, is burden; in fiqh it is the cost a person bears, such as maintenance and similar expense. Jurists often use mu'na for nafaqa (support), and al-Sharqawi holds that mu'na is wider than nafaqa {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13783-13784}. Its rulings cover: the costs of crops and fruit in zakat, where the schools differ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13784-13785}; hire, where the cost of returning the hired thing is distinguished from the cost of keeping it during the term, the latter falling on the lessor by consensus while the schools differ on making food or fodder a condition on the hirer {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13785-13788}; the cost of returning usurped goods, which falls on the usurper, and the case where goods are carried to another town {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13788-13790}; the cost of waqf property, paid from its yield or as the founder stipulated, and from the treasury (bayt al-mal) when it has no yield according to the Shafi'is {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13790-13791}; and the cost of a loaned object, whether it falls on the borrower or the lender, and of its return {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13791-13792}."
  ur: "مؤنہ لغت میں بوجھ کو کہتے ہیں؛ فقہ میں یہ وہ خرچ ہے جو انسان پر پڑتا ہے، جیسے نان نفقہ وغیرہ۔ فقہاء اکثر نفقہ کی جگہ مؤنہ بولتے ہیں، اور شرقاوی کے نزدیک مؤنہ نفقہ سے زیادہ عام ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13783-13784}۔ اس کے احکام میں زکات میں کھیتی اور پھل کا خرچ، جس میں مذاہب مختلف ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13784-13785}؛ اجارہ میں چیز واپس کرنے کا خرچ اور مدت کے دوران رکھنے کا خرچ، جس میں مؤجر پر دوسری صورت کا خرچ بالاتفاق ہے، اور شرط کے بارے میں اختلاف ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13785-13788}؛ غصب شدہ چیز کی واپسی کا خرچ غاصب پر ہے، اور اگر چیز دوسرے شہر لے جائی گئی ہو تو مذاہب میں تفصیل ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13788-13790}؛ وقف کا خرچ اس کی آمدنی سے یا واقف کی شرط کے مطابق ہوتا ہے، اور شافعیہ کے نزدیک منافع معطل ہوں تو خرچ بیت المال سے ہوگا {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13790-13791}؛ اور عاریت کی مؤنہ اور اس کی واپسی کا خرچ مستعیر پر ہے یا معیر پر، اس میں اختلاف ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13791-13792}۔"
  es: "Mu'na, en léxico, es carga; en fiqh es el costo que una persona soporta, como el mantenimiento y gastos similares. Los juristas a menudo usan mu'na para nafaqa (sustento), y al-Sharqawi sostiene que mu'na es más amplio que nafaqa {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13783-13784}. Sus dictámenes cubren: los costos de las cosechas y frutas en zakat, donde las escuelas difieren {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13784-13785}; alquiler, donde el costo de devolver la cosa alquilada se distingue del costo de mantenerla durante el plazo, este último recayendo sobre el arrendador por consenso mientras que las escuelas difieren en hacer de la comida o el forraje una condición para el arrendatario {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13785-13788}; el costo de devolver bienes usurpados, que recae sobre el usurpador, y el caso en que los bienes se llevan a otra ciudad {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13788-13790}; el costo de la propiedad waqf, pagada de su rendimiento o como estipuló el fundador, y del tesoro (bayt al-mal) cuando no tiene rendimiento según los shafi'is {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13790-13791}; y el costo de un objeto prestado, ya sea que recaiga sobre el prestatario o el prestamista, y de su devolución {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13791-13792}."
  fr: "Mu'na, dans le lexique, signifie fardeau; en fiqh, il s'agit du coût supporté par une personne, comme l'entretien et les dépenses similaires. Les juristes utilisent souvent mu'na pour nafaqa (soutien), et al-Sharqawi soutient que mu'na a un sens plus large que nafaqa {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13783-13784}. Ses décisions couvrent: les coûts des récoltes et des fruits dans la zakat, domaine où les écoles divergent {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13784-13785}; La location, où le coût de restitution du bien loué est distingué du coût de sa garde pendant la durée du bail, ce dernier étant à la charge du bailleur par consensus, tandis que les écoles divergent sur la question de savoir si la fourniture de nourriture ou de fourrage est une condition imposée au locataire {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13785-13788}; le coût de restitution des biens usurpés, qui incombe à l’usurpateur, et le cas où les biens sont transportés dans une autre ville {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13788-13790}; le coût d’un bien waqf, payé sur son rendement ou selon les stipulations du fondateur, et sur le trésor (bayt al-mal) lorsqu’il ne produit aucun revenu selon les Shafi’ites {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13790-13791}. et le coût d'un objet prêté, qu'il incombe à l'emprunteur ou au prêteur, et de son retour {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13791-13792}."
  tr: "Dilbilimde 'al-mana' ağırlık anlamına gelirken, hukukçulara göre 'al-ma'unah' 'al-nifqa' (yük) anlamına gelir; yani bir kişinin masraflar ve benzeri durumlar açısından ne kadar katlandığını ifade eder. Hukukçular genellikle 'al-mana'ya 'al-nafqa' derler. Al-Sharqawi, 'mana'nın 'nafaqah'dan daha geniş olduğunu söylemiştir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13783-13784}. Hükümleri arasında: ekim ve zekatta meyve yükü vardır; bu konuda Malikiler, Şafiiler, Hanbaliler ve Hanafiler (cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13784-13785}; ve kiralama yükü iki türe ayrılır: kiralanan malın iadesi ve kiracının dönem boyunca ihtiyaç duyulan kısmı. İkinci yük ise anlaşma yoluyla kiracıya aittir. Okullar, kiracının nafaka koşulları {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13785-13788}; ve gasp edilenin gaspçıya iade yükü konusunda farklılık gösterir. Gasp edilen kişi başka bir ülkeye nakledilirse, Malikiler, Hanefiler, Şafiiler ve Hanbaliler ayrıntılı olarak belirtmiştir {atıf: fiqh-mawsua-kuwaitiyya-noor-v3 s.13788-13790}; vakıfın veriminden veya borç koşuluyla sürdürülmesi ve Hanafiler vakfın gelirlerinden onu inşa ederek başlarlar. Şafii'lere göre, faydaları kaybedilirse, bakım kamu hazinesinden gelir {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.13790-13791}; ve çıplak kadının geçiminin borçlu ya da borçlu olması ile geri dönüş maliyeti vardır. Bu konudaki anlaşmazlık {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.13791-13792}"
  id: "Dalam linguistik, 'al-mana' berarti berat, dan menurut ahli hukum, 'al-ma'unah' berarti 'al-nifqa' (beban), yang berarti apa yang ditanggung seseorang dalam bentuk pengeluaran dan sejenisnya. Seringkali, ahli hukum menyebut 'al-mana' sebagai 'al-nafqa'. Al-Sharqawi mengatakan bahwa 'mana' lebih luas daripada 'nafaqah' {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13783-13784}. Di antara keputusannya adalah: beban penanaman dan buah dalam zakat, yang telah dibedakan oleh Maliki, Shafi'i, Hanbali, dan Hanafi {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13784-13785}; dan beban sewa dibagi menjadi dua jenis: pengembalian barang sewa dan kebutuhan penyewa selama periode tersebut. Beban kedua ada pada penyewa, berdasarkan kesepakatan. Sekolah-sekolah berbeda mengenai syarat pemeliharaan penyewa {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13785-13788}; dan beban mengembalikan yang diambil alih kepada pengganti. Jika orang yang direbut alih dipindahkan ke negara lain, Maliki, Hanafi, Shafi'i, dan Hanbal telah merinci {cite: fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13788-13790}; pemeliharaan waqf dari hasil atau dengan syarat pemberi wakaf, dan Hanafi memulai dari hasil waqf dengan membangunnya. Jika manfaatnya hilang, menurut para syafi'i, pemeliharaan berasal dari kas negara {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13790-13791}; dan pemeliharaan wanita telanjang baik pada peminjam maupun peminjam, serta biaya pengembaliannya. Perbedaan pendapat mengenai hal ini disebutkan {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13791-13792}."
