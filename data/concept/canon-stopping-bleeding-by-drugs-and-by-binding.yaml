label: { ar: "حبس نزف الدم بالأدوية والشد عند ابن سينا", en: "Stopping bleeding by cooling, astringent, sealing and caustic drugs and by binding in the Canon", ur: "قانون میں ٹھنڈی، قابض، چپکانے والی اور جلانے والی دواؤں اور باندھ کر خون روکنا", es: "Detener el sangrado mediante fármacos refrescantes, astringentes, selladores y cáusticos, y mediante la unión en el Canon", fr: "Arrêter le saignement par des médicaments refroidissants, astringents, scellants et caustiques et par ligature dans le Canon" }
