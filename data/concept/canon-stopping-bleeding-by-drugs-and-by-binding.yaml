  en: "Ibn Sina closes chapter 23 by describing the cooling, astringent, sealing and caustic drugs and binding as ways of stopping an evacuation, and then fixes the treatment of bleeding by its cause {cite:canon-ibn-sina-print-v1 p.303}."
  es: "Ibn Sina cierra el capítulo 23 describiendo los medicamentos refrescantes, astringentes, selladores y cáusticos y los ligantes como formas de detener una evacuación, y luego fija el tratamiento del sangrado según su causa {cite:canon-ibn-sina-print-v1 p.303}."
  fr: "Ibn Sina conclut le chapitre 23 en décrivant les médicaments rafraîchissants, astringents, scellants et caustiques ainsi que la ligature comme moyens d'arrêter une évacuation, puis fixe le traitement du saignement en fonction de sa cause {cite:canon-ibn-sina-print-v1 p.303}."
