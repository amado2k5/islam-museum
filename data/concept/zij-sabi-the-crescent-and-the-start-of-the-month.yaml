id: concept/zij-sabi-the-crescent-and-the-start-of-the-month
class: concept
kind: scientific
label: { ar: "الهلال وأوائل الشهور في الزيج الصابي", en: "The crescent and the start of the months in the Zij al-Sabi", ur: "زیج صابی میں ہلال اور مہینوں کا آغاز", es: "La luna creciente y el comienzo de los meses en el Zij al-Sabi", fr: "Le croissant et le début des mois dans le Zij al-Sabi", tr: "Saba astronomik tablolarında hilal ve ayların başlangıcı", id: "Bulan sabit dan awal bulan dalam tabel astronomi Sabaean" }
summary:
  ar: "يبين البتاني أن معرفة رؤية الهلال في أوائل الشهور وأواخرها متممة لما تقدم، لأن التاريخ العربي وأوائل شهوره يجريان على رؤية الأهلة، ومع ذلك فيها صعوبة من جهات كثيرة: قرب القمر من الشمس وبُعده، وعرضه، والمنظر، وقصر مطالع البروج وطولها. {cite:zij-sabi-nallino-byblion p.129}."
  en: "Al-Battani says that knowing when the crescent can be seen at the start and end of months completes what came before, since the Arab calendar and the starts of its months follow the sighting of the new moon. Yet it is hard from many sides: the Moon's nearness to and distance from the Sun, its latitude, the parallax, and the short or long rising times of the signs. {cite:zij-sabi-nallino-byblion p.129}."
  ur: "البتانی کہتے ہیں کہ مہینوں کے آغاز اور اختتام پر ہلال کی رؤیت جاننا پہلے بیان کی گئی معرفت کی تکمیل ہے، کیونکہ عربی تاریخ اور اس کے مہینوں کے آغاز ہلال کی رؤیت پر چلتے ہیں؛ پھر بھی اس میں کئی پہلوؤں سے دشواری ہے: چاند کا سورج سے قرب و بعد، اس کا عرض، منظر، اور بروج کے مطالع کا کم یا زیادہ ہونا۔ {cite:zij-sabi-nallino-byblion p.129}۔"
  es: "Al-Battani afirma que saber cuándo se puede ver la luna creciente al principio y al final de cada mes completa lo anterior, ya que el calendario árabe y el inicio de sus meses se basan en la observación de la luna nueva. Sin embargo, resulta difícil por muchos motivos: la proximidad y la distancia de la Luna al Sol, su latitud, la paralaje y la duración de la salida de los signos. {cite:zij-sabi-nallino-byblion p.129}."
  fr: "Al-Battani affirme que la connaissance des dates d'apparition du croissant lunaire au début et à la fin des mois complète ce qui a été dit précédemment, puisque le calendrier arabe et le début de ses mois sont basés sur l'observation du nouveau croissant. Cependant, cette tâche est complexe à bien des égards: la proximité et l'éloignement de la Lune par rapport au Soleil, sa latitude, la parallaxe et la durée d'apparition des signes astrologiques (plus ou moins longue). {cite:zij-sabi-nallino-byblion p.129}"
  tr: "Al-Battani, ayların başında ve sonunda hilalin görülmesinin bilinmesinin, daha önce bahsedilenleri tamamladığını, çünkü Arap takviminin ve ayların başlangıçlarının hilalin görülmesine dayandığını açıklıyor. Ancak bu, birçok açıdan zordur: Ayın güneşe yakınlığı, enlemi, konumu ve zodyakın yükselen noktalarının kısalığı ve uzunluğu. {cite:zij-sabi-nallino-byblion s.129}."
  id: "Al-Battani menjelaskan bahwa mengetahui penampakan bulan sabit di awal dan akhir bulan melengkapi apa yang telah disebutkan sebelumnya, karena kalender Arab dan awal bulannya didasarkan pada penampakan bulan sabit. Namun, hal ini sulit dalam banyak hal: kedekatan bulan dengan matahari, garis lintangnya, posisinya, serta pendek dan panjang titik terbit zodiak. {cite:zij-sabi-nallino-byblion p.129}."
