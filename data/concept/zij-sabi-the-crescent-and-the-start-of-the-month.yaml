label: { ar: "الهلال وأوائل الشهور في الزيج الصابي", en: "The crescent and the start of the months in the Zij al-Sabi", ur: "زیج صابی میں ہلال اور مہینوں کا آغاز" }
summary:
  ar: "يبين البتاني أن معرفة رؤية الهلال في أوائل الشهور وأواخرها متممة لما تقدم، لأن التاريخ العربي وأوائل شهوره يجريان على رؤية الأهلة، ومع ذلك فيها صعوبة من جهات كثيرة: قرب القمر من الشمس وبُعده، وعرضه، والمنظر، وقصر مطالع البروج وطولها. {cite:zij-sabi-nallino-byblion p.129}."
  en: "Al-Battani says that knowing when the crescent can be seen at the start and end of months completes what came before, since the Arab calendar and the starts of its months follow the sighting of the new moon. Yet it is hard from many sides: the Moon's nearness to and distance from the Sun, its latitude, the parallax, and the short or long rising times of the signs. {cite:zij-sabi-nallino-byblion p.129}."
  ur: "البتانی کہتے ہیں کہ مہینوں کے آغاز اور اختتام پر ہلال کی رؤیت جاننا پہلے بیان کی گئی معرفت کی تکمیل ہے، کیونکہ عربی تاریخ اور اس کے مہینوں کے آغاز ہلال کی رؤیت پر چلتے ہیں؛ پھر بھی اس میں کئی پہلوؤں سے دشواری ہے: چاند کا سورج سے قرب و بعد، اس کا عرض، منظر، اور بروج کے مطالع کا کم یا زیادہ ہونا۔ {cite:zij-sabi-nallino-byblion p.129}۔"
