label:
  ar: "العصبية"
  en: "Asabiyya (group solidarity)"
  fr: "Asabiyya (solidarité de groupe)"
  es: "Asabiyya (solidaridad grupal)"
  ur: "اصابیہ ⁦(گروہ یکجہتی)⁩"
  tr: "Gerginlik"
  id: "Kegugupan"
summary:
  ar: "مفتاح علم ابن خلدون في العمران: سكنى البدو لا تكون إلا للقبائل أهل العصبية لأن حالل الحي إنما يذود عنها أنجادهم وفتيانهم ولا يصدق دفاعهم إلا إذا كانوا عصبية وأهل نسب واحد، وهي من الالتحام بالنسب أو ما في معناه من الولاء والحلف، إذ صلة الرحم طبيعي في البشر ومن صلتها النعرة على ذوي القربى أن ينالهم ضيم أو تصيبهم هتكة، فإذا كان النسب المتواصل قريباً جداً كانت الوصلة ظاهرة فاستدعت المناصرة بمجردها، وإذا بعد تنوّس بعضها وبقيت منها شهرة، والنسب عنده أمر وهمي لا حقيقة له ونفعه إنما هو في هذه الوصلة والالتحام، وبه فهم معنى قوله تعلموا من أنسابكم ما تصلون به أرحامكم وقولهم النسب علمٌ لا ينفع وجهالة لا تضر، وقد جعل الاعتماد على ذلك في القرآن قول إخوة يوسف لئن أكله الذئب ونحن عصبة إنا إذاً لخاسرون، وبها يتبين وجوبها في كل أمر يحمل الناس عليه من نبوة أو إقامة ملك أو دعوة {cite:muqaddima-ibn-khaldun p. 122-123}. وغاية العصبية التي تجري إليها الملك لأنها داعية إلى التغلب والملك تعبير عن التغلب، ومن عوائق الملك حصول الترف وانغماس القبيل في النعيم فيفضي بهم إلى الأسر ويذهب حماسهم، وحصول المذلة للقبيل وانقيادهم إلى سواهم فإذا تعاورتهم الأيدي وانحرفت السياسة انقرض عمرانهم، والأمة الوحشية أقدر على التغلب ممن سواها {cite:muqaddima-ibn-khaldun p. 134-137}"
  en: "Ibn Khaldun's master key: kin-solidarity born of نعرة on near kin — genealogy itself is imaginary, its use is the bond {cite:muqaddima-ibn-khaldun p. 122-123}."
  fr: "La clé maîtresse d’Ibn Khaldun : la solidarité de parenté née de la نعرة envers les proches — la généalogie elle-même est imaginaire, son utilité réside dans le lien {cite:muqaddima-ibn-khaldun p. 122-123}."
  es: "La clave maestra de Ibn Khaldun: la solidaridad de parentesco nacida de نعرة sobre los parientes cercanos; la genealogía misma es imaginaria, su uso es el vínculo {cite:muqaddima-ibn-khaldun p. 122-123}."
  ur: "ابن خلدون کی بنیادی کلید: قرابت دار یکجہتی سے پیدا ہوا نعرة قریبی رشتہ داروں پر - نسب نامہ بذات خود خیالی ہے، اس کا استعمال بانڈ ہے {حوالہ: مقدّمہ ابن خلدون ص۔ 122-123}۔"
  tr: "İbn Haldun'un kentsel gelişim bilgisinin anahtarı: Bedevi yerleşimi sadece kabile bağlantılı kabileler içindir, çünkü mahalledeki sakinler sadece çocuklarını ve gençlerini savunur ve savunmaları ancak aynı kabile ve soydan geliyorlarsa geçerlidir. Bu, soyuna veya sadakat ve ittifakın ne anlama geldiğine dair bir bağ biçimidir. Aile bağlarını sürdürmek insanlarda doğaldır ve bağları arasında, haksızlık veya zarar görebilecekleri yönünde akrabalara karşı anlaşmazlık vardır. Sürekli soy çok yakınsa, bağlantı belirgindir ve bu da bütünüyle destek gerektirir. Ve eğer uzaksa, Bazıları ünlü oldu, ancak onun için soy gerçek olmayan bir yanıltıcıdır ve faydası sadece bu bağlantı ve bağdadır. Böylece 'Soy ağacınızdan akrabalığınızı ne bağladığınızı öğrenin' deyiminin anlamını anlarlar ve 'soy' cehalete fayda sağlamayan ya da zarar vermeyen bilgidir. Bunu, Kur'an'a dayanarak Yusuf'un kardeşlerinin sözüne dayanarak yaptı: 'Bir kurt onu yerse ve biz bir grupsak, kesinlikle kaybederiz.' Böylece, insanları yönlendiren her konuda — peygamberlik, krallık kurma veya Allah'a çağrı — netleştirilir. {atıf:mukaddima-ibn-khaldun, s. 122-123}. Krallığa götüren nihai kabilecilik, üstesinden gelmeyi gerektirir ve krallık da yenmenin bir ifadesidir. Krallığın önündeki engeller arasında lükse ulaşmak ve kabilenin mutluluğa dalması, bu da onları esarete sürükler ve coşkularını azaltır; ayrıca kabile aşağılanması ve başkalarına boyun eğmesi, böylece el çapraz ve siyaset saptığında medeniyetleri yok olur. Zalim ulus diğerlerinden daha fazla üstesinden gelebilir {atıf:muqaddima-ibn-khaldun s. 134-137}"
  id: "Kunci pengetahuan Ibn Khaldun tentang pembangunan kota: Tempat tinggal Badui hanya untuk suku yang memiliki afiliasi suku, karena penduduk lingkungan hanya membela anak-anak dan remaja mereka, dan pembelaan mereka hanya berlaku jika mereka berasal dari suku dan garis keturunan yang sama. Ini adalah bentuk ikatan dengan garis keturunan atau apa artinya dari kesetiaan dan aliansi. Menjaga ikatan keluarga adalah hal yang alami pada manusia, dan di antara ikatannya terdapat perselisihan terhadap kerabat yang mungkin mengalami ketidakadilan atau bahaya. Jika garis keturunan yang berkelanjutan sangat dekat, hubungan itu jelas, sehingga membutuhkan dukungan secara menyeluruh. Dan jika jaraknya jauh, Beberapa dari mereka menjadi terkenal, tetapi baginya, garis keturunan adalah hal yang ilusi tanpa kenyataan, dan manfaatnya hanya terletak pada hubungan dan ikatan ini. Melalui ini, mereka memahami makna perkataan-Nya, 'Belajarlah dari silsilah apa yang kamu hubungkan kekerabatanmu,' dan pepatah mereka 'garis keturunan' adalah pengetahuan yang tidak menguntungkan atau merugikan ketidaktahuan. Dia mendasarkan ini pada Al-Qur'an sebagai perkataan saudara-saudara Yusuf: 'Jika serigala memakannya dan kita adalah kelompok, maka kita pasti akan kalah.' Melalui ini, kewajibannya diperjelas dalam setiap hal yang membawa manusia, baik menjadi nabi, mendirikan kerajaan, atau memanggil Tuhan. {cite:muqaddima-ibn-khaldun, hlm. 122-123}. Suku-suku tertinggi yang mengarah pada kekuasaan adalah karena ia menuntut kemenangan, dan kekuasaan adalah ekspresi dari kemenangan. Di antara hambatan bagi kekuasaan adalah pencapaian kemewahan dan tenggelam suku dalam kebahagiaan, yang membawa mereka ke dalam pertahanan dan mengurangi antusiasme mereka, serta penghinaan dan penyerahan suku kepada orang lain, sehingga ketika tangan bersilangan dan politik menyimpang, peradaban mereka punah. Bangsa yang brutal lebih mampu mengatasi daripada yang lain {cite:muqaddima-ibn-khaldun hlm. 134-137}"
