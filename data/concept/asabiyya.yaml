label: { ar: "العصبية", en: "Asabiyya (group solidarity)" }
summary:
  ar: "مفتاح علم ابن خلدون في العمران: سكنى البدو لا تكون إلا للقبائل أهل العصبية لأن حالل الحي إنما يذود عنها أنجادهم وفتيانهم ولا يصدق دفاعهم إلا إذا كانوا عصبية وأهل نسب واحد، وهي من الالتحام بالنسب أو ما في معناه من الولاء والحلف، إذ صلة الرحم طبيعي في البشر ومن صلتها النعرة على ذوي القربى أن ينالهم ضيم أو تصيبهم هتكة، فإذا كان النسب المتواصل قريباً جداً كانت الوصلة ظاهرة فاستدعت المناصرة بمجردها، وإذا بعد تنوّس بعضها وبقيت منها شهرة، والنسب عنده أمر وهمي لا حقيقة له ونفعه إنما هو في هذه الوصلة والالتحام، وبه فهم معنى قوله تعلموا من أنسابكم ما تصلون به أرحامكم وقولهم النسب علمٌ لا ينفع وجهالة لا تضر، وقد جعل الاعتماد على ذلك في القرآن قول إخوة يوسف لئن أكله الذئب ونحن عصبة إنا إذاً لخاسرون، وبها يتبين وجوبها في كل أمر يحمل الناس عليه من نبوة أو إقامة ملك أو دعوة {cite:muqaddima-ibn-khaldun p. 122-123}. وغاية العصبية التي تجري إليها الملك لأنها داعية إلى التغلب والملك تعبير عن التغلب، ومن عوائق الملك حصول الترف وانغماس القبيل في النعيم فيفضي بهم إلى الأسر ويذهب حماسهم، وحصول المذلة للقبيل وانقيادهم إلى سواهم فإذا تعاورتهم الأيدي وانحرفت السياسة انقرض عمرانهم، والأمة الوحشية أقدر على التغلب ممن سواها {cite:muqaddima-ibn-khaldun p. 134-137}"
  en: "Ibn Khaldun's master key: kin-solidarity born of نعرة on near kin — genealogy itself is imaginary, its use is the bond {cite:muqaddima-ibn-khaldun p. 122-123}."
