id: concept/shuab-al-iman
class: concept
kind: doctrine
label:
  ar: "شُعَب الإيمان"
  en: "The branches of faith (shu'ab al-iman)"
  ur: "شعبِ ایمان"
summary:
  ar: "شعب الإيمان هي الخصال التي يعدّها الحديث من الإيمان: «الإيمان بضع وسبعون أو بضع وستون شعبة، فأفضلها قول لا إله إلا الله، وأدناها إماطة الأذى عن الطريق، والحياء شعبة من الإيمان» {cite:sahih-muslim 0035}، ولفظ البخاري «بضع وستون شعبة» {cite:sahih-al-bukhari 9}. يقول النووي إن الشعبة القطعة من الشيء، وإن معنى الحديث بضع وسبعون خصلة {cite:sharh-sahih-muslim-al-nawawi p.116}. وصنّف في تعيينها أبو عبد الله الحليمي والبيهقي وأبو حاتم بن حبان {cite:sharh-sahih-muslim-al-nawawi p.117}، وعدّها العيني في عمدة القاري سبعا وسبعين شعبة في ثلاثة أقسام: ثلاثون في الاعتقاد، وسبع في أعمال اللسان، وأربعون في أعمال البدن {cite:umdat-qari-ilmiyya-2001-v1 p.212} {cite:umdat-qari-ilmiyya-2001-v1 p.213}."
  en: "The branches of faith are the traits the hadith counts as part of faith: 'Faith is seventy-odd or sixty-odd branches; the best of them is saying there is no god but God, the least of them is removing harm from the road, and modesty is a branch of faith' {cite:sahih-muslim 0035}; al-Bukhari's wording is 'sixty-odd branches' {cite:sahih-al-bukhari 9}. Al-Nawawi says a shu'ba is a piece of a thing, so the hadith means seventy-odd traits {cite:sharh-sahih-muslim-al-nawawi p.116}. Abu 'Abd Allah al-Halimi, al-Bayhaqi and Abu Hatim ibn Hibban wrote books to identify them {cite:sharh-sahih-muslim-al-nawawi p.117}, and al-'Ayni, in 'Umdat al-Qari, counts seventy-seven in three groups: thirty of belief, seven of the tongue and forty of the body {cite:umdat-qari-ilmiyya-2001-v1 p.212} {cite:umdat-qari-ilmiyya-2001-v1 p.213}."
  ur: "شعبِ ایمان وہ خصلتیں ہیں جنھیں حدیث ایمان میں سے گنتی ہے: «ایمان کی ستر سے کچھ اوپر یا ساٹھ سے کچھ اوپر شاخیں ہیں؛ ان میں سب سے افضل لا الٰہ الا اللہ کہنا ہے، سب سے ادنیٰ راستے سے تکلیف دہ چیز ہٹانا، اور حیا ایمان کی ایک شاخ ہے» {cite:sahih-muslim 0035}، اور بخاری کے الفاظ «ساٹھ سے کچھ اوپر شاخیں» ہیں {cite:sahih-al-bukhari 9}۔ نووی کہتے ہیں کہ شعبہ کسی چیز کا ٹکڑا ہے، تو حدیث کا مطلب ستر سے کچھ اوپر خصلتیں ہے {cite:sharh-sahih-muslim-al-nawawi p.116}۔ ان کی تعیین میں ابو عبد اللہ حلیمی، بیہقی اور ابو حاتم ابن حبان نے کتابیں لکھیں {cite:sharh-sahih-muslim-al-nawawi p.117}، اور عینی نے عمدۃ القاری میں ستتر شاخیں تین قسموں میں گنیں: تیس اعتقاد کی، سات زبان کے اعمال کی اور چالیس بدن کے اعمال کی {cite:umdat-qari-ilmiyya-2001-v1 p.212} {cite:umdat-qari-ilmiyya-2001-v1 p.213}۔"
