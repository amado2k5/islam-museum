label: { ar: "الانعقاد", en: "Inqad (the forming and binding of an act, contract or office)" }
summary:
  ar: "الانعقاد لغة ضد الانحلال، ومعانيه الوجوب والارتباط والتأكد. وعند الفقهاء يختلف باختلاف الموضوع، فانعقاد العبادة ابتداؤها صحيحة، وانعقاد العقد ارتباط الإيجاب بالقبول على الوجه المعتبر شرعا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3510} والانعقاد يفارق الصحة، فالصحة لا تحصل إلا بتمام الأركان والشروط، أما الانعقاد فقد يحصل وإن لم تتم الشروط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3510} وينعقد العقد بالقول أو بالفعل كالمعاطاة عند أغلب الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3510} والباطل غير منعقد اتفاقا، وفي انعقاد الفاسد من المعاملات خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3511} وتنعقد الإمامة باختيار أهل الحل والعقد أو بعهد من الإمام مع مبايعتهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3511}"
  en: "Inqad is lexically the opposite of dissolution, and carries the senses of obligation, binding and confirmation. For the jurists it varies with the subject: the forming of a worship is its valid beginning, and the forming of a contract is the binding of offer to acceptance in the manner the law requires. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3510} It differs from validity, which is reached only when all pillars and conditions are complete, whereas forming may occur before the conditions are complete. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3510} A contract may be formed by words or by act, as the mu'atah is by most jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3510} What is void is by agreement not formed; the forming of invalid transactions is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3511} The imamate is formed by the choice of those who loose and bind, or by the appointment of the previous holder with their allegiance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3511}"
