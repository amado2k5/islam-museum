label: { ar: "الانعقاد", en: "Inqad (the forming and binding of an act, contract or office)", es: "Inqad (la formación y vinculación de un acto, contrato o cargo)", fr: "Inqad (la formation et la liaison d'un acte, d'un contrat ou d'une fonction)", ur: "انقد ⁦(کسی ایکٹ، معاہدہ یا دفتر کی تشکیل اور پابند)⁩", tr: "Oturum", id: "Sesi" }
summary:
  ar: "الانعقاد لغة ضد الانحلال، ومعانيه الوجوب والارتباط والتأكد. وعند الفقهاء يختلف باختلاف الموضوع، فانعقاد العبادة ابتداؤها صحيحة، وانعقاد العقد ارتباط الإيجاب بالقبول على الوجه المعتبر شرعا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3510} والانعقاد يفارق الصحة، فالصحة لا تحصل إلا بتمام الأركان والشروط، أما الانعقاد فقد يحصل وإن لم تتم الشروط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3510} وينعقد العقد بالقول أو بالفعل كالمعاطاة عند أغلب الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3510} والباطل غير منعقد اتفاقا، وفي انعقاد الفاسد من المعاملات خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3511} وتنعقد الإمامة باختيار أهل الحل والعقد أو بعهد من الإمام مع مبايعتهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3511}"
  en: "Inqad is lexically the opposite of dissolution, and carries the senses of obligation, binding and confirmation. For the jurists it varies with the subject: the forming of a worship is its valid beginning, and the forming of a contract is the binding of offer to acceptance in the manner the law requires. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3510} It differs from validity, which is reached only when all pillars and conditions are complete, whereas forming may occur before the conditions are complete. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3510} A contract may be formed by words or by act, as the mu'atah is by most jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3510} What is void is by agreement not formed; the forming of invalid transactions is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3511} The imamate is formed by the choice of those who loose and bind, or by the appointment of the previous holder with their allegiance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3511}"
  es: "Inqad es léxicamente opuesto a disolución, y conlleva los sentidos de obligación, vinculación y confirmación. Para los juristas varía según el sujeto: la formación de un culto es su inicio válido, y la formación de un contrato es la vinculación de la oferta a la aceptación de la manera que exige la ley. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3510} Se diferencia de la validez, que se alcanza solo cuando se cumplen todos los pilares y condiciones, mientras que la formación puede ocurrir antes de que se cumplan las condiciones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3510} Un contrato puede formarse mediante palabras o mediante actos, como lo hace la mu'atah para la mayoría de los juristas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3510} Lo que es nulo es aquel que no se forma por acuerdo; la formación de transacciones inválidas es objeto de disputa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3511} El imamato se forma por la elección de quienes atan y desatan, o por el nombramiento del titular anterior con su lealtad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3511}"
  fr: "Inqad est lexicalement l'antonyme de dissolution et possède les sens d'obligation, de lien et de confirmation. Pour les juristes, sa signification varie selon le sujet: la formation d'un culte en constitue le commencement valide, et la formation d'un contrat correspond à l'engagement de l'offre à l'acceptation selon les modalités prévues par la loi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3510} Elle diffère de la validité, qui n'est acquise que lorsque tous les piliers et conditions sont réunis, tandis que la formation peut intervenir avant que ces conditions ne soient remplies. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3510} Un contrat peut être formé par des paroles ou par un acte, comme le considère la mu'atah par la plupart des juristes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3510} Nul n'est un accord non formé; la validité des transactions est contestée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3511} L'imamat est formé soit par le choix de ceux qui lient et délie, soit par la désignation du titulaire précédent et de son allégeance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3511}"
  ur: "انقد لغوی طور پر تحلیل کا مخالف ہے، اور اس میں فرض، پابند اور تصدیق کے حواس ہوتے ہیں۔ فقہاء کے نزدیک یہ موضوع کے لحاظ سے مختلف ہوتا ہے: عبادت کی تشکیل اس کا صحیح آغاز ہے، اور معاہدے کی تشکیل اس طرح کی پیشکش کی قبولیت کا پابند ہے جس طرح قانون کا تقاضا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3510} یہ اعتبار سے مختلف ہے، جو صرف اس وقت پہنچتا ہے جب تمام ستون اور شرائط مکمل ہوں، جب کہ شرائط کے مکمل ہونے سے پہلے تشکیل ہو سکتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3510} ایک معاہدہ الفاظ یا عمل سے بن سکتا ہے، جیسا کہ اکثر فقہا کے نزدیک معاہدہ ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3510} جو چیز باطل ہے وہ معاہدے سے نہیں بنتی۔ غلط لین دین کی تشکیل متنازعہ ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 3511} امامت ان لوگوں کے انتخاب سے بنتی ہے جو ڈھیلے اور بندھے ہوئے ہوں، یا ان کی بیعت کے ساتھ پچھلے حاملین کی تقرری سے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 3511}"
  tr: "Sözleşme, dilsel olarak çözülmenin tam tersidir ve anlamları zorunluluk, bağlantı ve kesinliktir. Hukukçulara göre, konuya göre farklılık gösterir; ibadet eyleminin kuruluşu başlangıcında geçerlidir, sözleşme ise İslam hukukuna göre teklifin kabulüne bağlayıcıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3510} Sözleşme geçersizdir; geçerlilik ancak sütunlar ve koşullar yerine getirilerek sağlanır, oysa şartlar yerine getirilmese bile sözleşme gerçekleşebilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3510} Bir sözleşme, çoğu hukukçuya göre karşılıklı verme gibi söz veya eylemle yapılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3510} Yalan anlaşmayla sonuçlanmaz ve yozlaşmış bir işlemin sözleşmesi hakkında anlaşmazlık vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3511} İmamatlık, mücaizlik ve sözleşme yapan kişilerin seçilmesiyle veya İmam'dan yapılan bir antlaşmayla kurulur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3511}"
  id: "Secara linguistik, kontrak adalah kebalikan dari pembubaran, dan maknanya adalah kewajiban, keterhubungan, dan kepastian. Menurut para ahli hukum, kontrak berbeda tergantung pada subjek; penetapan tindakan ibadah berlaku sejak awal, sedangkan kontrak adalah pengikatan tawaran penerimaan sesuai dengan hukum Islam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3510} Kontrak tidak sah; keabsahan hanya dicapai dengan memenuhi pilar dan syarat, sedangkan kontrak dapat terjadi meskipun syarat-syarat tersebut tidak terpenuhi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3510} Kontrak dibuat dengan kata atau perbuatan, seperti saling memberi menurut sebagian besar ahli hukum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3510} Kebohongan tidak disepakati dengan persetujuan, dan ada perselisihan mengenai kontrak transaksi yang korup. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3511} Imamate didirikan dengan memilih orang-orang yang diperbolehkan dan berkontrak atau melalui perjanjian dari Imam dengan sumpah mereka. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3511}"
