id: concept/fasad-al-takhayyul
class: concept
kind: scientific
label:
  fr: "Altération de l’imagination dans le Canon"
  ar: "فساد التخيل"
  en: "Corruption of imagination (fasad al-takhayyul)"
  ur: "تخیل کا بگاڑ ⁦(فساد التخيل)⁩"
summary:
  fr: "Le Canon reprend causes et signes des autres chapitres, mais situe ce trouble à l'avant du cerveau. L'altération consiste à imaginer et voir l'inexistant, par prédominance bilieuse ou mauvais tempérament chaud sans matière {cite:canon-ibn-sina-print-v2 p.100} ; ou en une faiblesse empêchant d'imaginer, avec rares visions et rêves vite oubliés, ainsi que les formes des objets perçus {cite:canon-ibn-sina-print-v2 p.100} {cite:canon-ibn-sina-print-v2 p.101}."
  ar: "يذكر ابن سينا أن فساد التخيل من الأسباب والعلامات نفسها لكنه في مقدم الدماغ، وأنه إما تخيل ما لا وجود له لغلبة مرار أو حر، وإما نقص التخيل، ويفرّقه عن فساد الذكر؛ ويجعل علاجه بحسب أسبابه {cite:canon-ibn-sina-print-v2 p.100} {cite:canon-ibn-sina-print-v2 p.101}"
  en: "Ibn Sina says corruption of imagination has the same causes and signs but is in the front of the brain, either imagining what does not exist, from the prevailing of bile or of heat, or a deficiency of imagination, and sets it apart from corruption of memory; its treatment follows its causes {cite:canon-ibn-sina-print-v2 p.100} {cite:canon-ibn-sina-print-v2 p.101}"
  ur: "ابن سینا کہتا ہے کہ تخیل کے بگاڑ کے سبب اور علامات وہی ہیں مگر وہ دماغ کے اگلے حصے میں ہے، یا تو اس چیز کا تخیل جس کا وجود نہیں، صفراء یا گرمی کے غلبے سے، یا تخیل کی کمی، اور اسے یاد کے بگاڑ سے الگ کرتا ہے؛ اس کا علاج اس کے اسباب کے مطابق ہے {cite:canon-ibn-sina-print-v2 p.100} {cite:canon-ibn-sina-print-v2 p.101}۔"
