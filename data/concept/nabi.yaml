label: { ar: "النَّبِيّ", en: "The prophet (nabi)", ur: "نبی (پیغمبر)" }
summary:
  ar: "النبي في اللغة من الإنباء أي الإخبار، وفي الاصطلاح من نزل عليه الوحي من الله على لسان ملك، وكان مؤيداً بالكرامات الخارقة للعادات. وليس كل من أوحي إليه نبياً. والرسول أخص من النبي. ذكر القرآن أسماء ثمانية عشر ومن بعدهم سبعة من الأنبياء، وأولو العزم من الرسل جماعة في تحديدهم اختلاف، ومحمد آخرهم بالإجماع. واختلف العلماء في نبوة الخضر ولقمان وذي الكفل وعزير، ولا يكفر من شك فيمن لم يجمع على نبوته. ومن الأحكام الخاصة بالأنبياء تحريم الصدقة عليهم، وأن أموالهم لا تورث، ودفنهم حيث يقبضون. ويجب الإيمان بهم إجمالاً وتفصيلاً، وطاعتهم، وتوقيرهم، والصلاة والسلام عليهم، ومحبتهم، والتفريق بينهم كفر. وفي التفضيل بينهم قولان، والأنبياء أفضل من سائر البشر وغير الملائكة عند أهل السنة، والنبي محمد أفضلهم. ولا بأس بالتسمي بأسماء الأنبياء، وتحرم تصويرهم، ولا يحل الكذب عليه. وتوقيره وتعظيمه واجب، ويجب الدعاء له عند الإقامة ويعظم أصحابه، ومن تنقصه أو آذاه فجزاؤه في باب الردة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15462} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15463} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15464} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15469} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15472} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15475} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15481} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15483}"
  en: "In the lexicon, nabi comes from information (inba'); in law, a nabi is one to whom revelation comes through an angel, who is supported by miracles that break habit. Not everyone to whom something is revealed is a prophet. The rasul is narrower than the nabi. The Qur'an names eighteen prophets and seven more; the lists of the steadfast messengers (ulu al-'azm) differ, and Muhammad is the last of the prophets by agreement. Scholars differ on whether Khidr, Luqman, Dhu al-Kifl and Uzayr were prophets, and one who doubts the prophethood of a figure not agreed upon is not an unbeliever. Special rules for prophets include that alms are forbidden to them, that their property is not inherited, and that each is buried where he dies. Believers must affirm them in general and in particular, obey and honour them, love them, invoke blessings on them, and must not separate between them. Prophets are above other people and above the angels in the view of the Sunnis, and Muhammad is the best. It is permissible to name children after prophets. Images of them are forbidden, lying about him is forbidden, and reverence for him and his companions is required. Those who insult him are dealt with under apostasy.  {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15462} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15463} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15464} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15469} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15472} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15475} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15481} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15483}"
  ur: "نبی وہ ہے جس پر اللہ کی طرف سے فرشتے کے ذریعے وحی آئے اور جس کی تائید خارق عادت کرامات سے ہو۔ رسول نبی سے خاص ہے۔ اہل سنت کے نزدیک انبیاء تمام انسانوں اور غیر ملائکہ سے افضل ہیں، اور نبی کریم سب سے افضل ہیں۔ انبیاء کی تصویر حرام ہے، اور ان پر جھوٹ باندھنا حرام ہے۔ ان کی توقیر واجب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15462}"
