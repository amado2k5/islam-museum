summary:
  ar: "النبي في اللغة من الإنباء أي الإخبار، وفي الاصطلاح من نزل عليه الوحي من الله على لسان ملك، وكان مؤيداً بالكرامات الخارقة للعادات. وليس كل من أوحي إليه نبياً. والرسول أخص من النبي. ذكر القرآن أسماء ثمانية عشر ومن بعدهم سبعة من الأنبياء، وأولو العزم من الرسل جماعة في تحديدهم اختلاف، ومحمد آخرهم بالإجماع. واختلف العلماء في نبوة الخضر ولقمان وذي الكفل وعزير، ولا يكفر من شك فيمن لم يجمع على نبوته. ومن الأحكام الخاصة بالأنبياء تحريم الصدقة عليهم، وأن أموالهم لا تورث، ودفنهم حيث يقبضون. ويجب الإيمان بهم إجمالاً وتفصيلاً، وطاعتهم، وتوقيرهم، والصلاة والسلام عليهم، ومحبتهم، والتفريق بينهم كفر. وفي التفضيل بينهم قولان، والأنبياء أفضل من سائر البشر وغير الملائكة عند أهل السنة، والنبي محمد أفضلهم. ولا بأس بالتسمي بأسماء الأنبياء، وتحرم تصويرهم، ولا يحل الكذب عليه. وتوقيره وتعظيمه واجب، ويجب الدعاء له عند الإقامة ويعظم أصحابه، ومن تنقصه أو آذاه فجزاؤه في باب الردة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15462} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15463} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15464} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15469} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15472} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15475} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15481} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15483}"
  en: "In the lexicon, nabi comes from information (inba'); in law, a nabi is one to whom revelation comes through an angel, who is supported by miracles that break habit. Not everyone to whom something is revealed is a prophet. The rasul is narrower than the nabi. The Qur'an names eighteen prophets and seven more; the lists of the steadfast messengers (ulu al-'azm) differ, and Muhammad is the last of the prophets by agreement. Scholars differ on whether Khidr, Luqman, Dhu al-Kifl and Uzayr were prophets, and one who doubts the prophethood of a figure not agreed upon is not an unbeliever. Special rules for prophets include that alms are forbidden to them, that their property is not inherited, and that each is buried where he dies. Believers must affirm them in general and in particular, obey and honour them, love them, invoke blessings on them, and must not separate between them. Prophets are above other people and above the angels in the view of the Sunnis, and Muhammad is the best. It is permissible to name children after prophets. Images of them are forbidden, lying about him is forbidden, and reverence for him and his companions is required. Those who insult him are dealt with under apostasy.  {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15462} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15463} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15464} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15469} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15472} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15475} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15481} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15483}"
  ur: "نبی وہ ہے جس پر اللہ کی طرف سے فرشتے کے ذریعے وحی آئے اور جس کی تائید خارق عادت کرامات سے ہو۔ رسول نبی سے خاص ہے۔ اہل سنت کے نزدیک انبیاء تمام انسانوں اور غیر ملائکہ سے افضل ہیں، اور نبی کریم سب سے افضل ہیں۔ انبیاء کی تصویر حرام ہے، اور ان پر جھوٹ باندھنا حرام ہے۔ ان کی توقیر واجب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15462}"
  es: "En el léxico, nabi proviene de información (inba'); en derecho, un nabi es aquel a quien le llega la revelación a través de un ángel, quien es respaldado por milagros que rompen con la costumbre. No todo aquel a quien se le revela algo es profeta. El rasul es más específico que el nabi. El Corán nombra dieciocho profetas y siete más; las listas de los mensajeros firmes (ulu al-'azm) difieren, y Muhammad es el último de los profetas por consenso. Los eruditos difieren sobre si Khidr, Luqman, Dhu al-Kifl y Uzayr fueron profetas, y quien duda de la profecía de una figura no consensuada no es un incrédulo. Las reglas especiales para los profetas incluyen que les está prohibido dar limosna, que sus bienes no se heredan y que cada uno es enterrado donde muere. Los creyentes deben afirmarlos en general y en particular, obedecerlos y honrarlos, amarlos, invocar bendiciones sobre ellos y no deben hacer distinción entre ellos. Para los sunitas, los profetas están por encima de los demás hombres y de los ángeles, y Mahoma es el mejor. Es lícito ponerles a los hijos nombres de profetas. Se prohíben las imágenes de ellos, mentir sobre él está prohibido y se exige reverencia hacia él y sus compañeros. Quienes lo insultan son juzgados por apostasía. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15462} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15463} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15464} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15466} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15469} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15472} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15475} {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.15481} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15483}"
  fr: "Dans le lexique, le terme « nabi » vient de « information » (inba'). En droit, un nabi est celui à qui une révélation parvient par l'intermédiaire d'un ange, et dont la mission est confirmée par des miracles qui bouleversent les habitudes. Toute personne à qui une révélation est faite n'est pas pour autant un prophète. Le terme « rasul » a une portée plus restreinte que celui de « nabi ». Le Coran nomme dix-huit prophètes et sept autres; les listes des messagers constants (ulu al-'azm) divergent, et Muhammad est, de l'avis unanime, le dernier des prophètes. Les savants divergent quant à la prophétie de Khidr, Luqman, Dhu al-Kifl et Uzayr, et celui qui doute de la prophétie d'une figure non consensuelle n'est pas un incroyant. Parmi les règles spécifiques applicables aux prophètes, on compte l'interdiction de l'aumône, l'absence d'héritage et l'obligation d'être enterré sur le lieu de son décès. Les croyants doivent les vénérer de manière générale et particulière, leur obéir, les honorer, les aimer, invoquer la bénédiction sur eux et ne pas faire de distinction entre eux. Pour les sunnites, les prophètes sont supérieurs aux autres hommes et aux anges, et Muhammad est le meilleur d'entre eux. Il est permis de donner aux enfants des noms de prophètes. Les images de ces derniers sont interdites, le mensonge à leur sujet est proscrit, et le respect dû à Muhammad et à ses compagnons est obligatoire. Ceux qui l'insultent sont considérés comme apostats. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15462} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15463} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15464} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15469} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15472} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15475} {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.15481} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15483}"
  tr: "Dilbilimde peygamber, 'inba' kelimesinden gelir, yani bilgi vermek anlamına gelir; terminolojide ise 'peygamber', Allah'tan bir kralın diliyle vahiy edilen ve olağanüstü mucizelerle desteklenen kişidir. Ona indirilen herkes peygamber değildir. Ve elçi, peygamberden daha ayrıcadır. Kur'an on sekiz isimden bahseder, ardından yedi peygamberdir. Kararlı elçiler arasında, Muhammed'in en son oy olduğu bir grup da vardır. Alimler bu konuda farklı görüşler sergilemektedir el-Hidr, Luqman, Dhu al-Kifl ve Uzair'in peygamberliği, peygamberliğine katılmayan herkese karşı şüphesiz inançsızlık olarak ilan edilir. Peygamberlere özgü hükümler arasında, onlara sadaka yapmanın yasaklanması, servetlerinin miras kalmaması ve aldıkları yerde gömülmeleri vardır. Onlara genel ve ayrıntılı olarak inanmak, itaat edilmek, onurlandırmak, bereket ve selam gönderilmek, sevmek ve aralarından ayrılmak inandırıcılık değildir. Tercihle ilgili iki görüş vardır: peygamberler Ehl-sünnet'e göre tüm insanlardan ve melek olmayanlardan üstündür ve Peygamber Muhammed en iyisidir. Peygamberlerin isimlerini vermekte zarar yoktur, onları resmetmek yasaktır ve hakkında yalan söylemek yasaktır. Ona saygı göstermek ve saygı göstermek zorunludur ve ikamet sırasında onun için dua etmek ve sahabelerine saygı göstermek zorunludur. Küçümsenen veya zarar gören kimse, ödülü dinden dönme kategorisindedir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15462} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15463} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15464} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15469} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15472} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15475} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15481} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15483}"
  id: "Dalam linguistik, nabi berasal dari 'inba', yang berarti memberi informasi, dan dalam terminologi, 'nabi' adalah seseorang yang wahyu dari Allah diturunkan melalui lidah seorang raja, dan ia didukung oleh mukjizat luar biasa. Tidak semua yang diturunkan kepadanya adalah nabi. Dan rasul lebih eksklusif daripada nabi. Al-Qur'an menyebutkan delapan belas nama, diikuti oleh tujuh nabi. Di antara para rasul yang tegas terdapat kelompok yang identifikasinya berbeda, dengan Muhammad adalah yang terakhir berdasarkan konsensus. Para ulama berbeda pendapat mengenai kenabian al-Khidr, Luqman, Dhu al-Kifl, dan Uzair, dan tidak diragukan lagi dinyatakan tidak percaya kepada siapa pun yang tidak setuju dengan kenabiannya. Di antara aturan khusus nabi adalah larangan kasih sayang terhadap mereka, bahwa kekayaan mereka tidak diwariskan, dan bahwa mereka harus dikubur di mana pun mereka menerimanya. Mereka harus dipercaya secara umum dan rinci, ditaati, dihormati, mengirimkan berkat dan damai kepada mereka, dicintai oleh mereka, dan yang memisahkan di antara mereka adalah ketidakpercayaan. Ada dua pendapat mengenai preferensi di antara mereka: para nabi lebih unggul dari semua manusia dan bukan malaikat menurut Ahl al-Sunnah, dan Nabi Muhammad adalah yang terbaik di antara mereka. Tidak ada salahnya menyebut nama para nabi, dan dilarang menggambarkan mereka, dan berbohong tentang mereka tidak diperbolehkan. Menghormati dan menghormati Dia adalah kewajiban, dan wajib berdoa untuknya saat tinggal dan menghormati sahabatnya. Siapa pun yang direndahkan atau dirugikan, ganjarannya termasuk dalam kategori murtad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15462} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15463} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15464} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15469} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15472} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15475} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15481} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15483}"
