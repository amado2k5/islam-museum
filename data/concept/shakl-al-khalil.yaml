id: concept/shakl-al-khalil
class: concept
kind: term
label:
  ar: "شكل الخليل: الحركات المأخوذة من الحروف"
  en: "Al-Khalil's vowel signs: marks taken from the letters"
  ur: "خلیل کی علاماتِ حرکات: حروف سے ماخوذ نشان"
  es: "Signos vocálicos de Al-Khalil: marcas tomadas de las letras"
  fr: "Les signes vocaliques d'Al-Khalil: marques tirées des lettres"
  tr: "Hebron şekli: harflerden alınan ünlüler"
  id: "Bentuk Hebron: vokal diambil dari huruf"
summary:
  ar: "الضبط المشهور اليوم بالحركات المأخوذة من الحروف هو الذي أخرجه الخليل: الفتحة شكلة مستطيلة فوق الحرف والكسرة تحته والضمة واو صغرى فوقه والتنوين زيادة مثلها؛ وأول من وضع الهمز والتشديد والروم والإشمام الخليل {cite:itqan-suyuti p. 2250} {cite:itqan-suyuti p. 2245}."
  en: "The vowelling that is famous today, by signs derived from the letters, is the one al-Khalil produced: the fatha a slanted stroke above the letter, the kasra below it, the damma a small waw above it and tanwin a repeated mark; the first to set down hamza, shadda, rawm and ishmam was al-Khalil {cite:itqan-suyuti p. 2250} {cite:itqan-suyuti p. 2245}."
  ur: "آج جو ضبط حروف سے ماخوذ حرکات کے ساتھ مشہور ہے وہ خلیل نے نکالا: فتحہ حرف کے اوپر ایک ترچھی شکلہ، کسرہ اس کے نیچے، ضمہ اس کے اوپر چھوٹی واو، اور تنوین اسی کا اضافہ؛ ہمزہ، تشدید، روم اور اشمام کی علامتیں رکھنے والے پہلے شخص خلیل تھے {cite:itqan-suyuti p. 2250} {cite:itqan-suyuti p. 2245}۔"
  es: "La vocalización que es famosa hoy en día, por signos derivados de las letras, es la que produjo al-Khalil: la fatha un trazo inclinado sobre la letra, la kasra debajo de ella, la damma una pequeña waw sobre ella y el tanwin una marca repetida; el primero en establecer hamza, shadda, rawm e ishmam fue al-Khalil {cite:itqan-suyuti p. 2250} {cite:itqan-suyuti p. 2245}."
  fr: "La voyelle qui est célèbre aujourd'hui, par des signes dérivés des lettres, est celle produite par al-Khalil: la fatha un trait oblique au-dessus de la lettre, la kasra en dessous, la damma un petit waw au-dessus et le tanwin une marque répétée; le premier à avoir établi le hamza, le shadda, le rawm et l'ishmam fut al-Khalil {cite:itqan-suyuti p. 2250} {cite:itqan-suyuti p. 2245}."
  tr: "Bugün harflerden türeyen ünlü telaffuzu Al-Khalil'in ortaya çıkardığı türdendir: fetha harfin üstünde dikdörtgen, altında kasra, damma üstünde küçük bir waw ve tanween buna benzer ek bir eklemedir; hamza, shaddah, rūm ve ishmam al-Khalil'i ilk kez o tanıtmıştır {cite:itqan-suyuti s. 2250} {cite:itqan-suyuti s. 2245}."
  id: "Pengucapan vokal yang terkenal saat ini dengan vokal yang berasal dari huruf adalah apa yang dihasilkan Al-Khalil: fatha berbentuk persegi panjang di atas huruf, kasra di bawahnya, damma berbentuk waw kecil di atasnya, dan tanween adalah tambahan tambahan yang serupa; ia adalah yang pertama memperkenalkan hamza, shaddah, rūm, dan ishmam al-Khalil {cite:itqan-suyuti hlm. 2250} {cite:itqan-suyuti hlm. 2245}."
