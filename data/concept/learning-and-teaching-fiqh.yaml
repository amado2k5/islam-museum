id: concept/learning-and-teaching-fiqh
class: concept
kind: legal
label:
  ar: التعلم والتعليم
  en: Learning and teaching (ta'allum and ta'lim)
  ur: تعلّم اور تعلیم
summary:
  ar: 'التعلم مطاوع التعليم، والتعليم تعريف الشيء وتكريره حتى يحصل أثره في نفس المتعلم، وهو عند الراغب أخص من الإعلام الذي يكون بالخبر السريع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5517} يفرق عن التثقيف، وعن التدريب الذي هو من وسائل التعليم، وعن التأديب الذي يكون بالرياضة وبالعقوبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5517} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5518} ويكون التعلم فرض عين فيما لا يستغنى عنه المسلم في عقيدته وعباداته ومعاملاته، وفرض كفاية فيما تقوم به أمور الدنيا كالطب والحساب والنحو، ومندوبا في التبحر، وحراما كالشعوذة والسحر والكهانة والعرافة والرمل، ومكروها كأشعار الغزل التي تصف نساء بأعيانهن، ومباحا فيما لا إنكار فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5518} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5519} ويجب التعليم فرض كفاية، ويتعين على من لا يوجد غيره، ويلزم فيما يحتاجه السائل عن الإسلام أو الحلال والحرام، ويعتبر الإمام النووي تعليم الطالبين فرض كفاية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5519} وتقوم الأدلة على فضل العلم من الآيات والأخبار والآثار، ومنها حديث من يرد الله به خيرا يفقهه في الدين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5520} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5521} ويذكر الفقهاء آداب المعلم: أن يقصد وجه الله، وأن يشفق على طلابه، وأن يتواضع، وأن يقتصر على قدر فهمهم، وأن يكون عاملا بعلمه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5521} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5522} وآداب المتعلم: تطهير القلب، والتواضع للمعلم، وعدم الإعنات بالسؤال، والحرص والمواظبة، والحلم والأناة وعلو الهمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5522} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5523} ويجب على الآباء تعليم الصغير ما تصح به عقيدته وعبادته، وأن يعلموه الأخلاق والسباحة والرمي، ويرى الرافعي وجوب هذا التعليم والنووي تصحيحه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5523} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5524} وتعليم النساء القرآن والعلوم والآداب مشروع بالإجماع، ويجب منه ما تحتاجه المرأة كطب النساء، ويرى أكثر الفقهاء عدم كراهة تعليمهن الكتابة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5525} وللمعلم ضرب الصبي للتأديب بقيود: أن يكون معتادا، وأن يكون بإذن الولي، وأن يكون الصبي يعقل التأديب؛ والمعلم يضمن عند الحنفية إن ضرب بغير إذن، وعند الشافعية يضمن مطلقا إن أدى الضرب للهلاك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5525} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5526} والاستئجار على تعليم القرآن والعلم الشرعي مختلف فيه: عدم الصحة عند المتقدمين من الحنفية ورواية عند الحنابلة، والجواز عند المتأخرين من الحنفية والمالكية في قول وعند الحنابلة في رواية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5526} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5527} والمالكية يجيزون الإجارة على تعليم القرآن ويكرهونها على تعليم الفقه وغيره، والشافعية يشترطون تعيين السورة أو المسألة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5527} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5528} ويجوز الاستئجار على الحرف والصناعات المباحة، ويجيزه الجمهور على العلوم غير الشرعية البحتة، ويكرهه المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5528} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5529} ولا يجوز تعليم العلوم المحرمة كالكهانة والتنجيم والضرب بالرمل والشعبذة والسحر، ولا أخذ العوض عليها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5529} ويشترط لحل صيد الجوارح أن يكون الجارح معلما، وذلك بالنص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5529}'
  en: 'Ta''allum (learning) is the reflexive form of ta''lim (teaching). Teaching is making a thing known by repetition until it leaves a mark on the learner, and al-Raghib says it differs from informing, which is quick and by report. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5517} It is distinguished from culture (taqif), from training (tadrib), which is a means of teaching, and from discipline (ta''dib), which may be by upbringing or by punishment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5517} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5518} Learning is an individual duty for what a Muslim cannot do without in belief, worship and dealings; a communal duty for what public life needs, such as medicine, arithmetic and grammar; recommended in depth; forbidden in sorcery, soothsaying, augury and geomancy; disliked in love poetry that names real women; and permitted where nothing is objectionable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5518} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5519} Teaching is a communal duty, and becomes binding on one who is the only qualified person; it is binding when someone asks about Islam or what is lawful and unlawful; al-Nawawi holds that teaching students is a communal duty. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5519} Scripture and reports praise knowledge, including the report that God wants good for whomever He gives understanding of the religion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5520} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5521} The etiquette of the teacher: seek God''s face, be kind to students, be humble, teach to their level, and practise what he teaches. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5521} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5522} The etiquette of the student: purify the heart, be humble before the teacher, do not press him with questions, be diligent and steady, and show patience and high aims. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5522} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5523} Parents must teach a child what his belief and worship require, and also manners, swimming and archery; al-Rafi''i holds this is obligatory and al-Nawawi affirms it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5523} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5524} Teaching women the Qur''an, sciences and manners is lawful by agreement, and what they need, such as women''s medicine, is required; most jurists see no objection to teaching women to write. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5525} A teacher may beat a pupil for discipline under conditions: the beating is customary, the guardian permits it, and the child understands discipline. The Hanafis hold the teacher liable if he beats without permission, while the Shafiis hold him liable whenever the beating leads to death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5525} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5526} Being paid for teaching the Qur''an and religious knowledge is disputed: the earlier Hanafis and one Hanbali view forbid it, while the later Hanafis, one Maliki view and one Hanbali narration allow it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5526} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5527} The Malikis allow pay for teaching the Qur''an and dislike it for jurisprudence and other sciences; the Shafiis require the surah or the questions to be named. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5527} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5528} Pay for teaching lawful crafts is allowed; most jurists allow it for non-religious sciences such as language and manners, while the Malikis dislike it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5528} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5529} Teaching forbidden sciences such as soothsaying, astrology, geomancy, sorcery and their like is forbidden, and taking pay for them is forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5529} For the game caught by a trained hound to be lawful, the hound must have been trained, as the Qur''an says and the hadith confirms. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5529}'
  ur: 'تعلّم، تعلیم کا باب تفعّل ہے، اور تعلیم کسی چیز کو بار بار بتانا ہے یہاں تک کہ اس کا اثر سکھنے والے کے دل پر ہو جائے؛ راغب کے نزدیک یہ اعلام سے خاص ہے جو جلدی خبر دینے کا نام ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5517} یہ تثقیف، اس تدریب سے جو تعلیم کا ذریعہ ہے، اور تادیب (ریاضت یا سزا) سے مختلف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5517} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5518} تعلم عقیدے، عبادت اور معاملات کے لیے فرض عین ہے، زندگی کی ضرورتوں جیسے طب، حساب اور نحو کے لیے فرض کفایہ، گہری تحقیق کے لیے مستحب، جادو، کہانت، فال اور رمل میں حرام، عورتوں کے نام لے کر عشقیہ شعر میں مکروہ، اور جہاں کوئی قباحت نہ ہو وہاں مباح ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5518} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5519} تعلیم فرض کفایہ ہے، اور جو اکیلا اہل ہو اس پر متعین ہو جاتی ہے؛ اسلام یا حلال و حرام کا سوال کرنے والے کو جواب دینا لازم ہے۔ امام نووی طالبین کو پڑھانا فرض کفایہ قرار دیتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5519} آیات، احادیث اور آثار علم کی فضیلت پر دلالت کرتے ہیں، جن میں یہ حدیث بھی ہے کہ جس کے ساتھ اللہ بھلائی کا ارادہ کرے اسے دین کی سمجھ دیتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5520} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5521} استاد کے آداب: اللہ کی رضا کی نیت، شاگردوں پر شفقت، تواضع، ان کی سمجھ کے مطابق تعلیم، اور اپنے علم پر عمل۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5521} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5522} طالب علم کے آداب: دل کو پاک کرنا، استاد کے سامنے عاجزی، بے جا سوال سے گریز، حرص اور مداومت، برداشت اور بلند ہمتی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5522} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5523} والدین پر لازم ہے کہ بچے کو وہ عقیدہ اور عبادت سکھائیں جن سے اس کا دین درست رہے، نیز اخلاق، تیراکی اور تیر اندازی؛ رافعی اسے واجب کہتے ہیں اور نووی نے اس کی تصحیح کی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5523} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5524} عورتوں کو قرآن، علوم اور آداب سکھانا بالاتفاق جائز ہے، اور جو عورت کو ضروری ہو جیسے عورتوں کا علاج، وہ واجب ہے؛ اکثر فقہاء لکھنا سکھانے کو مکروہ نہیں کہتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5525} استاد کو تادیب کے لیے بچے کو مارنے کا حق ہے مگر شرائط کے ساتھ: مار معمول کے مطابق ہو، ولی کی اجازت ہو، اور بچہ تادیب سمجھتا ہو۔ حنفیہ کے نزدیک بغیر اجازت مارنے پر استاد ضامن ہے، اور شافعیہ کے نزدیک ہلاکت ہو تو ضامن ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5525} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5526} قرآن اور دینی علم سکھانے کی اجرت میں اختلاف ہے: متقدمین حنفیہ اور حنابلہ کی ایک روایت منع کرتی ہے، جبکہ متأخرین حنفیہ، مالکیہ کا ایک قول اور حنابلہ کی ایک روایت جواز کہتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5526} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5527} مالکیہ قرآن کی تعلیم کی اجرت جائز اور فقہ وغیرہ کی اجرت مکروہ کہتے ہیں؛ شافعیہ کے نزدیک سورت یا مسائل معین کرنا شرط ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5527} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5528} مباح پیشوں کی تعلیم کی اجرت جائز ہے، اور جمہور غیر شرعی خالص علوم جیسے لغت اور آداب کی اجرت بھی جائز کہتے ہیں، جبکہ مالکیہ اسے مکروہ کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5528} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5529} کہانت، نجوم، رمل، جادو اور ان جیسے حرام علوم کی تعلیم اور ان پر اجرت حرام ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5529} شکاری جانور کے شکار کو حلال ہونے کے لیے جانور کا سدھایا ہوا ہونا شرط ہے، جیسا کہ قرآن اور حدیث میں ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5529}'
