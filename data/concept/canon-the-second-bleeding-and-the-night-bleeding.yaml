id: concept/canon-the-second-bleeding-and-the-night-bleeding
class: concept
kind: scientific
label: { ar: "التثنية في الفصد والفصد ليلاً عند ابن سينا", en: "The second bleeding and bleeding at night in the Canon", ur: "قانون میں دوسرا فصد اور رات کا فصد", es: "El segundo sangrado y sangrado nocturno en el Canon", fr: "Le deuxième saignement et les saignements nocturnes dans le Canon", tr: "İbn Sina'ya göre Flebitizm ve Gecelikte İkilik", id: "Dualisme dalam Flebitisme dan Kegelapan Menurut Ibn Sina" }
summary:
  ar: "يبين ابن سينا كيف تؤدى التثنية، وهي إعادة إسالة الدم من الشق نفسه بعد تأخير، وما يدهن به المبضع، ومنافعها وما ينبغي من النوم بين الفصد والتثنية، ويذكر أن فصد المجانين ومن يفصد ليلاً في النوم يكون ضيقاً {cite:canon-ibn-sina-print-v1 p.293}."
  en: "Ibn Sina explains how the second bleeding is done, the renewed letting of blood from the same incision after a delay, what the lancet is oiled with, its benefits and the sleep proper between the bleeding and the second, and says that the bleeding of the mad and of those bled at night in their sleep is to be narrow {cite:canon-ibn-sina-print-v1 p.293}."
  es: "Ibn Sina explica cómo se realiza la segunda sangría, la extracción de sangre de la misma incisión después de un tiempo, con qué se engrasa la lanceta, sus beneficios y el sueño adecuado entre la sangría y la segunda, y dice que la sangría de los locos y de aquellos a quienes se les sangra por la noche mientras duermen debe ser escasa {cite:canon-ibn-sina-print-v1 p.293}."
  fr: "Ibn Sina explique comment se fait la seconde saignée, le nouveau prélèvement de sang à partir de la même incision après un délai, avec quoi la lancette est huilée, ses bienfaits et le sommeil approprié entre la saignée et la seconde, et dit que la saignée des fous et de ceux qui sont saignés la nuit pendant leur sommeil doit être étroite {cite:canon-ibn-sina-print-v1 p.293}."
  ur: "ابن سینا بتاتے ہیں کہ دوسرا خون کس طرح نکلتا ہے، ایک ہی چیرا سے خون تاخیر کے بعد دوبارہ نکلنا، کمبل کو کس چیز سے تیل لگایا جاتا ہے، اس کے فوائد اور خون بہنے اور دوسرے کے درمیان مناسب نیند، اور کہتے ہیں کہ پاگلوں اور رات کو نیند کی حالت میں خون آنے والوں کا خون کم ہونا ہے۔"
  tr: "İbn Sina, duallığın nasıl yapıldığını, yani gecikmeden sonra aynı kesiden kanın yeniden boşaltılmasını, neşterin neye sürttüğünü, faydalarını ve flebitle dualizm arasındaki doğru uykuyu açıklar. Akıl hastalarının ve gece uyuyanların reddinin dar bir alanda olduğunu belirtir {cite:canon-ibn-sina-print-v1 s.293}."
  id: "Ibn Sina menjelaskan bagaimana dual dilakukan, yaitu mengalirkan kembali darah dari sayatan yang sama setelah jeda, apa yang digosok pisau bedah, manfaatnya, dan tidur yang tepat antara flebitis dan dualisme. Ia menyebutkan bahwa penolakan terhadap orang gila dan mereka yang tidur malam sangat sempit {cite:canon-ibn-sina-print-v1 hlm.293}."
