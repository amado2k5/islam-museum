summary:
  ar: "يفتتح ابن سينا الفصل الثالث، في أمراض الصبيان وعلاجاتها، بأن الغرض المقدم في معالجتهم هو تدبير المرضع، فتعالج هي بما يوافق حالها، ويرضع الطفلَ غيرُها في يوم إسهالها أو قيئها {cite:canon-ibn-sina-print-v1 p.211}."
  en: "Ibn Sina opens chapter three, on the diseases of children and their treatment, by saying that the first aim in treating them is the regimen of the wet nurse: she is treated according to her condition, and another woman nurses the child on a day when she is purged or vomits {cite:canon-ibn-sina-print-v1 p.211}."
