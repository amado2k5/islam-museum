id: concept/al-tadarruj-fi-al-tashri
class: concept
kind: legal
label:
  ar: "التدرج في التشريع"
  en: "Gradualism in legislation (tadarruj)"
  ur: "تشریع میں تدریج"
summary:
  ar: "التدرج في التشريع عند الشعراوي أن الله يضع الأحكام المتعلقة بالعادات على مراحل، فيوزّع تحريم عادة كالخمر أو تعديلها على زمن، لأن النفس تحتاج إلى انتقال تدريجي، أما العقيدة فلا مراحل فيها، فالتوحيد وترك الشرك حكم حاسم {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2257}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2285}."
  en: "For al-Sha'rawi, God brings rulings about habits in stages, so that a habit such as wine is set aside over time rather than in one blow, because the self needs a gradual passage. Creed admits no stages: the oneness of God and the refusal of association are stated at once {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2257}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2285}."
  ur: "شعراوی کے نزدیک اللہ عادات سے متعلق احکام مرحلہ وار دیتا ہے، تاکہ نفس کو انتقال کا وقت ملے، جیسے شراب کی ممانعت کا معاملہ۔ عقیدے میں مراحل نہیں: توحید اور شرک سے انکار قطعی اور یکبارگی ہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2257}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2285}۔"
wings: [ideas]
themes: [development-of-law-theology-institutions]
issue:
  ar: "هل تتدرج كل الأحكام، أم أحكام العادات وحدها، وما الفرق بين مسائل العقيدة ومسائل الإلف؟"
  en: "Are all rulings gradual, or only those about habits, and how does creed differ from habit-bound matters?"
  ur: "کیا تمام احکام تدریجی ہیں، یا صرف عادات سے متعلق احکام، اور عقیدے اور عادت والے معاملات میں کیا فرق ہے؟"
perspectives:
  - tradition: sunni
    id: sunni-sharawi-gradualism
    stance:
      ar: "المراحل تكون في الأحكام المتعلقة بالعادات، أما العقيدة فحاسمة لا مرحلية فيها"
      en: "Stages apply to rulings about habits; creed is decisive and admits no stages"
      ur: "مراحل عادات سے متعلق احکام میں ہیں؛ عقیدہ قطعی ہے اور اس میں مراحل نہیں"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن التوحيد وترك الشرك لا مرحلية فيهما، وأن مسائل الإلف تُعالج بالتدرج حتى لا تقع فجوة في الانتقال {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2257}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2285}."
      en: "Al-Sha'rawi holds that the oneness of God and the refusal of association admit no stages, and that matters bound by habit are handled gradually so that no gap opens in the passage {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2257}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2285}."
      ur: "شعراوی کے مطابق توحید اور شرک سے انکار میں مراحل نہیں، اور عادت سے جڑے معاملات کو تدریج سے نمٹایا جاتا ہے تاکہ انتقال میں خلا نہ پیدا ہو {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2257}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2285}۔"
    sources: [source/tafsir-sharawi-khawatir-scan-vol-2]
  - tradition: academic
    id: academic
    stance:
      ar: "قراءة أكاديمية للتدرج في التشريع لم تُضف بعد"
      en: "An academic reading of gradualism in legislation has not yet been added"
      ur: "تشریعی تدریج پر کوئی علمی مطالعہ ابھی شامل نہیں کیا گیا"
    summary:
      ar: "لم يُعرض في هذه الصفحات رأي أكاديمي في التدرج أو في عدد مراحل أحكام الخمر؛ يحتاج إلى مرجع محدد (needs_source)."
      en: "No academic reading of gradualism, or of the number of stages in the wine rulings, is set out in these pages; it needs a named source (needs_source)."
      ur: "ان صفحات میں تدریج یا شراب کے احکام کے مراحل پر کوئی علمی رائے پیش نہیں کی گئی؛ اسے کسی متعین ماخذ کی ضرورت ہے (needs_source)۔"
