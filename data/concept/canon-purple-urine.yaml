label: { ar: "البول الأرجواني عند ابن سينا", en: "Purple urine in the Canon", ur: "ارغوانی پیشاب قانون میں" }
summary:
  ar: "يذكر ابن سينا أن البول الأرجواني رديء قتال لأنه يدل على احتراق المرتين، وأن الأحمر الذي يجري فيه سواد يدل على الحميات المركبة والحميات من الأخلاط الغليظة، وعلى ذات الجنب إن كان أصفى وكان السواد أميل إلى رأسه {cite:canon-ibn-sina-print-v1 pp.188-189}."
  en: "Ibn Sina says purple urine is bad and deadly because it shows the burning of both biles, and that red running into black shows compound fevers and fevers from thick humours, and pleurisy if it is clearer and the black lies nearer its top {cite:canon-ibn-sina-print-v1 pp.188-189}."
