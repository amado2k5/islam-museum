id: concept/canon-purple-urine
class: concept
kind: scientific
label:
  ar: "البول الأرجواني عند ابن سينا"
  en: "Purple urine in the Canon"
  fr: "Urine pourpre dans le Canon"
  ur: "ارغوانی پیشاب قانون میں"
  es: "Orina morada en el cañón"
summary:
  ar: "يذكر ابن سينا أن البول الأرجواني رديء قتال لأنه يدل على احتراق المرتين، وأن الأحمر الذي يجري فيه سواد يدل على الحميات المركبة والحميات من الأخلاط الغليظة، وعلى ذات الجنب إن كان أصفى وكان السواد أميل إلى رأسه {cite:canon-ibn-sina-print-v1 pp.188-189}."
  en: "Ibn Sina says purple urine is bad and deadly because it shows the burning of both biles, and that red running into black shows compound fevers and fevers from thick humours, and pleurisy if it is clearer and the black lies nearer its top {cite:canon-ibn-sina-print-v1 pp.188-189}."
  fr: "Ibn Sina juge la pourpre mauvaise et mortelle, signe de combustion des deux biles ; rouge mêlé de noir indiquerait fièvres composées ou d’humeurs épaisses, et pleurésie si plus clair avec noir vers le haut {cite:canon-ibn-sina-print-v1 pp.188-189}."
  es: "Ibn Sina dice que la orina púrpura es mala y mortal porque muestra la quemazón de ambas bilis, y que el rojo que se mezcla con el negro muestra fiebres compuestas y fiebres por humores espesos, y pleuresía si es más clara y el negro está más cerca de su superficie {cite:canon-ibn-sina-print-v1 pp.188-189}."
