label: { ar: "طريقة دلك الاسترداد والغمز عند النوم عند ابن سينا", en: "The method of recovery massage and pressing at bedtime in the Canon", ur: "قانون میں بحالی کی مالش کا طریقہ اور سونے کے وقت دبانا" }
summary:
  ar: "يصف ابن سينا طريقة دلك الاسترداد، فيبدأ بالدهن وبقوة ثم يمال به إلى الاعتدال ولا يقطع على عنفه، وتجتمع عليه أيد كثيرة، ويوتر المدلوك أعضاءه ثم يمر قماط على نواحيها مع حصر النفس، ويمشي ويستلقي، ثم يذكر أن الدلك والغمز الشديد عند النوم يجفف البدن ويمنع الرطوبة من السيلان إلى المفاصل {cite:canon-ibn-sina-print-v1 p.225}."
  en: "Ibn Sina describes how to do the massage of recovery: begin with oil and with force, then ease toward moderation without stopping at its roughest, with many hands; the person tenses the rubbed organs, a swaddling band is passed over them, the breath is held, he walks and lies back; and he notes that firm massage and pressing at bedtime dries the body and keeps moisture from flowing to the joints {cite:canon-ibn-sina-print-v1 p.225}."
