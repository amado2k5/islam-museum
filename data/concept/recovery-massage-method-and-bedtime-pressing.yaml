label: { ar: "طريقة دلك الاسترداد والغمز عند النوم عند ابن سينا", en: "The method of recovery massage and pressing at bedtime in the Canon", ur: "قانون میں بحالی کی مالش کا طریقہ اور سونے کے وقت دبانا", es: "El método de masaje y presión de recuperación antes de acostarse en el Canon", fr: "La méthode de massage et de pression de récupération au coucher chez Canon" }
summary:
  ar: "يصف ابن سينا طريقة دلك الاسترداد، فيبدأ بالدهن وبقوة ثم يمال به إلى الاعتدال ولا يقطع على عنفه، وتجتمع عليه أيد كثيرة، ويوتر المدلوك أعضاءه ثم يمر قماط على نواحيها مع حصر النفس، ويمشي ويستلقي، ثم يذكر أن الدلك والغمز الشديد عند النوم يجفف البدن ويمنع الرطوبة من السيلان إلى المفاصل {cite:canon-ibn-sina-print-v1 p.225}."
  en: "Ibn Sina describes how to do the massage of recovery: begin with oil and with force, then ease toward moderation without stopping at its roughest, with many hands; the person tenses the rubbed organs, a swaddling band is passed over them, the breath is held, he walks and lies back; and he notes that firm massage and pressing at bedtime dries the body and keeps moisture from flowing to the joints {cite:canon-ibn-sina-print-v1 p.225}."
  es: "Ibn Sina describe cómo realizar el masaje de recuperación: comenzar con aceite y con fuerza, luego ir disminuyendo la intensidad sin detenerse en su punto más brusco, con muchas manos; la persona tensa los órganos frotados, se pasa una venda por encima, se contiene la respiración, camina y se recuesta; y señala que el masaje firme y la presión antes de acostarse resecan el cuerpo y evitan que la humedad fluya hacia las articulaciones {cite:canon-ibn-sina-print-v1 p.225}."
  fr: "Ibn Sina décrit comment effectuer le massage de récupération: commencer avec de l’huile et avec force, puis adoucir jusqu’à la modération sans s’arrêter à sa plus brutale, avec plusieurs mains; la personne contracte les organes massés, une bande de contention est passée par-dessus, la respiration est retenue, elle marche et se recouche; et il note qu’un massage ferme et une pression au coucher dessèchent le corps et empêchent l’humidité de couler vers les articulations {cite:canon-ibn-sina-print-v1 p.225}."
  ur: "ابن سینا بیان کرتے ہیں کہ صحت یابی کی مالش کیسے کی جائے: تیل اور طاقت سے شروع کریں، پھر اس کے سخت ترین، بہت سے ہاتھوں سے رکے بغیر اعتدال کی طرف آسانی کریں۔ شخص رگڑے ہوئے اعضاء کو تناؤ دیتا ہے، ان کے اوپر سے لپیٹنے والا بینڈ گزر جاتا ہے، سانس روک لی جاتی ہے، وہ چلتا ہے اور پیچھے لیٹ جاتا ہے۔ اور وہ نوٹ کرتا ہے کہ سوتے وقت مضبوطی سے مالش اور دبانے سے جسم خشک ہو جاتا ہے اور جوڑوں میں نمی بہنے سے روکتی ہے"
