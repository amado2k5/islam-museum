id: concept/tashahhud-testimony-in-prayer
class: concept
kind: legal
label:
  ar: "التشهد"
  en: "Tashahhud (the testimony sitting in prayer)"
  ur: "تشہد ⁦(نماز کی قعدہ میں پڑھی جانے والی دعا)⁩"
  es: "Tashahhud (el testimonio sentado en oración)"
  fr: "Tashahhud (le témoignage assis en prière)"
summary:
  ar: "التشهد في الصلاة الكلمات التي تُقال في القعدة، وسُمّي بذلك لاشتماله على الشهادتين. والقعدة التي لا يعقبها السلام، أي الأولى، التشهد فيها واجب عند الحنفية على الأصح وعند المالكية في قول وعند الحنابلة في المذهب، وسنة عند المالكية في المذهب والشافعية والحنابلة في رواية والحنفية في قول. أما الأخيرة فواجب عند الحنفية، وسنة عند المالكية في المذهب، وركن عند الشافعية والحنابلة. وأفضل الألفاظ عند الحنفية والحنابلة ما علّمه النبي لابن مسعود، وعند المالكية تشهد عمر، وعند الشافعية تشهد ابن عباس. والإسرار به سنة، ومن تركه في القعدة الأولى سهواً سجد للسهو، وتركه عمداً فيه خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5198} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5199} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5200} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5202} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5203}"
  en: "The tashahhud is the set of words said in the sitting of prayer, named for its two testimonies. In the sitting not followed by the salam (the first), it is obligatory for the Hanafis on the sound view, for the Malikis in one view and for the Hanbali school, and a sunna for the Malikis in their school view, the Shafiis and one Hanbali narration. The last sitting is obligatory for the Hanafis, a sunna for the Malikis in their school view, and a pillar for the Shafiis and Hanbalis. The best wording is the version taught to Ibn Masud for the Hanafis and Hanbalis, Umar's for the Malikis, and Ibn Abbas's for the Shafiis. Saying it quietly is the sunna. Omitting it in the first sitting by forgetfulness requires the forgetfulness prostration; deliberate omission is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5198} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5199} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5200} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5202} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5203}"
  es: "El tashahhud es el conjunto de palabras que se pronuncian durante la oración, llamado así por sus dos testimonios. En la primera oración, no seguida del salam, es obligatorio para los hanafíes según la interpretación correcta, para los malikíes según una interpretación y para la escuela hanbalí, y una sunna para los malikíes según su interpretación, los shafiíes y una narración hanbalí. La última oración es obligatoria para los hanafíes, una sunna para los malikíes según su interpretación y un pilar para los shafiíes y hanbalíes. La mejor versión es la que se enseñó a Ibn Masud para los hanafíes y hanbalíes, la de Umar para los malikíes y la de Ibn Abbas para los shafiíes. Decirla en voz baja es la sunna. Omitirla en la primera oración por olvido requiere la postración del olvido; la omisión deliberada es objeto de debate. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5198} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5199} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5200} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5202} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5203}"
  fr: "Le tashahhud est l'ensemble des paroles prononcées lors de la prière, ainsi nommé en raison de ses deux témoignages. Lors de la première prière, avant le salam, il est obligatoire pour les hanafites (selon l'avis authentique), les malikites (selon un avis) et l'école hanbalite. Il est également recommandé (sunna) par les malikites (selon leur avis), les chaféites et selon une tradition hanbalite. Lors de la dernière prière, il est obligatoire pour les hanafites, recommandé (sunna) par les malikites (selon leur avis) et constitue un pilier pour les chaféites et les hanbalites. La meilleure formulation est celle enseignée à Ibn Mas'ud pour les hanafites et les hanbalites, celle d'Umar pour les malikites et celle d'Ibn Abbas pour les chaféites. Le réciter à voix basse est une sunna. L'omission par oubli lors de la première prière requiert la prosternation de l'oubli; l'omission délibérée est controversée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5198} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5199} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5200} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5202} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5203}"
