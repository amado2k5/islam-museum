label:
  ar: "التشهد"
  en: "Tashahhud (the testimony sitting in prayer)"
  ur: "تشہد (نماز کی قعدہ میں پڑھی جانے والی دعا)"
summary:
  ar: "التشهد في الصلاة الكلمات التي تُقال في القعدة، وسُمّي بذلك لاشتماله على الشهادتين. والقعدة التي لا يعقبها السلام، أي الأولى، التشهد فيها واجب عند الحنفية على الأصح وعند المالكية في قول وعند الحنابلة في المذهب، وسنة عند المالكية في المذهب والشافعية والحنابلة في رواية والحنفية في قول. أما الأخيرة فواجب عند الحنفية، وسنة عند المالكية في المذهب، وركن عند الشافعية والحنابلة. وأفضل الألفاظ عند الحنفية والحنابلة ما علّمه النبي لابن مسعود، وعند المالكية تشهد عمر، وعند الشافعية تشهد ابن عباس. والإسرار به سنة، ومن تركه في القعدة الأولى سهواً سجد للسهو، وتركه عمداً فيه خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5198} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5199} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5200} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5202} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5203}"
  en: "The tashahhud is the set of words said in the sitting of prayer, named for its two testimonies. In the sitting not followed by the salam (the first), it is obligatory for the Hanafis on the sound view, for the Malikis in one view and for the Hanbali school, and a sunna for the Malikis in their school view, the Shafiis and one Hanbali narration. The last sitting is obligatory for the Hanafis, a sunna for the Malikis in their school view, and a pillar for the Shafiis and Hanbalis. The best wording is the version taught to Ibn Masud for the Hanafis and Hanbalis, Umar's for the Malikis, and Ibn Abbas's for the Shafiis. Saying it quietly is the sunna. Omitting it in the first sitting by forgetfulness requires the forgetfulness prostration; deliberate omission is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5198} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5199} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5200} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5202} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5203}"
