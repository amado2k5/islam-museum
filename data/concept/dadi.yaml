summary:
  ar: "حبّ مثل الشعير إلى حمرة، زهره أطول وأدق، أدكن ومرّ. قابض يحفظ نبيذ التمر من الحموضة، وفيه تليين جيد للصلابات، ومسدّد للرأس، ونافع جداً لأوجاع المقعدة، وينفع البواسير والسموم، وبدله اللوز والأبهل إلا في الحبالى {cite:canon-ibn-sina-print-v1 p.435} {cite:canon-ibn-sina-print-v1 p.436}."
  en: "A seed like barley tending to red; its flower is longer and finer, dark and bitter. Astringent; it keeps date wine from turning sour, softens hardened swellings, is strengthening for the head, and very useful for anal pains; it helps piles and poisons. Almond and abhal are the substitutes, except that abhal is not used for pregnant women {cite:canon-ibn-sina-print-v1 p.435} {cite:canon-ibn-sina-print-v1 p.436}."
  ur: "جو کی طرح کا دانہ جس میں کچھ سرخی ہے؛ اس کا پھول لمبا اور باریک، گہرا اور کڑوا۔ قابض ہے اور کھجور کے نبیذ کو کھٹا ہونے سے بچاتا ہے، سخت سوجن کو نرم کرتا ہے، سر کو مضبوط کرتا ہے، مقعد کے دردوں کے لیے بہت مفید ہے، اور بواسیر اور زہروں میں نافع ہے۔ بدل بادام اور ابہل ہیں، مگر حاملہ عورتوں کو ابہل نہیں دیا جاتا {cite:canon-ibn-sina-print-v1 p.435} {cite:canon-ibn-sina-print-v1 p.436}۔"
  es: "Una semilla parecida a la cebada, de color rojo; su flor es más larga y fina, oscura y amarga. Astringente; evita que el vino de dátiles se agrie, suaviza las hinchazones endurecidas, fortalece la cabeza y es muy útil para los dolores anales; ayuda con las hemorroides y las intoxicaciones. La almendra y el abhal son sustitutos, excepto que el abhal no se usa en mujeres embarazadas {cite:canon-ibn-sina-print-v1 p.435} {cite:canon-ibn-sina-print-v1 p.436}."
