id: concept/canon-need-for-evacuation-and-precautionary-evacuation
class: concept
kind: scientific
label:
  ar: "الحاجة إلى الاستفراغ والاستظهار عند ابن سينا"
  en: "The need for evacuation and precautionary evacuation in the Canon"
  fr: "Nécessité et précaution d’évacuation dans le Canon"
  ur: "استفراغ کی ضرورت اور احتیاطی استفراغ قانون میں"
  es: "La necesidad de evacuación y evacuación preventiva en el Canon"
  tr: "İbn Sina'ya göre kusma ve ezbere ihtiyaç"
  id: "Kebutuhan untuk muntah dan pembacaan menurut Ibn Sina"
summary:
  ar: "يبين ابن سينا أن الاستفراغ لا يدعو إليه فرط الامتلاء وحده بل عظم العلة والامتلاء كمية وكيفية، وأن تحسين التدبير يغني عن الفصد كثيراً، وأن من يعتاده النقرس أو الصرع يستظهر قبل وقته بالفصد أو الإسهال {cite:canon-ibn-sina-print-v1 p.277}."
  en: "Ibn Sina shows that evacuation is called for not by sheer fullness alone but by the gravity of the illness and by fullness in quantity and quality, that better regimen often does without venesection, and that people prone to gout or epilepsy evacuate beforehand by venesection or purging {cite:canon-ibn-sina-print-v1 p.277}."
  fr: "Ibn Sina ne retient pas la seule réplétion, mais gravité et réplétion qualitative et quantitative ; un meilleur régime remplacerait souvent la saignée, et les sujets à goutte ou épilepsie évacueraient préventivement par saignée ou purge {cite:canon-ibn-sina-print-v1 p.277}."
  es: "Ibn Sina muestra que la evacuación se requiere no solo por la mera plenitud, sino por la gravedad de la enfermedad y por la plenitud en cantidad y calidad, que un mejor régimen a menudo prescinde de la flebotomía, y que las personas propensas a la gota o la epilepsia se flebotomizan previamente mediante flebotomía o purga {cite:canon-ibn-sina-print-v1 p.277}."
  ur: "ابن سینا سے پتہ چلتا ہے کہ انخلاء صرف مکمل طور پر مکمل ہونے سے نہیں بلکہ بیماری کی شدت اور مقدار اور معیار کے لحاظ سے ہے، یہ بہتر طریقہ اکثر رگ لگنے کے بغیر ہوتا ہے، اور یہ کہ جو لوگ گاؤٹ یا مرگی کا شکار ہوتے ہیں ان کو پہلے ہی وینسییکشن یا صاف کرکے نکالا جاتا ہے۔"
  tr: "İbn Sina, kusmanın sadece aşırı tokluktan değil, hastalığın şiddeti ve tokluğun hem niceliksel hem de niteliksel olarak neden olduğunu açıklar. Yönetimin iyileştirilmesi flebitomu büyük ölçüde telafi eder ve gut veya epilepsiye alışkın olanların erken flebit veya ishal olarak yönlendirildiğini belirtir {cite:canon-ibn-sina-print-v1 s.277}."
  id: "Ibn Sina menjelaskan bahwa muntah bukan hanya disebabkan oleh rasa kenyang berlebihan, melainkan oleh tingkat keparahan penyakit dan rasa kenyang baik secara kuantitatif maupun kualitatif. Peningkatan manajemen sangat mengkompensasi flebitoma, dan mereka yang terbiasa dengan asam urat atau epilepsi secara prematur dirujuk ke flebitis atau diare {cite:canon-ibn-sina-print-v1 hlm.277}."
