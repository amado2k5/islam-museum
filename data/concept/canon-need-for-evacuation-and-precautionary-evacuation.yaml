label: { ar: "الحاجة إلى الاستفراغ والاستظهار عند ابن سينا", en: "The need for evacuation and precautionary evacuation in the Canon", ur: "استفراغ کی ضرورت اور احتیاطی استفراغ قانون میں" }
summary:
  ar: "يبين ابن سينا أن الاستفراغ لا يدعو إليه فرط الامتلاء وحده بل عظم العلة والامتلاء كمية وكيفية، وأن تحسين التدبير يغني عن الفصد كثيراً، وأن من يعتاده النقرس أو الصرع يستظهر قبل وقته بالفصد أو الإسهال {cite:canon-ibn-sina-print-v1 p.277}."
  en: "Ibn Sina shows that evacuation is called for not by sheer fullness alone but by the gravity of the illness and by fullness in quantity and quality, that better regimen often does without venesection, and that people prone to gout or epilepsy evacuate beforehand by venesection or purging {cite:canon-ibn-sina-print-v1 p.277}."
