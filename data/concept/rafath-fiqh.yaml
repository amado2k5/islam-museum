id: concept/rafath-fiqh
class: concept
kind: legal
label:
  ar: "الرفث"
  en: "Rafath (intercourse and obscene speech in worship): its penalty in fasting, in i'tikaf and in the state of consecration"
  ur: "رفث (عبادت میں)"
summary:
  ar: "الرفث في اللغة الجماع وما يكون بين الرجل والمرأة من تقبيل ونحوه، ويطلق على الفحش وقبيح القول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8799} والرفث في العبادات منهي عنه، ومن جامع عامدا في نهار رمضان فسد صومه ووجب عليه القضاء والكفارة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8800} واختلف الفقهاء في الجماع ناسيا، فلم يفسده الحنفية والشافعية، وأفسده المالكية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8800} والجماع في الاعتكاف يفسده، والخلاف في الناسي عند الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8801} والرفث في الإحرام محرم بالإجماع، ويفسد النسك عند الجمهور إذا كان الجماع في الفرج عامدا، ويلزم القضاء والكفارة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8801}"
  en: "Rafath in the lexicon is intercourse and what passes between a man and a woman, such as kissing, and it is also used for obscene speech. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8799} In worship it is forbidden: one who has intercourse deliberately in the day of Ramadan breaks his fast and owes a makeup and an expiation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8800} The jurists differ on forgetful intercourse: the Hanafis and Shafi'is do not void the fast, the Malikis and Hanbalis do. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8800} Intercourse breaks i'tikaf, and the Shafi'is differ on the forgetful. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8801} Rafath in the state of ihram is forbidden by agreement, and intercourse in the private part voids the pilgrimage by the majority when deliberate, requiring a makeup and an expiation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8801}"
  ur: "رفث جماع اور اس سے متعلق بے حیائی کو کہتے ہیں؛ عبادت میں اس کی ممانعت ہے، اور رمضان میں جان بوجھ کر جماع کرنے والے کا روزہ ٹوٹ جاتا ہے اور قضا و کفارہ لازم ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8799} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8800}"
