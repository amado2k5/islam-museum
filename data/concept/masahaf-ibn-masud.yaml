id: concept/masahaf-ibn-masud
class: concept
kind: term
label:
  ar: "مصحف ابن مسعود"
  en: "Ibn Mas'ud codex"
summary:
  ar: مصحف ابن مسعود المصحف الخاص بعبد الله بن مسعود، وهو من المصاحف الخاصة التي أُمر بإحراقها بعد توحيد عثمان؛ نُقل أنه أنكر ذلك أولاً ثم رجع إلى الجماعة، وتُنقل عنه قراءات تخالف المصحف العثماني منها حذف الموصول في الليل 3، كما روى البخاري {cite:manahil-irfan-sabt p. 239} {cite:manahil-irfan-sabt p. 175}.
  en: Ibn Mas'ud's codex is the private codex of Abdallah ibn Mas'ud, one of the private codices ordered burned after Uthman's unification; it is reported he first objected and then returned to the community, and readings from him that differ from the Uthmanic codex are related, among them dropping the relative particle at al-Layl 92:3, as al-Bukhari relays {cite:manahil-irfan-sabt p. 239} {cite:manahil-irfan-sabt p. 175}.
  ur: مصحفِ ابن مسعود عبد اللہ بن مسعود کا نجی مصحف ہے، ان نجی مصاحف میں سے جنھیں عثمان کی توحید کے بعد جلانے کا حکم دیا گیا؛ منقول ہے کہ انھوں نے پہلے انکار کیا پھر جماعت میں لوٹ آئے، اور ان سے ایسی قراءتیں مروی ہیں جو مصحفِ عثمانی کے مخالف ہیں، جن میں اللیل 92:3 میں اسمِ موصول کا حذف ہے جیسا کہ بخاری نے روایت کیا {cite:manahil-irfan-sabt p. 239} {cite:manahil-irfan-sabt p. 175}۔
