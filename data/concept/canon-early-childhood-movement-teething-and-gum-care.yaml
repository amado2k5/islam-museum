summary:
  ar: "يذكر ابن سينا أن تدبير الطفل الترطيب والرياضة المعتدلة، وأن لا يحمل على المشي أو القعود قبل انبعاثه إليه بالطبع، وأن يحمى من الأذى، وكيف تعالج لثته عند ظهور الثنايا والأنياب بالدهن والعسل والملح وأصل السوس {cite:canon-ibn-sina-print-v1 pp.210-211}."
  en: "Ibn Sina says the child's management is moistening and ample moderate exercise, that it should not be made to walk or sit before it moves toward it naturally, that it be protected from harm, and how its gums are tended when the front teeth and canines come, with oil, honey, salt and liquorice root {cite:canon-ibn-sina-print-v1 pp.210-211}."
