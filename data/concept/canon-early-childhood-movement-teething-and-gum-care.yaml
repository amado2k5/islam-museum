label:
  ar: "حركة الطفل ونبات الأسنان وعناية اللثة"
  en: "Early childhood: movement, teething and care of the gums"
  fr: "Petite enfance : mouvement, dentition et soins gingivaux"
  ur: "ابتدائی بچپن: حرکت، دانت نکلنا اور مسوڑھوں کی دیکھ بھال"
  es: "Primera infancia: movimiento, dentición y cuidado de las encías"
  tr: "Bebek hareketi, diş bitkisi ve diş eti bakımı"
  id: "Gerakan bayi, perawatan tanaman gigi, dan gusi"
summary:
  ar: "يذكر ابن سينا أن تدبير الطفل الترطيب والرياضة المعتدلة، وأن لا يحمل على المشي أو القعود قبل انبعاثه إليه بالطبع، وأن يحمى من الأذى، وكيف تعالج لثته عند ظهور الثنايا والأنياب بالدهن والعسل والملح وأصل السوس {cite:canon-ibn-sina-print-v1 pp.210-211}."
  en: "Ibn Sina says the child's management is moistening and ample moderate exercise, that it should not be made to walk or sit before it moves toward it naturally, that it be protected from harm, and how its gums are tended when the front teeth and canines come, with oil, honey, salt and liquorice root {cite:canon-ibn-sina-print-v1 pp.210-211}."
  fr: "Ibn Sina conseille humidification et exercice modéré abondant, sans imposer marche ni position assise avant l’élan naturel, avec protection contre les accidents. Il décrit les soins gingivaux lors des incisives et canines : huile, miel, sel et réglisse {cite:canon-ibn-sina-print-v1 pp.210-211}."
  es: "Ibn Sina dice que el manejo del niño consiste en humedecerlo y proporcionarle abundante ejercicio moderado, que no se le debe obligar a caminar o sentarse antes de que lo haga de forma natural, que debe protegerse de cualquier daño y cómo se deben cuidar sus encías cuando salen los dientes frontales y los caninos, con aceite, miel, sal y raíz de regaliz {cite:canon-ibn-sina-print-v1 pp.210-211}."
  ur: "ابن سینا کا کہنا ہے کہ بچے کا انتظام نمی بخش اور کافی اعتدال پسند ورزش ہے، اسے قدرتی طور پر اس کی طرف بڑھنے سے پہلے چلنے یا بیٹھنے پر مجبور نہیں کیا جانا چاہئے، تاکہ اسے نقصان سے محفوظ رکھا جائے، اور جب سامنے کے دانت اور کینائنز آتے ہیں تو اس کے مسوڑھوں کی دیکھ بھال کیسے کی جاتی ہے، اس میں تیل، شہد، نمک اور شراب کی جڑیں شامل ہیں۔"
  tr: "İbn Sina, çocuğun yönetiminin nemlendirici ve ölçülü egzersiz olması gerektiğini, doğal olarak diriltilmeden önce yürümeye veya oturmaya zorlanmaması gerektiğini ve zarardan korunması gerektiğini belirtir. Ayrıca, diş etlerinin kıvrımları ve dişleri ortaya çıktığında yağ, bal, tuz ve böcek kökü ile nasıl tedavi edileceğini de belirtmiştir {cite:canon-ibn-sina-print-v1 s.210-211}."
  id: "Ibn Sina menyebutkan bahwa pengelolaan anak harus melembapkan dan berolahraga sedang, dan bahwa ia tidak boleh dipaksa berjalan atau duduk sebelum dibangkitkan secara alami, serta harus dilindungi dari bahaya. Ia juga menyebutkan cara merawat gusi ketika lipatan dan taring muncul dengan minyak, madu, garam, dan akar kumbang {cite:canon-ibn-sina-print-v1 hlm.210-211}."
