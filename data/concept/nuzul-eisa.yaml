id: concept/nuzul-eisa
class: concept
kind: doctrine
label:
  ar: نزول عيسى
  en: The Descent of Jesus
  ur: عیسیٰ کی نزول
  es: "El descenso de Jesús"
  fr: "La descente de Jésus"
  tr: "İsa'nın İnişi"
  id: "Turunnya Yesus"
summary:
  ar: "نزول عيسى بن مريم في آخر الزمان من علامات الساعة الكبرى: ينزل على الصفا، فيكسر الصليب ويقتل الخنزير، ويقتل الدجال، ويحكم بين الناس بالعدل، ويصلي خلف المهدي أو يأتم به."
  en: "The descent of Jesus son of Mary in the last days is a major sign: he descends near the white minaret on the east side of Damascus, breaks the cross, kills the pig, kills the Dajjal, judges by justice, and leads or follows the Mahdi in prayer."
  ur: "آخری زمانے میں عیسیٰ ابن مریم کی نزول بڑی نشانیوں میں سے ہے: وہ دمشق کے مشرقی حصے میں واقع سفید مینار کے پاس نازل ہوتے ہیں، صلیب توڑتے ہیں، سور مار دیتے ہیں، دجال کو قتل کرتے ہیں، لوگوں کو عدل سے فیصلہ کرتے ہیں، اور مہدی کی پیچھے یا امامتے میں نماز پڑھتے ہیں۔"
  es: "El descenso de Jesús, hijo de María, en los últimos días es una señal importante: desciende cerca del minarete blanco en el lado este de Damasco, rompe la cruz, mata al cerdo, mata al Dajjal, juzga con justicia y guía o sigue al Mahdi en la oración."
  fr: "La descente de Jésus, fils de Marie, dans les derniers jours est un signe majeur: il descend près du minaret blanc, à l’est de Damas, brise la croix, tue le porc, tue le Dajjal, juge avec justice et conduit ou suit le Mahdi dans la prière."
  tr: "Meryem'in oğlu İsa'nın zamanın kıyameti Saat'in en önemli işaretlerinden biridir: Safa'ya iner, çarmıha iner, domuzu öldürür, Decal'ı öldürür, insanlar arasında adaletle yargılar ve Mehdi'nin arkasında dua eder ya da onu takip eder."
  id: "Turunnya Yesus putra Maria di akhir zaman adalah salah satu tanda utama Jam: Dia akan turun ke Safa, mematahkan salib, membunuh babi, membunuh Dajjal, menghakimi di antara umat dengan keadilan, dan berdoa di belakang Mahdi atau mengikutinya."
