label:
  ar: نزول عيسى
  en: The Descent of Jesus
  ur: عیسیٰ کی نزول
summary:
  ar: "نزول عيسى بن مريم في آخر الزمان من علامات الساعة الكبرى: ينزل على الصفا، فيكسر الصليب ويقتل الخنزير، ويقتل الدجال، ويحكم بين الناس بالعدل، ويصلي خلف المهدي أو يأتم به."
  en: "The descent of Jesus son of Mary in the last days is a major sign: he descends near the white minaret on the east side of Damascus, breaks the cross, kills the pig, kills the Dajjal, judges by justice, and leads or follows the Mahdi in prayer."
  ur: "آخری زمانے میں عیسیٰ ابن مریم کی نزول بڑی نشانیوں میں سے ہے: وہ دمشق کے مشرقی حصے میں واقع سفید مینار کے پاس نازل ہوتے ہیں، صلیب توڑتے ہیں، سور مار دیتے ہیں، دجال کو قتل کرتے ہیں، لوگوں کو عدل سے فیصلہ کرتے ہیں، اور مہدی کی پیچھے یا امامتے میں نماز پڑھتے ہیں۔"
