summary:
  ar: "يذكر النص أن إخرخس عمل على أن زمان السنة عدد من الأيام الكاملة وربع يوم تقريباً، والعدد مشوش، وأن بطليموس استدرك عليه في زهاء ثلاثمائة سنة قريباً من يوم، وأن البتاني رصد بعد بطليموس، فوجد زمان السنة عدداً من الأيام وأقل من ربع يوم بأجزاء من ثلاثمائة وستين، والعدد مشوش، واستدرك على بطليموس في زهاء سبعمائة وخمسين سنة. {cite:zij-sabi-nallino-byblion p.195}"
  en: "The text says Hipparchus worked on a year of whole days and a quarter, the day count being garbled in the scan, that Ptolemy made a correction of about one day in roughly three hundred years, and that al-Battani observed after Ptolemy and found the year to be a number of whole days and somewhat less than a quarter, the count being garbled, correcting Ptolemy over about seven hundred and fifty years. The exact figures are partly disturbed in the scan. {cite:zij-sabi-nallino-byblion p.195}"
  ur: "متن کہتا ہے کہ ہپرخس نے سال کو پورے دنوں اور ایک چوتھائی پر رکھا، دنوں کا عدد اسکین میں بگڑا ہوا ہے، بطلیموس نے تقریباً تین سو سال میں ایک دن کی تصحیح کی، اور البتانی نے بطلیموس کے بعد رصد کر کے سال کو پورے دنوں اور چوتھائی سے کچھ کم پایا، عدد بگڑا ہوا ہے، اور تقریباً سات سو پچاس سال میں بطلیموس پر تصحیح کی۔ صحیح اعداد اسکین میں کچھ بگڑے ہوئے ہیں۔ {cite:zij-sabi-nallino-byblion p.195}"
