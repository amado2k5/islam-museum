label: { ar: "طول السنة عند إخرخس وبطليموس والبتاني", en: "The length of the year for Hipparchus, Ptolemy and al-Battani", ur: "ہپرخس، بطلیموس اور البتانی کے نزدیک سال کی لمبائی", es: "La duración del año para Hiparco, Ptolomeo y al-Battani", fr: "La durée de l'année selon Hipparque, Ptolémée et al-Battani", tr: "Xerxes, Ptolemy ve Albatross'a göre yılın uzunluğu", id: "Panjang tahun menurut Xerxes, Ptolemy, dan Albatross" }
summary:
  ar: "يذكر النص أن إخرخس عمل على أن زمان السنة عدد من الأيام الكاملة وربع يوم تقريباً، والعدد مشوش، وأن بطليموس استدرك عليه في زهاء ثلاثمائة سنة قريباً من يوم، وأن البتاني رصد بعد بطليموس، فوجد زمان السنة عدداً من الأيام وأقل من ربع يوم بأجزاء من ثلاثمائة وستين، والعدد مشوش، واستدرك على بطليموس في زهاء سبعمائة وخمسين سنة. {cite:zij-sabi-nallino-byblion p.195}"
  en: "The text says Hipparchus worked on a year of whole days and a quarter, the day count being garbled in the scan, that Ptolemy made a correction of about one day in roughly three hundred years, and that al-Battani observed after Ptolemy and found the year to be a number of whole days and somewhat less than a quarter, the count being garbled, correcting Ptolemy over about seven hundred and fifty years. The exact figures are partly disturbed in the scan. {cite:zij-sabi-nallino-byblion p.195}"
  ur: "متن کہتا ہے کہ ہپرخس نے سال کو پورے دنوں اور ایک چوتھائی پر رکھا، دنوں کا عدد اسکین میں بگڑا ہوا ہے، بطلیموس نے تقریباً تین سو سال میں ایک دن کی تصحیح کی، اور البتانی نے بطلیموس کے بعد رصد کر کے سال کو پورے دنوں اور چوتھائی سے کچھ کم پایا، عدد بگڑا ہوا ہے، اور تقریباً سات سو پچاس سال میں بطلیموس پر تصحیح کی۔ صحیح اعداد اسکین میں کچھ بگڑے ہوئے ہیں۔ {cite:zij-sabi-nallino-byblion p.195}"
  es: "El texto indica que Hiparco trabajó con un año de días completos y un cuarto, aunque el conteo de días aparece distorsionado en el escaneo; que Ptolomeo corrigió aproximadamente un día cada trescientos años; y que al-Battani, tras observar a Ptolomeo, determinó que el año constaba de varios días completos y algo menos de un cuarto, con el conteo distorsionado, corrigiendo así a Ptolomeo a lo largo de unos setecientos cincuenta años. Las cifras exactas se encuentran parcialmente alteradas en el escaneo. {cite:zij-sabi-nallino-byblion p.195}"
  fr: "Le texte indique qu'Hipparque travaillait sur une année composée de jours entiers et d'un quart (le décompte des jours étant altéré dans la numérisation), que Ptolémée apporta une correction d'environ un jour en l'espace de trois cents ans, et qu'al-Battani, observant après Ptolémée, constata que l'année comptait un certain nombre de jours entiers et un peu moins d'un quart (le décompte étant également altéré), corrigeant ainsi Ptolémée sur une période d'environ sept cent cinquante ans. Les chiffres exacts sont partiellement altérés dans la numérisation. {cite:zij-sabi-nallino-byblion p.195}"
  tr: "Metinde, Exarchus'un bir yılın uzunluğunu yaklaşık olarak tam ve çeyrek gün sayısı olarak hesapladığı, ancak hesaplamanın tutarsız olduğu belirtiliyor. Ayrıca, Ptolemy'nin yaklaşık üç yüz yıl sonra onu düzelterek neredeyse bir gün eklediği ve Ptolemy'den sonra al-Battani'nin bir yılın uzunluğunu üç yüz altmışın kesirleri ile bir günün çeyreğinden daha az bir sayı olarak hesapladığı, ancak hesaplamanın da tutarsız olduğu belirtiliyor. Daha sonra yaklaşık yedi yüz elli yıl sonra Ptolemy'yi düzelttiği ifade ediliyor. {cite:zij-sabi-nallino-byblion s.195}"
  id: "Teks tersebut menyatakan bahwa Exarchus menghitung panjang satu tahun kira-kira sejumlah seperempat hari penuh, meskipun perhitungannya tidak konsisten. Lebih lanjut disebutkan bahwa Ptolemy mengoreksinya setelah sekitar tiga ratus tahun, menambahkan hampir satu hari, dan bahwa al-Battani, setelah Ptolemy, menghitung panjang satu tahun sebagai sejumlah hari dan kurang dari seperempat hari dengan pecahan tiga ratus enam puluh, meskipun perhitungannya juga tidak konsisten. Dia kemudian mengoreksi Ptolemy setelah sekitar tujuh ratus lima puluh tahun. {cite:zij-sabi-nallino-byblion p.195}"
