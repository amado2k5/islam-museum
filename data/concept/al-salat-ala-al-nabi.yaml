id: concept/al-salat-ala-al-nabi
class: concept
kind: belief
label:
  ar: "الصلاة على النبي"
  en: "Invoking blessings on the Prophet (al-salat 'ala al-nabi)"
  fr: "Invocation de bénédictions sur le Prophète (al-salat 'ala al-nabi)"
  ur: "نبی پر درود ⁦(الصلاۃ علی النبی)⁩"
  es: "Invocar bendiciones sobre el Profeta (al-salat 'ala al-nabi)"
  tr: "Peygamber üzerine dualar"
  id: "Doa untuk Nabi"
summary:
  ar: "الدعاء للنبي بالصلاة والسلام والبركة، كما يشرحه أحمد عبد السلام في برنامج «أصلّي عليه»: معنى الصلاة عنده أن يكثر الله الثناء على نبيه عند الملائكة ويكثر رحماته به، ومعنى السلام أن يسلّمه في حياته وبعد موته ويسلّم دينه، ومعنى البركة أن يجعل أعمال الأمة في ميزان حسناته؛ ويعدّها واجبة على من سمع اسمه، ويذكر في فضلها أن الله يصلي على المصلي عشرًا، ويكفيه همه ويغفر ذنبه، وأن أولى الناس بالنبي يوم القيامة أكثرهم عليه صلاة."
  en: "Praying for the Prophet with blessing, peace and grace, as Ahmed Abdussalam explains it in the programme 'Osalli Alayh': for him the blessing means asking God to multiply His praise of His Prophet before the angels and His mercies on him; peace means keeping him safe in his life and after his death and keeping his religion safe; grace means placing the deeds of the community in the scale of his good deeds. He holds it obligatory on whoever hears the Prophet's name, and among its merits names God's tenfold blessing on the one who invokes it once, relief from worry and forgiveness of sins, and nearness to the Prophet on the Day of Resurrection for those who invoke it most."
  fr: "La prière pour le Prophète par la bénédiction, la paix et la grâce, telle que l’explique Ahmed Abdussalam dans le programme 'Osalli Alayh' : pour lui, la bénédiction signifie demander à Dieu de multiplier Son éloge de Son Prophète devant les anges et Ses miséricordes sur lui ; la paix signifie le garder sain et sauf dans sa vie et après sa mort, et garder sauve sa religion ; la grâce signifie placer les œuvres de la communauté dans la balance de ses bonnes actions. Il la tient pour obligatoire pour quiconque entend le nom du Prophète, et cite parmi ses mérites la bénédiction de Dieu, décuplée, sur celui qui l’invoque une fois, la délivrance du souci et le pardon des péchés, et la proximité du Prophète au Jour de la Résurrection pour ceux qui l’invoquent le plus."
  ur: "نبی کے لیے صلاۃ، سلام اور برکت کی دعا، جیسا کہ احمد عبد السلام پروگرام «اُصلّی علیہ» میں بیان کرتے ہیں: ان کے نزدیک صلاۃ کا مطلب یہ ہے کہ اللہ فرشتوں کے سامنے اپنے نبی کی تعریف اور ان پر اپنی رحمتیں بڑھائے؛ سلام کا مطلب یہ کہ انہیں زندگی میں اور وفات کے بعد سلامت رکھے اور ان کے دین کو سلامت رکھے؛ برکت کا مطلب یہ کہ امت کے اعمال ان کی نیکیوں کے پلڑے میں رکھے۔ وہ اسے نام سننے والے پر واجب سمجھتے ہیں، اور اس کی فضیلت میں ایک بار درود پر اللہ کی دس رحمتیں، غم کی کفایت اور گناہوں کی مغفرت، اور قیامت کے دن نبی سے قرب کا ذکر کرتے ہیں۔"
  es: "Orar por el Profeta con bendiciones, paz y gracia, como lo explica Ahmed Abdussalam en el programa 'Osalli Alayh': para él, la bendición significa pedirle a Dios que multiplique sus alabanzas a su Profeta ante los ángeles y sus misericordias sobre él; la paz significa protegerlo en vida y después de su muerte, y preservar su religión; la gracia significa poner las obras de la comunidad en la balanza de sus buenas obras. Considera que es obligatorio para quien oye el nombre del Profeta, y entre sus méritos menciona la bendición divina multiplicada por diez para quien lo invoca una vez, el alivio de las preocupaciones y el perdón de los pecados, y la cercanía al Profeta en el Día de la Resurrección para quienes más lo invocan."
  tr: "Ahmed Abdulsalam'ın \"Asli Aleyh Aleyh\" programında açıkladığı gibi, Peygamber'e bereket ve selamlar dilemek: Onun için duanın anlamı, Allah'ın Peygamberini melekler arasında övgü ve merhametini artırmasıdır. Huzurun anlamı, onu yaşamı boyunca ve ölümünden sonra güvende tutmak ve dinini korumaktır. Bereketin anlamı, ulusun işlerini onun iyi işleri dengesine koymak ve adını duyan kişi için bunları zorunlu kılmaktır. Erdeminde, Allah'ın on kez namaz kılana bereket gönderdiğini, dertlerini giderdiğini, günahlarını bağışladığını ve Kıyamet Günü'nde Peygamber'e en çok layık olanların ona bereket gönderenler olduğunu belirtir."
  id: "Seperti yang dijelaskan oleh Ahmed Abdulsalam dalam program \"Asli Aleyh Aleyh,\" mendoakan berkat dan damai kepada Nabi: Bagi dia, makna shalat adalah meningkatkan pujian dan rahmat Allah kepada Nabi di antara para malaikat. Makna damai adalah menjaga keselamatannya sepanjang hidup dan setelah kematian serta melindungi agamanya. Makna berkat adalah menyeimbangkan urusan bangsa dengan amal baiknya dan menjadikannya wajib bagi orang yang mendengar nama-Nya. Dalam kebajikan, dinyatakan bahwa Allah mengirimkan berkat kepada mereka yang berdoa sepuluh kali, melegakan kesulitan mereka, mengampuni dosa, dan pada Hari Kisah, mereka yang paling layak bagi Nabi adalah mereka yang mengirimkan berkat kepada-Nya."
