id: concept/al-salat-ala-al-nabi
class: concept
kind: belief
label:
  ar: "الصلاة على النبي"
  en: "Invoking blessings on the Prophet (al-salat 'ala al-nabi)"
  ur: "نبی پر درود ⁦(الصلاۃ علی النبی)⁩"
summary:
  ar: "الدعاء للنبي بالصلاة والسلام والبركة، كما يشرحه أحمد عبد السلام في برنامج «أصلّي عليه»: معنى الصلاة عنده أن يكثر الله الثناء على نبيه عند الملائكة ويكثر رحماته به، ومعنى السلام أن يسلّمه في حياته وبعد موته ويسلّم دينه، ومعنى البركة أن يجعل أعمال الأمة في ميزان حسناته؛ ويعدّها واجبة على من سمع اسمه، ويذكر في فضلها أن الله يصلي على المصلي عشرًا، ويكفيه همه ويغفر ذنبه، وأن أولى الناس بالنبي يوم القيامة أكثرهم عليه صلاة."
  en: "Praying for the Prophet with blessing, peace and grace, as Ahmed Abdussalam explains it in the programme 'Osalli Alayh': for him the blessing means asking God to multiply His praise of His Prophet before the angels and His mercies on him; peace means keeping him safe in his life and after his death and keeping his religion safe; grace means placing the deeds of the community in the scale of his good deeds. He holds it obligatory on whoever hears the Prophet's name, and among its merits names God's tenfold blessing on the one who invokes it once, relief from worry and forgiveness of sins, and nearness to the Prophet on the Day of Resurrection for those who invoke it most."
  ur: "نبی کے لیے صلاۃ، سلام اور برکت کی دعا، جیسا کہ احمد عبد السلام پروگرام «اُصلّی علیہ» میں بیان کرتے ہیں: ان کے نزدیک صلاۃ کا مطلب یہ ہے کہ اللہ فرشتوں کے سامنے اپنے نبی کی تعریف اور ان پر اپنی رحمتیں بڑھائے؛ سلام کا مطلب یہ کہ انہیں زندگی میں اور وفات کے بعد سلامت رکھے اور ان کے دین کو سلامت رکھے؛ برکت کا مطلب یہ کہ امت کے اعمال ان کی نیکیوں کے پلڑے میں رکھے۔ وہ اسے نام سننے والے پر واجب سمجھتے ہیں، اور اس کی فضیلت میں ایک بار درود پر اللہ کی دس رحمتیں، غم کی کفایت اور گناہوں کی مغفرت، اور قیامت کے دن نبی سے قرب کا ذکر کرتے ہیں۔"
