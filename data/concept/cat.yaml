summary:
  ar: "قال النبي في الهرة إنها ليست بنجس إنها من الطوافين عليكم والطوافات، وعذّبت امرأة هرّاً حبستها لا هي أطعمتها ولا هي تركتها تأكل من خشاش الأرض."
  en: "The Prophet said of the cat: it is not unclean, it is one of those that go about among you; and a woman was punished for a cat she shut up — she neither fed it nor let it eat of the vermin of the earth."
  ur: "نبی نے بلی کے بارے میں فرمایا: وہ ناپاک نہیں تمہارے گرد پھرنے والوں میں سے ہے؛ اور ایک عورت کو بلی قید کر کے بھوکا رکھنے کی سزا ملی — نہ کھلایا نہ زمین کے کیڑے کھانے چھوڑا۔"
