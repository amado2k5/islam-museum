  ar: "الهرة"
  en: "The cat"
  ur: "بلی"
  es: "El gato"
  fr: "Le chat"
  tr: "Kedi"
  id: "Kucing itu"
summary:
  ar: "قال النبي في الهرة إنها ليست بنجس إنها من الطوافين عليكم والطوافات، وعذّبت امرأة هرّاً حبستها لا هي أطعمتها ولا هي تركتها تأكل من خشاش الأرض."
  en: "The Prophet said of the cat: it is not unclean, it is one of those that go about among you; and a woman was punished for a cat she shut up — she neither fed it nor let it eat of the vermin of the earth."
  ur: "نبی نے بلی کے بارے میں فرمایا: وہ ناپاک نہیں تمہارے گرد پھرنے والوں میں سے ہے؛ اور ایک عورت کو بلی قید کر کے بھوکا رکھنے کی سزا ملی — نہ کھلایا نہ زمین کے کیڑے کھانے چھوڑا۔"
  es: "El Profeta dijo del gato: no es impuro, es uno de los que andan entre vosotros; y una mujer fue castigada por un gato al que encerró: no lo alimentó ni le permitió comer de los parásitos de la tierra."
  fr: "Le Prophète a dit du chat: « Il n’est pas impur, il est l’un de ceux qui vivent parmi vous. » Et une femme fut punie pour avoir enfermé un chat — elle ne le nourrissait pas et ne le laissait pas manger les vermines de la terre."
  tr: "Peygamber, kedi hakkında şöyle demiştir: O kirli değildir; senin üzerinde dolaşanlar ve dolaşanlar arasındadır. Bir kadın, kediyi işkence etti, kedi onu ne besledi ne de yerin kabuğundan yemesine izin verdi."
  id: "Nabi berkata tentang kucing itu bahwa ia tidak najis; ia ada di antara mereka yang mengelilingi Anda dan mereka yang mengelilingi tubuh. Seorang wanita menyiksa kucing yang memenjarakannya, tidak memberinya makan atau mengizinkannya makan dari kerak bumi."
