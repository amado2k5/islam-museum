id: concept/al-laqab-wal-khitab
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-scholars]
label:
  ar: "اللقب والخطاب"
  en: "Laqab and khitab"
  ur: "لقب اور خطاب"
  fr: "Laqab et khitab"
  es: "Laqab y khitab"
  tr: "Unvan ve Unvan"
  id: "Judul dan gelar"
summary:
  ar: "اللقب اسم إضافي يرتبط بصفات الشخص أو مظهره أو إنجازه أو سمعته أو مكانته، منه ما يمدح ومنه ما يصف ومنه ما قد يسوء، وفئة منه تُصنَّف أحياناً خطاباً وهي ألقاب «الدين» و«الدولة» و«الملك»؛ وكثير من هذه الألقاب التشريفية صار أسماء عادية، كما يعرضه ملف بحثي قُدّم إلى المتحف {cite:jstor-schimmel-islamic-names} {cite:wafayat-ayan}."
  en: "The laqab is an additional name tied to a person's qualities, appearance, accomplishments, reputation or status, some complimentary, some descriptive, some unflattering; a class of honorific is sometimes classed apart as khitab, titles ending in al-Din, al-Dawla or al-Mulk, and many of these later became ordinary names, as a research file supplied to the museum sets it out {cite:jstor-schimmel-islamic-names} {cite:wafayat-ayan}."
  ur: "لقب ایک اضافی نام ہے جو کسی شخص کی صفات، ظاہری ہیئت، کارنامے، شہرت یا مرتبے سے وابستہ ہوتا ہے، بعض مدحیہ، بعض وصفی اور بعض ناگوار؛ ان القاب کی ایک قسم کو بعض اوقات الگ سے «خطاب» شمار کیا جاتا ہے، یعنی وہ القاب جو «الدین»، «الدولہ» یا «الملک» پر ختم ہوتے ہیں، اور ان میں سے بہت سے آگے چل کر عام نام بن گئے، جیسا کہ عجائب گھر کو پیش کی گئی ایک تحقیقی فائل بیان کرتی ہے {cite:jstor-schimmel-islamic-names} {cite:wafayat-ayan}۔"
  fr: "Le laqab est un nom supplémentaire lié aux qualités, à l'apparence, aux accomplissements, à la réputation ou au rang d'une personne, certains élogieux, certains descriptifs, certains peu flatteurs ; une catégorie d'honorifiques est parfois classée à part sous le nom de khitab, des titres terminés par al-Din, al-Dawla ou al-Mulk, et beaucoup d'entre eux sont devenus plus tard des prénoms ordinaires, comme l'expose un dossier de recherche remis au musée {cite:jstor-schimmel-islamic-names} {cite:wafayat-ayan}."
  es: "El laqab es un nombre adicional vinculado a las cualidades, el aspecto, los logros, la reputación o el rango de una persona, algunos elogiosos, otros descriptivos, otros poco halagadores; una clase de honorífico se clasifica a veces aparte como khitab, títulos que terminan en al-Din, al-Dawla o al-Mulk, y muchos de ellos se convirtieron después en nombres corrientes, según lo expone un expediente de investigación entregado al museo {cite:jstor-schimmel-islamic-names} {cite:wafayat-ayan}."
  tr: "Unvan, bir kişinin nitelikleri, görünüşü, başarısı, itibarı veya statüsüyle ilişkilendirilen ek bir isimdir; bazıları övülür, bazıları tanımlanır, bazıları eleştirilebilir. Bir kategori bazen söylem olarak sınıflandırılır; örneğin \"din\", \"devlet\" ve \"kral\" gibi unvanlar. Bu onursal unvanların birçoğu, müzeye sunulan bir araştırma dosyasında sergilendiği gibi sıradan isimler haline gelmiştir {cite:jstor-schimmel-islamic-names} {cite:wafayat-ayan}."
  id: "Gelar adalah nama tambahan yang terkait dengan kualitas, penampilan, pencapaian, reputasi, atau status seseorang; beberapa dipuji, beberapa didefinisikan, beberapa dikritik. Sebuah kategori kadang-kadang diklasifikasikan sebagai wacana; misalnya, gelar seperti \"agama,\" \"negara,\" dan \"raja.\" Banyak dari gelar kehormatan ini telah menjadi nama biasa, sebagaimana dipamerkan dalam berkas penelitian yang diserahkan kepada museum {cite:jstor-schimmel-islamic-names} {cite:Wafayat-ayan}."
