id: concept/amrad-al-lisan
class: concept
kind: scientific
label:
  ar: أمراض اللسان وعلاماتها
  en: The tongue's diseases and their signs
  fr: "Les maladies de la langue et leurs signes"
  ur: زبان کے امراض اور ان کی علامات
  es: "Las enfermedades de la lengua y sus síntomas."
summary:
  ar: قد يحدث في اللسان أمراض تحدث آفة في حركته بأن تبطل أو تضعف أو تتغير وفي حسّيه اللامس والذائق وربما بطل أحدهما دون الآخر، وقد يكون المرض سوء مزاج أو آلياً أو مركباً، وربما كانت الآفة لمشاركة الدماغ أو المعدة أو الرئة، ويستدل على أمزجته من لونه الأبيض والأصفر والأحمر والأسود ومن لمسه ومن الطعم الغالب عليه ومن رطوبته ويبوسته على أن اليبوسة تحس على وجهين حقيقية ومع سيلان لزج وهذا مما يغلط فيه الأطباء {cite:canon-ibn-sina-print-v2 p.253} {cite:canon-ibn-sina-print-v2 p.254} {cite:canon-ibn-sina-print-v2 p.255}
  en: 'Diseases may occur in the tongue making a disorder in its movement — abolished, weakened or altered — and in its two senses, touch and taste, one sense sometimes falling without the other; the disease may be a bad temperament, or organic (greatness or smallness, corrupt shape or place, a loosened unit), or compound like the tumours. The disorder may be its own or shared from the brain — then the cheeks and lips mostly share — or the stomach, sometimes the lung and chest. Its temperaments are read from colour (white, yellow, red, black), from touch, from the prevailing taste, and from moisture and dryness — dryness being felt two ways, the true with a clean surface and the false with a viscid flow gathering on it from a catarrh or thick vapours, and in this the physicians err when they take the patient''s report of a dry mouth without telling the two kinds apart {cite:canon-ibn-sina-print-v2 p.253} {cite:canon-ibn-sina-print-v2 p.254} {cite:canon-ibn-sina-print-v2 p.255}'
  fr: "Il peut survenir dans la langue des maladies qui troublent son mouvement — aboli, affaibli ou altéré — et ses deux sens, le toucher et le goût, l’un des sens disparaissant parfois sans l’autre ; la maladie peut être un mauvais tempérament, ou organique (excès de taille ou petitesse, forme ou position corrompue, unité relâchée), ou composée comme les tumeurs. Le trouble peut lui être propre ou venir par participation du cerveau — alors les joues et les lèvres y participent le plus souvent —, ou de l’estomac, parfois du poumon et de la poitrine. Ses tempéraments se lisent à la couleur (blanche, jaune, rouge, noire), au toucher, à la saveur dominante, et à l’humidité et à la sécheresse — la sécheresse se ressentant de deux manières, la vraie avec une surface nette et la fausse avec un flux visqueux qui s’y amasse à partir d’un catarrhe ou de vapeurs épaisses, et en cela les médecins se trompent lorsqu’ils retiennent la déclaration du patient d’une bouche sèche sans distinguer les deux sortes {cite:canon-ibn-sina-print-v2 p.253} {cite:canon-ibn-sina-print-v2 p.254} {cite:canon-ibn-sina-print-v2 p.255}"
  ur: 'زبان میں وہ امراض ہو سکتے ہیں جو اس کی حرکت میں آفہ ڈالیں — باطل، کمزور یا متغیر — اور اس کے دو حواس یعنی لمس اور ذائقہ میں، اور بعض اوقات ایک حاسہ دوسرے کے بغیر باطل ہو جائے؛ مرض سوء مزاج بھی ہو سکتا ہے، آلی بھی ⁦(بڑائی، چھوٹائی، شکل یا مقام کا فساد، کسی اکائی کا انحلال)⁩، اور مرکب بھی جیسے ورم؛ آفہ خود اس کی بھی ہو سکتی ہے اور دماغ کی شراکت سے بھی — تب اکثر گال اور ہونٹ بھی شریک ہوتے ہیں — یا معدہ یا بعض اوقات پھیپھڑا اور سینہ؛ اس کے امزجہ رنگ سے پہچانے جاتے ہیں ⁦(سفید، زرد، سرخ، سیاہ)⁩، لمس سے، غالب ذائقے سے، اور نمی اور خشکی سے — اور خشکی دو طرح محسوس ہوتی ہے: حقیقی صاف سطح کے ساتھ اور دوسری چپچپے بہتے لعاب کے ساتھ جو نزلے یا گاڑھے بھاپ سے جمع ہوتا ہے، اور اسی میں معالج غلطی کرتے ہیں جب مریض کی منہ کے خشک ہونے کی خبر سنتے ہیں اور دونوں ضربوں میں فرق نہیں کرتے {cite:canon-ibn-sina-print-v2 p.253} {cite:canon-ibn-sina-print-v2 p.254} {cite:canon-ibn-sina-print-v2 p.255}'
  es: "Pueden aparecer enfermedades en la lengua, provocando trastornos en su movimiento (abolición, debilitamiento o alteración) y en sus dos sentidos, el tacto y el gusto, a veces perdiendo uno sin el otro. La enfermedad puede ser de origen genético, orgánico (grandeza o pequeñez, forma o lugar deformados, desajuste) o compuesto, como los tumores. El trastorno puede ser propio de la lengua o compartido con el cerebro (en cuyo caso afecta principalmente a las mejillas y los labios), o con el estómago, y a veces con los pulmones y el pecho. Sus temperamentos se leen por el color (blanco, amarillo, rojo, negro), por el tacto, por el sabor predominante y por la humedad y la sequedad; la sequedad se percibe de dos maneras, la verdadera con una superficie limpia y la falsa con un flujo viscoso que se acumula sobre ella debido a un catarro o vapores espesos, y en esto se equivocan los médicos cuando toman en cuenta el informe del paciente de una boca seca sin distinguir los dos tipos {cite:canon-ibn-sina-print-v2 p.253} {cite:canon-ibn-sina-print-v2 p.254} {cite:canon-ibn-sina-print-v2 p.255}"
