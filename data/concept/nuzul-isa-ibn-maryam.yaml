id: concept/nuzul-isa-ibn-maryam
class: concept
kind: belief
label:
 ar: نزول عيسى ابن مريم
 en: The descent of Isa ibn Maryam
 ur: نزول عیسیٰ ابن مریم
 es: "El linaje de Isa ibn Maryam"
 fr: "La descendance d'Isa ibn Maryam"
 tr: "İsa'nın inişi, Meryem'in oğlu,"
 id: "Turunnya Yesus, putra Maria,"
summary:
 ar: "ينزل عيسى عند المنارة البيضاء شرقي دمشق بين مهرودتين واضعاً كفيه على أجنحة ملكين فيقتل الدجال عند باب لد ويحكم بالعدل حتى يفيض المال {cite:sahih-muslim} {cite:sahih-al-bukhari}."
 en: "Isa ibn Maryam descends at the white minaret east of Damascus between two ochre garments, his hands on two angels' wings, kills the Dajjal at the gate of Ludd, and rules with justice until wealth overflows {cite:sahih-muslim} {cite:sahih-al-bukhari}."
 ur: "عیسیٰ ابن مریم دمشق کے مشرق میں سفید مینار پر دو مہرودہ کپڑوں میں دو فرشتوں کے پروں پر ہاتھ رکھے اترتے ہیں، بابِ لد پر دجال کو قتل کرتے ہیں اور عدل کے ساتھ حکومت کرتے ہیں یہاں تک کہ مال عام ہو جاتا ہے {cite:sahih-muslim} {cite:sahih-al-bukhari}۔"
 es: "Isa ibn Maryam desciende al minarete blanco al este de Damasco entre dos vestiduras ocres, con las manos sobre las alas de dos ángeles, mata al Dajjal en la puerta de Ludd y gobierna con justicia hasta que la riqueza rebosa {cite:sahih-muslim} {cite:sahih-al-bukhari}."
 fr: "Isa ibn Maryam descend au minaret blanc à l'est de Damas, entre deux vêtements ocre, les mains sur les ailes de deux anges, tue le Dajjal à la porte de Ludd et règne avec justice jusqu'à ce que la richesse abonde {cite:sahih-muslim} {cite:sahih-al-bukhari}."
 tr: "İsa, Şam'ın doğusundaki Beyaz Minare'de iki türbe arasında iner, ellerini iki meleğin kanatlarına koyar ve Lidda Kapısı'nda Deccal'i öldürür, servet taşana kadar adaletle hükmeder {atıf:sahih-al-bukhari}."
 id: "Yesus turun di Menara Putih di timur Damaskus di antara dua tempat suci, meletakkan tangannya di sayap dua malaikat, dan Ia membunuh Antikristus di Gerbang Lydda dan memerintah dengan adil hingga kekayaan meluap {cite:sahih-al-bukhari}."
