label:
 ar: نزول عيسى ابن مريم
 en: The descent of Isa ibn Maryam
 ur: نزول عیسیٰ ابن مریم
summary:
 ar: "ينزل عيسى عند المنارة البيضاء شرقي دمشق بين مهرودتين واضعاً كفيه على أجنحة ملكين فيقتل الدجال عند باب لد ويحكم بالعدل حتى يفيض المال {cite:sahih-muslim} {cite:sahih-al-bukhari}."
 en: "Isa ibn Maryam descends at the white minaret east of Damascus between two ochre garments, his hands on two angels' wings, kills the Dajjal at the gate of Ludd, and rules with justice until wealth overflows {cite:sahih-muslim} {cite:sahih-al-bukhari}."
 ur: "عیسیٰ ابن مریم دمشق کے مشرق میں سفید مینار پر دو مہرودہ کپڑوں میں دو فرشتوں کے پروں پر ہاتھ رکھے اترتے ہیں، بابِ لد پر دجال کو قتل کرتے ہیں اور عدل کے ساتھ حکومت کرتے ہیں یہاں تک کہ مال عام ہو جاتا ہے {cite:sahih-muslim} {cite:sahih-al-bukhari}۔"
