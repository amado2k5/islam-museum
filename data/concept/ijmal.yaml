id: concept/ijmal
class: concept
kind: legal
label: { ar: "إجمال", en: "Ambiguity (ijmal)" }
summary:
  ar: "الإجمال في الاصطلاح عند المتكلمين من الأصوليين ما لم تتضح دلالته، وعند الحنفية ما لا يعرف المراد منه إلا ببيان يرجى من جهة المجمِل، فلا يعرف خفاؤه بمجرد التأمل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1700} ويقع الإجمال في الأقوال والأفعال، ومن أمثلته الفعل الذي دار بين السهو والقصر في سلام النبي من ركعتين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1700} وما لحقه البيان خرج من الإجمال بالاتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1700}"
  en: "For the mutakallimun among the usulis, mujmal is what its meaning does not make clear. For the Hanafis it is what cannot be understood without an explanation from the speaker, so that it is not found by reflection alone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1700} Ambiguity can lie in words or deeds; an example of a deed is the Prophet's salam after two rak'as when it was unclear whether he forgot or the prayer was shortened. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1700} Anything explained leaves ambiguity by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1700}"
