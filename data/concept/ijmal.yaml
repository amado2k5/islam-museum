id: concept/ijmal
class: concept
kind: legal
label: { ar: "إجمال", en: "Ambiguity (ijmal)", es: "Ambigüedad (ijmal)", fr: "Ambiguïté (ijmal)", ur: "ابہام ⁦(اجمل)⁩", tr: "Özet", id: "Ringkasan" }
summary:
  ar: "الإجمال في الاصطلاح عند المتكلمين من الأصوليين ما لم تتضح دلالته، وعند الحنفية ما لا يعرف المراد منه إلا ببيان يرجى من جهة المجمِل، فلا يعرف خفاؤه بمجرد التأمل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1700} ويقع الإجمال في الأقوال والأفعال، ومن أمثلته الفعل الذي دار بين السهو والقصر في سلام النبي من ركعتين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1700} وما لحقه البيان خرج من الإجمال بالاتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1700}"
  en: "For the mutakallimun among the usulis, mujmal is what its meaning does not make clear. For the Hanafis it is what cannot be understood without an explanation from the speaker, so that it is not found by reflection alone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1700} Ambiguity can lie in words or deeds; an example of a deed is the Prophet's salam after two rak'as when it was unclear whether he forgot or the prayer was shortened. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1700} Anything explained leaves ambiguity by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1700}"
  es: "Para los mutakallimun entre los usulis, mujmal es aquello cuyo significado no aclara. Para los hanafíes, es aquello que no puede entenderse sin una explicación del hablante, de modo que no se descubre solo por reflexión. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1700} La ambigüedad puede residir en las palabras o en los hechos; un ejemplo de un hecho es el salam del Profeta después de dos rak'as, cuando no estaba claro si lo había olvidado o si la oración se había acortado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1700} Todo lo que se explica deja ambigüedad por acuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1700}"
  fr: "Pour les mutakallimun parmi les usulis, le mujmal est ce que le sens ne rend pas clair. Pour les hanafites, il s'agit de ce qui ne peut être compris sans une explication de celui qui parle, de sorte que cela ne se découvre pas par la seule réflexion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1700} L'ambiguïté peut résider dans les paroles ou les actes; un exemple d'acte est le salam du Prophète après deux rak'as, lorsqu'il n'était pas clair s'il avait oublié ou si la prière avait été abrégée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1700} Toute explication laisse subsister une ambiguïté par consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1700}"
  ur: "متکلمین کے نزدیک اصل میں مزمل وہ ہے جس کے معنی واضح نہیں ہوتے۔ احناف کے نزدیک یہ وہ چیز ہے جو کہنے والے کی وضاحت کے بغیر سمجھ میں نہیں آسکتی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1700} ابہام قول یا عمل میں ہو سکتا ہے۔ ایک عمل کی مثال دو رکعت کے بعد نبی کا سلام ہے جب یہ واضح نہ ہو کہ آیا آپ بھول گئے یا نماز قصر کر دی گئی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1700} جو کچھ بھی بیان کیا گیا ہے وہ معاہدے کے ذریعہ ابہام کو چھوڑ دیتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 1700}"
  tr: "Usul bilginleri arasında terminolojide genelleştirme, anlamı açık olmadıkça ve Hanefiler arasında ne kastedildiği ancak genel açıdan umulan bir açıklamayla bilinir, bu yüzden gizli doğası sadece düşünce ile bilinmez. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.1700} Genelleme sözlerde ve eylemlerde gerçekleşir ve örnek, iki rekat sırasında Peygamber'in selamını kısaltma ile unutkanlık arasında dolaşan fiildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1700} Sonraki açıklama genel görüşle genelleme kapsamı dışındadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1700}"
  id: "Generalisasi dalam istilah di kalangan para sarjana usul kecuali maknanya jelas, dan di kalangan Hanafi, apa yang dimaksud hanya diketahui melalui klarifikasi yang diharapkan dari perspektif umum, sehingga sifat tersembunyinya tidak diketahui hanya setelah direnungkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1700} Generalisasi terjadi dalam kata-kata dan tindakan, dan contohnya adalah kata kerja yang berputar antara lupa dan mempersingkat ucapan Nabi selama dua rak'ah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1700} Penjelasan berikut dikecualikan dari generalisasi oleh konsensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1700}"
