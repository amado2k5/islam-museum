label: { ar: "أهل الأهواء", en: "Ahl al-Ahwa (the people of deviant opinions in Islam, and the rules on their testimony, narration and prayer behind them)", fr: "Ahl al-Ahwa (les gens aux opinions déviantes en islam, et les règles concernant leur témoignage, leur transmission et la prière derrière eux)", es: "Ahl al-Ahwa (las personas con opiniones desviadas en el Islam, y las normas sobre su testimonio, narración y oración que los respaldan)", ur: "اہل الاحوا ⁦(اسلام میں منحرف نظریات کے حامل افراد اور ان کی گواہی، روایت اور ان کے پیچھے نماز کے احکام)⁩" }
summary:
  ar: "أهل الأهواء جمع هوى، وهو ميل النفس إلى خلاف ما يقتضيه الشرع، وهم من المسلمين الذين زاغوا عن الطريقة المثلى كالجبرية والقدرية والمعطلة والمشبهة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3596} وهم يختلفون عن الملاحدة والدهريين، لأنهم من جملة المسلمين يؤمنون بالله وبنبيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3596} ويجب هجر من يجاهر ببدعته ويدعو إليها، ويكون لمن كانت بدعته مكفرة حكم المرتد، وغيرها يعزر فيه الداعي إليها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3597}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3598} وتقبل شهادتهم عند الحنفية والشافعية إلا الخطابية، وترد عند مالك وأحمد، وفي روايتهم خلاف، ومن الفقهاء من منع الرواية عن الداعية منهم، وتصح الصلاة خلفهم عند الحنفية والشافعية مع الكراهة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3598}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3599}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3600}"
  en: "Ahl al-ahwa are those whose opinions deviate: the word hawa is the soul's inclination against what the law requires; they are Muslims who have strayed from the middle path, such as the Jabriyya, the Qadariyya, the Mu'attila and the Mushabbiha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3596} They differ from the atheists and materialists, since they remain Muslims who believe in God and His Prophet. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3596} One must shun whoever openly professes his innovation or calls to it; if the innovation is one that makes a person an unbeliever, he receives the rules of an apostate, and otherwise the caller to it may be punished with discretionary penalties. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3597}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3598} Their testimony is accepted by the Hanafis and Shafi'is except the Khattabiyya, and rejected by Malik and Ahmad, with disputes in the reports. Some jurists forbid narrating from their callers, and the prayer behind them is valid with dislike for the Hanafis and Shafi'is. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3598}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3599}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3600}"
  fr: "Les ahl al-ahwa sont ceux dont les opinions dévient : le mot hawa désigne l’inclination de l’âme à l’encontre de ce qu’exige la Loi ; ce sont des musulmans qui se sont écartés de la voie médiane, comme les Jabriyya, les Qadariyya, les Mu'attila et les Mushabbiha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3596} Ils diffèrent des athées et des matérialistes, puisqu’ils demeurent des musulmans qui croient en Dieu et en Son Prophète. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3596} Il faut se tenir à l’écart de quiconque professe ouvertement son innovation ou y appelle ; si l’innovation est de celles qui rendent une personne non-croyante, celle-ci est soumise aux règles de l’apostat, et, sinon, celui qui y appelle peut être frappé de peines discrétionnaires. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3597}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3598} Leur témoignage est accepté par les hanafites et les chaféites, à l’exception des Khattabiyya, et rejeté par Malik et Ahmad, avec des divergences dans les récits. Certains juristes interdisent de transmettre d’après ceux d’entre eux qui appellent à leur doctrine, et la prière derrière eux est valide avec réprobation pour les hanafites et les chaféites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3598}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3599}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3600}"
  es: "Ahl al-ahwa son aquellos cuyas opiniones se desvían: la palabra hawa es la inclinación del alma contra lo que la ley exige; son musulmanes que se han desviado del camino medio, como los Jabriyya, los Qadariyya, los Mu'attila y los Mushabbiha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3596} Se diferencian de los ateos y materialistas, ya que siguen siendo musulmanes que creen en Dios y en Su Profeta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3596} Se debe evitar a quien profesa abiertamente su innovación o la llama; si la innovación es una que convierte a una persona en incrédula, recibe las reglas de un apóstata, y de lo contrario, el que la llama puede ser castigado con penas discrecionales. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3597}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3598} Su testimonio es aceptado por los Hanafis y Shafi'is excepto los Khattabiyya, y rechazado por Malik y Ahmad, con disputas en los informes. Algunos juristas prohíben narrar a quienes los llaman, y la oración detrás de ellos es válida con disgusto hacia los hanafis y shafi'is. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3598}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3599}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3600}"
  ur: "اہل الاحوہ وہ ہیں جن کی رائے انحراف کرتی ہے: لفظ حوا روح کا اس چیز کے خلاف ہے جس کا قانون تقاضا کرتا ہے۔ یہ وہ مسلمان ہیں جو درمیانی راستے سے بھٹک گئے ہیں، جیسے جبریہ، قدریہ، معتِلّہ اور مشبیحہ۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 3596} وہ ملحدوں اور مادہ پرستوں سے مختلف ہیں، کیونکہ وہ مسلمان ہیں جو خدا اور اس کے رسول پر ایمان رکھتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3596} جو کھلم کھلا اپنی بدعت کا دعویٰ کرتا ہے یا اس کی طرف دعوت دیتا ہے اسے چھوڑ دینا چاہیے۔ اگر بدعت وہ ہے جو کسی شخص کو کافر بناتی ہے تو اسے مرتد کے احکام ملتے ہیں اور دوسری صورت میں اس کی طرف دعوت دینے والے کو صوابدیدی سزا دی جا سکتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3597}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.3598} ان کی گواہی کو حنفیہ اور شافعیہ نے قبول کیا ہے سوائے خطبیہ کے، اور مالک اور احمد نے اختلافی روایتوں کے ساتھ رد کیا ہے۔ بعض فقہاء اپنے داعی سے روایت کرنے سے منع کرتے ہیں اور ان کے پیچھے نماز پڑھنا احناف اور شافعیہ کے نزدیک ناپسندیدہ ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3598}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3599}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3600}"
