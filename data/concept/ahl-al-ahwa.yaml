label: { ar: "أهل الأهواء", en: "Ahl al-Ahwa (the people of deviant opinions in Islam, and the rules on their testimony, narration and prayer behind them)" }
summary:
  ar: "أهل الأهواء جمع هوى، وهو ميل النفس إلى خلاف ما يقتضيه الشرع، وهم من المسلمين الذين زاغوا عن الطريقة المثلى كالجبرية والقدرية والمعطلة والمشبهة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3596} وهم يختلفون عن الملاحدة والدهريين، لأنهم من جملة المسلمين يؤمنون بالله وبنبيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3596} ويجب هجر من يجاهر ببدعته ويدعو إليها، ويكون لمن كانت بدعته مكفرة حكم المرتد، وغيرها يعزر فيه الداعي إليها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3597}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3598} وتقبل شهادتهم عند الحنفية والشافعية إلا الخطابية، وترد عند مالك وأحمد، وفي روايتهم خلاف، ومن الفقهاء من منع الرواية عن الداعية منهم، وتصح الصلاة خلفهم عند الحنفية والشافعية مع الكراهة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3598}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3599}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3600}"
  en: "Ahl al-ahwa are those whose opinions deviate: the word hawa is the soul's inclination against what the law requires; they are Muslims who have strayed from the middle path, such as the Jabriyya, the Qadariyya, the Mu'attila and the Mushabbiha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3596} They differ from the atheists and materialists, since they remain Muslims who believe in God and His Prophet. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3596} One must shun whoever openly professes his innovation or calls to it; if the innovation is one that makes a person an unbeliever, he receives the rules of an apostate, and otherwise the caller to it may be punished with discretionary penalties. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3597}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3598} Their testimony is accepted by the Hanafis and Shafi'is except the Khattabiyya, and rejected by Malik and Ahmad, with disputes in the reports. Some jurists forbid narrating from their callers, and the prayer behind them is valid with dislike for the Hanafis and Shafi'is. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3598}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3599}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3600}"
