summary:
  ar: "القنفذ في الكتاب البري معروف والجبلي هو الدلدل والبحري ضرب من السمك ذي الصدف، وينقل الكتاب أن شحمه وكبده المجففة تمنعان انصباب المواد إلى الأحشاء، وأن لحم البري ينفع من داء الفيل والجذام والسل والاستسقاء والحميات المزمنة ونهش الهوام {cite:canon-ibn-sina-print-v1 p.659}"
  en: "Qunfudh is in the book the land one, known, the mountain one, the dildil, and the sea one, a kind of shelled fish; the book reports that its fat and its dried liver keep matters from pouring to the viscera, and that the flesh of the land one benefits elephantiasis, leprosy, consumption, dropsy, chronic fevers and the bites of vermin {cite:canon-ibn-sina-print-v1 p.659}"
  ur: "قنفذ کتاب میں خشکی کا معروف ہے، پہاڑی وہ دلدل ہے، اور سمندری صدف والی مچھلی کی ایک قسم ہے؛ کتاب نقل کرتی ہے کہ اس کی چربی اور خشک کی ہوئی کلیجی مادوں کو اندرونی اعضاء کی طرف بہنے سے روکتی ہیں، اور خشکی کے قنفذ کا گوشت داء الفیل، جذام، سل، استسقا، پرانے بخاروں اور زہریلے کیڑوں کے کاٹنے میں نافع ہے {cite:canon-ibn-sina-print-v1 p.659}۔"
  es: "En el libro, Qunfudh es conocido como el terrestre, el de montaña, el dildil y el marino, una especie de pez con concha; el libro informa que su grasa y su hígado seco evitan que las sustancias se derramen a las vísceras, y que la carne del terrestre beneficia la elefantiasis, la lepra, la tuberculosis, la hidropesía, las fiebres crónicas y las picaduras de parásitos {cite:canon-ibn-sina-print-v1 p.659}"
  fr: "Le Qunfudh est mentionné dans le livre comme étant le poisson terrestre, connu sous le nom de poisson de montagne, poisson de mer et poisson de mer; il s’agit d’une sorte de poisson à coquille. Le livre rapporte que sa graisse et son foie séché empêchent les matières de s’écouler dans les viscères, et que la chair du poisson terrestre est bénéfique en cas d’éléphantiasis, de lèpre, de tuberculose, d’hydropisie, de fièvres chroniques et de piqûres de vermine. {cite:canon-ibn-sina-print-v1 p.659}"
  tr: "Kitapta 'Vahşi Kirpi' iyi bilinirken, 'al-Jabal' 'marl' ve 'Denizcisi' kabuklu bir balık türüdür.' Kitap, yağ ve kurumuş karaciğerinin bağırsaklara madde salınımını engellediğini, yabani etin filler, cüzzam, tüberküloz, asit, kronik ateş ve zararlıların avlanmasına karşı faydalı olduğunu belirtir {cite:canon-ibn-sina-print-v1 s.659}"
  id: "Dalam buku 'The Wild Hedgehog' dikenal luas, dan 'al-Jabal' berarti 'marl', dan 'Marine adalah jenis ikan dengan cangkang.' Buku tersebut menyatakan bahwa lemak dan hati keringnya mencegah pelepasan zat ke usus, dan bahwa daging liar bermanfaat melawan gajah, kusta, tuberkulosis, ascites, demam kronis, dan predator hama {cite:canon-ibn-sina-print-v1 hlm.659}"
