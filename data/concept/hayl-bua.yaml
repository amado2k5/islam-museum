  ar: "هيل بوّا هو خير بوّا، وهو ألطف من القاقلة، يقوّي الكبد والمعدة الباردتين ويهضم الطعام جداً. {cite:canon-ibn-sina-print-v1 p.448}"
  en: "Hayl bua is the good kind of bua, finer than qaqulla; it strengthens the cold liver and stomach and aids digestion greatly. {cite:canon-ibn-sina-print-v1 p.448}"
  ur: "ہیل بوا بوا کی بہتر قسم ہے، قاقلہ سے زیادہ لطیف؛ یہ ٹھنڈے جگر اور معدے کو تقویت دیتا ہے اور ہضم میں بہت مدد کرتا ہے۔ {cite:canon-ibn-sina-print-v1 p.448}"
  es: "Hayl bua es la buena variedad de bua, más fina que qaqulla; fortalece el hígado y el estómago fríos y facilita enormemente la digestión. {cite:canon-ibn-sina-print-v1 p.448}"
  fr: "Le hayl bua est une bonne variété de bua, plus fine que le qaqulla; il fortifie le foie et l’estomac froids et facilite grandement la digestion. {cite:canon-ibn-sina-print-v1 p.448}"
