id: concept/al-hadith-al-shadhdh
class: concept
kind: term
label: { ar: "الحديث الشاذ", en: "The irregular report (shadhdh)", fr: "Le hadith irrégulier (shadhdh)", ur: "شاذ حدیث", es: "El informe irregular (shadhdh)" }
term: { ar: "المحفوظ والشاذ", en: "al-mahfuz and al-shadhdh" }
summary:
  ar: "الشاذ عند ابن حجر ما رواه المقبول مخالفاً لمن هو أولى منه، ومقابله الراجح هو المحفوظ؛ ويمثّل له بحديث عوسجة عن ابن عباس الذي وصله ابن عيينة وأرسله حماد بن زيد، فقال أبو حاتم: المحفوظ حديث ابن عيينة {cite:nuzhat-al-nazar-itr-bushra-2011 p. 66-67}. الشاذ عند الشافعي أن يروي الثقة حديثاً يخالف ما روى الناس، لا أن يروي ما لا يروي غيره؛ وعند الخليلي ما ليس له إلا إسناد واحد يشذ به شيخ ثقة أو غير ثقة؛ وعند الحاكم ما تفرد به ثقة وليس له أصل بمتابع. ويرى ابن الصلاح أن قول الشافعي لا إشكال فيه، وأن التعريفين الآخرين يشكل عليهما ما ينفرد به العدل الحافظ كحديث «إنما الأعمال بالنيات»، فيفصّل: الشاذ المردود قسمان: الفرد المخالف، والفرد الذي ليس في راويه من الثقة والضبط ما يجبر تفرده {cite:muqaddima-ibn-salah-itr p. 76-80}."
  en: "For Ibn Hajar the irregular report (shadhdh) is what an acceptable narrator transmits in contradiction of someone more worthy, and its stronger counterpart is the preserved (mahfuz); his example is the hadith of 'Awsaja from Ibn 'Abbas, which Ibn 'Uyayna transmitted with a connected chain and Hammad ibn Zayd without Ibn 'Abbas, on which Abu Hatim said the preserved version is Ibn 'Uyayna's {cite:nuzhat-al-nazar-itr-bushra-2011 p. 66-67}. For al-Shafi'i a shadhdh report is not one in which a trustworthy narrator relates what no one else does, but one in which a trustworthy narrator contradicts what others relate; for al-Khalili it is one with only a single chain, whether its sole transmitter is trustworthy or not; for al-Hakim it is one a trustworthy narrator transmits alone with no corroboration. Ibn al-Salah accepts al-Shafi'i's definition and finds the other two problematic in face of solitary reports from reliable hafizes such as 'actions are only by intentions'; he concludes that the rejected shadhdh is of two kinds: the solitary report that contradicts, and the solitary report whose narrator lacks the reliability to carry it."
  fr: "Pour Ibn Hajar, le récit irrégulier (shadhdh) est celui qu’un transmetteur recevable rapporte en contredisant un transmetteur qui fait davantage autorité ; la version la plus solide est dite préservée (mahfuz). Il donne l’exemple du hadith de Awsaja d’après Ibn Abbas, transmis par Ibn Uyayna avec une chaîne continue et par Hammad ibn Zayd sans Ibn Abbas. Pour Abu Hatim, la version préservée est celle d’Ibn Uyayna {cite:nuzhat-al-nazar-itr-bushra-2011 p. 66-67}. Pour al-Shafi’i, le shadhdh n’est pas ce qu’un transmetteur fiable rapporte seul, mais ce qu’il rapporte en contradiction avec d’autres. Pour al-Khalili, il s’agit d’un récit à chaîne unique, que son seul transmetteur soit fiable ou non ; pour al-Hakim, de ce qu’un transmetteur fiable rapporte seul et sans corroboration. Ibn al-Salah retient la définition d’al-Shafi’i et voit une difficulté dans les deux autres face aux récits singuliers de maîtres fiables, comme celui des actes qui ne valent que par les intentions. Il conclut que le shadhdh rejeté est de deux sortes : le récit singulier qui contredit et le récit singulier dont le transmetteur n’est pas assez fiable pour le porter seul."
  ur: "ابن حجر کے نزدیک شاذ وہ ہے جسے مقبول راوی اپنے سے بہتر راوی کی مخالفت میں روایت کرے، اور اس کا راجح مقابل محفوظ ہے؛ وہ مثال میں عوسجہ عن ابن عباس کی حدیث دیتے ہیں جسے ابن عیینہ نے متصل اور حماد بن زید نے ابن عباس کے بغیر روایت کیا، جس پر ابو حاتم نے کہا: محفوظ ابن عیینہ کی حدیث ہے {cite:nuzhat-al-nazar-itr-bushra-2011 p. 66-67}۔"
  es: "Para Ibn Hajar, el informe irregular (shadhdh) es lo que un narrador aceptable transmite en contradicción con alguien más digno, y su contraparte más fuerte es el preservado (mahfuz); su ejemplo es el hadiz de 'Awsaja de Ibn 'Abbas, que Ibn 'Uyayna transmitió con una cadena conectada y Hammad ibn Zayd sin Ibn 'Abbas, sobre el cual Abu Hatim dijo que la versión preservada es la de Ibn 'Uyayna {cite:nuzhat-al-nazar-itr-bushra-2011 p. 66-67}. Para al-Shafi'i, un informe shadhdh no es aquel en el que un narrador confiable relata lo que nadie más relata, sino aquel en el que un narrador confiable contradice lo que otros relata; para al-Khalili es aquel con una sola cadena, sea o no confiable su único transmisor; para al-Hakim es aquel que un narrador confiable transmite solo sin corroboración. Ibn al-Salah acepta la definición de al-Shafi'i y encuentra problemáticas las otras dos frente a informes aislados de hafizes confiables como \"las acciones son solo por intenciones\"; concluye que el shadhdh rechazado es de dos tipos: el informe aislado que contradice y el informe aislado cuyo narrador carece de la confiabilidad para transmitirlo."
