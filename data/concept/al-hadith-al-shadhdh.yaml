id: concept/al-hadith-al-shadhdh
class: concept
kind: term
label: { ar: "الحديث الشاذ", en: "The irregular report (shadhdh)", ur: "شاذ حدیث" }
term: { ar: "المحفوظ والشاذ", en: "al-mahfuz and al-shadhdh" }
summary:
  ar: "الشاذ عند ابن حجر ما رواه المقبول مخالفاً لمن هو أولى منه، ومقابله الراجح هو المحفوظ؛ ويمثّل له بحديث عوسجة عن ابن عباس الذي وصله ابن عيينة وأرسله حماد بن زيد، فقال أبو حاتم: المحفوظ حديث ابن عيينة {cite:nuzhat-al-nazar-itr-bushra-2011 p. 66-67}. الشاذ عند الشافعي أن يروي الثقة حديثاً يخالف ما روى الناس، لا أن يروي ما لا يروي غيره؛ وعند الخليلي ما ليس له إلا إسناد واحد يشذ به شيخ ثقة أو غير ثقة؛ وعند الحاكم ما تفرد به ثقة وليس له أصل بمتابع. ويرى ابن الصلاح أن قول الشافعي لا إشكال فيه، وأن التعريفين الآخرين يشكل عليهما ما ينفرد به العدل الحافظ كحديث «إنما الأعمال بالنيات»، فيفصّل: الشاذ المردود قسمان: الفرد المخالف، والفرد الذي ليس في راويه من الثقة والضبط ما يجبر تفرده {cite:muqaddima-ibn-salah-itr p. 76-80}."
  en: "For Ibn Hajar the irregular report (shadhdh) is what an acceptable narrator transmits in contradiction of someone more worthy, and its stronger counterpart is the preserved (mahfuz); his example is the hadith of 'Awsaja from Ibn 'Abbas, which Ibn 'Uyayna transmitted with a connected chain and Hammad ibn Zayd without Ibn 'Abbas, on which Abu Hatim said the preserved version is Ibn 'Uyayna's {cite:nuzhat-al-nazar-itr-bushra-2011 p. 66-67}. For al-Shafi'i a shadhdh report is not one in which a trustworthy narrator relates what no one else does, but one in which a trustworthy narrator contradicts what others relate; for al-Khalili it is one with only a single chain, whether its sole transmitter is trustworthy or not; for al-Hakim it is one a trustworthy narrator transmits alone with no corroboration. Ibn al-Salah accepts al-Shafi'i's definition and finds the other two problematic in face of solitary reports from reliable hafizes such as 'actions are only by intentions'; he concludes that the rejected shadhdh is of two kinds: the solitary report that contradicts, and the solitary report whose narrator lacks the reliability to carry it."
  ur: "ابن حجر کے نزدیک شاذ وہ ہے جسے مقبول راوی اپنے سے بہتر راوی کی مخالفت میں روایت کرے، اور اس کا راجح مقابل محفوظ ہے؛ وہ مثال میں عوسجہ عن ابن عباس کی حدیث دیتے ہیں جسے ابن عیینہ نے متصل اور حماد بن زید نے ابن عباس کے بغیر روایت کیا، جس پر ابو حاتم نے کہا: محفوظ ابن عیینہ کی حدیث ہے {cite:nuzhat-al-nazar-itr-bushra-2011 p. 66-67}۔"
