id: concept/al-hadith-al-shadhdh
class: concept
kind: term
label: { ar: "الحديث الشاذ", en: "The irregular report (shadhdh)", ur: "شاذ حدیث" }
term: { ar: "المحفوظ والشاذ", en: "al-mahfuz and al-shadhdh" }
summary:
  ar: "الشاذ عند ابن حجر ما رواه المقبول مخالفاً لمن هو أولى منه، ومقابله الراجح هو المحفوظ؛ ويمثّل له بحديث عوسجة عن ابن عباس الذي وصله ابن عيينة وأرسله حماد بن زيد، فقال أبو حاتم: المحفوظ حديث ابن عيينة {cite:nuzhat-al-nazar-itr-bushra-2011 p. 66-67}."
  en: "For Ibn Hajar the irregular report (shadhdh) is what an acceptable narrator transmits in contradiction of someone more worthy, and its stronger counterpart is the preserved (mahfuz); his example is the hadith of 'Awsaja from Ibn 'Abbas, which Ibn 'Uyayna transmitted with a connected chain and Hammad ibn Zayd without Ibn 'Abbas, on which Abu Hatim said the preserved version is Ibn 'Uyayna's {cite:nuzhat-al-nazar-itr-bushra-2011 p. 66-67}."
  ur: "ابن حجر کے نزدیک شاذ وہ ہے جسے مقبول راوی اپنے سے بہتر راوی کی مخالفت میں روایت کرے، اور اس کا راجح مقابل محفوظ ہے؛ وہ مثال میں عوسجہ عن ابن عباس کی حدیث دیتے ہیں جسے ابن عیینہ نے متصل اور حماد بن زید نے ابن عباس کے بغیر روایت کیا، جس پر ابو حاتم نے کہا: محفوظ ابن عیینہ کی حدیث ہے {cite:nuzhat-al-nazar-itr-bushra-2011 p. 66-67}۔"
