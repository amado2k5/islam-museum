label: { ar: "تعديلات الكواكب عن بطليموس مع استدراكات البتاني", en: "The planetary equations kept from Ptolemy, with al-Battani's corrections", ur: "بطلیموس سے سیاروں کے تعدیلات اور البتانی کی استدراکات", es: "Las ecuaciones planetarias conservadas de Ptolomeo, con las correcciones de al-Battani.", fr: "Les équations planétaires conservées de Ptolémée, avec les corrections d'al-Battani", tr: "Batlamyus'un gezegensel modifikasyonları ve el-Battani'nin düzeltmeleri", id: "Modifikasi planetarium dari Ptolemy dengan koreksi al-Battani" }
summary:
  ar: "يأخذ البتاني تعديلات الكواكب من كتاب بطليموس، ويستدرك في أبعاد المشتري ما وجده بالقمر في أوقات الرصد، ويُبقي تعديلات الكواكب كما وردت، ويجعل مواضع أبعادها مثلها. {cite:zij-sabi-nallino-byblion p.99}."
  en: "Al-Battani takes the planets' equations from Ptolemy's book and corrects the apsides of Jupiter by what he found through the Moon at the observed times; the other planets' equations and their apsides he keeps as Ptolemy gives them. {cite:zij-sabi-nallino-byblion p.99}."
  ur: "البتانی سیاروں کے تعدیلات بطلیموس کی کتاب سے لیتے ہیں، اور مشتری کے ابعاد میں وہ تصحیح کرتے ہیں جو انہیں رصد کے اوقات میں چاند کے ذریعے ملی؛ باقی سیاروں کے تعدیلات اور ان کے ابعاد وہی رکھتے ہیں جو بطلیموس دیتا ہے۔ {cite:zij-sabi-nallino-byblion p.99}۔"
  es: "Al-Battani toma las ecuaciones de los planetas del libro de Ptolomeo y corrige los ápsides de Júpiter con base en lo que halló a través de la Luna en los momentos observados; las ecuaciones de los demás planetas y sus ápsides las mantiene tal como las proporciona Ptolomeo. {cite:zij-sabi-nallino-byblion p.99}."
  fr: "Al-Battani reprend les équations des planètes de l'ouvrage de Ptolémée et corrige les apsides de Jupiter en fonction des observations lunaires réalisées; il conserve les équations et les apsides des autres planètes telles que données par Ptolémée. {cite:zij-sabi-nallino-byblion p.99}."
  tr: "Al-Battani, gezegenlerin konum ayarlamalarını Batlamyus'un kitabından alıyor ve gözlemler sırasında Ay'da bulduğu verileri Jüpiter'in mesafelerine ekliyor; gezegenlerin konum ayarlamalarını olduğu gibi koruyarak, konumlarını ve mesafelerini aynı tutuyor. {cite:zij-sabi-nallino-byblion s.99}."
  id: "Al-Battani mengambil penyesuaian planet dari buku Ptolemy, dan menambahkan jarak Jupiter dengan apa yang ia temukan di Bulan selama pengamatan, sambil mempertahankan penyesuaian planet seperti yang diberikan, dan membuat posisi dan jaraknya sama. {cite:zij-sabi-nallino-byblion p.99}."
