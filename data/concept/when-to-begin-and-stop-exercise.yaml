summary:
  ar: "يفتتح ابن سينا الفصل الثالث في وقت ابتداء الرياضة وقطعها بأن يكون البدن نقياً من الكيموسات الخامة وقد انهضم الطعام وحضر وقت غذاء آخر، ويدل على ذلك نضج البول بالقوام واللون، ويرى أن يرتاض ممتلئاً أخف ضرراً من أن يرتاض خاوياً {cite:canon-ibn-sina-print-v1 p.224}."
  en: "Ibn Sina opens chapter 3, on when to begin and stop exercise, by requiring a body clear of raw chymes, the evening meal digested and the time of another meal come, which the maturity of the urine in consistency and colour shows; he judges exercising full less harmful than exercising empty {cite:canon-ibn-sina-print-v1 p.224}."
