label: { ar: "وقت ابتداء الرياضة وقطعها عند ابن سينا", en: "When to begin and when to stop exercise in the Canon", ur: "قانون میں ورزش شروع اور ختم کرنے کا وقت", es: "Cuándo empezar y cuándo terminar el ejercicio en el Canon", fr: "Quand commencer et quand arrêter l'exercice dans le Canon" }
summary:
  ar: "يفتتح ابن سينا الفصل الثالث في وقت ابتداء الرياضة وقطعها بأن يكون البدن نقياً من الكيموسات الخامة وقد انهضم الطعام وحضر وقت غذاء آخر، ويدل على ذلك نضج البول بالقوام واللون، ويرى أن يرتاض ممتلئاً أخف ضرراً من أن يرتاض خاوياً {cite:canon-ibn-sina-print-v1 p.224}."
  en: "Ibn Sina opens chapter 3, on when to begin and stop exercise, by requiring a body clear of raw chymes, the evening meal digested and the time of another meal come, which the maturity of the urine in consistency and colour shows; he judges exercising full less harmful than exercising empty {cite:canon-ibn-sina-print-v1 p.224}."
  es: "Ibn Sina abre el capítulo 3, sobre cuándo comenzar y terminar el ejercicio, exigiendo que el cuerpo esté libre de quimo crudo, que la cena se haya digerido y que haya llegado la hora de otra comida, lo cual se evidencia por la madurez de la orina en consistencia y color; considera que hacer ejercicio con el estómago lleno es menos perjudicial que hacer ejercicio con el estómago vacío {cite:canon-ibn-sina-print-v1 p.224}."
  fr: "Ibn Sina ouvre le chapitre 3, sur le moment de commencer et d'arrêter l'exercice, en exigeant un corps débarrassé de tout chyme cru, le repas du soir digéré et l'heure d'un autre repas arrivée, ce que la maturité de l'urine en consistance et en couleur montre; il juge que l'exercice complet est moins nocif que l'exercice à jeun {cite:canon-ibn-sina-print-v1 p.224}."
