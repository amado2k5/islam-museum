id: concept/hawa-fiqh
class: concept
kind: ethical
label: { ar: "هَوَى", en: "Hawa (desire, and the duty to resist it)" }
summary:
  ar: "الهوى في الاصطلاح ميلان النفس إلى ما تستلذ به من الشهوات من غير داعية الشرع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16565} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16566} ويفترق عن الشهوة بأن الهوى يختص بالآراء والاعتقادات، والشهوة بنيل المستلذات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16566} والهوى إذا وافق الشرع فهو محمود، وإذا خالفه فهو مذموم، وقد نهى الشرع عن اتباعه المذموم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16566} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16567} وقسّم الفقهاء صاحب الهوى إلى من يجب تكفيره ومن لا يجب تكفيره، واختلفوا في قبول شهادة الأول وروايته، وذهب الجمهور إلى قبول شهادة الفاسق المتأول إلا الخطابية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16569} وقال الغزالي إن القلوب ثلاثة أنواع في الثبات على الخير والشر، وإن مخالفة النفس عن هواها مما عدّه العلماء أعظم الجهاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16569} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16570} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16571} وسبب اتباع الهوى قوة سلطانه، واستثقال الفكر في تمييز المشتبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16570}"
  en: "Hawa in the technical sense is the inclination of the soul towards pleasures it relishes, without the call of the law. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16565} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16566} It differs from shahwa (appetite) in that hawa concerns opinions and beliefs, while shahwa concerns obtaining pleasurable things. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16566} Hawa that agrees with the law is praised, and that which opposes it is blamed; the law forbids following the blamed kind. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16566} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16567} The jurists divide the followers of hawa into those whose unbelief is to be declared and those who are not; they differ on the acceptance of the testimony of the first, while most accept the testimony of the misguided but not the Khattabiyya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16569} Al-Ghazali divides hearts into three kinds, and scholars count opposing one's own desire the greatest struggle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16569} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16570} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16571} Two causes lead to following desire: the strength of its rule, and the reluctance to think clearly when things are unclear. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16570}"
