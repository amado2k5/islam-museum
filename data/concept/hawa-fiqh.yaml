id: concept/hawa-fiqh
class: concept
kind: ethical
label: { ar: "هَوَى", en: "Hawa (desire, and the duty to resist it)", es: "Hawa (el deseo y el deber de resistirlo)", fr: "Hawa (le désir et le devoir de lui résister)", ur: "حوا ⁦(خواہش، اور اس کی مزاحمت کا فرض)⁩", tr: "Hava", id: "Udara" }
summary:
  ar: "الهوى في الاصطلاح ميلان النفس إلى ما تستلذ به من الشهوات من غير داعية الشرع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16565} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16566} ويفترق عن الشهوة بأن الهوى يختص بالآراء والاعتقادات، والشهوة بنيل المستلذات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16566} والهوى إذا وافق الشرع فهو محمود، وإذا خالفه فهو مذموم، وقد نهى الشرع عن اتباعه المذموم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16566} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16567} وقسّم الفقهاء صاحب الهوى إلى من يجب تكفيره ومن لا يجب تكفيره، واختلفوا في قبول شهادة الأول وروايته، وذهب الجمهور إلى قبول شهادة الفاسق المتأول إلا الخطابية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16569} وقال الغزالي إن القلوب ثلاثة أنواع في الثبات على الخير والشر، وإن مخالفة النفس عن هواها مما عدّه العلماء أعظم الجهاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16569} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16570} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16571} وسبب اتباع الهوى قوة سلطانه، واستثقال الفكر في تمييز المشتبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16570}"
  en: "Hawa in the technical sense is the inclination of the soul towards pleasures it relishes, without the call of the law. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16565} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16566} It differs from shahwa (appetite) in that hawa concerns opinions and beliefs, while shahwa concerns obtaining pleasurable things. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16566} Hawa that agrees with the law is praised, and that which opposes it is blamed; the law forbids following the blamed kind. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16566} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16567} The jurists divide the followers of hawa into those whose unbelief is to be declared and those who are not; they differ on the acceptance of the testimony of the first, while most accept the testimony of the misguided but not the Khattabiyya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16569} Al-Ghazali divides hearts into three kinds, and scholars count opposing one's own desire the greatest struggle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16569} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16570} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16571} Two causes lead to following desire: the strength of its rule, and the reluctance to think clearly when things are unclear. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16570}"
  es: "Hawa, en sentido técnico, es la inclinación del alma hacia los placeres que disfruta, sin el llamado de la ley. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16565} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16566} Se diferencia de shahwa (apetito) en que hawa se refiere a opiniones y creencias, mientras que shahwa se refiere a la obtención de cosas placenteras. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16566} El hawa que concuerda con la ley es alabado, y el que se opone a ella es censurado; la ley prohíbe seguir el tipo censurado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16566} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16567} Los juristas dividen a los seguidores de hawa en aquellos cuya incredulidad debe ser declarada y aquellos que no; difieren en la aceptación del testimonio de los primeros, mientras que la mayoría acepta el testimonio de los extraviados pero no el de los Khattabiyya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16569} Al-Ghazali divide los corazones en tres tipos, y los eruditos consideran que oponerse al propio deseo es la mayor lucha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16569} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16570} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16571} Dos causas conducen al seguimiento del deseo: la fuerza de su dominio y la renuencia a pensar con claridad cuando las cosas no están claras. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16570}"
  fr: "Le terme hawa, au sens technique, désigne l'inclination de l'âme vers les plaisirs qu'elle recherche, indépendamment de la loi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16565} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16566} Il se distingue du shahwa (appétit) en ce que le hawa concerne les opinions et les croyances, tandis que le shahwa concerne l'obtention de choses plaisantes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16566} Le hawa conforme à la loi est loué, et celui qui s'y oppose est blâmé; la loi interdit de suivre ce dernier. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16566} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16567} Les juristes divisent les adeptes de la hawa en deux catégories: ceux dont l’incroyance doit être déclarée et ceux dont l’incroyance ne l’est pas. Ils divergent quant à l’acceptation du témoignage des premiers, tandis que la plupart acceptent le témoignage des égarés, mais pas celui des Khattabiyya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16569} Al-Ghazali distingue trois sortes de cœurs, et les savants considèrent la lutte contre ses propres désirs comme le combat le plus difficile. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16569} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16570} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16571} Deux causes conduisent à suivre le désir: la force de son emprise et la réticence à penser clairement lorsque les choses sont confuses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16570}"
  ur: "حوا تکنیکی معنوں میں روح کا ان لذتوں کی طرف جھکاؤ ہے جن سے وہ مزہ لیتی ہے، بغیر قانون کے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16565} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16566} یہ شہوا ⁦(بھوک)⁩ سے اس لحاظ سے مختلف ہے کہ حواء رائے اور عقائد سے متعلق ہے، جب کہ شہوا کو حاصل کرنے والی چیزوں کا تعلق ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 16566} حوا جو قانون سے متفق ہے اس کی تعریف کی جاتی ہے اور جو اس کی مخالفت کرتا ہے اسے ملامت کیا جاتا ہے۔ قانون الزام کی قسم کی پیروی سے منع کرتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16566} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16567} فقہاء حوا کے پیروکاروں کو ان میں تقسیم کرتے ہیں جن کے کفر کا اعلان کیا جانا ہے اور جو نہیں ہیں۔ پہلی کی گواہی کے قبول کرنے میں ان کا اختلاف ہے، جبکہ اکثر گمراہوں کی گواہی کو قبول کرتے ہیں لیکن خطابیہ کو نہیں۔ الغزالی نے دلوں کو تین قسموں میں تقسیم کیا ہے اور علماء اپنی خواہش کی مخالفت کو سب سے بڑی جدوجہد شمار کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16569} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16570} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16571} دو اسباب واضح طور پر سوچنا اور اس کی طاقت کی طرف رہنمائی کرنا۔ جب چیزیں غیر واضح ہیں. {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 16570}"
  tr: "Terminolojide, arzu, ruhun Şeriat'ın gerekçesi olmadan arzulardan kaynaklanan şeye eğilimidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16565} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16566} Arzudan farklıdır çünkü arzu görüşler ve inançlarla sınırlıdır ve arzu zevk elde etmektir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16566} Arzu Şeriatla uyumluysa övülür; eğer ona aykırıysa suçludur ve Şeriat onu suçlu şekilde takip etmeyi yasaklamıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16566} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16567} Hukukçular, arzu sahibi olanı inkâr ilan edilmesi gerekenler ve inanmamaları gerekenler olarak ayırdılar. İlk rivayetin ve rivayetlerinin tanıklığını kabul etmekte farklılık gösterirken, çoğunluk günahkârın tanıklığını yorumlayan tanıklığı sadece retorik olanlar hariç kabul etti. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16569} Al-Gazali, kalplerin iyi ve kötülüğe sadık kalplerin üç tipte olduğunu ve ruhun arzularından uzaklaştırılmasının alimler tarafından cihadın en büyük biçimi olarak kabul edildiğini söylemiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16569} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16571} Arzuları takip etmenin nedeni, otoritesinin gücü ve şüpheliyi ayırt etmedeki ağır düşünce yüküdür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16570}"
  id: "Dalam terminologi, hasrat adalah kecenderungan jiwa terhadap apa yang diperolehnya dari keinginan tanpa pembenaran Syariah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16565} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16566} Itu berbeda dari hasrat karena hasrat terbatas pada pendapat dan keyakinan, dan keinginan adalah untuk mendapatkan kesenangan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16566} Jika hasrat sesuai dengan Syariah, maka dipuji; jika bertentangan, maka ia patut dipersalahkan, dan Syariah melarang mengikutinya dengan cara yang tersalah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16566} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16567} Para ahli hukum membagi orang yang memiliki hasrat menjadi yang harus dinyatakan kafir dan yang tidak. Mereka berbeda dalam menerima kesaksian yang pertama dan riwayatnya, sementara mayoritas menerima kesaksian pendosa yang menafsirkannya kecuali kesaksian retoris. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16569} Al-Ghazali mengatakan bahwa hati itu ada tiga jenis: keteguhan dalam kebaikan dan kejahatan, dan bahwa menentang jiwa dari keinginannya dianggap oleh para ulama sebagai bentuk jihad terbesar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16569} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16570} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16571} Alasan mengikuti keinginan adalah kekuatan otoritasnya, dan beban berat pemikiran dalam membedakan tersangka. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16570}"
