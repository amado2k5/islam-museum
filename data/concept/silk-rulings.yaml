label: { ar: "الحرير وأحكامه", en: "Silk and its rulings (harir)", ur: "ریشم کے احکام ⁦(حریر)⁩", es: "La seda y sus normas (harir)", fr: "La soie et ses règles (harir)", tr: "İpek ve hükümleri", id: "Sutra dan keputusannya" }
summary:
  ar: "الحرير معروف، وهو مأخوذ من دودة القز، وتتصل به ألفاظ كالإبريسم والاستبرق والديباج والسندس والدمقس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7018} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7019} واتفق الفقهاء على حل الحرير المصمت، أي الخالص، للنساء لبسا واستعمالا، وحرمته على الرجال لبسا وغطاء للرأس واشتمالا، للأحاديث الصحيحة، إلا في الحرب أو المرض أو ما في معناهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7019} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7020} وفي الحرب يجوز عند أبي يوسف ومحمد وابن الماجشون للرجال لبس الحرير، وعند الحنابلة بقيد الحاجة، والشافعية يوسعون العذر كالحر والبرد المضرين والجرب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7020} وعند أبي حنيفة والمشهور عند المالكية لا يجوز لبس الحرير المصمت مطلقا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7020} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7021} ولا يجوز إلباس الصغير الذكر الحرير عند الحنفية وقول المالكية والوجه عند الشافعية والحنابلة، ويذهب الشافعية إلى جواز إلباسه الصغير.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7021} وتباح الأزرار ولبنة الجيب اليسيرة عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7022} وفي الثياب المنسوجة من الحرير وغيره، الحنفية يفرّقون بين اللحمة والسدى، والمالكية يرون لبسها مكروها، والشافعية والحنابلة يحرمون ما كان أكثره حريرا وفق الوزن أو الظهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7022} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7023} وتبطين الثياب بالحرير يمنعه الحنفية والحنابلة، ويقيده المالكية بالكثرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7024} ويجوز كسوة الكعبة بالحرير، بل يندب عند بعضهم، ويجوز خياطة الثياب به، واتخاذه كيسا للمصحف، واختلفوا في تزيين الجدران به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7024}"
  en: "Silk (harir) is the thread of the silkworm, and related words include ibrisam, istabraq, dibaj, sundus and dimaqs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7018} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7019} The jurists agree that pure silk is lawful for women, to wear and to use, and forbidden to men to wear, to cover the head, or to wrap in, on the authority of sound reports, except in war or illness or the like. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7019} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7020} In war, Abu Yusuf, Muhammad and Ibn al-Majishun allow men to wear it; the Hanbalis allow it for need; and the Shafi'is widen the excuse to harmful cold or heat and to scabies. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7020} Abu Hanifa, and the better-known Maliki view, forbid pure silk to men absolutely. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7020} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7021} Dressing a young boy in silk is forbidden by the Hanafis, one Maliki view, and a view of the Shafi'is and Hanbalis, though the Shafi'is allow it for a small child. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7021} Silk buttons and a small collar lining are allowed by the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7022} For garments woven partly of silk, the Hanafis distinguish the weft from the warp, the Malikis count wearing it disliked, and the Shafi'is and Hanbalis forbid it where silk predominates by weight or visibility. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7022} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7023} Lining garments with silk is forbidden by the Hanafis and Hanbalis, and the Malikis limit that to a large amount. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7024} Covering the Ka'ba with silk is lawful and for some recommended; sewing garments with it and making a bag for a Qur'an are lawful; decorating walls with it is allowed by the Hanafis and Malikis and forbidden by the Shafi'is and Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7024}"
  es: "La seda (harir) es el hilo del gusano de seda, y las palabras relacionadas incluyen ibrisam, istabraq, dibaj, sundus y dimaqs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7018} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7019} Los juristas concuerdan en que la seda pura es lícita para las mujeres, para usarla y para vestirla, y prohibida para los hombres para vestirla, cubrirse la cabeza o envolverse en ella, según informes fiables, excepto en la guerra o enfermedad o similares. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7019} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7020} En la guerra, Abu Yusuf, Muhammad e Ibn al-Majishun permiten que los hombres la usen; los Hanbalis la permiten por necesidad; y los shafi'is amplían la excusa al frío o calor dañino y a la sarna. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7020} Abu Hanifa, y la opinión malikí más conocida, prohíben absolutamente la seda pura a los hombres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7020} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7021} Vestir a un niño pequeño con seda está prohibido por los hanafíes, una opinión malikí, y una opinión de los shafi'is y hanbalis, aunque los shafi'is lo permiten para un niño pequeño. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7021} La mayoría permite botones de seda y un pequeño forro en el cuello. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7022} Para prendas tejidas parcialmente de seda, los Hanafis distinguen la trama de la urdimbre, los Malikis consideran que usarla es desaconsejable, y los Shafi'is y Hanbalis la prohíben donde la seda predomina por peso o visibilidad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7022} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7023} Forrar prendas con seda está prohibido por los Hanafis y Hanbalis, y los Malikis lo limitan a una gran cantidad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7024} Cubrir la Kaaba con seda es lícito y para algunos recomendable; coser prendas con ella y hacer una bolsa para un Corán son lícitos; Decorar las paredes con él está permitido por los hanafíes y malikíes, y prohibido por los shafiíes y hanbalíes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7024}"
  fr: "La soie (harir) est le fil du ver à soie, et des termes apparentés incluent ibrisam, istabraq, dibaj, sundus et dimaqs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7018} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7019} Les juristes s'accordent à dire que la soie pure est licite pour les femmes, qui peuvent la porter et l'utiliser, et interdite aux hommes de la porter, de s'en couvrir la tête ou de s'en envelopper, selon des sources fiables, sauf en cas de guerre, de maladie ou de situation similaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7019} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7020} En temps de guerre, Abu Yusuf, Muhammad et Ibn al-Majishun autorisent les hommes à la porter; les Hanbalites l'autorisent en cas de nécessité. Les chaféites étendent cette excuse aux températures extrêmes et à la gale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7020} Abou Hanifa, et l'école malikite, plus connue, interdisent formellement le port de la soie pure aux hommes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7020} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7021} Habiller un jeune garçon de soie est interdit par les hanafites, une école malikite, ainsi que par les chaféites et les hanbalites, bien que les chaféites l'autorisent pour un très jeune enfant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7021} La majorité des écoles autorisent les boutons de soie et une petite doublure de col. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7022} Pour les vêtements tissés en partie de soie, les Hanafites distinguent la trame de la chaîne, les Malikites déconseillent d'en porter, et les Shafi'ites et les Hanbalites l'interdisent lorsque la soie prédomine en poids ou en visibilité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7022} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7023} Doubler les vêtements avec de la soie est interdit par les Hanafites et les Hanbalites, et les Malikites limitent cela à une grande quantité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7024} Recouvrir la Kaaba de soie est licite et même recommandé pour certains; coudre des vêtements avec de la soie et confectionner un sac pour un Coran sont licites. La décoration des murs avec ce matériau est autorisée par les hanafites et les malikites, et interdite par les chaféites et les hanbalites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7024}"
  ur: "ریشم ⁦(حریر)⁩ ریشم کے کیڑے کا دھاگہ ہے اور اس سے متعلقہ الفاظ میں ابریزام، استبراق، دبج، سندس اور دمق شامل ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7018} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7019} فقہاء اس بات پر متفق ہیں کہ خالص ریشم عورتوں کے لیے حلال ہے، پہننا اور استعمال کرنا، اور مردوں کے لیے حرام ہے، سوائے اس کے کہ پہننا، سر پر چھپنا، تصنیف کی آواز میں سر ڈھانپنا۔ یا بیماری یا اس طرح. {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.7019} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7020} جنگ میں، ابو یوسف، محمد اور ابن المجیش مردوں کو اسے پہننے کی اجازت دیتے ہیں۔ حنبلی ضرورت کے مطابق اس کی اجازت دیتے ہیں۔ اور شافعی نقصان دہ سردی یا گرمی اور خارش کے عذر کو وسیع کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7020} ابو حنیفہ، اور زیادہ معروف مالکی قول، خالص ریشم کو مردوں پر قطعی طور پر حرام قرار دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص7020} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص7021} چھوٹے لڑکے کو ریشم کا لباس پہنانا احناف کے نزدیک حرام ہے، ایک مالکی کا قول ہے، اور شافعیوں اور حنفیہ کے نزدیک چھوٹے بچے کے لیے جائز ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7021} ریشم کے بٹن اور ایک چھوٹی کالر استر کی اکثریت کی اجازت ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 7022} ریشم کے جزوی طور پر بنے ہوئے کپڑوں کے لیے حنفیہ تانے کو تانے سے الگ کرتے ہیں، مالکیہ اسے ناپسند کرتے ہیں، اور شافعیہ اور حنبلی اس سے منع کرتے ہیں جہاں ریشم وزن یا ضعف کے اعتبار سے غالب ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7022} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7023} حنفیہ اور حنبلیوں کے نزدیک ریشمی لباس کو حرام قرار دیا گیا ہے اور مالکیہ اس کی حد زیادہ ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7024} کعبہ کو ریشم سے ڈھانپنا حلال ہے اور بعض کے لیے مستحب ہے۔ اس سے کپڑوں کی سلائی کرنا اور قرآن کے لیے تھیلی بنانا حلال ہے۔ اس سے دیواروں کو سجانا احناف اور مالکیہ کے نزدیک جائز ہے اور شافعیوں اور حنبلیوں کے نزدیک حرام ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص7024}"
  tr: "İpek iyi bilinir ve ipekböceğinden türemiştir; ipek, istebrak, dibroj, sandus ve damqs gibi terimler onunla ilişkilendirilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7018} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7019} Hukukçular, katı yani saf ipeğin kadınların giyim ve kullanımda izin verdiğini, ancak gerçek hadislere göre erkeklerin başı giyip kapatması ve dahil etmesi yasak olduğunu, ancak savaş, hastalık veya ne anlama geldiği durumlar dışında geçerli olduğu konusunda hemfikirdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7019} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7020} Savaşta, Ebu Yusuf, Muhammed ve İbn al-Majshoun'a göre erkeklerin ipek giymesi izinlidir; Hanbalilere göre ise sadece giymek yeterlidir; Şafiiler ise zararlı sıcak, soğuk ve uyuz gibi bahaneler sunar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7020} Abu Hanifa ve ünlü Malikilere göre, katı ipek giymek asla izin değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7020} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7021} Hanefilere göre genç bir erkeğin ipek giymesi yasaktır, Malikiler ve yüz ise Şafi'ler ve Hanbali olarak kabul edilir. Şafi'ler küçük bir erkek çocuğun da giymesine izin verir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7021} Çoğunluğa göre düğmeler ve hafif cep tuğlası izinlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7022} İpek ve diğerlerinden yapılmış dokuma giysiler için Hanafiler atkı ve çözgü arasında ayrım yapar, Malikiler bunları giymeyi sevmez, Şafi'ler ve Hanbaliler ise ağırlık veya görünüme göre çoğunlukla ipek olanları yasaklar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7022}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7023} Hanafi ve Hanbaliler tarafından ipekle astarlamak yasaktır, Malikiler ise aşırıya kaçarak kısıtlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7024} Kabe'nin ipekle kaplanması caizdir, hatta bazıları bunu tavsiye eder. Onunla kıyafet dikmek ve Kur'an için çanta olarak kullanmak caizdir. Duvarları bununla süslemek konusunda anlaşmazlıklar vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7024}"
  id: "Sutra sudah dikenal luas dan berasal dari ulat sutra, dan istilah seperti sutra, istebrak, dibroj, sandus, dan damqs dikaitkan dengannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7018} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7019} Para ahli hukum sepakat bahwa sutra padat, yaitu sutra murni, diperbolehkan bagi wanita dalam pakaian dan penggunaan, tetapi dilarang bagi pria untuk mengenakan dan menutupi kepala serta memasukkannya, menurut hadits yang otentik, kecuali dalam kasus perang, penyakit, atau apa pun artinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7019} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7020} Dalam perang, menurut Abu Yusuf, Muhammad, dan Ibn al-Majshoun, pria boleh mengenakan sutra; menurut Hanbali, hanya perlu melakukannya; dan para Syha'i memberikan alasan seperti panas yang berbahaya, dingin, dan kudis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7020} Menurut Abu Hanifa dan Maliki yang terkenal, tidak pernah diperbolehkan memakai sutra padat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7020} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7021} Menurut Hanafi, tidak diperbolehkan bagi pria muda mengenakan sutra, sedangkan Malik dan wajah dianggap sebagai Shafi'i dan Hanbali. Shafi'i juga mengizinkan memakai anak laki-laki kecil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7021} Kancing dan bata saku ringan diperbolehkan sesuai dengan mayoritas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7022} Untuk pakaian tenun dari sutra dan lainnya, Hanafi membedakan antara pakan dan lungsi, Maliki menganggap tidak disukai, sementara Shafi'i dan Hanbal melarang apa yang sebagian besar adalah sutra berdasarkan berat atau penampilan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7022} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7023} Melapisi pakaian dengan sutra dilarang oleh Hanafi dan Hanbali, dan Malik membatasinya secara berlebihan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7024} Diperbolehkan untuk menutupi Ka'bah dengan sutra, dan beberapa bahkan merekomendasikan. Diperbolehkan menjahit pakaian dengan sutra dan menggunakannya sebagai tas untuk Al-Qur'an. Ada perbedaan pendapat tentang menghias dinding dengan sutra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7024}"
