label: { ar: "الحرير وأحكامه", en: "Silk and its rulings (harir)", ur: "ریشم کے احکام (حریر)" }
summary:
  ar: "الحرير معروف، وهو مأخوذ من دودة القز، وتتصل به ألفاظ كالإبريسم والاستبرق والديباج والسندس والدمقس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7018} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7019} واتفق الفقهاء على حل الحرير المصمت، أي الخالص، للنساء لبسا واستعمالا، وحرمته على الرجال لبسا وغطاء للرأس واشتمالا، للأحاديث الصحيحة، إلا في الحرب أو المرض أو ما في معناهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7019} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7020} وفي الحرب يجوز عند أبي يوسف ومحمد وابن الماجشون للرجال لبس الحرير، وعند الحنابلة بقيد الحاجة، والشافعية يوسعون العذر كالحر والبرد المضرين والجرب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7020} وعند أبي حنيفة والمشهور عند المالكية لا يجوز لبس الحرير المصمت مطلقا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7020} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7021} ولا يجوز إلباس الصغير الذكر الحرير عند الحنفية وقول المالكية والوجه عند الشافعية والحنابلة، ويذهب الشافعية إلى جواز إلباسه الصغير.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7021} وتباح الأزرار ولبنة الجيب اليسيرة عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7022} وفي الثياب المنسوجة من الحرير وغيره، الحنفية يفرّقون بين اللحمة والسدى، والمالكية يرون لبسها مكروها، والشافعية والحنابلة يحرمون ما كان أكثره حريرا وفق الوزن أو الظهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7022} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7023} وتبطين الثياب بالحرير يمنعه الحنفية والحنابلة، ويقيده المالكية بالكثرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7024} ويجوز كسوة الكعبة بالحرير، بل يندب عند بعضهم، ويجوز خياطة الثياب به، واتخاذه كيسا للمصحف، واختلفوا في تزيين الجدران به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7024}"
  en: "Silk (harir) is the thread of the silkworm, and related words include ibrisam, istabraq, dibaj, sundus and dimaqs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7018} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7019} The jurists agree that pure silk is lawful for women, to wear and to use, and forbidden to men to wear, to cover the head, or to wrap in, on the authority of sound reports, except in war or illness or the like. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7019} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7020} In war, Abu Yusuf, Muhammad and Ibn al-Majishun allow men to wear it; the Hanbalis allow it for need; and the Shafi'is widen the excuse to harmful cold or heat and to scabies. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7020} Abu Hanifa, and the better-known Maliki view, forbid pure silk to men absolutely. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7020} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7021} Dressing a young boy in silk is forbidden by the Hanafis, one Maliki view, and a view of the Shafi'is and Hanbalis, though the Shafi'is allow it for a small child. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7021} Silk buttons and a small collar lining are allowed by the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7022} For garments woven partly of silk, the Hanafis distinguish the weft from the warp, the Malikis count wearing it disliked, and the Shafi'is and Hanbalis forbid it where silk predominates by weight or visibility. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7022} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7023} Lining garments with silk is forbidden by the Hanafis and Hanbalis, and the Malikis limit that to a large amount. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7024} Covering the Ka'ba with silk is lawful and for some recommended; sewing garments with it and making a bag for a Qur'an are lawful; decorating walls with it is allowed by the Hanafis and Malikis and forbidden by the Shafi'is and Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7024}"
