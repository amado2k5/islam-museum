perspectives:
  - tradition: sunni
    id: sunni-majority
    summary:
      ar: "الجمهور، ومنهم مالك والشافعي، وكذلك أبو حنيفة وفقهاء الكوفة في جانب التعزير: تارك الصلاة تكاسلاً مع اعتقاد وجوبها فاسق لا يُكفَّر، ويُستتاب، فإن لم يتب قُتل حدًا عند مالك والشافعي، وعند أبي حنيفة يُعزَّر ويُحبس حتى يصلي {cite:sallabi-ali-vol1 p. 288}. يعرض الصلابي هذا القول بوصفه قول الجماهير من السلف والخلف، ويذكره عن النووي {cite:sallabi-ali-vol1 p. 288}."
      en: "The majority, including Malik and al-Shafi'i, hold that one who neglects prayer while believing it obligatory is a sinner, not an unbeliever, to be asked to repent and, if he does not, put to death as a hadd; Abu Hanifa and the Kufans hold discretionary punishment and imprisonment until he prays {cite:sallabi-ali-vol1 p. 288}."
    sources: [source/sallabi-ali-vol1]
  - tradition: sunni
    id: sunni-takfir
    summary:
      ar: "جماعة من السلف، ومنهم رواية عن علي بن أبي طالب، وإحدى الروايتين عن أحمد بن حنبل، وبه قال عبد الله بن المبارك وإسحاق بن راهويه، ووجه لبعض أصحاب الشافعي، يرون تكفير تارك الصلاة {cite:sallabi-ali-vol1 p. 288}."
      en: "A group of early scholars, including a narration from Ali, one of Ahmad ibn Hanbal's two narrations, Ibn al-Mubarak and Ishaq ibn Rahawayh, and a view of some Shafi'i jurists, hold that the one who abandons prayer is an unbeliever {cite:sallabi-ali-vol1 p. 288}."
    sources: [source/sallabi-ali-vol1]
  - tradition: academic
    id: academic
    summary:
      ar: "لم يعرض الكتاب في هذا الموضع مرجعاً أكاديمياً حديثاً في تحقيق نسبة قول التكفير إلى علي؛ يحتاج إلى مرجع محدد (needs_source)."
      en: "The book does not set out a modern academic study of whether the takfir view is correctly ascribed to Ali; to be added from a named source (needs_source)."
