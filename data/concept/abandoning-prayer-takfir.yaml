perspectives:
  - tradition: sunni
    id: sunni-majority
    summary:
      ar: "الجمهور، ومنهم مالك والشافعي، وكذلك أبو حنيفة وفقهاء الكوفة في جانب التعزير: تارك الصلاة تكاسلاً مع اعتقاد وجوبها فاسق لا يُكفَّر، ويُستتاب، فإن لم يتب قُتل حدًا عند مالك والشافعي، وعند أبي حنيفة يُعزَّر ويُحبس حتى يصلي {cite:sallabi-ali-vol1 p. 288}. يعرض الصلابي هذا القول بوصفه قول الجماهير من السلف والخلف، ويذكره عن النووي {cite:sallabi-ali-vol1 p. 288}."
      en: "The majority, including Malik and al-Shafi'i, hold that one who neglects prayer while believing it obligatory is a sinner, not an unbeliever, to be asked to repent and, if he does not, put to death as a hadd; Abu Hanifa and the Kufans hold discretionary punishment and imprisonment until he prays {cite:sallabi-ali-vol1 p. 288}."
    sources: [source/sallabi-ali-vol1]
  - tradition: sunni
    id: sunni-takfir
    summary:
      ar: "جماعة من السلف، ومنهم رواية عن علي بن أبي طالب، وإحدى الروايتين عن أحمد بن حنبل، وبه قال عبد الله بن المبارك وإسحاق بن راهويه، ووجه لبعض أصحاب الشافعي، يرون تكفير تارك الصلاة {cite:sallabi-ali-vol1 p. 288}."
      en: "A group of early scholars, including a narration from Ali, one of Ahmad ibn Hanbal's two narrations, Ibn al-Mubarak and Ishaq ibn Rahawayh, and a view of some Shafi'i jurists, hold that the one who abandons prayer is an unbeliever {cite:sallabi-ali-vol1 p. 288}."
    sources: [source/sallabi-ali-vol1]
  - tradition: sunni-hanbali
    id: ibn-batta-ibana
    standing: secondary
    stance: { ar: "تارك الصلاة وجاحد الفرائض كافر خارج من الملة", en: "One who abandons prayer and denies the obligations is an unbeliever outside the religion", ur: "نماز چھوڑنے والا اور فرائض کا منکر کافر اور دین سے خارج ہے" }
    summary:
      ar: "يروي ابن بطة في الإبانة الكبرى أحاديث جابر وبريدة وأبي ذر وآثار عمر وعلي وابن مسعود وأبي الدرداء وابن المبارك في تارك الصلاة، ثم يقول إنها كلها تدل على تكفير تارك الصلاة وجاحد الفرائض وإخراجه من الملة، ويستدل بآيات تقرن الدين القيم والأخوة في الدين بإقامة الصلاة وإيتاء الزكاة على أن الإيمان قول وعمل."
      en: "In al-Ibana al-Kubra Ibn Batta transmits the hadiths of Jabir, Burayda and Abu Dharr and the reports of Umar, Ali, Ibn Mas'ud, Abu al-Darda' and Ibn al-Mubarak on one who abandons prayer, then says that all of them show that one who abandons prayer and denies the obligations is an unbeliever removed from the religion; he argues from verses that tie the upright religion and brotherhood in religion to establishing prayer and giving zakat that faith is word and deed."
      ur: "الابانہ الکبریٰ میں ابن بطہ نماز چھوڑنے والے کے بارے میں جابر، بریدہ اور ابو ذر کی احادیث اور عمر، علی، ابن مسعود، ابو الدرداء اور ابن المبارک کے آثار روایت کرتے ہیں، پھر کہتے ہیں کہ یہ سب نماز چھوڑنے والے اور فرائض کے منکر کی تکفیر اور دین سے اخراج پر دلالت کرتے ہیں؛ اور ان آیات سے، جو دینِ قیم اور دینی اخوت کو نماز قائم کرنے اور زکوٰۃ دینے سے جوڑتی ہیں، یہ استدلال کرتے ہیں کہ ایمان قول و عمل ہے۔"
    holders: [person/ibn-batta-al-ukbari-ubayd-allah]
