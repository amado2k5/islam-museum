id: concept/abandoning-prayer-takfir
class: concept
kind: legal
label: { ar: "حكم تارك الصلاة", en: "The ruling on one who abandons prayer", ur: "نماز چھوڑنے والے کا حکم" }
summary:
  ar: "ينقل الصلابي عن علي بن أبي طالب قوله: «من لم يصل فهو كافر» {cite:sallabi-ali-vol1 p. 287}، وينقل الكتاب قولًا عن أحد الرواة ⁦(اسمه مشوش في المسح الضوئي)⁩ أن أصحاب النبي لم يروا شيئًا من الأعمال تركه كفر غير الصلاة {cite:sallabi-ali-vol1 p. 287}. وينقل عن النووي أن تارك الصلاة تكاسلاً مع اعتقاد وجوبها اختُلف فيه: فذهب مالك والشافعي والجماهير إلى أنه لا يكفر بل يفسق ويُستتاب، وذهبت جماعة من السلف إلى تكفيره ومنها رواية عن علي، وذهب أبو حنيفة وجماعة من أهل الكوفة إلى أنه لا يكفر ولا يُقتل بل يُعزَّر ويُحبس حتى يصلي {cite:sallabi-ali-vol1 p. 288}."
  en: "Al-Sallabi quotes Ali: whoever does not pray is an unbeliever. He then reports from al-Nawawi the dispute over one who neglects prayer while believing it obligatory: the majority (Malik, al-Shafi'i) hold him a sinner to be asked to repent, others hold him an unbeliever, a view ascribed to Ali; Abu Hanifa and the Kufans hold him not an unbeliever but to be disciplined {cite:sallabi-ali-vol1 p. 288}."
  ur: "صلابی علی بن ابی طالب کا قول نقل کرتے ہیں کہ جو نماز نہ پڑھے وہ کافر ہے؛ پھر نووی سے اس شخص کے بارے میں اختلاف نقل کرتے ہیں جو نماز کو واجب مانتے ہوئے سستی سے چھوڑ دے: جمہور ⁦(مالک، شافعی)⁩ کے نزدیک وہ فاسق ہے جس سے توبہ کرائی جائے، دوسروں کے نزدیک کافر، اور یہ قول علی سے منسوب ہے؛ ابو حنیفہ اور اہلِ کوفہ کے نزدیک وہ کافر نہیں بلکہ اسے تعزیر دی جائے {cite:sallabi-ali-vol1 p. 288}۔ ابن بطہ الابانہ الکبریٰ میں تارکِ نماز کی تکفیر کی روایات جمع کرتے ہیں {cite:ibana-kubra-muti-iman p. 683}۔"
