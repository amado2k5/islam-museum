id: concept/laqab-fiqh
class: concept
kind: legal
label:
  ar: "اللَّقَب"
  en: "Laqab (byname), rulings"
  ur: "لقب (احکام)"
summary:
  ar: "اللقب في اللغة ما يُسمّى به الإنسان بعد اسمه الأول (العَلَم) من لفظ يدل على مدح أو ذم لمعنى فيه، وهو ضربان: ضرب على سبيل التشريف كألقاب السلاطين، وضرب على سبيل النبز {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13659}. والاسم ما يعرف به الشيء، والكنية ما صُدّر بأب أو أم وتكون للتفخيم غالباً، بخلاف اللقب الذي قد يكون للمدح أو الذم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13659} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13660}."
  en: "Laqab, in lexicon, is a name given to a person after his first name, a word praising or blaming him for something in him; it has two kinds, one of honour, like the titles of rulers, and one of mockery {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13659}. The ism is what a thing is known by; the kunya begins with ab or umm and is usually for honour, whereas a laqab may praise or blame {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13659} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13660}."
  ur: "لقب لغت میں وہ نام ہے جو کسی شخص کو اس کے پہلے نام (علم) کے بعد دیا جائے اور جو کسی خوبی یا خرابی پر دلالت کرے؛ اس کی دو قسمیں ہیں: تشریف کے لیے جیسے بادشاہوں کے القاب، اور طعنے کے لیے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13659}۔ اسم وہ ہے جس سے کوئی چیز پہچانی جائے، اور کنیت وہ ہے جو اب یا ام سے شروع ہو اور عام طور پر تعظیم کے لیے ہوتی ہے، جبکہ لقب مدح یا مذمت دونوں کے لیے ہو سکتا ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13659} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13660}۔"
