summary:
  ar: "اللقب في اللغة ما يُسمّى به الإنسان بعد اسمه الأول ⁦(العَلَم)⁩ من لفظ يدل على مدح أو ذم لمعنى فيه، وهو ضربان: ضرب على سبيل التشريف كألقاب السلاطين، وضرب على سبيل النبز {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13659}. والاسم ما يعرف به الشيء، والكنية ما صُدّر بأب أو أم وتكون للتفخيم غالباً، بخلاف اللقب الذي قد يكون للمدح أو الذم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13659} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13660}."
  en: "Laqab, in lexicon, is a name given to a person after his first name, a word praising or blaming him for something in him; it has two kinds, one of honour, like the titles of rulers, and one of mockery {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13659}. The ism is what a thing is known by; the kunya begins with ab or umm and is usually for honour, whereas a laqab may praise or blame {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13659} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13660}."
  ur: "لقب لغت میں وہ نام ہے جو کسی شخص کو اس کے پہلے نام ⁦(علم)⁩ کے بعد دیا جائے اور جو کسی خوبی یا خرابی پر دلالت کرے؛ اس کی دو قسمیں ہیں: تشریف کے لیے جیسے بادشاہوں کے القاب، اور طعنے کے لیے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13659}۔ اسم وہ ہے جس سے کوئی چیز پہچانی جائے، اور کنیت وہ ہے جو اب یا ام سے شروع ہو اور عام طور پر تعظیم کے لیے ہوتی ہے، جبکہ لقب مدح یا مذمت دونوں کے لیے ہو سکتا ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13659} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13660}۔"
  es: "Laqab, en léxico, es un nombre que se le da a una persona después de su nombre de pila, una palabra que lo alaba o lo reprende por algo en él; tiene dos tipos, uno de honor, como los títulos de los gobernantes, y otro de burla {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13659}. El ism es por lo que se conoce algo; la kunya comienza con ab o umm y generalmente es para honor, mientras que un laqab puede alabar o reprender {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13659} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13660}."
  fr: "Le terme « laqab », dans le lexique, désigne un nom ajouté après le prénom d'une personne, un mot qui la loue ou la blâme pour une caractéristique de sa personne; il en existe deux sortes: l'une honorifique, comme les titres des souverains, et l'autre moqueuse {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13659}. Le suffixe « isme » désigne ce par quoi une chose est appelée; le suffixe « kunya » commence par « ab » ou « umm » et est généralement honorifique, tandis qu'un laqab peut être une louange ou une critique {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13659} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13660}."
  tr: "Dilde, bir kişinin adından sonra verilen unvan (al-'alam), içindeki bir anlamı övmek veya eleştirmek anlamına gelen bir kelimedir. İki türden oluşur: sultanların unvanları gibi bir onur biçimi olarak kullanılır ve soyluluk biçimi olarak kullanılır {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13659}. İsim, bir şeyle bilinen, kunya ise bir baba veya anne tarafından verilen ve genellikle abartma amaçlı kullanılan bir unvandır; {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13659} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13660}."
  id: "Dalam bahasa, gelar adalah apa yang diberikan kepada seseorang setelah nama depannya (al-'alam), sebuah kata yang menunjukkan pujian atau kritik terhadap makna di dalamnya. Gelar ini terbagi dua jenis: digunakan sebagai bentuk kehormatan, seperti gelar sultan, dan digunakan sebagai bentuk kebangsawanan {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13659}. Kata benda adalah apa yang diketahui oleh suatu benda, dan kunya adalah apa yang diberikan oleh ayah atau ibu dan biasanya digunakan untuk melebih-lebihkan, berbeda dengan gelar yang mungkin untuk pujian atau kesalahan {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13659} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13660}."
