summary:
  ar: 'المعز: الذي يعز من يشاء بطاعته ويقوّيه. الاسم رقم 24 في التعداد الوارد في حديث الترمذي عن أسماء الله الحسنى.'
  en: al-Mu'izz — The Bestower of Honor. Name 24 in the enumeration of the most beautiful names in the Tirmidhi hadith.
  fr: "al-Mu'izz — Celui qui confère l’honneur. Nom 24 dans l’énumération des plus beaux noms du hadith de Tirmidhi."
  ur: 'المعز: عزت دینے والا — جو جسے چاہے عزت اور قوت بخشے۔ اسمائے حسنیٰ کی ترمذی والی گنتی میں نمبر 24۔'
  es: "al-Mu'izz — El que otorga honores. Nombre número 24 en la enumeración de los nombres más bellos en el hadiz de Tirmidhi."
  tr: "El-Muizz: İstediği kişiyi onurlandıran, itaat eden ve onu güçlendiren. El-Tirmidi'nin Allah'ın İsimleri hakkındaki hadislerde adı 24."
  id: "Al-Mu'izz: orang yang menghormati siapa yang Dia kehendaki dengan taat dan menguatkannya. Nama nomor 24 dalam daftar yang disebutkan dalam hadits Al-Tirmidhi tentang Nama-nama Allah."
