id: "concept/mal-al-sakta"
class: "concept"
kind: "scientific"
label:
  ar: "مآل السكتة"
  en: "The outcome of apoplexy"
  ur: "سکتہ کا انجام"
  es: "El resultado de la apoplejía"
summary:
  ar: "أكثر ما تعرض السكتة لذوي الأسنان والأبدان والتدابير الرطبة؛ وقلما تعرض عن حرارة؛ وإذا انبسطت مادة الفالج في الجانبين أحدثت سكتة وإذا انقبضت مادة السكتة إلى جانب أحدثت فالجاً؛ والحمّى معها توقّف إلى اثنين وسبعين ساعة {cite:canon-ibn-sina-print-v2 p.131} {cite:canon-ibn-sina-print-v2 p.132} {cite:canon-ibn-sina-print-v2 p.134}"
  en: "Apoplexy mostly befalls those of moist constitutions, bodies and regimens; it seldom comes of heat; if the matter of palsy spreads in both sides it makes apoplexy, and if the matter of apoplexy contracts to one side it makes palsy; a fever with it warrants waiting up to seventy-two hours {cite:canon-ibn-sina-print-v2 p.131} {cite:canon-ibn-sina-print-v2 p.132} {cite:canon-ibn-sina-print-v2 p.134}"
  ur: "سکتہ اکثر مرطوب مسن، بدن اور تدبیر والوں پر گزرتا ہے؛ یہ کم ہی حرارت سے ہوتا ہے؛ اگر فالج کا مادہ دونوں طرف پھیلے تو سکتہ پیدا کرتی اور اگر سکتہ کا مادہ ایک طرف سمٹے تو فالج پیدا کرتی؛ اور اس کے ساتھ بخار ہو تو بہتر گھنٹے تک ٹھہرا جائے {cite:canon-ibn-sina-print-v2 p.131} {cite:canon-ibn-sina-print-v2 p.132} {cite:canon-ibn-sina-print-v2 p.134}۔"
  es: "La apoplejía afecta principalmente a personas de constitución, cuerpo y hábitos húmedos; rara vez se debe al calor; si la parálisis se extiende a ambos lados, produce apoplejía, y si se contrae hacia un lado, produce parálisis; la fiebre que la acompaña justifica esperar hasta setenta y dos horas {cite:canon-ibn-sina-print-v2 p.131} {cite:canon-ibn-sina-print-v2 p.132} {cite:canon-ibn-sina-print-v2 p.134}"
