label: { ar: "الرياضة تعريفها وحاجة البدن إليها عند ابن سينا", en: "Exercise defined and why the body needs it in the Canon", ur: "قانون میں ورزش کی تعریف اور بدن کو اس کی ضرورت", es: "Definición de ejercicio y por qué el cuerpo lo necesita en el Canon", fr: "Définition de l'exercice et explication des besoins du corps dans le Canon", tr: "İbn Sina'ya göre sporun tanımı ve vücudun buna olan ihtiyacı", id: "Definisi olahraga dan kebutuhan tubuh akan olahraga menurut Avicenna" }
summary:
  ar: "يفتتح ابن سينا التعليم الثاني من الفن الثالث، في التدبير المشترك للبالغين وهو سبعة عشر فصلاً، بالفصل الأول في جملة القول في الرياضة، فيعرفها بأنها حركة إرادية تضطر إلى تنفس عظيم متواتر، ويجعلها أول ما يُبدأ به في حفظ الصحة قبل الغذاء والنوم {cite:canon-ibn-sina-print-v1 p.221}."
  en: "Ibn Sina opens the second lesson of Fann 3, on the common regimen of adults in seventeen chapters, with chapter 1 on exercise in general. He defines it as a voluntary movement that forces large, frequent breathing, and puts it first in the keeping of health, before food and sleep {cite:canon-ibn-sina-print-v1 p.221}."
  es: "Ibn Sina inicia la segunda lección de Fann 3, sobre la rutina diaria de los adultos, que consta de diecisiete capítulos, con el capítulo 1 dedicado al ejercicio en general. Lo define como un movimiento voluntario que fuerza una respiración amplia y frecuente, y lo sitúa en primer lugar para el mantenimiento de la salud, antes que la comida y el sueño {cite:canon-ibn-sina-print-v1 p.221}."
  fr: "Ibn Sina ouvre la deuxième leçon du chapitre 3 de Fann, consacré au régime alimentaire des adultes en dix-sept chapitres, par le premier chapitre sur l'exercice physique en général. Il le définit comme un mouvement volontaire qui provoque une respiration ample et fréquente, et le place au premier rang des mesures de maintien de la santé, avant même l'alimentation et le sommeil {cite:canon-ibn-sina-print-v1 p.221}."
  ur: "ابن سینا نے فین 3 کا دوسرا سبق سترہ ابواب میں بالغوں کے عام طرز عمل پر شروع کیا ہے، باب 1 عام طور پر ورزش پر ہے۔ وہ اسے ایک رضاکارانہ تحریک کے طور پر بیان کرتا ہے جو بڑی، بار بار سانس لینے پر مجبور کرتی ہے، اور اسے کھانے اور سونے سے پہلے، صحت کو برقرار رکھنے میں سب سے پہلے رکھتا ہے۔"
  tr: "İbn Sina, yetişkinler için ortak yönetim adlı üçüncü sanatın ikinci dersini açar; bu bölüm on yedi bölümden oluşur; spor tartışmasının ilk bölümü ise bunu derin ve sürekli bir nefes gerektiren gönüllü bir hareket olarak tanımlar; böylece yemek yemeden ve uyumadan önce sağlığı korumaya ilk başlangıç yapar {cite:canon-ibn-sina-print-v1 s.221}."
  id: "Ibn Sina membuka pelajaran kedua dari seni ketiga, dalam manajemen bersama untuk orang dewasa, yang terdiri dari tujuh belas bab, dengan bab pertama dalam diskusi tentang olahraga, mendefinisikannya sebagai gerakan sukarela yang membutuhkan napas dalam dan berkelanjutan, menjadikannya hal pertama yang ia mulai dalam menjaga kesehatan sebelum makan dan tidur {cite:canon-ibn-sina-print-v1 hlm.221}."
