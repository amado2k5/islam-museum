label: { ar: "الرياضة تعريفها وحاجة البدن إليها عند ابن سينا", en: "Exercise defined and why the body needs it in the Canon", ur: "قانون میں ورزش کی تعریف اور بدن کو اس کی ضرورت", es: "Definición de ejercicio y por qué el cuerpo lo necesita en el Canon", fr: "Définition de l'exercice et explication des besoins du corps dans le Canon" }
summary:
  ar: "يفتتح ابن سينا التعليم الثاني من الفن الثالث، في التدبير المشترك للبالغين وهو سبعة عشر فصلاً، بالفصل الأول في جملة القول في الرياضة، فيعرفها بأنها حركة إرادية تضطر إلى تنفس عظيم متواتر، ويجعلها أول ما يُبدأ به في حفظ الصحة قبل الغذاء والنوم {cite:canon-ibn-sina-print-v1 p.221}."
  en: "Ibn Sina opens the second lesson of Fann 3, on the common regimen of adults in seventeen chapters, with chapter 1 on exercise in general. He defines it as a voluntary movement that forces large, frequent breathing, and puts it first in the keeping of health, before food and sleep {cite:canon-ibn-sina-print-v1 p.221}."
  es: "Ibn Sina inicia la segunda lección de Fann 3, sobre la rutina diaria de los adultos, que consta de diecisiete capítulos, con el capítulo 1 dedicado al ejercicio en general. Lo define como un movimiento voluntario que fuerza una respiración amplia y frecuente, y lo sitúa en primer lugar para el mantenimiento de la salud, antes que la comida y el sueño {cite:canon-ibn-sina-print-v1 p.221}."
  fr: "Ibn Sina ouvre la deuxième leçon du chapitre 3 de Fann, consacré au régime alimentaire des adultes en dix-sept chapitres, par le premier chapitre sur l'exercice physique en général. Il le définit comme un mouvement volontaire qui provoque une respiration ample et fréquente, et le place au premier rang des mesures de maintien de la santé, avant même l'alimentation et le sommeil {cite:canon-ibn-sina-print-v1 p.221}."
