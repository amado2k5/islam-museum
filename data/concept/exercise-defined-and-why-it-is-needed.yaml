summary:
  ar: "يفتتح ابن سينا التعليم الثاني من الفن الثالث، في التدبير المشترك للبالغين وهو سبعة عشر فصلاً، بالفصل الأول في جملة القول في الرياضة، فيعرفها بأنها حركة إرادية تضطر إلى تنفس عظيم متواتر، ويجعلها أول ما يُبدأ به في حفظ الصحة قبل الغذاء والنوم {cite:canon-ibn-sina-print-v1 p.221}."
  en: "Ibn Sina opens the second lesson of Fann 3, on the common regimen of adults in seventeen chapters, with chapter 1 on exercise in general. He defines it as a voluntary movement that forces large, frequent breathing, and puts it first in the keeping of health, before food and sleep {cite:canon-ibn-sina-print-v1 p.221}."
