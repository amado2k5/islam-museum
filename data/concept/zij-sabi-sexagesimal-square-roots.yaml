label: { ar: "الجذر في الأعداد الستينية", en: "Square roots of sexagesimal quantities", ur: "ستینی اعداد کا جذر", es: "Raíces cuadradas de cantidades sexagesimales", fr: "Racines carrées de quantités sexagésimales", tr: "Altmışlık sayılardaki kök", id: "Akar dalam bilangan seksagesimal" }
summary:
  ar: "يعرّف البتاني الجذر بأنه العدد الذي إذا ضرب في مثله كان المجتمع منه العدد المفروض، ثم يبين أن جذر الدرج درج وأن جذر الأجناس الزوجية التي دون الدرج كالثواني والروابع والسوادس يكون من الجنس الأرفع منه بمقدار النصف، وأن الأجناس الفردية كالدقائق والثوالث لا جذر محدوداً لها إلا إذا بُسطت إلى الجنس الذي دونها حتى تصير زوجية. {cite:zij-sabi-nallino-byblion pp.14-15}."
  en: "Al-Battani defines the root as the number which multiplied by itself gives the given number, then shows that the root of degrees is degrees, that the root of the even orders below the degree, seconds, fourths and sixths, falls in the higher order at half the distance, and that the odd orders, minutes and thirds, have no definite root unless they are extended to the order beneath them until they become even. {cite:zij-sabi-nallino-byblion pp.14-15}."
  ur: "البتانی جذر کی تعریف اس عدد کے طور پر کرتے ہیں جو اپنے ہی مثل سے ضرب پائے تو مفروض عدد حاصل ہو، پھر بتاتے ہیں کہ درجوں کا جذر درجے ہے، درجے سے نیچے کی جفت اجناس، یعنی ثوانی، روابع اور سوادس، کا جذر آدھے فاصلے کے برابر اوپر والی جنس میں آتا ہے، اور طاق اجناس، دقائق اور ثوالث، کا کوئی محدود جذر نہیں جب تک انہیں نیچے والی جنس تک پھیلا کر جفت نہ بنا لیا جائے۔ {cite:zij-sabi-nallino-byblion pp.14-15}۔"
  es: "Al-Battani define la raíz como el número que, multiplicado por sí mismo, da como resultado el número dado. Luego demuestra que la raíz de los grados es el número de grados, que la raíz de los órdenes pares inferiores al grado (segundos, cuartos y sextos) se encuentra en el orden superior a la mitad de la distancia, y que los órdenes impares (minutos y tercios) no tienen una raíz definida a menos que se extiendan al orden inferior hasta que se conviertan en pares. {cite:zij-sabi-nallino-byblion pp.14-15}."
  fr: "Al-Battani définit la racine comme le nombre qui, multiplié par lui-même, donne le nombre donné. Il démontre ensuite que la racine des degrés est 2^n degrés, que la racine des ordres pairs inférieurs au degré (secondes, quartes et sixièmes) se trouve à mi-chemin de l'ordre supérieur, et que les ordres impairs (minutes et tierces) n'ont pas de racine définie à moins d'être étendus à l'ordre inférieur jusqu'à ce qu'ils deviennent pairs. {cite:zij-sabi-nallino-byblion pp.14-15}."
  tr: "El-Battani, kökü, kendisiyle çarpıldığında verilen sayının toplamını veren sayı olarak tanımlar. Daha sonra, bir derecenin kökünün bir derece olduğunu ve bir derecenin altındaki çift sınıfların (ikinci, dördüncü ve altıncı sınıflar gibi) kökünün, bir üst sınıfın yarısı olduğunu açıklar. Ayrıca, dakika ve üçte bir gibi tek sınıfların, alt sınıfa genişletilip çift hale gelene kadar sabit bir kökü olmadığını belirtir. {cite:zij-sabi-nallino-byblion pp.14-15}."
  id: "Al-Battani mendefinisikan akar sebagai bilangan yang, jika dikalikan dengan dirinya sendiri, menghasilkan jumlah bilangan yang diberikan. Kemudian ia menjelaskan bahwa akar suatu derajat adalah derajat itu sendiri, dan bahwa akar kelas genap di bawah suatu derajat, seperti kelas kedua, keempat, dan keenam, adalah setengah dari kelas di atasnya. Ia juga menyatakan bahwa kelas ganjil, seperti menit dan sepertiga, tidak memiliki akar tetap kecuali jika diperluas ke kelas di bawahnya hingga menjadi genap. {cite:zij-sabi-nallino-byblion pp.14-15}."
