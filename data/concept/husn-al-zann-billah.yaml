id: concept/husn-al-zann-billah
class: concept
kind: ethical
label:
  ar: "حسن الظن بالله"
  en: "Good opinion of God and optimism (husn al-zann billah)"
  ur: "اللہ کے ساتھ حسن ظن اور امید (حسن الظن باللہ)"
summary:
  ar: "يعرض الشيخ عمر عبد الكافي حسن الظن بالله بوصفه رجاء المؤمن في الخير والفرج، ويعرّف الاستبشار بأنه توقّع الخير، وينتقد التشاؤم، ويستشهد بقصة يعقوب، ويرى أن اليأس ليس من صفة المؤمن."
  en: "Sheikh Omar Abdelkafy presents good opinion of God as the believer's hope in good and in relief; he defines istibshar as expecting good, criticises pessimism, cites the story of Jacob, and holds that despair is not a quality of the believer."
  ur: "شیخ عمر عبدالکافی اللہ کے ساتھ حسن ظن کو مومن کی بھلائی اور آسانی کی امید کے طور پر پیش کرتے ہیں؛ وہ استبشار کو بھلائی کی توقع کہتے ہیں، مایوسی پر تنقید کرتے ہیں، یعقوب کے واقعے سے استدلال کرتے ہیں، اور کہتے ہیں کہ مایوسی مومن کی صفت نہیں۔"
