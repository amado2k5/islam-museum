label: { ar: "الطب النظري والعملي وعلما حفظ الصحة والعلاج", en: "Theoretical and practical medicine, and the two sciences of preserving health and of treatment", ur: "طب نظری و عملی اور حفظ صحت و علاج کے دو علم", es: "Medicina teórica y práctica, y las dos ciencias de la preservación de la salud y del tratamiento.", fr: "La médecine théorique et la médecine pratique, ainsi que les deux sciences de la préservation de la santé et du traitement" }
summary:
  ar: "يفتتح ابن سينا الفن الثالث من الكتاب الأول بتقسيم الطب إلى جزء نظري وجزء عملي، ثم تقسيم العملي إلى علم حفظ الصحة وعلم العلاج، ويعلن أن الفن الأول استوفى الجزء النظري الكلي وأن ما بعده للعملي على نحو كلي {cite:canon-ibn-sina-print-v1 p.200}."
  en: "Ibn Sina opens Fann 3 of Book I by dividing medicine into a theoretical part and a practical part, then dividing the practical into the science of preserving health and the science of treatment. He states that Fann 1 finished the general theoretical part and that what follows turns to the practical part in general terms {cite:canon-ibn-sina-print-v1 p.200}."
  es: "Ibn Sina inicia el Fann 3 del Libro I dividiendo la medicina en una parte teórica y otra práctica, y luego subdividiendo la práctica en la ciencia de la conservación de la salud y la ciencia del tratamiento. Afirma que el Fann 1 concluyó la parte teórica general y que lo que sigue se centra en la parte práctica en términos generales {cite:canon-ibn-sina-print-v1 p.200}."
  fr: "Ibn Sina ouvre le chapitre 3 du Livre I en divisant la médecine en une partie théorique et une partie pratique, puis en subdivisant cette dernière en science de la préservation de la santé et science du traitement. Il précise que le chapitre 1 achève la partie théorique générale et que la suite aborde la partie pratique de manière générale {cite:canon-ibn-sina-print-v1 p.200}."
