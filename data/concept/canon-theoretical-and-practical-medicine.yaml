summary:
  ar: "يفتتح ابن سينا الفن الثالث من الكتاب الأول بتقسيم الطب إلى جزء نظري وجزء عملي، ثم تقسيم العملي إلى علم حفظ الصحة وعلم العلاج، ويعلن أن الفن الأول استوفى الجزء النظري الكلي وأن ما بعده للعملي على نحو كلي {cite:canon-ibn-sina-print-v1 p.200}."
  en: "Ibn Sina opens Fann 3 of Book I by dividing medicine into a theoretical part and a practical part, then dividing the practical into the science of preserving health and the science of treatment. He states that Fann 1 finished the general theoretical part and that what follows turns to the practical part in general terms {cite:canon-ibn-sina-print-v1 p.200}."
