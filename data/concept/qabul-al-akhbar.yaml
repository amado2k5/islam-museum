id: concept/qabul-al-akhbar
class: concept
kind: doctrine
label: { ar: "قبول الأخبار", en: "The acceptance of reports", es: "La aceptación de informes", fr: "L'acceptation des rapports", ur: "رپورٹس کی قبولیت", tr: "Haberleri Kabul Et", id: "Terima Berita" }
summary:
  ar: "ذهبت طائفة إلى أن الأخبار التي تقطع العذر وتوجب العلم والعمل هي أخبار الاستفاضة ما رواه الكافة عن الكافة وما عداها غير واجب قبوله، وذهب الجمهور من فقهاء الأمصار إلى قبول خبر التواتر وأوجبوا العمل بخبر الواحد وزعموا أنه موجب للعمل دون العلم بأوصاف ذكروها، وأوضح المسعودي أن أخبار النسناس والعنقاء وخلق الخيل في حيز الجائز الممكن لا الواجب ولا الممتنع وهي لاحقة بالإسرائيليات وعجائب البحار {cite:muruj-al-dhahab p. 529-530}."
  en: "The schools' rules for reports: mutawatir obliging knowledge and action, the single report obliging action but not knowledge — and al-Mas'udi placing tales of the nasnas, the 'anqa and the horse's creation in the realm of the possible, ranking with Isra'iliyyat and sea-marvels {cite:muruj-al-dhahab p. 529-530}."
  es: "Las reglas de las escuelas para los informes: mutawatir obliga conocimiento y acción, el informe único obliga acción pero no conocimiento, y al-Mas'udi coloca los relatos de los nasnas, el 'anqa y la creación del caballo en el reino de lo posible, equiparándolos con Isra'iliyyat y las maravillas marinas {cite:muruj-al-dhahab p. 529-530}."
  fr: "Les règles des écoles concernant les rapports: le mutawatir exigeant la connaissance et l'action, le rapport unique exigeant l'action mais pas la connaissance — et al-Mas'udi plaçant les récits des nasnas, de l''anqa et de la création du cheval dans le domaine du possible, au même titre que les Isra'iliyyat et les merveilles marines {cite:muruj-al-dhahab p. 529-530}."
  ur: "رپورٹوں کے لیے مکاتب کے اصول: متواتیر علم و عمل کو واجب کرتا ہے، واحد رپورٹ جو عمل کو واجب کرتی ہے لیکن علم نہیں - اور المسعودی ناسنا کی کہانیاں، عنقا اور گھوڑے کی تخلیق کو ممکن کے دائرے میں پیش کرتا ہے، اسرافیلیت اور سمندری معجزات کے ساتھ درجہ بندی کرتا ہے۔ 529-530}۔"
  tr: "Bir grup, mazeretleri ortadan kaldıran ve bilgi ile eylem gerektiren raporların kapsamlı anlatımlar olduğunu, herkes tarafından başkalarından aktarıldığını, diğerlerinin kabul etmek zorunda olmadığını savundu. Bölgelerden gelen hukukçuların çoğu, tawatur (toplu aktarım) raporunu kabul etti ve tek bir rapora göre hareket etmeyi zorunlu kıldı; belirttikleri tanımları bilmeden hareket etmenin zorunlu olduğunu iddia etti. El-Mas'udi, Tanna, anka kuşu ve atların yaratılışının izinli olanın alanına girdiğini, zorunlu ya da imkansız değil, ve bunların İsra'iliyyat ile denizlerin mucizelerini takip ettiğini belirtti {atıf:muruj-al-dhahab, s. 529-530}."
  id: "Sebuah kelompok berpendapat bahwa laporan yang menghilangkan alasan dan memerlukan pengetahuan serta tindakan adalah laporan dengan narasi luas, yang diceritakan oleh semua orang lain, dan yang lain tidak wajib menerima. Mayoritas ahli hukum dari daerah menerima laporan tawatur (transmisi massal) dan mewajibkan bertindak atas satu laporan, dengan alasan bahwa tindakan tanpa mengetahui deskripsi yang mereka sebutkan wajib adalah wajib. Al-Mas'udi menjelaskan bahwa laporan tentang Tanna, burung phoenix, dan penciptaan kuda termasuk dalam ranah yang diperbolehkan, bukan wajib atau mustahil, dan mereka mengikuti Isra'iliyyat dan keajaiban laut {cite:muruj-al-dhahab, hlm. 529-530}."
