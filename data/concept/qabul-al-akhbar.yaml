id: concept/qabul-al-akhbar
class: concept
kind: doctrine
label: { ar: "قبول الأخبار", en: "The acceptance of reports" }
summary:
  ar: "ذهبت طائفة إلى أن الأخبار التي تقطع العذر وتوجب العلم والعمل هي أخبار الاستفاضة ما رواه الكافة عن الكافة وما عداها غير واجب قبوله، وذهب الجمهور من فقهاء الأمصار إلى قبول خبر التواتر وأوجبوا العمل بخبر الواحد وزعموا أنه موجب للعمل دون العلم بأوصاف ذكروها، وأوضح المسعودي أن أخبار النسناس والعنقاء وخلق الخيل في حيز الجائز الممكن لا الواجب ولا الممتنع وهي لاحقة بالإسرائيليات وعجائب البحار {cite:muruj-al-dhahab p. 529-530}."
  en: "The schools' rules for reports: mutawatir obliging knowledge and action, the single report obliging action but not knowledge — and al-Mas'udi placing tales of the nasnas, the 'anqa and the horse's creation in the realm of the possible, ranking with Isra'iliyyat and sea-marvels {cite:muruj-al-dhahab p. 529-530}."
