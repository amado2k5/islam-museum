id: "concept/asbab-al-kazaz"
class: "concept"
kind: "scientific"
label:
  ar: "أسباب الكزاز"
  en: "Causes of tetanus"
  fr: "Causes du tétanos"
  ur: "كزاز کے اسباب"
  es: "Causas del tétanos"
  tr: "Tetanosun Nedenleri"
  id: "Penyebab Tetanus"
summary:
  ar: "أسباب الكزاز شبيهة بأسباب التشنج من وجه مخالفة لها من وجه: تشبهها في أنه قد يكون من امتلاء ومن يبوسة ولأذى يلحق الأعضاء العصبية ومن أورام، وتخالفها في أن التشنج في النادر يكون من الريح والكزاز كثيراً ما يكون عن ريح ممددة، ولأن السبب في الكزاز المادي يقع في الخلاف {cite:canon-ibn-sina-print-v2 p.150}"
  en: "The causes of tetanus are like convulsion's causes in one respect and unlike them in another: like them in that it may come from repletion, dryness, an injury reaching the nervous organs, and swellings; unlike in that convulsion is rarely from wind while tetanus is often from an extending wind, and in that the cause in material tetanus falls differently in the tissue {cite:canon-ibn-sina-print-v2 p.150}"
  fr: "Les causes du tétanos ressemblent à celles de la convulsion sous un aspect et en diffèrent sous un autre : elles leur ressemblent en ce qu’il peut venir de la réplétion, de la sécheresse, d’une lésion atteignant les organes nerveux et de gonflements ; elles en diffèrent en ce que la convulsion vient rarement du vent, tandis que le tétanos vient souvent d’un vent qui étend, et en ce que la cause du tétanos matériel se dépose autrement dans le tissu {cite:canon-ibn-sina-print-v2 p.150}"
  ur: "كزاز کے اسباب ایک پہلو سے تشنج کے اسباب جیسے اور ایک پہلو سے ان کے خلاف ہیں: اس لیے جیسے کہ وہ امتلاء، یبوسہ، اعصابی اعضا کو پہنچنے والی تکلیف اور ورموں سے ہو سکتا ہے؛ اور اس لیے خلاف کہ تشنج شاذ ہی ہوا سے ہوتا ہے مگر کزاز اکثر ممدد کرنے والی ہوا سے ہوتا ہے، اور یہ کہ مادی کزاز کا سبب خلل میں مختلف ڈھنگ سے واقع ہوتا ہے {cite:canon-ibn-sina-print-v2 p.150}۔"
  es: "Las causas del tétanos se asemejan a las de las convulsiones en un aspecto y difieren en otro: se asemejan en que pueden deberse a la saciedad, la sequedad, una lesión que afecte a los órganos nerviosos y la inflamación; difieren en que las convulsiones rara vez se deben a gases, mientras que el tétanos suele deberse a gases persistentes, y en que la causa del tétanos material afecta de manera diferente al tejido {cite:canon-ibn-sina-print-v2 p.150}"
  tr: "Tetanosun nedenleri bazı açılardan nöbetlere benzer: dolgunluk veya kuruluk, sinir organlarına zarar ve tümörler gibi nedenlerle benzerler. Farklılıkları şudur: spazmlar nadiren rüzgardan kaynaklanır, tetanos ise çoğunlukla uzun süren rüzgardan kaynaklanır ve fiziksel tetanosun nedeni tartışmalıdır {cite:canon-ibn-sina-print-v2 s.150}"
  id: "Penyebab tetanus mirip dengan kejang dalam beberapa hal: mirip dengan kejang, bisa disebabkan oleh kenyang atau kekeringan, kerusakan organ saraf, dan tumor. Perbedaan ini adalah kejang jarang terjadi akibat angin, dan tetanus sering disebabkan oleh angin yang berkepanjangan, serta karena penyebab tetanus fisik masih diperdebatkan {cite:canon-ibn-sina-print-v2 hlm.150}"
