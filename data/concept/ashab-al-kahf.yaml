summary:
  ar: "يصف الشيخ عمر عبد الكافي الكهف الذي لجأ إليه الفتية بأنه ضيق مظلم، ويقول إنهم لجأوا إليه بلا أي علامة سابقة على الفرج. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:29:30}"
  en: "Sheikh Omar Abdelkafy describes the cave in which the young men took refuge as narrow and dark, and says they went into it without any prior sign of relief. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:29:30}"
  fr: "Le cheikh Omar Abdelkafy décrit la caverne où se réfugièrent les jeunes gens comme étroite et sombre, et dit qu’ils y entrèrent sans aucun signe préalable de soulagement. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:29:30}"
  ur: "شیخ عمر عبد الکافی اس غار کو، جس میں نوجوانوں نے پناہ لی، تنگ اور تاریک بتاتے ہیں اور کہتے ہیں کہ انہوں نے آسانی کی کسی پیشگی علامت کے بغیر اس میں پناہ لی۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:29:30}"
  es: "El jeque Omar Abdelkafy describe la cueva en la que se refugiaron los jóvenes como estrecha y oscura, y afirma que entraron en ella sin ninguna señal previa de alivio. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:29:30}"
  tr: "Şeyh Ömer Abdul Kafi, çocukların sığındığı mağarayı dar, karanlık olarak tanımlar ve orada sığınak aradıklarını ancak bir rahatlama belirtisi olmadan aradıklarını belirtir. {kaynak:assabile-omar-abdelkafy tafsir-al-kuran-al-kareem/ep04 00:29:30}"
  id: "Sheikh Omar Abdul Kafi menggambarkan gua tempat anak-anak itu berlindung sebagai sempit, gelap, dan mengatakan mereka mencari perlindungan di sana tanpa tanda-tanda kelegaan. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:29:30}"
