id: concept/zij-sabi-above-or-below-the-horizon-test
class: concept
kind: scientific
label: { ar: "امتحان الدرجة فوق الأرض أو تحتها", en: "The test whether a degree lies above or below the earth", ur: "درجہ زمین کے اوپر ہے یا نیچے، اس کا امتحان", es: "La prueba para determinar si un grado está por encima o por debajo de la tierra.", fr: "Le test permettant de déterminer si un degré se situe au-dessus ou en dessous de la terre", tr: "Sınav notu, yer seviyesinin üstünde veya altında.", id: "Nilai ujian di atas atau di bawah rata-rata" }
summary:
  ar: "إذا كانت الدرجة فيما بين درجة الطالع ودرجة الغارب على توالي البروج فهي تحت الأرض، وإذا كانت فيما بين درجة الغارب ودرجة الطالع على توالي البروج فهي فوق الأرض. وتُعرف بجهة أخرى بأن يُنظر إلى نصف مكث الكوكب فوق الأرض: فإن كان أكثر من الأزمان التي بين وسط السماء والدرجة التي تتوسط السماء في الفلك المستقيم فهو فوق الأرض، وإن كان أقل فتحت الأرض. {cite:zij-sabi-nallino-byblion pp.203-204}"
  en: "If the degree lies between the rising degree and the setting degree in the order of the signs, it is below the earth; if it lies between the setting degree and the rising degree in that order, it is above the earth. A second test uses the half-duration of the star above the earth: if it is more than the time between the midheaven and the degree culminating with it on the straight sphere, the star is above the earth; if less, below it. {cite:zij-sabi-nallino-byblion pp.203-204}"
  ur: "اگر درجہ طالع کے درجے اور غارب کے درجے کے درمیان توالیِ بروج کی ترتیب میں ہو تو وہ زمین کے نیچے ہے، اور اگر غارب کے درجے اور طالع کے درجے کے درمیان ہو تو زمین کے اوپر۔ ایک اور امتحان ستارے کے زمین کے اوپر کے نصف مکث سے ہے: اگر وہ وسط السماء اور اس درجے کے درمیان فلکِ مستقیم کے وقت سے زیادہ ہو جو اس کے ساتھ وسط السماء پر آتا ہے تو وہ اوپر ہے، کم ہو تو نیچے۔ {cite:zij-sabi-nallino-byblion pp.203-204}"
  es: "Si el grado se encuentra entre el grado ascendente y el grado descendente en el orden de los signos, está por debajo de la Tierra; si se encuentra entre el grado descendente y el grado descendente en ese orden, está por encima de la Tierra. Una segunda prueba utiliza la mitad de la duración de la estrella sobre la Tierra: si es mayor que el tiempo entre el medio cielo y el grado que culmina con él en la esfera recta, la estrella está por encima de la Tierra; si es menor, está por debajo. {cite:zij-sabi-nallino-byblion pp.203-204}"
  fr: "Si le degré se situe entre le degré ascendant et le degré couchant dans l'ordre des signes, l'étoile est sous la Terre; s'il se situe entre le degré couchant et le degré ascendant, l'étoile est au-dessus de la Terre. Un second test utilise la demi-durée de l'étoile au-dessus de la Terre: si elle est supérieure à la durée entre le milieu du ciel et le degré qui y culmine sur la sphère droite, l'étoile est au-dessus de la Terre; si elle est inférieure, elle est sous la Terre. {cite:zij-sabi-nallino-byblion pp.203-204}"
  tr: "Eğer bir derece, zodyaktaki yükselen ve batan derece arasındaysa, Dünya'nın altındadır; eğer zodyaktaki batan derece ile yükselen derece arasındaysa, Dünya'nın üzerindedir. Ayrıca, gezegenin Dünya'nın üzerinde geçirdiği sürenin yarısı dikkate alınarak da belirlenebilir: eğer bu süre, zenit ile düz gök küresinde gökyüzünü ayıran derece arasındaki süreden daha büyükse, Dünya'nın üzerindedir; eğer daha küçükse, Dünya'nın altındadır. {cite:zij-sabi-nallino-byblion pp.203-204}"
  id: "Jika derajatnya berada di antara derajat ascendant dan derajat matahari terbenam di zodiak, maka planet tersebut berada di bawah Bumi; jika berada di antara derajat matahari terbenam dan derajat ascendant di zodiak, maka planet tersebut berada di atas Bumi. Hal ini juga dapat ditentukan dengan mempertimbangkan separuh waktu yang dihabiskan planet di atas Bumi: jika lebih besar dari waktu antara zenit dan derajat yang berada di tengah langit dalam bola langit lurus, maka planet tersebut berada di atas Bumi; jika lebih kecil, maka planet tersebut berada di bawah Bumi. {cite:zij-sabi-nallino-byblion pp.203-204}"
