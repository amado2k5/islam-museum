label: { ar: الأشهب, en: "Al-ashhab (white or grey horse)", es: "Al-ashhab (caballo blanco o gris)", fr: "Al-ashhab (cheval blanc ou gris)", ur: "الشھب ⁦(سفید یا سرمئی گھوڑا)⁩", tr: "Ashhab", id: "Ashhab" }
summary:
  ar: "الأشهب: الجواد الأبيض وما يتفرع عنه من درجات تُخلط بالأسود أو الأصفر أو الأحمر أو الأزرق؛ أول مجموعة الألوان في تصاوير الخيل التيمورية عند فايد، وفيه القرطاسي الناصع الذي كان مركب الملوك."
  en: "Al-ashhab: the white horse and its shades, mixed with black, yellow, red or blue; the first colour group in Fayed's account of Timurid horse painting, including the pure-white al-qirtasi, the mount of kings."
  es: "Al-ashhab: el caballo blanco y sus tonalidades, mezcladas con negro, amarillo, rojo o azul; el primer grupo de colores en la descripción que hace Fayed de la pintura de caballos timúridas, que incluye el blanco puro al-qirtasi, la montura de los reyes."
  fr: "Al-ashhab: le cheval blanc et ses nuances, mêlées de noir, de jaune, de rouge ou de bleu; le premier groupe de couleurs dans le récit de Fayed sur la peinture de chevaux timourides, y compris le blanc pur al-qirtasi, la monture des rois."
  ur: "الشہب: سفید گھوڑا اور اس کے رنگ، سیاہ، پیلے، سرخ یا نیلے رنگ کے ساتھ ملے ہوئے؛ تیموری گھوڑوں کی پینٹنگ کے فائید کے اکاؤنٹ میں پہلا رنگ گروپ، بشمول خالص سفید القرطاسی، بادشاہوں کا پہاڑ۔"
  tr: "Al-Ashhab: beyaz at ve alt tonları, siyah, sarı, kırmızı veya mavi ile karışır; Timuri atının Fayed'deki tasvirlerindeki ilk renk grubu ve kralın teknesi olan parlak kırtasiye malzemesini içerir."
  id: "Al-Ashhab: kuda putih dengan nuansanya, bercampur hitam, kuning, merah, atau biru; Kelompok warna pertama dalam penggambaran kuda Timurid di Fayed dan bahan alat tulis mengkilap yang merupakan perahu raja."
