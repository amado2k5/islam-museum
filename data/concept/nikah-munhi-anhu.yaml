id: concept/nikah-munhi-anhu
class: concept
kind: legal
label:
  ar: "النِّكَاح المَنْهِيّ عَنْهُ"
  en: "Forbidden marriage (nikah munhi 'anhu)"
  ur: "منہی عنہ نکاح"
  es: "Matrimonio prohibido (nikah munhi 'anhu)"
  fr: "Mariage interdit (nikah munhi 'anhu)"
  tr: "Yasaklanan Evlilik"
  id: "Pernikahan Terlarang"
summary:
  ar: "النكاح المنهي عنه هو الذي ورد من الشارع النهي عنه، وتعرض الموسوعة أنواعه في الجاهلية، كنكاح الرايات ونكاح الرهط ونكاح الاستبضاع، ثم نكاح الشغار وأحكامه عند المذاهب الأربعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16154} ويتفق الفقهاء على تحريم الشغار، ويختلفون في علته: فعند المالكية خلو النكاح من الصداق، وعند أكثر الشافعية الاشتراك في البضع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16156}"
  en: "A forbidden marriage is one the lawgiver has forbidden. The encyclopedia sets out the pre-Islamic forms, the marriage of banners, the marriage of a group and the marriage of seeking offspring, and then the marriage of exchange (shighar) with each school's ruling. The jurists agree that shighar is forbidden and differ on its ground: for the Malikis the absence of a dower, for most Shafi'is the sharing of the sexual part. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16154} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16156}"
  ur: "منہی عنہ نکاح وہ ہے جس سے شارع نے منع کیا۔ موسوعہ جاہلیت کی اقسام بیان کرتی ہے، جیسے نکاحِ رایات، نکاحِ رہط اور نکاحِ استبضاع، پھر نکاحِ شغار اور اس کے احکام۔ فقہاء شغار کی حرمت پر متفق ہیں اور علت میں مختلف ہیں: مالکیہ کے نزدیک مہر کا نہ ہونا، اور شافعیہ کے اکثر کے نزدیک بضع میں اشتراک۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16154} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16156}"
  es: "Un matrimonio prohibido es aquel que el legislador ha prohibido. La enciclopedia expone las formas preislámicas: el matrimonio de estandartes, el matrimonio de un grupo y el matrimonio con fines de procreación, y luego el matrimonio de intercambio (shighar) con la interpretación de cada escuela. Los juristas coinciden en que el shighar está prohibido y difieren en su fundamento: para los malikíes, la ausencia de dote; para la mayoría de los shafi'íes, el reparto de la parte sexual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16154} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16156}"
  fr: "Un mariage interdit est un mariage prohibé par le législateur. L'encyclopédie présente les formes préislamiques de ce type de mariage: le mariage d'alliance, le mariage de groupe et le mariage de désir d'enfant, puis le mariage d'échange (shighar), en précisant la position de chaque école de pensée. Les juristes s'accordent sur l'interdiction du shighar, mais divergent quant à son fondement: pour les malikites, l'absence de dot; pour la plupart des shafi'ites, le partage des relations sexuelles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16154} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16156}"
  tr: "Yasaklı evlilik, Kanun Sahibi tarafından yasaklanan evliliktir. Ansiklopedi, İslam öncesi dönemde bayrak evliliği, grup evliliği ve İstibuda evliliği gibi türlerini sunar; ardından genç erkeklerin evliliği ve dört düşünce okuluna göre hükümleri. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.16154} Hukukçular çocuk sayısının yasaklanması konusunda hemfikir ancak nedeni konusunda farklılık göstermektedir: Malikilere göre evlilik çeyizden muaftır, çoğu Şafi'ye ise ilişkiye katılımı kabul eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16156}"
  id: "Pernikahan yang dilarang adalah yang telah dilarang oleh Pemberi Hukum. Ensiklopedia ini menampilkan jenis-jenisnya pada era pra-Islam, seperti pernikahan bendera, pernikahan kelompok, dan pernikahan Istibuda, kemudian pernikahan para pemuda dan keputusannya menurut empat aliran pemikiran. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16154} Para ahli hukum sepakat tentang larangan jumlah anak tetapi berbeda pendapat dalam penyebabnya: menurut Maliki, pernikahan bebas dari mas kawin, sementara sebagian besar Syafi'i mempertimbangkan partisipasi dalam hubungan seksual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16156}"
