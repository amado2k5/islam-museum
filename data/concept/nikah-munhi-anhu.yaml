label:
  ar: "النِّكَاح المَنْهِيّ عَنْهُ"
  en: "Forbidden marriage (nikah munhi 'anhu)"
  ur: "منہی عنہ نکاح"
summary:
  ar: "النكاح المنهي عنه هو الذي ورد من الشارع النهي عنه، وتعرض الموسوعة أنواعه في الجاهلية، كنكاح الرايات ونكاح الرهط ونكاح الاستبضاع، ثم نكاح الشغار وأحكامه عند المذاهب الأربعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16154} ويتفق الفقهاء على تحريم الشغار، ويختلفون في علته: فعند المالكية خلو النكاح من الصداق، وعند أكثر الشافعية الاشتراك في البضع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16156}"
  en: "A forbidden marriage is one the lawgiver has forbidden. The encyclopedia sets out the pre-Islamic forms, the marriage of banners, the marriage of a group and the marriage of seeking offspring, and then the marriage of exchange (shighar) with each school's ruling. The jurists agree that shighar is forbidden and differ on its ground: for the Malikis the absence of a dower, for most Shafi'is the sharing of the sexual part. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16154} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16156}"
  ur: "منہی عنہ نکاح وہ ہے جس سے شارع نے منع کیا۔ موسوعہ جاہلیت کی اقسام بیان کرتی ہے، جیسے نکاحِ رایات، نکاحِ رہط اور نکاحِ استبضاع، پھر نکاحِ شغار اور اس کے احکام۔ فقہاء شغار کی حرمت پر متفق ہیں اور علت میں مختلف ہیں: مالکیہ کے نزدیک مہر کا نہ ہونا، اور شافعیہ کے اکثر کے نزدیک بضع میں اشتراک۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16154} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16156}"
