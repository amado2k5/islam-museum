id: concept/canon-hot-brain-swelling-in-infants
class: concept
kind: scientific
label:
  ar: "الورم الحار في دماغ الصبيان عند ابن سينا"
  en: "Hot swelling in the infant's brain in the Canon"
  fr: "Gonflement chaud cérébral du nourrisson dans le Canon"
  ur: "قانون میں بچوں کے دماغ کی گرم سوجن"
  es: "Hinchazón caliente en el cerebro del bebé en el Canon"
  tr: "İbn Sina'ya göre erkek çocukların beyninde ateşli tümör"
  id: "Tumor demam di otak anak laki-laki menurut Avicenna"
summary:
  ar: "يذكر ابن سينا ورماً حاراً يعرض في دماغ الصبيان ويسميه العطاس، يصل وجعه إلى العين والحلق ويصفر له الوجه، وعلاجه بتبريد الدماغ وترطيبه بالقشور والعصارات والأدهان {cite:canon-ibn-sina-print-v1 p.215}."
  en: "Ibn Sina mentions a hot swelling that befalls the brain of infants, which he calls al-'utas; its pain often reaches the eye and the throat and the face turns yellow, and it is treated by cooling and moistening the brain with peels, juices and oils {cite:canon-ibn-sina-print-v1 p.215}."
  fr: "Ibn Sina décrit le gonflement chaud cérébral infantile nommé al-'utas, douleur gagnant souvent œil et gorge, visage jaune ; il décrit refroidissement et humidification par écorces, sucs et huiles {cite:canon-ibn-sina-print-v1 p.215}."
  es: "Ibn Sina menciona una inflamación caliente que afecta al cerebro de los bebés, a la que llama al-'utas; su dolor a menudo llega al ojo y a la garganta y la cara se pone amarilla, y se trata enfriando y humedeciendo el cerebro con cáscaras, jugos y aceites {cite:canon-ibn-sina-print-v1 p.215}."
  ur: "ابن سینا نے ایک گرم سوجن کا ذکر کیا ہے جو شیر خوار بچوں کے دماغ پر پڑتی ہے، جسے وہ الطاس کہتے ہیں۔ اس کا درد اکثر آنکھ اور گلے تک پہنچ جاتا ہے اور چہرہ زرد ہو جاتا ہے، اور اس کا علاج دماغ کو چھلکوں، جوس اور تیل سے ٹھنڈا اور تر کر کے کیا جاتا ہے۔"
  tr: "İbn Sina, erkek çocukların beyninde ortaya çıkan sıcak bir tümörden bahseder ve buna hapşırma der; ağrısı gözlere ve boğaza ulaşır ve yüzün sararmasına neden olur. Tedavisi beynin soğutulması ve peeling, meyve suyu ve merhemlerle nemlendirilmesiyle yapılır {cite:canon-ibn-sina-print-v1 s.215}."
  id: "Ibn Sina menyebutkan tumor panas yang muncul di otak anak laki-laki dan menyebutnya bersin; rasa sakitnya mencapai mata dan tenggorokan sehingga wajah menjadi kuning. Pengobatannya adalah dengan mendinginkan otak dan melembapkannya menggunakan kulit, jus, dan salep {cite:canon-ibn-sina-print-v1 hlm.215}."
