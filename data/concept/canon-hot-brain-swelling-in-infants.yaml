summary:
  ar: "يذكر ابن سينا ورماً حاراً يعرض في دماغ الصبيان ويسميه العطاس، يصل وجعه إلى العين والحلق ويصفر له الوجه، وعلاجه بتبريد الدماغ وترطيبه بالقشور والعصارات والأدهان {cite:canon-ibn-sina-print-v1 p.215}."
  en: "Ibn Sina mentions a hot swelling that befalls the brain of infants, which he calls al-'utas; its pain often reaches the eye and the throat and the face turns yellow, and it is treated by cooling and moistening the brain with peels, juices and oils {cite:canon-ibn-sina-print-v1 p.215}."
