id: concept/sharika
class: concept
kind: term
tags: [islamic-economy-browser, islamic-economy-money]
label:
  ar: "الشركة"
  en: "Partnership (sharika)"
  es: "Asociación (shariká)"
  fr: "Partenariat (sharika)"
  ur: "شراکت داری ⁦(شاریقہ)⁩"
  tr: "Şirket"
  id: "Perusahaan"
summary:
  ar: "يبين المؤلف أن الإسلام ندب إلى الشركات لما فيها من التعاون، ويجمع أنواعها في شركات الزراعة ⁦(المزارعة والمساقاة والمغارسة)⁩، وشركات التجارة ⁦(المضاربة وشركات الأموال والأبدان والوجوه)⁩، وأن الشركة تكبر بها المشروعات وتُدار بكفاءة أكبر {cite:usul-iqtisad-islami-0660 p. 114} {cite:usul-iqtisad-islami-0660 p. 143}."
  tr: "Yazar, İslam'ın şirketleri işbirliği için atadığını, türlerini tarım şirketleri (tarım, sulama ve ekim) ve ticaret şirketleri (mudarabah, finans, kurumlar ve yüz şirketleri) olarak gruplandırdığını ve şirketlerin projeleri büyüttüp daha verimli yönettiğini {cite:usul-iqtisad-islami-0660 s. 114} {cite:usul-iqtisad-islami-0660 s. 143} açıklıyor."
  id: "Penulis menjelaskan bahwa Islam menugaskan perusahaan untuk kerja sama, mengelompokkan jenisnya menjadi perusahaan pertanian (pertanian, penyiraman, dan penanaman), serta perusahaan perdagangan (mudarabah, keuangan, badan, dan perusahaan wajah), serta perusahaan mengembangkan proyek dan mengelolanya lebih efisien {cite:usul-iqtisad-islami-0660 hlm. 114} {cite:usul-iqtisad-islami-0660 hlm. 143}."
