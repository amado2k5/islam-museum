summary:
  ar: "الرعادة في الكتاب سمكة مخدرة، وفي الحاشية أنها سمك من مسه خدرت يده وارتعدت، ويقال إنها إذا وضعت على رأس المصدوع أذهبت الصداع، ويرى جالينوس أنها تفعل ذلك وهي حية لا ميتة، وينقل عن بولس أن الدهن الذي تطبخ فيه يسكن أوجاع المفاصل الحديثة {cite:canon-ibn-sina-print-v1 p.669}"
  en: "Raada is in the book a numbing fish, and the editor's note says it is a fish whose touch numbs the hand and makes it tremble; it is said that when it is laid on the head of one with a headache it takes the headache away, and Galen thinks it does so alive and not dead; and the book reports from Paul that the oil in which it is cooked soothes recent pains of the joints {cite:canon-ibn-sina-print-v1 p.669}"
  ur: "رعادہ کتاب میں ایک سن کر دینے والی مچھلی ہے، اور حاشیے میں ہے کہ یہ ایسی مچھلی ہے جسے چھونے سے ہاتھ سن ہو جاتا اور کانپنے لگتا ہے؛ کہا گیا ہے کہ اسے سر درد والے کے سر پر رکھا جائے تو درد لے جاتی ہے، اور جالینوس کا خیال ہے کہ وہ زندہ ہونے کی حالت میں ایسا کرتی ہے، مردہ نہیں؛ اور کتاب پولس سے نقل کرتی ہے کہ جس تیل میں اسے پکایا جائے وہ نئے جوڑوں کے دردوں کو سکون دیتا ہے {cite:canon-ibn-sina-print-v1 p.669}۔"
  es: "En el libro, Raada es un pez que adormece, y la nota del editor dice que es un pez cuyo tacto adormece la mano y la hace temblar; se dice que cuando se coloca sobre la cabeza de alguien con dolor de cabeza, este desaparece, y Galeno cree que lo hace vivo y no muerto; y el libro relata, según Pablo, que el aceite en el que se cocina alivia los dolores recientes de las articulaciones {cite:canon-ibn-sina-print-v1 p.669}"
