kids:
  ar: "الخمار ثوب تغطي به المرأة رأسها، واسمه من الستر والتغطية. في فقه الصلاة تغطي المرأة البالغة شعرها به، وفي الإحرام تخمر الرأس ولا تستر الوجه."
  en: "The khimar is a cloth a woman uses to cover her head — the word comes from \"covering\". In prayer, a grown woman covers her hair with it; in ihram she covers her head but not her face."
  ur: "خمار وہ کپڑا ہے جس سے عورت اپنا سر ڈھانپتی ہے — اس کا نام ہی ڈھانپنے سے ہے۔ نماز میں بالغ عورت اس سے بال چھپاتی ہے، اور احرام میں سر ڈھانپا جاتا ہے مگر چہرہ نہیں۔"
