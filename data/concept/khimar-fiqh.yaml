id: concept/khimar-fiqh
class: concept
kind: legal
label:
  ar: الخمار
  en: Khimar (women's head covering in fiqh)
  ur: خمار (سر کا دوپٹہ)
summary:
  ar: 'الخِمار من الخَمر وأصله الستر، وكل ما يستر شيئا فهو خماره، وغلب في العرف اسما لما تغطي به المرأة رأسها؛ وبعض الفقهاء يعرفونه بأنه ما يستر الرأس والصدغين أو العنق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7851} الألفاظ ذات الصلة: الحجاب (الستر، وهو أعم من الخمار)، والقناع (ما تتقنع به المرأة، والقناع عند بعض الفقهاء الثوب الذي يلقيه الرجل على كتفه)، والنقاب (ما تغطي به المرأة الوجه)، والبرقع (ما تستر به وجهها). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7851}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7852} ارتداء الحرة الخمار واجب شرعا لأن شعر رأسها عورة باتفاق، وقد أمرت المرأة بضرب الخمار على جيبها بقوله تعالى في سورة النور؛ وعائشة قالت: إنما يضرب بالخمار الكثيف الذي يستر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7852} المسح على الخمار في الوضوء: الحنفية والمالكية والشافعية لا يجزئ مسح الخمار وحده إلا إذا كان رقيقا ينفذ الماء منه إلى الشعر، والحنابلة اختلفوا فجوزه بعضهم بحديث أم سلمة والمعتمد عنهم، ومنعه أحمد في رواية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7852}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7853} الخمار في الصلاة: ستر شعر الحرة البالغة فرض في الصلاة، وصلاتها بغير خمار باطلة بحديث «لا يقبل الله صلاة حائض إلا بخمار»؛ والحنفية يعيدون الصلاة إن ترك ربع الرأس، والمالكية يندبون الستر للصغيرة، والشافعية لا تقبل صلاة المميزة بغير خمار، والحنابلة لا يلزم غير البالغة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7853}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7854} الخمار في الإحرام: المرأة الحرة المحرمة تخمر رأسها بما يستره، ولا تكشف وجهها بما يلزم كشفه لكشف الرأس، والمحظور عليها ستر وجهها بما يعد ساترا؛ وأجمعوا على أن للمحرمة لبس القمص والسراويلات والخفاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7854}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7855} الخمار في الكفن: أقل الكفن ما يستر البدن إلا رأس المحرم ووجه المحرمة؛ والأفضل للمرأة خمسة أثواب يدخل فيها الخمار؛ والحنابلة يقولون إن الجارية التي لم تبلغ تكفن في لفافتين وقميص بلا خمار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7855}'
  en: 'Khimar derives from khamara, to cover; anything that covers a thing is its khimar, but the word is used for what a woman covers her head with; some jurists define it as what covers the head, the temples and the neck. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7851} Related words: hijab (covering, wider than khimar), qina'' (a cloth a woman wraps about her head, and for some the cloth a man throws over his shoulder), niqab (for the face) and burqu'' (for the face). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7851}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7852} A free woman is bound to wear a khimar, since her hair is awrah by agreement; the Quranic verse on drawing the khimar over the breast is cited, and Aisha said the thick khimar that covers is the one meant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7852} Wiping the khimar in ablution: the Hanafis, Malikis and Shafiis do not accept wiping the khimar alone unless it is thin enough for water to reach the hair; the Hanbalis differ, the preferred view allowing it on the report of Umm Salama, and Ahmad in one report forbidding it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7852}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7853} The khimar in prayer: covering a free adult woman\''s hair is a condition of prayer, and prayer without it is void, on the report that God accepts no prayer of a woman in menses without a khimar; the Hanafis repeat if a quarter of the head is left bare, the Malikis advise covering a girl, the Shafiis do not accept the prayer of a discerning girl without it, the Hanbalis do not require it of the non-adult. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7853}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7854} The khimar in pilgrim state: the free woman in ihram covers her head with what covers it fully and may not uncover what requires uncovering her face; all agree she may wear shirts, trousers and socks. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7854}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7855} The khimar in the shroud: the least shroud covers the body except the head of a man in ihram and the face of a woman in ihram; the preferred number for a woman is five pieces including a khimar; the Hanbalis shroud an unmarried girl in two wraps and a shirt without a khimar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7855}'
  ur: 'خمار خمر سے ہے جس کے معنی ڈھانپنا ہیں، ہر ڈھانپنے والی چیز خمار کہلاتی ہے، مگر عرف میں عورت کے سر کے کپڑے کو خمار کہا جاتا ہے؛ بعض فقہاء اسے سر، کنپٹیوں یا گردن کو ڈھانپنے والی چیز کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7851} متعلقہ الفاظ: حجاب (ستر، جو خمار سے عام ہے)، قناع (وہ کپڑا جس سے عورت سر ڈھانپے)، نقاب (چہرے کے لیے) اور برقع (چہرے کا پردہ)۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7851}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7852} آزاد عورت پر خمار اوڑھنا واجب ہے کیونکہ اس کے بال بالاتفاق عورت ہیں، اور قرآن کی آیت کا حوالہ جس میں گریبان پر دوپٹہ ڈالنے کا حکم ہے؛ عائشہ کے نزدیک گاڑھا خمار مراد ہے جو ستر کرے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7852} وضو میں خمار پر مسح: حنفیہ، مالکیہ اور شافعیہ صرف خمار پر مسح جائز نہیں مانتے، الا یہ کہ باریک ہو کہ پانی بالوں تک پہنچے؛ حنابلہ کا معتمد قول ام سلمہ کی روایت سے جواز کا ہے، احمد کی ایک روایت منع کرتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7852}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7853} نماز میں خمار: آزاد بالغ عورت کے بال ڈھانپنا نماز کی شرط ہے، بغیر خمار کے نماز باطل ہے، حدیث «لا يقبل الله صلاة حائض إلا بخمار» کی بنا پر؛ حنفیہ ربع سر چھوڑنے پر اعادہ کرتے ہیں، مالکیہ کم عمر کے لیے ستر مستحب کہتے ہیں، شافعیہ ممیزہ کی نماز بغیر خمار کے قبول نہیں کرتے، حنابلہ نابالغ پر لازم نہیں کرتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7853}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7854} احرام میں خمار: آزاد محرمہ سر کو ایسے ڈھانپے جو پورا ڈھانپ لے، اور وہ چہرہ اتنا ہی کھولے جتنا سر کھولنے کے لیے لازم ہو؛ اس پر قمیص، شلوار اور موزے پہننا سب کے نزدیک جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7854}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7855} کفن میں خمار: کم از کم کفن بدن کو ڈھانپتا ہے سوائے احرام والے مرد کے سر اور احرام والی عورت کے چہرے کے؛ عورت کے لیے افضل پانچ کپڑے ہیں جن میں خمار شامل ہو؛ حنابلہ نابالغہ کو دو لفافے اور قمیص میں بغیر خمار کے کفن دیتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7855}'
