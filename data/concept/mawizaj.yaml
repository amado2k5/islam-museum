label:
  ar: "ميويزج"
  en: "Mawizaj (the mountain raisin)"
  ur: "میویزج"
  es: "Mawizaj (la uva pasa de montaña)"
summary:
  ar: "ميويزج هو الزبيب الجبلي، حب أسود متغضن كالحمص الأسود، حار يابس في الثالثة، محرق أكال حاد حريف، يقتل القمل ويمضغ لجلب البلغم، ويحذر الكتاب من سقيه لأنه يقرح المثانة {cite:canon-ibn-sina-print-v1 p.564}."
  en: "Mawizaj is the mountain raisin, a black wrinkled grain like a black chickpea, hot and dry in the third degree, burning, eating, sharp and acrid; it kills lice and is chewed to draw phlegm, and the book warns that drinking it is dangerous because it ulcerates the bladder {cite:canon-ibn-sina-print-v1 p.564}."
  ur: "میویزج پہاڑی کشمش ہے، کالے چنے جیسا سیاہ سکڑا ہوا دانہ، تیسرے درجے میں گرم خشک، جلانے والا، کھا جانے والا، تیز اور تلخ؛ جوؤں کو مارتا ہے اور بلغم کھینچنے کے لیے چبایا جاتا ہے، اور کتاب خبردار کرتی ہے کہ اسے پینا خطرناک ہے کیونکہ یہ مثانے میں زخم ڈالتا ہے {cite:canon-ibn-sina-print-v1 p.564}۔"
  es: "El mawizaj es la pasa de montaña, un grano negro arrugado parecido a un garbanzo negro, caliente y seco en tercer grado, ardiente, comestible, punzante y acre; mata los piojos y se mastica para extraer la flema, y el libro advierte que beberlo es peligroso porque ulcera la vejiga {cite:canon-ibn-sina-print-v1 p.564}."
