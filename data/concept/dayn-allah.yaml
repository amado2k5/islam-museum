id: concept/dayn-allah
class: concept
kind: legal
tags: [akhlaq-browser, akhlaq-dayn]
label:
  ar: "دين الله تعالى"
  en: "God's debt (dayn Allah): obligations owed to God that remain in the liability"
  ur: "اللہ کا دین ⁦(اللہ کے ذمہ حقوق)⁩"
  es: "Deuda con Dios (dayn Allah): obligaciones contraídas con Dios que permanecen en la cuenta."
  fr: "La dette envers Dieu (dayn Allah): les obligations dues à Dieu qui demeurent dans la dette"
  tr: "Yüce Allah'ın dini"
  id: "Agama Allah Yang Maha Kuasa"
summary:
  ar: "دين الله هو حقوقه التي ثبتت في ذمة المكلف ولا مطالب لها من العباد، كالنذور والكفارات وزكاة الفطر والحج والصيام والصلاة إذا فات وقتها، ويجب قضاؤه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8350} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8351} وتصير حقوق الله دينا في الذمة بخروج الوقت قبل الأداء، أو بإتلاف المال الواجب فيه، أو بالعجز عن الأداء وقت الوجوب على تفصيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8353} وتجوز النيابة في أدائه في الأموال باتفاق، وتختلف المذاهب في النيابة في العبادات البدنية بعد الموت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8354} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8355} وتختلف المذاهب في تعلقه بتركة الميت وفي سقوطه بالحرج أو الردة أو الموت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8356} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8357} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8360}"
  en: "God's debt is a right of God that stays in the liability of the obligated person, with no human claimant: vows, expiations, the zakat of fast-breaking, pilgrimage, fasting, and a prayer whose time has passed, all of which must be made up. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8350} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8351} A right of God becomes a debt in the liability when its time passes before performance, when the due property is destroyed, or when the person was unable to perform it when it fell due. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8353} Financial debts to God may be paid by a proxy by agreement; bodily worship may not be done for the living, and the schools differ on proxies for the dead. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8354} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8355} The schools also differ on whether it binds the estate of the dead, whether it blocks zakat, and whether it lapses through hardship, apostasy or death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8356} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8357} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8360}"
  ur: "اللہ کا دین وہ حقوق ہیں جو مکلف کے ذمہ میں ثابت ہوں اور جن کا کوئی انسانی مطالبہ کرنے والا نہ ہو، جیسے نذر، کفارہ، زکوٰۃ الفطر اور حج۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8350} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8351} مالی حقوق میں دوسرے سے ادائیگی کرائی جا سکتی ہے، جبکہ بدنی عبادات میں فقہاء کا اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8354}"
  es: "La deuda de Dios es un derecho de Dios que permanece en la responsabilidad de la persona obligada, sin reclamante humano: votos, expiaciones, el zakat de la ruptura del ayuno, peregrinación, ayuno y una oración cuyo tiempo ha pasado, todo lo cual debe ser compensado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8350} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8351} Un derecho de Dios se convierte en deuda en la responsabilidad cuando su tiempo pasa antes del cumplimiento, cuando la propiedad debida es destruida, o cuando la persona no pudo cumplirla cuando venció. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8353} Las deudas financieras a Dios pueden ser pagadas por un apoderado por acuerdo; No se puede realizar culto corporal por los vivos, y las escuelas difieren en cuanto a los sustitutos de los muertos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8354} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8355} Las escuelas también difieren en si vincula el patrimonio del difunto, si bloquea el zakat y si caduca por dificultades, apostasía o muerte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8356} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8357} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8360}"
  fr: "La dette envers Dieu est un droit divin qui incombe à la personne tenue de l'obligation, sans aucun créancier humain: vœux, expiations, zakat de rupture du jeûne, pèlerinage, jeûne et prière accomplie à temps expiré, autant d'obligations qui doivent être rattrapées. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8350} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8351} Un droit envers Dieu devient une dette lorsque son échéance est dépassée, lorsque le bien dû est détruit ou lorsque la personne était dans l'incapacité de s'acquitter de son obligation à son échéance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8353} Les dettes financières envers Dieu peuvent être payées par un mandataire, conformément à un accord. Le culte corporel est interdit pour les vivants, et les écoles divergent quant aux représentants des défunts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8354} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8355} Les écoles divergent également sur la question de savoir si ce culte engage la succession du défunt, s'il empêche le versement de la zakat et s'il est caduc en cas de difficultés, d'apostasie ou de décès. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8356} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8357} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8360}"
  tr: "Allah'ın dini, hesap verecek kişinin sorumluluğunda kurulan ve hizmetçiler tarafından talep edilmeyen; yeminler, kefaretler, zekat-fitr, hac, oruç ve namaz gibi, eğer zamanları geçmişse ve bunlar yerine getirilmelidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8350} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8351} Allah'ın hakları, ödeme öncesi zamanın kaybı, zorunlu servetin kaybı veya borç anında ödeyememe nedeniyle bir borç haline gelir, ayrıntılı olarak detaylandırıldığı gibi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8353} ve ajans, anlaşma yoluyla para ödemelerinde temsilci olarak hareket edebilirken, okullar ölüm sonrası fiziksel ibadet eylemleriyle ilgili temsil konusunda farklılık gösterir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8354} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8355} ve okullar, ölenin mal varlığı ile ilişkisi ve zorluk, dinden dönme veya ölüm nedeniyle düşmesi konusunda farklılık göstermektedir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8356} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8357} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8360}"
  id: "Agama Allah adalah hak-Nya yang ditetapkan atas tanggung jawab orang yang bertanggung jawab dan tidak diklaim oleh para hamba, seperti janji, penebusan, zakat al-fitr, haji, puasa, dan shalat jika waktunya telah berlalu, dan hak-hak tersebut harus dipenuhi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8350} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8351} Hak Allah menjadi hutang karena hilangnya waktu sebelum pembayaran, atau karena kehilangan kekayaan wajib, atau karena tidak mampu membayar pada saat kewajiban, seperti yang dijelaskan secara rinci. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8353} dan lembaga dapat bertindak sebagai perwakilan dalam pembayaran uang melalui perjanjian, sementara sekolah berbeda dalam hal representasi tindakan ibadah fisik setelah kematian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8354} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8355} dan sekolah berbeda dalam hubungannya dengan harta almarhum dan kejatuhannya akibat kesulitan, murtad, atau kematian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8356} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8357} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8360}"
