id: concept/dayn-allah
class: concept
kind: legal
label:
  ar: "دين الله تعالى"
  en: "God's debt (dayn Allah): obligations owed to God that remain in the liability"
  ur: "اللہ کا دین (اللہ کے ذمہ حقوق)"
summary:
  ar: "دين الله هو حقوقه التي ثبتت في ذمة المكلف ولا مطالب لها من العباد، كالنذور والكفارات وزكاة الفطر والحج والصيام والصلاة إذا فات وقتها، ويجب قضاؤه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8350} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8351} وتصير حقوق الله دينا في الذمة بخروج الوقت قبل الأداء، أو بإتلاف المال الواجب فيه، أو بالعجز عن الأداء وقت الوجوب على تفصيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8353} وتجوز النيابة في أدائه في الأموال باتفاق، وتختلف المذاهب في النيابة في العبادات البدنية بعد الموت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8354} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8355} وتختلف المذاهب في تعلقه بتركة الميت وفي سقوطه بالحرج أو الردة أو الموت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8356} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8357} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8360}"
  en: "God's debt is a right of God that stays in the liability of the obligated person, with no human claimant: vows, expiations, the zakat of fast-breaking, pilgrimage, fasting, and a prayer whose time has passed, all of which must be made up. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8350} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8351} A right of God becomes a debt in the liability when its time passes before performance, when the due property is destroyed, or when the person was unable to perform it when it fell due. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8353} Financial debts to God may be paid by a proxy by agreement; bodily worship may not be done for the living, and the schools differ on proxies for the dead. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8354} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8355} The schools also differ on whether it binds the estate of the dead, whether it blocks zakat, and whether it lapses through hardship, apostasy or death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8356} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8357} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8360}"
  ur: "اللہ کا دین وہ حقوق ہیں جو مکلف کے ذمہ میں ثابت ہوں اور جن کا کوئی انسانی مطالبہ کرنے والا نہ ہو، جیسے نذر، کفارہ، زکوٰۃ الفطر اور حج۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8350} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8351} مالی حقوق میں دوسرے سے ادائیگی کرائی جا سکتی ہے، جبکہ بدنی عبادات میں فقہاء کا اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8354}"
