label: { ar: "رصد البتاني للكواكب الثابتة وجدول مواضعها", en: "Al-Battani's observations of the fixed stars and the table of their places", ur: "البتانی کے ثابت ستاروں کے رصد اور ان کے مواضع کا جدول", es: "Las observaciones de Al-Battani sobre las estrellas fijas y la tabla de sus posiciones.", fr: "Les observations d'Al-Battani sur les étoiles fixes et le tableau de leurs positions" }
summary:
  ar: "يذكر البتاني أنه رصد الكواكب الثابتة مراراً في سنين متوالية، واعتمد على رصد في سنة ألف ومائة وإحدى وتسعين من سني ذي القرنين، فقاس أبعادها عن معدل النهار وما يتوسط السماء منها من أجزاء البروج، وجعل لها جداول تتضمن مواضعها في الطول والعرض والحركة. ويذكر أيضاً أنه رصد الشمالي من التي بين عيني المقرب والشعرى اليمانية وقلب الأسد في تلك السنة، وأنه قابلها بمواضعها عند بطليموس. {cite:zij-sabi-nallino-byblion pp.191-192}"
  en: "Al-Battani says he observed the fixed stars many times over successive years, and relied on an observation in the year 1191 of the era of Dhu al-Qarnayn. He measured their distances from the equator of the day and the signs of the zodiac on the meridian, and set out tables of their longitudes, latitudes and motions. He also reports observing a northern star between the eyes of the Kneeler, the Yemeni Sirius and Regulus in that year, and comparing them with Ptolemy's places. {cite:zij-sabi-nallino-byblion pp.191-192}"
  ur: "البتانی کہتے ہیں کہ انہوں نے ثابت ستاروں کو متواتر سالوں میں کئی بار رصد کیا، اور ذوالقرنین کے سنین میں ایک ہزار ایک سو اکانوے کے رصد پر اعتماد کیا۔ انہوں نے ان کے معدل النہار سے بُعد اور وسط السماء پر بروج کے حصوں کا اندازہ کیا، اور طول، عرض اور حرکت کے جدول بنائے۔ وہ یہ بھی بتاتے ہیں کہ اسی سال انہوں نے مقرب کی آنکھوں کے درمیان کا شمالی ستارہ، یمانی شعریٰ اور قلبِ اسد کا رصد کیا اور ان کے مواضع کو بطلیموس کے مواضع سے ملایا۔ {cite:zij-sabi-nallino-byblion pp.191-192}"
  es: "Al-Battani afirma haber observado las estrellas fijas en numerosas ocasiones a lo largo de varios años, basándose en una observación realizada en el año 1191 de la era de Dhu al-Qarnayn. Midió sus distancias desde el ecuador del día y los signos del zodíaco en el meridiano, y elaboró tablas con sus longitudes, latitudes y movimientos. También relata haber observado una estrella boreal entre los ojos del Arrodillado, Sirio y Régulo de Yemen, en ese mismo año, y haberlas comparado con las posiciones descritas por Ptolomeo. {cite:zij-sabi-nallino-byblion pp.191-192}"
  fr: "Al-Battani affirme avoir observé les étoiles fixes à plusieurs reprises au cours d'années consécutives, et s'être appuyé sur une observation réalisée en 1191, sous le règne de Dhu al-Qarnayn. Il a mesuré leurs distances par rapport à l'équateur diurne et aux signes du zodiaque au méridien, et a établi des tables de leurs longitudes, latitudes et mouvements. Il rapporte également avoir observé cette année-là une étoile boréale entre les yeux du Genouillère, Sirius du Yémen et Régulus, et les avoir comparées aux positions recensées par Ptolémée. {cite:zij-sabi-nallino-byblion pp.191-192}"
