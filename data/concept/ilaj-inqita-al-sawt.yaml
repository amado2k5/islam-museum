label:
  ar: "علاج انقطاع الصوت"
  en: "The treatment of the voice's cutting-off"
  ur: "آواز کے انقطاع کا علاج"
  es: "El tratamiento del corte de la voz"
  fr: "Le traitement de la coupure de la voix"
  tr: "Ses Kaybının Tedavisi"
  id: "Mengatasi Kehilangan Suara"
summary:
  ar: "إن كان انقطاع الصوت لسوء مزاج في بعض العضل أو آفة عولج بما يجب في بابه ومن أحس بابتداء انقطاع الصوت وجب أن يبادر بالعلاج قبل أن يقوى، وإن كان من رطوبة في الإرخاء ولا يكون وجع ويكون كدورة وثقل عولج بما يلين ويجلو، وإن كان من يبس وعلامته أن لا يكون مع البحة عظم بل صغر وحده وصفاء ما عولج بالمرطبات والأغذية المليّنة والأشربة الحلوة ⁦(والكتاب يسوق من ذلك وصفات وملاعق ومقادير ويعد في الأغذية أكارع البقر ولا يقتبس منها عصبه ⁦(سطر موسوم من أجل الأكارع)⁩ ولا ينقل شيء من النسخ بحسب القاعدة)⁩ والاستلقاء نافع لضعف الصوت وبحته {cite:canon-ibn-sina-print-v2 p.324}"
  en: "If the voice's cutting-off is from a bad temperament in one of the muscles or a harm, it is treated by what befits in its chapter; and whoever feels the cutting-off beginning must hasten the treatment before it strengthens. If it is from a relaxing moisture, with no pain but turbidity and heaviness, it is treated by what softens and cleanses; if from dryness — its mark being that no greatness attends the huskiness but smallness alone, with some clearness — it is treated by the moisteners, the loosening foods and the sweet drinks (the book gives there prescriptions, spoon-measures and quantities, and among the foods counts the cow's trotters — of which only the nerve is eaten; a labelled line for the trotters — and nothing of the formulae is carried, per the rule). Lying down profits the voice's weakness and its huskiness {cite:canon-ibn-sina-print-v2 p.324}"
  ur: "اگر آواز کا انقطاع کسی پٹھے میں بد مزاج یا آفت سے ہو تو اس کے باب میں جو واجب ہے اس سے علاج؛ اور جو شخص انقطاع کی ابتدا محسوس کرے اسے مضبوط ہونے سے پہلے علاج کی جلدی کرنی چاہیے؛ اگر نرم کرنے والی رطوبت سے ہو جب درد نہ ہو مگر کدورت اور بھاری پن ہو تو نرم اور صاف کرنے والوں سے علاج؛ اگر خشکی سے ہو — اور اس کی علامت یہ ہے کہ بھاری پن کے ساتھ بڑائی نہ ہو بلکہ صرف چھوٹائی ہو اور کچھ صفائی ہو — تو تر کرنے والوں نرم کرنے والی خوراکوں اور میٹھے مشروبات سے علاج ⁦(کتاب نے وہاں نسخے چمچ کی مقداریں اور مقادیر پیش کیں اور خوراکوں میں گائے کی پائے گنوائے جن میں سے صرف عصب کھایا جاتا ہے ⁦(پایوں کی وجہ سے وضاحت شدہ سطر)⁩ اور نسخوں میں سے کچھ بھی اصول کے مطابق نہیں لایا گیا)⁩؛ اور لیٹنا آواز کی کمزوری اور اس کی بھاری پن کو نفع دیتا ہے {cite:canon-ibn-sina-print-v2 p.324}"
  es: "Si la afonía se debe a un mal temperamento en alguno de los músculos o a una lesión, se trata con lo que corresponde según el capítulo; y quien sienta que comienza la afonía debe apresurar el tratamiento antes de que se agrave. Si se debe a una humedad relajante, sin dolor pero con turbidez y pesadez, se trata con lo que suaviza y limpia; si se debe a la sequedad —cuya señal es que la ronquera no va acompañada de grandeza, sino solo de pequeñez, con cierta claridad— se trata con humectantes, alimentos fluidificantes y bebidas dulces (el libro proporciona allí prescripciones, medidas y cantidades, y entre los alimentos se incluyen las manitas de vaca —de las cuales solo se come el nervio; una línea etiquetada para las manitas— y no se lleva ninguna de las fórmulas, según la regla). Acostarse beneficia la debilidad y la ronquera de la voz {cite:canon-ibn-sina-print-v2 p.324}"
  fr: "Si la coupure de la voix est due à un déséquilibre musculaire ou à une blessure, on la traite conformément au chapitre correspondant; et quiconque ressent les premiers signes de coupure doit accélérer le traitement avant que la situation ne s'aggrave. Si elle est due à une humidité stagnante, sans douleur mais accompagnée de sensation de lourdeur et de trouble, on la traite par des remèdes adoucissants et purifiants; si elle est due à la sécheresse – son signe distinctif étant une voix rauque légère, mais sans intensité, avec une certaine clarté –, on la traite par des hydratants, des aliments décongestionnants et des boissons sucrées (le livre donne des prescriptions, des mesures en cuillères et des quantités, et parmi les aliments figurent les pieds de vache – dont on ne consomme que le nerf; une ligne spécifique est prévue pour les pieds – et aucune formule n'est utilisée, conformément à la règle). Se coucher est bénéfique à la faiblesse de la voix et à son enrouement {cite:canon-ibn-sina-print-v2 p.324}"
  tr: "Ses bazı kaslarda kötü bir ruh hali veya lezyon nedeniyle kesilirse, gerektiğinde tedavi edilmelidir. Ses kesilmeye başlıyorsa, güçlenmeden hemen tedavi alınmalıdır. Eğer rahatlama içindeki nemden kaynaklanıyorsa, ağrı değil, ishal ve ağırlıktan kaynaklanıyorsa, hafif ve berrak şekilde tedavi edilmelidir. Eğer kuruluk ve belirtisi kısıklık kemik değil, küçük ve berrak ise, nemlendiriciler, müshil yiyecekler veya tatlı içeceklerle tedavi edilmez. (Kitap tarifler, kaşıklar ve bunların miktarlarını sunar; yiyecekler arasında sığır kemikleri olarak sayılır, sinirinden (a'kara için işaretlenmiş bir satır) alıntı yapmaz ve kurala göre herhangi bir kopya taşımaz). Yatmak, zayıf ses ve saflığı için faydalıdır {cite:canon-ibn-sina-print-v2 s.324}"
  id: "Jika suara terputus karena suasana hati yang buruk pada beberapa otot atau lesi, harus diobati sesuai kebutuhan. Jika suara mulai terputus, pengobatan harus segera dilakukan sebelum menjadi lebih kuat. Jika karena kelembapan dalam relaksasi bukan rasa sakit, melainkan diare dan berat, harus diobati dengan ringan dan jernih. Jika kekeringan dan tandanya adalah suara serak bukan tulang, melainkan kecil dan jernih, maka tidak diobati dengan pelembap, makanan pencahar, atau minuman manis. (Buku ini menyediakan resep, sendok, dan jumlahnya, serta di antara makanan dihitung tulang sapi, tanpa mengutip sarafnya (garis yang ditandai untuk a'kara) dan tidak menyampaikan salinan sesuai aturan). Berbaring bermanfaat untuk suara lemah dan suara murni {cite:canon-ibn-sina-print-v2 hlm.324}"
