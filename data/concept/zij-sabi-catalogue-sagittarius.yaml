label:
  ar: "الرامي"
  en: "Sagittarius (al-Rami)"
  ur: "رامی"
  es: "Sagitario (al-Rami)"
  fr: "Sagittaire (al-Rami)"
summary:
  ar: "تُسمّى الصورة الرامي، أي المُرسِل للسهم، ويذكر العنوان القوس والسهم معًا. تُعدّ كواكبها في طرف السهم واليد والقوس والكتف والعين والساق، وفيها ستار سديمي مزدوج في العين. لا تُنقل المواضع. {cite:nallino-albatenii-opus-astronomicum pp.162}"
  en: "The figure is named ar-Rami, the archer (jaculator), and its heading also gives al-Qaws, the bow, and al-Sahm, the arrow. The list names stars in the arrow's tip, the hand, the bow, the shoulder, the eye and the leg, and a double nebulous star in the eye. Positions are not transcribed here. {cite:nallino-albatenii-opus-astronomicum pp.162}"
  ur: "صورت کا نام الرامی ہے، یعنی تیر چلانے والا، اور عنوان میں کمان القوس اور تیر السہم بھی آتے ہیں۔ اس کے ستارے تیر کی نوک، ہاتھ، کمان، کندھے، آنکھ اور ٹانگ میں گنے گئے ہیں، اور آنکھ میں ایک دوہرا دھندلا ستارہ درج ہے۔ مواضع یہاں نقل نہیں ہوئے۔ {cite:nallino-albatenii-opus-astronomicum pp.162}"
  es: "La figura se llama ar-Rami, el arquero (jaculator), y su encabezado también menciona al-Qaws, el arco, y al-Sahm, la flecha. La lista nombra estrellas en la punta de la flecha, la mano, el arco, el hombro, el ojo y la pierna, y una estrella doble nebulosa en el ojo. Las posiciones no se transcriben aquí. {cite:nallino-albatenii-opus-astronomicum pp.162}"
  fr: "La figure est nommée ar-Rami, l'archer (jaculateur), et son titre mentionne également al-Qaws, l'arc, et al-Sahm, la flèche. La liste recense des étoiles à la pointe de la flèche, dans la main, sur l'arc, sur l'épaule, dans l'œil et sur la jambe, ainsi qu'une étoile double nébuleuse dans l'œil. Les positions ne sont pas transcrites ici. {cite:nallino-albatenii-opus-astronomicum pp.162}"
