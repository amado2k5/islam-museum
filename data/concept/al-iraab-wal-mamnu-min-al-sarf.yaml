id: concept/al-iraab-wal-mamnu-min-al-sarf
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-sciences]
label:
  ar: "الإعراب والممنوع من الصرف"
  en: "Case endings (i'rab) and diptotes"
  ur: "اعراب اور ممنوع من الصرف"
  fr: "Les cas (i'rab) et les diptotes"
  es: "Los casos (i'rab) y los diptotos"
summary:
  ar: "جدول الحالات الثلاث، الرفع والنصب والجر، ولواحقها بحسب نوع الاسم: المثلث المعرّف والنكرة والممنوع من الصرف وجمع المؤنث السالم والمثنى وجمع المذكر السالم، مع قاعدة الممنوع من الصرف وأصنافه الكبرى، كما أوردها ملخص بحثي. أرقام الصفحات عند ريدنغ 2005 ورايت 1896 والغلاييني من الملخص ولم يتحقق منها المتحف."
  en: "The table of the three cases, nominative, accusative and genitive, and their endings by type of noun: definite and indefinite triptotes, diptote, sound feminine plural, dual and sound masculine plural, with the rule for diptotes and their main classes, as given by a research summary. The page numbers in Ryding 2005, Wright 1896 and al-Ghalayini are the summary's and the museum did not check them."
  ur: "تینوں حالتوں، رفع، نصب اور جر، اور اسم کی قسم کے مطابق ان کے لاحقوں کا جدول: معرفہ اور نکرہ مثلث، ممنوع من الصرف، جمع مؤنث سالم، مثنیٰ اور جمع مذکر سالم، ساتھ ممنوع من الصرف کا قاعدہ اور اس کی بڑی اقسام، جیسے ایک تحقیقی خلاصے نے دیں۔ رائڈنگ 2005، رائٹ 1896 اور الغلاینی میں صفحات کے نمبر خلاصے کے ہیں اور عجائب گھر نے ان کی جانچ نہیں کی۔"
  fr: "Le tableau des trois cas, nominatif, accusatif et génitif, et de leurs terminaisons selon le type de nom : triptotes défini et indéfini, diptote, pluriel féminin sain, duel et pluriel masculin sain, avec la règle des diptotes et leurs principales classes, tel que le donne un résumé de recherche. Les numéros de page chez Ryding 2005, Wright 1896 et al-Ghalayini sont ceux du résumé et le musée ne les a pas vérifiés."
  es: "La tabla de los tres casos, nominativo, acusativo y genitivo, y sus terminaciones según el tipo de nombre: triptotos definido e indefinido, diptoto, plural femenino sano, dual y plural masculino sano, con la regla de los diptotos y sus clases principales, tal como la da un resumen de investigación. Los números de página en Ryding 2005, Wright 1896 y al-Ghalayini son los del resumen y el museo no los comprobó."
