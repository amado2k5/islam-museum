label:
  ar: "الكمأة"
  en: "Desert truffle (al-kam'a)"
  ur: "کمأة ⁦(الكمأة)⁩"
summary:
  ar: "الكمأة نبات يخرج من الأرض في الربيع بلا بذر ولا سقي، وفي البخاري قول النبي: «الكمأة من المن، وماؤها شفاء للعين» {cite:sahih-al-bukhari 5708}. ويذكر ابن قيم الجوزية أنها تسمى «جدري الأرض» لشبهها بالجدري، وأن العرب تسميها «نبات الرعد»، وأنها أصناف منها صنف قتال {cite:zad-al-maad p.725}، ويعرض في معنى «من المن» قولين، وفي «ماؤها شفاء للعين» ثلاثة أقوال {cite:zad-al-maad p.725} {cite:zad-al-maad p.726}."
  en: "The kam'a, the desert truffle, is a plant that comes up from the ground in spring without sowing or watering, and in al-Bukhari the Prophet says 'the kam'a is part of the manna, and its water is a cure for the eye' {cite:sahih-al-bukhari 5708}. Ibn Qayyim al-Jawziyya notes that it is called 'smallpox of the earth' for its likeness to smallpox, that the Arabs call it 'plant of the thunder', and that it has several kinds, one of them deadly {cite:zad-al-maad p.725}; he gives two readings of 'part of the manna' and three of 'its water is a cure for the eye' {cite:zad-al-maad p.725} {cite:zad-al-maad p.726}."
  ur: "کمأة، یعنی صحرائی ٹرفل، ایک نباتات ہے جو بہار میں بغیر بیج بوئے اور پانی دیے زمین سے نکلتی ہے، اور بخاری میں نبی کا فرمان ہے: «کمأة من میں سے ہے اور اس کا پانی آنکھ کے لیے شفا ہے» {cite:sahih-al-bukhari 5708}۔ ابن قیم الجوزیہ بتاتے ہیں کہ چیچک سے مشابہت کی وجہ سے اسے «زمین کی چیچک» کہا جاتا ہے، عرب اسے «گرج کا سبزہ» کہتے ہیں، اور اس کی کئی قسمیں ہیں جن میں سے ایک جان لیوا ہے {cite:zad-al-maad p.725}؛ وہ «من میں سے» کے دو مفہوم اور «اس کا پانی آنکھ کے لیے شفا» کے تین اقوال پیش کرتے ہیں {cite:zad-al-maad p.725} {cite:zad-al-maad p.726}۔"
