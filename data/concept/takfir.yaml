  id: "Takfir"
summary:
  ar: "التكفير إصدار الحكم بالكفر على مسلم؛ تفرد الموسوعة الفقهية الكويتية بابا في الأحكام المتعلقة بالتكفير وتكفير المسلم، وتجعله من أخطر الأحكام وأشدها تضييقا {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  en: "Takfir is declaring a Muslim to be an unbeliever; the Kuwaiti Fiqh Encyclopedia devotes a section to the rulings on takfir and takfir of a Muslim, treating it as among the gravest and most restricted of judgements {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  es: "Takfir es declarar a un musulmán como infiel; la Enciclopedia de Fiqh de Kuwait dedica una sección a las normas sobre takfir y takfir de un musulmán, tratándolo como uno de los juicios más graves y restringidos {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  fr: "Le takfir consiste à déclarer un musulman comme incroyant; l'Encyclopédie Fiqh koweïtienne consacre une section aux décisions sur le takfir et le takfir d'un musulman, le traitant comme l'un des jugements les plus graves et les plus restreints {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  ur: "تکفیر مسلمان کو کافر قرار دے رہا ہے۔ کویتی فقہ انسائیکلو پیڈیا ایک حصہ کو مسلمان کی تکفیر اور تکفیر کے احکام کے لیے مختص کرتا ہے، اور اسے سب سے سنگین اور انتہائی محدود فیصلوں میں شمار کرتا ہے۔"
  tr: "Takfir, bir Müslüman hakkında inançsızlık hükmü çıkarır; Kuveyt Fıkıh Ansiklopedisi, tekfirle ilgili kararlara ve Müslümanların kâfir ilan edilmesine bir bölüm ayırır; bu da bunu en tehlikeli ve kısıtlayıcı kararlardan biri yapar {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  id: "Takfir mengeluarkan putusan ketidakpercayaan terhadap seorang Muslim; Ensiklopedia Yurisprudensi Kuwait mendedikasikan satu bab untuk putusan terkait takfir dan menyatakan Muslim sebagai kafir, menjadikannya salah satu putusan paling berbahaya dan membatasi {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
