summary:
  ar: "التكفير إصدار الحكم بالكفر على مسلم؛ تفرد الموسوعة الفقهية الكويتية بابا في الأحكام المتعلقة بالتكفير وتكفير المسلم، وتجعله من أخطر الأحكام وأشدها تضييقا {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  en: "Takfir is declaring a Muslim to be an unbeliever; the Kuwaiti Fiqh Encyclopedia devotes a section to the rulings on takfir and takfir of a Muslim, treating it as among the gravest and most restricted of judgements {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
