id: concept/asma-al-ayyam-wal-shuhur-jahiliyya
class: concept
kind: term
label:
  ar: "أسماء الأيام والشهور في الجاهلية"
  en: "Jahiliyya names of days and months"
  fr: "Les noms des jours et des mois dans la Jahiliyya"
  es: "Jahiliyya nombres de días y meses."
summary:
  ar: "كانت العرب تسمي الأيام في الجاهلية: الأحد أولاً والاثنين أهون والثلاثاء جبار والأربعاء دبار والخميس مؤنس والجمعة عروبة والسبت شيار، وقال شاعرهم أؤمل أن أعيش وأن يومي بأول أو بأهون أو جبار أو أردي دبار فإن أعفته فمؤنس أو عروبة أو شيار، وكانوا يسمون الشهور المحرم ناتقاً وصفر ثقيلاً ثم طليقاً وناجراً وأسلخ وأميح وأحلك وكسعاً وزاهراً وبركاً وحرفاً وتعساً وهو ذو الحجة، وسمي الأحد لأنه أول يوم خلقه الله من الزمان والسبت لأن الخلق انقطع فيه وخلق في آخره آدم مأخوذ من نعل سبتية إذا كانت مقطوعة الشعر {cite:muruj-al-dhahab p. 510-511}."
  en: "The Arabs' Jahiliyya week — Awwal, Ahwan, Jubar, Dubar, Mu'nis, 'Aruba, Shiyar — and their months: Natiq for Muharram, Thaqil for Safar, then Taliq, Najir, Aslakh, Amih, Ahlak, Kasa', Zahir, Bark, Harf and Ta'ss for Dhu al-Hijja; the Sabbath named for the severing of creation's week {cite:muruj-al-dhahab p. 510-511}."
  fr: "La semaine des Arabes dans la Jahiliyya — Awwal, Ahwan, Jubar, Dubar, Mu'nis, 'Aruba, Shiyar — et leurs mois : Natiq pour Mouharram, Thaqil pour Safar, puis Taliq, Najir, Aslakh, Amih, Ahlak, Kasa', Zahir, Bark, Harf et Ta'ss pour Dhu al-Hijja ; le sabbat tire son nom de l’interruption de la semaine de la création {cite:muruj-al-dhahab p. 510-511}."
  es: "La semana árabe de la Jahiliyya (Awwal, Ahwan, Jubar, Dubar, Mu'nis, 'Aruba, Shiyar) y sus meses: Natiq para Muharram, Thaqil para Safar, luego Taliq, Najir, Aslakh, Amih, Ahlak, Kasa', Zahir, Bark, Harf y Ta'ss para Dhu al-Hijja; el sábado llamado así por la ruptura de la semana de la creación {cita:muruj-al-dhahab p. 510-511}."
