id: concept/asma-al-ayyam-wal-shuhur-jahiliyya
class: concept
kind: term
label:
  ar: "أسماء الأيام والشهور في الجاهلية"
  en: "Jahiliyya names of days and months"
  fr: "Les noms des jours et des mois dans la Jahiliyya"
  es: "Jahiliyya nombres de días y meses."
  ur: "جاہلیت دنوں اور مہینوں کے نام"
  tr: "İslam öncesi dönemde gün ve ay isimleri"
  id: "Nama-nama hari dan bulan di era pra-Islam"
summary:
  ar: "كانت العرب تسمي الأيام في الجاهلية: الأحد أولاً والاثنين أهون والثلاثاء جبار والأربعاء دبار والخميس مؤنس والجمعة عروبة والسبت شيار، وقال شاعرهم أؤمل أن أعيش وأن يومي بأول أو بأهون أو جبار أو أردي دبار فإن أعفته فمؤنس أو عروبة أو شيار، وكانوا يسمون الشهور المحرم ناتقاً وصفر ثقيلاً ثم طليقاً وناجراً وأسلخ وأميح وأحلك وكسعاً وزاهراً وبركاً وحرفاً وتعساً وهو ذو الحجة، وسمي الأحد لأنه أول يوم خلقه الله من الزمان والسبت لأن الخلق انقطع فيه وخلق في آخره آدم مأخوذ من نعل سبتية إذا كانت مقطوعة الشعر {cite:muruj-al-dhahab p. 510-511}."
  en: "The Arabs' Jahiliyya week — Awwal, Ahwan, Jubar, Dubar, Mu'nis, 'Aruba, Shiyar — and their months: Natiq for Muharram, Thaqil for Safar, then Taliq, Najir, Aslakh, Amih, Ahlak, Kasa', Zahir, Bark, Harf and Ta'ss for Dhu al-Hijja; the Sabbath named for the severing of creation's week {cite:muruj-al-dhahab p. 510-511}."
  fr: "La semaine des Arabes dans la Jahiliyya — Awwal, Ahwan, Jubar, Dubar, Mu'nis, 'Aruba, Shiyar — et leurs mois : Natiq pour Mouharram, Thaqil pour Safar, puis Taliq, Najir, Aslakh, Amih, Ahlak, Kasa', Zahir, Bark, Harf et Ta'ss pour Dhu al-Hijja ; le sabbat tire son nom de l’interruption de la semaine de la création {cite:muruj-al-dhahab p. 510-511}."
  es: "La semana árabe de la Jahiliyya (Awwal, Ahwan, Jubar, Dubar, Mu'nis, 'Aruba, Shiyar) y sus meses: Natiq para Muharram, Thaqil para Safar, luego Taliq, Najir, Aslakh, Amih, Ahlak, Kasa', Zahir, Bark, Harf y Ta'ss para Dhu al-Hijja; el sábado llamado así por la ruptura de la semana de la creación {cita:muruj-al-dhahab p. 510-511}."
  ur: "عربوں کا ہفتہ جاہلیت —اول، اہوان، جبار، دبر، مثنٰی، عروبہ، شعار — اور ان کے مہینے: محرم کے لیے نعتیق، صفر کے لیے ثقیل، پھر طلاق، نظیر، اسلخ، امیح، اخلاق، کساء، ظاہر، برک، حرف اور الحج کے لیے۔ سبت کا نام تخلیق کے ہفتہ کو منقطع کرنے کے لیے رکھا گیا ہے {حوالہ: مروج الذہب ص۔ 510-511}۔"
  tr: "Araplar İslam öncesi zamanlarda bu günlere şöyle derlerdi: Pazar önce, Pazartesi daha hafif, Salı zorba, Çarşamba dhabar, Perşembe 'mus', Cuma 'uroobah' ve Cumartesi 'şyar'. Şairleri şöyle derdi: 'Yaşamayı umuyorum ve günüm ilk ya da hafif, zulüm ya da 'dhur günüyle, eğer onu serbest bırakırsam, 'mus', 'urubah' ya da 'şiyar' olur. Muharrem aylarına 'neqti', 'safar' ise 'ağır' derlerdi, Sonra 'gevşek', 'ajra', 'al-saq', 'amih', 'ahlak', 'kas', 'çiçek açan', 'baraka', 'haffa' ve atasözünü taşıyan 'asa' denir. Buna 'al-had'ah' denir. 'al-ahad' olarak adlandırılır çünkü Şabat ayının ilk günüdür, çünkü yaratılış onun üzerinde kesilir ve sonunda ise saçlar kesildiğinde Şabat tabanından alınan Adem vardır. {cite:Muruj-al-Dhahab, s. 510-511}."
  id: "Orang Arab dulu menyebut hari-hari di masa pra-Islam: Minggu pertama, Senin lebih ringan, Selasa tirani, Rabu dhabar, Kamis 'mus', Jumat 'uroobah', dan Sabtu 'shyar'. Penyair mereka berkata, 'Aku berharap bisa hidup, dan hariku bersama yang pertama atau lebih ringan, tirani, atau hari 'dhur, jika aku melepaskannya, maka itu adalah 'mus', 'urubah', atau 'shiyar'. Mereka menyebut bulan-bulan Muharram 'naqti' dan 'safar' 'berat', lalu 'longgar', 'ajra', 'al-saq', 'amih', 'ahlak', 'kas', 'mekar', 'baraka', 'haffa', dan 'asa', yang merupakan yang mengandung peribahasa itu. Disebut 'al-had'ah'. Disebut 'al-Ahad' karena itu adalah hari pertama bulan Sabat, karena penciptaan dipotong di atasnya, dan di ujungnya adalah Adam, diambil dari telapak Sabat saat rambut dipotong. {kutip:Muruj-al-Dhahab, hlm. 510-511}."
