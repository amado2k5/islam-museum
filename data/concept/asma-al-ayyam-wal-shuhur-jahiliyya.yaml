label: { ar: "أسماء الأيام والشهور في الجاهلية", en: "Jahiliyya names of days and months" }
summary:
  ar: "كانت العرب تسمي الأيام في الجاهلية: الأحد أولاً والاثنين أهون والثلاثاء جبار والأربعاء دبار والخميس مؤنس والجمعة عروبة والسبت شيار، وقال شاعرهم أؤمل أن أعيش وأن يومي بأول أو بأهون أو جبار أو أردي دبار فإن أعفته فمؤنس أو عروبة أو شيار، وكانوا يسمون الشهور المحرم ناتقاً وصفر ثقيلاً ثم طليقاً وناجراً وأسلخ وأميح وأحلك وكسعاً وزاهراً وبركاً وحرفاً وتعساً وهو ذو الحجة، وسمي الأحد لأنه أول يوم خلقه الله من الزمان والسبت لأن الخلق انقطع فيه وخلق في آخره آدم مأخوذ من نعل سبتية إذا كانت مقطوعة الشعر {cite:muruj-al-dhahab p. 510-511}."
  en: "The Arabs' Jahiliyya week — Awwal, Ahwan, Jubar, Dubar, Mu'nis, 'Aruba, Shiyar — and their months: Natiq for Muharram, Thaqil for Safar, then Taliq, Najir, Aslakh, Amih, Ahlak, Kasa', Zahir, Bark, Harf and Ta'ss for Dhu al-Hijja; the Sabbath named for the severing of creation's week {cite:muruj-al-dhahab p. 510-511}."
