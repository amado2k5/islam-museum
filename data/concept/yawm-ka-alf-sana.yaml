id: concept/yawm-ka-alf-sana
class: concept
kind: belief
label:
  ar: يوم كألف سنة
  en: A day as a thousand years
  ur: ایک دن جو ہزار سال کے برابر ہو
summary:
  ar: "يقرر القرآن أن مقياس الزمن عند الله ليس مقياس البشر: يوم عند ربك كألف سنة مما تعدون، ويوم للعروج مقداره خمسون ألف سنة؛ ومنه تعلم أهل العلم أن حسابنا للزمن نسبي لا مطلق {cite:tafsir-ibn-kathir}."
  en: "The Qur'an teaches that God's measure of time is not man's: a day with your Lord as a thousand years of your reckoning, and a day of ascent measuring fifty thousand years — from which scholars taught that our count of time is relative, not absolute {cite:tafsir-ibn-kathir}."
  ur: "قرآن بتاتا ہے کہ اللہ کے ہاں وقت کا پیمانہ انسان جیسا نہیں: تمہارے رب کے ہاں ایک دن تمہارے شمار کے مطابق ہزار سال کے برابر ہے، اور عروج کا دن پچاس ہزار سال کا ہے — اسی سے علماء نے سکھایا کہ وقت کا ہمارا شمار مطلق نہیں {cite:tafsir-ibn-kathir}۔"
