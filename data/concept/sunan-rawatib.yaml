id: concept/sunan-rawatib
class: concept
kind: legal
label:
  ar: "السُّنَن الرواتب"
  en: "Sunan rawatib (the regular sunnas attached to the obligatory prayers)"
summary:
  ar: "الرواتب جمع راتبة، وهي نوافل تُداوم عليها، وقد سميت كذلك لمشروعية المواظبة عليها، وتُطلق على النوافل المسنونة قبل الفرائض وبعدها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9848} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9849} يستحب عند جمهور الفقهاء المداومة عليها، وكره الحنابلة تركها بلا عذر، ويسن أداؤها في السفر وإن كانت في الحضر آكد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9849} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9850} وتختلف أعدادها بين المذاهب: عشر ركعات عند الشافعية والحنابلة بحد أدنى الكمال، واثنتا عشرة عند الحنفية، ولا تحديد عند المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9850} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9851} وتبحث أحكام قضائها إذا فاتت، والقراءة فيها، وصلاتها في البيت أو المسجد أو جماعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9855} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9857}"
  en: "Rawatib is the plural of ratiba, a supererogatory prayer kept up regularly; the name comes from the lawfulness of keeping at them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9848} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9849} It names the sunna prayers set before or after the obligatory prayers. Most jurists recommend keeping at them; the Hanbalis hold leaving them without excuse disliked; they are recommended on a journey, though more emphatic at home. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9849} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9850} Their number varies: ten units is the least perfection for the Shafi'is and Hanbalis, twelve for the Hanafis, and the Malikis set no fixed number. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9850} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9851} The entry also covers making up missed ones, recitation within them, and praying them at home, in the mosque or in congregation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9855} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9857}"
