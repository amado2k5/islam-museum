label:
  ar: "السُّنَن الرواتب"
  en: "Sunan rawatib (the regular sunnas attached to the obligatory prayers)"
  es: "Sunan rawatib (las sunnas regulares asociadas a las oraciones obligatorias)"
  fr: "Sunan rawatib (les sunnas régulières associées aux prières obligatoires)"
  ur: "سنن رواتیب ⁦(فرض نمازوں سے منسلک باقاعدہ سنتیں)⁩"
  tr: "Sunan al-Rawatib"
  id: "Sunan al-Rawatib"
summary:
  ar: "الرواتب جمع راتبة، وهي نوافل تُداوم عليها، وقد سميت كذلك لمشروعية المواظبة عليها، وتُطلق على النوافل المسنونة قبل الفرائض وبعدها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9848} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9849} يستحب عند جمهور الفقهاء المداومة عليها، وكره الحنابلة تركها بلا عذر، ويسن أداؤها في السفر وإن كانت في الحضر آكد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9849} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9850} وتختلف أعدادها بين المذاهب: عشر ركعات عند الشافعية والحنابلة بحد أدنى الكمال، واثنتا عشرة عند الحنفية، ولا تحديد عند المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9850} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9851} وتبحث أحكام قضائها إذا فاتت، والقراءة فيها، وصلاتها في البيت أو المسجد أو جماعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9855} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9857}"
  en: "Rawatib is the plural of ratiba, a supererogatory prayer kept up regularly; the name comes from the lawfulness of keeping at them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9848} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9849} It names the sunna prayers set before or after the obligatory prayers. Most jurists recommend keeping at them; the Hanbalis hold leaving them without excuse disliked; they are recommended on a journey, though more emphatic at home. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9849} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9850} Their number varies: ten units is the least perfection for the Shafi'is and Hanbalis, twelve for the Hanafis, and the Malikis set no fixed number. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9850} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9851} The entry also covers making up missed ones, recitation within them, and praying them at home, in the mosque or in congregation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9855} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9857}"
  es: "Rawatib es el plural de ratiba, una oración supererogatoria que se realiza con regularidad; el nombre proviene de la licitud de realizarlas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9848} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9849} Nombra las oraciones sunna que se realizan antes o después de las oraciones obligatorias. La mayoría de los juristas recomiendan realizarlas; los hanbalíes consideran desaconsejable dejarlas sin excusa; se recomiendan en un viaje, aunque son más enfáticas en casa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9849} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9850} Su número varía: diez unidades es la perfección mínima para los shafiíes y hanbalíes, doce para los hanafíes, y los malikíes no establecen un número fijo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9850} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9851} La entrada también abarca la recuperación de las oraciones omitidas, su recitación y su oración en casa, en la mezquita o en congregación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9855} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9857}"
  fr: "Rawatib est le pluriel de ratiba, une prière surérogatoire accomplie régulièrement; son nom provient de la licéité de son accomplissement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9848} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9849} Il désigne les prières sunna accomplies avant ou après les prières obligatoires. La plupart des juristes recommandent de les accomplir; les hanbalites déconseillent de les négliger sans excuse; elles sont recommandées en voyage, et plus particulièrement à domicile. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9849} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9850} Leur nombre varie: dix unités constituent le minimum pour les chaféites et les hanbalites, douze pour les hanafites, et les malikites n'en fixent pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9850} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9851} Cet article traite également du rattrapage des prières manquées, de leur récitation et de leur accomplissement à la maison, à la mosquée ou en congrégation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9855} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9857}"
  ur: "رواتیب، رتیبہ کی جمع ہے، ایک مستحسن نماز جو باقاعدگی سے ادا کی جاتی ہے۔ نام ان پر رکھنے کی قانونی حیثیت سے آتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.9848} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9849} اس میں فرض نمازوں سے پہلے یا اس کے بعد کی سنت نمازوں کا نام ہے۔ اکثر فقہاء ان کو برقرار رکھنے کا مشورہ دیتے ہیں۔ حنبلی ان کو ناپسندیدہ عذر کے بغیر چھوڑنے کے قائل ہیں۔ سفر پر ان کی سفارش کی جاتی ہے، حالانکہ گھر میں زیادہ زور دیا جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص.9849} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص.9850} ان کی تعداد مختلف ہوتی ہے: شافعیوں اور حنبلیوں کے لیے دس اکائیاں کم سے کم کمال ہیں، احناف کے لیے بارہ، اور مالکوں کے لیے مقررہ نمبر۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص.9850} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9851} اس اندراج میں چھوٹ جانے والوں کی قضاء، ان کے اندر تلاوت اور گھر، مسجد یا جماعت میں نماز پڑھنا بھی شامل ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9855}"
  tr: "Al-Rawatib, düzenli olarak yapılan gönüllü eylemler olan 'ritibah'ın çoğuludur. Düzenli iramın meşruiyeti nedeniyle bu adla adlandırılır ve zorunlu namazlardan önce ve sonra yapılan gönüllü namazları ifade eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9848} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9849} Çoğu hukukçu tarafından düzenli olarak yapılması tavsiye edilir, ancak Hanbaliler bunu mazeretsiz ihmal etmeyi sevmez ve şehirde bile seyahat ederken yapılması tavsiye edilir; şehirde bile bu daha çok onaylanır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9849} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9850} ve numaraları okullar arasında değişir: Şafi'lere göre on raket ve Hanbali'ye göre minimum mükemmellik, Hanefi'lere göre on iki rakah ve Malikilere göre hiçbir belirti yoktur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9850} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9851} Kaçırılan namazların telafisi yapma, okunma ve evde, camide veya cemaatte namaz kılma ile ilgili hükümleri inceler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9855} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9857}"
  id: "Al-Rawatib adalah bentuk jamak dari 'ritibah', yaitu tindakan sukarela yang dilakukan secara rutin. Dinamai demikian berdasarkan legitimasi pelaksanaan teratur, dan merujuk pada doa sukarela yang ditetapkan sebelum dan sesudah doa wajib. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9848} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9849} Mayoritas ahli hukum merekomendasikan untuk melakukannya secara konsisten, tetapi Hanbal tidak suka mengabaikannya tanpa alasan, dan disarankan melakukannya saat bepergian, bahkan jika di kota, yang lebih diyakinkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9849} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9850} dan jumlahnya bervariasi di antara aliran: sepuluh rak'ah menurut Shafi'i dan Hanbalis dengan kesempurnaan minimum, dua belas rak'ah menurut Hanafi, dan tanpa spesifikasi menurut Maliki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9850} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9851} Buku ini menelaah aturan tentang menebus doa yang terlewat, mengucapkannya, dan berdoa di rumah, masjid, atau jamaah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9855} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9857}"
