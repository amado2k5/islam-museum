id: concept/namimah
class: concept
kind: legal
label:
  ar: "نَمِيمَة"
  en: "Namimah (tale-bearing)"
  ur: "نمیمہ (چغلی)"
summary:
  ar: "النميمة في اللغة السعي بين الناس بالفتنة، وفي الاصطلاح نقل الكلام عن قائله إلى غيره على وجه الإفساد، وهي من الكبائر محرمة بالكتاب والسنة والإجماع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16201} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16202} وعلى النمام التوبة، وعلى من سمعها ألا يصدقها، ويَنهاه ويَنصحه، ويُبغضه في الله، ولا يظن بالمنقول عنه السوء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16203} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16204}"
  en: "Namimah is, in the lexicon, going between people to stir strife; in the term, carrying speech from its speaker to another to cause harm. It is a grave sin, forbidden by the Qur'an, the Sunna and consensus. The tale-bearer must repent; the hearer must not believe him, must forbid him and advise him, must hate him for God's sake, and must not think ill of the one reported. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16201} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16202} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16203} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16204}"
  ur: "نمیمہ لغت میں لوگوں کے درمیان فتنے کے لیے دوڑ بھاگ ہے، اور اصطلاح میں کہنے والے کی بات دوسرے تک نقصان کے لیے پہنچانا۔ یہ کبیرہ گناہ ہے، قرآن، سنت اور اجماع سے حرام۔ نمام پر توبہ لازم ہے؛ سننے والا اس کی تصدیق نہ کرے، اسے روکے، اللہ کے لیے اس سے بغض رکھے، اور جس کی بات نقل ہو اس کے بارے میں برا گمان نہ کرے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16201} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16202} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16203} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16204}"
