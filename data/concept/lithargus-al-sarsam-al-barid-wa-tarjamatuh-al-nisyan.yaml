id: concept/lithargus-al-sarsam-al-barid-wa-tarjamatuh-al-nisyan
class: concept
kind: scientific
label:
  ar: "ليثرغس وهو السرسام البارد وترجمته النسيان"
  en: "Lithargus, the cold sarsam, whose rendering is forgetfulness"
  ur: "لیثرغس یعنی ٹھنڈا سرسام جس کا ترجمہ نسیان ہے"
summary:
  ar: "يعرّف ابن سينا ليثرغس بأنه الورم البلغمي داخل القحف وهو السرسام البلغمي، ويبيّن موضعه في الدماغ، وأن اسمه من عرضه وهو النسيان وأن كثيراً من الأطباء أخطأوا فيه من اسمه، وأسبابه {cite:canon-ibn-sina-print-v2 p.84}"
  en: "Ibn Sina defines lithargus as the phlegmatic swelling inside the skull, the phlegmatic sarsam, tells where it lies in the brain, says its name comes from its sign, forgetfulness, and that many physicians erred about it from its name, and gives its causes {cite:canon-ibn-sina-print-v2 p.84}"
  ur: "ابن سینا لیثرغس کو کھوپڑی کے اندر کی بلغمی سوجن، یعنی بلغمی سرسام، بتاتا ہے، دماغ میں اس کا مقام بتاتا ہے، کہتا ہے کہ اس کا نام اس کی علامت یعنی نسیان سے ہے اور بہت سے اطبا نے اس کے نام کی وجہ سے اس میں غلطی کی، اور اس کے اسباب بتاتا ہے {cite:canon-ibn-sina-print-v2 p.84}۔"
