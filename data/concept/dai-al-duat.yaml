id: concept/dai-al-duat
class: concept
kind: political
label:
  ar: داعي الدعاة
  en: Da'i al-Du'at — the chief missionary
  es: "Da'i al-Du'at — el misionero principal"
  fr: "Da'i al-Du'at — le missionnaire en chef"
summary:
  ar: "داعي الدعاة موظف كبير أُسندت إليه رياسة الدعوة الإسماعيلية في عهد الفاطميين، كان يلي قاضي القضاة في الرتبة ويتزيا بزيه، وكثيراً ما جُمعت الوظيفتان في رجل واحد؛ ويساعده في نشر التعاليم اثنا عشر نقيباً وله نواب ينوبون عنه في البلاد فيكون الصلة بين الخليفة وأتباعه، ومن أعماله أخذ العهد على المريدين مباشرة أو بواسطة نوابه والإشراف على المحاضرات التي تلقى بمجلس الدعوة — وكانت تعرض على الخليفة لإقرارها قبل إلقائها — وجمع النجوى من المؤمنين والمؤمنات وكانت ثلاثة دراهم وثلثاً، ومن دفع ثلاثة وثلاثين ديناراً أعطي شارة فاطمية رقعة مذيلة بتوقيع الخليفة."
  en: "The da'i al-du'at, the great official to whom the headship of the Ismaili da'wa was entrusted under the Fatimids: ranking just below the qadi al-qudat and wearing his dress, the two offices often held by one man. Twelve nuqaba' assisted him in spreading the doctrine and deputies represented him in the provinces — the link between caliph and adherents — administering the oath to initiates directly or by proxy and overseeing the lectures delivered in the majlis al-da'wa, which were submitted to the caliph for approval before being taught; he also collected the najwa of 'believing men and women' at three and a third dirhams, and whoever paid thirty-three dinars received a Fatimid chit bearing the caliph's signature."
  es: "El da'i al-du'at, el alto funcionario a quien se le confiaba la dirección de la da'wa ismaelita bajo los fatimíes, ocupaba un puesto inmediatamente inferior al del qadi al-qudat y vestía su atuendo, cargos que a menudo ostentaba la misma persona. Doce nuqaba' lo asistían en la difusión de la doctrina y sus delegados lo representaban en las provincias —el vínculo entre el califa y los seguidores—, administrando el juramento a los iniciados directamente o por medio de un representante y supervisando las conferencias impartidas en el majlis al-da'wa, que se sometían a la aprobación del califa antes de ser enseñadas; también recaudaba el najwa de los \"hombres y mujeres creyentes\" a razón de tres dirhams y un tercio, y quien pagaba treinta y tres dinares recibía una ficha fatimí con la firma del califa."
  fr: "Le da'i al-du'at, haut fonctionnaire chargé de la direction de la da'wa ismaélienne sous les Fatimides, occupait un rang immédiatement inférieur à celui du cadi al-qudat et portait son habit. Ces deux fonctions étaient souvent cumulées par un seul homme. Douze nuqaba' l'assistaient dans la diffusion de la doctrine, tandis que des adjoints le représentaient dans les provinces – assurant le lien entre le calife et ses fidèles –, administrant le serment aux initiés directement ou par procuration et supervisant les enseignements dispensés au majlis al-da'wa, lesquels étaient soumis à l'approbation du calife avant d'être enseignés. Il percevait également la najwa des croyants et des croyantes, fixée à trois dirhams et un tiers. Quiconque s'acquittait de trente-trois dinars recevait un chit fatimide portant la signature du calife."
