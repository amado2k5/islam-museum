label:
  ar: داعي الدعاة
  en: Da'i al-Du'at — the chief missionary
summary:
  ar: "داعي الدعاة موظف كبير أُسندت إليه رياسة الدعوة الإسماعيلية في عهد الفاطميين، كان يلي قاضي القضاة في الرتبة ويتزيا بزيه، وكثيراً ما جُمعت الوظيفتان في رجل واحد؛ ويساعده في نشر التعاليم اثنا عشر نقيباً وله نواب ينوبون عنه في البلاد فيكون الصلة بين الخليفة وأتباعه، ومن أعماله أخذ العهد على المريدين مباشرة أو بواسطة نوابه والإشراف على المحاضرات التي تلقى بمجلس الدعوة — وكانت تعرض على الخليفة لإقرارها قبل إلقائها — وجمع النجوى من المؤمنين والمؤمنات وكانت ثلاثة دراهم وثلثاً، ومن دفع ثلاثة وثلاثين ديناراً أعطي شارة فاطمية رقعة مذيلة بتوقيع الخليفة."
  en: "The da'i al-du'at, the great official to whom the headship of the Ismaili da'wa was entrusted under the Fatimids: ranking just below the qadi al-qudat and wearing his dress, the two offices often held by one man. Twelve nuqaba' assisted him in spreading the doctrine and deputies represented him in the provinces — the link between caliph and adherents — administering the oath to initiates directly or by proxy and overseeing the lectures delivered in the majlis al-da'wa, which were submitted to the caliph for approval before being taught; he also collected the najwa of 'believing men and women' at three and a third dirhams, and whoever paid thirty-three dinars received a Fatimid chit bearing the caliph's signature."
