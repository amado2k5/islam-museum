id: concept/hikam-ali-ibn-abi-talib
class: concept
kind: ethical
label: { ar: "حكم علي بن أبي طالب", en: "The wise sayings attributed to Ali" }
summary:
  ar: "مجموعة من الحكم والأمثال المنسوبة إلى علي بن أبي طالب، يجمعها الصلابي في عدد من الفقرات المرقمة، منها: «صلاة الليل بهاء في النهار» {cite:sallabi-ali-vol1 p. 253}، و«المعروف كنز من الكنوز» {cite:sallabi-ali-vol1 p. 254}، و«خير الناس من ينفع الناس» {cite:sallabi-ali-vol1 p. 256}، و«المرء مخبوء تحت لسانه» {cite:sallabi-ali-vol1 p. 256}، و«العجز آفة، والصبر شجاعة، والزهد ثروة، والورع جنة» {cite:sallabi-ali-vol1 p. 256}، و«ذكر الموت جلاء القلوب» {cite:sallabi-ali-vol1 p. 257}. ويرى الكتاب أن هذه الحكم كانت من وسائل علي في التوجيه والتعليم مع الخطب والأشعار {cite:sallabi-ali-vol1 p. 257}."
  en: "A set of maxims attributed to Ali, collected by al-Sallabi in numbered sayings such as 'the night prayer is a splendour in the day', 'kindness is a treasure', 'the best of people is the one who benefits people', and 'death is the polish of hearts'; the book treats them as one of Ali's tools for teaching, with sermons and poems {cite:sallabi-ali-vol1 p. 257}."
