id: concept/hikam-ali-ibn-abi-talib
class: concept
kind: ethical
label: { ar: "حكم علي بن أبي طالب", en: "The wise sayings attributed to Ali", es: "Los dichos sabios atribuidos a Alí", fr: "Les sages paroles attribuées à Ali", ur: "علی سے منسوب حکیمانہ اقوال", tr: "Ali ibn Ebi Talib'in Yönetimi", id: "Pemerintahan Ali ibn Abi Talib" }
summary:
  ar: "مجموعة من الحكم والأمثال المنسوبة إلى علي بن أبي طالب، يجمعها الصلابي في عدد من الفقرات المرقمة، منها: «صلاة الليل بهاء في النهار» {cite:sallabi-ali-vol1 p. 253}، و«المعروف كنز من الكنوز» {cite:sallabi-ali-vol1 p. 254}، و«خير الناس من ينفع الناس» {cite:sallabi-ali-vol1 p. 256}، و«المرء مخبوء تحت لسانه» {cite:sallabi-ali-vol1 p. 256}، و«العجز آفة، والصبر شجاعة، والزهد ثروة، والورع جنة» {cite:sallabi-ali-vol1 p. 256}، و«ذكر الموت جلاء القلوب» {cite:sallabi-ali-vol1 p. 257}. ويرى الكتاب أن هذه الحكم كانت من وسائل علي في التوجيه والتعليم مع الخطب والأشعار {cite:sallabi-ali-vol1 p. 257}."
  en: "A set of maxims attributed to Ali, collected by al-Sallabi in numbered sayings such as 'the night prayer is a splendour in the day', 'kindness is a treasure', 'the best of people is the one who benefits people', and 'death is the polish of hearts'; the book treats them as one of Ali's tools for teaching, with sermons and poems {cite:sallabi-ali-vol1 p. 257}."
  es: "Un conjunto de máximas atribuidas a Ali, recopiladas por al-Sallabi en dichos numerados como \"la oración nocturna es un esplendor en el día\", \"la bondad es un tesoro\", \"la mejor de las personas es la que beneficia a las personas\" y \"la muerte es el pulido de los corazones\"; el libro las trata como una de las herramientas de enseñanza de Ali, con sermones y poemas {cite:sallabi-ali-vol1 p. 257}."
  fr: "Un ensemble de maximes attribuées à Ali, rassemblées par al-Sallabi dans des aphorismes numérotés tels que « la prière de nuit est une splendeur dans le jour », « la bonté est un trésor », « le meilleur des hommes est celui qui profite aux autres » et « la mort polit les cœurs »; le livre les traite comme l'un des outils d'enseignement d'Ali, avec des sermons et des poèmes {cite:sallabi-ali-vol1 p. 257}."
  ur: "علی کی طرف منسوب فقروں کا ایک مجموعہ جسے السلبی نے شمار شدہ اقوال میں جمع کیا ہے جیسے کہ 'رات کی نماز دن کی شان ہے'، 'احسان ایک خزانہ ہے'، 'لوگوں میں بہترین وہ ہے جو لوگوں کو فائدہ پہنچاتا ہے'، اور 'موت دلوں کی چمک ہے'؛ کتاب انہیں خطبات اور نظموں کے ساتھ تعلیم کے لیے علی کے اوزاروں میں سے ایک سمجھتی ہے۔ 257}۔"
  tr: "Al-Sallabi tarafından birkaç numaralı pasajda derlenen, Ali bin Abi Talib'e atfedilen bir söz ve atasözleri koleksiyonu; bunlar arasında şunlar yer alır: \"Gece namazı gündüz bir ihtişamdır\" {alıntı:sallabi-ali-cilt 1 s. 253}, \"Bilinen, hazineler hazinesidir\" {cite:sallabi-ali-cilt 1 s. 254}, \"İnsanların en iyisi başkalarına fayda sağlayandır\" {cite:sallabi-ali-cilt 1 s. 256}, \"Bir kişi dilinin altında gizlidir\" {cite:sallabi-ali-cilt 1 s. 256}, \"Zayıflık bir beladır, sabır cesarettir, çilecilik zenginliktir ve dindarlık cennettir\" {cite:sallabi-ali-cilt 1 s. 256} ve \"Ölümün anılması kalplerin temizlenmesidir\" {cite:sallabi-ali-cilt 1 s. 257}. Kitap, bu kararı Ali'nin vaazlar ve şiirler aracılığıyla rehberlik ve öğretme araçlarından biri olarak kabul eder {cite:sallabi-ali-cilt 1 s. 257}."
  id: "Kumpulan pepatah dan peribahasa yang dikaitkan dengan Ali ibn Abi Talib, disusun oleh Al-Sallabi dalam beberapa bagian bernomor, termasuk: \"Doa malam adalah kemegahan di siang hari\" {cite:sallabi-ali-vol1 hlm. 253}, \"Yang terkenal adalah harta karun\" {cite:sallabi-ali-vol1 hlm. 254}, \"Yang terbaik dari manusia adalah dia yang memberi manfaat kepada orang lain\" {cite:sallabi-ali-vol1 hlm. 256}, \"Seseorang tersembunyi di bawah lidahnya\" {cite:sallabi-ali-vol1 hlm. 256}, \"Kelemahan adalah wabah, kesabaran adalah keberanian, asketisme adalah kekayaan, dan kesalehan adalah surga\" {cite:sallabi-ali-vol1 hlm. 256}, dan \"Kenangan akan kematian adalah pembersihan hati\" {cite:sallabi-ali-vol1 hlm. 257}. Buku ini menganggap putusan ini sebagai salah satu cara Ali untuk membimbing dan mengajar melalui khotbah dan puisi {cite:sallabi-ali-vol1 hlm. 257}."
