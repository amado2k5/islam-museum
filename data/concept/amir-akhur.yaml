label:
  ar: "أمير آخور"
  en: "Amir akhur (high equerry; master of the royal stables)"
summary:
  ar: "أمير آخور، من الفارسية «مير آخور» أي «كبير السياس»، من كبار رجال البلاط في الممالك الشرقية، وفي عهد المماليك كان مشرف الإسطبلات السلطانية، وكان عادة أميرًا على ألف، ويتبعه ثلاثة أمراء على أربعين، وفي العصر الجركسي كان في المرتبة الرابعة بين الأمراء الكبار {cite:encyclopaedia-of-islam-2 vol. 1 p. 464}."
  en: "Amir akhur, from the Persian mir akhur, 'high equerry', one of the highest officials of Oriental courts. Under the Mamluks he supervised the royal stables; he was generally an amir of a thousand with three amirs of forty under him, and in the Circassian period he ranked fourth among the grand amirs {cite:encyclopaedia-of-islam-2 vol. 1 p. 464}."
