id: concept/amir-akhur
class: concept
kind: term
label:
  ar: "أمير آخور"
  en: "Amir akhur (high equerry; master of the royal stables)"
  fr: "Amir akhur (grand écuyer, maître des écuries royales)"
  es: "Amir Akhur (caballerizo mayor; maestro de las caballerizas reales)"
  ur: "امیر اخور ⁦(اعلیٰ وسیلہ؛ شاہی اصطبل کا ماسٹر)⁩"
summary:
  ar: "أمير آخور، من الفارسية «مير آخور» أي «كبير السياس»، من كبار رجال البلاط في الممالك الشرقية، وفي عهد المماليك كان مشرف الإسطبلات السلطانية، وكان عادة أميرًا على ألف، ويتبعه ثلاثة أمراء على أربعين، وفي العصر الجركسي كان في المرتبة الرابعة بين الأمراء الكبار {cite:encyclopaedia-of-islam-2 vol. 1 p. 464}."
  en: "Amir akhur, from the Persian mir akhur, 'high equerry', one of the highest officials of Oriental courts. Under the Mamluks he supervised the royal stables; he was generally an amir of a thousand with three amirs of forty under him, and in the Circassian period he ranked fourth among the grand amirs {cite:encyclopaedia-of-islam-2 vol. 1 p. 464}."
  fr: "L’amir akhur, du persan mir akhur, « grand écuyer », était l’un des plus hauts dignitaires des cours d’Orient. Sous les Mamelouks, il avait la charge des écuries royales. C’était généralement un émir de mille ayant sous ses ordres trois émirs de quarante. Sous les Mamelouks circassiens, il occupait le quatrième rang parmi les grands émirs {cite:encyclopaedia-of-islam-2 vol. 1 p. 464}."
  es: "Amir akhur, del persa mir akhur, 'alto caballerizo', uno de los más altos funcionarios de las cortes orientales. Bajo los mamelucos supervisaba los establos reales; generalmente era un emir de mil hombres con tres emires de cuarenta bajo su mando, y en el período circasiano ocupó el cuarto lugar entre los grandes emires {cite:encyclopaedia-of-islam-2 vol. 1 p. 464}."
  ur: "امیر اخور، فارسی میر اخور سے، 'ہائی ایکوری'، مشرقی عدالتوں کے اعلیٰ ترین عہدیداروں میں سے ایک۔ مملوکوں کے ماتحت وہ شاہی اصطبل کی نگرانی کرتا تھا۔ وہ عام طور پر ایک ہزار کا امیر تھا اور اس کے ماتحت چالیس کے تین امیر تھے، اور سرکاسی دور میں وہ عظیم امیروں میں چوتھے نمبر پر تھے۔ 1 ص۔ 464}۔"
