  en: "Sartan bahri (the sea crab)"
  ur: "سرطان بحری"
  es: "Sartan bahri (el cangrejo marino)"
summary:
  ar: "السرطان البحري في الكتاب ليس كل سرطان من البحر بل ضرب خاص حجري الأعضاء كلها، ينقل المؤلف عن ثقة أنه في بحر الصين يخرج من ماء البحر ويدخل في ماء آخر فيموت ويصير حجراً صلباً، ومحرقه ألطف من سائر المحرقات، يجلو الأسنان ويذهب الكلف ويجفف القروح ويجلو العين {cite:canon-ibn-sina-print-v1 p.588}."
  en: "Sartan bahri, the sea crab, is in the book not every crab of the sea but a special kind stony in all its parts; the author reports from one he trusts that in the sea of China it leaves the sea water and enters another water, dies and becomes hard stone; its burnt form is finer than other burnt things, polishes the teeth, removes freckles, dries ulcers and clears the eye {cite:canon-ibn-sina-print-v1 p.588}."
  ur: "سرطان بحری کتاب میں ہر سمندری کیکڑا نہیں بلکہ ایک خاص قسم ہے جو سب اعضا میں پتھریلی ہے؛ مصنف ایک معتبر شخص سے نقل کرتا ہے کہ چین کے سمندر میں یہ سمندر کے پانی سے نکل کر دوسرے پانی میں داخل ہوتا، مر جاتا اور سخت پتھر بن جاتا ہے؛ اس کی راکھ دوسری راکھوں سے زیادہ لطیف ہے، دانت چمکاتی، جھائیاں مٹاتی، زخم خشک کرتی اور آنکھ کو جلا دیتی ہے {cite:canon-ibn-sina-print-v1 p.588}۔"
  es: "Sartan bahri, el cangrejo marino, no es en el libro cualquier cangrejo del mar, sino una especie especial pétrea en todas sus partes; el autor informa de uno en quien confía que en el mar de China abandona el agua de mar y entra en otra agua, muere y se convierte en piedra dura; su forma quemada es más fina que otras cosas quemadas, pule los dientes, elimina las pecas, seca las úlceras y aclara los ojos {cite:canon-ibn-sina-print-v1 p.588}."
