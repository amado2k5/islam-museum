label:
  ar: الطِّيب
  en: Tayyib (purity and lawfulness)
  es: "Tayyib (pureza y legalidad)"
  fr: "Tayyib (pureté et légalité)"
  ur: "طیب ⁦(طہارت اور حلال)⁩"
  tr: "Türden"
  id: "Jenis yang"
summary:
  ar: "وصف ما يقبله الله من الأعمال والأموال والأقوال والاعتقادات بأنه طيب، مقابله الخبيث؛ يفسر ابن رجب الطيب في حديث أبي هريرة «إن الله طيب لا يقبل إلا طيباً» بمعنى الطاهر، فيكون الله مقدساً منزهاً عن النقائص والعيوب، وينقل قراءتين لقوله «لا يقبل إلا طيباً»: قراءة تخص الصدقة فلا يقبل منها إلا الحلال كما في حديث «لا يتصدق أحد بصدقة من كسب طيب ولا يقبل الله إلا طيباً»، وقراءة أعم تجعل الطيب شرطاً في الأعمال بطهارتها من المفسدات كالرياء والعجب وفي الأموال بكونها حلالاً، إذ توصف بالطيب الأعمال والأقوال والاعتقادات وكلها ينقسم إلى طيب وخبيث، ومنه تثنية القرآن بين الكلمة الطيبة كالشجرة الطيبة والكلمة الخبيثة كالشجرة الخبيثة، ووصف الرسول بأنه يحل الطيبات ويحرم الخبائث."
  en: "The attribute of deeds, wealth, words and beliefs that God accepts — tayyib, the pure — as opposed to khabith, the foul; in his commentary on Abu Hurayra's hadith 'God is pure and accepts only what is pure' Ibn Rajab explains tayyib as the pure, God being exalted above all defect, and transmits two readings of 'He accepts only what is pure': a specific reading confining it to alms — only lawfully gained charity being accepted, as in the hadith 'no one gives charity of pure earnings but God accepts only the pure' — and a broader reading making purity a condition of deeds through freedom from corrupting motives such as showing off and conceit, and of wealth through lawfulness, since deeds, words and beliefs are all described as pure or foul; hence the Quran's contrast between the good word like a good tree and the foul word like a foul tree, and the Prophet's description as one who permits the pure things and forbids the foul."
  es: "El atributo de las obras, la riqueza, las palabras y las creencias que Dios acepta — tayyib, lo puro — en contraposición a khabith, lo impuro; en su comentario sobre el hadiz de Abu Hurayra 'Dios es puro y solo acepta lo puro', Ibn Rajab explica tayyib como lo puro, siendo Dios exaltado por encima de todo defecto, y transmite dos lecturas de 'Él solo acepta lo puro': una lectura específica que lo limita a la limosna —solo se acepta la caridad obtenida lícitamente, como en el hadiz 'nadie da caridad de ganancias puras pero Dios solo acepta lo puro' — y una lectura más amplia que hace de la pureza una condición de las obras a través de la libertad de motivos corruptores como la ostentación y la vanidad, y de la riqueza a través de la licitud, ya que las obras, las palabras y las creencias se describen como puras o impuras; de ahí el contraste del Corán entre la buena palabra como un buen árbol y la mala palabra como un árbol impuro, y la descripción del Profeta como aquel que permite las cosas puras y prohíbe las impuras."
  fr: "L'attribut des actes, des biens, des paroles et des croyances que Dieu accepte — tayyib, le pur — par opposition à khabith, l'impur. Dans son commentaire du hadith d'Abu Hurayra « Dieu est pur et n'accepte que ce qui est pur », Ibn Rajab explique tayyib comme la pureté, Dieu étant exalté au-dessus de tout défaut. Il transmet deux interprétations de « Il n'accepte que ce qui est pur »: une interprétation spécifique la limitant aux aumônes — seules les charités licites étant acceptées, comme dans le hadith « nul ne fait l'aumône de gains légitimes sans que Dieu n'accepte le pur » — et une interprétation plus large faisant de la pureté une condition des actes par l'absence de motivations corruptrices telles que la vanité et l'orgueil, et des biens par la licéité, puisque les actes, les paroles et les croyances sont tous décrits comme purs ou impurs. D'où le contraste coranique entre la bonne parole, semblable à un bon arbre, et la parole impure, semblable à un arbre impur, et la description du Prophète comme celui qui permet les choses pures et interdit les impures."
  ur: "اعمال، دولت، الفاظ اور عقائد کی صفت جو خدا قبول کرتا ہے — طیب، پاک — خبیث کے برخلاف؛ ابو ہریرہ کی حدیث 'خدا پاک ہے اور صرف وہی قبول کرتا ہے جو پاک ہے' کی تفسیر میں ابن رجب طیب کو خالص، خدا کو تمام عیبوں سے بالاتر قرار دیتا ہے، اور 'وہ صرف پاک چیزوں کو قبول کرتا ہے' کی دو تلاوتیں نقل کرتا ہے: ایک مخصوص پڑھنا جو اسے صدقہ تک محدود کرتا ہے - صرف حلال طور پر حاصل شدہ صدقہ قبول ہوتا ہے، جیسا کہ صدقہ قبول ہوتا ہے، جیسا کہ اللہ تعالیٰ نے صدقہ قبول نہیں کیا۔ pure' - اور ایک وسیع تر پڑھنا پاکیزگی کو اعمال کی شرط بناتی ہے جیسے دکھاوے اور تکبر سے آزادی کے ذریعے، اور حلال کے ذریعے دولت کی، کیونکہ اعمال، الفاظ اور عقائد سب کو خالص یا ناپاک قرار دیا گیا ہے۔ لہٰذا قرآن پاک میں اچھے لفظ جیسا کہ اچھے درخت اور گندے لفظ کے درمیان فرق ہے اور نبی کا یہ بیان ہے کہ وہ پاک چیزوں کو حلال کرتا ہے اور ناپاک چیزوں سے منع کرتا ہے۔"
  tr: "Allah'ın eylemlerden, mal-mülklerden, sözlerden ve inançlardan kabul ettiği şeyin tam tersi ise kirli olanı tanımlar; İbn Receb el-Teyyib, Ebu Hureyre'nin hadisinde şöyle açıklar: \"Gerçekten Allah iyidir; sadece iyiliği kabul eder,\" yani saftır. Böylece Allah kutsaldır, kusursuzdur. \"O sadece iyiliği kabul eder\" ifadesinin iki yorumunu aktarır; bu okuma sadakati belirtir, bu okuma ise sadece yasal olanı kabul eder; örneğin hadislerde olduğu gibi: \"Kimse iyi kazançlardan sadaka kabul etmez, Allah sadece iyiliği kabul eder.\" Daha geniş bir okuma, iyiliğin gösteriş ve hayranlık gibi bozgunlardan temiz olmasını, servetin ise yasal olmasını şart koyar. İyi eylemler, sözler ve inançlar iyi ve kötü olarak ikiye ayrılır. Böylece Kur'an, iyi ağaç gibi iyi sözler ile kötü sözü kötü ağaç gibi ikiye ayırır, Peygamber'i yasal olarak tanımlar ve kötü işleri yasaklar."
  id: "Menggambarkan apa yang Allah terima dari perbuatan, kekayaan, kata-kata, dan iman sebagai kebaikan, sebaliknya adalah yang tidak murni; Ibn Rajab al-Tayyib menjelaskan dalam hadits Abu Huraira: \"Sesungguhnya, Allah itu baik; Dia hanya menerima kebaikan,\" yang berarti suci. Dengan demikian, Allah itu kudus, bebas dari cacat dan cacat. Dia mengutip dua bacaan dari frasa \"Dia hanya menerima kebaikan,\" sebuah bacaan yang menentukan kasih sayang, yang hanya diterima yang sah, seperti dalam hadits \"Tidak ada yang menerima amal dari penghasilan baik, dan Allah hanya menerima kebaikan.\" Pembacaan yang lebih luas menjadikan kebaikan sebagai syarat agar perbuatan suci dari perusak seperti pamer dan keajaiban, dan kekayaan sebagai sah. Perbuatan baik, kata-kata, dan iman semuanya dibagi menjadi baik dan jahat. Dengan demikian, Al-Qur'an menggandakan antara kata-kata baik seperti pohon baik dan kata buruk seperti pohon jahat, dan menggambarkan Nabi sebagai sah dan melarang perbuatan jahat."
