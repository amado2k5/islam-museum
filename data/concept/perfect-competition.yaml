id: concept/perfect-competition
class: concept
kind: term
tags: [islamic-economy-browser, islamic-economy-money]
label:
  ar: المنافسة الكاملة
  en: Perfect competition
  es: "Competencia perfecta"
  fr: "concurrence parfaite"
  ur: "کامل مقابلہ"
  tr: "Tam yarışma"
  id: "Persaingan penuh"
summary:
  ar: 'يعرض المؤلف خصائص المنافسة الكاملة التي يذكرها الاقتصاديون: كثرة العارضين والطالبين وصغر حجم كل منهم، وتماثل وحدات السلعة في نظر الطالبين، وحرية الدخول إلى النشاط والخروج منه، وحرية تنقل عوامل الإنتاج، وشفافية السوق {cite:usul-iqtisad-islami-0660 p. 72} {cite:usul-iqtisad-islami-0660 p. 73}. ويذكر أن ليون فالراس عرّف المنافسة بأنها الحصول على أقصى منفعة بأقصى حرية، وأن الاقتصاديين المحدثين عدلوا عن «المنافسة الحرة» إلى «المنافسة الكاملة» أو الناقصة أو الاحتكارية {cite:usul-iqtisad-islami-0660 p. 72} {cite:usul-iqtisad-islami-0660 p. 73}. ويرى المؤلف أن هذه المقومات قلقة يصعب اجتماعها، وأن الواقع يعج بالاتفاقات والتجمعات والاحتكارات والشركات المتعددة الجنسيات، وأن أزمتي 1929 و2008 استدعتا تدخل الدولة {cite:usul-iqtisad-islami-0660 p. 74} {cite:usul-iqtisad-islami-0660 p. 75}.'
  tr: "Yazar, ekonomistlerin bahsettiği mükemmel rekabetin özelliklerini sunar: çok sayıda teklif veren ve arayan ve her birinin küçük boyutu, arayıcıların gözünde emtia birimlerinin tekdüzeliği, faaliyete giriş ve çıkış özgürlüğü, üretim faktörlerinin serbest dolaşımı ve piyasa şeffaflığı {cite:usul-iqtisad-islami-0660 s. 72} {cite:usul-iqtisad-islami-0660 s. 73}. León Valras'ın rekabeti maksimum fayda elde etmek ve maksimum özgürlükle elde etmek olarak tanımladığı ve modern ekonomistlerin \"serbest rekabet\"ten \"mükemmel rekabet\"e, kusurlu ya da tekelci {cite:usul-iqtisad-islami-0660 s. 72} {cite:usul-iqtisad-islami-0660 s. 73} olduğu belirtilmiştir. Yazar, bu bileşenlerin huzursuz edici ve uzlaştırılması zor olduğunu, gerçekliğin anlaşmalar, ittifaklar, tekeller ve çok uluslu şirketlerle dolu olduğunu ve 1929 ile 2008 krizlerinin devlet müdahalesini gerektirdiğini düşünüyor {cite:usul-iqtisad-islami-0660 s. 74} {cite:usul-iqtisad-islami-0660 s. 75}."
  id: "Penulis menyajikan karakteristik persaingan sempurna yang disebutkan oleh para ekonom: banyaknya penawar dan pencari serta ukuran masing-masing yang kecil, keseragaman unit komoditas di mata para pencari, kebebasan masuk dan keluar dari aktivitas, kebebasan bergerak faktor produksi, dan transparansi pasar {cite:usul-iqtisad-islami-0660 hlm. 72} {cite:usul-iqtisad-islami-0660 hlm. 73}. Perlu dicatat bahwa León Valras mendefinisikan persaingan sebagai memperoleh manfaat maksimal dengan kebebasan maksimal, dan bahwa ekonom modern beralih dari \"persaingan bebas\" ke \"persaingan sempurna,\" atau tidak sempurna, atau monopoli {cite:usul-iqtisad-islami-0660 hlm. 72} {cite:usul-iqtisad-islami-0660 hlm. 73}. Penulis percaya bahwa komponen-komponen ini mengganggu dan sulit dipadukan, bahwa kenyataan penuh dengan perjanjian, aliansi, monopoli, dan perusahaan multinasional, serta krisis tahun 1929 dan 2008 memerlukan intervensi negara {cite:usul-iqtisad-islami-0660 hlm. 74} {cite:usul-iqtisad-islami-0660 hlm. 75}."
