label:
  ar: المنافسة الكاملة
  en: Perfect competition
summary:
  ar: 'يعرض المؤلف خصائص المنافسة الكاملة التي يذكرها الاقتصاديون: كثرة العارضين والطالبين وصغر حجم كل منهم، وتماثل وحدات السلعة في نظر الطالبين، وحرية الدخول إلى النشاط والخروج منه، وحرية تنقل عوامل الإنتاج، وشفافية السوق {cite:usul-iqtisad-islami-0660 p. 72} {cite:usul-iqtisad-islami-0660 p. 73}. ويذكر أن ليون فالراس عرّف المنافسة بأنها الحصول على أقصى منفعة بأقصى حرية، وأن الاقتصاديين المحدثين عدلوا عن «المنافسة الحرة» إلى «المنافسة الكاملة» أو الناقصة أو الاحتكارية {cite:usul-iqtisad-islami-0660 p. 72} {cite:usul-iqtisad-islami-0660 p. 73}. ويرى المؤلف أن هذه المقومات قلقة يصعب اجتماعها، وأن الواقع يعج بالاتفاقات والتجمعات والاحتكارات والشركات المتعددة الجنسيات، وأن أزمتي 1929 و2008 استدعتا تدخل الدولة {cite:usul-iqtisad-islami-0660 p. 74} {cite:usul-iqtisad-islami-0660 p. 75}.'
