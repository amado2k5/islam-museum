summary:
  ar: "النوشادر في الكتاب أجوده البيكالي الصافي البلوري، حار يابس في آخر الثالثة، ملطف مذيب، ينفع من بياض العين ويرفع اللهاة الساقطة وينفع من الخوانيق {cite:canon-ibn-sina-print-v1 p.580}."
  en: "Nushadir is in the book best when it is the clear crystalline bikali, hot and dry at the end of the third degree, thinning and dissolving; it helps whiteness of the eye, lifts the fallen uvula and helps quinsy {cite:canon-ibn-sina-print-v1 p.580}."
  ur: "نوشادر کتاب میں بہترین وہ ہے جو صاف بلوری بیکالی ہو، تیسرے درجے کے آخر میں گرم خشک، لطیف کرنے اور گھلانے والا؛ آنکھ کی سفیدی، گرے ہوئے کوّے ⁦(لہات)⁩ کو اٹھانے اور خوانیق میں مفید ہے {cite:canon-ibn-sina-print-v1 p.580}۔"
  es: "Nushadir es mejor en el libro cuando es el bikali cristalino claro, caliente y seco al final del tercer grado, diluyente y disolvente; ayuda a blanquear el ojo, levanta la úvula caída y ayuda con el ajenjil {cite:canon-ibn-sina-print-v1 p.580}."
  fr: "Nushadir est dans le livre le meilleur lorsqu'il s'agit du bikali cristallin clair, chaud et sec à la fin du troisième degré, s'amincissant et se dissolvant; il aide à la blancheur de l'œil, soulève la luette tombée et aide à l'angine de poitrine {cite:canon-ibn-sina-print-v1 p.580}."
