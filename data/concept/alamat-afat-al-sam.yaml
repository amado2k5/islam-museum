id: "concept/alamat-afat-al-sam"
class: "concept"
kind: "scientific"
label:
  ar: "علامات آفات السمع"
  en: "The signs of the disorders of hearing"
  fr: "Les signes des troubles de l’ouïe"
  ur: "سماعت کی آفتوں کی علامتیں"
  es: "Signos de trastornos de la audición"
  tr: "İşitme Lezyonları Belirtileri"
  id: "Gejala Lesi Pendengaran"
summary:
  ar: "أما الكائن بشركة الدماغ فيدل عليه الحال في الحواس الأخرى ومشاركتها السمع ومشاركة قوى الحركة إياه، وأدل الدلائل مشاركة اللسان خصوصاً إذا كان عقيب السرسام واختلاط العقل؛ وإن كان خاصاً بالعصب دلت سلامة الدماغ والثقبة ومنافذ السمع والعهد بسلامة السمع من قبل، وإن كان السبب دبيلة أو ورماً حارفاً في نفس العصب دلت عليه الحميات ويلزمها حمى واختلاط عقل وهذيان وفيه خطر، والسدة قد تكون بلا ثقل وقد تكون مع ثقل، وما كان من دود دل عليه دوام الدغدغة مع خروج الدود في الأحيان {cite:canon-ibn-sina-print-v2 p.219} {cite:canon-ibn-sina-print-v2 p.220}"
  en: "What arises by the brain's sharing is shown by the state of the other senses sharing hearing in it and the motor powers sharing it too — strongest of signs is the tongue's sharing, especially after phrenitis and confusion of mind. What is special to the nerve is shown by the soundness of brain, meatus and hearing's passages and former sound hearing; a dubayla or piercing swelling in the nerve itself brings fevers, ague, confusion and delirium and is dangerous. The occlusion may be without heaviness or with it; worms are shown by constant tickling with worms sometimes coming out {cite:canon-ibn-sina-print-v2 p.219} {cite:canon-ibn-sina-print-v2 p.220}"
  fr: "Ce qui naît de la participation du cerveau se montre par l’état des autres sens qui partagent l’atteinte avec l’ouïe, et par la participation des facultés motrices aussi ; le plus fort des signes est la participation de la langue, surtout après la phrénitis et la confusion de l’esprit. Ce qui est propre au nerf se montre par l’intégrité du cerveau, du méat et des conduits de l’ouïe, et par une ouïe auparavant saine ; une dubayla ou une tuméfaction perçante dans le nerf lui-même amène fièvres, frissons, confusion et délire, et elle est dangereuse. L’obstruction peut être sans lourdeur ou avec lourdeur ; les vers se montrent par un chatouillement constant, des vers sortant parfois {cite:canon-ibn-sina-print-v2 p.219} {cite:canon-ibn-sina-print-v2 p.220}"
  ur: "دماغ کی شرکت سے ہونے والی آفت کی دلیل دوسری حواس کی حالت ہے جو سماعت میں اس کی شریک ہوں اور حرکت کی قوتیں بھی — اور سب سے مضبوط دلیل زبان کی شرکت ہے خصوصاً سرسام اور ذہن کے اختلاط کے بعد؛ اور جو عصبے کی خاص ہو اس کی دلیل دماغ، ثقبے اور سماعت کی گزرگاہوں کی سلامت اور پہلے سے سماعت کے سالم رہنے کا عہد ہے؛ اور اگر سبب عصبے میں دبیلہ یا چبھنے والا ورم ہو تو بخار دلالت کرتے ہیں اور اس کے ساتھ ناپض، کانپنا، ذہن کا اختلاط اور ہذیان ہو اور خطرہ ہوتا ہے؛ سدہ بغیر بھاری پن کے بھی ہو سکتی ہے اور بھاری پن کے ساتھ بھی؛ اور کیڑوں کی دلیل مسلسل گدگدی اور کبھی کبھی کیڑوں کا نکلنا ہے {cite:canon-ibn-sina-print-v2 p.219} {cite:canon-ibn-sina-print-v2 p.220}"
  es: "Lo que surge por la compartición del cerebro se muestra por el estado de los demás sentidos que comparten la audición y las facultades motoras que también la comparten; el signo más fuerte es la compartición de la lengua, especialmente después de frenitis y confusión mental. Lo que es específico del nervio se muestra por la integridad del cerebro, el meato y los conductos auditivos y la audición previamente intacta; una dubayla o inflamación punzante en el propio nervio produce fiebre, escalofríos, confusión y delirio, y es peligrosa. La oclusión puede ser sin pesadez o con ella; los gusanos se muestran por un cosquilleo constante con gusanos que a veces salen {cite:canon-ibn-sina-print-v2 p.219} {cite:canon-ibn-sina-print-v2 p.220}"
  tr: "Beynin varlığı ise diğer duyuların durumu, işitme katılımı ve motor güçlerin onunla paylaşılması ile gösterilir. En göstergelik kanıtı, özellikle beynin arka kısmı ve karışık zihin ise dilin katılımıdır; eğer sinire özgüyse, beyin ve foramen ile işitme portları önceden duyma sesini gösterir. Eğer neden aynı sinirde kusma veya bozulmuş bir tümör ise, ateş ateş, karışık zihin, deliryum ve risk vardır. Kitle ağırlıksız olabilir ya da ağırlıkla olabilir. Ara sıra solucanlarla sürekli gıdıklanmayı gösteren solucanlar {cite:canon-ibn-sina-print-v2 s.219} {cite:canon-ibn-sina-print-v2 s.220}"
  id: "Kehadiran otak ditandai oleh keadaan indra lain, keterlibatan pendengaran, dan berbagi kekuatan motorik dengannya. Bukti paling indikasi, terutama jika bagian belakang otak dan pikiran campuran adalah keterlibatan bahasa; jika spesifik pada saraf, otak, foramen, dan port pendengaran mendahului suara pendengaran. Jika penyebabnya adalah muntah atau tumor yang rusak pada saraf yang sama, maka ada demam, pikiran campur aur, delirium, dan risiko. Massa bisa ringan atau berat. Cacing yang kadang-kadang menunjukkan geli terus-menerus oleh cacing {cite:canon-ibn-sina-print-v2 hlm.219} {cite:canon-ibn-sina-print-v2 hlm.220}"
