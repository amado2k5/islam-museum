label:
  ar: "رسم القرآن"
  en: "Qur'anic orthography (rasm)"
  ur: "رسمِ قرآن"
summary:
  ar: "في دروس الشيخ عمر عبد الكافي يتأمل الشيخ اختلاف رسم بعض كلمات القرآن، كحذف الياء في «المهتدي» بسورة الإسراء وحذفها في «أتمدونني» بسورة النمل، ويرى في هذا الاختلاف دلالات معنوية {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep03 00:05:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep10 00:11:00}. ويقول إن القرآن معجز في الكتابة وفي الحركة أيضاً {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep10 00:11:00}."
  en: "In Sheikh Omar Abdelkafy's lessons the Sheikh reflects on differences in how some words of the Qur'an are written, such as the dropped ya in «al-muhtadi» in Surat al-Isra and in «atumiddunani» in Surat al-Naml, and finds meaning in these differences {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep03 00:05:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep10 00:11:00}. He says the Qur'an is miraculous in its writing and even in its movement {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep10 00:11:00}."
  ur: "شیخ عمر عبد الکافی کے دروس میں شیخ قرآن کے بعض الفاظ کے رسم کے فرق پر غور کرتے ہیں، جیسے سورۂ اسراء میں «المہتدی» اور سورۂ نمل میں «اتمدوننی» کی یاء کا حذف، اور اس فرق میں معنوی دلالتیں دیکھتے ہیں {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep03 00:05:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep10 00:11:00}. وہ کہتے ہیں کہ قرآن کتابت میں اور حرکت میں بھی معجز ہے {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep10 00:11:00}."
