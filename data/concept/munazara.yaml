label: { ar: "المُنَاظَرَة", en: "Debate (munazara) and its rules", ur: "مناظرہ (علمی بحث)" }
summary:
  ar: "المناظرة في اللغة النظير أو النظر بالبصيرة، وفي الاصطلاح تردد الكلام بين شخصين يقصد كل منهما تصحيح قوله وإبطال قول صاحبه ليظهر الحق. ولها شروط وآداب، وأنواع باعتبار وسيلتها (خطابية وكتابية) وموضوعها (فقهية وغيرها)، وثمرتها إظهار الحق، وتنتهي إما إلى إفحام المعلل أو إلزام السائل."
  en: "Munazara in the lexicon is likeness or looking with insight. In law it is an exchange of words between two people, each aiming to establish his own view and overturn the other's, so that the truth appears. It has conditions and manners, kinds by means (spoken or written) and by subject (fiqh and others), an aim of making the truth plain, and it ends either in the silencing of the one who gives the reason or in the binding of the questioner."
  ur: "مناظرہ دو افراد کے درمیان ایسی گفتگو ہے جس میں ہر ایک اپنی بات ثابت کرنے اور دوسرے کی بات رد کرنے کی کوشش کرے تاکہ حق واضح ہو۔ اس کی آداب، اقسام اور انجام کا بیان فقہاء اور اہلِ علم نے کیا ہے۔"
