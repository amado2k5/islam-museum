label: { ar: "المُنَاظَرَة", en: "Debate (munazara) and its rules", ur: "مناظرہ ⁦(علمی بحث)⁩", es: "El debate (munazara) y sus reglas", fr: "Le débat (munazara) et ses règles", tr: "Tartışma", id: "Debat" }
summary:
  ar: "المناظرة في اللغة النظير أو النظر بالبصيرة، وفي الاصطلاح تردد الكلام بين شخصين يقصد كل منهما تصحيح قوله وإبطال قول صاحبه ليظهر الحق. ولها شروط وآداب، وأنواع باعتبار وسيلتها ⁦(خطابية وكتابية)⁩ وموضوعها ⁦(فقهية وغيرها)⁩، وثمرتها إظهار الحق، وتنتهي إما إلى إفحام المعلل أو إلزام السائل."
  en: "Munazara in the lexicon is likeness or looking with insight. In law it is an exchange of words between two people, each aiming to establish his own view and overturn the other's, so that the truth appears. It has conditions and manners, kinds by means (spoken or written) and by subject (fiqh and others), an aim of making the truth plain, and it ends either in the silencing of the one who gives the reason or in the binding of the questioner."
  ur: "مناظرہ دو افراد کے درمیان ایسی گفتگو ہے جس میں ہر ایک اپنی بات ثابت کرنے اور دوسرے کی بات رد کرنے کی کوشش کرے تاکہ حق واضح ہو۔ اس کی آداب، اقسام اور انجام کا بیان فقہاء اور اہلِ علم نے کیا ہے۔"
  es: "En el léxico, Munazara significa semejanza o mirada perspicaz. En derecho, es un intercambio de palabras entre dos personas, cada una con el objetivo de establecer su propia opinión y refutar la de la otra, para que la verdad salga a la luz. Tiene condiciones y modalidades, se utiliza por medio (oral o escrito) y por tema (fiqh y otros), busca esclarecer la verdad y culmina con el silencio de quien da la razón o con la condena de quien pregunta."
  fr: "Le terme « munazara » désigne, dans le lexique, la ressemblance ou l'observation perspicace. En droit, il s'agit d'un échange verbal entre deux personnes, chacune cherchant à établir son point de vue et à réfuter celui de l'autre, afin de faire émerger la vérité. Cet échange comporte des conditions et des modalités, et se caractérise par des moyens (oraux ou écrits) et des sujets (jurisprudence islamique, etc.). Son objectif est de clarifier la vérité, et il aboutit soit au silence de celui qui argumente, soit à la condamnation de celui qui questionne."
  tr: "Dilde tartışma, benzer veya içgörülü bir içgörüdür; terminolojide, iki kişi arasında tekrarlanan konuşmayı ifade eder; her biri kendi ifadesini düzeltmek ve diğerinin ifadesini çürütmek amacıyla gerçeği ortaya çıkarır. Koşulları, görgü kuralları ve araçlarına (hitabet ve yazılı) ile konusuna (fihih ve diğerleri) göre türleri vardır ve sonucu gerçeği ortaya çıkarır; bu da ya argümanı netleştirmek ya da sorgulayan kişiyi zorlamakla sonuçlanır."
  id: "Dalam bahasa, debat adalah wawasan yang serupa atau penuh wawasan, dan dalam terminologi, ia merujuk pada ucapan berulang antara dua orang, masing-masing bermaksud untuk memperbaiki pernyataan mereka dan membantah pernyataan yang lain untuk mengungkapkan kebenaran. Debat memiliki syarat, etiket, dan jenis sesuai dengan caranya (orasi dan tertulis) serta materi (yurisprudensial dan lainnya), dan hasilnya adalah mengungkap kebenaran, yang berakhir dengan memperjelas argumen atau memaksa penanya."
