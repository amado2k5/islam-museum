id: concept/alusin
class: concept
kind: natural
label:
  ar: "آلوسن"
  en: "Alusin (a herb like lupin)"
  ur: "آلوسن ⁦(ترمس سے مشابہ جڑی بوٹی)⁩"
summary:
  ar: "حشيشة تشبه الترمس، حارة يابسة في الأولى، تجفف باعتدال وتجلو، تنفع من الكلف، وقد نفعت من عضّة الكلب الكَلِب بخاصيتها عند جالينوس، ولذلك سُمّيت باليونانية آلوسن {cite:canon-ibn-sina-print-v1 p.376}."
  en: "A herb resembling lupin, hot and dry in the first degree. It dries moderately and cleanses; it helps freckles; by Galen's account it is specifically useful against the bite of a rabid dog, and the book says it is therefore called alusin in Greek {cite:canon-ibn-sina-print-v1 p.376}."
  ur: "ترمس سے مشابہ ایک جڑی بوٹی، پہلے درجے میں گرم اور خشک۔ یہ معتدل طور پر خشک کرتی اور صاف کرتی ہے، اور جھائیوں میں نفع دیتی ہے۔ جالینوس کے مطابق یہ باؤلے کتے کے کاٹے میں خاص طور پر مفید ہے، اور کتاب کہتی ہے کہ اسی لیے یونانی میں اسے آلوسن کہا جاتا ہے {cite:canon-ibn-sina-print-v1 p.376}۔"
