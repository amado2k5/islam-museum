class: concept
kind: legal
label:
  ar: "الرمق"
  en: "The last breath (ramaq): repentance, retaliation and eating forbidden food to sustain life"
  ur: "رمق (آخری سانس)"
summary:
  ar: "الرَّمَق في اللغة بقية الروح، وقيل القوة، وقيل آخر النفس، ولا يختلف معناه الاصطلاحي عن اللغوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8993} وللرمق الأخير أحكام منها: أولا، توبة من بلغ هذه الحال: ذهب جمهور الفقهاء إلى أنها لا تقبل، لأن من حضره الموت وعاين ملك الموت انقطع رجاؤه، ولأن شرط التوبة العزم على ألا يعود، ولا يتحقق ذلك مع انقطاع الاختيار، وقال بعضهم تصح توبته ما دام الرجاء باقيا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8993} ثانيا، القود على من قتل في الرمق الأخير: إذا جنى شخص فأوصل آخر إلى حال المذبوح، لا إبصار فيه ولا نطق ولا حركة اختيارية، ثم جنى عليه آخر، فالقاتل هو الأول، ويعزر الثاني لاعتدائه على حرمة الميت، أما إذا جنى الثاني قبل بلوغ المجني عليه هذه الحال فالقاتل هو الثاني، وعلى الأول القصاص في العضو أو ديته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8994} وإن كان وصول المجني عليه إلى الرمق الأخير بسبب مرض لا بجناية، فالقصاص واجب على القاتل، لأن هذه الأمور غير مقطوع بها وقد يشفى المريض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8994} ثالثا، سد الرمق بأكل المحرم: أجمع الفقهاء على أن للمضطر أن يأكل من الميتة والخنزير وغيرهما من المحرمات ما يسد به رمقه ويحفظ قوته وحياته، واستدلوا بآيات في سورة البقرة وسورة المائدة دون إيرادها هنا، واختلفوا في وجوب الأكل على من خاف الهلاك، وفي القدر المباح: هل يكفي سد الرمق أم يشبع، وهل يفرق بين المسافر والمقيم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8994} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8995} رابعا، ذبح الحيوان الذي بلغ الرمق الأخير: يشترط لحل أكل المذبوح أن تكون فيه حياة مستقرة عند الذبح، حقيقية أو مظنونة بعلامات وقرائن؛ فإن مرض الحيوان بسبب لا يحال عليه الهلاك فذبح في آخر رمقه حل أكله، أما إن مرض بأكل نبات مضر فلا يحل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8995}"
  en: "Ramaq means the remnant of life: in the lexicon it is the last of the breath, and some say it is strength. The technical sense is the same as the lexical one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8993} The jurists give it several rulings. First, repentance at the last breath: the majority hold that the repentance of someone at the point of death, who sees the angel of death, is not accepted, because hope has ended and repentance requires a firm resolve never to return, which is not possible once choice has gone; some say it is valid while hope remains. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8993} Second, retaliation for a killing at the last breath: if one person brings another to the state of a slaughtered animal (no sight, speech or voluntary movement) and a second person then strikes him, the first is the killer and the second is disciplined for violating the dead person's inviolability; if the second strikes before the victim reaches that state, the second is the killer and the first owes retaliation for the wound or its blood money. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8994} If the victim reached the last breath through illness rather than a crime, the killer owes retaliation, since such signs are not certain and the patient may recover. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8994} Third, sustaining life with forbidden food: the jurists agree that a person in necessity may eat carrion, swine and other forbidden things enough to keep him alive, citing verses from the Surahs of al-Baqara and al-Ma'ida without quoting them here. They differ on whether eating is obligatory for one who fears death, and on the amount: whether it is enough to keep him alive or he may eat to satiety, and whether the traveller and the resident are treated alike. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8994} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8995} Fourth, slaughtering an animal at its last breath: lawful slaughter requires stable life at the moment of slaughter, real or presumed from signs; if an animal fell ill from a cause that does not lead to death and was slaughtered in its last breath, its meat is lawful, but if it sickened from eating a harmful plant it is not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8995}"
  ur: "رمق سے مراد باقی ماندہ جان ہے۔ آخری سانس کی توبہ کو جمہور نے قبول نہیں کیا، کیونکہ وہ موت کو دیکھ لیتا ہے اور اختیار باقی نہیں رہتا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8993} آخری رمق میں قتل کا حکم یہ ہے کہ قاتل پہلا ہے یا دوسرا، اس کا انحصار اس پر ہے کہ مجروح اس حال کو پہنچا تھا یا نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8994} مجبور شخص اتنا حرام کھا سکتا ہے جو اسے زندہ رکھے، اور اس کی مقدار میں فقہا کا اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8994} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8995} ذبح کے وقت جان مستقر ہونا حلت کی شرط ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8995}"
