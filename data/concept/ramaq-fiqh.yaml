id: concept/ramaq-fiqh
class: concept
kind: legal
label:
  ar: "الرمق"
  en: "The last breath (ramaq): repentance, retaliation and eating forbidden food to sustain life"
  ur: "رمق ⁦(آخری سانس)⁩"
  es: "El último aliento (ramaq): arrepentimiento, represalia y comer alimentos prohibidos para sustentar la vida."
  fr: "Le dernier souffle (ramaq): repentir, vengeance et consommation d'aliments interdits pour survivre"
  tr: "Al-Rim"
  id: "Al-Rim"
summary:
  ar: "الرَّمَق في اللغة بقية الروح، وقيل القوة، وقيل آخر النفس، ولا يختلف معناه الاصطلاحي عن اللغوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8993} وللرمق الأخير أحكام منها: أولا، توبة من بلغ هذه الحال: ذهب جمهور الفقهاء إلى أنها لا تقبل، لأن من حضره الموت وعاين ملك الموت انقطع رجاؤه، ولأن شرط التوبة العزم على ألا يعود، ولا يتحقق ذلك مع انقطاع الاختيار، وقال بعضهم تصح توبته ما دام الرجاء باقيا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8993} ثانيا، القود على من قتل في الرمق الأخير: إذا جنى شخص فأوصل آخر إلى حال المذبوح، لا إبصار فيه ولا نطق ولا حركة اختيارية، ثم جنى عليه آخر، فالقاتل هو الأول، ويعزر الثاني لاعتدائه على حرمة الميت، أما إذا جنى الثاني قبل بلوغ المجني عليه هذه الحال فالقاتل هو الثاني، وعلى الأول القصاص في العضو أو ديته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8994} وإن كان وصول المجني عليه إلى الرمق الأخير بسبب مرض لا بجناية، فالقصاص واجب على القاتل، لأن هذه الأمور غير مقطوع بها وقد يشفى المريض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8994} ثالثا، سد الرمق بأكل المحرم: أجمع الفقهاء على أن للمضطر أن يأكل من الميتة والخنزير وغيرهما من المحرمات ما يسد به رمقه ويحفظ قوته وحياته، واستدلوا بآيات في سورة البقرة وسورة المائدة دون إيرادها هنا، واختلفوا في وجوب الأكل على من خاف الهلاك، وفي القدر المباح: هل يكفي سد الرمق أم يشبع، وهل يفرق بين المسافر والمقيم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8994} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8995} رابعا، ذبح الحيوان الذي بلغ الرمق الأخير: يشترط لحل أكل المذبوح أن تكون فيه حياة مستقرة عند الذبح، حقيقية أو مظنونة بعلامات وقرائن؛ فإن مرض الحيوان بسبب لا يحال عليه الهلاك فذبح في آخر رمقه حل أكله، أما إن مرض بأكل نبات مضر فلا يحل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8995}"
  en: "Ramaq means the remnant of life: in the lexicon it is the last of the breath, and some say it is strength. The technical sense is the same as the lexical one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8993} The jurists give it several rulings. First, repentance at the last breath: the majority hold that the repentance of someone at the point of death, who sees the angel of death, is not accepted, because hope has ended and repentance requires a firm resolve never to return, which is not possible once choice has gone; some say it is valid while hope remains. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8993} Second, retaliation for a killing at the last breath: if one person brings another to the state of a slaughtered animal (no sight, speech or voluntary movement) and a second person then strikes him, the first is the killer and the second is disciplined for violating the dead person's inviolability; if the second strikes before the victim reaches that state, the second is the killer and the first owes retaliation for the wound or its blood money. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8994} If the victim reached the last breath through illness rather than a crime, the killer owes retaliation, since such signs are not certain and the patient may recover. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8994} Third, sustaining life with forbidden food: the jurists agree that a person in necessity may eat carrion, swine and other forbidden things enough to keep him alive, citing verses from the Surahs of al-Baqara and al-Ma'ida without quoting them here. They differ on whether eating is obligatory for one who fears death, and on the amount: whether it is enough to keep him alive or he may eat to satiety, and whether the traveller and the resident are treated alike. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8994} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8995} Fourth, slaughtering an animal at its last breath: lawful slaughter requires stable life at the moment of slaughter, real or presumed from signs; if an animal fell ill from a cause that does not lead to death and was slaughtered in its last breath, its meat is lawful, but if it sickened from eating a harmful plant it is not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8995}"
  ur: "رمق سے مراد باقی ماندہ جان ہے۔ آخری سانس کی توبہ کو جمہور نے قبول نہیں کیا، کیونکہ وہ موت کو دیکھ لیتا ہے اور اختیار باقی نہیں رہتا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8993} آخری رمق میں قتل کا حکم یہ ہے کہ قاتل پہلا ہے یا دوسرا، اس کا انحصار اس پر ہے کہ مجروح اس حال کو پہنچا تھا یا نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8994} مجبور شخص اتنا حرام کھا سکتا ہے جو اسے زندہ رکھے، اور اس کی مقدار میں فقہا کا اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8994} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8995} ذبح کے وقت جان مستقر ہونا حلت کی شرط ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8995}"
  es: "Ramaq significa el remanente de la vida: en el léxico es el último aliento, y algunos dicen que es fuerza. El sentido técnico es el mismo que el léxico. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8993} Los juristas dan varias resoluciones al respecto. Primero, el arrepentimiento en el último aliento: la mayoría sostiene que el arrepentimiento de alguien en el punto de la muerte, que ve al ángel de la muerte, no es aceptado, porque la esperanza ha terminado y el arrepentimiento requiere una firme resolución de no volver jamás, lo cual no es posible una vez que la elección se ha perdido; algunos dicen que es válido mientras haya esperanza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8993} Segundo, represalia por un asesinato en el último aliento: si una persona lleva a otra al estado de un animal sacrificado (sin vista, habla ni movimiento voluntario) y una segunda persona lo golpea, la primera es el asesino y la segunda es castigada por violar la inviolabilidad de la persona muerta; si la segunda golpea antes de que la víctima alcance ese estado, la segunda es el asesino y la primera debe represalia por la herida o su dinero de sangre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8994} Si la víctima llegó al último aliento por enfermedad en lugar de un crimen, el asesino debe represalia, ya que tales signos no son seguros y el paciente puede recuperarse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8994} Tercero, sustentar la vida con alimentos prohibidos: los juristas concuerdan en que una persona en necesidad puede comer carroña, cerdo y otras cosas prohibidas en cantidad suficiente para mantenerse con vida, citando versículos de las Suras de al-Baqara y al-Ma'ida sin citarlos aquí. Difieren en si comer es obligatorio para quien teme a la muerte, y en la cantidad: si es suficiente para mantenerse con vida o puede comer hasta la saciedad, y si el viajero y el residente son tratados por igual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8994} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8995} Cuarto, sacrificar un animal en su último aliento: el sacrificio lícito requiere vida estable en el momento del sacrificio, real o presunta a partir de señales; Si un animal enfermó por una causa que no le causó la muerte y fue sacrificado en su último aliento, su carne es lícita; pero si enfermó por comer una planta dañina, no lo es. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8995}"
  fr: "Ramaq signifie le reste de la vie: dans le lexique, il désigne le dernier souffle, et certains l'interprètent comme la force. Le sens technique est identique au sens lexical. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8993} Les juristes émettent plusieurs avis à ce sujet. Premièrement, le repentir au dernier souffle: la majorité considère que le repentir d'une personne à l'article de la mort, qui voit l'ange de la mort, n'est pas accepté, car l'espoir est perdu et le repentir exige une ferme résolution de ne jamais revenir, ce qui est impossible une fois le choix disparu; certains estiment qu'il est valable tant que l'espoir subsiste. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8993} Deuxièmement, la vengeance pour un meurtre commis au dernier souffle: si une personne amène une autre à l’état d’animal abattu (absence de vue, de parole et de mouvement volontaire) et qu’une seconde personne la frappe ensuite, la première est le meurtrier et la seconde est punie pour avoir violé l’inviolabilité du défunt; si la seconde frappe avant que la victime n’atteigne cet état, elle est le meurtrier et la première doit une vengeance pour la blessure ou le prix du sang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8994} Si la victime est décédée des suites d’une maladie plutôt que d’un crime, le meurtrier doit une vengeance, car de tels signes ne sont pas certains et le patient peut guérir. Troisièmement, se nourrir d'aliments interdits: les juristes s'accordent à dire qu'une personne en situation de nécessité peut consommer de la charogne, du porc et d'autres aliments interdits en quantité suffisante pour survivre, citant des versets des sourates al-Baqara et al-Ma'ida sans les reproduire ici. Ils divergent quant à l'obligation de manger pour celui qui craint la mort, et quant à la quantité: doit-elle suffire à le maintenir en vie ou peut-il manger à satiété ? Le voyageur et le résident sont-ils traités de la même manière ? Quatrièmement, abattre un animal à son dernier souffle: l'abattage licite requiert que l'animal soit en vie au moment de l'abattage, que ce soit réellement ou présumé par des signes. Si un animal tombe malade d'une cause non mortelle et est abattu à son dernier souffle, sa viande est licite; en revanche, si sa maladie survient après l'ingestion d'une plante toxique, elle ne l'est pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8995}"
  tr: "Dilbilimde 'al-ram' ruhun geri kalanını ifade eder ve güç olarak adlandırılır, ayrıca ruhun sonu olarak da adlandırılır ve teknik anlamı dilsel anlamdan farklı değildir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.8993} Son 'al-raq'ın hükümleri vardır, bunlar arasında: Birincisi, bu duruma ulaşan kişinin tövbesi: Çoğu hukukçu bunun kabul edilmediğini, çünkü ölümü yaşayan ve ölüm meleğine tanık olan kişinin umudunu kaybettiğini ve tövbenin koşulunun geri dönmeme kararlılığının, seçimin sona ermesiyle gerçekleşmediğini savunur. Bazıları, onun tövbesinin umut olduğu sürece geçerli olduğunu söyler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8993} İkincisi, ipucu son anda öldürülen birine karşıdır: bir kişi suç işlerse ve başka biri onu görmeden, konuşmadan veya gönüllü hareket olmadan katliama getirirse, bir başkası ona zarar verirse, katil ilk olur ve ikinci kişi, ölenin kutsallığını ihlal ettiği için affedilir. Ancak ikinci kişi, mağdur bu duruma ulaşmadan önce eylemi işlerse, katil ikinci olur ve birinci kişi uzvun veya kan parasının intikamını ödemek zorundadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8994} Mağdur son nefesini hastalık nedeniyle verirse, bu konular sonuçlanmamış ve hasta iyileşebilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8994} Üçüncüsü, yasak bir şey yiyerek yemeği telafi etmek: Hukukçular, zorunlu kişinin açlığını gideren, gücünü ve canını koruyan leş, domuz eti ve diğer yasak yiyecekleri yemesine oybirliğiyle katılırlar. Burada saymadan Bakara Suresi ve Mezide Surelerinden ayetler alıntıladılar. Yıkımdan korkanlar için yemek yeme zorunluluğu konusunda farklı görüşlere vardılar. İzin edilen ölçü konusunda: Yiyeceği doyurmak için yeterli mi yoksa doymak için mi, ve yolcudan sakini ayırt edip etmediğine dikkat eder. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.8994} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8995} Dördüncüsü, son nefesini almış bir hayvanın kesilmesi: Kesilen hayvanın izin verilmesi için, kesim anında gerçek ya da işaret ve ipuçlarıyla şüphelenilen bir yaşama sahip olması gerekir; hayvan devredilemez bir nedenle hastalanırsa, hayatının son anında kesilir ve yiyeceği kabul edilir. Ancak, zararlı bir bitki yemekten hastalanırsa, bu izin verilmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8995}"
  id: "Dalam linguistik, 'al-ram' berarti sisa jiwa, dan dikatakan kekuatan, dan juga dikatakan sebagai akhir jiwa, dan makna teknisnya tidak berbeda dari makna linguistik. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8993} 'al-raq' terakhir memiliki keputusan, termasuk: Pertama, pertobatan seseorang yang mencapai keadaan ini: Mayoritas ahli hukum berpendapat bahwa itu tidak diterima, karena siapa pun yang mengalami kematian dan menyaksikan malaikat maut telah kehilangan harapan, dan karena syarat pertobatan adalah tekad untuk tidak kembali, yang tidak terjadi dengan berhenti memilih. Beberapa mengatakan pertobatannya sah selama harapan tetap ada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8993} Kedua, petunjuk adalah terhadap orang yang dibunuh di saat terakhir: jika seseorang melakukan kejahatan dan orang lain membawanya ke keadaan penyembelihan, tanpa penglihatan, bicara, atau gerakan sukarela, lalu yang lain melakukan luka terhadapnya, pembunuh adalah yang pertama, dan yang kedua dimaafkan karena melanggar kesucian almarhum. Namun jika yang kedua melakukan tindakan sebelum korban mencapai keadaan tersebut, pembunuh adalah yang kedua, dan yang pertama harus membayar balas dendam atas anggota tubuh atau uang darahnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8994} Jika korban menghembuskan napas terakhirnya karena sakit, bukan karena kejahatan, maka pembalasan wajib dikenakan pada pembunuh, karena perkara ini belum selesai dan pasien dapat pulih. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8994} Ketiga, menebus makanan dengan makan sesuatu yang dilarang: Para ahli hukum sepakat bahwa orang yang dipaksa boleh makan bangkai, babi, dan barang terlarang lain yang memuaskan rasa lapar serta menjaga kekuatan dan nyawanya. Mereka mengutip ayat-ayat dari Surah Al-Baqarah dan Surah Al-Ma'idah tanpa menyebutkannya di sini. Mereka berbeda pendapat mengenai kewajiban makan bagi mereka yang takut akan kehancuran. Mengenai ukuran yang diperbolehkan: apakah cukup dengan mengisi makanan atau merasa kenyang, dan apakah itu membedakan antara pengembara dan penduduk. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8994} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8995} Keempat, menyembelih hewan yang telah mencapai nafas terakhirnya: Agar hewan yang disembelih diizinkan, diwajibkan memiliki kehidupan yang stabil pada saat penyembelihan, baik nyata maupun dicurigai berdasarkan tanda dan petunjuk; jika hewan jatuh sakit karena sebab yang tidak dapat dicabut, hewan tersebut disembelih pada saat terakhir hidupnya dan makanannya diperbolehkan. Namun, jika ia jatuh sakit karena memakan tanaman berbahaya, maka tidak diperbolehkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8995}"
