id: concept/amal-ahl-madina
class: concept
kind: legal
label:
  ar: "عَمَلُ أَهْلِ الْمَدِينَة"
  en: "The practice of the people of Medina ('amal ahl al-Madina) as evidence"
  ur: "اہل مدینہ کا عمل"
summary:
  ar: "يستعمل الفقهاء عبارة عمل أهل المدينة فيما أجمع عليه أهل المدينة من عمل في القرون الثلاثة الأولى التي شهد لها النبي بالخيرية، وتوارثوه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11840}. وذهب الجمهور إلى أن إجماع أهل المدينة على عمل ليس حجة على من خالفهم، وذهب مالك إلى أن عمل أهل المدينة حجة على غيرهم، ونقل عنه أنه أراد بذلك أن يكون ترجيح روايتهم على غيرهم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11840}. وتفصيل ذلك في الملحق الأصولي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11840}."
  en: "Jurists use the phrase 'practice of the people of Medina' for what the people of Medina agreed upon as a practice in the first three centuries, which the Prophet called the best, and which they inherited {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11840}. The majority hold that the agreement of the people of Medina on a practice is not binding on those who disagree; Malik held it binding on others, and it is reported that he meant that their transmission should be preferred {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11840}. The full treatment is in the legal-theory appendix {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11840}."
