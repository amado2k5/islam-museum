id: concept/amal-ahl-madina
class: concept
kind: legal
label:
  ar: "عَمَلُ أَهْلِ الْمَدِينَة"
  en: "The practice of the people of Medina ('amal ahl al-Madina) as evidence"
  fr: "La pratique des gens de Médine (‘amal ahl al-Madina) comme preuve"
  ur: "اہل مدینہ کا عمل"
  es: "La práctica de la gente de Medina ('amal ahl al-Madina) como evidencia"
summary:
  ar: "يستعمل الفقهاء عبارة عمل أهل المدينة فيما أجمع عليه أهل المدينة من عمل في القرون الثلاثة الأولى التي شهد لها النبي بالخيرية، وتوارثوه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11840}. وذهب الجمهور إلى أن إجماع أهل المدينة على عمل ليس حجة على من خالفهم، وذهب مالك إلى أن عمل أهل المدينة حجة على غيرهم، ونقل عنه أنه أراد بذلك أن يكون ترجيح روايتهم على غيرهم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11840}. وتفصيل ذلك في الملحق الأصولي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11840}."
  en: "Jurists use the phrase 'practice of the people of Medina' for what the people of Medina agreed upon as a practice in the first three centuries, which the Prophet called the best, and which they inherited {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11840}. The majority hold that the agreement of the people of Medina on a practice is not binding on those who disagree; Malik held it binding on others, and it is reported that he meant that their transmission should be preferred {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11840}. The full treatment is in the legal-theory appendix {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11840}."
  fr: "Les juristes appellent « pratique des gens de Médine » un usage reçu en héritage sur lequel les Médinois se sont accordés durant les trois premiers siècles, que le Prophète a qualifiés de meilleurs {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11840}. La majorité estime que l’accord des Médinois sur un usage ne lie pas ceux qui sont d’un autre avis ; Malik le tenait pour contraignant pour les autres, et on rapporte qu’il entendait par là donner la préférence à ce qu’ils transmettaient {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11840}. La question est traitée en détail dans l’appendice sur la théorie du droit {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11840}."
  es: "Los juristas utilizan la expresión «práctica del pueblo de Medina» para referirse a aquello que el pueblo de Medina acordó como práctica durante los tres primeros siglos, que el Profeta consideró la mejor y que ellos heredaron {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11840}. La mayoría sostiene que el acuerdo del pueblo de Medina sobre una práctica no es vinculante para quienes discrepan; Malik, en cambio, la consideró vinculante para los demás, y se dice que quiso decir que su transmisión debía ser la preferida {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11840}. El análisis completo se encuentra en el apéndice de teoría jurídica {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11840}."
  ur: "فقہا 'اہل مدینہ کا عمل' کا جملہ اس بات کے لیے استعمال کرتے ہیں جس پر مدینہ کے لوگ پہلی تین صدیوں میں ایک عمل کے طور پر متفق تھے، جسے نبی نے بہترین قرار دیا، اور جسے انہیں وراثت میں ملا تھا۔ اکثریت کا خیال ہے کہ اہل مدینہ کا کسی عمل پر اتفاق اختلاف کرنے والوں پر لازم نہیں ہے۔ مالک نے اسے دوسروں پر پابند کیا، اور روایت ہے کہ ان کا مطلب یہ تھا کہ ان کی ترسیل کو ترجیح دی جائے {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص11840}۔ مکمل علاج قانونی نظریہ ضمیمہ میں ہے {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11840}۔"
