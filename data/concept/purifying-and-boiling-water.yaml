id: concept/purifying-and-boiling-water
class: concept
kind: scientific
label: { ar: "تنقية الماء وتصعيده وطبخه عند ابن سينا", en: "Purifying, distilling and boiling water in the Canon", ur: "قانون میں پانی کی صفائی، تقطیر اور ابالنا", es: "Purificación, destilación y ebullición del agua en el Canon", fr: "Purifier, distiller et faire bouillir l'eau dans le Canon", tr: "İbn Sina'ya göre su arıtma, tırmanma ve pişirme", id: "Pemurnian air, eskalasi, dan memasak menurut Ibn Sina" }
summary:
  ar: "يذكر ابن سينا أن التصعيد والتقطير يصلحان المياه الرديئة، فإن لم يمكن فالطبخ، فإن المطبوخ على ما شهد به العلماء أقل نفخاً وأسرع انحداراً {cite:canon-ibn-sina-print-v1 p.135}."
  en: "Ibn Sina says that distillation and filtration set bad waters right, and where that is impossible, boiling, since boiled water, as the learned attest, causes less wind and passes down faster {cite:canon-ibn-sina-print-v1 p.135}."
  es: "Ibn Sina dice que la destilación y la filtración mejoran las aguas malas, y cuando eso es imposible, la ebullición, ya que el agua hervida, como atestiguan los eruditos, causa menos gases y pasa más rápido {cite:canon-ibn-sina-print-v1 p.135}."
  fr: "Ibn Sina dit que la distillation et la filtration permettent de purifier les eaux impures, et lorsque cela est impossible, l'ébullition, car l'eau bouillie, comme l'attestent les savants, provoque moins de vent et descend plus rapidement {cite:canon-ibn-sina-print-v1 p.135}."
  ur: "ابن سینا کا کہنا ہے کہ کشید اور تطہیر خراب پانی کو درست کرتی ہے، اور جہاں یہ ناممکن ہے، ابلتا ہے، کیونکہ ابلا ہوا پانی، جیسا کہ سیکھا گیا ہے، کم ہوا پیدا کرتا ہے اور تیزی سے نیچے گرتا ہے۔"
  tr: "İbn Sina, tırmanma ve damıtmanın kötü su için iyi olduğunu belirtir; eğer bu mümkün değilse, bilim insanlarına göre yemek pişirme daha az şişir ve daha hızlı bozulur {cite:canon-ibn-sina-print-v1 s.135}."
  id: "Ibn Sina menyebutkan bahwa eskalasi dan distilasi baik untuk air yang buruk; jika itu tidak memungkinkan, maka memasak, menurut para ilmuwan, kurang mengembang dan lebih cepat rusak {cite:canon-ibn-sina-print-v1 hlm.135}."
