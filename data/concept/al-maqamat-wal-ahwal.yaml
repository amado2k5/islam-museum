label: { ar: "المقامات والأحوال", en: "Stations and states (al-maqamat wa'l-ahwal)", ur: "مقامات اور احوال" }
summary:
  ar: "اصطلاح صوفي لمنازل سير القلب إلى الله وما يرد عليه فيها: فالمقامات عند كثير منهم كسبية والأحوال وهبية. سماها ابن تيمية «أعمال القلوب» وجعلها واجبة على جميع الخلق، ونقد ابن القيم في مدارج السالكين ترتيبها ترتيباً متتابعاً كمنازل السفر الحسي، ورأى أن السالك يستصحب كثيراً منها في كل منزلة."
  en: "A Sufi term for the halting places of the heart's journey to God and what comes upon it there: for many Sufis the stations are acquired and the states are gifts. Ibn Taymiyya called them 'the works of the heart' and held them obligatory on all; Ibn al-Qayyim in Madarij al-Salikin criticised ranking them in a sequence like the stages of a physical journey, holding that the wayfarer carries many of them with him in every station."
