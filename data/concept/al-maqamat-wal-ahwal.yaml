label: { ar: "المقامات والأحوال", en: "Stations and states (al-maqamat wa'l-ahwal)", fr: "Stations et états (al-maqamat wa'l-ahwal)", ur: "مقامات اور احوال", es: "Estaciones y estados (al-maqamat wa'l-ahwal)", tr: "İstasyonlar ve koşullar", id: "Stasiun dan kondisi" }
summary:
  ar: "اصطلاح صوفي لمنازل سير القلب إلى الله وما يرد عليه فيها: فالمقامات عند كثير منهم كسبية والأحوال وهبية. سماها ابن تيمية «أعمال القلوب» وجعلها واجبة على جميع الخلق، ونقد ابن القيم في مدارج السالكين ترتيبها ترتيباً متتابعاً كمنازل السفر الحسي، ورأى أن السالك يستصحب كثيراً منها في كل منزلة."
  en: "A Sufi term for the halting places of the heart's journey to God and what comes upon it there: for many Sufis the stations are acquired and the states are gifts. Ibn Taymiyya called them 'the works of the heart' and held them obligatory on all; Ibn al-Qayyim in Madarij al-Salikin criticised ranking them in a sequence like the stages of a physical journey, holding that the wayfarer carries many of them with him in every station."
  fr: "Terme soufi désignant les étapes du cheminement du cœur vers Dieu et ce qui lui advient à ces étapes : pour beaucoup de soufis, les stations s'acquièrent et les états sont des dons. Ibn Taymiyya les appelle « les œuvres du cœur » et les tient pour obligatoires pour tous. Dans les Madarij al-Salikin, Ibn al-Qayyim critique leur classement en une succession comparable aux étapes d'un voyage physique, estimant que le voyageur en garde beaucoup avec lui à chaque station."
  es: "Un término sufí que designa las paradas en el camino del corazón hacia Dios y lo que encuentra en ellas: para muchos sufíes, las estaciones se adquieren y los estados son dones. Ibn Taymiyya las denominó «las obras del corazón» y las consideró obligatorias para todos; Ibn al-Qayyim, en Madarij al-Salikin, criticó la idea de ordenarlas como las etapas de un viaje físico, argumentando que el caminante lleva consigo muchas de ellas en cada parada."
  ur: "خدا کی طرف دل کے سفر کے رک جانے والی جگہوں کے لیے ایک صوفی اصطلاح اور اس پر کیا آتا ہے: بہت سے صوفیاء کے لیے مقامات حاصل کیے جاتے ہیں اور ریاستیں تحفے ہیں۔ ابن تیمیہ نے انہیں 'دل کے کام' کہا اور انہیں سب پر واجب قرار دیا۔ ابن القیم نے مدارج السالکین میں ان کی درجہ بندی کو جسمانی سفر کے مراحل کی طرح ترتیب دینے پر تنقید کی ہے اور کہا ہے کہ مسافر ان میں سے بہت سے لوگوں کو ہر اسٹیشن پر اپنے ساتھ لے جاتا ہے۔"
  tr: "Kalbin Allah'a yolculuğunun durakları ve ona atfedilenler için bir tasavvuf terminolojisi: Birçokları için istasyonlar edinilir ve koşullar Vahbiyyedir. İbn Teymiyye buna \"kalbin işleri\" demiş ve tüm yaratılış için zorunlu kılmıştır. İbn el-Kayyim, Medreci-el-Salikin'inde bunların duyusal seyahat istasyonları gibi sıralı düzenini eleştirmiş ve arayıcının her aşamada birçoğuna eşlik ettiğini görmüştür."
  id: "Istilah sufi untuk pemberhentian perjalanan hati menuju Allah dan yang dikaitkan dengannya: Bagi banyak orang, status diperoleh dan syaratnya adalah Wahbiyyah. Ibn Taymiyyah menyebut ini \"urusan hati\" dan menjadikannya wajib bagi seluruh ciptaan. Ibn al-Qayyim, dalam Madraja al-Salikin, mengkritik susunan berurutan mereka seperti stasiun perjalanan sensorik dan mengamati bahwa pencari menemani banyak orang di setiap tahap."
