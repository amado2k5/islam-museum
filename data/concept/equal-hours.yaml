id: concept/equal-hours
class: concept
kind: scientific
label: { ar: "الساعات المعتدلة", en: "Equal hours", es: "Iguales horas", fr: "Heures égales", ur: "مساوی گھنٹے", tr: "Orta çalışma saatleri", id: "Jam kerja sedang" }
summary:
  ar: "ساعات متساوية الطول على الدوام، تُعدّ بقسمة اليوم بليلته أربعاً وعشرين ساعة، فكل ساعة خمسة عشر درجة من دور الفلك. ويبدأ أصحاب الزيجات اليوم بليلته من نصف النهار إلى نصف نهار الغد. {cite:farghani-elements-astronomy p. 87}{cite:farghani-elements-astronomy p. 84}"
  en: "Hours of constant length, made by dividing the day and night together into twenty-four parts, so each hour is fifteen degrees of the sphere's turn. The astronomers, al-Farghani reports, count the day and night from midday to midday {cite:farghani-elements-astronomy p. 87}{cite:farghani-elements-astronomy p. 84}."
  es: "Horas de duración constante, formadas al dividir el día y la noche en veinticuatro partes, de modo que cada hora equivale a quince grados de giro de la esfera. Según informa al-Farghani, los astrónomos cuentan el día y la noche desde el mediodía hasta el mediodía siguiente {cite:farghani-elements-astronomy p. 87}{cite:farghani-elements-astronomy p. 84}."
  fr: "Les heures ont une durée constante, obtenue en divisant le jour et la nuit en vingt-quatre parties, de sorte que chaque heure corresponde à quinze degrés de rotation de la sphère. Les astronomes, rapporte al-Farghani, comptent le jour et la nuit de midi à midi {cite:farghani-elements-astronomy p. 87}{cite:farghani-elements-astronomy p. 84}."
  ur: "مسلسل طوالت کے گھنٹے، دن اور رات کو ایک ساتھ چوبیس حصوں میں تقسیم کر کے بنائے جاتے ہیں، لہذا ہر گھنٹہ کرہ کی باری کا پندرہ ڈگری ہے۔ ماہرین فلکیات، الفرغانی رپورٹس، دوپہر سے دوپہر تک دن اور رات کی گنتی کرتے ہیں۔ 87}{حوالہ:فرغانی-عناصر-فلکیات صفحہ۔ 84}۔"
  tr: "Eşit uzunluktaki saatler her zaman günü geceye yirmi dört saate bölerek sayılır; her saat astronomik yörüngenin on beş derecesine sahiptir. Evli çiftler gecelerine yarın öğleden öğlene kadar başlar. {alıntı:farghani-elements-astronomy s. 87} {cite:farghani-elements-astronomy s. 84}"
  id: "Jam dengan durasi yang sama selalu dihitung dengan membagi hari menjadi malamnya dengan dua puluh empat jam, dengan setiap jam memiliki lima belas derajat orbit astronomi. Pasangan menikah memulai malam mereka dari tengah hari hingga tengah hari besok. {cite:farghani-elements-astronomy hlm. 87} {cite:farghani-elements-astronomy hlm. 84}"
