id: concept/al-maqam-al-mahmud
class: concept
kind: belief
label:
  ar: "المقام المحمود والشفاعة الكبرى"
  en: "The Praised Station and the Great Intercession"
  ur: "مقامِ محمود اور شفاعتِ کبریٰ"
summary:
  ar: "المقام المحمود مقام الشفاعة الكبرى يوم القيامة: يشتد الناس فيذهبون إلى آدم ثم نوح ثم إبراهيم ثم موسى ثم عيسى، فيقولون ليس لي، حتى يأتوا محمدًا فيشفع لهم عند ربهم {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  en: "The Praised Station is the station of the Great Intercession on the Day: people in their distress go to Adam, then Nuh, then Ibrahim, then Musa, then 'Isa, each saying it is not for me, until they come to Muhammad and he intercedes for them before their Lord {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  ur: "مقامِ محمود قیامت کے دن شفاعتِ کبریٰ کا مقام ہے: لوگ سختی میں آدم، پھر نوح، پھر ابراہیم، پھر موسیٰ، پھر عیسیٰ کے پاس جائیں گے اور ہر ایک کہے گا یہ میرا کام نہیں، یہاں تک کہ وہ محمد کے پاس آئیں گے اور وہ اپنے رب کے پاس ان کی شفاعت کریں گے {cite:sahih-al-bukhari} {cite:sahih-muslim}۔"
