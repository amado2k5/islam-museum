id: concept/iyafa
class: concept
kind: belief
label:
  ar: "العِيافة"
  en: "Iyafa: augury by birds, and the aversion to food"
  ur: "عیافہ (پرندوں سے فال اور کھانے سے کراہت)"
summary:
  ar: "تطلق العيافة في اللغة على كراهية الطعام أو الشراب، وعلى زجر الطير للتشاؤم أو التفاؤل بأسمائها وأصواتها ومَمَرّها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11950}. وكانت العيافة بمعنى زجر الطير عادة للعرب في الجاهلية، فأبطلها الإسلام ونهى عنها، وأرجع الأمر إلى مشيئة الله المطلقة وسننه الثابتة في الكون {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11950}. ووردت في الأثر عدّ العيافة والطِّيَرة والطَّرق من الجبت، وهو حكم يرد في باب التطير {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11951}. أما العيافة بمعنى كراهية الطعام فقد ورد فيها حديث خالد بن الوليد في الضب الذي أهوى إليه النبي فامتنع عنه لأنه لم يكن بأرض قومه فلم يألفه، ثم أكله خالد بحضرته ولم ينهه عنه، فتبين حله وأن تركه لعدم الإلف {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11951}."
  en: "In the lexicon, iyafa means disliking food or drink, and also the augury of birds: reading omens of good or ill from their names, cries and flight paths {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11950}. Augury by birds was an Arab custom in the pre-Islamic era; Islam abolished it, returned the matter to God's absolute will and to the fixed laws of creation {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11950}. A report counts augury, bird-omens and the drawing of lines as a form of falsehood, a matter treated under the heading of omens {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11951}. In the sense of aversion to food, a report from Khalid ibn al-Walid tells of a dish of lizard set before the Prophet, which he withdrew from because it was not common in his people's land and he was not used to it; Khalid then ate it in his presence and he did not forbid it, which shows it is lawful and that his withdrawal was from unfamiliarity {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11951}."
  ur: "عیافہ لغت میں کھانے یا پینے سے کراہت کو کہتے ہیں، اور پرندوں کو اڑا کر ان کے نام، آواز یا گزرنے کے رخ سے نیک یا بد فال لینے کو بھی {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11950}۔ جاہلیت میں پرندوں سے فال لینا عربوں کی عادت تھی، جسے اسلام نے باطل کیا اور معاملے کو اللہ کی مشیت اور کائنات کے ثابت قوانین کے سپرد کیا {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11950}۔ ایک اثر میں عیافہ، طِیَرہ اور طَرق کو «جبت» شمار کیا گیا ہے، جو باب تطیر میں زیر بحث آتا ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11951}۔ کھانے سے کراہت کے معنی میں خالد بن الولید کی روایت ہے کہ ان کے سامنے گوہ پیش کی گئی تو نبی نے اسے نہ چکھا کیونکہ وہ ان کی قوم کے علاقے میں عام نہ تھی، پھر خالد نے آپ کی موجودگی میں اسے کھایا اور آپ نے منع نہ کیا، جس سے اس کا حلال ہونا واضح ہوتا ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11951}۔"
