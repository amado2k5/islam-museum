id: concept/hima
education:
  did_you_know:
    ar: "الحمى أرض محمية يُمنع رعيها إلا لمن حُميت له؛ حمى النبي لأهل جرش حمىً بأعلام معلومة للفرس والراحلة وبقرة الحرث، فمن رعاه سُحت ماله."
    en: "A hima is a protected ground where grazing is barred to all but its wards; the Prophet set one for the people of Jurash with known marks for horse, mount and plough-ox — whoever grazed it, his wealth was forfeit."
    ur: "حمیٰ ایک محفوظ زمین ہے جس میں سوائے مستحقوں کے چرنا ممنوع؛ نبی نے جُرش کے لوگوں کے لیے گھوڑے، سواری اور ہل کے بیل کے لیے نشانات کے ساتھ حمیٰ مقرر کیا — جو چرائے اس کا مال برباد۔"
    sources: [source/ibn-hisham-sira, source/usul-iqtisad-islami-0660]
