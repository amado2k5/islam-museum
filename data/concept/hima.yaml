label: { ar: "الحِمى", en: "Hima (protected reserve)" }
summary:
  ar: "أرض محمية يُمنع رعيها إلا لمن حُميت له؛ في سيرة ابن هشام حمى النبي لأهل جرش حمى حول قريتهم على أعلام معلومة للفرس والراحلة وبقرة الحرث، فمن رعاه من الناس فماله سُحت، وكتب لهمدان أن لهم فراع أرضهم ووهاطها يرعون عافيها ما أقاموا الصلاة وآتوا الزكاة. وبعد قرنين كان الهمداني لا يزال يعدّد حميات القبائل بأسمائها في كتابه — منها حمى ضَرِيّة وحمى القطيف وحمى النُطاة {cite:sifat-jazirat-al-arab pp. 124-127}. ويذكر المؤلف أن الحمى العام يُخصص لمصلحة عامة كرعي خيل الجهاد وسوائم الصدقة، وأنه ليس ملكًا خاصًّا لفرد ولا لدولة، وأن عمر أجاز الرعي فيه للفقراء دون الأغنياء {cite:usul-iqtisad-islami-0660 p. 59} {cite:usul-iqtisad-islami-0660 p. 60}، واستشهد بقول النبي: «لا حمى إلا لله ولرسوله» {cite:usul-iqtisad-islami-0660 p. 60}."
  en: "A reserved pasture closed to all but those for whom it is set aside; in Ibn Hisham the Prophet set a hima around the village of Jurash with marked boundaries for the horse, the riding camel and the plough-ox, declaring the property of any outsider who grazed it forfeit, and wrote to Hamdan that the heights and lowlands of their land were theirs to graze while they prayed and paid zakat. Al-Hamdani's gazetteer still maps the tribal himas by name two centuries on — the hima of Dariyya, of the Qutayf and of the Nuta among them {cite:sifat-jazirat-al-arab pp. 124-127}."
