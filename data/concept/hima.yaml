label: { ar: "الحِمى", en: "Hima (protected reserve)", es: "Hima (reserva protegida)", fr: "Hima (réserve protégée)", ur: "ہیما ⁦(محفوظ ریزرو)⁩", tr: "ateş", id: "demam" }
summary:
  ar: "أرض محمية يُمنع رعيها إلا لمن حُميت له؛ في سيرة ابن هشام حمى النبي لأهل جرش حمى حول قريتهم على أعلام معلومة للفرس والراحلة وبقرة الحرث، فمن رعاه من الناس فماله سُحت، وكتب لهمدان أن لهم فراع أرضهم ووهاطها يرعون عافيها ما أقاموا الصلاة وآتوا الزكاة. وبعد قرنين كان الهمداني لا يزال يعدّد حميات القبائل بأسمائها في كتابه — منها حمى ضَرِيّة وحمى القطيف وحمى النُطاة {cite:sifat-jazirat-al-arab pp. 124-127}. ويذكر المؤلف أن الحمى العام يُخصص لمصلحة عامة كرعي خيل الجهاد وسوائم الصدقة، وأنه ليس ملكًا خاصًّا لفرد ولا لدولة، وأن عمر أجاز الرعي فيه للفقراء دون الأغنياء {cite:usul-iqtisad-islami-0660 p. 59} {cite:usul-iqtisad-islami-0660 p. 60}، واستشهد بقول النبي: «لا حمى إلا لله ولرسوله» {cite:usul-iqtisad-islami-0660 p. 60}."
  en: "A reserved pasture closed to all but those for whom it is set aside; in Ibn Hisham the Prophet set a hima around the village of Jurash with marked boundaries for the horse, the riding camel and the plough-ox, declaring the property of any outsider who grazed it forfeit, and wrote to Hamdan that the heights and lowlands of their land were theirs to graze while they prayed and paid zakat. Al-Hamdani's gazetteer still maps the tribal himas by name two centuries on — the hima of Dariyya, of the Qutayf and of the Nuta among them {cite:sifat-jazirat-al-arab pp. 124-127}."
  es: "Un pastizal reservado, cerrado a todos excepto a aquellos para quienes está reservado; en Ibn Hisham, el Profeta estableció un hima alrededor de la aldea de Jurash con límites marcados para el caballo, el camello de monta y el buey de arado, declarando confiscada la propiedad de cualquier forastero que pastoreara allí, y escribió a Hamdan que las alturas y las tierras bajas de su tierra eran suyas para pastorear mientras oraban y pagaban el zakat. El diccionario geográfico de Al-Hamdani todavía mapea los himas tribales por nombre dos siglos después, entre ellos el hima de Dariyya, el de Qutayf y el de Nuta {cite:sifat-jazirat-al-arab pp. 124-127}."
  fr: "Un pâturage réservé, interdit à tous sauf à ceux qui y sont affectés; selon Ibn Hisham, le Prophète établit une hima autour du village de Jurash, délimitant les pâturages pour le cheval, le chameau de selle et le bœuf de labour, et déclarant confiscation des biens de tout étranger qui y ferait paître son animal. Il écrivit également à Hamdan que les hauteurs et les plaines de leurs terres leur appartenaient pour y faire paître leurs animaux, à condition qu'ils y prient et s'acquittent de la zakat. Le répertoire d'Al-Hamdani recense encore, deux siècles plus tard, les himas tribaux par leur nom: la hima des Dariyya, des Qutayf et des Nuta, entre autres (voir: Sifat-Jazirat-al-Arab, p. 124-127)."
  ur: "ایک محفوظ چراگاہ سب کے لیے بند ہے سوائے ان کے جن کے لیے اسے الگ رکھا گیا ہے۔ ابن ہشام میں ہے کہ نبی نے جرش گاؤں کے گرد گھوڑے، سوار اونٹ اور ہل کے بیلوں کے لیے ایک ہیما مقرر کیا، جس میں کسی بھی غیر ملکی کی جائیداد جو اسے چرائے اسے ضبط کر لیا، اور حمدان کو لکھا کہ ان کی زمین کی بلندی اور نشیبی علاقے ان کے چرنے کے لیے ہیں جب وہ نماز اور زکوٰۃ ادا کرتے ہیں۔ الحمدانی کا گزٹئیر اب بھی دو صدیوں پر قبائلی حماس کے نام سے نقشہ بناتا ہے — داریہ کا ہما، قطائف کا اور ان میں سے نوطہ کا۔"
  tr: "Koruma altındaki toprak, otlatılması sadece korunanlar için yasaktır; İbn Hisham'ın biyografisinde Peygamber, köylerinin çevresinde Persler, develer ve sabanlık ineklerine ait bilinen bayraklar altında Cerash halkını koruma altına almıştır. Halk arasında kim varsa, servetini kaybederdi. Hamdan'a, topraklarının ve topraklarının çiftçilerinin evrildiği ve zekât ödedikleri sürece refahını sağladıkları yazılmıştı. İki yüzyıl sonra, Al-Hamdani kitabında aşiret himayelerini isimleriyle listelemeye devam etti — Durriyah Ateşi, Katif Hotası ve Al-Natah Ateşi dahil {cite:Sifat-jazirat-al-Arab, s. 124-127}. Yazar, kamu korumasının kamu yararı için tasarlandığını, örneğin cihat atlarını gütmek ve hayırseverlik yapmak gibi, bunun bir bireyin ya da devletin malı olmadığını, Umar'ın orada yoksullar için zenginler yerine otlatmaya izin verdiğini belirtir {cite:usul-iqtisad-islami-0660 s. 59} {cite:usul-iqtisad-islami-0660 s. 60} ve Peygamber'in \"Allah ve Onun Elçisi dışında koruma yoktur\" {cite:usul-iqtisad-islami-0660 s. 60} sözünü aktarır."
  id: "Tanah yang dilindungi yang penggembalaannya dilarang kecuali bagi mereka yang dilindungi; dalam biografi Ibn Hisham, Nabi melindungi masyarakat Jerash dengan area terlindungi di sekitar desa mereka pada bendera yang diketahui milik orang Persia, unta, dan sapi bajak. Siapa pun yang merawatnya di antara rakyat kehilangan kekayaannya. Ditulis kepada Hamdan bahwa mereka memiliki para petani di tanah dan tanahnya yang merawat kesejahteraannya selama mereka berdoa dan membayar zakat. Dua abad kemudian, Al-Hamdani terus mencantumkan protektorat suku secara nama dalam bukunya — termasuk Demam Durriyah, Hota Qatif, dan Demam Al-Natah {cite:Sifat-jazirat-al-Arab, hlm. 124-127}. Penulis menyebutkan bahwa perlindungan publik ditujukan untuk kepentingan umum, seperti menggembala kuda jihad dan amal amal, dan bahwa itu bukan milik individu atau negara, dan bahwa Umar mengizinkan penggembalaan di sana untuk orang miskin daripada orang kaya {cite:usul-iqtisad-islami-0660 hlm. 59} {cite:usul-iqtisad-islami-0660 hlm. 60}, dan mengutip kata Nabi: \"Tidak ada perlindungan kecuali Allah dan Rasul-Nya\" {cite:usul-iqtisad-islami-0660 hlm. 60}."
