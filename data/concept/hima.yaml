summary:
  ar: "أرض محمية يُمنع رعيها إلا لمن حُميت له؛ في سيرة ابن هشام حمى النبي لأهل جرش حمى حول قريتهم على أعلام معلومة للفرس والراحلة وبقرة الحرث، فمن رعاه من الناس فماله سُحت، وكتب لهمدان أن لهم فراع أرضهم ووهاطها يرعون عافيها ما أقاموا الصلاة وآتوا الزكاة."
  en: "A reserved pasture closed to all but those for whom it is set aside; in Ibn Hisham the Prophet set a hima around the village of Jurash with marked boundaries for the horse, the riding camel and the plough-ox, declaring the property of any outsider who grazed it forfeit, and wrote to Hamdan that the heights and lowlands of their land were theirs to graze while they prayed and paid zakat."
