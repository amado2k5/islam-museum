id: concept/al-muzah
class: concept
kind: ethical
tags: [juha-browser, juha-kind-jest]
label: { ar: "المزاح والدعابة", en: "Jesting and playfulness (muzah)", ur: "مزاح اور خوش طبعی", fr: "La plaisanterie (muzah)", es: "La broma (muzah)", tr: "Şakalar ve mizah", id: "Lelucon dan humor" }
summary:
  ar: "المزاح هو المداعبة بالقول والفعل من غير قصد الأذى. في نصوص السنة التي يجمعها المتحف مزاح نبوي لا يخرج عن الصدق، كمناداة أنس بن مالك بلقب مازح {cite:jami-al-tirmidhi 1992} وسؤال جابر عن ملاعبة الزوجة {cite:sahih-al-bukhari 2967}، ومعه حدود واضحة: الوعيد لمن يكذب ليضحك القوم {cite:sunan-abi-dawud 4990}، والنهي عن أخذ متاع الأخ لاعبا أو جادا {cite:sunan-abi-dawud 5003}، وأن الكذب لا يصلح في جد ولا هزل {cite:sunan-ibn-majah 46}. وينهى القرآن عن سخرية قوم من قوم في سورة الحجرات، الآية 11."
  en: "Muzah is playful joking in word and deed without intent to hurt. The Sunnah texts the museum holds show prophetic jesting that never leaves the truth, such as calling Anas ibn Malik by a teasing nickname {cite:jami-al-tirmidhi 1992} and asking Jabir about playing with a wife {cite:sahih-al-bukhari 2967}, together with clear limits: a warning to whoever lies to make people laugh {cite:sunan-abi-dawud 4990}, a ban on taking a brother's belongings in jest or in earnest {cite:sunan-abi-dawud 5003}, and the rule that lying fits neither earnest nor jest {cite:sunan-ibn-majah 46}. The Qur'an forbids one people mocking another in Surat al-Hujurat, verse 11."
  ur: "مزاح قول و فعل کی وہ خوش طبعی ہے جس میں ایذا کا ارادہ نہ ہو۔ عجائب گھر میں محفوظ سنت کی نصوص میں نبوی مزاح سچ سے باہر نہیں جاتا، جیسے انس بن مالک کو مزاحیہ لقب سے پکارنا {cite:jami-al-tirmidhi 1992} اور جابر سے بیوی کے ساتھ ہنسی کھیل کا سوال {cite:sahih-al-bukhari 2967}، اور ساتھ ہی واضح حدود ہیں: لوگوں کو ہنسانے کے لیے جھوٹ بولنے والے کے لیے وعید {cite:sunan-abi-dawud 4990}، بھائی کا سامان مذاق یا سنجیدگی میں لینے کی ممانعت {cite:sunan-abi-dawud 5003}، اور یہ کہ جھوٹ نہ سنجیدگی میں درست ہے نہ مذاق میں {cite:sunan-ibn-majah 46}۔ قرآن سورۂ حجرات کی آیت 11 میں ایک قوم کے دوسری قوم کا مذاق اڑانے سے روکتا ہے۔"
  fr: "Le muzah est la plaisanterie enjouée, en parole et en acte, sans intention de blesser. Les textes de la Sunna que conserve le musée montrent une plaisanterie prophétique qui ne quitte jamais la vérité, comme le surnom taquin donné à Anas ibn Malik {cite:jami-al-tirmidhi 1992} et la question posée à Jabir sur le jeu avec l'épouse {cite:sahih-al-bukhari 2967}, avec des limites nettes : l'avertissement à qui ment pour faire rire {cite:sunan-abi-dawud 4990}, l'interdiction de prendre le bien d'un frère par jeu ou sérieusement {cite:sunan-abi-dawud 5003}, et la règle que le mensonge ne convient ni au sérieux ni à la plaisanterie {cite:sunan-ibn-majah 46}. Le Coran interdit qu'un peuple se moque d'un autre dans la sourate al-Hujurat, verset 11."
  es: "El muzah es la broma jovial, de palabra y de obra, sin intención de herir. Los textos de la Sunna que guarda el museo muestran una broma profética que nunca se aparta de la verdad, como el apodo burlón dado a Anas ibn Malik {cite:jami-al-tirmidhi 1992} y la pregunta a Jabir sobre jugar con la esposa {cite:sahih-al-bukhari 2967}, junto con límites claros: la advertencia a quien miente para hacer reír {cite:sunan-abi-dawud 4990}, la prohibición de tomar los bienes de un hermano en broma o en serio {cite:sunan-abi-dawud 5003}, y la regla de que la mentira no cabe ni en lo serio ni en la broma {cite:sunan-ibn-majah 46}. El Corán prohíbe que un pueblo se burle de otro en la sura al-Hujurat, versículo 11."
  tr: "Şaka, zarar verme niyeti olmadan oyunbaz konuşma ve eylem eylemidir. Müze tarafından toplanan Sünnet metinlerinde, doğruluğun ötesine geçmeyen peygamberlik mizahı vardır; örneğin Enas ibn Malik onu şakacı olarak adlandırır {cite:jami-al-tirmidhi 1992} ve Cabir'in karısıyla oynama sorusu {cite:sahih-al-bukhari 2967}; bunların açık sınırları vardır: yalan söyleyenleri insanları güldürmek için uyarmak {cite:sunan-abi-dawud 4990}, kardeşin eşyalarını şakacı ya da ciddi şekilde almanın yasaklanması {cite:sunan-abi-dawud 5003} ve yalan söylemenin ciddiyet veya şaka için uygun olmadığı {cite:sunan-ibn-majah 46}. Kur'an, Surah Hujurat ayetinin 11. ayetinde bir halkla alay etmeyi yasaklar."
  id: "Lelucon adalah ucapan dan tindakan yang main-main tanpa niat menyakiti. Dalam teks Sunnah yang dikumpulkan oleh museum, terdapat humor nubuat yang tidak melampaui kebenaran; misalnya, Anas ibn Malik menyebutnya badut {cite:jami-al-tirmidhi 1992} dan pertanyaan tentang istri Jabir bermain dengannya {cite:sahih-al-bukhari 2967}; ini memiliki batasan yang jelas: memperingatkan pembohong agar membuat orang tertawa {cite:sunan-abi-dawud 4990}, melarang mengambil barang saudara secara bercanda atau serius {cite:sunan-abi-dawud 5003}, dan berbohong tidak pantas untuk keseriusan atau lelucon {cite:sunan-ibn-majah 46}. Al-Qur'an melarang mengejek publik dalam ayat 11 Surah Hujurat."
