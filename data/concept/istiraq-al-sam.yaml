id: concept/istiraq-al-sam
class: concept
kind: doctrine
label: { ar: "استراق السمع", en: "The stealing of the hearing", es: "El robo de la audiencia", fr: "Le vol de l'audience", ur: "سماعت کی چوری۔" }
summary:
  ar: "ذكر كثير من الناس أن الكهانة تكون من قبل شيطان يكون مع الكاهن يخبره بما غاب عنه، وأن الشياطين كانت تسترق السمع وتلقيه على ألسنة الكهان فيؤدون إلى الناس الأخبار بحسب ما يرد إليهم، وأخبر الله بذلك في قوله وأنا لمسنا السماء فوجدناها ملئت حرساً شديداً وشهباً، وقال المسعودي إن الشياطين والجن لا تعلم الغيب وإنما تسترق السمع مما تسمع من الملائكة لقوله فلما خر تبينت الجن أن لو كانوا يعلمون الغيب ما لبثوا في العذاب المهين {cite:muruj-al-dhahab p. 483-484}."
  en: "The doctrine that kahins drew their news from devils who eavesdropped at heaven's gate and cast it on their tongues — al-Mas'udi affirming that jinn know no unseen save what they snatch from the angels' hearing {cite:muruj-al-dhahab p. 483-484}."
  es: "La doctrina de que los kahins obtenían sus noticias de demonios que espiaban en la puerta del cielo y las ponían en sus lenguas — al-Mas'udi afirma que los jinn no conocen nada invisible salvo lo que arrebatan a los oídos de los ángeles {cite:muruj-al-dhahab p. 483-484}."
  fr: "La doctrine selon laquelle les kahins tirent leurs nouvelles des démons qui écoutent aux portes du ciel et les leur transmettent — al-Mas'udi affirmant que les djinns ne connaissent rien d'invisible, sauf ce qu'ils arrachent à l'ouïe des anges {cite:muruj-al-dhahab p. 483-484}."
  ur: "وہ عقیدہ کہ کاہنوں نے اپنی خبریں شیاطین سے حاصل کیں جو آسمان کے دروازے پر سنتے ہیں اور اپنی زبانوں پر ڈالتے ہیں - المسعودی اس بات کی تصدیق کرتے ہیں کہ جنات کوئی غیب نہیں جانتے سوائے اس کے جو وہ فرشتوں کی سماعت سے چھین لیتے ہیں۔ 483-484}۔"
