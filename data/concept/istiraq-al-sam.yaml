label: { ar: "استراق السمع", en: "The stealing of the hearing", es: "El robo de la audiencia", fr: "Le vol de l'audience", ur: "سماعت کی چوری۔", tr: "kulak misafiri", id: "menguping" }
summary:
  ar: "ذكر كثير من الناس أن الكهانة تكون من قبل شيطان يكون مع الكاهن يخبره بما غاب عنه، وأن الشياطين كانت تسترق السمع وتلقيه على ألسنة الكهان فيؤدون إلى الناس الأخبار بحسب ما يرد إليهم، وأخبر الله بذلك في قوله وأنا لمسنا السماء فوجدناها ملئت حرساً شديداً وشهباً، وقال المسعودي إن الشياطين والجن لا تعلم الغيب وإنما تسترق السمع مما تسمع من الملائكة لقوله فلما خر تبينت الجن أن لو كانوا يعلمون الغيب ما لبثوا في العذاب المهين {cite:muruj-al-dhahab p. 483-484}."
  en: "The doctrine that kahins drew their news from devils who eavesdropped at heaven's gate and cast it on their tongues — al-Mas'udi affirming that jinn know no unseen save what they snatch from the angels' hearing {cite:muruj-al-dhahab p. 483-484}."
  es: "La doctrina de que los kahins obtenían sus noticias de demonios que espiaban en la puerta del cielo y las ponían en sus lenguas — al-Mas'udi afirma que los jinn no conocen nada invisible salvo lo que arrebatan a los oídos de los ángeles {cite:muruj-al-dhahab p. 483-484}."
  fr: "La doctrine selon laquelle les kahins tirent leurs nouvelles des démons qui écoutent aux portes du ciel et les leur transmettent — al-Mas'udi affirmant que les djinns ne connaissent rien d'invisible, sauf ce qu'ils arrachent à l'ouïe des anges {cite:muruj-al-dhahab p. 483-484}."
  ur: "وہ عقیدہ کہ کاہنوں نے اپنی خبریں شیاطین سے حاصل کیں جو آسمان کے دروازے پر سنتے ہیں اور اپنی زبانوں پر ڈالتے ہیں - المسعودی اس بات کی تصدیق کرتے ہیں کہ جنات کوئی غیب نہیں جانتے سوائے اس کے جو وہ فرشتوں کی سماعت سے چھین لیتے ہیں۔ 483-484}۔"
  tr: "Birçok kişi, kahinin yanında olan ve ona eksik olanı söyleyen bir şeytan tarafından fal söylendiğini, şeytanların ise kahinlerin dillerine kulak misafiri olarak haber verdiklerini ve insanlara getirilenlere göre haber verdiklerini söyledi. Allah bunu sözünde şöyle bildirdi: 'Gökyüzüne dokunduğumuzda, onu şiddetli muhafızlar ve ateşle dolu bulduk.' Al-Mas'udi şöyle dedi: 'Cinler görünmeyeni bilmezler, aksine meleklerden duyduklarını çalarlar, şöyle dedi: 'Ve cinler indiğinde, eğer görünmeyeni bilselerdi, aşağılayıcı bir cezada kalmazlardı.' {atıf:Muruj-al-Dhahab s. 483-484}."
  id: "Banyak orang menyebutkan bahwa ramalan dilakukan oleh iblis yang bersama peramal dan memberitahunya apa yang tidak ada darinya, dan bahwa iblis biasa menguping dan melemparkannya ke dalam bahasa para peramal, menyampaikan kabar kepada orang-orang sesuai dengan apa yang disampaikan. Tuhan memberitahu ini dalam perkataan-Nya: 'Dan ketika kami menyentuh langit, kami mendapati langit dipenuhi dengan penjaga garang dan api yang menembak.' Al-Mas'udi berkata bahwa iblis dan jin tidak mengenal yang tak terlihat melainkan mencuri apa yang mereka dengar dari malaikat, seperti yang Dia katakan: 'Dan ketika ia turun, jin menyadari bahwa jika mereka mengenal yang tak terlihat, mereka tidak akan tetap berada dalam hukuman yang memalukan.' {cite:muruj-al-dhahab hlm. 483-484}."
