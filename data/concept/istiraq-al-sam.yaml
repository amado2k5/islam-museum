id: concept/istiraq-al-sam
class: concept
kind: doctrine
label: { ar: "استراق السمع", en: "The stealing of the hearing" }
summary:
  ar: "ذكر كثير من الناس أن الكهانة تكون من قبل شيطان يكون مع الكاهن يخبره بما غاب عنه، وأن الشياطين كانت تسترق السمع وتلقيه على ألسنة الكهان فيؤدون إلى الناس الأخبار بحسب ما يرد إليهم، وأخبر الله بذلك في قوله وأنا لمسنا السماء فوجدناها ملئت حرساً شديداً وشهباً، وقال المسعودي إن الشياطين والجن لا تعلم الغيب وإنما تسترق السمع مما تسمع من الملائكة لقوله فلما خر تبينت الجن أن لو كانوا يعلمون الغيب ما لبثوا في العذاب المهين {cite:muruj-al-dhahab p. 483-484}."
  en: "The doctrine that kahins drew their news from devils who eavesdropped at heaven's gate and cast it on their tongues — al-Mas'udi affirming that jinn know no unseen save what they snatch from the angels' hearing {cite:muruj-al-dhahab p. 483-484}."
