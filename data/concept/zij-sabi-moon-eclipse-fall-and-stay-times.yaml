id: concept/zij-sabi-moon-eclipse-fall-and-stay-times
class: concept
kind: scientific
label: { ar: "زمنا سقوط القمر ومكثه في الكسوف", en: "The hours of fall and of stay of the Moon", ur: "چاند کے سقوط اور مکث کے اوقات", es: "Las horas de caída y de permanencia de la Luna", fr: "Les heures de la chute et du séjour de la Lune", tr: "Ayın batış zamanı ve tutulma sırasındaki kalış süresi", id: "Waktu terbenamnya bulan dan posisinya selama gerhana." }
summary:
  ar: "تُقسم دقائق السقوط على سبق القمر، أي حركته المختلفة في الساعة، فيخرج ساعات السقوط. ثم تُنقص ساعات السقوط من ساعات وسط الكسوف فيبقى زمن بدء الكسوف، وتُزاد عليها فيكون زمن تمام الانجلاء. وإن كان للقمر مكث أُضيف زمن المكث إلى الساعات نفسها ليُعرف زمن بدء المكث وزمن بدء الانجلاء. {cite:zij-sabi-nallino-byblion pp.152-153}"
  en: "The minutes of fall are divided by the Moon's hourly motion to give the hours of fall. Subtracting these from the hours of mid-eclipse gives the time of the beginning, and adding them gives the time of the end of the eclipse. Where there is a stay, its hours are added to or taken from the same figures to fix the beginning and end of totality. {cite:zij-sabi-nallino-byblion pp.152-153}"
  ur: "سقوط کے دقائق کو چاند کی فی گھنٹہ حرکت پر تقسیم کیا جاتا ہے تو سقوط کے گھنٹے نکلتے ہیں۔ انہیں وسط گرہن کے گھنٹوں میں سے گھٹانے سے آغاز کا وقت ملتا ہے، اور جمع کرنے سے اختتام کا۔ جہاں مکث ہو وہاں اس کے گھنٹے انہی اعداد میں جمع یا تفریق کر کے کلی گرہن کا آغاز اور اختتام طے کیا جاتا ہے۔ {cite:zij-sabi-nallino-byblion pp.152-153}"
  es: "Los minutos de caída se dividen por el movimiento horario de la Luna para obtener las horas de caída. Restando estas horas de las horas del punto medio del eclipse se obtiene la hora de inicio, y sumándolas se obtiene la hora de finalización del eclipse. En caso de que haya una pausa, sus horas se suman o se restan a las mismas cifras para determinar el inicio y el final de la totalidad. {cite:zij-sabi-nallino-byblion pp.152-153}"
  fr: "On divise la durée de la chute en minutes par le mouvement horaire de la Lune pour obtenir la durée de la chute en heures. En soustrayant ces heures de celles du milieu de l'éclipse, on obtient l'heure du début, et en les ajoutant, l'heure de la fin. En cas de palier, on ajoute ou on soustrait la durée de ce palier aux mêmes valeurs pour déterminer le début et la fin de la totalité. {cite:zij-sabi-nallino-byblion pp.152-153}"
  tr: "Ay tutulmasının dakikaları, ayın hareketine, yani saat içindeki değişen hareketine bölünerek tutulmanın saatleri elde edilir. Daha sonra, tutulmanın başlangıç zamanını elde etmek için tutulmanın saatlerinden tutulmanın merkezindeki saatler çıkarılır ve ardından tutulmanın tamamen sona erme zamanını elde etmek için bu saate eklenir. Eğer ay tutulmasının süresi daha uzunsa, bu süre aynı saatlere eklenerek tutulmanın başlangıç ve bitiş zamanları belirlenir. {cite:zij-sabi-nallino-byblion pp.152-153}"
  id: "Menit gerhana dibagi dengan pergerakan bulan, yaitu, pergerakannya yang bervariasi selama satu jam, untuk mendapatkan jam gerhana. Kemudian, jam gerhana dikurangi dari jam di pusat gerhana untuk mendapatkan waktu awal gerhana, dan kemudian ditambahkan untuk mendapatkan waktu akhir gerhana. Jika bulan memiliki durasi gerhana yang lebih lama, durasi ini ditambahkan ke jam yang sama untuk menentukan waktu awal gerhana dan waktu akhir gerhana. {cite:zij-sabi-nallino-byblion pp.152-153}"
