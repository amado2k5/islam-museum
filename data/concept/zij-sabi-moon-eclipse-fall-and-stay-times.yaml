label: { ar: "زمنا سقوط القمر ومكثه في الكسوف", en: "The hours of fall and of stay of the Moon", ur: "چاند کے سقوط اور مکث کے اوقات" }
summary:
  ar: "تُقسم دقائق السقوط على سبق القمر، أي حركته المختلفة في الساعة، فيخرج ساعات السقوط. ثم تُنقص ساعات السقوط من ساعات وسط الكسوف فيبقى زمن بدء الكسوف، وتُزاد عليها فيكون زمن تمام الانجلاء. وإن كان للقمر مكث أُضيف زمن المكث إلى الساعات نفسها ليُعرف زمن بدء المكث وزمن بدء الانجلاء. {cite:zij-sabi-nallino-byblion pp.152-153}"
  en: "The minutes of fall are divided by the Moon's hourly motion to give the hours of fall. Subtracting these from the hours of mid-eclipse gives the time of the beginning, and adding them gives the time of the end of the eclipse. Where there is a stay, its hours are added to or taken from the same figures to fix the beginning and end of totality. {cite:zij-sabi-nallino-byblion pp.152-153}"
  ur: "سقوط کے دقائق کو چاند کی فی گھنٹہ حرکت پر تقسیم کیا جاتا ہے تو سقوط کے گھنٹے نکلتے ہیں۔ انہیں وسط گرہن کے گھنٹوں میں سے گھٹانے سے آغاز کا وقت ملتا ہے، اور جمع کرنے سے اختتام کا۔ جہاں مکث ہو وہاں اس کے گھنٹے انہی اعداد میں جمع یا تفریق کر کے کلی گرہن کا آغاز اور اختتام طے کیا جاتا ہے۔ {cite:zij-sabi-nallino-byblion pp.152-153}"
