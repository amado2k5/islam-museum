summary:
  ar: "الكراع يولد كيموساً لزجاً غير غليظ محموداً قليل الفضول، صالح الهضم، وينفع السعال الحار ويطلق بلزوجته {cite:canon-ibn-sina-print-v1 p.535}."
  en: "Trotters make a sticky chyme that is not thick, praiseworthy and with little waste; they are well digested, help hot cough and loosen the bowels by their stickiness {cite:canon-ibn-sina-print-v1 p.535}."
  ur: "پائے لیس دار مگر گاڑھا نہ ہونے والا کیموس بناتے ہیں، قابل تعریف اور کم فضلے والا؛ ہضم میں اچھے ہیں، گرم کھانسی میں مفید ہیں اور اپنی لیس سے پیٹ نرم کرتے ہیں {cite:canon-ibn-sina-print-v1 p.535}۔"
  es: "Las manitas de cerdo producen un quimo pegajoso que no es espeso, digno de elogio y con poco desperdicio; se digieren bien, ayudan a la tos caliente y aflojan los intestinos por su consistencia pegajosa {cite:canon-ibn-sina-print-v1 p.535}."
  fr: "Les pieds produisent un chyme collant qui n'est pas épais, louable et avec peu de déchets; ils sont bien digérés, aident à soulager la toux chaude et ramollissent les intestins grâce à leur adhérence {cite:canon-ibn-sina-print-v1 p.535}."
