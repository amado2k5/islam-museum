summary:
  ar: "الحماما شجرة خشبها كالعناقيد، ولونه كالذهب، وطيّب الرائحة؛ الجيّد الذهبي الطريّ الأرمني المرّ، وفيها تحليل ونضج وقبض، وتُذكر لها منافع في الأورام والمفاصل والصداع والعين والصدر والكبد والرحم، ومن بينها مُعلَّمات."
  en: "Hamama is a tree with woody clusters, golden in colour and fragrant. The best is the fresh golden Armenian bitter kind; it dissolves, ripens and binds. The book lists uses for swellings, joints, headache, the eye, the chest, the liver and the womb, and some of the womb uses are labelled listings."
  ur: "حماما ایک درخت ہے جس کی لکڑی گچھوں جیسی، رنگ سونے جیسا اور خوشبو تیز ہے؛ بہترین سنہری، تازہ، ارمنی اور کڑوی قسم ہے۔ اس میں تحلیل، پکانا اور گرفت ہے، اور سوجن، جوڑ، سردرد، آنکھ، سینے، جگر اور رحم کے فوائد درج ہیں، جن میں سے کچھ رحم کے فوائد مُعلَّم فہرست ہیں۔"
  es: "El hamama es un árbol con racimos leñosos, de color dorado y fragantes. La mejor variedad es la fresca, dorada y amarga, típica de Armenia; se disuelve, madura y aglutina. El libro enumera sus usos para la hinchazón, las articulaciones, el dolor de cabeza, los ojos, el pecho, el hígado y el útero, y algunos de los usos relacionados con el útero se especifican en la lista."
  fr: "L'hamama est un arbre aux grappes ligneuses, dorées et parfumées. La meilleure est la variété amère, dorée et fraîche d'Arménie; elle dissout, mûrit et resserre les tissus. L'ouvrage recense ses usages pour les gonflements, les articulations, les maux de tête, les affections oculaires, thoraciques, hépatiques et utérines, certaines indications relatives à l'utérus étant présentées sous forme de listes."
