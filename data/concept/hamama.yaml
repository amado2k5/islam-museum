summary:
  ar: "الحماما شجرة خشبها كالعناقيد، ولونه كالذهب، وطيّب الرائحة؛ الجيّد الذهبي الطريّ الأرمني المرّ، وفيها تحليل ونضج وقبض، وتُذكر لها منافع في الأورام والمفاصل والصداع والعين والصدر والكبد والرحم، ومن بينها مُعلَّمات."
  en: "Hamama is a tree with woody clusters, golden in colour and fragrant. The best is the fresh golden Armenian bitter kind; it dissolves, ripens and binds. The book lists uses for swellings, joints, headache, the eye, the chest, the liver and the womb, and some of the womb uses are labelled listings."
  ur: "حماما ایک درخت ہے جس کی لکڑی گچھوں جیسی، رنگ سونے جیسا اور خوشبو تیز ہے؛ بہترین سنہری، تازہ، ارمنی اور کڑوی قسم ہے۔ اس میں تحلیل، پکانا اور گرفت ہے، اور سوجن، جوڑ، سردرد، آنکھ، سینے، جگر اور رحم کے فوائد درج ہیں، جن میں سے کچھ رحم کے فوائد مُعلَّم فہرست ہیں۔"
