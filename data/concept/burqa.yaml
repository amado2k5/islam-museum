summary:
  ar: "البرقع في اصطلاح الفقهاء لباس تستر به المرأة وجهها؛ تذكره الموسوعة الفقهية ضمن الألفاظ ذات الصلة بالحجاب مع الخمار والنقاب واللثام {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  en: "The burqa in juristic usage is a garment by which the woman veils her face; the Kuwaiti Fiqh Encyclopedia lists it among the terms related to hijab alongside khimar, niqab and litham {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  fr: "Dans l’usage juridique, vêtement par lequel la femme voile son visage. L’Encyclopédie koweïtienne du fiqh la classe parmi les termes liés au hijab, avec khimar, niqab et litham {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  es: "En el ámbito jurídico, el burka es una prenda con la que la mujer se cubre el rostro; la Enciclopedia de Fiqh de Kuwait lo incluye entre los términos relacionados con el hiyab junto con el khimar, el niqab y el litham {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  ur: "فقہی استعمال میں برقعہ ایک ایسا لباس ہے جس سے عورت اپنے چہرے کو ڈھانپتی ہے۔ کویتی فقہ انسائیکلو پیڈیا اسے خمار، نقاب اور لیتھم کے ساتھ حجاب سے متعلق اصطلاحات میں درج کرتا ہے"
  tr: "Hukuk terminolojisinde, burka bir kadının yüzünü örttüğü bir giysidir; fiqih ansiklopedisi ise başörtüsü, örtü ve örtüyle ilgili terimler arasında bunu belirtir {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  id: "Dalam terminologi firisprudensi, burqa adalah pakaian yang digunakan seorang wanita untuk menutupi wajahnya; ensiklopedia yurisprudensi menyebutnya di antara istilah terkait yang berkaitan dengan hijab, kerudung, dan kerudung {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
