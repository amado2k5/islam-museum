label: { ar: "الخزف ذو الأسود الصابغ بالصفرة", en: "Ware with yellow-staining black", ur: "زرد رنگ چھوڑنے والے سیاہ ظروف", es: "Vajilla con manchas negras amarillentas", fr: "Armature avec noir jaunissant", tr: "Sarımsı tonlu siyah porselen", id: "Porselen hitam dengan sedikit warna kekuningan" }
summary:
  ar: "مجموعة من خزف نيسابور مزخرفة بالأسود على بطانة بيضاء تحت طلاء مصفر، يشتد اصفراره قرب الصبغ الأسود، وأمكن تقليد أثره بإدخال أكسيد الكروم في الأسود {cite:wilkinson-nishapur-pottery p. 255}."
  en: "A Nishapur group decorated in black on a white engobe under a yellowish glaze that is strongest near the black pigment; the effect was reproduced by adding chromium oxide to the black {cite:wilkinson-nishapur-pottery p. 255}."
  ur: "نیشاپور کے ظروف کا ایک گروہ جن پر سفید انگوب پر سیاہ نقش اور زردی مائل لعاب ہے، جو سیاہ رنگ کے قریب زیادہ زرد ہے؛ یہ اثر سیاہ میں کرومیم آکسائیڈ ملا کر دہرایا گیا {cite:wilkinson-nishapur-pottery p. 255}."
  es: "Un grupo de Nishapur decorado en negro sobre un engobe blanco bajo un vidriado amarillento que es más intenso cerca del pigmento negro; el efecto se reprodujo añadiendo óxido de cromo al negro {cite:wilkinson-nishapur-pottery p. 255}."
  fr: "Un groupe de Nishapur décoré en noir sur un engobe blanc sous une glaçure jaunâtre qui est la plus forte près du pigment noir; l'effet a été reproduit en ajoutant de l'oxyde de chrome au noir {cite:wilkinson-nishapur-pottery p. 255}."
  tr: "Nişapur seramiklerinden oluşan bir koleksiyon, sarımsı bir sır altında beyaz bir astar üzerine siyahla dekore edilmiştir; bu sırın sararması siyah pigmentin yakınında yoğunlaşır ve bu etki, siyaha krom oksit eklenerek taklit edilmiştir {cite:wilkinson-nishapur-pottery s. 255}."
  id: "Koleksi tembikar Nishapur yang didekorasi dengan warna hitam di atas lapisan putih di bawah glasir kekuningan, yang penguningannya semakin intensif di dekat pigmen hitam, dan efeknya ditiru dengan memasukkan kromium oksida ke dalam warna hitam {cite:wilkinson-nishapur-pottery p. 255}."
