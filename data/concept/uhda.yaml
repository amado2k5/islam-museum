id: concept/uhda
class: concept
kind: legal
label:
  ar: "العُهْدَة"
  en: "Warranty (uhda) in sale and in pre-emption, and the defect"
  ur: "عہدہ ⁦(ضمانت)⁩"
  es: "Garantía (uhda) en venta y en derecho de preferencia, y el defecto"
  fr: "Garantie (uhda) à la vente et en préemption, et le défaut"
  tr: "Velayet"
  id: "Hak Asuh"
summary:
  ar: "العهدة في الاصطلاح ضمان الثمن أو الحق عند استحقاق المبيع، وهي في باب الشفعة رجوع الملك إلى الشفيع أو المشتري، وفي خيار العيب الضمان عند ظهور العيب {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11906}. وعند الشافعية والمالكية في الشفعة تكون عهدة الشفيع على البائع إذا أخذ منه، وقال الحنفية إن بيع الشيء من غير البائع يجعل العهدة على المشتري {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11907}. وفي العيب تختلف عهدة السنة والثلاث، فالعيب الحادث في يد المشتري والقديم عند البائع يوجب الرد {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11908}."
  en: "In sale, 'uhda is the seller's guarantee of the price or of the title when the object is claimed by a third party. In pre-emption it is the return of ownership to the pre-emptor or buyer; in the option for a defect it is the guarantee when a defect appears {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11906}. In pre-emption the Shafi'is and Malikis place the warranty on the seller if the pre-emptor took the property from him; the Hanafis place it on the buyer when the property was sold by someone other than the seller {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11907}. For defects, the year and the three-day warranties differ: a defect arising in the buyer's hands and one present at the seller's both give a right of return {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11908}."
  es: "En la compraventa, la 'uhda es la garantía del vendedor sobre el precio o el título cuando un tercero reclama el bien. En el derecho de tanteo, es la devolución de la propiedad al comprador o al que tiene derecho de tanteo; en la opción por defecto, es la garantía cuando aparece un defecto {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11906}. En el derecho de tanteo, los shafiíes y los malikíes sitúan la garantía sobre el vendedor si el comprador se apropió de la propiedad; los hanafíes la sitúan sobre el comprador cuando la propiedad fue vendida por alguien distinto del vendedor {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11907}. En cuanto a los defectos, las garantías de un año y de tres días difieren: un defecto que surge en manos del comprador y uno presente en las del vendedor dan derecho a devolución {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11908}."
  fr: "En matière de vente, la 'uhda est la garantie du vendeur quant au prix ou à la propriété lorsque le bien est revendiqué par un tiers. En matière de préemption, elle garantit la restitution de la propriété au préempteur ou à l'acquéreur; en matière d'option pour vice caché, elle constitue la garantie en cas de défaut constaté {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11906}. Selon les écoles shafi'ite et malikite, la garantie incombe au vendeur si le préempteur a acquis le bien auprès de lui; selon l'école hanafite, elle incombe à l'acquéreur lorsque le bien a été vendu par une personne autre que le vendeur {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11907}. En ce qui concerne les défauts, les garanties d'un an et de trois jours diffèrent: un défaut survenant entre les mains de l'acheteur et un défaut présent chez le vendeur donnent tous deux droit à un retour {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11908}."
  ur: "فروخت میں، 'uhda بیچنے والے کی قیمت یا عنوان کی ضمانت ہے جب کسی تیسرے فریق کے ذریعہ اعتراض کا دعوی کیا جاتا ہے۔ پری ایمپشن میں یہ پری ایمپٹر یا خریدار کو ملکیت کی واپسی ہے۔ عیب کے اختیار میں جب کوئی عیب ظاہر ہوتا ہے تو یہ ضمانت ہے {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11906}۔ شافعی اور مالکی قبل از وقت فروخت کرنے والے پر ضمانت دیتے ہیں اگر پری ایمپٹر اس سے جائیداد لے لیتا ہے۔ حنفیہ اسے خریدار پر ڈالتے ہیں جب جائیداد بیچنے والے کے علاوہ کسی اور نے بیچی ہو خرابیوں کے لیے، سال اور تین دن کی وارنٹی میں فرق ہوتا ہے: خریدار کے ہاتھ میں پیدا ہونے والا نقص اور بیچنے والے کے پاس موجود ایک دونوں کو واپسی کا حق دیا جاتا ہے {حوالہ:فقہ الموسوعۃ النور-v3 صفحہ 11907}"
  tr: "Terminolojide, saklama, satılan eşyanın vadesi geldiğinde fiyatın veya hakkın garanti altına alınmasını ifade eder. Öncelik durumunda, mülkiyet aracı veya alıcıya geri verilir, kusur seçeneğinde ise sorumluluk kusurun ortaya çıkması durumudur {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11906}. Şafi'ler ve Malikilere göre, öncelik durumunda, aracın gözetimi satıcıdan alınırsa satıcıya aittir. Hanafis, satıcıdan başka birinden bir şey satmanın vesayetin alıcıya ait olduğunu {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11907} demiştir. Kusur durumunda, bir yıl ve üç yıllık velayet süresi farklılık gösterir; alıcının elindeki kusur ile satıcının yaşlılığı iade gerektirir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11908}."
  id: "Dalam istilah tertentu, hak asuh merujuk pada jaminan harga atau hak ketika barang yang dijual jatuh tempo. Dalam kasus preemption, kepemilikan dikembalikan kepada penopang atau pembeli, dan dalam opsi cacat, tanggung jawab adalah ketika cacat muncul {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11906}. Menurut Shafi'i dan Maliki, dalam kasus preemption, hak asuh penopang berada pada penjual jika barang itu diambil darinya. Hanafi mengatakan bahwa menjual sesuatu dari orang lain selain penjual membuat hak penjagaan pada pembeli {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11907}. Dalam kasus cacat, masa hak asuh selama satu tahun tiga tahun berbeda; cacat di tangan pembeli dan usia tua penjual memerlukan pengembalian {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11908}."
