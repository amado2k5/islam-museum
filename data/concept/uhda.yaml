id: concept/uhda
class: concept
kind: legal
label:
  ar: "العُهْدَة"
  en: "Warranty (uhda) in sale and in pre-emption, and the defect"
  ur: "عہدہ (ضمانت)"
summary:
  ar: "العهدة في الاصطلاح ضمان الثمن أو الحق عند استحقاق المبيع، وهي في باب الشفعة رجوع الملك إلى الشفيع أو المشتري، وفي خيار العيب الضمان عند ظهور العيب {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11906}. وعند الشافعية والمالكية في الشفعة تكون عهدة الشفيع على البائع إذا أخذ منه، وقال الحنفية إن بيع الشيء من غير البائع يجعل العهدة على المشتري {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11907}. وفي العيب تختلف عهدة السنة والثلاث، فالعيب الحادث في يد المشتري والقديم عند البائع يوجب الرد {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11908}."
  en: "In sale, 'uhda is the seller's guarantee of the price or of the title when the object is claimed by a third party. In pre-emption it is the return of ownership to the pre-emptor or buyer; in the option for a defect it is the guarantee when a defect appears {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11906}. In pre-emption the Shafi'is and Malikis place the warranty on the seller if the pre-emptor took the property from him; the Hanafis place it on the buyer when the property was sold by someone other than the seller {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11907}. For defects, the year and the three-day warranties differ: a defect arising in the buyer's hands and one present at the seller's both give a right of return {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11908}."
