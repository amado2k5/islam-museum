label:
  ar: أركان الإسلام الخمسة
  en: The five pillars of Islam
summary:
  ar: 'الأعمال الخمسة التي بُني عليها الإسلام في الحديث الصحيح: شهادة أن لا إله إلا الله وأن محمداً رسول الله، وإقام الصلاة، وإيتاء الزكاة، والحج، وصوم رمضان.'
  en: 'The five acts on which Islam is built according to the sound hadith: the testimony that there is no god but God and that Muhammad is God''s messenger, establishing prayer, paying zakat, pilgrimage and fasting Ramadan.'
