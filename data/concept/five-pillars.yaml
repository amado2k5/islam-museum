id: concept/five-pillars
class: concept
kind: doctrine
label:
  ar: أركان الإسلام الخمسة
  en: The five pillars of Islam
summary:
  ar: 'الأعمال الخمسة التي بُني عليها الإسلام في الحديث الصحيح: شهادة أن لا إله إلا الله وأن محمداً رسول الله، وإقام الصلاة، وإيتاء الزكاة، والحج، وصوم رمضان. وتذكر دائرة المعارف الإسلامية أن كلمة ركن تعني الزاوية ثم الدعامة، وأن بعض العلماء يضيفون إلى الخمسة الجهاد، وأن كتب الفقه تضع العبادات في أولها بترتيب الطهارة فالصلاة فالزكاة فالصوم فالحج.'
  en: 'The five acts on which Islam is built according to the sound hadith: the testimony that there is no god but God and that Muhammad is God''s messenger, establishing prayer, paying zakat, pilgrimage and fasting Ramadan. The Encyclopaedia of Islam explains that rukn means a corner and then a support, notes that some authorities add jihad as a sixth, and reports that books of fiqh place the acts of worship first, in the order purity, prayer, zakat, fasting and pilgrimage.'
  ur: 'وہ پانچ اعمال جن پر صحیح حدیث کے مطابق اسلام کی بنیاد ہے: اس بات کی گواہی کہ اللہ کے سوا کوئی معبود نہیں اور محمد اللہ کے رسول ہیں، نماز قائم کرنا، زکوٰۃ دینا، حج اور رمضان کے روزے۔ دائرۃ المعارف اسلامیہ بتاتا ہے کہ رکن کا مطلب کونا اور پھر سہارا ہے، بعض علما پانچ کے ساتھ جہاد کو چھٹا جوڑتے ہیں، اور فقہ کی کتابیں عبادات کو سب سے پہلے رکھتی ہیں، طہارت، نماز، زکوٰۃ، روزہ اور حج کی ترتیب سے۔'
