id: "concept/al-tashannuj-min-al-udw"
class: "concept"
kind: "scientific"
label:
  ar: "التشنج من مشاركة عضو"
  en: "Convulsion from a partner organ"
  fr: "Convulsion par sympathie avec un organe"
  ur: "شریک عضو سے تشنج"
  es: "Convulsión de un órgano asociado"
  tr: "Üye katılımından kaynaklanan sarsıntılar"
  id: "Kejutan yang disebabkan oleh partisipasi anggota"
summary:
  ar: "من التشنج ما يكون من قيء خلط زنجاري نكأ في فم المعدة، والكائن بسبب قوة حس فم المعدة إذا اندفع إليه مرار، والكائن بمشاركة الدماغ للرحم والمثانة، والكائن عن لسعة العقرب والرتيلاء والحية على العصبة أو قطع يصيب العصب، وقريب من هذا التشنج العارض بسبب الديدان {cite:canon-ibn-sina-print-v2 p.144} {cite:canon-ibn-sina-print-v2 p.145}"
  en: "Of convulsion is what comes from vomiting a verdigris humour biting the mouth of the stomach, that from the strength of the stomach mouth's sense when bile drives into it, that by the brain's sharing with the womb and the bladder, that from the sting of the scorpion, the tarantula and the snake on a nerve, or a cut or bite striking the nerve; near this is the convulsion occurring for worms {cite:canon-ibn-sina-print-v2 p.144} {cite:canon-ibn-sina-print-v2 p.145}"
  fr: "Le Canon distingue des convulsions dues au vomissement d’une humeur vert-de-gris qui irrite l’orifice de l’estomac, à la grande sensibilité de cet orifice lorsque de la bile y afflue, à la sympathie du cerveau avec l’utérus et la vessie, à une piqûre de scorpion ou à une morsure de tarentule ou de serpent qui atteint un nerf, ou encore à une coupure ou à une morsure touchant ce nerf. Les convulsions dues aux vers relèvent d’un cas voisin {cite:canon-ibn-sina-print-v2 p.144} {cite:canon-ibn-sina-print-v2 p.145}"
  ur: "تشنج میں سے ایک وہ ہے جو زنجاری خلط کی قے سے ہو جو معدے کے منہ کو چٹخار دے، ایک وہ جو معدے کے منہ کی حس کی قوت سے ہو جب اس کی طرف مرار دھکیلا جائے، ایک وہ جو دماغ کی رحم اور مثانہ سے شرکت سے ہو، ایک وہ جو بچھو، رتیلا اور سانپ کے ڈنک سے عصبہ پر ہو یا عصب کو پہنچنے والے قطع یا کاٹ سے؛ اور اس کے قریب وہ تشنج ہے جو کیڑوں کے سبب ہوتا ہے {cite:canon-ibn-sina-print-v2 p.144} {cite:canon-ibn-sina-print-v2 p.145}۔"
  es: "De convulsión es lo que viene por vomitar un humor verdigrís que muerde la boca del estómago, lo que viene por la fuerza del sentido de la boca del estómago cuando la bilis entra en ella, lo que viene por compartir el cerebro con el útero y la vejiga, lo que viene por la picadura del escorpión, la tarántula y la serpiente en un nervio, o un corte o mordedura que golpea el nervio; cerca de esto está la convulsión que ocurre por gusanos {cite:canon-ibn-sina-print-v2 p.144} {cite:canon-ibn-sina-print-v2 p.145}"
  tr: "Spazmlardan, mide ağzında gelişen hemorajik bir karışımdan kaynaklanan kusma, mide ağzına acı girerse güçlü bir his nedeniyle oluşur, beynin rahim ve mesane paylaşımında, akrep, tarantula veya yılan sokmaları veya sinir hasarı nedeniyle ortaya çıkar ve bu ara sıra solucanlar tarafından neden olunan spazma yakınında {cite:canon-ibn-sina-print-v2 s.144} {cite:canon-ibn-sina-print-v2 s.145}"
  id: "Muntah yang disebabkan oleh kejang, campuran berdarah yang berkembang di bukaan lambung, terjadi karena sensasi kuat jika rasa sakit masuk ke lubang lambung, terjadi di otak yang berbagi antara rahim dan kandung kemih, akibat gigitan kalajengking, tarantula, atau ular, atau kerusakan saraf, dan kadang-kadang dekat kejang yang disebabkan oleh cacing {cite:canon-ibn-sina-print-v2 hlm.144} {cite:canon-ibn-sina-print-v2 hlm.145}"
