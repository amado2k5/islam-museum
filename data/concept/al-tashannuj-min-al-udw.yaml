id: "concept/al-tashannuj-min-al-udw"
class: "concept"
kind: "scientific"
label:
  ar: "التشنج من مشاركة عضو"
  en: "Convulsion from a partner organ"
  ur: "شریک عضو سے تشنج"
summary:
  ar: "من التشنج ما يكون من قيء خلط زنجاري نكأ في فم المعدة، والكائن بسبب قوة حس فم المعدة إذا اندفع إليه مرار، والكائن بمشاركة الدماغ للرحم والمثانة، والكائن عن لسعة العقرب والرتيلاء والحية على العصبة أو قطع يصيب العصب، وقريب من هذا التشنج العارض بسبب الديدان {cite:canon-ibn-sina-print-v2 p.144} {cite:canon-ibn-sina-print-v2 p.145}"
  en: "Of convulsion is what comes from vomiting a verdigris humour biting the mouth of the stomach, that from the strength of the stomach mouth's sense when bile drives into it, that by the brain's sharing with the womb and the bladder, that from the sting of the scorpion, the tarantula and the snake on a nerve, or a cut or bite striking the nerve; near this is the convulsion occurring for worms {cite:canon-ibn-sina-print-v2 p.144} {cite:canon-ibn-sina-print-v2 p.145}"
  ur: "تشنج میں سے ایک وہ ہے جو زنجاری خلط کی قے سے ہو جو معدے کے منہ کو چٹخار دے، ایک وہ جو معدے کے منہ کی حس کی قوت سے ہو جب اس کی طرف مرار دھکیلا جائے، ایک وہ جو دماغ کی رحم اور مثانہ سے شرکت سے ہو، ایک وہ جو بچھو، رتیلا اور سانپ کے ڈنک سے عصبہ پر ہو یا عصب کو پہنچنے والے قطع یا کاٹ سے؛ اور اس کے قریب وہ تشنج ہے جو کیڑوں کے سبب ہوتا ہے {cite:canon-ibn-sina-print-v2 p.144} {cite:canon-ibn-sina-print-v2 p.145}۔"
