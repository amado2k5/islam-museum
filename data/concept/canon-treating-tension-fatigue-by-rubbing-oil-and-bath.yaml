id: concept/canon-treating-tension-fatigue-by-rubbing-oil-and-bath
class: concept
kind: scientific
label: { ar: "علاج الإعياء التمددي بالدلك والدهن والحمام عند ابن سينا", en: "Treating tension fatigue by rubbing, oil and bath in the Canon", ur: "کھنچاؤ کی تھکن کا علاج مالش، تیل اور غسل سے قانون میں", es: "Tratamiento de la fatiga por tensión mediante frotamiento, aceite y baño en el Canon", fr: "Traitement de la fatigue liée aux tensions par friction, huile et bain au Canon" }
summary:
  ar: "يجعل ابن سينا غرض علاج الإعياء التمددي إرخاء ما صلب بالدلك اللين والدهن المسخن في الشمس والاستحمام بالماء الفاتر مع طول اللبث، ويقلل الغذاء ويرطبه، ويعالج ما كان عن فضول غليظة بالاستفراغ وعن ريح ممددة بالكمون والكروياء والأنيسون {cite:canon-ibn-sina-print-v1 pp.244-245}."
  en: "Ibn Sina makes the aim in treating tension fatigue the loosening of what has hardened, by gentle rubbing, oil warmed in the sun and bathing in lukewarm water with a long stay, keeps the food small and moist, and treats a cause in thick superfluities by evacuation and one in distending wind with cumin, caraway and aniseed {cite:canon-ibn-sina-print-v1 pp.244-245}."
  es: "Ibn Sina tiene como objetivo tratar la fatiga por tensión aflojar lo que se ha endurecido, mediante frotamientos suaves, aceite calentado al sol y baños en agua tibia con una estancia prolongada, mantiene los alimentos pequeños y húmedos, y trata una causa en excesos espesos mediante evacuación y una en gases distensivos con comino, alcaravea y anís {cite:canon-ibn-sina-print-v1 pp.244-245}."
  fr: "Ibn Sina a pour objectif, dans le traitement de la fatigue liée à la tension, de détendre ce qui s'est durci, par un léger frottement, de l'huile chauffée au soleil et un bain dans de l'eau tiède avec un long séjour, de maintenir les aliments petits et humides, et de traiter une cause de surabondance épaisse par évacuation et une cause de vent distensif avec du cumin, du carvi et de l'anis {cite:canon-ibn-sina-print-v1 pp.244-245}."
  ur: "ابن سینا تناؤ کی تھکاوٹ کے علاج کا مقصد سخت ہو جانے والی چیزوں کے ڈھیلے ہونے کو، ہلکے سے رگڑنے، دھوپ میں گرم کرنے والے تیل اور زیادہ دیر تک گرم پانی سے نہانے سے، کھانے کو چھوٹا اور نم رکھتا ہے، اور موٹی ضرورت سے زیادہ غذاؤں کا علاج انخلاء سے کرتا ہے، اور ایک وجہ کو زیرہ اور کریدہ کے ساتھ تیز ہوا سے نکالتا ہے۔ {حوالہ:کینن ابن سینا پرنٹ v1 صفحہ 244-245}۔"
