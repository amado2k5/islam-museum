label: { ar: "علاج الإعياء التمددي بالدلك والدهن والحمام عند ابن سينا", en: "Treating tension fatigue by rubbing, oil and bath in the Canon", ur: "کھنچاؤ کی تھکن کا علاج مالش، تیل اور غسل سے قانون میں" }
summary:
  ar: "يجعل ابن سينا غرض علاج الإعياء التمددي إرخاء ما صلب بالدلك اللين والدهن المسخن في الشمس والاستحمام بالماء الفاتر مع طول اللبث، ويقلل الغذاء ويرطبه، ويعالج ما كان عن فضول غليظة بالاستفراغ وعن ريح ممددة بالكمون والكروياء والأنيسون {cite:canon-ibn-sina-print-v1 pp.244-245}."
  en: "Ibn Sina makes the aim in treating tension fatigue the loosening of what has hardened, by gentle rubbing, oil warmed in the sun and bathing in lukewarm water with a long stay, keeps the food small and moist, and treats a cause in thick superfluities by evacuation and one in distending wind with cumin, caraway and aniseed {cite:canon-ibn-sina-print-v1 pp.244-245}."
