summary:
  ar: "المنافق في الاصطلاح الشرعي من أظهر الإسلام وأبطن الكفر؛ يفرد القرآن سورة المنافقين ويفصّل ابن كثير صفاتهم {cite:tafsir-ibn-kathir}."
  en: "The munafiq in legal-theological usage is one who outwardly shows Islam while concealing disbelief; the Qur'an devotes sura al-Munafiqun to them, which Ibn Kathir details {cite:tafsir-ibn-kathir}."
  es: "El munafiq, en el uso jurídico-teológico, es aquel que muestra externamente el Islam mientras oculta su incredulidad; el Corán les dedica la sura al-Munafiqun, que Ibn Kathir detalla {cite:tafsir-ibn-kathir}."
  fr: "Le munafiq, dans l'usage juridico-théologique, est celui qui affiche extérieurement l'islam tout en dissimulant son incrédulité; le Coran leur consacre la sourate al-Munafiqun, qu'Ibn Kathir détaille {cite:tafsir-ibn-kathir}."
  ur: "قانونی اور مذہبی استعمال میں منافق وہ ہے جو کفر کو چھپاتے ہوئے ظاہری طور پر اسلام کو ظاہر کرتا ہے۔ قرآن ان کے لیے سورۃ المنافقون وقف کرتا ہے، جس کی تفصیل ابن کثیر نے بیان کی ہے۔"
  tr: "Hukuki terminolojide, münafık en dışa dönük ve gizli inançsızlıklardan biridir; Kur'an özel olarak Münekiqin suresine atıfta bulunur ve İbn Kathir onların özelliklerini {atıf:tafsir-ibn-kathir} ayrıntılı olarak belirtir."
  id: "Dalam istilah hukum, munafik adalah salah satu ketidakpercayaan yang paling lahiriah dan tersembunyi; Al-Qur'an secara unik merujuk pada Surah Al-Munafiqin, dan Ibn Kathir merinci sifat-sifatnya {cite:tafsir-ibn-kathir}."
