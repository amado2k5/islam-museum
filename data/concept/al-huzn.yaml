id: concept/al-huzn
class: concept
kind: ethical
label:
  ar: "الحزن والهمّ"
  en: "Grief and worry (al-huzn)"
  fr: "La tristesse et le souci (al-huzn)"
  ur: "غم اور فکر ⁦(الحزن)⁩"
  es: "Dolor y preocupación (al-huzn)"
  tr: "Üzüntü ve endişe"
  id: "Kesedihan dan kekhawatiran"
summary:
  ar: "يميّز الشيخ عمر عبد الكافي بين الحزن على ما فات والهمّ بما هو آت، ويصف الحزن غير المعالج بأنه يتدرج إلى الكمد والبثّ وضيق الصدر والكرب، ويعرض علاجه بالدعاء والتوكل ومحبة الله، ويذكر ما يراه من أثر الحزن في الإيمان والكآبة."
  en: "Sheikh Omar Abdelkafy distinguishes grief over what has passed from worry about what is to come; he describes untreated grief as developing into kamad, bath, constriction of the chest and distress, and presents its remedies as prayer, reliance on God and love of God."
  fr: "Le cheikh Omar Abdelkafy distingue la tristesse pour ce qui est passé du souci de ce qui est à venir ; il décrit la tristesse non traitée comme se transformant en kamad, en bath, en oppression de la poitrine et en détresse, et présente comme remèdes la prière, la confiance en Dieu et l'amour de Dieu."
  ur: "شیخ عمر عبدالکافی غم کو گزری ہوئی بات پر حزن اور آنے والی بات کے اندیشے سے الگ کرتے ہیں؛ ان کے بیان کے مطابق بغیر علاج کے غم کمد، بث، سینے کی تنگی اور کرب تک پہنچ سکتا ہے، اور وہ دعا، توکل اور اللہ کی محبت کو اس کا علاج بتاتے ہیں۔"
  es: "El jeque Omar Abdelkafy distingue entre el dolor por lo que ha pasado y la preocupación por lo que está por venir; describe el dolor no tratado como algo que se transforma en kamad, bath, opresión en el pecho y angustia, y presenta sus remedios como la oración, la confianza en Dios y el amor a Dios."
  tr: "Şeyh Ömer Abdul Kafi, geçmişe duyulan keder ile gelecek endişesi arasında ayrım yapar; tedavi edilmeyen üzüntüyü keder, kaygı, göğüs sıkışması ve sıkıntıya dönüşür. Tepkisini yalvarış, Tanrı'ya güvenme ve Tanrı sevgisiyle sunar; üzüntünün inanç ve depresyon üzerindeki etkisini belirtir."
  id: "Sheikh Omar Abdul Kafi membedakan antara duka tentang masa lalu dan kecemasan tentang masa depan; kesedihan yang tidak diobati berubah menjadi kesedihan, kecemasan, dada sesak, dan tekanan. Ia menyampaikan responsnya dengan permohonan, kepercayaan kepada Tuhan, dan kasih kepada Tuhan; ia menunjukkan dampak kesedihan terhadap iman dan depresi."
