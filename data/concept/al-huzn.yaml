label:
  ar: "الحزن والهمّ"
  en: "Grief and worry (al-huzn)"
  ur: "غم اور فکر (الحزن)"
summary:
  ar: "يميّز الشيخ عمر عبد الكافي بين الحزن على ما فات والهمّ بما هو آت، ويصف الحزن غير المعالج بأنه يتدرج إلى الكمد والبثّ وضيق الصدر والكرب، ويعرض علاجه بالدعاء والتوكل ومحبة الله، ويذكر ما يراه من أثر الحزن في الإيمان والكآبة."
  en: "Sheikh Omar Abdelkafy distinguishes grief over what has passed from worry about what is to come; he describes untreated grief as developing into kamad, bath, constriction of the chest and distress, and presents its remedies as prayer, reliance on God and love of God."
  ur: "شیخ عمر عبدالکافی غم کو گزری ہوئی بات پر حزن اور آنے والی بات کے اندیشے سے الگ کرتے ہیں؛ ان کے بیان کے مطابق بغیر علاج کے غم کمد، بث، سینے کی تنگی اور کرب تک پہنچ سکتا ہے، اور وہ دعا، توکل اور اللہ کی محبت کو اس کا علاج بتاتے ہیں۔"
