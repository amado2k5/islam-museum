id: concept/testimony-shahada
class: concept
kind: legal
label:
  ar: "الشَّهادة"
  en: "Shahada (testimony in law: its meaning, its basis, the duty to give it, and the conditions of the witness)"
summary:
  ar: "الشهادة في الاصطلاح الفقهي إخبار بحق للغير على الغير في مجلس القضاء بلفظ أشهد، وهي حجة شرعية توجب على الحاكم أن يحكم بمقتضاها. وتحملها وأداؤها فرض على الكفاية، ويتعين على من تعين وخيف ضياع الحق، وتقوم على الكتاب والسنة والإجماع. ولها شروط تحمل وأداء: فيشترط في الشاهد العقل والبلوغ والحرية والإسلام والبصر والنطق والعدالة والتيقظ عند المالكية والحنابلة والحنفية باختلاف، ولا تقبل شهادة الكافر إلا في الوصية في السفر على رأي، ولا شهادة الصبي إلا في الجراح والقتل عند بعضهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10186} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10187} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10188} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10190} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10192} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10195}"
  en: "In legal usage, testimony is a statement by one person of another's right against a third party, in the session of the judge, made with the word 'I testify'. It is a legal proof that obliges the judge to rule accordingly. Giving and bearing testimony is a communal duty, becoming individual where the right is at risk; its basis is the Qur'an, the sunna and consensus. Its conditions are of bearing and of giving. The witness must be sane, of age, free, Muslim, sighted, able to speak, upright and attentive, with the schools differing on some of these; a non-Muslim is not accepted except for a bequest on a journey according to one view, and a child only in wounds and killing according to some. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10186} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10187} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10188} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10190} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10192} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10195}"
