class: concept
kind: legal
label:
  ar: "الشَّهادة"
  en: "Shahada (testimony in law: its meaning, its basis, the duty to give it, and the conditions of the witness)"
  es: "Shahada (testimonio legal: su significado, su fundamento, el deber de prestarlo y las condiciones del testigo)"
  fr: "Shahada (témoignage en droit: sa signification, son fondement, l’obligation de le rendre et les conditions du témoin)"
  ur: "شہادت ⁦(قانون میں گواہی: اس کے معنی، اس کی بنیاد، اسے دینے کا فرض، اور گواہ کی شرائط)⁩"
summary:
  ar: "الشهادة في الاصطلاح الفقهي إخبار بحق للغير على الغير في مجلس القضاء بلفظ أشهد، وهي حجة شرعية توجب على الحاكم أن يحكم بمقتضاها. وتحملها وأداؤها فرض على الكفاية، ويتعين على من تعين وخيف ضياع الحق، وتقوم على الكتاب والسنة والإجماع. ولها شروط تحمل وأداء: فيشترط في الشاهد العقل والبلوغ والحرية والإسلام والبصر والنطق والعدالة والتيقظ عند المالكية والحنابلة والحنفية باختلاف، ولا تقبل شهادة الكافر إلا في الوصية في السفر على رأي، ولا شهادة الصبي إلا في الجراح والقتل عند بعضهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10186} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10187} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10188} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10190} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10192} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10195}"
  en: "In legal usage, testimony is a statement by one person of another's right against a third party, in the session of the judge, made with the word 'I testify'. It is a legal proof that obliges the judge to rule accordingly. Giving and bearing testimony is a communal duty, becoming individual where the right is at risk; its basis is the Qur'an, the sunna and consensus. Its conditions are of bearing and of giving. The witness must be sane, of age, free, Muslim, sighted, able to speak, upright and attentive, with the schools differing on some of these; a non-Muslim is not accepted except for a bequest on a journey according to one view, and a child only in wounds and killing according to some. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10186} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10187} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10188} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10190} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10192} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10195}"
  es: "En el ámbito jurídico, el testimonio es la declaración de una persona sobre el derecho de otra frente a un tercero, ante el juez, realizada con la expresión «Yo testifico». Constituye una prueba legal que obliga al juez a dictar sentencia en consecuencia. Dar y prestar testimonio es un deber comunitario, que se convierte en individual cuando el derecho está en riesgo; su fundamento reside en el Corán, la Sunna y el consenso. Las condiciones para prestar y dar testimonio son las siguientes: el testigo debe estar en pleno uso de sus facultades mentales, ser mayor de edad, libre, musulmán, tener vista, poder hablar, ser íntegro y atento, si bien existen diferentes escuelas jurídicas respecto a algunos de estos requisitos. Según una opinión, no se acepta a un no musulmán salvo en caso de fallecimiento durante un viaje, y según otras, a un menor solo en caso de heridas o muerte. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10186} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10187} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10188} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10190} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10192} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10195}"
  fr: "En droit, le témoignage est une déclaration faite par une personne, devant un juge, concernant le droit d'une autre personne contre un tiers, au moyen des mots « J'atteste ». Il s'agit d'une preuve légale qui oblige le juge à statuer en conséquence. Témoigner est un devoir collectif, devenant individuel lorsque le droit est en jeu; ce devoir repose sur le Coran, la Sunna et le consensus. Ses conditions concernent à la fois le témoignage lui-même et le témoignage lui-même. Le témoin doit être sain d'esprit, majeur, libre, musulman, voyant, capable de parler, intègre et attentif, les écoles de pensée divergeant sur certains de ces critères; selon une opinion, un non-musulman n'est pas accepté comme témoin, sauf pour un legs lors d'un voyage, et selon une autre, un enfant seulement en cas de blessures ou de meurtre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10186} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10187} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10188} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10190} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10192} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10195}"
  ur: "قانونی استعمال میں، گواہی کسی تیسرے فریق کے خلاف کسی دوسرے کے حق کا ایک شخص کا بیان ہے، جج کے اجلاس میں، لفظ 'میں گواہی دیتا ہوں' کے ساتھ بنایا گیا ہے۔ یہ ایک قانونی ثبوت ہے جو جج کو اس کے مطابق فیصلہ کرنے کا پابند کرتا ہے۔ گواہی دینا اور برداشت کرنا ایک اجتماعی فرض ہے، جہاں حق کو خطرہ ہو وہاں فرد بننا۔ اس کی بنیاد قرآن، سنت اور اجماع ہے۔ اس کی شرائط اٹھانے اور دینے کی ہیں۔ گواہ کو سمجھدار، عمر کا، آزاد، مسلمان، بصارت والا، بولنے کے قابل، سیدھا اور توجہ دینے والا ہونا چاہیے، ان میں سے بعض پر مکاتب اختلاف کے ساتھ؛ غیر مسلم کی قبول نہیں ہوتی سوائے ایک قول کے مطابق سفر کی وصیت کے اور بعض کے نزدیک صرف زخموں اور جاں بحق ہونے والے بچے کے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10186} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10187} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10188} p.10190} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.10192} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ10195}"
