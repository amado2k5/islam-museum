label:
  ar: الخصومة
  en: Khusuma (dispute and litigation)
  ur: خصومت
summary:
  ar: 'الخصومة لغة المنازعة والجدل والغلبة بالحجة، وأطلقها الفقهاء على رفع الدعوى أمام القضاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7650} تفترق عن العداوة، وهي ما يتمكن في القلب من قصد الإضرار والانتقام؛ والمخاصمة قول والمعاداة فعل قلب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7650}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7651} الحنفية يعرفون الدعوى بأنها قول مقبول عند القاضي لطلب حق على غيره أو دفعه عن حق نفسه، فتتساوى عندهم مع الخصومة؛ والشافعية يعرفونها بإخبار بحق على غيره عند حاكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7651} الخصومة قسمان: أن ينفرد الخصم بها ولا يحتاج إلى حضور غيره، كمن يترتب على إقراره حكم فهو خصم بإنكاره؛ وأن تحتاج إلى طرف آخر كمسائل الوديعة والعارية والإجارة والرهن والغصب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7651} ضابط الخصومة: المدعي يكون خصما إذا كان يترتب على إقراره حكم، والمدعى عليه إذا لا يصح إقراره لا يكون خصما بإنكاره، كدعوى الدين على ولي الصغير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7651}'
  en: 'Khusuma is lexically dispute, argument and victory by proof; the jurists use it for bringing a claim before the judge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7650} It differs from enmity, a purpose lodged in the heart to harm or avenge; disputing is speech, enmity is an act of the heart. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7650}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7651} The Hanafis define a claim as an accepted statement before the judge seeking a right against another or defending one''s own, so for them claim and dispute coincide; the Shafiis define it as news of a right against another before a ruler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7651} A dispute is of two kinds: one in which a party stands alone, as one whose admission would bind him is a disputant when he denies; and one needing another party, as in deposit, loan, hire, pledge and usurpation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7651} Rule: a claimant is a disputant if his admission would bind; a respondent whose admission cannot bind (a claim for debt against a minor''s guardian) is not a disputant by denying. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7651}'
  ur: 'خصومت لغت میں جھگڑا، بحث اور دلیل سے غلبہ ہے، فقہاء اسے دعویٰ عدالت میں لانے کے معنی میں بولتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7650} یہ عداوت سے مختلف ہے جو دل میں ضرر یا بدلے کا ارادہ ہے؛ خصومت قول ہے اور عداوت دل کا فعل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7650}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7651} حنفیہ دعوے کی تعریف یوں کرتے ہیں کہ قاضی کے نزدیک قابل قبول قول جو دوسرے سے حق طلب کرنے یا اپنا حق دفع کرنے کے لیے ہو، اس طرح ان کے نزدیک دعویٰ اور خصومت ایک ہیں؛ شافعیہ کے نزدیک حاکم کے سامنے دوسرے پر حق کی خبر دینا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7651} خصومت کی دو قسمیں ہیں: ایک جس میں فریق اکیلا ہو، جیسے وہ شخص جس کے اقرار پر حکم لازم ہو تو انکار پر وہ خصم ہے؛ اور دوسری جس میں دوسرے فریق کی ضرورت ہو، جیسے ودیعت، عاریت، اجارہ، رہن اور غصب۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7651} ضابطہ: مدعی خصم ہے جب اس کا اقرار حکم لازم کرے، اور مدعیٰ علیہ جس کا اقرار صحیح نہ ہو (جیسے یتیم کے ولی پر قرض کا دعویٰ) انکار سے خصم نہیں ہوتا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7651}'
