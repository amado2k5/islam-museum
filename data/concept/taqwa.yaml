id: concept/taqwa
class: concept
kind: doctrine
label:
  ar: التقوى
  en: Taqwa (God-consciousness)
summary:
  ar: "أن يجعل العبد بينه وبين ما يخافه ويحذره وقاية تقيه منه؛ فتقوى العبد لربه أن يجعل بينه وبين ما يخشاه من غضبه وسخطه وعقابه وقاية، وهي فعل طاعته واجتناب معاصيه — هذا أصل التقوى عند ابن رجب في شرح وصية «اتق الله حيثما كنت»؛ وتضاف التقوى إلى اسم الله فتكون اتقاء سخطه وغضبه وهو أعظم ما يتقى، وإلى عقابه كالنار وإلى زمانه كيوم القيامة؛ ويدخل في التقوى الكاملة فعل الواجبات وترك المحرمات والشبهات، وأعلى درجاتها دخول فعل المندوبات وترك المكروهات؛ ومن أقوال السلف: قال عمر بن عبد العزيز ليست تقوى الله بصيام النهار ولا قيام الليل بل ترك ما حرم الله وأداء ما افترض، وقال طلق بن حبيب أن تعمل بطاعة الله على نور من الله ترجو ثوابه وتترك معصيته على نور من الله تخاف عقابه، وقال أبو الدرداء تمام التقوى أن يتقي العبد مثقال ذرة حتى يترك بعض الحلال حجاباً بينه وبين الحرام، وقال الثوري إنما سموا متقين لأنهم اتقوا ما لا يتقى، وفسر ابن مسعود «اتقوا الله حق تقاته» بأن يطاع فلا يعصى ويذكر فلا ينسى ويشكر فلا يكفر؛ والتقوى وصية الله للأولين والآخرين ووصية رسوله لأمته، وكان يوصي بها الأمير على السرية، وقال لأبي ذر «أوصيك بتقوى الله فإنه رأس الأمر كله»، ومن أكثر ما يدخل الناس الجنة تقوى الله وحسن الخلق. ويستعرض باب التقوى في رياض الصالحين صورها: سئل النبي من أتقى الناس فقال «يوسف نبي الله ابن نبي الله ابن نبي الله ابن خليل الله» ثم قال عن معادن العرب خيرهم في الجاهلية خيرهم في الإسلام إذا فقهوا {cite:riyad-salihin p.29}، وروى مسلم عن أبي هريرة «إن الدنيا حلوة خضرة وإن الله مستخلفكم فيها فينظر كيف تعملون فاتقوا الدنيا واتقوا النساء فإن أول فتنة بني إسرائيل كانت في النساء» {cite:riyad-salihin p.30}، ومن حفظ التقوى في اليمين قوله «من حلف على يمين ثم رأى أتقى منها فليفعل التقوى» رواه مسلم {cite:riyad-salihin p.31}"
  en: "That the servant sets between himself and what he fears a guard to shield him — his taqwa of his Lord being a guard against what he dreads of His anger, displeasure and punishment, namely doing His obedience and avoiding disobedience; this is Ibn Rajab's root definition in the commentary on 'fear God wherever you are'; taqwa is ascribed to God's name as the guarding against His wrath — the greatest of what is guarded against — and to His punishment like the Fire and His time like the Day of Resurrection; complete taqwa includes doing the obligations and leaving the forbidden and the doubtful, its highest degree adding the recommended and leaving the disliked; among the early generations: Umar ibn Abd al-Aziz held taqwa is not fasting the day or praying the night but leaving what God forbade and performing what He imposed, Talq ibn Habib that it is working in obedience upon light from God hoping His reward and leaving disobedience upon light fearing His punishment, Abu al-Darda' that its perfection is guarding to an atom's weight until some of the lawful is left as a screen from the unlawful, al-Thawri that they were called muttaqun for avoiding what need not be avoided, and Ibn Masud glossed 'fear God as He should be feared' as being obeyed and not disobeyed, remembered and not forgotten, thanked and not denied; taqwa is God's counsel to the first and the last and His messenger's bequest to his community — he counselled the commander of every expedition with it, told Abu Dharr 'I counsel you with taqwa, for it is the head of the whole matter', and the pair 'taqwa of God and good character' is what most admits people to Paradise. The chapter on taqwa in Riyad al-Salihin surveys its images: asked who was the most God-fearing of people the Prophet answered 'Yusuf, prophet of God, son of a prophet of God, son of a prophet of God, son of God's intimate friend', then said of the Arabs' best that their best in the Jahiliyya are their best in Islam once they gain understanding {cite:riyad-salihin p.29}; Muslim relates from Abu Hurayra 'this world is sweet and green, and God has made you successors in it to see how you act — so fear the world and fear women, for the first trial of the Children of Israel was in women' {cite:riyad-salihin p.30}; and among the pieties of taqwa in oaths is 'whoever swears an oath then sees something more God-fearing than it, let him do the God-fearing thing', related by Muslim {cite:riyad-salihin p.31}"
