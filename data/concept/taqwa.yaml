id: concept/taqwa
class: concept
kind: doctrine
label:
  ar: التقوى
  en: Taqwa (God-consciousness)
summary:
  ar: "أن يجعل العبد بينه وبين ما يخافه ويحذره وقاية تقيه منه؛ فتقوى العبد لربه أن يجعل بينه وبين ما يخشاه من غضبه وسخطه وعقابه وقاية، وهي فعل طاعته واجتناب معاصيه — هذا أصل التقوى عند ابن رجب في شرح وصية «اتق الله حيثما كنت»؛ وتضاف التقوى إلى اسم الله فتكون اتقاء سخطه وغضبه وهو أعظم ما يتقى، وإلى عقابه كالنار وإلى زمانه كيوم القيامة؛ ويدخل في التقوى الكاملة فعل الواجبات وترك المحرمات والشبهات، وأعلى درجاتها دخول فعل المندوبات وترك المكروهات؛ ومن أقوال السلف: قال عمر بن عبد العزيز ليست تقوى الله بصيام النهار ولا قيام الليل بل ترك ما حرم الله وأداء ما افترض، وقال طلق بن حبيب أن تعمل بطاعة الله على نور من الله ترجو ثوابه وتترك معصيته على نور من الله تخاف عقابه، وقال أبو الدرداء تمام التقوى أن يتقي العبد مثقال ذرة حتى يترك بعض الحلال حجاباً بينه وبين الحرام، وقال الثوري إنما سموا متقين لأنهم اتقوا ما لا يتقى، وفسر ابن مسعود «اتقوا الله حق تقاته» بأن يطاع فلا يعصى ويذكر فلا ينسى ويشكر فلا يكفر؛ والتقوى وصية الله للأولين والآخرين ووصية رسوله لأمته، وكان يوصي بها الأمير على السرية، وقال لأبي ذر «أوصيك بتقوى الله فإنه رأس الأمر كله»، ومن أكثر ما يدخل الناس الجنة تقوى الله وحسن الخلق."
  en: "That the servant sets between himself and what he fears a guard to shield him — his taqwa of his Lord being a guard against what he dreads of His anger, displeasure and punishment, namely doing His obedience and avoiding disobedience; this is Ibn Rajab's root definition in the commentary on 'fear God wherever you are'; taqwa is ascribed to God's name as the guarding against His wrath — the greatest of what is guarded against — and to His punishment like the Fire and His time like the Day of Resurrection; complete taqwa includes doing the obligations and leaving the forbidden and the doubtful, its highest degree adding the recommended and leaving the disliked; among the early generations: Umar ibn Abd al-Aziz held taqwa is not fasting the day or praying the night but leaving what God forbade and performing what He imposed, Talq ibn Habib that it is working in obedience upon light from God hoping His reward and leaving disobedience upon light fearing His punishment, Abu al-Darda' that its perfection is guarding to an atom's weight until some of the lawful is left as a screen from the unlawful, al-Thawri that they were called muttaqun for avoiding what need not be avoided, and Ibn Masud glossed 'fear God as He should be feared' as being obeyed and not disobeyed, remembered and not forgotten, thanked and not denied; taqwa is God's counsel to the first and the last and His messenger's bequest to his community — he counselled the commander of every expedition with it, told Abu Dharr 'I counsel you with taqwa, for it is the head of the whole matter', and the pair 'taqwa of God and good character' is what most admits people to Paradise."
