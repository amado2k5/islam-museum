id: concept/taqwa
class: concept
kind: doctrine
label:
  ar: التقوى
  en: Taqwa (God-consciousness)
summary:
  ar: "التقوى مصطلح ديني إسلامي يدل على الورع وخشية الله، وتجمع المادة المرجعية فيها مبدأين هما الخوف والامتناع، وتذكر أنها كانت في الأصل تدل على حسن القيام بالواجب تجاه القبيلة ثم امتزجت بمعنى خشية الله. وهي في القرآن من أكثر المفاهيم ورداً، وتُعد عنصراً باطناً من الإيمان، وللصوفية فيها خطان: التقوى امتناعاً وتقوى القلب. وترد في مقامات القشيري رابعةً بعد الخلوة، ثم تخفت عند كثير من المؤلفين المتأخرين، وتعامل بالمفارقة في شعر سعدي وحافظ. وقد قدّم ابن رجب والسلف والطبري وغيرهم تعريفات أخرى مبسوطة في صفحة المفهوم."
  en: "Taqwa is an Islamic religious term for piety and fear of God. The Encyclopaedia of Islam Supplement traces two principles in it, fear and abstinence, and says the word first denoted dutiful conduct toward one's tribe before merging with the Qur'anic sense. It presents taqwa as one of the Qur'an's most frequent concepts and as an inward element of faith; Sufi writers take it either as abstinence or as abstinence of the heart. Al-Qushayri places it fourth among the stations after retreat, many later authors omit it, and Persian poets such as Saadi and Hafiz treat it with irony. The page also gathers the definitions of Ibn Rajab, the early generations and al-Tabari."
  ur: "تقویٰ ایک اسلامی دینی اصطلاح ہے جو پرہیزگاری اور خوفِ خدا پر دلالت کرتی ہے۔ دائرۃ المعارف اسلامیہ کا ضمیمہ اس میں دو اصول، خوف اور پرہیز، بتاتا ہے اور کہتا ہے کہ لفظ پہلے قبیلے کے لیے فرض شناسی کے معنی میں تھا، پھر قرآنی معنی سے مل گیا۔ وہ اسے قرآن کے کثیر المذکور تصورات اور ایمان کا باطنی جزو مانتا ہے؛ صوفیہ اسے پرہیز یا دل کے پرہیز کے طور پر لیتے ہیں۔ قشیری اسے مقامات میں خلوت کے بعد چوتھا رکھتے ہیں، بہت سے بعد کے مصنفین اسے چھوڑ دیتے ہیں، اور سعدی و حافظ جیسے فارسی شاعر اس سے طنز کا معاملہ کرتے ہیں۔ صفحے میں ابن رجب، سلف اور طبری کی تعریفیں بھی جمع ہیں۔"
