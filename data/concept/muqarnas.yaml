summary:
  ar: "عنصر معماري إسلامي من مقرنصات خلوية تشبه الستالكتيت تنتقل بها الزاويات والقباب والمحاريب؛ من أبرز ملامح العمارة الإسلامية."
  en: "The Islamic architectural element of honeycomb, stalactite-like cells articulating vaults, domes and mihrabs; a signature of Islamic architecture."
  es: "El elemento arquitectónico islámico de celdas con forma de panal, similares a estalactitas, que articulan bóvedas, cúpulas y mihrabs; un sello distintivo de la arquitectura islámica."
  fr: "L'élément architectural islamique des alvéoles, ces cellules semblables à des stalactites qui articulent les voûtes, les dômes et les mihrabs; une signature de l'architecture islamique."
  ur: "شہد کے چھتے کا اسلامی تعمیراتی عنصر، سٹالیکٹائٹ نما خلیات جو کہ تہواروں، گنبدوں اور محرابوں کو بیان کرتے ہیں۔ اسلامی فن تعمیر کا ایک نشان۔"
  tr: "Zaviye, kubbe ve mihrapların taşındığı sarkıta benzeyen hücre mukarnalarından oluşan İslami bir mimari unsurdur; bunlar İslam mimarisinin en belirgin özelliklerindendir."
  id: "Elemen arsitektur Islam yang terbuat dari muqarna sel yang menyerupai stalaktit, melalui mana zawiya, kubah, dan mihrab dibawa; ini adalah salah satu fitur paling menonjol dari arsitektur Islam."
