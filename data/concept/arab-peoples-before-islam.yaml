label: { ar: "موقع العرب وأقوامها قبل الإسلام", en: "The Arabs and their peoples before Islam", fr: "Les Arabes et leurs peuples avant l’islam", es: "Los árabes y sus pueblos antes del Islam", ur: "اسلام سے پہلے عرب اور ان کے لوگ", tr: "Arapların ve Halklarının İslam Öncesi Konumu", id: "Lokasi orang Arab dan Bangsanya Sebelum Islam" }
summary:
  ar: "مدخل الرحيق المختوم إلى السيرة: معنى لفظ «العرب»، وحدود الجزيرة ومساحتها وموقعها بين القارات، وتقسيم المؤرخين العرب إلى بائدة وعاربة ⁦(قحطان)⁩ ومستعربة ⁦(عدنان)⁩، وهجرات بطون كهلان من اليمن، ونسب العدنانيين إلى إسماعيل، وتوزع القبائل في الجزيرة حتى نبغ قصي في قريش."
  en: "The opening chapter of al-Raheeq al-Makhtum: the word 'Arab', the peninsula's borders, size and position between the continents, the historians' threefold division (extinct, original and Arabized Arabs), the Kahlani migrations from Yemen, the Adnani descent from Ismail, and the tribes' distribution across Arabia."
  fr: "Le chapitre d’ouverture d’al-Raheeq al-Makhtum : le mot « Arabe », les limites, la superficie et la situation de la péninsule entre les continents, la division tripartite des historiens (Arabes disparus, purs et arabisés), les migrations des Kahlanites depuis le Yémen, l’ascendance des Adnanites remontant à Ismail, et la répartition des tribus en Arabie."
  es: "El capítulo inicial de al-Raheeq al-Makhtum: la palabra \"árabe\", las fronteras de la península, su tamaño y posición entre los continentes, la triple división que hacen los historiadores (árabes extintos, árabes originales y árabes arabizados), las migraciones de los Kahlani desde Yemen, la descendencia de los Adnani de Ismail y la distribución de las tribus por toda Arabia."
  ur: "الرحیق المختم کا ابتدائی باب: لفظ 'عرب'، جزیرہ نما کی سرحدیں، براعظموں کے درمیان حجم اور مقام، مورخین کی تین گنا تقسیم ⁦(ناپید، اصل اور عربی عرب)⁩، یمن سے کہلانی ہجرت، اسماعیل سے عدنانی نزول، اور عربوں میں تقسیم۔"
  tr: "Mühürlü nektarın biyografiye girişi: 'Araplar' teriminin anlamı, yarımadanın sınırları, alanı ve kıtalar arasındaki konumu, Arap tarihçilerinin soyu tükenmiş ve 'ariba (Qahtan) ile Araplaşmış (Adnan) olarak bölünmesi, Yemen'den Kahlan klanlarının göçleri, Adnanilerin İsmail'e olan soyu ve yarımadadaki kabilelerin dağılımı, ta ki Quseyy'nin Kureyş'te belirgin şekilde yükselmesine kadar."
  id: "Pengantar nektar tersegel dalam biografi: makna istilah 'Arab,' batas-batas semenanjung, wilayahnya, dan lokasinya antar benua, pembagian sejarawan Arab menjadi punah dan 'ariba (Qahtan) dan Arabisasi (Adnan), migrasi klan Kahlan dari Yaman, garis keturunan Adnanis ke Ismail, dan distribusi suku di semenanjung hingga Qusayy menonjol dalam bahasa Quraisy."
