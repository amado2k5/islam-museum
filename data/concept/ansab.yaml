id: concept/ansab
class: concept
kind: doctrine
label: { ar: "الأنصاب", en: "Ansab (stone markers set up for worship, and the rulings on them)" }
summary:
  ar: "الأنصاب جمع نصب، وهي حجارة كانت حول الكعبة تنصب فيُهَلّ لها ويذبح عليها لغير الله، وقيل كل ما عُبد من دون الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3502} والفرق بينها وبين الأصنام أن الأصنام مصورة منقوشة، والأنصاب حجارة منصوبة، وعلى رأي آخر الأنصاب والأوثان سواء في عدم التصوير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3502}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3503} وأنصاب الحرم علامات لبيان حدوده لا تقديس فيها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3503} وصنع الأصنام وبيعها واقتناؤها محرم، وصنع الصور المجسدة لإنسان أو حيوان حرام باتفاق الفقهاء، والأجرة عليها لا تجوز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3504}"
  en: "Ansab is the plural of nasb, stones set up around the Ka'ba, at which the pilgrims called out and upon which offerings were slaughtered for other than God; some say it means anything worshipped apart from God. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3502} Idols differ from ansab in that idols are carved and painted while ansab are stones set up; on another view ansab and awthan are alike in being unshaped. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3502}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3503} The markers of the sanctuary mark its bounds and carry no sanctity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3503} Making, selling and keeping idols is forbidden, and the jurists agree that making a shaped image of a human or animal is forbidden, and that a fee for it is not allowed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3504}"
