label: { ar: "الأنصاب", en: "Ansab (stone markers set up for worship, and the rulings on them)", fr: "Ansab (pierres dressées à des fins cultuelles et règles à leur sujet)", es: "Ansab (marcadores de piedra erigidos para el culto y las normas que los rigen)", ur: "انساب ⁦(عبادت کے لیے پتھر کے نشانات اور ان کے احکام)⁩", tr: "Anıtlar", id: "Monumen" }
summary:
  ar: "الأنصاب جمع نصب، وهي حجارة كانت حول الكعبة تنصب فيُهَلّ لها ويذبح عليها لغير الله، وقيل كل ما عُبد من دون الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3502} والفرق بينها وبين الأصنام أن الأصنام مصورة منقوشة، والأنصاب حجارة منصوبة، وعلى رأي آخر الأنصاب والأوثان سواء في عدم التصوير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3502}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3503} وأنصاب الحرم علامات لبيان حدوده لا تقديس فيها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3503} وصنع الأصنام وبيعها واقتناؤها محرم، وصنع الصور المجسدة لإنسان أو حيوان حرام باتفاق الفقهاء، والأجرة عليها لا تجوز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3504}"
  en: "Ansab is the plural of nasb, stones set up around the Ka'ba, at which the pilgrims called out and upon which offerings were slaughtered for other than God; some say it means anything worshipped apart from God. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3502} Idols differ from ansab in that idols are carved and painted while ansab are stones set up; on another view ansab and awthan are alike in being unshaped. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3502}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3503} The markers of the sanctuary mark its bounds and carry no sanctity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3503} Making, selling and keeping idols is forbidden, and the jurists agree that making a shaped image of a human or animal is forbidden, and that a fee for it is not allowed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3504}"
  fr: "Ansab est le pluriel de nasb : des pierres dressées autour de la Kaaba, auprès desquelles les pèlerins poussaient des appels et sur lesquelles des victimes étaient immolées en offrande à d’autres que Dieu. Certains y voient tout ce qui fait l’objet d’un culte en dehors de Dieu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3502} Les idoles se distinguent des ansab en ce qu’elles sont sculptées et peintes, tandis que les ansab sont des pierres dressées ; selon un autre avis, les ansab et les awthan ont en commun de ne pas être façonnés. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3502}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3503} Les bornes du sanctuaire en signalent les limites et n’ont pas de caractère sacré. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3503} Il est interdit de fabriquer, de vendre et de conserver des idoles ; les juristes s’accordent à interdire la fabrication d’une représentation façonnée d’un être humain ou d’un animal et à ne pas autoriser de rémunération pour ce travail. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3504}"
  es: "Ansab es el plural de nasb, piedras colocadas alrededor de la Kaaba, en las cuales los peregrinos clamaban y sobre las cuales se sacrificaban ofrendas para otros que no fueran Dios; algunos dicen que significa cualquier cosa adorada aparte de Dios. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3502} Los ídolos se diferencian de los ansab en que los ídolos están tallados y pintados, mientras que los ansab son piedras colocadas; según otra opinión, ansab y awthan son similares en que no tienen forma. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3502}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3503} Los marcadores del santuario marcan sus límites y no tienen santidad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3503} La fabricación, venta y posesión de ídolos están prohibidas, y los juristas coinciden en que la creación de imágenes moldeadas de seres humanos o animales está prohibida, y que no se permite cobrar por ellas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3504}"
  ur: "انساب ناسب کی جمع ہے، کعبہ کے گرد پتھر لگائے جاتے ہیں، جس پر حجاج پکارتے تھے اور جن پر قربانی خدا کے سوا کسی اور کے لیے ذبح کی جاتی تھی۔ بعض کہتے ہیں کہ اس سے مراد خدا کے علاوہ کسی بھی چیز کی پرستش کی جاتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3502} بت انساب سے اس لحاظ سے مختلف ہیں کہ بت تراشے اور پینٹ کیے جاتے ہیں جبکہ انساب پتھر ہیں؛ ایک اور قول پر انساب اور اوتھان بے شکل ہونے میں یکساں ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3502}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3503} حرم کے نشان اس کی حدود کو نشان زد کرتے ہیں اور کوئی حرمت نہیں رکھتے۔ بت بنانا، بیچنا اور رکھنا حرام ہے، اور فقہاء اس بات پر متفق ہیں کہ انسان یا جانور کی شکل والی تصویر بنانا حرام ہے، اور اس کے لیے فیس لینا جائز نہیں ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 3504}"
  tr: "'Ansar' çoğuldur: 'nisb', Kabe'nin etrafına yerleştirilen taşlardır; burada Allah dışındaki herkes için kurban edilirler. Ayrıca, Allah dışında tapılan her şeyin 'nasb' olarak kabul edildiği söylenir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3502} Putlardan farkı, putların tasvir edilip oyulması, 'al-ansar'ın ise yerleştirilmiş taşlardır. Başka bir görüşe göre, 'al-an'as' ve 'putlar' aynıdır; çünkü tasvir edilmezler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3502} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3503} Ve kutsal alan anıtları, kutsal sınırları göstermek için işaretlenmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3503} putların yapımı, satılması ve sahip olunması yasaktır; insan veya hayvan tasvir eden resimler yapmak hukukçuların uzlaşmasıyla yasaktır ve bunlar için ücret ödemek yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3504}"
  id: "'ansar' adalah bentuk jamak: 'nisb', yaitu batu-batu yang diletakkan mengelilingi Ka'bah, tempat mereka didirikan dan dikorbankan untuk siapa pun selain Allah. Dikatakan juga bahwa segala sesuatu yang disembah selain Allah dianggap sebagai 'nasb'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3502} Perbedaannya dengan arca adalah arca digambarkan dan diukir, sedangkan 'al-ansar' adalah batu yang didirikan. Menurut pandangan lain, 'al-an'as' dan 'berhala' sama karena tidak digambarkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3502} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3503} Dan monumen tempat suci ditandai untuk menunjukkan batas-batasnya tanpa pengudusan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3503} dan membuat patung, menjualnya, dan memilikinya dilarang, dan membuat gambar yang menggambarkan manusia atau hewan dilarang oleh kesepakatan para ahli hukum, dan membayar biaya untuk mereka tidak diperbolehkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3504}"
