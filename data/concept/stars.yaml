summary:
  ar: "بالنجم هم يهتدون في ظلمات البر والبحر، وزيّن الله السماء الدنيا بمصابيح وحفظاً من كل شيطان مارد، ولما رأى إبراهيم كوكباً قال هذا ربي حتى أفل."
  en: "By the stars men are guided through the darknesses of land and sea; God adorned the lower heaven with lamps and a guard against every rebellious devil; and when Abraham saw a star he said 'this is my Lord' — until it set."
  ur: "ستاروں کے ذریعے لوگ خشکی اور سمندر کے اندھیروں میں راہ پاتے ہیں؛ اللہ نے دنیا کے آسمان کو چراغوں اور ہر سرکش شیطان سے پہرے سے سجایا؛ اور جب ابراہیم نے ستارہ دیکھا تو کہا 'یہی میرا رب ہے' — جب تک وہ ڈوب نہ گیا۔"
