  ur: "خس الحمار"
summary:
  ar: "خس الحمار في الكتاب نبات كورق الخس الدقيق كثير العدد إلى السواد أزغب، وأوراقه لاصقة بالأصل، ولون أصله إلى الحمرة يصبغ اليد والأرض أحمر، وينبت في أرض طيبة، وهو الشنجار بحسب الكتاب وتعليق محققه؛ حار يابس في أول الثانية، جال مفتح، ينفع من الأورام الصلبة ومن النقرس وعرق النسا ومن القلاع، وينقي الكبد، وفيه نقل موسوم عن الطمث والجنين والرحم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v1 pp.709-710}"
  en: "Khass al-himar is in the book a plant like the leaf of fine lettuce, many of its leaves tending to black and downy, its leaves clinging to the root, the colour of its root tending to red and staining the hand and the ground red, growing in good land, and it is al-shanjar by the book and its editor's note; hot and dry in the beginning of the second degree, cleansing and opening, it benefits hard swellings, gout, sciatica and thrush and cleanses the liver, with a labelled listing on menses, the foetus and the womb in a section held for the founder's ruling {cite:canon-ibn-sina-print-v1 pp.709-710}"
  ur: "خس الحمار کتاب میں ایک نبات ہے جو باریک خس کے پتے جیسا ہے، اس کے بہت سے پتے سیاہی کی طرف مائل اور روئیں دار ہیں، پتے جڑ سے چپکے ہوئے ہیں، جڑ کا رنگ سرخی کی طرف مائل ہے اور ہاتھ اور زمین کو سرخ رنگتا ہے، اور اچھی زمین میں اگتا ہے، اور کتاب اور اس کے محقق کے حاشیے کے مطابق یہ شنجار ہے؛ دوسرے درجے کے آغاز میں گرم خشک، صاف کرنے والا اور کھولنے والا، سخت ورموں، نقرس، عرق النسا اور قلاع میں نافع ہے اور جگر کو صاف کرتا ہے، اور حیض، جنین اور رحم کے بارے میں ایک موسوم نقل بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v1 pp.709-710}۔"
