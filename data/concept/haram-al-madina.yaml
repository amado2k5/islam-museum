id: concept/haram-al-madina
class: concept
kind: legal
label: { ar: "حرم المدينة", en: "The Sanctuary of Medina", es: "El Santuario de Medina", fr: "Le sanctuaire de Médine", ur: "مدینہ کا حرم" }
summary:
  ar: "إعلان النبي المدينة حرماً كما حرَّم إبراهيم مكة، بحدود معلومة: «ما بين عير إلى ثور» أو «إلى أحد» في أكثر التصحيح، و«ما بين لابتيها» أي حرَّتيها شرقاً وغرباً؛ فيحرم فيه الصيد وقطع الشجر إلا ما استُثني، وتُغلَّظ فيه دية القتل الخطأ، وورد النهي عن إحداث حدث فيه أو آواء محدث {cite:samhudi-wafa-al-wafa p. 92-118}. ويرى السمهودي أن بركة التحريم هي التي صرفت نار سنة 654 عن البلد عند وصولها حرمها. ومن أحاديثها في الصحيح: «المدينة حرم من كذا إلى كذا لا يُقطع شجرها ولا يُحدَث فيها حدث، من أحدث فيها حدثاً فعليه لعنة الله والملائكة والناس أجمعين» {cite:sahih-al-bukhari 1867}، و«حُرّم ما بين لابتي المدينة على لساني» وقوله لبني حارثة «أراكم قد خرجتم من الحرم... بل أنتم فيه» {cite:sahih-al-bukhari 1869}، وصحيفة علي: «المدينة حرم ما بين عائر إلى كذا... وذمة المسلمين واحدة» {cite:sahih-al-bukhari 1870}."
  en: "The Prophet's declaration of Medina as a sanctuary, as Abraham sanctified Mecca, with defined bounds — 'between 'Ayr and Thawr' or, in the reading preferred by al-Hazimi and Abu 'Ubayd, 'to Uhud', and 'between its two lava fields' east and west; within it hunting and tree-cutting are forbidden save specified exceptions, the bloodwit for unintended killing is made heavier, and innovation or harbouring an innovator is proscribed {cite:samhudi-wafa-al-wafa p. 92-118}. Samhudi credits the sanctity of the boundary with diverting the fire of 654 as it reached the haram."
  es: "La declaración del Profeta de Medina como santuario, como Abraham santificó La Meca, con límites definidos: «entre Ayr y Thawr» o, en la lectura preferida por al-Hazimi y Abu Ubayd, «hasta Uhud», y «entre sus dos campos de lava» al este y al oeste; dentro de ella se prohíben la caza y la tala de árboles salvo excepciones específicas, se agrava la pena de sangre por homicidio involuntario y se proscribe la innovación o el refugio de un innovador {cite:samhudi-wafa-al-wafa p. 92-118}. Samhudi atribuye a la santidad del límite el haber desviado el fuego del año 654 cuando llegó al haram."
  fr: "La déclaration du Prophète faisant de Médine un sanctuaire, à l'instar de La Mecque sanctifiée par Abraham, avec des limites définies – « entre Ayr et Thawr » ou, selon la lecture privilégiée par al-Hazimi et Abu 'Ubayd, « jusqu'à Uhud », et « entre ses deux champs de lave », à l'est et à l'ouest – en fait un lieu où la chasse et l'abattage d'arbres sont interdits, sauf exceptions spécifiées. La peine encourue pour un homicide involontaire est alourdie, et l'innovation ou le fait d'abriter un innovateur est proscrit (Samhudi-Wafa-Al-Wafa, p. 92-118). Samhudi attribue à la sainteté de cette frontière le mérite d'avoir détourné le feu de l'an 654 qui menaçait d'atteindre le Haram."
  ur: "پیغمبر کا مدینہ کو حرمت کے طور پر قرار دینا، جیسا کہ ابراہیم نے مکہ کو متعین حدود کے ساتھ مقدس کیا تھا - 'عیر اور ثور کے درمیان' یا، الحازیمی اور ابو عبید کے ذریعہ 'احد تک'، اور 'اس کے دو لاوے کے میدانوں کے درمیان' مشرق اور مغرب کے درمیان؛ اس کے اندر شکار اور درخت کاٹنا ممنوع ہے سوائے مخصوص استثناء کے، غیر ارادی قتل کے لیے خون کو بھاری کر دیا گیا ہے، اور بدعت یا بدعت کو پناہ دینا حرام ہے۔ 92-118}۔ سمھودی نے 654 کی آگ کو حرم تک پہنچانے کے ساتھ حدود کی حرمت کا سہرا دیا۔"
