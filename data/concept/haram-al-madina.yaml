id: concept/haram-al-madina
class: concept
kind: legal
label: { ar: "حرم المدينة", en: "The Sanctuary of Medina" }
summary:
  ar: "إعلان النبي المدينة حرماً كما حرَّم إبراهيم مكة، بحدود معلومة: «ما بين عير إلى ثور» أو «إلى أحد» في أكثر التصحيح، و«ما بين لابتيها» أي حرَّتيها شرقاً وغرباً؛ فيحرم فيه الصيد وقطع الشجر إلا ما استُثني، وتُغلَّظ فيه دية القتل الخطأ، وورد النهي عن إحداث حدث فيه أو آواء محدث {cite:samhudi-wafa-al-wafa p. 92-118}. ويرى السمهودي أن بركة التحريم هي التي صرفت نار سنة 654 عن البلد عند وصولها حرمها. ومن أحاديثها في الصحيح: «المدينة حرم من كذا إلى كذا لا يُقطع شجرها ولا يُحدَث فيها حدث، من أحدث فيها حدثاً فعليه لعنة الله والملائكة والناس أجمعين» {cite:sahih-al-bukhari 1867}، و«حُرّم ما بين لابتي المدينة على لساني» وقوله لبني حارثة «أراكم قد خرجتم من الحرم... بل أنتم فيه» {cite:sahih-al-bukhari 1869}، وصحيفة علي: «المدينة حرم ما بين عائر إلى كذا... وذمة المسلمين واحدة» {cite:sahih-al-bukhari 1870}."
  en: "The Prophet's declaration of Medina as a sanctuary, as Abraham sanctified Mecca, with defined bounds — 'between 'Ayr and Thawr' or, in the reading preferred by al-Hazimi and Abu 'Ubayd, 'to Uhud', and 'between its two lava fields' east and west; within it hunting and tree-cutting are forbidden save specified exceptions, the bloodwit for unintended killing is made heavier, and innovation or harbouring an innovator is proscribed {cite:samhudi-wafa-al-wafa p. 92-118}. Samhudi credits the sanctity of the boundary with diverting the fire of 654 as it reached the haram."
