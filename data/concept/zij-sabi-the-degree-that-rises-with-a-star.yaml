id: concept/zij-sabi-the-degree-that-rises-with-a-star
class: concept
kind: scientific
label: { ar: "الدرجة التي يطلع معها الكوكب", en: "The degree that rises with a star", ur: "وہ درجہ جس کے ساتھ ستارہ طلوع ہوتا ہے", es: "El grado que asciende con una estrella" }
summary:
  ar: "يفتتح الباب العشرون بمعرفة الدرجة التي يطلع معها الكوكب في بلد معين وبالتي يغيب معها من فلك البروج. يؤخذ نصف قوس نهار الكوكب ونصف قوس نهار الدرجة التي تتوسط السماء معه، وفرقهما نصف اختلاف النهارين، ثم يُنقص من أزمان المطالع في الإقليم المحدود إن كان نصف قوس الكوكب أكبر، ويُزاد إن كان أقل. {cite:zij-sabi-nallino-byblion pp.53-54}."
  en: "Chapter 20 opens with finding the degree of the ecliptic that rises with a star in a given place and the one that sets with it. One takes the half day arc of the star and of the degree that culminates with it; their difference is half the difference of the two days, and this is subtracted from the rising times of the given clime if the star's half arc is the larger, and added if it is the smaller. {cite:zij-sabi-nallino-byblion pp.53-54}."
  ur: "بیسواں باب اس درجۂ بروج کو جاننے سے شروع ہوتا ہے جس کے ساتھ کسی مقررہ شہر میں ستارہ طلوع ہوتا ہے اور اس درجے کو جس کے ساتھ غروب ہوتا ہے۔ ستارے کی نصف قوسِ نہار اور اس درجے کی نصف قوسِ نہار لی جاتی ہے جو اس کے ساتھ وسط السماء میں آتا ہے؛ ان کا فرق دونوں دنوں کے فرق کا نصف ہے، اور اگر ستارے کی نصف قوس بڑی ہو تو اسے مقررہ اقلیم کے مطالع کے ازمان میں سے گھٹایا جاتا ہے، چھوٹی ہو تو جمع کیا جاتا ہے۔ {cite:zij-sabi-nallino-byblion pp.53-54}۔"
  es: "El capítulo 20 comienza con el cálculo del grado de la eclíptica que sale con una estrella en un lugar determinado y el que se pone con ella. Se toma el arco de medio día de la estrella y del grado que culmina con ella; su diferencia es la mitad de la diferencia de los dos días, y esta se resta de las horas de salida del sol en el lugar dado si el arco de medio día de la estrella es mayor, y se suma si es menor. {cite:zij-sabi-nallino-byblion pp.53-54}."
