id: concept/canon-causes-of-indigestion-and-repletion
class: concept
kind: scientific
label:
  ar: "أسباب التخمة عند ابن سينا"
  en: "The causes of indigestion and repletion in the Canon"
  fr: "Causes d’indigestion et de réplétion dans le Canon"
  ur: "بدہضمی اور امتلا کے اسباب، قانون کے مطابق"
  es: "Las causas de la indigestión y la plenitud en el Canon"
summary:
  ar: "في الفصل الثامن والعشرين يردّ ابن سينا التخمة إلى أسباب بادية من خارج كالإفراط في الترطيب والاستكثار من الحمام بعد الطعام وموانع التحليل كالدعة، وإلى أسباب من داخل كضعف الدافعة أو قوة الماسكة أو ضيق المجاري {cite:canon-ibn-sina-print-v1 p.152}."
  en: "In chapter 28 Ibn Sina traces indigestion and repletion to evident causes from outside, such as excess moistening, much bathing after food and hindrances to dissolving like ease, and to inner causes such as weak expelling power, strong retaining power or narrow passages {cite:canon-ibn-sina-print-v1 p.152}."
  fr: "Au chapitre 28, Ibn Sina attribue indigestion et réplétion à des causes externes : humidification excessive, bains fréquents après repas, obstacles à la résolution comme l’oisiveté ; ou internes : faiblesse expulsive, force rétentive ou passages étroits {cite:canon-ibn-sina-print-v1 p.152}."
  es: "En el capítulo 28, Ibn Sina atribuye la indigestión y la plenitud a causas evidentes externas, como el exceso de humedad, los baños excesivos después de las comidas y los obstáculos a la disolución, como la facilidad, y a causas internas, como un poder de expulsión débil, un poder de retención fuerte o conductos estrechos {cite:canon-ibn-sina-print-v1 p.152}."
  ur: "ابن سینا نے باب 28 میں بدہضمی اور بھر جانے کی ظاہری وجوہات کی نشاندہی کی ہے، جیسے کہ زیادہ تر نم ہونا، کھانے کے بعد بہت زیادہ غسل کرنا اور آسانی کی طرح تحلیل ہونے میں رکاوٹ، اور اندرونی اسباب جیسے کہ کمزور خارج کرنے کی طاقت، مضبوط برقرار رکھنے کی طاقت یا تنگ راستے {حوالہ: کینون-بنت-1-5-1}۔"
