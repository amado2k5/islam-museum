summary:
  ar: "في الفصل الثامن والعشرين يردّ ابن سينا التخمة إلى أسباب بادية من خارج كالإفراط في الترطيب والاستكثار من الحمام بعد الطعام وموانع التحليل كالدعة، وإلى أسباب من داخل كضعف الدافعة أو قوة الماسكة أو ضيق المجاري {cite:canon-ibn-sina-print-v1 p.152}."
  en: "In chapter 28 Ibn Sina traces indigestion and repletion to evident causes from outside, such as excess moistening, much bathing after food and hindrances to dissolving like ease, and to inner causes such as weak expelling power, strong retaining power or narrow passages {cite:canon-ibn-sina-print-v1 p.152}."
