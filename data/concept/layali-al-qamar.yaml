id: concept/layali-al-qamar
class: concept
kind: term
label: { ar: "قول العرب في ليالي الشهور القمرية", en: "The moon's night-litany" }
summary:
  ar: "كانت العرب تخبر عن القمر في كل ليلة على حسب ضيائه على طريق المسألة والجواب فتقول قيل للقمر ما أنت ابن ليلة قال رضاع سخيلة حل أهلها برميلة، ولليلتين حديث أمتين ذواتي أفك ومين، ولثلاث حديث فتيات يجتمعن من شتات، ولأربع غنمة ترتع غير جائع ولا مرضع، ولخمس حديث وأنس، ولسبع تصفر في الشفع وقيل دلجة الضبع، ولثمان قمر أصبحان وقيل رغيف اقتسمه أخوان، ولثلاث عشرة قمر باهر يعشي عين الناظر، ولأربع عشرة مقتبل الشباب أضيء بين السحاب، ولخمس عشرة تم التمام ونفدت الأيام، وهلم جراً إلى آخر الشهر {cite:muruj-al-dhahab p. 512-513}."
  en: "The Arabs' question-and-answer litany on the moon each night of the month — first night 'a suckling kid, its folk milked into a pail', two 'tales of two false tribes', eight 'a loaf split by brothers', thirteen 'a dazzling moon', fifteen 'the full, the days spent' — through the month's wane {cite:muruj-al-dhahab p. 512-513}."
