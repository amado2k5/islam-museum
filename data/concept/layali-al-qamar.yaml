label: { ar: "قول العرب في ليالي الشهور القمرية", en: "The moon's night-litany", es: "La letanía nocturna de la luna", fr: "La litanie nocturne de la lune", ur: "چاند کی رات", tr: "Araplar der ki ay aylarının geceleri", id: "Orang Arab berkata di malam-malam bulan-bulan lunar" }
summary:
  ar: "كانت العرب تخبر عن القمر في كل ليلة على حسب ضيائه على طريق المسألة والجواب فتقول قيل للقمر ما أنت ابن ليلة قال رضاع سخيلة حل أهلها برميلة، ولليلتين حديث أمتين ذواتي أفك ومين، ولثلاث حديث فتيات يجتمعن من شتات، ولأربع غنمة ترتع غير جائع ولا مرضع، ولخمس حديث وأنس، ولسبع تصفر في الشفع وقيل دلجة الضبع، ولثمان قمر أصبحان وقيل رغيف اقتسمه أخوان، ولثلاث عشرة قمر باهر يعشي عين الناظر، ولأربع عشرة مقتبل الشباب أضيء بين السحاب، ولخمس عشرة تم التمام ونفدت الأيام، وهلم جراً إلى آخر الشهر {cite:muruj-al-dhahab p. 512-513}."
  en: "The Arabs' question-and-answer litany on the moon each night of the month — first night 'a suckling kid, its folk milked into a pail', two 'tales of two false tribes', eight 'a loaf split by brothers', thirteen 'a dazzling moon', fifteen 'the full, the days spent' — through the month's wane {cite:muruj-al-dhahab p. 512-513}."
  es: "La letanía de preguntas y respuestas de los árabes sobre la luna cada noche del mes: la primera noche, \"un cabrito lactante, su gente ordeñada en un cubo\"; la segunda, \"historias de dos tribus falsas\"; la octava, \"un pan partido por hermanos\"; la decimotercera, \"una luna deslumbrante\"; la decimoquinta, \"la luna llena, los días transcurridos\"; a lo largo del declive del mes {cite:muruj-al-dhahab p. 512-513}."
  fr: "La litanie de questions-réponses des Arabes sur la lune chaque nuit du mois — la première nuit « un chevreau allaité, son peuple trait dans un seau », deux « contes de deux fausses tribus », huit « un pain partagé par des frères », treize « une lune éblouissante », quinze « la pleine, les jours passés » — jusqu'à la fin du mois {cite:muruj-al-dhahab p. 512-513}."
  ur: "مہینے کی ہر رات چاند پر عربوں کے سوال و جواب کی لطائف - پہلی رات 'ایک دودھ پلانے والا بچہ، اس کے لوگوں نے ایک برتن میں دودھ پلایا'، دو 'دو جھوٹے قبیلوں کی کہانیاں'، آٹھ 'بھائیوں کی طرف سے تقسیم ہونے والی روٹی'، تیرہ 'ایک چمکتا ہوا چاند'، پندرہ 'پورے، گزرے ہوئے دن'۔ 512-513}۔"
  tr: "Araplar her gece ayı parlaklığına göre anlatırlardı, soru-cevap yolunu izlerlerdi. Ay'a şöyle denirdi: 'Sen gece çocuğu musun?' Dedi ki, 'Ailesini bir devede yerleştiren cömert bir dadılık.' İki gece boyunca ruhları vahşi doğada olan iki milletin hadisi vardır; üç için dağınık yerlerden toplanan kızlar; dört gece için açlık ya da emzirmeden otlayan bir koyun; beş gece için bir hadis ve arkadaşlık; yedi gece için önde ıslık çalındığı söylenir, bazıları sırtlanın daljah'ı der; sekiz ay doğmuş olur; bazıları kardeşler arasında bölünmüş bir ekmek der; on üç için bakanın gözünü besleyen parlak bir ay; on dört gece için gençliğin şafağı bulutlar arasında aydınlanır; on beş için günler tamamlanır ve günler tükenir; ve bu şekilde ayın sonuna kadar devam eder {cite:muruj-al-dhahab, s. 512-513}."
  id: "Orang Arab biasa menceritakan tentang bulan setiap malam berdasarkan kecerahannya, mengikuti jalur tanya jawab. Dikatakan kepada bulan, 'Apa kamu anak malam?' Dia berkata, 'Seorang perawat murah hati yang menetap keluarganya di sebuah camelah.' Selama dua malam ada hadits tentang dua bangsa yang jiwanya berada di alam liar; untuk tiga malam ada gadis berkumpul dari tempat-tempat yang tersebar; untuk keempat, seekor domba yang merumput tanpa lapar atau menyusui; untuk lima, hadis dan teman; untuk tujuh, dikatakan bersiul di depan dan beberapa mengatakan daljah hyena diucapkan; untuk delapan bulan yang telah terbit; beberapa mengatakan roti yang dibagi di antara saudara; untuk tiga belas, bulan bercahaya yang memberi makan mata yang memandang; untuk empat belas, fajar muda diterangi di antara awan; selama lima belas, hari selesai dan hari habis; dan seterusnya hingga akhir bulan {cite:muruj-al-dhahab, hlm. 512-513}."
