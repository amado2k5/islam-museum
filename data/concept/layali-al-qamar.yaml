label: { ar: "قول العرب في ليالي الشهور القمرية", en: "The moon's night-litany", es: "La letanía nocturna de la luna", fr: "La litanie nocturne de la lune", ur: "چاند کی رات" }
summary:
  ar: "كانت العرب تخبر عن القمر في كل ليلة على حسب ضيائه على طريق المسألة والجواب فتقول قيل للقمر ما أنت ابن ليلة قال رضاع سخيلة حل أهلها برميلة، ولليلتين حديث أمتين ذواتي أفك ومين، ولثلاث حديث فتيات يجتمعن من شتات، ولأربع غنمة ترتع غير جائع ولا مرضع، ولخمس حديث وأنس، ولسبع تصفر في الشفع وقيل دلجة الضبع، ولثمان قمر أصبحان وقيل رغيف اقتسمه أخوان، ولثلاث عشرة قمر باهر يعشي عين الناظر، ولأربع عشرة مقتبل الشباب أضيء بين السحاب، ولخمس عشرة تم التمام ونفدت الأيام، وهلم جراً إلى آخر الشهر {cite:muruj-al-dhahab p. 512-513}."
  en: "The Arabs' question-and-answer litany on the moon each night of the month — first night 'a suckling kid, its folk milked into a pail', two 'tales of two false tribes', eight 'a loaf split by brothers', thirteen 'a dazzling moon', fifteen 'the full, the days spent' — through the month's wane {cite:muruj-al-dhahab p. 512-513}."
  es: "La letanía de preguntas y respuestas de los árabes sobre la luna cada noche del mes: la primera noche, \"un cabrito lactante, su gente ordeñada en un cubo\"; la segunda, \"historias de dos tribus falsas\"; la octava, \"un pan partido por hermanos\"; la decimotercera, \"una luna deslumbrante\"; la decimoquinta, \"la luna llena, los días transcurridos\"; a lo largo del declive del mes {cite:muruj-al-dhahab p. 512-513}."
  fr: "La litanie de questions-réponses des Arabes sur la lune chaque nuit du mois — la première nuit « un chevreau allaité, son peuple trait dans un seau », deux « contes de deux fausses tribus », huit « un pain partagé par des frères », treize « une lune éblouissante », quinze « la pleine, les jours passés » — jusqu'à la fin du mois {cite:muruj-al-dhahab p. 512-513}."
  ur: "مہینے کی ہر رات چاند پر عربوں کے سوال و جواب کی لطائف - پہلی رات 'ایک دودھ پلانے والا بچہ، اس کے لوگوں نے ایک برتن میں دودھ پلایا'، دو 'دو جھوٹے قبیلوں کی کہانیاں'، آٹھ 'بھائیوں کی طرف سے تقسیم ہونے والی روٹی'، تیرہ 'ایک چمکتا ہوا چاند'، پندرہ 'پورے، گزرے ہوئے دن'۔ 512-513}۔"
