summary:
  ar: "القوي الفعل هو الذي للجائع على الريق، وخصوصاً من مزاج حار، ينفع من القوباء والطرفة والبياض، ويقتل الهوام كلها والحيّة والعقرب {cite:canon-ibn-sina-print-v1 p.413}."
  en: "The strongest saliva is that of a hungry person before eating, especially of a hot temperament. It helps ringworm, eye spots and white spots, and kills all vermin and snakes and scorpions {cite:canon-ibn-sina-print-v1 p.413}."
  fr: "Selon le livre, la salive la plus forte est celle d’une personne affamée avant de manger, surtout de tempérament chaud. Elle aiderait la teigne et les taches oculaires et blanches et tuerait petites bêtes, serpents et scorpions {cite:canon-ibn-sina-print-v1 p.413}."
  ur: "سب سے قوی اثر والا لعاب وہ ہے جو بھوکے کا خالی پیٹ ہو، خاص طور پر گرم مزاج کا۔ یہ دادی، آنکھ کے داغ اور سفید دھبوں میں مفید ہے، اور تمام موذی کیڑوں، سانپ اور بچھو کو مار دیتا ہے {cite:canon-ibn-sina-print-v1 p.413}۔"
  es: "La saliva más fuerte es la de una persona hambrienta antes de comer, especialmente si tiene un temperamento irascible. Ayuda a combatir la tiña, las manchas oculares y las manchas blancas, y mata a todos los parásitos, serpientes y escorpiones {cite:canon-ibn-sina-print-v1 p.413}."
