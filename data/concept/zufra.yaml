summary:
  ar: "الزوفرا نبات يشبه الجاوشير في أصله وساقه، حارّ يابس؛ يحلّل النفخ، وينفع المعدة وظلمة البصر، ويعالج الجرب والحكّة، وأصله وبزره يجففان المني، ويُذكر أنه يدرّ الطمث والبول، وينفع لسع العقارب والهوام. {cite:canon-ibn-sina-print-v1 p.466}"
  en: "Zufra is a plant resembling jawshir in root and stem, hot and dry. It dissolves flatulence, helps the stomach and darkness of the sight, and helps itch and scabies. Its root and seed dry semen; the book says it brings the menses and urine, and helps scorpion and vermin stings. {cite:canon-ibn-sina-print-v1 p.466}"
  ur: "زوفرا ایک پودا ہے جو جڑ اور تنے میں جاوشیر سے مشابہ ہے، گرم اور خشک؛ یہ ہوا کو تحلیل کرتا، معدے، بصارت کی تاریکی، خارش اور کھجلی میں مفید ہے۔ اس کی جڑ اور بیج منی کو خشک کرتے ہیں؛ کتاب کہتی ہے کہ یہ حیض اور پیشاب لاتا ہے، اور بچھو اور کیڑوں کے ڈنک میں مفید ہے۔ {cite:canon-ibn-sina-print-v1 p.466}"
  es: "Zufra es una planta parecida a jawshir en raíz y tallo, de naturaleza cálida y seca. Disuelve la flatulencia, ayuda al estómago y a la visión borrosa, y alivia la picazón y la sarna. Su raíz y semilla secan el semen; el libro dice que regula la menstruación y la micción, y ayuda con las picaduras de escorpiones y otros parásitos. {cite:canon-ibn-sina-print-v1 p.466}"
  fr: "Le Zufra est une plante ressemblant au jawshir par sa racine et sa tige; elle est chaude et sèche. Elle dissout les flatulences, soulage les troubles digestifs et la cécité, et aide à lutter contre les démangeaisons et la gale. Sa racine et ses graines asséchent le sperme; le livre dit qu’elle provoque les menstruations et la diurèse, et qu’elle est efficace contre les piqûres de scorpions et d’insectes. {cite:canon-ibn-sina-print-v1 p.466}"
  tr: "Hyssop, kök ve gövdesi bakımından galbanuma benzeyen, sıcak ve kuru bir bitkidir. Gazı giderir, mideye ve görme bulanıklığına iyi gelir, uyuz ve kaşıntıyı tedavi eder. Kökü ve tohumları meni kurutur. Ayrıca adet ve idrar söktürücü özelliği olduğu ve akrep ve böcek sokmalarına iyi geldiği söylenir. {cite:canon-ibn-sina-print-v1 s.466}"
  id: "Hyssop adalah tanaman yang mirip dengan galbanum dalam hal akar dan batangnya; tanaman ini panas dan kering. Tanaman ini meredakan perut kembung, bermanfaat untuk perut dan penglihatan kabur, serta mengobati kudis dan gatal-gatal. Akar dan bijinya mengeringkan air mani. Konon juga dapat melancarkan menstruasi dan buang air kecil, serta bermanfaat untuk sengatan kalajengking dan serangga. {cite:canon-ibn-sina-print-v1 p.466}"
