  tr: "Dur"
  id: "Berhenti"
summary:
  ar: "الوقف في اللغة الحبس، ومنه وقفت الدار حبستها في سبيل الله، ومنه المنع والسكون، ويُطلق على الشيء الموقوف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579} وفي الاصطلاح تعريفات متعددة: عند الحنفية حبس العين على حكم ملك الله تعالى وصرف منفعتها على من أحب عند الصاحبين، وعند أبي حنيفة حبس العين على حكم ملك الواقف والتصدق بالمنفعة؛ وعند المالكية إعطاء منفعة شيء مدة وجوده لازماً بقاؤه في ملك معطيه ولو تقديراً؛ وعند الشافعية حبس مال يمكن الانتفاع به مع بقاء عينه بقطع التصرف في رقبته على مصرف مباح موجود؛ وعند الحنابلة تحبيس مالك مطلق التصرف ماله المنتفع به مع بقاء عينه يُصرف ريعه إلى جهة بر تقرباً إلى الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579}\n\nالألفاظ ذات الصلة: التبرع ⁦(التطوع بالشيء دون عوض، وهو أعم من الوقف)⁩، والصدقة ⁦(تمليك في الحياة بغير عوض، وقد تُطلق على الوقف كما في حديث عمر في أرضه)⁩، والهبة ⁦(العطية بلا عوض)⁩، والعارية ⁦(إباحة الانتفاع بالعين مع بقاء ملكها للمعير)⁩، والوصية. والفرق بين الوقف والهبة أن الوقف تمليك المنفعة مع بقاء العين على ملك الله فلا يجوز التصرف فيها، والهبة تمليك للعين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581}\n\nالوصية: الحنفية تعريفها تمليك مضاف إلى ما بعد الموت، والشافعية نحو ذلك؛ والفرق بينها وبين الوقف أن الوصية تكون بعد الموت وقد تكون بالعين أو المنفعة، أما الوقف فتبرع في الحياة وبالمنفعة فقط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581}\n\nمشروعية الوقف: ذهب جمهور الفقهاء إلى مشروعيته ولزومه واعتباره من القُرَب المندوب إليها، واستدلوا بحديث ابن عمر في أرض عمر بخيبر وقول النبي له «إن شئت حبست أصلها وتصدّقت بها»، وبحديث «إذا مات الإنسان انقطع عنه عمله إلا من ثلاث...»، وبأثر جابر في أن من له مال من المهاجرين والأنصار حبس مالاً؛ وقال ابن قدامة إن ذلك إجماع من الصحابة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17582} ونقل ابن عابدين عن الإسعاف أن الوقف جائز عند أبي حنيفة وأصحابه، وأن الخلاف في اللزوم، فعند أبي حنيفة يجوز جواز العارية ولا يلزم إلا بحكم القاضي أو بإخراجه مخرج الوصية؛ ونقل ابن قدامة عن شريح أنه لم يره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17582} وفي الحكم التكليفي: الأصل أنه قربة مندوبة، وقد يكون فرضاً إن نُذر، ومباحاً إن كان بلا قصد القربة كوقف الذمي فلا ثواب له، وحراماً إن كان على معصية كالكنيسة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17582}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583} وذكر الكتاب أن بعض المالكية قالوا إن الوقف على البنين دون البنات حرام لشبهه بفعل الجاهلية، لكن ابن القاسم رأى الكراهة فيمضي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583}\n\nأركان الوقف: عند الجمهور ⁦(المالكية والشافعية والحنابلة)⁩ أربعة: الصيغة والواقف والموقوف عليه والموقوف، وعند الحنفية الركن الصيغة فقط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583} ولا ينعقد الوقف إلا بالإيجاب، واختلفوا في اشتراط القبول لانعقاده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583}\n\nصيغة الإيجاب: ما يدل على إرادة الواقف من لفظ أو إشارة مفهمة أو كتابة أو فعل. والألفاظ الصريحة عند المالكية والشافعية والحنابلة: «وقفت»، وكذا «حبست» عند المالكية والحنابلة والشافعية على الصحيح، و«سبّلت» عند الشافعية والحنابلة على الصحيح؛ ويصير الوقف بها دون زيادة لعرف الاستعمال، ولأن النبي قال لعمر «إن شئت حبست أصلها». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17584} والكناية: لفظ «تصدقت»، إلا أن يضيفه إلى جهة عامة كالفقراء وينوي الوقف عند بعض الشافعية، وكذا «حرّمت» و«أبّدت» عند الحنابلة والأصح عند الشافعية، ولا يحصل الوقف بها إلا بضم قرينة كقوله «صدقة موقوفة» أو «صدقة لا تُباع ولا توهب ولا تورث» أو نية الوقف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17584}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17585}\n\nإذا اجتمع في يد القيّم من غلة الوقف ما يصح صرفه في وجه من وجوه البر، كفكّ الأسرى المسلمين أو إعانة الغازي المنقطع، والوقف محتاج إلى الإصلاح، فإن لم يكن في تأخير الإصلاح إلى غلة السنة التالية ضرر بيّن يُخشى معه خراب الوقف، صُرفت الغلة إلى وجه البر وأُخّرت المرمة، وإن كان في التأخير ضرر بيّن صُرفت الغلة أولاً إلى المرمة ثم ما فضل إلى وجه البر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} وذكر ابن نجيم أن المتولي إذا صرف الغلة للمستحقين وهناك عمارة لا يجوز تأخيرها كان ضامناً، لأن ما يحتاج إليه الوقف من العمارة والمؤنة مستثنى من حق الفقراء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661}\n\nعند الحنفية إذا كانت العمارة ضرورية، كرفع سقف أو بناء جدار، قُدّمت على جميع جهات الصرف، لأنه ليس من النظر أن يخرب المسجد لأجل ما يُعطى للإمام والمؤذن؛ فإن فضل شيء عن التعمير أُعطي ما هو أقرب إلى الوقف مما في قطعه ضرر بيّن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} وإن لم تكن العمارة ضرورية، بحيث لا يؤدي تركها إلى خراب العين لو أُخّرت إلى غلة السنة القادمة، قُدّم الأهم فالأهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} وفرّق الحنفية بين أن يشترط الواقف تقديم العمارة كل سنة، فيُمسك القيّم كل سنة قدرها وإن لم تكن محتاجة الآن، وبين السكوت عنه، فلا تُدّخر العمارة عند عدم الحاجة إليها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} وإذا انهدم شيء من بناء الوقف وآلته صرفه الحاكم في عمارته، فإن كان التهيؤ للعمارة ثابتاً في الحال صُرف إليها، وإلا حُفظ حتى يتهيأ ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661}\n\nوعند الشافعية يُدّخر من زيادة غلة المسجد على حاجته، بتقدير هدمه، ويُشترى بالباقي عقار فيُوقف، لأن ذلك أحفظ له، ولا يُشترى من الموقوف على عمارته، لأن الواقف وقفه عليها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662}\n\nاختلف الفقهاء في الجهة التي يُنفق منها على الموقوف وعمارته. فالحنفية والمالكية يرون أن ذلك من غلة الوقف شرط الواقف أو لم يشرط، لأن الوقف صدقة جارية في سبيل الله لا تجري إلا بهذا الطريق، وقال المالكية إن شرط الواقف غير ذلك بطل شرطه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} وإذا وقف الواقف داره على سكنى ولده فالعمارة على من له السكنى من ماله لا من الغلة، إذ الغرم بالغنم، فإن امتنع أو عجز لفقره آجرها القاضي منه أو من غيره وعمّرها من أجرتها، ولا يُجبر الآبي على العمارة، وهو قول المالكية أيضاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} وقال المالكية إن الفرس الموقوف للغزو يُنفق عليه من بيت المال، فإن عُدم بيت المال بيع وعوض بثمنه سلاح ونحوه مما لا يحتاج إلى نفقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662}\n\nوذهب الشافعية والحنابلة إلى اتباع شرط الواقف. فعند الشافعية تكون النفقة ومؤنة التجهيز والعمارة من حيث شُرطت، وإلا فمن منافع الموقوف نفسه، ككسب العبد وغلة العقار، فإذا تعطلت منافعه فالنفقة ومؤنة التجهيز من بيت المال، أما العمارة فلا تجب على أحد، لأن العقار يشبه الملك المطلق، بخلاف الحيوان لصيانة روحه وحرمته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663} وعند الحنابلة يُرجع إلى شرط الواقف، فإن عيّن الإنفاق من غلته أو من غيرها عُمل به؛ فإن لم يعيّن وكان الموقوف ذا روح كالرقيق والخيل أُنفق عليه من غلته، فإن لم تكن له غلة فنفقته على الموقوف عليه المعيّن، فإن تعذر الإنفاق لعجزه بيع وصُرف ثمنه في عين أخرى تكون وقفاً، وإن أمكن إجارته أُجر بقدر نفقته. وإن كان الوقف على غير معيّن كالمساكين فنفقته في بيت المال، وإن كان الوقف عقاراً ونحوه لم تجب عمارته على أحد إلا بشرط الواقف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663}\n\nذهب الفقهاء إلى أن من تعدى على الوقف بهدم أو غيره ضمن. فعند الحنفية من آجر دار الوقف فجعل المستأجر رواقها مربطاً للدواب فخرّبها ضمن، لأنه فعل بغير إذن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663} وعند المالكية من هدم وقفاً تعدياً فعليه إعادته على ما كان عليه ولو كان المهدوم بالياً، والراجح عندهم أن عليه قيمته كسائر المتلفات، وهو ما ارتضاه ابن عرفة وشهره عياض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663} وعند الشافعية لا ضمان على من تلف في يده شيء من الكتب الموقوفة على طلب العلم بلا تعدٍّ، فإن تعدى ضمن، ومن التعدي استعماله فيما لم يُوقف له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663}\n\nإذا احتاج الموقوف إلى تعمير أو نفقة ولم تكفِ الغلة، فهل يجوز للناظر الاستدانة على الوقف، وهل يحتاج إلى إذن؟ ذهب المالكية والحنابلة والحنفية في قول إلى جواز ذلك للناظر من غير إذن الحاكم، كسائر تصرفاته، لأنه مؤتمن مطلق التصرف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} وقال المالكية إن من التزم حين أخذ النظر أن يصرف على الوقف من ماله إن احتاج لم يلزمه ذلك، وله الرجوع بما صرفه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} وعند الشافعية لا يجوز للناظر الاقتراض دون شرط الواقف أو إذن الإمام، ويجوز للإمام أن يقرض الناظر من بيت المال، أو يأذن له في الاقتراض، أو في الإنفاق من ماله على العمارة بشرط الرجوع؛ فإن اقترض بلا إذن ولا شرط لم يجز ولا يرجع بما صرفه لتعديه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664}\n\nوالمعتمد عند الحنفية أنه لا تجوز الاستدانة على الوقف إلا لمصلحته كالتعمير وشراء البذر، وتجوز بشرطين: إذن القاضي، فإن بَعُد عنه استدان المتولي بنفسه، وألا يتيسر إجارة العين والصرف من أجرتها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} وذكر ابن عابدين أن الاستدانة لا تجوز بغير أمر الواقف، لأن الدين لا يثبت ابتداءً إلا في الذمة، والوقف لا ذمة له، والفقراء وإن كانت لهم ذمة فلكثرتهم لا تتصور مطالبتهم، فلا يثبت الدين إلا على القيّم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} وترك القياس عند الضرورة، فالمختار عند أبي الليث أن الاستدانة تجوز بأمر القاضي إذا لم يكن من الاستدانة بد ولم يكن القاضي بعيداً عن المتولي، لأن ولايته أعم في مصالح المسلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} أما ما له منه بد، كالصرف على المستحقين، فلا تجوز الاستدانة لأجله، إلا ما يُعطى للإمام والخطيب والمؤذن، وكذا الحصير والزيت للمسجد على القول الراجح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664}\n\nوإذا لزم إذن القاضي فادعى المتولي الإذن، فالظاهر أنه لا يُقبل إلا ببينة وإن كان مقبول القول فيما في يده، لأنه يريد الرجوع في الغلة؛ فإن لم يستأذن حرم عليه الأخذ من الغلة، لأنه متبرع ما لم يوجد إذن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} وقال ابن عابدين إن المتولي إذا أنفق من ماله لإصلاح الوقف كان له الرجوع بذلك في غلته، وفي فتاوى الحانوتي أن له الرجوع ديانة، لكن لا يُقبل ادعاؤه ذلك إلا أن يُشهد أنه أنفق ليرجع، ويجب تقييد ذلك بما إذا كانت للوقف غلة، فإن لم تكن له غلة فلا بد من إذن القاضي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665}\n\nثانياً: بيع الموقوف والاستبدال به. إذا تعطّل الموقوف وصار بحال لا يُنتفع بها، أجاز الحنفية والمالكية والحنابلة والشافعية في رأي بيعه وجعل ثمنه في مثله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} وأجاز الحنفية البيع والاستبدال ولو لم يتعطل الموقوف، لكن بشروط خاصة، وفرّق المالكية بين العقار والمنقول في الجملة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665}\n\nللاستبدال عند الحنفية ثلاث صور. الأولى أن يشترط الواقف لنفسه أو لغيره استبدال أرض الوقف بأرض أخرى حين الوقف، وله صيغتان: الأولى أن يقول «أرضي هذه صدقة موقوفة لله أبداً على أن أبيعها وأشتري بثمنها أرضاً أخرى» فتكون الثانية وقفاً بشرائط الأولى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} وذهب أبو يوسف وهلال والخصاف إلى جواز الوقف والشرط استحساناً، وهو الصحيح على ما في فتاوى قاضيخان، لأن هذا الشرط لا يُبطل حكم الوقف، فالوقف يحتمل الانتقال من أرض إلى أخرى، والثانية تقوم مقام الأولى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} ومثال ذلك أن أرض الوقف إذا غصبها غاصب فأجرى عليها الماء حتى صارت بحراً لا تصلح للزراعة ضمن قيمتها واشترى بها أرضاً تكون وقفاً على شروط الأولى، وكذلك إذا قلّ ريعها لآفة ولم تفضل غلتها عن مؤنتها، فصلاح الوقف في الاستبدال، فيصح أن يشترط الواقف ولاية الاستبدال وإن لم تكن الضرورة قائمة في الحال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666}\n\nوقال محمد ويوسف بن خالد السمتي إن الوقف صحيح والشرط باطل، وهو القياس. ووجّه السرخسي قول محمد بأن هذا الشرط لا يؤثر في المنع من زوال الوقف، فيتم الوقف ويبقى الاستبدال شرطاً فاسداً باطلاً في نفسه، كالمسجد إذا شُرط الاستبدال به أو شُرط أن يُصلّى فيه قوم دون قوم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} وقال بعض فقهاء الحنفية إن الوقف والشرط فاسدان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} ونقل الكمال بن الهمام عن الأنصاري أن الشرط صحيح، لكن لا يُباع إلا بإذن الحاكم، وينبغي للحاكم إذا رُفع إليه ولا منفعة في الوقف أن يأذن في بيعه إذا رآه أنظر لأهل الوقف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666}\n\nولو شرط الواقف أن يبيع الأرض ويشتري بثمنها أرضاً أخرى ولم يزد صح استحساناً، وصارت الثانية وقفاً بشروط الأولى من غير تجديد وقف، لأن الأرض تعيّنت للوقف فيقوم ثمنها مقامها. والقياس البطلان، لأنه لم يذكر إقامة أرض أخرى مقام الأولى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} والصيغة الثانية: لو شرط أن للقيّم الاستبدال ولم يشرطه لنفسه كان له أن يستبدل لنفسه، لأن إفادة الولاية لغيره فرع كونه يملكها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667}\n\nولو شرط الاستبدال لرجل آخر مع نفسه، ملك الواقف الاستبدال وحده ولا يملكه الآخر وحده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} وإذا شرط الاستبدال جاز ولو كانت العين ذات ريع ونفع، إذ لا يلزم خروج الوقف عن الانتفاع، ولا مباشرة القاضي له، ولا عدم ريع يُعمَّر به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} وقيّد الحنفية الاستبدال بما اشترطه الواقف من قدر ونوع؛ فإن شرط الاستبدال بأرض لم يجز بدار، وإن شرط أرض قرية لم يجز بغيرها لتفاوت أراضي القرى مؤنة واستغلالاً، وإن لم يُقيّد البدل فله أن يستبدل من جنس العقارات بأي أرض أو دار أو بلد شاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} وإن شرط الاستبدال فليس له أن يستبدل الأرض الثانية بأرض ثالثة، لأن الشرط وجد في الأولى فقط، إلا أن يذكر عبارة تفيد ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667}\n\nالصورة الثانية: ألا يشترط الواقف الاستبدال حين الوقف، سواء شرط عدم الاستبدال أو سكت، لكن صار الوقف بحيث لا يُنتفع به بالكلية، بأن لا يحصل منه شيء أو لا يفي بمؤنته؛ فالاستبدال في هذه الصورة جائز على الأصح إذا كان بإذن القاضي ورأى فيه المصلحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} ونقل ابن عابدين عن البحر أن كلام قاضيخان اختلف، ففي موضع جوّز للقاضي الاستبدال بلا شرط من الواقف حيث رأى المصلحة، وفي موضع منع ذلك ولو صارت الأرض بحال لا يُنتفع بها. والمعتمد أنه يجوز للقاضي الاستبدال بالشروط الآتية: أ- أن يخرج الموقوف عن الانتفاع بالكلية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667}\n\nومن شروط الاستبدال عند الحنفية، كما ذكروا، ألا يكون البيع بغبن فاحش، وأن يكون للوقف ريع يُعمَّر به، وأن يكون المستبدل ممن يُعدّ من أهل العلم والعمل، لئلا يُتطرّق إلى إبطال أوقاف المسلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} وأن يكون البدل عقاراً لا دراهم ودنانير، وألا يُباع ممن لا تُقبل شهادته له أو ممن له عليه دين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} وأن يكون البدل والمبدل من جنس واحد؛ وقال ابن عابدين نقلاً عن قنالي زاده إن الظاهر أن اتحاد الجنس لا يُشترط في الموقوف للاستغلال، لأن المنظور فيه كثرة الريع وقلة المرمة والمؤنة، فلو استُبدل الحانوت بأرض تُزرع وتحصل منها غلة بقدر أجرة الحانوت كان أحسن، أما الموقوف للسكنى فالمقصود فيه الانتفاع بالسكن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} وفي القنية أن مبادلة دار الوقف بدار أخرى تجوز إذا كانت في محلة واحدة أو في محلة خير منها، ولا تجوز في العكس وإن كانت المملوكة أكثر مساحة وقيمة وأجرة، لاحتمال خرابها في المحلة الأدنى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668}\n\nونقل الكتاب عن شرح منظومة ابن وهبان في البحر الرائق سؤالاً: هل يجوز الاستبدال إذا شرط الواقف عدمه، أو كان الناظر معزولاً قبل الاستبدال؟ فقال الطرسوسي إنه لا نقل فيه، وإن مقتضى قواعد المذهب أن للقاضي أن يستبدل إذا رأى المصلحة فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} وروي عن محمد أنه إذا ضعفت الأرض الموقوفة عن الاستغلال، والقيّم يجد بثمنها أخرى أكثر ريعاً، جاز له بيعها وشراء ما هو أكثر ريعاً؛ ومن المشايخ من منع البيع والاستبدال تعطل الوقف أو لم يتعطل، وقال قاضيخان إن الوقف المرسل، أي الذي لم يُذكر فيه شرط الاستبدال، لا يجوز بيعه ولا الاستبدال به ولو كانت أرضه سبخة لا ينتفع بها، لأن سبيل الوقف أن يكون مؤبداً لا يُباع، وإنما تثبت ولاية الاستبدال بالشرط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669}\n\nالصورة الثالثة: ألا يشترط الواقف الاستبدال، وللوقف ريع وغلات ولم يتعطل، لكن في استبداله نفع في الجملة وبدله خير منه نفعاً وريعاً. قال ابن عابدين إن هذا لا يجوز استبداله على الأصح المختار، كما حرره قنالي زاده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} ونقل ابن عابدين عن الأشباه أنه لا يجوز استبدال العامر إلا في أربع مسائل: الأولى إذا شرط الواقف الاستبدال؛ والثانية إذا غصبه غاصب وأجرى عليه الماء حتى صار بحراً، فيضمن القيمة ويشتري المتولي بها أرضاً بدلاً؛ والثالثة إذا جحده الغاصب ولا بينة، وأراد دفع القيمة، فللمتولي أخذها ليشتري بها بدلاً؛ والرابعة إذا رغب فيه إنسان ببدل أكثر غلة وأحسن موقعاً، فيجوز على قول أبي يوسف وعليه الفتوى، وقال صاحب النهر إن ذلك معارض بقول صدر الشريعة: نحن لا نفتي بقول أبي يوسف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669}\n\nالاستبدال بالموقوف عند المالكية. يفرق المالكية بين العقار والمنقول في البيع والاستبدال. فأجازوا الاستبدال في المنقول إذا لم توجد جهة تنفق عليه وخيف هلاكه، أو تعطلت منافعه فصار لا ينتفع به فيما حُبس من أجله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} فالفرس الموقوف في سبيل الله كالغزو والرباط تكون نفقته في بيت المال، فإن عُدم بيت المال بيع وعوّض بدله سلاح ونحوه مما لا يحتاج إلى نفقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} ويُباع كل حبس منقول لا ينتفع به، كفرس أصيب بداء الكلب، أو ثوب يخلق، أو عبد يهرم، أو كتب تبلى؛ ويُجعل ثمنه في مثله إن أمكن، أو في شقص منه إن تعذر شراؤه كاملاً، فإن تعذر تُصدّق بالثمن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} ومن ذلك ذكور الحيوانات الموقوفة للغزو أو للنسل إذا فاض عن الحاجة أو كبرت الإناث حتى لا ينتفع بها، فتُباع ويُشترى بثمنها إناث صغار لتمام النفع، وتكون وقفاً كأصلها، كما ذكر الدردير في النعام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670}\n\nأما العقار فالمذهب عند المالكية أنه لا يُباع ولو خرب وصار لا ينتفع به، داراً كان أو حوانيت أو غيرها، ولا يُستبدل بمثله غير خرب؛ وقد روى أبو الفرج عن مالك أن الإمام إذا رأى البيع لمصلحة جاز أن يُجعل ثمنه في مثله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} وأجاز بعضهم معاوضة الربع الخرب، فقد نقل التاج والإكليل منع بيع ما خرب من ربع الحبس، وعلّل ابن الجهم ذلك بأنه يوجد من يُصلحه بإجارته سنين فيعود كما كان، واختُلف في معاوضة الربع الخرب بربع غير خرب؛ وقال ابن رشد: إن انقطعت منفعة القطعة جملة وعجز عن عمارتها وكرائها، فلا بأس بالمعاوضة بمكان يكون حبساً مكانها، بحكم من القاضي بعد ثبوت السبب وتحقق الغبطة للمعوّض عنه، ويُسجَّل ذلك ويُشهد به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670}\n\nوأجاز المالكية بيع العقار لضرورة توسعة مسجد جامع، سواء كان الوقف على معينين أو غير معينين. وقال ابن رشد إن ظاهر سماع ابن القاسم أن ذلك جائز في كل مسجد، وقول سحنون، وفي النوادر عن مالك وغيره أن ذلك في مساجد الجوامع إن احتيج إليه، لا في مساجد الجماعات؛ لأن الضرورة فيها ليست كالجوامع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} كما يجوز بيع الوقف لتوسعة مقبرة أو طريق لمرور الناس، ولو جبراً على المستحقين أو الناظر، ويجب على المستحقين أن يُجعل ثمنه في حبس غيره، ولا يجبرهم الحاكم على الجعل في حبس غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} وقال الشرح الصغير إن ما وُسّع به المسجد من الرباع يُدفع ثمنه إذا كان حبساً على معيّن، أما الحبس على غير معيّن كالفقراء فلا يلزم تعويضه، لأنه لم يتعلق به حق لمعيّن، ولأن ما يحصل من الأجر للواقف إذا دخل في المسجد أعظم مما قصده أولاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671}\n\nوقال المالكية إن اشترط الواقف التغيير والتبديل عُمل بشرطه، أما إذا شرط أنه إن وجد فيه ثمناً مرغوباً بِيع واشتُري غيره، فقد ذكرت النوادر والمتيطية أنه لا يجوز ذلك، فإن وقع مضى وعُمل بشرطه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} ونقل فتح العلي المالك واقعة: أرض موقوفة على سبيل في طريق المسلمين، شرط واقفها ألا تُباع ولا تُستبدل، ثم استبدل ناظر السبيل بها أرضاً من أراضي الديوان، فقال الدردير إن المبادلة باطلة حيث شرط الواقف عدم الاستبدال وأطلق، ويجب على الناظر رد أرض الديوان لصاحبها وأخذ أرض الوقف بعينها، ومن امتنع زجره الحاكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671}\n\nالاستبدال بالموقوف عند الشافعية. جاء في المهذب أنه إذا وقف مسجداً فخرب المكان وانقطعت الصلاة فيه لم يعد إلى الملك، ولم يجز التصرف فيه، لأن ما زال عنه الملك لحق الله تعالى لا يعود إلى الملك بالاختلال، كمن أعتق عبداً ثم زَمِن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} وقال الشربيني إن الأصح جواز بيع حصير المسجد الموقوفة إذا بليت، وجذوعه إذا انكسرت أو أشرفت على ذلك، ولم تصلح إلا للإحراق، لئلا تضيع ويضيق المكان بها، فتحصيل نزر يسير من ثمنها للوقف أولى من ضياعها، ولا تدخل بذلك في بيع الوقف لأنها صارت في حكم المعدوم، وهذا ما جرى عليه الشيخان.  {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} وقال الرافعي إن القياس أن يُشترى بثمن الحصير حصير لا غيرها، وقال الأذرعي إن المراد بذلك مقام التبن في الطين؛ أما الجذوع التي تصلح لغير الإحراق، كألواح وأبواب، فلا تُباع قطعاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672} وإذا خِيف على المسجد السقوط نُقض، وبنى الحاكم بنقضه مسجداً آخر إن رأى ذلك، وبناؤه بقربه أولى، ولا يُبنى به بئر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672} وإذا وقف على قنطرة فانحرق الوادي وتعطلت القنطرة، جاز نقلها إلى محل الحاجة؛ وغلة وقف الثغر إذا حصل فيه الأمن يحفظها الناظر لاحتمال عوده ثغراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672}\n\nوإن وقف نخلة فجفّت، أو بهيمة فزمنت، أو جذوعاً على مسجد فتكسرت، ففيه وجهان: الأصح عدم جواز البيع كما في المسجد، والثاني يجوز لأنه لا يُرجى نفعه. وإذا قيل بالبيع، فحكم ثمنه حكم القيمة التي توجد من متلف الوقف؛ فإن قيل إن الملك في رقبة الموقوف للموقوف عليه، كان الثمن له، وإن قيل إنه لله تعالى وهو الأظهر، اشتُري به مثله ليكون وقفاً مكانه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672} وقال أبو حامد الإسفراييني إن الثمن يُشترى به مثله ليكون وقفاً مكانه بلا خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672}\n\nالاستبدال بالموقوف عند الحنابلة. يجوز الاستبدال عندهم إذا لم يعد الوقف صالحاً للغرض الذي وقف من أجله ولا للانتفاع به، سواء كان منقولاً أو عقاراً، ومسجداً أو غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} فيحرم بيع الوقف ولا يصح، ولا تصح مناقلته ولو بخير منه نصاً، إلا أن تتعطل منافعه المقصودة بخراب ولم يوجد في ريعه ما يعمره فيُباع، أو تتعطل منافعه بغير خراب كخشب تشعث وخِيف سقوطه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} وإذا كان الوقف مسجداً وتعطل نفعه المقصود لضيقه على أهله، وتعذرت توسعته، أو لخراب محلته، أو لكون الموضع قذراً يمنع من الصلاة فيه، قال القاضي يصح بيعه ويُصرف ثمنه في مثله، لأن إبقاءه كذلك إضاعة للمال، وإنما يُستبقى الغرض في عين أخرى، واتصال الأبدال يجري مجرى الأعيان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} ويصح بيع شجرة موقوفة يبست، وجذع موقوف انكسر أو بلي أو خِيف انكساره أو هدمه؛ وقال في التلخيص إذا أشرف جذع الوقف على الانكسار، أو داره على الانهدام، وعُلم أنه لو أُخّر خرج عن كونه منتفعاً به، بِيع رعاية للمالية؛ والمدارس والربط والخانات المسبّلة إذا خربت يجوز بيعها عندهم على وجه واحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} والفرس الموقوف للغزو إذا لم يصلح له يُباع ويُشترى بثمنه فرس يصلح، وإذا اشتُري البدل صار وقفاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} وشرط الواقف عدم البيع فاسد. والذي يتولى البيع الحاكم إن كان الوقف على وجوه الخير كالمساكين والمساجد والقناطر، والناظر الخاص إن كان الوقف على شخص معيّن أو جماعة معيّنين، والأحوط ألا يفعل إلا بإذن الحاكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} وإذا اشتُري البدل لجهة الوقف صار وقفاً، والاحتياط أن يُوقف بصيغة جديدة حتى لا ينقضه من لا يرى وقفيته بمجرد الشراء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674}\n\nرجوع الوقف إلى ملك الواقف. ذهب محمد بن الحسن من الحنفية إلى أنه إذا خرب ما حول المسجد واستُغني عنه، ولو مع بقائه عامراً، أو خرب المسجد ولا ما يُعمَّر به واستُغني عنه ببناء مسجد آخر، عاد إلى ملك الباني إن كان حياً، وإلى ورثته إن مات، خلافاً لأبي يوسف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} وعلّل محمد ذلك بأن الواقف عيّن الوقف لنوع قربة وقد انقطعت فينقطع هو أيضاً، فصار كحصير المسجد وحشيشه إذا استُغني عنه، وقنديله إذا خرب المسجد، فيعود إلى ملك متخذه، كالكفن إذا افترسه السبع يعود إلى مالكه، وكهدي الإحصار إذا زال الإحصار فأدرك الحج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} وعند أبي يوسف يُنقل إلى مسجد آخر بإذن القاضي، فيُباع نقضه بإذنه ويُصرف ثمنه إلى بعض المساجد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} ويتفرع على الخلاف أنه إذا انهدم الوقف ولا غلة فيه تعمّره، عاد إلى الباني أو ورثته عند محمد، لكن عند محمد إنما يعود إلى الملك ما خرج عن الانتفاع المقصود للواقف بالكلية، كحانوت احترق ولا يُستأجر بشيء؛ وما كان معداً للغلة لا يعود إلى الملك إلا أنقاضه، وتبقى ساحته وقفاً تُؤجَّر ولو بشيء قليل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} وقال الشافعية في مقابل الأصح إن الموقوف إذا تعطلت منفعته بسبب غير مضمون، كأن جفت الشجرة أو اقتلعتها ريح أو سيل، ولم يمكن إعادتها إلى مغرسها قبل جفافها، انقطع الوقف وعاد ملكاً للواقف أو وارثه، أما الأصح عندهم فلا يعود ملكاً بل يبقى وقفاً، والحكم كذلك عند الحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675}\n\nالنظر على الوقف. اتفق الفقهاء على أن النظر على الوقف يتبع شرط الواقف، فإذا جعل النظر لشخص معيّن اتُّبع شرطه، كما فعل عمر بن الخطاب حين جعل وقفه إلى ابنته حفصة تليه ما عاشت، ثم إلى ذوي الرأي من أهلها، كما نقل ابن قدامة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675} واختلفوا إذا شرط الواقف النظر لنفسه: فعند الحنفية والشافعية والحنابلة يجوز ذلك، أما المالكية فإن لم يحُز الموقوف عليه الوقف بطل بموت الواقف أو مرضه أو فَلَسه، وإن حازه الموقوف عليه وشرط الواقف النظر لنفسه صح الوقف، وأُجبر الواقف على أن يجعل النظر لغيره، إذ لا يجوز له أن يجعله لنفسه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675}\n\nوإن لم يشترط الواقف ناظراً، فعند المالكية والحنابلة: إن كان الوقف على غير معيّن كالفقراء والمساكين والمساجد، ولّى الحاكم عليه من يشاء، لأنه لا يمكنه تولي النظر بنفسه. وإن كان على معيّن رشيد فهو الذي يتولى أمره، لأنه ملكه ونفعه له فكان نظره إليه كملكه المطلق، فإن كان غير رشيد تولّى أمره وليّه، وفي احتمال عند الحنابلة، اختاره ابن أبي موسى، أن ينظر فيه الحاكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675}\n\nعند الحنفية اختلف الأقوال في ولاية النظر إذا لم يشترطها الواقف. فعند أبي يوسف، وهو الأصل، أن الولاية للواقف، ثم لوصيّه إن كان له وصي، وإلا فللحاكم؛ وعند هلال، وهو ظاهر المذهب، أنها للواقف، ثم لوصيّه أو للحاكم، لأن المتولي إنما يستفيد الولاية من الواقف بشرطه، فيستحيل أن يكون له الولاية وغيره يستفيدها منه، ولأن الواقف أقرب الناس إلى الوقف فيكون أولى بولايته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} وعند محمد لا تكون الولاية للواقف ما لم يشترطها، لأن التسليم إلى القيّم عنده شرط لصحة الوقف، فإذا سُلّم لم يبق للواقف ولاية فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} وإن مات الواقف ولم يجعل ولايته لأحد، جعل القاضي قيّماً من أهل بيت الواقف ما وجد من يصلح، لأنه أشفق أو لأن قصد الواقف نسبة الوقف إليه، فإن لم يجد فمن الأجانب من يصلح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} وعند الشافعية إذا لم يشترط الواقف النظارة لأحد، فالنظر للقاضي على المذهب، لأن له النظر العام؛ وقيل النظر للواقف لأنه كان إليه فيبقى على نظره؛ وقيل للموقوف عليه لأن الغلة له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677}\n\nشروط الناظر. اشترط الفقهاء لصلاحية الناظر شروطاً منها ما اتفقوا عليه ومنها ما اختلفوا فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676}\n\nالشرط الأول: التكليف. يتفق الفقهاء على أن الناظر يشترط فيه البلوغ والعقل، فلا تصح تولية الصبي ولا المجنون لعدم أهليتهما، وذلك في الجملة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} فعند المالكية والحنابلة إن لم يشترط الواقف ناظراً معيّناً، وكان الموقوف عليه معيّناً كزيد وعمرو، تولى أمر الوقف بنفسه، فإن كان صغيراً أو مجنوناً فوليّه يقوم مقامه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} وقال الحنابلة إن الملك في الموقوف ينتقل إلى الموقوف عليه إن كان آدمياً معيّناً أو جمعاً محصوراً، وينظر فيه إن كان رشيداً مكلفاً، أو وليّه إن كان صغيراً أو مجنوناً أو سفيهاً، وقال ابن أبي موسى ينظر فيه الحاكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677}\n\nوعند الحنفية نقل ابن عابدين عن الإسعاف أن التولية للصبي تبطل في القياس مطلقاً، وفي الاستحسان تبطل ما دام صغيراً، فإذا كبر كانت له الولاية؛ وقال الشلبي إن الإسناد للصغير لا يصح بحال، لأن النظر ولاية والصغير مولّى عليه فلا يولّى على غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} ورأى ابن عابدين في فتاوى رشيد الدين أن القاضي إذا فوّض التولية إلى صبي جاز إذا كان أهلاً للحفظ، وحمل ما في الإسعاف على من لا يقدر على التصرف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} وكما يمنع الجنون التولية ابتداءً يمنعها بقاءً، فلو جُنّ الناظر عُزل؛ ونقل ابن عابدين عن الفتح أن الناظر ينعزل بالجنون المطبق سنة لا أقل، فإن برئ عاد إليه النظر، قال في النهر إن هذا في المشروط له النظر، أما منصوب القاضي فلا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} ونص الشافعية على أن الجنون تنسلب به الولايات، وقال الشبراملسي إن المجنون إذا أفاق تعود إليه ولاية النظارة بنفس الإفاقة إذا كانت بشرط الواقف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678}\n\nالشرط الثاني: العدالة. يُشترط في ناظر الوقف أن يكون عدلاً، وفي ذلك تفصيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} فالحنفية اختلفوا في كونها شرط صحة أو شرط أولوية؛ فقال الإسعاف لا يُولّى إلا أمين قادر بنفسه أو بنائبه، لأن ليس من النظر تولية الخائن، ورأى ابن عابدين أن العدالة شرط أولوية لا شرط صحة، وأن الناظر إذا فسق استحق العزل ولا ينعزل، كالقاضي إذا فسق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679}\n\nوعند المالكية تُعتبر العدالة إذا كان الناظر منصوباً من القاضي أو من الواقف، فالنظر في الحبس لمن يجعله إليه الواقف، لمن يُوثق بدينه وأمانته؛ فإن كان الناظر سيئ النظر غير مأمون عزله القاضي، إلا أن يكون الموقوف عليه مالكاً أمر نفسه ويرضى به. وذكر القرافي أن القاضي لا يعزل ناظراً إلا بجنحة، وللواقف عزله ولو بغير جنحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678}\n\nوعند الشافعية تُشترط العدالة الظاهرة والباطنة في المنصوب من الحاكم، وقال السبكي ينبغي أن يُكتفى في المنصوب من الواقف بالعدالة الظاهرة، وقال الأذرعي تُشترط الظاهرة والباطنة فيه أيضاً، ورجّح الشربيني الخطيب الأول. وإذا فسق الناظر انعزل، فالنظر للحاكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} وقال الشافعية إن الناظر إذا فسق ثم صار عدلاً، عادت إليه الولاية إن كانت مشروطة في أصل الوقف منصوصاً عليها بعينها، وإلا فلا، أفتى بذلك النووي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} وقال الحنابلة إنه إذا كان النظر لغير الموقوف عليه، وكانت التولية من الحاكم، أو من ناظر أصلي، فلا بد من العدالة لأنها ولاية على مال، كالولاية على مال اليتيم؛ فإن لم يكن عدلاً أُزيلت يده حفظاً للوقف، فإن عاد إلى أهليته عاد حقه. وإن كان الناظر مشروطاً من الواقف فلا تُشترط فيه العدالة، ويُضم إلى الفاسق عدل، لأن مراعاة حفظ الوقف أهم من إبقاء ولاية فاسق، وإن كان النظر للموقوف عليه عدلاً كان أو فاسقاً فهو أحق به، وقيل يُضم إليه أمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680}\n\nالشرط الثالث: الكفاية، أي قوة الشخص وقدرته على التصرف فيما ينظر فيه. نص الشافعية والحنابلة على اشتراطها، لأن حفظ الوقف مطلوب شرعاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} فإن اختلت الكفاية، قال الشافعية ينزع الحاكم النظر من الناظر وإن كان مشروطاً له، وقال النووي إن زال الاختلال عاد نظره إن كان مشروطاً منصوصاً عليه بعينه. وقال الحنابلة إن اختلت الكفاية لا يُعزل الناظر، بل يُضم إليه أمين قوي ليحصل المقصود. أما الحنفية فقالوا يُعزل الناظر وجوباً إذا كان غير مأمون أو عاجزاً؛ وكلام المالكية يفيد اشتراط الكفاية أيضاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680}\n\nالشرط الرابع: الإسلام. قال الحنابلة يُشترط الإسلام في الناظر إن كان الموقوف عليه مسلماً، أو كانت الجهة كالمسجد، استناداً إلى سورة النساء، آية ١٤١، التي يستدل بها الحنابلة على هذا الشرط، فإن كان الوقف على كافر معيّن جاز أن يكون الناظر كافراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680} وأجاز الحنفية أن يكون الناظر ذمياً، ولا يشترطون الإسلام؛ فلو عزله القاضي لسبب ثم أسلم لم تعد إليه الولاية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680} وقال الرملي إن القياس على الوصية والنكاح صحة تولية الذمي للنظر إذا كان الموقوف عليه ذمياً وعدلاً في دينه، لكن يُرد ذلك باشتراط العدالة الحقيقية في باب الوقف، وقال الشبراملسي إن الرد هو المعتمد؛ وفرّق بينه وبين تزويج الذمي موليته بأن ولي النكاح يحمله وازع طبيعي على الحرص على تحصين موليته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17681}\n\nأجرة ناظر الوقف. تشمل المسألة أحقية الناظر في الأجرة، وتقديرها من الواقف أو القاضي، ومقدارها، وهل يستحق أجراً إذا لم يجعل له أحد أجراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17681} أ- أحقية الناظر: ذهب الفقهاء إلى أن الناظر يستحق أجرة نظير قيامه بإدارة الوقف والعناية بمصالحه. واستدلوا بقول عمر حين وقف أرضه بخيبر، إن على من يليها أن يأكل بالمعروف أو يُطعم صديقاً غير متمول فيه، وبفعل علي حين جعل نفقة العبيد الذين وقفهم ليقوموا بعمارتها من الغلة، وبالقياس على عامل الزكاة، وبحديث «ما تركت بعد نفقة نسائي ومؤنة عاملي فهو صدقة»، وقال ابن حجر إن مراد العامل فيه القيّم على الأرض، فيدل على مشروعية أجرته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682}\n\nب- تقدير الأجرة. إما أن تكون مشروطة من الواقف، فيأخذ الناظر ما شرطه ولو زاد على أجر المثل، وهذا قول الحنفية والشافعية والحنابلة؛ فعند الحنفية إن عيّن الواقف أقل من أجر المثل كمّل القاضي له أجر المثل بطلبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} وعند الشافعية إن جعل الواقف النظر لنفسه وشرط لنفسه أجراً لم يزد على أجرة المثل، فإن شرط أكثر لم يصح الوقف لأنه وقف على نفسه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} وقال الحنابلة إن شرط الواقف للناظر أجرة مقدرة، فإن كانت بقدر أجرة المثل اختص بها، وإن كانت أكثر فكلفة ما يحتاجه الوقف من أمناء وغيرهم تُصرف من الزيادة حتى يبقى له أجر مثله، إلا أن يكون الواقف شرطه له خالصاً. أما المالكية فلم يحددوا شيئاً وتركوا ذلك لتقدير الواقف أو القاضي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682}\n\nوإن لم يعيّن الواقف أجراً، فالأجر يقدّره القاضي: فعند الحنفية والحنابلة لا يزيد المقدَّر عن أجرة المثل، فإن عيّن زائداً مُنع عنه الزائد. وقال المالكية يُترك الأمر لاجتهاد القاضي، وقال ابن فتوح يجوز للقاضي أن يجعل لمن قدّمه للنظر رزقاً معلوماً في كل شهر باجتهاده بحسب عمله، وفعله الأئمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} وقال الشافعية إن لم يذكر الواقف للناظر أجرة فلا أجرة له على الصحيح، وليس له أن يأخذ شيئاً من مال الوقف، فإن فعل ضمن ولم يبرأ إلا بتسليمه إلى الحاكم، وهذا المعتمد. وإن رفع الناظر الأمر إلى القاضي ليقرر له أجرة، فهو كالوليّ إذا رفع أمر حفظ مال الطفل إلى القاضي؛ وذكر العراقي أن مقتضاه أنه يأخذ الأجرة مع الحاجة، إما قدر النفقة كما رجّحه الرافعي، أو الأقل من نفقته وأجرة مثله كما رجّحه النووي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683}\n\nج- إذا لم يعيّن الواقف أجراً للناظر. قال الرملي من الحنفية إن الناظر لا يستحق شيئاً إلا إذا جعل له القاضي أجرة مثل عمله. وحرر ابن عابدين أن الواقف إن عيّن شيئاً للناظر فهو له كثيراً كان أو قليلاً، عمل أو لم يعمل، ما لم يشترطه في مقابلة العمل؛ وإن لم يعيّن الواقف وعيّن القاضي أجرة مثله جاز، وإن عيّن أكثر مُنع الزائد، وإن لم يعمل فلا يستحق أجرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} وإن نصبه القاضي ولم يعيّن له شيئاً، فإن كان المعهود ألا يعمل إلا بأجرة مثله فله أجرة المثل، لأن المعهود كالمشروط، وإلا فلا شيء له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} وذكر ابن نجيم عن القنية رأيين للحنفية في منصوب القاضي إذا لم يعيّن له أجرة: الأول أنه لا شيء له ولو سعى فيه سنة، والثاني أن القيّم يستحق مثل أجر سعيه، شُرط له أجر أو لم يُشترط، لأنه لا يقبل القوامة ظاهراً إلا بأجر، والمعهود كالمشروط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683}\n\nوعند الشافعية إذا لم يشرط الواقف للناظر شيئاً فلا يستحق أجرة على الصحيح، فإن رُفع الأمر إلى الحاكم أُعطي عند الحاجة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17684} وعند الحنابلة ثلاثة آراء: الأول أن للناظر أن يأكل من غلة الوقف بالمعروف، محتاجاً كان أو غير محتاج، إلحاقاً له بعامل الزكاة، وهو ما ذهب إليه أبو الخطاب؛ والثاني أن له أن يأخذ الأقل من أجر المثل أو كفايته، قياساً على ولي اليتيم، ولا يستحق هذا إلا إذا كان فقيراً؛ والثالث أن للناظر المشهور بأخذ الأجر على عمله حقاً في أجر المثل، وهو قياس المذهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17684} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} وظاهر كلام المالكية أن القاضي يجعل للناظر أجرة في الأحباس، أو رزقاً معلوماً في كل شهر باجتهاده بحسب عمله، كما قال ابن فتوح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17684}\n\nجهة الأجرة. ذهب جمهور الفقهاء، وهم الحنفية والمالكية، ما عدا ابن عتاب، والشافعية والحنابلة، إلى أن ما يستحقه الناظر من أجر، مشروطاً من الواقف أو مقدراً من القاضي، يكون من غلة الوقف، واستدلوا بقول عمر حين وقف أرضه: لوالي هذه الصدقة أن يأكل منها غير متأثل مالاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} وقال ابن عتاب من المالكية إن أجر الناظر لا يكون إلا من بيت المال، فإن أُخذ من الأحباس رُدّ وأُخذ من بيت المال، فإن لم يُعط منها فأجره على الله؛ وعلّل الحطاب ذلك بأن الأحباس لا يُغيَّر لها شيء لأنها للوصايا، وأفتى بمثل قوله ابن ورد، لكن الدسوقي ضعّف قول ابن عتاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685}\n\nالعمل الذي يستحق به الناظر الأجرة. هو حفظ الوقف وعمارته وإيجاره وتحصيل ريعه من أجرة أو زرع أو ثمر، والاجتهاد في تنميته، وصرفه في جهاته من عمارة وإصلاح وإعطاء المستحقين، لأن ذلك هو المعهود. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} وتكون الأجرة من وقت ولايته، لأنها في مقابل العمل فلا تُستحق إلا بقدره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} وقال الحنابلة إن الناظر إذا فرّط سقط من معلومه بقدر ما فوّته على الوقف من العمل الواجب، فيوزع المقدر على ما عمله وما لم يعمله ويسقط قسط ما لم يعمله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} وقال الحنفية إن أهل الوقف إذا نازعوا القيّم وقالوا إن الواقف جعل الأجر في مقابلة العمل وهو لا يعمل شيئاً، فلا يكلفه الحاكم من العمل ما لا يفعله الولاة؛ فإن حلّت به آفة يمكنه معها الأمر والنهي والأخذ والإعطاء فله الأجر، وإلا فلا أجر له. ولو جعل الواقف له أكثر من أجر المثل جاز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685}\n\nومن مسائلهم: لو وقف أرضه على مواليه ثم مات، فجعل القاضي للوقف قيّماً وجعل له عشر الغلة، وفي الوقف طاحون في يد رجل بالمقاطعة لا يحتاج فيها إلى قيّم، والمستحقون يقبضون غلتها منه، فلا يستحق القيّم عشر غلتها، لأن ما يأخذه بطريق الأجرة، ولا أجرة بدون عمل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685}\n\nمحاسبة ناظر الوقف. من وظيفة الناظر تحصيل غلة الوقف والإنفاق منها على ما يحتاجه الوقف والصرف إلى المستحقين، ويتفق الفقهاء على محاسبته على ما ينفقه، سواء من القاضي أو من المستحقين، لكنهم يختلفون في قبول قوله في الإنفاق دون بينة، وفي قبوله مع اليمين إن لم تكن بينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685}\n\nقال الحنفية إنه لا يلزم القاضي أن يحاسب المتولي تفصيلاً على كل ما صرفه من غلات الوقف، بل يكتفي منه بالإجمال إن كان معروفاً بالأمانة، أما إن كان متهماً فإن القاضي يجبره على التفسير شيئاً فشيئاً، ولا يحبسه، بل يحضره يومين أو ثلاثة ويخوّفه، فإن فسّر وإلا اكتفى منه باليمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} ونقل الدر عن القنية أن القاضي إن اتهمه حلّفه، ولو كان أميناً، كالمودع يدعي هلاك الوديعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} وتباينت أقوال الحنفية فيما لو ادعى المتولي الدفع إلى المستحقين: فقال الدر إنه يُقبل قوله بلا يمين، وخالف الإسعاف والبحر، فقال الإسعاف إن قال المتولي قبضت الأجرة ودفعتها إلى المستحقين وأنكروا، كان القول قوله مع يمينه، كالمودَع إذا ادعى رد الوديعة، ويبرأ مستأجر عقار الوقف من الأجرة لاعتراف المتولي بقبضها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} ونقل ابن عابدين عن الخير الرملي أن الفتوى على أنه يحلف في هذا الزمان؛ وفي الفتاوى الحامدية عن أبي السعود أن المتولي إن كان مسرفاً مبذراً لا يُقبل قوله بصرف مال الوقف بيمينه، وعن الشلبي أن من اتصف بصفات مخالفة للشرع صار بها فاسقاً لا يُقبل قوله فيما صرفه إلا ببينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686}\n\nوأما قبول قول الناظر الثقة بعد العزل، فذكر الحموي أن ظاهر كلامهم القبول، لأن العزل لا يخرجه عن كونه أميناً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687} ونقل صاحب الدر عن المنلا أبي السعود تفصيلاً: إن ادعى المتولي الدفع من غلة وقف على أولاده أو أولاد أولاده قُبل قوله، وإن ادعى الدفع لأرباب الوظائف كالإمام والمؤذن لم يُقبل، كمن استأجر شخصاً للبناء في الجامع بأجرة معلومة ثم ادعى تسليمها له، وقد استحسن التمرتاشي هذا التفصيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687}\n\nوقال المالكية إن مات الواقف وعُدم كتاب الوقف، قُبل قول الناظر في الجهات التي يصرف عليها إن كان أميناً، ما لم يكن للوقف شهود في أصله فلا يصرف إلا باطلاعهم. وإن ادعى أنه صرف من ماله على الوقف صُدّق بلا يمين إن لم يكن متهماً، وإلا حلف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687} وذكر الحطاب واقعة سُئل فيها السيوري عن إمام مسجد ومؤذنه ومتولي أموره، اتهمه محتسب بعد أعوام بفضلة في غلة حوانيت، فقال المتولي إنه لم يفضل شيء، فأجاب السيوري بأن القول قوله فيما زعم أنه أخرجه إذا كان يشبه ما قال، وقال البرزلي إن ذلك ما لم يُشترط عليه دخل وخرج بإشهاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687}\n\nوفرّق الشافعية بين أن يكون المستحقون معيّنين كزيد وعمرو، فالقول قولهم ولهم مطالبة الناظر بالحساب، وبين أن يكونوا غير معيّنين كالفقراء، فهل للإمام مطالبته بالحساب؟ وجهان أوجههما الأول، ويُصدَّق في قدر ما أنفقه عند الاحتمال، فإن اتهمه الحاكم حلّفه؛ والمراد إنفاقه فيما يرجع إلى العادة، وفي معناه الصرف إلى الفقراء ونحوهم من الجهات العامة، بخلاف إنفاقه على الموقوف عليه المعيّن فلا يُصدَّق فيه لأنه لم يأتمنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688}\n\nوفرّق الحنابلة بين الناظر المتبرع بنظره وغيره، وهو الذي يأخذ أجراً؛ فيُقبل قول المتبرع في الدفع لمستحق، وإن لم يكن متبرعاً لم يُقبل قوله إلا ببينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688} وقال البهوتي والمرداوي إنه لا اعتراض لأهل الوقف على من ولاه الواقف إذا كان أميناً، ولهم مساءلته عما يحتاجون إلى عمله، ولولي الأمر أن ينصب ديواناً يستوفي حساب أموال الأوقاف عند المصلحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688}\n\nعزل ناظر الوقف ومن له حق العزل. سبق بيان شروط الناظر وحكم عزله إذا اختل شرط منها؛ وفيما يلي من له حق العزل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688}\n\nأولاً: حق الواقف في العزل. الشافعية والحنابلة يفرّقون بين أن يشترط الواقف النظر لنفسه في ابتداء الوقف ثم يسنده إلى غيره، وبين أن يشترطه لغيره من البداية. فإن شرطه لنفسه ثم أسنده إلى غيره، فله عزله ونصب غيره، لأن ذلك نائب عنه، كما يعزل الموكل وكيله؛ وهذا الصحيح عند الشافعية، والصحيح عند الحنابلة على تصحيح الفروع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688} ونبه الشربيني الخطيب إلى أن مقتضى ذلك أن للواقف العزل بلا سبب، وصرّح به السبكي، وأفتى كثير من المتأخرين، منهم ابن رزين، بأنه لا يجوز العزل بلا سبب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17689} وفي وجه عند الشافعية والحنابلة ليس له العزل، لأن ملكه قد زال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17689}\n\nأما إذا شرط الواقف النظر لشخص حال الوقف، فليس له عزله ولو لمصلحة عند الشافعية، لأنه لا نظر له بعد أن شرطه لغيره؛ ولذلك لو عُزل الناظر المشروط نفسه أو فسق، فتولية غيره إلى الحاكم لا إلى الواقف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17689} وقال الحنابلة إن شرط الواقف النظر لغيره وشرط أن له عزله، كان له عزله، وإلا فلا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17689}\n\nوعند الحنفية يرى محمد بن الحسن أنه لو شرط الواقف أن تكون الولاية له ولأولاده في تولية القوّام وعزلهم والاستبدال، وسلّم الوقف إلى المتولي، جاز ذلك وكان له العزل؛ وإن لم يشترط لنفسه ولاية العزل فليس له عزله بعد تسليم الولاية، لأنه قائم مقام أهل الوقف، وقال الصدر الشهيد إن الفتوى على قول محمد. وقال ابن عابدين إن ذلك مبني على الخلاف في اشتراط التسليم إلى المتولي، فهو شرط عند محمد، أما عند أبي يوسف فالولاية ثابتة للواقف سواء شرط ذلك أو لم يشرطه، لأن التسليم ليس شرطاً عنده، وهو قول هلال وظاهر المذهب، وإذا ولّى الواقف غيره كان وكيلاً عنه وله عزله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690} قال الرملي إن هذا صريح في جواز العزل بجنحة وبغيرها، لأنه وكيل وللموكل عزل الوكيل مطلقاً؛ وقال الدر إن الفتوى على قول أبي يوسف، وقال البحر إن مشايخ بلخ يفتون بقوله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690}\n\nوعند المالكية لا يجوز أن يشترط الواقف النظر لنفسه، وإنما يتبع شرطه في تعيين الناظر، فإن شرط أن يكون فلان ناظراً لم يجز العدول عنه. وقال البدر القرافي إن للواقف عزله ولو لغير جنحة، ونص ابن عرفة على أن المحبس له عزل من رأى له أهلاً واستبداله، وقال الحطاب إن من حبس شيئاً وجعله على يد غيره ثم أراد عزله ليس له ذلك إلا بموجب يظهر، كالقاضي إذا قدّم أحداً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690}\n\nثانياً: حق القاضي في العزل. للقاضي الولاية العامة، فيثبت له عزل الناظر المشروط له النظر من قبل الواقف إذا ثبتت خيانته، أو لم يتوفر فيه شرط من الشروط السابقة، ولا يجوز له عزله بلا سبب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690} أما إذا كان القاضي هو الذي أسند إليه النظارة، فذهب المالكية والشافعية وبعض الحنفية إلى أنه لا يجوز عزل من ولاه القاضي إلا بسبب كخيانة أو غيرها، وعند الحنابلة وبعض الحنفية يجوز عزل الناظر بلا خيانة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690}\n\nتعدد نظار الوقف. يجوز أن يكون للوقف ناظر واحد أو أكثر كما نص الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690} فإن أسند الواقف النظر لاثنين، فعند الشافعية والحنابلة وأبي حنيفة لا يصح تصرف أحدهما مستقلاً عن الآخر، لأن الواقف لم يرض برأي أحدهما، إلا إذا شرط لكل واحد النظر فيصح تصرف كل منهما منفرداً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17691} ولو جعل عمارة الوقف لواحد وتحصيل ريعه للآخر صح، ولكل منهما ما شرطه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17691} وعند أبي يوسف يجوز أن ينفرد كل من الناظرين بالتصرف، وقال الحنفية إن جعل الواقف النظر لرجل ثم جعل وصياً لآخر كانا ناظرين شريكين، إلا أن يخصص كل منهما بما فُوّض إليه في مجلس واحد، فينفرد كل منهما بما فُوّض إليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17691}\n\nولو جعل الواقف النظر لأفضل أولاده وكانوا سواء في الفضل فلا يشتركون فيه، وإنما يكون لأكبرهم سناً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} وإذا قبل أحد الناظرين وردّ الآخر، أو مات أحدهما، أو قام به مانع، أقام الحاكم مقامه آخر، وهو قول الحنفية والشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} وعند الشافعية إذا شرط الواقف أن يكون الناظر الأرشد من أولاده، فادعى كل منهم الأرشدية، اشتركوا في النظر إن وُجدت الأهلية فيهم، ولا يستقل أحد منهم بالتصرف، لأن الأرشدية سقطت بتعارض البينات وبقي أصل الرشد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17691}\n\nتفويض الناظر النظر لغيره. لا يجوز للناظر أن يفوّض النظر إلى من أراد أو يوصي به إلى غيره، إلا إذا جعل له الواقف ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} قال الحنفية إن كان تفويض الواقف للمتولي عاماً، أي أقامه مقام نفسه وجعل له أن يسند النظر ويوصي به إلى من شاء، جاز له التفويض في صحته وفي مرض موته المتصل بالموت؛ وإن لم يكن عاماً، فلا يصح التفويض في الصحة، ويصح في مرض الموت لأنه بمنزلة الوصي، وللوصي أن يوصي إلى غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} وقال الشافعية إن الواقف إذا جعل النظر لفلان وله أن يفوض النظر إلى من أراد، فالمذهب أن نظر المفوِّض يزول، فليس للواقف ولا للمفوَّض إليه عزل المفوَّض إليه، ولا يعود النظر إلى المفوِّض بعد موته، لأن التفويض بمثابة التمليك؛ والرأي الثاني، وهو للسبكي، أن المفوَّض إليه وكيل عن المفوِّض، فإن مات المفوِّض عاد النظر إليه، وإن مات المفوَّض إليه عاد النظر إلى المفوِّض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17693} وقال الحنابلة إن الناظر المشروط له النظر إن كان موقوفاً عليه، فله نصب وكيل عنه وعزله، لأصالة ولايته، وإن لم يكن موقوفاً عليه فليس له نصب ناظر ولا الوصية بالنظر ما لم يُشترط له ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17693}\n\nانتهاء الوقف. من صور انتهاء الوقف عودة الموقوف إلى ملك الواقف، سواء بسبب تعطل الموقوف وخرابه وعدم صلاحيته للانتفاع، أو بسبب الوقف على جهة تنقطع، أو بالنسبة للوقف المؤقت الذي أجازه المالكية، وقد ذُكرت هذه المسائل في ثنايا البحث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17693}"
  en: "Waqf, lexically, is detention: to hold back a thing in God's way; it also means prevention and stillness, and the word names the thing held. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579} Technically the jurists define it in several ways: for the Hanafi companions, the detention of a thing in God's ownership with its use given to whom the founder wishes; for Abu Hanifa, its detention in the founder's ownership with the use given as charity; for the Malikis, the grant of the use of a thing for as long as it exists, the ownership remaining with the grantor even notionally; for the Shafi'is, the detention of property whose use can be had with its substance kept, the disposal of its ownership cut off, for a lawful and existing purpose; for the Hanbalis, the detention by an owner of his property whose use is kept in its substance, with its income given to a charitable purpose seeking God's favour. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579}\n\nRelated words: tabarru' (giving without return, wider than waqf), sadaqa (gift in life without return, which may also name waqf, as in 'Umar's land), hiba (gift without return), 'ariya (the permission to use a thing while its owner keeps it), and wasiyya. The difference from a gift is that waqf transfers the use while the substance stays in God's ownership and cannot be disposed of, whereas a gift transfers the thing itself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581}\n\nWasiyya: the Hanafis define it as a transfer of ownership attached to what comes after death, and the Shafi'is similarly. It differs from waqf: a bequest takes effect after death and may be of the thing or of its use, while waqf is a gift made in life and only of the use. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581}\n\nThe legality of waqf: the majority of jurists hold it lawful, binding and a recommended act of devotion, citing the report of Ibn 'Umar that 'Umar got land at Khaybar and the Prophet told him, if he wished, to hold back its substance and give its produce in charity; the saying that when a man dies his deeds end except for three, among them continuing charity; and the report of Jabir that every wealthy man among the emigrants and the helpers held back property in endless charity. Ibn Qudama calls this consensus of the Companions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17582} Ibn 'Abidin, quoting al-Is'af, says waqf is lawful according to Abu Hanifa and his companions; the disagreement is about its binding character: for Abu Hanifa it is like a loan of use, with the ownership remaining with the founder, binding only by a judge's ruling or when made as a bequest. Ibn Qudama reports Shurayh as not accepting it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17582} On its legal ruling: it is basically a recommended act of devotion; it becomes obligatory when vowed; it is permitted when not made for the sake of devotion, as a dhimmi's waqf, which has no reward; and forbidden when it serves sin, as an endowment for a church. The Malikis mention that an endowment only for sons and not daughters is forbidden as resembling the custom of the pre-Islamic age, but Ibn al-Qasim preferred disliking it and enforcing it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17582}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583}\n\nThe pillars of waqf: the majority (Malikis, Shafi'is, Hanbalis) count four: the formula, the founder, the beneficiary and the thing endowed; the Hanafis count only the formula. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583} Waqf is not valid without an offer, and the jurists differ on whether acceptance is required. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583}\n\nThe formula of offer: whatever shows the founder's intent by word, a clear sign, writing or act. The express words are 'I endowed' (waqaftu), which the Malikis, Shafi'is and Hanbalis hold express, and 'I detained' (habastu), express for the Hanbalis, the Maliki view and the sounder Shafi'i view, and 'I made a way' (sabbaltu), express for the Shafi'is and Hanbalis in the sounder view, since custom has fixed their use and the Prophet's words to 'Umar use the same. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17584} The allusive words are 'I gave in charity' (tasaddaqtu), which the Hanbalis and Malikis count allusive, and which the Shafi'is count express when it is joined to a general beneficiary such as the poor, and otherwise allusive; also 'I forbade' and 'I made eternal', allusive for the Hanbalis and the sounder Shafi'i view; they make a waqf only when joined to a clear sign, such as 'a charity endowed', 'a charity never to be sold, given or inherited', or when intention is added. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17584}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17585}\n\nWhen the administrator holds, from the endowment's income, a sum that may properly go to a work of charity, such as ransoming Muslim captives or aiding a stranded fighter, and the endowment needs repair, then: if delaying repair until next year's income causes no clear harm that threatens the endowment's ruin, the income goes to the charity and repair is postponed; if the delay causes clear harm, the income goes first to repair and only the surplus to the charity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} Ibn Najim states that an administrator who pays the beneficiaries while repair that cannot be delayed is due becomes liable, because the upkeep the endowment needs is excluded from the poor's right. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661}\n\nFor the Hanafis, where repair is necessary, such as raising a roof or building a wall, it takes precedence over all other uses, since it is not proper care to let a mosque fall into ruin for the sake of what is given to the imam and the muezzin; any surplus over the repair goes to the beneficiary nearest to the founder's purpose whose loss would cause clear harm. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} Where repair is not necessary, so that leaving it until the next year's income would not ruin the thing, the more important need comes first. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} The Hanafis separate the case where the founder stipulated that repair be given priority each year, when the administrator keeps the amount aside each year even if it is not yet needed, from the case of silence, when repair is paid when needed and nothing is saved for it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} When part of an endowed building or its materials has fallen, the judge spends it on repair; if the means of repair are not ready at once, he keeps it until they are. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661}\n\nFor the Shafi'is, the surplus of a mosque's income above what its repair needs, reckoned by the cost of its rebuilding, is saved, and with the balance a property is bought and endowed; this is safer for the mosque, and it is not bought from the endowed thing whose upkeep it is, since the founder endowed that thing for upkeep. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662}\n\nThe jurists differ on the source from which the endowed thing and its upkeep are paid. The Hanafis and Malikis hold that it comes from the endowment's income whether or not the founder stipulated this, since the endowment is a continuing charity in God's way and can continue only in this manner; the Malikis add that a stipulation to the contrary is void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} For the Hanafis, if the founder gave a house for his son's residence, its repair falls on the one who lives in it, from his own money and not from the income, since the burden follows the benefit; if he refuses or cannot pay because he is poor, the judge lets the house, from him or from another, and repairs it from the rent, and the one who refuses is not compelled to repair. The Malikis agree. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} The Malikis say that a horse endowed for raiding is fed from the public treasury; if there is no treasury, it is sold and its price buys weapons and similar things that need no feeding. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662}\n\nThe Shafi'is and Hanbalis follow the founder's terms. For the Shafi'is, the feeding, the equipping and the repair are paid from the source named; failing that, from the endowed thing's own benefits, such as a slave's earnings or a property's rent; if its benefits cease, the feeding and the equipping come from the public treasury, while repair is then owed by no one, because a property is like absolute ownership, unlike a living animal, whose life and sanctity must be preserved. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663} For the Hanbalis, the founder's terms govern. If he named a source of feeding, whether the income or another, that is followed. If he did not name one and the endowed thing is a living being, such as a slave or horses, it is fed from its own income; if there is no income, the feeding falls on the named beneficiary. If the feeding is impossible, the thing is sold and its price is spent on another thing that becomes an endowment; if it can be let out, it is let out for enough to feed it. If the beneficiary is unnamed, as the poor are, the feeding comes from the public treasury. For property, such as buildings, weapons and goods, repair is owed by no one unless the founder made it a condition. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663}\n\nThe jurists agree that whoever wrongfully damages an endowment, by demolition or otherwise, must pay. For the Hanafis, a man who lets an endowed house, and whose tenant uses its courtyard to tether animals and wrecks it, is liable, because he acted without permission. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663} For the Malikis, whoever wrongfully demolishes an endowment must rebuild it as it was, even if what was demolished was decayed; but the preponderant view among them is that he owes its value, like any other destroyed property. Ibn 'Arafa accepted this view and 'Iyad made it well known. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663} For the Shafi'is, no one is liable for a book endowed for the pursuit of learning that is lost in his hands without his fault; but whoever is at fault is liable, and using the book for a purpose other than the one endowed is a fault. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663}\n\nWhen an endowed thing needs repair or upkeep and its income does not suffice, may the administrator borrow on the endowment, and does he need permission? The Malikis, Hanbalis and, in one view, the Hanafis hold that the administrator may borrow for the endowment without the judge's permission, as with his other acts, since he is a trusted agent with full power to act. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} The Malikis say that if an administrator undertook, on taking up the office, to spend from his own money on the endowment when needed, he is not bound by that, but he may recover what he spent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} For the Shafi'is, the administrator may not borrow without the founder's condition or the ruler's permission. The ruler may lend him money from the public treasury, permit him to borrow, or permit him to spend his own money on repair on condition that he may recover it. If he borrows without permission or condition, it is not allowed, and he cannot recover what he spent, since he transgressed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664}\n\nThe preferred Hanafi view is that borrowing on an endowment is not allowed unless it is needed for the endowment's good, such as repair or buying seed, and then only on two conditions: the judge's permission, and that letting the thing and spending its rent is not possible; if the judge is far away, the administrator may borrow on his own authority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} Ibn 'Abidin says borrowing is not allowed without the founder's order, because a debt attaches only to a person's liability; an endowment has no liability, the poor have liability but they cannot in practice be pursued, so the debt falls on the administrator alone. Necessity overrides this analogy; Abu al-Layth's preferred view is that borrowing is allowed with the judge's permission when there is no alternative and the judge is not far from the administrator, because the judge's authority covers the public interests of Muslims more widely. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} Where there is an alternative, such as paying the beneficiaries, borrowing for that is not allowed, except for what is given to the imam, the preacher and the muezzin, and the mats and oil of a mosque, on the preferred view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664}\n\nIf the judge's permission is required and the administrator claims to have had it, the claim is apparently not accepted without evidence, because he wants to take from the income, and his word is accepted only about what is in his hand. If he did not obtain permission, it is forbidden for him to take from the income, since he is then a volunteer, until permission is established. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} Ibn 'Abidin says that if the administrator spent his own money to repair the endowment, he may recover it from the endowment's income; the fatwa of al-Hanuti holds that he may recover it in conscience, but his claim is not accepted unless he had it witnessed that he spent in order to recover. This applies only where the endowment has income; without income, the judge's permission is necessary. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665}\n\nSecond, the sale of an endowment and its exchange. When an endowed thing is disabled and can no longer be used, the Hanafis, Malikis, Hanbalis and, in one view, the Shafi'is allow its sale and the spending of the price on a like thing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} The Hanafis allow sale and exchange even when the endowment is not disabled, under special conditions; the Malikis, in general, distinguish between real estate and movable goods. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665}\n\nThe Hanafis recognise three cases of exchange. In the first, the founder stipulates, at the endowment, that the endowed land may be exchanged for another land, either for himself or for another. This has two formulas; the first is to say: 'my land is an endowed charity to God forever, on condition that I sell it and buy with its price another land', and then the second land is endowed on the first's terms. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} Abu Yusuf, Hilal and al-Khassaf hold that the endowment and the condition are valid by juristic preference, which is the sound view according to the Fatawa Qadikhan; the condition does not undo the endowment, since an endowment can pass from one land to another, and the second stands in place of the first. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} For example, if an usurper floods an endowed land until it becomes a sea unfit for farming, he pays its value and buys another land which becomes an endowment on the first's terms; likewise, if its yield has fallen through blight and does not exceed its costs, the good of the endowment lies in exchange, so the founder may validly stipulate the power of exchange even when the need is not present now. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666}\n\nMuhammad and Yusuf ibn Khalid al-Samti hold that the endowment is valid and the condition void, which is the analogical view. Sarakhsi justifies Muhammad's view: the condition does not prevent the endowment from ending, so the endowment is completed, while the exchange stands as a void condition in itself, like a mosque on which an exchange is stipulated or where it is stipulated that only some people may pray. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} Some Hanafi jurists say the endowment and the condition are both void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} Kamal ibn al-Humam reports from al-Ansari that the condition is valid but the sale may be made only with the judge's permission, and the judge should permit a sale when there is no benefit in the endowment and he sees it is better for its beneficiaries. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666}\n\nIf the founder stipulated that the land be sold and another bought with its price, without adding a further endowment formula, the second land becomes an endowment on the first's terms without renewed formula, because the land was already fixed for the endowment and its price takes its place. By analogy the endowment would be void, since no other land was named to stand in the first's place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} The second formula: if the founder stipulated the right of exchange for the administrator and not for himself, the administrator may exchange for himself, since giving power to another follows from owning the power oneself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667}\n\nIf the right of exchange is stipulated for another man together with the founder, the founder alone holds the right, and the other man does not hold it alone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} Exchange under a stipulation is allowed even if the thing yields income and benefit, since the endowment does not thereby leave use, and neither the judge's direct action nor the absence of income for repair is required. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} The Hanafis limit exchange to what the founder stated in kind and type: if he stipulated exchange for land, it may not be made for a house; if he stipulated the land of a village, it may not be made for other land, since village lands differ in cost and yield; if he did not specify the replacement, he may exchange for any real estate, whether land, house or town, as he wishes, since the stipulation is general. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} If the stipulation covers one exchange, the founder may not exchange the second land for a third, since the condition was fulfilled only in the first, unless the words express that. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667}\n\nThe second case: the founder did not stipulate exchange at the endowment, whether he stipulated its absence or was silent, but the endowment came to a state in which it gives no benefit at all, such as giving no yield or not covering its upkeep. Exchange in this case is allowed on the sounder view when the judge permits it and sees the good in it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} Ibn 'Abidin reports from al-Bahr that Qadikhan's words differ: in one place he allowed the judge to exchange without the founder's stipulation where he saw the good; in another he forbade it even when the land had come to a state where no benefit could be had. The sound view is that the judge may exchange on the following conditions, the first of which is that the endowed thing is wholly taken out of use. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667}\n\nAmong the conditions for exchange, as the Hanafis state them: the sale must not be at a gross undervaluation; the endowment must have some yield with which it can be repaired; the exchanger must be a man of knowledge and action, so that the endowments of Muslims are not undermined; the replacement must be real estate and not cash; and the thing may not be sold to someone whose testimony cannot be accepted in his favour or to a creditor of the founder's heirs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} The exchanged and the replacement should be of one kind. Ibn 'Abidin, quoting Qanali-zada, says that the sameness of kind is probably not required for an endowment held for its yield, since what counts is a large return and little upkeep: exchanging a shop for land that yields rent equal to the shop's rent is better, because land lasts longer and needs less repair; whereas an endowment held for residence is judged by the residence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} In al-Qunya, a house endowment may be exchanged for another house only if the new one is in the same quarter or in a better quarter; the reverse is not allowed, even if the house held is larger in area, value and rent, because it may fall into ruin in the lesser quarter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668}\n\nThe Bahr al-Ra'iq, citing the commentary on Ibn Wahban's poem, asks whether exchange is allowed when the founder forbade it, or when the administrator is removed before exchanging, or when he is removed as soon as he decides to exchange. Tarsusi replies that there is no transmitted ruling, and that the rules of the school mean the judge may exchange when he sees the good in it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} The same work reports from Muhammad that if an endowed land has weakened in yield, and the administrator can buy with its price another land with higher yield, he may sell and buy that. Some shaykhs forbade sale and exchange whether or not the endowment had ceased to yield. Qadikhan says that an endowment without a stipulation of exchange may not be sold or exchanged even if its land is salty and unusable, because an endowment is meant to be perpetual and is not sold; the power of exchange arises only from a stipulation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669}\n\nThe third case: the founder did not stipulate exchange; the endowment has yield and is not disabled; but exchange would bring some general benefit, and the replacement is better in benefit and yield. Ibn 'Abidin says that this is not allowed on the preferred view, as Qanali-zada settled it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} Ibn 'Abidin also reports from al-Ashbah that a productive endowment may be exchanged only in four cases: first, when the founder stipulated exchange; second, when a usurper flooded the land into a sea, so that he pays its value and the administrator buys land with it; third, when the usurper denies the seizure and there is no evidence, so that the administrator takes the value to buy a replacement; and fourth, when someone desires the land and offers a replacement with more yield and a better location, which is allowed on Abu Yusuf's view and is the fatwa, as in the fatwas of Qari al-Hidaya. The author of al-Nahr says that Sadr al-Shari'a's rebuttal stands against this: we do not give fatwa on the view of Abu Yusuf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669}\n\nExchange of endowed property among the Malikis. The Malikis distinguish between real estate and movable goods in sale and in exchange. They allow exchange of movable goods when no party can maintain them and they are in danger of perishing, or when their benefit has ceased so that they cannot be used for the purpose for which they were detained. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} Thus a horse endowed in God's way, for raiding or frontier guard, is fed from the public treasury; if there is no treasury, it is sold and the price buys weapons and similar things that need no feeding. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} Any movable endowment that is not real estate and cannot be used is sold, such as a horse that has caught rabies, a cloth that wears out, a slave who grows old, or books that decay. Its price is spent on a like thing if possible, or on a share of such a thing if the whole cannot be bought, and if that is impossible the price is given in charity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} Likewise male animals endowed for raiding or breeding, when there are more of them than needed, or females that have grown too old to be of use, are sold and young females bought with the price, so that milk and offspring continue and the endowment remains, as al-Dardir says of ostriches. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670}\n\nFor real estate, the Maliki school holds that it may not be sold even if it is ruined and cannot be used, whether a house, shops or other buildings, and it may not be exchanged for a like unruined thing. Abu al-Faraj reports from Malik that the imam may sell it, if he sees the good in it, and spend the price on a like thing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} Some Malikis allowed the exchange of a ruined dwelling. Al-Taj wal-Iklil reports the absolute prohibition of selling a ruined dwelling of an endowment; Ibn al-Jahm gives the reason that someone will be found to repair it by renting it for years, so that it returns to its former state. The exchange of a ruined dwelling for an unruined one is disputed. Ibn Rushd says that if such a piece of land has lost all use and cannot be repaired or let, there is no harm in exchanging it for a place that will be endowed in its stead, by the judge's ruling after the cause is proved and the advantage to the endowment is clear; this is to be recorded and witnessed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670}\n\nThe Malikis allow the sale of real estate for the necessary widening of a congregational mosque, whether the endowment is held for named or unnamed persons. Ibn Rushd says that the apparent report of Ibn al-Qasim's collection allows it for every mosque, as does Sahnun's view; al-Nawadir reports from Malik and others that it applies to congregational mosques when there is need, and not to neighbourhood mosques, since the necessity there is not the same. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} Endowed property may also be sold to widen a graveyard or a road used by people, even against the will of the beneficiaries or the administrator; the beneficiaries are bound to have the price put into another endowment, but the judge may not compel them to accept a different endowment in its place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} Al-Sharh al-Saghir says that for property taken to widen a mosque, the price is paid if the endowment was held for named persons; if it was held for unnamed persons, such as the poor, no compensation is due, since no named person has a right attached to it, and the reward the founder gains when the property enters the mosque is greater than what he first intended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671}\n\nThe Malikis say that if the founder stipulated change and exchange, his condition is followed. If he stipulated that, should a desirable price be offered, the property be sold and another bought, al-Nawadir and al-Mutiyya report that this is not allowed; if it is done nevertheless, it stands and the founder's condition is applied. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} Fath al-'Ali al-Malik reports a case: an endowed land on a road used by Muslims, whose founder stipulated that it not be sold or exchanged, was exchanged by the administrator of the road for a state land, the administrator handing the endowed land to a farmer and taking state land in return. Dardir holds that where the founder stipulated no exchange and gave no exception, the exchange is void; the administrator must return the state land to its owner and take back the endowed land itself, and the ruler restrains anyone who refuses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671}\n\nExchange of endowed property among the Shafi'is. The Muhadhdhab says that if a mosque is endowed and then ruined so that prayer in it ceases, it does not return to ownership, and the owner may not dispose of it, because what left ownership for God's right does not return to ownership by ruin, as a man who frees a slave and then becomes disabled does not reclaim him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} Al-Sharbini says that the sounder view allows selling the mats of an endowed mosque when they have worn out, and its beams when they have broken or nearly so and are fit for nothing but burning, lest they be lost and the space be crowded with them to no purpose; a small sum from their price returning to the endowment is better than losing them. Such things are not counted as a sale of the endowment, since they are treated as nonexistent; this is the view on which the two shaykhs, al-Rafi'i and al-Nawawi, relied. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672} Al-Rafi'i says that the analogy is to buy a replacement mat with the price of the old one, and al-Adhra'i takes the mentioned case to be straw used in clay. Mats given or bought for a mosque are sold when needed. Beams that can be used for other things, such as planks and doors, are never sold. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672} If a mosque is at risk of falling, the judge may strip it and use the material to build another mosque, if he sees fit, and building it nearby is better; but he may not build a well with the material of a mosque. If an endowment on a bridge is destroyed by a flood and the bridge is not needed where it stands, it may be moved to where it is needed; the income of an endowment on a frontier that has become secure is kept by the administrator, in case the frontier returns. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672}\n\nIf an endowed date palm dries, an endowed animal is disabled, or the beams of a mosque break, there are two views, and the sounder is that they may not be sold, as with a mosque. The other view allows sale, since the thing is no longer hoped to yield benefit; the price then takes the rule of the value that comes from the destruction of endowed property. If the ownership of the endowed thing's substance is held to belong to the beneficiary, which is the lesser view, the price goes to him; if it belongs to God, which is the more apparent view, a like thing is bought with the price to become an endowment in its place. Abu Hamid al-Isfara'ini says that the price buys a like thing to become an endowment in its place, without dispute. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672}\n\nExchange of endowed property among the Hanbalis. Among them exchange is allowed when the endowed thing is no longer fit for the purpose for which it was endowed and no longer serves to be used, whether it is movable or real estate, and whether it is a mosque or not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} They hold that selling an endowment is forbidden and invalid, and that exchanging it, even for something better, is invalid by explicit text, except where its intended benefit is lost through ruin and its yield cannot repair it, in which case it is sold; or where its intended benefit is lost by a cause other than ruin, such as wood that has cracked and is feared to fall. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} If the endowment is a mosque whose intended use is lost because it is too narrow for its people and cannot be widened, or because its neighbourhood is ruined, or because the place is filthy and prevents prayer in it, then, according to al-Qadi, sale is valid and the price is spent on a like thing, because keeping it so is a waste of property. Since an endowment is perpetual, when that cannot be kept in the same thing its purpose is preserved in another, and a succession of replacements is treated like the things themselves. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} A dried endowed tree may be sold; so may a beam that has broken, worn out or is feared to break or fall. Al-Talkhis says that when an endowed beam is near breaking, or an endowed house near collapse, and it is known that delay would take it out of use, it is sold to protect its value. Schools, hospices and caravanserais that are endowed may, when ruined, be sold by one view without dispute. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} An endowed horse for raiding that is no longer fit is sold and another horse fit for it is bought; once the replacement is bought it becomes an endowment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} A founder's stipulation that an unusable endowment not be sold is void, and it must be sold. The seller is the judge where the endowment is for a public good, such as the poor, mosques or bridges; where it is held for a named person or named group, or for the worshippers or muezzins of a mosque, the endowment's special administrator sells it. Even so, it is best done with the judge's permission, because such a sale binds those who come after the present holders, like a sale made against an absent party. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} Once the replacement is bought for the endowment's use it becomes an endowment; the prudent course is to re-endow it by a new formula, lest a later person, not seeing that the purchase made it an endowment, undo it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674}\n\nThe return of an endowment to the founder's ownership. Muhammad ibn al-Hasan of the Hanafis holds that if what surrounds a mosque is ruined and no longer needed, even while the mosque remains maintained, or if the mosque itself is ruined with no means to repair it and people no longer need it because another mosque has been built, then it returns to the ownership of its builder if he is alive, or to his heirs if he is dead; Abu Yusuf disagrees. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} Muhammad's reason: the founder gave the endowment to a kind of devotion, and since that devotion has ended the endowment ends with it. It is like a mosque's mat and grass when no longer needed, or its lamp when the mosque is ruined, which return to the one who made them; like a shroud that a beast has torn, which returns to its owner; and like an offering made by one who is prevented from completing the pilgrimage, which he may dispose of once the hindrance is removed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} Abu Yusuf says that it is moved to another mosque with the judge's permission, and its debris is sold with the judge's permission and the price spent on some mosques. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674}\n\nThe Hanafi consequence is that if an endowment falls into ruin and has no income to repair it, it returns to the builder or his heirs in Muhammad's view, though not in Abu Yusuf's. But in Muhammad's view, only what has left the founder's intended use altogether returns to ownership, such as a shop that burned and cannot be let for anything, or a hostel or a neighbourhood cistern that is ruined with no means of repair; what was made for income returns to ownership only as its debris, while its open ground remains an endowment that is let, even for a small rent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} Khulasa reports that Muhammad said of a horse that was made a detained endowment in God's way and became unfit to ride that it is sold and its price goes to its owner or his heirs, as with a mosque. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} The Shafi'is, in the view opposite to the sounder, say that if an endowed thing loses its benefit through a cause that is not chargeable, such as a tree drying or being uprooted by wind or flood before it can be replanted, the endowment ends and the thing returns to the founder or his heir. The sounder Shafi'i view is that it does not return to ownership but remains an endowment; the Hanbalis agree. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675}\n\nThe administration of an endowment. The jurists agree that the administration of an endowment follows the founder's condition. If he assigns it to a named person, his condition is followed, as 'Umar ibn al-Khattab did when he left his endowment to his daughter Hafsa to manage for her life, and then to the people of sound judgement of her kin, as al-Bayhaqi reports. Ibn Qudama says that the disposal of an endowment follows the founder's condition, and so does its administrator. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675} The jurists differ on whether the founder may assign administration to himself. The Hanafis, Shafi'is and Hanbalis allow it. The Malikis say that if the beneficiary has not taken possession of the endowment, the endowment is void by the founder's death, illness, or bankruptcy; if the beneficiary has taken possession and the founder stipulated administration for himself, the endowment stands, but the founder is compelled to assign administration to another, since he may not assign it to himself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675}\n\nIf the founder names no administrator, the Malikis and Hanbalis hold that where the endowment is for unnamed persons, such as the poor, the mosques, the ruler appoints whom he chooses, since he cannot himself administer it. Where the endowment is for a named beneficiary of sound mind, that beneficiary administers it, since it is his ownership and his benefit, so that his supervision is like absolute ownership. If he is not of sound judgement, his guardian administers it. There is a possibility in the Hanbali school, which Ibn Abi Musa chose, that the ruler administers it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675}\n\nOn the administration of an endowment where the founder did not stipulate it, the Hanafi views differ. Abu Yusuf holds that the endowment belongs to God and the administration goes first to the founder, then to his executor, then to the judge. Hilal, the apparent view of the school, holds that the administration belongs to the founder, then to his executor or the judge, because an administrator derives his authority from the founder's stipulation, so it is impossible that he should have authority while another derives it from him; and the founder is the person nearest to the endowment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} Muhammad holds that the founder has no administration unless he stipulated it, because for him handing the endowment over to a custodian is a condition of its validity, so that once it is handed over the founder has no authority over it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} If the founder dies without naming an administrator, the judge appoints a custodian from among the founder's family while a suitable person can be found there, either because such a person is the most solicitous or because the founder meant the endowment to be attributed to them; only if none is found does he appoint an outsider. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} The Shafi'is hold, on the school's view, that if the founder names no administrator, administration belongs to the judge, who has general authority over such matters. A second view gives it to the founder, who had it, and a third gives it to the beneficiary, since the income is his. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677}\n\nThe qualifications of an administrator. The jurists set several conditions for an administrator's fitness; some are agreed and some are disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676}\n\nThe first condition is legal capacity. The jurists agree that an administrator must be adult and sane, since a minor or a mentally ill person lacks the capacity; this holds in general. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} The Malikis and Hanbalis add that if the founder names no administrator and the beneficiary is a named person, such as Zayd or 'Amr, the beneficiary administers it himself; if he is a minor or insane, his guardian stands in for him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} The Hanbalis say that the ownership of an endowed thing passes to the beneficiary if he is a named human or a limited group, and he administers it if he is adult and sound of judgement, or his guardian does if he is a minor, insane or a spendthrift; Ibn Abi Musa says the judge administers it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677}\n\nThe Hanafis: Ibn 'Abidin quotes al-Is'af that appointing a minor as administrator is void by analogy in every case, and by juristic preference void while he is a minor, so that the administration passes to him when he grows up; al-Shilbi holds that the assignment to a minor is never valid, since administration is a form of guardianship and a minor under guardianship cannot be given guardianship over others. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} Ibn 'Abidin cites the fatwas of Rashid al-Din that a judge who assigns administration to a minor who is able to keep the property does so validly, since it grants him authority to act; the two views can be reconciled by reading al-Is'af as concerning a minor unable to act. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} Insanity prevents appointment and also ends it once it occurs; Ibn 'Abidin quotes al-Fath that an administrator is removed by permanent insanity lasting at least a year, and that if he recovers, administration returns to him, though al-Nahr says this holds for one named by the founder and not for one appointed by the judge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} The Shafi'is state that administration is stripped by insanity, and al-Shabramallisi says that when a sane person returns to a founder-named administrator, the office returns by recovery alone without a new appointment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678}\n\nThe second condition is justice (adala). The Hanafis differ whether it is a condition of validity or of preference. Al-Is'af says that no one is appointed except a trustworthy and capable person, whether acting himself or through a deputy, because removing a dishonest person from office is not part of administration. Ibn 'Abidin holds that justice is a condition of preference, not of validity, and that an administrator who turns to wrongdoing deserves removal but is not removed automatically, as a judge who turns to wrongdoing is not removed on the sound and fatwa view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679}\n\nThe Malikis treat justice as a condition when the administrator was appointed by the judge or by the founder. Al-Hattab says that administration of a detained endowment belongs to the one the founder chose, who must be one trusted in religion and honesty; if the founder is negligent, administration falls to the judge, who sets up someone he approves. If the administrator is badly managing and not to be trusted, the judge removes him, unless the beneficiary owns his own affairs and accepts him. Al-Qarafi says that a judge removes an administrator only for a fault, but the founder may remove him even without one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678}\n\nThe Shafi'is require apparent and inner justice in an administrator the judge appoints. Al-Subki says that for one appointed by the founder, apparent justice should suffice; al-Adhra'i requires both apparent and inner justice in that case too, and al-Sharbini prefers the first view. If the administrator becomes a wrongdoer he is removed, and then the administration passes to the judge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} Al-Shafi'iyya say that if an administrator becomes a wrongdoer and then just again, his authority returns if it was made a condition in the endowment's terms and named exactly; otherwise it does not. Al-Nawawi gave this fatwa, and Ibn al-Rif'a and others agreed; al-Zarkashi says it is apparent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679}\n\nThe Hanbalis hold that if administration belongs to someone other than the beneficiary, and the appointment was by the judge or by an original administrator, justice is required, because it is authority over property, like guardianship over an orphan's property. If he is not just, his hand is removed from the endowment to preserve it, and if he returns to fitness his right returns. If the administrator was set by the founder, justice is not required, and a trustworthy person is added to the wrongdoer; his authority is removed only where its removal is needed to keep the endowment, since preserving the endowment matters more than leaving a wrongdoer in authority over it. Where administration belongs to the beneficiary himself, whether just or not, he has the better claim to it, since he owns the endowment and so administers for himself; some say a trustworthy person is added to him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680}\n\nThe third condition is capability (kifaya), meaning the strength and ability of the person to act in what he administers. The Shafi'is and Hanbalis require it, since preserving an endowment is a religious duty and someone without capability cannot preserve it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} If capability is lost, the Shafi'is say the judge removes administration from him even if it was assigned to him by the founder. Al-Nawawi says that when the defect ends, his administration returns if it was stipulated in the endowment and named exactly. The Hanbalis say that if capability is lost he is not removed, but a strong and trustworthy administrator is added to him, to achieve the purpose. The Hanafis say that the administrator must be removed where he is not trustworthy or is incapable (the OCR text reads 'the founder' here, probably a slip for the administrator, flagged as a doubt). The Malikis' words also imply that capability is required. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680}\n\nThe fourth condition is Islam. The Hanbalis hold that an administrator must be Muslim if the beneficiary is Muslim or the object is a mosque or the like, relying on Surat al-Nisa, verse 141, which they cite for this condition. If the endowment is for a named unbeliever, an unbeliever may be made administrator. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680} The Hanafis allow a dhimmi to be administrator and do not require Islam; if the judge removes a dhimmi for some reason and he then converts, administration does not return to him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680} Al-Ramli holds that analogy with the will and marriage makes valid a dhimmi's administration of an endowment for a dhimmi beneficiary, provided he is upright in his religion, but this is rejected because the endowment requires real justice; al-Shabramallisi says the rejection is the sound view. He distinguishes a dhimmi's marriage of his ward, where the guardian has a natural restraint from wishing to protect his ward from shame, which does not apply to an endowment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17681}\n\nThe administrator's wage. The subject covers his right to a wage, whether it is set by the founder or the judge, its amount, and whether he is due one where neither has named it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17681} On the right to a wage: the jurists hold that an administrator is due a wage for his work in running the endowment and caring for its affairs. The evidence they cite includes 'Umar's words when he endowed his land at Khaybar, that whoever administers it may eat in reasonable measure or feed a friend without making profit from it; 'Ali's making the upkeep of the slaves he endowed to work the land a charge on the income; the analogy with the collector of zakat; and the saying attributed to the Prophet that what remains after his wives' maintenance and his worker's wage is charity. Ibn Hajar says that the worker there means the custodian of the land, so the saying shows that his wage is lawful. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682}\n\nOn the setting of the wage. If the founder set it, the administrator takes what the founder fixed even if it exceeds the usual wage; this is the view of the Hanafis, Shafi'is and Hanbalis. The Hanafis say that if the founder fixed less than the usual wage, the judge completes it on request. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} The Shafi'is say that if the founder made himself administrator and fixed a wage for himself, it may not exceed the usual wage; if he fixed more, the endowment is void, since it would be an endowment upon himself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} The Hanbalis say that if the founder fixed a stated wage, and it equals the usual wage, the administrator takes it; if it is more, the costs of what the endowment needs, such as the trustees and others, are paid from the excess until only the usual wage remains, unless the founder gave it to him outright. The Malikis fixed no amount and left it to the founder or the judge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682}\n\nIf the founder set no wage, the judge fixes it. The Hanafis and Hanbalis hold that the judge's wage must not exceed the usual wage, and if he sets more, the excess is withheld. The Malikis leave the matter to the judge's discretion; Ibn Fattuh says the judge may give the appointed administrator a fixed monthly stipend according to his work, as the imams did. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} The Shafi'is say that if the founder names no wage, the administrator has no wage on the sound view and may not take anything from the endowment; if he does take it, he is liable and is discharged only by handing it to the judge. If the administrator asks the judge to fix a wage for him, he is like a guardian of an orphan's property who asks the judge to set his fee. Al-Iraqi, who reports al-Balqini's view, says that the administrator then takes the wage where there is need, either the amount of his maintenance, as al-Rafi'i preferred, or the lesser of his maintenance and the usual wage, as al-Nawawi preferred; another view is that he is due the usual wage even if it exceeds his maintenance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683}\n\nIf the founder set no wage. Al-Ramli of the Hanafis says that the administrator is due nothing unless the judge fixes a wage for his work. Ibn 'Abidin concludes that where the founder names a sum for the administrator, he has it, whether large or small, whether or not he works, provided it is not set in return for work; where the founder names none and the judge fixes the usual wage, that is valid; if he fixes more, the excess is withheld; and if the administrator does no work he is due no wage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} If the judge appoints an administrator and names no wage, then, where the custom is that the work is not done without the usual wage, he is due the usual wage, since custom is like a stipulation; otherwise nothing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} Ibn Najim, citing al-Qunya, reports two Hanafi views on a judge's appointee who is given no wage: the first is that he has nothing even if he works a year; the second is that the custodian is due a wage like the effort he gives, whether or not the judge or the residents of the quarter set a wage for him, since no one accepts custody publicly without a wage, and custom is like a stipulation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683}\n\nWhere the endowment has administrators, the Malikis and Hanbalis and the Shafi'is treat the wage in a particular way. The Shafi'is hold that if the founder assigned no wage to the administrator, he is not entitled to one on the sound view; if the matter is referred to the judge, he is given one where there is need, as explained above. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17684} The Hanbalis have three views. The first is that the administrator may eat from the endowment's income in reasonable measure, whether he is needy or not, by analogy with the collector of zakat; this is the view of Abu al-Khattab. The second is that he takes the lesser of the usual wage or his maintenance, by analogy with the guardian of an orphan, and is entitled to it only if he is poor. The third is that an administrator known to take a wage for his work has a right to the usual wage, which is the analogy of the school. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17684} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} The Malikis, as Ibn Fattuh says, let the judge give a set monthly stipend in endowments, fixed by his judgement of the work. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17684}\n\nThe source of the wage. The majority of jurists, namely the Hanafis, the Malikis except Ibn 'Attab, the Shafi'is and the Hanbalis, hold that the administrator's wage, whether set by the founder or by the judge, comes from the endowment's income, citing 'Umar's words on his endowment that whoever administers it may eat from it in reasonable measure without accumulating property. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} Ibn 'Attab, of the Malikis, held that the wage comes only from the public treasury; if it is taken from endowments it is returned and recovered from the treasury, and if not given, his reward is with God. Al-Hattab explains that nothing should be taken from endowments because they are for bequests. Ibn Warad gave a fatwa in his view, but al-Dasuqi weakened Ibn 'Attab's view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685}\n\nThe work that earns the wage is to preserve the endowment, repair it, let it, collect its yield (rent, crop or fruit), strive to develop it, and spend it on its purposes, such as repair, upkeep and the beneficiaries, since that is what is customary for such work. The wage runs from the time the administrator takes up the office, and is due in proportion to the work. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} The Hanbalis say that if an administrator neglects his duty, his fixed wage is reduced by the amount his neglect cost the endowment; what is set for him is divided between what he did and what he did not, and the share for what he did not do falls away. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} The Hanafis say that if the beneficiaries dispute with an administrator who says the founder fixed a wage for work while he does nothing, the judge does not impose tasks that the rulers themselves do not perform. If an impediment comes upon him that stops him ordering, forbidding, taking and giving, he has no wage; if not, he keeps it. If the founder fixed more than the usual wage, that is permitted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} In one case, the owner of an endowed land died and the judge appointed a custodian and gave him a tenth of the income, while a mill in the endowment was held by a man on a lump-sum lease and needed no custodian, and the beneficiaries collected its yield from him; the custodian has no right to a tenth of that yield, since his wage is payment for work and there is no wage without work. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685}\n\nThe accounting of an administrator. It is the administrator's duty to collect the endowment's yield, spend from it on what the endowment needs, and pay the beneficiaries. The jurists agree that he must account for what he spends, whether he is called to account by the judge or by the beneficiaries. They differ on whether his word about his spending is accepted without evidence, and, if there is no evidence, whether his oath is required. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685}\n\nThe Hanafis say that the judge need not require a detailed account of every sum the administrator has spent from the endowment's income; a general account suffices if he is known to be trustworthy. If he is suspected, the judge makes him explain item by item, and does not imprison him, but summons him for two or three days and warns him; if he explains, well and good, otherwise the judge takes his oath. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} Al-Durr quotes al-Qunya that if the judge suspects him he makes him swear, even if he is trustworthy, as a depositary who claims that a deposit was lost must swear. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} The Hanafi views differ on the claim that the administrator paid the beneficiaries. Al-Durr says his word is accepted without oath. The Is'af says that if he says he received the wage and paid it to the beneficiaries, and they deny it, his word is accepted with his oath and he is not liable, as a depositary who claims to have returned a deposit when the depositor denies it. The lessee of the endowed property is discharged by the administrator's acknowledgement of receiving the rent. If he says the rent was lost or stolen after he received it, his word with oath is accepted, since he is trustworthy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} Ibn 'Abidin reports from al-Khayr al-Ramli that the fatwa is that he swears in this age. The Hamidiyya quotes Abu al-Su'ud as ruling that if the administrator is a squanderer, his oath is not accepted on his spending of endowment property. Al-Shilbi holds that a wrongdoer whose conduct breaks the Law is not believed on what he spent unless he has proof. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686}\n\nWhether a trusted administrator's word after his removal is accepted: al-Hamawi says the apparent view is that it is, since removal does not take away his trustworthiness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687} Mulla Abu al-Su'ud draws a further distinction: if the administrator claims to have paid from an endowment's income to beneficiaries whom the founder named as his children or grandchildren, his word is accepted; if he claims to have paid holders of offices, such as the imam and the muezzin, it is not, just as a man who hired a builder for a known wage in a mosque and then claims to have paid him is not believed. Al-Tamartashi praised this distinction. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687}\n\nThe Malikis hold that if the founder dies and the endowment deed is lost, the administrator's word is accepted about the purposes on which he spends, if he is trustworthy. If he claims to have spent the yield, it is accepted if he is trustworthy, unless the deed had witnesses at its making, in which case he spends only with their knowledge. If he claims to have spent his own money on the endowment, it is accepted without oath unless he is suspected, and then he swears. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687} Al-Hattab reports a case put to al-Suri: an imam, a muezzin and the general administrator of a mosque were charged years later by a market inspector with a surplus from the rent of shops; the administrator denied any surplus and refused to state his spending, saying he was not bound to, and that without him the endowment would be lost. Al-Suri ruled that his word is accepted about what he says he spent, if it resembles what he said. Al-Barzali adds that this holds where no condition was set requiring a record of income and spending, except with witnesses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687}\n\nThe Shafi'is distinguish between beneficiaries who are named, such as Zayd and 'Amr, whose word on what is paid to them is accepted and who may demand accounts, and unnamed beneficiaries, such as the poor. Where the beneficiaries are unnamed, it is disputed whether the ruler may demand accounts; of two views, the more apparent is that he may. The administrator is believed about the amount he spent, where that is probable; if the judge suspects him, he makes him swear. Al-Azra'i explains that what is meant is spending in accordance with custom; the payments to the poor and other general purposes are included, but spending on a named beneficiary is not believed, since that beneficiary did not entrust him with it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688}\n\nThe Hanbalis distinguish the administrator who serves without pay from one who takes a wage. The word of a volunteer administrator is accepted about a payment to a beneficiary; a paid administrator's word is not accepted without evidence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688} Al-Buhuti and al-Mirdawi say that the beneficiaries may not object to a trusted administrator whom the founder appointed; they may question him about what their endowment needs, so that their knowledge equals his; and the ruler may set up an office to audit endowment accounts when it is in the public interest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688}\n\nThe removal of an endowment's administrator, and who has the right to remove him. The conditions for an administrator and the rule when one fails were set out above; here is who may remove him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688}\n\nFirst, the founder's right to remove his appointee. The Shafi'is and Hanbalis distinguish between a founder who at the start kept administration for himself and later assigned it to another, and a founder who gave it to another from the outset. In the first case he may remove and appoint someone else, since the assignee stands in for him, as a principal removes his agent; this is the sound view of the Shafi'is and the sound and correct view of the Hanbalis in the corrected text of al-Furu'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688} Al-Shirbini notes that this implies the founder may remove without cause, and al-Subki says so in his fatwas; but many later scholars, among them Ibn Razin, ruled that removal without cause is not permitted. A Shafi'i and Hanbali view denies him any removal, since his ownership has gone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17689}\n\nIn the second case, where the founder names an administrator at the endowment's creation, the Shafi'is say that he may not remove him, even for a reason of advantage, since he has no authority after assigning it to another. Hence if the administrator so named removes himself or becomes a wrongdoer, the appointment of a replacement belongs to the judge, not the founder. The Hanbalis say that if the founder named an administrator and stipulated for himself the right to remove him, he may remove him; if not, he may not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690}\n\nThe Hanafis: Muhammad ibn al-Hasan holds that if the founder stipulated for himself and his children the right to appoint and remove custodians, and to exchange the endowment, and all such authority, and then handed the endowment over to the administrator, the founder may remove him. If he did not stipulate the right to remove, he may not do so after handing over, because the administrator stands in place of the beneficiaries. Al-Sadr al-Shahid says that the fatwa follows Muhammad's view. Ibn 'Abidin says this rests on whether handing over is a condition, which it is for Muhammad and is not for Abu Yusuf. For Abu Yusuf the founder has authority whether or not he stipulated it, since handing over is not a condition; if he appoints another he is a deputy and may remove him, whether he stipulated the right or not. Hilal, al-Fath and al-Bahr hold this to be the apparent view, and the shaykhs of Balkh gave fatwa on Abu Yusuf's view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690} Al-Ramli says that this is plain: removal is valid for cause or without cause, since he is a deputy, and a principal may remove his agent in every case. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690}\n\nThe Malikis hold that the founder may not stipulate administration for himself; he follows his own condition in naming the administrator, and if he named a particular person he may not change to another. Al-Qarafi says that the founder may remove an administrator even without cause; al-Hattab says that one who has appointed someone to administer his endowment may remove him only for a cause that appears. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690}\n\nSecond, the judge's right to remove. The judge has general authority, so he may remove an administrator whom the founder named if the administrator's dishonesty is proved or if he lacks one of the required conditions; he may not remove him without cause. Where the judge himself appointed the administrator, the Malikis, the Shafi'is and some Hanafis hold that he may not be removed except for a cause, such as embezzlement or some other fault; the Hanbalis and some Hanafis hold that he may be removed without embezzlement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690}\n\nThe plurality of administrators. An endowment may have one administrator or more, as the jurists state. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690} If the founder assigns administration to two persons, the Shafi'is, the Hanbalis and Abu Hanifa hold that neither may act alone, since the founder did not accept either's judgement alone; but if the founder names each of them, each may act alone. Abu Yusuf allows each of two administrators to act alone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17691} The Hanbali text adds that if the founder assigns the repair of the endowment to one man and the collection of its yield to another, each has his assignment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17691} The Shafi'is say that if the founder stipulates that the administrator be the most upright of his children, and they all share that uprightness, they share the office; if one is manifestly more upright, he alone holds it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17691} The Hanafis hold that if the founder names a man and then names a guardian for a minor, they are both administrators, the guardian sharing the office; unless the founder specifies, saying, for example, that he endowed his land on a named beneficiary and gave its administration to one man, and named another as executor of his estate and all his affairs, in which case each acts alone within his own assignment. Ibn 'Abidin cites al-Is'af for this. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17691} If the founder gives administration to the most virtuous of his children and they are equal in virtue, they do not share it and it goes to the eldest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} If the founder gave the administration to two men and one accepts and the other refuses, or dies, or is disqualified, the judge appoints another in his place; the Hanafis, Shafi'is and Hanbalis agree. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692}\n\nThe delegation of administration by an administrator. Except where the founder allowed it, the jurists hold that an administrator may not delegate administration to whomever he wishes or bequeath it to another. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} The Hanafis say that if the founder's delegation to the administrator was general, meaning that he stood in the founder's place and could assign and bequeath administration to whomever he chose, he may delegate it in health and in his last illness; if it was not general, he may not delegate it in health, but only in his last illness, since he is like an executor, and an executor may appoint another. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} The Shafi'is say that if the founder says he has assigned administration to a named person, who may delegate it to whomever he wishes, the delegation is valid. Whether the first person's administration then ceases is disputed: the school's view is that it does, since delegation is like a transfer of ownership, so that neither the founder nor the delegate can remove the new administrator, and it does not return to the delegator after his death. Al-Subki's view is that the delegate is the delegator's agent, so if the delegator dies administration returns to the delegate, and if the delegate dies it returns to the delegator. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17693} The Hanbalis say that an administrator named by the founder, if he is himself a beneficiary, may appoint an agent and remove him, since his authority is original, as a person disposes of his own property. If he is not a beneficiary, he may not appoint an administrator or bequeath the office, unless the founder stipulated that he may appoint whomever he chooses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17693}\n\nThe end of an endowment. One way an endowment ends is the return of the endowed thing to the founder's ownership: when the thing is ruined and no longer fit for use, when the endowment is for a class of beneficiaries that comes to an end, or in the case of a temporary endowment, which the Malikis allow. These cases have been discussed in the course of the article. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17693}"
  es: "Waqf, léxicamente, es detención: retener algo en el camino de Dios; también significa prevención y quietud, y la palabra nombra la cosa retenida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579} Técnicamente, los juristas lo definen de varias maneras: para los compañeros Hanafi, la detención de una cosa en propiedad de Dios con su uso dado a quien el fundador desee; para Abu Hanifa, su detención en propiedad del fundador con el uso dado como caridad; para los Malikis, la concesión del uso de una cosa mientras exista, la propiedad permanece con el otorgante incluso nocionalmente; para los Shafi'is, la detención de propiedad cuyo uso puede tenerse con su sustancia conservada, la disposición de su propiedad cortada, para un propósito lícito y existente; para los Hanbalis, la detención por un propietario de su propiedad cuyo uso se conserva en su sustancia, con sus ingresos dados a un propósito caritativo buscando el favor de Dios. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579} Palabras relacionadas: tabarru' (dar sin retorno, más amplio que waqf), sadaqa (donación en vida sin retorno, que también puede llamar waqf, como en la tierra de 'Umar), hiba (donación sin retorno), 'ariya (el permiso para usar una cosa mientras su dueño la conserva) y wasiyya. La diferencia con una donación es que waqf transfiere el uso mientras la sustancia permanece en la propiedad de Dios y no se puede disponer de ella, mientras que una donación transfiere la cosa en sí. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581} Wasiyya: los Hanafis la definen como una transferencia de propiedad vinculada a lo que viene después de la muerte, y los Shafi'is de manera similar. Se diferencia del waqf: un legado tiene efecto después de la muerte y puede ser sobre la cosa o sobre su uso, mientras que el waqf es un regalo hecho en vida y solo sobre el uso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581} La legalidad del waqf: la mayoría de los juristas lo consideran lícito, vinculante y un acto de devoción recomendado, citando el relato de Ibn 'Umar de que 'Umar obtuvo tierras en Khaybar y el Profeta le dijo que, si lo deseaba, retuviera su sustancia y diera su producto en caridad; el dicho de que cuando un hombre muere sus obras terminan excepto tres, entre ellas la caridad continua; y el relato de Jabir de que todo hombre rico entre los emigrantes y los ayudantes retuvo propiedades en caridad perpetua. Ibn Qudama llama a esto consenso de los Compañeros. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17582} Ibn 'Abidin, citando a al-Is'af, dice que el waqf es lícito según Abu Hanifa y sus compañeros; el desacuerdo está en su carácter vinculante: para Abu Hanifa es como un préstamo de uso, con la propiedad permaneciendo en el fundador, vinculante solo por el fallo de un juez o cuando se hace como un legado. Ibn Qudama informa que Shurayh no lo aceptaba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17582} Sobre su dictamen legal: es básicamente un acto de devoción recomendado; se vuelve obligatorio cuando se hace un voto; está permitido cuando no se hace por el bien de la devoción, como el waqf de un dhimmi, que no tiene recompensa; y prohibido cuando sirve al pecado, como una dotación para una iglesia. Los malikíes mencionan que una dotación solo para hijos varones y no hijas está prohibida por asemejarse a la costumbre de la época preislámica, pero Ibn al-Qasim prefirió desaprobarla y hacerla cumplir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17582}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583} Los pilares del waqf: la mayoría (malikíes, shafi'ís, hanbalíes) cuentan cuatro: la fórmula, el fundador, el beneficiario y la cosa dotada; los hanafíes cuentan solo la fórmula. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583} El waqf no es válido sin una oferta, y los juristas difieren en si se requiere la aceptación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583} La fórmula de la oferta: todo aquello que muestra la intención del fundador mediante palabras, una señal clara, un escrito o un acto. Las palabras expresas son 'yo doté' (waqaftu), que los malikíes, shafi'ís y hanbalíes consideran expresas, y 'yo detuve' (habastu), expresa para los hanbalíes, la visión malikí y la visión shafi'í más sólida, y 'yo hice un camino' (sabbaltu), expresa para los shafi'ís y los hanbalíes en la visión más sólida, ya que la costumbre ha fijado su uso y las palabras del Profeta a 'Umar usan lo mismo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17584} Las palabras alusivas son 'di en caridad' (tasaddaqtu), que los hanbalíes y malikíes consideran alusivas, y que los shafi'ís consideran expresas cuando se unen a un beneficiario general como los pobres, y de otro modo alusivas; también 'prohibí' y 'hice eterno', alusivas para los hanbalíes y la visión shafi'í más sólida; hacen un waqf solo cuando se unen a un signo claro, como 'una caridad dotada', 'una caridad que nunca se venderá, dará ni heredará', o cuando se agrega la intención. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17584}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17585} Cuando el administrador posee, de los ingresos del fondo, una suma que puede destinarse a una obra de caridad, como el rescate de cautivos musulmanes o la ayuda a un combatiente varado, y el fondo necesita reparación, entonces: si retrasar la reparación hasta los ingresos del próximo año no causa un daño claro que amenace la ruina del fondo, los ingresos se destinan a la caridad y se pospone la reparación; si el retraso causa un daño claro, los ingresos se destinan primero a la reparación y solo el excedente a la caridad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} Ibn Najim afirma que un administrador que paga a los beneficiarios mientras se debe realizar una reparación que no se puede retrasar se vuelve responsable, porque el mantenimiento que necesita la dotación está excluido del derecho de los pobres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} Para los Hanafi, cuando la reparación es necesaria, como levantar un techo o construir un muro, tiene precedencia sobre todos los demás usos, ya que no es un cuidado apropiado dejar que una mezquita caiga en ruinas por el bien de lo que se le da al imán y al muecín; cualquier excedente sobre la reparación va al beneficiario más cercano al propósito del fundador cuya pérdida causaría un daño claro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} Cuando la reparación no es necesaria, de modo que dejarla hasta el ingreso del año siguiente no arruinaría la cosa, la necesidad más importante viene primero. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} Los Hanafis separan el caso en que el fundador estipuló que la reparación se diera prioridad cada año, cuando el administrador guarda la cantidad cada año incluso si aún no es necesaria, del caso de silencio, cuando la reparación se paga cuando es necesaria y no se ahorra nada para ella. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} Cuando parte de un edificio dotado o sus materiales se han caído, el juez lo gasta en reparación; si los medios de reparación no están listos de inmediato, lo guarda hasta que lo estén. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} Para los shafi'ís, el excedente de los ingresos de una mezquita por encima de lo que necesita para su reparación, calculado según el costo de su reconstrucción, se ahorra, y con el saldo se compra una propiedad y se la dota; esto es más seguro para la mezquita, y no se compra de la cosa dotada cuyo mantenimiento es, ya que el fundador dotó esa cosa para su mantenimiento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} Los juristas difieren en cuanto a la fuente de la que se paga la cosa dotada y su mantenimiento. Los hanafíes y los malikíes sostienen que proviene de los ingresos de la dotación, independientemente de que el fundador lo haya estipulado o no, ya que la dotación es una caridad continua en el camino de Dios y solo puede continuar de esta manera; los malikíes añaden que una estipulación en contrario es nula. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} Para los hanafíes, si el fundador dio una casa para la residencia de su hijo, su reparación recae sobre quien vive en ella, con su propio dinero y no con los ingresos, ya que la carga sigue al beneficio; si se niega o no puede pagar porque es pobre, el juez arrienda la casa, a él o a otro, y la repara con el alquiler, y quien se niega no está obligado a reparar. Los malikíes están de acuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} Los malikíes dicen que un caballo dotado para saquear es alimentado con el tesoro público; si no hay tesoro, se vende y su precio compra armas y cosas similares que no necesitan ser alimentadas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} Los shafi'ís y los hanbalíes siguen los términos del fundador. Para los shafi'ís, la alimentación, el equipamiento y la reparación se pagan con la fuente nombrada; si no, con los propios beneficios de la cosa dotada, como las ganancias de un esclavo o el alquiler de una propiedad; si sus beneficios cesan, la alimentación y el equipamiento provienen del tesoro público, mientras que la reparación no la debe nadie, porque una propiedad es como la propiedad absoluta, a diferencia de un animal vivo, cuya vida y santidad deben preservarse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663} Para los hanbalíes, rigen los términos del fundador. Si nombró una fuente de alimentación, ya sea el ingreso u otra, se sigue. Si no nombró a un beneficiario y la cosa donada es un ser vivo, como un esclavo o caballos, se alimenta con sus propios ingresos; si no hay ingresos, el alimento recae sobre el beneficiario nombrado. Si el alimento es imposible, la cosa se vende y su precio se gasta en otra cosa que se convierte en una donación; si se puede arrendar, se arrienda por lo suficiente para alimentarla. Si el beneficiario no está nombrado, como los pobres, el alimento proviene del tesoro público. Para bienes, como edificios, armas y mercancías, nadie debe repararlos a menos que el fundador lo haya establecido como condición. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663} Los juristas coinciden en que quien dañe indebidamente una donación, por demolición o de otra manera, debe pagar. Para los hanafíes, un hombre que arrienda una casa donada, y cuyo inquilino usa su patio para atar animales y la destruye, es responsable, porque actuó sin permiso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663} Para los malikíes, quien demuele injustamente una donación debe reconstruirla como estaba, incluso si lo que fue demolido estaba deteriorado; pero la opinión predominante entre ellos es que debe su valor, como cualquier otra propiedad destruida. Ibn 'Arafa aceptó esta opinión y 'Iyad la dio a conocer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663} Para los shafi'ís, nadie es responsable de un libro donado para la búsqueda del conocimiento que se pierde en sus manos sin su culpa; pero quien tiene la culpa es responsable, y usar el libro para un propósito distinto al donado es una falta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663} Cuando un bien dotado necesita reparación o mantenimiento y sus ingresos no son suficientes, ¿puede el administrador pedir prestado sobre la dotación y necesita permiso? Los malikíes, los hanbalíes y, según una opinión, los hanafíes sostienen que el administrador puede pedir prestado para la dotación sin el permiso del juez, como con sus otros actos, ya que es un agente de confianza con pleno poder para actuar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} Los malikíes dicen que si un administrador se comprometió, al asumir el cargo, a gastar de su propio dinero en la dotación cuando fuera necesario, no está obligado por ello, pero puede recuperar lo que gastó. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} Para los shafi'ís, el administrador no puede pedir prestado sin la condición del fundador o el permiso del gobernante. El gobernante puede prestarle dinero del tesoro público, permitirle pedir prestado o permitirle gastar su propio dinero en reparaciones con la condición de que pueda recuperarlo. Si pide prestado sin permiso o condición, no está permitido, y no puede recuperar lo que gastó, ya que transgredió. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} La opinión preferida de los hanafíes es que pedir prestado sobre una dotación no está permitido a menos que sea necesario para el bien de la dotación, como reparaciones o compra de semillas, y entonces solo bajo dos condiciones: el permiso del juez, y que no sea posible arrendar la cosa y gastar su renta; si el juez está lejos, el administrador puede pedir prestado por su propia autoridad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} Ibn 'Abidin dice que no se permite pedir prestado sin la orden del fundador, porque una deuda se adjunta solo a la responsabilidad de una persona; una dotación no tiene responsabilidad, los pobres tienen responsabilidad pero no se les puede perseguir en la práctica, por lo que la deuda recae solo sobre el administrador. La necesidad supera esta analogía; la opinión preferida de Abu al-Layth es que se permite pedir prestado con el permiso del juez cuando no hay alternativa y el juez no está lejos del administrador, porque la autoridad del juez cubre los intereses públicos de los musulmanes de manera más amplia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} Cuando hay una alternativa, como pagar a los beneficiarios, no se permite pedir prestado para eso, excepto para lo que se da al imán, al predicador y al muecín, y las esteras y el aceite de una mezquita, según la opinión preferida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} Si se requiere el permiso del juez y el administrador afirma haberlo obtenido, la reclamación aparentemente no se acepta sin pruebas, porque quiere tomar de los ingresos, y su palabra solo se acepta sobre lo que está en su poder. Si no obtuvo permiso, le está prohibido tomar de los ingresos, ya que entonces es voluntario, hasta que se establezca el permiso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} Ibn 'Abidin dice que si el administrador gastó su propio dinero para reparar la dotación, puede recuperarlo de los ingresos de la dotación; la fatwa de al-Hanuti sostiene que puede recuperarlo en conciencia, pero su reclamación no se acepta a menos que tenga testigos de que gastó para recuperarlo. Esto aplica solo cuando la dotación tiene ingresos; sin ingresos, el permiso del juez es necesario. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} Segundo, la venta de una dotación y su intercambio. Cuando una cosa dotada está inhabilitada y ya no se puede usar, los Hanafi, Maliki, Hanbali y, en una opinión, los Shafi'i permiten su venta y el gasto del precio en una cosa similar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} Los Hanafi permiten la venta y el intercambio incluso cuando la dotación no está inhabilitada, bajo condiciones especiales; los Maliki, en general, distinguen entre bienes inmuebles y bienes muebles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} Los Hanafi reconocen tres casos de intercambio. En el primero, el fundador estipula, en la dotación, que la tierra dotada puede intercambiarse por otra tierra, ya sea para él o para otro. Esto tiene dos fórmulas; la primera es decir: 'mi tierra es una donación caritativa a Dios para siempre, con la condición de que la venda y compre con su precio otra tierra', y luego la segunda tierra se dona en los términos de la primera. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} Abu Yusuf, Hilal y al-Khassaf sostienen que la donación y la condición son válidas por preferencia jurídica, que es la opinión correcta según los Fatawa Qadikhan; la condición no anula la donación, ya que una donación puede pasar de una tierra a otra, y la segunda ocupa el lugar de la primera. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} Por ejemplo, si un usurpador inunda una tierra donada hasta que se convierte en un mar inutilizable para el cultivo, paga su valor y compra otra tierra que se convierte en una donación en los términos de la primera; de igual modo, si su rendimiento ha disminuido debido a una plaga y no excede sus costos, el bien de la donación reside en el intercambio, por lo que el fundador puede estipular válidamente el poder de intercambio incluso cuando la necesidad no está presente ahora. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} Muhammad y Yusuf ibn Khalid al-Samti sostienen que la donación es válida y la condición nula, que es la visión analógica. Sarakhsi justifica la opinión de Muhammad: la condición no impide que la donación termine, por lo que la donación se completa, mientras que el intercambio se mantiene como una condición nula en sí misma, como una mezquita en la que se estipula un intercambio o donde se estipula que solo algunas personas pueden rezar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} Algunos juristas hanafíes dicen que tanto la donación como la condición son nulas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} Kamal ibn al-Humam informa de al-Ansari que la condición es válida pero la venta solo puede hacerse con el permiso del juez, y el juez debe permitir una venta cuando no hay beneficio en la donación y ve que es mejor para sus beneficiarios. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} Si el fundador estipuló que la tierra se vendiera y se comprara otra con su precio, sin agregar una fórmula de dotación adicional, la segunda tierra se convierte en una dotación en los términos de la primera sin fórmula renovada, porque la tierra ya estaba fijada para la dotación y su precio toma su lugar. Por analogía, la dotación sería nula, ya que no se nombró ninguna otra tierra para ocupar el lugar de la primera. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} La segunda fórmula: si el fundador estipuló el derecho de intercambio para el administrador y no para sí mismo, el administrador puede intercambiar para sí mismo, ya que dar poder a otro sigue de poseer el poder uno mismo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} Si el derecho de intercambio se estipula para otro hombre junto con el fundador, solo el fundador tiene el derecho, y el otro hombre no lo tiene solo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} El intercambio bajo una estipulación está permitido incluso si la cosa produce ingresos y beneficios, ya que la dotación no deja de ser útil, y no se requiere ni la acción directa del juez ni la ausencia de ingresos para la reparación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} Los Hanafis limitan el intercambio a lo que el fundador declaró en especie y tipo: si estipuló el intercambio por tierra, no puede hacerse por una casa; Si estipuló la tierra de una aldea, no puede hacerse por otra tierra, ya que las tierras de las aldeas difieren en costo y rendimiento; si no especificó el reemplazo, puede intercambiar por cualquier bien inmueble, ya sea tierra, casa o ciudad, como desee, ya que la estipulación es general. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} Si la estipulación cubre un intercambio, el fundador no puede intercambiar la segunda tierra por una tercera, ya que la condición se cumplió solo en la primera, a menos que las palabras lo expresen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} El segundo caso: el fundador no estipuló el intercambio en la dotación, ya sea que estipuló su ausencia o guardó silencio, pero la dotación llegó a un estado en el que no da ningún beneficio, como no dar rendimiento o no cubrir su mantenimiento. El intercambio en este caso se permite según el criterio más sólido cuando el juez lo permite y ve el bien en él. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} Ibn 'Abidin informa de al-Bahr que las palabras de Qadikhan difieren: en un lugar permitió al juez intercambiar sin la estipulación del fundador cuando vio el bien; en otro lo prohibió incluso cuando la tierra había llegado a un estado en el que no se podía obtener ningún beneficio. La opinión correcta es que el juez puede intercambiar bajo las siguientes condiciones, la primera de las cuales es que la cosa donada esté completamente fuera de uso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} Entre las condiciones para el intercambio, como las establecen los Hanafis: la venta no debe ser a una subvaloración manifiesta; la donación debe tener algún rendimiento con el que pueda repararse; el intercambiador debe ser un hombre de conocimiento y acción, para que las donaciones de los musulmanes no se vean menoscabadas; el reemplazo debe ser bienes raíces y no dinero en efectivo; y la cosa no puede venderse a alguien cuyo testimonio no pueda aceptarse a su favor o a un acreedor de los herederos del fundador. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} El intercambio y el reemplazo deben ser de un mismo tipo. Ibn 'Abidin, citando a Qanali-zada, dice que la misma clase probablemente no se requiere para una dotación mantenida por su rendimiento, ya que lo que cuenta es un gran rendimiento y poco mantenimiento: intercambiar una tienda por un terreno que produzca una renta igual a la renta de la tienda es mejor, porque el terreno dura más y necesita menos reparaciones; mientras que una dotación mantenida para residencia se juzga por la residencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} En al-Qunya, una dotación de casa puede intercambiarse por otra casa solo si la nueva está en el mismo barrio o en un barrio mejor; Lo contrario no está permitido, incluso si la casa poseída es más grande en área, valor y renta, porque puede caer en ruinas en el barrio menor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} El Bahr al-Ra'iq, citando el comentario sobre el poema de Ibn Wahban, pregunta si el intercambio está permitido cuando el fundador lo prohibió, o cuando el administrador es removido antes del intercambio, o cuando es removido tan pronto como decide intercambiar. Tarsusi responde que no hay un dictamen transmitido, y que las reglas de la escuela significan que el juez puede intercambiar cuando ve el bien en ello. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} La misma obra informa de Muhammad que si una tierra dotada ha disminuido en rendimiento, y el administrador puede comprar con su precio otra tierra con mayor rendimiento, puede vender y comprar esa. Algunos shaykhs prohibieron la venta y el intercambio, independientemente de si la dotación había dejado de producir. Qadikhan afirma que una dotación sin estipulación de intercambio no puede venderse ni intercambiarse, incluso si su terreno es salino e inutilizable, porque una dotación está destinada a ser perpetua y no se vende; el poder de intercambio surge únicamente de una estipulación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} El tercer caso: el fundador no estipuló el intercambio; la dotación produce y no está inactiva; pero el intercambio traería algún beneficio general, y el reemplazo es mejor en beneficio y rendimiento. Ibn 'Abidin afirma que esto no está permitido según la opinión preferida, como lo estableció Qanali-zada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} Ibn 'Abidin también informa de al-Ashbah que una dotación productiva puede intercambiarse solo en cuatro casos: primero, cuando el fundador estipuló el intercambio; segundo, cuando un usurpador inundó la tierra en el mar, de modo que paga su valor y el administrador compra tierra con ella; tercero, cuando el usurpador niega la toma y no hay evidencia, de modo que el administrador toma el valor para comprar un reemplazo; y cuarto, cuando alguien desea la tierra y ofrece un reemplazo con mayor rendimiento y mejor ubicación, lo cual está permitido según la opinión de Abu Yusuf y es la fatwa, como en las fatwas de Qari al-Hidaya. El autor de al-Nahr dice que la refutación de Sadr al-Shari'a está en contra de esto: no damos fatwa según la opinión de Abu Yusuf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} Intercambio de bienes dotados entre los malikíes. Los malikíes distinguen entre bienes inmuebles y bienes muebles en venta y en intercambio. Permiten el intercambio de bienes muebles cuando ninguna parte puede mantenerlos y están en peligro de perecer, o cuando su beneficio ha cesado de modo que no pueden usarse para el propósito para el que fueron retenidos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} Así, un caballo dotado en el camino de Dios, para incursiones o guardia fronteriza, es alimentado con el tesoro público; si no hay tesoro, se vende y el precio compra armas y cosas similares que no necesitan ser alimentadas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} Cualquier bien mueble que no sea propiedad inmobiliaria y no pueda usarse se vende, como un caballo que ha contraído la rabia, una tela que se desgasta, un esclavo que envejece o libros que se deterioran. Su precio se gasta en algo similar si es posible, o en una parte de tal cosa si no se puede comprar todo, y si eso es imposible el precio se da en caridad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} De igual manera, los animales machos dotados para incursiones o reproducción, cuando hay más de ellos de los necesarios, o las hembras que han envejecido demasiado para ser útiles, se venden y se compran hembras jóvenes con el precio, de modo que la leche y la descendencia continúen y el bien permanezca, como dice al-Dardir sobre los avestruces. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} En cuanto a los bienes inmuebles, la escuela Maliki sostiene que no se pueden vender aunque estén en ruinas y no se puedan usar, ya sean casas, tiendas u otros edificios, y no se pueden intercambiar por algo similar en buen estado. Abu al-Faraj informa de Malik que el imán puede venderlo, si ve el bien en él, y gastar el precio en algo similar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} Algunos malikíes permitieron el intercambio de una vivienda en ruinas. Al-Taj wal-Iklil informa de la prohibición absoluta de vender una vivienda en ruinas de una donación; Ibn al-Jahm da la razón de que alguien se encontrará para repararlo alquilándolo por años, para que vuelva a su estado anterior. El intercambio de una vivienda en ruinas por una en buen estado es discutido. Ibn Rushd dice que si tal terreno ha perdido todo uso y no puede repararse ni alquilarse, no hay problema en intercambiarlo por un lugar que será dotado en su lugar, por decisión del juez después de que se pruebe la causa y la ventaja para la dotación sea clara; esto debe ser registrado y atestiguado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} Los malikíes permiten la venta de bienes inmuebles para la ampliación necesaria de una mezquita congregacional, ya sea que la dotación esté en manos de personas nombradas o no nombradas. Ibn Rushd dice que el informe aparente de la colección de Ibn al-Qasim lo permite para cada mezquita, al igual que la opinión de Sahnun; al-Nawadir informa de Malik y otros que se aplica a las mezquitas congregacionales cuando hay necesidad, y no a las mezquitas de barrio, ya que la necesidad allí no es la misma. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} La propiedad dotada también puede venderse para ensanchar un cementerio o un camino usado por la gente, incluso contra la voluntad de los beneficiarios o el administrador; los beneficiarios están obligados a que el precio se coloque en otra dotación, pero el juez no puede obligarlos a aceptar una dotación diferente en su lugar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} Al-Sharh al-Saghir dice que para la propiedad tomada para ensanchar una mezquita, el precio se paga si la dotación se mantuvo para personas nombradas; Si se mantuvo para personas no identificadas, como los pobres, no se debe compensación alguna, ya que ninguna persona identificada tiene un derecho asociado a ella, y la recompensa que obtiene el fundador cuando la propiedad ingresa a la mezquita es mayor que la que inicialmente pretendía. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} Los malikíes dicen que si el fundador estipuló el cambio y el intercambio, su condición se cumple. Si estipuló que, si se ofrecía un precio deseable, la propiedad se vendiera y se comprara otra, al-Nawadir y al-Mutiyya informan que esto no está permitido; si se hace de todos modos, se mantiene y se aplica la condición del fundador. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} Fath al-'Ali al-Malik informa un caso: un terreno dotado en un camino usado por musulmanes, cuyo fundador estipuló que no se vendiera ni se intercambiara, fue intercambiado por el administrador del camino por un terreno estatal, el administrador entregando el terreno dotado a un agricultor y tomando terreno estatal a cambio. Dardir sostiene que cuando el fundador estipuló que no se debía intercambiar y no dio ninguna excepción, el intercambio es nulo; el administrador debe devolver el terreno estatal a su dueño y recuperar el terreno dotado, y el gobernante restringe a cualquiera que se niegue. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} Intercambio de propiedad dotada entre los shafi'is. El Muhadhdhab dice que si una mezquita es dotada y luego arruinada de tal manera que cesa la oración en ella, no regresa a la propiedad, y el propietario no puede disponer de ella, porque lo que salió de la propiedad por derecho de Dios no regresa a la propiedad por ruina, como un hombre que libera a un esclavo y luego queda discapacitado no lo reclama. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} Al-Sharbini dice que la opinión más sólida permite vender las alfombras de una mezquita dotada cuando se han desgastado, y sus vigas cuando se han roto o casi roto y no sirven para nada más que para quemar, para que no se pierdan y el espacio se llene con ellas sin ningún propósito; una pequeña suma de su precio que regresa a la dotación es mejor que perderlas. Tales cosas no se cuentan como una venta de la dotación, ya que se tratan como inexistentes; Esta es la opinión en la que se basaron los dos shaykhs, al-Rafi'i y al-Nawawi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672} Al-Rafi'i dice que la analogía es comprar una estera de reemplazo con el precio de la vieja, y al-Adhra'i toma el caso mencionado como paja usada en arcilla. Las esteras donadas o compradas para una mezquita se venden cuando se necesitan. Las vigas que se pueden usar para otras cosas, como tablones y puertas, nunca se venden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672} Si una mezquita está en riesgo de derrumbarse, el juez puede desmantelarla y usar el material para construir otra mezquita, si lo considera oportuno, y construirla cerca es mejor; pero no puede construir un pozo con el material de una mezquita. Si una dotación en un puente es destruida por una inundación y el puente no es necesario donde está, puede ser trasladado a donde se necesite; el ingreso de una dotación en una frontera que se ha vuelto segura es retenido por el administrador, en caso de que la frontera vuelva a ser segura. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672} Si una palmera datilera dotada se seca, un animal dotado queda discapacitado o las vigas de una mezquita se rompen, hay dos puntos de vista, y el más sólido es que no pueden ser vendidos, como con una mezquita. El otro punto de vista permite la venta, ya que la cosa ya no se espera que produzca beneficio; el precio entonces toma la regla del valor que proviene de la destrucción de la propiedad dotada. Si se considera que la propiedad de la sustancia de la cosa dotada pertenece al beneficiario, que es el punto de vista menos favorable, el precio va para él; si pertenece a Dios, que es la visión más evidente, se compra una cosa similar con el precio para que se convierta en una dotación en su lugar. Abu Hamid al-Isfara'ini dice que el precio compra una cosa similar para que se convierta en una dotación en su lugar, sin disputa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672} Intercambio de propiedad dotada entre los hanbalíes. Entre ellos, el intercambio está permitido cuando la cosa dotada ya no es apta para el propósito para el que fue dotada y ya no sirve para ser utilizada, ya sea mueble o inmueble, y sea mezquita o no. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} Sostienen que vender una dotación está prohibido y es inválido, y que intercambiarla, incluso por algo mejor, es inválido por texto explícito, excepto cuando su beneficio previsto se pierde por ruina y su rendimiento no puede repararlo, en cuyo caso se vende; o cuando su beneficio previsto se pierde por una causa distinta a la ruina, como madera que se ha agrietado y se teme que caiga. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} Si la dotación es una mezquita cuyo uso previsto se pierde porque es demasiado estrecha para sus personas y no se puede ensanchar, o porque su vecindario está arruinado, o porque el lugar está sucio e impide la oración en él, entonces, según al-Qadi, la venta es válida y el precio se gasta en una cosa similar, porque mantenerla así es un desperdicio de propiedad. Dado que una dotación es perpetua, cuando no se puede mantener en la misma cosa su propósito se conserva en otra, y una sucesión de reemplazos se trata como las cosas mismas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} Un árbol seco de una dotación puede venderse; también puede venderse una viga que se ha roto, desgastado o se teme que se rompa o caiga. Al-Talkhis afirma que cuando una viga de gran valor está a punto de romperse, o una casa de gran valor está a punto de derrumbarse, y se sabe que la demora la dejaría fuera de servicio, se vende para proteger su valor. Las escuelas, hospicios y caravasares que están dotados pueden, cuando están en ruinas, ser vendidos por una sola vista sin disputa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} Un caballo dotado para incursiones que ya no es apto se vende y se compra otro caballo apto para él; una vez comprado el reemplazo, se convierte en una dotación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} La estipulación de un fundador de que una dotación inutilizable no se venda es nula, y debe venderse. El vendedor es el juez cuando la dotación es para un bien público, como los pobres, mezquitas o puentes; cuando está en posesión de una persona o grupo nombrado, o para los fieles o muecines de una mezquita, el administrador especial de la dotación la vende. Aun así, es mejor hacerlo con el permiso del juez, porque tal venta obliga a quienes vienen después de los actuales poseedores, como una venta hecha contra una parte ausente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} Una vez que se compra el reemplazo para el uso de la dotación, se convierte en una dotación; el curso prudente es volver a dotarlo mediante una nueva fórmula, para que una persona posterior, sin ver que la compra lo convirtió en una dotación, no la deshaga. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} La devolución de una dotación a la propiedad del fundador. Muhammad ibn al-Hasan de los Hanafíes sostiene que si lo que rodea a una mezquita está en ruinas y ya no es necesario, incluso mientras la mezquita se mantiene, o si la mezquita misma está en ruinas sin medios para repararla y la gente ya no la necesita porque se ha construido otra mezquita, entonces regresa a la propiedad de su constructor si está vivo, o a sus herederos si ha muerto; Abu Yusuf discrepa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} La razón de Muhammad: el fundador dio la dotación a una especie de devoción, y dado que esa devoción ha terminado, la dotación termina con ella. Es como la alfombra y el césped de una mezquita cuando ya no son necesarios, o su lámpara cuando la mezquita está en ruinas, que regresan a quien los hizo; como una mortaja que una bestia ha rasgado, que regresa a su dueño; y como una ofrenda hecha por alguien a quien se le impide completar la peregrinación, de la cual puede disponer una vez que se elimina el impedimento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} Abu Yusuf dice que se traslada a otra mezquita con el permiso del juez, y sus escombros se venden con el permiso del juez y el precio se gasta en algunas mezquitas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} La consecuencia hanafi es que si una dotación cae en ruinas y no tiene ingresos para repararla, regresa al constructor o a sus herederos en la opinión de Muhammad, aunque no en la de Abu Yusuf. Pero en la opinión de Muhammad, solo lo que ha abandonado por completo el uso previsto por el fundador regresa a la propiedad, como una tienda que se quemó y no se puede alquilar por nada, o un albergue o una cisterna de barrio que está arruinada sin medios de reparación; lo que fue hecho para obtener ingresos regresa a la propiedad solo como sus escombros, mientras que su terreno abierto sigue siendo una dotación que se alquila, incluso por un pequeño alquiler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} Khulasa informa que Muhammad dijo acerca de un caballo que fue hecho una dotación retenida en el camino de Dios y se volvió inservible para montar, que se vende y su precio va a su dueño o sus herederos, como con una mezquita. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} Los shafi'ís, en la opinión opuesta a la más sólida, dicen que si una cosa dotada pierde su beneficio por una causa que no es imputable, como un árbol que se seca o es arrancado por el viento o la inundación antes de que pueda ser replantado, la dotación termina y la cosa regresa al fundador o a su heredero. La opinión shafi'í más sólida es que no regresa a la propiedad sino que permanece como una dotación; los hanbalíes están de acuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675} La administración de una dotación. Los juristas coinciden en que la administración de una dotación sigue la condición del fundador. Si la asigna a una persona nombrada, se sigue su condición, como hizo 'Umar ibn al-Khattab cuando dejó su dotación a su hija Hafsa para que la administrara durante su vida, y luego a la gente de buen juicio de su familia, como relata al-Bayhaqi. Ibn Qudama dice que la disposición de una dotación sigue la condición del fundador, y también su administrador. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675} Los juristas difieren en si el fundador puede asignarse la administración a sí mismo. Los hanafíes, shafiíes y hanbalíes lo permiten. Los malikíes dicen que si el beneficiario no ha tomado posesión de la dotación, esta queda sin efecto por la muerte, enfermedad o quiebra del fundador; si el beneficiario ha tomado posesión y el fundador estipuló la administración para sí mismo, la dotación se mantiene, pero el fundador está obligado a asignar la administración a otra persona, puesto que no puede asignársela a sí mismo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675} Si el fundador no nombra a ningún administrador, los malikíes y hanbalíes sostienen que cuando la dotación es para personas no identificadas, como los pobres o las mezquitas, el gobernante designa a quien elige, puesto que no puede administrarla él mismo. Cuando la dotación es para un beneficiario nombrado y en pleno uso de sus facultades mentales, ese beneficiario la administra, puesto que es de su propiedad y su beneficio, de modo que su supervisión es como la propiedad absoluta. Si no está en pleno uso de sus facultades mentales, su tutor la administra. En la escuela Hanbali, elegida por Ibn Abi Musa, existe la posibilidad de que el gobernante la administre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675} Sobre la administración de una donación cuando el fundador no la estipuló, las opiniones Hanafi difieren. Abu Yusuf sostiene que la donación pertenece a Dios y la administración corresponde primero al fundador, luego a su albacea y finalmente al juez. Hilal, la opinión predominante de la escuela, sostiene que la administración corresponde al fundador, luego a su albacea o al juez, porque un administrador deriva su autoridad de la estipulación del fundador, por lo que es imposible que tenga autoridad mientras otro la deriva de él; y el fundador es la persona más cercana a la donación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} Muhammad sostiene que el fundador no tiene administración a menos que la estipule, porque para él entregar la dotación a un custodio es una condición de su validez, de modo que una vez entregada, el fundador no tiene autoridad sobre ella. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} Si el fundador muere sin nombrar un administrador, el juez nombra a un custodio de entre la familia del fundador mientras se pueda encontrar a una persona idónea, ya sea porque dicha persona es la más solícita o porque el fundador quiso que la dotación se le atribuyera; solo si no se encuentra a nadie nombra a un ajeno. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} Los shafi'ís sostienen, según la visión de la escuela, que si el fundador no nombra a un administrador, la administración corresponde al juez, quien tiene autoridad general sobre tales asuntos. Una segunda opinión se la otorga al fundador, quien la tenía, y una tercera se la otorga al beneficiario, ya que los ingresos son suyos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} Las calificaciones de un administrador. Los juristas establecen varias condiciones para la idoneidad de un administrador; algunas son aceptadas y otras son disputadas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} La primera condición es la capacidad legal. Los juristas coinciden en que un administrador debe ser adulto y estar en su sano juicio, ya que un menor o una persona con enfermedad mental carece de capacidad; esto se aplica en general. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} Los malikíes y los hanbalíes añaden que si el fundador no nombra a ningún administrador y el beneficiario es una persona nombrada, como Zayd o 'Amr, el beneficiario lo administra él mismo; si es menor de edad o está demente, su tutor lo representa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} Los hanbalíes dicen que la propiedad de una cosa donada pasa al beneficiario si es un ser humano nombrado o un grupo limitado, y la administra si es adulto y sano de juicio, o lo hace su tutor si es menor de edad, demente o derrochador; Ibn Abi Musa dice que el juez la administra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} Los hanafíes: Ibn 'Abidin cita a al-Is'af que nombrar a un menor como administrador es nulo por analogía en todos los casos, y por preferencia jurídica nulo mientras sea menor de edad, de modo que la administración pasa a él cuando crezca; al-Shilbi sostiene que la asignación a un menor nunca es válida, puesto que la administración es una forma de tutela y a un menor bajo tutela no se le puede dar tutela sobre otros. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} Ibn 'Abidin cita las fatwas de Rashid al-Din que un juez que asigna la administración a un menor que es capaz de mantener la propiedad lo hace válidamente, puesto que le otorga autoridad para actuar; las dos opiniones pueden conciliarse leyendo al-Is'af como sobre un menor incapaz de actuar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} La locura impide el nombramiento y también lo termina una vez que ocurre; Ibn 'Abidin cita a al-Fath que un administrador es destituido por locura permanente que dure al menos un año, y que si se recupera, la administración le es restituida, aunque al-Nahr dice que esto se aplica a uno nombrado por el fundador y no a uno designado por el juez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} Los shafi'ís afirman que la administración es despojada por locura, y al-Shabramallisi dice que cuando una persona cuerda regresa a un administrador nombrado por el fundador, el cargo regresa por recuperación sola sin un nuevo nombramiento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} La segunda condición es la justicia (adala). Los hanafíes difieren en si es una condición de validez o de preferencia. Al-Is'af dice que nadie es nombrado excepto una persona confiable y capaz, ya sea actuando él mismo o a través de un adjunto, porque destituir a una persona deshonesta del cargo no es parte de la administración. Ibn 'Abidin sostiene que la justicia es una condición de preferencia, no de validez, y que un administrador que se vuelve malhechor merece ser destituido pero no es destituido automáticamente, como un juez que se vuelve malhechor no es destituido según la opinión sana y fatwa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} Los malikíes consideran la justicia como una condición cuando el administrador fue nombrado por el juez o por el fundador. Al-Hattab dice que la administración de una dotación retenida pertenece a quien el fundador eligió, quien debe ser alguien de confianza en la religión y la honestidad; si el fundador es negligente, la administración recae en el juez, quien nombra a alguien que aprueba. Si el administrador gestiona mal y no es de confianza, el juez lo destituye, a menos que el beneficiario sea dueño de sus propios asuntos y lo acepte. Al-Qarafi dice que un juez destituye a un administrador solo por una falta, pero el fundador puede destituirlo incluso sin ella. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} Los shafi'ís exigen justicia aparente e interna en un administrador designado por el juez. Al-Subki dice que para uno designado por el fundador, la justicia aparente debería ser suficiente; al-Adhra'i exige justicia aparente e interna también en ese caso, y al-Sharbini prefiere la primera opinión. Si el administrador se convierte en un malhechor, es destituido, y entonces la administración pasa al juez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} Al-Shafi'iyya dice que si un administrador se convierte en malhechor y luego vuelve a ser justo, su autoridad se restablece si se estableció como condición en los términos de la dotación y se mencionó con precisión; de lo contrario, no. Al-Nawawi emitió esta fatwa, e Ibn al-Rif'a y otros estuvieron de acuerdo; al-Zarkashi dice que es evidente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} Los Hanbalis sostienen que si la administración pertenece a alguien distinto del beneficiario, y el nombramiento fue realizado por el juez o por un administrador original, se requiere justicia, porque es autoridad sobre la propiedad, como la tutela sobre la propiedad de un huérfano. Si no es justo, se le retira la mano de la dotación para preservarla, y si vuelve a ser íntegro, su derecho se restablece. Si el administrador fue designado por el fundador, no se requiere justicia, y se agrega una persona de confianza al malhechor; su autoridad se retira solo cuando su remoción es necesaria para mantener la dotación, ya que preservar la dotación es más importante que dejar a un malhechor en autoridad sobre ella. Cuando la administración pertenece al propio beneficiario, sea justo o no, tiene mejor derecho a ella, ya que es dueño de la dotación y, por lo tanto, la administra para sí mismo; algunos dicen que se le agrega una persona de confianza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680} La tercera condición es la capacidad (kifaya), es decir, la fuerza y la habilidad de la persona para actuar en lo que administra. Los shafi'ís y los hanbalíes la requieren, ya que preservar una dotación es un deber religioso y alguien sin capacidad no puede preservarla. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} Si se pierde la capacidad, los shafi'ís dicen que el juez le quita la administración incluso si le fue asignada por el fundador. Al-Nawawi dice que cuando termina el defecto, su administración regresa si fue estipulada en la dotación y nombrada exactamente. Los hanbalíes dicen que si se pierde la capacidad no se le quita, sino que se le agrega un administrador fuerte y confiable para lograr el propósito. Los hanafíes dicen que el administrador debe ser destituido cuando no es confiable o es incapaz (el texto OCR dice 'el fundador' aquí, probablemente un error para el administrador, marcado como duda). Las palabras de los malikíes también implican que se requiere capacidad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680} La cuarta condición es el Islam. Los Hanbalis sostienen que un administrador debe ser musulmán si el beneficiario es musulmán o el objeto es una mezquita o similar, basándose en Surat al-Nisa, versículo 141, que citan para esta condición. Si la dotación es para un no creyente nombrado, un no creyente puede ser nombrado administrador. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680} Los Hanafis permiten que un dhimmi sea administrador y no requieren el Islam; si el juez destituye a un dhimmi por alguna razón y luego se convierte, la administración no regresa a él. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680} Al-Ramli sostiene que la analogía con el testamento y el matrimonio hace válida la administración de una dotación por parte de un dhimmi para un beneficiario dhimmi, siempre que sea recto en su religión, pero esto se rechaza porque la dotación requiere verdadera justicia; al-Shabramallisi dice que el rechazo es la opinión correcta. Él distingue el matrimonio de un dhimmi de su pupilo, donde el tutor tiene una restricción natural de querer proteger a su pupilo de la vergüenza, lo cual no se aplica a una dotación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17681} El salario del administrador. El sujeto abarca su derecho a un salario, ya sea que lo establezca el fundador o el juez, su monto, y si se le debe uno cuando ninguno lo ha especificado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17681} Sobre el derecho a un salario: los juristas sostienen que un administrador tiene derecho a un salario por su trabajo en la administración de la dotación y el cuidado de sus asuntos. La evidencia que citan incluye las palabras de 'Umar cuando dotó su tierra en Khaybar, que quien la administre puede comer en medida razonable o alimentar a un amigo sin obtener ganancias de ella; 'Ali hizo que el mantenimiento de los esclavos que dotó para trabajar la tierra fuera un cargo sobre los ingresos; la analogía con el recaudador del zakat; y el dicho atribuido al Profeta de que lo que queda después del sustento de sus esposas y el salario de su trabajador es caridad. Ibn Hajar dice que el trabajador allí es el custodio de la tierra, por lo que el dicho muestra que su salario es lícito. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} Sobre la fijación del salario. Si el fundador lo estableció, el administrador toma lo que el fundador fijó incluso si excede el salario habitual; esta es la opinión de los Hanafis, Shafi'is y Hanbalis. Los Hanafis dicen que si el fundador fijó menos que el salario habitual, el juez lo completa a petición. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} Los Shafi'is dicen que si el fundador se nombró administrador y fijó un salario para sí mismo, no puede exceder el salario habitual; si fijó más, la dotación es nula, ya que sería una dotación sobre sí mismo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} Los Hanbalis dicen que si el fundador fijó un salario declarado, y este es igual al salario habitual, el administrador lo toma; Si es más, los costos de lo que la dotación necesita, como los fideicomisarios y otros, se pagan con el excedente hasta que solo queda el salario habitual, a menos que el fundador se lo haya dado directamente. Los malikíes no fijaron ninguna cantidad y la dejaron al fundador o al juez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} Si el fundador no fijó un salario, el juez lo fija. Los hanafíes y los hanbalíes sostienen que el salario del juez no debe exceder el salario habitual, y si fija uno mayor, el excedente se retiene. Los malikíes dejan el asunto a discreción del juez; Ibn Fattuh dice que el juez puede dar al administrador designado un estipendio mensual fijo según su trabajo, como lo hacían los imanes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} Los shafi'ís dicen que si el fundador no establece un salario, el administrador no tiene salario según la opinión sana y no puede tomar nada de la dotación; si lo toma, es responsable y queda liberado solo entregándolo al juez. Si el administrador pide al juez que le fije un salario, es como un tutor de los bienes de un huérfano que pide al juez que fije sus honorarios. Al-Iraqi, quien recoge la opinión de al-Balqini, dice que el administrador entonces toma el salario donde sea necesario, ya sea el monto de su manutención, como prefería al-Rafi'i, o el menor entre su manutención y el salario habitual, como prefería al-Nawawi; otra opinión es que tiene derecho al salario habitual incluso si excede su manutención. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} Si el fundador no fijó un salario. Al-Ramli de los Hanafíes dice que al administrador no se le debe nada a menos que el juez fije un salario por su trabajo. Ibn 'Abidin concluye que cuando el fundador nombra una suma para el administrador, este la tiene, sea grande o pequeña, trabaje o no, siempre que no se establezca a cambio de trabajo; cuando el fundador no nombra nada y el juez fija el salario habitual, eso es válido; si fija más, el exceso se retiene; y si el administrador no trabaja, no se le debe ningún salario. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} Si el juez nombra a un administrador y no nombra un salario, entonces, cuando la costumbre es que el trabajo no se realiza sin el salario habitual, se le debe el salario habitual, ya que la costumbre es como una estipulación; de lo contrario, nada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} Ibn Najim, citando a al-Qunya, informa dos puntos de vista hanafíes sobre un designado por un juez que no recibe salario: el primero es que no tiene nada aunque trabaje un año; el segundo es que el custodio tiene derecho a un salario según el esfuerzo que realiza, independientemente de que el juez o los residentes del barrio le hayan fijado un salario, puesto que nadie acepta la custodia públicamente sin un salario, y la costumbre es como una estipulación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} Cuando la dotación tiene administradores, los malikíes, los hanbalíes y los shafi'íes tratan el salario de una manera particular. Los shafi'íes sostienen que si el fundador no asignó un salario al administrador, no tiene derecho a uno según la opinión correcta; si el asunto se remite al juez, se le da uno cuando hay necesidad, como se explicó anteriormente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17684} Los hanbalíes tienen tres puntos de vista. El primero es que el administrador puede comer de los ingresos de la dotación en medida razonable, sea necesitado o no, por analogía con el recaudador del zakat; esta es la opinión de Abu al-Khattab. El segundo es que toma el menor entre el salario habitual y su manutención, por analogía con el tutor de un huérfano, y tiene derecho a ello solo si es pobre. El tercero es que un administrador conocido por recibir un salario por su trabajo tiene derecho al salario habitual, que es la analogía de la escuela. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17684} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} Los malikíes, como dice Ibn Fattuh, dejan que el juez dé un estipendio mensual fijo en donaciones, fijado por su juicio de la obra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17684} La fuente del salario. La mayoría de los juristas, a saber, los hanafíes, los malikíes excepto Ibn 'Attab, los shafi'íes y los hanbalíes, sostienen que el salario del administrador, ya sea fijado por el fundador o por el juez, proviene de los ingresos de la donación, citando las palabras de 'Umar sobre su donación de que quien la administre puede comer de ella en medida razonable sin acumular propiedad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} Ibn 'Attab, de los Malikis, sostenía que el salario proviene únicamente del tesoro público; si se toma de las donaciones, se devuelve y se recupera del tesoro, y si no se entrega, su recompensa está con Dios. Al-Hattab explica que no se debe tomar nada de las donaciones porque son para legados. Ibn Warad emitió una fatwa en su opinión, pero al-Dasuqi debilitó la opinión de Ibn 'Attab. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} El trabajo que genera el salario consiste en preservar la donación, repararla, arrendarla, recolectar su producción (renta, cosecha o fruto), esforzarse por desarrollarla y gastarla en sus propósitos, tales como reparación, mantenimiento y los beneficiarios, ya que eso es lo que es costumbre para dicho trabajo. El salario comienza desde el momento en que el administrador asume el cargo y se debe en proporción al trabajo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} Los hanbalíes dicen que si un administrador descuida su deber, su salario fijo se reduce en la cantidad que su negligencia le costó a la fundación; lo que se le asignó se divide entre lo que hizo y lo que no hizo, y la parte correspondiente a lo que no hizo se pierde. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} Los hanafíes dicen que si los beneficiarios disputan con un administrador que dice que el fundador fijó un salario por trabajo mientras él no hace nada, el juez no impone tareas que los gobernantes mismos no realizan. Si se le presenta un impedimento que le impide ordenar, prohibir, tomar y dar, no tiene salario; de lo contrario, lo conserva. Si el fundador fijó un salario mayor al habitual, eso está permitido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} En un caso, el propietario de una tierra dotada murió y el juez nombró un custodio y le dio la décima parte de los ingresos, mientras que un molino en la dotación estaba en posesión de un hombre en arrendamiento de suma global y no necesitaba custodio, y los beneficiarios cobraban su producción de él; el custodio no tiene derecho a una décima parte de esa producción, ya que su salario es pago por trabajo y no hay salario sin trabajo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} La rendición de cuentas de un administrador. Es deber del administrador cobrar la producción de la dotación, gastarla en lo que la dotación necesita y pagar a los beneficiarios. Los juristas concuerdan en que debe rendir cuentas de lo que gasta, ya sea que sea requerido por el juez o por los beneficiarios. Difieren en si su palabra sobre sus gastos es aceptada sin evidencia, y, si no hay evidencia, si su juramento es requerido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} Los hanafíes dicen que el juez no necesita requerir una cuenta detallada de cada suma que el administrador ha gastado de los ingresos de la dotación; una cuenta general es suficiente si se sabe que es digno de confianza. Si es sospechoso, el juez le hace explicar punto por punto, y no lo encarcela, sino que lo cita por dos o tres días y lo advierte; si explica, bien, de lo contrario el juez le toma juramento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} Al-Durr cita a al-Qunya que si el juez sospecha de él lo hace jurar, incluso si es digno de confianza, como debe jurar un depositario que afirma que se perdió un depósito. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} Las opiniones hanafíes difieren en la afirmación de que el administrador pagó a los beneficiarios. Al-Durr dice que su palabra es aceptada sin juramento. El Is'af dice que si dice que recibió el salario y lo pagó a los beneficiarios, y estos lo niegan, su palabra es aceptada con su juramento y no es responsable, como un depositario que afirma haber devuelto un depósito cuando el depositante lo niega. El arrendatario de la propiedad dotada queda liberado por el reconocimiento del administrador de haber recibido el alquiler. Si dice que el alquiler se perdió o fue robado después de haberlo recibido, su palabra con juramento es aceptada, ya que es digno de confianza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} Ibn 'Abidin informa de al-Khayr al-Ramli que la fatwa es que jura en esta era. La Hamidiyya cita a Abu al-Su'ud dictaminando que si el administrador es un derrochador, su juramento no es aceptado sobre su gasto de la propiedad de la dotación. Al-Shilbi sostiene que a un malhechor cuya conducta infringe la Ley no se le cree sobre lo que gastó a menos que tenga pruebas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} Si la palabra de un administrador de confianza después de su remoción es aceptada: al-Hamawi dice que la opinión aparente es que sí, ya que la remoción no elimina su confiabilidad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687} Mulla Abu al-Su'ud establece una distinción adicional: si el administrador afirma haber pagado con los ingresos de una dotación a los beneficiarios que el fundador nombró como sus hijos o nietos, su palabra es aceptada; si afirma haber pagado a titulares de cargos, como el imán y el muecín, no lo es, del mismo modo que no se le cree a un hombre que contrató a un constructor por un salario conocido en una mezquita y luego afirma haberle pagado. Al-Tamartashi elogió esta distinción. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687} Los malikíes sostienen que si el fundador muere y se pierde la escritura de donación, se acepta la palabra del administrador sobre los propósitos en los que gasta, si es digno de confianza. Si afirma haber gastado el rendimiento, se acepta si es digno de confianza, a menos que la escritura tuviera testigos en su realización, en cuyo caso gasta solo con su conocimiento. Si afirma haber gastado su propio dinero en la donación, se acepta sin juramento a menos que sea sospechoso, y entonces jura. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687} Al-Hattab informa un caso presentado a al-Suri: un imán, un muecín y el administrador general de una mezquita fueron acusados años después por un inspector de mercado de un excedente del alquiler de tiendas; El administrador negó cualquier superávit y se negó a declarar sus gastos, diciendo que no estaba obligado a hacerlo y que sin él la dotación se perdería. Al-Suri dictaminó que su palabra es aceptada sobre lo que dice que gastó, si se asemeja a lo que dijo. Al-Barzali agrega que esto se aplica cuando no se estableció ninguna condición que exigiera un registro de ingresos y gastos, excepto con testigos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687} Los shafi'is distinguen entre los beneficiarios que son nombrados, como Zayd y 'Amr, cuya palabra sobre lo que se les paga es aceptada y que pueden exigir cuentas, y los beneficiarios no nombrados, como los pobres. Cuando los beneficiarios no son nombrados, se discute si el gobernante puede exigir cuentas; de dos opiniones, la más evidente es que puede. Se cree al administrador sobre la cantidad que gastó, cuando eso es probable; si el juez sospecha de él, lo hace jurar. Al-Azra'i explica que lo que se quiere decir es gastar de acuerdo con la costumbre; Los pagos a los pobres y otros fines generales están incluidos, pero el gasto en un beneficiario nombrado no es creíble, ya que ese beneficiario no le confió eso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688} Los hanbalíes distinguen al administrador que sirve sin paga de uno que recibe un salario. La palabra de un administrador voluntario es aceptada sobre un pago a un beneficiario; la palabra de un administrador pagado no es aceptada sin evidencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688} Al-Buhuti y al-Mirdawi dicen que los beneficiarios no pueden objetar a un administrador de confianza que el fundador haya designado; pueden cuestionarlo sobre lo que su dotación necesita, para que su conocimiento sea igual al de él; y el gobernante puede establecer una oficina para auditar las cuentas de la dotación cuando sea de interés público. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688} La remoción del administrador de una dotación y quién tiene derecho a removerlo. Las condiciones para un administrador y la regla cuando uno falla se establecieron anteriormente; aquí está quién puede removerlo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688} Primero, el derecho del fundador a remover a su designado. Los shafi'ís y los hanbalíes distinguen entre un fundador que al principio mantuvo la administración para sí mismo y luego la asignó a otro, y un fundador que la dio a otro desde el principio. En el primer caso puede remover y nombrar a otra persona, ya que el cesionario lo representa, como un principal remove a su agente; esta es la opinión correcta de los shafi'ís y la opinión correcta y acertada de los hanbalíes en el texto corregido de al-Furu'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688} Al-Shirbini señala que esto implica que el fundador puede destituirlo sin causa, y al-Subki lo afirma en sus fatwas; pero muchos eruditos posteriores, entre ellos Ibn Razin, dictaminaron que la destitución sin causa no está permitida. Una visión shafi'í y hanbalí le niega cualquier destitución, puesto que su propiedad ha desaparecido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17689} En el segundo caso, cuando el fundador nombra a un administrador al crear la dotación, los shafi'ís dicen que no puede destituirlo, ni siquiera por una razón de conveniencia, puesto que no tiene autoridad después de asignársela a otro. Por lo tanto, si el administrador así nombrado se destituye o se convierte en un malhechor, el nombramiento de un reemplazo corresponde al juez, no al fundador. Los hanbalíes dicen que si el fundador nombró a un administrador y estipuló para sí el derecho a destituirlo, puede destituirlo; de lo contrario, no puede. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690} Los hanafíes: Muhammad ibn al-Hasan sostiene que si el fundador estipuló para sí mismo y sus hijos el derecho a nombrar y destituir custodios, y a intercambiar la dotación, y toda esa autoridad, y luego entregó la dotación al administrador, el fundador puede destituirlo. Si no estipuló el derecho a destituir, no puede hacerlo después de la entrega, porque el administrador ocupa el lugar de los beneficiarios. Al-Sadr al-Shahid dice que la fatwa sigue la opinión de Muhammad. Ibn 'Abidin dice que esto depende de si la entrega es una condición, lo cual es para Muhammad y no para Abu Yusuf. Para Abu Yusuf el fundador tiene autoridad, ya sea que la haya estipulado o no, puesto que la entrega no es una condición; si nombra a otro, es un representante y puede destituirlo, ya sea que haya estipulado el derecho o no. Hilal, al-Fath y al-Bahr sostienen que esta es la opinión aparente, y los shaykhs de Balkh emitieron fatwa sobre la opinión de Abu Yusuf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690} Al-Ramli dice que esto es claro: la destitución es válida con o sin causa, puesto que es un representante, y un principal puede destituir a su agente en todos los casos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690} Los malikíes sostienen que el fundador no puede estipular la administración para sí mismo; sigue su propia condición al nombrar al administrador, y si nombró a una persona en particular no puede cambiarla por otra. Al-Qarafi dice que el fundador puede remover a un administrador incluso sin causa; al-Hattab dice que quien ha designado a alguien para administrar su legado puede removerlo solo por una causa que se presente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690} Segundo, el derecho del juez a remover. El juez tiene autoridad general, por lo que puede remover a un administrador que el fundador nombró si se prueba la deshonestidad del administrador o si carece de una de las condiciones requeridas; no puede removerlo sin causa. Cuando el propio juez nombró al administrador, los malikíes, los shafi'ís y algunos hanafíes sostienen que no puede ser removido excepto por una causa, como malversación u otra falta; los hanbalíes y algunos hanafíes sostienen que puede ser removido sin malversación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690} La pluralidad de administradores. Una dotación puede tener uno o más administradores, como afirman los juristas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690} Si el fundador asigna la administración a dos personas, los shafi'ís, los hanbalíes y Abu Hanifa sostienen que ninguno puede actuar solo, ya que el fundador no aceptó el juicio de ninguno por sí solo; pero si el fundador nombra a cada uno de ellos, cada uno puede actuar solo. Abu Yusuf permite que cada uno de los dos administradores actúe solo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17691} El texto hanbalí añade que si el fundador asigna la reparación de la dotación a un hombre y la recaudación de su rendimiento a otro, cada uno tiene su asignación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17691} Los shafi'ís dicen que si el fundador estipula que el administrador sea el más recto de sus hijos, y todos comparten esa rectitud, comparten el cargo; si uno es manifiestamente más recto, él solo lo ostenta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17691} Los hanafíes sostienen que si el fundador nombra a un hombre y luego nombra a un tutor para un menor, ambos son administradores, el tutor comparte el cargo; a menos que el fundador especifique, diciendo, por ejemplo, que dotó su tierra a un beneficiario nombrado y dio su administración a un hombre, y nombró a otro como albacea de su patrimonio y todos sus asuntos, en cuyo caso cada uno actúa solo dentro de su propia asignación. Ibn 'Abidin cita a al-Is'af para esto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17691} Si el fundador da la administración al más virtuoso de sus hijos y son iguales en virtud, no la comparten y pasa al mayor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} Si el fundador dio la administración a dos hombres y uno acepta y el otro se niega, o muere, o es inhabilitado, el juez nombra a otro en su lugar; los Hanafi, Shafi'i y Hanbali están de acuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} La delegación de la administración por un administrador. Excepto cuando el fundador lo permitió, los juristas sostienen que un administrador no puede delegar la administración a quien quiera ni legarla a otro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} Los hanafíes dicen que si la delegación del fundador al administrador fue general, es decir, que se encontraba en el lugar del fundador y podía asignar y legar la administración a quien quisiera, puede delegarla en salud y en su última enfermedad; si no fue general, no puede delegarla en salud, sino solo en su última enfermedad, ya que es como un albacea, y un albacea puede nombrar a otro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} Los shafi'ís afirman que si el fundador declara haber asignado la administración a una persona específica, quien puede delegarla a quien desee, la delegación es válida. Se discute si la administración del fundador cesa entonces: la postura de esta escuela es que sí, puesto que la delegación es como una transferencia de propiedad, de modo que ni el fundador ni el delegado pueden destituir al nuevo administrador, y la administración no regresa al delegador tras su fallecimiento. La postura de Al-Subki es que el delegado es el representante del delegador, por lo que si el delegador fallece, la administración regresa al delegador, y si el delegado fallece, regresa al delegador. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17693} Los hanbalíes dicen que un administrador nombrado por el fundador, si él mismo es beneficiario, puede nombrar un agente y destituirlo, ya que su autoridad es original, como una persona dispone de su propia propiedad. Si no es beneficiario, no puede nombrar un administrador ni legar el cargo, a menos que el fundador estipule que puede nombrar a quien quiera. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17693} El fin de una dotación. Una forma en que finaliza una donación es la devolución del bien donado a la propiedad del fundador: cuando el bien se arruina y ya no es apto para su uso, cuando la donación está destinada a una clase de beneficiarios que llega a su fin, o en el caso de una donación temporal, que los malikíes permiten. Estos casos se han tratado a lo largo del artículo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17693}"
  fr: "Le waqf, au sens littéral, signifie mise sous séquestre: retenir une chose pour la cause de Dieu; il signifie également préservation et immobilité, et désigne la chose mise sous séquestre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579} Techniquement, les juristes le définissent de plusieurs manières: pour les compagnons hanafites, il s’agit de la mise sous séquestre d’une chose appartenant à Dieu, son usage étant accordé à qui le donateur le souhaite; pour Abu Hanifa, il s’agit de la mise sous séquestre de la chose appartenant au donateur, son usage étant donné à titre aumônier; pour les malikites, il s’agit de la concession de l’usage d’une chose tant qu’elle existe, la propriété restant même théoriquement entre les mains du donateur; pour les chaféites, il s’agit de la mise sous séquestre d’un bien dont l’usage peut être obtenu tout en conservant sa substance, la disposition de la propriété étant suspendue, pour un but licite et existant; pour les hanbalites, il s’agit de la mise sous séquestre par un propriétaire de son bien dont l’usage est conservé en substance, les revenus étant donnés à une œuvre de charité implorant la faveur divine. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579} Mots apparentés: tabarru' (don sans contrepartie, plus large que le waqf), sadaqa (don du vivant sans contrepartie, qui peut aussi désigner le waqf, comme dans le cas des terres d'Umar), hiba (don sans contrepartie), 'ariya (autorisation d'utiliser une chose tant que son propriétaire la conserve) et wasiyya. La différence avec un don réside dans le fait que le waqf transfère l'usage tandis que la substance reste la propriété de Dieu et ne peut être aliénée, alors qu'un don transfère la chose elle-même. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581} Wasiyya: les Hanafites la définissent comme un transfert de propriété attaché à ce qui subsiste après la mort, et les Shafi'ites ont une définition similaire. Le waqf diffère du waqf: un legs prend effet après le décès et peut porter sur la propriété ou sur son usage, tandis que le waqf est un don effectué du vivant et ne porte que sur l’usage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581} La légalité du waqf: la majorité des juristes le considèrent comme licite, obligatoire et un acte de dévotion recommandé. Ils citent le hadith d’Ibn 'Umar selon lequel 'Umar reçut des terres à Khaybar et le Prophète lui dit que, s’il le souhaitait, il pouvait en conserver les biens et en donner les fruits en aumône; le hadith selon lequel, à la mort d’un homme, ses actions cessent, à l’exception de trois, dont la perpétuation de l’aumône; et le hadith de Jabir selon lequel chaque homme riche parmi les émigrants et les bienfaiteurs conservait des biens pour les aumônes perpétuelles. Ibn Qudama qualifie ce consensus de celui des Compagnons. Ibn 'Abidin, citant al-Is'af, rapporte que le waqf est licite selon Abu Hanifa et ses compagnons. Le désaccord porte sur son caractère obligatoire: pour Abu Hanifa, il s'apparente à un prêt d'usage, la propriété restant acquise au constituant. Le waqf n'est contraignant que par décision de justice ou lorsqu'il est constitué par legs. Ibn Qudama rapporte que Shurayh ne l'accepte pas. Quant à son statut juridique: il s'agit fondamentalement d'un acte de dévotion recommandé; il devient obligatoire lorsqu'il est contracté par vœu; il est permis lorsqu'il n'est pas constitué par dévotion, comme le waqf d'un dhimmi, qui n'entraîne aucune récompense. Le waqf est interdit lorsqu'il sert le péché, comme par exemple lorsqu'il est constitué en dot pour une église. Les Malikites mentionnent qu'une dot réservée aux fils et non aux filles est interdite car elle ressemble à une coutume préislamique, mais Ibn al-Qasim préférait la désapprouver et l'appliquer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17582}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583} Les piliers du waqf: la majorité (Malikites, Chafi'ites, Hanbalites) en comptent quatre: la formule, le donateur, le bénéficiaire et le bien légué; les Hanafites ne retiennent que la formule. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583} Le waqf n'est pas valable sans offre, et les juristes divergent quant à la nécessité de l'acceptation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583} La formule de l'offrande: tout ce qui manifeste l'intention du donateur par la parole, un signe clair, un écrit ou un acte. Les termes exprès sont « J'ai doté » (waqaftu), considérés comme exprès par les Malikites, les Chafi'ites et les Hanbalites, et « J'ai retenu » (habastu), exprès pour les Hanbalites, l'avis malikite et l'avis chaféite le plus solide. Enfin, « J'ai ouvert un chemin » (sabbaltu), exprès pour les Chafi'ites et les Hanbalites dans l'avis le plus solide, car la coutume en a fixé l'usage et les paroles du Prophète à 'Umar utilisent la même formule. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17584} Les termes allusifs sont « J’ai donné en aumône » (tasaddaqtu), que les Hanbalites et les Malikites considèrent comme allusifs, et que les Shafi’ites considèrent comme exprimatifs lorsqu’ils sont associés à un bénéficiaire général tel que les pauvres, et autrement allusifs; également « J’ai interdit » et « J’ai rendu éternel », allusifs pour les Hanbalites et l’avis plus solide des Shafi’ites; ils ne constituent un waqf que lorsqu’il est associé à un signe clair, tel que « une aumône dotée », « une aumône qui ne peut jamais être vendue, donnée ou héritée », ou lorsque l’intention est ajoutée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17584}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17585} Lorsque l'administrateur détient, sur les revenus de la dotation, une somme qui peut légitimement être affectée à une œuvre de charité, telle que le rachat de captifs musulmans ou l'aide à un combattant en détresse, et que la dotation nécessite des réparations, alors: si le report des réparations jusqu'aux revenus de l'année suivante ne cause aucun préjudice manifeste qui menace la ruine de la dotation, les revenus sont affectés à l'œuvre de charité et les réparations sont reportées; si le report cause un préjudice manifeste, les revenus sont d'abord affectés aux réparations et seul le surplus est affecté à l'œuvre de charité. Ibn Najim affirme qu'un administrateur qui verse des paiements aux bénéficiaires alors que des réparations urgentes sont dues en devient responsable, car l'entretien du bien de mainmorte est exclu des droits des pauvres. Pour les hanafites, lorsque des réparations sont nécessaires, comme la surélévation d'un toit ou la construction d'un mur, elles priment sur tout autre usage, car il n'est pas convenable de laisser une mosquée se délabrer au profit des biens destinés à l'imam et au muezzin; tout excédent des frais de réparation revient au bénéficiaire le plus proche du dessein du fondateur, dont la perte lui causerait un préjudice manifeste. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} Lorsque la réparation n'est pas nécessaire, de sorte que la reporter aux revenus de l'année suivante ne risquerait pas d'endommager le bien, le besoin le plus important prime. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} Les Hanafites distinguent le cas où le fondateur a stipulé que la réparation soit prioritaire chaque année, auquel cas l'administrateur met de côté la somme nécessaire chaque année, même si elle n'est pas encore requise, du cas où le fondateur n'a pas stipulé que la réparation devait être effectuée en cas de besoin, sans mettre de côté quoi que ce soit à cet effet. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} Lorsqu'une partie d'un bâtiment légué ou de ses matériaux s'est effondrée, le juge consacre les fonds à la réparation; si les moyens de réparation ne sont pas immédiatement disponibles, il les conserve jusqu'à ce qu'ils le soient. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} Pour les chaféites, l'excédent des revenus d'une mosquée, au-delà des besoins de réparation calculés en fonction du coût de sa reconstruction, est épargné. Le solde est utilisé pour acquérir un bien et le doter d'une dot. Cette pratique est plus sûre pour la mosquée, car l'acquisition n'est pas prélevée sur le bien doté dont elle assure l'entretien, puisque le fondateur a constitué cette dot à cet effet. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} Les juristes divergent quant à la source de financement du bien doté et de son entretien. Les hanafites et les malikites estiment que ce financement provient des revenus de la dot, que le fondateur l'ait stipulé ou non, car la dot est une aumône continue, accomplie selon la volonté divine, et ne peut se perpétuer que de cette manière. Les malikites ajoutent qu'une stipulation contraire est nulle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} Pour les Hanafites, si le fondateur a donné une maison à son fils pour y habiter, les réparations incombent à celui qui y vit, sur ses propres deniers et non sur les revenus, car la charge suit le bienfait. S'il refuse ou ne peut payer pour cause de pauvreté, le juge loue la maison, soit à lui, soit à un tiers, et la répare grâce aux loyers perçus. Celui qui refuse n'est pas contraint d'effectuer les réparations. Les Malikites partagent cet avis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} Les Malikites affirment qu'un cheval destiné aux raids est nourri avec les fonds publics; s'il n'y a pas de trésor, il est vendu et le prix obtenu sert à acheter des armes et autres biens similaires ne nécessitant pas d'alimentation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} Les écoles chaféite et hanbalite suivent les conditions du fondateur. Pour les chaféites, la nourriture, l'équipement et les réparations sont pris en charge par la source désignée; à défaut, par les revenus propres de la chose, tels que les gains d'un esclave ou les loyers d'une propriété; si ces revenus cessent, la nourriture et l'équipement sont pris en charge par le trésor public, tandis que les réparations ne sont alors dues par personne, car une propriété est assimilable à une propriété absolue, contrairement à un animal vivant, dont la vie et le caractère sacré doivent être préservés. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663} Pour les hanbalites, ce sont les conditions du fondateur qui prévalent. S'il a désigné une source de nourriture, qu'il s'agisse des revenus ou d'une autre, c'est celle-ci qui est respectée. Si le donateur n'a désigné aucun bénéficiaire et que le bien légué est un être vivant, comme un esclave ou un cheval, il est nourri par ses propres revenus; en l'absence de revenus, la nourriture incombe au bénéficiaire désigné. Si la nourriture est impossible, le bien est vendu et son prix est utilisé pour acquérir un autre bien qui devient une dotation; s'il peut être loué, il l'est pour un montant suffisant à sa nourriture. Si le bénéficiaire n'est pas désigné, comme c'est le cas pour les personnes démunies, la nourriture provient du trésor public. Pour les biens, tels que les bâtiments, les armes et les marchandises, la réparation n'est due par personne, sauf si le fondateur l'a exigée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663} Les juristes s'accordent à dire que quiconque endommage indûment une dotation, par démolition ou autrement, doit payer. Pour les Hanafites, un homme qui loue une maison dotée d'une dotation et dont le locataire utilise la cour pour attacher des animaux et la détériore, est responsable, car il a agi sans autorisation. Pour les Malikites, quiconque détruit indûment une dot doit la reconstruire à l'identique, même si la partie détruite était délabrée; cependant, l'avis prépondérant parmi eux est qu'il doit en rembourser la valeur, comme pour tout autre bien détruit. Ibn 'Arafa a adopté cet avis et 'Iyad l'a largement diffusé. Pour les Chafi'ites, nul n'est responsable d'un livre légué pour l'étude et perdu entre ses mains sans faute de sa part; mais quiconque est fautif l'est, et utiliser le livre à des fins autres que celles prévues constitue une faute. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663} Lorsqu'un bien de dotation nécessite des réparations ou un entretien et que ses revenus sont insuffisants, l'administrateur peut-il emprunter sur la dotation et a-t-il besoin d'une autorisation ? Les Malikites, les Hanbalites et, selon une certaine opinion, les Hanafites, estiment que l'administrateur peut emprunter pour la dotation sans l'autorisation du juge, comme pour ses autres actes, puisqu'il est un mandataire de confiance doté de pleins pouvoirs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} Les Malikites affirment que si un administrateur s'est engagé, lors de sa prise de fonction, à dépenser de ses propres deniers pour la dotation en cas de besoin, il n'est pas tenu par cet engagement, mais il peut recouvrer les sommes dépensées. Pour les shafi'ites, l'administrateur ne peut emprunter sans l'accord du fondateur ou l'autorisation du souverain. Ce dernier peut lui prêter de l'argent provenant du trésor public, l'autoriser à emprunter ou lui permettre d'utiliser ses propres fonds pour des réparations, à condition qu'il puisse les recouvrer. S'il emprunte sans autorisation ni condition, cela est interdit et il ne peut recouvrer les sommes dépensées, car il a commis une transgression. L'avis hanafite prédominant est que l'emprunt sur une dot n'est pas autorisé, sauf si les fonds sont nécessaires à son bon fonctionnement, par exemple pour des réparations ou l'achat de semences, et alors seulement sous deux conditions: l'autorisation du juge et l'impossibilité de louer le bien et d'en percevoir les loyers. Si le juge est éloigné, l'administrateur peut emprunter de sa propre initiative. Ibn 'Abidin affirme qu'emprunter n'est pas permis sans l'autorisation du fondateur, car une dette n'engage que la responsabilité d'une personne; une fondation pieuse n'engendre aucune responsabilité, les pauvres ont une dette mais, en pratique, il est impossible de les poursuivre, de sorte que la dette incombe uniquement à l'administrateur. La nécessité prime sur cette analogie; l'avis privilégié d'Abu al-Layth est qu'emprunter est permis avec la permission du juge lorsqu'il n'y a pas d'autre solution et que le juge est proche de l'administrateur, car l'autorité du juge couvre plus largement les intérêts publics des musulmans. Lorsqu'il existe une alternative, comme le paiement des bénéficiaires, emprunter à cette fin n'est pas permis, sauf pour les sommes destinées à l'imam, au prédicateur et au muezzin, ainsi que pour les tapis et l'huile de la mosquée, selon l'avis privilégié. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} Si l'autorisation du juge est requise et que l'administrateur prétend l'avoir obtenue, cette affirmation n'est apparemment pas acceptée sans preuve, car il souhaite puiser dans les revenus, et sa parole ne vaut que pour ce qu'il a en sa possession. S'il n'a pas obtenu d'autorisation, il lui est interdit de prélever sur les revenus, puisqu'il est alors considéré comme un bénévole, jusqu'à ce que l'autorisation soit établie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} Ibn 'Abidin indique que si l'administrateur a dépensé ses propres fonds pour réparer le bien de mainmorte, il peut les recouvrer sur les revenus de celui-ci; la fatwa d'al-Hanuti soutient qu'il peut les recouvrer en conscience, mais sa demande n'est pas acceptée à moins qu'il n'ait fourni des témoins attestant qu'il a dépensé pour ce recouvrement. Ceci s'applique uniquement lorsque le bien de mainmorte génère des revenus; en l'absence de revenus, l'autorisation du juge est nécessaire. Deuxièmement, la vente et l'échange d'une dot. Lorsqu'un bien donné en dot est inutilisable, les écoles hanafite, malikite, hanbalite et, selon une certaine opinion, chaféite, autorisent sa vente et l'utilisation du prix d'achat pour l'acquisition d'un bien similaire. Les hanafites autorisent la vente et l'échange même lorsque la dot n'est pas inutilisable, sous certaines conditions; les malikites, en général, font la distinction entre biens immobiliers et biens mobiliers. Les hanafites reconnaissent trois cas d'échange. Dans le premier, le fondateur stipule, lors de la constitution de la dot, que le terrain donné peut être échangé contre un autre terrain, soit pour lui-même, soit pour un tiers. Deux formules sont possibles; La première option consiste à dire: « Ma terre est une donation perpétuelle à Dieu, à condition que je la vende et acquière une autre terre avec le prix de vente. » La seconde terre est alors donnée en donation selon les mêmes conditions que la première. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} Abu Yusuf, Hilal et al-Khassaf estiment que la donation et la condition sont valides par préférence juridique, ce qui correspond à l’avis le plus fiable selon les fatwas de Qadikhan. La condition n’annule pas la donation, car une donation peut être transférée d’une terre à une autre, la seconde se substituant à la première. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} Par exemple, si un usurpateur inonde une terre donnée en dot au point de la rendre impropre à la culture, il en paie la valeur et acquiert une autre terre qui devient une dot aux mêmes conditions que la première; de même, si son rendement a chuté à cause d’une maladie et n’excède pas ses coûts, l’intérêt de la dot réside dans l’échange, de sorte que le fondateur peut valablement stipuler le droit d’échange même si le besoin ne se fait pas sentir immédiatement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} Muhammad et Yusuf ibn Khalid al-Samti soutiennent que la dot est valide et la condition nulle, ce qui correspond à l’avis par analogie. Sarakhsi justifie l'avis de Muhammad: la condition n'empêche pas la dissolution de la dot, qui est donc accomplie, tandis que l'échange constitue en soi une condition nulle, à l'instar d'une mosquée où un échange est stipulé ou où il est stipulé que seules certaines personnes peuvent y prier. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} Certains juristes hanafites affirment que la dot et la condition sont toutes deux nulles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} Kamal ibn al-Humam rapporte d'al-Ansari que la condition est valable, mais que la vente ne peut être effectuée qu'avec l'autorisation du juge. Ce dernier doit autoriser une vente lorsqu'il n'y a aucun avantage pour la dot et qu'il estime qu'elle est préférable pour ses bénéficiaires. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} Si le fondateur a stipulé que le terrain soit vendu et qu'un autre soit acheté au même prix, sans ajouter de nouvelle formule de dotation, le second terrain devient une dotation aux mêmes conditions que le premier, sans nouvelle formule, car le terrain était déjà affecté à la dotation et son prix le remplace. Par analogie, la dotation serait nulle, puisqu'aucun autre terrain n'a été désigné pour se substituer au premier. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} Seconde formule: si le fondateur a stipulé le droit d'échange pour l'administrateur et non pour lui-même, l'administrateur peut échanger pour lui-même, car le fait de conférer un pouvoir à autrui découle du fait de posséder soi-même ce pouvoir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} Si le droit d'échange est stipulé pour une autre personne conjointement avec le fondateur, seul le fondateur détient ce droit, et l'autre personne ne le détient pas seule. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} L'échange stipulé est autorisé même si le bien génère des revenus et des bénéfices, car la dotation n'entraîne pas pour autant une perte d'usage, et ni l'intervention directe du juge ni l'absence de revenus pour la réparation ne sont requises. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} Les Hanafites limitent l'échange à ce que le fondateur a spécifié en nature et en type: s'il a stipulé un échange pour un terrain, celui-ci ne peut porter sur une maison; S'il a stipulé que le terrain appartenait à un village, il ne peut l'échanger contre un autre terrain, car les terrains villageois diffèrent en termes de coût et de rendement. S'il n'a pas précisé le remplacement, il peut procéder à l'échange contre tout bien immobilier, qu'il s'agisse d'un terrain, d'une maison ou d'une ville, à son gré, la stipulation étant générale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} Si la stipulation ne prévoit qu'un seul échange, le fondateur ne peut échanger le second terrain contre un troisième, car la condition n'a été remplie que pour le premier, sauf stipulation contraire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} Deuxième cas: le fondateur n'a pas stipulé d'échange lors de la donation, qu'il ait expressément indiqué son absence ou qu'il soit resté silencieux, mais la donation est parvenue à un état où elle ne procure aucun bénéfice, par exemple aucun rendement ou ne couvre plus ses frais d'entretien. L'échange est autorisé dans ce cas, selon l'avis le plus judicieux, lorsque le juge le permet et en perçoit l'intérêt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} Ibn 'Abidin rapporte d'al-Bahr que les propos de Qadikhan divergent: d'un côté, il autorisait le juge à échanger sans l'accord du fondateur lorsqu'il en constatait l'intérêt; de l'autre, il l'interdisait même lorsque la terre était devenue impropre à toute utilisation. L'avis le plus judicieux est que le juge peut procéder à un échange aux conditions suivantes, la première étant que le bien légué soit totalement mis hors d'usage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} Parmi les conditions d'échange, selon les Hanafites: la vente ne doit pas se faire à un prix manifestement inférieur à la valeur du bien; le bien légué doit générer un certain rendement permettant sa réparation; L'échangeur doit être un homme de savoir et d'action, afin que les dotations des musulmans ne soient pas compromises; le remplacement doit être un bien immobilier et non de l'argent liquide; et le bien ne peut être vendu à une personne dont le témoignage ne peut être accepté en sa faveur ni à un créancier des héritiers du fondateur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} Le bien échangé et le remplacement doivent être de même nature. Ibn 'Abidin, citant Qanali-zada, indique que l'identité de nature n'est probablement pas requise pour une dot détenue pour son rendement, car ce qui compte est un rendement important et un entretien minimal: il est préférable d'échanger une boutique contre un terrain dont le loyer est équivalent à celui de la boutique, car la terre dure plus longtemps et nécessite moins de réparations; en revanche, une dot détenue pour la résidence est jugée en fonction de la résidence elle-même. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} Dans l'école al-Qunya, une dotation de maison ne peut être échangée contre une autre maison que si la nouvelle se situe dans le même quartier ou dans un quartier plus favorable; l'inverse n'est pas permis, même si la maison détenue est plus grande en superficie, en valeur et en loyer, car elle risque de se délabrer dans le quartier moins favorable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} Le Bahr al-Ra'iq, citant le commentaire du poème d'Ibn Wahban, demande si l'échange est autorisé lorsque le fondateur l'a interdit, ou lorsque l'administrateur est destitué avant l'échange, ou encore lorsqu'il est destitué dès qu'il décide d'échanger. Tarsusi répond qu'il n'existe pas de règle transmise et que, selon les règles de l'école, le juge peut procéder à l'échange s'il en perçoit l'intérêt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} Le même ouvrage rapporte de Muhammad que si le rendement d'une terre donnée en dot diminue et que l'administrateur peut acquérir, avec son prix, une autre terre plus productive, il peut la vendre et l'acheter. Certains cheikhs interdisaient la vente et l'échange, que la dot ait cessé de produire ou non. Qadikhan affirme qu'une dot sans stipulation d'échange ne peut être vendue ni échangée, même si la terre est saumâtre et inutilisable, car une dot est par nature perpétuelle et ne se vend pas; le pouvoir d'échange ne découle que d'une stipulation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} Troisième cas: le fondateur n'a pas stipulé d'échange; la dot produit et n'est pas immobilisée; L'échange présenterait toutefois un avantage général, et le bien de remplacement serait plus profitable et plus productif. Ibn 'Abidin affirme que, selon l'avis majoritaire établi par Qanali-zada, cela n'est pas permis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} Ibn 'Abidin rapporte également d'al-Ashbah qu'une dotation productive ne peut être échangée que dans quatre cas: premièrement, lorsque le fondateur a stipulé l'échange; deuxièmement, lorsqu'un usurpateur a inondé le terrain, auquel cas il en paie la valeur et l'administrateur acquiert un terrain avec cette somme; troisièmement, lorsque l'usurpateur nie la saisie et qu'il n'y a aucune preuve, auquel cas l'administrateur utilise la valeur du bien pour acquérir un bien de remplacement; et quatrièmement, lorsqu'une personne désire le terrain et propose un bien de remplacement plus productif et mieux situé, ce qui est permis par l'avis d'Abu Yusuf et fait l'objet d'une fatwa, comme en témoignent les fatwas de Qari al-Hidaya. L'auteur d'al-Nahr affirme que la réfutation de Sadr al-Shari'a s'y oppose: « Nous ne donnons pas de fatwa sur l'avis d'Abu Yusuf. » {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} L'échange de biens acquis par donation chez les Malikites est une question importante. Les Malikites distinguent les biens immobiliers des biens mobiliers lors de la vente et de l'échange. Ils autorisent l'échange de biens mobiliers lorsqu'aucune partie ne peut les entretenir et qu'ils risquent de périr, ou lorsque leur utilité a cessé et qu'ils ne peuvent plus être utilisés aux fins pour lesquelles ils ont été acquis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} Ainsi, un cheval acquis par donation selon la volonté de Dieu, pour des raids ou la garde des frontières, est nourri par le trésor public; s'il n'y a pas de trésor, il est vendu et le prix permet d'acheter des armes et autres biens similaires ne nécessitant pas de nourriture. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} Tout bien meuble non immobilier et inutilisable est vendu, comme un cheval atteint de la rage, un tissu usé, un esclave vieillissant ou des livres abîmés. Son prix est utilisé pour acquérir un bien similaire si possible, ou une part de ce bien si l'acquisition de la totalité est impossible; si cela s'avère impossible, le prix est donné en aumône. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} De même, les animaux mâles destinés à la chasse ou à la reproduction, lorsqu'ils sont en surnombre, ou les femelles devenues trop âgées pour être utiles, sont vendus et de jeunes femelles sont achetées avec le produit de la vente, afin que la production de lait et la descendance se poursuivent et que le bien demeure, comme le dit al-Dardir à propos des autruches. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} Concernant les biens immobiliers, l'école malikite considère qu'ils ne peuvent être vendus, même s'ils sont en ruine et inutilisables, qu'il s'agisse d'une maison, d'un magasin ou d'un autre bâtiment, et qu'ils ne peuvent être échangés contre un bien similaire en bon état. Abu al-Faraj rapporte de Malik que l'imam peut le vendre s'il en reconnaît la valeur et utiliser le prix de vente pour acquérir un bien similaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} Certains malikites autorisaient l'échange d'une habitation en ruine. Al-Taj wal-Iklil rapporte l'interdiction absolue de vendre une habitation en ruine appartenant à une fondation pieuse. Ibn al-Jahm explique cela par le fait que quelqu'un sera trouvé pour la réparer en la louant pendant des années, afin qu'elle retrouve son état antérieur. L'échange d'une habitation en ruine contre une habitation intacte est controversé. Ibn Rushd affirme que si un tel terrain est devenu inutilisable et ne peut être ni réparé ni loué, il n'y a pas d'inconvénient à l'échanger contre un lieu qui sera doté d'une dot à sa place, par décision du juge après que la cause ait été prouvée et que l'avantage de la dot soit clair; ceci doit être consigné par écrit et attesté. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} Les Malikites autorisent la vente de biens immobiliers pour l'agrandissement nécessaire d'une mosquée, que la dot soit constituée pour des personnes nommées ou non. Ibn Rushd indique que le rapport apparent du recueil d'Ibn al-Qasim l'autorise pour chaque mosquée, tout comme l'avis de Sahnun. Al-Nawadir rapporte, d'après Malik et d'autres, que cette règle s'applique aux mosquées collectives lorsque le besoin s'en fait sentir, et non aux mosquées de quartier, car le besoin y est différent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} Les biens en dot peuvent également être vendus pour agrandir un cimetière ou une voie publique, même contre la volonté des bénéficiaires ou de l'administrateur; les bénéficiaires sont tenus de faire investir le prix de la vente dans une autre dot, mais le juge ne peut les contraindre à accepter une dot différente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} Al-Sharh al-Saghir indique que, pour les biens saisis pour agrandir une mosquée, le prix est payé si la dot était constituée au nom de personnes nommément désignées. Si le bien était destiné à des personnes non nommées, comme les pauvres, aucune compensation n'est due, puisqu'aucun nom n'y est attaché, et la récompense que le fondateur obtient lorsque le bien entre dans la mosquée est supérieure à ce qu'il avait initialement prévu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} Les Malikites affirment que si le fondateur a stipulé des modifications et des échanges, sa condition doit être respectée. S'il a stipulé que, si un prix convenable était offert, le bien serait vendu et un autre acquis, al-Nawadir et al-Mutiyya rapportent que cela n'est pas permis; si cela est néanmoins fait, la décision est maintenue et la condition du fondateur est appliquée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} Fath al-'Ali al-Malik rapporte le cas suivant: un terrain en dot situé sur une route empruntée par les musulmans, dont le fondateur avait stipulé qu'il ne pouvait être ni vendu ni échangé, fut échangé par l'administrateur de la route contre un terrain domanial. L'administrateur céda le terrain en dot à un agriculteur et reçut en échange le terrain domanial. Dardir soutient que lorsque le fondateur a stipulé l'absence d'échange et n'a prévu aucune exception, l'échange est nul; l'administrateur doit restituer le terrain domanial à son propriétaire et reprendre le terrain en dot, et le souverain s'oppose à tout refus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} Échange de biens en dot chez les Shafi'ites. Le Muhadhdhab affirme que si une mosquée est léguée puis détruite au point que la prière y cesse, elle ne revient pas à son propriétaire, et ce dernier ne peut en disposer. En effet, ce qui a été cédé au droit de Dieu ne revient pas à la propriété par la ruine, de même qu'un homme qui affranchit un esclave et devient ensuite invalide ne peut le réclamer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} Al-Sharbini indique que l'avis le plus judicieux autorise la vente des tapis d'une mosquée léguée lorsqu'ils sont usés, ainsi que des poutres lorsqu'elles sont brisées ou presque et bonnes à brûler, afin d'éviter leur perte et l'encombrement inutile de l'espace. Il est préférable qu'une petite partie de leur prix soit reversée à la légitimité de la légitimité plutôt que de les perdre. Ces biens ne sont pas considérés comme une vente de la légitimité de la légitimité, puisqu'ils sont considérés comme inexistants. C'est l'avis sur lequel se sont appuyés les deux cheikhs al-Rafi'i et al-Nawawi. Al-Rafi'i affirme que l'analogie est celle de l'achat d'un tapis de remplacement au prix de l'ancien, tandis qu'al-Adhra'i compare ce cas à celui de la paille utilisée dans l'argile. Les tapis donnés ou achetés pour une mosquée sont vendus en cas de besoin. Les poutres pouvant servir à d'autres usages, comme les planches et les portes, ne sont jamais vendues. Si une mosquée menace de s'effondrer, le juge peut la démanteler et utiliser les matériaux pour construire une autre mosquée, s'il le juge opportun, et si la construction à proximité est préférable; en revanche, il ne peut pas construire un puits avec les matériaux d'une mosquée. Si une dotation sur un pont est détruite par une inondation et que le pont n'est plus nécessaire à son emplacement initial, il peut être déplacé là où il est requis. Les revenus d'une dotation sur une frontière sécurisée sont conservés par l'administrateur, au cas où la frontière serait rétablie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672} Si un palmier dattier donné en dot se dessèche, si un animal donné en dot est blessé ou si les poutres d'une mosquée se brisent, deux avis s'opposent. Le plus raisonnable est que ces biens ne peuvent être vendus, comme une mosquée. L'autre avis autorise la vente, car on n'espère plus que le bien procure un bénéfice; le prix est alors déterminé par la valeur résultant de la destruction du bien donné en dot. Si la propriété du bien donné en dot est considérée comme appartenant au bénéficiaire, ce qui est l'avis le moins favorable, le prix lui revient; si elle appartient à Dieu, ce qui est l'avis le plus évident, un bien similaire est acquis avec le prix pour constituer une dotation en remplacement. Abou Hamid al-Isfara'ini affirme que le prix d'achat permet d'acquérir un bien similaire qui deviendra une dot, sans conteste. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672} L'échange de biens donnés est autorisé chez les Hanbalites. Selon eux, l'échange est permis lorsque le bien donné n'est plus adapté à l'usage pour lequel il a été constitué et ne sert plus, qu'il s'agisse d'un bien meuble ou immeuble, et qu'il s'agisse ou non d'une mosquée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} Ils considèrent que la vente d'une dot est interdite et invalide, et que son échange, même contre un bien de meilleure qualité, est invalide selon un texte explicite, sauf si son bénéfice escompté est perdu par ruine et que son rendement ne permet pas sa réparation, auquel cas il est vendu; ou si son bénéfice escompté est perdu pour une autre raison que la ruine, comme du bois fendu qui menace de tomber. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} Si le bien de mainmorte est une mosquée dont l'usage prévu est perdu parce qu'elle est trop étroite pour ses fidèles et ne peut être agrandie, ou parce que son voisinage est en ruine, ou encore parce que le lieu est insalubre et empêche la prière, alors, selon al-Qadi, la vente est valable et le prix est dépensé pour un bien similaire, car le conserver en l'état constitue un gaspillage. Puisqu'un bien de mainmorte est perpétuel, lorsqu'il ne peut être conservé dans le même bien, son but est préservé dans un autre, et une succession de biens de remplacement est traitée comme les biens eux-mêmes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} Un arbre de mainmorte desséché peut être vendu; de même qu'une poutre cassée, usée ou dont on craint qu'elle ne se casse ou ne tombe. Al-Talkhis explique que lorsqu'une poutre fortifiée est sur le point de se briser, ou qu'une maison fortifiée est sur le point de s'effondrer, et qu'il est connu qu'un retard la rendrait inutilisable, elle est vendue pour préserver sa valeur. Les écoles, les hospices et les caravansérails dotés d'un fonds de dotation peuvent, en cas de ruine, être vendus d'un commun accord. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} Un cheval donné en dotation pour des raids, devenu inapte, est vendu et remplacé par un autre cheval apte à cet usage; une fois acquis, ce cheval devient à son tour un bien de dotation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} La clause du fondateur interdisant la vente d'un bien de dotation inutilisable est nulle, et celui-ci doit être vendu. Le vendeur est le juge lorsque le bien de dotation est destiné à un bien public, comme l'aide aux pauvres, la construction de mosquées ou de ponts; lorsqu'il est détenu pour une personne ou un groupe nommément désigné, ou pour les fidèles ou les muezzins d'une mosquée, c'est l'administrateur spécial du bien de dotation qui procède à la vente. Néanmoins, il est préférable d'obtenir l'autorisation du juge, car une telle vente lie les héritiers, comme une vente conclue contre une partie absente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} Une fois le bien de remplacement acquis pour l'usage de la dotation, celui-ci devient une dotation; la prudence recommande de la reconstituer selon une nouvelle formule, de peur qu'une personne ultérieure, ignorant que l'achat en a fait une dotation, ne la défasse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} Le retour d'une dotation à la propriété du fondateur. Muhammad ibn al-Hasan, de l'école hanafite, soutient que si les abords d'une mosquée sont en ruine et deviennent inutiles, même si la mosquée est entretenue, ou si la mosquée elle-même est en ruine et irréparable, et qu'elle n'est plus nécessaire car une autre mosquée a été construite, alors la propriété revient à son constructeur s'il est vivant, ou à ses héritiers s'il est décédé. Abu Yusuf est d'un avis contraire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} Selon Muhammad, le fondateur a fait don de la mosquée pour une forme de dévotion, et cette dévotion ayant pris fin, la propriété prend fin avec elle. C'est comme le tapis et l'herbe d'une mosquée, devenus inutiles, ou sa lampe lorsque la mosquée est en ruine, qui retournent à celui qui les a faits; comme un linceul déchiré par une bête, qui retourne à son propriétaire; et comme une offrande faite par celui qui est empêché d'accomplir le pèlerinage, dont il peut disposer une fois l'obstacle levé. Abu Yusuf rapporte que, selon la doctrine de la mosquée Noor (volume 3, p. 17674), le bâtiment est déplacé vers une autre mosquée avec l'autorisation du juge, et que ses débris sont vendus, toujours avec l'autorisation du juge, le produit de la vente servant à la construction de nouvelles mosquées. D'après l'école hanafite, si un bien de mainmorte tombe en ruine et qu'aucun revenu ne permet sa réparation, il revient, selon Muhammad, au constructeur ou à ses héritiers, contrairement à l'avis d'Abu Yusuf. Cependant, selon Muhammad, seuls les biens ayant perdu leur vocation première retournent à la propriété, comme une boutique incendiée et invendable, ou une auberge ou une citerne de quartier en ruine et irréparable. Ce qui était destiné à générer des revenus ne retourne à la propriété que sous forme de débris, tandis que le terrain non bâti demeure un bien de mainmorte pouvant être loué, même à un loyer modique. Khulasa rapporte que le Prophète Muhammad a dit, au sujet d'un cheval mis en dot pour la cause de Dieu et devenu impropre à la monte, qu'il est vendu et que son prix revient à son propriétaire ou à ses héritiers, comme pour une mosquée. Les chaféites, dans l'avis contraire à l'avis majoritaire, affirment que si un bien mis en dot perd son bénéfice pour une cause non imputable à Dieu, comme un arbre qui se dessèche ou est déraciné par le vent ou une inondation avant d'avoir pu être replanté, la dot prend fin et le bien retourne au donateur ou à son héritier. L'avis chaféite majoritaire est que le bien ne retourne pas à la propriété mais demeure une dot; les hanbalites partagent cet avis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675} L'administration d'une dot. Les juristes s'accordent à dire que l'administration d'une dot est régie par les volontés du fondateur. S'il la désigne à une personne nommément désignée, ses volontés sont respectées, comme l'a fait 'Umar ibn al-Khattab en confiant sa dot à sa fille Hafsa pour qu'elle la gère sa vie durant, puis aux personnes de sa famille reconnues pour leur discernement, comme le rapporte al-Bayhaqi. Ibn Qudama affirme que la disposition d'une dot est également régie par les volontés du fondateur, de même que la désignation de son administrateur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675} Les juristes divergent quant à la possibilité pour le fondateur de s'attribuer lui-même l'administration. Les écoles hanafite, chaféite et hanbalite l'autorisent. Les malikites affirment que si le bénéficiaire n'a pas pris possession du bien, celui-ci est caduc du fait du décès, de la maladie ou de la faillite du fondateur; si le bénéficiaire en a pris possession et que le fondateur a désigné un administrateur pour lui-même, le bien est maintenu, mais le fondateur est tenu d'en confier l'administration à un tiers, puisqu'il ne peut se l'attribuer à lui-même. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675} Si le fondateur ne désigne aucun administrateur, les malikites et les hanbalites estiment que, lorsque le bien est destiné à des personnes non nommées, telles que les pauvres ou les mosquées, le dirigeant désigne la personne de son choix, puisqu'il ne peut l'administrer lui-même. Lorsque le bien est destiné à un bénéficiaire nommé et sain d'esprit, ce bénéficiaire l'administre, car il en est le propriétaire et le bénéficiaire, de sorte que sa supervision équivaut à une propriété absolue. S'il est incapable de discernement, son tuteur l'administre. Dans l'école hanbalite, choisie par Ibn Abi Musa, il est possible que le souverain administre le bien. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675} Concernant l'administration d'une dot non stipulée par le fondateur, les avis hanafites divergent. Abu Yusuf considère que la dot appartient à Dieu et que son administration revient en premier lieu au fondateur, puis à son exécuteur testamentaire, et enfin au juge. Hilal, l'avis prédominant de cette école, soutient que l'administration revient d'abord au fondateur, puis à son exécuteur testamentaire ou au juge, car l'administrateur tire son autorité de la stipulation du fondateur; il est donc impossible qu'il exerce son autorité alors qu'un autre la tire de lui. De plus, le fondateur est la personne la plus proche de la dot. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} Selon Muhammad, le fondateur n'a pas d'administrateur s'il ne l'a pas stipulé, car pour lui, la remise de la dot à un dépositaire est une condition de sa validité; une fois la remise effectuée, le fondateur n'a plus aucune autorité sur elle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} Si le fondateur décède sans désigner d'administrateur, le juge nomme un dépositaire parmi les membres de sa famille, s'il en trouve un, soit parce qu'il est le plus prévenant, soit parce que le fondateur souhaitait que la dot lui soit attribuée; ce n'est qu'en dernier recours qu'il nomme une personne extérieure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} Selon l'école shafi'ite, si le fondateur ne désigne aucun administrateur, l'administration revient au juge, qui dispose d'une autorité générale en la matière. Une autre opinion l'attribue au fondateur, qui la détenait, et une troisième au bénéficiaire, puisque les revenus lui appartiennent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} Les qualifications requises pour être administrateur. Les juristes définissent plusieurs conditions d'aptitude à la fonction d'administrateur; certaines font consensus, d'autres sont sujettes à controverse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} La première condition est la capacité juridique. Les juristes s'accordent à dire qu'un administrateur doit être majeur et sain d'esprit, car un mineur ou une personne atteinte de troubles mentaux n'en a pas la capacité; ceci est valable en général. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} Les Malikites et les Hanbalites ajoutent que si le fondateur ne désigne aucun administrateur et que le bénéficiaire est une personne nommément désignée, comme Zayd ou 'Amr, le bénéficiaire administre lui-même le patrimoine; s'il est mineur ou atteint de troubles mentaux, son tuteur le représente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} Les Hanbalites affirment que la propriété d'un bien légué est transmise au bénéficiaire s'il s'agit d'une personne nommément désignée ou d'un groupe limité, et que ce dernier l'administre s'il est majeur et sain d'esprit, ou son tuteur s'il est mineur, aliéné ou prodigue; Ibn Abi Musa soutient que c'est le juge qui l'administre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} Les Hanafites: Ibn 'Abidin cite al-Is'af selon lequel la nomination d'un mineur comme administrateur est nulle par analogie dans tous les cas, et nulle par préférence juridique tant qu'il est mineur, de sorte que l'administration lui est transférée à sa majorité; Al-Shilbi soutient que la désignation d'un mineur comme tuteur est nulle, car l'administration est une forme de tutelle et un mineur sous tutelle ne peut être tuteur d'autrui. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} Ibn 'Abidin cite les fatwas de Rashid al-Din selon lesquelles un juge qui désigne un mineur capable de gérer un bien comme tuteur agit valablement, car cela lui confère le pouvoir d'agir; les deux avis peuvent être conciliés en interprétant al-Is'af comme concernant un mineur incapable d'agir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} La démence empêche la désignation et y met fin une fois prononcée. Ibn 'Abidin cite al-Fath selon lequel un administrateur est destitué par une démence permanente d'une durée d'au moins un an, et que s'il recouvre la santé mentale, l'administration lui est restituée. Cependant, al-Nahr précise que cela s'applique à celui désigné par le fondateur et non à celui nommé par le juge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} Les chaféites affirment que l'administration est destituée par la démence, et al-Shabramallisi soutient que lorsqu'une personne saine d'esprit reprend ses fonctions d'administrateur désigné par le fondateur, la charge lui est restituée par simple guérison, sans nouvelle nomination. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} La seconde condition est la justice (adala). Les hanafites divergent quant à savoir s'il s'agit d'une condition de validité ou de préférence. Al-Is'af affirme que nul ne peut être nommé s'il n'est digne de confiance et compétent, agissant lui-même ou par l'intermédiaire d'un représentant, car la destitution d'une personne malhonnête ne relève pas de l'administration. Ibn 'Abidin considère que la justice est une condition de préférence, non de validité, et qu'un administrateur qui se livre à des actes répréhensibles mérite d'être destitué, mais ne l'est pas automatiquement, de même qu'un juge qui se livre à des actes répréhensibles n'est pas destitué selon l'avis rabbinique et la fatwa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} Les Malikites considèrent la justice comme une condition lorsque l'administrateur a été nommé par le juge ou par le fondateur. Al-Hattab indique que l'administration d'une dot confisquée revient à la personne choisie par le fondateur, qui doit être digne de confiance en matière de religion et d'honnêteté; si le fondateur est négligent, l'administration incombe au juge, qui désigne une personne qu'il approuve. Si l'administrateur gère mal ses affaires et n'inspire pas confiance, le juge le destitue, à moins que le bénéficiaire ne soit maître de ses affaires et ne l'accepte. Al-Qarafi affirme qu'un juge ne destitue un administrateur qu'en cas de faute, mais que le fondateur peut le révoquer même sans faute. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} L'école shafi'ite exige une justice à la fois apparente et intérieure chez un administrateur nommé par le juge. Al-Subki estime que, pour un administrateur nommé par le fondateur, la justice apparente suffit; al-Adhra'i exige également une justice à la fois apparente et intérieure dans ce cas, et al-Sharbini privilégie la première opinion. Si l'administrateur commet des actes répréhensibles, il est destitué, et l'administration est alors confiée au juge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} Selon l'école shafi'ite, si un administrateur commet une faute puis se rachète, son autorité lui est restituée si cela était expressément prévu dans les termes de la dot et clairement stipulé; dans le cas contraire, elle ne l'est pas. Al-Nawawi a émis cette fatwa, et Ibn al-Rif'a, entre autres, a approuvé cette position; al-Zarkashi la considère comme évidente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} L'école hanbalite soutient que si l'administration appartient à une personne autre que le bénéficiaire, et que la nomination a été faite par un juge ou par un administrateur initial, la justice est requise, car il s'agit d'une autorité sur un bien, comparable à la tutelle des biens d'un orphelin. Si l'administrateur n'est pas juste, il est démis de ses fonctions afin de préserver la dot, et s'il se rachète, son droit lui est restitué. Si l'administrateur a été désigné par le fondateur, la justice n'est pas requise et une personne digne de confiance est ajoutée à l'administrateur. Son autorité n'est révoquée que si cela est nécessaire à la préservation du bien, car la préservation de ce bien prime sur le maintien d'un administrateur fautif à sa tête. Lorsque l'administration appartient au bénéficiaire lui-même, qu'il soit juste ou non, il y a un droit plus légitime, puisqu'il est propriétaire du bien et l'administre donc pour son propre compte; certains estiment qu'une personne digne de confiance lui est ajoutée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680} La troisième condition est la capacité (kifaya), c'est-à-dire la force et l'aptitude de la personne à agir dans le cadre de son administration. Les écoles chaféite et hanbalite l'exigent, car la préservation d'un bien est un devoir religieux et une personne incapable ne peut y parvenir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} Si la capacité est perdue, les chaféites affirment que le juge retire l'administration au titulaire, même si elle lui avait été confiée par le fondateur. Al-Nawawi indique qu'à la fin de l'incapacité, son administration lui est restituée si elle était stipulée dans l'acte de dot et désignée précisément. Les hanbalites soutiennent que, si la capacité est perdue, le titulaire n'est pas destitué, mais qu'un administrateur compétent et digne de confiance lui est nommé pour accomplir la mission. Les hanafites estiment que l'administrateur doit être destitué s'il n'est pas digne de confiance ou s'il est incapable (le texte OCR mentionne ici « le fondateur », probablement une erreur de transcription pour désigner l'administrateur, signalée comme douteuse). Les propos des malikites impliquent également que la capacité est requise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680} La quatrième condition est l'islam. Les hanbalites considèrent qu'un administrateur doit être musulman si le bénéficiaire l'est aussi ou si l'objet de la donation est une mosquée ou un lieu similaire, se fondant sur la sourate An-Nisa, verset 141, qu'ils citent à l'appui de cette condition. Si la dot est destinée à un non-musulman nommément désigné, un non-musulman peut être nommé administrateur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680} Les hanafites autorisent un dhimmi à être administrateur et n'exigent pas l'islam; si le juge destitue un dhimmi pour quelque raison que ce soit et que celui-ci se convertit par la suite, l'administration ne lui est pas restituée. Al-Ramli soutient que, par analogie avec le testament et le mariage, l'administration d'une dot par un dhimmi au profit d'un bénéficiaire dhimmi est valide, à condition que ce dernier soit intègre dans sa religion. Cependant, cette position est rejetée car la dot exige une véritable justice; al-Shabramallisi affirme que ce rejet est l'avis le plus juste. Il établit une distinction avec le mariage d'un dhimmi avec son pupille, où le tuteur a une retenue naturelle de vouloir protéger son pupille de la honte, ce qui ne s'applique pas à une dot. La question de la rémunération de l'administrateur porte sur son droit à une rémunération, qu'elle soit fixée par le fondateur ou le juge, sur son montant et sur la possibilité d'en percevoir une en l'absence de toute mention. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17681} Concernant le droit à une rémunération: les juristes estiment qu’un administrateur a droit à une rémunération pour son travail de gestion et d’administration d’un bien de main d’œuvre. Parmi les preuves qu’ils citent figurent les paroles d’Umar lors de la donation de ses terres à Khaybar: « Quiconque les administre peut manger à sa faim ou nourrir un ami sans en tirer profit. »; la pratique d’Ali d’imputer l’entretien des esclaves qu’il avait donnés en dot pour cultiver la terre sur les revenus; l’analogie avec le collecteur de la zakat; et le hadith attribué au Prophète: « Ce qui reste après l’entretien de ses épouses et le salaire de ses employés est une aumône. » Ibn Hajar précise que, dans ce cas, le terme « employé » désigne le gardien de la terre, ce qui confirme la licéité de sa rémunération. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} Sur la fixation du salaire. Si le fondateur a fixé un salaire, l'administrateur perçoit ce salaire, même s'il excède le salaire habituel; c'est l'avis des écoles hanafite, shafi'ite et hanbalite. Les hanafites affirment que si le fondateur a fixé un salaire inférieur au salaire habituel, le juge le complète sur demande. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} Les shafi'ites soutiennent que si le fondateur s'est désigné lui-même administrateur et a fixé un salaire pour lui-même, celui-ci ne peut excéder le salaire habituel; s'il l'a fixé supérieur, la dot est nulle, car il s'agirait d'une dot à son propre profit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} Les hanbalites, quant à eux, estiment que si le fondateur a fixé un salaire et que celui-ci est égal au salaire habituel, l'administrateur le perçoit. Si le montant est supérieur, les frais liés à la dotation, tels que les honoraires des administrateurs et autres, sont prélevés sur l'excédent jusqu'à ce qu'il ne reste que le salaire habituel, à moins que le fondateur ne l'ait versé intégralement. Les Malikites n'ont fixé aucun montant et ont laissé cette décision au fondateur ou au juge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} Si le fondateur n'a pas fixé de salaire, c'est le juge qui le fixe. Les Hanafites et les Hanbalites estiment que le salaire du juge ne doit pas excéder le salaire habituel et que, s'il le fixe davantage, l'excédent est retenu. Les Malikites laissent cette question à la discrétion du juge; Ibn Fattuh indique que le juge peut verser à l'administrateur désigné une allocation mensuelle fixe en fonction de son travail, comme le faisaient les imams. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} Les chaféites affirment que si le fondateur ne fixe aucun salaire, l'administrateur, selon l'avis le plus juste, n'en perçoit aucun et ne peut rien prélever sur la dot. S'il le fait, il en engage la responsabilité et n'est libéré qu'en remettant les fonds au juge. Si l'administrateur demande au juge de fixer un salaire, il agit comme un tuteur aux biens d'un orphelin qui demanderait au juge de fixer ses honoraires. Al-Iraqi, qui rapporte l'avis d'al-Balqini, indique que l'administrateur perçoit alors le salaire nécessaire, soit le montant de sa pension alimentaire, comme le préconisait al-Rafi'i, soit le moindre de sa pension alimentaire et du salaire habituel, comme le préconisait al-Nawawi. Un autre avis considère qu'il a droit au salaire habituel, même s'il excède sa pension alimentaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} Si le fondateur n'a pas fixé de salaire, Al-Ramli, de l'école hanafite, affirme que l'administrateur ne perçoit rien à moins que le juge ne fixe une rémunération pour son travail. Ibn 'Abidin conclut que lorsque le fondateur nomme une somme pour l'administrateur, celui-ci la reçoit, qu'elle soit importante ou non, qu'il travaille ou non, pourvu qu'elle ne soit pas fixée en contrepartie d'un travail; si le fondateur ne nomme rien et que le juge fixe le salaire habituel, cette décision est valable; s'il fixe un montant supérieur, le surplus est retenu; et si l'administrateur ne travaille pas, il ne perçoit aucun salaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} Si le juge nomme un administrateur et ne nomme aucun salaire, alors, lorsque la coutume veut que le travail ne soit pas effectué sans le salaire habituel, ce dernier lui est dû, car la coutume est assimilable à une stipulation; sinon, rien. Ibn Najim, citant al-Qunya, rapporte deux avis hanafites concernant le mandataire d'un juge non rémunéré: selon le premier, il ne perçoit aucun salaire, même après une année de travail; selon le second, le mandataire a droit à une rémunération proportionnelle à son effort, que le juge ou les habitants du quartier aient ou non fixé de salaire, car nul n'accepte publiquement une charge de tutelle sans rémunération, et la coutume s'apparente à une stipulation. Lorsque la dot est administrée, les écoles malikite, hanbalite et chaféite traitent la question de la rémunération d'une manière particulière. Les chaféites estiment que si le fondateur n'a attribué aucune rémunération à l'administrateur, ce dernier n'y a pas droit, selon l'avis le plus juste. Si l'affaire est soumise au juge, celui-ci reçoit une allocation en cas de besoin, comme expliqué précédemment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17684} Les Hanbalites ont trois avis. Le premier, celui d'Abu al-Khattab, stipule que l'administrateur peut se nourrir des revenus de la fondation dans une mesure raisonnable, qu'il soit nécessiteux ou non. Le deuxième avis, celui d'Abu al-Khattab, stipule qu'il perçoit le moindre des deux montants suivants: le salaire habituel ou son entretien, par analogie avec le tuteur d'un orphelin, et n'y a droit que s'il est indigent. Le troisième avis, celui de l'école hanbalite, stipule qu'un administrateur connu pour percevoir un salaire a droit à ce salaire habituel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17684} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} Les Malikites, comme le rapporte Ibn Fattuh, autorisent le juge à verser une allocation mensuelle fixe provenant des dotations, déterminée selon son appréciation de l'œuvre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17684} La source de cette rémunération. La majorité des juristes, à savoir les Hanafites, les Malikites (à l'exception d'Ibn 'Attab), les Shafi'ites et les Hanbalites, considèrent que la rémunération de l'administrateur, qu'elle soit fixée par le fondateur ou par le juge, provient des revenus de la dot, citant les paroles d'Umar concernant sa dot: « Quiconque l'administre peut en bénéficier raisonnablement sans pour autant accumuler de biens. » Ibn 'Attab, de l'école malikite, soutenait que le salaire provenait exclusivement du trésor public; s'il était prélevé sur les dotations, il devait être restitué et recouvré auprès du trésor; et s'il n'était pas versé, la rétribution du bénéficiaire appartenait à Dieu. Al-Hattab expliquait qu'il ne fallait rien prélever sur les dotations, car elles étaient destinées aux legs. Ibn Warad a émis une fatwa en ce sens, mais al-Dasuqi a nuancé l'avis d'Ibn 'Attab. Le travail donnant lieu à salaire consiste à préserver la dot, à la réparer, à la louer, à percevoir ses revenus (loyers, récoltes ou fruits), à s'efforcer de la développer et à les dépenser pour ses finalités, telles que la réparation, l'entretien et les bénéficiaires, conformément à la coutume. Le salaire court à compter de la prise de fonction de l'administrateur et est dû proportionnellement au travail accompli. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} Selon les Hanbalites, si un administrateur néglige ses devoirs, son salaire fixe est réduit du préjudice subi par la dot du fait de cette négligence; la somme qui lui est due est répartie entre ce qu'il a fait et ce qu'il n'a pas fait, et la part correspondant à ce qu'il n'a pas fait est perdue. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} Selon les Hanafites, si les bénéficiaires contestent les dires d'un administrateur qui prétend que le fondateur a fixé un salaire pour un travail qu'il n'effectue pas, le juge ne doit pas imposer de tâches que les dirigeants eux-mêmes n'accomplissent pas. Si un empêchement survient et l'empêche d'ordonner, d'interdire, de recevoir ou de donner, il ne perçoit aucun salaire; dans le cas contraire, il le conserve. Si le fondateur a fixé un salaire supérieur au salaire habituel, cela est permis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} Dans une affaire, le propriétaire d'une terre en dot décéda et le juge nomma un administrateur auquel il attribua un dixième des revenus. Parallèlement, un moulin appartenant à la dot était exploité par un homme en vertu d'un bail à forfait et ne nécessitait aucun administrateur; les bénéficiaires en percevaient le rendement. L'administrateur n'avait aucun droit à un dixième de ce rendement, car sa rémunération était un paiement pour un travail effectué, et il n'y a pas de salaire sans travail. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} La reddition de comptes d'un administrateur. Il incombe à l'administrateur de percevoir les revenus de la dot, de les utiliser pour subvenir aux besoins de celle-ci et de verser les sommes aux bénéficiaires. Les juristes s'accordent à dire qu'il doit rendre compte de ses dépenses, qu'il soit interpellé par le juge ou par les bénéficiaires. Les avis divergent quant à la validité de sa parole concernant ses dépenses, sans preuve, et quant à la nécessité d'un serment en l'absence de preuve. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} Les Hanafites affirment que le juge n'a pas besoin d'exiger un compte rendu détaillé de chaque somme dépensée par l'administrateur sur les revenus de la dot; un compte rendu général suffit s'il est réputé digne de confiance. En cas de suspicion, le juge l'oblige à s'expliquer point par point, sans l'emprisonner, mais le convoque pendant deux ou trois jours et l'avertit; s'il s'explique, tant mieux; sinon, le juge recueille son serment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} Al-Durr cite al-Qunya: si le juge a des soupçons, il fait jurer l'administrateur, même s'il est digne de confiance, comme doit le faire un dépositaire qui déclare la perte d'un dépôt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} Les avis hanafites divergent quant à la question de savoir si l'administrateur a versé le loyer aux bénéficiaires. Al-Durr affirme que sa parole est acceptée sans serment. L'Is'af soutient que s'il déclare avoir reçu le loyer et l'avoir versé aux bénéficiaires, et que ces derniers le nient, sa parole est acceptée avec son serment et il n'est pas responsable, à l'instar d'un dépositaire qui prétend avoir restitué un dépôt lorsque le déposant le conteste. Le locataire du bien en dot est libéré de ses obligations par la reconnaissance de la réception du loyer par l'administrateur. Si ce dernier déclare que le loyer a été perdu ou volé après l'avoir perçu, sa parole, accompagnée d'un serment, est acceptée, car il est digne de confiance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} Ibn 'Abidin rapporte d'après al-Khayr al-Ramli que la fatwa exige qu'il prête serment à notre époque. La Hamidiyya cite Abu al-Su'ud qui statue que si l'administrateur est un prodigue, son serment concernant ses dépenses des biens de la dot n'est pas accepté. Al-Shilbi soutient qu'un malfaiteur dont la conduite contrevient à la Loi n'est pas cru sur ses déclarations concernant ses dépenses, à moins qu'il n'en apporte la preuve. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} Quant à la question de savoir si la parole d'un administrateur de confiance est acceptée après sa révocation: al-Hamawi indique que l'avis général est que oui, puisque la révocation ne remet pas en cause sa fiabilité. Mulla Abu al-Su'ud établit une distinction supplémentaire: si l'administrateur affirme avoir versé, à partir des revenus d'une dot, des sommes à des bénéficiaires désignés par le fondateur comme ses enfants ou petits-enfants, sa parole est acceptée; en revanche, s'il affirme avoir rémunéré des personnes occupant des fonctions officielles, telles que l'imam et le muezzin, cela ne l'est pas, de la même manière qu'on ne croit pas un homme qui a engagé un ouvrier pour la construction d'une mosquée à un salaire connu et qui prétend ensuite l'avoir payé. Al-Tamartashi a salué cette distinction. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687} Les Malikites estiment que si le fondateur décède et que l'acte de dot est perdu, la parole de l'administrateur est acceptée quant à l'utilisation des fonds, s'il est digne de confiance. S'il affirme avoir dépensé les revenus, cela est accepté s'il est digne de confiance, sauf si l'acte a été établi en présence de témoins, auquel cas il ne dépense qu'avec leur accord. S'il affirme avoir dépensé ses propres fonds pour la dot, cela est accepté sans serment, sauf s'il est soupçonné, auquel cas il jure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687} Al-Hattab rapporte un cas soumis à al-Suri: un imam, un muezzin et l'administrateur général d'une mosquée furent accusés, des années plus tard, par un inspecteur du marché, d'un excédent provenant des loyers des boutiques; L'administrateur a nié tout excédent et a refusé de rendre compte de ses dépenses, arguant qu'il n'y était pas tenu et que, sans lui, la dotation serait perdue. Al-Suri a statué que sa parole est acceptée quant aux dépenses déclarées, si celles-ci correspondent à ses déclarations. Al-Barzali ajoute que cette règle s'applique lorsqu'aucune condition n'exige la tenue d'un registre des recettes et des dépenses, sauf en présence de témoins. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687} Les Shafi'ites distinguent les bénéficiaires nommément désignés, tels que Zayd et 'Amr, dont la parole concernant les sommes qui leur sont versées est acceptée et qui peuvent exiger des comptes, des bénéficiaires non nommément désignés, tels que les pauvres. Lorsque les bénéficiaires ne sont pas nommément désignés, la question de savoir si le souverain peut exiger des comptes est controversée; parmi les deux avis, le plus probable est qu'il le peut. On croit l'administrateur quant au montant de ses dépenses, lorsque cela est plausible; si le juge a des doutes, il lui fait jurer. Al-Azra'i explique qu'il s'agit de dépenses conformes à la coutume. Les paiements aux pauvres et les dépenses générales sont inclus, mais les dépenses effectuées en faveur d'un bénéficiaire nommé ne sont pas prises en compte, car ce dernier ne les a pas autorisées. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688} Les Hanbalites distinguent l'administrateur bénévole de celui qui perçoit un salaire. La parole d'un administrateur bénévole est acceptée concernant un paiement à un bénéficiaire; celle d'un administrateur rémunéré n'est pas acceptée sans preuve. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688} Al-Buhuti et al-Mirdawi affirment que les bénéficiaires ne peuvent s'opposer à un administrateur de confiance nommé par le fondateur; ils peuvent l'interroger sur les besoins de leur dot, afin que leurs connaissances égalent les siennes; et le souverain peut créer un bureau pour auditer les comptes de la dot lorsque cela est d'intérêt public. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688} La révocation de l'administrateur d'une fondation et les personnes habilitées à la révoquer. Les conditions requises pour être administrateur et la règle applicable en cas de manquement ont été exposées précédemment; voici qui peut le révoquer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688} Premièrement, le droit du fondateur de révoquer son mandataire. Les écoles chaféite et hanbalite distinguent le fondateur qui, initialement, a conservé l'administration pour lui-même avant de la déléguer, et celui qui l'a confiée à un tiers dès le départ. Dans le premier cas, il peut révoquer et nommer une autre personne, puisque le mandataire le représente, à l'instar d'un mandant qui révoque son mandataire; c'est l'avis fondé des chaféites et l'avis juste et pertinent des hanbalites dans le texte corrigé d'al-Furu'. Al-Shirbini note que cela implique que le fondateur peut révoquer l'administrateur sans motif, et al-Subki le confirme dans ses fatwas; cependant, de nombreux savants postérieurs, parmi lesquels Ibn Razin, ont statué que la révocation sans motif n'est pas permise. Les avis shafi'ite et hanbalite lui refusent toute révocation, puisque la propriété lui a été transférée. Dans le second cas, où le fondateur désigne un administrateur lors de la création de la dot, les shafi'ites affirment qu'il ne peut le révoquer, même pour un motif d'intérêt personnel, car il perd toute autorité après avoir délégué cette fonction à un tiers. Par conséquent, si l'administrateur ainsi désigné se révoque ou commet une faute, la nomination d'un remplaçant revient au juge, et non au fondateur. Les Hanbalites affirment que si le fondateur a désigné un administrateur et s'est procuré le droit de le révoquer, il peut le faire; dans le cas contraire, il ne le peut pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690} Les Hanafites, selon Muhammad ibn al-Hasan, estiment que si le fondateur s'est conféré, ainsi qu'à ses enfants, le droit de nommer et de révoquer les tuteurs, d'échanger la dot et toute autorité s'y rapportant, et qu'il a ensuite remis la dot à l'administrateur, le fondateur peut le révoquer. S'il n'a pas stipulé ce droit de révocation, il ne peut le faire après la remise, car l'administrateur se substitue aux bénéficiaires. Al-Sadr al-Shahid indique que la fatwa suit l'avis de Muhammad ibn al-Hasan. Ibn 'Abidin affirme que cela dépend de la question de savoir si la passation de pouvoir est une condition, ce qui est le cas pour Muhammad et non pour Abu Yusuf. Pour ce dernier, le fondateur conserve son autorité, qu'il l'ait stipulé ou non, puisque la passation de pouvoir n'est pas une condition; s'il nomme un autre, celui-ci devient son représentant et peut le révoquer, qu'il ait ou non prévu ce droit. Hilal, al-Fath et al-Bahr considèrent cette opinion comme la plus répandue, et les cheikhs de Balkh ont émis une fatwa en faveur de l'avis d'Abu Yusuf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690} Al-Ramli déclare que c'est clair: la révocation est valable avec ou sans motif, puisqu'il s'agit d'un représentant, et un mandant peut révoquer son mandataire en toutes circonstances. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690} Les Malikites estiment que le fondateur ne peut désigner lui-même l'administrateur; il suit ses propres conditions en nommant l'administrateur, et s'il a désigné une personne, il ne peut la remplacer. Al-Qarafi affirme que le fondateur peut révoquer un administrateur même sans motif; al-Hattab soutient que celui qui a désigné un administrateur de sa dot ne peut le révoquer que pour un motif valable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690} Deuxièmement, le droit de révocation du juge. Le juge dispose d'une autorité générale et peut donc révoquer un administrateur désigné par le fondateur si la malhonnêteté de ce dernier est prouvée ou s'il ne remplit pas l'une des conditions requises; il ne peut le révoquer sans motif valable. Lorsque le juge a lui-même nommé l'administrateur, les Malikites, les Chafi'ites et certains Hanafites estiment qu'il ne peut être révoqué que pour un motif valable, tel que le détournement de fonds ou une autre faute; les Hanbalites et certains Hanafites estiment qu'il peut être révoqué même en l'absence de détournement de fonds. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690} La pluralité des administrateurs. Une dot peut avoir un ou plusieurs administrateurs, comme l'indiquent les juristes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690} Si le fondateur confie l'administration à deux personnes, les Chafi'ites, les Hanbalites et Abu Hanifa estiment qu'aucune ne peut agir seule, puisque le fondateur n'a pas accepté la décision de l'une ou l'autre isolément. Mais si le fondateur les nomme chacun, chacun peut agir seul. Abou Yusuf autorise chacun des deux administrateurs à agir seul. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17691} Le texte hanbalite ajoute que si le fondateur confie la réparation de la dotation à un homme et la perception de ses revenus à un autre, chacun a sa tâche. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17691} Les chaféites disent que si le fondateur stipule que l'administrateur doit être le plus intègre de ses enfants, et qu'ils partagent tous cette intégrité, ils partagent la charge; si l'un est manifestement plus intègre, il l'occupe seul. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17691} Les hanafites soutiennent que si le fondateur nomme un homme puis un tuteur pour un mineur, ils sont tous deux administrateurs, le tuteur partageant la charge; À moins que le fondateur ne le précise, en indiquant par exemple qu'il a légué sa terre à un bénéficiaire nommé et en a confié l'administration à un homme, et qu'il a désigné un autre comme exécuteur testamentaire, auquel cas chacun agit seul dans le cadre de sa mission. Ibn 'Abidin cite al-Is'af à ce sujet. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17691} Si le fondateur confie l'administration à l'un de ses enfants le plus vertueux et qu'ils sont d'égale vertu, ils ne la partagent pas et elle revient à l'aîné. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} Si le fondateur a confié l'administration à deux hommes et que l'un accepte et que l'autre refuse, décède ou est disqualifié, le juge désigne un remplaçant; les écoles hanafite, shafi'ite et hanbalite sont unanimes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} La délégation de l'administration par un administrateur. Sauf autorisation du fondateur, les juristes estiment qu'un administrateur ne peut déléguer l'administration à qui bon lui semble ni la léguer à un tiers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} Selon l'école hanafite, si la délégation du fondateur à l'administrateur était générale, c'est-à-dire que l'administrateur agissait en son nom et pouvait désigner et léguer l'administration à qui bon lui semblait, il peut la déléguer de son vivant comme en cas de maladie grave; si elle n'était pas générale, il ne peut la déléguer que dans la maladie grave, car il est assimilable à un exécuteur testamentaire, lequel peut désigner un autre mandataire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} Les chaféites affirment que si le fondateur déclare avoir confié l'administration à une personne nommément désignée, laquelle peut la déléguer à qui bon lui semble, la délégation est valable. La question de la cessation de l'administration par la première personne est controversée: selon l'école chaféite, elle cesse, car la délégation s'apparente à un transfert de propriété, de sorte que ni le fondateur ni le délégataire ne peuvent révoquer le nouvel administrateur, et l'administration ne revient pas au délégant après son décès. L'école al-Subki, quant à elle, considère que le délégataire est le mandataire du délégant; par conséquent, si le délégant décède, l'administration revient au délégataire, et si le délégataire décède, elle revient au délégant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17693} Les Hanbalites affirment qu'un administrateur désigné par le fondateur, s'il est lui-même bénéficiaire, peut nommer un mandataire et le révoquer, son autorité étant originelle, à l'instar d'une personne disposant de ses propres biens. S'il n'est pas bénéficiaire, il ne peut ni nommer d'administrateur ni léguer cette charge, à moins que le fondateur n'ait stipulé qu'il pouvait nommer qui il voulait. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17693} Fin d'une dotation. L'une des manières dont une dotation prend fin est la restitution du bien donné au fondateur: lorsque le bien est ruiné et inutilisable, lorsque la dotation est destinée à une catégorie de bénéficiaires qui prend fin, ou dans le cas d'une dotation temporaire, que les Malikites admettent. Ces cas ont été abordés dans cet article. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17693}"
  ur: "وقف، لغت میں، نظربندی ہے: خدا کی راہ میں کسی چیز کو روکنا؛ اس کا مطلب روک تھام اور خاموشی بھی ہے، اور یہ لفظ منعقد ہونے والی چیز کا نام دیتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17579} تکنیکی طور پر فقہاء اس کی کئی طریقوں سے تعریف کرتے ہیں: حنفی اصحاب کے لیے، خدا کی ملکیت میں کسی چیز کو اس کے استعمال کے ساتھ روکنا جسے بانی چاہے۔ ابو حنیفہ کے لیے، صدقہ کے طور پر دیے گئے استعمال کے ساتھ بانی کی ملکیت میں اس کی نظربندی؛ مالکیوں کے لیے، کسی چیز کو اس وقت تک استعمال کرنے کی اجازت جب تک وہ موجود ہے، اس کی ملکیت تصوراتی طور پر بھی عطا کرنے والے کے پاس باقی ہے۔ شافعیوں کے لیے، جائیداد کی حراست جس کا استعمال اس کے مادہ کے ساتھ کیا جا سکتا ہے، اس کی ملکیت کا تصرف، حلال اور موجودہ مقصد کے لیے؛ حنبلیوں کے لیے، اس کی جائیداد کے مالک کی طرف سے نظربندی جس کا استعمال اس کے مادہ میں رکھا جاتا ہے، اور اس کی آمدنی خدا کی رضا کے حصول کے لیے خیراتی مقصد کے لیے دی جاتی ہے۔ متعلقہ الفاظ: تبرّو ⁦(بغیر واپسی کے دینا، وقف سے وسیع تر)⁩، صدقہ ⁦(بغیر واپسی کے زندگی میں تحفہ، جسے وقف کا نام بھی دیا جاسکتا ہے، جیسا کہ عمر کی زمین میں ہے)⁩، حِبہ ⁦(بغیر واپسی کے تحفہ)⁩، عریضہ اور اس کے مالک کو استعمال کرنے کی چیز تھی۔ تحفہ سے فرق یہ ہے کہ وقف استعمال کو منتقل کرتا ہے جب کہ مادہ خدا کی ملکیت میں رہتا ہے اور اسے ضائع نہیں کیا جاسکتا، جب کہ تحفہ خود چیز کو منتقل کرتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17579}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.17581} وصیہ: احناف اس کی تعریف مرنے کے بعد ہونے والی ملکیت کی منتقلی کے طور پر کرتے ہیں، اور شافعیہ بھی اسی طرح۔ یہ وقف سے مختلف ہے: وصیت مرنے کے بعد نافذ ہوتی ہے اور وہ چیز یا اس کے استعمال کی ہو سکتی ہے، جب کہ وقف ایک تحفہ ہے جو زندگی میں بنایا جاتا ہے اور صرف استعمال ہوتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17581} وقف کی شرعی حیثیت: جمہور فقہاء اسے حلال، پابند اور مستحب قرار دیتے ہیں، ابن عمر کی روایت کا حوالہ دیتے ہوئے کہ عمر کو خیبر میں زمین ملی اور رسول اللہ نے ان سے فرمایا کہ اگر وہ چاہیں تو اس کی جمع کر کے واپس کر دیں۔ یہ قول کہ جب آدمی مر جاتا ہے تو اس کے اعمال ختم ہو جاتے ہیں سوائے تین کے، ان میں سے صدقہ جاریہ۔ اور جابر کی روایت ہے کہ مہاجرین اور مددگاروں میں سے ہر ایک مالدار آدمی نے لامتناہی صدقہ میں مال روک لیا۔ ابن قدامہ صحابہ کے اس اجماع کو کہتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17581}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17582} ابن عابدین، الاصف کا حوالہ دیتے ہوئے کہتے ہیں کہ وقف ابو حنیفہ اور ان کے اصحاب کے نزدیک حلال ہے۔ اختلاف اس کے پابند کردار کے بارے میں ہے: ابوحنیفہ کے لیے یہ استعمال کے قرض کی طرح ہے، جس کی ملکیت بانی کے پاس باقی ہے، صرف جج کے حکم سے یا جب وصیت کی گئی ہو۔ ابن قدامہ نے شریح کو اسے قبول نہ کرنے سے روایت کیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17582} اس کے شرعی حکم پر: یہ بنیادی طور پر ایک مستحسن عمل ہے۔ جب نذر مانی جائے تو واجب ہو جاتا ہے۔ اس کی اجازت ہے جب عقیدت کی خاطر نہ کی گئی ہو، ذمی کے وقف کے طور پر، جس کا کوئی اجر نہیں ہے۔ اور جب یہ ایک چرچ کے لیے وقف کے طور پر گناہ کی خدمت کرتا ہے تو منع کیا جاتا ہے۔ مالکیوں کا ذکر ہے کہ وقف صرف بیٹوں کے لیے حرام ہے نہ کہ بیٹیوں کے لیے جو کہ زمانہ جاہلیت کے رواج کے مشابہ ہے، لیکن ابن القاسم نے اسے ناپسند کرنے اور اسے نافذ کرنے کو ترجیح دی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17582}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17583} وقف کے ستون: جمہور ⁦(مالک، شافعیہ، حنبلی)⁩ چار شمار کرتے ہیں: مصدر، مصداق، مصداق، مصداق۔ احناف صرف فارمولہ شمار کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17583} وقف پیش کش کے بغیر درست نہیں ہے، اور فقہاء کا اس میں اختلاف ہے کہ آیا قبولیت ضروری ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17583} پیشکش کا فارمولا: جو چیز بانی کے ارادے کو لفظ، واضح نشانی، تحریر یا عمل سے ظاہر کرے۔ واضح الفاظ 'میں نے عطا کیا' ⁦(وقفطو)⁩ جسے مالکیہ، شافعی اور حنبلی کہتے ہیں، اور 'میں نے حراست میں لیا' ⁦(حبستو)⁩، حنبلیوں کے لیے، مالکی نقطہ نظر اور آواز والے شافعی کے قول کا اظہار، اور 'میں نے راستہ بنایا' ⁦(سبلتو)⁩، شافعیوں اور حنبلیوں کے لیے اظہار ہے، کیونکہ صوت کے الفاظ میں نبی کے استعمال کے لیے وہی الفاظ استعمال کیے گئے ہیں اور ان کے لیے مخصوص ہے۔ {حوالہ: فقہ الموسوعہ-کویتیہ-نور-v3 صفحہ 17584} مضحکہ خیز الفاظ ہیں 'میں نے صدقہ دیا' ⁦(تصدقتو)⁩ جسے حنبلی اور مالکیہ متشابہ شمار کرتے ہیں، اور جسے شافعی اس وقت ظاہر کرتے ہیں جب اسے عام مستحقین جیسے غریب اور بصورت دیگر اشتعال انگیز سے ملایا جاتا ہے۔ نیز 'میں نے منع کیا' اور 'میں نے دائمی بنایا'، جو حنبلیوں اور شافعی کا قول ہے؛ وہ صرف اس وقت وقف کرتے ہیں جب کسی واضح نشانی سے جڑے ہوں، جیسے کہ 'صدقہ خیرات'، 'ایسا صدقہ جو کبھی فروخت نہ کیا جائے، نہ دیا جائے اور نہ ہی وراثت میں ملے'، یا جب نیت شامل کی جائے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17584}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17585} جب منتظم اوقاف کی آمدنی سے، ایک ایسی رقم رکھتا ہے جو صحیح طریقے سے کسی خیراتی کام کے لیے جا سکتا ہے، جیسے کہ مسلمانوں کے لیے صدقہ و خیرات اور لڑائی کی رقم۔ اوقاف کو مرمت کی ضرورت ہے، پھر: اگر اگلے سال کی آمدنی تک مرمت میں تاخیر کرنے سے کوئی واضح نقصان نہ ہو جس سے اوقاف کی بربادی کا خطرہ ہو، تو آمدنی خیراتی ادارے کو جائے گی اور مرمت ملتوی ہو جائے گی۔ اگر تاخیر واضح نقصان کا باعث بنتی ہے، تو آمدنی سب سے پہلے مرمت پر جاتی ہے اور صرف زائد رقم خیراتی ادارے کو ملتی ہے۔ ابن نجیم فرماتے ہیں کہ جو منتظم مستحقین کو ادائیگی کرتا ہے جبکہ مرمت میں تاخیر نہیں ہو سکتی وہ ذمہ دار ہے، کیونکہ اوقاف کی ضروریات غریبوں کے حق سے خارج ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17661} احناف کے لیے جہاں مرمت ضروری ہے، مثلاً چھت اونچی کرنا یا دیوار بنانا، اس کو دیگر تمام کاموں پر ترجیح دی جاتی ہے، کیونکہ امام اور مؤذن کو دی جانے والی چیزوں کی وجہ سے مسجد کو ویران کرنا مناسب خیال نہیں ہے۔ مرمت پر کوئی اضافی رقم بانی کے مقصد کے قریب ترین فائدہ اٹھانے والے کو جاتی ہے جس کے نقصان سے واضح نقصان ہوگا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17661} جہاں مرمت ضروری نہ ہو، تاکہ اگلے سال کی آمدنی تک اسے چھوڑنے سے چیز خراب نہ ہو، اس سے زیادہ اہم ضرورت پہلے آتی ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17661} احناف اس معاملے کو الگ کرتے ہیں جہاں بانی نے یہ شرط رکھی کہ مرمت کو ہر سال ترجیح دی جائے، جب منتظم ہر سال رقم کو ایک طرف رکھتا ہے خواہ اس کی ضرورت نہ بھی ہو، خاموشی کی صورت سے، جب ضرورت کے وقت مرمت کی ادائیگی کی جائے اور کچھ بچا نہ ہو۔ {حوالہ:فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17661} جب کسی مختص عمارت کا کچھ حصہ یا اس کا سامان گر جائے تو جج اسے مرمت پر خرچ کرتا ہے۔ اگر مرمت کے ذرائع ایک ہی وقت میں تیار نہ ہوں تو وہ اسے اس وقت تک رکھتا ہے جب تک کہ وہ نہ ہوں۔ {حوالہ: فقہ الموسوعہ-کویتیہ-نور-v3 ص17661} شافعیوں کے لیے، مسجد کی آمدنی کا فاضل اس کی مرمت کی ضرورت سے زیادہ، اس کی تعمیر نو کی لاگت کے حساب سے، بچا لیا جاتا ہے، اور باقی رقم سے جائیداد خریدی اور وقف کردی جاتی ہے۔ یہ مسجد کے لیے زیادہ محفوظ ہے، اور یہ اس عطا شدہ چیز سے نہیں خریدی جاتی جس کی دیکھ بھال یہ ہے، کیونکہ بانی نے وہ چیز دیکھ بھال کے لیے دی تھی۔ فقہ الموسوعۃ کویتیہ نور v3 ص 17662} فقہاء کا اس وسیلہ میں اختلاف ہے جس سے عطا شدہ چیز اور اس کی دیکھ بھال کی ادائیگی ہوتی ہے۔ حنفیہ اور مالکیہ کا خیال ہے کہ یہ اوقاف کی آمدنی سے آتا ہے خواہ بانی نے یہ شرط رکھی ہو، کیونکہ وقف خدا کی راہ میں جاری صدقہ ہے اور صرف اسی طریقے سے جاری رہ سکتا ہے۔ مالکیوں کا مزید کہنا ہے کہ اس کے خلاف کوئی شرط باطل ہے۔ حنفیہ کے نزدیک اگر بانی نے اپنے بیٹے کی رہائش کے لیے مکان دیا تو اس کی مرمت اس کے اپنے پیسوں سے ہوگی نہ کہ آمدنی سے، کیونکہ بوجھ فائدے کے بعد آتا ہے۔ اگر وہ غریب ہونے کی وجہ سے انکار کر دے یا ادا نہ کر سکے تو جج اس سے یا کسی دوسرے سے مکان کرایہ پر دے دیتا ہے اور کرایہ سے اس کی مرمت کرتا ہے اور انکار کرنے والا مرمت کرنے پر مجبور نہیں ہے۔ مالکی متفق ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17662} مالکیہ کہتے ہیں کہ چھاپہ مارنے کے لیے مختص گھوڑا سرکاری خزانے سے کھلایا جاتا ہے۔ اگر کوئی خزانہ نہیں ہے تو اسے بیچ دیا جاتا ہے اور اس کی قیمت میں اسلحہ اور ایسی ہی چیزیں خرید لی جاتی ہیں جن کو کھانے کی ضرورت نہیں ہوتی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17662} شافعی اور حنبلی بانی کی شرائط پر عمل کرتے ہیں۔ شافعیوں کے لیے کھانا کھلانا، سازوسامان اور مرمت کی ادائیگی نام کے ذریعہ سے کی جاتی ہے۔ اس میں ناکامی، عطا کردہ چیز کے اپنے فائدے سے، جیسے غلام کی کمائی یا جائیداد کا کرایہ؛ اگر اس کے فائدے ختم ہو جائیں تو کھانا کھلانا اور سازوسامان سرکاری خزانے سے آتا ہے، جب کہ مرمت کا ذمہ کسی کے ذمہ نہیں ہوتا، کیونکہ جائیداد ایک زندہ جانور کے برعکس مطلق ملکیت کی طرح ہوتی ہے، جس کی زندگی اور حرمت کا تحفظ ضروری ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17662} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17663} حنبلیوں کے لیے، بانی کی شرائط پر حکومت ہوتی ہے۔ اگر اس نے کھانا کھلانے کے ذریعہ کا نام دیا، خواہ آمدنی ہو یا کوئی اور، اس کی پیروی کی جاتی ہے۔ اگر اس نے کسی ایک کا نام نہ لیا ہو اور عطا کردہ چیز کوئی جاندار ہو، جیسے غلام یا گھوڑے، اسے اپنی آمدنی سے کھلایا جاتا ہے۔ اگر کوئی آمدنی نہیں ہے تو، کھانا کھلانا نامزد فائدہ اٹھانے والے پر آتا ہے۔ اگر کھانا کھلانا ناممکن ہو تو وہ چیز بیچ دی جاتی ہے اور اس کی قیمت کسی دوسری چیز پر خرچ کی جاتی ہے جو کہ وقف ہو جاتی ہے۔ اگر اسے باہر چھوڑا جا سکتا ہے، تو اسے اتنا کھلایا جاتا ہے کہ اسے کھلایا جا سکے۔ اگر فائدہ اٹھانے والا بے نام ہے، جیسا کہ غریب ہیں، کھانا کھلانا سرکاری خزانے سے آتا ہے۔ املاک، جیسے عمارتوں، ہتھیاروں اور سامان کے لیے، مرمت کسی پر واجب نہیں ہے جب تک کہ بانی اسے شرط نہ بنائے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17663} فقہاء اس بات پر متفق ہیں کہ جو شخص اوقاف کو غلط طریقے سے نقصان پہنچاتا ہے، اسے گرا کر یا دوسری صورت میں ادا کرنا چاہیے۔ احناف کے نزدیک وہ شخص جو ایک اوقافی مکان کی اجازت دیتا ہے اور جس کا کرایہ دار اس کے صحن کو جانوروں کو باندھنے اور اسے برباد کرنے کے لیے استعمال کرتا ہے، ذمہ دار ہے، کیونکہ اس نے بغیر اجازت کام کیا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17663} مالکیوں کے لیے، جو کوئی اوقاف کو غلط طریقے سے گرائے، اسے چاہیے کہ اسے دوبارہ تعمیر کرے، چاہے جو منہدم کیا گیا تھا وہ بوسیدہ ہو جائے۔ لیکن ان میں سب سے اہم نظریہ یہ ہے کہ وہ اس کی قیمت کا واجب الادا ہے، جیسا کہ کسی دوسری تباہ شدہ جائیداد کی طرح۔ ابن عرفہ نے اس قول کو قبول کیا اور عیاض نے اسے مشہور کر دیا۔ {حوالہ: فقہ الموسوعہ-کویتیہ-نور-v3 صفحہ 17663} شافعیوں کے لیے، علم کے حصول کے لیے دی گئی کتاب کے لیے کوئی شخص ذمہ دار نہیں ہے جو اس کے ہاتھ سے اس کی غلطی کے بغیر ضائع ہو جائے۔ لیکن جو غلطی پر ہے وہ ذمہ دار ہے، اور کتاب کو عطا کردہ کے علاوہ کسی اور مقصد کے لیے استعمال کرنا غلطی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17663} جب کسی عطا شدہ چیز کو مرمت یا دیکھ بھال کی ضرورت ہو اور اس کی آمدنی کافی نہ ہو تو کیا منتظم اوقاف پر قرض لے سکتا ہے اور کیا اسے اجازت درکار ہے؟ مالکیہ، حنبلی اور ایک نظریہ میں، احناف کا خیال ہے کہ منتظم جج کی اجازت کے بغیر اوقاف کے لیے قرض لے سکتا ہے، جیسا کہ اس کے دوسرے اعمال کے ساتھ ہے، کیونکہ وہ ایک قابل اعتماد ایجنٹ ہے جس میں عمل کرنے کی پوری طاقت ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17664} مالکیہ کہتے ہیں کہ اگر کسی منتظم نے عہدہ سنبھالتے وقت اپنے ہی پیسے سے ضرورت کے وقت وقف پر خرچ کرنے کا بیڑا اٹھایا تو وہ اس کا پابند نہیں ہے، لیکن جو خرچ کیا ہے اسے واپس لے سکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17664} شافعیوں کے لیے، منتظم بانی کی شرط یا حاکم کی اجازت کے بغیر قرض نہیں لے سکتا۔ حاکم اسے سرکاری خزانے سے قرض دے سکتا ہے، اسے قرض لینے کی اجازت دے سکتا ہے، یا اسے اس شرط پر مرمت پر خرچ کرنے کی اجازت دے سکتا ہے کہ وہ اسے واپس کر لے۔ اگر اس نے بغیر اجازت یا شرط کے قرض لیا تو اس کی اجازت نہیں ہے اور اس نے جو خرچ کیا ہے اسے واپس نہیں کر سکتا کیونکہ اس نے زیادتی کی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17664} ترجیحی حنفی کا قول ہے کہ وقف پر قرض لینا جائز نہیں ہے جب تک کہ اوقاف کی بھلائی کے لیے اس کی ضرورت نہ ہو، مثلاً مرمت یا بیج خریدنا، اور پھر صرف دو شرطوں پر: قاضی کی اجازت، اور یہ کہ اس کا کرایہ دینا ممکن نہیں۔ اگر جج دور ہو تو منتظم اپنے اختیار پر قرض لے سکتا ہے۔ ابن عابدین کا کہنا ہے کہ بانی کے حکم کے بغیر قرض لینا جائز نہیں ہے، کیونکہ قرض صرف ایک شخص کے ذمہ ہوتا ہے۔ اوقاف کی کوئی ذمہ داری نہیں ہوتی، غریبوں کی ذمہ داری ہوتی ہے لیکن عملی طور پر ان کا پیچھا نہیں کیا جا سکتا، اس لیے قرض صرف منتظم پر پڑتا ہے۔ ضرورت اس مشابہت کو ختم کر دیتی ہے۔ ابو لیث کا ترجیحی نظریہ یہ ہے کہ جج کی اجازت سے قرض لینے کی اجازت ہے جب کوئی متبادل نہ ہو اور جج منتظم سے زیادہ دور نہ ہو، کیونکہ جج کا اختیار مسلمانوں کے عوامی مفادات کا زیادہ احاطہ کرتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17664} جہاں کوئی متبادل ہو، جیسے کہ مستحقین کو ادا کرنا، اس کے لیے قرض لینا جائز نہیں، سوائے اس کے جو امام، مبلغ اور مؤذن کو اور مسجد کی چٹائیوں اور تیل کو ترجیح دی جائے۔ {حوالہ: فقہ الموسوعۃ النور-v3 ص17664} اگر قاضی کی اجازت مطلوب ہو اور منتظم کا دعویٰ ہو کہ وہ اسے حاصل ہے تو بظاہر یہ دعویٰ بغیر ثبوت کے قبول نہیں ہوتا، کیونکہ وہ آمدنی سے لینا چاہتا ہے، اور اس کی بات صرف اس کے بارے میں قبول کی جاتی ہے جو اس کے ہاتھ میں ہے۔ اگر اس نے اجازت نہ لی ہو تو اس کے لیے آمدنی میں سے لینا حرام ہے، کیونکہ وہ رضا کار ہے، جب تک اجازت نہ ہو جائے۔ ابن عابدین کہتے ہیں کہ اگر منتظم نے اوقاف کی مرمت کے لیے اپنا پیسہ خرچ کیا تو وہ اسے اوقاف کی آمدنی سے واپس لے سکتا ہے۔ الحنوطی کا فتویٰ یہ ہے کہ وہ اسے ضمیر کے مطابق واپس لے سکتا ہے، لیکن اس کا دعویٰ اس وقت تک قبول نہیں کیا جاتا جب تک کہ وہ گواہی نہ دے کہ اس نے وصولی کے لیے خرچ کیا۔ یہ صرف وہاں لاگو ہوتا ہے جہاں اوقاف کی آمدنی ہوتی ہے۔ آمدنی کے بغیر، جج کی اجازت ضروری ہے. {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17665} دوسرا، وقف کی فروخت اور اس کا تبادلہ۔ جب کوئی عطا شدہ چیز ناکارہ ہو جائے اور اسے استعمال نہ کیا جا سکے تو حنفیہ، مالکیہ، حنبلی اور ایک نظر میں شافعی اس کو بیچنے اور اس جیسی چیز پر قیمت خرچ کرنے کی اجازت دیتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17665} حنفیہ فروخت اور تبادلے کی اجازت دیتے ہیں یہاں تک کہ خاص شرائط کے تحت وقف غیر فعال نہ ہو۔ مالکی عام طور پر ریل اسٹیٹ اور منقولہ سامان میں فرق کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17665} حنفیہ تبادلے کی تین صورتوں کو تسلیم کرتے ہیں۔ اوّل میں، بانی وقف میں یہ شرط لگاتا ہے کہ وقف شدہ زمین کسی اور زمین کے بدلے، یا تو اپنے لیے یا کسی اور کے لیے۔ اس کے دو فارمولے ہیں؛ پہلا یہ کہ: 'میری زمین ہمیشہ کے لیے خدا کے لیے صدقہ ہے، اس شرط پر کہ میں اسے بیچ کر اس کی قیمت سے دوسری زمین خرید لوں'، اور پھر دوسری زمین پہلی کی شرط پر عطا کی جاتی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17665} ابو یوسف، ہلال اور الخصاف کا خیال ہے کہ وقف اور شرط فقہی ترجیح کے اعتبار سے درست ہے، جو فتاویٰ قادیخان کے مطابق صحیح ہے۔ شرط اوقاف کو کالعدم نہیں کرتی، کیونکہ وقف ایک زمین سے دوسری زمین میں جا سکتا ہے، اور دوسری پہلی کی جگہ پر کھڑی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17665} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17666} مثال کے طور پر، اگر کوئی غاصب کسی زمین کو سیلاب میں ڈال دے یہاں تک کہ وہ کھیتی کے لیے سمندر کے قابل نہ ہو جائے، تو وہ اس کی قیمت ادا کرتا ہے اور پہلے اس کی قیمت خرید لیتا ہے۔ اسی طرح اگر اس کی پیداوار خرابی کی وجہ سے گر گئی ہو اور اس کی قیمت سے زیادہ نہ ہو تو اوقاف کی بھلائی اس کے بدلے میں ہے، اس لیے بانی اس وقت بھی جب ضرورت نہ ہو تب بھی تبادلے کی طاقت کو جائز قرار دے سکتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17666} محمد اور یوسف بن خالد السمطی کا خیال ہے کہ وقف صحیح ہے اور شرط باطل ہے جو کہ قیاس ہے۔ سراخسی نے محمد کے قول کو درست قرار دیا ہے: شرط وقف کو ختم ہونے سے نہیں روکتی، اس لیے وقف مکمل ہو جاتا ہے، جب کہ تبادلہ اپنے آپ میں ایک باطل حالت کے طور پر کھڑا ہوتا ہے، جیسے ایک مسجد جس پر تبادلے کی شرط رکھی گئی ہو یا جہاں یہ شرط ہو کہ صرف چند لوگ نماز پڑھیں۔ بعض حنفی فقہاء نے وقف اور شرط دونوں کو باطل کہا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 ص17666} کمال ابن الحمام الانصاری سے روایت کرتے ہیں کہ شرط صحیح ہے لیکن فروخت صرف قاضی کی اجازت سے کی جاسکتی ہے اور قاضی کو اس وقت فروخت کی اجازت دینی چاہیے جب کہ وقف میں کوئی فائدہ نہ ہو اور وہ اس کے فائدہ مندوں کے لیے بہتر دیکھے۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 ص17666} اگر بانی نے مزید وقف فارمولہ شامل کیے بغیر زمین بیچنے اور اس کی قیمت کے ساتھ دوسری خریدی جانے کی شرط رکھی ہے تو دوسری زمین بغیر تجدید فارمولے کے پہلی کی شرائط پر وقف ہو جاتی ہے، کیونکہ زمین پہلے ہی اس کی قیمت مقرر تھی اور اس کی قیمت مقرر تھی۔ قیاس کے لحاظ سے وقف باطل ہو جائے گا، کیونکہ کسی اور زمین کا نام پہلے کی جگہ پر نہیں رکھا گیا تھا۔ دوسرا فارمولہ: اگر بانی نے منتظم کے تبادلے کا حق مقرر کیا ہو نہ کہ اپنے لیے، تو منتظم اپنے لیے تبادلہ کر سکتا ہے، کیونکہ دوسرے کو اختیار دینے کا مطلب خود اختیار ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17666} {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17667} اگر بانی کے ساتھ کسی دوسرے آدمی کے لیے تبادلے کا حق مقرر کیا جائے تو بانی اکیلا حق رکھتا ہے، اور دوسرا آدمی اسے نہیں رکھتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17667} ایک شرط کے تحت تبادلے کی اجازت ہے خواہ اس چیز سے آمدنی اور فائدہ حاصل ہو، کیونکہ وقف اس طرح استعمال نہیں چھوڑتا، اور نہ ہی جج کی براہ راست کارروائی اور نہ ہی مرمت کے لئے آمدنی کی عدم موجودگی ضروری ہے۔ {حوالہ: فقہ الموسوعۃ-کویتیہ-نور-v3 صفحہ 17667} حنفیہ اس کے تبادلے کو محدود کرتے ہیں جو بانی نے قسم اور قسم میں بیان کیا ہے: اگر انہوں نے زمین کے بدلے کی شرط رکھی ہے تو اسے مکان نہیں بنایا جاسکتا۔ اگر اس نے ایک گاؤں کی زمین مقرر کی ہے، تو اسے دوسری زمین کے لیے نہیں بنایا جا سکتا، کیونکہ گاؤں کی زمینوں کی قیمت اور پیداوار میں فرق ہے۔ اگر اس نے متبادل کی وضاحت نہیں کی ہے، تو وہ اپنی مرضی کے مطابق کسی بھی رئیل اسٹیٹ کا تبادلہ کر سکتا ہے، چاہے زمین، مکان یا قصبہ، کیونکہ شرط عمومی ہے۔ {حوالہ:فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 17667} اگر شرط ایک تبادلے پر محیط ہو تو بانی دوسری زمین کو تہائی کے بدلے نہیں دے سکتا، کیونکہ شرط صرف پہلی میں پوری ہوئی تھی، جب تک کہ الفاظ اس کا اظہار نہ کریں۔ دوسری صورت: بانی نے وقف میں تبادلے کی شرط نہیں رکھی، خواہ اس نے اس کی عدم موجودگی کی شرط رکھی ہو یا خاموش رہے، لیکن وقف ایسی حالت میں آیا جس میں اس سے کوئی فائدہ نہیں ہوتا، جیسے کہ نہ پیداوار دینا اور نہ ہی اس کا پردہ کرنا۔ اس معاملے میں تبادلے کی اجازت ساؤنڈر ویو پر ہے جب جج اس کی اجازت دے اور اس میں اچھائی دیکھے۔ ابن عابدین البحر سے روایت کرتے ہیں کہ قادیخان کے الفاظ میں اختلاف ہے: ایک جگہ اس نے جج کو بانی کی شرط کے بغیر تبادلہ کرنے کی اجازت دی جہاں اس نے بھلائی دیکھی۔ دوسرے میں اس نے منع کیا یہاں تک کہ جب زمین ایسی حالت میں آگئی ہو جہاں کوئی فائدہ نہ ہو۔ صحیح قول یہ ہے کہ جج درج ذیل شرائط پر تبادلہ کر سکتا ہے، جن میں سے پہلی یہ ہے کہ عطا کردہ چیز مکمل طور پر استعمال سے خارج ہو گئی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17667} تبادلے کی شرائط میں سے، جیسا کہ احناف کہتے ہیں: فروخت کی قیمت کم نہیں ہونی چاہیے۔ وقف کی کچھ پیداوار ہونی چاہیے جس سے اس کی مرمت کی جا سکے۔ تبادلہ کرنے والا علم اور عمل کا آدمی ہونا چاہیے، تاکہ مسلمانوں کی اوقاف کو نقصان نہ پہنچے۔ متبادل رئیل اسٹیٹ ہونا چاہیے نہ کہ نقد؛ اور چیز کسی ایسے شخص کو فروخت نہیں کی جاسکتی جس کی گواہی اس کے حق میں یا بانی کے وارثوں کے قرض خواہ کو قبول نہ ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17668} تبادلہ اور متبادل ایک قسم کا ہونا چاہیے۔ ابن عابدین قنالی زادہ کا حوالہ دیتے ہوئے کہتے ہیں کہ اس کی پیداوار کے لیے وقف کے لیے شاید یکسانیت کی ضرورت نہیں ہے، کیونکہ جس چیز میں بڑی واپسی اور تھوڑی دیکھ بھال ہوتی ہے: دکان کے کرایہ کے برابر کرایہ دینے والی زمین کے بدلے دکان کا تبادلہ بہتر ہے، کیونکہ زمین زیادہ دیر تک رہتی ہے اور اس کی مرمت کی ضرورت کم ہے۔ جبکہ رہائش کے لیے رکھی گئی وقف کا فیصلہ رہائش گاہ سے کیا جاتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17668} القنیہ میں، مکان کا وقف دوسرے مکان کے بدلے صرف اسی صورت میں کیا جا سکتا ہے جب نیا مکان اسی سہ ماہی میں ہو یا بہتر سہ ماہی میں۔ الٹ جانے کی اجازت نہیں ہے، چاہے وہ گھر رقبہ، قیمت اور کرایہ کے لحاظ سے بڑا ہو، کیونکہ یہ کم سہ ماہی میں تباہ ہو سکتا ہے۔ بحرالرائق نے ابن وہبان کی نظم کی تفسیر کا حوالہ دیتے ہوئے پوچھا ہے کہ کیا تبادلہ جائز ہے جب بانی نے اس سے منع کیا ہو یا جب منتظم کو تبادلہ کرنے سے پہلے ہٹا دیا جائے یا جب وہ تبادلہ کرنے کا فیصلہ کرے تو اسے ہٹا دیا جائے؟ ترسوسی نے جواب دیا کہ کوئی منتقلی حکم نہیں ہے، اور یہ کہ اسکول کے قواعد کا مطلب ہے کہ جج اس میں اچھائی دیکھ کر تبادلہ کر سکتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17668} یہی کام محمد سے نقل کرتا ہے کہ اگر ایک مختص زمین پیداوار میں کمزور ہو گئی ہو اور منتظم اس کی قیمت سے زیادہ پیداوار والی دوسری زمین خرید سکتا ہے تو وہ اسے بیچ کر خرید سکتا ہے۔ بعض شیوخ نے خرید و فروخت سے منع کیا ہے خواہ وقفہ ختم ہوا ہو یا نہ ہو۔ قادیخان کہتے ہیں کہ تبادلے کی شرط کے بغیر کسی وقف کو بیچا یا تبدیل نہیں کیا جا سکتا خواہ اس کی زمین کھاری اور ناقابل استعمال ہو، کیونکہ وقف کا مطلب دائمی ہے اور اسے فروخت نہیں کیا جاتا۔ تبادلے کی طاقت صرف ایک شرط سے پیدا ہوتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17668} وقف کی پیداوار ہے اور وہ معذور نہیں ہے۔ لیکن تبادلے سے کچھ عمومی فائدہ ہو گا، اور متبادل فائدہ اور پیداوار میں بہتر ہے۔ ابن عابدین کہتے ہیں کہ پسندیدہ قول پر اس کی اجازت نہیں ہے جیسا کہ قنالی زادہ نے اس کا تصفیہ کیا ہے۔ {حوالہ: فقہ الموسوعۃ-کویتیہ-نور-v3 ص17669} ابن عابدین نے العشبہ سے یہ بھی نقل کیا ہے کہ پیداواری وقف کا تبادلہ صرف چار صورتوں میں ہو سکتا ہے: پہلا، جب بانی نے تبادلے کی شرط رکھی ہو۔ دوسرا، جب غاصب نے زمین کو سمندر میں بہا دیا، تاکہ وہ اس کی قیمت ادا کرے اور منتظم اس سے زمین خریدے۔ تیسرا، جب غاصب قبضے سے انکار کرتا ہے اور اس کا کوئی ثبوت نہیں ہے، تاکہ منتظم متبادل خریدنے کے لیے قیمت لے۔ اور چوتھا، جب کوئی زمین کا خواہش مند ہو اور اس کے بدلے زیادہ پیداوار اور بہتر جگہ پیش کرے، جو ابو یوسف کے نزدیک جائز ہے اور فتویٰ ہے جیسا کہ قاری الہدایہ کے فتووں میں ہے۔ النحر کا مصنف کہتا ہے کہ صدر الشریعہ کی تردید اس کے خلاف ہے: ہم ابو یوسف کے قول پر فتویٰ نہیں دیتے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17669} مالکیوں کے درمیان وقف شدہ جائیداد کا تبادلہ۔ مالکی ریل اسٹیٹ اور منقولہ سامان کی فروخت اور بدلے میں فرق کرتے ہیں۔ وہ منقولہ سامان کے تبادلے کی اجازت دیتے ہیں جب کوئی فریق ان کو برقرار نہ رکھ سکے اور ان کے تباہ ہونے کا خطرہ ہو، یا جب ان کا فائدہ ختم ہو جائے تاکہ وہ اس مقصد کے لیے استعمال نہ ہو سکیں جس کے لیے انھیں حراست میں لیا گیا تھا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17669} اس طرح چھاپہ مار یا سرحدی محافظ کے لیے خدا کی راہ میں عطا کردہ گھوڑے کو سرکاری خزانے سے کھلایا جاتا ہے۔ اگر کوئی خزانہ نہیں ہے تو اسے بیچ دیا جاتا ہے اور قیمت سے اسلحہ اور ایسی ہی چیزیں خرید لی جاتی ہیں جنہیں کھانے کی ضرورت نہیں ہوتی۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17669} کوئی بھی منقولہ وقف جو جائداد نہ ہو اور استعمال نہ ہوسکے، جیسے گھوڑا جسے ریبیج لگ گیا ہو، ایسا کپڑا جو پرانا ہو، غلام جو بوڑھا ہو جائے، یا کتابیں جو بوسیدہ ہو جائیں۔ اس کی قیمت اگر ممکن ہو تو ایسی چیز پر خرچ کی جاتی ہے یا اگر پوری نہ خریدی جا سکتی ہو تو فلاں چیز کے حصہ پر خرچ کی جاتی ہے اور اگر یہ ممکن نہ ہو تو اس کی قیمت صدقہ کر دی جاتی ہے۔ اسی طرح چھاپے مارنے یا افزائش کے لیے وقف کیے گئے نر جانور جب ضرورت سے زیادہ ہوں یا ایسی مادہ جو بہت بوڑھی ہو چکی ہوں ان کو بیچ دیا جاتا ہے اور جوان مادوں کو قیمت کے ساتھ خرید لیا جاتا ہے، تاکہ دودھ اور اولاد برقرار رہے، جیسا کہ آخرت کا خاتمہ ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17669} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17670} رئیل اسٹیٹ کے لیے، مالکی مکتب کا خیال ہے کہ اسے فروخت نہیں کیا جا سکتا خواہ وہ تباہ ہو جائے اور اسے استعمال نہیں کیا جا سکتا، خواہ وہ مکان کی طرح ہو یا دکان کے لیے، خواہ وہ کسی دوسرے گھر کے لیے ہو۔ ناکارہ چیز ابو الفراج مالک سے روایت کرتے ہیں کہ امام اگر اس میں بھلائی دیکھے تو اسے بیچ سکتا ہے اور اس جیسی قیمت خرچ کر سکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17670} بعض مالکیوں نے تباہ شدہ مکان کے تبادلے کی اجازت دی۔ التاج والعقل نے اوقاف کے تباہ شدہ مکان کو بیچنے کی قطعی ممانعت کی اطلاع دی ہے۔ ابن الجہم نے اس کی وجہ یہ بتائی ہے کہ کوئی شخص اسے برسوں کے لیے کرائے پر دے کر مرمت کرنے کے لیے مل جائے گا، تاکہ یہ اپنی سابقہ حالت میں واپس آجائے۔ ایک تباہ شدہ مکان کا غیر منقطع مکان کا تبادلہ متنازعہ ہے۔ ابن رشد کہتے ہیں کہ اگر زمین کا ایسا ٹکڑا تمام استعمال سے محروم ہو جائے اور اس کی مرمت یا اجازت نہ ہو تو اس کے بدلے میں کوئی حرج نہیں کہ اس کے بدلے میں وقف ہو جائے، وجہ ثابت ہونے اور وقف کا فائدہ واضح ہونے کے بعد قاضی کے حکم سے۔ یہ ریکارڈ اور گواہ ہونا ہے. {حوالہ:فقہ الموسوعۃ-کویتیہ-نور-v3 صفحہ 17670} مالکی مسجد کو ضروری وسیع کرنے کے لیے جائیداد کی فروخت کی اجازت دیتے ہیں، خواہ وقف نام یا بے نام افراد کے لیے ہو۔ ابن رشد کہتے ہیں کہ ابن القاسم کے مجموعہ کی ظاہری رپورٹ ہر مسجد کے لیے اس کی اجازت دیتی ہے، جیسا کہ سہنون کا قول ہے۔ النوادر نے مالک اور دوسروں سے نقل کیا ہے کہ اس کا اطلاق اجتماعی مساجد پر ہوتا ہے جب ضرورت ہو، نہ کہ محلے کی مساجد پر، کیونکہ وہاں ضرورت ایک جیسی نہیں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17670} وقف شدہ جائیداد قبرستان یا لوگوں کے زیر استعمال سڑک کو چوڑا کرنے کے لیے بھی بیچی جا سکتی ہے، خواہ مستحقین یا منتظم کی مرضی کے خلاف ہو۔ فائدہ اٹھانے والے اس بات کے پابند ہیں کہ قیمت کسی اور وقف میں ڈالی جائے، لیکن جج ان کو اس کی جگہ پر کوئی دوسرا وقف قبول کرنے پر مجبور نہیں کر سکتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17670} الشرح الصغیر کہتے ہیں کہ مسجد کو چوڑا کرنے کے لیے لی گئی جائیداد کی قیمت ادا کی جاتی ہے اگر اوقاف نامزد افراد کے لیے رکھی گئی ہو۔ اگر یہ بے نام افراد مثلاً غریبوں کے لیے رکھی گئی ہو تو کوئی معاوضہ واجب نہیں ہے، کیونکہ کسی نامی شخص کا اس پر کوئی حق نہیں ہے، اور مسجد میں داخل ہونے پر بانی کو جو ثواب ملتا ہے وہ اس سے زیادہ ہوتا ہے جس کا اس نے پہلے ارادہ کیا تھا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17671} مالکیہ کہتے ہیں کہ اگر بانی نے تبدیلی اور تبادلے کی شرط رکھی تو اس کی شرط پر عمل کیا جاتا ہے۔ اگر اس نے یہ شرط رکھی کہ اگر مطلوبہ قیمت پیش کی جائے تو جائیداد بیچ دی جائے اور دوسری خریدی جائے، النوادر اور المطیعہ نے اطلاع دی ہے کہ اس کی اجازت نہیں ہے۔ اگر اس کے باوجود کیا جاتا ہے تو یہ کھڑا رہتا ہے اور بانی کی شرط لاگو ہوتی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 17671} فتح العلی المالک نے ایک واقعہ بیان کیا ہے: مسلمانوں کے زیر استعمال سڑک پر ایک وقف شدہ زمین، جس کے بانی نے یہ شرط رکھی کہ اسے فروخت یا تبادلہ نہ کیا جائے، سڑک کے منتظم نے ریاستی زمین کے بدلے کا تبادلہ کیا تھا، اور اس زمین کو منتظم نے ریاست کے حوالے کر دیا تھا۔ داردیر کا موقف ہے کہ جہاں بانی نے کوئی تبادلے کی شرط نہیں رکھی اور کوئی رعایت نہیں دی، تبادلہ باطل ہے۔ ایڈمنسٹریٹر کو ریاست کی زمین اس کے مالک کو واپس کرنی چاہیے اور خود مختص زمین کو واپس لینا چاہیے، اور جو انکار کرتا ہے حکمران اسے روکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17671} شافعیوں کے درمیان وقف شدہ جائیداد کا تبادلہ۔ محدث کہتا ہے کہ اگر کوئی مسجد وقف کر دی جائے اور پھر اس کو ویران کر دیا جائے کہ اس میں نماز ختم ہو جائے تو وہ ملکیت میں واپس نہیں آتی اور مالک اس میں تصرف نہیں کر سکتا، کیونکہ جو چیز خدا کے حق کے لیے چھوڑی گئی ہے وہ تباہی سے ملکیت میں واپس نہیں آتی، جیسا کہ غلام کو آزاد کرنے کے بعد معذور ہو جانے والا اسے دوبارہ حاصل نہیں کرتا۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17671} الشربینی کہتے ہیں کہ آواز والا قول اس بات کی اجازت دیتا ہے کہ مسجد کی چٹائیوں کو جب وہ خستہ ہو جائے اور اس کے شہتیر جب ٹوٹ جائیں یا تقریباً اتنے ہی ہوں اور جلنے کے علاوہ کسی چیز کے قابل نہ ہوں، ایسا نہ ہو کہ ہجوم سے ضائع ہو جائیں اور جگہ خالی نہ ہو۔ ان کی قیمت سے تھوڑی سی رقم اوقاف کو لوٹنا انہیں کھونے سے بہتر ہے۔ ایسی چیزیں اوقاف کی فروخت میں شمار نہیں ہوتیں، کیونکہ ان کا کوئی وجود نہیں ہوتا۔ یہی وہ قول ہے جس پر دو شیوخ الرفاعی اور النووی نے اعتبار کیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17671} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17672} الرفاعی کہتے ہیں کہ مشابہت یہ ہے کہ پرانی قیمت کے ساتھ بدلی چٹائی خریدی جائے، اور الاسترا کو مقدمہ میں ذکر کرنے کے لیے استعمال کیا جائے۔ مسجد کے لیے دی گئی یا خریدی گئی چٹائیاں ضرورت پڑنے پر بیچ دی جاتی ہیں۔ شہتیر جو دوسری چیزوں کے لیے استعمال کیے جا سکتے ہیں، جیسے تختے اور دروازے، کبھی فروخت نہیں ہوتے۔ اگر کسی مسجد کے گرنے کا خطرہ ہو تو جج اس کو اتار کر دوسری مسجد بنانے کے لیے استعمال کر سکتا ہے، اگر وہ مناسب سمجھے، اور قریب ہی اس کی تعمیر بہتر ہے۔ لیکن وہ مسجد کے سامان سے کنواں نہیں بنا سکتا۔ اگر کسی پل پر موجود وقف سیلاب سے تباہ ہو جائے اور پل کی ضرورت نہ ہو جہاں وہ کھڑا ہے، تو اسے جہاں ضرورت ہو وہاں منتقل کیا جا سکتا ہے۔ ایک سرحد پر ایک وقف کی آمدنی جو محفوظ ہو چکی ہے، منتظم کی طرف سے رکھی جاتی ہے، اگر سرحد واپس آجائے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17672} اگر عطا شدہ کھجور خشک ہو جائے، عطا شدہ جانور معذور ہو جائے یا مسجد کے شہتیر ٹوٹ جائیں تو اس میں دو قول ہیں، اور آواز دینے والا یہ ہے کہ اسے فروخت نہ کیا جائے جیسا کہ مسجد میں ہے۔ دوسرا نقطہ نظر فروخت کی اجازت دیتا ہے، کیونکہ اب اس چیز کے فائدے کی امید نہیں ہے۔ اس کے بعد قیمت اس قدر کا قاعدہ لیتی ہے جو عطا شدہ جائیداد کی تباہی سے حاصل ہوتی ہے۔ اگر عطا شدہ چیز کی ملکیت فائدہ اٹھانے والے کی ہے، جو کہ کم نظر ہے، تو قیمت اسی کے پاس جاتی ہے۔ اگر یہ خدا کا ہے، جو زیادہ واضح نظریہ ہے، تو اس جیسی چیز قیمت کے ساتھ خریدی جاتی ہے تاکہ اس کی جگہ وقف ہوجائے۔ ابو حامد الاصفرینی کہتے ہیں کہ قیمت بغیر کسی تنازعہ کے اپنی جگہ وقف ہونے کے لیے ایسی چیز خریدتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17672} حنبلیوں کے درمیان وقف شدہ جائیداد کا تبادلہ۔ ان کے درمیان تبادلے کی اجازت ہے جب عطا کردہ چیز اس مقصد کے لیے موزوں نہ ہو جس کے لیے اسے وقف کیا گیا تھا اور اب اس کے استعمال کے قابل نہ رہے خواہ وہ منقولہ ہو یا جائیداد، اور خواہ وہ مسجد ہو یا نہ ہو۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17673} ان کا خیال ہے کہ وقف بیچنا حرام اور ناجائز ہے اور اس کا تبادلہ کرنا چاہے اس سے بہتر چیز کے لیے ہو، صریح عبارت سے ناجائز ہے، سوائے اس کے کہ اس کا مطلوبہ فائدہ برباد ہو جائے اور اس کی پیداوار اس کی مرمت نہ ہو، ایسی صورت میں فروخت نہیں ہو سکتی۔ یا جہاں اس کا مطلوبہ فائدہ بربادی کے علاوہ کسی اور وجہ سے ضائع ہو، جیسے لکڑی جس میں شگاف پڑ گیا ہو اور گرنے کا اندیشہ ہو۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17673} اگر اوقاف مسجد ہو جس کا استعمال اس لیے ضائع ہو جائے کہ یہ اس کے لوگوں کے لیے بہت تنگ ہے اور اسے چوڑا نہیں کیا جا سکتا، یا اس کا محلہ خراب ہونے کی وجہ سے، یا اس جگہ گندگی ہے اور اس میں نماز کو روکتا ہے، تو القدی کے مطابق اس کی قیمت رکھنا صدقہ کی طرح ہے۔ یہ تو جائیداد کا ضیاع ہے۔ چونکہ ایک وقف دائمی ہے، جب اسے ایک ہی چیز میں نہیں رکھا جا سکتا ہے تو اس کا مقصد دوسری چیز میں محفوظ رہتا ہے، اور ان کے بدلے جانے کے بعد ان چیزوں کی طرح برتاؤ کیا جاتا ہے جیسے خود۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17673} سوکھا ہوا درخت بیچا جا سکتا ہے۔ اس طرح ایک شہتیر جو ٹوٹ چکا ہے، ختم ہو چکا ہے یا ٹوٹنے یا گرنے کا اندیشہ ہے۔ الطلخیس کا کہنا ہے کہ جب ایک عطا شدہ شہتیر ٹوٹنے کے قریب ہو، یا ایک مکان گرنے کے قریب ہو، اور یہ معلوم ہو کہ تاخیر اس کے استعمال سے باہر ہو جائے گی، تو اسے اس کی قیمت بچانے کے لیے فروخت کیا جاتا ہے۔ اسکولوں، شفاخانوں اور کاروان سرائیوں کو، جو برباد ہو جائیں، بغیر کسی تنازعہ کے ایک نظریہ سے فروخت کیا جا سکتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17673} چھاپہ مارنے کے لیے ایک عطا کردہ گھوڑا جو اب قابل نہیں ہے بیچا جاتا ہے اور اس کے لیے موزوں دوسرا گھوڑا خرید لیا جاتا ہے۔ ایک بار جب متبادل خریدا جاتا ہے تو یہ ایک وقف بن جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17673} بانی کا یہ شرط کہ ناقابل استعمال وقف فروخت نہ کیا جائے باطل ہے، اور اسے بیچنا ضروری ہے۔ بیچنے والا وہ جج ہوتا ہے جہاں وقف عوامی بھلائی کے لیے ہوتا ہے، جیسے غریبوں، مسجدوں یا پلوں؛ جہاں یہ کسی نامزد شخص یا نامزد گروپ کے لیے، یا مسجد کے نمازیوں یا مؤذن کے لیے رکھا جاتا ہے، اوقاف کا خصوصی منتظم اسے فروخت کرتا ہے۔ اس کے باوجود، یہ جج کی اجازت سے بہتر ہے، کیونکہ اس طرح کی فروخت موجودہ ہولڈرز کے بعد آنے والوں کو پابند کرتی ہے، جیسے غیر حاضر فریق کے خلاف کی گئی فروخت۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17673} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17674} ایک بار وقف کے استعمال کے لیے متبادل خرید لیا جائے تو یہ وقف بن جاتا ہے۔ سمجھداری کا طریقہ یہ ہے کہ اسے ایک نئے فارمولے کے ذریعے دوبارہ عطا کیا جائے، ایسا نہ ہو کہ بعد میں آنے والا کوئی شخص یہ نہ دیکھے کہ خریداری نے اسے وقف بنا دیا ہے، اسے منسوخ کر دیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17674} بانی کی ملکیت میں وقف کی واپسی۔ احناف کے محمد بن الحسن کا خیال ہے کہ اگر مسجد کے اردگرد جو چیز تباہ ہو جائے اور اس کی ضرورت باقی نہ رہے، حتیٰ کہ مسجد برقرار رہے، یا مسجد ہی خراب ہو جائے اور اس کی مرمت کا کوئی ذریعہ نہ ہو اور لوگوں کو اس کی ضرورت نہ رہے کیونکہ دوسری مسجد بن چکی ہو، تو وہ زندہ ہو تو اس کے بنانے والے کی ملکیت ہو جائے، یا اگر وہ مر جائے تو اس کے وارثوں کو۔ ابو یوسف اس سے متفق نہیں ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17674} محمد کا استدلال: بانی نے وقف کو ایک قسم کی عقیدت سے نوازا تھا اور چونکہ اس عقیدت کا خاتمہ ہوگیا ہے اس پر وقف ختم ہوجاتا ہے۔ یہ مسجد کی چٹائی اور گھاس کی طرح ہے جب اس کی ضرورت نہ ہو، یا جب مسجد برباد ہو جائے تو اس کا چراغ، جو اسے بنانے والے کی طرف لوٹتا ہے۔ کفن کی مانند جسے کسی جانور نے پھاڑ دیا ہو، جو اپنے مالک کے پاس واپس آجائے۔ اور حج کی تکمیل سے روکنے والے کی طرف سے پیش کی گئی قربانی کی طرح، جسے وہ رکاوٹ دور ہونے کے بعد ضائع کر سکتا ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17674} ابو یوسف کہتے ہیں کہ اسے قاضی کی اجازت سے دوسری مسجد میں منتقل کیا جاتا ہے اور اس کا ملبہ قاضی کی اجازت اور بعض مساجد پر خرچ ہونے والی قیمت سے فروخت کیا جاتا ہے۔ حنفی کا نتیجہ یہ ہے کہ اگر کوئی وقف تباہ ہو جائے اور اس کی مرمت کے لیے کوئی آمدنی نہ ہو تو محمد کے نزدیک وہ تعمیر کرنے والے یا اس کے وارثوں کو واپس کر دی جاتی ہے، حالانکہ ابو یوسف کے نزدیک نہیں۔ لیکن محمد کے خیال میں، صرف وہی چیز جو بانی کے مطلوبہ استعمال کو مکمل طور پر چھوڑ چکی ہے، ملکیت میں واپس آتی ہے، جیسے کہ ایک دکان جو جل گئی ہو اور اسے کسی چیز کے لیے چھوڑا نہیں جا سکتا، یا ہاسٹل یا محلے کا حوض جو مرمت کے بغیر تباہ ہو چکا ہے۔ جو کچھ آمدنی کے لیے بنایا گیا تھا وہ صرف اس کے ملبے کے طور پر ملکیت میں واپس آتا ہے، جبکہ اس کی کھلی زمین ایک وقفہ بنی ہوئی ہے، یہاں تک کہ ایک چھوٹے سے کرایے پر بھی۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17674} خلصہ بیان کرتی ہے کہ محمد نے ایک گھوڑے کے بارے میں کہا جسے خدا کی راہ میں وقف کر دیا گیا تھا اور سواری کے قابل نہیں تھا کہ اسے بیچ دیا جائے اور اس کی قیمت اس کے مالک یا اس کے وارثوں کو جائے، جیسا کہ مسجد میں ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17674} شافعی، آواز دینے والے کے مخالف ہیں، کہتے ہیں کہ اگر کوئی عطا شدہ چیز کسی ایسے سبب سے اپنا فائدہ کھو دے جو قابل واجب نہیں ہے، جیسے درخت خشک ہو جائے یا ہوا یا سیلاب سے اکھڑ جائے، اس سے پہلے کہ اس کے دوبارہ لگائے جائیں یا اس کا خاتمہ ہو جائے تو وہ اس چیز کو ختم کرنے کے لیے واپس کر دیتا ہے۔ واضح شافعی کا نظریہ یہ ہے کہ یہ ملکیت میں واپس نہیں آتا بلکہ وقف ہی رہتا ہے۔ حنبلی متفق ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17674} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17675} وقف کا انتظام۔ فقہاء اس بات پر متفق ہیں کہ اوقاف کا انتظام بانی کی شرط پر ہوتا ہے۔ اگر وہ اسے کسی نامی شخص کو تفویض کرتا ہے تو اس کی حالت کی پیروی کی جاتی ہے جیسا کہ عمر بن الخطاب نے کیا تھا جب انہوں نے اپنی بیٹی حفصہ کو اس کی زندگی کا انتظام کرنے کے لئے وقف چھوڑ دیا تھا، اور پھر اس کے رشتہ داروں کے بارے میں صحیح فیصلہ کرنے والوں کو، جیسا کہ البہقی کی روایت ہے۔ ابن قدامہ کہتے ہیں کہ اوقاف کا تصرف بانی کی شرط کے مطابق ہوتا ہے اور اسی طرح اس کا منتظم بھی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17675} اس بارے میں فقہاء کا اختلاف ہے کہ آیا بانی خود کو انتظامیہ سونپ سکتا ہے۔ احناف، شافعی اور حنبلی اس کی اجازت دیتے ہیں۔ مالکیوں کا کہنا ہے کہ اگر فائدہ اٹھانے والے نے اوقاف پر قبضہ نہ کیا ہو تو بانی کی موت، بیماری یا دیوالیہ ہونے سے وقف باطل ہو جاتا ہے۔ اگر فائدہ اٹھانے والے نے قبضہ کر لیا ہو اور بانی نے اپنے لیے انتظام مقرر کیا ہو تو اوقاف قائم ہے، لیکن بانی کسی دوسرے کو انتظامیہ تفویض کرنے پر مجبور ہے، کیونکہ وہ اسے اپنے لیے نہیں دے سکتا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17675} اگر بانی نے کسی منتظم کا نام نہ لیا ہو تو مالکیہ اور حنبلی یہ سمجھتے ہیں کہ جہاں اوقاف بے نام افراد کے لیے ہو، جیسے غریب، مساجد، حاکم جسے وہ منتخب کرتا ہے مقرر کرتا ہے، کیونکہ وہ خود اس کا انتظام نہیں کر سکتا۔ جہاں اوقاف صحیح دماغ کے نام سے فائدہ اٹھانے والے کے لئے ہے، وہ فائدہ اٹھانے والا اس کا انتظام کرتا ہے، کیونکہ یہ اس کی ملکیت اور اس کا فائدہ ہے، لہذا اس کی نگرانی مطلق ملکیت کی طرح ہے۔ اگر وہ صحیح فیصلہ کرنے والا نہیں ہے تو اس کا سرپرست اس کا انتظام کرتا ہے۔ حنبلی مکتب میں ایک امکان موجود ہے، جسے ابن ابی موسیٰ نے منتخب کیا، کہ حاکم اس کا انتظام کرے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17675} اوقاف کے انتظام کے بارے میں جہاں بانی نے اس کی شرط نہ رکھی ہو، حنفی کے خیالات مختلف ہیں۔ ابو یوسف کا خیال ہے کہ وقف خدا کا ہے اور انتظامیہ پہلے بانی کے پاس جاتی ہے، پھر اس کے عملدار کے پاس، پھر قاضی کے پاس۔ ہلال، مکتب کا بظاہر نظریہ یہ کہتا ہے کہ انتظامیہ بانی کی ہے، پھر اس کے ایگزیکٹو یا جج کی، کیونکہ ایک منتظم اپنا اختیار بانی کی شرط سے حاصل کرتا ہے، اس لیے یہ ناممکن ہے کہ اسے اختیار حاصل ہو جب کہ دوسرا اس سے اخذ کرے۔ اور بانی اوقاف کے قریب ترین شخص ہے۔ محمد کا خیال ہے کہ بانی کا کوئی انتظام نہیں ہے جب تک کہ وہ اسے متعین نہ کرے، کیونکہ اس کے لیے اوقاف کو متولی کے حوالے کرنا اس کے صحیح ہونے کی شرط ہے، اس لیے کہ ایک بار اسے سونپ دیا جائے تو بانی کا اس پر کوئی اختیار نہیں ہے۔ اگر بانی کسی منتظم کا نام لیے بغیر فوت ہو جائے تو جج بانی کے خاندان میں سے ایک متولی مقرر کرتا ہے جب کہ وہاں کوئی موزوں شخص مل سکتا ہے، یا تو اس لیے کہ ایسا شخص سب سے زیادہ متواضع ہے یا اس لیے کہ بانی کا مقصد انہیں عطا کرنا تھا۔ صرف اس صورت میں جب کوئی نہ ملے تو وہ کسی بیرونی شخص کو مقرر کرتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17676} مکتب کے خیال میں شافعیہ کا موقف ہے کہ اگر بانی کسی منتظم کا نام نہیں لیتے ہیں تو انتظامیہ جج کی ہے جسے ایسے معاملات پر عمومی اختیار حاصل ہے۔ دوسرا نقطہ نظر اسے بانی کو دیتا ہے، جس کے پاس تھا، اور تیسرا اسے فائدہ اٹھانے والے کو دیتا ہے، کیونکہ آمدنی اس کی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17676} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17677} منتظم کی اہلیت۔ فقہاء نے منتظم کی فٹنس کے لیے کئی شرائط رکھی ہیں۔ کچھ متفق ہیں اور کچھ اختلافی ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17676} پہلی شرط قانونی صلاحیت ہے۔ فقہاء اس بات پر متفق ہیں کہ منتظم بالغ اور سمجھدار ہونا ضروری ہے، کیونکہ ایک نابالغ یا ذہنی مریض میں صلاحیت کی کمی ہوتی ہے۔ یہ عام طور پر رکھتا ہے. {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17676} مالکیہ اور حنبلی مزید کہتے ہیں کہ اگر بانی نے کسی منتظم کا نام نہ لیا ہو اور فائدہ اٹھانے والا کوئی شخص ہو جیسا کہ زید یا عمرو تو فائدہ اٹھانے والا خود اس کا انتظام کرتا ہے۔ اگر وہ نابالغ یا دیوانہ ہے تو اس کا سرپرست اس کے ساتھ کھڑا ہوتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17676} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17677} حنبلی کہتے ہیں کہ کسی عطا شدہ چیز کی ملکیت فائدہ اٹھانے والے کے پاس جاتی ہے بشرطیکہ وہ نامی انسان ہو یا بالغ ہو، اور اگر وہ بالغ ہو اور اس کا فیصلہ کرنے والا محدود ہو۔ سرپرست کرتا ہے اگر وہ نابالغ، پاگل یا فضول خرچی کرنے والا ہے۔ ابن ابی موسیٰ کہتے ہیں کہ قاضی اس کا انتظام کرتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17677} حنفیہ: ابن عابدین نے الصاف کو نقل کیا ہے کہ نابالغ کو منتظم مقرر کرنا قیاس کے اعتبار سے باطل ہے، اور فقہی ترجیح کے اعتبار سے باطل ہے جب کہ وہ نابالغ ہے، اس لیے جب وہ نابالغ ہو جائے تو اس کے لیے منتظم مقرر ہو جاتا ہے۔ الشلبی کا خیال ہے کہ کسی نابالغ کو تفویض کرنا کبھی بھی درست نہیں ہے، کیونکہ انتظامیہ سرپرستی کی ایک شکل ہے اور زیر سرپرستی نابالغ کو دوسروں پر سرپرستی نہیں دی جا سکتی۔ ابن عابدین نے رشید الدین کے فتوے کا حوالہ دیا ہے کہ جو جج کسی نابالغ کو جو جائیداد رکھنے کی استطاعت رکھتا ہو اس کو انتظام تفویض کرتا ہے، کیونکہ یہ اسے عمل کرنے کا اختیار دیتا ہے۔ ایک نابالغ کے عمل سے عاجز ہونے کے بارے میں الصف کو پڑھ کر دونوں آراء میں صلح ہو سکتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17677} پاگل پن ملاقات کو روکتا ہے اور ایک بار ہونے کے بعد اسے ختم بھی کرتا ہے۔ ابن عابدین نے الفتح کا حوالہ دیا ہے کہ منتظم کو مستقل پاگل پن سے ہٹا دیا جاتا ہے جو کم از کم ایک سال تک رہتا ہے اور اگر وہ صحت یاب ہو جائے تو انتظامیہ اس کے پاس واپس آجاتی ہے، حالانکہ النحر کا کہنا ہے کہ یہ بانی کے نام سے منسوب شخص کے لیے ہے نہ کہ قاضی کے مقرر کردہ کے لیے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17677} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17678} شافعی کہتے ہیں کہ انتظامیہ کو پاگل پن نے چھین لیا ہے، اور الشبرملیسی کا کہنا ہے کہ جب کوئی عاقل شخص دفتر واپس لوٹتا ہے تو وہ واپس لوٹتا ہے۔ نئی ملاقات کے بغیر تنہا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17678} دوسری شرط عدل ہے۔ احناف کا اس میں اختلاف ہے کہ یہ شرط شرط ہے یا ترجیح۔ الصف کا کہنا ہے کہ قابل اعتماد اور قابل شخص کے علاوہ کسی کو مقرر نہیں کیا جاتا، خواہ وہ خود کام کرے یا نائب کے ذریعے، کیونکہ بے ایمان شخص کو عہدے سے ہٹانا انتظامیہ کا حصہ نہیں ہے۔ ابن عابدین کا خیال ہے کہ انصاف ترجیح کی شرط ہے نہ کہ جواز کی، اور یہ کہ جو منتظم غلط کام کی طرف رجوع کرتا ہے وہ برطرفی کا مستحق ہے لیکن خود بخود ہٹایا نہیں جاتا، جیسا کہ ایک جج جو غلط کام کی طرف رجوع کرتا ہے اسے آواز اور فتویٰ کی بنیاد پر ہٹایا نہیں جاتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17678} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17679} مالکی عدل کو اس شرط کے طور پر مانتے ہیں جب منتظم جج یا بانی کی طرف سے مقرر کیا گیا ہو۔ الحطب کا کہنا ہے کہ زیر حراست اوقاف کا انتظام بانی کے منتخب کردہ شخص کا ہے، جسے مذہب اور دیانت پر بھروسا ہونا چاہیے۔ اگر بانی غافل ہے تو انتظامیہ جج کے ہاتھ میں آتی ہے، جو کسی کو مقرر کرتا ہے جسے وہ منظور کرتا ہے۔ اگر منتظم بری طرح سے انتظام کرتا ہے اور اس پر بھروسہ نہیں کیا جاتا ہے، تو جج اسے ہٹا دیتا ہے، جب تک کہ فائدہ اٹھانے والا اپنے معاملات کا مالک ہو اور اسے قبول نہ کرے۔ القرافی کا کہنا ہے کہ ایک جج منتظم کو صرف غلطی کی وجہ سے ہٹاتا ہے، لیکن بانی اسے بغیر کسی غلطی کے بھی ہٹا سکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17678} شافعی اس منتظم میں ظاہری اور باطنی انصاف کے تقاضے کرتے ہیں جسے جج مقرر کرتا ہے۔ السبکی کہتے ہیں کہ بانی کی طرف سے مقرر کردہ شخص کے لیے ظاہری انصاف ہی کافی ہونا چاہیے۔ الاضراعی اس معاملے میں بھی ظاہری اور باطنی دونوں طرح کے انصاف کا تقاضا کرتا ہے، اور الشربینی پہلے قول کو ترجیح دیتے ہیں۔ اگر منتظم غلط ہو جائے تو اسے ہٹا دیا جاتا ہے، اور پھر انتظامیہ جج کے پاس جاتی ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17678} الشافعیہ کہتے ہیں کہ اگر کوئی منتظم خطا کار ہو جائے اور پھر دوبارہ، اس کا اختیار واپس آجاتا ہے اگر اسے اوقاف کی شرائط میں شرط بنایا گیا ہو اور اس کا نام ٹھیک رکھا گیا ہو۔ ورنہ ایسا نہیں ہوتا. النووی نے یہ فتویٰ دیا اور ابن الرفاع اور دیگر نے اس پر اتفاق کیا۔ الزرقاشی کہتے ہیں کہ یہ ظاہر ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17679} حنبلیوں کا خیال ہے کہ اگر انتظامیہ فائدہ اٹھانے والے کے علاوہ کسی اور کی ہو اور تقرری جج یا اصل منتظم کے ذریعہ کی گئی ہو تو انصاف ضروری ہے، کیونکہ یہ جائیداد پر اختیار ہے، جیسے یتیم کے مال کی سرپرستی۔ اگر وہ عادل نہیں ہے، تو اس کا ہاتھ اس کو بچانے کے لیے وقف سے ہٹا دیا جاتا ہے، اور اگر وہ تندرستی کی طرف لوٹتا ہے تو اس کا حق واپس آتا ہے۔ اگر منتظم بانی کی طرف سے مقرر کیا گیا تھا، انصاف کی ضرورت نہیں ہے، اور ایک قابل اعتماد شخص کو غلط کرنے والے کے ساتھ شامل کیا جاتا ہے؛ اس کا اختیار صرف اس وقت ہٹایا جاتا ہے جہاں وقف کو برقرار رکھنے کے لیے اسے ہٹانے کی ضرورت ہوتی ہے، کیونکہ وقف کو محفوظ رکھنا اس پر کسی ظالم کو اختیار دینے سے زیادہ اہمیت رکھتا ہے۔ جہاں انتظامیہ خود فائدہ اٹھانے والے سے تعلق رکھتی ہے، خواہ منصفانہ ہو یا نہ ہو، وہ اس پر بہتر دعویٰ رکھتا ہے، کیونکہ وہ اوقاف کا مالک ہے اور اسی طرح اپنے لیے انتظام کرتا ہے۔ بعض کہتے ہیں کہ اس کے ساتھ ایک قابل اعتماد شخص کو شامل کیا گیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17679} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17680} تیسری شرط قابلیت ⁦(کفایہ)⁩ ہے، یعنی اس شخص کی طاقت اور قابلیت ہے کہ وہ جس چیز کا انتظام کرتا ہے اس پر عمل کرے۔ شافعیہ اور حنبلی اس کا تقاضا کرتے ہیں، کیونکہ اوقاف کی حفاظت کرنا ایک دینی فریضہ ہے اور جس کی استطاعت نہ ہو وہ اسے محفوظ نہیں رکھ سکتا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17679} اگر قابلیت ختم ہو جائے تو شافعی کہتے ہیں کہ جج اس سے انتظامیہ ہٹا دیتا ہے چاہے اسے بانی کی طرف سے تفویض کیا گیا ہو۔ النووی کہتے ہیں کہ جب عیب ختم ہو جاتا ہے تو اس کی انتظامیہ واپس آ جاتی ہے اگر یہ اوقاف میں مقرر کیا گیا ہو اور بالکل ٹھیک نام رکھا گیا ہو۔ حنبلی کہتے ہیں کہ اگر قابلیت ختم ہو جائے تو اسے ہٹایا نہیں جاتا، بلکہ اس کے ساتھ ایک مضبوط اور قابل اعتماد منتظم شامل کیا جاتا ہے، تاکہ مقصد حاصل کیا جا سکے۔ احناف کا کہنا ہے کہ منتظم کو وہاں سے ہٹا دیا جانا چاہیے جہاں وہ قابل اعتماد یا نااہل ہو ⁦(او سی آر متن یہاں 'بانی' پڑھتا ہے، غالباً منتظم کے لیے ایک پرچی، شک کے طور پر نشان لگا دیا گیا ہے)⁩۔ مالکیوں کے الفاظ بھی اس بات پر دلالت کرتے ہیں کہ صلاحیت کی ضرورت ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17679} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17680} چوتھی شرط اسلام ہے۔ حنبلیوں کا خیال ہے کہ منتظم کا مسلمان ہونا ضروری ہے اگر فائدہ اٹھانے والا مسلمان ہو یا چیز مسجد یا اس جیسی ہو، سورۃ النساء آیت نمبر 141 پر انحصار کرتے ہوئے، جسے وہ اس شرط کے لیے نقل کرتے ہیں۔ اگر اوقاف نامی کافر کے لیے ہے تو ایک کافر کو منتظم بنایا جا سکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17680} حنفیہ ذمی کو منتظم بننے کی اجازت دیتے ہیں اور اسلام کی ضرورت نہیں رکھتے۔ اگر جج کسی ذمی کو کسی وجہ سے ہٹاتا ہے اور وہ پھر مذہب تبدیل کر لیتا ہے تو انتظامیہ اسے واپس نہیں کرتی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17680} الرملی کا خیال ہے کہ وصیت اور شادی کے ساتھ مشابہت ذمی کی طرف سے ذمی مستحقین کے لیے وقف کے انتظام کو جائز بناتی ہے، بشرطیکہ وہ اپنے مذہب میں راست باز ہو، لیکن یہ رد ہے کیونکہ عدل کا حقیقی تقاضا ہے۔ الشبرملیسی کا کہنا ہے کہ رد کرنا صوتی نقطہ نظر ہے۔ وہ اپنے وارڈ کے ذمی کی شادی کو الگ کرتا ہے، جہاں سرپرست کو اپنے وارڈ کو شرمندگی سے بچانے کے لیے فطری پابندی ہوتی ہے، جس کا اطلاق وقف پر نہیں ہوتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17681} منتظم کی اجرت۔ اس موضوع میں اجرت پر اس کے حق کا احاطہ کیا گیا ہے، چاہے وہ بانی یا جج کے ذریعہ مقرر کیا گیا ہو، اس کی رقم، اور آیا وہ واجب الادا ہے جہاں دونوں نے اس کا نام نہیں لیا ہے۔ اجرت کے حق کے بارے میں: فقہاء کا خیال ہے کہ منتظم کو اوقاف کو چلانے اور اس کے امور کی دیکھ بھال میں اس کے کام کی اجرت واجب ہے۔ وہ جو ثبوت پیش کرتے ہیں ان میں عمر کے الفاظ بھی شامل ہیں جب انہوں نے خیبر میں اپنی زمین عطا کی تھی کہ جو کوئی اس کا انتظام کرے وہ مناسب مقدار میں کھائے یا کسی دوست کو کھلائے بغیر اس سے فائدہ اٹھائے۔ علی ان غلاموں کی دیکھ بھال کرتا ہے جنہیں اس نے زمین پر کام کرنے کے لیے عطا کیا تھا، آمدنی کا چارج۔ زکوٰۃ جمع کرنے والے سے مشابہت؛ اور یہ قول نبی سے منسوب ہے کہ جو کچھ آپ کی بیویوں کے نفقہ اور مزدور کی اجرت کے بعد باقی رہ جاتا ہے وہ صدقہ ہے۔ ابن حجر کہتے ہیں کہ وہاں مزدور سے مراد زمین کا متولی ہے، لہٰذا اس قول سے معلوم ہوتا ہے کہ اس کی اجرت حلال ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17681} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17682} اجرت کے تعین پر۔ اگر بانی اسے متعین کرتا ہے، تو منتظم وہی لیتا ہے جو بانی نے مقرر کیا تھا چاہے وہ معمول کی اجرت سے زیادہ ہو۔ احناف، شافعی اور حنبلی کا یہی قول ہے۔ احناف کا کہنا ہے کہ اگر بانی نے معمول سے کم اجرت مقرر کی تو جج درخواست پر پوری کر دیتا ہے۔ شافعی کہتے ہیں کہ اگر بانی نے خود کو منتظم بنایا اور اپنے لیے اجرت مقرر کی تو یہ معمول کی اجرت سے زیادہ نہیں ہو سکتی۔ اگر اس نے زیادہ مقرر کیا تو وقف باطل ہے، کیونکہ یہ اپنے اوپر وقف ہوگا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17682} حنبلی کہتے ہیں کہ اگر بانی نے کوئی اجرت مقرر کی ہو اور وہ عام اجرت کے برابر ہو تو منتظم اسے لے لیتا ہے۔ اگر یہ زیادہ ہے، تو اوقاف کی ضرورت کے اخراجات، جیسے ٹرسٹیز اور دیگر، اضافی سے ادا کیے جاتے ہیں جب تک کہ صرف معمول کی اجرت باقی رہ جاتی ہے، جب تک کہ بانی اسے بالکل نہ دے دے۔ مالکیوں نے کوئی رقم مقرر نہیں کی اور اسے بانی یا قاضی پر چھوڑ دیا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17682} اگر بانی کوئی اجرت مقرر نہ کرے تو جج اسے طے کرتا ہے۔ حنفیہ اور حنبلی کا موقف ہے کہ قاضی کی اجرت معمول کی اجرت سے زیادہ نہیں ہونی چاہیے، اور اگر وہ زیادہ مقرر کرے تو زیادتی روک دی جاتی ہے۔ مالکی معاملہ جج کی صوابدید پر چھوڑ دیتے ہیں۔ ابن الفتوح کا کہنا ہے کہ جج مقرر کردہ منتظم کو اس کے کام کے مطابق ایک مقررہ ماہانہ وظیفہ دے سکتا ہے جیسا کہ ائمہ نے دیا تھا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17682} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17683} شافعی کہتے ہیں کہ اگر بانی کوئی اجرت کا نام نہ دے تو منتظم کی آواز پر کوئی اجرت نہیں ہے اور وہ اختتام سے کچھ نہیں لے سکتا۔ اگر وہ اسے لے لیتا ہے تو وہ ذمہ دار ہے اور اسے جج کے حوالے کرنے سے ہی بری ہو جاتا ہے۔ اگر منتظم جج سے اس کے لیے اجرت مقرر کرنے کو کہے تو وہ یتیم کی جائیداد کے محافظ کی طرح ہے جو جج سے اس کی فیس مقرر کرنے کو کہتا ہے۔ العراقی، جو البقینی کا قول نقل کرتا ہے، کہتا ہے کہ منتظم پھر جہاں ضرورت ہو وہاں اجرت لیتا ہے، یا تو اس کے نفقہ کی رقم، جیسا کہ الرفاعی نے ترجیح دی، یا اس کی نفقہ اور معمول کی اجرت سے کم، جیسا کہ النووی نے ترجیح دی۔ ایک اور قول یہ ہے کہ اس پر معمول کی اجرت واجب ہے خواہ وہ اس کے نفقہ سے زیادہ ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17683} اگر بانی کوئی اجرت مقرر کرے۔ احناف کے الرملی کہتے ہیں کہ منتظم کو کچھ بھی نہیں ہے جب تک کہ جج اپنے کام کی اجرت مقرر نہ کرے۔ ابن عابدین نے نتیجہ اخذ کیا کہ جہاں بانی منتظم کے لیے ایک رقم کا نام رکھتا ہے، وہ اس کے پاس ہے، چاہے وہ بڑا ہو یا چھوٹا، چاہے وہ کام کرے یا نہ کرے، بشرطیکہ یہ کام کے بدلے میں مقرر نہ ہو۔ جہاں بانی کسی کا نام نہیں لیتا اور جج معمول کی اجرت طے کرتا ہے، یہ درست ہے۔ اگر وہ زیادہ ٹھیک کرتا ہے تو اضافی روک دیا جاتا ہے۔ اور اگر منتظم کوئی کام نہیں کرتا ہے تو اس کی کوئی اجرت نہیں ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17683} اگر جج کسی منتظم کو مقرر کرتا ہے اور کوئی اجرت کا نام نہیں لیتا، تو جہاں رواج یہ ہے کہ کام معمول کی اجرت کے بغیر نہیں ہوتا، تو وہ معمول کی اجرت کا مستحق ہے، کیونکہ رواج ایک شرط کی طرح ہے۔ ورنہ کچھ نہیں. {حوالہ:فقہ الموسوع کویتیہ نور-v3 صفحہ 17683} ابن نجیم نے القنیہ کا حوالہ دیتے ہوئے ایک جج کے تقرر کے بارے میں دو حنفی آراء بیان کی ہیں جس کو کوئی اجرت نہیں دی جاتی: پہلا یہ کہ اس کے پاس کچھ نہیں ہے خواہ وہ ایک سال کام کرے۔ دوسرا یہ کہ متولی کی اجرت واجب ہے جیسا کہ وہ کوشش کرتا ہے، چاہے جج یا کوارٹر کے مکین اس کے لیے اجرت مقرر کریں یا نہ کریں، کیونکہ کوئی بھی شخص بغیر اجرت کے سرعام تحویل قبول نہیں کرتا، اور رواج ایک شرط کی طرح ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17683} جہاں اوقاف کے منتظم ہوتے ہیں وہاں مالکی اور حنبلی اور شافعی اجرت کو ایک خاص طریقے سے دیکھتے ہیں۔ شافعیوں کا خیال ہے کہ اگر بانی نے منتظم کو کوئی اجرت نہیں دی ہے تو وہ صحیح نظر میں اس کا حقدار نہیں ہے۔ اگر معاملہ جج کے پاس بھیجا جاتا ہے، تو اسے وہ جگہ دی جاتی ہے جہاں ضرورت ہوتی ہے، جیسا کہ اوپر بیان کیا گیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17684} حنبلیوں کے تین قول ہیں۔ پہلا یہ کہ منتظم اوقاف کی آمدنی سے معقول مقدار میں کھا سکتا ہے، خواہ وہ محتاج ہو یا نہ ہو، زکوٰۃ جمع کرنے والے سے مشابہت سے۔ یہ ابو الخطاب کا قول ہے۔ دوسرا یہ کہ وہ یتیم کے سرپرست سے مشابہت کے ساتھ معمول کی اجرت یا اس کی کفالت سے کم لے اور اس کا حق صرف اسی صورت میں ہے جب وہ غریب ہو۔ تیسرا یہ ہے کہ ایک منتظم جو اپنے کام کے لیے اجرت لینے کے لیے جانا جاتا ہے، اسے معمول کی اجرت کا حق حاصل ہے، جو کہ اسکول کی مشابہت ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17684} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17685} مالکیہ، جیسا کہ ابن فتوح کہتے ہیں، جج کو اوقاف میں ایک مقررہ ماہانہ وظیفہ دینے دیں، جو اس کے کام کے حساب سے مقرر ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17684} اجرت کا ذریعہ۔ جمہور فقہاء یعنی حنفیہ، مالکیہ سوائے ابن عتاب، شافعیہ اور حنبلیوں کے نزدیک منتظم کی اجرت خواہ بانی کی طرف سے مقرر کی گئی ہو یا قاضی کی طرف سے مقرر کی جاتی ہے، اوقاف کی آمدنی سے آتی ہے، عمر نے اپنے وقف کے بارے میں یہ قول نقل کیا ہے کہ جو شخص اس کا انتظام کرے وہ اس میں سے ناپ تول کے بغیر مال کھا سکتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17685} مالکیوں میں سے ابن عتاب کا خیال ہے کہ اجرت صرف سرکاری خزانے سے آتی ہے۔ اگر اوقاف سے لیا جائے تو واپس کر دیا جاتا ہے اور خزانے سے وصول کیا جاتا ہے اور اگر نہ دیا جائے تو اس کا اجر خدا کے پاس ہے۔ الحطب بتاتے ہیں کہ اوقاف میں سے کچھ نہیں لینا چاہیے کیونکہ وہ وصیت کے لیے ہیں۔ ابن ورد نے اپنے خیال میں فتویٰ دیا لیکن الدسوقی نے ابن عتاب کے قول کو کمزور کردیا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17685} وہ کام جس سے اجرت حاصل ہوتی ہے وہ ہے وقف کو محفوظ رکھنا، اس کی مرمت کرنا، اسے چھوڑنا، اس کی پیداوار ⁦(کرایہ، فصل یا پھل)⁩ جمع کرنا، اس کی نشوونما کے لیے کوشش کرنا، اور اس کو اس کے کاموں پر خرچ کرنا، جیسے کہ مرمت، دیکھ بھال اور مستحقین کے لیے یہ کام رواج ہے اجرت اس وقت سے چلتی ہے جب منتظم دفتر سنبھالتا ہے، اور کام کے تناسب سے ہوتا ہے۔ حنبلی کہتے ہیں کہ اگر کوئی منتظم اپنے فرض میں کوتاہی کرتا ہے تو اس کی مقررہ اجرت اس رقم سے کم ہو جاتی ہے جس قدر اس کی غفلت پر وقفہ خرچ ہوتا ہے۔ جو کچھ اس کے لیے مقرر کیا گیا ہے وہ اس نے کیا کیا اور جو نہیں کیا اس کے درمیان تقسیم کیا جاتا ہے اور جو اس نے نہیں کیا اس کا حصہ ختم ہوجاتا ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17685} احناف کہتے ہیں کہ اگر فائدہ اٹھانے والے کسی ایسے منتظم سے جھگڑتے ہیں جو کہتا ہے کہ بانی نے کام کے لیے اجرت مقرر کی ہے جب کہ وہ کچھ نہیں کرتا ہے تو جج وہ کام عائد نہیں کرتا جو حکمران خود انجام نہیں دیتے۔ اگر اس پر کوئی ایسی رکاوٹ آجائے جو اسے حکم دینے، منع کرنے، لینے اور دینے سے روکے تو اس کی کوئی اجرت نہیں ہے۔ اگر نہیں، تو وہ رکھتا ہے. اگر بانی نے معمول سے زیادہ اجرت مقرر کی ہو تو اس کی اجازت ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17685} ایک صورت میں ایک متولی زمین کا مالک فوت ہو گیا اور جج نے ایک متولی مقرر کر کے اسے آمدنی کا دسواں حصہ دیا، جب کہ اوقاف کی ایک چکی ایک آدمی کے پاس یکمشت کرائے پر تھی اور اسے کسی متولی کی ضرورت نہیں تھی، اور اس کے ذمہ داروں سے وصول کیا جاتا تھا۔ متولی کو اس پیداوار کے دسویں حصے پر کوئی حق نہیں ہے، کیونکہ اس کی اجرت کام کی ادائیگی ہے اور بغیر کام کے کوئی اجرت نہیں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17685} منتظم کا محاسبہ۔ یہ منتظم کا فرض ہے کہ وہ اوقاف کی پیداوار کو جمع کرے، اس سے اوقاف کی ضرورت پر خرچ کرے، اور مستحقین کو ادائیگی کرے۔ فقہاء اس بات پر متفق ہیں کہ جو کچھ وہ خرچ کرتا ہے اس کا حساب دینا ضروری ہے، خواہ اس کا حساب جج کے ذریعہ طلب کیا جائے یا فائدہ اٹھانے والے۔ ان کا اس بات پر اختلاف ہے کہ آیا اس کے خرچ کے بارے میں اس کی بات کو بغیر ثبوت کے قبول کیا جاتا ہے، اور اگر کوئی ثبوت نہیں ہے تو کیا اس کی حلف کی ضرورت ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17685} احناف کا کہنا ہے کہ جج کو ہر اس رقم کا تفصیلی حساب کی ضرورت نہیں ہے جو منتظم نے وقف کی آمدنی سے خرچ کی ہو۔ ایک عام اکاؤنٹ کافی ہے اگر وہ معتبر معلوم ہو۔ اگر اس پر شبہ ہو، تو جج اسے ہر چیز کی وضاحت کرتا ہے، اور اسے قید نہیں کرتا، بلکہ اسے دو یا تین دن کے لیے طلب کرتا ہے اور خبردار کرتا ہے۔ اگر وہ وضاحت کرے تو اچھا اور اچھا، ورنہ جج اس کا حلف اٹھاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17686} الدر نے القنیہ کا حوالہ دیا ہے کہ اگر جج کو اس پر شبہ ہو تو وہ اسے قسم دیتا ہے، چاہے وہ ثقہ ہی کیوں نہ ہو، ایک امانت دار کے طور پر جو دعویٰ کرتا ہے کہ امانت گم ہو گئی ہے، قسم کھائے گی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17686} اس دعوے کے بارے میں حنفی آراء مختلف ہیں کہ منتظم نے مستحقین کو ادائیگی کی۔ الدّر کہتے ہیں کہ اس کی بات بغیر قسم کے قبول ہوتی ہے۔ اصف کہتے ہیں کہ اگر وہ کہے کہ اس نے اجرت حاصل کی اور مستحقین کو ادا کر دی اور وہ اس کا انکار کرتے ہیں تو اس کی بات اس کی قسم کے ساتھ قبول کی جاتی ہے اور وہ ذمہ دار نہیں ہے، بطور امانت دار جو دعویٰ کرتا ہے کہ اس نے امانت واپس کر دی ہے جب کہ جمع کرنے والا اس کا انکار کرے۔ ایڈمنسٹریٹر کی جانب سے کرایہ وصول کرنے کے اعتراف کے ذریعے عطا کردہ جائیداد کا لیز پر چھوڑ دیا جاتا ہے۔ اگر وہ کہے کہ کرایہ حاصل کرنے کے بعد وہ گم ہو گیا یا چوری ہو گیا تو اس کی قسم کے ساتھ قول قبول ہے کیونکہ وہ ثقہ ہے۔ ابن عابدین نے الخیر الرملی سے روایت کی ہے کہ فتویٰ یہ ہے کہ وہ اس دور میں قسم کھاتا ہے۔ حمیدیہ نے ابو السعود کا یہ حکم نقل کیا ہے کہ اگر منتظم اسراف کرنے والا ہو تو اس کی اوقافی جائیداد کے خرچ پر اس کی قسم قبول نہیں ہوتی۔ الشلبی کا خیال ہے کہ ایک فاسق جس کا طرز عمل قانون کی خلاف ورزی کرتا ہے اس کے خرچ پر یقین نہیں کیا جاتا جب تک کہ اس کے پاس ثبوت نہ ہو۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17686} کیا معتبر منتظم کی برطرفی کے بعد اس کی بات قبول کی جاتی ہے: حماوی کہتے ہیں کہ ظاہری نظریہ یہ ہے کہ ہٹانے سے اس کی امانت ختم نہیں ہوتی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17686} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17687} ملا ابو السعود نے ایک اور امتیاز کیا ہے: اگر منتظم یہ دعویٰ کرتا ہے کہ اس نے اپنے بچوں کو اوقاف کے نام سے حاصل کردہ آمدنی سے رقم ادا کی ہے۔ پوتے، اس کی بات مان لی جاتی ہے۔ اگر وہ دعویٰ کرتا ہے کہ اس نے امام اور مؤذن جیسے دفاتر کے مالکان کو اجرت دی ہے تو ایسا نہیں ہے، جیسا کہ ایک آدمی جس نے مسجد میں کسی معمار کو ایک معروف اجرت پر رکھا اور پھر یہ دعویٰ کرے کہ اس نے اسے ادا کیا ہے۔ التمرتشی نے اس امتیاز کی تعریف کی۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17687} مالکیہ کا خیال ہے کہ اگر بانی فوت ہو جائے اور اوقاف ضائع ہو جائے تو منتظم کی بات ان مقاصد کے بارے میں قبول کی جاتی ہے جن پر وہ خرچ کرتا ہے، اگر وہ ثقہ ہو۔ اگر وہ دعویٰ کرتا ہے کہ اس نے پیداوار خرچ کی ہے تو اگر وہ ثقہ ہے تو اسے قبول کیا جاتا ہے، الا یہ کہ عمل کے بناتے وقت گواہ نہ ہوں، اس صورت میں وہ صرف ان کے علم سے خرچ کرتا ہے۔ اگر وہ دعویٰ کرتا ہے کہ اس نے اپنی رقم وقف پر خرچ کی ہے تو اسے بغیر قسم کے قبول کیا جاتا ہے جب تک کہ اس پر شبہ نہ ہو، اور پھر وہ قسم کھاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17687} الحطب السوری کو پیش کیے گئے ایک مقدمے کی اطلاع دیتا ہے: ایک امام، ایک مؤذن اور ایک مسجد کے ناظم پر برسوں بعد ایک مارکیٹ انسپکٹر نے دکانوں کے کرائے سے زائد رقم وصول کی تھی۔ منتظم نے کسی اضافی رقم سے انکار کیا اور اپنے اخراجات بتانے سے انکار کر دیا، یہ کہتے ہوئے کہ وہ اس کا پابند نہیں ہے، اور یہ کہ اس کے بغیر وقف ختم ہو جائے گا۔ السوری نے فیصلہ دیا کہ اس کی بات اس کے بارے میں قبول کی جاتی ہے جو وہ کہتا ہے کہ اس نے خرچ کیا ہے، اگر یہ اس کے کہے ہوئے مشابہ ہے۔ البرزالی نے مزید کہا کہ یہ وہ جگہ ہے جہاں گواہوں کے علاوہ آمدنی اور اخراجات کے ریکارڈ کی کوئی شرط نہیں رکھی گئی تھی۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17687} شافعی ایسے مستحقین میں فرق کرتے ہیں جن کا نام لیا گیا ہے، جیسے زید اور عمرو، جن کی ادائیگی پر ان کی بات قبول ہوتی ہے اور جو حساب مانگ سکتے ہیں، اور بے نام مستحقین، جیسے غریب۔ جہاں فائدہ اٹھانے والوں کا نام نہیں ہے، اس پر اختلاف ہے کہ آیا حکمران حساب مانگ سکتا ہے۔ دو نقطہ نظر سے، زیادہ واضح ہے کہ وہ کر سکتا ہے. منتظم پر اس رقم کے بارے میں یقین کیا جاتا ہے جو اس نے خرچ کی، جہاں یہ ممکن ہو؛ اگر جج اس پر شک کرے تو وہ اس سے قسم کھاتا ہے۔ الازراعی بیان کرتے ہیں کہ اس سے مراد رواج کے مطابق خرچ کرنا ہے۔ غریبوں کو ادائیگیاں اور دیگر عام مقاصد شامل ہیں، لیکن ایک نامزد مستحق پر خرچ کرنا یقین نہیں ہے، کیونکہ اس مستحق نے اسے اس کے سپرد نہیں کیا تھا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17687} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17688} حنبلی اس منتظم کو ممتاز کرتے ہیں جو اجرت لینے والے سے بلا معاوضہ خدمت کرتا ہے۔ رضاکارانہ منتظم کا لفظ فائدہ اٹھانے والے کو ادائیگی کے بارے میں قبول کیا جاتا ہے۔ ادا شدہ ایڈمنسٹریٹر کا لفظ بغیر ثبوت کے قبول نہیں کیا جاتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17688} البحوطی اور المردوی کہتے ہیں کہ مستفید ہونے والے قابل اعتماد منتظم پر اعتراض نہیں کر سکتے جسے بانی نے مقرر کیا ہو۔ وہ اس سے پوچھ سکتے ہیں کہ ان کے وقف کی کیا ضرورت ہے، تاکہ ان کا علم اس کے برابر ہو۔ اور حکمران انڈومنٹ اکاؤنٹس کے آڈٹ کے لیے ایک دفتر قائم کر سکتا ہے جب یہ عوامی مفاد میں ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17688} اوقاف کے منتظم کو ہٹانا، اور اسے ہٹانے کا حق کس کو ہے۔ منتظم کے لیے شرائط اور جب کوئی ناکام ہوتا ہے تو اوپر بیان کیے گئے تھے۔ یہاں ہے جو اسے ہٹا سکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17688} سب سے پہلے، بانی کا حق ہے کہ وہ اپنے مقرر کو ہٹا دیں۔ شافعی اور حنبلی ایک بانی کے درمیان فرق کرتے ہیں جس نے شروع میں انتظامیہ کو اپنے لیے رکھا اور بعد میں اسے دوسرے کو سونپا، اور ایک بانی جس نے شروع سے دوسرے کو دے دیا۔ پہلی صورت میں وہ کسی اور کو ہٹا کر مقرر کر سکتا ہے، کیونکہ تفویض کرنے والا اس کے لیے کھڑا ہوتا ہے، جیسا کہ ایک پرنسپل اپنے ایجنٹ کو ہٹاتا ہے۔ یہ شافعیوں کا صحیح قول ہے اور الفورو کی تصحیح شدہ عبارت میں حنبلیوں کا صحیح اور صحیح قول ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17688} الشربینی نوٹ کرتا ہے کہ اس کا مطلب یہ ہے کہ بانی بلا وجہ ہٹا سکتا ہے، اور السبکی نے اپنے فتوے میں ایسا کہا ہے۔ لیکن بعد کے بہت سے علماء، جن میں ابن رزین نے فیصلہ کیا ہے کہ بلا وجہ ہٹانا جائز نہیں ہے۔ ایک شافعی اور حنبلی نظریہ اسے کسی قسم کے ہٹانے سے انکار کرتا ہے، کیونکہ اس کی ملکیت ختم ہو چکی ہے۔ دوسری صورت میں، جہاں بانی نے اوقاف کی تخلیق میں ایک منتظم کا نام لیا ہے، شافعی کہتے ہیں کہ وہ اسے کسی فائدے کی وجہ سے بھی نہیں ہٹا سکتا، کیونکہ کسی دوسرے کو دینے کے بعد اس کے پاس کوئی اختیار نہیں ہے۔ لہٰذا اگر اس نام کا منتظم خود کو ہٹاتا ہے یا خطا کار بن جاتا ہے تو اس کے متبادل کی تقرری جج کی ہے، بانی کی نہیں۔ حنبلی کہتے ہیں کہ اگر بانی نے کسی منتظم کا نام لیا اور اسے ہٹانے کا حق اپنے لیے مقرر کیا تو وہ اسے ہٹا سکتا ہے۔ اگر نہیں، تو وہ نہیں کر سکتا. {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17689} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17690} حنفیہ: محمد ابن الحسن کا موقف ہے کہ اگر بانی نے اپنے اور اپنے بچوں کے لیے یہ شرط رکھی ہو، تو ایسے تمام افراد کے تبادلے اور تقرری کا حق ختم کر دیا جائے گا اختیار، اور پھر اوقاف کو منتظم کے حوالے کر دیا، بانی اسے ہٹا سکتا ہے۔ اگر اس نے ہٹانے کا حق متعین نہیں کیا تو وہ حوالے کرنے کے بعد ایسا نہیں کر سکتا، کیونکہ مستفید ہونے والوں کی جگہ منتظم کھڑا ہوتا ہے۔ الصدر الشہد کہتے ہیں کہ فتویٰ محمد کے قول کی پیروی کرتا ہے۔ ابن عابدین کہتے ہیں کہ یہ اس بات پر منحصر ہے کہ کیا حوالے کرنا شرط ہے، جو محمد کے لیے ہے اور ابو یوسف کے لیے نہیں۔ ابو یوسف کے لیے بانی کے پاس اختیار ہے کہ اس نے اس کی شرط رکھی ہے یا نہیں، کیونکہ حوالے کرنا شرط نہیں ہے۔ اگر وہ کسی دوسرے کو مقرر کرتا ہے تو وہ نائب ہے اور اسے ہٹا سکتا ہے، چاہے اس نے حق مقرر کیا ہو یا نہ کیا ہو۔ ہلال، الفتح اور البحر اسی کو ظاہری قول سمجھتے ہیں اور بلخ کے شیوخ نے ابو یوسف کے قول پر فتویٰ دیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17689} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17690} الرملی کہتے ہیں کہ یہ صریح ہے: برطرفی بلا وجہ جائز ہے، کیونکہ وہ نائب ہے، اور ہر صورت میں اسے ہٹا سکتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17690} مالکیوں کا خیال ہے کہ بانی اپنے لیے نظم و نسق کا تعین نہیں کر سکتا۔ وہ منتظم کا نام دینے میں اپنی شرط کی پیروی کرتا ہے، اور اگر اس نے کسی خاص شخص کا نام لیا ہے تو وہ دوسرے میں تبدیل نہیں ہو سکتا۔ القرافی کہتے ہیں کہ بانی کسی منتظم کو بغیر وجہ کے بھی ہٹا سکتا ہے۔ الحطب کہتے ہیں کہ جس نے کسی کو اپنے وقف کا انتظام کرنے کے لیے مقرر کیا ہے وہ اسے صرف اس وجہ سے ہٹا سکتا ہے جو ظاہر ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17690} دوسرا، ہٹانے کا جج کا حق۔ جج کے پاس عمومی اختیار ہے، اس لیے وہ ایسے منتظم کو ہٹا سکتا ہے جسے بانی نے نامزد کیا ہے اگر منتظم کی بے ایمانی ثابت ہو جائے یا اگر اس کے پاس مطلوبہ شرائط میں سے کسی ایک کی کمی ہو۔ وہ اسے بلا وجہ نہیں ہٹا سکتا۔ جہاں جج نے خود منتظم مقرر کیا ہو، مالکیوں، شافعیوں اور بعض احناف کا خیال ہے کہ اسے کسی وجہ سے ہٹایا نہیں جا سکتا، جیسے کہ غبن یا کسی اور غلطی کے۔ حنبلی اور بعض احناف کا خیال ہے کہ اسے بغیر غبن کے ہٹا دیا جائے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17690} منتظمین کی کثرت۔ اوقاف میں ایک منتظم یا اس سے زیادہ ہو سکتا ہے، جیسا کہ فقہاء کہتے ہیں۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17690} اگر بانی دو افراد کو انتظامیہ تفویض کرتا ہے، شافعیہ، حنبلی اور ابو حنیفہ کا خیال ہے کہ دونوں میں سے کوئی بھی اکیلے کام نہیں کرسکتا، کیونکہ بانی نے اکیلے دونوں میں سے کسی کے فیصلے کو قبول نہیں کیا۔ لیکن اگر بانی ان میں سے ہر ایک کا نام رکھے تو ہر ایک اکیلے کام کر سکتا ہے۔ ابو یوسف دو منتظمین میں سے ہر ایک کو اکیلے کام کرنے کی اجازت دیتا ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17691} حنبلی متن میں مزید اضافہ کیا گیا ہے کہ اگر بانی وقف کی مرمت ایک آدمی کو اور اس کی پیداوار کی وصولی دوسرے کو تفویض کرتا ہے تو ہر ایک کے پاس اس کی ذمہ داری ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17691} شافعی کہتے ہیں کہ اگر بانی یہ شرط لگائے کہ منتظم اپنے بچوں میں سب سے زیادہ راست باز ہو اور وہ سب اس راستبازی میں شریک ہوں تو وہ دفتر میں شریک ہوں گے۔ اگر کوئی واضح طور پر زیادہ سیدھا ہے، تو وہ اکیلا ہی اسے رکھتا ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17691} احناف کا خیال ہے کہ اگر بانی کسی آدمی کا نام رکھے اور پھر کسی نابالغ کے لیے سرپرست کا نام دے تو وہ دونوں منتظم ہیں، دفتر میں شریک سرپرست؛ جب تک کہ بانی تصریح نہ کرے، مثال کے طور پر، کہ اس نے اپنی زمین ایک نامزد فائدہ اٹھانے والے کو دے دی اور اس کا انتظام ایک آدمی کو دے دیا، اور دوسرے کو اپنی جائداد اور اس کے تمام امور کا نگران نامزد کیا، اس صورت میں ہر ایک اپنی تفویض کے اندر تنہا کام کرتا ہے۔ ابن عابدین نے اس کے لیے الاصف کا حوالہ دیا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17691} اگر بانی اپنی اولاد میں سے سب سے زیادہ نیک لوگوں کو انتظامیہ دے اور وہ نیکی میں برابر ہوں تو وہ اس میں شریک نہیں ہوتے اور یہ سب سے بڑے کو جاتا ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17692} اگر بانی نے دو آدمیوں کو انتظام دیا اور ایک قبول کر لے اور دوسرا انکار کر دے، یا مر جائے یا نااہل ہو جائے، تو جج اس کی جگہ دوسرے کو مقرر کرتا ہے۔ حنفیہ، شافعی اور حنبلی متفق ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17692} ایک منتظم کی طرف سے انتظامیہ کا وفد۔ سوائے اس کے جہاں بانی نے اجازت دی ہو، فقہاء کا خیال ہے کہ منتظم جس کو چاہے انتظامیہ سونپ نہیں سکتا یا کسی دوسرے کو وصیت نہیں کر سکتا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17692} احناف کہتے ہیں کہ اگر بانی کا وفد منتظم کے لیے عام ہوتا، یعنی وہ بانی کے مقام پر کھڑا ہوتا اور جس کو منتخب کرتا اسے انتظامیہ سونپ سکتا اور وصیت کرتا، وہ صحت اور آخری بیماری میں اسے سونپ سکتا ہے۔ اگر یہ عام نہ تھا تو وہ اسے صحت کے لحاظ سے نہیں دے سکتا، لیکن صرف اپنی آخری بیماری میں، کیونکہ وہ ایک عامل کی طرح ہے، اور ایک عملدار دوسرے کو مقرر کر سکتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17692} شافعی کہتے ہیں کہ اگر بانی کہے کہ اس نے کسی نامی شخص کو انتظام سونپا ہے، وہ جسے چاہے سونپ سکتا ہے، وفد صحیح ہے۔ آیا پہلے شخص کی انتظامیہ پھر ختم ہوجاتی ہے یا نہیں: اسکول کا نظریہ یہ ہے کہ ایسا ہوتا ہے، چونکہ وفد ملکیت کی منتقلی کی طرح ہے، تاکہ بانی اور مندوب نئے منتظم کو ہٹا نہیں سکتے، اور یہ اس کی موت کے بعد مندوب کو واپس نہیں کرتا ہے۔ السبکی کا خیال ہے کہ مندوب مندوب کا ایجنٹ ہے، لہذا اگر مندوب مر جائے تو انتظامیہ مندوب کی طرف لوٹتی ہے، اور اگر مندوب مر جائے تو وہ مندوب کی طرف لوٹتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17692} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17693} حنبلی کہتے ہیں کہ بانی کا نام رکھنے والا منتظم، اگر وہ خود مستفید ہے، تو اسے ہٹا سکتا ہے، اس لیے کہ وہ اس کا اصل شخص ہے، اس لیے اسے ہٹا سکتا ہے، اس لیے کہ وہ اس کا اپنا مؤلف ہے جائیداد اگر وہ فائدہ اٹھانے والا نہیں ہے، تو وہ کسی منتظم کا تقرر یا دفتر کی وصیت نہیں کر سکتا، جب تک کہ بانی نے یہ شرط نہ رکھی ہو کہ وہ جسے چاہے مقرر کرے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17693} وقف کا خاتمہ۔ وقف ختم ہونے کا ایک طریقہ یہ ہے کہ عطا شدہ چیز کا بانی کی ملکیت میں واپسی ہو: جب چیز برباد ہو جائے اور استعمال کے قابل نہ رہے، جب وقف فائدہ اٹھانے والوں کے ایک طبقے کے لیے ہو جو ختم ہو جائے، یا عارضی وقف کی صورت میں، جس کی مالکی اجازت دیتے ہیں۔ {حوالہ: فقہ موسوعۃ کویتیہ نور v3 ص17693}"
  tr: "Arapçada \"vakıf\" kelimesi \"bağış\" veya \"elde tutma\" anlamına gelir. Örneğin, \"Evi bağışladım\" denilebilir; bu da \"Onu Allah yolunda adadım\" anlamına gelir. Ayrıca, korunma ve sükunetle de ilgilidir ve bağışlanan mülkün kendisini ifade eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17579} İslam hukuk terminolojisinde çeşitli tanımlar vardır: Hanefi mezhebine göre, iki sahabeye (Ebu Hanife ve Ebu Yusuf) göre, Allah'ın mülkiyetinde olan bir mülkün, faydaları dilediği kişiye dağıtılmasıdır. Ebu Hanife'ye göre, bağışlayanın mülkiyetinde olan bir mülkün, faydaları sadaka olarak verilmesidir. Maliki mezhebine göre ise, bir şeyin varlığının süresi boyunca, bağışlayanın mülkiyetinde kalması şartıyla (sadece isim olarak bile olsa) verilmesidir. Şafiî mezhebine göre, vakıf, malın özü bozulmadan kullanılabilir haldeyken, elden çıkarma hakkı saklı kalmak kaydıyla, helal ve mevcut bir amaç için tahsis edilmesidir. Hanbeli mezhebine göre ise, bir mal sahibinin, kullanılabilir malını elden çıkarma konusunda mutlak özgürlüğe sahip olarak, gelirini hayır işine bağışlaması ve bu şekilde Allah'a bağlılık göstermesidir. İlgili terimler: bağış (karşılıksız gönüllü olarak bir şey vermek, vakıftan daha geniş kapsamlıdır), sadaka (bir kişinin hayattayken karşılıksız mülkiyet devri ve Ömer'in arazisiyle ilgili hadiste olduğu gibi vakıf anlamına da gelebilir), hediye (karşılıksız hediye), ödünç verme (mülkiyet ödünç verende kalırken bir eşyanın kullanımına izin verme) ve vasiyet. Vakıf ile hediye arasındaki fark, vakfın, eşya Allah'ın mülkiyetinde kalırken kullanım hakkının devredilmesi olması, dolayısıyla elden çıkarılmasının helal olmaması; hediyenin ise eşyanın mülkiyetinin devredilmesi olmasıdır. Vasiyet: Hanefi mezhebi bunu ölümden sonra mülkiyetin devredilmesi olarak tanımlar ve Şafiî mezhebi de benzer şekilde tanımlar; vasiyet ile vakıf arasındaki fark, vasiyetin ölümden sonra yapılması ve mülkün kendisi veya intifa hakkı ile ilgili olabilmesidir, vakıf ise kişinin hayattayken yaptığı bir bağış olup sadece intifa hakkı ile ilgili olabilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17581} Vakfın meşruiyeti: Çoğu hukukçu, vakfın meşru, bağlayıcı ve tavsiye edilen ibadetler arasında sayıldığını kabul eder. Delil olarak İbn Ömer'in Ömer'in Hayber'deki arazisiyle ilgili hadisini ve Peygamber'in ona \"Dilersen, asıl malını vakfedip gelirini sadaka olarak verebilirsin\" sözünü, \"Bir insan öldüğünde, üç şey hariç amelleri sona erer...\" hadisini ve Cabir'den rivayet edilen, Muhacirler ve Ensar arasında malı olan herkesin onu vakfetmesi gerektiği rivayetini öne sürüyorlar; İbn Kudame ise bunun Sahabeler arasında ittifak olduğunu söylemiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17582} İbn Abidin, Al-Is'af'tan, vakıfların Ebu Hanife ve takipçilerine göre caiz olduğunu ve ihtilafın bağlayıcı niteliğinde olduğunu rivayet etmiştir. Ebu Hanife'ye göre, bunlar borç gibi caizdir ve ancak bir hakimin kararıyla veya vasiyetname şeklinde yapılmasıyla bağlayıcıdır. İbn Kudame, Şurayh'tan rivayet ettiğine göre, Şurayh bunları caiz görmemiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17582} Dini yükümlülükler hakkındaki hükümlere gelince: Temel prensip, bunun tavsiye edilen bir ibadet olması ve adak olarak verilmesi halinde farz olabilmesidir; ibadet niyeti olmaksızın yapılması halinde ise (örneğin gayrimüslim için vakıf kurmak gibi, sevabı olmayan) caizdir; günahkâr bir amaç için yapılması halinde ise (örneğin kilise için) haramdır. Kitapta, bazı Malikilerin, kız çocukları hariç sadece oğullar için vakıf kurmanın, İslam öncesi bir uygulamaya benzediği için haram olduğunu söyledikleri, ancak İbn el-Kasım'ın bunu sadece mekruh ve caiz olarak gördüğü belirtilmiştir. Çoğunluğa (Maliki, Şafiî ve Hanbeli mezhepleri) göre bir vakfın temelleri dört tanedir: beyan, vakıf kuran, yararlanan ve vakıf edilen mal. Hanefi mezhebine göre ise sadece beyan bir temeldir. Bir vakıf, teklif olmadan geçerli değildir ve âlimler, kabulün geçerliliği için bir şart olup olmadığı konusunda farklı görüşlere sahiptirler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17583} Vakfın formülü: vakıf kuranın niyetini bir söz, açık bir jest, yazı veya eylemle gösteren şeydir. Maliki, Şafiî ve Hanbeli mezheplerine göre açık sözler şunlardır: “Vakıf kurdum” ve aynı şekilde “bağışladım”, ve Şafiî ve Hanbeli mezheplerine göre “hayır vakfı yaptım”; Ve vakıf, örf ve adet gereği herhangi bir ekleme yapılmaksızın kurulmuş olur; çünkü Peygamber Ömer'e, \"Dilersen, kaynağını ona ithaf edebilirsin\" demiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17584} Metafor, \"Ben sadaka verdim\" sözüdür; ancak Şafiîlerin bazı görüşlerine göre, bunu genel bir varlık olan fakirlere ekleyip vakfı kastetmediği sürece. Aynı şekilde, Hanbelilere göre \"Ben onu haram kıldım\" ve \"Ben onu ebedi kıldım\", Şafiîlere göre ise daha doğru olanıdır. Vakıf, ancak \"vakıf edilmiş bir sadaka\" veya \"satılmayan, bağışlanmayan, miras bırakılmayan bir sadaka\" gibi bağlamsal bir ipucu veya vakfın niyeti eklenerek elde edilir. Eğer mütevelli, Müslüman esirlerin serbest bırakılması veya mahsur kalmış bir savaşçıya yardım gibi hayır amaçlı bir işe harcanmak üzere yeterli miktarda vakıf geliri biriktirmişse ve vakfın onarıma ihtiyacı varsa, onarımların bir sonraki yılın gelirlerine kadar ertelenmesi vakfın yıkılmasına yol açacak önemli bir zarara neden olmuyorsa, gelirler hayır amaçlı işe harcanmalı ve onarımlar ertelenmelidir. Ancak, onarımların ertelenmesi önemli bir zarara yol açacaksa, gelirler önce onarımlara harcanmalı, daha sonra kalan kısım hayır amaçlı işe harcanmalıdır. İbn Nujaym, mütevellinin gelirleri yararlanıcılara dağıttıktan sonra ertelenemeyecek bir bakım ihtiyacı varsa, mütevellinin sorumlu olduğunu, çünkü vakfın bakım ve giderlerinin yoksulların haklarından hariç tutulduğunu belirtmiştir. Hanefi mezhebine göre, çatının yükseltilmesi veya duvarın inşası gibi bakım gerekli ise, diğer tüm harcamalardan önceliklidir. Bunun sebebi, imam ve müezzinlere verilenler uğruna caminin bakımsız kalmasının makul olmamasıdır. Bakımdan sonra bir fazlalık kalırsa, bu fazlalık vakfa en yakın olan ve kaybı açıkça zarar verecek olanlara verilmelidir. Bakım gerekli değilse ve ertelenmesi bir sonraki yılın hasadına kadar mülkün yıkılmasına yol açmayacaksa, en önemli ihtiyaçlar öncelik kazanır. Hanefiler, vakıf sahibinin her yıl bakım yapılmasını şart koştuğu durum ile vakıf sahibinin bu konuda sessiz kaldığı durum arasında ayrım yaparlar; vakıf sahibinin sessiz kaldığı durumda ise ihtiyaç duyulmadığı zaman bakım yapılmaz. Vakıf binasının veya donanımının herhangi bir kısmı çökerse, yönetici gelirleri yeniden inşa için tahsis eder. Yeniden inşa için gerekli hazırlıklar zaten yapılmışsa, gelirler bu amaçla kullanılır; aksi takdirde, bu hazırlıklar yapılana kadar saklanır. Şafiî mezhebine göre, caminin gelirinden ihtiyaçlarını aşan fazla miktar, yıkılması durumunda kullanılmak üzere saklanmalıdır. Kalan fonlar ise, korunmasına daha elverişli olduğu için, vakfa konulacak malların satın alınmasında kullanılmalıdır. Yeniden inşa için ayrılan vakıf fonundan satın alınmayan mallar kullanılmamalıdır, çünkü vakfı kuran kişi vakfı bu amaçla kurmuştur. Fıkıhçılar, bir vakfın (vakfın) bakım ve idamesinin hangi kaynaktan finanse edilmesi gerektiği konusunda farklı görüşler belirtmişlerdir. Hanefi ve Maliki mezhepleri, vakfın Allah yolunda sürekli bir sadaka olduğu ve ancak bu şekilde sürdürülebileceği için, vakfın gelirlerinden finanse edilmesi gerektiğini, vakfın kurucu tarafından belirtilip belirtilmemesine bakılmaksızın, savunmuşlardır. Malikiler ise, vakfın aksi yönde bir şart koşması durumunda, bu şartın geçersiz olduğunu belirtmişlerdir. Eğer vakfedilen kişi evini oğlunun ikamet etmesi için vakfettiyse, bakım sorumluluğu, orada ikamet etmeye hak kazanan kişiye aittir ve bu kişi evi kendi kaynaklarından karşılar, vakfın gelirlerinden değil; zira yükümlülük, sağlanan faydayla orantılıdır. Eğer kişi bunu yapmayı reddederse veya yoksulluk nedeniyle yapamazsa, hakim evi ondan veya başka birinden kiralayabilir ve kira gelirinden bakımını sağlayabilir. Reddeden kişi bakımını yapmaya zorlanamaz ve bu, Malikilerin de görüşüdür. Malikiler, savaşta kullanılan bir atın kamu hazinesinden karşılanması gerektiğini söylemişlerdir. Kamu hazinesi tükenirse, at satılır ve elde edilen gelir, bakım gerektirmeyen silahlar ve benzeri eşyalar satın almak için kullanılır. Şafiîler ve Hanbeliler ise, bağışçının koyduğu şartlara uyulması gerektiğini savunmuşlardır. Şafiîlere göre, bakım, teçhizat ve idame, belirtilen yerlerden veya vakfın kendisinden elde edilen faydalardan, örneğin bir kölenin kazancından veya gayrimenkul gelirinden karşılanmalıdır. Eğer faydaları sona ererse, bakım ve teçhizat kamu hazinesinden karşılanır. Ancak, gayrimenkul, hayvanların aksine, yaşamlarının korunması ve kutsallıkları nedeniyle mutlak mülkiyete benzer olduğundan, bakım kimse için zorunlu değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17662} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17663} Hanbelilere göre, mesele vakfedicinin durumuna bağlıdır. Eğer harcamanın gelirlerinden veya başka kaynaklardan yapılmasını belirtmişse, buna göre hareket edilir. Eğer belirtmemişse ve vakıf edilen mal köle veya at gibi canlı bir varlık ise, harcaması gelirlerinden yapılır. Geliri yoksa, harcaması belirtilen lehtarın sorumluluğundadır. Eğer lehtarın yetersizliği nedeniyle harcama imkansız ise, satılır ve fiyatı başka bir vakıf kurmak için kullanılır. Eğer kiraya verilmesi mümkünse, gideri kadar kiraya verilir. Vakıf, fakirler gibi belirsiz bir yararlanıcı için ise, gideri devlet hazinesinden karşılanır. Vakıf gayrimenkul veya benzeri bir şey ise, vakfı kuranın şartı dışında kimse için bakım yükümlülüğü yoktur. Fıkıhçılar, bir vakfı yıkarak veya başka bir şekilde ihlal edenin sorumlu olduğunu kabul etmişlerdir. Hanefi mezhebine göre, bir kimse vakıf mülkünü kiraya verirse ve kiracı onun verandasını hayvan ahırı olarak kullanıp daha sonra ona zarar verirse, izinsiz hareket ettiği için sorumludur. Maliki mezhebine göre, bir vakfı ihlal ederek yıkan kimse, yıkılan kısım harap olsa bile, onu eski haline getirmek zorundadır. Aralarında yaygın olan görüş, diğer hasarlı mallar gibi, değerinden sorumlu olduklarıdır. Bu görüş, İbn Arafa tarafından benimsenmiş ve İyad tarafından yaygınlaştırılmıştır. Şafiî mezhebine göre, ilim öğrenme amacıyla bağışlanan kitapları elinde bulunduran bir kimse, bu kitapları kaybetmesi durumunda, eğer bir ihlalde bulunmamışsa, sorumlu tutulamaz. Ancak ihlalde bulunursa, sorumludur. İhlalin bir şekli de, kitapları bağışlandıkları amaç dışında kullanmaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17663} Eğer vakfın bakım veya giderleri varsa ve gelir yetersizse, mütevellinin vakıftan borç alması caiz midir ve bunun için izin alması gerekir mi? Malikiler, Hanbeliler ve Hanefiler (tek bir görüşte), mütevellinin diğer tüm eylemlerinde olduğu gibi, hükümdarın izni olmadan borç almasının caiz olduğunu, çünkü kendisine mutlak takdir yetkisi verildiğini savunmaktadırlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17664} Malikiler, bir kimse mütevellilik görevini üstlenirken, gerekirse kendi parasından vakıf için harcama yapmayı taahhüt ederse, bunu yapmakla yükümlü olmadığını ve harcadığı paranın kendisine geri ödenmesini talep etme hakkına sahip olduğunu söylemişlerdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17664} Şafiîlere göre, mütevellinin vakıf sahibinin şartı veya imamın izni olmadan borç alması caiz değildir. İmam, mütevelliye devlet hazinesinden borç verebilir, borç almasına izin verebilir veya kendi parasından geçimini sağlamak için harcama yapmasına izin verebilir, ancak bunun karşılığında kendisine geri ödeme yapılması şartıyla. Bir kimse izinsiz veya şart koşulmadan borç alırsa, bu caiz değildir ve yaptığı hata nedeniyle harcadığı paranın kendisine geri ödenmesi mümkün değildir. Hanefi mezhebine göre, bir vakıftan borç almak ancak vakfın yararına, örneğin geçimini sağlamak veya tohum satın almak gibi amaçlarla caizdir. İki şartla caizdir: Hakimin izni (hakim yoksa, mütevelli kendisi borç almalıdır) ve malın kiraya verilememesi ve kira gelirinin gider olarak kullanılmaması. İbn Abidin, vakıf sahibinin izni olmadan borç almanın caiz olmadığını, çünkü borcun başlangıçta kişisel bir yükümlülük olarak kurulduğunu ve vakfın böyle bir yükümlülüğü olmadığını belirtmiştir. Fakirlerin de yükümlülükleri olsa da, sayıları çok fazla olduğu için onlardan ödeme talep etmek düşünülemez; bu nedenle borç sadece mütevelli aleyhine kurulur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} Ve gerektiğinde kıyaslama bir kenara bırakılır. Ebu el-Leys'e göre tercih edilen görüş, borçlanmanın, başka bir alternatif yoksa ve hakim mütevelliden çok uzak değilse, hakimin emriyle caiz olduğudur; çünkü hakimin yetkisi Müslümanların menfaatleriyle ilgili konularda daha geniştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17664} Hak sahiplerine harcama gibi kaçınılmaz şeyler için ise, imam, vaiz ve müezzinlere verilenler ve cami için hasır ve yağ gibi şeyler hariç, bu amaçla borçlanmak caiz değildir; daha doğru görüşe göre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17664} Eğer hakimin izni gerekiyorsa ve mütevelli izin aldığını iddia ediyorsa, elindekilerle ilgili sözü kabul edilse bile, delil olmadan kabul edilmez; çünkü mütevelli gelirleri geri almak istemektedir. Eğer izin almazsa, gelirlerden pay alması yasaktır; çünkü izin alınmadığı sürece gönüllü olarak hareket etmiş sayılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17665} İbn Abidin, mütevellinin vakfı onarmak için kendi parasından harcama yapması durumunda, gelirleri geri alma hakkına sahip olduğunu söylemiştir. Hanutî'nin hukuki görüşlerinde, bunu dini olarak geri alma hakkına sahip olduğu, ancak geri alma niyetiyle harcadığına dair delil sunmadığı sürece talebinin kabul edilmeyeceği belirtilmiştir. Bu, vakfın geliri olması şartına bağlıdır; eğer yoksa, hakimin izni gereklidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17665} İkincisi: Vakıf malının satılması ve yerine yenisinin konulması. Vakıf malı kullanılamaz hale gelirse ve artık fayda sağlamaz duruma düşerse, Hanefiler, Malikiler, Hanbeliler ve Şafiiler (ortak görüşe göre) satışına ve elde edilen gelirle benzer bir mal edinilmesine izin verirler. Hanefiler, vakıf malı kullanılamaz hale gelmese bile, belirli şartlar altında satış ve takasa izin vermişlerdir. Malikiler genellikle gayrimenkul ve taşınır mal arasında ayrım yapmışlardır. Hanefilere göre takas üç şekilde gerçekleşir. İlk şart, vakfedicinin, vakfın kurulduğu sırada vakfedilen arazinin başka bir araziyle değiştirilmesini kendisi veya başkası için şart koşmasıdır. Bunun iki şekli vardır: Birincisi, “Bu arazim, Allah'a ebediyen adanmış bir hayır vakfıdır; ancak onu satıp elde edilen gelirle başka bir arazi satın almam şartıyla.” demektir. İkinci arazi de aynı şartlarla vakıf haline gelir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17665} Ebu Yusuf, Hilal ve el-Hasaf, şartlı vakfın fıkıh tercihine (istihsan) dayanarak caiz olduğunu savunmuşlardır ve bu, Kadı Han'ın fetvalarına göre de doğru görüştür, çünkü bu şart vakfı geçersiz kılmaz. Vakıf bir araziden diğerine devredilebilir ve ikinci arazi birincisinin yerini alır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17665} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17666} Bunun bir örneği şudur: Eğer bir gaspçı vakıf arazisini ele geçirir ve üzerine su dökülerek deniz haline gelir ve artık tarıma elverişli olmazsa, o arazinin değerini ödemeli ve bununla ilk arazinin şartlarına göre vakıf niteliğinde bir arazi satın almalıdır. Benzer şekilde, eğer bir felaket nedeniyle verimi azalır ve ürün giderlerini aşmazsa, vakıf ikame yoluyla geçerlidir; dolayısıyla vakıf kuranın, o anda gereklilik olmasa bile ikame yetkisini şart koşması caizdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17666} Muhammed ve Yusuf ibn Halid el-Samti, vakfın geçerli olduğunu, ancak şartın geçersiz olduğunu söylemişlerdir ve bu doğru görüştür. El-Sarakhsi, Muhammed'in bu ifadesini, bu şartın vakfın feshedilmesine engel teşkil etmediğini, dolayısıyla vakfın geçerli kaldığını, ancak ikamenin kendi başına geçersiz ve hükümsüz bir şart olduğunu, tıpkı bir camide ikamenin şart koşulması veya bazı kişilerin namaz kılmasına izin verilmesi, diğerlerinin ise kılınmaması gibi olduğunu söyleyerek açıklamıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17666} Bazı Hanefi fıkıhçıları ise hem vakfın hem de şartın geçersiz olduğunu söylemişlerdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17666} Kemal ibn al-Humam, el-Ensari'den rivayet ettiğine göre, şart geçerlidir, ancak hükümdarın izni olmadan satılamaz. Eğer konu hükümdara getirilir ve vakıftan bir fayda yoksa, hükümdar, vakıftan yararlananların menfaatine en uygun olduğunu görürse, satışına izin vermelidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17666} Eğer vakıf kuran, arazinin satılmasını ve elde edilen gelirin başka bir arazi satın almak için kullanılmasını şart koşmuşsa, başka bir şey eklemeden, istihsan (hukuki tercih) ilkesine göre geçerli olur. İkinci arazi, ilk araziyle aynı şartlar altında vakıf olur ve vakfın yenilenmesine gerek kalmaz, çünkü arazi vakıf için belirlenmiştir ve fiyatı yerinde kalır. Analojik akıl yürütme, bunu geçersiz sayacaktır, çünkü bağışçı ilk arazinin yerine başka bir arazi parçasının kurulmasını belirtmemiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17666} İkinci senaryo: Eğer bağışçı, mütevellinin araziyi değiştirebileceğini şart koşmuş ancak bu hakkı kendisi için şart koşmamışsa, o zaman mütevelli araziyi kendisi için değiştirebilir, çünkü vesayetin başkasına verilmesi, mütevellinin araziye sahip olmasına bağlıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17667} Eğer takas şartı kendisiyle birlikte başka bir kişi için ise, takasın sahibi yalnızca bağışçıdır ve diğeri tek başına sahip değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17667} Değiştirme şartı caiz ise, mülkün geliri ve faydası olsa bile, vakfın kullanımının durması, hakimin bunu yönlendirmesi veya kullanılabilmesi için gelir olmaması gerekmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17667} Hanefiler, değiştirmeyi bağışçının miktar ve tür açısından şart koştuğuyla sınırlandırmışlardır; Değiştirme şartı arazi ise, ev ile değiştirilmesi caiz değildir. Şart köy arazisi ise, köy arazilerinin değişken maliyetleri ve kullanılabilirliği nedeniyle başka bir şey ile değiştirilmesi caiz değildir. Belirli bir değiştirme şart koşulmamışsa, mal sahibi aynı türden herhangi bir arazi, ev veya kasaba ile değiştirebilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17667} Eğer ikame şart koşulmuşsa, mal sahibi ikinci arazi parçasını üçüncü bir arazi parçasıyla değiştiremez, çünkü şart yalnızca ilk arazi için geçerlidir, aksi yönde bir açıklama yapılmadıkça. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17667} İkinci senaryo: Vakıf sahibi, vakıf sırasında ikameyi şart koşmaz, ister ikameyi şart koşmamış olsun ister sessiz kalmış olsun, ancak vakıf tamamen kullanılamaz hale gelir, hiçbir fayda sağlamaz veya masraflarını karşılayamaz. Bu durumda, en sağlam görüşe göre, hakimin izniyle ve onun bunu yararlı bulması şartıyla ikameye izin verilir. İbn Abidin, El-Bahr'ın Kadı Han'ın açıklamalarının farklılık gösterdiğini söylediğini aktarmıştır. Bir durumda, kadı Han, vakfın sahibi tarafından belirlenen herhangi bir koşul olmaksızın, mütevelli heyetinin menfaatine uygun gördüğü her durumda vakıf malının takas edilmesine izin vermiştir. Başka bir durumda ise, arazi kullanılamaz hale gelse bile bunu yasaklamıştır. Kabul edilen görüşe göre, kadı şu koşullar altında malın takasını yapabilir: a) Vakıf malı tamamen kullanılamaz hale gelmelidir. Hanefi mezhebine göre takas şartları arasında, satışın aşırı derecede haksız bir fiyattan yapılmaması, vakfın bakım için kullanılabilecek gelire sahip olması ve mal takas eden kişinin, Müslüman vakıflarının geçersiz kılınmasına yol açmayacak şekilde, bilgili ve dindar sayılması yer almaktadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17668} Takas konusu gayrimenkul olmalı, dirhem veya dinar olmamalı ve lehine tanıklığı kabul edilmeyen veya kendisine borçlu olan birine satılmamalıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17668} Takas konusu mal ve mülk aynı türden olmalıdır. İbn Abidin, Kanali Zadeh'den alıntı yaparak, kâr amacıyla bağışlanan mallar için tür birliğinin şart olmadığı anlaşılıyor, çünkü burada dikkate alınan şey gelirin bolluğu ve bakım ve giderlerin azlığıdır. Dolayısıyla, dükkan, dükkanın kirasına eşit gelir getiren ekili bir arazi ile takas edilirse, bu daha iyi olur. İkamet amacıyla bağışlanan mallara gelince, amaç ikametten fayda sağlamaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17668} El-Kunya'da, vakıf malının aynı mahallede veya daha iyi bir mahallede bulunan başka bir malla değiştirilmesinin caiz olduğu belirtilmiştir. Ancak, daha düşük değerli bir mahallede daha büyük alan, değer ve kira geliri olsa bile, mülkün değerinin daha düşük olması nedeniyle, tersi durumda caiz değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17668} Kitap, İbn Vahban'ın el-Bahr el-Ra'iq'teki şiirine yapılan tefsirden bir soruyu aktarıyor: Vakıf kurucusu aksini şart koşmuşsa veya yönetici değişiklikten önce görevden alınmışsa, değişiklik caiz midir? El-Tarsusi, bunun için bir emsal olmadığını ve düşünce okulunun yerleşik ilkelerinin, hakimin menfaatine uygun gördüğü takdirde değişiklik yapmasına izin verdiğini belirtmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17668} Muhammed'den rivayet edildiğine göre, vakıf edilen arazi işlenemez hale gelirse ve mütevelli, aynı fiyata daha fazla kar getiren başka bir arazi bulursa, onu satıp daha karlı olanı satın alması caizdir. Bazı şeyhler, vakfın faal olup olmamasına bakılmaksızın, satışı ve takası yasaklamışlardır. Kadı Han, takas şartının belirtilmediği, yani sınırsız vakfın, arazisi tuzlu bataklık olsa ve faydalanılamaz olsa bile, satılmasının veya takas edilmesinin caiz olmadığını söylemiştir; çünkü vakfın amacı sürekli olması ve satılmamasıdır ve takas hakkı ancak şartla tesis edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17669} Üçüncü senaryo: Vakıf sahibi değiştirme şartı koymamış, vakfın geliri ve getirisi var ve atıl durumda değil, ancak değiştirilmesi genel olarak faydalı olur ve fayda ve gelir açısından daha iyi olur. İbn Abidin, Kanali Zadeh'in açıkladığı gibi, en doğru ve tercih edilen görüşe göre bunun değiştirmenin caiz olmadığını söylemiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17669} İbn Abidin, Al-Ashbah'tan, içinde yaşanılan bir mülkün değiştirilmesinin dört durum dışında caiz olmadığını aktarmıştır: Birincisi, vakıf sahibi değiştirme şartı koymuşsa; İkinci durum, gaspçının onu ele geçirip üzerine su akıtarak deniz haline getirmesidir; bu durumda gaspçı, malın bedelinden sorumludur ve mütevelli, onun yerine arazi satın alır. Üçüncü durum, gaspçının mülkiyeti inkar etmesi ve bunun kanıtı olmaması durumunda, malın bedelini ödemek istemesidir; bu durumda mütevelli, yerine yenisini almak için onu alabilir. Dördüncü durum ise, birinin daha karlı ve daha iyi konumda bir yerine yenisini almak istemesidir; bu durumda Ebu Yusuf'a göre bu caizdir ve fetva da bu görüşe dayanmaktadır. El-Nahr'ın yazarı, bunun Sadr el-Şeriat'ın şu ifadesiyle çeliştiğini söylemiştir: \"Ebu Yusuf'un görüşüne dayanarak fetva vermeyiz.\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17669} Malikilere göre bir vakfın değiştirilmesi. Malikiler, satış ve değiştirme konusunda gayrimenkul ve taşınır mal arasında ayrım yaparlar. Eğer bir malın bakımını üstlenecek bir kurum yoksa ve yok olma tehlikesi varsa veya faydası kalmamış ve bağışlanma amacına uygun olarak artık kullanılamaz hale gelmişse, taşınır malın değiştirilmesine izin verilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} Askeri seferler veya sınırların korunması gibi Allah yolunda kullanılan bir at, devlet hazinesinden karşılanır. Devlet hazinesi tükenirse, at satılır ve yerine bakım gerektirmeyen silahlar veya benzeri eşyalar verilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} Kuduz bulaşmış bir at, yıpranmış bir giysi, yaşlı bir köle veya bozulmuş kitaplar gibi artık kullanılamaz durumda olan her türlü taşınır mal satılır. Elde edilen gelir, mümkünse benzer bir eşya satın almak için veya tamamını satın almak mümkün değilse bir kısmını satın almak için kullanılacaktır. Bu bile mümkün değilse, gelir sadaka olarak verilecektir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17669} Buna savaş veya üreme için belirlenmiş erkek hayvanlar da dahildir. İhtiyaç duyulandan fazla hayvan varsa veya dişiler faydalı olamayacak kadar yaşlanmışsa, satılabilirler ve elde edilen gelir, sürekli fayda sağlamak için genç dişiler satın almak için kullanılabilir. Bu dişiler daha sonra, tıpkı Al-Dardir'in deve kuşları hakkında bahsettiği gibi, asıl sahipleri gibi vakıf olarak kalırlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} Gayrimenkule gelince, Maliki mezhebine göre, ister ev, ister dükkan, isterse başka bir şey olsun, harap ve kullanılamaz durumda olsa bile satılamaz. Benzer şekilde, harap olmayan bir şeyle de değiştirilemez. Ebu el-Faraj, Malik'ten rivayet ettiğine göre, İmam satmanın faydalı olduğuna karar verirse, satıştan elde edilen gelir benzer bir şey satın almak için kullanılabilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17670} Bazıları, harap olmuş bölümün takas edilmesine izin vermişlerdir. Örneğin, Al-Taj wal-Iklil, vakıf bölümünün harap olmuş kısmının satılmasının yasak olduğunu bildirmiş, İbn Al-Jahm ise, bir başkasının onu yıllarca kiralayarak tamir edebileceğini ve eski haline döneceğini açıklamış, harap olmuş bölümün harap olmamış bir bölümle takas edilmesi konusunda ise görüş ayrılığı olduğunu belirtmiştir. İbn Rüşd ise şöyle demiştir: Eğer parçanın faydası tamamen durmuşsa ve onu tamir edip kiraya veremiyorsa, o zaman, sebebin ispatlanması ve tazmin edilenin faydasının gerçekleşmesinden sonra, hakimin hükmüyle, yerine vakıf kurulacak bir yerle takas edilmesinde bir sakınca yoktur. Bu, kayıt altına alınmış ve şahitler huzurunda yapılmış olmalıdır. Malikiler, vakfın belirli kişilere tahsis edilmiş olup olmamasına bakılmaksızın, cemaat camisini genişletmek için gerekli olması halinde gayrimenkul satışına izin vermişlerdir. İbn Rüşd, İbn el-Kâsım'ın rivayetinin zahiri anlamının, bunun her camide caiz olduğu olduğunu belirtmiştir. Şehnun ve Malik ile diğerlerine atfedilen nadir rivayetlerde, bunun cemaat camilerinde ihtiyaç duyulması halinde geçerli olduğu, ancak küçük cemaatler için olan camilerde geçerli olmadığı, çünkü ikincisindeki ihtiyacın cemaat camilerindekiyle aynı olmadığı söylenmiştir. Ayrıca, bir mezarlığı veya kamuya açık bir yolu genişletmek için bir vakfı satmak, yararlanıcıların veya yöneticinin isteği dışında bile olsa caizdir. Yararlanıcılar daha sonra elde edilen geliri başka bir vakıf kurmak için kullanmalıdır ve hakim onları buna zorlayamaz. Daha az bilinen bir yorumda, camiyi inşa etmek için kullanılan genişletilmiş arazinin değerinin, belirli bir yararlanıcı için vakıf olarak belirlenmişse ödenmesi gerektiği belirtilmiştir. Ancak, vakıf genel bir amaç için, örneğin fakirler için tahsis edilmişse, tazminat gerekmez; çünkü belirli bir yararlanıcının buna hakkı yoktur ve vakfedicinin caminin genişletilmesi için aldığı sevap, ilk niyetinden daha büyüktür. Malikiler, vakıfedici değişiklik veya ikame şartı koymuşsa, bu şartın yerine getirilmesi gerektiğini belirtirler. Bununla birlikte, arzu edilen bir fiyat bulunursa arazinin satılıp yerine başka bir arazi alınacağını şart koşmuşsa, nadir ve alışılmadık metinlerde bunun caiz olmadığı belirtilir. Böyle bir değişiklik veya ikame gerçekleşirse, geçerlidir ve şartı yerine getirilmiş olur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17671} Fethü'l-Ali el-Malik şu olayı rivayet etmiştir: Müslüman bir yol üzerinde halka açık bir geçit için arazi vakıf olarak bağışlanmıştır. Vakıfedici, arazinin satılmaması veya takas edilmemesi şartını koşmuştur. Vakıf yöneticisi daha sonra bu araziyi Divan'a (devlet dairesi) ait bir araziyle değiştirdi. El-Dardir, bağışçının hiçbir takasın mümkün olmadığını ve koşulsuz olduğunu şart koştuğu için takasın geçersiz olduğunu belirtti. Yönetici, Divan arazisini sahibine iade etmeli ve vakıf arazisini geri almalıdır. Bunu reddeden herkes hakim tarafından azarlanmalıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17671} Şafiî mezhebi, vakıf arazilerinin takasına izin vermektedir. El-Muhadhdhab'da, bir kimse bir camiye vakıf kurarsa ve o yer bakımsız kalır ve orada namaz kılınmazsa, o yer tekrar onun mülkiyetine geçmez ve onu elden çıkarmak da caiz değildir; çünkü Yüce Allah'ın hakkı nedeniyle mülkiyetinden çıkarılan bir şey, yıpranma nedeniyle tekrar onun mülkiyetine geçmez, tıpkı bir köleyi azat eden ve sonra köle hasta olan biri gibi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17671} El-Şirbini, en doğru görüşün, vakıf edilen cami hasırlarının yıpranması durumunda ve kirişlerinin kırılması veya kırılmak üzere olması ve sadece yakılmaya uygun hale gelmesi durumunda satılmasının caiz olduğu, böylece kaybolmalarının ve yerin onlara yetmemesinin önüne geçildiği, vakıf bedelinin küçük bir kısmını elde etmenin onları kaybetmekten daha iyi olduğu ve bu durumun vakfın satışı kapsamına girmediği, çünkü artık yokmuş gibi oldukları yönünde olduğunu söylemiştir. İki şeyh de bunu takip etti. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17671} El-Rafi'i, analojinin hasırların fiyatının sadece hasır almak için kullanılması gerektiği olduğunu söyledi. El-Adhra'i ise bununla kastedilenin çamurdaki samanın yeri olduğunu söyledi; tahta ve kapı gibi yakmak dışında başka amaçlar için uygun olan keresteler ise parça parça satılmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17672} Bir caminin yıkılma tehlikesi varsa, yıkılmalı ve yönetici gerekli görürse yerine başka bir cami inşa etmelidir. Yakınına inşa edilmesi tercih edilir ve üzerine kuyu açılmamalıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17672} Bir köprü üzerine vakıf kurulmuşsa ve vadi yanıp köprü kullanılamaz hale gelirse, onu ihtiyaç duyulan bir yere taşımak caizdir. Bir sınır karakolunun vakfından elde edilen gelir, orada güvenlik yeniden sağlandığında, tekrar sınır karakolu haline gelmesi ihtimaline karşı yönetici tarafından muhafaza edilmelidir. Bir kimse bir hurma ağacına vakıf kurarsa ve ağaç kurursa, veya bir hayvana vakıf kurarsa ve hayvan kronik olarak hastalanırsa, veya bir cami için ağaç gövdeleri vakıf kurarsa ve bunlar kırılırsa, iki görüş vardır: daha doğru olanı, camide olduğu gibi satılmasının caiz olmadığıdır; ikincisi ise, bundan bir fayda beklenmediği için satılmasının caiz olduğudur. Satılması caiz ise, fiyatına ilişkin hüküm, vakfın yok edilmesinden elde edilecek değere ilişkin hükümle aynıdır. Vakıf edilen şeyin mülkiyetinin yararlanıcıya ait olduğu söylenirse, fiyat da ona aittir. Eğer Allah'a ait olduğu söylenirse ki bu daha açık bir görüştür, o zaman onun yerine vakıf kurulması için onun eşdeğeri satın alınmalıdır. Ebu Hamid el-İsfarayini, fiyatın onun yerine vakıf kurulması için onun eşdeğerinin satın alınmasında kullanılması gerektiğini, hiçbir ihtilaf olmaksızın söylemiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672} Hanbeli mezhebine göre vakfın değiştirilmesi. Hanbeli mezhebi, vakfın amacına veya herhangi bir faydasına artık uygun olmaması durumunda, ister taşınır ister taşınmaz mal, ister cami olsun, değiştirilmesine izin verir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17673} Metne göre, bir vakfın satılması yasaktır ve geçersizdir; daha iyisine devredilmesi bile caiz değildir, ancak vakfın harap olması nedeniyle faydalarının kaybolması ve onarımı için gelir bulunmaması durumunda satılabilir; veya harap olmama durumunda faydalarının kaybolması halinde, örneğin yıpranmış ve düşme riski taşıyan odun gibi durumlarda satılabilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17673} Eğer vakıf bir cami ise ve amaçlanan faydası, sakinleri için küçük olması, genişletilmesinin imkansız olması, çevresinin harap olması veya yerin kirli olması ve içinde namaz kılınmasını engellemesi nedeniyle kaybolmuşsa, hakim, onu satıp elde edilen paranın benzer bir şeye harcanmasının caiz olduğunu söylemiştir; çünkü onu bu durumda tutmak para israfıdır ve amaç ancak başka bir varlıkta korunmuş olur ve ikame malların bağlantısı asıl varlıklar gibi değerlendirilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17673} Kurumuş vakıf ağacının ve kırılmış veya çürümüş veya kırılması veya yıkılması korkusu olan vakıf gövdesinin satılması caizdir; Özette şöyle dedi: Eğer vakfın gövdesi kırılma noktasına gelmişse veya binası yıkılma noktasına gelmişse ve gecikmesi halinde yararını yitireceği biliniyorsa, maddi değeri karşılığında satılır; okullar, yurtlar ve kervansaraylar, bakımsız hale gelirlerse, bir görüşe göre satılabilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17673} Askeri seferler için tahsis edilmiş bir at, bu amaç için uygunsuz hale gelirse satılabilir ve elde edilen gelirle uygun bir at satın alınabilir. Yerine yenisi satın alındığında, vakıf haline gelir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17673} Vakıf sahibinin satışı yasaklayan şartı geçersizdir. Vakıf, yoksullar, camiler ve köprüler gibi hayır amaçlı ise, satıştan hakim sorumludur. Eğer vakıf belirli bir kişi veya grup için kurulmuşsa, atanmış yönetici sorumludur. Ancak, hakimin izni olmadan ilerlememek daha ihtiyatlıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17674} Eğer yerine konulan mülk vakfın kurulması amacıyla satın alınırsa, vakıf haline gelir. Ancak, vakfın statüsünü sadece satın alma yoluyla tanımayanlar tarafından geçersiz kılınmasını önlemek için, vakfı yeni bir tapu ile kurmak tavsiye edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17674} Vakfın vakfın sahibine iadesi. Hanefi mezhebinden Muhammed ibn Hasan, eğer caminin etrafındaki alan harap olmuş ve artık ihtiyaç duyulmaz hale gelmişse, caminin kendisi hâlâ iskân ediliyor olsa bile, veya cami harap olmuş ve yeniden inşa etme imkanı yoksa ve başka bir cami inşa edilerek de artık ihtiyaç duyulmuyorsa, mülkiyetin, eğer inşa eden hayattaysa ona, eğer ölmüşse mirasçılarına geçtiğini, Ebu Yusuf'un görüşünün aksine, savunmuştur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17674} Muhammed bunu, vakfın sahibinin vakfı belirli bir ibadet için belirlediğini ve bu ibadet sona erdiği için vakfın da ortadan kalktığını söyleyerek açıklamıştır. Bu, artık ihtiyaç duyulmayan bir caminin hasırları ve otları veya cami yıkıldığında lambası gibidir. Bunlar, tıpkı bir kefenin vahşi bir hayvan tarafından parçalanması durumunda sahibine geri dönmesi gibi, ve hacı için sunulan kurbanlık hayvanın engel ortadan kalktığında ve hacı hacıyı yerine getirebildiğinde sahibine geri dönmesi gibi, onları sağlayanın mülkiyetine geri döner. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17674} Ebu Yusuf'a göre, kadının izniyle başka bir camiye nakledilir ve kalıntıları onun izniyle satılır ve geliri diğer camilere gider. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17674} Bu anlaşmazlığın bir kolu da, bir vakfın çökmesi ve onu onarmak için gelir olmaması durumunda, Muhammed'e göre kurucusuna veya mirasçılarına geri dönmesidir. Ancak Muhammed'e göre, yalnızca vakfedicinin amaçlanan yararına artık tamamen kullanılmayan şeyler sahibine geri döner; örneğin yanmış ve kiraya verilemeyen bir dükkan gibi. Gelir elde etmek amacıyla yapılanlar ise, kalıntıları dışında sahibine geri dönmez ve avlusu, küçük bir miktar karşılığında bile olsa kiraya verilebilen bir vakıf olarak kalır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17674} Şafiî mezhebi ise, daha doğru görüşün aksine, bir vakfın yararı garantili olmayan bir sebep nedeniyle kesintiye uğrarsa, örneğin bir ağacın kuruması veya rüzgar ya da sel nedeniyle kökünden sökülmesi ve kurumadan önce eski yerine geri getirilememesi durumunda, vakfın sona erdiğini ve vakfedicinin veya mirasçılarının mülkiyetine geçtiğini söylemiştir. Ancak aralarındaki daha doğru görüş, mülkiyete geçmediği, vakıf olarak kaldığı yönündedir. Hanbeli mezhebine göre de hüküm aynıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17674}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17675} Vakfın gözetimi. Fıkıhçılar, vakfın gözetiminin vakıf kuranın şartına bağlı olduğu konusunda hemfikirdir. Eğer gözetimi belirli bir kişi için yapmışsa, onun şartına uyulur; tıpkı Ömer ibn el-Hattab'ın vakfını kızı Hafsa'nın ömrü boyunca yönetmesi için, daha sonra da ailesinden aklı başında olanlara bırakması gibi, İbn Kudame'nin rivayet ettiği gibi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17675} Vakıf kuranın gözetimi kendisi için şart koşması durumunda ise görüş ayrılığına düşmüştür: Hanefiler, Şafiiler ve Hanbeliler'e göre bu caizdir. Malikilere gelince, eğer lehtar vakfı teslim almazsa, vakıf kuranın ölümü, hastalığı veya iflası ile vakıf geçersiz hale gelir. Eğer lehtar vakfı teslim alır ve vakıf kuran kendisi için denetim şartını koymuşsa, vakıf geçerlidir ve vakıf kuran, kendisi için denetim yapması caiz olmadığı için, başkası için denetim yapmak zorundadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675} Eğer vakıf kuran bir denetçi şart koşmamışsa, Malikilere ve Hanbelilere göre: Vakıf, fakirler, muhtaçlar veya camiler gibi belirsiz bir lehtar için ise, yönetici dilediği kişiyi atar, çünkü kendisi şahsen denetim yapamaz. Eğer vakıf belirli ve yetkin bir hak sahibi için kurulmuşsa, vakfın işlerini o yönetir; çünkü vakıf onun malı ve faydası da ona aittir, dolayısıyla vakfın denetimi onun mutlak mülkiyeti gibidir. Eğer vakıf yetkin değilse, vasisi vakfın işlerini yönetir. İbn Abi Musa'nın seçtiği Hanbeliler arasında ise, yöneticinin vakfı denetlemesi olasılığı da vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17675} Hanefiler arasında, kurucu bunu şart koşmamışsa vakfı yönetme yetkisi konusunda görüş ayrılıkları vardır. Asıl görüş olan Ebu Yusuf'a göre, yetki önce kurucuya, sonra varsa atadığı vasisine, aksi takdirde develisine aittir. Hilal'e göre, ki bu okulun görünen görüşüdür, vakıf önce kurucuya, sonra onun atadığı vasiye veya hakime aittir; çünkü mütevelli, yetkisini ancak kurucunun şartıyla ondan alır, dolayısıyla başkası ondan yetki alırken mütevellinin yetkiye sahip olması imkansızdır. Dahası, kurucu vakfa en yakın kişidir ve bu nedenle yönetimi daha çok hak eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17676} Muhammed'e göre, kurucu, vakfı şart koşmadığı sürece yetkiye sahip değildir; çünkü ona göre, vakfı mütevelliye devretmek, vakfın geçerliliği için bir şarttır. Mütevelli devredildikten sonra, kurucunun artık vakıf üzerinde hiçbir yetkisi kalmaz. Vakıf sahibi mütevelli atamadan ölürse, uygun bir kişi bulunamazsa, hakim vakıf sahibinin ailesinden bir mütevelli atar. Bunun nedeni, hakimin daha merhametli olması veya vakfı kuranın vakfın kendisine atfedilmesini amaçlamış olmasıdır. Uygun bir kişi bulunamazsa, aile dışından uygun bir kişi atanabilir. Şafiî mezhebine göre, vakfı kuran bir mütevelli tayin etmemişse, hakim genel gözetim yetkisine sahip olduğu için vakfı denetleme yetkisine sahiptir. Ayrıca, vakfın başlangıçta vakfa ait olması ve dolayısıyla onun kontrolünde kalması nedeniyle mütevelliliğin vakfı kurana ait olduğu da söylenmiştir. Başka bir görüş ise, gelirler kendisine ait olduğu için mütevelliliğin lehtara ait olduğudur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17677} Denetçi için Şartlar. Hukukçular, bir denetçinin uygunluğu için bazılarında hemfikir oldukları, bazılarında ise farklı görüşlere sahip oldukları şartlar belirlemişlerdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17676} İlk şart: Hukuki ehliyet. Hukukçular, denetçinin reşit ve akıl sağlığının yerinde olması gerektiği konusunda hemfikirdir. Bu nedenle, genel olarak, reşit olmayan veya akıl hastası bir kişinin atanması, hukuki ehliyet eksikliği nedeniyle geçersizdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17676} Maliki ve Hanbeli mezheplerine göre, eğer vakfedici belirli bir yönetici belirtmemişse ve yararlanıcı Zeyd veya Amr gibi belirtilmişse, vakfı bizzat yönetici yönetir. Eğer reşit değilse veya akıl hastası ise, vasisi onun adına hareket eder. Hanbeliler, vakıf malının mülkiyetinin, eğer kişi belirli bir birey veya sınırlı bir grup ise, lehtara geçtiğini söylemişlerdir. Yönetici, akıl sağlığı yerinde ve hukuki ehliyeti varsa vakfı denetler; eğer reşit değilse, akıl hastası veya akılsız ise, vasisi denetler. İbn Abi Musa ise, hakimin denetlediğini söylemiştir. Hanefi mezhebine göre, İbn Abidin, el-İsaf'tan, reşit olmayan birini yönetici olarak atamanın her durumda kıyas yoluyla geçersiz olduğunu ve fıkıh tercihi gereği de reşit olmadığı sürece geçersiz olduğunu belirtmiştir. Reşit olmayan kişi yetişkinliğe ulaştığında, yönetici vesayet hakkına sahip olur. El-Şalabi, vesayetin bir küçüğe verilmesinin asla geçerli olmadığını, çünkü gözetimin bir vesayet biçimi olduğunu ve küçüğün zaten vesayet altında olduğunu ve başkalarının başına atanamayacağını söylemiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17677} İbn Abidin, Raşid el-Din hakkındaki fetvalarında, bir hakimin vesayeti bir küçüğe devretmesinin, küçüğün işleri yönetebilecek durumda olması halinde caiz olduğunu belirtmiştir. El-İs'af'ta geçenleri, işleri yönetemeyecek durumda olan birine atıfta bulunacak şekilde yorumlamıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17677} Akıl hastalığı başlangıçta atamayı engellediği gibi, devamlılığını da engeller. Yönetici akıl hastası olursa, görevinden alınır. İbn Abidin, El-Fath'ın, gözetmenin bir yıl veya daha kısa süreli sürekli akıl hastalığı nedeniyle görevden alındığını söylediğini aktarmıştır. Eğer iyileşirse, denetim görevi yeniden tesis edilir. El-Nahr'da bunun, denetimi şart koşulan kişi için geçerli olduğunu, ancak hakim tarafından atanan kişi için geçerli olmadığını söylemiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17677} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17678} Şafiî mezhebi, akıl hastalığının denetim yetkisini ortadan kaldırdığını şart koşmuştur. El-Şubramalsi, akıl hastası kişi iyileşirse, eğer vakıf sahibi tarafından şart koşulmuşsa, denetimin iyileşme üzerine yeniden tesis edildiğini söylemiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17678} İkinci şart: adalet. Vakfın denetçisinin adil olması gerekir ve bununla ilgili ayrıntılar vardır. Hanefiler, bunun geçerlilik şartı mı yoksa öncelik şartı mı olduğu konusunda farklı görüşlere sahiptiler; Hakim, haini atamanın uygun olmadığı için, mütevellinin şahsen veya bir vekil aracılığıyla yalnızca güvenilir ve yetenekli bir kişi tarafından atanması gerektiğini söyledi. İbn Abidin, dürüstlüğün geçerlilik için değil, öncelik için bir şart olduğunu ve bir mütevellinin yozlaşması durumunda görevden alınmayı hak ettiğini, ancak tıpkı bir hakimin yozlaşması durumunda görevden alınamayacağı gibi, görevden alınamayacağını savundu. Maliki mezhebine göre, mütevellinin hakim veya vakıf sahibi tarafından atanması durumunda dürüstlük dikkate alınır. Vakfın mütevelliliği, vakıf sahibinin atadığı, dindarlığı ve güvenilirliği güvenilir olan kişiye aittir. Mütevelli kötü yönetilir ve güvenilmez ise, yararlanıcı kendi işlerini kontrol altında tutmadığı ve onu kabul etmediği sürece, hakim onu görevden alır. El-Karafi, hakimin mütevelliyi ancak bir suçtan dolayı görevden alabileceğini, vakfın ise suç olmaksızın bile görevden alabileceğini belirtmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17678} Şafiî mezhebine göre, yönetici tarafından atanan kişide dışsal ve içsel adalet gereklidir. El-Subki, vakfın atadığı kişide dışsal adaletin yeterli olacağını söylemiştir. El-Adhraî ise onda da dışsal ve içsel adaletin gerekli olduğunu belirtmiştir. El-Şirbini ise ilk görüşü tercih etmiştir. Eğer mütevelli yozlaşırsa, görevden alınır ve mütevellilik hükümdara devredilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17678} Şafiîler, mütevelli yozlaşırsa ve sonra dürüst olursa, mütevelliliğin asıl vakıf senedinde açıkça belirtilmiş olması şartıyla kendisine iade edildiğini, aksi takdirde iade edilmediğini söylemişlerdir. Bu, Nevevi'nin fetvasıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17679} Hanbeliler ise, mütevellilik vakfın yararlanıcısından başkası için ise ve mütevellilik hükümdardan veya asıl mütevelliden ise, dürüstlüğün gerekli olduğunu, çünkü bunun bir yetimin malı üzerindeki mütevellilik gibi mal üzerindeki mütevellilik olduğunu; mütevellinin adil olmaması durumunda, vakfı korumak için yetkisinin kaldırıldığını söylemişlerdir. Eğer yetkinliğini yeniden kazanırsa, hakları iade edilir. Eğer mütevelli, bağışçı tarafından atanmışsa, adalet şart değildir ve yozlaşmış olana adil bir kişi eklenir, çünkü vakfı korumak, yozlaşmış bir kişinin mütevelliliğini sürdürmekten daha önemlidir. Eğer mütevelli, ister adil ister yozlaşmış olsun, yararlanıcı ise, ona daha büyük hakkı vardır. Ayrıca, ona güvenilir bir kişinin eklenmesi gerektiği de söylenmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17680} Üçüncü şart: yetkinlik, yani kişinin gücü ve denetlediği şeyi yönetme becerisi. Şafiî ve Hanbeli mezhepleri bu şartı açıkça belirtir, çünkü vakfı korumak dini bir yükümlülüktür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17679} Eğer denetçinin yetkinliği eksikse, Şafiîler, ataması şart koşulmuş olsa bile, hakimin denetçiyi görevden alması gerektiğini söylemişlerdir. El-Nevevi, eksiklik giderilirse, şart koşulmuş ve özel olarak atanmışsa, denetimin yeniden başlatılacağını söylemiştir. Hanbeliler, denetçinin yetkinliği eksikse, görevden alınmaması, bunun yerine istenen sonucu elde etmek için güvenilir ve yetenekli bir kişinin atanması gerektiğini söylemişlerdir. Hanefiler, denetçinin güvenilmez veya yetersiz olması durumunda görevden alınması gerektiğini söylemişlerdir; Malikilerin açıklamaları da yetkinlik şartını ima etmektedir. Dördüncü şart: İslam. Hanbeliler, vakfın yararlanıcısı Müslüman ise veya vakıf cami gibi bir amaç için ise, mütevellinin Müslüman olması gerektiğini şart koşmuşlardır. Bu, Hanbelilerin bu şart için delil olarak gösterdiği Nisa Suresi 141. ayete dayanmaktadır. Eğer vakıf belirli bir gayrimüslim için ise, mütevelli de gayrimüslim olabilir. Ancak Hanefiler, gayrimüslim birinin mütevelli olmasına izin verir ve İslam'ı şart koşmazlar. Dolayısıyla, bir hakim herhangi bir nedenle mütevelliyi görevden alırsa ve mütevelli daha sonra İslam'a geçerse, yetkisi geri verilmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17680} El-Ramli, vasiyet ve evliliğe benzer şekilde, vakfın yararlanıcısı gayrimüslim ve dürüst bir karaktere sahip ise, gayrimüslim birini yönetici olarak atamanın caiz olduğunu söylemiştir. Ancak bu, vakıf konularında gerçek dürüstlük şartıyla çürütülmektedir. El-Şubramalsi, bu reddin kabul görmüş görüş olduğunu söylemiş ve bunu, vesayeti altındaki gayrimüslim bir kadının evliliğinden ayırarak, evlilikte velinin doğal olarak vesayet altındaki kişinin iffetini korumaya meyilli olduğunu savunmuştur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17681} Vakıf yöneticisinin ücreti. Konu, yöneticinin ücrete hak kazanması, bunun vakıf sahibi veya hakim tarafından belirlenmesi, miktarı ve kimse tarafından kendisine bir ücret atanmamışsa ücrete hak kazanıp kazanmadığıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17681} A- Denetçinin hakkı: Fıkıhçılar, denetçinin vakfı yönetmesi ve menfaatlerini gözetmesi karşılığında bir ücrete hak kazandığı görüşündedir. İbn Hacer, Ömer'in Hayber'deki arazisini vakfettiğinde söylediği şu sözü delil olarak gösterdiler: \"Kim bu araziyi yönetirse, makul bir şekilde geçinmeli veya zengin olmayan bir dostunu doyurmalıdır.\" Ayrıca Ali'nin, vakfettiği kölelerin masraflarını arazinin gelirinden karşılamasını ve zekât toplayıcısına benzer şekilde, \"Eşlerimin ve işçimin masraflarından sonra kalan ne varsa sadakadır\" hadisini de delil olarak gösterdiler. İbn Hacer, burada işçiden kastedilenin arazinin sorumlusu olduğunu, dolayısıyla ücretinin meşruiyetini gösterdiğini söyledi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} B- Ücretin tahmini. Vakıf sahibi tarafından belirlenebilir; bu durumda mütevelli, geleneksel ücreti aşsa bile, belirlediği miktarı alır. Bu, Hanefi, Şafiî ve Hanbeli mezheplerinin görüşüdür. Hanefilere göre, eğer vakıf kuran kişi geleneksel ücretten daha az bir miktar belirtirse, hakim onun isteği üzerine geleneksel ücreti tamamlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17682} Şafiîlere göre, eğer vakıf kuran kişi kendisini mütevelli olarak atar ve kendisi için bir ücret belirlerse, bu geleneksel ücreti aşamaz. Daha fazla belirlerse, vakıf geçersizdir çünkü bu kendisi için bir vakıftır. Hanbeliler ise, eğer vakıf kuran kişi mütevelli için sabit bir ücret belirlerse ve bu ücret geleneksel ücrete eşitse, mütevellinin bu ücrete hakkı olduğunu söylerler. Eğer daha fazla ise, vakıf kuran kişi mütevelli için özel olarak belirlemediği sürece, vakfın ihtiyaç duyduğu masrafların (mütevelli ve diğerleri gibi) fazladan karşılanması ve mütevellinin geleneksel ücretine ulaşması sağlanır. Malikiler ise bu konuda herhangi bir şey belirtmemiş ve bunu vakfedicinin veya hakimin takdirine bırakmışlardır. Vakıf sahibi bir ücret belirtmezse, bunu hakim belirler. Hanefiler ve Hanbelilere göre, belirlenen ücret geleneksel ücreti aşmamalıdır ve daha fazlasını belirtirse, fazlasını alması engellenir. Malikiler ise bu konunun hakimin takdirine bırakıldığını söylemişlerdir. İbn Futuh, hakimin, kendi takdirine ve imamların uygulamasına göre, mütevellilik için atadığı kişiye bilinen bir aylık ücret belirlemesinin caiz olduğunu söylemiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17682} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17683} Şafiî mezhebine göre, eğer bağışçı mütevelli için bir ücret belirlemezse, en sağlam görüşe göre mütevelli herhangi bir ücrete hak kazanmaz ve vakıf fonlarından hiçbir şey alamaz. Eğer alırsa, sorumludur ve ancak bunu hakime teslim ederek kurtulabilir. Bu, güvenilen görüştür. Eğer mütevelli, ücretini belirlemesi için konuyu hakime havale ederse, çocuğunun parasını koruma işini hakime havale eden bir vasi gibidir. El-Iraki, bunun ima ettiği şeyin, gerekirse ücreti alması olduğunu, ya El-Rafi'i'nin tercih ettiği gibi masraflarının miktarını ya da El-Nawawi'nin tercih ettiği gibi masraflarının ve kendisine benzer birinin ücretinin daha az olanını alabileceğini belirtmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17683} C- Eğer vakıf sahibi denetçi için bir ücret belirlemezse. Hanefi mezhebinden El-Ramli, hakimin işinin standardına denk bir ücret belirlemediği sürece denetçinin hiçbir şeye hakkı olmadığını söylemiştir. İbn Abidin, vakıf sahibi denetçi için bir şey belirlerse, az ya da çok, çalışıp çalışmadığına bakılmaksızın, işin karşılığı olarak şart koşmadığı sürece, bunun onun olduğunu açıklamıştır. Vakıf sahibi belirtmezse ve hakim işinin standardına denk bir ücret belirlerse, bu caizdir. Daha fazla belirlerse, fazlası haramdır. Çalışmazsa, ücrete hakkı yoktur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17683} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17683} Eğer hakim onu atar ve ona herhangi bir şey belirtmezse, eğer onun sadece işinin standardına denk bir ücretle çalışması örf ve adet ise, işinin standardına denk bir ücrete hak kazanır, çünkü örf ve adet bir şart gibidir. Aksi takdirde, hiçbir şeye hak kazanmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17683} İbn Nujaym, el-Kunya'ya atıfta bulunarak, bir hakimin atadığı mütevelliye maaş belirtilmediği takdirde Hanefiler arasında iki görüş bildirmiştir: Birincisi, bir yıl çalışsa bile hiçbir şeye hak kazanmadığıdır; İkincisi, mütevellinin, maaş şart koşulmuş olsun ya da olmasın, yaptığı işe denk bir ücrete hakkı vardır; çünkü mütevelliliği sadece maaş karşılığında kabul eder ve örf ve adet olan, şart koşulan gibidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17683} Şafiîlere göre, eğer vakıf kuran mütevelli için herhangi bir şart koşmamışsa, en sağlam görüşe göre mütevelli maaşa hak kazanmaz. Eğer konu hakime havale edilirse, gerekirse maaş verilir. Hanbeliler üç görüşe sahiptir: Birincisi, mütevellinin, ihtiyaç sahibi olsun ya da olmasın, zekât toplayıcısına benzer şekilde, vakfın gelirlerinden makul bir şekilde pay alabileceğidir. Bu, Ebu el-Hattab'ın görüşüdür. İkincisi, yetimin vasisine benzer şekilde, örf ve adet olan ücretten daha az veya kendisine yetecek kadar alabileceğidir. Bu, ancak fakir olması durumunda caizdir. Üçüncüsü, yaptığı iş karşılığında ücret aldığı bilinen mütevellinin, alışılmış ücrete hakkı vardır. Bu, mezhep içindeki yaygın görüştür. Maliki mezhebinin görünen görüşü ise, İbn Futuh'un belirttiği gibi, hakimin mütevelliye vakıflar için bir ücret veya yargısı ve çalışmasına bağlı olarak sabit bir aylık ödenek tahsis etmesi gerektiğidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17684} Ücretin kaynağına gelince, hukukçuların çoğunluğu, yani Hanefiler ve Malikiler (İbn Attab hariç), Şafiiler ve Hanbeliler, vakfı kuran tarafından belirlenen veya hakim tarafından belirlenen yöneticiye ödenecek ücretin, vakfın gelirlerinden geldiğini savunmuşlardır. Buna kanıt olarak Ömer'in arazisini vakfettiğinde söylediği şu sözü göstermişlerdir: \"Bu hayır kurumunun yöneticisi, servet biriktirmeden bundan yiyebilir.\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17685} Maliki mezhebinden İbn Attab, yöneticinin ücretinin yalnızca devlet hazinesinden karşılanması gerektiğini söylemiştir. Eğer vakıflardan alınırsa, iade edilmeli ve devlet hazinesinden alınmalıdır. Eğer devlet hazinesinden verilmezse, mükafatı Allah katındadır. El-Hattab bunu, vakıfların vasiyetname için olduğu için değişime tabi olmadığını söyleyerek açıklamıştır. İbn Ward da buna benzer bir fetva vermiştir, ancak El-Dasuqi, İbn Attab'ın görüşünü zayıf bulmuştur. Mütevellinin ücret almaya hak kazandığı iş, vakfın korunması, bakımı ve kiralanması, kira, ürün veya mahsullerden gelirinin toplanması, geliştirilmesi için çaba gösterilmesi ve bakım, onarım ve hak sahiplerine dağıtılması gibi belirlenmiş amaçlar için harcanmasıdır; bu, yerleşik uygulamadır. Ödeme, atanma anından itibaren yapılır, çünkü bu bir iş karşılığıdır ve yalnızca yapılan iş oranına göre ödenir. Hanbeliler, mütevellinin ihmalkar olması durumunda, ödemesinin, vakıf için ihmal ettiği iş oranına göre azaltılacağını belirtmişlerdir. Hesaplanan miktar daha sonra yaptığı ve yapmadığı işler arasında paylaştırılır ve yapmadığı kısım düşülür. Hanefiler, bir vakfın lehtarları mütevelli ile ihtilafa düşerse ve vakıf sahibinin mütevellinin yapmadığı bir iş karşılığında ödeme şart koştuğunu iddia ederlerse, hakimin onu valilerin bile yapmadığı bir işle yüklememesi gerektiğini belirtmişlerdir. Mütevelli, emretme, yasaklama, alma ve verme yetkisine sahip olduğu bir musibetle karşılaşırsa, ödemeye hak kazanır; aksi takdirde hak kazanmaz. Vakıf sahibi, alışılmış ücretin üzerinde bir ödeme şart koşmuş olsa bile, bu caizdir. Bir diğer sorunları da şudur: Eğer birisi hayırseverlerine arazi bağışlar ve sonra ölürse, hakim bağış için bir mütevelli atar ve ona ürünün onda birini tahsis ederse ve bağış, mütevelli gerektirmeyen bir ortakçılık düzenlemesiyle bir adamın elinde bulunan bir değirmeni de içeriyorsa ve yararlanıcılar değirmenin ürününü ondan topluyorsa, o zaman mütevelli ürünün onda birine hak kazanmaz, çünkü aldığı şey ödeme olarak kabul edilir ve iş olmadan ödeme olmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17685} Bağışın denetçisinin muhasebesi. Vakıf gözetmeninin görevi, vakfın gelirlerini toplamak, vakfın ihtiyaçları için harcamak ve yararlanıcılara dağıtmaktır. Alimler, harcamalarından dolayı, gerek hakim gerekse yararlanıcılar tarafından hesap sorulması gerektiği konusunda hemfikirdir. Ancak, harcamalarla ilgili beyanının delil olmaksızın kabul edilip edilmemesi ve delil yoksa yeminle kabul edilip edilmemesi konusunda farklı görüşlere sahiptirler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17685} Hanefi mezhebi, hakimin vakıf gözetmenini vakıf gelirlerinden yapılan her harcama için ayrıntılı olarak sorumlu tutmakla yükümlü olmadığını belirtir. Aksine, güvenilir biri olarak biliniyorsa, genel bir beyanı yeterlidir. Dürüstlükten şüpheleniliyorsa, hakim onu hapse atmadan, yavaş yavaş açıklama yapmaya zorlar. Bunun yerine, onu iki veya üç günlüğüne çağırır ve uyarır. Açıklama yaparsa her şey yolundadır; aksi takdirde, hakim yeminini kabul eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17686} Al-Durr, Al-Qunya'nın şöyle dediğini aktarmıştır: Eğer hakim onu suçlarsa, güvenilir olsa bile, tıpkı mevduatının kaybolduğunu iddia eden bir mevduat sahibi gibi, yemin ettirmek zorundadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17686} Mütevellinin hak sahiplerine ödeme yaptığını iddia etmesi durumunda Hanefilerin görüşleri farklılık göstermiştir: Al-Durr, ifadesinin yemine gerek kalmadan kabul edildiğini söylerken, Al-Is'af ve Al-Bahr buna katılmamıştır. El-İs'af, mütevellinin \"Kirayı aldım ve hak sahiplerine ödedim\" demesi ve onların bunu inkar etmesi durumunda, mütevellinin ifadesinin yeminle kabul edildiğini, tıpkı mevduatı iade ettiğini iddia eden bir mevduat sahibinin ifadesi gibi olduğunu ve mütevellinin kirayı aldığını kabul etmesi nedeniyle vakıf malının kiracısının kiradan muaf olduğunu söylemiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17686} İbn Abidin, El-Hair El-Ramli'den, bu durumda yemin etmesi gerektiği yönünde bir fetva olduğunu nakletmiştir; Hamidiye Fetvalarında ise Ebu el-Sa'ud'dan, mütevellinin müsrif ve savurgan olması durumunda, vakıf fonlarının harcanmasıyla ilgili sözünün, yeminle bile kabul edilmediği rivayet edilmiştir. El-Şalabi'den rivayet edildiğine göre, İslam hukukuna aykırı özellikler taşıyan kimse haddini aşan olur ve harcamalarıyla ilgili sözü, delil olmaksızın kabul edilmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17686} Güvenilir bir gözetmenin görevden alınmasından sonra sözünün kabul edilmesine gelince, El-Hamavi, sözlerinin zahiri anlamının kabul olduğunu, çünkü görevden alınmanın onu mütevelli statüsünden çıkarmadığını belirtmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17686} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17687} El-Durr'un yazarı, El-Mulla Ebu El-Saud'dan ayrıntılı olarak alıntı yapmıştır: Mütevelli, bir vakfın gelirlerinden çocuklarına veya çocuklarının çocuklarına ödeme yaptığını iddia ederse, beyanı kabul edilir. Eğer imam ve müezzin gibi yetkili makamlardakilere ödeme yaptığını iddia ederse, bu kabul edilmez; tıpkı bir camiye belirli bir ücret karşılığında inşaat işi yaptırıp daha sonra işi teslim ettiğini iddia eden biri gibi. El-Tamartashi bu ayrıntıyı onaylamıştır. Malikiler, vakfın kurucusunun ölmesi ve vakıf senedinin kaybolması durumunda, mütevellinin harcamalarla ilgili sözünün, güvenilir olması şartıyla kabul edildiğini, ancak vakfın kuruluşuna şahitlerin bulunması durumunda harcamaların ancak şahitlerin bilgisi dahilinde yapılabileceğini söylemişlerdir. Eğer mütevelli kendi parasından vakıf için harcama yaptığını iddia ederse, dürüstlüğünden şüphelenilmiyorsa yemin etmeden inanılır; aksi takdirde yemin etmesi gerekir. El-Hattab, El-Suyuri'ye bir caminin imamı, müezzini ve yöneticisi hakkında soru sorulduğu bir olayı aktarmıştır. Yıllar sonra, bir pazar müfettişi onları dükkanların gelirlerinden zimmete para geçirmekle suçlamıştır. Yönetici ise hiçbir şeyi zimmete geçirmediğini reddetmiştir. El-Suyuri, harcadığı iddia edilen miktarla ilgili olarak, beyanıyla örtüşüyorsa sözünün kabul edilmesi gerektiğini söyledi. El-Barzali ise, gelir ve giderlerin şahitli olması şartı getirilmediği sürece bunun geçerli olduğunu belirtti. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17687} Şafiî mezhebi, yararlanıcıların belirtildiği durumlar (Zayd ve Amr gibi) ile belirtilmediği durumlar (fakirler gibi) arasında ayrım yapmıştır. İkinci durumda, İmam ondan hesap sorabilir mi? İki görüş vardır, daha güçlü olanı birincisidir. Harcadığı miktar makul ise ona inanılmalıdır. Hakim onu suçlarsa, yemin ettirilmelidir. Burada kastedilen, geleneksel harcamalardır ve bu, fakirlere ve benzeri kamu kurumlarına yapılan harcamaları da içerir. Bu, belirli bir yararlanıcıya yapılan harcamadan farklıdır; zira bu durumda, kendisine emanet edilmediği için ona inanılmamalıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17687} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17688} Hanbeli mezhebi, hizmetlerini gönüllü olarak sunan bir mütevelli ile ücret alan bir mütevelli arasında ayrım yapmıştır; bağışçının yararlanıcıya ödeme yapılmasıyla ilgili beyanı kabul edilir, ancak bağışçı değilse, beyanı delil olmadan kabul edilmez. El-Bahuti ve El-Mardavi, vakfın yararlanıcılarının, bağışçı tarafından atanan kişinin güvenilir olması şartıyla, ona itiraz etmediklerini, ancak ondan ne yapmasını istedikleri konusunda soru sorabileceklerini belirtmişlerdir. Hükümdar, gerektiğinde vakıf fonlarını denetlemek için bir büro kurma hakkına sahiptir. Vakıf gözetmeninin görevden alınması ve onu görevden alma yetkisinin kimde olduğu: Gözetmen için şartlar ve şartlardan herhangi birinin yerine getirilmemesi durumunda görevden alınmasına ilişkin hüküm daha önce açıklanmıştır; bundan sonra onu görevden alma yetkisinin kimde olduğu açıklanacaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17688} Birincisi: Vakıf kuranın görevden alma hakkı. Şafiî ve Hanbeli mezhepleri, vakıf kuranın başlangıçta vakfı kendisi yöneteceğini şart koşup daha sonra başkasına devretmesi ile vakfı baştan başkasına devretmesi arasında ayrım yaparlar. Eğer vakfı kendisi yöneteceğini şart koşup daha sonra başkasına devrederse, onu görevden alıp yerine başkasını atama hakkına sahiptir, çünkü bu onun temsilcisidir, tıpkı bir müvekkilin vekilini görevden alması gibi. Bu, Şafiî mezhebine göre doğru görüştür ve Hanbeli mezhebine göre de, alt hükümlerin doğruluğuna dayanarak doğru görüştür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17688} El-Şirbini el-Hatib, bunun, bağışçının sebep göstermeden görevden alma hakkına sahip olduğu anlamına geldiğini belirtmiştir. El-Subki bunu açıkça ifade etmiş ve İbn Razin de dahil olmak üzere birçok sonraki âlim, sebep göstermeden görevden almanın caiz olmadığını belirten fetvalar yayınlamıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17689} Şafiî ve Hanbeli mezhepleri içindeki bir görüşe göre, bağışçı mütevelliyi görevden alamaz, çünkü mülkiyeti sona ermiştir. Ancak, vakıf sahibi vakfın yönetimini belirli bir kişiye devretmişse, Şafiî mezhebi, meşru bir sebep olsa bile, bu kişinin görevden alınmasına izin vermez; çünkü mütevelli, vakfın yönetimini başka birine devrettikten sonra artık bu hakkı elinde bulundurmaz. Bu nedenle, atanmış mütevelli görevden alınırsa veya yozlaşırsa, yerine birinin atanması vakıf sahibinin değil, hakimin yetki alanına girer. Hanbeli mezhebi ise, vakıf sahibi vakfın yönetimini başka bir kişiye devretmiş ve ayrıca bu kişiyi görevden alma hakkına sahip olduğunu belirtmişse, görevden alma hakkına sahip olduğunu; aksi takdirde sahip olmadığını ifade eder. Hanefi mezhebine göre, Muhammed ibn Hasan, vakıf kuranın mütevelli atama, görevden alma ve değiştirme yetkisinin kendisine ve çocuklarına ait olacağını şart koşması ve vakfı mütevelliye devretmesi durumunda bunun caiz olduğunu ve mütevelliyi görevden alma hakkına sahip olacağını savunmuştur. Ancak, görevden alma yetkisini kendisine şart koşmamışsa, yetkiyi devrettikten sonra mütevelliyi görevden alma hakkına sahip olmaz, çünkü vakıf ehlinin yerine geçer. Sadr el-Şehid, fetvanın Muhammed'in görüşüne uygun olduğunu söylemiştir. İbn Abidin ise bunun, mütevelliye devretme şartı konusundaki görüş ayrılığına dayandığını belirtmiştir. Muhammed'e göre bu bir şarttır, ancak Ebu Yusuf'a göre, vakfedici bunu şart koşmuş olsun ya da olmasın, yetki vakfediciye aittir, çünkü ona göre devretmek bir şart değildir. Bu, Hilal'in görüşü ve mezhebin görünen görüşüdür. Vakfedici başka birini atarsa, o kişi onun vekilidir ve onu görevden alma hakkına sahiptir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17690} El-Ramli, bunun, suç olsun ya da olmasın görevden almaya izin vermede açık olduğunu, çünkü vekilin vekili görevden alma hakkına sahip olduğunu söylemiştir; El-Dur ise fetvanın Ebu Yusuf'un sözüne dayandığını, El-Bahr ise Belh şeyhlerinin onun sözüne dayanarak fetvalar verdiğini söylemiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17690} Maliki mezhebine göre, vakıf kuran kişi mütevellinin kendisi için atanmasını şart koşamaz. Aksine, mütevelli atama şartlarına uyulmalıdır. Eğer belirli bir kişinin mütevelli olmasını şart koşarsa, bu değiştirilemez. El-Bedr el-Karafî, vakıf kuranın mütevelliyi kötü davranış dışında başka nedenlerle de görevden alma hakkına sahip olduğunu belirtmiştir. İbn Arafa açıkça, vakıf kuranın uygun gördüğü kişiyi görevden alıp yerine başkasını atama hakkına sahip olduğunu ifade etmiştir. El-Hattab, bir şeyi vakıf edip başkasının eline bırakan ve sonra onu görevden almak isteyen kişinin, bir hakimin birini ataması gibi açık bir gerekçe olmaksızın bunu yapamayacağını söylemiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17690} İkincisi: Hakimin görevden alma hakkı. Hakimin genel yetkisi vardır ve bu nedenle, mütevellinin dürüstlüğünün kanıtlanması veya yukarıda belirtilen şartlardan birini yerine getirmemesi durumunda, vakıf kurucusu tarafından atanan mütevelliyi görevden alma hakkına sahiptir. Ancak, sebepsiz yere görevden alamaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17690} Eğer mütevelliyi atayan kişi hakim ise, Malikiler, Şafiiler ve bazı Hanefiler, hakim tarafından atanan mütevellinin ihanet veya benzeri bir sebep dışında görevden alınmasının caiz olmadığını savunurlar. Hanbeliler ve bazı Hanefilere göre ise, mütevellinin ihanet olmaksızın görevden alınması caizdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17690} Bir vakfın birden fazla mütevellisi olması. Hukukçuların belirttiği gibi, bir vakfın bir veya daha fazla mütevellisi olması caizdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17690} Eğer vakıf sahibi iki denetçi atarsa, Şafiî, Hanbeli ve Ebu Hanife'ye göre, vakıf sahibi her ikisinin de görüşlerini onaylamadığı için, her birinin diğerinden bağımsız hareket etmesi mümkün değildir; ancak her birinin bağımsız hareket edebileceğini şart koşmuşsa, her biri bağımsız hareket edebilir. Vakıf sahibi vakfın yönetimini bir kişiye, gelirlerinin tahsilini ise başka bir kişiye verirse, bu geçerlidir ve her biri şart koştuğu şeye hak kazanır. Ebu Yusuf'a göre, mütevellilerin her biri bağımsız hareket edebilir. Hanefiler, vakıf sahibi yönetimi bir kişiye verip, başka bir kişiye de vasi atarsa, her birinin görevleri tek bir oturumda özel olarak belirtilmedikçe, ortak mütevelli sayılırlar; aksi takdirde her biri bağımsız hareket eder. Eğer vakfedici yönetimi en erdemli oğluna atarsa ve erdem bakımından eşit iseler, yönetimi paylaşmazlar; aksine, en büyüğü paylaşır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17692} Eğer mütevellilerden biri kabul eder, diğeri reddederse veya mütevellilerden biri ölürse ya da görevini yerine getiremezse, hakim onun yerine başka birini atar. Bu, Hanefi, Şafiî ve Hanbeli mezheplerinin görüşüdür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17692} Şafiî mezhebine göre, eğer vakfedici mütevellinin çocuklarının en büyüğü olmasını şart koşarsa ve her biri en büyük olduğunu iddia ederse, yasal olarak ehliyetli olmaları koşuluyla mütevelliliği paylaşırlar. Hiçbiri bağımsız hareket edemez, çünkü kıdem iddiası çelişkili delillerle geçersiz kılınmıştır, ancak kıdem ilkesi geçerliliğini korur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17691} Mütevelli, mütevellilik görevini başkasına devredemez. Mütevelli, vakfedici tarafından yetkilendirilmedikçe, mütevellilik görevini dilediği kişiye devredemez veya başkasına vasiyet edemez. Hanefiler şöyle demişlerdir: Vakfedicinin mütevelliye verdiği yetki genel ise, yani onu kendi yerine atamış ve ona gözetimi devretme ve dilediği kişiye vasiyet etme yetkisi vermişse, mütevelli sağlıklı iken ve ölümcül hastalığı sırasında bunu devredebilir. Yetki devri genel değilse, sağlıklı iken geçerli değildir, ancak ölümcül hastalığı sırasında geçerlidir, çünkü mütevelli vasiyetnameyi yerine getiren kişi konumundadır ve vasiyetnameyi yerine getiren kişi bunu başkasına vasiyet edebilir. Şafiîler şöyle demişlerdir: Eğer vakfedici gözetimi falanca kişiye vermiş ve dilediğine devretme yetkisine sahipse, yaygın görüşe göre devredilen gözetim sona erer. Ne vakfedici ne de devreden kişi devredeni görevden alamaz ve gözetim, devredenin ölümünden sonra ona geri dönmez, çünkü devretme mülkiyet devri gibidir. İkinci görüş, yani el-Subki'nin görüşü ise, devredenin devredenin bir temsilcisi olduğudur. Devreden ölürse gözetim ona geri döner, devreden ölürse gözetim devredene geri döner. Hanbeliler ise, vakıf kendisine aitse, atanan gözetmenin, doğuştan gelen yetkisi nedeniyle kendi adına bir temsilci atama ve görevden alma hakkına sahip olduğunu söylemişlerdir. Vakıf kendisine ait değilse, kendisine şart koşulmadıkça gözetmen atama veya gözetimi vasiyet etme hakkına sahip değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17693} Vakfın Sona Ermesi. Bir vakfın sona ermesinin bir yolu, vakfedilen mülkün, mülkün kullanılamaz, harap veya faydaya elverişsiz hale gelmesi nedeniyle veya vakfın amacının artık mevcut olmaması nedeniyle veya Maliki mezhebi tarafından izin verilen geçici bir vakıf durumunda, vakfı kuranın mülkiyetine geri dönmesidir. Bu konular araştırma kapsamında ele alınmıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17693}"
  id: "Dalam bahasa Arab, kata \"waqf\" berarti \"wakaf\" atau \"penyimpanan.\" Misalnya, seseorang dapat mengatakan, \"Saya mewakafkan rumah ini,\" yang berarti \"Saya mendedikasikannya di jalan Allah.\" Ini juga berkaitan dengan pencegahan dan ketenangan, dan merujuk pada harta yang diwakafkan itu sendiri. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579} Dalam terminologi hukum Islam, ada beberapa definisi: Menurut mazhab Hanafi, wakaf adalah dedikasi harta benda di bawah kepemilikan Allah Yang Maha Kuasa, dengan manfaatnya dibagikan kepada siapa pun yang dipilih, menurut dua sahabat (Abu Hanifa dan Abu Yusuf). Menurut Abu Hanifa, wakaf adalah dedikasi harta benda di bawah kepemilikan pemberi wakaf, dengan manfaatnya diberikan sebagai sedekah. Menurut mazhab Maliki, wakaf adalah pemberian manfaat sesuatu selama keberadaannya, dengan syarat bahwa hal itu tetap menjadi milik pemberi, meskipun hanya secara nominal. Menurut mazhab Syafi'i, wakaf adalah penyerahan harta benda yang dapat digunakan sementara substansinya tetap utuh, dengan hak untuk menggunakannya, untuk tujuan yang diperbolehkan dan ada. Menurut mazhab Hanbali, wakaf adalah penyerahan oleh pemilik dengan kebebasan mutlak untuk menggunakan harta bendanya yang dapat digunakan, dengan hasil penjualannya disalurkan untuk amal sebagai tindakan pengabdian kepada Tuhan. Istilah terkait: donasi (memberikan sesuatu secara sukarela tanpa imbalan, yang lebih luas daripada wakaf), amal (pengalihan kepemilikan selama masa hidup seseorang tanpa imbalan, dan dapat juga merujuk pada wakaf, seperti dalam hadits Umar tentang tanahnya), hadiah (hadiah tanpa imbalan), pinjaman (mengizinkan penggunaan suatu barang sementara kepemilikan tetap berada pada pemberi pinjaman), dan wasiat. Perbedaan antara wakaf dan hadiah adalah bahwa wakaf adalah pengalihan hak guna pakai sementara barang tersebut tetap menjadi milik Tuhan, sehingga tidak diperbolehkan untuk menggunakannya, sedangkan hadiah adalah pengalihan kepemilikan barang itu sendiri. Wasiat: Mazhab Hanafi mendefinisikannya sebagai pengalihan kepemilikan setelah kematian, dan mazhab Syafi'i mendefinisikannya serupa; Perbedaannya dengan wakaf adalah bahwa wasiat dibuat setelah kematian dan dapat berupa harta benda itu sendiri atau hasil penggunaannya, sedangkan wakaf adalah donasi yang dibuat selama masa hidup seseorang dan hanya dapat berupa hasil penggunaannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581} Keabsahan wakaf: Mayoritas ahli hukum berpendapat bahwa wakaf sah, mengikat, dan dianggap sebagai salah satu ibadah yang dianjurkan. Mereka mengutip sebagai bukti hadits Ibnu Umar tentang tanah Umar di Khaybar dan pernyataan Nabi kepadanya, \"Jika kamu mau, kamu dapat mewariskan harta asalnya dan memberikan hasilnya sebagai sedekah,\" dan hadits, \"Ketika seseorang meninggal, amal perbuatannya berhenti kecuali tiga hal...\" dan riwayat dari Jabir bahwa siapa pun di antara kaum Muhajirin dan Ansar yang memiliki harta harus mewariskannya; dan Ibnu Qudamah berkata bahwa ini adalah konsensus di antara para Sahabat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17582} Ibnu Abidin meriwayatkan dari Al-Is'af bahwa wakaf diperbolehkan menurut Abu Hanifa dan para pengikutnya, dan bahwa perbedaan pendapat terletak pada sifat mengikatnya. Menurut Abu Hanifa, wakaf diperbolehkan seperti pinjaman, dan tidak mengikat kecuali dengan keputusan hakim atau dilakukan dengan cara wasiat. Ibn Qudamah meriwayatkan dari Shurayh bahwa ia tidak menganggapnya diperbolehkan. {kutipan:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17582} Mengenai hukum kewajiban agama: prinsip dasarnya adalah bahwa itu adalah ibadah yang dianjurkan, dan dapat menjadi wajib jika dinazarkan, dan diperbolehkan jika dilakukan tanpa niat ibadah, seperti wakaf untuk non-Muslim, yang tidak mendapat pahala, dan diharamkan jika untuk tujuan yang berdosa, seperti gereja. Kitab tersebut menyatakan bahwa sebagian ulama Maliki mengatakan bahwa wakaf hanya untuk anak laki-laki, tidak termasuk anak perempuan, diharamkan karena menyerupai praktik pra-Islam, tetapi Ibn al-Qasim menganggapnya hanya tidak disukai dan diperbolehkan. Pilar-pilar wakaf, menurut mayoritas ulama (mazhab Maliki, Syafi'i, dan Hanbali), ada empat: pernyataan, pemberi wakaf, penerima wakaf, dan harta yang diwakafkan. Menurut mazhab Hanafi, hanya pernyataan yang merupakan pilar. Wakaf tidak sah tanpa persembahan, dan para ulama berbeda pendapat mengenai apakah penerimaan merupakan syarat sahnya wakaf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583} Rumus wakaf: apa yang menunjukkan niat pemberi wakaf melalui kata-kata, isyarat yang jelas, tulisan, atau tindakan. Kata-kata eksplisit menurut mazhab Maliki, Syafi'i, dan Hanbali adalah: “Aku mewakafkan,” dan juga “Aku mendedikasikannya” menurut mazhab Maliki, Hanbali, dan Syafi'i menurut pandangan yang benar, dan “Aku menjadikannya wakaf amal” menurut mazhab Syafi'i dan Hanbali menurut pandangan yang benar; dan wakaf tersebut menjadi sah tanpa tambahan apa pun karena kebiasaan yang berlaku, dan karena Nabi bersabda kepada Umar, “Jika kamu mau, kamu dapat mendedikasikan asalnya.” {kutipan:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17584} Metafora yang digunakan adalah kata “Aku memberikan sedekah”, kecuali jika ia menambahkannya pada entitas umum seperti fakir miskin dan bermaksud memberikan wakaf menurut sebagian mazhab Syafi'i. Demikian pula, “Aku menjadikannya haram” dan “Aku menjadikannya abadi” menurut mazhab Hanbali dan yang lebih tepat menurut mazhab Syafi'i. Wakaf tidak tercapai kecuali dengan menambahkan petunjuk kontekstual seperti mengatakan “sedekah yang diwakafkan” atau “sedekah yang tidak dijual, tidak diberikan, dan tidak diwariskan” atau niat dari wakaf tersebut. Jika wali amanat telah mengumpulkan cukup hasil dari wakaf untuk dibelanjakan pada tujuan amal, seperti membebaskan tahanan Muslim atau membantu pejuang yang terdampar, dan wakaf tersebut membutuhkan perbaikan, maka jika penundaan perbaikan hingga hasil tahun berikutnya tidak menyebabkan kerugian signifikan yang dapat mengakibatkan kehancuran wakaf, hasil tersebut harus dibelanjakan untuk tujuan amal dan perbaikan ditunda. Namun, jika penundaan perbaikan akan menyebabkan kerugian signifikan, hasil tersebut harus dibelanjakan terlebih dahulu untuk perbaikan, dan kemudian kelebihan dana dapat dibelanjakan untuk tujuan amal. Ibnu Nujaym menyatakan bahwa jika wali amanat membagikan hasil tersebut kepada para penerima manfaat dan ada kebutuhan pemeliharaan yang tidak dapat ditunda, ia bertanggung jawab, karena pemeliharaan dan pengeluaran wakaf dikecualikan dari hak-hak kaum miskin. Menurut mazhab Hanafi, jika pemeliharaan diperlukan, seperti meninggikan atap atau membangun tembok, maka hal itu didahulukan daripada semua pengeluaran lainnya. Hal ini karena tidaklah masuk akal jika masjid menjadi rusak demi apa yang diberikan kepada imam dan muazin. Jika ada surplus setelah pemeliharaan, maka harus diberikan kepada hal yang paling dekat dengan wakaf dan yang kehilangannya akan menyebabkan kerugian yang jelas. Jika pemeliharaan tidak diperlukan, sehingga penundaannya tidak akan menyebabkan kehancuran harta jika ditunda hingga panen tahun berikutnya, maka kebutuhan yang paling penting harus diutamakan. Mazhab Hanafi membedakan antara situasi di mana pemberi wakaf menetapkan pemeliharaan setiap tahun, dalam hal ini wali amanat menyimpan jumlah yang setara setiap tahun meskipun tidak dibutuhkan sekarang, dan situasi di mana pemberi wakaf tidak menyebutkan hal tersebut, dalam hal ini pemeliharaan tidak disimpan jika tidak dibutuhkan. Jika ada bagian dari bangunan wakaf atau peralatannya yang runtuh, penguasa harus mengalokasikan hasilnya untuk rekonstruksinya. Jika persiapan yang diperlukan untuk rekonstruksi sudah dilakukan, hasilnya harus digunakan untuk tujuan tersebut; jika tidak, hasilnya harus disimpan sampai persiapan tersebut dilakukan. Menurut mazhab Syafi'i, setiap surplus pendapatan masjid yang melebihi kebutuhannya harus disimpan jika masjid tersebut dibongkar. Dana yang tersisa harus digunakan untuk membeli properti yang akan diwakafkan, karena hal ini lebih kondusif untuk pelestariannya. Properti yang tidak dibeli dari wakaf yang ditujukan untuk pembangunan kembali masjid tidak boleh digunakan, karena wakaf tersebut didirikan oleh pendirinya untuk tujuan tersebut. Para ahli hukum berbeda pendapat mengenai sumber pendanaan untuk pemeliharaan dan perawatan wakaf. Mazhab Hanafi dan Maliki berpendapat bahwa pendanaan harus berasal dari hasil wakaf, baik yang ditentukan oleh pendirinya maupun tidak, karena wakaf adalah sedekah yang berkelanjutan di jalan Allah dan hanya dapat dipertahankan dengan cara ini. Mazhab Maliki menyatakan bahwa jika pendirinya menetapkan sebaliknya, maka ketentuan tersebut tidak sah. Jika seorang wakaf mewakafkan rumahnya untuk tempat tinggal anaknya, maka pemeliharaannya menjadi tanggung jawab orang yang berhak tinggal di sana, dari dana pribadinya sendiri, bukan dari hasil penjualan, karena bebannya sebanding dengan manfaatnya. Jika ia menolak atau tidak mampu melakukannya karena kemiskinan, hakim dapat menyewanya darinya atau orang lain dan memeliharanya dari uang sewa. Orang yang menolak tidak dapat dipaksa untuk memeliharanya, dan ini juga merupakan pendapat mazhab Maliki. Mazhab Maliki mengatakan bahwa kuda yang digunakan untuk peperangan harus dipelihara dari kas negara. Jika kas negara habis, maka harus dijual, dan hasilnya digunakan untuk membeli senjata dan barang-barang serupa yang tidak memerlukan pemeliharaan. Mazhab Syafi'i dan Hanbali berpendapat bahwa syarat-syarat yang ditetapkan oleh pemberi wakaf harus dipatuhi. Menurut mazhab Syafi'i, pemeliharaan, peralatan, dan perawatan harus disediakan dari sumber yang telah ditentukan, atau dari manfaat yang diperoleh dari wakaf itu sendiri, seperti penghasilan seorang budak atau pendapatan dari properti. Jika manfaatnya berhenti, pemeliharaan dan peralatan harus disediakan dari kas negara. Namun, perawatan tidak wajib bagi siapa pun, karena properti mirip dengan kepemilikan mutlak, tidak seperti hewan, karena pelestarian kehidupan dan kesuciannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663} Menurut mazhab Hanbali, masalah ini dikembalikan kepada kondisi pemberi wakaf. Jika ia menetapkan bahwa pengeluaran harus berasal dari hasil wakaf atau dari sumber lain, maka hal ini akan dilaksanakan. Jika ia tidak menentukan, dan harta wakaf tersebut berupa makhluk hidup seperti budak atau kuda, maka pengeluarannya berasal dari hasil penjualannya. Jika tidak ada hasil penjualannya, maka pengeluarannya menjadi tanggung jawab penerima wakaf yang ditentukan. Jika pengeluaran tidak memungkinkan karena ketidakmampuannya, maka harta tersebut dijual dan harganya digunakan untuk mendirikan wakaf lain. Jika memungkinkan untuk disewakan, maka disewakan sesuai dengan pengeluarannya. Jika wakaf tersebut untuk penerima yang tidak ditentukan seperti kaum fakir miskin, maka pengeluarannya berasal dari kas negara. Jika wakaf tersebut berupa properti atau sejenisnya, maka pemeliharaannya tidak wajib bagi siapa pun kecuali dengan syarat dari pemberi wakaf. Para ahli hukum berpendapat bahwa siapa pun yang melanggar wakaf dengan menghancurkannya atau dengan cara lain, bertanggung jawab. Menurut mazhab Hanafi, jika seseorang menyewakan harta wakaf dan penyewa menggunakan serambinya sebagai kandang hewan dan kemudian merusaknya, mereka bertanggung jawab karena bertindak tanpa izin. Menurut mazhab Maliki, siapa pun yang merusak wakaf karena pelanggaran wajib mengembalikannya ke keadaan semula, meskipun bagian yang rusak sudah lapuk. Pendapat yang berlaku di antara mereka adalah bahwa mereka bertanggung jawab atas nilainya, seperti harta benda rusak lainnya. Ini adalah pandangan yang dianut oleh Ibnu Arafah dan dipopulerkan oleh Iyad. Menurut mazhab Syafi'i, tidak ada tanggung jawab bagi seseorang yang kehilangan buku-buku yang diwakafkan untuk tujuan mencari ilmu saat berada dalam kepemilikannya, asalkan mereka tidak melakukan pelanggaran. Namun, jika mereka melakukan pelanggaran, mereka bertanggung jawab. Salah satu bentuk pelanggaran adalah menggunakan buku-buku tersebut untuk tujuan selain yang telah diwakafkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663} Jika wakaf membutuhkan pemeliharaan atau pengeluaran dan pendapatan tidak mencukupi, apakah diperbolehkan bagi wali amanat untuk meminjam dengan jaminan wakaf, dan apakah ia memerlukan izin? Mazhab Maliki, Hanbali, dan Hanafi (dalam satu pendapat) berpendapat bahwa diperbolehkan bagi wali amanat untuk melakukan hal tersebut tanpa izin penguasa, seperti semua tindakannya yang lain, karena ia dipercayakan dengan wewenang mutlak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} Mazhab Maliki mengatakan bahwa jika seseorang berjanji, setelah menerima jabatan wali amanat, untuk mengeluarkan uangnya sendiri untuk wakaf jika diperlukan, ia tidak wajib melakukannya, dan ia berhak untuk mendapatkan penggantian atas apa yang telah dikeluarkannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} Menurut mazhab Syafi'i, tidak diperbolehkan bagi wali amanat untuk meminjam tanpa syarat dari pemberi wakaf atau izin dari imam. Imam boleh meminjamkan kepada wali amanat dari kas negara, atau mengizinkannya untuk meminjam, atau mengeluarkan uangnya sendiri untuk pemeliharaan, asalkan ia mendapatkan penggantian. Jika seseorang meminjam tanpa izin atau ketentuan, hal itu tidak diperbolehkan, dan mereka tidak dapat diganti rugi atas apa yang telah mereka keluarkan karena pelanggaran mereka. Mazhab Hanafi berpendapat bahwa meminjam dengan jaminan wakaf hanya diperbolehkan untuk kepentingannya, seperti pemeliharaan atau pembelian benih. Hal itu diperbolehkan dengan dua syarat: izin hakim (jika hakim tidak ada, wali amanat harus meminjam sendiri), dan harta tersebut tidak boleh disewakan dan uang sewanya digunakan untuk pengeluaran. Ibnu Abidin menyatakan bahwa meminjam tidak diperbolehkan tanpa izin wali amanat, karena hutang pada awalnya hanya ditetapkan sebagai kewajiban pribadi, dan wakaf tidak memiliki kewajiban seperti itu. Meskipun orang miskin memiliki kewajiban, jumlah mereka yang besar membuat tidak mungkin untuk menuntut pembayaran dari mereka; oleh karena itu, hutang hanya ditetapkan terhadap wali amanat. {kutipan:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17664} Dan analogi tersebut dikesampingkan bila perlu. Pendapat yang lebih tepat menurut Abu al-Layth adalah bahwa meminjam diperbolehkan atas perintah hakim jika tidak ada alternatif lain selain meminjam dan hakim tersebut tidak jauh dari wali amanat, karena wewenangnya lebih luas dalam hal-hal yang menyangkut kepentingan umat Islam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} Adapun hal-hal yang tidak dapat dihindari, seperti pengeluaran untuk orang-orang yang berhak, meminjam untuk tujuan tersebut tidak diperbolehkan, kecuali untuk apa yang diberikan kepada imam, pendakwah, dan muazin, dan juga tikar dan minyak untuk masjid, menurut pendapat yang lebih tepat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} Jika izin hakim diperlukan, dan wali amanat mengaku memiliki izin, tampaknya hal itu tidak diterima kecuali dengan bukti, meskipun perkataannya diterima mengenai apa yang ada dalam kepemilikannya, karena ia ingin menuntut kembali hasilnya. Jika ia tidak meminta izin, maka dilarang baginya untuk mengambil dari hasil tersebut, karena ia dianggap bertindak secara sukarela kecuali jika izin diperoleh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} Ibn Abidin mengatakan bahwa jika wali amanat menggunakan uangnya sendiri untuk memperbaiki wakaf, ia berhak untuk menuntut kembali hasilnya. Dalam pendapat hukum al-Hanouti, dinyatakan bahwa ia berhak untuk menuntut kembali secara agama, tetapi klaimnya tidak diterima kecuali jika ia memberikan bukti bahwa ia menggunakannya dengan niat untuk menuntut kembali. Ini bergantung pada wakaf tersebut memiliki hasil; jika tidak, maka izin hakim diperlukan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} Kedua: Menjual harta wakaf dan menggantinya. Jika harta wakaf menjadi tidak dapat digunakan dan dalam keadaan tidak lagi bermanfaat, mazhab Hanafi, Maliki, Hanbali, dan Syafi'i (dalam satu pendapat) memperbolehkan penjualannya dan penggunaan hasil penjualannya untuk memperoleh harta serupa. Mazhab Hanafi memperbolehkan penjualan dan pertukaran meskipun harta wakaf tidak menjadi tidak dapat digunakan, tetapi dengan syarat-syarat tertentu. Mazhab Maliki umumnya membedakan antara harta tetap dan harta bergerak. Menurut mazhab Hanafi, pertukaran memiliki tiga bentuk. Syarat pertama adalah bahwa pemberi wakaf menetapkan untuk dirinya sendiri atau orang lain penggantian tanah yang diwakafkan dengan tanah lain pada saat wakaf diberikan. Ada dua bentuk dari hal ini: yang pertama adalah dengan mengatakan, “Tanah saya ini adalah wakaf amal yang didedikasikan kepada Allah untuk selamanya, dengan syarat saya menjualnya dan membeli sebidang tanah lain dengan hasil penjualan tersebut.” Sebidang tanah kedua kemudian menjadi wakaf dengan syarat yang sama seperti yang pertama. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} Abu Yusuf, Hilal, dan al-Khasaf berpendapat bahwa wakaf dengan syarat diperbolehkan berdasarkan preferensi hukum (istihsan), dan ini adalah pandangan yang benar menurut fatwa Qadi Khan, karena syarat ini tidak membatalkan wakaf. Wakaf dapat dipindahkan dari satu bidang tanah ke bidang tanah lain, dan bidang tanah kedua menggantikan bidang tanah pertama. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} Contohnya adalah jika seorang perampas tanah merebut tanah wakaf dan air meluapinya hingga menjadi laut dan tidak lagi cocok untuk pertanian, maka ia harus membayar nilainya dan membeli tanah lain yang akan menjadi wakaf dengan syarat yang sama seperti tanah wakaf pertama. Demikian pula, jika hasil panennya berkurang karena musibah dan hasil panennya tidak melebihi pengeluarannya, maka wakaf tersebut sah sebagai pengganti, sehingga diperbolehkan bagi pemberi wakaf untuk menetapkan wewenang untuk melakukan penggantian meskipun kebutuhan tersebut tidak ada pada saat itu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} Muhammad dan Yusuf ibn Khalid al-Samti mengatakan bahwa wakaf itu sah, tetapi syaratnya tidak sah, dan ini adalah pandangan yang benar. Al-Sarakhsi menjelaskan pernyataan Muhammad dengan mengatakan bahwa syarat ini tidak mencegah wakaf untuk dibatalkan, sehingga wakaf tetap sah, dan penggantian tetap menjadi syarat yang tidak sah dan batal dengan sendirinya, seperti masjid jika penggantian ditetapkan di dalamnya, atau jika ditetapkan bahwa sebagian orang boleh shalat di dalamnya dan sebagian lainnya tidak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} Sebagian ahli fiqih Hanafi mengatakan bahwa baik wakaf maupun syaratnya tidak sah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} Kamal ibn al-Humam meriwayatkan dari al-Ansari bahwa syarat tersebut sah, tetapi tanah tersebut tidak dapat dijual kecuali dengan izin penguasa. Jika masalah tersebut diajukan kepada penguasa dan tidak ada manfaat dalam wakaf tersebut, ia harus mengizinkan penjualannya jika ia melihatnya sebagai kepentingan terbaik para penerima wakaf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} Jika pemberi wakaf menetapkan bahwa tanah tersebut dijual dan hasil penjualannya digunakan untuk membeli sebidang tanah lain, tanpa menambahkan apa pun lagi, maka hal itu sah menurut prinsip istihsan (preferensi hukum). Sebidang tanah kedua kemudian akan menjadi wakaf dengan syarat yang sama seperti yang pertama, tanpa memerlukan pembaruan wakaf, karena tanah tersebut telah ditetapkan untuk wakaf, dan harganya akan tetap sama. Penalaran analogis akan menganggapnya tidak sah, karena pemberi wakaf tidak menetapkan pendirian sebidang tanah lain sebagai pengganti tanah pertama. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} Skenario kedua: Jika pemberi wakaf menetapkan bahwa wali amanat dapat mengganti tanah tersebut, tetapi tidak menetapkan hak ini untuk dirinya sendiri, maka ia dapat menggantinya sendiri, karena pemberian perwalian kepada orang lain bergantung pada kepemilikan tanah tersebut oleh wali amanat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} Jika syarat pertukaran adalah untuk orang lain dengan dirinya sendiri, maka pemberi wakaf sendirilah yang memiliki pertukaran tersebut dan orang lain tidak memilikinya sendiri. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} Jika syarat penggantian diperbolehkan, meskipun harta tersebut menghasilkan pendapatan dan manfaat, karena tidak perlu wakaf tersebut berhenti digunakan, atau hakim harus memerintahkannya, atau tidak ada pendapatan untuk menggunakannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} Mazhab Hanafi membatasi penggantian pada apa yang ditetapkan oleh pemberi wakaf dalam hal kuantitas dan jenis; Jika syarat penggantian adalah untuk tanah, tidak diperbolehkan mengganti dengan rumah. Jika syaratnya adalah untuk tanah desa, tidak diperbolehkan mengganti dengan apa pun, karena biaya dan kegunaan tanah desa yang bervariasi. Jika tidak ada penggantian khusus yang ditetapkan, maka pemilik dapat mengganti tanah, rumah, atau desa apa pun yang sejenis dengan real estat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} Jika penggantian distipulasikan, maka pemilik tidak boleh mengganti bidang tanah kedua dengan bidang tanah ketiga, karena syarat tersebut hanya berlaku untuk bidang tanah pertama, kecuali ada pernyataan yang dibuat untuk itu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} Skenario kedua: Pemberi wakaf tidak menstipulasikan penggantian pada saat pemberian wakaf, baik ia tidak menstipulasikan penggantian atau tetap diam, tetapi wakaf tersebut menjadi sama sekali tidak dapat digunakan, tidak memberikan manfaat atau gagal menutupi pengeluarannya. Dalam hal ini, penggantian diperbolehkan menurut pendapat yang paling tepat, asalkan dengan izin hakim dan hakim menganggapnya bermanfaat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} Ibn Abidin mengutip Al-Bahr yang mengatakan bahwa pernyataan Qadi Khan berbeda-beda. Dalam satu kasus, ia memperbolehkan hakim untuk menukar harta wakaf tanpa syarat apa pun yang ditetapkan oleh pemberi wakaf, kapan pun ia menganggapnya demi kepentingan terbaik. Dalam kasus lain, ia melarang hal ini, bahkan jika tanah tersebut menjadi tidak dapat digunakan. Pandangan yang diterima adalah bahwa hakim dapat menukar harta tersebut dengan syarat-syarat berikut: a) Harta wakaf harus menjadi benar-benar tidak dapat digunakan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} Di antara syarat-syarat untuk pertukaran menurut mazhab Hanafi, sebagaimana yang mereka sebutkan, adalah bahwa penjualan tidak boleh dilakukan dengan harga yang sangat tidak adil, bahwa wakaf tersebut memiliki pendapatan yang dapat digunakan untuk pemeliharaannya, dan bahwa orang yang menukar harta tersebut dianggap berilmu dan saleh, agar tidak menyebabkan pembatalan wakaf Muslim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} Pertukaran harus berupa harta benda, bukan dirham atau dinar, dan tidak boleh dijual kepada seseorang yang kesaksiannya tidak diterima untuk kepentingannya atau kepada seseorang yang berhutang kepadanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} Pertukaran dan harta yang ditukar harus sejenis. Ibn Abidin, mengutip Qanali Zadeh, mengatakan bahwa tampaknya kesatuan jenis bukanlah syarat untuk harta yang diwakafkan untuk keuntungan, karena pertimbangannya adalah banyaknya pendapatan dan sedikitnya biaya pemeliharaan dan pengeluaran. Jadi, jika toko ditukar dengan tanah yang ditanami dan menghasilkan pendapatan yang sama dengan sewa toko, itu akan lebih baik. Adapun harta yang diwakafkan untuk tempat tinggal, tujuannya adalah untuk mendapatkan manfaat dari tempat tinggal tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} Dalam al-Qunya, disebutkan bahwa pertukaran harta wakaf dengan harta lain diperbolehkan jika keduanya berada di lingkungan yang sama atau di lingkungan yang lebih baik. Namun, tidak diperbolehkan dalam kasus sebaliknya, meskipun harta tersebut lebih besar dalam luas, nilai, dan sewa, karena kemungkinan kerusakan di lingkungan yang nilainya lebih rendah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} Buku ini mengutip dari komentar puisi Ibn Wahban dalam al-Bahr al-Ra'iq sebuah pertanyaan: Apakah penggantian diperbolehkan jika pendiri wakaf menetapkan sebaliknya, atau jika pengelola diberhentikan sebelum penggantian? Al-Tarsusi menyatakan bahwa tidak ada preseden untuk ini, dan bahwa prinsip-prinsip yang telah ditetapkan dalam mazhab tersebut memperbolehkan hakim untuk melakukan penggantian jika ia menganggapnya demi kepentingan terbaik. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} Diriwayatkan dari Muhammad bahwa jika tanah wakaf menjadi terlalu lemah untuk dieksploitasi, dan wali amanat menemukan tanah lain yang lebih menguntungkan dengan harga yang sama, maka diperbolehkan baginya untuk menjualnya dan membeli yang lebih menguntungkan. Sebagian ulama melarang penjualan dan pertukaran, baik wakaf tersebut tidak aktif atau aktif. Qadi Khan mengatakan bahwa wakaf yang tidak dibatasi, yaitu wakaf yang tidak menyebutkan syarat pertukaran, tidak diperbolehkan untuk dijual atau ditukar, bahkan jika tanahnya berupa rawa garam dan tidak dapat dimanfaatkan, karena sifat wakaf adalah abadi dan tidak untuk dijual, dan hak pertukaran hanya ditetapkan oleh syarat tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} Skenario ketiga: Pemberi wakaf tidak mensyaratkan penggantian, dan wakaf tersebut menghasilkan pendapatan dan keuntungan serta tidak pasif, tetapi menggantinya akan bermanfaat secara keseluruhan, dan penggantinya akan lebih baik dalam hal manfaat dan pendapatan. Ibn Abidin mengatakan bahwa penggantian ini tidak diperbolehkan menurut pendapat yang paling benar dan lebih disukai, sebagaimana dijelaskan oleh Qanali Zadeh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} Ibn Abidin mengutip dari Al-Ashbah bahwa mengganti harta yang dihuni tidak diperbolehkan kecuali dalam empat kasus: Pertama, jika pemberi wakaf mensyaratkan penggantian; Kasus kedua adalah jika seorang perampas merebutnya dan mengalihkan air ke atasnya hingga menjadi laut, dalam hal ini ia bertanggung jawab atas nilainya, dan wali amanat membeli tanah sebagai penggantinya dengan uang tersebut; Kasus ketiga adalah jika perampas menyangkal kepemilikan dan tidak ada bukti, dan ia ingin membayar nilainya, maka wali amanat dapat mengambilnya untuk membeli pengganti. Kasus keempat adalah jika seseorang menginginkannya untuk pengganti yang lebih menguntungkan dan berlokasi lebih baik, maka hal itu diperbolehkan menurut Abu Yusuf, dan inilah pendapat yang menjadi dasar fatwa tersebut. Penulis Al-Nahr mengatakan bahwa hal ini bertentangan dengan pernyataan Sadr al-Shari'ah: Kami tidak mengeluarkan fatwa berdasarkan pendapat Abu Yusuf. {kutip:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17669} Penggantian wakaf menurut mazhab Maliki. Mazhab Maliki membedakan antara harta benda tetap dan harta benda bergerak dalam penjualan dan penggantian. Mereka memperbolehkan penggantian harta bergerak jika tidak ada entitas yang memeliharanya dan ada kekhawatiran akan kehancurannya, atau jika manfaatnya telah hilang dan tidak dapat lagi digunakan untuk tujuan yang telah ditetapkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} Seekor kuda yang dipersembahkan untuk tujuan Allah, seperti untuk ekspedisi militer atau untuk menjaga perbatasan, harus dipelihara oleh kas negara. Jika kas negara habis, maka dijual, dan penggantinya diberikan senjata atau barang serupa yang tidak memerlukan perawatan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} Setiap wakaf bergerak yang tidak lagi dapat digunakan, seperti kuda yang terinfeksi rabies, pakaian yang sudah usang, budak yang sudah tua, atau buku-buku yang sudah rusak, harus dijual. Hasil penjualan tersebut akan digunakan untuk membeli barang serupa jika memungkinkan, atau sebagian darinya jika pembelian seluruh barang tidak memungkinkan. Jika hal ini pun tidak memungkinkan, hasil penjualan tersebut akan diberikan sebagai sedekah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} Ini termasuk hewan jantan yang ditujukan untuk peperangan atau perkembangbiakan. Jika jumlahnya melebihi kebutuhan, atau jika hewan betina sudah terlalu tua untuk bermanfaat, mereka dapat dijual, dan hasilnya digunakan untuk membeli hewan betina muda guna memastikan keberlanjutan manfaat. Hewan betina ini kemudian tetap ditetapkan sebagai wakaf, sama seperti pemilik aslinya, sebagaimana disebutkan oleh Al-Dardir mengenai burung unta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} Adapun harta benda, mazhab Maliki berpendapat bahwa harta benda tidak dapat dijual, meskipun sudah rusak dan tidak dapat digunakan, baik itu rumah, toko, atau apa pun. Harta benda juga tidak dapat diganti dengan sesuatu yang serupa yang tidak rusak. Abu al-Faraj meriwayatkan dari Malik bahwa jika Imam menganggap penjualan itu menguntungkan, hasil penjualan dapat digunakan untuk membeli sesuatu yang serupa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} Sebagian dari mereka memperbolehkan pertukaran bagian yang rusak, sebagaimana Al-Taj wal-Iklil meriwayatkan larangan menjual bagian yang rusak dari wakaf, dan Ibn Al-Jahm menjelaskan bahwa ada seseorang yang dapat memperbaikinya dengan menyewakannya selama bertahun-tahun dan akan kembali seperti semula, dan ada perbedaan pendapat tentang pertukaran bagian yang rusak dengan bagian yang tidak rusak; dan Ibn Rushd berkata: Jika manfaat dari bagian tersebut telah benar-benar berhenti dan dia tidak mampu memperbaikinya dan menyewakannya, maka tidak ada salahnya menukarkannya dengan tempat yang akan menjadi wakaf penggantinya, dengan keputusan hakim setelah alasannya terbukti dan manfaat bagi pihak yang diberi kompensasi telah terwujud, dan itu dicatat dan disaksikan. Mazhab Maliki memperbolehkan penjualan properti jika diperlukan untuk memperluas masjid jami, baik wakaf tersebut ditujukan untuk penerima manfaat tertentu atau tidak. Ibn Rushd menyatakan bahwa makna yang tampak dari riwayat Ibn al-Qasim adalah bahwa hal ini diperbolehkan di masjid mana pun. Sahnun, dan dalam riwayat langka yang dinisbahkan kepada Malik dan lainnya, mengatakan bahwa ini berlaku untuk masjid berjamaah jika diperlukan, tetapi tidak untuk masjid untuk kelompok yang lebih kecil, karena kebutuhan di masjid-masjid tersebut tidak sama dengan di masjid berjamaah. Diperbolehkan juga untuk menjual wakaf untuk memperluas pemakaman atau jalan umum, bahkan bertentangan dengan keinginan para penerima wakaf atau pengelola. Para penerima wakaf kemudian harus menggunakan hasil penjualan tersebut untuk mendirikan wakaf lain, dan hakim tidak dapat memaksa mereka untuk melakukannya. Komentar yang lebih kecil menyatakan bahwa nilai tanah yang diperluas yang digunakan untuk membangun masjid harus dibayarkan jika tanah tersebut ditetapkan sebagai wakaf untuk penerima wakaf tertentu. Namun, jika wakaf tersebut ditujukan untuk tujuan umum, seperti untuk kaum fakir miskin, maka tidak diperlukan kompensasi, karena tidak ada penerima manfaat khusus yang berhak atasnya, dan karena pahala yang diterima oleh pemberi wakaf atas perluasan masjid lebih besar daripada niat awalnya. Mazhab Maliki menyatakan bahwa jika pemberi wakaf menetapkan perubahan atau penggantian, syaratnya harus dipenuhi. Namun, jika ia menetapkan bahwa jika ditemukan harga yang diinginkan, tanah tersebut akan dijual dan dibeli yang lain, teks-teks langka dan tidak biasa menyebutkan bahwa hal ini tidak diperbolehkan. Jika perubahan atau penggantian tersebut terjadi, maka hal itu sah dan syaratnya terpenuhi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} Fath al-Ali al-Malik melaporkan kejadian berikut: Tanah diwakafkan untuk jalan umum di jalan Muslim. Pemberi wakaf menetapkan bahwa tanah tersebut tidak boleh dijual atau ditukar. Kemudian, pengelola wakaf menukarkannya dengan tanah milik Diwan (kantor pemerintahan). Al-Dardir menyatakan bahwa pertukaran tersebut tidak sah karena pemberi wakaf telah menetapkan bahwa tidak diperbolehkan adanya pertukaran dan bersifat tanpa syarat. Pengelola harus mengembalikan tanah Diwan kepada pemiliknya dan mengambil kembali tanah wakaf itu sendiri. Siapa pun yang menolak harus ditegur oleh hakim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} Mazhab Syafi'i memperbolehkan pertukaran tanah wakaf. Disebutkan dalam kitab al-Muhadhdhab bahwa jika seseorang mewakafkan sebuah masjid dan tempat tersebut menjadi rusak dan salat berhenti dilakukan di sana, maka kepemilikannya tidak kembali, dan tidak diperbolehkan untuk menjualnya, karena apa yang telah diambil dari kepemilikannya karena hak Allah Yang Maha Kuasa tidak akan kembali menjadi kepemilikannya karena kerusakan, seperti seseorang yang membebaskan seorang budak dan kemudian budak tersebut menjadi sakit. {kutipan:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17671} Al-Shirbini mengatakan bahwa pandangan yang paling tepat adalah diperbolehkan menjual sajadah masjid yang diwakafkan jika sudah usang, dan balok-baloknya jika patah atau hampir patah dan hanya layak dibakar, agar tidak hilang dan tempat tersebut menjadi terlalu sempit. Mendapatkan sebagian kecil dari harga wakaf lebih baik daripada kehilangannya, dan ini tidak termasuk dalam penjualan wakaf karena barang-barang tersebut telah menjadi seolah-olah tidak ada. Inilah yang diikuti oleh kedua syekh tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} Al-Rafi’i berkata bahwa analoginya adalah harga tikar harus digunakan untuk membeli tikar dan tidak untuk hal lain. Al-Adhra’i berkata bahwa yang dimaksud dengan ini adalah tempat jerami di lumpur; Adapun kayu yang cocok untuk tujuan selain pembakaran, seperti papan dan pintu, tidak dijual per potong. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672} Jika ada kekhawatiran bahwa sebuah masjid akan runtuh, maka masjid tersebut harus dihancurkan, dan penguasa harus membangun masjid lain di tempatnya jika ia menganggapnya perlu. Membangunnya di dekatnya lebih baik, dan sumur tidak boleh dibangun di atasnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672} Jika wakaf didirikan di atas jembatan, dan lembah terbakar sehingga jembatan tidak dapat digunakan, maka diperbolehkan untuk memindahkannya ke tempat yang membutuhkan. Pendapatan dari wakaf pos perbatasan, jika keamanan di sana dipulihkan, harus disimpan oleh pengelola jika pos tersebut kembali menjadi pos perbatasan. Jika seseorang mewakafkan pohon kurma dan pohon itu layu, atau hewan dan hewan itu sakit kronis, atau batang pohon untuk masjid dan batang pohon itu patah, ada dua pendapat: pendapat yang lebih tepat adalah bahwa menjualnya tidak diperbolehkan, seperti halnya masjid; pendapat kedua adalah bahwa hal itu diperbolehkan karena tidak ada keuntungan yang diharapkan darinya. Jika penjualan diperbolehkan, maka hukum tentang harganya sama dengan hukum tentang nilai yang akan ditemukan dari kehancuran wakaf tersebut. Jika dikatakan bahwa kepemilikan barang wakaf tersebut adalah milik penerima wakaf, maka harga tersebut adalah miliknya. Jika dikatakan bahwa itu milik Allah Yang Maha Kuasa, yang merupakan pandangan yang lebih jelas, maka nilai setaranya harus dibeli untuk dijadikan wakaf pengganti. Abu Hamid al-Isfarayini mengatakan bahwa harga tersebut harus digunakan untuk membeli nilai setaranya untuk dijadikan wakaf pengganti, tanpa ada perselisihan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672} Penggantian wakaf menurut mazhab Hanbali. Mereka memperbolehkan penggantian jika wakaf tersebut tidak lagi sesuai dengan tujuan atau manfaatnya, baik itu harta bergerak maupun tidak bergerak, masjid atau lainnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} Menjual wakaf adalah haram dan tidak sah, dan memindahkannya, bahkan ke wakaf yang lebih baik, tidak diperbolehkan menurut teks tersebut, kecuali jika manfaat yang dimaksudkan hilang karena kerusakan dan tidak ada pendapatan untuk memperbaikinya, dalam hal ini wakaf tersebut boleh dijual, atau manfaatnya hilang tanpa kerusakan, seperti kayu yang sudah lapuk dan berisiko roboh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} Jika wakaf berupa masjid dan manfaat yang dimaksudkan hilang karena ukurannya yang kecil bagi penghuninya, dan perluasannya tidak mungkin dilakukan, atau karena kerusakan daerah sekitarnya, atau karena tempat tersebut najis dan menghalangi shalat di dalamnya, maka hakim mengatakan bahwa diperbolehkan untuk menjualnya dan menggunakan hasilnya untuk membeli sesuatu yang serupa, karena membiarkannya dalam keadaan seperti itu adalah pemborosan uang, dan tujuannya hanya dipertahankan dalam aset lain, dan hubungan pengganti diperlakukan seperti aset aslinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} Diperbolehkan menjual pohon wakaf yang telah kering, dan batang wakaf yang telah patah atau lapuk, atau dikhawatirkan akan patah atau roboh; Dan beliau berkata dalam ringkasannya: Jika badan wakaf hampir rusak, atau bangunannya hampir runtuh, dan diketahui bahwa jika ditunda maka akan kehilangan manfaatnya, maka wakaf tersebut dijual dengan mempertimbangkan nilai finansialnya; Sekolah, asrama, dan karavanserai, jika rusak, dapat dijual menurut satu pendapat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} Seekor kuda yang diperuntukkan untuk ekspedisi militer, jika tidak lagi layak untuk tujuan tersebut, dapat dijual, dan kuda yang sesuai dapat dibeli dengan hasil penjualan. Setelah pengganti dibeli, maka wakaf tersebut menjadi wakaf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} Syarat yang ditetapkan oleh pemberi wakaf yang melarang penjualan adalah tidak sah. Hakim bertanggung jawab atas penjualan jika wakaf tersebut untuk tujuan amal seperti fakir miskin, masjid, dan jembatan. Administrator yang ditunjuk bertanggung jawab jika wakaf tersebut ditujukan untuk orang atau kelompok tertentu. Namun, lebih bijaksana untuk tidak melanjutkan tanpa izin hakim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} Jika properti pengganti dibeli untuk tujuan mendirikan wakaf, maka properti tersebut menjadi wakaf. Namun, disarankan untuk mendirikan wakaf dengan akta baru untuk mencegah pembatalannya oleh mereka yang tidak mengakui statusnya sebagai wakaf hanya dengan pembelian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} Pengembalian wakaf kepada pemilik wakaf. Muhammad ibn al-Hasan, dari mazhab Hanafi, berpendapat bahwa jika daerah sekitar masjid hancur dan tidak lagi dibutuhkan, meskipun masjid itu sendiri masih dihuni, atau jika masjid hancur dan tidak ada cara untuk membangunnya kembali, dan tidak lagi dibutuhkan dengan membangun masjid lain, maka harta tersebut kembali menjadi milik pembangun jika ia masih hidup, dan kepada ahli warisnya jika ia telah meninggal, bertentangan dengan pendapat Abu Yusuf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} Muhammad menjelaskan hal ini dengan mengatakan bahwa pemberi wakaf menetapkan wakaf untuk suatu ibadah tertentu, dan karena ibadah tersebut telah berhenti, wakaf itu sendiri pun berhenti ada. Ini seperti tikar dan rumput masjid ketika tidak lagi dibutuhkan, atau lampu masjid ketika masjid hancur; Harta wakaf tersebut kembali menjadi milik orang yang menyediakannya, seperti kain kafan yang jika dimakan binatang buas, kembali menjadi milik pemiliknya, dan seperti hewan kurban yang dipersembahkan untuk haji ketika halangan dihilangkan dan jamaah haji dapat melaksanakan haji. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} Menurut Abu Yusuf, harta wakaf tersebut dipindahkan ke masjid lain dengan izin hakim, dan sisa-sisanya dijual dengan izinnya, dengan hasil penjualan diberikan kepada masjid-masjid lain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} Salah satu cabang dari perbedaan pendapat ini adalah jika suatu wakaf runtuh dan tidak memiliki pendapatan untuk memperbaikinya, maka wakaf tersebut kembali menjadi milik pendirinya atau ahli warisnya menurut Muhammad. Namun, menurut Muhammad, hanya apa yang sama sekali tidak lagi digunakan untuk kepentingan yang dimaksudkan oleh pemberi wakaf yang kembali menjadi milik pemiliknya, seperti toko yang terbakar dan tidak dapat disewakan. Apa yang dimaksudkan untuk menghasilkan pendapatan tidak kembali kepada pemiliknya kecuali reruntuhannya, dan halamannya tetap menjadi wakaf yang dapat disewakan, bahkan dengan harga yang kecil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} Mazhab Syafi'i, berbeda dengan pendapat yang lebih tepat, mengatakan bahwa jika manfaat wakaf terganggu karena sebab yang tidak pasti, seperti pohon yang mengering atau tercabut oleh angin atau banjir, dan tidak dapat dikembalikan ke tempat asalnya sebelum mengering, maka wakaf tersebut berakhir dan kembali menjadi milik pemberi wakaf atau ahli warisnya. Namun, pendapat yang lebih tepat di antara mereka adalah bahwa wakaf tersebut tidak kembali menjadi milik pribadi tetapi tetap menjadi wakaf. Hukumnya sama menurut mazhab Hanbali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675} Pengawasan wakaf. Para ahli fiqih sepakat bahwa pengawasan wakaf mengikuti syarat pemberi wakaf. Jika ia menetapkan pengawasan untuk orang tertentu, maka syaratnya diikuti, seperti yang dilakukan Umar ibn al-Khattab ketika ia membuat wakaf untuk putrinya Hafsa agar dikelola selama ia hidup, kemudian untuk orang-orang yang bijaksana dari keluarganya, sebagaimana diriwayatkan oleh Ibn Qudamah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675} Mereka berbeda pendapat jika pemberi wakaf menetapkan pengawasan untuk dirinya sendiri: Menurut mazhab Hanafi, Syafi'i, dan Hanbali, hal ini diperbolehkan. Adapun mazhab Maliki, jika penerima wakaf tidak mengambil alih wakaf, maka wakaf tersebut batal karena wafatnya pemberi wakaf, sakitnya, atau kebangkrutannya. Jika penerima wakaf mengambil alih wakaf dan pemberi wakaf menetapkan pengawasan untuk dirinya sendiri, maka wakaf tersebut sah, dan pemberi wakaf wajib menunjuk orang lain sebagai pengawas, karena tidak diperbolehkan baginya untuk melakukan pengawasan sendiri. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675} Jika pemberi wakaf tidak menetapkan pengawas, maka menurut mazhab Maliki dan Hanbali: Jika wakaf ditujukan untuk penerima yang tidak ditentukan, seperti fakir miskin, orang yang membutuhkan, atau masjid, penguasa menunjuk siapa pun yang diinginkannya, karena ia tidak dapat mengawasinya secara pribadi. Jika wakaf tersebut ditujukan untuk penerima manfaat tertentu yang cakap, maka dialah yang mengelola urusannya, karena itu adalah hartanya dan manfaatnya untuknya, sehingga pengawasannya sama seperti kepemilikan mutlaknya. Jika ia tidak cakap, walinya yang mengelola urusannya. Dan ada kemungkinan di kalangan mazhab Hanbali, yang dipilih oleh Ibnu Abi Musa, bahwa penguasa yang seharusnya mengawasinya. {kutip:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17675} Di kalangan mazhab Hanafi, terdapat perbedaan pendapat mengenai kewenangan mengelola wakaf jika pendirinya tidak menetapkannya. Menurut Abu Yusuf, yang merupakan pandangan asli, kewenangan tersebut berada pada pendirinya, kemudian pada wali yang ditunjuknya jika ia memilikinya, jika tidak, pada hakim. Menurut Hilal, yang tampaknya merupakan pandangan mazhab tersebut, wakaf tersebut dimiliki oleh pendiri, kemudian oleh wali yang ditunjuknya atau oleh hakim, karena wali amanat hanya memperoleh wewenang dari pendiri berdasarkan ketentuan yang dibuatnya, sehingga tidak mungkin baginya untuk memiliki wewenang sementara orang lain memperolehnya darinya. Lebih lanjut, pendiri adalah orang yang paling dekat dengan wakaf dan oleh karena itu lebih berhak atas pengelolaannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} Menurut Muhammad, pendiri tidak memiliki wewenang kecuali jika ia menetapkannya, karena, menurut pandangannya, penyerahan wakaf kepada wali amanat adalah syarat sahnya wakaf tersebut. Setelah wali amanat diserahkan, pendiri tidak lagi memiliki wewenang atasnya. Jika pemberi wakaf meninggal tanpa menunjuk wali amanat, hakim akan menunjuk wali amanat dari keluarga pemberi wakaf, dengan syarat tidak ditemukan orang yang cocok. Hal ini karena hakim lebih berbelas kasih atau karena pemberi wakaf bermaksud agar wakaf tersebut dikaitkan kepadanya. Jika tidak ditemukan orang yang cocok, maka orang yang cocok dari luar keluarga dapat ditunjuk. Menurut mazhab Syafi'i, jika pemberi wakaf tidak menetapkan wali amanat, hakim berwenang untuk mengawasi wakaf tersebut, karena ia memiliki wewenang pengawasan umum. Ada juga pendapat yang mengatakan bahwa perwalian tersebut menjadi tanggung jawab pemberi wakaf, karena wakaf tersebut awalnya miliknya, dan dengan demikian tetap berada di bawah kendalinya. Pendapat lain adalah bahwa perwalian tersebut menjadi tanggung jawab penerima manfaat, karena hasil wakaf tersebut adalah miliknya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} Syarat-syarat untuk Pengawas. Para ahli hukum menetapkan syarat-syarat untuk kesesuaian seorang pengawas, beberapa di antaranya disepakati dan beberapa lainnya berbeda pendapat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} Syarat pertama: Kapasitas hukum. Para ahli hukum sepakat bahwa pengawas harus dewasa dan berakal sehat. Oleh karena itu, penunjukan anak di bawah umur atau orang gila tidak sah karena kurangnya kapasitas hukum, secara umum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} Menurut mazhab Maliki dan Hanbali, jika pemberi wakaf tidak menetapkan administrator tertentu, dan penerima wakaf ditentukan, seperti Zayd atau Amr, maka administrator itu sendiri yang mengelola wakaf. Jika ia masih di bawah umur atau gila, maka walinya bertindak atas namanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} Mazhab Hanbali mengatakan bahwa kepemilikan harta wakaf beralih kepada penerima jika ia adalah individu tertentu atau kelompok terbatas. Pengelola mengawasi wakaf jika ia berakal sehat dan memiliki kapasitas hukum, atau walinya jika ia masih di bawah umur, gila, atau bodoh. Ibn Abi Musa mengatakan bahwa hakim yang mengawasinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} Menurut mazhab Hanafi, Ibn Abidin mengutip dari al-Is'af bahwa menunjuk anak di bawah umur sebagai pengelola adalah tidak sah menurut analogi dalam semua kasus, dan menurut preferensi hukum, hal itu tidak sah selama anak di bawah umur tersebut masih di bawah umur. Setelah anak di bawah umur tersebut mencapai usia dewasa, pengelola berhak atas perwalian. Al-Shalabi mengatakan bahwa pemberian perwalian kepada anak di bawah umur tidak pernah sah, karena pengawasan adalah bentuk perwalian, dan anak di bawah umur sudah berada di bawah perwalian dan tidak dapat diangkat atas orang lain. {kutipan:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17677} Ibn Abidin, dalam fatwanya tentang Rashid al-Din, berpendapat bahwa jika seorang hakim mendelegasikan perwalian kepada anak di bawah umur, hal itu diperbolehkan jika anak di bawah umur tersebut mampu mengelola urusan. Ia menafsirkan apa yang ada dalam al-Is'af sebagai merujuk kepada seseorang yang tidak mampu mengelola urusan. {kutipan:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17677} Sebagaimana kegilaan mencegah pengangkatan pada awalnya, hal itu juga mencegahnya dalam kelanjutannya. Jika administrator menjadi gila, ia dicopot dari jabatannya. Ibn Abidin mengutip Al-Fath yang mengatakan bahwa pengawas diberhentikan karena kegilaan terus-menerus selama setahun atau kurang. Jika ia sembuh, pengawasan dikembalikan. Beliau mengatakan dalam Al-Nahr bahwa ini berlaku untuk orang yang pengawasannya telah ditentukan, tetapi tidak untuk orang yang ditunjuk oleh hakim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} Mazhab Syafi'i menetapkan bahwa gangguan jiwa menghilangkan wewenang pengawasan. Al-Shubramalsi mengatakan bahwa jika orang yang mengalami gangguan jiwa tersebut sembuh, pengawasan akan dipulihkan setelah sembuh jika hal itu telah ditentukan oleh pemberi wakaf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} Syarat kedua: keadilan. Diperlukan bahwa pengawas wakaf harus adil, dan ada detail mengenai hal ini. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} Mazhab Hanafi berbeda pendapat mengenai apakah itu merupakan syarat sah atau syarat prioritas; Hakim mengatakan bahwa hanya orang yang dapat dipercaya dan cakap, baik secara pribadi maupun melalui wakil, yang boleh diangkat, karena tidak pantas mengangkat seorang pengkhianat. Ibnu Abidin berpendapat bahwa integritas adalah syarat prioritas, bukan syarat sah, dan bahwa jika seorang wali amanat menjadi korup, ia pantas diberhentikan tetapi tidak dapat dipecat, sama seperti hakim jika ia menjadi korup. Menurut mazhab Maliki, integritas dianggap penting jika wali amanat diangkat oleh hakim atau pemberi wakaf. Wali amanat wakaf adalah milik siapa pun yang diangkat oleh pemberi wakaf, seseorang yang ketakwaan dan kepercayaannya dapat diandalkan. Jika wali amanat dikelola dengan buruk dan tidak dapat dipercaya, hakim akan memberhentikannya, kecuali jika penerima wakaf mengendalikan urusannya sendiri dan menerimanya. Al-Qarafi menyatakan bahwa hakim tidak akan memberhentikan seorang wali amanat kecuali karena pelanggaran ringan, dan pemberi wakaf dapat memberhentikannya bahkan tanpa pelanggaran ringan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} Menurut mazhab Syafi'i, keadilan lahiriah dan batiniah diperlukan pada orang yang diangkat oleh penguasa. Al-Subki mengatakan bahwa keadilan lahiriah sudah cukup pada orang yang diangkat oleh pemberi wakaf. Al-Adhra'i mengatakan bahwa keadilan lahiriah dan batiniah juga diperlukan padanya. Al-Shirbini lebih memilih pendapat pertama. Jika wali amanat menjadi korup, ia dicopot, dan perwalian dialihkan kepada penguasa. {kutip:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17678} Mazhab Syafi'i mengatakan bahwa jika wali amanat menjadi korup dan kemudian menjadi saleh, perwalian dikembalikan kepadanya jika hal itu telah ditetapkan dalam wakaf awal dan dinyatakan secara eksplisit; jika tidak, maka tidak. Ini adalah fatwa al-Nawawi. {kutip:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17679} Mazhab Hanbali mengatakan bahwa jika perwalian diberikan kepada orang selain penerima wakaf, dan perwalian tersebut berasal dari penguasa, atau dari wali amanat awal, maka kesalehan diperlukan karena itu adalah perwalian atas harta benda, seperti perwalian atas harta anak yatim; Jika wali amanat tidak adil, wewenangnya dicabut untuk menjaga wakaf. Jika ia kembali kompeten, hak-haknya dipulihkan. Jika wali amanat ditunjuk oleh pemberi wakaf, keadilan bukanlah syarat, dan orang yang adil ditambahkan kepada orang yang korup, karena menjaga wakaf lebih penting daripada mempertahankan perwalian individu yang korup. Jika wali amanat adalah penerima manfaat, baik yang adil maupun yang korup, ia memiliki hak yang lebih besar atasnya. Telah dikatakan juga bahwa orang yang dapat dipercaya harus ditambahkan kepadanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680} Syarat ketiga: kompetensi, artinya kekuatan dan kemampuan seseorang untuk mengelola apa yang dia awasi. Mazhab Syafi'i dan Hanbali secara eksplisit menetapkan syarat ini, karena menjaga wakaf adalah kewajiban agama. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} Jika kompetensi pengawas kurang, mazhab Syafi'i mengatakan bahwa hakim harus memberhentikan pengawas, meskipun pengangkatannya telah disepakati. Mazhab Al-Nawawi mengatakan bahwa jika kekurangan tersebut diperbaiki, pengawasannya dikembalikan jika telah disepakati dan ditunjuk secara khusus. Mazhab Hanbali mengatakan bahwa jika kompetensi pengawas kurang, ia tidak diberhentikan, melainkan orang yang dapat dipercaya dan mampu ditunjuk untuk menggantikannya guna mencapai hasil yang diinginkan. Mazhab Hanafi mengatakan bahwa pengawas harus diberhentikan jika ia tidak dapat dipercaya atau tidak mampu; dan pernyataan mazhab Maliki juga menyiratkan persyaratan kompetensi. Syarat keempat: Islam. Mazhab Hanbali menetapkan bahwa wali amanat harus beragama Islam jika penerima wakaf beragama Islam, atau jika wakaf tersebut untuk tujuan seperti masjid. Hal ini berdasarkan Surah An-Nisa, ayat 141, yang dikutip oleh mazhab Hanbali sebagai bukti untuk syarat ini. Jika wakaf ditujukan untuk orang non-Muslim tertentu, maka wali amanat juga boleh seorang non-Muslim. Namun, mazhab Hanafi memperbolehkan seorang non-Muslim menjadi wali amanat dan tidak mensyaratkan agama Islam. Dengan demikian, jika seorang hakim memberhentikan wali amanat karena alasan apa pun dan kemudian ia masuk Islam, wewenangnya tidak dipulihkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680} Al-Ramli mengatakan bahwa dengan analogi wasiat dan pernikahan, diperbolehkan untuk menunjuk seorang non-Muslim sebagai pengelola jika penerima wakaf adalah seorang non-Muslim dan berakhlak lurus. Namun, hal ini dibantah oleh persyaratan ketakwaan sejati dalam hal wakaf. Al-Shubramalsi mengatakan bahwa bantahan ini adalah pandangan yang diterima, dan dia membedakannya dari pernikahan seorang wanita non-Muslim di bawah perwaliannya, dengan alasan bahwa wali dalam pernikahan secara alami cenderung melindungi kesucian anak asuhnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17681} Honorarium pengelola wakaf. Isu ini mencakup hak pengelola atas honorarium, penentuan honorarium oleh pemberi wakaf atau hakim, jumlahnya, dan apakah ia berhak atas honorarium jika tidak ada yang menetapkan honorarium untuknya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17681} A- Hak pengawas: Para ahli hukum berpendapat bahwa pengawas berhak atas upah sebagai imbalan atas pengelolaan wakaf dan menjaga kepentingannya. Mereka mengutip sebagai bukti pernyataan Umar ketika ia mewakafkan tanahnya di Khaybar, bahwa siapa pun yang mengelolanya hendaknya makan dengan layak atau memberi makan seorang teman yang tidak kaya dari hasil tanah tersebut, dan tindakan Ali ketika ia menggunakan hasil panennya untuk membiayai para budak yang diwakafkannya, dan dengan analogi kepada pemungut zakat, dan dengan hadits “Apa pun yang kutinggalkan setelah biaya istri-istriku dan biaya pekerjaku adalah sedekah.” Ibn Hajar mengatakan bahwa yang dimaksud dengan pekerja di sini adalah orang yang bertanggung jawab atas tanah tersebut, sehingga hal itu menunjukkan keabsahan upahnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} B- Memperkirakan biaya. Biaya tersebut dapat ditentukan oleh pemberi wakaf, dalam hal ini wali amanat mengambil apa yang telah ditentukan, meskipun melebihi biaya yang lazim. Ini adalah pendapat mazhab Hanafi, Syafi'i, dan Hanbali. Menurut mazhab Hanafi, jika pemberi wakaf menetapkan kurang dari biaya yang lazim, hakim akan melengkapi biaya lazim tersebut atas permintaannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} Menurut mazhab Syafi'i, jika pemberi wakaf menunjuk dirinya sendiri sebagai wali amanat dan menetapkan biaya untuk dirinya sendiri, maka biaya tersebut tidak boleh melebihi biaya lazim. Jika ia menetapkan lebih dari itu, wakaf tersebut tidak sah karena merupakan wakaf untuk dirinya sendiri. Mazhab Hanbali mengatakan bahwa jika pemberi wakaf menetapkan biaya tetap untuk wali amanat, dan biaya tersebut sama dengan biaya lazim, maka wali amanat berhak atas biaya tersebut. Jika lebih dari itu, maka biaya yang dibutuhkan oleh wakaf, seperti wali amanat dan lain-lain, dibayar dari kelebihan tersebut hingga ia hanya memiliki sisa biaya lazim, kecuali jika pemberi wakaf menetapkan biaya tersebut khusus untuk dirinya sendiri. Adapun mazhab Maliki, mereka tidak menetapkan apa pun dan menyerahkan hal itu kepada kebijaksanaan pemberi wakaf atau hakim. Jika pemberi wakaf tidak menetapkan biaya, maka hakim yang menentukannya. Menurut mazhab Hanafi dan Hanbali, biaya yang ditetapkan tidak boleh melebihi biaya yang lazim, dan jika ia menetapkan lebih dari itu, ia dilarang menerima kelebihan tersebut. Mazhab Maliki mengatakan bahwa masalah ini diserahkan kepada kebijaksanaan hakim. Ibnu Futuh mengatakan bahwa diperbolehkan bagi hakim untuk menetapkan tunjangan bulanan yang telah ditentukan kepada orang yang ditunjuknya sebagai wali amanat, berdasarkan pertimbangannya dan sesuai dengan praktik para imam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} Mazhab Syafi'i menyatakan bahwa jika wakaf tidak menetapkan biaya untuk wali amanat, maka menurut pendapat yang paling tepat, wali amanat tidak berhak atas biaya apa pun, dan ia tidak diperbolehkan mengambil apa pun dari dana wakaf. Jika ia melakukannya, ia bertanggung jawab dan tidak dibebaskan kecuali dengan menyerahkannya kepada hakim. Inilah pandangan yang diandalkan. Jika wali amanat menyerahkan masalah tersebut kepada hakim untuk menentukan biaya baginya, maka ia seperti seorang wali yang menyerahkan masalah menjaga uang anak kepada hakim. Al-Iraqi menyebutkan bahwa implikasinya adalah dia mengambil bayaran jika diperlukan, baik sejumlah biaya hidupnya, sebagaimana yang disukai oleh Al-Rafi'i, atau jumlah yang lebih kecil antara biaya hidupnya dan bayaran orang yang sejenis dengannya, sebagaimana yang disukai oleh Al-Nawawi. {kutip:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17683} C- Jika pemberi wakaf tidak menentukan upah untuk pengawas. Al-Ramli, dari mazhab Hanafi, mengatakan bahwa pengawas tidak berhak atas apa pun kecuali hakim menetapkan upah yang setara dengan standar pekerjaannya. Ibn Abidin menjelaskan bahwa jika pemberi wakaf menentukan sesuatu untuk pengawas, maka itu menjadi miliknya, baik banyak atau sedikit, baik dia bekerja atau tidak, kecuali jika dia menetapkannya sebagai kompensasi untuk pekerjaan tersebut. Jika pemberi wakaf tidak menentukan dan hakim menetapkan upah yang setara dengan standar pekerjaannya, maka itu diperbolehkan. Jika hakim menetapkan lebih, kelebihannya haram. Jika dia tidak bekerja, dia tidak berhak atas upah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} Jika hakim menunjuknya dan tidak menentukan apa pun untuknya, maka jika sudah menjadi kebiasaan baginya untuk bekerja hanya dengan upah yang setara dengan standar pekerjaannya, maka ia berhak atas upah yang setara dengan standar pekerjaannya, karena kebiasaan tersebut seperti sebuah syarat. Jika tidak, ia tidak berhak atas apa pun. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} Ibn Nujaym, mengutip al-Qunya, melaporkan dua pendapat di kalangan mazhab Hanafi mengenai wali amanat yang ditunjuk hakim jika tidak ditentukan gajinya: yang pertama adalah bahwa ia tidak berhak atas apa pun, meskipun ia bekerja selama setahun; Kedua, bahwa wali amanat berhak atas gaji yang setara dengan pekerjaannya, baik gaji tersebut telah ditetapkan atau tidak, karena ia tidak secara lahiriah menerima perwalian kecuali dengan imbalan gaji, dan apa yang lazim sama dengan apa yang ditetapkan. {kutip:fiqh-mawsua-kuwaitiyya-noor-v3 hal.17683} Menurut mazhab Syafi'i, jika pemberi wakaf tidak menetapkan apa pun untuk wali amanat, maka ia tidak berhak atas gaji, menurut pendapat yang paling sahih. Jika masalah tersebut dirujuk kepada hakim, ia akan diberikan gaji jika diperlukan. Mazhab Hanbali memiliki tiga pendapat: Pertama, bahwa wali amanat dapat mengambil bagian dari hasil wakaf dengan cara yang wajar, baik miskin maupun tidak, dengan analogi terhadap pengumpul zakat. Ini adalah pandangan Abu al-Khattab. Kedua, bahwa ia dapat mengambil kurang dari upah yang lazim atau apa pun yang mencukupinya, dengan analogi terhadap wali anak yatim. Ini hanya diperbolehkan jika ia miskin. Ketiga, bahwa wali amanat, yang dikenal menerima pembayaran atas pekerjaannya, berhak atas upah yang lazim. Ini adalah pandangan yang berlaku di dalam mazhab tersebut. Pandangan mazhab Maliki tampaknya adalah bahwa hakim harus memberikan upah kepada wali amanat untuk wakaf, atau tunjangan bulanan tetap berdasarkan penilaian dan pekerjaannya, sebagaimana dinyatakan oleh Ibn Futuh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17684} Mengenai sumber upah. Mayoritas ahli hukum, yaitu mazhab Hanafi dan Maliki (kecuali Ibn Attab), mazhab Syafi'i, dan mazhab Hanbali, berpendapat bahwa upah yang harus dibayarkan kepada pengelola, baik yang ditetapkan oleh pemberi wakaf maupun yang ditentukan oleh hakim, berasal dari hasil wakaf. Mereka mengutip sebagai bukti pernyataan Umar ketika ia mewakafkan tanahnya: \"Pengelola wakaf ini boleh makan darinya tanpa menambah kekayaan.\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} Ibn Attab, dari mazhab Maliki, mengatakan bahwa upah pengelola hanya boleh berasal dari kas negara. Jika diambil dari wakaf, maka harus dikembalikan dan diambil dari kas negara. Jika tidak diberikan dari kas negara, maka pahalanya ada di sisi Allah. Al-Hattab menjelaskan hal ini dengan mengatakan bahwa wakaf tidak dapat diubah karena ditujukan untuk wasiat. Ibn Ward mengeluarkan fatwa yang serupa, tetapi Al-Dasuqi menganggap pendapat Ibn Attab lemah. Pekerjaan yang menjadi hak pengelola adalah pemeliharaan, perawatan, dan penyewaan wakaf, pengumpulan pendapatannya dari sewa, hasil panen, atau produk, upaya untuk mengembangkannya, dan pengeluarannya untuk tujuan yang telah ditentukan yaitu pemeliharaan, perbaikan, dan pendistribusiannya kepada mereka yang berhak, sebagaimana praktik yang telah ditetapkan. Pembayaran jatuh tempo sejak saat pengangkatannya, karena sebagai imbalan atas pekerjaan dan hanya jatuh tempo sebanding dengan pekerjaan yang dilakukan. Mazhab Hanbali mengatakan bahwa jika wali amanat lalai, pembayarannya dikurangi sejumlah yang sebanding dengan pekerjaan yang diabaikannya untuk wakaf tersebut. Jumlah yang dihitung kemudian dibagi antara apa yang telah dilakukannya dan apa yang tidak dilakukannya, dan bagian untuk apa yang tidak dilakukannya dikurangi. Mazhab Hanafi mengatakan bahwa jika para penerima wakaf berselisih dengan wali amanat, dengan alasan bahwa pemberi wakaf menetapkan pembayaran sebagai imbalan atas pekerjaan yang tidak dilakukan oleh wali amanat, maka hakim tidak boleh membebaninya dengan pekerjaan yang bahkan tidak dilakukan oleh para gubernur. Jika wali amanat ditimpa musibah yang memungkinkannya untuk memerintah, melarang, mengambil, dan memberi, maka ia berhak atas pembayaran; jika tidak, ia tidak berhak. Bahkan jika pemberi wakaf menetapkan pembayaran yang melebihi upah yang lazim, hal itu diperbolehkan. Masalah lain yang mereka ajukan adalah ini: Jika seseorang mewariskan tanah kepada para dermawannya dan kemudian meninggal dunia, dan hakim menunjuk seorang wali amanat untuk wakaf tersebut dan mengalokasikan sepersepuluh hasil panen kepadanya, dan wakaf tersebut mencakup sebuah penggilingan yang dimiliki oleh seseorang melalui pengaturan bagi hasil, yang tidak memerlukan wali amanat, dan para penerima manfaat mengambil hasil panennya dari orang tersebut, maka wali amanat tersebut tidak berhak atas sepersepuluh hasil panen, karena apa yang diterimanya dianggap sebagai pembayaran, dan tidak ada pembayaran tanpa kerja. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} Akuntansi pengawas wakaf. Tugas pengawas adalah mengumpulkan pendapatan wakaf dan membelanjakannya untuk kebutuhan wakaf serta mendistribusikannya kepada para penerima manfaat. Para ulama sepakat bahwa ia harus bertanggung jawab atas pengeluarannya, baik oleh hakim maupun para penerima manfaat. Namun, mereka berbeda pendapat mengenai apakah pernyataannya tentang pengeluaran harus diterima tanpa bukti, dan apakah pernyataan tersebut harus diterima dengan sumpah jika tidak ada bukti. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} Mazhab Hanafi menyatakan bahwa hakim tidak berkewajiban untuk meminta pertanggungjawaban pengawas secara rinci atas setiap pengeluaran dari pendapatan wakaf. Sebaliknya, pernyataan umum darinya sudah cukup jika ia dikenal dapat dipercaya. Jika ia dicurigai tidak jujur, hakim memaksanya untuk menjelaskan secara bertahap, tanpa memenjarakannya. Sebaliknya, hakim memanggilnya selama dua atau tiga hari dan memperingatkannya. Jika ia memberikan penjelasan, semuanya baik-baik saja; jika tidak, hakim menerima sumpahnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} Al-Durr mengutip Al-Qunya yang mengatakan bahwa jika hakim menuduhnya, ia harus membuatnya bersumpah, meskipun ia dapat dipercaya, seperti seorang depositor yang mengklaim depositnya hilang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} Pendapat mazhab Hanafi berbeda mengenai apakah wali amanat mengklaim telah membayar kepada penerima yang berhak: Al-Durr mengatakan bahwa pernyataannya diterima tanpa sumpah, sedangkan Al-Is'af dan Al-Bahr tidak setuju. Al-Is'af mengatakan bahwa jika wali amanat mengatakan, \"Saya menerima uang sewa dan membayarkannya kepada penerima yang berhak,\" dan mereka menyangkalnya, maka pernyataannya diterima dengan sumpahnya, seperti seorang depositor yang mengklaim telah mengembalikan depositnya, dan penyewa harta wakaf dibebaskan dari kewajiban membayar uang sewa karena wali amanat mengakui telah menerimanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} Ibn Abidin mengutip Al-Khair Al-Ramli yang mengatakan bahwa fatwanya adalah ia harus bersumpah pada saat ini; Dalam Fatwa Hamidiyya, diriwayatkan dari Abu al-Sa'ud bahwa jika wali amanat boros dan suka menghambur-hamburkan uang, perkataannya mengenai pengeluaran dana wakaf tidak diterima, bahkan dengan sumpahnya. Dan diriwayatkan dari al-Shalabi bahwa siapa pun yang memiliki sifat-sifat yang bertentangan dengan hukum Islam menjadi pelanggar, dan perkataannya mengenai pengeluarannya tidak diterima kecuali dengan bukti. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} Adapun mengenai penerimaan perkataan seorang pengawas yang terpercaya setelah pemecatannya, al-Hamawi menyatakan bahwa makna lahiriah dari perkataan mereka adalah penerimaan, karena pemecatan tidak menghilangkan statusnya sebagai wali amanat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687} Penulis Al-Durr mengutip Al-Mulla Abu Al-Saud secara rinci: Jika wali amanat mengaku telah membayar dari hasil wakaf kepada anak-anaknya atau cucu-cucunya, pernyataannya diterima. Jika ia mengaku telah membayar kepada orang-orang yang berwenang, seperti imam dan muazin, hal itu tidak diterima, seperti seseorang yang menyewa orang untuk membangun di masjid dengan biaya yang diketahui dan kemudian mengaku telah menyerahkannya kepada orang tersebut. Al-Tamartashi menyetujui rincian ini. Mazhab Maliki mengatakan bahwa jika pendiri wakaf meninggal dan akta wakaf hilang, perkataan wali amanat mengenai pengeluaran diterima, asalkan ia dapat dipercaya, kecuali jika wakaf tersebut memiliki saksi pendiriannya. Dalam hal itu, pengeluaran hanya boleh dilakukan dengan sepengetahuan mereka. Jika ia mengaku telah menggunakan uangnya sendiri untuk wakaf, ia dipercaya tanpa sumpah jika ia tidak dicurigai tidak jujur; jika tidak, ia harus bersumpah. Al-Hattab menyebutkan sebuah kejadian di mana Al-Suyuri ditanya tentang imam, muazin, dan pengelola sebuah masjid. Bertahun-tahun kemudian, seorang inspektur pasar menuduh mereka menggelapkan hasil penjualan toko. Pengelola tersebut membantah telah menggelapkan apa pun. Al-Suyuri menjawab bahwa perkataannya harus diterima mengenai apa yang ia klaim telah dibelanjakan jika sesuai dengan pernyataannya. Al-Barzali mengatakan bahwa ini berlaku kecuali jika ditetapkan bahwa pendapatan dan pengeluaran harus disaksikan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687} Mazhab Syafi'i membedakan antara kasus di mana penerima manfaat ditentukan, seperti Zayd dan Amr, di mana perkataan mereka diterima dan mereka berhak menuntut pertanggungjawaban dari wali amanat, dan kasus di mana mereka tidak ditentukan, seperti kaum fakir. Dalam kasus terakhir, dapatkah Imam menuntut pertanggungjawaban darinya? Ada dua pendapat, yang lebih kuat adalah pendapat pertama. Ia harus dipercaya mengenai jumlah yang ia belanjakan jika masuk akal. Jika hakim menuduhnya, ia harus bersumpah. Yang dimaksud adalah pengeluaran untuk hal-hal yang lazim, dan ini termasuk pengeluaran untuk kaum fakir dan entitas publik serupa. Ini berbeda dengan pengeluaran untuk penerima manfaat tertentu, di mana ia tidak dapat dipercaya karena ia tidak dipercayakan dengan amanah tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688} Mazhab Hanbali membedakan antara wali amanat yang secara sukarela memberikan jasanya dan wali amanat yang menerima bayaran; Pernyataan pemberi wakaf mengenai pembayaran kepada penerima wakaf diterima, tetapi jika ia bukan pemberi wakaf, pernyataannya tidak diterima kecuali dengan bukti. Al-Bahuti dan Al-Mardawi menyatakan bahwa penerima wakaf tidak keberatan dengan orang yang ditunjuk oleh pemberi wakaf jika ia dapat dipercaya, tetapi mereka dapat mempertanyakan apa yang mereka butuhkan darinya. Penguasa berhak untuk membentuk biro untuk mengaudit dana wakaf jika diperlukan. Pemberhentian pengawas wakaf dan siapa yang berhak memberhentikannya: Syarat-syarat untuk pengawas dan hukum tentang pemberhentiannya jika salah satu syarat tidak terpenuhi telah dijelaskan sebelumnya; berikut ini adalah siapa yang berhak memberhentikannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688} Pertama: Hak pemberi wakaf untuk memberhentikan. Mazhab Syafi'i dan Hanbali membedakan antara pemberi wakaf yang menetapkan bahwa ia akan mengawasi wakaf untuk dirinya sendiri pada awalnya dan kemudian menyerahkannya kepada orang lain, dan yang menetapkan bahwa wakaf tersebut akan untuk orang lain sejak awal. Jika ia menetapkannya untuk dirinya sendiri dan kemudian menyerahkannya kepada orang lain, ia berhak untuk memberhentikannya dan menunjuk orang lain, karena orang tersebut adalah wakilnya, sebagaimana seorang prinsipal memberhentikan agennya. Ini adalah pandangan yang benar menurut mazhab Syafi'i, dan juga merupakan pandangan yang benar menurut mazhab Hanbali berdasarkan kebenaran hukum-hukum tambahan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688} Al-Shirbini al-Khatib menunjukkan bahwa ini menyiratkan bahwa pemberi wakaf berhak untuk memberhentikan tanpa alasan. Al-Subki secara eksplisit menyatakan hal ini, dan banyak ulama kemudian, termasuk Ibn Razin, mengeluarkan fatwa yang menyatakan bahwa pemberhentian tanpa alasan tidak diperbolehkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17689} Menurut salah satu pandangan dalam mazhab Syafi'i dan Hanbali, pemberi wakaf tidak dapat memberhentikan wali amanat, karena kepemilikannya telah berakhir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17689} Namun, jika pemberi wakaf menetapkan bahwa orang tertentu harus mengawasi wakaf, mazhab Syafi'i tidak mengizinkan pemberhentian mereka, bahkan untuk alasan yang sah, karena wali amanat tidak lagi memiliki hak untuk mengawasi wakaf setelah menetapkannya untuk orang lain. Oleh karena itu, jika wali amanat yang ditunjuk diberhentikan atau menjadi korup, penunjukan pengganti berada di bawah yurisdiksi hakim, bukan pemberi wakaf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17689} Mazhab Hanbali menyatakan bahwa jika pemberi wakaf menetapkan bahwa orang lain harus mengawasi wakaf dan juga menetapkan bahwa ia memiliki hak untuk memberhentikannya, maka ia memang memiliki hak untuk memberhentikannya; jika tidak, ia tidak memiliki hak tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17689} Menurut mazhab Hanafi, Muhammad ibn al-Hasan berpendapat bahwa jika pemberi wakaf menetapkan bahwa wewenang untuk mengangkat, memberhentikan, dan mengganti wali amanat akan menjadi miliknya dan anak-anaknya, dan ia menyerahkan wakaf kepada wali amanat, maka hal ini diperbolehkan, dan ia memiliki hak untuk memberhentikannya. Namun, jika ia tidak menetapkan wewenang untuk memberhentikan bagi dirinya sendiri, maka ia tidak memiliki hak untuk memberhentikannya setelah menyerahkan wewenang tersebut, karena ia berada di posisi orang-orang yang mengelola wakaf. Al-Sadr al-Shahid mengatakan bahwa fatwa tersebut sesuai dengan pendapat Muhammad. Ibn Abidin mengatakan bahwa ini didasarkan pada perbedaan pendapat mengenai syarat penyerahan kepada wali amanat. Menurut Muhammad, itu adalah syarat, tetapi menurut Abu Yusuf, wewenang ditetapkan untuk pemberi wakaf baik dia menetapkannya atau tidak, karena penyerahan bukanlah syarat menurutnya. Ini adalah pendapat Hilal dan posisi yang tampak dari mazhab tersebut. Jika pemberi wakaf menunjuk orang lain, maka orang itu adalah wakilnya, dan dia berhak untuk memecatnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690} Al-Ramli mengatakan bahwa ini secara eksplisit mengizinkan pemecatan dengan atau tanpa kejahatan, karena dia adalah seorang wakil dan prinsipal berhak untuk memecat wakilnya secara mutlak; Al-Dur mengatakan bahwa fatwa tersebut berdasarkan pada perkataan Abu Yusuf, dan Al-Bahr mengatakan bahwa para syekh Balkh mengeluarkan fatwa berdasarkan perkataannya. {kutipan:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17690} Menurut mazhab Maliki, pemberi wakaf tidak dapat menetapkan bahwa wali amanat harus ditunjuk untuk dirinya sendiri. Sebaliknya, syarat-syaratnya untuk menunjuk wali amanat harus dipatuhi. Jika ia menetapkan bahwa orang tertentu menjadi wali amanat, hal ini tidak dapat diubah. Al-Badr al-Qarafi menyatakan bahwa pemberi wakaf berhak untuk memberhentikan wali amanat bahkan karena alasan selain kesalahan. Ibnu Arafah secara eksplisit menyatakan bahwa pemberi wakaf berhak untuk memberhentikan siapa pun yang dianggapnya pantas dan menggantinya. Al-Hattab mengatakan bahwa siapa pun yang memberikan wakaf dan menyerahkannya kepada orang lain, kemudian ingin memberhentikannya, tidak dapat melakukannya kecuali dengan alasan yang jelas, seperti seorang hakim yang menunjuk seseorang. Kedua: Hak hakim untuk memberhentikan. Hakim memiliki yurisdiksi umum, dan oleh karena itu ia berhak untuk memberhentikan wali amanat yang ditunjuk oleh pemberi wakaf jika ketidakjujurannya terbukti, atau jika ia tidak memenuhi salah satu syarat yang disebutkan di atas. Ia tidak dapat memberhentikannya tanpa alasan. Jika hakim adalah orang yang menunjuk pengawas, mazhab Maliki, Syafi'i, dan sebagian mazhab Hanafi berpendapat bahwa tidak diperbolehkan untuk memberhentikan orang yang ditunjuk oleh hakim kecuali karena alasan seperti pengkhianatan atau alasan serupa lainnya. Menurut mazhab Hanbali dan sebagian mazhab Hanafi, diperbolehkan untuk memberhentikan pengawas tanpa pengkhianatan. Beberapa pengawas wakaf. Wakaf boleh memiliki satu atau lebih pengawas, sebagaimana dinyatakan oleh para ahli hukum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690} Jika pemberi wakaf menunjuk dua pengawas, maka menurut mazhab Syafi'i, Hanbali, dan Abu Hanifa, keduanya tidak dapat bertindak secara independen satu sama lain, karena pemberi wakaf tidak menyetujui pendapat mereka, kecuali jika ia menetapkan bahwa masing-masing dapat bertindak secara independen, dalam hal ini masing-masing dapat bertindak secara independen. Jika pemberi wakaf menyerahkan pengelolaan wakaf kepada satu orang dan pengumpulan pendapatannya kepada orang lain, maka hal itu sah, dan masing-masing berhak atas apa yang telah ditetapkannya. Menurut Abu Yusuf, masing-masing wali amanat dapat bertindak secara independen. Mazhab Hanafi mengatakan bahwa jika pemberi wakaf menyerahkan pengelolaan kepada satu orang dan kemudian menunjuk wali untuk orang lain, mereka dianggap sebagai wali amanat bersama, kecuali jika masing-masing secara khusus ditugaskan tugasnya dalam satu sesi, dalam hal ini masing-masing bertindak secara independen. Jika pemberi wakaf menyerahkan pengelolaan harta kepada putranya yang paling berbudi luhur, dan keduanya sama-sama berbudi luhur, maka mereka tidak berbagi pengelolaan tersebut; melainkan, pengelolaan diberikan kepada putra tertua. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} Jika salah satu wali amanat menerima dan yang lain menolak, atau jika salah satu dari mereka meninggal dunia atau terhalang untuk menjalankan tugasnya, hakim akan menunjuk orang lain sebagai penggantinya. Ini adalah pendapat mazhab Hanafi, Syafi'i, dan Hanbali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} Menurut mazhab Syafi'i, jika pemberi wakaf menetapkan bahwa wali amanat adalah anak tertua, dan masing-masing dari mereka mengaku sebagai yang tertua, maka mereka berbagi perwalian jika mereka cakap secara hukum. Tidak satu pun dari mereka dapat bertindak secara independen, karena klaim senioritas dibatalkan oleh bukti yang saling bertentangan, tetapi prinsip senioritas tetap berlaku. {kutip:fiqh-mawsua-kuwaitiyya-noor-v3 hal.17691} Wali amanat tidak boleh mendelegasikan perwalian kepada orang lain. Wali amanat tidak boleh mendelegasikan perwalian kepada siapa pun yang dia inginkan atau mewariskannya kepada orang lain kecuali jika pemberi wakaf telah memberinya wewenang untuk melakukannya. Mazhab Hanafi mengatakan: Jika pendelegasian wewenang pemberi wakaf kepada wali amanat bersifat umum, artinya ia menunjuknya di tempatnya sendiri dan memberinya wewenang untuk mendelegasikan pengawasan dan mewariskannya kepada siapa pun yang dia inginkan, maka wali amanat dapat mendelegasikannya selama ia sehat dan selama sakit parahnya. Jika pendelegasian tersebut tidak bersifat umum, maka tidak sah selama ia sehat, tetapi sah selama sakit parah karena ia berada dalam posisi sebagai pelaksana wasiat, dan seorang pelaksana wasiat dapat mewariskannya kepada orang lain. Mazhab Syafi'i berkata: Jika pemberi wakaf menyerahkan pengawasan kepada si fulan dan memiliki wewenang untuk mendelegasikannya kepada siapa pun yang diinginkannya, maka pendapat yang berlaku adalah bahwa pengawasan yang didelegasikan tersebut berakhir. Baik pemberi wakaf maupun penerima delegasi tidak dapat memberhentikan penerima delegasi, dan pengawasan tidak kembali kepada pemberi delegasi setelah kematiannya, karena delegasi tersebut seperti pengalihan kepemilikan. Pendapat kedua, yaitu pendapat al-Subki, adalah bahwa penerima delegasi adalah agen dari pemberi wakaf. Jika pemberi wakaf meninggal, pengawasan kembali kepadanya, dan jika penerima delegasi meninggal, pengawasan kembali kepada pemberi wakaf. Mazhab Hanbali berkata bahwa pengawas yang ditunjuk, jika wakaf tersebut untuknya, berhak untuk menunjuk dan memberhentikan agen atas namanya, karena wewenang inherennya. Jika wakaf tersebut bukan untuknya, ia tidak berhak untuk menunjuk pengawas atau mewariskan pengawasan kecuali jika hal itu telah ditentukan untuknya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17693} Pengakhiran Wakaf. Salah satu cara wakaf berakhir adalah dengan mengembalikan harta yang diwakafkan kepada pemilik wakaf, baik karena harta tersebut menjadi tidak dapat digunakan, rusak, atau tidak layak untuk dimanfaatkan, atau karena wakaf tersebut ditujukan untuk tujuan yang sudah tidak ada lagi, atau dalam kasus wakaf sementara yang diizinkan oleh mazhab Maliki. Isu-isu ini telah dibahas dalam penelitian ini. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17693}"
