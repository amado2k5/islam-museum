label:
  ar: "وَقْف"
  en: "Waqf (endowment, fiqh)"
  es: "Waqf (fundación, fiqh)"
summary:
  ar: "الوقف في اللغة الحبس، ومنه وقفت الدار حبستها في سبيل الله، ومنه المنع والسكون، ويُطلق على الشيء الموقوف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579} وفي الاصطلاح تعريفات متعددة: عند الحنفية حبس العين على حكم ملك الله تعالى وصرف منفعتها على من أحب عند الصاحبين، وعند أبي حنيفة حبس العين على حكم ملك الواقف والتصدق بالمنفعة؛ وعند المالكية إعطاء منفعة شيء مدة وجوده لازماً بقاؤه في ملك معطيه ولو تقديراً؛ وعند الشافعية حبس مال يمكن الانتفاع به مع بقاء عينه بقطع التصرف في رقبته على مصرف مباح موجود؛ وعند الحنابلة تحبيس مالك مطلق التصرف ماله المنتفع به مع بقاء عينه يُصرف ريعه إلى جهة بر تقرباً إلى الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579}\n\nالألفاظ ذات الصلة: التبرع ⁦(التطوع بالشيء دون عوض، وهو أعم من الوقف)⁩، والصدقة ⁦(تمليك في الحياة بغير عوض، وقد تُطلق على الوقف كما في حديث عمر في أرضه)⁩، والهبة ⁦(العطية بلا عوض)⁩، والعارية ⁦(إباحة الانتفاع بالعين مع بقاء ملكها للمعير)⁩، والوصية. والفرق بين الوقف والهبة أن الوقف تمليك المنفعة مع بقاء العين على ملك الله فلا يجوز التصرف فيها، والهبة تمليك للعين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581}\n\nالوصية: الحنفية تعريفها تمليك مضاف إلى ما بعد الموت، والشافعية نحو ذلك؛ والفرق بينها وبين الوقف أن الوصية تكون بعد الموت وقد تكون بالعين أو المنفعة، أما الوقف فتبرع في الحياة وبالمنفعة فقط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581}\n\nمشروعية الوقف: ذهب جمهور الفقهاء إلى مشروعيته ولزومه واعتباره من القُرَب المندوب إليها، واستدلوا بحديث ابن عمر في أرض عمر بخيبر وقول النبي له «إن شئت حبست أصلها وتصدّقت بها»، وبحديث «إذا مات الإنسان انقطع عنه عمله إلا من ثلاث...»، وبأثر جابر في أن من له مال من المهاجرين والأنصار حبس مالاً؛ وقال ابن قدامة إن ذلك إجماع من الصحابة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17582} ونقل ابن عابدين عن الإسعاف أن الوقف جائز عند أبي حنيفة وأصحابه، وأن الخلاف في اللزوم، فعند أبي حنيفة يجوز جواز العارية ولا يلزم إلا بحكم القاضي أو بإخراجه مخرج الوصية؛ ونقل ابن قدامة عن شريح أنه لم يره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17582} وفي الحكم التكليفي: الأصل أنه قربة مندوبة، وقد يكون فرضاً إن نُذر، ومباحاً إن كان بلا قصد القربة كوقف الذمي فلا ثواب له، وحراماً إن كان على معصية كالكنيسة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17582}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583} وذكر الكتاب أن بعض المالكية قالوا إن الوقف على البنين دون البنات حرام لشبهه بفعل الجاهلية، لكن ابن القاسم رأى الكراهة فيمضي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583}\n\nأركان الوقف: عند الجمهور ⁦(المالكية والشافعية والحنابلة)⁩ أربعة: الصيغة والواقف والموقوف عليه والموقوف، وعند الحنفية الركن الصيغة فقط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583} ولا ينعقد الوقف إلا بالإيجاب، واختلفوا في اشتراط القبول لانعقاده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583}\n\nصيغة الإيجاب: ما يدل على إرادة الواقف من لفظ أو إشارة مفهمة أو كتابة أو فعل. والألفاظ الصريحة عند المالكية والشافعية والحنابلة: «وقفت»، وكذا «حبست» عند المالكية والحنابلة والشافعية على الصحيح، و«سبّلت» عند الشافعية والحنابلة على الصحيح؛ ويصير الوقف بها دون زيادة لعرف الاستعمال، ولأن النبي قال لعمر «إن شئت حبست أصلها». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17584} والكناية: لفظ «تصدقت»، إلا أن يضيفه إلى جهة عامة كالفقراء وينوي الوقف عند بعض الشافعية، وكذا «حرّمت» و«أبّدت» عند الحنابلة والأصح عند الشافعية، ولا يحصل الوقف بها إلا بضم قرينة كقوله «صدقة موقوفة» أو «صدقة لا تُباع ولا توهب ولا تورث» أو نية الوقف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17584}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17585}\n\nإذا اجتمع في يد القيّم من غلة الوقف ما يصح صرفه في وجه من وجوه البر، كفكّ الأسرى المسلمين أو إعانة الغازي المنقطع، والوقف محتاج إلى الإصلاح، فإن لم يكن في تأخير الإصلاح إلى غلة السنة التالية ضرر بيّن يُخشى معه خراب الوقف، صُرفت الغلة إلى وجه البر وأُخّرت المرمة، وإن كان في التأخير ضرر بيّن صُرفت الغلة أولاً إلى المرمة ثم ما فضل إلى وجه البر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} وذكر ابن نجيم أن المتولي إذا صرف الغلة للمستحقين وهناك عمارة لا يجوز تأخيرها كان ضامناً، لأن ما يحتاج إليه الوقف من العمارة والمؤنة مستثنى من حق الفقراء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661}\n\nعند الحنفية إذا كانت العمارة ضرورية، كرفع سقف أو بناء جدار، قُدّمت على جميع جهات الصرف، لأنه ليس من النظر أن يخرب المسجد لأجل ما يُعطى للإمام والمؤذن؛ فإن فضل شيء عن التعمير أُعطي ما هو أقرب إلى الوقف مما في قطعه ضرر بيّن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} وإن لم تكن العمارة ضرورية، بحيث لا يؤدي تركها إلى خراب العين لو أُخّرت إلى غلة السنة القادمة، قُدّم الأهم فالأهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} وفرّق الحنفية بين أن يشترط الواقف تقديم العمارة كل سنة، فيُمسك القيّم كل سنة قدرها وإن لم تكن محتاجة الآن، وبين السكوت عنه، فلا تُدّخر العمارة عند عدم الحاجة إليها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} وإذا انهدم شيء من بناء الوقف وآلته صرفه الحاكم في عمارته، فإن كان التهيؤ للعمارة ثابتاً في الحال صُرف إليها، وإلا حُفظ حتى يتهيأ ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661}\n\nوعند الشافعية يُدّخر من زيادة غلة المسجد على حاجته، بتقدير هدمه، ويُشترى بالباقي عقار فيُوقف، لأن ذلك أحفظ له، ولا يُشترى من الموقوف على عمارته، لأن الواقف وقفه عليها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662}\n\nاختلف الفقهاء في الجهة التي يُنفق منها على الموقوف وعمارته. فالحنفية والمالكية يرون أن ذلك من غلة الوقف شرط الواقف أو لم يشرط، لأن الوقف صدقة جارية في سبيل الله لا تجري إلا بهذا الطريق، وقال المالكية إن شرط الواقف غير ذلك بطل شرطه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} وإذا وقف الواقف داره على سكنى ولده فالعمارة على من له السكنى من ماله لا من الغلة، إذ الغرم بالغنم، فإن امتنع أو عجز لفقره آجرها القاضي منه أو من غيره وعمّرها من أجرتها، ولا يُجبر الآبي على العمارة، وهو قول المالكية أيضاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} وقال المالكية إن الفرس الموقوف للغزو يُنفق عليه من بيت المال، فإن عُدم بيت المال بيع وعوض بثمنه سلاح ونحوه مما لا يحتاج إلى نفقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662}\n\nوذهب الشافعية والحنابلة إلى اتباع شرط الواقف. فعند الشافعية تكون النفقة ومؤنة التجهيز والعمارة من حيث شُرطت، وإلا فمن منافع الموقوف نفسه، ككسب العبد وغلة العقار، فإذا تعطلت منافعه فالنفقة ومؤنة التجهيز من بيت المال، أما العمارة فلا تجب على أحد، لأن العقار يشبه الملك المطلق، بخلاف الحيوان لصيانة روحه وحرمته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663} وعند الحنابلة يُرجع إلى شرط الواقف، فإن عيّن الإنفاق من غلته أو من غيرها عُمل به؛ فإن لم يعيّن وكان الموقوف ذا روح كالرقيق والخيل أُنفق عليه من غلته، فإن لم تكن له غلة فنفقته على الموقوف عليه المعيّن، فإن تعذر الإنفاق لعجزه بيع وصُرف ثمنه في عين أخرى تكون وقفاً، وإن أمكن إجارته أُجر بقدر نفقته. وإن كان الوقف على غير معيّن كالمساكين فنفقته في بيت المال، وإن كان الوقف عقاراً ونحوه لم تجب عمارته على أحد إلا بشرط الواقف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663}\n\nذهب الفقهاء إلى أن من تعدى على الوقف بهدم أو غيره ضمن. فعند الحنفية من آجر دار الوقف فجعل المستأجر رواقها مربطاً للدواب فخرّبها ضمن، لأنه فعل بغير إذن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663} وعند المالكية من هدم وقفاً تعدياً فعليه إعادته على ما كان عليه ولو كان المهدوم بالياً، والراجح عندهم أن عليه قيمته كسائر المتلفات، وهو ما ارتضاه ابن عرفة وشهره عياض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663} وعند الشافعية لا ضمان على من تلف في يده شيء من الكتب الموقوفة على طلب العلم بلا تعدٍّ، فإن تعدى ضمن، ومن التعدي استعماله فيما لم يُوقف له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663}\n\nإذا احتاج الموقوف إلى تعمير أو نفقة ولم تكفِ الغلة، فهل يجوز للناظر الاستدانة على الوقف، وهل يحتاج إلى إذن؟ ذهب المالكية والحنابلة والحنفية في قول إلى جواز ذلك للناظر من غير إذن الحاكم، كسائر تصرفاته، لأنه مؤتمن مطلق التصرف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} وقال المالكية إن من التزم حين أخذ النظر أن يصرف على الوقف من ماله إن احتاج لم يلزمه ذلك، وله الرجوع بما صرفه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} وعند الشافعية لا يجوز للناظر الاقتراض دون شرط الواقف أو إذن الإمام، ويجوز للإمام أن يقرض الناظر من بيت المال، أو يأذن له في الاقتراض، أو في الإنفاق من ماله على العمارة بشرط الرجوع؛ فإن اقترض بلا إذن ولا شرط لم يجز ولا يرجع بما صرفه لتعديه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664}\n\nوالمعتمد عند الحنفية أنه لا تجوز الاستدانة على الوقف إلا لمصلحته كالتعمير وشراء البذر، وتجوز بشرطين: إذن القاضي، فإن بَعُد عنه استدان المتولي بنفسه، وألا يتيسر إجارة العين والصرف من أجرتها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} وذكر ابن عابدين أن الاستدانة لا تجوز بغير أمر الواقف، لأن الدين لا يثبت ابتداءً إلا في الذمة، والوقف لا ذمة له، والفقراء وإن كانت لهم ذمة فلكثرتهم لا تتصور مطالبتهم، فلا يثبت الدين إلا على القيّم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} وترك القياس عند الضرورة، فالمختار عند أبي الليث أن الاستدانة تجوز بأمر القاضي إذا لم يكن من الاستدانة بد ولم يكن القاضي بعيداً عن المتولي، لأن ولايته أعم في مصالح المسلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} أما ما له منه بد، كالصرف على المستحقين، فلا تجوز الاستدانة لأجله، إلا ما يُعطى للإمام والخطيب والمؤذن، وكذا الحصير والزيت للمسجد على القول الراجح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664}\n\nوإذا لزم إذن القاضي فادعى المتولي الإذن، فالظاهر أنه لا يُقبل إلا ببينة وإن كان مقبول القول فيما في يده، لأنه يريد الرجوع في الغلة؛ فإن لم يستأذن حرم عليه الأخذ من الغلة، لأنه متبرع ما لم يوجد إذن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} وقال ابن عابدين إن المتولي إذا أنفق من ماله لإصلاح الوقف كان له الرجوع بذلك في غلته، وفي فتاوى الحانوتي أن له الرجوع ديانة، لكن لا يُقبل ادعاؤه ذلك إلا أن يُشهد أنه أنفق ليرجع، ويجب تقييد ذلك بما إذا كانت للوقف غلة، فإن لم تكن له غلة فلا بد من إذن القاضي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665}\n\nثانياً: بيع الموقوف والاستبدال به. إذا تعطّل الموقوف وصار بحال لا يُنتفع بها، أجاز الحنفية والمالكية والحنابلة والشافعية في رأي بيعه وجعل ثمنه في مثله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} وأجاز الحنفية البيع والاستبدال ولو لم يتعطل الموقوف، لكن بشروط خاصة، وفرّق المالكية بين العقار والمنقول في الجملة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665}\n\nللاستبدال عند الحنفية ثلاث صور. الأولى أن يشترط الواقف لنفسه أو لغيره استبدال أرض الوقف بأرض أخرى حين الوقف، وله صيغتان: الأولى أن يقول «أرضي هذه صدقة موقوفة لله أبداً على أن أبيعها وأشتري بثمنها أرضاً أخرى» فتكون الثانية وقفاً بشرائط الأولى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} وذهب أبو يوسف وهلال والخصاف إلى جواز الوقف والشرط استحساناً، وهو الصحيح على ما في فتاوى قاضيخان، لأن هذا الشرط لا يُبطل حكم الوقف، فالوقف يحتمل الانتقال من أرض إلى أخرى، والثانية تقوم مقام الأولى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} ومثال ذلك أن أرض الوقف إذا غصبها غاصب فأجرى عليها الماء حتى صارت بحراً لا تصلح للزراعة ضمن قيمتها واشترى بها أرضاً تكون وقفاً على شروط الأولى، وكذلك إذا قلّ ريعها لآفة ولم تفضل غلتها عن مؤنتها، فصلاح الوقف في الاستبدال، فيصح أن يشترط الواقف ولاية الاستبدال وإن لم تكن الضرورة قائمة في الحال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666}\n\nوقال محمد ويوسف بن خالد السمتي إن الوقف صحيح والشرط باطل، وهو القياس. ووجّه السرخسي قول محمد بأن هذا الشرط لا يؤثر في المنع من زوال الوقف، فيتم الوقف ويبقى الاستبدال شرطاً فاسداً باطلاً في نفسه، كالمسجد إذا شُرط الاستبدال به أو شُرط أن يُصلّى فيه قوم دون قوم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} وقال بعض فقهاء الحنفية إن الوقف والشرط فاسدان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} ونقل الكمال بن الهمام عن الأنصاري أن الشرط صحيح، لكن لا يُباع إلا بإذن الحاكم، وينبغي للحاكم إذا رُفع إليه ولا منفعة في الوقف أن يأذن في بيعه إذا رآه أنظر لأهل الوقف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666}\n\nولو شرط الواقف أن يبيع الأرض ويشتري بثمنها أرضاً أخرى ولم يزد صح استحساناً، وصارت الثانية وقفاً بشروط الأولى من غير تجديد وقف، لأن الأرض تعيّنت للوقف فيقوم ثمنها مقامها. والقياس البطلان، لأنه لم يذكر إقامة أرض أخرى مقام الأولى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} والصيغة الثانية: لو شرط أن للقيّم الاستبدال ولم يشرطه لنفسه كان له أن يستبدل لنفسه، لأن إفادة الولاية لغيره فرع كونه يملكها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667}\n\nولو شرط الاستبدال لرجل آخر مع نفسه، ملك الواقف الاستبدال وحده ولا يملكه الآخر وحده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} وإذا شرط الاستبدال جاز ولو كانت العين ذات ريع ونفع، إذ لا يلزم خروج الوقف عن الانتفاع، ولا مباشرة القاضي له، ولا عدم ريع يُعمَّر به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} وقيّد الحنفية الاستبدال بما اشترطه الواقف من قدر ونوع؛ فإن شرط الاستبدال بأرض لم يجز بدار، وإن شرط أرض قرية لم يجز بغيرها لتفاوت أراضي القرى مؤنة واستغلالاً، وإن لم يُقيّد البدل فله أن يستبدل من جنس العقارات بأي أرض أو دار أو بلد شاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} وإن شرط الاستبدال فليس له أن يستبدل الأرض الثانية بأرض ثالثة، لأن الشرط وجد في الأولى فقط، إلا أن يذكر عبارة تفيد ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667}\n\nالصورة الثانية: ألا يشترط الواقف الاستبدال حين الوقف، سواء شرط عدم الاستبدال أو سكت، لكن صار الوقف بحيث لا يُنتفع به بالكلية، بأن لا يحصل منه شيء أو لا يفي بمؤنته؛ فالاستبدال في هذه الصورة جائز على الأصح إذا كان بإذن القاضي ورأى فيه المصلحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} ونقل ابن عابدين عن البحر أن كلام قاضيخان اختلف، ففي موضع جوّز للقاضي الاستبدال بلا شرط من الواقف حيث رأى المصلحة، وفي موضع منع ذلك ولو صارت الأرض بحال لا يُنتفع بها. والمعتمد أنه يجوز للقاضي الاستبدال بالشروط الآتية: أ- أن يخرج الموقوف عن الانتفاع بالكلية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667}\n\nومن شروط الاستبدال عند الحنفية، كما ذكروا، ألا يكون البيع بغبن فاحش، وأن يكون للوقف ريع يُعمَّر به، وأن يكون المستبدل ممن يُعدّ من أهل العلم والعمل، لئلا يُتطرّق إلى إبطال أوقاف المسلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} وأن يكون البدل عقاراً لا دراهم ودنانير، وألا يُباع ممن لا تُقبل شهادته له أو ممن له عليه دين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} وأن يكون البدل والمبدل من جنس واحد؛ وقال ابن عابدين نقلاً عن قنالي زاده إن الظاهر أن اتحاد الجنس لا يُشترط في الموقوف للاستغلال، لأن المنظور فيه كثرة الريع وقلة المرمة والمؤنة، فلو استُبدل الحانوت بأرض تُزرع وتحصل منها غلة بقدر أجرة الحانوت كان أحسن، أما الموقوف للسكنى فالمقصود فيه الانتفاع بالسكن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} وفي القنية أن مبادلة دار الوقف بدار أخرى تجوز إذا كانت في محلة واحدة أو في محلة خير منها، ولا تجوز في العكس وإن كانت المملوكة أكثر مساحة وقيمة وأجرة، لاحتمال خرابها في المحلة الأدنى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668}\n\nونقل الكتاب عن شرح منظومة ابن وهبان في البحر الرائق سؤالاً: هل يجوز الاستبدال إذا شرط الواقف عدمه، أو كان الناظر معزولاً قبل الاستبدال؟ فقال الطرسوسي إنه لا نقل فيه، وإن مقتضى قواعد المذهب أن للقاضي أن يستبدل إذا رأى المصلحة فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} وروي عن محمد أنه إذا ضعفت الأرض الموقوفة عن الاستغلال، والقيّم يجد بثمنها أخرى أكثر ريعاً، جاز له بيعها وشراء ما هو أكثر ريعاً؛ ومن المشايخ من منع البيع والاستبدال تعطل الوقف أو لم يتعطل، وقال قاضيخان إن الوقف المرسل، أي الذي لم يُذكر فيه شرط الاستبدال، لا يجوز بيعه ولا الاستبدال به ولو كانت أرضه سبخة لا ينتفع بها، لأن سبيل الوقف أن يكون مؤبداً لا يُباع، وإنما تثبت ولاية الاستبدال بالشرط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669}\n\nالصورة الثالثة: ألا يشترط الواقف الاستبدال، وللوقف ريع وغلات ولم يتعطل، لكن في استبداله نفع في الجملة وبدله خير منه نفعاً وريعاً. قال ابن عابدين إن هذا لا يجوز استبداله على الأصح المختار، كما حرره قنالي زاده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} ونقل ابن عابدين عن الأشباه أنه لا يجوز استبدال العامر إلا في أربع مسائل: الأولى إذا شرط الواقف الاستبدال؛ والثانية إذا غصبه غاصب وأجرى عليه الماء حتى صار بحراً، فيضمن القيمة ويشتري المتولي بها أرضاً بدلاً؛ والثالثة إذا جحده الغاصب ولا بينة، وأراد دفع القيمة، فللمتولي أخذها ليشتري بها بدلاً؛ والرابعة إذا رغب فيه إنسان ببدل أكثر غلة وأحسن موقعاً، فيجوز على قول أبي يوسف وعليه الفتوى، وقال صاحب النهر إن ذلك معارض بقول صدر الشريعة: نحن لا نفتي بقول أبي يوسف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669}\n\nالاستبدال بالموقوف عند المالكية. يفرق المالكية بين العقار والمنقول في البيع والاستبدال. فأجازوا الاستبدال في المنقول إذا لم توجد جهة تنفق عليه وخيف هلاكه، أو تعطلت منافعه فصار لا ينتفع به فيما حُبس من أجله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} فالفرس الموقوف في سبيل الله كالغزو والرباط تكون نفقته في بيت المال، فإن عُدم بيت المال بيع وعوّض بدله سلاح ونحوه مما لا يحتاج إلى نفقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} ويُباع كل حبس منقول لا ينتفع به، كفرس أصيب بداء الكلب، أو ثوب يخلق، أو عبد يهرم، أو كتب تبلى؛ ويُجعل ثمنه في مثله إن أمكن، أو في شقص منه إن تعذر شراؤه كاملاً، فإن تعذر تُصدّق بالثمن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} ومن ذلك ذكور الحيوانات الموقوفة للغزو أو للنسل إذا فاض عن الحاجة أو كبرت الإناث حتى لا ينتفع بها، فتُباع ويُشترى بثمنها إناث صغار لتمام النفع، وتكون وقفاً كأصلها، كما ذكر الدردير في النعام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670}\n\nأما العقار فالمذهب عند المالكية أنه لا يُباع ولو خرب وصار لا ينتفع به، داراً كان أو حوانيت أو غيرها، ولا يُستبدل بمثله غير خرب؛ وقد روى أبو الفرج عن مالك أن الإمام إذا رأى البيع لمصلحة جاز أن يُجعل ثمنه في مثله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} وأجاز بعضهم معاوضة الربع الخرب، فقد نقل التاج والإكليل منع بيع ما خرب من ربع الحبس، وعلّل ابن الجهم ذلك بأنه يوجد من يُصلحه بإجارته سنين فيعود كما كان، واختُلف في معاوضة الربع الخرب بربع غير خرب؛ وقال ابن رشد: إن انقطعت منفعة القطعة جملة وعجز عن عمارتها وكرائها، فلا بأس بالمعاوضة بمكان يكون حبساً مكانها، بحكم من القاضي بعد ثبوت السبب وتحقق الغبطة للمعوّض عنه، ويُسجَّل ذلك ويُشهد به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670}\n\nوأجاز المالكية بيع العقار لضرورة توسعة مسجد جامع، سواء كان الوقف على معينين أو غير معينين. وقال ابن رشد إن ظاهر سماع ابن القاسم أن ذلك جائز في كل مسجد، وقول سحنون، وفي النوادر عن مالك وغيره أن ذلك في مساجد الجوامع إن احتيج إليه، لا في مساجد الجماعات؛ لأن الضرورة فيها ليست كالجوامع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} كما يجوز بيع الوقف لتوسعة مقبرة أو طريق لمرور الناس، ولو جبراً على المستحقين أو الناظر، ويجب على المستحقين أن يُجعل ثمنه في حبس غيره، ولا يجبرهم الحاكم على الجعل في حبس غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} وقال الشرح الصغير إن ما وُسّع به المسجد من الرباع يُدفع ثمنه إذا كان حبساً على معيّن، أما الحبس على غير معيّن كالفقراء فلا يلزم تعويضه، لأنه لم يتعلق به حق لمعيّن، ولأن ما يحصل من الأجر للواقف إذا دخل في المسجد أعظم مما قصده أولاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671}\n\nوقال المالكية إن اشترط الواقف التغيير والتبديل عُمل بشرطه، أما إذا شرط أنه إن وجد فيه ثمناً مرغوباً بِيع واشتُري غيره، فقد ذكرت النوادر والمتيطية أنه لا يجوز ذلك، فإن وقع مضى وعُمل بشرطه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} ونقل فتح العلي المالك واقعة: أرض موقوفة على سبيل في طريق المسلمين، شرط واقفها ألا تُباع ولا تُستبدل، ثم استبدل ناظر السبيل بها أرضاً من أراضي الديوان، فقال الدردير إن المبادلة باطلة حيث شرط الواقف عدم الاستبدال وأطلق، ويجب على الناظر رد أرض الديوان لصاحبها وأخذ أرض الوقف بعينها، ومن امتنع زجره الحاكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671}\n\nالاستبدال بالموقوف عند الشافعية. جاء في المهذب أنه إذا وقف مسجداً فخرب المكان وانقطعت الصلاة فيه لم يعد إلى الملك، ولم يجز التصرف فيه، لأن ما زال عنه الملك لحق الله تعالى لا يعود إلى الملك بالاختلال، كمن أعتق عبداً ثم زَمِن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} وقال الشربيني إن الأصح جواز بيع حصير المسجد الموقوفة إذا بليت، وجذوعه إذا انكسرت أو أشرفت على ذلك، ولم تصلح إلا للإحراق، لئلا تضيع ويضيق المكان بها، فتحصيل نزر يسير من ثمنها للوقف أولى من ضياعها، ولا تدخل بذلك في بيع الوقف لأنها صارت في حكم المعدوم، وهذا ما جرى عليه الشيخان.  {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} وقال الرافعي إن القياس أن يُشترى بثمن الحصير حصير لا غيرها، وقال الأذرعي إن المراد بذلك مقام التبن في الطين؛ أما الجذوع التي تصلح لغير الإحراق، كألواح وأبواب، فلا تُباع قطعاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672} وإذا خِيف على المسجد السقوط نُقض، وبنى الحاكم بنقضه مسجداً آخر إن رأى ذلك، وبناؤه بقربه أولى، ولا يُبنى به بئر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672} وإذا وقف على قنطرة فانحرق الوادي وتعطلت القنطرة، جاز نقلها إلى محل الحاجة؛ وغلة وقف الثغر إذا حصل فيه الأمن يحفظها الناظر لاحتمال عوده ثغراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672}\n\nوإن وقف نخلة فجفّت، أو بهيمة فزمنت، أو جذوعاً على مسجد فتكسرت، ففيه وجهان: الأصح عدم جواز البيع كما في المسجد، والثاني يجوز لأنه لا يُرجى نفعه. وإذا قيل بالبيع، فحكم ثمنه حكم القيمة التي توجد من متلف الوقف؛ فإن قيل إن الملك في رقبة الموقوف للموقوف عليه، كان الثمن له، وإن قيل إنه لله تعالى وهو الأظهر، اشتُري به مثله ليكون وقفاً مكانه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672} وقال أبو حامد الإسفراييني إن الثمن يُشترى به مثله ليكون وقفاً مكانه بلا خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672}\n\nالاستبدال بالموقوف عند الحنابلة. يجوز الاستبدال عندهم إذا لم يعد الوقف صالحاً للغرض الذي وقف من أجله ولا للانتفاع به، سواء كان منقولاً أو عقاراً، ومسجداً أو غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} فيحرم بيع الوقف ولا يصح، ولا تصح مناقلته ولو بخير منه نصاً، إلا أن تتعطل منافعه المقصودة بخراب ولم يوجد في ريعه ما يعمره فيُباع، أو تتعطل منافعه بغير خراب كخشب تشعث وخِيف سقوطه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} وإذا كان الوقف مسجداً وتعطل نفعه المقصود لضيقه على أهله، وتعذرت توسعته، أو لخراب محلته، أو لكون الموضع قذراً يمنع من الصلاة فيه، قال القاضي يصح بيعه ويُصرف ثمنه في مثله، لأن إبقاءه كذلك إضاعة للمال، وإنما يُستبقى الغرض في عين أخرى، واتصال الأبدال يجري مجرى الأعيان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} ويصح بيع شجرة موقوفة يبست، وجذع موقوف انكسر أو بلي أو خِيف انكساره أو هدمه؛ وقال في التلخيص إذا أشرف جذع الوقف على الانكسار، أو داره على الانهدام، وعُلم أنه لو أُخّر خرج عن كونه منتفعاً به، بِيع رعاية للمالية؛ والمدارس والربط والخانات المسبّلة إذا خربت يجوز بيعها عندهم على وجه واحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} والفرس الموقوف للغزو إذا لم يصلح له يُباع ويُشترى بثمنه فرس يصلح، وإذا اشتُري البدل صار وقفاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} وشرط الواقف عدم البيع فاسد. والذي يتولى البيع الحاكم إن كان الوقف على وجوه الخير كالمساكين والمساجد والقناطر، والناظر الخاص إن كان الوقف على شخص معيّن أو جماعة معيّنين، والأحوط ألا يفعل إلا بإذن الحاكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} وإذا اشتُري البدل لجهة الوقف صار وقفاً، والاحتياط أن يُوقف بصيغة جديدة حتى لا ينقضه من لا يرى وقفيته بمجرد الشراء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674}\n\nرجوع الوقف إلى ملك الواقف. ذهب محمد بن الحسن من الحنفية إلى أنه إذا خرب ما حول المسجد واستُغني عنه، ولو مع بقائه عامراً، أو خرب المسجد ولا ما يُعمَّر به واستُغني عنه ببناء مسجد آخر، عاد إلى ملك الباني إن كان حياً، وإلى ورثته إن مات، خلافاً لأبي يوسف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} وعلّل محمد ذلك بأن الواقف عيّن الوقف لنوع قربة وقد انقطعت فينقطع هو أيضاً، فصار كحصير المسجد وحشيشه إذا استُغني عنه، وقنديله إذا خرب المسجد، فيعود إلى ملك متخذه، كالكفن إذا افترسه السبع يعود إلى مالكه، وكهدي الإحصار إذا زال الإحصار فأدرك الحج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} وعند أبي يوسف يُنقل إلى مسجد آخر بإذن القاضي، فيُباع نقضه بإذنه ويُصرف ثمنه إلى بعض المساجد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} ويتفرع على الخلاف أنه إذا انهدم الوقف ولا غلة فيه تعمّره، عاد إلى الباني أو ورثته عند محمد، لكن عند محمد إنما يعود إلى الملك ما خرج عن الانتفاع المقصود للواقف بالكلية، كحانوت احترق ولا يُستأجر بشيء؛ وما كان معداً للغلة لا يعود إلى الملك إلا أنقاضه، وتبقى ساحته وقفاً تُؤجَّر ولو بشيء قليل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} وقال الشافعية في مقابل الأصح إن الموقوف إذا تعطلت منفعته بسبب غير مضمون، كأن جفت الشجرة أو اقتلعتها ريح أو سيل، ولم يمكن إعادتها إلى مغرسها قبل جفافها، انقطع الوقف وعاد ملكاً للواقف أو وارثه، أما الأصح عندهم فلا يعود ملكاً بل يبقى وقفاً، والحكم كذلك عند الحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675}\n\nالنظر على الوقف. اتفق الفقهاء على أن النظر على الوقف يتبع شرط الواقف، فإذا جعل النظر لشخص معيّن اتُّبع شرطه، كما فعل عمر بن الخطاب حين جعل وقفه إلى ابنته حفصة تليه ما عاشت، ثم إلى ذوي الرأي من أهلها، كما نقل ابن قدامة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675} واختلفوا إذا شرط الواقف النظر لنفسه: فعند الحنفية والشافعية والحنابلة يجوز ذلك، أما المالكية فإن لم يحُز الموقوف عليه الوقف بطل بموت الواقف أو مرضه أو فَلَسه، وإن حازه الموقوف عليه وشرط الواقف النظر لنفسه صح الوقف، وأُجبر الواقف على أن يجعل النظر لغيره، إذ لا يجوز له أن يجعله لنفسه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675}\n\nوإن لم يشترط الواقف ناظراً، فعند المالكية والحنابلة: إن كان الوقف على غير معيّن كالفقراء والمساكين والمساجد، ولّى الحاكم عليه من يشاء، لأنه لا يمكنه تولي النظر بنفسه. وإن كان على معيّن رشيد فهو الذي يتولى أمره، لأنه ملكه ونفعه له فكان نظره إليه كملكه المطلق، فإن كان غير رشيد تولّى أمره وليّه، وفي احتمال عند الحنابلة، اختاره ابن أبي موسى، أن ينظر فيه الحاكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675}\n\nعند الحنفية اختلف الأقوال في ولاية النظر إذا لم يشترطها الواقف. فعند أبي يوسف، وهو الأصل، أن الولاية للواقف، ثم لوصيّه إن كان له وصي، وإلا فللحاكم؛ وعند هلال، وهو ظاهر المذهب، أنها للواقف، ثم لوصيّه أو للحاكم، لأن المتولي إنما يستفيد الولاية من الواقف بشرطه، فيستحيل أن يكون له الولاية وغيره يستفيدها منه، ولأن الواقف أقرب الناس إلى الوقف فيكون أولى بولايته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} وعند محمد لا تكون الولاية للواقف ما لم يشترطها، لأن التسليم إلى القيّم عنده شرط لصحة الوقف، فإذا سُلّم لم يبق للواقف ولاية فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} وإن مات الواقف ولم يجعل ولايته لأحد، جعل القاضي قيّماً من أهل بيت الواقف ما وجد من يصلح، لأنه أشفق أو لأن قصد الواقف نسبة الوقف إليه، فإن لم يجد فمن الأجانب من يصلح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} وعند الشافعية إذا لم يشترط الواقف النظارة لأحد، فالنظر للقاضي على المذهب، لأن له النظر العام؛ وقيل النظر للواقف لأنه كان إليه فيبقى على نظره؛ وقيل للموقوف عليه لأن الغلة له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677}\n\nشروط الناظر. اشترط الفقهاء لصلاحية الناظر شروطاً منها ما اتفقوا عليه ومنها ما اختلفوا فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676}\n\nالشرط الأول: التكليف. يتفق الفقهاء على أن الناظر يشترط فيه البلوغ والعقل، فلا تصح تولية الصبي ولا المجنون لعدم أهليتهما، وذلك في الجملة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} فعند المالكية والحنابلة إن لم يشترط الواقف ناظراً معيّناً، وكان الموقوف عليه معيّناً كزيد وعمرو، تولى أمر الوقف بنفسه، فإن كان صغيراً أو مجنوناً فوليّه يقوم مقامه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} وقال الحنابلة إن الملك في الموقوف ينتقل إلى الموقوف عليه إن كان آدمياً معيّناً أو جمعاً محصوراً، وينظر فيه إن كان رشيداً مكلفاً، أو وليّه إن كان صغيراً أو مجنوناً أو سفيهاً، وقال ابن أبي موسى ينظر فيه الحاكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677}\n\nوعند الحنفية نقل ابن عابدين عن الإسعاف أن التولية للصبي تبطل في القياس مطلقاً، وفي الاستحسان تبطل ما دام صغيراً، فإذا كبر كانت له الولاية؛ وقال الشلبي إن الإسناد للصغير لا يصح بحال، لأن النظر ولاية والصغير مولّى عليه فلا يولّى على غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} ورأى ابن عابدين في فتاوى رشيد الدين أن القاضي إذا فوّض التولية إلى صبي جاز إذا كان أهلاً للحفظ، وحمل ما في الإسعاف على من لا يقدر على التصرف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} وكما يمنع الجنون التولية ابتداءً يمنعها بقاءً، فلو جُنّ الناظر عُزل؛ ونقل ابن عابدين عن الفتح أن الناظر ينعزل بالجنون المطبق سنة لا أقل، فإن برئ عاد إليه النظر، قال في النهر إن هذا في المشروط له النظر، أما منصوب القاضي فلا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} ونص الشافعية على أن الجنون تنسلب به الولايات، وقال الشبراملسي إن المجنون إذا أفاق تعود إليه ولاية النظارة بنفس الإفاقة إذا كانت بشرط الواقف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678}\n\nالشرط الثاني: العدالة. يُشترط في ناظر الوقف أن يكون عدلاً، وفي ذلك تفصيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} فالحنفية اختلفوا في كونها شرط صحة أو شرط أولوية؛ فقال الإسعاف لا يُولّى إلا أمين قادر بنفسه أو بنائبه، لأن ليس من النظر تولية الخائن، ورأى ابن عابدين أن العدالة شرط أولوية لا شرط صحة، وأن الناظر إذا فسق استحق العزل ولا ينعزل، كالقاضي إذا فسق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679}\n\nوعند المالكية تُعتبر العدالة إذا كان الناظر منصوباً من القاضي أو من الواقف، فالنظر في الحبس لمن يجعله إليه الواقف، لمن يُوثق بدينه وأمانته؛ فإن كان الناظر سيئ النظر غير مأمون عزله القاضي، إلا أن يكون الموقوف عليه مالكاً أمر نفسه ويرضى به. وذكر القرافي أن القاضي لا يعزل ناظراً إلا بجنحة، وللواقف عزله ولو بغير جنحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678}\n\nوعند الشافعية تُشترط العدالة الظاهرة والباطنة في المنصوب من الحاكم، وقال السبكي ينبغي أن يُكتفى في المنصوب من الواقف بالعدالة الظاهرة، وقال الأذرعي تُشترط الظاهرة والباطنة فيه أيضاً، ورجّح الشربيني الخطيب الأول. وإذا فسق الناظر انعزل، فالنظر للحاكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} وقال الشافعية إن الناظر إذا فسق ثم صار عدلاً، عادت إليه الولاية إن كانت مشروطة في أصل الوقف منصوصاً عليها بعينها، وإلا فلا، أفتى بذلك النووي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} وقال الحنابلة إنه إذا كان النظر لغير الموقوف عليه، وكانت التولية من الحاكم، أو من ناظر أصلي، فلا بد من العدالة لأنها ولاية على مال، كالولاية على مال اليتيم؛ فإن لم يكن عدلاً أُزيلت يده حفظاً للوقف، فإن عاد إلى أهليته عاد حقه. وإن كان الناظر مشروطاً من الواقف فلا تُشترط فيه العدالة، ويُضم إلى الفاسق عدل، لأن مراعاة حفظ الوقف أهم من إبقاء ولاية فاسق، وإن كان النظر للموقوف عليه عدلاً كان أو فاسقاً فهو أحق به، وقيل يُضم إليه أمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680}\n\nالشرط الثالث: الكفاية، أي قوة الشخص وقدرته على التصرف فيما ينظر فيه. نص الشافعية والحنابلة على اشتراطها، لأن حفظ الوقف مطلوب شرعاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} فإن اختلت الكفاية، قال الشافعية ينزع الحاكم النظر من الناظر وإن كان مشروطاً له، وقال النووي إن زال الاختلال عاد نظره إن كان مشروطاً منصوصاً عليه بعينه. وقال الحنابلة إن اختلت الكفاية لا يُعزل الناظر، بل يُضم إليه أمين قوي ليحصل المقصود. أما الحنفية فقالوا يُعزل الناظر وجوباً إذا كان غير مأمون أو عاجزاً؛ وكلام المالكية يفيد اشتراط الكفاية أيضاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680}\n\nالشرط الرابع: الإسلام. قال الحنابلة يُشترط الإسلام في الناظر إن كان الموقوف عليه مسلماً، أو كانت الجهة كالمسجد، استناداً إلى سورة النساء، آية ١٤١، التي يستدل بها الحنابلة على هذا الشرط، فإن كان الوقف على كافر معيّن جاز أن يكون الناظر كافراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680} وأجاز الحنفية أن يكون الناظر ذمياً، ولا يشترطون الإسلام؛ فلو عزله القاضي لسبب ثم أسلم لم تعد إليه الولاية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680} وقال الرملي إن القياس على الوصية والنكاح صحة تولية الذمي للنظر إذا كان الموقوف عليه ذمياً وعدلاً في دينه، لكن يُرد ذلك باشتراط العدالة الحقيقية في باب الوقف، وقال الشبراملسي إن الرد هو المعتمد؛ وفرّق بينه وبين تزويج الذمي موليته بأن ولي النكاح يحمله وازع طبيعي على الحرص على تحصين موليته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17681}\n\nأجرة ناظر الوقف. تشمل المسألة أحقية الناظر في الأجرة، وتقديرها من الواقف أو القاضي، ومقدارها، وهل يستحق أجراً إذا لم يجعل له أحد أجراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17681} أ- أحقية الناظر: ذهب الفقهاء إلى أن الناظر يستحق أجرة نظير قيامه بإدارة الوقف والعناية بمصالحه. واستدلوا بقول عمر حين وقف أرضه بخيبر، إن على من يليها أن يأكل بالمعروف أو يُطعم صديقاً غير متمول فيه، وبفعل علي حين جعل نفقة العبيد الذين وقفهم ليقوموا بعمارتها من الغلة، وبالقياس على عامل الزكاة، وبحديث «ما تركت بعد نفقة نسائي ومؤنة عاملي فهو صدقة»، وقال ابن حجر إن مراد العامل فيه القيّم على الأرض، فيدل على مشروعية أجرته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682}\n\nب- تقدير الأجرة. إما أن تكون مشروطة من الواقف، فيأخذ الناظر ما شرطه ولو زاد على أجر المثل، وهذا قول الحنفية والشافعية والحنابلة؛ فعند الحنفية إن عيّن الواقف أقل من أجر المثل كمّل القاضي له أجر المثل بطلبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} وعند الشافعية إن جعل الواقف النظر لنفسه وشرط لنفسه أجراً لم يزد على أجرة المثل، فإن شرط أكثر لم يصح الوقف لأنه وقف على نفسه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} وقال الحنابلة إن شرط الواقف للناظر أجرة مقدرة، فإن كانت بقدر أجرة المثل اختص بها، وإن كانت أكثر فكلفة ما يحتاجه الوقف من أمناء وغيرهم تُصرف من الزيادة حتى يبقى له أجر مثله، إلا أن يكون الواقف شرطه له خالصاً. أما المالكية فلم يحددوا شيئاً وتركوا ذلك لتقدير الواقف أو القاضي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682}\n\nوإن لم يعيّن الواقف أجراً، فالأجر يقدّره القاضي: فعند الحنفية والحنابلة لا يزيد المقدَّر عن أجرة المثل، فإن عيّن زائداً مُنع عنه الزائد. وقال المالكية يُترك الأمر لاجتهاد القاضي، وقال ابن فتوح يجوز للقاضي أن يجعل لمن قدّمه للنظر رزقاً معلوماً في كل شهر باجتهاده بحسب عمله، وفعله الأئمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} وقال الشافعية إن لم يذكر الواقف للناظر أجرة فلا أجرة له على الصحيح، وليس له أن يأخذ شيئاً من مال الوقف، فإن فعل ضمن ولم يبرأ إلا بتسليمه إلى الحاكم، وهذا المعتمد. وإن رفع الناظر الأمر إلى القاضي ليقرر له أجرة، فهو كالوليّ إذا رفع أمر حفظ مال الطفل إلى القاضي؛ وذكر العراقي أن مقتضاه أنه يأخذ الأجرة مع الحاجة، إما قدر النفقة كما رجّحه الرافعي، أو الأقل من نفقته وأجرة مثله كما رجّحه النووي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683}\n\nج- إذا لم يعيّن الواقف أجراً للناظر. قال الرملي من الحنفية إن الناظر لا يستحق شيئاً إلا إذا جعل له القاضي أجرة مثل عمله. وحرر ابن عابدين أن الواقف إن عيّن شيئاً للناظر فهو له كثيراً كان أو قليلاً، عمل أو لم يعمل، ما لم يشترطه في مقابلة العمل؛ وإن لم يعيّن الواقف وعيّن القاضي أجرة مثله جاز، وإن عيّن أكثر مُنع الزائد، وإن لم يعمل فلا يستحق أجرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} وإن نصبه القاضي ولم يعيّن له شيئاً، فإن كان المعهود ألا يعمل إلا بأجرة مثله فله أجرة المثل، لأن المعهود كالمشروط، وإلا فلا شيء له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} وذكر ابن نجيم عن القنية رأيين للحنفية في منصوب القاضي إذا لم يعيّن له أجرة: الأول أنه لا شيء له ولو سعى فيه سنة، والثاني أن القيّم يستحق مثل أجر سعيه، شُرط له أجر أو لم يُشترط، لأنه لا يقبل القوامة ظاهراً إلا بأجر، والمعهود كالمشروط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683}\n\nوعند الشافعية إذا لم يشرط الواقف للناظر شيئاً فلا يستحق أجرة على الصحيح، فإن رُفع الأمر إلى الحاكم أُعطي عند الحاجة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17684} وعند الحنابلة ثلاثة آراء: الأول أن للناظر أن يأكل من غلة الوقف بالمعروف، محتاجاً كان أو غير محتاج، إلحاقاً له بعامل الزكاة، وهو ما ذهب إليه أبو الخطاب؛ والثاني أن له أن يأخذ الأقل من أجر المثل أو كفايته، قياساً على ولي اليتيم، ولا يستحق هذا إلا إذا كان فقيراً؛ والثالث أن للناظر المشهور بأخذ الأجر على عمله حقاً في أجر المثل، وهو قياس المذهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17684} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} وظاهر كلام المالكية أن القاضي يجعل للناظر أجرة في الأحباس، أو رزقاً معلوماً في كل شهر باجتهاده بحسب عمله، كما قال ابن فتوح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17684}\n\nجهة الأجرة. ذهب جمهور الفقهاء، وهم الحنفية والمالكية، ما عدا ابن عتاب، والشافعية والحنابلة، إلى أن ما يستحقه الناظر من أجر، مشروطاً من الواقف أو مقدراً من القاضي، يكون من غلة الوقف، واستدلوا بقول عمر حين وقف أرضه: لوالي هذه الصدقة أن يأكل منها غير متأثل مالاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} وقال ابن عتاب من المالكية إن أجر الناظر لا يكون إلا من بيت المال، فإن أُخذ من الأحباس رُدّ وأُخذ من بيت المال، فإن لم يُعط منها فأجره على الله؛ وعلّل الحطاب ذلك بأن الأحباس لا يُغيَّر لها شيء لأنها للوصايا، وأفتى بمثل قوله ابن ورد، لكن الدسوقي ضعّف قول ابن عتاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685}\n\nالعمل الذي يستحق به الناظر الأجرة. هو حفظ الوقف وعمارته وإيجاره وتحصيل ريعه من أجرة أو زرع أو ثمر، والاجتهاد في تنميته، وصرفه في جهاته من عمارة وإصلاح وإعطاء المستحقين، لأن ذلك هو المعهود. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} وتكون الأجرة من وقت ولايته، لأنها في مقابل العمل فلا تُستحق إلا بقدره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} وقال الحنابلة إن الناظر إذا فرّط سقط من معلومه بقدر ما فوّته على الوقف من العمل الواجب، فيوزع المقدر على ما عمله وما لم يعمله ويسقط قسط ما لم يعمله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} وقال الحنفية إن أهل الوقف إذا نازعوا القيّم وقالوا إن الواقف جعل الأجر في مقابلة العمل وهو لا يعمل شيئاً، فلا يكلفه الحاكم من العمل ما لا يفعله الولاة؛ فإن حلّت به آفة يمكنه معها الأمر والنهي والأخذ والإعطاء فله الأجر، وإلا فلا أجر له. ولو جعل الواقف له أكثر من أجر المثل جاز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685}\n\nومن مسائلهم: لو وقف أرضه على مواليه ثم مات، فجعل القاضي للوقف قيّماً وجعل له عشر الغلة، وفي الوقف طاحون في يد رجل بالمقاطعة لا يحتاج فيها إلى قيّم، والمستحقون يقبضون غلتها منه، فلا يستحق القيّم عشر غلتها، لأن ما يأخذه بطريق الأجرة، ولا أجرة بدون عمل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685}\n\nمحاسبة ناظر الوقف. من وظيفة الناظر تحصيل غلة الوقف والإنفاق منها على ما يحتاجه الوقف والصرف إلى المستحقين، ويتفق الفقهاء على محاسبته على ما ينفقه، سواء من القاضي أو من المستحقين، لكنهم يختلفون في قبول قوله في الإنفاق دون بينة، وفي قبوله مع اليمين إن لم تكن بينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685}\n\nقال الحنفية إنه لا يلزم القاضي أن يحاسب المتولي تفصيلاً على كل ما صرفه من غلات الوقف، بل يكتفي منه بالإجمال إن كان معروفاً بالأمانة، أما إن كان متهماً فإن القاضي يجبره على التفسير شيئاً فشيئاً، ولا يحبسه، بل يحضره يومين أو ثلاثة ويخوّفه، فإن فسّر وإلا اكتفى منه باليمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} ونقل الدر عن القنية أن القاضي إن اتهمه حلّفه، ولو كان أميناً، كالمودع يدعي هلاك الوديعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} وتباينت أقوال الحنفية فيما لو ادعى المتولي الدفع إلى المستحقين: فقال الدر إنه يُقبل قوله بلا يمين، وخالف الإسعاف والبحر، فقال الإسعاف إن قال المتولي قبضت الأجرة ودفعتها إلى المستحقين وأنكروا، كان القول قوله مع يمينه، كالمودَع إذا ادعى رد الوديعة، ويبرأ مستأجر عقار الوقف من الأجرة لاعتراف المتولي بقبضها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} ونقل ابن عابدين عن الخير الرملي أن الفتوى على أنه يحلف في هذا الزمان؛ وفي الفتاوى الحامدية عن أبي السعود أن المتولي إن كان مسرفاً مبذراً لا يُقبل قوله بصرف مال الوقف بيمينه، وعن الشلبي أن من اتصف بصفات مخالفة للشرع صار بها فاسقاً لا يُقبل قوله فيما صرفه إلا ببينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686}\n\nوأما قبول قول الناظر الثقة بعد العزل، فذكر الحموي أن ظاهر كلامهم القبول، لأن العزل لا يخرجه عن كونه أميناً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687} ونقل صاحب الدر عن المنلا أبي السعود تفصيلاً: إن ادعى المتولي الدفع من غلة وقف على أولاده أو أولاد أولاده قُبل قوله، وإن ادعى الدفع لأرباب الوظائف كالإمام والمؤذن لم يُقبل، كمن استأجر شخصاً للبناء في الجامع بأجرة معلومة ثم ادعى تسليمها له، وقد استحسن التمرتاشي هذا التفصيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687}\n\nوقال المالكية إن مات الواقف وعُدم كتاب الوقف، قُبل قول الناظر في الجهات التي يصرف عليها إن كان أميناً، ما لم يكن للوقف شهود في أصله فلا يصرف إلا باطلاعهم. وإن ادعى أنه صرف من ماله على الوقف صُدّق بلا يمين إن لم يكن متهماً، وإلا حلف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687} وذكر الحطاب واقعة سُئل فيها السيوري عن إمام مسجد ومؤذنه ومتولي أموره، اتهمه محتسب بعد أعوام بفضلة في غلة حوانيت، فقال المتولي إنه لم يفضل شيء، فأجاب السيوري بأن القول قوله فيما زعم أنه أخرجه إذا كان يشبه ما قال، وقال البرزلي إن ذلك ما لم يُشترط عليه دخل وخرج بإشهاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687}\n\nوفرّق الشافعية بين أن يكون المستحقون معيّنين كزيد وعمرو، فالقول قولهم ولهم مطالبة الناظر بالحساب، وبين أن يكونوا غير معيّنين كالفقراء، فهل للإمام مطالبته بالحساب؟ وجهان أوجههما الأول، ويُصدَّق في قدر ما أنفقه عند الاحتمال، فإن اتهمه الحاكم حلّفه؛ والمراد إنفاقه فيما يرجع إلى العادة، وفي معناه الصرف إلى الفقراء ونحوهم من الجهات العامة، بخلاف إنفاقه على الموقوف عليه المعيّن فلا يُصدَّق فيه لأنه لم يأتمنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688}\n\nوفرّق الحنابلة بين الناظر المتبرع بنظره وغيره، وهو الذي يأخذ أجراً؛ فيُقبل قول المتبرع في الدفع لمستحق، وإن لم يكن متبرعاً لم يُقبل قوله إلا ببينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688} وقال البهوتي والمرداوي إنه لا اعتراض لأهل الوقف على من ولاه الواقف إذا كان أميناً، ولهم مساءلته عما يحتاجون إلى عمله، ولولي الأمر أن ينصب ديواناً يستوفي حساب أموال الأوقاف عند المصلحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688}\n\nعزل ناظر الوقف ومن له حق العزل. سبق بيان شروط الناظر وحكم عزله إذا اختل شرط منها؛ وفيما يلي من له حق العزل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688}\n\nأولاً: حق الواقف في العزل. الشافعية والحنابلة يفرّقون بين أن يشترط الواقف النظر لنفسه في ابتداء الوقف ثم يسنده إلى غيره، وبين أن يشترطه لغيره من البداية. فإن شرطه لنفسه ثم أسنده إلى غيره، فله عزله ونصب غيره، لأن ذلك نائب عنه، كما يعزل الموكل وكيله؛ وهذا الصحيح عند الشافعية، والصحيح عند الحنابلة على تصحيح الفروع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688} ونبه الشربيني الخطيب إلى أن مقتضى ذلك أن للواقف العزل بلا سبب، وصرّح به السبكي، وأفتى كثير من المتأخرين، منهم ابن رزين، بأنه لا يجوز العزل بلا سبب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17689} وفي وجه عند الشافعية والحنابلة ليس له العزل، لأن ملكه قد زال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17689}\n\nأما إذا شرط الواقف النظر لشخص حال الوقف، فليس له عزله ولو لمصلحة عند الشافعية، لأنه لا نظر له بعد أن شرطه لغيره؛ ولذلك لو عُزل الناظر المشروط نفسه أو فسق، فتولية غيره إلى الحاكم لا إلى الواقف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17689} وقال الحنابلة إن شرط الواقف النظر لغيره وشرط أن له عزله، كان له عزله، وإلا فلا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17689}\n\nوعند الحنفية يرى محمد بن الحسن أنه لو شرط الواقف أن تكون الولاية له ولأولاده في تولية القوّام وعزلهم والاستبدال، وسلّم الوقف إلى المتولي، جاز ذلك وكان له العزل؛ وإن لم يشترط لنفسه ولاية العزل فليس له عزله بعد تسليم الولاية، لأنه قائم مقام أهل الوقف، وقال الصدر الشهيد إن الفتوى على قول محمد. وقال ابن عابدين إن ذلك مبني على الخلاف في اشتراط التسليم إلى المتولي، فهو شرط عند محمد، أما عند أبي يوسف فالولاية ثابتة للواقف سواء شرط ذلك أو لم يشرطه، لأن التسليم ليس شرطاً عنده، وهو قول هلال وظاهر المذهب، وإذا ولّى الواقف غيره كان وكيلاً عنه وله عزله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690} قال الرملي إن هذا صريح في جواز العزل بجنحة وبغيرها، لأنه وكيل وللموكل عزل الوكيل مطلقاً؛ وقال الدر إن الفتوى على قول أبي يوسف، وقال البحر إن مشايخ بلخ يفتون بقوله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690}\n\nوعند المالكية لا يجوز أن يشترط الواقف النظر لنفسه، وإنما يتبع شرطه في تعيين الناظر، فإن شرط أن يكون فلان ناظراً لم يجز العدول عنه. وقال البدر القرافي إن للواقف عزله ولو لغير جنحة، ونص ابن عرفة على أن المحبس له عزل من رأى له أهلاً واستبداله، وقال الحطاب إن من حبس شيئاً وجعله على يد غيره ثم أراد عزله ليس له ذلك إلا بموجب يظهر، كالقاضي إذا قدّم أحداً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690}\n\nثانياً: حق القاضي في العزل. للقاضي الولاية العامة، فيثبت له عزل الناظر المشروط له النظر من قبل الواقف إذا ثبتت خيانته، أو لم يتوفر فيه شرط من الشروط السابقة، ولا يجوز له عزله بلا سبب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690} أما إذا كان القاضي هو الذي أسند إليه النظارة، فذهب المالكية والشافعية وبعض الحنفية إلى أنه لا يجوز عزل من ولاه القاضي إلا بسبب كخيانة أو غيرها، وعند الحنابلة وبعض الحنفية يجوز عزل الناظر بلا خيانة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690}\n\nتعدد نظار الوقف. يجوز أن يكون للوقف ناظر واحد أو أكثر كما نص الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690} فإن أسند الواقف النظر لاثنين، فعند الشافعية والحنابلة وأبي حنيفة لا يصح تصرف أحدهما مستقلاً عن الآخر، لأن الواقف لم يرض برأي أحدهما، إلا إذا شرط لكل واحد النظر فيصح تصرف كل منهما منفرداً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17691} ولو جعل عمارة الوقف لواحد وتحصيل ريعه للآخر صح، ولكل منهما ما شرطه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17691} وعند أبي يوسف يجوز أن ينفرد كل من الناظرين بالتصرف، وقال الحنفية إن جعل الواقف النظر لرجل ثم جعل وصياً لآخر كانا ناظرين شريكين، إلا أن يخصص كل منهما بما فُوّض إليه في مجلس واحد، فينفرد كل منهما بما فُوّض إليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17691}\n\nولو جعل الواقف النظر لأفضل أولاده وكانوا سواء في الفضل فلا يشتركون فيه، وإنما يكون لأكبرهم سناً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} وإذا قبل أحد الناظرين وردّ الآخر، أو مات أحدهما، أو قام به مانع، أقام الحاكم مقامه آخر، وهو قول الحنفية والشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} وعند الشافعية إذا شرط الواقف أن يكون الناظر الأرشد من أولاده، فادعى كل منهم الأرشدية، اشتركوا في النظر إن وُجدت الأهلية فيهم، ولا يستقل أحد منهم بالتصرف، لأن الأرشدية سقطت بتعارض البينات وبقي أصل الرشد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17691}\n\nتفويض الناظر النظر لغيره. لا يجوز للناظر أن يفوّض النظر إلى من أراد أو يوصي به إلى غيره، إلا إذا جعل له الواقف ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} قال الحنفية إن كان تفويض الواقف للمتولي عاماً، أي أقامه مقام نفسه وجعل له أن يسند النظر ويوصي به إلى من شاء، جاز له التفويض في صحته وفي مرض موته المتصل بالموت؛ وإن لم يكن عاماً، فلا يصح التفويض في الصحة، ويصح في مرض الموت لأنه بمنزلة الوصي، وللوصي أن يوصي إلى غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} وقال الشافعية إن الواقف إذا جعل النظر لفلان وله أن يفوض النظر إلى من أراد، فالمذهب أن نظر المفوِّض يزول، فليس للواقف ولا للمفوَّض إليه عزل المفوَّض إليه، ولا يعود النظر إلى المفوِّض بعد موته، لأن التفويض بمثابة التمليك؛ والرأي الثاني، وهو للسبكي، أن المفوَّض إليه وكيل عن المفوِّض، فإن مات المفوِّض عاد النظر إليه، وإن مات المفوَّض إليه عاد النظر إلى المفوِّض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17693} وقال الحنابلة إن الناظر المشروط له النظر إن كان موقوفاً عليه، فله نصب وكيل عنه وعزله، لأصالة ولايته، وإن لم يكن موقوفاً عليه فليس له نصب ناظر ولا الوصية بالنظر ما لم يُشترط له ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17693}\n\nانتهاء الوقف. من صور انتهاء الوقف عودة الموقوف إلى ملك الواقف، سواء بسبب تعطل الموقوف وخرابه وعدم صلاحيته للانتفاع، أو بسبب الوقف على جهة تنقطع، أو بالنسبة للوقف المؤقت الذي أجازه المالكية، وقد ذُكرت هذه المسائل في ثنايا البحث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17693}"
  en: "Waqf, lexically, is detention: to hold back a thing in God's way; it also means prevention and stillness, and the word names the thing held. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579} Technically the jurists define it in several ways: for the Hanafi companions, the detention of a thing in God's ownership with its use given to whom the founder wishes; for Abu Hanifa, its detention in the founder's ownership with the use given as charity; for the Malikis, the grant of the use of a thing for as long as it exists, the ownership remaining with the grantor even notionally; for the Shafi'is, the detention of property whose use can be had with its substance kept, the disposal of its ownership cut off, for a lawful and existing purpose; for the Hanbalis, the detention by an owner of his property whose use is kept in its substance, with its income given to a charitable purpose seeking God's favour. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579}\n\nRelated words: tabarru' (giving without return, wider than waqf), sadaqa (gift in life without return, which may also name waqf, as in 'Umar's land), hiba (gift without return), 'ariya (the permission to use a thing while its owner keeps it), and wasiyya. The difference from a gift is that waqf transfers the use while the substance stays in God's ownership and cannot be disposed of, whereas a gift transfers the thing itself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581}\n\nWasiyya: the Hanafis define it as a transfer of ownership attached to what comes after death, and the Shafi'is similarly. It differs from waqf: a bequest takes effect after death and may be of the thing or of its use, while waqf is a gift made in life and only of the use. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581}\n\nThe legality of waqf: the majority of jurists hold it lawful, binding and a recommended act of devotion, citing the report of Ibn 'Umar that 'Umar got land at Khaybar and the Prophet told him, if he wished, to hold back its substance and give its produce in charity; the saying that when a man dies his deeds end except for three, among them continuing charity; and the report of Jabir that every wealthy man among the emigrants and the helpers held back property in endless charity. Ibn Qudama calls this consensus of the Companions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17582} Ibn 'Abidin, quoting al-Is'af, says waqf is lawful according to Abu Hanifa and his companions; the disagreement is about its binding character: for Abu Hanifa it is like a loan of use, with the ownership remaining with the founder, binding only by a judge's ruling or when made as a bequest. Ibn Qudama reports Shurayh as not accepting it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17582} On its legal ruling: it is basically a recommended act of devotion; it becomes obligatory when vowed; it is permitted when not made for the sake of devotion, as a dhimmi's waqf, which has no reward; and forbidden when it serves sin, as an endowment for a church. The Malikis mention that an endowment only for sons and not daughters is forbidden as resembling the custom of the pre-Islamic age, but Ibn al-Qasim preferred disliking it and enforcing it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17582}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583}\n\nThe pillars of waqf: the majority (Malikis, Shafi'is, Hanbalis) count four: the formula, the founder, the beneficiary and the thing endowed; the Hanafis count only the formula. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583} Waqf is not valid without an offer, and the jurists differ on whether acceptance is required. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583}\n\nThe formula of offer: whatever shows the founder's intent by word, a clear sign, writing or act. The express words are 'I endowed' (waqaftu), which the Malikis, Shafi'is and Hanbalis hold express, and 'I detained' (habastu), express for the Hanbalis, the Maliki view and the sounder Shafi'i view, and 'I made a way' (sabbaltu), express for the Shafi'is and Hanbalis in the sounder view, since custom has fixed their use and the Prophet's words to 'Umar use the same. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17584} The allusive words are 'I gave in charity' (tasaddaqtu), which the Hanbalis and Malikis count allusive, and which the Shafi'is count express when it is joined to a general beneficiary such as the poor, and otherwise allusive; also 'I forbade' and 'I made eternal', allusive for the Hanbalis and the sounder Shafi'i view; they make a waqf only when joined to a clear sign, such as 'a charity endowed', 'a charity never to be sold, given or inherited', or when intention is added. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17584}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17585}\n\nWhen the administrator holds, from the endowment's income, a sum that may properly go to a work of charity, such as ransoming Muslim captives or aiding a stranded fighter, and the endowment needs repair, then: if delaying repair until next year's income causes no clear harm that threatens the endowment's ruin, the income goes to the charity and repair is postponed; if the delay causes clear harm, the income goes first to repair and only the surplus to the charity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} Ibn Najim states that an administrator who pays the beneficiaries while repair that cannot be delayed is due becomes liable, because the upkeep the endowment needs is excluded from the poor's right. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661}\n\nFor the Hanafis, where repair is necessary, such as raising a roof or building a wall, it takes precedence over all other uses, since it is not proper care to let a mosque fall into ruin for the sake of what is given to the imam and the muezzin; any surplus over the repair goes to the beneficiary nearest to the founder's purpose whose loss would cause clear harm. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} Where repair is not necessary, so that leaving it until the next year's income would not ruin the thing, the more important need comes first. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} The Hanafis separate the case where the founder stipulated that repair be given priority each year, when the administrator keeps the amount aside each year even if it is not yet needed, from the case of silence, when repair is paid when needed and nothing is saved for it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} When part of an endowed building or its materials has fallen, the judge spends it on repair; if the means of repair are not ready at once, he keeps it until they are. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661}\n\nFor the Shafi'is, the surplus of a mosque's income above what its repair needs, reckoned by the cost of its rebuilding, is saved, and with the balance a property is bought and endowed; this is safer for the mosque, and it is not bought from the endowed thing whose upkeep it is, since the founder endowed that thing for upkeep. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662}\n\nThe jurists differ on the source from which the endowed thing and its upkeep are paid. The Hanafis and Malikis hold that it comes from the endowment's income whether or not the founder stipulated this, since the endowment is a continuing charity in God's way and can continue only in this manner; the Malikis add that a stipulation to the contrary is void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} For the Hanafis, if the founder gave a house for his son's residence, its repair falls on the one who lives in it, from his own money and not from the income, since the burden follows the benefit; if he refuses or cannot pay because he is poor, the judge lets the house, from him or from another, and repairs it from the rent, and the one who refuses is not compelled to repair. The Malikis agree. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} The Malikis say that a horse endowed for raiding is fed from the public treasury; if there is no treasury, it is sold and its price buys weapons and similar things that need no feeding. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662}\n\nThe Shafi'is and Hanbalis follow the founder's terms. For the Shafi'is, the feeding, the equipping and the repair are paid from the source named; failing that, from the endowed thing's own benefits, such as a slave's earnings or a property's rent; if its benefits cease, the feeding and the equipping come from the public treasury, while repair is then owed by no one, because a property is like absolute ownership, unlike a living animal, whose life and sanctity must be preserved. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663} For the Hanbalis, the founder's terms govern. If he named a source of feeding, whether the income or another, that is followed. If he did not name one and the endowed thing is a living being, such as a slave or horses, it is fed from its own income; if there is no income, the feeding falls on the named beneficiary. If the feeding is impossible, the thing is sold and its price is spent on another thing that becomes an endowment; if it can be let out, it is let out for enough to feed it. If the beneficiary is unnamed, as the poor are, the feeding comes from the public treasury. For property, such as buildings, weapons and goods, repair is owed by no one unless the founder made it a condition. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663}\n\nThe jurists agree that whoever wrongfully damages an endowment, by demolition or otherwise, must pay. For the Hanafis, a man who lets an endowed house, and whose tenant uses its courtyard to tether animals and wrecks it, is liable, because he acted without permission. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663} For the Malikis, whoever wrongfully demolishes an endowment must rebuild it as it was, even if what was demolished was decayed; but the preponderant view among them is that he owes its value, like any other destroyed property. Ibn 'Arafa accepted this view and 'Iyad made it well known. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663} For the Shafi'is, no one is liable for a book endowed for the pursuit of learning that is lost in his hands without his fault; but whoever is at fault is liable, and using the book for a purpose other than the one endowed is a fault. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663}\n\nWhen an endowed thing needs repair or upkeep and its income does not suffice, may the administrator borrow on the endowment, and does he need permission? The Malikis, Hanbalis and, in one view, the Hanafis hold that the administrator may borrow for the endowment without the judge's permission, as with his other acts, since he is a trusted agent with full power to act. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} The Malikis say that if an administrator undertook, on taking up the office, to spend from his own money on the endowment when needed, he is not bound by that, but he may recover what he spent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} For the Shafi'is, the administrator may not borrow without the founder's condition or the ruler's permission. The ruler may lend him money from the public treasury, permit him to borrow, or permit him to spend his own money on repair on condition that he may recover it. If he borrows without permission or condition, it is not allowed, and he cannot recover what he spent, since he transgressed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664}\n\nThe preferred Hanafi view is that borrowing on an endowment is not allowed unless it is needed for the endowment's good, such as repair or buying seed, and then only on two conditions: the judge's permission, and that letting the thing and spending its rent is not possible; if the judge is far away, the administrator may borrow on his own authority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} Ibn 'Abidin says borrowing is not allowed without the founder's order, because a debt attaches only to a person's liability; an endowment has no liability, the poor have liability but they cannot in practice be pursued, so the debt falls on the administrator alone. Necessity overrides this analogy; Abu al-Layth's preferred view is that borrowing is allowed with the judge's permission when there is no alternative and the judge is not far from the administrator, because the judge's authority covers the public interests of Muslims more widely. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} Where there is an alternative, such as paying the beneficiaries, borrowing for that is not allowed, except for what is given to the imam, the preacher and the muezzin, and the mats and oil of a mosque, on the preferred view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664}\n\nIf the judge's permission is required and the administrator claims to have had it, the claim is apparently not accepted without evidence, because he wants to take from the income, and his word is accepted only about what is in his hand. If he did not obtain permission, it is forbidden for him to take from the income, since he is then a volunteer, until permission is established. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} Ibn 'Abidin says that if the administrator spent his own money to repair the endowment, he may recover it from the endowment's income; the fatwa of al-Hanuti holds that he may recover it in conscience, but his claim is not accepted unless he had it witnessed that he spent in order to recover. This applies only where the endowment has income; without income, the judge's permission is necessary. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665}\n\nSecond, the sale of an endowment and its exchange. When an endowed thing is disabled and can no longer be used, the Hanafis, Malikis, Hanbalis and, in one view, the Shafi'is allow its sale and the spending of the price on a like thing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} The Hanafis allow sale and exchange even when the endowment is not disabled, under special conditions; the Malikis, in general, distinguish between real estate and movable goods. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665}\n\nThe Hanafis recognise three cases of exchange. In the first, the founder stipulates, at the endowment, that the endowed land may be exchanged for another land, either for himself or for another. This has two formulas; the first is to say: 'my land is an endowed charity to God forever, on condition that I sell it and buy with its price another land', and then the second land is endowed on the first's terms. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} Abu Yusuf, Hilal and al-Khassaf hold that the endowment and the condition are valid by juristic preference, which is the sound view according to the Fatawa Qadikhan; the condition does not undo the endowment, since an endowment can pass from one land to another, and the second stands in place of the first. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} For example, if an usurper floods an endowed land until it becomes a sea unfit for farming, he pays its value and buys another land which becomes an endowment on the first's terms; likewise, if its yield has fallen through blight and does not exceed its costs, the good of the endowment lies in exchange, so the founder may validly stipulate the power of exchange even when the need is not present now. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666}\n\nMuhammad and Yusuf ibn Khalid al-Samti hold that the endowment is valid and the condition void, which is the analogical view. Sarakhsi justifies Muhammad's view: the condition does not prevent the endowment from ending, so the endowment is completed, while the exchange stands as a void condition in itself, like a mosque on which an exchange is stipulated or where it is stipulated that only some people may pray. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} Some Hanafi jurists say the endowment and the condition are both void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} Kamal ibn al-Humam reports from al-Ansari that the condition is valid but the sale may be made only with the judge's permission, and the judge should permit a sale when there is no benefit in the endowment and he sees it is better for its beneficiaries. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666}\n\nIf the founder stipulated that the land be sold and another bought with its price, without adding a further endowment formula, the second land becomes an endowment on the first's terms without renewed formula, because the land was already fixed for the endowment and its price takes its place. By analogy the endowment would be void, since no other land was named to stand in the first's place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} The second formula: if the founder stipulated the right of exchange for the administrator and not for himself, the administrator may exchange for himself, since giving power to another follows from owning the power oneself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667}\n\nIf the right of exchange is stipulated for another man together with the founder, the founder alone holds the right, and the other man does not hold it alone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} Exchange under a stipulation is allowed even if the thing yields income and benefit, since the endowment does not thereby leave use, and neither the judge's direct action nor the absence of income for repair is required. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} The Hanafis limit exchange to what the founder stated in kind and type: if he stipulated exchange for land, it may not be made for a house; if he stipulated the land of a village, it may not be made for other land, since village lands differ in cost and yield; if he did not specify the replacement, he may exchange for any real estate, whether land, house or town, as he wishes, since the stipulation is general. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} If the stipulation covers one exchange, the founder may not exchange the second land for a third, since the condition was fulfilled only in the first, unless the words express that. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667}\n\nThe second case: the founder did not stipulate exchange at the endowment, whether he stipulated its absence or was silent, but the endowment came to a state in which it gives no benefit at all, such as giving no yield or not covering its upkeep. Exchange in this case is allowed on the sounder view when the judge permits it and sees the good in it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} Ibn 'Abidin reports from al-Bahr that Qadikhan's words differ: in one place he allowed the judge to exchange without the founder's stipulation where he saw the good; in another he forbade it even when the land had come to a state where no benefit could be had. The sound view is that the judge may exchange on the following conditions, the first of which is that the endowed thing is wholly taken out of use. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667}\n\nAmong the conditions for exchange, as the Hanafis state them: the sale must not be at a gross undervaluation; the endowment must have some yield with which it can be repaired; the exchanger must be a man of knowledge and action, so that the endowments of Muslims are not undermined; the replacement must be real estate and not cash; and the thing may not be sold to someone whose testimony cannot be accepted in his favour or to a creditor of the founder's heirs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} The exchanged and the replacement should be of one kind. Ibn 'Abidin, quoting Qanali-zada, says that the sameness of kind is probably not required for an endowment held for its yield, since what counts is a large return and little upkeep: exchanging a shop for land that yields rent equal to the shop's rent is better, because land lasts longer and needs less repair; whereas an endowment held for residence is judged by the residence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} In al-Qunya, a house endowment may be exchanged for another house only if the new one is in the same quarter or in a better quarter; the reverse is not allowed, even if the house held is larger in area, value and rent, because it may fall into ruin in the lesser quarter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668}\n\nThe Bahr al-Ra'iq, citing the commentary on Ibn Wahban's poem, asks whether exchange is allowed when the founder forbade it, or when the administrator is removed before exchanging, or when he is removed as soon as he decides to exchange. Tarsusi replies that there is no transmitted ruling, and that the rules of the school mean the judge may exchange when he sees the good in it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} The same work reports from Muhammad that if an endowed land has weakened in yield, and the administrator can buy with its price another land with higher yield, he may sell and buy that. Some shaykhs forbade sale and exchange whether or not the endowment had ceased to yield. Qadikhan says that an endowment without a stipulation of exchange may not be sold or exchanged even if its land is salty and unusable, because an endowment is meant to be perpetual and is not sold; the power of exchange arises only from a stipulation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669}\n\nThe third case: the founder did not stipulate exchange; the endowment has yield and is not disabled; but exchange would bring some general benefit, and the replacement is better in benefit and yield. Ibn 'Abidin says that this is not allowed on the preferred view, as Qanali-zada settled it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} Ibn 'Abidin also reports from al-Ashbah that a productive endowment may be exchanged only in four cases: first, when the founder stipulated exchange; second, when a usurper flooded the land into a sea, so that he pays its value and the administrator buys land with it; third, when the usurper denies the seizure and there is no evidence, so that the administrator takes the value to buy a replacement; and fourth, when someone desires the land and offers a replacement with more yield and a better location, which is allowed on Abu Yusuf's view and is the fatwa, as in the fatwas of Qari al-Hidaya. The author of al-Nahr says that Sadr al-Shari'a's rebuttal stands against this: we do not give fatwa on the view of Abu Yusuf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669}\n\nExchange of endowed property among the Malikis. The Malikis distinguish between real estate and movable goods in sale and in exchange. They allow exchange of movable goods when no party can maintain them and they are in danger of perishing, or when their benefit has ceased so that they cannot be used for the purpose for which they were detained. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} Thus a horse endowed in God's way, for raiding or frontier guard, is fed from the public treasury; if there is no treasury, it is sold and the price buys weapons and similar things that need no feeding. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} Any movable endowment that is not real estate and cannot be used is sold, such as a horse that has caught rabies, a cloth that wears out, a slave who grows old, or books that decay. Its price is spent on a like thing if possible, or on a share of such a thing if the whole cannot be bought, and if that is impossible the price is given in charity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} Likewise male animals endowed for raiding or breeding, when there are more of them than needed, or females that have grown too old to be of use, are sold and young females bought with the price, so that milk and offspring continue and the endowment remains, as al-Dardir says of ostriches. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670}\n\nFor real estate, the Maliki school holds that it may not be sold even if it is ruined and cannot be used, whether a house, shops or other buildings, and it may not be exchanged for a like unruined thing. Abu al-Faraj reports from Malik that the imam may sell it, if he sees the good in it, and spend the price on a like thing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} Some Malikis allowed the exchange of a ruined dwelling. Al-Taj wal-Iklil reports the absolute prohibition of selling a ruined dwelling of an endowment; Ibn al-Jahm gives the reason that someone will be found to repair it by renting it for years, so that it returns to its former state. The exchange of a ruined dwelling for an unruined one is disputed. Ibn Rushd says that if such a piece of land has lost all use and cannot be repaired or let, there is no harm in exchanging it for a place that will be endowed in its stead, by the judge's ruling after the cause is proved and the advantage to the endowment is clear; this is to be recorded and witnessed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670}\n\nThe Malikis allow the sale of real estate for the necessary widening of a congregational mosque, whether the endowment is held for named or unnamed persons. Ibn Rushd says that the apparent report of Ibn al-Qasim's collection allows it for every mosque, as does Sahnun's view; al-Nawadir reports from Malik and others that it applies to congregational mosques when there is need, and not to neighbourhood mosques, since the necessity there is not the same. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} Endowed property may also be sold to widen a graveyard or a road used by people, even against the will of the beneficiaries or the administrator; the beneficiaries are bound to have the price put into another endowment, but the judge may not compel them to accept a different endowment in its place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} Al-Sharh al-Saghir says that for property taken to widen a mosque, the price is paid if the endowment was held for named persons; if it was held for unnamed persons, such as the poor, no compensation is due, since no named person has a right attached to it, and the reward the founder gains when the property enters the mosque is greater than what he first intended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671}\n\nThe Malikis say that if the founder stipulated change and exchange, his condition is followed. If he stipulated that, should a desirable price be offered, the property be sold and another bought, al-Nawadir and al-Mutiyya report that this is not allowed; if it is done nevertheless, it stands and the founder's condition is applied. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} Fath al-'Ali al-Malik reports a case: an endowed land on a road used by Muslims, whose founder stipulated that it not be sold or exchanged, was exchanged by the administrator of the road for a state land, the administrator handing the endowed land to a farmer and taking state land in return. Dardir holds that where the founder stipulated no exchange and gave no exception, the exchange is void; the administrator must return the state land to its owner and take back the endowed land itself, and the ruler restrains anyone who refuses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671}\n\nExchange of endowed property among the Shafi'is. The Muhadhdhab says that if a mosque is endowed and then ruined so that prayer in it ceases, it does not return to ownership, and the owner may not dispose of it, because what left ownership for God's right does not return to ownership by ruin, as a man who frees a slave and then becomes disabled does not reclaim him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} Al-Sharbini says that the sounder view allows selling the mats of an endowed mosque when they have worn out, and its beams when they have broken or nearly so and are fit for nothing but burning, lest they be lost and the space be crowded with them to no purpose; a small sum from their price returning to the endowment is better than losing them. Such things are not counted as a sale of the endowment, since they are treated as nonexistent; this is the view on which the two shaykhs, al-Rafi'i and al-Nawawi, relied. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672} Al-Rafi'i says that the analogy is to buy a replacement mat with the price of the old one, and al-Adhra'i takes the mentioned case to be straw used in clay. Mats given or bought for a mosque are sold when needed. Beams that can be used for other things, such as planks and doors, are never sold. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672} If a mosque is at risk of falling, the judge may strip it and use the material to build another mosque, if he sees fit, and building it nearby is better; but he may not build a well with the material of a mosque. If an endowment on a bridge is destroyed by a flood and the bridge is not needed where it stands, it may be moved to where it is needed; the income of an endowment on a frontier that has become secure is kept by the administrator, in case the frontier returns. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672}\n\nIf an endowed date palm dries, an endowed animal is disabled, or the beams of a mosque break, there are two views, and the sounder is that they may not be sold, as with a mosque. The other view allows sale, since the thing is no longer hoped to yield benefit; the price then takes the rule of the value that comes from the destruction of endowed property. If the ownership of the endowed thing's substance is held to belong to the beneficiary, which is the lesser view, the price goes to him; if it belongs to God, which is the more apparent view, a like thing is bought with the price to become an endowment in its place. Abu Hamid al-Isfara'ini says that the price buys a like thing to become an endowment in its place, without dispute. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672}\n\nExchange of endowed property among the Hanbalis. Among them exchange is allowed when the endowed thing is no longer fit for the purpose for which it was endowed and no longer serves to be used, whether it is movable or real estate, and whether it is a mosque or not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} They hold that selling an endowment is forbidden and invalid, and that exchanging it, even for something better, is invalid by explicit text, except where its intended benefit is lost through ruin and its yield cannot repair it, in which case it is sold; or where its intended benefit is lost by a cause other than ruin, such as wood that has cracked and is feared to fall. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} If the endowment is a mosque whose intended use is lost because it is too narrow for its people and cannot be widened, or because its neighbourhood is ruined, or because the place is filthy and prevents prayer in it, then, according to al-Qadi, sale is valid and the price is spent on a like thing, because keeping it so is a waste of property. Since an endowment is perpetual, when that cannot be kept in the same thing its purpose is preserved in another, and a succession of replacements is treated like the things themselves. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} A dried endowed tree may be sold; so may a beam that has broken, worn out or is feared to break or fall. Al-Talkhis says that when an endowed beam is near breaking, or an endowed house near collapse, and it is known that delay would take it out of use, it is sold to protect its value. Schools, hospices and caravanserais that are endowed may, when ruined, be sold by one view without dispute. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} An endowed horse for raiding that is no longer fit is sold and another horse fit for it is bought; once the replacement is bought it becomes an endowment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} A founder's stipulation that an unusable endowment not be sold is void, and it must be sold. The seller is the judge where the endowment is for a public good, such as the poor, mosques or bridges; where it is held for a named person or named group, or for the worshippers or muezzins of a mosque, the endowment's special administrator sells it. Even so, it is best done with the judge's permission, because such a sale binds those who come after the present holders, like a sale made against an absent party. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} Once the replacement is bought for the endowment's use it becomes an endowment; the prudent course is to re-endow it by a new formula, lest a later person, not seeing that the purchase made it an endowment, undo it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674}\n\nThe return of an endowment to the founder's ownership. Muhammad ibn al-Hasan of the Hanafis holds that if what surrounds a mosque is ruined and no longer needed, even while the mosque remains maintained, or if the mosque itself is ruined with no means to repair it and people no longer need it because another mosque has been built, then it returns to the ownership of its builder if he is alive, or to his heirs if he is dead; Abu Yusuf disagrees. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} Muhammad's reason: the founder gave the endowment to a kind of devotion, and since that devotion has ended the endowment ends with it. It is like a mosque's mat and grass when no longer needed, or its lamp when the mosque is ruined, which return to the one who made them; like a shroud that a beast has torn, which returns to its owner; and like an offering made by one who is prevented from completing the pilgrimage, which he may dispose of once the hindrance is removed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} Abu Yusuf says that it is moved to another mosque with the judge's permission, and its debris is sold with the judge's permission and the price spent on some mosques. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674}\n\nThe Hanafi consequence is that if an endowment falls into ruin and has no income to repair it, it returns to the builder or his heirs in Muhammad's view, though not in Abu Yusuf's. But in Muhammad's view, only what has left the founder's intended use altogether returns to ownership, such as a shop that burned and cannot be let for anything, or a hostel or a neighbourhood cistern that is ruined with no means of repair; what was made for income returns to ownership only as its debris, while its open ground remains an endowment that is let, even for a small rent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} Khulasa reports that Muhammad said of a horse that was made a detained endowment in God's way and became unfit to ride that it is sold and its price goes to its owner or his heirs, as with a mosque. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} The Shafi'is, in the view opposite to the sounder, say that if an endowed thing loses its benefit through a cause that is not chargeable, such as a tree drying or being uprooted by wind or flood before it can be replanted, the endowment ends and the thing returns to the founder or his heir. The sounder Shafi'i view is that it does not return to ownership but remains an endowment; the Hanbalis agree. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675}\n\nThe administration of an endowment. The jurists agree that the administration of an endowment follows the founder's condition. If he assigns it to a named person, his condition is followed, as 'Umar ibn al-Khattab did when he left his endowment to his daughter Hafsa to manage for her life, and then to the people of sound judgement of her kin, as al-Bayhaqi reports. Ibn Qudama says that the disposal of an endowment follows the founder's condition, and so does its administrator. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675} The jurists differ on whether the founder may assign administration to himself. The Hanafis, Shafi'is and Hanbalis allow it. The Malikis say that if the beneficiary has not taken possession of the endowment, the endowment is void by the founder's death, illness, or bankruptcy; if the beneficiary has taken possession and the founder stipulated administration for himself, the endowment stands, but the founder is compelled to assign administration to another, since he may not assign it to himself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675}\n\nIf the founder names no administrator, the Malikis and Hanbalis hold that where the endowment is for unnamed persons, such as the poor, the mosques, the ruler appoints whom he chooses, since he cannot himself administer it. Where the endowment is for a named beneficiary of sound mind, that beneficiary administers it, since it is his ownership and his benefit, so that his supervision is like absolute ownership. If he is not of sound judgement, his guardian administers it. There is a possibility in the Hanbali school, which Ibn Abi Musa chose, that the ruler administers it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675}\n\nOn the administration of an endowment where the founder did not stipulate it, the Hanafi views differ. Abu Yusuf holds that the endowment belongs to God and the administration goes first to the founder, then to his executor, then to the judge. Hilal, the apparent view of the school, holds that the administration belongs to the founder, then to his executor or the judge, because an administrator derives his authority from the founder's stipulation, so it is impossible that he should have authority while another derives it from him; and the founder is the person nearest to the endowment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} Muhammad holds that the founder has no administration unless he stipulated it, because for him handing the endowment over to a custodian is a condition of its validity, so that once it is handed over the founder has no authority over it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} If the founder dies without naming an administrator, the judge appoints a custodian from among the founder's family while a suitable person can be found there, either because such a person is the most solicitous or because the founder meant the endowment to be attributed to them; only if none is found does he appoint an outsider. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} The Shafi'is hold, on the school's view, that if the founder names no administrator, administration belongs to the judge, who has general authority over such matters. A second view gives it to the founder, who had it, and a third gives it to the beneficiary, since the income is his. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677}\n\nThe qualifications of an administrator. The jurists set several conditions for an administrator's fitness; some are agreed and some are disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676}\n\nThe first condition is legal capacity. The jurists agree that an administrator must be adult and sane, since a minor or a mentally ill person lacks the capacity; this holds in general. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} The Malikis and Hanbalis add that if the founder names no administrator and the beneficiary is a named person, such as Zayd or 'Amr, the beneficiary administers it himself; if he is a minor or insane, his guardian stands in for him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} The Hanbalis say that the ownership of an endowed thing passes to the beneficiary if he is a named human or a limited group, and he administers it if he is adult and sound of judgement, or his guardian does if he is a minor, insane or a spendthrift; Ibn Abi Musa says the judge administers it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677}\n\nThe Hanafis: Ibn 'Abidin quotes al-Is'af that appointing a minor as administrator is void by analogy in every case, and by juristic preference void while he is a minor, so that the administration passes to him when he grows up; al-Shilbi holds that the assignment to a minor is never valid, since administration is a form of guardianship and a minor under guardianship cannot be given guardianship over others. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} Ibn 'Abidin cites the fatwas of Rashid al-Din that a judge who assigns administration to a minor who is able to keep the property does so validly, since it grants him authority to act; the two views can be reconciled by reading al-Is'af as concerning a minor unable to act. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} Insanity prevents appointment and also ends it once it occurs; Ibn 'Abidin quotes al-Fath that an administrator is removed by permanent insanity lasting at least a year, and that if he recovers, administration returns to him, though al-Nahr says this holds for one named by the founder and not for one appointed by the judge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} The Shafi'is state that administration is stripped by insanity, and al-Shabramallisi says that when a sane person returns to a founder-named administrator, the office returns by recovery alone without a new appointment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678}\n\nThe second condition is justice (adala). The Hanafis differ whether it is a condition of validity or of preference. Al-Is'af says that no one is appointed except a trustworthy and capable person, whether acting himself or through a deputy, because removing a dishonest person from office is not part of administration. Ibn 'Abidin holds that justice is a condition of preference, not of validity, and that an administrator who turns to wrongdoing deserves removal but is not removed automatically, as a judge who turns to wrongdoing is not removed on the sound and fatwa view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679}\n\nThe Malikis treat justice as a condition when the administrator was appointed by the judge or by the founder. Al-Hattab says that administration of a detained endowment belongs to the one the founder chose, who must be one trusted in religion and honesty; if the founder is negligent, administration falls to the judge, who sets up someone he approves. If the administrator is badly managing and not to be trusted, the judge removes him, unless the beneficiary owns his own affairs and accepts him. Al-Qarafi says that a judge removes an administrator only for a fault, but the founder may remove him even without one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678}\n\nThe Shafi'is require apparent and inner justice in an administrator the judge appoints. Al-Subki says that for one appointed by the founder, apparent justice should suffice; al-Adhra'i requires both apparent and inner justice in that case too, and al-Sharbini prefers the first view. If the administrator becomes a wrongdoer he is removed, and then the administration passes to the judge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} Al-Shafi'iyya say that if an administrator becomes a wrongdoer and then just again, his authority returns if it was made a condition in the endowment's terms and named exactly; otherwise it does not. Al-Nawawi gave this fatwa, and Ibn al-Rif'a and others agreed; al-Zarkashi says it is apparent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679}\n\nThe Hanbalis hold that if administration belongs to someone other than the beneficiary, and the appointment was by the judge or by an original administrator, justice is required, because it is authority over property, like guardianship over an orphan's property. If he is not just, his hand is removed from the endowment to preserve it, and if he returns to fitness his right returns. If the administrator was set by the founder, justice is not required, and a trustworthy person is added to the wrongdoer; his authority is removed only where its removal is needed to keep the endowment, since preserving the endowment matters more than leaving a wrongdoer in authority over it. Where administration belongs to the beneficiary himself, whether just or not, he has the better claim to it, since he owns the endowment and so administers for himself; some say a trustworthy person is added to him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680}\n\nThe third condition is capability (kifaya), meaning the strength and ability of the person to act in what he administers. The Shafi'is and Hanbalis require it, since preserving an endowment is a religious duty and someone without capability cannot preserve it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} If capability is lost, the Shafi'is say the judge removes administration from him even if it was assigned to him by the founder. Al-Nawawi says that when the defect ends, his administration returns if it was stipulated in the endowment and named exactly. The Hanbalis say that if capability is lost he is not removed, but a strong and trustworthy administrator is added to him, to achieve the purpose. The Hanafis say that the administrator must be removed where he is not trustworthy or is incapable (the OCR text reads 'the founder' here, probably a slip for the administrator, flagged as a doubt). The Malikis' words also imply that capability is required. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680}\n\nThe fourth condition is Islam. The Hanbalis hold that an administrator must be Muslim if the beneficiary is Muslim or the object is a mosque or the like, relying on Surat al-Nisa, verse 141, which they cite for this condition. If the endowment is for a named unbeliever, an unbeliever may be made administrator. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680} The Hanafis allow a dhimmi to be administrator and do not require Islam; if the judge removes a dhimmi for some reason and he then converts, administration does not return to him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680} Al-Ramli holds that analogy with the will and marriage makes valid a dhimmi's administration of an endowment for a dhimmi beneficiary, provided he is upright in his religion, but this is rejected because the endowment requires real justice; al-Shabramallisi says the rejection is the sound view. He distinguishes a dhimmi's marriage of his ward, where the guardian has a natural restraint from wishing to protect his ward from shame, which does not apply to an endowment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17681}\n\nThe administrator's wage. The subject covers his right to a wage, whether it is set by the founder or the judge, its amount, and whether he is due one where neither has named it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17681} On the right to a wage: the jurists hold that an administrator is due a wage for his work in running the endowment and caring for its affairs. The evidence they cite includes 'Umar's words when he endowed his land at Khaybar, that whoever administers it may eat in reasonable measure or feed a friend without making profit from it; 'Ali's making the upkeep of the slaves he endowed to work the land a charge on the income; the analogy with the collector of zakat; and the saying attributed to the Prophet that what remains after his wives' maintenance and his worker's wage is charity. Ibn Hajar says that the worker there means the custodian of the land, so the saying shows that his wage is lawful. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682}\n\nOn the setting of the wage. If the founder set it, the administrator takes what the founder fixed even if it exceeds the usual wage; this is the view of the Hanafis, Shafi'is and Hanbalis. The Hanafis say that if the founder fixed less than the usual wage, the judge completes it on request. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} The Shafi'is say that if the founder made himself administrator and fixed a wage for himself, it may not exceed the usual wage; if he fixed more, the endowment is void, since it would be an endowment upon himself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} The Hanbalis say that if the founder fixed a stated wage, and it equals the usual wage, the administrator takes it; if it is more, the costs of what the endowment needs, such as the trustees and others, are paid from the excess until only the usual wage remains, unless the founder gave it to him outright. The Malikis fixed no amount and left it to the founder or the judge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682}\n\nIf the founder set no wage, the judge fixes it. The Hanafis and Hanbalis hold that the judge's wage must not exceed the usual wage, and if he sets more, the excess is withheld. The Malikis leave the matter to the judge's discretion; Ibn Fattuh says the judge may give the appointed administrator a fixed monthly stipend according to his work, as the imams did. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} The Shafi'is say that if the founder names no wage, the administrator has no wage on the sound view and may not take anything from the endowment; if he does take it, he is liable and is discharged only by handing it to the judge. If the administrator asks the judge to fix a wage for him, he is like a guardian of an orphan's property who asks the judge to set his fee. Al-Iraqi, who reports al-Balqini's view, says that the administrator then takes the wage where there is need, either the amount of his maintenance, as al-Rafi'i preferred, or the lesser of his maintenance and the usual wage, as al-Nawawi preferred; another view is that he is due the usual wage even if it exceeds his maintenance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683}\n\nIf the founder set no wage. Al-Ramli of the Hanafis says that the administrator is due nothing unless the judge fixes a wage for his work. Ibn 'Abidin concludes that where the founder names a sum for the administrator, he has it, whether large or small, whether or not he works, provided it is not set in return for work; where the founder names none and the judge fixes the usual wage, that is valid; if he fixes more, the excess is withheld; and if the administrator does no work he is due no wage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} If the judge appoints an administrator and names no wage, then, where the custom is that the work is not done without the usual wage, he is due the usual wage, since custom is like a stipulation; otherwise nothing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} Ibn Najim, citing al-Qunya, reports two Hanafi views on a judge's appointee who is given no wage: the first is that he has nothing even if he works a year; the second is that the custodian is due a wage like the effort he gives, whether or not the judge or the residents of the quarter set a wage for him, since no one accepts custody publicly without a wage, and custom is like a stipulation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683}\n\nWhere the endowment has administrators, the Malikis and Hanbalis and the Shafi'is treat the wage in a particular way. The Shafi'is hold that if the founder assigned no wage to the administrator, he is not entitled to one on the sound view; if the matter is referred to the judge, he is given one where there is need, as explained above. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17684} The Hanbalis have three views. The first is that the administrator may eat from the endowment's income in reasonable measure, whether he is needy or not, by analogy with the collector of zakat; this is the view of Abu al-Khattab. The second is that he takes the lesser of the usual wage or his maintenance, by analogy with the guardian of an orphan, and is entitled to it only if he is poor. The third is that an administrator known to take a wage for his work has a right to the usual wage, which is the analogy of the school. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17684} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} The Malikis, as Ibn Fattuh says, let the judge give a set monthly stipend in endowments, fixed by his judgement of the work. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17684}\n\nThe source of the wage. The majority of jurists, namely the Hanafis, the Malikis except Ibn 'Attab, the Shafi'is and the Hanbalis, hold that the administrator's wage, whether set by the founder or by the judge, comes from the endowment's income, citing 'Umar's words on his endowment that whoever administers it may eat from it in reasonable measure without accumulating property. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} Ibn 'Attab, of the Malikis, held that the wage comes only from the public treasury; if it is taken from endowments it is returned and recovered from the treasury, and if not given, his reward is with God. Al-Hattab explains that nothing should be taken from endowments because they are for bequests. Ibn Warad gave a fatwa in his view, but al-Dasuqi weakened Ibn 'Attab's view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685}\n\nThe work that earns the wage is to preserve the endowment, repair it, let it, collect its yield (rent, crop or fruit), strive to develop it, and spend it on its purposes, such as repair, upkeep and the beneficiaries, since that is what is customary for such work. The wage runs from the time the administrator takes up the office, and is due in proportion to the work. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} The Hanbalis say that if an administrator neglects his duty, his fixed wage is reduced by the amount his neglect cost the endowment; what is set for him is divided between what he did and what he did not, and the share for what he did not do falls away. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} The Hanafis say that if the beneficiaries dispute with an administrator who says the founder fixed a wage for work while he does nothing, the judge does not impose tasks that the rulers themselves do not perform. If an impediment comes upon him that stops him ordering, forbidding, taking and giving, he has no wage; if not, he keeps it. If the founder fixed more than the usual wage, that is permitted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} In one case, the owner of an endowed land died and the judge appointed a custodian and gave him a tenth of the income, while a mill in the endowment was held by a man on a lump-sum lease and needed no custodian, and the beneficiaries collected its yield from him; the custodian has no right to a tenth of that yield, since his wage is payment for work and there is no wage without work. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685}\n\nThe accounting of an administrator. It is the administrator's duty to collect the endowment's yield, spend from it on what the endowment needs, and pay the beneficiaries. The jurists agree that he must account for what he spends, whether he is called to account by the judge or by the beneficiaries. They differ on whether his word about his spending is accepted without evidence, and, if there is no evidence, whether his oath is required. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685}\n\nThe Hanafis say that the judge need not require a detailed account of every sum the administrator has spent from the endowment's income; a general account suffices if he is known to be trustworthy. If he is suspected, the judge makes him explain item by item, and does not imprison him, but summons him for two or three days and warns him; if he explains, well and good, otherwise the judge takes his oath. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} Al-Durr quotes al-Qunya that if the judge suspects him he makes him swear, even if he is trustworthy, as a depositary who claims that a deposit was lost must swear. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} The Hanafi views differ on the claim that the administrator paid the beneficiaries. Al-Durr says his word is accepted without oath. The Is'af says that if he says he received the wage and paid it to the beneficiaries, and they deny it, his word is accepted with his oath and he is not liable, as a depositary who claims to have returned a deposit when the depositor denies it. The lessee of the endowed property is discharged by the administrator's acknowledgement of receiving the rent. If he says the rent was lost or stolen after he received it, his word with oath is accepted, since he is trustworthy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} Ibn 'Abidin reports from al-Khayr al-Ramli that the fatwa is that he swears in this age. The Hamidiyya quotes Abu al-Su'ud as ruling that if the administrator is a squanderer, his oath is not accepted on his spending of endowment property. Al-Shilbi holds that a wrongdoer whose conduct breaks the Law is not believed on what he spent unless he has proof. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686}\n\nWhether a trusted administrator's word after his removal is accepted: al-Hamawi says the apparent view is that it is, since removal does not take away his trustworthiness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687} Mulla Abu al-Su'ud draws a further distinction: if the administrator claims to have paid from an endowment's income to beneficiaries whom the founder named as his children or grandchildren, his word is accepted; if he claims to have paid holders of offices, such as the imam and the muezzin, it is not, just as a man who hired a builder for a known wage in a mosque and then claims to have paid him is not believed. Al-Tamartashi praised this distinction. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687}\n\nThe Malikis hold that if the founder dies and the endowment deed is lost, the administrator's word is accepted about the purposes on which he spends, if he is trustworthy. If he claims to have spent the yield, it is accepted if he is trustworthy, unless the deed had witnesses at its making, in which case he spends only with their knowledge. If he claims to have spent his own money on the endowment, it is accepted without oath unless he is suspected, and then he swears. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687} Al-Hattab reports a case put to al-Suri: an imam, a muezzin and the general administrator of a mosque were charged years later by a market inspector with a surplus from the rent of shops; the administrator denied any surplus and refused to state his spending, saying he was not bound to, and that without him the endowment would be lost. Al-Suri ruled that his word is accepted about what he says he spent, if it resembles what he said. Al-Barzali adds that this holds where no condition was set requiring a record of income and spending, except with witnesses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687}\n\nThe Shafi'is distinguish between beneficiaries who are named, such as Zayd and 'Amr, whose word on what is paid to them is accepted and who may demand accounts, and unnamed beneficiaries, such as the poor. Where the beneficiaries are unnamed, it is disputed whether the ruler may demand accounts; of two views, the more apparent is that he may. The administrator is believed about the amount he spent, where that is probable; if the judge suspects him, he makes him swear. Al-Azra'i explains that what is meant is spending in accordance with custom; the payments to the poor and other general purposes are included, but spending on a named beneficiary is not believed, since that beneficiary did not entrust him with it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688}\n\nThe Hanbalis distinguish the administrator who serves without pay from one who takes a wage. The word of a volunteer administrator is accepted about a payment to a beneficiary; a paid administrator's word is not accepted without evidence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688} Al-Buhuti and al-Mirdawi say that the beneficiaries may not object to a trusted administrator whom the founder appointed; they may question him about what their endowment needs, so that their knowledge equals his; and the ruler may set up an office to audit endowment accounts when it is in the public interest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688}\n\nThe removal of an endowment's administrator, and who has the right to remove him. The conditions for an administrator and the rule when one fails were set out above; here is who may remove him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688}\n\nFirst, the founder's right to remove his appointee. The Shafi'is and Hanbalis distinguish between a founder who at the start kept administration for himself and later assigned it to another, and a founder who gave it to another from the outset. In the first case he may remove and appoint someone else, since the assignee stands in for him, as a principal removes his agent; this is the sound view of the Shafi'is and the sound and correct view of the Hanbalis in the corrected text of al-Furu'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688} Al-Shirbini notes that this implies the founder may remove without cause, and al-Subki says so in his fatwas; but many later scholars, among them Ibn Razin, ruled that removal without cause is not permitted. A Shafi'i and Hanbali view denies him any removal, since his ownership has gone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17689}\n\nIn the second case, where the founder names an administrator at the endowment's creation, the Shafi'is say that he may not remove him, even for a reason of advantage, since he has no authority after assigning it to another. Hence if the administrator so named removes himself or becomes a wrongdoer, the appointment of a replacement belongs to the judge, not the founder. The Hanbalis say that if the founder named an administrator and stipulated for himself the right to remove him, he may remove him; if not, he may not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690}\n\nThe Hanafis: Muhammad ibn al-Hasan holds that if the founder stipulated for himself and his children the right to appoint and remove custodians, and to exchange the endowment, and all such authority, and then handed the endowment over to the administrator, the founder may remove him. If he did not stipulate the right to remove, he may not do so after handing over, because the administrator stands in place of the beneficiaries. Al-Sadr al-Shahid says that the fatwa follows Muhammad's view. Ibn 'Abidin says this rests on whether handing over is a condition, which it is for Muhammad and is not for Abu Yusuf. For Abu Yusuf the founder has authority whether or not he stipulated it, since handing over is not a condition; if he appoints another he is a deputy and may remove him, whether he stipulated the right or not. Hilal, al-Fath and al-Bahr hold this to be the apparent view, and the shaykhs of Balkh gave fatwa on Abu Yusuf's view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690} Al-Ramli says that this is plain: removal is valid for cause or without cause, since he is a deputy, and a principal may remove his agent in every case. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690}\n\nThe Malikis hold that the founder may not stipulate administration for himself; he follows his own condition in naming the administrator, and if he named a particular person he may not change to another. Al-Qarafi says that the founder may remove an administrator even without cause; al-Hattab says that one who has appointed someone to administer his endowment may remove him only for a cause that appears. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690}\n\nSecond, the judge's right to remove. The judge has general authority, so he may remove an administrator whom the founder named if the administrator's dishonesty is proved or if he lacks one of the required conditions; he may not remove him without cause. Where the judge himself appointed the administrator, the Malikis, the Shafi'is and some Hanafis hold that he may not be removed except for a cause, such as embezzlement or some other fault; the Hanbalis and some Hanafis hold that he may be removed without embezzlement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690}\n\nThe plurality of administrators. An endowment may have one administrator or more, as the jurists state. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690} If the founder assigns administration to two persons, the Shafi'is, the Hanbalis and Abu Hanifa hold that neither may act alone, since the founder did not accept either's judgement alone; but if the founder names each of them, each may act alone. Abu Yusuf allows each of two administrators to act alone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17691} The Hanbali text adds that if the founder assigns the repair of the endowment to one man and the collection of its yield to another, each has his assignment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17691} The Shafi'is say that if the founder stipulates that the administrator be the most upright of his children, and they all share that uprightness, they share the office; if one is manifestly more upright, he alone holds it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17691} The Hanafis hold that if the founder names a man and then names a guardian for a minor, they are both administrators, the guardian sharing the office; unless the founder specifies, saying, for example, that he endowed his land on a named beneficiary and gave its administration to one man, and named another as executor of his estate and all his affairs, in which case each acts alone within his own assignment. Ibn 'Abidin cites al-Is'af for this. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17691} If the founder gives administration to the most virtuous of his children and they are equal in virtue, they do not share it and it goes to the eldest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} If the founder gave the administration to two men and one accepts and the other refuses, or dies, or is disqualified, the judge appoints another in his place; the Hanafis, Shafi'is and Hanbalis agree. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692}\n\nThe delegation of administration by an administrator. Except where the founder allowed it, the jurists hold that an administrator may not delegate administration to whomever he wishes or bequeath it to another. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} The Hanafis say that if the founder's delegation to the administrator was general, meaning that he stood in the founder's place and could assign and bequeath administration to whomever he chose, he may delegate it in health and in his last illness; if it was not general, he may not delegate it in health, but only in his last illness, since he is like an executor, and an executor may appoint another. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} The Shafi'is say that if the founder says he has assigned administration to a named person, who may delegate it to whomever he wishes, the delegation is valid. Whether the first person's administration then ceases is disputed: the school's view is that it does, since delegation is like a transfer of ownership, so that neither the founder nor the delegate can remove the new administrator, and it does not return to the delegator after his death. Al-Subki's view is that the delegate is the delegator's agent, so if the delegator dies administration returns to the delegate, and if the delegate dies it returns to the delegator. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17693} The Hanbalis say that an administrator named by the founder, if he is himself a beneficiary, may appoint an agent and remove him, since his authority is original, as a person disposes of his own property. If he is not a beneficiary, he may not appoint an administrator or bequeath the office, unless the founder stipulated that he may appoint whomever he chooses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17693}\n\nThe end of an endowment. One way an endowment ends is the return of the endowed thing to the founder's ownership: when the thing is ruined and no longer fit for use, when the endowment is for a class of beneficiaries that comes to an end, or in the case of a temporary endowment, which the Malikis allow. These cases have been discussed in the course of the article. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17693}"
  es: "Waqf, léxicamente, es detención: retener algo en el camino de Dios; también significa prevención y quietud, y la palabra nombra la cosa retenida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579} Técnicamente, los juristas lo definen de varias maneras: para los compañeros Hanafi, la detención de una cosa en propiedad de Dios con su uso dado a quien el fundador desee; para Abu Hanifa, su detención en propiedad del fundador con el uso dado como caridad; para los Malikis, la concesión del uso de una cosa mientras exista, la propiedad permanece con el otorgante incluso nocionalmente; para los Shafi'is, la detención de propiedad cuyo uso puede tenerse con su sustancia conservada, la disposición de su propiedad cortada, para un propósito lícito y existente; para los Hanbalis, la detención por un propietario de su propiedad cuyo uso se conserva en su sustancia, con sus ingresos dados a un propósito caritativo buscando el favor de Dios. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579} Palabras relacionadas: tabarru' (dar sin retorno, más amplio que waqf), sadaqa (donación en vida sin retorno, que también puede llamar waqf, como en la tierra de 'Umar), hiba (donación sin retorno), 'ariya (el permiso para usar una cosa mientras su dueño la conserva) y wasiyya. La diferencia con una donación es que waqf transfiere el uso mientras la sustancia permanece en la propiedad de Dios y no se puede disponer de ella, mientras que una donación transfiere la cosa en sí. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581} Wasiyya: los Hanafis la definen como una transferencia de propiedad vinculada a lo que viene después de la muerte, y los Shafi'is de manera similar. Se diferencia del waqf: un legado tiene efecto después de la muerte y puede ser sobre la cosa o sobre su uso, mientras que el waqf es un regalo hecho en vida y solo sobre el uso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581} La legalidad del waqf: la mayoría de los juristas lo consideran lícito, vinculante y un acto de devoción recomendado, citando el relato de Ibn 'Umar de que 'Umar obtuvo tierras en Khaybar y el Profeta le dijo que, si lo deseaba, retuviera su sustancia y diera su producto en caridad; el dicho de que cuando un hombre muere sus obras terminan excepto tres, entre ellas la caridad continua; y el relato de Jabir de que todo hombre rico entre los emigrantes y los ayudantes retuvo propiedades en caridad perpetua. Ibn Qudama llama a esto consenso de los Compañeros. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17582} Ibn 'Abidin, citando a al-Is'af, dice que el waqf es lícito según Abu Hanifa y sus compañeros; el desacuerdo está en su carácter vinculante: para Abu Hanifa es como un préstamo de uso, con la propiedad permaneciendo en el fundador, vinculante solo por el fallo de un juez o cuando se hace como un legado. Ibn Qudama informa que Shurayh no lo aceptaba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17582} Sobre su dictamen legal: es básicamente un acto de devoción recomendado; se vuelve obligatorio cuando se hace un voto; está permitido cuando no se hace por el bien de la devoción, como el waqf de un dhimmi, que no tiene recompensa; y prohibido cuando sirve al pecado, como una dotación para una iglesia. Los malikíes mencionan que una dotación solo para hijos varones y no hijas está prohibida por asemejarse a la costumbre de la época preislámica, pero Ibn al-Qasim prefirió desaprobarla y hacerla cumplir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17582}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583} Los pilares del waqf: la mayoría (malikíes, shafi'ís, hanbalíes) cuentan cuatro: la fórmula, el fundador, el beneficiario y la cosa dotada; los hanafíes cuentan solo la fórmula. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583} El waqf no es válido sin una oferta, y los juristas difieren en si se requiere la aceptación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583} La fórmula de la oferta: todo aquello que muestra la intención del fundador mediante palabras, una señal clara, un escrito o un acto. Las palabras expresas son 'yo doté' (waqaftu), que los malikíes, shafi'ís y hanbalíes consideran expresas, y 'yo detuve' (habastu), expresa para los hanbalíes, la visión malikí y la visión shafi'í más sólida, y 'yo hice un camino' (sabbaltu), expresa para los shafi'ís y los hanbalíes en la visión más sólida, ya que la costumbre ha fijado su uso y las palabras del Profeta a 'Umar usan lo mismo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17584} Las palabras alusivas son 'di en caridad' (tasaddaqtu), que los hanbalíes y malikíes consideran alusivas, y que los shafi'ís consideran expresas cuando se unen a un beneficiario general como los pobres, y de otro modo alusivas; también 'prohibí' y 'hice eterno', alusivas para los hanbalíes y la visión shafi'í más sólida; hacen un waqf solo cuando se unen a un signo claro, como 'una caridad dotada', 'una caridad que nunca se venderá, dará ni heredará', o cuando se agrega la intención. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17584}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17585} Cuando el administrador posee, de los ingresos del fondo, una suma que puede destinarse a una obra de caridad, como el rescate de cautivos musulmanes o la ayuda a un combatiente varado, y el fondo necesita reparación, entonces: si retrasar la reparación hasta los ingresos del próximo año no causa un daño claro que amenace la ruina del fondo, los ingresos se destinan a la caridad y se pospone la reparación; si el retraso causa un daño claro, los ingresos se destinan primero a la reparación y solo el excedente a la caridad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} Ibn Najim afirma que un administrador que paga a los beneficiarios mientras se debe realizar una reparación que no se puede retrasar se vuelve responsable, porque el mantenimiento que necesita la dotación está excluido del derecho de los pobres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} Para los Hanafi, cuando la reparación es necesaria, como levantar un techo o construir un muro, tiene precedencia sobre todos los demás usos, ya que no es un cuidado apropiado dejar que una mezquita caiga en ruinas por el bien de lo que se le da al imán y al muecín; cualquier excedente sobre la reparación va al beneficiario más cercano al propósito del fundador cuya pérdida causaría un daño claro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} Cuando la reparación no es necesaria, de modo que dejarla hasta el ingreso del año siguiente no arruinaría la cosa, la necesidad más importante viene primero. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} Los Hanafis separan el caso en que el fundador estipuló que la reparación se diera prioridad cada año, cuando el administrador guarda la cantidad cada año incluso si aún no es necesaria, del caso de silencio, cuando la reparación se paga cuando es necesaria y no se ahorra nada para ella. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} Cuando parte de un edificio dotado o sus materiales se han caído, el juez lo gasta en reparación; si los medios de reparación no están listos de inmediato, lo guarda hasta que lo estén. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} Para los shafi'ís, el excedente de los ingresos de una mezquita por encima de lo que necesita para su reparación, calculado según el costo de su reconstrucción, se ahorra, y con el saldo se compra una propiedad y se la dota; esto es más seguro para la mezquita, y no se compra de la cosa dotada cuyo mantenimiento es, ya que el fundador dotó esa cosa para su mantenimiento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} Los juristas difieren en cuanto a la fuente de la que se paga la cosa dotada y su mantenimiento. Los hanafíes y los malikíes sostienen que proviene de los ingresos de la dotación, independientemente de que el fundador lo haya estipulado o no, ya que la dotación es una caridad continua en el camino de Dios y solo puede continuar de esta manera; los malikíes añaden que una estipulación en contrario es nula. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} Para los hanafíes, si el fundador dio una casa para la residencia de su hijo, su reparación recae sobre quien vive en ella, con su propio dinero y no con los ingresos, ya que la carga sigue al beneficio; si se niega o no puede pagar porque es pobre, el juez arrienda la casa, a él o a otro, y la repara con el alquiler, y quien se niega no está obligado a reparar. Los malikíes están de acuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} Los malikíes dicen que un caballo dotado para saquear es alimentado con el tesoro público; si no hay tesoro, se vende y su precio compra armas y cosas similares que no necesitan ser alimentadas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} Los shafi'ís y los hanbalíes siguen los términos del fundador. Para los shafi'ís, la alimentación, el equipamiento y la reparación se pagan con la fuente nombrada; si no, con los propios beneficios de la cosa dotada, como las ganancias de un esclavo o el alquiler de una propiedad; si sus beneficios cesan, la alimentación y el equipamiento provienen del tesoro público, mientras que la reparación no la debe nadie, porque una propiedad es como la propiedad absoluta, a diferencia de un animal vivo, cuya vida y santidad deben preservarse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663} Para los hanbalíes, rigen los términos del fundador. Si nombró una fuente de alimentación, ya sea el ingreso u otra, se sigue. Si no nombró a un beneficiario y la cosa donada es un ser vivo, como un esclavo o caballos, se alimenta con sus propios ingresos; si no hay ingresos, el alimento recae sobre el beneficiario nombrado. Si el alimento es imposible, la cosa se vende y su precio se gasta en otra cosa que se convierte en una donación; si se puede arrendar, se arrienda por lo suficiente para alimentarla. Si el beneficiario no está nombrado, como los pobres, el alimento proviene del tesoro público. Para bienes, como edificios, armas y mercancías, nadie debe repararlos a menos que el fundador lo haya establecido como condición. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663} Los juristas coinciden en que quien dañe indebidamente una donación, por demolición o de otra manera, debe pagar. Para los hanafíes, un hombre que arrienda una casa donada, y cuyo inquilino usa su patio para atar animales y la destruye, es responsable, porque actuó sin permiso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663} Para los malikíes, quien demuele injustamente una donación debe reconstruirla como estaba, incluso si lo que fue demolido estaba deteriorado; pero la opinión predominante entre ellos es que debe su valor, como cualquier otra propiedad destruida. Ibn 'Arafa aceptó esta opinión y 'Iyad la dio a conocer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663} Para los shafi'ís, nadie es responsable de un libro donado para la búsqueda del conocimiento que se pierde en sus manos sin su culpa; pero quien tiene la culpa es responsable, y usar el libro para un propósito distinto al donado es una falta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663} Cuando un bien dotado necesita reparación o mantenimiento y sus ingresos no son suficientes, ¿puede el administrador pedir prestado sobre la dotación y necesita permiso? Los malikíes, los hanbalíes y, según una opinión, los hanafíes sostienen que el administrador puede pedir prestado para la dotación sin el permiso del juez, como con sus otros actos, ya que es un agente de confianza con pleno poder para actuar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} Los malikíes dicen que si un administrador se comprometió, al asumir el cargo, a gastar de su propio dinero en la dotación cuando fuera necesario, no está obligado por ello, pero puede recuperar lo que gastó. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} Para los shafi'ís, el administrador no puede pedir prestado sin la condición del fundador o el permiso del gobernante. El gobernante puede prestarle dinero del tesoro público, permitirle pedir prestado o permitirle gastar su propio dinero en reparaciones con la condición de que pueda recuperarlo. Si pide prestado sin permiso o condición, no está permitido, y no puede recuperar lo que gastó, ya que transgredió. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} La opinión preferida de los hanafíes es que pedir prestado sobre una dotación no está permitido a menos que sea necesario para el bien de la dotación, como reparaciones o compra de semillas, y entonces solo bajo dos condiciones: el permiso del juez, y que no sea posible arrendar la cosa y gastar su renta; si el juez está lejos, el administrador puede pedir prestado por su propia autoridad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} Ibn 'Abidin dice que no se permite pedir prestado sin la orden del fundador, porque una deuda se adjunta solo a la responsabilidad de una persona; una dotación no tiene responsabilidad, los pobres tienen responsabilidad pero no se les puede perseguir en la práctica, por lo que la deuda recae solo sobre el administrador. La necesidad supera esta analogía; la opinión preferida de Abu al-Layth es que se permite pedir prestado con el permiso del juez cuando no hay alternativa y el juez no está lejos del administrador, porque la autoridad del juez cubre los intereses públicos de los musulmanes de manera más amplia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} Cuando hay una alternativa, como pagar a los beneficiarios, no se permite pedir prestado para eso, excepto para lo que se da al imán, al predicador y al muecín, y las esteras y el aceite de una mezquita, según la opinión preferida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} Si se requiere el permiso del juez y el administrador afirma haberlo obtenido, la reclamación aparentemente no se acepta sin pruebas, porque quiere tomar de los ingresos, y su palabra solo se acepta sobre lo que está en su poder. Si no obtuvo permiso, le está prohibido tomar de los ingresos, ya que entonces es voluntario, hasta que se establezca el permiso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} Ibn 'Abidin dice que si el administrador gastó su propio dinero para reparar la dotación, puede recuperarlo de los ingresos de la dotación; la fatwa de al-Hanuti sostiene que puede recuperarlo en conciencia, pero su reclamación no se acepta a menos que tenga testigos de que gastó para recuperarlo. Esto aplica solo cuando la dotación tiene ingresos; sin ingresos, el permiso del juez es necesario. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} Segundo, la venta de una dotación y su intercambio. Cuando una cosa dotada está inhabilitada y ya no se puede usar, los Hanafi, Maliki, Hanbali y, en una opinión, los Shafi'i permiten su venta y el gasto del precio en una cosa similar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} Los Hanafi permiten la venta y el intercambio incluso cuando la dotación no está inhabilitada, bajo condiciones especiales; los Maliki, en general, distinguen entre bienes inmuebles y bienes muebles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} Los Hanafi reconocen tres casos de intercambio. En el primero, el fundador estipula, en la dotación, que la tierra dotada puede intercambiarse por otra tierra, ya sea para él o para otro. Esto tiene dos fórmulas; la primera es decir: 'mi tierra es una donación caritativa a Dios para siempre, con la condición de que la venda y compre con su precio otra tierra', y luego la segunda tierra se dona en los términos de la primera. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} Abu Yusuf, Hilal y al-Khassaf sostienen que la donación y la condición son válidas por preferencia jurídica, que es la opinión correcta según los Fatawa Qadikhan; la condición no anula la donación, ya que una donación puede pasar de una tierra a otra, y la segunda ocupa el lugar de la primera. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} Por ejemplo, si un usurpador inunda una tierra donada hasta que se convierte en un mar inutilizable para el cultivo, paga su valor y compra otra tierra que se convierte en una donación en los términos de la primera; de igual modo, si su rendimiento ha disminuido debido a una plaga y no excede sus costos, el bien de la donación reside en el intercambio, por lo que el fundador puede estipular válidamente el poder de intercambio incluso cuando la necesidad no está presente ahora. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} Muhammad y Yusuf ibn Khalid al-Samti sostienen que la donación es válida y la condición nula, que es la visión analógica. Sarakhsi justifica la opinión de Muhammad: la condición no impide que la donación termine, por lo que la donación se completa, mientras que el intercambio se mantiene como una condición nula en sí misma, como una mezquita en la que se estipula un intercambio o donde se estipula que solo algunas personas pueden rezar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} Algunos juristas hanafíes dicen que tanto la donación como la condición son nulas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} Kamal ibn al-Humam informa de al-Ansari que la condición es válida pero la venta solo puede hacerse con el permiso del juez, y el juez debe permitir una venta cuando no hay beneficio en la donación y ve que es mejor para sus beneficiarios. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} Si el fundador estipuló que la tierra se vendiera y se comprara otra con su precio, sin agregar una fórmula de dotación adicional, la segunda tierra se convierte en una dotación en los términos de la primera sin fórmula renovada, porque la tierra ya estaba fijada para la dotación y su precio toma su lugar. Por analogía, la dotación sería nula, ya que no se nombró ninguna otra tierra para ocupar el lugar de la primera. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} La segunda fórmula: si el fundador estipuló el derecho de intercambio para el administrador y no para sí mismo, el administrador puede intercambiar para sí mismo, ya que dar poder a otro sigue de poseer el poder uno mismo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} Si el derecho de intercambio se estipula para otro hombre junto con el fundador, solo el fundador tiene el derecho, y el otro hombre no lo tiene solo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} El intercambio bajo una estipulación está permitido incluso si la cosa produce ingresos y beneficios, ya que la dotación no deja de ser útil, y no se requiere ni la acción directa del juez ni la ausencia de ingresos para la reparación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} Los Hanafis limitan el intercambio a lo que el fundador declaró en especie y tipo: si estipuló el intercambio por tierra, no puede hacerse por una casa; Si estipuló la tierra de una aldea, no puede hacerse por otra tierra, ya que las tierras de las aldeas difieren en costo y rendimiento; si no especificó el reemplazo, puede intercambiar por cualquier bien inmueble, ya sea tierra, casa o ciudad, como desee, ya que la estipulación es general. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} Si la estipulación cubre un intercambio, el fundador no puede intercambiar la segunda tierra por una tercera, ya que la condición se cumplió solo en la primera, a menos que las palabras lo expresen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} El segundo caso: el fundador no estipuló el intercambio en la dotación, ya sea que estipuló su ausencia o guardó silencio, pero la dotación llegó a un estado en el que no da ningún beneficio, como no dar rendimiento o no cubrir su mantenimiento. El intercambio en este caso se permite según el criterio más sólido cuando el juez lo permite y ve el bien en él. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} Ibn 'Abidin informa de al-Bahr que las palabras de Qadikhan difieren: en un lugar permitió al juez intercambiar sin la estipulación del fundador cuando vio el bien; en otro lo prohibió incluso cuando la tierra había llegado a un estado en el que no se podía obtener ningún beneficio. La opinión correcta es que el juez puede intercambiar bajo las siguientes condiciones, la primera de las cuales es que la cosa donada esté completamente fuera de uso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} Entre las condiciones para el intercambio, como las establecen los Hanafis: la venta no debe ser a una subvaloración manifiesta; la donación debe tener algún rendimiento con el que pueda repararse; el intercambiador debe ser un hombre de conocimiento y acción, para que las donaciones de los musulmanes no se vean menoscabadas; el reemplazo debe ser bienes raíces y no dinero en efectivo; y la cosa no puede venderse a alguien cuyo testimonio no pueda aceptarse a su favor o a un acreedor de los herederos del fundador. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} El intercambio y el reemplazo deben ser de un mismo tipo. Ibn 'Abidin, citando a Qanali-zada, dice que la misma clase probablemente no se requiere para una dotación mantenida por su rendimiento, ya que lo que cuenta es un gran rendimiento y poco mantenimiento: intercambiar una tienda por un terreno que produzca una renta igual a la renta de la tienda es mejor, porque el terreno dura más y necesita menos reparaciones; mientras que una dotación mantenida para residencia se juzga por la residencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} En al-Qunya, una dotación de casa puede intercambiarse por otra casa solo si la nueva está en el mismo barrio o en un barrio mejor; Lo contrario no está permitido, incluso si la casa poseída es más grande en área, valor y renta, porque puede caer en ruinas en el barrio menor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} El Bahr al-Ra'iq, citando el comentario sobre el poema de Ibn Wahban, pregunta si el intercambio está permitido cuando el fundador lo prohibió, o cuando el administrador es removido antes del intercambio, o cuando es removido tan pronto como decide intercambiar. Tarsusi responde que no hay un dictamen transmitido, y que las reglas de la escuela significan que el juez puede intercambiar cuando ve el bien en ello. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} La misma obra informa de Muhammad que si una tierra dotada ha disminuido en rendimiento, y el administrador puede comprar con su precio otra tierra con mayor rendimiento, puede vender y comprar esa. Algunos shaykhs prohibieron la venta y el intercambio, independientemente de si la dotación había dejado de producir. Qadikhan afirma que una dotación sin estipulación de intercambio no puede venderse ni intercambiarse, incluso si su terreno es salino e inutilizable, porque una dotación está destinada a ser perpetua y no se vende; el poder de intercambio surge únicamente de una estipulación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} El tercer caso: el fundador no estipuló el intercambio; la dotación produce y no está inactiva; pero el intercambio traería algún beneficio general, y el reemplazo es mejor en beneficio y rendimiento. Ibn 'Abidin afirma que esto no está permitido según la opinión preferida, como lo estableció Qanali-zada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} Ibn 'Abidin también informa de al-Ashbah que una dotación productiva puede intercambiarse solo en cuatro casos: primero, cuando el fundador estipuló el intercambio; segundo, cuando un usurpador inundó la tierra en el mar, de modo que paga su valor y el administrador compra tierra con ella; tercero, cuando el usurpador niega la toma y no hay evidencia, de modo que el administrador toma el valor para comprar un reemplazo; y cuarto, cuando alguien desea la tierra y ofrece un reemplazo con mayor rendimiento y mejor ubicación, lo cual está permitido según la opinión de Abu Yusuf y es la fatwa, como en las fatwas de Qari al-Hidaya. El autor de al-Nahr dice que la refutación de Sadr al-Shari'a está en contra de esto: no damos fatwa según la opinión de Abu Yusuf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} Intercambio de bienes dotados entre los malikíes. Los malikíes distinguen entre bienes inmuebles y bienes muebles en venta y en intercambio. Permiten el intercambio de bienes muebles cuando ninguna parte puede mantenerlos y están en peligro de perecer, o cuando su beneficio ha cesado de modo que no pueden usarse para el propósito para el que fueron retenidos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} Así, un caballo dotado en el camino de Dios, para incursiones o guardia fronteriza, es alimentado con el tesoro público; si no hay tesoro, se vende y el precio compra armas y cosas similares que no necesitan ser alimentadas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} Cualquier bien mueble que no sea propiedad inmobiliaria y no pueda usarse se vende, como un caballo que ha contraído la rabia, una tela que se desgasta, un esclavo que envejece o libros que se deterioran. Su precio se gasta en algo similar si es posible, o en una parte de tal cosa si no se puede comprar todo, y si eso es imposible el precio se da en caridad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} De igual manera, los animales machos dotados para incursiones o reproducción, cuando hay más de ellos de los necesarios, o las hembras que han envejecido demasiado para ser útiles, se venden y se compran hembras jóvenes con el precio, de modo que la leche y la descendencia continúen y el bien permanezca, como dice al-Dardir sobre los avestruces. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} En cuanto a los bienes inmuebles, la escuela Maliki sostiene que no se pueden vender aunque estén en ruinas y no se puedan usar, ya sean casas, tiendas u otros edificios, y no se pueden intercambiar por algo similar en buen estado. Abu al-Faraj informa de Malik que el imán puede venderlo, si ve el bien en él, y gastar el precio en algo similar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} Algunos malikíes permitieron el intercambio de una vivienda en ruinas. Al-Taj wal-Iklil informa de la prohibición absoluta de vender una vivienda en ruinas de una donación; Ibn al-Jahm da la razón de que alguien se encontrará para repararlo alquilándolo por años, para que vuelva a su estado anterior. El intercambio de una vivienda en ruinas por una en buen estado es discutido. Ibn Rushd dice que si tal terreno ha perdido todo uso y no puede repararse ni alquilarse, no hay problema en intercambiarlo por un lugar que será dotado en su lugar, por decisión del juez después de que se pruebe la causa y la ventaja para la dotación sea clara; esto debe ser registrado y atestiguado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} Los malikíes permiten la venta de bienes inmuebles para la ampliación necesaria de una mezquita congregacional, ya sea que la dotación esté en manos de personas nombradas o no nombradas. Ibn Rushd dice que el informe aparente de la colección de Ibn al-Qasim lo permite para cada mezquita, al igual que la opinión de Sahnun; al-Nawadir informa de Malik y otros que se aplica a las mezquitas congregacionales cuando hay necesidad, y no a las mezquitas de barrio, ya que la necesidad allí no es la misma. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} La propiedad dotada también puede venderse para ensanchar un cementerio o un camino usado por la gente, incluso contra la voluntad de los beneficiarios o el administrador; los beneficiarios están obligados a que el precio se coloque en otra dotación, pero el juez no puede obligarlos a aceptar una dotación diferente en su lugar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} Al-Sharh al-Saghir dice que para la propiedad tomada para ensanchar una mezquita, el precio se paga si la dotación se mantuvo para personas nombradas; Si se mantuvo para personas no identificadas, como los pobres, no se debe compensación alguna, ya que ninguna persona identificada tiene un derecho asociado a ella, y la recompensa que obtiene el fundador cuando la propiedad ingresa a la mezquita es mayor que la que inicialmente pretendía. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} Los malikíes dicen que si el fundador estipuló el cambio y el intercambio, su condición se cumple. Si estipuló que, si se ofrecía un precio deseable, la propiedad se vendiera y se comprara otra, al-Nawadir y al-Mutiyya informan que esto no está permitido; si se hace de todos modos, se mantiene y se aplica la condición del fundador. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} Fath al-'Ali al-Malik informa un caso: un terreno dotado en un camino usado por musulmanes, cuyo fundador estipuló que no se vendiera ni se intercambiara, fue intercambiado por el administrador del camino por un terreno estatal, el administrador entregando el terreno dotado a un agricultor y tomando terreno estatal a cambio. Dardir sostiene que cuando el fundador estipuló que no se debía intercambiar y no dio ninguna excepción, el intercambio es nulo; el administrador debe devolver el terreno estatal a su dueño y recuperar el terreno dotado, y el gobernante restringe a cualquiera que se niegue. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} Intercambio de propiedad dotada entre los shafi'is. El Muhadhdhab dice que si una mezquita es dotada y luego arruinada de tal manera que cesa la oración en ella, no regresa a la propiedad, y el propietario no puede disponer de ella, porque lo que salió de la propiedad por derecho de Dios no regresa a la propiedad por ruina, como un hombre que libera a un esclavo y luego queda discapacitado no lo reclama. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} Al-Sharbini dice que la opinión más sólida permite vender las alfombras de una mezquita dotada cuando se han desgastado, y sus vigas cuando se han roto o casi roto y no sirven para nada más que para quemar, para que no se pierdan y el espacio se llene con ellas sin ningún propósito; una pequeña suma de su precio que regresa a la dotación es mejor que perderlas. Tales cosas no se cuentan como una venta de la dotación, ya que se tratan como inexistentes; Esta es la opinión en la que se basaron los dos shaykhs, al-Rafi'i y al-Nawawi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672} Al-Rafi'i dice que la analogía es comprar una estera de reemplazo con el precio de la vieja, y al-Adhra'i toma el caso mencionado como paja usada en arcilla. Las esteras donadas o compradas para una mezquita se venden cuando se necesitan. Las vigas que se pueden usar para otras cosas, como tablones y puertas, nunca se venden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672} Si una mezquita está en riesgo de derrumbarse, el juez puede desmantelarla y usar el material para construir otra mezquita, si lo considera oportuno, y construirla cerca es mejor; pero no puede construir un pozo con el material de una mezquita. Si una dotación en un puente es destruida por una inundación y el puente no es necesario donde está, puede ser trasladado a donde se necesite; el ingreso de una dotación en una frontera que se ha vuelto segura es retenido por el administrador, en caso de que la frontera vuelva a ser segura. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672} Si una palmera datilera dotada se seca, un animal dotado queda discapacitado o las vigas de una mezquita se rompen, hay dos puntos de vista, y el más sólido es que no pueden ser vendidos, como con una mezquita. El otro punto de vista permite la venta, ya que la cosa ya no se espera que produzca beneficio; el precio entonces toma la regla del valor que proviene de la destrucción de la propiedad dotada. Si se considera que la propiedad de la sustancia de la cosa dotada pertenece al beneficiario, que es el punto de vista menos favorable, el precio va para él; si pertenece a Dios, que es la visión más evidente, se compra una cosa similar con el precio para que se convierta en una dotación en su lugar. Abu Hamid al-Isfara'ini dice que el precio compra una cosa similar para que se convierta en una dotación en su lugar, sin disputa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672} Intercambio de propiedad dotada entre los hanbalíes. Entre ellos, el intercambio está permitido cuando la cosa dotada ya no es apta para el propósito para el que fue dotada y ya no sirve para ser utilizada, ya sea mueble o inmueble, y sea mezquita o no. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} Sostienen que vender una dotación está prohibido y es inválido, y que intercambiarla, incluso por algo mejor, es inválido por texto explícito, excepto cuando su beneficio previsto se pierde por ruina y su rendimiento no puede repararlo, en cuyo caso se vende; o cuando su beneficio previsto se pierde por una causa distinta a la ruina, como madera que se ha agrietado y se teme que caiga. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} Si la dotación es una mezquita cuyo uso previsto se pierde porque es demasiado estrecha para sus personas y no se puede ensanchar, o porque su vecindario está arruinado, o porque el lugar está sucio e impide la oración en él, entonces, según al-Qadi, la venta es válida y el precio se gasta en una cosa similar, porque mantenerla así es un desperdicio de propiedad. Dado que una dotación es perpetua, cuando no se puede mantener en la misma cosa su propósito se conserva en otra, y una sucesión de reemplazos se trata como las cosas mismas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} Un árbol seco de una dotación puede venderse; también puede venderse una viga que se ha roto, desgastado o se teme que se rompa o caiga. Al-Talkhis afirma que cuando una viga de gran valor está a punto de romperse, o una casa de gran valor está a punto de derrumbarse, y se sabe que la demora la dejaría fuera de servicio, se vende para proteger su valor. Las escuelas, hospicios y caravasares que están dotados pueden, cuando están en ruinas, ser vendidos por una sola vista sin disputa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} Un caballo dotado para incursiones que ya no es apto se vende y se compra otro caballo apto para él; una vez comprado el reemplazo, se convierte en una dotación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} La estipulación de un fundador de que una dotación inutilizable no se venda es nula, y debe venderse. El vendedor es el juez cuando la dotación es para un bien público, como los pobres, mezquitas o puentes; cuando está en posesión de una persona o grupo nombrado, o para los fieles o muecines de una mezquita, el administrador especial de la dotación la vende. Aun así, es mejor hacerlo con el permiso del juez, porque tal venta obliga a quienes vienen después de los actuales poseedores, como una venta hecha contra una parte ausente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} Una vez que se compra el reemplazo para el uso de la dotación, se convierte en una dotación; el curso prudente es volver a dotarlo mediante una nueva fórmula, para que una persona posterior, sin ver que la compra lo convirtió en una dotación, no la deshaga. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} La devolución de una dotación a la propiedad del fundador. Muhammad ibn al-Hasan de los Hanafíes sostiene que si lo que rodea a una mezquita está en ruinas y ya no es necesario, incluso mientras la mezquita se mantiene, o si la mezquita misma está en ruinas sin medios para repararla y la gente ya no la necesita porque se ha construido otra mezquita, entonces regresa a la propiedad de su constructor si está vivo, o a sus herederos si ha muerto; Abu Yusuf discrepa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} La razón de Muhammad: el fundador dio la dotación a una especie de devoción, y dado que esa devoción ha terminado, la dotación termina con ella. Es como la alfombra y el césped de una mezquita cuando ya no son necesarios, o su lámpara cuando la mezquita está en ruinas, que regresan a quien los hizo; como una mortaja que una bestia ha rasgado, que regresa a su dueño; y como una ofrenda hecha por alguien a quien se le impide completar la peregrinación, de la cual puede disponer una vez que se elimina el impedimento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} Abu Yusuf dice que se traslada a otra mezquita con el permiso del juez, y sus escombros se venden con el permiso del juez y el precio se gasta en algunas mezquitas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} La consecuencia hanafi es que si una dotación cae en ruinas y no tiene ingresos para repararla, regresa al constructor o a sus herederos en la opinión de Muhammad, aunque no en la de Abu Yusuf. Pero en la opinión de Muhammad, solo lo que ha abandonado por completo el uso previsto por el fundador regresa a la propiedad, como una tienda que se quemó y no se puede alquilar por nada, o un albergue o una cisterna de barrio que está arruinada sin medios de reparación; lo que fue hecho para obtener ingresos regresa a la propiedad solo como sus escombros, mientras que su terreno abierto sigue siendo una dotación que se alquila, incluso por un pequeño alquiler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} Khulasa informa que Muhammad dijo acerca de un caballo que fue hecho una dotación retenida en el camino de Dios y se volvió inservible para montar, que se vende y su precio va a su dueño o sus herederos, como con una mezquita. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} Los shafi'ís, en la opinión opuesta a la más sólida, dicen que si una cosa dotada pierde su beneficio por una causa que no es imputable, como un árbol que se seca o es arrancado por el viento o la inundación antes de que pueda ser replantado, la dotación termina y la cosa regresa al fundador o a su heredero. La opinión shafi'í más sólida es que no regresa a la propiedad sino que permanece como una dotación; los hanbalíes están de acuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675} La administración de una dotación. Los juristas coinciden en que la administración de una dotación sigue la condición del fundador. Si la asigna a una persona nombrada, se sigue su condición, como hizo 'Umar ibn al-Khattab cuando dejó su dotación a su hija Hafsa para que la administrara durante su vida, y luego a la gente de buen juicio de su familia, como relata al-Bayhaqi. Ibn Qudama dice que la disposición de una dotación sigue la condición del fundador, y también su administrador. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675} Los juristas difieren en si el fundador puede asignarse la administración a sí mismo. Los hanafíes, shafiíes y hanbalíes lo permiten. Los malikíes dicen que si el beneficiario no ha tomado posesión de la dotación, esta queda sin efecto por la muerte, enfermedad o quiebra del fundador; si el beneficiario ha tomado posesión y el fundador estipuló la administración para sí mismo, la dotación se mantiene, pero el fundador está obligado a asignar la administración a otra persona, puesto que no puede asignársela a sí mismo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675} Si el fundador no nombra a ningún administrador, los malikíes y hanbalíes sostienen que cuando la dotación es para personas no identificadas, como los pobres o las mezquitas, el gobernante designa a quien elige, puesto que no puede administrarla él mismo. Cuando la dotación es para un beneficiario nombrado y en pleno uso de sus facultades mentales, ese beneficiario la administra, puesto que es de su propiedad y su beneficio, de modo que su supervisión es como la propiedad absoluta. Si no está en pleno uso de sus facultades mentales, su tutor la administra. En la escuela Hanbali, elegida por Ibn Abi Musa, existe la posibilidad de que el gobernante la administre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675} Sobre la administración de una donación cuando el fundador no la estipuló, las opiniones Hanafi difieren. Abu Yusuf sostiene que la donación pertenece a Dios y la administración corresponde primero al fundador, luego a su albacea y finalmente al juez. Hilal, la opinión predominante de la escuela, sostiene que la administración corresponde al fundador, luego a su albacea o al juez, porque un administrador deriva su autoridad de la estipulación del fundador, por lo que es imposible que tenga autoridad mientras otro la deriva de él; y el fundador es la persona más cercana a la donación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} Muhammad sostiene que el fundador no tiene administración a menos que la estipule, porque para él entregar la dotación a un custodio es una condición de su validez, de modo que una vez entregada, el fundador no tiene autoridad sobre ella. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} Si el fundador muere sin nombrar un administrador, el juez nombra a un custodio de entre la familia del fundador mientras se pueda encontrar a una persona idónea, ya sea porque dicha persona es la más solícita o porque el fundador quiso que la dotación se le atribuyera; solo si no se encuentra a nadie nombra a un ajeno. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} Los shafi'ís sostienen, según la visión de la escuela, que si el fundador no nombra a un administrador, la administración corresponde al juez, quien tiene autoridad general sobre tales asuntos. Una segunda opinión se la otorga al fundador, quien la tenía, y una tercera se la otorga al beneficiario, ya que los ingresos son suyos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} Las calificaciones de un administrador. Los juristas establecen varias condiciones para la idoneidad de un administrador; algunas son aceptadas y otras son disputadas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} La primera condición es la capacidad legal. Los juristas coinciden en que un administrador debe ser adulto y estar en su sano juicio, ya que un menor o una persona con enfermedad mental carece de capacidad; esto se aplica en general. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} Los malikíes y los hanbalíes añaden que si el fundador no nombra a ningún administrador y el beneficiario es una persona nombrada, como Zayd o 'Amr, el beneficiario lo administra él mismo; si es menor de edad o está demente, su tutor lo representa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} Los hanbalíes dicen que la propiedad de una cosa donada pasa al beneficiario si es un ser humano nombrado o un grupo limitado, y la administra si es adulto y sano de juicio, o lo hace su tutor si es menor de edad, demente o derrochador; Ibn Abi Musa dice que el juez la administra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} Los hanafíes: Ibn 'Abidin cita a al-Is'af que nombrar a un menor como administrador es nulo por analogía en todos los casos, y por preferencia jurídica nulo mientras sea menor de edad, de modo que la administración pasa a él cuando crezca; al-Shilbi sostiene que la asignación a un menor nunca es válida, puesto que la administración es una forma de tutela y a un menor bajo tutela no se le puede dar tutela sobre otros. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} Ibn 'Abidin cita las fatwas de Rashid al-Din que un juez que asigna la administración a un menor que es capaz de mantener la propiedad lo hace válidamente, puesto que le otorga autoridad para actuar; las dos opiniones pueden conciliarse leyendo al-Is'af como sobre un menor incapaz de actuar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} La locura impide el nombramiento y también lo termina una vez que ocurre; Ibn 'Abidin cita a al-Fath que un administrador es destituido por locura permanente que dure al menos un año, y que si se recupera, la administración le es restituida, aunque al-Nahr dice que esto se aplica a uno nombrado por el fundador y no a uno designado por el juez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} Los shafi'ís afirman que la administración es despojada por locura, y al-Shabramallisi dice que cuando una persona cuerda regresa a un administrador nombrado por el fundador, el cargo regresa por recuperación sola sin un nuevo nombramiento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} La segunda condición es la justicia (adala). Los hanafíes difieren en si es una condición de validez o de preferencia. Al-Is'af dice que nadie es nombrado excepto una persona confiable y capaz, ya sea actuando él mismo o a través de un adjunto, porque destituir a una persona deshonesta del cargo no es parte de la administración. Ibn 'Abidin sostiene que la justicia es una condición de preferencia, no de validez, y que un administrador que se vuelve malhechor merece ser destituido pero no es destituido automáticamente, como un juez que se vuelve malhechor no es destituido según la opinión sana y fatwa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} Los malikíes consideran la justicia como una condición cuando el administrador fue nombrado por el juez o por el fundador. Al-Hattab dice que la administración de una dotación retenida pertenece a quien el fundador eligió, quien debe ser alguien de confianza en la religión y la honestidad; si el fundador es negligente, la administración recae en el juez, quien nombra a alguien que aprueba. Si el administrador gestiona mal y no es de confianza, el juez lo destituye, a menos que el beneficiario sea dueño de sus propios asuntos y lo acepte. Al-Qarafi dice que un juez destituye a un administrador solo por una falta, pero el fundador puede destituirlo incluso sin ella. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} Los shafi'ís exigen justicia aparente e interna en un administrador designado por el juez. Al-Subki dice que para uno designado por el fundador, la justicia aparente debería ser suficiente; al-Adhra'i exige justicia aparente e interna también en ese caso, y al-Sharbini prefiere la primera opinión. Si el administrador se convierte en un malhechor, es destituido, y entonces la administración pasa al juez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} Al-Shafi'iyya dice que si un administrador se convierte en malhechor y luego vuelve a ser justo, su autoridad se restablece si se estableció como condición en los términos de la dotación y se mencionó con precisión; de lo contrario, no. Al-Nawawi emitió esta fatwa, e Ibn al-Rif'a y otros estuvieron de acuerdo; al-Zarkashi dice que es evidente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} Los Hanbalis sostienen que si la administración pertenece a alguien distinto del beneficiario, y el nombramiento fue realizado por el juez o por un administrador original, se requiere justicia, porque es autoridad sobre la propiedad, como la tutela sobre la propiedad de un huérfano. Si no es justo, se le retira la mano de la dotación para preservarla, y si vuelve a ser íntegro, su derecho se restablece. Si el administrador fue designado por el fundador, no se requiere justicia, y se agrega una persona de confianza al malhechor; su autoridad se retira solo cuando su remoción es necesaria para mantener la dotación, ya que preservar la dotación es más importante que dejar a un malhechor en autoridad sobre ella. Cuando la administración pertenece al propio beneficiario, sea justo o no, tiene mejor derecho a ella, ya que es dueño de la dotación y, por lo tanto, la administra para sí mismo; algunos dicen que se le agrega una persona de confianza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680} La tercera condición es la capacidad (kifaya), es decir, la fuerza y la habilidad de la persona para actuar en lo que administra. Los shafi'ís y los hanbalíes la requieren, ya que preservar una dotación es un deber religioso y alguien sin capacidad no puede preservarla. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} Si se pierde la capacidad, los shafi'ís dicen que el juez le quita la administración incluso si le fue asignada por el fundador. Al-Nawawi dice que cuando termina el defecto, su administración regresa si fue estipulada en la dotación y nombrada exactamente. Los hanbalíes dicen que si se pierde la capacidad no se le quita, sino que se le agrega un administrador fuerte y confiable para lograr el propósito. Los hanafíes dicen que el administrador debe ser destituido cuando no es confiable o es incapaz (el texto OCR dice 'el fundador' aquí, probablemente un error para el administrador, marcado como duda). Las palabras de los malikíes también implican que se requiere capacidad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680} La cuarta condición es el Islam. Los Hanbalis sostienen que un administrador debe ser musulmán si el beneficiario es musulmán o el objeto es una mezquita o similar, basándose en Surat al-Nisa, versículo 141, que citan para esta condición. Si la dotación es para un no creyente nombrado, un no creyente puede ser nombrado administrador. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680} Los Hanafis permiten que un dhimmi sea administrador y no requieren el Islam; si el juez destituye a un dhimmi por alguna razón y luego se convierte, la administración no regresa a él. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680} Al-Ramli sostiene que la analogía con el testamento y el matrimonio hace válida la administración de una dotación por parte de un dhimmi para un beneficiario dhimmi, siempre que sea recto en su religión, pero esto se rechaza porque la dotación requiere verdadera justicia; al-Shabramallisi dice que el rechazo es la opinión correcta. Él distingue el matrimonio de un dhimmi de su pupilo, donde el tutor tiene una restricción natural de querer proteger a su pupilo de la vergüenza, lo cual no se aplica a una dotación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17681} El salario del administrador. El sujeto abarca su derecho a un salario, ya sea que lo establezca el fundador o el juez, su monto, y si se le debe uno cuando ninguno lo ha especificado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17681} Sobre el derecho a un salario: los juristas sostienen que un administrador tiene derecho a un salario por su trabajo en la administración de la dotación y el cuidado de sus asuntos. La evidencia que citan incluye las palabras de 'Umar cuando dotó su tierra en Khaybar, que quien la administre puede comer en medida razonable o alimentar a un amigo sin obtener ganancias de ella; 'Ali hizo que el mantenimiento de los esclavos que dotó para trabajar la tierra fuera un cargo sobre los ingresos; la analogía con el recaudador del zakat; y el dicho atribuido al Profeta de que lo que queda después del sustento de sus esposas y el salario de su trabajador es caridad. Ibn Hajar dice que el trabajador allí es el custodio de la tierra, por lo que el dicho muestra que su salario es lícito. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} Sobre la fijación del salario. Si el fundador lo estableció, el administrador toma lo que el fundador fijó incluso si excede el salario habitual; esta es la opinión de los Hanafis, Shafi'is y Hanbalis. Los Hanafis dicen que si el fundador fijó menos que el salario habitual, el juez lo completa a petición. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} Los Shafi'is dicen que si el fundador se nombró administrador y fijó un salario para sí mismo, no puede exceder el salario habitual; si fijó más, la dotación es nula, ya que sería una dotación sobre sí mismo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} Los Hanbalis dicen que si el fundador fijó un salario declarado, y este es igual al salario habitual, el administrador lo toma; Si es más, los costos de lo que la dotación necesita, como los fideicomisarios y otros, se pagan con el excedente hasta que solo queda el salario habitual, a menos que el fundador se lo haya dado directamente. Los malikíes no fijaron ninguna cantidad y la dejaron al fundador o al juez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} Si el fundador no fijó un salario, el juez lo fija. Los hanafíes y los hanbalíes sostienen que el salario del juez no debe exceder el salario habitual, y si fija uno mayor, el excedente se retiene. Los malikíes dejan el asunto a discreción del juez; Ibn Fattuh dice que el juez puede dar al administrador designado un estipendio mensual fijo según su trabajo, como lo hacían los imanes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} Los shafi'ís dicen que si el fundador no establece un salario, el administrador no tiene salario según la opinión sana y no puede tomar nada de la dotación; si lo toma, es responsable y queda liberado solo entregándolo al juez. Si el administrador pide al juez que le fije un salario, es como un tutor de los bienes de un huérfano que pide al juez que fije sus honorarios. Al-Iraqi, quien recoge la opinión de al-Balqini, dice que el administrador entonces toma el salario donde sea necesario, ya sea el monto de su manutención, como prefería al-Rafi'i, o el menor entre su manutención y el salario habitual, como prefería al-Nawawi; otra opinión es que tiene derecho al salario habitual incluso si excede su manutención. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} Si el fundador no fijó un salario. Al-Ramli de los Hanafíes dice que al administrador no se le debe nada a menos que el juez fije un salario por su trabajo. Ibn 'Abidin concluye que cuando el fundador nombra una suma para el administrador, este la tiene, sea grande o pequeña, trabaje o no, siempre que no se establezca a cambio de trabajo; cuando el fundador no nombra nada y el juez fija el salario habitual, eso es válido; si fija más, el exceso se retiene; y si el administrador no trabaja, no se le debe ningún salario. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} Si el juez nombra a un administrador y no nombra un salario, entonces, cuando la costumbre es que el trabajo no se realiza sin el salario habitual, se le debe el salario habitual, ya que la costumbre es como una estipulación; de lo contrario, nada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} Ibn Najim, citando a al-Qunya, informa dos puntos de vista hanafíes sobre un designado por un juez que no recibe salario: el primero es que no tiene nada aunque trabaje un año; el segundo es que el custodio tiene derecho a un salario según el esfuerzo que realiza, independientemente de que el juez o los residentes del barrio le hayan fijado un salario, puesto que nadie acepta la custodia públicamente sin un salario, y la costumbre es como una estipulación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} Cuando la dotación tiene administradores, los malikíes, los hanbalíes y los shafi'íes tratan el salario de una manera particular. Los shafi'íes sostienen que si el fundador no asignó un salario al administrador, no tiene derecho a uno según la opinión correcta; si el asunto se remite al juez, se le da uno cuando hay necesidad, como se explicó anteriormente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17684} Los hanbalíes tienen tres puntos de vista. El primero es que el administrador puede comer de los ingresos de la dotación en medida razonable, sea necesitado o no, por analogía con el recaudador del zakat; esta es la opinión de Abu al-Khattab. El segundo es que toma el menor entre el salario habitual y su manutención, por analogía con el tutor de un huérfano, y tiene derecho a ello solo si es pobre. El tercero es que un administrador conocido por recibir un salario por su trabajo tiene derecho al salario habitual, que es la analogía de la escuela. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17684} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} Los malikíes, como dice Ibn Fattuh, dejan que el juez dé un estipendio mensual fijo en donaciones, fijado por su juicio de la obra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17684} La fuente del salario. La mayoría de los juristas, a saber, los hanafíes, los malikíes excepto Ibn 'Attab, los shafi'íes y los hanbalíes, sostienen que el salario del administrador, ya sea fijado por el fundador o por el juez, proviene de los ingresos de la donación, citando las palabras de 'Umar sobre su donación de que quien la administre puede comer de ella en medida razonable sin acumular propiedad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} Ibn 'Attab, de los Malikis, sostenía que el salario proviene únicamente del tesoro público; si se toma de las donaciones, se devuelve y se recupera del tesoro, y si no se entrega, su recompensa está con Dios. Al-Hattab explica que no se debe tomar nada de las donaciones porque son para legados. Ibn Warad emitió una fatwa en su opinión, pero al-Dasuqi debilitó la opinión de Ibn 'Attab. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} El trabajo que genera el salario consiste en preservar la donación, repararla, arrendarla, recolectar su producción (renta, cosecha o fruto), esforzarse por desarrollarla y gastarla en sus propósitos, tales como reparación, mantenimiento y los beneficiarios, ya que eso es lo que es costumbre para dicho trabajo. El salario comienza desde el momento en que el administrador asume el cargo y se debe en proporción al trabajo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} Los hanbalíes dicen que si un administrador descuida su deber, su salario fijo se reduce en la cantidad que su negligencia le costó a la fundación; lo que se le asignó se divide entre lo que hizo y lo que no hizo, y la parte correspondiente a lo que no hizo se pierde. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} Los hanafíes dicen que si los beneficiarios disputan con un administrador que dice que el fundador fijó un salario por trabajo mientras él no hace nada, el juez no impone tareas que los gobernantes mismos no realizan. Si se le presenta un impedimento que le impide ordenar, prohibir, tomar y dar, no tiene salario; de lo contrario, lo conserva. Si el fundador fijó un salario mayor al habitual, eso está permitido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} En un caso, el propietario de una tierra dotada murió y el juez nombró un custodio y le dio la décima parte de los ingresos, mientras que un molino en la dotación estaba en posesión de un hombre en arrendamiento de suma global y no necesitaba custodio, y los beneficiarios cobraban su producción de él; el custodio no tiene derecho a una décima parte de esa producción, ya que su salario es pago por trabajo y no hay salario sin trabajo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} La rendición de cuentas de un administrador. Es deber del administrador cobrar la producción de la dotación, gastarla en lo que la dotación necesita y pagar a los beneficiarios. Los juristas concuerdan en que debe rendir cuentas de lo que gasta, ya sea que sea requerido por el juez o por los beneficiarios. Difieren en si su palabra sobre sus gastos es aceptada sin evidencia, y, si no hay evidencia, si su juramento es requerido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17685} Los hanafíes dicen que el juez no necesita requerir una cuenta detallada de cada suma que el administrador ha gastado de los ingresos de la dotación; una cuenta general es suficiente si se sabe que es digno de confianza. Si es sospechoso, el juez le hace explicar punto por punto, y no lo encarcela, sino que lo cita por dos o tres días y lo advierte; si explica, bien, de lo contrario el juez le toma juramento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} Al-Durr cita a al-Qunya que si el juez sospecha de él lo hace jurar, incluso si es digno de confianza, como debe jurar un depositario que afirma que se perdió un depósito. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} Las opiniones hanafíes difieren en la afirmación de que el administrador pagó a los beneficiarios. Al-Durr dice que su palabra es aceptada sin juramento. El Is'af dice que si dice que recibió el salario y lo pagó a los beneficiarios, y estos lo niegan, su palabra es aceptada con su juramento y no es responsable, como un depositario que afirma haber devuelto un depósito cuando el depositante lo niega. El arrendatario de la propiedad dotada queda liberado por el reconocimiento del administrador de haber recibido el alquiler. Si dice que el alquiler se perdió o fue robado después de haberlo recibido, su palabra con juramento es aceptada, ya que es digno de confianza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} Ibn 'Abidin informa de al-Khayr al-Ramli que la fatwa es que jura en esta era. La Hamidiyya cita a Abu al-Su'ud dictaminando que si el administrador es un derrochador, su juramento no es aceptado sobre su gasto de la propiedad de la dotación. Al-Shilbi sostiene que a un malhechor cuya conducta infringe la Ley no se le cree sobre lo que gastó a menos que tenga pruebas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} Si la palabra de un administrador de confianza después de su remoción es aceptada: al-Hamawi dice que la opinión aparente es que sí, ya que la remoción no elimina su confiabilidad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17686} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687} Mulla Abu al-Su'ud establece una distinción adicional: si el administrador afirma haber pagado con los ingresos de una dotación a los beneficiarios que el fundador nombró como sus hijos o nietos, su palabra es aceptada; si afirma haber pagado a titulares de cargos, como el imán y el muecín, no lo es, del mismo modo que no se le cree a un hombre que contrató a un constructor por un salario conocido en una mezquita y luego afirma haberle pagado. Al-Tamartashi elogió esta distinción. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687} Los malikíes sostienen que si el fundador muere y se pierde la escritura de donación, se acepta la palabra del administrador sobre los propósitos en los que gasta, si es digno de confianza. Si afirma haber gastado el rendimiento, se acepta si es digno de confianza, a menos que la escritura tuviera testigos en su realización, en cuyo caso gasta solo con su conocimiento. Si afirma haber gastado su propio dinero en la donación, se acepta sin juramento a menos que sea sospechoso, y entonces jura. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687} Al-Hattab informa un caso presentado a al-Suri: un imán, un muecín y el administrador general de una mezquita fueron acusados años después por un inspector de mercado de un excedente del alquiler de tiendas; El administrador negó cualquier superávit y se negó a declarar sus gastos, diciendo que no estaba obligado a hacerlo y que sin él la dotación se perdería. Al-Suri dictaminó que su palabra es aceptada sobre lo que dice que gastó, si se asemeja a lo que dijo. Al-Barzali agrega que esto se aplica cuando no se estableció ninguna condición que exigiera un registro de ingresos y gastos, excepto con testigos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687} Los shafi'is distinguen entre los beneficiarios que son nombrados, como Zayd y 'Amr, cuya palabra sobre lo que se les paga es aceptada y que pueden exigir cuentas, y los beneficiarios no nombrados, como los pobres. Cuando los beneficiarios no son nombrados, se discute si el gobernante puede exigir cuentas; de dos opiniones, la más evidente es que puede. Se cree al administrador sobre la cantidad que gastó, cuando eso es probable; si el juez sospecha de él, lo hace jurar. Al-Azra'i explica que lo que se quiere decir es gastar de acuerdo con la costumbre; Los pagos a los pobres y otros fines generales están incluidos, pero el gasto en un beneficiario nombrado no es creíble, ya que ese beneficiario no le confió eso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17687} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688} Los hanbalíes distinguen al administrador que sirve sin paga de uno que recibe un salario. La palabra de un administrador voluntario es aceptada sobre un pago a un beneficiario; la palabra de un administrador pagado no es aceptada sin evidencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688} Al-Buhuti y al-Mirdawi dicen que los beneficiarios no pueden objetar a un administrador de confianza que el fundador haya designado; pueden cuestionarlo sobre lo que su dotación necesita, para que su conocimiento sea igual al de él; y el gobernante puede establecer una oficina para auditar las cuentas de la dotación cuando sea de interés público. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688} La remoción del administrador de una dotación y quién tiene derecho a removerlo. Las condiciones para un administrador y la regla cuando uno falla se establecieron anteriormente; aquí está quién puede removerlo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688} Primero, el derecho del fundador a remover a su designado. Los shafi'ís y los hanbalíes distinguen entre un fundador que al principio mantuvo la administración para sí mismo y luego la asignó a otro, y un fundador que la dio a otro desde el principio. En el primer caso puede remover y nombrar a otra persona, ya que el cesionario lo representa, como un principal remove a su agente; esta es la opinión correcta de los shafi'ís y la opinión correcta y acertada de los hanbalíes en el texto corregido de al-Furu'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17688} Al-Shirbini señala que esto implica que el fundador puede destituirlo sin causa, y al-Subki lo afirma en sus fatwas; pero muchos eruditos posteriores, entre ellos Ibn Razin, dictaminaron que la destitución sin causa no está permitida. Una visión shafi'í y hanbalí le niega cualquier destitución, puesto que su propiedad ha desaparecido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17689} En el segundo caso, cuando el fundador nombra a un administrador al crear la dotación, los shafi'ís dicen que no puede destituirlo, ni siquiera por una razón de conveniencia, puesto que no tiene autoridad después de asignársela a otro. Por lo tanto, si el administrador así nombrado se destituye o se convierte en un malhechor, el nombramiento de un reemplazo corresponde al juez, no al fundador. Los hanbalíes dicen que si el fundador nombró a un administrador y estipuló para sí el derecho a destituirlo, puede destituirlo; de lo contrario, no puede. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690} Los hanafíes: Muhammad ibn al-Hasan sostiene que si el fundador estipuló para sí mismo y sus hijos el derecho a nombrar y destituir custodios, y a intercambiar la dotación, y toda esa autoridad, y luego entregó la dotación al administrador, el fundador puede destituirlo. Si no estipuló el derecho a destituir, no puede hacerlo después de la entrega, porque el administrador ocupa el lugar de los beneficiarios. Al-Sadr al-Shahid dice que la fatwa sigue la opinión de Muhammad. Ibn 'Abidin dice que esto depende de si la entrega es una condición, lo cual es para Muhammad y no para Abu Yusuf. Para Abu Yusuf el fundador tiene autoridad, ya sea que la haya estipulado o no, puesto que la entrega no es una condición; si nombra a otro, es un representante y puede destituirlo, ya sea que haya estipulado el derecho o no. Hilal, al-Fath y al-Bahr sostienen que esta es la opinión aparente, y los shaykhs de Balkh emitieron fatwa sobre la opinión de Abu Yusuf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690} Al-Ramli dice que esto es claro: la destitución es válida con o sin causa, puesto que es un representante, y un principal puede destituir a su agente en todos los casos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690} Los malikíes sostienen que el fundador no puede estipular la administración para sí mismo; sigue su propia condición al nombrar al administrador, y si nombró a una persona en particular no puede cambiarla por otra. Al-Qarafi dice que el fundador puede remover a un administrador incluso sin causa; al-Hattab dice que quien ha designado a alguien para administrar su legado puede removerlo solo por una causa que se presente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690} Segundo, el derecho del juez a remover. El juez tiene autoridad general, por lo que puede remover a un administrador que el fundador nombró si se prueba la deshonestidad del administrador o si carece de una de las condiciones requeridas; no puede removerlo sin causa. Cuando el propio juez nombró al administrador, los malikíes, los shafi'ís y algunos hanafíes sostienen que no puede ser removido excepto por una causa, como malversación u otra falta; los hanbalíes y algunos hanafíes sostienen que puede ser removido sin malversación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690} La pluralidad de administradores. Una dotación puede tener uno o más administradores, como afirman los juristas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17690} Si el fundador asigna la administración a dos personas, los shafi'ís, los hanbalíes y Abu Hanifa sostienen que ninguno puede actuar solo, ya que el fundador no aceptó el juicio de ninguno por sí solo; pero si el fundador nombra a cada uno de ellos, cada uno puede actuar solo. Abu Yusuf permite que cada uno de los dos administradores actúe solo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17691} El texto hanbalí añade que si el fundador asigna la reparación de la dotación a un hombre y la recaudación de su rendimiento a otro, cada uno tiene su asignación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17691} Los shafi'ís dicen que si el fundador estipula que el administrador sea el más recto de sus hijos, y todos comparten esa rectitud, comparten el cargo; si uno es manifiestamente más recto, él solo lo ostenta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17691} Los hanafíes sostienen que si el fundador nombra a un hombre y luego nombra a un tutor para un menor, ambos son administradores, el tutor comparte el cargo; a menos que el fundador especifique, diciendo, por ejemplo, que dotó su tierra a un beneficiario nombrado y dio su administración a un hombre, y nombró a otro como albacea de su patrimonio y todos sus asuntos, en cuyo caso cada uno actúa solo dentro de su propia asignación. Ibn 'Abidin cita a al-Is'af para esto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17691} Si el fundador da la administración al más virtuoso de sus hijos y son iguales en virtud, no la comparten y pasa al mayor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} Si el fundador dio la administración a dos hombres y uno acepta y el otro se niega, o muere, o es inhabilitado, el juez nombra a otro en su lugar; los Hanafi, Shafi'i y Hanbali están de acuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} La delegación de la administración por un administrador. Excepto cuando el fundador lo permitió, los juristas sostienen que un administrador no puede delegar la administración a quien quiera ni legarla a otro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} Los hanafíes dicen que si la delegación del fundador al administrador fue general, es decir, que se encontraba en el lugar del fundador y podía asignar y legar la administración a quien quisiera, puede delegarla en salud y en su última enfermedad; si no fue general, no puede delegarla en salud, sino solo en su última enfermedad, ya que es como un albacea, y un albacea puede nombrar a otro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} Los shafi'ís afirman que si el fundador declara haber asignado la administración a una persona específica, quien puede delegarla a quien desee, la delegación es válida. Se discute si la administración del fundador cesa entonces: la postura de esta escuela es que sí, puesto que la delegación es como una transferencia de propiedad, de modo que ni el fundador ni el delegado pueden destituir al nuevo administrador, y la administración no regresa al delegador tras su fallecimiento. La postura de Al-Subki es que el delegado es el representante del delegador, por lo que si el delegador fallece, la administración regresa al delegador, y si el delegado fallece, regresa al delegador. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17693} Los hanbalíes dicen que un administrador nombrado por el fundador, si él mismo es beneficiario, puede nombrar un agente y destituirlo, ya que su autoridad es original, como una persona dispone de su propia propiedad. Si no es beneficiario, no puede nombrar un administrador ni legar el cargo, a menos que el fundador estipule que puede nombrar a quien quiera. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17693} El fin de una dotación. Una forma en que finaliza una donación es la devolución del bien donado a la propiedad del fundador: cuando el bien se arruina y ya no es apto para su uso, cuando la donación está destinada a una clase de beneficiarios que llega a su fin, o en el caso de una donación temporal, que los malikíes permiten. Estos casos se han tratado a lo largo del artículo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17693}"
