label:
  ar: "وَقْف"
  en: "Waqf (endowment, fiqh)"
summary:
  ar: "الوقف في اللغة الحبس، ومنه وقفت الدار حبستها في سبيل الله، ومنه المنع والسكون، ويُطلق على الشيء الموقوف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579} وفي الاصطلاح تعريفات متعددة: عند الحنفية حبس العين على حكم ملك الله تعالى وصرف منفعتها على من أحب عند الصاحبين، وعند أبي حنيفة حبس العين على حكم ملك الواقف والتصدق بالمنفعة؛ وعند المالكية إعطاء منفعة شيء مدة وجوده لازماً بقاؤه في ملك معطيه ولو تقديراً؛ وعند الشافعية حبس مال يمكن الانتفاع به مع بقاء عينه بقطع التصرف في رقبته على مصرف مباح موجود؛ وعند الحنابلة تحبيس مالك مطلق التصرف ماله المنتفع به مع بقاء عينه يُصرف ريعه إلى جهة بر تقرباً إلى الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579}\n\nالألفاظ ذات الصلة: التبرع (التطوع بالشيء دون عوض، وهو أعم من الوقف)، والصدقة (تمليك في الحياة بغير عوض، وقد تُطلق على الوقف كما في حديث عمر في أرضه)، والهبة (العطية بلا عوض)، والعارية (إباحة الانتفاع بالعين مع بقاء ملكها للمعير)، والوصية. والفرق بين الوقف والهبة أن الوقف تمليك المنفعة مع بقاء العين على ملك الله فلا يجوز التصرف فيها، والهبة تمليك للعين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581}\n\nالوصية: الحنفية تعريفها تمليك مضاف إلى ما بعد الموت، والشافعية نحو ذلك؛ والفرق بينها وبين الوقف أن الوصية تكون بعد الموت وقد تكون بالعين أو المنفعة، أما الوقف فتبرع في الحياة وبالمنفعة فقط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581}\n\nمشروعية الوقف: ذهب جمهور الفقهاء إلى مشروعيته ولزومه واعتباره من القُرَب المندوب إليها، واستدلوا بحديث ابن عمر في أرض عمر بخيبر وقول النبي له «إن شئت حبست أصلها وتصدّقت بها»، وبحديث «إذا مات الإنسان انقطع عنه عمله إلا من ثلاث...»، وبأثر جابر في أن من له مال من المهاجرين والأنصار حبس مالاً؛ وقال ابن قدامة إن ذلك إجماع من الصحابة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17582} ونقل ابن عابدين عن الإسعاف أن الوقف جائز عند أبي حنيفة وأصحابه، وأن الخلاف في اللزوم، فعند أبي حنيفة يجوز جواز العارية ولا يلزم إلا بحكم القاضي أو بإخراجه مخرج الوصية؛ ونقل ابن قدامة عن شريح أنه لم يره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17582} وفي الحكم التكليفي: الأصل أنه قربة مندوبة، وقد يكون فرضاً إن نُذر، ومباحاً إن كان بلا قصد القربة كوقف الذمي فلا ثواب له، وحراماً إن كان على معصية كالكنيسة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17582}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583} وذكر الكتاب أن بعض المالكية قالوا إن الوقف على البنين دون البنات حرام لشبهه بفعل الجاهلية، لكن ابن القاسم رأى الكراهة فيمضي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583}\n\nأركان الوقف: عند الجمهور (المالكية والشافعية والحنابلة) أربعة: الصيغة والواقف والموقوف عليه والموقوف، وعند الحنفية الركن الصيغة فقط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583} ولا ينعقد الوقف إلا بالإيجاب، واختلفوا في اشتراط القبول لانعقاده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583}\n\nصيغة الإيجاب: ما يدل على إرادة الواقف من لفظ أو إشارة مفهمة أو كتابة أو فعل. والألفاظ الصريحة عند المالكية والشافعية والحنابلة: «وقفت»، وكذا «حبست» عند المالكية والحنابلة والشافعية على الصحيح، و«سبّلت» عند الشافعية والحنابلة على الصحيح؛ ويصير الوقف بها دون زيادة لعرف الاستعمال، ولأن النبي قال لعمر «إن شئت حبست أصلها». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17584} والكناية: لفظ «تصدقت»، إلا أن يضيفه إلى جهة عامة كالفقراء وينوي الوقف عند بعض الشافعية، وكذا «حرّمت» و«أبّدت» عند الحنابلة والأصح عند الشافعية، ولا يحصل الوقف بها إلا بضم قرينة كقوله «صدقة موقوفة» أو «صدقة لا تُباع ولا توهب ولا تورث» أو نية الوقف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17584}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17585}"
  en: "Waqf, lexically, is detention: to hold back a thing in God's way; it also means prevention and stillness, and the word names the thing held. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579} Technically the jurists define it in several ways: for the Hanafi companions, the detention of a thing in God's ownership with its use given to whom the founder wishes; for Abu Hanifa, its detention in the founder's ownership with the use given as charity; for the Malikis, the grant of the use of a thing for as long as it exists, the ownership remaining with the grantor even notionally; for the Shafi'is, the detention of property whose use can be had with its substance kept, the disposal of its ownership cut off, for a lawful and existing purpose; for the Hanbalis, the detention by an owner of his property whose use is kept in its substance, with its income given to a charitable purpose seeking God's favour. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579}\n\nRelated words: tabarru' (giving without return, wider than waqf), sadaqa (gift in life without return, which may also name waqf, as in 'Umar's land), hiba (gift without return), 'ariya (the permission to use a thing while its owner keeps it), and wasiyya. The difference from a gift is that waqf transfers the use while the substance stays in God's ownership and cannot be disposed of, whereas a gift transfers the thing itself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581}\n\nWasiyya: the Hanafis define it as a transfer of ownership attached to what comes after death, and the Shafi'is similarly. It differs from waqf: a bequest takes effect after death and may be of the thing or of its use, while waqf is a gift made in life and only of the use. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581}\n\nThe legality of waqf: the majority of jurists hold it lawful, binding and a recommended act of devotion, citing the report of Ibn 'Umar that 'Umar got land at Khaybar and the Prophet told him, if he wished, to hold back its substance and give its produce in charity; the saying that when a man dies his deeds end except for three, among them continuing charity; and the report of Jabir that every wealthy man among the emigrants and the helpers held back property in endless charity. Ibn Qudama calls this consensus of the Companions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17582} Ibn 'Abidin, quoting al-Is'af, says waqf is lawful according to Abu Hanifa and his companions; the disagreement is about its binding character: for Abu Hanifa it is like a loan of use, with the ownership remaining with the founder, binding only by a judge's ruling or when made as a bequest. Ibn Qudama reports Shurayh as not accepting it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17582} On its legal ruling: it is basically a recommended act of devotion; it becomes obligatory when vowed; it is permitted when not made for the sake of devotion, as a dhimmi's waqf, which has no reward; and forbidden when it serves sin, as an endowment for a church. The Malikis mention that an endowment only for sons and not daughters is forbidden as resembling the custom of the pre-Islamic age, but Ibn al-Qasim preferred disliking it and enforcing it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17582}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583}\n\nThe pillars of waqf: the majority (Malikis, Shafi'is, Hanbalis) count four: the formula, the founder, the beneficiary and the thing endowed; the Hanafis count only the formula. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583} Waqf is not valid without an offer, and the jurists differ on whether acceptance is required. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583}\n\nThe formula of offer: whatever shows the founder's intent by word, a clear sign, writing or act. The express words are 'I endowed' (waqaftu), which the Malikis, Shafi'is and Hanbalis hold express, and 'I detained' (habastu), express for the Hanbalis, the Maliki view and the sounder Shafi'i view, and 'I made a way' (sabbaltu), express for the Shafi'is and Hanbalis in the sounder view, since custom has fixed their use and the Prophet's words to 'Umar use the same. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17584} The allusive words are 'I gave in charity' (tasaddaqtu), which the Hanbalis and Malikis count allusive, and which the Shafi'is count express when it is joined to a general beneficiary such as the poor, and otherwise allusive; also 'I forbade' and 'I made eternal', allusive for the Hanbalis and the sounder Shafi'i view; they make a waqf only when joined to a clear sign, such as 'a charity endowed', 'a charity never to be sold, given or inherited', or when intention is added. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17584}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17585}"
