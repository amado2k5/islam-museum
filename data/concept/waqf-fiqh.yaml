id: concept/waqf-fiqh
class: concept
kind: legal
label:
  ar: "وَقْف"
  en: "Waqf (endowment, fiqh)"
summary:
  ar: "الوقف في اللغة الحبس، ومنه وقفت الدار حبستها في سبيل الله، ومنه المنع والسكون، ويُطلق على الشيء الموقوف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579} وفي الاصطلاح تعريفات متعددة: عند الحنفية حبس العين على حكم ملك الله تعالى وصرف منفعتها على من أحب عند الصاحبين، وعند أبي حنيفة حبس العين على حكم ملك الواقف والتصدق بالمنفعة؛ وعند المالكية إعطاء منفعة شيء مدة وجوده لازماً بقاؤه في ملك معطيه ولو تقديراً؛ وعند الشافعية حبس مال يمكن الانتفاع به مع بقاء عينه بقطع التصرف في رقبته على مصرف مباح موجود؛ وعند الحنابلة تحبيس مالك مطلق التصرف ماله المنتفع به مع بقاء عينه يُصرف ريعه إلى جهة بر تقرباً إلى الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579}\n\nالألفاظ ذات الصلة: التبرع (التطوع بالشيء دون عوض، وهو أعم من الوقف)، والصدقة (تمليك في الحياة بغير عوض، وقد تُطلق على الوقف كما في حديث عمر في أرضه)، والهبة (العطية بلا عوض)، والعارية (إباحة الانتفاع بالعين مع بقاء ملكها للمعير)، والوصية. والفرق بين الوقف والهبة أن الوقف تمليك المنفعة مع بقاء العين على ملك الله فلا يجوز التصرف فيها، والهبة تمليك للعين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581}\n\nالوصية: الحنفية تعريفها تمليك مضاف إلى ما بعد الموت، والشافعية نحو ذلك؛ والفرق بينها وبين الوقف أن الوصية تكون بعد الموت وقد تكون بالعين أو المنفعة، أما الوقف فتبرع في الحياة وبالمنفعة فقط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581}\n\nمشروعية الوقف: ذهب جمهور الفقهاء إلى مشروعيته ولزومه واعتباره من القُرَب المندوب إليها، واستدلوا بحديث ابن عمر في أرض عمر بخيبر وقول النبي له «إن شئت حبست أصلها وتصدّقت بها»، وبحديث «إذا مات الإنسان انقطع عنه عمله إلا من ثلاث...»، وبأثر جابر في أن من له مال من المهاجرين والأنصار حبس مالاً؛ وقال ابن قدامة إن ذلك إجماع من الصحابة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17582} ونقل ابن عابدين عن الإسعاف أن الوقف جائز عند أبي حنيفة وأصحابه، وأن الخلاف في اللزوم، فعند أبي حنيفة يجوز جواز العارية ولا يلزم إلا بحكم القاضي أو بإخراجه مخرج الوصية؛ ونقل ابن قدامة عن شريح أنه لم يره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17582} وفي الحكم التكليفي: الأصل أنه قربة مندوبة، وقد يكون فرضاً إن نُذر، ومباحاً إن كان بلا قصد القربة كوقف الذمي فلا ثواب له، وحراماً إن كان على معصية كالكنيسة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17582}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583} وذكر الكتاب أن بعض المالكية قالوا إن الوقف على البنين دون البنات حرام لشبهه بفعل الجاهلية، لكن ابن القاسم رأى الكراهة فيمضي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583}\n\nأركان الوقف: عند الجمهور (المالكية والشافعية والحنابلة) أربعة: الصيغة والواقف والموقوف عليه والموقوف، وعند الحنفية الركن الصيغة فقط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583} ولا ينعقد الوقف إلا بالإيجاب، واختلفوا في اشتراط القبول لانعقاده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583}\n\nصيغة الإيجاب: ما يدل على إرادة الواقف من لفظ أو إشارة مفهمة أو كتابة أو فعل. والألفاظ الصريحة عند المالكية والشافعية والحنابلة: «وقفت»، وكذا «حبست» عند المالكية والحنابلة والشافعية على الصحيح، و«سبّلت» عند الشافعية والحنابلة على الصحيح؛ ويصير الوقف بها دون زيادة لعرف الاستعمال، ولأن النبي قال لعمر «إن شئت حبست أصلها». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17584} والكناية: لفظ «تصدقت»، إلا أن يضيفه إلى جهة عامة كالفقراء وينوي الوقف عند بعض الشافعية، وكذا «حرّمت» و«أبّدت» عند الحنابلة والأصح عند الشافعية، ولا يحصل الوقف بها إلا بضم قرينة كقوله «صدقة موقوفة» أو «صدقة لا تُباع ولا توهب ولا تورث» أو نية الوقف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17584}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17585}\n\nإذا اجتمع في يد القيّم من غلة الوقف ما يصح صرفه في وجه من وجوه البر، كفكّ الأسرى المسلمين أو إعانة الغازي المنقطع، والوقف محتاج إلى الإصلاح، فإن لم يكن في تأخير الإصلاح إلى غلة السنة التالية ضرر بيّن يُخشى معه خراب الوقف، صُرفت الغلة إلى وجه البر وأُخّرت المرمة، وإن كان في التأخير ضرر بيّن صُرفت الغلة أولاً إلى المرمة ثم ما فضل إلى وجه البر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} وذكر ابن نجيم أن المتولي إذا صرف الغلة للمستحقين وهناك عمارة لا يجوز تأخيرها كان ضامناً، لأن ما يحتاج إليه الوقف من العمارة والمؤنة مستثنى من حق الفقراء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661}\n\nعند الحنفية إذا كانت العمارة ضرورية، كرفع سقف أو بناء جدار، قُدّمت على جميع جهات الصرف، لأنه ليس من النظر أن يخرب المسجد لأجل ما يُعطى للإمام والمؤذن؛ فإن فضل شيء عن التعمير أُعطي ما هو أقرب إلى الوقف مما في قطعه ضرر بيّن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} وإن لم تكن العمارة ضرورية، بحيث لا يؤدي تركها إلى خراب العين لو أُخّرت إلى غلة السنة القادمة، قُدّم الأهم فالأهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} وفرّق الحنفية بين أن يشترط الواقف تقديم العمارة كل سنة، فيُمسك القيّم كل سنة قدرها وإن لم تكن محتاجة الآن، وبين السكوت عنه، فلا تُدّخر العمارة عند عدم الحاجة إليها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} وإذا انهدم شيء من بناء الوقف وآلته صرفه الحاكم في عمارته، فإن كان التهيؤ للعمارة ثابتاً في الحال صُرف إليها، وإلا حُفظ حتى يتهيأ ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661}\n\nوعند الشافعية يُدّخر من زيادة غلة المسجد على حاجته، بتقدير هدمه، ويُشترى بالباقي عقار فيُوقف، لأن ذلك أحفظ له، ولا يُشترى من الموقوف على عمارته، لأن الواقف وقفه عليها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662}\n\nاختلف الفقهاء في الجهة التي يُنفق منها على الموقوف وعمارته. فالحنفية والمالكية يرون أن ذلك من غلة الوقف شرط الواقف أو لم يشرط، لأن الوقف صدقة جارية في سبيل الله لا تجري إلا بهذا الطريق، وقال المالكية إن شرط الواقف غير ذلك بطل شرطه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} وإذا وقف الواقف داره على سكنى ولده فالعمارة على من له السكنى من ماله لا من الغلة، إذ الغرم بالغنم، فإن امتنع أو عجز لفقره آجرها القاضي منه أو من غيره وعمّرها من أجرتها، ولا يُجبر الآبي على العمارة، وهو قول المالكية أيضاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} وقال المالكية إن الفرس الموقوف للغزو يُنفق عليه من بيت المال، فإن عُدم بيت المال بيع وعوض بثمنه سلاح ونحوه مما لا يحتاج إلى نفقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662}\n\nوذهب الشافعية والحنابلة إلى اتباع شرط الواقف. فعند الشافعية تكون النفقة ومؤنة التجهيز والعمارة من حيث شُرطت، وإلا فمن منافع الموقوف نفسه، ككسب العبد وغلة العقار، فإذا تعطلت منافعه فالنفقة ومؤنة التجهيز من بيت المال، أما العمارة فلا تجب على أحد، لأن العقار يشبه الملك المطلق، بخلاف الحيوان لصيانة روحه وحرمته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663} وعند الحنابلة يُرجع إلى شرط الواقف، فإن عيّن الإنفاق من غلته أو من غيرها عُمل به؛ فإن لم يعيّن وكان الموقوف ذا روح كالرقيق والخيل أُنفق عليه من غلته، فإن لم تكن له غلة فنفقته على الموقوف عليه المعيّن، فإن تعذر الإنفاق لعجزه بيع وصُرف ثمنه في عين أخرى تكون وقفاً، وإن أمكن إجارته أُجر بقدر نفقته. وإن كان الوقف على غير معيّن كالمساكين فنفقته في بيت المال، وإن كان الوقف عقاراً ونحوه لم تجب عمارته على أحد إلا بشرط الواقف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663}\n\nذهب الفقهاء إلى أن من تعدى على الوقف بهدم أو غيره ضمن. فعند الحنفية من آجر دار الوقف فجعل المستأجر رواقها مربطاً للدواب فخرّبها ضمن، لأنه فعل بغير إذن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663} وعند المالكية من هدم وقفاً تعدياً فعليه إعادته على ما كان عليه ولو كان المهدوم بالياً، والراجح عندهم أن عليه قيمته كسائر المتلفات، وهو ما ارتضاه ابن عرفة وشهره عياض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663} وعند الشافعية لا ضمان على من تلف في يده شيء من الكتب الموقوفة على طلب العلم بلا تعدٍّ، فإن تعدى ضمن، ومن التعدي استعماله فيما لم يُوقف له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663}\n\nإذا احتاج الموقوف إلى تعمير أو نفقة ولم تكفِ الغلة، فهل يجوز للناظر الاستدانة على الوقف، وهل يحتاج إلى إذن؟ ذهب المالكية والحنابلة والحنفية في قول إلى جواز ذلك للناظر من غير إذن الحاكم، كسائر تصرفاته، لأنه مؤتمن مطلق التصرف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} وقال المالكية إن من التزم حين أخذ النظر أن يصرف على الوقف من ماله إن احتاج لم يلزمه ذلك، وله الرجوع بما صرفه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} وعند الشافعية لا يجوز للناظر الاقتراض دون شرط الواقف أو إذن الإمام، ويجوز للإمام أن يقرض الناظر من بيت المال، أو يأذن له في الاقتراض، أو في الإنفاق من ماله على العمارة بشرط الرجوع؛ فإن اقترض بلا إذن ولا شرط لم يجز ولا يرجع بما صرفه لتعديه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664}\n\nوالمعتمد عند الحنفية أنه لا تجوز الاستدانة على الوقف إلا لمصلحته كالتعمير وشراء البذر، وتجوز بشرطين: إذن القاضي، فإن بَعُد عنه استدان المتولي بنفسه، وألا يتيسر إجارة العين والصرف من أجرتها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} وذكر ابن عابدين أن الاستدانة لا تجوز بغير أمر الواقف، لأن الدين لا يثبت ابتداءً إلا في الذمة، والوقف لا ذمة له، والفقراء وإن كانت لهم ذمة فلكثرتهم لا تتصور مطالبتهم، فلا يثبت الدين إلا على القيّم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} وترك القياس عند الضرورة، فالمختار عند أبي الليث أن الاستدانة تجوز بأمر القاضي إذا لم يكن من الاستدانة بد ولم يكن القاضي بعيداً عن المتولي، لأن ولايته أعم في مصالح المسلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} أما ما له منه بد، كالصرف على المستحقين، فلا تجوز الاستدانة لأجله، إلا ما يُعطى للإمام والخطيب والمؤذن، وكذا الحصير والزيت للمسجد على القول الراجح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664}\n\nوإذا لزم إذن القاضي فادعى المتولي الإذن، فالظاهر أنه لا يُقبل إلا ببينة وإن كان مقبول القول فيما في يده، لأنه يريد الرجوع في الغلة؛ فإن لم يستأذن حرم عليه الأخذ من الغلة، لأنه متبرع ما لم يوجد إذن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} وقال ابن عابدين إن المتولي إذا أنفق من ماله لإصلاح الوقف كان له الرجوع بذلك في غلته، وفي فتاوى الحانوتي أن له الرجوع ديانة، لكن لا يُقبل ادعاؤه ذلك إلا أن يُشهد أنه أنفق ليرجع، ويجب تقييد ذلك بما إذا كانت للوقف غلة، فإن لم تكن له غلة فلا بد من إذن القاضي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665}\n\nثانياً: بيع الموقوف والاستبدال به. إذا تعطّل الموقوف وصار بحال لا يُنتفع بها، أجاز الحنفية والمالكية والحنابلة والشافعية في رأي بيعه وجعل ثمنه في مثله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} وأجاز الحنفية البيع والاستبدال ولو لم يتعطل الموقوف، لكن بشروط خاصة، وفرّق المالكية بين العقار والمنقول في الجملة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665}\n\nللاستبدال عند الحنفية ثلاث صور. الأولى أن يشترط الواقف لنفسه أو لغيره استبدال أرض الوقف بأرض أخرى حين الوقف، وله صيغتان: الأولى أن يقول «أرضي هذه صدقة موقوفة لله أبداً على أن أبيعها وأشتري بثمنها أرضاً أخرى» فتكون الثانية وقفاً بشرائط الأولى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} وذهب أبو يوسف وهلال والخصاف إلى جواز الوقف والشرط استحساناً، وهو الصحيح على ما في فتاوى قاضيخان، لأن هذا الشرط لا يُبطل حكم الوقف، فالوقف يحتمل الانتقال من أرض إلى أخرى، والثانية تقوم مقام الأولى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} ومثال ذلك أن أرض الوقف إذا غصبها غاصب فأجرى عليها الماء حتى صارت بحراً لا تصلح للزراعة ضمن قيمتها واشترى بها أرضاً تكون وقفاً على شروط الأولى، وكذلك إذا قلّ ريعها لآفة ولم تفضل غلتها عن مؤنتها، فصلاح الوقف في الاستبدال، فيصح أن يشترط الواقف ولاية الاستبدال وإن لم تكن الضرورة قائمة في الحال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666}\n\nوقال محمد ويوسف بن خالد السمتي إن الوقف صحيح والشرط باطل، وهو القياس. ووجّه السرخسي قول محمد بأن هذا الشرط لا يؤثر في المنع من زوال الوقف، فيتم الوقف ويبقى الاستبدال شرطاً فاسداً باطلاً في نفسه، كالمسجد إذا شُرط الاستبدال به أو شُرط أن يُصلّى فيه قوم دون قوم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} وقال بعض فقهاء الحنفية إن الوقف والشرط فاسدان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} ونقل الكمال بن الهمام عن الأنصاري أن الشرط صحيح، لكن لا يُباع إلا بإذن الحاكم، وينبغي للحاكم إذا رُفع إليه ولا منفعة في الوقف أن يأذن في بيعه إذا رآه أنظر لأهل الوقف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666}\n\nولو شرط الواقف أن يبيع الأرض ويشتري بثمنها أرضاً أخرى ولم يزد صح استحساناً، وصارت الثانية وقفاً بشروط الأولى من غير تجديد وقف، لأن الأرض تعيّنت للوقف فيقوم ثمنها مقامها. والقياس البطلان، لأنه لم يذكر إقامة أرض أخرى مقام الأولى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} والصيغة الثانية: لو شرط أن للقيّم الاستبدال ولم يشرطه لنفسه كان له أن يستبدل لنفسه، لأن إفادة الولاية لغيره فرع كونه يملكها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667}\n\nولو شرط الاستبدال لرجل آخر مع نفسه، ملك الواقف الاستبدال وحده ولا يملكه الآخر وحده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} وإذا شرط الاستبدال جاز ولو كانت العين ذات ريع ونفع، إذ لا يلزم خروج الوقف عن الانتفاع، ولا مباشرة القاضي له، ولا عدم ريع يُعمَّر به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} وقيّد الحنفية الاستبدال بما اشترطه الواقف من قدر ونوع؛ فإن شرط الاستبدال بأرض لم يجز بدار، وإن شرط أرض قرية لم يجز بغيرها لتفاوت أراضي القرى مؤنة واستغلالاً، وإن لم يُقيّد البدل فله أن يستبدل من جنس العقارات بأي أرض أو دار أو بلد شاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} وإن شرط الاستبدال فليس له أن يستبدل الأرض الثانية بأرض ثالثة، لأن الشرط وجد في الأولى فقط، إلا أن يذكر عبارة تفيد ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667}\n\nالصورة الثانية: ألا يشترط الواقف الاستبدال حين الوقف، سواء شرط عدم الاستبدال أو سكت، لكن صار الوقف بحيث لا يُنتفع به بالكلية، بأن لا يحصل منه شيء أو لا يفي بمؤنته؛ فالاستبدال في هذه الصورة جائز على الأصح إذا كان بإذن القاضي ورأى فيه المصلحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} ونقل ابن عابدين عن البحر أن كلام قاضيخان اختلف، ففي موضع جوّز للقاضي الاستبدال بلا شرط من الواقف حيث رأى المصلحة، وفي موضع منع ذلك ولو صارت الأرض بحال لا يُنتفع بها. والمعتمد أنه يجوز للقاضي الاستبدال بالشروط الآتية: أ- أن يخرج الموقوف عن الانتفاع بالكلية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667}\n\nومن شروط الاستبدال عند الحنفية، كما ذكروا، ألا يكون البيع بغبن فاحش، وأن يكون للوقف ريع يُعمَّر به، وأن يكون المستبدل ممن يُعدّ من أهل العلم والعمل، لئلا يُتطرّق إلى إبطال أوقاف المسلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} وأن يكون البدل عقاراً لا دراهم ودنانير، وألا يُباع ممن لا تُقبل شهادته له أو ممن له عليه دين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} وأن يكون البدل والمبدل من جنس واحد؛ وقال ابن عابدين نقلاً عن قنالي زاده إن الظاهر أن اتحاد الجنس لا يُشترط في الموقوف للاستغلال، لأن المنظور فيه كثرة الريع وقلة المرمة والمؤنة، فلو استُبدل الحانوت بأرض تُزرع وتحصل منها غلة بقدر أجرة الحانوت كان أحسن، أما الموقوف للسكنى فالمقصود فيه الانتفاع بالسكن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} وفي القنية أن مبادلة دار الوقف بدار أخرى تجوز إذا كانت في محلة واحدة أو في محلة خير منها، ولا تجوز في العكس وإن كانت المملوكة أكثر مساحة وقيمة وأجرة، لاحتمال خرابها في المحلة الأدنى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668}\n\nونقل الكتاب عن شرح منظومة ابن وهبان في البحر الرائق سؤالاً: هل يجوز الاستبدال إذا شرط الواقف عدمه، أو كان الناظر معزولاً قبل الاستبدال؟ فقال الطرسوسي إنه لا نقل فيه، وإن مقتضى قواعد المذهب أن للقاضي أن يستبدل إذا رأى المصلحة فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} وروي عن محمد أنه إذا ضعفت الأرض الموقوفة عن الاستغلال، والقيّم يجد بثمنها أخرى أكثر ريعاً، جاز له بيعها وشراء ما هو أكثر ريعاً؛ ومن المشايخ من منع البيع والاستبدال تعطل الوقف أو لم يتعطل، وقال قاضيخان إن الوقف المرسل، أي الذي لم يُذكر فيه شرط الاستبدال، لا يجوز بيعه ولا الاستبدال به ولو كانت أرضه سبخة لا ينتفع بها، لأن سبيل الوقف أن يكون مؤبداً لا يُباع، وإنما تثبت ولاية الاستبدال بالشرط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669}\n\nالصورة الثالثة: ألا يشترط الواقف الاستبدال، وللوقف ريع وغلات ولم يتعطل، لكن في استبداله نفع في الجملة وبدله خير منه نفعاً وريعاً. قال ابن عابدين إن هذا لا يجوز استبداله على الأصح المختار، كما حرره قنالي زاده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} ونقل ابن عابدين عن الأشباه أنه لا يجوز استبدال العامر إلا في أربع مسائل: الأولى إذا شرط الواقف الاستبدال؛ والثانية إذا غصبه غاصب وأجرى عليه الماء حتى صار بحراً، فيضمن القيمة ويشتري المتولي بها أرضاً بدلاً؛ والثالثة إذا جحده الغاصب ولا بينة، وأراد دفع القيمة، فللمتولي أخذها ليشتري بها بدلاً؛ والرابعة إذا رغب فيه إنسان ببدل أكثر غلة وأحسن موقعاً، فيجوز على قول أبي يوسف وعليه الفتوى، وقال صاحب النهر إن ذلك معارض بقول صدر الشريعة: نحن لا نفتي بقول أبي يوسف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669}\n\nالاستبدال بالموقوف عند المالكية. يفرق المالكية بين العقار والمنقول في البيع والاستبدال. فأجازوا الاستبدال في المنقول إذا لم توجد جهة تنفق عليه وخيف هلاكه، أو تعطلت منافعه فصار لا ينتفع به فيما حُبس من أجله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} فالفرس الموقوف في سبيل الله كالغزو والرباط تكون نفقته في بيت المال، فإن عُدم بيت المال بيع وعوّض بدله سلاح ونحوه مما لا يحتاج إلى نفقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} ويُباع كل حبس منقول لا ينتفع به، كفرس أصيب بداء الكلب، أو ثوب يخلق، أو عبد يهرم، أو كتب تبلى؛ ويُجعل ثمنه في مثله إن أمكن، أو في شقص منه إن تعذر شراؤه كاملاً، فإن تعذر تُصدّق بالثمن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} ومن ذلك ذكور الحيوانات الموقوفة للغزو أو للنسل إذا فاض عن الحاجة أو كبرت الإناث حتى لا ينتفع بها، فتُباع ويُشترى بثمنها إناث صغار لتمام النفع، وتكون وقفاً كأصلها، كما ذكر الدردير في النعام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670}\n\nأما العقار فالمذهب عند المالكية أنه لا يُباع ولو خرب وصار لا ينتفع به، داراً كان أو حوانيت أو غيرها، ولا يُستبدل بمثله غير خرب؛ وقد روى أبو الفرج عن مالك أن الإمام إذا رأى البيع لمصلحة جاز أن يُجعل ثمنه في مثله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} وأجاز بعضهم معاوضة الربع الخرب، فقد نقل التاج والإكليل منع بيع ما خرب من ربع الحبس، وعلّل ابن الجهم ذلك بأنه يوجد من يُصلحه بإجارته سنين فيعود كما كان، واختُلف في معاوضة الربع الخرب بربع غير خرب؛ وقال ابن رشد: إن انقطعت منفعة القطعة جملة وعجز عن عمارتها وكرائها، فلا بأس بالمعاوضة بمكان يكون حبساً مكانها، بحكم من القاضي بعد ثبوت السبب وتحقق الغبطة للمعوّض عنه، ويُسجَّل ذلك ويُشهد به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670}\n\nوأجاز المالكية بيع العقار لضرورة توسعة مسجد جامع، سواء كان الوقف على معينين أو غير معينين. وقال ابن رشد إن ظاهر سماع ابن القاسم أن ذلك جائز في كل مسجد، وقول سحنون، وفي النوادر عن مالك وغيره أن ذلك في مساجد الجوامع إن احتيج إليه، لا في مساجد الجماعات؛ لأن الضرورة فيها ليست كالجوامع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} كما يجوز بيع الوقف لتوسعة مقبرة أو طريق لمرور الناس، ولو جبراً على المستحقين أو الناظر، ويجب على المستحقين أن يُجعل ثمنه في حبس غيره، ولا يجبرهم الحاكم على الجعل في حبس غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} وقال الشرح الصغير إن ما وُسّع به المسجد من الرباع يُدفع ثمنه إذا كان حبساً على معيّن، أما الحبس على غير معيّن كالفقراء فلا يلزم تعويضه، لأنه لم يتعلق به حق لمعيّن، ولأن ما يحصل من الأجر للواقف إذا دخل في المسجد أعظم مما قصده أولاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671}\n\nوقال المالكية إن اشترط الواقف التغيير والتبديل عُمل بشرطه، أما إذا شرط أنه إن وجد فيه ثمناً مرغوباً بِيع واشتُري غيره، فقد ذكرت النوادر والمتيطية أنه لا يجوز ذلك، فإن وقع مضى وعُمل بشرطه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} ونقل فتح العلي المالك واقعة: أرض موقوفة على سبيل في طريق المسلمين، شرط واقفها ألا تُباع ولا تُستبدل، ثم استبدل ناظر السبيل بها أرضاً من أراضي الديوان، فقال الدردير إن المبادلة باطلة حيث شرط الواقف عدم الاستبدال وأطلق، ويجب على الناظر رد أرض الديوان لصاحبها وأخذ أرض الوقف بعينها، ومن امتنع زجره الحاكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671}\n\nالاستبدال بالموقوف عند الشافعية. جاء في المهذب أنه إذا وقف مسجداً فخرب المكان وانقطعت الصلاة فيه لم يعد إلى الملك، ولم يجز التصرف فيه، لأن ما زال عنه الملك لحق الله تعالى لا يعود إلى الملك بالاختلال، كمن أعتق عبداً ثم زَمِن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} وقال الشربيني إن الأصح جواز بيع حصير المسجد الموقوفة إذا بليت، وجذوعه إذا انكسرت أو أشرفت على ذلك، ولم تصلح إلا للإحراق، لئلا تضيع ويضيق المكان بها، فتحصيل نزر يسير من ثمنها للوقف أولى من ضياعها، ولا تدخل بذلك في بيع الوقف لأنها صارت في حكم المعدوم، وهذا ما جرى عليه الشيخان.  {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} وقال الرافعي إن القياس أن يُشترى بثمن الحصير حصير لا غيرها، وقال الأذرعي إن المراد بذلك مقام التبن في الطين؛ أما الجذوع التي تصلح لغير الإحراق، كألواح وأبواب، فلا تُباع قطعاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672} وإذا خِيف على المسجد السقوط نُقض، وبنى الحاكم بنقضه مسجداً آخر إن رأى ذلك، وبناؤه بقربه أولى، ولا يُبنى به بئر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672} وإذا وقف على قنطرة فانحرق الوادي وتعطلت القنطرة، جاز نقلها إلى محل الحاجة؛ وغلة وقف الثغر إذا حصل فيه الأمن يحفظها الناظر لاحتمال عوده ثغراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672}\n\nوإن وقف نخلة فجفّت، أو بهيمة فزمنت، أو جذوعاً على مسجد فتكسرت، ففيه وجهان: الأصح عدم جواز البيع كما في المسجد، والثاني يجوز لأنه لا يُرجى نفعه. وإذا قيل بالبيع، فحكم ثمنه حكم القيمة التي توجد من متلف الوقف؛ فإن قيل إن الملك في رقبة الموقوف للموقوف عليه، كان الثمن له، وإن قيل إنه لله تعالى وهو الأظهر، اشتُري به مثله ليكون وقفاً مكانه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672} وقال أبو حامد الإسفراييني إن الثمن يُشترى به مثله ليكون وقفاً مكانه بلا خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672}\n\nالاستبدال بالموقوف عند الحنابلة. يجوز الاستبدال عندهم إذا لم يعد الوقف صالحاً للغرض الذي وقف من أجله ولا للانتفاع به، سواء كان منقولاً أو عقاراً، ومسجداً أو غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} فيحرم بيع الوقف ولا يصح، ولا تصح مناقلته ولو بخير منه نصاً، إلا أن تتعطل منافعه المقصودة بخراب ولم يوجد في ريعه ما يعمره فيُباع، أو تتعطل منافعه بغير خراب كخشب تشعث وخِيف سقوطه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} وإذا كان الوقف مسجداً وتعطل نفعه المقصود لضيقه على أهله، وتعذرت توسعته، أو لخراب محلته، أو لكون الموضع قذراً يمنع من الصلاة فيه، قال القاضي يصح بيعه ويُصرف ثمنه في مثله، لأن إبقاءه كذلك إضاعة للمال، وإنما يُستبقى الغرض في عين أخرى، واتصال الأبدال يجري مجرى الأعيان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} ويصح بيع شجرة موقوفة يبست، وجذع موقوف انكسر أو بلي أو خِيف انكساره أو هدمه؛ وقال في التلخيص إذا أشرف جذع الوقف على الانكسار، أو داره على الانهدام، وعُلم أنه لو أُخّر خرج عن كونه منتفعاً به، بِيع رعاية للمالية؛ والمدارس والربط والخانات المسبّلة إذا خربت يجوز بيعها عندهم على وجه واحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} والفرس الموقوف للغزو إذا لم يصلح له يُباع ويُشترى بثمنه فرس يصلح، وإذا اشتُري البدل صار وقفاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} وشرط الواقف عدم البيع فاسد. والذي يتولى البيع الحاكم إن كان الوقف على وجوه الخير كالمساكين والمساجد والقناطر، والناظر الخاص إن كان الوقف على شخص معيّن أو جماعة معيّنين، والأحوط ألا يفعل إلا بإذن الحاكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} وإذا اشتُري البدل لجهة الوقف صار وقفاً، والاحتياط أن يُوقف بصيغة جديدة حتى لا ينقضه من لا يرى وقفيته بمجرد الشراء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674}\n\nرجوع الوقف إلى ملك الواقف. ذهب محمد بن الحسن من الحنفية إلى أنه إذا خرب ما حول المسجد واستُغني عنه، ولو مع بقائه عامراً، أو خرب المسجد ولا ما يُعمَّر به واستُغني عنه ببناء مسجد آخر، عاد إلى ملك الباني إن كان حياً، وإلى ورثته إن مات، خلافاً لأبي يوسف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} وعلّل محمد ذلك بأن الواقف عيّن الوقف لنوع قربة وقد انقطعت فينقطع هو أيضاً، فصار كحصير المسجد وحشيشه إذا استُغني عنه، وقنديله إذا خرب المسجد، فيعود إلى ملك متخذه، كالكفن إذا افترسه السبع يعود إلى مالكه، وكهدي الإحصار إذا زال الإحصار فأدرك الحج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} وعند أبي يوسف يُنقل إلى مسجد آخر بإذن القاضي، فيُباع نقضه بإذنه ويُصرف ثمنه إلى بعض المساجد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} ويتفرع على الخلاف أنه إذا انهدم الوقف ولا غلة فيه تعمّره، عاد إلى الباني أو ورثته عند محمد، لكن عند محمد إنما يعود إلى الملك ما خرج عن الانتفاع المقصود للواقف بالكلية، كحانوت احترق ولا يُستأجر بشيء؛ وما كان معداً للغلة لا يعود إلى الملك إلا أنقاضه، وتبقى ساحته وقفاً تُؤجَّر ولو بشيء قليل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} وقال الشافعية في مقابل الأصح إن الموقوف إذا تعطلت منفعته بسبب غير مضمون، كأن جفت الشجرة أو اقتلعتها ريح أو سيل، ولم يمكن إعادتها إلى مغرسها قبل جفافها، انقطع الوقف وعاد ملكاً للواقف أو وارثه، أما الأصح عندهم فلا يعود ملكاً بل يبقى وقفاً، والحكم كذلك عند الحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675}\n\nالنظر على الوقف. اتفق الفقهاء على أن النظر على الوقف يتبع شرط الواقف، فإذا جعل النظر لشخص معيّن اتُّبع شرطه، كما فعل عمر بن الخطاب حين جعل وقفه إلى ابنته حفصة تليه ما عاشت، ثم إلى ذوي الرأي من أهلها، كما نقل ابن قدامة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675} واختلفوا إذا شرط الواقف النظر لنفسه: فعند الحنفية والشافعية والحنابلة يجوز ذلك، أما المالكية فإن لم يحُز الموقوف عليه الوقف بطل بموت الواقف أو مرضه أو فَلَسه، وإن حازه الموقوف عليه وشرط الواقف النظر لنفسه صح الوقف، وأُجبر الواقف على أن يجعل النظر لغيره، إذ لا يجوز له أن يجعله لنفسه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675}\n\nوإن لم يشترط الواقف ناظراً، فعند المالكية والحنابلة: إن كان الوقف على غير معيّن كالفقراء والمساكين والمساجد، ولّى الحاكم عليه من يشاء، لأنه لا يمكنه تولي النظر بنفسه. وإن كان على معيّن رشيد فهو الذي يتولى أمره، لأنه ملكه ونفعه له فكان نظره إليه كملكه المطلق، فإن كان غير رشيد تولّى أمره وليّه، وفي احتمال عند الحنابلة، اختاره ابن أبي موسى، أن ينظر فيه الحاكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675}\n\nعند الحنفية اختلف الأقوال في ولاية النظر إذا لم يشترطها الواقف. فعند أبي يوسف، وهو الأصل، أن الولاية للواقف، ثم لوصيّه إن كان له وصي، وإلا فللحاكم؛ وعند هلال، وهو ظاهر المذهب، أنها للواقف، ثم لوصيّه أو للحاكم، لأن المتولي إنما يستفيد الولاية من الواقف بشرطه، فيستحيل أن يكون له الولاية وغيره يستفيدها منه، ولأن الواقف أقرب الناس إلى الوقف فيكون أولى بولايته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} وعند محمد لا تكون الولاية للواقف ما لم يشترطها، لأن التسليم إلى القيّم عنده شرط لصحة الوقف، فإذا سُلّم لم يبق للواقف ولاية فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} وإن مات الواقف ولم يجعل ولايته لأحد، جعل القاضي قيّماً من أهل بيت الواقف ما وجد من يصلح، لأنه أشفق أو لأن قصد الواقف نسبة الوقف إليه، فإن لم يجد فمن الأجانب من يصلح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} وعند الشافعية إذا لم يشترط الواقف النظارة لأحد، فالنظر للقاضي على المذهب، لأن له النظر العام؛ وقيل النظر للواقف لأنه كان إليه فيبقى على نظره؛ وقيل للموقوف عليه لأن الغلة له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677}\n\nشروط الناظر. اشترط الفقهاء لصلاحية الناظر شروطاً منها ما اتفقوا عليه ومنها ما اختلفوا فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676}\n\nالشرط الأول: التكليف. يتفق الفقهاء على أن الناظر يشترط فيه البلوغ والعقل، فلا تصح تولية الصبي ولا المجنون لعدم أهليتهما، وذلك في الجملة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} فعند المالكية والحنابلة إن لم يشترط الواقف ناظراً معيّناً، وكان الموقوف عليه معيّناً كزيد وعمرو، تولى أمر الوقف بنفسه، فإن كان صغيراً أو مجنوناً فوليّه يقوم مقامه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} وقال الحنابلة إن الملك في الموقوف ينتقل إلى الموقوف عليه إن كان آدمياً معيّناً أو جمعاً محصوراً، وينظر فيه إن كان رشيداً مكلفاً، أو وليّه إن كان صغيراً أو مجنوناً أو سفيهاً، وقال ابن أبي موسى ينظر فيه الحاكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677}\n\nوعند الحنفية نقل ابن عابدين عن الإسعاف أن التولية للصبي تبطل في القياس مطلقاً، وفي الاستحسان تبطل ما دام صغيراً، فإذا كبر كانت له الولاية؛ وقال الشلبي إن الإسناد للصغير لا يصح بحال، لأن النظر ولاية والصغير مولّى عليه فلا يولّى على غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} ورأى ابن عابدين في فتاوى رشيد الدين أن القاضي إذا فوّض التولية إلى صبي جاز إذا كان أهلاً للحفظ، وحمل ما في الإسعاف على من لا يقدر على التصرف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} وكما يمنع الجنون التولية ابتداءً يمنعها بقاءً، فلو جُنّ الناظر عُزل؛ ونقل ابن عابدين عن الفتح أن الناظر ينعزل بالجنون المطبق سنة لا أقل، فإن برئ عاد إليه النظر، قال في النهر إن هذا في المشروط له النظر، أما منصوب القاضي فلا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} ونص الشافعية على أن الجنون تنسلب به الولايات، وقال الشبراملسي إن المجنون إذا أفاق تعود إليه ولاية النظارة بنفس الإفاقة إذا كانت بشرط الواقف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678}\n\nالشرط الثاني: العدالة. يُشترط في ناظر الوقف أن يكون عدلاً، وفي ذلك تفصيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} فالحنفية اختلفوا في كونها شرط صحة أو شرط أولوية؛ فقال الإسعاف لا يُولّى إلا أمين قادر بنفسه أو بنائبه، لأن ليس من النظر تولية الخائن، ورأى ابن عابدين أن العدالة شرط أولوية لا شرط صحة، وأن الناظر إذا فسق استحق العزل ولا ينعزل، كالقاضي إذا فسق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679}\n\nوعند المالكية تُعتبر العدالة إذا كان الناظر منصوباً من القاضي أو من الواقف، فالنظر في الحبس لمن يجعله إليه الواقف، لمن يُوثق بدينه وأمانته؛ فإن كان الناظر سيئ النظر غير مأمون عزله القاضي، إلا أن يكون الموقوف عليه مالكاً أمر نفسه ويرضى به. وذكر القرافي أن القاضي لا يعزل ناظراً إلا بجنحة، وللواقف عزله ولو بغير جنحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678}\n\nوعند الشافعية تُشترط العدالة الظاهرة والباطنة في المنصوب من الحاكم، وقال السبكي ينبغي أن يُكتفى في المنصوب من الواقف بالعدالة الظاهرة، وقال الأذرعي تُشترط الظاهرة والباطنة فيه أيضاً، ورجّح الشربيني الخطيب الأول. وإذا فسق الناظر انعزل، فالنظر للحاكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} وقال الشافعية إن الناظر إذا فسق ثم صار عدلاً، عادت إليه الولاية إن كانت مشروطة في أصل الوقف منصوصاً عليها بعينها، وإلا فلا، أفتى بذلك النووي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} وقال الحنابلة إنه إذا كان النظر لغير الموقوف عليه، وكانت التولية من الحاكم، أو من ناظر أصلي، فلا بد من العدالة لأنها ولاية على مال، كالولاية على مال اليتيم؛ فإن لم يكن عدلاً أُزيلت يده حفظاً للوقف، فإن عاد إلى أهليته عاد حقه. وإن كان الناظر مشروطاً من الواقف فلا تُشترط فيه العدالة، ويُضم إلى الفاسق عدل، لأن مراعاة حفظ الوقف أهم من إبقاء ولاية فاسق، وإن كان النظر للموقوف عليه عدلاً كان أو فاسقاً فهو أحق به، وقيل يُضم إليه أمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680}\n\nالشرط الثالث: الكفاية، أي قوة الشخص وقدرته على التصرف فيما ينظر فيه. نص الشافعية والحنابلة على اشتراطها، لأن حفظ الوقف مطلوب شرعاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} فإن اختلت الكفاية، قال الشافعية ينزع الحاكم النظر من الناظر وإن كان مشروطاً له، وقال النووي إن زال الاختلال عاد نظره إن كان مشروطاً منصوصاً عليه بعينه. وقال الحنابلة إن اختلت الكفاية لا يُعزل الناظر، بل يُضم إليه أمين قوي ليحصل المقصود. أما الحنفية فقالوا يُعزل الناظر وجوباً إذا كان غير مأمون أو عاجزاً؛ وكلام المالكية يفيد اشتراط الكفاية أيضاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680}\n\nالشرط الرابع: الإسلام. قال الحنابلة يُشترط الإسلام في الناظر إن كان الموقوف عليه مسلماً، أو كانت الجهة كالمسجد، استناداً إلى سورة النساء، آية ١٤١، التي يستدل بها الحنابلة على هذا الشرط، فإن كان الوقف على كافر معيّن جاز أن يكون الناظر كافراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680} وأجاز الحنفية أن يكون الناظر ذمياً، ولا يشترطون الإسلام؛ فلو عزله القاضي لسبب ثم أسلم لم تعد إليه الولاية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680} وقال الرملي إن القياس على الوصية والنكاح صحة تولية الذمي للنظر إذا كان الموقوف عليه ذمياً وعدلاً في دينه، لكن يُرد ذلك باشتراط العدالة الحقيقية في باب الوقف، وقال الشبراملسي إن الرد هو المعتمد؛ وفرّق بينه وبين تزويج الذمي موليته بأن ولي النكاح يحمله وازع طبيعي على الحرص على تحصين موليته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17681}\n\nأجرة ناظر الوقف. تشمل المسألة أحقية الناظر في الأجرة، وتقديرها من الواقف أو القاضي، ومقدارها، وهل يستحق أجراً إذا لم يجعل له أحد أجراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17681} أ- أحقية الناظر: ذهب الفقهاء إلى أن الناظر يستحق أجرة نظير قيامه بإدارة الوقف والعناية بمصالحه. واستدلوا بقول عمر حين وقف أرضه بخيبر، إن على من يليها أن يأكل بالمعروف أو يُطعم صديقاً غير متمول فيه، وبفعل علي حين جعل نفقة العبيد الذين وقفهم ليقوموا بعمارتها من الغلة، وبالقياس على عامل الزكاة، وبحديث «ما تركت بعد نفقة نسائي ومؤنة عاملي فهو صدقة»، وقال ابن حجر إن مراد العامل فيه القيّم على الأرض، فيدل على مشروعية أجرته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682}\n\nب- تقدير الأجرة. إما أن تكون مشروطة من الواقف، فيأخذ الناظر ما شرطه ولو زاد على أجر المثل، وهذا قول الحنفية والشافعية والحنابلة؛ فعند الحنفية إن عيّن الواقف أقل من أجر المثل كمّل القاضي له أجر المثل بطلبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} وعند الشافعية إن جعل الواقف النظر لنفسه وشرط لنفسه أجراً لم يزد على أجرة المثل، فإن شرط أكثر لم يصح الوقف لأنه وقف على نفسه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} وقال الحنابلة إن شرط الواقف للناظر أجرة مقدرة، فإن كانت بقدر أجرة المثل اختص بها، وإن كانت أكثر فكلفة ما يحتاجه الوقف من أمناء وغيرهم تُصرف من الزيادة حتى يبقى له أجر مثله، إلا أن يكون الواقف شرطه له خالصاً. أما المالكية فلم يحددوا شيئاً وتركوا ذلك لتقدير الواقف أو القاضي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682}\n\nوإن لم يعيّن الواقف أجراً، فالأجر يقدّره القاضي: فعند الحنفية والحنابلة لا يزيد المقدَّر عن أجرة المثل، فإن عيّن زائداً مُنع عنه الزائد. وقال المالكية يُترك الأمر لاجتهاد القاضي، وقال ابن فتوح يجوز للقاضي أن يجعل لمن قدّمه للنظر رزقاً معلوماً في كل شهر باجتهاده بحسب عمله، وفعله الأئمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} وقال الشافعية إن لم يذكر الواقف للناظر أجرة فلا أجرة له على الصحيح، وليس له أن يأخذ شيئاً من مال الوقف، فإن فعل ضمن ولم يبرأ إلا بتسليمه إلى الحاكم، وهذا المعتمد. وإن رفع الناظر الأمر إلى القاضي ليقرر له أجرة، فهو كالوليّ إذا رفع أمر حفظ مال الطفل إلى القاضي؛ وذكر العراقي أن مقتضاه أنه يأخذ الأجرة مع الحاجة، إما قدر النفقة كما رجّحه الرافعي، أو الأقل من نفقته وأجرة مثله كما رجّحه النووي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683}\n\nج- إذا لم يعيّن الواقف أجراً للناظر. قال الرملي من الحنفية إن الناظر لا يستحق شيئاً إلا إذا جعل له القاضي أجرة مثل عمله. وحرر ابن عابدين أن الواقف إن عيّن شيئاً للناظر فهو له كثيراً كان أو قليلاً، عمل أو لم يعمل، ما لم يشترطه في مقابلة العمل؛ وإن لم يعيّن الواقف وعيّن القاضي أجرة مثله جاز، وإن عيّن أكثر مُنع الزائد، وإن لم يعمل فلا يستحق أجرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} وإن نصبه القاضي ولم يعيّن له شيئاً، فإن كان المعهود ألا يعمل إلا بأجرة مثله فله أجرة المثل، لأن المعهود كالمشروط، وإلا فلا شيء له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} وذكر ابن نجيم عن القنية رأيين للحنفية في منصوب القاضي إذا لم يعيّن له أجرة: الأول أنه لا شيء له ولو سعى فيه سنة، والثاني أن القيّم يستحق مثل أجر سعيه، شُرط له أجر أو لم يُشترط، لأنه لا يقبل القوامة ظاهراً إلا بأجر، والمعهود كالمشروط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683}"
  en: "Waqf, lexically, is detention: to hold back a thing in God's way; it also means prevention and stillness, and the word names the thing held. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579} Technically the jurists define it in several ways: for the Hanafi companions, the detention of a thing in God's ownership with its use given to whom the founder wishes; for Abu Hanifa, its detention in the founder's ownership with the use given as charity; for the Malikis, the grant of the use of a thing for as long as it exists, the ownership remaining with the grantor even notionally; for the Shafi'is, the detention of property whose use can be had with its substance kept, the disposal of its ownership cut off, for a lawful and existing purpose; for the Hanbalis, the detention by an owner of his property whose use is kept in its substance, with its income given to a charitable purpose seeking God's favour. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579}\n\nRelated words: tabarru' (giving without return, wider than waqf), sadaqa (gift in life without return, which may also name waqf, as in 'Umar's land), hiba (gift without return), 'ariya (the permission to use a thing while its owner keeps it), and wasiyya. The difference from a gift is that waqf transfers the use while the substance stays in God's ownership and cannot be disposed of, whereas a gift transfers the thing itself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581}\n\nWasiyya: the Hanafis define it as a transfer of ownership attached to what comes after death, and the Shafi'is similarly. It differs from waqf: a bequest takes effect after death and may be of the thing or of its use, while waqf is a gift made in life and only of the use. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581}\n\nThe legality of waqf: the majority of jurists hold it lawful, binding and a recommended act of devotion, citing the report of Ibn 'Umar that 'Umar got land at Khaybar and the Prophet told him, if he wished, to hold back its substance and give its produce in charity; the saying that when a man dies his deeds end except for three, among them continuing charity; and the report of Jabir that every wealthy man among the emigrants and the helpers held back property in endless charity. Ibn Qudama calls this consensus of the Companions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17582} Ibn 'Abidin, quoting al-Is'af, says waqf is lawful according to Abu Hanifa and his companions; the disagreement is about its binding character: for Abu Hanifa it is like a loan of use, with the ownership remaining with the founder, binding only by a judge's ruling or when made as a bequest. Ibn Qudama reports Shurayh as not accepting it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17582} On its legal ruling: it is basically a recommended act of devotion; it becomes obligatory when vowed; it is permitted when not made for the sake of devotion, as a dhimmi's waqf, which has no reward; and forbidden when it serves sin, as an endowment for a church. The Malikis mention that an endowment only for sons and not daughters is forbidden as resembling the custom of the pre-Islamic age, but Ibn al-Qasim preferred disliking it and enforcing it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17582}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583}\n\nThe pillars of waqf: the majority (Malikis, Shafi'is, Hanbalis) count four: the formula, the founder, the beneficiary and the thing endowed; the Hanafis count only the formula. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583} Waqf is not valid without an offer, and the jurists differ on whether acceptance is required. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17583}\n\nThe formula of offer: whatever shows the founder's intent by word, a clear sign, writing or act. The express words are 'I endowed' (waqaftu), which the Malikis, Shafi'is and Hanbalis hold express, and 'I detained' (habastu), express for the Hanbalis, the Maliki view and the sounder Shafi'i view, and 'I made a way' (sabbaltu), express for the Shafi'is and Hanbalis in the sounder view, since custom has fixed their use and the Prophet's words to 'Umar use the same. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17584} The allusive words are 'I gave in charity' (tasaddaqtu), which the Hanbalis and Malikis count allusive, and which the Shafi'is count express when it is joined to a general beneficiary such as the poor, and otherwise allusive; also 'I forbade' and 'I made eternal', allusive for the Hanbalis and the sounder Shafi'i view; they make a waqf only when joined to a clear sign, such as 'a charity endowed', 'a charity never to be sold, given or inherited', or when intention is added. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17584}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17585}\n\nWhen the administrator holds, from the endowment's income, a sum that may properly go to a work of charity, such as ransoming Muslim captives or aiding a stranded fighter, and the endowment needs repair, then: if delaying repair until next year's income causes no clear harm that threatens the endowment's ruin, the income goes to the charity and repair is postponed; if the delay causes clear harm, the income goes first to repair and only the surplus to the charity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} Ibn Najim states that an administrator who pays the beneficiaries while repair that cannot be delayed is due becomes liable, because the upkeep the endowment needs is excluded from the poor's right. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661}\n\nFor the Hanafis, where repair is necessary, such as raising a roof or building a wall, it takes precedence over all other uses, since it is not proper care to let a mosque fall into ruin for the sake of what is given to the imam and the muezzin; any surplus over the repair goes to the beneficiary nearest to the founder's purpose whose loss would cause clear harm. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} Where repair is not necessary, so that leaving it until the next year's income would not ruin the thing, the more important need comes first. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} The Hanafis separate the case where the founder stipulated that repair be given priority each year, when the administrator keeps the amount aside each year even if it is not yet needed, from the case of silence, when repair is paid when needed and nothing is saved for it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661} When part of an endowed building or its materials has fallen, the judge spends it on repair; if the means of repair are not ready at once, he keeps it until they are. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17661}\n\nFor the Shafi'is, the surplus of a mosque's income above what its repair needs, reckoned by the cost of its rebuilding, is saved, and with the balance a property is bought and endowed; this is safer for the mosque, and it is not bought from the endowed thing whose upkeep it is, since the founder endowed that thing for upkeep. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662}\n\nThe jurists differ on the source from which the endowed thing and its upkeep are paid. The Hanafis and Malikis hold that it comes from the endowment's income whether or not the founder stipulated this, since the endowment is a continuing charity in God's way and can continue only in this manner; the Malikis add that a stipulation to the contrary is void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} For the Hanafis, if the founder gave a house for his son's residence, its repair falls on the one who lives in it, from his own money and not from the income, since the burden follows the benefit; if he refuses or cannot pay because he is poor, the judge lets the house, from him or from another, and repairs it from the rent, and the one who refuses is not compelled to repair. The Malikis agree. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} The Malikis say that a horse endowed for raiding is fed from the public treasury; if there is no treasury, it is sold and its price buys weapons and similar things that need no feeding. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662}\n\nThe Shafi'is and Hanbalis follow the founder's terms. For the Shafi'is, the feeding, the equipping and the repair are paid from the source named; failing that, from the endowed thing's own benefits, such as a slave's earnings or a property's rent; if its benefits cease, the feeding and the equipping come from the public treasury, while repair is then owed by no one, because a property is like absolute ownership, unlike a living animal, whose life and sanctity must be preserved. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17662} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663} For the Hanbalis, the founder's terms govern. If he named a source of feeding, whether the income or another, that is followed. If he did not name one and the endowed thing is a living being, such as a slave or horses, it is fed from its own income; if there is no income, the feeding falls on the named beneficiary. If the feeding is impossible, the thing is sold and its price is spent on another thing that becomes an endowment; if it can be let out, it is let out for enough to feed it. If the beneficiary is unnamed, as the poor are, the feeding comes from the public treasury. For property, such as buildings, weapons and goods, repair is owed by no one unless the founder made it a condition. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663}\n\nThe jurists agree that whoever wrongfully damages an endowment, by demolition or otherwise, must pay. For the Hanafis, a man who lets an endowed house, and whose tenant uses its courtyard to tether animals and wrecks it, is liable, because he acted without permission. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663} For the Malikis, whoever wrongfully demolishes an endowment must rebuild it as it was, even if what was demolished was decayed; but the preponderant view among them is that he owes its value, like any other destroyed property. Ibn 'Arafa accepted this view and 'Iyad made it well known. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663} For the Shafi'is, no one is liable for a book endowed for the pursuit of learning that is lost in his hands without his fault; but whoever is at fault is liable, and using the book for a purpose other than the one endowed is a fault. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17663}\n\nWhen an endowed thing needs repair or upkeep and its income does not suffice, may the administrator borrow on the endowment, and does he need permission? The Malikis, Hanbalis and, in one view, the Hanafis hold that the administrator may borrow for the endowment without the judge's permission, as with his other acts, since he is a trusted agent with full power to act. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} The Malikis say that if an administrator undertook, on taking up the office, to spend from his own money on the endowment when needed, he is not bound by that, but he may recover what he spent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} For the Shafi'is, the administrator may not borrow without the founder's condition or the ruler's permission. The ruler may lend him money from the public treasury, permit him to borrow, or permit him to spend his own money on repair on condition that he may recover it. If he borrows without permission or condition, it is not allowed, and he cannot recover what he spent, since he transgressed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664}\n\nThe preferred Hanafi view is that borrowing on an endowment is not allowed unless it is needed for the endowment's good, such as repair or buying seed, and then only on two conditions: the judge's permission, and that letting the thing and spending its rent is not possible; if the judge is far away, the administrator may borrow on his own authority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} Ibn 'Abidin says borrowing is not allowed without the founder's order, because a debt attaches only to a person's liability; an endowment has no liability, the poor have liability but they cannot in practice be pursued, so the debt falls on the administrator alone. Necessity overrides this analogy; Abu al-Layth's preferred view is that borrowing is allowed with the judge's permission when there is no alternative and the judge is not far from the administrator, because the judge's authority covers the public interests of Muslims more widely. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664} Where there is an alternative, such as paying the beneficiaries, borrowing for that is not allowed, except for what is given to the imam, the preacher and the muezzin, and the mats and oil of a mosque, on the preferred view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17664}\n\nIf the judge's permission is required and the administrator claims to have had it, the claim is apparently not accepted without evidence, because he wants to take from the income, and his word is accepted only about what is in his hand. If he did not obtain permission, it is forbidden for him to take from the income, since he is then a volunteer, until permission is established. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} Ibn 'Abidin says that if the administrator spent his own money to repair the endowment, he may recover it from the endowment's income; the fatwa of al-Hanuti holds that he may recover it in conscience, but his claim is not accepted unless he had it witnessed that he spent in order to recover. This applies only where the endowment has income; without income, the judge's permission is necessary. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665}\n\nSecond, the sale of an endowment and its exchange. When an endowed thing is disabled and can no longer be used, the Hanafis, Malikis, Hanbalis and, in one view, the Shafi'is allow its sale and the spending of the price on a like thing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} The Hanafis allow sale and exchange even when the endowment is not disabled, under special conditions; the Malikis, in general, distinguish between real estate and movable goods. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665}\n\nThe Hanafis recognise three cases of exchange. In the first, the founder stipulates, at the endowment, that the endowed land may be exchanged for another land, either for himself or for another. This has two formulas; the first is to say: 'my land is an endowed charity to God forever, on condition that I sell it and buy with its price another land', and then the second land is endowed on the first's terms. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} Abu Yusuf, Hilal and al-Khassaf hold that the endowment and the condition are valid by juristic preference, which is the sound view according to the Fatawa Qadikhan; the condition does not undo the endowment, since an endowment can pass from one land to another, and the second stands in place of the first. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17665} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} For example, if an usurper floods an endowed land until it becomes a sea unfit for farming, he pays its value and buys another land which becomes an endowment on the first's terms; likewise, if its yield has fallen through blight and does not exceed its costs, the good of the endowment lies in exchange, so the founder may validly stipulate the power of exchange even when the need is not present now. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666}\n\nMuhammad and Yusuf ibn Khalid al-Samti hold that the endowment is valid and the condition void, which is the analogical view. Sarakhsi justifies Muhammad's view: the condition does not prevent the endowment from ending, so the endowment is completed, while the exchange stands as a void condition in itself, like a mosque on which an exchange is stipulated or where it is stipulated that only some people may pray. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} Some Hanafi jurists say the endowment and the condition are both void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} Kamal ibn al-Humam reports from al-Ansari that the condition is valid but the sale may be made only with the judge's permission, and the judge should permit a sale when there is no benefit in the endowment and he sees it is better for its beneficiaries. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666}\n\nIf the founder stipulated that the land be sold and another bought with its price, without adding a further endowment formula, the second land becomes an endowment on the first's terms without renewed formula, because the land was already fixed for the endowment and its price takes its place. By analogy the endowment would be void, since no other land was named to stand in the first's place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} The second formula: if the founder stipulated the right of exchange for the administrator and not for himself, the administrator may exchange for himself, since giving power to another follows from owning the power oneself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667}\n\nIf the right of exchange is stipulated for another man together with the founder, the founder alone holds the right, and the other man does not hold it alone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} Exchange under a stipulation is allowed even if the thing yields income and benefit, since the endowment does not thereby leave use, and neither the judge's direct action nor the absence of income for repair is required. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} The Hanafis limit exchange to what the founder stated in kind and type: if he stipulated exchange for land, it may not be made for a house; if he stipulated the land of a village, it may not be made for other land, since village lands differ in cost and yield; if he did not specify the replacement, he may exchange for any real estate, whether land, house or town, as he wishes, since the stipulation is general. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} If the stipulation covers one exchange, the founder may not exchange the second land for a third, since the condition was fulfilled only in the first, unless the words express that. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667}\n\nThe second case: the founder did not stipulate exchange at the endowment, whether he stipulated its absence or was silent, but the endowment came to a state in which it gives no benefit at all, such as giving no yield or not covering its upkeep. Exchange in this case is allowed on the sounder view when the judge permits it and sees the good in it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667} Ibn 'Abidin reports from al-Bahr that Qadikhan's words differ: in one place he allowed the judge to exchange without the founder's stipulation where he saw the good; in another he forbade it even when the land had come to a state where no benefit could be had. The sound view is that the judge may exchange on the following conditions, the first of which is that the endowed thing is wholly taken out of use. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17667}\n\nAmong the conditions for exchange, as the Hanafis state them: the sale must not be at a gross undervaluation; the endowment must have some yield with which it can be repaired; the exchanger must be a man of knowledge and action, so that the endowments of Muslims are not undermined; the replacement must be real estate and not cash; and the thing may not be sold to someone whose testimony cannot be accepted in his favour or to a creditor of the founder's heirs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} The exchanged and the replacement should be of one kind. Ibn 'Abidin, quoting Qanali-zada, says that the sameness of kind is probably not required for an endowment held for its yield, since what counts is a large return and little upkeep: exchanging a shop for land that yields rent equal to the shop's rent is better, because land lasts longer and needs less repair; whereas an endowment held for residence is judged by the residence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} In al-Qunya, a house endowment may be exchanged for another house only if the new one is in the same quarter or in a better quarter; the reverse is not allowed, even if the house held is larger in area, value and rent, because it may fall into ruin in the lesser quarter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668}\n\nThe Bahr al-Ra'iq, citing the commentary on Ibn Wahban's poem, asks whether exchange is allowed when the founder forbade it, or when the administrator is removed before exchanging, or when he is removed as soon as he decides to exchange. Tarsusi replies that there is no transmitted ruling, and that the rules of the school mean the judge may exchange when he sees the good in it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} The same work reports from Muhammad that if an endowed land has weakened in yield, and the administrator can buy with its price another land with higher yield, he may sell and buy that. Some shaykhs forbade sale and exchange whether or not the endowment had ceased to yield. Qadikhan says that an endowment without a stipulation of exchange may not be sold or exchanged even if its land is salty and unusable, because an endowment is meant to be perpetual and is not sold; the power of exchange arises only from a stipulation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669}\n\nThe third case: the founder did not stipulate exchange; the endowment has yield and is not disabled; but exchange would bring some general benefit, and the replacement is better in benefit and yield. Ibn 'Abidin says that this is not allowed on the preferred view, as Qanali-zada settled it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} Ibn 'Abidin also reports from al-Ashbah that a productive endowment may be exchanged only in four cases: first, when the founder stipulated exchange; second, when a usurper flooded the land into a sea, so that he pays its value and the administrator buys land with it; third, when the usurper denies the seizure and there is no evidence, so that the administrator takes the value to buy a replacement; and fourth, when someone desires the land and offers a replacement with more yield and a better location, which is allowed on Abu Yusuf's view and is the fatwa, as in the fatwas of Qari al-Hidaya. The author of al-Nahr says that Sadr al-Shari'a's rebuttal stands against this: we do not give fatwa on the view of Abu Yusuf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669}\n\nExchange of endowed property among the Malikis. The Malikis distinguish between real estate and movable goods in sale and in exchange. They allow exchange of movable goods when no party can maintain them and they are in danger of perishing, or when their benefit has ceased so that they cannot be used for the purpose for which they were detained. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} Thus a horse endowed in God's way, for raiding or frontier guard, is fed from the public treasury; if there is no treasury, it is sold and the price buys weapons and similar things that need no feeding. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} Any movable endowment that is not real estate and cannot be used is sold, such as a horse that has caught rabies, a cloth that wears out, a slave who grows old, or books that decay. Its price is spent on a like thing if possible, or on a share of such a thing if the whole cannot be bought, and if that is impossible the price is given in charity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} Likewise male animals endowed for raiding or breeding, when there are more of them than needed, or females that have grown too old to be of use, are sold and young females bought with the price, so that milk and offspring continue and the endowment remains, as al-Dardir says of ostriches. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17669} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670}\n\nFor real estate, the Maliki school holds that it may not be sold even if it is ruined and cannot be used, whether a house, shops or other buildings, and it may not be exchanged for a like unruined thing. Abu al-Faraj reports from Malik that the imam may sell it, if he sees the good in it, and spend the price on a like thing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} Some Malikis allowed the exchange of a ruined dwelling. Al-Taj wal-Iklil reports the absolute prohibition of selling a ruined dwelling of an endowment; Ibn al-Jahm gives the reason that someone will be found to repair it by renting it for years, so that it returns to its former state. The exchange of a ruined dwelling for an unruined one is disputed. Ibn Rushd says that if such a piece of land has lost all use and cannot be repaired or let, there is no harm in exchanging it for a place that will be endowed in its stead, by the judge's ruling after the cause is proved and the advantage to the endowment is clear; this is to be recorded and witnessed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670}\n\nThe Malikis allow the sale of real estate for the necessary widening of a congregational mosque, whether the endowment is held for named or unnamed persons. Ibn Rushd says that the apparent report of Ibn al-Qasim's collection allows it for every mosque, as does Sahnun's view; al-Nawadir reports from Malik and others that it applies to congregational mosques when there is need, and not to neighbourhood mosques, since the necessity there is not the same. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} Endowed property may also be sold to widen a graveyard or a road used by people, even against the will of the beneficiaries or the administrator; the beneficiaries are bound to have the price put into another endowment, but the judge may not compel them to accept a different endowment in its place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17670} Al-Sharh al-Saghir says that for property taken to widen a mosque, the price is paid if the endowment was held for named persons; if it was held for unnamed persons, such as the poor, no compensation is due, since no named person has a right attached to it, and the reward the founder gains when the property enters the mosque is greater than what he first intended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671}\n\nThe Malikis say that if the founder stipulated change and exchange, his condition is followed. If he stipulated that, should a desirable price be offered, the property be sold and another bought, al-Nawadir and al-Mutiyya report that this is not allowed; if it is done nevertheless, it stands and the founder's condition is applied. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} Fath al-'Ali al-Malik reports a case: an endowed land on a road used by Muslims, whose founder stipulated that it not be sold or exchanged, was exchanged by the administrator of the road for a state land, the administrator handing the endowed land to a farmer and taking state land in return. Dardir holds that where the founder stipulated no exchange and gave no exception, the exchange is void; the administrator must return the state land to its owner and take back the endowed land itself, and the ruler restrains anyone who refuses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671}\n\nExchange of endowed property among the Shafi'is. The Muhadhdhab says that if a mosque is endowed and then ruined so that prayer in it ceases, it does not return to ownership, and the owner may not dispose of it, because what left ownership for God's right does not return to ownership by ruin, as a man who frees a slave and then becomes disabled does not reclaim him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} Al-Sharbini says that the sounder view allows selling the mats of an endowed mosque when they have worn out, and its beams when they have broken or nearly so and are fit for nothing but burning, lest they be lost and the space be crowded with them to no purpose; a small sum from their price returning to the endowment is better than losing them. Such things are not counted as a sale of the endowment, since they are treated as nonexistent; this is the view on which the two shaykhs, al-Rafi'i and al-Nawawi, relied. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17671} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672} Al-Rafi'i says that the analogy is to buy a replacement mat with the price of the old one, and al-Adhra'i takes the mentioned case to be straw used in clay. Mats given or bought for a mosque are sold when needed. Beams that can be used for other things, such as planks and doors, are never sold. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672} If a mosque is at risk of falling, the judge may strip it and use the material to build another mosque, if he sees fit, and building it nearby is better; but he may not build a well with the material of a mosque. If an endowment on a bridge is destroyed by a flood and the bridge is not needed where it stands, it may be moved to where it is needed; the income of an endowment on a frontier that has become secure is kept by the administrator, in case the frontier returns. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672}\n\nIf an endowed date palm dries, an endowed animal is disabled, or the beams of a mosque break, there are two views, and the sounder is that they may not be sold, as with a mosque. The other view allows sale, since the thing is no longer hoped to yield benefit; the price then takes the rule of the value that comes from the destruction of endowed property. If the ownership of the endowed thing's substance is held to belong to the beneficiary, which is the lesser view, the price goes to him; if it belongs to God, which is the more apparent view, a like thing is bought with the price to become an endowment in its place. Abu Hamid al-Isfara'ini says that the price buys a like thing to become an endowment in its place, without dispute. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17672}\n\nExchange of endowed property among the Hanbalis. Among them exchange is allowed when the endowed thing is no longer fit for the purpose for which it was endowed and no longer serves to be used, whether it is movable or real estate, and whether it is a mosque or not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} They hold that selling an endowment is forbidden and invalid, and that exchanging it, even for something better, is invalid by explicit text, except where its intended benefit is lost through ruin and its yield cannot repair it, in which case it is sold; or where its intended benefit is lost by a cause other than ruin, such as wood that has cracked and is feared to fall. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} If the endowment is a mosque whose intended use is lost because it is too narrow for its people and cannot be widened, or because its neighbourhood is ruined, or because the place is filthy and prevents prayer in it, then, according to al-Qadi, sale is valid and the price is spent on a like thing, because keeping it so is a waste of property. Since an endowment is perpetual, when that cannot be kept in the same thing its purpose is preserved in another, and a succession of replacements is treated like the things themselves. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} A dried endowed tree may be sold; so may a beam that has broken, worn out or is feared to break or fall. Al-Talkhis says that when an endowed beam is near breaking, or an endowed house near collapse, and it is known that delay would take it out of use, it is sold to protect its value. Schools, hospices and caravanserais that are endowed may, when ruined, be sold by one view without dispute. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} An endowed horse for raiding that is no longer fit is sold and another horse fit for it is bought; once the replacement is bought it becomes an endowment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} A founder's stipulation that an unusable endowment not be sold is void, and it must be sold. The seller is the judge where the endowment is for a public good, such as the poor, mosques or bridges; where it is held for a named person or named group, or for the worshippers or muezzins of a mosque, the endowment's special administrator sells it. Even so, it is best done with the judge's permission, because such a sale binds those who come after the present holders, like a sale made against an absent party. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} Once the replacement is bought for the endowment's use it becomes an endowment; the prudent course is to re-endow it by a new formula, lest a later person, not seeing that the purchase made it an endowment, undo it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674}\n\nThe return of an endowment to the founder's ownership. Muhammad ibn al-Hasan of the Hanafis holds that if what surrounds a mosque is ruined and no longer needed, even while the mosque remains maintained, or if the mosque itself is ruined with no means to repair it and people no longer need it because another mosque has been built, then it returns to the ownership of its builder if he is alive, or to his heirs if he is dead; Abu Yusuf disagrees. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} Muhammad's reason: the founder gave the endowment to a kind of devotion, and since that devotion has ended the endowment ends with it. It is like a mosque's mat and grass when no longer needed, or its lamp when the mosque is ruined, which return to the one who made them; like a shroud that a beast has torn, which returns to its owner; and like an offering made by one who is prevented from completing the pilgrimage, which he may dispose of once the hindrance is removed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} Abu Yusuf says that it is moved to another mosque with the judge's permission, and its debris is sold with the judge's permission and the price spent on some mosques. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674}\n\nThe Hanafi consequence is that if an endowment falls into ruin and has no income to repair it, it returns to the builder or his heirs in Muhammad's view, though not in Abu Yusuf's. But in Muhammad's view, only what has left the founder's intended use altogether returns to ownership, such as a shop that burned and cannot be let for anything, or a hostel or a neighbourhood cistern that is ruined with no means of repair; what was made for income returns to ownership only as its debris, while its open ground remains an endowment that is let, even for a small rent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} Khulasa reports that Muhammad said of a horse that was made a detained endowment in God's way and became unfit to ride that it is sold and its price goes to its owner or his heirs, as with a mosque. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} The Shafi'is, in the view opposite to the sounder, say that if an endowed thing loses its benefit through a cause that is not chargeable, such as a tree drying or being uprooted by wind or flood before it can be replanted, the endowment ends and the thing returns to the founder or his heir. The sounder Shafi'i view is that it does not return to ownership but remains an endowment; the Hanbalis agree. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675}\n\nThe administration of an endowment. The jurists agree that the administration of an endowment follows the founder's condition. If he assigns it to a named person, his condition is followed, as 'Umar ibn al-Khattab did when he left his endowment to his daughter Hafsa to manage for her life, and then to the people of sound judgement of her kin, as al-Bayhaqi reports. Ibn Qudama says that the disposal of an endowment follows the founder's condition, and so does its administrator. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675} The jurists differ on whether the founder may assign administration to himself. The Hanafis, Shafi'is and Hanbalis allow it. The Malikis say that if the beneficiary has not taken possession of the endowment, the endowment is void by the founder's death, illness, or bankruptcy; if the beneficiary has taken possession and the founder stipulated administration for himself, the endowment stands, but the founder is compelled to assign administration to another, since he may not assign it to himself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675}\n\nIf the founder names no administrator, the Malikis and Hanbalis hold that where the endowment is for unnamed persons, such as the poor, the mosques, the ruler appoints whom he chooses, since he cannot himself administer it. Where the endowment is for a named beneficiary of sound mind, that beneficiary administers it, since it is his ownership and his benefit, so that his supervision is like absolute ownership. If he is not of sound judgement, his guardian administers it. There is a possibility in the Hanbali school, which Ibn Abi Musa chose, that the ruler administers it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17675}\n\nOn the administration of an endowment where the founder did not stipulate it, the Hanafi views differ. Abu Yusuf holds that the endowment belongs to God and the administration goes first to the founder, then to his executor, then to the judge. Hilal, the apparent view of the school, holds that the administration belongs to the founder, then to his executor or the judge, because an administrator derives his authority from the founder's stipulation, so it is impossible that he should have authority while another derives it from him; and the founder is the person nearest to the endowment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} Muhammad holds that the founder has no administration unless he stipulated it, because for him handing the endowment over to a custodian is a condition of its validity, so that once it is handed over the founder has no authority over it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} If the founder dies without naming an administrator, the judge appoints a custodian from among the founder's family while a suitable person can be found there, either because such a person is the most solicitous or because the founder meant the endowment to be attributed to them; only if none is found does he appoint an outsider. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} The Shafi'is hold, on the school's view, that if the founder names no administrator, administration belongs to the judge, who has general authority over such matters. A second view gives it to the founder, who had it, and a third gives it to the beneficiary, since the income is his. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677}\n\nThe qualifications of an administrator. The jurists set several conditions for an administrator's fitness; some are agreed and some are disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676}\n\nThe first condition is legal capacity. The jurists agree that an administrator must be adult and sane, since a minor or a mentally ill person lacks the capacity; this holds in general. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} The Malikis and Hanbalis add that if the founder names no administrator and the beneficiary is a named person, such as Zayd or 'Amr, the beneficiary administers it himself; if he is a minor or insane, his guardian stands in for him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} The Hanbalis say that the ownership of an endowed thing passes to the beneficiary if he is a named human or a limited group, and he administers it if he is adult and sound of judgement, or his guardian does if he is a minor, insane or a spendthrift; Ibn Abi Musa says the judge administers it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677}\n\nThe Hanafis: Ibn 'Abidin quotes al-Is'af that appointing a minor as administrator is void by analogy in every case, and by juristic preference void while he is a minor, so that the administration passes to him when he grows up; al-Shilbi holds that the assignment to a minor is never valid, since administration is a form of guardianship and a minor under guardianship cannot be given guardianship over others. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} Ibn 'Abidin cites the fatwas of Rashid al-Din that a judge who assigns administration to a minor who is able to keep the property does so validly, since it grants him authority to act; the two views can be reconciled by reading al-Is'af as concerning a minor unable to act. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} Insanity prevents appointment and also ends it once it occurs; Ibn 'Abidin quotes al-Fath that an administrator is removed by permanent insanity lasting at least a year, and that if he recovers, administration returns to him, though al-Nahr says this holds for one named by the founder and not for one appointed by the judge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17677} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} The Shafi'is state that administration is stripped by insanity, and al-Shabramallisi says that when a sane person returns to a founder-named administrator, the office returns by recovery alone without a new appointment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678}\n\nThe second condition is justice (adala). The Hanafis differ whether it is a condition of validity or of preference. Al-Is'af says that no one is appointed except a trustworthy and capable person, whether acting himself or through a deputy, because removing a dishonest person from office is not part of administration. Ibn 'Abidin holds that justice is a condition of preference, not of validity, and that an administrator who turns to wrongdoing deserves removal but is not removed automatically, as a judge who turns to wrongdoing is not removed on the sound and fatwa view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679}\n\nThe Malikis treat justice as a condition when the administrator was appointed by the judge or by the founder. Al-Hattab says that administration of a detained endowment belongs to the one the founder chose, who must be one trusted in religion and honesty; if the founder is negligent, administration falls to the judge, who sets up someone he approves. If the administrator is badly managing and not to be trusted, the judge removes him, unless the beneficiary owns his own affairs and accepts him. Al-Qarafi says that a judge removes an administrator only for a fault, but the founder may remove him even without one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678}\n\nThe Shafi'is require apparent and inner justice in an administrator the judge appoints. Al-Subki says that for one appointed by the founder, apparent justice should suffice; al-Adhra'i requires both apparent and inner justice in that case too, and al-Sharbini prefers the first view. If the administrator becomes a wrongdoer he is removed, and then the administration passes to the judge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17678} Al-Shafi'iyya say that if an administrator becomes a wrongdoer and then just again, his authority returns if it was made a condition in the endowment's terms and named exactly; otherwise it does not. Al-Nawawi gave this fatwa, and Ibn al-Rif'a and others agreed; al-Zarkashi says it is apparent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679}\n\nThe Hanbalis hold that if administration belongs to someone other than the beneficiary, and the appointment was by the judge or by an original administrator, justice is required, because it is authority over property, like guardianship over an orphan's property. If he is not just, his hand is removed from the endowment to preserve it, and if he returns to fitness his right returns. If the administrator was set by the founder, justice is not required, and a trustworthy person is added to the wrongdoer; his authority is removed only where its removal is needed to keep the endowment, since preserving the endowment matters more than leaving a wrongdoer in authority over it. Where administration belongs to the beneficiary himself, whether just or not, he has the better claim to it, since he owns the endowment and so administers for himself; some say a trustworthy person is added to him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680}\n\nThe third condition is capability (kifaya), meaning the strength and ability of the person to act in what he administers. The Shafi'is and Hanbalis require it, since preserving an endowment is a religious duty and someone without capability cannot preserve it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} If capability is lost, the Shafi'is say the judge removes administration from him even if it was assigned to him by the founder. Al-Nawawi says that when the defect ends, his administration returns if it was stipulated in the endowment and named exactly. The Hanbalis say that if capability is lost he is not removed, but a strong and trustworthy administrator is added to him, to achieve the purpose. The Hanafis say that the administrator must be removed where he is not trustworthy or is incapable (the OCR text reads 'the founder' here, probably a slip for the administrator, flagged as a doubt). The Malikis' words also imply that capability is required. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680}\n\nThe fourth condition is Islam. The Hanbalis hold that an administrator must be Muslim if the beneficiary is Muslim or the object is a mosque or the like, relying on Surat al-Nisa, verse 141, which they cite for this condition. If the endowment is for a named unbeliever, an unbeliever may be made administrator. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680} The Hanafis allow a dhimmi to be administrator and do not require Islam; if the judge removes a dhimmi for some reason and he then converts, administration does not return to him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17680} Al-Ramli holds that analogy with the will and marriage makes valid a dhimmi's administration of an endowment for a dhimmi beneficiary, provided he is upright in his religion, but this is rejected because the endowment requires real justice; al-Shabramallisi says the rejection is the sound view. He distinguishes a dhimmi's marriage of his ward, where the guardian has a natural restraint from wishing to protect his ward from shame, which does not apply to an endowment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17681}\n\nThe administrator's wage. The subject covers his right to a wage, whether it is set by the founder or the judge, its amount, and whether he is due one where neither has named it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17681} On the right to a wage: the jurists hold that an administrator is due a wage for his work in running the endowment and caring for its affairs. The evidence they cite includes 'Umar's words when he endowed his land at Khaybar, that whoever administers it may eat in reasonable measure or feed a friend without making profit from it; 'Ali's making the upkeep of the slaves he endowed to work the land a charge on the income; the analogy with the collector of zakat; and the saying attributed to the Prophet that what remains after his wives' maintenance and his worker's wage is charity. Ibn Hajar says that the worker there means the custodian of the land, so the saying shows that his wage is lawful. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682}\n\nOn the setting of the wage. If the founder set it, the administrator takes what the founder fixed even if it exceeds the usual wage; this is the view of the Hanafis, Shafi'is and Hanbalis. The Hanafis say that if the founder fixed less than the usual wage, the judge completes it on request. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} The Shafi'is say that if the founder made himself administrator and fixed a wage for himself, it may not exceed the usual wage; if he fixed more, the endowment is void, since it would be an endowment upon himself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} The Hanbalis say that if the founder fixed a stated wage, and it equals the usual wage, the administrator takes it; if it is more, the costs of what the endowment needs, such as the trustees and others, are paid from the excess until only the usual wage remains, unless the founder gave it to him outright. The Malikis fixed no amount and left it to the founder or the judge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682}\n\nIf the founder set no wage, the judge fixes it. The Hanafis and Hanbalis hold that the judge's wage must not exceed the usual wage, and if he sets more, the excess is withheld. The Malikis leave the matter to the judge's discretion; Ibn Fattuh says the judge may give the appointed administrator a fixed monthly stipend according to his work, as the imams did. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17682} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} The Shafi'is say that if the founder names no wage, the administrator has no wage on the sound view and may not take anything from the endowment; if he does take it, he is liable and is discharged only by handing it to the judge. If the administrator asks the judge to fix a wage for him, he is like a guardian of an orphan's property who asks the judge to set his fee. Al-Iraqi, who reports al-Balqini's view, says that the administrator then takes the wage where there is need, either the amount of his maintenance, as al-Rafi'i preferred, or the lesser of his maintenance and the usual wage, as al-Nawawi preferred; another view is that he is due the usual wage even if it exceeds his maintenance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683}\n\nIf the founder set no wage. Al-Ramli of the Hanafis says that the administrator is due nothing unless the judge fixes a wage for his work. Ibn 'Abidin concludes that where the founder names a sum for the administrator, he has it, whether large or small, whether or not he works, provided it is not set in return for work; where the founder names none and the judge fixes the usual wage, that is valid; if he fixes more, the excess is withheld; and if the administrator does no work he is due no wage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} If the judge appoints an administrator and names no wage, then, where the custom is that the work is not done without the usual wage, he is due the usual wage, since custom is like a stipulation; otherwise nothing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683} Ibn Najim, citing al-Qunya, reports two Hanafi views on a judge's appointee who is given no wage: the first is that he has nothing even if he works a year; the second is that the custodian is due a wage like the effort he gives, whether or not the judge or the residents of the quarter set a wage for him, since no one accepts custody publicly without a wage, and custom is like a stipulation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17683}"
