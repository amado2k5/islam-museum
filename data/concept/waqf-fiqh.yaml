  en: "Waqf (endowment, fiqh)"
summary:
  ar: "الوقف في اللغة الحبس، ومنه وقفت الدار حبستها في سبيل الله، ومنه المنع والسكون، ويُطلق على الشيء الموقوف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579} وفي الاصطلاح تعريفات متعددة: عند الحنفية حبس العين على حكم ملك الله تعالى وصرف منفعتها على من أحب عند الصاحبين، وعند أبي حنيفة حبس العين على حكم ملك الواقف والتصدق بالمنفعة؛ وعند المالكية إعطاء منفعة شيء مدة وجوده لازماً بقاؤه في ملك معطيه ولو تقديراً؛ وعند الشافعية حبس مال يمكن الانتفاع به مع بقاء عينه بقطع التصرف في رقبته على مصرف مباح موجود؛ وعند الحنابلة تحبيس مالك مطلق التصرف ماله المنتفع به مع بقاء عينه يُصرف ريعه إلى جهة بر تقرباً إلى الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579}\n\nالألفاظ ذات الصلة: التبرع (التطوع بالشيء دون عوض، وهو أعم من الوقف)، والصدقة (تمليك في الحياة بغير عوض، وقد تُطلق على الوقف كما في حديث عمر في أرضه)، والهبة (العطية بلا عوض)، والعارية (إباحة الانتفاع بالعين مع بقاء ملكها للمعير)، والوصية. والفرق بين الوقف والهبة أن الوقف تمليك المنفعة مع بقاء العين على ملك الله فلا يجوز التصرف فيها، والهبة تمليك للعين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581}"
  en: "Waqf, lexically, is detention: to hold back a thing in God's way; it also means prevention and stillness, and the word names the thing held. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579} Technically the jurists define it in several ways: for the Hanafi companions, the detention of a thing in God's ownership with its use given to whom the founder wishes; for Abu Hanifa, its detention in the founder's ownership with the use given as charity; for the Malikis, the grant of the use of a thing for as long as it exists, the ownership remaining with the grantor even notionally; for the Shafi'is, the detention of property whose use can be had with its substance kept, the disposal of its ownership cut off, for a lawful and existing purpose; for the Hanbalis, the detention by an owner of his property whose use is kept in its substance, with its income given to a charitable purpose seeking God's favour. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579}\n\nRelated words: tabarru' (giving without return, wider than waqf), sadaqa (gift in life without return, which may also name waqf, as in 'Umar's land), hiba (gift without return), 'ariya (the permission to use a thing while its owner keeps it), and wasiyya. The difference from a gift is that waqf transfers the use while the substance stays in God's ownership and cannot be disposed of, whereas a gift transfers the thing itself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17579}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17581}"
