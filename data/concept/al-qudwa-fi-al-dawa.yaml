id: concept/al-qudwa-fi-al-dawa
class: concept
kind: ethical
label:
  ar: "القدوة في الدعوة"
  en: "Exemplary conduct in preaching"
  ur: "دعوت میں نمونہ عمل"
summary:
  ar: "يرى الشعراوي أن الدعوة لا تكفي بالكلام، بل تحتاج إلى القدوة، وأن علماء الدين وحدهم يُطلب منهم أن يكونوا قدوة، وأن الإسلام انتشر بالسلوك قبل المنهج العلمي {cite:tafsir-sharawi-khawatir-scan p.303} {cite:tafsir-sharawi-khawatir-scan p.304} {cite:tafsir-sharawi-khawatir-scan p.305}."
  en: "Sha'rawi holds that preaching is not enough by words but needs example, that religious scholars alone are required to be exemplary, and that Islam spread by conduct before it spread by method and teaching {cite:tafsir-sharawi-khawatir-scan p.303} {cite:tafsir-sharawi-khawatir-scan p.304} {cite:tafsir-sharawi-khawatir-scan p.305}."
  ur: "شعراوی کے نزدیک دعوت صرف زبانی بات سے کافی نہیں بلکہ نمونہ عمل چاہتی ہے، اور صرف دین کے علماء سے نمونے کا تقاضا کیا جاتا ہے، اور اسلام علمی طریقے سے پہلے کردار کے ذریعے پھیلا {cite:tafsir-sharawi-khawatir-scan p.303} {cite:tafsir-sharawi-khawatir-scan p.304} {cite:tafsir-sharawi-khawatir-scan p.305}۔"
wings: [ideas]
themes: [ethics-and-character]
periods: [period/prophetic-era]
regions: [global]
issue:
  ar: "هل يُطلب من عالم الدين ما لا يُطلب من عالم سواه؟"
  en: "Is a religious scholar held to a standard that other scholars are not?"
perspectives:
  - tradition: sunni
    id: sunni-sharawi
    stance:
      ar: "عالم الدين قدوة لأن الناس ينظرون إليه، والإسلام انتشر بالسلوك"
      en: "The religious scholar must be an example because people watch him, and Islam spread through conduct"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن الناس تراقب سلوك عالم الدين، وأن الإسلام انتشر بالسلوك قبل العلم، ويضرب مثال الذين نشروا الإسلام في الصين من التجار المتخلقين، ويستشهد بالآية التي تجمع الدعوة إلى الله والعمل الصالح {cite:tafsir-sharawi-khawatir-scan p.304} {cite:tafsir-sharawi-khawatir-scan p.305}."
      en: "Sha'rawi holds that people watch the conduct of a religious scholar, and that Islam spread through conduct before knowledge. He gives the example of merchants of good character who spread Islam in China, and cites the verse that joins the call to God with righteous action {cite:tafsir-sharawi-khawatir-scan p.304} {cite:tafsir-sharawi-khawatir-scan p.305}."
    sources: [source/tafsir-sharawi-khawatir-scan]
  - tradition: academic
    id: academic
    stance:
      ar: "دراسات انتشار الإسلام التجاري والسلوكي لم تُضف بعد"
      en: "Studies of the spread of Islam through trade and conduct are not yet added"
    summary:
      ar: "مثال الصين الذي يذكره الشعراوي لم يُراجع بمصادر تاريخية، ولم تُعرض دراسة للانتشار، وتحتاج إلى مراجع محددة."
      en: "The example of China that Sha'rawi gives has not been checked against historical sources, and no study of the spread is set out here; it needs named sources."
    sources: []
  - tradition: other
    id: other
    stance:
      ar: "تقاليد أخرى في دور العالم لم تُضف بعد"
      en: "Other traditions on the role of the scholar are not yet added"
    summary:
      ar: "لم تُعرض هنا تقاليد أخرى في مسؤولية العالم، ولم تُراجع."
      en: "Other traditions on the scholar's responsibility are not set out here and are not checked."
    sources: []
