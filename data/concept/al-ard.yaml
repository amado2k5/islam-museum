id: concept/al-ard
class: concept
kind: belief
label:
  ar: "العرض والوقوف بين يدي الله"
  en: "The display and standing before God"
  ur: "عرض اور اللہ کے سامنے کھڑا ہونا"
summary:
  ar: "يوم العرض يُعرض الخلائق على ربهم صفًّا لا تخفى منهم خافية، ويقف العباد لله رب العالمين «وقفوهم إنهم مسؤولون»، حتى يلجمهم العرق {cite:tafsir-ibn-kathir} {cite:sahih-muslim}."
  en: "On the day of display creation is presented to their Lord in ranks, nothing hidden; the servants stand before the Lord of the worlds — 'stop them; they are to be questioned' — until the sweat bridles them {cite:tafsir-ibn-kathir} {cite:sahih-muslim}."
  ur: "عرض کے دن مخلوق اپنے رب کے سامنے قطار در قطار پیش ہو گی، کچھ چھپا نہ ہو گا؛ بندے رب العالمین کے سامنے کھڑے ہوں گے — «انھیں روکو، ان سے سوال ہونا ہے» — یہاں تک کہ پسینہ انھیں لگام دے گا {cite:tafsir-ibn-kathir} {cite:sahih-muslim}۔"
