label:
  ar: "شنجار"
  en: "Shinjar"
  ur: "شنجار"
summary:
  ar: "الشنجار في الكتاب هو خس الحمار، أنواعه كثيرة، بارد في الأولى يابس في الثانية، ورقه أضعف ما فيه، قابض مجفف، المسمى منه أنوقليا فيه مرارة وفلوسي أشد قبضا وأنولوس أشد منهما، ويطلى لنفع البهق واليرقان، ويضمد به على الجمرة، ويدمل القروح، وهو أنفع شيء لأوجاع الأذن، وينفع من اليرقان وأوجاع الطحال شربا، ويخرج الديدان وحب القرع، وينفع من نهشة الأفعى ضمادا أو مشروبا {cite:canon-ibn-sina-print-v1 p.674}"
  en: "Shinjar is in the book the donkey's lettuce, of many kinds, cold in the first degree and dry in the second, its leaf the weakest part of it, astringent and drying; the kind called anuqiliya has a bitterness, the kind called filusi is more astringent and the kind called anulus more so than both; it is smeared for bahaq and jaundice, laid as a poultice on carbuncle, heals ulcers, is the most beneficial thing for earache, benefits jaundice and pains of the spleen when drunk, expels worms and the tapeworm, and benefits the bite of the viper as a poultice or a drink {cite:canon-ibn-sina-print-v1 p.674}"
  ur: "شنجار کتاب میں گدھے کا کاہو ہے، اس کی بہت سی قسمیں ہیں، پہلے درجے میں ٹھنڈا اور دوسرے میں خشک، اس کا پتا اس کا سب سے کمزور جزو ہے، قابض اور خشک کرنے والا؛ انوقلیا نامی قسم میں کڑواہٹ ہے، فلوسی زیادہ قابض ہے اور انولوس ان دونوں سے زیادہ؛ بہق اور یرقان کے لیے لگایا جاتا ہے، جمرہ پر لیپ کیا جاتا ہے، قرحوں کو بھر دیتا ہے، کان کے دردوں کے لیے سب سے زیادہ نافع ہے، پینے سے یرقان اور تلی کے دردوں میں نافع ہے، کیڑوں اور کدو دانے کو نکالتا ہے، اور افعی کے کاٹے میں لیپ یا پینے کی صورت میں نافع ہے {cite:canon-ibn-sina-print-v1 p.674}۔"
