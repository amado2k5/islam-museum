label: { ar: "الحمو", en: "Hamw (husband's relatives; in-law rules)", ur: "حمو" }
summary:
  ar: "الحمو لغة أبو الزوج أو أخوه أو قريب الزوج من قبله، والحماة أم الزوج، ويكون الحمو من الجانبين كالصهر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7329} والحمو المحرم كأبي الزوج وإن علا وابن الزوج وإن نزل يجوز له النظر والخلوة بالمرأة، لقوله تعالى في سورة النور في الزينة، ولحديث النهي عن المبيت عند المرأة الثيب إلا لناكح أو ذي محرم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7329} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7330} أما الحمو غير المحرم كأخي الزوج فحكمه حكم الأجنبي في النظر والخلوة والسكن والصوت، ومن حرم عليه النظر حرم عليه المس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7330} وفي حديث «الحمو الموت» قيل إنه محمول على من ليس بمحرم، وخرج مخرج التغليظ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7330} ويحيل المدخل إلى «أجنبي» و«محرم» و«حمالة» و«كفالة» في الألفاظ الأخرى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7330} "
  en: "Hamw lexically is the father of a husband or his brother, or any relative of the husband's side; hama is the husband's mother, and the term runs both ways like in-law. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7329} A mahram in-law, such as the husband's father or son, may look at the woman and be alone with her, on the Quranic permission and the ban on a man spending the night with a married woman unless he is a husband or a mahram. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7329} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7330} A non-mahram in-law, such as the husband's brother, has the status of a stranger in looking, being alone, residing and hearing the voice; if looking is forbidden, touching is forbidden too. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7330} The saying 'the in-law is death' is read as applying to non-mahram in-laws and as a strong warning. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7330} The entry refers to the headwords stranger, mahram, hamala and kafala. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7330} "
  ur: "حمو لغت میں شوہر کے والد یا بھائی یا شوہر کی طرف کا کوئی قریبی رشتہ دار ہے؛ حماۃ شوہر کی والدہ کو کہتے ہیں، اور یہ لفظ دونوں طرف سے بولا جاتا ہے جیسے سسرالی رشتہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7329} محرم حمو، جیسے شوہر کا والد یا بیٹا، عورت کو دیکھ سکتا ہے اور اس کے ساتھ خلوت کر سکتا ہے، اور اس کی دلیل قرآن کی آیتِ زینت اور رات کو ثیبہ عورت کے پاس اکیلے رہنے کی ممانعت کی حدیث ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7329} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7330} غیر محرم حمو، جیسے شوہر کا بھائی، اجنبی کی طرح ہے نظر، خلوت، رہائش اور آواز کے معاملے میں؛ جس کا دیکھنا حرام ہو اس کا چھونا بھی حرام ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7330} «الحمو الموت» والی حدیث کو غیر محرم حموؤں پر محمول کیا گیا ہے اور یہ سختی کے طور پر فرمایا گیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7330} یہ مدخل «اجنبی»، «محرم»، «حمالہ» اور «کفالہ» کی طرف حوالہ دیتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7330} "
