id: concept/hamil
class: concept
kind: legal
label: { ar: "الحامل", en: "Pregnant woman (hamil) in fiqh", ur: "حاملہ", es: "Mujer embarazada (hamil) en fiqh", fr: "Femme enceinte (hamil) en fiqh", tr: "hamile kadın", id: "wanita hamil" }
summary:
  ar: "الحامل في الفقه هي المرأة الحبلى، ويتناول بابها أحكام دمها وصومها ونكاحها وطلاقها وعدتها ونفقتها، وإقامة الحدود عليها، والاعتداء عليها وجنينها، وأحكام الحامل من الحيوان في التذكية والزكاة والبيع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6730} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6732} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6733} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6736} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6738}"
  en: "A pregnant woman (hamil) in fiqh is a woman carrying a child. The entry covers her blood, fasting, marriage, divorce, waiting period, maintenance, the carrying-out of penalties, injury to her or her foetus, the burial of a pregnant woman, and rules for pregnant animals in slaughter, zakat and sale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6730} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6732} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6733} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6736} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6738}"
  ur: "فقہ میں حاملہ وہ عورت ہے جس کے پیٹ میں بچہ ہو۔ اس باب میں اس کے خون، روزے، نکاح، طلاق، عدت، نفقے، حدود کے نفاذ، جنین کے نقصان، اور حاملہ جانور کی ذبح، زکوۃ اور بیع کے احکام شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6736}"
  es: "En fiqh, una mujer embarazada (hamil) es aquella que lleva un hijo en su vientre. La entrada abarca su sangre, el ayuno, el matrimonio, el divorcio, el período de espera, la manutención, la aplicación de las penas, las lesiones que pueda sufrir ella o su feto, el entierro de una mujer embarazada y las normas relativas a los animales preñados en el sacrificio, el zakat y la venta. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6729} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6730} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6731} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6732} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6733} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6734} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6736} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6738}"
  fr: "En droit islamique (fiqh), une femme enceinte (hamil) est une femme portant un enfant. Cette définition couvre les règles relatives à son sang, au jeûne, au mariage, au divorce, au délai de carence, à la pension alimentaire, à l'exécution des peines, aux blessures infligées à elle-même ou à son fœtus, à l'inhumation d'une femme enceinte, ainsi qu'aux règles concernant l'abattage, la zakat et la vente des animaux gestants. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6730} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6732} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6733} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6736} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6738}"
  tr: "Fıkıhta, hamile bir kadın hamile sayılır ve bölümü kan, oruç, evlilik, boşanma, bekleme süresi ve nafaka hükümlerini, yasal cezaların uygulanmasını, kendisine ve fetüsüne yapılan saldırıyı ve hamile hayvanın kesim, zekat ve satışla ilgili kararlarını kapsar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6730} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6732} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6733} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6736} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6738}"
  id: "Dalam hukum, wanita hamil dianggap hamil, dan babnya mencakup putusan darahnya, puasa, pernikahan, perceraian, masa tunggu, dan pemeliharaan, pelaksanaan hukuman hukum terhadapnya, penyerangan terhadap dia dan janinnya, serta putusan mengenai hewan hamil dalam penyembelihan, zakat, dan penjualan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6730} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6733} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6733} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6733} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6736} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6738}"
