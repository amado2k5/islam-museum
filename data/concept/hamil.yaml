label: { ar: "الحامل", en: "Pregnant woman (hamil) in fiqh", ur: "حاملہ" }
summary:
  ar: "الحامل في الفقه هي المرأة الحبلى، ويتناول بابها أحكام دمها وصومها ونكاحها وطلاقها وعدتها ونفقتها، وإقامة الحدود عليها، والاعتداء عليها وجنينها، وأحكام الحامل من الحيوان في التذكية والزكاة والبيع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6730} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6732} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6733} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6736} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6738}"
  en: "A pregnant woman (hamil) in fiqh is a woman carrying a child. The entry covers her blood, fasting, marriage, divorce, waiting period, maintenance, the carrying-out of penalties, injury to her or her foetus, the burial of a pregnant woman, and rules for pregnant animals in slaughter, zakat and sale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6730} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6732} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6733} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6736} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6738}"
  ur: "فقہ میں حاملہ وہ عورت ہے جس کے پیٹ میں بچہ ہو۔ اس باب میں اس کے خون، روزے، نکاح، طلاق، عدت، نفقے، حدود کے نفاذ، جنین کے نقصان، اور حاملہ جانور کی ذبح، زکوۃ اور بیع کے احکام شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6736}"
