label:
  ar: "السَّيْف"
  en: "Sayf (the sword) and its rulings"
summary:
  ar: "السيف نوع معروف من الأسلحة، وجمعه أسياف وسيوف وأسيف، ويطلق مجازا على حدة اللسان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9883} وللفقهاء في السيف أحكام: تطهيره إذا أصابته نجاسة، واعتماد خطيب الجمعة عليه، وتقلده للمحرم، وتحليته بالفضة والذهب، واستيفاء القصاص به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9884} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9885} وذهب الحنفية إلى أن القصاص لا يستوفى إلا بالسيف، وذهب المالكية والشافعية ورواية عند الحنابلة إلى أن لأهل القتل أن يفعلوا بالجاني كما فعل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9885} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9886}"
  en: "The sayf is a known kind of weapon, plural asyaf, suyuf or asif; it is used figuratively for a sharp tongue. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9883} The rulings on the sword concern cleaning it of impurity, a preacher leaning on it at the Friday sermon, carrying it in pilgrimage garb, decorating it with silver or gold, and carrying out retaliation with it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9884} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9885} The Hanafis hold that retaliation may be carried out only by the sword, while the Malikis, Shafi'is and a Hanbali report hold that the victim's kin may do to the offender as he did. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9885} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9886}"
