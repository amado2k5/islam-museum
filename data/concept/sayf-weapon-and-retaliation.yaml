id: concept/sayf-weapon-and-retaliation
class: concept
kind: legal
label:
  ar: "السَّيْف"
  en: "Sayf (the sword) and its rulings"
  es: "Sayf (la espada) y sus reglas"
  fr: "Sayf (l'épée) et ses règles"
  ur: "سیف ⁦(تلوار)⁩ اور اس کے احکام"
summary:
  ar: "السيف نوع معروف من الأسلحة، وجمعه أسياف وسيوف وأسيف، ويطلق مجازا على حدة اللسان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9883} وللفقهاء في السيف أحكام: تطهيره إذا أصابته نجاسة، واعتماد خطيب الجمعة عليه، وتقلده للمحرم، وتحليته بالفضة والذهب، واستيفاء القصاص به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9884} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9885} وذهب الحنفية إلى أن القصاص لا يستوفى إلا بالسيف، وذهب المالكية والشافعية ورواية عند الحنابلة إلى أن لأهل القتل أن يفعلوا بالجاني كما فعل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9885} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9886}"
  en: "The sayf is a known kind of weapon, plural asyaf, suyuf or asif; it is used figuratively for a sharp tongue. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9883} The rulings on the sword concern cleaning it of impurity, a preacher leaning on it at the Friday sermon, carrying it in pilgrimage garb, decorating it with silver or gold, and carrying out retaliation with it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9884} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9885} The Hanafis hold that retaliation may be carried out only by the sword, while the Malikis, Shafi'is and a Hanbali report hold that the victim's kin may do to the offender as he did. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9885} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9886}"
  es: "El sayf es un tipo conocido de arma, plural asyaf, suyuf o asif; se usa figurativamente para una lengua afilada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9883} Las normas sobre la espada se refieren a limpiarla de impurezas, que un predicador se apoye en ella durante el sermón del viernes, llevarla en la vestimenta de peregrinación, decorarla con plata u oro y llevar a cabo represalias con ella. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9884} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9885} Los hanafíes sostienen que la represalia solo puede llevarse a cabo con la espada, mientras que los malikíes, los shafiíes y un informe hanbalí sostienen que los parientes de la víctima pueden hacer al ofensor lo mismo que él hizo. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9885} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9886}"
  fr: "Le sayf est une arme connue, au pluriel asyaf, suyuf ou asif; il est employé au sens figuré pour désigner une langue acérée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9883} Les règles concernant l'épée portent sur sa purification, le fait qu'un prédicateur s'appuie dessus lors du sermon du vendredi, qu'il la porte en tenue de pèlerinage, qu'il l'orne d'argent ou d'or, et qu'il s'agisse de représailles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9884} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9885} Les hanafites considèrent que les représailles ne peuvent être exercées que par l'épée, tandis que les malikites, les chaféites et un hadith hanbalite estiment que les proches de la victime peuvent infliger au coupable le même sort que celui-ci. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9885} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9886}"
  ur: "سیف ایک معروف قسم کا ہتھیار ہے، جمع اسیف، سیوف یا آصف؛ یہ علامتی طور پر تیز زبان کے لیے استعمال ہوتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص 9883} تلوار کے احکام اس کو نجاست سے صاف کرنے کے ہیں، خطبہ جمعہ کے وقت اس پر ٹیک لگانا، اسے حج کے لباس میں اٹھانا، چاندی یا سونے سے سجانا، اور اس سے انتقام لینا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص9884} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص9885} احناف کا خیال ہے کہ انتقام صرف تلوار سے لیا جا سکتا ہے، جب کہ مالکیہ، شافعیہ اور حنبلی کے نزدیک وہ متقعین کے قائل ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9885}"
