label: { ar: "الحركة والسكون عند ابن سينا", en: "Motion and rest in the Canon", ur: "قانون میں حرکت اور سکون" }
summary:
  ar: "في الفصل الثاني عشر، في موجبات الحركة والسكون، يبين ابن سينا أن فعل الحركة في بدن الإنسان يختلف بالشدة والضعف والقلة والكثرة وبما يخالطها من السكون، وأن الحكماء يعدون ذلك قسماً برأسه {cite:canon-ibn-sina-print-v1 p.130}."
  en: "In the twelfth chapter, on the causes that lie in motion and rest, Ibn Sina shows that the action of motion in the human body differs by intensity and weakness, by little and much, and by the rest mixed with it, and that the philosophers count this a division by itself {cite:canon-ibn-sina-print-v1 p.130}."
