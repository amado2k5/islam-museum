label:
  ar: "أمنوكال"
  en: "Amenokal (Tuareg paramount chief)"
summary:
  ar: "أمنوكال، صيغة معاصرة لكلمة بربرية «أمانوكال» بمعنى الزعيم السياسي الذي لا يخضع لغيره، ويطلق على الحكام الأجانب والكبار من الأوروبيين وعلى ذكور بعض الأسر النبيلة، وعند طوارق الهقار هو زعيم اتحاد القبائل النبيلة والتابعة، يختاره نبلاء الهقار {cite:encyclopaedia-of-islam-2 vol. 1 p. 455}."
  en: "Amenokal, the current spelling of the Berber amanukal, 'any political leader not subordinate to anyone else'. It is applied to foreign rulers, to high-ranking European leaders and to the male members of certain noble families. Among the Tuareg of the Ahaggar it is the overlord of a confederation of noble and subject tribes, chosen from the nobles of the Ahaggar {cite:encyclopaedia-of-islam-2 vol. 1 p. 455}."
