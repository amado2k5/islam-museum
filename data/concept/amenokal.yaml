id: concept/amenokal
class: concept
kind: term
label:
  ar: "أمنوكال"
  en: "Amenokal (Tuareg paramount chief)"
  fr: "Amenokal (chef suprême touareg)"
  es: "Amenokal (jefe supremo tuareg)"
  ur: "امینوکل ⁦(Tuareg پیراماؤنٹ چیف)⁩"
summary:
  ar: "أمنوكال، صيغة معاصرة لكلمة بربرية «أمانوكال» بمعنى الزعيم السياسي الذي لا يخضع لغيره، ويطلق على الحكام الأجانب والكبار من الأوروبيين وعلى ذكور بعض الأسر النبيلة، وعند طوارق الهقار هو زعيم اتحاد القبائل النبيلة والتابعة، يختاره نبلاء الهقار {cite:encyclopaedia-of-islam-2 vol. 1 p. 455}."
  en: "Amenokal, the current spelling of the Berber amanukal, 'any political leader not subordinate to anyone else'. It is applied to foreign rulers, to high-ranking European leaders and to the male members of certain noble families. Among the Tuareg of the Ahaggar it is the overlord of a confederation of noble and subject tribes, chosen from the nobles of the Ahaggar {cite:encyclopaedia-of-islam-2 vol. 1 p. 455}."
  fr: "Amenokal est la graphie actuelle du berbère amanukal, « tout chef politique qui n’est subordonné à personne ». Le titre s’applique à des souverains étrangers, à de hauts dirigeants européens et aux hommes de certaines familles nobles. Chez les Touaregs de l’Ahaggar, c’est le chef suprême d’une confédération de tribus nobles et sujettes, choisi parmi les nobles de l’Ahaggar {cite:encyclopaedia-of-islam-2 vol. 1 p. 455}."
  es: "Amenokal, la grafía actual del bereber amanukal, significa «cualquier líder político que no esté subordinado a nadie». Se aplica a gobernantes extranjeros, a altos dirigentes europeos y a los miembros varones de ciertas familias nobles. Entre los tuareg de Ahaggar, se refiere al señor supremo de una confederación de tribus nobles y sometidas, elegido entre la nobleza de Ahaggar {cite:encyclopaedia-of-islam-2 vol. 1 p. 455}."
  ur: "Amenokal، بربر امانوکل کی موجودہ ہجے، 'کوئی بھی سیاسی رہنما کسی اور کا ماتحت نہیں'۔ اس کا اطلاق غیر ملکی حکمرانوں، اعلیٰ درجے کے یورپی لیڈروں اور بعض شریف خاندانوں کے مرد ارکان پر ہوتا ہے۔ Ahaggar کے Tuareg کے درمیان یہ معزز اور رعایا قبائل کی ایک کنفیڈریشن کا مالک ہے، جسے احگر کے رئیسوں سے منتخب کیا گیا ہے {حوالہ: انسائیکلوپیڈیا آف اسلام-2 جلد 1 ص۔ 455}"
