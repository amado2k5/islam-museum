id: "concept/al-qumur"
class: "concept"
kind: "scientific"
label:
  ar: "القمور"
  en: "The qumur (dazzlement of the eye)"
  fr: "Le qumur (éblouissement de l’œil)"
  ur: "قمور"
summary:
  ar: "القمور قد يحدث من الضوء الغالب والبياض الغالب كما يغلب إذا أديم النظر في الثلج، فلا يرى الأشياء أو يراها من قريب ولا يراها من بعيد لضعف الروح، وإذا نظر إلى الألوان تخيل أن عليها بياضاً ⁦⁦(وعلاجه بتدبير النظر في الألوان الخضر والاسمانجونية والسود وغير ذلك من التكميد والاكتحال، وأسماء الأدوية لا تحمل)⁩⁩ {cite:canon-ibn-sina-print-v2 p.216}"
  en: "Qumur may arise from dominant light and dominant whiteness, as when gazing long at snow prevails; things are not seen, or seen near but not far, from weakness of the spirit, and colours are imagined covered with whiteness ⁦(its treatment is the management of gazing at green, azure and black colours and the like, with fomentations and collyria; drug names are not carried)⁩ {cite:canon-ibn-sina-print-v2 p.216}"
  fr: "Selon le Canon, le qumur peut naître d’une lumière et d’une blancheur dominantes, comme lorsqu’on fixe longtemps la neige. On ne voit plus les objets, ou on les voit de près mais non de loin, en raison de la faiblesse de l’esprit ; les couleurs semblent couvertes de blanc (le traitement consiste à diriger le regard vers le vert, l’azur, le noir et d’autres couleurs similaires, avec fomentations et collyres ; les noms des remèdes ne sont pas reproduits) {cite:canon-ibn-sina-print-v2 p.216}"
  ur: "قمور غالب روشنی اور غالب سفیدی سے پیدا ہو سکتا ہے جیسے برف میں مدت تک دیکھنا غالب آ جائے؛ چیزیں دکھائی نہیں دیتیں یا قریب سے دکھائی دیں اور دور سے نہیں، روح کے ضعف سے، اور رنگوں پر سفیدی چھائی محسوس ہو ⁦⁦(علاج سبز، آسمانی اور سیاہ رنگوں میں دیکھنے کی تدبیر وغیرہ سے ہے، کمادات اور سرموں سمیت؛ ادویہ کے نام منقول نہیں)⁩⁩ {cite:canon-ibn-sina-print-v2 p.216}"
