summary:
  ar: "يقرر ابن سينا أن آلة أخذ البول جسم شفاف نقي الجوهر كالزجاج الصافي والبلور، وأن النظر يكون في الضوء مع الاستتار من الشعاع، وأن البول كلما قرب ازداد غلظاً وكلما بعد ازداد صفاء {cite:canon-ibn-sina-print-v1 p.184}."
  en: "Ibn Sina holds that the vessel for urine is a clear body of pure substance such as clear glass or crystal, that it is viewed in light but screened from the direct ray, and that urine looks thicker the nearer it is held and clearer the farther {cite:canon-ibn-sina-print-v1 p.184}."
