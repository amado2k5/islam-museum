label:
  ar: "نظريات الدافعية في الإدارة"
  en: "Motivation theories in management (X, Y, Z and Maslow)"
  ur: "انتظامیہ میں تحریک کے نظریات (X، Y، Z اور ماسلو)"
summary:
  ar: "نظريات الدافعية كما يروي طارق السويدان تطورها: نظرية X عند تايلور (الإنسان آلة تحركها الفلوس)، نظرية Y عند مايو (الإنسان كائن اجتماعي)، هرم ماسلو للحاجات (1943)، نظرية Z (الحاجات تختلف من إنسان لآخر)، ويقترح هو «نظرية A»: العودة إلى العقيدة أساساً للإدارة."
  en: "Motivation theories as Tareq al-Suwaidan narrates their development: Taylor's Theory X (man is a machine moved by money), Mayo's Theory Y (man is a social being), Maslow's hierarchy of needs (1943), Theory Z (needs differ from person to person) — and his own proposed 'Theory A': a return to creed as the foundation of management."
  ur: "تحریک کے نظریات جیسا کہ طارق السویدان ان کا ارتقا بیان کرتے ہیں: ٹیلر کی تھیوری X (انسان مشین ہے جو پیسے سے چلتی ہے)، مایو کی تھیوری Y (انسان سماجی وجود ہے)، ماسلو کا ھرمِ ضرورتیں (1943)، تھیوری Z (ضرورتیں فرد بہ فرد مختلف ہیں) — اور ان کی اپنی تجویز کردہ «تھیوری A»: عقیدے کی طرف بطور اساسِ انتظام واپسی۔"
