id: concept/nazariyyat-al-dafiyya
class: concept
kind: social
label:
  ar: "نظريات الدافعية في الإدارة"
  en: "Motivation theories in management (X, Y, Z and Maslow)"
  ur: "انتظامیہ میں تحریک کے نظریات ⁦(X، Y، Z اور ماسلو)⁩"
  es: "Teorías de la motivación en la gestión (X, Y, Z y Maslow)"
  fr: "Théories de la motivation en gestion (X, Y, Z et Maslow)"
  tr: "Yönetimde motivasyon teorileri"
  id: "Teori motivasi dalam manajemen"
summary:
  ar: "نظريات الدافعية كما يروي طارق السويدان تطورها: نظرية X عند تايلور ⁦(الإنسان آلة تحركها الفلوس)⁩، نظرية Y عند مايو ⁦(الإنسان كائن اجتماعي)⁩، هرم ماسلو للحاجات (1943)، نظرية Z ⁦(الحاجات تختلف من إنسان لآخر)⁩، ويقترح هو «نظرية A»: العودة إلى العقيدة أساساً للإدارة."
  en: "Motivation theories as Tareq al-Suwaidan narrates their development: Taylor's Theory X (man is a machine moved by money), Mayo's Theory Y (man is a social being), Maslow's hierarchy of needs (1943), Theory Z (needs differ from person to person) — and his own proposed 'Theory A': a return to creed as the foundation of management."
  ur: "تحریک کے نظریات جیسا کہ طارق السویدان ان کا ارتقا بیان کرتے ہیں: ٹیلر کی تھیوری X ⁦(انسان مشین ہے جو پیسے سے چلتی ہے)⁩، مایو کی تھیوری Y ⁦(انسان سماجی وجود ہے)⁩، ماسلو کا ھرمِ ضرورتیں (1943)، تھیوری Z ⁦(ضرورتیں فرد بہ فرد مختلف ہیں)⁩ — اور ان کی اپنی تجویز کردہ «تھیوری A»: عقیدے کی طرف بطور اساسِ انتظام واپسی۔"
  es: "Las teorías de la motivación, tal como las narra Tareq al-Suwaidan, incluyen: la Teoría X de Taylor (el hombre es una máquina movida por el dinero), la Teoría Y de Mayo (el hombre es un ser social), la jerarquía de necesidades de Maslow (1943), la Teoría Z (las necesidades difieren de persona a persona) y su propia propuesta, la \"Teoría A\": un retorno al credo como fundamento de la gestión."
  fr: "Les théories de la motivation telles que Tareq al-Suwaidan retrace leur développement: la théorie X de Taylor (l’homme est une machine mue par l’argent), la théorie Y de Mayo (l’homme est un être social), la hiérarchie des besoins de Maslow (1943), la théorie Z (les besoins diffèrent d’une personne à l’autre) — et sa propre « théorie A » proposée: un retour à la croyance comme fondement du management."
  tr: "Motivasyon teorileri, Tareq Al-Suwaidan tarafından anlatılır: Taylor'a göre X Teorisi (insan para tarafından yönlendirilen bir makinedir), Mayo'ya göre Y Teorisi (insan sosyal bir varlıktır), Maslow'un ihtiyaçlar piramidi (1943), Z Teorisi (ihtiyaçlar kişiden kişiye değişir) ve \"Teori A\"yı önerir: yönetim temeli olarak doktrine dönüş."
  id: "Teori motivasi seperti yang diceritakan Tareq Al-Suwaidan tentang perkembangannya: Teori X menurut Taylor (manusia adalah mesin yang digerakkan oleh uang), Teori Y menurut Mayo (manusia adalah makhluk sosial), piramida kebutuhan Maslow (1943), Teori Z (kebutuhan berbeda antar orang), dan ia mengusulkan \"Teori A\": kembali ke doktrin sebagai dasar manajemen."
