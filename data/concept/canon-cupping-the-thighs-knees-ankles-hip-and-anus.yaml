label:
  ar: "الحجامة على الفخذين والركبة والكعبين والورك والمقعدة عند ابن سينا"
  en: "Cupping on the thighs, knees, ankles, hip and anus in the Canon"
  fr: "Ventouses sur cuisses, genoux, chevilles, hanche et anus dans le Canon"
  ur: "قانون میں رانوں، گھٹنے، ٹخنوں، کولھے اور مقعد پر حجامہ"
  es: "Ventosaterapia en los muslos, rodillas, tobillos, cadera y ano en el Canon"
  tr: "İbn Sina'ya göre uyluk, diz, topuk, kalça ve ayak bileklerinde avuçlama"
  id: "Memegang pada paha, lutut, tumit, pinggul, dan pergelangan kaki menurut Ibn Sina"
summary:
  ar: "يتم ابن سينا مواضع الحجامة في الطرف السفلي، فيذكر الفخذين والركبة والكعبين والورك وما بين الركبتين والمقعدة وما تنفع منه كل واحدة {cite:canon-ibn-sina-print-v1 p.301}."
  en: "Ibn Sina completes the places of cupping in the lower limb, naming the thighs, the knee, the ankles, the hip, the space between the knees and the anus, and what each helps {cite:canon-ibn-sina-print-v1 p.301}."
  fr: "Ibn Sina achève les sites du membre inférieur : cuisses, genou, chevilles, hanche, espace entre les genoux et anus, avec leurs effets supposés {cite:canon-ibn-sina-print-v1 p.301}."
  es: "Ibn Sina completa los lugares de ventosaterapia en la extremidad inferior, nombrando los muslos, la rodilla, los tobillos, la cadera, el espacio entre las rodillas y el ano, y lo que cada uno ayuda {cite:canon-ibn-sina-print-v1 p.301}."
  ur: "ابن سینا نچلے اعضاء میں سنگی لگانے کی جگہوں کو مکمل کرتا ہے، رانوں، گھٹنے، ٹخنوں، کولہے، گھٹنوں اور مقعد کے درمیان کی جگہ اور ان میں سے ہر ایک کی مدد کرتا ہے"
  tr: "İbn Sina, alt ekstremitedeki kupa pozisyonlarını tamamlar; uyluklar, dizler, topuklar, kalçalar, dizler arası, ayak bilekleri ve anüs ile her birinin faydasını belirtir {cite:canon-ibn-sina-print-v1 s.301}."
  id: "Ibn Sina melengkapi posisi cangkamen pada anggota tubuh bawah, menyebutkan paha, lutut, tumit, pinggul, antara lutut, pergelangan kaki, dan anus serta manfaat masing-masing {cite:canon-ibn-sina-print-v1 hlm.301}."
