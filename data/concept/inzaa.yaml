label: { ar: "الإنزاء", en: "Inzaa' (the covering of female animals by males, and its rulings)" }
summary:
  ar: "الإنزاء حمل الحيوان على النزو، وهو الوثب، ولا يقال إلا للشاء والدواب والبقر في معنى السفاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3469} والإنزاء الذي لا يضر جائز، أما إنزاء الحمير على الخيل فمكروه عند بعض الفقهاء، وأجازه الحنفية، ولعلة النهي حفظ نسل الخيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3469}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3470}"
  en: "Inzaa' is causing an animal to mount another for breeding; it is said of sheep, beasts and cows in the sense of covering. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3469} Covering that does no harm is lawful; covering mares by donkeys is disliked by some jurists, and the Hanafis allow it; the reason for the prohibition is preserving the stock of horses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3469}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3470}"
