id: concept/inzaa
class: concept
kind: legal
label: { ar: "الإنزاء", en: "Inzaa' (the covering of female animals by males, and its rulings)", es: "Inzaa' (la cobertura de animales hembra por machos y sus normas)", fr: "Inzaa' (le recouvrement des animaux femelles par les mâles et ses règles)" }
summary:
  ar: "الإنزاء حمل الحيوان على النزو، وهو الوثب، ولا يقال إلا للشاء والدواب والبقر في معنى السفاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3469} والإنزاء الذي لا يضر جائز، أما إنزاء الحمير على الخيل فمكروه عند بعض الفقهاء، وأجازه الحنفية، ولعلة النهي حفظ نسل الخيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3469}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3470}"
  en: "Inzaa' is causing an animal to mount another for breeding; it is said of sheep, beasts and cows in the sense of covering. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3469} Covering that does no harm is lawful; covering mares by donkeys is disliked by some jurists, and the Hanafis allow it; the reason for the prohibition is preserving the stock of horses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3469}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3470}"
  es: "Inzaa' es hacer que un animal monte a otro para reproducirse; se dice de ovejas, bestias y vacas en el sentido de cubrir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3469} Cubrir que no cause daño es lícito; cubrir a las yeguas con asnos es desaconsejable para algunos juristas, y los hanafíes lo permiten; la razón de la prohibición es preservar la estirpe de caballos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3469}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3470}"
  fr: "L'inzaa' consiste à faire saillir un animal par un autre pour la reproduction; ce terme s'applique aux moutons, aux bêtes et aux vaches, dans le sens de la saillie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3469} La saillie qui ne cause aucun dommage est licite; la saillie des juments par des ânes est désapprouvée par certains juristes, tandis que les hanafites l'autorisent; cette interdiction vise à préserver le cheptel équin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3469}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3470}"
