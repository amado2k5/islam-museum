label: { ar: "فلك التدوير", en: "Epicycle" }
summary:
  ar: "فلك صغير يُحمل على فلك خارج المركز، ويدور فيه الجرم السماوي، ويدور مركزه على محيط الفلك الحامل، وبه يُفسَّر تقدّم الكواكب وتأخّرها ورجوعها. يذكر الفرغاني أن نصف قطر فلك التدوير للقمر ستة أجزاء وثلث، ولعطارد اثنان وعشرون جزءاً ونصف، ولزحل ستة أجزاء ونصف، من نصف قطر الفلك الحامل وهو ستون جزءاً (قراءة OCR). {cite:farghani-elements-astronomy p. 65}{cite:farghani-elements-astronomy p. 67}"
  en: "A small orb carried on the eccentric deferent, in which the body moves. The centre of the epicycle moves round the deferent circle, and the epicycle explains the stations and retrogression of the planets. al-Farghani gives the epicycle radii in units where the deferent radius is sixty, with the figures printed for Saturn, Jupiter, Mars, Venus, Mercury and the Moon {cite:farghani-elements-astronomy p. 65}."
