id: concept/hisab-qirat-al-janaza
class: concept
kind: doctrine
label:
  ar: "شهود الجنازة: قيراط وقيراطان"
  en: "Attending a funeral: one qirat and two"
  ur: "جنازے میں شرکت: ایک قیراط اور دو قیراط"
summary:
  ar: "من شهد الجنازة حتى يصلى عليها فله قيراط، ومن شهدها حتى تُدفن كان له قيراطان، وسئل عن القيراطين فقيل: مثل الجبلين العظيمين، في رواية أبي هريرة [[passage/bukhari-api-1325]] [[passage/muslim-0945]]. القيراط هنا مكيال أجر لا عدد حسنات، ولذلك تعرضه الآلة نتيجة مكتوبة ولا تحوّله إلى رقم."
  en: "Whoever attends a funeral until the prayer is said over it has one qirat, and whoever stays until the burial has two; asked about the two qirats, the answer was: like two great mountains, in Abu Hurayra's narration [[passage/bukhari-api-1325]] [[passage/muslim-0945]]. The qirat here is a measure of reward, not a number of good deeds, so the calculator shows it as a written result and does not turn it into a figure."
  ur: "جو جنازے میں نماز پڑھے جانے تک شریک رہے اس کے لیے ایک قیراط ہے اور جو دفن تک رہے اس کے لیے دو؛ دو قیراط کے بارے میں پوچھا گیا تو جواب ملا: دو بڑے پہاڑوں کی مانند، ابو ہریرہ کی روایت میں [[passage/bukhari-api-1325]] [[passage/muslim-0945]]۔ یہاں قیراط اجر کا پیمانہ ہے، نیکیوں کی تعداد نہیں، اس لیے کیلکولیٹر اسے لکھا ہوا نتیجہ دکھاتا ہے اور عدد میں نہیں بدلتا۔"
