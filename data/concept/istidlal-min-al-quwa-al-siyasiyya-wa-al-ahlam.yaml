label:
  ar: "الاستدلال من القوى السياسية والأحلام"
  en: "Inference from the governing powers and from dreams"
  ur: "سیاسی قوتوں اور خوابوں سے استدلال"
  es: "Inferencias de los poderes gobernantes y de los sueños"
summary:
  ar: "يذكر ابن سينا ما تدل عليه آفات الخيال والفكر والذكر، من برد أو حر أو ورم أو مادة صفراوية أو سوداوية، وما تدل عليه الأحلام {cite:canon-ibn-sina-print-v2 pp.13-14}"
  en: "Ibn Sina gives what afflictions of imagination, thought and memory indicate, whether cold, heat, a swelling or a bilious or black-bilious matter, and what dreams indicate {cite:canon-ibn-sina-print-v2 pp.13-14}"
  ur: "ابن سینا بتاتا ہے کہ تخیل، فکر اور حافظے کی آفتیں سردی، گرمی، ورم یا صفراوی یا سوداوی مادے میں سے کس پر دلالت کرتی ہیں، اور خوابوں کی دلالت کیا ہے {cite:canon-ibn-sina-print-v2 pp.13-14}۔"
  es: "Ibn Sina indica qué significan las aflicciones de la imaginación, el pensamiento y la memoria, ya sea frío, calor, hinchazón o materia biliar o biliosa negra, y qué indican los sueños {cite:canon-ibn-sina-print-v2 pp.13-14}"
