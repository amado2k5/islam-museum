id: concept/taghayyur-lawn-al-asnan
class: concept
kind: scientific
label:
  ar: تغير لون الأسنان
  en: Change of the teeth's colour
  ur: دانتوں کے رنگ کی تبدیلی
  es: "Cambio del color de los dientes"
  fr: "Changement de couleur des dents"
summary:
  ar: قد يتغير لون الأسنان لتغير لون ما يركبها من الطلاوة فيحدث قلح ⁦(وهو عند المحقق صفرة تعلو الأسنان)⁩ وربما تحجر في أصول السن تحجراً يعسر قلعه، وقد يكون لمادة رديئة تنفذ في جوهر السن وتتغير فيها فيفسد لونها إلى باذنجية ونحوها من غير أن يكون عليها قلح، فأما الأول فيعالج بما يجلو وينقي من هذا الجنس وربما زيد فيه صدف محرق وأما الثاني فيعالج بما يحلل المادة ويخرجها ويجلو معاً من هذا الجنس ومن السنون الذي ذكر قبل هذا الباب ⁦(الأسماء والنسخ مطروحة)⁩ {cite:canon-ibn-sina-print-v2 p.275-276}
  en: 'The teeth''s colour may change when the coating laid on them changes colour, forming the qalih (the editor glosses it: a yellowness overlying the teeth), which may even petrify at the tooth-roots, hard to remove; or a bad matter may penetrate the tooth''s substance and spoil its colour to an eggplant-like tint with no qalih present. The first is treated by what cleanses and polishes of this kind, a burnt shell kind sometimes added; the second by what dissolves the matter, draws it out and cleanses together, of this kind and the dentifrice named before this chapter (names and recipes left out) {cite:canon-ibn-sina-print-v2 p.275-276}'
  ur: 'دانتوں کا رنگ اس وقت بدل سکتا ہے جب ان پر چڑھی تہ کا رنگ بدلے جس سے قلح بنتا ہے ⁦(محقق کے مطابق: دانتوں پر چڑھنے والی زردی)⁩ اور بعض اوقات دانتوں کی جڑوں میں پتھر جاتی ہے جس کا نکلنا مشکل ہوتا ہے؛ اور ایسا بھی ہو سکتا ہے کہ بری مواد دانت کے جوہر میں رچ جائے اور اس میں بدل کر اس کا رنگ بینگن جیسا بگاڑ دے بغیر کسی قلح کے؛ پہلے کا علاج اسی جنس کی صاف اور چمکانے والی چیزوں سے ہے جن میں بعض اوقات جلا ہوا صدف ملا دیا جاتا ہے؛ اور دوسرے کا علاج ایسی چیز سے ہے جو مواد کو تحلیل، خارج اور صاف سب ایک ساتھ کرے اسی جنس سے اور اس سنون سے جو اس باب سے پہلے ذکر ہوا ⁦(نام اور نسخے مطروح)⁩ {cite:canon-ibn-sina-print-v2 p.275-276}'
  es: "El color de los dientes puede cambiar cuando la capa que los recubre también cambia de color, formando el qalih (el editor lo describe como un tono amarillento que cubre los dientes), el cual puede incluso petrificarse en las raíces, siendo difícil de eliminar; o bien, una sustancia nociva puede penetrar en la sustancia del diente y alterar su color, dándole un tono berenjena sin la presencia de qalih. El primer caso se trata con un producto limpiador y pulidor de este tipo, al que a veces se le añade una concha carbonizada; el segundo, con un producto que disuelve la sustancia, la extrae y limpia a la vez, de este tipo y la pasta dental mencionada anteriormente en este capítulo (se omiten nombres y recetas) {cite:canon-ibn-sina-print-v2 p.275-276}"
  fr: "La couleur des dents peut changer lorsque la couche qui les recouvre se modifie, formant le qalih (terme utilisé par l'éditeur: une coloration jaunâtre recouvrant les dents), qui peut même se pétrifier à la racine et devenir difficile à enlever; ou bien une substance nocive peut pénétrer la substance de la dent et lui donner une teinte aubergine, sans présence de qalih. Le premier cas est traité avec des produits nettoyants et polissants, parfois additionnés de coquillages brûlés; le second avec des produits dissolvant, extrayant et nettoyant, notamment ce type de produits et le dentifrice mentionné précédemment (noms et recettes omis) {cite:canon-ibn-sina-print-v2 p.275-276}"
