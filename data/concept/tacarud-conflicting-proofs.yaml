id: concept/tacarud-conflicting-proofs
class: concept
kind: legal
label:
  ar: "التعارض"
  en: "Ta'arud (conflict between proofs, and how one is preferred)"
  ur: "تعارض (دلائل یا بینات کا تعارض اور ترجیح)"
summary:
  ar: "التعارض التمانع بين الدليلين، فإن أمكن الجمع جُمع وإلا رُجّح. وأكثر استعماله في تعارض البينات، ومذاهب الفقهاء مختلفة في وجوه الترجيح: فالحنفية لا يعتبرون كثرة الشهود ولا زيادة العدالة، والمالكية يرجحون بالعدالة وقوة الحجة والتاريخ وسبب الملك، والشافعية يقدمون بينة صاحب اليد، والحنابلة يقدمون بينة المدعي في المشهور. وفي حقوق الله التي تدرأ بالشبهات تقدم البينة الأقوى في الدرء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5348} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5349} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5350} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5351} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5353}"
  en: "Ta'arud is the mutual resistance of two proofs; if they can be joined they are joined, otherwise one is preferred. It is mostly used for conflicting testimony, and the schools differ on the grounds of preference: the Hanafis do not weigh numbers or extra probity, the Malikis weigh probity, strength of proof, date and cause of ownership, the Shafiis prefer the holder's proof, and the Hanbalis in the known view prefer the claimant's. In rights of God that doubts avert, the stronger proof prevails in averting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5348} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5349} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5350} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5351} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5353}"
