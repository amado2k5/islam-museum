id: concept/tacarud-conflicting-proofs
class: concept
kind: legal
label:
  ar: "التعارض"
  en: "Ta'arud (conflict between proofs, and how one is preferred)"
  ur: "تعارض ⁦(دلائل یا بینات کا تعارض اور ترجیح)⁩"
  es: "Ta'arud (conflicto entre pruebas y cuál se prefiere)"
  fr: "Ta'arud (conflit entre les preuves et la façon dont l'une est préférée)"
summary:
  ar: "التعارض التمانع بين الدليلين، فإن أمكن الجمع جُمع وإلا رُجّح. وأكثر استعماله في تعارض البينات، ومذاهب الفقهاء مختلفة في وجوه الترجيح: فالحنفية لا يعتبرون كثرة الشهود ولا زيادة العدالة، والمالكية يرجحون بالعدالة وقوة الحجة والتاريخ وسبب الملك، والشافعية يقدمون بينة صاحب اليد، والحنابلة يقدمون بينة المدعي في المشهور. وفي حقوق الله التي تدرأ بالشبهات تقدم البينة الأقوى في الدرء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5348} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5349} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5350} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5351} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5353}"
  en: "Ta'arud is the mutual resistance of two proofs; if they can be joined they are joined, otherwise one is preferred. It is mostly used for conflicting testimony, and the schools differ on the grounds of preference: the Hanafis do not weigh numbers or extra probity, the Malikis weigh probity, strength of proof, date and cause of ownership, the Shafiis prefer the holder's proof, and the Hanbalis in the known view prefer the claimant's. In rights of God that doubts avert, the stronger proof prevails in averting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5348} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5349} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5350} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5351} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5353}"
  es: "Ta'arud es la contraposición de dos pruebas; si pueden unirse, se unen; de lo contrario, se prefiere una. Los hanafíes no dan importancia a la cantidad ni a la probidad adicional; los malikíes, a la probidad, la solidez de la prueba, la fecha y la causa de la propiedad; los shafiíes prefieren la prueba del poseedor; y los hanbalíes, según la opinión generalizada, prefieren la del reclamante. En los derechos divinos que se disipan con dudas, la prueba más sólida prevalece. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5348} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5349} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5350} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5351} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5352} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5353}"
  fr: "Le ta'arud est la résistance mutuelle de deux preuves; si elles peuvent être jointes, elles le sont; sinon, l'une est privilégiée. Les hanafites ne tiennent pas compte du nombre ni de la probité supplémentaire; les malikites, quant à eux, privilégient la probité, la force de la preuve, la date et la cause de la propriété; les chaféites, enfin, privilégient la preuve du détenteur; et les hanbalites, selon l'avis établi, celle du demandeur. En matière de droits divins, face au doute, la preuve la plus solide prévaut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5348} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5349} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5350} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5351} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5353}"
  ur: "طارود دو دلیلوں کی باہمی مزاحمت ہے۔ اگر وہ شامل ہو سکتے ہیں تو وہ شامل ہو گئے، ورنہ ایک کو ترجیح دی جائے گی۔ حنفیہ تعداد یا زائد احتمال کو نہیں تولتے، مالکی ثقات، ثبوت کی طاقت، تاریخ اور وجہ ملکیت کو تولتے ہیں، شافعی حامل کے ثبوت کو ترجیح دیتے ہیں اور حنبلی معروف قول میں دعویٰ کرنے والے کو ترجیح دیتے ہیں۔ خدا کے حقوق میں جو شک کو ٹالتا ہے، ٹالنے میں مضبوط دلیل غالب ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5348} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5349} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5350} صفحہ 5351} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ5352} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص5353}"
