id: "concept/al-dawi-wa-al-tanin"
class: "concept"
kind: "scientific"
label:
  ar: "الدوي والطنين والصفير"
  en: "Ringing, buzzing and whistling in the ear"
  fr: "Tintements, bourdonnements et sifflements d’oreille"
  ur: "کان میں گونج، بھنبھناہٹ اور سیٹی"
  es: "Zumbido, pitido y silbido en el oído"
summary:
  ar: "الدوي والطنين صوت لا يزال الإنسان يسمعه من غير سبب خارج، وقياسه إلى السمع قياس الخيالات والظلم التي يبصرها الإنسان من غير سبب من خارج إلى العين؛ ولما كان الصوت سببه تموج يعرض في الهواء يتأدى إلى الحاسة وجب أن يكون فيه حركة من الهواء، وإذ ليس ذلك الهواء هواء خارجاً فهو الداخل وهو البخار المصبوب في التجاويف، وهذا التموج إما خفي لا يكاد يعرف وإما أكثر، فإن كان خفياً فإما لذكاء الحس أو لضعفه، وإن كان فوق ذلك فسببه محرك للبخار ومموج له فوق المعتاد {cite:canon-ibn-sina-print-v2 p.225}"
  en: "Ringing and buzzing are a sound a man keeps hearing with no outside cause — their measure against hearing is the measure of the phantasms and darknesses the eye sees with no outside cause. Since sound's cause is a waving arising in air reaching the sense, there must here be a movement of air; that air, not being outside air, is the inner air — the vapour poured into the cavities. This waving is either faint, scarce known, or more; if faint, it is from acuteness of the sense or its weakness — the weak being affected by the least waving; if beyond that, its cause is a mover waving the vapour beyond the usual {cite:canon-ibn-sina-print-v2 p.225}"
  fr: "Les tintements et bourdonnements sont un son qu’une personne entend continuellement sans cause extérieure — ils sont à l’ouïe ce que sont à la vue les fantômes et les obscurités que l’œil perçoit sans cause extérieure. Puisque la cause du son est une ondulation de l’air parvenant au sens, il doit y avoir ici un mouvement d’air ; cet air, n’étant pas extérieur, est l’air intérieur — la vapeur répandue dans les cavités. Cette ondulation est soit faible, à peine perceptible, soit plus forte ; faible, elle vient de l’acuité du sens ou de sa faiblesse — le faible étant affecté par la moindre ondulation ; au-delà, sa cause est un moteur faisant onduler la vapeur au-delà du mouvement habituel {cite:canon-ibn-sina-print-v2 p.225}"
  ur: "گونج اور بھنبھناہٹ ایک آواز ہے جو انسان بغیر کسی بیرونی سبب کے مسلسل سنتا رہتا ہے — سماعت کے نسبت اس کی پیمائش وہی ہے جو خیالات اور تاریکیوں کی ہے جو انسان بغیر بیرونی سبب آنکھ سے دیکھتا ہے؛ اور چونکہ آواز کا سبب ہوا میں پیدا ہونے والی لہر ہے جو حاسہ تک پہنچتی ہے، لازم ہے کہ اس میں ہوا کی حرکت ہو؛ اور وہ ہوا باہر کی نہیں بل اندرونی ہے — جوفوں میں ڈھلی ہوئی بھاپ؛ یہ لہر یا اتنی لطیف ہے کہ شاذ ہی معلوم ہو یا اس سے زیادہ؛ اگر لطیف ہو تو حس کی تیزی سے یا اس کے ضعف سے — کمزور ہلکی لہر سے بھی متاثر ہو جاتا ہے؛ اور اگر اس سے بڑھ کر ہو تو سبب بھاپ کو معتاد سے زیادہ ہلانے اور موج دینے والا محرک ہے {cite:canon-ibn-sina-print-v2 p.225}"
  es: "El zumbido y el pitido son sonidos que el hombre sigue oyendo sin causa externa; su medida con respecto al oído es la medida de los fantasmas y las tinieblas que el ojo ve sin causa externa. Dado que la causa del sonido es una onda que surge en el aire y llega a los sentidos, debe haber aquí un movimiento de aire; ese aire, al no ser aire exterior, es el aire interior: el vapor vertido en las cavidades. Esta onda es débil, apenas perceptible o más; si es débil, se debe a la agudeza del sentido o a su debilidad: los débiles se ven afectados por la menor onda; si es más allá de eso, su causa es un motor que mueve el vapor más allá de lo habitual {cite:canon-ibn-sina-print-v2 p.225}"
