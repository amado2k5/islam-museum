class: concept
kind: legal
label: { ar: "وَجْه", en: "Wajh (the face: washing in ablution, tayammum, covering and looking, and the face in supplication)", es: "Wajh (el rostro: lavado en la ablución, tayammum, cubrir y mirar, y el rostro en súplica)", fr: "Wajh (le visage: ablution, tayammum, se couvrir et regarder, et le visage en supplication)", ur: "وضو ⁦(چہرہ: وضو میں دھونا، تیمم، ڈھانپنا اور دیکھنا، اور دعا میں چہرہ)⁩", tr: "yüz", id: "wajah" }
summary:
  ar: "الوجه في اللغة مأخوذ من المواجهة، وهو مستقبل كل شيء، وفي الإنسان ما بين منابت شعر الرأس غالباً إلى أسفل الذقن طولاً، وما بين شحمتي الأذنين عرضاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16619} ويجب غسل الوجه في الوضوء، ومسحه ركن في التيمم باتفاق الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16619} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16620} وذهب جمهور الفقهاء إلى أن وجه المرأة الحرة البالغة ليس بعورة، وذهب بعض الحنابلة إلى أنه عورة، ويحرم النظر إلى وجه المرأة الأجنبية بشهوة أو عند خوف الفتنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16619} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16620} وأنكر الفقهاء على المرأة كشف وجهها بين الرجال الأجانب، وقال بعض الشافعية والحنابلة إن الرجال هم المأمورون بغض البصر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16620} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16621} ويحرم الضرب في الوجه والوسم فيه في الإنسان والحيوان، لنهي النبي عن ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16621} ومنع الحنفية والمالكية ستر وجه المحرم، وأجازه الشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16621} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16622} وأجاز الحنفية والشافعية في المعتمد مسح الوجه باليدين عند الدعاء، واستحبه الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16622}"
  en: "Wajh in the lexical sense comes from confronting; it is the front of anything, and in a person it runs from the hairline down to the chin and across between the earlobes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16619} Washing the face is required in ablution, and wiping it is a pillar of tayammum by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16619} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16620} Most jurists hold that a free adult woman's face is not an intimate part, while some Hanbalis hold it is; looking at a woman's face with desire, or where temptation is feared, is forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16619} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16620} Jurists rebuke a young woman who uncovers her face before unrelated men out of fear of temptation; some Shafi'is and Hanbalis hold that the men must lower their gaze and the woman is not obliged to cover her face in the street. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16620} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16621} Striking or branding the face is forbidden, in man or beast, by the Prophet's prohibition. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16621} The Hanafis and Malikis forbid a pilgrim in ihram from covering his face, while the Shafi'is and Hanbalis allow it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16621} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16622} The Hanafis and, in the accepted view, the Shafi'is allow wiping the face with the hands after supplication, and the Shafi'is recommend it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16622}"
  es: "Wajh en el sentido léxico proviene de confrontar; es el frente de cualquier cosa, y en una persona va desde la línea del cabello hasta la barbilla y pasa entre los lóbulos de las orejas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16619} Lavarse la cara es requerido en la ablución, y limpiarla es un pilar de tayammum por acuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16619} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16620} La mayoría de los juristas sostienen que el rostro de una mujer adulta libre no es una parte íntima, mientras que algunos hanbalíes sostienen que sí lo es; mirar el rostro de una mujer con deseo, o cuando se teme la tentación, está prohibido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16619} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16620} Los juristas reprenden a una joven que descubre su rostro ante hombres no emparentados por temor a la tentación; algunos shafi'ís y hanbalíes sostienen que los hombres deben bajar la mirada y que la mujer no está obligada a cubrirse el rostro en la calle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16620} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16621} Golpear o marcar el rostro está prohibido, en el hombre o en la bestia, por la prohibición del Profeta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16621} Los hanafíes y los malikíes prohíben que un peregrino en ihram se cubra el rostro, mientras que los shafiíes y los hanbalíes lo permiten. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16621} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16622} Los hanafíes y, según la opinión aceptada, los shafiíes permiten limpiarse el rostro con las manos después de la súplica, y los shafiíes lo recomiendan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16622}"
  fr: "Le terme « wajh », au sens littéral, vient de l'idée de confrontation; il désigne le devant de toute chose, et chez une personne, il s'étend de la naissance des cheveux jusqu'au menton, en passant entre les lobes des oreilles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16619} Se laver le visage est une obligation lors des ablutions, et l'essuyer est un pilier du tayammum, par consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16619} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16620} La plupart des juristes considèrent que le visage d'une femme adulte et libre n'est pas une partie intime, tandis que certains hanbalites estiment le contraire; regarder le visage d'une femme avec désir, ou par crainte de la tentation, est interdit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16619} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16620} Les juristes réprimandent une jeune femme qui se découvre le visage devant des hommes qui ne sont pas de sa famille par crainte de la tentation; certains chaféites et hanbalites estiment que les hommes doivent baisser le regard et que la femme n’est pas tenue de se couvrir le visage dans la rue. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16620} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16621} Frapper ou marquer le visage est interdit, chez l’homme comme chez l’animal, par l’interdiction du Prophète. Les hanafites et les malikites interdisent au pèlerin en état d'ihram de se couvrir le visage, tandis que les chaféites et les hanbalites l'autorisent. Les hanafites et, selon l'avis généralement admis, les chaféites, autorisent à s'essuyer le visage avec les mains après la supplication, et les chaféites le recommandent."
  ur: "لغوی معنوں میں وج محاذ آرائی سے آتا ہے۔ یہ کسی بھی چیز کا اگلا حصہ ہوتا ہے، اور ایک شخص میں یہ بالوں کی لکیر سے نیچے ٹھوڑی تک اور کان کے لوتھڑے کے درمیان ہوتا ہے۔ وضو میں چہرہ دھونا واجب ہے اور مسح کرنا تیمم کا ستون ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16619} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16620} اکثر فقہاء کا خیال ہے کہ آزاد بالغ عورت کا چہرہ مباشرت کا حصہ نہیں ہے، جبکہ بعض حنبلیوں کے نزدیک یہ ہے۔ عورت کے چہرے کو خواہش سے دیکھنا یا جہاں فتنہ کا اندیشہ ہو حرام ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.16619} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16620} فقہاء ایک نوجوان عورت کو ملامت کرتے ہیں جو فتنہ کے خوف سے غیر متعلقہ مردوں کے سامنے اپنا چہرہ ننگا کرتی ہے۔ بعض شافعی اور حنبلی کا خیال ہے کہ مرد اپنی نگاہیں نیچی رکھیں اور عورت کو گلی میں منہ چھپانا واجب نہیں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16620} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16621} نبی کی ممانعت سے انسان یا حیوان میں چہرے پر مارنا یا داغ لگانا حرام ہے۔ احناف اور مالکیہ احرام باندھنے والے کو چہرہ ڈھانپنے سے منع کرتے ہیں، جبکہ شافعی اور حنبلی اس کی اجازت دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص16621} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16622} احناف اور شافعیہ کے نزدیک دعا کے بعد ہاتھوں سے چہرے کا مسح کرنے کی اجازت ہے اور شافعی اس کی سفارش کرتے ہیں۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص16622}"
  tr: "Dilde 'wajh' 'mumujah' (yüze dönük olmak) kelimesinden türemiştir ve her şeyin geleceğidir. İnsanlarda genellikle başın saç telleri arasında, uzunlamasına alt çeneye ve kulak memeleri arasında yatay olarak bulunur. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.16619} Yüz abdest alma sırasında yıkanmalıdır ve onu silmek, hukukçuların uzlaşmasına göre tayammum'da bir sütundur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16619} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16620} Hukukçuların çoğu, özgür, yetişkin bir kadının yüzünün 'awra olmadığını, bazı Hanbaliler ise 'awrah' olduğunu ve mahram olmayan bir kadının yüzüne şehvetle veya ayartma korkusuyla bakmanın yasak olduğunu savunur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16619}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16620} Hukukçular, mahram olmayan erkekler arasında bir kadının yüzünü açığa çıkarmasını da onaylamamıştır. Bazı Şafi'ler ve Hanbaliler, erkeklerin bakışları kaçırmaları emredildiğini söyler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16620} ve Peygamber'in yasakladığı gibi, yüzü vurmak ve insanlara ya da hayvanlara işaretlemek yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16621} ve Hanafi ile Malikiler mahramın yüzünü örtmeyi yasaklarken, Şafi'ler ve Hanbaliler buna izin vermiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16621} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16622} Güvenilir kaynaklarda Hanafi ve Şafi'ler, dua sırasında yüzü elleriyle silmeye izin verilmiş ve Şafiiler bunu tavsiye etmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16622}"
  id: "Dalam bahasa, 'wajh' berasal dari 'mumujah' (wajah menghadap), yang merupakan masa depan segala sesuatu. Pada manusia, biasanya berada di antara helaian rambut kepala memanjang hingga dagu bawah dan di antara daun telinga secara horizontal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16619} Wajah harus dicuci saat wudhu, dan menghapusnya adalah tiang dalam tayammum menurut kesepakatan para ahli hukum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16619} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16620} Mayoritas ahli hukum berpendapat bahwa wajah wanita dewasa yang bebas bukanlah 'awrah, sementara beberapa Hanbal berpendapat bahwa itu adalah 'awrah, dan dilarang melihat wajah wanita non-mahram dengan nafsu atau karena takut godaan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16619} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16620} Para ahli hukum juga tidak menyetujui seorang wanita yang menutupi wajahnya di antara pria non-mahram. Beberapa Shafi'i dan Hanbalis mengatakan bahwa pria diperintahkan untuk mengalihkan pandangan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16620} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16621} dan dilarang memukul wajah dan menandainya pada manusia atau hewan, seperti yang dilarang oleh Nabi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16621} dan Hanafi serta Malik melarang menutupi wajah mahram, dan Shafi'i serta Hanbalis mengizinkannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16621} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16622} Para Hanafi dan Shafi'i diizinkan, dalam sumber yang dapat dipercaya, untuk mengelap wajah dengan tangan saat berdoa, dan para Shafi'i merekomendasikannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16622}"
