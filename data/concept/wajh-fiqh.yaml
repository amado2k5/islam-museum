id: concept/wajh-fiqh
class: concept
kind: legal
label: { ar: "وَجْه", en: "Wajh (the face: washing in ablution, tayammum, covering and looking, and the face in supplication)" }
summary:
  ar: "الوجه في اللغة مأخوذ من المواجهة، وهو مستقبل كل شيء، وفي الإنسان ما بين منابت شعر الرأس غالباً إلى أسفل الذقن طولاً، وما بين شحمتي الأذنين عرضاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16619} ويجب غسل الوجه في الوضوء، ومسحه ركن في التيمم باتفاق الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16619} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16620} وذهب جمهور الفقهاء إلى أن وجه المرأة الحرة البالغة ليس بعورة، وذهب بعض الحنابلة إلى أنه عورة، ويحرم النظر إلى وجه المرأة الأجنبية بشهوة أو عند خوف الفتنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16619} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16620} وأنكر الفقهاء على المرأة كشف وجهها بين الرجال الأجانب، وقال بعض الشافعية والحنابلة إن الرجال هم المأمورون بغض البصر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16620} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16621} ويحرم الضرب في الوجه والوسم فيه في الإنسان والحيوان، لنهي النبي عن ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16621} ومنع الحنفية والمالكية ستر وجه المحرم، وأجازه الشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16621} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16622} وأجاز الحنفية والشافعية في المعتمد مسح الوجه باليدين عند الدعاء، واستحبه الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16622}"
  en: "Wajh in the lexical sense comes from confronting; it is the front of anything, and in a person it runs from the hairline down to the chin and across between the earlobes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16619} Washing the face is required in ablution, and wiping it is a pillar of tayammum by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16619} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16620} Most jurists hold that a free adult woman's face is not an intimate part, while some Hanbalis hold it is; looking at a woman's face with desire, or where temptation is feared, is forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16619} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16620} Jurists rebuke a young woman who uncovers her face before unrelated men out of fear of temptation; some Shafi'is and Hanbalis hold that the men must lower their gaze and the woman is not obliged to cover her face in the street. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16620} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16621} Striking or branding the face is forbidden, in man or beast, by the Prophet's prohibition. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16621} The Hanafis and Malikis forbid a pilgrim in ihram from covering his face, while the Shafi'is and Hanbalis allow it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16621} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16622} The Hanafis and, in the accepted view, the Shafi'is allow wiping the face with the hands after supplication, and the Shafi'is recommend it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16622}"
