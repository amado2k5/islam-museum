label:
  ar: "ارتثاث"
  en: "Irtithath (the wounded man carried from the battle still alive, and his rulings for washing, prayer and the rank of martyr)"
  ur: "ارتثاث ⁦(میدان سے زندہ اٹھایا گیا زخمی، اور اس کے غسل، نماز اور شہادت کے احکام)⁩"
  es: "Irtithath (el hombre herido que fue sacado con vida de la batalla, y sus normas sobre el lavado, la oración y el rango de mártir)"
  fr: "Irtithath (l'homme blessé ramené vivant du champ de bataille, et ses règles concernant la purification, la prière et le statut de martyr)"
  tr: "Rahatlama"
  id: "Relaksasi"
summary:
  ar: "الارتثاث في الفقه أن يحمل الجريح من المعركة وبه رمق، وهو المرتث، وقد اشترط الفقهاء أن يكون مستقر الحياة بالكلام أو الأكل أو الشرب أو طول البقاء. والمرتث يغسل ويصلى عليه، ولا يجري عليه حكم الشهداء في الدنيا، لكنه شهيد في الثواب باتفاق فيمن مات بعد المعركة مع الكفار، وأما المرتث من البغاة فيه خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2090}"
  en: "In law, irtithath is a wounded man carried from the battle while still faintly alive; such a man is the mutarrath. The jurists require that his life have settled: he spoke, ate, drank, slept, bought or sold, or survived for a customary time, and then died. The mutarrath is washed and prayed over, does not have the rulings of a martyr in this world, but is a martyr in reward by agreement when he dies after the battle with unbelievers; the case of a rebel carried away is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2090}"
  ur: "فقہ میں ارتثاث یہ ہے کہ زخمی کو میدان سے اس حال میں اٹھایا جائے کہ اس میں تھوڑی سی جان باقی ہو، اور ایسا شخص مرتث کہلاتا ہے۔ فقہاء نے شرط لگائی کہ اس کی زندگی ٹھہر چکی ہو، یعنی وہ بات کرے، کھائے، پیے، سوئے، خرید و فروخت کرے، یا معمول کی مدت تک زندہ رہے، پھر مرے۔ مرتث کو غسل دیا جاتا ہے اور اس کی نماز پڑھی جاتی ہے، دنیا میں اس پر شہیدوں کے احکام جاری نہیں ہوتے، لیکن کافروں سے جنگ کے بعد مرنے والا ثواب میں بالاتفاق شہید ہے؛ باغیوں کے مرتث میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2090}"
  es: "En derecho, irtithath es un hombre herido que es llevado de la batalla aún débilmente con vida; a este hombre se le llama mutarrath. Los juristas exigen que su vida se haya estabilizado: que haya hablado, comido, bebido, dormido, comprado o vendido, o sobrevivido durante el tiempo habitual, y luego haya fallecido. El mutarrath es lavado y se reza por él; no tiene las mismas prerrogativas que un mártir en este mundo, pero es un mártir en recompensa por acuerdo cuando muere después de la batalla contra los infieles; el caso de un rebelde llevado es objeto de controversia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2090}"
  fr: "En droit, un irtithath est un homme blessé, emporté du champ de bataille alors qu'il est encore faiblement vivant; cet homme est un mutarrath. Les juristes exigent que sa vie se soit stabilisée: il a parlé, mangé, bu, dormi, acheté ou vendu, ou a survécu pendant un laps de temps coutumier, puis est décédé. Le mutarrath est lavé et on prie pour lui; il ne bénéficie pas des mêmes droits qu'un martyr dans ce monde, mais il est reconnu comme martyr par reconnaissance et par accord mutuel lorsqu'il meurt après la bataille contre les infidèles; le cas d'un rebelle emporté est sujet à controverse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2090}"
  tr: "Hukukta 'miras', yaralıyı savaştan bir ömür süreli taşımaktır ve o kişi miras olarak kabul edilir. Hukukçular, onun konuşma, yeme, içme veya uzun süre kalarak istikrarlı bir yaşam sürdürebilmesi gerektiğini belirtmişlerdir. Miras alınan kişi yıkanır ve dua edilir, bu dünyadaki şehitlerin hükmü ona uygulanmaz, ancak savaştan sonra kâfirlerle ölenler için anlaşma yoluyla ödüllendirilen bir şehittir. İsyancılardan miras konusunda bir anlaşmazlık vardır. {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.2090}"
  id: "Dalam yurisprudensi, 'warisan' adalah membawa yang terluka dari medan perang dengan umur panjang, dan ia dianggap sebagai yang diwariskan. Para ahli hukum menetapkan bahwa ia harus mampu menjalani hidup yang stabil melalui bicara, makan, minum, atau tinggal lama. Orang yang diwarisi dicuci dan didoakan, dan keputusan para martir di dunia ini tidak berlaku untuknya, tetapi ia adalah martir sebagai hadiah berdasarkan kesepakatan terhadap mereka yang meninggal setelah berperang dengan kaum kafir. Adapun warisan dari pemberontak, ada perselisihan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.2090}"
