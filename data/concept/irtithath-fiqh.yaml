label:
  ar: "ارتثاث"
  en: "Irtithath (the wounded man carried from the battle still alive, and his rulings for washing, prayer and the rank of martyr)"
  ur: "ارتثاث (میدان سے زندہ اٹھایا گیا زخمی، اور اس کے غسل، نماز اور شہادت کے احکام)"
summary:
  ar: "الارتثاث في الفقه أن يحمل الجريح من المعركة وبه رمق، وهو المرتث، وقد اشترط الفقهاء أن يكون مستقر الحياة بالكلام أو الأكل أو الشرب أو طول البقاء. والمرتث يغسل ويصلى عليه، ولا يجري عليه حكم الشهداء في الدنيا، لكنه شهيد في الثواب باتفاق فيمن مات بعد المعركة مع الكفار، وأما المرتث من البغاة فيه خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2090}"
  en: "In law, irtithath is a wounded man carried from the battle while still faintly alive; such a man is the mutarrath. The jurists require that his life have settled: he spoke, ate, drank, slept, bought or sold, or survived for a customary time, and then died. The mutarrath is washed and prayed over, does not have the rulings of a martyr in this world, but is a martyr in reward by agreement when he dies after the battle with unbelievers; the case of a rebel carried away is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2090}"
  ur: "فقہ میں ارتثاث یہ ہے کہ زخمی کو میدان سے اس حال میں اٹھایا جائے کہ اس میں تھوڑی سی جان باقی ہو، اور ایسا شخص مرتث کہلاتا ہے۔ فقہاء نے شرط لگائی کہ اس کی زندگی ٹھہر چکی ہو، یعنی وہ بات کرے، کھائے، پیے، سوئے، خرید و فروخت کرے، یا معمول کی مدت تک زندہ رہے، پھر مرے۔ مرتث کو غسل دیا جاتا ہے اور اس کی نماز پڑھی جاتی ہے، دنیا میں اس پر شہیدوں کے احکام جاری نہیں ہوتے، لیکن کافروں سے جنگ کے بعد مرنے والا ثواب میں بالاتفاق شہید ہے؛ باغیوں کے مرتث میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2090}"
