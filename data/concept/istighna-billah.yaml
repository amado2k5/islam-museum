id: concept/istighna-billah
class: concept
kind: ethical
label:
  ar: "الاستغناء بالله"
  en: "Self-sufficiency in God (istighna billah)"
  ur: "اللہ پر استغناء"
summary:
  ar: "يفرّق الشيخ عمر عبد الكافي بين أن يستغني الإنسان بالله وأن يستغني عن الشيء، فالأول هو الاستغناء والإيمان الحقيقيان. ويذكر علامتين على الاستغناء بالله: ألا يخاف الإنسان إلا الله، وأن يعتمد على ما بيد الله لا على ما بيده."
  en: "Sheikh Omar Abdelkafy distinguishes between being self-sufficient in God and being free of a thing, the first being true self-sufficiency and true faith. He names two signs of self-sufficiency in God: that one fears none but God, and that one depends on what is in God's hand rather than in one's own."
  ur: "شیخ عمر عبدالکافی اللہ پر استغناء اور کسی چیز سے بے نیازی کے فرق کو واضح کرتے ہیں، اور کہتے ہیں کہ پہلا حقیقی استغناء اور حقیقی ایمان ہے۔ وہ اللہ پر استغناء کی دو علامتیں بتاتے ہیں: یہ کہ انسان اللہ کے سوا کسی سے نہ ڈرے، اور یہ کہ وہ اپنے ہاتھ کی چیز کے بجائے اللہ کے ہاتھ کی چیز پر بھروسا کرے۔"
