id: concept/istighna-billah
class: concept
kind: ethical
label:
  ar: "الاستغناء بالله"
  en: "Self-sufficiency in God (istighna billah)"
  ur: "اللہ پر استغناء"
  es: "Autosuficiencia en Dios (istighna billah)"
  fr: "L'autosuffisance en Dieu (istighna billah)"
  tr: "Tanrı'nın dağıtımını aramak"
  id: "Mencari pemberian Tuhan"
summary:
  ar: "يفرّق الشيخ عمر عبد الكافي بين أن يستغني الإنسان بالله وأن يستغني عن الشيء، فالأول هو الاستغناء والإيمان الحقيقيان. ويذكر علامتين على الاستغناء بالله: ألا يخاف الإنسان إلا الله، وأن يعتمد على ما بيد الله لا على ما بيده."
  en: "Sheikh Omar Abdelkafy distinguishes between being self-sufficient in God and being free of a thing, the first being true self-sufficiency and true faith. He names two signs of self-sufficiency in God: that one fears none but God, and that one depends on what is in God's hand rather than in one's own."
  ur: "شیخ عمر عبدالکافی اللہ پر استغناء اور کسی چیز سے بے نیازی کے فرق کو واضح کرتے ہیں، اور کہتے ہیں کہ پہلا حقیقی استغناء اور حقیقی ایمان ہے۔ وہ اللہ پر استغناء کی دو علامتیں بتاتے ہیں: یہ کہ انسان اللہ کے سوا کسی سے نہ ڈرے، اور یہ کہ وہ اپنے ہاتھ کی چیز کے بجائے اللہ کے ہاتھ کی چیز پر بھروسا کرے۔"
  es: "El jeque Omar Abdelkafy distingue entre la autosuficiencia en Dios y la liberación de las posesiones materiales, siendo la primera la verdadera autosuficiencia y la verdadera fe. Menciona dos señales de autosuficiencia en Dios: no temer a nadie más que a Dios y depender de lo que está en manos de Dios en lugar de en las propias."
  fr: "Le cheikh Omar Abdelkafy établit une distinction entre l'autosuffisance en Dieu et la liberté matérielle, la première étant la véritable autosuffisance et la foi authentique. Il cite deux signes de l'autosuffisance en Dieu: ne craindre que Dieu et s'en remettre à ce qui est entre les mains de Dieu plutôt qu'aux siennes propres."
  tr: "Şeyh Ömer Abdul Kafi, bir kişinin Tanrı'ya karşı kendine yeterli olması ile bir şeyden kendi kendine yeterli olması arasında ayrım yapar; ilki gerçek kendine yeterlilik ve inançtır. Tanrı aracılığıyla kendi kendine yeterliliğin iki işaretinden bahseder: bir kişinin sadece Tanrı'dan korkması ve kişinin elinde olana güvenmesi gerektiği, onun elindekilere değil."
  id: "Sheikh Omar Abdul Kafi membedakan antara seseorang yang mandiri dengan Tuhan dan mandiri dari sesuatu; yang pertama adalah kemandirian sejati dan iman. Ia menyebutkan dua tanda kemandirian melalui Tuhan: bahwa seseorang tidak takut kepada siapa pun selain Tuhan, dan bahwa seseorang harus bergantung pada apa yang ada di tangan Tuhan, bukan pada apa yang ada di tangannya."
