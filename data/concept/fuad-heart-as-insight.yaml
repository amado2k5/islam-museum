summary:
  ar: "لفظان يستعملهما القرآن لعضو الإدراك الباطني الذي يرى ويعي، وبه يبلغ الإنسان جانباً من الواقع لا تبلغه الحواس وحدها؛ يضعه محمد إقبال إلى جانب الحس في المحاضرة الأولى، ولا يعدّه ملكة غامضة خاصة بل طريقة في التعامل مع الواقع."
  en: "Two Qur'anic words, fu'ad and qalb, used for an inner faculty of insight that sees and understands and through which a person reaches aspects of reality that the senses alone do not reach. Muhammad Iqbal places it beside sense-perception in Lecture I, and reads it as a way of dealing with reality rather than a special hidden faculty."
