id: concept/fuad-heart-as-insight
class: concept
kind: term
label: { ar: "الفؤاد والقلب", en: "Fu'ad and qalb (the heart as insight)", es: "Fu'ad y qalb (el corazón como sabiduría)", fr: "Fu'ad et qalb (le cœur comme perspicacité)" }
summary:
  ar: "لفظان يستعملهما القرآن لعضو الإدراك الباطني الذي يرى ويعي، وبه يبلغ الإنسان جانباً من الواقع لا تبلغه الحواس وحدها؛ يضعه محمد إقبال إلى جانب الحس في المحاضرة الأولى، ولا يعدّه ملكة غامضة خاصة بل طريقة في التعامل مع الواقع."
  en: "Two Qur'anic words, fu'ad and qalb, used for an inner faculty of insight that sees and understands and through which a person reaches aspects of reality that the senses alone do not reach. Muhammad Iqbal places it beside sense-perception in Lecture I, and reads it as a way of dealing with reality rather than a special hidden faculty."
  es: "Dos palabras coránicas, fu'ad y qalb, se utilizan para referirse a una facultad interna de intuición que permite ver y comprender, y mediante la cual una persona alcanza aspectos de la realidad que los sentidos por sí solos no perciben. Muhammad Iqbal la sitúa junto a la percepción sensorial en la Lección I, y la interpreta como una forma de lidiar con la realidad, más que como una facultad oculta especial."
  fr: "Deux termes coraniques, fu'ad et qalb, désignent une faculté intérieure d'intuition qui permet de voir et de comprendre, et grâce à laquelle on accède à des aspects de la réalité inaccessibles aux seuls sens. Muhammad Iqbal, dans sa première conférence, la situe au même titre que la perception sensorielle et la conçoit comme une manière d'appréhender la réalité plutôt que comme une faculté cachée et particulière."
