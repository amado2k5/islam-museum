summary:
  ar: "ظلمات في بحر لجي يغشاه موج من فوقه موج من فوقه سحاب ظلمات بعضها فوق بعض، ولو كان البحر مداداً لكلمات ربي لنفد البحر قبل أن تنفد كلمات ربي ولو جئنا بمثله مدداً."
  en: "Darkness upon darkness in a deep sea, covered by waves above which are waves above which are clouds; if the sea were ink for the words of my Lord, the sea would run out before His words did, though We brought its like again."
  ur: "گہرے سمندر میں اندھیرے پر اندھیرے، اوپر لہریں جن پر لہریں جن پر بادل؛ اگر سمندر میرے رب کے کلمات کی سیاہی ہوتا تو اس کے کلمات ختم ہونے سے پہلے سمندر ختم ہو جاتا خواہ ہم اتنا ہی اور لے آتے۔"
  es: "Oscuridad sobre oscuridad en un mar profundo, cubierto por olas sobre las cuales hay olas sobre las cuales hay nubes; si el mar fuera tinta para las palabras de mi Señor, el mar se agotaría antes que Sus palabras, aunque trajéramos algo semejante."
  fr: "Des ténèbres sur des ténèbres dans une mer profonde, recouvertes de vagues surmontées de vagues, elles-mêmes surmontées de nuages; si la mer était de l'encre pour les paroles de mon Seigneur, la mer s'épuiserait avant Ses paroles, même si Nous en faisions ressurgir des semblables."
  tr: "Öfkeli bir denizde karanlık, üstünde dalgalarla kaplı, dalgalar üzerinde, karanlık bulutlar diğerlerinin üzerine katmanlanmış. Eğer deniz, Rabbimin sözlerinin mürekkep kaynağı olsaydı, deniz Rabbimin sözleri bitmeden biterdi ve biz de benzerini ek olarak getirirsek."
  id: "Kegelapan di lautan yang mengamuk, tertutup gelombang di atasnya, gelombang di atasnya, awan kegelapan yang bertumpuk di atas yang lain. Jika laut menjadi sumber tinta untuk kata-kata Tuhanku, laut akan habis sebelum kata-kata Tuhanku habis, dan jika kita membawa yang serupa, sebagai pelengkap."
