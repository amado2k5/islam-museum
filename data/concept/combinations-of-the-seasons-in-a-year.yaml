summary:
  ar: "يفرد ابن سينا الفصل السابع لأحكام تركيب السنة، أي ما يترتب على اجتماع ربيع من صفة مع شتاء أو صيف أو خريف من صفة أخرى، من جنوبي وشمالي ورطب ويابس {cite:canon-ibn-sina-print-v1 pp.121-122}."
  en: "Chapter 7 gives the rulings for how a year is put together, that is, what follows when a spring of one kind meets a winter, summer or autumn of another, southern or northern, moist or dry {cite:canon-ibn-sina-print-v1 pp.121-122}."
  es: "El capítulo 7 da las reglas sobre cómo se compone un año, es decir, lo que sucede cuando una primavera de un tipo se encuentra con un invierno, verano u otoño de otro, del sur o del norte, húmedo o seco {cite:canon-ibn-sina-print-v1 pp.121-122}."
  fr: "Le chapitre 7 donne les règles sur la façon dont une année est constituée, c'est-à-dire ce qui suit lorsqu'un printemps d'un type rencontre un hiver, un été ou un automne d'un autre type, du sud ou du nord, humide ou sec {cite:canon-ibn-sina-print-v1 pp.121-122}."
