summary:
  ar: "يفتتح ابن سينا الفصل الرابع، في تدبير الأطفال إذا انتقلوا إلى سن الصبا، بأن يكون وكد العناية مصروفاً إلى مراعاة أخلاق الصبي فيعدل، لمنفعتين: صلاح نفسه ونشأته على حسن الأخلاق، وصلاح بدنه إذ تتبع الأخلاق الرديئة سوء المزاج {cite:canon-ibn-sina-print-v1 p.220}."
  en: "Ibn Sina opens chapter four, on the regimen of children once they pass into boyhood, by saying that the chief care should go to attending to the child's character so that it is balanced, for two benefits: the good of its soul, raised from childhood in good character, and the good of its body, since bad character follows an ill temperament {cite:canon-ibn-sina-print-v1 p.220}."
