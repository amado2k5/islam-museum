id: concept/malaikat-salat-ala-l-nabi
class: concept
kind: angel
label:
  ar: ملائكة يصلون على النبي
  en: The Angels Who Send Salawat on the Prophet
  ur: نبی پر درود بھیجنے والے فرشتے
  es: "Los ángeles que envían bendiciones al profeta"
  fr: "Les anges qui envoient des prières sur le Prophète"
  tr: "Melekler peygambere dua ediyor"
  id: "Malaikat berdoa kepada nabi"
summary:
  ar: حديث يقرر أن الله وملائكته يصلون على النبي، وأن من صلى عليه كُتب له بها عشراً، وهو من أظهر ما ورد في تكريم الملائكة للنبي.
  en: A hadith establishes that God and His angels send salawat on the Prophet, and that whoever sends salawat on him has ten recorded for him — among the clearest statements of the angels' honour for the Prophet.
  ur: حدیث میں آئے ہے کہ اللہ اور اس کے فرشتے نبی پر درود بھیجتے ہیں اور جو شخص اس پر درود بھیجے اس کے لیے دس گنا لکھا جاتا ہے — فرشتوں کی نبی کے لیے تعظیم میں سے۔
  es: "Un hadiz establece que Dios y Sus ángeles envían bendiciones sobre el Profeta, y que quien envía bendiciones sobre él tiene diez registradas para él, una de las declaraciones más claras del honor que los ángeles tienen por el Profeta."
  fr: "Un hadith établit que Dieu et Ses anges prient sur le Prophète, et que quiconque prie sur lui en voit dix inscrites — l'une des déclarations les plus claires de l'honneur que les anges portent au Prophète."
  tr: "Allah'ın ve meleklerinin Peygamber'e bereket gönderdiğini ve ona namaz kılanın on kere kaydedildiğini onaylayan bir hadis. Bu, meleklerin Peygamber'e saygı göstermesiyle ilgili en açık noktalardan biridir."
  id: "Hadits yang menegaskan bahwa Allah dan malaikat-Nya mengirimkan berkat kepada Nabi, dan bahwa siapa pun yang berdoa kepada-Nya dicatat sepuluh kali untuk itu. Ini adalah salah satu poin paling jelas mengenai penghormatan para malaikat kepada Nabi."
