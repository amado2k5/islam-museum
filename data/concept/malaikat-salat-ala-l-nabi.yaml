id: concept/malaikat-salat-ala-l-nabi
class: concept
kind: angel
label:
  ar: ملائكة يصلون على النبي
  en: The Angels Who Send Salawat on the Prophet
  ur: نبی پر درود بھیجنے والے فرشتے
summary:
  ar: حديث يقرر أن الله وملائكته يصلون على النبي، وأن من صلى عليه كُتب له بها عشراً، وهو من أظهر ما ورد في تكريم الملائكة للنبي.
  en: A hadith establishes that God and His angels send salawat on the Prophet, and that whoever sends salawat on him has ten recorded for him — among the clearest statements of the angels' honour for the Prophet.
  ur: حدیث میں آئے ہے کہ اللہ اور اس کے فرشتے نبی پر درود بھیجتے ہیں اور جو شخص اس پر درود بھیجے اس کے لیے دس گنا لکھا جاتا ہے — فرشتوں کی نبی کے لیے تعظیم میں سے۔
