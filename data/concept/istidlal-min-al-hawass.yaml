id: concept/istidlal-min-al-hawass
class: concept
kind: scientific
label:
  ar: "الاستدلال على الدماغ من الحواس"
  en: "Inference about the brain from the senses"
  ur: "حواس سے دماغ پر استدلال"
  es: "Inferencias sobre el cerebro a partir de los sentidos"
  fr: "Déduction concernant le cerveau à partir des sens"
summary:
  ar: "يبين ابن سينا كيف تدل آفات البصر والسمع والشم والذوق واللمس، وكدورة الحواس وصفاؤها، على حال الدماغ ومزاجه {cite:canon-ibn-sina-print-v2 pp.11-13}"
  en: "Ibn Sina shows how afflictions of sight, hearing, smell, taste and touch, and the murkiness or clarity of the senses, point to the state and temperament of the brain {cite:canon-ibn-sina-print-v2 pp.11-13}"
  ur: "ابن سینا بتاتا ہے کہ بصارت، سماعت، شامّہ، ذائقہ اور لمس کی آفتیں، اور حواس کا گدلا یا صاف ہونا، دماغ کی حالت اور مزاج پر کیسے دلالت کرتے ہیں {cite:canon-ibn-sina-print-v2 pp.11-13}۔"
  es: "Ibn Sina muestra cómo las aflicciones de la vista, el oído, el olfato, el gusto y el tacto, así como la opacidad o claridad de los sentidos, apuntan al estado y temperamento del cerebro {cite:canon-ibn-sina-print-v2 pp.11-13}"
  fr: "Ibn Sina montre comment les afflictions de la vue, de l'ouïe, de l'odorat, du goût et du toucher, ainsi que l'opacité ou la clarté des sens, indiquent l'état et le tempérament du cerveau {cite:canon-ibn-sina-print-v2 pp.11-13}"
