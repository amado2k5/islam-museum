  en: "Sorrel (hammad)"
  ur: "حماض ⁦(ترشک)⁩"
  es: "Acedera (hammad)"
summary:
  ar: "الحمّاض أصناف كثيرة؛ هو الحميضة بالعامية في هامش المحقق. بارد يابس في الثانية، وفيه قبض، والحامض أقوى، ويُذكر أنه يقمع الصفراء، وله منافع في الجرب المتقرّح والقوابي والأسنان والطحال وسيلان الرحم، ومنه أحكام في العقل وإسهال البزر."
  en: "Hammad has many kinds; the editor's footnote gives the colloquial name humayda (sorrel). It is cold and dry in the second degree, has some binding, and the sour kind is stronger. The book says it checks yellow bile and lists uses for scabies, ulcers, teeth, the spleen and flow of the womb. Some claims on the seed are labelled."
  ur: "حماض کی کئی قسمیں ہیں؛ محقق کے حاشیے میں اسے عامی زبان میں حمیضہ کہا گیا ہے۔ یہ دوسرے درجے میں ٹھنڈا اور خشک ہے، اس میں کسیلاپن ہے، اور کھٹی قسم زیادہ قوی ہے۔ کتاب کہتی ہے کہ یہ صفرا کو دباتا ہے، اور اس کے فوائد جرب کے زخموں، قوابی، دانتوں، تلی اور رحم کے بہاؤ میں درج کرتی ہے۔ بیج کے کچھ دعوے مُعلَّم ہیں۔"
  es: "Hammad tiene muchas variedades; la nota al pie del editor indica que se la conoce coloquialmente como humayda (acedera). Es fría y seca en segundo grado, tiene cierta capacidad aglutinante y la variedad ácida es más fuerte. El libro menciona que controla la bilis amarilla y enumera sus usos para la sarna, las úlceras, los dientes, el bazo y el flujo uterino. Algunas afirmaciones sobre la semilla están etiquetadas."
