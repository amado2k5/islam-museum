  id: "Al-Wasi': yang luas dalam pengetahuan, rahmat, dan penyediaan untuk segala sesuatu. Nama nomor 45 dalam daftar yang disebutkan dalam hadis Al-Tirmidhi tentang Nama-nama Allah."
