label: { ar: "تدبير راكب البحر عند ابن سينا", en: "The regimen of the seafarer in the Canon", ur: "سمندری مسافر کی تدبیر قانون میں" }
summary:
  ar: "في الفصل الثامن والأخير من تدبير المسافرين يذكر ابن سينا أن راكب البحر يدور به ويهيج به الغثيان والقيء في أوائل الأيام ثم يهدأ، ويذكر ما يمنع الغثيان من فواكه كالسفرجل والتفاح وبزر الكرفس والأفسنتين، والأغذية الحامضة المقوية لفم المعدة كالعدس بالخل أو بالحصرم، والخبز المبرد في شراب ريحاني {cite:canon-ibn-sina-print-v1 p.266}."
  en: "In the eighth and last chapter of the regimen of travellers Ibn Sina says that the sea traveller turns dizzy and is seized by nausea and vomiting in the first days, then settles; he names what prevents nausea, fruits such as quince and apple, celery seed and wormwood, and sour foods that strengthen the mouth of the stomach, such as lentils with vinegar or with verjuice, and bread cooled in a fragrant wine {cite:canon-ibn-sina-print-v1 p.266}."
