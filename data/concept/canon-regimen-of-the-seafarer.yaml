id: concept/canon-regimen-of-the-seafarer
class: concept
kind: scientific
label:
  ar: "تدبير راكب البحر عند ابن سينا"
  en: "The regimen of the seafarer in the Canon"
  fr: "Régime du voyageur en mer dans le Canon"
  ur: "سمندری مسافر کی تدبیر قانون میں"
  es: "El régimen del marinero en el Canon"
summary:
  ar: "في الفصل الثامن والأخير من تدبير المسافرين يذكر ابن سينا أن راكب البحر يدور به ويهيج به الغثيان والقيء في أوائل الأيام ثم يهدأ، ويذكر ما يمنع الغثيان من فواكه كالسفرجل والتفاح وبزر الكرفس والأفسنتين، والأغذية الحامضة المقوية لفم المعدة كالعدس بالخل أو بالحصرم، والخبز المبرد في شراب ريحاني {cite:canon-ibn-sina-print-v1 p.266}."
  en: "In the eighth and last chapter of the regimen of travellers Ibn Sina says that the sea traveller turns dizzy and is seized by nausea and vomiting in the first days, then settles; he names what prevents nausea, fruits such as quince and apple, celery seed and wormwood, and sour foods that strengthen the mouth of the stomach, such as lentils with vinegar or with verjuice, and bread cooled in a fragrant wine {cite:canon-ibn-sina-print-v1 p.266}."
  fr: "Au huitième et dernier chapitre du régime des voyageurs, Ibn Sina décrit vertiges, nausées et vomissements des premiers jours en mer, puis leur apaisement. Il cite coing, pomme, graine de céleri, absinthe et aliments acides fortifiant l’orifice de l’estomac : lentilles au vinaigre ou verjus, pain refroidi dans un vin parfumé {cite:canon-ibn-sina-print-v1 p.266}."
  es: "En el octavo y último capítulo del régimen de los viajeros, Ibn Sina dice que el viajero marítimo se marea y sufre náuseas y vómitos durante los primeros días, para luego recuperarse; menciona lo que previene las náuseas, frutas como el membrillo y la manzana, las semillas de apio y el ajenjo, y alimentos ácidos que fortalecen la boca del estómago, como las lentejas con vinagre o con agraz, y el pan enfriado en un vino aromático {cite:canon-ibn-sina-print-v1 p.266}."
