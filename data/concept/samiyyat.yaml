id: concept/samiyyat
class: concept
kind: belief
label:
  ar: "السَّمْعِيّات"
  en: "Samiyyat (matters known only through revelation)"
summary:
  ar: "السمعيات الأمور التي يتوقف عليها السمع كالنبوة، أو التي تتوقف على السمع كالمعاد وأسباب السعادة والشقاوة من الإيمان والطاعة والكفر والمعصية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9827} وتدخل فيها أشراط الساعة، وعذاب القبر والبعث، والحساب والكتب والصراط والميزان والشفاعة والحوض والجنة والنار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9827} والحكم الشرعي المتعلق بها قسمان: الإيمان بها وأدلتها، ويفصل في مبحث «إيمان»، وحكم منكرها أو شيء منها وجزاء ذلك، ويفصل في مبحث «ردة». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9827}"
  en: "The samiyyat are matters on which hearing (revelation) depends, such as prophethood, or matters that depend on revelation, such as the return and the causes of felicity and wretchedness through faith, obedience, disbelief and disobedience. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9827} They include the signs of the Hour, the punishment of the grave, resurrection, reckoning, the books, the bridge, the scales, intercession, the Pool, Paradise and Hell. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9827} The ruling on them has two parts: belief in them, their kinds and evidence, treated under the entry on faith; and the ruling on one who denies any of them and its penalty, treated under the entry on apostasy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9827}"
