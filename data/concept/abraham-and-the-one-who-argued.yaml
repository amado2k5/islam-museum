id: concept/abraham-and-the-one-who-argued
class: concept
kind: belief
label: { ar: "إبراهيم والذي حاجّه في ربه", en: "Abraham and the one who argued with him about his Lord", fr: "Abraham et celui qui disputa avec lui au sujet de son Seigneur", ur: "ابراہیم اور وہ شخص جس نے ان سے رب کے بارے میں حجت کی", es: "Abraham y aquel que discutió con él acerca de su Señor", tr: "İbrahim ve Tanrısına ihtiyacı olan", id: "Ibrahim dan siapa yang membutuhkan Tuhannya" }
summary:
  ar: "يقرأ الشعراوي قصة الذي جادل إبراهيم في شأن ربه بأن الفاعل هو المحاجِج وإبراهيم مفعول، ويمتنع عن تعيين اسمه، ويرى أن الإبهام مقصود ليعم كل زمان، ويرد على من عينه، وينقل أن إبراهيم نقل الحجة من الإحياء والإماتة إلى الشمس {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1121} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1123} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1127} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1129}."
  en: "Sha'rawi reads the one who argued with Abraham about his Lord as the agent of the argument, with Abraham as its object. He declines to name him, holds that the vagueness is intended so the lesson applies in every age, and answers those who name him. He reports that Abraham moved the argument from giving life and death to the rising of the sun {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1121} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1123} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1127} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1129}."
  fr: "Sha'rawi considère celui qui disputa avec Abraham au sujet de son Seigneur comme le sujet de la dispute, Abraham en étant l'objet. Il refuse de le nommer, estime que l'indétermination est voulue pour que la leçon s'applique à toutes les époques et répond à ceux qui le nomment. Il rapporte qu'Abraham déplaça l'argumentation du don de la vie et de la mort vers le lever du soleil {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1121} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1123} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1127} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1129}."
  ur: "شعراوی اس شخص کو جس نے ابراہیم سے ان کے رب کے بارے میں حجت کی، حجت کا فاعل مانتے ہیں اور ابراہیم کو مفعول۔ وہ اس کا نام متعین کرنے سے رکتے ہیں، کہتے ہیں کہ یہ ابہام مقصود ہے تاکہ سبق ہر زمانے میں لاگو ہو، اور نام بتانے والوں کو جواب دیتے ہیں۔ ابراہیم نے حجت زندگی اور موت سے سورج کے طلوع کی طرف منتقل کی {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1121} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1123} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1127} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1129}۔"
  es: "Sha'rawi interpreta a quien discutió con Abraham acerca de su Señor como el agente de la discusión, con Abraham como objeto de la misma. Se niega a nombrarlo, sostiene que la vaguedad es intencionada para que la lección sea aplicable en todas las épocas, y responde a quienes lo nombran. Relata que Abraham trasladó la discusión de dar la vida y la muerte a la salida del sol {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1121} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1123} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1127} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1129}."
  tr: "El-Şaarawi, İbrahim ile Rab'bi hakkında tartışan kişinin hikayesini okur; yapanın nesne, İbrahim'in ise nesne olduğunu iddia eder ve adını belirtmekten kaçınır. Bu belirsizliğin tüm zamanlara nüfuz etmek ve onu atayanlara yanıt vermek için olduğunu düşünür. İbrahim'in diriliş ve ölümden kanıtı güneşe aktardığını bildirir {cite:tafsir-sharawi-khawatir-scan-vol-2 s.1121} {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1123} {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1127} {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1129}."
  id: "Al-Shaarawi membaca kisah orang yang berdebat dengan Abraham tentang Tuhannya, mengklaim bahwa pelaku adalah objek dan Abraham adalah objeknya, dan ia menahan diri untuk tidak menyebutkan namanya. Ia percaya bahwa kegelapan itu dimaksudkan untuk meresap ke seluruh zaman dan menanggapi mereka yang mengangkatnya. Ia melaporkan bahwa Abraham memindahkan bukti dari kebangkitan dan kematian ke matahari {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1121} {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1123} {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1127} {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 hlm.1129}."
