id: concept/abraham-and-the-one-who-argued
class: concept
kind: belief
label: { ar: "إبراهيم والذي حاجّه في ربه", en: "Abraham and the one who argued with him about his Lord", ur: "ابراہیم اور وہ شخص جس نے ان سے رب کے بارے میں حجت کی" }
summary:
  ar: "يقرأ الشعراوي قصة الذي جادل إبراهيم في شأن ربه بأن الفاعل هو المحاجِج وإبراهيم مفعول، ويمتنع عن تعيين اسمه، ويرى أن الإبهام مقصود ليعم كل زمان، ويرد على من عينه، وينقل أن إبراهيم نقل الحجة من الإحياء والإماتة إلى الشمس {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1121} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1123} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1127} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1129}."
  en: "Sha'rawi reads the one who argued with Abraham about his Lord as the agent of the argument, with Abraham as its object. He declines to name him, holds that the vagueness is intended so the lesson applies in every age, and answers those who name him. He reports that Abraham moved the argument from giving life and death to the rising of the sun {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1121} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1123} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1127} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1129}."
  ur: "شعراوی اس شخص کو جس نے ابراہیم سے ان کے رب کے بارے میں حجت کی، حجت کا فاعل مانتے ہیں اور ابراہیم کو مفعول۔ وہ اس کا نام متعین کرنے سے رکتے ہیں، کہتے ہیں کہ یہ ابہام مقصود ہے تاکہ سبق ہر زمانے میں لاگو ہو، اور نام بتانے والوں کو جواب دیتے ہیں۔ ابراہیم نے حجت زندگی اور موت سے سورج کے طلوع کی طرف منتقل کی {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1121} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1123} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1127} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1129}۔"
