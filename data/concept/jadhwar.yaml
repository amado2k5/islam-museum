summary:
  ar: "قطع تشبه الزراوند وأدق منه وفي قوته وأفضل منه، ينبت مع البيش ويضعف نبات البيش بجواره. وينقل المؤلف رأي ابن ماسرجويه بأنه في فعله كالدرونج وأضعف منه، ويرد على ذلك بأن ابن ماسرجويه لا رواية مأثورة له في هذا. وهو من أجزاء ترياق السموم، وبدله الزرنباد {cite:canon-ibn-sina-print-v1 p.429}."
  en: "Pieces like zarawand but finer and of the same strength, better than it. It grows with bish and weakens the bish plant beside it. Ibn Masarjawayh is cited as saying it acts like daronj but weaker; the author disputes this. It is a part of the theriac against all poisons, and zarnabad is given as a substitute {cite:canon-ibn-sina-print-v1 p.429}."
  ur: "زراوند سے مشابہ قطعے جو اس سے باریک اور قوت میں اس کے برابر، بلکہ اس سے بہتر ہیں۔ یہ بیش کے ساتھ اگتا ہے اور اپنے قریب کے بیش کو کمزور کرتا ہے۔ ابن ماسرجویہ کا قول نقل ہوا ہے کہ یہ درونج جیسا ہے مگر اس سے کمزور؛ مصنف اس سے اختلاف کرتا ہے۔ یہ تمام زہروں کے ترياق کا جزو ہے، اور اس کا بدل زرنباد ہے {cite:canon-ibn-sina-print-v1 p.429}۔"
  es: "Piezas parecidas al zarawand, pero más finas y de la misma potencia, incluso mejores. Crece junto al bish y debilita la planta de bish que está a su lado. Se cita a Ibn Masarjawayh diciendo que actúa como el daronj, pero más débil; el autor lo refuta. Forma parte de la teriaca contra todos los venenos, y se da el zarnabad como sustituto {cite:canon-ibn-sina-print-v1 p.429}."
  fr: "Des morceaux semblables au zarawand, mais plus fins et d'une force équivalente, voire supérieure. Il pousse avec le bish et affaiblit la plante voisine. Ibn Masarjawayh aurait dit qu'il agissait comme le daronj, mais en moindre quantité; l'auteur conteste cette affirmation. Il entre dans la composition de la thériaque contre tous les poisons, et le zarnabad est proposé comme substitut {cite:canon-ibn-sina-print-v1 p.429}."
  tr: "Zarrawand'a benzeyen parçalar, onlardan daha ince, daha güçlü ve daha iyidir, çalılıkla birlikte büyür ve yakındaki Bushweed bitkisini zayıflatır. Yazar, işlev olarak salya gibi ve ondan daha zayıf olduğu İbn Masarjouyeh'in görüşünü aktarır ve İbn Masarjouyeh'in bu konuda aktarılmış bir anlatımı olmadığını belirtir. Zehirlere karşı panzehirin bir parçasıdır ve Zarnabad {cite:canon-ibn-sina-print-v1 s.429} onun yerini almıştır."
  id: "Potongan-potongan yang menyerupai Zarrawand, lebih halus, kuat, dan lebih baik dari mereka, tumbuh bersama Semak, dan melemahkan tanaman Bushweed di sekitarnya. Penulis mengutip pendapat Ibn Masarjouyeh bahwa dalam fungsinya tanaman ini seperti air liur dan lebih lemah darinya, dan ia menjawab bahwa Ibn Masarjouyeh tidak memiliki narasi yang ditransmisikan mengenai hal ini. Itu adalah bagian dari penawar racun, dan Zarnabad {cite:canon-ibn-sina-print-v1 hlm.429} menggantikannya."
