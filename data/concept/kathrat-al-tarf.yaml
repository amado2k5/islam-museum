label:
  ar: "كثرة الطرف"
  en: "Frequent blinking (kathrat al-tarf)"
  ur: "جھپکاؤ کی کثرت"
  es: "Parpadeo frecuente (kathrat al-tarf)"
  fr: "Clignements fréquents (Kathrat al-tarf)"
  tr: "polipoliz"
  id: "polisisis"
summary:
  ar: "كثرة الطرف تكون من قذى خفيف في العين، وتكون من بثر، وقد تكثر في أصحاب التمدد والمتهيئين له، وتندر في الأمراض الحادة بتمدد وتشنج {cite:canon-ibn-sina-print-v2 p.199}"
  en: "Frequent blinking comes from a light mote in the eye or from pustules; it may be frequent in those prone to stretching of the parts and is rare in acute diseases, with stretching and convulsion {cite:canon-ibn-sina-print-v2 p.199}"
  ur: "جھپکاؤ کی کثرت آنکھ میں ہلکے ذرے یا دانوں سے ہوتی ہے؛ اور تاؤ کے مزاج والوں اور اس کے مستعدوں میں زیادہ ہو سکتی ہے، اور حاد امراض میں تاؤ اور تشنج کے ساتھ کم ہوتی ہے {cite:canon-ibn-sina-print-v2 p.199}۔"
  es: "El parpadeo frecuente se debe a una pequeña partícula en el ojo o a pústulas; puede ser frecuente en quienes son propensos al estiramiento de las partes y es raro en enfermedades agudas, con estiramiento y convulsiones {cite:canon-ibn-sina-print-v2 p.199}"
  fr: "Un clignement fréquent des yeux peut être dû à une petite particule dans l'œil ou à des pustules; il peut être fréquent chez les personnes sujettes à l'étirement des parties du corps et est rare dans les maladies aiguës, avec étirement et convulsions {cite:canon-ibn-sina-print-v2 p.199}"
  tr: "Aşırı göz iltihabı, gözde hafif bir enfeksiyondan kaynaklanır ve genişlemeye yatkın olanlarda ve genişlemeye yatkın olanlarda yaygındır; ayrıca genişleme ve spazm içeren akut hastalıklarda nadirdir {cite:canon-ibn-sina-print-v2 s.199}"
  id: "Peradangan mata berlebihan terjadi dari peradangan ringan di mata, dan dapat umum pada mereka yang memiliki dan yang rentan terhadap dilatasi, serta jarang terjadi pada penyakit akut dengan dilatasi dan kejang {cite:canon-ibn-sina-print-v2 hlm.199}"
