label:
  ar: "الطير"
  en: "The birds"
  ur: "پرندے"
summary:
  ar: "الطير في القرآن جند لسليمان وآية في أكناف السماء لا يمسكهن إلا الرحمن وهنّ أمم أمثالكم يسبّحن الله، وأبراه عيسى من الطين كهيئة الطير فنفخ فيه فصار طيراً بإذن الله، وأمر الله إبراهيم أن يجزّئ أربعة من الطير على الجبال ثم دعاهنّ فأتينه سعياً."
  en: "Birds in the Quran are Solomon's host and a sign overhead — nothing holds them up but the Merciful — communities like yours glorifying God. Jesus shaped a bird from clay and breathed into it by God's leave, and Abraham scattered four birds over the hills then called them and they came flying."
  ur: "قرآن میں پرندے سلیمان کا لشکر اور آسمان کی چھیو میں نشانی ہیں — انہیں رحمان کے سوا کوئی تھامے نہیں — تمہاری مانند امتیں جو اللہ کی تسبیح کرتی ہیں۔ عیسیٰ نے مٹی کا پرندہ بنایا اور پھونک ماری تو الله کے حکم سے پرندہ ہو گیا، اور ابراہیم نے چار پرندوں کو پہاڑوں پر بانٹ کر پکارا تو وہ دوڑے آئے۔"
