label:
  ar: "الطير"
  en: "The birds"
  ur: "پرندے"
  es: "Los pájaros"
  fr: "Les oiseaux"
  tr: "kuş"
  id: "burung"
summary:
  ar: "الطير في القرآن جند لسليمان وآية في أكناف السماء لا يمسكهن إلا الرحمن وهنّ أمم أمثالكم يسبّحن الله، وأبراه عيسى من الطين كهيئة الطير فنفخ فيه فصار طيراً بإذن الله، وأمر الله إبراهيم أن يجزّئ أربعة من الطير على الجبال ثم دعاهنّ فأتينه سعياً."
  en: "Birds in the Quran are Solomon's host and a sign overhead — nothing holds them up but the Merciful — communities like yours glorifying God. Jesus shaped a bird from clay and breathed into it by God's leave, and Abraham scattered four birds over the hills then called them and they came flying."
  ur: "قرآن میں پرندے سلیمان کا لشکر اور آسمان کی چھیو میں نشانی ہیں — انہیں رحمان کے سوا کوئی تھامے نہیں — تمہاری مانند امتیں جو اللہ کی تسبیح کرتی ہیں۔ عیسیٰ نے مٹی کا پرندہ بنایا اور پھونک ماری تو الله کے حکم سے پرندہ ہو گیا، اور ابراہیم نے چار پرندوں کو پہاڑوں پر بانٹ کر پکارا تو وہ دوڑے آئے۔"
  es: "En el Corán, las aves son el ejército de Salomón y una señal divina: nada las sostiene sino el Misericordioso. Comunidades como la vuestra glorifican a Dios. Jesús modeló un pájaro de arcilla y le insufló vida con el permiso de Dios, y Abraham esparció cuatro aves sobre las colinas, las llamó y vinieron volando."
  fr: "Dans le Coran, les oiseaux symbolisent l'armée de Salomon et un signe céleste; seuls les Miséricordieux les soutiennent, symbolisant ainsi des communautés comme la vôtre qui glorifient Dieu. Jésus façonna un oiseau d'argile et, par la permission de Dieu, insuffla en lui la puissance d'un oiseau. Abraham, quant à lui, dispersa quatre oiseaux sur les collines, les appela et ils vinrent s'envoler."
  tr: "Kur'an'daki kuşlar Süleyman'ın askerleridir ve gökyüzünün kenarlarında yalnızca Merhametli'nin onları tutabileceğine dair bir işaret vardır. Onlar sizin gibi Allah'ı yücelten milletlerdir. İsa onu kilden bir kuş gibi iyileştirdi ve içine üfledi, böylece Allah'ın izniyle kuş oldu. Allah, İbrahim'e dağlarda dört kuşu bölmesini emretti, sonra onları çağırdı ve Sa'i'de yanına geldi."
  id: "Burung-burung dalam Al-Qur'an adalah prajurit Salomo, dan ada tanda di tepi langit bahwa hanya Yang Maha Penyayang yang dapat menahan mereka. Mereka adalah bangsa-bangsa seperti kamu yang memuliakan Tuhan. Yesus menyembuhkannya dari tanah liat seperti burung dan menghembuskan napas ke dalamnya, sehingga dia menjadi burung atas izin Tuhan. Tuhan memerintahkan Abraham untuk membelah empat burung di gunung, lalu memanggilnya dan datang kepada-Nya dalam Sa'i."
