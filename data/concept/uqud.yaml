label: { ar: "العقود", en: "Contracts (al-'uqud)" }
issue:
  ar: "ما الذي يلزم الوفاء به من العقود، وهل تنعقد العقود المكتوبة بغير إيجاب وقبول لفظيين؟"
summary:
  ar: "الوفاء بالعقود كما يعرضه رشيد رضا في تفسير أول سورة المائدة. ينقل معاني العقود عن ابن عباس وقتادة وغيرهما، ويعرض تقسيم الراغب الأصفهاني للعقود إلى ما يجب الوفاء به وما يستحب وما يستحب تركه وما يحرم الوفاء به، ويقرر أن ظاهر الآية يشمل كل عقد مشروع. ثم يصف رضا فريقاً ممن يشترط الإيجاب والقبول لفظاً فلا يعد العقد المكتوب نافذاً، ويعيب على من يجعل الوفاء بعقد مباح معصية بناء على ذلك. وهذا نقد رضا، ويُعرض هنا مع الرأي الذي ينتقده."
