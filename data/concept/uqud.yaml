label: { ar: "العقود", en: "Contracts (al-'uqud)", es: "Contratos (al-'uqud)", fr: "Contrats (al-'uqud)", ur: "معاہدے ⁦(العقود)⁩" }
issue:
  ar: "ما الذي يلزم الوفاء به من العقود، وهل تنعقد العقود المكتوبة بغير إيجاب وقبول لفظيين؟"
summary:
  ar: "الوفاء بالعقود كما يعرضه رشيد رضا في تفسير أول سورة المائدة. ينقل معاني العقود عن ابن عباس وقتادة وغيرهما، ويعرض تقسيم الراغب الأصفهاني للعقود إلى ما يجب الوفاء به وما يستحب وما يستحب تركه وما يحرم الوفاء به، ويقرر أن ظاهر الآية يشمل كل عقد مشروع. ثم يصف رضا فريقاً ممن يشترط الإيجاب والقبول لفظاً فلا يعد العقد المكتوب نافذاً، ويعيب على من يجعل الوفاء بعقد مباح معصية بناء على ذلك. وهذا نقد رضا، ويُعرض هنا مع الرأي الذي ينتقده."
  en: "Fulfilling contracts, as Rashid Rida presents it in his commentary on the opening of Surat al-Ma'ida. He gives the meanings of “contracts” from Ibn Abbas, Qatada and others, and sets out al-Raghib al-Isfahani's division of contracts into what must be fulfilled, what is recommended, what is recommended to leave, and what must not be fulfilled; he holds that the apparent sense of the verse covers every lawful contract. Rida then describes a group who require offer and acceptance to be spoken, so that a written contract is not considered binding, and he faults those who on this basis make fulfilling a permitted contract a sin. This is Rida's critique, and it is presented here alongside the view he criticises."
  es: "El cumplimiento de los contratos, tal como lo presenta Rashid Rida en su comentario sobre el inicio de la Sura al-Ma'ida, se expresa a través de las definiciones de «contratos» de Ibn Abbas, Qatada y otros autores. Al-Raghib al-Isfahani divide los contratos en aquellos que deben cumplirse, los que se recomiendan, los que se recomienda dejar de lado y los que no deben cumplirse. Rida sostiene que el sentido aparente del versículo abarca todo contrato lícito. A continuación, describe a un grupo que exige que la oferta y la aceptación sean verbales, de modo que un contrato escrito no se considera vinculante, y critica a quienes, basándose en esto, convierten en pecado el cumplimiento de un contrato permitido. Esta es la crítica de Rida, que se presenta aquí junto con la postura que él mismo critica."
  fr: "L'exécution des contrats, telle que présentée par Rashid Rida dans son commentaire du début de la sourate al-Ma'ida, est abordée. Il expose les définitions du terme « contrat » selon Ibn Abbas, Qatada et d'autres, et reprend la classification des contrats établie par al-Raghib al-Isfahani: contrats obligatoires, contrats recommandés, contrats à éviter et contrats à ne pas exécuter. Selon lui, le sens apparent du verset englobe tout contrat licite. Rida décrit ensuite un groupe qui exige que l'offre et l'acceptation soient verbales, de sorte qu'un contrat écrit n'est pas considéré comme contraignant, et il critique ceux qui, sur cette base, érigent en péché l'exécution d'un contrat permis. Telle est la critique de Rida, présentée ici en parallèle avec l'opinion qu'il réfute."
  ur: "معاہدوں کو پورا کرنا، جیسا کہ راشد ردا نے اسے سورۃ المائدہ کے آغاز پر اپنی تفسیر میں پیش کیا ہے۔ وہ ابن عباس، قتادہ اور دیگر سے معاہدوں کے معنی دیتا ہے، اور الرغیب الاصفہانی کے معاہدوں کی تقسیم اس بات پر کرتا ہے کہ کن چیزوں کو پورا کیا جانا چاہیے، کیا سفارش کی گئی ہے، کن چیزوں کو چھوڑنے کی سفارش کی گئی ہے، اور کن چیزوں کو پورا نہیں کیا جانا چاہیے۔ اس کا خیال ہے کہ آیت کا ظاہری مفہوم ہر جائز معاہدے کا احاطہ کرتا ہے۔ اس کے بعد ردا ایک ایسے گروہ کی وضاحت کرتا ہے جس کو پیش کش اور قبولیت کی ضرورت ہوتی ہے، تاکہ تحریری معاہدے کو پابند نہ سمجھا جائے، اور وہ ان لوگوں کو قصوروار ٹھہراتا ہے جو اس بنیاد پر اجازت یافتہ معاہدے کو پورا کرنے کو گناہ قرار دیتے ہیں۔ یہ ردا کی تنقید ہے، اور اسے یہاں اس نقطہ نظر کے ساتھ پیش کیا گیا ہے جس پر وہ تنقید کرتا ہے۔"
