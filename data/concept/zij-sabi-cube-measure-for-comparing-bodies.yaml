id: concept/zij-sabi-cube-measure-for-comparing-bodies
class: concept
kind: scientific
label: { ar: "المكعب مقياساً لمقارنة أحجام الأجرام", en: "The cube as a measure for comparing the volumes of bodies", ur: "اجرام کے حجم کے موازنے کے لیے مکعب", es: "El cubo como medida para comparar los volúmenes de los cuerpos.", fr: "Le cube comme unité de mesure pour comparer les volumes des corps", tr: "Küp, nesnelerin boyutlarını karşılaştırmak için kullanılan bir ölçektir.", id: "Kubus adalah alat ukur untuk membandingkan ukuran benda." }
summary:
  ar: "يستعمل البتاني المكعب، أي حاصل ضرب الطول في العرض في العمق، لمقارنة أحجام الأجرام: فيبيّن أن جرم الشمس يساوي نحو مائة وست وستين مرة وربعاً وثُمناً من حجم الأرض، ويقارن كذلك بالقمر. {cite:zij-sabi-nallino-byblion p.90}."
  en: "Al-Battani uses the cube, that is length times breadth times depth, to compare the volumes of bodies. He shows that the Sun's body is about one hundred and sixty-six and three eighths times the Earth's volume, and compares it with the Moon in the same way. {cite:zij-sabi-nallino-byblion p.90}."
  ur: "البتانی مکعب، یعنی لمبائی ضرب چوڑائی ضرب گہرائی، سے اجرام کے حجم کا موازنہ کرتے ہیں۔ وہ دکھاتے ہیں کہ سورج کا جرم زمین کے حجم کا تقریباً ایک سو چھیاسٹھ اور تین اٹھویں گنا ہے، اور اسی طرح چاند سے بھی موازنہ کرتے ہیں۔ {cite:zij-sabi-nallino-byblion p.90}۔"
  es: "Al-Battani utiliza el cubo, es decir, longitud por anchura por profundidad, para comparar los volúmenes de los cuerpos. Demuestra que el cuerpo del Sol tiene un volumen aproximadamente ciento sesenta y seis y tres octavos mayor que el de la Tierra, y lo compara con el de la Luna de la misma manera. {cite:zij-sabi-nallino-byblion p.90}."
  fr: "Al-Battani utilise le cube, c'est-à-dire la longueur multipliée par la largeur multipliée par la profondeur, pour comparer les volumes des corps. Il montre que le volume du Soleil est environ cent soixante-six et trois huitièmes celui de la Terre, et le compare de la même manière à celui de la Lune. {cite:zij-sabi-nallino-byblion p.90}."
  tr: "El-Battani, gök cisimlerinin boyutlarını karşılaştırmak için küpü, yani uzunluk, genişlik ve derinliğin çarpımını kullanır: Güneşin boyutunun Dünya'nın boyutunun yaklaşık yüz altmış altı, çeyrek ve sekizde biri olduğunu gösterir ve ayrıca onu Ay ile de karşılaştırır. {cite:zij-sabi-nallino-byblion s.90}."
  id: "Al-Battani menggunakan kubus, yaitu hasil perkalian panjang, lebar, dan kedalaman, untuk membandingkan ukuran benda-benda langit: ia menunjukkan bahwa ukuran matahari sekitar seratus enam puluh enam seperempat dan seperdelapan kali ukuran bumi, dan ia juga membandingkannya dengan bulan. {cite:zij-sabi-nallino-byblion p.90}."
