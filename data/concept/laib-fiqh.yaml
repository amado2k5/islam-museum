id: concept/laib-fiqh
class: concept
kind: legal
label:
  ar: "اللَّعِب"
  en: "Play (la'ib), fiqh rulings"
  ur: "کھیل (لعب، فقہی احکام)"
summary:
  ar: "اللعب في اللغة ضد الجد، وهو أن يفعل الإنسان فعلاً لا يقصد به مقصداً صحيحاً، ولعب عمل عملاً لا يجدي نفعاً؛ وقيل هو عمل للذة لا تراعى فيه الحكمة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13638}. والصلة بينه وبين اللهو أن اللهو لعب لا يعقب نفعاً، وقد يكون اللعب للتأديب كاللعب بالشطرنج {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13639}."
  en: "Playing, la'b, in lexicon is the opposite of seriousness: doing something without a right purpose; some define it as an act for pleasure that does not consider wisdom. Its link to lahw is that all lahw is play, but play is not always lahw, since play can be for discipline, such as chess {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13638} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13639}."
  ur: "لعب لغت میں سنجیدگی کی ضد ہے، یعنی ایسا کام کرنا جس سے کوئی صحیح مقصد مراد نہ ہو؛ اور بعض نے کہا کہ یہ لذت کے لیے ایسا عمل ہے جس میں حکمت کا لحاظ نہ ہو۔ لہو سے اس کا تعلق یہ ہے کہ ہر لہو لعب ہے، مگر ہر لعب لہو نہیں، کیونکہ لعب تادیب کے لیے بھی ہو سکتا ہے، جیسے شطرنج {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13638} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13639}۔"
