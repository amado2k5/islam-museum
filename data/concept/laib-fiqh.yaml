label:
  ar: "اللَّعِب"
  en: "Play (la'ib), fiqh rulings"
  ur: "کھیل ⁦(لعب، فقہی احکام)⁩"
  es: "Juego (la'ib), decisiones de fiqh"
  fr: "Jeu (la'ib), décisions fiqh"
  tr: "Oynanış"
  id: "Gameplay"
summary:
  ar: "اللعب في اللغة ضد الجد، وهو أن يفعل الإنسان فعلاً لا يقصد به مقصداً صحيحاً، ولعب عمل عملاً لا يجدي نفعاً؛ وقيل هو عمل للذة لا تراعى فيه الحكمة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13638}. والصلة بينه وبين اللهو أن اللهو لعب لا يعقب نفعاً، وقد يكون اللعب للتأديب كاللعب بالشطرنج {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13639}."
  en: "Playing, la'b, in lexicon is the opposite of seriousness: doing something without a right purpose; some define it as an act for pleasure that does not consider wisdom. Its link to lahw is that all lahw is play, but play is not always lahw, since play can be for discipline, such as chess {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13638} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13639}."
  ur: "لعب لغت میں سنجیدگی کی ضد ہے، یعنی ایسا کام کرنا جس سے کوئی صحیح مقصد مراد نہ ہو؛ اور بعض نے کہا کہ یہ لذت کے لیے ایسا عمل ہے جس میں حکمت کا لحاظ نہ ہو۔ لہو سے اس کا تعلق یہ ہے کہ ہر لہو لعب ہے، مگر ہر لعب لہو نہیں، کیونکہ لعب تادیب کے لیے بھی ہو سکتا ہے، جیسے شطرنج {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13638} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13639}۔"
  es: "Jugar, la'b, en el léxico es lo opuesto a la seriedad: hacer algo sin un propósito correcto; algunos lo definen como un acto de placer que no considera la sabiduría. Su vínculo con lahw es que todo lahw es juego, pero el juego no siempre es lahw, ya que el juego puede ser para disciplinar, como el ajedrez {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13638} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13639}."
  fr: "Dans le lexique, le jeu (la'b) est l'opposé du sérieux: faire quelque chose sans but précis; certains le définissent comme un acte de plaisir qui ne tient pas compte de la sagesse. Son lien avec le lahw réside dans le fait que tout lahw est jeu, mais le jeu n'est pas toujours lahw, car il peut servir la discipline, comme aux échecs {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13638} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13639}."
  tr: "Dil açısından oyun, ciddiyetin tam tersidir; yani bir kişinin uygun niyet olmadan bir eylem yapması ve kimseye fayda sağlamayan bir eylem oynamasıdır; ayrıca, bilgelik dikkate alınmadan zevk için yapılan bir eylem olduğu da söylenir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13638}. Eğlence ile arasındaki bağlantı, eğlencenin fayda sağlamayan bir oyun olmasıdır ve disiplin için oynamanın satranç oynamak gibi olabileceğidir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13639}."
  id: "Dalam bahasa, bermain adalah kebalikan dari keseriusan, yaitu ketika seseorang melakukan suatu tindakan tanpa niat yang tepat, dan melakukan tindakan yang tidak menguntungkan siapa pun; juga dikatakan bahwa itu adalah tindakan untuk kesenangan tanpa mempertimbangkan kebijaksanaan {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13638}. Hubungan antara itu dan hiburan adalah bahwa hiburan adalah permainan yang tidak menghasilkan manfaat, dan bermain untuk disiplin bisa seperti bermain catur {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13639}."
