label: { ar: "المرأة", en: "Imra' (woman: her rights, duties and status in fiqh)", es: "Imra' (la mujer: sus derechos, deberes y estatus en el fiqh)", fr: "Imra' (la femme: ses droits, ses devoirs et son statut en fiqh)", ur: "عمرہ ⁦(عورت: فقہ میں اس کے حقوق، فرائض اور حیثیت)⁩" }
summary:
  ar: "المرأة هي الأنثى البالغة، وتختص بعض الأحكام بها كالإرث والشهادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3385} وللمرأة حق الرعاية والتعليم، وإذا رشدت كانت لها ذمة مالية مستقلة، ولا تزوج إلا برضاها، ويجب عليها التستر وعدم الاختلاط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3385}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3386} وهي مكلفة بالتكاليف الشرعية مع اختلاف في بعض هيئات العبادة، ولها الحيض والحمل والولادة، وهي لا تتولى الإمارة والقضاء في الجملة، ولا يجب عليها الجهاد، وشهادتها على النصف من شهادة الرجل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3385}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3386} والرجل قوّام عليها، ونفقتها على زوجها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3386}"
  en: "Imra' is the adult female, and some rulings apply to her specifically, such as shares of inheritance and testimony. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3385} A woman has a right to care and education; once she has judgement she has an independent financial standing, is not married without her consent, and must cover herself and avoid mixing with men. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3385}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3386} She is bound by the Law, with some differences in forms of worship; she has menstruation, pregnancy and childbirth; in general she does not hold the rule of amirate or judgeship, is not bound to jihad, and her testimony is half a man's. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3385}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3386} The man is in charge of her, and her maintenance is due from her husband. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3386}"
  es: "Imra' es la mujer adulta, y algunas normas se aplican específicamente a ella, como las partes de la herencia y el testimonio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3385} Una mujer tiene derecho a la atención y la educación; una vez que tiene juicio tiene una posición financiera independiente, no se casa sin su consentimiento y debe cubrirse y evitar mezclarse con hombres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3385}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3386} Está sujeta a la Ley, con algunas diferencias en las formas de culto; tiene menstruación, embarazo y parto; en general no ostenta el gobierno de emirato o juez, no está obligada a la yihad y su testimonio es la mitad del de un hombre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3385}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3386} El hombre está a cargo de ella y su manutención la debe su marido. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3386}"
  fr: "L'Imra' désigne la femme adulte, et certaines règles lui sont spécifiquement applicables, notamment en matière d'héritage et de témoignage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3385} La femme a droit aux soins et à l'éducation; une fois majeure, elle dispose d'une indépendance financière, ne peut être mariée sans son consentement, et doit se couvrir et éviter tout contact avec les hommes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3385}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3386} Elle est soumise à la Loi, avec quelques différences dans les pratiques religieuses; elle a ses menstruations, la possibilité d'une grossesse et d'un accouchement; en général, elle n'a pas la charge d'émirat ni de juge, n'est pas tenue au jihad, et son témoignage vaut la moitié de celui d'un homme. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3385}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3386} L'homme s'occupe d'elle et son entretien est dû à son mari. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.3386}"
  ur: "عمارہ بالغ عورت ہے، اور اس پر بعض احکام لاگو ہوتے ہیں، جیسے وراثت اور گواہی کے حصے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3385} عورت کو دیکھ بھال اور تعلیم کا حق ہے۔ ایک بار جب وہ فیصلہ کر لیتی ہے تو وہ ایک آزاد مالی حیثیت رکھتی ہے، اس کی رضامندی کے بغیر شادی نہیں کی جاتی ہے، اور اسے خود کو ڈھانپنا چاہیے اور مردوں کے ساتھ گھل مل جانے سے گریز کرنا چاہیے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3385}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3386} وہ قانون کی پابند ہے، عبادت کی شکلوں میں کچھ اختلافات کے ساتھ؛ اسے حیض، حمل اور ولادت ہے؛ عام طور پر وہ امارت یا قاضی کی حکمرانی نہیں رکھتی ہے، جہاد کی پابند نہیں ہے، اور اس کی گواہی آدھے آدمی کی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3385}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3386} مرد اس کا ذمہ دار ہے، اور اس کی کفالت اس کے شوہر پر ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 3386}"
