label: { ar: "المرأة", en: "Imra' (woman: her rights, duties and status in fiqh)" }
summary:
  ar: "المرأة هي الأنثى البالغة، وتختص بعض الأحكام بها كالإرث والشهادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3385} وللمرأة حق الرعاية والتعليم، وإذا رشدت كانت لها ذمة مالية مستقلة، ولا تزوج إلا برضاها، ويجب عليها التستر وعدم الاختلاط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3385}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3386} وهي مكلفة بالتكاليف الشرعية مع اختلاف في بعض هيئات العبادة، ولها الحيض والحمل والولادة، وهي لا تتولى الإمارة والقضاء في الجملة، ولا يجب عليها الجهاد، وشهادتها على النصف من شهادة الرجل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3385}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3386} والرجل قوّام عليها، ونفقتها على زوجها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3386}"
  en: "Imra' is the adult female, and some rulings apply to her specifically, such as shares of inheritance and testimony. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3385} A woman has a right to care and education; once she has judgement she has an independent financial standing, is not married without her consent, and must cover herself and avoid mixing with men. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3385}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3386} She is bound by the Law, with some differences in forms of worship; she has menstruation, pregnancy and childbirth; in general she does not hold the rule of amirate or judgeship, is not bound to jihad, and her testimony is half a man's. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3385}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3386} The man is in charge of her, and her maintenance is due from her husband. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3386}"
