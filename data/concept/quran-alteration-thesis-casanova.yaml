id: concept/quran-alteration-thesis-casanova
class: concept
kind: term
label: { ar: "أطروحة تبديل القرآن بعد وفاة النبي عند كازانوفا", en: "Casanova's thesis that the Qur'an was altered after the Prophet's death" }
issue:
  ar: "هل تغيّر نص القرآن بعد وفاة النبي؟ وهل تدل آيات القيامة والإمامة على ذلك؟"
summary:
  ar: "أطروحة ينسبها غلاب إلى المستشرق بول كازانوفا في كتابه «محمد ونهاية العالم»: أن النبي كان يعتقد قرب قيام الساعة فلم يعيّن خليفة، وأن أبا بكر ثم عثمان غيّرا آيات من القرآن لتتفق مع ما جرى بعده {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 79} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 90}. يعرض غلاب أدلتها الثلاثة: خلوّ القرآن من أحكام الحكم السياسي، وحديث «بيني وبين الساعة»، وآيات الموت والبعث وآيات «حتى يأتيك اليقين» {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 92} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 104} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 114}. ويرد غلاب بأن رسالة النبي دينية، وبأن القرآن يأمر بالشورى، وبأن الحديث تشبيه للقرب لا تحديد لوقت، وبأن لفظ اليقين يعني الموت {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 97} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 107} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 124}. هذه قراءة الكتاب، وقد ينسب بعض رأيه إلى غلاب نفسه."
  en: "A thesis that Ghallab attributes to the orientalist Paul Casanova in his book “Muhammad and the End of the World”: that the Prophet believed the Hour was near and so did not appoint a successor, and that Abu Bakr and then Uthman altered verses of the Qur'an to fit what followed {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 79} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 90}. Ghallab sets out the three arguments: the Qur'an's silence on the rules of political rule, the hadith of “between me and the Hour”, and the verses on death and resurrection together with the verses on certainty {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 92} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 104} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 114}. He replies that the Prophet's mission was religious, that the Qur'an enjoins consultation, that the hadith is a comparison of nearness and not a fixing of a time, and that the word certainty means death {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 97} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 107} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 124}. This is the book's reading, and some of its view may be attributed to Ghallab himself."
perspectives:
  - tradition: sunni
    id: ghallab-rejects-alteration
    stance:
      ar: "القرآن الذي بين أيدينا هو ما نزل، وأطروحة التبديل لا تثبت بالأدلة التي ساقها كازانوفا"
    summary:
      ar: "يرى غلاب أن ما ساقه كازانوفا فروض وروايات لا تثبت، وأن سكوت القرآن عن نظام الحكم لا يدل على تبديل، لأن رسالة النبي دينية والشورى مأمور بها {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 96} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 98}. هذا رأي غلاب، ويُنسب هنا إليه."
