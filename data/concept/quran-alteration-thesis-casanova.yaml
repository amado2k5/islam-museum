id: concept/quran-alteration-thesis-casanova
class: concept
kind: term
label: { ar: "أطروحة تبديل القرآن بعد وفاة النبي عند كازانوفا", en: "Casanova's thesis that the Qur'an was altered after the Prophet's death", es: "La tesis de Casanova de que el Corán fue alterado después de la muerte del Profeta.", fr: "La thèse de Casanova selon laquelle le Coran a été altéré après la mort du Prophète", ur: "کاسانووا کا مقالہ کہ قرآن میں پیغمبر کی وفات کے بعد تبدیلی کی گئی۔" }
issue:
  ar: "هل تغيّر نص القرآن بعد وفاة النبي؟ وهل تدل آيات القيامة والإمامة على ذلك؟"
summary:
  ar: "أطروحة ينسبها غلاب إلى المستشرق بول كازانوفا في كتابه «محمد ونهاية العالم»: أن النبي كان يعتقد قرب قيام الساعة فلم يعيّن خليفة، وأن أبا بكر ثم عثمان غيّرا آيات من القرآن لتتفق مع ما جرى بعده {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 79} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 90}. يعرض غلاب أدلتها الثلاثة: خلوّ القرآن من أحكام الحكم السياسي، وحديث «بيني وبين الساعة»، وآيات الموت والبعث وآيات «حتى يأتيك اليقين» {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 92} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 104} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 114}. ويرد غلاب بأن رسالة النبي دينية، وبأن القرآن يأمر بالشورى، وبأن الحديث تشبيه للقرب لا تحديد لوقت، وبأن لفظ اليقين يعني الموت {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 97} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 107} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 124}. هذه قراءة الكتاب، وقد ينسب بعض رأيه إلى غلاب نفسه."
  en: "A thesis that Ghallab attributes to the orientalist Paul Casanova in his book “Muhammad and the End of the World”: that the Prophet believed the Hour was near and so did not appoint a successor, and that Abu Bakr and then Uthman altered verses of the Qur'an to fit what followed {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 79} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 90}. Ghallab sets out the three arguments: the Qur'an's silence on the rules of political rule, the hadith of “between me and the Hour”, and the verses on death and resurrection together with the verses on certainty {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 92} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 104} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 114}. He replies that the Prophet's mission was religious, that the Qur'an enjoins consultation, that the hadith is a comparison of nearness and not a fixing of a time, and that the word certainty means death {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 97} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 107} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 124}. This is the book's reading, and some of its view may be attributed to Ghallab himself."
  es: "Una tesis que Ghallab atribuye al orientalista Paul Casanova en su libro “Mahoma y el fin del mundo”: que el Profeta creía que la Hora estaba cerca y por eso no designó un sucesor, y que Abu Bakr y luego Uthman alteraron versículos del Corán para que encajaran con lo que siguió {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 79} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 90}. Ghallab expone los tres argumentos: el silencio del Corán sobre las reglas del gobierno político, el hadiz de “entre mí y la Hora”, y los versículos sobre la muerte y la resurrección junto con los versículos sobre la certeza {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 92} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 104} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 114}. Responde que la misión del Profeta era religiosa, que el Corán ordena la consulta, que el hadiz es una comparación de cercanía y no una fijación de tiempo, y que la palabra certeza significa muerte {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 97} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 107} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 124}. Esta es la lectura del libro, y parte de su punto de vista puede atribuirse al propio Ghallab."
  fr: "Une thèse que Ghallab attribue à l'orientaliste Paul Casanova dans son ouvrage « Muhammad et la fin du monde »: le Prophète croyait l'Heure proche et n'aurait donc pas désigné de successeur, et Abou Bakr puis Othman auraient modifié des versets du Coran pour les adapter aux événements ultérieurs (voir: al-islam-kama-yarahu-al-urubiyyun-azhar, p. 79 et p. 90). Ghallab présente trois arguments: le silence du Coran sur les règles du pouvoir politique, le hadith « entre moi et l'Heure », et les versets sur la mort et la résurrection, ainsi que ceux sur la certitude (voir: al-islam-kama-yarahu-al-urubiyyun-azhar, p. 92 et p. 93). 104} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 114}. Il répond que la mission du Prophète était religieuse, que le Coran enjoint la consultation, que le hadith est une comparaison de proximité et non une fixation de temps, et que le mot certitude signifie la mort {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 97} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 107} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 124}. Telle est l'interprétation du livre, et certains points de vue peuvent être attribués à Ghallab lui-même."
  ur: "ایک مقالہ جو غالب نے اپنی کتاب \"محمد اور دنیا کا خاتمہ\" میں مستشرقین پال کاسانووا سے منسوب کیا ہے: کہ نبی یقین رکھتے تھے کہ قیامت قریب ہے اور اس لیے کوئی جانشین مقرر نہیں کیا، اور یہ کہ ابوبکر اور پھر عثمان نے قرآن کی آیات کو اس کے بعد کے مطابق بدل دیا۔ 79} {حوالہ دیں: الاسلام کما یراحۃ العروبیون ازہر ص۔ 90}۔ غالب نے تین دلائل بیان کیے ہیں: سیاسی حکمرانی کے اصولوں پر قرآن کی خاموشی، حدیث \"میرے اور قیامت کے درمیان\"، اور آیات موت اور قیامت کے ساتھ ساتھ آیات یقین کے ساتھ۔ 92} {حوالہ دیں: الاسلام کما یراحۃ العروبیون ازہر ص۔ 104} {حوالہ دیں: الاسلام کما یراحۃ العروبیون ازہر ص۔ 114}۔ اس نے جواب دیا کہ پیغمبر کا مشن مذہبی تھا، قرآن مشورے کا حکم دیتا ہے، کہ حدیث قرب کا تقابل ہے نہ کہ وقت کا تعین، اور یہ کہ لفظ یقین سے مراد موت ہے۔ 97} {حوالہ دیں: الاسلام کما یراحۃ العروبیون ازہر ص۔ 107} {حوالہ دیں: الاسلام کما یراحۃ العروبیون ازہر ص۔ 124}۔ یہ کتاب کا مطالعہ ہے، اور اس کا کچھ قول خود غالب کی طرف منسوب کیا جا سکتا ہے۔"
