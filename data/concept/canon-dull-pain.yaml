id: concept/canon-dull-pain
class: concept
kind: scientific
label:
  ar: "الوجع الخدر عند ابن سينا"
  en: "Dull pain in the Canon"
  fr: "Douleur sourde dans le Canon"
  ur: "سن کرنے والا درد، قانون کے مطابق"
  es: "Dolor sordo en el Canon"
  tr: "İbn Sina'ya göre uyuşma ağrısı"
  id: "Rasa mati rasa menurut Ibn Sina"
summary:
  ar: "سبب الوجع الخدر عند ابن سينا إما مزاج شديد البرد، وإما انسداد مسام منافذ الروح الحساس الجاري إلى العضو بالعصب، وإما امتلاء الأوعية {cite:canon-ibn-sina-print-v1 p.150}."
  en: "For Ibn Sina dull pain comes from a very cold temperament, from blocked pores in the passages of the sensing spirit running to the organ by a nerve, or from fullness of vessels {cite:canon-ibn-sina-print-v1 p.150}."
  fr: "Pour Ibn Sina, la douleur sourde vient d’un tempérament très froid, de pores obstrués sur les voies de l’esprit sensitif allant à l’organe par un nerf, ou de vaisseaux pleins {cite:canon-ibn-sina-print-v1 p.150}."
  es: "Para Ibn Sina, el dolor sordo proviene de un temperamento muy frío, de poros bloqueados en los conductos del espíritu sensorial que van al órgano por un nervio, o de la congestión de los vasos {cite:canon-ibn-sina-print-v1 p.150}."
  ur: "ابن سینا کے لیے دھیما درد انتہائی سرد مزاج سے ہوتا ہے، اعصاب کے ذریعے اعضاء تک پہنچنے والی حسی روح کے مسدود ہونے سے، یا رگوں کے بھر جانے سے۔"
  tr: "İbn Sina'daki uyuşmanın nedeni ya çok soğuk bir mizaç, sinirlerle organa akan hassas ruh geçitlerinin gözeneklerinin tıkanması ya da damarların dolu olmasıdır {cite:canon-ibn-sina-print-v1 s.150}."
  id: "Penyebab mati rasa pada Ibn Sina adalah temperamen yang sangat dingin, penyumbatan pori-pori saluran jiwa sensitif yang mengalir ke organ dengan saraf, atau pembuluh penuh {cite:canon-ibn-sina-print-v1 hlm.150}."
