id: concept/sinaat-al-kimiya
class: concept
kind: term
label: { ar: "صناعة الكيمياء", en: "The Alchemical Art" }
summary:
  ar: "فصل ابن النديم المقالة العاشرة لأخبار الكيميائيين والصنعويين، ونقل أن أهل صناعة الكيمياء زعموا أن أول من تكلم على علم الصنعة هرمس الحكيم البابلي المنتقل إلى مصر عند افتراق الناس عن بابل وأنه ملك مصر، وزعم أبو بكر الرازي أنه لا يجوز أن يصح علم الفيلسوف ولا يسمى الإنسان فيلسوفا إلا أن يصح له علم صناعة الكيمياء، وقالت طائفة إن ذلك كان بوحي من الله إلى جماعة من أهل الصناعة وقال آخرون بوحي إلى موسى وهارون وأن الذي كان يتولى ذلك قارون، وزعم الرازي أن جماعة من الفلاسفة مثل فيثاغورس وديموقراط وأفلاطون وأرسطاطاليس وجالينوس كانوا يعملون الصناعة {cite:fihrist-ibn-al-nadim p. 493-494}."
  en: "The Fihrist's alchemy chapter — origin claims from Hermes to Moses and Qarun, and al-Razi's dictum that no one is a philosopher without mastering the Art {cite:fihrist-ibn-al-nadim p. 493-494}."
