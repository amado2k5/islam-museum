id: concept/sinaat-al-kimiya
class: concept
kind: term
label: { ar: "صناعة الكيمياء", en: "The Alchemical Art", es: "El arte alquímico", fr: "L'art alchimique", ur: "کیمیا آرٹ", tr: "Kimya endüstrisi", id: "Industri kimia" }
summary:
  ar: "فصل ابن النديم المقالة العاشرة لأخبار الكيميائيين والصنعويين، ونقل أن أهل صناعة الكيمياء زعموا أن أول من تكلم على علم الصنعة هرمس الحكيم البابلي المنتقل إلى مصر عند افتراق الناس عن بابل وأنه ملك مصر، وزعم أبو بكر الرازي أنه لا يجوز أن يصح علم الفيلسوف ولا يسمى الإنسان فيلسوفا إلا أن يصح له علم صناعة الكيمياء، وقالت طائفة إن ذلك كان بوحي من الله إلى جماعة من أهل الصناعة وقال آخرون بوحي إلى موسى وهارون وأن الذي كان يتولى ذلك قارون، وزعم الرازي أن جماعة من الفلاسفة مثل فيثاغورس وديموقراط وأفلاطون وأرسطاطاليس وجالينوس كانوا يعملون الصناعة {cite:fihrist-ibn-al-nadim p. 493-494}."
  en: "The Fihrist's alchemy chapter — origin claims from Hermes to Moses and Qarun, and al-Razi's dictum that no one is a philosopher without mastering the Art {cite:fihrist-ibn-al-nadim p. 493-494}."
  es: "El capítulo de alquimia de Fihrist: afirmaciones sobre el origen desde Hermes hasta Moisés y Qarun, y el dictamen de al-Razi de que nadie es filósofo sin dominar el Arte {cite:fihrist-ibn-al-nadim p. 493-494}."
  fr: "Le chapitre sur l'alchimie du Fihrist — les affirmations sur l'origine allant d'Hermès à Moïse et Qarun, et le dicton d'al-Razi selon lequel personne n'est philosophe sans maîtriser l'Art {cite:fihrist-ibn-al-nadim p. 493-494}."
  ur: "فہرسٹ کا کیمیا باب - ہرمیس سے موسیٰ اور قارون تک کا دعویٰ ہے، اور رازی کا قول ہے کہ فن میں مہارت حاصل کیے بغیر کوئی بھی فلسفی نہیں ہے۔ 493-494}۔"
  tr: "İbn el-Nadim, kimyagerler ve zanaatkârlar hakkında onuncu makaleyi detaylandırarak, zanaatkarların zanaatkarlık bilimi hakkında ilk konuşanın, halk Babil'den ayrıldığında Mısır'a taşınan Babil bilgesi Hermes olduğunu ve onun Mısır kralı olduğunu iddia ettiğini bildirdi. Ebu Bekir el-Razi, bir filozofun simya üretimi bilimine uygun olmadığı sürece filozof ya da filozof olarak adlandırılmasının kabul edilemez olduğunu iddia etti. Bazıları bunun Tanrı'dan bir grup zanaatkâra vahiy olduğunu, bazıları ise Musa ve Harun'dan ilham aldığını ve sorumlunun Qarun olduğunu belirtti. El-Razi, Pisagor, Demorates, Platon, Aristateleus ve Galen gibi bir grup filozofun zanaatkarlık yaptığını iddia etti {cite:fihrist-ibn-al-nadim s. 493-494}."
  id: "Ibn al-Nadim menjelaskan artikel kesepuluh tentang berita para ahli kimia dan pengrajin, dan melaporkan bahwa orang-orang kerajinan mengklaim bahwa yang pertama berbicara tentang ilmu kerajinan adalah Hermes si bijak Babilonia yang pindah ke Mesir ketika rakyat berpisah dari Babilonia dan bahwa ia adalah raja Mesir. Abu Bakr al-Razi mengklaim bahwa tidak diperbolehkan bagi seorang filsuf disebut filsuf atau filsuf kecuali ia memenuhi syarat untuk ilmu pembuatan alkimia. Beberapa mengatakan ini adalah wahyu dari Tuhan kepada sekelompok pengrajin, sementara yang lain mengatakan ini terinspirasi oleh Musa dan Harun, dan yang memimpin adalah Qarun. Al-Razi mengklaim bahwa sekelompok filsuf seperti Pythagoras, Demorates, Plato, Aristateleus, dan Galen mempraktikkan keterampilan {cite:fihrist-ibn-al-nadim hlm. 493-494}."
