label:
  ar: "المكر السيئ"
  en: "Evil scheming (al-makr al-sayyi')"
  ur: "بری چال"
summary:
  ar: "يرى عمر عبد الكافي أن المكر السيئ لا يحيق إلا بأهله سنةً كونية، وأنه ليس ذكاءً، ويضرب أمثلة بفرعون وقارون والنمرود، وينتقد المكر بين الأقارب والزملاء وحول أصحاب القرار."
  en: "Omar Abdelkafy holds that evil scheming recoils only on those who scheme, as a law of the world, and that it is not intelligence; he gives Pharaoh, Qarun and Nimrod as examples, and criticises scheming among relatives, colleagues and those around decision-makers."
  ur: "عمر عبد الکافی کے نزدیک بری چال کائناتی سنت کے طور پر چال چلنے والوں ہی پر پلٹتی ہے، اور یہ ذہانت نہیں؛ وہ فرعون، قارون اور نمرود کی مثالیں دیتے ہیں، اور رشتہ داروں، ساتھیوں اور اہلِ اختیار کے گرد ہونے والی چالوں پر تنقید کرتے ہیں۔"
