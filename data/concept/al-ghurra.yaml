label: { ar: الغُرّة, en: "Al-ghurra (blaze)", es: "Al-ghurra (llamarada)", fr: "Al-ghurra (brûlure)", ur: "الغراء ⁦(آگ)⁩", tr: "bilezikler", id: "gelang" }
summary:
  ar: "الغُرّة: بياض في وجه الفرس، وأنواعها الشمراخ واليعسوب والسارحة ⁦(إن أخذت الوجه كله ما عدا العينين)⁩ والمبرقعة ⁦(حول العينين)⁩ والمغرب ⁦(يصيب أشفار العينين)⁩؛ ومن الرثم واللمظ بياض الشفة العليا والسفلى."
  en: "Al-ghurra: a white patch on the horse's face. Its kinds include al-shimrakh, al-ya'subub, al-sarih (the whole face except the eyes), al-mubarqa'a (around the eyes) and al-maghrib (on the eyelids); al-ramth and al-lamz are white on the upper and lower lip."
  es: "Al-ghurra: una mancha blanca en la cara del caballo. Sus tipos incluyen al-shimrakh, al-ya'subub, al-sarih (toda la cara excepto los ojos), al-mubarqa'a (alrededor de los ojos) y al-maghrib (en los párpados); al-ramth y al-lamz son manchas blancas en el labio superior e inferior."
  fr: "Al-ghurra: tache blanche sur le visage du cheval. Elle se décline en plusieurs types: al-shimrakh, al-ya'subub, al-sarih (tout le visage sauf les yeux), al-mubarqa'a (autour des yeux) et al-maghrib (sur les paupières); al-ramth et al-lamz désignent respectivement la tache blanche sur la lèvre supérieure et inférieure."
  ur: "الغراء: گھوڑے کے چہرے پر سفید دھبہ۔ اس کی اقسام میں الشمرک، یعصوب، السریح ⁦(آنکھوں کے علاوہ پورا چہرہ)⁩، المبارقۃ ⁦(آنکھوں کے گرد)⁩ اور المغرب ⁦(پلکوں پر)⁩ شامل ہیں۔ الرمتھ اور المز کے اوپری اور نچلے ہونٹ پر سفیدی ہوتی ہے۔"
  tr: "Al-Ghurra: Atın yüzündeki beyazlık; türleri şemrakh, jasup, sarihah (gözler hariç tüm yüzü kaplarsa), el-mubarka'a (göz çevresi) ve mağrip (göz dudaklarını etkiler); raith ve lamaz arasında üst ve alt dudakların beyazları bulunur."
  id: "Al-Ghurra: Putih pada wajah kuda; tipe termasuk Şemrakh, Jasup, Sarihah (menutupi seluruh wajah kecuali mata), al-Mubarka'a (di sekitar mata), dan Maghrib (memengaruhi bibir mata); antara Raith dan Lamaz, terdapat putih bibir atas dan bawah."
