summary:
  ar: "الغُرّة: بياض في وجه الفرس، وأنواعها الشمراخ واليعسوب والسارحة (إن أخذت الوجه كله ما عدا العينين) والمبرقعة (حول العينين) والمغرب (يصيب أشفار العينين)؛ ومن الرثم واللمظ بياض الشفة العليا والسفلى."
  en: "Al-ghurra: a white patch on the horse's face. Its kinds include al-shimrakh, al-ya'subub, al-sarih (the whole face except the eyes), al-mubarqa'a (around the eyes) and al-maghrib (on the eyelids); al-ramth and al-lamz are white on the upper and lower lip."
