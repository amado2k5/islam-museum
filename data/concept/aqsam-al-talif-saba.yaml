id: concept/aqsam-al-talif-saba
class: concept
label: { ar: "أقسام التأليف السبعة" }
kind: term
summary:
  ar: "قال حاجي خليفة في باب المؤلفين والمؤلفات: التأليف على سبعة أقسام لا يؤلف عالم عاقل إلا فيها، إما شيء لم يسبق إليه فيخترعه، أو ناقص يتممه، أو مغلق يشرحه، أو طويل يختصره دون أن يخل بشيء من معانيه، أو متفرق يجمعه، أو مختلط يرتبه، أو أخطأ فيه مصنفه فيصلحه؛ وينبغي لكل مؤلف كتاب في فن قد سبق إليه أن لا يخلو كتابه من خمس فوائد: استنباط شيء كان معضلاً أو جمعه إن كان مفرقاً أو شرحه إن كان غامضاً أو حسن نظم وتأليف أو إسقاط حشو وتطويل؛ وجرت عادة المصنفين أن يذكروا في صدر كل كتاب تراجم تعرب عنه سموها الرؤوس وهي ثمانية: الغرض والمنفعة والعنوان والواضع ونوع العلم وغيرها {cite:kashf-zunun-furqan p. 115-117}."
  en: "Hajji Khalifa's seven legitimate kinds of authorship — invention of what none preceded in, completion of the deficient, explication of the obscure, epitome without loss of meaning, collection of the scattered, ordering of the muddled, correction of a predecessor's error — plus the five benefits a late book must add and the eight conventional ru'us every author states in his opening {cite:kashf-zunun-furqan p. 115-117}."
