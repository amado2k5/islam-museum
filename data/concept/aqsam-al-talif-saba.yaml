id: concept/aqsam-al-talif-saba
class: concept
label: { ar: "أقسام التأليف السبعة", en: "The seven kinds of authorship", fr: "Les sept catégories de composition d’ouvrages", es: "Los siete tipos de autoría", ur: "تصنیف کی سات اقسام" }
kind: term
summary:
  ar: "قال حاجي خليفة في باب المؤلفين والمؤلفات: التأليف على سبعة أقسام لا يؤلف عالم عاقل إلا فيها، إما شيء لم يسبق إليه فيخترعه، أو ناقص يتممه، أو مغلق يشرحه، أو طويل يختصره دون أن يخل بشيء من معانيه، أو متفرق يجمعه، أو مختلط يرتبه، أو أخطأ فيه مصنفه فيصلحه؛ وينبغي لكل مؤلف كتاب في فن قد سبق إليه أن لا يخلو كتابه من خمس فوائد: استنباط شيء كان معضلاً أو جمعه إن كان مفرقاً أو شرحه إن كان غامضاً أو حسن نظم وتأليف أو إسقاط حشو وتطويل؛ وجرت عادة المصنفين أن يذكروا في صدر كل كتاب تراجم تعرب عنه سموها الرؤوس وهي ثمانية: الغرض والمنفعة والعنوان والواضع ونوع العلم وغيرها {cite:kashf-zunun-furqan p. 115-117}."
  en: "Hajji Khalifa's seven legitimate kinds of authorship — invention of what none preceded in, completion of the deficient, explication of the obscure, epitome without loss of meaning, collection of the scattered, ordering of the muddled, correction of a predecessor's error — plus the five benefits a late book must add and the eight conventional ru'us every author states in his opening {cite:kashf-zunun-furqan p. 115-117}."
  fr: "Les sept catégories légitimes de composition d’ouvrages selon Hajji Khalifa — inventer ce en quoi nul n’a précédé, compléter l’incomplet, expliquer l’obscur, abréger sans perte de sens, rassembler le dispersé, ordonner le confus, corriger l’erreur d’un prédécesseur — ainsi que les cinq bénéfices qu’un livre tardif doit apporter et les huit ru’us conventionnels que tout auteur énonce dans son introduction {cite:kashf-zunun-furqan p. 115-117}."
  es: "Los siete tipos legítimos de autoría de Hajji Khalifa: invención de lo que nadie había precedido, culminación de lo deficiente, explicación de lo oscuro, epítome sin pérdida de significado, recopilación de lo disperso, ordenación de lo confuso, corrección del error de un predecesor, más los cinco beneficios que debe añadir un libro tardío y los ocho ru'us convencionales que todo autor menciona en su apertura {cite:kashf-zunun-furqan p. 115-117}."
  ur: "حاجی خلیفہ کی تصنیف کی سات جائز قسمیں - اس کی ایجاد جس سے پہلے کوئی نہیں تھا، کمی کی تکمیل، مبہم کی وضاحت، معنی کے نقصان کے بغیر مظہر، بکھرے ہوئے کو جمع کرنا، گڑبڑ کی ترتیب، پیشرو کی غلطی کی اصلاح - اس کے علاوہ پانچ فوائد اور مصنف کی ہر کتاب میں دیر سے کھلنے والی آٹھ کتابوں کا اضافہ کرنا ضروری ہے۔ {حوالہ: کشف الذنون فرقان ص۔ 115-117}۔"
