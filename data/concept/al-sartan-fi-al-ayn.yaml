id: "concept/al-sartan-fi-al-ayn"
class: "concept"
kind: "scientific"
label:
  ar: "السرطان في العين"
  en: "Cancer in the eye"
  fr: "Cancer de l’œil"
  ur: "آنکھ میں سرطان"
  es: "Cáncer en el ojo"
  tr: "Göz kanseri"
  id: "Kanker mata"
summary:
  ar: "أكثر السرطان في العين يعرض في الصفاق القرني، وعلاماته وجع شديد وتمدد في عروق العين ونخس قوي يتأدى إلى الأصداغ خصوصاً كما يتحرك صاحبه وحمرة في صفاقات العين وصداع وسقوط شهوة الطعام والتألم بكل ما فيه حرارة، وهو مما لا يطمع في برئه وإن طمع في تسكينه، وليس يوجع السرطان في عضو من الأعضاء كإيجاعه إذا عرض في العين {cite:canon-ibn-sina-print-v2 p.181}"
  en: "Eye cancer mostly occurs in the conjunctival coat; its signs are severe pain, distension of the eye's vessels, strong pricking reaching the temples especially as the patient moves, redness of the eye's coats, headache, loss of appetite for food and pain at everything hot; it is not a thing cure is hoped for, only soothing; cancer in no organ pains as it does when it occurs in the eye {cite:canon-ibn-sina-print-v2 p.181}"
  fr: "Le cancer de l’œil survient le plus souvent dans la tunique conjonctive ; ses signes sont une douleur violente, une distension des vaisseaux de l’œil, un fort élancement qui atteint les tempes, surtout lorsque le malade bouge, une rougeur des tuniques de l’œil, des maux de tête, une perte de l’appétit et une douleur au contact de tout ce qui est chaud ; ce n’est pas une chose dont on espère la guérison, mais seulement l’apaisement ; le cancer ne fait souffrir dans aucun organe autant qu’il le fait lorsqu’il survient dans l’œil {cite:canon-ibn-sina-print-v2 p.181}"
  ur: "آنکھ کا سرطان اکثر صفاق قرنی میں عرض ہوتا ہے؛ اس کی علامات ہیں سخت درد، آنکھ کی رگوں میں تاؤ، صدغوں تک پہنچنے والا تیز چبھن بالخصوص جب مریض حرکت کرے، آنکھ کی تہوں میں سرخی، سر درد، بھوک کا اٹھ جانا اور ہر گرم چیز سے تکلیف؛ اس کی شفا کی طمع نہیں بلکہ صرف تسکین کی؛ اور سرطان کسی عضو میں ایسا درد نہیں دیتا جیسا آنکھ میں عرض ہونے پر دیتا ہے {cite:canon-ibn-sina-print-v2 p.181}"
  es: "El cáncer de ojo se presenta principalmente en la conjuntiva; sus síntomas incluyen dolor intenso, dilatación de los vasos sanguíneos del ojo, fuerte hormigueo que se extiende hasta las sienes, especialmente al moverse, enrojecimiento de la conjuntiva, dolor de cabeza, pérdida del apetito y sensibilidad al calor. No se espera una cura, solo alivio; ningún otro cáncer causa tanto dolor en los órganos como cuando se presenta en el ojo. {cite:canon-ibn-sina-print-v2 p.181}"
  tr: "Çoğu göz kanseri kornea peritonunda görülür; şiddetli ağrı, göz damarlarının genişlemesi ve özellikle hasta hareket ettiğinde şakaklara doğru güçlü bir kesik, periton gözlerinde kızarıklık, baş ağrısı, iştah kaybı ve tüm bu ısılarla birlikte ağrı ile karakterizedir. Bu, iyileşmesi istenmeyen bir şeydir, hatta yatıştırma umuduyla bile. Kanser, gözde olduğu gibi hiçbir organda ağrıya neden olmaz {cite:canon-ibn-sina-print-v2 s.181}"
  id: "Sebagian besar kanker mata terlihat di peritoneum kornea; kanker ini ditandai dengan nyeri parah, pembuluh darah mata yang melebar, dan terutama luka tajam di pelipis saat pasien bergerak, kemerahan di mata peritoneal, sakit kepala, hilang nafsu makan, dan nyeri yang disertai dengan semua birahi tersebut. Ini adalah sesuatu yang tidak diinginkan untuk disembuhkan, bahkan dengan harapan dapat menenangkan. Kanker tidak menyebabkan nyeri pada organ manapun seperti di mata {cite:canon-ibn-sina-print-v2 hlm.181}"
