label: { ar: "المُنَاسَخَة", en: "Successive inheritance (munasakha): a second heir dies before division", ur: "مناسخہ ⁦(ورثاء کے مرنے سے پہلے تقسیم نہ ہونا)⁩", es: "Herencia sucesiva (munasakha): un segundo heredero muere antes de la división.", fr: "Succession (munasakha): un deuxième héritier décède avant la division", tr: "Klonlama", id: "Kloning" }
summary:
  ar: "المناسخة في اللغة النقل والتبديل، وفي الاصطلاح نقل نصيب بعض الورثة بموته قبل القسمة إلى من يرث منه. وللفقهاء في حسابها ثلاث حالات، وطريقة في جمع الأنصباء وتصحيح المسائل، ومن أشهر أمثلتها المسألة المأمونية."
  en: "Munasakha in the lexicon is transfer or change. In law it is the passing of an heir's share, when he dies before division, to those who inherit from him. The jurists give three cases, a method for combining the shares and correcting the sums, and a famous example, the Ma'muniyya problem."
  ur: "مناسخہ لغت میں منتقل کرنے کو کہتے ہیں۔ فقہی اصطلاح میں اس سے مراد یہ ہے کہ کسی وارث کی وفات تقسیم سے پہلے ہو جائے تو اس کا حصہ اس کے وارثوں کی طرف منتقل ہو۔ اس کی تین صورتیں اور حساب کا طریقہ بیان کیا گیا ہے۔"
  es: "En el léxico, Munasakha significa transferencia o cambio. En derecho, se refiere a la transmisión de la parte de un heredero, cuando este fallece antes de la división, a sus herederos. Los juristas presentan tres casos, un método para combinar las partes y corregir las sumas, y un ejemplo célebre: el problema de Ma'muniyya."
  fr: "Le terme « munasakha » signifie, dans le lexique, transfert ou modification. En droit, il désigne la transmission de la part d'un héritier, décédé avant le partage, à ses héritiers. Les juristes présentent trois cas, une méthode pour combiner les parts et rectifier les sommes, ainsi qu'un exemple célèbre: le problème de la Ma'muniyya."
  tr: "Dilbilimde 'manasah' devretme ve ikame anlamına gelirken, terminolojide bazı varislerin bölünmeden önce ölümünden sonra payının onlardan miras alan kişiye devredilmesini ifade eder. Hukukçuların bunu hesaplamada üç durumu vardır ve hisselerin toplanması ile sorunların düzeltilmesi için yöntemler vardır. En ünlü örneklerden biri Ma'muni meselesidir."
  id: "Dalam linguistik, 'manasah' merujuk pada transfer dan substitusi, dan dalam terminologi, mengacu pada pemindahan bagian beberapa ahli waris setelah kematian sebelum pembagian kepada ahli waris yang mewarisi dari mereka. Para ahli hukum memiliki tiga kasus dalam menghitungnya, dan ada metode untuk mengumpulkan saham serta memperbaiki masalah. Salah satu contoh paling terkenal adalah masalah Ma'muni."
