label: { ar: "المُنَاسَخَة", en: "Successive inheritance (munasakha): a second heir dies before division", ur: "مناسخہ (ورثاء کے مرنے سے پہلے تقسیم نہ ہونا)" }
summary:
  ar: "المناسخة في اللغة النقل والتبديل، وفي الاصطلاح نقل نصيب بعض الورثة بموته قبل القسمة إلى من يرث منه. وللفقهاء في حسابها ثلاث حالات، وطريقة في جمع الأنصباء وتصحيح المسائل، ومن أشهر أمثلتها المسألة المأمونية."
  en: "Munasakha in the lexicon is transfer or change. In law it is the passing of an heir's share, when he dies before division, to those who inherit from him. The jurists give three cases, a method for combining the shares and correcting the sums, and a famous example, the Ma'muniyya problem."
  ur: "مناسخہ لغت میں منتقل کرنے کو کہتے ہیں۔ فقہی اصطلاح میں اس سے مراد یہ ہے کہ کسی وارث کی وفات تقسیم سے پہلے ہو جائے تو اس کا حصہ اس کے وارثوں کی طرف منتقل ہو۔ اس کی تین صورتیں اور حساب کا طریقہ بیان کیا گیا ہے۔"
