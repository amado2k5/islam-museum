id: concept/canon-milk-for-the-old
class: concept
kind: scientific
label:
  ar: "اللبن للمشايخ عند ابن سينا"
  en: "Milk for the old in the Canon"
  fr: "Lait des vieillards dans le Canon"
  ur: "بزرگوں کے لیے دودھ قانون میں"
  es: "Leche para los ancianos en el Canon"
summary:
  ar: "يبين ابن سينا أن اللبن ينتفع به من المشايخ من يستمرئه ولا يجد عقيبه تمدداً أو حكة أو وجعاً، لأنه يغذو ويرطب، وأوفقه لبن الماعز والأتن، وللبن الأتن خاصة أنه لا يتجبن كثيراً وينحدر سريعاً، مع التعهد بمرعى الحيوان {cite:canon-ibn-sina-print-v1 pp.251-252}."
  en: "Ibn Sina explains that milk benefits those of the old who digest it and feel no stretching, itching or pain after it, since it nourishes and moistens; goat's and ass's milk suit best, ass's milk having the property of not curdling much and passing down quickly, provided the animals' pasture is watched {cite:canon-ibn-sina-print-v1 pp.251-252}."
  fr: "Ibn Sina le juge nourrissant et humidifiant pour ceux qui le digèrent sans distension, prurit ni douleur ; chèvre et ânesse conviendraient le mieux, l’ânesse caillant peu et descendant vite, sous contrôle du pâturage {cite:canon-ibn-sina-print-v1 pp.251-252}."
  es: "Ibn Sina explica que la leche beneficia a los ancianos que la digieren y no sienten estiramiento, picazón ni dolor después de tomarla, ya que nutre e hidrata; la leche de cabra y de burra son las más adecuadas, pues la leche de burra tiene la propiedad de no cuajarse mucho y de pasar rápidamente, siempre que se vigile el pasto de los animales {cite:canon-ibn-sina-print-v1 pp.251-252}."
  ur: "ابن سینا بتاتے ہیں کہ دودھ ان پرانے لوگوں کو فائدہ پہنچاتا ہے جو اسے ہضم کرتے ہیں اور اس کے بعد کوئی کھنچاؤ، خارش یا درد محسوس نہیں ہوتا، کیونکہ یہ پرورش اور نمی کرتا ہے۔ بکری اور گدھے کا دودھ سب سے بہتر ہے، گدھے کے دودھ میں زیادہ دہی نہ ڈالنے اور جلدی سے نیچے گرنے کی خاصیت ہوتی ہے، بشرطیکہ جانوروں کی چراگاہ کو دیکھا جائے {حوالہ:کینن-ابن-سینا-پرنٹ-v1 صفحہ 251-252}۔"
