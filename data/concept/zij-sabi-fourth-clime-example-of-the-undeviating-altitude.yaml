label: { ar: "مثال الإقليم الرابع للارتفاع الذي لا ميل لسمته في الزيج الصابي", en: "The fourth-clime example of the undeviating altitude", ur: "چوتھے اقلیم میں غیر منحرف ارتفاع کی مثال", es: "El cuarto ejemplo de altitud invariable", fr: "L'exemple du quatrième climat de l'altitude invariable", tr: "Sabi zij'de yönüne doğru bir eğilim göstermeyen dördüncü yükselti bölgesine bir örnek.", id: "Contoh wilayah elevasi keempat yang tidak memiliki kecenderungan terhadap arahnya di Sabi zij" }
summary:
  ar: "يضرب البتاني مثلاً في الإقليم الرابع والشمس في أول السرطان، فيبيّن أن ارتفاع الشمس في نصف الليل تحت الأفق الشمالي مثل ارتفاع الجزء المقابل لها فوق الأرض في خط وسط السماء، ويذكر لذلك وجهاً آخر بتضعيف ارتفاع أول الحمل وإنقاص ارتفاع أول السرطان منه، ثم يرسم دائرة وسط السماء والأفق ليبيّن موضع الشمس حين يكون سمتها سمت مطلع الاعتدال. {cite:zij-sabi-nallino-byblion p.41}."
  en: "Al-Battani gives an example in the fourth clime with the Sun at the first of Cancer, showing that the Sun's altitude at midnight below the northern horizon equals the altitude of the opposite degree above the earth on the midheaven line, and giving a second way by doubling the altitude of the first of Aries and subtracting from it the altitude of the first of Cancer. He then draws the circle of midheaven and the horizon to show where the Sun stands when its azimuth is the azimuth of the equinoctial rising. {cite:zij-sabi-nallino-byblion p.41}."
  ur: "البتانی چوتھے اقلیم میں سورج کے سرطان کے آغاز پر ہونے کی مثال دیتے ہیں اور بتاتے ہیں کہ آدھی رات کو شمالی افق کے نیچے سورج کا ارتفاع اس کے مقابل جز کے اس ارتفاع کے برابر ہے جو خط وسط السماء پر زمین سے اوپر ہے؛ اور اس کا دوسرا طریقہ یہ بتاتے ہیں کہ حمل کے آغاز کے ارتفاع کو دگنا کر کے اس میں سے سرطان کے آغاز کا ارتفاع نکال دیا جائے۔ پھر وہ وسط السماء کا دائرہ اور افق کھینچ کر دکھاتے ہیں کہ جب سورج کا سمت مطلع اعتدال کا سمت ہو تو وہ کہاں ہوتا ہے۔ {cite:zij-sabi-nallino-byblion p.41}۔"
  es: "Al-Battani ofrece un ejemplo en el cuarto clima con el Sol en el primero de Cáncer, mostrando que la altitud del Sol a medianoche bajo el horizonte norte es igual a la altitud del grado opuesto sobre la Tierra en la línea del medio cielo. Ofrece una segunda forma de calcularlo duplicando la altitud del primero de Aries y restándole la del primero de Cáncer. A continuación, traza el círculo del medio cielo y el horizonte para mostrar la posición del Sol cuando su acimut coincide con el acimut de la salida equinoccial. {cite:zij-sabi-nallino-byblion p.41}."
  fr: "Al-Battani donne un exemple dans le quatrième climat, avec le Soleil au premier degré du Cancer, démontrant que la hauteur du Soleil à minuit sous l'horizon nord est égale à la hauteur du degré opposé au-dessus de la Terre sur la ligne du milieu du ciel. Il propose une seconde méthode: doubler la hauteur du premier degré du Bélier et en soustraire celle du premier degré du Cancer. Il trace ensuite le cercle du milieu du ciel et de l'horizon pour indiquer la position du Soleil lorsque son azimut est celui du lever équinoxial. {cite:zij-sabi-nallino-byblion p.41}."
  tr: "El-Battani, dördüncü iklimde ve Yengeç burcunun ilk burcunda güneş örneğini vererek, güneşin gece yarısı kuzey ufkunun altındaki yüksekliğinin, meridyende yeryüzünün üzerindeki karşı kısmının yüksekliğine eşit olduğunu gösterir. Bunu göstermenin bir başka yolunu da, Koç burcunun ilk burcunun yüksekliğini ikiye katlayıp, bundan Yengeç burcunun ilk burcunun yüksekliğini çıkarmak olarak belirtir. Daha sonra, güneşin azimutunun ekinoks azimutuna eşit olduğu zamanki konumunu göstermek için gökyüzünün ve ufkun merkezine bir daire çizer. {cite:zij-sabi-nallino-byblion s.41}."
  id: "Al-Battani memberikan contoh dalam iklim keempat dan matahari di tanda pertama Cancer, menunjukkan bahwa ketinggian matahari pada tengah malam di bawah cakrawala utara sama dengan ketinggian bagian yang berlawanan di atas bumi di meridian. Ia menyebutkan cara lain untuk menunjukkan hal ini dengan menggandakan ketinggian tanda pertama Aries dan menguranginya dengan ketinggian tanda pertama Cancer. Kemudian ia menggambar lingkaran di tengah langit dan cakrawala untuk menunjukkan posisi matahari ketika azimutnya adalah azimut ekuinoks. {cite:zij-sabi-nallino-byblion p.41}."
