label: { ar: "المَسْأَلَة النَّاقِصَة", en: "The defective case of inheritance (naqisa)", ur: "ناقصہ مسئلہ (وراثت کی ناقص صورت)" }
summary:
  ar: "المسألة الناقصة في الفرائض هي التي تقصر فيها سهام أصحاب الفروض عن أصل المسألة فيبقى سهم زائد. وأصول المسائل عند الجمهور ثلاثة: عادلة تتساوى فيها السهام مع الأصل، وناقصة، وعائلة تزيد فيها السهام. واشترط الجمهور من الحنفية والمالكية والشافعية لكون المسألة ناقصة ألا يوجد عاصب، واشترط الحنابلة ألا يكون فيها عول ولا رد وأن يوجد عاصب. وذهب جمهور العلماء إلى رد الباقي على أصحاب الفروض مع اختلافهم فيمن يرد عليه، وتفصيل ذلك في مصطلح إرث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15438} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15439}"
  en: "In the law of inheritance, a defective case (naqisa) is one in which the shares of the fixed-share heirs fall short of the base of the case, leaving a surplus. The jurists recognise three kinds of case: the equal (adila), where the shares equal the base; the defective; and the increased (a'ila), where the shares exceed it. The Hanafis, Malikis and Shafi'is require for a defective case that there be no agnate; the Hanbalis require that there be no increase or return and that an agnate be present. Most jurists hold that the surplus returns to the fixed-share heirs, with differences over who receives it; the detail is under the entry on inheritance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15438} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15439}"
  ur: "ناقصہ مسئلہ وہ ہے جس میں ذوی الفروض کے حصے اصل مسئلہ سے کم ہوں اور بچ جانے والا حصہ رد کیا جائے۔ جمہور کے نزدیک مسائل تین ہیں: عادلہ، ناقصہ اور عائلہ۔ تفصیل وراثت کے مضمون میں ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15438} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15439}"
