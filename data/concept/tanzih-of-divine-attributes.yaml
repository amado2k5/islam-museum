id: concept/tanzih-of-divine-attributes
class: concept
kind: belief
label: { ar: "تنزيه صفات الله", en: "Declaring God free of likeness in His attributes", ur: "اللہ کی صفات کی تنزیہ" }
summary:
  ar: "يرى الشعراوي أن ما يرد عن الله من صفات وأفعال يؤخذ على ما أخبر به عن نفسه، في إطار نفي المماثلة، فلا يقاس وجوده ولا علمه ولا كلامه على الخلق {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1074} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1103}."
  en: "Sha'rawi holds that the attributes and acts God reports of Himself are taken as He states them, within the denial of any likeness. God's existence, knowledge and speech are not measured by those of creatures {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1074} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1103}."
  ur: "شعراوی کے نزدیک اللہ کی صفات اور افعال کو اسی طرح لیا جائے گا جیسا اللہ نے بیان کیا، مگر مماثلت کی نفی کے ساتھ۔ اللہ کے وجود، علم اور کلام کو مخلوق پر نہیں ناپا جائے گا {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1074} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1103}۔"
