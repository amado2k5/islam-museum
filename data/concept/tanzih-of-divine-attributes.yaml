id: concept/tanzih-of-divine-attributes
class: concept
kind: belief
label: { ar: "تنزيه صفات الله", en: "Declaring God free of likeness in His attributes", ur: "اللہ کی صفات کی تنزیہ", es: "Declarando que Dios está libre de semejanza en sus atributos.", fr: "Déclarer que Dieu est exempt de ressemblance dans ses attributs", tr: "Tanrı'nın niteliklerinin arındırılması", id: "Pemurnian sifat-sifat Allah" }
summary:
  ar: "يرى الشعراوي أن ما يرد عن الله من صفات وأفعال يؤخذ على ما أخبر به عن نفسه، في إطار نفي المماثلة، فلا يقاس وجوده ولا علمه ولا كلامه على الخلق {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1074} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1103}."
  en: "Sha'rawi holds that the attributes and acts God reports of Himself are taken as He states them, within the denial of any likeness. God's existence, knowledge and speech are not measured by those of creatures {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1074} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1103}."
  ur: "شعراوی کے نزدیک اللہ کی صفات اور افعال کو اسی طرح لیا جائے گا جیسا اللہ نے بیان کیا، مگر مماثلت کی نفی کے ساتھ۔ اللہ کے وجود، علم اور کلام کو مخلوق پر نہیں ناپا جائے گا {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1074} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1103}۔"
  es: "Sha'rawi sostiene que los atributos y actos que Dios relata de sí mismo se toman tal como Él los afirma, negando cualquier semejanza. La existencia, el conocimiento y el habla de Dios no se miden por los de las criaturas {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1074} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1103}."
  fr: "Sha'rawi soutient que les attributs et les actes que Dieu rapporte de Lui-même doivent être pris tels qu'Il les énonce, sans aucune ressemblance. L'existence, la connaissance et la parole de Dieu ne se mesurent pas à celles des créatures {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1074} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1103}."
  tr: "El-Şaarawi, Tanrı'ya nitelikler ve eylemler açısından atfedilen şeyin, O'nun kendisi hakkında bilgi verdiklerine dayandığına, benzerliği reddetme çerçevesinde yapıldığına inanır; bu nedenle varlığı, bilgisi ve konuşması yaratılışla ölçülmez {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1074} {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1103}."
  id: "Al-Shaarawi percaya bahwa apa yang dikaitkan dengan Tuhan dalam hal sifat dan tindakan diambil berdasarkan apa yang telah Dia informasikan tentang diri-Nya, dalam kerangka menyangkal kesamaan, sehingga keberadaan, pengetahuan, dan ucapan-Nya tidak diukur berdasarkan ciptaan {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1074} {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1103}."
