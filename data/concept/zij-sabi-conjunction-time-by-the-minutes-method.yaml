label: { ar: "وقت الاجتماع بمذهب الدقائق", en: "The time of conjunction by the method of minutes", ur: "دقائق کے طریقے سے اجتماع کا وقت", es: "El tiempo de conjunción por el método de los minutos", fr: "Le temps de conjonction par la méthode des minutes", tr: "Toplantı zamanı, tutanaklara göre belirlenir.", id: "Waktu pertemuan sesuai dengan doktrin notulen." }
summary:
  ar: "يصف البتاني مذهباً آخر لمعرفة وقت الاجتماع بالدقائق، وهو أن يُضرب ساعات الاجتماع المعتدلة من بعد انتصاف النهار في دقيقتين ونصف، فإن بلغ ثلاثين دقيقة فالاجتماع نصف الليل، وإن كان أقل فهو قبل نصف الليل، وإن كان أكثر فبعده. {cite:zij-sabi-nallino-byblion p.145}."
  en: "Al-Battani describes another way to find the time of conjunction, by minutes: the equated conjunction hours after noon are multiplied by two and a half minutes. If the product is thirty minutes the conjunction is at midnight; if less it is before midnight, and if more it is after. {cite:zij-sabi-nallino-byblion p.145}."
  ur: "البتانی اجتماع کا وقت دقائق سے معلوم کرنے کا ایک اور طریقہ بیان کرتے ہیں: دوپہر کے بعد کے معتدل اجتماعی گھنٹوں کو ڈھائی دقیقوں سے ضرب دیا جاتا ہے۔ اگر حاصل تیس دقائق ہو تو اجتماع آدھی رات کو ہے، کم ہو تو آدھی رات سے پہلے، اور زیادہ ہو تو بعد میں۔ {cite:zij-sabi-nallino-byblion p.145}۔"
  es: "Al-Battani describe otra forma de hallar la hora de la conjunción, en minutos: las horas de conjunción equivalentes después del mediodía se multiplican por dos minutos y medio. Si el producto es de treinta minutos, la conjunción es a medianoche; si es menor, es antes de medianoche, y si es mayor, es después. {cite:zij-sabi-nallino-byblion p.145}."
  fr: "Al-Battani décrit une autre méthode pour déterminer l'heure de la conjonction, en minutes: on multiplie l'heure de la conjonction après midi par deux minutes et demie. Si le résultat est de trente minutes, la conjonction a lieu à minuit; s'il est inférieur, elle a lieu avant minuit, et s'il est supérieur, elle a lieu après. {cite:zij-sabi-nallino-byblion p.145}."
  tr: "El-Battani, toplantının zamanını dakika cinsinden belirlemek için başka bir yöntem daha tanımlar: Öğleden sonraki toplantının ortalama saatini iki buçuk dakika ile çarpmak. Sonuç otuz dakika ise toplantı gece yarısındadır; daha az ise gece yarısından öncedir; daha fazla ise gece yarısından sonradır. {cite:zij-sabi-nallino-byblion s.145}."
  id: "Al-Battani menjelaskan metode lain untuk menentukan waktu pertemuan dalam menit: mengalikan rata-rata jam pertemuan setelah tengah hari dengan dua setengah menit. Jika hasilnya tiga puluh menit, maka pertemuan tersebut terjadi pada tengah malam; jika kurang dari itu, maka pertemuan tersebut terjadi sebelum tengah malam; dan jika lebih dari itu, maka pertemuan tersebut terjadi setelah tengah malam. {cite:zij-sabi-nallino-byblion p.145}."
