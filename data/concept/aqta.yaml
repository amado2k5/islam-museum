summary:
  ar: "الأقطع لغةً مقطوع اليد، وعند الفقهاء مقطوع اليد أو الرجل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3226} ويُعفى من فرض الكفاية في الجهاد، ويسقط عنه غسل العضو المقطوع، وينقص القطع من أهلية إمامة الصلاة عند بعض الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3226}"
  en: "Aqta' in the lexical sense means one with a cut-off hand; in the jurists' usage, one who has lost a hand or a foot. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3226} Such a person is excused from communal jihad, does not wash the lost limb, and some jurists consider the loss a defect in a prayer leader. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3226}"
