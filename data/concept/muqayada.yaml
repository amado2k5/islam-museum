id: concept/muqayada
class: concept
kind: legal
label: { ar: "المُقَايَضَة", en: "Barter (muqayada)", ur: "مُقایضہ (اشیاء کا باہمی تبادلہ)" }
summary:
  ar: "المقايضة في اللغة العوض، وفي الاصطلاح الفقهي بيع السلعة بالسلعة، وعرّفتها مجلة الأحكام العدلية بأنها بيع العين بالعين، أي مبادلة مال بمال غير النقدين. وهي نوع من البيع تجري فيها أحكامه إلا ما يتعلق بالثمن. ومن شروطها الخاصة أن لا يكون البدلان نقدين، وأن يكون كل منهما عينا معينة، وأن يقبضا معا، وأن لا يجري فيها ربا الفضل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14905} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14906}"
  en: "Muqayada is, in the lexicon, an exchange of one thing for another. The jurists define it as the sale of goods for goods, and the Ottoman Majalla defines it as the exchange of a thing for a thing other than the two monies. It is a kind of sale, and its general rules apply except those that concern the price. Its specific conditions: neither side is money, each side is a specific item, both sides are delivered together, and the rules against excess in exchange of the same kind (riba al-fadl) apply. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14905} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14906}"
  ur: "مُقایضہ سامان کو سامان کے عوض بیچنا ہے۔ اس کی خاص شرائط میں یہ ہے کہ دونوں عوض نقدی نہ ہوں، ہر عوض متعین چیز ہو، دونوں ایک ساتھ قبضے میں آئیں، اور ربا الفضل جاری نہ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14905} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14906}"
