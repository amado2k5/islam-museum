label:
  ar: "بسباسة"
  en: "Basbasa (nutmeg, the editor's jawz al-tib)"
  fr: "Basbasa (muscade, jawz al-tib de l’éditeur)"
  ur: "بسباسہ ⁦(جوزِ طیب)⁩"
  es: "Basbasa (nuez moscada, el jawz al-tib del editor)"
  tr: "Basbasa"
  id: "Basbasa"
summary:
  ar: "قشور متغضنة يابسة تُجلب من بلاد الصين، تحلّل النفخ، وفيها قبض، وتقوّي الكبد والمعدة، وتطيّب النكهة، ومع دهن البنفسج يُستعط به للصداع من الرياح الغليظة والشقيقة، وتحلّل الصلابات الغليظة، وتُعقل المبطونين وتنفع من السحج {cite:canon-ibn-sina-print-v1 p.409}."
  en: "Wrinkled dry shells brought from China. They dissolve wind and have astringency, strengthen the liver and stomach, sweeten the breath, and with violet oil are used as a snuff for headache from thick wind and migraine. They dissolve thick hardness and bind the bowel in cases of flux {cite:canon-ibn-sina-print-v1 p.409}."
  fr: "Enveloppes sèches et ridées apportées de Chine. Elles dissiperaient les vents, possèdent une astringence, fortifieraient foie et estomac et parfumeraient l’haleine. Avec l’huile de violette, elles servent de prise nasale contre les céphalées dues aux vents épais et la migraine. Elles résoudraient les indurations épaisses et resserreraient l’intestin en cas de flux {cite:canon-ibn-sina-print-v1 p.409}."
  ur: "چین سے لائے جانے والے سکڑے ہوئے خشک چھلکے۔ یہ ہوا کو تحلیل کرتے اور ان میں قبض ہے، جگر اور معدے کو قوت دیتے ہیں، سانس کو خوشبودار کرتے ہیں، اور بنفشے کے تیل کے ساتھ گاڑھی ہوا کے سردرد اور شقیقہ میں ناک میں ڈالے جاتے ہیں۔ یہ موٹی سختی کو تحلیل کرتے اور پیچش میں پیٹ کو باندھتے ہیں {cite:canon-ibn-sina-print-v1 p.409}۔"
  es: "Conchas secas y arrugadas traídas de China. Disuelven el viento y tienen propiedades astringentes, fortalecen el hígado y el estómago, endulzan el aliento y, con aceite de violeta, se usan como rapé para el dolor de cabeza causado por viento denso y migraña. Disuelven la dureza y ayudan a regular el tránsito intestinal en casos de estreñimiento {cite:canon-ibn-sina-print-v1 p.409}."
  tr: "Çin'den getirilen kuru, yoğun peelingler şişliği çözer, kasılma içerir, karaciğer ve mideyi güçlendirir ve lezzeti artırır. Mor yağı ile birlikte, güçlü ve acı rüzgarlardan kaynaklanan baş ağrılarını hafifletmek, iri sertliği çözmek, cildi güçlendirmek ve sajj'dan fayda sağlamak için kullanılır {cite:canon-ibn-sina-print-v1 s.409}."
  id: "Peels kering dan padat yang dibawa dari China melarutkan pembengkakan, menahan kontraksi, memperkuat hati dan lambung, serta meningkatkan rasa. Dengan minyak violet, digunakan untuk meredakan sakit kepala akibat angin kencang dan dingin, melarutkan kekerasan kasar, memperkuat kulit, dan mendapatkan manfaat dari sajj {cite:canon-ibn-sina-print-v1 hlm.409}."
