id: concept/muhkam-and-mutashabih
class: concept
kind: belief
label: { ar: "المحكم والمتشابه", en: "The clear and the ambiguous verses (muhkam and mutashabih)", ur: "محکم اور متشابہ آیات" }
summary:
  ar: "يرى الشعراوي أن المحكم ما لا تختلف فيه الأفهام، وهو مناط العمل، وأن المتشابه ما يُتعب في فهم المراد منه، وهو مناط الإيمان، وأن المؤمن يرد المتشابه إلى المحكم، وينقل الخلاف في الوقف عند لفظ الجلالة أو عند الراسخين في العلم دون ترجيح {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1272} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1273} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1281}."
  en: "Sha'rawi holds that the muhkam is what leaves no room for disagreement and is the basis of action, and that the mutashabih is what is hard to grasp and is the basis of faith. The believer refers the ambiguous to the clear. He reports the disagreement over where to pause after the name of God or after those firm in knowledge, without ruling between them {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1272} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1273} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1281}."
  ur: "شعراوی کے نزدیک محکم وہ ہے جس میں فہم کا اختلاف نہ ہو اور وہ عمل کی بنیاد ہے، اور متشابہ وہ ہے جس کی مراد سمجھنے میں محنت لگے اور وہ ایمان کی بنیاد ہے۔ مومن متشابہ کو محکم کی طرف لوٹاتا ہے۔ وہ اللہ کے نام یا راسخین فی العلم پر وقف کے اختلاف کو بغیر فیصلے کے نقل کرتے ہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1272} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1273} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1281}۔"
