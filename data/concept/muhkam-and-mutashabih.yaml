perspectives:
  - tradition: sunni
    id: sunni-sharawi-muhkam-for-action-mutashabih-for-faith
    stance: { ar: "المحكم للعمل والمتشابه للإيمان، ويُرد المتشابه إلى المحكم، مع نفي المماثلة", en: "The clear is for action and the ambiguous for faith; the ambiguous is referred to the clear, with the denial of likeness", ur: "محکم عمل کے لیے اور متشابہ ایمان کے لیے ہے؛ متشابہ کو محکم کی طرف لوٹایا جائے، مماثلت کی نفی کے ساتھ" }
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يرى الشعراوي أن المحكم يُعمل به والمتشابه يُؤمن به، وأن المتشابه يُرد إلى المحكم، وأن الوقوف عند لفظ الجلالة أو عند الراسخين لا يغير المعنى عنده، ويذكر أن الأمرين متساويان {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1281} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1277}."
      en: "Sha'rawi holds that the clear is acted on and the ambiguous is believed, and that the ambiguous is referred to the clear. He holds that the two pauses lead to the same meaning {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1281} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1277}."
      ur: "شعراوی کے نزدیک محکم پر عمل کیا جائے اور متشابہ پر ایمان رکھا جائے، اور متشابہ کو محکم کی طرف لوٹایا جائے۔ ان کے نزدیک دونوں وقف ایک ہی معنی تک پہنچاتے ہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1281} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1277}۔"
