label:
  ar: "حسن الصوت بالقرآن والتغني به"
  en: "Beautifying the voice with the Qur'an (taghani)"
  ur: "حسن الصوت بالقرآن والتغني به"
  fr: "Beautifying the voice with the Qur'an (taghani)"
  es: "Beautifying the voice with the Qur'an (taghani)"
  tr: "حسن الصوت بالقرآن والتغني به"
  id: "Beautifying the voice with the Qur'an (taghani)"
summary:
  ar: "حث السنة على تحسين الصوت بالقراءة في حديث «ليس منا من لم يتغن بالقرآن» و«زينوا القرآن بأصواتكم»، على أن التغني عند الفقهاء تحسين لا تمطيط بالألحان {cite:sahih-al-bukhari}."
  en: "The Sunnah urges beautifying the voice in recitation — 'he is not of us who does not yataghanna the Qur'an' and 'adorn the Qur'an with your voices' — while the jurists read taghani as improving the voice, not stretching it into melodies {cite:sahih-al-bukhari}."
