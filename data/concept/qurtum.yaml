summary:
  ar: "القرطم في الكتاب صنفان بستاني وبري، شوكة ذات زهر أصفر وأصل رقيق لا ينتفع به، يقرب دهنه من دهن الأنجرة، يجبن اللبن، وينقي الصدر ويصفي الصوت وهو رديء للمعدة، وينفع من القولنج ويسهل البلغم المحترق ويطلق دهن البستاني البطن، وينفع ورق البري وثمره من لسعة العقرب {cite:canon-ibn-sina-print-v1 pp.646-647}"
  en: "Qurtum is in the book of two kinds, garden and wild, a thistle with a yellow flower and a thin root of no use; its oil is near the oil of anjara, it curdles milk, cleanses the chest and clears the voice, is bad for the stomach, benefits colic, loosens burnt phlegm, and the oil of the garden kind loosens the belly; the leaf and fruit of the wild kind benefit the scorpion sting {cite:canon-ibn-sina-print-v1 pp.646-647}"
  ur: "قرطم کتاب میں دو قسم کا ہے، باغی اور جنگلی، ایک کانٹے دار پودا جس کا پھول زرد اور جڑ باریک بے فائدہ ہے؛ اس کا تیل انجرہ کے تیل کے قریب ہے، دودھ پھاڑتا ہے، سینہ صاف کرتا اور آواز صاف کرتا ہے، معدے کے لیے بُرا ہے، قولنج میں نافع ہے اور جلے ہوئے بلغم کو نکالتا ہے، اور باغی کا تیل پیٹ کھولتا ہے؛ جنگلی کا پتا اور پھل بچھو کے ڈنک میں نافع ہے {cite:canon-ibn-sina-print-v1 pp.646-647}۔"
  es: "El qurtum se encuentra en el libro en dos tipos, de jardín y silvestre, un cardo con una flor amarilla y una raíz delgada e inútil; su aceite es similar al aceite de anjara, cuaja la leche, limpia el pecho y aclara la voz, es malo para el estómago, alivia los cólicos, disuelve la flema quemada, y el aceite del tipo de jardín afloja el vientre; la hoja y el fruto del tipo silvestre benefician la picadura de escorpión {cite:canon-ibn-sina-print-v1 pp.646-647}"
