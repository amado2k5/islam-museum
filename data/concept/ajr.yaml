id: concept/ajr
class: concept
kind: legal
label: { ar: "أجر", en: "Reward or wage (ajr)", fr: "Récompense ou salaire (ajr)", es: "Recompensa o salario (ajr)", ur: "اجر یا اجرت ⁦(اجر)⁩", tr: "Ücret", id: "Ücret" }
summary:
  ar: "الأجر عند الفقهاء العوض عن العمل، سواء أكان من الله أم من العباد، مع أن الأجر من الله تفضل منه، ويطلق بمعنى بدل المنفعة في العقار والمنقول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1592} وقد سمى القرآن الكريم مهر المرأة أجراً، وسمى ما يعطى للمرضعة أجراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1592} ويذكر الفقهاء مسائل الأجر على العمل والمنفعة ضمن مباحث الإجارة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1592}"
  en: "For jurists, ajr is the consideration for work, whether from God or from people, though a reward from God is a bounty. It also means the price of a benefit, whether of land or of a movable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1592} The Qur'an calls a woman's dowry an ajr, and what is given to a nurse for suckling is also called ajr. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1592} The jurists treat questions of ajr for work and benefit within the lease. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1592}"
  fr: "Pour les juristes, l’ajr est la contrepartie d’un travail, qu’elle vienne de Dieu ou des êtres humains, même si la récompense divine est une grâce. Le mot désigne aussi le prix de la jouissance d’un bien, qu’il soit immobilier ou mobilier. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1592} Le Coran appelle ajr le don nuptial d’une femme, ainsi que ce qu’on donne à une nourrice pour l’allaitement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1592} Les juristes traitent les questions d’ajr pour un travail ou pour l’usage d’un bien dans le cadre du louage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1592}"
  es: "Para los juristas, ajr es la contraprestación por el trabajo, ya sea de Dios o de los hombres, aunque una recompensa divina es una bendición. También significa el precio de un beneficio, ya sea de tierras o de bienes muebles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1592} El Corán denomina ajr a la dote de una mujer, y también se denomina ajr a lo que se le da a una nodriza para la lactancia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1592} Los juristas tratan las cuestiones de ajr por trabajo y beneficio dentro del ámbito del arrendamiento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1592}"
  ur: "فقہاء کے نزدیک اجر کام کا لحاظ ہے، خواہ خدا کی طرف سے ہو یا لوگوں کی طرف سے، حالانکہ خدا کی طرف سے انعام ایک فضل ہے۔ اس کا مطلب فائدہ کی قیمت بھی ہے، چاہے زمین کی ہو یا منقولہ کی۔ قرآن نے عورت کے جہیز کو اجر کہا ہے اور جو دودھ پلانے کے لیے نرس کو دیا جاتا ہے اسے بھی اجر کہتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1592} فقہاء اجارہ کے اندر کام اور فائدے کے لیے اجار کے سوالات کا علاج کرتے ہیں۔ {حوالہ: فقہ موسوعۃ کویتیہ نور v3 صفحہ 1592}"
  tr: "Hukukçulara göre ödül, Tanrı'dan ya da O'nun hizmetkârlarından alınan bir emek karşılığıdır; oysa ödül Tanrı'dan O'nun lütuf olarak alınır. Gayrimenkul ve taşınabilir mülkte faydanın yerine geçmek anlamına gelir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1592} Kur'an-ı Kerim, bir kadının çeyizini ödül olarak adlandırırken, emziren anneye verilen ödül olarak kabul edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1592} Hukukçular, kira tartışmalarında iş için ödül ve fayda konularına değinirler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1592}"
  id: "Menurut ahli hukum, ganjaran adalah ganjaran yang diterima dari Allah atau hamba-Nya; sedangkan ganjaran diterima dari Allah sebagai anugerah-Nya. Artinya menggantikan manfaat dalam properti dan harta bergerak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1592} Sementara Al-Qur'an menyebut mas kawin wanita sebagai hadiah, itu dianggap sebagai hadiah yang diberikan kepada ibu yang menyusui. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1592} Para ahli hukum membahas isu imbal hasil dan manfaat untuk pekerjaan dalam perdebatan tentang sewa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1592}"
