label: { ar: "أجر", en: "Reward or wage (ajr)" }
summary:
  ar: "الأجر عند الفقهاء العوض عن العمل، سواء أكان من الله أم من العباد، مع أن الأجر من الله تفضل منه، ويطلق بمعنى بدل المنفعة في العقار والمنقول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1592} وقد سمى القرآن الكريم مهر المرأة أجراً، وسمى ما يعطى للمرضعة أجراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1592} ويذكر الفقهاء مسائل الأجر على العمل والمنفعة ضمن مباحث الإجارة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1592}"
  en: "For jurists, ajr is the consideration for work, whether from God or from people, though a reward from God is a bounty. It also means the price of a benefit, whether of land or of a movable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1592} The Qur'an calls a woman's dowry an ajr, and what is given to a nurse for suckling is also called ajr. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1592} The jurists treat questions of ajr for work and benefit within the lease. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1592}"
