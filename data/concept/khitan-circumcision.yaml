summary:
  ar: "الختان لغة قطع القلفة من الذكر والنواة من الأنثى، ويطلق عليه الخفض والإعذار، والختان أيضا اسم لموضع القطع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7550} وقد اختلف الفقهاء في حكم الختان على أقوال، وكان الختان مما ورد الترغيب فيه في الحديث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7551}  وللفقهاء في حكم الختان ثلاثة أقوال: فالحنفية والمالكية ورواية عن أحمد يرون أنه سنة للرجال وليس بواجب، وفي حق المرأة مكرمة أو مندوب، والشافعية والحنابلة وسحنون يوجبونه على الرجال والنساء؛ وقال ابن قدامة بالوجوب في الرجال والإكرام في النساء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7551} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7552} ويكون ختان الذكر بقطع القلفة حتى تنكشف الحشفة، وختان الأنثى بقطع ما ينطلق عليه الاسم دون استئصال كامل، لحديث أم عطية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7553} ويستحب الختان في الصغر، والوقت المستحب عند الشافعية اليوم السابع، وعند غيرهم بين السابعة والعاشرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7553} ويرى الشافعية في الميت أقوالا في ختانه، وإن ولد الإنسان مختونا فلا ختان عليه، وإن بقي شيء من القلفة وجب قطعه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7554} وتضمن الخاتن إذا مات المختون بسبب الجرح أو تجاوز القطع الحد؛ فالحنفية يوجبون نصف الدية عند الموت وكاملة عند البرء، والمالكية لا ضمان على العارف المتقن إلا بخطأ، والشافعية والحنابلة لهم تفصيل في التعدي وإذن الولي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7554} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7555} وتشرع الوليمة للختان ويسمى الإعذار، والسنة إظهار ختان الذكر وإخفاء ختان الأنثى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7555}"
  en: "Khitan (circumcision) lexically is the cutting of the foreskin of a male, or of the female's nub; it is also called khafd and i'dhar, and the word names the place of the cut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7550} The jurists differ in several views on whether circumcision is obligatory or recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7551}  On the ruling there are three views: the Hanafis, Malikis and a Hanbali report hold circumcision a sunna for men and not obligatory, honoured for women; the Shafiis, Hanbalis and Sahnun make it obligatory for both; Ibn Qudama holds it obligatory for men and an honour for women. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7551} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7552} For a male, the foreskin is cut until the glans is bare; for a female, only what the name covers, without excess, as the hadith of Umm Atiyya teaches. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7553} Circumcision is best in childhood; the Shafiis prefer the seventh day, others between seven and ten years of age. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7553} On the dead the schools differ: some do not circumcise him, others do, and one view has three cases. A child born circumcised needs no operation, and any remaining foreskin must be removed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7554} The circumciser is liable for death or excess cutting: the Hanafis owe half the blood-money if death follows and the full sum if the child lives, the Malikis exempt a skilled and careful one who makes no mistake, and the Shafiis and Hanbalis draw distinctions about excess, guardianship and skill. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7554} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7555} A feast is recommended for circumcision (called i'dhar), and the custom is to show a male's circumcision and to hide a female's. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7555}"
  ur: "ختان لغت میں مرد کی سنت (ختنہ کی کھال) اور عورت کے حصے کے کاٹنے کو کہتے ہیں؛ اسے خفض اور اعذار بھی کہا جاتا ہے، اور لفظ اس کاٹنے کی جگہ پر بھی بولا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7550} فقہاء کے کئی اقوال ہیں کہ ختنہ واجب ہے یا مستحب۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7551}  ختنہ کے حکم میں تین اقوال ہیں: حنفیہ، مالکیہ اور امام احمد کی ایک روایت کے مطابق مرد کے لیے سنت ہے نہ کہ واجب، اور عورت کے لیے باعثِ عزت یا مستحب؛ شافعیہ، حنابلہ اور سحنون مرد و عورت دونوں پر واجب کہتے ہیں؛ ابن قدامہ مردوں پر واجب اور عورتوں کے لیے اکرام کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7551} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7552} مرد کے ختنہ میں قلفہ کاٹا جاتا ہے یہاں تک کہ سپاری کھل جائے، اور عورت کے ختنہ میں صرف اتنا جتنا نام کے تحت آتا ہے، حدیثِ ام عطیہ کے مطابق۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7553} بچپن میں ختنہ مستحب ہے؛ شافعیہ کے نزدیک ساتواں دن افضل ہے، جبکہ دوسروں کے نزدیک سات سے دس سال کی عمر کے درمیان۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7553} میت کے ختنہ کے بارے میں شافعیہ کے کئی اقوال ہیں، اور جو شخص ختنہ شدہ پیدا ہو اس پر ختنہ نہیں؛ اگر قلفہ کا کچھ حصہ باقی ہو تو اسے کاٹنا لازم ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7554} ختنہ کرنے والا موت یا حد سے زیادہ کاٹنے کا ضامن ہوتا ہے: حنفیہ موت کی صورت میں نصف دیت اور زندہ رہنے پر پوری دیت لازم کرتے ہیں، مالکیہ ماہر اور محتاط کو بری کہتے ہیں جب خطا نہ ہو، اور شافعیہ و حنابلہ تعدی، ولی کی اجازت اور مہارت کے اعتبار سے تفصیل کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7554} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7555} ختنہ کے موقع پر دعوت مستحب ہے جسے اعذار کہتے ہیں، اور سنت یہ ہے کہ مرد کا ختنہ ظاہر کیا جائے اور عورت کا چھپایا جائے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7555}"
