id: concept/jaadah
class: concept
kind: natural
label:
  ar: "جعدة"
  en: "Jaadah (a kind of wormwood)"
  ur: "جعدہ ⁦(شیح کی ایک قسم)⁩"
  es: "Jaadah (un tipo de ajenjo)"
  fr: "Jaadah (une sorte d'absinthe)"
  tr: "kırışıklık"
  id: "kerutan"
summary:
  ar: "نوع من الشيح فيه حرارة وحدّة يسيرة؛ الكبير منه يفتح السدد ويدمل الجراحات الطرية، والصغير أحدّ، ويُطلى بالخل لورم الطحال، ويدرّ البول ويسهّل، وينفع من الاستسقاء والحمّيات المزمنة، وهو عموماً رديء للمعدة {cite:canon-ibn-sina-print-v1 p.424} {cite:canon-ibn-sina-print-v1 p.425}."
  en: "A kind of wormwood with a little heat and sharpness. The larger kind opens deep blockages and heals fresh wounds; the smaller is sharper. With vinegar it is applied to a swollen spleen. The book says it moves urine, purges, helps dropsy, yellow jaundice and chronic fevers, and that in general it is bad for the stomach {cite:canon-ibn-sina-print-v1 p.424} {cite:canon-ibn-sina-print-v1 p.425}."
  ur: "شیح کی ایک قسم جس میں تھوڑی گرمی اور تیزی ہے؛ بڑی قسم اندرونی رکاوٹیں کھولتی اور تازہ زخم بھرتی ہے، چھوٹی زیادہ تیز ہے۔ سرکے کے ساتھ تلی کے ورم پر لیپ کیا جاتا ہے۔ کتاب کے مطابق یہ پیشاب جاری کرتی، مسہل ہے، استسقا، کالے یرقان اور دائمی بخار میں مفید ہے، اور عمومی طور پر معدے کے لیے بری ہے {cite:canon-ibn-sina-print-v1 p.424} {cite:canon-ibn-sina-print-v1 p.425}۔"
  es: "Un tipo de ajenjo con un ligero picor y astringencia. El tipo más grande abre obstrucciones profundas y cura heridas recientes; el más pequeño es más punzante. Con vinagre se aplica al bazo inflamado. El libro dice que facilita la micción, purga, ayuda con la hidropesía, la ictericia y las fiebres crónicas, y que en general es malo para el estómago {cite:canon-ibn-sina-print-v1 p.424} {cite:canon-ibn-sina-print-v1 p.425}."
  fr: "Une sorte d'absinthe légèrement piquante et irritante. La plus grande variété débloque les blocages profonds et cicatrise les plaies récentes; la plus petite est plus irritante. Mélangée à du vinaigre, elle est appliquée sur une rate enflée. Le livre indique qu'elle favorise la diurèse, purifie, soulage l'hydropisie, la jaunisse et les fièvres chroniques, et qu'elle est généralement déconseillée à l'estomac {cite:canon-ibn-sina-print-v1 p.424} {cite:canon-ibn-sina-print-v1 p.425}."
  tr: "Hafif ısıya sahip bir pelin türü; büyük olan kapakçık açarak yumuşak yaraları iyileştirir, küçük olan dalak tümörleri için sirke ile kaplanır, idrar söktürücü olarak işlev görür ve idrara çıkmayı kolaylaştırır, ayrıca asit ve kronik diyetlere karşı faydalıdır. Genellikle mide için zararlıdır {cite:canon-ibn-sina-print-v1 s.424} {cite:canon-ibn-sina-print-v1 s.425}."
  id: "Jenis wormwood dengan panas ringan; jenis yang lebih besar membuka katup dan menyembuhkan luka lunak, yang kecil dilapisi cuka untuk tumor limpa, berfungsi sebagai diuretik dan memudahkan buang air kecil, serta bermanfaat untuk asites dan pola makan kronis. Umumnya buruk untuk lambung {cite:canon-ibn-sina-print-v1 hlm.424} {cite:canon-ibn-sina-print-v1 hlm.425}."
