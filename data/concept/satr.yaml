label:
  ar: ستر المسلم
  en: Concealing a Muslim's fault (satr)
summary:
  ar: "ستر المسلم في حديث أبي هريرة — السادس والثلاثون من الأربعين — من أعمال إعانة الأخ التي يجازى عليها من جنسها: «ومن ستر مسلماً ستره الله في الدنيا والآخرة»، وهو كف إطلاع الناس على عورة أخيه في دينه أو دنياه وعدم هتك ستره، مقروناً بتنفيس الكرب والتيسير على المعسر وقاعدة «الله في عون العبد ما كان العبد في عون أخيه» — فالستر نوع من الإعانة يكافأ عليه مثله في الدارين (جامع العلوم والحكم ص 731)."
  en: "Concealing a Muslim, in Abu Hurayra's hadith — the thirty-sixth of the Forty — is one of the acts of aiding a brother that are repaid in kind: 'whoever conceals a Muslim, God will conceal him in this world and the next' — shielding a brother's exposed fault in religion or worldly affairs from people's eyes and not tearing his covering, set alongside relieving distress, easing for the insolvent, and the rule 'God is at the servant's aid so long as the servant is at his brother's aid' — so that concealment is a form of aid rewarded with its like in both abodes (Jami' al-Ulum wal-Hikam p. 731)."
