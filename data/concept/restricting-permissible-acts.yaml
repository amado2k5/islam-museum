label:
  ar: تقييد المباح
  en: Restricting permissible acts
summary:
  ar: 'يصنف المؤلف الأحكام الخمسة: الواجب، والمندوب، والمباح، والمكروه، والحرام، فالمأمورات والمنهيات لا خيار فيها للمسلم، والمباح وحده فيه الخيار بين الفعل والترك {cite:usul-iqtisad-islami-0660 p. 95} {cite:usul-iqtisad-islami-0660 p. 96}. ويعرض قولًا عن الدسوقي من المالكية أن الإمام إن أمر بمندوب أو مباح وجبت طاعته، وإن أمر بمكروه ففي وجوب طاعته قولان، وإن أمر بمحرم فلا يطاع {cite:usul-iqtisad-islami-0660 p. 99}. ويرى المؤلف أن سلطة ولي الأمر تقيد المباح وحده، لأن المباح هو الذي يترجح فيه الفعل والترك بحسب المصلحة، وأنه لا يبلغ علمه أن أحدًا استوفى المسألة {cite:usul-iqtisad-islami-0660 p. 97} {cite:usul-iqtisad-islami-0660 p. 99}. ومن أمثلة التقييد أن عمر منع أكل اللحوم يومين في الأسبوع لقلتها، ومنع حذيفة من تزوج كتابية لما فيه من فتنة {cite:usul-iqtisad-islami-0660 p. 98}، ومنع صيد طير نادر، وتحديد اتجاه السير في الشارع {cite:usul-iqtisad-islami-0660 p. 98} {cite:usul-iqtisad-islami-0660 p. 99}.'
