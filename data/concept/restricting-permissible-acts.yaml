  id: maliki-dusuqi
  stance:
    ar: 'المالكية: طاعة الإمام تجب في المندوب والمباح، وتختلف في المكروه، ولا تجب في المحرم'
  summary:
    ar: ينقل المؤلف عن حاشية الدسوقي على الشرح الكبير أن الإمام إن أمر بمندوب أو مباح وجبت طاعته، وإن أمر بمكروه ففي وجوب طاعته قولان، وإن أمر بمحرم فلا طاعة فيه قولًا واحدًا {cite:usul-iqtisad-islami-0660 p. 99}.
    en: 'The author quotes al-Dusuqi''s Maliki gloss: the ruler''s command in a recommended or permissible matter binds; in a disliked matter there are two views; in a forbidden matter there is no obedience (p. 99).'
  sources:
  - source/usul-iqtisad-islami-0660
- tradition: academic
  id: author-permissible-only
  stance:
    ar: 'رأي المؤلف: التقييد مختص بالمباح، ولا يتعداه إلى المكروه أو المندوب'
  summary:
    ar: يرى المؤلف أن سلطة التقييد مقصورة على المباح، لأنه وحده يستوي فيه الفعل والترك، ويقرّ بأن المسألة تحتاج إلى بحث مستوفٍ لم يبلغه علمه {cite:usul-iqtisad-islami-0660 p. 99}.
    en: The author holds that the ruler's power to restrict is confined to the permissible, which alone allows both doing and leaving, and says the question needs fuller study (p. 99).
  sources:
  - source/usul-iqtisad-islami-0660
