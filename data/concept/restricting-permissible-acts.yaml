id: concept/restricting-permissible-acts
class: concept
kind: legal
label:
  ar: تقييد المباح
  en: Restricting permissible acts
  es: "Restringir los actos permitidos"
  fr: "Restreindre les actes autorisés"
  ur: "جائز کاموں کو محدود کرنا"
  tr: "İzin verilenlerin sınırlandırılması"
  id: "Membatasi apa yang diperbolehkan"
summary:
  ar: 'يصنف المؤلف الأحكام الخمسة: الواجب، والمندوب، والمباح، والمكروه، والحرام، فالمأمورات والمنهيات لا خيار فيها للمسلم، والمباح وحده فيه الخيار بين الفعل والترك {cite:usul-iqtisad-islami-0660 p. 95} {cite:usul-iqtisad-islami-0660 p. 96}. ويعرض قولًا عن الدسوقي من المالكية أن الإمام إن أمر بمندوب أو مباح وجبت طاعته، وإن أمر بمكروه ففي وجوب طاعته قولان، وإن أمر بمحرم فلا يطاع {cite:usul-iqtisad-islami-0660 p. 99}. ويرى المؤلف أن سلطة ولي الأمر تقيد المباح وحده، لأن المباح هو الذي يترجح فيه الفعل والترك بحسب المصلحة، وأنه لا يبلغ علمه أن أحدًا استوفى المسألة {cite:usul-iqtisad-islami-0660 p. 97} {cite:usul-iqtisad-islami-0660 p. 99}. ومن أمثلة التقييد أن عمر منع أكل اللحوم يومين في الأسبوع لقلتها، ومنع حذيفة من تزوج كتابية لما فيه من فتنة {cite:usul-iqtisad-islami-0660 p. 98}، ومنع صيد طير نادر، وتحديد اتجاه السير في الشارع {cite:usul-iqtisad-islami-0660 p. 98} {cite:usul-iqtisad-islami-0660 p. 99}.'
  tr: "Yazar beş hükmü sınıflandırır: zorunlu, tavsiye edilen, izinli, sevilmez ve yasak. Müslümanın emir ve yasak konusunda seçeneği yoktur, sadece izin verilen eylem ile nakarat arasında seçim hakkına sahiptir. {cite:usul-iqtisad-islami-0660 s. 95} {cite:usul-iqtisad-islami-0660 s. 96}. Malikilerden al-Dusuqi'den bir ifade sunar: Bir imam tavsiye edilen veya izin verilen birine emrederse, itaat edilmelidir; hoşlanmayan bir şeyi emrederse, itaat etme yükümlülüğü konusunda iki görüş vardır; ve yasak bir şeyi emrederse, itaat edilmez {cite:usul-iqtisad-islami-0660, s. 99}. Yazar, vasi yetkisinin yalnızca izin verileni sınırladığına inanır; çünkü izin verilen şey, çıkara göre eylem veya ihmalin üstün olduğu yetkiye sahiptir ve kimsenin bu konuyu yerine getirdiğinin farkında değildir {cite:usul-iqtisad-islami-0660 s. 97} {cite:usul-iqtisad-islami-0660 s. 99}. Kısıtlama örnekleri arasında Umar'ın et yemeyi haftada iki gün yemeyi yasaklaması, Hudhayfah'ın bir kadına evliliği yasaklaması {cite:usul-iqtisad-islami-0660 s. 98}, nadir kuşların avlanmasını yasaklaması ve sokakta yürüyüş yönünü kısıtlaması {cite:usul-iqtisad-islami-0660 s. 98} {cite:usul-iqtisad-islami-0660 s. 99} yer alır."
  id: "Penulis mengklasifikasikan lima keputusan: wajib, direkomendasikan, diperbolehkan, tidak disukai, dan dilarang. Muslim tidak memiliki pilihan dalam perintah dan larangan, dan hanya yang diperbolehkan yang memiliki pilihan antara bertindak dan menahan diri. {cite:usul-iqtisad-islami-0660 hlm. 95} {cite:usul-iqtisad-islami-0660 hlm. 96}. Ia menyampaikan pernyataan dari al-Dusuqi dari Malikis bahwa jika seorang imam memerintahkan orang yang direkomendasikan atau diperbolehkan, ia harus dipatuhi; jika ia memerintahkan sesuatu yang tidak disukai, ada dua pendapat mengenai kewajiban untuk mematuhinya; dan jika ia memerintahkan sesuatu yang dilarang, maka tidak ditaati {cite:usul-iqtisad-islami-0660, hlm. 99}. Penulis percaya bahwa otoritas wali hanya membatasi apa yang diperbolehkan, karena yang diperbolehkan adalah otoritas di mana tindakan atau kelalaian berlaku sesuai kepentingan, dan ia tidak mengetahui bahwa ada yang telah memenuhi masalah tersebut {cite:usul-iqtisad-islami-0660 hlm. 97} {cite:usul-iqtisad-islami-0660 hlm. 99}. Contoh pembatasan termasuk larangan Umar untuk makan daging dua hari seminggu karena kelangkaannya, Hudhayfah yang melarang pernikahan dengan wanita karena godaan {cite:usul-iqtisad-islami-0660 hlm. 98}, melarang berburu burung langka, dan membatasi arah berjalan di jalan {cite:usul-iqtisad-islami-0660 hlm. 98} {cite:usul-iqtisad-islami-0660 hlm. 99}."
