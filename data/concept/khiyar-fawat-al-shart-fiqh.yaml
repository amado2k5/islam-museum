id: concept/khiyar-fawat-al-shart-fiqh
class: concept
kind: legal
label:
  ar: خيار فوات الشرط
  en: Khiyar fawat al-shart (option for loss of the condition)
  ur: خیار فوات الشرط
  es: "Khiyar fawat al-shart (opción para la pérdida de la condición)"
  fr: "Khiyar fawat al-shart (option pour la perte de la condition)"
  tr: "Koşulu Kaçırma Seçeneği"
  id: "Opsi untuk Melewatkan Kondisi"
summary:
  ar: 'خيار فوات الشرط خيار يثبت بفوات الفعل المشروط من العاقد فوق مقتضى العقد، وفوات الشرط هو عدم تحقيق الغرض منه، وهو يشارك سائر الخيارات في سلب لزوم العقد وينفرد بإضافته المثبتة له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8000} عند الحنفية الأصل أن المشترط إذا امتنع العاقد الآخر عن الوفاء بشرط صحيح التزم به رجع إلى القضاء ليجبره على الوفاء إن كان الشرط مما يمكن الإجبار عليه، فإن لم يمكن إجباره كالتزام تقديم رهن بالثمن ثبت له حق فسخ العقد وإن لم يسموه خيار فوات الشرط، ونص الكاساني على أن البائع يخير المشتري بين دفع الرهن أو قيمته أو أداء الثمن عاجلا وإلا فسخ البيع لفوات الشرط والغرض، وجعل منه البيع بشرط إعطاء الكفيل دون شرط الحوالة والضمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8000}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8001} الشافعية أخذوا بمبدأ النهي عن بيع وشرط كالبيع بشرط الإقراض أو بشرط خياطة الثوب أو حصاد الزرع، لكنهم استثنوا صورا حكموا بصحتها كالبيع بشرط الأجل أو الرهن أو الكفيل مع العلم والتعيين أو بشرط الإشهاد، فإن لم يوف الملتزم بالشرط ثبت للمشترط الخيار لفوات الشرط وهو على الفور لأنه خيار نقص، ولا يجبر المشروط عليه على القيام بما شرط لزوال الضرر بالفسخ كما لا يقوم غير المعين مقامه إذا تلف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8001} الحنابلة نصوا على أنه في البيع بشرط الرهن والكفيل إن وفى الملتزم بالشرط لزم العقد وإن أبى فللمشترط الخيار بين الفسخ والإمضاء بدون مقابل عن ترك الرهن والكفيل، ومذهبهم أوسع المذاهب عناية بالشروط لأن الأصل في العقود رضا المتعاقدين ونتيجتها ما أوجباه على أنفسهما، فأباحوا أكثر من شرط الرهن والكفيل ما لم يصادم نصا شرعيا أو أصلا من أصول الشريعة، وقد يكون الشرط في ذاته غير ملزم شرعا ويصح اشتراطه وثمرته تمكين المشترط له من فسخ العقد عند عدم الوفاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8001}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8002} ولم يذكر الحنابلة خيار فوات الشرط في عداد خياراتهم إلا أن صاحب غاية المنتهى استوجه إضافة قسم تاسع على الخيارات الثمانية المتداولة عندهم وهو الخيار الثابت للمشتري لفقد شرط صحيح أو فاسد سواء أبطل العقد أم لم يبطله، وأقره الشارح وإن كانت فائدته شكلية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8002} نص الشافعية على أن الخيار الثابت للبائع عند عجز المشتري عن تسليم الرهن المشروط في البيع ينتقل إلى الوارث بلا خلاف، وتطبق في سقوطه وبقية أحكامه أحكام خيار العيب كما يفصل في خيار فوات الوصف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8002}'
  en: 'Khiyar fawat al-shart is an option established upon the loss of an act stipulated from the contractor beyond the contract''s own import, the loss of the condition being the failure of its purpose; it shares with the other options the removal of the contract''s binding force while having its own annexed ground. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8000} For the Hanafis the principle is that when the other party refuses to fulfil a valid condition he undertook, the stipulator resorts to the judge to compel fulfilment if it is a condition that can be compelled; where it cannot be compelled, such as an undertaking to give a pledge for the price, he has the right to annul the contract though they do not name it the option for loss of the condition, and al-Kasani states that the seller gives the buyer the choice between paying the pledge or its value or paying the price at once, else he annuls the sale for the loss of the condition and its purpose, counting among it the sale conditioned on giving a guarantor but not the stipulation of transfer or guarantee of debt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8000}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8001} The Shafiis took the principle of the prohibition of a sale with a condition, such as sale conditioned on lending, on the seller sewing the garment or harvesting the crop, but excepted forms they judged valid such as sale conditioned on a term, a pledge or a named guarantor with knowledge, or on attestation; if the obliged party does not fulfil the condition the stipulator holds the option for its loss, immediate because it is an option of deficiency, and the obliged party is not compelled to perform since the harm is removed by annulment, nor does another stand in place of the named pledge if it perishes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8001} The Hanbalis state that in a sale conditioned on a pledge and a guarantor, fulfilment binds the contract and refusal gives the stipulator the choice between annulment and confirmation without compensation for dropping the pledge and guarantor; their school is the widest in regard for conditions, holding that the basis of contracts is the parties'' consent and their outcome what the two imposed on themselves, so they allowed more than the pledge and guarantor provided it does not clash with a revealed text or a principle of the law, and a condition may be non-binding in itself yet validly stipulated, its fruit being to enable the stipulator to annul on non-fulfilment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8001}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8002} The Hanbalis did not list the option for loss of the condition among their options, though the author of Ghayat al-Muntaha deemed it right to add a ninth kind to the eight current among them, the option established for the buyer upon the loss of a valid or invalid condition whether or not it voids the contract, and the commentator approved the addition though its benefit is formal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8002} The Shafiis state that the seller''s option when the buyer is unable to hand over the pledge stipulated in the sale passes to the heir without dispute, and its lapse and remaining rules follow the rules of the option of defect as detailed under the option for loss of the description. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8002}'
  ur: 'خیار فوات الشرط وہ اختیار ہے جو عاقد کی جانب سے مقررہ فعل کے عقد کے مقتضا سے بڑھ کر ضائع ہونے پر ثابت ہوتا ہے، اور فوات شرط کا مطلب اس کے غرض کا حاصل نہ ہونا ہے؛ یہ ساری خیارات کے ساتھ عقد کی لزوم کو سلب کرنے میں شریک ہے مگر اپنی مخصوص اضافت سے ممتاز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8000} حنفیہ کے نزدیک اصل یہ ہے کہ اگر دوسرا عاقد اپنی قبول کی ہوئی صحیح شرط کی وفا سے انکار کرے تو مشترط قاضی سے رجوع کر کے اسے مجبور کرائے اگر شرط ایسی ہو جس پر اجبار ممکن ہو؛ اور جہاں اجبار ممکن نہ ہو جیسے ثمن کے عوض رہن دینے کا التزام، وہاں مشترط کو عقد فسخ کا حق ہوتا ہے اگرچہ وہ اسے خیار فوات الشرط نہیں کہتے، اور کاسانی نے لکھا کہ بائع خریدار کو رہن یا اس کی قیمت ادا کرنے یا ثمن فوراً ادا کرنے میں اختیار دیتا ہے ورنہ شرط اور غرض کے فوات پر بیع فسخ کرتا ہے، اور اس میں شرطِ کفیل کی بیع کو داخل کیا مگر شرطِ حوالہ و ضمان کو نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8000}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8001} شافعیہ نے بیع مع شرط کی ممانعت کے اصول کو اپنایا جیسے قرض دینے کی شرط پر بیع، کپڑا سلوانے یا فصل کاٹوانے کی شرط پر خرید، مگر انہوں نے بعض صورتوں کو صحیح ٹھہرا کر مستثنیٰ کیا جیسے اجل، رہن یا معین کفیل کی شرط پر بیع بشرط علم و تعیین، یا اقرار کے اشہاد کی شرط؛ پھر ملتزم شرط پوری نہ کرے تو مشترط کو فواتِ شرط پر خیار ثابت ہوتا ہے اور وہ فوری ہے کیونکہ یہ خیار نقص ہے، اور مشروط علیہ کو شرط پر مجبور نہیں کیا جاتا کیونکہ فسخ سے ضرر زائل ہو جاتا ہے، اور معین رہن کے تلف ہونے پر اس کے مقام غیر قائم نہیں ہو سکتا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8001} حنابلہ نے نص کیا کہ رہن و کفیل کی شرط والی بیع میں ملتزم شرط پوری کرے تو عقد لازم اور انکار کرے تو مشترط کو بغیر کسی بدلے کے فسخ اور امضاء میں اختیار ہے؛ ان کا مذہب شروط کی رعایت میں سب سے وسیع ہے کیونکہ عقود کی اصل متعاقدین کی رضامندی اور ان کا نتیجہ وہی ہے جو انہوں نے اپنے اوپر لازم کیا، لہٰذا انہوں نے رہن و کفیل سے زیادہ شرطیں جائز کیں بشرط یہ کہ وہ کسی شرعی نص یا شریعت کے اصول سے نہ ٹکرائیں، اور شرط خود اپنے ذات میں شرعاً غیر ملزم بھی ہو سکتی ہے مگر اس کا اشتراط صحیح ہوتا ہے اور اس کا ثمرہ عدمِ وفا پر مشترط کو فسخ کی اجازت ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8001}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8002} حنابلہ نے خیار فوات الشرط کو اپنی گنی ہوئی خیارات میں نہیں گنا، البتہ غایتہ المنتہیٰ کے مصنف نے ان کی آٹھ رائج خیارات پر نویں قسم کے اضافے کو درست جانا: وہ خیار جو مشتری کو صحیح یا فاسد شرط کے فوت ہونے پر ثابت ہوتا ہے خواہ وہ عقد باطل کرے یا نہ کرے، اور شارح نے اس استدراک کی تصدیق کی اگرچہ اس کا فائدہ صوری ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8002} شافعیہ نے نص کیا کہ بیع میں مقررہ رہن کی تسلیم سے خریدار کی عاجزی پر بائع کو جو خیار ثابت ہوتا ہے وہ بلا خلاف وارث کو منتقل ہوتا ہے، اور اس کے سقوط اور باقی احکام میں خیار العیب کے احکام جاری ہوتے ہیں جیسا خیار فوات الوصف میں مفصل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8002}'
  es: "Khiyar fawat al-shart es una opción establecida por la pérdida de un acto estipulado por el contratista más allá del alcance del contrato, siendo la pérdida de la condición el fracaso de su propósito; comparte con las otras opciones la eliminación de la fuerza vinculante del contrato, al tiempo que tiene su propio fundamento anexo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8000} Para los hanafíes, el principio es que cuando la otra parte se niega a cumplir una condición válida que asumió, el estipulante recurre al juez para obligar al cumplimiento si se trata de una condición que puede ser obligada; Cuando no se puede obligar, como por ejemplo el compromiso de dar una garantía por el precio, tiene derecho a anular el contrato, aunque no lo denominen opción por pérdida de la condición. Al-Kasani afirma que el vendedor da al comprador la opción de pagar la garantía o su valor, o pagar el precio de inmediato; de lo contrario, anula la venta por pérdida de la condición y su propósito, incluyendo entre ellas la venta condicionada a dar un aval, pero no la estipulación de transferencia o garantía de deuda. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8000}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8001} Los shafiíes adoptaron el principio de la prohibición de una venta con una condición, como la venta condicionada a un préstamo, a que el vendedor cosiera la prenda o cosechara el cultivo, pero exceptuaron formas que consideraron válidas, como la venta condicionada a un plazo, una prenda o un garante nombrado con conocimiento, o a una atestación; si la parte obligada no cumple la condición, el estipulante tiene la opción de su pérdida, inmediata porque es una opción de deficiencia, y la parte obligada no está obligada a cumplir ya que el daño se elimina por la anulación, ni otro ocupa el lugar de la prenda nombrada si esta perece. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8001} Los hanbalíes afirman que en una venta condicionada a una prenda y un garante, el cumplimiento vincula el contrato y la negativa da al estipulante la opción entre la anulación y la confirmación sin compensación por la pérdida de la prenda y el garante; su escuela es la más amplia con respecto a las condiciones, sosteniendo que la base de los contratos es el consentimiento de las partes y su resultado es lo que ambos se impusieron a sí mismos, por lo que permitieron más que la prenda y el garante siempre que no entre en conflicto con un texto revelado o un principio de la ley, y una condición puede no ser vinculante en sí misma pero estar válidamente estipulada, siendo su fruto permitir al estipulante anular en caso de incumplimiento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8001}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8002} Los hanbalíes no incluyeron la opción por pérdida de la condición entre sus opciones, aunque el autor de Ghayat al-Muntaha consideró correcto agregar un noveno tipo a los ocho existentes entre ellos, la opción establecida para el comprador en caso de pérdida de una condición válida o inválida, ya sea que anule o no el contrato, y el comentarista aprobó la adición aunque su beneficio es formal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8002} Los shafiíes afirman que la opción del vendedor cuando el comprador no puede entregar la prenda estipulada en la venta pasa al heredero sin disputa, y su caducidad y reglas restantes siguen las reglas de la opción por defecto como se detalla en la opción por pérdida de la descripción. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8002}"
  fr: "Le Khiyar fawat al-shart est une option établie en cas de manquement à une obligation contractuelle excédant la portée du contrat lui-même, ce manquement entraînant la perte de son objet; il partage avec les autres options la suppression de la force obligatoire du contrat, tout en ayant son propre fondement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8000} Pour les Hanafites, le principe est que lorsque l'autre partie refuse de remplir une condition valable qu'elle a prise, le cocontractant s'adresse au juge pour contraindre à son exécution s'il s'agit d'une condition susceptible d'être imposée; Lorsque cela ne peut être imposé, comme par exemple dans le cas d'un engagement à fournir un nantissement pour le prix, le vendeur a le droit d'annuler le contrat, même si cette option n'est pas explicitement mentionnée comme une possibilité de résiliation pour cause de perte de la condition. Al-Kasani précise que si le vendeur laisse à l'acheteur le choix entre payer le nantissement ou sa valeur, ou payer le prix immédiatement, il annule la vente pour cause de perte de la condition et de son objet. Cette situation inclut la vente conditionnée par la fourniture d'un garant, mais non la stipulation d'un transfert ou d'une garantie de dette. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8000}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8001} Les Shafi'ites ont retenu le principe de l'interdiction de la vente avec condition, telle qu'une vente conditionnée à un prêt, à la confection d'un vêtement par le vendeur ou à la récolte d'une moisson, mais ont fait exception aux formes qu'ils jugeaient valides, telles que la vente conditionnée à un terme, à un gage ou à un garant nommé en connaissance de cause, ou à une attestation; si la partie obligée ne remplit pas la condition, le stipulant dispose d'une option pour sa perte, immédiate car il s'agit d'une option de défaut, et la partie obligée n'est pas contrainte d'exécuter puisque le préjudice est supprimé par annulation, et aucun autre ne se substitue au gage nommé s'il périt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8001} Les Hanbalites affirment que dans une vente conditionnée par un gage et un garant, l'exécution de ces conditions rend le contrat exécutoire et le refus de les remplir donne au cocontractant le choix entre l'annulation et la confirmation du contrat sans indemnisation pour la perte du gage et du garant; leur école est la plus large en ce qui concerne les conditions, considérant que le fondement des contrats est le consentement des parties et que leur résultat est ce que les deux parties se sont imposé. Ils ont donc autorisé plus que le gage et le garant, à condition que cela ne contrevienne pas à un texte révélé ou à un principe de la loi, et une condition peut être non contraignante en elle-même mais valablement stipulée, son but étant de permettre au cocontractant d'annuler le contrat en cas de non-exécution. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8001}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8002} Les Hanbalites n'ont pas inclus l'option pour perte de la condition parmi leurs options. Cependant, l'auteur de Ghayat al-Muntaha a jugé opportun d'en ajouter une neuvième aux huit existantes: l'option accordée à l'acheteur en cas de perte d'une condition valable ou non, que cela entraîne ou non la nullité du contrat. Le commentateur a approuvé cet ajout, bien que son avantage soit purement formel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8002} Les Shafi'ites affirment que l'option du vendeur, lorsque l'acheteur est dans l'incapacité de remettre le gage stipulé dans la vente, est transmise à l'héritier sans contestation. Les règles relatives à sa caducité et à son maintien sont celles de l'option pour vice caché, telles que détaillées dans la section consacrée à l'option pour perte de la description. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8002}"
  tr: "Koşulun feshedilmesi seçeneği, yüklenicinin sözleşmenin gerekliliğinin ötesinde koşullu eylemi yerine getirmemesi ile belirlenir. Amacının yerine getirilmemesi, amacının yerine getirilmemesidir; bu da diğer tüm seçenekleri birleştirerek sözleşmenin bağlılığını iptal eder ve sözleşmeye yalnızca eklenir. {alıntı:Fiqh-mawsua-kuwaitiyya-noor-v3 s.8000} Hanefi ilke okuluna göre, diğer yüklenici taahhüt ettiği geçerli bir şartı yerine getirmeyi reddederse, eğer şart zorla yapılabiliyorsa, mahkemeye başvurur ve bu şartı yerine getirmeye zorlanır. Eğer fiyat üzerinden ipotek verme zorunluluğu gibi bir şey mümkün değilse, sözleşmeyi iptal etme hakkına sahiptir, hatta bu şartın feragat seçeneği olarak adlandırılmasa bile. Al-Kasani, satıcının alıcıya ipoteği veya ipoteği ödemek ya da fiyatı hızlıca ödemek arasında seçim yapma hakkı verdiğini; aksi takdirde koşul ve amacın kaybı nedeniyle satışın iptal edildiğini belirtmiştir. Satışı, devretme veya garanti koşulu olmadan kefil verilmesi şartına bağlamıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8000} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8001} Şafi'ler, satış ve şart yasaklama ilkesini benimsemiştir; örneğin, ödünç verme, giysi dikme veya ürün hasadı gibi satış yapma. Ancak, geçerli sayılan durumlarda, örneğin vadeli koşullu satış, ipotek, bilgi ve şartnameli kefil veya şahitlik şartı gibi durumlarda istisnalar koymuşlardır. Koşulu yerine getirmezse, koşullu taraf şartı kaybetme seçeneğine sahiptir ve bu da indirim seçeneğinden kaynaklanır. Koşullu, zararı iptal yoluyla giderme şartını yerine getirmeye zorlanmaz; tıpkı belirtilmemiş bir kişinin zarar görmüşse harekete geçmemesi gibi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8001} Hanbaliler, rehin ve kefil koşuluyla yapılan satışta, taraf şartı yerine getirirse sözleşmenin bağlı olduğunu; reddederse, koşullu kişinin rehin ve kefil yerine feshetme ile tazminatsız imzalama seçeneği olduğunu belirtmiştir. Onların düşünce okulu, sözleşmelerdeki temerrüt tarafların onayıdır ve sonuç da kendilerine dayattıkları şeydir. Bu nedenle, rehin ve kefil koşulundan daha fazlasına izin vermişlerdir, ancak bu şart bir Şeriat metniyle veya temel Şeriatla çelişmiyorsa. Koşul kendisi yasal bağlayıcı olmayabilir, koşul ve etkisi geçerlidir ve koşulun sahibi tarafın yerine getirilmemesi durumunda sözleşmeyi iptal etmesidir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.8001} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8002} Hanbaliler, şartın kendi seçenekleri arasında kaldırılma seçeneğinden bahsetmedi, ancak Ghaya al-Muntaha'nın yazarı, geçerli ya da geçersiz bir koşulun kaybı nedeniyle alıcının sabit opsiyonu olan sekiz opsiyona dokuzuncu bir bölüm eklenmesini önerdi; sözleşme geçersiz olsun ya da olmasın. Yorumcu bunu onayladı, faydası resmi olsa bile. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8002} Şafi'ler, alıcı koşullu ipoteği satışta teslim edemediğinde satıcının sabit opsiyonunun varise anlaşmazlıksız geçtiğini belirtir. Kusur opsiyonunun kararları, kaybı ve açıklamanın eksiklenmesi opsiyonunda detaylandırılan diğer kararlar için geçerlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8002}"
  id: "Opsi pengakhiran kondisi ditentukan oleh kegagalan kontraktor untuk melaksanakan tindakan bersyarat melebihi persyaratan kontrak. Kegagalan memenuhi tujuannya adalah kegagalan untuk memenuhi tujuannya, yang menggabungkan semua opsi lain dalam membatalkan ikatan kontrak dan secara eksklusif menambahkannya ke dalamnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8000} Menurut prinsip Hanafi, jika kontraktor lain menolak memenuhi syarat yang sah yang telah dijanjikan, ia kembali ke pengadilan untuk memaksanya memenuhi syarat tersebut jika syarat tersebut dapat dipaksakan. Jika tidak memungkinkan, seperti kewajiban memberikan hipotek dengan harga tersebut, ia berhak membatalkan kontrak, meskipun tidak disebut sebagai opsi pengabaian syarat. Al-Kasani menyatakan bahwa penjual memberikan pilihan kepada pembeli antara membayar hipotek atau nilainya atau membayar harga dengan cepat; jika tidak, penjualan dibatalkan karena hilangnya syarat dan tujuan. Ia menjadikan penjualan tersebut dengan syarat pemberian kepada penjamin tanpa syarat pengalihan atau jaminan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8000} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8001} Para Shafi'i mengadopsi prinsip larangan penjualan dan kondisi, seperti menjual dengan syarat meminjamkan, menjahit pakaian, atau panen tanaman. Namun, mereka membuat pengecualian dalam kasus yang dinyatakan sah, seperti penjualan dengan syarat bersyarat, hipotek, atau penjamin dengan pengetahuan dan spesifikasi, atau dengan syarat saksi. Jika pihak yang berkomitmen pada syarat tidak memenuhi syarat, pihak bersyarat memiliki opsi untuk kehilangan syarat tersebut, yang langsung disebabkan oleh opsi pengurangan. Pengkondisioner tidak diwajibkan memenuhi syarat menghilangkan kerugian dengan pembatalan, sama seperti orang yang tidak disebutkan tidak bertindak jika kerugian itu rusak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8001} Hanbalis telah menetapkan bahwa dalam penjualan dengan syarat gadai dan penjamin, jika pihak memenuhi syarat tersebut, kontrak terikat; jika dia menolak, kondisioner memiliki pilihan antara pengakhiran dan penandatanganan tanpa kompensasi daripada meninggalkan gadai dan penjamin. Aliran pemikiran mereka adalah aliran pemikiran terluas mengenai kondisi karena kegagalan dalam kontrak adalah persetujuan para pihak yang berkontrak, dan hasilnya adalah apa yang mereka tetapkan pada diri mereka sendiri. Oleh karena itu, mereka mengizinkan lebih dari sekadar syarat gadai dan penjamin kecuali bertentangan dengan teks Syariah atau Syariah dasar. Syarat itu sendiri mungkin tidak mengikat secara hukum, dan syarat serta efeknya berlaku, dan efeknya adalah pihak yang menerima syarat tersebut dapat membatalkan kontrak jika terjadi ketidakpatuhan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8001} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8002} Hanbalis tidak menyebutkan opsi pengecualian syarat di antara opsi mereka, tetapi penulis Ghaya al-Muntaha merekomendasikan penambahan bagian kesembilan pada delapan opsi yang biasanya mereka bagi, yaitu opsi tetap pembeli karena hilangnya kondisi yang sah atau tidak sah, baik kontrak batal maupun tidak. Komentator menyetujui hal ini meskipun manfaatnya formal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8002} Para Shafi'i menyatakan bahwa opsi tetap penjual ketika pembeli tidak dapat menyerahkan hipotek bersyarat dalam penjualan akan berpindah ke ahli waris tanpa sengketa. Putusan opsi cacat berlaku untuk kerugian dan putusan lain sebagaimana dijelaskan dalam opsi tidak menggambarkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8002}"
