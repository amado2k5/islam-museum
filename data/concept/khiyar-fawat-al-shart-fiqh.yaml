id: concept/khiyar-fawat-al-shart-fiqh
class: concept
kind: legal
label:
  ar: خيار فوات الشرط
  en: Khiyar fawat al-shart (option for loss of the condition)
  ur: خیار فوات الشرط
summary:
  ar: 'خيار فوات الشرط خيار يثبت بفوات الفعل المشروط من العاقد فوق مقتضى العقد، وفوات الشرط هو عدم تحقيق الغرض منه، وهو يشارك سائر الخيارات في سلب لزوم العقد وينفرد بإضافته المثبتة له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8000} عند الحنفية الأصل أن المشترط إذا امتنع العاقد الآخر عن الوفاء بشرط صحيح التزم به رجع إلى القضاء ليجبره على الوفاء إن كان الشرط مما يمكن الإجبار عليه، فإن لم يمكن إجباره كالتزام تقديم رهن بالثمن ثبت له حق فسخ العقد وإن لم يسموه خيار فوات الشرط، ونص الكاساني على أن البائع يخير المشتري بين دفع الرهن أو قيمته أو أداء الثمن عاجلا وإلا فسخ البيع لفوات الشرط والغرض، وجعل منه البيع بشرط إعطاء الكفيل دون شرط الحوالة والضمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8000}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8001} الشافعية أخذوا بمبدأ النهي عن بيع وشرط كالبيع بشرط الإقراض أو بشرط خياطة الثوب أو حصاد الزرع، لكنهم استثنوا صورا حكموا بصحتها كالبيع بشرط الأجل أو الرهن أو الكفيل مع العلم والتعيين أو بشرط الإشهاد، فإن لم يوف الملتزم بالشرط ثبت للمشترط الخيار لفوات الشرط وهو على الفور لأنه خيار نقص، ولا يجبر المشروط عليه على القيام بما شرط لزوال الضرر بالفسخ كما لا يقوم غير المعين مقامه إذا تلف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8001} الحنابلة نصوا على أنه في البيع بشرط الرهن والكفيل إن وفى الملتزم بالشرط لزم العقد وإن أبى فللمشترط الخيار بين الفسخ والإمضاء بدون مقابل عن ترك الرهن والكفيل، ومذهبهم أوسع المذاهب عناية بالشروط لأن الأصل في العقود رضا المتعاقدين ونتيجتها ما أوجباه على أنفسهما، فأباحوا أكثر من شرط الرهن والكفيل ما لم يصادم نصا شرعيا أو أصلا من أصول الشريعة، وقد يكون الشرط في ذاته غير ملزم شرعا ويصح اشتراطه وثمرته تمكين المشترط له من فسخ العقد عند عدم الوفاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8001}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8002} ولم يذكر الحنابلة خيار فوات الشرط في عداد خياراتهم إلا أن صاحب غاية المنتهى استوجه إضافة قسم تاسع على الخيارات الثمانية المتداولة عندهم وهو الخيار الثابت للمشتري لفقد شرط صحيح أو فاسد سواء أبطل العقد أم لم يبطله، وأقره الشارح وإن كانت فائدته شكلية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8002} نص الشافعية على أن الخيار الثابت للبائع عند عجز المشتري عن تسليم الرهن المشروط في البيع ينتقل إلى الوارث بلا خلاف، وتطبق في سقوطه وبقية أحكامه أحكام خيار العيب كما يفصل في خيار فوات الوصف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8002}'
  en: 'Khiyar fawat al-shart is an option established upon the loss of an act stipulated from the contractor beyond the contract''s own import, the loss of the condition being the failure of its purpose; it shares with the other options the removal of the contract''s binding force while having its own annexed ground. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8000} For the Hanafis the principle is that when the other party refuses to fulfil a valid condition he undertook, the stipulator resorts to the judge to compel fulfilment if it is a condition that can be compelled; where it cannot be compelled, such as an undertaking to give a pledge for the price, he has the right to annul the contract though they do not name it the option for loss of the condition, and al-Kasani states that the seller gives the buyer the choice between paying the pledge or its value or paying the price at once, else he annuls the sale for the loss of the condition and its purpose, counting among it the sale conditioned on giving a guarantor but not the stipulation of transfer or guarantee of debt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8000}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8001} The Shafiis took the principle of the prohibition of a sale with a condition, such as sale conditioned on lending, on the seller sewing the garment or harvesting the crop, but excepted forms they judged valid such as sale conditioned on a term, a pledge or a named guarantor with knowledge, or on attestation; if the obliged party does not fulfil the condition the stipulator holds the option for its loss, immediate because it is an option of deficiency, and the obliged party is not compelled to perform since the harm is removed by annulment, nor does another stand in place of the named pledge if it perishes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8001} The Hanbalis state that in a sale conditioned on a pledge and a guarantor, fulfilment binds the contract and refusal gives the stipulator the choice between annulment and confirmation without compensation for dropping the pledge and guarantor; their school is the widest in regard for conditions, holding that the basis of contracts is the parties'' consent and their outcome what the two imposed on themselves, so they allowed more than the pledge and guarantor provided it does not clash with a revealed text or a principle of the law, and a condition may be non-binding in itself yet validly stipulated, its fruit being to enable the stipulator to annul on non-fulfilment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8001}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8002} The Hanbalis did not list the option for loss of the condition among their options, though the author of Ghayat al-Muntaha deemed it right to add a ninth kind to the eight current among them, the option established for the buyer upon the loss of a valid or invalid condition whether or not it voids the contract, and the commentator approved the addition though its benefit is formal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8002} The Shafiis state that the seller''s option when the buyer is unable to hand over the pledge stipulated in the sale passes to the heir without dispute, and its lapse and remaining rules follow the rules of the option of defect as detailed under the option for loss of the description. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8002}'
  ur: 'خیار فوات الشرط وہ اختیار ہے جو عاقد کی جانب سے مقررہ فعل کے عقد کے مقتضا سے بڑھ کر ضائع ہونے پر ثابت ہوتا ہے، اور فوات شرط کا مطلب اس کے غرض کا حاصل نہ ہونا ہے؛ یہ ساری خیارات کے ساتھ عقد کی لزوم کو سلب کرنے میں شریک ہے مگر اپنی مخصوص اضافت سے ممتاز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8000} حنفیہ کے نزدیک اصل یہ ہے کہ اگر دوسرا عاقد اپنی قبول کی ہوئی صحیح شرط کی وفا سے انکار کرے تو مشترط قاضی سے رجوع کر کے اسے مجبور کرائے اگر شرط ایسی ہو جس پر اجبار ممکن ہو؛ اور جہاں اجبار ممکن نہ ہو جیسے ثمن کے عوض رہن دینے کا التزام، وہاں مشترط کو عقد فسخ کا حق ہوتا ہے اگرچہ وہ اسے خیار فوات الشرط نہیں کہتے، اور کاسانی نے لکھا کہ بائع خریدار کو رہن یا اس کی قیمت ادا کرنے یا ثمن فوراً ادا کرنے میں اختیار دیتا ہے ورنہ شرط اور غرض کے فوات پر بیع فسخ کرتا ہے، اور اس میں شرطِ کفیل کی بیع کو داخل کیا مگر شرطِ حوالہ و ضمان کو نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8000}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8001} شافعیہ نے بیع مع شرط کی ممانعت کے اصول کو اپنایا جیسے قرض دینے کی شرط پر بیع، کپڑا سلوانے یا فصل کاٹوانے کی شرط پر خرید، مگر انہوں نے بعض صورتوں کو صحیح ٹھہرا کر مستثنیٰ کیا جیسے اجل، رہن یا معین کفیل کی شرط پر بیع بشرط علم و تعیین، یا اقرار کے اشہاد کی شرط؛ پھر ملتزم شرط پوری نہ کرے تو مشترط کو فواتِ شرط پر خیار ثابت ہوتا ہے اور وہ فوری ہے کیونکہ یہ خیار نقص ہے، اور مشروط علیہ کو شرط پر مجبور نہیں کیا جاتا کیونکہ فسخ سے ضرر زائل ہو جاتا ہے، اور معین رہن کے تلف ہونے پر اس کے مقام غیر قائم نہیں ہو سکتا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8001} حنابلہ نے نص کیا کہ رہن و کفیل کی شرط والی بیع میں ملتزم شرط پوری کرے تو عقد لازم اور انکار کرے تو مشترط کو بغیر کسی بدلے کے فسخ اور امضاء میں اختیار ہے؛ ان کا مذہب شروط کی رعایت میں سب سے وسیع ہے کیونکہ عقود کی اصل متعاقدین کی رضامندی اور ان کا نتیجہ وہی ہے جو انہوں نے اپنے اوپر لازم کیا، لہٰذا انہوں نے رہن و کفیل سے زیادہ شرطیں جائز کیں بشرط یہ کہ وہ کسی شرعی نص یا شریعت کے اصول سے نہ ٹکرائیں، اور شرط خود اپنے ذات میں شرعاً غیر ملزم بھی ہو سکتی ہے مگر اس کا اشتراط صحیح ہوتا ہے اور اس کا ثمرہ عدمِ وفا پر مشترط کو فسخ کی اجازت ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8001}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8002} حنابلہ نے خیار فوات الشرط کو اپنی گنی ہوئی خیارات میں نہیں گنا، البتہ غایتہ المنتہیٰ کے مصنف نے ان کی آٹھ رائج خیارات پر نویں قسم کے اضافے کو درست جانا: وہ خیار جو مشتری کو صحیح یا فاسد شرط کے فوت ہونے پر ثابت ہوتا ہے خواہ وہ عقد باطل کرے یا نہ کرے، اور شارح نے اس استدراک کی تصدیق کی اگرچہ اس کا فائدہ صوری ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8002} شافعیہ نے نص کیا کہ بیع میں مقررہ رہن کی تسلیم سے خریدار کی عاجزی پر بائع کو جو خیار ثابت ہوتا ہے وہ بلا خلاف وارث کو منتقل ہوتا ہے، اور اس کے سقوط اور باقی احکام میں خیار العیب کے احکام جاری ہوتے ہیں جیسا خیار فوات الوصف میں مفصل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8002}'
