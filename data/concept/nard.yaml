label: { ar: "النَّرْد", en: "Backgammon and games of chance (nard)", ur: "نرد ⁦(ایک کھیل)⁩", es: "Backgammon y juegos de azar (nard)", fr: "Backgammon et jeux de hasard (nard)", tr: "zar", id: "Dadu" }
summary:
  ar: "النرد في اللغة لعبة معروفة، وهو معرب، والشطرنج لعبة تعتمد على الفكر والتدبير، والنرد على الحرز والتخمين. واللعب بالنرد حرام عند جمهور الفقهاء من المالكية والحنابلة والصحيح عند الشافعية، ويكره تحريماً عند الحنفية، لحديث من لعب بالنرد فقد عصى الله ورسوله، ولأن القمار به ميسر حرام، ولأنه عبث ولهو. وقاس الرافعي عليه كل ما معتمده التخمين، أما ما معتمده الحساب كالمنقلة فلا يحرم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15646} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15647}"
  en: "Nard, in the lexicon, is a well-known game; the word is Persian. Shatranj relies on thought and planning, while nard relies on chance and guesswork. Playing nard is forbidden by most jurists (Malikis, Hanbalis, and the sounder Shafi'i view), and disliked as forbidden by some Hanafis, on the hadith that whoever plays nard has disobeyed God and His Messenger, and because gambling with it is forbidden and it is idle sport. Al-Rafi'i extends the ruling to every game whose basis is guesswork, while games that rest on counting, such as the mancala-like board, are not forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15646} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15647}"
  ur: "نرد ایک مشہور کھیل ہے جو تخمین اور قسمت پر چلتا ہے۔ جمہور کے نزدیک اس کا کھیلنا حرام ہے، جبکہ حنفیہ کے نزدیک مکروہ تحریمی ہے۔ جس کھیل کی بنیاد حساب پر ہو وہ حرام نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15646} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15647}"
  es: "Nard, en el léxico, es un juego muy conocido; la palabra es persa. Shatranj se basa en el pensamiento y la planificación, mientras que nard se basa en el azar y la intuición. Jugar a nard está prohibido por la mayoría de los juristas (malikíes, hanbalíes y la opinión shafi'í más sólida), y algunos hanafíes lo desaprueban, basándose en el hadiz que dice que quien juega a nard ha desobedecido a Dios y a Su Mensajero, y porque apostar con él está prohibido y es un pasatiempo ocioso. Al-Rafi'i extiende la norma a todo juego cuya base sea la intuición, mientras que los juegos que se basan en el conteo, como el tablero tipo mancala, no están prohibidos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15646} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15647}"
  fr: "Le nard, dans le lexique, est un jeu bien connu; le mot est persan. Le shatranj fait appel à la réflexion et à la stratégie, tandis que le nard repose sur le hasard et la conjecture. Jouer au nard est interdit par la plupart des juristes (malikites, hanbalites et l’école shafi’ite, plus rigoureuse), et désapprouvé par certains hanafites, en raison du hadith selon lequel quiconque joue au nard a désobéi à Dieu et à Son Messager, et parce que les jeux de hasard avec ce jeu sont interdits et qu’il s’agit d’un divertissement futile. Al-Rafi’i étend cette interdiction à tout jeu basé sur la conjecture, tandis que les jeux de comptage, comme le jeu de plateau de type mancala, ne sont pas interdits. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15646} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15647}"
  tr: "Zar, dilde iyi bilinen bir oyundur ve Araplaştırılmıştır, satranç düşünce ve planlamaya dayanan bir oyundur, zarlar ise madeni para ve tahmine dayanır. Maliki ve Hanbali mezhebinden çoğu fıkâh tarafından zar oynamak yasaktır ve Şafiiler tarafından sevilmez, ancak Hanefiler tarafından sevilmez; çünkü zar oynayanın Allah ve Elçi'ye itaatsizlik ettiği hadisleri, onunla kumar oynamak kolay olduğu ve boş ve eğlence olduğu için sevilmez. El-Rafi'i ona her şeyi tahmine dayalı olarak uygular, ancak hesaplamaya dayalı olan, örneğin transfer yasak değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15646} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15647}"
  id: "Dadu adalah permainan yang terkenal dalam bahasa ini dan telah diarabisasi, catur adalah permainan yang didasarkan pada pemikiran dan perencanaan, dan dadu didasarkan pada koin dan tebakan. Bermain dadu dilarang menurut mayoritas ahli hukum dari aliran Maliki dan Hanbali, dan tidak disukai oleh para Shafi'i, tetapi tidak disukai oleh Hanafi, karena hadits bahwa siapa pun yang bermain dadu telah melanggar taat Allah dan Rasul-Nya, dan karena berjudi dengan dadu itu mudah dilarang, dan karena itu dianggap remeh dan hiburan. Al-Rafi'i menerapkan segala sesuatu yang didasarkan pada tebakan, tetapi apa yang didasarkan pada perhitungan, seperti transfer, tidak dilarang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15646} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15647}"
