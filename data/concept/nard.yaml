label: { ar: "النَّرْد", en: "Backgammon and games of chance (nard)", ur: "نرد (ایک کھیل)" }
summary:
  ar: "النرد في اللغة لعبة معروفة، وهو معرب، والشطرنج لعبة تعتمد على الفكر والتدبير، والنرد على الحرز والتخمين. واللعب بالنرد حرام عند جمهور الفقهاء من المالكية والحنابلة والصحيح عند الشافعية، ويكره تحريماً عند الحنفية، لحديث من لعب بالنرد فقد عصى الله ورسوله، ولأن القمار به ميسر حرام، ولأنه عبث ولهو. وقاس الرافعي عليه كل ما معتمده التخمين، أما ما معتمده الحساب كالمنقلة فلا يحرم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15646} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15647}"
  en: "Nard, in the lexicon, is a well-known game; the word is Persian. Shatranj relies on thought and planning, while nard relies on chance and guesswork. Playing nard is forbidden by most jurists (Malikis, Hanbalis, and the sounder Shafi'i view), and disliked as forbidden by some Hanafis, on the hadith that whoever plays nard has disobeyed God and His Messenger, and because gambling with it is forbidden and it is idle sport. Al-Rafi'i extends the ruling to every game whose basis is guesswork, while games that rest on counting, such as the mancala-like board, are not forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15646} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15647}"
  ur: "نرد ایک مشہور کھیل ہے جو تخمین اور قسمت پر چلتا ہے۔ جمہور کے نزدیک اس کا کھیلنا حرام ہے، جبکہ حنفیہ کے نزدیک مکروہ تحریمی ہے۔ جس کھیل کی بنیاد حساب پر ہو وہ حرام نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15646} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15647}"
