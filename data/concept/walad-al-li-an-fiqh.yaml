label:
  ar: "وَلد اللِّعان"
  en: "Child of li'an (walad al-li'an, fiqh)"
summary:
  ar: "ولد اللعان هو الولد الذي نفى الزوج نسبه بعد ملاعنته زوجته. وينقطع نسبه عن أبيه باللعان، ويمتنع التوارث والنفقة بينهما، ويجوز إقرار الملاعن به بعد نفيه وصحة إقراره، وتتفرع عن ذلك أحكام الشهادة والزكاة والقصاص والنكاح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17939}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17941}"
  en: "The child of li'an is the child whose lineage the husband denied after mutual cursing with his wife. Through li'an the lineage from the father is cut, inheritance and maintenance are barred, and the husband's later acknowledgement restores lineage. Rulings follow on testimony, zakat, retaliation and marriage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17939}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17941}"
  ur: "ولد اللعان وہ بچہ ہے جس کے نسب کا شوہر نے لعان کے بعد انکار کیا۔ لعان سے باپ سے نسب منقطع ہوتا ہے، اور اقرار کی صورت میں نسب بحال ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17939}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17940}"
