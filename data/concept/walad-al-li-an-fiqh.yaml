label:
  ar: "وَلد اللِّعان"
  en: "Child of li'an (walad al-li'an, fiqh)"
  es: "Hijo de li'an (walad al-li'an, fiqh)"
  fr: "Enfant de Li'an (walad al-li'an, fiqh)"
  ur: "لعان کا بچہ ⁦(والداللیان، فقہ)⁩"
  tr: "lanetin oğlu"
  id: "anak kutukan"
summary:
  ar: "ولد اللعان هو الولد الذي نفى الزوج نسبه بعد ملاعنته زوجته. وينقطع نسبه عن أبيه باللعان، ويمتنع التوارث والنفقة بينهما، ويجوز إقرار الملاعن به بعد نفيه وصحة إقراره، وتتفرع عن ذلك أحكام الشهادة والزكاة والقصاص والنكاح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17939}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17941}"
  en: "The child of li'an is the child whose lineage the husband denied after mutual cursing with his wife. Through li'an the lineage from the father is cut, inheritance and maintenance are barred, and the husband's later acknowledgement restores lineage. Rulings follow on testimony, zakat, retaliation and marriage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17939}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17941}"
  ur: "ولد اللعان وہ بچہ ہے جس کے نسب کا شوہر نے لعان کے بعد انکار کیا۔ لعان سے باپ سے نسب منقطع ہوتا ہے، اور اقرار کی صورت میں نسب بحال ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17939}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17940}"
  es: "El hijo de li'an es aquel cuya linaje el marido negó tras intercambiar maldiciones con su esposa. Mediante li'an se corta el linaje paterno, se prohíbe la herencia y la manutención, y el posterior reconocimiento del marido restablece el linaje. Las normas posteriores se aplican al testimonio, el zakat, la represalia y el matrimonio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17939}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17941}"
  fr: "L'enfant de li'an est celui dont le mari a renié la filiation après une injure mutuelle avec son épouse. Par le li'an, la filiation paternelle est rompue, l'héritage et la pension alimentaire sont interdits, et la reconnaissance ultérieure de la filiation par le mari rétablit la filiation. Des décisions sont ensuite rendues concernant le témoignage, la zakat, les représailles et le mariage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17939}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17941}"
  tr: "'Li'an'ın çocuğu, kocanın karısını lanetledikten sonra soyunu reddettiği çocuktur. Babasından olan soyu 'li'an' ile koparılır ve aralarındaki miras ve nafaka imkansızdır. İnkar ve geçerlilik sonrası laneti kabul etmek caizdir. Tanıklık, zekat, kısa ve evlilik hükümleri bundan türemiştir. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.17939} {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17941}"
  id: "Anak dari 'li'an' adalah anak yang garis keturunannya ditolak oleh suami setelah mengutuk istrinya. Garis keturunannya dari ayahnya terputus oleh 'li'an', dan warisan serta tunjangan di antara mereka tidak mungkin. Diperbolehkan mengakui kutukan setelah penolakan dan keabsahan pengakuan tersebut. Putusan kesaksian, zakat, qisa, dan pernikahan berasal dari ini. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17939} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.17941}"
