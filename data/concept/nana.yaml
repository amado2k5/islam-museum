summary:
  ar: "النعناع في الكتاب حار يابس في الثانية وفيه رطوبة فضلية، قوة مسخنة قابضة، من ألطف البقول جوهراً، لا يتجبن اللبن معه، ويقوي المعدة ويسكن الفواق ويمنع القيء، ويذكر له نقلاً موسوماً في الباه والحبل {cite:canon-ibn-sina-print-v1 p.577}."
  en: "Nana, mint, is in the book hot and dry in the second degree with a superfluous moisture, of a warming, astringent power, one of the finest herbs in substance, not curdling milk; it strengthens the stomach, calms hiccup and checks vomiting, and the book gives it a labelled listing on desire and conception {cite:canon-ibn-sina-print-v1 p.577}."
  ur: "نعناع کتاب میں دوسرے درجے میں گرم خشک ہے اور اس میں فاضل رطوبت ہے، گرم کرنے اور قبض کرنے کی قوت رکھتا ہے، سبزیوں میں جوہر کے لحاظ سے سب سے لطیف میں سے ہے، اس کے ساتھ دودھ نہیں پھٹتا؛ معدہ مضبوط کرتا، ہچکی کو تسکین دیتا اور قے روکتا ہے، اور کتاب باہ اور حمل کے بارے میں اس کی ایک موسوم نقل دیتی ہے {cite:canon-ibn-sina-print-v1 p.577}۔"
  es: "Nana, menta, es en el libro caliente y seco en segundo grado con una humedad superflua, de poder cálido y astringente, una de las hierbas más finas en sustancia, no cuaja la leche; fortalece el estómago, calma el hipo y detiene los vómitos, y el libro le da una entrada etiquetada sobre el deseo y la concepción {cite:canon-ibn-sina-print-v1 p.577}."
  fr: "Nana, la menthe, est dans le livre chaude et sèche au deuxième degré avec une humidité excessive, d'un pouvoir réchauffant et astringent, l'une des herbes les plus fines en substance, ne faisant pas cailler le lait; elle fortifie l'estomac, calme le hoquet et arrête les vomissements, et le livre lui donne une liste étiquetée sur le désir et la conception {cite:canon-ibn-sina-print-v1 p.577}."
