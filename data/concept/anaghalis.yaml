id: concept/anaghalis
class: concept
kind: natural
label:
  ar: "أنا غلس"
  en: "Anaghalis (leech herb)"
  fr: "Anaghalis (herbe aux sangsues)"
  ur: "انا غلس ⁦(جونک کی جڑی بوٹی)⁩"
  es: "Anaghalis (hierba sanguijuela)"
summary:
  ar: "حشيشة لها ضربان، زهرة أحدهما صفراء والأخرى إسمانجونية، تصلح الجراحات وتمنع تورّمها وانتشار القروح، وتخرج البلغم من الرأس عند المضمضة أو السعوط، وتنفع وجع الكلية والسموم بالشراب، ويزعم قوم أمراً في الزهر الأزرق والأحمر في المقعدة {cite:canon-ibn-sina-print-v1 p.378}."
  en: "A herb with two kinds, one with a yellow flower and the other with a violet-blue flower. It suits wounds, prevents their swelling and the spread of ulcers, draws much phlegm from the head when used as a gargle or snuff, and with wine helps kidney pain and snakebite. Some claim a thing about the blue and red flowers and the anus {cite:canon-ibn-sina-print-v1 p.378}."
  fr: "Une herbe de deux sortes, l’une à fleur jaune et l’autre à fleur bleu violacé. Elle convient aux plaies, empêche leur enflure et l’extension des ulcères, tire beaucoup de phlegme de la tête lorsqu’on l’emploie en gargarisme ou en prise par le nez, et avec du vin soulage la douleur des reins et la morsure de serpent. Certains avancent une affirmation sur les fleurs bleue et rouge et l’anus {cite:canon-ibn-sina-print-v1 p.378}."
  ur: "ایک جڑی بوٹی جس کی دو قسمیں ہیں: ایک کا پھول پیلا ہے اور دوسری کا آسمانی نیلا۔ یہ زخموں کے لیے موزوں ہے، ان کی سوجن اور ناسوروں کے پھیلاؤ کو روکتی ہے، کلی یا ناس کے طور پر سر کا بلغم بہت نکالتی ہے، اور شراب کے ساتھ گردے کے درد اور سانپ کے کاٹے میں نفع دیتی ہے۔ کچھ لوگ نیلے اور سرخ پھولوں کے بارے میں مقعد سے متعلق ایک دعویٰ کرتے ہیں {cite:canon-ibn-sina-print-v1 p.378}۔"
  es: "Hierba con dos variedades: una con flor amarilla y otra con flor azul violeta. Es beneficiosa para las heridas, previene la inflamación y la propagación de úlceras, ayuda a expulsar la flema de la cabeza al usarla como gárgara o rapé, y con vino alivia el dolor de riñón y las picaduras de serpiente. Algunos afirman que las flores azules y rojas tienen alguna relación con el ano {cite:canon-ibn-sina-print-v1 p.378}."
