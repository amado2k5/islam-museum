label:
  ar: "كَبائر"
  en: "Major sins (kaba'ir)"
  ur: "کبائر (بڑے گناہ)"
summary:
  ar: "الكبائر جمع كبيرة، وهي في الاصطلاح كل ذنب عظّم الشرع التوعد عليه بالعقاب أو عظمت مفسدته. ويُقسم جمهور العلماء المعاصي إلى صغائر وكبائر، ويتفقون على تحريم الكبائر. وقد عُدّت الكبائر بأعداد مختلفة، ولم يُحصرها أكثر العلماء في عدد. ومرتكب الكبيرة لا يخرج من الإيمان، ويُفسق ويُرد شهادته ما لم يتب، وتُغفر الصغائر باجتناب الكبائر عند الجمهور، ويُحبط الشرك العمل، ويكفر الإصرار على الصغيرة فتصير كبيرة في الحكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13165} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13166} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13168} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13172} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13173} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13174} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13178}"
  en: "Kaba'ir is the plural of kabira, which the jurists define as any sin the law threatens heavily or whose harm is great. Most scholars divide sins into minor and major and agree that major sins are forbidden; most do not confine the list to a fixed number. A believer who commits a major sin does not leave the faith; if he dies without repentance his fate is in God's hands, and he is not eternal in the Fire. Major sin ends the trust placed in a person's testimony until he repents. Most jurists hold that minor sins are forgiven by avoiding major sins. Shirk nullifies good deeds, persistence in a minor sin makes it major in judgement, and intercession is hoped for the people of major sins. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13165} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13166} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13168} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13172} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13173} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13174} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13178}"
  ur: "کبائر کبیرہ کی جمع ہے، اور فقہاء اصطلاح میں ہر اس گناہ کو کبیرہ کہتے ہیں جس پر شریعت نے سخت وعید دی ہو یا جس کا فساد بڑا ہو۔ جمہور علماء گناہوں کو صغائر اور کبائر میں تقسیم کرتے ہیں اور کبائر کی حرمت پر متفق ہیں، جبکہ اکثر علماء نے کبائر کی گنتی کو کسی مخصوص عدد میں محدود نہیں کیا۔ کبیرہ کا مرتکب ایمان سے خارج نہیں ہوتا؛ توبہ نہ کرے تو اس کا معاملہ اللہ کی مشیت پر ہے اور وہ ہمیشہ جہنم میں نہیں رہے گا۔ کبیرہ کے ارتکاب سے گواہی کا اعتبار اس وقت تک ختم ہو جاتا ہے جب تک توبہ نہ ہو۔ جمہور کے نزدیک کبائر سے بچنے سے صغائر معاف ہوتے ہیں، شرک عمل کو ضائع کرتا ہے، اور صغیرہ پر اصرار حکماً کبیرہ بن جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13165} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13166} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13168} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13172} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13173} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13174} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13178}"
