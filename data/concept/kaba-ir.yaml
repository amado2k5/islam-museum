summary:
  ar: "الكبائر جمع كبيرة، وهي في الاصطلاح كل ذنب عظّم الشرع التوعد عليه بالعقاب أو عظمت مفسدته. ويُقسم جمهور العلماء المعاصي إلى صغائر وكبائر، ويتفقون على تحريم الكبائر. وقد عُدّت الكبائر بأعداد مختلفة، ولم يُحصرها أكثر العلماء في عدد. ومرتكب الكبيرة لا يخرج من الإيمان، ويُفسق ويُرد شهادته ما لم يتب، وتُغفر الصغائر باجتناب الكبائر عند الجمهور، ويُحبط الشرك العمل، ويكفر الإصرار على الصغيرة فتصير كبيرة في الحكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13165} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13166} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13168} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13172} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13173} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13174} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13178}"
  en: "Kaba'ir is the plural of kabira, which the jurists define as any sin the law threatens heavily or whose harm is great. Most scholars divide sins into minor and major and agree that major sins are forbidden; most do not confine the list to a fixed number. A believer who commits a major sin does not leave the faith; if he dies without repentance his fate is in God's hands, and he is not eternal in the Fire. Major sin ends the trust placed in a person's testimony until he repents. Most jurists hold that minor sins are forgiven by avoiding major sins. Shirk nullifies good deeds, persistence in a minor sin makes it major in judgement, and intercession is hoped for the people of major sins. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13165} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13166} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13168} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13172} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13173} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13174} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13178}"
  ur: "کبائر کبیرہ کی جمع ہے، اور فقہاء اصطلاح میں ہر اس گناہ کو کبیرہ کہتے ہیں جس پر شریعت نے سخت وعید دی ہو یا جس کا فساد بڑا ہو۔ جمہور علماء گناہوں کو صغائر اور کبائر میں تقسیم کرتے ہیں اور کبائر کی حرمت پر متفق ہیں، جبکہ اکثر علماء نے کبائر کی گنتی کو کسی مخصوص عدد میں محدود نہیں کیا۔ کبیرہ کا مرتکب ایمان سے خارج نہیں ہوتا؛ توبہ نہ کرے تو اس کا معاملہ اللہ کی مشیت پر ہے اور وہ ہمیشہ جہنم میں نہیں رہے گا۔ کبیرہ کے ارتکاب سے گواہی کا اعتبار اس وقت تک ختم ہو جاتا ہے جب تک توبہ نہ ہو۔ جمہور کے نزدیک کبائر سے بچنے سے صغائر معاف ہوتے ہیں، شرک عمل کو ضائع کرتا ہے، اور صغیرہ پر اصرار حکماً کبیرہ بن جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13165} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13166} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13168} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13172} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13173} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13174} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13178}"
  es: "Kaba'ir es el plural de kabira, que los juristas definen como cualquier pecado que la ley amenaza gravemente o cuyo daño es grande. La mayoría de los eruditos dividen los pecados en menores y mayores y coinciden en que los pecados mayores están prohibidos; la mayoría no limita la lista a un número fijo. Un creyente que comete un pecado mayor no abandona la fe; si muere sin arrepentirse, su destino está en manos de Dios y no es eterno en el Fuego. El pecado mayor pone fin a la confianza depositada en el testimonio de una persona hasta que se arrepienta. La mayoría de los juristas sostienen que los pecados menores se perdonan evitando los mayores. El shirk anula las buenas obras, la persistencia en un pecado menor lo convierte en mayor en el juicio, y se espera la intercesión por quienes cometen pecados mayores. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13165} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13166} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13168} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13172} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13173} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13174} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13178}"
  fr: "Kaba'ir est le pluriel de kabira, terme que les juristes définissent comme tout péché pour lequel la loi menace gravement ou dont le préjudice est grand. La plupart des érudits distinguent les péchés mineurs des péchés majeurs et s'accordent à dire que les péchés majeurs sont interdits; la plupart ne fixent pas de nombre précis. Un croyant qui commet un péché majeur ne perd pas la foi; s'il meurt sans repentir, son sort est entre les mains de Dieu et il n'est pas voué à la damnation éternelle. Le péché majeur met fin à la confiance placée dans le témoignage d'une personne jusqu'à ce qu'elle se repente. La plupart des juristes estiment que les péchés mineurs sont pardonnés par l'abstention des péchés majeurs. Le shirk annule les bonnes actions, la persistance dans un péché mineur le rend majeur aux yeux de Dieu, et l'intercession est espérée pour ceux qui ont commis des péchés majeurs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13165} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13166} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13168} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13172} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13173} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13174} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13178}"
  tr: "Büyük günahlar çoğul olarak 'büyük' olarak kullanılır ve terminolojide, Şeriat'ın büyük ceza tehdidinde bulunduğu veya zararı büyük olan herhangi bir günahtır. Çoğu alim günahları küçük ve büyük günahlar olarak ayırır ve büyük günahların yasaklanması konusunda hemfikirdir. Büyük günahlar çeşitli sayılarda sayılır, ancak çoğu alim onları sınırlı sayıda günahla sınırlamamıştır. Büyük günah işlemiş kişi inancını terk etmez, günah işler ve tövbe etmedikçe tanıklığını reddeder. Küçük günahlar, çoğunluğa göre büyük günahlardan kaçınarak affedilir, çoktanrıcılık eylemleri geçersiz kılar ve küçük günahlarda ısrarcı kefaret olur, böylece yargıda büyük olurlar. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.13165} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13166} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13168} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13172} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13173} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13174} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13178}"
  id: "Dosa besar dijamak sebagai 'dosa besar,' dan dalam istilah itu, dosa tersebut adalah dosa apa pun yang sangat mengancam hukuman dalam Syariah atau yang bahayanya besar. Mayoritas ulama membagi dosa menjadi dosa kecil dan besar, dan sepakat tentang larangan dosa besar. Dosa besar dihitung dalam berbagai jumlah, tetapi kebanyakan ulama tidak membatasinya pada jumlah terbatas. Orang yang melakukan dosa besar tidak meninggalkan iman, berbuat dosa, dan menolak kesaksiannya kecuali ia bertobat. Dosa kecil diampuni dengan menghindari dosa besar menurut mayoritas, politeisme membatalkan perbuatan, dan ketekunan pada dosa kecil menjadi penebusan, menjadikannya besar dalam penilaian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13165} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13166} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13168} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13172} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13173} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13174} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13178}"
