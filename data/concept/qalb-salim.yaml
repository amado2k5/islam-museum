label:
  ar: "القلب السليم"
  en: "The sound heart (qalb salim)"
  ur: "قلبِ سلیم"
summary:
  ar: "القلب السليم في تعليم الشيخ عمر عبد الكافي هو القلب المنور بالإيمان، يقابله القلب الذي لا يعرف إلا النفاق والجمود. ويصف الشيخ أنواعا من القلوب: قلب نشيط، وقلب عابث، وقلب كسلان، ويعرض ذلك بوصفه رأيه في أحوال القلوب."
  en: "In Sheikh Omar Abdelkafy's lessons, the sound heart (qalb salim) is the heart lit by faith, set against the heart that knows only hypocrisy and hardness. He describes kinds of heart: an active heart, a heedless heart and a lazy heart, and presents this as his own description of states of the heart."
  ur: "شیخ عمر عبدالکافی کے درسوں میں قلبِ سلیم وہ دل ہے جو ایمان کے نور سے روشن ہو، اور اس کے مقابل وہ دل ہے جو نفاق اور سختی کے سوا کچھ نہیں جانتا۔ شیخ دلوں کی کئی قسمیں بیان کرتے ہیں: نشیط دل، غافل دل اور سست دل، اور اسے اپنی وضاحت کے طور پر پیش کرتے ہیں۔"
