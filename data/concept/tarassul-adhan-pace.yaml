label:
  ar: "الترسل"
  en: "Tarassul (measured pace in the call to prayer)"
  ur: "ترسل ⁦(اذان میں ٹھہراؤ)⁩"
  es: "Tarassul (ritmo pausado en la llamada a la oración)"
  fr: "Tarassul (rythme mesuré de l'appel à la prière)"
  tr: "İletim"
  id: "Transmisi"
summary:
  ar: "الترسل التمهل والتأني في الأذان بسكتة بين كل جملتين تسع إجابة السامع، من غير تمطيط ولا مد مفرط. وهو مسنون في الأذان، والحدر وهو الإسراع سنة في الإقامة ومكروه في الأذان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4961} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4962}"
  en: "Tarassul is a measured, unhurried pace in the call to prayer, with a pause between each two sentences long enough for a listener to answer, without drawn-out or excessive elongation. It is a sunna in the call; hadr, speeding up, is a sunna in the iqama and disliked in the call. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4961} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4962}"
  es: "Tarassul es un ritmo pausado y constante en la llamada a la oración, con una pausa entre cada dos frases lo suficientemente larga para que el oyente responda, sin prolongaciones excesivas. Es una sunna en la llamada; hadr, acelerar el ritmo, es una sunna en el iqama y no es recomendable en la llamada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4961} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4962}"
  fr: "Le tarassoul est un rythme mesuré et posé lors de l'appel à la prière, avec une pause entre chaque phrase suffisamment longue pour permettre à l'auditeur de répondre, sans allongement excessif. C'est une sunna lors de l'appel; le hadr, qui consiste à accélérer le rythme, est une sunna lors de l'iqama et est déconseillé lors de l'appel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4961} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4962}"
  ur: "تراسول اذان کی ایک ناپی گئی رفتار ہے، جس میں ہر دو جملوں کے درمیان ایک وقفہ اتنا لمبا ہوتا ہے کہ سننے والا جواب دے سکے، بغیر کھینچے ہوئے یا ضرورت سے زیادہ طوالت کے۔ اذان میں سنت ہے۔ حدر تیز کرنا اقامت میں سنت ہے اور اذان میں ناپسند ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 4961}"
  tr: "Göndermek, ezan çağrısında yavaşlık ve düşünceliliktir; her iki cümle arasında bir duraklama yapılır; bu da dinleyicinin yanıtını tatmin eder, aşırı germe veya uzatma olmadan. Namaz sırasında sünnettir ve 'hidr' ıkamayı hızlandırmanın sünnetidir; ezanda sevilmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4961} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4962}"
  id: "Mengirim adalah kelambatan dan pertimbangan dalam panggilan salat dengan henti di antara setiap dua kalimat yang memuaskan respons pendengar, tanpa peregangan berlebihan atau pemanjangan. Ini adalah Sunnah dalam panggilan shalat, dan 'hidr' adalah Sunnah mempercepat Iqamah, dan tidak disukai dalam panggilan shalat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4961} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4962}"
