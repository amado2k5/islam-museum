  ur: "ترسل (اذان میں ٹھہراؤ)"
summary:
  ar: "الترسل التمهل والتأني في الأذان بسكتة بين كل جملتين تسع إجابة السامع، من غير تمطيط ولا مد مفرط. وهو مسنون في الأذان، والحدر وهو الإسراع سنة في الإقامة ومكروه في الأذان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4961} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4962}"
  en: "Tarassul is a measured, unhurried pace in the call to prayer, with a pause between each two sentences long enough for a listener to answer, without drawn-out or excessive elongation. It is a sunna in the call; hadr, speeding up, is a sunna in the iqama and disliked in the call. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4961} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4962}"
