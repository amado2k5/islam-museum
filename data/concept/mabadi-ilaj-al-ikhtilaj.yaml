id: "concept/mabadi-ilaj-al-ikhtilaj"
class: "concept"
kind: "scientific"
label:
  ar: "مبادئ إيلاج الاختلاج"
  en: "Principles of treating ikhtilaj"
  ur: "اختلاج کے علاج کے اصول"
  es: "Principios del tratamiento de ikhtilaj."
  fr: "Principes du traitement de l'ikhtilaj"
  tr: "Füzyon Müdahalesinin İlkeleri"
  id: "Prinsip Intervensi Fusi"
summary:
  ar: "يعالج الاختلاج المتواتر بالكمادات المسخنة فإن لم يزل استعملت الأدهان المحللة من الأضعف إلى الأقوى ثم المسهل ودام تمريخ العضو بالمسخنة ⁦(أسماء الأدوية والمقادير لا تحمل)⁩ ويمنع ماء الجمد والخمر الكثير وما له نفخ وتبريد، وهو ختام الفن الثاني وأجلت الأورام وتفرقات الاتصال إلى الكتاب الرابع {cite:canon-ibn-sina-print-v2 p.160}"
  en: "Recurrent ikhtilaj is treated with heated compresses; if it does not clear, dissolving oils are used from the weaker to the stronger, then the laxative, and anointing the organ with warmers is kept up ⁦(drug names and measures are not carried)⁩; iced water, much wine and anything flatulent and cooling are withheld; this closes Fann 2, whose author defers the tumours and the solutions of continuity to Book IV {cite:canon-ibn-sina-print-v2 p.160}"
  ur: "مسلسل اختلاج کا علاج گرم کمادات سے ہوتا ہے؛ نہ جائے تو تحلیل دینے والے روغن کمزور سے مضبوط تک، پھر مسہل، اور عضو پر مسخنات کی مالش جاری رکھی جاتی ہے ⁦(ادویہ کے نام اور مقدار منقول نہیں)⁩؛ جمے ہوئے پانی، زیادہ شراب اور ہر نفاخ اور ٹھنڈی چیز سے منع کیا جاتا ہے؛ یہ فن دوم کا اختتام ہے جس میں مؤلف نے اورام اور تفرقات الاتصال کتاب چہارم تک مؤجل کیے {cite:canon-ibn-sina-print-v2 p.160}"
  es: "El ikhtilaj recurrente se trata con compresas calientes; si no desaparece, se utilizan aceites disolventes del más débil al más fuerte, luego el laxante, y se continúa ungiendo el órgano con sustancias calientes (no se incluyen nombres de medicamentos ni dosis); se evitan el agua helada, el vino en abundancia y cualquier cosa flatulenta o refrescante; con esto concluye Fann 2, cuyo autor pospone los tumores y las soluciones de continuidad al Libro IV {cite:canon-ibn-sina-print-v2 p.160}"
  fr: "L'ikhtilaj récurrent est traité par des compresses chaudes; s'il ne guérit pas, on utilise des huiles dissolvantes, des plus douces aux plus fortes, puis un laxatif, et l'on continue d'oindre l'organe avec des pommades chauffantes (les noms et les dosages des médicaments ne sont pas précisés); on évite l'eau glacée, le vin en grande quantité et tout ce qui est flatulent ou rafraîchissant; ceci conclut le chapitre 2 de Fann, dont l'auteur reporte le traitement des tumeurs et des solutions de continuité au livre IV {cite:canon-ibn-sina-print-v2 p.160}"
  tr: "Sık nöbetler ısıtılmış kompreslerle tedavi edilir; hala kullanılıyorsa, en zayıf olandan en güçlüye en zayıf olan ve ardından müshil uygulanır. Organ ısıtma ile uygulanır (ilaç ve içerik isimleri dahil edilmemiştir), aşırı dondurulmuş su ve alkol ile üfleme ve soğumaya neden olanlar yasaktır. Bu, ikinci sanatın sonudur. Tümörler ve iletişim sporları dördüncü kitaba ertelenmiştir {atıf:kanon-ibn-sina-print-v2 s.160}"
  id: "Kejang yang sering diobati dengan kompres panas; jika masih digunakan, yang terlemah hingga terkuat adalah yang terlemah dan kemudian pencahar. Organ diaplikasikan dengan pemanasan (nama obat dan bahan tidak termasuk), dan air beku serta alkohol berlebihan dilarang serta yang menyebabkan tiupan dan pendinginan. Ini adalah kesimpulan dari pasal kedua. Tumor dan spora komunikasi ditunda ke buku keempat {cite:canon-ibn-sina-print-v2 hlm.160}"
