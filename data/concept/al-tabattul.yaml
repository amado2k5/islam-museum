id: concept/al-tabattul
class: concept
kind: ethical
label:
  ar: التبتل والعزوف عن الدنيا
  en: Tabattul (withdrawal from the world)
  fr: "Tabattul (retrait du monde)"
  es: "Tabattul (retirada del mundo)"
  ur: "تبتول ⁦(دنیا سے دستبرداری)⁩"
  tr: "Islanmak ve dünyadan kaçınmak"
  id: "Basah dan menghindari dunia"
summary:
  ar: "التبتل عند الشيخ محمود شلتوت هو الاعتكاف عن الحياة والعزوف عن الدنيا عزوفاً مطلقاً: صوم دائم وترك للزواج والكسب والاكتفاء بالصومعة أو الكهف، ويرى أن الإسلام يحصر علاقة الإنسان بالدنيا في مسلكين لا ثالث لهما، وأن العزوف المطلق عن الدنيا ليس منهما {cite:azhar-quran-building-society-shaltut p. 21}{cite:azhar-quran-building-society-shaltut p. 23}. ويعد المؤلف هذا المسلك تعطيلاً لقوى التفكير والعمل التي منحها الله للإنسان، وإبقاءً لأسرار الكون مكنونة لا يُستفاد منها {cite:azhar-quran-building-society-shaltut p. 24}. ويرد على من احتج بنصوص ذم الدنيا بأن المذموم هو أن تتخذ نعم الله سبيلاً للهوى، لا ذات الحياة وما فيها من خير ونفع {cite:azhar-quran-building-society-shaltut p. 25}. ويذكر أن النبي أنكر على أصحابه حين أرادوا ترك النساء واللحم والنوم على الفراش، وأن الطيبات أبيحت للمؤمنين {cite:azhar-quran-building-society-shaltut p. 41}{cite:azhar-quran-building-society-shaltut p. 42}. ويذكر أن أحاديث الجوع وترك الشبع التي شاعت في كتب التصوف لا أصل لها في الصحيح المروي، بحسب قول الحفاظ {cite:azhar-quran-building-society-shaltut p. 44}{cite:azhar-quran-building-society-shaltut p. 45}."
  fr: "Pour le cheikh Mahmoud Shaltout, le tabattul est le retrait de la vie et le renoncement absolu au monde : jeûner sans cesse, renoncer au mariage et au travail rémunéré et se contenter d’un ermitage ou d’une grotte. Il estime que l’islam ne reconnaît que deux manières pour l’être humain de se rapporter au monde, et que le renoncement absolu n’est ni l’une ni l’autre {cite:azhar-quran-building-society-shaltut p. 21}{cite:azhar-quran-building-society-shaltut p. 23}. Selon lui, cette voie paralyse les facultés de réflexion et de travail que Dieu a données à l’être humain et laisse inexploités les secrets de l’univers {cite:azhar-quran-building-society-shaltut p. 24}. À ceux qui invoquent les textes blâmant le monde, il répond que le blâme vise le fait de mettre les bienfaits de Dieu au service de ses passions, et non la vie elle-même ni le bien et l’utilité qu’elle recèle {cite:azhar-quran-building-society-shaltut p. 25}. Il rappelle que le Prophète a désapprouvé ses compagnons lorsqu’ils ont voulu renoncer aux femmes, à la viande et au sommeil dans un lit, et que les bonnes choses ont été rendues licites aux croyants {cite:azhar-quran-building-society-shaltut p. 41}{cite:azhar-quran-building-society-shaltut p. 42}. Il relève que, d’après les spécialistes du hadith, les traditions sur la faim et le renoncement à la satiété répandues dans les ouvrages soufis n’ont pas de fondement dans les traditions authentiques transmises {cite:azhar-quran-building-society-shaltut p. 44}{cite:azhar-quran-building-society-shaltut p. 45}."
  tr: "Şeyh Mahmud Şaltut'a göre, hayattan mutlak inzivaya çekilme ve dünyadan mutlak uzak durma: sürekli oruç, evlilik ve kazançtan kaçınma ve bir silo ya da mağara ile yetinmek. İslam'ın bir kişinin dünyayla ilişkisini iki yola indirdiğine, üçüncü seçeneğin olmadığına ve dünyadan mutlak uzak durmanın bunlardan biri olmadığına inanır {cite:azhar-kuran-building-society-shaltut s. 21} {cite:azhar-kuran-building-society-shaltut s. 23}. Yazar, bu yolu Tanrı'nın insanlara verdiği düşünce ve eylem güçlerinin askıya alınması ve evrenin faydasız kalan sırlarının kalıntısı olduğunu düşünür {cite:azhar-kuran-building-society-shaltut s. 24}. Dünyayı kınayan metinlerle tartışanlara, suçlanacak olanın Tanrı'nın nimetlerinin bir arzu yolu olarak alınması, hayatın kendisi ve içindeki tüm iyilik ve faydalar değil olduğu yönünde bir karşılık verilir {atıf:] Ezher-Quran-Building-Society-shaltut s. 25}. Peygamber'in, sahabeleri kadınları, eti ve yatakta uyumayı bırakmak istediklerinde onları azarladığı ve müminlere iyi şeylerin izin verildiği belirtilir {cite:azhar-quran-building-society-shaltut s. 41} {cite:azhar-kuran-building-society-shaltut s. 42}. Tasavvuf kitaplarında yaygın olan açlık ve doluluktan kaçınma konusundaki hadislerin, ezberleyenlerin sözlerine göre gerçek rivayetlere dayanmadığı belirtilir {cite:azhar-quran-building-society-shaltut s. 44} {cite:azhar-quran-building-society-shaltut s. 45}."
  id: "Menurut Sheikh Mahmud Shaltut, penarikan mutlak dari kehidupan dan keterlepasan mutlak dari dunia: puasa terus-menerus, menghindari pernikahan dan keuntungan, serta puas dengan silo atau gua. Ia percaya bahwa Islam mereduksi hubungan seseorang dengan dunia menjadi dua jalan, bahwa tidak ada pilihan ketiga, dan bahwa penghindaran mutlak terhadap dunia bukanlah salah satu dari ini {cite:azhar-quran-building-society-shaltut hlm. 21} {cite:azhar-quran-building-society-shaltut hlm. 23}. Penulis menganggap jalan ini sebagai penangguhan kekuatan berpikir dan tindakan yang diberikan oleh Tuhan kepada manusia dan sisa rahasia tak berguna alam semesta {cite:azhar-quran-building-society-shaltut hlm. 24}. Bagi mereka yang berdebat dengan teks-teks yang mengutuk dunia, jawabannya adalah bahwa yang harus disalahkan adalah berkat Allah diambil sebagai jalan keinginan, bukan kehidupan itu sendiri dan semua kebaikan serta manfaat di dalamnya {kutipan:] Azhar-Quran-Building-Society-shaltut hlm. 25}. Dikatakan bahwa Nabi menegur sahabat-sahabatnya ketika mereka ingin berhenti tidur di wanita, daging, dan tempat tidur, dan bahwa hal-hal baik diizinkan bagi para mukmin {cite:azhar-quran-building-society-shaltut hlm. 41} {cite:azhar-quran-building-society-shaltut hlm. 42}. Dikatakan bahwa hadits yang umum ditemukan dalam kitab Sufi tentang menghindari kelaparan dan kenyang tidak didasarkan pada riwayat otentik menurut para hafal {cite:azhar-quran-building-society-shaltut hlm. 44} {cite:azhar-quran-building-society-shaltut hlm. 45}."
