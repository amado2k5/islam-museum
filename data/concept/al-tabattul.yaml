id: concept/al-tabattul
class: concept
kind: ethical
label:
  ar: التبتل والعزوف عن الدنيا
  en: Tabattul (withdrawal from the world)
summary:
  ar: "التبتل عند الشيخ محمود شلتوت هو الاعتكاف عن الحياة والعزوف عن الدنيا عزوفاً مطلقاً: صوم دائم وترك للزواج والكسب والاكتفاء بالصومعة أو الكهف، ويرى أن الإسلام يحصر علاقة الإنسان بالدنيا في مسلكين لا ثالث لهما، وأن العزوف المطلق عن الدنيا ليس منهما {cite:azhar-quran-building-society-shaltut p. 21}{cite:azhar-quran-building-society-shaltut p. 23}. ويعد المؤلف هذا المسلك تعطيلاً لقوى التفكير والعمل التي منحها الله للإنسان، وإبقاءً لأسرار الكون مكنونة لا يُستفاد منها {cite:azhar-quran-building-society-shaltut p. 24}. ويرد على من احتج بنصوص ذم الدنيا بأن المذموم هو أن تتخذ نعم الله سبيلاً للهوى، لا ذات الحياة وما فيها من خير ونفع {cite:azhar-quran-building-society-shaltut p. 25}. ويذكر أن النبي أنكر على أصحابه حين أرادوا ترك النساء واللحم والنوم على الفراش، وأن الطيبات أبيحت للمؤمنين {cite:azhar-quran-building-society-shaltut p. 41}{cite:azhar-quran-building-society-shaltut p. 42}. ويذكر أن أحاديث الجوع وترك الشبع التي شاعت في كتب التصوف لا أصل لها في الصحيح المروي، بحسب قول الحفاظ {cite:azhar-quran-building-society-shaltut p. 44}{cite:azhar-quran-building-society-shaltut p. 45}."
