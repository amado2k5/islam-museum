id: concept/al-tabattul
class: concept
kind: ethical
label:
  ar: التبتل والعزوف عن الدنيا
  en: Tabattul (withdrawal from the world)
  fr: "Tabattul (retrait du monde)"
summary:
  ar: "التبتل عند الشيخ محمود شلتوت هو الاعتكاف عن الحياة والعزوف عن الدنيا عزوفاً مطلقاً: صوم دائم وترك للزواج والكسب والاكتفاء بالصومعة أو الكهف، ويرى أن الإسلام يحصر علاقة الإنسان بالدنيا في مسلكين لا ثالث لهما، وأن العزوف المطلق عن الدنيا ليس منهما {cite:azhar-quran-building-society-shaltut p. 21}{cite:azhar-quran-building-society-shaltut p. 23}. ويعد المؤلف هذا المسلك تعطيلاً لقوى التفكير والعمل التي منحها الله للإنسان، وإبقاءً لأسرار الكون مكنونة لا يُستفاد منها {cite:azhar-quran-building-society-shaltut p. 24}. ويرد على من احتج بنصوص ذم الدنيا بأن المذموم هو أن تتخذ نعم الله سبيلاً للهوى، لا ذات الحياة وما فيها من خير ونفع {cite:azhar-quran-building-society-shaltut p. 25}. ويذكر أن النبي أنكر على أصحابه حين أرادوا ترك النساء واللحم والنوم على الفراش، وأن الطيبات أبيحت للمؤمنين {cite:azhar-quran-building-society-shaltut p. 41}{cite:azhar-quran-building-society-shaltut p. 42}. ويذكر أن أحاديث الجوع وترك الشبع التي شاعت في كتب التصوف لا أصل لها في الصحيح المروي، بحسب قول الحفاظ {cite:azhar-quran-building-society-shaltut p. 44}{cite:azhar-quran-building-society-shaltut p. 45}."
  fr: "Pour le cheikh Mahmoud Shaltout, le tabattul est le retrait de la vie et le renoncement absolu au monde : jeûner sans cesse, renoncer au mariage et au travail rémunéré et se contenter d’un ermitage ou d’une grotte. Il estime que l’islam ne reconnaît que deux manières pour l’être humain de se rapporter au monde, et que le renoncement absolu n’est ni l’une ni l’autre {cite:azhar-quran-building-society-shaltut p. 21}{cite:azhar-quran-building-society-shaltut p. 23}. Selon lui, cette voie paralyse les facultés de réflexion et de travail que Dieu a données à l’être humain et laisse inexploités les secrets de l’univers {cite:azhar-quran-building-society-shaltut p. 24}. À ceux qui invoquent les textes blâmant le monde, il répond que le blâme vise le fait de mettre les bienfaits de Dieu au service de ses passions, et non la vie elle-même ni le bien et l’utilité qu’elle recèle {cite:azhar-quran-building-society-shaltut p. 25}. Il rappelle que le Prophète a désapprouvé ses compagnons lorsqu’ils ont voulu renoncer aux femmes, à la viande et au sommeil dans un lit, et que les bonnes choses ont été rendues licites aux croyants {cite:azhar-quran-building-society-shaltut p. 41}{cite:azhar-quran-building-society-shaltut p. 42}. Il relève que, d’après les spécialistes du hadith, les traditions sur la faim et le renoncement à la satiété répandues dans les ouvrages soufis n’ont pas de fondement dans les traditions authentiques transmises {cite:azhar-quran-building-society-shaltut p. 44}{cite:azhar-quran-building-society-shaltut p. 45}."
