label:
  ar: "حرباء"
  en: "Hirba (the chameleon)"
  ur: "حرباء ⁦(گرگٹ)⁩"
  es: "Hirba (el camaleón)"
  fr: "Hirba (le caméléon)"
summary:
  ar: "الحرباء حيوان، يعرفه المحقّق بالحرباء. قيل إن دمها يمنع نبات الشعر المنتوف من العين، وقيل إن بيضها سمّ قاتل، وذكره الكتاب في الكتاب الرابع."
  en: "The hirba is an animal, which the editor identifies as the chameleon. It is said that its blood stops plucked eyelashes from growing back, and that its egg is a deadly poison, which the book gives in its fourth book."
  ur: "حرباء ایک جانور ہے، جسے مدوّن گرگٹ بتاتا ہے۔ کہا گیا ہے کہ اس کا خون اکھاڑی ہوئی پلکوں کو دوبارہ اگنے سے روکتا ہے، اور اس کا انڈا مہلک زہر ہے، جس کا ذکر کتاب چوتھی کتاب میں کرتی ہے۔"
  es: "El hirba es un animal que el editor identifica como el camaleón. Se dice que su sangre impide que las pestañas arrancadas vuelvan a crecer y que su huevo es un veneno mortal, dato que el libro menciona en su cuarto volumen."
  fr: "L'hirba est un animal que l'éditeur identifie comme étant le caméléon. On dit que son sang empêche la repousse des cils arrachés et que son œuf est un poison mortel, information révélée dans le quatrième livre de l'ouvrage."
