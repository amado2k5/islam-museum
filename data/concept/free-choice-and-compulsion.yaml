id: concept/free-choice-and-compulsion
class: concept
kind: belief
label: { ar: "الاختيار والقهر", en: "Free choice and compulsion", ur: "اختیار اور جبر" }
summary:
  ar: "يرى الشعراوي أن الله قهر أجناس الكون على ما أراد، فيما الإنسان مختار في الإيمان والطاعة، والمحبة لا تُنال بالقهر، ولذلك ترك الله للإنسان الاختيار ليعرف من يأتيه حباً ممن يأتيه قهراً {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1075} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1076}."
  en: "Sha'rawi holds that God compels the orders of creation as He wills, while the human is free in belief and obedience. Love cannot be compelled, so God left choice to humans to know who comes to Him by love and who by force {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1075} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1076}."
  ur: "شعراوی کے نزدیک اللہ نے کائنات کی اجناس کو اپنی مرضی کے مطابق مجبور کیا، جبکہ انسان ایمان اور اطاعت میں مختار ہے۔ محبت جبر سے حاصل نہیں ہوتی، اس لیے اللہ نے انسان کو اختیار دیا تاکہ معلوم ہو کہ کون محبت سے آتا ہے اور کون جبر سے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1075} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1076}۔"
