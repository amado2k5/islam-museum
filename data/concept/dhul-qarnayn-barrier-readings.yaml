id: concept/dhul-qarnayn-barrier-readings
class: concept
kind: term
label:
  ar: "قراءات سد ذي القرنين: أين وُضع ومن هو؟"
  en: "Readings of Dhu al-Qarnayn's barrier: where it was placed and who he was"
  ur: "ذوالقرنین کے بند کی قراءتیں: کہاں رکھا گیا اور وہ کون تھے"
summary:
  ar: "تذكر سورة الكهف أن ذا القرنين بلغ بين سدّين فبنى لقوم شكوا إفساد يأجوج ومأجوج ردماً من زبر الحديد والقطر، ولم تسمِّ المكان ولا زمنه ولا صاحبه؛ فنقل القرطبي عن ابن عباس أن السدين جبلان من قِبل أرمينية وأذربيجان {cite:jami-ahkam-quran-alam-kutub-bukhari vol. 11 p. 55}، ورأى ابن كثير أن ذا القرنين القرآني غير الإسكندر المقدوني {cite:tafsir-ibn-kathir-harvest-0012994 on 18:83}، وجمع ياقوت رواية سلّام الترجمان عن بعثة الواثق إلى السد {cite:mujam-al-buldan-yaqut-sader-shamela23735 vol. 3 pp. 197-200}."
  en: "Surat al-Kahf says Dhu al-Qarnayn reached a place between two barriers and built, for a people who complained of Gog and Magog's corruption, a rampart of iron blocks and molten metal; it names neither the place, the date nor the builder. Al-Qurtubi reports Ibn Abbas saying the two barriers were mountains on the side of Armenia and Azerbaijan {cite:jami-ahkam-quran-alam-kutub-bukhari vol. 11 p. 55}, Ibn Kathir held the Qur'anic Dhu al-Qarnayn to be someone other than Alexander of Macedon {cite:tafsir-ibn-kathir-harvest-0012994 on 18:83}, and Yaqut gathered Sallam the Interpreter's account of al-Wathiq's mission to the barrier {cite:mujam-al-buldan-yaqut-sader-shamela23735 vol. 3 pp. 197-200}."
  ur: "سورۂ کہف بتاتی ہے کہ ذوالقرنین دو بندوں کے درمیان پہنچے اور ایک ایسی قوم کے لیے جس نے یاجوج ماجوج کے فساد کی شکایت کی لوہے کے ٹکڑوں اور پگھلی دھات سے دیوار بنائی؛ مقام، زمانہ اور بانی کا نام نہیں بتایا گیا۔ قرطبی نے ابن عباس سے نقل کیا کہ دونوں بند ارمینیہ اور آذربائیجان کی جانب کے دو پہاڑ تھے {cite:jami-ahkam-quran-alam-kutub-bukhari vol. 11 p. 55}، ابن کثیر کی رائے میں قرآنی ذوالقرنین سکندر مقدونی کے سوا کوئی اور ہیں {cite:tafsir-ibn-kathir-harvest-0012994 on 18:83}، اور یاقوت نے واثق کے وفد کی بابت سلام ترجمان کی روایت جمع کی {cite:mujam-al-buldan-yaqut-sader-shamela23735 vol. 3 pp. 197-200}۔"
