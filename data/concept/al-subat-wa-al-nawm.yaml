id: concept/al-subat-wa-al-nawm
class: concept
kind: scientific
label:
  ar: "السبات والنوم"
  en: "Coma (al-subat) and sleep"
  fr: "Coma (al-subat) et sommeil"
  ur: "غنودگی ⁦(السبات)⁩ اور نیند"
  es: "Coma (al-subat) y sueño"
  tr: "Kış uykusu ve uyku"
  id: "Hibernasi dan tidur"
summary:
  ar: "يفتتح ابن سينا المقالة الرابعة بفصل السبات والنوم: يعرّف السبات بأنه النوم المفرط الثقيل في المدة والكيفية، ويعرّف النوم برجوع الروح النفساني عن آلات الحس والحركة، ويفصّل النوم الطبيعي وأنواع النوم غير الطبيعي {cite:canon-ibn-sina-print-v2 p.89} {cite:canon-ibn-sina-print-v2 p.90}"
  en: "Ibn Sina opens the fourth maqala with the chapter on coma and sleep: he defines coma as excessive sleep that is heavy in both length and kind, defines sleep as the return of the psychic pneuma from the instruments of sense and movement, and sets out natural sleep and the kinds of sleep that are not natural {cite:canon-ibn-sina-print-v2 p.89} {cite:canon-ibn-sina-print-v2 p.90}"
  fr: "Ibn Sina ouvre le quatrième maqala par le chapitre sur le coma et le sommeil. Il définit le coma comme un sommeil excessif, lourd par sa durée comme par sa nature, et le sommeil comme le retour du pneuma psychique depuis les organes des sens et du mouvement. Il distingue ensuite le sommeil naturel des différentes formes de sommeil non naturel {cite:canon-ibn-sina-print-v2 p.89} {cite:canon-ibn-sina-print-v2 p.90}"
  ur: "ابن سینا چوتھا مقالہ سبات اور نیند کے باب سے شروع کرتا ہے: سبات کو مدت اور کیفیت دونوں میں بھاری حد سے بڑھی نیند بتاتا ہے، نیند کو روحِ نفسانی کے حس اور حرکت کے آلات سے لوٹنے سے تعریف کرتا ہے، اور فطری نیند اور غیر فطری نیند کی قسمیں بیان کرتا ہے {cite:canon-ibn-sina-print-v2 p.89} {cite:canon-ibn-sina-print-v2 p.90}۔"
  es: "Ibn Sina abre la cuarta maqala con el capítulo sobre el coma y el sueño: define el coma como un sueño excesivo, pesado tanto en duración como en naturaleza; define el sueño como el retorno del pneuma psíquico desde los instrumentos de los sentidos y del movimiento; y expone el sueño natural y los tipos de sueño que no lo son. {cite:canon-ibn-sina-print-v2 p.89} {cite:canon-ibn-sina-print-v2 p.90}"
  tr: "İbn Sina dördüncü makaleye kış uykusu ile uykuyu ayırarak başlar: Kış uykusu, ağır süreli ve kalitede aşırı uyku olarak tanımlanır; uyku ise psikolojik ruhun duyusal ve motor cihazlardan çekilişi olarak tanımlanır ve doğal uykuyu anormal uyku türlerinden ayırır {cite:canon-ibn-sina-print-v2 s.89} {cite:canon-ibn-sina-print-v2 s.90}"
  id: "Ibn Sina memulai artikel keempatnya dengan membedakan antara hibernasi dan tidur: Hibernasi didefinisikan sebagai tidur berlebihan dengan durasi dan kualitas yang berat; tidur didefinisikan sebagai penarikan jiwa psikologis dari perangkat sensorik dan motorik serta membedakan tidur alami dari jenis tidur abnormal {cite:canon-ibn-sina-print-v2 hlm.89} {cite:canon-ibn-sina-print-v2 hlm.90}"
