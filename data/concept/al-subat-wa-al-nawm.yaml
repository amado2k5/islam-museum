id: concept/al-subat-wa-al-nawm
class: concept
kind: scientific
label:
  ar: "السبات والنوم"
  en: "Coma (al-subat) and sleep"
  ur: "غنودگی ⁦(السبات)⁩ اور نیند"
summary:
  ar: "يفتتح ابن سينا المقالة الرابعة بفصل السبات والنوم: يعرّف السبات بأنه النوم المفرط الثقيل في المدة والكيفية، ويعرّف النوم برجوع الروح النفساني عن آلات الحس والحركة، ويفصّل النوم الطبيعي وأنواع النوم غير الطبيعي {cite:canon-ibn-sina-print-v2 p.89} {cite:canon-ibn-sina-print-v2 p.90}"
  en: "Ibn Sina opens the fourth maqala with the chapter on coma and sleep: he defines coma as excessive sleep that is heavy in both length and kind, defines sleep as the return of the psychic pneuma from the instruments of sense and movement, and sets out natural sleep and the kinds of sleep that are not natural {cite:canon-ibn-sina-print-v2 p.89} {cite:canon-ibn-sina-print-v2 p.90}"
  ur: "ابن سینا چوتھا مقالہ سبات اور نیند کے باب سے شروع کرتا ہے: سبات کو مدت اور کیفیت دونوں میں بھاری حد سے بڑھی نیند بتاتا ہے، نیند کو روحِ نفسانی کے حس اور حرکت کے آلات سے لوٹنے سے تعریف کرتا ہے، اور فطری نیند اور غیر فطری نیند کی قسمیں بیان کرتا ہے {cite:canon-ibn-sina-print-v2 p.89} {cite:canon-ibn-sina-print-v2 p.90}۔"
