id: concept/al-aqalim-al-saba
class: concept
kind: scientific
label: { ar: "الأقاليم السبعة", en: "The seven climates" }
summary:
  ar: "كل ربع من الأرض شماليها وجنوبيها سبعة أقاليم عند أهل الهيئة، والعمارة بعد خط الاستواء أربع وعشرون درجة والباقي عمه البحر الكبير، والخلق على الربع الشمالي والربع الجنوبي خراب لشدة الحر فيه، وتعدم المواضع السكنى لإفراط الحر حتى تجعل الأرضين كلسية وتغيض مياهها أو لبعد الشمس عن الإقليم فيكتنفها البرد والجمد، وأفضل المسكون ما ينتهي إليه شعاع الشمس صافياً وهو الإقليم الرابع وهو العراق عند هذه الطائفة {cite:muruj-al-dhahab p. 519, 522}. وخالف المقدسي هذا التقسيم الفلكي فجعل أقاليم الإسلام أربعة عشر: ستة عربية — جزيرة العرب والعراق وأقور والشام ومصر والمغرب — وثمانية عجمية، مبتدئاً كل إقليم بمصره الذي حلّه السلطان وجمعت إليه الدواوين {cite:ahsan-al-taqasim pp. 43-45}."
  en: "Seven climates in each quarter of the earth — settlement reaching 24 degrees beyond the equator, the southern quarter desolate with heat, the rest drowned — and the fourth climate, Iraq, holding the fairest share where the sun's ray falls purest {cite:muruj-al-dhahab p. 519, 522}."
