label: { ar: "الأقاليم السبعة", en: "The seven climates", fr: "Les sept climats", es: "Los siete climas", ur: "سات آب و ہوا۔", tr: "Yedi Bölge", id: "Tujuh Wilayah" }
summary:
  ar: "كل ربع من الأرض شماليها وجنوبيها سبعة أقاليم عند أهل الهيئة، والعمارة بعد خط الاستواء أربع وعشرون درجة والباقي عمه البحر الكبير، والخلق على الربع الشمالي والربع الجنوبي خراب لشدة الحر فيه، وتعدم المواضع السكنى لإفراط الحر حتى تجعل الأرضين كلسية وتغيض مياهها أو لبعد الشمس عن الإقليم فيكتنفها البرد والجمد، وأفضل المسكون ما ينتهي إليه شعاع الشمس صافياً وهو الإقليم الرابع وهو العراق عند هذه الطائفة {cite:muruj-al-dhahab p. 519, 522}. وخالف المقدسي هذا التقسيم الفلكي فجعل أقاليم الإسلام أربعة عشر: ستة عربية — جزيرة العرب والعراق وأقور والشام ومصر والمغرب — وثمانية عجمية، مبتدئاً كل إقليم بمصره الذي حلّه السلطان وجمعت إليه الدواوين {cite:ahsan-al-taqasim pp. 43-45}."
  en: "Seven climates in each quarter of the earth — settlement reaching 24 degrees beyond the equator, the southern quarter desolate with heat, the rest drowned — and the fourth climate, Iraq, holding the fairest share where the sun's ray falls purest {cite:muruj-al-dhahab p. 519, 522}."
  fr: "Chaque quartier de la Terre compte sept climats. Le peuplement s’étend jusqu’à 24 degrés au-delà de l’équateur, le quartier méridional est désert à cause de la chaleur et la mer recouvre le reste. Le quatrième climat, celui de l’Irak, a la part la plus favorable : les rayons du soleil y tombent avec le plus de netteté {cite:muruj-al-dhahab p. 519, 522}."
  es: "Siete climas en cada cuadrante de la tierra: asentamientos que alcanzan los 24 grados más allá del ecuador, el cuadrante sur desolado por el calor, el resto inundado, y el cuarto clima, Irak, que posee la parte más justa donde el rayo del sol cae más puro {cite:muruj-al-dhahab p. 519, 522}."
  ur: "زمین کے ہر چوتھائی حصے میں سات آب و ہوا — خط استوا سے باہر 24 ڈگری تک پہنچنے والی بستی، جنوبی چوتھائی گرمی سے ویران، باقی ڈوب گئے — اور چوتھی آب و ہوا، عراق، جہاں سورج کی کرن سب سے زیادہ خالص ہوتی ہے 519، 522}۔"
  tr: "Dünyanın her çeyreği, kuzey ve güneyinde, Hay'ah halkı tarafından yedi bölge olarak kabul edilir. Bina ekvatorun yirmi dört derece ötesinde ve geri kalanı Büyük Deniz'dir. Kuzey ve güney mahallelerinin sakinleri, yoğun sıcaklık nedeniyle harabe halindedir. Konut alanları, aşırı sıcaklık nedeniyle toprakları kireçli ve sularının boğucu hale getirdiği ya da güneşin bölgeden uzakta olduğu için soğuk ve dondurucu bir ortam yaratır. En iyi yerleşim yeri, güneş ışınlarının net bir şekilde ulaştığı yerdir; bu dördüncü bölge ise bu gruba göre Irak'tır {cite:muruj-al-dhahab s. 519, 522}. El-Makdisi bu astronomik ayrımı reddetti ve İslam bölgelerini on dört olarak ayırdı: altı Arap bölgesi—Arap Yarımadası, Irak, Kur'an, Levant, Mısır ve Mağrip—ve sekiz Arap olmayan, her bölgenin kendi Mısır'ı ile başlayarak, sultanın bu Mısır'ı feshettiği ve diwanların toplandığı {atıf:ahsan-al-taqasim, ss. 43-45}."
  id: "Setiap seperempat dunia, utara dan selatan, dianggap sebagai tujuh wilayah oleh masyarakat Hay'ah. Bangunan ini berada dua puluh empat derajat di luar khatulistiwa, dan sisanya adalah Laut Besar. Penduduk lingkungan utara dan selatan hancur akibat panas yang sangat intens. Daerah pemukiman menciptakan lingkungan yang dingin dan membeku di mana panas berlebihan membuat tanah menjadi kapur dan air terasa sesak, atau karena matahari jauh dari wilayah tersebut. Pemukiman terbaik adalah di mana sinar matahari mencapai dengan jelas; wilayah keempat menurut kelompok ini adalah Irak {cite:muruj-al-dhahab hlm. 519, 522}. Al-Maqdisi menolak perbedaan astronomis ini dan membagi wilayah Islam menjadi empat belas wilayah: enam wilayah Arab—Semenanjung Arab, Irak, Al-Qur'an, Levant, Mesir, dan Maghib—serta delapan wilayah non-Arab, masing-masing dimulai dengan Mesirnya sendiri, di mana sultan membubarkan Mesir ini dan konsili berkumpul {kutipan: Ahsan-al-Taqasim, hlm. 43-45}."
