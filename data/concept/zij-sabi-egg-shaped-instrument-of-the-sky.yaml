label: { ar: "آلة البيضة على هيئة الفلك", en: "The egg-shaped instrument in the form of the heavenly sphere", ur: "فلک کی ہیئت پر بیضہ نامی آلہ", es: "El instrumento con forma de huevo tiene la forma de la esfera celeste.", fr: "L'instrument en forme d'œuf, à l'image de la sphère céleste", tr: "Astronomi biçimindeki yumurta şeklindeki makine", id: "Mesin berbentuk telur dalam bentuk astronomi" }
summary:
  ar: "تُتخذ كرة من نحاس محكمة الاستدارة صحيحة من كل جهة، سلسة السطح، ويُعلَّم فيها قطبان متقابلان، ويُقام خط بين القطبين على ظهر الكرة يقسمها بنصفين، ويُدار على أحدهما دائرة تقطع الكرة بنصفين ويُقسم ربعها بالتساوي، ويُدار دائرة أخرى بمقدار الدائرة الأولى تجوز على أعلى الكرة الأولى وتقطع الدائرة الأولى بنقطتين متقابلتين، فيكون لنا دائرتان تتقاطعان على نقطتين، إحداهما دائرة معدل النهار والأخرى دائرة فلك البروج. ويُقسم فلك البروج إلى اثني عشر برجاً، ويُقسم كل برج بثلاثين جزءاً. {cite:zij-sabi-nallino-byblion pp.213-214}"
  en: "A copper sphere, perfectly round on every side and smooth in surface, is made. Two opposite poles are marked on it, and a line set between them on the back of the sphere halves it. A circle that cuts the sphere in halves is drawn on one of them, with its quarter divided equally; a second circle is drawn across the first, cutting it at two opposite points, so that there are two circles crossing at two points: the equator of the day and the ecliptic. The ecliptic is divided into twelve signs and each sign into thirty parts. {cite:zij-sabi-nallino-byblion pp.213-214}"
  ur: "تانبے کی ایک کرہ لی جاتی ہے جو ہر طرف سے کامل گول اور سطح پر ہموار ہو۔ اس پر دو متقابل قطب نشان زد کیے جاتے ہیں، اور ان قطبوں کے درمیان کرہ کی پشت پر ایک نصف دائرہ کھینچا جاتا ہے۔ ایک دائرہ جو کرہ کو دو نصف میں کاٹے ہموار طریقے سے کھینچا جاتا ہے اور اس کا ربع برابر تقسیم ہوتا ہے؛ پھر ایک دوسرا دائرہ پہلے کے برابر کھینچا جاتا ہے جو پہلے کے اوپر سے گزرتا ہے اور پہلے کو دو متقابل نقطوں پر کاٹتا ہے، تو دو دائرے دو نقطوں پر متقاطع ہوتے ہیں: معدل النہار اور دائرۂ البروج۔ دائرۂ البروج بارہ بروج میں بٹتا ہے اور ہر برج تیس اجزا میں۔ {cite:zij-sabi-nallino-byblion pp.213-214}"
  es: "Se fabrica una esfera de cobre, perfectamente redonda por todos sus lados y de superficie lisa. Se marcan en ella dos polos opuestos, y una línea trazada entre ellos en la parte posterior de la esfera la divide por la mitad. En uno de los polos se dibuja un círculo que la divide en dos mitades iguales; se traza un segundo círculo que cruza el primero, dividiendo la esfera en dos puntos opuestos, de manera que dos círculos se cruzan en dos puntos: el ecuador del día y la eclíptica. La eclíptica se divide en doce signos y cada signo en treinta partes. {cite:zij-sabi-nallino-byblion pp.213-214}"
  fr: "On fabrique une sphère de cuivre, parfaitement ronde et lisse. Deux pôles opposés y sont marqués, et une ligne tracée entre eux, à l'arrière de la sphère, la divise en deux. Un cercle coupant la sphère en deux est tracé sur l'un des pôles, son quart étant divisé en deux parties égales; un second cercle est tracé perpendiculairement au premier, le coupant en deux points opposés, de sorte que deux cercles se croisent en deux points: l'équateur du jour et l'écliptique. L'écliptique est divisée en douze signes et chaque signe en trente parties. {cite:zij-sabi-nallino-byblion pp.213-214}"
  tr: "Düzgün yüzeyli, mükemmel yuvarlak bir bakır küre alınır ve üzerine iki zıt kutup işaretlenir. Kürenin arka tarafına kutuplar arasında bir çizgi çizilir ve küre ikiye bölünür. Kutuplardan birinin etrafında bir daire döndürülür, bu daire küreyi ikiye böler ve dörtte birini eşit olarak böler. Birinci daireyle aynı uzunlukta başka bir daire, birinci kürenin üstünden döndürülür ve birinci daireyi iki zıt noktada keser. Bu, iki noktada kesişen iki daireyle sonuçlanır: biri ekliptik, diğeri de ekliptiktir. Ekliptik on iki takımyıldıza bölünür ve her takımyıldız otuz parçaya daha bölünür. {cite:zij-sabi-nallino-byblion pp.213-214}"
  id: "Sebuah bola tembaga bundar sempurna dengan permukaan halus diambil, dan dua kutub yang berlawanan ditandai di atasnya. Sebuah garis ditarik di antara kutub-kutub tersebut di bagian belakang bola, membaginya menjadi dua. Sebuah lingkaran diputar di sekitar salah satu kutub, memotong bola menjadi dua dan membagi seperempatnya secara merata. Lingkaran lain, dengan panjang yang sama dengan yang pertama, diputar melintasi bagian atas bola pertama dan berpotongan dengan lingkaran pertama di dua titik yang berlawanan. Ini menghasilkan dua lingkaran yang berpotongan di dua titik: satu adalah ekliptika, dan yang lainnya adalah ekliptika. Ekliptika dibagi menjadi dua belas rasi bintang, dan setiap rasi bintang selanjutnya dibagi menjadi tiga puluh bagian. {cite:zij-sabi-nallino-byblion pp.213-214}"
