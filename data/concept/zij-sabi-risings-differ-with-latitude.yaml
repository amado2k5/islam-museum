label: { ar: "اختلاف مطالع البروج باختلاف عرض البلد في الزيج الصابي", en: "Why the risings of the signs differ with a place's latitude", ur: "عرض بلد کے ساتھ بروج کے مطالع کا اختلاف", es: "¿Por qué difieren los ascensos de los signos con la latitud de un lugar?", fr: "Pourquoi les signes astrologiques varient-ils selon la latitude d'un lieu ?" }
summary:
  ar: "يبدأ الباب الثالث عشر بمطالع البروج في كل بلد: ففي موضع معدل النهار تمر البروج في وسط السماء وفي الأفق بمقدار واحد من أزمان معدل النهار، أما في البلدان المائلة عنه إلى الشمال فتختلف المطالع، فيطلع البرج بأكثر من مطلوعه في الفلك المستقيم أو بأقل، ويطلع نظيره بأقل بقدر تلك الزيادة، ويكون غروب كل برج بقدر طلوع نظيره. {cite:zij-sabi-nallino-byblion p.43}."
  en: "Chapter 13 begins with the risings of the signs in each country. At the equator the signs pass through midheaven and the horizon by one and the same amount of equatorial times, but in places that lean north of it the risings differ: a sign rises by more than its rising in the right sphere or by less, its opposite rises by less by the amount of that excess, and each sign's setting equals the rising of its opposite. {cite:zij-sabi-nallino-byblion p.43}."
  ur: "تیرہواں باب ہر شہر میں بروج کے مطالع سے شروع ہوتا ہے: معدل النہار کے مقام پر بروج وسط السماء اور افق دونوں میں معدل النہار کے اوقات کی ایک ہی مقدار سے گزرتے ہیں، لیکن شمال کی طرف مائل شہروں میں مطالع مختلف ہو جاتے ہیں: کوئی برج فلک مستقیم کے مطلع سے زیادہ یا کم طلوع ہوتا ہے، اس کا نظیر اسی زیادتی کے برابر کم طلوع ہوتا ہے، اور ہر برج کا غروب اس کے نظیر کے طلوع کے برابر ہوتا ہے۔ {cite:zij-sabi-nallino-byblion p.43}۔"
  es: "El capítulo 13 comienza con la salida de los signos en cada país. En el ecuador, los signos pasan por el medio cielo y el horizonte en la misma cantidad de tiempos ecuatoriales, pero en los lugares que se inclinan al norte, las salidas difieren: un signo sale más o menos que en la esfera derecha, su opuesto sale menos en la cantidad de ese exceso, y la puesta de cada signo es igual a la salida de su opuesto. {cite:zij-sabi-nallino-byblion p.43}."
  fr: "Le chapitre 13 commence par les levers des signes dans chaque pays. À l'équateur, les signes passent par le milieu du ciel et l'horizon en une même durée équatoriale, mais dans les régions situées au nord de l'équateur, les levers diffèrent: un signe se lève plus ou moins que dans la sphère droite, son opposé se lève d'autant, et le coucher de chaque signe est égal au lever de son opposé. {cite:zij-sabi-nallino-byblion p.43}."
