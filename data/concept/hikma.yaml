id: concept/hikma
class: concept
kind: belief
label: { ar: "الحكمة", en: "Wisdom (hikma)", ur: "حکمت" }
summary:
  ar: "يعرّف الشعراوي الحكمة بأنها وضع الشيء في موضعه النافع، ويرى أن ما أمر به الله من الإنفاق والعدل حكمة لأنه يؤمن حياة الدنيا وسعادة الآخرة، وأن الإيمان بالتكليف قبل معرفة حكمته يزيد اليقين، وأن الله يعلم حكمة كل ما شرع {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1163} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1164}."
  en: "Sha'rawi defines wisdom as placing a thing in its beneficial place. He holds that what God commanded of spending and justice is wisdom, because it secures life in this world and happiness in the next, and that accepting a command before knowing its wisdom deepens certainty {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1163} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1164}."
  ur: "شعراوی حکمت کی تعریف یہ کرتے ہیں کہ کوئی چیز اپنی نفع بخش جگہ پر رکھی جائے۔ ان کے نزدیک اللہ کا خرچ اور انصاف کا حکم حکمت ہے، کیونکہ اس سے دنیا کی زندگی اور آخرت کی سعادت محفوظ ہوتی ہے، اور حکمت جانے سے پہلے حکم ماننا یقین کو بڑھاتا ہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1163} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1164}۔"
