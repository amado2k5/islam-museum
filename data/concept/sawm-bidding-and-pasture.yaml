id: concept/sawm-bidding-and-pasture
class: concept
kind: legal
label:
  ar: "السَّوْم"
  en: "Sawm (pasturing livestock, and bidding in sale)"
summary:
  ar: "السوم في اللغة عرض السلعة على البيع، ويطلق الفقهاء السوم على الرعي في الكلأ المباح، وعلى عرض البائع السلعة بثمن يطلبه من يرغب في شرائها بثمن دونه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9864} ومن شروط وجوب زكاة الماشية أن تكون سائمة في كلأ مباح عند جمهور الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9865} والسوم في البيع قبل الاتفاق على الثمن جائز، وبعده مكروه عند الحنفية ومحرم عند المالكية والشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9866} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9867}"
  en: "In language sawm is offering goods for sale; the jurists use it for pasturing on open pasture and for a seller offering goods to a bidder who wants them for less. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9864} Among the conditions for zakat on livestock, most jurists require that the animals be pastured on open land. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9865} Bidding before agreement on the price is lawful; after agreement it is disliked by the Hanafis and forbidden by the Malikis, Shafi'is and Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9866} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9867}"
