id: concept/sawm-bidding-and-pasture
class: concept
kind: legal
label:
  ar: "السَّوْم"
  en: "Sawm (pasturing livestock, and bidding in sale)"
  es: "Sawm (pastoreo de ganado y subasta en venta)"
  fr: "Sawm (élevage de bétail et enchères lors de ventes)"
summary:
  ar: "السوم في اللغة عرض السلعة على البيع، ويطلق الفقهاء السوم على الرعي في الكلأ المباح، وعلى عرض البائع السلعة بثمن يطلبه من يرغب في شرائها بثمن دونه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9864} ومن شروط وجوب زكاة الماشية أن تكون سائمة في كلأ مباح عند جمهور الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9865} والسوم في البيع قبل الاتفاق على الثمن جائز، وبعده مكروه عند الحنفية ومحرم عند المالكية والشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9866} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9867}"
  en: "In language sawm is offering goods for sale; the jurists use it for pasturing on open pasture and for a seller offering goods to a bidder who wants them for less. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9864} Among the conditions for zakat on livestock, most jurists require that the animals be pastured on open land. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9865} Bidding before agreement on the price is lawful; after agreement it is disliked by the Hanafis and forbidden by the Malikis, Shafi'is and Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9866} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9867}"
  es: "En el idioma, sawm significa ofrecer bienes en venta; los juristas lo usan para referirse al pastoreo en praderas abiertas y a un vendedor que ofrece bienes a un postor que los desea a un precio menor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9864} Entre las condiciones para el zakat sobre el ganado, la mayoría de los juristas exigen que los animales pasten en tierras abiertas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9865} La puja antes de acordar el precio es lícita; después de acordarlo, los hanafíes la desaprueban y los malikíes, shafiíes y hanbalíes la prohíben. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9866} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9867}"
  fr: "En écriture kuwaite, le terme « sawm » désigne la mise en vente de biens; les juristes l'emploient pour le pâturage en plein air et pour un vendeur proposant des biens à un enchérisseur qui les souhaite à un prix inférieur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9864} Parmi les conditions d'imposition de la zakat sur le bétail, la plupart des juristes exigent que les animaux pâturent en plein air. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9865} Il est permis d'enchérir avant que le prix ne soit convenu; après accord, cela est désapprouvé par les hanafites et interdit par les malikites, les chaféites et les hanbalites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9866} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9867}"
