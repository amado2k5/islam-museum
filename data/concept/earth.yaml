summary:
  ar: "ألقى في الأرض رواسي أن تميد بكم وأنهاراً وسبلاً لعلكم تهتدون، بسطها ودحاها وفرشها وفيها جعل رواسي وفواكه وعيوناً وهي مسجد وطهور."
  en: "He cast in the earth anchors lest it shake with you, rivers and paths that you may be guided; He spread it, levelled it, laid it out with mountains, fruits and springs — and it is a mosque and a means of purification."
  ur: "اس نے زمین میں لنگر ڈالے کہ تمہارے ساتھ نہ ہلے دریا اور راستے کہ تم راہ پاؤ؛ اسے پھیلایا برابر کیا پہاڑ، پھل اور چشمے رکھے — اور یہ مسجد اور طہارت کا ذریعہ ہے۔"
