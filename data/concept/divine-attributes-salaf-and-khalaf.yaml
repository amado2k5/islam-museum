id: concept/divine-attributes-salaf-and-khalaf
class: concept
kind: belief
label: { ar: "الصفات الخبرية: مذهب السلف والخلف", en: "Attributes such as 'hand': the salaf and khalaf approaches", ur: "خبری صفات: سلف اور خلف کا طریقہ" }
summary:
  ar: "يعرض الشعراوي عند قوله تعالى «اليد المذكورة في سورة الفتح» طريقتين: طريقة السلف، وهي أن يُؤخذ اللفظ كما قاله الله دون تكييف، وطريقة الخلف، وهي تأويله إلى صفة ثابتة، ويرى هو أن تُؤخذ الصفة من الله وتُنفى عنها المماثلة {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1104}."
  en: "On the verse about God's hand (48:10), Sha'rawi sets out two approaches: that of the salaf, to take the word as God said it without describing its mode, and that of the khalaf, to interpret it as an established attribute. He holds that the attribute is taken from God with no likeness {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1104}."
  ur: "شعراوی اللہ کے ہاتھ والی آیت پر دو طریقے بیان کرتے ہیں: سلف کا طریقہ کہ لفظ کو جیسا اللہ نے کہا ویسا لیا جائے، بغیر کیفیت بیان کیے، اور خلف کا طریقہ کہ اسے کسی ثابت صفت کی طرف تاویل کیا جائے۔ ان کی اپنی رائے ہے کہ صفت اللہ سے لی جائے اور مماثلت کی نفی کی جائے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1104}۔"
