id: concept/divine-attributes-salaf-and-khalaf
class: concept
kind: belief
label: { ar: "الصفات الخبرية: مذهب السلف والخلف", en: "Attributes such as 'hand': the salaf and khalaf approaches", ur: "خبری صفات: سلف اور خلف کا طریقہ", es: "Atributos como la \"mano\": los enfoques salaf y khalaf", fr: "Des attributs tels que la « main »: les approches salaf et khalaf", tr: "Rivayetli Özellikler: Selef ve Halef Doktrini", id: "Atribut Narasi: Doktrin Salaf dan Khalaf" }
summary:
  ar: "يعرض الشعراوي عند قوله تعالى «اليد المذكورة في سورة الفتح» طريقتين: طريقة السلف، وهي أن يُؤخذ اللفظ كما قاله الله دون تكييف، وطريقة الخلف، وهي تأويله إلى صفة ثابتة، ويرى هو أن تُؤخذ الصفة من الله وتُنفى عنها المماثلة {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1104}."
  en: "On the verse about God's hand (48:10), Sha'rawi sets out two approaches: that of the salaf, to take the word as God said it without describing its mode, and that of the khalaf, to interpret it as an established attribute. He holds that the attribute is taken from God with no likeness {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1104}."
  ur: "شعراوی اللہ کے ہاتھ والی آیت پر دو طریقے بیان کرتے ہیں: سلف کا طریقہ کہ لفظ کو جیسا اللہ نے کہا ویسا لیا جائے، بغیر کیفیت بیان کیے، اور خلف کا طریقہ کہ اسے کسی ثابت صفت کی طرف تاویل کیا جائے۔ ان کی اپنی رائے ہے کہ صفت اللہ سے لی جائے اور مماثلت کی نفی کی جائے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1104}۔"
  es: "En el versículo sobre la mano de Dios (48:10), Sha'rawi expone dos enfoques: el de los salaf, que interpreta la palabra tal como Dios la pronunció sin describir su modo, y el de los khalaf, que la interpreta como un atributo establecido. Sostiene que el atributo proviene de Dios sin ninguna semejanza con él {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1104}."
  fr: "Concernant le verset relatif à la main de Dieu (48:10), Sha'rawi présente deux approches: celle des salaf, qui consiste à prendre le texte tel que Dieu l'a prononcé sans en préciser le mode, et celle des khalaf, qui l'interprètent comme un attribut établi. Il soutient que cet attribut est emprunté à Dieu sans ressemblance (voir: Tafsir Sha'rawi Khawatir, vol. 2, p. 1104)."
  tr: "El-Şaarawi, Yüce Tanrı'nın \"Fats Suresi'nde bahsedilen el\" dediğinde iki yöntem sunar; bu, seleflerin yöntemidir; kelimenin Tanrı'nın söylediği gibi koşulsuz olarak kabul edilmesi ve halefin yöntemi ise sabit bir özellik olarak yorumlanmasıdır; yani sıfatın Allah'tan alınması ve benzerliğin reddedilmesidir {atıf:tafsir-şerawi-khawatir-scan-vol-vol-cilt-2, s.1104}."
  id: "Al-Shaarawi menyajikan dua metode ketika Yang Maha Kuasa mengatakan \"tangan yang disebutkan dalam Surah Al-Fath,\" yang merupakan metode para pendahulu, yaitu bahwa firman diambil seperti yang dikatakan Tuhan tanpa syarat, dan metode penerus, yang merupakan interpretasi sebagai atribut tetap, yaitu atribut diambil dari Tuhan dan kemiripannya ditolak {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 hlm.1104}."
