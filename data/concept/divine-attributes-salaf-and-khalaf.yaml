    id: sunni-sharawi-take-as-stated
    stance: { ar: "تُؤخذ الصفة كما قالها الله، مع نفي المماثلة وتنزيه الكيفية", en: "Take the attribute as God stated it, deny any likeness, and do not specify its mode", ur: "صفت کو جیسا اللہ نے کہا ویسا لیا جائے، مماثلت کی نفی ہو اور کیفیت متعین نہ کی جائے" }
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يرى الشعراوي أن الصفة تُؤخذ من الله لأنه أعلم بذاته، وتُحال إلى نفي المماثلة، وينقل أن السلف يأخذونها كما قال الله دون تكييف، وأن الخلف يؤولونها {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1104}."
      en: "Sha'rawi holds that the attribute is taken from God, who knows His own self best, and referred to the denial of likeness. He reports that the salaf take it as God said without describing its mode, and that the khalaf interpret it {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1104}."
      ur: "شعراوی کے نزدیک صفت اللہ سے لی جائے کیونکہ وہ اپنی ذات کو سب سے بہتر جانتا ہے، اور اسے مماثلت کی نفی کی طرف رکھا جائے۔ وہ نقل کرتے ہیں کہ سلف اسے جیسا اللہ نے کہا ویسا لیتے ہیں اور خلف تاویل کرتے ہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1104}۔"
