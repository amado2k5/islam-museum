id: concept/ijhaz
class: concept
kind: legal
label: { ar: "إجهاز", en: "Finishing off (ijhaz)", es: "Terminando (ijhaz)", fr: "Finir (ijhaz)", ur: "ختم کرنا ⁦(اعجاز)⁩" }
summary:
  ar: "الإجهاز في اللغة الإسراع، والإجهاز على الجريح إتمام قتله، ويستعمله الفقهاء بهذا المعنى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1704} ويجوز الإجهاز على جرحى الكفار المقاتلين، وعلى جرحى البغاة إذا كانت لهم فئة، ويجب الإجهاز على من وجب عليه الموت في حد أو قصاص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1704} وفي إراحة الحيوان الذي لا يجوز قتله ابتداء خلاف: الحنفية والمالكية يجيزونه، والشافعية والحنابلة يمنعونه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1705}"
  en: "In the lexicon ijhaz means haste, and to finish off a wounded man is to complete his killing; jurists use the word in this sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1704} Finishing off wounded enemy combatants is lawful, and that of wounded rebels is lawful where they have a group; it is obligatory for one sentenced to death for a fixed penalty or retaliation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1704} For an animal that may not be killed at the outset, such as a donkey, the Hanafis and Malikis allow ending its suffering after injury, and the Shafi'is and Hanbalis forbid it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1705}"
  es: "En el léxico, ijhaz significa prisa, y rematar a un hombre herido es completar su muerte; los juristas usan la palabra en este sentido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1704} Rematar a combatientes enemigos heridos es lícito, y lo mismo ocurre con los rebeldes heridos cuando forman un grupo; es obligatorio para quien ha sido condenado a muerte por una pena fija o por represalia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1704} Para un animal que no puede ser sacrificado de entrada, como un burro, los hanafíes y los malikíes permiten poner fin a su sufrimiento después de la herida, mientras que los shafiíes y los hanbalíes lo prohíben. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1705}"
  fr: "Dans le lexique, « ijhaz » signifie hâte, et achever un homme blessé signifie le tuer; les juristes emploient ce terme dans ce sens. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1704} Il est licite d’achever les combattants ennemis blessés, et l’achever est également licite pour les rebelles blessés lorsqu’ils sont en groupe; c’est obligatoire pour une personne condamnée à mort pour une peine fixe ou en représailles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1704} Concernant un animal qu’il est interdit de tuer immédiatement, comme un âne, les écoles hanafite et malikite autorisent à mettre fin à ses souffrances après une blessure, tandis que les écoles chaféite et hanbalite l’interdisent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1705}"
  ur: "لغت میں اعجاز کا مطلب جلد بازی ہے اور زخمی آدمی کو ختم کرنا اس کا قتل مکمل کرنا ہے۔ فقہاء اس لفظ کو اس معنی میں استعمال کرتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1704} دشمن کے زخمی جنگجو کو ختم کرنا حلال ہے، اور زخمی باغیوں کا جہاں ان کا کوئی گروہ ہو حلال ہے۔ ایک مقررہ سزا یا انتقامی کارروائی کے لیے موت کی سزا پانے والے کے لیے یہ واجب ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1704} جس جانور کو شروع میں قتل نہیں کیا جا سکتا، جیسے کہ گدھا، احناف اور مالکیہ اس کی تکلیف کو چوٹ کے بعد ختم کرنے کی اجازت دیتے ہیں، اور شافعیہ اور حنبلی اس سے منع کرتے ہیں۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص1705}"
