id: concept/ijhaz
class: concept
kind: legal
label: { ar: "إجهاز", en: "Finishing off (ijhaz)" }
summary:
  ar: "الإجهاز في اللغة الإسراع، والإجهاز على الجريح إتمام قتله، ويستعمله الفقهاء بهذا المعنى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1704} ويجوز الإجهاز على جرحى الكفار المقاتلين، وعلى جرحى البغاة إذا كانت لهم فئة، ويجب الإجهاز على من وجب عليه الموت في حد أو قصاص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1704} وفي إراحة الحيوان الذي لا يجوز قتله ابتداء خلاف: الحنفية والمالكية يجيزونه، والشافعية والحنابلة يمنعونه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1705}"
  en: "In the lexicon ijhaz means haste, and to finish off a wounded man is to complete his killing; jurists use the word in this sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1704} Finishing off wounded enemy combatants is lawful, and that of wounded rebels is lawful where they have a group; it is obligatory for one sentenced to death for a fixed penalty or retaliation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1704} For an animal that may not be killed at the outset, such as a donkey, the Hanafis and Malikis allow ending its suffering after injury, and the Shafi'is and Hanbalis forbid it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1705}"
