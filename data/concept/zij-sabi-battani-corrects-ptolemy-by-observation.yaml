id: concept/zij-sabi-battani-corrects-ptolemy-by-observation
class: concept
kind: scientific
label: { ar: "البتاني يصحح المجسطي بالرصد في الزيج الصابي", en: "Al-Battani corrects the Almagest by observation", ur: "البتانی کا مجسطی کی رصد سے تصحیح کرنا", es: "Al-Battani corrige el Almagesto mediante la observación.", fr: "Al-Battani corrige l'Almageste par observation", tr: "El-Battani Almagest'i Sabi Zij'de gözlem yaparak düzeltiyor", id: "Al-Battani mengoreksi Almagest dengan observasi di Sabi Zij" }
summary:
  ar: "يذكر البتاني في صدر زيجه أنه أطال النظر في كتب حركات النجوم وفي أغلاط واضعيها وفي ما تغير بتغير ميل فلك البروج وأقدار السنين وأوقات الفصول واتصالات النيرين، فجرّب تصحيح ذلك على مذهب بطليموس في المجسطي متتبعاً رسمه، ثم أثبت ما وجده بالرصد وحساب الكسوفين وصحح حركات الكواكب ومواضعها من فلك البروج. {cite:zij-sabi-nallino-byblion p.11}."
  en: "In the foreword al-Battani says he long studied the books on planetary motions, the errors of their authors, and what had shifted with the obliquity of the zodiac, the lengths of the years, the times of the seasons and the conjunctions of the two luminaries, and that he tried to correct these on the school of Ptolemy in the Almagest, following his lead; then he fixed what he found by observation and by calculating the two eclipses and corrected the motions and places of the planets on the zodiac. {cite:zij-sabi-nallino-byblion p.11}."
  ur: "البتانی اپنی زیج کے دیباچے میں بتاتے ہیں کہ انہوں نے ستاروں کی حرکات پر کتابوں، ان کے مصنفین کی غلطیوں اور فلک البروج کے میل، سالوں کی مقدار، موسموں کے اوقات اور دونوں نیّروں کے اتصالات میں آنے والی تبدیلیوں پر دیر تک غور کیا، پھر بطلیموس کے مذہب کے مطابق المجسطی کی پیروی کرتے ہوئے اس کی تصحیح کی کوشش کی؛ پھر رصد اور دونوں کسوفوں کے حساب سے جو پایا اسے ثابت کیا اور سیاروں کی حرکات اور بروج میں ان کی جگہوں کی تصحیح کی۔ {cite:zij-sabi-nallino-byblion p.11}۔"
  es: "En el prólogo, al-Battani afirma haber estudiado durante mucho tiempo los libros sobre los movimientos planetarios, los errores de sus autores y las variaciones sufridas con la oblicuidad del zodíaco, la duración de los años, las estaciones y las conjunciones de los dos astros. Trató de corregir estos errores siguiendo la escuela de Ptolomeo en el Almagesto, y luego, mediante la observación y el cálculo de los dos eclipses, corrigió los movimientos y las posiciones de los planetas en el zodíaco. {cite:zij-sabi-nallino-byblion p.11}."
  fr: "Dans son avant-propos, al-Battani explique avoir longuement étudié les ouvrages sur les mouvements planétaires, les erreurs de leurs auteurs et les variations dues à l'obliquité du zodiaque, notamment la durée des années, les saisons et les conjonctions des deux astres. Il précise avoir tenté de corriger ces erreurs selon l'école de Ptolémée dans l'Almageste, en suivant ses préceptes. Il a ensuite établi les résultats de ses observations et du calcul des deux éclipses, corrigeant ainsi les mouvements et les positions des planètes sur le zodiaque. {cite:zij-sabi-nallino-byblion p.11}"
  tr: "El-Battani, astronomik tablolarının başında, yıldızların hareketleri, yazarlarının hataları ve ekliptiğin eğimindeki değişimle birlikte değişenler, yılların uzunluğu, mevsimlerin zamanı ve iki gök cisminin kavuşumu üzerine uzun uzun kitaplar incelediğini belirtir. Daha sonra, Batlamyus'un Almagest'teki yöntemine göre, diyagramını takip ederek bunu düzeltmeye çalışmıştır. Ardından, gözlem ve iki tutulmanın hesaplanmasıyla bulduklarını doğrulamış ve gezegenlerin hareketlerini ve ekliptikteki konumlarını düzeltmiştir. {cite:zij-sabi-nallino-byblion s.11}."
  id: "Al-Battani menyebutkan di awal tabel astronominya bahwa ia mempelajari secara mendalam buku-buku tentang pergerakan bintang, kesalahan para penulisnya, dan apa yang berubah dengan perubahan kemiringan ekliptika, panjang tahun, waktu musim, dan konjungsi kedua benda langit. Kemudian ia mencoba untuk mengoreksi hal ini menurut metode Ptolemy dalam Almagest, mengikuti diagramnya. Ia kemudian mengkonfirmasi apa yang ditemukannya melalui pengamatan dan perhitungan dua gerhana, dan mengoreksi pergerakan planet dan posisinya di ekliptika. {cite:zij-sabi-nallino-byblion p.11}."
