label:
  ar: "أبو حلسا"
  en: "Abu halsa"
  ur: "ابو حلسا"
summary:
  ar: "نبات زغبي شائك أسود، قيل إنه خسّ الحمار، وأصنافه أربعة وأقواها الصنفان الأولان. فيه قبض مع تلطيف، ينفع الجراح والقروح واليرقان ووجع الطحال، ويقطع الحمّيات المزمنة، ويذكر الكتاب أن احتمال أصله يُسقط الجنين {cite:canon-ibn-sina-print-v1 p.371} {cite:canon-ibn-sina-print-v1 p.372}."
  en: "A hairy, rough, black plant, said by some to be donkey lettuce; there are four kinds and the first two are the strongest. It combines astringency with thinning, helps wounds, ulcers, jaundice and spleen pain, and the book says it helps chronic fevers. The book also states that a woman who takes its root miscarries; this is the book's listing, not a recommendation {cite:canon-ibn-sina-print-v1 p.371} {cite:canon-ibn-sina-print-v1 p.372}."
  ur: "یہ ایک کھردرا، کانٹے دار اور سیاہ پودا ہے، جسے بعض لوگ خسِ حمار بتاتے ہیں۔ اس کی چار قسمیں ہیں اور پہلی دو سب سے قوی ہیں۔ اس میں قبض کے ساتھ تلطیف ہے، یہ زخموں، ناسوروں، یرقان اور تلی کے درد میں مفید ہے، اور کتاب کے مطابق پرانے بخار میں نفع دیتا ہے۔ کتاب لکھتی ہے کہ اس کی جڑ اٹھانے والی عورت کا حمل گر جاتا ہے؛ یہ کتاب کی فہرست ہے، کوئی سفارش نہیں {cite:canon-ibn-sina-print-v1 p.371} {cite:canon-ibn-sina-print-v1 p.372}۔"
