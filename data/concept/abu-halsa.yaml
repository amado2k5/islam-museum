summary:
  ar: "نبات زغبي شائك أسود، قيل إنه خسّ الحمار، وأصنافه أربعة وأقواها الصنفان الأولان. فيه قبض مع تلطيف، ينفع الجراح والقروح واليرقان ووجع الطحال، ويقطع الحمّيات المزمنة، ويذكر الكتاب أن احتمال أصله يُسقط الجنين {cite:canon-ibn-sina-print-v1 p.371} {cite:canon-ibn-sina-print-v1 p.372}."
  en: "A hairy, rough, black plant, said by some to be donkey lettuce; there are four kinds and the first two are the strongest. It combines astringency with thinning, helps wounds, ulcers, jaundice and spleen pain, and the book says it helps chronic fevers. The book also states that a woman who takes its root miscarries; this is the book's listing, not a recommendation {cite:canon-ibn-sina-print-v1 p.371} {cite:canon-ibn-sina-print-v1 p.372}."
  fr: "Une plante velue, rugueuse et noire, que certains identifient à la laitue d'âne ; il en existe quatre sortes, dont les deux premières sont les plus puissantes. Elle associe astringence et atténuation, est utile contre les plaies, les ulcères, la jaunisse et les douleurs de la rate, et le livre la dit utile contre les fièvres chroniques. Le livre affirme aussi qu'une femme qui prend sa racine fait une fausse couche ; il s'agit de l'énumération du livre, non d'une recommandation {cite:canon-ibn-sina-print-v1 p.371} {cite:canon-ibn-sina-print-v1 p.372}."
  ur: "یہ ایک کھردرا، کانٹے دار اور سیاہ پودا ہے، جسے بعض لوگ خسِ حمار بتاتے ہیں۔ اس کی چار قسمیں ہیں اور پہلی دو سب سے قوی ہیں۔ اس میں قبض کے ساتھ تلطیف ہے، یہ زخموں، ناسوروں، یرقان اور تلی کے درد میں مفید ہے، اور کتاب کے مطابق پرانے بخار میں نفع دیتا ہے۔ کتاب لکھتی ہے کہ اس کی جڑ اٹھانے والی عورت کا حمل گر جاتا ہے؛ یہ کتاب کی فہرست ہے، کوئی سفارش نہیں {cite:canon-ibn-sina-print-v1 p.371} {cite:canon-ibn-sina-print-v1 p.372}۔"
  es: "Una planta negra, peluda y áspera, que algunos llaman lechuga de burro; existen cuatro variedades y las dos primeras son las más fuertes. Combina astringencia con adelgazamiento, ayuda con heridas, úlceras, ictericia y dolor de bazo, y el libro dice que ayuda con fiebres crónicas. El libro también afirma que una mujer que toma su raíz sufre un aborto espontáneo; esto es lo que dice el libro, no una recomendación {cite:canon-ibn-sina-print-v1 p.371} {cite:canon-ibn-sina-print-v1 p.372}."
  tr: "Tüylü, dikenli, siyah bir bitki; eşek yünü olduğu söylenir; dört çeşidi vardır, en güçlüsü ilk ikisidir. Kasılmaları yatıştırıcı olur, yaralara, yaralara, sarılığa ve dalak ağrısına yardımcı olur ve kronik ateşleri azaltır. Kitapta kökeninin düşüklere neden olabileceği belirtilir {cite:canon-ibn-sina-print-v1 s.371} {cite:canon-ibn-sina-print-v1 s.372}."
  id: "Tanaman hitam berbulu halus, dikatakan berbulu keledai, dengan empat varietas, yang terkuat adalah dua yang pertama. Tanaman ini memiliki kontraksi yang menenangkan, membantu luka, luka, penyakit kuning, dan rasa sakit limpa, serta mengurangi demam kronis. Buku tersebut menyebutkan bahwa asal-usulnya dapat menyebabkan keguguran {cite:canon-ibn-sina-print-v1 hlm.371} {cite:canon-ibn-sina-print-v1 hlm.372}."
