id: concept/ibn-al-akh
class: concept
kind: legal
label: { ar: "ابن الأخ", en: "Brother's son (nephew)", es: "Hijo del hermano (sobrino)", fr: "Fils du frère (neveu)", ur: "بھائی کا بیٹا ⁦(بھتیجا)⁩", tr: "yeğen", id: "keponakan" }
summary:
  ar: "تعرّف الموسوعة الفقهية الكويتية ابن الأخ بأنه الذكر من ولد الأخ، شقيقاً كان أو لأب أو لأم أو رضاعاً، وعند الإطلاق ينصرف إلى النسبي، ويطلق مجازاً على ابن ابن الأخ وإن نزل. ويحل محل الأخ عند عدمه في الميراث إلا في خمسة أمور: أنه لا يعصّب أخته، وأن الجد يحجبه، وأن العدد منهم لا يحجب الأم من الثلث إلى السدس بخلاف الإخوة، وأن ابن الأخ لأم لا يرث صاحب فرض، وأنه لا يرث مكان الإخوة في المسألة المشركة. ويتفق الفقهاء على تقديمه على العم في الميراث وفي الوصية لأقرب الأقارب وفي ولاية النكاح، ويقدمون الجد عليه في الحضانة، والمالكية يقدمونه على الجد في الوصية لأقرب الأقارب وفي ولاية النكاح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1460}"
  en: "The Kuwaiti encyclopedia defines a brother's son as the male issue of a brother, whether full, paternal, maternal or by fostering; when used without qualification the word means the blood relation, and it is used figuratively for a brother's son's son however far down. He takes the place of a brother when none is living, in inheritance, except in five matters: he does not make his sister agnate; the grandfather excludes him; a number of such nephews does not reduce the mother's share from a third to a sixth, unlike brothers; a maternal nephew does not inherit as a fixed-share heir; and a nephew does not take the place of brothers in the musharraka case. The jurists agree that a full or paternal nephew comes before the paternal uncle in inheritance, in bequest to the nearest kin, and in guardianship of marriage; they agree that the grandfather comes before him in custody. The Malikis place him before the grandfather in bequest to the nearest kin and in guardianship of marriage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1460}"
  es: "La enciclopedia kuwaití define al hijo de un hermano como el descendiente varón de un hermano, ya sea de padre, madre o por crianza; cuando se usa sin especificación, la palabra significa parentesco consanguíneo, y se usa figurativamente para referirse al hijo del hijo de un hermano, sin importar el grado de parentesco. Ocupa el lugar de un hermano cuando no hay ninguno vivo, en la herencia, excepto en cinco asuntos: no convierte a su hermana en agnada; el abuelo lo excluye; un número de tales sobrinos no reduce la parte de la madre de un tercio a un sexto, a diferencia de los hermanos; un sobrino materno no hereda como heredero de cuota fija; y un sobrino no ocupa el lugar de los hermanos en el caso musharraka. Los juristas coinciden en que un sobrino de padre o madre tiene prioridad sobre el tío paterno en la herencia, en el legado a los parientes más cercanos y en la tutela matrimonial; coinciden en que el abuelo tiene prioridad sobre él en la custodia. Los malikíes lo sitúan por delante del abuelo en el legado a los parientes más cercanos y en la tutela matrimonial. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1459} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1460}"
  fr: "L'encyclopédie koweïtienne définit le neveu d'un frère comme le fils d'un frère, qu'il soit germain, paternel, maternel ou adopté. Employé sans autre précision, le terme désigne le lien de sang et s'emploie également au sens figuré pour le fils du neveu d'un frère, quel que soit le degré de parenté. Il remplace un frère décédé en matière d'héritage, sauf dans cinq cas: il ne confère pas à sa sœur son statut d'agnate; le grand-père l'exclut; la présence de plusieurs neveux ne réduit pas la part de la mère d'un tiers à un sixième, contrairement aux frères; un neveu maternel n'hérite pas à parts fixes; et un neveu ne remplace pas les frères en cas de musharraka. Les juristes s'accordent à dire qu'un neveu germain ou paternel prime sur l'oncle paternel en matière d'héritage, de legs aux plus proches parents et de tutelle matrimoniale; ils s'accordent également à dire que le grand-père prime sur lui en matière de garde. Les Malikites le placent avant le grand-père pour les legs aux plus proches parents et la tutelle matrimoniale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1460}"
  ur: "کویتی انسائیکلوپیڈیا میں بھائی کے بیٹے کی تعریف بھائی کے مردانہ مسئلہ کے طور پر کی گئی ہے، خواہ وہ مکمل، پھوپھی، زچگی یا پرورش کے ذریعہ؛ جب اہلیت کے بغیر استعمال کیا جائے تو اس لفظ کا مطلب خون کا رشتہ ہے، اور یہ علامتی طور پر کسی بھائی کے بیٹے کے بیٹے کے لیے استعمال کیا جاتا ہے، خواہ بہت نیچے کیوں نہ ہو۔ وہ بھائی کی جگہ لے لیتا ہے جب کوئی زندہ نہ ہو، وراثت میں، سوائے پانچ امور کے: وہ اپنی بہن کو اگنور نہیں کرتا۔ دادا نے اسے چھوڑ دیا؛ ایسے بہت سے بھتیجے بھائیوں کے برعکس ماں کا حصہ تہائی سے چھٹے تک کم نہیں کرتے۔ ایک ماموں کا بھتیجا بطور مقررہ حصہ وارث کے وارث نہیں ہوتا ہے۔ اور مشرف کیس میں بھائیوں کی جگہ بھتیجا نہیں لے گا۔ فقہاء اس بات پر متفق ہیں کہ وراثت میں، قریبی رشتہ داروں کی وصیت میں، اور نکاح کی ولایت میں چچا کے سامنے مکمل یا پھوپھی کا بھتیجا آتا ہے۔ وہ اس بات پر متفق ہیں کہ دادا ان کے سامنے حراست میں آتے ہیں۔ مالکی اسے دادا کے سامنے قریبی رشتہ داروں کی وصیت اور نکاح کی ولایت میں رکھ دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1459}"
  tr: "Kuveyt Hukuk Ansiklopedisi, yeğeni, yeğenin çocuğundan erkek olarak tanımlar; ister kardeş, baba, anne ya da bebek olsun. Boşanmada, soy soyunu ifade eder ve mecazi anlamda, yeğenin oğlunu, hatta soyundan gelse bile, ifade eder. Miras yoksa, beş durum dışında kardeşin yerini alır: kız kardeşini bağlamaz, büyükbaba onu tutar, sayısı anneyi bir kişiden alıkoymaz- Kardeşlerin aksine, annenin yeğeni sabit hisse sahibinden miras almaz ve çoktanrılı işlerde kardeşlerin yerini miras almaz. Hukukçular, mirasta, en yakın akrabalara yapılan vasiyetlerde ve evliliğin vesayetinde baba tarafından amcadan öncelik verdiği konusunda hemfikirdirler. Velayette büyükbabaya, Maliki geleneğinde ise vasiyetlerde en yakın akrabalara ve evlilik vesayetinde öncelik verirler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1460}"
  id: "Ensiklopedia Yurisprudensial Kuwait mendefinisikan keponakan sebagai laki-laki dari keturunan keponakan, baik saudara laki-laki, ayah, ibu, maupun bayi. Dalam perceraian, merujuk pada garis keturunan relatif, dan secara metaforis, merujuk pada anak keponakan, meskipun ia adalah keturunan. Ia mengambil posisi saudara laki-laki jika tidak ada warisan kecuali dalam lima kasus: ia tidak mengikat saudara perempuannya, kakek menahan keponakan tersebut, jumlah keponakan tidak menahan ibu dari sepertiga hingga seperenam berbeda dengan saudara, keponakan ibu tidak mewarisi dari pemegang saham tetap, dan ia tidak mewarisi tempat saudara dalam urusan politeistik. Para ahli hukum sepakat bahwa ia memiliki prioritas atas paman dari pihak ayah dalam warisan, dalam wasiat kepada kerabat terdekat, dan dalam perwalian pernikahan. Mereka memberikan prioritas kepada kakek dalam hak asuh, dan dalam tradisi Maliki dalam surat wasiat kepada kerabat terdekat dan dalam perwalian pernikahan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1460}"
