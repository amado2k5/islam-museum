  en: "Yawm Arafa (the day of Arafa, fiqh)"
summary:
  ar: "يوم عرفة هو التاسع من ذي الحجة، يتم الحج بالوقوف بعرفة، والوقوف ركن من أركان الحج ثبتت ركنيته بالسنة والإجماع، فمن تركه أو أخره عن وقته فقد فاته الحج. اتفق الفقهاء على أن آخر وقت الوقوف طلوع فجر يوم النحر واختلفوا في أوله وفي وجوب الجمع بين الليل والنهار وفي اشتراط النية له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18029} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18031} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18032}"
  en: "Yawm Arafa is the ninth of Dhu al-Hijja; the pilgrimage is completed by the standing at Arafa, a pillar established by the Sunna and consensus, so whoever omits it or delays it past its time has lost the pilgrimage. The jurists agree its time ends at the dawn of the day of the sacrifice and differ on when it begins, on whether joining night and day is obligatory, and on whether intention is required. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18029} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18031} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18032}"
