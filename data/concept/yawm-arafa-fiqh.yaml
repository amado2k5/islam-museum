label:
  ar: "يَوم عرفة"
  en: "Yawm Arafa (the day of Arafa, fiqh)"
  es: "Yawm Arafa (el día de Arafa, fiqh)"
  fr: "Yawm Arafa (le jour d'Arafa, fiqh)"
  ur: "یوم عرفہ ⁦(یوم عرفہ، فقہ)⁩"
summary:
  ar: "يوم عرفة هو التاسع من ذي الحجة، يتم الحج بالوقوف بعرفة، والوقوف ركن من أركان الحج ثبتت ركنيته بالسنة والإجماع، فمن تركه أو أخره عن وقته فقد فاته الحج. اتفق الفقهاء على أن آخر وقت الوقوف طلوع فجر يوم النحر واختلفوا في أوله وفي وجوب الجمع بين الليل والنهار وفي اشتراط النية له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18029} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18031} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18032}"
  en: "Yawm Arafa is the ninth of Dhu al-Hijja; the pilgrimage is completed by the standing at Arafa, a pillar established by the Sunna and consensus, so whoever omits it or delays it past its time has lost the pilgrimage. The jurists agree its time ends at the dawn of the day of the sacrifice and differ on when it begins, on whether joining night and day is obligatory, and on whether intention is required. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18029} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18031} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18032}"
  es: "Yawm Arafa es el noveno día de Dhu al-Hijja; la peregrinación se completa con la permanencia en Arafa, un pilar establecido por la Sunna y el consenso, por lo que quien la omita o la retrase más allá de su tiempo pierde la peregrinación. Los juristas coinciden en que su tiempo termina al amanecer del día del sacrificio y difieren en cuándo comienza, en si es obligatorio unir la noche y el día, y en si se requiere intención. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18029} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18031} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18032}"
  fr: "Le pèlerinage d'Arafa a lieu le neuvième jour de Dhu al-Hijja. Il est accompli par la station à Arafa, un pilier établi par la Sunna et faisant consensus. Quiconque l'omet ou la retarde au-delà de son heure perd la validité du pèlerinage. Les juristes s'accordent sur le fait que son temps s'achève à l'aube du jour du sacrifice, mais divergent quant à son début, à l'obligation de joindre le jour et la nuit, et à la nécessité d'une intention."
  ur: "یوم عرفہ ذی الحجہ کی نویں تاریخ ہے۔ عرفہ میں کھڑے ہونے سے حج مکمل ہوتا ہے، جو سنت اور اجماع کا ستون ہے، لہٰذا جس نے اس کو چھوڑ دیا یا اس کے وقت سے پہلے تاخیر کی تو اس کا حج ضائع ہو گیا۔ فقہاء کا اتفاق ہے کہ قربانی کے دن کے طلوع ہونے پر اس کا وقت ختم ہوتا ہے اور یہ کب شروع ہوتا ہے، اس پر اختلاف ہے کہ آیا رات اور دن کو ملانا واجب ہے اور کیا نیت کرنا ضروری ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 18029} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 18031}"
