id: concept/ribs-and-sternum
class: concept
kind: scientific
label: { ar: "الأضلاع والقص عند ابن سينا", en: "Ribs and sternum in the Canon", ur: "قانون میں پسلیاں اور سینے کی ہڈی", es: "Costillas y esternón en el Canon", fr: "Côtes et sternum dans le canon", tr: "İbn Sina'ya göre kaburga ve kırkım", id: "Tulang rusuk dan gunting menurut Ibn Sina" }
summary:
  ar: "يرى ابن سينا أن الأضلاع وقاية لآلات التنفس وأعالي آلات الغذاء، وأنها لم تُجعل عظماً واحداً، وأن القص مؤلف من سبعة عظام {cite:canon-ibn-sina-print-v1 pp.52-53}."
  en: "Ibn Sina holds that the ribs are a shield for the organs of breathing and the upper organs of nutrition, that they were not made one bone, and that the sternum is made of seven bones {cite:canon-ibn-sina-print-v1 pp.52-53}."
  es: "Ibn Sina sostiene que las costillas son un escudo para los órganos respiratorios y los órganos superiores de nutrición, que no fueron hechas de un solo hueso, y que el esternón está hecho de siete huesos {cite:canon-ibn-sina-print-v1 pp.52-53}."
  fr: "Ibn Sina soutient que les côtes sont un bouclier pour les organes de la respiration et les organes supérieurs de la nutrition, qu'elles n'ont pas été faites d'un seul os et que le sternum est composé de sept os {cite:canon-ibn-sina-print-v1 pp.52-53}."
  ur: "ابن سینا کا خیال ہے کہ پسلیاں سانس لینے کے اعضاء اور غذائیت کے اوپری اعضاء کے لیے ڈھال ہیں، کہ وہ ایک ہڈی نہیں بنی تھیں، اور یہ کہ سٹرنم سات ہڈیوں سے بنا ہے۔"
  tr: "İbn Sina, kaburgaların solunum yollarını ve yiyecek makinelerinin üst kısımlarını korudığına, tek bir kemik bile oluşturmadığına ve göğüs kemiğinin yedi kemikten oluştuğuna inanır {cite:canon-ibn-sina-print-v1 s.52-53}."
  id: "Ibn Sina percaya bahwa tulang rusuk melindungi saluran pernapasan dan bagian atas mesin makanan, dan bahwa tulang rusuk tidak membentuk satu pun tulang, dan tulang dada terdiri dari tujuh tulang {cite:canon-ibn-sina-print-v1 hlm.52-53}."
