label:
  ar: "وَضِيعة"
  en: "Wadi'a (loss-sale, loss, remission)"
  es: "Wadi'a (pérdida-venta, pérdida, remisión)"
  fr: "Wadi'a (vente à perte, perte, rémission)"
  ur: "وادیہ ⁦(نقصان فروخت، نقصان، معافی)⁩"
summary:
  ar: "الوضيعة في اللغة الخسارة، وما يأخذه السلطان من الخراج والعشور، والحطيطة، ومنه وضع عنه الشيء إذا أسقطه، وخسر في تجارته ضعة ووضيعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17476} وفي اصطلاح الفقهاء هي بيع بمثل الثمن الأول مع نقصان شيء معلوم منه، وتسمى مواضعة ومخاسرة ومحاطة وحطيطة، وهي أشهر معانيها. ويطلق الفقهاء الوضيعة أيضاً على الخسارة وعلى الحط من الدين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17476}\n\nوالمرابحة إعطاء الربح، وهي البيع بثمن محدد بزيادة معلومة على رأس المال، وهي ضد الوضيعة. والتولية نقل جميع المبيع إلى المولى بمثل الثمن الأول، والإشراك نقل بعض المبيع إلى الغير بمثل ثمن ذلك البعض، والوضيعة والتولية والإشراك كلها من بيوع الأمانة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17476}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17477}\n\nبيع الوضيعة: المعنى الأشهر أنه بيع أمانة بنقصان معلوم من الثمن الأول، وهو جائز شرعاً لأنه نوع من البيع، ويصح إذا استوفى شروطه، وشروط صحته هي شروط صحة المرابحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17477}\n\nالوضيعة بمعنى الخسارة في الشركات: اتفق الفقهاء على أن الخسارة في الشركات تكون على الشركاء بحسب رأس مال كل منهم، ولا يجوز اشتراط غير ذلك، وذكر ابن عابدين أنه لا خلاف في بطلان اشتراط الوضيعة بخلاف قدر رأس المال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17477} وفي المضاربة يتحمل رب المال الخسارة كلها، ولا يتحمل المضارب منها شيئاً، أما الربح فيكون بحسب الشرط؛ وإذا ربح المضارب ثم خسر أُخذت الخسارة من الربح ما دامت المضاربة مستمرة، ونقل الكتاب عن أحمد أنه يرد الوضيعة على الربح، وإذا قُبض رأس المال ثم أُعيد فهي مضاربة ثانية لا يُجبر بها خسارة الأولى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17477}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478}\n\nبيع الوضيعة بمعنى الحط من الدين: قال صاحب كفاية الطالب إن الحط من الدين مقابل تعجيله لا يجوز على المشهور، ويسمى هذا عند الفقهاء «ضع وتعجّل»، وعامة الفقهاء على تحريمه لما فيه من الربا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478} ويُحال إلى باب الإبراء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478}"
  en: "Wadi'a, in lexical use, means loss, the tax the ruler takes from the land and the tithes, a reduction, and it is used in the phrase 'he reduced it for him' (wada'a 'anhu), and of a merchant who has lost in his trade. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17476} For the jurists it is a sale at the first price with a known amount deducted from it; it is also called mawadi'a, mukhasara, muhatta and hutayta, and this is its best-known sense. The jurists also use the word for loss and for the remission of a debt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17476}\n\nMurabaha is giving a profit, that is a sale at a price fixed as the capital plus a known addition; it is the opposite of wadi'a. Tawliya is the transfer of the whole goods to the buyer at the first price, and ishrak is the transfer of part of the goods at the price of that part; wadi'a, tawliya and ishrak are all trust sales. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17476}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17477}\n\nWadi'a as a sale: its best-known sense is a trust sale at a known reduction from the first price. It is lawful as a kind of sale, and valid when its conditions are met; its conditions are those of murabaha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17477}\n\nWadi'a as loss in partnerships: the jurists agree that loss in partnerships falls on the partners in proportion to their capital, and that no other arrangement may be stipulated; Ibn 'Abidin says there is no dispute that stipulating a loss other than the capital shares is void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17477} In a mudaraba the owner of the capital bears the whole loss and the managing partner bears none; profit follows the agreed terms. If the managing partner gains and then loses, the loss is taken from the profit while the partnership continues; Ahmad, asked about it, held the loss is set against profit, and when the capital is returned and a new partnership is made, the earlier loss is not covered from the later profit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17477}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478}\n\nWadi'a as remission of a debt: The Kifayat al-talib cited in the book gives the view that remitting part of a debt in return for early payment is not lawful, which is called (put and hasten) and is treated by most jurists as usury. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478} Cross-reference: the heading of remission (ibra'). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478}"
  es: "Wadi'a, en uso léxico, significa pérdida, el impuesto que el gobernante toma de la tierra y los diezmos, una reducción, y se usa en la frase 'lo redujo para él' (wada'a 'anhu), y de un comerciante que ha perdido en su comercio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17476} Para los juristas es una venta al precio inicial con una cantidad conocida deducida de él; también se llama mawadi'a, mukhasara, muhatta y hutayta, y este es su sentido más conocido. Los juristas también usan la palabra para pérdida y para la remisión de una deuda. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17476} Murabaha es dar una ganancia, es decir, una venta a un precio fijado como el capital más una adición conocida; es lo opuesto a wadi'a. Tawliya es la transferencia de todos los bienes al comprador al primer precio, e ishrak es la transferencia de parte de los bienes al precio de esa parte; wadi'a, tawliya e ishrak son todas ventas fiduciarias. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17476}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17477} Wadi'a como venta: su sentido más conocido es una venta fiduciaria con una reducción conocida del primer precio. Es lícita como un tipo de venta y válida cuando se cumplen sus condiciones; sus condiciones son las de murabaha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17477} Wadi'a como pérdida en sociedades: los juristas concuerdan en que la pérdida en las sociedades recae sobre los socios en proporción a su capital, y que no se puede estipular ningún otro acuerdo; Ibn 'Abidin afirma que no hay controversia en cuanto a que estipular una pérdida distinta a las participaciones de capital es nulo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17477} En una mudaraba, el propietario del capital asume la totalidad de la pérdida y el socio gestor no asume ninguna; las ganancias se rigen por los términos acordados. Si el socio gestor obtiene ganancias y luego sufre pérdidas, estas se deducen de las ganancias mientras la sociedad continúa; Ahmad, al ser consultado al respecto, sostuvo que la pérdida se compensa con las ganancias, y cuando se devuelve el capital y se constituye una nueva sociedad, la pérdida anterior no se cubre con las ganancias posteriores. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17477}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478} Wadi'a como remisión de una deuda: El Kifayat al-talib citado en el libro da la opinión de que remitir parte de una deuda a cambio de un pago anticipado no es lícito, lo que se denomina (poner y apresurar) y es considerado por la mayoría de los juristas como usura. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478} Referencia cruzada: el encabezado de remisión (ibra'). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478}"
  fr: "Le terme « wadi'a », au sens littéral, désigne une perte, l'impôt foncier et la dîme prélevés par le souverain, une réduction. On le retrouve dans l'expression « il le lui a réduit » (wada'a 'anhu), et il est employé pour désigner un marchand ayant subi une perte dans son commerce. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17476} Pour les juristes, il s'agit d'une vente au prix initial après déduction d'un montant connu; ce terme est également appelé « mawadi'a », « mukhasara », « muhatta » et « hutayta », et c'est son acception la plus courante. Les juristes utilisent aussi ce mot pour désigner une perte et la remise d'une dette. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17476} La « murabaha » consiste à réaliser un profit, c'est-à-dire une vente à un prix fixe correspondant au capital majoré d'un montant connu; c'est l'opposé de la « wadi'a ». La tawliya consiste en le transfert de la totalité des biens à l'acheteur au prix initial, tandis que l'ishrak consiste en le transfert d'une partie des biens au prix de cette partie; la wadi'a, la tawliya et l'ishrak sont toutes des ventes à terme. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17476}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17477} La wadi'a en tant que vente: son sens le plus courant est celui d'une vente à terme avec une réduction connue par rapport au prix initial. Elle est licite en tant que type de vente et valable lorsque ses conditions sont remplies; ces conditions sont celles de la murabaha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17477} La wadi'a en tant que perte dans les sociétés de personnes: les juristes s'accordent à dire que la perte dans les sociétés de personnes est supportée par les associés proportionnellement à leur apport en capital et qu'aucun autre arrangement ne peut être stipulé. Ibn 'Abidin affirme qu'il est incontestable que toute stipulation d'une perte autre que les parts de capital est nulle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17477} Dans une mudaraba, le propriétaire du capital supporte l'intégralité des pertes, tandis que le gérant n'en supporte aucune; les bénéfices sont distribués conformément aux termes convenus. Si le gérant réalise un gain puis une perte, cette dernière est déduite des bénéfices tant que la société se poursuit. Ahmad, interrogé à ce sujet, a statué que la perte est compensée par les bénéfices et que, lors du remboursement du capital et de la création d'une nouvelle société, la perte antérieure n'est pas imputée sur les bénéfices ultérieurs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17477}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478} La remise de dette (wadi'a): Le Kifayat al-talib, cité dans l'ouvrage, considère que la remise partielle d'une dette en échange d'un paiement anticipé est illicite. Cette pratique, appelée « put and hasten », est assimilée à l'usure par la plupart des juristes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478} Voir aussi: la rubrique « remise (ibra') ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478}"
  ur: "لغوی استعمال میں ودیع کا مطلب نقصان ہے، جو ٹیکس حاکم زمین سے لیتا ہے اور دسواں حصہ، ایک کمی، اور یہ اس کے لیے کم کر دیے جانے والے فقرے میں استعمال ہوتا ہے، اور اس سوداگر کے لیے جو اپنی تجارت میں کھو گیا ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17476} فقہاء کے نزدیک یہ پہلی قیمت پر فروخت ہے جس میں سے ایک معلوم رقم کاٹ لی گئی ہے۔ اسے موادیہ، مخصارہ، محطہ اور حطیہ بھی کہا جاتا ہے اور یہی اس کا سب سے مشہور معنی ہے۔ فقہاء نقصان اور قرض کی معافی کے لیے بھی لفظ استعمال کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17476} مرابحہ منافع دے رہا ہے، جو کہ سرمایہ کے طور پر مقرر کردہ قیمت پر اور ایک معلوم اضافہ ہے۔ یہ وادیہ کے مخالف ہے۔ تولیہ پہلی قیمت پر خریدار کو تمام سامان کی منتقلی ہے، اور اشراق اس حصے کی قیمت پر سامان کے کچھ حصے کی منتقلی ہے۔ وادی، تولیہ اور اشراق سب امانت کی فروخت ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17476}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17477} ودیع بطور فروخت: اس کا سب سے معروف معنی پہلی قیمت سے معلوم کمی پر امانت کی فروخت ہے۔ یہ ایک قسم کی فروخت کے طور پر حلال ہے، اور اس کی شرائط پوری ہونے پر جائز ہے۔ اس کے حالات مرابہ کے ہیں۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17477} ودیعہ بطور شراکت میں نقصان: فقہاء اس بات پر متفق ہیں کہ شراکت میں نقصان شراکت داروں کو ان کے سرمائے کے تناسب سے پڑتا ہے اور اس کے علاوہ کوئی انتظام نہیں کیا جاسکتا۔ ابن عابدین کہتے ہیں کہ اس میں کوئی اختلاف نہیں ہے کہ سرمائے کے حصص کے علاوہ نقصان کی شرط لگانا باطل ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17477} ایک مضاربہ میں سرمایہ کا مالک سارا نقصان برداشت کرتا ہے اور انتظامی شراکت دار کوئی نہیں اٹھاتا۔ منافع متفقہ شرائط کی پیروی کرتا ہے۔ اگر منیجنگ پارٹنر کو فائدہ ہوتا ہے اور پھر نقصان ہوتا ہے، تو شراکت جاری رہنے کے دوران نقصان منافع سے لیا جاتا ہے۔ احمد نے اس کے بارے میں پوچھا، نقصان منافع کے مقابلے میں مقرر کیا جاتا ہے، اور جب سرمایہ واپس کر دیا جاتا ہے اور ایک نئی شراکت داری کی جاتی ہے، تو پہلے نقصان کو بعد کے منافع سے پورا نہیں کیا جاتا ہے. {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17477}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17478} قرض کی معافی کے طور پر ودیع: کتاب میں مذکور کفایت الطالب یہ نظریہ پیش کرتا ہے کہ قرض کی ادائیگی جلد از جلد ادا کرنا شرعاً جائز نہیں ہے اور قرض کا حصہ ادا کرنا شرعاً درست نہیں۔ اکثر فقہاء نے اسے سود سمجھا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17478} عبوری حوالہ: معافی کی سرخی ⁦(ابرا)⁩۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص17478}"
