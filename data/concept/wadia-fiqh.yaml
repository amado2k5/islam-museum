label:
  ar: "وَضِيعة"
  en: "Wadi'a (loss-sale, loss, remission)"
summary:
  ar: "الوضيعة في اللغة الخسارة، وما يأخذه السلطان من الخراج والعشور، والحطيطة، ومنه وضع عنه الشيء إذا أسقطه، وخسر في تجارته ضعة ووضيعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17476} وفي اصطلاح الفقهاء هي بيع بمثل الثمن الأول مع نقصان شيء معلوم منه، وتسمى مواضعة ومخاسرة ومحاطة وحطيطة، وهي أشهر معانيها. ويطلق الفقهاء الوضيعة أيضاً على الخسارة وعلى الحط من الدين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17476}\n\nوالمرابحة إعطاء الربح، وهي البيع بثمن محدد بزيادة معلومة على رأس المال، وهي ضد الوضيعة. والتولية نقل جميع المبيع إلى المولى بمثل الثمن الأول، والإشراك نقل بعض المبيع إلى الغير بمثل ثمن ذلك البعض، والوضيعة والتولية والإشراك كلها من بيوع الأمانة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17476}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17477}\n\nبيع الوضيعة: المعنى الأشهر أنه بيع أمانة بنقصان معلوم من الثمن الأول، وهو جائز شرعاً لأنه نوع من البيع، ويصح إذا استوفى شروطه، وشروط صحته هي شروط صحة المرابحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17477}\n\nالوضيعة بمعنى الخسارة في الشركات: اتفق الفقهاء على أن الخسارة في الشركات تكون على الشركاء بحسب رأس مال كل منهم، ولا يجوز اشتراط غير ذلك، وذكر ابن عابدين أنه لا خلاف في بطلان اشتراط الوضيعة بخلاف قدر رأس المال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17477} وفي المضاربة يتحمل رب المال الخسارة كلها، ولا يتحمل المضارب منها شيئاً، أما الربح فيكون بحسب الشرط؛ وإذا ربح المضارب ثم خسر أُخذت الخسارة من الربح ما دامت المضاربة مستمرة، ونقل الكتاب عن أحمد أنه يرد الوضيعة على الربح، وإذا قُبض رأس المال ثم أُعيد فهي مضاربة ثانية لا يُجبر بها خسارة الأولى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17477}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478}\n\nبيع الوضيعة بمعنى الحط من الدين: قال صاحب كفاية الطالب إن الحط من الدين مقابل تعجيله لا يجوز على المشهور، ويسمى هذا عند الفقهاء «ضع وتعجّل»، وعامة الفقهاء على تحريمه لما فيه من الربا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478} ويُحال إلى باب الإبراء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478}"
  en: "Wadi'a, in lexical use, means loss, the tax the ruler takes from the land and the tithes, a reduction, and it is used in the phrase 'he reduced it for him' (wada'a 'anhu), and of a merchant who has lost in his trade. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17476} For the jurists it is a sale at the first price with a known amount deducted from it; it is also called mawadi'a, mukhasara, muhatta and hutayta, and this is its best-known sense. The jurists also use the word for loss and for the remission of a debt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17476}\n\nMurabaha is giving a profit, that is a sale at a price fixed as the capital plus a known addition; it is the opposite of wadi'a. Tawliya is the transfer of the whole goods to the buyer at the first price, and ishrak is the transfer of part of the goods at the price of that part; wadi'a, tawliya and ishrak are all trust sales. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17476}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17477}\n\nWadi'a as a sale: its best-known sense is a trust sale at a known reduction from the first price. It is lawful as a kind of sale, and valid when its conditions are met; its conditions are those of murabaha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17477}\n\nWadi'a as loss in partnerships: the jurists agree that loss in partnerships falls on the partners in proportion to their capital, and that no other arrangement may be stipulated; Ibn 'Abidin says there is no dispute that stipulating a loss other than the capital shares is void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17477} In a mudaraba the owner of the capital bears the whole loss and the managing partner bears none; profit follows the agreed terms. If the managing partner gains and then loses, the loss is taken from the profit while the partnership continues; Ahmad, asked about it, held the loss is set against profit, and when the capital is returned and a new partnership is made, the earlier loss is not covered from the later profit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17477}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478}\n\nWadi'a as remission of a debt: The Kifayat al-talib cited in the book gives the view that remitting part of a debt in return for early payment is not lawful, which is called (put and hasten) and is treated by most jurists as usury. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478} Cross-reference: the heading of remission (ibra'). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17478}"
