id: concept/khifya-fiqh
class: concept
kind: term
label:
  ar: الخفية
  en: Khifya (secrecy; concealment in worship and theft)
  ur: خفیہ
summary:
  ar: 'الخفية لغة الستر والكتمان أو الإظهار، وهي من الأضداد، وتطلق عند الفقهاء على الستر والكتمان دون الإظهار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7743} الإخفاء في الدعاء أفضل عند جمهور الفقهاء لقوله تعالى في الأعراف عن الدعاء تضرعا وخفية، ولأنه أبعد عن الرياء؛ والنوافل كالإخفاء بها، والفرائض لا يدخلها الرياء؛ واستثنى الفقهاء التلبية يوم عرفة فالجهر بها أولى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7743}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7744} في السرقة: الأخذ على سبيل الاستخفاء ركن من أركان السرقة الموجبة للحد، ولا قطع على المنتهب أو المختلس لأنهما يأخذان عيانا، لحديث جابر «ليس على خائن ولا منتهب ولا مختلس قطع». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7744}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7745}'
  en: 'Khifya is lexically concealing or disclosing, one of the words with two opposite senses; the jurists use it for concealment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7743} Most jurists prefer silent supplication, as the verse on calling on God humbly and in secret shows, and to avoid show; supererogatory acts are better in secret while obligatory acts are not open to show; the jurists exempt the talbiya on the day of Arafat, which is better said aloud. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7743}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7744} In theft: taking in secrecy is a condition of the theft that carries the hadd; there is no cutting for the one who snatches or seizes openly, on the report of Jabir that the betrayer, the plunderer and the snatcher are not cut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7744}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7745}'
  ur: خفیہ لغت میں چھپانا یا ظاہر کرنا دونوں معنی رکھتا ہے؛ فقہاء کے نزدیک صرف چھپانے کے معنی میں؛ اس میں اصطلاحی معنی لغت سے مختلف نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7743} جمہور کے نزدیک خفیہ دعا افضل ہے، آیت «تضرعا وخفية» کی بنا پر اور ریا سے بچنے کے لیے؛ نفل خفیہ افضل اور فرض میں ریا کا خطرہ نہیں؛ عرفہ کے دن تلبیہ کو بلند آواز سے کہنا افضل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7743}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7744} چوری میں خفیہ طور پر لینا حد والی چوری کا رکن ہے؛ جو ظاہراً چھین لے یا لوٹ لے اس کا قطع نہیں، جابر کی حدیث «ليس على خائن ولا منتهب ولا مختلس قطع» کی بنا پر۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7744}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7745}
