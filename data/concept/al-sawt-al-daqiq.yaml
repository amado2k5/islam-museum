id: concept/al-sawt-al-daqiq
class: concept
kind: scientific
label:
  ar: "الصوت الدقيق"
  en: "The fine voice"
  fr: "La voix fine"
  ur: "بڑھکی ہوئی باریک آواز"
  es: "La hermosa voz"
summary:
  ar: "الصوت الدقيق ضد الصوت الكدر وأسبابه ضد أسبابه من السهر والإعياء والترنم وخصوصاً بعد الطعام والرياضة المتعبة والاستفراغات، وعلاجه أن يودع الصوت ويلزم الرياضة المعتدلة المخصبة والأغذية المعتدلة ودخول الحمام كل بكرة ويهجر القوابض والمجففات والمياه ⁦(الرياضة والاستحمام على وصف الكتاب)⁩ {cite:canon-ibn-sina-print-v2 p.326}"
  en: "The fine voice is the opposite of the murky one, and its causes are the opposite of that one's: sleeplessness, weariness, chanting — especially after food — tiring exercise and the evacuations. Its treatment is that he lay down the voice, keep to moderate fattening exercise and moderate foods, enter the bath every morning, and abandon the astringents, the driers and the waters (the exercise and bathing on the book's description) {cite:canon-ibn-sina-print-v2 p.326}"
  fr: "La voix fine est le contraire de la voix trouble, et ses causes sont le contraire des causes de celle-ci : l’insomnie, la fatigue, la psalmodie — surtout après le repas —, l’exercice épuisant et les évacuations. Son traitement consiste à mettre la voix au repos, à s’en tenir à un exercice modéré qui engraisse et à des aliments modérés, à entrer au bain chaque matin, et à renoncer aux astringents, aux desséchants et aux eaux (l’exercice et le bain selon la description du livre) {cite:canon-ibn-sina-print-v2 p.326}"
  ur: "بڑھکی ہوئی باریک آواز کدورت والی آواز کی ضد ہے اور اس کے اسباب بھی اس کے برعکس ہیں: بیداری تھکن ترنم خصوصاً کھانے کے بعد تھکا دینے والی ورزش اور استفراغیں؛ اس کا علاج یہ ہے کہ آواز کو معطل رکھے معتدل غذائیت بخش ورزش اور معتدل خوراکیں اختیار کرے ہر صبح غسل خانے جائے اور قابض خشک کرنے والی چیزیں اور پانیاں چھوڑ دے ⁦(ورزش اور غسل کتاب کی بیان کردہ صورت پر)⁩ {cite:canon-ibn-sina-print-v2 p.326}"
  es: "La voz aguda es lo opuesto a la voz turbia, y sus causas son opuestas a las de esta última: insomnio, cansancio, cánticos —especialmente después de comer—, ejercicio extenuante y evacuaciones. Su tratamiento consiste en aquietar la voz, realizar ejercicio moderado para engordar y comer con moderación, tomar un baño cada mañana y abandonar los astringentes, los secantes y las aguas (el ejercicio y el baño se describen en el libro). {cite:canon-ibn-sina-print-v2 p.326}"
