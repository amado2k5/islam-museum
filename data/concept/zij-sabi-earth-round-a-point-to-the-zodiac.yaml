id: concept/zij-sabi-earth-round-a-point-to-the-zodiac
class: concept
kind: scientific
label: { ar: "كروية الأرض ونقطيتها عند فلك البروج في الزيج الصابي", en: "The earth is round, a point to the zodiac", ur: "زمین گول ہے اور فلک البروج کے مقابل ایک نقطہ", es: "La Tierra es redonda, un punto en el zodíaco." }
summary:
  ar: "ينتقل البتاني إلى مواضع الأرض المعلومة في الطول والعرض، فيقرر أن الأرض مستديرة، وأن مركزها في وسط الفلك، وأن الهواء محيط بها من كل الجهات، وأنها بالنسبة إلى فلك البروج بمنزلة النقطة. ويذكر أن هذا ما أوضحه القياس عند بطليموس ووافقه عليه غيره من القدماء. {cite:zij-sabi-nallino-byblion p.29}."
  en: "Al-Battani turns to the known places of the earth in longitude and latitude and states that the earth is round, that its centre is the centre of the heavens, that air surrounds it on every side, and that to the zodiac it stands like a point. He says this was shown by reasoning in Ptolemy and agreed to by others of the ancients. {cite:zij-sabi-nallino-byblion p.29}."
  ur: "البتانی زمین کے معلوم مقامات کے طول و عرض کی طرف آتے ہیں اور بیان کرتے ہیں کہ زمین گول ہے، اس کا مرکز فلک کے وسط میں ہے، ہوا اسے ہر طرف سے گھیرے ہوئے ہے اور فلک البروج کے مقابل اس کی حیثیت ایک نقطے کی سی ہے۔ وہ بتاتے ہیں کہ یہ بات بطلیموس کے قیاس سے واضح ہوئی اور دوسرے متقدمین نے بھی اس سے اتفاق کیا۔ {cite:zij-sabi-nallino-byblion p.29}۔"
  es: "Al-Battani se refiere a los puntos conocidos de la Tierra en longitud y latitud y afirma que la Tierra es redonda, que su centro es el centro de los cielos, que el aire la rodea por completo y que, con respecto al zodíaco, se presenta como un punto. Afirma que esto fue demostrado mediante el razonamiento de Ptolomeo y aceptado por otros pensadores de la antigüedad. {cite:zij-sabi-nallino-byblion p.29}."
