label:
  ar: "نانخواه"
  en: "Nankhwah (as the Canon lists it)"
  ur: "نانخواہ"
  es: "Nankhwah (tal como aparece en el Canon)"
  fr: "Nankhwah (tel que le Canon le mentionne)"
summary:
  ar: "النانخواه في الكتاب معروف فيه مرارة يسيرة وحرافة، أنفع ما فيه بزره، يابس في الثالثة، يفتح السدد، وينفع صدر المعدة والكبد والكلى والمثانة والحميات العتيقة والسموم {cite:canon-ibn-sina-print-v1 p.579}."
  en: "Nankhwah is in the book well known, with a slight bitterness and pungency, its seed the most useful part, dry in the third degree, opening obstructions; it helps the chest, stomach, liver, kidneys and bladder, very old fevers and poisonous stings {cite:canon-ibn-sina-print-v1 p.579}."
  ur: "نانخواہ کتاب میں معروف ہے، اس میں ہلکی کڑواہٹ اور تیزی ہے، اس کا بیج سب سے مفید حصہ ہے، تیسرے درجے میں خشک، سدے کھولتا ہے؛ سینے، معدے، جگر، گردوں، مثانے، بہت پرانے بخاروں اور زہریلے ڈنک میں مفید ہے {cite:canon-ibn-sina-print-v1 p.579}۔"
  es: "Nankhwah es bien conocida en el libro, con un ligero amargor y picor, su semilla es la parte más útil, seca en tercer grado, abre obstrucciones; ayuda al pecho, estómago, hígado, riñones y vejiga, fiebres muy antiguas y picaduras venenosas {cite:canon-ibn-sina-print-v1 p.579}."
  fr: "Nankhwah est bien connu dans le livre, avec une légère amertume et un piquant, sa graine étant la partie la plus utile, sèche au troisième degré, ouvrant les obstructions; elle aide la poitrine, l'estomac, le foie, les reins et la vessie, les fièvres très anciennes et les piqûres venimeuses {cite:canon-ibn-sina-print-v1 p.579}."
