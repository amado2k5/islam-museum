id: concept/overlap-of-causes-and-rulings
class: concept
kind: legal
label:
  ar: "التداخل"
  en: "Overlap of causes and rulings (tadakhul)"
  ur: "تداخل (اسباب یا احکام کا ایک دوسرے میں داخل ہونا)"
summary:
  ar: "التداخل دخول شيء في شيء آخر بلا زيادة في الحجم والمقدار، وهو عند الفقهاء أن تتعدد الأسباب فيكفي حكم واحد أو تتعدد الأحكام فيكفي فعل واحد. ويختلف الفقهاء في موضعه: أهو في الأسباب أم في الأحكام، والحنفية يجعلونه في الأسباب في العبادات وفي الأحكام في العقوبات. ويبحث في الطهارات والصلاة والصوم والحج والكفارات والعدد والجنايات والديات والحدود والجزية والمواريث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4852} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4853} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4855} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4867}"
  en: "Tadakhul is one thing entering another without any addition in size or measure. In the jurists' usage, several causes may be met by one ruling, or several rulings by one act. The schools differ on where it operates, causes or rulings: the Hanafis place it in causes for acts of worship and in rulings for penalties. It is discussed in purification, prayer, fasting, pilgrimage, expiation, waiting periods, injuries and blood-money, fixed penalties, the jizya and the arithmetic of inheritance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4852} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4853} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4855} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4867}"
