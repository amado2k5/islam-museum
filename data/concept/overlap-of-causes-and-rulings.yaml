id: concept/overlap-of-causes-and-rulings
class: concept
kind: legal
label:
  ar: "التداخل"
  en: "Overlap of causes and rulings (tadakhul)"
  ur: "تداخل ⁦(اسباب یا احکام کا ایک دوسرے میں داخل ہونا)⁩"
  es: "Superposición de causas y resoluciones (tadakhul)"
  fr: "Chevauchement des causes et des décisions (tadakhul)"
summary:
  ar: "التداخل دخول شيء في شيء آخر بلا زيادة في الحجم والمقدار، وهو عند الفقهاء أن تتعدد الأسباب فيكفي حكم واحد أو تتعدد الأحكام فيكفي فعل واحد. ويختلف الفقهاء في موضعه: أهو في الأسباب أم في الأحكام، والحنفية يجعلونه في الأسباب في العبادات وفي الأحكام في العقوبات. ويبحث في الطهارات والصلاة والصوم والحج والكفارات والعدد والجنايات والديات والحدود والجزية والمواريث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4852} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4853} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4855} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4867}"
  en: "Tadakhul is one thing entering another without any addition in size or measure. In the jurists' usage, several causes may be met by one ruling, or several rulings by one act. The schools differ on where it operates, causes or rulings: the Hanafis place it in causes for acts of worship and in rulings for penalties. It is discussed in purification, prayer, fasting, pilgrimage, expiation, waiting periods, injuries and blood-money, fixed penalties, the jizya and the arithmetic of inheritance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4852} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4853} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4855} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4867}"
  es: "Tadakhul es la entrada de una cosa en otra sin que se le añada tamaño ni medida. En el uso de los juristas, varias causas pueden ser atendidas por una sola norma, o varias normas por un solo acto. Las escuelas difieren en cuanto a dónde opera, si en las causas o en las normas: los Hanafi lo ubican en las causas de los actos de culto y en las normas sobre las penas. Se discute en la purificación, la oración, el ayuno, la peregrinación, la expiación, los períodos de espera, las lesiones y la indemnización por derramamiento de sangre, las penas fijas, la jizya y la aritmética de la herencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4852} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4853} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4855} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4867}"
  fr: "Le tadakhul désigne l'entrée d'une chose dans une autre sans ajout de taille ni de mesure. Selon la terminologie juridique, plusieurs causes peuvent être satisfaites par une seule décision, ou plusieurs décisions par un seul acte. Les écoles divergent quant à son champ d'application, causes ou décisions: les hanafites l'intègrent aux causes des actes de culte et aux décisions relatives aux sanctions. Il est abordé dans le cadre de la purification, de la prière, du jeûne, du pèlerinage, de l'expiation, des délais d'attente, des préjudices et du prix du sang, des peines fixes, de la jizya et du calcul des successions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4852} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4853} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4855} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4867}"
  ur: "تدخل ایک چیز ہے جو کسی بھی سائز یا پیمائش کے بغیر دوسری چیز میں داخل ہوتی ہے۔ فقہاء کے استعمال میں، ایک حکم سے کئی اسباب کی تکمیل ہو سکتی ہے، یا ایک عمل سے کئی احکام۔ مکاتب میں اس کے کام کرنے، اسباب یا احکام کے بارے میں اختلاف ہے: احناف اسے عبادات کے اسباب میں اور تعزیرات کے احکام میں رکھتے ہیں۔ اس میں طہارت، نماز، روزہ، حج، کفارہ، عدت، چوٹ اور خون کی رقم، مقررہ تعزیرات، جزیہ اور وراثت کے حساب سے بحث کی گئی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.4852} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.4853} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4855} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4853} صفحہ 4867}"
