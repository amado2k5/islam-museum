label: { ar: "الشورى الإسلامية", en: "Shura in Islam" }
summary:
  ar: "تعرض الفصول المتعلقة بالخلافة الراشدة عند شكيب أرسلان الشورى أصلاً من أصول الحكم في الإسلام. يصف كيف ترك عمر بن الخطاب أمر الخلافة بعده إلى شورى ستة من الصحابة الذين توفي النبي وهو عنهم راض، وكيف أوصى بأن يصلي صهيب بالناس ثلاثة أيام، وأن من يتولى الأمر دون مشورة المسلمين يُقتل. ويرى أرسلان أن الشورى تقوم على إرادة الأمة، وأن الخليفة لا يملك السلطان إلا منها. يُعرض هذا الوصف كما ينقله المؤلف عن كتب السير، ويبقى تفسيره لأصل الشورى محل خلاف بين الفقهاء. ويعرض محمد الخضر حسين الشورى قاعدة ثانية من قواعد الحرية بعد المساواة: يرى أن الشورى تميز الحقوق وتخلص الحق من احتمالات الآراء، وأن النبي شاور أصحابه مع غناه عن ذلك بالوحي تقريرًا لسنة المشورة، وأن أبا بكر وعمر كانا يستشيران، وأن مجلس الشورى يُستحب أن يكون عدده فرديًا لترجيح الرأي الأكثر، ويستدل بقصة بلقيس ومجلس فرعون على الفرق بين شورى تُفوَّض فيها الكلمة الأخيرة وشورى لا تملك إلا الرأي {cite:al-hurriyya-fi-al-islam-azhar p. 48} {cite:al-hurriyya-fi-al-islam-azhar p. 51} {cite:al-hurriyya-fi-al-islam-azhar p. 53} {cite:al-hurriyya-fi-al-islam-azhar p. 55} {cite:al-hurriyya-fi-al-islam-azhar p. 56}."
  en: "Arslan presents shura as a basic principle of Islamic government in his chapters on the rightly guided caliphs. He recounts how Umar left the choice of a successor to a council of six companions, and how he ordered that a successor be chosen by consultation and that anyone seized power without consultation be killed. Arslan reads shura as resting on the community's will. Jurists have debated how binding it is, so this is the author's reading of the classical reports. Al-Khidr Husayn, in a separate book, treats shura as the second pillar of freedom after equality: it sorts out rights and clears truth from competing opinions, and the Prophet consulted his Companions though he did not need to (pp. 48, 51). He prefers an odd-numbered council to break ties, and contrasts the consultation of Pharaoh's council, which handed over the decision, with that of the Queen of Sheba, which only offered opinions (pp. 53, 55-56)."
