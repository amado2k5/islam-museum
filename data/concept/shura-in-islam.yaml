education:
  did_you_know:
    ar: "يعرض شكيب أرسلان الشورى أصلاً من أصول الحكم في الإسلام، إذ ترك عمر بن الخطاب أمر الخلافة بعده إلى أهل الشورى."
    en: "Shakib Arslan presents consultation as a root of Islamic governance: Umar left the succession after him to a consultative council."
