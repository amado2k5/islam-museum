class: concept
kind: political
label: { ar: "الشورى الإسلامية", en: "Shura in Islam", es: "Shura en el Islam", fr: "La Shura en Islam", ur: "اسلام میں شوریٰ", tr: "İslami Şura Konseyi", id: "Dewan Syhura Islam" }
summary:
  ar: "تعرض الفصول المتعلقة بالخلافة الراشدة عند شكيب أرسلان الشورى أصلاً من أصول الحكم في الإسلام. يصف كيف ترك عمر بن الخطاب أمر الخلافة بعده إلى شورى ستة من الصحابة الذين توفي النبي وهو عنهم راض، وكيف أوصى بأن يصلي صهيب بالناس ثلاثة أيام، وأن من يتولى الأمر دون مشورة المسلمين يُقتل. ويرى أرسلان أن الشورى تقوم على إرادة الأمة، وأن الخليفة لا يملك السلطان إلا منها. يُعرض هذا الوصف كما ينقله المؤلف عن كتب السير، ويبقى تفسيره لأصل الشورى محل خلاف بين الفقهاء. ويعرض محمد الخضر حسين الشورى قاعدة ثانية من قواعد الحرية بعد المساواة: يرى أن الشورى تميز الحقوق وتخلص الحق من احتمالات الآراء، وأن النبي شاور أصحابه مع غناه عن ذلك بالوحي تقريرًا لسنة المشورة، وأن أبا بكر وعمر كانا يستشيران، وأن مجلس الشورى يُستحب أن يكون عدده فرديًا لترجيح الرأي الأكثر، ويستدل بقصة بلقيس ومجلس فرعون على الفرق بين شورى تُفوَّض فيها الكلمة الأخيرة وشورى لا تملك إلا الرأي {cite:al-hurriyya-fi-al-islam-azhar p. 48} {cite:al-hurriyya-fi-al-islam-azhar p. 51} {cite:al-hurriyya-fi-al-islam-azhar p. 53} {cite:al-hurriyya-fi-al-islam-azhar p. 55} {cite:al-hurriyya-fi-al-islam-azhar p. 56}."
  en: "Arslan presents shura as a basic principle of Islamic government in his chapters on the rightly guided caliphs. He recounts how Umar left the choice of a successor to a council of six companions, and how he ordered that a successor be chosen by consultation and that anyone seized power without consultation be killed. Arslan reads shura as resting on the community's will. Jurists have debated how binding it is, so this is the author's reading of the classical reports. Al-Khidr Husayn, in a separate book, treats shura as the second pillar of freedom after equality: it sorts out rights and clears truth from competing opinions, and the Prophet consulted his Companions though he did not need to (pp. 48, 51). He prefers an odd-numbered council to break ties, and contrasts the consultation of Pharaoh's council, which handed over the decision, with that of the Queen of Sheba, which only offered opinions (pp. 53, 55-56)."
  es: "En sus capítulos sobre los califas bien guiados, Arslan presenta la shura como un principio fundamental del gobierno islámico. Relata cómo Umar dejó la elección del sucesor en manos de un consejo de seis compañeros y cómo ordenó que el sucesor fuera elegido por consulta y que cualquier persona que tomara el poder sin consultar fuera ejecutada. Arslan interpreta la shura como un proceso basado en la voluntad de la comunidad. Los juristas han debatido su carácter vinculante, por lo que esta es la interpretación que el autor hace de los relatos clásicos. Al-Khidr Husayn, en un libro aparte, considera la shura como el segundo pilar de la libertad después de la igualdad: esta regula los derechos y distingue la verdad de las opiniones contrapuestas, y el Profeta consultó a sus Compañeros aunque no era necesario (págs. 48, 51). Prefiere un consejo con un número impar de miembros para desempatar y contrasta la consulta del consejo del Faraón, que delegó la decisión, con la de la Reina de Saba, que solo ofreció opiniones (págs. 53, 55-56)."
  fr: "Dans ses chapitres consacrés aux califes bien guidés, Arslan présente la shura comme un principe fondamental du gouvernement islamique. Il relate comment Umar laissa le choix de son successeur à un conseil de six compagnons et comment il ordonna que ce choix se fasse par consultation, et que quiconque s'emparerait du pouvoir sans consultation soit mis à mort. Arslan conçoit la shura comme reposant sur la volonté de la communauté. Les juristes ont débattu de son caractère contraignant; il s'agit donc de l'interprétation que l'auteur fait des récits classiques. Al-Khidr Husayn, dans un ouvrage distinct, considère la shura comme le second pilier de la liberté après l'égalité: elle établit les droits et distingue la vérité des opinions divergentes, et le Prophète consulta ses Compagnons bien qu'il n'y fût pas tenu (p. 48, 51). Il préconise un conseil à nombre impair de membres pour trancher les égalités et oppose la consultation du conseil du Pharaon, qui transmit la décision, à celle de la reine de Saba, qui ne fit qu'émettre des avis (p. 53, 55-56)."
  ur: "ارسلان نے صحیح رہنمائی والے خلفاء کے باب میں شوری کو اسلامی حکومت کے بنیادی اصول کے طور پر پیش کیا ہے۔ وہ بتاتا ہے کہ کس طرح عمر نے جانشین کا انتخاب چھ صحابہ کی مجلس میں چھوڑا، اور کس طرح انہوں نے حکم دیا کہ جانشین کا انتخاب مشاورت سے کیا جائے اور جو بھی بغیر مشاورت کے اقتدار پر قبضہ کرے اسے قتل کر دیا جائے۔ ارسلان برادری کی مرضی کے مطابق شوریٰ پڑھتا ہے۔ فقہا نے اس پر بحث کی ہے کہ یہ کتنا پابند ہے، اس لیے مصنف کا کلاسیکی رپورٹس کا یہ مطالعہ ہے۔ الخضر حسین، ایک الگ کتاب میں، شوری کو مساوات کے بعد آزادی کا دوسرا ستون مانتے ہیں: یہ حقوق کو ترتیب دیتی ہے اور حق کو مسابقتی آراء سے صاف کرتی ہے، اور نبی نے اپنے صحابہ سے مشورہ کیا حالانکہ انہیں ضرورت نہیں تھی ⁦(صفحہ 48، 51)⁩۔ وہ تعلقات کو توڑنے کے لیے طاق نمبر والی کونسل کو ترجیح دیتا ہے، اور فرعون کی کونسل کی مشاورت سے، جس نے فیصلہ سونپا تھا، ملکہ شیبا کی مشاورت سے متصادم ہے، جس نے صرف رائے پیش کی تھی ⁦(صفحہ 53، 55-56)⁩۔"
  tr: "Doğru Rehberli Halifelik ile ilgili bölümler Shakib Arslan tarafından sunulmuştur: Şura, İslam'da yönetimin temel ilkelerinden biridir. Ömer bin El-Hattab'ın kendisinden sonra halifeliği bırakıp Peygamber'in vefat ettiği ve memnun olduğu altı sahabeye danışmasını ve Suhaib'in halkı üç gün boyunca nama ettirmesini tavsiye ettiğini, Müslümanlarla danışmadan göreve başlayanların öldürüleceğini anlatır. Arslan, şuranın milletin iradesine dayandığına ve halifenin yalnızca bu iradeyle otoriteye sahip olduğuna inanır. Bu tanım, yazarın biyografilerden alıntılar yaptığı şekilde sunulur ve şura ilkesini yorumlaması hukukçular arasında tartışmalı bir konudur. Muhammed El-Hidr Hüseyin El-Şura, eşitlikten sonra ikinci bir özgürlük ilkesini sunar: Şura'nın hakları ayırdığına ve gerçeği görüş olasılığından kurtardığına, Peygamber'in Sünnet'i belirlemek için vahiy yoluyla ihtiyaç duymasına rağmen sahabelerine danıştığına, Ebu Bekir ve Ömer'in danıştığına ve Şura Konseyi'nin çoğunluğu destekleyecek şekilde bireyselleştirilmesinin tercih edileceğine inanır. Bilkıs ve Firavun'un konseyi hikayesini, son sözün devredildiği bir Şura ile sadece görüşü benimseyen bir Şura arasındaki farkın kanıtı olarak gösterir {alıntı: al-hurriyya-fi-al-Islam-Azhar s. 48} {cite:al-hurriyya-fi-al-Islam-Azhar s. 51} {cite:al-hurriyya-fi-al-Islam-azhar s. 53} {cite:al-hurriyya-fi-al-Islam-azhar s. 55} {cite:al-hurriyya-fi-al-Islam-azhar s. 56}."
  id: "Bab-bab yang berkaitan dengan Khalifah yang Dibimbing dengan Benar disampaikan oleh Shakib Arslan: Shura awalnya adalah salah satu prinsip dasar pemerintahan dalam Islam. Ia menggambarkan bagaimana Umar ibn Al-Khattab meninggalkan kekhalifahan setelahnya atas konsultasi enam sahabat yang telah wafat dan disukai Nabi, serta bagaimana ia merekomendasikan agar Suhaib memimpin umat dalam shalat selama tiga hari, dan siapa pun yang mengambil alih tanpa berkonsultasi dengan Muslim akan dibunuh. Arslan percaya bahwa shura didasarkan pada kehendak bangsa, dan bahwa khalifah hanya memegang otoritas melalui kehendak tersebut. Deskripsi ini disajikan sebagai kutipan dari biografi oleh penulis, dan interpretasinya terhadap prinsip shura tetap menjadi bahan perdebatan di antara para ahli hukum. Muhammad Al-Khidr Hussein Al-Shura mengemukakan prinsip kedua tentang kebebasan setelah kesetaraan: Ia percaya bahwa Shura membedakan hak dan membebaskan kebenaran dari kemungkinan pendapat, bahwa Nabi berkonsultasi dengan para sahabatnya meskipun membutuhkannya melalui wahyu untuk menetapkan Sunnah konsultasi, bahwa Abu Bakr dan Umar berkonsultasi, dan bahwa lebih baik jika Dewan Shura dipersonalisasi untuk mendukung mayoritas pendapat. Ia mengutip kisah Bilqis dan dewan Firaun sebagai bukti perbedaan antara Shura di mana kata terakhir diberikan dan Shura yang hanya memegang pendapat {cite: al-hurriyya-fi-al-islam-azhar hlm. 48} {sitasi:al-hurriyya-fi-al-islam-azhar hlm. 51} {kutip:al-hurriyya-fi-al-islam-azhar hlm. 53} {kutip:al-hurriyya-fi-al-islam-azhar hlm. 55} {kutip:al-hurriyya-fi-al-islam-azhar hlm. 56}."
