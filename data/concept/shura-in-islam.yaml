id: concept/shura-in-islam
class: concept
kind: political
label: { ar: "الشورى الإسلامية", en: "Shura in Islam" }
summary:
  ar: "تعرض الفصول المتعلقة بالخلافة الراشدة عند شكيب أرسلان الشورى أصلاً من أصول الحكم في الإسلام. يصف كيف ترك عمر بن الخطاب أمر الخلافة بعده إلى شورى ستة من الصحابة الذين توفي النبي وهو عنهم راض، وكيف أوصى بأن يصلي صهيب بالناس ثلاثة أيام، وأن من يتولى الأمر دون مشورة المسلمين يُقتل. ويرى أرسلان أن الشورى تقوم على إرادة الأمة، وأن الخليفة لا يملك السلطان إلا منها. يُعرض هذا الوصف كما ينقله المؤلف عن كتب السير، ويبقى تفسيره لأصل الشورى محل خلاف بين الفقهاء."
  en: "Arslan presents shura as a basic principle of Islamic government in his chapters on the rightly guided caliphs. He recounts how Umar left the choice of a successor to a council of six companions, and how he ordered that a successor be chosen by consultation and that anyone seized power without consultation be killed. Arslan reads shura as resting on the community's will. Jurists have debated how binding it is, so this is the author's reading of the classical reports."
