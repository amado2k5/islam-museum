label:
  ar: "التطفيف"
  en: "Tatfif (short measure or weight in trade)"
  ur: "تطفیف ⁦(ناپ تول میں کمی)⁩"
  es: "Tatfif (medida o peso abreviado en el comercio)"
  fr: "Tatfif (mesure ou poids court dans le commerce)"
summary:
  ar: "التطفيف في الكيل والوزن البخس والنقص الذي يخون به صاحبه، وهو ضد التوفية. وهو منهي عنه ومن الخيانة وأكل المال بالباطل، وقد توعد الله المطففين بالويل، وأمر بالوفاء في الكيل والوزن. وعدّه ابن حجر من الكبائر. ويتأكد على المحتسب منعه، وتأديب من ظهرت منه الخيانة وإشهاره، فإن أفضى إلى التجاحد والتناكر فالقضاة أحق بالنظر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5308} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5309} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5310}"
  en: "Tatfif is the short-changing in measure and weight, a loss by which the seller betrays, and it is the opposite of full measure. It is forbidden, a form of treachery and of eating wealth falsely, and God pronounced woe upon the short-changers and ordered full measure. Ibn Hajar reports that the scholars count it among the major sins. The market inspector must prevent it, punish and expose those who are caught, and disputes that lead to denial are for the judges. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5308} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5309} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5310}"
  es: "Tatfif es el engaño en la medida y el peso, una pérdida por la cual el vendedor traiciona, y es lo opuesto a la medida completa. Está prohibido, es una forma de traición y de apropiación indebida de riquezas, y Dios pronunció un castigo sobre quienes engañan y ordenó la medida completa. Ibn Hajar informa que los eruditos lo consideran uno de los pecados mayores. El inspector del mercado debe prevenirlo, castigar y exponer a quienes sean sorprendidos, y las disputas que lleven a la negación son competencia de los jueces. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5308} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5309} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5310}"
  fr: "Le tatfif est la falsification de la monnaie, une perte par laquelle le vendeur trahit, et c'est l'opposé de la pleine mesure. C'est interdit, une forme de trahison et d'appropriation indue de richesses, et Dieu a prononcé un châtiment contre les fraudeurs et a ordonné la pleine mesure. Ibn Hajar rapporte que les savants le comptent parmi les péchés majeurs. L'inspecteur du marché doit le prévenir, punir et dénoncer ceux qui sont pris en flagrant délit, et les litiges qui aboutissent à un refus relèvent des juges. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5308} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5309} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5310}"
