  en: "Tatfif (short measure or weight in trade)"
  ur: "تطفیف (ناپ تول میں کمی)"
summary:
  ar: "التطفيف في الكيل والوزن البخس والنقص الذي يخون به صاحبه، وهو ضد التوفية. وهو منهي عنه ومن الخيانة وأكل المال بالباطل، وقد توعد الله المطففين بالويل، وأمر بالوفاء في الكيل والوزن. وعدّه ابن حجر من الكبائر. ويتأكد على المحتسب منعه، وتأديب من ظهرت منه الخيانة وإشهاره، فإن أفضى إلى التجاحد والتناكر فالقضاة أحق بالنظر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5308} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5309} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5310}"
  en: "Tatfif is the short-changing in measure and weight, a loss by which the seller betrays, and it is the opposite of full measure. It is forbidden, a form of treachery and of eating wealth falsely, and God pronounced woe upon the short-changers and ordered full measure. Ibn Hajar reports that the scholars count it among the major sins. The market inspector must prevent it, punish and expose those who are caught, and disputes that lead to denial are for the judges. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5308} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5309} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5310}"
