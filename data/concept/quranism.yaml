    en: The Sunna is an authoritative second source, inseparable from the Qur'an
  summary:
    ar: "يقرر الشافعي في رسالته أن بيان السنة من الله يوضح مراد كتابه، فلا تقوم الشريعة على القرآن منقطعا عن بيان رسوله {cite:risala-shafii}؛ وعليه بنى أهل السنة ردّ إنكار حجية الحديث."
    en: "Al-Shafi'i's Risala argues the Sunna is God's clarification of His Book's intent, so the sharia cannot stand on the Qur'an severed from His messenger's exposition {cite:risala-shafii}; on this Sunni scholarship grounds its rejection of hadith denial."
