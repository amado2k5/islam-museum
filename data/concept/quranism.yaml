summary:
  ar: "القرآنية اتجاه حديث يقصر الاستدلال على القرآن وحده ويشكك في حجية الحديث؛ ترصد الدراسات الأكاديمية الجدل حول سلطة الحديث منذ القرن التاسع عشر {cite:musa-hadith-scripture-2008}."
  en: "Quranism is a modern current that restricts religious authority to the Qur'an alone and questions the authority of hadith; academic study traces the debate over hadith authority since the nineteenth century {cite:musa-hadith-scripture-2008}."
