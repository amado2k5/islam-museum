label: { ar: "الخزف المينائي", en: "Minai ware", ur: "مینائی ظروف", es: "vajilla minai", fr: "Articles minaï" }
summary:
  ar: "خزف فارسي من أواخر القرن الثاني عشر يُرسم بألوان تثبت تحت الطلاء ثم بألوان «منخفضة الحرارة» فوقه في حرقات إضافية، وهو ما يسميه أبو القاسم الكاشاني «هفت رنگ» {cite:lane-early-islamic-pottery-1947 p. 60}."
  en: "Late twelfth-century Persian ware painted in colours fixed in or under the glaze and then in 'low-temperature' colours over it in further firings, the process Abu al-Qasim of Kashan calls haft rang {cite:lane-early-islamic-pottery-1947 p. 60}."
  ur: "بارھویں صدی کے اواخر کے فارسی ظروف جن پر پہلے لعاب کے اندر یا نیچے جمنے والے رنگ اور پھر مزید پکائیوں میں لعاب کے اوپر «کم حرارت» کے رنگ لگائے جاتے، جسے کاشان کے ابو القاسم «ہفت رنگ» کہتے ہیں {cite:lane-early-islamic-pottery-1947 p. 60}۔"
  es: "Cerámica persa de finales del siglo XII pintada con colores fijados en o debajo del esmalte y luego con colores de \"baja temperatura\" sobre él en cocciones posteriores, proceso que Abu al-Qasim de Kashan llama haft rang {cite:lane-early-islamic-pottery-1947 p. 60}."
  fr: "Céramique persane de la fin du XIIe siècle peinte avec des couleurs fixées dans ou sous la glaçure, puis avec des couleurs « à basse température » par-dessus lors de cuissons ultérieures, le processus qu'Abu al-Qasim de Kashan appelle haft rang {cite:lane-early-islamic-pottery-1947 p. 60}."
