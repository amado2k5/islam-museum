label:
  ar: "وَلاء"
  en: "Wala' (clientage, fiqh)"
summary:
  ar: "الوَلاء لغةً من الوَلْي، وهو أصل يدل على القرب، ويُستعار للقرب في المكان والنسب والدين والصداقة والنصرة. والولاء والتوالي معناهما المتابعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17833}\n\nوقصر جمهور الفقهاء (المالكية والشافعية والحنابلة) الولاءَ على القرابة الحكمية الناشئة عن زوال الملك عن الرقيق بالحرية؛ فعرفه المالكية بأنه اتصال كالنسب نشأ عن عتق، وعرفه الشافعية بأنه عصوبة ناشئة عن حرية حدثت بعد زوال الملك، متراخية عن عصوبة النسب، تقتضي للمعتِق وعصبته الإرث وولاية النكاح والصلاة عليه والعقل عنه، وعرفه الحنابلة بأنه ثبوت حكم شرعي، وهو عصوبة ثابتة، بعتق أو تعاطي سببه كالاستيلاد والتدبير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17834} وعرّفه الحنفية بأنه قرابة حكمية حاصلة من عتق أو موالاة، ومن آثاره الإرث والعقل وولاية النكاح؛ وهو عندهم نوعان: ولاء العتاقة (ولاء النعمة)، وسببه الإعتاق؛ وولاء الموالاة، وسببه العقد بأن يعاهد شخص آخر على أنه إن جنى فعليه أرشه، وإن مات فميراثه له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17834}\n\nالألفاظ ذات الصلة: العتق، وهو سبب الولاء، والإرث، وهو الأثر الذي يترتب عليه، والعقل، وهو الدية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17834}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835}\n\nولاء العتاقة. هو عصوبة متراخية عن عصوبة النسب، تقتضي للمعتِق ولعصبته الذكور من بعده الإرث والعقل وولاية النكاح والصلاة على من أعتقه؛ ويقع اسم «مولى العتاقة» على المعتِق وعلى العتيق، وقيل هو المعتِق وحده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835}\n\nمشروعيته بقول النبي «إنما الولاء لمن أعتق»، رواه البخاري ومسلم من حديث عائشة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835}\n\nسببه العتق. اتفق الفقهاء على أن الولاء للمعتِق إن لم يكن العتق محظوراً، سواء كان بصنعه أو بما يجري مجرى العتق شرعاً كشراء القريب وقبول الهبة والصدقة والوصية، أو بغير صنعه كأن يرث قريبه؛ وسواء كان بغير بدل أو ببدل، منجزاً أو معلقاً أو مضافاً، صريحاً أو كناية، وكذا العتق بالتدبير والاستيلاد والكتابة؛ وكذا إذا أعتق عن واجب، كالكفارة والظهار والإفطار والإيلاء واليمين والنذر، عند الحنفية والمالكية والشافعية والحنابلة في المذهب؛ والرواية الثانية عند الحنابلة أنه لا ولاء له في هذه الأحوال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17836}\n\nالولاء في العتق المحظور. العتق قد يكون محظوراً، كأن يغلب على ظن المعتِق أن العبد إن أُعتق لحق بدار الحرب أو ارتد، أو يخاف منه السرقة وقطع الطريق، أو يُعتَق للشيطان أو للصنم. قال الحنفية إن العتق ينفذ مع تحريمه، والولاء ثابت للمعتِق؛ وصرحوا بأن المعتِق للشيطان أو للصنم يكفر على الأظهر. وقال الحنابلة إن الإعتاق في هذه الأحوال مكروه، وإذا غلب الظن بإفضائه إلى المحظور كان محرماً، وإن أعتقه صح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17836}"
  en: "Wala', in the language, comes from wali, a root meaning nearness; the word is used for nearness of place, of kinship, of religion, of friendship, of support and of belief. Wala' and tawali both mean following one another without a gap between. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17833}\n\nThe majority (Malikis, Shafi'is and Hanbalis) confine wala' to the legal kinship that arises when a slave is freed and ownership of him ends. The Malikis define it as a connection like kinship that arises from manumission. The Shafi'is define it as an 'asaba arising from a freedom that comes after ownership has ended, later than the 'asaba of lineage, which gives the manumitter and his male 'asaba inheritance, the guardianship of a marriage, the funeral prayer and the payment of blood-money on his behalf. The Hanbalis define it as the establishment of a legal rule, an 'asaba fixed by manumission or by the cause of it, such as umm walad status or tadbir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17834} The Hanafis define it as a legal kinship arising from manumission or from alliance, with the effects of inheritance, blood-money and guardianship of marriage. They distinguish two kinds: wala' 'itaqa (the wala' of blessing), caused by manumission; and wala' muwala, caused by contract, in which one person covenants with another that if he commits a crime he will pay its compensation, and if he dies his estate goes to the other. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17834}\n\nRelated words: manumission ('itq), which is the cause of wala'; inheritance (irth), its effect; and blood-money ('aql), which it also causes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17834}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835}\n\nWala' of manumission (wala' al-'itaqa) is an 'asaba later than the kinship of lineage, which gives the manumitter and his male 'asaba after him inheritance, blood-money, guardianship of the marriage and the funeral prayer for the one he freed. The term 'client of manumission' (mawla al-'itaqa) applies to the manumitter and to the freed slave, and some say only to the manumitter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835}\n\nIts lawfulness rests on the Prophet's saying: 'the wala' belongs to the one who frees', which al-Bukhari and Muslim report from 'A'isha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835}\n\nIts cause is manumission. The jurists agree that wala' belongs to the manumitter where the manumission is not forbidden, whether he did it himself or by what takes the place of manumission in law, such as buying a relative, accepting a gift or charity or a bequest, or whether it came without his act, as when he inherits a relative. It holds whether the manumission is for no price, for a price, conditioned, or dated, express or implicit, and so too manumission by tadbir, by umm walad status, or by contract of purchase of freedom. It also holds where he frees a slave for a duty, such as expiation for killing, for zihar, for breaking the fast in Ramadan, for ila', for an oath or for a vow, according to the Hanafis, Malikis, Shafi'is and the school view of the Hanbalis; a Hanbali narration holds there is no wala' in these cases. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17836}\n\nWala' in forbidden manumission. Manumission may be forbidden: where the manumitter is likely to see the slave join the enemy's territory, leave Islam, or steal and raid, or where the slave is freed for the devil or an idol. The Hanafis hold that the manumission takes effect despite its prohibition and the wala' belongs to the manumitter; they say that one who frees a slave for the devil or an idol is an unbeliever on the sounder view. The Hanbalis say that manumission in such cases is disliked, that where it is likely to lead to the forbidden it is forbidden, and that if it is done it is valid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17836}"
