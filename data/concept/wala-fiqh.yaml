id: concept/wala-fiqh
class: concept
kind: legal
label:
  ar: "وَلاء"
  en: "Wala' (clientage, fiqh)"
  es: "Wala' (clientela, fiqh)"
  fr: "Wala' (clientage, fiqh)"
summary:
  ar: "الوَلاء لغةً من الوَلْي، وهو أصل يدل على القرب، ويُستعار للقرب في المكان والنسب والدين والصداقة والنصرة. والولاء والتوالي معناهما المتابعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17833}\n\nوقصر جمهور الفقهاء ⁦(المالكية والشافعية والحنابلة)⁩ الولاءَ على القرابة الحكمية الناشئة عن زوال الملك عن الرقيق بالحرية؛ فعرفه المالكية بأنه اتصال كالنسب نشأ عن عتق، وعرفه الشافعية بأنه عصوبة ناشئة عن حرية حدثت بعد زوال الملك، متراخية عن عصوبة النسب، تقتضي للمعتِق وعصبته الإرث وولاية النكاح والصلاة عليه والعقل عنه، وعرفه الحنابلة بأنه ثبوت حكم شرعي، وهو عصوبة ثابتة، بعتق أو تعاطي سببه كالاستيلاد والتدبير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17834} وعرّفه الحنفية بأنه قرابة حكمية حاصلة من عتق أو موالاة، ومن آثاره الإرث والعقل وولاية النكاح؛ وهو عندهم نوعان: ولاء العتاقة ⁦(ولاء النعمة)⁩، وسببه الإعتاق؛ وولاء الموالاة، وسببه العقد بأن يعاهد شخص آخر على أنه إن جنى فعليه أرشه، وإن مات فميراثه له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17834}\n\nالألفاظ ذات الصلة: العتق، وهو سبب الولاء، والإرث، وهو الأثر الذي يترتب عليه، والعقل، وهو الدية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17834}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835}\n\nولاء العتاقة. هو عصوبة متراخية عن عصوبة النسب، تقتضي للمعتِق ولعصبته الذكور من بعده الإرث والعقل وولاية النكاح والصلاة على من أعتقه؛ ويقع اسم «مولى العتاقة» على المعتِق وعلى العتيق، وقيل هو المعتِق وحده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835}\n\nمشروعيته بقول النبي «إنما الولاء لمن أعتق»، رواه البخاري ومسلم من حديث عائشة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835}\n\nسببه العتق. اتفق الفقهاء على أن الولاء للمعتِق إن لم يكن العتق محظوراً، سواء كان بصنعه أو بما يجري مجرى العتق شرعاً كشراء القريب وقبول الهبة والصدقة والوصية، أو بغير صنعه كأن يرث قريبه؛ وسواء كان بغير بدل أو ببدل، منجزاً أو معلقاً أو مضافاً، صريحاً أو كناية، وكذا العتق بالتدبير والاستيلاد والكتابة؛ وكذا إذا أعتق عن واجب، كالكفارة والظهار والإفطار والإيلاء واليمين والنذر، عند الحنفية والمالكية والشافعية والحنابلة في المذهب؛ والرواية الثانية عند الحنابلة أنه لا ولاء له في هذه الأحوال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17836}\n\nالولاء في العتق المحظور. العتق قد يكون محظوراً، كأن يغلب على ظن المعتِق أن العبد إن أُعتق لحق بدار الحرب أو ارتد، أو يخاف منه السرقة وقطع الطريق، أو يُعتَق للشيطان أو للصنم. قال الحنفية إن العتق ينفذ مع تحريمه، والولاء ثابت للمعتِق؛ وصرحوا بأن المعتِق للشيطان أو للصنم يكفر على الأظهر. وقال الحنابلة إن الإعتاق في هذه الأحوال مكروه، وإذا غلب الظن بإفضائه إلى المحظور كان محرماً، وإن أعتقه صح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17836}\n\nالولاء في الإعتاق سائبة، أي من يُعتق دون أن يكون عليه منه شيء. ذهب الحنفية والشافعية والحنابلة على الأصح وابن نافع من المالكية إلى أن الولاء للمعتِق، لقول النبي «إنما الولاء لمن أعتق»، ولأن الولاء لحمة كالنسب فلا يزول بالشرط؛ وذهب المالكية في المعتمد إلى كراهته، وقال أصبغ بجوازه، ومنعه ابن الماجشون؛ والحنابلة في الرواية الثانية: لا ولاء له، وما يرجع من ميراث المعتِق يُشترى به رقاب يعتقون، والصحيح أنه لبيت المال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17837}\n\nاختلاف الدين وأثره في الولاء. جمهور الفقهاء ⁦(الحنفية والشافعية والحنابلة)⁩ يرون أن المعتِق يثبت له الولاء وإن اختلف دينه عن دين المعتَق؛ واشترط المالكية تساوي الدينين، فإن كان السيد كافراً فلا ولاء له على عتيقه المسلم، بل يكون ولاؤه لجميع المسلمين، ولا يعود إليه بإسلامه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17838}\n\nبيع الولاء وهبته. لا يصحان عند الفقهاء الأربعة، لنهي النبي عن بيع الولاء وعن هبته، ولأنه معنى يُورث به فلا ينتقل كالقرابة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17838}\n\nانتقال الولاء بالموت. الولاء للمعتِق ثم لعصبته بأنفسهم دون أصحاب الفروض، ولا ترث المرأة بالولاء إلا من عتيقها وأولاده وعتقائه؛ وقال إبراهيم النخعي وشريح وطاوس إن الولاء يجري مجرى المال فيورث من المعتِق كما يورث ماله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17838}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17839}\n\nالميراث بالولاء. اتفق الفقهاء على أن السيد يرث جميع مال عتيقه إذا مات واتفق دينهما ولم يخلف وارثاً سواه، لقول النبي «الولاء لحمة كلحمة النسب»، ولحديث الحسن في إعطاء النبي مولاه ماله إن لم يكن له وارث. ويقدم المولى في الميراث على الرد وذوي الأرحام في قول جمهور العلماء. وإن كان للمعتِق عصبة من نسبه أو ذو فروض تستغرق المال فلا شيء للمولى، لحديث «ألحقوا الفرائض بأهلها». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17839}\n\nاختلاف الدين في التوارث. الحنفية والشافعية وأحمد في رواية لا يرث المعتِق المعتَق مع اختلاف دينهما، لحديث «لا يرث المسلم الكافر ولا الكافر المسلم»؛ وإن اجتمعا على الإسلام توارثا. والمالكية: إذا أعتق الكافر عبده المسلم فالولاء للمسلمين لا له، ولو أسلم بعد ذلك. أما الحنابلة في المذهب فيرون أن المسلم يرث من الكافر بالولاء، لحديث «لا يرث المسلم النصراني إلا أن يكون عبده أو أمته». وجمهور الفقهاء يمنعون أن يرث المعتَق من معتِقه، لأنه لا قرابة بينهما، وروي عن شريح وطاوس خلاف ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17840}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17841}\n\nتحمل الدية بالولاء ⁦(العاقلة)⁩. العاقلة عند جمهور الفقهاء هي العصبة النسبية، ثم العصبة بسبب العتق. فعند الحنفية إن كان القاتل معتقاً أو مولى موالاة فعاقلته مولاه وقبيلة مولاه، لقوله «مولى القوم من أنفسهم». وعند المالكية في المعتمد العاقلة عصبته النسبية، فإن لم تكن فالمعتِقون، ثم بيت المال. وعند الشافعية العاقلة عصبة النسب ثم المعتِق ثم عصبته، ثم بيت المال، والعتيق لا يعقل عن معتِقه في الأظهر. وعند الحنابلة عاقلة الإنسان عصباته كلهم من النسب والولاء إلا عمودي نسبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17841}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17842}\n\nولاء الموالاة. هو أن يعاهد شخص شخصاً آخر على أنه إن جنى فعليه أرشه، وإن مات فميراثه له. وفي حكمه ثلاثة أقوال: الأول، للحنفية وروي عن عمر وعلي وابن مسعود، إنه ولاء ثابت بعقد مشروع، يقع به التوارث والعقل، واستدلوا بقوله تعالى «والذين عقدت أيمانكم فآتوهم نصيبهم»، وبحديث تميم الداري «هو أولى الناس بمحياه ومماته»، وبأن الصحابة لم يثبتوا الولاء بمجرد الإسلام. والثاني، للمالكية في المشهور والشافعية والحنابلة، إنه غير مشروع ولا حكم له، لقوله «إنما الولاء لمن أعتق»، ولنهي «لا حلف في الإسلام»، ولأن فيه إبطال حق جماعة المسلمين الذين يعقلون عن المتوفى ويرثونه. والثالث، لإسحاق وأحمد في رواية والمالكية في مقابل المشهور، إن الولاء يثبت بنفس الإسلام على يد آخر، ويُروى عن عمر وعطاء وعمر بن عبد العزيز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17842}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17843}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17844}\n\nسبب ثبوت ولاء الموالاة. عند أصحاب القول الثالث هو نفس الإسلام على يد آخر؛ وعند الحنفية هو عقد الموالاة بالإيجاب والقبول، بأن يقول «أنت مولاي، ترثني إذا مت، وتعقل عني إذا جنيت»، فيقول «قبلت». ولو أسلم شخص على يد رجل ووالى غيره فهو مولى للذي والاه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17844}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17845}\n\nشروط عقد الموالاة عند الحنفية تسعة، أولها عقل العاقد؛ فالبلوغ شرط للانعقاد في الإيجاب، ولا ينعقد إيجاب الصبي ولو عاقلاً، أما في القبول فهو شرط النفاذ، فينعقد موقوفاً على إجازة الأب أو الوصي. والإسلام ليس شرطاً، فتصح موالاة الذمي للذمي والمسلم، والذكورة وداراً الإسلام والحرب ليست شروطاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17845}\n\nمن شروط عقد الموالاة عند الحنفية: ألا يكون لمن يعقد ولاء عتاقة، لأن ولاء العتاقة أقوى، فلا يُرفع الأقوى بالأضعف؛ وألا يكون له ولاء موالاة مع آخر قد عقل عنه، لأنه تأكد ولزم؛ وألا يكون قد عُقل عنه من بيت المال، لأن ولاءه صار لجماعة المسلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17846}\n\nوأن يكون حراً مجهول النسب، أي لا يُنسب إلى غيره، لأن من عُرف نسبه لا يجوز أن يوالي غيره، وهو المعتمد في المذهب؛ وأن لا يكون من العرب، لأن العربي له قبيلة تنصره فلا يصير مولى، وأن لا يكون من موالي العرب، لأن مولاهم منهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17846}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17847} وأن يشترط العقل والإرث، أي أن يعقل عنه إذا جنى ويرثه إذا مات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17847}\n\nصفة عقد الموالاة. الحنفية يرونه عقداً جائزاً غير لازم، لكل من طرفيه فسخه بإرادته المنفردة، كالوكالة والشركة والوصية، ما لم يكن قد عقل عنه، فإذا عقل صار لازماً لتعلق حق الغير؛ ويكون الفسخ بحضرة الآخر، فإن والى الأسفل آخر فهو نقض دلالة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17847}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17848}\n\nالأثر المترتب على عقد الموالاة: العقل في الحياة، والإرث بعد الموت؛ وعند الحنفية يرث الأسفل من الأعلى إذا شرطا ذلك في العقد، لقوله «المسلمون على شروطهم». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17848}\n\nانتقال عقد الموالاة. الولاء الثابت بهذا العقد لا يحتمل البيع أو الهبة أو الوصية، لأنه ليس مالاً، ولقوله «الولاء لحمة كلحمة النسب لا يباع ولا يوهب»؛ ولو باعه الأسفل لآخر كان ذلك نقضاً للأول وموالاة للثاني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17848}\n\nما يثبت به عقد الموالاة: عند الحنفية بما يثبت به ولاء العتاقة، من الشهادة المفسّرة أو الإقرار، ولو في مرض الموت، لأنه غير متهم إذ لا وارث معلوم له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17848}"
  en: "Wala', in the language, comes from wali, a root meaning nearness; the word is used for nearness of place, of kinship, of religion, of friendship, of support and of belief. Wala' and tawali both mean following one another without a gap between. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17833}\n\nThe majority (Malikis, Shafi'is and Hanbalis) confine wala' to the legal kinship that arises when a slave is freed and ownership of him ends. The Malikis define it as a connection like kinship that arises from manumission. The Shafi'is define it as an 'asaba arising from a freedom that comes after ownership has ended, later than the 'asaba of lineage, which gives the manumitter and his male 'asaba inheritance, the guardianship of a marriage, the funeral prayer and the payment of blood-money on his behalf. The Hanbalis define it as the establishment of a legal rule, an 'asaba fixed by manumission or by the cause of it, such as umm walad status or tadbir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17834} The Hanafis define it as a legal kinship arising from manumission or from alliance, with the effects of inheritance, blood-money and guardianship of marriage. They distinguish two kinds: wala' 'itaqa (the wala' of blessing), caused by manumission; and wala' muwala, caused by contract, in which one person covenants with another that if he commits a crime he will pay its compensation, and if he dies his estate goes to the other. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17834}\n\nRelated words: manumission ('itq), which is the cause of wala'; inheritance (irth), its effect; and blood-money ('aql), which it also causes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17834}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835}\n\nWala' of manumission (wala' al-'itaqa) is an 'asaba later than the kinship of lineage, which gives the manumitter and his male 'asaba after him inheritance, blood-money, guardianship of the marriage and the funeral prayer for the one he freed. The term 'client of manumission' (mawla al-'itaqa) applies to the manumitter and to the freed slave, and some say only to the manumitter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835}\n\nIts lawfulness rests on the Prophet's saying: 'the wala' belongs to the one who frees', which al-Bukhari and Muslim report from 'A'isha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835}\n\nIts cause is manumission. The jurists agree that wala' belongs to the manumitter where the manumission is not forbidden, whether he did it himself or by what takes the place of manumission in law, such as buying a relative, accepting a gift or charity or a bequest, or whether it came without his act, as when he inherits a relative. It holds whether the manumission is for no price, for a price, conditioned, or dated, express or implicit, and so too manumission by tadbir, by umm walad status, or by contract of purchase of freedom. It also holds where he frees a slave for a duty, such as expiation for killing, for zihar, for breaking the fast in Ramadan, for ila', for an oath or for a vow, according to the Hanafis, Malikis, Shafi'is and the school view of the Hanbalis; a Hanbali narration holds there is no wala' in these cases. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17836}\n\nWala' in forbidden manumission. Manumission may be forbidden: where the manumitter is likely to see the slave join the enemy's territory, leave Islam, or steal and raid, or where the slave is freed for the devil or an idol. The Hanafis hold that the manumission takes effect despite its prohibition and the wala' belongs to the manumitter; they say that one who frees a slave for the devil or an idol is an unbeliever on the sounder view. The Hanbalis say that manumission in such cases is disliked, that where it is likely to lead to the forbidden it is forbidden, and that if it is done it is valid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17836}\n\nWala' in manumission as a sa'iba (a freed slave whom the master releases without any obligation to him). The Hanafis, Shafis, the sounder Hanbali view and Ibn Nafi' among the Malikis hold that the wala' belongs to the manumitter, on the Prophet's saying that the wala' belongs to the one who frees, and because wala' is a kinship like lineage, which a condition does not remove. The Malikis in the settled view call it disliked; Asbagh allows it; Ibn al-Majishun forbids it. A Hanbali narration denies any wala' to the manumitter, so that what comes back from the freed man's estate is spent on freeing slaves; the sounder view, according to al-Mardawi, sends it to the public treasury. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17837}\n\nDifference of religion and its effect on wala'. The majority (Hanafis, Shafis, Hanbalis) hold that the manumitter has the wala' even when his religion differs from the freed man's. The Malikis require that the two share a religion: if the master is an unbeliever, the wala' belongs to all Muslims, and it does not return to him when he becomes a Muslim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17838}\n\nThe sale and gift of wala' are not valid according to the four schools, on the Prophet's prohibition of its sale and gift, and because it is an inheritable status that does not pass like kinship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17838}\n\nPassing of wala' on death. The wala' belongs to the manumitter and then to his male agnatic kin, and not to the sharers. A woman inherits by wala' only from her freed slave, his children and his freed slaves. Ibrahim al-Nakha'i, Shurayh and Tawus hold that wala' is like property and is inherited as the manumitter's estate is. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17838}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17839}\n\nInheritance by wala'. The jurists agree that the master inherits the whole estate of his freed man when he dies, if their religions agree and there is no other heir, on the saying that wala' is a kinship like lineage, and on the report of Hasan that the Prophet gave the master the estate where there was no heir. The master takes before the return of shares to the sharers and before the distant kin, according to the majority. If the manumitter has agnatic kin, or sharers who exhaust the estate, the master gets nothing, on the Prophet's words: give the shares to their owners, and what remains goes to the nearest male. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17839}\n\nInheritance across religion. The Hanafis, Shafis and a narration of Ahmad hold that the manumitter does not inherit from the freed man when their religions differ, on the saying that a Muslim does not inherit from an unbeliever and an unbeliever does not inherit from a Muslim; if both are Muslim they inherit each other. The Hanbalis in the school view hold that a Muslim inherits from an unbeliever by wala', on the report that a Muslim does not inherit from a Christian except a slave of his own. The majority hold that the freed man does not inherit from his manumitter, since there is no kinship between them; Shurayh and Tawus held that he did. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17840}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17841}\n\nBlood-money and the 'aqila (the kin who pay it). The majority hold that the 'aqila are the agnates, and then those related by manumission. The Hanafis: if the killer is a freed man or a client by contract, his 'aqila is his master and his master's tribe, on the saying the client of a people is of them. The Malikis (settled view): the 'aqila are the agnates, then the manumitters, then the public treasury. The Shafi'is: the agnates, then the manumitter, then his agnates, then the public treasury; a freed slave does not pay for his manumitter in the sounder view. The Hanbalis: the 'aqila are all agnates and wala'-kin except the ascendants and descendants. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17841}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17842}\n\nWala' of contract (wala' al-muwala). It is a covenant by which one man makes an alliance with another: if he commits a crime, the other pays its compensation, and if he dies, his estate goes to the other. Three views are given. The first, held by the Hanafis and reported from 'Umar, 'Ali and Ibn Mas'ud, is that it is a valid wala' by a valid contract, giving inheritance and blood-money. They cite the verse of the covenanted in Surat al-Nisa (verse 33), the verse of the remoter kin, the report of Tamim al-Dari that the convert's client is the nearest to his life and death, and the fact that the Companions did not give wala' by Islam alone. The second, held by the settled Maliki view, the Shafis and the Hanbalis, is that it has no effect at all, citing 'wala' belongs to the one who frees', the saying 'no alliance in Islam' and the harm to the Muslim community, which would otherwise inherit from the unknown dead. The third, held by Ishaq ibn Rahawayh, a Hanbali narration, a Maliki view and reported from 'Umar, 'Ata' and 'Umar ibn 'Abd al-'Aziz, is that wala' arises by conversion at another's hand, without an alliance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17842}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17843}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17844}\n\nThe cause of wala' of contract, for those who hold it valid, is the contract itself, with offer and acceptance, such as 'you are my client; you will inherit from me if I die and pay my compensation if I commit a crime'; the reply 'I accept'. A person converted at one man's hand who made alliance with another is the client of the one he allied with. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17844}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17845}\n\nThe Hanafis state nine conditions for this contract. The first is that the contracting party is sane. Adulthood is a condition of making the offer, so a minor's offer is void even if he is sane; the minor's acceptance needs the guardian's consent to take effect. Islam is not a condition: a dhimmi may make alliance with a dhimmi or a Muslim, and the sex of the parties and the abode of Islam or war do not matter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17845}\n\nAmong the Hanafi conditions of the contract of alliance: the person who makes it must have no wala' of manumission, since that is stronger and a weaker tie cannot overrule it; he must have no alliance already made with another whose blood-money he has paid, since that alliance has become firm and binding; and he must not have had his blood-money paid by the public treasury, since his wala' has then gone to the whole community of Muslims. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17846}\n\nHe must be free and of unknown lineage, meaning that he is not ascribed to another, since one whose lineage is known may not ally himself to another; this is the view relied on in the school. He must not be an Arab, since an Arab has a tribe that supports him and so does not become a client; nor a client of the Arabs, since their client is one of them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17846}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17847} The contract must include the blood-money and the inheritance: that the one allied pays the blood-money if the other commits a crime, and inherits from him if he dies. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17847}\n\nThe nature of the contract. The Hanafis hold it is a permissive contract, not binding, so either party may end it by his own will, as with agency, partnership and bequest, until he has paid blood-money on the other's behalf; then the contract is binding, since the right of another is involved. Ending it must be in the presence of the other party; if the client makes an alliance with another, that is an implied ending. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17847}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17848}\n\nThe effects of the contract are blood-money during life and inheritance after death. The Hanafis hold that the lower client may inherit from the higher one if they stipulate it in the contract, on the saying that Muslims abide by their conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17848}\n\nThe contract cannot be transferred. The wala' established by this contract cannot be sold, given or bequeathed, since it is not property and the saying that wala' is a kinship like lineage, which is not sold or given, applies to it. If the lower client sells it to another, that ends the first alliance and makes an alliance with the second. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17848}\n\nWhat proves the contract. The Hanafis hold that it is proved as wala' of manumission is proved, by an explained testimony or by acknowledgement, including acknowledgement in the last illness, since such a person is not suspected when he has no known heir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17848}"
  es: "Wala', en el idioma, proviene de wali, una raíz que significa cercanía; la palabra se usa para la cercanía de lugar, de parentesco, de religión, de amistad, de apoyo y de creencia. Wala' y tawali significan ambos seguirse uno al otro sin pausa entre ellos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17833} La mayoría (malikíes, shafi'ís y hanbalíes) limitan wala' al parentesco legal que surge cuando un esclavo es liberado y termina la propiedad de él. Los malikíes lo definen como una conexión similar al parentesco que surge de la manumisión. Los shafi'ís lo definen como un 'asaba que surge de una libertad que llega después de que ha terminado la propiedad, posterior al 'asaba de linaje, que otorga al manumitter y a su 'asaba masculino herencia, la tutela de un matrimonio, la oración fúnebre y el pago de dinero de sangre en su nombre. Los hanbalíes lo definen como el establecimiento de una regla legal, un 'asaba fijado por manumisión o por la causa de la misma, como el estatus umm walad o tadbir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17834} Los hanafíes lo definen como un parentesco legal que surge de la manumisión o de la alianza, con los efectos de herencia, compensación por sangre y tutela del matrimonio. Distinguen dos tipos: wala' 'itaqa (el wala' de bendición), causado por la manumisión; y wala' muwala, causado por contrato, en el que una persona se compromete con otra a que si comete un crimen pagará su compensación, y si muere su patrimonio pasa al otro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17834} Palabras relacionadas: manumisión ('itq), que es la causa del wala'; herencia (irth), su efecto; y dinero de sangre ('aql), que también causa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17834}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835} El wala' de manumisión (wala' al-'itaqa) es un 'asaba posterior al parentesco de linaje, que otorga al manumitter y a sus 'asaba varones después de él herencia, dinero de sangre, tutela del matrimonio y la oración fúnebre para aquel a quien liberó. El término 'cliente de manumisión' (mawla al-'itaqa) se aplica al manumitter y al esclavo liberado, y algunos dicen que solo al manumitter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835} Su licitud se basa en el dicho del Profeta: 'el wala' pertenece a quien libera', que al-Bujari y Muslim transmiten de Aisha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835} Su causa es la manumisión. Los juristas coinciden en que el wala' pertenece al manumitter cuando la manumisión no está prohibida, ya sea que la haya realizado él mismo o mediante lo que reemplaza a la manumisión en la ley, como comprar a un pariente, aceptar un regalo o caridad o un legado, o si se produjo sin su acto, como cuando hereda a un pariente. Se mantiene tanto si la manumisión es gratuita, a cambio de un precio, condicionada o fechada, expresa o implícita, como también la manumisión por tadbir, por el estatus de umm walad o por contrato de compra de libertad. También se sostiene cuando libera a un esclavo por un deber, como expiación por matar, por zihar, por romper el ayuno en Ramadán, por ila', por un juramento o por una promesa, según los Hanafis, Malikis, Shafi'is y la visión de la escuela de los Hanbalis; una narración Hanbali sostiene que no hay wala' en estos casos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17836} Wala' en manumisión prohibida. La manumisión puede estar prohibida: cuando es probable que el manumitter vea al esclavo unirse al territorio enemigo, abandonar el Islam, robar y saquear, o cuando el esclavo es liberado para el diablo o un ídolo. Los Hanafis sostienen que la manumisión tiene efecto a pesar de su prohibición y el wala' pertenece al manumitter; Dicen que quien libera a un esclavo para el diablo o un ídolo es un incrédulo según la opinión más sólida. Los hanbalíes dicen que la manumisión en tales casos es desaconsejable, que donde es probable que conduzca a lo prohibido está prohibido, y que si se hace es válido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17836} Wala' en manumisión como sa'iba (un esclavo liberado a quien el amo libera sin ninguna obligación para con él). Los hanafíes, shafiíes, la opinión hanbalí más sólida e Ibn Nafi' entre los malikíes sostienen que el wala' pertenece al manumitter, en el dicho del Profeta de que el wala' pertenece a quien libera, y porque wala' es un parentesco como el linaje, que una condición no elimina. Los malikíes en la opinión establecida lo consideran desaconsejable; Asbagh lo permite; Ibn al-Majishun lo prohíbe. Una narración hanbalí niega cualquier wala' al manumitter, de modo que lo que regresa de la herencia del hombre liberado se gasta en liberar esclavos; la opinión más sólida, según al-Mardawi, lo envía al tesoro público. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17837} Diferencia de religión y su efecto en el wala'. La mayoría (hanafíes, shafiíes, hanbalíes) sostiene que el manumitter tiene el wala' incluso cuando su religión difiere de la del hombre liberado. Los malikíes requieren que ambos compartan una religión: si el amo es un incrédulo, el wala' pertenece a todos los musulmanes y no regresa a él cuando se convierte al Islam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17838} La venta y donación de wala' no son válidas según las cuatro escuelas, debido a la prohibición del Profeta de su venta y donación, y porque es un estado hereditario que no se transmite como el parentesco. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17838} Transmisión de wala' por muerte. El wala' pertenece al manumitter y luego a sus parientes agnáticos varones, y no a los copartícipes. Una mujer hereda por wala' solo de su esclavo liberado, sus hijos y sus esclavos liberados. Ibrahim al-Nakha'i, Shurayh y Tawus sostienen que el wala' es como propiedad y se hereda como el patrimonio del manumitter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17838}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17839} Herencia por wala'. Los juristas concuerdan en que el amo hereda toda la propiedad de su hombre liberado cuando este muere, si sus religiones coinciden y no hay otro heredero, en el dicho de que wala' es un parentesco como el linaje, y en el relato de Hasan de que el Profeta dio al amo la propiedad cuando no había heredero. El amo toma antes de la devolución de las partes a los copartícipes y antes que los parientes lejanos, según la mayoría. Si el manumitter tiene parientes agnatos, o copartícipes que agotan la propiedad, el amo no recibe nada, en las palabras del Profeta: den las partes a sus dueños, y lo que queda va al varón más cercano. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17839} Herencia entre religiones. Los hanafíes, shafiíes y una narración de Ahmad sostienen que el manumitter no hereda del hombre liberado cuando sus religiones difieren, basándose en el dicho de que un musulmán no hereda de un incrédulo y un incrédulo no hereda de un musulmán; si ambos son musulmanes, se heredan mutuamente. Los hanbalíes en la escuela sostienen que un musulmán hereda de un incrédulo por wala', basándose en el relato de que un musulmán no hereda de un cristiano excepto de un esclavo propio. La mayoría sostiene que el hombre liberado no hereda de su manumitter, ya que no hay parentesco entre ellos; Shurayh y Tawus sostenían que sí lo hacía. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17840}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17841} Dinero de sangre y la 'aqila (el pariente que lo paga). La mayoría sostiene que la 'aqila son los agnados, y luego los emparentados por manumisión. Los Hanafis: si el asesino es un hombre libre o un cliente por contrato, su 'aqila es su amo y la tribu de su amo, en el dicho de que el cliente de un pueblo es de ellos. Los Malikis (visión establecida): la 'aqila son los agnados, luego los manumitters, luego el tesoro público. Los Shafi'is: los agnados, luego el manumitter, luego sus agnados, luego el tesoro público; un esclavo liberado no paga por su manumitter en la visión más sólida. Los Hanbalis: los 'aqila son todos los agnados y wala'-kin excepto los ascendientes y descendientes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17841}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17842} Wala' de contrato (wala' al-muwala). Es un pacto por el cual un hombre hace una alianza con otro: si comete un crimen, el otro paga su compensación, y si muere, su patrimonio pasa al otro. Se dan tres puntos de vista. El primero, sostenido por los Hanafis y reportado por 'Umar, 'Ali e Ibn Mas'ud, es que es un wala' válido por un contrato válido, que da herencia y compensación por sangre. Citan el versículo del pacto en Sura al-Nisa (versículo 33), el versículo del pariente más lejano, el relato de Tamim al-Dari de que el cliente del converso es el más cercano a su vida y muerte, y el hecho de que los Compañeros no otorgaron wala' solo por el Islam. La segunda postura, sostenida por la visión malikí establecida, los shafiíes y los hanbalíes, es que no tiene ningún efecto, citando que 'wala' pertenece a quien libera', el dicho 'no hay alianza en el Islam' y el daño a la comunidad musulmana, que de otro modo heredaría de los muertos desconocidos. La tercera postura, sostenida por Ishaq ibn Rahawayh, una narración hanbalí, una visión malikí y transmitida por 'Umar, 'Ata' y 'Umar ibn 'Abd al-'Aziz, es que wala' surge por la conversión por medio de otro, sin alianza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17842}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17843}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17844} La causa del wala' del contrato, para aquellos que lo consideran válido, es el contrato mismo, con oferta y aceptación, como por ejemplo: «Eres mi cliente; heredarás de mí si muero y pagarás mi indemnización si cometo un delito»; la respuesta «Acepto». Una persona convertida por medio de un hombre que se alió con otro es cliente de aquel con quien se alió. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17844}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17845} Los hanafíes establecen nueve condiciones para este contrato. La primera es que la parte contratante sea cuerda. La mayoría de edad es una condición para hacer la oferta, por lo que la oferta de un menor es nula incluso si es cuerda; la aceptación del menor necesita el consentimiento del tutor para surtir efecto. El Islam no es una condición: un dhimmi puede hacer alianza con un dhimmi o un musulmán, y el sexo de las partes y la morada del Islam o la guerra no importan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17845} Entre las condiciones hanafíes del contrato de alianza: la persona que lo hace no debe tener wala' de manumisión, ya que eso es más fuerte y un vínculo más débil no puede anularlo; No debe tener alianzas previas con otro cuyo dinero de sangre haya pagado, puesto que esa alianza se ha vuelto firme y vinculante; y no debe haber recibido el pago de su dinero de sangre del tesoro público, puesto que su wala' entonces ha pasado a toda la comunidad musulmana. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17846} Debe ser libre y de linaje desconocido, es decir, que no esté adscrito a otro, puesto que uno cuyo linaje es conocido no puede aliarse con otro; esta es la opinión en la que se basa la escuela. No debe ser árabe, puesto que un árabe tiene una tribu que lo apoya y por lo tanto no se convierte en cliente; ni cliente de los árabes, puesto que su cliente es uno de ellos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17846}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17847} El contrato debe incluir la indemnización por homicidio y la herencia: que uno de los aliados paga la indemnización si el otro comete un delito y hereda de él si muere. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17847} La naturaleza del contrato. Los hanafíes sostienen que es un contrato permisivo, no vinculante, por lo que cualquiera de las partes puede terminarlo por su propia voluntad, como con la agencia, la sociedad y el legado, hasta que haya pagado la indemnización por homicidio en nombre del otro; entonces el contrato es vinculante, ya que está en juego el derecho de otro. La terminación debe hacerse en presencia de la otra parte; si el cliente hace una alianza con otro, eso es una terminación implícita. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17847}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17848} Los efectos del contrato son indemnización por homicidio durante la vida y herencia después de la muerte. Los hanafíes sostienen que el cliente inferior puede heredar del superior si lo estipulan en el contrato, basándose en que los musulmanes se atienen a sus condiciones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17848} El contrato no puede transferirse. El wala' establecido por este contrato no puede venderse, donarse ni legarse, ya que no es propiedad y se aplica el dicho de que el wala' es un parentesco como el linaje, que no se vende ni se dona. Si el cliente inferior lo vende a otro, eso termina la primera alianza y hace una alianza con el segundo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17848} ¿Qué prueba el contrato? Los hanafíes sostienen que se prueba como se prueba el wala' de manumisión, mediante un testimonio explicado o por reconocimiento, incluyendo el reconocimiento en la última enfermedad, ya que no se sospecha de dicha persona cuando no tiene herederos conocidos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17848}"
  fr: "En kuwaitiyya, le terme « wala' » provient de « wali », une racine signifiant proximité. Il désigne la proximité géographique, familiale, religieuse, amicale, de soutien et de croyance. « Wala' » et « tawali » signifient tous deux « se suivre l'un l'autre sans interruption ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17833} La majorité des écoles de pensée (malikites, chaféites et hanbalites) limitent le « wala' » à la parenté légale qui naît de l'affranchissement d'un esclave et de la fin de la propriété. Les malikites le définissent comme un lien de parenté découlant de l'affranchissement. Les chaféites le définissent comme une « asaba » (lien de filiation) résultant d'une liberté acquise après la fin de la propriété, postérieure à l'« asaba » de lignage. Cette « asaba » confère à l'affranchi et à son « asaba » mâle l'héritage, la tutelle du mariage, la prière funéraire et le paiement du prix du sang en son nom. Les Hanbalites la définissent comme l'établissement d'une règle juridique, une 'asaba fixée par l'affranchissement ou par sa cause, telle que le statut umm walad ou le tadbir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17834} Les Hanafites la définissent comme une parenté légale découlant de l'affranchissement ou d'une alliance, avec ses effets successoraux, le prix du sang et la tutelle du mariage. Ils distinguent deux types: le wala' 'itaqa (le wala' de la bénédiction), causé par l'affranchissement; et le wala' muwala, causé par un contrat, dans lequel une personne s'engage envers une autre à payer la compensation d'un crime qu'elle commet, et à léguer ses biens à l'autre en cas de décès. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17834} Mots apparentés: affranchissement (« itq »), qui est la cause du wala'; héritage (« irth »), son effet; et le prix du sang ('aql), qu'elle entraîne également. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17834}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835} La wala' de l'affranchissement (wala' al-'itaqa) est une 'asaba postérieure à la parenté par filiation, qui confère à l'affranchi et à son 'asaba masculin successif l'héritage, le prix du sang, la tutelle du mariage et la prière funéraire pour l'esclave affranchi. Le terme « client de l'affranchissement » (mawla al-'itaqa) s'applique à la fois à l'affranchi et à l'esclave affranchi, ou, selon certains, uniquement à l'affranchi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835} Sa licéité repose sur la parole du Prophète: « La wala' appartient à celui qui affranchit », rapportée par al-Bukhari et Muslim d'après Aïcha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835} Elle a pour cause l'affranchissement. Les juristes s'accordent à dire que la wala' appartient à l'affranchi lorsque l'affranchissement n'est pas interdit, qu'il l'ait accompli lui-même ou par un moyen juridique équivalent, comme le rachat d'un proche, l'acceptation d'un don, d'une aumône ou d'un legs, ou encore qu'il soit survenu sans son intervention, par exemple lors de l'héritage d'un parent. Elle s'applique que l'affranchissement soit gratuit, payant, conditionnel ou daté, exprès ou tacite, et qu'il s'agisse d'un affranchissement par tadbir, par le statut d'umm walad ou par un contrat d'achat de liberté. Il en va de même lorsqu'un affranchissement est accordé pour accomplir un devoir, tel que l'expiation d'un meurtre, le zihar, la rupture du jeûne du Ramadan, l'ila', un serment ou un vœu, selon les écoles hanafite, malikite, chaféite et l'école hanbalite; une tradition hanbalite affirme qu'il n'y a pas de wala' dans ces cas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17836} Wala' dans l'affranchissement interdit. L'affranchissement peut être interdit: lorsque l'affranchisseur est susceptible de voir l'esclave rejoindre le territoire ennemi, renoncer à l'islam, voler et piller, ou lorsque l'esclave est affranchi pour le diable ou une idole. Les hanafites considèrent que l'affranchissement est effectif malgré son interdiction et que le wala' appartient à l'affranchisseur; Selon l'avis le plus solide, celui qui affranchit un esclave pour le diable ou une idole est un incroyant. Les Hanbalites, quant à eux, déconseillent l'affranchissement dans de tels cas, l'interdit lorsqu'il est susceptible d'entraîner l'interdit, et le licé s'il est accompli. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17836} Concernant l'affranchissement d'un sa'iba (un esclave affranchi que le maître libère sans obligation envers lui), les Hanafites, les Shafi'ites, l'avis Hanbalite le plus solide et Ibn Nafi' parmi les Malikites estiment que le wala' appartient à l'affranchisseur, se fondant sur un hadith du Prophète selon lequel le wala' appartient à celui qui affranchit, et parce que le wala' est un lien de parenté, comparable à la lignée, qu'aucune condition ne peut supprimer. L'avis Malikite établi le déconseille; Asbagh l'autorise; Ibn al-Majishun l'interdit. Selon une tradition hanbalite, le don de wala' est refusé à l'affranchi, de sorte que les fonds provenant de l'héritage de l'homme affranchi sont utilisés pour l'affranchissement d'esclaves. L'avis le plus pertinent, selon al-Mardawi, est de les verser au trésor public. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17837} Différence de religion et son incidence sur le don de wala'. La majorité des écoles (hanafites, chaféites et hanbalites) considèrent que l'affranchi conserve le don de wala' même si sa religion diffère de celle de l'affranchi. Les malikites exigent que les deux partagent la même religion: si le maître est incroyant, le don de wala' appartient à tous les musulmans et ne lui est pas restitué lorsqu'il se convertit à l'islam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17838} La vente et la donation du wala' ne sont pas valides selon les quatre écoles juridiques, en raison de l'interdiction du Prophète à cet égard, et parce qu'il s'agit d'un statut héréditaire qui ne se transmet pas comme les liens de parenté. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17838} Transmission du wala' au décès. Le wala' appartient à l'affranchi, puis à ses parents mâles par filiation, et non aux héritiers. Une femme hérite par wala' uniquement de son esclave affranchi, de ses enfants et de ses esclaves affranchis. Ibrahim al-Nakha'i, Shurayh et Tawus considèrent que le wala' est assimilable à une propriété et se transmet comme les biens de l'affranchi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17838}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17839} Héritage par wala'. Les juristes s'accordent à dire que le maître hérite de la totalité des biens de son affranchi à la mort de ce dernier, si leurs religions respectives sont compatibles et qu'il n'y a pas d'autre héritier. Ce principe repose sur le fait que la wala' est un lien de parenté assimilable à une lignée, et sur le hadith rapporté par Hassan selon lequel le Prophète a légué les biens au maître en l'absence d'héritier. Le maître hérite avant la restitution des parts aux affranchis et avant les parents plus éloignés, selon l'avis majoritaire. Si l'affranchi a des parents par filiation (agnatique) ou des affranchis qui épuisent les biens, le maître ne reçoit rien, conformément aux paroles du Prophète: « Rendez les parts à leurs propriétaires, et ce qui reste revient au plus proche parent mâle. » {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17839} Héritage interreligieux. Les hanafites, les chaféites et une narration d'Ahmad soutiennent que l'affranchi n'hérite pas de l'affranchi lorsque leurs religions diffèrent, se basant sur le dicton selon lequel un musulman n'hérite pas d'un non-croyant et un non-croyant n'hérite pas d'un musulman; s'ils sont tous deux musulmans, ils héritent l'un de l'autre. Les hanbalites, dans leur école de pensée, estiment qu'un musulman hérite d'un non-croyant par wala', se fondant sur le récit selon lequel un musulman n'hérite pas d'un chrétien, sauf de son propre esclave. La majorité considère que l'affranchi n'hérite pas de son affranchi, puisqu'il n'existe aucun lien de parenté entre eux; les écoles Shurayh et Tawus soutiennent le contraire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17840}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17841} Le prix du sang et les 'aqila (les proches qui le paient). La majorité considère que les 'aqila sont les agnats, puis les apparentés par affranchissement. Les Hanafites: si le meurtrier est un affranchi ou un client par contrat, ses 'aqila sont son maître et la tribu de celui-ci, selon le principe que le client d'un peuple en fait partie. Les Malikites (avis établi): les 'aqila sont les agnats, puis les affranchis, puis le trésor public. Les Shafi'ites: les agnats, puis l'affranchi, puis ses agnats, puis le trésor public; un esclave affranchi ne paie pas pour son affranchi, selon l'avis le plus solide. Les Hanbalites: les 'aqila sont tous les agnats et les wala'-kin, à l'exception des ascendants et des descendants. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17841}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17842} Wala' de contrat (wala' al-muwala). Il s'agit d'une alliance par laquelle un homme conclut un pacte avec un autre: s'il commet un crime, l'autre en indemnise les auteurs, et s'il décède, ses biens reviennent à l'autre. Trois avis sont présentés. Le premier, soutenu par les Hanafites et rapporté par 'Umar, 'Ali et Ibn Mas'ud, considère qu'il s'agit d'une wala' valide conclue par un contrat valide, donnant lieu à un héritage et à une compensation financière. Ils citent le verset des associés dans la sourate An-Nisa (verset 33), le verset des parents éloignés, le hadith de Tamim al-Dari selon lequel le bénéficiaire de la conversion est celui qui est le plus proche de la vie et de la mort du converti, et le fait que les Compagnons n'accordaient pas la wala' par la seule force de l'islam. La seconde opinion, défendue par l'école malikite établie, les chaféites et les hanbalites, est qu'elle est sans effet, en s'appuyant sur le principe que la wala' appartient à celui qui affranchit, le principe de « point d'alliance en islam » et le préjudice que cela causerait à la communauté musulmane, qui hériterait autrement du défunt inconnu. La troisième opinion, défendue par Ishaq ibn Rahawayh, une narration hanbalite, une opinion malikite et rapportée par 'Umar, 'Ata' et 'Umar ibn 'Abd al-'Aziz, est que la wala' résulte d'une conversion effectuée par autrui, sans alliance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17842}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17843}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17844} La cause du wala' (contrat de servitude) d'un contrat, pour ceux qui le considèrent comme valide, réside dans le contrat lui-même, avec offre et acceptation, comme par exemple: « Tu es mon client; tu hériteras de moi à ma mort et tu me verseras une compensation si je commets un crime »; la réponse étant: « J'accepte ». Une personne convertie par un homme qui a conclu une alliance avec un autre est le client de celui avec qui elle s'est alliée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17844}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17845} Les hanafites énoncent neuf conditions pour ce contrat. La première est que la partie contractante soit saine d'esprit. La majorité est une condition pour faire une offre; par conséquent, l'offre d'un mineur est nulle, même s'il est sain d'esprit; l'acceptation du mineur nécessite le consentement de son tuteur pour être valable. L'islam n'est pas une condition: un dhimmi peut s'allier avec un autre dhimmi ou un musulman, et le sexe des parties, le lieu de résidence (islam ou guerre) sont sans importance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17845} Parmi les conditions hanafites du contrat d'alliance: la personne qui le conclut ne doit avoir aucun lien d'affranchissement (wala'), car ce lien est plus fort et un lien plus faible ne peut le prévaloir; Il ne doit avoir conclu aucune alliance préalable avec une personne à qui il a versé le prix du sang, car cette alliance est devenue ferme et contraignante; et le prix du sang ne doit pas avoir été payé par le trésor public, car son wala' est alors allégé à l'ensemble de la communauté musulmane. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17846} Il doit être libre et de lignée inconnue, c'est-à-dire qu'il ne doit pas être rattaché à un autre, car celui dont la lignée est connue ne peut s'allier à un autre; c'est l'avis de cette école. Il ne doit pas être arabe, car un Arabe a une tribu qui le soutient et ne devient donc pas un client; il ne doit pas non plus être un client des Arabes, car leur client est l'un des leurs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17846}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17847} Le contrat doit inclure le prix du sang et l'héritage: l'un des alliés paie le prix du sang si l'autre commet un crime et hérite de lui à son décès. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17847} Nature du contrat: les hanafites le considèrent comme un contrat permissif, non contraignant. Chaque partie peut donc y mettre fin de son plein gré, comme pour un mandat, un partenariat ou un legs, jusqu'à ce qu'elle ait payé le prix du sang pour le compte de l'autre. Le contrat devient alors contraignant, car le droit d'autrui est en jeu. La résiliation doit se faire en présence de l'autre partie; si le client conclut une alliance avec un tiers, la résiliation est tacite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17847}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17848} Les effets de ce contrat sont le rachat de biens du vivant du titulaire et l'héritage après son décès. Les Hanafites estiment que le titulaire de moindre rang peut hériter du titulaire de rang supérieur si ce dernier le stipule dans le contrat, partant du principe que les musulmans respectent leurs engagements. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17848} Ce contrat est incessible. La wala' établie par ce contrat ne peut être vendue, donnée ni léguée, car elle n'est pas une propriété et le principe selon lequel la wala' est un lien de parenté, comparable à une lignée, qui ne peut être ni vendu ni donné, s'applique. Si le titulaire de moindre rang la cède à un tiers, cela met fin à la première alliance et en établit une avec la seconde. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17848} Qu'est-ce qui prouve le contrat ? Les hanafites estiment qu'il est prouvé de la même manière que le wala' d'affranchissement, par un témoignage commenté ou par reconnaissance, y compris une reconnaissance lors de la dernière maladie, puisqu'une telle personne n'est pas suspectée lorsqu'elle n'a pas d'héritier connu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17848}"
