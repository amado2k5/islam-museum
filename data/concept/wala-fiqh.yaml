id: concept/wala-fiqh
class: concept
kind: legal
label:
  ar: "وَلاء"
  en: "Wala' (clientage, fiqh)"
summary:
  ar: "الوَلاء لغةً من الوَلْي، وهو أصل يدل على القرب، ويُستعار للقرب في المكان والنسب والدين والصداقة والنصرة. والولاء والتوالي معناهما المتابعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17833}\n\nوقصر جمهور الفقهاء (المالكية والشافعية والحنابلة) الولاءَ على القرابة الحكمية الناشئة عن زوال الملك عن الرقيق بالحرية؛ فعرفه المالكية بأنه اتصال كالنسب نشأ عن عتق، وعرفه الشافعية بأنه عصوبة ناشئة عن حرية حدثت بعد زوال الملك، متراخية عن عصوبة النسب، تقتضي للمعتِق وعصبته الإرث وولاية النكاح والصلاة عليه والعقل عنه، وعرفه الحنابلة بأنه ثبوت حكم شرعي، وهو عصوبة ثابتة، بعتق أو تعاطي سببه كالاستيلاد والتدبير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17834} وعرّفه الحنفية بأنه قرابة حكمية حاصلة من عتق أو موالاة، ومن آثاره الإرث والعقل وولاية النكاح؛ وهو عندهم نوعان: ولاء العتاقة (ولاء النعمة)، وسببه الإعتاق؛ وولاء الموالاة، وسببه العقد بأن يعاهد شخص آخر على أنه إن جنى فعليه أرشه، وإن مات فميراثه له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17834}\n\nالألفاظ ذات الصلة: العتق، وهو سبب الولاء، والإرث، وهو الأثر الذي يترتب عليه، والعقل، وهو الدية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17834}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835}\n\nولاء العتاقة. هو عصوبة متراخية عن عصوبة النسب، تقتضي للمعتِق ولعصبته الذكور من بعده الإرث والعقل وولاية النكاح والصلاة على من أعتقه؛ ويقع اسم «مولى العتاقة» على المعتِق وعلى العتيق، وقيل هو المعتِق وحده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835}\n\nمشروعيته بقول النبي «إنما الولاء لمن أعتق»، رواه البخاري ومسلم من حديث عائشة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835}\n\nسببه العتق. اتفق الفقهاء على أن الولاء للمعتِق إن لم يكن العتق محظوراً، سواء كان بصنعه أو بما يجري مجرى العتق شرعاً كشراء القريب وقبول الهبة والصدقة والوصية، أو بغير صنعه كأن يرث قريبه؛ وسواء كان بغير بدل أو ببدل، منجزاً أو معلقاً أو مضافاً، صريحاً أو كناية، وكذا العتق بالتدبير والاستيلاد والكتابة؛ وكذا إذا أعتق عن واجب، كالكفارة والظهار والإفطار والإيلاء واليمين والنذر، عند الحنفية والمالكية والشافعية والحنابلة في المذهب؛ والرواية الثانية عند الحنابلة أنه لا ولاء له في هذه الأحوال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17836}\n\nالولاء في العتق المحظور. العتق قد يكون محظوراً، كأن يغلب على ظن المعتِق أن العبد إن أُعتق لحق بدار الحرب أو ارتد، أو يخاف منه السرقة وقطع الطريق، أو يُعتَق للشيطان أو للصنم. قال الحنفية إن العتق ينفذ مع تحريمه، والولاء ثابت للمعتِق؛ وصرحوا بأن المعتِق للشيطان أو للصنم يكفر على الأظهر. وقال الحنابلة إن الإعتاق في هذه الأحوال مكروه، وإذا غلب الظن بإفضائه إلى المحظور كان محرماً، وإن أعتقه صح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17836}\n\nالولاء في الإعتاق سائبة، أي من يُعتق دون أن يكون عليه منه شيء. ذهب الحنفية والشافعية والحنابلة على الأصح وابن نافع من المالكية إلى أن الولاء للمعتِق، لقول النبي «إنما الولاء لمن أعتق»، ولأن الولاء لحمة كالنسب فلا يزول بالشرط؛ وذهب المالكية في المعتمد إلى كراهته، وقال أصبغ بجوازه، ومنعه ابن الماجشون؛ والحنابلة في الرواية الثانية: لا ولاء له، وما يرجع من ميراث المعتِق يُشترى به رقاب يعتقون، والصحيح أنه لبيت المال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17837}\n\nاختلاف الدين وأثره في الولاء. جمهور الفقهاء (الحنفية والشافعية والحنابلة) يرون أن المعتِق يثبت له الولاء وإن اختلف دينه عن دين المعتَق؛ واشترط المالكية تساوي الدينين، فإن كان السيد كافراً فلا ولاء له على عتيقه المسلم، بل يكون ولاؤه لجميع المسلمين، ولا يعود إليه بإسلامه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17838}\n\nبيع الولاء وهبته. لا يصحان عند الفقهاء الأربعة، لنهي النبي عن بيع الولاء وعن هبته، ولأنه معنى يُورث به فلا ينتقل كالقرابة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17838}\n\nانتقال الولاء بالموت. الولاء للمعتِق ثم لعصبته بأنفسهم دون أصحاب الفروض، ولا ترث المرأة بالولاء إلا من عتيقها وأولاده وعتقائه؛ وقال إبراهيم النخعي وشريح وطاوس إن الولاء يجري مجرى المال فيورث من المعتِق كما يورث ماله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17838}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17839}\n\nالميراث بالولاء. اتفق الفقهاء على أن السيد يرث جميع مال عتيقه إذا مات واتفق دينهما ولم يخلف وارثاً سواه، لقول النبي «الولاء لحمة كلحمة النسب»، ولحديث الحسن في إعطاء النبي مولاه ماله إن لم يكن له وارث. ويقدم المولى في الميراث على الرد وذوي الأرحام في قول جمهور العلماء. وإن كان للمعتِق عصبة من نسبه أو ذو فروض تستغرق المال فلا شيء للمولى، لحديث «ألحقوا الفرائض بأهلها». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17839}\n\nاختلاف الدين في التوارث. الحنفية والشافعية وأحمد في رواية لا يرث المعتِق المعتَق مع اختلاف دينهما، لحديث «لا يرث المسلم الكافر ولا الكافر المسلم»؛ وإن اجتمعا على الإسلام توارثا. والمالكية: إذا أعتق الكافر عبده المسلم فالولاء للمسلمين لا له، ولو أسلم بعد ذلك. أما الحنابلة في المذهب فيرون أن المسلم يرث من الكافر بالولاء، لحديث «لا يرث المسلم النصراني إلا أن يكون عبده أو أمته». وجمهور الفقهاء يمنعون أن يرث المعتَق من معتِقه، لأنه لا قرابة بينهما، وروي عن شريح وطاوس خلاف ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17840}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17841}\n\nتحمل الدية بالولاء (العاقلة). العاقلة عند جمهور الفقهاء هي العصبة النسبية، ثم العصبة بسبب العتق. فعند الحنفية إن كان القاتل معتقاً أو مولى موالاة فعاقلته مولاه وقبيلة مولاه، لقوله «مولى القوم من أنفسهم». وعند المالكية في المعتمد العاقلة عصبته النسبية، فإن لم تكن فالمعتِقون، ثم بيت المال. وعند الشافعية العاقلة عصبة النسب ثم المعتِق ثم عصبته، ثم بيت المال، والعتيق لا يعقل عن معتِقه في الأظهر. وعند الحنابلة عاقلة الإنسان عصباته كلهم من النسب والولاء إلا عمودي نسبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17841}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17842}\n\nولاء الموالاة. هو أن يعاهد شخص شخصاً آخر على أنه إن جنى فعليه أرشه، وإن مات فميراثه له. وفي حكمه ثلاثة أقوال: الأول، للحنفية وروي عن عمر وعلي وابن مسعود، إنه ولاء ثابت بعقد مشروع، يقع به التوارث والعقل، واستدلوا بقوله تعالى «والذين عقدت أيمانكم فآتوهم نصيبهم»، وبحديث تميم الداري «هو أولى الناس بمحياه ومماته»، وبأن الصحابة لم يثبتوا الولاء بمجرد الإسلام. والثاني، للمالكية في المشهور والشافعية والحنابلة، إنه غير مشروع ولا حكم له، لقوله «إنما الولاء لمن أعتق»، ولنهي «لا حلف في الإسلام»، ولأن فيه إبطال حق جماعة المسلمين الذين يعقلون عن المتوفى ويرثونه. والثالث، لإسحاق وأحمد في رواية والمالكية في مقابل المشهور، إن الولاء يثبت بنفس الإسلام على يد آخر، ويُروى عن عمر وعطاء وعمر بن عبد العزيز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17842}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17843}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17844}\n\nسبب ثبوت ولاء الموالاة. عند أصحاب القول الثالث هو نفس الإسلام على يد آخر؛ وعند الحنفية هو عقد الموالاة بالإيجاب والقبول، بأن يقول «أنت مولاي، ترثني إذا مت، وتعقل عني إذا جنيت»، فيقول «قبلت». ولو أسلم شخص على يد رجل ووالى غيره فهو مولى للذي والاه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17844}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17845}\n\nشروط عقد الموالاة عند الحنفية تسعة، أولها عقل العاقد؛ فالبلوغ شرط للانعقاد في الإيجاب، ولا ينعقد إيجاب الصبي ولو عاقلاً، أما في القبول فهو شرط النفاذ، فينعقد موقوفاً على إجازة الأب أو الوصي. والإسلام ليس شرطاً، فتصح موالاة الذمي للذمي والمسلم، والذكورة وداراً الإسلام والحرب ليست شروطاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17845}\n\nمن شروط عقد الموالاة عند الحنفية: ألا يكون لمن يعقد ولاء عتاقة، لأن ولاء العتاقة أقوى، فلا يُرفع الأقوى بالأضعف؛ وألا يكون له ولاء موالاة مع آخر قد عقل عنه، لأنه تأكد ولزم؛ وألا يكون قد عُقل عنه من بيت المال، لأن ولاءه صار لجماعة المسلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17846}\n\nوأن يكون حراً مجهول النسب، أي لا يُنسب إلى غيره، لأن من عُرف نسبه لا يجوز أن يوالي غيره، وهو المعتمد في المذهب؛ وأن لا يكون من العرب، لأن العربي له قبيلة تنصره فلا يصير مولى، وأن لا يكون من موالي العرب، لأن مولاهم منهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17846}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17847} وأن يشترط العقل والإرث، أي أن يعقل عنه إذا جنى ويرثه إذا مات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17847}\n\nصفة عقد الموالاة. الحنفية يرونه عقداً جائزاً غير لازم، لكل من طرفيه فسخه بإرادته المنفردة، كالوكالة والشركة والوصية، ما لم يكن قد عقل عنه، فإذا عقل صار لازماً لتعلق حق الغير؛ ويكون الفسخ بحضرة الآخر، فإن والى الأسفل آخر فهو نقض دلالة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17847}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17848}\n\nالأثر المترتب على عقد الموالاة: العقل في الحياة، والإرث بعد الموت؛ وعند الحنفية يرث الأسفل من الأعلى إذا شرطا ذلك في العقد، لقوله «المسلمون على شروطهم». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17848}\n\nانتقال عقد الموالاة. الولاء الثابت بهذا العقد لا يحتمل البيع أو الهبة أو الوصية، لأنه ليس مالاً، ولقوله «الولاء لحمة كلحمة النسب لا يباع ولا يوهب»؛ ولو باعه الأسفل لآخر كان ذلك نقضاً للأول وموالاة للثاني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17848}\n\nما يثبت به عقد الموالاة: عند الحنفية بما يثبت به ولاء العتاقة، من الشهادة المفسّرة أو الإقرار، ولو في مرض الموت، لأنه غير متهم إذ لا وارث معلوم له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17848}"
  en: "Wala', in the language, comes from wali, a root meaning nearness; the word is used for nearness of place, of kinship, of religion, of friendship, of support and of belief. Wala' and tawali both mean following one another without a gap between. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17833}\n\nThe majority (Malikis, Shafi'is and Hanbalis) confine wala' to the legal kinship that arises when a slave is freed and ownership of him ends. The Malikis define it as a connection like kinship that arises from manumission. The Shafi'is define it as an 'asaba arising from a freedom that comes after ownership has ended, later than the 'asaba of lineage, which gives the manumitter and his male 'asaba inheritance, the guardianship of a marriage, the funeral prayer and the payment of blood-money on his behalf. The Hanbalis define it as the establishment of a legal rule, an 'asaba fixed by manumission or by the cause of it, such as umm walad status or tadbir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17834} The Hanafis define it as a legal kinship arising from manumission or from alliance, with the effects of inheritance, blood-money and guardianship of marriage. They distinguish two kinds: wala' 'itaqa (the wala' of blessing), caused by manumission; and wala' muwala, caused by contract, in which one person covenants with another that if he commits a crime he will pay its compensation, and if he dies his estate goes to the other. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17834}\n\nRelated words: manumission ('itq), which is the cause of wala'; inheritance (irth), its effect; and blood-money ('aql), which it also causes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17834}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835}\n\nWala' of manumission (wala' al-'itaqa) is an 'asaba later than the kinship of lineage, which gives the manumitter and his male 'asaba after him inheritance, blood-money, guardianship of the marriage and the funeral prayer for the one he freed. The term 'client of manumission' (mawla al-'itaqa) applies to the manumitter and to the freed slave, and some say only to the manumitter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835}\n\nIts lawfulness rests on the Prophet's saying: 'the wala' belongs to the one who frees', which al-Bukhari and Muslim report from 'A'isha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835}\n\nIts cause is manumission. The jurists agree that wala' belongs to the manumitter where the manumission is not forbidden, whether he did it himself or by what takes the place of manumission in law, such as buying a relative, accepting a gift or charity or a bequest, or whether it came without his act, as when he inherits a relative. It holds whether the manumission is for no price, for a price, conditioned, or dated, express or implicit, and so too manumission by tadbir, by umm walad status, or by contract of purchase of freedom. It also holds where he frees a slave for a duty, such as expiation for killing, for zihar, for breaking the fast in Ramadan, for ila', for an oath or for a vow, according to the Hanafis, Malikis, Shafi'is and the school view of the Hanbalis; a Hanbali narration holds there is no wala' in these cases. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17835}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17836}\n\nWala' in forbidden manumission. Manumission may be forbidden: where the manumitter is likely to see the slave join the enemy's territory, leave Islam, or steal and raid, or where the slave is freed for the devil or an idol. The Hanafis hold that the manumission takes effect despite its prohibition and the wala' belongs to the manumitter; they say that one who frees a slave for the devil or an idol is an unbeliever on the sounder view. The Hanbalis say that manumission in such cases is disliked, that where it is likely to lead to the forbidden it is forbidden, and that if it is done it is valid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17836}\n\nWala' in manumission as a sa'iba (a freed slave whom the master releases without any obligation to him). The Hanafis, Shafis, the sounder Hanbali view and Ibn Nafi' among the Malikis hold that the wala' belongs to the manumitter, on the Prophet's saying that the wala' belongs to the one who frees, and because wala' is a kinship like lineage, which a condition does not remove. The Malikis in the settled view call it disliked; Asbagh allows it; Ibn al-Majishun forbids it. A Hanbali narration denies any wala' to the manumitter, so that what comes back from the freed man's estate is spent on freeing slaves; the sounder view, according to al-Mardawi, sends it to the public treasury. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17837}\n\nDifference of religion and its effect on wala'. The majority (Hanafis, Shafis, Hanbalis) hold that the manumitter has the wala' even when his religion differs from the freed man's. The Malikis require that the two share a religion: if the master is an unbeliever, the wala' belongs to all Muslims, and it does not return to him when he becomes a Muslim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17838}\n\nThe sale and gift of wala' are not valid according to the four schools, on the Prophet's prohibition of its sale and gift, and because it is an inheritable status that does not pass like kinship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17838}\n\nPassing of wala' on death. The wala' belongs to the manumitter and then to his male agnatic kin, and not to the sharers. A woman inherits by wala' only from her freed slave, his children and his freed slaves. Ibrahim al-Nakha'i, Shurayh and Tawus hold that wala' is like property and is inherited as the manumitter's estate is. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17838}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17839}\n\nInheritance by wala'. The jurists agree that the master inherits the whole estate of his freed man when he dies, if their religions agree and there is no other heir, on the saying that wala' is a kinship like lineage, and on the report of Hasan that the Prophet gave the master the estate where there was no heir. The master takes before the return of shares to the sharers and before the distant kin, according to the majority. If the manumitter has agnatic kin, or sharers who exhaust the estate, the master gets nothing, on the Prophet's words: give the shares to their owners, and what remains goes to the nearest male. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17839}\n\nInheritance across religion. The Hanafis, Shafis and a narration of Ahmad hold that the manumitter does not inherit from the freed man when their religions differ, on the saying that a Muslim does not inherit from an unbeliever and an unbeliever does not inherit from a Muslim; if both are Muslim they inherit each other. The Hanbalis in the school view hold that a Muslim inherits from an unbeliever by wala', on the report that a Muslim does not inherit from a Christian except a slave of his own. The majority hold that the freed man does not inherit from his manumitter, since there is no kinship between them; Shurayh and Tawus held that he did. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17840}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17841}\n\nBlood-money and the 'aqila (the kin who pay it). The majority hold that the 'aqila are the agnates, and then those related by manumission. The Hanafis: if the killer is a freed man or a client by contract, his 'aqila is his master and his master's tribe, on the saying the client of a people is of them. The Malikis (settled view): the 'aqila are the agnates, then the manumitters, then the public treasury. The Shafi'is: the agnates, then the manumitter, then his agnates, then the public treasury; a freed slave does not pay for his manumitter in the sounder view. The Hanbalis: the 'aqila are all agnates and wala'-kin except the ascendants and descendants. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17841}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17842}\n\nWala' of contract (wala' al-muwala). It is a covenant by which one man makes an alliance with another: if he commits a crime, the other pays its compensation, and if he dies, his estate goes to the other. Three views are given. The first, held by the Hanafis and reported from 'Umar, 'Ali and Ibn Mas'ud, is that it is a valid wala' by a valid contract, giving inheritance and blood-money. They cite the verse of the covenanted in Surat al-Nisa (verse 33), the verse of the remoter kin, the report of Tamim al-Dari that the convert's client is the nearest to his life and death, and the fact that the Companions did not give wala' by Islam alone. The second, held by the settled Maliki view, the Shafis and the Hanbalis, is that it has no effect at all, citing 'wala' belongs to the one who frees', the saying 'no alliance in Islam' and the harm to the Muslim community, which would otherwise inherit from the unknown dead. The third, held by Ishaq ibn Rahawayh, a Hanbali narration, a Maliki view and reported from 'Umar, 'Ata' and 'Umar ibn 'Abd al-'Aziz, is that wala' arises by conversion at another's hand, without an alliance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17842}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17843}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17844}\n\nThe cause of wala' of contract, for those who hold it valid, is the contract itself, with offer and acceptance, such as 'you are my client; you will inherit from me if I die and pay my compensation if I commit a crime'; the reply 'I accept'. A person converted at one man's hand who made alliance with another is the client of the one he allied with. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17844}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17845}\n\nThe Hanafis state nine conditions for this contract. The first is that the contracting party is sane. Adulthood is a condition of making the offer, so a minor's offer is void even if he is sane; the minor's acceptance needs the guardian's consent to take effect. Islam is not a condition: a dhimmi may make alliance with a dhimmi or a Muslim, and the sex of the parties and the abode of Islam or war do not matter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17845}\n\nAmong the Hanafi conditions of the contract of alliance: the person who makes it must have no wala' of manumission, since that is stronger and a weaker tie cannot overrule it; he must have no alliance already made with another whose blood-money he has paid, since that alliance has become firm and binding; and he must not have had his blood-money paid by the public treasury, since his wala' has then gone to the whole community of Muslims. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17846}\n\nHe must be free and of unknown lineage, meaning that he is not ascribed to another, since one whose lineage is known may not ally himself to another; this is the view relied on in the school. He must not be an Arab, since an Arab has a tribe that supports him and so does not become a client; nor a client of the Arabs, since their client is one of them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17846}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17847} The contract must include the blood-money and the inheritance: that the one allied pays the blood-money if the other commits a crime, and inherits from him if he dies. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17847}\n\nThe nature of the contract. The Hanafis hold it is a permissive contract, not binding, so either party may end it by his own will, as with agency, partnership and bequest, until he has paid blood-money on the other's behalf; then the contract is binding, since the right of another is involved. Ending it must be in the presence of the other party; if the client makes an alliance with another, that is an implied ending. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17847}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17848}\n\nThe effects of the contract are blood-money during life and inheritance after death. The Hanafis hold that the lower client may inherit from the higher one if they stipulate it in the contract, on the saying that Muslims abide by their conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17848}\n\nThe contract cannot be transferred. The wala' established by this contract cannot be sold, given or bequeathed, since it is not property and the saying that wala' is a kinship like lineage, which is not sold or given, applies to it. If the lower client sells it to another, that ends the first alliance and makes an alliance with the second. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17848}\n\nWhat proves the contract. The Hanafis hold that it is proved as wala' of manumission is proved, by an explained testimony or by acknowledgement, including acknowledgement in the last illness, since such a person is not suspected when he has no known heir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17848}"
