id: concept/canon-regimen-of-spring
class: concept
kind: scientific
label:
  ar: "تدبير الربيع عند ابن سينا"
  en: "The regimen of spring in the Canon"
  fr: "Régime de printemps dans le Canon"
  ur: "موسم بہار کی تدبیر قانون میں"
  es: "El régimen de primavera en el Canon"
  tr: "İbn Sina'ya göre Baharın Yönetimi"
  id: "Mengelola Mata Air Menurut Ibn Sina"
summary:
  ar: "يفتتح ابن سينا التعليم الخامس، في الانتقالات، بفصل مفرد في تدبير الفصول، ويبدأ بالربيع: فصد وإسهال في أوائله بحسب الحاجة والعادة، واستعمال القيء خاصة، وهجر ما يسخن ويرطب من اللحوم والأشربة، وتلطيف الغذاء، ورياضة معتدلة فوق رياضة الصيف {cite:canon-ibn-sina-print-v1 p.258}."
  en: "Ibn Sina opens the fifth teaching, on transitions, with a single chapter on the regimen of the seasons and begins with spring: venesection and purging early in the season according to need and habit, vomiting in particular, giving up the meats and drinks that heat and moisten, lightening the diet, and exercise moderate yet above that of summer {cite:canon-ibn-sina-print-v1 p.258}."
  fr: "Ibn Sina ouvre le cinquième enseignement, sur les transitions, par un chapitre unique sur le régime des saisons : au printemps, saignée et purge précoces selon besoin et habitude, surtout vomissement, abandon des viandes et boissons très réchauffantes et humidifiantes, nourriture allégée et exercice modéré mais supérieur à celui d’été {cite:canon-ibn-sina-print-v1 p.258}."
  es: "Ibn Sina abre la quinta enseñanza, sobre las transiciones, con un solo capítulo sobre el régimen de las estaciones y comienza con la primavera: venesección y purga al principio de la estación según la necesidad y la costumbre, vómitos en particular, renunciar a las carnes y bebidas que calientan y humedecen, aligerar la dieta y ejercicio moderado pero superior al del verano {cite:canon-ibn-sina-print-v1 p.258}."
  ur: "ابن سینا نے پانچویں تعلیم کا آغاز موسموں کے نظام کے ایک باب کے ساتھ کیا ہے اور موسم بہار سے شروع ہوتا ہے: ضرورت اور عادت کے مطابق موسم کے اوائل میں نس نکالنا اور صاف کرنا، خاص طور پر قے کرنا، ایسے گوشت اور مشروبات کو ترک کرنا جو گرم اور نم کرتے ہیں، خوراک کو ہلکا کرنا، اور اعتدال پسند ورزش کرنا گرمیوں کے اوپری حصے میں: صفحہ 258}۔"
  tr: "İbn Sina, geçiş döneminde beşinci eğitimi, ilkbaharda başlayan derslerin yönetimiyle ilgili tek bir bölümle açar: ihtiyaç ve alışkanlığa göre erken aşamalarda ishal ve ishal, özellikle kusmuk kullanımı, et ve içecekleri ısıtan ve nemlendiren şeyleri bırakmak, yiyecekleri yumuşatmak ve yaz egzersizinden sonra orta düzeyde egzersiz {cite:canon-ibn-sina-print-v1 s.258}."
  id: "Ibn Sina membuka pendidikan kelima selama masa transisi dengan satu bab tentang pengelolaan kelas, dimulai pada musim semi: diare dan diare pada tahap awal sesuai kebutuhan dan kebiasaan, terutama menggunakan muntah, meninggalkan apa yang menghangatkan dan melembapkan daging dan minuman, melembutkan makanan, dan olahraga sedang di atas olahraga musim panas {cite:canon-ibn-sina-print-v1 hlm.258}."
