summary:
  ar: "يفتتح ابن سينا التعليم الخامس، في الانتقالات، بفصل مفرد في تدبير الفصول، ويبدأ بالربيع: فصد وإسهال في أوائله بحسب الحاجة والعادة، واستعمال القيء خاصة، وهجر ما يسخن ويرطب من اللحوم والأشربة، وتلطيف الغذاء، ورياضة معتدلة فوق رياضة الصيف {cite:canon-ibn-sina-print-v1 p.258}."
  en: "Ibn Sina opens the fifth teaching, on transitions, with a single chapter on the regimen of the seasons and begins with spring: venesection and purging early in the season according to need and habit, vomiting in particular, giving up the meats and drinks that heat and moisten, lightening the diet, and exercise moderate yet above that of summer {cite:canon-ibn-sina-print-v1 p.258}."
