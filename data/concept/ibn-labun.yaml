label: { ar: "ابن لبون", en: "Young male camel (ibn labun)" }
summary:
  ar: "تعرّف الموسوعة الفقهية الكويتية ابن اللبون بأنه ولد الناقة الذكر إذا استكمل سنته الثانية وطعن في الثالثة، سمي بذلك لأن أمه ولدت غيره فصار لها لبن. وفي الزكاة: اتفق الفقهاء عدا الحنفية على أنه يحل محل بنت المخاض عند فقدها، لأن الأصل في زكاة الإبل الإناث، ويجوز في بعض المذاهب حلول الذكر الأعلى سناً محل الواجبة، وقال الحنفية لا يحل محلها بل يصار إلى القيمة. وفي الدية: اتفقت المذاهب الأربعة على أنه لا يكون من أصناف الدية المغلظة، ومنع الحنفية والحنابلة أخذه في الدية المخففة، وقال الشافعية والمالكية: يدفع فيها ويكون من أصنافها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1465} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1466}"
  en: "The Kuwaiti encyclopedia defines ibn labun as the male young of a she-camel that has completed its second year and entered its third; it is so named because its mother has borne another and so has milk. On zakat, the jurists except the Hanafis agree that it takes the place of a bint makhad (a she-camel in her second year) when that is lacking, because the basis for camel zakat is females; some schools allow an older male to stand in place of the required female. The Hanafis say it does not stand in its place, and the value is paid instead. On blood money, the four schools agree that it is not one of the categories of the heavy diya; the Hanafis and Hanbalis forbid taking it in the light diya; the Shafi'is and Malikis say it is given in the light diya and is one of its categories. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1465} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1466}"
