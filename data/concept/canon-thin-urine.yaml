  en: "Ibn Sina opens the third chapter, on the consistency of urine, dividing it into thin, thick and moderate, and says very thin urine shows lack of ripening, obstructions, a weak kidney, much water-drinking or severe cold with dryness {cite:canon-ibn-sina-print-v1 p.189}."
