id: concept/canon-thin-urine
class: concept
kind: scientific
label: { ar: "البول الرقيق عند ابن سينا", en: "Thin urine in the Canon", ur: "پتلا پیشاب قانون میں", es: "Orina diluida en el cañón", fr: "Urine fluide dans le Canon", tr: "İbn Sina'ya göre ince derili idrar", id: "Urin berkulit tipis menurut Ibn Sina" }
summary:
  ar: "يفتتح ابن سينا الفصل الثالث في قوام البول، فيقسمه إلى رقيق وغليظ ومعتدل، ويبين أن الرقيق جداً يدل على عدم النضج أو السدد أو ضعف الكلية أو كثرة شرب الماء أو شدة البرد مع اليبس {cite:canon-ibn-sina-print-v1 p.189}."
  en: "Ibn Sina opens the third chapter, on the consistency of urine, dividing it into thin, thick and moderate, and says very thin urine shows lack of ripening, obstructions, a weak kidney, much water-drinking or severe cold with dryness {cite:canon-ibn-sina-print-v1 p.189}."
  es: "Ibn Sina abre el tercer capítulo, sobre la consistencia de la orina, dividiéndola en líquida, espesa y moderada, y dice que la orina muy líquida muestra falta de maduración, obstrucciones, un riñón débil, mucha agua o frío intenso con sequedad {cite:canon-ibn-sina-print-v1 p.189}."
  fr: "Ibn Sina ouvre le troisième chapitre, sur la consistance de l'urine, la divisant en fluide, épaisse et moyenne, et dit que l'urine très fluide indique un manque de maturation, des obstructions, un rein faible, une forte consommation d'eau ou un rhume sévère avec sécheresse {cite:canon-ibn-sina-print-v1 p.189}."
  ur: "ابن سینا نے تیسرا باب پیشاب کی مستقل مزاجی پر کھولتے ہوئے اسے پتلے، موٹے اور اعتدال میں تقسیم کیا ہے اور کہا ہے کہ بہت پتلا پیشاب پکنے کی کمی، رکاوٹ، کمزور گردہ، زیادہ پانی پینا یا خشکی کے ساتھ شدید سردی کو ظاہر کرتا ہے۔"
  tr: "İbn Sina, idrar kıvamı üzerine üçüncü bölümü açar; idrarı ince, kaba ve orta olarak ikiye ayırır ve çok inceliğin olgunlaşmamışlık, tıkanıklık, böbrek zayıflığı, aşırı su tüketimi, şiddetli soğuk algınlığı ve kuruluk anlamına geldiğini açıklar {cite:canon-ibn-sina-print-v1 s.189}."
  id: "Ibn Sina membuka bab ketiga tentang konsistensi urin, membaginya menjadi tipis, kasar, dan sedang, menjelaskan bahwa sangat tipis menunjukkan ketidakmatangan, penyumbatan, kelemahan ginjal, asupan air berlebihan, dingin parah, dan kekeringan {cite:canon-ibn-sina-print-v1 hlm.189}."
