summary:
  ar: 'المتكبر: المتعالي عن صفات الخلق المتصف بالكبرياء والعظمة. الاسم رقم 10 في التعداد الوارد في حديث الترمذي عن أسماء الله الحسنى.'
  en: al-Mutakabbir — The Supremely Great. Name 10 in the enumeration of the most beautiful names in the Tirmidhi hadith.
  fr: "al-Mutakabbir — Le Suprême. Nom 10 dans l’énumération des plus beaux noms du hadith de Tirmidhi."
  ur: 'المتكبر: بڑائی والا — مخلوق کی صفات سے بلند، کبریائی اور عظمت کا حامل۔ اسمائے حسنیٰ کی ترمذی والی گنتی میں نمبر 10۔'
  es: "al-Mutakabbir — El Supremo. Nombre número 10 en la enumeración de los nombres más bellos en el hadiz de Tirmidhi."
  tr: "El-Mütakbir: Yaratılışın gurur ve büyüklükle karakterize edilen niteliklerini aşan kişi. El-Tirmidi'nin Allah'ın İsimleri hakkındaki hadislerinde listede 10 numaralı isimdir."
  id: "Al-Mutakbir: dia yang melampaui sifat-sifat ciptaan yang ditandai dengan kesombongan dan kebesaran. Nama nomor 10 dalam daftar yang disebutkan dalam hadits al-Tirmidhi tentang Nama-nama Allah."
