id: concept/hisab-sawm-arafa-wa-ashura
class: concept
kind: doctrine
label:
  ar: "صوم يوم عرفة ويوم عاشوراء"
  en: "Fasting the day of Arafa and the day of Ashura"
  ur: "یومِ عرفہ اور یومِ عاشورا کا روزہ"
  es: "Ayunar el día de Arafa y el día de Ashura."
  fr: "Jeûner le jour d'Arafat et le jour d'Achoura"
  tr: "Arafah ve Aşura Günü Oruçları"
  id: "Puasa pada Hari Arafah dan Hari Ashura"
summary:
  ar: "في حديث أبي قتادة عند مسلم أن صيام يوم عرفة يُحتسب على الله أن يكفّر السنة التي قبله والسنة التي بعده، وأن صيام يوم عاشوراء يُحتسب على الله أن يكفّر السنة التي قبله، وأن ثلاثا من كل شهر ورمضان إلى رمضان صيام الدهر كله [[passage/muslim-1162]]. والوحدة هنا زمنية: يوم بسنة أو بسنتين."
  en: "In Abu Qatada's hadith in Muslim, the fast of the day of Arafa is hoped from God to expiate the year before it and the year after, the fast of the day of Ashura to expiate the year before it, and three days of every month with Ramadan to Ramadan are the fast of all time [[passage/muslim-1162]]. The unit here is time: a day for a year, or for two."
  ur: "مسلم میں ابو قتادہ کی حدیث میں ہے کہ یومِ عرفہ کے روزے سے اللہ سے امید ہے کہ پچھلے اور اگلے سال کا کفارہ ہو، یومِ عاشورا کے روزے سے پچھلے سال کا، اور ہر مہینے کے تین روزے اور رمضان سے رمضان پورے زمانے کے روزے ہیں [[passage/muslim-1162]]۔ یہاں اکائی وقت ہے: ایک دن کے بدلے ایک یا دو سال۔"
  es: "En el hadiz de Abu Qatada en Muslim, se espera que el ayuno del día de Arafa expíe el año anterior y el siguiente, el ayuno del día de Ashura expíe el año anterior, y los tres días de cada mes, incluyendo Ramadán, constituyen el ayuno de todos los tiempos [[passage/muslim-1162]]. La unidad de medida aquí es el tiempo: un día por un año, o por dos."
  fr: "Dans le hadith rapporté par Abu Qatada dans Muslim, il est dit que le jeûne du jour d'Arafat est une grâce divine qui expie les péchés de l'année précédente et de l'année suivante, celui du jour d'Achoura expie l'année précédente, et que les trois jours de chaque mois, du Ramadan au Ramadan lui-même, constituent le jeûne éternel [[passage/muslim-1162]]. L'unité de mesure est ici le temps: un jour pour une année, ou pour deux."
  tr: "Ebu Kateda'nın Müslüman'a göre hadisinde, Arafah Günü orucu, Allah tarafından bir önceki yıl ve sonraki yılı kefaret olarak sayar; Aşura gününde oruç tutmak ise Allah'a göre bir önceki yılı kefaret olarak kabul eder ve her ayın üç günü ile Ramazan'a kadar olan Ramazan tüm ömür boyu oruç sayılır [[passage/Muslim-1162]]. Burada birlik geçicidir: bir ya da iki yıl olan bir gün."
  id: "Dalam hadits Abu Qatada menurut Muslim, puasa pada Hari Arafah dihitung oleh Allah sebagai penebusan pada tahun sebelumnya dan tahun setelahnya, dan puasa pada hari Ashura dianggap oleh Allah sebagai penebusan tahun sebelumnya, dan tiga hari setiap bulan serta Ramadan hingga Ramadan dianggap puasa sepanjang hayat [[Perjalanan/Muslim-1162]]. Di sini, kesatuan bersifat sementara: satu hari dengan satu atau dua tahun."
