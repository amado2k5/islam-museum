id: concept/hisab-sawm-arafa-wa-ashura
class: concept
kind: doctrine
label:
  ar: "صوم يوم عرفة ويوم عاشوراء"
  en: "Fasting the day of Arafa and the day of Ashura"
  ur: "یومِ عرفہ اور یومِ عاشورا کا روزہ"
summary:
  ar: "في حديث أبي قتادة عند مسلم أن صيام يوم عرفة يُحتسب على الله أن يكفّر السنة التي قبله والسنة التي بعده، وأن صيام يوم عاشوراء يُحتسب على الله أن يكفّر السنة التي قبله، وأن ثلاثا من كل شهر ورمضان إلى رمضان صيام الدهر كله [[passage/muslim-1162]]. والوحدة هنا زمنية: يوم بسنة أو بسنتين."
  en: "In Abu Qatada's hadith in Muslim, the fast of the day of Arafa is hoped from God to expiate the year before it and the year after, the fast of the day of Ashura to expiate the year before it, and three days of every month with Ramadan to Ramadan are the fast of all time [[passage/muslim-1162]]. The unit here is time: a day for a year, or for two."
  ur: "مسلم میں ابو قتادہ کی حدیث میں ہے کہ یومِ عرفہ کے روزے سے اللہ سے امید ہے کہ پچھلے اور اگلے سال کا کفارہ ہو، یومِ عاشورا کے روزے سے پچھلے سال کا، اور ہر مہینے کے تین روزے اور رمضان سے رمضان پورے زمانے کے روزے ہیں [[passage/muslim-1162]]۔ یہاں اکائی وقت ہے: ایک دن کے بدلے ایک یا دو سال۔"
