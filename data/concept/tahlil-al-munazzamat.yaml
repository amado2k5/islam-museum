  en: "The '1442' method for analysing organisations"
  ur: "تنظیموں کے تجزیے کا «1442» طریقہ"
summary:
  ar: "نموذج يصفه طارق السويدان بأنه من اختراعه لتقويم أي منظمة أو تأسيسها: التخطيط في القمة، ثم أركان العمل الأربعة وأركان التنافس الأربعة، ثم البنية التحتية من مبنى ومال."
  en: "A model Tareq al-Suwaidan describes as his own invention for assessing or founding any organisation: planning at the top, then four pillars of work and four pillars of competition, then the infrastructure of building and money."
  ur: "ایک ماڈل جسے طارق السویدان اپنی ایجاد بتاتے ہیں، کسی بھی تنظیم کی جانچ یا تاسیس کے لیے: چوٹی پر منصوبہ بندی، پھر کام کے چار ارکان اور مسابقت کے چار ارکان، پھر عمارت اور پیسے کا بنیادی ڈھانچہ۔"
