label:
  ar: "طريقة 1442 في تحليل المنظمات"
  en: "The '1442' method for analysing organisations"
  ur: "تنظیموں کے تجزیے کا «1442» طریقہ"
  es: "El método '1442' para analizar organizaciones"
  fr: "La méthode « 1442 » d’analyse des organisations"
  tr: "Örgütsel Analizde Yöntem 1442"
  id: "Metode 1442 dalam Analisis Organisasi"
summary:
  ar: "نموذج يصفه طارق السويدان بأنه من اختراعه لتقويم أي منظمة أو تأسيسها: التخطيط في القمة، ثم أركان العمل الأربعة وأركان التنافس الأربعة، ثم البنية التحتية من مبنى ومال."
  en: "A model Tareq al-Suwaidan describes as his own invention for assessing or founding any organisation: planning at the top, then four pillars of work and four pillars of competition, then the infrastructure of building and money."
  ur: "ایک ماڈل جسے طارق السویدان اپنی ایجاد بتاتے ہیں، کسی بھی تنظیم کی جانچ یا تاسیس کے لیے: چوٹی پر منصوبہ بندی، پھر کام کے چار ارکان اور مسابقت کے چار ارکان، پھر عمارت اور پیسے کا بنیادی ڈھانچہ۔"
  es: "Tareq al-Suwaidan describe como un modelo de su propia invención para evaluar o fundar cualquier organización: planificación en la cúpula, luego cuatro pilares de trabajo y cuatro pilares de competencia, y finalmente la infraestructura de construcción y financiación."
  fr: "Un modèle que Tareq al-Suwaidan décrit comme sa propre invention pour évaluer ou fonder toute organisation: la planification au sommet, puis quatre piliers de travail et quatre piliers de concurrence, puis l'infrastructure de construction et d'argent."
  tr: "Tariq Al-Suwaidan tarafından herhangi bir organizasyonu değerlendirmek veya kurmak için icadı olarak tanımlanan bir model: önce en üstte planlama, sonra çalışmanın dört sütunu ve rekabetin dört sütunu, ardından bina ve para altyapısı."
  id: "Model yang digambarkan oleh Tariq Al-Suwaidan sebagai penemuannya untuk mengevaluasi atau mendirikan organisasi apa pun: perencanaan di puncak, lalu empat pilar kerja dan empat pilar persaingan, kemudian infrastruktur bangunan dan uang."
