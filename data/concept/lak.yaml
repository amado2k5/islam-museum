summary:
  ar: "اللك صمغ، قيل هو صمغ حشيشة شبيهة بالمر، وقيل هو الكهرباء، وهو مهزل بقوة، وينفع الكبد واليرقان والاستسقاء والخفقان {cite:canon-ibn-sina-print-v1 p.539}."
  en: "Lak is a gum; Paulus said it is the gum of an herb like myrrh, others said it is amber, and it is strongly slimming; it helps the liver, jaundice, dropsy and palpitation {cite:canon-ibn-sina-print-v1 p.539}."
  ur: "لک ایک گوند ہے؛ بولس نے کہا کہ یہ مر جیسی ایک بوٹی کی گوند ہے، دوسروں نے اسے کہربا کہا، اور یہ شدت سے لاغر کرتی ہے؛ جگر، یرقان، استسقا اور دھڑکن میں مفید ہے {cite:canon-ibn-sina-print-v1 p.539}۔"
