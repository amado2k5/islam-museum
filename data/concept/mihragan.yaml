  tr: "Persler arasında Mahramet'in on altıncı günü ve Novruz ile arasında yüz yetmiş dört gün sürer. Arapların sevinç gösterdiği Arap olmayanların bayramlarından biridir {atıf:muruj-al-dhahab, s. 507}."
  id: "Hari keenam belas Mahramah di antara orang Persia, dan antara hari itu dan Nowruz adalah seratus tujuh puluh empat hari. Ini adalah salah satu festival non-Arab di mana mereka menunjukkan sukacita {cite:muruj-al-dhahab, hlm. 507}."
