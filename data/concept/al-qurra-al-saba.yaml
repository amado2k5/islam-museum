label: { ar: "القراء السبعة", en: "The Seven Readers" }
summary:
  ar: "قراء القرآن السبعة الذين استقصى ابن النديم أخبارهم وأسماء رواياتهم وقراءاتهم: أبو عمرو بن العلاء البصري، ونافع بن عبد الرحمن بن أبي نعيم المدني وروى الأصمعي عنه أن أصله من أصبهان، وعبد الله بن كثير المكي مولى عمرو بن علقمة الكناني يقال له الداراني لأنه كان عطاراً والعطار يقال له بالحجاز الداراني وقيل إنه من أبناء فارس الذين بعثهم كسرى في الشون إلى اليمن حتى طردوا الحبشة مات سنة عشرين ومائة بمكة وإليه صارت الرئاسة، وعاصم بن بهدلة الكوفي مولى بني جذيمة توفي سنة ثمان وعشرين ومائة وقرأ على أبي عبد الرحمن السلمي وزر بن حبيش وروى عنه أبو بكر بن عياش وحفص بن سليمان وكانت قراءته مرتفعة إلى علي بن أبي طالب رواية أبي عبد الرحمن السلمي، وعبد الله بن عامر اليحصبي الدمشقي أخذ القرآن عن عثمان بن عفان وقرأ عليه توفي سنة ثمان عشرة ومائة، وحمزة بن حبيب الزيات الكوفي مولى آل عكرمة بن ربيع التيمي كان يجلب الزيت من الكوفة إلى حلوان ويحمل من حلوان الجبن والجوز إلى الكوفة وكان فقيهاً توفي سنة ست وخمسين ومائة وله كتاب قراءة حمزة وكتاب الفرائض، والكسائي النحوي علي بن حمزة بن عبد الله بن بهمن بن فيروز أصله أعجمي من أهل الكوفة {cite:fihrist-ibn-al-nadim p. 71-76}."
  en: "The canonical seven — Abu Amr, Nafi', Ibn Kathir, Asim, Ibn Amir, Hamza, al-Kisa'i — with their chains and books {cite:fihrist-ibn-al-nadim p. 71-76}."
