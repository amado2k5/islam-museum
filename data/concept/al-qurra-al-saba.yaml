label: {ar: "القراء السبعة", en: "The Seven Readers", fr: "Les sept lecteurs", es: "Los siete lectores", ur: "سات قارئین", tr: "Yedi Okuyucu", id: "Tujuh Pembaca"}
summary:
  ar: "قراء القرآن السبعة الذين استقصى ابن النديم أخبارهم وأسماء رواياتهم وقراءاتهم: أبو عمرو بن العلاء البصري، ونافع بن عبد الرحمن بن أبي نعيم المدني وروى الأصمعي عنه أن أصله من أصبهان، وعبد الله بن كثير المكي مولى عمرو بن علقمة الكناني يقال له الداراني لأنه كان عطاراً والعطار يقال له بالحجاز الداراني وقيل إنه من أبناء فارس الذين بعثهم كسرى في الشون إلى اليمن حتى طردوا الحبشة مات سنة عشرين ومائة بمكة وإليه صارت الرئاسة، وعاصم بن بهدلة الكوفي مولى بني جذيمة توفي سنة ثمان وعشرين ومائة وقرأ على أبي عبد الرحمن السلمي وزر بن حبيش وروى عنه أبو بكر بن عياش وحفص بن سليمان وكانت قراءته مرتفعة إلى علي بن أبي طالب رواية أبي عبد الرحمن السلمي، وعبد الله بن عامر اليحصبي الدمشقي أخذ القرآن عن عثمان بن عفان وقرأ عليه توفي سنة ثمان عشرة ومائة، وحمزة بن حبيب الزيات الكوفي مولى آل عكرمة بن ربيع التيمي كان يجلب الزيت من الكوفة إلى حلوان ويحمل من حلوان الجبن والجوز إلى الكوفة وكان فقيهاً توفي سنة ست وخمسين ومائة وله كتاب قراءة حمزة وكتاب الفرائض، والكسائي النحوي علي بن حمزة بن عبد الله بن بهمن بن فيروز أصله أعجمي من أهل الكوفة {cite:fihrist-ibn-al-nadim p. 71-76}."
  en: "The canonical seven — Abu Amr, Nafi', Ibn Kathir, Asim, Ibn Amir, Hamza, al-Kisa'i — with their chains and books {cite:fihrist-ibn-al-nadim p. 71-76}."
  fr: "Les sept lecteurs canoniques — Abu ‘Amr, Nafi‘, Ibn Kathir, ‘Asim, Ibn ‘Amir, Hamza et al-Kisa’i — avec leurs chaînes de transmission et leurs livres {cite:fihrist-ibn-al-nadim p. 71-76}."
  es: "Los siete canónicos — Abu Amr, Nafi', Ibn Kathir, Asim, Ibn Amir, Hamza, al-Kisa'i — con sus cadenas y libros {cite:fihrist-ibn-al-nadim p. 71-76}."
  ur: "روایات سات - ابو عمرو، نافع، ابن کثیر، عاصم، ابن عامر، حمزہ، الکسائی - اپنی زنجیر اور کتابوں کے ساتھ۔ 71-76}۔"
  tr: "İbn al-Nadim'in haber, rivayet ve okuma anlatımlarını incelediği yedi Kur'an'ı anlatan kişi: Ebu Amr bin Ala el-Basri, Nafi' ibn Abd al-Rahman ibn Abi Nu'aym al-Madani. El-Esma'i ondan kökeninin İsfahan'dan olduğunu anlattı ve Amr ibn Alqama el-Kinani'nin özgür kaderi Abdullah ibn Kathir al-Makki, parfümcedi olduğu için el-Derani olarak anılmıştır. El-Attar Hicaz'da el-Derani olarak adlandırılır ve Husrov'un Habeşistan'ı sürgün edene kadar Yemen'e gönderdiği İran oğulları arasında olduğu söylenir. Yüz yirmi yılında Mekke'de öldü ve liderlik ona geçti. Banu Judhima'nın özgür katili Asim ibn Bahdala al-Kufi, 128 Hicri yılında öldü. Ebu Abdurrahman el-Sulami ve Zurr ibn Hubaysh'in yanında eğitim aldı. Ebu Bekir bin Eyyash, Hafs ibn Süleyman, ondan rivayet etmiş ve onun ayeti Ali ibn Ebi Talib'e yükseltilmiştir, Ebu Abd al-Rahman el-Sulami'ye göre. Abdullah ibn Amir al-Yahsubi el-Dimashqi, Kur'an'ı Osman bin Affan'dan öğrenmiş ve onunla birlikte çalışmış, 180 Hicri yılında ölmüştür. İkrime bin Rabi'al-Teymi ailesinden özgür Hamza ibn Habib al-Zayyat al-Kufi, İkrime ibn Rabi'al-Teymi ailesinden kurtarılmış Hamza ibn Habib al-Zayyat al-Kufi, Esman Tanrı'yı getirirdi Kufa'dan Helvan'a yağ, Halvan'dan peynir ve ceviz Kufa'ya taşınır. 156 Hicri yılında vefat eden bir hukukçuydu. Hamza okuması üzerine bir kitabı ve miras üzerine bir kitabı vardı. Dilbilgici el-Kisai Ali ibn Hamza ibn Abdullah ibn Bahman ibn Fairuz, Kufa halkından yabancı kökenliydi {atıf:fihrist-ibn-al-nadim s. 71-76}."
  id: "Orang-orang yang menceritakan tujuh Al-Qur'an di mana Ibn al-Nadim memeriksa laporan, riwayat, dan bacaan adalah: Abu Amr ibn Ala al-Basri, Nafi' ibn Abd al-Rahman ibn Abi Nu'aym al-Madani. Al-Asma menjelaskan darinya bahwa asal-usulnya berasal dari Isfahan, dan nasib bebas Amr ibn Alqama al-Kinani adalah Abdullah ibn Kathir al-Makki, yang dikenal sebagai al-Derani karena ia adalah pembuat parfum. Al-Attar disebut al-Darani dalam Hijaz dan dikatakan sebagai salah satu putra Iran yang dikirim ke Yaman hingga Khusrow mengasingkan Abyssinia. Ia meninggal di Mekah pada tahun 122 M dan mengambil peran utama. Asim ibn Bahdala al-Kufi, pembunuh bebas Banu Judhima, meninggal pada tahun 128 H. Ia belajar di bawah bimbingan Abu Abdurrahman al-Sulami dan Zurr ibn Hubaysh. Abu Bakr ibn Ayyash menceritakan dari Hafs ibn Sulayman, dan puisinya dinaikkan menjadi Ali ibn Abi Talib, menurut Abu Abd al-Rahman al-Sulami. Abdullah ibn Amir al-Yahsubi al-Dimashqi mempelajari Al-Qur'an dari Uthman ibn Affan dan bekerja dengannya; ia meninggal pada tahun 180 H. Hamza ibn Habib al-Zayyat al-Kufi, bebas dari keluarga Ikrima ibn Rabi'al-Taymi, Hamza ibn Habib al-Zayyat al-Kufi, yang diselamatkan dari keluarga Ikrima ibn Rabi'al-Taymi, membawa Dewa Ashman. Minyak dari Kufa ke Helvan, keju dan kenari dari Halvan diangkut ke Kufa. Ia adalah seorang ahli hukum yang meninggal pada tahun 156 H. Ia memiliki sebuah buku tentang pembacaan Hamza dan sebuah buku tentang warisan. Ahli tata bahasa al-Kisai Ali ibn Hamza ibn Abdullah ibn Bahman ibn Fairuz berasal dari luar negeri dari masyarakat Kufa {kutipan: fihrist-ibn-al-nadim hlm. 71-76}."
