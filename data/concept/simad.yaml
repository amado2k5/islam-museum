id: concept/simad
class: concept
kind: legal
label: { ar: "السَّماد", en: "Fertilizer (simad) and its rulings" }
summary:
  ar: "السماد ما تُسمَّد به الأرض، وهو ما يُطرح في أصول الزرع والخضر من تراب أو سرجين ونحوه ليجود النبات، ولا يخرج الاصطلاح عن اللغة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9809} اختلف الفقهاء في طهارة السماد ونجاسته بحسب مصدره: رجيع ما لا يؤكل لحمه من غير الطيور نجس باتفاق، وذرق الطيور المفترسة نجس عند الجمهور وطاهر عند أبي حنيفة وأبي يوسف، وذهب المالكية والحنابلة وزفر إلى طهارة رجيع المأكول مطلقا، وذهب الشافعية في المذهب إلى نجاسة رجيع جميع الحيوانات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9809} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9810} وتناول الكتاب كذلك حكم التسميد بالنجاسات، وحكم بيع السماد، وحكم شرطه في المزارعة والمساقاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9810} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9811}"
  en: "Simad is what the land is manured with: material such as earth or animal dung cast at the roots of crops and vegetables so that the plant thrives; the technical sense does not depart from the lexical one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9809} The jurists differ on whether fertilizer is pure or impure according to its source. Droppings of animals whose flesh is not eaten, other than birds, are impure by consensus; the droppings of birds of prey are impure for the majority and pure for Abu Hanifa and Abu Yusuf. The Malikis, the Hanbalis and Zufar hold the droppings of eaten animals pure, while the Shafi'i preferred view holds the droppings of all animals impure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9809} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9810} Beyond purity, the entry also covers the use of impure manure on crops, the sale of fertilizer, and conditions on it in share-cropping and irrigation contracts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9810} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9811}"
