label: { ar: "السَّماد", en: "Fertilizer (simad) and its rulings", es: "Fertilizantes (simad) y sus regulaciones", fr: "L'engrais (simad) et ses règles", ur: "کھاد ⁦(سماد)⁩ اور اس کے احکام", tr: "Gübre", id: "Pupuk" }
summary:
  ar: "السماد ما تُسمَّد به الأرض، وهو ما يُطرح في أصول الزرع والخضر من تراب أو سرجين ونحوه ليجود النبات، ولا يخرج الاصطلاح عن اللغة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9809} اختلف الفقهاء في طهارة السماد ونجاسته بحسب مصدره: رجيع ما لا يؤكل لحمه من غير الطيور نجس باتفاق، وذرق الطيور المفترسة نجس عند الجمهور وطاهر عند أبي حنيفة وأبي يوسف، وذهب المالكية والحنابلة وزفر إلى طهارة رجيع المأكول مطلقا، وذهب الشافعية في المذهب إلى نجاسة رجيع جميع الحيوانات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9809} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9810} وتناول الكتاب كذلك حكم التسميد بالنجاسات، وحكم بيع السماد، وحكم شرطه في المزارعة والمساقاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9810} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9811}"
  en: "Simad is what the land is manured with: material such as earth or animal dung cast at the roots of crops and vegetables so that the plant thrives; the technical sense does not depart from the lexical one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9809} The jurists differ on whether fertilizer is pure or impure according to its source. Droppings of animals whose flesh is not eaten, other than birds, are impure by consensus; the droppings of birds of prey are impure for the majority and pure for Abu Hanifa and Abu Yusuf. The Malikis, the Hanbalis and Zufar hold the droppings of eaten animals pure, while the Shafi'i preferred view holds the droppings of all animals impure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9809} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9810} Beyond purity, the entry also covers the use of impure manure on crops, the sale of fertilizer, and conditions on it in share-cropping and irrigation contracts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9810} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9811}"
  es: "Simad es lo que se usa para fertilizar la tierra: material como tierra o estiércol animal arrojado a las raíces de los cultivos y hortalizas para que la planta prospere; el sentido técnico no se aparta del léxico. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9809} Los juristas difieren en si el fertilizante es puro o impuro según su origen. Los excrementos de animales cuya carne no se come, excepto las aves, son impuros por consenso; los excrementos de aves de rapiña son impuros para la mayoría y puros para Abu Hanifa y Abu Yusuf. Los malikíes, los hanbalíes y los zufar consideran puros los excrementos de animales comidos, mientras que la opinión preferida de los shafi'íes considera impuros los excrementos de todos los animales. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9809} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9810} Más allá de la pureza, la entrada también cubre el uso de estiércol impuro en los cultivos, la venta de fertilizantes y las condiciones sobre el mismo en los contratos de aparcería y riego. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9810} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9811}"
  fr: "Le terme « simad » désigne l'engrais utilisé pour fertiliser la terre: des matières telles que la terre ou le fumier animal déposées au pied des cultures et des légumes afin de favoriser leur croissance; le sens technique est identique au sens lexical. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9809} Les juristes divergent quant à la pureté ou l'impureté des engrais selon leur origine. Les déjections d'animaux non consommés, à l'exception des oiseaux, sont considérées comme impures par consensus; celles des rapaces sont impures pour la majorité et pures pour Abou Hanifa et Abou Yusuf. Les Malikites, les Hanbalites et les Zufars considèrent les déjections des animaux consommés comme pures, tandis que l'école shafi'ite, privilégiée, considère les déjections de tous les animaux comme impures. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9809} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9810} Au-delà de la pureté, l'entrée couvre également l'utilisation de fumier impur sur les cultures, la vente d'engrais et les conditions y afférentes dans les contrats de métayage et d'irrigation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9810} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9811}"
  ur: "سیماد وہ ہے جس سے زمین کو کھاد بنایا جاتا ہے: مٹی یا جانوروں کے گوبر جیسے مواد کو فصلوں اور سبزیوں کی جڑوں میں ڈالا جاتا ہے تاکہ پودا پھلے پھولے۔ تکنیکی احساس لغوی سے الگ نہیں ہوتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 9809} اس میں فقہاء کا اختلاف ہے کہ کھاد اپنے ماخذ کے مطابق پاک ہے یا نجس۔ پرندوں کے علاوہ جن جانوروں کا گوشت نہیں کھایا جاتا ان کا قطرہ اجماع سے نجس ہے۔ شکاری پرندوں کا قطرہ جمہور کے نزدیک نجس اور ابو حنیفہ اور ابو یوسف کے نزدیک پاک ہے۔ مالکیہ، حنبلی اور زفر کھائے جانے والے جانوروں کے قطرے کو پاک سمجھتے ہیں، جب کہ شافعی ترجیح تمام جانوروں کے قطرے کو نجس سمجھتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.9809} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.9810} پاکیزگی کے علاوہ، اندراج فصلوں پر ناپاک کھاد کے استعمال، کھاد کی فروخت، اور فصلوں میں کنٹریکٹ کی شرائط پر مشتمل ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9810}"
  tr: "Gübre, toprağı gübreleyen şeydir ve toprak, eyer gibi ürünler ve sebzelerin prensiplerinde bitkiyi iyileştirmek için kullanılır. Bu terim dilden sapmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9809} Hukukçular, gübrenin saflığı ve kirliliği konusunda kaynağına göre farklı görüşlerde bulunmuştur: yenmeyen kuş etinin rej'i'si oybirliğiyle saftır; yırtıcı kuşların dışkısı çoğunluğa göre kirli, Abu Hanifa ve Abu Yusuf'a göre saftır. Maliki ve Hanbaliler taze yiyeceğin tamamen saf olduğunu savunurken, Şafi'ler taze yiyeceğin tüm hayvanlar için kirli olduğunu savunur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9809} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9810} Kitap ayrıca gübreleme kirleticilikleri, gübre satışı ve tarım ile su teminindeki durumu ile ilgili kararı ele almaktadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9810} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9811}"
  id: "Pupuk adalah yang memupuk tanah, dan itulah yang digunakan dalam prinsip tanaman dan sayuran seperti tanah, pelana, atau sejenisnya untuk memperbaiki tanaman. Istilah ini tidak menyimpang dari bahasa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9809} Para ahli hukum berbeda pendapat mengenai kemurnian dan ketidakmurnian pupuk menurut sumbernya: rej'i' dari apa yang tidak dimakan daging dari burung secara bulat dianggap tidak murni; kotoran burung predator menurut mayoritas dan murni menurut Abu Hanifa dan Abu Yusuf. Malikis dan Hanbal berpendapat bahwa makanan segar adalah benar-benar murni, sedangkan Syafi'i berpendapat bahwa makanan segar tidak murni bagi semua hewan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9809} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9810} Buku ini juga membahas putusan tentang kotoran pemupukan, aturan penjualan pupuk, dan ketentuan tentang kondisinya dalam pertanian dan pasokan air. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9810} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9811}"
