  en: "Azfar al-tib (fragrant shells used as incense)"
  ur: "اظفار الطیب"
summary:
  ar: "أظفار الطيب في الكتاب قطاع تشبه الأظفار، طيّبة الرائحة عطرية تستعمل في الدخن، وهي بحسب ديسقوريدوس من جنس أطراف الصدف تؤخذ من جزيرة في بحر الهند؛ حارّة يابسة في الثانية ويبسها يكاد يقارب الثالثة، وهي ملطّفة؛ ينفع دخانها من الصرع، وإذا شُربت بالخل حرّكت البطن؛ ويذكر الكتاب فيها قولاً عن الرحم في فقرة موسومة معلّقة لحكم المؤسس {cite:canon-ibn-sina-print-v1 pp.352-353}"
  en: "In the book azfar al-tib is nail-like pieces with a sweet, aromatic smell used in fumigation, which according to Dioscorides are of the kind of the tips of shells taken from an island in the Indian sea; hot and dry in the second degree, its dryness almost reaching the third, and it refines; its smoke helps epilepsy, and drunk with vinegar it moves the bowel; the book also gives a statement on the womb in a labelled section held for the founder's ruling {cite:canon-ibn-sina-print-v1 pp.352-353}"
  ur: "اظفار الطیب کتاب میں ناخنوں سے مشابہ ٹکڑے ہیں، خوشبو دار اور عطری جو دھونی میں استعمال ہوتے ہیں، اور دیسقوریدوس کے بقول یہ سیپیوں کے سروں کی جنس سے ہیں جو بحر ہند کے ایک جزیرے سے لیے جاتے ہیں؛ دوسرے درجے میں گرم خشک اور اس کی خشکی تیسرے کے قریب پہنچتی ہے، اور یہ لطیف کرتے ہیں؛ ان کا دھواں مرگی میں مفید ہے، اور سرکے کے ساتھ پئے جائیں تو پیٹ چلاتے ہیں؛ کتاب رحم کے بارے میں ایک بات موسوم حصے میں دیتی ہے جو بانی کے فیصلے کے لیے موقوف ہے {cite:canon-ibn-sina-print-v1 pp.352-353}۔"
