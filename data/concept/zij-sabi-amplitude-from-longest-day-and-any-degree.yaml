label: { ar: "مشارق الصيف والشتاء من زيادة النهار الأطول ولأي درجة في الزيج الصابي", en: "Summer and winter risings from the longest day, and for any degree", ur: "سب سے لمبے دن سے گرمی اور سردی کے مشارق، اور کسی بھی درجے کے لیے", es: "El verano y el invierno se originan a partir del día más largo, y para cualquier grado" }
summary:
  ar: "في الباب السابع يعلّم البتاني كيف يُعرف مقدار البعد بين مطلع أول السرطان ومغربه وبين فلك معدل النهار على دائرة الأفق، من زيادة النهار الأطول المفروض. يؤخذ نصف قوس النهار الأطول، ويُحسب من الأوتار قوس يُنقص من تسعين فما بقي فهو ذلك البعد. ويعمم الطريقة على أي درجة بميلها ونصف قوس نهارها. {cite:zij-sabi-nallino-byblion p.33}."
  en: "In chapter 7 al-Battani teaches how to find the distance on the horizon circle between the rising and setting of the first of Cancer and the equator of the day, from an assumed longest day. The half-arc of the longest day is taken, an arc is worked out from the chords and taken from ninety, and what is left is that distance. He then widens the method to any degree by its declination and its half day-arc. {cite:zij-sabi-nallino-byblion p.33}."
  ur: "ساتویں باب میں البتانی سکھاتے ہیں کہ فرض کیے ہوئے سب سے لمبے دن سے دائرۂ افق پر رأس السرطان کے مطلع و مغرب اور معدل النہار کے درمیان کا فاصلہ کیسے معلوم ہو۔ سب سے لمبے دن کی نصف قوس لی جاتی ہے، اوتار سے ایک قوس نکالی جاتی ہے جو نوے میں سے گھٹائی جاتی ہے اور جو بچے وہی فاصلہ ہے۔ پھر وہ طریقے کو ہر درجے تک اس کے میل اور اس کے نصف قوس نہار کے ساتھ وسیع کرتے ہیں۔ {cite:zij-sabi-nallino-byblion p.33}۔"
  es: "En el capítulo 7, al-Battani enseña cómo calcular la distancia en el círculo del horizonte entre la salida y la puesta del primer día de Cáncer y el ecuador del día, partiendo de un día más largo. Se toma el medio arco del día más largo, se traza un arco a partir de las cuerdas y se toma de noventa, y lo que queda es esa distancia. Luego, amplía el método según su declinación y su medio arco diurno. {cite:zij-sabi-nallino-byblion p.33}."
