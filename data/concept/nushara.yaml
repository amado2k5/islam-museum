summary:
  ar: "النشارة في الكتاب طبعها بحسب شجرها، ونشارة المتآكل منقية، ونشارة الخشب المتآكل تدمل القروح وخاصة من الأشجار القابضة {cite:canon-ibn-sina-print-v1 p.579}."
  en: "Nushara, sawdust, has in the book the temperament of its tree; the sawdust of worn wood cleanses and, especially from astringent trees, heals ulcers {cite:canon-ibn-sina-print-v1 p.579}."
  ur: "نشارہ ⁦(برادہ)⁩ کتاب میں اپنے درخت کے مزاج کے مطابق ہے؛ کھائی ہوئی لکڑی کا برادہ صاف کرتا ہے اور خاص طور پر قابض درختوں کا قروح کو بھرتا ہے {cite:canon-ibn-sina-print-v1 p.579}۔"
  es: "Nushara, aserrín, tiene en el libro el temperamento de su árbol; el aserrín de madera desgastada limpia y, especialmente el de árboles astringentes, cura las úlceras {cite:canon-ibn-sina-print-v1 p.579}."
  fr: "Nushara, sciure de bois, a dans le livre le tempérament de son arbre; la sciure de bois usé purifie et, surtout celle des arbres astringents, guérit les ulcères {cite:canon-ibn-sina-print-v1 p.579}."
