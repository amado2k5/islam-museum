id: concept/zij-sabi-indian-ocean-and-its-gulfs
class: concept
kind: scientific
label: { ar: "بحر الهند والصين وخلجانه في الزيج الصابي", en: "The Indian and China seas and their gulfs", ur: "بحر ہند و چین اور اس کے خلیج", es: "Los mares Índico y de China y sus golfos", fr: "Les mers Indienne et de Chine et leurs golfes", tr: "Sabi Zij bölgesindeki Hint ve Çin denizleri ve körfezleri", id: "Laut India dan Laut Cina serta teluk-teluknya di Sabi Zij" }
summary:
  ar: "يصف البتاني بحر الهند والصين ممتداً من المغرب إلى المشرق من أقصى الحبشة إلى أقصى الهند ثمانية آلاف ميل، ويذكر له أربعة خلجان: خليج يمتد من أرض الحبش نحو البربر ويسمى الخليج البربري، وخليج أيلة وهو بحر القلزم، وخليج فارس وهو بحر البصرة، وخليج آخر نحو أقصى الهند. ثم يعدّ في البحر نحو ألف وثلثمائة وسبعين جزيرة منها سرنديب. {cite:zij-sabi-nallino-byblion p.30}."
  en: "Al-Battani describes the Indian and China sea as stretching west to east from the farthest Abyssinia to the farthest India, eight thousand miles, and names four gulfs: one running from Abyssinian land toward the Berbers called the Berber gulf; the gulf of Ayla, which is the Qulzum sea; the gulf of Fars, which is the sea of Basra; and a further gulf toward the far end of India. He then counts some thirteen hundred and seventy islands in the sea, among them Sarandib. {cite:zij-sabi-nallino-byblion p.30}."
  ur: "البتانی بحر ہند و چین کو مغرب سے مشرق تک حبشہ کے انتہائی سرے سے ہند کے انتہائی سرے تک آٹھ ہزار میل لمبا بتاتے ہیں اور اس کے چار خلیج گنواتے ہیں: ایک خلیج جو حبش کی زمین سے بربر کی طرف جاتا ہے اور خلیج بربری کہلاتا ہے، خلیج ایلہ جو بحر قلزم ہے، خلیج فارس جو بحر بصرہ ہے، اور ایک اور خلیج ہند کے انتہائی سرے کی طرف۔ پھر وہ سمندر میں تقریباً تیرہ سو ستر جزیرے شمار کرتے ہیں جن میں سرندیب ہے۔ {cite:zij-sabi-nallino-byblion p.30}۔"
  es: "Al-Battani describe el mar de la India y el mar de China extendiéndose de oeste a este desde la más remota Abisinia hasta la más remota India, a lo largo de ocho mil millas, y nombra cuatro golfos: uno que se extiende desde la tierra de Abisinia hacia los bereberes, llamado golfo bereber; el golfo de Ayla, que es el mar de Qulzum; el golfo de Fars, que es el mar de Basora; y otro golfo hacia el extremo de la India. Luego enumera unas mil trescientas setenta islas en el mar, entre ellas Sarandib. {cite:zij-sabi-nallino-byblion p.30}."
  fr: "Al-Battani décrit la mer Indienne et la mer de Chine comme s'étendant d'ouest en est, de l'Abyssinie la plus reculée à l'Inde la plus lointaine, sur huit mille milles. Il mentionne quatre golfes: le golfe de Berbères, qui part des terres abyssiniennes et se dirige vers les Berbères; le golfe d'Ayla, qui est la mer de Qulzum; le golfe de Fars, qui est la mer de Bassora; et un autre golfe vers l'extrémité de l'Inde. Il recense ensuite quelque 1 370 îles dans cette mer, parmi lesquelles Sarandib. {cite:zij-sabi-nallino-byblion p.30}."
  tr: "El-Battani, Hint ve Çin denizlerini Mağrip'ten Meşrik'e, Habeşistan'ın en uç noktalarından Hindistan'ın en uç noktalarına kadar uzanan, sekiz bin mil uzunluğunda bir alan olarak tanımlar. Dört körfezden bahseder: Habeşistan'dan Berberi topraklarına doğru uzanan Berberi Körfezi; Kızıldeniz olan Ayla Körfezi; Basra Denizi olan Basra Körfezi; ve Hindistan'ın en uç noktalarına doğru uzanan bir başka körfez. Daha sonra denizde yaklaşık 1370 ada listeler, bunlar arasında Serendib (Serendib) de bulunur. {cite:zij-sabi-nallino-byblion s.30}."
  id: "Al-Battani menggambarkan Laut India dan Laut Cina membentang dari Maghreb hingga Mashriq, dari ujung terjauh Abyssinia hingga ujung terjauh India, dengan jarak delapan ribu mil. Ia menyebutkan empat teluk: sebuah teluk yang membentang dari Abyssinia menuju tanah Berber, yang disebut Teluk Berber; Teluk Ayla, yang merupakan Laut Merah; Teluk Persia, yang merupakan Laut Basra; dan teluk lain menuju ujung terjauh India. Kemudian ia mencantumkan sekitar 1.370 pulau di laut tersebut, termasuk Serendib. {cite:zij-sabi-nallino-byblion p.30}."
