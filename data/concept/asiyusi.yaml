id: concept/asiyusi
class: concept
kind: natural
label:
  ar: "أسيوسي"
  en: "Asiyusi (the stone of asius salt)"
  fr: "Asiyusi (pierre du sel d’asius)"
  ur: "اسیوسی ⁦(اسیوس نمک والا پتھر)⁩"
summary:
  ar: "حجر يتولّد عليه الملح المسمّى زهرة أسيوس، قوّته مفتّحة ملحمة معفّنة يسيراً، تنفع القروح العسرة والعميقة، وتحلّل الجراحات، وتنفع النقرس والطحال والرئة {cite:canon-ibn-sina-print-v1 p.377}."
  en: "A stone on which forms the salt called asius flower. Its power opens, promotes flesh and slightly putrefies, dissolving rotten flesh without burning. It helps difficult and deep ulcers, resolves wounds, and helps gout, spleen and lung complaints {cite:canon-ibn-sina-print-v1 p.377}."
  fr: "Pierre sur laquelle se forme le sel appelé fleur d’asius. Sa puissance ouvre, favorise la chair et putréfie légèrement, dissolvant la chair pourrie sans brûler. Elle aide contre les ulcères difficiles et profonds, résout les plaies et aide contre la goutte et les affections de la rate et du poumon {cite:canon-ibn-sina-print-v1 p.377}."
  ur: "ایک پتھر جس پر وہ نمک جمتا ہے جسے اسیوس کا پھول کہتے ہیں۔ اس کی قوت کھولنے والی، گوشت پیدا کرنے والی اور ہلکی سی سڑانے والی ہے، جو بغیر جلن کے سڑا ہوا گوشت گھلا دیتی ہے۔ یہ مشکل اور گہرے زخموں میں نفع دیتا ہے، سوجن کو تحلیل کرتا ہے، اور نقرس، تلی اور پھیپھڑوں کی تکلیف میں مفید ہے {cite:canon-ibn-sina-print-v1 p.377}۔"
