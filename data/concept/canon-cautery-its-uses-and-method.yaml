id: concept/canon-cautery-its-uses-and-method
class: concept
kind: scientific
label:
  ar: "الكي: منافعه وطريقته عند ابن سينا"
  en: "Cautery, its uses and method in the Canon"
  fr: "Cautérisation : usages et méthode dans le Canon"
  ur: "قانون میں داغنا: فوائد اور طریقہ"
  es: "La cauterización, sus usos y método en el Canon"
summary:
  ar: "يخصص ابن سينا الفصل التاسع والعشرين للكي، فيعدد فوائده، ثم يصف الكي في المواضع الغائرة بقالب، وما يتوقاه الكاوي، وما يفعل في كي النزف وإسقاط اللحم الفاسد وفي القحف {cite:canon-ibn-sina-print-v1 p.309}."
  en: "Ibn Sina gives chapter 29 to cautery: he lists its benefits, then describes cautery in deep places with a mould, what the cauterizer guards against, and what is done in cauterising a flow of blood, in removing corrupt flesh and in the skull {cite:canon-ibn-sina-print-v1 p.309}."
  fr: "Ibn Sina consacre le chapitre 29 à la cautérisation : bienfaits, traitement des lieux profonds avec un moule, précautions, traitement du saignement, retrait de chair corrompue et cas du crâne {cite:canon-ibn-sina-print-v1 p.309}."
  es: "Ibn Sina dedica el capítulo 29 a la cauterización: enumera sus beneficios, luego describe la cauterización en lugares profundos con un molde, de qué se protege el cauterizador y qué se hace al cauterizar un flujo de sangre, al eliminar carne corrupta y en el cráneo {cite:canon-ibn-sina-print-v1 p.309}."
  ur: "ابن سینا نے باب 29 داغنے کا دیا ہے: وہ اس کے فوائد کی فہرست دیتا ہے، پھر ایک سانچے کے ساتھ گہری جگہوں پر داغ کو بیان کرتا ہے، داغدار کس چیز سے حفاظت کرتا ہے، اور خون کے بہاؤ کو داغدار کرنے میں، خراب گوشت اور کھوپڑی میں کیا کیا جاتا ہے۔"
