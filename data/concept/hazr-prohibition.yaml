id: concept/hazr-prohibition
class: concept
kind: legal
label: { ar: "الحظر", en: "Prohibition (hazr)", ur: "حظر ⁦(منع)⁩", es: "Prohibición (hazr)", fr: "Interdiction (danger)" }
summary:
  ar: "الحظر في اللغة المنع، والمحظور الممنوع، وهو في الاصطلاح الممنوع شرعا، وهو أعم من الحرام والمكروه عند بعضهم، وقصره بعضهم على المحرم، ويذم فاعله شرعا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7132} وفرّق الأصوليون بين الحظر والتحريم والكراهة، فالتحريم خطاب يمنع من الفعل ويعاقب على فعله، والكراهة نهي يثاب على تركه ولا يعاقب على فعله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7132} وفي كتب الحنفية يجمع باب الحظر والإباحة مسائل متفرقة: النظر والمس، واللباس، واستعمال الذهب والفضة، والأكل، والهدايا، والكسب، وزيارة القبور، والغناء، والتداوي، والختان، والزينة، والذبح، والتسمية، والغيبة، والسفر، والقرض، وتقبيل الأيدي، والانتفاع بالمشترك، والصلاة، والمسجد، والقرآن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7133} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7134} ويسمي الحنفية هذا الباب بكتاب الحظر والإباحة، أو الاستحسان، أو الكراهية، لاختلاف المسائل فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7134}"
  en: "Hazr (prohibition) in the lexicon means preventing; the forbidden (mahzur) is what the law forbids, and the term is wider than the unlawful and the disliked for some, but for others only the unlawful; the doer is blamed by the law. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7132} The usulis distinguish prohibition (hazr), unlawfulness (tahrim, which is blamed and punished) and disliking (karaha, rewarded for leaving it and not punished for doing it). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7132} In the Hanafi books, a section titled after permitted and forbidden (hazr wa-ibaha), or disliked matters, or preference, gathers scattered rules: looking and touching, dress, gold and silver vessels, food, gifts, earning, visiting graves, reciting in graveyards, music, medicine, circumcision, adornment, slaughter, naming children, backbiting and envy, travel, loans, greeting rulers, shared property, the Qur'an, and the mosque. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7133} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7134} The Hanafis give that section different names, for the mixed rules in it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7134}"
  es: "Hazr (prohibición) en el léxico significa impedir; lo prohibido (mahzur) es lo que la ley prohíbe, y el término es más amplio que lo ilícito y lo desagradable para algunos, pero para otros solo lo ilícito; el que lo hace es censurado por la ley. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7132} Los usulis distinguen prohibición (hazr), ilicitud (tahrim, que es censurada y castigada) y desagrado (karaha, recompensado por evitarlo y no castigado por hacerlo). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7132} En los libros Hanafi, una sección titulada después de permitido y prohibido (hazr wa-ibaha), o asuntos desaconsejados, o preferencia, reúne reglas dispersas: mirar y tocar, vestimenta, vasos de oro y plata, comida, regalos, ganar, visitar tumbas, recitar en cementerios, música, medicina, circuncisión, adorno, matanza, nombrar a los niños, murmuración y envidia, viajes, préstamos, saludar a los gobernantes, propiedad compartida, el Corán y la mezquita. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7133} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7134} Los Hanafi dan a esa sección diferentes nombres, debido a las reglas mixtas que contiene. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7134}"
  fr: "Dans le lexique, le terme « hazr » (interdiction) signifie empêcher; l’interdit (mahzur) désigne ce que la loi prohibe, et ce terme englobe pour certains ce qui est illicite et ce qui est déconseillé, tandis que pour d’autres, il ne désigne que l’illicite; celui qui commet l’acte est blâmé par la loi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7132} Les usulis distinguent l’interdiction (hazr), l’illicéité (tahrim, qui est blâmée et punie) et la répugnance (karaha, pour laquelle on est récompensé lorsqu’on s’en abstient et non puni lorsqu’on la commet). Dans les ouvrages hanafites, une section intitulée « Permis et interdits » (hazr wa-ibaha), « choses déconseillées » ou « préférences », rassemble des règles éparses: regarder et toucher, s’habiller, posséder des objets en or et en argent, manger, faire des dons, gagner de l’argent, visiter les tombes, réciter des Corans dans les cimetières, la musique, la médecine, la circoncision, les ornements, l’abattage d’animaux, nommer les enfants, médisance et envie, voyager, contracter des prêts, saluer les dirigeants, posséder des biens communs, le Coran et la mosquée. Les hanafites donnent à cette section des noms différents, en raison de la diversité des règles qu’elle contient. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.7134}"
  ur: "لغت میں حجر کا مطلب روکنا ہے۔ حرام وہ ہے جسے قانون منع کرتا ہے، اور اصطلاح حرام سے زیادہ وسیع ہے اور بعض کے لیے ناپسندیدہ ہے، لیکن بعض کے لیے صرف حرام ہے۔ کرنے والے کو قانون کے ذریعہ مورد الزام ٹھہرایا جاتا ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 7132} اصول ممانعت ⁦(حجر)⁩، حرام ⁦(تحریم، جس پر الزام اور سزا دی جاتی ہے)⁩ اور ناپسندیدگی ⁦(کراہ، اسے چھوڑنے پر اجر ہے اور اس کے کرنے پر سزا نہیں)⁩ کی تمیز کرتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 7132} حنفی کتب میں، جائز و حرام ⁦(حضر و بحض)⁩ یا ناپسندیدہ امور، یا ترجیح کے عنوان سے ایک حصہ بکھرے ہوئے اصولوں کو جمع کرتا ہے: دیکھنا اور چھونا، لباس، سونا چاندی، کھانے پینے کے برتنوں میں جانا، تحفہ کے برتنوں میں جانا، تحفہ دینا۔ قبرستان، موسیقی، دوا، ختنہ، زینت، ذبح، بچوں کے نام رکھنا، غیبت اور حسد، سفر، قرض، حاکموں کو سلام، مشترکہ جائیداد، قرآن اور مسجد۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7133} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص7134} احناف اس حصے کو مختلف نام دیتے ہیں، اس میں ملے جلے احکام کی وجہ سے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص7134}"
