id: concept/hazr-prohibition
class: concept
kind: legal
label: { ar: "الحظر", en: "Prohibition (hazr)", ur: "حظر (منع)" }
summary:
  ar: "الحظر في اللغة المنع، والمحظور الممنوع، وهو في الاصطلاح الممنوع شرعا، وهو أعم من الحرام والمكروه عند بعضهم، وقصره بعضهم على المحرم، ويذم فاعله شرعا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7132} وفرّق الأصوليون بين الحظر والتحريم والكراهة، فالتحريم خطاب يمنع من الفعل ويعاقب على فعله، والكراهة نهي يثاب على تركه ولا يعاقب على فعله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7132} وفي كتب الحنفية يجمع باب الحظر والإباحة مسائل متفرقة: النظر والمس، واللباس، واستعمال الذهب والفضة، والأكل، والهدايا، والكسب، وزيارة القبور، والغناء، والتداوي، والختان، والزينة، والذبح، والتسمية، والغيبة، والسفر، والقرض، وتقبيل الأيدي، والانتفاع بالمشترك، والصلاة، والمسجد، والقرآن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7133} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7134} ويسمي الحنفية هذا الباب بكتاب الحظر والإباحة، أو الاستحسان، أو الكراهية، لاختلاف المسائل فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7134}"
  en: "Hazr (prohibition) in the lexicon means preventing; the forbidden (mahzur) is what the law forbids, and the term is wider than the unlawful and the disliked for some, but for others only the unlawful; the doer is blamed by the law. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7132} The usulis distinguish prohibition (hazr), unlawfulness (tahrim, which is blamed and punished) and disliking (karaha, rewarded for leaving it and not punished for doing it). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7132} In the Hanafi books, a section titled after permitted and forbidden (hazr wa-ibaha), or disliked matters, or preference, gathers scattered rules: looking and touching, dress, gold and silver vessels, food, gifts, earning, visiting graves, reciting in graveyards, music, medicine, circumcision, adornment, slaughter, naming children, backbiting and envy, travel, loans, greeting rulers, shared property, the Qur'an, and the mosque. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7133} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7134} The Hanafis give that section different names, for the mixed rules in it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7134}"
