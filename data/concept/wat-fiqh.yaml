id: concept/wat-fiqh
class: concept
kind: legal
label:
  ar: "وَطْء"
  en: "Wat' (intercourse, fiqh)"
summary:
  ar: "الوطء لغةً العلوّ على الشيء، ويُطلق على الجماع، وهو إيلاج الذكر في الفرج حتى يصيرا كالشيء الواحد؛ والمعنى الاصطلاحي لا يخرج عن اللغوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17482}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17483}\n\nالألفاظ ذات الصلة: النكاح، وأصله الضم والجمع، ويُطلق حقيقةً على العقد ومجازاً على الوطء أو العكس على الخلاف بين أهل اللغة والفقه؛ واللواط إتيان الذكور، وهو داخل في الوطء الأعم منه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17483}\n\nأولاً: الوطء بمعنى الجماع. أقسامه: مشروع، وهو وطء الحليلة زوجةً كانت أو سرية، وقد يعرض له التحريم كالحيض والنفاس والظهار قبل التكفير والإحرام والصيام والاعتكاف؛ ومحظور، وهو ما لازمه التحريم، ونوعان: ما يمكن أن يكون حلالاً كوطء أجنبية في قُبلها وفيه حد الزنا، وما لا سبيل إلى حله البتة كاللواط ووطء الدبر وإتيان البهيمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17483}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17484}\n\nأسباب حل الوطء: عقد النكاح، وملك اليمين؛ فأما ملك اليمين فلا خلاف في جواز وطء الأمة المملوكة دون عقد نكاح، لأن ملك الرقبة يفيد ملك المنفعة. وقد أباح الكتاب ذلك بذكر أزواج المؤمنين وما ملكت أيمانهم، بالإشارة إلى سورة المؤمنون دون نص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17484}\n\nالحكم التكليفي: جمهور الفقهاء على أن وطء الحليلة في الأصل مباح، وليس فيه معنى الطاعة أو المعصية في ذاته، وقد يعرض له الاستحباب إذا قارنته نية صالحة كالاستعفاف بالحلال عن الحرام، وقد يجب إذا تعيّن وسيلةً لإعفاف النفس أو الأهل، وقد يحرم أو يكره بحسب الأحوال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17484}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17485}\n\nمقاصد الوطء الشرعية عند ابن القيم: حفظ النسل، وإخراج الماء الذي يضر احتباسه، وقضاء الوطر ونيل اللذة؛ ومن منافعه غض البصر وكف النفس وتحصيل العفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17485}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17486}\n\nثواب الوطء المشروع: ورد حديث أبي ذر في أن «في بُضْع أحدكم صدقة»، وجمهور أهل العلم على ثواب الرجل على جماعه لحليلته إذا قارنته نية صالحة كإعفاف نفسه أو زوجه، أو قضاء حقها بالمعروف، أو طلب ولد صالح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17486} أما إذا لم ينو غير قضاء شهوته فقد اختلف الفقهاء: قال ابن قتيبة يُؤجر مطلقاً، وقال ابن حجر الهيتمي وجماعة لا أجر له إذا لم ينوِ شيئاً من ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17486}\n\nورد أن النفقة على الأهل يُؤجر عليها المسلم إذا احتسبها، وإذا كان هذا في الإنفاق الواجب مشترطاً فهو في الوطء المباح أولى، وذلك على ما قرره الكتاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17487}\n\nآداب الوطء ومستحباته: يُستحب البداءة بالتسمية، ويُستحب الانحراف عن القبلة إكراماً لها، ويُستحب تقديم الملاعبة والضم والتقبيل لتنهض شهوة المرأة، ويُستحب مراعاة التوافق في قضاء الوطر، وأن يتغطيا بثوب، وأن يغضّ الصوت ويقلّ الكلام، ويُكره أن يطأ الرجل وهو يُرى أو يُسمع حسّه، ويحرم مع انكشاف العورة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17487}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17488} ويستحب لمن أراد أن يجامع ثانية أن يغسل فرجه ويتوضأ، والغسل أفضل؛ وذكر الكتاب ما روي عن النبي أنه كان يطوف على نسائه بغسل واحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17488}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17489}\n\nالتحدث عن الوطء وإفشاء سره: اختلف الفقهاء؛ فذهب الحنفية والحنابلة في قول، وهو ما رجّحه المرداوي، والنووي، إلى تحريم المفاخرة بالجماع وإفشاء ما يجري بين الزوجين، استناداً إلى حديث أبي سعيد في أشر الناس منزلة، وحديث «الشياع حرام». وعدّه ابن القيم والهيتمي من الكبائر، وذهب الحنابلة في المذهب إلى كراهة تحدث الزوجين بما جرى بينهما، ولو لضرتها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17489}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17490}\n\nموانع الوطء المشروع: تسعة، اتفق الفقهاء على ستة منها، وهي الحيض والنفاس والاعتكاف والصوم والإحرام والظهار قبل التكفير؛ واختلفوا في ثلاثة، وهي الاستحاضة، وعدم الاغتسال بعد الطهر من الحيض، والإقامة في دار الحرب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17490}\n\nأولاً: الحيض. اتفق أهل العلم على حرمة وطء الحائض في الفرج، لقوله تعالى في سورة البقرة (تُذكر الآية بالسورة دون نقل نصها)، وقوله في الاستمتاع بالحائض: «اصنعوا كل شيء إلا النكاح». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17491} ثانياً: النفاس، وقد اتفق الفقهاء على حرمة وطء النفساء في الفرج، وأن حكم دم النفاس في حظر الوطء وفي الغسل وفي الكفارة كحكم الحيض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17491}\n\nثالثاً: الاستحاضة. اختلف الفقهاء في جواز وطء المستحاضة؛ فجمهور الحنفية والشافعية والمالكية وأحمد في إحدى الروايتين يجيزونه، ونقل ابن المنذر ذلك عن ابن عباس وسعيد بن المسيب والحسن وعطاء وقتادة وغيرهم، واحتجوا بأن المستحاضة طاهرة من الحيض، وبأن حمنة بنت جحش كانت تُستحاض وكان زوجها يجامعها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17491}\n\nالاستحاضة: القول الثاني، وهو ما عليه بعض أهل العلم، أنه لا يجوز وطء المستحاضة لأن الدم دم حيض فيعلّل بالحيض وهو موجود فيها فيثبت التحريم في حقها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17492}\n\nرابعاً: الاعتكاف. اتفق الفقهاء على تحريم الوطء في الاعتكاف، وأنه مفسد له ليلاً كان أو نهاراً إذا كان عامداً، لقوله تعالى في آية البقرة (وتفصيله في باب الاعتكاف). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17492}\n\nخامساً: الصوم. اتفق الفقهاء على تحريم الوطء عمداً على الصائم في رمضان، وأنه مفسد للصوم وموجب للكفارة، أنزل أو لم ينزل، ويُستدل بحديث أبي هريرة في الرجل الذي وقع على امرأته في نهار رمضان وأُمر بالكفارة ثم أُعطي تمراً يتصدق به؛ وقد أُحيل الباب إلى بابه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17492}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493}\n\nسادساً: الإحرام. اتفق الفقهاء على حرمة الوطء على المُحرِم بحج أو عمرة، لقوله تعالى في آية البقرة، والرفث يُفسَّر بالجماع ومقدماته من القول الفاحش، وهو دليل بالأولى أو نص فيه؛ والوطء في الإحرام جناية تفسد النسك إذا كان قبل الوقوف بعرفة ولا تفسده بعد التحلل الأول، واختلفوا فيما بين الوقوف والتحلل الأول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493}\n\nسابعاً: الظهار. لا خلاف في حرمة وطء المظاهَر منها قبل التكفير، لقوله تعالى في سورة المجادلة، ولحديث ابن عباس في الرجل الذي وقع على امرأته قبل أن يكفر، فأمره النبي بالاستغفار ونهاه عن العود حتى يكفّر. وتُمكّن الزوجة الزوج من نفسها قبل التكفير محرّم عليها كذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493}\n\nثامناً: وطء المسلم حليلته في دار الحرب. ذهب الجمهور من الحنفية والمالكية والشافعية إلى كراهته مخافة أن يكون له نسل فيها، لأن المسلم ممنوع من التوطن في دار الحرب، وحديث جرير في البراءة ممن يقيم بين أظهر المشركين، وهو مرسل عند البخاري في رأيه؛ والحنابلة يرون أنه لا يطأ زوجته في دار الحرب إلا للضرورة، فإذا وُجدت وجب العزل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494}\n\n(ب) الوطء المحظور: صوره الزنى، واللواطة، ووطء الحليلة والأجنبية في دبرها، ووطء الميتة، ووطء البهيمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494}\n\nأولاً: الزنى حرام بإجماع الفقهاء وكبيرة من أعظم الكبائر، لقوله تعالى في سورة الإسراء بالنص على الآية دون نقلها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494}\n\nثانياً: اللواط: أجمع الفقهاء على أنه محرم مغلظ التحريم وأنه من الكبائر، وقال الماوردي إنه أغلظ الفواحش تحريماً، وأن اللواط لم يفعله أحد من العالمين قبل قوم لوط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494}\n\nعقوبة اللواط: اختلف الفقهاء فيها على ستة أقوال، وعرض الكتاب الأقوال على النحو التالي: القول الأول للشافعية في المذهب والحنابلة في المذهب وأبي يوسف ومحمد والثوري والأوزاعي وأبي ثور، وهو أن حد اللواط كحد الزنا، فيُرجم المحصن ويُجلد البكر، واستدلوا بحديث أبي موسى في أن الرجل إذا أتى الرجل فهما زانيان، وهو عند البيهقي منكر الإسناد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17495} والقول الثاني، لأبي حنيفة وحماد بن أبي سليمان والحكم، أنه لا حد فيه وإنما فيه التعزير والحبس حتى الموت أو التوبة، ومن اعتاده أو تكرر منه قتله الإمام في المرة الثانية، لأنه لم يطلق عليه اسم الزنا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17495} والقول الثالث للمالكية، أن حده الرجم مطلقاً للفاعل والمفعول به، محصنين أو غير محصنين، واستدلوا بعموم حديث «من وجدتموه يعمل عمل قوم لوط فاقتلوا الفاعل والمفعول به». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17495}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17496} والقول الرابع للشافعي في قول وإسحاق بن راهويه، أنه يُقتل بالسيف كالمرتد، محصناً كان أو غير محصن؛ ونسب الكتاب هذا الرأي إلى جماعة من الصحابة والتابعين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17496} ولم يُستكمل في هذه الصفحة عرض القولين الخامس والسادس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17496}"
  en: "Wat', lexically, is standing over a thing; it is also used for intercourse, the insertion of a male member into a female's sexual organ until the two are as one. The technical sense does not depart from the lexical. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17482}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17483}\n\nRelated words: nikah, whose root is joining and gathering, is used in the strict sense for the marriage contract and in a figurative sense for intercourse, or the reverse, as the lexicographers and jurists differ; liwat is intercourse with males, which falls under the wider wat'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17483}\n\nFirst, wat' as intercourse. It is either lawful or forbidden. The lawful is intercourse with a wife or a concubine, which may be forbidden at times, such as during menstruation or post-natal bleeding, before a zihar is expiated, in ihram, while fasting or in i'tikaf. The forbidden is either of a kind that could be lawful in another case, such as intercourse with a woman who may be married to one, which carries the penalty of zina, or of a kind that can never be lawful, such as sodomy, anal intercourse with a wife or a non-wife, and bestiality. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17483}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17484}\n\nThe causes that make intercourse lawful are the marriage contract and ownership of the right hand. Ownership of a female slave is lawful without a contract, because ownership of the person carries the use. The Qur'an alludes to this in the sura of al-Mu'minun (cited by sura only) without a verse being quoted here. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17484}\n\nThe ruling: the majority of jurists hold that intercourse with a wife or concubine is in principle permitted, being a pleasure that the natural disposition calls for, with no obedience or disobedience in itself. It becomes recommended with a good intention, such as keeping oneself chaste from the unlawful, may become obligatory when it is the only means of chastity for oneself or one's household, and may be forbidden or disliked according to circumstances. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17484}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17485}\n\nIbn al-Qayyim lists the purposes of intercourse: preserving the progeny, releasing the water that harms the body if it is retained, and the fulfilment of desire and pleasure; its benefits include lowering the gaze, restraining the self and securing chastity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17485}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17486}\n\nThe reward for lawful intercourse: the report of Abu Dharr that 'in the intimacy of one of you there is charity' is cited; the majority hold that a man is rewarded for intercourse with his wife when accompanied by a good intention, such as keeping himself or his wife from the unlawful, fulfilling her right in proper companionship, or seeking a righteous child. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17486} Where the man intends nothing but the fulfilment of his desire, the jurists differ: Ibn Qutayba holds he is rewarded in every case, while Ibn Hajar al-Haytami and others say there is no reward where no such intention exists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17486}\n\nIntercourse and its rewards: a Muslim is rewarded for what he spends on his household if he seeks the reward of God in it; if this is so for obligatory spending, it is more so for lawful intercourse, as the book states. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17487}\n\nThe courtesies and recommended acts of intercourse: it is recommended to begin with the basmala; to turn away from the qibla out of respect for it; to begin with play, embrace and kissing, so that the woman's desire rises; to take care to reach the satisfaction of both together; to cover oneself with a cloth; to lower the voice and speak little. It is disliked for a man to have intercourse where he can be seen or his sounds heard, and forbidden when the private parts are exposed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17487}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17488} It is recommended for one who wishes to repeat intercourse to wash his private part and perform wudu', and ghusl is better; the book cites the report that the Prophet went round his wives with a single ghusl. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17488}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17489}\n\nSpeaking about intercourse and disclosing its secrets: the jurists differ. The Hanafis, a Hanbali view which al-Mardawi prefers, and al-Nawawi hold that boasting of intercourse and disclosing what passes between spouses is forbidden, on the report of Abu Sa'id about the worst of people in rank before God and the saying that spreading (such talk) is forbidden. Ibn al-Qayyim, al-Haytami and others count it among the major sins. The school view of the Hanbalis is that the spouses' speaking of what passes between them is disliked, even to a co-wife. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17489}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17490}\n\nImpediments to lawful intercourse: there are nine. The jurists agree on six of them, namely menstruation, post-natal bleeding, i'tikaf, fasting, ihram and zihar before its expiation; they differ on three, namely istihada, failure to wash after the end of menstruation, and residence in the abode of war. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17490}\n\nFirst, menstruation: the jurists agree that intercourse with a menstruating woman in the vagina is forbidden, on the verse of sura al-Baqara (cited by sura only) and the saying that one may do everything except intercourse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17491} Second, post-natal bleeding: the jurists agree that intercourse in the vagina is forbidden, and that its rules, including washing and expiation, are those of menstruation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17491}\n\nThird, istihada: the jurists differ on whether intercourse with an irregularly bleeding woman is permitted. The majority of Hanafis, Shafi'is and Malikis, and one Hanbali report, permit it, a view reported by Ibn al-Mundhir from Ibn 'Abbas, Sa'id ibn al-Musayyab, al-Hasan, Ata and others, citing that she is pure of menstruation and the case of Hamna bint Jahsh, whose husband Talha had intercourse with her while she bled. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17491}\n\nIstihada, the second view, which some jurists hold: intercourse with an irregularly bleeding woman is forbidden, because the blood is blood of menstruation, and the cause of the prohibition, menstruation, is present in her, so the prohibition applies to her. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17492}\n\nFourth, i'tikaf. The jurists agree that intercourse during i'tikaf is forbidden and invalidates it, by night or by day, if intentional, on the verse of sura al-Baqara on i'tikaf in the mosque (the detail under i'tikaf). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17492}\n\nFifth, fasting. The jurists agree that intentional intercourse by a fasting person in Ramadan is forbidden, invalidates the fast and requires expiation, whether he ejaculates or not, on the report of Abu Hurayra of the man who had intercourse with his wife while fasting in Ramadan and was given dates to give in charity, which the book quotes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17492}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493}\n\nSixth, ihram. The jurists agree that intercourse by a pilgrim in hajj or umra is forbidden, on the verse of sura al-Baqara, in which 'rafath' is explained as intercourse and the talk that accompanies it. An intercourse before standing at 'Arafat invalidates the pilgrimage, while after the first release it does not; the views differ on the period between standing at 'Arafat and the first release. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493}\n\nSeventh, zihar. There is no dispute that intercourse with a woman on whom zihar has been pronounced is forbidden before expiation, on the verse of sura al-Mujadila and the report of Ibn 'Abbas of the man who had intercourse before expiating, whom the Prophet told to ask forgiveness and not to repeat it until he had expiated. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493}\n\nEighth, a Muslim's intercourse with his wife in the abode of war. The majority of Hanafis, Malikis and Shafi'is hold it disliked, fearing offspring there, since the Muslim is forbidden to settle in the abode of war, citing the saying of the Prophet that he is free of every Muslim who lives among the polytheists, which al-Bukhari judged to be a mursal report. The Hanbalis hold that a Muslim may not have intercourse with his wife in the abode of war except by necessity, and that when necessity arises he must practise withdrawal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494}\n\n(b) Forbidden intercourse: its kinds are adultery, sodomy, intercourse with a wife or a non-wife in the anus, with a dead woman, and with an animal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494}\n\nFirst, adultery is forbidden by the consensus of the jurists and is one of the greatest major sins, on the verse of sura al-Isra cited by sura and number. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494}\n\nSecond, sodomy: the jurists agree it is forbidden with the greatest severity and is a major sin; al-Mawardi calls it the most grievous of abominations and notes that no one in the worlds did it before the people of Lot. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494}\n\nThe penalty for sodomy: the jurists give six views, of which the book sets out the first four. The first, held by the Shafi'i and Hanbali school views, by Abu Yusuf, Muhammad, al-Thawri, al-Awza'i and Abu Thawr, is that the penalty for sodomy is that of adultery: a married offender is stoned and an unmarried one is flogged; they cite a report from Abu Musa that when a man comes to a man, both are adulterers, which al-Bayhaqi calls a rejected chain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17495} The second, held by Abu Hanifa, Hammad ibn Abi Sulayman and al-Hakam, is that there is no hadd but discretionary punishment and imprisonment until death or repentance, and that a repeat offender is killed by the ruler at a second offence, married or not, as policy; the reason given is that the act is not the name of adultery. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17495} The third, held by the Malikis, is that the penalty is stoning in every case, for the active and passive partner, married or not, citing the general wording of the hadith on killing both partners. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17495}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17496} The fourth, held by al-Shafi'i in one view and by Ishaq ibn Rahawayh, is that the offender is killed by the sword like an apostate, married or not, a view attributed by the book to a number of Companions and Successors. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17496} The fifth and sixth views are not yet read at this point of the scan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17496}"
