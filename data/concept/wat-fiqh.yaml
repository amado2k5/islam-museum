id: concept/wat-fiqh
class: concept
kind: legal
label:
  ar: "وَطْء"
  en: "Wat' (intercourse, fiqh)"
  es: "Wat' (relaciones sexuales, fiqh)"
  fr: "Wat' (rapport sexuel, fiqh)"
  ur: "وات ⁦(جماع، فقہ)⁩"
  tr: "ayak basma"
  id: "menginjak"
summary:
  ar: "الوطء لغةً العلوّ على الشيء، ويُطلق على الجماع، وهو إيلاج الذكر في الفرج حتى يصيرا كالشيء الواحد؛ والمعنى الاصطلاحي لا يخرج عن اللغوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17482}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17483}\n\nالألفاظ ذات الصلة: النكاح، وأصله الضم والجمع، ويُطلق حقيقةً على العقد ومجازاً على الوطء أو العكس على الخلاف بين أهل اللغة والفقه؛ واللواط إتيان الذكور، وهو داخل في الوطء الأعم منه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17483}\n\nأولاً: الوطء بمعنى الجماع. أقسامه: مشروع، وهو وطء الحليلة زوجةً كانت أو سرية، وقد يعرض له التحريم كالحيض والنفاس والظهار قبل التكفير والإحرام والصيام والاعتكاف؛ ومحظور، وهو ما لازمه التحريم، ونوعان: ما يمكن أن يكون حلالاً كوطء أجنبية في قُبلها وفيه حد الزنا، وما لا سبيل إلى حله البتة كاللواط ووطء الدبر وإتيان البهيمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17483}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17484}\n\nأسباب حل الوطء: عقد النكاح، وملك اليمين؛ فأما ملك اليمين فلا خلاف في جواز وطء الأمة المملوكة دون عقد نكاح، لأن ملك الرقبة يفيد ملك المنفعة. وقد أباح الكتاب ذلك بذكر أزواج المؤمنين وما ملكت أيمانهم، بالإشارة إلى سورة المؤمنون دون نص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17484}\n\nالحكم التكليفي: جمهور الفقهاء على أن وطء الحليلة في الأصل مباح، وليس فيه معنى الطاعة أو المعصية في ذاته، وقد يعرض له الاستحباب إذا قارنته نية صالحة كالاستعفاف بالحلال عن الحرام، وقد يجب إذا تعيّن وسيلةً لإعفاف النفس أو الأهل، وقد يحرم أو يكره بحسب الأحوال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17484}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17485}\n\nمقاصد الوطء الشرعية عند ابن القيم: حفظ النسل، وإخراج الماء الذي يضر احتباسه، وقضاء الوطر ونيل اللذة؛ ومن منافعه غض البصر وكف النفس وتحصيل العفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17485}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17486}\n\nثواب الوطء المشروع: ورد حديث أبي ذر في أن «في بُضْع أحدكم صدقة»، وجمهور أهل العلم على ثواب الرجل على جماعه لحليلته إذا قارنته نية صالحة كإعفاف نفسه أو زوجه، أو قضاء حقها بالمعروف، أو طلب ولد صالح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17486} أما إذا لم ينو غير قضاء شهوته فقد اختلف الفقهاء: قال ابن قتيبة يُؤجر مطلقاً، وقال ابن حجر الهيتمي وجماعة لا أجر له إذا لم ينوِ شيئاً من ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17486}\n\nورد أن النفقة على الأهل يُؤجر عليها المسلم إذا احتسبها، وإذا كان هذا في الإنفاق الواجب مشترطاً فهو في الوطء المباح أولى، وذلك على ما قرره الكتاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17487}\n\nآداب الوطء ومستحباته: يُستحب البداءة بالتسمية، ويُستحب الانحراف عن القبلة إكراماً لها، ويُستحب تقديم الملاعبة والضم والتقبيل لتنهض شهوة المرأة، ويُستحب مراعاة التوافق في قضاء الوطر، وأن يتغطيا بثوب، وأن يغضّ الصوت ويقلّ الكلام، ويُكره أن يطأ الرجل وهو يُرى أو يُسمع حسّه، ويحرم مع انكشاف العورة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17487}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17488} ويستحب لمن أراد أن يجامع ثانية أن يغسل فرجه ويتوضأ، والغسل أفضل؛ وذكر الكتاب ما روي عن النبي أنه كان يطوف على نسائه بغسل واحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17488}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17489}\n\nالتحدث عن الوطء وإفشاء سره: اختلف الفقهاء؛ فذهب الحنفية والحنابلة في قول، وهو ما رجّحه المرداوي، والنووي، إلى تحريم المفاخرة بالجماع وإفشاء ما يجري بين الزوجين، استناداً إلى حديث أبي سعيد في أشر الناس منزلة، وحديث «الشياع حرام». وعدّه ابن القيم والهيتمي من الكبائر، وذهب الحنابلة في المذهب إلى كراهة تحدث الزوجين بما جرى بينهما، ولو لضرتها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17489}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17490}\n\nموانع الوطء المشروع: تسعة، اتفق الفقهاء على ستة منها، وهي الحيض والنفاس والاعتكاف والصوم والإحرام والظهار قبل التكفير؛ واختلفوا في ثلاثة، وهي الاستحاضة، وعدم الاغتسال بعد الطهر من الحيض، والإقامة في دار الحرب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17490}\n\nأولاً: الحيض. اتفق أهل العلم على حرمة وطء الحائض في الفرج، لقوله تعالى في سورة البقرة ⁦(تُذكر الآية بالسورة دون نقل نصها)⁩، وقوله في الاستمتاع بالحائض: «اصنعوا كل شيء إلا النكاح». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17491} ثانياً: النفاس، وقد اتفق الفقهاء على حرمة وطء النفساء في الفرج، وأن حكم دم النفاس في حظر الوطء وفي الغسل وفي الكفارة كحكم الحيض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17491}\n\nثالثاً: الاستحاضة. اختلف الفقهاء في جواز وطء المستحاضة؛ فجمهور الحنفية والشافعية والمالكية وأحمد في إحدى الروايتين يجيزونه، ونقل ابن المنذر ذلك عن ابن عباس وسعيد بن المسيب والحسن وعطاء وقتادة وغيرهم، واحتجوا بأن المستحاضة طاهرة من الحيض، وبأن حمنة بنت جحش كانت تُستحاض وكان زوجها يجامعها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17491}\n\nالاستحاضة: القول الثاني، وهو ما عليه بعض أهل العلم، أنه لا يجوز وطء المستحاضة لأن الدم دم حيض فيعلّل بالحيض وهو موجود فيها فيثبت التحريم في حقها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17492}\n\nرابعاً: الاعتكاف. اتفق الفقهاء على تحريم الوطء في الاعتكاف، وأنه مفسد له ليلاً كان أو نهاراً إذا كان عامداً، لقوله تعالى في آية البقرة ⁦(وتفصيله في باب الاعتكاف)⁩. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17492}\n\nخامساً: الصوم. اتفق الفقهاء على تحريم الوطء عمداً على الصائم في رمضان، وأنه مفسد للصوم وموجب للكفارة، أنزل أو لم ينزل، ويُستدل بحديث أبي هريرة في الرجل الذي وقع على امرأته في نهار رمضان وأُمر بالكفارة ثم أُعطي تمراً يتصدق به؛ وقد أُحيل الباب إلى بابه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17492}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493}\n\nسادساً: الإحرام. اتفق الفقهاء على حرمة الوطء على المُحرِم بحج أو عمرة، لقوله تعالى في آية البقرة، والرفث يُفسَّر بالجماع ومقدماته من القول الفاحش، وهو دليل بالأولى أو نص فيه؛ والوطء في الإحرام جناية تفسد النسك إذا كان قبل الوقوف بعرفة ولا تفسده بعد التحلل الأول، واختلفوا فيما بين الوقوف والتحلل الأول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493}\n\nسابعاً: الظهار. لا خلاف في حرمة وطء المظاهَر منها قبل التكفير، لقوله تعالى في سورة المجادلة، ولحديث ابن عباس في الرجل الذي وقع على امرأته قبل أن يكفر، فأمره النبي بالاستغفار ونهاه عن العود حتى يكفّر. وتُمكّن الزوجة الزوج من نفسها قبل التكفير محرّم عليها كذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493}\n\nثامناً: وطء المسلم حليلته في دار الحرب. ذهب الجمهور من الحنفية والمالكية والشافعية إلى كراهته مخافة أن يكون له نسل فيها، لأن المسلم ممنوع من التوطن في دار الحرب، وحديث جرير في البراءة ممن يقيم بين أظهر المشركين، وهو مرسل عند البخاري في رأيه؛ والحنابلة يرون أنه لا يطأ زوجته في دار الحرب إلا للضرورة، فإذا وُجدت وجب العزل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494}\n\n⁦(ب)⁩ الوطء المحظور: صوره الزنى، واللواطة، ووطء الحليلة والأجنبية في دبرها، ووطء الميتة، ووطء البهيمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494}\n\nأولاً: الزنى حرام بإجماع الفقهاء وكبيرة من أعظم الكبائر، لقوله تعالى في سورة الإسراء بالنص على الآية دون نقلها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494}\n\nثانياً: اللواط: أجمع الفقهاء على أنه محرم مغلظ التحريم وأنه من الكبائر، وقال الماوردي إنه أغلظ الفواحش تحريماً، وأن اللواط لم يفعله أحد من العالمين قبل قوم لوط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494}\n\nعقوبة اللواط: اختلف الفقهاء فيها على ستة أقوال، وعرض الكتاب الأقوال على النحو التالي: القول الأول للشافعية في المذهب والحنابلة في المذهب وأبي يوسف ومحمد والثوري والأوزاعي وأبي ثور، وهو أن حد اللواط كحد الزنا، فيُرجم المحصن ويُجلد البكر، واستدلوا بحديث أبي موسى في أن الرجل إذا أتى الرجل فهما زانيان، وهو عند البيهقي منكر الإسناد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17495} والقول الثاني، لأبي حنيفة وحماد بن أبي سليمان والحكم، أنه لا حد فيه وإنما فيه التعزير والحبس حتى الموت أو التوبة، ومن اعتاده أو تكرر منه قتله الإمام في المرة الثانية، لأنه لم يطلق عليه اسم الزنا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17495} والقول الثالث للمالكية، أن حده الرجم مطلقاً للفاعل والمفعول به، محصنين أو غير محصنين، واستدلوا بعموم حديث «من وجدتموه يعمل عمل قوم لوط فاقتلوا الفاعل والمفعول به». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17495}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17496} والقول الرابع للشافعي في قول وإسحاق بن راهويه، أنه يُقتل بالسيف كالمرتد، محصناً كان أو غير محصن؛ ونسب الكتاب هذا الرأي إلى جماعة من الصحابة والتابعين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17496} ولم يُستكمل في هذه الصفحة عرض القولين الخامس والسادس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17496}\n\nإتيان الزوجة أو الأمة في الدبر: مرويّ عن جماعة من الصحابة والتابعين، وقال الماوردي إنه ما عليه الصحابة وجمهور التابعين والفقهاء؛ ونص جمع من الفقهاء على أنه من كبائر الإثم، منهم ابن النحاس والهيتمي وابن القيم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17497} وذهب الفقهاء إلى أنه لا حدّ فيه لأن كون الزوجة أو الأمة محل استمتاع أورث شبهة تدرأ الحد، ويجب فيه التعزير عند جمهور أهل العلم، وقد نص على ذلك الحنفية والمالكية والحنابلة، ويجب عند الشافعية إن تكرر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17497} واحتج الفقهاء على تحريمه بأحاديث في الباب تُذكر في الكتاب بمراجعها، وبأن الدبر ليس محلاً للوطء، وبأنه أذى دائم، وبأنه يضيّع حق المرأة في الاستمتاع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17498}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17499} وحُكي عن ابن عمر في رواية أخرى، وعن زيد بن أسلم ونافع وبعض الشافعية، ونُسب إلى مالك في قول، إباحة إتيان الزوجة في الدبر؛ وردّ العلماء الاستدلال بالآية على أن «أنّى» بمعنى «من أين»، وأن تأويل محمد بن كعب القرظي مردود، وأن الروايات عن ابن عمر ونافع ومالك ثابتة الإنكار عنهم؛ وذكر الكتاب ذلك دون أن يقرر حكماً من عنده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17499}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17501}\n\nرابعاً: وطء الأجنبية في الدبر: لا خلاف في تحريمه وأنه من كبائر الذنوب، واختلف الفقهاء في عقوبته على أربعة أقوال: الأول، للمالكية والحنابلة والشافعية في المذهب والصاحبين من الحنفية، أن فيه حد الزنى؛ والثاني، لأبي حنيفة وقول للشافعية، ألا حد فيه وفيه التعزير؛ والثالث، للقاضي أبي الحسن من المالكية، أن حكمه حكم اللواط، وقال ابن عقيل الحنبلي إنه يُحدّ حدّ اللواط؛ والرابع، لبعض الشافعية، أنه القتل بالسيف حداً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17501}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17502}\n\nخامساً: وطء الميتة: لا خلاف في تحريمه، وعده الهيتمي من كبائر الإثم، واختلفوا في العقوبة على مذهبين: الأول، للحنفية والشافعية في الأصح والحنابلة في المعتمد، أنه لا حد فيه وفيه التعزير؛ والثاني، للمالكية على المشهور والشافعية في مقابل الأصح وبعض الحنابلة، وقول الأوزاعي، أن فيه الحد، واستثنى المالكية الزوجة حال موتها فلا حد على زوجها بوطئها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17502}\n\nسادساً: وطء البهيمة: اتفق الفقهاء على تحريمه، وذكر الكتاب ما استدلوا به من عموم آية المؤمنون ومن حديث أبي هريرة في الملعون، وقد وُصفت بعض الأحاديث في الهامش بضعف الإسناد. وعدّه جمع من الفقهاء من كبائر الإثم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17503} واختلف الفقهاء في عقوبة الآتي البهيمة على أربعة أقوال، والكتاب لم يُكمل عرضها في هذا الموضع، وأولها لجابر بن زيد والحسن بن علي والحسن البصري والشافعي وأحمد في قول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17503}\n\nعقوبة إتيان البهيمة ⁦(تتمة الأقوال)⁩: القول الثالث للزهري، وهو أن عليه أدنى الحدّين مائة جلدة أحصن أو لم يحصن. والرابع، وهو لجمهور الفقهاء من الحنفية والشافعية في الأظهر والمالكية والحنابلة في المذهب، أنه لا يجب فيه الحد، ويلزم فيه التعزير، وروي عن ابن عباس وعطاء والشعبي والنخعي والحكم والثوري وإسحاق؛ وقال الحنفية للإمام أن يقتله إذا اعتاد ذلك، والبيري يرى القتل في المرة الثانية، والحنابلة يبالغون في تعزيره. واحتج الجمهور بأن الوطء فيها منكر يُغيَّر باليد، وبأنه لم يصح في وجوب الحد شيء عن النبي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17504}\n\nتمكين المرأة حيواناً من نفسها، كالكلب والقرد، حكمه كإتيان البهيمة عند الحنفية والشافعية والمالكية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17504}\n\nقتل البهيمة الموطوءة: اختلفوا على ثلاثة أقوال، فالحنفية والمالكية والشافعية في الأصح لا يوجبون قتلها لضعف الحديث الآمر بقتلها، ولنهي النبي عن ذبح الحيوان إلا لمأكلة؛ ويندب عند الحنفية ذبحها ثم إحراقها إن كانت مما لا يؤكل؛ والحنابلة والشافعية في وجه يوجبون قتلها مطلقاً، واستدلوا بحديث «من أتى بهيمة فاقتلوه واقتلوها معه»؛ والثالث يقتلها إن كانت للواطئ دون غيره، ونسبه الكتاب إلى الطحاوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17504}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17505} وإن كانت البهيمة لغير الواطئ فقد اختلفوا في ضمانها، فالشافعية في الوجه القائل بالقتل والحنابلة في المذهب يوجبون الضمان على الفاعل، والحنفية يرون أن يُطالب صاحبها بدفعها بالقيمة ثم تُذبح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17505}\n\nأكل البهيمة الموطوءة بعد ذبحها: ثلاثة أقوال، فالحنابلة في المذهب والصاحبان من الحنفية والشافعية في وجه يحرّمون أكلها، ورواية لأحمد أنه يكره ولا يحرم، والحنفية في قول وأبو حنيفة والمالكية والشافعية في المذهب يجيزون أكلها دون كراهة، لعموم آية المائدة في حل بهيمة الأنعام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17506}\n\nالوطء بشبهة: هو الوطء المحظور الذي لا يوجب حداً لقيام شبهة تنتفي بها قصد الزنا؛ وتفصيل تقسيمات الشبهة في بابها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17506}\n\nأحكام الوطء. حق الزوجة على زوجها في الوطء: للزوجة حق في إتيانها وقضاء وطرها، واستدل الكتاب بحديث عبد الله بن عمرو بن العاص في أن لزوجه عليه حقاً، وبحديث أبي الدرداء في الصيام والصلاة والإتيان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17506}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17507}\n\nضابط هذا الحق وحكمه التكليفي اختلف فيه الفقهاء على أربعة أقوال؛ فالحنفية وقول لبعض الشافعية يرون أن للزوجة مطالبة زوجها بالوطء، فيجب عليه وطء مرة واحدة قضاءً، والزيادة ديانةً؛ والشافعية يرون أنه لا يجب على الزوج الوطء قضاءً ولا إثم في تركه، ويُستحب ألا يعطلها تحصيناً لها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17507} والأقوال الأخرى لم تُستكمل في هذه الصفحات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17507}\n\nضابط حق الزوجة في الوطء ⁦(تتمة الأقوال)⁩: قال المالكية في الراجح إن للزوجة ليلة في كل أربع، وروى أبو الحسن الصغير عن أبي عمران أقوالاً في أقل ما يُقضى به: ليلة من أربع، أو ليلة من ثلاث، وقضى عمر بمرة في الطهر لأنه يحبلها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17508} والرابع للحنابلة في المذهب، أنه يجب على الزوج أن يطأ زوجته مرة في كل أربعة أشهر إن لم يكن له عذر، واحتجوا بأن الوطء حق لهما جميعاً، ولاستئذانها في العزل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17508} وعند ابن تيمية وابن القيم يجب على الرجل وطء زوجته بالمعروف بقدر حاجتها وقدرته، من غير تحديد بمرة في الشهر أو الأسبوع، والرجوع فيه إلى العرف؛ وقال بعض أهل العلم يجب أن يُشبعها وطأً كما يُشبعها قوتاً، ويرجحه ابن تيمية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17508}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17509} وإن تنازعا فرض الحاكم بحسب العرف وحال الزوجين، وعند ابن تيمية حصول الضرر بترك الوطء يقتضي الفسخ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17509}\n\nحق الرجل على زوجته في الوطء: للزوج أن يطالب زوجته بالوطء متى شاء إلا عند الموانع الشرعية كالحيض والنفاس والظهار والإحرام، فتجب عليها الاستجابة عند انتفاء المانع؛ وعد الذهبي والرافعي والنووي وابن الرفعة والهيتمي امتناعها بلا عذر من النشوز، وكبيرة، لورود الوعيد فيه؛ واستدل الكتاب بأحاديث أبي هريرة في الملائكة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17509}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510} أما الرجل فلا تجب عليه الإجابة إذا دعته المرأة إلا إذا قصد مضارتها فيحرم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510}\n\nحق الزوجة في الفرقة لعجز الزوج عن الوطء ⁦(جَبّ أو خِصاء أو عِنّة)⁩: فرّق الفقهاء بين العجز المقارن للعقد والحادث بعد الدخول، وبين علم المرأة بالعيب عند العقد وعدمه، وتفصيله في باب الطلاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510}\n\nحق الزوج في الفسخ إذا كان بالزوجة عيب يمنع الوطء ⁦(كالرتق والقرن)⁩، واختلفوا فيه على قولين، وتفصيله في بابه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510}\n\nامتناع الرجل عن وطء زوجته إيلاءً أو مظاهرة. الإيلاء: لا خلاف أن المولي يُمهل أربعة أشهر، وهي المدة التي ذكرها الكتاب في سورة البقرة، ومن أصرّ على ترك الوطء حتى مضت المدة فللزوجة أن ترفع أمرها إلى القاضي، فيأمره بالفيء، فإن أبى أمره بالطلاق، فإن لم يطلّق طلّق القاضي عليه، وهو قول جمهور الشافعية والمالكية والحنابلة؛ والحنفية يقولون يقع الطلاق بمضي أربعة أشهر دون توقف على القاضي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17511} الظهار: ذهب جمهور الفقهاء إلى تحريم وطء المظاهر زوجته قبل التكفير، وفي رواية لأحمد يجوز إذا كان التكفير بالإطعام، والتفصيل في بابه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17511}\n\nالظهار ⁦(تتمة)⁩: للزوجة أن ترفع الأمر إلى القاضي إذا امتنع المظاهر عن التكفير، فيأمره القاضي بالتكفير، فإن أبى أجبره بوسائل التأديب حتى يكفّر أو يطلّق؛ وهذا قول الحنفية، لأن الزوج أضرّ بزوجته بتحريمها عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17512} وفرّق المالكية بين العاجز عن الكفارة والقادر عليها: فالعاجز يُطلَّق عليه، والقادر يُمهَل أربعة أشهر كالإيلاء، ثم يُؤمر بالطلاق أو التكفير. وقال الحنابلة إن المظاهر لا يُؤمر بالوطء لأنه محرم عليه قبل التكفير، ويُمهل ليعتق أو يطعم أو يصوم بحسب قدرته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17512}\n\nحق الزوجة في منع نفسها حتى تقبض مهرها: اتفق الفقهاء على أن الزوج إذا سلّم المهر وجب على الزوجة أن تمكّنه إذا طلب ذلك، ولا تمنعه إذا كان المهر كله مؤجلاً أو بعضه المؤجل، لأن رضاها بالتأجيل رضا بتسليم نفسها؛ وقيّد الحنفية ذلك بشرط الدخول قبل الأجل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17513} أما المعجّل فجماهير الفقهاء من الحنفية والشافعية والمالكية والحنابلة يرون للزوجة أن تمنع نفسها حتى تقبض المعجل، لأن المهر عوض عن البضع كالثمن عن المبيع، وحكى ابن المنذر الإجماع على ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17513}\n\nأثر الوطء في سقوط حق الامتناع بعد التمكين: قولان؛ الأول لأبي حنيفة وابن حامد من الحنابلة، أن لها أن تمنع نفسها حتى تقبض، لأن العقد عُقد على كل وطأة؛ والثاني لأبي يوسف ومحمد والشافعية والمالكية والحنابلة في المذهب، أنه ليس لها ذلك لأن تسليمها برضاها بقاء المهر في الذمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17513}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17514}\n\nحلول أجل المهر المؤجل قبل التسليم: قولان؛ الأول، للحنفية في المعتمد والشافعية في الأصح والحنابلة، أنه ليس لها أن تمنع نفسها لأن حق الحبس سقط برضاها بالتأجيل؛ والثاني، للشافعية في مقابل الأصح والمالكية وأبي يوسف، أن لها المنع لأنه صار كالعاجل، وقيّد أبو يوسف ذلك بعدم اشتراط الدخول قبل الأجل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17514}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17515}\n\nتنازع الزوجين في البداءة بالتسليم: الحنفية والمالكية يرون أن الزوج يُلزم بالتسليم أولاً، وكره مالك للزوجة تمكين زوجها قبل قبض ربع دينار حقاً لله؛ والحنابلة والشافعية في قول يجبر الزوج أولاً ثم الزوجة؛ والشافعية في الأظهر يجبران معاً بإيداع الصداق عند عدل؛ وقال الشافعية في قول ثالث لا إجبار على أيٍّ منهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17515}\n\nاشتراط عدم الوطء أو عدم حلّه في عقد النكاح: اتفقوا على بطلان شرط نفي حلّ الوطء، واختلفوا في أثره على العقد: الجمهور من الشافعية والمالكية والحنابلة يرون بطلان الشرط والعقد معاً لمنافاته مقصود العقد، والحنفية يرون الشرط فاسداً والعقد صحيحاً لأن النكاح لا يبطل بالشرط الفاسد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17516} وفي شرط عدم الوطء ثلاثة أقوال: الحنفية والحنابلة يصححون العقد ويلغون الشرط؛ والمالكية يرون الشرط والعقد فاسدين، وفيه خلاف في الفسخ قبل الدخول وبعده، والمشهور أن الفسخ قبل الدخول يُثبت بعده ويسقط الشرط؛ والشافعية يرون البطلان إن كان الشرط من جهتها، ولا يضر إن كان من جهته لأن الوطء حقه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17516}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17517}\n\nالعزل: هو إنحاء الماء عند الجماع عن الرحم، وجمهور الفقهاء على جواز عزل السيد عن أمته مطلقاً، ونقل القرافي الإجماع عليه؛ أما العزل عن الزوجة الحرة فاختلفوا فيه، وتفصيله في باب العزل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17517}\n\nالغيلة ⁦(وطء المرضع)⁩: اتفقوا على جوازه لحديث جُدامة بنت وهب في أن النبي هم بالنهي عنه ثم ذكر أن الروم وفارس يفعلونه فلا يضر أولادهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17517}\n\nوطء الحامل: ذهب قوم إلى كراهته لحديث «لا تقتلوا أولادكم سراً»، وذهب جمهور الفقهاء إلى حله، واستدلوا بحديث الرجل الذي سأل النبي عن العزل عن امرأته، وقال إن كان ذلك فلا، ما ضار ذلك فارس والروم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17517}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17518}\n\nآثار الوطء: ⁦(أ)⁩ يتأكد به كمال المهر المسمى عند الحنفية والشافعية والمالكية والحنابلة، لأن الوطء استيفاء المقصود، وبه يتأكد البدل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17518} ⁦(ب)⁩ تثبت به العدة بالطلاق، لقوله تعالى في آية الأحزاب بالتنبيه دون نص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17519} ⁦(ج)⁩ الوطء فيء الإيلاء وينجلي به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17519} ⁦(د)⁩ الوطء في النكاح الصحيح على وجه يوجب الغسل شرط من شروط الإحصان في الزنا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17519} ⁦(ه)⁩ تصح الرجعة بالوطء عند جمهور الحنفية والحنابلة والمالكية بشرط قصد الارتجاع، خلافاً للشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17519} ⁦(و)⁩ أثر الوطء على مشروعية الطلاق، وهو قسم الفقهاء الطلاق من حيث وصفه، ويُفصّل في بابه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17519}\n\nأثر الوطء على الطلاق ⁦(تتمة)⁩: الطلاق المشروع أن يطلق المرأة طاهراً من غير جماع، أو حاملاً مستبيناً حملها؛ والمحرم أن يطلقها حائضاً، أو في طهر جامعها فيه، وذلك في المدخول بها، أما غير المدخول بها فيجوز طلاقها حائضاً وطاهراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17520} وفي وقوع طلاق البدعة: قال جمهور الفقهاء من الحنفية والشافعية والمالكية والحنابلة إنه يقع والمطلّق عاص، لحديث ابن عمر في طلاقه زوجته وهي حائض وأمر النبي بمراجعتها؛ وقال ابن تيمية وابن القيم وابن حزم والشوكاني ورواية عن ابن عمر وطاووس إنه لا يقع لأنه مخالف لأمر النبي فكان مردوداً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17520}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17521}\n\nأثر الوطء في إيجاب حدّ الزنا: الوطء الموجب للحد هو إدخال قدر حشفة من ذكر مكلف في فرج مشتهاة خالٍ عن ملك الواطئ وشبهته، وتفصيله في باب الزنا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17521}\n\nأثر الوطء في إيجاب الغسل: اتفقوا على أن التقاء الختانين يوجب الغسل على الرجل والمرأة، أي غيبوبة الحشفة في الفرج، لحديث عائشة وحديث أبي هريرة، وزاد الثاني «وإن لم ينزل». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17521}\n\nأثر الوطء في تحليل المطلقة ثلاثاً: لا تحل للأول حتى تنكح زوجاً غيره، لآية البقرة؛ وجماهير أهل العلم على أنها لا تحل حتى يطأها الثاني وطئاً يوجد فيه التقاء الختانين، ولو لم ينزل؛ وقال سعيد بن المسيب بجواز تزويج الأول إذا كان التزويج صحيحاً لا يريد به الإحلال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17521}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17522}\n\nأثر الوطء في التحريم بالمصاهرة: لا خلاف في أن العقد على البنت يحرّم على الرجل أمّها وإن علت على التأبيد بمجرد العقد، ويحرم زوجات الأبناء وزوجات الآباء؛ أما الربيبة فتحرم بشرطين: العقد على الأم، والدخول بها؛ فإن لم يوجد الدخول لم يثبت التحريم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17522}\n\nأثر الوطء في إيجاب الكفارات: (1) وطء الحائض، واختلفوا في الكفارة على أربعة أقوال: الحنفية والشافعية على الصحيح لا كفارة، بل يُستحب الصدقة بدينار أو نصف دينار؛ والحنابلة والشافعية في قول يوجبون دينار أو نصفه على التخيير، لحديث ابن عباس؛ والمالكية والثوري والليث وأحمد في رواية لا كفارة عليه إلا التوبة والاستغفار؛ والحسن البصري وسعيد بن المسيب يوجبون كفارة الوطء في رمضان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17522}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17523} (2) الوطء في صوم رمضان: جماهير أهل العلم على وجوب الكفارة والقضاء على من جامع عامداً نهاراً في رمضان، أنزل أو لم ينزل، لحديث أبي هريرة في الرجل الذي وقع على امرأته في رمضان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17523}\n\nالوطء في إحرام الحج: أجمع الفقهاء على أن المُحرم بالحج إذا جامع قبل الوقوف بعرفة فسد حجه، وعليه الهدي؛ وهو عند الحنفية شاة، وعند الشافعية والمالكية والحنابلة بدنة. وإن جامع بعد الوقوف وقبل التحلل الأول فعليه بدنة باتفاق؛ وإن جامع بعد التحلل الأول فعند الحنفية والشافعية والحنابلة عليه شاة، وقال مالك عليه بدنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17524}\n\nأثر الوطء في إبطال الصوم: اتفقوا على أن من جامع عامداً نهار رمضان فسد صومه أنزل أو لم ينزل؛ فإن كان ناسياً فجمهور الحنفية والشافعية وأحمد في رواية والثوري والحسن ومجاهد لا يفسد صومه، وقال المالكية والحنابلة في المشهور وعطاء يفسد كالعامد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17524}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17525}\n\nأثر الوطء في إبطال الحج: اتفقوا على أن الجماع قبل الوقوف بعرفة يفسد الحج، ويستمر الواطئ في حجه الفاسد ثم يقضيه، ولا يفسد بعد الوقوف وبعد التحلل الأول؛ وبين الوقوف والتحلل الأول قال الشافعية والمالكية والحنابلة يفسد، وقال الحنفية لا يفسد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17525}\n\nوطء المصحف: لا خلاف أن المسلم إذا وطئه قصداً إلى الإهانة صار مرتداً، وإن كان مكرهاً أو مضطراً فلا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17525}\n\nوطء القبر: القبر محترم، فيكره وطؤه والجلوس عليه عند جمهور الفقهاء، لحديث عقبة بن عامر وأثر ابن مسعود؛ فالشافعية والحنابلة يكرهونه إلا لحاجة، والمشي بين القبور لا يكره عند الشافعية، ويكره عند الحنابلة بالنعل دون الخف؛ والحنفية يكرهون الجلوس عليه إلا لضرورة؛ والمالكية يكرهونه بقيود: أن يكون القبر مسنَّماً والطريق دونه، وأن يُظن بقاء شيء من عظامه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17525}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17526}\n\nوطء الدابة برجلها: اتفق الحنفية والشافعية والمالكية والحنابلة على أن ما وطئته الدابة أثناء سيرها بيدها أو رأسها أو رجلها مضمون على من معها من راكب أو قائد أو سائق متى أمكن نسبة ذلك إليه بتعدٍّ أو تقصير، فإن لم تُنسب إليه فلا ضمان، لحديث «العَجْماء جَرحُها جُبار». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17526}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17527} وقال الشافعي إن القائد والسائق والراكب يضمنون ما أصابت بيد أو فم أو رجل أو ذنب، وإنما يضمن من حمل الدابة على أن تطأ شيئاً، والنووي يذكر أن الدابة النزقة لا تُركب في الأسواق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17527}"
  en: "Wat', lexically, is standing over a thing; it is also used for intercourse, the insertion of a male member into a female's sexual organ until the two are as one. The technical sense does not depart from the lexical. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17482}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17483}\n\nRelated words: nikah, whose root is joining and gathering, is used in the strict sense for the marriage contract and in a figurative sense for intercourse, or the reverse, as the lexicographers and jurists differ; liwat is intercourse with males, which falls under the wider wat'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17483}\n\nFirst, wat' as intercourse. It is either lawful or forbidden. The lawful is intercourse with a wife or a concubine, which may be forbidden at times, such as during menstruation or post-natal bleeding, before a zihar is expiated, in ihram, while fasting or in i'tikaf. The forbidden is either of a kind that could be lawful in another case, such as intercourse with a woman who may be married to one, which carries the penalty of zina, or of a kind that can never be lawful, such as sodomy, anal intercourse with a wife or a non-wife, and bestiality. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17483}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17484}\n\nThe causes that make intercourse lawful are the marriage contract and ownership of the right hand. Ownership of a female slave is lawful without a contract, because ownership of the person carries the use. The Qur'an alludes to this in the sura of al-Mu'minun (cited by sura only) without a verse being quoted here. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17484}\n\nThe ruling: the majority of jurists hold that intercourse with a wife or concubine is in principle permitted, being a pleasure that the natural disposition calls for, with no obedience or disobedience in itself. It becomes recommended with a good intention, such as keeping oneself chaste from the unlawful, may become obligatory when it is the only means of chastity for oneself or one's household, and may be forbidden or disliked according to circumstances. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17484}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17485}\n\nIbn al-Qayyim lists the purposes of intercourse: preserving the progeny, releasing the water that harms the body if it is retained, and the fulfilment of desire and pleasure; its benefits include lowering the gaze, restraining the self and securing chastity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17485}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17486}\n\nThe reward for lawful intercourse: the report of Abu Dharr that 'in the intimacy of one of you there is charity' is cited; the majority hold that a man is rewarded for intercourse with his wife when accompanied by a good intention, such as keeping himself or his wife from the unlawful, fulfilling her right in proper companionship, or seeking a righteous child. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17486} Where the man intends nothing but the fulfilment of his desire, the jurists differ: Ibn Qutayba holds he is rewarded in every case, while Ibn Hajar al-Haytami and others say there is no reward where no such intention exists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17486}\n\nIntercourse and its rewards: a Muslim is rewarded for what he spends on his household if he seeks the reward of God in it; if this is so for obligatory spending, it is more so for lawful intercourse, as the book states. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17487}\n\nThe courtesies and recommended acts of intercourse: it is recommended to begin with the basmala; to turn away from the qibla out of respect for it; to begin with play, embrace and kissing, so that the woman's desire rises; to take care to reach the satisfaction of both together; to cover oneself with a cloth; to lower the voice and speak little. It is disliked for a man to have intercourse where he can be seen or his sounds heard, and forbidden when the private parts are exposed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17487}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17488} It is recommended for one who wishes to repeat intercourse to wash his private part and perform wudu', and ghusl is better; the book cites the report that the Prophet went round his wives with a single ghusl. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17488}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17489}\n\nSpeaking about intercourse and disclosing its secrets: the jurists differ. The Hanafis, a Hanbali view which al-Mardawi prefers, and al-Nawawi hold that boasting of intercourse and disclosing what passes between spouses is forbidden, on the report of Abu Sa'id about the worst of people in rank before God and the saying that spreading (such talk) is forbidden. Ibn al-Qayyim, al-Haytami and others count it among the major sins. The school view of the Hanbalis is that the spouses' speaking of what passes between them is disliked, even to a co-wife. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17489}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17490}\n\nImpediments to lawful intercourse: there are nine. The jurists agree on six of them, namely menstruation, post-natal bleeding, i'tikaf, fasting, ihram and zihar before its expiation; they differ on three, namely istihada, failure to wash after the end of menstruation, and residence in the abode of war. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17490}\n\nFirst, menstruation: the jurists agree that intercourse with a menstruating woman in the vagina is forbidden, on the verse of sura al-Baqara (cited by sura only) and the saying that one may do everything except intercourse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17491} Second, post-natal bleeding: the jurists agree that intercourse in the vagina is forbidden, and that its rules, including washing and expiation, are those of menstruation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17491}\n\nThird, istihada: the jurists differ on whether intercourse with an irregularly bleeding woman is permitted. The majority of Hanafis, Shafi'is and Malikis, and one Hanbali report, permit it, a view reported by Ibn al-Mundhir from Ibn 'Abbas, Sa'id ibn al-Musayyab, al-Hasan, Ata and others, citing that she is pure of menstruation and the case of Hamna bint Jahsh, whose husband Talha had intercourse with her while she bled. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17491}\n\nIstihada, the second view, which some jurists hold: intercourse with an irregularly bleeding woman is forbidden, because the blood is blood of menstruation, and the cause of the prohibition, menstruation, is present in her, so the prohibition applies to her. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17492}\n\nFourth, i'tikaf. The jurists agree that intercourse during i'tikaf is forbidden and invalidates it, by night or by day, if intentional, on the verse of sura al-Baqara on i'tikaf in the mosque (the detail under i'tikaf). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17492}\n\nFifth, fasting. The jurists agree that intentional intercourse by a fasting person in Ramadan is forbidden, invalidates the fast and requires expiation, whether he ejaculates or not, on the report of Abu Hurayra of the man who had intercourse with his wife while fasting in Ramadan and was given dates to give in charity, which the book quotes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17492}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493}\n\nSixth, ihram. The jurists agree that intercourse by a pilgrim in hajj or umra is forbidden, on the verse of sura al-Baqara, in which 'rafath' is explained as intercourse and the talk that accompanies it. An intercourse before standing at 'Arafat invalidates the pilgrimage, while after the first release it does not; the views differ on the period between standing at 'Arafat and the first release. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493}\n\nSeventh, zihar. There is no dispute that intercourse with a woman on whom zihar has been pronounced is forbidden before expiation, on the verse of sura al-Mujadila and the report of Ibn 'Abbas of the man who had intercourse before expiating, whom the Prophet told to ask forgiveness and not to repeat it until he had expiated. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493}\n\nEighth, a Muslim's intercourse with his wife in the abode of war. The majority of Hanafis, Malikis and Shafi'is hold it disliked, fearing offspring there, since the Muslim is forbidden to settle in the abode of war, citing the saying of the Prophet that he is free of every Muslim who lives among the polytheists, which al-Bukhari judged to be a mursal report. The Hanbalis hold that a Muslim may not have intercourse with his wife in the abode of war except by necessity, and that when necessity arises he must practise withdrawal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494}\n\n(b) Forbidden intercourse: its kinds are adultery, sodomy, intercourse with a wife or a non-wife in the anus, with a dead woman, and with an animal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494}\n\nFirst, adultery is forbidden by the consensus of the jurists and is one of the greatest major sins, on the verse of sura al-Isra cited by sura and number. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494}\n\nSecond, sodomy: the jurists agree it is forbidden with the greatest severity and is a major sin; al-Mawardi calls it the most grievous of abominations and notes that no one in the worlds did it before the people of Lot. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494}\n\nThe penalty for sodomy: the jurists give six views, of which the book sets out the first four. The first, held by the Shafi'i and Hanbali school views, by Abu Yusuf, Muhammad, al-Thawri, al-Awza'i and Abu Thawr, is that the penalty for sodomy is that of adultery: a married offender is stoned and an unmarried one is flogged; they cite a report from Abu Musa that when a man comes to a man, both are adulterers, which al-Bayhaqi calls a rejected chain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17495} The second, held by Abu Hanifa, Hammad ibn Abi Sulayman and al-Hakam, is that there is no hadd but discretionary punishment and imprisonment until death or repentance, and that a repeat offender is killed by the ruler at a second offence, married or not, as policy; the reason given is that the act is not the name of adultery. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17495} The third, held by the Malikis, is that the penalty is stoning in every case, for the active and passive partner, married or not, citing the general wording of the hadith on killing both partners. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17495}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17496} The fourth, held by al-Shafi'i in one view and by Ishaq ibn Rahawayh, is that the offender is killed by the sword like an apostate, married or not, a view attributed by the book to a number of Companions and Successors. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17496} The fifth and sixth views are not yet read at this point of the scan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17496}\n\nIntercourse with a wife or a female slave in the anus: the book reports this view from several Companions and Successors; al-Mawardi says it is the position of the Companions, most Successors and jurists. Several jurists, Ibn al-Nahhas, al-Haytami and Ibn al-Qayyim among them, state that it is among the major sins. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17497} The jurists hold that there is no hadd for it, because a wife or slave is in some sense a place of enjoyment, which creates a doubt that averts the hadd; the majority hold that discretionary punishment (ta'zir) is due, as the Hanafis, Malikis and Hanbalis state, and the Shafi'is hold that it is due if repeated. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17497} The jurists cite hadiths on the subject, referenced in the book's notes, the reasoning that the anus is not a place made for intercourse, that it is a constant harm, and that it denies the wife her right to enjoyment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17498}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17499} Views the book attributes to Ibn 'Umar in one report, Zayd ibn Aslam, Nafi' in one report, some Shafi'is, and Malik in one view, permit it. The scholars replied that the verse's word 'anna' means 'from where', that the explanation by Muhammad ibn Ka'b al-Qurazi is rejected, and that the reports of Ibn 'Umar, Nafi' and Malik denying the permission are the sounder ones; the book records the views without adding its own ruling. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17499}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17501}\n\nFourth, intercourse with a non-wife in the anus: there is no dispute that it is forbidden and a major sin. There are four views on its penalty: the first, of the Malikis, Hanbalis, Shafi'is in the school view and the two companions of Abu Hanifa, is the hadd for adultery; the second, of Abu Hanifa and one Shafi'i view, is that there is no hadd but discretionary punishment; the third, of the Maliki judge Abu al-Hasan, equates it with sodomy, and Ibn 'Aqil says the hadd of sodomy applies; the fourth, of some Shafi'is, is death by the sword as a hadd. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17501}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17502}\n\nFifth, intercourse with a dead woman: there is no dispute that it is forbidden, and al-Haytami counts it among the major sins. There are two views on the penalty: the first, of the Hanafis, the sounder Shafi'i view and the Hanbali preferred view, that there is no hadd and only discretionary punishment; the second, of the Malikis in the better-known view, the Shafi'is in a view against the sounder, some Hanbalis and al-Awza'i, that the hadd applies. The Malikis exempt a husband who has intercourse with his dead wife from the hadd. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17502}\n\nSixth, intercourse with an animal: the jurists agree it is forbidden, citing the general wording of the verse of sura al-Mu'minun and the hadith of Abu Hurayra about the one who has intercourse with an animal; several of the hadiths the book cites are judged weak in their chains in the notes. Several jurists count it among the major sins. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17503} The jurists differ on the penalty for it in four views; the first, held by Jabir ibn Zayd, al-Hasan ibn Ali, al-Hasan al-Basri, al-Shafi'i and one Ahmad view, is listed here, and the list continues beyond p.17503. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17503}\n\nThe penalty for intercourse with an animal, the remaining views: the third is that of al-Zuhri, who holds the lighter of the two hadd penalties applies, one hundred lashes, whether married or not. The fourth, held by the majority of Hanafis, the Shafi'is in the more likely view, the Malikis and the Hanbali school, is that no hadd applies and discretionary punishment is due; this is reported from Ibn 'Abbas, 'Ata', al-Sha'bi, al-Nakha'i, al-Hakam, al-Thawri and Ishaq. The Hanafis say the ruler may kill the offender who repeats it, al-Bayri judges a second offence to warrant death, and the Hanbalis press the discretionary punishment hard. The majority argue that the act is wrong, to be changed by the hand, and that no report establishes a hadd. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17504}\n\nA woman who lets an animal such as a dog or monkey approach her is treated as one who has intercourse with an animal, according to the Hanafis, Shafi'is, Malikis and Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17504}\n\nKilling the animal used: three views. The Hanafis, Malikis and the sounder Shafi'i view do not require it, because the hadith ordering its killing is weak and because the Prophet forbade killing animals except for food. The Hanafis recommend slaughtering it and burning it if it is not eaten. The Hanbalis and a Shafi'i view require killing it in every case, citing the hadith 'whoever has intercourse with an animal, kill him and kill the animal with him'. A third view kills it only when the offender owns it; the book attributes this to al-Tahawi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17504}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17505} If the animal belongs to another, the jurists differ on liability: the Hanbalis and the Shafi'i view that requires killing hold the offender liable, while the Hanafis say the owner is asked to hand it over for its value and then it is slaughtered. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17505}\n\nEating an animal used in this way after slaughter: three views. The Hanbali school view and the two companions of Abu Hanifa, with a Shafi'i view, forbid it; one Ahmad report disapproves without forbidding it; Abu Hanifa, the Malikis and the Shafi'i school view permit it without disapproval, citing the verse of sura al-Ma'ida that permits grazing animals. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17506}\n\nIntercourse by mistake (wat' bi-shubha): the act is forbidden but does not bring the hadd, because a doubt removes the intent to commit adultery; the types of doubt are treated under their own heading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17506}\n\nRules of intercourse. The wife's right over her husband: she has a right that he have intercourse with her and satisfy her desire, as the report of Abd Allah ibn Amr shows: 'your body has a right over you, and your wife has a right over you', and the saying to Abu al-Darda'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17506}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17507} The jurists give four views on the extent and duty of this right. The Hanafis and a Shafi'i view hold that the wife may ask for intercourse, and that a husband must comply once by judgement, while more is owed before God as a matter of good companionship; the Shafi'is hold no duty and no sin in leaving it, though it is recommended not to leave a wife without intercourse out of protection for her. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17507} The remaining views are not complete in these pages. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17507}\n\nMeasure of the wife's right to intercourse (the remaining views): the Malikis, in the more likely view, hold that a wife is due one night in every four; Abu al-Hasan al-Saghir reports from Abu Imran views on the least that may be enforced, one night in four, or one night in three, and 'Umar decided once in each purity because the husband makes her pregnant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17508} The fourth view, of the Hanbali school, is that the husband must have intercourse with his wife at least once in four months if he has no excuse; they argue that intercourse is a right of both spouses, and that a wife's consent is needed for withdrawal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17508} Ibn Taymiyya and Ibn al-Qayyim hold that intercourse must be in accordance with custom, in proportion to the wife's need and the husband's ability, with no fixed number; the book notes that some hold he must satisfy her as he must feed her, which Ibn Taymiyya preferred. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17508}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17509} If the spouses dispute the right, the judge sets it by custom and their circumstances; Ibn Taymiyya holds that harm to the wife from its withholding permits dissolution in every case. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17509}\n\nThe husband's right over his wife: the husband may ask his wife for intercourse whenever he wishes, except where a lawful impediment exists, such as menstruation, post-natal bleeding, zihar or ihram; when the impediment is absent she must comply. The jurists al-Dhahabi, al-Rafi'i, al-Nawawi, Ibn al-Rif'a and al-Haytami count a wife's refusal without excuse as a form of disobedience and a major sin, citing the strong warnings in the hadith. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17509}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510} The husband need not comply when his wife asks, unless he intends to harm her, in which case it is forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510}\n\nThe wife's right to separation when the husband is unable to have intercourse (impotence, castration, or sexual incapacity): the jurists distinguish incapacity that exists at the contract from incapacity arising after consummation, and a wife who knew of the defect from one who did not. The detail is under divorce. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510}\n\nThe husband's right to annul the marriage when the wife has a defect that prevents intercourse (such as an occluded passage or a horn-like growth): the jurists differ on two views; detail under its heading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510}\n\nWithholding intercourse by oath (iyla) or by zihar. Iyla: there is no dispute that the husband who swears not to have intercourse has four months, the period set in sura al-Baqara. If he persists until four months pass, the wife may take the matter to the judge, who orders him to return, then to divorce; if he refuses the judge divorces on his behalf, the view of the majority of Shafi'is, Malikis and Hanbalis; the Hanafis say divorce takes effect on the lapse of four months without the judge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17511} Zihar: the majority hold intercourse with a wife on whom zihar has been pronounced forbidden before expiation; a Hanbali report permits it where the expiation is by feeding; the details are under zihar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17511}\n\nZihar, continued: the wife may take the matter to the judge if the husband refuses expiation; the judge orders him to expiate, and if he refuses, compels him by disciplinary means until he expiates or divorces; this is the Hanafi view, since the husband has harmed her by making her unlawful to him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17512} The Malikis distinguish a husband unable to expiate, who is divorced by the judge, from one able to do so, who is granted four months as in iyla, after which he is told to divorce or expiate. The Hanbalis say a zihar husband is not ordered to resume intercourse, since it is forbidden before expiation, and is given time to free a slave, feed the poor or fast, according to his means. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17512}\n\nThe wife's right to withhold herself until she receives her dower: the jurists agree that once the husband has handed over the dower she must allow him access when he asks, with no lawful impediment; she may not refuse if the whole dower is deferred, or if the deferred part is the larger, because her acceptance of the deferral is acceptance of handing herself over. The Hanafis limit this to a condition that intercourse occur before the term, to which she agreed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17513} For a prompt dower, the majority of Hanafis, Shafi'is, Malikis and Hanbalis hold that she may withhold herself until she receives the prompt portion, since the dower is a return for the womb as the price is for the goods; Ibn al-Mundhir reports consensus on this. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17513}\n\nThe effect of intercourse on the right to withhold after she has allowed access: two views. The first, of Abu Hanifa and Ibn Hamid among the Hanbalis, is that she may still withhold until she is paid, since the contract covers each act of intercourse; the second, of Abu Yusuf, Muhammad, the Shafi'is, Malikis and the Hanbali school, is that she may not, because her handing herself over was consent to the dower remaining a debt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17513}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17514}\n\nWhen the deferred dower falls due before the wife hands herself over: two views. The first, of the preferred Hanafi view, the sounder Shafi'i view and the Hanbalis, is that she may not withhold, since the right of retention fell away by her consent to the deferral. The second, of one Shafi'i view, the Malikis and Abu Yusuf, is that she may withhold, since it is now like a prompt dower; Abu Yusuf limits this to cases in which the husband did not stipulate intercourse before the term. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17514}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17515}\n\nThe dispute over who starts the handing over: the Hanafis and Malikis hold that the husband must hand over first, since the husband's right is fixed by the contract while the wife's right to the dower is fixed by receiving it; Malik disliked the wife's allowing access before receiving a quarter dinar, as a right of God. The Hanbalis and a Shafi'i view compel the husband first, then the wife. The preferred Shafi'i view has both compelled together, by deposit of the dower with a trustee who is neither party's agent. A third Shafi'i view compels neither, since the rights are equal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17515}\n\nStipulating in the marriage contract that intercourse will not be lawful, or that it will not occur: all agree the stipulation is void, but differ on its effect on the contract. The majority of Shafi'is, Malikis and Hanbalis hold both the stipulation and the contract void, because it defeats the purpose of the contract. The Hanafis hold the stipulation invalid but the contract valid, since a marriage is not voided by an invalid condition. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17516} For the stipulation that intercourse will not occur, there are three views: the Hanafis and Hanbalis hold the contract valid and the condition void; the Malikis hold both void, and among them the preferred view allows annulment before consummation and not after, with the condition falling away; the Shafi'is hold the contract void if the condition came from the wife, but harmless if from the husband, since intercourse is his right. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17516}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17517}\n\nWithdrawal (azl), meaning withdrawing before ejaculation into the womb: the majority allow it for a master with his slave-woman, whether or not she consents, the consensus being reported by al-Qarafi; the views on withdrawal from a free wife are detailed under their own heading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17517}\n\nNursing intercourse (ghila): all agree it is permitted, on the report of Judhama bint Wahb in which the Prophet intended to forbid it, then mentioned that Rome and Persia did it without harm to their children. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17517}\n\nIntercourse with a pregnant woman: some jurists disliked it, citing the saying 'do not kill your children secretly'; the majority permit it, citing the report of the man who asked the Prophet about withdrawal and was told that if it is needed then there is no harm, as it did no harm to Persia and Rome. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17517}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17518}\n\nThe effects of intercourse: (a) it confirms the full named dower, according to the Hanafis, Shafi'is, Malikis and Hanbalis, since intercourse is the fulfilment of the purpose; (b) it establishes the waiting period after divorce, by the verse of sura al-Ahzab; (c) it is the act that makes an oath of iyla void; (d) in a valid marriage, intercourse of the kind that requires ghusl is a condition of ihsan for adultery; (e) it restores a revocable divorce, in the view of the Hanafis, Hanbalis and Malikis, if the husband intends to take the wife back, against the Shafi'is; (f) its effect on the permissibility of divorce, a division detailed under divorce. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17518}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17519}\n\nThe effect of intercourse on divorce, continued: a lawful divorce is pronounced on a wife in a state of purity without intercourse during that purity, or when she is pregnant and her pregnancy is evident. An unlawful divorce is one pronounced during menstruation, or in the purity in which intercourse took place; for a wife not yet consummated, divorce during menstruation or purity is lawful. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17520} On whether a bid'a divorce takes effect: the majority of Hanafis, Shafi'is, Malikis and Hanbalis hold that it takes effect, and the husband is sinful, citing Ibn 'Umar's divorce of his wife during menstruation, after which the Prophet ordered him to take her back. Ibn Taymiyya, Ibn al-Qayyim, Ibn Hazm and al-Shawkani, and a view attributed to Ibn 'Umar and Tawus, hold that it does not take effect, because it contradicts the Prophet's command. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17520}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17521}\n\nThe effect of intercourse on the hadd for adultery: the intercourse that triggers the hadd is the insertion of at least the head of a sane, adult male's member into a desirable vagina that is not the man's own property or subject to a doubt in the land of Islam; detail under adultery. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17521}\n\nThe effect of intercourse on ghusl: the meeting of the two circumcised parts (the head passing into the vagina) requires ghusl for man and woman, on the report of 'A'isha, and the report of Abu Hurayra adds 'even if he does not ejaculate'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17521}\n\nThe effect of intercourse on a woman divorced three times: she may not be lawful to her first husband until she marries another husband, on the verse of sura al-Baqara; the majority hold that she is not lawful to the first until the second husband has intercourse with her, with the meeting of the circumcised parts, even without ejaculation; Sa'id ibn al-Musayyab holds that the first may remarry her if the second marriage is sound and not intended to make her lawful. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17521}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17522}\n\nThe effect of intercourse on marriage affinity: there is no dispute that the contract with a daughter makes her mother, however high, unlawful for ever, by the contract alone, whether or not intercourse took place, and likewise sons' and fathers' wives. A stepdaughter is forbidden by two conditions, the contract with her mother and intercourse with the mother; without intercourse, the prohibition does not hold. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17522}\n\nThe effect of intercourse on expiations: (1) intercourse with a menstruating wife. Four views: the Hanafis and the sounder Shafi'i view require no expiation, only a recommended alms of a dinar or half a dinar; the Hanbalis and one Shafi'i view require a dinar or half a dinar at the choice of the husband, on a report from Ibn 'Abbas; the Malikis, al-Thawri, al-Layth and one Ahmad report require only repentance and seeking forgiveness; al-Hasan al-Basri and Sa'id ibn al-Musayyab require the expiation for intercourse in Ramadan. (2) Intercourse while fasting in Ramadan: most scholars require expiation and making up the day, whether or not there is ejaculation, on the report of Abu Hurayra of the man who had intercourse with his wife in Ramadan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17522}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17523}\n\nIntercourse during the pilgrimage: the jurists agree that a pilgrim who has intercourse before standing at 'Arafat invalidates his hajj and must give a sacrifice; the Hanafis require a sheep and the Shafi'is, Malikis and Hanbalis a camel. Intercourse after standing and before the first release requires a camel by agreement; after the first release the Hanafis, Shafi'is and Hanbalis require a sheep and Malik a camel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17524}\n\nIntercourse and the fast: the jurists agree that intercourse by one who fasts in Ramadan invalidates the fast, whether or not he ejaculates. If it was forgotten, the majority of Hanafis, Shafi'is, one Ahmad report, al-Thawri, al-Hasan and Mujahid hold the fast is not invalidated; the Malikis, the school view of the Hanbalis and Ata' hold it is invalidated like an intentional act. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17524}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17525}\n\nIntercourse and the pilgrimage: the jurists agree that intercourse before standing at 'Arafat invalidates the pilgrimage, which must be completed as an invalid one and made up later, and that it does not invalidate it after standing and the first release. Between standing and the first release, the Shafi'is, Malikis and Hanbalis hold it invalidates the pilgrimage, while the Hanafis say it does not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17525}\n\nTreading on the mushaf: there is no dispute that a Muslim who treads on it to show contempt becomes an apostate; under compulsion or necessity he does not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17525}\n\nTreading on graves: the grave is to be respected, so treading on it or sitting on it is disliked, according to the majority, on the report of 'Uqba ibn 'Amir and the words attributed to Ibn Mas'ud. The Shafi'is and Hanbalis dislike it except out of necessity; walking among graves is not disliked for the Shafi'is, while the Hanbalis dislike it in shoes but not in boots. The Hanafis dislike sitting on it except out of necessity. The Malikis dislike it under conditions: the grave is raised, the path is beside it, and some of the bones are presumed to remain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17525}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17526}\n\nAnimals treading with a foot: the Hanafis, Malikis, Shafi'is and Hanbalis agree that what an animal tramples with its hoof, head or foot in its course is a liability for whoever is with it, rider, leader or driver, when the damage can be attributed to his fault or negligence; if not, there is no liability, on the saying 'the animal's wound is unpunished'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17526}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17527} Al-Shafi'i holds the leader, driver and rider liable for what it strikes with hand, mouth, foot or tail, and that the one who makes it trample something is the one liable; al-Nawawi notes that a skittish animal may not be ridden in markets. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17527}"
  es: "Wat', léxicamente, es estar de pie sobre una cosa; también se usa para coito, la inserción de un miembro masculino en el órgano sexual de una mujer hasta que los dos son como uno. El sentido técnico no se aparta del léxico. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17482}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17483} Palabras relacionadas: nikah, cuya raíz es unir y reunir, se usa en sentido estricto para el contrato matrimonial y en sentido figurado para coito, o viceversa, como difieren los lexicógrafos y juristas; liwat es coito con hombres, que cae dentro del wat' más amplio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17483} Primero, wat' como coito. Es lícito o ilícito. Lo lícito es el coito con una esposa o una concubina, que puede estar prohibido en ocasiones, como durante la menstruación o el sangrado posparto, antes de que se expíe un zihar, en ihram, durante el ayuno o en i'tikaf. Lo prohibido es de un tipo que podría ser lícito en otro caso, como el coito con una mujer que puede estar casada con uno, que conlleva la pena de zina, o de un tipo que nunca puede ser lícito, como la sodomía, el coito anal con una esposa o una no esposa, y la bestialidad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17483}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17484} Las causas que hacen lícito el coito son el contrato matrimonial y la propiedad de la mano derecha. La propiedad de una esclava es lícita sin contrato, porque la propiedad de la persona conlleva el uso. El Corán alude a esto en la sura de al-Mu'minun (citada solo por sura) sin que se cite aquí ningún versículo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17484} El dictamen: la mayoría de los juristas sostiene que las relaciones sexuales con una esposa o concubina están permitidas en principio, siendo un placer que la disposición natural exige, sin obediencia ni desobediencia en sí mismas. Se recomienda con una buena intención, como mantenerse casto de lo ilícito, puede volverse obligatorio cuando es el único medio de castidad para uno mismo o para su hogar, y puede estar prohibido o ser desaconsejado según las circunstancias. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17484}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17485} Ibn al-Qayyim enumera los propósitos del coito: preservar la descendencia, liberar el agua que daña el cuerpo si se retiene, y la satisfacción del deseo y el placer; sus beneficios incluyen bajar la mirada, controlar el yo y asegurar la castidad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17485}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17486} La recompensa por el coito lícito: se cita el informe de Abu Dharr que dice que 'en la intimidad de uno de vosotros hay caridad'; La mayoría sostiene que un hombre es recompensado por el coito con su esposa cuando va acompañado de una buena intención, como mantenerse a sí mismo o a su esposa alejados de lo ilícito, cumplir con su derecho a una compañía adecuada o buscar un hijo justo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17486} Cuando el hombre no pretende más que la satisfacción de su deseo, los juristas difieren: Ibn Qutayba sostiene que es recompensado en todos los casos, mientras que Ibn Hajar al-Haytami y otros dicen que no hay recompensa donde no existe tal intención. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17486} El coito y sus recompensas: un musulmán es recompensado por lo que gasta en su hogar si busca la recompensa de Dios en ello; si esto es así para el gasto obligatorio, lo es aún más para el coito lícito, como afirma el libro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17487} Las cortesías y actos recomendados de coito: se recomienda comenzar con la basmala; apartarse de la qibla por respeto a ella; comenzar con juegos, abrazos y besos, para que el deseo de la mujer aumente; tener cuidado de alcanzar la satisfacción de ambos juntos; cubrirse con una tela; bajar la voz y hablar poco. Es desaconsejable que un hombre tenga coito donde pueda ser visto o sus sonidos escuchados, y está prohibido cuando las partes íntimas están expuestas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17487}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17488} Se recomienda para quien desee repetir el coito lavar su parte íntima y realizar el wudu', y el ghusl es mejor; El libro cita el informe de que el Profeta rodeó a sus esposas con un solo ghusl. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17488}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17489} Hablar sobre el coito y revelar sus secretos: los juristas difieren. Los hanafíes, una visión hanbalí que al-Mardawi prefiere, y al-Nawawi sostienen que jactarse del coito y revelar lo que pasa entre los cónyuges está prohibido, en el informe de Abu Sa'id sobre el peor de los hombres en rango ante Dios y el dicho de que difundir (tal conversación) está prohibido. Ibn al-Qayyim, al-Haytami y otros lo cuentan entre los pecados mayores. La visión de la escuela de los hanbalíes es que los cónyuges hablan de lo que pasa entre ellos es desaconsejable, incluso a una coesposa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17489}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17490} Impedimentos para el coito lícito: hay nueve. Los juristas concuerdan en seis de ellos, a saber, la menstruación, el sangrado posparto, el i'tikaf, el ayuno, el ihram y el zihar antes de su expiación; difieren en tres, a saber, la istihada, la falta de lavado después del final de la menstruación y la residencia en la morada de guerra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17490} Primero, la menstruación: los juristas concuerdan en que el coito con una mujer menstruante en la vagina está prohibido, en el versículo de la sura al-Baqara (citado solo por la sura) y el dicho de que uno puede hacer todo excepto el coito. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17491} Segundo, sangrado posparto: los juristas coinciden en que el coito en la vagina está prohibido, y que sus reglas, incluyendo el lavado y la expiación, son las de la menstruación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17491} Tercero, istihada: los juristas difieren en si el coito con una mujer con sangrado irregular está permitido. La mayoría de los hanafíes, shafi'ís y malikíes, y un informe hanbalí, lo permiten, una opinión reportada por Ibn al-Mundhir de Ibn 'Abbas, Sa'id ibn al-Musayyab, al-Hasan, Ata y otros, citando que ella está pura de menstruación y el caso de Hamna bint Jahsh, cuyo esposo Talha tuvo coito con ella mientras sangraba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17491} Istihada, la segunda opinión, que sostienen algunos juristas: el coito con una mujer con sangrado irregular está prohibido, porque la sangre es sangre menstrual, y la causa de la prohibición, la menstruación, está presente en ella, por lo que la prohibición se aplica a ella. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17492} Cuarto, i'tikaf. Los juristas concuerdan en que el coito durante el i'tikaf está prohibido y lo invalida, de noche o de día, si es intencional, en el versículo de la sura al-Baqara sobre el i'tikaf en la mezquita (el detalle bajo i'tikaf). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17492} Quinto, el ayuno. Los juristas coinciden en que el coito intencional por parte de una persona que ayuna en Ramadán está prohibido, invalida el ayuno y requiere expiación, haya o no eyaculación, según el relato de Abu Hurayra sobre el hombre que tuvo coito con su esposa mientras ayunaba en Ramadán y recibió dátiles para dar en caridad, que el libro cita. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17492}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493} Sexto, ihram. Los juristas coinciden en que el coito por parte de un peregrino en el hajj o la umra está prohibido, según el versículo de la sura al-Baqara, en el que 'rafath' se explica como coito y la conversación que lo acompaña. Un coito antes de estar en 'Arafat invalida la peregrinación, mientras que después de la primera liberación no; las opiniones difieren sobre el período entre estar en 'Arafat y la primera liberación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493} Séptimo, zihar. No hay disputa de que el coito con una mujer sobre la cual se ha pronunciado el zihar está prohibido antes de la expiación, en el versículo de la sura al-Mujadila y el informe de Ibn 'Abbas del hombre que tuvo coito antes de expiar, a quien el Profeta le dijo que pidiera perdón y que no lo repitiera hasta que hubiera expiado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493} Octavo, el coito de un musulmán con su esposa en la morada de guerra. La mayoría de los hanafíes, malikíes y shafiíes lo consideran desaconsejable, temiendo la descendencia allí, ya que al musulmán le está prohibido establecerse en la morada de guerra, citando el dicho del Profeta de que está libre de todo musulmán que vive entre los politeístas, que al-Bujari juzgó como un informe mursal. Los hanbalíes sostienen que un musulmán no puede tener relaciones sexuales con su esposa en la morada de guerra excepto por necesidad, y que cuando surge la necesidad debe practicar la retirada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494} (b) Relaciones sexuales prohibidas: sus tipos son adulterio, sodomía, relaciones sexuales con una esposa o una no esposa en el ano, con una mujer muerta y con un animal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494} Primero, el adulterio está prohibido por consenso de los juristas y es uno de los pecados mayores más graves, en el versículo de la sura al-Isra citado por sura y número. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494} Segundo, la sodomía: los juristas concuerdan en que está prohibida con la mayor severidad y es un pecado mayor; al-Mawardi la llama la más grave de las abominaciones y señala que nadie en los mundos la hizo antes del pueblo de Lot. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494} La pena por sodomía: los juristas dan seis puntos de vista, de los cuales el libro expone los primeros cuatro. La primera, sostenida por las escuelas Shafi'i y Hanbali, por Abu Yusuf, Muhammad, al-Thawri, al-Awza'i y Abu Thawr, es que la pena por sodomía es la del adulterio: un infractor casado es apedreado y un soltero es azotado; citan un informe de Abu Musa que dice que cuando un hombre se une a otro hombre, ambos son adúlteros, lo que al-Bayhaqi llama una cadena rechazada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17495} La segunda, sostenida por Abu Hanifa, Hammad ibn Abi Sulayman y al-Hakam, es que no hay hadd sino castigo discrecional y prisión hasta la muerte o el arrepentimiento, y que un reincidente es asesinado por el gobernante en una segunda ofensa, casado o no, como política; La razón dada es que el acto no es nombre de adulterio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17495} La tercera, sostenida por los Malikis, es que la pena es lapidación en todos los casos, para el cónyuge activo y pasivo, casado o no, citando la redacción general del hadiz sobre matar a ambos cónyuges. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17495}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17496} La cuarta, sostenida por al-Shafi'i en una opinión y por Ishaq ibn Rahawayh, es que el ofensor es asesinado por la espada como un apóstata, casado o no, una opinión atribuida por el libro a varios Compañeros y Sucesores. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17496} Las opiniones quinta y sexta aún no se leen en este punto del escaneo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17496} Relaciones sexuales con una esposa o una esclava en el ano: el libro informa esta opinión de varios Compañeros y Sucesores; al-Mawardi dice que es la posición de los Compañeros, la mayoría de los Sucesores y juristas. Varios juristas, Ibn al-Nahhas, al-Haytami e Ibn al-Qayyim entre ellos, afirman que está entre los pecados mayores. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17497} Los juristas sostienen que no hay hadd para ello, porque una esposa o esclava es en cierto sentido un lugar de disfrute, lo que crea una duda que evita el hadd; La mayoría sostiene que el castigo discrecional (ta'zir) es procedente, como afirman los Hanafi, Maliki y Hanbali, y los Shafi'i sostienen que es procedente si se repite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17497} Los juristas citan hadices sobre el tema, referenciados en las notas del libro, el razonamiento de que el ano no es un lugar hecho para el coito, que es un daño constante y que niega a la esposa su derecho al disfrute. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17498}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17499} Las opiniones que el libro atribuye a Ibn 'Umar en un relato, Zayd ibn Aslam, Nafi' en otro relato, algunos Shafi'i y Malik en una opinión, lo permiten. Los eruditos respondieron que la palabra del versículo 'anna' significa 'de dónde', que la explicación de Muhammad ibn Ka'b al-Qurazi es rechazada, y que los informes de Ibn 'Umar, Nafi' y Malik que niegan el permiso son los más sólidos; el libro registra las opiniones sin agregar su propio dictamen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17499}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17501} Cuarto, el coito con una no esposa en el ano: no hay disputa de que está prohibido y es un pecado grave. Hay cuatro opiniones sobre su castigo: la primera, de los Malikis, Hanbalis, Shafi'is en la opinión de la escuela y los dos compañeros de Abu Hanifa, es el hadd para el adulterio; la segunda, de Abu Hanifa y una opinión Shafi'i, es que no hay hadd sino castigo discrecional; El tercero, del juez malikí Abu al-Hasan, lo equipara con la sodomía, e Ibn 'Aqil dice que se aplica el hadd de la sodomía; el cuarto, de algunos shafi'ís, es la muerte por espada como hadd. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17501}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17502} Quinto, el coito con una mujer muerta: no hay disputa de que está prohibido, y al-Haytami lo cuenta entre los pecados mayores. Hay dos puntos de vista sobre la pena: el primero, de los hanafíes, el punto de vista shafi'í más sólido y el punto de vista preferido hanbalí, que no hay hadd y solo castigo discrecional; El segundo, de los Malikis en la opinión más conocida, los Shafi'is en una opinión contraria a la más sólida, algunos Hanbalis y al-Awza'i, que el hadd se aplica. Los Malikis eximen del hadd a un marido que tiene relaciones sexuales con su esposa muerta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17502} Sexto, relaciones sexuales con un animal: los juristas concuerdan en que está prohibido, citando la redacción general del versículo de la sura al-Mu'minun y el hadiz de Abu Hurayra sobre quien tiene relaciones sexuales con un animal; varios de los hadices que cita el libro se consideran débiles en sus cadenas en las notas. Varios juristas lo cuentan entre los pecados mayores. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17503} Los juristas difieren en la pena por ello en cuatro opiniones; La primera, sostenida por Jabir ibn Zayd, al-Hasan ibn Ali, al-Hasan al-Basri, al-Shafi'i y una opinión de Ahmad, se enumera aquí, y la lista continúa más allá de la p.17503. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17503} La pena por tener relaciones sexuales con un animal, las opiniones restantes: la tercera es la de al-Zuhri, quien sostiene que se aplica la menor de las dos penas hadd, cien latigazos, ya sea casado o no. La cuarta, sostenida por la mayoría de los Hanafi, los Shafi'i en la opinión más probable, los Malikis y la escuela Hanbali, es que no se aplica hadd y se debe un castigo discrecional; esto se informa de Ibn 'Abbas, 'Ata', al-Sha'bi, al-Nakha'i, al-Hakam, al-Thawri e Ishaq. Los hanafíes dicen que el gobernante puede matar al delincuente que lo repita, al-Bayri juzga que una segunda ofensa justifica la muerte, y los hanbalíes presionan con firmeza el castigo discrecional. La mayoría argumenta que el acto es incorrecto, que debe ser corregido por la mano, y que ningún informe establece un hadd. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17504} Una mujer que deja que un animal como un perro o un mono se le acerque es tratada como si tuviera relaciones sexuales con un animal, según los hanafíes, shafi'ís, malikíes y hanbalíes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17504} Matar al animal usado: tres puntos de vista. Los hanafíes, los malikíes y el punto de vista shafi'í más sólido no lo requieren, porque el hadiz que ordena su muerte es débil y porque el Profeta prohibió matar animales excepto para alimento. Los hanafíes recomiendan sacrificarlo y quemarlo si no se consume. Los hanbalíes y la escuela shafi'í exigen matarlo en todos los casos, citando el hadiz: «Quien tenga relaciones sexuales con un animal, mátalo y mata también al animal». Una tercera opinión lo mata solo cuando el ofensor es el dueño; el libro atribuye esto a al-Tahawi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17504}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17505} Si el animal pertenece a otro, los juristas difieren en la responsabilidad: la opinión hanbalí y la shafi'í que requiere matar responsabilizan al ofensor, mientras que los hanafíes dicen que se le pide al dueño que lo entregue por su valor y luego se sacrifica. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17505} Comer un animal usado de esta manera después del sacrificio: tres opiniones. La opinión de la escuela hanbalí y los dos compañeros de Abu Hanifa, con una opinión shafi'í, lo prohíben; un informe de Ahmad lo desaprueba sin prohibirlo; Abu Hanifa, los Malikis y la escuela Shafi'i lo permiten sin desaprobación, citando el versículo de la sura al-Ma'ida que permite el pastoreo de animales. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17506} Relaciones sexuales por error (wat' bi-shubha): el acto está prohibido pero no trae el hadd, porque una duda elimina la intención de cometer adulterio; los tipos de duda se tratan bajo su propio epígrafe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17506} Reglas de las relaciones sexuales. El derecho de la esposa sobre su marido: ella tiene derecho a que él tenga relaciones sexuales con ella y satisfaga su deseo, como muestra el informe de Abd Allah ibn Amr: 'tu cuerpo tiene derecho sobre ti, y tu esposa tiene derecho sobre ti', y el dicho a Abu al-Darda'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17506}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17507} Los juristas dan cuatro puntos de vista sobre el alcance y el deber de este derecho. Los hanafíes y una postura shafi'í sostienen que la esposa puede pedir relaciones sexuales, y que el marido debe acceder una vez por juicio, mientras que más se debe ante Dios como cuestión de buena compañía; los shafi'íes no consideran que no haya deber ni pecado en dejarlo, aunque se recomienda no dejar a una esposa sin relaciones sexuales por protección para ella. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17507} Los puntos de vista restantes no están completos en estas páginas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17507} Medida del derecho de la esposa a tener relaciones sexuales (las opiniones restantes): los malikíes, en la opinión más probable, sostienen que una esposa debe tener relaciones sexuales una noche de cada cuatro; Abu al-Hasan al-Saghir informa de Abu Imran opiniones sobre el mínimo que puede exigirse, una noche de cada cuatro, o una noche de cada tres, y 'Umar decidió una vez en cada pureza porque el esposo la embaraza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17508} La cuarta opinión, de la escuela hanbalí, es que el esposo debe tener relaciones sexuales con su esposa al menos una vez cada cuatro meses si no tiene excusa; argumentan que las relaciones sexuales son un derecho de ambos cónyuges, y que se necesita el consentimiento de la esposa para la retirada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17508} Ibn Taymiyya e Ibn al-Qayyim sostienen que las relaciones sexuales deben estar de acuerdo con la costumbre, en proporción a la necesidad de la esposa y la capacidad del esposo, sin un número fijo; el libro señala que algunos sostienen que él debe satisfacerla como debe alimentarla, lo cual Ibn Taymiyya prefería. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17508}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17509} Si los cónyuges disputan el derecho, el juez lo establece según la costumbre y sus circunstancias; Ibn Taymiyya sostiene que el daño a la esposa por su retención permite la disolución en todos los casos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17509} El derecho del marido sobre su esposa: el marido puede pedirle a su esposa tener relaciones sexuales cuando lo desee, excepto cuando exista un impedimento lícito, como la menstruación, el sangrado posparto, el zihar o el ihram; cuando no existe el impedimento, ella debe acceder. Los juristas al-Dhahabi, al-Rafi'i, al-Nawawi, Ibn al-Rif'a y al-Haytami consideran la negativa de una esposa sin excusa como una forma de desobediencia y un pecado grave, citando las fuertes advertencias en el hadiz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17509}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510} El marido no tiene que acceder cuando su mujer se lo pide, a menos que tenga la intención de hacerle daño, en cuyo caso está prohibido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510} El derecho de la mujer a la separación cuando el marido es incapaz de tener relaciones sexuales (impotencia, castración o incapacidad sexual): los juristas distinguen la incapacidad que existe al momento del contrato de la incapacidad que surge después de la consumación, y a una mujer que conocía el defecto de una que no lo conocía. El detalle se encuentra en el divorcio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510} El derecho del marido a anular el matrimonio cuando la esposa tiene un defecto que impide el coito (como un conducto obstruido o un crecimiento en forma de cuerno): los juristas difieren en dos puntos de vista; detalles bajo su encabezado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510} Retención del coito por juramento (iyla) o por zihar. Iyla: no hay disputa de que el marido que jura no tener coito tiene cuatro meses, el período establecido en la sura al-Baqara. Si persiste hasta que pasen cuatro meses, la esposa puede llevar el asunto al juez, quien le ordena regresar, luego divorciarse; si se niega, el juez se divorcia en su nombre, la opinión de la mayoría de los shafi'is, malikíes y hanbalíes; Los hanafíes dicen que el divorcio se hace efectivo al cabo de cuatro meses sin la intervención del juez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17511} Zihar: la mayoría sostiene que se puede tener relaciones sexuales con una esposa sobre la cual se ha declarado prohibido el zihar antes de la expiación; un informe hanbalí lo permite cuando la expiación es mediante la alimentación; los detalles están en zihar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17511} Zihar, continuación: la esposa puede llevar el asunto al juez si el esposo se niega a la expiación; el juez le ordena que expíe, y si se niega, lo obliga por medios disciplinarios hasta que expíe o se divorcie; esta es la opinión hanafí, ya que el esposo la ha perjudicado al hacerla ilícita para él. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17512} Los malikíes distinguen a un marido incapaz de expiar, que es divorciado por el juez, de uno capaz de hacerlo, a quien se le conceden cuatro meses como en iyla, después de los cuales se le dice que se divorcie o expíe. Los hanbalíes dicen que a un marido zihar no se le ordena reanudar el coito, ya que está prohibido antes de la expiación, y se le da tiempo para liberar a un esclavo, alimentar a los pobres o ayunar, según sus posibilidades. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17512} El derecho de la esposa a retenerse hasta que reciba su dote: los juristas concuerdan en que una vez que el marido ha entregado la dote, ella debe permitirle el acceso cuando él lo pida, sin ningún impedimento legal; Ella no puede negarse si la dote completa se difiere, o si la parte diferida es la mayor, porque su aceptación de la diferimiento es la aceptación de entregarse a sí misma. Los Hanafis limitan esto a una condición de que el coito ocurra antes del término, al cual ella estuvo de acuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17513} Para una dote inmediata, la mayoría de los Hanafis, Shafi'is, Malikis y Hanbalis sostienen que ella puede retenerse hasta que reciba la porción inmediata, ya que la dote es una retribución por el vientre como el precio lo es por los bienes; Ibn al-Mundhir informa consenso sobre esto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17513} El efecto del coito en el derecho a retener después de que ella haya permitido el acceso: dos puntos de vista. La primera, de Abu Hanifa e Ibn Hamid entre los Hanbalis, es que ella puede retener hasta que se le pague, ya que el contrato cubre cada acto de coito; la segunda, de Abu Yusuf, Muhammad, los Shafi'is, Malikis y la escuela Hanbali, es que no puede, porque su entrega fue consentimiento para que la dote siguiera siendo una deuda. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17513}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17514} Cuando la dote diferida vence antes de que la esposa se entregue: dos puntos de vista. El primero, de la opinión Hanafi preferida, la opinión Shafi'i más sólida y los Hanbalis, es que ella no puede retener, ya que el derecho de retención se extinguió por su consentimiento al aplazamiento. La segunda, de una visión shafi'í, los malikíes y Abu Yusuf, es que ella puede retener, ya que ahora es como una dote inmediata; Abu Yusuf limita esto a los casos en los que el marido no estipuló el coito antes del plazo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17514}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17515} La disputa sobre quién inicia la entrega: los hanafíes y los malikíes sostienen que el marido debe entregar primero, ya que el derecho del marido está fijado por el contrato, mientras que el derecho de la esposa a la dote está fijado al recibirla; Malik desaprobaba que la esposa permitiera el acceso antes de recibir un cuarto de dinar, como un derecho de Dios. Los hanbalíes y una visión shafi'í obligan primero al marido, luego a la esposa. La opinión preferida de Shafi'i obliga a ambas partes, mediante el depósito de la dote con un fideicomisario que no es agente de ninguna de ellas. Una tercera opinión de Shafi'i no obliga a ninguna, ya que los derechos son iguales. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17515} Estipular en el contrato matrimonial que las relaciones sexuales no serán lícitas, o que no ocurrirán: todos coinciden en que la estipulación es nula, pero difieren en su efecto sobre el contrato. La mayoría de los shafi'is, malikíes y hanbalíes consideran nulos tanto la estipulación como el contrato, porque frustra el propósito del contrato. Los hanafíes consideran inválida la estipulación pero válido el contrato, ya que un matrimonio no se anula por una condición inválida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17516} Respecto a la estipulación de que no habrá coito, existen tres puntos de vista: los hanafíes y hanbalíes consideran válido el contrato y nula la condición; los malikíes consideran nulos ambos, y entre ellos la opinión preferida permite la anulación antes de la consumación y no después, con la condición desapareciendo; los shafiíes consideran nulo el contrato si la condición provino de la esposa, pero inofensivo si provino del esposo, ya que el coito es su derecho. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17516}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17517} Retiro (azl), que significa retirarse antes de la eyaculación en el útero: la mayoría lo permite para un amo con su esclava, con o sin su consentimiento, siendo el consenso reportado por al-Qarafi; Las opiniones sobre la retirada de una esposa libre se detallan bajo su propio encabezado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17517} Relaciones sexuales con una mujer embarazada: todos coinciden en que está permitido, en el relato de Judhama bint Wahb en el que el Profeta pretendía prohibirlo, pero luego mencionó que Roma y Persia lo hacían sin dañar a sus hijos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17517} Relaciones sexuales con una mujer embarazada: algunos juristas lo desaprobaban, citando el dicho 'no mates a tus hijos en secreto'; la mayoría lo permite, citando el relato del hombre que preguntó al Profeta sobre la retirada y se le dijo que si era necesario no había daño, ya que no causó daño a Persia y Roma. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17517}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17518} Los efectos del coito: (a) confirma la dote completa nombrada, según los Hanafis, Shafi'is, Malikis y Hanbalis, puesto que el coito es el cumplimiento del propósito; (b) establece el período de espera después del divorcio, por el versículo de la sura al-Ahzab; (c) es el acto que hace nulo un juramento de iyla; (d) en un matrimonio válido, el coito del tipo que requiere ghusl es una condición de ihsan para el adulterio; (e) restablece un divorcio revocable, en el punto de vista de los Hanafis, Hanbalis y Malikis, si el marido tiene la intención de volver con la mujer, en contra de los Shafi'is; (f) su efecto en la permisibilidad del divorcio, una división detallada en divorcio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17518}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17519} El efecto del coito en el divorcio, continuación: un divorcio lícito se pronuncia sobre una esposa en estado de pureza sin coito durante esa pureza, o cuando está embarazada y su embarazo es evidente. Un divorcio ilícito es aquel pronunciado durante la menstruación, o en la pureza en que tuvo lugar el coito; para una esposa que aún no ha consumado el matrimonio, el divorcio durante la menstruación o pureza es lícito. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17520} Sobre si un divorcio bid'a tiene efecto: la mayoría de los hanafíes, shafi'ís, malikíes y hanbalíes sostienen que sí tiene efecto y que el marido es pecador, citando el divorcio de Ibn 'Umar de su esposa durante la menstruación, después del cual el Profeta le ordenó que la volviera a tomar. Ibn Taymiyya, Ibn al-Qayyim, Ibn Hazm y al-Shawkani, y una opinión atribuida a Ibn 'Umar y Tawus, sostienen que no tiene efecto, porque contradice el mandato del Profeta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17520}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17521} El efecto del coito en el hadd para el adulterio: el coito que desencadena el hadd es la inserción de al menos la cabeza del miembro de un hombre adulto y cuerdo en una vagina deseable que no es propiedad del hombre ni está sujeta a duda en la tierra del Islam; detalle en adulterio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17521} El efecto del coito en el ghusl: el encuentro de las dos partes circuncidadas (la cabeza pasando a la vagina) requiere ghusl para el hombre y la mujer, según el relato de Aisha, y el relato de Abu Hurayra añade \"incluso si no eyacula\". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17521} El efecto del coito en una mujer divorciada tres veces: puede que no sea lícita con su primer marido hasta que se case con otro, según el versículo de la sura al-Baqara; la mayoría sostiene que no es lícita con el primero hasta que el segundo marido tenga coito con ella, con la unión de las partes circuncidadas, incluso sin eyaculación; Sa'id ibn al-Musayyab sostiene que el primero puede volver a casarse con ella si el segundo matrimonio es válido y no tiene la intención de hacerla lícita. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17521}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17522} El efecto del coito en la afinidad matrimonial: no hay disputa de que el contrato con una hija hace que su madre, por muy alta que sea, sea ilícita para siempre, solo por el contrato, haya o no tenido lugar el coito, y lo mismo ocurre con las esposas de los hijos y los padres. Una hijastra está prohibida por dos condiciones, el contrato con su madre y el coito con la madre; sin coito, la prohibición no se mantiene. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17522} El efecto del coito en las expiaciones: (1) coito con una esposa menstruante. Cuatro puntos de vista: los Hanafis y el punto de vista Shafi'i más sólido no requieren expiación, solo una limosna recomendada de un dinar o medio dinar; Los hanbalíes y una visión shafi'í requieren un dinar o medio dinar a elección del marido, en un informe de Ibn 'Abbas; los malikíes, al-Thawri, al-Layth y un informe de Ahmad requieren solo arrepentimiento y búsqueda de perdón; al-Hasan al-Basri y Sa'id ibn al-Musayyab requieren la expiación por el coito en Ramadán. (2) Coito mientras se ayuna en Ramadán: la mayoría de los eruditos requieren expiación y recuperación del día, haya o no eyaculación, en el informe de Abu Hurayra del hombre que tuvo coito con su esposa en Ramadán. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17522}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17523} Relaciones sexuales durante la peregrinación: los juristas coinciden en que un peregrino que tiene relaciones sexuales antes de estar de pie en 'Arafat invalida su hajj y debe ofrecer un sacrificio; los hanafíes requieren una oveja y los shafi'ís, malikíes y hanbalíes un camello. Las relaciones sexuales después de estar de pie y antes de la primera eyaculación requieren un camello por acuerdo; después de la primera eyaculación los hanafíes, shafi'ís y hanbalíes requieren una oveja y los malikíes un camello. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17524} Relaciones sexuales y el ayuno: los juristas coinciden en que las relaciones sexuales de quien ayuna en Ramadán invalidan el ayuno, independientemente de si eyacula o no. Si se olvidó, la mayoría de los hanafíes, shafi'ís, un informe de Ahmad, al-Thawri, al-Hasan y Mujahid sostienen que el ayuno no se invalida; los malikíes, la visión de la escuela de los hanbalíes y Ata' sostienen que se invalida como un acto intencional. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17524}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17525} Relaciones sexuales y la peregrinación: los juristas concuerdan en que las relaciones sexuales antes de estar de pie en Arafat invalidan la peregrinación, que debe completarse como inválida y recuperarse después, y que no la invalidan después de estar de pie y la primera liberación. Entre estar de pie y la primera liberación, los shafi'ís, malikíes y hanbalíes sostienen que invalida la peregrinación, mientras que los hanafíes dicen que no. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17525} Pisar el mushaf: no hay disputa de que un musulmán que lo pisa para mostrar desprecio se convierte en apóstata; bajo coacción o necesidad no lo es. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17525} Pisar tumbas: la tumba debe ser respetada, por lo que pisarla o sentarse en ella es desaconsejable, según la mayoría, en el informe de 'Uqba ibn 'Amir y las palabras atribuidas a Ibn Mas'ud. Los shafi'ís y los hanbalíes lo desaconsejan excepto por necesidad; caminar entre tumbas no es desaconsejable para los shafi'ís, mientras que los hanbalíes lo desaconsejan con zapatos pero no con botas. Los hanafíes no les gusta sentarse en ella excepto por necesidad. Los malikíes no les gusta bajo ciertas condiciones: la tumba está elevada, el camino está junto a ella y se presume que algunos de los huesos permanecen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17525}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17526} Animales que pisan con un pie: los hanafíes, malikíes, shafi'ís y hanbalíes están de acuerdo en que lo que un animal pisotea con su pezuña, cabeza o pie en su carrera es una responsabilidad para quien esté con él, jinete, guía o conductor, cuando el daño puede atribuirse a su culpa o negligencia; de lo contrario, no hay responsabilidad, según el dicho 'la herida del animal no es castigada'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17526}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17527} Al-Shafi'i considera responsables al líder, al conductor y al jinete por lo que el animal golpea con la mano, la boca, el pie o la cola, y que quien lo hace pisotear algo es el responsable; al-Nawawi señala que no se puede montar un animal asustadizo en los mercados. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17527}"
  fr: "Le terme « wat », au sens littéral, signifie se tenir au-dessus de quelque chose; il désigne également l’acte sexuel, c’est-à-dire la pénétration d’un membre masculin dans l’organe sexuel féminin jusqu’à la fusion des deux êtres. Le sens technique est identique au sens lexical. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17482}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17483} Mots apparentés: « nikah », dont la racine signifie « union » et « rassemblement », est employé au sens strict pour désigner le contrat de mariage et au sens figuré pour désigner l’acte sexuel, ou inversement, selon les lexicographes et les juristes; « liwat » désigne l’acte sexuel avec un homme, qui relève du terme plus large « wat ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17483} Premièrement, « wat » désigne l’acte sexuel. Il est soit licite, soit illicite. Les relations sexuelles licites avec une épouse ou une concubine peuvent être interdites dans certains cas, notamment pendant les menstruations ou les saignements post-partum, avant l'expiation d'un zihar, en état d'ihram, pendant le jeûne ou en i'tikaf. Sont interdits soit les relations sexuelles qui pourraient être licites dans d'autres circonstances, comme les relations sexuelles avec une femme mariée à un époux (ce qui est passible de la peine de zina), soit les relations sexuelles qui ne peuvent jamais être licites, comme la sodomie, les rapports anaux avec une épouse ou une femme autre que l'épouse, et la bestialité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17483}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17484} Les conditions qui rendent les relations sexuelles licites sont le contrat de mariage et la possession de la main droite. La possession d'une esclave est licite sans contrat, car la possession de la personne implique son usage. Le Coran y fait allusion dans la sourate Al-Mu'minun (citée ici par son nom uniquement), sans qu'aucun verset ne soit cité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17484} L'avis majoritaire des juristes est que les relations sexuelles avec une épouse ou une concubine sont en principe permises, car elles relèvent d'un plaisir naturel et ne constituent ni une obéissance ni une désobéissance en soi. Elles sont recommandées lorsqu'elles sont motivées par une bonne intention, comme celle de préserver la chasteté, peuvent devenir obligatoires lorsqu'elles sont le seul moyen d'y parvenir pour soi-même ou sa famille, et peuvent être interdites ou déconseillées selon les circonstances. Ibn al-Qayyim énumère les objectifs des rapports sexuels: la préservation de la descendance, l’évacuation des eaux nocives pour le corps et la satisfaction des désirs et du plaisir; parmi ses bienfaits figurent la pudeur, la maîtrise de soi et la chasteté. Concernant la récompense des rapports sexuels licites: le hadith d’Abu Dharr, « dans l’intimité de l’un d’entre vous réside une aumône », est cité. La majorité des juristes estiment qu'un homme est récompensé pour ses rapports sexuels avec son épouse lorsqu'ils sont accompagnés d'une bonne intention, comme celle de se préserver, lui ou son épouse, de l'illicite, de lui offrir une vie conjugale saine ou de désirer un enfant pieux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17486} Lorsque l'homme n'a d'autre intention que de satisfaire son désir, les avis divergent: Ibn Qutayba considère qu'il est récompensé dans tous les cas, tandis qu'Ibn Hajar al-Haytami et d'autres affirment qu'il n'y a pas de récompense en l'absence d'une telle intention. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17486} Les rapports sexuels et leurs récompenses: un musulman est récompensé pour les dépenses qu'il effectue pour son foyer s'il y recherche la récompense divine; si cela est vrai pour les dépenses obligatoires, cela l'est d'autant plus pour les rapports sexuels licites, comme l'indique le Coran. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17487} Les marques de courtoisie et les actes recommandés lors des rapports sexuels: il est recommandé de commencer par la basmala; de se détourner de la qibla par respect pour elle; de commencer par des jeux, des étreintes et des baisers, afin d’éveiller le désir de la femme; de veiller à la satisfaction des deux partenaires; de se couvrir d’un tissu; de baisser la voix et de parler peu. Il est déconseillé à un homme d’avoir des rapports sexuels là où il peut être vu ou entendu, et interdit lorsque les parties intimes sont exposées. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17487}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17488} Il est recommandé à celui qui souhaite avoir des rapports sexuels à nouveau de se laver les parties intimes et d’accomplir les ablutions (wudu’), et le ghusl est préférable. L'ouvrage cite le récit selon lequel le Prophète faisait le tour de ses épouses avec une seule ablution (ghusl). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17488}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17489} Concernant la divulgation des relations intimes, les juristes divergent. Les hanafites, l'école hanbalite privilégiée par al-Mardawi, et al-Nawawi estiment qu'il est interdit de se vanter de ses rapports sexuels et de révéler ce qui se passe entre époux, se fondant sur le hadith d'Abu Sa'id relatif aux pires personnes auprès de Dieu et sur l'interdiction de répandre de tels propos. Ibn al-Qayyim, al-Haytami et d'autres le considèrent comme un péché majeur. L'école hanbalite, quant à elle, déconseille aux époux de parler de leur intimité, même à une coépouse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17489}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17490} Empêchements des rapports sexuels licites: il y en a neuf. Les juristes s’accordent sur six d’entre eux, à savoir les menstruations, les saignements post-partum, l’i’tikaf, le jeûne, l’ihram et le zihar avant son accomplissement; ils divergent sur trois, à savoir l’istihada, le défaut de purification après la fin des menstruations et le séjour dans une zone de guerre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17490} Premièrement, les menstruations: les juristes s’accordent sur le fait que les rapports sexuels avec une femme menstruée par voie vaginale sont interdits, en se fondant sur le verset de la sourate al-Baqara (cité par la sourate seule) et sur le fait qu’il est permis de tout faire sauf les rapports sexuels. Deuxièmement, les saignements post-partum: les juristes s’accordent à dire que les rapports sexuels vaginaux sont interdits et que leurs règles, notamment la purification et l’expiation, sont celles des menstruations. Troisièmement, l’istihada: les juristes divergent quant à la permission des rapports sexuels avec une femme présentant des saignements irréguliers. La majorité des écoles hanafite, chaféite et malikite, ainsi qu’un hadith hanbalite, les autorisent. Cette opinion, rapportée par Ibn al-Mundhir d’après Ibn 'Abbas, Sa'id ibn al-Musayyab, al-Hasan, Ata et d’autres, s’appuie sur le fait que la femme est pure de ses menstruations et sur le cas de Hamna bint Jahsh, dont le mari, Talha, eut des rapports sexuels avec elle pendant ses saignements. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17491} Istihada, la seconde opinion, partagée par certains juristes: les rapports sexuels avec une femme présentant des menstruations irrégulières sont interdits, car il s’agit de sang menstruel, et la cause de l’interdiction, les menstruations, étant présente chez elle, l’interdiction s’applique. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17492} Quatrièmement, l’i’tikaf. Les juristes s’accordent à dire que les rapports sexuels pendant l’i’tikaf sont interdits et l’invalident, de jour comme de nuit, s’ils sont intentionnels, conformément au verset de la sourate al-Baqara relatif à l’i’tikaf à la mosquée (voir le détail sous « i’tikaf »). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17492} Cinquièmement, le jeûne. Les juristes s'accordent à dire que les rapports sexuels intentionnels d'une personne jeûnant pendant le Ramadan sont interdits, invalident le jeûne et nécessitent une expiation, qu'il y ait éjaculation ou non. Cette affirmation repose sur le récit d'Abou Hourayra concernant l'homme qui eut des rapports sexuels avec sa femme pendant le Ramadan et qui reçut des dattes à donner en aumône, récit cité dans l'ouvrage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17492}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493} Sixièmement, l'ihram. Les juristes s'accordent à dire que les rapports sexuels d'un pèlerin en plein hajj ou omra sont interdits, conformément au verset de la sourate al-Baqara qui explique que « rafath » désigne l'acte sexuel et les paroles qui l'accompagnent. Un rapport sexuel avant de se tenir à Arafat invalide le pèlerinage, tandis qu'après la première délivrance, il ne l'invalide pas. Les avis divergent quant à la période entre le séjour à Arafat et la première libération. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493} Septièmement, le zihar. Il est incontestable que les rapports sexuels avec une femme ayant fait l'objet d'un zihar sont interdits avant l'expiation, conformément au verset de la sourate al-Mujadila et au récit d'Ibn 'Abbas concernant l'homme qui eut des rapports sexuels avant d'avoir expié, et à qui le Prophète conseilla de demander pardon et de ne plus recommencer avant d'avoir expié. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493} Huitièmement, les rapports sexuels d'un musulman avec son épouse en zone de guerre. La majorité des écoles hanafite, malikite et chaféite désapprouvent cette pratique, craignant une descendance sur place, car il est interdit au musulman de s'établir dans une zone de guerre. Elles s'appuient sur un hadith du Prophète selon lequel il est libre de tout musulman vivant parmi les polythéistes, hadith qu'al-Bukhari a qualifié de murasal. Les hanbalites estiment qu'un musulman ne peut avoir de relations sexuelles avec son épouse dans une zone de guerre qu'en cas de nécessité, et que, dans ce cas, il doit pratiquer le retrait. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494} (b) Relations sexuelles interdites: comprennent l'adultère, la sodomie, les rapports anaux avec une épouse ou une femme autre que l'épouse, avec une morte et avec un animal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494} Premièrement, l'adultère est interdit par le consensus des juristes et constitue l'un des péchés majeurs les plus graves, conformément au verset de la sourate al-Isra cité par sourate et numéro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494} Deuxièmement, la sodomie: les juristes s'accordent à dire qu'elle est interdite avec la plus grande sévérité et qu'elle constitue un péché majeur; al-Mawardi la qualifie d'abomination la plus grave et souligne que personne au monde ne l'a pratiquée avant le peuple de Lot. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494} La peine pour la sodomie: les juristes proposent six avis, dont les quatre premiers sont exposés dans cet ouvrage. La première opinion, défendue par les écoles chaféite et hanbalite, et notamment par Abu Yusuf, Muhammad, al-Thawri, al-Awza'i et Abu Thawr, stipule que la peine pour sodomie est la même que celle pour adultère: un homme marié coupable est lapidé et un homme célibataire est flagellé. Ils citent un hadith rapporté par Abu Musa selon lequel, lorsqu'un homme a des relations sexuelles avec un autre homme, les deux sont adultères, hadith qu'al-Bayhaqi qualifie de chaîne de transmission rejetée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17495} La seconde opinion, défendue par Abu Hanifa, Hammad ibn Abi Sulayman et al-Hakam, prévoit l'absence de hadd (peine de châtiment rituel) et la possibilité d'une peine discrétionnaire et d'une peine d'emprisonnement jusqu'à la mort ou le repentir. Le récidiviste, marié ou non, est mis à mort par le souverain lors d'une seconde infraction, conformément à la politique en vigueur. La raison invoquée est que l'acte n'est pas qualifié d'adultère. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17495} La troisième opinion, celle des Malikites, est que la peine est la lapidation dans tous les cas, pour le partenaire actif comme pour le partenaire passif, marié ou non, en se basant sur le texte général du hadith prescrivant la mise à mort des deux partenaires. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17495}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17496} La quatrième opinion, partagée par al-Shafi'i et par Ishaq ibn Rahawayh, est que le coupable est mis à mort par l'épée comme un apostat, marié ou non; cette opinion est attribuée par le Coran à plusieurs Compagnons et Successeurs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17496} Les cinquième et sixième avis ne sont pas encore abordés à ce stade de l'analyse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17496} Rapports anaux avec une épouse ou une esclave: l'ouvrage rapporte cet avis de plusieurs Compagnons et Successeurs; al-Mawardi affirme qu'il s'agit de la position des Compagnons, de la plupart des Successeurs et des juristes. Plusieurs juristes, dont Ibn al-Nahhas, al-Haytami et Ibn al-Qayyim, déclarent qu'il s'agit d'un péché majeur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17497} Les juristes estiment qu'il n'y a pas de hadd pour cet acte, car une épouse ou une esclave est, en un sens, un lieu de jouissance, ce qui crée un doute et permet d'éviter le hadd. La majorité considère qu'une punition discrétionnaire (ta'zir) est due, comme l'affirment les hanafites, les malikites et les hanbalites, tandis que les chaféites estiment qu'elle est due en cas de récidive. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17497} Les juristes citent des hadiths sur le sujet, référencés dans les notes de l'ouvrage, arguant que l'anus n'est pas un lieu fait pour les rapports sexuels, que cela constitue un préjudice constant et que cela prive l'épouse de son droit à la jouissance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17498}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17499} Les avis attribués par l'ouvrage à Ibn 'Umar (dans un hadith), à Zayd ibn Aslam, à Nafi' (dans un autre), à certains chaféites et à Malik (dans un troisième), l'autorisent. Les savants ont répondu que le mot « anna » du verset signifie « d'où », que l'explication de Muhammad ibn Ka'b al-Qurazi est rejetée et que les récits d'Ibn 'Umar, Nafi' et Malik niant la permission sont les plus solides; le livre rapporte ces avis sans ajouter sa propre décision. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17499}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17501} Quatrièmement, les rapports anaux avec une personne autre que son épouse: il est incontestable qu'ils sont interdits et constituent un péché majeur. Il existe quatre avis concernant leur peine: le premier, celui des Malikites, des Hanbalites, des Shafi'ites (dans leur école de pensée) et des deux compagnons d'Abu Hanifa, est la peine prévue pour l'adultère (hadd); La deuxième opinion, celle d'Abu Hanifa et d'une école shafi'ite, est qu'il n'y a pas de hadd mais une peine discrétionnaire; la troisième, celle du juge malikite Abu al-Hasan, l'assimile à la sodomie, et Ibn 'Aqil affirme que le hadd de la sodomie s'applique; la quatrième, celle de certains shafi'ites, est la mort par l'épée comme hadd. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17501}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17502} Cinquièmement, les relations sexuelles avec une femme morte: il est incontestable que c'est interdit, et al-Haytami le compte parmi les péchés majeurs. Il existe deux avis sur la peine: le premier, celui des hanafites, l'avis shafi'ite le plus solide et l'avis hanbalite privilégié, est qu'il n'y a pas de hadd et seulement une peine discrétionnaire; Deuxièmement, selon l'avis le plus répandu des Malikites, les Shafi'ites (dans un avis contraire au plus solide), certains Hanbalites et al-Awza'i, le hadd s'applique. Les Malikites exemptent du hadd le mari qui a des relations sexuelles avec sa femme décédée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17502} Sixièmement, les relations sexuelles avec un animal: les juristes s'accordent à dire qu'elles sont interdites, citant le texte général du verset de la sourate al-Mu'minun et le hadith d'Abu Hurayra concernant celui qui a des relations sexuelles avec un animal; plusieurs des hadiths cités dans l'ouvrage sont jugés faibles dans leurs chaînes de transmission dans les notes. Plusieurs juristes le comptent parmi les péchés majeurs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17503} Les juristes divergent quant à la peine encourue, selon quatre avis; La première opinion, défendue par Jabir ibn Zayd, al-Hasan ibn Ali, al-Hasan al-Basri, al-Shafi'i et un Ahmad, est présentée ici et se poursuit au-delà de la page 17503. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17503} Concernant la peine pour relations sexuelles avec un animal, les autres opinions sont les suivantes: la troisième est celle d'al-Zuhri, qui applique la peine de hadd la plus légère, soit cent coups de fouet, que l'on soit marié ou non. La quatrième opinion, défendue par la majorité des hanafites, les shafi'ites (dans l'avis le plus probable), les malikites et l'école hanbalite, est qu'aucune peine de hadd ne s'applique et qu'une punition discrétionnaire est due; cette opinion est rapportée d'Ibn 'Abbas, 'Ata', al-Sha'bi, al-Nakha'i, al-Hakam, al-Thawri et Ishaq. Les hanafites estiment que le souverain peut tuer le récidiviste, al-Bayri considère qu'une seconde infraction justifie la peine de mort, et les hanbalites appliquent une peine discrétionnaire stricte. La majorité considère l'acte comme répréhensible, susceptible d'être corrigé par la seule autorité compétente, et estime qu'aucun hadith n'établit de peine capitale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17504} Une femme qui laisse un animal, tel qu'un chien ou un singe, s'approcher d'elle est considérée comme ayant eu des relations sexuelles avec un animal, selon les écoles hanafite, chaféite, malikite et hanbalite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17504} Concernant la mise à mort de l'animal, trois avis divergent. Les hanafites, les malikites et l'avis chaféite, plus solide, ne l'exigent pas, car le hadith ordonnant sa mise à mort est faible et parce que le Prophète a interdit de tuer des animaux, sauf pour se nourrir. Les hanafites recommandent d'abattre l'animal et de le brûler s'il n'est pas consommé. Les hanbalites et une opinion chaféite exigent de le tuer systématiquement, citant le hadith: « Quiconque a des relations sexuelles avec un animal, tuez-le et tuez l'animal avec lui. » Une troisième opinion préconise l'abattage uniquement si l'animal appartient au contrevenant; l'ouvrage attribue cette opinion à al-Tahawi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17504}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17505} Si l'animal appartient à autrui, les juristes divergent quant à la responsabilité: les hanbalites et les chaféites, qui exigent l'abattage, tiennent le contrevenant pour responsable, tandis que les hanafites estiment que le propriétaire doit céder l'animal à sa valeur avant de l'abattre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17505} Concernant la consommation d'un animal ainsi abattu: trois avis divergent. L'école hanbalite et les deux compagnons d'Abu Hanifa, ainsi qu'un chaféite, l'interdisent; un hadith rapporté par Ahmad la désapprouve sans l'interdire formellement. L'avis d'Abu Hanifa, des Malikites et des Shafi'ites l'autorise sans désapprobation, citant le verset de la sourate al-Ma'ida qui autorise le pâturage des animaux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17506} Rapport sexuel par erreur (wat' bi-shubha): cet acte est interdit mais n'entraîne pas la peine de hadd, car le doute dissipe l'intention de commettre l'adultère; les différents types de doute sont traités dans une section dédiée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17506} Règles relatives aux rapports sexuels. Droit de l'épouse sur son mari: elle a le droit d'avoir des rapports sexuels avec lui et de satisfaire son désir, comme le montre le hadith d'Abd Allah ibn Amr: « Ton corps a un droit sur toi, et ta femme a un droit sur toi », et le hadith rapporté à Abu al-Darda'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17506}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17507} Les juristes présentent quatre avis concernant l'étendue et le devoir liés à ce droit. Selon l'école hanafite et une école shafi'ite, l'épouse peut demander des rapports sexuels et l'époux doit y accéder une fois, conformément au jugement, tout en reconnaissant un devoir plus grand envers Dieu par égard pour sa femme. Les shafi'ites, quant à eux, n'imposent ni obligation ni péché à s'en abstenir, bien qu'il soit recommandé de ne pas priver son épouse de rapports sexuels par souci de la protéger. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17507} Les autres avis ne sont pas traités en détail dans ces pages. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17507} Mesure du droit de l'épouse aux rapports sexuels (les autres avis): les Malikites, selon l'avis le plus probable, estiment qu'une épouse a droit à un rapport sexuel une nuit sur quatre; Abu al-Hasan al-Saghir rapporte d'après Abu Imran les avis concernant la fréquence minimale applicable, soit une nuit sur quatre ou une nuit sur trois, et 'Umar a décidé d'un rapport sexuel par période de pureté, car le mari la rend enceinte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17508} Le quatrième avis, celui de l'école hanbalite, est que le mari doit avoir des rapports sexuels avec sa femme au moins une fois tous les quatre mois s'il n'a pas d'excuse; ils soutiennent que les rapports sexuels sont un droit des deux époux et que le consentement de l'épouse est nécessaire pour un retrait. Ibn Taymiyya et Ibn al-Qayyim estiment que les rapports sexuels doivent être conformes à la coutume, proportionnés aux besoins de l'épouse et aux capacités de l'époux, sans nombre fixe. L'ouvrage note que certains considèrent que l'époux doit la satisfaire comme il doit la nourrir, une position qu'Ibn Taymiyya privilégiait. En cas de désaccord entre les époux sur ce droit, le juge tranche en fonction de la coutume et de leur situation. Ibn Taymiyya considère que le préjudice causé à l'épouse par le refus de ces rapports justifie la dissolution du mariage dans tous les cas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17509} Le droit du mari sur sa femme: le mari peut demander à sa femme des rapports sexuels quand il le souhaite, sauf en cas d’empêchement légitime, tel que les menstruations, les saignements post-partum, le zihar ou l’ihram; en l’absence d’empêchement, elle doit s’y soumettre. Les juristes al-Dhahabi, al-Rafi’i, al-Nawawi, Ibn al-Rif’a et al-Haytami considèrent le refus injustifié de l’épouse comme une forme de désobéissance et un péché majeur, se référant aux avertissements sévères des hadiths. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17509}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510} Le mari n'est pas tenu d'accéder à la demande de sa femme, à moins qu'il n'ait l'intention de lui nuire, auquel cas cela lui est interdit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510} Le droit de l'épouse à la séparation lorsque le mari est incapable d'avoir des relations sexuelles (impuissance, castration ou incapacité sexuelle): les juristes distinguent l'incapacité existant au moment du contrat de celle survenant après sa consommation, ainsi que l'épouse qui connaissait le défaut de celle qui l'ignorait. Ce point est détaillé dans la section consacrée au divorce. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510} Le droit du mari d'annuler le mariage lorsque la femme présente un défaut empêchant les rapports sexuels (tel qu'un canal obstrué ou une excroissance cornue): les juristes divergent sur deux points; voir les détails sous la rubrique correspondante. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510} Absence de rapports sexuels par serment (iyla) ou par zihar. Iyla: il est incontestable que le mari qui jure de ne pas avoir de rapports sexuels dispose de quatre mois, délai fixé dans la sourate al-Baqara. S'il persiste au terme de ces quatre mois, la femme peut saisir le juge, qui ordonnera le retour du mari, puis prononcera le divorce; s'il refuse, le juge prononcera le divorce, conformément à l'avis majoritaire des écoles chaféite, malikite et hanbalite. Selon l'école hanafite, le divorce prend effet quatre mois après l'expiration du délai légal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17511} Zihar: la majorité des hommes ont des relations sexuelles avec une épouse dont le zihar a été prononcé avant l'expiation; un hadith hanbalite l'autorise lorsque l'expiation consiste en un repas; les détails sont précisés dans la section consacrée au zihar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17511} Zihar (suite): si le mari refuse l'expiation, l'épouse peut saisir le juge; celui-ci ordonne l'expiation et, en cas de refus, l'y contraint par des mesures disciplinaires jusqu'à ce qu'il expie ou divorce. C'est l'avis de l'école hanafite, car le mari lui a causé un préjudice en lui interdisant toute relation sexuelle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17512} Les Malikites distinguent le mari incapable d'expier, qui est divorcé par le juge, de celui qui en est capable, qui bénéficie d'un délai de quatre mois (iyla), après quoi il est invité à divorcer ou à expier. Les Hanbalites affirment qu'un mari en zihar n'est pas contraint de reprendre les rapports sexuels, ceux-ci étant interdits avant l'expiation, et qu'il dispose de temps pour affranchir un esclave, nourrir les pauvres ou jeûner, selon ses moyens. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17512} Le droit de l'épouse de se retenir jusqu'à réception de sa dot: les juristes s'accordent à dire qu'une fois la dot versée par le mari, elle doit lui permettre d'accéder à son domicile lorsqu'il le demande, sans obstacle légal. Elle ne peut refuser si la dot est différée en totalité ou si la part différée est plus importante, car son acceptation du report vaut acceptation de se soumettre. Les hanafites limitent ce droit à la condition que le rapport sexuel ait lieu avant le terme convenu, condition à laquelle elle a consenti. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17513} Concernant la dot immédiate, la majorité des écoles hanafite, shafi'ite, malikite et hanbalite estiment qu'elle peut se retenir jusqu'à réception de la part immédiate, la dot étant une contrepartie pour l'utérus, à l'instar du prix des biens; Ibn al-Mundhir rapporte un consensus sur ce point. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17513} Effet du rapport sexuel sur le droit de se retenir après avoir consenti à l'accès: deux points de vue. La première opinion, celle d'Abu Hanifa et d'Ibn Hamid parmi les Hanbalites, est qu'elle peut encore retenir sa dot jusqu'à ce qu'elle soit payée, car le contrat couvre chaque rapport sexuel; la seconde, celle d'Abu Yusuf, de Muhammad, des Shafi'ites, des Malikites et de l'école Hanbalite, est qu'elle ne le peut pas, car son consentement au report de la dot vaut acceptation de celle-ci. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17513}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17514} Lorsque la dot différée devient exigible avant que l'épouse ne se remette à la dot: deux avis. Le premier, celui de l'école Hanafi privilégiée, celui, plus solide, des Shafi'ites et celui des Hanbalites, est qu'elle ne peut pas retenir sa dot, car son droit de rétention s'est éteint du fait de son consentement au report. La seconde opinion, celle d'une école shafi'ite, des malikites et d'Abou Yusuf, est que l'épouse peut refuser, car cela s'apparente désormais à une dot immédiate; Abou Yusuf limite cette possibilité aux cas où le mari n'a pas stipulé de relations sexuelles avant l'échéance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17514}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17515} Concernant la question de savoir qui initie le versement: les hanafites et les malikites estiment que le mari doit verser la dot en premier, car son droit est fixé par le contrat, tandis que le droit de l'épouse à la dot est fixé par sa réception; Malik désapprouvait que l'épouse autorise les relations sexuelles avant d'avoir reçu un quart de dinar, considérant cela comme un droit divin. Les hanbalites et une école shafi'ite imposent au mari de verser la dot en premier, puis à l'épouse. L'avis shafi'ite privilégié prévoit que les deux parties soient contraintes conjointement par le dépôt de la dot auprès d'un administrateur indépendant. Un troisième avis shafi'ite n'impose aucune contrainte, considérant que les droits sont égaux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17515} Concernant la stipulation dans le contrat de mariage stipulant que les rapports sexuels ne seront pas licites, ou qu'ils n'auront pas lieu: tous s'accordent à dire que la stipulation est nulle, mais divergent quant à son effet sur le contrat. La majorité des shafi'ites, des malikites et des hanbalites considèrent la stipulation et le contrat comme nuls, car cela en contrevient à l'objet. Les hanafites, quant à eux, jugent la stipulation invalide mais le contrat valide, car un mariage n'est pas annulé par une condition invalide. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17516} Concernant la stipulation de non-consommation, trois avis divergent: les Hanafites et les Hanbalites considèrent le contrat comme valide et la condition comme nulle; les Malikites considèrent les deux comme nuls, et parmi eux, l’avis prédominant autorise l’annulation avant la consommation et non après, la condition devenant alors caduque; les Shafi’ites considèrent le contrat comme nul si la condition émane de l’épouse, mais sans conséquence si elle émane de l’époux, puisque la relation sexuelle est son droit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17516}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17517} Le retrait (azl), c’est-à-dire le retrait avant l’éjaculation dans l’utérus: la majorité l’autorise pour un maître avec son esclave, qu’elle y consente ou non, ce consensus étant rapporté par al-Qarafi; Les avis concernant le retrait d'une épouse libre sont détaillés dans une section dédiée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17517} Allaitement (ghila): tous s'accordent à dire que c'est permis, d'après le hadith de Judhama bint Wahb, dans lequel le Prophète avait l'intention de l'interdire, avant de mentionner que Rome et la Perse le pratiquaient sans que cela n'ait nui à leurs enfants. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17517} Rapports sexuels avec une femme enceinte: certains juristes s'y opposaient, citant le dicton « ne tuez pas vos enfants en secret »; la majorité les autorise, se référant au hadith de l'homme qui interrogea le Prophète à ce sujet et à qui il fut répondu que si cela s'avérait nécessaire, il n'y avait pas de mal, car cela n'avait causé aucun préjudice à la Perse et à Rome. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17517}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17518} Les effets des rapports sexuels: (a) ils confirment la dot complète, selon les écoles hanafite, chaféite, malikite et hanbalite, puisque les rapports sexuels constituent l’accomplissement de cet objectif; (b) ils établissent le délai d’attente après le divorce, conformément au verset de la sourate al-Ahzab; (c) ils rendent caduc le serment d’iyla; (d) dans un mariage valide, les rapports sexuels nécessitant le ghusl sont une condition d’ihsan pour l’adultère; (e) ils rétablissent le divorce révocable, selon les écoles hanafite, hanbalite et malikite, si le mari a l’intention de reprendre sa femme, contrairement à l’avis des chaféites. (f) Son effet sur la licéité du divorce, une section détaillée dans la section « Divorce ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17518}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17519} L’effet des rapports sexuels sur le divorce (suite): un divorce licite est prononcé sur une femme en état de pureté, sans rapport sexuel pendant cet état, ou lorsqu’elle est enceinte et que sa grossesse est manifeste. Un divorce illicite est celui prononcé pendant les menstruations, ou en état de pureté au moment du rapport sexuel; pour une femme dont le mariage n’a pas encore été consommé, le divorce pendant les menstruations ou l’état de pureté est licite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17520} Concernant la validité d'un divorce bid'a: la majorité des écoles hanafite, chaféite, malikite et hanbalite estiment qu'il est valide et que le mari commet un péché, citant l'exemple d'Ibn 'Umar qui a divorcé de sa femme pendant ses menstruations, après quoi le Prophète lui a ordonné de la reprendre. Ibn Taymiyya, Ibn al-Qayyim, Ibn Hazm et al-Shawkani, ainsi qu'une opinion attribuée à Ibn 'Umar et à Tawus, estiment qu'il n'est pas valide, car il contredit le commandement du Prophète. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17520}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17521} Effet du rapport sexuel sur l'impureté rituelle (hadd) pour adultère: le rapport sexuel qui déclenche l'impureté rituelle (hadd) est l'insertion, au moins, du gland du pénis d'un homme sain d'esprit et adulte dans un vagin désirable qui n'est pas la propriété de l'homme et qui n'est pas sujette à caution en terre d'Islam; voir détails sous l'article sur l'adultère. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17521} Effet du rapport sexuel sur les ablutions rituelles (ghusl): la rencontre des deux parties circoncises (le gland pénétrant le vagin) impose les ablutions rituelles (ghusl) à l'homme et à la femme, selon le hadith rapporté par Aïcha. Le hadith rapporté par Abou Hourayra ajoute: « même sans éjaculation ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17521} L'effet des rapports sexuels sur une femme divorcée trois fois: elle ne peut être licite à son premier mari tant qu'elle n'a pas épousé un autre mari, selon le verset de la sourate al-Baqara; la majorité considère qu'elle n'est licite au premier mari que lorsque le second a eu des rapports sexuels avec elle, avec contact des parties circoncises, même sans éjaculation; Sa'id ibn al-Musayyab soutient que le premier mari peut l'épouser à nouveau si le second mariage est valide et n'a pas pour but de la rendre licite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17521}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17522} Effet des rapports sexuels sur l'affinité matrimoniale: il est incontestable que le contrat avec une fille rend sa mère, quel que soit son rang, illicite à jamais, de par le seul contrat, qu'il y ait eu ou non rapports sexuels, et il en va de même pour les épouses des fils et des pères. Une belle-fille est interdite sous deux conditions: le contrat avec sa mère et les rapports sexuels avec celle-ci; sans rapports sexuels, l'interdiction ne s'applique pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17522} Effet des rapports sexuels sur les expiations: (1) rapports sexuels avec une épouse menstruée. Quatre avis: les Hanafites et l'avis Shafi'i, plus solide, n'exigent aucune expiation, seulement une aumône recommandée d'un dinar ou d'un demi-dinar; L'école hanbalite et une école shafi'ite exigent un dinar ou un demi-dinar, au choix du mari, selon un hadith rapporté par Ibn 'Abbas; l'école malikite, al-Thawri, al-Layth et un hadith rapporté par Ahmad exigent seulement le repentir et la demande de pardon; al-Hasan al-Basri et Sa'id ibn al-Musayyab exigent l'expiation pour les rapports sexuels pendant le Ramadan. (2) Rapports sexuels pendant le jeûne du Ramadan: la plupart des savants exigent l'expiation et le rattrapage du jour, qu'il y ait eu éjaculation ou non, selon le hadith rapporté par Abu Hurayra concernant l'homme qui a eu des rapports sexuels avec sa femme pendant le Ramadan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17522}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17523} Rapports sexuels pendant le pèlerinage: les juristes s’accordent à dire que le pèlerin qui a des rapports sexuels avant de se tenir debout à Arafat invalide son hajj et doit accomplir un sacrifice; les hanafites exigent un mouton et les chaféites, les malikites et les hanbalites un chameau. Rapports sexuels après s’être tenu debout et avant la première éjaculation exigent un chameau, par consensus; après la première éjaculation, les hanafites, les chaféites et les hanbalites exigent un mouton et les malikites un chameau. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17524} Rapports sexuels et jeûne: les juristes s’accordent à dire que les rapports sexuels d’une personne qui jeûne pendant le Ramadan invalident le jeûne, qu’il y ait éjaculation ou non. Si le jeûne a été oublié, la majorité des écoles hanafite, chaféite, un hadith rapporté par Ahmad, al-Thawri, al-Hasan et Mujahid estiment qu'il n'est pas invalidé; les malikites, l'école hanbalite et Ata' le considèrent comme invalidé, au même titre qu'un acte intentionnel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17524}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17525} Concernant les rapports sexuels et le pèlerinage: les juristes s'accordent à dire que les rapports sexuels avant l'arrivée à Arafat invalident le pèlerinage, qui doit alors être complété ultérieurement, et qu'ils ne l'invalident pas après l'arrivée et la première levée des chaînes. Entre l'arrivée et la première levée des chaînes, les chaféites, les malikites et les hanbalites considèrent que le pèlerinage est invalidé, tandis que les hanafites estiment le contraire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17525} Fouler le mushaf: il est incontestable qu’un musulman qui le foule aux pieds par mépris devient apostat; en revanche, il ne l’est pas sous la contrainte ou la nécessité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17525} Fouler les tombes: la tombe doit être respectée; par conséquent, la fouler aux pieds ou s’asseoir dessus est déconseillé, selon l’avis majoritaire, d’après le hadith d’Uqba ibn Amir et les propos attribués à Ibn Mas’ud. Les écoles chaféite et hanbalite le déconseillent, sauf en cas de nécessité; marcher parmi les tombes n’est pas déconseillé aux chaféites, tandis qu’aux hanbalites le déconseillent en chaussures, mais pas en bottes. Les Hanafites déconseillent de s'asseoir sur une tombe, sauf en cas de nécessité. Les Malikites la déconseillent sous certaines conditions: la tombe est surélevée, le chemin la longe et on suppose que certains ossements subsistent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17525}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17526} Concernant les animaux qui piétinent: les Hanafites, les Malikites, les Chafiites et les Hanbalites s'accordent à dire que toute personne accompagnant un animal (cavalier, meneur ou conducteur) est responsable des dommages causés par son sabot, sa tête ou son pied, si ces dommages lui sont imputables; dans le cas contraire, elle n'est pas responsable, selon le principe « la blessure de l'animal reste impunie ». Al-Shafi'i considère le meneur, le conducteur et le cavalier comme responsables des dommages causés par l'animal avec la main, la gueule, le pied ou la queue, et estime que celui qui fait piétiner quelque chose est responsable. Al-Nawawi note qu'il est interdit de monter un animal craintif sur les marchés."
  ur: "واٹ'، لغوی طور پر، کسی چیز پر کھڑا ہے۔ اسے جماع کے لیے بھی استعمال کیا جاتا ہے، عورت کے جنسی عضو میں مرد کے رکن کو داخل کرنا جب تک کہ دونوں ایک نہ ہوں۔ فنی معنویت لغوی سے الگ نہیں ہوتی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17482}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17483} متعلقہ الفاظ: نکاح، جس کی جڑ جڑنا اور جمع ہونا ہے، نکاح کے سخت معنوں میں استعمال کیا جاتا ہے اور تعامل کے معنی میں، انجیر کے لیے استعمال ہوتا ہے۔ اور فقہا کا اختلاف ہے۔ liwat مردوں کے ساتھ جماع ہے، جو وسیع وت کے تحت آتا ہے. {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17483} سب سے پہلے، وت' جماع کے طور پر۔ یہ حلال ہے یا حرام۔ حلال بیوی یا لونڈی سے ہمبستری کرنا ہے جو بعض اوقات حرام ہو سکتا ہے، جیسے حیض کے دوران یا بعد از ولادت کا خون، ظہار سے پہلے، احرام میں، روزے کی حالت میں یا اعتکاف میں۔ حرام یا تو اس قسم کا ہے جو کسی دوسری صورت میں حلال ہو سکتا ہے، مثلاً ایسی عورت سے مباشرت جس سے شادی ہو، جس میں زنا کی سزا ہو، یا ایسی قسم جو کبھی حلال نہ ہو، جیسے بدکاری، بیوی یا غیر بیوی سے مقعد جماع، اور حیوانیت۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17483}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17484} وہ اسباب جو ہمبستری کو حلال کرتے ہیں وہ ہیں عقد نکاح اور دائیں ہاتھ کی ملکیت۔ لونڈی کی ملکیت بغیر عقد کے حلال ہے، کیونکہ اس شخص کی ملکیت میں استعمال ہوتا ہے۔ قرآن نے سورۃ المومنون میں اس کی طرف اشارہ کیا ہے ⁦(صرف سورہ کا حوالہ دیا گیا ہے)⁩ بغیر کسی آیت کے یہاں نقل کیا گیا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17484} حکم: جمہور فقہاء کا خیال ہے کہ بیوی یا لونڈی کے ساتھ جماع کی اصولی طور پر اجازت ہے، یہ ایک ایسی لذت ہے جس کا فطری مزاج طلب کرتا ہے، اس میں کوئی اطاعت یا نافرمانی نہیں ہے۔ یہ اچھی نیت کے ساتھ مستحب ہو جاتا ہے، جیسے کہ اپنے آپ کو حرام سے پاک رکھنا، اس وقت واجب ہو سکتا ہے جب یہ اپنے یا اپنے گھر والوں کے لیے عفت کا واحد ذریعہ ہو، اور حالات کے مطابق حرام یا ناپسندیدہ ہو سکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17484}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17485} ابن قیم نے جماع کے مقاصد درج کیے ہیں: اولاد کی حفاظت کرنا، اگر جسم کو نقصان پہنچاتا ہے تو پانی چھوڑنا اور جسم کو نقصان پہنچانے والے پانی کو جاری کرنا۔ خوشی اس کے فوائد میں نظریں نیچی رکھنا، نفس کو روکنا اور عفت کو محفوظ رکھنا شامل ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ17485}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17486} حلال جماع کا اجر: ابوذر کی روایت ہے کہ 'تم میں سے کسی کی قربت میں صدقہ ہے'۔ جمہور کا خیال ہے کہ مرد کو اپنی بیوی کے ساتھ جماع کرنے کا ثواب اس وقت ملتا ہے جب وہ اچھی نیت کے ساتھ ہو، جیسے کہ اپنے آپ کو یا اپنی بیوی کو حرام سے بچانا، مناسب صحبت میں اس کا حق ادا کرنا، یا صالح اولاد کی تلاش۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17486} جہاں انسان اپنی خواہش کی تکمیل کے سوا کچھ نہیں چاہتا، وہاں فقہاء کا اختلاف ہے: ابن قتیبہ کا خیال ہے کہ اسے ہر حال میں ثواب ملتا ہے، جب کہ ابن حجر الہیتمی اور دوسرے کہتے ہیں کہ جہاں ایسا نہ ہو وہاں کوئی اجر نہیں ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17486} جماع اور اس کے انعامات: ایک مسلمان کو اس کا اجر ملتا ہے جو وہ اپنے گھر والوں پر خرچ کرتا ہے اگر وہ اس میں خدا سے اجر چاہتا ہے۔ اگر یہ واجب خرچ کے لیے ہے تو یہ حلال جماع کے لیے زیادہ ہے، جیسا کہ کتاب بیان کرتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17487} مشابہت اور مجامعت کے مستحب اعمال: بسم اللہ سے شروع کرنا مستحب ہے۔ اس کے احترام میں قبلہ سے منہ موڑنا؛ کھیلنا شروع کرنا، گلے لگانا اور بوسہ لینا، تاکہ عورت کی خواہش بڑھ جائے۔ ایک ساتھ دونوں کے اطمینان تک پہنچنے کا خیال رکھنا؛ اپنے آپ کو کپڑے سے ڈھانپنا؛ آواز کو کم کرنا اور تھوڑا بولنا۔ مرد کے لیے ایسی جگہ جماع کرنا ناپسندیدہ ہے جہاں اسے دیکھا جائے یا اس کی آواز سنی جائے، اور شرمگاہ کے کھلے ہونے کی صورت میں حرام ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17487}{cite:fiqh-Mawsua-kuwaityya-noor-v3 p.17488} جو شخص دوبارہ جماع کرنا چاہتا ہے اس کے لیے مستحب ہے کہ اپنی شرمگاہ کو دھوئے اور وضو کرے، اور غسل افضل ہے۔ کتاب میں اس رپورٹ کا حوالہ دیا گیا ہے کہ نبی نے اپنی ازواج مطہرات کا ایک ہی غسل کیا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17488}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17489} جماع کے بارے میں بات کرنا اور اس کے راز افشا کرنا: فقہاء کا اختلاف ہے۔ حنفیہ، حنبلی مسلک جس کو المردوی ترجیح دیتے ہیں، اور النووی کہتے ہیں کہ ہمبستری پر فخر کرنا اور میاں بیوی کے درمیان جو کچھ گزرتا ہے اس کو ظاہر کرنا حرام ہے، ابو سعید کی روایت میں اللہ کے نزدیک بدترین لوگوں کے بارے میں اور اس قول کو پھیلانا حرام ہے۔ ابن القیم، الہیتمی وغیرہ نے اسے کبیرہ گناہوں میں شمار کیا ہے۔ حنبلیوں کا مکتبہ فکر یہ ہے کہ میاں بیوی کے درمیان جو بات گزرتی ہے اس کے بارے میں بات کرنا، حتی کہ شریک بیوی کے لیے بھی ناپسندیدہ ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ17489}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17490} حلال جماع میں رکاوٹیں: نو ہیں۔ فقہاء ان میں سے چھ پر متفق ہیں، یعنی حیض، نفلی خون، اعتکاف، روزہ، احرام اور کفارہ سے پہلے ظہار۔ ان میں تین چیزوں پر اختلاف ہے، یعنی استحاضہ، حیض ختم ہونے کے بعد غسل نہ کرنا، اور جنگ کے گھر میں رہائش۔ سورۃ البقرہ کی آیت ⁦(صرف سورہ سے نقل کیا گیا ہے)⁩ اور اس قول پر ہے کہ حیض والی عورت سے اندام نہانی میں جماع کرنا حرام ہے اور اس قول پر ہے کہ حیض و نفاس کے علاوہ ہر کام کیا جا سکتا ہے۔ دوسرا، بعد از ولادت خون: فقہاء اس بات پر متفق ہیں کہ اندام نہانی میں جماع حرام ہے، اور اس کے احکام بشمول غسل اور کفارہ حیض کے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17491} تیسرا، استحاضہ: فقہاء کا اس میں اختلاف ہے کہ کیا فاسد خون آنے والی عورت سے جماع جائز ہے؟ جمہور حنفیہ، شافعی اور مالکیہ اور ایک حنبلی روایت اس کی اجازت دیتے ہیں، یہ قول ابن المنذر نے ابن عباس، سعید بن المسیب، الحسن، عطاء وغیرہ سے روایت کیا ہے، جس میں یہ بیان کیا گیا ہے کہ وہ حیض سے پاک ہے اور حمنہ بنت جحش کا معاملہ ہے جس کے شوہر نے اس کے ساتھ تعامل کیا تھا۔ استحاضہ، دوسرا قول، جسے بعض فقہاء کہتے ہیں: فاسد خون آنے والی عورت سے جماع حرام ہے، کیونکہ خون حیض کا خون ہے، اور حرمت کا سبب، حیض، اس لیے اس میں حرام ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص17492} چوتھا، اعتکاف۔ مسجد میں اعتکاف پر سورہ بقرہ کی آیت ⁦(اعتکاف کے تحت تفصیل)⁩ پر فقہاء کرام کا اتفاق ہے کہ اعتکاف کے دوران جماع حرام ہے اور رات کو یا دن کو، اگر جان بوجھ کر اسے باطل کرتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17492} پانچواں، روزہ۔ فقہا کا اتفاق ہے کہ رمضان میں روزہ دار کی جان بوجھ کر جماع کرنا حرام ہے، روزہ فاسد ہو جاتا ہے اور کفارہ ضروری ہے، خواہ وہ انزال ہو یا نہ ہو، ابوہریرہ کی روایت ہے کہ جس نے رمضان میں روزے کی حالت میں اپنی بیوی سے ہمبستری کی اور اسے صدقہ دینے کے لیے کھجوریں دی گئیں، جو کتاب میں نقل ہوئی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17492}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17493} چھٹا، احرام۔ فقہا کا اتفاق ہے کہ حج یا عمرہ میں حج کرنے والے کا جماع حرام ہے، سورہ بقرہ کی آیت ہے جس میں رفعت کو جماع اور اس کے ساتھ ہونے والی گفتگو سے تعبیر کیا گیا ہے۔ عرفات میں کھڑے ہونے سے پہلے جماع کرنا حج کو باطل کر دیتا ہے، جب کہ پہلے قیام کے بعد نہیں ہوتا۔ عرفات میں کھڑے ہونے اور پہلی رہائی کے درمیان کی مدت کے بارے میں آراء مختلف ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص17493} ساتواں، ظہار۔ سورۃ المجادلہ کی آیت اور کفارہ سے پہلے جماع کرنے والے ابن عباس ما کی روایت میں ہے کہ جس عورت پر ظہار کیا گیا ہے اس سے ہم بستری کرنا کفارہ سے پہلے حرام ہے، جس کو نبی نے فرمایا کہ استغفار کرو اور کفارہ ادا کرنے تک اسے دوبارہ نہ دو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17493} آٹھواں، ایک مسلمان کا اپنی بیوی سے جنگ کے گھر میں جماع۔ حنفیہ، مالکیوں اور شافعیوں کی اکثریت اسے ناپسندیدہ قرار دیتی ہے، وہاں اولاد کے خوف سے، کیونکہ مسلمان پر جنگ کے گھر میں قیام کرنا منع ہے، نبی کے اس قول کا حوالہ دیتے ہوئے کہ وہ ہر اس مسلمان سے بری ہے جو مشرکین میں رہتا ہے، جسے بخاری نے مرسل قرار دیا ہے۔ حنبلیوں کا خیال ہے کہ مسلمان اپنی بیوی سے حالت جنگ میں بغیر ضرورت کے ہمبستری نہیں کر سکتا اور جب ضرورت پیش آئے تو اسے دستبردار ہونا چاہیے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17493}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494} (b) حرام جماع: اس کی قسمیں زنا، بدکاری، بیوی یا عورت سے جماع، مردہ عورت اور مردہ عورت کے ساتھ ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17494} سب سے پہلے، زنا فقہاء کے اجماع سے حرام ہے اور کبیرہ گناہوں میں سے ایک ہے، سورہ الاسراء کی آیت میں سورہ اور نمبر کے ذریعہ نقل کیا گیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17494} دوسرا، فحاشی: فقہاء اس بات پر متفق ہیں کہ یہ سب سے بڑی شدت کے ساتھ حرام ہے اور کبیرہ گناہ ہے۔ الماوردی اسے سب سے زیادہ گھناؤنے کام قرار دیتے ہیں اور کہتے ہیں کہ قوم لوط سے پہلے دنیا میں کسی نے ایسا نہیں کیا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17494} زنا بالجبر کی سزا: فقہاء نے چھ آراء پیش کی ہیں جن میں سے کتاب پہلے چار کو بیان کرتی ہے۔ ابو یوسف، محمد، الثوری، الاوزاعی اور ابو ثور کے شافعی اور حنبلی مکتب کے نظریات کے مطابق پہلا، یہ ہے کہ بدکاری کی سزا زنا کی سزا ہے: شادی شدہ مجرم کو سنگسار کیا جاتا ہے اور غیر شادی شدہ کو کوڑے مارے جاتے ہیں۔ وہ ابو موسیٰ کی ایک روایت نقل کرتے ہیں کہ جب کوئی آدمی کسی مرد کے پاس آتا ہے تو دونوں زانی ہوتے ہیں، جسے بیہقی نے رد شدہ سلسلہ کہا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17494}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17495} دوسرا جو ابو حنیفہ، حماد بن ابی سلیمان اور الحکم کے پاس ہے، یہ ہے کہ سزائے موت یا سزائے موت کے علاوہ کوئی قید یا سزا نہیں ہے۔ اور یہ کہ ایک بار بار مجرم کو حکمران دوسرے جرم میں مار ڈالتا ہے، شادی شدہ یا نہیں، پالیسی کے طور پر؛ وجہ یہ بتائی گئی ہے کہ فعل زنا کا نام نہیں ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17495} تیسرا، جو مالکیوں کے نزدیک ہے، یہ ہے کہ دونوں شریکوں کو قتل کرنے پر حدیث کے عمومی الفاظ کا حوالہ دیتے ہوئے، فعال اور غیر فعال ساتھی کے لیے ہر صورت میں رجم ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17495}{cite:fiqh-Mawsua-kuwatiyya-noor-v3 p.17496} چوتھا قول جسے شافعی نے ایک نظر میں رکھا ہے اور اسحاق بن راہویہ کے نزدیک، یہ ہے کہ مجرم کے قول سے قتل کرنے والا شادی شدہ یا شادی شدہ کی طرح نہیں ہے۔ کتاب کی طرف سے متعدد صحابہ اور جانشینوں سے منسوب۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17496} اسکین کے اس مقام پر پانچواں اور چھٹا قول ابھی تک پڑھا نہیں گیا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17496} مقعد میں بیوی یا لونڈی کے ساتھ جماع: کتاب متعدد صحابہ اور جانشینوں سے اس قول کو نقل کرتی ہے۔ الماوردی کہتے ہیں کہ یہ صحابہ کرام، اکثر جانشینوں اور فقہا کا مقام ہے۔ متعدد فقہا، ابن النحاس، الہیتمی اور ابن القیم ان میں سے کہتے ہیں کہ یہ کبیرہ گناہوں میں سے ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17497} فقہاء کا خیال ہے کہ اس میں کوئی حد نہیں ہے، کیونکہ بیوی یا لونڈی کسی لحاظ سے لطف اندوزی کی جگہ ہے، جس سے حدیث کو ٹالنے میں شک پیدا ہوتا ہے۔ جمہور کا خیال ہے کہ صوابدیدی سزا ⁦(تذیر)⁩ واجب ہے، جیسا کہ حنفیہ، مالکیہ اور حنبلی کہتے ہیں، اور شافعیوں کا خیال ہے کہ اگر اسے دہرایا جائے تو یہ واجب ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17497} فقہاء اس موضوع پر احادیث نقل کرتے ہیں، جن کا حوالہ کتاب کے نوٹس میں دیا گیا ہے، یہ استدلال ہے کہ مقعد جماع کے لیے بنائی گئی جگہ نہیں ہے، یہ مستقل نقصان ہے، اور یہ کہ یہ بیوی کے لطف اندوزی کے حق سے انکاری ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17498}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17499} ایک روایت میں ابن عمر کی طرف منسوب کتاب کو دیکھتا ہے، زید بن اسلم، نافع ایک روایت میں، اور بعض شافعی کے مطابق، مالک نے۔ علماء نے جواب دیا کہ آیت کے لفظ 'انا' کا مطلب ہے 'کہاں سے'، یہ کہ محمد بن کعب القرازی کی تفسیر رد ہے، اور ابن عمر، نافع اور مالک کی اجازت کے انکار کی روایت صحیح ہے۔ کتاب اپنے فیصلے کو شامل کیے بغیر خیالات کو ریکارڈ کرتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ17499}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17501} چوتھا، مقعد میں غیر بیوی سے جماع: اس میں کوئی اختلاف نہیں کہ یہ حرام اور کبیرہ گناہ ہے۔ اس کی سزا کے بارے میں چار قول ہیں: پہلا، مالکیہ، حنبلی، شافعی مکتب کے نزدیک اور دو اصحاب ابو حنیفہ کے نزدیک زنا کی حد ہے۔ دوسرا ابو حنیفہ اور ایک شافعی کا قول یہ ہے کہ حد نہیں ہے مگر صوابدیدی سزا ہے۔ تیسرا، مالکی جج ابو الحسن نے اسے بدکاری کے مترادف قرار دیا ہے، اور ابن عقیل کہتے ہیں کہ بدکاری کی حد لاگو ہوتی ہے۔ چوتھا، بعض شافعیوں کا، تلوار سے حد کے طور پر موت ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17501}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17502} پانچویں، مردہ عورت سے جماع: اس کے حرام ہونے میں کوئی اختلاف نہیں ہے، اور الحیتمی نے اسے بڑے محدثین میں شمار کیا ہے۔ سزا کے بارے میں دو قول ہیں: پہلا، حنفیہ کا، شافعی کا قول اور حنبلی کا ترجیحی قول، کہ حد نہیں ہے اور صرف صوابدیدی سزا ہے۔ دوسرا، مالکیوں کا معروف قول میں، شافعی آواز دینے والے کے خلاف، بعض حنبلی اور الاوزاعی کے نزدیک حدیث کا اطلاق ہوتا ہے۔ مالکی مردہ بیوی سے ہمبستری کرنے والے شوہر کو حد سے مستثنیٰ قرار دیتے ہیں۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17502} چھٹا، جانور سے جماع کرنا: فقہاء سورۃ المومنون کی آیت کے عام الفاظ اور جانور سے جماع کرنے والے کے بارے میں ابوہریرہ کی حدیث کا حوالہ دیتے ہوئے اس کے حرام ہونے پر متفق ہیں۔ کتاب میں جن احادیث کا حوالہ دیا گیا ہے ان میں سے کئی کو ان کی زنجیروں میں ضعیف قرار دیا گیا ہے۔ متعدد فقہاء اسے کبیرہ گناہوں میں شمار کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17503} اس کی سزا کے بارے میں فقہاء کا چار قول میں اختلاف ہے۔ پہلا، جابر بن زید، الحسن ابن علی، الحسن البصری، الشافعی اور ایک احمد کا قول، یہاں درج ہے، اور فہرست صفحہ 17503 سے آگے جاری ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17503} جانور کے ساتھ جماع کرنے کی سزا، باقی آراء: تیسرا الزہری کا ہے، جس نے دو ہدوں میں سے ہلکا پکڑ لیا، سو کوڑے، چاہے شادی شدہ ہو یا نہ ہو۔ چوتھا، اکثریت حنفیہ، شافعیوں کے نزدیک غالباً، مالکیوں اور حنبلیوں کے نزدیک، یہ ہے کہ کوئی حد لاگو نہیں ہوتی اور صوابدیدی سزا واجب ہوتی ہے۔ یہ ابن عباس، عطاء، الشعبی، النخعی، الحکم، الثوری اور اسحاق سے مروی ہے۔ حنفیہ کہتے ہیں کہ حاکم مجرم کو قتل کر سکتا ہے جو اسے دہرائے، البائری دوسرے جرم کا فیصلہ موت کی ضمانت دیتا ہے، اور حنبلی صوابدیدی سزا کو سخت دباتے ہیں۔ اکثریت کا استدلال ہے کہ ایکٹ غلط ہے، اسے ہاتھ سے تبدیل کیا جانا ہے، اور یہ کہ کوئی بھی رپورٹ حدیث قائم نہیں کرتی۔ حنفیہ، شافعیہ، مالکیہ اور حنبلی کے نزدیک وہ عورت جو کتے یا بندر جیسے جانور کو اپنے پاس آنے دیتی ہے، اس کے ساتھ ایسا سلوک کیا جاتا ہے جو کسی جانور سے جماع کرتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17504} استعمال شدہ جانور کو مارنا: تین قول۔ احناف، مالکیہ اور شافعی کے نزدیک اس کی ضرورت نہیں ہے، کیونکہ اس کے قتل کا حکم دینے والی حدیث ضعیف ہے اور اس لیے کہ نبی نے کھانے کے علاوہ جانوروں کو مارنے سے منع فرمایا ہے۔ احناف اسے ذبح کرنے اور نہ کھائے تو جلانے کا مشورہ دیتے ہیں۔ حنبلی اور شافعی کا مسلک ہر حال میں اسے قتل کرنے کا تقاضا کرتا ہے، اس حدیث کا حوالہ دیتے ہوئے کہ 'جس نے کسی جانور سے ہمبستری کی تو اسے قتل کرو اور اس کے ساتھ جانور کو بھی مارو'۔ تیسرا نقطہ نظر اسے صرف اسی وقت مارتا ہے جب مجرم اس کا مالک ہو۔ کتاب نے اسے الطحاوی سے منسوب کیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17504}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17505} اگر جانور کسی دوسرے کا ہو تو فقہاء کے ہاں ذمہ داری کے بارے میں اختلاف ہے: حنبلی اور شافعی کا قول ہے کہ حنفیہ کو قتل کرنے کا حکم ہے، جبکہ حنفی کا ہاتھ پکڑنا واجب ہے۔ اس کی قیمت کے لئے اور پھر اسے ذبح کیا جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17505} ذبح کے بعد اس طرح استعمال ہونے والے جانور کو کھانا: تین قول۔ حنبلی مسلک اور ابو حنیفہ کے دو اصحاب شافعی کے نزدیک اس سے منع کرتے ہیں۔ احمد کی ایک رپورٹ کو منع کیے بغیر مسترد کر دیتا ہے۔ ابو حنیفہ، مالکیہ اور شافعی مکتب کا نظریہ سورۃ المائدہ کی آیت کا حوالہ دیتے ہوئے جس میں جانوروں کو چرنے کی اجازت دی گئی ہے، بغیر نامنظوری کے اس کی اجازت ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 17506} غلطی سے جماع کرنا ⁦(وت'بی شبہ)⁩: عمل حرام ہے لیکن حد نہیں لاتا، کیونکہ شبہ زنا کے ارادے کو دور کرتا ہے۔ شک کی قسموں کا علاج ان کے اپنے عنوان کے تحت کیا جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17506} جماع کے احکام۔ شوہر پر بیوی کا حق: اس کا حق ہے کہ وہ اس سے جماع کرے اور اس کی خواہش پوری کرے جیسا کہ عبد اللہ بن عمرو کی روایت سے معلوم ہوتا ہے: ''تمہارے جسم کا تم پر حق ہے اور تمہاری بیوی کا تم پر حق ہے'' اور ابو الدرداء کا قول ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17506}{cite:فقہ-موسوع-کویتیہ-نور-v3 ص17507} فقہاء اس حق کی حد اور فرض کے بارے میں چار آراء بیان کرتے ہیں۔ حنفیہ اور شافعی کا نظریہ ہے کہ بیوی ہمبستری کا مطالبہ کر سکتی ہے، اور یہ کہ شوہر کو ایک بار فیصلہ کرنا چاہیے، جب کہ اچھی صحبت کے معاملے میں خدا کے سامنے زیادہ واجب ہے۔ شافعی اس کو چھوڑنے میں کوئی ذمہ داری اور کوئی گناہ نہیں کرتے، حالانکہ بیوی کو بغیر جماع کے نہ چھوڑنا مستحب ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17507} باقی آراء ان صفحات میں مکمل نہیں ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17507} بیوی کے جماع کے حق کی پیمائش ⁦(باقی آراء)⁩: مالکیوں کے نزدیک زیادہ امکان ہے کہ ہر چار میں سے ایک رات بیوی پر واجب ہے۔ ابو الحسن الصغیر نے ابو عمران سے کم از کم اس کے بارے میں رائے دی ہے کہ چار میں ایک رات یا تین میں ایک رات، اور عمر نے ہر طہارت میں ایک بار فیصلہ کیا کیونکہ شوہر اسے حاملہ کرتا ہے۔ حنبلی مسلک کا چوتھا قول یہ ہے کہ اگر شوہر کے پاس کوئی عذر نہ ہو تو چار مہینوں میں کم از کم ایک بار اپنی بیوی سے جماع کرے۔ وہ استدلال کرتے ہیں کہ جماع کرنا میاں بیوی دونوں کا حق ہے، اور دستبرداری کے لیے بیوی کی رضامندی ضروری ہے۔ ابن تیمیہ اور ابن القیم کا خیال ہے کہ ہمبستری رسم کے مطابق، بیوی کی ضرورت اور شوہر کی استطاعت کے مطابق ہونی چاہیے، جس میں کوئی مقررہ تعداد نہیں ہے۔ کتاب نوٹ کرتی ہے کہ کچھ لوگوں کے خیال میں اسے اسے مطمئن کرنا چاہیے جیسا کہ اسے کھانا کھلانا چاہیے، جسے ابن تیمیہ نے ترجیح دی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17508}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17509} اگر میاں بیوی حق میں جھگڑتے ہیں تو جج اسے اپنی مرضی اور ان کے حالات کے مطابق طے کرتا ہے۔ ابن تیمیہ کے نزدیک بیوی کو اس کے روکنے سے نقصان ہر حال میں تحلیل ہونے کی اجازت ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17509} بیوی پر شوہر کا حق: شوہر جب چاہے اپنی بیوی سے جماع کے لیے کہہ سکتا ہے، سوائے اس کے جہاں کوئی حلال رکاوٹ ہو، جیسے حیض، نفلی خون، ظہار یا احرام؛ جب رکاوٹ موجود نہ ہو تو اسے اس کی تعمیل کرنی ہوگی۔ فقہاء الذہبی، الرفاعی، النووی، ابن الرفاعہ اور الہیتمی نے حدیث میں سخت تنبیہات کا حوالہ دیتے ہوئے بغیر عذر کے بیوی کے انکار کو نافرمانی اور کبیرہ گناہ قرار دیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17509}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510} بیوی کے کہنے پر شوہر کو تعمیل کی ضرورت نہیں ہے، الا یہ کہ وہ اسے نقصان پہنچانے کا ارادہ رکھتا ہو، ایسی صورت میں یہ حرام ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17510} جب شوہر ہمبستری کرنے سے عاجز ہو تو بیوی کا علیحدگی کا حق ⁦( نامردی، کاسٹریشن یا جنسی معذوری)⁩: فقہاء نے عقد میں موجود معذوری کو اس معذوری سے الگ کیا ہے جس نے بیوی کو طلاق دینے اور اس کے بعد عورت کی معذوری کو ختم کیا ہو۔ نہیں کیا تفصیل طلاق کے تحت ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17510} جب بیوی میں کوئی عیب ہو جو جماع کو روکتا ہو ⁦(مثلاً مباشرت یا سینگ کی طرح بڑھنا)⁩: فقہا کا دو قول پر اختلاف ہے۔ اس کے عنوان کے تحت تفصیل۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 17510} قسم یا ظہار سے جماع روکنا۔ عائلہ: اس میں کوئی اختلاف نہیں کہ جو شوہر ہمبستری نہ کرنے کی قسم کھاتا ہے اس کے پاس چار مہینے ہیں، یہ مدت سورہ بقرہ میں ہے۔ اگر وہ چار ماہ گزرنے تک برقرار رہے تو بیوی معاملہ جج کے پاس لے جا سکتی ہے جو اسے رجوع کرنے اور پھر طلاق دینے کا حکم دیتا ہے۔ اگر وہ جج کو اس کی طرف سے طلاق دینے سے انکار کر دے تو جمہور شافعی، مالکیوں اور حنبلیوں کا قول ہے۔ احناف کا کہنا ہے کہ طلاق چار ماہ گزر جانے پر جج کے بغیر نافذ ہو جاتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17510}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17511} ظہار: اکثریت ایسی بیوی سے جماع کرتی ہے جس پر کفارہ سے پہلے ظہار حرام قرار دیا گیا ہو۔ حنبلی روایت اس کی اجازت دیتی ہے جہاں کفارہ کھانا کھلانا ہے۔ تفصیلات ظہار کے تحت ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17511} ظہار، جاری ہے: اگر شوہر کفارہ دینے سے انکار کردے تو بیوی معاملہ جج کے پاس لے جا سکتی ہے۔ جج اسے کفارہ دینے کا حکم دیتا ہے، اور اگر وہ انکار کرتا ہے، تو اسے تادیبی طریقوں سے مجبور کرتا ہے جب تک کہ وہ کفارہ نہ دے یا طلاق نہ دے دے۔ یہ حنفی کا قول ہے کیونکہ شوہر نے اسے حرام قرار دے کر اسے نقصان پہنچایا ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17512} مالکی کفارہ دینے سے عاجز شوہر کو، جسے جج نے طلاق دی ہو، اس قابل شخص سے ممتاز کیا ہے، جسے عیلہ کی طرح چار ماہ کی مہلت دی جاتی ہے، اس کے بعد اسے طلاق یا کفارہ دینے کا کہا جاتا ہے۔ حنبلی کہتے ہیں کہ ظہار شوہر کو دوبارہ جماع کرنے کا حکم نہیں ہے، کیونکہ یہ کفارہ سے پہلے حرام ہے، اور اسے غلام آزاد کرنے، مسکین کو کھانا کھلانے یا اپنی وسعت کے مطابق روزہ رکھنے کا وقت دیا جاتا ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17512} بیوی کا حق ہے کہ جب تک وہ اپنا مہر وصول نہ کر لے اپنے آپ کو روکے رکھے: فقہاء اس بات پر متفق ہیں کہ ایک بار جب شوہر مہر دے دے تو اسے اس تک رسائی کی اجازت دینی چاہیے، بغیر کسی قانونی رکاوٹ کے۔ اگر پورا مہر موخر کر دیا گیا ہو، یا اگر موخر کیا گیا حصہ بڑا ہو تو وہ انکار نہیں کر سکتی، کیونکہ اس کی مہر کو قبول کرنا اپنے آپ کو سپرد کرنا ہے۔ احناف نے اسے اس شرط تک محدود کردیا کہ جماع عدت سے پہلے ہو، جس پر وہ راضی ہوگئیں۔ فوری مہر کے لیے، حنفیوں، شافعیوں، مالکیوں اور حنبلیوں کی اکثریت کا خیال ہے کہ جب تک اسے فوری حصہ نہ مل جائے وہ اپنے آپ کو روکے رکھے، کیونکہ مہر رحم کے لیے واپسی ہے جیسا کہ نیکی کی قیمت ہے۔ ابن المنذر اس پر اجماع بیان کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17513} رسائی کی اجازت دینے کے بعد روکنے کے حق پر جماع کا اثر: دو آراء۔ حنبلیوں میں سے ابوحنیفہ اور ابن حامد کا پہلا یہ ہے کہ جب تک اسے ادا نہ کر دیا جائے تب تک وہ روک سکتی ہے، کیونکہ عقد جماع کے ہر عمل کا احاطہ کرتا ہے۔ ابو یوسف، محمد، شافعیہ، مالکیہ اور حنبلی مکتب کا دوسرا یہ ہے کہ وہ ایسا نہیں کر سکتی، کیونکہ اس کا اپنے آپ کو سپرد کرنا مہر کی رضامندی تھی جو باقی قرض ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17513}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17514} جب مؤخر مہر بیوی کے حوالے کرنے سے پہلے گر جائے: دو قول۔ ترجیحی حنفی، شافعی اور حنبلی مسلک میں سے پہلا، یہ ہے کہ وہ روک نہیں سکتی، کیوں کہ التوا میں اس کی رضامندی سے برقرار رکھنے کا حق ختم ہو گیا تھا۔ دوسرا، ایک شافعی کا قول، مالکیوں اور ابو یوسف کا، یہ ہے کہ وہ روک لے، کیونکہ اب یہ ایک فوری مہر کی طرح ہے۔ ابو یوسف اس کو ان معاملات تک محدود کرتے ہیں جن میں شوہر نے عدت سے پہلے جماع کی شرط نہیں لگائی تھی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17514}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17515} تصرف کون شروع کرتا ہے: حنفیہ اور مالکیہ کا خیال ہے کہ شوہر کو پہلے حوالے کرنا چاہئے، کیونکہ شوہر کا حق ہے کہ بیوی کو عقد کے ذریعے طے کرنا واجب ہے۔ اسے وصول کرنا؛ مالک نے بیوی کی طرف سے چوتھائی دینار وصول کرنے سے پہلے رسائی کی اجازت کو خدا کے حق کے طور پر ناپسند کیا۔ حنبلی اور شافعی کا مسلک پہلے شوہر کو مجبور کرتا ہے پھر بیوی کو۔ شافعی کے ترجیحی نظریہ نے دونوں کو ایک ساتھ ایک ٹرسٹی کے پاس مہر جمع کروانے پر مجبور کیا ہے جو کسی بھی فریق کا ایجنٹ نہیں ہے۔ تیسرا شافعی نظریہ مجبور نہیں کرتا کیونکہ حقوق برابر ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17515} عقد نکاح میں یہ شرط لگانا کہ جماع حلال نہیں ہوگا، یا یہ نہیں ہوگا: سب اس بات پر متفق ہیں کہ شرط باطل ہے، لیکن عقد پر اس کے اثر کے بارے میں اختلاف ہے۔ شافعی، مالکی اور حنبلی کی اکثریت شرط اور عقد دونوں کو باطل قرار دیتی ہے، کیونکہ اس سے عقد کا مقصد ختم ہو جاتا ہے۔ احناف شرط کو باطل قرار دیتے ہیں لیکن عقد صحیح ہے، کیونکہ نکاح باطل شرط سے باطل نہیں ہوتا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17516} جماع نہ ہونے کی شرط کے لیے تین قول ہیں: احناف اور حنبلی عقد کو صحیح اور شرط باطل سمجھتے ہیں۔ مالکیہ دونوں کو باطل قرار دیتے ہیں، اور ان میں سے ترجیحی نظریہ ختم ہونے سے پہلے منسوخی کی اجازت دیتا ہے نہ کہ بعد، شرط کے گرنے کے ساتھ۔ اگر شرط بیوی کی طرف سے ہو تو شافعی عقد کو باطل سمجھتے ہیں، لیکن اگر شوہر کی طرف سے ہو تو بے ضرر ہے، کیونکہ جماع اس کا حق ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17516}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17517} واپسی ⁦(عزل)⁩ یعنی رحم میں انزال ہونے سے پہلے دستبرداری: اکثریت اس کی اجازت دیتی ہے آقا کے ساتھ، خواہ اس کی رضامندی کی طرف سے اطلاع دی جائے یا نہ ہو۔ القرافی؛ آزاد بیوی سے دستبرداری کے بارے میں خیالات ان کے اپنے عنوان کے تحت مفصل ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17517} دودھ پلانا ⁦(غلا)⁩: سب کا اتفاق ہے کہ اس کی اجازت ہے، جُدامہ بنت وہب کی روایت میں جس میں نبی نے اس سے منع کرنے کا ارادہ کیا، پھر ذکر کیا کہ روم اور فارس نے اپنے بچوں کو نقصان پہنچائے بغیر ایسا کیا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17517} حاملہ عورت سے ہمبستری: بعض فقہاء نے اسے ناپسندیدہ قرار دیتے ہوئے کہا کہ 'اپنے بچوں کو چھپ کر قتل نہ کرو'۔ اکثریت نے اس کی اجازت دیتے ہوئے اس شخص کی رپورٹ کا حوالہ دیا جس نے نبی سے دستبرداری کے بارے میں پوچھا اور کہا گیا کہ اگر ضرورت ہو تو کوئی حرج نہیں کیونکہ اس سے فارس اور روم کو کوئی نقصان نہیں پہنچا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17517}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.17518} جماع کے اثرات: (a) یہ مکمل مہر کی تصدیق کرتا ہے، احناف، شافعیہ، مالکیوں اور حنبلیوں کے نزدیک مقصد کی تکمیل چونکہ ہے۔ ⁦(ب)⁩ یہ سورۃ الاحزاب کی آیت سے طلاق کے بعد عدت قائم کرتا ہے۔ (c) یہ وہ فعل ہے جو بیعت کو باطل کرتا ہے۔ (d) صحیح نکاح میں، اس قسم کا جماع جس میں غسل ضروری ہے، زنا کے لیے احسان کی شرط ہے۔ حنفیہ، حنبلی اور مالکیہ کے نزدیک اگر شوہر بیوی کو واپس لینے کا ارادہ رکھتا ہو، شافعیوں کے خلاف، یہ رجعی طلاق کو بحال کرتا ہے۔ (f) طلاق کی اجازت پر اس کا اثر، طلاق کے تحت تفصیلی تقسیم۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17518}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17519} طلاق پر جماع کا اثر، جاری ہے: بیوی پر حلال طلاق اس وقت دی جاتی ہے جب وہ حالتِ حیض یا پاکیزگی کی حالت میں ہو۔ حمل واضح ہے. غیر قانونی طلاق وہ ہے جسے حیض کے دوران یا اس پاکیزگی میں دیا گیا ہو جس میں جماع ہوا ہو۔ جو بیوی ابھی تک پوری نہیں ہوئی اس کے لیے حیض یا طہارت کے دوران طلاق دینا جائز ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17520} اس بارے میں کہ آیا بدعت طلاق نافذ ہوتی ہے: جمہور احناف، شافعی، مالکیہ اور حنبلی اس کے نافذ العمل ہونے کو کہتے ہیں، اور شوہر گنہگار ہے، ابن عمر کا یہ حوالہ دیتے ہوئے کہ نبی نے حیض کے دوران بیوی کو طلاق دینے کا حکم دیا تھا۔ ابن تیمیہ، ابن القیم، ابن حزم اور شوکانی اور ابن عمر اور طاؤس کی طرف منسوب قول کے نزدیک اس کا اثر نہیں ہوتا، کیونکہ یہ رسول اللہ کے حکم کے خلاف ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17520}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17521} زنا کے لیے حد پر جماع کا اثر: وہ جماع جو حد کو متحرک کرتا ہے وہ ہے کم از کم ایک بالغ ممبر کا سر ڈالنا۔ اندام نہانی جو مرد کی اپنی ملکیت نہیں ہے یا اسلام کی سرزمین میں شک کا شکار ہے۔ زنا کے تحت تفصیل. {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17521} غسل پر جماع کا اثر: دو ختنہ شدہ اعضاء ⁦(سر کا اندام نہانی میں جانا)⁩ کا ملنا مرد اور عورت کے لیے عائشہ ا کی روایت میں ہے، اور ابوہریرہ کی روایت سے اگر وہ ایضاً کا اضافہ بھی نہیں کرتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17521} تین طلاق دینے والی عورت پر جماع کا اثر: وہ اپنے پہلے شوہر کے لیے حلال نہیں ہو سکتی جب تک کہ وہ دوسرے شوہر سے نکاح نہ کر لے، سورۃ البقرہ کی آیت ہے۔ جمہور کا خیال ہے کہ وہ پہلے کے لیے حلال نہیں ہے جب تک کہ دوسرا شوہر اس سے جماع نہ کرے، ختنہ شدہ اعضاء کے ملنے کے ساتھ، حتیٰ کہ انزال کے بغیر۔ سعید بن المسیب کہتے ہیں کہ پہلی اس سے دوبارہ نکاح کر سکتی ہے اگر دوسری شادی صحیح ہو اور اس کا مقصد اسے حلال نہ ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17521}{cite:fiqh-Mawsua-kuwaitiyya-noor-v3 p.17522} شادی کے تعلق پر جماع کا اثر: اس میں کوئی اختلاف نہیں ہے کہ بیٹی کے ساتھ عقد اس کی ماں کو بنا دیتا ہے، خواہ بہت زیادہ ہو، اکیلے کے لیے، خواہ وہ عقد غیر قانونی ہو یا نہ ہو۔ بیٹوں اور باپوں کی بیویاں. سوتیلی بیٹی پر دو شرطیں حرام ہیں، ماں کے ساتھ عقد اور ماں سے جماع۔ جماع کے بغیر ممانعت نہیں ہوتی۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17522} جماع کا کفارہ پر اثر: (1) حائضہ بیوی سے جماع۔ چار قول: احناف اور شافعی کا قول کوئی کفارہ نہیں، صرف ایک دینار یا آدھا دینار مستحب ہے۔ ابن عباس سے روایت ہے کہ حنبلی اور ایک شافعی کا قول ہے کہ شوہر کے انتخاب پر ایک دینار یا آدھا دینار ضروری ہے۔ مالکیوں، الثوری، ال لیث اور ایک احمد کی رپورٹ میں صرف توبہ اور استغفار کی ضرورت ہے۔ حسن بصری اور سعید بن المسیب رمضان میں جماع کا کفارہ چاہتے ہیں۔ (2) رمضان میں روزے کی حالت میں جماع کرنا: اکثر علماء نے رمضان میں اپنی بیوی سے جماع کرنے والے شخص کے ابوہریرہ کی روایت سے کہ انزال ہو یا نہ ہو اس دن کا کفارہ اور قضاء لازم ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ17522}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17523} دورانِ حج جماع: فقہاء کا اتفاق ہے کہ جو حاجی جماع کرے اسے عرفہ میں کھڑے ہونے سے پہلے قربانی کرنا چاہیے۔ حنفیہ کو بھیڑ اور شافعی، مالکیہ اور حنبلی کو اونٹ چاہیے۔ کھڑے ہونے کے بعد اور پہلی رہائی سے پہلے جماع کے لیے اونٹ کی ضرورت ہے۔ پہلی رہائی کے بعد حنفیہ، شافعی اور حنبلی کو ایک بکری اور مالک کو اونٹ کی ضرورت ہے۔ جماع اور روزہ: فقہاء اس بات پر متفق ہیں کہ رمضان کے روزے دار کے جماع سے روزہ ٹوٹ جاتا ہے، خواہ انزال ہو یا نہ ہو۔ اگر بھول جائے تو جمہور احناف، شافعی، ایک احمد، ثوری، الحسن اور مجاہد کا روزہ باطل نہیں ہوتا۔ مالکیوں، حنبلیوں اور عطاء کے مکتب کا نظریہ اسے ایک قصداً فعل کی طرح باطل قرار دیتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17524}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17525} جماع اور حج: فقہاء کرام کا اتفاق ہے کہ عرفات میں کھڑے ہونے سے پہلے جماع کرنا باطل ہے اور بعد میں اس پر عمل کرنا ضروری ہے۔ اور یہ کہ کھڑے ہونے اور پہلی ریلیز کے بعد اسے باطل نہیں کرتا۔ کھڑے ہونے اور پہلے نکلنے کے درمیان شافعی، مالکیہ اور حنبلی اس سے حج کو باطل کرتے ہیں، جبکہ احناف کے نزدیک ایسا نہیں ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17525} مصحف پر چلنا: اس میں کوئی اختلاف نہیں کہ جو مسلمان حقارت کے لیے اس پر چلتا ہے وہ مرتد ہو جاتا ہے۔ مجبوری یا ضرورت کے تحت وہ ایسا نہیں کرتا۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 ص17525} قبروں پر چلنا: قبر کی تعظیم ہے لہٰذا اس پر چڑھنا یا اس پر بیٹھنا جمہور کے نزدیک عقبہ بن عامر کی روایت اور ابن مسعود سے منسوب الفاظ ہیں۔ شافعی اور حنبلی اسے ناپسند کرتے ہیں سوائے ضرورت کے۔ شافعیوں کے نزدیک قبروں کے درمیان چلنا ناپسندیدہ ہے، جب کہ حنبلی جوتے میں نہیں بلکہ جوتے میں اسے ناپسند کرتے ہیں۔ احناف اس پر بیٹھنا ناپسند کرتے ہیں سوائے ضرورت کے۔ مالکیہ اس کو ناپسند کرتے ہیں ان شرائط میں: قبر اٹھائی جاتی ہے، راستہ اس کے پاس ہوتا ہے اور کچھ ہڈیاں باقی رہ جاتی ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17525}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17526} پاؤں سے چلنے والے جانور: حنفیہ، مالکیہ، شافعیہ اور حنبلی اس بات پر متفق ہیں کہ جو جانور اپنے پاؤں سے روندتا ہے، اس کے سر کے ساتھ اس کے سر کو روندنے کی ضرورت ہے۔ سوار، رہنما یا ڈرائیور، جب نقصان کو اس کی غلطی یا غفلت سے منسوب کیا جا سکتا ہے۔ اگر نہیں تو کوئی ذمہ داری نہیں، اس قول پر کہ 'جانور کا زخم ناقابل سزا ہے'۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17526}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.17527} الشافعی ہاتھ، منہ، پاؤں یا دم سے مارنے والے لیڈر، ڈرائیور اور سوار کو ذمہ دار ٹھہراتے ہیں، اور جو ایک ہی چیز کو روندنے کے قابل ہے۔ النووی نے نوٹ کیا ہے کہ بازاروں میں ڈھیٹ جانور پر سوار نہیں ہو سکتا۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص17527}"
  id: "Kata \"waṭʿ\" ⁦(وطء)⁩ dalam bahasa Arab berarti berada di atas sesuatu, dan digunakan untuk merujuk pada hubungan seksual, yaitu memasukkan penis ke dalam vagina hingga keduanya menyatu. Makna teknisnya tidak menyimpang dari makna linguistiknya. Istilah terkait: Nikah ⁦(نكاح)⁩, yang awalnya berarti bergabung dan berkumpul, dan secara harfiah digunakan untuk merujuk pada kontrak pernikahan dan secara metaforis pada hubungan seksual, atau sebaliknya, tergantung pada perbedaan pendapat di antara para ahli bahasa dan ahli hukum. Sodomi adalah tindakan berhubungan seksual dengan laki-laki, dan termasuk dalam makna yang lebih luas dari \"waṭʿ\". Pertama: \"Waṭʿ\" dalam arti hubungan seksual. Kategorinya: Sah, yaitu hubungan seksual dengan istri, baik istri maupun selir. Hubungan seksual mungkin dilarang karena faktor-faktor seperti menstruasi, pendarahan setelah melahirkan, zihar (bentuk perceraian) sebelum penebusan dosa, ihram (keadaan penyucian ritual), puasa, dan i'tikaf (pengasingan di masjid). Dan yang dilarang, yang mengharuskan pelarangan, ada dua jenis: yang diperbolehkan, seperti berhubungan seksual dengan wanita asing di vaginanya, yang membawa hukuman perzinahan; dan yang tidak pernah diperbolehkan, seperti sodomi, hubungan seksual anal, dan bestialitas. Alasan diperbolehkannya hubungan seksual adalah: kontrak pernikahan dan kepemilikan budak perempuan. Adapun kepemilikan budak perempuan, tidak ada perbedaan pendapat mengenai diperbolehkannya berhubungan seksual dengan budak perempuan tanpa kontrak pernikahan, karena kepemilikan atas orang tersebut menyiratkan kepemilikan atas manfaatnya. Al-Quran memperbolehkan hal ini dengan menyebutkan istri-istri orang beriman dan hamba sahaya mereka, merujuk pada Surah Al-Mu'minun tanpa secara eksplisit menyebutkannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17484} Putusan hukum: Mayoritas ahli hukum berpendapat bahwa hubungan suami istri pada prinsipnya diperbolehkan, dan tidak secara inheren menyiratkan ketaatan atau ketidaktaatan. Hubungan suami istri dapat menjadi anjuran jika disertai dengan niat yang benar, seperti mencari kesucian melalui cara yang halal dan menghindari cara yang haram. Hubungan suami istri dapat menjadi wajib jika merupakan satu-satunya cara untuk menjaga kesucian diri. Hubungan suami istri dapat dilarang atau tidak disukai tergantung pada keadaan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17484}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17485} Tujuan hukum hubungan suami istri menurut Ibn al-Qayyim: Pelestarian keturunan, pelepasan air mani yang berbahaya jika ditahan, pemenuhan keinginan, dan pencapaian kesenangan. Di antara manfaatnya adalah menundukkan pandangan, menahan diri, dan mencapai kesucian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17485}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17486} Pahala hubungan seksual yang halal: Hadits Abu Dzar menyatakan, \"Ada sedekah dalam hubungan seksual salah seorang dari kalian.\" Mayoritas ulama sepakat bahwa seorang pria akan mendapat pahala karena berhubungan seksual dengan istrinya jika ia memiliki niat yang baik, seperti untuk memuaskan keinginannya sendiri atau keinginan istrinya, untuk memenuhi hak-hak istrinya dengan cara yang benar, atau untuk mendapatkan anak yang saleh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17486} Namun, jika ia tidak bermaksud selain untuk memuaskan keinginannya, para ulama berbeda pendapat: Ibn Qutaybah mengatakan ia akan mendapatkan pahala tanpa syarat, sedangkan Ibn Hajar al-Haytami dan sekelompok ulama mengatakan ia tidak akan menerima pahala jika ia tidak bermaksud melakukan hal-hal tersebut. Telah dilaporkan bahwa seorang Muslim akan mendapatkan pahala karena berinfak untuk keluarganya jika ia melakukannya dengan niat mencari pahala dari Allah. Jika ini merupakan syarat untuk pengeluaran wajib, maka hal ini lebih berlaku lagi untuk hubungan suami istri yang diperbolehkan, sebagaimana yang telah ditetapkan dalam Al-Quran. Etika dan Anjuran Berhubungan Seks: Dianjurkan untuk memulai dengan mengucapkan \"Bismillah\" (Dengan nama Allah), berpaling dari arah kiblat sebagai tanda hormat kepada wanita, memulai dengan belaian, pelukan, dan ciuman untuk membangkitkan hasratnya, untuk memastikan kesesuaian dalam memenuhi hasrat, bagi mereka untuk menutupi diri dengan pakaian, merendahkan suara dan berbicara sedikit, tidak disukai bagi seorang pria untuk berhubungan seks saat dilihat atau didengar, dan diharamkan jika alat kelamin terbuka. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17487}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17488} Dianjurkan bagi orang yang ingin berhubungan seks untuk kedua kalinya untuk mencuci alat kelaminnya dan berwudu, dan mencuci lebih diutamakan. Buku ini menyebutkan apa yang diriwayatkan tentang Nabi bahwa beliau mengunjungi istri-istrinya dengan sekali berwudhu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17488}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17489} Berbicara tentang hubungan seksual dan membocorkan rahasianya: Para ahli fiqih berbeda pendapat; Mazhab Hanafi dan Hanbali, dalam satu pendapat yang dianut oleh al-Mardawi dan al-Nawawi, berpendapat bahwa membual tentang hubungan seksual dan membocorkan apa yang terjadi antara suami istri adalah haram, berdasarkan hadits Abu Sa'id tentang orang-orang yang paling buruk kedudukannya, dan hadits, \"Menyebarkan rumor adalah haram.\" Ibn al-Qayyim dan al-Haytami menganggapnya sebagai dosa besar. Mazhab Hanbali, dalam pemikiran mereka, berpendapat bahwa tidak disukai bagi suami istri untuk membicarakan apa yang terjadi di antara mereka, bahkan dengan istri kedua mereka. Terdapat sembilan halangan untuk hubungan seksual yang diperbolehkan. Para ulama sepakat mengenai enam di antaranya: haid, pendarahan setelah melahirkan, berdiam diri di masjid (i'tikaf), puasa, berada dalam keadaan ihram (suci ritual), dan zihar (bentuk perceraian) sebelum penebusan dosa. Mereka berbeda pendapat mengenai tiga hal lainnya: pendarahan vagina yang tidak teratur (istihada), gagal melakukan ghusl (mandi ritual) setelah bersuci dari haid, dan tinggal di wilayah musuh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17490} Pertama: Haid. Para ulama sepakat mengenai larangan hubungan seksual dengan wanita yang sedang haid, berdasarkan ayat dalam Surah Al-Baqarah (ayat tersebut disebutkan dalam surah tanpa mengutip kata-kata tepatnya), dan ayat mengenai keintiman dengan wanita yang sedang haid: “Lakukanlah segala sesuatu kecuali hubungan seksual.” Kedua: Pendarahan pascapersalinan. Para ahli fiqih sepakat tentang larangan hubungan seksual dengan wanita yang mengalami pendarahan pascapersalinan, dan bahwa hukum mengenai pendarahan pascapersalinan dalam hal larangan hubungan seksual, penyucian ritual, dan penebusan dosa sama dengan hukum mengenai menstruasi. Ketiga: Pendarahan vagina tidak teratur. Para ahli fiqih berbeda pendapat tentang kebolehan hubungan seksual dengan wanita yang mengalami pendarahan vagina tidak teratur; Mayoritas ulama Hanafi, Syafi'i, dan Maliki, serta Ahmad dalam salah satu dari dua riwayat, memperbolehkannya. Ibn al-Mundhir meriwayatkan ini dari Ibn Abbas, Sa'id ibn al-Musayyib, al-Hasan, Ata', Qatadah, dan lainnya. Mereka berpendapat bahwa seorang wanita yang mengalami istihaadah (pendarahan rahim abnormal) dianggap suci secara ritual dari menstruasi, dan bahwa Hamnah binti Jahsh mengalami istihaadah dan suaminya melakukan hubungan seksual dengannya. {kutipan:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17491} Istihaadah: Pendapat kedua, yang dipegang oleh sebagian ulama, adalah bahwa hubungan seksual dengan wanita yang mengalami istihaadah tidak diperbolehkan karena darah tersebut adalah darah menstruasi, dan dengan demikian dianggap sebagai darah menstruasi yang ada padanya, sehingga menetapkan larangan dalam kasusnya. {kutipan:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17492} Keempat: I'tikaf (pengasingan di masjid). Para ahli fiqih sepakat tentang larangan hubungan seksual selama i'tikaf, dan bahwa hal itu membatalkannya, baik di malam hari maupun di siang hari, jika dilakukan dengan sengaja, berdasarkan ayat dalam Surah al-Baqarah (dan detailnya ada di bab tentang i'tikaf). Kelima: Puasa. Para ahli fiqih sepakat bahwa hubungan seksual yang disengaja diharamkan bagi orang yang berpuasa selama Ramadan, dan bahwa hal itu membatalkan puasa dan mewajibkan penebusan dosa, baik terjadi ejakulasi atau tidak. Hal ini didukung oleh hadits Abu Hurairah tentang seorang pria yang berhubungan seksual dengan istrinya di siang hari selama Ramadan dan diperintahkan untuk melakukan penebusan dosa, kemudian diberi kurma untuk disedekahkan. Masalah ini telah dikembalikan ke tempatnya yang semestinya. Keenam: Ihram. Para ahli fiqih sepakat bahwa hubungan seksual diharamkan bagi orang yang sedang ihram untuk haji atau umrah, berdasarkan ayat dalam Surah Al-Baqarah, di mana \"rafath\" diartikan sebagai hubungan seksual dan pendahuluannya, termasuk ucapan cabul. Ini adalah indikasi yang lebih kuat atau teks eksplisit tentang masalah ini. Hubungan seksual selama keadaan ihram adalah pelanggaran yang membatalkan ritual jika terjadi sebelum berdiri di Arafat, tetapi tidak membatalkannya setelah tahap pertama keluar dari ihram. Para ulama berbeda pendapat mengenai hukum antara berdiri di Arafat dan tahap pertama keluar dari ihram. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493} Ketujuh: Zihar (suatu bentuk perceraian). Tidak ada perbedaan pendapat mengenai larangan berhubungan seksual dengan istri sebelum penebusan dosa, berdasarkan ayat dalam Surah Al-Mujadilah dan hadits Ibnu Abbas tentang seorang pria yang berhubungan seksual dengan istrinya sebelum penebusan dosa. Nabi memerintahkannya untuk memohon ampunan dan melarangnya mengulangi perbuatan tersebut sampai ia menebus dosanya. Demikian pula, dilarang bagi seorang istri untuk membiarkan suaminya berhubungan seksual dengannya sebelum penebusan dosa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493} Kedelapan: Seorang Muslim berhubungan seksual dengan istrinya di wilayah musuh. Mayoritas ulama Hanafi, Maliki, dan Syafi'i berpendapat bahwa hal itu tidak disukai karena dikhawatirkan akan memiliki keturunan di negeri yang sedang berperang, karena seorang Muslim dilarang menetap di wilayah musuh. Mereka mengutip hadits Jarir tentang penolakan terhadap orang-orang yang tinggal di antara kaum musyrik, yang oleh al-Bukhari dianggap mursal (hadits dengan mata rantai periwayatan yang hilang). Namun, mazhab Hanbali berpendapat bahwa seorang pria tidak boleh berhubungan intim dengan istrinya di wilayah musuh kecuali karena kebutuhan, dalam hal ini coitus interruptus (hubungan seksual yang terputus) hukumnya wajib. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494} (b) Hubungan Seksual yang Dilarang: Contohnya termasuk perzinahan, sodomi, hubungan seksual anal dengan istri sendiri atau orang asing, nekrofilia, dan bestialitas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494} Pertama: Perzinahan dilarang menurut konsensus para ulama dan merupakan salah satu dosa terbesar, sebagaimana dinyatakan dalam ayat Surah Al-Isra, tanpa mengutipnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494} Kedua: Sodomi: Para ulama sepakat bahwa perbuatan ini sangat dilarang dan merupakan salah satu dosa besar. Al-Mawardi mengatakan bahwa ini adalah dosa yang paling berat dan bahwa tidak seorang pun di dunia sebelum kaum Luth pernah melakukan sodomi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494} Hukuman untuk sodomi: Para ahli fiqih berbeda pendapat mengenainya dalam enam pandangan, dan buku ini menyajikan pandangan-pandangan tersebut sebagai berikut: Pendapat pertama dari mazhab Syafi'i dan Hanbali, serta Abu Yusuf, Muhammad, Al-Thawri, Al-Awza'i dan Abu Thawr, yaitu bahwa hukuman untuk sodomi sama seperti hukuman untuk zina, sehingga orang yang sudah menikah dirajam dan orang yang belum menikah dicambuk, dan mereka mengutip hadits Abu Musa bahwa jika seorang pria datang kepada pria lain, mereka berdua adalah pezina, dan hadits ini dianggap oleh Al-Bayhaqi memiliki sanad yang lemah. Pendapat kedua, yang dipegang oleh Abu Hanifa, Hammad ibn Abi Sulayman, dan al-Hakam, adalah bahwa tidak ada hukuman yang ditetapkan untuknya, melainkan hukuman diskresioner dan penjara sampai mati atau sampai bertaubat. Jika seseorang secara terbiasa melakukannya atau mengulanginya, Imam akan menghukum mati dia pada pelanggaran kedua, karena itu tidak dianggap sebagai perzinahan. Pendapat ketiga, yang dipegang oleh mazhab Maliki, adalah bahwa hukuman yang ditetapkan adalah rajam dalam semua kasus, baik untuk pasangan yang aktif maupun pasif, baik yang sudah menikah maupun belum menikah. Mereka mendasarkan argumen mereka pada hadits umum, \"Barangsiapa kamu mendapati dirinya melakukan perbuatan kaum Luth, bunuhlah pasangan yang aktif maupun pasif.\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17495}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17496} Pendapat keempat dari al-Shafi'i, menurut pendapat Ishaq ibn Rahwayh, adalah bahwa dia harus dibunuh dengan pedang seperti orang murtad, baik yang sudah menikah maupun belum menikah. Kitab ini mengaitkan pendapat ini kepada sekelompok Sahabat dan Pengikut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17496} Pendapat kelima dan keenam tidak disajikan secara lengkap di halaman ini. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17496} Hubungan seks anal dengan istri atau budak perempuan: Ini diriwayatkan dari sekelompok Sahabat dan Pengikut. Al-Mawardi mengatakan bahwa ini adalah pendapat para Sahabat, mayoritas Pengikut, dan para ahli fiqih. Sejumlah ahli fiqih, termasuk Ibn al-Nahhas, al-Haytami, dan Ibn al-Qayyim, menyatakan bahwa itu adalah dosa besar. Mereka berpendapat bahwa tidak ada hukuman yang ditentukan (hadd) untuk itu karena fakta bahwa istri atau budak perempuan adalah objek kepuasan seksual menciptakan keadaan yang meringankan yang menghalangi penerapan hadd. Namun, mereka berpendapat bahwa hukuman ta'zir (hukuman yang bersifat opsional) adalah wajib menurut mayoritas ulama, sebagaimana dinyatakan secara eksplisit oleh mazhab Hanafi, Maliki, dan Hanbali. Mazhab Syafi'i juga mewajibkannya jika perbuatan tersebut diulang. Para ahli fiqih berpendapat bahwa hal itu dilarang berdasarkan hadits-hadits tentang masalah ini, yang disebutkan dalam buku ini beserta referensinya, dan berdasarkan fakta bahwa anus bukanlah tempat untuk berhubungan seksual, bahwa hal itu menyebabkan kerusakan permanen, dan bahwa hal itu merampas hak perempuan untuk mendapatkan kepuasan seksual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17498}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17499} Diriwayatkan dari Ibnu Umar dalam riwayat lain, dan dari Zaid bin Aslam, Nafi' dan sebagian ulama Syafi'i, dan dinisbahkan kepada Malik dalam satu pernyataan, tentang kebolehan berhubungan intim dengan istri melalui anus; dan para ulama menolak argumen berdasarkan ayat tersebut, dengan alasan bahwa \"anna\" berarti \"dari mana,\" dan bahwa tafsiran Muhammad bin Ka'b al-Qurazi ditolak, dan bahwa riwayat-riwayat dari Ibnu Umar, Nafi' dan Malik ditegakkan untuk menyangkalnya atas otoritas mereka; dan kitab tersebut menyebutkan hal itu tanpa menetapkan hukumnya sendiri. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17499}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17501} Keempat: Hubungan seks anal dengan wanita asing: Tidak ada perbedaan pendapat tentang larangannya dan bahwa itu adalah salah satu dosa besar. Para ahli fiqih berbeda pendapat tentang hukumannya, dengan empat pendapat: Pertama, menurut mazhab Maliki, Hanbali, Syafi'i, dan dua sahabat mazhab Hanafi, hukumannya sama dengan perzinahan; kedua, menurut Abu Hanifa dan satu pendapat mazhab Syafi'i, tidak ada hukuman untuknya, melainkan hukuman berdasarkan kebijaksanaan; ketiga, menurut Hakim Abu al-Hasan dari mazhab Maliki, hukumannya sama dengan sodomi, dan Ibnu Aqi'ah al-Hanbali mengatakan bahwa hukumannya sama dengan hukuman sodomi; Dan yang keempat, menurut sebagian mazhab Syafi'i, hukumannya adalah kematian dengan pedang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17501}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17502} Kelima: Berhubungan intim dengan wanita yang sudah meninggal: Tidak ada perbedaan pendapat tentang larangannya, dan Al-Haytami menganggapnya sebagai salah satu dosa besar. Mereka berbeda pendapat mengenai hukumannya, dengan dua pendapat: Yang pertama, menurut mazhab Hanafi dan Syafi'i dengan pendapat yang paling benar dan mazhab Hanbali dengan pendapat yang paling dapat diandalkan, adalah bahwa tidak ada hukuman hadd untuk itu, tetapi ada hukuman ta'zir untuk itu; Dan yang kedua, menurut pendapat mazhab Maliki yang terkenal dan mazhab Syafi'i yang bertentangan dengan pendapat yang paling benar dan sebagian mazhab Hanbali, serta pernyataan Al-Awza'i, adalah bahwa ada hukuman hadd untuk perbuatan itu, dan mazhab Maliki membuat pengecualian untuk istri pada saat kematiannya, sehingga tidak ada hukuman hadd bagi suaminya karena berhubungan intim dengannya. Keenam: Perzinaan: Para ahli fiqih sepakat tentang larangannya. Buku ini menyebutkan bukti yang mereka kutip dari makna umum ayat dalam Surah Al-Mu'minun dan dari hadits Abu Hurairah tentang orang yang terkutuk. Beberapa hadits dijelaskan dalam catatan kaki sebagai hadits yang memiliki sanad yang lemah. Sekelompok ahli fiqih menganggapnya sebagai dosa besar. Para ahli fiqih berbeda pendapat tentang hukuman untuk perzinaan, dengan empat pendapat. Buku ini tidak sepenuhnya menyajikan pendapat-pendapat tersebut di sini. Pendapat pertama dinisbahkan kepada Jabir ibn Zayd, Al-Hasan ibn Ali, Al-Hasan Al-Basri, Al-Shafi'i, dan Ahmad dalam salah satu pendapatnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17503} Hukuman untuk Perbuatan Cabul (Kelanjutan Pendapat): Pendapat ketiga, dinisbahkan kepada al-Zuhri, adalah bahwa hukuman yang lebih ringan dari dua hukuman yang ditentukan adalah seratus cambukan, baik orang tersebut sudah menikah maupun belum menikah. Pendapat keempat, yang dianut oleh mayoritas ahli hukum dari mazhab Hanafi dan Syafi'i (menurut pandangan yang paling umum), dan mazhab Maliki dan Hanbali (menurut pandangan yang mapan), adalah bahwa hukuman yang ditentukan tidak berlaku, tetapi hukuman diskresioner diperlukan. Hal ini diriwayatkan dari Ibnu Abbas, Ata, al-Sha'bi, al-Nakha'i, al-Hakam, al-Thawri, dan Ishaq. Mazhab Hanafi mengatakan bahwa Imam memiliki wewenang untuk membunuh pelaku jika ia berulang kali melakukan perbuatan tersebut. Al-Biri berpendapat bahwa hukuman harus dijatuhkan pada pelanggaran kedua, sedangkan mazhab Hanbali lebih ketat dalam hukuman yang mereka berikan. Mayoritas berpendapat bahwa perbuatan keji terhadap hewan adalah perbuatan tercela yang harus diperbaiki dengan paksa, dan tidak ada hadits sahih dari Nabi yang menetapkan kewajiban hukuman yang telah ditentukan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17504} Seorang wanita yang membiarkan hewan berhubungan intim dengannya, seperti anjing atau monyet, dianggap oleh mazhab Hanafi, Syafi'i, Maliki, dan Hanbali sebagai perbuatan keji terhadap hewan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17504} Membunuh hewan yang telah dipaksa berhubungan intim: Ada tiga pendapat tentang masalah ini. Mazhab Hanafi, Maliki, dan Syafi'i, menurut pandangan yang paling benar, tidak mewajibkan pembunuhan hewan tersebut karena lemahnya hadits yang memerintahkan pembunuhannya, dan karena Nabi Muhammad shalla Allahu alaihi wa sallam melarang penyembelihan hewan kecuali untuk makanan. Mazhab Hanafi menganjurkan penyembelihan dan kemudian membakarnya jika hewan tersebut tidak dimakan. Mazhab Hanbali dan satu pandangan dalam mazhab Syafi'i mewajibkan pembunuhan hewan tersebut secara mutlak, dengan mengutip hadits, \"Barangsiapa bersetubuh dengan binatang, bunuhlah dia dan bunuhlah binatang itu bersamanya.\" Pandangan ketiga, yang dinisbahkan kepada al-Tahawi, mewajibkan pembunuhan hewan hanya jika hewan tersebut milik orang yang bersetubuh dengannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17504}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17505} Jika hewan tersebut bukan milik orang yang bersetubuh dengannya, terdapat perbedaan pendapat mengenai kompensasinya. Mazhab Syafi'i berpendapat bahwa hewan tersebut harus dibunuh, dan mazhab Hanbali, menurut pandangan mereka yang sudah mapan, mewajibkan pelaku untuk membayar ganti rugi. Mazhab Hanafi meyakini bahwa pemilik harus membayar nilai hewan tersebut, dan kemudian hewan tersebut disembelih. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17505} Mengenai memakan hewan yang telah disetubuhi setelah disembelih, ada tiga pendapat. Mazhab Hanbali, dua sahabat Abu Hanifa dari mazhab Hanafi, dan satu pendapat dalam mazhab Syafi'i melarang memakannya. Sebuah riwayat dari Ahmad menyatakan bahwa hal itu tidak disukai tetapi tidak dilarang. Mazhab Hanafi, dalam satu pendapat, dan Abu Hanifa, mazhab Maliki, dan mazhab Syafi'i, memperbolehkan memakannya tanpa rasa tidak suka, berdasarkan kebolehan umum mengonsumsi hewan ternak dalam Surah Al-Ma'idah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17506} Hubungan seksual dengan kedok pernikahan: Ini adalah hubungan seksual terlarang yang tidak memerlukan hukuman yang ditentukan karena adanya kemiripan pernikahan yang meniadakan niat zina. Rincian klasifikasi kemiripan pernikahan dibahas dalam babnya masing-masing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17506} Hukum tentang hubungan seksual. Hak istri atas suaminya mengenai hubungan seksual: Istri berhak untuk berhubungan intim dengannya dan agar suaminya memenuhi keinginannya. Buku ini mengutip hadits Abdullah ibn Amr ibn al-Aas mengenai hak istrinya atas dirinya, dan hadits Abu al-Darda' mengenai puasa, salat, dan hubungan seksual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17506}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17507} Definisi hak ini dan hukumnya: Para ulama berbeda pendapat mengenai hal ini, dengan empat pandangan berbeda. Mazhab Hanafi dan sebagian Mazhab Syafi'i berpendapat bahwa seorang istri berhak meminta hubungan seksual dari suaminya, dalam hal ini suami wajib melakukan hubungan seksual sekali secara hukum, dan lebih dari sekali merupakan kewajiban agama. Namun, Mazhab Syafi'i berpendapat bahwa suami tidak wajib melakukan hubungan seksual secara hukum, dan tidak ada dosa jika tidak melakukannya, meskipun dianjurkan agar ia tidak mengabaikannya demi perlindungan istrinya. Pendapat lain tidak dibahas secara lengkap di halaman ini. Mengenai hak istri untuk berhubungan seksual (pendapat lanjutan): Mazhab Maliki, dalam pandangan mereka yang lebih disukai, menyatakan bahwa istri berhak atas satu malam dari setiap empat malam. Abu al-Hasan al-Saghir meriwayatkan dari Abu Imran berbagai pendapat mengenai jumlah minimal malam yang boleh dilakukan: satu malam dari empat, atau satu malam dari tiga. Umar memutuskan bahwa sebaiknya dilakukan sekali selama masa suci karena dapat menyebabkan kehamilan. Pendapat keempat, yang dianut oleh mazhab Hanbali, adalah bahwa seorang suami harus berhubungan intim dengan istrinya sekali setiap empat bulan jika ia tidak memiliki alasan. Mereka berpendapat bahwa hubungan intim adalah hak bagi keduanya, dan bahwa istri berhak untuk menyetujui coitus interruptus (hubungan intim terputus). Menurut Ibn Taymiyyah dan Ibn al-Qayyim, seorang pria harus berhubungan intim dengan istrinya secara wajar, sesuai dengan kebutuhan istri dan kemampuannya, tanpa menentukan sekali sebulan atau seminggu, dan bahwa hal ini harus ditentukan oleh adat. Beberapa ulama mengatakan bahwa ia harus memuaskan istrinya secara seksual sebagaimana ia memuaskannya dengan makanan, dan ini adalah pendapat yang disukai oleh Ibn Taymiyyah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17508}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17509} Jika mereka berselisih, hakim akan memutuskan menurut adat dan keadaan suami istri. Menurut Ibnu Taymiyyah, bahaya yang disebabkan oleh menahan diri dari hubungan seksual mengharuskan pembatalan pernikahan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17509} Hak suami atas istrinya mengenai hubungan seksual: Suami boleh meminta hubungan seksual dari istrinya kapan pun ia mau, kecuali dalam kasus halangan yang sah seperti menstruasi, pendarahan setelah melahirkan, zihar (suatu bentuk perceraian), dan ihram (pengudusan ritual). Dalam kasus tersebut, istri wajib menurutinya setelah halangan tersebut dihilangkan. Al-Dhahabi, Al-Rafi'i, Al-Nawawi, Ibn Al-Rif'ah, dan Al-Haytami menganggap penolakan perempuan tanpa alasan yang sah sebagai kedurhakaan dan dosa besar, karena adanya peringatan terhadap hal tersebut. Kitab ini mengutip hadits Abu Hurayrah tentang para malaikat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17509}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510} Adapun laki-laki, ia tidak wajib menjawab jika perempuan memanggilnya kecuali jika ia bermaksud mencelakainya, dalam hal ini hal itu dilarang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510} Hak istri untuk berpisah karena ketidakmampuan suami untuk melakukan hubungan seksual (kastrasi, impotensi, atau impotensi lainnya): Para ahli hukum membedakan antara ketidakmampuan yang ada pada saat akad nikah dan yang terjadi setelah hubungan seksual, dan antara pengetahuan wanita tentang cacat tersebut pada saat akad nikah dan ketidaktahuannya. Rincian lebih lanjut dapat ditemukan dalam bab tentang perceraian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510} Hak suami untuk pembatalan pernikahan jika istri memiliki cacat yang mencegah hubungan seksual (seperti selaput dara yang tidak berlubang atau robekan selaput dara vagina). Ada dua pendapat yang berbeda mengenai hal ini, dan rincian lebih lanjut dapat ditemukan dalam bab yang bersangkutan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510} Penolakan seorang pria untuk melakukan hubungan seksual dengan istrinya, melalui ila' atau zihar. Ila’ (sumpah untuk berpantang dari hubungan suami istri): Tidak ada perbedaan pendapat bahwa seorang pria yang bersumpah untuk berpantang diberi masa tenggang empat bulan, yaitu masa yang disebutkan dalam Surah Al-Baqarah. Jika ia tetap berpantang dari hubungan suami istri hingga masa tenggang berakhir, istri dapat mengajukan kasusnya ke hakim, yang akan memerintahkannya untuk melanjutkan hubungan suami istri. Jika ia menolak, hakim akan memerintahkannya untuk menceraikannya. Jika ia tidak menceraikannya, hakim akan menceraikannya atas namanya. Ini adalah pendapat mayoritas mazhab Syafi'i, Maliki, dan Hanbali. Mazhab Hanafi menyatakan bahwa perceraian berlaku setelah berakhirnya empat bulan tanpa memerlukan campur tangan hakim. Zihar (bentuk perceraian): Mayoritas ahli hukum berpendapat bahwa haram bagi seorang pria yang telah bersumpah zihar untuk melakukan hubungan suami istri dengan istrinya sebelum penebusan. Namun, dalam sebuah riwayat yang dinisbahkan kepada Ahmad, hal itu diperbolehkan jika penebusannya berupa memberi makan fakir miskin. Rincian lebih lanjut dibahas dalam babnya masing-masing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17511} Zihar (lanjutan): Jika suami yang mengucapkan zihar menolak untuk menebus dosa, istri dapat membawa masalah tersebut ke hakim. Hakim kemudian akan memerintahkannya untuk menebus dosa. Jika ia menolak, hakim akan memaksanya melalui tindakan disiplin sampai ia menebus dosa atau menceraikannya. Ini adalah pendapat mazhab Hanafi, karena suami telah merugikan istrinya dengan menjadikannya haram baginya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17512} Mazhab Maliki membedakan antara orang yang tidak mampu menebus dosa dan orang yang mampu menebus dosa: orang yang tidak mampu diceraikan, sedangkan orang yang mampu diberi waktu empat bulan, seperti dalam kasus ila' (sumpah untuk tidak berhubungan badan), setelah itu ia diperintahkan untuk bercerai atau menebus dosa. Mazhab Hanbali menyatakan bahwa suami yang telah menyatakan zihar tidak diperintahkan untuk berhubungan intim karena hal itu dilarang baginya sebelum penebusan. Ia diberi waktu untuk membebaskan seorang budak, memberi makan orang miskin, atau berpuasa, sesuai kemampuannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17512} Hak istri untuk menolak hubungan intim sampai ia menerima maharnya: Para ahli hukum sepakat bahwa jika suami membayar mahar, istri wajib mengizinkannya berhubungan intim jika ia memintanya, dan ia tidak boleh menolaknya jika seluruh mahar ditunda atau sebagian ditunda, karena persetujuannya terhadap penundaan tersebut adalah persetujuan untuk menyerahkan dirinya. Mazhab Hanafi menetapkan bahwa ini bersyarat pada penyempurnaan hubungan intim sebelum tanggal jatuh tempo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17513} Mengenai mahar langsung, mayoritas ahli fiqih dari mazhab Hanafi, Syafi'i, Maliki, dan Hanbali meyakini bahwa istri berhak menolak hubungan intim sampai ia menerima mahar langsung, karena mahar merupakan kompensasi atas hubungan seksual istri, sebagaimana harga barang yang dijual. Ibnu al-Mundhir meriwayatkan konsensus tentang hal ini. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17513} Pengaruh hubungan seksual terhadap hilangnya hak untuk menolak setelah hubungan intim: Ada dua pendapat; Pendapat pertama, yang dipegang oleh Abu Hanifa dan Ibnu Hamid dari mazhab Hanbali, adalah bahwa istri berhak menolak hubungan seksual sampai ia menerima mahar, karena akad nikah didasarkan pada setiap tindakan hubungan seksual. Pendapat kedua, yang dianut oleh Abu Yusuf, Muhammad, mazhab Syafi'i dan Maliki, serta mazhab Hanbali dalam doktrin yang telah ditetapkan, adalah bahwa perempuan tidak memiliki hak ini karena persetujuannya terhadap mahar tetap merupakan hutang. Mengenai mahar yang ditangguhkan dan jatuh tempo sebelum persalinan: ada dua pendapat. Pendapat pertama, yang dianut oleh mazhab Hanafi dalam pandangan yang paling otoritatif, mazhab Syafi'i dalam pandangan yang paling tepat, dan mazhab Hanbali, adalah bahwa perempuan tidak memiliki hak untuk menolak hubungan seksual karena haknya untuk menahan mahar telah hilang karena persetujuannya terhadap penangguhan tersebut. Pendapat kedua, yang dianut oleh mazhab Syafi'i dalam pandangan yang lebih tepat, mazhab Maliki, dan Abu Yusuf, adalah bahwa perempuan memiliki hak untuk menolak hubungan seksual karena hal itu menjadi seperti pembayaran langsung. Abu Yusuf menetapkan bahwa ini bersyarat pada belum terjadinya hubungan seksual sebelum tanggal jatuh tempo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17514}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17515} Pasangan suami istri berselisih tentang siapa yang harus memulai proses persalinan: Mazhab Hanafi dan Maliki meyakini bahwa suami wajib melahirkan terlebih dahulu, dan Malik tidak menyukai istri yang membiarkan suaminya berhubungan intim dengannya sebelum menerima seperempat dinar sebagai hak dari Tuhan; Mazhab Hanbali dan Syafi'i dalam satu pendapat mewajibkan suami terlebih dahulu, kemudian istri; dan Mazhab Syafi'i dalam pendapat yang paling jelas mewajibkan keduanya dengan menitipkan mahar kepada orang yang adil; dan Mazhab Syafi'i dalam pendapat ketiga mengatakan bahwa tidak ada paksaan pada salah satu dari mereka. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17515} Menetapkan syarat tidak adanya hubungan seksual atau larangannya dalam kontrak pernikahan: Mereka sepakat tentang ketidakabsahan syarat yang melarang hubungan seksual, tetapi berbeda pendapat tentang pengaruhnya terhadap kontrak. Mayoritas ulama Syafi'i, Maliki, dan Hanbali menganggap baik syarat maupun kontrak tersebut tidak sah karena bertentangan dengan tujuan kontrak. Mazhab Hanafi menganggap syarat tersebut tidak sah tetapi kontraknya sah karena pernikahan tidak batal karena syarat yang tidak sah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17516} Mengenai syarat tidak melakukan hubungan seksual, ada tiga pendapat: Mazhab Hanafi dan Hanbali menganggap kontrak tersebut sah tetapi syaratnya batal. Mazhab Maliki menganggap baik syarat maupun kontrak tersebut tidak sah, dan ada perbedaan pendapat tentang apakah pembatalan sah sebelum atau setelah hubungan seksual terjadi. Pendapat yang umum adalah bahwa pembatalan sebelum hubungan seksual sah setelah hubungan seksual terjadi, dan syaratnya menjadi batal. Mazhab Syafi'i menganggap kontrak tidak sah jika syarat tersebut dikenakan oleh istri, tetapi tidak masalah jika syarat tersebut dikenakan oleh suami karena hubungan seksual adalah haknya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17516}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17517} Coitus interruptus: Ini merujuk pada penarikan sperma dari rahim selama hubungan seksual. Mayoritas ahli hukum memperbolehkan coitus interruptus bagi seorang majikan dengan budak perempuannya, dan al-Qarafi melaporkan konsensus tentang hal ini. Namun, ada perbedaan pendapat mengenai coitus interruptus dengan istri yang merdeka, dan detailnya dibahas dalam bab tentang coitus interruptus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17517} Ghilah (hubungan seksual dengan ibu menyusui): Mereka sepakat tentang kebolehannya berdasarkan hadits Judamah bint Wahb, di mana Nabi bermaksud melarangnya tetapi kemudian menyebutkan bahwa orang Romawi dan Persia mempraktikkannya tanpa membahayakan anak-anak mereka. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17517} Hubungan seksual dengan wanita hamil: Sebagian ulama menganggapnya tercela berdasarkan hadits, \"Jangan membunuh anak-anakmu secara diam-diam.\" Namun, mayoritas ahli fiqih memperbolehkannya, dengan mengutip hadits seorang pria yang bertanya kepada Nabi tentang coitus interruptus dengan istrinya, yang dijawab Nabi, \"Jika demikian, maka tidak. Itu tidak membahayakan Persia atau Roma.\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17517}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17518} Dampak hubungan seksual: (a) Mengukuhkan mahar yang telah disepakati menurut mazhab Hanafi, Syafi'i, Maliki, dan Hanbali, karena hubungan seksual memenuhi tujuan yang dimaksud, dan dengan demikian mengukuhkan kompensasi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17518} (b) Masa iddah dikukuhkan dengan perceraian, sesuai dengan firman Allah SWT dalam ayat Al-Ahzab dengan peringatan tanpa teks. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17519} (c) Hubungan seksual merupakan tanda hubungan seksual dan disucikan olehnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17519} (d) Hubungan seksual dalam perkawinan yang sah dengan cara yang mengharuskan berwudhu merupakan salah satu syarat kekebalan dalam kasus perzinahan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17519} (e) Mengambil kembali (harta) melalui hubungan seksual adalah sah menurut mayoritas ulama Hanafi, Hanbali, dan Maliki, dengan syarat niat untuk mengambilnya kembali adalah sah, berbeda dengan ulama Syafi'i. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17519} (Dan) pengaruh hubungan seksual terhadap keabsahan perceraian, yang merupakan pembagian perceraian oleh ahli hukum berdasarkan penjelasannya, dan hal ini dirinci dalam babnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17519} Pengaruh hubungan seksual terhadap perceraian (lanjutan): Perceraian yang sah secara hukum adalah ketika seorang pria menceraikan istrinya saat istrinya dalam keadaan suci secara ritual (tidak sedang haid) dan tanpa melakukan hubungan seksual dengannya, atau saat istrinya jelas-jelas hamil. Dilarang menceraikannya saat ia sedang haid, atau selama masa suci di mana pria tersebut telah melakukan hubungan seksual dengannya. Ini berlaku untuk wanita yang telah dinikahi secara suami istri. Adapun wanita yang belum dinikahi secara suami istri, diperbolehkan untuk menceraikannya saat ia sedang haid atau dalam keadaan suci secara ritual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17520} Mengenai keabsahan perceraian yang dilakukan dengan bid'ah (inovasi): Mayoritas ulama dari mazhab Hanafi, Syafi'i, Maliki, dan Hanbali menyatakan bahwa perceraian tersebut sah, dan orang yang bercerai adalah durhaka, berdasarkan hadits Ibnu Umar tentang perceraiannya dengan istrinya saat sedang haid, dan perintah Nabi untuk menerimanya kembali. Ibnu Taymiyyah, Ibnu al-Qayyim, Ibnu Hazm, al-Shawkani, dan sebuah riwayat dari Ibnu Umar dan Tawus menyatakan bahwa perceraian tersebut tidak sah karena bertentangan dengan perintah Nabi dan oleh karena itu ditolak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17520}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17521} Pengaruh hubungan seksual terhadap hukuman perzinahan: Hubungan seksual yang mendatangkan hukuman adalah masuknya kepala penis laki-laki yang sudah bertanggung jawab secara hukum ke dalam vagina perempuan yang menginginkannya, dengan syarat laki-laki tersebut tidak memiliki hak kepemilikan atau kemiripan atas penis tersebut. Rincian lebih lanjut terdapat dalam bab tentang perzinahan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17521} Pengaruh hubungan seksual terhadap kewajiban ghusl (mandi wajib): Mereka sepakat bahwa pertemuan kedua bagian yang disunat (yaitu, kepala penis memasuki vagina) mewajibkan ghusl bagi laki-laki dan perempuan, berdasarkan hadits Aisyah dan hadits Abu Hurairah. Hadits yang terakhir menambahkan, \"bahkan jika tidak ada ejakulasi.\" {kutipan:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17521} Pengaruh hubungan seksual terhadap kebolehan seorang wanita yang dicerai tiga kali: Ia tidak halal bagi suami pertama sampai ia menikah dengan pria lain, berdasarkan ayat dalam Surah Al-Baqarah. Mayoritas ulama berpendapat bahwa ia tidak halal sampai suami kedua melakukan hubungan seksual dengannya dengan cara yang mengakibatkan pertemuan kedua bagian yang disunat, bahkan jika tidak ada ejakulasi. Sa'id ibn al-Musayyib mengatakan bahwa ia boleh menikah dengan suami pertama jika pernikahan tersebut sah dan tidak dimaksudkan untuk membuatnya halal bagi suami pertama. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17521}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17522} Pengaruh Hubungan Seksual terhadap Larangan Berdasarkan Hubungan Kekerabatan: Tidak ada perbedaan pendapat bahwa akad nikah dengan seorang anak perempuan secara permanen melarang seorang pria untuk menikahi ibunya, dan seterusnya, hanya berdasarkan akad nikah tersebut. Hal ini juga melarang pernikahan dengan istri anak laki-laki dan istri ayah. Adapun anak perempuan tiri, ia dilarang dalam dua syarat: akad nikah dengan ibunya dan penyempurnaan pernikahan. Jika penyempurnaan tidak terjadi, larangan tersebut tidak berlaku. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17522} Pengaruh Hubungan Seksual terhadap Kewajiban Penebusan Dosa: (1) Hubungan seksual dengan wanita yang sedang haid. Ada empat pendapat mengenai penebusan dosa: Mazhab Hanafi dan Syafi'i, menurut pendapat yang paling sahih, berpendapat bahwa tidak ada penebusan dosa, melainkan dianjurkan untuk memberikan sedekah satu dinar atau setengah dinar. Mazhab Hanbali dan Syafi'i, dalam satu pendapat, mewajibkan satu dinar atau setengah dinar, dengan pilihan yang ditentukan berdasarkan hadits Ibnu Abbas. Mazhab Maliki, al-Thawri, al-Layth, dan Ahmad dalam satu riwayat berpendapat bahwa tidak ada penebusan dosa kecuali taubat dan memohon ampunan; sedangkan al-Hasan al-Basri dan Sa'id ibn al-Musayyib mewajibkan penebusan dosa untuk hubungan seksual selama Ramadan. (2) Hubungan seksual selama puasa Ramadan: Mayoritas ulama berpendapat bahwa penebusan dan penggantian puasa wajib dilakukan bagi siapa pun yang dengan sengaja melakukan hubungan seksual di siang hari selama Ramadan, baik terjadi ejakulasi atau tidak, berdasarkan hadits Abu Hurairah tentang seorang pria yang melakukan hubungan seksual dengan istrinya selama Ramadan. Hubungan seksual selama ihram haji: Para ahli fiqih sepakat bahwa jika seorang jamaah haji yang sedang ihram melakukan hubungan seksual sebelum berdiri di Arafat, maka hajinya batal, dan ia harus mempersembahkan hewan kurban; menurut mazhab Hanafi, hewan kurbannya adalah domba; Menurut mazhab Syafi'i, Maliki, dan Hanbali, hewan kurban yang harus dipersembahkan adalah unta. Jika seseorang melakukan hubungan seksual setelah berdiri di Arafat dan sebelum tahap pertama keluar dari ihram, maka ia harus mempersembahkan unta, menurut konsensus. Jika ia melakukan hubungan seksual setelah tahap pertama keluar dari ihram, maka menurut mazhab Hanafi, Syafi'i, dan Hanbali, ia harus mempersembahkan domba, sedangkan Malik mengatakan ia harus mempersembahkan unta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17524} Pengaruh hubungan seksual terhadap batalnya puasa: Mereka sepakat bahwa siapa pun yang melakukan hubungan seksual dengan sengaja di siang hari pada bulan Ramadhan, puasanya batal, baik ia berejakulasi atau tidak. Jika ia melakukannya karena lupa, maka mayoritas mazhab Hanafi, Syafi'i, Ahmad dalam satu riwayat, al-Thawri, al-Hasan, dan Mujahid mengatakan bahwa puasanya tidak batal. Mazhab Maliki, mazhab Hanbali dalam pendapat yang terkenal, dan 'Ata' mengatakan bahwa perbuatan tersebut membatalkan ibadah haji, sama seperti jika dilakukan dengan sengaja. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17524}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17525} Pengaruh Hubungan Seksual terhadap Pembatalan Haji: Mereka sepakat bahwa hubungan seksual sebelum berdiri di Arafat membatalkan ibadah haji, dan orang yang telah melakukan hubungan seksual tersebut tetap melanjutkan ibadah hajinya yang batal dan kemudian menggantinya. Hal itu tidak membatalkan ibadah haji setelah berdiri di Arafat dan setelah tahap pertama keluar dari ihram. Antara berdiri di Arafat dan tahap pertama keluar dari ihram, mazhab Syafi'i, Maliki, dan Hanbali mengatakan bahwa hal itu membatalkan ibadah haji, sedangkan mazhab Hanafi mengatakan tidak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17525} Menginjak Al-Quran: Tidak ada perbedaan pendapat bahwa jika seorang Muslim menginjaknya dengan sengaja untuk menghinanya, ia menjadi murtad. Namun, jika ia dipaksa atau didesak, maka ia tidak murtad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17525} Menginjak kuburan: Kuburan adalah sesuatu yang dihormati, sehingga menginjak dan duduk di atasnya tidak disukai menurut mayoritas ahli fiqih, berdasarkan hadits Uqba bin Amir dan riwayat Ibnu Masoud. Mazhab Syafi'i dan Hanbali tidak menyukainya kecuali jika terpaksa. Berjalan di antara kuburan tidak dilarang menurut mazhab Syafi'i, dan dilarang menurut mazhab Hanbali jika memakai sepatu tetapi tidak jika memakai sandal. Mazhab Hanafi tidak menyukai duduk di atasnya kecuali jika terpaksa. Mazhab Maliki tidak menyukainya dengan syarat: bahwa kuburan ditinggikan dan jalan berada di bawahnya, dan bahwa diyakini bahwa sebagian tulangnya masih tersisa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17525}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17526} Hewan yang menginjak kakinya: Mazhab Hanafi, Syafi'i, Maliki, dan Hanbali sepakat bahwa apa yang diinjak hewan saat berjalan dengan tangan, kepala, atau kakinya dijamin oleh siapa pun yang bersamanya, baik penunggang, pemimpin, atau pengemudi, kapan pun hal itu dapat dikaitkan kepadanya melalui pelanggaran atau kelalaian. Jika tidak dikaitkan kepadanya, maka tidak ada jaminan, menurut hadits \"Cedera pada hewan tidak dapat diganti rugi.\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17526}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17527} Al-Shafi'i mengatakan bahwa pemimpin, pengemudi, dan penunggang bertanggung jawab atas segala kerusakan yang disebabkan oleh tangan, mulut, kaki, atau ekor hewan tersebut. Namun, tanggung jawab hanya berlaku pada orang yang menyebabkan hewan tersebut menginjak sesuatu. Al-Nawawi menyebutkan bahwa hewan yang bersemangat tidak boleh ditunggangi di pasar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17527}"
