id: concept/wat-fiqh
class: concept
kind: legal
label:
  ar: "وَطْء"
  en: "Wat' (intercourse, fiqh)"
summary:
  ar: "الوطء لغةً العلوّ على الشيء، ويُطلق على الجماع، وهو إيلاج الذكر في الفرج حتى يصيرا كالشيء الواحد؛ والمعنى الاصطلاحي لا يخرج عن اللغوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17482}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17483}\n\nالألفاظ ذات الصلة: النكاح، وأصله الضم والجمع، ويُطلق حقيقةً على العقد ومجازاً على الوطء أو العكس على الخلاف بين أهل اللغة والفقه؛ واللواط إتيان الذكور، وهو داخل في الوطء الأعم منه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17483}\n\nأولاً: الوطء بمعنى الجماع. أقسامه: مشروع، وهو وطء الحليلة زوجةً كانت أو سرية، وقد يعرض له التحريم كالحيض والنفاس والظهار قبل التكفير والإحرام والصيام والاعتكاف؛ ومحظور، وهو ما لازمه التحريم، ونوعان: ما يمكن أن يكون حلالاً كوطء أجنبية في قُبلها وفيه حد الزنا، وما لا سبيل إلى حله البتة كاللواط ووطء الدبر وإتيان البهيمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17483}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17484}\n\nأسباب حل الوطء: عقد النكاح، وملك اليمين؛ فأما ملك اليمين فلا خلاف في جواز وطء الأمة المملوكة دون عقد نكاح، لأن ملك الرقبة يفيد ملك المنفعة. وقد أباح الكتاب ذلك بذكر أزواج المؤمنين وما ملكت أيمانهم، بالإشارة إلى سورة المؤمنون دون نص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17484}\n\nالحكم التكليفي: جمهور الفقهاء على أن وطء الحليلة في الأصل مباح، وليس فيه معنى الطاعة أو المعصية في ذاته، وقد يعرض له الاستحباب إذا قارنته نية صالحة كالاستعفاف بالحلال عن الحرام، وقد يجب إذا تعيّن وسيلةً لإعفاف النفس أو الأهل، وقد يحرم أو يكره بحسب الأحوال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17484}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17485}\n\nمقاصد الوطء الشرعية عند ابن القيم: حفظ النسل، وإخراج الماء الذي يضر احتباسه، وقضاء الوطر ونيل اللذة؛ ومن منافعه غض البصر وكف النفس وتحصيل العفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17485}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17486}\n\nثواب الوطء المشروع: ورد حديث أبي ذر في أن «في بُضْع أحدكم صدقة»، وجمهور أهل العلم على ثواب الرجل على جماعه لحليلته إذا قارنته نية صالحة كإعفاف نفسه أو زوجه، أو قضاء حقها بالمعروف، أو طلب ولد صالح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17486} أما إذا لم ينو غير قضاء شهوته فقد اختلف الفقهاء: قال ابن قتيبة يُؤجر مطلقاً، وقال ابن حجر الهيتمي وجماعة لا أجر له إذا لم ينوِ شيئاً من ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17486}\n\nورد أن النفقة على الأهل يُؤجر عليها المسلم إذا احتسبها، وإذا كان هذا في الإنفاق الواجب مشترطاً فهو في الوطء المباح أولى، وذلك على ما قرره الكتاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17487}\n\nآداب الوطء ومستحباته: يُستحب البداءة بالتسمية، ويُستحب الانحراف عن القبلة إكراماً لها، ويُستحب تقديم الملاعبة والضم والتقبيل لتنهض شهوة المرأة، ويُستحب مراعاة التوافق في قضاء الوطر، وأن يتغطيا بثوب، وأن يغضّ الصوت ويقلّ الكلام، ويُكره أن يطأ الرجل وهو يُرى أو يُسمع حسّه، ويحرم مع انكشاف العورة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17487}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17488} ويستحب لمن أراد أن يجامع ثانية أن يغسل فرجه ويتوضأ، والغسل أفضل؛ وذكر الكتاب ما روي عن النبي أنه كان يطوف على نسائه بغسل واحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17488}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17489}\n\nالتحدث عن الوطء وإفشاء سره: اختلف الفقهاء؛ فذهب الحنفية والحنابلة في قول، وهو ما رجّحه المرداوي، والنووي، إلى تحريم المفاخرة بالجماع وإفشاء ما يجري بين الزوجين، استناداً إلى حديث أبي سعيد في أشر الناس منزلة، وحديث «الشياع حرام». وعدّه ابن القيم والهيتمي من الكبائر، وذهب الحنابلة في المذهب إلى كراهة تحدث الزوجين بما جرى بينهما، ولو لضرتها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17489}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17490}\n\nموانع الوطء المشروع: تسعة، اتفق الفقهاء على ستة منها، وهي الحيض والنفاس والاعتكاف والصوم والإحرام والظهار قبل التكفير؛ واختلفوا في ثلاثة، وهي الاستحاضة، وعدم الاغتسال بعد الطهر من الحيض، والإقامة في دار الحرب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17490}\n\nأولاً: الحيض. اتفق أهل العلم على حرمة وطء الحائض في الفرج، لقوله تعالى في سورة البقرة (تُذكر الآية بالسورة دون نقل نصها)، وقوله في الاستمتاع بالحائض: «اصنعوا كل شيء إلا النكاح». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17491} ثانياً: النفاس، وقد اتفق الفقهاء على حرمة وطء النفساء في الفرج، وأن حكم دم النفاس في حظر الوطء وفي الغسل وفي الكفارة كحكم الحيض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17491}\n\nثالثاً: الاستحاضة. اختلف الفقهاء في جواز وطء المستحاضة؛ فجمهور الحنفية والشافعية والمالكية وأحمد في إحدى الروايتين يجيزونه، ونقل ابن المنذر ذلك عن ابن عباس وسعيد بن المسيب والحسن وعطاء وقتادة وغيرهم، واحتجوا بأن المستحاضة طاهرة من الحيض، وبأن حمنة بنت جحش كانت تُستحاض وكان زوجها يجامعها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17491}\n\nالاستحاضة: القول الثاني، وهو ما عليه بعض أهل العلم، أنه لا يجوز وطء المستحاضة لأن الدم دم حيض فيعلّل بالحيض وهو موجود فيها فيثبت التحريم في حقها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17492}\n\nرابعاً: الاعتكاف. اتفق الفقهاء على تحريم الوطء في الاعتكاف، وأنه مفسد له ليلاً كان أو نهاراً إذا كان عامداً، لقوله تعالى في آية البقرة (وتفصيله في باب الاعتكاف). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17492}\n\nخامساً: الصوم. اتفق الفقهاء على تحريم الوطء عمداً على الصائم في رمضان، وأنه مفسد للصوم وموجب للكفارة، أنزل أو لم ينزل، ويُستدل بحديث أبي هريرة في الرجل الذي وقع على امرأته في نهار رمضان وأُمر بالكفارة ثم أُعطي تمراً يتصدق به؛ وقد أُحيل الباب إلى بابه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17492}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493}\n\nسادساً: الإحرام. اتفق الفقهاء على حرمة الوطء على المُحرِم بحج أو عمرة، لقوله تعالى في آية البقرة، والرفث يُفسَّر بالجماع ومقدماته من القول الفاحش، وهو دليل بالأولى أو نص فيه؛ والوطء في الإحرام جناية تفسد النسك إذا كان قبل الوقوف بعرفة ولا تفسده بعد التحلل الأول، واختلفوا فيما بين الوقوف والتحلل الأول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493}\n\nسابعاً: الظهار. لا خلاف في حرمة وطء المظاهَر منها قبل التكفير، لقوله تعالى في سورة المجادلة، ولحديث ابن عباس في الرجل الذي وقع على امرأته قبل أن يكفر، فأمره النبي بالاستغفار ونهاه عن العود حتى يكفّر. وتُمكّن الزوجة الزوج من نفسها قبل التكفير محرّم عليها كذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493}\n\nثامناً: وطء المسلم حليلته في دار الحرب. ذهب الجمهور من الحنفية والمالكية والشافعية إلى كراهته مخافة أن يكون له نسل فيها، لأن المسلم ممنوع من التوطن في دار الحرب، وحديث جرير في البراءة ممن يقيم بين أظهر المشركين، وهو مرسل عند البخاري في رأيه؛ والحنابلة يرون أنه لا يطأ زوجته في دار الحرب إلا للضرورة، فإذا وُجدت وجب العزل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494}\n\n(ب) الوطء المحظور: صوره الزنى، واللواطة، ووطء الحليلة والأجنبية في دبرها، ووطء الميتة، ووطء البهيمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494}\n\nأولاً: الزنى حرام بإجماع الفقهاء وكبيرة من أعظم الكبائر، لقوله تعالى في سورة الإسراء بالنص على الآية دون نقلها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494}\n\nثانياً: اللواط: أجمع الفقهاء على أنه محرم مغلظ التحريم وأنه من الكبائر، وقال الماوردي إنه أغلظ الفواحش تحريماً، وأن اللواط لم يفعله أحد من العالمين قبل قوم لوط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494}\n\nعقوبة اللواط: اختلف الفقهاء فيها على ستة أقوال، وعرض الكتاب الأقوال على النحو التالي: القول الأول للشافعية في المذهب والحنابلة في المذهب وأبي يوسف ومحمد والثوري والأوزاعي وأبي ثور، وهو أن حد اللواط كحد الزنا، فيُرجم المحصن ويُجلد البكر، واستدلوا بحديث أبي موسى في أن الرجل إذا أتى الرجل فهما زانيان، وهو عند البيهقي منكر الإسناد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17495} والقول الثاني، لأبي حنيفة وحماد بن أبي سليمان والحكم، أنه لا حد فيه وإنما فيه التعزير والحبس حتى الموت أو التوبة، ومن اعتاده أو تكرر منه قتله الإمام في المرة الثانية، لأنه لم يطلق عليه اسم الزنا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17495} والقول الثالث للمالكية، أن حده الرجم مطلقاً للفاعل والمفعول به، محصنين أو غير محصنين، واستدلوا بعموم حديث «من وجدتموه يعمل عمل قوم لوط فاقتلوا الفاعل والمفعول به». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17495}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17496} والقول الرابع للشافعي في قول وإسحاق بن راهويه، أنه يُقتل بالسيف كالمرتد، محصناً كان أو غير محصن؛ ونسب الكتاب هذا الرأي إلى جماعة من الصحابة والتابعين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17496} ولم يُستكمل في هذه الصفحة عرض القولين الخامس والسادس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17496}\n\nإتيان الزوجة أو الأمة في الدبر: مرويّ عن جماعة من الصحابة والتابعين، وقال الماوردي إنه ما عليه الصحابة وجمهور التابعين والفقهاء؛ ونص جمع من الفقهاء على أنه من كبائر الإثم، منهم ابن النحاس والهيتمي وابن القيم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17497} وذهب الفقهاء إلى أنه لا حدّ فيه لأن كون الزوجة أو الأمة محل استمتاع أورث شبهة تدرأ الحد، ويجب فيه التعزير عند جمهور أهل العلم، وقد نص على ذلك الحنفية والمالكية والحنابلة، ويجب عند الشافعية إن تكرر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17497} واحتج الفقهاء على تحريمه بأحاديث في الباب تُذكر في الكتاب بمراجعها، وبأن الدبر ليس محلاً للوطء، وبأنه أذى دائم، وبأنه يضيّع حق المرأة في الاستمتاع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17498}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17499} وحُكي عن ابن عمر في رواية أخرى، وعن زيد بن أسلم ونافع وبعض الشافعية، ونُسب إلى مالك في قول، إباحة إتيان الزوجة في الدبر؛ وردّ العلماء الاستدلال بالآية على أن «أنّى» بمعنى «من أين»، وأن تأويل محمد بن كعب القرظي مردود، وأن الروايات عن ابن عمر ونافع ومالك ثابتة الإنكار عنهم؛ وذكر الكتاب ذلك دون أن يقرر حكماً من عنده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17499}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17501}\n\nرابعاً: وطء الأجنبية في الدبر: لا خلاف في تحريمه وأنه من كبائر الذنوب، واختلف الفقهاء في عقوبته على أربعة أقوال: الأول، للمالكية والحنابلة والشافعية في المذهب والصاحبين من الحنفية، أن فيه حد الزنى؛ والثاني، لأبي حنيفة وقول للشافعية، ألا حد فيه وفيه التعزير؛ والثالث، للقاضي أبي الحسن من المالكية، أن حكمه حكم اللواط، وقال ابن عقيل الحنبلي إنه يُحدّ حدّ اللواط؛ والرابع، لبعض الشافعية، أنه القتل بالسيف حداً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17501}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17502}\n\nخامساً: وطء الميتة: لا خلاف في تحريمه، وعده الهيتمي من كبائر الإثم، واختلفوا في العقوبة على مذهبين: الأول، للحنفية والشافعية في الأصح والحنابلة في المعتمد، أنه لا حد فيه وفيه التعزير؛ والثاني، للمالكية على المشهور والشافعية في مقابل الأصح وبعض الحنابلة، وقول الأوزاعي، أن فيه الحد، واستثنى المالكية الزوجة حال موتها فلا حد على زوجها بوطئها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17502}\n\nسادساً: وطء البهيمة: اتفق الفقهاء على تحريمه، وذكر الكتاب ما استدلوا به من عموم آية المؤمنون ومن حديث أبي هريرة في الملعون، وقد وُصفت بعض الأحاديث في الهامش بضعف الإسناد. وعدّه جمع من الفقهاء من كبائر الإثم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17503} واختلف الفقهاء في عقوبة الآتي البهيمة على أربعة أقوال، والكتاب لم يُكمل عرضها في هذا الموضع، وأولها لجابر بن زيد والحسن بن علي والحسن البصري والشافعي وأحمد في قول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17503}\n\nعقوبة إتيان البهيمة (تتمة الأقوال): القول الثالث للزهري، وهو أن عليه أدنى الحدّين مائة جلدة أحصن أو لم يحصن. والرابع، وهو لجمهور الفقهاء من الحنفية والشافعية في الأظهر والمالكية والحنابلة في المذهب، أنه لا يجب فيه الحد، ويلزم فيه التعزير، وروي عن ابن عباس وعطاء والشعبي والنخعي والحكم والثوري وإسحاق؛ وقال الحنفية للإمام أن يقتله إذا اعتاد ذلك، والبيري يرى القتل في المرة الثانية، والحنابلة يبالغون في تعزيره. واحتج الجمهور بأن الوطء فيها منكر يُغيَّر باليد، وبأنه لم يصح في وجوب الحد شيء عن النبي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17504}\n\nتمكين المرأة حيواناً من نفسها، كالكلب والقرد، حكمه كإتيان البهيمة عند الحنفية والشافعية والمالكية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17504}\n\nقتل البهيمة الموطوءة: اختلفوا على ثلاثة أقوال، فالحنفية والمالكية والشافعية في الأصح لا يوجبون قتلها لضعف الحديث الآمر بقتلها، ولنهي النبي عن ذبح الحيوان إلا لمأكلة؛ ويندب عند الحنفية ذبحها ثم إحراقها إن كانت مما لا يؤكل؛ والحنابلة والشافعية في وجه يوجبون قتلها مطلقاً، واستدلوا بحديث «من أتى بهيمة فاقتلوه واقتلوها معه»؛ والثالث يقتلها إن كانت للواطئ دون غيره، ونسبه الكتاب إلى الطحاوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17504}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17505} وإن كانت البهيمة لغير الواطئ فقد اختلفوا في ضمانها، فالشافعية في الوجه القائل بالقتل والحنابلة في المذهب يوجبون الضمان على الفاعل، والحنفية يرون أن يُطالب صاحبها بدفعها بالقيمة ثم تُذبح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17505}\n\nأكل البهيمة الموطوءة بعد ذبحها: ثلاثة أقوال، فالحنابلة في المذهب والصاحبان من الحنفية والشافعية في وجه يحرّمون أكلها، ورواية لأحمد أنه يكره ولا يحرم، والحنفية في قول وأبو حنيفة والمالكية والشافعية في المذهب يجيزون أكلها دون كراهة، لعموم آية المائدة في حل بهيمة الأنعام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17506}\n\nالوطء بشبهة: هو الوطء المحظور الذي لا يوجب حداً لقيام شبهة تنتفي بها قصد الزنا؛ وتفصيل تقسيمات الشبهة في بابها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17506}\n\nأحكام الوطء. حق الزوجة على زوجها في الوطء: للزوجة حق في إتيانها وقضاء وطرها، واستدل الكتاب بحديث عبد الله بن عمرو بن العاص في أن لزوجه عليه حقاً، وبحديث أبي الدرداء في الصيام والصلاة والإتيان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17506}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17507}\n\nضابط هذا الحق وحكمه التكليفي اختلف فيه الفقهاء على أربعة أقوال؛ فالحنفية وقول لبعض الشافعية يرون أن للزوجة مطالبة زوجها بالوطء، فيجب عليه وطء مرة واحدة قضاءً، والزيادة ديانةً؛ والشافعية يرون أنه لا يجب على الزوج الوطء قضاءً ولا إثم في تركه، ويُستحب ألا يعطلها تحصيناً لها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17507} والأقوال الأخرى لم تُستكمل في هذه الصفحات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17507}\n\nضابط حق الزوجة في الوطء (تتمة الأقوال): قال المالكية في الراجح إن للزوجة ليلة في كل أربع، وروى أبو الحسن الصغير عن أبي عمران أقوالاً في أقل ما يُقضى به: ليلة من أربع، أو ليلة من ثلاث، وقضى عمر بمرة في الطهر لأنه يحبلها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17508} والرابع للحنابلة في المذهب، أنه يجب على الزوج أن يطأ زوجته مرة في كل أربعة أشهر إن لم يكن له عذر، واحتجوا بأن الوطء حق لهما جميعاً، ولاستئذانها في العزل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17508} وعند ابن تيمية وابن القيم يجب على الرجل وطء زوجته بالمعروف بقدر حاجتها وقدرته، من غير تحديد بمرة في الشهر أو الأسبوع، والرجوع فيه إلى العرف؛ وقال بعض أهل العلم يجب أن يُشبعها وطأً كما يُشبعها قوتاً، ويرجحه ابن تيمية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17508}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17509} وإن تنازعا فرض الحاكم بحسب العرف وحال الزوجين، وعند ابن تيمية حصول الضرر بترك الوطء يقتضي الفسخ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17509}\n\nحق الرجل على زوجته في الوطء: للزوج أن يطالب زوجته بالوطء متى شاء إلا عند الموانع الشرعية كالحيض والنفاس والظهار والإحرام، فتجب عليها الاستجابة عند انتفاء المانع؛ وعد الذهبي والرافعي والنووي وابن الرفعة والهيتمي امتناعها بلا عذر من النشوز، وكبيرة، لورود الوعيد فيه؛ واستدل الكتاب بأحاديث أبي هريرة في الملائكة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17509}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510} أما الرجل فلا تجب عليه الإجابة إذا دعته المرأة إلا إذا قصد مضارتها فيحرم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510}\n\nحق الزوجة في الفرقة لعجز الزوج عن الوطء (جَبّ أو خِصاء أو عِنّة): فرّق الفقهاء بين العجز المقارن للعقد والحادث بعد الدخول، وبين علم المرأة بالعيب عند العقد وعدمه، وتفصيله في باب الطلاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510}\n\nحق الزوج في الفسخ إذا كان بالزوجة عيب يمنع الوطء (كالرتق والقرن)، واختلفوا فيه على قولين، وتفصيله في بابه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510}\n\nامتناع الرجل عن وطء زوجته إيلاءً أو مظاهرة. الإيلاء: لا خلاف أن المولي يُمهل أربعة أشهر، وهي المدة التي ذكرها الكتاب في سورة البقرة، ومن أصرّ على ترك الوطء حتى مضت المدة فللزوجة أن ترفع أمرها إلى القاضي، فيأمره بالفيء، فإن أبى أمره بالطلاق، فإن لم يطلّق طلّق القاضي عليه، وهو قول جمهور الشافعية والمالكية والحنابلة؛ والحنفية يقولون يقع الطلاق بمضي أربعة أشهر دون توقف على القاضي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17511} الظهار: ذهب جمهور الفقهاء إلى تحريم وطء المظاهر زوجته قبل التكفير، وفي رواية لأحمد يجوز إذا كان التكفير بالإطعام، والتفصيل في بابه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17511}\n\nالظهار (تتمة): للزوجة أن ترفع الأمر إلى القاضي إذا امتنع المظاهر عن التكفير، فيأمره القاضي بالتكفير، فإن أبى أجبره بوسائل التأديب حتى يكفّر أو يطلّق؛ وهذا قول الحنفية، لأن الزوج أضرّ بزوجته بتحريمها عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17512} وفرّق المالكية بين العاجز عن الكفارة والقادر عليها: فالعاجز يُطلَّق عليه، والقادر يُمهَل أربعة أشهر كالإيلاء، ثم يُؤمر بالطلاق أو التكفير. وقال الحنابلة إن المظاهر لا يُؤمر بالوطء لأنه محرم عليه قبل التكفير، ويُمهل ليعتق أو يطعم أو يصوم بحسب قدرته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17512}\n\nحق الزوجة في منع نفسها حتى تقبض مهرها: اتفق الفقهاء على أن الزوج إذا سلّم المهر وجب على الزوجة أن تمكّنه إذا طلب ذلك، ولا تمنعه إذا كان المهر كله مؤجلاً أو بعضه المؤجل، لأن رضاها بالتأجيل رضا بتسليم نفسها؛ وقيّد الحنفية ذلك بشرط الدخول قبل الأجل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17513} أما المعجّل فجماهير الفقهاء من الحنفية والشافعية والمالكية والحنابلة يرون للزوجة أن تمنع نفسها حتى تقبض المعجل، لأن المهر عوض عن البضع كالثمن عن المبيع، وحكى ابن المنذر الإجماع على ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17513}\n\nأثر الوطء في سقوط حق الامتناع بعد التمكين: قولان؛ الأول لأبي حنيفة وابن حامد من الحنابلة، أن لها أن تمنع نفسها حتى تقبض، لأن العقد عُقد على كل وطأة؛ والثاني لأبي يوسف ومحمد والشافعية والمالكية والحنابلة في المذهب، أنه ليس لها ذلك لأن تسليمها برضاها بقاء المهر في الذمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17513}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17514}\n\nحلول أجل المهر المؤجل قبل التسليم: قولان؛ الأول، للحنفية في المعتمد والشافعية في الأصح والحنابلة، أنه ليس لها أن تمنع نفسها لأن حق الحبس سقط برضاها بالتأجيل؛ والثاني، للشافعية في مقابل الأصح والمالكية وأبي يوسف، أن لها المنع لأنه صار كالعاجل، وقيّد أبو يوسف ذلك بعدم اشتراط الدخول قبل الأجل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17514}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17515}\n\nتنازع الزوجين في البداءة بالتسليم: الحنفية والمالكية يرون أن الزوج يُلزم بالتسليم أولاً، وكره مالك للزوجة تمكين زوجها قبل قبض ربع دينار حقاً لله؛ والحنابلة والشافعية في قول يجبر الزوج أولاً ثم الزوجة؛ والشافعية في الأظهر يجبران معاً بإيداع الصداق عند عدل؛ وقال الشافعية في قول ثالث لا إجبار على أيٍّ منهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17515}\n\nاشتراط عدم الوطء أو عدم حلّه في عقد النكاح: اتفقوا على بطلان شرط نفي حلّ الوطء، واختلفوا في أثره على العقد: الجمهور من الشافعية والمالكية والحنابلة يرون بطلان الشرط والعقد معاً لمنافاته مقصود العقد، والحنفية يرون الشرط فاسداً والعقد صحيحاً لأن النكاح لا يبطل بالشرط الفاسد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17516} وفي شرط عدم الوطء ثلاثة أقوال: الحنفية والحنابلة يصححون العقد ويلغون الشرط؛ والمالكية يرون الشرط والعقد فاسدين، وفيه خلاف في الفسخ قبل الدخول وبعده، والمشهور أن الفسخ قبل الدخول يُثبت بعده ويسقط الشرط؛ والشافعية يرون البطلان إن كان الشرط من جهتها، ولا يضر إن كان من جهته لأن الوطء حقه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17516}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17517}\n\nالعزل: هو إنحاء الماء عند الجماع عن الرحم، وجمهور الفقهاء على جواز عزل السيد عن أمته مطلقاً، ونقل القرافي الإجماع عليه؛ أما العزل عن الزوجة الحرة فاختلفوا فيه، وتفصيله في باب العزل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17517}\n\nالغيلة (وطء المرضع): اتفقوا على جوازه لحديث جُدامة بنت وهب في أن النبي هم بالنهي عنه ثم ذكر أن الروم وفارس يفعلونه فلا يضر أولادهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17517}\n\nوطء الحامل: ذهب قوم إلى كراهته لحديث «لا تقتلوا أولادكم سراً»، وذهب جمهور الفقهاء إلى حله، واستدلوا بحديث الرجل الذي سأل النبي عن العزل عن امرأته، وقال إن كان ذلك فلا، ما ضار ذلك فارس والروم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17517}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17518}\n\nآثار الوطء: (أ) يتأكد به كمال المهر المسمى عند الحنفية والشافعية والمالكية والحنابلة، لأن الوطء استيفاء المقصود، وبه يتأكد البدل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17518} (ب) تثبت به العدة بالطلاق، لقوله تعالى في آية الأحزاب بالتنبيه دون نص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17519} (ج) الوطء فيء الإيلاء وينجلي به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17519} (د) الوطء في النكاح الصحيح على وجه يوجب الغسل شرط من شروط الإحصان في الزنا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17519} (ه) تصح الرجعة بالوطء عند جمهور الحنفية والحنابلة والمالكية بشرط قصد الارتجاع، خلافاً للشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17519} (و) أثر الوطء على مشروعية الطلاق، وهو قسم الفقهاء الطلاق من حيث وصفه، ويُفصّل في بابه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17519}"
  en: "Wat', lexically, is standing over a thing; it is also used for intercourse, the insertion of a male member into a female's sexual organ until the two are as one. The technical sense does not depart from the lexical. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17482}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17483}\n\nRelated words: nikah, whose root is joining and gathering, is used in the strict sense for the marriage contract and in a figurative sense for intercourse, or the reverse, as the lexicographers and jurists differ; liwat is intercourse with males, which falls under the wider wat'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17483}\n\nFirst, wat' as intercourse. It is either lawful or forbidden. The lawful is intercourse with a wife or a concubine, which may be forbidden at times, such as during menstruation or post-natal bleeding, before a zihar is expiated, in ihram, while fasting or in i'tikaf. The forbidden is either of a kind that could be lawful in another case, such as intercourse with a woman who may be married to one, which carries the penalty of zina, or of a kind that can never be lawful, such as sodomy, anal intercourse with a wife or a non-wife, and bestiality. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17483}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17484}\n\nThe causes that make intercourse lawful are the marriage contract and ownership of the right hand. Ownership of a female slave is lawful without a contract, because ownership of the person carries the use. The Qur'an alludes to this in the sura of al-Mu'minun (cited by sura only) without a verse being quoted here. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17484}\n\nThe ruling: the majority of jurists hold that intercourse with a wife or concubine is in principle permitted, being a pleasure that the natural disposition calls for, with no obedience or disobedience in itself. It becomes recommended with a good intention, such as keeping oneself chaste from the unlawful, may become obligatory when it is the only means of chastity for oneself or one's household, and may be forbidden or disliked according to circumstances. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17484}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17485}\n\nIbn al-Qayyim lists the purposes of intercourse: preserving the progeny, releasing the water that harms the body if it is retained, and the fulfilment of desire and pleasure; its benefits include lowering the gaze, restraining the self and securing chastity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17485}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17486}\n\nThe reward for lawful intercourse: the report of Abu Dharr that 'in the intimacy of one of you there is charity' is cited; the majority hold that a man is rewarded for intercourse with his wife when accompanied by a good intention, such as keeping himself or his wife from the unlawful, fulfilling her right in proper companionship, or seeking a righteous child. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17486} Where the man intends nothing but the fulfilment of his desire, the jurists differ: Ibn Qutayba holds he is rewarded in every case, while Ibn Hajar al-Haytami and others say there is no reward where no such intention exists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17486}\n\nIntercourse and its rewards: a Muslim is rewarded for what he spends on his household if he seeks the reward of God in it; if this is so for obligatory spending, it is more so for lawful intercourse, as the book states. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17487}\n\nThe courtesies and recommended acts of intercourse: it is recommended to begin with the basmala; to turn away from the qibla out of respect for it; to begin with play, embrace and kissing, so that the woman's desire rises; to take care to reach the satisfaction of both together; to cover oneself with a cloth; to lower the voice and speak little. It is disliked for a man to have intercourse where he can be seen or his sounds heard, and forbidden when the private parts are exposed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17487}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17488} It is recommended for one who wishes to repeat intercourse to wash his private part and perform wudu', and ghusl is better; the book cites the report that the Prophet went round his wives with a single ghusl. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17488}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17489}\n\nSpeaking about intercourse and disclosing its secrets: the jurists differ. The Hanafis, a Hanbali view which al-Mardawi prefers, and al-Nawawi hold that boasting of intercourse and disclosing what passes between spouses is forbidden, on the report of Abu Sa'id about the worst of people in rank before God and the saying that spreading (such talk) is forbidden. Ibn al-Qayyim, al-Haytami and others count it among the major sins. The school view of the Hanbalis is that the spouses' speaking of what passes between them is disliked, even to a co-wife. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17489}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17490}\n\nImpediments to lawful intercourse: there are nine. The jurists agree on six of them, namely menstruation, post-natal bleeding, i'tikaf, fasting, ihram and zihar before its expiation; they differ on three, namely istihada, failure to wash after the end of menstruation, and residence in the abode of war. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17490}\n\nFirst, menstruation: the jurists agree that intercourse with a menstruating woman in the vagina is forbidden, on the verse of sura al-Baqara (cited by sura only) and the saying that one may do everything except intercourse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17491} Second, post-natal bleeding: the jurists agree that intercourse in the vagina is forbidden, and that its rules, including washing and expiation, are those of menstruation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17491}\n\nThird, istihada: the jurists differ on whether intercourse with an irregularly bleeding woman is permitted. The majority of Hanafis, Shafi'is and Malikis, and one Hanbali report, permit it, a view reported by Ibn al-Mundhir from Ibn 'Abbas, Sa'id ibn al-Musayyab, al-Hasan, Ata and others, citing that she is pure of menstruation and the case of Hamna bint Jahsh, whose husband Talha had intercourse with her while she bled. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17491}\n\nIstihada, the second view, which some jurists hold: intercourse with an irregularly bleeding woman is forbidden, because the blood is blood of menstruation, and the cause of the prohibition, menstruation, is present in her, so the prohibition applies to her. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17492}\n\nFourth, i'tikaf. The jurists agree that intercourse during i'tikaf is forbidden and invalidates it, by night or by day, if intentional, on the verse of sura al-Baqara on i'tikaf in the mosque (the detail under i'tikaf). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17492}\n\nFifth, fasting. The jurists agree that intentional intercourse by a fasting person in Ramadan is forbidden, invalidates the fast and requires expiation, whether he ejaculates or not, on the report of Abu Hurayra of the man who had intercourse with his wife while fasting in Ramadan and was given dates to give in charity, which the book quotes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17492}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493}\n\nSixth, ihram. The jurists agree that intercourse by a pilgrim in hajj or umra is forbidden, on the verse of sura al-Baqara, in which 'rafath' is explained as intercourse and the talk that accompanies it. An intercourse before standing at 'Arafat invalidates the pilgrimage, while after the first release it does not; the views differ on the period between standing at 'Arafat and the first release. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493}\n\nSeventh, zihar. There is no dispute that intercourse with a woman on whom zihar has been pronounced is forbidden before expiation, on the verse of sura al-Mujadila and the report of Ibn 'Abbas of the man who had intercourse before expiating, whom the Prophet told to ask forgiveness and not to repeat it until he had expiated. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493}\n\nEighth, a Muslim's intercourse with his wife in the abode of war. The majority of Hanafis, Malikis and Shafi'is hold it disliked, fearing offspring there, since the Muslim is forbidden to settle in the abode of war, citing the saying of the Prophet that he is free of every Muslim who lives among the polytheists, which al-Bukhari judged to be a mursal report. The Hanbalis hold that a Muslim may not have intercourse with his wife in the abode of war except by necessity, and that when necessity arises he must practise withdrawal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17493}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494}\n\n(b) Forbidden intercourse: its kinds are adultery, sodomy, intercourse with a wife or a non-wife in the anus, with a dead woman, and with an animal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494}\n\nFirst, adultery is forbidden by the consensus of the jurists and is one of the greatest major sins, on the verse of sura al-Isra cited by sura and number. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494}\n\nSecond, sodomy: the jurists agree it is forbidden with the greatest severity and is a major sin; al-Mawardi calls it the most grievous of abominations and notes that no one in the worlds did it before the people of Lot. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494}\n\nThe penalty for sodomy: the jurists give six views, of which the book sets out the first four. The first, held by the Shafi'i and Hanbali school views, by Abu Yusuf, Muhammad, al-Thawri, al-Awza'i and Abu Thawr, is that the penalty for sodomy is that of adultery: a married offender is stoned and an unmarried one is flogged; they cite a report from Abu Musa that when a man comes to a man, both are adulterers, which al-Bayhaqi calls a rejected chain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17494}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17495} The second, held by Abu Hanifa, Hammad ibn Abi Sulayman and al-Hakam, is that there is no hadd but discretionary punishment and imprisonment until death or repentance, and that a repeat offender is killed by the ruler at a second offence, married or not, as policy; the reason given is that the act is not the name of adultery. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17495} The third, held by the Malikis, is that the penalty is stoning in every case, for the active and passive partner, married or not, citing the general wording of the hadith on killing both partners. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17495}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17496} The fourth, held by al-Shafi'i in one view and by Ishaq ibn Rahawayh, is that the offender is killed by the sword like an apostate, married or not, a view attributed by the book to a number of Companions and Successors. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17496} The fifth and sixth views are not yet read at this point of the scan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17496}\n\nIntercourse with a wife or a female slave in the anus: the book reports this view from several Companions and Successors; al-Mawardi says it is the position of the Companions, most Successors and jurists. Several jurists, Ibn al-Nahhas, al-Haytami and Ibn al-Qayyim among them, state that it is among the major sins. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17497} The jurists hold that there is no hadd for it, because a wife or slave is in some sense a place of enjoyment, which creates a doubt that averts the hadd; the majority hold that discretionary punishment (ta'zir) is due, as the Hanafis, Malikis and Hanbalis state, and the Shafi'is hold that it is due if repeated. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17497} The jurists cite hadiths on the subject, referenced in the book's notes, the reasoning that the anus is not a place made for intercourse, that it is a constant harm, and that it denies the wife her right to enjoyment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17498}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17499} Views the book attributes to Ibn 'Umar in one report, Zayd ibn Aslam, Nafi' in one report, some Shafi'is, and Malik in one view, permit it. The scholars replied that the verse's word 'anna' means 'from where', that the explanation by Muhammad ibn Ka'b al-Qurazi is rejected, and that the reports of Ibn 'Umar, Nafi' and Malik denying the permission are the sounder ones; the book records the views without adding its own ruling. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17499}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17501}\n\nFourth, intercourse with a non-wife in the anus: there is no dispute that it is forbidden and a major sin. There are four views on its penalty: the first, of the Malikis, Hanbalis, Shafi'is in the school view and the two companions of Abu Hanifa, is the hadd for adultery; the second, of Abu Hanifa and one Shafi'i view, is that there is no hadd but discretionary punishment; the third, of the Maliki judge Abu al-Hasan, equates it with sodomy, and Ibn 'Aqil says the hadd of sodomy applies; the fourth, of some Shafi'is, is death by the sword as a hadd. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17501}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17502}\n\nFifth, intercourse with a dead woman: there is no dispute that it is forbidden, and al-Haytami counts it among the major sins. There are two views on the penalty: the first, of the Hanafis, the sounder Shafi'i view and the Hanbali preferred view, that there is no hadd and only discretionary punishment; the second, of the Malikis in the better-known view, the Shafi'is in a view against the sounder, some Hanbalis and al-Awza'i, that the hadd applies. The Malikis exempt a husband who has intercourse with his dead wife from the hadd. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17502}\n\nSixth, intercourse with an animal: the jurists agree it is forbidden, citing the general wording of the verse of sura al-Mu'minun and the hadith of Abu Hurayra about the one who has intercourse with an animal; several of the hadiths the book cites are judged weak in their chains in the notes. Several jurists count it among the major sins. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17503} The jurists differ on the penalty for it in four views; the first, held by Jabir ibn Zayd, al-Hasan ibn Ali, al-Hasan al-Basri, al-Shafi'i and one Ahmad view, is listed here, and the list continues beyond p.17503. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17503}\n\nThe penalty for intercourse with an animal, the remaining views: the third is that of al-Zuhri, who holds the lighter of the two hadd penalties applies, one hundred lashes, whether married or not. The fourth, held by the majority of Hanafis, the Shafi'is in the more likely view, the Malikis and the Hanbali school, is that no hadd applies and discretionary punishment is due; this is reported from Ibn 'Abbas, 'Ata', al-Sha'bi, al-Nakha'i, al-Hakam, al-Thawri and Ishaq. The Hanafis say the ruler may kill the offender who repeats it, al-Bayri judges a second offence to warrant death, and the Hanbalis press the discretionary punishment hard. The majority argue that the act is wrong, to be changed by the hand, and that no report establishes a hadd. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17504}\n\nA woman who lets an animal such as a dog or monkey approach her is treated as one who has intercourse with an animal, according to the Hanafis, Shafi'is, Malikis and Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17504}\n\nKilling the animal used: three views. The Hanafis, Malikis and the sounder Shafi'i view do not require it, because the hadith ordering its killing is weak and because the Prophet forbade killing animals except for food. The Hanafis recommend slaughtering it and burning it if it is not eaten. The Hanbalis and a Shafi'i view require killing it in every case, citing the hadith 'whoever has intercourse with an animal, kill him and kill the animal with him'. A third view kills it only when the offender owns it; the book attributes this to al-Tahawi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17504}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17505} If the animal belongs to another, the jurists differ on liability: the Hanbalis and the Shafi'i view that requires killing hold the offender liable, while the Hanafis say the owner is asked to hand it over for its value and then it is slaughtered. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17505}\n\nEating an animal used in this way after slaughter: three views. The Hanbali school view and the two companions of Abu Hanifa, with a Shafi'i view, forbid it; one Ahmad report disapproves without forbidding it; Abu Hanifa, the Malikis and the Shafi'i school view permit it without disapproval, citing the verse of sura al-Ma'ida that permits grazing animals. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17506}\n\nIntercourse by mistake (wat' bi-shubha): the act is forbidden but does not bring the hadd, because a doubt removes the intent to commit adultery; the types of doubt are treated under their own heading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17506}\n\nRules of intercourse. The wife's right over her husband: she has a right that he have intercourse with her and satisfy her desire, as the report of Abd Allah ibn Amr shows: 'your body has a right over you, and your wife has a right over you', and the saying to Abu al-Darda'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17506}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17507} The jurists give four views on the extent and duty of this right. The Hanafis and a Shafi'i view hold that the wife may ask for intercourse, and that a husband must comply once by judgement, while more is owed before God as a matter of good companionship; the Shafi'is hold no duty and no sin in leaving it, though it is recommended not to leave a wife without intercourse out of protection for her. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17507} The remaining views are not complete in these pages. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17507}\n\nMeasure of the wife's right to intercourse (the remaining views): the Malikis, in the more likely view, hold that a wife is due one night in every four; Abu al-Hasan al-Saghir reports from Abu Imran views on the least that may be enforced, one night in four, or one night in three, and 'Umar decided once in each purity because the husband makes her pregnant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17508} The fourth view, of the Hanbali school, is that the husband must have intercourse with his wife at least once in four months if he has no excuse; they argue that intercourse is a right of both spouses, and that a wife's consent is needed for withdrawal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17508} Ibn Taymiyya and Ibn al-Qayyim hold that intercourse must be in accordance with custom, in proportion to the wife's need and the husband's ability, with no fixed number; the book notes that some hold he must satisfy her as he must feed her, which Ibn Taymiyya preferred. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17508}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17509} If the spouses dispute the right, the judge sets it by custom and their circumstances; Ibn Taymiyya holds that harm to the wife from its withholding permits dissolution in every case. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17509}\n\nThe husband's right over his wife: the husband may ask his wife for intercourse whenever he wishes, except where a lawful impediment exists, such as menstruation, post-natal bleeding, zihar or ihram; when the impediment is absent she must comply. The jurists al-Dhahabi, al-Rafi'i, al-Nawawi, Ibn al-Rif'a and al-Haytami count a wife's refusal without excuse as a form of disobedience and a major sin, citing the strong warnings in the hadith. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17509}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510} The husband need not comply when his wife asks, unless he intends to harm her, in which case it is forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510}\n\nThe wife's right to separation when the husband is unable to have intercourse (impotence, castration, or sexual incapacity): the jurists distinguish incapacity that exists at the contract from incapacity arising after consummation, and a wife who knew of the defect from one who did not. The detail is under divorce. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510}\n\nThe husband's right to annul the marriage when the wife has a defect that prevents intercourse (such as an occluded passage or a horn-like growth): the jurists differ on two views; detail under its heading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510}\n\nWithholding intercourse by oath (iyla) or by zihar. Iyla: there is no dispute that the husband who swears not to have intercourse has four months, the period set in sura al-Baqara. If he persists until four months pass, the wife may take the matter to the judge, who orders him to return, then to divorce; if he refuses the judge divorces on his behalf, the view of the majority of Shafi'is, Malikis and Hanbalis; the Hanafis say divorce takes effect on the lapse of four months without the judge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17510}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17511} Zihar: the majority hold intercourse with a wife on whom zihar has been pronounced forbidden before expiation; a Hanbali report permits it where the expiation is by feeding; the details are under zihar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17511}\n\nZihar, continued: the wife may take the matter to the judge if the husband refuses expiation; the judge orders him to expiate, and if he refuses, compels him by disciplinary means until he expiates or divorces; this is the Hanafi view, since the husband has harmed her by making her unlawful to him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17512} The Malikis distinguish a husband unable to expiate, who is divorced by the judge, from one able to do so, who is granted four months as in iyla, after which he is told to divorce or expiate. The Hanbalis say a zihar husband is not ordered to resume intercourse, since it is forbidden before expiation, and is given time to free a slave, feed the poor or fast, according to his means. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17512}\n\nThe wife's right to withhold herself until she receives her dower: the jurists agree that once the husband has handed over the dower she must allow him access when he asks, with no lawful impediment; she may not refuse if the whole dower is deferred, or if the deferred part is the larger, because her acceptance of the deferral is acceptance of handing herself over. The Hanafis limit this to a condition that intercourse occur before the term, to which she agreed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17513} For a prompt dower, the majority of Hanafis, Shafi'is, Malikis and Hanbalis hold that she may withhold herself until she receives the prompt portion, since the dower is a return for the womb as the price is for the goods; Ibn al-Mundhir reports consensus on this. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17513}\n\nThe effect of intercourse on the right to withhold after she has allowed access: two views. The first, of Abu Hanifa and Ibn Hamid among the Hanbalis, is that she may still withhold until she is paid, since the contract covers each act of intercourse; the second, of Abu Yusuf, Muhammad, the Shafi'is, Malikis and the Hanbali school, is that she may not, because her handing herself over was consent to the dower remaining a debt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17513}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17514}\n\nWhen the deferred dower falls due before the wife hands herself over: two views. The first, of the preferred Hanafi view, the sounder Shafi'i view and the Hanbalis, is that she may not withhold, since the right of retention fell away by her consent to the deferral. The second, of one Shafi'i view, the Malikis and Abu Yusuf, is that she may withhold, since it is now like a prompt dower; Abu Yusuf limits this to cases in which the husband did not stipulate intercourse before the term. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17514}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17515}\n\nThe dispute over who starts the handing over: the Hanafis and Malikis hold that the husband must hand over first, since the husband's right is fixed by the contract while the wife's right to the dower is fixed by receiving it; Malik disliked the wife's allowing access before receiving a quarter dinar, as a right of God. The Hanbalis and a Shafi'i view compel the husband first, then the wife. The preferred Shafi'i view has both compelled together, by deposit of the dower with a trustee who is neither party's agent. A third Shafi'i view compels neither, since the rights are equal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17515}\n\nStipulating in the marriage contract that intercourse will not be lawful, or that it will not occur: all agree the stipulation is void, but differ on its effect on the contract. The majority of Shafi'is, Malikis and Hanbalis hold both the stipulation and the contract void, because it defeats the purpose of the contract. The Hanafis hold the stipulation invalid but the contract valid, since a marriage is not voided by an invalid condition. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17516} For the stipulation that intercourse will not occur, there are three views: the Hanafis and Hanbalis hold the contract valid and the condition void; the Malikis hold both void, and among them the preferred view allows annulment before consummation and not after, with the condition falling away; the Shafi'is hold the contract void if the condition came from the wife, but harmless if from the husband, since intercourse is his right. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17516}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17517}\n\nWithdrawal (azl), meaning withdrawing before ejaculation into the womb: the majority allow it for a master with his slave-woman, whether or not she consents, the consensus being reported by al-Qarafi; the views on withdrawal from a free wife are detailed under their own heading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17517}\n\nNursing intercourse (ghila): all agree it is permitted, on the report of Judhama bint Wahb in which the Prophet intended to forbid it, then mentioned that Rome and Persia did it without harm to their children. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17517}\n\nIntercourse with a pregnant woman: some jurists disliked it, citing the saying 'do not kill your children secretly'; the majority permit it, citing the report of the man who asked the Prophet about withdrawal and was told that if it is needed then there is no harm, as it did no harm to Persia and Rome. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17517}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17518}\n\nThe effects of intercourse: (a) it confirms the full named dower, according to the Hanafis, Shafi'is, Malikis and Hanbalis, since intercourse is the fulfilment of the purpose; (b) it establishes the waiting period after divorce, by the verse of sura al-Ahzab; (c) it is the act that makes an oath of iyla void; (d) in a valid marriage, intercourse of the kind that requires ghusl is a condition of ihsan for adultery; (e) it restores a revocable divorce, in the view of the Hanafis, Hanbalis and Malikis, if the husband intends to take the wife back, against the Shafi'is; (f) its effect on the permissibility of divorce, a division detailed under divorce. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17518}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17519}"
