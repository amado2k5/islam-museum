label:
  ar: "وَطْء"
  en: "Wat' (intercourse, fiqh)"
summary:
  ar: "الوطء لغةً العلوّ على الشيء، ويُطلق على الجماع، وهو إيلاج الذكر في الفرج حتى يصيرا كالشيء الواحد؛ والمعنى الاصطلاحي لا يخرج عن اللغوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17482}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17483}\n\nالألفاظ ذات الصلة: النكاح، وأصله الضم والجمع، ويُطلق حقيقةً على العقد ومجازاً على الوطء أو العكس على الخلاف بين أهل اللغة والفقه؛ واللواط إتيان الذكور، وهو داخل في الوطء الأعم منه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17483}\n\nأولاً: الوطء بمعنى الجماع. أقسامه: مشروع، وهو وطء الحليلة زوجةً كانت أو سرية، وقد يعرض له التحريم كالحيض والنفاس والظهار قبل التكفير والإحرام والصيام والاعتكاف؛ ومحظور، وهو ما لازمه التحريم، ونوعان: ما يمكن أن يكون حلالاً كوطء أجنبية في قُبلها وفيه حد الزنا، وما لا سبيل إلى حله البتة كاللواط ووطء الدبر وإتيان البهيمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17483}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17484}\n\nأسباب حل الوطء: عقد النكاح، وملك اليمين؛ فأما ملك اليمين فلا خلاف في جواز وطء الأمة المملوكة دون عقد نكاح، لأن ملك الرقبة يفيد ملك المنفعة. وقد أباح الكتاب ذلك بذكر أزواج المؤمنين وما ملكت أيمانهم، بالإشارة إلى سورة المؤمنون دون نص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17484}\n\nالحكم التكليفي: جمهور الفقهاء على أن وطء الحليلة في الأصل مباح، وليس فيه معنى الطاعة أو المعصية في ذاته، وقد يعرض له الاستحباب إذا قارنته نية صالحة كالاستعفاف بالحلال عن الحرام، وقد يجب إذا تعيّن وسيلةً لإعفاف النفس أو الأهل، وقد يحرم أو يكره بحسب الأحوال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17484}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17485}\n\nمقاصد الوطء الشرعية عند ابن القيم: حفظ النسل، وإخراج الماء الذي يضر احتباسه، وقضاء الوطر ونيل اللذة؛ ومن منافعه غض البصر وكف النفس وتحصيل العفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17485}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17486}\n\nثواب الوطء المشروع: ورد حديث أبي ذر في أن «في بُضْع أحدكم صدقة»، وجمهور أهل العلم على ثواب الرجل على جماعه لحليلته إذا قارنته نية صالحة كإعفاف نفسه أو زوجه، أو قضاء حقها بالمعروف، أو طلب ولد صالح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17486} أما إذا لم ينو غير قضاء شهوته فقد اختلف الفقهاء: قال ابن قتيبة يُؤجر مطلقاً، وقال ابن حجر الهيتمي وجماعة لا أجر له إذا لم ينوِ شيئاً من ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17486}\n\nورد أن النفقة على الأهل يُؤجر عليها المسلم إذا احتسبها، وإذا كان هذا في الإنفاق الواجب مشترطاً فهو في الوطء المباح أولى، وذلك على ما قرره الكتاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17487}\n\nآداب الوطء ومستحباته: يُستحب البداءة بالتسمية، ويُستحب الانحراف عن القبلة إكراماً لها، ويُستحب تقديم الملاعبة والضم والتقبيل لتنهض شهوة المرأة، ويُستحب مراعاة التوافق في قضاء الوطر، وأن يتغطيا بثوب، وأن يغضّ الصوت ويقلّ الكلام، ويُكره أن يطأ الرجل وهو يُرى أو يُسمع حسّه، ويحرم مع انكشاف العورة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17487}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17488} ويستحب لمن أراد أن يجامع ثانية أن يغسل فرجه ويتوضأ، والغسل أفضل؛ وذكر الكتاب ما روي عن النبي أنه كان يطوف على نسائه بغسل واحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17488}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17489}\n\nالتحدث عن الوطء وإفشاء سره: اختلف الفقهاء؛ فذهب الحنفية والحنابلة في قول، وهو ما رجّحه المرداوي، والنووي، إلى تحريم المفاخرة بالجماع وإفشاء ما يجري بين الزوجين، استناداً إلى حديث أبي سعيد في أشر الناس منزلة، وحديث «الشياع حرام». وعدّه ابن القيم والهيتمي من الكبائر، وذهب الحنابلة في المذهب إلى كراهة تحدث الزوجين بما جرى بينهما، ولو لضرتها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17489}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17490}\n\nموانع الوطء المشروع: تسعة، اتفق الفقهاء على ستة منها، وهي الحيض والنفاس والاعتكاف والصوم والإحرام والظهار قبل التكفير؛ واختلفوا في ثلاثة، وهي الاستحاضة، وعدم الاغتسال بعد الطهر من الحيض، والإقامة في دار الحرب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17490}\n\nأولاً: الحيض. اتفق أهل العلم على حرمة وطء الحائض في الفرج، لقوله تعالى في سورة البقرة (والآية محال إليها بالسورة دون نص)، وقوله في الاستمتاع بالحائض: «اصنعوا كل شيء إلا النكاح». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17491} ثانياً: النفاس، وقد اتفق الفقهاء على حرمة وطء النفساء في الفرج، وأن حكم دم النفاس في حظر الوطء وفي الغسل وفي الكفارة كحكم الحيض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17491}\n\nثالثاً: الاستحاضة. اختلف الفقهاء في جواز وطء المستحاضة؛ فجمهور الحنفية والشافعية والمالكية وأحمد في إحدى الروايتين يجيزونه، ونقل ابن المنذر ذلك عن ابن عباس وسعيد بن المسيب والحسن وعطاء وقتادة وغيرهم، واحتجوا بأن المستحاضة طاهرة من الحيض، وبأن حمنة بنت جحش كانت تُستحاض وكان زوجها يجامعها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17491}"
  en: "Wat', lexically, is standing over a thing; it is also used for intercourse, the insertion of a male member into a female's sexual organ until the two are as one. The technical sense does not depart from the lexical. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17482}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17483}\n\nRelated words: nikah, whose root is joining and gathering, is used in the strict sense for the marriage contract and in a figurative sense for intercourse, or the reverse, as the lexicographers and jurists differ; liwat is intercourse with males, which falls under the wider wat'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17483}\n\nFirst, wat' as intercourse. It is either lawful or forbidden. The lawful is intercourse with a wife or a concubine, which may be forbidden at times, such as during menstruation or post-natal bleeding, before a zihar is expiated, in ihram, while fasting or in i'tikaf. The forbidden is either of a kind that could be lawful in another case, such as intercourse with a woman who may be married to one, which carries the penalty of zina, or of a kind that can never be lawful, such as sodomy, anal intercourse with a wife or a non-wife, and bestiality. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17483}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17484}\n\nThe causes that make intercourse lawful are the marriage contract and ownership of the right hand. Ownership of a female slave is lawful without a contract, because ownership of the person carries the use. The Qur'an alludes to this in the sura of al-Mu'minun (cited by sura only) without a verse being quoted here. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17484}\n\nThe ruling: the majority of jurists hold that intercourse with a wife or concubine is in principle permitted, being a pleasure that the natural disposition calls for, with no obedience or disobedience in itself. It becomes recommended with a good intention, such as keeping oneself chaste from the unlawful, may become obligatory when it is the only means of chastity for oneself or one's household, and may be forbidden or disliked according to circumstances. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17484}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17485}\n\nIbn al-Qayyim lists the purposes of intercourse: preserving the progeny, releasing the water that harms the body if it is retained, and the fulfilment of desire and pleasure; its benefits include lowering the gaze, restraining the self and securing chastity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17485}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17486}\n\nThe reward for lawful intercourse: the report of Abu Dharr that 'in the intimacy of one of you there is charity' is cited; the majority hold that a man is rewarded for intercourse with his wife when accompanied by a good intention, such as keeping himself or his wife from the unlawful, fulfilling her right in proper companionship, or seeking a righteous child. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17486} Where the man intends nothing but the fulfilment of his desire, the jurists differ: Ibn Qutayba holds he is rewarded in every case, while Ibn Hajar al-Haytami and others say there is no reward where no such intention exists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17486}\n\nIntercourse and its rewards: a Muslim is rewarded for what he spends on his household if he seeks the reward of God in it; if this is so for obligatory spending, it is more so for lawful intercourse, as the book states. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17487}\n\nThe courtesies and recommended acts of intercourse: it is recommended to begin with the basmala; to turn away from the qibla out of respect for it; to begin with play, embrace and kissing, so that the woman's desire rises; to take care to reach the satisfaction of both together; to cover oneself with a cloth; to lower the voice and speak little. It is disliked for a man to have intercourse where he can be seen or his sounds heard, and forbidden when the private parts are exposed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17487}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17488} It is recommended for one who wishes to repeat intercourse to wash his private part and perform wudu', and ghusl is better; the book cites the report that the Prophet went round his wives with a single ghusl. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17488}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17489}\n\nSpeaking about intercourse and disclosing its secrets: the jurists differ. The Hanafis, a Hanbali view which al-Mardawi prefers, and al-Nawawi hold that boasting of intercourse and disclosing what passes between spouses is forbidden, on the report of Abu Sa'id about the worst of people in rank before God and the saying that spreading (such talk) is forbidden. Ibn al-Qayyim, al-Haytami and others count it among the major sins. The school view of the Hanbalis is that the spouses' speaking of what passes between them is disliked, even to a co-wife. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17489}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17490}\n\nImpediments to lawful intercourse: there are nine. The jurists agree on six of them, namely menstruation, post-natal bleeding, i'tikaf, fasting, ihram and zihar before its expiation; they differ on three, namely istihada, failure to wash after the end of menstruation, and residence in the abode of war. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17490}\n\nFirst, menstruation: the jurists agree that intercourse with a menstruating woman in the vagina is forbidden, on the verse of sura al-Baqara (cited by sura only) and the saying that one may do everything except intercourse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17491} Second, post-natal bleeding: the jurists agree that intercourse in the vagina is forbidden, and that its rules, including washing and expiation, are those of menstruation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17491}\n\nThird, istihada: the jurists differ on whether intercourse with an irregularly bleeding woman is permitted. The majority of Hanafis, Shafi'is and Malikis, and one Hanbali report, permit it, a view reported by Ibn al-Mundhir from Ibn 'Abbas, Sa'id ibn al-Musayyab, al-Hasan, Ata and others, citing that she is pure of menstruation and the case of Hamna bint Jahsh, whose husband Talha had intercourse with her while she bled. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17491}"
