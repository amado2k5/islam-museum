id: concept/tashil-nubut-al-asnan
class: concept
kind: scientific
label:
  ar: تسهيل نبات الأسنان
  en: Easing the teeth's eruption
  ur: دانت نکلنے کی آسانی
  es: "Facilitando la erupción de los dientes"
summary:
  ar: قد يعرض للصبيان أن يعسر نبات أسنانهم فيألمون وربما شاركه استطلاق الطبيعة فيحتاج أن تعدل بالأطلية على البطن والعصارات المسقاة لإمساكها فيحتاج أن يطلى بالشيافات المذكورة في الكتاب الكلي، ومما يسهل نبات الأسنان الدلك بالشحوم والأدمغة وخصوصاً بدماغ الأرنب مستخرجاً من رأسه بعد الطبخ وما وصف من هذا الجنس ⁦(المحروس حيواني الجنس محمول كما سماه الكتاب وباقي الأسماء مطروحة)⁩ {cite:canon-ibn-sina-print-v2 p.276}
  en: Boys may find their teeth' eruption hard, with pain, sometimes joined by looseness of the bowels needing correction by the plasters on the belly and the constipating juices and the suppository-forms named in the General Book. Among what eases eruption is rubbing with fats and brains — especially the hare's brain taken from its head after cooking — and what he described of this kind (the animal item carried as the book names it, the other names left out) {cite:canon-ibn-sina-print-v2 p.276}
  ur: لڑکوں کے دانت نکلنے میں کبھی تنگی ہوتی ہے جس میں درد ہوتا ہے اور بعض اوقات دست کے ساتھ جڑتا ہے جس کی اصلاح پیٹ پر پٹیاں اور قبض کرنے والے عصاروں اور کلی کتاب میں مذکورہ شیافوں سے چاہیے؛ دانت نکلنے میں آسانی دینے والوں میں چربیوں اور مغزوں سے مالش ہے خصوصاً خرگوش کا مغز پکانے کے بعد سر سے نکالا ہوا اور اسی جنس کی اس کی بیان کردہ چیزیں ⁦(حیوانی جنس والی چیز کتاب کے نام پر محمول، باقی نام مطروح)⁩ {cite:canon-ibn-sina-print-v2 p.276}
  es: "Los niños pueden experimentar dificultad en la erupción dental, dolor, a veces acompañado de diarrea que requiere corrección mediante emplastos en el vientre, jugos astringentes y supositorios mencionados en el Libro General. Entre los remedios que facilitan la erupción se encuentra frotar con grasas y sesos —especialmente el sesos de liebre, extraído de su cabeza después de cocinarlo— y lo que él describió de este tipo (el animal que se lleva como lo denomina el libro, omitiendo los demás nombres) {cite:canon-ibn-sina-print-v2 p.276}"
