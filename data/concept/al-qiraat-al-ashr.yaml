id: concept/al-qiraat-al-ashr
class: concept
kind: term
label:
  ar: القراءات العشر
  en: The ten readings
  fr: "Les dix lectures"
  ur: قراءاتِ عشرہ
  es: "Las diez lecturas"
summary:
  ar: "العشرة هم السبعة المعروفون ومعهم أبو جعفر ويعقوب وخلف؛ وجعل ابن الجزري «النشر» في قراءاتهم، وقرر أن قراءاتهم الثلاث الزائدة لا تخالف رسم المصحف وأنها بمنزلة قراءات السبعة {cite:nashr-dahman-damascus-1345-v1 p. 48} {cite:nashr-dahman-damascus-1345-v1 p. 54}."
  en: "The ten are the well-known seven together with Abu Jafar, Yaqub and Khalaf; Ibn al-Jazari made al-Nashr a book of their readings and held that the three additional readings do not depart from the script of the codex and stand on a par with the seven {cite:nashr-dahman-damascus-1345-v1 p. 48} {cite:nashr-dahman-damascus-1345-v1 p. 54}."
  fr: "Les dix réunissent les sept lectures bien connues et celles d’Abu Ja‘far, de Ya‘qub et de Khalaf. Ibn al-Jazari leur a consacré l’al-Nashr et estimait que les trois lectures supplémentaires ne s’écartaient pas du tracé du codex et étaient au même rang que les sept {cite:nashr-dahman-damascus-1345-v1 p. 48} {cite:nashr-dahman-damascus-1345-v1 p. 54}."
  ur: "عشرہ وہ معروف سات قراء ہیں اور ان کے ساتھ ابو جعفر، یعقوب اور خلف؛ ابن الجزری نے «النشر» انھی کی قراءتوں پر لکھی اور فیصلہ کیا کہ تین اضافی قراءتیں مصحف کے رسم کے خلاف نہیں اور سبعہ کے برابر ہیں {cite:nashr-dahman-damascus-1345-v1 p. 48} {cite:nashr-dahman-damascus-1345-v1 p. 54}۔"
  es: "Los diez son los siete bien conocidos junto con Abu Jafar, Yaqub y Khalaf; Ibn al-Jazari hizo de al-Nashr un libro de sus lecturas y sostuvo que las tres lecturas adicionales no se apartan de la escritura del códice y están a la par con las siete {cite:nashr-dahman-damascus-1345-v1 p. 48} {cite:nashr-dahman-damascus-1345-v1 p. 54}."
