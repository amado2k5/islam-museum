id: concept/inheritance-of-prophethood
class: concept
kind: doctrine
label:
  ar: إرث النبوة ⁦(بالعمل لا بالنسب)⁩
  en: Inheritance of prophethood (by deeds, not by blood)
  es: "Herencia de la profecía (por obras, no por sangre)"
  fr: "L'héritage de la prophétie (par les actes, non par le sang)"
  ur: "وراثت نبوت ⁦(خون سے نہیں اعمال سے)⁩"
tags: ["nubuwat-browser", "nubuwat-nubuwwa", "wasaya-browser", "wasaya-legacy", "wasaya-mirath"]
summary:
  ar: "يرى الشعراوي أن الإمامة في الدين والانتساب إلى الأنبياء لا يكونان بالدم ولا بالنسب، وإنما بتطبيق المنهج نصاً وروحاً، ويستدل بطلب إبراهيم أن تبقى الإمامة في ذريته، وبجواب الحق بأن العهد لا ينال الظالمين، وبقصة ابن نوح التي قال فيها الحق إنه عمل غير صالح. ويعرض ذلك دون حكم، وينسبه إليه {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1529}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1530}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1531}."
  en: "Sha'rawi holds that religious leadership and belonging to the prophets come not by blood or lineage but by applying the law in letter and spirit. He builds this on Abraham's request that leadership remain in his descendants, on the answer that a covenant does not reach the wrongdoers, and on the story of Noah's son, of whom God said that his deeds were not righteous. He presents this without a verdict under his own name {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1529}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1530}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1531}."
  es: "Sha'rawi sostiene que el liderazgo religioso y la pertenencia a los profetas no se obtienen por sangre ni linaje, sino mediante la aplicación de la ley en su letra y espíritu. Fundamenta esta idea en la petición de Abraham de que el liderazgo permaneciera en sus descendientes, en la respuesta de que un pacto no alcanza a los malhechores y en la historia del hijo de Noé, de quien Dios dijo que sus obras no eran justas. Presenta esta tesis sin emitir un veredicto bajo su propio nombre {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1529}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1530}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1531}."
  fr: "Sha'rawi soutient que le leadership religieux et l'appartenance à la lignée des prophètes ne se transmettent ni par le sang ni par la lignée, mais par l'application de la loi à la lettre et dans son esprit. Il fonde cette thèse sur la demande d'Abraham que le leadership demeure parmi ses descendants, sur la réponse selon laquelle une alliance ne s'étend pas aux injustes, et sur l'histoire du fils de Noé, dont Dieu déclara que les actes étaient impies. Il présente cette thèse sans porter de jugement, sous son propre nom."
  ur: "شعراوی کا خیال ہے کہ مذہبی قیادت اور انبیاء کا تعلق خون یا نسب سے نہیں بلکہ قانون کو حرف اور روح سے لاگو کرنے سے حاصل ہوتا ہے۔ وہ ابراہیم کی اس درخواست پر کہ قیادت اس کی اولاد میں رہے، اس جواب پر کہ عہد ظالموں تک نہیں پہنچتا، اور نوح کے بیٹے کی کہانی پر، جس کے بارے میں خدا نے کہا کہ اس کے اعمال صالح نہیں تھے۔ وہ اسے اپنے نام سے بغیر کسی فیصلے کے پیش کرتا ہے۔"
