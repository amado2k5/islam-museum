issue:
  ar: "هل ينتقل إرث النبوة والإمامة في الدين بالنسب، أم بالعمل بالمنهج؟"
  en: "Is the inheritance of prophethood and religious leadership passed by lineage, or by following the law?"
perspectives:
- tradition: sunni
  id: sunni-sharawi-by-practice
  stance:
    ar: "يكون الانتساب إلى الأنبياء بالعمل بمنهجهم لا بمجرد النسب"
    en: "Belonging to the prophets is by following their law, not by lineage alone"
  summary:
    ar: "يرى الشعراوي أن الانتساب إلى الأنبياء يكون بالعمل الذي تصنعه الذات، وأن الحق لم يجعل ابن نوح من أهله لأن عمله غير صالح. ويقرر أن قول الرسول لسلمان الفارسي إنه من آل البيت، كما يرويه في حاشية الكتاب، يدل على نسبة الإرث إلى تطبيق المنهج {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1530}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1531}."
    en: "Sha'rawi holds that belonging to the prophets is established by the deeds a person does. He notes that God did not count Noah's son among his family because his deeds were not righteous. He cites, from his own footnote, the Prophet's saying to Salman al-Farisi that Salman is of the household, and reads it as tying inheritance to applying the law {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1530}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1531}."
