id: concept/inheritance-of-prophethood
class: concept
kind: doctrine
label:
  ar: إرث النبوة (بالعمل لا بالنسب)
  en: Inheritance of prophethood (by deeds, not by blood)
summary:
  ar: "يرى الشعراوي أن الإمامة في الدين والانتساب إلى الأنبياء لا يكونان بالدم ولا بالنسب، وإنما بتطبيق المنهج نصاً وروحاً، ويستدل بطلب إبراهيم أن تبقى الإمامة في ذريته، وبجواب الحق بأن العهد لا ينال الظالمين، وبقصة ابن نوح التي قال فيها الحق إنه عمل غير صالح. ويعرض ذلك دون حكم، وينسبه إليه {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1529}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1530}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1531}."
  en: "Sha'rawi holds that religious leadership and belonging to the prophets come not by blood or lineage but by applying the law in letter and spirit. He builds this on Abraham's request that leadership remain in his descendants, on the answer that a covenant does not reach the wrongdoers, and on the story of Noah's son, of whom God said that his deeds were not righteous. He presents this without a verdict under his own name {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1529}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1530}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1531}."
