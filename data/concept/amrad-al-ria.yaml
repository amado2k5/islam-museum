id: concept/amrad-al-ria
class: concept
kind: scientific
label:
  ar: "الأمراض التي تعرض للرئة"
  en: "The diseases that befall the lung"
  fr: "Les maladies qui atteignent le poumon"
  ur: "بیماریاں جو پھیپھڑے کو عارض ہوتی ہیں"
  es: "Las enfermedades que afectan al pulmón"
  tr: "Akciğer Hastalıkları"
  id: "Akciğer Hastalıkları"
summary:
  ar: "تعرض للرئة الأمراض المختصة بالمتشابهة الأجزاء والأمراض الآلية وخصوصاً السدد في عروقها وأجزاء قصبتها وخصوصاً العروق الخشنة وفي خلخلة جرمها وقد تكون لأسباب السدد كلها حتى الانطباق والأمراض المشتركة، وقد تكثر أمراض الرئة في الشتاء والخريف لكثرة النوازل وخصوصاً في خريف مطير بعد صيف يابس شمالي، والهواء البارد ضار بالرئة إلا أن تكون متأذية بالحر الشديد، وكثيراً ما تؤدي أمراض الرئة إلى أمراض الكبد كما تؤدي شدة بردها وشدة حرها إلى الاستسقاء وكذلك الحجاب {cite:canon-ibn-sina-print-v2 p.305}"
  en: "There befall the lung the diseases proper to the like-parts and the instrumental diseases — above all the blockages in its vessels and the parts of its windpipe, especially the rough vessels, and in the sponginess of its body, and these may arise for every cause of blockage up to apposition — and the shared diseases. The lung's diseases may multiply in winter and autumn for the many catarrhs, above all in a rainy autumn after a dry northerly summer; cold air harms the lung unless it is already afflicted by fierce heat; and the lung's diseases often lead to the liver's diseases, as the fierceness of its cold and its heat lead to dropsy — and so does the diaphragm's {cite:canon-ibn-sina-print-v2 p.305}"
  fr: "Atteignent le poumon les maladies propres aux parties similaires et les maladies instrumentales — surtout les obstructions dans ses vaisseaux et dans les parties de sa trachée, en particulier les vaisseaux rugueux, et dans la spongiosité de son corps, et elles peuvent naître de toute cause d’obstruction jusqu’à l’accolement — ainsi que les maladies communes. Les maladies du poumon peuvent se multiplier en hiver et en automne en raison des nombreux catarrhes, surtout par un automne pluvieux succédant à un été sec et septentrional ; l’air froid nuit au poumon, à moins qu’il ne soit déjà atteint par une chaleur intense ; et les maladies du poumon conduisent souvent aux maladies du foie, de même que l’intensité de son froid et de sa chaleur conduit à l’hydropisie — et il en va de même pour le diaphragme {cite:canon-ibn-sina-print-v2 p.305}"
  ur: "پھیپھڑے کو وہ بیماریاں ہوتی ہیں جو متماثل الاجزاء کے اعضاء کو مخصوص ہیں اور آلی بیماریاں — خصوصاً اس کی عروق اور قصبہ کے اجزاء میں سدد بالخصوص کھردری عروق میں اور اس کے جسم کے متخلخل ہونے میں اور یہ تمام اسباب سدہ سے حتی کہ انطباق تک ہو سکتی ہیں — اور مشترک بیماریاں بھی؛ پھیپھڑے کی بیماریاں سردی اور خزاں میں نوازل کی کثرت سے بڑھ سکتی ہیں خصوصاً ایسی خزاں میں جو شمالی خشک گرمی کے بعد برساتی ہو؛ ٹھنڈی ہوا پھیپھڑے کو نقصان دیتی ہے مگر یہ کہ وہ پہلے ہی سخت گرمی سے متاثر ہو؛ اور پھیپھڑے کی بیماریاں اکثر جگر کی بیماریوں کی طرف لے جاتی ہیں جیسا کہ اس کی سخت ٹھنڈ اور سخت گرمی استسقا کی طرف — اور حجاب کی بھی {cite:canon-ibn-sina-print-v2 p.305}"
  es: "Al pulmón le sobrevienen las enfermedades propias de las partes similares y las enfermedades instrumentales, sobre todo las obstrucciones en sus vasos y partes de su tráquea, especialmente los vasos gruesos, y en la esponjosidad de su cuerpo, y estas pueden surgir por cualquier causa de obstrucción hasta la aposición, y las enfermedades compartidas. Las enfermedades pulmonares pueden multiplicarse en invierno y otoño debido a los numerosos catarros, sobre todo en un otoño lluvioso después de un verano seco del norte; el aire frío daña el pulmón a menos que ya esté afectado por un calor intenso; y las enfermedades pulmonares a menudo conducen a las enfermedades del hígado, ya que la intensidad de su frío y su calor conducen a la hidropesía, y lo mismo ocurre con el diafragma. {cite:canon-ibn-sina-print-v2 p.305}"
  tr: "Akciğerler, benzer parçalarla ilişkili hastalıklara ve mekanik hastalıklara maruz kalırlar; özellikle damarlarında ve trakea bazı kısımlarında tıkanıklık, özellikle pürüzlü damarlar ve kütlesinin gevşemesi gibi hastalıklara maruz kalırlar. Tüm tıkanıklıklar birleşmeye kadar tıkanıklık ve eklem hastalıklarından kaynaklanabilir. Akciğer hastalıkları, özellikle kuru kuzey yazı sonrası yağmurlu sonbaharda, sık sık görülmesi nedeniyle kış ve sonbaharda artabilir. Soğuk hava, aşırı sıcaktan zarar görmedikleri sürece akciğerler için zararlıdır. Akciğer hastalıkları genellikle karaciğer hastalıklarına, şiddetli soğuk ve sıcaklık ise diyafram gibi asitlere yol açar {cite:canon-ibn-sina-print-v2 s.305}"
  id: "Akciğerler, benzer parçalarla ilişkili hastalıklara ve mekanik hastalıklara maruz kalırlar; özellikle damarlarında ve trakea bazı kısımlarında tıkanıklık, özellikle pürüzlü damarlar ve kütlesinin gevşemesi gibi hastalıklara maruz kalırlar. Tüm tıkanıklıklar birleşmeye kadar tıkanıklık ve eklem hastalıklarından kaynaklanabilir. Akciğer hastalıkları, özellikle kuru kuzey yazı sonrası yağmurlu sonbaharda, sık sık görülmesi nedeniyle kış ve sonbaharda artabilir. Soğuk hava, aşırı sıcaktan zarar görmedikleri sürece akciğerler için zararlıdır. Akciğer hastalıkları genellikle karaciğer hastalıklarına, şiddetli soğuk ve sıcaklık ise diyafram gibi asitlere yol açar {cite:canon-ibn-sina-print-v2 s.305}"
