id: concept/lughah-fiqh
class: concept
kind: legal
label:
  ar: "اللُّغَة"
  en: "Language (lughah), fiqh rulings"
  ur: "زبان (لغت، فقہی احکام)"
summary:
  ar: "اللغة عند اللغويين اللسن، وحدها أصوات يعبر بها كل قوم عن أغراضهم، وهي فعلة من لغوت أي تكلمت {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13647}. وترادف الكلام في بعض إطلاقاته، والبيان أخص منها، والبيان الإظهار والكشف، ومنه قوله تعالى علمه البيان {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13648}."
  en: "Lugha, in lexicon, is the tongue: sounds by which each people expresses its aims, a form from lagha, to speak {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13647}. It overlaps with kalam in some senses; bayan is narrower, meaning manifestation and uncovering {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13648}."
  ur: "لغت، لغویوں کے نزدیک زبان ہے، یعنی وہ آوازیں جن سے ہر قوم اپنے مقاصد بیان کرتی ہے، اور یہ لغا سے ہے یعنی بولا؛ اصطلاحی معنی لغوی سے الگ نہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13647}۔ کلام کے بعض اطلاقات میں اس کے مترادف ہے؛ اور بیان اس سے خاص ہے، یعنی ظاہر کرنا اور کھولنا {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13648}۔"
