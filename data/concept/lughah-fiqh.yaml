id: concept/lughah-fiqh
class: concept
kind: legal
label:
  ar: "اللُّغَة"
  en: "Language (lughah), fiqh rulings"
  ur: "زبان ⁦(لغت، فقہی احکام)⁩"
  es: "Idioma (lughah), sentencias fiqh"
  fr: "Langue (lughah), décisions du fiqh"
  tr: "Dil"
  id: "Bahasa"
summary:
  ar: "اللغة عند اللغويين اللسن، وحدها أصوات يعبر بها كل قوم عن أغراضهم، وهي فعلة من لغوت أي تكلمت {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13647}. وترادف الكلام في بعض إطلاقاته، والبيان أخص منها، والبيان الإظهار والكشف، ومنه قوله تعالى علمه البيان {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13648}."
  en: "Lugha, in lexicon, is the tongue: sounds by which each people expresses its aims, a form from lagha, to speak {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13647}. It overlaps with kalam in some senses; bayan is narrower, meaning manifestation and uncovering {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13648}."
  ur: "لغت، لغویوں کے نزدیک زبان ہے، یعنی وہ آوازیں جن سے ہر قوم اپنے مقاصد بیان کرتی ہے، اور یہ لغا سے ہے یعنی بولا؛ اصطلاحی معنی لغوی سے الگ نہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13647}۔ کلام کے بعض اطلاقات میں اس کے مترادف ہے؛ اور بیان اس سے خاص ہے، یعنی ظاہر کرنا اور کھولنا {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13648}۔"
  es: "Lugha, en léxico, es la lengua: sonidos mediante los cuales cada pueblo expresa sus objetivos, una forma de lagha, hablar {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13647}. Se superpone con kalam en algunos sentidos; bayan es más específico, significa manifestación y descubrimiento {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13648}."
  fr: "En linguistique, lugha désigne la langue: les sons par lesquels chaque peuple exprime ses aspirations, une forme dérivée de lagha, qui signifie parler {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13647}. Ce terme recoupe en certains sens celui de kalam; bayan a un sens plus restreint, signifiant manifestation et révélation {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13648}."
  tr: "Dilbilimciler arasında dil yalnızca dildir ve her halk amaçlarını ifade etmek için sadece sesleri kullanır. 'laghut'tan bir fiildir, yani konuşur {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.13647}. Bazı genellerde konuşmanın eşanlamlısı 'bayyan' (al-bayyan) olup, bu daha spesifiktir, 'bayyan' ise ortaya çıkarmak ve açığa çıkarmak anlamına gelir; Allah'ın sözlerinde olduğu gibi, 'Yüce Allah'a 'Ona açıklamayı öğretti' {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13648}."
  id: "Bahasa di kalangan ahli bahasa adalah bahasa itu sendiri, dan hanya bunyi yang digunakan oleh setiap bangsa untuk mengungkapkan tujuan mereka. Ini adalah kata kerja dari 'laghut' yang berarti bahasa itu berbicara {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13647}. Sinonim dari ucapan dalam beberapa umumnya adalah 'bayyan' (al-bayyan), yang lebih spesifik, sedangkan 'bayyan' berarti mengungkapkan dan mengungkapkan, seperti dalam firman Allah Yang Maha Tinggi, 'Dia mengajarinya untuk menjelaskan' {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13648}."
