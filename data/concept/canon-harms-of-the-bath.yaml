id: concept/canon-harms-of-the-bath
class: concept
kind: scientific
label:
  ar: "مضار الحمام عند ابن سينا"
  en: "The harms of the bath in the Canon"
  fr: "Méfaits du bain dans le Canon"
  ur: "حمام کے نقصانات، قانون کے مطابق"
  es: "Los perjuicios del baño en el Canon"
summary:
  ar: "يذكر ابن سينا أن للحمام مع كثرة منافعه مضار، فهو يسهل انصباب الفضول إلى الأعضاء الضعيفة، ويرخي الجسد، ويضر بالعصب، ويحلل الحرارة الغريزية، ويسقط الشهوة للطعام {cite:canon-ibn-sina-print-v1 p.141}."
  en: "Ibn Sina notes that for all its many benefits the bath has harms: it makes it easy for superfluities to flow to the weak organs, slackens the body, harms the nerves, dissolves the innate heat and removes the appetite for food {cite:canon-ibn-sina-print-v1 p.141}."
  fr: "Malgré ses bienfaits, le bain faciliterait l’afflux d’excédents aux organes faibles, relâcherait le corps, nuirait aux nerfs, dissiperait la chaleur innée et supprimerait l’appétit selon Ibn Sina {cite:canon-ibn-sina-print-v1 p.141}."
  es: "Ibn Sina señala que, a pesar de sus numerosos beneficios, el baño tiene perjuicios: facilita que las superfluidades fluyan hacia los órganos débiles, debilita el cuerpo, daña los nervios, disuelve el calor innato y elimina el apetito por la comida {cite:canon-ibn-sina-print-v1 p.141}."
  ur: "ابن سینا نوٹ کرتا ہے کہ غسل کے اپنے تمام فوائد کے ساتھ نقصانات بھی ہیں: یہ ضعیف اعضاء میں ضرورت سے زیادہ مقدار کو بہانا آسان بناتا ہے، جسم کو سست کرتا ہے، اعصاب کو نقصان پہنچاتا ہے، پیدائشی حرارت کو تحلیل کرتا ہے اور کھانے کی بھوک کو دور کرتا ہے۔"
