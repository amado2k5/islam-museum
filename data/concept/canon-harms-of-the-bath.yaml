label: { ar: "مضار الحمام عند ابن سينا", en: "The harms of the bath in the Canon", ur: "حمام کے نقصانات، قانون کے مطابق" }
summary:
  ar: "يذكر ابن سينا أن للحمام مع كثرة منافعه مضار، فهو يسهل انصباب الفضول إلى الأعضاء الضعيفة، ويرخي الجسد، ويضر بالعصب، ويحلل الحرارة الغريزية، ويسقط الشهوة للطعام {cite:canon-ibn-sina-print-v1 p.141}."
  en: "Ibn Sina notes that for all its many benefits the bath has harms: it makes it easy for superfluities to flow to the weak organs, slackens the body, harms the nerves, dissolves the innate heat and removes the appetite for food {cite:canon-ibn-sina-print-v1 p.141}."
