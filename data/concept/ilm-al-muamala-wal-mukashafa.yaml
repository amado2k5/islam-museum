id: concept/ilm-al-muamala-wal-mukashafa
class: concept
kind: discipline
label: { ar: "علم المعاملة وعلم المكاشفة", en: "Knowledge of conduct and knowledge of unveiling", ur: "علمِ معاملہ اور علمِ مکاشفہ", es: "Conocimiento de la conducta y conocimiento de la revelación", fr: "Connaissance de la conduite et connaissance du dévoilement", tr: "İşlem Bilimi ve Açıklama Bilimi", id: "Ilmu Transaksi dan Ilmu Pengungkapan" }
summary:
  ar: "قسمة الغزالي للعلم الذي يُتوجّه به إلى الآخرة: علم مكاشفة يُطلب منه كشف المعلوم فقط، وعلم معاملة يُطلب منه مع الكشف العمل به؛ وجعل إحياء علوم الدين في علم المعاملة وحده، وبنى أرباعه الأربعة على انقسامه إلى ظاهر وباطن {cite:ihya-shamela-dar-al-marifa p. 15} {cite:ihya-shamela-dar-al-marifa p. 16} {cite:ihya-shamela-dar-al-marifa p. 17}."
  en: "Al-Ghazali's division of the knowledge directed towards the hereafter: the knowledge of unveiling, sought only for disclosure of what is known, and the knowledge of conduct, sought for disclosure together with action; he devoted the Ihya' to the knowledge of conduct alone and built its four quarters on its division into outward and inward {cite:ihya-shamela-dar-al-marifa p. 15} {cite:ihya-shamela-dar-al-marifa p. 16} {cite:ihya-shamela-dar-al-marifa p. 17}."
  ur: "آخرت کی طرف لے جانے والے علم کی غزالی کی تقسیم: علمِ مکاشفہ جس سے صرف معلوم کا انکشاف مطلوب ہے، اور علمِ معاملہ جس سے انکشاف کے ساتھ عمل بھی مطلوب ہے؛ انہوں نے احیاء کو صرف علمِ معاملہ کے لیے رکھا اور اس کے چار ارباع کو اس کی ظاہر و باطن میں تقسیم پر قائم کیا {cite:ihya-shamela-dar-al-marifa p. 15} {cite:ihya-shamela-dar-al-marifa p. 16} {cite:ihya-shamela-dar-al-marifa p. 17}۔"
  es: "La división de Al-Ghazali del conocimiento orientado hacia el más allá: el conocimiento de la revelación, buscado solo para la divulgación de lo conocido, y el conocimiento de la conducta, buscado para la divulgación junto con la acción; dedicó el Ihya' solo al conocimiento de la conducta y construyó sus cuatro cuartos sobre su división en externo e interno {cite:ihya-shamela-dar-al-marifa p. 15} {cite:ihya-shamela-dar-al-marifa p. 16} {cite:ihya-shamela-dar-al-marifa p. 17}."
  fr: "La division de la connaissance dirigée vers l'au-delà selon Al-Ghazali: la connaissance du dévoilement, recherchée uniquement pour la révélation de ce qui est connu, et la connaissance de la conduite, recherchée pour la révélation accompagnée d'action; il a consacré l'Ihya' à la seule connaissance de la conduite et a construit ses quatre parties sur sa division en extérieur et intérieur {cite:ihya-shamela-dar-al-marifa p. 15} {cite:ihya-shamela-dar-al-marifa p. 16} {cite:ihya-shamela-dar-al-marifa p. 17}."
  tr: "El-Gazali'nin bilgi ayrımı, insanın Ahiret'e götürdüğü şekilde: yalnızca bilineni ortaya çıkarmayı gerektiren açığa çıkarma bilimi ve açığa çıkarma ile birlikte ona etki etmek için gereken işlem bilimi; ve dini bilimlerin canlanmasını yalnızca işlemler bilimi içinde yarattı ve bu bilimin dört çeyreğini görünür ve içsel olarak ayırmaya dayandırdı {cite:ihya-şamela-dar-al-marifa s. 15} {cite:ihya-şamela-dar-al-marifa s. 16} {cite:ihya-shamela-dar-al-marifa s. 17}."
  id: "Pembagian pengetahuan Al-Ghazali yang melalui mana seseorang menuju Akhirat: ilmu pengungkapan, yang hanya membutuhkan pengungkapan yang diketahui, dan ilmu transaksi, yang diperlukan untuk bertindak bersamaan dengan pengungkapan; dan ia melakukan kebangkitan ilmu agama hanya pada ilmu transaksi, dan mendasarkan empat bagiannya pada pembagian menjadi yang tampak dan yang dalam {cite:ihya-shamela-dar-al-marifa hlm. 15} {cite:ihya-shamela-dar-al-marifa hlm. 16} {cite:ihya-shamela-dar-al-marifa hlm. 16} {cite:ihya-shamela-dar-al-marifa hlm. 17}."
