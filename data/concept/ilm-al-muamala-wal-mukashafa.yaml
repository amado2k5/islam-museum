id: concept/ilm-al-muamala-wal-mukashafa
class: concept
kind: discipline
label: { ar: "علم المعاملة وعلم المكاشفة", en: "Knowledge of conduct and knowledge of unveiling", ur: "علمِ معاملہ اور علمِ مکاشفہ" }
summary:
  ar: "قسمة الغزالي للعلم الذي يُتوجّه به إلى الآخرة: علم مكاشفة يُطلب منه كشف المعلوم فقط، وعلم معاملة يُطلب منه مع الكشف العمل به؛ وجعل إحياء علوم الدين في علم المعاملة وحده، وبنى أرباعه الأربعة على انقسامه إلى ظاهر وباطن {cite:ihya-shamela-dar-al-marifa p. 15} {cite:ihya-shamela-dar-al-marifa p. 16} {cite:ihya-shamela-dar-al-marifa p. 17}."
  en: "Al-Ghazali's division of the knowledge directed towards the hereafter: the knowledge of unveiling, sought only for disclosure of what is known, and the knowledge of conduct, sought for disclosure together with action; he devoted the Ihya' to the knowledge of conduct alone and built its four quarters on its division into outward and inward {cite:ihya-shamela-dar-al-marifa p. 15} {cite:ihya-shamela-dar-al-marifa p. 16} {cite:ihya-shamela-dar-al-marifa p. 17}."
  ur: "آخرت کی طرف لے جانے والے علم کی غزالی کی تقسیم: علمِ مکاشفہ جس سے صرف معلوم کا انکشاف مطلوب ہے، اور علمِ معاملہ جس سے انکشاف کے ساتھ عمل بھی مطلوب ہے؛ انہوں نے احیاء کو صرف علمِ معاملہ کے لیے رکھا اور اس کے چار ارباع کو اس کی ظاہر و باطن میں تقسیم پر قائم کیا {cite:ihya-shamela-dar-al-marifa p. 15} {cite:ihya-shamela-dar-al-marifa p. 16} {cite:ihya-shamela-dar-al-marifa p. 17}۔"
