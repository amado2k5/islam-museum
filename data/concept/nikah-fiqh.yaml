label:
  ar: "النِّكَاح"
  en: "Nikah (marriage in fiqh)"
  ur: "نکاح ⁦(فقہ میں)⁩"
  es: "Nikah (matrimonio en fiqh)"
  fr: "Nikah (mariage en fiqh)"
  tr: "Evlilik"
  id: "Pernikahan"
summary:
  ar: "النكاح في اللغة يطلق على الوطء وعلى العقد دون الوطء، ويعرّفه كل مذهب تعريفاً يخصّه: الحنفية بأنه عقد يفيد ملك المتعة بالأنثى قصداً، والمالكية بأنه عقد لحل تمتع بأنثى غير محرم، والشافعية بأنه عقد يتضمن إباحة وطء بلفظ إنكاح أو تزويج، والحنابلة بأنه عقد التزويج {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16034}. واختلف الفقهاء في حقيقة النكاح على ثلاثة آراء: أنه حقيقة في الوطء مجاز في العقد، أو العكس، أو حقيقة فيهما معاً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16034} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16035}. ويترتب على هذا الخلاف أحكام في الفروع، منها تحريم الزوجات على أصول من زنى بامرأة وفروعها عند الحنفية والحنابلة في الأشهر، وخلاف المالكية والشافعية في ذلك، والحنث في اليمين على عدم النكاح والطلاق المعلق عليه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16036} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16037}. وتذكر الموسوعة ألفاظاً ذات صلة: الخطبة مقدمة للنكاح، والسفاح ضده لأن الوطء فيه حرام، والطلاق حل عقد النكاح {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16037} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16038}."
  en: "In the lexicon, nikah can mean intercourse or the contract without intercourse. Each school gives its own definition: the Hanafis call it a contract that gives a man enjoyment of a woman, the Malikis a contract making lawful enjoyment of a woman who is not forbidden to him, the Shafi'is a contract that carries the permission of intercourse by the words nikah or tazwij, and the Hanbalis the contract of tazwij {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16034}. The jurists give three views on whether the word is literally intercourse, literally the contract, or both. The disagreement changes some rulings, such as whether a man who committed zina with a woman makes her forbidden to his ascendants and descendants, and whether an oath not to marry, or a divorce tied to marriage, is broken by the contract or by intercourse {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16034} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16035} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16036} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16037}. Related terms are khitba, the proposal that comes before marriage; sifah, illicit intercourse, the opposite of marriage; and talaq, the ending of the marriage tie {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16037} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16038}. This is a partial draft of the entry (completeness 0): the ruling by category, the wisdom, the pillars and the formula are not yet drafted."
  ur: "لغت میں نکاح کا لفظ وطی اور عقد دونوں کے لیے آتا ہے۔ ہر مذہب نے اپنی تعریف کی ہے: حنفیہ کے نزدیک یہ وہ عقد ہے جو مرد کو عورت سے قصداً استمتاع کا حق دے، مالکیہ کے نزدیک وہ عقد جو غیر محرم عورت سے تمتع کو حلال کرے، شافعیہ کے نزدیک وہ عقد جو لفظ نکاح یا تزویج سے وطی کی اجازت دے، اور حنابلہ کے نزدیک عقد تزویج {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16034}۔ فقہاء کی تین آراء ہیں کہ یہ لفظ حقیقتاً وطی ہے، حقیقتاً عقد ہے، یا دونوں کے لیے حقیقت ہے؛ اس اختلاف سے کچھ فروعی احکام بدلتے ہیں، جیسے زنا سے اصول و فروع کی حرمت اور نکاح نہ کرنے کی قسم کا حنث {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16034} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16035} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16036} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16037}۔ متعلقہ الفاظ میں خطبہ نکاح سے پہلے کی بات چیت ہے، سفاح نکاح کی ضد ہے، اور طلاق نکاح کے بندھن کو کھولنا ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16037} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16038}۔ یہ مسودہ جزوی ہے (completeness 0)؛ احکام کی تقسیم، حکمت، ارکان اور صیغہ ابھی شامل نہیں کیے گئے۔"
  es: "En el léxico, nikah puede significar coito o contrato sin coito. Cada escuela ofrece su propia definición: los hanafíes lo llaman un contrato que otorga al hombre el disfrute de una mujer, los malikíes un contrato que legitima el disfrute de una mujer que no le está prohibida, los shafiíes un contrato que conlleva el permiso para el coito mediante las palabras nikah o tazwij, y los hanbalíes el contrato de tazwij {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16034}. Los juristas presentan tres puntos de vista sobre si la palabra significa literalmente coito, literalmente contrato, o ambas cosas. El desacuerdo cambia algunas decisiones, como si un hombre que cometió zina con una mujer la hace prohibida para sus ascendientes y descendientes, y si un juramento de no casarse, o un divorcio vinculado al matrimonio, se rompe por el contrato o por el coito {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16034} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16035} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16036} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16037}. Los términos relacionados son khitba, la propuesta que viene antes del matrimonio; sifah, coito ilícito, lo opuesto al matrimonio; y talaq, la ruptura del vínculo matrimonial {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16037} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16038}. Este es un borrador parcial de la entrada (completitud 0): la regla por categoría, la sabiduría, los pilares y la fórmula aún no están redactados."
  fr: "Dans le lexique, le terme « nikah » peut désigner soit l'acte sexuel, soit un contrat sans acte sexuel. Chaque école de pensée en donne la définition: les hanafites le décrivent comme un contrat autorisant un homme à jouir d'une femme; les malikites, comme un contrat rendant licite la jouissance d'une femme qui ne lui est pas interdite; les shafi'ites, comme un contrat impliquant l'autorisation de l'acte sexuel par les termes « nikah » ou « tazwij »; et les hanbalites, comme le contrat de « tazwij » (voir: Fiqh-mawsua-kuwaitiyya-noor-v3 p. 16034). Les juristes proposent trois interprétations: le terme peut désigner littéralement l'acte sexuel, littéralement le contrat, ou les deux. Ce désaccord modifie certaines règles, notamment celle de savoir si un homme ayant commis l'adultère (zina) avec une femme la rend interdite à ses ascendants et descendants, et si un serment de non-mariage ou un divorce lié au mariage est rompu par le contrat ou par les rapports sexuels {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16034} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16035} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16036} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16037}. Les termes associés sont khitba (la proposition qui précède le mariage) et sifah (les rapports sexuels illicites, contraires au mariage). et le talaq, la rupture du lien matrimonial {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16037} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16038}. Ceci est une ébauche partielle de l'entrée (complétude 0): la règle par catégorie, la sagesse, les piliers et la formule ne sont pas encore rédigés."
  tr: "Dilsel olarak nikah, cinsel ilişki ve cinsel ilişki olmadan sözleşmeyi ifade eder. Her okul bunu özel bir tanım olarak tanımlar: Hanafiler, kasıtlı olarak bir kadınla geçici evliliğin sahipliğini belirten bir sözleşme; Maliki okulu ise mahram olmayan bir kadınla cinsel ilişkinin izin verilmesine ilişkin bir sözleşme olarak; Şafiiler ise bunu 'nikah' veya 'evlilik' terimleriyle cinsel ilişkiye izin veren bir sözleşme olarak kabul eder; ve Hanbalılar bunu evlilik sözleşmesi olarak kabul eder {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.16034}. Hukukçular evliliğin gerçekliği konusunda üç görüşe göre farklı görüşe sahiptir: evlilik gerçek bir ilişki sözleşmesi mi, tam tersi mi, yoksa her ikisinde de gerçek bir şey mi {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16034} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16035}. Bu anlaşmazlık, kadınlarla zina edenlerin ilkelerine dayanarak kadın ve onun kollarına göre en yaygın durumlarda eşlerin yasaklanması, Maliki ve Şafii arasındaki anlaşmazlıklar, evliliği engelleme yemininin bozulması ve boşanmanın askıya alınması gibi kollarda kararlara yol açıyor {atıf: Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.16036} {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.16037}. Ansiklopedi ilgili terimlerden bahseder: nişan evliliğin önsözü, cinsel ilişki yasak olduğu için ensest aleyhtir ve boşanma evlilik sözleşmesinin feshidir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16037} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16038}."
  id: "Secara linguistik, nikah merujuk pada hubungan seksual dan kontrak tanpa hubungan seksual. Setiap aliran mendefinisikannya sebagai definisi khusus: Hanafi sebagai kontrak yang menunjukkan kepemilikan pernikahan sementara dengan wanita secara sengaja; aliran Maliki sebagai kontrak atas izin hubungan seksual dengan wanita non-mahram; syafi'i menganggapnya sebagai kontrak yang mengizinkan hubungan seksual dengan istilah 'nikah' atau 'pernikahan'; dan Hanbal menganggapnya sebagai kontrak pernikahan {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16034}. Para ahli hukum berbeda pendapat tentang realitas pernikahan berdasarkan tiga pendapat: apakah itu kontrak nyata dalam hubungan seksual, atau sebaliknya, atau realitas dalam keduanya {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16034} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16035}. Perbedaan ini menyebabkan keputusan cabang, termasuk larangan istri berdasarkan prinsip mereka yang berzina dengan wanita dan cabang-cabangnya menurut Hanafi dan Hanbali dalam kasus yang paling populer, perbedaan pendapat Maliki dan Shafi'i mengenai hal ini, melanggar sumpah untuk mencegah pernikahan, dan perceraian yang ditangguhkan {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16036} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16037}. Ensiklopedia menyebutkan istilah terkait: pertunangan adalah pendahuluan pernikahan, inses menentangnya karena hubungan seksual dilarang, dan perceraian adalah pembubaran kontrak pernikahan {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16037} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16038}."
