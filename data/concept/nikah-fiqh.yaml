label:
  ar: "النِّكَاح"
  en: "Nikah (marriage in fiqh)"
  ur: "نکاح (فقہ میں)"
summary:
  ar: "النكاح في اللغة يطلق على الوطء وعلى العقد دون الوطء، ويعرّفه كل مذهب تعريفاً يخصّه: الحنفية بأنه عقد يفيد ملك المتعة بالأنثى قصداً، والمالكية بأنه عقد لحل تمتع بأنثى غير محرم، والشافعية بأنه عقد يتضمن إباحة وطء بلفظ إنكاح أو تزويج، والحنابلة بأنه عقد التزويج {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16034}. واختلف الفقهاء في حقيقة النكاح على ثلاثة آراء: أنه حقيقة في الوطء مجاز في العقد، أو العكس، أو حقيقة فيهما معاً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16034} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16035}. ويترتب على هذا الخلاف أحكام في الفروع، منها تحريم الزوجات على أصول من زنى بامرأة وفروعها عند الحنفية والحنابلة في الأشهر، وخلاف المالكية والشافعية في ذلك، والحنث في اليمين على عدم النكاح والطلاق المعلق عليه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16036} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16037}. وتذكر الموسوعة ألفاظاً ذات صلة: الخطبة مقدمة للنكاح، والسفاح ضده لأن الوطء فيه حرام، والطلاق حل عقد النكاح {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16037} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16038}."
  en: "In the lexicon, nikah can mean intercourse or the contract without intercourse. Each school gives its own definition: the Hanafis call it a contract that gives a man enjoyment of a woman, the Malikis a contract making lawful enjoyment of a woman who is not forbidden to him, the Shafi'is a contract that carries the permission of intercourse by the words nikah or tazwij, and the Hanbalis the contract of tazwij {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16034}. The jurists give three views on whether the word is literally intercourse, literally the contract, or both. The disagreement changes some rulings, such as whether a man who committed zina with a woman makes her forbidden to his ascendants and descendants, and whether an oath not to marry, or a divorce tied to marriage, is broken by the contract or by intercourse {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16034} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16035} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16036} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16037}. Related terms are khitba, the proposal that comes before marriage; sifah, illicit intercourse, the opposite of marriage; and talaq, the ending of the marriage tie {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16037} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16038}. This is a partial draft of the entry (completeness 0): the ruling by category, the wisdom, the pillars and the formula are not yet drafted."
  ur: "لغت میں نکاح کا لفظ وطی اور عقد دونوں کے لیے آتا ہے۔ ہر مذہب نے اپنی تعریف کی ہے: حنفیہ کے نزدیک یہ وہ عقد ہے جو مرد کو عورت سے قصداً استمتاع کا حق دے، مالکیہ کے نزدیک وہ عقد جو غیر محرم عورت سے تمتع کو حلال کرے، شافعیہ کے نزدیک وہ عقد جو لفظ نکاح یا تزویج سے وطی کی اجازت دے، اور حنابلہ کے نزدیک عقد تزویج {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16034}۔ فقہاء کی تین آراء ہیں کہ یہ لفظ حقیقتاً وطی ہے، حقیقتاً عقد ہے، یا دونوں کے لیے حقیقت ہے؛ اس اختلاف سے کچھ فروعی احکام بدلتے ہیں، جیسے زنا سے اصول و فروع کی حرمت اور نکاح نہ کرنے کی قسم کا حنث {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16034} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16035} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16036} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16037}۔ متعلقہ الفاظ میں خطبہ نکاح سے پہلے کی بات چیت ہے، سفاح نکاح کی ضد ہے، اور طلاق نکاح کے بندھن کو کھولنا ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16037} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16038}۔ یہ مسودہ جزوی ہے (completeness 0)؛ احکام کی تقسیم، حکمت، ارکان اور صیغہ ابھی شامل نہیں کیے گئے۔"
