id: concept/barley-shair
class: concept
kind: legal
label:
  ar: "الشَّعِير"
  en: "Barley (shi'ir): zakat, zakat al-fitr, sale of standing crops and its place among the ribawi goods"
summary:
  ar: "الشعير حب معروف، وهو دون البر في الغذاء، وتتعلق به أحكام الزكاة وزكاة الفطر والبيع والربا. فهو من الحبوب التي تجب فيها الزكاة إذا بلغت النصاب بإجماع الفقهاء، ويجزئ صاع منه في زكاة الفطر بالإجماع، ويعد من الأموال الربوية التي لا يباع بعضها ببعض إلا مثلا بمثل يدا بيد إذا كانا من جنس واحد. ويختلف الفقهاء في ضم الشعير إلى السلت أو القمح في إكمال النصاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10096} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10097} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10098}"
  en: "Barley is a known grain, less valued than wheat as food. Several rulings attach to it: zakat on crops, zakat al-fitr, sale and usury. Its zakat is due once it reaches the threshold by consensus, a measure of it suffices for zakat al-fitr by consensus, and it is one of the ribawi goods, which may be exchanged for one another only in equal measure and hand to hand when of the same kind. The jurists differ on whether barley is joined to spelt or wheat to complete the threshold. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10096} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10097} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10098}"
