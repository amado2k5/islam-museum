id: concept/barley-shair
class: concept
kind: legal
label:
  ar: "الشَّعِير"
  en: "Barley (shi'ir): zakat, zakat al-fitr, sale of standing crops and its place among the ribawi goods"
  fr: "Orge (shi'ir) : zakat, zakat al-fitr, vente des cultures sur pied et produits soumis au riba"
  es: "Cebada (shi'ir): zakat, zakat al-fitr, venta de cosechas en pie y su lugar entre los bienes ribawi."
  ur: "جَو ⁦(شِیر)⁩: زکوٰۃ، فطرانہ، کھڑی فصلوں کی خریدوفروخت اور ربوی مال میں اس کی جگہ"
  tr: "Arpa"
  id: "jelai"
summary:
  ar: "الشعير حب معروف، وهو دون البر في الغذاء، وتتعلق به أحكام الزكاة وزكاة الفطر والبيع والربا. فهو من الحبوب التي تجب فيها الزكاة إذا بلغت النصاب بإجماع الفقهاء، ويجزئ صاع منه في زكاة الفطر بالإجماع، ويعد من الأموال الربوية التي لا يباع بعضها ببعض إلا مثلا بمثل يدا بيد إذا كانا من جنس واحد. ويختلف الفقهاء في ضم الشعير إلى السلت أو القمح في إكمال النصاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10096} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10097} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10098}"
  en: "Barley is a known grain, less valued than wheat as food. Several rulings attach to it: zakat on crops, zakat al-fitr, sale and usury. Its zakat is due once it reaches the threshold by consensus, a measure of it suffices for zakat al-fitr by consensus, and it is one of the ribawi goods, which may be exchanged for one another only in equal measure and hand to hand when of the same kind. The jurists differ on whether barley is joined to spelt or wheat to complete the threshold. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10096} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10097} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10098}"
  fr: "L’orge est une céréale connue, moins prisée que le blé comme aliment. Plusieurs règles s’y rattachent : zakat des récoltes, zakat al-fitr, vente et usure. Tous s’accordent à la soumettre à la zakat lorsqu’elle atteint le seuil, à considérer qu’une mesure suffit pour la zakat al-fitr et à la compter parmi les produits soumis au riba, échangeables à quantité égale et de la main à la main lorsqu’ils sont de même espèce. Les juristes divergent sur le cumul de l’orge avec l’épeautre ou le blé pour atteindre le seuil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10096} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10097} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10098}"
  es: "La cebada es un grano conocido, menos valorado que el trigo como alimento. Se le aplican varias normas: zakat sobre las cosechas, zakat al-fitr, venta y usura. Su zakat se debe pagar una vez que alcanza el umbral por consenso, una medida de cebada es suficiente para el zakat al-fitr por consenso, y es uno de los bienes ribawi, que solo pueden intercambiarse entre sí en igual medida y de mano en mano cuando son del mismo tipo. Los juristas difieren en si la cebada se une a la espelta o al trigo para completar el umbral. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10096} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10097} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10098}"
  ur: "جو ایک معروف اناج ہے، جس کی قیمت کھانے کے طور پر گندم سے کم ہے۔ اس کے ساتھ کئی احکام منسلک ہیں: فصلوں کی زکوٰۃ، فطرانہ، خریدوفروخت اور سود۔ اس کی زکوٰۃ اس وقت واجب ہوتی ہے جب یہ اجماع کے ساتھ حد تک پہنچ جائے، اس کا ایک پیمانہ اتفاق سے فطرانہ کے لیے کافی ہے، اور یہ ربوی مال میں سے ہے، جس کا ایک دوسرے کے لیے برابری کے حساب سے تبادلہ کیا جا سکتا ہے۔ فقہاء کا اس میں اختلاف ہے کہ جو کو ہجے کے ساتھ ملایا جاتا ہے یا گندم کو حد کو پورا کرنے کے لیے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10096} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10097}"
  tr: "Arpa iyi bilinen bir tahıldır ve gıda olarak buğdaydan daha azdır; ayrıca zekat, zekat, satış ve tefecilik hükümleriyle ilişkilidir. Eğer nisab hukukçular arasında uzlaşılırsa, bu tahıllar arasında hak edilir. Bunun bir s'i, uzlaşmayla zekat al-Fitr için yeterli olmasıdır. Tefeci servet olarak kabul edilir ve bir kısmı, örneğin aynı türden olan bir el ele eşdeğeri dışında satılır. Hukukçular, nisabın tamamlanmasında tuza arpa mı yoksa buğday mı eklendiği konusunda farklı görüşler sergiler. {alıntı:) fiqh-mawsua-kuwaitiyya-noor-v3 s.10096} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.10097} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.10098}"
  id: "Barley adalah biji-bijian yang terkenal, dan makanannya kurang dari gandum, serta terkait dengan aturan zakat, zakat al-fitr, sale, dan riba. Ini termasuk di antara biji-bijian yang harus dibayar zakat jika nisab dicapai dengan konsensus di antara para ahli hukum. Salah satu sa' di antaranya adalah kecukupan zakat al-Fitr berdasarkan konsensus. Ini dianggap sebagai kekayaan riba, beberapa di antaranya dijual kecuali, misalnya, setara dengan tangan di tangan jika jenis yang sama. Para ahli hukum berbeda pendapat apakah jelai ditambahkan ke garam atau gandum dalam menyelesaikan nisab. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10096} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10097} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10098}"
