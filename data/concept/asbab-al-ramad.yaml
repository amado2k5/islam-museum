id: "concept/asbab-al-ramad"
class: "concept"
kind: "scientific"
label:
  ar: "أسباب الرمد وأحواله"
  en: "Causes and circumstances of ophthalmia"
  fr: "Causes et circonstances de l’ophtalmie"
  ur: "رمد کے اسباب اور احوال"
  es: "Causas y circunstancias de la oftalmía"
summary:
  ar: "مواد الرمد إما من التمدد وإما من الرأس نفسه وإما من العروق التي تؤدي إلى العين مادة رديئة حارة أو باردة وإما من العين نفسها إذا فسد مزاج طبقاتها أو رمد طال عليها فحيل غذاؤها إلى الفساد، ورداءته بحسب كيفية المادة وعظمه بحسب كميتها، والبلاد الجنوبية يكثر فيها ويزول بسرعة والباردة يقل ويصعب، ويقاس على ذلك الأبدان الصلبة واللينة {cite:canon-ibn-sina-print-v2 p.168}"
  en: "Ramad's matter comes from distension, from the head itself, from the vessels carrying a bad hot or cold matter to the eye, or from the eye itself when its coats' temper corrupts or an old ramad turns all nourishment to corruption; its badness follows the matter's quality, its greatness the quantity; southern lands see much ramad that resolves fast, cold lands little but stubborn — and hard bodies are measured like northern lands, loose soft ones like southern {cite:canon-ibn-sina-print-v2 p.168}"
  fr: "La matière du ramad vient de la distension, de la tête elle-même, des vaisseaux apportant à l’œil une mauvaise matière chaude ou froide, ou de l’œil lui-même lorsque le tempérament de ses tuniques se corrompt ou qu’un ramad ancien corrompt toute nourriture ; sa gravité suit la qualité de la matière, son ampleur la quantité ; les pays du Sud connaissent beaucoup de ramad vite résolus, les pays froids peu de cas mais tenaces — les corps durs se jugent comme les pays du Nord, les corps lâches et mous comme ceux du Sud {cite:canon-ibn-sina-print-v2 p.168}"
  ur: "رمد کا مادہ یا تَناو سے آتا ہے، یا خود سر سے، یا ان رگوں سے جو آنکھ تک کوئی بُرا گرم یا سرد مادہ لاتی ہیں، یا خود آنکھ سے جب اس کی تہوں کا مزاج بگڑ جائے یا پرانا رمد اس کی غذا کو فساد میں بدل دے؛ اس کی بدی مادے کی کیفیت کے مطابق اور عظمت اس کی مقدار کے مطابق ہوتی ہے؛ جنوبی ممالک میں رمد بہت ہوتا ہے مگر جلد جاتا ہے، سرد ممالک میں کم مگر دشوار — اور اسی قیاس پر سخت بدن شمالی ممالک اور نرم کھلے بدن جنوبی ممالک کے حکم میں ہیں {cite:canon-ibn-sina-print-v2 p.168}"
  es: "La materia de Ramad proviene de la distensión, de la cabeza misma, de los vasos que transportan una materia mala, caliente o fría, al ojo, o del ojo mismo cuando el temperamento de sus capas se corrompe o un Ramad viejo convierte todo alimento en corrupción; su maldad sigue la calidad de la materia, su grandeza la cantidad; las tierras del sur ven mucho Ramad que se resuelve rápidamente, las tierras frías poco pero obstinado, y los cuerpos duros se miden como las tierras del norte, los blandos y sueltos como los del sur {cite:canon-ibn-sina-print-v2 p.168}"
