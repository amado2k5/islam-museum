label: { ar: "الحيازة", en: "Hiyaza (possession and its effect on title)", ur: "حیازت (قبضہ اور ملکیت)" }
summary:
  ar: "الحيازة لغة الجمع وضم الشيء، واصطلاحا وضع اليد على الشيء والاستيلاء عليه، وهي بمعنى القبض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7441} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7442} وتكون بثلاثة أشياء عند الحطاب: أضعفها السكنى والزراعة، ويليها الهدم والبناء والغرس والاستغلال، ثم التفويت بالبيع والهبة والصدقة والعتق وما يفعله المالك في ماله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7442} والقبض والحيازة شيء واحد عند جمهور الفقهاء، ووضع اليد يقال على الملك والتصرف، وتتعلق بها الترجيحات في البينات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7442} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7443} وتكون الحيازة مشروعة كإحياء الموات والاصطياد والاحتشاش والمعدن والركاز واللقطة وبالعقد، وغير مشروعة كالغصب والسرقة والحرابة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7443} والحيازة دليل على الملك لا ناقلة له عند ابن رشد، وطول مدتها وصلة الحائز بمدعي الملك وتصرفه يؤثران فيها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7443} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7446} واختلف الفقهاء في البينات بين الخارج والداخل: فالحنفية وأحمد في رواية بينة المدعي مقدمة، والشافعية والمالكية تقدم بينة صاحب اليد، وللمالكية تفصيلات في مراتب الحيازة وشروطها: التصرف، وحضور المدعي وعلمه، وعدم سكوت طويل، وانتفاء الموانع كالخوف والسفه والصغر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7445} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7446} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7447} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7448} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7449} ويتصل المدخل بمسائل الحيازة عند المالكية، ولم يكتمل في هذه الصفحات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7449}  وتبلغ المدة عند المالكية عشر سنين، وهو المعتمد بالحديث «من احتاز شيئا عشر سنين فهو له»، وفي قول سبع سنين، وفي قول يجتهد الإمام؛ وبين الأقارب والشركاء تزيد المدة على أربعين عاما، والأب والابن مختلفة فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7450} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7454} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7455} وفي المنقول يختلف الأمر: فالثياب والدواب تتقدم حيازتها بالاجتهاد، والحيازة في الأملاك على الأقارب والموالي والأصهار لها مراتب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7455} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7456} ويؤثر التصرف بالبيع والهبة في الحيازة، ويختلف أثره بحسب حضور المالك واعتراضه وسكوته، ولا تبطل حقوق المسلم بالتأخر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7455} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7457} ويرى المالكية أنه إذا كان الحق ثابتا بحكم قضائي أو سند رسمي فلا تنفع الحيازة، والحيازة لا تنفع إلا مع جهل أصل التملك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7457}"
  en: "Hiyaza lexically is gathering and taking something into one's hand; technically it is laying hands on a thing and controlling it, and it equals taking possession. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7441} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7442} Al-Hattab gives three grades: the weakest is dwelling or farming, next building, planting and exploitation, and strongest a disposition by sale, gift, charity, manumission or any act an owner does with his property. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7442} For most jurists possession and taking delivery are one; laying the hand may mean ownership or management, and it counts in the weighing of proofs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7442} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7443} Possession is lawful when it comes by reviving dead land, hunting, gathering grass, mines, treasure trove and found property, or by contract, and unlawful when by usurpation, theft or brigandage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7443} Ibn Rushd holds that possession is evidence of ownership and does not transfer it; its weight depends on its duration, the claimant's relation to the possessor and the nature of the thing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7443} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7446} On conflicting proofs, the Hanafis and a Hanbali view prefer the claimant's proof, while the Shafiis and Malikis prefer the possessor's; the Malikis have detailed rules on the grades of possession, the claimant's presence and knowledge, the length of silence, and bars such as fear, incapacity or youth. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7445} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7446} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7447} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7448} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7449}  On the Maliki view the period is ten years, the sound view by the hadith 'whoever possesses a thing for ten years owns it', with a view of seven years and a view leaving it to the judge; between relatives and partners it exceeds forty years, and between father and son the view differs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7450} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7454} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7455} For movables the rule differs: clothes and beasts are judged by discretion, and possession of property between relatives, in-laws and clients has its own grades. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7455} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7456} The effect of a sale or a gift depends on whether the owner was present, objected or was silent, and a right is not lost by a late claim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7455} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7457} Where the right is fixed by a judgement or a sound deed, possession avails nothing, and possession only avails where the origin of ownership is unknown. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7457}"
  ur: "حیازت لغت میں جمع کرنے اور کسی شے کو اپنے قبضے میں لینے کو کہتے ہیں؛ اصطلاحاً کسی چیز پر ہاتھ رکھ کر اس پر قبضہ کرنا، اور یہ قبض کے ہم معنی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7441} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7442} حطاب کے نزدیک حیازت تین درجات کی ہے: کمزور ترین رہائش یا کاشت، اس کے بعد ڈھانا، تعمیر، درخت لگانا اور استغلال، اور سب سے مضبوط بیع، ہبہ، صدقہ، آزادی یا مالک کا اپنے مال میں کیا ہوا کوئی تصرف۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7442} جمہور کے نزدیک حیازت اور قبض ایک ہی چیز ہے؛ ہاتھ رکھنا ملکیت یا تصرف کی علامت بھی ہو سکتا ہے، اور بینات کے وزن میں اس کا اعتبار ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7442} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7443} حیازت شرعی طریقوں سے ہوتی ہے جیسے احیائے موات، شکار، گھاس کاٹنا، معدن، رکاز، لقطہ اور عقد سے، اور غیر شرعی طریقوں سے جیسے غصب، چوری اور ڈاکہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7443} ابن رشد کے نزدیک حیازت ملکیت پر دلالت کرتی ہے مگر منتقل نہیں کرتی؛ اس کا وزن مدت، مدعیٔ ملکیت سے تعلق اور شے کی نوعیت پر منحصر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7443} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7446} بینات میں اختلاف کی صورت میں حنفیہ اور امام احمد کی ایک روایت مدعی کی بینہ کو مقدم کرتے ہیں، جبکہ شافعیہ اور مالکیہ صاحبِ ید کی بینہ کو؛ مالکیہ کے ہاں حیازت کے درجات، مدعی کی حاضری اور علم، طویل خاموشی اور خوف، سفہ اور صغر جیسے موانع کے تفصیلی احکام ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7445} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7446} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7447} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7448} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7449}  مالکیہ کے نزدیک حیازت کی مدت دس سال ہے، جو معتمد ہے اس حدیث کی بنا پر کہ «جو شخص کوئی شے دس سال حیازت میں رکھے تو وہ اسی کی ہے»، اور ایک قول سات سال کا ہے، اور ایک قول قاضی کے اجتہاد کا؛ رشتہ داروں اور شرکاء کے درمیان مدت چالیس سال سے زیادہ ہے، اور باپ بیٹے کے درمیان اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7450} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7454} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7455} منقولات میں معاملہ مختلف ہے؛ کپڑوں اور جانوروں کی حیازت اجتہاد پر چھوڑی گئی ہے، اور رشتہ داروں، سسرالی رشتہ داروں اور موالی کے درمیان جائیداد پر حیازت کے مراتب ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7455} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7456} بیع یا ہبہ کا اثر مالک کی حاضری، اعتراض یا خاموشی کے مطابق ہوتا ہے، اور دیر سے دعویٰ کرنے سے حق باطل نہیں ہوتا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7455} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7457} جب حق حکم قضائی یا رسمی سند سے ثابت ہو تو حیازت نفع نہیں دیتی، اور حیازت صرف اصل ملکیت کی لاعلمی میں نفع دیتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7457}"
