id: concept/hiyaza-possession
class: concept
kind: legal
label: { ar: "الحيازة", en: "Hiyaza (possession and its effect on title)", ur: "حیازت ⁦(قبضہ اور ملکیت)⁩", es: "Hiyaza (posesión y su efecto en el título)", fr: "Hiyaza (possession et son effet sur le titre)", tr: "Topa sahip olma", id: "Kepemilikan" }
summary:
  ar: "الحيازة لغة الجمع وضم الشيء، واصطلاحا وضع اليد على الشيء والاستيلاء عليه، وهي بمعنى القبض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7441} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7442} وتكون بثلاثة أشياء عند الحطاب: أضعفها السكنى والزراعة، ويليها الهدم والبناء والغرس والاستغلال، ثم التفويت بالبيع والهبة والصدقة والعتق وما يفعله المالك في ماله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7442} والقبض والحيازة شيء واحد عند جمهور الفقهاء، ووضع اليد يقال على الملك والتصرف، وتتعلق بها الترجيحات في البينات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7442} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7443} وتكون الحيازة مشروعة كإحياء الموات والاصطياد والاحتشاش والمعدن والركاز واللقطة وبالعقد، وغير مشروعة كالغصب والسرقة والحرابة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7443} والحيازة دليل على الملك لا ناقلة له عند ابن رشد، وطول مدتها وصلة الحائز بمدعي الملك وتصرفه يؤثران فيها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7443} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7446} واختلف الفقهاء في البينات بين الخارج والداخل: فالحنفية وأحمد في رواية بينة المدعي مقدمة، والشافعية والمالكية تقدم بينة صاحب اليد، وللمالكية تفصيلات في مراتب الحيازة وشروطها: التصرف، وحضور المدعي وعلمه، وعدم سكوت طويل، وانتفاء الموانع كالخوف والسفه والصغر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7445} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7446} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7447} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7448} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7449} ويتصل المدخل بمسائل الحيازة عند المالكية، ولم يكتمل في هذه الصفحات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7449}  وتبلغ المدة عند المالكية عشر سنين، وهو المعتمد بالحديث «من احتاز شيئا عشر سنين فهو له»، وفي قول سبع سنين، وفي قول يجتهد الإمام؛ وبين الأقارب والشركاء تزيد المدة على أربعين عاما، والأب والابن مختلفة فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7450} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7454} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7455} وفي المنقول يختلف الأمر: فالثياب والدواب تتقدم حيازتها بالاجتهاد، والحيازة في الأملاك على الأقارب والموالي والأصهار لها مراتب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7455} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7456} ويؤثر التصرف بالبيع والهبة في الحيازة، ويختلف أثره بحسب حضور المالك واعتراضه وسكوته، ولا تبطل حقوق المسلم بالتأخر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7455} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7457} ويرى المالكية أنه إذا كان الحق ثابتا بحكم قضائي أو سند رسمي فلا تنفع الحيازة، والحيازة لا تنفع إلا مع جهل أصل التملك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7457}"
  en: "Hiyaza lexically is gathering and taking something into one's hand; technically it is laying hands on a thing and controlling it, and it equals taking possession. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7441} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7442} Al-Hattab gives three grades: the weakest is dwelling or farming, next building, planting and exploitation, and strongest a disposition by sale, gift, charity, manumission or any act an owner does with his property. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7442} For most jurists possession and taking delivery are one; laying the hand may mean ownership or management, and it counts in the weighing of proofs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7442} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7443} Possession is lawful when it comes by reviving dead land, hunting, gathering grass, mines, treasure trove and found property, or by contract, and unlawful when by usurpation, theft or brigandage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7443} Ibn Rushd holds that possession is evidence of ownership and does not transfer it; its weight depends on its duration, the claimant's relation to the possessor and the nature of the thing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7443} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7446} On conflicting proofs, the Hanafis and a Hanbali view prefer the claimant's proof, while the Shafiis and Malikis prefer the possessor's; the Malikis have detailed rules on the grades of possession, the claimant's presence and knowledge, the length of silence, and bars such as fear, incapacity or youth. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7445} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7446} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7447} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7448} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7449}  On the Maliki view the period is ten years, the sound view by the hadith 'whoever possesses a thing for ten years owns it', with a view of seven years and a view leaving it to the judge; between relatives and partners it exceeds forty years, and between father and son the view differs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7450} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7454} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7455} For movables the rule differs: clothes and beasts are judged by discretion, and possession of property between relatives, in-laws and clients has its own grades. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7455} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7456} The effect of a sale or a gift depends on whether the owner was present, objected or was silent, and a right is not lost by a late claim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7455} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7457} Where the right is fixed by a judgement or a sound deed, possession avails nothing, and possession only avails where the origin of ownership is unknown. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7457}"
  ur: "حیازت لغت میں جمع کرنے اور کسی شے کو اپنے قبضے میں لینے کو کہتے ہیں؛ اصطلاحاً کسی چیز پر ہاتھ رکھ کر اس پر قبضہ کرنا، اور یہ قبض کے ہم معنی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7441} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7442} حطاب کے نزدیک حیازت تین درجات کی ہے: کمزور ترین رہائش یا کاشت، اس کے بعد ڈھانا، تعمیر، درخت لگانا اور استغلال، اور سب سے مضبوط بیع، ہبہ، صدقہ، آزادی یا مالک کا اپنے مال میں کیا ہوا کوئی تصرف۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7442} جمہور کے نزدیک حیازت اور قبض ایک ہی چیز ہے؛ ہاتھ رکھنا ملکیت یا تصرف کی علامت بھی ہو سکتا ہے، اور بینات کے وزن میں اس کا اعتبار ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7442} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7443} حیازت شرعی طریقوں سے ہوتی ہے جیسے احیائے موات، شکار، گھاس کاٹنا، معدن، رکاز، لقطہ اور عقد سے، اور غیر شرعی طریقوں سے جیسے غصب، چوری اور ڈاکہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7443} ابن رشد کے نزدیک حیازت ملکیت پر دلالت کرتی ہے مگر منتقل نہیں کرتی؛ اس کا وزن مدت، مدعیٔ ملکیت سے تعلق اور شے کی نوعیت پر منحصر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7443} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7446} بینات میں اختلاف کی صورت میں حنفیہ اور امام احمد کی ایک روایت مدعی کی بینہ کو مقدم کرتے ہیں، جبکہ شافعیہ اور مالکیہ صاحبِ ید کی بینہ کو؛ مالکیہ کے ہاں حیازت کے درجات، مدعی کی حاضری اور علم، طویل خاموشی اور خوف، سفہ اور صغر جیسے موانع کے تفصیلی احکام ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7445} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7446} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7447} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7448} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7449}  مالکیہ کے نزدیک حیازت کی مدت دس سال ہے، جو معتمد ہے اس حدیث کی بنا پر کہ «جو شخص کوئی شے دس سال حیازت میں رکھے تو وہ اسی کی ہے»، اور ایک قول سات سال کا ہے، اور ایک قول قاضی کے اجتہاد کا؛ رشتہ داروں اور شرکاء کے درمیان مدت چالیس سال سے زیادہ ہے، اور باپ بیٹے کے درمیان اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7450} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7454} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7455} منقولات میں معاملہ مختلف ہے؛ کپڑوں اور جانوروں کی حیازت اجتہاد پر چھوڑی گئی ہے، اور رشتہ داروں، سسرالی رشتہ داروں اور موالی کے درمیان جائیداد پر حیازت کے مراتب ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7455} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7456} بیع یا ہبہ کا اثر مالک کی حاضری، اعتراض یا خاموشی کے مطابق ہوتا ہے، اور دیر سے دعویٰ کرنے سے حق باطل نہیں ہوتا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7455} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7457} جب حق حکم قضائی یا رسمی سند سے ثابت ہو تو حیازت نفع نہیں دیتی، اور حیازت صرف اصل ملکیت کی لاعلمی میں نفع دیتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7457}"
  es: "Hiyaza léxicamente es reunir y tomar algo en la mano; técnicamente es poner las manos sobre una cosa y controlarla, y equivale a tomar posesión. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7441} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7442} Al-Hattab da tres grados: el más débil es vivienda o agricultura, luego construcción, plantación y explotación, y el más fuerte una disposición por venta, donación, caridad, manumisión o cualquier acto que un propietario haga con su propiedad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7442} Para la mayoría de los juristas posesión y toma de posesión son una cosa; poner la mano puede significar propiedad o administración, y cuenta en la ponderación de las pruebas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7442} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7443} La posesión es lícita cuando se obtiene mediante la recuperación de tierras muertas, la caza, la recolección de hierba, minas, tesoros y bienes encontrados, o por contrato, e ilícita cuando se obtiene por usurpación, robo o bandidaje. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7443} Ibn Rushd sostiene que la posesión es prueba de propiedad y no la transfiere; su peso depende de su duración, la relación del reclamante con el poseedor y la naturaleza de la cosa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7443} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7446} En cuanto a las pruebas contradictorias, los Hanafis y una visión Hanbali prefieren la prueba del reclamante, mientras que los Shafiis y los Malikis prefieren la del poseedor; los Malikis tienen reglas detalladas sobre los grados de posesión, la presencia y el conocimiento del reclamante, la duración del silencio y las prohibiciones tales como el miedo, la incapacidad o la juventud. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7445} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7446} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7447} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7448} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7449} Según la visión malikí, el período es de diez años, la opinión correcta según el hadiz 'quien posee una cosa durante diez años la posee', con una opinión de siete años y una opinión que lo deja al juez; Entre parientes y socios supera los cuarenta años, y entre padre e hijo la opinión difiere. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7450} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7454} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7455} Para los bienes muebles la regla difiere: la ropa y los animales se juzgan a discreción, y la posesión de bienes entre parientes, suegros y clientes tiene sus propios grados. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7455} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7456} El efecto de una venta o donación depende de si el propietario estuvo presente, objetó o guardó silencio, y un derecho no se pierde por una reclamación tardía. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7455} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7457} Cuando el derecho se fija mediante una sentencia o una escritura sólida, la posesión no sirve para nada, y la posesión sólo vale donde el origen Se desconoce el tipo de propiedad. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7457}"
  fr: "Le terme « hiyaza » signifie littéralement rassembler et prendre quelque chose en main; techniquement, il s’agit de s’emparer d’une chose et d’en prendre le contrôle, ce qui équivaut à en prendre possession. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7441} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7442} Al-Hattab distingue trois degrés: le plus faible concerne l’habitation ou l’agriculture, le suivant la construction, la plantation et l’exploitation, et le plus fort, la disposition par vente, donation, aumône, affranchissement ou tout autre acte accompli par un propriétaire sur son bien. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7442} Pour la plupart des juristes, la possession et la prise de possession sont indissociables; le fait de s’emparer d’une chose peut signifier la propriété ou la gestion, et cela est pris en compte dans l’appréciation des preuves. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7442} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7443} La possession est licite lorsqu'elle résulte de la remise en culture de terres incultes, de la chasse, de la cueillette d'herbe, de l'exploitation minière, de la découverte de trésors ou de biens trouvés, ou encore d'un contrat; elle est illicite lorsqu'elle résulte d'une usurpation, d'un vol ou d'un brigandage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7443} Ibn Rushd considère que la possession est une preuve de propriété, mais ne la transfère pas; sa valeur dépend de sa durée, du lien de parenté entre le demandeur et le possesseur, et de la nature du bien. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7443} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7446} En cas de preuves contradictoires, les Hanafites et une opinion Hanbalite préfèrent la preuve du demandeur, tandis que les Shafiites et les Malikites préfèrent celle du possesseur; les Malikites ont des règles détaillées sur les degrés de possession, la présence et la connaissance du demandeur, la durée du silence et les obstacles tels que la peur, l'incapacité ou la jeunesse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7445} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7446} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7447} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7448} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7449} Selon l'avis malikite, la période est de dix ans, l'avis sain étant celui du hadith « celui qui possède une chose pendant dix ans en est propriétaire », avec un avis de sept ans et un avis laissant cela au juge; Entre parents et associés, la durée de transmission dépasse quarante ans, et entre père et fils, la position diffère. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7450} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7454} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7455} Pour les biens meubles, la règle est différente: les vêtements et le bétail sont appréciés à la discrétion du propriétaire, et la possession de biens entre parents, beaux-parents et clients est soumise à des degrés spécifiques. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7455} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7456} L’effet d’une vente ou d’une donation dépend de la présence, de l’objection ou du silence du propriétaire, et un droit n’est pas perdu par une revendication tardive. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7455} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7457} Lorsque le droit est fixé par un jugement ou un acte solide, la possession ne sert à rien et la possession ne sert qu'à l'origine. le mode de propriété est inconnu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7457}"
  tr: "Dil olarak sahip olmak, bir şeyin çoğul ve damma anlamına gelir; teknik olarak ise bir şeye el koyup sahiplenmek, yani sahip olmak anlamına gelir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7441} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7442} ve oduncuya göre üç şeyle değerlendirilir: en zayıfı konut ve tarımdır, ardından yıkım, inşaat, dikim ve sömürme, ardından satış, hediye, hayırseverlik, özgürleşme yoluyla devretme ve sahibinin mülküyle ne yaptığıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7442} Sahip olmak ve sahiplenme, çoğu hukukçuya göre bir şeydir. Sahiplenme, mülkiyet ve elden çıkarma üzerine denir ve delillerdeki tercihler bunlarla ilgilidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7442} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7443} Mülkiyet yasaldır; ölü arazinin diriltilmesi, avlanma, ot, metal, cevher ve kırma gibi yasa dışı ve sözleşme yoluyla yapılır, ancak gasp, hırsızlık veya savaş gibi yasadışıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7443} Mülkiyet, mülkiyet kanıtıdır ve İbn Rüşd'e göre devredilemez. Süresi, sahibin bağlantısı ve sahibin sahiplik ile mülkiyet ve davranışı arasındaki bağlantısı onu etkiler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7443} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7444}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7446} Hukukçular, dış ve iç deliller arasındaki delil konusunda farklı görüşteydi: Hanafi ve Ahmad davacının ifadesini anlatırken giriş, Şafi'ler ve Malikiler sahipliğin delillerini önceliklendirir ve Malikiler sahipliğin düzeylerini ve koşullarını detaylandırır: elden çıkarma, davacının varlığı ve bilgisi, uzun süre sessiz kalmama ve korku, aptallık veya azınlık gibi engellerin olmaması. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7445} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7446} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7447} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7448} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7449} Giriş, Maliki okuluna göre mülkiyet sorunlarıyla ilgilidir ve bu sayfalarda tamamlanmamıştır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7449} Maliki'ye göre süre on yıldır ve bu kabul görmüş hadistir: \"Bir şeye on yıl sahip olursa, o ona aittir.\" Yedi yıl görüşüne göre, başka bir görüşe göre imam ijtihad (ijtihad); akrabalar ve partnerler arasında süre kırk yılı aşar; baba ve oğul bu konuda farklılık gösterir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7450} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7454} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7455} İletilen raporda durum farklıdır: giysi ve hayvanlar ijtihaddan önce gelirken, akraba, mawali ve kayınvalidelerin mülkiyeti ise sıralanır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7455} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7456} Satış ve hediye durumu mülkiyeti etkiler ve etkisi sahibin varlığına, itirazına veya sessizliğine bağlı olarak değişir. Müslümanın hakları gecikmeyle geçersiz kılınmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7455} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7457} Malikiler, hak bir yargı kararı veya resmi belgeyle tesis edilirse, mülkiyetin geçerli olmadığını ve ancak orijinal mülkiyet bilinmiyorsa geçerli olduğunu savunur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7457}"
  id: "Kepemilikan secara linguistik berarti jamak dan damma dari sesuatu, dan secara teknis berarti meletakkan tangan pada sesuatu dan mengambil alih, berarti memiliki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7441} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7442} dan menurut penebang kayu dianggap oleh tiga hal: yang terlemah adalah perumahan dan pertanian, diikuti dengan pembongkaran, pembangunan, penanaman, dan eksploitasi, lalu transfer melalui penjualan, hadiah, amal, pembebasan, pembebasan, dan apa yang dilakukan pemilik terhadap propertinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7442} Kepemilikan dan kepemilikan adalah satu hal menurut mayoritas ahli hukum. Kepemilikan dikatakan lebih penting daripada kepemilikan dan pembuangan, dan preferensi dalam bukti berkaitan dengan hal tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7442} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7443} kepemilikan adalah sah, seperti menghidupkan kembali tanah mati, berburu, rumput, logam, bijih, dan patah, serta melalui kontrak, tetapi tidak sah seperti perebutan kuasa, pencurian, atau peperangan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7443} kepemilikan adalah bukti kepemilikan, tidak dapat dipindahtangankan menurut Ibn Rushd. Durasinya, hubungan pemilik, dan hubungan pemilik dengan pengklaim terhadap kepemilikan dan perilakunya memengaruhinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7443} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7446} Para ahli hukum berbeda pendapat mengenai bukti antara bukti eksternal dan internal: Hanafi dan Ahmad dalam narasi kesaksian penggugat adalah pengantar, Shafi'i dan Malik memprioritaskan bukti pemilik, dan Maliki merinci tingkat dan kondisi kepemilikan: pembuangan, kehadiran dan pengetahuan penggugat, tidak diam dalam waktu lama, serta tidak adanya hambatan seperti ketakutan, kebodohan, atau minoritas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7445} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7446} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7447} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7448} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7449} Entri ini berkaitan dengan masalah kepemilikan menurut mazhab Maliki dan tidak diselesaikan di halaman-halaman ini. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7449} Lama menurut Malikis adalah sepuluh tahun, yang merupakan hadis yang diterima \"Siapa yang memiliki sesuatu selama sepuluh tahun, maka itu miliknya.\" Dalam pendapat tujuh tahun, dan dalam pendapat lain imam ijtihad (ijtihad); di antara kerabat dan pasangan, durasi lebih dari empat puluh tahun, dan ayah serta anak berbeda dalam hal ini. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7450} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7454} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7455} Dalam laporan yang disampaikan, masalahnya berbeda: pakaian dan ternak didahului oleh ijtihad, sementara kepemilikan properti oleh kerabat, mawali, dan mertua memiliki peringkat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7455} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7456} Pengaturan penjualan dan hadiah memengaruhi kepemilikan, dan dampaknya bervariasi tergantung pada keberadaan, keberatan, atau keheningan pemilik. Hak-hak Muslim tidak dibatalkan oleh penundaan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7455} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7457} Keluarga Malik berpendapat bahwa jika hak tersebut ditetapkan oleh putusan yudisial atau dokumen resmi, maka kepemilikan tidak efektif, dan kepemilikan hanya berlaku jika kepemilikan aslinya tidak diketahui. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7457}"
