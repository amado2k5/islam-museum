id: concept/hirfa-crafts
class: concept
kind: legal
label: { ar: "الحرفة", en: "Craft and occupation (hirfa)", ur: "حرفہ ⁦(پیشہ)⁩", es: "Artesanía y ocupación (hirfa)", fr: "Artisanat et occupation (hirfa)", tr: "Zanaat", id: "Kerajinan" }
summary:
  ar: "الحرفة اسم من الاحتراف وهو الاكتساب، وتشمل عند الفقهاء كل طريق للكسب، ومنه الوظائف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6988} ومزاولة الحرف فرض كفاية وقد تنقلب فرض عين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6988} ومن أحكامها: أن صاحب الحرفة يصلي بثياب مطهرة، فإن تعذر فالصلاة فيما غلب وصول النجاسة إليه بالرخصة، وأن الأجير الخاص لا تمنعه الإجارة من الصلاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6988} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6989} وفي الصيام يجوز للمحترف أن يعمل مع الصوم ويفطر إن أدى العمل إلى الفطر بقدر الضرورة ويقضي، والمنع إذا كان عنده ما يكفيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6989} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6990} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6991} وفي الزكاة لا زكاة في آلات الحرفة لأنها من الحاجات الأصلية، ومن له حرفة يكسب منها ما يكفيه لا يعد فقيرا عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6991} وفي الحج يعد صاحب الحرفة مستطيعا عند الحنفية والمالكية إن كانت الحرفة لا تزري به وكان يكسب منها أثناء السفر، والشافعية والحنابلة لا يعدونه مستطيعا إلا بالزاد والراحلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6992} ولا يجوز التكسب في المسجد بالبيع والشراء، ويكره عند الحنفية والشافعية والمالكية، ويحرم عند الحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6992} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6993} ويجوز الزواج على منفعة الحرفة مهرا عند الشافعية والحنابلة، وعند الحنفية ما كان مالا أو منفعة يمكن تسليمها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6994} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6995} وتقبل شهادة أهل الحرف الدنيئة عند الجمهور مع العدالة، وترد شهادة صاحب الحرفة المحرمة كالمنجم، والربا كالصائغ إن لم يتوقه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6995} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6996} ويضمن صاحب الحرفة ما هلك بتعديه أو تفريطه، ولا يجوز التسعير على أهل الحرف إلا عند حاجة الناس إليها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6996} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6997}"
  en: "Craft (hirfa) comes from earning a living, and the jurists use it for any way of earning, including appointed offices. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6988} Practising a craft is a communal duty, which can become an individual duty. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6988} Among its rulings: a craftsman prays in clean clothes, and if he cannot, he may pray in clothes whose soiling is unavoidable; a hired worker's contract does not stop him praying. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6988} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6989} In fasting, a craftsman may work while fasting and break the fast only as far as necessity requires, making up the day; the rule is strict when he has enough. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6989} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6990} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6991} No zakat is due on the tools of a trade, which are basic needs, and a man with a trade that covers his needs is not poor for zakat purposes, according to the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6991} For the hajj, the Hanafis and Malikis count a craftsman as able if his trade does not degrade him and he can earn during the journey; the Shafi'is and Hanbalis count only provision and a mount. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6992} Trading in the mosque is disliked by the Hanafis, Shafi'is and Malikis and forbidden by the Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6992} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6993} Marrying on a dowry of the usefulness of a craft is allowed by the Shafi'is and Hanbalis; the Hanafis allow dowries that are property or deliverable benefit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6994} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6995} The testimony of a craftsman of humble trade is accepted by the majority if he is just, and that of one whose trade is forbidden, such as an astrologer, or one who deals in usury, is rejected. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6995} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6996} A craftsman is liable for what is lost through his negligence or fault, and prices may not be fixed for craftsmen except when people need the craft. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6996} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6997}"
  es: "El oficio (hirfa) proviene de ganarse la vida, y los juristas lo usan para cualquier forma de ganarse la vida, incluidos los cargos designados. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6988} Practicar un oficio es un deber comunitario, que puede convertirse en un deber individual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6988} Entre sus reglas: un artesano reza con ropa limpia, y si no puede, puede rezar con ropa cuya suciedad sea inevitable; el contrato de un trabajador contratado no le impide rezar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6988} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6989} En el ayuno, un artesano puede trabajar mientras ayuna y romper el ayuno solo en la medida en que la necesidad lo requiera, recuperando el día; La regla es estricta cuando tiene suficiente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6989} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6990} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6991} No se debe zakat sobre las herramientas de un oficio, que son necesidades básicas, y un hombre con un oficio que cubre sus necesidades no es pobre a efectos del zakat, según la mayoría. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6991} Para el hajj, los hanafíes y malikíes consideran a un artesano capaz si su oficio no lo degrada y puede ganar durante el viaje; los shafiíes y hanbalíes solo cuentan la provisión y una montura. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6992} El comercio en la mezquita es mal visto por los hanafíes, shafi'ís y malikíes, y prohibido por los hanbalíes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6992} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6993} El matrimonio con una dote de utilidad de un oficio está permitido por los shafi'ís y los hanbalíes; los hanafíes permiten dotes que son propiedad o beneficio entregable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6994} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6995} El testimonio de un artesano de oficio humilde es aceptado por la mayoría si es justo, y el de uno cuyo oficio está prohibido, como un astrólogo o uno que se dedica a la usura, es rechazado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6995} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6996} Un artesano es responsable de lo que se pierde por su negligencia o culpa, y no se pueden fijar precios para los artesanos excepto cuando la gente necesita el oficio. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6996} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6997}"
  fr: "Le terme « artisanat » (hirfa) désigne le fait de gagner sa vie, et les juristes l'utilisent pour tout moyen de subsistance, y compris les fonctions attribuées. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6988} L'exercice d'un métier est un devoir communautaire, qui peut devenir un devoir individuel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6988} Parmi ses règles: un artisan prie en vêtements propres, et s'il ne le peut, il peut prier avec des vêtements dont la souillure est inévitable; le contrat d'un salarié ne l'empêche pas de prier. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6988} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6989} Pendant le jeûne, un artisan peut travailler et ne rompre le jeûne que dans la mesure où cela est nécessaire, en rattrapant la journée. La règle est stricte lorsqu'il a suffisamment de ressources. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6989} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6990} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6991} La zakat n'est pas due sur les outils d'un métier, qui constituent des besoins essentiels, et un homme dont le métier lui permet de subvenir à ses besoins n'est pas considéré comme pauvre aux fins de la zakat, selon l'avis majoritaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6991} Pour le hajj, les écoles hanafite et malikite considèrent un artisan comme apte au paiement de la zakat si son métier ne le dégrade pas et s'il peut gagner sa vie pendant le voyage; les écoles chaféite et hanbalite ne prennent en compte que les provisions et une monture. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6992} Le commerce à la mosquée est désapprouvé par les hanafites, les chaféites et les malikites, et interdit par les hanbalites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6992} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6993} Les chaféites et les hanbalites autorisent le mariage avec une dot constituée d'un artisanat utile; les hanafites autorisent les dots qui consistent en des biens ou des avantages concrets. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6994} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6995} Le témoignage d'un artisan exerçant un métier modeste est accepté par la majorité s'il est juste, et celui d'une personne dont le métier est interdit, comme un astrologue ou un usurier, est rejeté. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6995} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6996} Un artisan est responsable des pertes causées par sa négligence ou sa faute, et les prix des artisans ne peuvent être fixés que lorsque leurs services sont nécessaires. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6996} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6997}"
  ur: "کرافٹ ⁦(حرفہ)⁩ روزی کمانے سے آتا ہے، اور فقہاء اسے کمائی کے کسی بھی طریقے کے لیے استعمال کرتے ہیں، بشمول مقرر کردہ دفاتر۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6988} ہنر پر عمل کرنا ایک اجتماعی فریضہ ہے، جو انفرادی فرض بن سکتا ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 ص6988} اس کے احکام میں سے: ایک کاریگر صاف کپڑوں میں نماز پڑھتا ہے، اور اگر وہ ایسا نہ کرسکے تو وہ ایسے کپڑوں میں نماز پڑھ سکتا ہے جن کی گندگی ناگزیر ہو۔ کرائے کے مزدور کا معاہدہ اسے نماز پڑھنے سے نہیں روکتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6988} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6989} روزے میں، کاریگر روزے کی حالت میں کام کر سکتا ہے اور صرف ضرورت کے مطابق روزہ توڑ سکتا ہے، دن کی قضاء۔ قاعدہ سخت ہے جب اس کے پاس کافی ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6989} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص6990} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص6991} کوئی بھی زکوٰۃ واجب نہیں ہے جس کی تجارت کے ذریعہ تجارت کی کوئی بنیادی ضرورت نہیں ہے۔ اکثریت کے نزدیک زکوٰۃ کے مقاصد کے لیے اس کی ضروریات ناقص نہیں ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 6991} حج کے لیے احناف اور مالکی ایک کاریگر کو اس قابل شمار کرتے ہیں کہ اگر اس کی تجارت اس کو ذلیل نہ کرے اور وہ سفر کے دوران کما سکے۔ شافعی اور حنبلی صرف رزق اور سواری کو شمار کرتے ہیں۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 6992} احناف، شافعی اور مالکیہ کے نزدیک مسجد میں تجارت کو ناپسند ہے اور حنبلیوں کے نزدیک حرام ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6992} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6993} شافعی اور حنبلی کے نزدیک دستکاری کی افادیت کے جہیز پر شادی کی اجازت ہے۔ احناف ایسے جہیز کی اجازت دیتے ہیں جو جائیداد یا قابلِ فائدہ ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص6994} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص6995} عاجز تجارت کے کاریگر کی گواہی اکثریت قبول کرتی ہے بشرطیکہ وہ عادل ہو، اور اس کی گواہی جس کی تجارت ہم میں حرام ہے یا حرام ہے۔ مسترد کر دیا {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6995} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6996} ایک کاریگر اس کی غفلت یا غلطی سے ضائع ہونے کا ذمہ دار ہے، اور کاریگروں کی ضرورت کے وقت اس کی قیمت مقرر نہیں کی جا سکتی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص6996} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص6997"
  tr: "Zanaat, bir profesyonellik biçimidir; yani edinimdir ve hukukçulara göre, kazanma yollarını, işleri de kapsar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6988} ve zanaat yapmak kolektif bir yükümlülüktür (fard kifayah) ve bireysel bir yükümlülülük haline gelebilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6988} Hükümlerinden biri, zanaatkârın saf giysiler giyerek dua etmesidir; eğer bu mümkün değilse, kirlilik ona ulaşacaksa namaz kılar ve özel işçi kiralayarak namaz kılmaktan engellenmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6988} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6989} Oruçta, bir profesyonel oruçla birlikte çalışabilir ve gerekirse orucu bozabilir, kaçırdığı namazları telafi edebilir ve yasak yeterli namazı varsa geçerlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6989} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6990} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6991} Ve zanaat makinelerine zekat verilmez çünkü bunlar temel ihtiyaçlardır ve zanaatı olan ve yeterince kazanan çoğunluk tarafından fakir sayılmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6991} Hac'da, zanaat sahibi Hanafi ve Maliki'ye göre uygun değilse ve yolculukta kazanıyorsa yetenekli sayılır. Şafiiler ve Hanbaliler onu sadece erzak ve binekle yetenekli görürler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6992} Camide alım veya satım yoluyla kazanç yapmak yasaktır, Hanefiler, Şafiiler ve Malikiler tarafından sevilmez ve Hanbalilere göre yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6992} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6993} Şafi'ler ve Hanbali'lere göre bir zanaat hakkı ile çeyiz olarak evlenmek caizdir, ancak Hanefilere göre verilebilecek mal veya fayda yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6994} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6995} Zanaatkâr halkının tanıklığı halk tarafından adaletle kabul edilir, yasak zanaat sahibinin tanıklığı madenci gibi reddedilir ve riba bir kuyumcu gibi kabul edilir, eğer aramazsa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6995} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6996} Gemi sahibi, ihmali veya ihmali nedeniyle kaybedilen zararlardan sorumludur ve zanaatkârın fiyatlandırması ancak insanların ihtiyacı olduğunda izin verilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6996} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6997}"
  id: "Kerajinan adalah bentuk profesionalisme, yaitu akuisisi, dan menurut ahli hukum, ini mencakup setiap jalan menuju penghasilan, termasuk pekerjaan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6988} dan mempraktikkan kerajinan adalah kewajiban kolektif (fard kifayah) dan dapat menjadi kewajiban individu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6988} Di antara keputusannya adalah bahwa pengrajin berdoa mengenakan pakaian yang dibersihkan; jika itu tidak memungkinkan, maka ia berdoa jika kotoran mungkin sampai padanya dengan izin, dan pekerja pribadi tidak dilarang berdoa dengan mempekerjakan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6988} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6989} Dalam puasa, seorang profesional dapat bekerja bersamaan dengan puasa dan membatalkan puasa jika pekerjaan tersebut menyebabkan berbuka puasa sesuai kebutuhan, dan ia dapat menebus doa yang terlewat, dan larangannya adalah jika ia memiliki cukup untuk melakukannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6989} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6990} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6991} Dan zakat tidak dikenakan pada mesin kerajinan karena itu kebutuhan pokok, dan siapa pun yang memiliki kerajinan dan menghasilkan cukup darinya tidak dianggap miskin oleh mayoritas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6991} Dalam Haji, pemilik kerajinan dianggap mampu menurut Haji dan Malik jika kerajinan itu tidak layak dan ia menghasilkan uang darinya saat bepergian. Para Shafi'i dan Hanbali menganggapnya hanya mampu dengan persediaan dan tunggangan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6992} Tidak diperbolehkan menghasilkan uang di masjid dengan membeli atau menjual, dan tidak disukai oleh Hafi'i, syafi'i, dan Maliki, serta dilarang menurut Hanbali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6992} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6993} Perkahwinan diperbolehkan berdasarkan kerajinan sebagai mas kawin menurut Shafi'i dan Hanbali, sedangkan menurut Hanafi, apa harta atau manfaat yang dapat diberikan tidak diperbolehkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6994} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6995} Kesaksian rakyat para pengrajin diterima oleh publik dengan adil, dan kesaksian pemilik kerajinan terlarang ditolak seperti penambang, dan riba seperti tukang emas jika tidak mencarinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6995} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6996} Pemilik kerajinan bertanggung jawab atas apa yang hilang akibat pelanggaran atau kelalaian, dan tidak diperbolehkan memberi harga kepada pengrajin kecuali ketika orang membutuhkannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6996} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6997}"
