label: { ar: "الحرفة", en: "Craft and occupation (hirfa)", ur: "حرفہ (پیشہ)" }
summary:
  ar: "الحرفة اسم من الاحتراف وهو الاكتساب، وتشمل عند الفقهاء كل طريق للكسب، ومنه الوظائف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6988} ومزاولة الحرف فرض كفاية وقد تنقلب فرض عين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6988} ومن أحكامها: أن صاحب الحرفة يصلي بثياب مطهرة، فإن تعذر فالصلاة فيما غلب وصول النجاسة إليه بالرخصة، وأن الأجير الخاص لا تمنعه الإجارة من الصلاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6988} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6989} وفي الصيام يجوز للمحترف أن يعمل مع الصوم ويفطر إن أدى العمل إلى الفطر بقدر الضرورة ويقضي، والمنع إذا كان عنده ما يكفيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6989} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6990} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6991} وفي الزكاة لا زكاة في آلات الحرفة لأنها من الحاجات الأصلية، ومن له حرفة يكسب منها ما يكفيه لا يعد فقيرا عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6991} وفي الحج يعد صاحب الحرفة مستطيعا عند الحنفية والمالكية إن كانت الحرفة لا تزري به وكان يكسب منها أثناء السفر، والشافعية والحنابلة لا يعدونه مستطيعا إلا بالزاد والراحلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6992} ولا يجوز التكسب في المسجد بالبيع والشراء، ويكره عند الحنفية والشافعية والمالكية، ويحرم عند الحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6992} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6993} ويجوز الزواج على منفعة الحرفة مهرا عند الشافعية والحنابلة، وعند الحنفية ما كان مالا أو منفعة يمكن تسليمها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6994} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6995} وتقبل شهادة أهل الحرف الدنيئة عند الجمهور مع العدالة، وترد شهادة صاحب الحرفة المحرمة كالمنجم، والربا كالصائغ إن لم يتوقه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6995} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6996} ويضمن صاحب الحرفة ما هلك بتعديه أو تفريطه، ولا يجوز التسعير على أهل الحرف إلا عند حاجة الناس إليها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6996} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6997}"
  en: "Craft (hirfa) comes from earning a living, and the jurists use it for any way of earning, including appointed offices. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6988} Practising a craft is a communal duty, which can become an individual duty. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6988} Among its rulings: a craftsman prays in clean clothes, and if he cannot, he may pray in clothes whose soiling is unavoidable; a hired worker's contract does not stop him praying. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6988} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6989} In fasting, a craftsman may work while fasting and break the fast only as far as necessity requires, making up the day; the rule is strict when he has enough. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6989} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6990} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6991} No zakat is due on the tools of a trade, which are basic needs, and a man with a trade that covers his needs is not poor for zakat purposes, according to the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6991} For the hajj, the Hanafis and Malikis count a craftsman as able if his trade does not degrade him and he can earn during the journey; the Shafi'is and Hanbalis count only provision and a mount. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6992} Trading in the mosque is disliked by the Hanafis, Shafi'is and Malikis and forbidden by the Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6992} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6993} Marrying on a dowry of the usefulness of a craft is allowed by the Shafi'is and Hanbalis; the Hanafis allow dowries that are property or deliverable benefit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6994} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6995} The testimony of a craftsman of humble trade is accepted by the majority if he is just, and that of one whose trade is forbidden, such as an astrologer, or one who deals in usury, is rejected. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6995} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6996} A craftsman is liable for what is lost through his negligence or fault, and prices may not be fixed for craftsmen except when people need the craft. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6996} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6997}"
