summary:
  ar: "المو أصل نبات يكثر ببلاد مقدونيا، حار يابس في الثالثة، لطيف جلاء مفتح شبيه بالسنبل لكنه أسخن وأقبض، ينفع المفاصل والكبد الباردة ويدر البول {cite:canon-ibn-sina-print-v1 p.554}."
  en: "Mu is the root of a plant common in Macedonia, hot and dry in the third degree, fine, cleansing and opening, like spikenard but hotter and more astringent; it helps the joints and the cold liver and brings on urine {cite:canon-ibn-sina-print-v1 p.554}."
  ur: "مو ایک نبات کی جڑ ہے جو مقدونیہ میں بہت ہوتی ہے، تیسرے درجے میں گرم خشک، لطیف، جلا دینے والی اور تفتیح کرنے والی، سنبل کی طرح مگر زیادہ گرم اور قابض؛ جوڑوں اور سرد جگر میں مفید ہے اور پیشاب جاری کرتی ہے {cite:canon-ibn-sina-print-v1 p.554}۔"
  es: "Mu es la raíz de una planta común en Macedonia, caliente y seca en tercer grado, fina, limpiadora y abre, como el nardo pero más caliente y astringente; ayuda a las articulaciones y al hígado frío y provoca la micción {cite:canon-ibn-sina-print-v1 p.554}."
  fr: "Mu est la racine d'une plante commune en Macédoine, chaude et sèche au troisième degré, fine, purifiante et ouvrante, comme le nard mais plus chaude et plus astringente; elle aide les articulations et le foie froid et favorise la miction {cite:canon-ibn-sina-print-v1 p.554}."
  tr: "Almoe, Makedonya'ya özgönül, üçüncü yılında sıcak ve kuru, nazik ve açık, diken benzeri ama daha sıcak ve kalın, soğuk eklemler ve karaciğer için faydalı ve diüretezi teşvik eden bir bitkidir {cite:canon-ibn-sina-print-v1 s.554}."
  id: "Almoe adalah tanaman asli Makedonia, panas dan kering pada tahun ketiga, lembut dan terbuka, menyerupai duri tetapi lebih hangat dan tebal, bermanfaat untuk sendi dan hati yang dingin, serta mendorong diuresis {cite:canon-ibn-sina-print-v1 hlm.554}."
