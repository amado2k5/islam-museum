label: { ar: "دعوى أصحاب الطلسمات في حركة الفلك الانتقالية", en: "The claim of the talisman-makers about a slow shifting motion of the sphere", ur: "طلسمات والوں کا فلک کی آہستہ انتقالی حرکت کا دعویٰ", es: "La afirmación de los fabricantes de talismanes sobre un movimiento de desplazamiento lento de la esfera", fr: "L'affirmation des fabricants de talismans concernant un lent mouvement de déplacement de la sphère", tr: "Tılsımlara sahip olanların gök küresinin geçiş hareketine ilişkin iddiası", id: "Klaim dari mereka yang memiliki jimat mengenai pergerakan transisi bola langit." }
summary:
  ar: "يذكر البتاني عن بطليموس أن أصحاب الطلسمات زعموا أن للفلك حركة انتقال بطيئة في كل ثمانين سنة درجة، وأن هذه الحركة تنتهي إلى ثمانية أجزاء ثم ترجع. ومعنى قولهم أن فلك البروج يتحرك من المغرب إلى المشرق مع حركة الكواكب الثابتة ثمانية أجزاء، ثم يتحرك من المشرق إلى المغرب ثمانية أجزاء، وذلك بخلاف الحركة الأولى. ويرد البتاني بأن الجرم الواحد لا يتحرك حركتين في جهتين مختلفتين. {cite:zij-sabi-nallino-byblion pp.194-195}"
  en: "Al-Battani reports from Ptolemy that the talisman-makers claimed the sphere has a slow shifting motion of one degree in every eighty years, which runs up to eight parts and then turns back. Their claim meant that the zodiac moves from west to east with the fixed stars by eight parts and then from east to west by eight parts, against the first motion. Al-Battani replies that one body cannot make two motions in two opposite directions. {cite:zij-sabi-nallino-byblion pp.194-195}"
  ur: "البتانی بطلیموس کے حوالے سے بیان کرتے ہیں کہ طلسمات والوں کا دعویٰ تھا کہ فلک کی ایک آہستہ انتقالی حرکت ہر اسی سال میں ایک درجہ ہے، جو آٹھ اجزا تک جاتی ہے اور پھر لوٹ آتی ہے۔ ان کے دعوے کا مطلب تھا کہ فلکِ البروج ثوابت کی حرکت کے ساتھ مغرب سے مشرق کی طرف آٹھ اجزا چلتا ہے، پھر پہلی حرکت کے خلاف مشرق سے مغرب کی طرف آٹھ اجزا لوٹتا ہے۔ البتانی جواب دیتے ہیں کہ ایک جرم دو مخالف سمتوں میں دو حرکتیں نہیں کر سکتا۔ {cite:zij-sabi-nallino-byblion pp.194-195}"
  es: "Al-Battani relata que Ptolomeo afirmaba que los fabricantes de talismanes sostenían que la esfera tenía un movimiento de desplazamiento lento de un grado cada ochenta años, que se extendía hasta ocho partes y luego volvía a su posición original. Su afirmación implicaba que el zodíaco se movía de oeste a este con las estrellas fijas en ocho partes y luego de este a oeste en ocho partes, en contra del primer movimiento. Al-Battani replica que un cuerpo no puede realizar dos movimientos en dos direcciones opuestas. {cite:zij-sabi-nallino-byblion pp.194-195}"
  fr: "Al-Battani rapporte de Ptolémée que les fabricants de talismans affirmaient que la sphère subit un lent mouvement de translation d'un degré tous les quatre-vingts ans, ce mouvement s'étendant sur huit parties avant de revenir en arrière. Selon eux, le zodiaque se déplace d'ouest en est par rapport aux étoiles fixes sur huit parties, puis d'est en ouest sur huit parties, en sens inverse du premier mouvement. Al-Battani rétorque qu'un corps ne peut effectuer deux mouvements dans deux directions opposées. {cite:zij-sabi-nallino-byblion pp.194-195}"
  tr: "El-Battani, Ptolemy'nin muskalarla uğraşanların gök küresinin yavaşça, her seksen yılda bir derece hareket ettiğini ve bu hareketin sekiz parçaya bölünerek sona erdiğini ve ardından geri döndüğünü iddia ettiklerini söylediğini aktarır. Bu iddia, ekliptiğin sabit gezegenlerin hareketini takip ederek batıdan doğuya sekiz parçaya bölünerek hareket ettiğini ve ardından doğudan batıya başka bir sekiz parçaya bölünerek hareket ettiğini, yani ilk hareketin tersine döndüğünü ifade ediyordu. El-Battani bunu reddederek, tek bir gök cisminin iki kez farklı yönlerde hareket edemeyeceğini belirtir. {cite:zij-sabi-nallino-byblion pp.194-195}"
  id: "Al-Battani mengutip Ptolemy yang mengatakan bahwa mereka yang mempraktikkan jimat mengklaim bahwa bola langit bergerak perlahan, satu derajat setiap delapan puluh tahun, dan bahwa gerakan ini berakhir dalam delapan bagian sebelum kembali. Klaim mereka berarti bahwa ekliptika bergerak dari barat ke timur, mengikuti pergerakan planet-planet tetap, dalam delapan bagian, dan kemudian bergerak dari timur ke barat dalam delapan bagian lainnya, sebuah pembalikan dari gerakan awal. Al-Battani membantah hal ini, dengan menyatakan bahwa satu benda langit tidak dapat bergerak dua kali ke arah yang berbeda. {cite:zij-sabi-nallino-byblion pp.194-195}"
