summary:
  ar: "يبدأ ابن سينا تشريح عظام الرأس بالقحف، ويرى أن منفعة جملته أنه جُنّة للدماغ ساترة وواقية من الآفات، وأن خلقه قبائل كثيرة وعظاماً فوق واحد له منافع تتعلق بالعظم نفسه وبما يحويه {cite:canon-ibn-sina-print-v1 p.43}."
  en: "Ibn Sina begins the anatomy of the head with the skull (qahf). He holds that its whole use is as a covering shield for the brain, protecting it from harm, and that its making in many parts and several bones has uses that concern the bone itself and uses that concern what it holds {cite:canon-ibn-sina-print-v1 p.43}."
