label:
  ar: "السُّورة"
  en: "Surah (a chapter of the Qur'an) and its recitation in prayer"
summary:
  ar: "السورة في اللغة المنزلة والرفعة، وفي الاصطلاح طائفة متميزة من آيات القرآن ذات مطلع وخاتمة، ولا تقل عن ثلاث آيات، ولها اسم خاص بها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9860} ويستحب قراءة السور مرتبة كما في المصحف، وتقرأ الفاتحة في الصلاة ركنا عند الجمهور وفرضا عند الحنفية، ويجوز الجمع بين سورتين في ركعة عند جمهور الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9861} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9862} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9863} ولا قراءة سورة في صلاة الجنازة عند الحنفية والمالكية، وتقرأ الفاتحة فيها عند الشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9863} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9864}"
  en: "In language surah means rank or height; the technical sense is a distinct portion of the Qur'an with a beginning and an end, not fewer than three verses, and with its own name. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9860} Most jurists recommend reciting surahs in the order of the codex; they dislike reversing their order. The Fatiha is a pillar of each unit of prayer for the majority and an obligation for the Hanafis, who require only what is easy of the Qur'an. Most jurists allow joining two surahs in one unit, and repeating a surah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9861} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9862} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9863} In the funeral prayer the Hanafis and Malikis recite nothing, while the Shafi'is and Hanbalis require the Fatiha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9863} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9864}"
