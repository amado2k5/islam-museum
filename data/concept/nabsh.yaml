id: concept/nabsh
class: concept
kind: legal
label: { ar: "النَّبْش (نبش القبور)", en: "Exhuming graves (nabsh)", ur: "نبش (قبر کھودنا)" }
summary:
  ar: "النبش في اللغة استخراج المدفون وإبراز المستور. ونبش القبر قبل البلى لغير ضرورة حرام باتفاق الفقهاء لما فيه من هتك حرمة الميت. ويجوز النبش لضرورة أو غرض شرعي: فإذا وقع في القبر مال له قيمة نبش لأخذه عند المالكية والشافعية والحنابلة، وفي وجوبه ومشروطيته بعدم تغير الميت خلاف، وإذا بلع الميت مال غيره ففيه أقوال تتراوح بين تغريم التركة وشق البطن، وينبش القبر لكفن مغصوب في الجملة مع تفصيل. ويجوز نبش قبر دفن في أرض مغصوبة، ولا ينبش لنقل الميت إلا عند الحنابلة في بعض الحالات، ولا ينبش لدفن غيره فيه إلا بعد البلى عند المالكية والحنابلة، ويجوز نبش قبور المشركين لمال فيها عند الحنفية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15446} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15447} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15448} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15449} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15450} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15451} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15452} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15453} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15454} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15455} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15456}"
  en: "To dig up is to bring out what is buried and expose what is hidden. Exhuming a grave before decay without need is forbidden by agreement, since it violates the dead person's sanctity. Exhumation is allowed for a necessity or a lawful purpose. If property of value falls into a grave, the Malikis, Shafi'is and Hanbalis allow digging it up, though they differ on whether it is compulsory and on whether the body must be undecayed. If the dead swallowed another's property, the views range from paying from the estate to cutting open the body. The grave may be opened for a usurped shroud, with conditions. A grave dug in usurped land may be opened on the owner's claim. Exhumation for moving the dead is forbidden by most jurists, while the Hanbalis allow it in some cases. Digging a grave for another burial is forbidden to the Malikis and Hanbalis until the first has decayed. The Hanafis and Hanbalis allow digging up the graves of unbelievers for property in them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15446} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15447} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15448} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15449} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15450} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15451} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15452} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15453} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15454} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15455} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15456}"
  ur: "نبش یعنی دفن شدہ چیز نکالنا۔ بلا ضرورت قبل از بوسیدگی قبر کھودنا باتفاق حرام ہے۔ ضرورت یا شرعی غرض کے لیے جائز ہے، جیسے قبر میں قیمتی مال گرنا، یا کسی کا غصب شدہ کفن ہونا۔ کفار کی قبروں سے مال نکالنا حنفیہ اور حنابلہ کے نزدیک جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15446} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15447} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15448} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15449} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15450} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15451} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15452} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15453} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15454} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15455} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15456}"
