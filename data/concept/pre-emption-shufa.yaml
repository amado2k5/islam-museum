id: concept/pre-emption-shufa
class: concept
kind: legal
label:
  ar: "الشُّفْعة"
  en: "Shufa (pre-emption: the right of a co-owner or neighbour to take property sold to a stranger)"
summary:
  ar: "الشفعة تملك البقعة جبرا على المشتري بما قام عليه، أو حق تملك قهري للشريك القديم فيما حدث ملكه بعوض. وهي ثابتة بالسنة والإجماع، لحديث جابر في القضاء بالشفعة فيما لم يقسم، ولحكمة رفع الضرر عن الشركاء. واتفق الفقهاء على ثبوتها للشريك الذي له حصة شائعة في العقار ما لم يقاسم، واختلفوا في ثبوتها فيما لا ينقسم، وفي الجوار، وفي حقوق المبيع، فالحنفية يثبتونها للجار الملاصق والشريك في الحقوق، والجمهور ينفونها عن الجار. وتطلب الشفعة على الفور عند العلم بالبيع مع أعذار معينة، ثم بالإشهاد والمرافعة، ولا تتجزأ، ولا تثبت للوقف، وتثبت للذمي على المسلم عند الجمهور، وتتعدد الشفعاء بحسب السبب، وتسقط بالترك والتنازل والصلح، وتورث عند الجمهور، ويترتب على الأخذ أحكام البناء والغراس والاستحقاق والهلاك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10108} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10109} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10110} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10112} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10113}"
  en: "Shufa is the compelled taking of property by the buyer's price from the new purchaser, or a right of compulsory acquisition that belongs to the old partner over what has come into another's ownership for a consideration. It is established by the sunna and by consensus, on the basis of a report of Jabir that pre-emption applies to what has not been divided, and of the purpose of lifting harm from partners. The jurists agree it belongs to a co-owner with an undivided share in the property, so long as it is not divided; they differ on whether it applies to things that cannot be divided, to neighbours, and to rights attached to the sold thing. The Hanafis give it to an adjoining neighbour and a partner in rights; the majority deny it to neighbours. The claim must be made at once on learning of the sale, with certain excuses, then by witnesses and before the judge; the right is not divided; it does not belong to an endowment; the majority give it to a dhimmi against a Muslim; several claimants divide by cause; it lapses by neglect, waiver and settlement; the majority hold it heritable; and taking it brings rules on building, planting, warranty and loss. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10108} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10109} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10110} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10112} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10113}"
