id: concept/pre-emption-shufa
class: concept
kind: legal
tags: [akhlaq-browser, akhlaq-shufa]
label:
  ar: "الشُّفْعة"
  en: "Shufa (pre-emption: the right of a co-owner or neighbour to take property sold to a stranger)"
  es: "Shufa (derecho de tanteo: el derecho de un copropietario o vecino a adquirir una propiedad vendida a un tercero)"
  fr: "Shufa (droit de préemption: le droit d'un copropriétaire ou d'un voisin de prendre un bien vendu à un étranger)"
summary:
  ar: "الشفعة تملك البقعة جبرا على المشتري بما قام عليه، أو حق تملك قهري للشريك القديم فيما حدث ملكه بعوض. وهي ثابتة بالسنة والإجماع، لحديث جابر في القضاء بالشفعة فيما لم يقسم، ولحكمة رفع الضرر عن الشركاء. واتفق الفقهاء على ثبوتها للشريك الذي له حصة شائعة في العقار ما لم يقاسم، واختلفوا في ثبوتها فيما لا ينقسم، وفي الجوار، وفي حقوق المبيع، فالحنفية يثبتونها للجار الملاصق والشريك في الحقوق، والجمهور ينفونها عن الجار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10108} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10109} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10110} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10112} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10113}"
  en: "Shufa is the compelled taking of property by the buyer's price from the new purchaser, or a right of compulsory acquisition that belongs to the old partner over what has come into another's ownership for a consideration. It is established by the sunna and by consensus, on the basis of a report of Jabir that pre-emption applies to what has not been divided, and of the purpose of lifting harm from partners. The jurists agree it belongs to a co-owner with an undivided share in the property, so long as it is not divided; they differ on whether it applies to things that cannot be divided, to neighbours, and to rights attached to the sold thing. The Hanafis give it to an adjoining neighbour and a partner in rights; the majority deny it to neighbours. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10108} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10109} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10110} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10112} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10113}"
  es: "Shufa es la expropiación forzosa de bienes por el precio del comprador, o un derecho de adquisición obligatoria que corresponde al antiguo socio sobre lo que ha pasado a ser propiedad de otro a cambio de una contraprestación. La Sunna y el consenso establecen, basándose en un informe de Jabir, que el derecho de tanteo se aplica a lo que no se ha dividido, con el fin de evitar perjuicios a los socios. Los juristas coinciden en que pertenece a un copropietario con una participación indivisa en la propiedad, siempre que no se divida; difieren en si se aplica a bienes indivisos, a los vecinos y a los derechos inherentes al bien vendido. Los Hanafi lo otorgan a un vecino colindante y socio; la mayoría lo niega a los vecinos. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10108} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10109} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10110} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10112} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10113}"
  fr: "La shufa est le droit de préemption, c'est-à-dire l'acquisition forcée d'un bien par le nouvel acquéreur au prix de sa vente, appartenant à l'ancien associé sur ce qui est devenu la propriété d'un tiers moyennant une contrepartie. Ce droit est établi par la sunna et par consensus, sur la base d'un hadith de Jabir, selon lequel la préemption s'applique à ce qui n'a pas été divisé et vise à protéger les associés contre tout préjudice. Les juristes s'accordent à dire qu'il appartient au copropriétaire détenant une part indivise du bien, tant que celui-ci n'est pas divisé; ils divergent quant à son application aux biens indivisibles, aux voisins et aux droits attachés au bien vendu. Les hanafites l'accordent au voisin contigu et au copropriétaire; la majorité le refuse aux voisins. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10108} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10109} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10110} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10112} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10113}"
