id: concept/zij-sabi-east-west-point-from-a-known-altitude-and-azimuth
class: concept
kind: scientific
label: { ar: "نقطة المشرق والمغرب من ارتفاع معلوم وسمته في الزيج الصابي", en: "The east and west point from a known altitude and its azimuth", ur: "معلوم ارتفاع اور اس کے سمت سے نقطۂ مشرق و مغرب", es: "El este y el oeste apuntan desde una altitud conocida y su acimut.", fr: "Les points est et ouest à partir d'une altitude connue et de son azimut", tr: "Belirli bir yükseklikten güneşin doğuş ve batış noktaları ve Saba astronomik tablolarındaki yönelimi.", id: "Titik matahari terbit dan terbenam dari ketinggian tertentu dan orientasinya dalam tabel astronomi Sabaean." }
summary:
  ar: "إذا كان موضع الشمس معلوماً فلا حاجة إلى رصد قبل الزوال وبعده: يرصد البتاني ارتفاعاً مفروضاً في بعض أوقات النهار، ويعلّم وسط عرض ظل العود على المحيط، ثم يقسم الربع الذي فيه النقطة تسعين جزءاً ويعدّ من النقطة إلى خلاف جهة سمت الارتفاع بقدر السمت، فيكون المنتهى نقطة المشرق أو المغرب. وإن كان الأفق ظاهراً عند الطلوع أو الغروب عُرفت النقطة من سمت مطلع جزء الشمس. {cite:zij-sabi-nallino-byblion p.40}."
  en: "When the Sun's place is known, no observation before and after noon is needed: al-Battani observes a chosen altitude at some time of day and marks the middle of the width of the rod's shadow on the circumference. He divides the quadrant containing that point into ninety parts and counts from the point, away from the direction of the altitude's azimuth, as many parts as the azimuth, and the count ends at the east or the west point. If the horizon is clear at sunrise or sunset the point is known from the azimuth of the rising of the Sun's degree. {cite:zij-sabi-nallino-byblion p.40}."
  ur: "جب سورج کی جگہ معلوم ہو تو زوال سے پہلے اور بعد کی رصد کی ضرورت نہیں: البتانی دن کے کسی وقت ایک مقرر ارتفاع کی رصد کرتے ہیں اور سلاخ کے سائے کی چوڑائی کے وسط کو محیط پر نشان زد کرتے ہیں۔ اس نقطے والے ربع کو نوے حصوں میں بانٹتے ہیں اور نقطے سے ارتفاع کے سمت کی مخالف جہت میں سمت کے برابر حصے گنتے ہیں؛ انتہا مشرق یا مغرب کا نقطہ ہوتی ہے۔ اگر طلوع یا غروب کے وقت افق ظاہر ہو تو سورج کے درجے کے مطلع کے سمت سے نقطہ معلوم ہو جاتا ہے۔ {cite:zij-sabi-nallino-byblion p.40}۔"
  es: "Cuando se conoce la posición del Sol, no es necesaria ninguna observación antes ni después del mediodía: al-Battani observa una altitud determinada a una hora concreta del día y marca el punto medio de la sombra proyectada por la vara en la circunferencia. Divide el cuadrante que contiene ese punto en noventa partes y, desde ese punto, en dirección opuesta al acimut de la altitud, cuenta tantas partes como indique el acimut, y la cuenta finaliza en el punto este u oeste. Si el horizonte está despejado al amanecer o al atardecer, el punto se conoce a partir del acimut del grado de salida del Sol. {cite:zij-sabi-nallino-byblion p.40}."
  fr: "Lorsque la position du Soleil est connue, aucune observation avant ou après midi n'est nécessaire: al-Battani observe une altitude choisie à un moment donné de la journée et marque le milieu de la largeur de l'ombre de la mire sur la circonférence. Il divise le quadrant contenant ce point en quatre-vingt-dix parties et compte, à partir de ce point et en s'éloignant de la direction de l'azimut de l'altitude, autant de parties que l'azimut, le comptage s'arrêtant au point est ou ouest. Si l'horizon est dégagé au lever ou au coucher du soleil, le point est déterminé par l'azimut du degré de lever du Soleil. {cite:zij-sabi-nallino-byblion p.40}."
  tr: "Güneşin konumu biliniyorsa, öğleden önce ve sonra gözlem yapmaya gerek yoktur. El-Battani, günün belirli saatlerinde varsayımsal bir yüksekliği gözlemler, bir çubukla çevre üzerine düşen gölgenin merkezini işaretler, ardından noktayı içeren çeyreği doksan parçaya böler. Daha sonra, yüksekliğin azimutunun karşısındaki noktadan aynı mesafeyi ölçer ve uç nokta, güneşin doğuş veya batış noktasıdır. Güneşin doğuşu veya batışı sırasında ufuk görünüyorsa, nokta güneşin doğuş noktasının azimutuna göre belirlenir. {cite:zij-sabi-nallino-byblion s.40}."
  id: "Jika posisi matahari diketahui, tidak perlu pengamatan sebelum dan sesudah tengah hari. Al-Battani mengamati ketinggian hipotetis pada waktu-waktu tertentu dalam sehari, menandai pusat bayangan yang dihasilkan oleh tongkat pada keliling lingkaran, kemudian membagi seperempat lingkaran yang berisi titik tersebut menjadi sembilan puluh bagian. Kemudian ia mengukur dari titik yang berlawanan dengan azimut ketinggian dengan jarak yang sama, dan titik ujungnya adalah titik matahari terbit atau terbenam. Jika cakrawala terlihat saat matahari terbit atau terbenam, titik tersebut ditentukan oleh azimut titik terbit matahari. {cite:zij-sabi-nallino-byblion p.40}."
