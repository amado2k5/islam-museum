id: concept/sunnat-allah
class: concept
kind: term
label: { ar: "سنة الله", en: "Sunnat Allah (God's pattern in creation and history)", es: "Sunnat Allah (El modelo de Dios en la creación y la historia)", fr: "Sunna Allah (la voie divine dans la création et l'histoire)", ur: "سنت اللہ ⁦(تخلیق اور تاریخ میں خدا کا نمونہ)⁩" }
issue:
  ar: "هل للتاريخ والاجتماع سنن ثابتة يجري عليها الله، وما حدودها بالنسبة إلى الإرادة والاختيار؟"
summary:
  ar: "سنن الله في الخلق وفي حال الأمم، كما يقرأها رشيد رضا في تفسير الأنعام 111-115: أن المتمرد العاتي يعادي الدعاة إلى الحق من الأنبياء وورثتهم، وأن الغلبة في الصراع تكون لأشد الفريقين استعداداً وتخلقاً بالأخلاق العالية، وأن الأمة المتكافلة تُعد في القرآن كالشخص الواحد. ويستعمل رضا في ذلك مصطلحات علماء الاجتماع، ويقرر أن الإيمان بالمشيئة لا يعني أن الناس مجبرون على أفعالهم. هذه قراءة رضا لسنن الله، وتنسب إليه هنا."
  en: "God's patterns in creation and in the condition of nations, as Rashid Rida reads them in his commentary on al-An'am 111-115: the rebellious and arrogant oppose those who call to the truth among the prophets and their heirs; in conflict, victory goes to the side that is better prepared and more distinguished by high morals; and a community whose members support one another is counted in the Qur'an as one person. Rida uses the terms of sociologists in this, and holds that belief in the divine will does not mean that people are compelled in their actions. This is Rida's reading of God's patterns, and it is attributed to him here."
  es: "Los designios divinos en la creación y en la condición de las naciones, según la interpretación de Rashid Rida en su comentario sobre al-An'am 111-115, son los siguientes: los rebeldes y arrogantes se oponen a quienes proclaman la verdad entre los profetas y sus herederos; en el conflicto, la victoria corresponde al bando mejor preparado y más distinguido por su elevada moral; y una comunidad cuyos miembros se apoyan mutuamente es considerada en el Corán como una sola persona. Rida emplea la terminología de los sociólogos y sostiene que la creencia en la voluntad divina no implica que las personas estén obligadas a actuar de cierta manera. Esta es la interpretación de Rida sobre los designios divinos, y se le atribuye aquí."
  fr: "Les desseins divins dans la création et la condition des nations, tels que les interprète Rashid Rida dans son commentaire des chapitres 111 à 115 de la sourate Al-An'am: les rebelles et les arrogants s'opposent à ceux qui, parmi les prophètes et leurs héritiers, appellent à la vérité; en cas de conflit, la victoire revient au camp le mieux préparé et le plus vertueux; et une communauté dont les membres s'entraident est considérée dans le Coran comme une seule personne. Rida emploie ici le vocabulaire des sociologues et soutient que croire en la volonté divine n'implique pas que les individus soient contraints d'agir. Telle est l'interprétation que Rida donne des desseins divins, et elle lui est attribuée ici."
  ur: "مخلوقات اور قوموں کی حالت میں خدا کے نمونے، جیسا کہ راشد ردا اپنی تفسیر الانعام 111-115 میں پڑھتے ہیں: سرکش اور متکبر انبیاء اور ان کے وارثوں میں سے حق کی طرف دعوت دینے والوں کی مخالفت کرتے ہیں۔ تصادم میں فتح اس طرف جاتی ہے جو بہتر طریقے سے تیار ہو اور اعلیٰ اخلاق سے ممتاز ہو۔ اور ایک جماعت جس کے افراد ایک دوسرے کی حمایت کرتے ہیں قرآن میں ایک فرد کے طور پر شمار کیا گیا ہے۔ ردا اس میں ماہرین سماجیات کی اصطلاحات کا استعمال کرتی ہے، اور یہ کہتی ہے کہ رضائے الٰہی پر یقین کا مطلب یہ نہیں ہے کہ لوگ اپنے اعمال پر مجبور ہیں۔ یہ ردا کا خدا کے نمونوں کو پڑھنا ہے، اور اسے یہاں منسوب کیا گیا ہے۔"
