id: concept/sunnat-allah
class: concept
kind: term
label: { ar: "سنة الله", en: "Sunnat Allah (God's pattern in creation and history)" }
issue:
  ar: "هل للتاريخ والاجتماع سنن ثابتة يجري عليها الله، وما حدودها بالنسبة إلى الإرادة والاختيار؟"
summary:
  ar: "سنن الله في الخلق وفي حال الأمم، كما يقرأها رشيد رضا في تفسير الأنعام 111-115: أن المتمرد العاتي يعادي الدعاة إلى الحق من الأنبياء وورثتهم، وأن الغلبة في الصراع تكون لأشد الفريقين استعداداً وتخلقاً بالأخلاق العالية، وأن الأمة المتكافلة تُعد في القرآن كالشخص الواحد. ويستعمل رضا في ذلك مصطلحات علماء الاجتماع، ويقرر أن الإيمان بالمشيئة لا يعني أن الناس مجبرون على أفعالهم. هذه قراءة رضا لسنن الله، وتنسب إليه هنا."
  en: "God's patterns in creation and in the condition of nations, as Rashid Rida reads them in his commentary on al-An'am 111-115: the rebellious and arrogant oppose those who call to the truth among the prophets and their heirs; in conflict, victory goes to the side that is better prepared and more distinguished by high morals; and a community whose members support one another is counted in the Qur'an as one person. Rida uses the terms of sociologists in this, and holds that belief in the divine will does not mean that people are compelled in their actions. This is Rida's reading of God's patterns, and it is attributed to him here."
