id: concept/kasad-al-nuqud
class: concept
kind: legal
label:
  ar: "كساد النقود وتغيّر قيمتها"
  en: "Kasad al-nuqud (when money stops circulating or changes in value)"
  ur: "نقدی کا کساد اور قیمت کی تبدیلی"
term: { ar: "كَساد النُّقود، انقطاعها، غلاؤها ورُخصها", en: "kasad al-nuqud" }
summary:
  ar: "إذا وقع البيع أو القرض بالفلوس أو بالدراهم الغالبة الغش ثم كسدت أو انقطعت أو غلت قيمتها أو رخصت قبل الأداء، اختلف أئمة الحنفية فيما يجب. يعرض ابن عابدين في رد المحتار قول أبي حنيفة ببطلان البيع بالكساد، وقول أبي يوسف بوجوب القيمة يوم البيع أو القرض وعليه الفتوى، وقول محمد بالقيمة آخر يوم تعامل الناس بها، ويرى أن الخلاف خاص بالفلوس والدراهم الغالبة الغش دون الذهب والفضة الخالصين، ويحيل على رسالته تنبيه الرقود في أحكام النقود. {cite:radd-al-muhtar-bulaq-v4 p.31}"
  en: "When a sale or loan is made in copper coins (fulus) or in dirhams mostly of base metal, and they stop circulating, disappear, or rise or fall in value before payment, the Hanafi masters differ over what is owed. Ibn Abidin in Radd al-Muhtar sets out Abu Hanifa's view that the sale is void when the coin stops circulating, Abu Yusuf's view that their value on the day of sale or loan is owed, on which fatwa is given, and Muhammad's view of their value on the last day people dealt in them; he holds that the dispute concerns only fulus and mostly-base dirhams, not pure gold and silver, and refers to his treatise Tanbih al-Ruqud fi Ahkam al-Nuqud."
  ur: "اگر بیع یا قرض فلوس (تانبے کے سکوں) یا ایسے دراہم میں ہو جن میں کھوٹ غالب ہو، اور ادائیگی سے پہلے وہ چلنا بند ہو جائیں، ناپید ہو جائیں، یا ان کی قیمت بڑھ یا گھٹ جائے، تو حنفی ائمہ میں اختلاف ہے کہ کیا واجب ہے۔ ابن عابدین رد المحتار میں امام ابو حنیفہ کا قول بیان کرتے ہیں کہ کساد سے بیع باطل ہو جاتی ہے، امام ابو یوسف کا قول کہ بیع یا قرض کے دن کی قیمت واجب ہے اور اسی پر فتویٰ ہے، اور امام محمد کا قول کہ لوگوں کے ان سے لین دین کے آخری دن کی قیمت؛ ان کی رائے میں یہ اختلاف صرف فلوس اور کھوٹ غالب دراہم میں ہے، خالص سونے چاندی میں نہیں؛ اور وہ اپنے رسالے تنبیہ الرقود فی احکام النقود کا حوالہ دیتے ہیں۔"
