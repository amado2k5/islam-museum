  - tradition: sunni-hanafi
    id: muhammad
    stance: { ar: "القيمة آخر يوم تعامل الناس بها", en: "Their value on the last day people dealt in them", ur: "لوگوں کے لین دین کے آخری دن کی قیمت" }
    summary:
      ar: "قول محمد بن الحسن كما ينقله ابن عابدين عن غاية البيان: عليه قيمتها في آخر نفاقها، أي يوم الكساد. {cite:radd-al-muhtar-bulaq-v4 p.31}"
      en: "Muhammad ibn al-Hasan's view, as Ibn Abidin reports it from Ghayat al-Bayan: their value at the end of their circulation, that is, on the day they stopped circulating."
      ur: "امام محمد بن الحسن کا قول، جیسا کہ ابن عابدین غایۃ البیان سے نقل کرتے ہیں: ان کے چلن کے آخری دن، یعنی کساد کے دن، کی قیمت۔"
    holders: [person/muhammad-ibn-al-hasan-al-shaybani]
