  - tradition: sunni-hanafi
    id: abu-hanifa
    stance: { ar: "يبطل البيع بالكساد، وفي الغلاء والرخص لا يلزم غيرها", en: "The sale is void if they stop circulating; with a rise or fall only the same coins are owed", ur: "کساد سے بیع باطل؛ قیمت بڑھنے گھٹنے پر وہی سکے واجب" }
    summary:
      ar: "قول أبي حنيفة كما ينقله ابن عابدين: إذا كسدت قبل التسليم بطل البيع ووجب رد المبيع إن كان قائماً أو مثله أو قيمته إن هلك، وإذا غلت أو رخصت فليس على المدين غيرها، وهو قول أبي يوسف أولاً. {cite:radd-al-muhtar-bulaq-v4 p.31}"
      en: "Abu Hanifa's view as Ibn Abidin reports it: if they stop circulating before delivery the sale is void and the goods must be returned if still there, or their like or value if destroyed; if they rise or fall the debtor owes only the same coins, which was also Abu Yusuf's first view."
      ur: "امام ابو حنیفہ کا قول جیسا کہ ابن عابدین نقل کرتے ہیں: اگر حوالگی سے پہلے کاسد ہو جائیں تو بیع باطل ہو جاتی ہے اور چیز موجود ہو تو واپس، ورنہ اس کی مثل یا قیمت واجب ہے؛ اور اگر مہنگی یا سستی ہوں تو مدیون پر وہی سکے ہیں، اور یہی امام ابو یوسف کا پہلا قول تھا۔"
    holders: [person/abu-hanifa]
