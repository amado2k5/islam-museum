issue:
  ar: "ما الواجب على المشتري أو المقترض إذا كسدت الفلوس أو تغيّرت قيمتها قبل الأداء؟"
  en: "What does the buyer or borrower owe if the copper coins stop circulating or change in value before payment?"
  ur: "اگر ادائیگی سے پہلے فلوس کا چلن ختم ہو جائے یا ان کی قیمت بدل جائے تو خریدار یا قرض دار پر کیا واجب ہے؟"
perspectives:
  - tradition: sunni-hanafi
    id: abu-yusuf-later
    stance: { ar: "القيمة يوم البيع أو القرض، وعليه الفتوى", en: "Their value on the day of sale or loan; the view for fatwa", ur: "بیع یا قرض کے دن کی قیمت؛ اسی پر فتویٰ ہے" }
    summary:
      ar: "قول أبي يوسف الأخير: على المدين قيمتها من الدراهم يوم البيع أو القرض، سواء كسدت أو انقطعت أو غلت أو رخصت؛ وينقل ابن عابدين عن البزازية والذخيرة والخلاصة أن الفتوى عليه، ويقول إنه يجب أن يُعوَّل عليه إفتاءً وقضاءً. {cite:radd-al-muhtar-bulaq-v4 p.31}"
      en: "Abu Yusuf's later view: the debtor owes their value in dirhams on the day of sale or loan, whether they stopped circulating, disappeared, rose or fell; Ibn Abidin reports from al-Bazzaziyya, al-Dhakhira and al-Khulasa that fatwa is given on it and says it must be relied on in fatwa and in court."
      ur: "امام ابو یوسف کا آخری قول: مدیون پر بیع یا قرض کے دن دراہم میں ان کی قیمت واجب ہے، خواہ وہ کاسد ہوں، ناپید ہوں، مہنگی ہوں یا سستی؛ ابن عابدین البزازیہ، الذخیرہ اور الخلاصہ سے نقل کرتے ہیں کہ فتویٰ اسی پر ہے، اور کہتے ہیں کہ فتویٰ اور قضا میں اسی پر اعتماد واجب ہے۔"
    holders: [person/abu-yusuf-al-qadi]
