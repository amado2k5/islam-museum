label: { ar: "نِيابة", en: "Niyaba (representation and agency: contractual and legal, and substitution in worship)" }
summary:
  ar: "النيابة في اللغة جعل الإنسان غيره نائباً عنه في الأمر، وفي الاصطلاح قيام الإنسان عن غيره بفعل أمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16677} ويفترق عنها الولاية والقوامة والوكالة والإيصاء، فالنيابة أعم من هذه كلها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16677} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16678} والنيابة نوعان: اتفاقية وهي الوكالة، وشرعية وهي الولاية على العاجزين بالصغر وما في معناه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16680} وتتنوع الولاية الشرعية إلى ولاية على المال وولاية على النفس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16680} وفي العبادات المالية المحضة كالزكاة والكفارات والنذور تجوز النيابة باتفاق الفقهاء، وفي البدنية المحضة كالصلاة والصيام لا تجوز، وفي المشتملة على البدن والمال كالحج والعمرة تجوز بشروط، منها عجز المحجوج عنه عجزاً مستديماً ووجود مال يُستنابُ منه، وأن يكون النائب قد حج عن نفسه عند الحنفية والشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16683} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16684} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16685} وفي الحج عن الميت تفصيل بين الفرض والتطوع، والاستئجار على الحج عن الميت جائز عند المالكية والشافعية والحنابلة في رواية، ومنعه الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16696} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16699} وتجوز الاستنابة في الأضحية والرمي، وفي الوظائف خلاف بين الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16695} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16700}"
  en: "Niyaba in the lexical sense is making another one's deputy in a matter; technically it is one person's standing in for another in an act. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16677} It differs from wilaya, qawama, wakala and wasiyya; niyaba is the wider notion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16677} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16678} There are two kinds: the contractual, which is agency, and the legal, which is guardianship over those unable to act for themselves through youth or the like. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16680} Legal guardianship is over property or over the person. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16680} In purely financial worship, such as zakat, expiations and vows, substitution is permitted by agreement; in purely bodily worship, such as prayer and fasting, it is not; in worship of body and wealth, such as the pilgrimage and the lesser pilgrimage, it is permitted under conditions: the principal must be permanently unable and must have funds, and for the Hanafis, Shafi'is and Hanbalis the deputy must have performed his own pilgrimage first. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16683} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16684} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16685} Pilgrimage on behalf of the dead is treated separately for obligatory and voluntary acts; hiring for the pilgrimage on behalf of the dead is permitted by the Malikis, Shafi'is and in one Hanbali report, and forbidden by the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16696} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16699} Substitution in sacrifice and in stoning is permitted; the jurists differ on substitution in offices. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16695} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16700}"
