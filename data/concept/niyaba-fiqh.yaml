label: { ar: "نِيابة", en: "Niyaba (representation and agency: contractual and legal, and substitution in worship)", es: "Niyaba (representación y agencia: contractual y legal, y sustitución en el culto)", fr: "Niyaba (représentation et mandat: contractuel et légal, et substitution dans le culte)", ur: "نیابہ ⁦(نمائندگی اور ایجنسی: معاہدہ اور قانونی، اور عبادت میں متبادل)⁩", tr: "Kovuşturma", id: "Penuntutan" }
summary:
  ar: "النيابة في اللغة جعل الإنسان غيره نائباً عنه في الأمر، وفي الاصطلاح قيام الإنسان عن غيره بفعل أمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16677} ويفترق عنها الولاية والقوامة والوكالة والإيصاء، فالنيابة أعم من هذه كلها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16677} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16678} والنيابة نوعان: اتفاقية وهي الوكالة، وشرعية وهي الولاية على العاجزين بالصغر وما في معناه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16680} وتتنوع الولاية الشرعية إلى ولاية على المال وولاية على النفس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16680} وفي العبادات المالية المحضة كالزكاة والكفارات والنذور تجوز النيابة باتفاق الفقهاء، وفي البدنية المحضة كالصلاة والصيام لا تجوز، وفي المشتملة على البدن والمال كالحج والعمرة تجوز بشروط، منها عجز المحجوج عنه عجزاً مستديماً ووجود مال يُستنابُ منه، وأن يكون النائب قد حج عن نفسه عند الحنفية والشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16683} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16684} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16685} وفي الحج عن الميت تفصيل بين الفرض والتطوع، والاستئجار على الحج عن الميت جائز عند المالكية والشافعية والحنابلة في رواية، ومنعه الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16696} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16699} وتجوز الاستنابة في الأضحية والرمي، وفي الوظائف خلاف بين الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16695} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16700}"
  en: "Niyaba in the lexical sense is making another one's deputy in a matter; technically it is one person's standing in for another in an act. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16677} It differs from wilaya, qawama, wakala and wasiyya; niyaba is the wider notion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16677} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16678} There are two kinds: the contractual, which is agency, and the legal, which is guardianship over those unable to act for themselves through youth or the like. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16680} Legal guardianship is over property or over the person. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16680} In purely financial worship, such as zakat, expiations and vows, substitution is permitted by agreement; in purely bodily worship, such as prayer and fasting, it is not; in worship of body and wealth, such as the pilgrimage and the lesser pilgrimage, it is permitted under conditions: the principal must be permanently unable and must have funds, and for the Hanafis, Shafi'is and Hanbalis the deputy must have performed his own pilgrimage first. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16683} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16684} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16685} Pilgrimage on behalf of the dead is treated separately for obligatory and voluntary acts; hiring for the pilgrimage on behalf of the dead is permitted by the Malikis, Shafi'is and in one Hanbali report, and forbidden by the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16696} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16699} Substitution in sacrifice and in stoning is permitted; the jurists differ on substitution in offices. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16695} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16700}"
  es: "Niyaba en sentido léxico es hacer de otro el representante de alguien en un asunto; técnicamente es la sustitución de una persona por otra en un acto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16677} Se diferencia de wilaya, qawama, wakala y wasiyya; niyaba es la noción más amplia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16677} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16678} Hay dos tipos: el contractual, que es agencia, y el legal, que es tutela sobre aquellos incapaces de actuar por sí mismos debido a la juventud o similar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16680} La tutela legal es sobre la propiedad o sobre la persona. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16680} En el culto puramente financiero, como el zakat, las expiaciones y los votos, la sustitución está permitida por acuerdo; en el culto puramente corporal, como la oración y el ayuno, no lo está; en el culto del cuerpo y la riqueza, como la peregrinación y la peregrinación menor, está permitida bajo condiciones: el principal debe estar permanentemente incapacitado y debe tener fondos, y para los hanafíes, shafi'ís y hanbalíes el sustituto debe haber realizado primero su propia peregrinación. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16681} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16683} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16684} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16685} La peregrinación en nombre de los difuntos se trata por separado para actos obligatorios y voluntarios; La contratación para la peregrinación en nombre de los muertos está permitida por los Malikis, Shafi'is y en un informe Hanbali, y prohibida por los Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16696} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16699} Se permite la sustitución en el sacrificio y en la lapidación; Los juristas difieren sobre la sustitución de cargos. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16695} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16700}"
  fr: "Le terme « niyaba », au sens littéral, désigne le fait de désigner une autre personne comme son représentant dans une affaire; techniquement, il s’agit du fait pour une personne de se substituer à une autre dans un acte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16677} Il diffère de « wilaya », « qawama », « wakala » et « wasiyya »; « niyaba » est une notion plus large. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16677} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16678} Il en existe deux types: le type contractuel, qui relève du mandat, et le type légal, qui concerne la tutelle des personnes incapables d’agir pour elles-mêmes en raison de leur minorité ou d’une autre situation similaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16680} La tutelle légale porte sur les biens ou sur la personne. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16680} Dans les actes d'adoration purement financiers, tels que la zakat, les expiations et les vœux, la substitution est permise par accord; dans les actes d'adoration purement corporels, tels que la prière et le jeûne, elle ne l'est pas; dans les actes d'adoration du corps et des biens, tels que le pèlerinage et le petit pèlerinage, elle est permise sous certaines conditions: le mandant doit être dans l'incapacité permanente et disposer de ressources financières, et, pour les écoles hanafite, shafi'ite et hanbalite, le mandataire doit avoir accompli son propre pèlerinage au préalable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16683} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16684} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16685} Le pèlerinage en faveur des morts est traité séparément pour les actes obligatoires et volontaires; la location pour le pèlerinage au nom des morts est autorisée par les Malikis, les Shafi'is et dans un rapport Hanbali, et interdite par les Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16696} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16699} La substitution dans le sacrifice et dans la lapidation est autorisée; les juristes diffèrent sur la substitution dans les fonctions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16695} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16700}"
  ur: "نیابا لغوی معنوں میں کسی معاملے میں دوسرے کا نائب بنانا ہے۔ تکنیکی طور پر یہ کسی ایکٹ میں ایک شخص کا دوسرے کے ساتھ کھڑا ہونا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 16677} یہ ولایت، قوام، وکالہ اور وصیہ سے مختلف ہے۔ نیابہ وسیع تر تصور ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16677} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16678} دو قسمیں ہیں: معاہدہ، جو ایجنسی ہے، اور قانونی، جو ان لوگوں کی سرپرستی ہے جو جوانی کے ذریعے یا اپنے لیے کام کرنے سے قاصر ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16679} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16680} قانونی سرپرستی جائیداد یا شخص پر ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16680} خالص مالی عبادات میں، جیسے زکوٰۃ، کفارہ اور نذر، معاہدے کے ذریعے بدلنے کی اجازت ہے۔ خالص جسمانی عبادت میں، جیسے نماز اور روزہ، ایسا نہیں ہے۔ جسم اور مال کی عبادت میں، جیسے حج اور کم عمری میں، اس کی اجازت شرائط کے تحت ہے: پرنسپل کا مستقل طور پر عاجز ہونا چاہیے اور اس کے پاس فنڈ ہونا چاہیے، اور حنفیہ، شافعیہ اور حنبلیوں کے لیے نائب کو سب سے پہلے اپنا حج کرنا چاہیے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16681} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16683} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16684} p.16685} میت کی طرف سے حج فرض اور رضاکارانہ کاموں کے لیے الگ الگ سمجھا جاتا ہے۔ میت کی طرف سے حج پر لینا مالکیوں، شافعیوں اور حنبلیوں کی ایک روایت میں جائز ہے اور احناف کے نزدیک حرام ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص16696} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص16699} قربانی اور رجم میں بدلہ جائز ہے۔ دفاتر میں متبادل کے بارے میں فقہاء کا اختلاف ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16695}"
  tr: "Dilde ajans, bir konuda vekil olarak hareket eden kişiyi ifade eder; terminolojide ise bir kişi, başkaları adına bir emir yerine hareket eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.166777} Vesayet, vasilik, ajans ve vesayet bunlardan farklıdır, bu nedenle vekaletçilik bunların hepsinden daha geniştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16677} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16678} ve ajans iki türden oluşur: anlaşma, yani ajans, ve şeriat, yani reşit olmayanlar ve ilgili konular nedeniyle ehliyeti olan kişiler üzerinde vasiliktir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16680} Yasal vesayet, mal varlığı ve kendisi üzerindeki vasilik arasında değişir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16680} Zekat, kefaret ve yemin gibi tamamen maddi ibadet işlemlerinde temsil, hukukçuların uzlaşmasıyla mümkündür; nama ve oruç gibi tamamen fiziksel eylemlerde ise izin verilmez; Hac ve Umre gibi fiziksel ve maddi rahatsızlıklar içeren durumlarda, kalıcı maluliyetsizlik ve yerine geçen servetin varlığı gibi koşullarda izinlidir ve temsilci kendi adına Hacı Hanefi, Şafiî ve Hanbali'ye göre yapmış olmalıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16681} {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s. 16683} {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.16684} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16685} Ölen adına Hac'da, zorunlu ve gönüllü eylemler arasında ayrıntılı bir ayrım vardır ve bir rivayete göre ölen adına Hac kiralamak mahalledir, Hanefiler ise bunu yasaklar. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.16696} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16699} Kurban ve taşlama yerine geçmek caizdir, ancak hukukçular arasında işlevler konusunda anlaşmazlık vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16695} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16700}"
  id: "Dalam bahasa, agensi berarti seseorang yang bertindak sebagai wakilnya dalam suatu perkara, dan dalam istilah, seseorang bertindak atas nama orang lain dengan melakukan perintah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.166777} Dan perwalian, wali, agensi, dan wali berbeda dari yang ini, sehingga agensi lebih luas dari semuanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16677} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16678} dan keagenan terdiri dari dua jenis: kesepakatan, yaitu agensi, dan Syariah, yaitu wali atas orang yang tidak mampu karena anak di bawah umur dan hal-hal terkait. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16680} Wali hukum bervariasi dengan perwalian atas harta dan wali atas diri sendiri. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16680} Dalam tindakan ibadah yang murni finansial seperti zakat, penebusan, dan janji, perwakilan diperbolehkan berdasarkan kesepakatan para ahli hukum; dalam tindakan fisik seperti shalat dan puasa, tidak diperbolehkan; dan dalam tindakan yang melibatkan ketidaknyamanan fisik dan finansial, seperti Haji dan Umrah, diperbolehkan dengan syarat, termasuk ketidakmampuan permanen dan keberadaan kekayaan pengganti, dan wakil harus melaksanakan Haji atas namanya sendiri menurut Hanafi, Shafi'i, dan Hanbali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm. 16683} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16684} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16685} Dalam Haji atas nama almarhum, terdapat perbedaan rinci antara tindakan wajib dan sukarela, dan menyewa Haji atas nama almarhum diperbolehkan menurut Maliki, Shafi'i, dan Hanbal menurut narasi, dan Hanafi melarangnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16696} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16699} Diperbolehkan menggantikan pengorbanan dan lempari batu menurut narasi dan rajam, tetapi ada perbedaan pendapat di antara para ahli hukum mengenai fungsinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16695} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16700}"
