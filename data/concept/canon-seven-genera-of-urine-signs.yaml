id: concept/canon-seven-genera-of-urine-signs
class: concept
kind: scientific
label:
  ar: "أجناس دلائل البول السبعة عند ابن سينا"
  en: "The seven genera of urine signs in the Canon"
  fr: "Sept genres de signes urinaires dans le Canon"
  ur: "پیشاب کی علامات کی سات اجناس قانون میں"
  es: "Los siete géneros de signos de orina en el Canon"
summary:
  ar: "يقسم ابن سينا الدلائل المأخوذة من البول إلى سبعة أجناس: اللون والقوام والصفاء والكدورة والرسوب والمقدار والرائحة والزبد، ويسقط اللمس والطعم {cite:canon-ibn-sina-print-v1 p.184}."
  en: "Ibn Sina divides the signs taken from urine into seven genera, colour, consistency, clarity and turbidity, sediment, quantity, smell and froth, and sets aside touch and taste {cite:canon-ibn-sina-print-v1 p.184}."
  fr: "Ibn Sina divise les signes urinaires en sept genres : couleur, consistance, limpidité et trouble, sédiment, quantité, odeur et mousse ; il écarte toucher et goût {cite:canon-ibn-sina-print-v1 p.184}."
  es: "Ibn Sina divide los signos tomados de la orina en siete géneros: color, consistencia, claridad y turbidez, sedimento, cantidad, olor y espuma, y deja de lado el tacto y el gusto {cite:canon-ibn-sina-print-v1 p.184}."
  ur: "ابن سینا پیشاب سے لی گئی علامات کو سات نسلوں میں تقسیم کرتا ہے، رنگ، مستقل مزاجی، شفافیت اور گندگی، تلچھٹ، مقدار، بو اور جھاگ، اور لمس اور ذائقہ کو ایک طرف رکھتا ہے۔"
