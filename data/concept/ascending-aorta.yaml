id: concept/ascending-aorta
class: concept
kind: scientific
label:
  ar: "الشريان الصاعد عند ابن سينا"
  en: "The ascending artery in the Canon"
  fr: "L’artère ascendante dans le Canon"
  ur: "قانون میں چڑھنے والی شریان"
  es: "La arteria ascendente en el Canon"
  tr: "İbn Sina'daki yükselen arter"
  id: "Arteri naik di Ibn Sina"
summary:
  ar: "في الفصل الثالث يذكر ابن سينا أن الجزء الصاعد من الأورطي ينقسم قسمين، أكبرهما يتجه نحو أسفل العنق ثم يتورب إلى اليمين ويتفرع ثلاثة أقسام، منها السباتيان، وأصغرهما يأخذ إلى الإبط {cite:canon-ibn-sina-print-v1 p.85}."
  en: "In the third chapter Ibn Sina says the ascending part of the aorta divides in two; the larger heads for the base of the neck, turns to the right and divides in three, among them the two carotids, and the smaller goes to the armpit {cite:canon-ibn-sina-print-v1 p.85}."
  fr: "Au troisième chapitre, Ibn Sina dit que la partie ascendante de l’aorte se divise en deux ; la plus grande se dirige vers la base du cou, tourne à droite et se divise en trois, dont les deux carotides, tandis que la plus petite va vers l’aisselle {cite:canon-ibn-sina-print-v1 p.85}."
  es: "En el tercer capítulo, Ibn Sina dice que la parte ascendente de la aorta se divide en dos; la más grande se dirige a la base del cuello, gira a la derecha y se divide en tres, entre ellas las dos carótidas, y la más pequeña va a la axila {cite:canon-ibn-sina-print-v1 p.85}."
  ur: "تیسرے باب میں ابن سینا کہتے ہیں کہ شہ رگ کا چڑھتا ہوا حصہ دو حصوں میں تقسیم ہوتا ہے۔ گردن کی بنیاد کے لیے بڑے سر، دائیں طرف مڑتے ہیں اور تین میں تقسیم ہوتے ہیں، ان میں سے دو کیروٹائڈز، اور چھوٹا بغل میں جاتا ہے"
  tr: "Üçüncü bölümde, İbn Sina, aortun yükselen kısmının iki parçaya ayrıldığını, en büyüğünün boynun alt kısmına doğru uzandığını, sonra sağa döndüğünü ve iki karotimi içeren üç bölüme ayrıldığını, en küçüğün ise koltuk altına kadar uzandığını belirtir {cite:canon-ibn-sina-print-v1 s.85}."
  id: "Pada bab ketiga, Ibn Sina menyebutkan bahwa bagian aorta yang naik terbagi menjadi dua bagian, yang terbesar membentang ke bagian bawah leher, lalu berbelok ke kanan dan bercabang menjadi tiga bagian, termasuk dua karotim, dan yang terkecil membentang hingga ketiak {cite:canon-ibn-sina-print-v1 hlm.85}."
