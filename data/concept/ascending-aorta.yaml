label: { ar: "الشريان الصاعد عند ابن سينا", en: "The ascending artery in the Canon", ur: "قانون میں چڑھنے والی شریان" }
summary:
  ar: "في الفصل الثالث يذكر ابن سينا أن الجزء الصاعد من الأورطي ينقسم قسمين، أكبرهما يتجه نحو أسفل العنق ثم يتورب إلى اليمين ويتفرع ثلاثة أقسام، منها السباتيان، وأصغرهما يأخذ إلى الإبط {cite:canon-ibn-sina-print-v1 p.85}."
  en: "In the third chapter Ibn Sina says the ascending part of the aorta divides in two; the larger heads for the base of the neck, turns to the right and divides in three, among them the two carotids, and the smaller goes to the armpit {cite:canon-ibn-sina-print-v1 p.85}."
