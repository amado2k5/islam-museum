label: { ar: "الأنعام", en: "Anam (livestock: camels, cattle and sheep, and their rulings)", fr: "Anam (le bétail : chameaux, bovins et ovins, et leurs statuts)", es: "Anam (ganado: camellos, vacas y ovejas, y sus normas)", ur: "انعم ⁦(مویشی: اونٹ، گائے اور بھیڑ، اور ان کے احکام)⁩" }
summary:
  ar: "الأنعام لغة جمع نعم، وهي الإبل والبقر والغنم، وأكثر ما يقع على الإبل. وعند الفقهاء الأنعام الإبل والبقر والغنم، سميت نعما لكثرة نعم الله فيها بالنمو والولادة واللبن والصوف والوبر والشعر وعموم الانتفاع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3508} تجب الزكاة في الأنعام إذا بلغت نصابا باتفاق الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3508} ولا تشرع الهدي والأضحية والعقيقة إلا من الأنعام، والأفضل في الهدي الإبل ثم البقر ثم الغنم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3508} ويحل ذبحها وأكلها في الحل والحرم وحال الإحرام بخلاف الصيد، والأفضل في تذكيتها النحر في الإبل والذبح في البقر والغنم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3509}"
  en: "Anam is lexically the plural of ni'm, meaning camels, cattle and sheep, and most often camels. For the jurists, the anam are camels, cattle and sheep, so called for the abundance of God's favour in them: growth, birth, milk, wool, hair and general benefit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3508} Zakat is due on livestock once it reaches the nisab, by agreement of the jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3508} Only livestock may be offered as hadi, sacrifice or aqiqa, and the best hadi is a camel, then a cow, then a sheep. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3508} Livestock may be slaughtered and eaten in the sanctuary and outside it, and during ihram, unlike game; the best method is to slaughter camels by nahr and cattle and sheep by dhabh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3509}"
  fr: "Anam est, au sens lexical, le pluriel de ni’m, désignant les chameaux, les bovins et les ovins, et le plus souvent les chameaux. Pour les juristes, les anam sont les chameaux, les bovins et les ovins, ainsi nommés pour l’abondance de la faveur de Dieu qu’ils renferment : croissance, mise bas, lait, laine, poil et utilité générale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3508} La zakat est due sur le bétail dès qu’il atteint le nisab, de l’avis unanime des juristes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3508} Seul le bétail peut être offert comme hadi, sacrifice ou aqiqa, et le meilleur hadi est un chameau, puis une vache, puis un mouton. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3508} Le bétail peut être abattu et mangé dans le sanctuaire et en dehors, et pendant l’ihram, à la différence du gibier ; la meilleure méthode est d’abattre les chameaux par nahr et les bovins et ovins par dhabh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3509}"
  es: "Anam es léxicamente el plural de ni'm, que significa camellos, vacas y ovejas, y más a menudo camellos. Para los juristas, los anam son camellos, vacas y ovejas, llamados así por la abundancia del favor de Dios en ellos: crecimiento, nacimiento, leche, lana, pelo y beneficio general. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3508} El zakat se debe al ganado una vez que alcanza el nisab, por acuerdo de los juristas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3508} Solo el ganado puede ser ofrecido como hadi, sacrificio o aqiqa, y el mejor hadi es un camello, luego una vaca, luego una oveja. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3508} El ganado puede ser sacrificado y comido en el santuario y fuera de él, y durante el ihram, a diferencia de la caza; El mejor método es sacrificar camellos por nahr y vacas y ovejas por dhabh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3509}"
  ur: "انعم لغوی طور پر نعم کی جمع ہے، جس کا مطلب ہے اونٹ، مویشی اور بھیڑیں اور اکثر اونٹ۔ فقہاء کے نزدیک انعم اونٹ، مویشی اور بھیڑیں ہیں، ان میں خدا کے فضل کی کثرت کے لیے کہا جاتا ہے: نشوونما، پیدائش، دودھ، اون، بال اور عمومی فائدہ۔ فقہ الموسوعۃ النور v3 صفحہ 3508} فقہاء کے اتفاق سے نصاب تک پہنچنے کے بعد مال مویشیوں پر زکوٰۃ واجب ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3508} صرف مویشی ہی بطور ہدی، قربانی یا عقیقہ پیش کیے جا سکتے ہیں، اور بہترین حدیث اونٹ، پھر گائے، پھر بھیڑ ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3508} حرم میں اور اس کے باہر اور احرام کے دوران، کھیل کے برعکس مویشیوں کو ذبح کیا اور کھایا جا سکتا ہے۔ بہترین طریقہ یہ ہے کہ اونٹ کو نحر سے ذبح کیا جائے اور مویشی اور بھیڑ بکریاں ذبح کریں۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 3509}"
