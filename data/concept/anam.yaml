label: { ar: "الأنعام", en: "Anam (livestock: camels, cattle and sheep, and their rulings)" }
summary:
  ar: "الأنعام لغة جمع نعم، وهي الإبل والبقر والغنم، وأكثر ما يقع على الإبل. وعند الفقهاء الأنعام الإبل والبقر والغنم، سميت نعما لكثرة نعم الله فيها بالنمو والولادة واللبن والصوف والوبر والشعر وعموم الانتفاع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3508} تجب الزكاة في الأنعام إذا بلغت نصابا باتفاق الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3508} ولا تشرع الهدي والأضحية والعقيقة إلا من الأنعام، والأفضل في الهدي الإبل ثم البقر ثم الغنم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3508} ويحل ذبحها وأكلها في الحل والحرم وحال الإحرام بخلاف الصيد، والأفضل في تذكيتها النحر في الإبل والذبح في البقر والغنم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3509}"
  en: "Anam is lexically the plural of ni'm, meaning camels, cattle and sheep, and most often camels. For the jurists, the anam are camels, cattle and sheep, so called for the abundance of God's favour in them: growth, birth, milk, wool, hair and general benefit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3508} Zakat is due on livestock once it reaches the nisab, by agreement of the jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3508} Only livestock may be offered as hadi, sacrifice or aqiqa, and the best hadi is a camel, then a cow, then a sheep. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3508} Livestock may be slaughtered and eaten in the sanctuary and outside it, and during ihram, unlike game; the best method is to slaughter camels by nahr and cattle and sheep by dhabh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3509}"
