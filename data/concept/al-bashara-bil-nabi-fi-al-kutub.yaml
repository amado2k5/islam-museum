id: concept/al-bashara-bil-nabi-fi-al-kutub
class: concept
kind: doctrine
label:
  ar: "البشارة بالنبي في الكتب السابقة"
  en: "The description of the Prophet in earlier scriptures"
  ur: "سابقہ کتابوں میں نبی کا تذکرہ"
summary:
  ar: "يرى الشعراوي أن أهل الكتاب عرفوا أوصاف النبي ووقته من كتبهم، وأن كفرهم به لم يكن جهلا بل مصلحة وحسدا على السيادة، وأن التوراة فيها ما حُرّف وما لم يُحرّف، والآيات المتعلقة بالنبي حُرّفت {cite:tafsir-sharawi-khawatir-scan p.292} {cite:tafsir-sharawi-khawatir-scan p.293} {cite:tafsir-sharawi-khawatir-scan p.294} {cite:tafsir-sharawi-khawatir-scan p.299} {cite:tafsir-sharawi-khawatir-scan p.300}."
  en: "Sha'rawi holds that the People of the Book knew the Prophet's description and time from their scriptures, and that their rejection was not ignorance but self-interest and envy of their leadership; that the Torah contains what was distorted and what was not, and that the verses about the Prophet were distorted {cite:tafsir-sharawi-khawatir-scan p.292} {cite:tafsir-sharawi-khawatir-scan p.293} {cite:tafsir-sharawi-khawatir-scan p.294} {cite:tafsir-sharawi-khawatir-scan p.299} {cite:tafsir-sharawi-khawatir-scan p.300}."
  ur: "شعراوی کے نزدیک اہلِ کتاب نے اپنی کتابوں سے نبی کے اوصاف اور زمانہ جانا تھا، اور ان کا انکار جہالت نہیں بلکہ مفاد اور اپنی سرداری کے حسد پر مبنی تھا۔ ان کے نزدیک تورات میں کچھ حصہ بدلا گیا اور کچھ نہیں، اور نبی سے متعلق آیات کو بدلا گیا {cite:tafsir-sharawi-khawatir-scan p.292} {cite:tafsir-sharawi-khawatir-scan p.293} {cite:tafsir-sharawi-khawatir-scan p.294} {cite:tafsir-sharawi-khawatir-scan p.299} {cite:tafsir-sharawi-khawatir-scan p.300}۔"
wings: [ideas]
themes: [islam-and-judaism]
periods: [period/prophetic-era]
regions: [global]
issue:
  ar: "هل كان أهل الكتاب يعرفون صدق النبي من كتبهم، وهل حُرّفت الآيات المتعلقة به؟"
  en: "Did the People of the Book know the Prophet's truth from their scriptures, and were the verses about him distorted?"
perspectives:
  - tradition: sunni
    id: sunni-sharawi
    stance:
      ar: "أهل الكتاب عرفوا أوصافه، وكفروا بمصلحة، وحرّفوا ما يتعلق به"
      en: "The People of the Book knew his description, rejected him from self-interest, and distorted what concerns him"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن أحبار اليهود كانوا يعرفون صدق الرسالة، وأن كفرهم كان مصلحة وحسدا، وأنهم حرّفوا الآيات المتعلقة بالنبي دون غيرها، ويستدل بحديث حول تعليمه أن {cite:tafsir-sharawi-khawatir-scan p.294} {cite:tafsir-sharawi-khawatir-scan p.299}."
      en: "Sha'rawi holds that the rabbis knew the message was true, that their rejection was from self-interest and envy, and that they distorted the verses concerning the Prophet but not the rest. He relies on the account of a Jewish scholar who recognised the Prophet {cite:tafsir-sharawi-khawatir-scan p.294} {cite:tafsir-sharawi-khawatir-scan p.299}."
    sources: [source/tafsir-sharawi-khawatir-scan]
