id: concept/al-bashara-bil-nabi-fi-al-kutub
class: concept
kind: doctrine
label:
  ar: "البشارة بالنبي في الكتب السابقة"
  en: "The description of the Prophet in earlier scriptures"
  fr: "La description du Prophète dans les Écritures antérieures"
  ur: "سابقہ کتابوں میں نبی کا تذکرہ"
  es: "La descripción del Profeta en las escrituras antiguas"
  tr: "Önceki Kitaplarda Peygamberin İyi Haberi"
  id: "Kabar Baik Nabi dalam Buku-buku Sebelumnya"
summary:
  ar: "يرى الشعراوي أن أهل الكتاب عرفوا أوصاف النبي ووقته من كتبهم، وأن كفرهم به لم يكن جهلا بل مصلحة وحسدا على السيادة، وأن التوراة فيها ما حُرّف وما لم يُحرّف، والآيات المتعلقة بالنبي حُرّفت {cite:tafsir-sharawi-khawatir-scan p.292} {cite:tafsir-sharawi-khawatir-scan p.293} {cite:tafsir-sharawi-khawatir-scan p.294} {cite:tafsir-sharawi-khawatir-scan p.299} {cite:tafsir-sharawi-khawatir-scan p.300}."
  en: "Sha'rawi holds that the People of the Book knew the Prophet's description and time from their scriptures, and that their rejection was not ignorance but self-interest and envy of their leadership; that the Torah contains what was distorted and what was not, and that the verses about the Prophet were distorted {cite:tafsir-sharawi-khawatir-scan p.292} {cite:tafsir-sharawi-khawatir-scan p.293} {cite:tafsir-sharawi-khawatir-scan p.294} {cite:tafsir-sharawi-khawatir-scan p.299} {cite:tafsir-sharawi-khawatir-scan p.300}."
  fr: "Sha’rawi estime que les gens du Livre connaissaient la description et l’époque du Prophète grâce à leurs Écritures, et que leur rejet ne procédait pas de l’ignorance, mais de l’intérêt personnel et de la jalousie liée à leur autorité ; que la Torah contient des éléments altérés et d’autres qui ne le sont pas, et que les versets concernant le Prophète ont été altérés {cite:tafsir-sharawi-khawatir-scan p.292} {cite:tafsir-sharawi-khawatir-scan p.293} {cite:tafsir-sharawi-khawatir-scan p.294} {cite:tafsir-sharawi-khawatir-scan p.299} {cite:tafsir-sharawi-khawatir-scan p.300}."
  ur: "شعراوی کے نزدیک اہلِ کتاب نے اپنی کتابوں سے نبی کے اوصاف اور زمانہ جانا تھا، اور ان کا انکار جہالت نہیں بلکہ مفاد اور اپنی سرداری کے حسد پر مبنی تھا۔ ان کے نزدیک تورات میں کچھ حصہ بدلا گیا اور کچھ نہیں، اور نبی سے متعلق آیات کو بدلا گیا {cite:tafsir-sharawi-khawatir-scan p.292} {cite:tafsir-sharawi-khawatir-scan p.293} {cite:tafsir-sharawi-khawatir-scan p.294} {cite:tafsir-sharawi-khawatir-scan p.299} {cite:tafsir-sharawi-khawatir-scan p.300}۔"
  es: "Sha'rawi sostiene que la Gente del Libro conocía la descripción y la época del Profeta a partir de sus escrituras, y que su rechazo no fue ignorancia sino interés propio y envidia de su liderazgo; que la Torá contiene lo que fue distorsionado y lo que no, y que los versículos sobre el Profeta fueron distorsionados {cite:tafsir-sharawi-khawatir-scan p.292} {cite:tafsir-sharawi-khawatir-scan p.293} {cite:tafsir-sharawi-khawatir-scan p.294} {cite:tafsir-sharawi-khawatir-scan p.299} {cite:tafsir-sharawi-khawatir-scan p.300}."
  tr: "El-Şaarawi, Kitap Ahlâhitlerinin Peygamber'in ve zamanının tanımlarını kitaplarından bildiğine, ona olan inançsızlıklarının cehalet değil, egemenlik çıkarı ve kıskançlığından kaynaklandığına, Tora'nın neyin çarpıtılmış ve neyin çarpıtılmış olmadığını içerdiğine, Peygamber ile ilgili ayetlerin ise çarpıtıldığına inanır {cite:tafsir-sharawi-khawatir-scan s.292} {cite:tafsir-sharawi-khawatir-scan s.294} {cite:tafsir-sharawi-khawatir-scan s.299} {cite:tafsir-sharawi-khawatir-scan s.300}."
  id: "Al-Shaarawi percaya bahwa umat Kitab mengetahui definisi Nabi dan zamannya dari kitab-kitab mereka, bahwa ketidakpercayaan mereka kepada-Nya bukan berasal dari kebodohan tetapi dari minat dan kecemburuan atas dominasi, bahwa Taurat memuat apa yang terdistorsi dan apa yang tidak, dan bahwa ayat-ayat yang berkaitan dengan Nabi telah terdistorsi {cite:tafsir-sharawi-khawatir-scan hlm.292} {cite:tafsir-sharawi-khawatir-scan hlm.294} {cite:tafsir-sharawi-khawatir-scan hlm.299} {cite:tafsir-sharawi-khawatir-scan hlm.300}."
