id: concept/ruyat-hilal-fiqh
class: concept
kind: legal
label:
  ar: "رؤية الهلال"
  en: "Sighting the crescent (ru'yat al-hilal): how the start and end of the lunar month are proved"
  ur: "رؤیت ہلال"
  es: "Avistamiento de la luna creciente (ru'yat al-hilal): cómo se comprueba el inicio y el final del mes lunar."
  fr: "Observation du croissant (ru'yat al-hilal): comment sont prouvés le début et la fin du mois lunaire"
  tr: "Hilal gözlemi"
  id: "Penampakan bulan sabit"
summary:
  ar: "الرؤية بالعين والقلب، وإذا أضيفت إلى الأعيان كانت بالبصر، والهلال القمر في أوائل الشهر، ويُعنى برؤيته مشاهدته بعد غروب شمس التاسع والعشرين ممن يُعتمد خبره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8546} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8547} والأدلة على طلب الرؤية وإكمال العدة ثلاثين إذا غُمّ الهلال مشهورة، وتتأكد عند ليالي الثلاثين من شعبان ورمضان وذي القعدة لأن بها يتعلق الصوم والحج والعيدان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8547} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8548} وتثبت الرؤية بالعين من جمع مستفيض، أو بشهادة عدلين، أو بخبر العدل الواحد في هلال رمضان عند الحنفية والشافعية والحنابلة، ولا يُقبل الواحد عند المالكية، وفي غير رمضان يُشترط عند أكثر الفقهاء عدلان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8551} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8552} وإن رُئي الهلال نهارا اختلف الفقهاء في كونه لليلة الماضية أو المقبلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8553} ولم يعتمد جمهور الفقهاء الحساب الفلكي في إثبات الشهر، وفسروا حديث «فاقدروا له» بإتمام العدة، واعتبر بعضهم الحساب في حق العارف به، وقال الجمهور بعدم اعتبار اختلاف المطالع، وقال الحنفية والشافعية باعتبارها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8557} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8560} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8561}"
  en: "Sight is seeing with the eye or the heart; when it takes material things as its object it is by the eye. The crescent means the moon at the start of each lunar month; its sighting here is the seeing of it after sunset on the twenty-ninth of the previous month by someone whose report is accepted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8546} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8547} The hadiths on seeking the crescent and completing the count of thirty days when it is hidden are the basis; the search is urged most on the thirtieth of Sha'ban, Ramadan and Dhu al-Qa'da, because fasting and the pilgrimage and both Eids depend on them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8547} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8548} Sighting is proved by a mass report that rules out collusion, by two just witnesses, or, for Ramadan's start, by a single just witness according to the Hanafis, Shafi'is and Hanbalis; the Malikis do not accept a single witness. For other months most jurists require two just men. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8551} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8552} A crescent seen in daylight is disputed: whether it belongs to the night before or the coming night. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8553} Most jurists did not accept reckoning by astronomy to prove the month, read the phrase \"estimate it\" as completing thirty days, and the majority set aside differences of horizon, while the Hanafis and Shafi'is take them into account. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8557} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8560} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8561}"
  ur: "رؤیت ہلال سے مراد چاند دیکھنا ہے؛ رمضان، شوال اور ذوالحجہ کے آغاز کا ثبوت گواہی، خبر اور اکمال عدد سے ہوتا ہے، اور فقہاء کی آراء اس بارے میں مختلف ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8546} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8549}"
  es: "La vista es ver con el ojo o el corazón; cuando toma cosas materiales como su objeto es por el ojo. La media luna significa la luna al comienzo de cada mes lunar; su avistamiento aquí es verla después de la puesta del sol el veintinueve del mes anterior por alguien cuyo informe es aceptado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8546} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8547} Los hadices sobre la búsqueda de la media luna y completar el conteo de treinta días cuando está oculta son la base; la búsqueda se insta más en el treinta de Sha'ban, Ramadán y Dhu al-Qa'da, porque el ayuno y la peregrinación y ambos Eids dependen de ellos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8547} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8548} El avistamiento se prueba mediante un informe colectivo que descarta la colusión, mediante dos testigos justos o, para el inicio del Ramadán, mediante un único testigo justo según los hanafíes, shafi'ís y hanbalíes; los malikíes no aceptan un solo testigo. Para los demás meses, la mayoría de los juristas requieren dos hombres justos. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8549} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8550} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8551} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8552} Una media luna vista a la luz del día está en disputa: si pertenece a la noche anterior o a la noche siguiente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8553} La mayoría de los juristas no aceptaban el cálculo por astronomía para probar el mes, interpretaban la frase \"estimarlo\" como completar treinta días, y la mayoría dejaba de lado las diferencias de horizonte, mientras que los hanafíes y los shafiíes las tenían en cuenta. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8556} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8557} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8558} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8560} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8561}"
  fr: "La vue est ce que l'on voit avec les yeux ou le cœur; lorsqu'elle porte sur des choses matérielles, elle est perçue par l'œil. Le croissant désigne la lune au début de chaque mois lunaire; son observation, ici, consiste à l'apercevoir après le coucher du soleil le vingt-neuvième jour du mois précédent, par une personne dont le témoignage est accepté. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8546} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8547} Les hadiths relatifs à la recherche du croissant et à l'accomplissement du décompte des trente jours pendant sa période d'obscurité en constituent le fondement; la recherche est particulièrement recommandée le trentième jour de Sha'ban, du Ramadan et de Dhu al-Qa'da, car le jeûne, le pèlerinage et les deux fêtes de l'Aïd en dépendent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8547} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8548} L'observation est prouvée par un rapport collectif excluant toute collusion, par deux témoins justes, ou, pour le début du Ramadan, par un seul témoin juste selon les écoles hanafite, chaféite et hanbalite; les malikites n'acceptent pas un seul témoin. Pour les autres mois, la plupart des juristes exigent deux témoins justes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8551} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8552} Un croissant vu de jour est controversé: s'il appartient à la nuit précédente ou à la nuit à venir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8553} La plupart des juristes n'acceptaient pas le calcul astronomique pour prouver le mois, lisaient l'expression « l'estimer » comme complétant trente jours, et la majorité mettait de côté les différences d'horizon, tandis que les Hanafites et les Shafi'ites les prenaient en compte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8557} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8560} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8561}"
  tr: "Gözlem göz ve kalple yapılır ve önemli kişilere eklendiğinde görme yoluyla yapılır. Ay ay başındadır ve deneyimine dayananlara göre yirmi dokuzuncu gün gün batımından sonra görülmesini ifade eder. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.8546} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8547} Hilal karanlık olduğu otuz günü gözlem aramak ve tamamlamak için kanıtlar iyi bilinir ve oruç, hac ve bayram namazları bunlarla ilişkili olduğu için Şaban, Ramazan ve Zul al-Qi'dah otuz gecesinde doğrulanır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8547} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8548} Gözlem, çıplak gözle kapsamlı bir koleksiyondan, iki adil kişinin tanıklığıyla ya da Ramazan hilalinde Hanefi, Şafii ve Hanbali'ye göre tek bir adil raporla doğrulanır. Bir tane Malikiler tarafından kabul edilmez ve Ramazan dışında çoğu hukukçu iki adil koşul ister. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8551} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8552} Ay gündüz görülse de, hukukçular bunun geçmiş mi yoksa gelecek gece için mi olduğu konusunda farklı görüştedir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8553} Çoğu hukukçu ayı doğrulamak için astronomik hesaplamaya dayanmadı. Hadisin 'öyle tahmin et' hadisini bekleme süresinin tamamlanması olarak yorumladılar. Bazıları hesaplamayı bilenin hakkı olarak görürken, çoğunluk olay farkını hesaba katmadığını söylerken, Hanefiler ve Şafiiler buna göre değerlendirdi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8557} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8560} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8561}"
  id: "Penglihatan dilakukan dengan mata dan hati, dan ketika ditambahkan ke tokoh-tokoh, itu melalui penglihatan. Bulan sabit terjadi di awal bulan, dan merujuk pada pelihatannya setelah matahari terbenam pada hari kedua puluh sembilan, menurut mereka yang pengalamannya diandalkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8546} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8547} Bukti untuk mencari pengamatan dan menyelesaikan tiga puluh hari ketika bulan sabit gelap sudah dikenal luas, dan dikonfirmasi pada tiga puluh malam Sha'ban, Ramadan, dan Dhu al-Qi'dah karena puasa, ziarah, dan shalat Idul Fitri terkait dengannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8547} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8548} Penampakan dikonfirmasi dengan mata telanjang dari koleksi komprehensif, atau oleh kesaksian dua orang yang adil, atau oleh satu laporan adil di bulan sabit Ramadan menurut Hanafi, Shafi'i, dan Hanbali. Satu tidak diterima oleh Maliki, dan di luar Ramadan, kebanyakan ahli hukum mensyaratkan dua syarat yang adil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8551} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8552} Meskipun bulan sabit terlihat pada siang hari, para ahli hukum berbeda pendapat apakah itu untuk masa lalu atau malam yang akan datang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8553} Mayoritas ahli hukum tidak mengandalkan perhitungan astronomi untuk mengonfirmasi bulan. Mereka menafsirkan hadits 'jadi memperkirakannya' sebagai penyelesaian masa tunggu. Beberapa menganggap perhitungan itu hak orang yang mengetahuinya, sementara mayoritas mengatakan tidak memperhitungkan perbedaan kejadian, sementara Hanafi dan Shafi'i menganggapnya sesuai. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8557} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8560} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8561}"
