id: concept/ruyat-hilal-fiqh
class: concept
kind: legal
label:
  ar: "رؤية الهلال"
  en: "Sighting the crescent (ru'yat al-hilal): how the start and end of the lunar month are proved"
  ur: "رؤیت ہلال"
summary:
  ar: "الرؤية بالعين والقلب، وإذا أضيفت إلى الأعيان كانت بالبصر، والهلال القمر في أوائل الشهر، ويُعنى برؤيته مشاهدته بعد غروب شمس التاسع والعشرين ممن يُعتمد خبره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8546} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8547} والأدلة على طلب الرؤية وإكمال العدة ثلاثين إذا غُمّ الهلال مشهورة، وتتأكد عند ليالي الثلاثين من شعبان ورمضان وذي القعدة لأن بها يتعلق الصوم والحج والعيدان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8547} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8548} وتثبت الرؤية بالعين من جمع مستفيض، أو بشهادة عدلين، أو بخبر العدل الواحد في هلال رمضان عند الحنفية والشافعية والحنابلة، ولا يُقبل الواحد عند المالكية، وفي غير رمضان يُشترط عند أكثر الفقهاء عدلان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8551} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8552} وإن رُئي الهلال نهارا اختلف الفقهاء في كونه لليلة الماضية أو المقبلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8553} ولم يعتمد جمهور الفقهاء الحساب الفلكي في إثبات الشهر، وفسروا حديث «فاقدروا له» بإتمام العدة، واعتبر بعضهم الحساب في حق العارف به، وقال الجمهور بعدم اعتبار اختلاف المطالع، وقال الحنفية والشافعية باعتبارها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8557} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8560} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8561}"
  en: "Sight is seeing with the eye or the heart; when it takes material things as its object it is by the eye. The crescent means the moon at the start of each lunar month; its sighting here is the seeing of it after sunset on the twenty-ninth of the previous month by someone whose report is accepted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8546} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8547} The hadiths on seeking the crescent and completing the count of thirty days when it is hidden are the basis; the search is urged most on the thirtieth of Sha'ban, Ramadan and Dhu al-Qa'da, because fasting and the pilgrimage and both Eids depend on them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8547} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8548} Sighting is proved by a mass report that rules out collusion, by two just witnesses, or, for Ramadan's start, by a single just witness according to the Hanafis, Shafi'is and Hanbalis; the Malikis do not accept a single witness. For other months most jurists require two just men. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8551} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8552} A crescent seen in daylight is disputed: whether it belongs to the night before or the coming night. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8553} Most jurists did not accept reckoning by astronomy to prove the month, read the phrase \"estimate it\" as completing thirty days, and the majority set aside differences of horizon, while the Hanafis and Shafi'is take them into account. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8557} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8560} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8561}"
  ur: "رؤیت ہلال سے مراد چاند دیکھنا ہے؛ رمضان، شوال اور ذوالحجہ کے آغاز کا ثبوت گواہی، خبر اور اکمال عدد سے ہوتا ہے، اور فقہاء کی آراء اس بارے میں مختلف ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8546} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8549}"
