label:
  fr: "Poule et coq (dajaj wa dik)"
  ar: "دجاج وديك"
  en: "Chicken and rooster (dajaj wa dik)"
  ur: "مرغی اور مرغا"
summary:
  fr: "Poule et coq, tous deux connus. Le bouillon de vieux coqs possède les propriétés décrites par l'ouvrage. Le meilleur coq n'a pas encore chanté, la meilleure poule n'a pas encore pondu ; les vieux sont médiocres. Le bouillon de coq convient au tremblement et aux douleurs articulaires, aide contre l'asthme, la colique et les fièvres chroniques ; la chair du jeune poulet accroît l'intelligence et, selon l'ouvrage, la semence {cite:canon-ibn-sina-print-v1 p.436}."
  ar: "معروفان، ومرقة الديوك العتيقة لها خواص. أجود الديكة ما لم يصقع بعد، وأجود الدجاج ما لم تبض، والعتيق رديء. مرقة الديك توافق الرعشة ووجع المفاصل وتنفع الربو والقولنج والحميات المزمنة، ولحم الدجاج الفتي يزيد في العقل، ويُذكر أنه يزيد في المني {cite:canon-ibn-sina-print-v1 p.436}."
  en: "Chicken and rooster, both known. The broth of old roosters has properties the book describes. The best rooster is one that has not yet crowed, and the best hen one that has not yet laid; the old is poor. Cock broth suits tremor and joint pain, helps asthma, colic and chronic fevers; the flesh of young chicken increases intelligence, and the book says it increases semen {cite:canon-ibn-sina-print-v1 p.436}."
  ur: "مرغی اور مرغا، دونوں معروف ہیں؛ پرانے مرغ کا شوربہ خاصیتیں رکھتا ہے جو کتاب بیان کرتی ہے۔ بہترین مرغا وہ ہے جس نے ابھی بانگ نہ دی ہو، اور بہترین مرغی وہ جو ابھی انڈے نہ دیتی ہو؛ پرانی ناقص ہے۔ مرغ کا شوربہ رعشہ اور جوڑوں کے درد میں، دمہ، قولنج اور پرانے بخاروں میں مفید ہے؛ کم عمر مرغی کا گوشت عقل بڑھاتا ہے اور کتاب کے مطابق منی بڑھاتا ہے {cite:canon-ibn-sina-print-v1 p.436}۔"
