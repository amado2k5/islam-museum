label: { ar: "الفصد مع ضعف القوة وضيق الشق وسعته عند ابن سينا", en: "Venesection with weak strength and the width of the incision in the Canon", ur: "قانون میں کمزور قوت میں فصد اور شگاف کی تنگی اور کشادگی" , fr: "Faiblesse des forces et largeur de l'incision dans le Canon" }
summary:
  fr: "Ibn Sina explique comment procéder lorsque la saignée est inévitable malgré la faiblesse des forces. Il oppose ensuite l'incision étroite, qui préserve les forces, à l'incision large, qui provoque plus vite la défaillance et purifie davantage, et précise ce qui convient en hiver et en été ainsi que la position du malade {cite:canon-ibn-sina-print-v1 p.291}."
  ar: "يبين ابن سينا ما يفعل إذا اضطر إلى الفصد مع ضعف القوة، ثم يقابل بين الفصد الضيق الذي يحفظ القوة والفصد الواسع الأسرع إلى الغشي والأعمل في التنقية، ويذكر ما يوافق الشتاء والصيف ووضع المفصود {cite:canon-ibn-sina-print-v1 p.291}."
  en: "Ibn Sina says what is done when bleeding is unavoidable though strength is weak, then sets the narrow incision, which keeps strength, against the wide incision, which is quicker to bring faintness and works more in cleansing, and gives what suits winter and summer and the position of the patient {cite:canon-ibn-sina-print-v1 p.291}."
