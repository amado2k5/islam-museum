label: { ar: "الفصد مع ضعف القوة وضيق الشق وسعته عند ابن سينا", en: "Venesection with weak strength and the width of the incision in the Canon", ur: "قانون میں کمزور قوت میں فصد اور شگاف کی تنگی اور کشادگی", es: "Venosección con poca fuerza y ancho de incisión en el Canon", fr: "Veinage avec une faible force et la largeur de l'incision dans le Canon" }
summary:
  ar: "يبين ابن سينا ما يفعل إذا اضطر إلى الفصد مع ضعف القوة، ثم يقابل بين الفصد الضيق الذي يحفظ القوة والفصد الواسع الأسرع إلى الغشي والأعمل في التنقية، ويذكر ما يوافق الشتاء والصيف ووضع المفصود {cite:canon-ibn-sina-print-v1 p.291}."
  en: "Ibn Sina says what is done when bleeding is unavoidable though strength is weak, then sets the narrow incision, which keeps strength, against the wide incision, which is quicker to bring faintness and works more in cleansing, and gives what suits winter and summer and the position of the patient {cite:canon-ibn-sina-print-v1 p.291}."
  es: "Ibn Sina dice que cuando el sangrado es inevitable aunque la fuerza sea débil, se contrapone la incisión estrecha, que mantiene la fuerza, a la incisión ancha, que provoca un desmayo más rápido y trabaja más en la limpieza, y se da lo que se adapta al invierno y al verano y a la posición del paciente {cite:canon-ibn-sina-print-v1 p.291}."
  fr: "Ibn Sina explique ce qu'il faut faire lorsque le saignement est inévitable malgré la faiblesse du patient: il oppose l'incision étroite, qui préserve la force, à l'incision large, qui provoque plus rapidement l'évanouissement et agit davantage sur le nettoyage, et donne ce qui convient à l'hiver et à l'été et à la position du patient {cite:canon-ibn-sina-print-v1 p.291}."
