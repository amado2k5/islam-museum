label: { ar: "إقراء", en: "Iqra' (teaching and reciting to others)" }
summary:
  ar: "الإقراء لغة الحمل على القراءة، ولا يخرج استعمال الفقهاء عن هذا المعنى، سواء كان بقصد الاستماع والذكر أم بقصد التعليم والحفظ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3184} والقراءة والتلاوة بمعنى واحد، والغالب في التلاوة أن تكون للقرآن. والمدارسة أن يقرأ الشخص على غيره ويقرأ غيره عليه، والإدارة أن يقرأ بعض الجماعة قطعة ثم يقرأ غيرهم ما بعدها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3184} والإقراء بقصد الذكر واستماع القرآن، وخاصة ممن كان صوته حسنا، مستحب، ويستدل لذلك بخبر عن ابن مسعود طلب فيه النبي أن يقرأ عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3184} والإقراء بقصد التعليم والحفظ من فروض الكفاية، وهو القيام بعلوم الشرع ممن هو أهل له، وتتعلق به أحكام منها أخذ الأجرة عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3184} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3185}"
  en: "Iqra' means causing another to read, and the jurists keep this lexical sense, whether the aim is listening and remembrance or teaching and memorisation. Reading and recitation (qira'a and tilawa) mean the same, and recitation is most often used for the Qur'an. Mudarasa is two people reading to each other in turn; idara is a group reading a portion each in turn. Causing someone to recite for the purpose of remembrance and listening to the Qur'an, especially from a person with a good voice, is recommended, and the jurists cite a report about Ibn Mas'ud in which the Prophet asked him to recite to him. Iqra' for teaching and memorisation is a communal obligation (fard kifaya) on those qualified to carry the religious sciences, and it carries rulings such as taking payment for it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3184} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3185}"
