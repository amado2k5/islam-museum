  en: "Tarsim (restriction of a person's movement)"
  ur: "ترسیم (کسی کی نقل و حرکت پر پابندی)"
summary:
  ar: "الترسيم في اصطلاح الفقهاء التضييق على الشخص وتحديد حركته بحيث لا يستطيع الذهاب من مكان إلى آخر. ولا تجوز الشهادة على إقرار المحبوس وذي الترسيم، لوجود أمارة الإكراه، ولا يصح إقرارهما بحق يوجب العقوبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4963}"
  en: "In the jurists' usage tarsim is narrowing a person's freedom and limiting his movement so that he cannot go from one place to another. Testimony to the confession of one who is imprisoned or under tarsim is not accepted, since coercion is presumed, and his confession of a right that carries a penalty is not valid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4963}"
