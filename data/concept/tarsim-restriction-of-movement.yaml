id: concept/tarsim-restriction-of-movement
class: concept
kind: legal
label:
  ar: "الترسيم"
  en: "Tarsim (restriction of a person's movement)"
  ur: "ترسیم ⁦(کسی کی نقل و حرکت پر پابندی)⁩"
  es: "Tarsim (restricción de la libertad de movimiento de una persona)"
  fr: "Tarsim (restriction des mouvements d'une personne)"
summary:
  ar: "الترسيم في اصطلاح الفقهاء التضييق على الشخص وتحديد حركته بحيث لا يستطيع الذهاب من مكان إلى آخر. ولا تجوز الشهادة على إقرار المحبوس وذي الترسيم، لوجود أمارة الإكراه، ولا يصح إقرارهما بحق يوجب العقوبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4963}"
  en: "In the jurists' usage tarsim is narrowing a person's freedom and limiting his movement so that he cannot go from one place to another. Testimony to the confession of one who is imprisoned or under tarsim is not accepted, since coercion is presumed, and his confession of a right that carries a penalty is not valid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4963}"
  es: "En el uso de los juristas, el tarsim consiste en restringir la libertad de una persona y limitar su movimiento, impidiéndole desplazarse de un lugar a otro. El testimonio de la confesión de quien se encuentra encarcelado o bajo tarsim no se acepta, puesto que se presume la coacción, y su confesión de un derecho que conlleva una pena no es válida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4963}"
  fr: "Selon la terminologie juridique, le tarsim consiste à restreindre la liberté d'une personne et à limiter ses déplacements, l'empêchant ainsi d'aller d'un endroit à un autre. Le témoignage relatif aux aveux d'une personne emprisonnée ou soumise au tarsim n'est pas recevable, car la contrainte est présumée et l'aveu d'un droit passible de sanctions est invalide. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4963}"
