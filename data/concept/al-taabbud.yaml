id: concept/al-taabbud
class: concept
kind: doctrine
label: { ar: "التعبّد وطاعة الأمر", en: "Ta'abbud (obedience to a command as worship)" }
summary:
  ar: "التعبّد عند الشعراوي أن يُفعل الأمر الشرعي لأن الله أمر به، لا لعلة دنيوية ظاهرة. ويستدل بتحويل القبلة وبعدد الصلوات على أن القدسية في الكعبة وبيت المقدس لأمر الله فيهما لا لذاتهما. {cite:tafsir-sharawi-khawatir-scan p.510}{cite:tafsir-sharawi-khawatir-scan p.513}"
  en: "Ta'abbud, in Sha'rawi's account, is to carry out a legal command because God commanded it, not because of an apparent worldly reason. He takes the change of qibla and the number of daily prayers as showing that the sanctity of the Ka'ba and of Jerusalem lies in God's command and not in the places themselves. {cite:tafsir-sharawi-khawatir-scan p.510}{cite:tafsir-sharawi-khawatir-scan p.513}"
wings: [ideas]
themes: [worship-and-the-pillars, scripture-and-its-sciences]
periods: [period/prophetic-era]
regions: [global]
issue:
  ar: "هل تُفهم أحكام العبادات بعللها الظاهرة، أم تُتبع لأن الله أمر بها؟"
  en: "Should acts of worship be understood through their visible reasons, or followed because God commanded them?"
perspectives:
  - tradition: sunni
    id: sunni-sharawi-command-as-ground
    stance:
      ar: "الأمر الإلهي هو الحيثية التي يُتبع بها الحكم، ولا قدسية لمكان في ذاته"
      en: "God's command is the ground for following the ruling; no place is sacred in itself"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن المؤمن يصلي خمس مرات دون أن يسأل لماذا خمس، وأن القبلة كذلك طاعة لأمر الله لا اعتقاداً بأن الله في مكان بعينه. ويرى أن الكعبة صارت بيت الله باختياره لها، وأن كل المساجد بيوت الله باختيار الخلق. {cite:tafsir-sharawi-khawatir-scan p.510}{cite:tafsir-sharawi-khawatir-scan p.513}"
      en: "Sha'rawi holds that the believer prays five times a day without asking why five, and faces the qibla in obedience rather than from belief that God is in one place. He says the Ka'ba is God's house by God's choice, while every mosque is God's house by the choice of its builders {cite:tafsir-sharawi-khawatir-scan p.510}{cite:tafsir-sharawi-khawatir-scan p.513}."
    sources: [source/tafsir-sharawi-khawatir-scan]
  - tradition: sunni
    id: sunni-scope-note
    stance:
      ar: "ما زال الرأي الآخر في تعليل الأحكام دون مصدر في هذه الدفعة"
      en: "The other view on giving reasons for rulings is not yet entered from a source"
    holders: []
    summary:
      ar: "لم تُدخل في هذه الدفعة أقوال علماء أصول الفقه في تعليل الأحكام وعدمه، ولا الرأي الأكاديمي ولا الآراء الأخرى. {cite:tafsir-sharawi-khawatir-scan p.510}"
      en: "This block does not yet enter the usul scholars' positions on whether rulings have reasons, nor the academic or other views."
    sources: [source/tafsir-sharawi-khawatir-scan]
