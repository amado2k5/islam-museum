id: concept/ayyam-al-arab
class: concept
kind: term
label:
  ar: "أيام العرب"
  en: "Days of the Arabs (Ayyam al-'Arab)"
  fr: "Les Jours des Arabes (Ayyam al-'Arab)"
  ur: "ایام العرب"
  es: "Días de los árabes (Ayyam al-'Arab)"
summary:
  ar: "اسم الوقائع التي خاضتها القبائل العربية في ما بينها في الجاهلية وأحياناً في صدر الإسلام، وأغلبها مناوشات بين أسر قليلة؛ وقد حُفظت أخبارها في الأيام المكتوبة بنثر عربي قديم وفي المجاميع المتأخرة {cite:encyclopaedia-of-islam-2 vol. 1 p. 842}."
  en: "The name for the combats the Arab tribes fought amongst themselves in the pre-Islamic era, and sometimes in early Islam. Most were skirmishes between a few families; the accounts survive in old Arabic prose and in later compilations {cite:encyclopaedia-of-islam-2 vol. 1 p. 842}."
  fr: "Nom donné aux combats que les tribus arabes se livrèrent avant l’islam, et parfois aux débuts de l’islam. Il s’agissait surtout d’escarmouches entre quelques familles ; leurs récits subsistent dans la prose arabe ancienne et les compilations ultérieures {cite:encyclopaedia-of-islam-2 vol. 1 p. 842}."
  es: "Nombre que recibían las luchas entre las tribus árabes en la época preislámica, y a veces en los inicios del Islam. La mayoría eran escaramuzas entre unas pocas familias; los relatos se conservan en prosa árabe antigua y en compilaciones posteriores {cite:encyclopaedia-of-islam-2 vol. 1 p. 842}."
  ur: "ان لڑائیوں کا نام ہے جو عرب قبائل قبل از اسلام اور بعض اوقات ابتدائی اسلام میں آپس میں لڑتے تھے۔ زیادہ تر چند خاندانوں کے درمیان جھگڑے تھے۔ پرانے عربی نثر اور بعد کی تالیفات میں اکاؤنٹس زندہ ہیں {حوالہ: انسائیکلوپیڈیا-آف-اسلام-2 جلد۔ 1 ص۔ 842}۔"
