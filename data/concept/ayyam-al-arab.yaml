summary:
  ar: "اسم الوقائع التي خاضتها القبائل العربية في ما بينها في الجاهلية وأحياناً في صدر الإسلام، وأغلبها مناوشات بين أسر قليلة؛ وقد حُفظت أخبارها في الأيام المكتوبة بنثر عربي قديم وفي المجاميع المتأخرة {cite:encyclopaedia-of-islam-2 vol. 1 p. 842}."
  en: "The name for the combats the Arab tribes fought amongst themselves in the pre-Islamic era, and sometimes in early Islam. Most were skirmishes between a few families; the accounts survive in old Arabic prose and in later compilations {cite:encyclopaedia-of-islam-2 vol. 1 p. 842}."
