summary:
  ar: "الحنث في اللغة الذنب العظيم والإثم، وفي الاصطلاح مخالفة اليمين، أي أن يخالف الحالف ما حلف عليه فتلزمه الكفارة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7332} والبر في اليمين الموافقة لما حلف عليه، والنكث والنقض والخلف ألفاظ قريبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7333} ويتبع الحنث حكم المحلوف عليه: فإن حلف على واجب أو ترك حرام كانت يمينه طاعة وحنثه معصية وتجب الكفارة بالحنث؛ وإن حلف على ترك واجب أو فعل حرام فيجب الحنث والكفارة عند الجمهور؛ وإن حلف على نفل أو مباح فلكل حكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7333} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7334} ويستحب الحنث والتكفير إذا رأى الحالف غير يمينه خيرا منها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7334} ولا حنث إلا في اليمين المنعقدة على المستقبل، ويمين الماضي الغموس عند الجمهور لا كفارة فيها، واليمين اللغو لا حنث فيها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7334}  وتجب الكفارة على من حنث في يمين منعقدة، والسبب عند الحنفية والمالكية والحنابلة هو اليمين والحنث شرط، وعند الشافعية هما معا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7335} ويجوز التكفير قبل الحنث عند المالكية والشافعية والحنابلة، ولا يجوز عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7335} ويقع الحنث في الإثبات بعد اليأس من البر، وفي النفي بالفعل، وفي المؤقتة بآخر وقتها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7335} والناسي عند الجمهور لا يحنث، والمكره يحنث في الإكراه غير الملجئ، والحنفية يحنثون الناسي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7336}"
  en: "Hanth lexically is a great sin and wrong-doing; technically it is breaking an oath, so that a swearer who does not do what he swore to do owes expiation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7332} Barr is keeping an oath, and naqd, nakth and khulf are related words. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7333} The ruling on breaking follows the thing sworn to: an oath to do what is obligatory or to abstain from what is forbidden must be kept and breaking it is sin; an oath to abandon an obligation or do a forbidden act must be broken with expiation by the majority; the recommended and the permitted each follow their own rule. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7333} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7334} Breaking an oath and atoning is recommended when one sees a better course than what was sworn. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7334} Breaking applies only to a binding oath about the future; the majority hold the oath about the past, the perjurious oath, carries no expiation, and the idle oath cannot be broken. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7334}  Expiation is owed by one who breaks a binding oath; the Hanafis, Malikis and Hanbalis take the oath as the cause and the breach as a condition, while the Shafiis take both. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7335} Expiation before breaking is allowed by the Malikis, Shafiis and Hanbalis but not by the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7335} A positive oath is broken only when the chance of keeping it is gone, a negative one by the act itself, and a timed oath at the end of its time. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7335} The majority do not hold a forgetful swearer to breach, the coerced breaches only if the coercion is not overpowering, and the Hanafis hold the forgetful to breach. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7336}"
  ur: "حنث لغت میں بڑے گناہ اور جرم کو کہتے ہیں، اور اصطلاح میں قسم توڑنا، یعنی قسم کھانے والا جس بات کی قسم کھائی اس کے خلاف کرے تو اس پر کفارہ لازم ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7332} برّ قسم کے مطابق عمل کو کہتے ہیں، اور نکث، نقض اور خلف قریب الفاظ ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7333} حنث کا حکم اس فعل کے تابع ہے جس کی قسم کھائی گئی: واجب یا ترکِ حرام کی قسم کو پورا کرنا لازم ہے اور توڑنا گناہ ہے؛ واجب کے ترک یا حرام کے ارتکاب کی قسم جمہور کے نزدیک توڑنا اور کفارہ دینا لازم ہے؛ نفل اور مباح کا حکم اپنے اپنے درجے کے مطابق ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7333} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7334} اگر قسم کھانے والا اس قسم کے سوا کوئی بہتر بات دیکھے تو قسم توڑ کر کفارہ دینا مستحب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7334} حنث صرف مستقبل پر منعقد ہونے والی قسم میں ہوتا ہے؛ جمہور کے نزدیک ماضی کی جھوٹی قسم (غموس) میں کفارہ نہیں، اور لغو قسم توڑی نہیں جاتی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7334}  جس نے منعقد ہونے والی قسم توڑی اس پر کفارہ واجب ہے؛ حنفیہ، مالکیہ اور حنابلہ کے نزدیک سبب قسم ہے اور حنث شرط ہے، جبکہ شافعیہ کے نزدیک دونوں سبب ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7335} مالکیہ، شافعیہ اور حنابلہ کے نزدیک حنث سے پہلے کفارہ جائز ہے، حنفیہ کے نزدیک جائز نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7335} اثبات کی قسم میں حنث نیکی کے ناممکن ہونے کے بعد ہوتا ہے، نفی کی قسم میں فعل سے، اور موقت قسم میں اس کے آخری وقت پر۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7335} جمہور کے نزدیک بھولنے والا حانث نہیں ہوتا، جبری فعل میں غیر ملجئ جبر پر حنث ہوتا ہے، اور حنفیہ بھولنے والے کو بھی حانث کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7336}"
