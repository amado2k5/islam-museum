label: { ar: "الحنث", en: "Hanth (breaking an oath)", ur: "حنث ⁦(قسم توڑنا)⁩", es: "Hanth (romper un juramento)", fr: "Hanth (violation d'un serment)", tr: "Detaylılık", id: "Kekhianatan" }
summary:
  ar: "الحنث في اللغة الذنب العظيم والإثم، وفي الاصطلاح مخالفة اليمين، أي أن يخالف الحالف ما حلف عليه فتلزمه الكفارة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7332} والبر في اليمين الموافقة لما حلف عليه، والنكث والنقض والخلف ألفاظ قريبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7333} ويتبع الحنث حكم المحلوف عليه: فإن حلف على واجب أو ترك حرام كانت يمينه طاعة وحنثه معصية وتجب الكفارة بالحنث؛ وإن حلف على ترك واجب أو فعل حرام فيجب الحنث والكفارة عند الجمهور؛ وإن حلف على نفل أو مباح فلكل حكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7333} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7334} ويستحب الحنث والتكفير إذا رأى الحالف غير يمينه خيرا منها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7334} ولا حنث إلا في اليمين المنعقدة على المستقبل، ويمين الماضي الغموس عند الجمهور لا كفارة فيها، واليمين اللغو لا حنث فيها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7334}  وتجب الكفارة على من حنث في يمين منعقدة، والسبب عند الحنفية والمالكية والحنابلة هو اليمين والحنث شرط، وعند الشافعية هما معا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7335} ويجوز التكفير قبل الحنث عند المالكية والشافعية والحنابلة، ولا يجوز عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7335} ويقع الحنث في الإثبات بعد اليأس من البر، وفي النفي بالفعل، وفي المؤقتة بآخر وقتها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7335} والناسي عند الجمهور لا يحنث، والمكره يحنث في الإكراه غير الملجئ، والحنفية يحنثون الناسي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7336}"
  en: "Hanth lexically is a great sin and wrong-doing; technically it is breaking an oath, so that a swearer who does not do what he swore to do owes expiation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7332} Barr is keeping an oath, and naqd, nakth and khulf are related words. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7333} The ruling on breaking follows the thing sworn to: an oath to do what is obligatory or to abstain from what is forbidden must be kept and breaking it is sin; an oath to abandon an obligation or do a forbidden act must be broken with expiation by the majority; the recommended and the permitted each follow their own rule. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7333} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7334} Breaking an oath and atoning is recommended when one sees a better course than what was sworn. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7334} Breaking applies only to a binding oath about the future; the majority hold the oath about the past, the perjurious oath, carries no expiation, and the idle oath cannot be broken. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7334}  Expiation is owed by one who breaks a binding oath; the Hanafis, Malikis and Hanbalis take the oath as the cause and the breach as a condition, while the Shafiis take both. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7335} Expiation before breaking is allowed by the Malikis, Shafiis and Hanbalis but not by the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7335} A positive oath is broken only when the chance of keeping it is gone, a negative one by the act itself, and a timed oath at the end of its time. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7335} The majority do not hold a forgetful swearer to breach, the coerced breaches only if the coercion is not overpowering, and the Hanafis hold the forgetful to breach. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7336}"
  ur: "حنث لغت میں بڑے گناہ اور جرم کو کہتے ہیں، اور اصطلاح میں قسم توڑنا، یعنی قسم کھانے والا جس بات کی قسم کھائی اس کے خلاف کرے تو اس پر کفارہ لازم ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7332} برّ قسم کے مطابق عمل کو کہتے ہیں، اور نکث، نقض اور خلف قریب الفاظ ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7333} حنث کا حکم اس فعل کے تابع ہے جس کی قسم کھائی گئی: واجب یا ترکِ حرام کی قسم کو پورا کرنا لازم ہے اور توڑنا گناہ ہے؛ واجب کے ترک یا حرام کے ارتکاب کی قسم جمہور کے نزدیک توڑنا اور کفارہ دینا لازم ہے؛ نفل اور مباح کا حکم اپنے اپنے درجے کے مطابق ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7333} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7334} اگر قسم کھانے والا اس قسم کے سوا کوئی بہتر بات دیکھے تو قسم توڑ کر کفارہ دینا مستحب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7334} حنث صرف مستقبل پر منعقد ہونے والی قسم میں ہوتا ہے؛ جمہور کے نزدیک ماضی کی جھوٹی قسم ⁦(غموس)⁩ میں کفارہ نہیں، اور لغو قسم توڑی نہیں جاتی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7334}  جس نے منعقد ہونے والی قسم توڑی اس پر کفارہ واجب ہے؛ حنفیہ، مالکیہ اور حنابلہ کے نزدیک سبب قسم ہے اور حنث شرط ہے، جبکہ شافعیہ کے نزدیک دونوں سبب ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7335} مالکیہ، شافعیہ اور حنابلہ کے نزدیک حنث سے پہلے کفارہ جائز ہے، حنفیہ کے نزدیک جائز نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7335} اثبات کی قسم میں حنث نیکی کے ناممکن ہونے کے بعد ہوتا ہے، نفی کی قسم میں فعل سے، اور موقت قسم میں اس کے آخری وقت پر۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7335} جمہور کے نزدیک بھولنے والا حانث نہیں ہوتا، جبری فعل میں غیر ملجئ جبر پر حنث ہوتا ہے، اور حنفیہ بھولنے والے کو بھی حانث کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7336}"
  es: "Hanth léxicamente es un gran pecado y una mala acción; técnicamente es romper un juramento, por lo que un juramentado que no hace lo que juró hacer debe expiación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7332} Barr es cumplir un juramento, y naqd, nakth y khulf son palabras relacionadas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7333} La regla sobre romper sigue a lo jurado: un juramento de hacer lo que es obligatorio o de abstenerse de lo prohibido debe cumplirse y romperlo es pecado; un juramento de abandonar una obligación o hacer un acto prohibido debe romperse con expiación por la mayoría; lo recomendado y lo permitido siguen cada uno su propia regla. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7333} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7334} Romper un juramento y expiarlo es recomendable cuando uno ve un mejor camino que el que fue jurado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7334} Romper se aplica solo a un juramento vinculante sobre el futuro; la mayoría sostiene que el juramento sobre el pasado, el juramento perjuro, no conlleva expiación, y el juramento ocioso no puede romperse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7334} Quien rompe un juramento vinculante debe expiar; los hanafíes, malikíes y hanbalíes toman el juramento como la causa y la ruptura como la condición, mientras que los shafiíes toman ambos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7335} La expiación antes de romper un juramento está permitida por los malikíes, shafiíes y hanbalíes, pero no por los hanafíes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7335} Un juramento positivo se rompe solo cuando se pierde la posibilidad de cumplirlo, uno negativo por el acto mismo, y un juramento con límite de tiempo al final de su plazo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7335} La mayoría no considera que un juramentado olvidadizo haya roto su promesa, el que es forzado lo hace solo si la coacción no es excesiva, y los hanafíes consideran que el olvidadizo lo hace. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7336}"
  fr: "Le terme « hanth » désigne lexicalement un péché grave et une faute importante; il s’agit, techniquement, de la violation d’un serment, de sorte que celui qui a prêté serment et ne respecte pas son engagement doit expier. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7332} « Barr » signifie tenir un serment, et les termes « naqd », « nakth » et « khulf » sont apparentés. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7333} La règle concernant la violation d’un serment dépend de l’objet du serment: un serment d’accomplir une obligation ou de s’abstenir d’un interdit doit être respecté, et sa violation constitue un péché; un serment d’abandonner une obligation ou de commettre un acte interdit doit être rompu, avec expiation à la majorité; les serments recommandés et permis sont chacun soumis à leur propre règle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7333} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7334} Il est recommandé de rompre un serment et de s'en repentir lorsqu'on entrevoit une meilleure voie que celle qui a été empruntée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7334} La rupture ne s'applique qu'à un serment engageant concernant l'avenir; la majorité considère que le serment concernant le passé, le faux serment, n'entraîne aucune expiation, et le serment vain ne peut être rompu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7334} Celui qui rompt un serment engageant doit s'acquitter d'une expiation. Les écoles hanafite, malikite et hanbalite considèrent le serment comme la cause et sa violation comme une condition, tandis que l'école chaféite considère les deux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7335} L'expiation avant la violation est autorisée par les écoles malikite, chaféite et hanbalite, mais pas par l'école hanafite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7335} Un serment positif n'est rompu que lorsque toute possibilité de le respecter disparaît, un serment négatif par l'acte lui-même, et un serment à durée déterminée à l'expiration de son délai. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7335} La majorité des écoles de pensée n'exige pas la violation d'un serment par simple oubli, la violation par contrainte uniquement si la contrainte n'est pas excessive, et l'école hanafite exige la violation par simple oubli. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7336}"
  tr: "Dilbilimde, kırmak büyük bir günah ve günahtır; terminolojide ise yemin ihlalidir; yani yemin eden kişi yemini bozarsa kefaret ödemek zorundadır. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.7332} Ve yeminde doğruluk, yemin edilene uyum sağlamak anlamına gelir; yemini bozmak, iptal etmek ve geri çevirmek ilgili terimlerdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7333} Yemin eden kişinin hükümünü ihlal eder: zorunlu veya yasak bir eyleme yemin ederse, yemin itaattir, bozması günahtır ve kefaret kanunu çiğneyerek yapılır; zorunlu bir görevi veya yasak bir eylemi ihmal etmeye yemin ederse, çoğunluğa göre bozma ve kefaret zorunludur; gönüllü veya izin verilen bir eylemle yemin ederse, her karar için bir karar vardır. {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s. 7333} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7334} Yemin eden kişi yemininden daha iyi bir şey görürse dinden dönmek ve imandan dönmek tavsiye edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7334} Gelecekte verilen yeminler dışında bozulma yoktur, çoğunluğa göre batırılan geçmiş yemin kefaret gerektirmez ve boş yemin de bozunmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7334} Sözleşmeli yemini bozan kişi için kefaret zorunludur. Hanefi, Maliki ve Hanbali'lerin nedeni, hem yemin hem de yeminlerin koşullu olmasıdır ve Şafi'lere göre ikisi de vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7335} Maliki, Şafiî ve Hanbali'ye göre kanunu çiğnemeden önce dinden dönmek caizdir, ancak Hanefilere göre değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7335} Kırma, doğruluğun umutsuzluğundan sonra onaylanmada, eylemin reddinde ve eylemin sonunda geçici durumlarda gerçekleşir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7335} Çoğunluğa göre, unutkan kişi kanunu çiğnemez, zorlanan kişi kaçınılmaz bir zorlamayla ve Hanafiler unutkan kişiyi çiğner. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7336}"
  id: "Dalam linguistik, melanggar adalah dosa dan dosa besar, dan dalam terminologi, ini adalah pelanggaran sumpah, artinya jika pelaku sumpah melanggar sumpahnya, ia harus membayar penebusan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7332} Dan kebenaran dalam sumpah berarti kepatuhan terhadap apa yang telah disumpahkan, sementara melanggar sumpah, mencabut, dan mencabut adalah istilah yang terkait. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7333} Pelanggaran mengikuti putusan orang yang bersumpah: jika dia bersumpah atas tindakan wajib atau terlarang, sumpahnya adalah ketaatan, dan pelanggarannya adalah dosa, dan penebusan harus dibayar dengan melanggar hukum; jika dia bersumpah untuk mengabaikan kewajiban atau tindakan terlarang, maka pelanggaran dan penebusan adalah kewajiban menurut mayoritas; jika dia bersumpah atas tindakan sukarela atau yang diperbolehkan, maka ada aturan untuk setiap putusan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm. 7333} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7334} Disarankan untuk melanggar dan menyatakan murtad jika pelaku melihat sesuatu yang lebih baik daripada sumpahnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7334} Tidak ada pelanggaran kecuali dalam sumpah yang diambil di masa depan, dan sumpah masa lalu yang ditanamkan menurut mayoritas tidak memerlukan penebusan, dan sumpah kosong tidak mengandung pelanggaran di dalamnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7334} penebusan wajib bagi seseorang yang melanggar sumpah yang telah dikontrakkan. Alasan untuk Hanafi, Maliki, dan Hanbalis adalah karena baik sumpah maupun sumpah bersyarat, dan menurut para Syafi'i, keduanya adalah bersyarat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7335} Diperbolehkan menyatakan murtad sebelum melanggar hukum menurut Maliki, Shafi'i, dan Hanbali, tetapi tidak menurut Hanafi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7335} Pelanggaran terjadi sebagai penegasan setelah putus asa akan kebenaran, dalam penyangkalan tindakan, dan dalam kasus sementara di akhir zaman. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7335} Menurut mayoritas, orang yang pelupa tidak melanggar hukum, orang yang dipaksa melanggar hukum dengan paksaan yang tak terhindarkan, dan Hanafi melanggar orang yang lupa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7336}"
