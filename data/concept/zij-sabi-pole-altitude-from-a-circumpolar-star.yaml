label: { ar: "ارتفاع القطب برصد كوكب في الدائرة الأبدية الظهور في الزيج الصابي", en: "Finding the pole's altitude from a circumpolar star", ur: "قطب کی بلندی قطبی ستارے کے رصد سے", es: "Cómo determinar la altitud del polo a partir de una estrella circumpolar.", fr: "Déterminer l'altitude du pôle à partir d'une étoile circumpolaire", tr: "Sabean zodyakında yer alan, ebedi çember içindeki bir gezegeni gözlemleyerek kutup noktasının yükselmesi.", id: "Penentuan ketinggian kutub dengan mengamati sebuah planet dalam lingkaran abadi, yang muncul dalam zodiak Sabean." }
summary:
  ar: "يعلّم البتاني طريقة لمعرفة عرض البلد برصد كوكب من الكواكب التي لا تغيب: يؤخذ ارتفاعه الأعظم حين يمر بخط وسط السماء فوق القطب، ثم يُمهل حتى يعبر الخط ذاته تحت القطب فيؤخذ ارتفاعه الأخفض، ثم يُزاد نصف الفرق بين الارتفاعين على الأقل منهما، أو يُؤخذ نصف مجموعهما، فيكون ارتفاع القطب الشمالي وهو عرض الموضع. {cite:zij-sabi-nallino-byblion p.26}."
  en: "Al-Battani teaches how to find a place's latitude by observing one of the never-setting stars: take its greatest altitude as it crosses the midheaven line above the pole, then wait until it crosses the same line below the pole and take its lowest altitude; adding half the difference of the two altitudes to the smaller, or taking half their sum, gives the altitude of the north pole, which is the place's latitude. {cite:zij-sabi-nallino-byblion p.26}."
  ur: "البتانی ان ستاروں میں سے جو غروب نہیں ہوتے کسی ایک کے رصد سے شہر کا عرض معلوم کرنے کا طریقہ سکھاتے ہیں: جب وہ قطب کے اوپر خط وسط السماء سے گزرے تو اس کی سب سے بڑی بلندی لی جائے، پھر انتظار کیا جائے یہاں تک کہ وہ اسی خط سے قطب کے نیچے سے گزرے اور اس کی سب سے کم بلندی لی جائے؛ دونوں بلندیوں کے فرق کا نصف چھوٹی بلندی میں جمع کیا جائے، یا دونوں کے مجموعے کا نصف لیا جائے، تو یہ شمالی قطب کی بلندی ہے اور یہی اس جگہ کا عرض ہے۔ {cite:zij-sabi-nallino-byblion p.26}۔"
  es: "Al-Battani enseña cómo hallar la latitud de un lugar observando una de las estrellas que nunca se ponen: se toma su mayor altitud cuando cruza la línea del medio cielo por encima del polo, luego se espera a que cruce la misma línea por debajo del polo y se toma su menor altitud; sumando la mitad de la diferencia entre ambas altitudes a la menor, o calculando la mitad de su suma, se obtiene la altitud del polo norte, que es la latitud del lugar. {cite:zij-sabi-nallino-byblion p.26}."
  fr: "Al-Battani explique comment déterminer la latitude d'un lieu en observant une étoile qui ne se couche jamais: il faut prendre sa plus haute altitude lorsqu'elle franchit le milieu du ciel au-dessus du pôle, puis attendre qu'elle franchisse ce même milieu en dessous du pôle et prendre sa plus basse altitude; en ajoutant la moitié de la différence entre ces deux altitudes à la plus petite, ou en prenant la moitié de leur somme, on obtient l'altitude du pôle Nord, qui correspond à la latitude du lieu. {cite:zij-sabi-nallino-byblion p.26}."
  tr: "El-Battani, batmayan bir gezegeni gözlemleyerek bir yerin enlemini belirleme yöntemini öğretir: Gezegenin kutup üzerindeki meridyen çizgisinden geçerkenki en yüksek yüksekliği alınır, ardından aynı çizginin kutup altından geçmesi beklenir ve en düşük yüksekliği alınır. Daha sonra iki yükseklik arasındaki farkın yarısı en az birine eklenir veya toplamlarının yarısı alınır ve bu, Kuzey Kutbu'nun yüksekliğidir ve bu da yerin enlemidir. {cite:zij-sabi-nallino-byblion s.26}."
  id: "Al-Battani mengajarkan metode untuk menentukan garis lintang suatu tempat dengan mengamati sebuah planet yang tidak terbenam: ketinggian tertingginya diambil ketika planet tersebut melewati garis meridian di atas kutub, kemudian ditunggu hingga planet tersebut melewati garis yang sama di bawah kutub, dan ketinggian terendahnya diambil. Kemudian setengah dari selisih antara kedua ketinggian tersebut ditambahkan ke setidaknya salah satunya, atau setengah dari jumlah keduanya diambil, dan ini adalah ketinggian Kutub Utara, yang merupakan garis lintang tempat tersebut. {cite:zij-sabi-nallino-byblion p.26}."
