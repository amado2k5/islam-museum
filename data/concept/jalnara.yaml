id: concept/jalnara
class: concept
kind: natural
label:
  ar: "جلّنارا"
  en: "Jalnara (the wild pomegranate flower)"
  ur: "جلنارا ⁦(جنگلی انار کا پھول)⁩"
  es: "Jalnara (la flor silvestre del granado)"
summary:
  ar: "زهرة الرمان البري، فارسية أو مصرية، حمراء وبيضاء؛ باردة يابسة، مغرّ حابس لكل سيلان، تدمل الجراحات، وتنفع اللثة الدامية، وتقوّي الأسنان المتحركة، وتمنع نفث الدم؛ ويذكر الكتاب أنها تنفع من قروح الأمعاء وسيلان الرحم ونزفه {cite:canon-ibn-sina-print-v1 p.423}."
  en: "The flower of the wild pomegranate, Persian or Egyptian, red or white. It is cold and dry, astringent, and stops every flow. It heals wounds, helps bleeding gums, strengthens loose teeth and stops spitting of blood. The book lists it for intestinal ulcers and for flow and bleeding of the womb {cite:canon-ibn-sina-print-v1 p.423}."
  ur: "جنگلی انار کا پھول، فارسی یا مصری، کبھی سرخ اور کبھی سفید۔ یہ ٹھنڈا اور خشک، مغرّ اور ہر سیلان کو روکنے والا ہے؛ زخم بھرتا ہے، خون بہنے والے مسوڑھوں کو فائدہ دیتا ہے، ہلتے دانتوں کو مضبوط کرتا ہے اور خون کی قے روکتا ہے۔ کتاب اسے آنتوں کے زخموں اور رحم کے سیلان اور خون بہنے میں بھی بیان کرتی ہے {cite:canon-ibn-sina-print-v1 p.423}۔"
  es: "La flor del granado silvestre, persa o egipcio, roja o blanca. Es fría y seca, astringente y detiene cualquier sangrado. Cicatriza heridas, alivia el sangrado de las encías, fortalece los dientes flojos y detiene el sangrado vaginal. El libro la menciona para las úlceras intestinales y para el sangrado uterino {cite:canon-ibn-sina-print-v1 p.423}."
