label: { ar: "العنقاء", en: "The 'anqa" }
summary:
  ar: "طائر خلقه الله في الزمان الأول من أحسن الطير ذكراً وأنثى على رواية ابن عباس عند المسعودي، وجهه على مثال وجوه الناس وله أربعة أجنحة من كل جانب ويدان فيهما مخالب ومنقار على صفة العقاب، جعل رزقه في وحش بيت المقدس فتناسل ثم انتقل إلى نجد والحجاز في بلاد قيس عيلان يأكل الوحوش والصبيان حتى دعا عليه خالد بن سنان فقطع الله نسله، ومنه مثل عنقاء مغرب للأمر العجيب النادر والعنق السرعة {cite:muruj-al-dhahab p. 527-528}."
  en: "The 'anqa of Ibn 'Abbas's report — human-faced, four-winged, eagle-beaked, its pair bred at Jerusalem then ravaged Qays 'Aylan's country until Khalid ibn Sinan's prayer ended its line — its name living on in the proverb for the rare marvel {cite:muruj-al-dhahab p. 527-528}."
