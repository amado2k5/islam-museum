label: { ar: "العنقاء", en: "The 'anqa", fr: "L’anqa", es: "El 'anqa", ur: "عنقا" }
summary:
  ar: "طائر خلقه الله في الزمان الأول من أحسن الطير ذكراً وأنثى على رواية ابن عباس عند المسعودي، وجهه على مثال وجوه الناس وله أربعة أجنحة من كل جانب ويدان فيهما مخالب ومنقار على صفة العقاب، جعل رزقه في وحش بيت المقدس فتناسل ثم انتقل إلى نجد والحجاز في بلاد قيس عيلان يأكل الوحوش والصبيان حتى دعا عليه خالد بن سنان فقطع الله نسله، ومنه مثل عنقاء مغرب للأمر العجيب النادر والعنق السرعة {cite:muruj-al-dhahab p. 527-528}."
  en: "The 'anqa of Ibn 'Abbas's report — human-faced, four-winged, eagle-beaked, its pair bred at Jerusalem then ravaged Qays 'Aylan's country until Khalid ibn Sinan's prayer ended its line — its name living on in the proverb for the rare marvel {cite:muruj-al-dhahab p. 527-528}."
  fr: "Dans le récit attribué à Ibn Abbas, l’anqa a un visage humain, quatre ailes et un bec d’aigle. Le couple se multiplie à Jérusalem, puis dévaste le pays de Qays Aylan jusqu’à ce que la prière de Khalid ibn Sinan mette fin à sa lignée. Son nom subsiste dans un proverbe qui désigne une merveille rare {cite:muruj-al-dhahab p. 527-528}."
  es: "El 'anqa del informe de Ibn 'Abbas —con rostro humano, cuatro alas y pico de águila, cuya pareja se crió en Jerusalén y luego asoló el país de Qays 'Aylan hasta que la oración de Khalid ibn Sinan puso fin a su linaje— su nombre perdura en el proverbio para la rara maravilla {cite:muruj-al-dhahab p. 527-528}."
  ur: "ابن عباس کی رپورٹ کا عنقا — انسانی چہرے والا، چار پروں والا، عقاب کی چونچوں والا، اس کا جوڑا یروشلم میں پیدا ہوا پھر قیس ایلان کے ملک کو تباہ کر دیا یہاں تک کہ خالد بن سنان کی دعا نے اس کا سلسلہ ختم کر دیا — اس کا نام نایاب معجزے کے لیے کہاوت میں زندہ ہے۔ 527-528}۔"
