id: concept/heap-sabra
class: concept
kind: legal
label:
  ar: "الصُّبْرة"
  en: "Subra (a heap of goods sold by the whole without measure: its sale, the sale of a sa' from it, and the conditions of validity)"
summary:
  ar: "الصبرة الكومة من الطعام، وأطلقها الفقهاء على كل متماثل الأجزاء. ويصح بيعها جزافا وإن كانت مجهولة الكيل والوزن، بشروط: ألا يغش البائع، وأن تكون متساوية الأجزاء، وأن يرى المشتري المبيع، وأن يجهل المتبايعان القدر. ويصح بيع الصبرة إلا صاعا إن كانت معلومة الصيعان، ولا يصح إن كانت مجهولة، لنهي النبي عن الثنيا. ولا يصح بيع الصبرة كل صاع بدرهم على شرط الزيادة أو النقصان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10281} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10282} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10283} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10284}"
  en: "A subra is a heap of food; the jurists use the word for anything whose parts are alike. Its sale by the whole, without measure, is valid, on conditions: the seller must not cheat by putting poor or wet goods inside, its parts must be alike, the buyer must see it, and both parties must not know its measure. The sale of a heap except one sa' is valid if its sa's are known and void if they are not, since the Prophet forbade the sale of the exception (thunya). Selling a heap at a price per sa' with a condition of adding or taking away a sa' is void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10281} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10282} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10283} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10284}"
