summary:
  ar: "الماء في الكتاب دواء مفرد تختلف أحواله بحسب مصدره، فالبحر والكبريتي والشبي والحديدي والنحاسي والبارد والفاتر لكل منها طبع وخواص ومنافع بحسب الأعضاء {cite:canon-ibn-sina-print-v1 p.557} {cite:canon-ibn-sina-print-v1 p.559}."
  en: "In the book water is a simple remedy whose state varies with its source; sea, sulphur, alum, iron, copper, cold and tepid waters each have a temperament, properties and uses by organ {cite:canon-ibn-sina-print-v1 p.557} {cite:canon-ibn-sina-print-v1 p.559}."
  ur: "کتاب میں پانی ایک مفرد دوا ہے جس کی حالت اس کے منبع کے مطابق بدلتی ہے؛ سمندری، گندھک، پھٹکری، لوہے، تانبے، ٹھنڈے اور نیم گرم پانیوں میں سے ہر ایک کا مزاج، خواص اور اعضاء کے لحاظ سے فوائد ہیں {cite:canon-ibn-sina-print-v1 p.557} {cite:canon-ibn-sina-print-v1 p.559}۔"
  es: "En el libro, el agua es un remedio simple cuyo estado varía según su fuente; el agua de mar, azufre, alumbre, hierro, cobre, fría y tibia tiene cada una un temperamento, propiedades y usos según el órgano {cite:canon-ibn-sina-print-v1 p.557} {cite:canon-ibn-sina-print-v1 p.559}."
  fr: "Dans le livre, l'eau est un remède simple dont l'état varie selon sa source; l'eau de mer, l'eau de soufre, l'eau d'alun, l'eau de fer, l'eau de cuivre, l'eau froide et l'eau tiède ont chacune un tempérament, des propriétés et des usages par organe {cite:canon-ibn-sina-print-v1 p.557} {cite:canon-ibn-sina-print-v1 p.559}."
  tr: "Kitaptaki su, kaynağına göre koşulları değişen tek bir ilaçtır. Deniz, kükürt, el-şabi, demir, bakır, soğuk ve ılık her biri üyelerine göre kendine özgü özellikler, avantajlar ve faydalar taşır {cite:canon-ibn-sina-print-v1 s.557} {cite:canon-ibn-sina-print-v1 s.559}."
  id: "Air dalam buku ini adalah satu obat tunggal yang kondisinya bervariasi tergantung sumbernya. Laut, belerang, al-shabi, besi, tembaga, dingin, dan suam-suam kuku masing-masing memiliki karakteristik, sifat, dan manfaat masing-masing menurut anggotanya {cite:canon-ibn-sina-print-v1 hlm.557} {cite:canon-ibn-sina-print-v1 hlm.559}."
