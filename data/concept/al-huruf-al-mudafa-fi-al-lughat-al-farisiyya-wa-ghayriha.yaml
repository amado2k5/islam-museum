id: concept/al-huruf-al-mudafa-fi-al-lughat-al-farisiyya-wa-ghayriha
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-script]
label:
  ar: "الحروف المضافة في الفارسية وغيرها"
  en: "The letters added in Persian and other languages"
  ur: "فارسی اور دوسری زبانوں میں اضافہ کیے گئے حروف"
  fr: "Les lettres ajoutées en persan et dans d'autres langues"
  es: "Las letras añadidas en persa y otras lenguas"
summary:
  ar: "أربعة حروف فارسية، پ وچ وژ وگ، صارت مشتركة بين لغات كثيرة، ولكل لغة بعدها حروفها الخاصة: الأردية بالمعقوفات والغنة والنفَس، والبشتو بالحروف الاثني عشر، والكردية السورانية بالراء المكررة واللام الغليظة، والأويغورية بحروف العلة، والجاوية بست صوامت، والعثمانية بالكاف الأعجمية، وأجمي أفريقيا بالحروف المنقوطة، كما يعرضها ملف بحثي قُدّم إلى المتحف {cite:openarabic-perso-arabic-alphabet} {cite:wikipedia-persian-alphabet-en}."
  en: "Four Persian letters, پ چ ژ گ, became common to many languages, and each language then added its own: Urdu the retroflexes, nasal and aspirate signs; Pashto its twelve letters; Sorani Kurdish the rolled r and dark l; Uyghur its vowel letters; Jawi six consonants; Ottoman the Persian kaf; and African Ajami its dotted letters, as a research file supplied to the museum sets them out {cite:openarabic-perso-arabic-alphabet} {cite:wikipedia-persian-alphabet-en}."
  ur: "چار فارسی حروف، پ چ ژ گ، بہت سی زبانوں میں مشترک ہو گئے، اور پھر ہر زبان نے اپنے حروف بڑھائے: اردو نے مڑی ہوئی آوازوں، غنے اور سانس کی علامتیں؛ پشتو نے اپنے بارہ حروف؛ سورانی کردی نے مکرر ر اور بھاری ل؛ اویغور نے اپنے مصوتی حروف؛ جاوی نے چھ صامتے؛ عثمانی نے فارسی کاف؛ اور افریقی اجمی نے اپنے نقطہ دار حروف، جیسا کہ عجائب گھر کو پیش کی گئی ایک تحقیقی فائل انہیں بیان کرتی ہے {cite:openarabic-perso-arabic-alphabet} {cite:wikipedia-persian-alphabet-en}۔"
  fr: "Quatre lettres persanes, پ چ ژ گ, sont devenues communes à de nombreuses langues, et chaque langue a ensuite ajouté les siennes : l'ourdou les rétroflexes et les signes de nasalisation et d'aspiration ; le pachto ses douze lettres ; le kurde sorani le r roulé et le l sombre ; l'ouïghour ses lettres vocaliques ; le jawi six consonnes ; l'ottoman le kaf persan ; et l'ajami africain ses lettres pointées, tels qu'un dossier de recherche remis au musée les présente {cite:openarabic-perso-arabic-alphabet} {cite:wikipedia-persian-alphabet-en}."
  es: "Cuatro letras persas, پ چ ژ گ, se volvieron comunes a muchas lenguas, y cada lengua añadió luego las suyas: el urdu las retroflejas y los signos de nasalización y aspiración; el pastún sus doce letras; el kurdo sorani la r vibrante y la l oscura; el uigur sus letras vocálicas; el yaui seis consonantes; el otomano la kaf persa; y el ayami africano sus letras punteadas, tal como las presenta un archivo de investigación entregado al museo {cite:openarabic-perso-arabic-alphabet} {cite:wikipedia-persian-alphabet-en}."
