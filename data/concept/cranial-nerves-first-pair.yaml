label: { ar: "الزوج الأول من أعصاب الدماغ عند ابن سينا", en: "First pair of cranial nerves in the Canon", ur: "قانون میں دماغی اعصاب کا پہلا جوڑا", es: "Primer par de nervios craneales en el Canon", fr: "Première paire de nerfs crâniens dans le canon", tr: "İbn Sina'daki ilk beyin sinir çifti", id: "Pasangan saraf otak pertama pada Ibn Sina" }
summary:
  ar: "يقول ابن سينا إنه تنبت من الدماغ سبعة أزواج من العصب، ومبدأ الأول من غور البطنين المقدمين عند جواز الزائدتين الشبيهتين بحلمتي الثدي اللتين بهما الشم، وهو عصب عظيم مجوف إلى الحدقتين {cite:canon-ibn-sina-print-v1 p.78}."
  en: "Ibn Sina says seven pairs of nerves grow from the brain. The first begins from the depth of the two front ventricles beside the two projections like nipples, by which smell works, and is a great hollow nerve going to the two pupils {cite:canon-ibn-sina-print-v1 p.78}."
  es: "Ibn Sina dice que siete pares de nervios crecen desde el cerebro. El primero comienza en la profundidad de los dos ventrículos anteriores junto a las dos proyecciones como pezones, mediante las cuales funciona el olfato, y es un gran nervio hueco que va a las dos pupilas {cite:canon-ibn-sina-print-v1 p.78}."
  fr: "Ibn Sina affirme que sept paires de nerfs émergent du cerveau. La première prend naissance au fond des deux ventricules antérieurs, près des deux saillies ressemblant à des mamelons, grâce auxquelles fonctionne l'odorat; il s'agit d'un gros nerf creux qui se dirige vers les deux pupilles {cite:canon-ibn-sina-print-v1 p.78}."
  ur: "ابن سینا کہتے ہیں کہ دماغ سے اعصاب کے سات جوڑے نکلتے ہیں۔ پہلا نپلز جیسے دو تخمینوں کے ساتھ دو سامنے والے ویںٹریکلز کی گہرائی سے شروع ہوتا ہے، جس سے بو کام کرتی ہے، اور یہ ایک بہت بڑا کھوکھلا اعصاب ہے جو دو شاگردوں کو جاتا ہے"
  tr: "İbn Sina, beyinden yedi çift sinir çıktığını ve ilkinin ilkinin, meme uçlarına benzeyen uzuvlardan önce gelen karın çukurundan kaynaklandığını, bunun ise göz bebeklerine kadar uzanan büyük bir içi boş sinir olduğunu söyler {cite:canon-ibn-sina-print-v1 s.78}."
  id: "Ibn Sina mengatakan bahwa tujuh pasang saraf tumbuh dari otak, dan prinsip dari yang pertama berasal dari depresi perut yang datang sebelum anggota tubuh yang menyerupai puting payudara yang memiliki bau, dan itu adalah saraf besar yang berongga yang menjangkau pupil {cite:canon-ibn-sina-print-v1 hlm.78}."
