summary:
  ar: "يقول ابن سينا إنه تنبت من الدماغ سبعة أزواج من العصب، ومبدأ الأول من غور البطنين المقدمين عند جواز الزائدتين الشبيهتين بحلمتي الثدي اللتين بهما الشم، وهو عصب عظيم مجوف إلى الحدقتين {cite:canon-ibn-sina-print-v1 p.78}."
  en: "Ibn Sina says seven pairs of nerves grow from the brain. The first begins from the depth of the two front ventricles beside the two projections like nipples, by which smell works, and is a great hollow nerve going to the two pupils {cite:canon-ibn-sina-print-v1 p.78}."
