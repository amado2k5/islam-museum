label: { ar: "أشكال الزواج الأربعة", en: "Jāhilī Marriage Forms", es: "Formularios de matrimonio Jāhilī", fr: "Formes de mariage Jāhilī", ur: "جاہلی شادی کے فارم", tr: "Evliliğin Dört Biçimi", id: "Empat Bentuk Pernikahan" }
kind: social

summary: { ar: "أربعة أشكال للنكاح عندهم: الحرامي في الطرق، ونكاح الاستبداع، والزنا بين تسعة أو عشرة بالمرأة الحامل يضم الولد للسادس، ونكاح البدل؛ أبطلها الإسلام إلا الأول.", en: "Four pagan marriage forms — common, istibda‘ (lending a wife for a better lineage), communal paternity assignment, and wife-swapping (al-badal) — Islam abolished all but the first.", es: "El Islam abolió cuatro formas de matrimonio paganas: la común, la istibda' (prestar una esposa para obtener un mejor linaje), la asignación de paternidad comunal y el intercambio de esposas (al-badal).", fr: "Quatre formes de mariage païennes — le mariage commun, l'istibda' (prêt d'une épouse pour une meilleure lignée), l'attribution communautaire de la paternité et l'échange d'épouses (al-badal) — ont été abolies par l'Islam, à l'exception de la première.", ur: "چار کافر شادی کی شکلیں - عام، استبداء ⁦(بہتر نسب کے لیے بیوی کو قرض دینا)⁩، فرقہ وارانہ ولدیت کی تفویض، اور بیوی کا تبادلہ ⁦(البدل)⁩ - اسلام نے سب سے پہلے کے علاوہ سب کو ختم کر دیا۔", tr: "Onlara göre dört evlilik biçimi vardır: sokakta hırsız, yenilik evliliği, dokuz ya da on yaş arasında hamile bir kadınla zina (altıncıya kadar çocuk dahil) ve yerine geçen evlilik; İslam bunları ilk hariç kaldırmıştır.", id: "Menurut mereka, ada empat bentuk pernikahan: pencuri di jalanan, pernikahan inovasi, perselingkuhan antara usia sembilan hingga sepuluh dengan wanita hamil yang mencakup anak hingga yang keenam, dan pernikahan pengganti; Islam telah menghapusnya kecuali yang pertama." }
