  id: maqalat-ashari
  stance:
    ar: تقديم أبي بكر ثم عمر ثم عثمان ثم علي، وهم الخلفاء الراشدون أفضل الناس بعد النبي
    en: Putting Abu Bakr first, then Umar, Uthman and Ali, the rightly-guided caliphs and the best of people after the Prophet
  summary:
    ar: يذكر الأشعري أنهم يقدمون أبا بكر ثم عمر ثم عثمان ثم علياً، ويقرون أنهم الخلفاء الراشدون المهديون أفضل الناس كلهم بعد النبي.
    en: Al-Ash'ari reports they put Abu Bakr first, then Umar, then Uthman, then Ali, and affirm that they are the rightly-guided and guided caliphs, the best of all people after the Prophet.
