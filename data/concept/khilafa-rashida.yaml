label:
  ar: الخلافة الراشدة وترتيبها (في العقيدة الطحاوية)
  en: The rightly-guided caliphate and its order (in the Tahawi creed)
summary:
  ar: قول الطحاوي بثبوت الخلافة بعد النبي لأبي بكر ثم عمر ثم عثمان ثم علي، وتسميتهم الخلفاء الراشدين والأئمة المهتدين.
  en: al-Tahawi's statement that the caliphate after the Prophet is established first for Abu Bakr, then Umar, then Uthman, then Ali, whom he calls the rightly-guided caliphs and the guided imams.
