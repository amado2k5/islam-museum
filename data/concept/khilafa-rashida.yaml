- tradition: sunni-hanbali
  id: lumat-al-itiqad
  stance:
    ar: 'الترتيب نفسه مع بيان سبب كل منهم: الفضل والسابقة والعهد والشورى والإجماع'
    en: 'The same order with the reason for each: merit, precedence, covenant, consultation and consensus'
  summary:
    ar: يقول ابن قدامة إن أفضل الأمة أبو بكر ثم عمر ثم عثمان ثم علي، ويبني خلافة أبي بكر على فضله وسابقته وتقديم النبي له في الصلاة وإجماع الصحابة، وخلافة عمر على فضله وعهد أبي بكر إليه، وخلافة عثمان على تقديم أهل الشورى له، وخلافة علي على فضله وإجماع أهل عصره عليه.
    en: Ibn Qudama says the best of the community are Abu Bakr, then Umar, then Uthman, then Ali, and bases Abu Bakr's caliphate on his merit and precedence, the Prophet putting him forward in prayer and the consensus of the Companions; Umar's on his merit and Abu Bakr's covenant; Uthman's on the consultative council putting him forward; and Ali's on his merit and the consensus of the people of his age.
