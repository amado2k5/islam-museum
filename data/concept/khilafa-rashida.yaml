  id: aqida-wasitiyya
  stance:
    ar: الخليفة بعد النبي أبو بكر ثم عمر ثم عثمان ثم علي، والخلاف في تفضيل عثمان وعلي ليس من الأصول
    en: The caliph after the Prophet is Abu Bakr, then Umar, Uthman and Ali; the dispute over ranking Uthman and Ali is not among the fundamentals
  summary:
    ar: يقول ابن تيمية إن أهل السنة يؤمنون بأن الخليفة بعد النبي أبو بكر ثم عمر ثم عثمان ثم علي، ويذكر أن بعض أهل السنة اختلفوا قديماً في تفضيل عثمان وعلي ثم استقر أمرهم على تقديم عثمان، وأن هذه المسألة ليست من الأصول التي يُضلَّل فيها المخالف عند الجمهور، بخلاف مسألة الخلافة.
    en: Ibn Taymiyya says Ahl al-Sunna believe the caliph after the Prophet is Abu Bakr, then Umar, Uthman and Ali; he notes that some of them differed early on ranking Uthman and Ali before settling on putting Uthman first, and that this question is not among the fundamentals for which a dissenter is judged astray by the majority, unlike the question of the caliphate itself.
