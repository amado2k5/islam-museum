id: concept/khilafa-rashida
education:
  did_you_know:
    ar: "يثبت الطحاوي الخلافة بعد النبي لأبي بكر ثم عمر ثم عثمان ثم علي، ويسميهم الخلفاء الراشدين والأئمة المهتدين."
    en: "Al-Tahawi affirms the caliphate after the Prophet for Abu Bakr, then Umar, then Uthman, then Ali — naming them the rightly guided caliphs and guided imams."
    ur: "طحاوی نبی کے بعد خلافت کو ابوبکر، پھر عمر، پھر عثمان، پھر علی کے لیے ثابت کرتا ہے — اور انہیں خلفائے راشدین اور رہنمائے ہوئے ائمہ کہتا ہے۔"
    sources: [source/aqida-tahawiyya, source/lumat-al-itiqad]
