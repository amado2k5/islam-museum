  id: aqida-tahawiyya
  stance:
    ar: الخلافة لأبي بكر ثم عمر ثم عثمان ثم علي، تفضيلاً وتقديماً
    en: The caliphate for Abu Bakr, then Umar, Uthman and Ali, by merit and precedence
  summary:
    ar: يقول الطحاوي إنه يثبت الخلافة بعد النبي لأبي بكر تفضيلاً له وتقديماً على جميع الأمة، ثم لعمر ثم لعثمان ثم لعلي، وهم الخلفاء الراشدون والأئمة المهتدون.
