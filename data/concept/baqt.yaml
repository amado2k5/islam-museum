id: concept/baqt
class: concept
kind: doctrine
label:
  ar: "البقط"
  en: "The baqt, the annual Nubian levy"
  fr: "Le baqt, prélèvement annuel nubien"
  es: "El baqt, el impuesto anual nubio"
  ur: "باقت، سالانہ نیوبین لیوی"
summary:
  ar: "عند البلاذري: صالح عبد الله بن سعد بن أبي سرح أهل النوبة على غير جزية لكن على هدنة ثلاثمائة رأس في كل سنة وعلى أن يهدي المسلمون إليهم طعاماً بقدر ذلك؛ وعن أبي عبيد القاسم بن سلام عن ابن لهيعة عن يزيد بن أبي حبيب: ليس بيننا وبين الأساود عهد ولا ميثاق إنما هي هدنة على أن نعطيهم شيئاً من قمح وعدس ويعطونا رقيقاً فلا بأس بشراء رقيقهم منهم أو من غيرهم؛ وعن الليث بن سعد: أما الصلح بيننا وبين النوبة على أن لا نقاتلهم ولا يقاتلونا وأن يعطونا رقيقاً ونعطيهم بقدر ذلك طعاماً فإن باعوا نساءهم وأبناءهم لم أر بذلك بأساً أن يُشترى؛ وعن آل البحتري وغيره أن عبد الله بن عبد الله بن سعد صالحهم على أربعمائة رأس في السنة يأخذون بها طعاماً؛ وأمر المهدي بإلزامهم في كل سنة ثلاثمائة وستين رأساً وزرافة على أن يُعطوا قمحاً وخلّ خمر وثياباً وفرشاً أو قيمتها؛ وقد ادّعوا حديثاً أنه لا يجب عليهم البقط لكل سنة وأنهم طولبوا به في خلافة المهدي فرفعوا أنه مما يأخذون من رقيق أعدائهم فإذا لم يجدوا منه شيئاً عادوا على أولادهم فأعطوا منهم بهذه العدة فأمر ببقط لكل ثلاث سنين — ولم يوجد لهذه الدعوى ثبت في دواوين الحضرة ووجد في الديوان بمصر."
  en: "In al-Baladhuri: Abdallah ibn Sa'd ibn Abi Sarh made peace with the Nubians not on jizya but on a truce of three hundred heads yearly, the Muslims gifting them equal food. Abu Ubayd al-Qasim ibn Sallam via Ibn Lahia via Yazid ibn Abi Habib: 'there is no pact or covenant between us and the blacks — only a truce: we give them wheat and lentils, they give us slaves; no harm in buying their slaves, theirs or others'.' Via al-Layth ibn Sa'd: the peace is that we fight them not nor they us, they give slaves and we give equal food, and if they sell their women and children he saw no harm in buying. Via al-Buhturi's family: Abdallah ibn Abdallah ibn Sa'd settled them on four hundred heads yearly exchanged for food. Al-Mahdi ordered obliging them yearly three hundred and sixty heads and a giraffe against flour, wine-vinegar, clothes and furnishings or their value. They lately claimed the baqt is not due every year — having been asked it in al-Mahdi's caliphate they answered it came from enemies' captives, and lacking such they gave their own children — so one baqt every three years was ordered; no record of this claim exists in the court diwans, though found in Egypt's diwan."
  fr: "Chez al-Baladhuri, Abdallah ibn Sa'd ibn Abi Sarh conclut la paix avec les Nubiens non sur la jizya, mais sur une trêve prévoyant trois cents personnes par an, les musulmans leur offrant une quantité équivalente de vivres. Abu Ubayd al-Qasim ibn Sallam, par Ibn Lahia puis Yazid ibn Abi Habib, rapporte l’absence de pacte ou de traité avec les populations noires : seulement une trêve échangeant blé et lentilles contre des esclaves, dont l’achat auprès d’eux ou d’autres est jugé sans mal. Al-Layth ibn Sa'd décrit une paix sans combat réciproque, des esclaves contre des vivres équivalents ; s’ils vendent femmes et enfants, il ne voit pas de mal à les acheter. Selon la famille d’al-Buhturi, Abdallah ibn Abdallah ibn Sa'd conclut un accord sur quatre cents personnes par an contre des vivres. Al-Mahdi ordonna trois cent soixante personnes et une girafe par an contre farine, vinaigre de vin, vêtements, literie ou leur valeur. Ils affirmèrent ensuite que le baqt n’était pas annuel : sollicités sous al-Mahdi, ils auraient répondu qu’ils le tiraient de captifs ennemis et, faute de ceux-ci, de leurs propres enfants. Il fut alors ordonné de ne le prélever qu’une fois tous les trois ans. Cette affirmation n’est pas attestée dans les registres de la cour, mais elle figure dans celui d’Égypte."
  es: "En al-Baladhuri: Abdallah ibn Sa'd ibn Abi Sarh hizo la paz con los nubios no sobre la jizya sino sobre una tregua de trescientas cabezas al año, los musulmanes les obsequiaban con comida igual. Abu Ubayd al-Qasim ibn Sallam vía Ibn Lahia vía Yazid ibn Abi Habib: 'no hay pacto ni convenio entre nosotros y los negros, solo una tregua: les damos trigo y lentejas, ellos nos dan esclavos; no hay problema en comprar sus esclavos, los suyos o los de otros'. Vía al-Layth ibn Sa'd: la paz es que no luchamos contra ellos ni ellos contra nosotros, ellos dan esclavos y nosotros damos comida igual, y si venden a sus mujeres y niños no vio problema en comprarlos. Vía la familia de al-Buhturi: Abdallah ibn Abdallah ibn Sa'd les acordó cuatrocientas cabezas al año a cambio de comida. Al-Mahdi ordenó que se les obligara anualmente a entregar trescientas sesenta cabezas y una jirafa a cambio de harina, vino, vinagre, ropa y enseres, o su valor. Recientemente alegaron que el baqt no se debía entregar todos los años —al habérseles preguntado durante el califato de Al-Mahdi, respondieron que provenía de los cautivos de los enemigos, y al carecer de ellos, entregaron a sus propios hijos—, por lo que se ordenó un baqt cada tres años; no existe constancia de esta reclamación en los diwanes de la corte, aunque sí se encuentra en el diwan de Egipto."
  ur: "البلادوری میں ہے: عبداللہ بن سعد ابن ابی سرح نے نوبیوں سے جزیہ پر نہیں بلکہ سالانہ تین سو سروں کی جنگ بندی پر صلح کی، مسلمان انہیں برابر کا کھانا تحفے میں دیتے تھے۔ ابو عبید القاسم بن سلام ابن لہیہ کے ذریعے یزید بن ابی حبیب کے ذریعے: 'ہمارے اور کالوں کے درمیان کوئی معاہدہ یا عہد نہیں ہے - صرف ایک معاہدہ ہے: ہم انہیں گندم اور دال دیتے ہیں، وہ ہمیں غلام دیتے ہیں؛ ان کے غلاموں، ان کے یا دوسروں کو خریدنے میں کوئی حرج نہیں۔' لیث بن سعد سے مروی ہے: صلح یہ ہے کہ نہ ہم ان سے لڑیں اور نہ وہ ہم سے، وہ غلام دیتے ہیں اور ہم برابر کھانا دیتے ہیں، اور اگر وہ اپنی عورتیں اور بچے بیچ دیتے ہیں تو اسے خریدنے میں کوئی حرج نظر نہیں آتا۔ البطوری کے خاندان کے ذریعے: عبداللہ بن عبداللہ ابن سعد نے ان کو چار سو سروں پر سالانہ خوراک کے بدلے بسایا۔ المہدی نے ان کو سالانہ تین سو ساٹھ سر اور ایک زرافہ آٹے، شراب سرکہ، کپڑے اور سامان یا ان کی قیمت پر واجب کرنے کا حکم دیا۔ انہوں نے حال ہی میں دعوی کیا کہ بکت ہر سال واجب الادا نہیں ہے - جب اسے المہدی کی خلافت میں پوچھا گیا تو انہوں نے جواب دیا کہ یہ دشمنوں کے قیدیوں کی طرف سے آیا ہے، اور اس کی کمی انہوں نے اپنے بچوں کو دی ہے - لہذا ہر تین سال میں ایک بکت کا حکم دیا گیا؛ اس دعوے کا کوئی ریکارڈ عدالتی دیوانوں میں موجود نہیں ہے، حالانکہ مصر کے دیوان میں ملتا ہے۔"
