label: { ar: "البقط" }
summary:
  ar: "عند البلاذري: صالح عبد الله بن سعد بن أبي سرح أهل النوبة على غير جزية لكن على هدنة ثلاثمائة رأس في كل سنة وعلى أن يهدي المسلمون إليهم طعاماً بقدر ذلك؛ وعن أبي عبيد القاسم بن سلام عن ابن لهيعة عن يزيد بن أبي حبيب: ليس بيننا وبين الأساود عهد ولا ميثاق إنما هي هدنة على أن نعطيهم شيئاً من قمح وعدس ويعطونا رقيقاً فلا بأس بشراء رقيقهم منهم أو من غيرهم؛ وعن الليث بن سعد: أما الصلح بيننا وبين النوبة على أن لا نقاتلهم ولا يقاتلونا وأن يعطونا رقيقاً ونعطيهم بقدر ذلك طعاماً فإن باعوا نساءهم وأبناءهم لم أر بذلك بأساً أن يُشترى؛ وعن آل البحتري وغيره أن عبد الله بن عبد الله بن سعد صالحهم على أربعمائة رأس في السنة يأخذون بها طعاماً؛ وأمر المهدي بإلزامهم في كل سنة ثلاثمائة وستين رأساً وزرافة على أن يُعطوا قمحاً وخلّ خمر وثياباً وفرشاً أو قيمتها؛ وقد ادّعوا حديثاً أنه لا يجب عليهم البقط لكل سنة وأنهم طولبوا به في خلافة المهدي فرفعوا أنه مما يأخذون من رقيق أعدائهم فإذا لم يجدوا منه شيئاً عادوا على أولادهم فأعطوا منهم بهذه العدة فأمر ببقط لكل ثلاث سنين — ولم يوجد لهذه الدعوى ثبت في دواوين الحضرة ووجد في الديوان بمصر."
  en: "In al-Baladhuri: Abdallah ibn Sa'd ibn Abi Sarh made peace with the Nubians not on jizya but on a truce of three hundred heads yearly, the Muslims gifting them equal food. Abu Ubayd al-Qasim ibn Sallam via Ibn Lahia via Yazid ibn Abi Habib: 'there is no pact or covenant between us and the blacks — only a truce: we give them wheat and lentils, they give us slaves; no harm in buying their slaves, theirs or others'.' Via al-Layth ibn Sa'd: the peace is that we fight them not nor they us, they give slaves and we give equal food, and if they sell their women and children he saw no harm in buying. Via al-Buhturi's family: Abdallah ibn Abdallah ibn Sa'd settled them on four hundred heads yearly exchanged for food. Al-Mahdi ordered obliging them yearly three hundred and sixty heads and a giraffe against flour, wine-vinegar, clothes and furnishings or their value. They lately claimed the baqt is not due every year — having been asked it in al-Mahdi's caliphate they answered it came from enemies' captives, and lacking such they gave their own children — so one baqt every three years was ordered; no record of this claim exists in the court diwans, though found in Egypt's diwan."
