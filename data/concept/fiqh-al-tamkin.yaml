id: concept/fiqh-al-tamkin
class: concept
kind: political
label:
  ar: "فقه التمكين"
  en: "Fiqh al-tamkin (the fiqh of the nation's empowerment)"
  ur: "فقہِ تمکین"
  es: "Fiqh al-tamkin (el fiqh del empoderamiento de la nación)"
  fr: "Fiqh al-tamkin (le fiqh de l'émancipation de la nation)"
  tr: "Güçlendirme Içtihatı"
  id: "Yurisprudensi Pemberdayaan"
summary:
  ar: "يرى الشيخ عمر عبد الكافي أن تمكين الأمة له شروط وأسباب ومقاومات ونتائج، وأن الأمة حين تركت أسبابه استُبدلت بعد أن كانت ممكّنة، وأن استعادته تكون بفقه التمكين. {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:04:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:05:00}"
  en: "Sheikh Omar Abdelkafy holds that the nation's empowerment has conditions, causes, obstacles and results, and that the nation lost it when it abandoned its causes {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:04:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:05:00}."
  ur: "شیخ عمر عبدالکافی کے نزدیک امت کے تمکین کی شرطیں، اسباب، رکاوٹیں اور نتائج ہیں، اور امت نے اسباب چھوڑ کر تمکین کھو دیا {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:04:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:05:00}۔"
  es: "El jeque Omar Abdelkafy sostiene que el empoderamiento de la nación tiene condiciones, causas, obstáculos y resultados, y que la nación lo perdió cuando abandonó sus causas {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:04:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:05:00}."
  fr: "Le cheikh Omar Abdelkafy soutient que l'émancipation de la nation a des conditions, des causes, des obstacles et des résultats, et que la nation l'a perdue lorsqu'elle a abandonné ses causes {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:04:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:05:00}."
  tr: "Şeyh Ömer Abdulkafi, ulusu güçlendirmenin koşulları, nedenleri, direnişleri ve sonuçları olduğuna, millet amaçlarını terk ettiğinde, mümkün olduktan sonra yerine koyulduğuna ve yeniden kazanılmasının güçlendirme fıhhihi yoluyla sağlandığına inanır. {kaynak:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:04:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:05:00}"
  id: "Sheikh Omar Abdul Kafi percaya bahwa memberdayakan bangsa memiliki kondisi, sebab, perlawanan, dan konsekuensi, dan ketika bangsa meninggalkan tujuannya, hal itu digantikan setelah memungkinkan, dan pemulihannya dicapai melalui yurisprudensi pemberdayaan. {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:04:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:05:00}"
