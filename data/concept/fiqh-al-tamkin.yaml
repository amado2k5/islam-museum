  en: "Fiqh al-tamkin (the fiqh of the nation's empowerment)"
  ur: "فقہِ تمکین"
summary:
  ar: "يرى الشيخ عمر عبد الكافي أن تمكين الأمة له شروط وأسباب ومقاومات ونتائج، وأن الأمة حين تركت أسبابه استُبدلت بعد أن كانت ممكّنة، وأن استعادته تكون بفقه التمكين. {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:04:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:05:00}"
  en: "Sheikh Omar Abdelkafy holds that the nation's empowerment has conditions, causes, obstacles and results, and that the nation lost it when it abandoned its causes {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:04:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:05:00}."
  ur: "شیخ عمر عبدالکافی کے نزدیک امت کے تمکین کی شرطیں، اسباب، رکاوٹیں اور نتائج ہیں، اور امت نے اسباب چھوڑ کر تمکین کھو دیا {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:04:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:05:00}۔"
