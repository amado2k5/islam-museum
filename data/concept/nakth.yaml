label:
  ar: "نَكْث"
  en: "Nakth (breaking a covenant or contract)"
  ur: "نکث (عہد توڑنا)"
summary:
  ar: "النكث في اللغة نقض ما أُبرم من عهد أو عقد، وفي الاصطلاح نقض العهود والعقود، وهو محرم شرعاً، وجعله الشارع سبباً لنبذ العهد عند نقض المشركين له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16185} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16186} ويختلف الفقهاء في بدء قتال المشركين قبل إعلامهم بنقض العهد، وفي نقض أهل الذمة والمعاهدين عهدهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16187}"
  en: "Nakth is, in the lexicon, the undoing of what has been tied or agreed, and in the term, breaking covenants and contracts. It is forbidden by the law, and the lawgiver made it the cause of rejecting a treaty when the polytheists break it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16185} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16186} The jurists differ on starting to fight before notice of the breach and on the breaches of truce-holders and protected people. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16187}"
  ur: "نکث لغت میں باندھی ہوئی یا طے شدہ چیز کو توڑنا ہے، اور اصطلاح میں عہد اور عقد توڑنا۔ شرع میں حرام ہے، اور شارع نے مشرکین کا عہد توڑنا ان کے عہد کو رد کرنے کا سبب بنایا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16185} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16186} فقہاء اعلانِ نقض سے پہلے قتال کی ابتدا اور ذمیوں و معاہدین کے نقض میں مختلف ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16187}"
