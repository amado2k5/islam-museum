label:
  ar: "التصوير"
  en: "Tasweer (making and keeping images, and the view on living beings)"
  ur: "تصویر (تصویر بنانا اور رکھنا)"
summary:
  ar: "التصوير صنع الصورة، والصورة ما يماثل الشيء ويحكي هيئته، مجسمة أو مسطحة، وقد تكون مؤقتة كالمرآة والظل. وتصوير المصنوعات والجمادات والنباتات جائز عند جمهور الفقهاء، والنهي منصرف إلى صورة ذوات الأرواح. وفي تصوير الإنسان والحيوان ثلاثة أقوال ذكرها الفقهاء، وأشهرها التفصيل الذي يشترط فيه الشيء المجسم الكامل الأعضاء، والنهي عن الصنم المعبود. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5255} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5257} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5258} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5259} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5262} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5263} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5265}"
  en: "Tasweer is making an image; a likeness is what matches a thing and reproduces its form, three-dimensional or flat, and may be fleeting, like a reflection or a shadow. Making images of man-made objects is lawful by agreement; of inanimate creation, lawful unless made for worship; of plants, lawful by the majority (Mujahid alone forbade fruit-bearing trees). The prohibition concerns images of living beings. On images of humans and animals the jurists give three views; one permits them except a worshipped idol, another permits flat images but forbids three-dimensional ones with shadow when complete in limbs, and the entry proceeds to the third. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5255} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5257} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5258} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5259} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5262} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5263} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5265}"
