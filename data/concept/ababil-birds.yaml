label:
  ar: "طير أبابيل"
  en: "The birds of the elephant"
  ur: "ابابیل"
  es: "Las aves del elefante"
  fr: "Les oiseaux de l'éléphant"
  tr: "Ababeel Kuşu"
  id: "Burung Ababeel"
summary:
  ar: "أرسل الله على أصحاب الفيل طيراً أبابيل ترميهم بحجارة من سجّيل فجعلهم كعصف مأكول حين ساروا لهدم الكعبة في عام الفيل."
  en: "God sent against the People of the Elephant flights of birds pelting them with stones of baked clay, leaving them like straw eaten up, when they marched to destroy the Kaaba in the Year of the Elephant."
  ur: "جب اصحابِ فیل سالِ فیل میں کعبہ ڈھانے چلے تو اللہ نے ان پر جھنڈ کے جھنڈ پرندے بھیجے جو سنگریزے پھینکتے تھے اور انہیں چبے ہوئے بھوسے جیسا کر دیا۔"
  es: "Dios envió contra el Pueblo del Elefante bandadas de pájaros que les arrojaban piedras de arcilla cocida, dejándolos como paja devorada, cuando marcharon para destruir la Kaaba en el Año del Elefante."
  fr: "Dieu envoya contre le Peuple de l'Éléphant des volées d'oiseaux qui les bombardèrent de pierres d'argile cuite, les réduisant en miettes comme de la paille, lorsqu'ils marchèrent pour détruire la Kaaba durant l'Année de l'Éléphant."
  tr: "Tanrı, filin yoldaşlarına Ababil kuşlarını gönderdi, Sijjil'den taşlar atmaları için, Fil Yılı'nda Kabe'yi yıkmaya çıktıklarında taşları yenilmiş toz gibi yaptılar."
  id: "Tuhan mengirim burung-burung Ababil kepada teman-teman gajah untuk melempar batu dari Sijjil, membuat mereka seperti debu yang dimakan saat mereka berangkat untuk menghancurkan Ka'bah pada Tahun Gajah."
