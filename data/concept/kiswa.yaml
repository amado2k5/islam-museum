label:
  ar: "كُسْوة"
  en: "Clothing owed (kiswa)"
  ur: "لباس کی ذمہ داری (کسوہ)"
summary:
  ar: "الكسوة لغة الثوب الذي يُستتر به، وهي واجبة للزوجة على زوجها إذا مكنته من نفسها، وكذلك كسوة القريب الذي تجب نفقته بشرط اليسار، وتجب كسوة عشرة مساكين في كفارة اليمين. وتقدر الكسوة عند الحنفية بحال الزوج، وعند الشافعية والحنابلة بقدر الكفاية. وللزوجة الفسخ عند الإعسار بالكسوة عند المالكية والشافعية في الأظهر والحنابلة، ويرى الحنفية أن القاضي يفرض لها الكسوة ثم تستدين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13267} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13268} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13269} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13270} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13271} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13272} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13273}"
  en: "Kiswa in the lexicon is the garment one covers oneself with. A husband owes his wife clothing once she has made herself available to him as is due. A relative whose maintenance is owed must also be clothed, if he is well off, and the expiation of an oath requires clothing ten poor persons. The Hanafis measure the husband's clothing duty by his means, the Shafi'is and Hanbalis by what suffices her; the Malikis set a yearly provision in two seasons. A wife whose husband cannot clothe her may seek separation according to the Malikis, the preferred Shafi'i view and the Hanbalis; the Hanafis have the judge fix the clothing and let her borrow. If the husband does not provide, the arrears become a debt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13267} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13268} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13269} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13270} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13271} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13272} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13273}"
  ur: "کسوہ لغت میں اس لباس کو کہتے ہیں جس سے آدمی ڈھانپتا ہے۔ جب بیوی شوہر کو اپنے آپ پر واجب طریقے سے قدرت دے تو شوہر پر اس کا لباس واجب ہے، اور وہ رشتہ دار جس کا نفقہ واجب ہو اس کا لباس بھی خوشحالی کی صورت میں واجب ہے، اور قسم کے کفارے میں دس مسکینوں کو لباس دینا ہے۔ حنفیہ شوہر کے حال کے مطابق لباس طے کرتے ہیں، شافعیہ اور حنابلہ کفایت کے مطابق، اور مالکیہ سال میں دو موسموں کے حساب سے۔ شوہر لباس نہ دے سکے تو مالکیہ، شافعیہ کے اظہر قول اور حنابلہ کے نزدیک بیوی فسخ کر سکتی ہے، جبکہ حنفیہ کے نزدیک قاضی لباس مقرر کرے گا اور بیوی قرض لے گی۔ نہ دینے کی صورت میں بقایا قرض بن جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13267} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13268} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13269} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13270} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13271} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13272} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13273}"
