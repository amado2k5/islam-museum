id: concept/al-rahman-al-rahim
class: concept
kind: term
label:
  ar: "الرحمن الرحيم"
  en: "Al-Rahman al-Rahim (the Merciful, the Compassionate)"
  ur: "الرحمن الرحیم"
summary:
  ar: "الاسمان الكريمان في البسملة وفي الفاتحة. يفرّق الشعراوي بين معناهما في البسملة، حيث يذكّر الاسمان بالرحمة والمغفرة فلا يستحيي المذنب أن يستعين بالله، وبين معناهما في الفاتحة، حيث يقترنان بربوبية الله للعالمين، فتشمل رحمته المؤمن والكافر، وتمهل العاصي وتفتح له باب التوبة {cite:tafsir-sharawi-khawatir-scan p.52} {cite:tafsir-sharawi-khawatir-scan p.54}. ويذكر حديثاً قدسياً عن السماء والبحار والجبال مع ابن آدم {cite:tafsir-sharawi-khawatir-scan p.66}. هذا تفسيره ويُنسب إليه."
  en: "The two names in the basmala and in the Fatiha. Sha'rawi distinguishes their sense: in the basmala they recall forgiveness, so the sinner is not shy to seek God's help; in the Fatiha they are joined to God's lordship over the worlds, so His mercy covers believer and unbeliever, gives time to the disobedient and opens the door of repentance {cite:tafsir-sharawi-khawatir-scan p.52} {cite:tafsir-sharawi-khawatir-scan p.54}. He cites a hadith qudsi about the sky, seas and mountains and the son of Adam {cite:tafsir-sharawi-khawatir-scan p.66}. This is Sha'rawi's reading and is attributed to him."
  ur: "بسملہ اور فاتحہ کے دو نام۔ شعراوی ان کے مفہوم میں فرق کرتے ہیں: بسملہ میں یہ مغفرت اور رحمت کی یاد دلاتے ہیں تاکہ گناہگار اللہ سے مدد مانگنے میں شرم محسوس نہ کرے، جبکہ فاتحہ میں یہ اللہ کی ربوبیت کے ساتھ آتے ہیں تو اس کی رحمت مومن اور کافر دونوں کو گھیرتی ہے اور نافرمان کو مہلت اور توبہ کا دروازہ دیتی ہے {cite:tafsir-sharawi-khawatir-scan p.52} {cite:tafsir-sharawi-khawatir-scan p.54}۔ وہ آسمان، سمندروں اور پہاڑوں اور ابن آدم کے بارے میں ایک حدیث قدسی بھی نقل کرتے ہیں {cite:tafsir-sharawi-khawatir-scan p.66}۔ یہ شعراوی کی تفسیر ہے اور ان کی طرف منسوب ہے۔"
