tags: [arabiyya-browser, arabiyya-lisan]
label:
  ar: "مثل «على أهلها جنت براقش»"
  en: "The proverb 'Against her own people Baraqish sinned'"
  ur: "مثل «علی اہلہا جنت براقش»"
  fr: "Le proverbe « Contre les siens Baraqish a péché »"
  es: "El proverbio «Contra los suyos pecó Baraqish»"
  tr: "'Baraqesh Jannat Al Ahliha' gibi"
  id: "Seperti 'Baraqesh Jannat Al Ahliha'"
summary:
  ar: "مثل يُضرب فيمن يضرّ قومه دون قصد، وقصته أن كلبة اسمها براقش نبحت فدلّت الغزاة على مخبأ أهلها {cite:arrafid-article-amthal-stories}."
  en: "A proverb for one who unwittingly harms his own side; its tale is of a dog named Baraqish whose barking showed raiders the hiding place of her people {cite:arrafid-article-amthal-stories}."
  ur: "وہ مثل جو اپنوں کو انجانے میں نقصان پہنچانے والے کے لیے کہی جاتی ہے؛ اس کا قصہ براقش نامی کتیا کا ہے جس کے بھونکنے نے حملہ آوروں کو اس کے لوگوں کی پناہ گاہ بتا دی {cite:arrafid-article-amthal-stories}۔"
  fr: "Proverbe dit de qui nuit sans le vouloir aux siens ; son histoire est celle d'une chienne nommée Baraqish dont l'aboiement montra aux assaillants la cachette de son peuple {cite:arrafid-article-amthal-stories}."
  es: "Proverbio que se dice de quien daña sin querer a los suyos; su relato es el de una perra llamada Baraqish cuyos ladridos mostraron a los asaltantes el escondite de su gente {cite:arrafid-article-amthal-stories}."
  tr: "Bir atasözü vardır; birisi halkına istemeden zarar verir; hikayesi, Baraqish adında bir köpeğin havladığı ve istilacıların onun halkının saklandığı yere işaret ettiği {cite:arrafid-article-amthal-stories} şeklindedir."
  id: "Ada pepatah tentang seseorang yang secara tidak sengaja menyakiti rakyatnya, dan ceritanya adalah seekor anjing bernama Baraqish menggonggong, dan para penyerbu menunjuk ke tempat persembunyian bangsanya {cite:arrafid-article-amthal-stories}."
