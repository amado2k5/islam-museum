id: concept/marahil-al-dawa
class: concept
kind: term
label: { ar: "أدوار الدعوة ومراحلها", en: "The periods and stages of the Prophet's call", es: "Los períodos y etapas del llamado del Profeta", fr: "Les périodes et les étapes de l'appel du Prophète", ur: "پیغمبر کی دعوت کے ادوار اور مراحل", tr: "Da'wah'ın Rolleri ve Aşamaları", id: "Peran dan Tahapan Da'wah" }
summary:
  ar: "تقسيم الرحيق المختوم لعهد الدعوة النبوية إلى دورين: مكي نحو ثلاث عشرة سنة ومدني عشر سنوات كاملة؛ والدور المكي ثلاث مراحل: الدعوة السرية ثلاث سنين، وإعلان الدعوة في أهل مكة من أول السنة الرابعة إلى أواخر العاشرة، والدعوة خارج مكة من أواخر العاشرة إلى الهجرة."
  en: "Al-Raheeq al-Makhtum's division of the Prophet's mission into two periods, Meccan (about thirteen years) and Medinan (ten full years); the Meccan period has three stages: the secret call for three years, the open call to the Meccans from the start of the fourth year to the end of the tenth, and the call beyond Mecca from the end of the tenth year to the Hijra."
  es: "La división que hace Al-Raheeq al-Makhtum de la misión del Profeta se divide en dos períodos: el de La Meca (unos trece años) y el de Medina (diez años completos). El período de La Meca tiene tres etapas: la llamada secreta durante tres años, la llamada abierta a los mecanos desde el comienzo del cuarto año hasta el final del décimo, y la llamada más allá de La Meca desde el final del décimo año hasta la Hégira."
  fr: "Al-Raheeq al-Makhtum divise la mission du Prophète en deux périodes, la Mecque (environ treize ans) et Médinoise (dix années complètes); la période mecquoise comporte trois étapes: l'appel secret pendant trois ans, l'appel ouvert aux Mecquois du début de la quatrième année à la fin de la dixième, et l'appel au-delà de La Mecque de la fin de la dixième année à l'Hégire."
  ur: "الرحیق المختم نے پیغمبر کے مشن کو دو ادوار میں تقسیم کیا، مکہ ⁦(تقریباً تیرہ سال)⁩ اور مدینہ ⁦(پورے دس سال)⁩؛ مکی دور کے تین مراحل ہیں: تین سال کی خفیہ دعوت، چوتھے سال کے آغاز سے دسویں کے آخر تک مکہ والوں کو کھلی دعوت اور دسویں سال کے آخر سے ہجرت تک مکہ سے باہر کی دعوت۔"
  tr: "Peygamberlik çağrısı döneminin mühürlü nektarı iki aşamaya ayrılır: Mekke yaklaşık on üç yıl ve Medine dönemleri on tam yıl; Mekke evresi üç aşamadan oluşur: gizli çağrı, üç yıl, dördüncü yılın başından onuncu yılın sonuna kadar Mekke halkı arasında çağrının duyurulması ve onuncu yılın sonundan Hicra'ya kadar Mekke dışındaki görev."
  id: "Nektar tersegel dari era panggilan kenabian dibagi menjadi dua fase: Mekah sekitar tiga belas tahun dan periode Madinah sepuluh tahun penuh; fase Mekah terdiri dari tiga tahap: panggilan rahasia, tiga tahun, pengumuman panggilan di antara rakyat Mekah dari awal tahun keempat hingga akhir tahun kesepuluh, dan misi di luar Mekah dari akhir tahun kesepuluh hingga Hijrah."
