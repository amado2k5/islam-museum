label: { ar: "أدوار الدعوة ومراحلها", en: "The periods and stages of the Prophet's call" }
summary:
  ar: "تقسيم الرحيق المختوم لعهد الدعوة النبوية إلى دورين: مكي نحو ثلاث عشرة سنة ومدني عشر سنوات كاملة؛ والدور المكي ثلاث مراحل: الدعوة السرية ثلاث سنين، وإعلان الدعوة في أهل مكة من أول السنة الرابعة إلى أواخر العاشرة، والدعوة خارج مكة من أواخر العاشرة إلى الهجرة."
  en: "Al-Raheeq al-Makhtum's division of the Prophet's mission into two periods, Meccan (about thirteen years) and Medinan (ten full years); the Meccan period has three stages: the secret call for three years, the open call to the Meccans from the start of the fourth year to the end of the tenth, and the call beyond Mecca from the end of the tenth year to the Hijra."
