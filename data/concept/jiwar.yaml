label: { ar: "الجوار", en: "Jiwar (neighbourhood and the rights of the neighbour)", ur: "جوار" }
summary:
  ar: "الجوار في الفقه ما تتعلق به حقوق الجار على جاره، وتذكر الموسوعة حد الجوار عند الشافعية والحنابلة بأربعين دارا من كل جانب، وتفصل أحكام الجدار المشترك والانتفاع به، والسترة بين الأسطح والنوافذ، وحقوق المرور على شط النهر، والشفعة للجار عند الحنفية وخلاف غيرهم، وأثر الجوار في تقييد التصرف في الملك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6677} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6680} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6682} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6683} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6684}"
  en: "Jiwar in fiqh covers the rights a neighbour has over a neighbour. The Shafi'is and Hanbalis set the limit of neighbourhood at forty houses on each side. The encyclopedia treats shared walls and their use, screens against sight from roofs and windows, rights of passage along a public watercourse, pre-emption for an adjoining neighbour, which the Hanafis accept and others limit, and how the rights of neighbours restrict what an owner may do with his property. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6677} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6680} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6682} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6683} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6684}"
