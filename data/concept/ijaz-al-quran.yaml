label: { ar: "إعجاز القرآن", en: "The inimitability of the Qur'an (i'jaz al-Qur'an)", ur: "اعجازِ قرآن" }
summary:
  ar: "القول بأن القرآن معجز لا يقدر البشر على الإتيان بمثله، وهو عند أهل السنة أعظم معجزات النبي؛ جعل القاضي عياض في «الشفا» وجوهه المتفق عليها أربعة: فصاحته وحسن تأليفه، ونظمه المخالف لأساليب العرب، وإخباره بالغيب، وإخباره بأنباء الأمم السالفة مع أمية النبي، وحكى قول من قال بالصرفة وقول من جعل مثله من جنس مقدور البشر لكنهم لم يُقدَروا عليه."
  en: "The doctrine that the Qur'an is inimitable and that humans cannot produce its like; for Sunni scholars it is the Prophet's greatest miracle. In al-Shifa, Qadi Iyad counts four agreed aspects — its eloquence and fine composition, its arrangement unlike Arab forms of speech, its news of the unseen, and its accounts of past nations despite the Prophet being unlettered — and reports the view that the Arabs were turned away from imitating it (sarfa) and the view that its like was within human power in kind but never granted to them."
