label: { ar: "إعجاز القرآن", en: "The inimitability of the Qur'an (i'jaz al-Qur'an)", ur: "اعجازِ قرآن", es: "La inimitabilidad del Corán (i'jaz al-Qur'an)", fr: "L'inimitabilité du Coran (i'jaz al-Qur'an)", tr: "Kur'an'ın Mucizevliği", id: "Keajaiban Al-Qur'an" }
summary:
  ar: "القول بأن القرآن معجز لا يقدر البشر على الإتيان بمثله، وهو عند أهل السنة أعظم معجزات النبي؛ جعل القاضي عياض في «الشفا» وجوهه المتفق عليها أربعة: فصاحته وحسن تأليفه، ونظمه المخالف لأساليب العرب، وإخباره بالغيب، وإخباره بأنباء الأمم السالفة مع أمية النبي، وحكى قول من قال بالصرفة وقول من جعل مثله من جنس مقدور البشر لكنهم لم يُقدَروا عليه."
  en: "The doctrine that the Qur'an is inimitable and that humans cannot produce its like; for Sunni scholars it is the Prophet's greatest miracle. In al-Shifa, Qadi Iyad counts four agreed aspects — its eloquence and fine composition, its arrangement unlike Arab forms of speech, its news of the unseen, and its accounts of past nations despite the Prophet being unlettered — and reports the view that the Arabs were turned away from imitating it (sarfa) and the view that its like was within human power in kind but never granted to them."
  es: "La doctrina de que el Corán es inimitable y que los humanos no pueden producir algo semejante; para los eruditos sunitas, es el mayor milagro del Profeta. En al-Shifa, Qadi Iyad enumera cuatro aspectos consensuados: su elocuencia y exquisita composición, su estructura distinta a la de las formas de expresión árabes, sus noticias de lo invisible y sus relatos sobre naciones pasadas a pesar de que el Profeta era analfabeto. Asimismo, expone la opinión de que los árabes se abstuvieron de imitarlo (sarfa) y la opinión de que existía una obra semejante al alcance humano, pero que nunca se les concedió."
  fr: "La doctrine selon laquelle le Coran est inimitable et que les humains ne peuvent produire un ouvrage semblable est considérée par les savants sunnites comme le plus grand miracle du Prophète. Dans son ouvrage al-Shifa, le cadi Iyad recense quatre aspects qui font consensus: son éloquence et la finesse de sa composition, son organisation différente des formes d'expression arabes, le récit de l'invisible et les descriptions des nations passées, malgré l'illettrisme du Prophète. Il rapporte également l'opinion selon laquelle les Arabes se sont détournés de son imitation (sarfa) et que, bien que son équivalent fût à la portée de l'homme, il ne leur fut jamais accordé."
  ur: "یہ نظریہ کہ قرآن بے مثال ہے اور انسان اس کی مثل پیدا نہیں کر سکتے۔ اہل سنت کے نزدیک یہ پیغمبر کا سب سے بڑا معجزہ ہے۔ الشفاء میں، قادی ایاد نے چار متفقہ پہلوؤں کو شمار کیا ہے - اس کی فصاحت و بلاغت، اس کی عربی طرز گفتگو کے برعکس اس کی ترتیب، اس کی غیب کی خبریں، اور پیغمبر کے ان پڑھ ہونے کے باوجود اس کے ماضی کی قوموں کے احوال - اور اس نظریے کی خبر دی ہے کہ عرب اس کی تقلید کرنے سے مکر گئے تھے اور یہ نظریہ ان کے اندر انسانی طاقت نہیں تھی کہ وہ کبھی بھی اس کی طرح نہیں تھا۔"
  tr: "Kur'an'ın insan kavrayışının ötesinde bir mucize olduğu ve Sünnilere göre Peygamber'in en büyük mucizesi olduğu iddiası, Kadi İyad' 'El-Şifa'da üzerinde anlaşılan dört yönü olarak sıraladı: hitabetliliği, mükemmel bileşimi, Arapların tarzlarına aykırı bileşimi, görünmeyeni bilmesi ve Peygamber'in Umeyyye'si hakkındaki önceki milletlerin haberlerini aktarması. Ayrıca saf konuşanların ve insan imkanları içinde bir tür mucize yapanların görüşlerini aktardı."
  id: "Klaim bahwa Al-Qur'an adalah mukjizat yang melampaui pemahaman manusia, dan menurut Sunni, itu adalah mukjizat terbesar Nabi, Qadi Iyad, mencantumkan dalam 'Al-Shifa' aspek-aspek yang disepakati sebagai empat: kefasihannya, komposisi yang sangat baik, komposisi yang bertentangan dengan gaya orang Arab, pengetahuannya tentang yang tak terlihat, dan pelaporan berita bangsa-bangsa sebelumnya mengenai Umayyah Nabi. Ia juga menceritakan pendapat mereka yang berbicara murni dan mereka yang membuatnya dalam kemampuan manusia tetapi tidak dapat dicapai."
