label: { ar: "الوجع المفسخ والمكسر والرخو عند ابن سينا", en: "Tearing, breaking and loose pain in the Canon", ur: "پھٹنے والا، توڑنے والا اور ڈھیلا درد، قانون کے مطابق" }
summary:
  ar: "يعزو ابن سينا الوجع المفسّخ إلى مادة تتحلل من العضلة وغشائها فتمدّد الغشاء وتفرّق اتصاله، والمكسّر إلى مادة أو ريح بين العظم والغشاء المجلّل له أو برد يقبض ذلك الغشاء بقوة، والرخو إلى مادة تمدّد لحم العضلة دون وترها {cite:canon-ibn-sina-print-v1 p.149}."
  en: "Ibn Sina ascribes tearing pain to matter that dissolves out of the muscle and its membrane, stretching the membrane and separating its continuity; breaking pain to matter or wind between bone and the membrane that covers it, or to cold that grips that membrane hard; and loose pain to matter stretching the flesh of the muscle but not its tendon {cite:canon-ibn-sina-print-v1 p.149}."
