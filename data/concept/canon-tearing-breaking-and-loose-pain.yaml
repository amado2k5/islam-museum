id: concept/canon-tearing-breaking-and-loose-pain
class: concept
kind: scientific
label: { ar: "الوجع المفسخ والمكسر والرخو عند ابن سينا", en: "Tearing, breaking and loose pain in the Canon", ur: "پھٹنے والا، توڑنے والا اور ڈھیلا درد، قانون کے مطابق", es: "Desgarro, rotura y dolor suelto en el Canon", fr: "Douleurs déchirantes, brisées et lâches dans le Canon" }
summary:
  ar: "يعزو ابن سينا الوجع المفسّخ إلى مادة تتحلل من العضلة وغشائها فتمدّد الغشاء وتفرّق اتصاله، والمكسّر إلى مادة أو ريح بين العظم والغشاء المجلّل له أو برد يقبض ذلك الغشاء بقوة، والرخو إلى مادة تمدّد لحم العضلة دون وترها {cite:canon-ibn-sina-print-v1 p.149}."
  en: "Ibn Sina ascribes tearing pain to matter that dissolves out of the muscle and its membrane, stretching the membrane and separating its continuity; breaking pain to matter or wind between bone and the membrane that covers it, or to cold that grips that membrane hard; and loose pain to matter stretching the flesh of the muscle but not its tendon {cite:canon-ibn-sina-print-v1 p.149}."
  es: "Ibn Sina atribuye el dolor desgarrador a la materia que se disuelve del músculo y su membrana, estirando la membrana y separando su continuidad; el dolor quebradizo a la materia o el viento entre el hueso y la membrana que lo cubre, o al frío que agarra con fuerza esa membrana; y el dolor flojo a la materia que estira la carne del músculo pero no su tendón {cite:canon-ibn-sina-print-v1 p.149}."
  fr: "Ibn Sina attribue la douleur déchirante à une matière qui se dissout hors du muscle et de sa membrane, étirant la membrane et séparant sa continuité; la douleur de rupture à une matière ou au vent entre l'os et la membrane qui le recouvre, ou au froid qui serre fortement cette membrane; et la douleur lâche à une matière qui étire la chair du muscle mais pas son tendon {cite:canon-ibn-sina-print-v1 p.149}."
  ur: "ابن سینا پھاڑ پھاڑ کے درد کو مادے سے منسوب کرتے ہیں جو پٹھوں اور اس کی جھلی سے تحلیل ہو جاتا ہے، جھلی کو کھینچتا ہے اور اس کے تسلسل کو الگ کرتا ہے۔ ہڈی اور اس کو ڈھانپنے والی جھلی کے درمیان مادے یا ہوا کے ٹوٹنے کا درد، یا اس جھلی کو سختی سے پکڑنے والی ٹھنڈ؛ اور ڈھیلے درد پٹھوں کے گوشت کو پھیلاتے ہوئے لیکن اس کے کنڈرا کو نہیں"
