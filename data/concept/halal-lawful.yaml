label: { ar: "الحلال", en: "Halal (the lawful)", ur: "حلال", es: "Halal (lo lícito)", fr: "Halal (le licite)", tr: "Helal", id: "Halal" }
summary:
  ar: "الحلال لغة نقيض الحرام، واصطلاحا الجائز المأذون فيه شرعا، ويشمل عند الجمهور المندوب والمباح والمكروه، ويشمل عند الحنفية الواجب أيضا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7241} والحلال في مقابل الحرام من حيث الإذن وعدم امتناع الفعل شرعا، والمكروه تنزيها عند الحنفية ما كان إلى الحل أقرب، والمكروه تحريما ما كان إلى الحرام أقرب أو ثبت تحريمه بدليل ظني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7241} واختلف الأصوليون في الأصل في الأشياء التي لا نص فيها: فالأكثر من الحنفية والشافعية على أن الأصل الحل، وقال بعض الحنفية بالتوقف، وقال بعض أصحاب الحديث بالحرمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7241} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7242} واحتج الجمهور بآيات منها خلق ما في الأرض للإنسان، وبحديث أن ما سكت عنه الشرع فهو عفو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7242} ومن قاعدة اجتماع الحلال والحرام أن الحرام يغلب، وخص الشافعية الحلال بالمباح والحنفية بالمباح والواجب، واستدلوا بتقليل التغيير في الأحكام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7243} ويستثنى من القاعدة صور منها الطائر المجروح الذي يموت بالوقوع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7243} وتحل الأشياء لسببين: ذاتي كالانتفاع بالحبوب، وعرضي كالبيع والإجارة والهبة، وتتفاوت درجات الحلال بحسب خلوه من الشبهة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7244} "
  en: "Halal is lexically the opposite of haram, and technically what the law permits; for the majority it covers recommended, permitted and disliked acts, and for the Hanafis also obligatory acts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7241} The Hanafis count as disliked-but-lawful what is nearer the lawful, and as forbidden-leaning dislike what is nearer the forbidden or proved forbidden by a probable proof. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7241} On silent matters the majority of Hanafis and Shafiis hold the default is permission, some Hanafis suspend judgement, and some traditionists hold the default is prohibition. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7241} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7242} The majority argue from the Quranic creation of all that is on earth for mankind and from the saying that what the law leaves silent is pardoned. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7242} Where the lawful and unlawful mix, the unlawful prevails, a rule the Shafiis limit to permitted acts and the Hanafis extend to obligatory acts; the rationale is to minimise changes to the rulings. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7243} Exceptions include the bird that dies after being shot and falls. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7243} Lawfulness arises from an intrinsic cause, such as using grain, or an extrinsic cause, such as a valid sale, lease or gift; lawful property has degrees according to how free it is of doubt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7244} "
  ur: "حلال لغت میں حرام کی ضد ہے اور اصطلاح میں وہ جو شرعاً جائز اور مأذون ہو؛ جمہور کے نزدیک اس میں مندوب، مباح اور مکروہ شامل ہیں، اور حنفیہ کے نزدیک واجب بھی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7241} جن امور میں نص نہ ہو ان کی اصل میں اختلاف ہے: حنفیہ اور شافعیہ کی اکثریت کے نزدیک اصل حلت ہے، بعض حنفیہ توقف کے قائل ہیں، اور بعض اہلِ حدیث حرمت کے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7241} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7242} جمہور کی دلیل میں قرآن کی آیات ہیں جن میں زمین کی ہر چیز کو انسان کے لیے پیدا کرنے کا ذکر ہے، اور وہ حدیث جس میں شریعت کے خاموش موضوعات کو معافی کہا گیا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7242} اگر حلال و حرام جمع ہو جائیں تو حرام غالب ہوتا ہے؛ شافعیہ حلال کو مباح تک محدود کرتے ہیں اور حنفیہ واجب کو بھی شامل کرتے ہیں، اور دلیل احکام میں کم تبدیلی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7243} اس اصول سے مستثنیٰ صورتوں میں وہ پرندہ ہے جو تیر لگنے کے بعد زمین پر گر کر مر جائے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7243} حلت کا سبب ذاتی ہو سکتا ہے، جیسے غلہ کا استعمال، یا عارضی جیسے صحیح بیع، اجارہ اور ہبہ؛ اور حلال مال کے درجات شبہے سے پاک ہونے کے اعتبار سے مختلف ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7244} "
  es: "Halal es léxicamente lo opuesto a haram, y técnicamente lo que la ley permite; para la mayoría abarca actos recomendados, permitidos y desaconsejados, y para los Hanafi también actos obligatorios. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7241} Los Hanafi consideran como desaconsejado pero lícito lo que está más cerca de lo lícito, y como desagrado con tendencia a lo prohibido lo que está más cerca de lo prohibido o probado como prohibido por una prueba probable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7241} En asuntos silenciosos, la mayoría de los Hanafi y Shafi sostienen que por defecto es el permiso, algunos Hanafi suspenden el juicio, y algunos tradicionalistas sostienen que por defecto es la prohibición. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7241} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7242} La mayoría argumenta a partir de la creación coránica de todo lo que hay en la tierra para la humanidad y del dicho de que lo que la ley deja en silencio es perdonado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7242} Donde se mezclan lo lícito y lo ilícito, prevalece lo ilícito, una regla que los shafiíes limitan a los actos permitidos y los hanafíes extienden a los actos obligatorios; la razón es minimizar los cambios en las resoluciones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7243} Las excepciones incluyen al ave que muere después de ser disparada y cae. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7243} La legalidad surge de una causa intrínseca, como el uso de grano, o de una causa extrínseca, como una venta, arrendamiento o donación válida; la propiedad lícita tiene grados según su grado de certeza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7244}"
  fr: "Halal est lexicalement l'opposé de haram, et techniquement ce que la loi autorise; pour la majorité, il englobe les actes recommandés, permis et déconseillés, et pour les hanafites également les actes obligatoires. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7241} Les hanafites considèrent comme déconseillé mais licite ce qui est le plus proche du licite, et comme déconseillé ce qui est le plus proche de l'interdit ou dont l'interdiction est prouvée par une preuve probable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7241} Sur les points non tranchés, la majorité des hanafites et des shafiites considèrent que la permission est la règle par défaut, certains hanafites suspendent leur jugement, et certains traditionnistes considèrent que l'interdiction est la règle par défaut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7241} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7242} La majorité s'appuie sur la création coranique de tout ce qui est sur terre pour l'humanité et sur le principe selon lequel ce que la loi omet est pardonné. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7242} Lorsque le licite et l'illicite se côtoient, l'illicite prévaut. Cette règle, les chaféites la limitent aux actes permis tandis que les hanafites l'étendent aux actes obligatoires; le but est de minimiser les modifications des règles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7243} L'oiseau qui meurt après avoir été abattu et qui tombe fait exception. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7243} La licéité découle d'une cause intrinsèque, comme l'utilisation de céréales, ou d'une cause extrinsèque, comme une vente, une location ou une donation valable; la licéité d'un bien comporte différents degrés selon le degré d'absence de doute à son sujet. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7244}"
  tr: "Helal dilbilimsel olarak yasak olanın tam tersi anlamına gelir ve teknik olarak Şeriat tarafından kabul edilir ve izinlidir. Çoğunluğa göre, önerilen, mücaiz ve sevilmeyenleri içerir; Hanefi'ye göre ise zorunlu olanı da kapsar. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.7241} Ve helal, izin ve şeriatta imkansızlığın olmaması açısından haramın aksine. Hanefilere göre arındırılması istenmeyen şey, daha caiz olanıdır; sevilmeyen ise harama daha yakın olan veya muhtemel kanıtlarla yasaklanan yasaktır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7241} usul (usul) âlimleri, açıkça belirtilmeyen konularda prensip konusunda farklı görüşteydi: çoğu Hanafi ve Şafi, orijinalin mücaiz olduğunu savunur. Bazı Hanafi bunun helal olduğunu söylerken, diğerleri yasak olduğunu söyler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7241} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7242} Çoğunluk, insan için yeryüzünde olanın yaratılması ve Şeriatın suskunlaştığı şeyin af olduğu bir hadis gibi ayetler alıntılamıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7242} Yasal ve yasadışılığın bir arada var olmasının ilkesi, yasak olanın üstün gelmesidir. Şafi'ler, mücaizlene, Hanafileri ise mücaiz, zorunlu olanı belirterek hükümlerdeki değişikliklerin azaltılmasını belirtmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7243} Kuralın istisnaları arasında, düşerek ölen yaralı bir kuşun görüntüleri yer alır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7243} Şeyler iki nedenle izin verilir: öznel, örneğin tahıllardan faydalanmak, ve tesadüfi olanlar, örneğin satış, kiralama ve hediyeler. Helal dereceleri, şüpheden arınmış olup olmamasına bağlı olarak değişir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7244}"
  id: "Secara linguistik, halal berarti kebalikan dari yang dilarang, dan secara teknis diperbolehkan serta diizinkan oleh Syariah. Menurut mayoritas, hal ini mencakup apa yang direkomendasikan, diperbolehkan, dan tidak disukai, dan menurut Hanafi, juga mencakup yang wajib. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7241} Dan halal berbeda dengan haram dalam hal izin dan tidak adanya ketidakmungkinan dalam Syariah. Apa yang tidak disukai untuk disucikan menurut Hanafi adalah yang lebih dekat dengan diperbolehkan, dan yang tidak disukai dilarang adalah apa yang lebih dekat dengan haram atau larangannya dibuktikan oleh bukti yang mungkin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7241} Para ulama usul (usul) berbeda pendapat dalam prinsip mengenai hal-hal yang tidak secara eksplisit dinyatakan: sebagian besar Hanafi dan Shafi'i berpendapat bahwa yang asli diperbolehkan. Beberapa Hanafi mengatakan itu halal, sementara yang lain mengatakan itu dilarang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7241} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7242} Mayoritas telah mengutip ayat-ayat seperti penciptaan apa yang ada di bumi bagi manusia, dan hadis yang diam dalam Syariah adalah pengampunan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7242} Prinsip keberadaan bersama antara yang sah dan yang tidak sah adalah bahwa yang terlarang yang berlaku. Syafi'i menetapkan apa yang diperbolehkan atas apa yang diperbolehkan, dan Hanafi atas apa yang diperbolehkan dan wajib, dengan mengutip pengurangan perubahan keputusan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7243} Pengecualian terhadap aturan ini termasuk gambar burung yang terluka dan meninggal karena jatuh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7243} Hal-hal diperbolehkan karena dua alasan: subjektif, seperti mendapatkan manfaat dari biji-bijian, dan alasan kebetulan, seperti penjualan, penyewaan, dan hadiah. Tingkat halal bervariasi tergantung apakah halal itu bebas dari keraguan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7244}"
