label: { ar: "الحلال", en: "Halal (the lawful)", ur: "حلال" }
summary:
  ar: "الحلال لغة نقيض الحرام، واصطلاحا الجائز المأذون فيه شرعا، ويشمل عند الجمهور المندوب والمباح والمكروه، ويشمل عند الحنفية الواجب أيضا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7241} والحلال في مقابل الحرام من حيث الإذن وعدم امتناع الفعل شرعا، والمكروه تنزيها عند الحنفية ما كان إلى الحل أقرب، والمكروه تحريما ما كان إلى الحرام أقرب أو ثبت تحريمه بدليل ظني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7241} واختلف الأصوليون في الأصل في الأشياء التي لا نص فيها: فالأكثر من الحنفية والشافعية على أن الأصل الحل، وقال بعض الحنفية بالتوقف، وقال بعض أصحاب الحديث بالحرمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7241} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7242} واحتج الجمهور بآيات منها خلق ما في الأرض للإنسان، وبحديث أن ما سكت عنه الشرع فهو عفو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7242} ومن قاعدة اجتماع الحلال والحرام أن الحرام يغلب، وخص الشافعية الحلال بالمباح والحنفية بالمباح والواجب، واستدلوا بتقليل التغيير في الأحكام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7243} ويستثنى من القاعدة صور منها الطائر المجروح الذي يموت بالوقوع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7243} وتحل الأشياء لسببين: ذاتي كالانتفاع بالحبوب، وعرضي كالبيع والإجارة والهبة، وتتفاوت درجات الحلال بحسب خلوه من الشبهة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7244} "
  en: "Halal is lexically the opposite of haram, and technically what the law permits; for the majority it covers recommended, permitted and disliked acts, and for the Hanafis also obligatory acts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7241} The Hanafis count as disliked-but-lawful what is nearer the lawful, and as forbidden-leaning dislike what is nearer the forbidden or proved forbidden by a probable proof. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7241} On silent matters the majority of Hanafis and Shafiis hold the default is permission, some Hanafis suspend judgement, and some traditionists hold the default is prohibition. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7241} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7242} The majority argue from the Quranic creation of all that is on earth for mankind and from the saying that what the law leaves silent is pardoned. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7242} Where the lawful and unlawful mix, the unlawful prevails, a rule the Shafiis limit to permitted acts and the Hanafis extend to obligatory acts; the rationale is to minimise changes to the rulings. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7243} Exceptions include the bird that dies after being shot and falls. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7243} Lawfulness arises from an intrinsic cause, such as using grain, or an extrinsic cause, such as a valid sale, lease or gift; lawful property has degrees according to how free it is of doubt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7244} "
  ur: "حلال لغت میں حرام کی ضد ہے اور اصطلاح میں وہ جو شرعاً جائز اور مأذون ہو؛ جمہور کے نزدیک اس میں مندوب، مباح اور مکروہ شامل ہیں، اور حنفیہ کے نزدیک واجب بھی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7241} جن امور میں نص نہ ہو ان کی اصل میں اختلاف ہے: حنفیہ اور شافعیہ کی اکثریت کے نزدیک اصل حلت ہے، بعض حنفیہ توقف کے قائل ہیں، اور بعض اہلِ حدیث حرمت کے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7241} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7242} جمہور کی دلیل میں قرآن کی آیات ہیں جن میں زمین کی ہر چیز کو انسان کے لیے پیدا کرنے کا ذکر ہے، اور وہ حدیث جس میں شریعت کے خاموش موضوعات کو معافی کہا گیا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7242} اگر حلال و حرام جمع ہو جائیں تو حرام غالب ہوتا ہے؛ شافعیہ حلال کو مباح تک محدود کرتے ہیں اور حنفیہ واجب کو بھی شامل کرتے ہیں، اور دلیل احکام میں کم تبدیلی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7243} اس اصول سے مستثنیٰ صورتوں میں وہ پرندہ ہے جو تیر لگنے کے بعد زمین پر گر کر مر جائے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7243} حلت کا سبب ذاتی ہو سکتا ہے، جیسے غلہ کا استعمال، یا عارضی جیسے صحیح بیع، اجارہ اور ہبہ؛ اور حلال مال کے درجات شبہے سے پاک ہونے کے اعتبار سے مختلف ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7244} "
