id: "concept/al-gharb-wa-waram-al-mawq"
class: "concept"
kind: "scientific"
label:
  ar: "الغرب وورم الموق"
  en: "The gharb (lacrimal fistula) and the canthus swelling"
  ur: "غرب اور مآق کی سوجن"
summary:
  ar: "قد يخرج في موق العين خراج فربما كان صلباً يتحرك بالمس ولا ينفجر ويكون من جنس الغدد وربما كان خراجاً بثرياً يجتمع وينفجر فإذا انفجر فعل ناصوراً في أكثر الأمر، والغرب ناصور يحدث في موق العين الأنسي وأكثره عقيب خراج يسمى أخيلوس، وإذا انفجر ترك ناصوراً عسر التئامه لأن العضو رطب ودائم الحركة، وقد يبلغ خبث صديده العظم فيفسده ويسوده ثم يأكله ويفسد غضاريف الجفن {cite:canon-ibn-sina-print-v2 p.181} {cite:canon-ibn-sina-print-v2 p.182}"
  en: "An abscess may appear in the eye's canthus, sometimes hard, moving under touch, not bursting, of the gland kind, sometimes a pustular abscess gathering then bursting and mostly becoming a fistula; the gharb is a fistula occurring in the eye's inner canthus, mostly after an abscess called akhilus, and when it bursts it leaves a fistula whose healing is difficult because the organ is moist and ever-moving; the malignity of its pus may reach the bone, corrupt, blacken and eat it, and corrupt the lid's cartilages {cite:canon-ibn-sina-print-v2 p.181} {cite:canon-ibn-sina-print-v2 p.182}"
  ur: "آنکھ کے مآق میں ایک پھوڑا نکل سکتا ہے، کبھی سخت جو چھونے سے ہلے اور نہ پھوٹے اور غدود کی جنس کا ہو، اور کبھی بثری پھوڑا جو جمع ہو کر پھوٹے اور اکثر ناسور بنا دے؛ اور غرب ایک ناسور ہے جو آنکھ کے اندرونی مآق میں ہوتا ہے اور اکثر اخیلوس نامی پھوڑے کے بعد، اور جب پھوٹتا ہے تو ایسا ناسور چھوڑتا ہے جس کا التیام مشکل ہے کیونکہ وہ عضو تر اور ہمیشہ متحرک ہے؛ اور اس کے صديد کی خباثت ہڈی تک پہنچ کر اسے بگاڑ کر سیاہ کر کے کھا جاتی ہے اور پلک کے غضروف بگاڑ دیتی ہے {cite:canon-ibn-sina-print-v2 p.181} {cite:canon-ibn-sina-print-v2 p.182}"
