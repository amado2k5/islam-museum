id: "concept/al-gharb-wa-waram-al-mawq"
class: "concept"
kind: "scientific"
label:
  ar: "الغرب وورم الموق"
  en: "The gharb (lacrimal fistula) and the canthus swelling"
  fr: "Le gharb (fistule lacrymale) et la tuméfaction du canthus"
  ur: "غرب اور مآق کی سوجن"
  es: "La fístula lagrimal y la hinchazón del canto"
  tr: "Batı ve durumun büyümesi"
  id: "Barat dan pertumbuhan situasi"
summary:
  ar: "قد يخرج في موق العين خراج فربما كان صلباً يتحرك بالمس ولا ينفجر ويكون من جنس الغدد وربما كان خراجاً بثرياً يجتمع وينفجر فإذا انفجر فعل ناصوراً في أكثر الأمر، والغرب ناصور يحدث في موق العين الأنسي وأكثره عقيب خراج يسمى أخيلوس، وإذا انفجر ترك ناصوراً عسر التئامه لأن العضو رطب ودائم الحركة، وقد يبلغ خبث صديده العظم فيفسده ويسوده ثم يأكله ويفسد غضاريف الجفن {cite:canon-ibn-sina-print-v2 p.181} {cite:canon-ibn-sina-print-v2 p.182}"
  en: "An abscess may appear in the eye's canthus, sometimes hard, moving under touch, not bursting, of the gland kind, sometimes a pustular abscess gathering then bursting and mostly becoming a fistula; the gharb is a fistula occurring in the eye's inner canthus, mostly after an abscess called akhilus, and when it bursts it leaves a fistula whose healing is difficult because the organ is moist and ever-moving; the malignity of its pus may reach the bone, corrupt, blacken and eat it, and corrupt the lid's cartilages {cite:canon-ibn-sina-print-v2 p.181} {cite:canon-ibn-sina-print-v2 p.182}"
  fr: "Selon le Canon, un abcès peut apparaître au canthus de l’œil, tantôt dur, mobile au toucher, sans se rompre et de nature glandulaire, tantôt pustuleux, s’amassant puis se rompant pour former généralement une fistule. Le gharb est une fistule du canthus interne de l’œil, qui succède le plus souvent à un abcès nommé akhilus. En se rompant, celui-ci laisse une fistule difficile à guérir parce que l’organe est humide et toujours en mouvement. La malignité du pus peut atteindre l’os, l’altérer, le noircir et le ronger, et altérer les cartilages de la paupière {cite:canon-ibn-sina-print-v2 p.181} {cite:canon-ibn-sina-print-v2 p.182}."
  ur: "آنکھ کے مآق میں ایک پھوڑا نکل سکتا ہے، کبھی سخت جو چھونے سے ہلے اور نہ پھوٹے اور غدود کی جنس کا ہو، اور کبھی بثری پھوڑا جو جمع ہو کر پھوٹے اور اکثر ناسور بنا دے؛ اور غرب ایک ناسور ہے جو آنکھ کے اندرونی مآق میں ہوتا ہے اور اکثر اخیلوس نامی پھوڑے کے بعد، اور جب پھوٹتا ہے تو ایسا ناسور چھوڑتا ہے جس کا التیام مشکل ہے کیونکہ وہ عضو تر اور ہمیشہ متحرک ہے؛ اور اس کے صديد کی خباثت ہڈی تک پہنچ کر اسے بگاڑ کر سیاہ کر کے کھا جاتی ہے اور پلک کے غضروف بگاڑ دیتی ہے {cite:canon-ibn-sina-print-v2 p.181} {cite:canon-ibn-sina-print-v2 p.182}"
  es: "Puede aparecer un absceso en el canto del ojo, a veces duro, que se mueve al tacto, sin reventar, de tipo glandular, a veces un absceso pustuloso que se acumula y luego revienta y en la mayoría de los casos se convierte en una fístula; el gharb es una fístula que se produce en el canto interno del ojo, generalmente después de un absceso llamado akhilus, y cuando revienta deja una fístula cuya curación es difícil porque el órgano es húmedo y siempre móvil; la malignidad de su pus puede llegar al hueso, corromperlo, ennegrecerlo y corroerlo, y corromper los cartílagos del párpado {cite:canon-ibn-sina-print-v2 p.181} {cite:canon-ibn-sina-print-v2 p.182}"
  tr: "Apse göz bölgesinde ortaya çıkabilir; katı olabilir, dokunulduğunda hareket eder ancak patlamaz, bez tipinde olabilir ya da toplanıp patlayan avizeli bir apse olabilir. Patlarsa genellikle fistül oluşur. Batı fistül, en sık Aşil adı verilen apseyi takip eden medial göz çukurunda meydana gelir. Patlarsa, organ nemli ve sürekli hareket ettiği için iyileşmesi zor olan bir fistül bırakır. Yağ irinleri kemiğe ulaşabilir, kemiğin bozulmasına, kararmasına ve ardından göz kapağı kıkırdağına zarar vermesine neden olabilir {cite:canon-ibn-sina-print-v2 s.181} {cite:canon-ibn-sina-print-v2 s.182}"
  id: "Abses dapat muncul di area mata; dapat berupa abses padat, dapat digerakkan saat disentuh tetapi tidak pecah, bersifat kelenjar, atau abses lampu gantung yang terkumpul dan pecah. Jika abstula pecah, biasanya terbentuk fistula. Fistula barat paling sering muncul di rongga mata medial setelah abses yang disebut Achilles. Jika pecah, organ menjadi lembap dan terus bergerak, meninggalkan fistula yang sulit disembuhkan. Nanah berlemak dapat mencapai tulang, menyebabkan kerusakan tulang, menggelap, dan kemudian merusak tulang rawan kelopak mata {cite:canon-ibn-sina-print-v2 hlm.181} {cite:canon-ibn-sina-print-v2 hlm.182}"
