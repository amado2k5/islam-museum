label: { ar: "الخزف المزجج بالقلويات وقوالبه", en: "Alkaline-glazed ware and its moulds", ur: "قلوی لعاب والے ظروف اور سانچے" }
summary:
  ar: "خزف جديد بدأ صنعه في نيسابور بعد العصر الساماني، ذو بدن أبيض حبيبي صلب من الكوارتز المطحون وطلاء قلوي، يرسم مباشرة على البدن ويصب في قوالب، وأشهر ألوانه الأزرق الفاتح ثم الأزرق الكوبالتي {cite:wilkinson-nishapur-pottery p. 302}."
  en: "A new ware made at Nishapur after the Samanid period, with a white, gritty, hard body of ground quartz and an alkaline glaze, painted directly on the body and moulded thin; its typical colours were light blue and cobalt dark blue {cite:wilkinson-nishapur-pottery p. 302}."
  ur: "سامانی دور کے بعد نیشاپور میں شروع ہونے والے نئے ظروف، پسے ہوئے کوارٹز کے سفید سخت دانے دار بدن اور قلوی لعاب کے ساتھ؛ براہِ راست بدن پر نقش اور سانچوں میں پتلے برتن؛ رنگ ہلکا نیلا اور کوبالٹی گہرا نیلا {cite:wilkinson-nishapur-pottery p. 302}."
