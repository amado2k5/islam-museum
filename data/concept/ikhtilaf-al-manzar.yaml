summary:
  ar: "الفرق بين موضع الجرم كما يُرى من سطح الأرض وموضعه الحقيقي كما يُرى من مركزها، ويعرض للقمر وللكواكب القريبة من الأرض، وأكبره للقمر نحو درجة وأربع دقائق في الطول، ويزيد الانحراف عند الأفق، ولا يُحسّ للكواكب العلوية فوق الشمس. {cite:farghani-elements-astronomy p. 27}{cite:farghani-elements-astronomy p. 28}"
  en: "The difference between where a body appears from the earth's surface and where it lies as seen from the earth's centre. al-Farghani gives its largest value for the moon as about one degree four minutes in longitude, and says it is not perceptible for the planets above the sun {cite:farghani-elements-astronomy p. 27}{cite:farghani-elements-astronomy p. 28}."
