id: concept/ikhtilaf-al-manzar
class: concept
kind: scientific
label: { ar: "اختلاف المنظر", en: "Parallax", es: "Paralaje", fr: "Parallaxe" }
summary:
  ar: "الفرق بين موضع الجرم كما يُرى من سطح الأرض وموضعه الحقيقي كما يُرى من مركزها، ويعرض للقمر وللكواكب القريبة من الأرض، وأكبره للقمر نحو درجة وأربع دقائق في الطول، ويزيد الانحراف عند الأفق، ولا يُحسّ للكواكب العلوية فوق الشمس. {cite:farghani-elements-astronomy p. 27}{cite:farghani-elements-astronomy p. 28}"
  en: "The difference between where a body appears from the earth's surface and where it lies as seen from the earth's centre. al-Farghani gives its largest value for the moon as about one degree four minutes in longitude, and says it is not perceptible for the planets above the sun {cite:farghani-elements-astronomy p. 27}{cite:farghani-elements-astronomy p. 28}."
  es: "La diferencia entre dónde aparece un cuerpo desde la superficie terrestre y dónde se encuentra visto desde el centro de la Tierra. Al-Farghani da su valor máximo para la Luna en aproximadamente un grado y cuatro minutos de longitud, y dice que no es perceptible para los planetas que están por encima del Sol {cite:farghani-elements-astronomy p. 27}{cite:farghani-elements-astronomy p. 28}."
  fr: "La différence entre la position d'un corps vue de la surface de la Terre et sa position vue du centre de la Terre. Al-Farghani donne pour la Lune une valeur maximale d'environ un degré et quatre minutes en longitude, et affirme qu'elle est imperceptible pour les planètes situées au-dessus du Soleil {cite:farghani-elements-astronomy p. 27}{cite:farghani-elements-astronomy p. 28}."
  ur: "زمین کی سطح سے جسم کہاں ظاہر ہوتا ہے اور جہاں یہ زمین کے مرکز سے نظر آتا ہے اس کے درمیان فرق۔ الفرغانی نے چاند کے لیے اس کی سب سے بڑی قدر طول البلد میں تقریباً ایک ڈگری چار منٹ بتائی ہے، اور کہا ہے کہ یہ سورج کے اوپر والے سیاروں کے لیے قابل ادراک نہیں ہے۔ 27}{حوالہ:فرغانی-عناصر-فلکیات صفحہ۔ 28}۔"
