id: concept/canon-slimming-the-fat
class: concept
kind: scientific
label: { ar: "تقضيف السمين عند ابن سينا", en: "Slimming the fat in the Canon", ur: "موٹے کو دبلا کرنا قانون میں" }
summary:
  ar: "يختم ابن سينا التعليم الرابع بالفصل الخامس في تقضيف السمين، وتدبيره إسراع إحدار الطعام من معدته وأمعائه لئلا تستوفي الجداول مصها، واستعمال الطعام الكثير الكمية القليل التغذية، ومواترة الاستحمام قبل الطعام، والرياضة السريعة، والأدهان المحللة، ومن المعاجين الإطريفل الصغير ودواء اللك والترياق، وشرب الخل مع المري على الريق {cite:canon-ibn-sina-print-v1 p.257}."
  en: "Ibn Sina closes the fourth teaching with the fifth chapter, on slimming the fat; the regimen is to hasten the passage of food out of the stomach and intestines so the channels do not finish their sucking, to use food large in amount and low in nourishment, to bathe often before eating, to exercise briskly and use dissolving oils, among the electuaries the small itrifal, the lac remedy and theriac, and to drink vinegar with fermented sauce on an empty stomach {cite:canon-ibn-sina-print-v1 p.257}."
