id: concept/canon-slimming-the-fat
class: concept
kind: scientific
label: { ar: "تقضيف السمين عند ابن سينا", en: "Slimming the fat in the Canon", ur: "موٹے کو دبلا کرنا قانون میں", es: "Reducir la grasa en el Canon", fr: "Réduire la graisse dans le Canon", tr: "İbn Sina'ya göre yağ atmak", id: "Melempar lemak menurut Ibn Sina" }
summary:
  ar: "يختم ابن سينا التعليم الرابع بالفصل الخامس في تقضيف السمين، وتدبيره إسراع إحدار الطعام من معدته وأمعائه لئلا تستوفي الجداول مصها، واستعمال الطعام الكثير الكمية القليل التغذية، ومواترة الاستحمام قبل الطعام، والرياضة السريعة، والأدهان المحللة، ومن المعاجين الإطريفل الصغير ودواء اللك والترياق، وشرب الخل مع المري على الريق {cite:canon-ibn-sina-print-v1 p.257}."
  en: "Ibn Sina closes the fourth teaching with the fifth chapter, on slimming the fat; the regimen is to hasten the passage of food out of the stomach and intestines so the channels do not finish their sucking, to use food large in amount and low in nourishment, to bathe often before eating, to exercise briskly and use dissolving oils, among the electuaries the small itrifal, the lac remedy and theriac, and to drink vinegar with fermented sauce on an empty stomach {cite:canon-ibn-sina-print-v1 p.257}."
  es: "Ibn Sina cierra la cuarta enseñanza con el quinto capítulo, sobre cómo adelgazar; el régimen consiste en acelerar el paso de los alimentos fuera del estómago y los intestinos para que los conductos no terminen su succión, usar alimentos en grandes cantidades y bajos en nutrientes, bañarse a menudo antes de comer, hacer ejercicio vigoroso y usar aceites disolventes, entre los electuarios el itrifal pequeño, el remedio de laca y la teriaca, y beber vinagre con salsa fermentada en ayunas {cite:canon-ibn-sina-print-v1 p.257}."
  fr: "Ibn Sina conclut le quatrième enseignement par le cinquième chapitre, sur l'amincissement de la graisse; le régime consiste à accélérer le passage des aliments hors de l'estomac et des intestins afin que les méridiens ne terminent pas leur succion, à utiliser des aliments en grande quantité et pauvres en nutriments, à se baigner souvent avant de manger, à faire de l'exercice vigoureusement et à utiliser des huiles dissolvantes, parmi les électuaires le petit itrifal, le remède à base de laque et le thériaque, et à boire du vinaigre avec une sauce fermentée à jeun {cite:canon-ibn-sina-print-v1 p.257}."
  ur: "ابن سینا نے چوتھی درس کو پانچویں باب کے ساتھ ختم کیا، چربی کو کم کرنے پر۔ اس کا طریقہ یہ ہے کہ کھانا معدہ اور آنتوں سے جلدی سے باہر نکل جائے تاکہ نالیوں کا چوسنا ختم نہ ہو، کھانا زیادہ مقدار میں اور کم غذائیت کا استعمال کریں، کھانے سے پہلے اکثر غسل کریں، تیز ورزش کریں اور گھلنے والے تیلوں کا استعمال کریں، انتخابی طبقے کے درمیان چھوٹا اطریفل، لاکھ کا علاج اور تھیریاک، اور معدہ کے ساتھ پینا۔ {حوالہ:کینن ابن سینا پرنٹ v1 صفحہ 257}۔"
  tr: "İbn Sina, dördüncü öğretiyi beşinci bölümle sonlandırır; bu, yağ hazırlama, mide ve bağırsaklardan yiyecek kaybını hızlandırarak akarsuların emilimini engellemesi, az besin içeren büyük miktarda yiyecek tüketme, öğünlerden önce düzenli yıkanma, hızlı egzersiz, çözünmüş merhemler, atrifel, lake ve panzehir gibi küçük macunlar sürme ve aç karnına acı gözle sirke içme {cite:canon-ibn-sina-print-v1 s.257}."
  id: "Ibn Sina menutup ajaran keempat dengan bab kelima tentang persiapan ghee, pengelolaan percepatan kehilangan makanan dari lambung dan usus agar aliran tidak mengisi penyerapannya, mengonsumsi banyak makanan dengan nutrisi yang minim, mandi secara rutin sebelum makan, olahraga cepat, mengoleskan salep larut, pasta kecil seperti atrifel, lak, dan penawar, serta minum cuka dengan mata pahit saat perut kosong {cite:canon-ibn-sina-print-v1 hlm.257}."
