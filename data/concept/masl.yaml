summary:
  ar: "المصل في الكتاب رديء جداً لأصحاب السوداء، فإذا طبخ باللحم السمين صلح يسيراً، وهو ضار للمعدة وللمقعدة {cite:canon-ibn-sina-print-v1 p.574}."
  en: "Masl, whey, is in the book very bad for the melancholic, a little better when cooked with fat meat, and harmful to the stomach and the anus {cite:canon-ibn-sina-print-v1 p.574}."
  ur: "مصل ⁦(چھاچھ کا پانی)⁩ کتاب میں سوداوی مزاج والوں کے لیے بہت برا ہے، چربی والے گوشت کے ساتھ پکایا جائے تو کچھ بہتر ہوتا ہے، اور معدے اور مقعد کے لیے مضر ہے {cite:canon-ibn-sina-print-v1 p.574}۔"
  es: "Masl, suero, es en el libro muy malo para el melancólico, un poco mejor cuando se cocina con carne grasa, y dañino para el estómago y el ano {cite:canon-ibn-sina-print-v1 p.574}."
  fr: "Le lactosérum, selon le livre, est très mauvais pour les mélancoliques, un peu meilleur lorsqu'il est cuit avec de la viande grasse, et nocif pour l'estomac et l'anus {cite:canon-ibn-sina-print-v1 p.574}."
  tr: "Kitaptaki serum, siyah et yiyenler için çok kötü; yağlı etle pişirildiğinde hafifçe kürlenmiş ve mide ile damak için zararlıdır {cite:canon-ibn-sina-print-v1 s.574}."
  id: "Serum dalam buku ini sangat buruk bagi mereka yang memiliki daging hitam; jika dimasak dengan daging berlemak, serum ini sedikit diawetkan dan berbahaya bagi lambung serta lidah {cite:canon-ibn-sina-print-v1 hlm.574}."
