id: concept/mubalagha-fiqh
class: concept
kind: legal
label:
  ar: "المُبَالَغَة"
  en: "Mubalagha (thoroughness in acts of worship and in words)"
  ur: "مبالغہ ⁦(عبادات اور کلام میں انتہا تک جانا)⁩"
  es: "Mubalagha (minuciosidad en los actos de adoración y en las palabras)"
  fr: "Mubalagha (la minutie dans les actes de culte et dans les paroles)"
  tr: "Abartı"
  id: "Pembesaran"
summary:
  ar: "المبالغة في اللغة الاجتهاد وعدم التقصير، والمغالاة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13823}. اتفق الفقهاء على أن المبالغة في المضمضة والاستنشاق سنة لغير الصائم، وأما الصائم فمكروهة له، لحديث لقيط بن صبرة «وبالغ في الاستنشاق إلا أن تكون صائما» {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13823}. وذهب جمهور الفقهاء إلى استحباب إسباغ الوضوء بغسل ما فوق الواجب، لحديث أبي هريرة في الغرّ المحجلين، والحنابلة يرون المبالغة في دلك المواضع التي ينبو عنها الماء، والمالكية يوجبون الدلك {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13823-13824}. ويستحب عند الجمهور دلك العقب، وأما الإسراف في الغسل فمكروه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13824-13825}. والمالكية والشافعية يستحبون رفع الصوت بالأذان دون إجهاد، والحنفية يسنون الجهر، والحنابلة يجعلون رفع الصوت ركناً بقدر الطاقة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13825}. وفي المدح قال النووي إن النهي محمول على المجازفة والزيادة في الأوصاف، أما من لا يخاف عليه الفتنة فلا نهي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13825}."
  en: "Mubalagha, in lexicon, is striving and not falling short, or extravagance {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13823}. The jurists agree that thoroughness in rinsing the mouth and nose is sunna for one who is not fasting; for the fasting person it is disliked, on the hadith of Laqit ibn Sabra: be thorough in snuffing water unless you are fasting {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13823}. Most jurists recommend washing more than the obligatory parts in ablution, on the report of Abu Hurayra and the glowing faces and limbs of the community; the Hanbalis mean by thoroughness rubbing the places where water does not settle, the Malikis hold rubbing obligatory {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13823-13824}. Most recommend rubbing the heels, and extravagance in washing is disliked {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13824-13825}. The Malikis and Shafi'is recommend raising the voice in the call to prayer without strain; the Hanafis call it sunna and the Hanbalis make it a pillar, raised as far as one can {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13825}. On praise, al-Nawawi says the prohibition applies to exaggeration and to someone whom praise may corrupt; praise is not forbidden for a person of settled faith and sense {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13825}."
  ur: "مبالغہ لغت میں کوشش کرنے اور کوتاہی نہ کرنے، یا حد سے بڑھنے کو کہتے ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13823}۔ فقہاء کا اتفاق ہے کہ غیر روزہ دار کے لیے کلی اور ناک میں پانی ڈالنے میں مبالغہ سنت ہے، اور روزہ دار کے لیے مکروہ ہے، لقیط بن صبرہ کی حدیث کی بنا پر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13823}۔ جمہور کے نزدیک وضو میں فرض سے زائد دھونا مستحب ہے، ابو ہریرہ کی روایت کی بنا پر؛ حنابلہ کے نزدیک مبالغہ ان جگہوں کو ملنا ہے جہاں پانی نہیں ٹھہرتا، اور مالکیہ ملنے کو واجب کہتے ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13823-13824}۔ ایڑیوں کو ملنا جمہور کے نزدیک مستحب ہے، اور غسل میں اسراف مکروہ ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13824-13825}۔ اذان میں مالکیہ اور شافعیہ بغیر مشقت کے آواز بلند کرنے کو مستحب کہتے ہیں، حنفیہ سنت، اور حنابلہ طاقت کے مطابق بلند آواز کو رکن کہتے ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13825}۔ تعریف کے بارے میں نووی کے نزدیک ممانعت مبالغہ آمیز تعریف اور فتنے کے خوف والے شخص کے لیے ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13825}۔"
  es: "Mubalagha, en léxico, es esforzarse y no quedarse corto, o extravagancia {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13823}. Los juristas concuerdan en que la minuciosidad al enjuagarse la boca y la nariz es sunna para quien no está ayunando; para la persona que ayuna es desaconsejable, en el hadiz de Laqit ibn Sabra: sé minucioso al inhalar agua a menos que estés ayunando {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13823}. La mayoría de los juristas recomiendan lavar más que las partes obligatorias en la ablución, en el informe de Abu Hurayra y los rostros y miembros brillantes de la comunidad; Los hanbalíes entienden por minuciosidad frotar los lugares donde el agua no se asienta, los malikíes consideran que frotar es obligatorio {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13823-13824}. La mayoría recomienda frotar los talones, y la extravagancia en el lavado es desaconsejable {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13824-13825}. Los malikíes y shafi'ís recomiendan elevar la voz en la llamada a la oración sin esfuerzo; los hanafíes lo llaman sunna y los hanbalíes hacen que sea un pilar, elevado lo más alto que uno pueda {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13825}. Sobre la alabanza, al-Nawawi dice que la prohibición se aplica a la exageración y a alguien a quien la alabanza puede corromper; La alabanza no está prohibida para una persona de fe y entendimiento firmes {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13825}."
  fr: "Mubalagha, dans le lexique, signifie s'efforcer sans faillir, ou extravagance {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13823}. Les juristes s'accordent à dire que se rincer soigneusement la bouche et le nez est une sunna pour celui qui ne jeûne pas; pour celui qui jeûne, cela est déconseillé, selon le hadith de Laqit ibn Sabra: « Soyez minutieusement en train de vous rincer la bouche à l'eau, sauf si vous jeûnez » {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13823}. La plupart des juristes recommandent de laver plus que les parties obligatoires lors des ablutions, se basant sur le récit d'Abu Hurayra et sur l'éclat des visages et des membres de la communauté. Les Hanbalites entendent par « se frotter minutieusement » les endroits où l'eau ne stagne pas, tandis que les Malikites considèrent ce frottement comme obligatoire {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13823-13824}. La plupart recommandent de se frotter les talons, et l'excès dans les ablutions est déconseillé {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13824-13825}. Les Malikites et les Chafi'ites recommandent d'élever la voix lors de l'appel à la prière sans forcer; les Hanafites le considèrent comme une sunna et les Hanbalites comme une colonne, élevée aussi haut que possible {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13825}. Concernant les louanges, al-Nawawi précise que l'interdiction s'applique à l'exagération et à celui que les louanges pourraient corrompre. Les louanges ne sont pas interdites à une personne de foi et de bon sens établies {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13825}."
  tr: "Dilde abartı, ijtihad ve ihmalkarlıktan kaçınmak, abartı anlamına gelir {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.13823}. Hukukçular, aşırı yıkama ve nefes almanın oruç tutmayanlar için sünnet olduğu, ancak oruç tutan kişi için sevilmediği konusunda hemfikirdir; bu, Laqit ibn Sabra'nın hadisine dayanır: \"Ve oruç tutmadıkça nefes alırken abart\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13823}. Hukukçuların çoğu, Ebu Hureyre'nin muchecliyin (sığ mucal) hakkındaki hadislerine dayanarak, zorunluluğun ötesinde bir ghusl ile iyice abdest alınmasının tavsiye edildiği konusunda hemfikirdir. Hanbalılar suyun sızdığı alanları kullanmanın aşırıya kaçtığını düşünürken, Malikiler ovuşturmayı gerektirir {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.13823-13824}. Çoğunluğa göre, topuğun ovuşturulması önerilirken, aşırı yıkanmak hoş karşılanmaz {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13824-13825}. Malikiler ve Şafi'ler ezanla sesi zorlanmadan yükseltmeyi önerir, Hanafiler yüksek sesle okumayı önerir ve Hanbalılar sesi yükseltmeyi kapasiteye göre bir sütun yapar {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13825}. Al-Nawawi, övgü olarak, yasağın risk alma ve açıklama eklemek olarak yorumlandığını, ancak ayartmadan korkmayan kişinin yasak olmadığını {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13825} dedi."
  id: "Melebih-lebihkan dalam bahasa berarti ijtihad dan menghindari kelalaian, dan melebih-lebihkan {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13823}. Para ahli hukum sepakat bahwa membilas dan menghirup secara berlebihan adalah Sunnah bagi mereka yang tidak berpuasa, tetapi bagi orang yang berpuasa, hal ini tidak disukai olehnya, berdasarkan hadits Laqit ibn Sabra: \"Dan melebih-lebihkan dalam menghirup kecuali kamu sedang berpuasa\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13823}. Mayoritas ahli hukum setuju bahwa disarankan untuk melakukan wudhu secara menyeluruh dengan ghusl yang melebihi kewajiban, berdasarkan hadits Abu Huraira tentang mujhajliyin (mujal dangkal). Hanbal menganggap berlebihan menggunakan area tempat air memancar, sementara Malili memerlukan gosok {cite:Fiqh-Mawsua-Kuwaityya-Noor-V3 hlm.13823-13824}. Menurut mayoritas, disarankan untuk menggosok tumit, sementara pencucian berlebihan tidak disukai {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13824-13825}. Umat Malik dan Shafi'i menyarankan untuk meninggikan suara dengan adhan tanpa paksa, Hanafi menyarankan pembacaan keras, dan Hanbal menjadikan peninggiran suara sebagai pilar sesuai kapasitas {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13825}. Sebagai pujian, Al-Nawawi mengatakan bahwa larangan tersebut diartikan sebagai pengambilan risiko dan menambahkan deskripsi, tetapi siapa pun yang tidak takut akan godaan tidak dilarang {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13825}."
