id: concept/mubalagha-fiqh
class: concept
kind: legal
label:
  ar: "المُبَالَغَة"
  en: "Mubalagha (thoroughness in acts of worship and in words)"
  ur: "مبالغہ (عبادات اور کلام میں انتہا تک جانا)"
summary:
  ar: "المبالغة في اللغة الاجتهاد وعدم التقصير، والمغالاة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13823}. اتفق الفقهاء على أن المبالغة في المضمضة والاستنشاق سنة لغير الصائم، وأما الصائم فمكروهة له، لحديث لقيط بن صبرة «وبالغ في الاستنشاق إلا أن تكون صائما» {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13823}. وذهب جمهور الفقهاء إلى استحباب إسباغ الوضوء بغسل ما فوق الواجب، لحديث أبي هريرة في الغرّ المحجلين، والحنابلة يرون المبالغة في دلك المواضع التي ينبو عنها الماء، والمالكية يوجبون الدلك {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13823-13824}. ويستحب عند الجمهور دلك العقب، وأما الإسراف في الغسل فمكروه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13824-13825}. والمالكية والشافعية يستحبون رفع الصوت بالأذان دون إجهاد، والحنفية يسنون الجهر، والحنابلة يجعلون رفع الصوت ركناً بقدر الطاقة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13825}. وفي المدح قال النووي إن النهي محمول على المجازفة والزيادة في الأوصاف، أما من لا يخاف عليه الفتنة فلا نهي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13825}."
  en: "Mubalagha, in lexicon, is striving and not falling short, or extravagance {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13823}. The jurists agree that thoroughness in rinsing the mouth and nose is sunna for one who is not fasting; for the fasting person it is disliked, on the hadith of Laqit ibn Sabra: be thorough in snuffing water unless you are fasting {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13823}. Most jurists recommend washing more than the obligatory parts in ablution, on the report of Abu Hurayra and the glowing faces and limbs of the community; the Hanbalis mean by thoroughness rubbing the places where water does not settle, the Malikis hold rubbing obligatory {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13823-13824}. Most recommend rubbing the heels, and extravagance in washing is disliked {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13824-13825}. The Malikis and Shafi'is recommend raising the voice in the call to prayer without strain; the Hanafis call it sunna and the Hanbalis make it a pillar, raised as far as one can {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13825}. On praise, al-Nawawi says the prohibition applies to exaggeration and to someone whom praise may corrupt; praise is not forbidden for a person of settled faith and sense {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13825}."
  ur: "مبالغہ لغت میں کوشش کرنے اور کوتاہی نہ کرنے، یا حد سے بڑھنے کو کہتے ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13823}۔ فقہاء کا اتفاق ہے کہ غیر روزہ دار کے لیے کلی اور ناک میں پانی ڈالنے میں مبالغہ سنت ہے، اور روزہ دار کے لیے مکروہ ہے، لقیط بن صبرہ کی حدیث کی بنا پر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13823}۔ جمہور کے نزدیک وضو میں فرض سے زائد دھونا مستحب ہے، ابو ہریرہ کی روایت کی بنا پر؛ حنابلہ کے نزدیک مبالغہ ان جگہوں کو ملنا ہے جہاں پانی نہیں ٹھہرتا، اور مالکیہ ملنے کو واجب کہتے ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13823-13824}۔ ایڑیوں کو ملنا جمہور کے نزدیک مستحب ہے، اور غسل میں اسراف مکروہ ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13824-13825}۔ اذان میں مالکیہ اور شافعیہ بغیر مشقت کے آواز بلند کرنے کو مستحب کہتے ہیں، حنفیہ سنت، اور حنابلہ طاقت کے مطابق بلند آواز کو رکن کہتے ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13825}۔ تعریف کے بارے میں نووی کے نزدیک ممانعت مبالغہ آمیز تعریف اور فتنے کے خوف والے شخص کے لیے ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13825}۔"
