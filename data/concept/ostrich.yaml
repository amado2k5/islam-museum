label:
  ar: "النعامة"
  en: "The ostrich"
  ur: "شتر مرغ"
  es: "El avestruz"
  fr: "L'autruche"
  tr: "devekuşu"
  id: "burung unta"
summary:
  ar: "ذكرت السنة بيضة النعامة في الأحكام، وقدّرها مالك بعشر ثمن البدنة فيما يتلف المحرم من النعام، والعرب كانت تعلّق بيضها في القباب."
  en: "The sunna remembers the ostrich's egg in rulings: Malik valued it at a tenth of the price of a sacrificial camel for what an ihram pilgrim destroys, and the Arabs hung its eggs in their domes."
  ur: "سنت میں شتر مرغ کے انڈے کا ذکر احکام میں آیا ہے: مالک نے احرام میں تلف شدہ شتر مرغ کے انڈے کی قیمت قربانی کے اونٹ کے دسویں حصے پر مقرر کی اور عرب اس کے انڈے گنبدوں میں لٹکاتے تھے۔"
  es: "La Sunna recuerda el huevo de avestruz en sus dictámenes: Malik lo valoró en una décima parte del precio de un camello de sacrificio por lo que destruye un peregrino en estado de ihram, y los árabes colgaban sus huevos en sus cúpulas."
  fr: "La sunna fait mention de l'œuf d'autruche dans ses décisions: Malik l'estimait à un dixième du prix d'un chameau sacrificiel pour ce qu'un pèlerin en état d'ihram détruit, et les Arabes suspendaient ses œufs dans leurs dômes."
  tr: "Sünnet, hükümlerde devekuşu yumurtasından bahsetmiş ve Malik, Muharrem ayında yok edilen devekuşu yumurtasının onda biri olarak tahmin etmiştir. Araplar yumurtalarını kubbelere asarlardı."
  id: "Sunnah menyebutkan telur burung unta dalam keputusan, dan Malik memperkirakannya sepersepuluh dari harga burung unta yang dihancurkan pada bulan Muharram. Orang Arab biasa menggantung telur mereka di kubah."
