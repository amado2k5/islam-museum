id: "concept/al-hawal"
class: "concept"
kind: "scientific"
label:
  ar: "الحول في العين"
  en: "Squint in the eye (hawal, medical)"
  fr: "Le strabisme (hawal, médecine)"
  ur: "آنکھ کا حول"
summary:
  ar: "قد يكون الحول لاسترخاء بعض العضل المحركة للمقلة فتميل عن تلك الجهة إلى الجهة المضادة لها وقد يكون من تشنج بعضها فتميل المقلة إلى جهتها، وكيف كان فقد يكون عن رطوبة وقد يعرض عن يبوسة كما يعرض في الأمراض الحادة، وزوال العين إلى فوق وأسفل هو الذي يري الشيء شيئين وأما إلى الجانبين فلا يضر البصر ضرراً يعتد به، والمولود به لا يبرأ إلا في حال الطفولية الرطبة جداً فربما رجي ⁦(أسماء الأدوية لا تحمل)⁩ {cite:canon-ibn-sina-print-v2 p.189}"
  en: "Squint may be from relaxation of some of the muscles moving the eyeball, so it inclines from that side to the opposite side, or from convulsion of some of them so the eyeball inclines toward them; either way it may be from moisture and may occur from dryness as in the acute diseases; the eye's turning up and down is what shows one thing as two, while sideways does not harm sight appreciably; the congenital does not heal except in very moist childhood, where it may be hoped for ⁦(drug names are not carried)⁩ {cite:canon-ibn-sina-print-v2 p.189}"
  fr: "Dans le Canon, le strabisme peut venir du relâchement de certains muscles qui meuvent le globe oculaire, lequel dévie alors du côté opposé, ou de leur contraction, qui l’attire de leur côté. Dans les deux cas, il peut tenir à l’humidité ou à la sécheresse, comme dans les maladies aiguës. La déviation vers le haut ou vers le bas fait voir double, tandis que la déviation latérale n’altère pas sensiblement la vue. La forme congénitale ne guérit pas, sauf dans la petite enfance, tenue pour très humide, où une guérison est espérée (les noms des remèdes ne sont pas repris) {cite:canon-ibn-sina-print-v2 p.189}"
  ur: "حول مقلہ حرکت دینے والے پٹھوں میں سے بعض کے استرخاء سے ہو سکتا ہے تو وہ اس طرف سے مخالف طرف جھک جائے، یا بعض کے تشنج سے ہو تو مقلہ انہی کی طرف جھکے؛ اور ہر صورت میں رطوبت سے بھی ہو سکتا ہے اور خشکی سے بھی عرض ہو سکتا ہے جیسا حاد امراض میں ہوتا ہے؛ اور آنکھ کا اوپر نیچے ہٹ جانا وہ ہے جو ایک چیز کو دو دکھاتا ہے جبکہ دائیں بائیں کا ہٹنا نظر کو قابل اعتبار نقصان نہیں دیتا؛ اور پیدائشی شفا نہیں پاتا سوائے نہایت تر طفولیت کی حالت میں جہاں امید کی جا سکتی ہے ⁦(ادویہ کے نام منقول نہیں)⁩ {cite:canon-ibn-sina-print-v2 p.189}"
