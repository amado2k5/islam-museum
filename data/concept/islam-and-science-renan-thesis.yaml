id: concept/islam-and-science-renan-thesis
class: concept
kind: term
label: { ar: "أطروحة عداء الإسلام للعلم والفلسفة عند رينان", en: "Renan's thesis that Islam was hostile to science and philosophy" }
issue:
  ar: "هل حارب الإسلام العلم والفلسفة؟ وهل يرجع الفكر العربي إلى اليونان وحدهم؟"
summary:
  ar: "أطروحة ينقلها غلاب عن إرنست رينان في كتابه «الإسلام والعلم»: أن الإسلام كبح حرية الفكر والعلم، وأن العرب لم يعرفوا التفكير إلا بعد الترجمة {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 46} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 47}. يذكر غلاب أنها شاعت في الأوساط الأوروبية، وأنها نُشرت في مصر دون رد، ويعود غلاب في هذا الكتاب إلى ردّها {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 47}. ويعرض في رده أقوال كارادي فو عن القرآن بوصفه كتاباً يعرض مسائل فلسفية في صورة إلهامية {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 47} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 49}، ويعدّ رينان من الكتّاب الذين وقعوا في أخطاء جسيمة في حق الإسلام {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 40}. هذه أطروحة رينان كما عرضها غلاب، وليست حكماً من المتحف."
  en: "A thesis that Ghallab reports from Ernest Renan in his book on Islam and science: that Islam restrained freedom of thought and science, and that the Arabs did not know reasoning until after translation {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 46} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 47}. Ghallab notes that it spread in European circles and was published in Egypt without reply, and he returns in this book to refute it {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 47}. In his rebuttal he cites Carra de Vaux's view of the Qur'an as a book presenting philosophical questions in the form of inspiration {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 47} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 49}, and he counts Renan among the writers who fell into grave errors about Islam {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 40}. This is Renan's thesis as Ghallab presents it, not a verdict of the museum."
perspectives:
  - tradition: sunni
    id: ghallab-rebuts-renan
    stance:
      ar: "الإسلام قام بالنظر والعقل، والفلسفة الصحيحة لا تصطدم بحقائق القرآن"
    summary:
      ar: "يرى غلاب أن الفلسفة العربية نبعت من التفكير في القرآن قبل أن تُترجم كتب اليونان، وأن الترجمة نقلٌ لا يصح أن يُعدّ فلسفة وحدها {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 24}. هذا رأي غلاب، ويُنسب هنا إليه."
