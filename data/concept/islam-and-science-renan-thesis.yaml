id: concept/islam-and-science-renan-thesis
class: concept
kind: term
label: { ar: "أطروحة عداء الإسلام للعلم والفلسفة عند رينان", en: "Renan's thesis that Islam was hostile to science and philosophy", es: "La tesis de Renan de que el Islam era hostil a la ciencia y la filosofía", fr: "La thèse de Renan selon laquelle l'islam était hostile à la science et à la philosophie" }
issue:
  ar: "هل حارب الإسلام العلم والفلسفة؟ وهل يرجع الفكر العربي إلى اليونان وحدهم؟"
summary:
  ar: "أطروحة ينقلها غلاب عن إرنست رينان في كتابه «الإسلام والعلم»: أن الإسلام كبح حرية الفكر والعلم، وأن العرب لم يعرفوا التفكير إلا بعد الترجمة {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 46} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 47}. يذكر غلاب أنها شاعت في الأوساط الأوروبية، وأنها نُشرت في مصر دون رد، ويعود غلاب في هذا الكتاب إلى ردّها {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 47}. ويعرض في رده أقوال كارادي فو عن القرآن بوصفه كتاباً يعرض مسائل فلسفية في صورة إلهامية {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 47} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 49}، ويعدّ رينان من الكتّاب الذين وقعوا في أخطاء جسيمة في حق الإسلام {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 40}. هذه أطروحة رينان كما عرضها غلاب، وليست حكماً من المتحف."
  en: "A thesis that Ghallab reports from Ernest Renan in his book on Islam and science: that Islam restrained freedom of thought and science, and that the Arabs did not know reasoning until after translation {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 46} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 47}. Ghallab notes that it spread in European circles and was published in Egypt without reply, and he returns in this book to refute it {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 47}. In his rebuttal he cites Carra de Vaux's view of the Qur'an as a book presenting philosophical questions in the form of inspiration {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 47} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 49}, and he counts Renan among the writers who fell into grave errors about Islam {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 40}. This is Renan's thesis as Ghallab presents it, not a verdict of the museum."
  es: "Una tesis que Ghallab recoge de Ernest Renan en su libro sobre el Islam y la ciencia: que el Islam restringió la libertad de pensamiento y la ciencia, y que los árabes no conocieron el razonamiento hasta después de la traducción {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 46} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 47}. Ghallab señala que se difundió en círculos europeos y se publicó en Egipto sin respuesta, y vuelve en este libro para refutarla {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 47}. En su refutación cita la visión de Carra de Vaux del Corán como un libro que presenta cuestiones filosóficas en forma de inspiración {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 47} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 49}, y cuenta a Renan entre los escritores que cayeron en graves errores sobre el Islam {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 40}. Esta es la tesis de Renan tal como la presenta Ghallab, no un veredicto del museo."
  fr: "Une thèse rapportée par Ghallab d'après Ernest Renan dans son ouvrage sur l'islam et la science: l'islam aurait restreint la liberté de pensée et la science, et les Arabes n'auraient pas connu le raisonnement avant la traduction du Coran (voir: al-islam-kama-yarahu-al-urubiyyun-azhar, p. 46 et p. 47). Ghallab note que cette thèse s'est répandue dans les milieux européens et a été publiée en Égypte sans susciter de réaction; il y revient dans le présent ouvrage pour la réfuter (voir: al-islam-kama-yarahu-al-urubiyyun-azhar, p. 47). Dans sa réfutation, il cite l'interprétation du Coran par Carra de Vaux, selon laquelle il s'agit d'un livre présentant des questions philosophiques sous forme d'inspiration (voir: al-islam-kama-yarahu-al-urubiyyun-azhar, p. 47). 47} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 49}, et il compte Renan parmi les auteurs qui ont commis de graves erreurs au sujet de l'islam {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 40}. Il s'agit là de la thèse de Renan telle que Ghallab la présente, et non d'un verdict du musée."
