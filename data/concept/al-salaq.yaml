  en: "Salaq (lid-margin thickening)"
  ur: "سلاق"
summary:
  ar: "السلاق ويسمى باليونانية أنيوسيما غلظ في الأجفان عن مادة غليظة رديئة أكالة بورقية تحمر لها الأجفان وينتثر الهدب ويؤدي إلى تقرح أشفار الجفن ويتبعه فساد العين، ومنه عتيق رديء؛ فالحديث ينتفع بضمادات وإدمان الحمام من أنفع المعالجات له، وأما العتيق المزمن فيجب فيه التنقية والاستفراغ وإدامة الحمام ⁦(مواضع الحجامة والفصد وأسماء الأدوية ونسخها لا تحمل)⁩ {cite:canon-ibn-sina-print-v2 p.193}"
  en: "Salaq — called in the book's Greek anyusima — is a thickening in the lids from a thick, bad, eating, boracic matter by which the lids redden, the lashes fall out and it leads to ulceration of the lid margins, eye corruption following; some of it is old and bad; the recent benefits from poultices and constant bathing is among its most beneficial treatments, while the old chronic needs cleansing, evacuation and constant bathing ⁦(cupping and venesection sites, drug names and recipes are not carried)⁩ {cite:canon-ibn-sina-print-v2 p.193}"
  ur: "سلاق — جسے کتاب میں یونانی نام أنيوسيما سے پکارا گیا — پلکوں میں گاڑھا پن ہے ایک موٹے بُرے کاٹنے والے بورقی مادے سے جس سے پلکیں سرخ ہوتی ہیں، ہدب جھڑتا ہے اور پلک کے کناروں کا قرحہ تک پہنچتا ہے اور آنکھ کی خرابی اس کے پیچھے آتی ہے؛ اس میں سے کچھ پرانا بُرا ہوتا ہے؛ نیا ضمادوں سے فائدہ اٹھاتا ہے اور مسلسل حمام اس کے مفید ترین علاجوں میں ہے، جبکہ پرانا مزمن تنقیہ، استفراغ اور مسلسل حمام چاہتا ہے ⁦(حجامت و فصد کے مقامات، ادویہ کے نام اور نسخے منقول نہیں)⁩ {cite:canon-ibn-sina-print-v2 p.193}"
