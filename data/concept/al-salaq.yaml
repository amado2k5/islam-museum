label:
  ar: "السلاق"
  en: "Salaq (lid-margin thickening)"
  fr: "Salaq (épaississement du bord des paupières)"
  ur: "سلاق"
  es: "Salaq (engrosamiento del margen palpebral)"
summary:
  ar: "السلاق ويسمى باليونانية أنيوسيما غلظ في الأجفان عن مادة غليظة رديئة أكالة بورقية تحمر لها الأجفان وينتثر الهدب ويؤدي إلى تقرح أشفار الجفن ويتبعه فساد العين، ومنه عتيق رديء؛ فالحديث ينتفع بضمادات وإدمان الحمام من أنفع المعالجات له، وأما العتيق المزمن فيجب فيه التنقية والاستفراغ وإدامة الحمام ⁦(مواضع الحجامة والفصد وأسماء الأدوية ونسخها لا تحمل)⁩ {cite:canon-ibn-sina-print-v2 p.193}"
  en: "Salaq — called in the book's Greek anyusima — is a thickening in the lids from a thick, bad, eating, boracic matter by which the lids redden, the lashes fall out and it leads to ulceration of the lid margins, eye corruption following; some of it is old and bad; the recent benefits from poultices and constant bathing is among its most beneficial treatments, while the old chronic needs cleansing, evacuation and constant bathing ⁦(cupping and venesection sites, drug names and recipes are not carried)⁩ {cite:canon-ibn-sina-print-v2 p.193}"
  fr: "Le salaq — appelé dans le grec du livre anyusima — est un épaississement des paupières dû à une matière épaisse, mauvaise, rongeante et boracique, par laquelle les paupières rougissent, les cils tombent et qui conduit à l’ulcération des bords des paupières, suivie d’une altération de l’œil ; il en est une forme ancienne et mauvaise ; la forme récente tire profit des cataplasmes, et le bain assidu compte parmi ses traitements les plus bénéfiques, tandis que la forme ancienne et chronique exige la purification, l’évacuation et le bain assidu (les points de ventouse et de saignée, les noms et les recettes des remèdes ne sont pas repris) {cite:canon-ibn-sina-print-v2 p.193}"
  ur: "سلاق — جسے کتاب میں یونانی نام أنيوسيما سے پکارا گیا — پلکوں میں گاڑھا پن ہے ایک موٹے بُرے کاٹنے والے بورقی مادے سے جس سے پلکیں سرخ ہوتی ہیں، ہدب جھڑتا ہے اور پلک کے کناروں کا قرحہ تک پہنچتا ہے اور آنکھ کی خرابی اس کے پیچھے آتی ہے؛ اس میں سے کچھ پرانا بُرا ہوتا ہے؛ نیا ضمادوں سے فائدہ اٹھاتا ہے اور مسلسل حمام اس کے مفید ترین علاجوں میں ہے، جبکہ پرانا مزمن تنقیہ، استفراغ اور مسلسل حمام چاہتا ہے ⁦(حجامت و فصد کے مقامات، ادویہ کے نام اور نسخے منقول نہیں)⁩ {cite:canon-ibn-sina-print-v2 p.193}"
  es: "Salaq —llamado en griego anyusima en el libro— es un engrosamiento de los párpados causado por una sustancia bóraca espesa, tóxica y corrosiva que provoca enrojecimiento de los párpados, caída de las pestañas y ulceración de los bordes palpebrales, con la consiguiente corrupción ocular; algunos casos son antiguos y graves; los beneficios recientes de las cataplasmas y los baños constantes se encuentran entre sus tratamientos más beneficiosos, mientras que los casos crónicos antiguos requieren limpieza, evacuación y baños constantes (no se incluyen sitios para la ventosaterapia ni flebotomía, nombres de medicamentos ni recetas) {cite:canon-ibn-sina-print-v2 p.193}"
