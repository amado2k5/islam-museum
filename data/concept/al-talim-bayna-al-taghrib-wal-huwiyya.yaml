- tradition: sunni
  id: mission-driven-islamic-schools
  stance:
    ar: "المدارس الإسلامية ذات الرسالة تجمع بين التفكير النقدي والشخصية الإسلامية"
    en: "Mission-driven Islamic schools combine critical thinking with an Islamic personality"
    ur: "مقصدیت رکھنے والے اسلامی اسکول تنقیدی فکر اور اسلامی شخصیت کو جمع کرتے ہیں"
  summary:
    ar: "رأت بشرى قدومي، رئيسة الملتقى الثقافي التربوي للمدارس الخاصة في الأردن، أن المدارس الإسلامية تأخذ بأحدث النظريات، وأن العبرة باستعداد الناس للتعلم لا بالمال، وأن أبناءها في مدرسة إسلامية ثنائية اللغة نشأوا محاورين؛ ورأى أحمد ملحم أن الفرق في الاستطلاع فرقُ تعليمٍ ذي رسالة وتعليم بلا رسالة؛ وقال إسحق الفرحان إنه صوّت للمدارس الإسلامية لأنه لا يريد شخصية في فراغ بل شخصية إسلامية {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:14:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:15:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:21:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:29:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:30:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:37:30}."
    en: "Bushra Qadoumi, head of the cultural and educational forum of private schools in Jordan, held that Islamic schools adopt the newest theories, that what counts is people's readiness to learn rather than money, and that her own children, in a bilingual Islamic school, grew up as confident debaters; Ahmad Milhim held that the gap in the poll is the gap between education with a mission and education without one; and Ishaq al-Farhan said he voted for Islamic schools because he wants not a personality in a vacuum but an Islamic personality {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:14:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:15:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:21:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:29:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:30:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:37:30}."
    ur: "اردن کے نجی اسکولوں کے ثقافتی و تعلیمی فورم کی صدر بشریٰ قدومی کے نزدیک اسلامی اسکول جدید ترین نظریات اپناتے ہیں، اصل چیز لوگوں کی سیکھنے کی آمادگی ہے نہ کہ پیسہ، اور ان کے بچے ایک دو لسانی اسلامی اسکول میں پر اعتماد مکالمہ کرنے والے بنے؛ احمد ملحم کے نزدیک رائے شماری کا فرق بامقصد اور بے مقصد تعلیم کا فرق ہے؛ اور اسحاق الفرحان نے کہا کہ انہوں نے اسلامی اسکولوں کو ووٹ دیا کیونکہ وہ خلا میں شخصیت نہیں بلکہ اسلامی شخصیت چاہتے ہیں {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:14:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:21:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:30:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:37:30}."
