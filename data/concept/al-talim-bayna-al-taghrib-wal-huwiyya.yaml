- tradition: sunni
  id: presenter-take-merits-keep-identity
  stance:
    ar: "رأي المقدّم (رأي المتحدث): نأخذ مزايا التعليم الأجنبي ونحفظ هويتنا — إرادة سياسية بعيدة المدى، وحل مؤقت قريب"
    en: "The presenter's view (speaker's opinion): take the merits of foreign education and keep our identity — long-term political will, a short-term interim solution"
    ur: "میزبان کی رائے (مقرر کی رائے): غیر ملکی تعلیم کی خوبیاں لیں اور اپنا تشخص بچائیں — طویل مدت میں سیاسی ارادہ، قریبی مدت میں عارضی حل"
  summary:
    ar: "قال طارق السويدان إنه لا مقارنة بين مستوى المناهج العربية والغربية في العلوم والرياضيات، وإن في المدارس الأجنبية تأثيراً واضحاً في الهوية واللغة العربية وفساداً أخلاقياً في كثير منها؛ ورأى الحل البعيد في إرادة سياسية جماعية لتعليم عالٍ باللغة الوطنية، والحل القريب في الاستفادة من المناهج الغربية في العلوم البحتة مع إعداد مدرسين عرب في كليات للمعلمين {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:23:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 01:17:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 01:18:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 01:18:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 01:19:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 01:19:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 01:20:00}."
    en: "Tareq al-Suwaidan said there is no comparison between the level of Arab and Western curricula in science and mathematics, and that foreign schools have a clear effect on identity and on Arabic, with moral corruption in many of them; he saw the long-term solution in a collective political will for high-quality education in the national language, and the short-term one in using Western curricula in the pure sciences while preparing Arab teachers in teachers' colleges {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:23:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 01:17:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 01:18:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 01:18:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 01:19:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 01:19:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 01:20:00}."
    ur: "طارق السویدان نے کہا کہ سائنس اور ریاضی میں عرب اور مغربی نصاب کے معیار میں کوئی مقابلہ نہیں، اور غیر ملکی اسکولوں کا تشخص اور عربی زبان پر واضح اثر ہے اور ان میں سے بہت سوں میں اخلاقی بگاڑ ہے؛ ان کے نزدیک طویل مدتی حل قومی زبان میں اعلیٰ تعلیم کے لیے اجتماعی سیاسی ارادہ ہے، اور قریبی حل خالص سائنسی مضامین میں مغربی نصاب سے استفادہ اور اساتذہ کے کالجوں میں عرب اساتذہ کی تیاری ہے {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:23:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 01:18:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 01:18:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 01:19:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 01:20:00}."
