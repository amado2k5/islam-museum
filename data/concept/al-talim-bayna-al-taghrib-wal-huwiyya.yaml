id: concept/al-talim-bayna-al-taghrib-wal-huwiyya
class: concept
kind: social
label:
  ar: "التعليم بين التغريب والحفاظ على الهوية"
  en: "Education between westernisation and preserving identity"
  ur: "تعلیم، مغربیت اور تشخص کی حفاظت کے درمیان"
issue:
  ar: "هل انتشار المدارس والجامعات الأجنبية في البلاد العربية نعمة أم مصيبة: هل هي أفضل في التحصيل وبناء الشخصية، وهل تضرّ بالهوية واللغة والدين، وكيف يُجمع بين مستوى تعليمي عالٍ والحفاظ على الهوية؟"
  en: "Is the spread of foreign schools and universities in Arab countries a blessing or a calamity: are they better at learning and at building character, do they harm identity, language and religion, and how can a high standard of education be combined with preserving identity?"
  ur: "کیا عرب ممالک میں غیر ملکی اسکولوں اور جامعات کا پھیلاؤ نعمت ہے یا مصیبت: کیا یہ تحصیلِ علم اور شخصیت سازی میں بہتر ہیں، کیا یہ تشخص، زبان اور دین کو نقصان پہنچاتے ہیں، اور اعلیٰ تعلیمی معیار کو تشخص کی حفاظت کے ساتھ کیسے جمع کیا جائے؟"
summary:
  ar: "حلقة «الوسطية» عن التعليم الأجنبي في البلاد العربية. رأى 42% من جمهور الاستوديو أن المدارس الأجنبية أفضل في العلوم والرياضيات، و45% أن المدارس الإسلامية أقدر على بناء الشخصية مقابل 42% للأجنبية، و60% فقط أن المدارس العربية أحفظ للهوية؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:06:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:29:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:47:00} ووافق 85% على استعمال المناهج الغربية بلغاتها في العلوم حلاً مؤقتاً. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 01:03:30} وختم المقدّم بأنه يريد مزايا التعليم الأجنبي مع البقاء عرباً ومسلمين. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 01:20:00}"
  en: "The 'Al-Wasatiyya' episode on foreign education in Arab countries. Of the studio audience, 42% thought foreign schools better in science and mathematics, 45% thought Islamic schools better at building character against 42% for foreign schools, and only 60% thought Arab schools better at preserving identity; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:06:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:29:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:47:00} 85% agreed to using Western curricula in their own languages for the sciences as a temporary solution. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 01:03:30} The presenter closed by saying he wants the merits of foreign education while remaining Arabs and Muslims. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 01:20:00}"
  ur: "عرب ممالک میں غیر ملکی تعلیم پر «الوسطیہ» کی قسط۔ اسٹوڈیو حاضرین میں سے 42% کے نزدیک غیر ملکی اسکول سائنس اور ریاضی میں بہتر ہیں، 45% کے نزدیک اسلامی اسکول شخصیت سازی میں بہتر ہیں جبکہ 42% نے غیر ملکی اسکولوں کو چنا، اور صرف 60% کے نزدیک عرب اسکول تشخص کی بہتر حفاظت کرتے ہیں؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:06:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:29:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:47:00} 85% نے سائنسی مضامین میں مغربی نصاب کو ان کی اپنی زبانوں میں عارضی حل کے طور پر استعمال کرنے سے اتفاق کیا۔ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 01:03:30} میزبان نے یہ کہہ کر اختتام کیا کہ وہ غیر ملکی تعلیم کی خوبیاں چاہتے ہیں مگر عرب اور مسلمان رہتے ہوئے۔ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 01:20:00}"
sensitivity: contested
perspectives:
- tradition: sunni
  id: deliberate-colonial-project
  stance:
    ar: "التعليم الأجنبي جاء مع الهجمة الاستعمارية والتبشير، وأثره في الهوية متعمَّد"
    en: "Foreign education came with the colonial onslaught and missionary work, and its effect on identity is deliberate"
    ur: "غیر ملکی تعلیم استعماری یلغار اور تبشیر کے ساتھ آئی، اور تشخص پر اس کا اثر دانستہ ہے"
  summary:
    ar: "رأى مهدي أحمد صدقي الدجاني أن المدارس الأجنبية في البلاد العربية أوروبية وأمريكية لا تخرج عن معادلة الهجمة الغربية في القرنين الماضيين، وأنها جاءت لإعداد نخبة تخدم أجندة المستعمر، ودعا إلى نماذج تراثية كالمحضرة الموريتانية وإلى الحلول الفردية بملازمة الشيوخ؛ ووافقه إسحق الفرحان في التعمد، وربطه بإرسال المبشرين منذ احتكاك الغرب بالمسلمين {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:36:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:37:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:53:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:54:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:55:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:56:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 01:10:30}."
    en: "Mahdi Ahmad Sidqi al-Dajani held that the foreign schools in Arab countries are European and American and belong to the Western onslaught of the last two centuries, that they came to prepare an elite serving the coloniser's agenda, and he pointed to traditional models such as the Mauritanian mahdara and to individual study with shaykhs; Ishaq al-Farhan agreed that the effect is deliberate and tied it to the sending of missionaries since the West's contact with Muslims {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:36:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:37:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:53:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:54:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:55:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:56:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 01:10:30}."
    ur: "مہدی احمد صدقی الدجانی کے نزدیک عرب ممالک کے غیر ملکی اسکول یورپی اور امریکی ہیں اور پچھلی دو صدیوں کی مغربی یلغار کا حصہ ہیں، وہ استعمار کے ایجنڈے کی خدمت کرنے والی اشرافیہ تیار کرنے آئے؛ انہوں نے موریتانیہ کی محضرہ جیسے روایتی نمونوں اور شیوخ کی صحبت کی انفرادی راہ کی طرف اشارہ کیا؛ اسحاق الفرحان نے دانستگی سے اتفاق کیا اور اسے مغرب کے مسلمانوں سے رابطے کے وقت سے مبشرین بھیجنے سے جوڑا {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:37:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:54:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:55:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 00:56:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep38 01:10:30}."
