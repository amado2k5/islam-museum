id: concept/tarjama
class: concept
kind: legal
label:
  ar: "الترجمة"
  en: "Tarjama (translation, and speaking in other tongues in worship and law)"
  ur: "ترجمہ (زبان کا ترجمہ اور دوسری زبان میں عبادت و عقد)"
summary:
  ar: "الترجمة نقل الكلام بلسان غير لسانه، وتفترق عن التفسير لأنها تكون بقدر الكلام دون زيادة. ولا يسمى المترجم قرآنا، وتجوز قراءة القرآن بغير العربية في غير الصلاة عند جماعة، وخلاف في الصلاة. ويجوز عقد النكاح والطلاق بغير العربية عند أكثر الفقهاء، وتجوز الترجمة في القضاء بعدلين أو أكثر عند الشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4938} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4942} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4945} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4946}"
  en: "Tarjama is conveying speech in another tongue. It differs from tafsir in that it keeps to the amount of the speech, without addition. A translation is not called the Qur'an, and reciting the Qur'an in another tongue is allowed outside prayer by a group of jurists, with dispute inside prayer. Marriage and divorce in another tongue are valid for most jurists, and a judge may use a translator, who must be two just men according to the Shafi'is and Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4938} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4942} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4945} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4946}"
