label:
  ar: الخطأ والنسيان
  en: Error and forgetfulness
  es: "Error y olvido"
  fr: "Erreur et oubli"
summary:
  ar: "الخطأ والنسيان في حديث ابن عباس — التاسع والثلاثون من الأربعين — مما تجاوز الله به عن هذه الأمة: «إن الله تجاوز لي عن أمتي الخطأ والنسيان وما استكرهوا عليه» — فالخطأ فعل المحظور بغير قصد، والنسيان ترك المأمور أو فعل المنهي لذهول القلب عنه، وكلاهما يرفع المؤاخذة على القول الراجح عند شراح الحديث لانتفاء القصد الموجب للتكليف، وإن تعلق بالخطأ ضمان في المال كالقصاص في القتل الخطأ والرق في الأحكام ⁦(جامع العلوم والحكم ص 796–797)⁩."
  en: "Error and forgetfulness in Ibn Abbas's hadith — the thirty-ninth of the Forty — are among what God lifted from this community: 'God has pardoned for my sake on behalf of my community error, forgetfulness, and what they were coerced into' — error being the doing of the prohibited without intent, and forgetfulness the omitting of a command or doing of a prohibition through the heart's heedlessness, both lifting accountability on the commentators' prevailing reading since culpable intent is absent, while worldly consequences may still attach to error, such as the blood-money and expiation rulings for accidental killing (Jami' al-Ulum wal-Hikam pp. 796–797)."
  es: "En el hadiz de Ibn Abbas —el trigésimo noveno de los Cuarenta—, el error y el olvido se encuentran entre lo que Dios eliminó de esta comunidad: «Dios ha perdonado por mi causa, en nombre de mi comunidad, el error, el olvido y aquello a lo que fueron obligados» —el error es hacer lo prohibido sin intención, y el olvido es omitir un mandato o hacer lo prohibido por descuido del corazón—, ambos eximiendo de responsabilidad según la interpretación predominante de los comentaristas, ya que no hay intención culpable, mientras que las consecuencias mundanas aún pueden derivarse del error, como las normas sobre la indemnización por homicidio accidental (Jami' al-Ulum wal-Hikam, págs. 796-797)."
  fr: "L'erreur et l'oubli mentionnés dans le hadith d'Ibn Abbas — le trente-neuvième des quarante — figurent parmi les fautes que Dieu a pardonnées à cette communauté: « Dieu a pardonné pour moi, au nom de ma communauté, l'erreur, l'oubli et les actes auxquels ils ont été contraints. » L'erreur étant l'accomplissement de l'interdit sans intention, et l'oubli l'omission d'un commandement ou l'accomplissement d'une interdiction par insouciance du cœur. Ces deux éléments exonèrent de toute responsabilité l'interprétation dominante des commentateurs, en l'absence d'intention coupable, tandis que des conséquences terrestres peuvent toujours s'appliquer à l'erreur, telles que le prix du sang et les règles d'expiation pour un homicide involontaire (Jami' al-Ulum wal-Hikam pp. 796–797)."
