label:
  ar: الخطأ والنسيان
  en: Error and forgetfulness
summary:
  ar: "الخطأ والنسيان في حديث ابن عباس — التاسع والثلاثون من الأربعين — مما تجاوز الله به عن هذه الأمة: «إن الله تجاوز لي عن أمتي الخطأ والنسيان وما استكرهوا عليه» — فالخطأ فعل المحظور بغير قصد، والنسيان ترك المأمور أو فعل المنهي لذهول القلب عنه، وكلاهما يرفع المؤاخذة على القول الراجح عند شراح الحديث لانتفاء القصد الموجب للتكليف، وإن تعلق بالخطأ ضمان في المال كالقصاص في القتل الخطأ والرق في الأحكام (جامع العلوم والحكم ص 796–797)."
  en: "Error and forgetfulness in Ibn Abbas's hadith — the thirty-ninth of the Forty — are among what God lifted from this community: 'God has pardoned for my sake on behalf of my community error, forgetfulness, and what they were coerced into' — error being the doing of the prohibited without intent, and forgetfulness the omitting of a command or doing of a prohibition through the heart's heedlessness, both lifting accountability on the commentators' prevailing reading since culpable intent is absent, while worldly consequences may still attach to error, such as the blood-money and expiation rulings for accidental killing (Jami' al-Ulum wal-Hikam pp. 796–797)."
