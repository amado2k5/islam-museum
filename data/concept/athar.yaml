id: concept/athar
class: concept
kind: legal
label: { ar: "أثر", en: "Trace, effect, report (athar)" }
summary:
  ar: "الأثر في اللغة بقية الشيء أو الخبر، ويطلقه الفقهاء والأصوليون على بقية النجاسة، وعلى الخبر الموقوف أو المرفوع أو المقطوع، وعلى ما يترتب على الشيء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1522} وإن تعذرت إزالة أثر النجاسة عُفي عنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1522} وأثر العقد عندهم ما شُرع العقد له، كانتقال الملكية في البيع، وحل الاستمتاع في النكاح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1522}"
  en: "In the lexicon, athar means the remainder of a thing or a report. Jurists and usulis use it for the remainder of an impurity, for a report traced to a Companion or to the Prophet's chain, and for what follows from a thing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1522} If the trace of an impurity cannot be removed, it is excused. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1522} For a contract, its effect is what the contract was made to produce, such as the transfer of ownership in a sale or the lawfulness of enjoyment in a marriage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1522}"
