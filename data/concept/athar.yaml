id: concept/athar
class: concept
kind: legal
label:
  ar: "أثر"
  en: "Trace, effect, report (athar)"
  fr: "Trace, effet, récit (athar)"
  es: "Rastro, efecto, informe (athar)"
summary:
  ar: "الأثر في اللغة بقية الشيء أو الخبر، ويطلقه الفقهاء والأصوليون على بقية النجاسة، وعلى الخبر الموقوف أو المرفوع أو المقطوع، وعلى ما يترتب على الشيء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1522} وإن تعذرت إزالة أثر النجاسة عُفي عنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1522} وأثر العقد عندهم ما شُرع العقد له، كانتقال الملكية في البيع، وحل الاستمتاع في النكاح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1522}"
  en: "In the lexicon, athar means the remainder of a thing or a report. Jurists and usulis use it for the remainder of an impurity, for a report traced to a Companion or to the Prophet's chain, and for what follows from a thing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1522} If the trace of an impurity cannot be removed, it is excused. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1522} For a contract, its effect is what the contract was made to produce, such as the transfer of ownership in a sale or the lawfulness of enjoyment in a marriage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1522}"
  fr: "Dans le lexique, athar signifie le reste d’une chose ou un récit. Les juristes et les spécialistes des fondements du droit l’emploient pour le reste d’une impureté, pour un récit remontant à un Compagnon ou à la chaîne du Prophète, et pour ce qui découle d’une chose. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1522} Si la trace d’une impureté ne peut être enlevée, elle est excusée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1522} Pour un contrat, son effet est ce qu’il est destiné à produire, comme le transfert de propriété dans une vente ou la licéité de la jouissance dans un mariage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1522}"
  es: "En el léxico, athar significa el remanente de algo o un informe. Los juristas y usulis lo usan para referirse al remanente de una impureza, a un informe que se remonta a un Compañero o a la cadena del Profeta, y a lo que se deriva de algo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1522} Si el rastro de una impureza no se puede eliminar, se excusa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1522} En el caso de un contrato, su efecto es el que se pretendía producir con él, como la transferencia de propiedad en una venta o la licitud del disfrute en un matrimonio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1522}"
