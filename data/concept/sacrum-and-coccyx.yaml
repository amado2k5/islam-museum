label: { ar: "العجز والعصعص عند ابن سينا", en: "Sacrum and coccyx in the Canon", ur: "قانون میں عجز اور دم چی", es: "Sacro y cóccix en el canon", fr: "Le sacrum et le coccyx dans le canon", tr: "İbn Sina'ya göre yetersizlik ve kuyruk kuyruk sümüğü", id: "Ketidakmampuan dan tulang ekor menurut Ibn Sina" }
summary:
  ar: "يجعل ابن سينا عظام العجز ثلاثة، وهي أشدّ الفقرات تهندماً ووثاقة مفصل، ويؤلّف العصعص من ثلاث فقرات غضروفية لا زوائد لها {cite:canon-ibn-sina-print-v1 p.52}."
  en: "Ibn Sina makes the bones of the sacrum three, the most tightly fitted and firmly jointed of the vertebrae, and builds the coccyx from three cartilaginous vertebrae without processes {cite:canon-ibn-sina-print-v1 p.52}."
  es: "Ibn Sina hace que los huesos del sacro sean tres, los más ajustados y firmemente articulados de las vértebras, y construye el cóccix a partir de tres vértebras cartilaginosas sin procesos {cite:canon-ibn-sina-print-v1 p.52}."
  fr: "Ibn Sina fait des os du sacrum trois, les plus étroitement ajustés et les plus fermement articulés des vertèbres, et construit le coccyx à partir de trois vertèbres cartilagineuses sans processus {cite:canon-ibn-sina-print-v1 p.52}."
  ur: "ابن سینا سیکرم تھری کی ہڈیوں کو بناتا ہے، جو فقرے کی سب سے زیادہ مضبوطی سے جڑی ہوئی اور مضبوطی سے جڑی ہوئی ہے، اور بغیر کسی عمل کے تین کارٹیلیجینس فقرے سے کوکسیکس بناتا ہے"
  tr: "İbn Sina, sakral kemikleri üçe ayırır; bunlar en simetrik ve eklemli omurlardır ve kuyruk sümüğünü uzantısız üç kıkırdaklı omurdan oluşturur {cite:canon-ibn-sina-print-v1 s.52}."
  id: "Ibn Sina membuat tulang sakral menjadi tiga, yaitu tulang belakang paling simetris dan artikular, dan ia membentuk tulang ekor dari tiga tulang rawan tanpa anggota tubuh {cite:canon-ibn-sina-print-v1 hlm.52}."
