id: concept/kalam-kulli-fi-al-suda
class: concept
kind: scientific
label:
  ar: "كلام كلي في الصداع"
  en: "General discourse on headache"
  ur: "صداع پر عمومی کلام"
summary:
  ar: "يعرّف ابن سينا الصداع بأنه ألم في أعضاء الرأس، ويرد كل ألم إلى تغيّر مزاج دفعة أو تفرق اتصال أو اجتماعهما، ويبيّن مواضع السبب في الرأس وأن الصداع إما في العضو نفسه أو بمشاركة عضو آخر أو البدن كله؛ وفيه سطر موسوم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v2 pp.44-45}"
  en: "Ibn Sina defines headache as pain in the organs of the head, traces every pain to a sudden change of temperament, a break of continuity or both, and shows where the cause may lie in the head and that headache is either in the organ itself or by sharing with another organ or the whole body; the record has a labelled line in a section held for the founder's ruling {cite:canon-ibn-sina-print-v2 pp.44-45}"
  ur: "ابن سینا صداع کو سر کے اعضا میں درد قرار دیتا ہے، ہر درد کو مزاج کے اچانک بدلنے، اتصال ٹوٹنے یا دونوں کے اکٹھا ہونے سے جوڑتا ہے، اور سبب کے مقامات بتاتا ہے، نیز یہ کہ صداع یا تو خود عضو میں ہوتا ہے یا کسی دوسرے عضو یا پورے بدن کی مشارکت سے؛ اس میں ایک موسوم سطر بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v2 pp.44-45}۔"
