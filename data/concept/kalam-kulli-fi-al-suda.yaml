id: concept/kalam-kulli-fi-al-suda
class: concept
kind: scientific
label:
  ar: "كلام كلي في الصداع"
  en: "General discourse on headache"
  ur: "صداع پر عمومی کلام"
  es: "Discurso general sobre el dolor de cabeza"
  fr: "Discours général sur les maux de tête"
  tr: "Baş ağrıları hakkında tam bir konuşma"
  id: "Pembicaraan lengkap tentang sakit kepala"
summary:
  ar: "يعرّف ابن سينا الصداع بأنه ألم في أعضاء الرأس، ويرد كل ألم إلى تغيّر مزاج دفعة أو تفرق اتصال أو اجتماعهما، ويبيّن مواضع السبب في الرأس وأن الصداع إما في العضو نفسه أو بمشاركة عضو آخر أو البدن كله؛ وفيه سطر موسوم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v2 pp.44-45}"
  en: "Ibn Sina defines headache as pain in the organs of the head, traces every pain to a sudden change of temperament, a break of continuity or both, and shows where the cause may lie in the head and that headache is either in the organ itself or by sharing with another organ or the whole body; the record has a labelled line in a section held for the founder's ruling {cite:canon-ibn-sina-print-v2 pp.44-45}"
  ur: "ابن سینا صداع کو سر کے اعضا میں درد قرار دیتا ہے، ہر درد کو مزاج کے اچانک بدلنے، اتصال ٹوٹنے یا دونوں کے اکٹھا ہونے سے جوڑتا ہے، اور سبب کے مقامات بتاتا ہے، نیز یہ کہ صداع یا تو خود عضو میں ہوتا ہے یا کسی دوسرے عضو یا پورے بدن کی مشارکت سے؛ اس میں ایک موسوم سطر بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v2 pp.44-45}۔"
  es: "Ibn Sina define el dolor de cabeza como dolor en los órganos de la cabeza, atribuye todo dolor a un cambio repentino de temperamento, una interrupción de la continuidad o ambas cosas, y muestra dónde puede residir la causa en la cabeza y que el dolor de cabeza se origina en el propio órgano o se comparte con otro órgano o con todo el cuerpo; el registro tiene una línea etiquetada en una sección reservada para la decisión del fundador {cite:canon-ibn-sina-print-v2 pp.44-45}"
  fr: "Ibn Sina définit le mal de tête comme une douleur provenant des organes de la tête, attribue chaque douleur à un changement soudain d'humeur, à une rupture de continuité, ou aux deux, et montre où la cause peut se situer dans la tête. Il précise que le mal de tête peut être localisé dans l'organe lui-même, ou s'étendre à un autre organe ou à l'ensemble du corps; le texte comporte une ligne légendée dans une section réservée à la décision du fondateur {cite:canon-ibn-sina-print-v2 pp.44-45}"
  tr: "İbn Sina, baş ağrısını baş organlarındaki ağrı olarak tanımlar ve herhangi bir ağrıyı ruh hali, dürtü, kopukluk veya kombinasyon değişikliğine bağlar. Nedenin baştaki konumlarını açıklar ve baş ağrısının ya aynı organda, başka bir organı kapsayan ya da tüm vücudu kapsadığını açıklar; kurucunun kuralı hakkında askıya alınmış bir bölümde başlıklı bir satır yer alır {cite:canon-ibn-sina-print-v2 s.44-45}"
  id: "Ibn Sina mendefinisikan sakit kepala sebagai nyeri di organ kepala, mengaitkan setiap rasa sakit dengan perubahan suasana hati, dorongan, keterputusan, atau kombinasi. Ia menjelaskan lokasi penyebab di kepala, dan bahwa sakit kepala terjadi di organ yang sama, melibatkan organ lain, atau seluruh tubuh; terdapat baris berjudul di bagian yang ditangguhkan tentang aturan pendiri {cite:canon-ibn-sina-print-v2 hlm.44-45}"
