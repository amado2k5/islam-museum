label: { ar: "أصل البدن من المني ودم الطمث", en: "The body's origin in seed and menstrual blood", ur: "بدن کی اصل: مادۂ منویہ اور خون حیض" }
summary:
  ar: "يعلل ابن سينا رطوبة البدن في أصل تكوّنه بأن المبدأ الأول له شيئان: مني الرجل ومني المرأة مع دم الطمث، وكلاهما سيال رطب، فكان انعقادهما الأول رطباً، مع معاونة الأرضية والنارية في تصليب المنعقد تصليباً محدوداً {cite:canon-ibn-sina-print-v1 p.200}."
  en: "Ibn Sina explains the body's moistness from its first formation: its first principle is two things, the man's seed and the woman's seed with menstrual blood, both fluid and moist, so their first setting is moist, while earthy and fiery parts harden what has set only to a limited degree {cite:canon-ibn-sina-print-v1 p.200}."
