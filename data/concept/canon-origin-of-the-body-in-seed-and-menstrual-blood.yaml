id: concept/canon-origin-of-the-body-in-seed-and-menstrual-blood
class: concept
kind: scientific
label:
  ar: "أصل البدن من المني ودم الطمث"
  en: "The body's origin in seed and menstrual blood"
  fr: "Origine corporelle dans la semence et le sang menstruel"
  ur: "بدن کی اصل: مادۂ منویہ اور خون حیض"
  es: "El origen del cuerpo en la semilla y la sangre menstrual"
summary:
  ar: "يعلل ابن سينا رطوبة البدن في أصل تكوّنه بأن المبدأ الأول له شيئان: مني الرجل ومني المرأة مع دم الطمث، وكلاهما سيال رطب، فكان انعقادهما الأول رطباً، مع معاونة الأرضية والنارية في تصليب المنعقد تصليباً محدوداً {cite:canon-ibn-sina-print-v1 p.200}."
  en: "Ibn Sina explains the body's moistness from its first formation: its first principle is two things, the man's seed and the woman's seed with menstrual blood, both fluid and moist, so their first setting is moist, while earthy and fiery parts harden what has set only to a limited degree {cite:canon-ibn-sina-print-v1 p.200}."
  fr: "Ibn Sina explique l’humidité initiale par semence masculine et semence féminine avec sang menstruel, fluides humides se figeant donc humides ; terre et feu ne durciraient cet ensemble que partiellement {cite:canon-ibn-sina-print-v1 p.200}."
  es: "Ibn Sina explica la humedad del cuerpo desde su primera formación: su primer principio son dos cosas, la semilla del hombre y la semilla de la mujer con sangre menstrual, ambas fluidas y húmedas, por lo que su primera formación es húmeda, mientras que las partes terrosas y ígneas endurecen lo que se ha formado solo en un grado limitado {cite:canon-ibn-sina-print-v1 p.200}."
  ur: "ابن سینا اس کی پہلی تشکیل سے جسم کی رطوبت کی وضاحت کرتا ہے: اس کا پہلا اصول دو چیزیں ہیں، مرد کا بیج اور عورت کا بیج جس میں ماہواری کا خون ہوتا ہے، دونوں سیال اور نم ہوتے ہیں، اس لیے ان کی پہلی ترتیب نم ہوتی ہے، جب کہ مٹی اور آگ کے حصے سخت ہوتے ہیں جو کہ محدود حد تک پہنچ چکے ہیں۔"
