summary:
  ar: "تفسيا في الكتاب صمغ السذاب البري، ويقال أيضا بالثاء، لا ينفع إلا طريا ويضعف بالقدم لتحلل رطوباته الفضلية، حار جدا محرق قوي الإسخان والتجفيف، منق مسهل منضج مفجر يجذب جذبا شديدا من عمق البدن، ينبت الشعر وينفع داء الثعلب والآثار والكلف والبرص، ويمسح به على الاسترخاء والنقرس والمفاصل الباردة، وينفع من نفث القيح وعسر النفس ووجع الجنبين {cite:canon-ibn-sina-print-v1 pp.690-691}"
  en: "Tafsiya is in the book the gum of wild rue, also said with the letter tha; it is of use only fresh and weakens with age as its superfluous moistures dissolve; very hot and burning, strong in heating and drying, it cleanses, purges, ripens and bursts, and draws strongly from the depth of the body; it grows hair and benefits alopecia, marks, freckles and baras, is rubbed on slackness, gout and cold joints, and benefits the spitting of pus, difficult breathing and pain of the two sides {cite:canon-ibn-sina-print-v1 pp.690-691}"
  ur: "تفسیا کتاب میں جنگلی سداب کا گوند ہے، اور اسے ثا کے ساتھ بھی کہا جاتا ہے؛ تازہ ہی میں نفع دیتا ہے اور پرانا ہو کر کمزور پڑ جاتا ہے کیونکہ اس کی فاضل رطوبتیں تحلیل ہو جاتی ہیں؛ بہت گرم اور جلانے والا، گرم اور خشک کرنے میں قوی، صاف کرتا ہے، دست لاتا ہے، پکاتا ہے اور پھوڑتا ہے، اور بدن کی گہرائی سے زور سے کھینچتا ہے؛ بال اگاتا ہے اور داء الثعلب، نشانوں، جھائیوں اور برص میں نافع ہے، ڈھیلے پن، نقرس اور ٹھنڈے جوڑوں پر ملا جاتا ہے، اور پیپ کے تھوکنے، سانس کی تنگی اور پسلیوں کے درد میں نافع ہے {cite:canon-ibn-sina-print-v1 pp.690-691}۔"
  es: "Tafsiya es en el libro la goma de la ruda silvestre, también pronunciada con la letra tha; solo es útil fresca y se debilita con la edad a medida que se disuelve su humedad superflua; muy caliente y ardiente, fuerte para calentar y secar, limpia, purga, madura y revienta, y extrae fuertemente de las profundidades del cuerpo; hace crecer el cabello y beneficia la alopecia, las marcas, las pecas y las baras, se frota sobre la flacidez, la gota y las articulaciones frías, y beneficia la expectoración de pus, la dificultad para respirar y el dolor en ambos lados {cite:canon-ibn-sina-print-v1 pp.690-691}"
  fr: "La Tafsiya est mentionnée dans le livre comme la gomme de rue sauvage, également prononcée avec la lettre tha; elle n’est efficace que fraîche et s’affaiblit avec le temps, son excès d’humidité se dissolvant; très chaude et brûlante, puissante en chauffage et en assèchement, elle purifie, purge, mûrit et fait éclater, et puise puiser intensément l’énergie des profondeurs du corps; elle favorise la pousse des cheveux et est bénéfique en cas d’alopécie, de marques, de taches de rousseur et de baras, est appliquée sur la raideur, la goutte et les articulations froides, et est bénéfique en cas d’expectoration de pus, de difficultés respiratoires et de douleurs bilatérales {cite:canon-ibn-sina-print-v1 pp.690-691}"
  tr: "Kitapta, yabani al-sadhab'ın sakızı, yani tha, yalnızca yumuşak olduğunda faydalıdır ve fazla nemin çözünmesi nedeniyle ayağı zayıflatır. Çok sıcak, yakıcı, ısıtma ve kurutma açısından güçlüdür, arıtıcı, müshil, olgun, patlayıcıdır; vücudun derinliklerinden güçlü çekim çeker, saç büyümesini destekler, tilki hastalığı, yara izleri, melazma ve vitiligoya yardımcı olur, gevşeme, gut ve soğuk eklemlerde kullanılır, ayrıca dışlama, nefes darlığı ve yanlarda ağrı için faydalıdır. {cite:canon-ibn-sina-print-v1 s.690-691}"
  id: "Dalam buku tersebut, permen karet al-saddhab liar, juga disebut tha, hanya berguna saat lunak dan melemahkan kaki akibat pelarutan kelembapan berlebih. Permen ini sangat panas, membakar, kuat dalam pemanasan dan pengeringan, pembersih, pencahar, matang, eksplosif yang menarik daya tarik kuat dari dalam tubuh, mendorong pertumbuhan rambut, membantu penyakit rubah, bekas luka, melasma, dan vitiligo, serta digunakan untuk relaksasi, asam urat, dan sendi dingin, serta berguna untuk mengeluarkan tubuh, kesulitan bernapas, dan nyeri di sisi tubuh. {cite:canon-ibn-sina-print-v1 hlm.690-691}"
