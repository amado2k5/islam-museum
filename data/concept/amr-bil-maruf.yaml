id: concept/amr-bil-maruf
class: concept
kind: legal
label: { ar: "الأمر بالمعروف والنهي عن المنكر", en: "Al-amr bil-maruf wal-nahy an al-munkar (commanding right and forbidding wrong)" }
summary:
  ar: "الأمر بالمعروف والنهي عن المنكر، ويسمى الحسبة في عرف الفقهاء، من النصيحة التي هي الدين، وحكى النووي وابن حزم الإجماع على وجوبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3386}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3387} ومن أهل العلم من يجعله فرض كفاية كالجمهور، ومنهم من يجعله فرض عين في مواضع، ومنهم من يجعله نافلة، ومنهم من يفصل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3387}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3388} ومراتبه ثلاث: باليد، فباللسان، فبالقلب، وشروطه أن يكون المنكر ظاهرا غير متجسس عليه ومتفقا على تحريمه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3388}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3389}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3390} ويجوز أخذ الأجر على القيام به إذا كان المحتسب معينا فيفرض له من بيت المال، وقال قوم لا يجوز، واستدل الجمهور بجواز الأجر على تعليم القرآن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3391}"
  en: "Commanding right and forbidding wrong, which the jurists call hisba, is part of the counsel that is religion. Al-Nawawi and Ibn Hazm report the consensus that it is obligatory. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3386}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3387} Most jurists call it a communal obligation; some make it an individual obligation in certain cases, some make it recommended, and some divide the cases. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3387}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3388} Its degrees are three: by hand, by tongue, by heart; its conditions include that the wrong be visible without spying and agreed to be wrong. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3388}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3389}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3390} A designated officer of hisba may be paid from the treasury, while the volunteer is not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3391}"
