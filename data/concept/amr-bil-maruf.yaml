label: { ar: "الأمر بالمعروف والنهي عن المنكر", en: "Al-amr bil-maruf wal-nahy an al-munkar (commanding right and forbidding wrong)", fr: "Al-amr bil-maruf wal-nahy an al-munkar (ordonner le bien et interdire le mal)", es: "Al-amr bil-maruf wal-nahy an al-munkar (ordenar el bien y prohibir el mal)", ur: "الامر بالمعروف والنھی عن المنکر ⁦(حق کا حکم دینا اور برائی سے روکنا)⁩", tr: "İyiliği Teşvik Etmek ve Kötülüğü Engellemek", id: "İyiliği Teşvik Etmek ve Kötülüğü Engellemek" }
summary:
  ar: "الأمر بالمعروف والنهي عن المنكر، ويسمى الحسبة في عرف الفقهاء، من النصيحة التي هي الدين، وحكى النووي وابن حزم الإجماع على وجوبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3386}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3387} ومن أهل العلم من يجعله فرض كفاية كالجمهور، ومنهم من يجعله فرض عين في مواضع، ومنهم من يجعله نافلة، ومنهم من يفصل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3387}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3388} ومراتبه ثلاث: باليد، فباللسان، فبالقلب، وشروطه أن يكون المنكر ظاهرا غير متجسس عليه ومتفقا على تحريمه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3388}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3389}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3390} ويجوز أخذ الأجر على القيام به إذا كان المحتسب معينا فيفرض له من بيت المال، وقال قوم لا يجوز، واستدل الجمهور بجواز الأجر على تعليم القرآن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3391}"
  en: "Commanding right and forbidding wrong, which the jurists call hisba, is part of the counsel that is religion. Al-Nawawi and Ibn Hazm report the consensus that it is obligatory. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3386}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3387} Most jurists call it a communal obligation; some make it an individual obligation in certain cases, some make it recommended, and some divide the cases. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3387}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3388} Its degrees are three: by hand, by tongue, by heart; its conditions include that the wrong be visible without spying and agreed to be wrong. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3388}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3389}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3390} A designated officer of hisba may be paid from the treasury, while the volunteer is not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3391}"
  fr: "Ordonner le bien et interdire le mal, que les juristes appellent hisba, fait partie du conseil qui est la religion. Al-Nawawi et Ibn Hazm rapportent le consensus sur son caractère obligatoire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3386}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3387} La plupart des juristes en font une obligation communautaire ; certains en font une obligation individuelle dans certains cas, certains le tiennent pour recommandé, et certains distinguent selon les cas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3387}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3388} Ses degrés sont au nombre de trois : par la main, par la langue, par le cœur ; ses conditions comprennent que le mal soit visible sans espionnage et reconnu unanimement comme un mal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3388}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3389}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3390} Un agent de la hisba désigné peut être rémunéré sur le trésor public, tandis que le volontaire ne l’est pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3391}"
  es: "Ordenar el bien y prohibir el mal, que los juristas llaman hisba, es parte del consejo que es la religión. Al-Nawawi e Ibn Hazm informan del consenso de que es obligatorio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3386}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3387} La mayoría de los juristas lo llaman una obligación comunitaria; algunos hacen una obligación individual en ciertos casos, algunos hacen que sea recomendable, y algunos dividen los casos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3387}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3388} Sus grados son tres: por la mano, por la lengua, por el corazón; sus condiciones incluyen que el mal sea visible sin espiar y estar de acuerdo en que es incorrecto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3388}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3389}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3390} Un oficial designado de hisba puede recibir dinero del tesoro, mientras que el voluntario no. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3391}"
  ur: "حق کا حکم دینا اور غلط سے منع کرنا، جسے فقہاء حسبہ کہتے ہیں، دین کی نصیحت کا حصہ ہے۔ نووی اور ابن حزم نے اس کے واجب ہونے پر اجماع بیان کیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3386}{cite:fiqh-Mawsua-kuwaitiyya-noor-v3 p.3387} اکثر فقہاء اسے اجتماعی ذمہ داری کہتے ہیں۔ بعض اسے بعض صورتوں میں انفرادی ذمہ داری قرار دیتے ہیں، بعض اسے تجویز کرتے ہیں، اور بعض مقدمات کو تقسیم کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3387}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3388} اس کے درجات تین ہیں: ہاتھ سے، زبان سے، دل سے؛ اس کی شرائط میں یہ شامل ہے کہ غلط کو جاسوسی کے بغیر نظر آنا اور غلط ہونے پر راضی ہونا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3388}{cite:fiqh-Mawsua-kuwaityya-noor-v3 p.3389}{cite:fiqh-masua-kuwaityya-noor-v3 p.3390} جب کہ ہسبا کے نامزد افسر کو تنخواہ نہیں دی جا سکتی۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 3391}"
  tr: "İyiliği emretip kötülüğü engellemek, hukukçu geleneklerinde hisbah olarak adlandırılır ve dinin bir parçası olan bir tavsiye biçimi olarak kabul edilir. El-Nevavi ve İbn Hazm, bu zorunluluk konusunda uzlaşı bildirmiştir. {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s.3386} {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.3387} Bazı alimler çoğunluk gibi kolektif bir yükümlülük olarak kabul eder, bazıları bazı yerlerde özel bir yükümlülük, bazıları gönüllü bir dua olarak kabul eder, bazıları ise ayrı kabul eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3387} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3388} ve seviyeleri üç: önce elle, sonra dille, sonra kalple. Şartları, kötülüğün gözetlenmemesi ve yasaklanması için uzlaşının olmasıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3388} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3389} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3390} Muhasebeci belirlenmiş bir kişi ise ve kamu hazinesinden zorunluysa, bunu yapmak için ödeme alınabilir. Bazıları bunun izin verilmediğini söylerken, çoğunluk Kur'an öğretimi için ödülün kabul edilebilirliğini desteklemiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3391}"
