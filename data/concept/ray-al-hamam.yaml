summary:
  ar: "رعي الحمام في الكتاب حشيش له حب كحب الآس أو قريب منه، حار في الأولى رطب يابس في الثانية، يدمل الجراحات ويمنع سعي الخبيثة ويحلل الأورام البلغمية، وطبيخه يسود الشعر، وفي الكتاب نقل موسوم عن الطمث والجنين {cite:canon-ibn-sina-print-v1 p.662}"
  en: "Ray al-hamam is in the book a herb with a seed like the seed of the myrtle or near it, hot in the first degree and moist and dry in the second; it heals wounds, stops the spread of malignant ulcers and dissolves phlegmatic swellings, its decoction blackens the hair, and the book also lists a labelled report on menses and the foetus {cite:canon-ibn-sina-print-v1 p.662}"
  ur: "رعی الحمام کتاب میں ایک گھاس ہے جس کا دانہ آس کے دانے جیسا یا اس کے قریب ہے، پہلے درجے میں گرم اور دوسرے میں تر خشک؛ زخموں کو بھرتی ہے، خبیث قرحوں کے پھیلاؤ کو روکتی ہے اور بلغمی ورموں کو تحلیل کرتی ہے، اس کا جوشاندہ بالوں کو سیاہ کرتا ہے، اور کتاب حیض اور جنین کے بارے میں منقول فہرست بھی درج کرتی ہے {cite:canon-ibn-sina-print-v1 p.662}۔"
  es: "En el libro, Ray al-hamam es una hierba con una semilla parecida a la del mirto o similar, de naturaleza caliente en primer grado y húmeda y seca en segundo; cura heridas, detiene la propagación de úlceras malignas y disuelve hinchazones flemáticas; su decocción oscurece el cabello. El libro también incluye un informe detallado sobre la menstruación y el feto {cite:canon-ibn-sina-print-v1 p.662}."
  fr: "Le Ray al-hamam est décrit dans le livre comme une plante dont la graine ressemble à celle du myrte, chaude au premier degré et humide et sèche au second; elle guérit les plaies, arrête la propagation des ulcères malins et dissout les gonflements phlegmatiques; sa décoction noircit les cheveux. Le livre contient également un rapport commenté sur les menstruations et le fœtus {cite:canon-ibn-sina-print-v1 p.662}"
