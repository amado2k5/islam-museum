label:
  ar: "أصناف السعال وعلاماته"
  en: "The cough's kinds and signs"
  ur: "کھانسی کی اقسام اور علامتیں"
summary:
  ar: "السعال منه يابس ومنه رطب، واليابس هو الذي لا نفث معه ويكون إما لسوء مزاج حار أو بارد أو يابس مفرد وقد يكون في ابتداء حدوث الأورام الحارة في نواحي الصدر إلى أن ينضج وقد يكون مع الورم الصلب سعال يابس جداً وقد يكون لأورام الكبد في نواحي المعاليق وفي الأحيان لأورام الطحال وقد يكون لمدة تملأ فضاء الصدر فلا تندفع إلا بالسعال، واعلم أنه ربما خرج من السعال شيء حجري مثل حمصة وسببه خلط غليظ تحجره فيه الحرارة وقد شهد به الاسكندر وشهد به فولس وذكر أنه خرج من هذا الصنف في النفث ونحن أيضاً قد شاهدنا ذلك ⁦(شهادة على عهد الكتاب)⁩، والسعال الملح كثيراً ما يؤدي إلى نفث الدم وقد يكثر في الشتاء والربيع الشتوي وربما كثر في الربيع المعتدل ويكثر عند هبوب الشمال وإذا كان الصيف شمالياً قليل المطر وكان الخريف جنوبياً مطيراً كثر السعال في الشتاء، وأما العلامات فللبارد تبريده مع البرد ونقصانه مع نقصانه ومع الحر ورصاصية الوجه وقلة العطش وربما كانت معه نزلة فيحس نزول شيء إلى الصدر وامتداده في الحلق ويقل مع جذب المادة إلى الأنف ويلقى ما ينزل إلى الحلق بالتنحنح ثم ينفث شيئاً بلغمياً نيئاً ثم إلى صفرة وخضرة وربما كان معه حمى، وللحار التهاب وعطش وسكونه بالهواء البارد أكثر من سكونه بالماء وحمرة وجه وعظم نبض، وللرطب رطوبة جوهر الرئة وعروضه للمشايخ والمرطوبين وكثرة الخرخرة خصوصاً في النوم وبعده، ولليابس ازدياده مع الحركة والجوع وخفته عند السكون والشبع والاستحمام وشرب المرطبات، وللساذج أن لا يكون نفث البتة وللذي مع المادة النفث ويدل على جنسها جنس النفث، وللكائن عن الأورام وجود علامات ذات الجنب وذات الرئة الحارين والباردين، وللكائن من التقيح علامات التقيح ووجع ويبس وكثيراً ما يكون رطباً، وللكائن من القروح علامات نفث قيح أو طائفة من جرم الرئة وحلق القصبة وكونه بعد نوازل أكالة وبعد نفث الدم والأورام، وللكائن بالمشاركة إما مشاركة المعدة بعلامات امتلائها أو خلائها ويهيج عند الامتلاء والهضم وإما مشاركة الكبد بعلاماته ⁦(وفي الباب أدوية ذكرت بالاسم مستثناة بحسب القاعدة)⁩ {cite:canon-ibn-sina-print-v2 p.328}"
  en: "Of the cough there is the dry and the moist: the dry is what has no expectoration with it, and it is either for a bad hot, cold or dry simple temperament, or it may be in the beginning of the hot tumours arising in the chest's regions until they ripen, and with the hard tumour there may be a very dry cough, and it may be for the liver's tumours in the suspensories' region and sometimes for the spleen's tumours, and it may be for a pus filling the chest's hollow that is only pushed off by the cough. And know that something stony like a chickpea may come out of the cough, its cause a thick humour that the heat petrifies in it; Alexander has testified to it and Fulus has testified to it and mentioned that this kind came out in the expectoration, and we too have witnessed that (a testimony on the book's saying). The insistent cough much leads to haemoptysis; it may abound in the winter and the wintry spring, and perhaps in the moderate spring, and abounds at the north wind's blowing, and when the summer is northerly and rain-poor and the autumn southerly and rainy the cough abounds in the winter. As for the signs: the cold one's sign is its cooling with cold and lessening with its lessening and with heat, the face's leadenness and little thirst, and a catarrh may be with it so he feels something descending to the chest and stretching in the throat, lessening as the matter is drawn to the nose, throwing up what descends to the throat by hawking, then expectorating a raw phlegmy thing then toward yellow and green, and a fever may be with it. The hot one's sign is inflammation and thirst, its settling by cold air more than by water, face-redness and greatness of pulse. The moist one's signs are moisture of the lung's substance, its befalling the old and the moistened, and much rattling especially in sleep and after it. The dry one's sign is its increasing with movement and hunger and its lightness at rest, satiety, bathing and drinking moisteners. The simple one's sign in all this is that there be no expectoration at all, and of the one with matter the expectoration, and the matter's kind is told by the expectoration's kind. Of what is from the tumours: the presence of the signs of hot and cold pleurisy and peripneumonia. Of what is from suppuration: the suppuration signs we mention, and pain, and dryness, though often it is moist. Of what is from the ulcers: signs mentioned in the lung-ulcer chapter, of expectorating a shaggy piece, pus or a part of the lung's body, and the windpipe's hollowness, and its coming after corroding catarrhs and after haemoptysis and the tumours. Of what is by participation: either the stomach's participation known by the indications of its fullness or emptiness and by the foods — most of it stirred at fullness and at digestion — or the liver's participation known by its signs (in the chapter are drugs named by name, excluded per the rule) {cite:canon-ibn-sina-print-v2 p.328}"
  ur: "کھانسی یا خشک ہوتی ہے یا تر: خشک وہ جس کے ساتھ نفث نہیں یا تو خالص گرم سرد یا خشک خراب مزاج سے ہوتی ہے یا گرم سوجنوں کے شروع میں سینے کے اطراف میں جب تک پک جائیں اور سخت سوجن کے ساتھ بہت خشک کھانسی ہو سکتی ہے اور جگر کی سوجنوں سے معالقی کی طرف اور کبھی طحال کی سوجنوں سے اور مدّہ سے جو سینے کی خلا بھر دے جو صرف کھانسی سے نکلتی ہے؛ اور جان لو کہ کھانسی سے کبھی چنے جیسی پتھری چیز نکلتی ہے اس کا سبب گاڑھا خلط ہے جسے حرارت اس میں پتھر کر دیتی ہے اس کی گواہی سکندر نے دی اور فولس نے بھی اور کہا کہ اس جنس کا نفث ہوا اور ہم نے بھی دیکھا ⁦(کتاب کے قول پر گواہی)⁩؛ مسلسل کھانسی اکثر نفث دم کی طرف لے جاتی ہے اور سردی اور سرد بہار میں کثیر ہو سکتی ہے اور شاید معتدل بہار میں بھی اور شمالی ہوا چلنے پر اور اگر گرمی شمالی کم بارش ہو اور خزاں جنوبی برساتی تو سردی میں کھانسی کثیر ہوتی ہے؛ علامتوں میں سرد کی علامت ٹھنڈ کے ساتھ ٹھنڈک اور اس کے کم ہونے اور گرمی سے کمی چہرے کی سیسائی رنگت اور کم پیاس اور اس کے ساتھ نزلة ہو سکتی ہے تو سینے کی طرف کچھ اترتا اور حلق میں پھیلتا محسوس کرے ناک کی طرف مادہ کھینچنے سے کم ہو اور تنحنح سے جو حلق اترے نکالے پھر کچا بلغمی نفث پھر زردی اور سبزی کی طرف اور اس کے ساتھ بخار ہو سکتا ہے؛ گرم کی علامت التہاب اور پیاس اور ٹھنڈی ہوا سے سکون پانی سے زیادہ اور چہرے کی سرخی اور نبض کا بڑا ہونا؛ تر کی علامتیں پھیپھڑے کے جوہر کی رطوبت بزرگوں اور مرطوب بدن والوں کو ہونا اور خرخرہٹ کی کثرت خاص طور پر نیند میں اور بعد؛ خشک کی علامت حرکت اور بھوک سے بڑھنا اور سکون سیری غسل اور مرطبات پینے سے ہلکا ہونا؛ ساذج کی علامت یہ کہ بالکل نفث نہ ہو اور مادے والی کی نفث اور مادے کی جنس نفث کی جنس سے معلوم ہوتی ہے؛ سوجنوں سے ہونے والی کی گرم اور سرد ذات الجنب اور ذات الرئة کی علامتیں؛ تقيح والی کی تقيح کی علامتیں اور درد اور خشکی اگرچہ اکثر تر ہوتی ہے؛ قروح والی کی علامتیں نفث خشن ٹکڑا یا پیب یا پھیپھڑے کے جرم کا حصہ اور نالی کی خشونی اور کاری نزلات اور نفث دم اور سوجنوں کے بعد ہونا؛ شرکت والی یا معدے کی شرکت اس کے امتلاء یا خلا کی نشانیوں سے معلوم امتلاء اور ہضم پر ابھرتی ہے یا جگر کی شرکت اس کی علامتوں سے ⁦(باب میں نام سے ادویہ مذکور ہیں اصول کے مطابق مستثنیٰ)⁩ {cite:canon-ibn-sina-print-v2 p.328}"
