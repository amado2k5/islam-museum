label: { ar: "الاندفان في الرمل والتمرغ فيه عند ابن سينا", en: "Burial and rolling in sand in the Canon", ur: "ریت میں دفن ہونا اور لوٹنا، قانون کے مطابق" }
summary:
  ar: "يذكر ابن سينا أن أقوى الرمال في نشف الرطوبات من نواحي الجلد رمال البحار، وأنه قد يجلس عليها وهي حارة وقد يندفن فيها وقد ينثر على البدن قليلا قليلا، فيحلل الأوجاع والأمراض المذكورة في باب الشمس، وأنه بالجملة يجفف البدن تجفيفا شديدا {cite:canon-ibn-sina-print-v1 pp.142-143}."
  en: "Ibn Sina states that the strongest sands for drawing moisture from the skin are the sands of the seas, which may be sat on while hot, buried in, or scattered over the body a little at a time, dissolving the pains and diseases named under the sun, and that on the whole sand dries the body severely {cite:canon-ibn-sina-print-v1 pp.142-143}."
