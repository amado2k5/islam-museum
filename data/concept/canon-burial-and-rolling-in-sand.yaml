id: concept/canon-burial-and-rolling-in-sand
class: concept
kind: scientific
label:
  ar: "الاندفان في الرمل والتمرغ فيه عند ابن سينا"
  en: "Burial and rolling in sand in the Canon"
  fr: "Enfouissement et roulade dans le sable dans le Canon"
  ur: "ریت میں دفن ہونا اور لوٹنا، قانون کے مطابق"
  es: "Enterramiento y revolcarse en la arena en el cañón."
summary:
  ar: "يذكر ابن سينا أن أقوى الرمال في نشف الرطوبات من نواحي الجلد رمال البحار، وأنه قد يجلس عليها وهي حارة وقد يندفن فيها وقد ينثر على البدن قليلا قليلا، فيحلل الأوجاع والأمراض المذكورة في باب الشمس، وأنه بالجملة يجفف البدن تجفيفا شديدا {cite:canon-ibn-sina-print-v1 pp.142-143}."
  en: "Ibn Sina states that the strongest sands for drawing moisture from the skin are the sands of the seas, which may be sat on while hot, buried in, or scattered over the body a little at a time, dissolving the pains and diseases named under the sun, and that on the whole sand dries the body severely {cite:canon-ibn-sina-print-v1 pp.142-143}."
  fr: "Ibn Sina juge les sables marins les plus puissants pour extraire l’humidité cutanée : s’y asseoir chauds, s’y enfouir ou s’en couvrir peu à peu résoudrait les douleurs et maladies citées à propos du soleil ; le sable dessécherait fortement le corps {cite:canon-ibn-sina-print-v1 pp.142-143}."
  es: "Ibn Sina afirma que las arenas más fuertes para extraer la humedad de la piel son las arenas del mar, sobre las cuales se puede sentar mientras está caliente, enterrar o esparcir sobre el cuerpo poco a poco, disolviendo los dolores y enfermedades mencionados bajo el sol, y que en general la arena reseca severamente el cuerpo {cite:canon-ibn-sina-print-v1 pp.142-143}."
