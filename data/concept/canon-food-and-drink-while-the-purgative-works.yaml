label: { ar: "الأكل والشرب أثناء عمل المسهل عند ابن سينا", en: "Food and drink while the purgative works in the Canon", ur: "مسہل کے عمل کے دوران کھانا پینا قانون میں" }
summary:
  ar: "يوصي ابن سينا شارب الدواء ألا يأكل ولا يشرب حتى يفرغ الدواء من عمله، فإن لم تحتمل معدته ذلك أطعم خبزاً منقوعاً في قليل شراب، وأن يشرب الحار المزاج الضعيف المعدة قبله ماء الشعير أو ماء الرمان، وأن تغسل المقعدة بماء حار لا بارد {cite:canon-ibn-sina-print-v1 p.280}."
  en: "Ibn Sina advises whoever has drunk a drug not to eat or drink until it has finished, giving bread soaked in a little wine to someone whose stomach cannot bear it, a barley or pomegranate drink beforehand to a hot-tempered person with a weak stomach, and washing the anus with hot water rather than cold {cite:canon-ibn-sina-print-v1 p.280}."
