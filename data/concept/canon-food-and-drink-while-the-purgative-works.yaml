id: concept/canon-food-and-drink-while-the-purgative-works
class: concept
kind: scientific
label:
  ar: "الأكل والشرب أثناء عمل المسهل عند ابن سينا"
  en: "Food and drink while the purgative works in the Canon"
  fr: "Alimentation pendant l’action purgative dans le Canon"
  ur: "مسہل کے عمل کے دوران کھانا پینا قانون میں"
  es: "Comida y bebida mientras el purgante hace efecto en el Canon"
summary:
  ar: "يوصي ابن سينا شارب الدواء ألا يأكل ولا يشرب حتى يفرغ الدواء من عمله، فإن لم تحتمل معدته ذلك أطعم خبزاً منقوعاً في قليل شراب، وأن يشرب الحار المزاج الضعيف المعدة قبله ماء الشعير أو ماء الرمان، وأن تغسل المقعدة بماء حار لا بارد {cite:canon-ibn-sina-print-v1 p.280}."
  en: "Ibn Sina advises whoever has drunk a drug not to eat or drink until it has finished, giving bread soaked in a little wine to someone whose stomach cannot bear it, a barley or pomegranate drink beforehand to a hot-tempered person with a weak stomach, and washing the anus with hot water rather than cold {cite:canon-ibn-sina-print-v1 p.280}."
  fr: "Ibn Sina déconseille nourriture et boisson avant fin d’action du remède ; il prévoit pain trempé dans peu de vin si l’estomac ne tolère pas l’attente, eau d’orge ou grenade avant prise chez le chaud à estomac faible, et lavage anal chaud plutôt que froid {cite:canon-ibn-sina-print-v1 p.280}."
  es: "Ibn Sina aconseja a quien haya tomado una droga que no coma ni beba hasta que haya terminado, que le dé pan remojado en un poco de vino a quien no lo tolere, que le dé una bebida de cebada o granada de antemano a una persona irascible con estómago débil, y que se lave el ano con agua caliente en lugar de fría {cite:canon-ibn-sina-print-v1 p.280}."
