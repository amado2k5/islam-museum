  ar: "علم الضوء والإبصار. يرى محقق كتاب المناظر أن البحث في البصريات كان عند اليونان أحد فروع الرياضيات، فجعله ابن الهيثم بحثاً مركباً من العلوم الطبيعية والتعليمية، ودرس فيه أحوال الضوء الثلاثة: الإشراق على الاستقامة والانعكاس والانعطاف {cite:manazir-sabra-1983 p.9}."
  en: "The study of light and vision. The editor of Kitab al-Manazir notes that the Greeks treated optics as a branch of mathematics; Ibn al-Haytham treated it as a mixed science of natural and mathematical kinds, studying light in three states: rectilinear propagation, reflection and refraction {cite:manazir-sabra-1983 p.9}."
