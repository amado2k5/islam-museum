label: { ar: "البصريات", en: "Optics", es: "Óptica", fr: "Optique" }
summary:
  ar: "علم الضوء والإبصار. يرى محقق كتاب المناظر أن البحث في البصريات كان عند اليونان أحد فروع الرياضيات، فجعله ابن الهيثم بحثاً مركباً من العلوم الطبيعية والتعليمية، ودرس فيه أحوال الضوء الثلاثة: الإشراق على الاستقامة والانعكاس والانعطاف {cite:manazir-sabra-1983 p.9}."
  en: "The study of light and vision. The editor of Kitab al-Manazir notes that the Greeks treated optics as a branch of mathematics; Ibn al-Haytham treated it as a mixed science of natural and mathematical kinds, studying light in three states: rectilinear propagation, reflection and refraction {cite:manazir-sabra-1983 p.9}."
  es: "El estudio de la luz y la visión. El editor de Kitab al-Manazir señala que los griegos trataban la óptica como una rama de las matemáticas; Ibn al-Haytham la trataba como una ciencia mixta de tipo natural y matemático, estudiando la luz en tres estados: propagación rectilínea, reflexión y refracción {cite:manazir-sabra-1983 p.9}."
  fr: "L'étude de la lumière et de la vision. L'éditeur du Kitab al-Manazir note que les Grecs traitaient l'optique comme une branche des mathématiques; Ibn al-Haytham la traitait comme une science mixte, à la fois naturelle et mathématique, étudiant la lumière dans trois états: propagation rectiligne, réflexion et réfraction {cite:manazir-sabra-1983 p.9}."
