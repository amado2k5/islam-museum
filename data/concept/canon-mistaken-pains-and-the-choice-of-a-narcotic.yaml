id: concept/canon-mistaken-pains-and-the-choice-of-a-narcotic
class: concept
kind: scientific
label:
  ar: "أغلاط الأوجاع واختيار المخدر عند ابن سينا"
  en: "Mistaken pains and the choice of a narcotic in the Canon"
  fr: "Erreurs sur la douleur et choix du narcotique dans le Canon"
  ur: "قانون میں دردوں میں غلطی اور مخدر کا انتخاب"
  es: "Dolores mal interpretados y la elección de un narcótico en el Canon"
  tr: "İbn Sina'da Ağrı Hataları ve Anestezi Seçimi"
  id: "Kesalahan Rasa Sakit dan Pilihan Anestesi di Ibn Sina"
summary:
  ar: "ينبه ابن سينا إلى كثرة الغلط في الأوجاع التي سببها خارجي، ثم يعرض ما يحير المعالج بين علاج بطيء الأثر وعلاج سريع عظيم الغائلة كتخدير القولنج، ويبين معايير الاختيار {cite:canon-ibn-sina-print-v1 p.310}."
  en: "Ibn Sina warns of the frequent error in pains whose cause is external, then sets out what perplexes the physician between a slow-acting treatment and a fast-acting one of great danger, such as narcotising colic, and gives the standards for choosing {cite:canon-ibn-sina-print-v1 p.310}."
  fr: "Ibn Sina avertit des douleurs d’origine externe mal interprétées, puis compare traitement lent et traitement rapide dangereux, telle narcose de colique, et leurs critères de choix {cite:canon-ibn-sina-print-v1 p.310}."
  es: "Ibn Sina advierte sobre el error frecuente en dolores cuya causa es externa, luego expone lo que desconcierta al médico entre un tratamiento de acción lenta y uno de acción rápida y muy peligroso, como el cólico narcótico, y da los criterios para elegir {cite:canon-ibn-sina-print-v1 p.310}."
  ur: "ابن سینا دردوں میں بار بار ہونے والی خرابی سے خبردار کرتا ہے جس کی وجہ بیرونی ہوتی ہے، پھر یہ بتاتا ہے کہ ڈاکٹر کو سست علاج اور تیز عمل کرنے والے بڑے خطرے کے درمیان کیا چیز پریشان کرتی ہے، جیسے کہ نشہ آور درد، اور منتخب کرنے کے معیارات بتاتا ہے۔"
  tr: "İbn Sina, dışsal nedenlerden kaynaklanan sık sık oluşan ağrı hatalarına dikkat çeker, ardından şifacının yavaş etkili tedavi ile kolik gibi çok hızlı tedavi arasında ne olduğunu ortaya koyar ve seçim kriterlerini {cite:canon-ibn-sina-print-v1 s.310} açıklar."
  id: "Ibn Sina menunjukkan kesalahan nyeri yang sering terjadi akibat penyebab eksternal, lalu menyajikan apa yang membingungkan penyembuh antara pengobatan yang lambat dan pengobatan sangat cepat seperti kolik, dan menjelaskan kriteria seleksi {cite:canon-ibn-sina-print-v1 hlm.310}."
