label:
  ar: ريح عاد
  en: The wind that destroyed Aad
  ur: عاد کا قہرِ باد
summary:
  ar: "أهلك الله عادًا بريح صرصر عاتية في أيام نحسات سبع ليال وثمانية أيام حسومًا، فترى القوم فيها صرعى كأنهم أعجاز نخل خاوية — أول أمم الأرض هلاكًا بعد الطوفان."
  en: "God destroyed Aad with a screaming, violent wind for seven nights and eight days in succession; you would see the people felled like hollow palm trunks — the first nation destroyed after the Flood."
  ur: "اللہ نے عاد کو سات رات اور آٹھ دن مسلسل چلنے والی چیختی زبردست ہوا سے ہلاک کیا؛ لوگ کھوکھلے کھجور کے تنے کی طرح جھکے ہوئے نظر آتے تھے — طوفان کے بعد ہلاک ہونے والی پہلی قوم۔"
