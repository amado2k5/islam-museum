id: concept/aad-al-rih
class: concept
kind: belief
label:
  ar: ريح عاد
  en: The wind that destroyed Aad
  fr: "Le vent qui anéantit les Aad"
  ur: عاد کا قہرِ باد
  es: "El viento que destruyó a Aad"
  tr: "Rüzgar geri döndü"
  id: "Angin kembali"
summary:
  ar: "أهلك الله عادًا بريح صرصر عاتية في أيام نحسات سبع ليال وثمانية أيام حسومًا، فترى القوم فيها صرعى كأنهم أعجاز نخل خاوية — أول أمم الأرض هلاكًا بعد الطوفان."
  en: "God destroyed Aad with a screaming, violent wind for seven nights and eight days in succession; you would see the people felled like hollow palm trunks — the first nation destroyed after the Flood."
  fr: "Dieu anéantit les Aad par un vent hurlant et violent durant sept nuits et huit jours consécutifs ; on voyait les gens abattus comme des troncs de palmiers creux — la première nation anéantie après le Déluge."
  ur: "اللہ نے عاد کو سات رات اور آٹھ دن مسلسل چلنے والی چیختی زبردست ہوا سے ہلاک کیا؛ لوگ کھوکھلے کھجور کے تنے کی طرح جھکے ہوئے نظر آتے تھے — طوفان کے بعد ہلاک ہونے والی پہلی قوم۔"
  es: "Dios destruyó Aad con un viento aullante y violento durante siete noches y ocho días consecutivos; se podía ver a la gente derribada como troncos de palmera huecos: la primera nación destruida después del Diluvio."
  tr: "Tanrı onları kötü günlerde, yedi gece ve sekiz belirleyici günde şiddetli bir rüzgarla yok etti ve insanları boş palmiye ağaçları gibi sarsılmış görüyorsunuz—tufandan sonra yok olan ilk uluslar."
  id: "Tuhan menghancurkan mereka dengan angin yang mengaum di hari-hari malapetaka, tujuh malam dan delapan hari penentuan, dan kau melihat orang-orang yang terluka seolah-olah mereka adalah pohon palem kosong—bangsa pertama di bumi yang binasa setelah banjir."
