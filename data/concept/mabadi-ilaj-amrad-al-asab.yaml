label:
  ar: "مبادئ علاج أمراض العصب"
  en: "Principles of treating nerve diseases"
  ur: "اعصاب کے امراض کے علاج کے اصول"
  es: "Principios del tratamiento de las enfermedades nerviosas"
summary:
  ar: "وجه العلاج في تنقية الأعصاب وتبديل أمزجتها؛ وأكثر ما يحتاج استفراغه عنها من المواد الباردة بمستفرغات قوية وألطفها الحمّام اليابس والرياضة المعتدلة؛ والرياضة بعد التنقية أفضل مبدّل لمزاجها يُبدأ بالأرفق ويُتدرّج إلى المعتدل {cite:canon-ibn-sina-print-v2 p.135}"
  en: "The way of treatment is purifying the nerves and changing their temperaments; what most needs evacuating from them is the cold materials, by strong evacuants whose gentlest are the dry bath and moderate exercise; exercise after purification is the best changer of their temperament, begun gently and increased to the moderate {cite:canon-ibn-sina-print-v2 p.135}"
  ur: "علاج کا راستہ اعصاب کی تنقی اور ان کے امزجہ کی تبدیلی میں ہے؛ جن میں سے جن چیزوں کے استفراغ کی سب سے زیادہ ضرورت ہے وہ سرد مواد ہیں، مضبوط مستفرغات سے جن کا لطیف ترین خشک حمام اور معتدل ورزش ہے؛ اور تنقی کے بعد ورزش ان کے مزاج کی بہترین بدلنے والی ہے، نرم سے شروع ہو کر معتدل تک بڑھتی {cite:canon-ibn-sina-print-v2 p.135}۔"
  es: "El método de tratamiento consiste en purificar los nervios y cambiar su temperamento; lo que más se necesita evacuar de ellos son las sustancias frías, mediante evacuantes fuertes, entre los que destacan el baño seco y el ejercicio moderado; el ejercicio después de la purificación es el mejor modificador de su temperamento, comenzando suavemente y aumentando gradualmente hasta alcanzar un nivel moderado. {cite:canon-ibn-sina-print-v2 p.135}"
