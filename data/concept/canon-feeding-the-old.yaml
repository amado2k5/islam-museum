summary:
  ar: "يوصي ابن سينا في الفصل الثاني بتفريق غذاء الشيخ قليلاً قليلاً في كرتين أو ثلاث بحسب هضمه وقوته، مع الخبز الجيد والعسل في الساعة الثالثة، ويحذر من الغليظ الذي يولد السوداء والبلغم ومن الحاد الحريف المجفف، ويصف علاج ما وقع من خطأ في ذلك {cite:canon-ibn-sina-print-v1 pp.251-252}."
  en: "In the second chapter Ibn Sina advises giving the old person food in small portions, in two or three meals according to digestion and strength, with well-made bread and honey at the third hour, warns against thick foods that breed black bile and phlegm and against sharp, pungent, drying ones, and describes how mistakes in these are treated {cite:canon-ibn-sina-print-v1 pp.251-252}."
