id: concept/canon-feeding-the-old
class: concept
kind: scientific
label:
  ar: "تغذية المشايخ عند ابن سينا"
  en: "Feeding the old in the Canon"
  fr: "Alimentation des vieillards dans le Canon"
  ur: "بزرگوں کی غذا قانون میں"
  es: "Alimentando a los ancianos en el Canon"
  tr: "İbn Sina'ya göre Şeyhlerin Beslenmesi"
  id: "Nutrisi para Sheikh menurut Ibn Sina"
summary:
  ar: "يوصي ابن سينا في الفصل الثاني بتفريق غذاء الشيخ قليلاً قليلاً في كرتين أو ثلاث بحسب هضمه وقوته، مع الخبز الجيد والعسل في الساعة الثالثة، ويحذر من الغليظ الذي يولد السوداء والبلغم ومن الحاد الحريف المجفف، ويصف علاج ما وقع من خطأ في ذلك {cite:canon-ibn-sina-print-v1 pp.251-252}."
  en: "In the second chapter Ibn Sina advises giving the old person food in small portions, in two or three meals according to digestion and strength, with well-made bread and honey at the third hour, warns against thick foods that breed black bile and phlegm and against sharp, pungent, drying ones, and describes how mistakes in these are treated {cite:canon-ibn-sina-print-v1 pp.251-252}."
  fr: "Au chapitre 2, Ibn Sina propose petites portions en deux ou trois repas selon digestion et force, pain bien fait et miel à la troisième heure ; il écarte aliments épais atrabilaires ou phlegmatiques et aliments âcres, piquants, desséchants, et corrige les écarts {cite:canon-ibn-sina-print-v1 pp.251-252}."
  es: "En el segundo capítulo, Ibn Sina aconseja dar a la persona mayor alimentos en pequeñas porciones, en dos o tres comidas según su digestión y fuerza, con pan bien hecho y miel a la tercera hora, advierte contra los alimentos espesos que generan bilis negra y flema y contra los fuertes, picantes y secantes, y describe cómo se tratan los errores en estos {cite:canon-ibn-sina-print-v1 pp.251-252}."
  ur: "دوسرے باب میں ابن سینا بوڑھے کو ہضم اور طاقت کے مطابق دو یا تین کھانے میں اچھی طرح سے تیار شدہ روٹی اور شہد کے ساتھ تیسرے گھنٹے میں کھانے کی نصیحت کرتے ہیں، کالی پت اور بلغم پیدا کرنے والی گاڑھی غذاؤں اور تیز، تیکھی، خشک کرنے والی غذاؤں کے خلاف تنبیہ کرتے ہیں، اور بیان کرتے ہیں کہ ان غلطیوں کا علاج کیسے کیا جاتا ہے: صفحہ 251-252}۔"
  tr: "İkinci bölümde, İbn Sina, Şeyh'in yiyeceğini sindirim ve gücüne göre iki ya da üç topa yavaş yavaş dağıtılmasını, üçüncü saatte iyi ekmek ve bal ile birlikte dağıtılmasını önerir. Siyah ve balgam üreten iri yiyeceklere, keskin, kuru ekşi yiyeceklere karşı uyarıda bulunur ve bu {cite:canon-ibn-sina-print-v1 s.251-252}"
  id: "Pada bab kedua, Ibn Sina merekomendasikan agar makanan Sheikh didistribusikan sedikit demi sedikit ke dalam dua atau tiga bola sesuai pencernaan dan kekuatan, bersama roti dan madu yang baik pada jam ketiga. Ia memperingatkan terhadap makanan kasar yang menghasilkan hitam dan dahak, serta terhadap makanan asam yang tajam, kering, dan menjelaskan solusi untuk kesalahan yang dibuat dalam {cite:canon-ibn-sina-print-v1 hlm.251-252}."
