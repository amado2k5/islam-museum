id: concept/lian-fiqh
class: concept
kind: legal
label:
  ar: "اللِّعان"
  en: "Mutual cursing between spouses (li'an), fiqh rulings"
  ur: "لعان (میاں بیوی کا لعان، فقہی احکام)"
summary:
  ar: "اللعان في اللغة مصدر لاعن، من اللعن وهو الطرد والإبعاد من الخير، وقيل من الله الطرد والإبعاد، ومن الخلق السب؛ وعند الحنفية والحنابلة شهادات تجري بين الزوجين مؤكدة بالأيمان مقرونة باللعن من الزوج وبالغضب من الزوجة، وعند المالكية حلف الزوج على زنا زوجته أو على نفي حملها أربعاً وحلفها على تكذيبه، وعند الشافعية كلمات معلومة مخصوصة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13617}. ويكون اللعان حجة ضرورية لدفع حد قذف الزوج زوجته أو لنفي الولد منها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13618}."
  en: "Li'an, in lexicon, is a verbal noun from cursing, meaning expulsion or distance from good, or from God, and from people, abuse. For the Hanafis and Hanbalis it is the testimonies between spouses, confirmed by oaths, with the curse from the husband and wrath from the wife; for the Malikis, the husband's four oaths that he saw her commit adultery or denies a pregnancy, and her oaths denying him; for the Shafi'is, fixed words. It serves as necessary proof to ward off the hadd of accusation from the husband, or to deny a child {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13617} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13618}."
  ur: "لعان لغت میں لعن سے مصدر ہے، یعنی خیر سے دوری اور دور کرنا، اور کہا گیا کہ اللہ کی طرف سے دور کرنا، اور مخلوق کی طرف سے گالی؛ حنفیہ اور حنابلہ کے نزدیک یہ میاں بیوی کے درمیان قسموں سے مؤکد گواہیاں ہیں جن میں شوہر کی طرف سے لعنت اور بیوی کی طرف سے غضب کا ذکر ہوتا ہے؛ مالکیہ کے نزدیک شوہر کا زنا یا حمل کی نفی پر چار قسمیں کھانا اور بیوی کا تکذیب کی قسمیں کھانا؛ شافعیہ کے نزدیک معین کلمات؛ اور یہ حد قذف دفع کرنے یا نسب کی نفی کے لیے ضروری حجت ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13617} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13618}۔"
