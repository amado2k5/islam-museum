id: concept/shiba-satiety
class: concept
kind: ethical
label:
  ar: "الشِّبَع"
  en: "Shiba' (satiety) and moderation in eating"
  es: "Shiba' (saciedad) y moderación en la alimentación"
  fr: "Shiba' (satiété) et modération dans l'alimentation"
  ur: "شیبہ ⁦(ترپتی)⁩ اور کھانے میں اعتدال"
summary:
  ar: "الشبع معروف لغة واصطلاحا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9905} من آداب الأكل الاعتدال وعدم ملء البطن، وأكثر ما يسوغ أن يجعل الإنسان بطنه أثلاثا، وقد قسم بعض الفقهاء الأكل إلى واجب ومندوب ومباح ومكروه ومحرم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9905} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9906} والمضطر إلى الميتة يباح له ما يسد الرمق باتفاق الفقهاء، واختلفوا في جواز الشبع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9906} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9907}"
  en: "Satiety is known in language and in the technical sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9905} Moderation is a manner of eating, and the most that suits a person is to divide his belly into thirds, one for food, one for drink and one for breath. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9905} Some jurists grade eating as obligatory, recommended, permitted, disliked or forbidden; excess above satiety is disliked by one view and permitted by the Hanbalis when it does not harm. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9906} For one compelled to eat carrion, all agree that he may take enough to keep him alive, and the jurists differ on whether he may eat to satiety. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9906} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9907}"
  es: "La saciedad se conoce en el lenguaje y en el sentido técnico. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9905} La moderación es una forma de comer, y lo más adecuado para una persona es dividir su estómago en tercios, uno para la comida, uno para la bebida y uno para respirar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9905} Algunos juristas clasifican la comida como obligatoria, recomendada, permitida, desaconsejable o prohibida; el exceso por encima de la saciedad es desaconsejable según una opinión y permitido por los Hanbalis cuando no causa daño. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9906} Para quien se ve obligado a comer carroña, todos coinciden en que puede tomar lo suficiente para mantenerse con vida, y los juristas difieren en si puede comer hasta la saciedad. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9906} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9907}"
  fr: "La satiété est un concept à la fois linguistique et technique. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9905} La modération est une manière de s'alimenter, et la modération est de diviser son estomac en trois parties égales: une pour la nourriture, une pour la boisson et une pour la respiration. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9905} Certains juristes classent l'alimentation en obligatoire, recommandée, permise, déconseillée ou interdite; un excès alimentaire est déconseillé par certains et permis par les hanbalites lorsqu'il n'est pas nocif. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9906} Si une personne est contrainte de manger de la charogne, tous s'accordent à dire qu'elle peut en prendre suffisamment pour survivre, mais les juristes divergent quant à la possibilité de manger à satiété. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9906} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9907}"
  ur: "ترغیب کو زبان اور فنی معنوں میں جانا جاتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 9905} اعتدال کھانے کا ایک طریقہ ہے، اور جو سب سے زیادہ مناسب ہے وہ اپنے پیٹ کو تہائی حصوں میں تقسیم کرنا ہے، ایک کھانے کے لیے، ایک پینے کے لیے اور دوسرا سانس کے لیے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9905} بعض فقہاء نے کھانے کو واجب، مستحب، جائز، ناپسندیدہ یا حرام قرار دیا ہے۔ ترغیب سے بڑھ کر ایک قول کو ناپسند کرتا ہے اور حنبلی اس کی اجازت دیتے ہیں جب اس سے کوئی نقصان نہ ہو۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 9906} مردار کھانے پر سب کا اتفاق ہے کہ وہ اسے زندہ رکھنے کے لیے کافی مقدار میں لے سکتا ہے، اور فقہاء کا اس میں اختلاف ہے کہ آیا وہ سیر ہو کر کھا سکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9906}"
