id: concept/shiba-satiety
class: concept
kind: ethical
label:
  ar: "الشِّبَع"
  en: "Shiba' (satiety) and moderation in eating"
summary:
  ar: "الشبع معروف لغة واصطلاحا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9905} من آداب الأكل الاعتدال وعدم ملء البطن، وأكثر ما يسوغ أن يجعل الإنسان بطنه أثلاثا، وقد قسم بعض الفقهاء الأكل إلى واجب ومندوب ومباح ومكروه ومحرم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9905} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9906} والمضطر إلى الميتة يباح له ما يسد الرمق باتفاق الفقهاء، واختلفوا في جواز الشبع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9906} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9907}"
  en: "Satiety is known in language and in the technical sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9905} Moderation is a manner of eating, and the most that suits a person is to divide his belly into thirds, one for food, one for drink and one for breath. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9905} Some jurists grade eating as obligatory, recommended, permitted, disliked or forbidden; excess above satiety is disliked by one view and permitted by the Hanbalis when it does not harm. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9906} For one compelled to eat carrion, all agree that he may take enough to keep him alive, and the jurists differ on whether he may eat to satiety. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9906} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9907}"
