summary:
  ar: "أعمال الذين كفروا كسراب بقيعة يحسبه الظمآن ماء حتى إذا جاءه لم يجده شيئاً ووجد الله عنده فوفاه حسابه."
  en: "The works of the disbelievers are like a mirage in a lowland: the thirsty think it water until, coming to it, they find nothing — and find God there paying their account in full."
  ur: "کافروں کے اعمال پرے دشت کے سراب جیسے ہیں: پیاسا اسے پانی سمجھتا ہے جب تک وہاں پہنچ کر کچھ نہ پائے — اور وہاں اللہ پائے جو ان کا حساب پورا کرے۔"
  es: "Las obras de los incrédulos son como un espejismo en una llanura: los sedientos creen que es agua hasta que, al acercarse, no encuentran nada, y descubren que allí Dios les paga la cuenta por completo."
  fr: "Les œuvres des mécréants sont comme un mirage dans une plaine: celui qui a soif croit y trouver de l’eau jusqu’à ce que, s’approchant, il n’y trouve rien — et qu’il y trouve Dieu qui paie intégralement sa dette."
  tr: "İnfir edenlerin yaptıkları, susamışların su sandığı bir yerde bir serap gibidir; ta ki oraya gelince hiçbir şey bulamazlar ve Allah'ta bulurlar, böylece O hesabını yerine getirir."
  id: "Perbuatan orang yang kafir seperti fatamorgana di tempat yang dianggap oleh orang haus sebagai air, sampai ketika itu terjadi, mereka tidak menemukan apa-apa dan menemukannya kepada Allah, maka Dia menepati perjanjian-Nya."
