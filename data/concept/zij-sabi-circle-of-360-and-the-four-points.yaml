label: { ar: "تقسيم دائرة الفلك ثلثمائة وستين جزءاً والنقط الأربع", en: "Dividing the circle into 360 parts and the four points", ur: "دائرۂ فلک کی ۳۶۰ حصوں میں تقسیم اور چار نقطے", es: "Dividir el círculo en 360 partes y los cuatro puntos", fr: "En divisant le cercle en 360 parties et en obtenant les quatre points", tr: "Gök küresi üç yüz altmış parçaya ve dört noktaya bölünmüştür.", id: "Bola langit terbagi menjadi tiga ratus enam puluh bagian dan empat titik" }
summary:
  ar: "في الباب الثاني ينقل البتاني عن الأوائل أنهم جزأوا دائرة الفلك ثلثمائة وستين جزءاً، ويذكر حجتهم: أن هذا العدد قريب من عدد أيام السنة التي تكمل بدوران الشمس، وأنه عدد له نصف وثلث وربع وغير ذلك من الكسور التي لا تصح لكثير من الأعداد. ثم يربط التقسيم بنقط الاعتدالين والانقلابين. {cite:zij-sabi-nallino-byblion p.12}."
  en: "In chapter 2 al-Battani reports that the ancients divided the circle of the sphere into 360 parts and gives their reasons: that the number is near the number of days of the year, which the Sun completes by its circuit, and that it has a half, a third, a quarter and other fractions that many numbers lack. He then ties the division to the points of the two equinoxes and two solstices. {cite:zij-sabi-nallino-byblion p.12}."
  ur: "دوسرے باب میں البتانی بیان کرتے ہیں کہ اگلوں نے دائرۂ فلک کو ۳۶۰ حصوں میں بانٹا اور ان کی دلیل بتاتے ہیں: یہ عدد سال کے دنوں کے عدد کے قریب ہے جو سورج کی گردش سے پورے ہوتے ہیں، اور اس عدد کا نصف، تہائی، چوتھائی اور دوسرے کسور ہیں جو بہت سے اعداد میں صحیح نہیں بنتے۔ پھر وہ اس تقسیم کو اعتدالین اور انقلابین کے نقطوں سے جوڑتے ہیں۔ {cite:zij-sabi-nallino-byblion p.12}۔"
  es: "En el capítulo 2, al-Battani relata que los antiguos dividieron el círculo de la esfera en 360 partes y explica sus razones: que este número se aproxima al número de días del año, que el Sol completa en su recorrido, y que incluye la mitad, un tercio, un cuarto y otras fracciones que muchos números no poseen. A continuación, relaciona esta división con los puntos de los dos equinoccios y los dos solsticios. {cite:zij-sabi-nallino-byblion p.12}."
  fr: "Au chapitre 2, al-Battani rapporte que les anciens divisaient le cercle de la sphère en 360 parties et en donne les raisons: ce nombre est proche du nombre de jours de l’année, que le Soleil parcourt lors de sa révolution, et il comprend la moitié, le tiers, le quart et d’autres fractions qui font défaut à de nombreux nombres. Il relie ensuite cette division aux points des deux équinoxes et des deux solstices. {cite:zij-sabi-nallino-byblion p.12}."
  tr: "İkinci bölümde, el-Battani, eski çağ insanlarının gök küresini üç yüz altmış parçaya böldüğünü aktarıyor ve bu sayının güneşin dönüşüyle tamamlanan bir yıldaki gün sayısına yakın olduğunu ve birçok sayı için geçerli olmayan yarım, üçte bir, dörtte bir ve diğer kesirleri içerdiğini öne sürüyor. Daha sonra bu bölmeyi ekinoks ve solstis noktalarıyla ilişkilendiriyor. {cite:zij-sabi-nallino-byblion s.12}."
  id: "Dalam bab kedua, al-Battani mengutip para filsuf kuno yang membagi bola langit menjadi tiga ratus enam puluh bagian, dan ia menyebutkan argumen mereka: bahwa angka ini mendekati jumlah hari dalam setahun yang diselesaikan oleh rotasi matahari, dan bahwa angka ini memiliki setengah, sepertiga, seperempat, dan pecahan lain yang tidak berlaku untuk banyak angka. Kemudian ia menghubungkan pembagian tersebut dengan titik-titik ekuinoks dan solstis. {cite:zij-sabi-nallino-byblion p.12}."
