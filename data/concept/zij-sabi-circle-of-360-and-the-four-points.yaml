label: { ar: "تقسيم دائرة الفلك ثلثمائة وستين جزءاً والنقط الأربع", en: "Dividing the circle into 360 parts and the four points", ur: "دائرۂ فلک کی ۳۶۰ حصوں میں تقسیم اور چار نقطے" }
summary:
  ar: "في الباب الثاني ينقل البتاني عن الأوائل أنهم جزأوا دائرة الفلك ثلثمائة وستين جزءاً، ويذكر حجتهم: أن هذا العدد قريب من عدد أيام السنة التي تكمل بدوران الشمس، وأنه عدد له نصف وثلث وربع وغير ذلك من الكسور التي لا تصح لكثير من الأعداد. ثم يربط التقسيم بنقط الاعتدالين والانقلابين. {cite:zij-sabi-nallino-byblion p.12}."
  en: "In chapter 2 al-Battani reports that the ancients divided the circle of the sphere into 360 parts and gives their reasons: that the number is near the number of days of the year, which the Sun completes by its circuit, and that it has a half, a third, a quarter and other fractions that many numbers lack. He then ties the division to the points of the two equinoxes and two solstices. {cite:zij-sabi-nallino-byblion p.12}."
  ur: "دوسرے باب میں البتانی بیان کرتے ہیں کہ اگلوں نے دائرۂ فلک کو ۳۶۰ حصوں میں بانٹا اور ان کی دلیل بتاتے ہیں: یہ عدد سال کے دنوں کے عدد کے قریب ہے جو سورج کی گردش سے پورے ہوتے ہیں، اور اس عدد کا نصف، تہائی، چوتھائی اور دوسرے کسور ہیں جو بہت سے اعداد میں صحیح نہیں بنتے۔ پھر وہ اس تقسیم کو اعتدالین اور انقلابین کے نقطوں سے جوڑتے ہیں۔ {cite:zij-sabi-nallino-byblion p.12}۔"
