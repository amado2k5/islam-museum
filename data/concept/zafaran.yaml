summary:
  ar: "الزعفران حار يابس، قابض محلّل منضج؛ يحسّن اللون، ويقوّي القلب والمعدة والكبد، وينفع الورم الحار في الأذن، ويضرّ الرأس إذا أُفرط، ويهيّج الباه ويدرّ البول، ويُسقط الشهوة. {cite:canon-ibn-sina-print-v1 p.464}"
  en: "Saffron is hot and dry, astringent, dissolving and ripening. It improves the complexion, strengthens the heart, stomach and liver, helps hot swelling in the ear, harms the head in excess, stirs desire and urine, and lessens appetite. {cite:canon-ibn-sina-print-v1 p.464}"
  ur: "زعفران گرم اور خشک ہے؛ قابض، تحلیل کرنے والا اور پکانے والا۔ یہ رنگ نکھارتا، دل، معدے اور جگر کو قوت دیتا، کان کی گرم سوجن میں مفید ہے، زیادہ لینے سے سر کو نقصان دیتا ہے، شہوت اور پیشاب ابھارتا ہے، اور بھوک کم کرتا ہے۔ {cite:canon-ibn-sina-print-v1 p.464}"
  es: "El azafrán es cálido y seco, astringente, disolvente y madurador. Mejora la tez, fortalece el corazón, el estómago y el hígado, alivia la inflamación del oído, es perjudicial para la cabeza en exceso, estimula el deseo y la micción, y disminuye el apetito. {cite:canon-ibn-sina-print-v1 p.464}"
  fr: "Le safran est chaud et sec, astringent, dissolvant et mûrissant. Il améliore le teint, fortifie le cœur, l'estomac et le foie, soulage les otites, mais est déconseillé en cas d'excès. Il stimule le désir et la diurèse, et diminue l'appétit. {cite:canon-ibn-sina-print-v1 p.464}"
  tr: "Safran sıcak ve kuru, büzücü, çözücü ve olgunlaştırıcıdır; cilt rengini iyileştirir, kalbi, mideyi ve karaciğeri güçlendirir ve kulaktaki sıcak şişliklere iyi gelir. Ancak aşırı tüketildiğinde başa zararlıdır, cinsel isteği artırır, idrar söktürücüdür ve libidoyu baskılar. {cite:canon-ibn-sina-print-v1 s.464}"
  id: "Saffron bersifat panas dan kering, astringen, pelarut, dan pematangan; memperbaiki warna kulit, memperkuat jantung, lambung, dan hati, serta bermanfaat untuk pembengkakan panas di telinga. Namun, berbahaya bagi kepala jika dikonsumsi secara berlebihan, merangsang hasrat seksual, meningkatkan buang air kecil, dan menekan libido. {cite:canon-ibn-sina-print-v1 p.464}"
