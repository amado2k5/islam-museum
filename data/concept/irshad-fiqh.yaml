label:
  ar: "إرشاد"
  en: "Irshad (guidance)"
  ur: "ارشاد ⁦(رہنمائی)⁩"
  es: "Irshad (orientación)"
  fr: "Irshad (conseils)"
  tr: "Rehberlik"
  id: "Panduan"
summary:
  ar: "الإرشاد في اللغة الهداية والدلالة، وعند الأصوليين أحد المعاني المجازية للأمر، وهو تعليم أمر دنيوي، وفرقوا بينه وبين الندب بأن مصلحته دنيوية. وعند الفقهاء هو دلالة الناس على الخير ونصحهم، وهو واجب بالرفق والقول اللين إذا ظُن الفائدة ولم يُخف على النفس أو المال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2187} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2188}"
  en: "Irshad means guidance and pointing the way. The usulis treat it as a figurative meaning of the command, the teaching of a worldly matter, distinct from nadb by its worldly benefit. For the jurists it is pointing people to good and counselling them, which is obligatory when done gently, a benefit is likely and no harm is feared to oneself or one's property. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2187} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2188}"
  ur: "ارشاد لغت میں ہدایت اور راہ دکھانا ہے۔ اصولی اسے امر کے مجازی معنوں میں سے ایک قرار دیتے ہیں، یعنی کسی دنیوی امر کی تعلیم، اور ندب سے اس کی مصلحت دنیوی ہونے کی بنا پر مختلف ہے۔ فقہاء کے نزدیک یہ لوگوں کو خیر کی طرف راہنمائی اور نصیحت ہے، جو نرمی سے کی جائے تو واجب ہے، جب فائدے کا گمان ہو اور جان یا مال کا خوف نہ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2187} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2188}"
  es: "Irshad significa guía e indicación del camino. Los usulis lo interpretan como una expresión figurada del mandato, la enseñanza de un asunto mundano, distinto de nadb por su beneficio terrenal. Para los juristas, se trata de guiar a las personas hacia el bien y aconsejarlas, lo cual es obligatorio cuando se realiza con gentileza, es probable que se obtenga un beneficio y no se teme ningún daño a uno mismo ni a sus bienes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2187} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2188}"
  fr: "Irshad signifie guidance et indication du chemin. Les usulis l'interprètent comme une signification figurative du commandement, l'enseignement d'une matière mondaine, distinct de nadb par son bénéfice terrestre. Pour les juristes, il s'agit d'orienter les gens vers le bien et de les conseiller, ce qui est obligatoire lorsqu'il est fait avec douceur, car un bienfait est probable et aucun dommage n'est à craindre pour soi-même ou ses biens. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2187} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2188}"
  tr: "Dil rehberliği ve göstergesi rehberlik ve göstergedir; usul (usul) bilginleri arasında ise dünyevi bir meseleyi öğreten bir emrin mecazi anlamlarından biridir. Onlar, faydasının dünyevi olduğunu söyleyerek onu tavsiyeden ayırırlar. Hukukçulara göre, insanlara iyilik ve öğüt göstergesidir ve eğer kişi fayda bekliyorsa ve kendine ya da servetine zarar vermekten korkmuyorsa, nazik ve nazik bir konuşmayla zorunludur. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.2187} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.2188}"
  id: "Panduan dan petunjuk dalam bahasa adalah panduan dan indikasi, dan di antara para sarjana usul (usul) ini adalah salah satu makna metaforis dari sebuah perintah, yaitu mengajarkan sesuatu yang duniawi. Mereka membedakannya dari rekomendasi dengan mengatakan manfaatnya adalah duniawi. Menurut para ahli hukum, ini adalah indikasi kebaikan dan nasihat kepada orang, dan wajib dengan kelembutan dan ucapan yang lembut jika seseorang mengharapkan manfaat dan tidak takut akan bahaya bagi diri sendiri atau kekayaan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.2187} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.2188}"
