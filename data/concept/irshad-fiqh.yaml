label:
  ar: "إرشاد"
  en: "Irshad (guidance)"
  ur: "ارشاد (رہنمائی)"
summary:
  ar: "الإرشاد في اللغة الهداية والدلالة، وعند الأصوليين أحد المعاني المجازية للأمر، وهو تعليم أمر دنيوي، وفرقوا بينه وبين الندب بأن مصلحته دنيوية. وعند الفقهاء هو دلالة الناس على الخير ونصحهم، وهو واجب بالرفق والقول اللين إذا ظُن الفائدة ولم يُخف على النفس أو المال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2187} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2188}"
  en: "Irshad means guidance and pointing the way. The usulis treat it as a figurative meaning of the command, the teaching of a worldly matter, distinct from nadb by its worldly benefit. For the jurists it is pointing people to good and counselling them, which is obligatory when done gently, a benefit is likely and no harm is feared to oneself or one's property. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2187} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2188}"
  ur: "ارشاد لغت میں ہدایت اور راہ دکھانا ہے۔ اصولی اسے امر کے مجازی معنوں میں سے ایک قرار دیتے ہیں، یعنی کسی دنیوی امر کی تعلیم، اور ندب سے اس کی مصلحت دنیوی ہونے کی بنا پر مختلف ہے۔ فقہاء کے نزدیک یہ لوگوں کو خیر کی طرف راہنمائی اور نصیحت ہے، جو نرمی سے کی جائے تو واجب ہے، جب فائدے کا گمان ہو اور جان یا مال کا خوف نہ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2187} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2188}"
