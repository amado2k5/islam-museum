label:
  ar: أحلام الأنبياء
  en: The prophets' dreams
  ur: انبیاء کے خواب
summary:
  ar: 'رؤى الأنبياء في القرآن وسيرتهم: رؤيا يوسف والإخوة والسجن والملك، ورؤيا إبراهيم في ذبح ابنه، ورؤيا النبي التي صدقها الله في البدر والمسجد الحرام. {cite:tanzil-quran} {cite:sahih-al-bukhari}'
  en: 'The prophets'' dreams in the Qur''an and seerah: Joseph''s dream of the stars, his brothers, the prison and the king; Abraham''s dream of the sacrifice; and the Prophet''s dream that God fulfilled at Badr and the Sacred Mosque. {cite:tanzil-quran} {cite:sahih-al-bukhari}'
  ur: 'قرآن اور سیرت میں انبیاء کے خواب: یوسف کا خواب ستاروں، بھائیوں، قید اور بادشاہ کا، ابراہیم کا بیٹے کی قربانی کا خواب، اور نبی کا وہ خواب جسے اللہ نے بدر اور مسجد حرام میں سچا کیا۔ {cite:tanzil-quran} {cite:sahih-al-bukhari}'
