summary:
  ar: "يقرر ابن سينا أن كل نبضة مركبة من حركتين وسكونين، وينقل خلاف الأطباء في إحساس الانقباض، ويذكر قول جالينوس {cite:canon-ibn-sina-print-v1 p.168}."
  en: "Ibn Sina sets out that every beat is made of two motions and two rests, reports physicians' disagreement over whether contraction can be felt, and cites Galen {cite:canon-ibn-sina-print-v1 p.168}."
  es: "Ibn Sina expone que cada latido se compone de dos movimientos y dos pausas, informa sobre el desacuerdo de los médicos acerca de si se puede sentir la contracción y cita a Galeno {cite:canon-ibn-sina-print-v1 p.168}."
  fr: "Ibn Sina explique que chaque battement est composé de deux mouvements et de deux pauses, rapporte le désaccord des médecins sur la possibilité de ressentir la contraction et cite Galien {cite:canon-ibn-sina-print-v1 p.168}."
  ur: "ابن سینا نے بیان کیا ہے کہ ہر دھڑکن دو حرکات اور دو آراموں سے بنتی ہے، ڈاکٹروں کے اس بات پر اختلاف کی اطلاع دیتے ہیں کہ آیا سکڑاؤ کو محسوس کیا جا سکتا ہے، اور گیلن کا حوالہ دیتے ہیں {cite:canon-ibn-sina-print-v1 p.168}۔"
