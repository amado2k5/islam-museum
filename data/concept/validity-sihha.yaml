id: concept/validity-sihha
class: concept
kind: legal
label:
  ar: "الصِّحَّة"
  en: "Sihha (validity in law: what makes an act valid, its difference from ijza' and from void acts, the effect of health on duties, and the rules of sound hadith)"
  es: "Sihha (validez en la ley: qué hace que un acto sea válido, su diferencia con el ijza' y con los actos nulos, el efecto de la salud en los deberes y las reglas del hadiz auténtico)"
  fr: "Sihha (validité en droit: ce qui rend un acte valide, sa différence avec l'ijza' et les actes nuls, l'effet de la santé sur les devoirs et les règles du hadith authentique)"
  ur: "سہہ ⁦(شریعت میں جائز: کیا چیز کسی عمل کو صحیح بناتی ہے، اس کا اجزا اور باطل کاموں میں فرق، فرائض پر صحت کا اثر، اور صحیح حدیث کے احکام)⁩"
  tr: "Sağlık"
  id: "Kesehatan"
summary:
  ar: "الصحة في الأصول من أقسام الحكم الوضعي، وهي موافقة الشرع، وعند الجمهور تشمل العبادات والعقود، وعند الحنفية في العبادات اندفاع القضاء، وفي المعاملات ترتب أثرها. والإجزاء موافقة أمر الشارع باستجماع الشروط، والبطلان في المعاملات عند الحنفية وقوعها على وجه غير مشروع بأصله ولا وصفه. وصحة البدن شرط في بعض التكاليف كإمامة الصلاة والجهاد والحج، ولا تشترط في الحد بالرجم أو القصاص. وللمحدثين خمسة شروط للحديث الصحيح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10289} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10290} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10291} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10292}"
  en: "In the principles of law validity is one of the kinds of legal rulings: the act's agreement with the law. For the majority it covers acts of worship and contracts; for the Hanafis, in worship, it means that the duty to repeat is cleared, and in contracts that its effect follows. Ijza' is agreement with the lawgiver's command by having all its conditions; the Hanafis take voidness in contract to be an act that is unlawful in its root or its attribute. Health of the body is a condition for some duties, such as leading prayer, jihad and the pilgrimage, but not for stoning or retaliation. The hadith scholars set five conditions for a sound hadith. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10289} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10290} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10291} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10292}"
  es: "En los principios jurídicos, la validez es uno de los tipos de resoluciones legales: la concordancia del acto con la ley. Para la mayoría, abarca los actos de culto y los contratos; para los hanafíes, en el culto, significa que se cumple el deber de repetirlo, y en los contratos que se cumple su efecto. El ijza' es la concordancia con el mandato del legislador al cumplir con todas sus condiciones; los hanafíes consideran que la nulidad en un contrato se refiere a un acto ilícito en su raíz o en sus atributos. La salud del cuerpo es una condición para ciertos deberes, como dirigir la oración, la yihad y la peregrinación, pero no para la lapidación o la represalia. Los eruditos del hadiz establecen cinco condiciones para un hadiz auténtico. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10289} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10290} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10291} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10292}"
  fr: "En droit, la validité est une forme de décision juridique: la conformité d'un acte à la loi. Pour la majorité, elle concerne les actes de culte et les contrats. Pour les hanafites, en matière de culte, elle signifie que l'obligation de le répéter est remplie, et en matière de contrats, que son effet s'ensuit. L'ijza' est la conformité au commandement du législateur par le respect de toutes ses conditions. Les hanafites considèrent qu'un contrat est nul s'il est illicite par essence ou par attribut. La santé physique est une condition pour certains devoirs, comme diriger la prière, le jihad et le pèlerinage, mais non pour la lapidation ou les représailles. Les spécialistes du hadith ont établi cinq conditions pour un hadith authentique. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10289} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10290} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10291} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10292}"
  ur: "قانون کے اصولوں میں جواز قانونی احکام کی ایک قسم ہے: قانون کے ساتھ ایکٹ کا معاہدہ۔ اکثریت کے لیے یہ عبادات اور معاہدوں کا احاطہ کرتا ہے۔ احناف کے نزدیک عبادات میں اس کا مطلب یہ ہے کہ دہرانے کا فرض صاف ہو گیا ہے اور عقد میں اس کا اثر ہوتا ہے۔ اجزا قانون دینے والے کے حکم سے اس کی تمام شرائط کے ساتھ متفق ہے۔ احناف عقد میں باطل کو ایسا فعل سمجھتے ہیں جو اس کی اصل یا اس کی صفت میں ناجائز ہو۔ جسم کی صحت کچھ فرائض کے لیے شرط ہے، جیسے نماز، جہاد اور حج کی امامت، لیکن رجم یا انتقام کے لیے نہیں۔ محدثین نے صحیح حدیث کے لیے پانچ شرائط رکھی ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10289} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10290} صفحہ 10292}"
  tr: "İlkelerde geçerlilik, Şeriat'a uygun olan olumlu bir yönetim kategorisidir. Çoğunluğa göre, ibadet ve sözleşmeleri içerir. Hanefilere göre, ibadet eylemlerinde namazların uydurulması dürtüsü içerir ve işlemlerde etkileri gerçekleşir. Tazminat, Kanuniyetçinin şartları yerine getirme emrine uyulmasıdır ve Hanefi'ye göre işlemlerin geçersizliği, bunların kaynağı veya tanımı nedeniyle yasadışı bir şekilde gerçekleşmesidir. Bedenin sağlığı, namaz, cihat ve hac gibi bazı yükümlülükler için bir koşuldur ve hududun taşlama veya intikam olması için zorunlu değildir. Hadis âlimlerine göre, gerçek hadis için beş koşul vardır. {alıntı:) fiqh-mawsua-kuwaitiyya-noor-v3 s.10289} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.10290} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.10291} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.10292}"
  id: "Keabsahan dalam prinsip adalah kategori dari keputusan positif, yang sesuai dengan Syariah. Menurut mayoritas, ini mencakup tindakan ibadah dan kontrak. Menurut Hanafi, dalam tindakan ibadah melibatkan dorongan untuk menyusun doa, dan dalam transaksi efeknya terkait. Kompensasi adalah kepatuhan terhadap perintah Pemberi Hukum untuk memenuhi syarat, dan ketidakabsahan dalam transaksi menurut Hanafi terjadi dengan cara yang tidak sah berdasarkan asal atau deskripsinya. Kesehatan tubuh adalah syarat untuk kewajiban tertentu seperti memimpin doa, jihad, dan ziarah, dan tidak diwajibkan agar hudud berupa rajam atau pembalasan. Menurut para ulama hadis, ada lima syarat untuk hadits yang otentik. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10289} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10290} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10291} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10292}"
