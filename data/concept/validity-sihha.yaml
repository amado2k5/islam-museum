id: concept/validity-sihha
class: concept
kind: legal
label:
  ar: "الصِّحَّة"
  en: "Sihha (validity in law: what makes an act valid, its difference from ijza' and from void acts, the effect of health on duties, and the rules of sound hadith)"
summary:
  ar: "الصحة في الأصول من أقسام الحكم الوضعي، وهي موافقة الشرع، وعند الجمهور تشمل العبادات والعقود، وعند الحنفية في العبادات اندفاع القضاء، وفي المعاملات ترتب أثرها. والإجزاء موافقة أمر الشارع باستجماع الشروط، والبطلان في المعاملات عند الحنفية وقوعها على وجه غير مشروع بأصله ولا وصفه. وصحة البدن شرط في بعض التكاليف كإمامة الصلاة والجهاد والحج، ولا تشترط في الحد بالرجم أو القصاص. وللمحدثين خمسة شروط للحديث الصحيح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10289} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10290} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10291} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10292}"
  en: "In the principles of law validity is one of the kinds of legal rulings: the act's agreement with the law. For the majority it covers acts of worship and contracts; for the Hanafis, in worship, it means that the duty to repeat is cleared, and in contracts that its effect follows. Ijza' is agreement with the lawgiver's command by having all its conditions; the Hanafis take voidness in contract to be an act that is unlawful in its root or its attribute. Health of the body is a condition for some duties, such as leading prayer, jihad and the pilgrimage, but not for stoning or retaliation. The hadith scholars set five conditions for a sound hadith. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10289} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10290} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10291} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10292}"
