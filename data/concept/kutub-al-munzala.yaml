id: concept/kutub-al-munzala
class: concept
kind: term
label: { ar: "الكتب المنزلة", en: "The revealed books" }
summary:
  ar: "نقل ابن النديم من كتاب قديم النسخ يشبه أن يكون من خزانة المأمون ترجمه أحمد بن عبد الله بن سلام مولى أمير المؤمنين هارون من كتاب الحنفاء وهم الصابئون الإبراهيمية الذين آمنوا بإبراهيم وحملوا عنه الصحف، فجاء فيه أن جميع الأنبياء مائة ألف وأربعة وعشرون ألف نبي منهم المرسلون بالوحي شفاهاً ثلاث مائة وخمسة عشر نبياً، وأن جميع ما أنزل الله من الكتب مائة كتاب وأربعة كتب، من ذلك مائة صحيفة بين آدم وموسى: صحف آدم إحدى وعشرون صحيفة وصحف شيث تسع وعشرون وصحف أخنوخ وهو إدريس ثلاثون وصحف إبراهيم عشر وصحف موسى عشر قبل التوراة، ثم أنزل التوراة على موسى في عشرة ألواح وذكر أن الألواح خضر وكتابتها حمرة في مثل شعاع الشمس وعلق ابن النديم أن اليهود لا تعرف هذه الصفة، فلما نزل موسى ووجد أصحابه قد عبدوا العجل رمى بها فتكسرت فأوحى الله أنه يردها في لوحين لوح الميثاق ولوح الشهادة، ثم المزامير على داود وهو الزبور مائة وخمسون مزموراً، وذكر من كتب اليهود المشنا كتاب موسى الذي يستخرجون منه علم الفقه والشرائع ولغته كسداني وعبراني، وكتب يهوشع وشفطي وشموئيل وإشعيا وإرميا وحزقيل وملخي وروث وقوهلت وديوان الأيام {cite:fihrist-ibn-al-nadim p. 51-55}."
  en: "124,000 prophets, 104 revealed books, the suhuf tallies and the tablets' green stone — per Ahmad b. Abdallah b. Salam's Kitab al-Hunafa translation {cite:fihrist-ibn-al-nadim p. 51-55}."
