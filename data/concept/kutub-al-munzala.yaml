label: { ar: "الكتب المنزلة", en: "The revealed books", es: "Los libros revelados", fr: "Les livres révélés", ur: "نازل شدہ کتابیں۔", tr: "Yayımlanan Kitaplar", id: "Buku yang Diterbitkan" }
summary:
  ar: "نقل ابن النديم من كتاب قديم النسخ يشبه أن يكون من خزانة المأمون ترجمه أحمد بن عبد الله بن سلام مولى أمير المؤمنين هارون من كتاب الحنفاء وهم الصابئون الإبراهيمية الذين آمنوا بإبراهيم وحملوا عنه الصحف، فجاء فيه أن جميع الأنبياء مائة ألف وأربعة وعشرون ألف نبي منهم المرسلون بالوحي شفاهاً ثلاث مائة وخمسة عشر نبياً، وأن جميع ما أنزل الله من الكتب مائة كتاب وأربعة كتب، من ذلك مائة صحيفة بين آدم وموسى: صحف آدم إحدى وعشرون صحيفة وصحف شيث تسع وعشرون وصحف أخنوخ وهو إدريس ثلاثون وصحف إبراهيم عشر وصحف موسى عشر قبل التوراة، ثم أنزل التوراة على موسى في عشرة ألواح وذكر أن الألواح خضر وكتابتها حمرة في مثل شعاع الشمس وعلق ابن النديم أن اليهود لا تعرف هذه الصفة، فلما نزل موسى ووجد أصحابه قد عبدوا العجل رمى بها فتكسرت فأوحى الله أنه يردها في لوحين لوح الميثاق ولوح الشهادة، ثم المزامير على داود وهو الزبور مائة وخمسون مزموراً، وذكر من كتب اليهود المشنا كتاب موسى الذي يستخرجون منه علم الفقه والشرائع ولغته كسداني وعبراني، وكتب يهوشع وشفطي وشموئيل وإشعيا وإرميا وحزقيل وملخي وروث وقوهلت وديوان الأيام {cite:fihrist-ibn-al-nadim p. 51-55}."
  en: "124,000 prophets, 104 revealed books, the suhuf tallies and the tablets' green stone — per Ahmad b. Abdallah b. Salam's Kitab al-Hunafa translation {cite:fihrist-ibn-al-nadim p. 51-55}."
  es: "124.000 profetas, 104 libros revelados, los recuentos del suhuf y la piedra verde de las tablas — según la traducción del Kitab al-Hunafa de Ahmad b. Abdallah b. Salam {cite:fihrist-ibn-al-nadim p. 51-55}."
  fr: "124 000 prophètes, 104 livres révélés, les comptes du suhuf et la pierre verte des tablettes — selon la traduction du Kitab al-Hunafa d'Ahmad b. Abdallah b. Salam {cite:fihrist-ibn-al-nadim p. 51-55}."
  ur: "124,000 انبیاء، 104 نازل شدہ کتابیں، صحیفے اور تختیوں کا سبز پتھر۔ عبداللہ بی سلام کی کتاب الحنافہ ترجمہ {حوالہ: فہرست ابن الندیم ص۔ 51-55}۔"
  tr: "İbn el-Nadim, el-Me'mun kütüphanesinden olduğu düşünülen eski bir el yazmasından, Amanların Komutanı Harun'un özgür adamı Ahmed ibn Abdullah ibn Salam tarafından çevrilmiştir; bu el yazması, İbrahim'e inanan ve ondan kutsal metinleri taşıyan İbrahimî Sabililerdi. Kitapta, tüm peygamberlerin yüz yirmi dört bin peygamber olduğu, vahiyle gönderilenler de dahil olmak üzere, üç yüz on beş peygamberin iyileşmesi ve Allah tarafından vahyedilen tüm kitapların yüz dört kitap olduğu, bunların arasında Adem ve Musa arasında yüz parşömen olduğu belirtilir: Adem'in Kutsal Yazıları yirmi bir, Şet Yazıları yirmi dokuz, Enoch, İdris Yazıları otuz, İbrahim'in Yazıları ve Musa'nın Kutsal Yazıları on yıl öncesindeydi. Sonra Musa'ya Tevrat'ı on tablet halinde vahyetti ve levhaların yeşil olduğunu, yazılarının ise güneş ışınları gibi kırmızı olduğunu belirtti. İbn el-Nadim Yahudilerin bu tanımı bilmediğini belirtti. Musa indiğinde yoldaşlarının buzağıya taptığını görünce onu fırlattı ve buzağı kırıldı. Tanrı, onu iki tablete geri vereceğini açıkladı: Antlaşma Tableti ve Tanıklık Tableti, ardından Davud'a Mezmurlar, ki bu Mezmurlar yüz elli mezmurdur. Mişna'nın Yahudi kitapları arasında, fıkıh ve yasalar hakkında bilgi edindikleri Musa Kitabı vardır; dili Hasidane, İbranice ve Yeşu, Şepi, Şmuel, İşaya, Yeremya, Hezekiel, Melki, Roth, Kohelet ve Günler Kitabı (atıf:fihrist-ibn-al-nadim s. 51-55} olarak kullanılır."
  id: "Ibn al-Nadim mengutip dari naskah lama yang tampaknya berasal dari perpustakaan al-Ma'mun, diterjemahkan oleh Ahmad ibn Abdullah ibn Salam, mantan Komandan Harun yang Beriman dari kitab Hanafi, yang merupakan Sabian Abrahamik yang percaya kepada Abraham dan membawa kitab suci darinya. Surat itu menyatakan bahwa semua nabi adalah seratus dua puluh empat ribu nabi, termasuk yang dikirim melalui wahyu, dan tiga ratus lima belas nabi disembuhkan, dan semua kitab yang diwahyukan oleh Allah adalah seratus empat kitab, termasuk seratus gulungan antara Adam dan Musa: Kitab Suci Adam berjumlah dua puluh satu, Kitab Suci Sheth dua puluh sembilan, Kitab Suci Henokh, Idris tiga puluh, Kitab Suci Abraham, dan Kitab Musa sepuluh sebelum Taurat. Kemudian Ia mewahyukan Taurat kepada Musa dalam sepuluh tablet dan menyebutkan bahwa lempengan itu berwarna hijau dan tulisannya merah seperti sinar matahari. Ibn al-Nadim berkomentar bahwa orang Yahudi tidak mengetahui deskripsi ini. Ketika Musa turun dan menemukan teman-temannya menyembah anak sapi itu, ia melemparkannya dan anak sapi itu pecah. Allah mengungkapkan bahwa Ia akan mengembalikannya menjadi dua lempenga: Tablet Perjanjian dan Tablet Kesaksian, lalu Mazmur kepada Daud, yaitu Mazmur-mazmurnya terdiri dari seratus lima puluh mazmur. Di antara kitab-kitab Yahudi dalam Mishnah terdapat Kitab Musa, dari mana mereka memperoleh pengetahuan tentang fiqhubah dan hukum, dan bahasanya adalah Chassidane, Ibrani, serta kitab-kitab Yosua, Shepti, Shmuel, Yesaya, Yeremia, Yehezkiel, Melki, Roth, Kohelet, dan Kitab Hari-hari {cite:fihrist-ibn-al-nadim hlm. 51-55}."
