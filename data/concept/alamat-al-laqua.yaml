label:
  ar: "علامات اللقوة"
  en: "Signs of facial palsy"
  ur: "لقوہ کی علامات"
summary:
  ar: "علاماتها أن تقع النفحة والبزقة من جانب ولا يستمسك الريح ولا يستمسك الريق من شقّ، وكثيراً ما يلحق معها صداع وخاصة في التشنجية، والشقّ المؤف هو الذي إذا مدّ وأصلح باليد سهل رجوع الآخر بالطبع إلى شكله {cite:canon-ibn-sina-print-v2 p.154} {cite:canon-ibn-sina-print-v2 p.155}"
  en: "Its signs are that the puff and the spit issue from one side, and wind and saliva are not held in from a side; headache often accompanies it, especially in the convulsive kind; the afflicted side is the one which, when stretched and set right by the hand, lets the other easily return by nature to its shape {cite:canon-ibn-sina-print-v2 p.154} {cite:canon-ibn-sina-print-v2 p.155}"
  ur: "اس کی علامتیں یہ ہیں کہ پھونک اور تھوک ایک جانب سے نکلے اور ہوا اور لعاب ایک شق سے نہیں روکے جاسکیں؛ اور اکثر اس کے ساتھ سر درد بھی ہوتا ہے خصوصاً تشنجی قسم میں؛ اور مؤف شق وہی ہے جسے ہاتھ سے سیدھا اور درست کیا جائے تو دوسرا فطری طور پر اپنی ہیئت پر آسانی سے لوٹ آئے {cite:canon-ibn-sina-print-v2 p.154} {cite:canon-ibn-sina-print-v2 p.155}۔"
