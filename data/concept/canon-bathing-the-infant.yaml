summary:
  ar: "يحدد ابن سينا طريقة إحمام الطفل: بماء معتدل صيفاً ومائل إلى الحرارة غير اللاذعة شتاء، بعد نومه الأطول، مرتين أو ثلاثاً في اليوم، بإمساك خاص وتنشيف رفيق ثم تقطير زيت عذب في أنفه {cite:canon-ibn-sina-print-v1 p.204}."
  en: "Ibn Sina sets out how to bathe an infant: in balanced water in summer and in water leaning to warm but not stinging in winter, after its longest sleep, two or three times a day, with a particular hold, gentle drying and then sweet oil dropped in the nose {cite:canon-ibn-sina-print-v1 p.204}."
