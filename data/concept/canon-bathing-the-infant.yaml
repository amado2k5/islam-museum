id: concept/canon-bathing-the-infant
class: concept
kind: scientific
label:
  ar: "إحمام المولود"
  en: "Bathing the infant"
  fr: "Bain du nourrisson"
  ur: "نومولود کو نہلانا"
  es: "Bañar al bebé"
  tr: "Yeni doğanın yıkanması"
  id: "Memandikan bayi baru lahir"
summary:
  ar: "يحدد ابن سينا طريقة إحمام الطفل: بماء معتدل صيفاً ومائل إلى الحرارة غير اللاذعة شتاء، بعد نومه الأطول، مرتين أو ثلاثاً في اليوم، بإمساك خاص وتنشيف رفيق ثم تقطير زيت عذب في أنفه {cite:canon-ibn-sina-print-v1 p.204}."
  en: "Ibn Sina sets out how to bathe an infant: in balanced water in summer and in water leaning to warm but not stinging in winter, after its longest sleep, two or three times a day, with a particular hold, gentle drying and then sweet oil dropped in the nose {cite:canon-ibn-sina-print-v1 p.204}."
  fr: "Ibn Sina décrit le bain du nourrisson : eau équilibrée en été, plutôt chaude sans sensation brûlante en hiver, après le plus long sommeil, deux ou trois fois par jour, avec maintien particulier, séchage doux puis huile douce instillée dans le nez {cite:canon-ibn-sina-print-v1 p.204}."
  es: "Ibn Sina describe cómo bañar a un bebé: en agua equilibrada en verano y en agua tibia pero no fría en invierno, después de su sueño más prolongado, dos o tres veces al día, con un agarre particular, secado suave y luego aceite dulce en la nariz {cite:canon-ibn-sina-print-v1 p.204}."
  ur: "ابن سینا نے بچے کو نہلانے کا طریقہ بتایا ہے: گرمیوں میں متوازن پانی میں اور سردیوں میں گرم ہونے کے لیے جھکنے والے پانی میں لیکن سردیوں میں نہ ڈنکنے والا، اس کی طویل ترین نیند کے بعد، دن میں دو یا تین بار، ایک خاص پکڑ کے ساتھ، ہلکے سے خشک کرنا اور پھر ناک میں میٹھا تیل گرانا۔"
  tr: "İbn Sina, çocuğun yıkanma yöntemini belirtir: yazın hafif su, kışın ılık ve keskin olmayan sıcaklık, daha uzun uykudan sonra günde iki ya da üç kez, özel kabızlık ve nazik kurutma ile, ardından taze yağın burnuna damlatılması {cite:canon-ibn-sina-print-v1 s.204}."
  id: "Ibn Sina menjelaskan metode memandikan anak: dengan air ringan di musim panas dan hangat dengan panas yang tidak menyengat di musim dingin, setelah tidur lebih lama, dua atau tiga kali sehari, dengan sembelit khusus dan pengeringan lembut, lalu meneteskan minyak segar ke hidung {cite:canon-ibn-sina-print-v1 hlm.204}."
