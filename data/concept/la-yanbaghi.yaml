id: concept/la-yanbaghi
class: concept
kind: term
label:
  ar: «لا ينبغي» في كلام الإمام أحمد
  en: "The phrase \"la yanbaghi\" in Imam Ahmad's words"
  es: "La frase \"la yanbaghi\" en palabras del Imam Ahmad"
  fr: "L'expression « la yanbaghi » dans les paroles de l'imam Ahmad"
  ur: "\"لا ینبغی\" امام احمد کے الفاظ میں"
  tr: "İmam Ahmad'ın sözleriyle, \"Bu uygun değildir\""
  id: "\"Itu tidak pantas\" menurut kata-kata Imam Ahmad"
issue:
  ar: هل يدل قول الإمام «لا ينبغي» على التحريم أم على الكراهة؟
  en: "Does the Imam's saying \"la yanbaghi\" (\"it is not proper\") indicate prohibition or dislike?"
summary:
  ar: 'عبارة «لا ينبغي» في كلام الإمام أحمد: هل تُحمل على التحريم أم على الكراهة؟ وقد اختلف الأصحاب في ذلك، وهو مثال على الخلاف في فهم ألفاظ المذهب.'
  en: "The expression \"la yanbaghi\" (\"it is not proper\") in Imam Ahmad's words: is it understood as prohibition or as dislike? His companions differed over it, an example of disagreement over the school's wording."
  es: "La expresión \"la yanbaghi\" (\"no es apropiado\") en palabras del Imam Ahmad: ¿se entiende como prohibición o como desagrado? Sus compañeros discreparon al respecto, lo que ejemplifica el desacuerdo sobre la terminología de la escuela."
  fr: "L'expression « la yanbaghi » (« cela n'est pas convenable »), attribuée à l'imam Ahmad, doit-elle être comprise comme une interdiction ou une aversion ? Ses compagnons étaient divisés à ce sujet, illustrant ainsi les divergences d'interprétation au sein de l'école."
  ur: "امام احمد کے الفاظ میں \"لا ینبغی\" ⁦(\"یہ مناسب نہیں\")⁩ کا لفظ ہے: کیا اسے ممانعت سمجھا جاتا ہے یا ناپسندیدہ؟ اس کے ساتھیوں کا اس پر اختلاف تھا، یہ اسکول کے الفاظ پر اختلاف کی ایک مثال ہے۔"
  tr: "İmam Ahmad'ın sözlerindeki \"Bu uygun değil\" ifadesi: Bu yasak mı yoksa hoşnutsuzluk mu anlamına gelir? Alimler bu konuda farklı görüşlere sahiptir ve bu, okulun ifadesini anlamadaki anlaşmazlığın bir örneğidir."
  id: "Ungkapan \"Tidak pantas\" dalam kata-kata Imam Ahmad: Apakah itu berarti larangan atau ketidaksukaan? Para ulama berbeda pendapat tentang hal ini, dan ini adalah contoh ketidaksepakatan dalam memahami kata-kata aljaran."
