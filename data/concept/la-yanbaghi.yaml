label:
  ar: «لا ينبغي» في كلام الإمام أحمد
  en: "The phrase \"la yanbaghi\" in Imam Ahmad's words"
issue:
  ar: هل يدل قول الإمام «لا ينبغي» على التحريم أم على الكراهة؟
  en: "Does the Imam's saying \"la yanbaghi\" (\"it is not proper\") indicate prohibition or dislike?"
summary:
  ar: 'عبارة «لا ينبغي» في كلام الإمام أحمد: هل تُحمل على التحريم أم على الكراهة؟ وقد اختلف الأصحاب في ذلك، وهو مثال على الخلاف في فهم ألفاظ المذهب.'
  en: "The expression \"la yanbaghi\" (\"it is not proper\") in Imam Ahmad's words: is it understood as prohibition or as dislike? His companions differed over it, an example of disagreement over the school's wording."
