summary:
  ar: "حجر العاجي يجفّف ويجلو ويحبس الدم، ويمنع نزف الجراحات والقروح."
  en: "The ivory-like stone dries, clears and stops bleeding. It stops the bleeding of wounds and ulcers."
  ur: "ہاتھی دانت جیسا یہ پتھر خشک کرتا، صاف کرتا اور خون روکتا ہے؛ یہ زخموں اور گھاؤ کا خون روکتا ہے۔"
  es: "La piedra, similar al marfil, seca, limpia y detiene el sangrado. Detiene el sangrado de heridas y úlceras."
  fr: "Cette pierre, semblable à de l'ivoire, assèche, purifie et arrête les saignements. Elle stoppe le saignement des plaies et des ulcères."
  tr: "Fildişi taşı kanı kurutur, durular ve hapseder, yaralardan ve ülserlerden kanamayı önler."
  id: "Batu gading mengering, membilas, dan menjebak darah, mencegah pendarahan dari luka dan luka."
