label:
  ar: العقل والعلم في الإسلام
  en: "Reason and knowledge in Islam"
summary:
  ar: "يعرض الإمام محمود شلتوت في أول بحوث الكتاب أن الإسلام دين العقل والعلم: القرآن يحث على النظر في ملكوت السموات والأرض، ويجعل أهل العلم في المرتبة الثالثة بعد الله والملائكة، ويذم التقليد الأعمى لما ورثه الناس عن آبائهم {cite:hatha-huwa-al-islam-azhar p. 11} {cite:hatha-huwa-al-islam-azhar p. 12} {cite:hatha-huwa-al-islam-azhar p. 13}. ويرى أن العلم في معناه القرآني ليس قاصرا على علم الشرائع، بل يشمل كل إدراك يعين الإنسان على عمارة الأرض، من الزراعة والصناعة والصحة والمال والدفاع عن الأوطان {cite:hatha-huwa-al-islam-azhar p. 20}. ويعرض أن أول ما نزل من الوحي أمر بالقراءة، وأن الإسلام حارب الجهل والأمية {cite:hatha-huwa-al-islam-azhar p. 18} {cite:hatha-huwa-al-islam-azhar p. 19}، وأن المسلمين الأوائل جعلوا تعليم القراءة سببا لإطلاق الأسير، وتعليم القرآن مهرا في الزواج، على ما يذكره المؤلف في وصف عصر الصحابة {cite:hatha-huwa-al-islam-azhar p. 21}."
  en: "Mahmud Shaltut, the opening essay of the book, argues that Islam is a religion of reason and knowledge: the Qur'an urges reflection on the heavens and the earth, places people of knowledge third after God and the angels, and condemns blind imitation of inherited belief (pp. 11-13). He reads knowledge in the Qur'anic sense as anything that helps humans build the earth (p. 20), and records the early Muslims' literacy effort (pp. 18-21)."
