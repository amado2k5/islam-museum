id: concept/reason-and-knowledge-in-islam
class: concept
kind: doctrine
label:
  ar: العقل والعلم في الإسلام
  en: "Reason and knowledge in Islam"
  es: "La razón y el conocimiento en el Islam"
  fr: "Raison et connaissance en islam"
  ur: "اسلام میں عقل اور علم"
  tr: "İslam'da Akıl ve Bilim"
  id: "Akal dan Ilmu dalam Islam"
summary:
  ar: "يعرض الإمام محمود شلتوت في أول بحوث الكتاب أن الإسلام دين العقل والعلم: القرآن يحث على النظر في ملكوت السموات والأرض، ويجعل أهل العلم في المرتبة الثالثة بعد الله والملائكة، ويذم التقليد الأعمى لما ورثه الناس عن آبائهم {cite:hatha-huwa-al-islam-azhar p. 11} {cite:hatha-huwa-al-islam-azhar p. 12} {cite:hatha-huwa-al-islam-azhar p. 13}. ويرى أن العلم في معناه القرآني ليس قاصرا على علم الشرائع، بل يشمل كل إدراك يعين الإنسان على عمارة الأرض، من الزراعة والصناعة والصحة والمال والدفاع عن الأوطان {cite:hatha-huwa-al-islam-azhar p. 20}. ويعرض أن أول ما نزل من الوحي أمر بالقراءة، وأن الإسلام حارب الجهل والأمية {cite:hatha-huwa-al-islam-azhar p. 18} {cite:hatha-huwa-al-islam-azhar p. 19}، وأن المسلمين الأوائل جعلوا تعليم القراءة سببا لإطلاق الأسير، وتعليم القرآن مهرا في الزواج، على ما يذكره المؤلف في وصف عصر الصحابة {cite:hatha-huwa-al-islam-azhar p. 21}."
  en: "Mahmud Shaltut, the opening essay of the book, argues that Islam is a religion of reason and knowledge: the Qur'an urges reflection on the heavens and the earth, places people of knowledge third after God and the angels, and condemns blind imitation of inherited belief (pp. 11-13). He reads knowledge in the Qur'anic sense as anything that helps humans build the earth (p. 20), and records the early Muslims' literacy effort (pp. 18-21)."
  es: "Mahmud Shaltut, en el ensayo que abre el libro, argumenta que el Islam es una religión de razón y conocimiento: el Corán insta a la reflexión sobre los cielos y la tierra, sitúa a las personas de conocimiento en tercer lugar después de Dios y los ángeles, y condena la imitación ciega de creencias heredadas (págs. 11-13). Interpreta el conocimiento en el sentido coránico como todo aquello que ayuda a los seres humanos a construir la tierra (pág. 20), y documenta el esfuerzo de los primeros musulmanes por alfabetizarse (págs. 18-21)."
  fr: "Dans son essai introductif, Mahmud Shaltut affirme que l'islam est une religion de raison et de connaissance: le Coran invite à la réflexion sur les cieux et la terre, place les savants au troisième rang après Dieu et les anges, et condamne l'imitation aveugle des croyances héritées (p. 11-13). Il conçoit la connaissance, au sens coranique, comme tout ce qui contribue à l'édification de la Terre par l'humanité (p. 20), et relate les efforts des premiers musulmans en matière d'alphabétisation (p. 18-21)."
  ur: "کتاب کا ابتدائی مضمون، محمود شلتوت دلیل دیتا ہے کہ اسلام عقل اور علم کا مذہب ہے: قرآن آسمانوں اور زمین پر غور و فکر کرنے کی تاکید کرتا ہے، اہل علم کو خدا اور فرشتوں کے بعد تیسرے نمبر پر رکھتا ہے، اور موروثی عقیدے کی اندھی تقلید کی مذمت کرتا ہے ⁦(صفحہ 11-13)⁩۔ وہ علم کو قرآنی معنوں میں کسی بھی چیز کے طور پر پڑھتا ہے جو انسانوں کو زمین کی تعمیر میں مدد کرتا ہے ⁦(صفحہ 20)⁩، اور ابتدائی مسلمانوں کی خواندگی کی کوششوں کو ریکارڈ کرتا ہے ⁦(صفحہ 18-21)⁩۔"
  tr: "İmam Mahmud Shaltu, kitabın ilk bölümünde İslam'ın akıl ve bilgi dini olduğunu belirtir: Kur'an, göklerin ve yerin krallığını tefekkür etmeyi teşvik eder, alimleri Allah ve meleklerden sonra üçüncü sıraya koyar ve insanların atalarından miras aldıkları şeylerin körü körüne taklit edilmesini kınar {cite:hatha-huwa-al-islam-azhar s. 11} {cite:hatha-huwa-al-islam-azhar s. 12} {cite:hatha-huwa-al-islam-azhar s. 13}. Bilginin Kur'an'daki anlamıyla sadece Şeriat bilimiyle sınırlı olmadığını, tarım, sanayi, sağlık, finans ve vatan savunması gibi insanları inşa etmelerine yardımcı olan tüm bilgileri kapsadığına inanır {cite:hatha-huwa-al-Islam-azhar s. 20}. İlk vahiyin okunmayı emrettiğini, İslam'ın cehalet ve okuryazarlıkla savaştığını {cite:hatha-huwa-al-islam-azhar s. 18} {cite:hatha-huwa-al-islam-azhar s. 19}} ve erken Müslümanların esirleri serbest bırakmak ve Kur'an'ı evlilikte çeyiz olarak öğretmek için bir sebep haline getirdiğini belirtir; yazar Sahabeler dönemini anlatırken belirttiği gibi {cite:hatha-huwa-al-Islam-azhar s. 21}."
  id: "Imam Mahmoud Shaltout menyajikan dalam bab pertama kitab bahwa Islam adalah agama akal dan ilmu: Al-Qur'an mendorong kontemplasi tentang kerajaan surga dan bumi, menempatkan ulama di peringkat ketiga setelah Tuhan dan malaikat, serta mengutuk peniruan buta atas apa yang diwariskan manusia dari leluhur mereka {cite:hatha-huwa-al-islam-azhar hlm. 11} {cite:hatha-huwa-al-islam-azhar hlm. 12} {cite:hatha-huwa-al-islam-azhar hlm. 13}. Ia percaya bahwa pengetahuan dalam makna Al-Qur'an tidak terbatas pada ilmu Syariah, tetapi mencakup semua pengetahuan yang membantu manusia membangun bumi, mulai dari pertanian, industri, kesehatan, keuangan, hingga pembelaan tanah air {cite:hatha-huwa-al-Islam-azhar hlm. 20}. Ia menyebutkan bahwa wahyu pertama memerintahkan membaca, dan bahwa Islam melawan kebodohan dan buta huruf {cite:hatha-huwa-al-islam-azhar hlm. 18} {cite:hatha-huwa-al-islam-azhar hlm. 19}, dan bahwa Muslim awal menjadikan pengajaran membaca sebagai alasan untuk membebaskan tawanan dan mengajarkan Al-Qur'an sebagai mas kawin dalam pernikahan, seperti yang disebutkan penulis dalam menggambarkan era Para Sahabat {cite:hatha-huwa-al-Islam-azhar hlm. 21}."
