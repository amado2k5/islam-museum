label:
  ar: "صعتر"
  en: "Sa'tar (the herb the book names sa'tar)"
  ur: "صعتر"
  es: "Sa'tar (la hierba que el libro llama sa'tar)"
summary:
  ar: "الصعتر في الكتاب نبات هو في قوة الحاشا وشرابه كشراب الحاشا أيضاً، أقواه البري، حار يابس في الثالثة، محلل مقشر ملطف، ينفع من أوجاع الوركين، ويمضغ فيسكن وجع السن ويشفي اللثة المترهلة لقوته المحرقة {cite:canon-ibn-sina-print-v1 p.591}، ودهنه ينفع الصدر والرئة والكبد والمعدة ويخرج الديدان {cite:canon-ibn-sina-print-v1 p.592}."
  en: "Sa'tar is in the book a plant of the same power as hasha, its drink like the drink of hasha, the wild the strongest, hot and dry in the third degree, dissolving, peeling and thinning; it helps pains of the hips, and chewed it calms toothache and heals the slack gums through its burning power {cite:canon-ibn-sina-print-v1 p.591}; its oil helps the chest, lung, liver and stomach, and it expels worms {cite:canon-ibn-sina-print-v1 p.592}."
  ur: "صعتر کتاب میں ایک پودا ہے جو قوت میں حاشا جیسا ہے اور اس کا شربت بھی حاشا کے شربت جیسا ہے، جنگلی سب سے قوی، تیسرے درجے میں گرم خشک، گھلانے والا، چھیلنے والا اور لطیف کرنے والا؛ کولہوں کے دردوں میں مفید ہے، اور چبایا جائے تو دانت کے درد کو تسکین دیتا اور ڈھیلے مسوڑھوں کو اپنی جلانے والی قوت سے شفا دیتا ہے {cite:canon-ibn-sina-print-v1 p.591}؛ اس کا تیل سینے، پھیپھڑے، جگر اور معدے کو فائدہ دیتا اور کیڑوں کو خارج کرتا ہے {cite:canon-ibn-sina-print-v1 p.592}۔"
  es: "Sa'tar es en el libro una planta del mismo poder que hasha, su bebida como la bebida de hasha, la silvestre la más fuerte, caliente y seca en tercer grado, disolviendo, pelando y adelgazando; ayuda con los dolores de cadera, y masticada calma el dolor de muelas y cura las encías flácidas por su poder ardiente {cite:canon-ibn-sina-print-v1 p.591}; su aceite ayuda al pecho, pulmón, hígado y estómago, y expulsa gusanos {cite:canon-ibn-sina-print-v1 p.592}."
