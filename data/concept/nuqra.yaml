label: { ar: "النُّقْرَة", en: "Nuqra (bullion)", ur: "نقرہ (سونے چاندی کی ڈلی)" }
summary:
  ar: "النقرة في اللغة القطعة المذابة من الذهب والفضة، وهي أعم من السبيكة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15973} وتجب فيها الزكاة إذا بلغت النصاب وتُكمل مع النقود من جنسها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15973} وبيعها بجنسها صحاحاً أو العكس تجري عليه أحكام الصرف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15973} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15974} وكسر الدراهم مكروه عند المالكية والحنابلة، والشركة برأس مال من النقار صحيحة عند الحنفية والمالكية والحنابلة في وجه إن راجت رواج النقود، ويمنعها الشافعية في القول المقابل للأظهر والحنابلة في المذهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15974}"
  en: "Nuqra, in the lexicon, is a piece of gold or silver melted down; before melting it is bullion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15973} Zakat is due on it once it reaches the threshold, and it is combined with coins of the same metal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15973} Selling it for coin of its kind, or coin for it, follows the rules of exchange. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15973} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15974} Cutting dirhams is disliked by the Malikis and Hanbalis; partnership with nuqra as capital is valid for the Hanafis, Malikis and a Hanbali view if it circulates like coin, and disallowed by the Shafi'i rival view and the Hanbali school. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15974}"
  ur: "نقرہ لغت میں پگھلی ہوئی سونے یا چاندی کی ڈلی کو کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15973} نصاب کو پہنچنے پر اس میں زکوٰۃ واجب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15973} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15974} اس کی بیع پر صرف کے احکام لاگو ہوتے ہیں، اور درہم کا توڑنا مالکیہ اور حنابلہ کے نزدیک مکروہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15974}"
