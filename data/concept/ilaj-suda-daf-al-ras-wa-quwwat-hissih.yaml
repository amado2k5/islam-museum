id: concept/ilaj-suda-daf-al-ras-wa-quwwat-hissih
class: concept
kind: scientific
label:
  ar: "علاج الصداع من ضعف الرأس ومن قوة حسه"
  en: "Treatment of headache from weakness of the head and from strength of its sense"
  ur: "سر کی کمزوری اور اس کے حس کی قوت سے ہونے والے صداع کا علاج"
  es: "Tratamiento del dolor de cabeza por debilidad de la cabeza y por fuerza de su sentido"
  fr: "Traitement des céphalées dues à la faiblesse de la tête et à la force de ses sens"
  tr: "Baş zayıflığından kaynaklanan baş ağrılarının tedavisi ve hissinin gücüyle ilgili"
  id: "Mengobati sakit kepala akibat kelemahan kepala dan kekuatan sensasinya"
summary:
  ar: "يذكر ابن سينا أن علاج صداع ضعف الرأس تبديل سوء المزاج وتقويته وتدبير الأخلاط في المعدة، وأن علاج صداع قوة الحس تبليد الحس يسيراً بتغليظ غذاء الدماغ {cite:canon-ibn-sina-print-v2 p.68}"
  en: "Ibn Sina says that the treatment of headache from weakness of the head is to change its ill-temperament, strengthen it and manage the humours in the stomach, and that of headache from strength of sense is to dull the sense a little by thickening the nourishment of the brain {cite:canon-ibn-sina-print-v2 p.68}"
  ur: "ابن سینا کہتا ہے کہ سر کی کمزوری سے ہونے والے صداع کا علاج اس کے سوءِ مزاج کو بدلنا، اسے قوت دینا اور معدے کے اخلاط کی تدبیر ہے، اور حس کی قوت سے ہونے والے کا علاج دماغ کی غذا کو گاڑھا کر کے حس کو ذرا کند کرنا {cite:canon-ibn-sina-print-v2 p.68}۔"
  es: "Ibn Sina afirma que el tratamiento del dolor de cabeza causado por debilidad de la cabeza consiste en cambiar su temperamento, fortalecerla y regular los humores del estómago, y el del dolor de cabeza causado por agudeza sensorial consiste en atenuar ligeramente la sensibilidad aumentando la nutrición del cerebro {cite:canon-ibn-sina-print-v2 p.68}."
  fr: "Ibn Sina affirme que le traitement des maux de tête dus à une faiblesse de la tête consiste à modifier son mauvais tempérament, à la fortifier et à réguler les humeurs de l'estomac, et que celui des maux de tête dus à une force des sens consiste à atténuer légèrement les sens en enrichissant la nourriture du cerveau {cite:canon-ibn-sina-print-v2 p.68}"
  tr: "İbn Sina, baş ağrısı zayıflığının tedavisinin duygu durum bozukluklarını değiştirmek ve güçlendirmek ile mide humorlarını yönetmeyi içerdiğini, duyusal baş ağrısının ise beyin besinlerini kalınlaştırarak duyusunu zayıflattığını belirtir {cite:canon-ibn-sina-print-v2 s.68}"
  id: "Ibn Sina menyebutkan bahwa mengobati kelemahan sakit kepala melibatkan perubahan dan penguatan gangguan suasana hati serta pengelolaan humor lambung, dan bahwa mengobati sakit kepala sensorik melemahkan sensasi dengan menebalkan nutrisi otak {cite:canon-ibn-sina-print-v2 hlm.68}"
