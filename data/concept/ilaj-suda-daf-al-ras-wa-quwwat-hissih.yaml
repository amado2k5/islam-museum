id: concept/ilaj-suda-daf-al-ras-wa-quwwat-hissih
class: concept
kind: scientific
label:
  ar: "علاج الصداع من ضعف الرأس ومن قوة حسه"
  en: "Treatment of headache from weakness of the head and from strength of its sense"
  ur: "سر کی کمزوری اور اس کے حس کی قوت سے ہونے والے صداع کا علاج"
summary:
  ar: "يذكر ابن سينا أن علاج صداع ضعف الرأس تبديل سوء المزاج وتقويته وتدبير الأخلاط في المعدة، وأن علاج صداع قوة الحس تبليد الحس يسيراً بتغليظ غذاء الدماغ {cite:canon-ibn-sina-print-v2 p.68}"
  en: "Ibn Sina says that the treatment of headache from weakness of the head is to change its ill-temperament, strengthen it and manage the humours in the stomach, and that of headache from strength of sense is to dull the sense a little by thickening the nourishment of the brain {cite:canon-ibn-sina-print-v2 p.68}"
  ur: "ابن سینا کہتا ہے کہ سر کی کمزوری سے ہونے والے صداع کا علاج اس کے سوءِ مزاج کو بدلنا، اسے قوت دینا اور معدے کے اخلاط کی تدبیر ہے، اور حس کی قوت سے ہونے والے کا علاج دماغ کی غذا کو گاڑھا کر کے حس کو ذرا کند کرنا {cite:canon-ibn-sina-print-v2 p.68}۔"
