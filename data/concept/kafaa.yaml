  en: "Equality in marriage (kafaa)"
  ur: "کفاءت (نکاح میں برابری)"
summary:
  ar: "الكفاءة في النكاح مساواة مخصوصة بين الزوجين تدفع العار، وتعتبر خصالها الدين والنسب والحرية والحرفة والمال والسلامة من العيوب، واختلف الفقهاء في اعتبار كل منها. وهي حق للمرأة وللأولياء، وتعتبر عند العقد، واعتبارها للزوم النكاح عند أكثر الفقهاء لا لصحته، ويرى الحنفية والحنابلة وجوبها في جانب الرجال، ويرى الكرخي وغيره عدم اشتراطها، وتسقط برضا المرأة والأولياء، ويترتب على تخلفها الفسخ أو البطلان بحسب المذهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13283} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13284} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13285} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13286} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13287} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13288} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13289} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13290} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13291} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13292} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13293} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13294} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13295} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13296} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13297} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13298} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13299} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13300} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13301} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13302} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13303} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13304}"
  en: "Kafaa in marriage is a particular equality between the spouses that averts shame. The qualities counted are religion, lineage, freedom, craft, means and freedom from defects, and the jurists differ on each. It is a right of the woman and of her guardians; it is judged at the time of the contract; most jurists require it for the marriage to continue rather than for it to be valid. The Hanafis and Hanbalis require it on the man's side only; Abu Yusuf and Muhammad and others add the woman's side. Her consent and the guardians' waive it; a defect in it gives the right to annul, and the schools differ on whether the marriage is void or annullable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13283} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13284} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13285} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13286} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13287} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13288} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13289} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13290} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13291} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13292} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13293} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13294} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13295} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13296} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13297} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13298} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13299} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13300} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13301} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13302} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13303} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13304}"
  ur: "نکاح میں کفاءت وہ مخصوص برابری ہے جو عار کو دور کرتی ہے۔ اس کی خصلتیں دین، نسب، آزادی، پیشہ، مال اور عیوب سے سلامتی ہیں، اور فقہاء ہر ایک میں مختلف ہیں۔ یہ عورت اور اس کے اولیاء کا حق ہے؛ اس کا اعتبار عقد کے وقت ہوتا ہے، اور اکثر فقہاء کے نزدیک یہ نکاح کے لازم رہنے کے لیے ہے، صحت کے لیے نہیں۔ حنفیہ اور حنابلہ اسے مرد کی طرف سے واجب کہتے ہیں، جبکہ ابو یوسف اور محمد عورت کی طرف سے بھی معتبر کہتے ہیں۔ عورت اور اولیاء کی رضا سے یہ ساقط ہو جاتی ہے، اور اس کی کمی پر فسخ کا حق ہے، جس میں مذاہب کا اختلاف ہے کہ نکاح باطل ہے یا قابلِ فسخ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13283} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13284} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13285} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13286} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13287} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13288} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13289} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13290} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13291} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13292} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13293} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13294} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13295} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13296} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13297} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13298} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13299} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13300} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13301} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13302} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13303} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13304}"
