summary:
  ar: "المنعور مدخل إحالة في الكتاب: زعم ديسقوريدوس أنه الخشخاش المصري، ويحيل المؤلف إلى فصل الخاء، وبه يختم حرف الميم وجملته أربعة وخمسون دواء {cite:canon-ibn-sina-print-v1 p.574}."
  en: "Manur is a cross-reference entry in the book: Dioscorides claimed it is the Egyptian poppy, and the author refers the reader to the letter kha; it closes the letter mim, which the book counts as fifty-four drugs {cite:canon-ibn-sina-print-v1 p.574}."
  ur: "منعور کتاب میں حوالہ جاتی اندراج ہے: دیسقوریدوس کا دعویٰ تھا کہ یہ مصری خشخاش ہے، اور مصنف قاری کو حرف خا کے باب کی طرف بھیجتا ہے؛ اس پر حرف میم ختم ہوتا ہے جس کی کل تعداد کتاب چوّن دوائیں بتاتی ہے {cite:canon-ibn-sina-print-v1 p.574}۔"
  es: "Manur es una entrada de referencia cruzada en el libro: Dioscórides afirmó que es la amapola egipcia, y el autor remite al lector a la letra kha; cierra la letra mim, que el libro cuenta como cincuenta y cuatro drogas {cite:canon-ibn-sina-print-v1 p.574}."
