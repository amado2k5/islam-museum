label:
  ar: "التزكية"
  en: "Tazkiya (attestation of witnesses' uprightness)"
  ur: "تزکیہ (گواہوں کی عدالت کی تصدیق)"
summary:
  ar: "التزكية في باب القضاء تعديل الشهود، وتكون سرا وعلانية. ويختلف الفقهاء في وجوبها: فالحنفية يقضون بظاهر العدالة إلا إذا طعن الخصم، ويستثنون الحدود والقصاص، وغيرهم يوجبونها في كل الأمور مع اختلاف في العدد والشروط. وللجرح والتعديل تفصيل في التعارض وبيان السبب. وشهادة الراوي بالحديث تشترط فيها العدالة والضبط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5009} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5010} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5011} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5019} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5021}"
  en: "Tazkiya in judging is attesting that witnesses are just. It is done secretly and openly. The schools differ on whether it is required: the Hanafis judge by apparent uprightness unless the opponent impugns it, and exempt the fixed penalties and retaliation; others require it in every matter, with disputes over the number and the qualities of the attestors. Impugning and attesting, their conflict and the statement of cause, and the uprightness of a narrator of hadith are treated under this entry. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5009} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5010} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5011} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5019} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5021}"
