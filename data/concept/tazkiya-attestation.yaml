id: concept/tazkiya-attestation
class: concept
kind: legal
label:
  ar: "التزكية"
  en: "Tazkiya (attestation of witnesses' uprightness)"
  ur: "تزکیہ ⁦(گواہوں کی عدالت کی تصدیق)⁩"
  es: "Tazkiya (testimonio de la rectitud de los testigos)"
  fr: "Tazkiya (attestation de la droiture des témoins)"
summary:
  ar: "التزكية في باب القضاء تعديل الشهود، وتكون سرا وعلانية. ويختلف الفقهاء في وجوبها: فالحنفية يقضون بظاهر العدالة إلا إذا طعن الخصم، ويستثنون الحدود والقصاص، وغيرهم يوجبونها في كل الأمور مع اختلاف في العدد والشروط. وللجرح والتعديل تفصيل في التعارض وبيان السبب. وشهادة الراوي بالحديث تشترط فيها العدالة والضبط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5009} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5010} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5011} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5019} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5021}"
  en: "Tazkiya in judging is attesting that witnesses are just. It is done secretly and openly. The schools differ on whether it is required: the Hanafis judge by apparent uprightness unless the opponent impugns it, and exempt the fixed penalties and retaliation; others require it in every matter, with disputes over the number and the qualities of the attestors. Impugning and attesting, their conflict and the statement of cause, and the uprightness of a narrator of hadith are treated under this entry. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5009} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5010} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5011} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5019} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5021}"
  es: "La tazkiya en el juicio consiste en dar fe de la imparcialidad de los testigos. Se realiza tanto en secreto como en público. Las escuelas difieren en cuanto a su obligatoriedad: los hanafíes juzgan por la aparente rectitud, salvo que el oponente la impugne, y eximen de las penas fijas y las represalias; otros la exigen en todos los casos, con discrepancias sobre el número y la calidad de los testigos. La impugnación y la certificación, su conflicto, la exposición de la causa y la rectitud del narrador de hadices se tratan en esta entrada. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5009} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5010} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5011} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5013} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5019} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5021}"
  fr: "La tazkiya, en matière de jugement, consiste à attester de la droiture des témoins. Elle peut être effectuée secrètement ou publiquement. Les écoles de pensée divergent quant à son obligation: les hanafites jugent selon l’apparente droiture, sauf contestation de la partie adverse, et exemptent les peines fixes et les représailles; d’autres écoles l’exigent systématiquement, avec des débats sur le nombre et les qualités des témoins. La contestation et l’attestation, leur conflit, l’exposé des faits et la droiture du narrateur de hadith sont traités dans cette section. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5009} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5010} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5011} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5019} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5021}"
