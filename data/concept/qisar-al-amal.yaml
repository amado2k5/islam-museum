id: concept/qisar-al-amal
class: concept
kind: ethical
label:
  ar: قصر الأمل
  en: Curtailing hope in the world (qisar al-amal)
  es: "Restringir la esperanza en el mundo (qisar al-amal)"
  fr: "Réduire l'espoir dans le monde (qisar al-amal)"
  ur: "دنیا میں امید کو کم کرنا ⁦(قصر العمل)⁩"
summary:
  ar: "قصر الأمل في الحديث الأربعين من الأربعين أصل في الزهد: «كن في الدنيا كأنك غريب أو عابر سبيل» — فالغريب لا يطمئن إلى دار الغربة والعابر أقل تعلقاً منه، وبنت عليه أمثال ابن عمر قوله: «إذا أمسيت فلا تنتظر الصباح وإذا أصبحت فلا تنتظر المساء وخذ من صحتك لمرضك ومن حياتك لموتك»؛ قال ابن رجب هذا الحديث أصل في قصر الأمل في الدنيا وأن المؤمن لا ينبغي له أن يتخذ الدنيا داراً ووطناً فيطمئن إليها ⁦(جامع العلوم والحكم ص 810–811)⁩."
  en: "Curtailing hopes in the world, founded on the fortieth hadith of the Forty: 'be in this world as though a stranger or a wayfarer' — for a stranger does not settle into a foreign abode, and a passer-by clings to it even less; upon it Ibn Umar built his saying 'when you reach evening do not await the morning, and when you reach morning do not await the evening, and take from your health for your sickness and from your life for your death'; Ibn Rajab calls this hadith a foundation of curtailing hope in this world, such that the believer should not take it as his lasting home and set his heart at rest in it (Jami' al-Ulum wal-Hikam pp. 810–811)."
  es: "La limitación de las esperanzas en el mundo, basada en el cuadragésimo hadiz de los Cuarenta: «sé en este mundo como un extraño o un viajero», pues un extraño no se instala en una morada ajena, y un transeúnte se aferra a ella aún menos; sobre él Ibn Umar construyó su dicho «cuando llegue la tarde, no esperes la mañana, y cuando llegue la mañana, no esperes la tarde, y toma de tu salud para tu enfermedad y de tu vida para tu muerte»; Ibn Rajab llama a este hadiz un fundamento para limitar la esperanza en este mundo, de tal manera que el creyente no debería tomarlo como su hogar permanente y poner su corazón en él (Jami' al-Ulum wal-Hikam, págs. 810-811)."
  fr: "La restriction des espoirs en ce monde, fondée sur le quarantième hadith des Quarante: « Sois en ce monde comme un étranger ou un voyageur » — car un étranger ne s'installe pas dans une demeure étrangère, et un passant s'y attache encore moins; c'est sur ce hadith qu'Ibn Umar a fondé son adage: « Quand arrive le soir, n'attends pas le matin, et quand arrive le matin, n'attends pas le soir, et prends de ta santé pour ta maladie et de ta vie pour ta mort »; Ibn Rajab considère ce hadith comme un fondement de la restriction des espoirs en ce monde, de sorte que le croyant ne doit pas le considérer comme sa demeure permanente et y installer son cœur (Jami' al-Ulum wal-Hikam pp. 810–811)."
  ur: "دنیا میں امیدوں کو کم کرنا، جس کی بنیاد چالیسویں حدیث پر رکھی گئی ہے: 'اس دنیا میں ایسے رہو جیسے اجنبی یا مسافر' - کیونکہ اجنبی کسی پردیسی میں نہیں بستا، اور راہگیر اس سے بھی کم چمٹ جاتا ہے۔ اس پر ابن عمر نے اپنا یہ قول قائم کیا کہ جب تم شام کو پہنچو تو صبح کا انتظار نہ کرو اور جب صبح ہو جاؤ تو شام کا انتظار نہ کرو اور اپنی صحت سے اپنی بیماری کے بدلے اور اپنی زندگی سے موت کے بدلے میں لو۔ ابن رجب نے اس حدیث کو اس دنیا میں امید کو کم کرنے کی بنیاد قرار دیا ہے کہ مومن اسے اپنا آخری ٹھکانہ نہ سمجھے اور اپنے دل کو اسی میں سکون سے رکھے ⁦(جامع العلوم والحکم صفحہ 810-811)⁩۔"
