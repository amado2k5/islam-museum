label:
  ar: قصر الأمل
  en: Curtailing hope in the world (qisar al-amal)
summary:
  ar: "قصر الأمل في الحديث الأربعين من الأربعين أصل في الزهد: «كن في الدنيا كأنك غريب أو عابر سبيل» — فالغريب لا يطمئن إلى دار الغربة والعابر أقل تعلقاً منه، وبنت عليه أمثال ابن عمر قوله: «إذا أمسيت فلا تنتظر الصباح وإذا أصبحت فلا تنتظر المساء وخذ من صحتك لمرضك ومن حياتك لموتك»؛ قال ابن رجب هذا الحديث أصل في قصر الأمل في الدنيا وأن المؤمن لا ينبغي له أن يتخذ الدنيا داراً ووطناً فيطمئن إليها (جامع العلوم والحكم ص 810–811)."
  en: "Curtailing hopes in the world, founded on the fortieth hadith of the Forty: 'be in this world as though a stranger or a wayfarer' — for a stranger does not settle into a foreign abode, and a passer-by clings to it even less; upon it Ibn Umar built his saying 'when you reach evening do not await the morning, and when you reach morning do not await the evening, and take from your health for your sickness and from your life for your death'; Ibn Rajab calls this hadith a foundation of curtailing hope in this world, such that the believer should not take it as his lasting home and set his heart at rest in it (Jami' al-Ulum wal-Hikam pp. 810–811)."
