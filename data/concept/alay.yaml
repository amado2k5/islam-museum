label:
  ar: "علاي (العلاي)"
  en: "Alay (Ottoman ceremonial parade and the military term)"
summary:
  ar: "علاي، لفظ تركي يُرجَّح أنه من اليونانية (allagion)، وهي تقسيمات في الجيش البيزنطي، وفي الاستعمال العثماني يعني «فرقة» و«استعراضًا»، ثم «جمعًا كبيرًا»، واستُعمل منذ إصلاحات القرن التاسع عشر العسكرية بمعنى «الفوج»، وأشهر استعراضاته الاستعراضات السلطانية {cite:encyclopaedia-of-islam-2 vol. 1 p. 380}."
  en: "Alay, a Turkish word probably derived from the Greek allagion, a division of the Byzantine army. In Ottoman usage it meant a troop or a parade, then a crowd, and from the 19th-century military reforms a regiment. The Ottoman sultans' ceremonial parades bore the name {cite:encyclopaedia-of-islam-2 vol. 1 p. 380}."
