id: concept/alay
class: concept
kind: term
label:
  ar: "علاي ⁦(العلاي)⁩"
  en: "Alay (Ottoman ceremonial parade and the military term)"
  fr: "Alay (défilé cérémoniel ottoman et terme militaire)"
  es: "Alay (desfile ceremonial otomano y término militar)"
  ur: "آلے ⁦(عثمانی رسمی پریڈ اور فوجی اصطلاح)⁩"
summary:
  ar: "علاي، لفظ تركي يُرجَّح أنه من اليونانية (allagion)، وهي تقسيمات في الجيش البيزنطي، وفي الاستعمال العثماني يعني «فرقة» و«استعراضًا»، ثم «جمعًا كبيرًا»، واستُعمل منذ إصلاحات القرن التاسع عشر العسكرية بمعنى «الفوج»، وأشهر استعراضاته الاستعراضات السلطانية {cite:encyclopaedia-of-islam-2 vol. 1 p. 380}."
  en: "Alay, a Turkish word probably derived from the Greek allagion, a division of the Byzantine army. In Ottoman usage it meant a troop or a parade, then a crowd, and from the 19th-century military reforms a regiment. The Ottoman sultans' ceremonial parades bore the name {cite:encyclopaedia-of-islam-2 vol. 1 p. 380}."
  fr: "Alay est un mot turc probablement dérivé du grec allagion, qui désignait une division de l’armée byzantine. Dans l’usage ottoman, il désignait une troupe ou un défilé, puis une foule et, à partir des réformes militaires du XIXe siècle, un régiment. Les défilés cérémoniels des sultans ottomans portaient ce nom {cite:encyclopaedia-of-islam-2 vol. 1 p. 380}."
  es: "Alay, palabra turca probablemente derivada del griego allagion, una división del ejército bizantino. En el uso otomano significaba tropa o desfile, luego multitud, y a partir de las reformas militares del siglo XIX, regimiento. Los desfiles ceremoniales de los sultanes otomanos llevaban este nombre {cite:encyclopaedia-of-islam-2 vol. 1 p. 380}."
  ur: "Alay، ایک ترک لفظ شاید یونانی allagion سے ماخوذ ہے، بازنطینی فوج کی ایک تقسیم۔ عثمانی استعمال میں اس کا مطلب ایک دستہ یا پریڈ، پھر ایک ہجوم، اور 19ویں صدی کی فوجی اصلاحات سے ایک رجمنٹ۔ عثمانی سلطانوں کی رسمی پریڈ کا نام تھا {حوالہ: انسائیکلوپیڈیا-آف-اسلام-2 جلد۔ 1 ص۔ 380}۔"
