id: concept/zij-sabi-parallax-matters-for-solar-eclipses
class: concept
kind: scientific
label: { ar: "اختلاف المنظر وعلة الكسوفات الشمسية", en: "Parallax and the cause of solar eclipses", ur: "اختلافِ منظر اور شمسی کسوفات کی علت", es: "La paralaje y la causa de los eclipses solares", fr: "La parallaxe et la cause des éclipses solaires", tr: "Güneş tutulmalarının görünümündeki farklılık ve nedeni", id: "Perbedaan penampakan dan penyebab gerhana matahari" }
summary:
  ar: "يقرر البتاني أن معرفة هذا الاختلاف في أكثر الأمر هي علة الكسوفات الشمسية، فلا يمكن الإحاطة بها دون معرفة مقدار الاختلاف في كل مواضع الأفق؛ أما الكسوفات القمرية فلا حاجة فيها إلى هذا، لأن الأرض تحجب الشمس عن القمر وهي في موضع واحد. {cite:zij-sabi-nallino-byblion p.115}."
  en: "Al-Battani holds that knowing this parallax matters chiefly for solar eclipses, and that they cannot be fully grasped without knowing its amount at every point of the horizon. Lunar eclipses need no such correction, since the Earth's shadow is the same for every observer. {cite:zij-sabi-nallino-byblion p.115}."
  ur: "البتانی کے نزدیک یہ اختلاف زیادہ تر شمسی کسوفات کی علت سے متعلق ہے، اور اسے افق کے ہر مقام پر اس کی مقدار جانے بغیر پوری طرح سمجھا نہیں جا سکتا؛ قمری کسوفات میں اس کی ضرورت نہیں، کیونکہ زمین کا سایہ ہر ناظر کے لیے ایک ہی ہے۔ {cite:zij-sabi-nallino-byblion p.115}۔"
  es: "Al-Battani sostiene que conocer esta paralaje es fundamental para los eclipses solares, y que estos no pueden comprenderse plenamente sin conocer su magnitud en cada punto del horizonte. Los eclipses lunares no requieren tal corrección, ya que la sombra de la Tierra es la misma para todos los observadores. {cite:zij-sabi-nallino-byblion p.115}."
  fr: "Al-Battani soutient que la connaissance de cette parallaxe est surtout importante pour les éclipses solaires, et qu'on ne peut les comprendre pleinement sans connaître sa valeur en chaque point de l'horizon. Les éclipses lunaires ne nécessitent pas une telle correction, puisque l'ombre de la Terre est la même pour tous les observateurs. {cite:zij-sabi-nallino-byblion p.115}."
  tr: "Al-Battani, bu farkın anlaşılmasının güneş tutulmalarının temel nedeni olduğunu, çünkü ufuktaki tüm noktalardaki değişim derecesi bilinmeden tutulmaların tam olarak kavranamayacağını belirtir. Ancak ay tutulmaları bu bilgiyi gerektirmez, çünkü Dünya aynı konumda kalırken güneşin aya ulaşmasını engeller. {cite:zij-sabi-nallino-byblion s.115}."
  id: "Al-Battani menyatakan bahwa pemahaman tentang perbedaan ini adalah alasan utama terjadinya gerhana matahari, karena gerhana matahari tidak dapat dipahami sepenuhnya tanpa mengetahui tingkat variasi di semua titik cakrawala. Namun, gerhana bulan tidak memerlukan pengetahuan ini, karena Bumi menghalangi sinar matahari mencapai bulan sambil tetap berada di posisi yang sama. {cite:zij-sabi-nallino-byblion p.115}."
