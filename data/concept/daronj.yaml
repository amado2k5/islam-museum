summary:
  ar: "قطع خشبية أصولية بمقدار العقدة أو أصغر، أبيض الباطن أغبر الخارج. حار يابس في الثالثة، مفشّش للرياح، ينفع القلب والخفقان، ويفشّش رياح الرحم، وينفع من السموم ولسع العقرب والرتيلاء، وبدله الزرنباد {cite:canon-ibn-sina-print-v1 p.433}."
  en: "Woody root pieces about the size of a knot or smaller, white inside and grey outside. Hot and dry in the third degree; disperses winds and strengthens the heart against palpitation. Disperses womb winds (a labelled book listing). Helps poisons and the bites of scorpions and tarantulas. Zarnabad is given as a substitute {cite:canon-ibn-sina-print-v1 p.433}."
  ur: "جڑ کی لکڑی کے ٹکڑے جو گرہ کے برابر یا اس سے چھوٹے ہیں، اندر سے سفید اور باہر سے خاکی۔ تیسرے درجے میں گرم اور خشک؛ ہواؤں کو منتشر کرتا ہے، دل کو قوت دیتا ہے اور دھڑکن میں مفید ہے۔ رحم کی ہواؤں کو منتشر کرتا ہے ⁦(کتاب کی فہرست)⁩۔ زہروں اور بچھو و رتیلا کے کاٹے میں مفید؛ اس کا بدل زرنباد ہے {cite:canon-ibn-sina-print-v1 p.433}۔"
  es: "Fragmentos leñosos de raíz del tamaño de un nudo o más pequeños, blancos por dentro y grises por fuera. Cálido y seco en tercer grado; dispersa los vientos y fortalece el corazón contra las palpitaciones. Dispersa los vientos uterinos (según una lista de libros). Ayuda contra los venenos y las picaduras de escorpiones y tarántulas. Se ofrece Zarnabad como sustituto {cite:canon-ibn-sina-print-v1 p.433}."
  fr: "Morceaux de racines ligneuses de la taille d'un nœud ou plus petits, blancs à l'intérieur et gris à l'extérieur. Chaud et sec au troisième degré; disperse les vents et fortifie le cœur contre les palpitations. Disperse les vents utérins (voir la liste dans un ouvrage de référence). Soulage les poisons et les morsures de scorpions et de tarentules. Zarnabad est proposé comme substitut {cite:canon-ibn-sina-print-v1 p.433}."
