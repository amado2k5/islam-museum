  en: "Jubn (cheese)"
  ur: "جبن"
  es: "Jubn (queso)"
summary:
  ar: "الجبن يُتخذ من الحليب أو من الرائب، وهو المسمّى الأقط. الطريّ بارد رطب، والمملّح العتيق حار يابس. ينفع الكلف والقروح والجراحات وتشنج الوجه، ويكثر اللبن إذا طُبخ وسُقيت منه المرضعة، ويُذكر أن الإكثار منه يولّد الحصى في الكلية والمثانة {cite:canon-ibn-sina-print-v1 p.428} {cite:canon-ibn-sina-print-v1 p.429}."
  en: "Cheese is made from milk or from buttermilk, and is called aqit. Fresh cheese is cold and moist; aged salted cheese is hot and dry. The book lists it for freckles, ulcers, wounds, facial spasm and, boiled, for nursing mothers' milk. It also says that much of it breeds stones in the kidney and bladder {cite:canon-ibn-sina-print-v1 p.428} {cite:canon-ibn-sina-print-v1 p.429}."
  ur: "پنیر دودھ یا رائب سے بنتا ہے، اور اسے اقط کہا جاتا ہے۔ تازہ پنیر ٹھنڈا اور تر ہے، اور نمک لگا پرانا پنیر گرم اور خشک ہے۔ کتاب اسے کلف، زخموں، چہرے کی اینٹھن اور ابال کر دودھ پلانے والی ماں کے دودھ کے لیے بیان کرتی ہے، اور یہ بھی کہتی ہے کہ زیادہ کھانے سے گردے اور مثانے میں پتھری بنتی ہے {cite:canon-ibn-sina-print-v1 p.428} {cite:canon-ibn-sina-print-v1 p.429}۔"
  es: "El queso se elabora con leche o suero de mantequilla y se denomina aqit. El queso fresco es frío y húmedo; el queso curado y salado es caliente y seco. El libro lo menciona para tratar pecas, úlceras, heridas, espasmos faciales y, hervido, para la leche materna. También afirma que gran parte de él favorece la formación de cálculos renales y vesicales {cite:canon-ibn-sina-print-v1 p.428} {cite:canon-ibn-sina-print-v1 p.429}."
