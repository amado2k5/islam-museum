label: { ar: "الأخلاط", en: "Humours (al-akhlat)", es: "Humores (al-akhlat)", fr: "Humeurs (al-akhlat)", ur: "مزاحیہ ⁦(الاخلات)⁩" }
summary:
  ar: "تُعرض الأخلاط في التعليم الرابع من الفن الأول، في فصلين، أولهما في ماهية الخلط وأقسامه {cite:canon-ibn-sina-print-v1 p.28}. والرطوبات الخلطية المحمودة تنحصر عنده في أربعة أجناس: الدم وهو أفضلها، والبلغم، والصفراء، والسوداء {cite:canon-ibn-sina-print-v1 p.28}. ومن أقسام البلغم الفاسد من جهة طعمه: المالح والحامض والعفص والمسيخ {cite:canon-ibn-sina-print-v1 p.30}. ويُبيّن الفصل الثاني كيفية تولّد الأخلاط، وأن الحرارة المعتدلة تولّد الدم، والمفرطة تولّد الصفراء، والبرودة تولّد البلغم {cite:canon-ibn-sina-print-v1 p.33} {cite:canon-ibn-sina-print-v1 p.35}."
  en: "Ibn Sina treats humours in the fourth section of Book I, Fann 1, in two chapters; the first is on the nature of a humour and its kinds {cite:canon-ibn-sina-print-v1 p.28}. The commendable humours are, he says, four: blood, which is the best, phlegm, yellow bile and black bile {cite:canon-ibn-sina-print-v1 p.28}. Among the kinds of corrupt phlegm, by taste, he lists four: salty, sour, astringent and insipid {cite:canon-ibn-sina-print-v1 p.30}. The second chapter explains how humours are formed: moderate heat makes blood, excess heat makes yellow bile, and cold makes phlegm {cite:canon-ibn-sina-print-v1 p.33} {cite:canon-ibn-sina-print-v1 p.35}."
  es: "Ibn Sina trata los humores en la cuarta sección del Libro I, Fann 1, en dos capítulos; el primero trata sobre la naturaleza de un humor y sus clases {cite:canon-ibn-sina-print-v1 p.28}. Los humores recomendables son, dice, cuatro: sangre, que es la mejor, flema, bilis amarilla y bilis negra {cite:canon-ibn-sina-print-v1 p.28}. Entre las clases de flema corrupta, por gusto, enumera cuatro: salada, ácida, astringente e insípida {cite:canon-ibn-sina-print-v1 p.30}. El segundo capítulo explica cómo se forman los humores: el calor moderado produce sangre, el calor excesivo produce bilis amarilla y el frío produce flema {cite:canon-ibn-sina-print-v1 p.33} {cite:canon-ibn-sina-print-v1 p.35}."
  fr: "Ibn Sina traite des humeurs dans la quatrième section du Livre I, Fann 1, en deux chapitres. Le premier porte sur la nature des humeurs et leurs différentes sortes (voir canon ibn Sina, vol. 1, p. 28). Il distingue quatre humeurs louables: le sang, considéré comme la meilleure, le flegme, la bile jaune et la bile noire (voir canon ibn Sina, vol. 1, p. 28). Parmi les sortes de flegme corrompu, il en énumère quatre selon leur goût: salé, acide, astringent et insipide (voir canon ibn Sina, vol. 1, p. 30). Le second chapitre explique la formation des humeurs: une chaleur modérée produit le sang, une chaleur excessive produit la bile jaune et le froid produit le flegme (voir canon ibn Sina, vol. 1, p. 33 ou 35)."
  ur: "ابن سینا نے کتاب اول کے چوتھے حصے میں مزاح کو دو ابواب میں بیان کیا ہے۔ پہلا مزاح کی نوعیت اور اس کی اقسام پر ہے {حوالہ: کینن ابن سینا پرنٹ-v1 صفحہ 28}۔ وہ کہتے ہیں کہ قابل تعریف مزاحیہ ہیں، چار: خون جو سب سے بہتر ہے، بلغم، زرد پت اور سیاہ پت بدعنوان بلغم کی اقسام میں سے، ذائقہ کے لحاظ سے، وہ چار کی فہرست دیتا ہے: نمکین، کھٹا، کسیلی اور ناقص۔ دوسرا باب بتاتا ہے کہ مزاح کیسے بنتا ہے: اعتدال پسند گرمی خون بناتی ہے، زیادہ گرمی زرد پت کو بناتی ہے، اور سردی بلغم کو بناتی ہے۔"
