id: concept/humours
class: concept
kind: scientific
label: { ar: "الأخلاط", en: "Humours (al-akhlat)" }
summary:
  ar: "تُعرض الأخلاط في التعليم الرابع من الفن الأول، في فصلين، أولهما في ماهية الخلط وأقسامه {cite:canon-ibn-sina-print-v1 p.28}. والرطوبات الخلطية المحمودة تنحصر عنده في أربعة أجناس: الدم وهو أفضلها، والبلغم، والصفراء، والسوداء {cite:canon-ibn-sina-print-v1 p.28}. ومن أقسام البلغم الفاسد من جهة طعمه: المالح والحامض والعفص والمسيخ {cite:canon-ibn-sina-print-v1 p.30}. ويُبيّن الفصل الثاني كيفية تولّد الأخلاط، وأن الحرارة المعتدلة تولّد الدم، والمفرطة تولّد الصفراء، والبرودة تولّد البلغم {cite:canon-ibn-sina-print-v1 p.33} {cite:canon-ibn-sina-print-v1 p.35}."
  en: "Ibn Sina treats humours in the fourth section of Book I, Fann 1, in two chapters; the first is on the nature of a humour and its kinds {cite:canon-ibn-sina-print-v1 p.28}. The commendable humours are, he says, four: blood, which is the best, phlegm, yellow bile and black bile {cite:canon-ibn-sina-print-v1 p.28}. Among the kinds of corrupt phlegm, by taste, he lists four: salty, sour, astringent and insipid {cite:canon-ibn-sina-print-v1 p.30}. The second chapter explains how humours are formed: moderate heat makes blood, excess heat makes yellow bile, and cold makes phlegm {cite:canon-ibn-sina-print-v1 p.33} {cite:canon-ibn-sina-print-v1 p.35}."
