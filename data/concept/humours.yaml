  en: "Ibn Sina treats humours in the fourth section of Book I, Fann 1, in two chapters; the first is on the nature of a humour and its kinds {cite:canon-ibn-sina-print p.12}. Among the kinds of corrupt phlegm he lists, by taste, four: salty, sour, astringent and insipid {cite:canon-ibn-sina-print p.13}."
