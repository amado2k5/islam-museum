label: { ar: "اختلاف المنظر في القمر وسبب عظمه فيه", en: "The parallax of the Moon and why it is greatest in the Moon", ur: "چاند میں اختلافِ منظر اور اس کی وجہ", es: "La paralaje de la Luna y por qué es mayor en la Luna.", fr: "La parallaxe de la Lune et pourquoi elle est maximale en Lune", tr: "Ayın görünümündeki farklılık ve büyüklüğünün sebebi", id: "Perbedaan penampakan bulan dan alasan kebesarannya" }
summary:
  ar: "اختلاف المنظر هو مقدار ما يخالف فيه الموضع المرئي للكوكب موضعه الحقيقي المحسوب؛ وهو أكبر في القمر منه في غيره لأن قدر الأرض عند فلك القمر أعظم منه عند أفلاك سائر الكواكب، فيكون نصف قطر الأرض ظاهراً فيه. {cite:zij-sabi-nallino-byblion p.114}."
  en: "The parallax is the amount by which the visible place of a body differs from its calculated true place. It is greatest in the Moon because the Earth's size, as seen from the Moon's sphere, is far larger than from the spheres of the other bodies, so the half-radius of the Earth shows clearly. {cite:zij-sabi-nallino-byblion p.114}."
  ur: "اختلافِ منظر وہ مقدار ہے جس سے کسی جرم کا نظر آنے والا مقام اس کے حسابی حقیقی مقام سے مختلف ہو جاتا ہے۔ یہ چاند میں سب سے بڑا ہے کیونکہ چاند کے فلک سے زمین کا حجم دوسرے سیاروں کے افلاک کی نسبت بہت بڑا دکھائی دیتا ہے، تو زمین کا نصف قطر وہاں نمایاں ہوتا ہے۔ {cite:zij-sabi-nallino-byblion p.114}۔"
  es: "La paralaje es la diferencia entre la posición visible de un cuerpo y su posición real calculada. Es máxima en la Luna porque el tamaño de la Tierra, visto desde la esfera lunar, es mucho mayor que desde las esferas de los demás cuerpos, por lo que el semirradio de la Tierra se aprecia con claridad. {cite:zij-sabi-nallino-byblion p.114}."
  fr: "La parallaxe est la différence entre la position visible d'un corps et sa position réelle calculée. Elle est maximale pour la Lune car la taille de la Terre, vue depuis la sphère lunaire, est bien plus grande que vue depuis les sphères des autres corps; ainsi, le demi-rayon de la Terre apparaît clairement. {cite:zij-sabi-nallino-byblion p.114}."
  tr: "Paralellik, bir gezegenin görünen konumunun, hesaplanan gerçek konumundan ne kadar farklı olduğunu gösteren derecedir; Ay'da diğer gezegenlere göre daha fazladır çünkü Dünya'nın görünen boyutu, Ay'ın yörüngesine göre diğer gezegenlerin yörüngelerine göre daha büyüktür, bu da Dünya'nın görünen yarıçapını görünür kılar. {cite:zij-sabi-nallino-byblion s.114}."
  id: "Paralelisme adalah tingkat perbedaan posisi tampak suatu planet dengan posisi sebenarnya yang dihitung; paralelisme lebih besar pada Bulan daripada planet lain karena ukuran tampak Bumi relatif terhadap orbit Bulan lebih besar daripada relatif terhadap orbit planet lain, sehingga membuat jari-jari tampak Bumi terlihat. {cite:zij-sabi-nallino-byblion p.114}."
