summary:
  ar: "الكفر لغة الستر، وشرعاً إنكار ما علم من دين محمد ضرورة. وهو أعظم الذنوب، وجزاء الكافر في الآخرة الخلود في النار. ولا يكره الإنسان على الكفر إذا بقي قلبه مطمئناً بالإيمان، والصبر أفضل. وفي خطاب الكفار بفروع الشريعة ثلاثة أقوال، وعلى المسلمين دعوة الكفار إلى الإسلام قبل قتالهم. ويسقط عن الكافر إذا أسلم حقوق الله، ولا يسقط حقوق الآدميين الرضائية. وأحكام الكفار في النجاسة والمساجد والولاية والأنكحة والوصية والإجارة والشركة والوقف والاستعانة في الجهاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13385} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13386} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13387} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13388} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13389} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13390} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13391} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13392} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13393} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13394} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13395} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13396} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13397} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13398} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13399} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13400}"
  en: "Kufr means concealing in the lexicon; in the law it is denying what is known of the religion of Muhammad by necessity. It is the gravest sin, and its penalty in the next world is eternal Fire. A person forced to utter a word of disbelief is not a disbeliever while his heart is at peace with faith, though patience is better. The jurists give three views on whether disbelievers are addressed by the detailed rules of the law; the Muslims must call disbelievers to Islam before fighting them. On conversion, the rights of God fall away, while human rights that were accepted by the debtor remain. The book also treats the impurity of the disbeliever, touching the mushaf, entering mosques, deathbed prompting, guardianship, marriage, wills, hire, partnership, waqf and the aid of disbelievers in war. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13385} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13386} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13387} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13388} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13389} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13390} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13391} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13392} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13393} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13394} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13395} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13396} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13397} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13398} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13399} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13400}"
  ur: "کفر لغت میں ڈھانپنے کو کہتے ہیں، اور شرعاً دینِ محمد کی کسی ضروری بات کا انکار۔ یہ سب سے بڑا گناہ ہے، اور آخرت میں اس کی سزا ہمیشہ کا جہنم ہے۔ جو شخص مجبور ہو کر کلمۂ کفر کہے وہ کافر نہیں اگر دل ایمان پر مطمئن ہو، اور صبر بہتر ہے۔ کفار کو فروعِ شریعت کا مخاطب ماننے میں تین اقوال ہیں؛ مسلمانوں پر لازم ہے کہ قتال سے پہلے کفار کو اسلام کی دعوت دیں۔ اسلام لانے سے حقوقِ اللہ ساقط ہو جاتے ہیں، جبکہ جو حقوق العباد ان کی رضا سے تھے وہ باقی رہتے ہیں۔ کتاب میں کفار کی نجاست، مسجد میں داخلہ، ولایت، نکاح، وصیت، اجارہ، شرکت، وقف اور جہاد میں ان سے مدد کے احکام بھی ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13385} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13386} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13387} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13388} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13389} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13390} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13391} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13392} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13393} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13394} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13395} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13396} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13397} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13398} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13399} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13400}"
  es: "Kufr significa ocultamiento en el léxico; en la ley, es negar por necesidad lo que se conoce de la religión de Mahoma. Es el pecado más grave, y su castigo en el más allá es el fuego eterno. Una persona obligada a pronunciar una palabra de incredulidad no es incrédula mientras su corazón esté en paz con la fe, aunque la paciencia es mejor. Los juristas ofrecen tres puntos de vista sobre si los incrédulos están sujetos a las normas detalladas de la ley; los musulmanes deben invitar a los incrédulos al Islam antes de combatirlos. Al convertirse, los derechos de Dios se pierden, mientras que los derechos humanos que el deudor aceptó permanecen. El libro también trata la impureza del incrédulo, el contacto con el Corán, la entrada a las mezquitas, la incitación en el lecho de muerte, la tutela, el matrimonio, los testamentos, el alquiler, la sociedad, el waqf y la ayuda a los incrédulos en la guerra. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13385} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13386} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13387} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13388} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13389} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13390} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13391} {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.13392} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13393} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13394} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13395} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13396} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13397} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13398} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13399} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13400}"
  fr: "Le kufr signifie « dissimulation » dans le lexique; en droit, il s'agit de renier, par nécessité, ce qui est connu de la religion de Muhammad. C'est le péché le plus grave, et sa peine dans l'au-delà est le Feu éternel. Une personne contrainte de prononcer une parole d'incroyance n'est pas considérée comme incroyante tant que son cœur est en paix avec la foi, bien que la patience soit préférable. Les juristes proposent trois avis quant à l'applicabilité des règles détaillées de la loi aux incroyants; les musulmans doivent appeler les incroyants à l'islam avant de les combattre. Lors de la conversion, les droits de Dieu sont abolis, tandis que les droits humains acquis par le débiteur demeurent. Le livre traite également de l'impureté de l'incroyant, du fait de toucher le mushaf, d'entrer dans les mosquées, de l'incitation à la mort, de la tutelle, du mariage, des testaments, du loyer, du partenariat, du waqf et de l'aide aux incroyants en temps de guerre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13385} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13386} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13387} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13388} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13389} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13390} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13391} {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.13392} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13393} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13394} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13395} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13396} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13397} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13398} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13399} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13400}"
  tr: "İnfirsizlik gizlemenin dilidir ve İslam hukukunda Muhammed dininin bilinenlerini inkâr etmek zorunludur. Bu en büyük günahtır ve ahirette kâfirin cezası ateşte sonsuz sonsuzluktur. Bir kişi, kalbi inançta güvenliyse ve sabır daha iyiyse kâfir olmaya zorlanmaz. Kâfirlerin Şeriat dalları hakkındaki söylemleriyle ilgili üç görüş vardır ve Müslümanlar, onlarla savaşmadan önce kâfirleri İslam'a davet etmelidir. İnfir İslam'ı kabul eden kişinin haklarından vazgeçilir, ancak insan hakları kaybedilmez. İnfirlerin günahkarlık, camiler, vesayet, evlilik, vasiyet, kira, ortaklık, vakıf ve cihada yardım isteme ile ilgili hükümleri. {alıntı:] fiqh-mawsua-kuwaitiyya-noor-v3 s.13385} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13386} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13387}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13388} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13389} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13390} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13391} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13392} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13393} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13394} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13395} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13396} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13397} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13398} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13399} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13400}"
  id: "Ketidakpercayaan adalah bahasa penyembunyian, dan dalam hukum Islam, adalah keharusan untuk menyangkal apa yang diketahui tentang agama Muhammad. Itu adalah dosa terbesar, dan hukuman bagi orang kafir di akhirat adalah kekekalan abadi dalam Api. Seseorang tidak dipaksa untuk tidak percaya jika hatinya tetap aman dalam iman, dan kesabaran lebih baik. Ada tiga pendapat mengenai wacana orang kafir tentang cabang-cabang Syariah, dan Muslim harus mengundang kafir ke Islam sebelum melawan mereka. Hak-hak Allah dihapus dari orang kafir jika mereka memeluk Islam, tetapi hak manusia tidak hilang. Putusan orang kafir mengenai ketidaksucian, masjid, wali, pernikahan, wasiat, sewa, kemitraan, wakaf, dan mencari bantuan dalam jihad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13385} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13386} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13387} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13388} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13389} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13390} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13391} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13393} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13393} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13394} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13395} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13396} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13397} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13398} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13399} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13400}"
