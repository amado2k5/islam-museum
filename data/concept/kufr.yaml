label:
  ar: "كُفْر"
  en: "Disbelief (kufr)"
  ur: "کفر"
summary:
  ar: "الكفر لغة الستر، وشرعاً إنكار ما علم من دين محمد ضرورة. وهو أعظم الذنوب، وجزاء الكافر في الآخرة الخلود في النار. ولا يكره الإنسان على الكفر إذا بقي قلبه مطمئناً بالإيمان، والصبر أفضل. وفي خطاب الكفار بفروع الشريعة ثلاثة أقوال، وعلى المسلمين دعوة الكفار إلى الإسلام قبل قتالهم. ويسقط عن الكافر إذا أسلم حقوق الله، ولا يسقط حقوق الآدميين الرضائية. وأحكام الكفار في النجاسة والمساجد والولاية والأنكحة والوصية والإجارة والشركة والوقف والاستعانة في الجهاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13385} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13386} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13387} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13388} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13389} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13390} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13391} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13392} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13393} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13394} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13395} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13396} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13397} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13398} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13399} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13400}"
  en: "Kufr means concealing in the lexicon; in the law it is denying what is known of the religion of Muhammad by necessity. It is the gravest sin, and its penalty in the next world is eternal Fire. A person forced to utter a word of disbelief is not a disbeliever while his heart is at peace with faith, though patience is better. The jurists give three views on whether disbelievers are addressed by the detailed rules of the law; the Muslims must call disbelievers to Islam before fighting them. On conversion, the rights of God fall away, while human rights that were accepted by the debtor remain. The book also treats the impurity of the disbeliever, touching the mushaf, entering mosques, deathbed prompting, guardianship, marriage, wills, hire, partnership, waqf and the aid of disbelievers in war. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13385} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13386} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13387} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13388} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13389} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13390} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13391} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13392} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13393} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13394} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13395} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13396} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13397} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13398} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13399} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13400}"
  ur: "کفر لغت میں ڈھانپنے کو کہتے ہیں، اور شرعاً دینِ محمد کی کسی ضروری بات کا انکار۔ یہ سب سے بڑا گناہ ہے، اور آخرت میں اس کی سزا ہمیشہ کا جہنم ہے۔ جو شخص مجبور ہو کر کلمۂ کفر کہے وہ کافر نہیں اگر دل ایمان پر مطمئن ہو، اور صبر بہتر ہے۔ کفار کو فروعِ شریعت کا مخاطب ماننے میں تین اقوال ہیں؛ مسلمانوں پر لازم ہے کہ قتال سے پہلے کفار کو اسلام کی دعوت دیں۔ اسلام لانے سے حقوقِ اللہ ساقط ہو جاتے ہیں، جبکہ جو حقوق العباد ان کی رضا سے تھے وہ باقی رہتے ہیں۔ کتاب میں کفار کی نجاست، مسجد میں داخلہ، ولایت، نکاح، وصیت، اجارہ، شرکت، وقف اور جہاد میں ان سے مدد کے احکام بھی ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13385} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13386} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13387} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13388} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13389} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13390} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13391} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13392} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13393} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13394} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13395} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13396} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13397} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13398} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13399} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13400}"
