id: concept/matam-fiqh
class: concept
kind: legal
label:
  ar: "المَأْتَم"
  en: "Matam (a gathering of mourners): mourning rulings"
  ur: "ماتم (ماتم کی مجلس، فقہی احکام)"
summary:
  ar: "المأتم في اللغة مجتمع الرجال والنساء في الغم والفرح، ثم خُصّ باجتماع النساء للموت، والفقهاء يعرّفونه باجتماع الناس في الموت {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13774}. والتعزية أخص منه، وهي الأمر بالصبر وتسلية المصاب {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13774}. ويرى الشافعية والحنابلة وكثير من متأخري الحنفية كراهة المأتم، أي جلوس أهل الميت لاستقبال المعزين، لأنه يجدد الحزن ويكلف المؤنة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13774-13775}. وأجاز المالكية وبعض الحنفية الجلوس للتعزية، وكره المالكية اجتماع النساء للبكاء سراً ومنعوه جهراً، وذهب الحنفية إلى جواز الجلوس للمصيبة ثلاثة أيام للرجال، وهو خلاف الأولى، ولا تجلس النساء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13775}."
  en: "Matam, in lexicon, is a gathering of men and women in sorrow or joy, later restricted to women gathering for a death; the jurists define it as people gathering at a death {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13774}. Condolence (ta'ziya) is narrower: an urging to patience and consolation of the bereaved {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13774}. The Shafi'is, Hanbalis and many later Hanafis dislike the matam, meaning the family sitting to receive mourners, since it renews grief and imposes costs {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13774-13775}. The Malikis and some Hanafis allow sitting for condolence; the Malikis dislike women gathering to weep in private and forbid it aloud, and the Hanafis allow men to sit for three days after a death, though this is less preferred, and forbid women to sit {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13775}."
  ur: "ماتم لغت میں مردوں اور عورتوں کے غم یا خوشی کے اجتماع کو کہتے ہیں، پھر موت کے لیے عورتوں کے جمع ہونے کے ساتھ خاص ہو گیا، اور فقہاء اسے موت پر لوگوں کا جمع ہونا کہتے ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13774}۔ تعزیت اس سے خاص تر ہے، یعنی صبر کی تلقین اور صاحبِ مصیبت کی تسلی {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13774}۔ شافعیہ، حنابلہ اور متأخر حنفیہ کے اکثر کے نزدیک ماتم یعنی میت والوں کا تعزیت کے لیے بیٹھنا مکروہ ہے، کیونکہ اس سے غم تازہ ہوتا ہے اور خرچ پڑتا ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13774-13775}۔ مالکیہ اور بعض حنفیہ تعزیت کے لیے بیٹھنے کو جائز کہتے ہیں؛ مالکیہ عورتوں کے چھپ کر رونے کے اجتماع کو مکروہ اور اعلانیہ کو ممنوع کہتے ہیں، اور حنفیہ کے نزدیک مردوں کا تین دن تک بیٹھنا جائز ہے اگرچہ خلاف اولیٰ ہے، عورتیں نہیں بیٹھیں گی {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13775}۔"
