id: concept/fath-anwa
class: concept
kind: legal
label:
  ar: الفتح عنوة
  en: Conquest by force (anwa)
summary:
  ar: "الفتح عنوة عند البلاذري أخذ المدينة أو الأرض بالقتال والحصار: مثاله عنده خيبر — روى عن عبد الرزاق عن معمر عن الزهري «أن النبي فتح خيبر عنوة»، فقُسمت أموالها وخيبر نفسها على المقاتلة: في رواية ابن عباس «قُسمت خيبر على ألف وخمس مائة سهم وثمانين سهماً» على عدد المقاتلة، وكانت صفايا النبي منها نصيباً يطعم منه نساءه وعمه العباس وأبا بكر وعمر والحسن والحسين وبني المطلب؛ ويقابل العنوةُ الصلحَ: ما أُخذ صلحاً بقي على أهله بشروط المصالحة كفدك، وما أُخذ عنوة صار غنيمة تقسم على من شهد الفتح."
  en: "Fath 'anwa in al-Baladhuri is taking a town or land by combat and siege: his example is Khaybar — he reports via Abd al-Razzaq from Ma'mar from al-Zuhri 'that the Prophet took Khaybar by force ('anwatan)', so its goods and Khaybar itself were divided among the fighters — in Ibn Abbas's report 'Khaybar was divided into one thousand five hundred and eighty shares' matching the number of combatants, the Prophet's safaya from it being an allotment from which he provisioned his wives, his uncle Abbas, Abu Bakr, Umar, al-Hasan, al-Husayn and Banu al-Muttalib; 'anwa contrasts with sulh — what was taken by treaty remained with its people on the treaty terms, like Fadak, while what was taken by force became booty divided among those present at the conquest."
