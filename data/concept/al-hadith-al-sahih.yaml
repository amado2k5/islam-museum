    stance: { ar: "صحيح البخاري أصح، وهو قول الجمهور", en: "Al-Bukhari's Sahih is the sounder; the majority view" }
    summary: { ar: "يقدّم ابن حجر صحيح البخاري لاشتراطه ثبوت اللقاء، ولقلة المتكلّم فيهم من رجاله، ولقلة ما انتُقد عليه.", en: "Ibn Hajar ranks al-Bukhari's Sahih first for its requirement of proven meeting, its fewer criticised narrators and its fewer criticised reports." }
