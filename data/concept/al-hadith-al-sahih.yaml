id: concept/al-hadith-al-sahih
class: concept
kind: term
label: { ar: "الحديث الصحيح", en: "The sound report (sahih)", fr: "Le hadith authentique (sahih)", ur: "صحیح حدیث", es: "El informe sonoro (sahih)", tr: "özgün hadis", id: "hadis asli" }
term: { ar: "الصحيح لذاته، والصحيح لغيره", en: "al-sahih li-dhatihi, al-sahih li-ghayrihi" }
summary:
  ar: "الصحيح لذاته عند ابن حجر خبر الآحاد بنقل عدل تام الضبط، متصل السند، غير معلّل ولا شاذ؛ وتتفاوت رتبه بتفاوت هذه الأوصاف، ومنها ما أطلق عليه بعض الأئمة أصح الأسانيد؛ والصحيح لغيره هو الحسن لذاته إذا تعددت طرقه؛ ويقدّم ابن حجر صحيح البخاري ثم صحيح مسلم ثم ما وافق شرطهما {cite:nuzhat-al-nazar-itr-bushra-2011 p. 52-60}."
  en: "For Ibn Hajar the report sound in itself (sahih li-dhatihi) is a solitary report transmitted by upright narrators of complete accuracy, with a connected chain, free of hidden defect and of anomaly; its ranks vary with the strength of these qualities, the highest being what some masters called the soundest chains; the report sound through another (sahih li-ghayrihi) is a report good in itself whose chains are multiplied; he ranks al-Bukhari's Sahih first, then Muslim's, then what meets their conditions {cite:nuzhat-al-nazar-itr-bushra-2011 p. 52-60}."
  fr: "Pour Ibn Hajar, le hadith authentique en lui-même (sahih li-dhatihi) est un récit isolé transmis par des personnes intègres et d’une précision complète, dans une chaîne continue, sans défaut caché ni anomalie. Ses degrés varient selon la force de ces qualités : le plus élevé comprend ce que certains maîtres ont appelé les chaînes les plus authentiques. Le hadith authentique par corroboration (sahih li-ghayrihi) est un récit bon en lui-même transmis par plusieurs chaînes. Ibn Hajar place en tête le Sahih d’al-Bukhari, puis celui de Muslim, puis les récits qui répondent à leurs critères {cite:nuzhat-al-nazar-itr-bushra-2011 p. 52-60}."
  ur: "ابن حجر کے نزدیک صحیح لذاتہ وہ خبرِ واحد ہے جسے عادل، کامل الضبط راوی متصل سند سے نقل کریں، اور وہ معلل اور شاذ نہ ہو؛ ان اوصاف کی قوت کے تفاوت سے اس کے مراتب مختلف ہیں، اور اعلیٰ مرتبہ وہ ہے جسے بعض ائمہ نے اصح الاسانید کہا؛ صحیح لغیرہ وہ حسن لذاتہ ہے جس کے طرق متعدد ہوں؛ وہ صحیح بخاری کو پہلے، پھر صحیح مسلم، پھر ان کی شرط پر پوری اترنے والی کو رکھتے ہیں {cite:nuzhat-al-nazar-itr-bushra-2011 p. 52-60}۔"
  es: "Para Ibn Hajar, el relato auténtico en sí mismo (sahih li-dhatihi) es un relato solitario transmitido por narradores rectos de completa precisión, con una cadena conectada, libre de defectos ocultos y de anomalías; sus rangos varían según la fuerza de estas cualidades, siendo el más alto lo que algunos maestros llamaron las cadenas más sólidas; el relato auténtico a través de otro (sahih li-ghayrihi) es un relato bueno en sí mismo cuyas cadenas se multiplican; él clasifica primero el Sahih de al-Bukhari, luego el de Muslim, y luego lo que cumple sus condiciones {cite:nuzhat-al-nazar-itr-bushra-2011 p. 52-60}."
  tr: "İbn Hajar'a göre, gerçek olan kendisi, tek başına rivayetlerin tam doğrulukla, bağlı bir zincirle, akıl yürütme veya anormallik olmadan aktarılmasıdır; bu tanımlara göre dereceleri değişir, bazılarını bazı imamlar en özgün zincirler olarak adlandırmıştır; diğerleri için ise zincirleri çoğaltılırsa 'hasan kendi başına'dır. İbn Hacer, önce Sahih al-Buhari'yi, ardından Sahih Müslüman'ı ve ardından onların koşullarını karşılayanı önceliklendirir {cite:nuzhat-al-nazar-itr-bushra-2011, s. 52-60}."
  id: "Menurut Ibn Hajar, narasi sejati itu sendiri adalah transmisi narasi dengan akurasi penuh, dengan rantai yang terhubung, tanpa penalaran atau keanehan; menurut definisi ini, tingkatnya bervariasi; beberapa imam menyebutnya rantai paling asli; bagi yang lain, jika rantai mereka dikalikan, itu adalah 'hasan saja.' Ibn Hajar memprioritaskan pertama Sahih al-Bukhari, kemudian Sahih Muslim, dan kemudian mereka yang memenuhi syaratnya {cite:nuzhat-al-nazar-itr-bushra-2011, hlm. 52-60}."
