    summary: { ar: "يحمل ابن حجر قول أبي علي على نفي الأصحية لا المساواة، وتفضيل المغاربة على حسن السياق والترتيب.", en: "Ibn Hajar reads Abu 'Ali's words as denying superiority, not equality, and the Maghribis' preference as concerning presentation and arrangement." }
