    stance:
      ar: "أمثلة الشعراوي السياسية والاقتصادية عن الأنظمة البشرية رأيه وحده ولم تُعضد من مصادر في هذه الدفعة"
      en: "Sha'rawi's political and economic examples about human systems are his own view and are not supported by sources in this batch"
    holders: []
    summary:
      ar: "يذكر الشعراوي أمثلة من الأنظمة السياسية والاقتصادية في زمنه، ولم تُدخل هنا مصادر تاريخية عنها، ولا الرأي الأكاديمي، ولا الآراء الأخرى. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.777}"
      en: "Sha'rawi gives examples of the political and economic systems of his time; historical sources on them are not entered here, nor the academic view or other views {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.777}."
