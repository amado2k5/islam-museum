id: concept/tashri-al-samawi
class: concept
kind: doctrine
label:
  ar: "التشريع الإلهي والتشريع البشري"
  en: "Divine legislation and human legislation"
summary:
  ar: "يرى الشعراوي أن التشريع الإلهي يحمل في ذاته ما يستجد من الأقضية دون تعديل، لأن الله يعلم ما سيقع، وأن التشريع البشري يُعدَّل لأن المشرع يغيب عنه حكم، وأن الهدى من الله وحده لأنه لا ينتفع بما شرع، وأن المنهج لا يُعدّل بتغير الأهواء. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.719}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.777}"
  en: "Sha'rawi holds that divine legislation carries within it what new cases may arise, without amendment, since God knows what will occur; human legislation is amended because the legislator misses a ruling; guidance belongs to God alone because He gains nothing from it; and the way of God is not changed by shifting desires {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.719}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.777}."
wings: [ideas]
themes: [creed, ethics-and-character]
periods: [period/prophetic-era]
regions: [global]
issue:
  ar: "لماذا لا يحتاج التشريع الإلهي إلى التعديل، وما الفرق بينه وبين التشريع البشري؟"
  en: "Why does divine legislation need no amendment, and how does it differ from human legislation?"
perspectives:
  - tradition: sunni
    id: sharawi-divine-law-completeness
    stance:
      ar: "التشريع الإلهي شامل لكل احتمال، والهدى من الله لأنه لا ينتفع بما شرع"
      en: "Divine law covers every possibility, and guidance comes from God since He gains nothing from it"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقول الشعراوي إن الإسلام منهج خاتم فلا منهج بعده، فكان متضمناً كل الاحتمالات، ويستدل على أن الهدى لا يكون إلا من الله بأن المشرّع البشري يهوى ويحتاج إلى تعديل، وأن الله الذي يشرع لا ينتفع بالتشريع. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.719}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.776}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.777}"
      en: "Sha'rawi says Islam is the sealing way with no way after it, so that it includes every possibility; he holds that guidance can come only from God, because human legislators follow desire and must amend, while the one who legislates gains nothing from it {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.719}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.776}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.777}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
