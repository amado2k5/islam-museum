id: concept/maqam-ibrahim-ayat-tafsir
class: concept
kind: term
label: { ar: "آيات المقام في تفسير المنار", en: "The signs of the Station in Tafsir al-Manar", es: "Los letreros de la estación en Tafsir al-Manar", fr: "Les signes de la station dans le Tafsir al-Manar", ur: "تفسیر المنار میں اسٹیشن کی علامات", tr: "Al-Manar Tefsirindeki Makamın Ayetleri", id: "Ayat-ayat Maqam dalam Tafsir Al-Manar" }
issue:
  ar: "ما هو مقام إبراهيم الوارد في آية «فيه آيات بينات»، وهل هو أثر القدم في الصخرة، أم الموضع الذي كان يقوم فيه للعبادة، أم أمر آخر؟"
summary:
  ar: "الموضع المذكور في القرآن ضمن الآيات البينات في البيت الحرام، وفيه أثر قدمي إبراهيم في الصخرة عند الكعبة. يذكر محمد رشيد رضا أن المقام هو الموضع الذي قام فيه إبراهيم للعبادة، وأن أثر القدم معروف عند العرب بالنقل. وينقل عن المفسرين عدّاً للآيات في المقام، ويرد بعضها بوصفه غير آية، ويقرأ بعضها بوصفه كرامة."
  en: "The place named in the Qur'an among the clear signs of the Sacred House, where a footprint of Abraham is said to be in the rock beside the Ka'ba. Rashid Rida says the station is the place where Abraham stood for worship, and that the footprint was known to the Arabs by transmission. He reports the commentators' lists of signs in the station, rejects some items as not signs, and reads some as a favour (karama) to Abraham."
  es: "El lugar mencionado en el Corán entre los signos claros de la Casa Sagrada, donde se dice que se encuentra la huella de Abraham en la roca junto a la Kaaba. Rashid Rida afirma que este lugar es donde Abraham oraba y que la huella era conocida por los árabes por transmisión oral. Recopila las listas de signos que los comentaristas han enumerado en este lugar, descarta algunos por no ser signos y considera otros como un favor (karama) a Abraham."
  fr: "Le lieu mentionné dans le Coran parmi les signes manifestes de la Maison Sacrée, où l'empreinte d'Abraham serait gravée dans la roche près de la Kaaba, est, selon Rashid Rida, l'endroit où Abraham se recueillait pour prier. L'empreinte aurait été transmise aux Arabes par tradition orale. Il rapporte les listes de signes établies par les commentateurs pour ce lieu, en rejette certains comme n'étant pas des signes, et en interprète d'autres comme une grâce (karama) accordée à Abraham."
  ur: "اس جگہ کا نام قرآن میں مقدس گھر کی واضح نشانیوں میں سے ہے، جہاں کعبہ کے ساتھ والی چٹان میں ابراہیم کے قدموں کا نشان بتایا گیا ہے۔ راشد ردا کا کہنا ہے کہ اسٹیشن وہ جگہ ہے جہاں ابراہیم عبادت کے لیے کھڑے ہوئے تھے، اور یہ کہ عربوں کو اس کے قدموں کے نشانات کی ترسیل کے ذریعے معلوم تھا۔ وہ اسٹیشن میں مبصرین کی نشانیوں کی فہرستوں کی اطلاع دیتا ہے، کچھ چیزوں کو نشانیوں کے طور پر مسترد کرتا ہے، اور کچھ کو ابراہیم کے احسان ⁦(کرام)⁩ کے طور پر پڑھتا ہے۔"
  tr: "Kur'an'da bahsedilen yer, Kutsal Ev'deki açık ayetler arasındadır ve İbrahim'in ayak izini Kabe yakınındaki kayanın üzerindeki izini gösterir. Muhammed Reşid Redâ, Makam'ın İbrahim'in ibadet için durduğu yer olduğunu ve ayak izinin Araplar arasında aktarılan bir metin olarak bilindiğini belirtir. Makam'daki ayetler hariç yorumculardan alıntı yapar; bazıları ayet değil, bazıları mucize olarak okunur."
  id: "Tempat yang disebutkan dalam Al-Qur'an adalah salah satu ayat-ayat jelas dalam Rumah Suci, dan menunjukkan jejak kaki Abraham di atas batu dekat Ka'bah. Muhammad Rashid Reda menyebutkan bahwa Maqam adalah tempat Abraham berdiri untuk ibadah, dan bahwa jejak kaki dikenal di kalangan Arab sebagai teks yang diwariskan. Ia mengutip dari para komentator kecuali ayat-ayat dalam Maqam; beberapa disebut bukan ayat, dan beberapa dibaca sebagai mukjizat."
