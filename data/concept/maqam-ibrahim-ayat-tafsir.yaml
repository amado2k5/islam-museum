label: { ar: "آيات المقام في تفسير المنار", en: "The signs of the Station in Tafsir al-Manar" }
issue:
  ar: "ما هو مقام إبراهيم الوارد في آية «فيه آيات بينات»، وهل هو أثر القدم في الصخرة، أم الموضع الذي كان يقوم فيه للعبادة، أم أمر آخر؟"
summary:
  ar: "الموضع المذكور في القرآن ضمن الآيات البينات في البيت الحرام، وفيه أثر قدمي إبراهيم في الصخرة عند الكعبة. يذكر محمد رشيد رضا أن المقام هو الموضع الذي قام فيه إبراهيم للعبادة، وأن أثر القدم معروف عند العرب بالنقل. وينقل عن المفسرين عدّاً للآيات في المقام، ويرد بعضها بوصفه غير آية، ويقرأ بعضها بوصفه كرامة."
  en: "The place named in the Qur'an among the clear signs of the Sacred House, where a footprint of Abraham is said to be in the rock beside the Ka'ba. Rashid Rida says the station is the place where Abraham stood for worship, and that the footprint was known to the Arabs by transmission. He reports the commentators' lists of signs in the station, rejects some items as not signs, and reads some as a favour (karama) to Abraham."
