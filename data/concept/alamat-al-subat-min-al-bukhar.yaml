id: concept/alamat-al-subat-min-al-bukhar
class: concept
kind: scientific
label:
  ar: "علامات السبات من البخارات"
  en: "Signs of coma from vapours"
  fr: "Signes du coma dû aux vapeurs"
  ur: "بخارات سے غنودگی کی علامات"
summary:
  ar: "يذكر ابن سينا أن السبات قد يكون من بخارات ترتفع من البدن في الحميات أو من المعدة أو الرئة أو الكبد، ويعطي لكل منها علامة تقدمه، وفيه سطر موسوم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v2 p.92}"
  en: "Ibn Sina says coma may come from vapours rising from the body in fevers, or from the stomach, lung or liver, and gives each a sign that comes before it; the record has a labelled line in a section held for the founder's ruling {cite:canon-ibn-sina-print-v2 p.92}"
  fr: "Ibn Sina dit que le coma peut provenir de vapeurs qui montent du corps lors des fièvres, ou de l’estomac, du poumon ou du foie. Il donne pour chaque cas un signe avant-coureur. La notice comporte une mention signalée dans une section réservée à la décision du fondateur {cite:canon-ibn-sina-print-v2 p.92}."
  ur: "ابن سینا کہتا ہے کہ غنودگی بخاروں میں بدن سے اٹھنے والے بخارات سے، یا معدے، پھیپھڑے یا جگر سے ہو سکتی ہے، اور ہر ایک کی پیشگی علامت بتاتا ہے؛ اس میں ایک موسوم سطر بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v2 p.92}۔"
