summary:
  ar: "مورد اسفرم زهر وقضبان دقاق متفركة إلى الغبرة والصفرة، حار يابس في الثانية، نافع للصرع والرطوبات في الدماغ، يقوي المعدة والكبد، وفي تعريفه اختلاف بين الأطباء {cite:canon-ibn-sina-print-v1 p.569}."
  en: "Mawrid asfaram is flowers and thin separated twigs, grey and yellow, hot and dry in the second degree; helpful for epilepsy and humidities in the brain, it strengthens the stomach and liver, and the physicians differ over what it is {cite:canon-ibn-sina-print-v1 p.569}."
  ur: "مورد اسفرم پھول اور باریک جدا جدا ٹہنیاں ہیں، خاکستری اور زرد، دوسرے درجے میں گرم خشک؛ مرگی اور دماغ کی رطوبتوں میں مفید، معدے اور جگر کو مضبوط کرتا ہے، اور اس کی شناخت میں اطباء کا اختلاف ہے {cite:canon-ibn-sina-print-v1 p.569}۔"
