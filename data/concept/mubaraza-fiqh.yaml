id: concept/mubaraza-fiqh
class: concept
kind: legal
label:
  ar: "المُبَارَزَة"
  en: "Single combat (mubaraza): permission, challenge, spoils, pledges"
  ur: "مبارزت (انفرادی جنگ): اجازت، للکار، سلب اور شرائط"
summary:
  ar: "المبارزة في اللغة مفاعلة من برز، وفي الاصطلاح ظهور اثنين من الصفين للقتال {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13812}. وهي في الأصل جائزة عند الفقهاء، وقد بارزت الصحابة في عصر النبي ومن بعده، وفي يوم بدر خرج علي وحمزة وعبيدة إلى عتبة وشيبة والوليد، وقال ابن قدامة إن الصحابة كانوا يبارزون ولم ينكر منكر فكان إجماعاً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13813}. وتعتبر المالكية والشافعية والحنابلة إذن الإمام أو أمير الجيش، ويستحب عند الشافعية إذا طلب الكافر المبارزة، ويحرم عند بعضهم على من يؤدي قتله إلى هزيمة المسلمين، ويستحب لمن يعلم من نفسه القوة والشجاعة عند الحنابلة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13813-13815}. والمبارز الذي يقتل الكافر له سلبه عند الحنابلة وعند الحنفية إذا كان بإذن، والحرب خدعة، ويجب الوفاء بالشروط المتفق عليها بين المتبارزين {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13816-13817}. وإذا أثخن أحد المتبارزين أو انهزم جاز للمسلمين الدفع عنه على تفصيل المذاهب {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13817-13819}."
  en: "Mubaraza, in lexicon, is a form of barraza, to come forward; in technical use it is two champions from the two lines coming out to fight {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13812}. In principle the jurists allow it. The Companions fought single combats in the Prophet's time and after him, and at Badr Ali, Hamza and Ubayda came out against Utba, Shayba and al-Walid; Ibn Qudama says that no one objected, so it counts as consensus {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13813}. The Malikis, Shafi'is and Hanbalis require the imam's or commander's permission; the Shafi'is say it is recommended when the enemy has asked for it; some say it is forbidden when the death of the champion would bring defeat; the Hanbalis say a brave man may accept with permission {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13813-13815}. The spoils of a slain champion go to the Muslim who killed him, according to the Hanbalis, and under the Hanafis when he was sent with permission; trickery is allowed in war, and the terms agreed between champions must be kept {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13816-13817}. If a Muslim is wounded or flees, the schools differ on whether others may come to his aid {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13817-13819}."
  ur: "مبارزت لغت میں برز سے مفاعلہ ہے، اور اصطلاح میں دونوں صفوں میں سے دو افراد کا لڑائی کے لیے سامنے آنا {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13812}۔ اصولاً فقہاء اسے جائز کہتے ہیں۔ صحابہ نبی کے زمانے میں اور بعد میں مبارزت کرتے رہے، اور بدر میں علی، حمزہ اور عبیدہ عتبہ، شیبہ اور ولید کے مقابلے میں نکلے؛ ابن قدامہ کے مطابق کسی نے انکار نہیں کیا تو یہ اجماع ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13813}۔ مالکیہ، شافعیہ اور حنابلہ امام یا لشکر کے امیر کی اجازت معتبر سمجھتے ہیں؛ شافعیہ کے نزدیک دشمن کی طرف سے للکار ہو تو قبول کرنا مستحب ہے؛ بعض کے نزدیک جس کا قتل مسلمانوں کی شکست کا سبب بنے اس کے لیے حرام ہے؛ حنابلہ کے نزدیک بہادر شخص کو اجازت سے مبارزت مستحب ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13813-13815}۔ حنابلہ کے نزدیک مبارز کافر کو قتل کرے تو اس کا سلب اسی کا ہے؛ جنگ میں دھوکہ جائز ہے، اور متبارزین کے طے شدہ شرائط کی پابندی لازم ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13816-13817}۔ اگر کوئی مسلمان زخمی ہو جائے یا بھاگ جائے تو اس کی مدد کرنے میں مذاہب مختلف ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13817-13819}۔"
