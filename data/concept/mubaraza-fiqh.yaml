label:
  ar: "المُبَارَزَة"
  en: "Single combat (mubaraza): permission, challenge, spoils, pledges"
  ur: "مبارزت ⁦(انفرادی جنگ)⁩: اجازت، للکار، سلب اور شرائط"
  es: "Combate singular (mubaraza): permiso, desafío, botín, promesas"
  fr: "Combat singulier (mubaraza): permission, défi, butin, promesses"
  tr: "çit"
  id: "anggar"
summary:
  ar: "المبارزة في اللغة مفاعلة من برز، وفي الاصطلاح ظهور اثنين من الصفين للقتال {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13812}. وهي في الأصل جائزة عند الفقهاء، وقد بارزت الصحابة في عصر النبي ومن بعده، وفي يوم بدر خرج علي وحمزة وعبيدة إلى عتبة وشيبة والوليد، وقال ابن قدامة إن الصحابة كانوا يبارزون ولم ينكر منكر فكان إجماعاً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13813}. وتعتبر المالكية والشافعية والحنابلة إذن الإمام أو أمير الجيش، ويستحب عند الشافعية إذا طلب الكافر المبارزة، ويحرم عند بعضهم على من يؤدي قتله إلى هزيمة المسلمين، ويستحب لمن يعلم من نفسه القوة والشجاعة عند الحنابلة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13813-13815}. والمبارز الذي يقتل الكافر له سلبه عند الحنابلة وعند الحنفية إذا كان بإذن، والحرب خدعة، ويجب الوفاء بالشروط المتفق عليها بين المتبارزين {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13816-13817}. وإذا أثخن أحد المتبارزين أو انهزم جاز للمسلمين الدفع عنه على تفصيل المذاهب {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13817-13819}."
  en: "Mubaraza, in lexicon, is a form of barraza, to come forward; in technical use it is two champions from the two lines coming out to fight {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13812}. In principle the jurists allow it. The Companions fought single combats in the Prophet's time and after him, and at Badr Ali, Hamza and Ubayda came out against Utba, Shayba and al-Walid; Ibn Qudama says that no one objected, so it counts as consensus {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13813}. The Malikis, Shafi'is and Hanbalis require the imam's or commander's permission; the Shafi'is say it is recommended when the enemy has asked for it; some say it is forbidden when the death of the champion would bring defeat; the Hanbalis say a brave man may accept with permission {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13813-13815}. The spoils of a slain champion go to the Muslim who killed him, according to the Hanbalis, and under the Hanafis when he was sent with permission; trickery is allowed in war, and the terms agreed between champions must be kept {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13816-13817}. If a Muslim is wounded or flees, the schools differ on whether others may come to his aid {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13817-13819}."
  ur: "مبارزت لغت میں برز سے مفاعلہ ہے، اور اصطلاح میں دونوں صفوں میں سے دو افراد کا لڑائی کے لیے سامنے آنا {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13812}۔ اصولاً فقہاء اسے جائز کہتے ہیں۔ صحابہ نبی کے زمانے میں اور بعد میں مبارزت کرتے رہے، اور بدر میں علی، حمزہ اور عبیدہ عتبہ، شیبہ اور ولید کے مقابلے میں نکلے؛ ابن قدامہ کے مطابق کسی نے انکار نہیں کیا تو یہ اجماع ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13813}۔ مالکیہ، شافعیہ اور حنابلہ امام یا لشکر کے امیر کی اجازت معتبر سمجھتے ہیں؛ شافعیہ کے نزدیک دشمن کی طرف سے للکار ہو تو قبول کرنا مستحب ہے؛ بعض کے نزدیک جس کا قتل مسلمانوں کی شکست کا سبب بنے اس کے لیے حرام ہے؛ حنابلہ کے نزدیک بہادر شخص کو اجازت سے مبارزت مستحب ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13813-13815}۔ حنابلہ کے نزدیک مبارز کافر کو قتل کرے تو اس کا سلب اسی کا ہے؛ جنگ میں دھوکہ جائز ہے، اور متبارزین کے طے شدہ شرائط کی پابندی لازم ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13816-13817}۔ اگر کوئی مسلمان زخمی ہو جائے یا بھاگ جائے تو اس کی مدد کرنے میں مذاہب مختلف ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13817-13819}۔"
  es: "Mubaraza, en léxico, es una forma de barraza, avanzar; en uso técnico son dos campeones de las dos líneas que salen a luchar {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13812}. En principio, los juristas lo permiten. Los Compañeros lucharon en combates singulares en la época del Profeta y después de él, y en Badr Ali, Hamza y Ubayda salieron contra Utba, Shayba y al-Walid; Ibn Qudama dice que nadie objetó, por lo que cuenta como consenso {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13813}. Los Malikis, Shafi'is y Hanbalis requieren el permiso del imán o comandante; los Shafi'is dicen que es recomendable cuando el enemigo lo ha pedido; algunos dicen que está prohibido cuando la muerte del campeón traería la derrota; Los hanbalíes dicen que un hombre valiente puede aceptar con permiso {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13813-13815}. El botín de un campeón muerto va al musulmán que lo mató, según los hanbalíes, y según los hanafíes cuando fue enviado con permiso; el engaño está permitido en la guerra, y los términos acordados entre campeones deben cumplirse {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13816-13817}. Si un musulmán es herido o huye, las escuelas difieren en cuanto a si otros pueden acudir en su ayuda {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13817-13819}."
  fr: "Mubaraza, dans le lexique, est une forme de barraza, qui signifie « avancer ». Techniquement, il désigne deux champions des deux lignes s'affrontant au combat (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.13812). En principe, les juristes l'autorisent. Les Compagnons ont livré des duels du vivant du Prophète et après lui, et à Badr Ali, Hamza et Ubayda ont affronté Utba, Shayba et al-Walid. Ibn Qudama rapporte que personne ne s'y est opposé, ce qui constitue un consensus (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.13813). Les écoles malikite, chaféite et hanbalite exigent l'autorisation de l'imam ou du commandant. Les chaféites le recommandent lorsque l'ennemi le demande; certains l'interdisent lorsque la mort du champion entraînerait la défaite. Les Hanbalites estiment qu'un homme courageux peut accepter une récompense avec permission (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.13813-13815). Le butin d'un champion tué revient au musulman qui l'a tué, selon les Hanbalites, et selon les Hanafites s'il a été envoyé avec permission; la ruse est permise à la guerre, et les termes convenus entre champions doivent être respectés (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.13816-13817). Si un musulman est blessé ou prend la fuite, les écoles divergent quant à la possibilité pour d'autres de lui porter secours (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.13817-13819)."
  tr: "Dilde 'mufāsah' bir 'müfāʿā'dır (ortaya çıkan) ve terminolojide, savaşmak için iki sıra oluşmasını ifade eder {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13812}. Hukukçulara göre bu başlangıçta izinlidir ve Sahabeler Peygamber'in döneminde ve sonrasında onlarla karşılaşmıştır. Badr gününde Ali, Hamza ve Ubeyde Utbah, Şeybe ve el-Velid'e gittiler. İbn Qudame, Sahabelerin birbirleriyle karşı karşıya geldiğini ve kimsenin buna itiraz etmediğini, bu yüzden bir uzlaşma olduğunu {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13813} demiştir. Malikiler, Şafiiler ve Hanbaliler, imam veya ordu komutanının iznini kabul ederler. Şafiilere göre, inanmayan birinin düello talep etmesi önerilirken, bazıları öldürülmesi Müslümanların yenilgisine yol açacak kişiler için bunu yasaklar. Hanbalilere göre {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13813-13815} doğrultusunda güç ve cesaret bilen birine tavsiye edilir. Bir düello, Hanbali ve Hanafileri tarafından izin verilirse soygun hakkına sahiptir. Savaş bir aldatmacadır ve üzerinde anlaşılan koşullar rakip taraflar arasında yerine getirilmelidir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13816-13817}. Rakiplerden biri yenildiğinde veya yenildiğinde, Müslümanların onu ayrıntılı doktrinlere göre savunması mümkündür {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13817-13819}."
  id: "Dalam bahasa, 'mufāsah' adalah 'mufāʿā' (yang muncul), dan dalam istilah, merujuk pada munculnya dua baris untuk bertarung {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13812}. Awalnya diperbolehkan menurut para ahli hukum, dan para Sahabat menghadapi mereka pada masa Nabi dan sesudahnya. Pada hari Badr, Ali, Hamza, dan Ubaidah pergi ke Utbah, Shaybah, dan al-Walid. Ibn Qudamah mengatakan bahwa para Sahabat biasa saling berhadapan, dan tidak ada yang menentangnya, sehingga menjadi konsensus {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13813}. Maliki, Shafi'i, dan Hanbal mempertimbangkan izin dari imam atau komandan tentara. Menurut syafi'i, disarankan jika seorang non-mukmin meminta duel, sementara beberapa melarang siapa pun yang pembunuhannya akan menyebabkan kekalahan Muslim. Disarankan bagi seseorang yang mengetahui kekuatan dan keberanian dalam dirinya menurut Hanbalis {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13813-13815}. Duel yang membunuh orang yang tidak beriman berhak melakukan perampokan menurut Hanbal dan Hanafi jika ia mendapat izin. Perang adalah penipuan, dan syarat yang disepakati harus dipenuhi di antara pihak-pihak yang bersaing {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13816-13817}. Jika salah satu pesaing kalah atau kalah, diperbolehkan bagi Muslim untuk membelanya sesuai dengan doktrin rinci {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13817-13819}."
