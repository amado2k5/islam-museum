id: concept/soap-saboon
class: concept
kind: legal
label:
  ar: "الصَّابون"
  en: "Saboon (soap: made from impure oil, water mixed with soap in purification, and wearing it in the pilgrim state)"
summary:
  ar: "الصابون ما يغسل به الثياب، يتركب من أحماض دهنية وقلويات. ويختلف الفقهاء في طهارة الصابون المعمول من زيت نجس: فالحنفية في المختار يرونه طاهرا، وأجاز الشافعية استعماله، والمالكية أجازوا الانتفاع بالمتنجس، والحنابلة لا يطهرونه. وماء الصابون إذا ذهبت رقته لا يتوضأ به عند الحنفية، ويختلف الحكم عند غيرهم. والمحرم يستعمل الصابون عند الحنفية لأنه ليس بطيب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10273} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10274} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10275} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10276}"
  en: "Saboon is what clothes are washed with; it is made of fatty acids and alkalis. The jurists differ on soap made from impure oil: the Hanafis hold, in their preferred view, that it is pure, and may be used; the Shafi'is allow its use while not calling it pure; the Malikis allow using what is soiled but not what is impure in essence; the Hanbalis do not hold it purified. Water with soap is unfit for ablution once its thinness is gone, according to the Hanafis, and the rule differs for others. A pilgrim in the state of consecration may use soap, since it is not a perfume. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10273} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10274} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10275} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10276}"
