id: concept/soap-saboon
class: concept
kind: legal
label:
  ar: "الصَّابون"
  en: "Saboon (soap: made from impure oil, water mixed with soap in purification, and wearing it in the pilgrim state)"
  es: "Saboon (jabón: hecho de aceite impuro, agua mezclada con jabón en la purificación, y usado en estado de peregrinación)"
  fr: "Saboon (savon: fabriqué à partir d'huile impure, d'eau mélangée à du savon pour la purification, et porté en état de pèlerinage)"
  ur: "صابون ⁦(صابون: ناپاک تیل سے بنا ہوا، طہارت میں صابن میں پانی ملا کر حج کی حالت میں پہننا)⁩"
summary:
  ar: "الصابون ما يغسل به الثياب، يتركب من أحماض دهنية وقلويات. ويختلف الفقهاء في طهارة الصابون المعمول من زيت نجس: فالحنفية في المختار يرونه طاهرا، وأجاز الشافعية استعماله، والمالكية أجازوا الانتفاع بالمتنجس، والحنابلة لا يطهرونه. وماء الصابون إذا ذهبت رقته لا يتوضأ به عند الحنفية، ويختلف الحكم عند غيرهم. والمحرم يستعمل الصابون عند الحنفية لأنه ليس بطيب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10273} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10274} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10275} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10276}"
  en: "Saboon is what clothes are washed with; it is made of fatty acids and alkalis. The jurists differ on soap made from impure oil: the Hanafis hold, in their preferred view, that it is pure, and may be used; the Shafi'is allow its use while not calling it pure; the Malikis allow using what is soiled but not what is impure in essence; the Hanbalis do not hold it purified. Water with soap is unfit for ablution once its thinness is gone, according to the Hanafis, and the rule differs for others. A pilgrim in the state of consecration may use soap, since it is not a perfume. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10273} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10274} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10275} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10276}"
  es: "El jabón es el que se usa para lavar la ropa; está compuesto de ácidos grasos y álcalis. Los juristas discrepan sobre el jabón elaborado con aceite impuro: los hanafíes sostienen, en su opinión preferida, que es puro y puede usarse; los shafiíes permiten su uso, aunque no lo consideran puro; los malikíes permiten usar lo que está sucio, pero no lo que es impuro en esencia; los hanbalíes no lo consideran purificado. Según los hanafíes, el agua con jabón no es apta para la ablución una vez que pierde su fluidez, y la regla difiere para los demás. Un peregrino en estado de consagración puede usar jabón, ya que no es un perfume. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10273} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10274} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10275} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10276}"
  fr: "Le sabou est le produit utilisé pour laver le linge; il est composé d'acides gras et d'alcalis. Les juristes divergent quant à la pureté du savon fabriqué à partir d'huile impure: les hanafites le considèrent, selon leur avis privilégié, comme pur et utilisable; les chaféites en autorisent l'usage sans toutefois le qualifier de pur; les malikites permettent l'utilisation d'un savon souillé mais non d'un savon fondamentalement impur; les hanbalites, quant à eux, ne le considèrent pas comme purifié. L'eau savonneuse est impropre aux ablutions une fois qu'elle a perdu sa fluidité, selon les hanafites, tandis que d'autres écoles de pensée ont des avis divergents. Un pèlerin en état de consécration peut utiliser du savon, car il ne s'agit pas d'un parfum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10273} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10274} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10275} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10276}"
  ur: "صابون وہ ہے جس سے کپڑے دھوئے جاتے ہیں۔ یہ فیٹی ایسڈ اور الکلیس سے بنا ہے۔ ناپاک تیل سے بنے صابن کے بارے میں فقہاء کا اختلاف ہے: احناف اپنی ترجیح کے مطابق صابن کو پاک سمجھتے ہیں اور استعمال کیا جا سکتا ہے۔ شافعی اس کے استعمال کی اجازت دیتے ہیں جبکہ اسے خالص نہیں کہتے۔ مالکی گندی چیز کو استعمال کرنے کی اجازت دیتے ہیں لیکن جوہر میں ناپاک چیز نہیں۔ حنبلی اسے پاک نہیں مانتے۔ حنفیہ کے نزدیک صابن والا پانی وضو کے قابل نہیں ہے جب اس کا پتلا پن ختم ہو جائے، اور دوسروں کے لیے اس کا حکم مختلف ہے۔ حرمت کی حالت میں حاجی صابن کا استعمال کر سکتا ہے، کیونکہ یہ خوشبو نہیں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10273} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10274} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10275} صفحہ 10276}"
