id: concept/zij-sabi-sun-and-moon-show-no-retrogression
class: concept
kind: scientific
label: { ar: "لا يظهر الرجوع في الشمس والقمر", en: "No retrograde motion appears in the Sun and the Moon", ur: "سورج اور چاند میں الٹی حرکت ظاہر نہیں ہوتی", es: "No se observa movimiento retrógrado en el Sol ni en la Luna.", fr: "Aucun mouvement rétrograde n'apparaît dans le Soleil et la Lune." }
summary:
  ar: "يبين البتاني أن الشمس والقمر لا يظهر فيهما الرجوع، لأن سير كل منهما في اليوم يزيد أضعافاً كثيرة على اختلاف تعديله في اليوم، فلا يبين فيهما حال الرجوع، مع أن لهما سيراً في النصف الأقرب من فلك تدويره لا يُحَسّ. {cite:zij-sabi-nallino-byblion p.98}."
  en: "Al-Battani says no retrograde motion shows in the Sun and the Moon, because the daily motion of each far exceeds the daily change in its equation. Although each does move in the nearer half of its epicycle, the motion is not perceived. {cite:zij-sabi-nallino-byblion p.98}."
  ur: "البتانی کہتے ہیں کہ سورج اور چاند میں الٹی حرکت ظاہر نہیں ہوتی، کیونکہ ان میں سے ہر ایک کی روزانہ حرکت اس کے تعدیل کی روزانہ تبدیلی سے کئی گنا زیادہ ہے؛ اگرچہ ان کی حرکت اپنے فلکِ تدویر کے قریبی نصف میں بھی ہوتی ہے، مگر وہ محسوس نہیں ہوتی۔ {cite:zij-sabi-nallino-byblion p.98}۔"
  es: "Al-Battani afirma que el Sol y la Luna no presentan movimiento retrógrado, ya que su movimiento diario supera con creces la variación diaria de su ecuación. Si bien ambos se mueven durante la mitad más cercana de su epiciclo, este movimiento no es perceptible. {cite:zij-sabi-nallino-byblion p.98}."
  fr: "Al-Battani affirme qu'aucun mouvement rétrograde n'est visible pour le Soleil et la Lune, car leur mouvement quotidien dépasse largement la variation quotidienne de leur équation. Bien que chacun se déplace dans la moitié la plus proche de son épicycle, ce mouvement est imperceptible. {cite:zij-sabi-nallino-byblion p.98}."
