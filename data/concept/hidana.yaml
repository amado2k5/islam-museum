id: concept/hidana
class: concept
kind: legal
label:
  ar: "الحضانة"
  en: "Child custody (hidana)"
  ur: "حضانت"
  es: "Custodia de menores (hidana)"
  fr: "Garde d'enfants (hidana)"
summary:
  ar: "الحضانة حفظ الولد وتربيته، وهي للأم مقدمة على غيرها ما لم تتزوج عند الجمهور: تقدم الأم ثم الجدة لأم ثم الخالة في الترتيب المعروف، والولد مخير بين أبويه عند تمام سبع عند من قال بها، وحضانة النبي للصبية في خبر أم سلمة أصل الباب."
  en: "Hidana is the keeping and raising of the child, and it belongs to the mother before others for most jurists until she remarries: the mother comes first, then the maternal grandmother, then the maternal aunt in the known order, the child choosing between his parents at seven for those who hold it, and the Prophet's award of the little girl to her mother in Umm Salama's report is the root of the chapter."
  ur: "حضانت بچے کی نگہداشت اور پرورش ہے، اور جمهور کے نزدیک یہ ماں کو مقدم ہے جب تک وہ دوبارہ شادی نہ کرے: پہلے ماں، پھر نانی، پھر خالہ معروف ترتیب میں، اور بچہ سات برس پر والدین کے درمیان اختیار رکھتا ہے ان کے نزدیک جو قائل ہیں، اور ام سلمہ کی خبر میں نبی نے بچی اس کی ماں کو دی — یہ اس باب کی اصل ہے۔"
  es: "Hidana es la custodia y crianza del niño, y para la mayoría de los juristas pertenece a la madre antes que a nadie hasta que se vuelve a casar: la madre va primero, luego la abuela materna, luego la tía materna en el orden conocido, el niño elige entre sus padres a los siete años para aquellos que lo tienen en custodia, y la adjudicación de la niña a su madre por parte del Profeta en el relato de Umm Salama es la raíz del capítulo."
  fr: "La hidana désigne la garde et l'éducation de l'enfant, et elle appartient en premier lieu à la mère pour la plupart des juristes jusqu'à son remariage: la mère vient en premier, puis la grand-mère maternelle, puis la tante maternelle dans l'ordre connu, l'enfant choisissant entre ses parents à sept ans pour ceux qui en ont la charge, et l'attribution par le Prophète de la petite fille à sa mère dans le récit d'Umm Salama est à l'origine du chapitre."
