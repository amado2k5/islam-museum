label: { ar: "المرض في الشتاء ورأي أبقراط في الاستفراغ", en: "Illness in winter and Hippocrates on purging in the Canon", ur: "سردیوں میں بیماری اور استفراغ پر بقراط کی رائے قانون میں" }
summary:
  ar: "يلاحظ ابن سينا أن الأبدان الصحيحة قلما تمرض في الشتاء، فإن مرضت فالسبب عظيم فيبادر بالعلاج والاستفراغ، لأن الحرارة الغريزية تقوى في الشتاء بالاحتقان، ثم ينقل رأي أبقراط في تفضيل الإسهال على الفصد وكراهة القيء شتاء واستصوابه صيفاً {cite:canon-ibn-sina-print-v1 p.259}."
  en: "Ibn Sina notes that sound bodies seldom fall ill in winter and that, if one does, the cause is great, so treatment and evacuation are hastened, since the innate heat grows strong in winter through confinement; he then reports Hippocrates on preferring purging to venesection and disliking vomiting in winter while approving it in summer {cite:canon-ibn-sina-print-v1 p.259}."
