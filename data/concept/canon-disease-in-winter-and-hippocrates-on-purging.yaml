id: concept/canon-disease-in-winter-and-hippocrates-on-purging
class: concept
kind: scientific
label:
  ar: "المرض في الشتاء ورأي أبقراط في الاستفراغ"
  en: "Illness in winter and Hippocrates on purging in the Canon"
  fr: "Maladie hivernale et avis d’Hippocrate sur la purge dans le Canon"
  ur: "سردیوں میں بیماری اور استفراغ پر بقراط کی رائے قانون میں"
  es: "La enfermedad en invierno y la purga según Hipócrates en el Canon"
summary:
  ar: "يلاحظ ابن سينا أن الأبدان الصحيحة قلما تمرض في الشتاء، فإن مرضت فالسبب عظيم فيبادر بالعلاج والاستفراغ، لأن الحرارة الغريزية تقوى في الشتاء بالاحتقان، ثم ينقل رأي أبقراط في تفضيل الإسهال على الفصد وكراهة القيء شتاء واستصوابه صيفاً {cite:canon-ibn-sina-print-v1 p.259}."
  en: "Ibn Sina notes that sound bodies seldom fall ill in winter and that, if one does, the cause is great, so treatment and evacuation are hastened, since the innate heat grows strong in winter through confinement; he then reports Hippocrates on preferring purging to venesection and disliking vomiting in winter while approving it in summer {cite:canon-ibn-sina-print-v1 p.259}."
  fr: "Selon Ibn Sina, les corps sains tombent rarement malades en hiver ; une atteinte suppose une cause forte appelant traitement et évacuation rapides, la chaleur innée étant confinée et puissante. Il rapporte la préférence d’Hippocrate pour la purge plutôt que la saignée et son rejet du vomissement hivernal, approuvé l’été {cite:canon-ibn-sina-print-v1 p.259}."
  es: "Ibn Sina señala que los cuerpos sanos rara vez enferman en invierno y que, si uno lo hace, la causa es grave, por lo que se acelera el tratamiento y la evacuación, ya que el calor innato se fortalece en invierno debido al confinamiento; luego cita a Hipócrates sobre su preferencia por la purga en lugar de la venesección y su aversión al vómito en invierno, mientras que lo aprueba en verano {cite:canon-ibn-sina-print-v1 p.259}."
