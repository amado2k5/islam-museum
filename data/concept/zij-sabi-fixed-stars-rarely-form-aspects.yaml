label: { ar: "الكواكب الثابتة ونُدرة اتصالها بالمتحيرة", en: "Fixed stars and their rare aspects with the wandering planets", ur: "ثابت ستارے اور متحیر سیاروں سے ان کے نادر اتصالات" }
summary:
  ar: "لا تتصل الكواكب المتحيرة بالكواكب الثابتة لبطء حركتها، ولا تُعد الاتصالات بإلقاء شعاعها على دائرة البروج إذا كان بعدها عن دائرة البروج بعداً واحداً، بل يُنظر إلى الأشكال التي تكون لها معها عند الأوتاد والمجاورة، ولا سيما مع الشمس. {cite:zij-sabi-nallino-byblion p.200}"
  en: "The wandering planets do not join the fixed stars in aspect because the fixed stars move so slowly, and aspects are not counted from the rays of a star falling on the ecliptic when the star lies at the same distance from it. The forms are looked at instead at the angles and in proximity, especially with the Sun. {cite:zij-sabi-nallino-byblion p.200}"
  ur: "متحیر سیارے ثابت ستاروں سے اتصال نہیں کرتے کیونکہ ثوابت کی حرکت بہت سست ہے، اور اتصال اس وقت شمار نہیں ہوتا جب ستارے کی شعاع دائرۂ البروج پر پڑے اور ستارہ دائرے سے ایک ہی فاصلے پر ہو۔ اس کے بجائے اوتاد پر اور قربت میں بننے والی شکلیں دیکھی جاتی ہیں، خاص کر سورج کے ساتھ۔ {cite:zij-sabi-nallino-byblion p.200}"
