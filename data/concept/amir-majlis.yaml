id: concept/amir-majlis
class: concept
kind: term
label:
  ar: "أمير مجلس ⁦(رتبة مملوكية وسلجوقية)⁩"
  en: "Amir majlis (master of audiences; Seljuk and Mamluk dignitary)"
  fr: "Amir majlis (maître des audiences ; dignitaire seldjoukide et mamelouk)"
  es: "Amir majlis (maestro de audiencias; dignatario selyúcida y mameluco)"
summary:
  ar: "أمير مجلس، أي متولي المجالس أو المراسم، من كبار رجال السلاجقة في الأناضول، وفي المملكة المملوكية كان مسؤولًا عن الأطباء وأطباء العيون ونحوهم، وفي العصر الجركسي كان ثالث أكبر الأمراء {cite:encyclopaedia-of-islam-2 vol. 1 p. 467}."
  en: "Amir majlis, 'master of audiences or ceremonies', was one of the highest dignitaries of the Seljuks of Asia Minor. In the Mamluk kingdom he had charge of the physicians and oculists; in the Circassian period he was third in importance among the highest amirs {cite:encyclopaedia-of-islam-2 vol. 1 p. 467}."
  fr: "Amir majlis, « maître des audiences ou des cérémonies », était l’un des plus hauts dignitaires des Seldjoukides d’Asie Mineure. Dans le royaume mamelouk, il avait la charge des médecins et des oculistes ; à la période circassienne, il était le troisième en importance parmi les plus hauts amirs {cite:encyclopaedia-of-islam-2 vol. 1 p. 467}."
  es: "Amir majlis, «maestro de audiencias o ceremonias», era uno de los más altos dignatarios de los selyúcidas de Asia Menor. En el reino mameluco estaba a cargo de los médicos y oculistas; en el período circasiano ocupaba el tercer lugar en importancia entre los más altos emires {cite:encyclopaedia-of-islam-2 vol. 1 p. 467}."
