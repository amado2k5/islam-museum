  en: "Amir majlis (master of audiences; Seljuk and Mamluk dignitary)"
summary:
  ar: "أمير مجلس، أي متولي المجالس أو المراسم، من كبار رجال السلاجقة في الأناضول، وفي المملكة المملوكية كان مسؤولًا عن الأطباء وأطباء العيون ونحوهم، وفي العصر الجركسي كان ثالث أكبر الأمراء {cite:encyclopaedia-of-islam-2 vol. 1 p. 467}."
  en: "Amir majlis, 'master of audiences or ceremonies', was one of the highest dignitaries of the Seljuks of Asia Minor. In the Mamluk kingdom he had charge of the physicians and oculists; in the Circassian period he was third in importance among the highest amirs {cite:encyclopaedia-of-islam-2 vol. 1 p. 467}."
