id: concept/ilaj-al-suda-al-yabis
class: concept
kind: scientific
label:
  ar: "علاج الصداع اليابس"
  en: "Treatment of dry headache"
  ur: "خشک صداع کا علاج"
  es: "Tratamiento de la cefalea seca"
summary:
  ar: "يبيّن ابن سينا أن الصداع اليابس مع مادة صفراوية أو دموية مرّ الكلام فيه، وأن اليابس بلا مادة يبدأ علاجه بتدبير الكيموس والتغذية، ويذكر أن اليبس قد ينقص جوهر الدماغ {cite:canon-ibn-sina-print-v2 pp.61-62}"
  en: "Ibn Sina says that dry headache with a bilious or bloody matter has already been treated, and that the dry one without matter begins its treatment with managing the chyme and feeding, and he notes that dryness may diminish the substance of the brain {cite:canon-ibn-sina-print-v2 pp.61-62}"
  ur: "ابن سینا بتاتا ہے کہ مادے کے ساتھ صفراوی یا دموی خشک صداع کا بیان گزر چکا، اور مادے کے بغیر خشک کا علاج کیموس کی تدبیر اور غذا سے شروع ہوتا ہے، اور بتاتا ہے کہ خشکی دماغ کے جوہر کو گھٹا سکتی ہے {cite:canon-ibn-sina-print-v2 pp.61-62}۔"
  es: "Ibn Sina afirma que el dolor de cabeza seco con presencia de bilis o sangre ya ha sido tratado, y que el seco sin materia comienza su tratamiento con el manejo del quimo y la alimentación, y señala que la sequedad puede disminuir la sustancia del cerebro {cite:canon-ibn-sina-print-v2 pp.61-62}"
