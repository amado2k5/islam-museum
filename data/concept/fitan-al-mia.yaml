label: { ar: "فتن المئات", en: "Century calamities (fitan al-mi'at)", es: "Calamidades del siglo (fitan al-mi'at)", fr: "calamités du siècle (fitan al-mi'at)", ur: "صدی کی آفات ⁦(فتن المیت)⁩", tr: "Yüzlerce isyan", id: "Hasutan ratusan orang" }
summary:
  ar: "قاعدة تاريخية أوردها السيوطي في ختام تاريخ الخلفاء عن عبد الله بن عمرو بن العاص ما كان منذ كانت الدنيا رأس مئة سنة إلا كان عند رأس المئة أمر، فعدد السيوطي عند رأس المئة الأولى فتنة الحجاج وفي الثانية فتنة المأمون وحروبه مع أخيه ثم امتحانه الناس بخلق القرآن وهي أعظم الفتن في هذه الأمة وأولها بالنسبة إلى الدعاء إلى البدعة وفي الثالثة خروج القرمطي وفتنة المقتدر لما خلع وذبح القاضي وخلقاً من العلماء وفتنة تفرق الكلمة ومن جملة ذلك ابتداء الدولة العبيدية وفي الرابعة فتنة الحاكم بأمر الله وفي الخامسة أخذ الفرنج الشام وبيت المقدس وفي السادسة الغلاء الذي لم يسمع بمثله وابتداء أمر التتار وفي السابعة فتنة التتار العظمى التي أسالت من دماء أهل الإسلام بحاراً وفي الثامنة فتنة تمرلنك التي استصغرت بالنسبة إليها فتنة التتار على عظمها وسأل الله أن يقبضه قبل وقوع فتنة المئة التاسعة، وقال تلميذه جرامرد الناصري الحنفي لا شك ولا ارتياب أن فتنة المئة التاسعة هي فتنة ابن عثمان سليم شاه وحروبه مع إخوته وقتله إياهم ثم حروبه صاحب الشرق ثم اجتماعه بعسكر مصر على مرج دابق وقتله سلطانها ثم دخوله مصر وفعله فيها ما فعل وأن الله أجاب دعاء الشيخ فقبضه قبل وقوعها {cite:tarikh-khulafa-minhaj-1434 p. 796-799}."
  en: "The 'century calamity' pattern al-Suyuti sets at his book's close, from Abd Allah ibn Amr's saying that each century's head brings an affair: the first, al-Hajjaj's strife; the second, al-Ma'mun's civil war and the mihna — 'the greatest of this umma's trials'; the third, the Qarmati, al-Muqtadir's deposition-day slaughter and the Ubaydi state's dawn; the fourth, al-Hakim's strife; the fifth, the Franks' taking of Syria and Jerusalem; the sixth, the unprecedented famine and the Tatars' beginning; the seventh, the great Tatar calamity 'that poured seas of Muslim blood'; the eighth, Timur's, which dwarfed it. His prayer to be taken before the ninth was answered, his student Jaramard writes — for that fitna was Selim Shah's conquest of Egypt {cite:tarikh-khulafa-minhaj-1434 p. 796-799}."
  es: "El patrón de la \"calamidad del siglo\" que al-Suyuti establece al final de su libro, a partir de la afirmación de Abd Allah ibn Amr de que el inicio de cada siglo trae consigo un acontecimiento: el primero, la contienda de al-Hajjaj; el segundo, la guerra civil de al-Ma'mun y la mihna —'la mayor de las pruebas de esta umma'; el tercero, los Qarmati, la matanza del día de la deposición de al-Muqtadir y el amanecer del estado Ubaydi; el cuarto, la contienda de al-Hakim; el quinto, la toma de Siria y Jerusalén por los francos; el sexto, la hambruna sin precedentes y el comienzo de los tártaros; el séptimo, la gran calamidad tártara 'que derramó mares de sangre musulmana'; el octavo, la de Timur, que la empequeñeció. Su plegaria de ser llevado antes del noveno día fue respondida, escribe su alumno Jaramard, pues esa fitna fue la conquista de Egipto por Selim Shah {cite:tarikh-khulafa-minhaj-1434 p. 796-799}."
  fr: "Le schéma des « calamités séculaires » qu'al-Suyuti établit à la fin de son livre s'appuie sur la parole d'Abd Allah ibn Amr selon laquelle chaque siècle est marqué par un événement: le premier, la lutte d'al-Hajjaj; le deuxième, la guerre civile d'al-Ma'mun et la mihna — « la plus grande des épreuves de cette umma »; le troisième, les Qarmates, le massacre du jour de la déposition d'al-Muqtadir et l'aube de l'État Ubaydite; le quatrième, la lutte d'al-Hakim; le cinquième, la prise de la Syrie et de Jérusalem par les Francs; le sixième, la famine sans précédent et le début de l'empire tatar; le septième, la grande calamité tatare « qui a déversé des mers de sang musulman »; le huitième, celle de Timour, qui l'a éclipsée. Sa prière d'être emmené avant la neuvième fut exaucée, écrit son élève Jaramard — car cette fitna était la conquête de l'Égypte par Selim Shah {cite:tarikh-khulafa-minhaj-1434 p. 796-799}."
  ur: "'صدی کی آفت' کا نمونہ السیوطی نے اپنی کتاب کے اختتام پر عبد اللہ بن عمرو کے اس قول سے بیان کیا ہے کہ ہر صدی کا سر ایک معاملہ لاتا ہے: پہلا، الحجاج کا جھگڑا؛ دوسرا، المامون کی خانہ جنگی اور مہنا - 'اس امت کی سب سے بڑی آزمائش'؛ تیسرا، قرامطی، المقتدیر کی معزولی کا دن اور عبیدی ریاست کا طلوع فجر؛ چوتھا، الحکیم کا جھگڑا؛ پانچویں، فرینک کا شام اور یروشلم پر قبضہ۔ چھٹا، بے مثال قحط اور تاتاریوں کا آغاز؛ ساتویں، عظیم تاتاری آفت جس نے مسلمانوں کے خون کے سمندر بہائے۔ آٹھواں، تیمور کا، جس نے اسے بونا کر دیا۔ نویں سے قبل اس کی دعا قبول کی جانی تھی، اس کا طالب علم جرارد لکھتا ہے- اس کے لیے فتنہ سلیم شاہ کا مصر کی فتح تھا۔ 796-799}۔"
  tr: "El-Suyuti'nin Abdullah ibn Amr ibn al-As'tan halifelerin tarihi kitabının sonunda bahsettiği tarihsel bir ilke, dünya yüz yılın başında olduğunda, yüz işin başında olduğudur. El-Suyuti, ilk yüzün başında el-Hacac'ın yargılanışını, ikincisinde el-Memun'un yargılanması ve kardeşiyle yaptığı savaşları, ardından bu ülkedeki en büyük sınavı olan Kur'an'ın yaratılması sınavı, ilki yenilik çağrısıyla ilgili, üçüncüsü ise Karmati ve el-Muqtadir'in yargılanması, yargı ve bir grup alimi ve bir sıkıntıyı saymıştır Söz ikiye ayrılmıştır; dördüncüde El-Hakim bi-Amr Allah'ın isyanı; beşincisinde Franklar Levant ve Kudüs'ü ele geçirdi; altıncısında duyulmamış enflasyon ve Tatar olayının başlangıcı; yedincisinde deniz yoluyla İslam halkının kanını döken büyük Tatar isyanı; ve sekizinci yüzyılda Tatar isyanını küçümseden Tamerlanek isyanı. Dokuzuncu yüzyıldaki isyandan önce Tanrı'dan onu yakalamasını istedi. Öğrencisi Ceramard el-Nasiri el-Hanafi şöyle dedi: \"İsyanın hiçbir şüphesi ya da kesintisi yoktur Dokuzuncu yüzyıl, İbn Osman Selim Şah'ın kardeşleriyle yaptığı savaşlar, onları öldürmesi, sonra Doğu Sahibi ile savaşları, ardından Mısır ordusuyla Marj Dabiq'te karşılaşması ve sultanını öldürmesi, ardından Mısır'a girip yaptığı şeyi yapması, Tanrı Şeyh'in duasına cevap verip onu yakalaması (cite:Tarikh-khulafa-minhaj-1434 s. 796-799}."
  id: "Prinsip sejarah yang disebutkan oleh Al-Suyuti dalam kesimpulan sejarah khalifah dari Abdullah ibn Amr ibn al-Adalah bahwa setiap kali dunia memimpin seratus tahun, maka ada seratus perkara di pucuk hati. Al-Suyuti menghitung di puncak seratus tahun pertama persidangan al-Hajjaj, yang kedua adalah pengadilan al-Ma'mun dan perangnya dengan saudaranya, kemudian ujian dengan penciptaan Al-Qur'an, yang merupakan ujian terbesar di negara ini, yang pertama mengenai seruan untuk inovasi, dan yang ketiga adalah munculnya Qarmati dan pengadilan al-Muqtadir ketika ia menggulingkan dan membantai hakim, serta sekelompok ulama dan tribulasi Kata terbagi, termasuk awal negara Ubayid; pada abad keempat, pemberontakan Al-Hakim bi-Amr Allah; pada abad kelima, bangsa Franka merebut Levant dan Yerusalem; pada abad keenam, inflasi yang belum pernah terjadi dan awal peristiwa Tatar; pada abad ketujuh terdapat pemberontakan besar Tatar, yang menumpahkan darah umat Islam melalui laut; dan pada abad kedelapan, pemberontakan Tamerlanek, yang sangat meremehkan hasutan Tatar. Ia memohon kepada Tuhan agar menangkapnya sebelum pemberontakan abad kesembilan. Muridnya Jaramard al-Nasiri al-Hanafi berkata, \"Tidak ada keraguan atau kecurigaan bahwa hasutan itu Abad kesembilan adalah kekacauan Ibn Osman Selim Shah, perangnya dengan saudara-saudaranya, pembunuhan mereka, kemudian perangnya dengan Pemilik Timur, kemudian pertemuannya dengan tentara Mesir di Marj Dabiq dan membunuh sultannya, kemudian masuk ke Mesir dan melakukan apa yang dilakukannya, dan Tuhan menjawab doa Sheikh dan menangkapnya sebelum itu terjadi {cite:Tarikh-khulafa-minhaj-1434 hlm. 796-799}."
