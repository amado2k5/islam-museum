id: concept/fitan-al-mia
class: concept
kind: doctrine
label: { ar: "فتن المئات" }
summary:
  ar: "قاعدة تاريخية أوردها السيوطي في ختام تاريخ الخلفاء عن عبد الله بن عمرو بن العاص ما كان منذ كانت الدنيا رأس مئة سنة إلا كان عند رأس المئة أمر، فعدد السيوطي عند رأس المئة الأولى فتنة الحجاج وفي الثانية فتنة المأمون وحروبه مع أخيه ثم امتحانه الناس بخلق القرآن وهي أعظم الفتن في هذه الأمة وأولها بالنسبة إلى الدعاء إلى البدعة وفي الثالثة خروج القرمطي وفتنة المقتدر لما خلع وذبح القاضي وخلقاً من العلماء وفتنة تفرق الكلمة ومن جملة ذلك ابتداء الدولة العبيدية وفي الرابعة فتنة الحاكم بأمر الله وفي الخامسة أخذ الفرنج الشام وبيت المقدس وفي السادسة الغلاء الذي لم يسمع بمثله وابتداء أمر التتار وفي السابعة فتنة التتار العظمى التي أسالت من دماء أهل الإسلام بحاراً وفي الثامنة فتنة تمرلنك التي استصغرت بالنسبة إليها فتنة التتار على عظمها وسأل الله أن يقبضه قبل وقوع فتنة المئة التاسعة، وقال تلميذه جرامرد الناصري الحنفي لا شك ولا ارتياب أن فتنة المئة التاسعة هي فتنة ابن عثمان سليم شاه وحروبه مع إخوته وقتله إياهم ثم حروبه صاحب الشرق ثم اجتماعه بعسكر مصر على مرج دابق وقتله سلطانها ثم دخوله مصر وفعله فيها ما فعل وأن الله أجاب دعاء الشيخ فقبضه قبل وقوعها {cite:tarikh-khulafa-minhaj-1434 p. 796-799}."
  en: "The 'century calamity' pattern al-Suyuti sets at his book's close, from Abd Allah ibn Amr's saying that each century's head brings an affair: the first, al-Hajjaj's strife; the second, al-Ma'mun's civil war and the mihna — 'the greatest of this umma's trials'; the third, the Qarmati, al-Muqtadir's deposition-day slaughter and the Ubaydi state's dawn; the fourth, al-Hakim's strife; the fifth, the Franks' taking of Syria and Jerusalem; the sixth, the unprecedented famine and the Tatars' beginning; the seventh, the great Tatar calamity 'that poured seas of Muslim blood'; the eighth, Timur's, which dwarfed it. His prayer to be taken before the ninth was answered, his student Jaramard writes — for that fitna was Selim Shah's conquest of Egypt {cite:tarikh-khulafa-minhaj-1434 p. 796-799}."
