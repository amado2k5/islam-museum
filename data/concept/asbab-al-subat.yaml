id: concept/asbab-al-subat
class: concept
kind: scientific
label:
  ar: "أسباب السبات"
  en: "The causes of coma"
  fr: "Les causes du coma"
  ur: "غنودگی کے اسباب"
summary:
  ar: "يعدّد ابن سينا أسباب السبات: البرد والرطوبة، واشتداد نوائب الحمى، ورداءة الأخلاط والبخارات المتصاعدة إلى مقدم الدماغ، والديدان، وانضغاط الدماغ بالضربة، وشدة الوجع، وضعف الروح وتحلله، ويستدل منها على أن الآفة في مقدّم الدماغ؛ وفيه سطر موسوم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v2 p.90} {cite:canon-ibn-sina-print-v2 p.91}"
  en: "Ibn Sina lists the causes of coma: cold and moisture, the intensifying of the fits of fever, badness of humours and vapours rising to the front of the brain, worms, pressure on the brain from a blow, severe pain, and weakness and dissolving of the pneuma, and reasons from them that the disorder is in the front of the brain; the record has a labelled line in a section held for the founder's ruling {cite:canon-ibn-sina-print-v2 p.90} {cite:canon-ibn-sina-print-v2 p.91}"
  fr: "Ibn Sina énumère les causes du coma : froid et humidité, intensification des accès de fièvre, mauvaise qualité des humeurs et des vapeurs montant à l’avant du cerveau, vers, pression sur le cerveau due à un coup, douleur intense, affaiblissement et dissolution du pneuma ; il en déduit que le trouble siège à l’avant du cerveau ; la notice contient une ligne signalée dans une section en attente de la décision du fondateur {cite:canon-ibn-sina-print-v2 p.90} {cite:canon-ibn-sina-print-v2 p.91}"
  ur: "ابن سینا غنودگی کے اسباب گنواتا ہے: سردی اور رطوبت، بخار کے دوروں کا تیز ہونا، اخلاط کی خرابی اور دماغ کے اگلے حصے کی طرف چڑھنے والے بخارات، کیڑے، ضرب سے دماغ کا دبنا، سخت درد، اور روح کی کمزوری اور تحلیل، اور ان سے استدلال کرتا ہے کہ خرابی دماغ کے اگلے حصے میں ہے؛ اس میں ایک موسوم سطر بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v2 p.90} {cite:canon-ibn-sina-print-v2 p.91}۔"
