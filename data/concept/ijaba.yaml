id: concept/ijaba
class: concept
kind: legal
label: { ar: "إجابة", en: "Response, answer (ijaba)" }
summary:
  ar: "الإجابة في اللغة رجع الكلام، وهي والاستجابة بمعنى واحد، ولا تسمى جواباً إلا بعد طلب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1524} وقد تكون الإجابة بالفعل كإجابة الدعوة إلى الوليمة، وبالقول، وبالإشارة المفهومة، وقد يُعد السكوت إجابة كسكوت البكر عند استئذانها في النكاح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1524} وحكم الإجابة بحسب المطلوب: واجبة في دعوة الإسلام وفي الاستغاثة وأمام القاضي، ومستحبة كإجابة المؤذن، ومحرمة في المعصية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1525} وفي العقود تسمى الإجابة قبولاً، وهي ما يقابل الإيجاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1525}"
  en: "In the lexicon, ijaba means the return of speech; it is the same as istijaba. It is called a reply only after a request. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1524} A reply may be given by act, such as accepting an invitation to a wedding feast, by speech, by an understood gesture, or by silence, as the silence of a virgin when asked for consent to marriage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1524} Its ruling depends on what is asked: it is obligatory in answering the call to Islam, a cry for help and a summons before a judge; recommended, as in answering the call to prayer by repeating it; and forbidden when the call is to sin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1525} In contracts the reply is called acceptance (qabul), the answer to an offer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1525}"
