label: { ar: "إجابة", en: "Response, answer (ijaba)", es: "Respuesta, contestación (ijaba)", fr: "Réponse, réplique (ijaba)" }
summary:
  ar: "الإجابة في اللغة رجع الكلام، وهي والاستجابة بمعنى واحد، ولا تسمى جواباً إلا بعد طلب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1524} وقد تكون الإجابة بالفعل كإجابة الدعوة إلى الوليمة، وبالقول، وبالإشارة المفهومة، وقد يُعد السكوت إجابة كسكوت البكر عند استئذانها في النكاح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1524} وحكم الإجابة بحسب المطلوب: واجبة في دعوة الإسلام وفي الاستغاثة وأمام القاضي، ومستحبة كإجابة المؤذن، ومحرمة في المعصية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1525} وفي العقود تسمى الإجابة قبولاً، وهي ما يقابل الإيجاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1525}"
  en: "In the lexicon, ijaba means the return of speech; it is the same as istijaba. It is called a reply only after a request. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1524} A reply may be given by act, such as accepting an invitation to a wedding feast, by speech, by an understood gesture, or by silence, as the silence of a virgin when asked for consent to marriage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1524} Its ruling depends on what is asked: it is obligatory in answering the call to Islam, a cry for help and a summons before a judge; recommended, as in answering the call to prayer by repeating it; and forbidden when the call is to sin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1525} In contracts the reply is called acceptance (qabul), the answer to an offer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1525}"
  es: "En el léxico, ijaba significa la respuesta del habla; es lo mismo que istijaba. Se llama respuesta solo después de una solicitud. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1524} Una respuesta puede darse mediante un acto, como aceptar una invitación a un banquete de bodas, mediante el habla, mediante un gesto entendido o mediante el silencio, como el silencio de una virgen cuando se le pide su consentimiento para el matrimonio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1524} Su regla depende de lo que se pide: es obligatorio al responder al llamado al Islam, un grito de auxilio y una citación ante un juez; recomendado, como al responder al llamado a la oración repitiéndolo; y prohibido cuando el llamado es al pecado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1525} En los contratos la respuesta se llama aceptación (qabul), la respuesta a una oferta. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1525}"
  fr: "Dans le lexique, ijaba signifie la réponse à une demande; c'est la même chose qu'istijaba. On parle de réponse uniquement après une demande. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1524} Une réponse peut être donnée par un acte, comme accepter une invitation à un festin de mariage, par la parole, par un geste compris, ou par le silence, comme le silence d'une vierge lorsqu'on lui demande son consentement au mariage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1524} Son statut dépend de la nature de la demande: elle est obligatoire pour répondre à l'appel à l'islam, à un appel au secours et à une convocation devant un juge; recommandée, comme lorsqu'on répond à l'appel à la prière en le répétant; et interdite lorsque l'appel incite au péché. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1525} Dans le cadre des contrats, la réponse est appelée acceptation (qabul), la réponse à une offre. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.1525}"
