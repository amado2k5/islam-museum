label:
  ar: الإسلام (الدين)
  en: Islam (the religion and the term)
summary:
  ar: 'اسم الدين الذي جاء به النبي محمد، ومعناه في حديث جبريل: أن يعبد الإنسان الله ولا يشرك به شيئاً، ويقيم الصلاة، ويؤتي الزكاة المفروضة، ويصوم رمضان؛ ويُعرَّف أيضاً بأنه بناء قائم على خمس دعائم، كما في حديث ابن عمر «بُني الإسلام على خمس» {cite:sahih-ibn-khuzayma p.192}.'
  en: The name of the religion the Prophet Muhammad taught; in Gabriel's hadith its meaning is to worship God without associating anything with Him, to establish prayer, pay the obligatory alms and fast Ramadan; it is also described as a structure built on five pillars {cite:sahih-ibn-khuzayma p.192}.
