id: concept/islam-din
class: concept
kind: doctrine
label:
  ar: الإسلام ⁦(الدين)⁩
  en: Islam (the religion and the term)
  es: "Islam (la religión y el término)"
  fr: "L'islam (la religion et le terme)"
  ur: "اسلام ⁦(مذہب اور اصطلاح)⁩"
summary:
  ar: 'اسم الدين الذي جاء به النبي محمد، ومعناه في حديث جبريل: أن يعبد الإنسان الله ولا يشرك به شيئاً، ويقيم الصلاة، ويؤتي الزكاة المفروضة، ويصوم رمضان؛ ويُعرَّف أيضاً بأنه بناء قائم على خمس دعائم، كما في حديث ابن عمر «بُني الإسلام على خمس» {cite:sahih-ibn-khuzayma p.192}.'
  en: The name of the religion the Prophet Muhammad taught; in Gabriel's hadith its meaning is to worship God without associating anything with Him, to establish prayer, pay the obligatory alms and fast Ramadan; it is also described as a structure built on five pillars {cite:sahih-ibn-khuzayma p.192}.
  es: "El nombre de la religión que enseñó el Profeta Mahoma; en el hadiz de Gabriel su significado es adorar a Dios sin asociarle nada, establecer la oración, pagar la limosna obligatoria y ayunar el Ramadán; también se describe como una estructura construida sobre cinco pilares {cite:sahih-ibn-khuzayma p.192}."
  fr: "Le nom de la religion enseignée par le Prophète Muhammad; dans le hadith de Gabriel, sa signification est d'adorer Dieu sans rien Lui associer, d'accomplir la prière, de payer l'aumône obligatoire et de jeûner le Ramadan; elle est également décrite comme une structure construite sur cinq piliers {cite: sahih-ibn-khuzayma p.192}."
  ur: "دین کا نام جس کی تعلیم نبی نے دی تھی۔ جبرائیل کی حدیث میں اس کا مفہوم ہے کہ خدا کی عبادت اس کے ساتھ کسی کو شریک نہ کیا جائے، نماز قائم کرنا، فرض زکوٰۃ ادا کرنا اور رمضان کے روزے رکھنا۔ اسے پانچ ستونوں پر تعمیر کردہ ڈھانچہ کے طور پر بھی بیان کیا گیا ہے {حوالہ: صحیح ابن خزیمہ صفحہ 192}"
