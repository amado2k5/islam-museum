  generated_by: "Claude Haiku 5.5; batch 11. Gabriel's hadith is witnessed in the local Ibn Khuzayma scan (p. 1070: the question on Islam and the five-part answer, with the Abu Hurayra narration); the al-Bugha edition's note (p. 36) gives the Gabriel-in-human-form gloss, the Hour question, and Bukhari's own sentence 'he made all of that part of faith'. The earlier record said Bukhari counted all of it as religion, and quoted a chapter heading 'Gabriel came to teach you your religion' that the scan does not show: both are corrected to 'part of faith' (p. 36). The Najdi-man hadith is re-cited as the Bedouin's hadith in Ibn Khuzayma (pp. 190, 529, 996); the commentary on Dimam ibn Tha'laba and the Muslim 16 citation are removed, not witnessed. The Sha'rawi paragraph (pp. 593-594 of the scan) is witnessed for the face and the surrender of leadership. Completeness 3."
