id: concept/makki-wa-madani
class: concept
kind: term
label:
  ar: "المكي والمدني من القرآن"
  en: "Meccan and Medinan (makki wa-madani) classification of the Quran"
  ur: "مکی و مدنی سورتیں"
summary:
  ar: "تصنيف السور إلى مكية ومدنية. يعرض الشعراوي معيارين: الزمان، فكل ما نزل بعد الهجرة مدني ولو في مكة، والمكان، فما نزل بمكة مكي وما نزل بالمدينة مدني. ويرى أن العلماء لم يختلفوا في السور نفسها بل اختلفوا في زاوية النظر. ويذكر أن السور المكية تركز على العقيدة والآخرة، وأن المدنية تتناول الأحكام والمجتمع والمنافقين، وأن النفاق لم يظهر بمكة لأن المضطهد لا يُنافق {cite:tafsir-sharawi-khawatir-scan p.98} {cite:tafsir-sharawi-khawatir-scan p.99} {cite:tafsir-sharawi-khawatir-scan p.100}. هذا تفسيره ويُنسب إليه."
  en: "The classification of surahs as Meccan or Medinan. Sha'rawi presents two criteria: time, so that whatever was revealed after the hijra is Medinan even if in Mecca; and place, so that what was revealed in Mecca is Meccan and what in Medina is Medinan. He holds that scholars did not disagree about the surahs themselves, only about the angle of view. He says Meccan surahs focus on creed and the Hereafter, Medinan ones on rulings, society and the hypocrites, and that hypocrisy did not appear in Mecca because the persecuted cannot pretend {cite:tafsir-sharawi-khawatir-scan p.98} {cite:tafsir-sharawi-khawatir-scan p.99} {cite:tafsir-sharawi-khawatir-scan p.100}. This is Sha'rawi's reading and is attributed to him."
  ur: "سورتوں کی مکی اور مدنی تقسیم۔ شعراوی دو معیار پیش کرتے ہیں: زمان، یعنی ہجرت کے بعد نازل ہونے والی ہر چیز مدنی ہے خواہ مکہ میں ہو، اور مکان، یعنی مکہ میں نازل ہونے والی مکی اور مدینہ میں نازل ہونے والی مدنی۔ ان کے نزدیک علماء سورتوں کے بارے میں نہیں بلکہ زاویۂ نظر میں مختلف تھے۔ وہ کہتے ہیں کہ مکی سورتیں عقیدے اور آخرت پر زور دیتی ہیں اور مدنی احکام، معاشرے اور منافقین پر، اور نفاق مکہ میں اس لیے ظاہر نہیں ہوا کہ ستایا ہوا شخص منافقت نہیں کرتا {cite:tafsir-sharawi-khawatir-scan p.98} {cite:tafsir-sharawi-khawatir-scan p.99} {cite:tafsir-sharawi-khawatir-scan p.100}۔ یہ شعراوی کی تفسیر ہے اور ان کی طرف منسوب ہے۔"
