issue:
  ar: "بأي معيار تُصنَّف السور مكية أو مدنية، وما الذي يميز كل صنف؟"
  en: "By what criterion are surahs classed as Meccan or Medinan, and what marks each class?"
  ur: "سورتوں کو مکی یا مدنی کس معیار سے تقسیم کیا جاتا ہے، اور ہر قسم کی کیا پہچان ہے؟"
perspectives:
  - tradition: sunni
    id: sharawi-makki-madani
    stance:
      ar: "معياران، لا خلاف في السور نفسها"
      en: "Two criteria, no disagreement about the surahs themselves"
      ur: "دو معیار، خود سورتوں میں اختلاف نہیں"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يذكر الشعراوي أن من اعتمد الزمان قال بمدنية كل ما نزل بعد الهجرة، ومن اعتمد المكان قال بالمكي والمدني بحسب موضع النزول، وأن الاختلاف في زاوية النظر لا في آيات السور {cite:tafsir-sharawi-khawatir-scan p.98} {cite:tafsir-sharawi-khawatir-scan p.99}."
      en: "Sha'rawi says those who took time as the measure called everything revealed after the hijra Medinan, and those who took place as the measure classed by where it came down; the disagreement is about the angle, not the verses {cite:tafsir-sharawi-khawatir-scan p.98} {cite:tafsir-sharawi-khawatir-scan p.99}."
      ur: "شعراوی کے مطابق جنہوں نے زمان کو معیار بنایا انہوں نے ہجرت کے بعد نازل ہونے والی ہر چیز کو مدنی کہا، اور جنہوں نے مکان کو معیار بنایا انہوں نے نزول کی جگہ سے تقسیم کی؛ اختلاف زاویۂ نظر کا ہے، آیات کا نہیں {cite:tafsir-sharawi-khawatir-scan p.98} {cite:tafsir-sharawi-khawatir-scan p.99}۔"
