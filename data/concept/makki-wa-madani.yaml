id: concept/makki-wa-madani
class: concept
kind: term
label:
  ar: "المكي والمدني من القرآن"
  en: "Meccan and Medinan (makki wa-madani) classification of the Quran"
  ur: "مکی و مدنی سورتیں"
  es: "Clasificación del Corán según La Meca y Medina (makki wa-madani)"
  fr: "Classification mecquoise et médinoise (makki wa-madani) du Coran"
summary:
  ar: "تصنيف السور إلى مكية ومدنية. يعرض الشعراوي معيارين: الزمان، فكل ما نزل بعد الهجرة مدني ولو في مكة، والمكان، فما نزل بمكة مكي وما نزل بالمدينة مدني. ويرى أن العلماء لم يختلفوا في السور نفسها بل اختلفوا في زاوية النظر. ويذكر أن السور المكية تركز على العقيدة والآخرة، وأن المدنية تتناول الأحكام والمجتمع والمنافقين، وأن النفاق لم يظهر بمكة لأن المضطهد لا يُنافق {cite:tafsir-sharawi-khawatir-scan p.98} {cite:tafsir-sharawi-khawatir-scan p.99} {cite:tafsir-sharawi-khawatir-scan p.100}. هذا تفسيره ويُنسب إليه. ويبحث الشاطبي في كتاب الأدلة أن كل دليل شرعي ثبت مطلقاً غير مقيد وجعل له قانون رجع إلى معنى معقول وُكل إلى نظر المكلف، وأكثر ما يوجد ذلك في الأمور العادية كالعدل والإحسان والصبر، وكل دليل ثبت مقيداً جعل له قانون رجع إلى معنى تعبدي لا يهتدي إليه نظر المكلف، وأكثره في الأصول المدنية لأنها في الغالب تقييدات لما تقدم إطلاقه أو أحكام على أسباب جزئية. {cite:muwafaqat p.493-494} ويقرر أن الأصل الكلي إذا وجد في المدنيات فهو إما جزئي بالنسبة إلى ما هو أعم منه وإما تكميلي لأصل كلي، ويستعرض الأصول الكلية الخمسة — الدين والنفس والعقل والنسل والمال — فيبين أن حفظ الدين أول ما نزل بمكة، وأن حفظ العقل ورد مفصلاً في المدينة ومجملًا في المكية داخل حفظ النفس، وأن تحريم الزنى ونقص المكيال والميزان ورد في المكية. {cite:muwafaqat p.494-495}"
  en: "The classification of surahs as Meccan or Medinan. Sha'rawi presents two criteria: time, so that whatever was revealed after the hijra is Medinan even if in Mecca; and place, so that what was revealed in Mecca is Meccan and what in Medina is Medinan. He holds that scholars did not disagree about the surahs themselves, only about the angle of view. He says Meccan surahs focus on creed and the Hereafter, Medinan ones on rulings, society and the hypocrites, and that hypocrisy did not appear in Mecca because the persecuted cannot pretend {cite:tafsir-sharawi-khawatir-scan p.98} {cite:tafsir-sharawi-khawatir-scan p.99} {cite:tafsir-sharawi-khawatir-scan p.100}. This is Sha'rawi's reading and is attributed to him. In the Book of Proofs al-Shatibi argues that every legal proof established absolutely, without a fixed law or measure, refers to a rational meaning entrusted to the jurist's judgment — mostly found in ordinary matters such as justice, excellence, patience — while every proof established restricted, with a fixed law, refers to a devotional meaning no human insight can reach, mostly found in the civil usuli matters because they mostly qualify earlier absolutes or legislate on partial causes. {cite:muwafaqat p.493-494} He holds that a universal principle found among the Medinan texts is either partial relative to what is broader or complementary to a universal principle, and surveys the five universal principles — religion, life, reason, progeny and property — showing that preserving religion was the first thing revealed in Mecca, that preserving reason came detailed in Medina but in general in the Meccan texts inside the preservation of life, and that prohibiting fornication and deficient measure were revealed in Mecca. {cite:muwafaqat p.494-495}"
  ur: "سورتوں کی مکی اور مدنی تقسیم۔ شعراوی دو معیار پیش کرتے ہیں: زمان، یعنی ہجرت کے بعد نازل ہونے والی ہر چیز مدنی ہے خواہ مکہ میں ہو، اور مکان، یعنی مکہ میں نازل ہونے والی مکی اور مدینہ میں نازل ہونے والی مدنی۔ ان کے نزدیک علماء سورتوں کے بارے میں نہیں بلکہ زاویۂ نظر میں مختلف تھے۔ وہ کہتے ہیں کہ مکی سورتیں عقیدے اور آخرت پر زور دیتی ہیں اور مدنی احکام، معاشرے اور منافقین پر، اور نفاق مکہ میں اس لیے ظاہر نہیں ہوا کہ ستایا ہوا شخص منافقت نہیں کرتا {cite:tafsir-sharawi-khawatir-scan p.98} {cite:tafsir-sharawi-khawatir-scan p.99} {cite:tafsir-sharawi-khawatir-scan p.100}۔ یہ شعراوی کی تفسیر ہے اور ان کی طرف منسوب ہے۔"
  es: "La clasificación de las suras como mecanas o medinenses. Sha'rawi presenta dos criterios: el tiempo, de modo que todo lo revelado después de la Hégira es medinense, incluso si fue en La Meca; y el lugar, de modo que lo revelado en La Meca es mecana y lo revelado en Medina es medinense. Sostiene que los eruditos no discreparon sobre las suras en sí, sino solo sobre el punto de vista. Dice que las suras mecanas se centran en el credo y la otra vida, las medinenses en las normas, la sociedad y los hipócritas, y que la hipocresía no apareció en La Meca porque los perseguidos no pueden fingir {cite:tafsir-sharawi-khawatir-scan p.98} {cite:tafsir-sharawi-khawatir-scan p.99} {cite:tafsir-sharawi-khawatir-scan p.100}. Esta es la lectura de Sha'rawi y se le atribuye. En el Libro de las Pruebas, al-Shatibi argumenta que toda prueba legal establecida de forma absoluta, sin una ley o medida fija, se refiere a un significado racional confiado al juicio del jurista —que se encuentra principalmente en asuntos ordinarios como la justicia, la excelencia y la paciencia—, mientras que toda prueba establecida de forma restringida, con una ley fija, se refiere a un significado devocional al que ningún entendimiento humano puede llegar, que se encuentra principalmente en los asuntos civiles de usuli, ya que estos suelen calificar absolutos anteriores o legislar sobre causas parciales. {cite:muwafaqat p.493-494} Sostiene que un principio universal hallado en los textos de Medina es parcial en relación con algo más amplio o complementario a un principio universal, y examina los cinco principios universales —religión, vida, razón, descendencia y propiedad—, demostrando que la preservación de la religión fue lo primero revelado en La Meca, que la preservación de la razón se detalló en Medina, pero en general en los textos de La Meca dentro de la preservación de la vida, y que la prohibición de la fornicación y la medida deficiente se revelaron en La Meca. {cite:muwafaqat p.494-495}"
  fr: "La classification des sourates en mecquoises ou médinoises. Sha'rawi présente deux critères: le temps, de sorte que tout ce qui a été révélé après l'Hégire est médinois, même si c'était à La Mecque; et le lieu, de sorte que ce qui a été révélé à La Mecque est mecquois et ce qui a été révélé à Médine est médinois. Il soutient que les savants ne divergeaient pas sur les sourates elles-mêmes, mais seulement sur l'angle d'approche. Il affirme que les sourates mecquoises se concentrent sur la croyance et l'au-delà, les sourates médinoises sur les règles, la société et les hypocrites, et que l'hypocrisie n'apparaissait pas à La Mecque car les persécutés ne peuvent feindre l'hypocrisie (voir: Tafsir Sha'rawi Khawatir, p. 98, p. 99, p. 100). Telle est l'interprétation de Sha'rawi, qui lui est attribuée. Dans son ouvrage « Le Livre des Preuves », al-Shatibi soutient que toute preuve juridique établie de manière absolue, sans loi ni mesure fixe, renvoie à une signification rationnelle confiée au jugement du juriste – que l’on retrouve principalement dans des domaines ordinaires tels que la justice, l’excellence et la patience – tandis que toute preuve établie de manière restrictive, avec une loi fixe, renvoie à une signification spirituelle inaccessible à la compréhension humaine, que l’on retrouve surtout dans les affaires civiles usuli, car elles nuancent généralement des absolus antérieurs ou légifèrent sur des causes partielles. {cite:muwafaqat p.493-494} Il affirme qu’un principe universel présent dans les textes médinois est soit partiel par rapport à un principe plus large, soit complémentaire à un principe universel, et examine les cinq principes universels – la religion, la vie, la raison, la descendance et la propriété – démontrant que la préservation de la religion fut la première chose révélée à La Mecque, que la préservation de la raison fut détaillée à Médine mais, de manière générale, incluse dans les textes mecquois au sein de la préservation de la vie, et que l’interdiction de la fornication et la mesure insuffisante furent révélées à La Mecque. {cite:muwafaqat p.494-495}"
