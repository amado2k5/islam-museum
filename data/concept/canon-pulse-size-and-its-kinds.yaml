summary:
  ar: "يبدأ ابن سينا الأجناس بمقدار الانبساط، فيبين أن النبض له ثلاثة أقطار هي الطول والعرض والعمق، ولكل منها ثلاثة أحوال بسيطة، ثم المركبات {cite:canon-ibn-sina-print-v1 p.169}."
  en: "Ibn Sina begins the genera with the extent of expansion: the pulse has three dimensions, length, breadth and depth, each with three simple states, and compound ones follow {cite:canon-ibn-sina-print-v1 p.169}."
  fr: "Ibn Sina commence par l’étendue de l’expansion : longueur, largeur et profondeur, trois états simples chacune, puis combinaisons {cite:canon-ibn-sina-print-v1 p.169}."
  es: "Ibn Sina comienza los géneros con la extensión de la expansión: el pulso tiene tres dimensiones, longitud, anchura y profundidad, cada una con tres estados simples, y luego siguen los compuestos {cite:canon-ibn-sina-print-v1 p.169}."
  ur: "ابن سینا توسیع کی حد سے نسل کا آغاز کرتے ہیں: نبض کی تین جہتیں ہیں، لمبائی، چوڑائی اور گہرائی، ہر ایک کی تین سادہ حالتیں ہیں، اور مرکبات مندرجہ ذیل ہیں {cite:canon-ibn-sina-print-v1 p.169}۔"
  tr: "İbn Sina, türleri genişleme miktarıyla başlatır ve darbenin üç çapı olduğunu açıklar: uzunluk, genişlik ve derinlik, her biri üç basit duruma sahiptir, ardından bileşikler {cite:canon-ibn-sina-print-v1 s.169}."
  id: "Ibn Sina memulai genre dengan jumlah ekspansi, menjelaskan bahwa pulsa memiliki tiga diameter: panjang, lebar, dan kedalaman, masing-masing dengan tiga keadaan sederhana, kemudian senyawa {cite:canon-ibn-sina-print-v1 hlm.169}."
