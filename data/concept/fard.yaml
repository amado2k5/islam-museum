id: concept/fard
class: concept
kind: legal
label:
  ar: "الفَرْض"
  en: "The obligation (fard)"
  ur: "فرض"
  fr: "L'obligation (fard)"
  es: "La obligación (fard)"
  tr: "Varsayım"
  id: "Asumsi"
summary:
  ar: "الفرض ما أوجبه الله على عباده، ويرد في القرآن والحديث بألفاظ «فرض» و«فريضة» و«افترض» و«كُتب عليكم». وهو عند جمهور الأصوليين مرادف للواجب: ما يُمدح فاعله ويُذم تاركه {cite:irshad-al-fuhul-dar-al-fikr p.8}، ويفرّق الحنفية بينهما بحسب الدليل. وفي الحديث القدسي أن أحب ما يتقرّب به العبد ما افتُرض عليه {cite:sahih-al-bukhari 6502}، وفي حديث الأعرابي أن ما زاد على الصلوات الخمس وصيام رمضان والزكاة تطوّع {cite:hadith-api-fawazahmed0 Bukhari 1891}."
  en: "The fard is what God has made obligatory upon His servants, and it occurs in the Qur'an and the hadith in the words \"he made obligatory\", \"obligation\", \"he ordained\" and \"it was prescribed for you\". For the majority of the scholars of legal theory it is a synonym of the obligatory (wajib): that for which the doer is praised and the one who leaves it is blamed {cite:irshad-al-fuhul-dar-al-fikr p.8}, while the Hanafis distinguish between them according to the evidence. In the sacred hadith, the dearest thing by which a servant draws near is what was made obligatory upon him {cite:sahih-al-bukhari 6502}, and in the hadith of the Bedouin, whatever is beyond the five prayers, the fast of Ramadan and the alms is voluntary {cite:hadith-api-fawazahmed0 Bukhari 1891}."
  ur: "فرض وہ ہے جسے اللہ نے اپنے بندوں پر لازم کیا، اور یہ لفظ قرآن اور حدیث میں «فرض»، «فریضہ»، «افترض» اور «کُتب علیکم» کی صورتوں میں آتا ہے۔ جمہور اصولیین کے نزدیک یہ واجب کا مترادف ہے: جس کے کرنے والے کی تعریف ہو اور چھوڑنے والے کی مذمت {cite:irshad-al-fuhul-dar-al-fikr p.8}، جبکہ حنفیہ دلیل کے لحاظ سے دونوں میں فرق کرتے ہیں۔ حدیثِ قدسی میں ہے کہ بندہ جس چیز سے سب سے زیادہ محبوب تقرب پاتا ہے وہ ہے جو اس پر فرض کی گئی {cite:sahih-al-bukhari 6502}، اور اعرابی کی حدیث میں ہے کہ پانچ نمازوں، رمضان کے روزے اور زکوٰۃ پر جو کچھ بڑھے وہ تطوع ہے {cite:hadith-api-fawazahmed0 Bukhari 1891}۔"
  fr: "Le fard est ce que Dieu a rendu obligatoire pour ses serviteurs, et le mot apparaît dans le Coran et le hadith dans les formes « il a rendu obligatoire », « obligation », « il a prescrit » et « il vous a été prescrit ». Pour la majorité des spécialistes des fondements du droit, il est synonyme de l'obligatoire (wajib) : ce dont l'auteur est loué et dont celui qui l'abandonne est blâmé {cite:irshad-al-fuhul-dar-al-fikr p.8}, tandis que les hanafites les distinguent selon la preuve. Dans le hadith sacré, ce qu'il y a de plus cher pour se rapprocher est ce qui a été rendu obligatoire pour le serviteur {cite:sahih-al-bukhari 6502}, et dans le hadith du bédouin, tout ce qui dépasse les cinq prières, le jeûne de Ramadan et l'aumône est volontaire {cite:hadith-api-fawazahmed0 Bukhari 1891}."
  es: "El fard es lo que Dios ha hecho obligatorio para sus siervos, y la palabra aparece en el Corán y en el hadiz en las formas «hizo obligatorio», «obligación», «prescribió» y «se os ha prescrito». Para la mayoría de los especialistas en teoría jurídica es sinónimo de lo obligatorio (wajib): aquello por lo que se elogia a quien lo hace y se censura a quien lo deja {cite:irshad-al-fuhul-dar-al-fikr p.8}, mientras que los hanafíes los distinguen según la prueba. En el hadiz sagrado, lo más querido con lo que el siervo se acerca es lo que se le hizo obligatorio {cite:sahih-al-bukhari 6502}, y en el hadiz del beduino, todo lo que excede de las cinco oraciones, el ayuno de Ramadán y la limosna es voluntario {cite:hadith-api-fawazahmed0 Bukhari 1891}."
  tr: "Zorunlu görev, Allah'ın kullarına zorunlu kıldığı görevdir ve Kur'an ile hadislerde \"fard\", \"fard\", \"afasd\" ve \"size yazılmış\" kelimeleriyle geçer. Usul alimlerinin çoğuna göre, bu görevle eşanlamlıdır: Yapanı öven ve onu terk edenleri kınayan (cite:irshad-al-fuhul-dar-al-fikr s.8} ve Hanefi bunları kanıtlara göre ayırır. Kutsal hadislerde, bir hizmetkârı yaklaştırdığı en sevilen şey, ona zorunlu olan şeydir {cite:sahih-al-bukhari 6502} ve bedevi hadislerinde ise, beş günlük namaz, oruç Ramazan ve zekatı aşan şeyin gönüllü olduğu belirtilir {cite:hadis-api-fawazahmed0 Buhari 1891}."
  id: "Kewajiban adalah apa yang Allah tetapkan kepada hamba-Nya, dan tercantum dalam Al-Qur'an dan Hadis dengan kata-kata \"fard,\" \"fardah,\" \"afasd,\" dan \"prescribed for you.\" Menurut mayoritas ulama usul, itu identik dengan kewajiban: yang memuji pelaku dan mengutuk orang yang meninggalkannya {cite:irshad-al-fuhul-dar-al-fikr hlm.8}, dan Hanafi membedakan keduanya berdasarkan bukti. Dalam hadis suci, hal yang paling disukai yang didekati oleh seorang hamba adalah apa yang wajib diterima {cite:sahih-al-bukhari 6502}, dan dalam hadis Badui adalah bahwa apa yang melebihi lima shalat harian, puasa Ramadan, dan zakat adalah sukarela {cite:hadith-api-fawazahmed0 Bukhari 1891}."
