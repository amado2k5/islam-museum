label:
  ar: "جناح"
  en: "Janah (bird wing)"
  ur: "جناح ⁦(پر)⁩"
  es: "Janah (ala de pájaro)"
  fr: "Janah (aile d'oiseau)"
  tr: "Kanat"
  id: "Wing"
summary:
  ar: "أجنحة الطير، وخيرها أجنحة الدجاج، وأجنحة الإوز صالحة الهضم؛ يُقال إن ريش جناح الورشان إذا أُحرق مع البنج وخُلط بالخبز حلّل الخنازير في الرقبة، وإن الخبز المعمول بذلك يطلق البطن {cite:canon-ibn-sina-print-v1 p.426} {cite:canon-ibn-sina-print-v1 p.427}."
  en: "Birds' wings. The best are chicken wings; goose wings are easy to digest. It is said that the feathers of the dove's wing, burnt with henbane and put in bread like salt, dissolve scrofulous swellings in the neck, and that bread made so loosens the bowels {cite:canon-ibn-sina-print-v1 p.426} {cite:canon-ibn-sina-print-v1 p.427}."
  ur: "پرندوں کے پر۔ بہترین مرغی کے پر ہیں؛ ہنس کے پر آسانی سے ہضم ہوتے ہیں۔ کہا جاتا ہے کہ ورشان ⁦(فاختہ کی ایک قسم)⁩ کے پر کا ریشہ، بنگ کے ساتھ جلا کر پیس کر نمک کی طرح روٹی میں ڈالا جائے تو گردن کے خنازیر تحلیل کرتا ہے، اور اس روٹی سے پیٹ کھل جاتا ہے {cite:canon-ibn-sina-print-v1 p.426} {cite:canon-ibn-sina-print-v1 p.427}۔"
  es: "Alas de aves. Las mejores son las de pollo; las de ganso son fáciles de digerir. Se dice que las plumas del ala de la paloma, quemadas con beleño y puestas en pan como sal, disuelven las inflamaciones escrofulosas del cuello, y que el pan preparado así afloja los intestinos {cite:canon-ibn-sina-print-v1 p.426} {cite:canon-ibn-sina-print-v1 p.427}."
  fr: "Les ailes d'oiseaux. Les meilleures sont les ailes de poulet; les ailes d'oie sont faciles à digérer. On dit que les plumes d'aile de colombe, brûlées avec de la jusquiame et incorporées au pain comme du sel, dissolvent les scrofules du cou, et que le pain ainsi préparé ramollit les intestins {cite:canon-ibn-sina-print-v1 p.426} {cite:canon-ibn-sina-print-v1 p.427}."
  tr: "Kuş kanatları, en iyileri tavuk kanadı ve kaz kanatları sindirilebilir; Warshan kanadının tüyleri bungee ile yakıldığında ve ekmekle karıştırıldığında domuzların boyunlarından kesildiği ve bu şekilde kullanılan ekmeğin karnı serbest bıraktığı söylenir {cite:canon-ibn-sina-print-v1 s.426} {cite:canon-ibn-sina-print-v1 s.427}."
  id: "Sayap burung, yang terbaik adalah sayap ayam dan sayap angsa, mudah dicerna; dikatakan bahwa bulu sayap Warshan, jika dibakar dengan bungee dan dicampur dengan roti, menyebabkan babi disembelih di sekitar leher, dan roti yang digunakan dengan cara ini melepaskan perut {cite:canon-ibn-sina-print-v1 hlm.426} {cite:canon-ibn-sina-print-v1 hlm.427}."
