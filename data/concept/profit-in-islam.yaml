label:
  ar: "الربح في الإسلام"
  en: "Profit in Islam"
issue:
  ar: "على أي أساس يستحق الربح: المال والعمل والضمان؟"
summary:
  ar: "الربح عند المؤلف عائد المخاطرة والابتكار، وما يبقى من الإيراد بعد أجر المنظم وأجرة العقار وكلفة رأس المال المملوك، وهو الربح الاقتصادي {cite:usul-iqtisad-islami-0660 p. 280} {cite:usul-iqtisad-islami-0660 p. 281}. وطلب الربح مشروع، والحديث «نهى عن ربح ما لم يضمن» يربط الربح بالضمان {cite:usul-iqtisad-islami-0660 p. 202} {cite:usul-iqtisad-islami-0660 p. 288}. والربح يستحق بالمال أو بالعمل، والضمان يستحق به الربح تبعاً {cite:usul-iqtisad-islami-0660 p. 283} {cite:usul-iqtisad-islami-0660 p. 287}."
wings: [ideas]
