- global
perspectives:
  - tradition: sunni-hanafi
    id: hanafi-hanbali-basis
    summary:
      ar: "يرى الحنفية والحنابلة أن الربح يستحق بالمال أو بالعمل أو بالضمان، ويرى الشافعية والمالكية أنه لا يستحق بالضمان {cite:usul-iqtisad-islami-0660 p. 286} {cite:usul-iqtisad-islami-0660 p. 283}."
    sources: [source/usul-iqtisad-islami-0660]
  - tradition: sunni-hanbali
    id: hanbali-asset-share
    summary:
      ar: "أجاز الحنابلة والزيدية والحنفية استحساناً أن تشارك وسائل الإنتاج، كالجمل، بحصة من الربح أو الناتج {cite:usul-iqtisad-islami-0660 p. 282} {cite:usul-iqtisad-islami-0660 p. 283}."
    sources: [source/usul-iqtisad-islami-0660]
  - tradition: shia-twelver
    id: sadr-no-asset-share
    summary:
      ar: "منع الصدر شركة الأصول الثابتة بحصة من الربح على مذهب الإمامية {cite:usul-iqtisad-islami-0660 p. 283}، ويرى المؤلف أن ما جازت فيه الإجارة جازت فيه الشركة {cite:usul-iqtisad-islami-0660 p. 282}."
    sources: [source/usul-iqtisad-islami-0660]
