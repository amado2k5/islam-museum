summary:
  ar: "سبب الوجع الثاقب مادة غليظة أو ريح تحتبس بين طبقات عضو صلب غليظ كالمعي القولون فتمزّقه وتنفذ فيه كأنه يثقب بمثقب، وسبب المسلّي تلك المادة بعينها محتبسة وقت تمزيقها {cite:canon-ibn-sina-print-v1 p.150}."
  en: "The cause of boring pain is thick matter or wind confined between the layers of a hard, thick organ such as the colon, tearing it and passing through as if drilled; the cause of piercing pain is that same matter, held back at the time of its tearing {cite:canon-ibn-sina-print-v1 p.150}."
