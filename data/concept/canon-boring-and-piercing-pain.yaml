id: concept/canon-boring-and-piercing-pain
class: concept
kind: scientific
label:
  ar: "الوجع الثاقب والمسلي عند ابن سينا"
  en: "Boring and piercing pain in the Canon"
  fr: "Douleurs térébrante et perçante dans le Canon"
  ur: "سوراخ کرنے والا اور چھیدنے والا درد، قانون کے مطابق"
  es: "Dolor aburrido y punzante en el Canon"
summary:
  ar: "سبب الوجع الثاقب مادة غليظة أو ريح تحتبس بين طبقات عضو صلب غليظ كالمعي القولون فتمزّقه وتنفذ فيه كأنه يثقب بمثقب، وسبب المسلّي تلك المادة بعينها محتبسة وقت تمزيقها {cite:canon-ibn-sina-print-v1 p.150}."
  en: "The cause of boring pain is thick matter or wind confined between the layers of a hard, thick organ such as the colon, tearing it and passing through as if drilled; the cause of piercing pain is that same matter, held back at the time of its tearing {cite:canon-ibn-sina-print-v1 p.150}."
  fr: "Selon le livre, la douleur térébrante vient d’une matière épaisse ou de vents enfermés entre les couches d’un organe dur et épais comme le côlon, qu’ils déchirent et traversent comme un foret ; la perçante, de la même matière retenue au moment de déchirer {cite:canon-ibn-sina-print-v1 p.150}."
  es: "La causa del dolor sordo es materia espesa o aire confinado entre las capas de un órgano duro y grueso como el colon, desgarrándolo y pasando a través de él como si fuera perforado; la causa del dolor punzante es esa misma materia, retenida en el momento de su desgarro {cite:canon-ibn-sina-print-v1 p.150}."
  ur: "تکلیف دہ درد کی وجہ موٹی مادہ یا ہوا کسی سخت، موٹی عضو جیسے بڑی آنت کی تہوں کے درمیان بند ہونا، اسے پھاڑنا اور اس طرح سے گزرنا جیسے ڈرل کیا گیا ہو۔ چھیدنے کے درد کی وجہ وہی چیز ہے، جسے پھاڑنے کے وقت روک دیا گیا تھا۔"
