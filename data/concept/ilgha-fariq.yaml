label: { ar: "إلغاء الفارق", en: "Ilgha' al-fariq (removing the difference between root and branch)", es: "Ilgha' al-fariq (eliminar la diferencia entre raíz y rama)", fr: "Ilgha' al-fariq (supprimer la différence entre la racine et la branche)", ur: "الغاء الفارق ⁦(جڑ اور شاخ کے فرق کو دور کرنا)⁩", tr: "Spreadi iptal et", id: "Batalkan spread" }
summary:
  ar: "إلغاء الفارق عند الأصوليين بيان عدم تأثير الفارق بين الأصل والفرع في القياس، فيثبت الحكم لما اشتركا فيه، كإلحاق الأمة بالعبد في سراية العتق، وإلحاق الرجال بالنساء في حد القذف لأن الأنوثة فارق ملغى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3325}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3326} ويفترق عن تنقيح المناط والسبر والتقسيم، ويسمى القياس المعتمد عليه القياس في معنى الأصل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3326}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3327}"
  en: "Ilgha' al-fariq is the usuli demonstration that the difference between root and branch has no effect on the ruling in analogy, so the ruling holds for what they share. An example is extending the manumission of part of a slave to a slave-girl, or extending the false-accusation penalty to men on the ground that womanhood is no difference. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3325}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3326} It differs from tanqih al-manat and from sabr wa taqsim, and the analogy that rests on it is called the analogy in the same sense as the root. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3326}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3327}"
  es: "Ilgha' al-fariq es la demostración usuli de que la diferencia entre raíz y rama no afecta la regla por analogía, por lo que la regla se aplica a lo que comparten. Un ejemplo es extender la manumisión de parte de un esclavo a una esclava, o extender la pena por falsa acusación a los hombres basándose en que la condición de mujer no supone ninguna diferencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3325}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3326} Se diferencia de tanqih al-manat y de sabr wa taqsim, y la analogía que se basa en ella se denomina analogía en el mismo sentido que la raíz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3326}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3327}"
  fr: "Ilgha' al-fariq est la démonstration usuli que la différence entre la racine et la branche n'a aucune incidence sur la règle par analogie; la règle s'applique donc à ce qu'elles ont en commun. Par exemple, étendre l'affranchissement d'une partie d'un esclave à une esclave fille, ou étendre la peine pour fausse accusation aux hommes au motif que la condition féminine ne constitue pas une différence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3325}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3326} Cela diffère de tanqih al-manat et de sabr wa taqsim, et l'analogie qui s'y appuie est appelée analogie au même titre que la racine. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3326}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3327}"
  ur: "الغاء الفارق اس بات کا مظہر ہے کہ جڑ اور شاخ کے فرق کا قیاس کے حکم پر کوئی اثر نہیں ہوتا، لہٰذا حکم وہی ہوتا ہے جس میں وہ شریک ہوں۔ ایک مثال یہ ہے کہ غلام کے کچھ حصے کو لونڈی کے حوالے کر دیا جائے، یا اس بنیاد پر مردوں پر جھوٹے الزام لگانے کی سزا کو بڑھایا جائے کہ عورت ہونے میں کوئی فرق نہیں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3325}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3326} یہ تنقیح المنات اور صبر و تقسم سے مختلف ہے، اور اس پر جو تشبیہ قائم ہوتی ہے اسی معنی میں جڑ کہلاتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3326}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3327}"
  tr: "Usulis'e göre ayrımın kaldırılması, orijinal ile yan unsur arasındaki herhangi bir etkinin olmamasının benzetmesini netleştirmek ve böylece paylaştıkları şeyler üzerinde karar vermektir; örneğin özgürleşme durumunda ulusu köle ile ilişkilendirmek ve kadınların kadınlara karışarak iftira cezası vermek gibi, çünkü kadınlık geçersiz bir ayrımdır. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.3325} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3326} Anlamı, sorgulama, ayrım ve bölünmeyi geliştirmekten farklıdır ve dayandığı benzetme orijinal anlamıyla benzetme olarak adlandırılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3326} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3327}"
  id: "Penghapusan perbedaan menurut Usulis bertujuan untuk memperjelas tidak adanya efek antara yang asli dan yang subordinat dalam analogi, sehingga menetapkan keputusan atas apa yang mereka bagi, seperti mengaitkan bangsa dengan budak dalam kasus pembebasan, dan pria bergabung dengan wanita dalam hukuman fitnah, karena feminitas adalah perbedaan yang dibatalkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3325} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3326} Ini berbeda dengan menyempurnakan makna, penyelidikan, dan pembagian, dan analogi yang menjadi dasar disebut analogi dalam arti asli. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3326} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3327}"
