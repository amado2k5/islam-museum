id: concept/ilgha-fariq
class: concept
kind: legal
label: { ar: "إلغاء الفارق", en: "Ilgha' al-fariq (removing the difference between root and branch)" }
summary:
  ar: "إلغاء الفارق عند الأصوليين بيان عدم تأثير الفارق بين الأصل والفرع في القياس، فيثبت الحكم لما اشتركا فيه، كإلحاق الأمة بالعبد في سراية العتق، وإلحاق الرجال بالنساء في حد القذف لأن الأنوثة فارق ملغى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3325}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3326} ويفترق عن تنقيح المناط والسبر والتقسيم، ويسمى القياس المعتمد عليه القياس في معنى الأصل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3326}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3327}"
  en: "Ilgha' al-fariq is the usuli demonstration that the difference between root and branch has no effect on the ruling in analogy, so the ruling holds for what they share. An example is extending the manumission of part of a slave to a slave-girl, or extending the false-accusation penalty to men on the ground that womanhood is no difference. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3325}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3326} It differs from tanqih al-manat and from sabr wa taqsim, and the analogy that rests on it is called the analogy in the same sense as the root. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3326}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3327}"
