issue:
  ar: "هل تُسمى الترجمة قرآناً، وهل يُمسّ المصحف المترجم بغير وضوء؟"
  en: "Is a translation called the Qur'an, and may a translation be touched without wudu?"
  ur: "کیا ترجمے کو قرآن کہا جائے گا، اور کیا ترجمہ بغیر وضو چھوا جا سکتا ہے؟"
  fr: "Une traduction s'appelle-t-elle le Coran, et peut-on la toucher sans ablution ?"
  es: "¿Se llama Corán a una traducción, y puede tocarse sin ablución?"
perspectives:
  - tradition: sunni-hanafi
    id: hanafi-translation-expression-of-meaning
    stance:
      ar: "الترجمة لا تسمى قرآناً بل عبارة عن المعنى، ويشترط الوضوء لمسّ التفسير المشتمل على آيات عربية."
      en: "A translation is not called the Qur'an but an expression of the meaning; wudu is required to touch a commentary containing Arabic verses."
      ur: "ترجمے کو قرآن نہیں کہا جاتا بلکہ وہ معنی کی عبارت ہے؛ عربی آیات والی تفسیر کو چھونے کے لیے وضو شرط ہے۔"
      fr: "Une traduction ne s'appelle pas le Coran mais une expression du sens ; l'ablution est requise pour toucher un commentaire contenant des versets arabes."
      es: "Una traducción no se llama el Corán sino una expresión del sentido; se exige ablución para tocar un comentario que contiene versículos árabes."
    holders: [person/ala-al-din-al-kasani]
    summary:
      ar: "ينقل مناع القطان في مباحث في علوم القرآن، عبر مكتبة إسلام ويب، أن الحنفية الذين أجازوا القراءة بالترجمة عند العجز متفقون على أن الترجمة لا تسمى قرآناً، وإنما تكفي عبارة عن المعنى في الصلاة، وانظر كذلك بدائع الصنائع للكاساني {cite:islamweb-qattan-mabahith-reading-prayer-non-arabic on Manna' al-Qattan} {cite:ablibrary-badai-sanai-kasani-p113 p.113}. وتذكر الموسوعة الفقهية الكويتية، ج 13 ص 97، أن الحنفية يشترطون الوضوء لمس كتب التفسير المشتملة على آيات عربية {cite:mosannefat-mawsua-kuwaitiyya-v13-p97 p.97}."
      en: "Manna' al-Qattan in Mabahith fi Ulum al-Qur'an, via the IslamWeb library, reports that even those Hanafis who allowed recitation in translation upon incapacity agree that a translation is not called the Qur'an, and suffices only as an expression of the meaning in prayer; compare al-Kasani's Bada'i al-Sana'i {cite:islamweb-qattan-mabahith-reading-prayer-non-arabic on Manna' al-Qattan} {cite:ablibrary-badai-sanai-kasani-p113 p.113}. The Kuwaiti Mawsu'a Fiqhiyya, vol. 13, p. 97, states that the Hanafis require wudu to touch tafsir works containing Arabic verses {cite:mosannefat-mawsua-kuwaitiyya-v13-p97 p.97}."
      ur: "مناع القطان مباحث فی علوم القرآن میں، اسلام ویب لائبریری کے ذریعے، نقل کرتے ہیں کہ جن حنفیہ نے عجز کی صورت میں ترجمے کی قراءت کو جائز کہا وہ بھی متفق ہیں کہ ترجمے کو قرآن نہیں کہا جاتا اور وہ نماز میں صرف معنی کی عبارت کے طور پر کافی ہے؛ کاسانی کی بدائع الصنائع بھی دیکھی جائے {cite:islamweb-qattan-mabahith-reading-prayer-non-arabic on Manna' al-Qattan} {cite:ablibrary-badai-sanai-kasani-p113 p.113}۔ الموسوعہ الفقہیہ الکویتیہ جلد 13 صفحہ 97 بتاتی ہے کہ حنفیہ عربی آیات والی کتب تفسیر کو چھونے کے لیے وضو شرط کرتے ہیں {cite:mosannefat-mawsua-kuwaitiyya-v13-p97 p.97}۔"
      fr: "Manna' al-Qattan, dans Mabahith fi Ulum al-Qur'an, via la bibliothèque d'IslamWeb, rapporte que même les hanafites qui ont permis la récitation en traduction en cas d'incapacité s'accordent pour dire qu'une traduction ne s'appelle pas le Coran et ne suffit dans la prière que comme expression du sens ; voir aussi Bada'i al-Sana'i d'al-Kasani {cite:islamweb-qattan-mabahith-reading-prayer-non-arabic on Manna' al-Qattan} {cite:ablibrary-badai-sanai-kasani-p113 p.113}. La Mawsu'a fiqhiyya koweïtienne, vol. 13, p. 97, indique que les hanafites exigent l'ablution pour toucher les ouvrages de tafsir contenant des versets arabes {cite:mosannefat-mawsua-kuwaitiyya-v13-p97 p.97}."
      es: "Manna' al-Qattan, en Mabahith fi Ulum al-Qur'an, a través de la biblioteca de IslamWeb, transmite que incluso los hanafíes que permitieron la recitación en traducción en caso de incapacidad coinciden en que una traducción no se llama el Corán y solo basta en la oración como expresión del sentido; véase también Bada'i al-Sana'i de al-Kasani {cite:islamweb-qattan-mabahith-reading-prayer-non-arabic on Manna' al-Qattan} {cite:ablibrary-badai-sanai-kasani-p113 p.113}. La Mawsu'a fiqhiyya kuwaití, vol. 13, p. 97, indica que los hanafíes exigen ablución para tocar obras de tafsir que contienen versículos árabes {cite:mosannefat-mawsua-kuwaitiyya-v13-p97 p.97}."
    sources: [source/islamweb-qattan-mabahith-reading-prayer-non-arabic, source/ablibrary-badai-sanai-kasani-p113, source/mosannefat-mawsua-kuwaitiyya-v13-p97]
  - tradition: sunni
    id: majority-translation-is-tafsir
    stance:
      ar: "الترجمة تفسير وليست قرآناً، لأن القرآن هو اللفظ العربي المنزل ونظمه؛ ويجوز مس الترجمة المجردة بلا وضوء."
      en: "A translation is tafsir and not the Qur'an, since the Qur'an is the revealed Arabic wording and its arrangement; a pure translation may be touched without wudu."
      ur: "ترجمہ تفسیر ہے قرآن نہیں، کیونکہ قرآن نازل شدہ عربی لفظ اور اس کا نظم ہے؛ خالص ترجمہ بغیر وضو چھوا جا سکتا ہے۔"
      fr: "Une traduction est un tafsir et non le Coran, le Coran étant le texte arabe révélé et sa composition ; une traduction pure peut être touchée sans ablution."
      es: "Una traducción es tafsir y no el Corán, pues el Corán es el texto árabe revelado y su composición; una traducción pura puede tocarse sin ablución."
    holders: [person/al-nawawi]
    summary:
      ar: "تذكر فتوى دار الإفتاء المصرية رقم 12699 أن المالكية والشافعية والحنابلة يرون الترجمة غير القرآن، لأن القرآن هو اللفظ والنظم العربيان المنزلان، وإنما الترجمة تفسير {cite:dar-alifta-fatwa-12699 on Fatwa 12699}، وبهذا يقرر النووي في المجموع، الجزء الثالث، الصفحتين 342 و343 {cite:islamweb-majmu-nawawi-v3-quran-non-arabic p.342-343}. وتذكر الموسوعة الفقهية الكويتية أن الجمهور من المالكية والشافعية والحنابلة يجيزون مس الترجمة المجردة أو التفسير الذي يغلب فيه الشرح على النص العربي بلا وضوء {cite:mosannefat-mawsua-kuwaitiyya-v13-p97 p.97} {cite:ketabonline-mawsua-kuwaitiyya-v38-p9 p.9}."
      en: "Dar al-Ifta al-Misriyya's Fatwa 12699 states that the Malikis, Shafi'is and Hanbalis hold a translation to be other than the Qur'an, because the Qur'an consists of the revealed Arabic wording and arrangement, and a translation is tafsir {cite:dar-alifta-fatwa-12699 on Fatwa 12699}, and al-Nawawi says so in al-Majmu', vol. 3, pp. 342-343 {cite:islamweb-majmu-nawawi-v3-quran-non-arabic p.342-343}. The Kuwaiti Mawsu'a states that the majority, Malikis, Shafi'is and Hanbalis, permit touching a pure translation, or a tafsir where commentary outweighs the Arabic text, without wudu {cite:mosannefat-mawsua-kuwaitiyya-v13-p97 p.97} {cite:ketabonline-mawsua-kuwaitiyya-v38-p9 p.9}."
      ur: "دارالافتاء المصریہ کا فتویٰ 12699 بتاتا ہے کہ مالکیہ، شافعیہ اور حنابلہ ترجمے کو قرآن کے سوا سمجھتے ہیں کیونکہ قرآن نازل شدہ عربی لفظ اور نظم ہے، اور ترجمہ تفسیر ہے {cite:dar-alifta-fatwa-12699 on Fatwa 12699}، اور نووی المجموع جلد 3 صفحات 342 و343 میں یہی کہتے ہیں {cite:islamweb-majmu-nawawi-v3-quran-non-arabic p.342-343}۔ الموسوعہ الفقہیہ الکویتیہ بتاتی ہے کہ جمہور، یعنی مالکیہ، شافعیہ اور حنابلہ، خالص ترجمے کو، یا اس تفسیر کو جس میں عربی متن پر شرح غالب ہو، بغیر وضو چھونا جائز کہتے ہیں {cite:mosannefat-mawsua-kuwaitiyya-v13-p97 p.97} {cite:ketabonline-mawsua-kuwaitiyya-v38-p9 p.9}۔"
      fr: "La fatwa 12699 de Dar al-Ifta al-Misriyya indique que malikites, chaféites et hanbalites tiennent la traduction pour autre que le Coran, le Coran étant le texte et la composition arabes révélés, et la traduction un tafsir {cite:dar-alifta-fatwa-12699 on Fatwa 12699}, et al-Nawawi le dit dans al-Majmu', vol. 3, pp. 342-343 {cite:islamweb-majmu-nawawi-v3-quran-non-arabic p.342-343}. La Mawsu'a koweïtienne indique que la majorité, malikites, chaféites et hanbalites, permet de toucher sans ablution une traduction pure, ou un tafsir où le commentaire l'emporte sur le texte arabe {cite:mosannefat-mawsua-kuwaitiyya-v13-p97 p.97} {cite:ketabonline-mawsua-kuwaitiyya-v38-p9 p.9}."
      es: "La fatwa 12699 de Dar al-Ifta al-Misriyya indica que malikíes, shafi'íes y hanbalíes tienen la traducción por distinta del Corán, pues el Corán es el texto y la composición árabes revelados, y la traducción es tafsir {cite:dar-alifta-fatwa-12699 on Fatwa 12699}, y al-Nawawi lo dice en al-Majmu', vol. 3, pp. 342-343 {cite:islamweb-majmu-nawawi-v3-quran-non-arabic p.342-343}. La Mawsu'a kuwaití indica que la mayoría, malikíes, shafi'íes y hanbalíes, permite tocar sin ablución una traducción pura, o un tafsir donde el comentario prevalece sobre el texto árabe {cite:mosannefat-mawsua-kuwaitiyya-v13-p97 p.97} {cite:ketabonline-mawsua-kuwaitiyya-v38-p9 p.9}."
