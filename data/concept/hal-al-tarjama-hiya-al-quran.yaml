id: concept/hal-al-tarjama-hiya-al-quran
class: concept
kind: doctrine
tags: [arabiyya-browser, arabiyya-lisan]
label:
  ar: "هل الترجمة هي القرآن؟ حكم الترجمة وحكم مسّها"
  en: "Is a translation the Qur'an? The status of a translation and the rule on touching it"
  ur: "کیا ترجمہ ہی قرآن ہے؟ ترجمے کا حکم اور اسے چھونے کا حکم"
  fr: "La traduction est-elle le Coran ? Son statut et la règle sur son toucher"
  es: "¿Es la traducción el Corán? Su estatus y la regla sobre tocarla"
  tr: "Çeviri Kur'an'la aynı mıdır? Çeviri ile ona dokunma hükmü"
  id: "Apakah terjemahan sama dengan Al-Qur'an? Aturan tentang terjemahan dan aturan tentang menyentuhnya"
summary:
  ar: "اتفقت المذاهب السنية، بحسب المصادر المنقولة، على أن الترجمة لا تسمى قرآناً: فالحنفية الذين أجازوا القراءة بها عند العجز يرونها عبارة عن المعنى لا القرآن نفسه، والمالكية والشافعية والحنابلة يرونها تفسيراً لأن القرآن هو اللفظ العربي المنزل ونظمه. وبنوا على ذلك أن مس الترجمة المجردة لا يشترط له وضوء عند الجمهور، وأن كتب التفسير المشتملة على آيات عربية يشترط للمسها الوضوء عند الحنفية."
  en: "The Sunni schools agree, on the sources quoted, that a translation is not called the Qur'an: the Hanafis who allowed reciting it in case of incapacity regard it as an expression of the meaning, not the Qur'an itself, while the Malikis, Shafi'is and Hanbalis regard it as tafsir, since the Qur'an is the revealed Arabic wording and its arrangement. On this they base the ruling that touching a pure translation does not require wudu for the majority, whereas the Hanafis still require wudu to touch commentaries that contain Arabic verses."
  ur: "نقل شدہ مآخذ کے مطابق سنی مذاہب اس پر متفق ہیں کہ ترجمے کو قرآن نہیں کہا جاتا: جن حنفیہ نے عجز کی صورت میں اس کی قراءت کو جائز کہا وہ بھی اسے مفہوم کی عبارت سمجھتے ہیں نہ کہ خود قرآن، اور مالکیہ، شافعیہ اور حنابلہ اسے تفسیر سمجھتے ہیں کیونکہ قرآن نازل شدہ عربی لفظ اور اس کا نظم ہے۔ اسی بنیاد پر جمہور کے نزدیک خالص ترجمے کو چھونے کے لیے وضو شرط نہیں، جبکہ حنفیہ عربی آیات والی تفاسیر کو چھونے کے لیے وضو لازم کہتے ہیں۔"
  fr: "Selon les sources citées, les écoles sunnites s'accordent pour dire qu'une traduction ne s'appelle pas le Coran : les hanafites qui ont permis de la réciter en cas d'incapacité la tiennent pour une expression du sens, non le Coran lui-même, tandis que malikites, chaféites et hanbalites y voient un tafsir, le Coran étant le texte arabe révélé et sa composition. Ils en tirent que toucher une traduction pure ne requiert pas d'ablution pour la majorité, alors que les hanafites exigent encore l'ablution pour toucher des commentaires contenant des versets arabes."
  es: "Según las fuentes citadas, las escuelas suníes coinciden en que una traducción no se llama el Corán: los hanafíes que permitieron recitarla en caso de incapacidad la tienen por expresión del sentido, no el Corán mismo, mientras malikíes, shafi'íes y hanbalíes ven en ella un tafsir, pues el Corán es el texto árabe revelado y su composición. De ahí que tocar una traducción pura no exija ablución para la mayoría, aunque los hanafíes siguen exigiéndola para tocar comentarios que contienen versículos árabes."
  tr: "Aktarılan kaynaklara göre, Sünni mezhebler çevirinin Kur'an olarak adlandırılmadığı konusunda hemfikirdir: Hanefiler, onu Kur'an'ın kendisi değil, bir anlam olarak görürken, Malikiler, Şafiiler ve Hanbaliler bunu bir yorum olarak görürler çünkü Kur'an Arapça'da vahyedilmiş kelime ve onun bileşimidir. Bunu, çoğunlukla sadece bir çeviriye dokunmanın abdest almayı gerektirmediği, Hanefilere göre ise Arapça ayetler içeren tefsir kitaplarının abdest alınması gerektiği fikrine dayandırdılar."
  id: "Menurut sumber yang dikirimkan, aliran Sunni sepakat bahwa terjemahan itu tidak disebut Al-Qur'an: Hanafi, yang mengizinkan membacanya saat tidak mampu, melihatnya sebagai makna, bukan Al-Qur'an itu sendiri, sementara Maliki, Shafi'i, dan Hanbal melihatnya sebagai interpretasi karena Al-Qur'an adalah kata Arab yang diwahyukan dan komposisinya. Mereka mendasarkan ini pada gagasan bahwa menyentuh terjemahan semata tidak memerlukan wudhu menurut mayoritas, dan bahwa buku-buku tafsir yang berisi ayat-ayat Arab memerlukan wudhu menurut Hanafi."
