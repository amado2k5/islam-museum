id: concept/rifq-fiqh
class: concept
kind: legal
label:
  ar: "الرفق"
  en: "Rifq (gentleness): its ruling, God's gentleness to His servants, gentleness to parents, neighbours, followers, servants and animals"
  ur: "رفق ⁦(نرمی)⁩"
  es: "Rifq (gentileza): su dominio, la gentileza de Dios hacia sus siervos, gentileza hacia los padres, los vecinos, los seguidores, los siervos y los animales."
  fr: "Rifq (douceur): son principe, la douceur de Dieu envers Ses serviteurs, la douceur envers les parents, les voisins, les fidèles, les serviteurs et les animaux"
summary:
  ar: "الرفق في اللغة لين الجانب ولطافة الفعل وإحكام العمل والقصد، ويقابله العنف، وحكمه العام الاستحباب، وقد يخرج عن الاستحباب فيكون واجبا كالرفق بالوالدين، وممنوعا كالرفق بالكفار المحاربين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8815} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8816} وقد كلف الله عباده بما يطيقون ورخص لهم، وأمر بأن يأخذوا من النوافل ما يطيقون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8816} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8817} ويؤمر بالرفق بالوالدين والجار، ويُسن للإمام أن يخفف بالمأمومين، ويُستحب الرفق في الزحام عند الاستلام، ويكون الرفق في تغيير المنكر مع الجاهل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8817} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8818} وأمر النبي بالرفق بالخدم وإطعامهم مما يأكل، وينهى عن صبر الحيوان وتعذيبه، ويجب الإنفاق عليه، ويحرم تحميله ما لا يطيق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8818} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8819} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8820} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8821}"
  en: "Rifq in the lexicon is gentleness, softness in the act and firmness in the purpose; it is the opposite of harshness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8815} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8816} In general it is recommended, but it is obligatory with parents and forbidden with fighting unbelievers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8816} God has laid on His servants only what they can bear and has granted them concessions, and the believer is told to take from the supererogatory what he can keep up. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8816} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8817} Kindness to parents and neighbours is commanded; the imam should shorten the prayer for the weak; in crowded rites one should not push others; and in changing wrong one should be gentle with the ignorant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8817} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8818} The Prophet urged kindness to servants, feeding them from one's own food, and forbade torturing animals and shooting at living creatures for a target; the owner must feed the animal and may not overload it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8818} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8819} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8820} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8821}"
  ur: "رفق نرمی اور لطافت ہے؛ عام طور پر مستحب ہے، والدین کے ساتھ واجب اور حربی کفار کے ساتھ ممنوع ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8815} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8816} جانوروں پر ظلم اور ان کا بوجھ حد سے زیادہ لادنا ممنوع ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8820} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8821}"
  es: "Rifq en el léxico es gentileza, suavidad en el acto y firmeza en el propósito; es lo opuesto a la dureza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8815} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8816} En general es recomendable, pero es obligatorio con los padres y prohibido con la lucha contra los incrédulos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8816} Dios ha impuesto a Sus siervos solo lo que pueden soportar y les ha concedido concesiones, y al creyente se le dice que tome de lo supererogatorio lo que pueda mantener. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8816} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8817} Se ordena la bondad hacia los padres y vecinos; el imán debe acortar la oración para los débiles; en los ritos concurridos no se debe empujar a los demás; y al corregir un error se debe ser amable con el ignorante. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8817} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8818} El Profeta exhortó a la bondad hacia los sirvientes, alimentándolos con la propia comida, y prohibió torturar animales y disparar a criaturas vivas como objetivo; el dueño debe alimentar al animal y no puede sobrecargarlo. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8818} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8819} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8820} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8821}"
  fr: "Dans le lexique, « rifq » signifie douceur, tendresse dans l'action et fermeté dans l'intention; c'est l'opposé de la dureté. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8815} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8816} En général, c'est recommandé, mais c'est obligatoire envers les parents et interdit de combattre les non-croyants. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8816} Dieu n'a imposé à Ses serviteurs que ce qu'ils peuvent supporter et leur a accordé des concessions; le croyant est invité à prendre du surérogatoire ce qu'il peut assumer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8816} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8817} La bienveillance envers les parents et les voisins est un commandement; l’imam doit raccourcir la prière pour les personnes faibles; lors des offices bondés, il ne faut pas bousculer les autres; et lorsqu’on corrige une erreur, il faut faire preuve de douceur envers les ignorants. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8817} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8818} Le Prophète a exhorté à la bienveillance envers les serviteurs, en les nourrissant de sa propre nourriture, et a interdit de torturer les animaux et de tirer sur des êtres vivants comme cible; le propriétaire doit nourrir l’animal et ne doit pas le surcharger. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8818} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8819} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8820} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8821}"
