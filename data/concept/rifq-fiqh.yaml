id: concept/rifq-fiqh
class: concept
kind: legal
label:
  ar: "الرفق"
  en: "Rifq (gentleness): its ruling, God's gentleness to His servants, gentleness to parents, neighbours, followers, servants and animals"
  ur: "رفق (نرمی)"
summary:
  ar: "الرفق في اللغة لين الجانب ولطافة الفعل وإحكام العمل والقصد، ويقابله العنف، وحكمه العام الاستحباب، وقد يخرج عن الاستحباب فيكون واجبا كالرفق بالوالدين، وممنوعا كالرفق بالكفار المحاربين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8815} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8816} وقد كلف الله عباده بما يطيقون ورخص لهم، وأمر بأن يأخذوا من النوافل ما يطيقون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8816} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8817} ويؤمر بالرفق بالوالدين والجار، ويُسن للإمام أن يخفف بالمأمومين، ويُستحب الرفق في الزحام عند الاستلام، ويكون الرفق في تغيير المنكر مع الجاهل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8817} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8818} وأمر النبي بالرفق بالخدم وإطعامهم مما يأكل، وينهى عن صبر الحيوان وتعذيبه، ويجب الإنفاق عليه، ويحرم تحميله ما لا يطيق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8818} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8819} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8820} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8821}"
  en: "Rifq in the lexicon is gentleness, softness in the act and firmness in the purpose; it is the opposite of harshness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8815} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8816} In general it is recommended, but it is obligatory with parents and forbidden with fighting unbelievers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8816} God has laid on His servants only what they can bear and has granted them concessions, and the believer is told to take from the supererogatory what he can keep up. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8816} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8817} Kindness to parents and neighbours is commanded; the imam should shorten the prayer for the weak; in crowded rites one should not push others; and in changing wrong one should be gentle with the ignorant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8817} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8818} The Prophet urged kindness to servants, feeding them from one's own food, and forbade torturing animals and shooting at living creatures for a target; the owner must feed the animal and may not overload it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8818} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8819} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8820} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8821}"
  ur: "رفق نرمی اور لطافت ہے؛ عام طور پر مستحب ہے، والدین کے ساتھ واجب اور حربی کفار کے ساتھ ممنوع ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8815} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8816} جانوروں پر ظلم اور ان کا بوجھ حد سے زیادہ لادنا ممنوع ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8820} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8821}"
