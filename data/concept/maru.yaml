  ur: "مرو"
  es: "Maru (un labiado fragante)"
  fr: "Maru (un labié parfumé)"
summary:
  ar: "المرو نبات عطري له أنواع عند الهند، حار يابس في الثانية، مفش للريح لطيف محلل للنفخ والبلغم مفتح للسدد الباردة، وينفع الأذن الوجعة والصداع والمعدة {cite:canon-ibn-sina-print-v1 p.555} {cite:canon-ibn-sina-print-v1 p.556}."
  en: "Maru is a fragrant plant with several kinds according to the Indians, hot and dry in the second degree, breaking wind, fine, dissolving wind and phlegm and opening cold obstructions; it is listed for the aching ear, headache and the stomach {cite:canon-ibn-sina-print-v1 p.555} {cite:canon-ibn-sina-print-v1 p.556}."
  ur: "مرو ایک خوشبودار پودا ہے جس کی ہندیوں کے نزدیک کئی قسمیں ہیں، دوسرے درجے میں گرم خشک، ریاح کو توڑنے والا، لطیف، ریاح اور بلغم کو تحلیل کرنے والا اور سرد رکاوٹیں کھولنے والا؛ دردمند کان، سردرد اور معدے میں مذکور ہے {cite:canon-ibn-sina-print-v1 p.555} {cite:canon-ibn-sina-print-v1 p.556}۔"
  es: "Maru es una planta fragante con varios tipos según los indios, cálida y seca en segundo grado, rompe vientos, fina, disuelve vientos y flemas y abre obstrucciones frías; se menciona para el dolor de oído, dolor de cabeza y estómago {cite:canon-ibn-sina-print-v1 p.555} {cite:canon-ibn-sina-print-v1 p.556}."
  fr: "Le Maru est une plante odorante qui compte plusieurs sortes selon les Indiens, chaude et sèche au deuxième degré, qui brise les gaz, fine, dissout les gaz et les mucosités et ouvre les obstructions dues au froid; elle est mentionnée pour les maux d'oreille, les maux de tête et les problèmes d'estomac {cite:canon-ibn-sina-print-v1 p.555} {cite:canon-ibn-sina-print-v1 p.556}."
