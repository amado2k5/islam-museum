summary:
  ar: "من آيات موسى على آل فرعون الضفادع خرجت عليهم في أوانيهم وطعامهم حتى ملّوها، وعند الشافعية يحرم قتلها وروي نهي النبي عن قتلها."
  en: "Among the signs upon Pharaoh's people were the frogs, coming upon them in their vessels and food until they wearied of them; the Shafi'is forbid killing it and a prohibition from the Prophet is reported."
  ur: "فرعون کے آل پر نشانیوں میں مینڈک تھے جو ان کے برتنوں اور کھانے تک میں آ گئے یہاں تک کہ وہ تنگ آ گئے؛ شافعی مذہب میں اس کا قتل حرام ہے اور نبی سے ممانعت کی روایت آئی ہے۔"
  es: "Entre las señales que azotaron al pueblo del faraón estaban las ranas, que se les aparecían en sus vasijas y en su comida hasta que se cansaron de ellas; los shafi'is prohíben matarlas y se informa de una prohibición del Profeta."
  fr: "Parmi les signes qui s'abattirent sur le peuple de Pharaon, il y avait les grenouilles, qui les surprenaient dans leurs récipients et leur nourriture jusqu'à ce qu'ils s'en lassent; les Shafi'ites interdisent de les tuer et une interdiction du Prophète est rapportée."
  tr: "Musa'nın Firavun halkına gösterdiği işaretlerden biri, kaplarında ve yiyeceklerinde kurbağaların üzerlerinde görünmeleridir; ta ki bıktıklarına kadar. Şafiilere göre, onları öldürmek yasaktır ve Peygamber'in onları öldürmeyi yasakladığı rivayet edilmiştir."
  id: "Di antara tanda-tanda Musa kepada umat Firaun: katak muncul di atas mereka dalam wadah dan makanan mereka sampai mereka lelah. Menurut syafi'i, membunuh mereka dilarang, dan diceritakan bahwa Nabi melarang membunuh mereka."
