label:
  fr: "Champignons dans le Canon"
  ar: "فطر"
  en: "Fitr (the mushroom)"
  ur: "فطر"
summary:
  fr: "Dioscoride distingue les champignons comestibles des mortels. Le Canon énumère parmi les causes supposées de toxicité la proximité de clous rouillés, chiffons pourris, nids d'animaux nuisibles ou racines de certains arbres {cite:canon-ibn-sina-print-v1 pp.632-633}. Il décrit sur ces champignons une humidité visqueuse ou une pourriture en toile d'araignée, et une dégradation rapide après cueillette. Les autres, consommés dans les bouillons, sont savoureux mais pourraient, en excès et faute de digestion, nuire, tuer, étouffer, provoquer le choléra ou réveiller les maladies de bile noire {cite:canon-ibn-sina-print-v1 p.633}."
  ar: "الفطر في الكتاب صنفان أحدهما يؤكل والآخر يقتل، بارد في آخر الثالثة رطب في قربها، يولد خلطا غليظا رديئا، وفي الكتاب علامات القاتل منه وتحذير من الإكثار حتى من المأكول {cite:canon-ibn-sina-print-v1 632, 633}"
  en: "Fitr is in the book of two kinds, one that is eaten and one that kills; cold at the end of the third degree and moist near it, it engenders a thick, bad humour, and the book gives the signs of the deadly kind and warns against excess even of the edible {cite:canon-ibn-sina-print-v1 632, 633}"
  ur: "فطر کتاب میں دو قسم کا ہے، ایک کھایا جاتا ہے اور دوسرا ہلاک کرتا ہے؛ تیسرے درجے کے آخر میں ٹھنڈا اور اس کے قریب تر، گاڑھا اور ناقص خلط پیدا کرتا ہے، اور کتاب مہلک قسم کی علامتیں بتاتی ہے اور کھانے کی قسم کی بھی کثرت سے خبردار کرتی ہے {cite:canon-ibn-sina-print-v1 632, 633}۔"
