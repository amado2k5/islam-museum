summary:
  ar: "لفظ يعني غير المتزوج، أُطلق على أنواع من الجنود في النظم التركية والعثمانية، من بحارة وراماة خفيفين وحراس القلاع؛ وكانوا عزّاباً في الأصل ثم صاروا يتزوجون {cite:encyclopaedia-of-islam-2 vol. 1 p. 856-857}."
  en: "An Arabic term meaning unmarried, applied in the Turkish and Ottoman régimes to several kinds of troops: sea-going marines, light archers and fortress guards. They began as bachelors, and were later allowed to marry {cite:encyclopaedia-of-islam-2 vol. 1 p. 856-857}."
