id: concept/azab
class: concept
kind: term
label:
  ar: "عزب"
  en: "'Azab (Ottoman fighting men)"
  fr: "'Azab (soldats ottomans)"
  ur: "عزب"
  es: "'Azab (combatientes otomanos)"
  tr: "Single"
  id: "Single"
summary:
  ar: "لفظ يعني غير المتزوج، أُطلق على أنواع من الجنود في النظم التركية والعثمانية، من بحارة وراماة خفيفين وحراس القلاع؛ وكانوا عزّاباً في الأصل ثم صاروا يتزوجون {cite:encyclopaedia-of-islam-2 vol. 1 p. 856-857}."
  en: "An Arabic term meaning unmarried, applied in the Turkish and Ottoman régimes to several kinds of troops: sea-going marines, light archers and fortress guards. They began as bachelors, and were later allowed to marry {cite:encyclopaedia-of-islam-2 vol. 1 p. 856-857}."
  fr: "Terme arabe signifiant célibataire, appliqué sous les régimes turcs et ottomans à divers soldats : troupes embarquées, archers légers et gardes de forteresse. D’abord célibataires, ils furent ensuite autorisés à se marier {cite:encyclopaedia-of-islam-2 vol. 1 p. 856-857}."
  es: "Término árabe que significa soltero, aplicado en los regímenes turco y otomano a varios tipos de tropas: infantes de marina, arqueros ligeros y guardias de fortalezas. Comenzaban siendo solteros y posteriormente se les permitía casarse {cite:encyclopaedia-of-islam-2 vol. 1 p. 856-857}."
  ur: "ایک عربی اصطلاح جس کا مطلب غیر شادی شدہ ہے، جس کا اطلاق ترکی اور عثمانی حکومتوں میں کئی قسم کے فوجیوں پر ہوتا ہے: سمندر میں جانے والے میرینز، ہلکے تیر انداز اور قلعہ کے محافظ۔ انہوں نے بیچلرز کے طور پر شروع کیا، اور بعد میں انہیں شادی کرنے کی اجازت دی گئی. 1 ص۔ 856-857}۔"
  tr: "Evlenmemiş anlamına gelen terim, Türk ve Osmanlı sistemlerinde denizciler, hafif okçular ve kale muhafızları gibi asker türleri için kullanılmıştır; başlangıçta bekardılar ve sonra evlenmeye başlamışlardır {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 856-857}."
  id: "Istilah yang berarti belum menikah digunakan dalam sistem Turki dan Ottoman untuk jenis tentara, termasuk pelaut, pemanah ringan, dan penjaga kastil; mereka awalnya lajang dan kemudian mulai menikah {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 856-857}."
