summary:
  ar: "قضى عمر في الضبع يقتله المحرم بكبش، وعدّها مالك من السباع التي لا تعقر فلا يقتلها المحرم وإن قتلها فداه: بين الجزية والفدية حظ الضبع في كتب الصيد."
  en: "Umar ruled a ram in compensation for the hyena killed in ihram, and Malik counted her among the beasts that do not attack — the pilgrim does not kill her, and if he does he ransoms it: between levy and ransom lies the hyena's share in the hunting books."
  ur: "عمر نے احرام میں مارے گئے لگڑ بھگے کے بدلے ایک دنبہ مقرر کیا اور مالک نے اسے ان جانوروں میں گنا جو حملہ نہیں کرتے — محرم اسے نہ مارے اور مارے تو فدیہ دے۔"
