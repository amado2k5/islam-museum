label:
  ar: "الضبع"
  en: "The hyena"
  ur: "لگڑ بھگا"
  es: "La hiena"
  fr: "La hyène"
  tr: "sırtlan"
  id: "hiena"
summary:
  ar: "قضى عمر في الضبع يقتله المحرم بكبش، وعدّها مالك من السباع التي لا تعقر فلا يقتلها المحرم وإن قتلها فداه: بين الجزية والفدية حظ الضبع في كتب الصيد."
  en: "Umar ruled a ram in compensation for the hyena killed in ihram, and Malik counted her among the beasts that do not attack — the pilgrim does not kill her, and if he does he ransoms it: between levy and ransom lies the hyena's share in the hunting books."
  ur: "عمر نے احرام میں مارے گئے لگڑ بھگے کے بدلے ایک دنبہ مقرر کیا اور مالک نے اسے ان جانوروں میں گنا جو حملہ نہیں کرتے — محرم اسے نہ مارے اور مارے تو فدیہ دے۔"
  es: "Umar ofreció un carnero como compensación por la hiena muerta en estado de ihram, y Malik la incluyó entre las bestias que no atacan: el peregrino no la mata, y si lo hace, paga un rescate. Entre el impuesto y el rescate se encuentra la parte de la hiena en los libros de caza."
  fr: "Umar a accordé un bélier en compensation de la hyène tuée en état d'ihram, et Malik l'a comptée parmi les bêtes qui n'attaquent pas — le pèlerin ne la tue pas, et s'il le fait, il la rachète: entre la levée et la rançon se trouve la part de la hyène dans les livres de chasse."
  tr: "Ömer, hacı tarafından koçla öldürülen sırtlanla bir gün geçirdi. Malik, onu pazarlık yapmayan hayvanlar arasında saydı ve hacı onu öldürse bile öldürmemeli, çünkü cizye ile fidye arasındaki fidye av kitaplarındaki sırtlanın payıdır."
  id: "Umar menghabiskan sehari bersama hyena yang dibunuh oleh peziarah dengan seekor domba jantan. Malik menganggapnya sebagai salah satu binatang yang tidak bernegosiasi dan peziarah tidak boleh membunuhnya, meskipun ia membunuhnya, karena tebusan antara jizya dan tebusan adalah bagian hyena dalam buku berburu."
