id: concept/mafsil
class: concept
kind: legal
label:
  ar: المَفْصِل
  en: Joint (mafsil)
  ur: مفصل ⁦(جوڑ)⁩
  es: "Articulación (mafsil)"
  fr: "Joint (mafsil)"
summary:
  ar: "المفصل في اللغة ملتقى العظمين من الجسد، وفي الاصطلاح موضع اتصال عضو بآخر برباطات واصلة بين عظمين. ويتعلق به حكم في الوضوء والغسل، إذ يُسن غسل اليدين إلى الرسغ ثلاثا قبل إدخالهما الإناء. وفي القصاص لا يجب القصاص فيما دون النفس إلا إذا كان القطع من مفصل. وفي الديات في قطع كل أنملة ثلث عشر الدية، وفي الإبهام نصف عشر لكل مفصل. وعند جمهور الفقهاء يكون قطع اليد في السرقة من الكوع، وهو مفصل الكف، وقطع الرجل من مفصل الكعب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14827} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14828}"
  en: "A joint (mafsil) is, in lexical sense, the meeting of two bones in the body; in the technical sense it is the place where one organ joins another by ligaments connecting two bones. Its rulings appear in ablution and washing, where it is recommended to wash the hands up to the wrist three times before dipping them into the vessel. In retaliation, a wound short of death is subject to retaliation only if the cut is made at a joint. For blood-money, each finger phalanx carries a thirteenth of the full diya, and the thumb two phalanges of a twentieth each. Most jurists hold that a thief's hand is cut at the wrist joint and his foot at the ankle joint. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14827} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14828}"
  ur: "مفصل لغت میں جسم کی دو ہڈیوں کے ملنے کی جگہ ہے۔ وضو میں ہتھیلی کو کلائی تک تین بار دھونا مسنون ہے۔ قصاص میں جوڑ سے کٹنے پر ہی قصاص ہوتا ہے، اور چوری میں ہاتھ کلائی کے جوڑ سے اور پاؤں ٹخنے کے جوڑ سے کاٹا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14827} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14828}"
  es: "Una articulación (mafsil) es, en sentido léxico, la unión de dos huesos en el cuerpo; en sentido técnico, es el lugar donde un órgano se une a otro mediante ligamentos que conectan dos huesos. Sus normas aparecen en la ablución y el lavado, donde se recomienda lavarse las manos hasta la muñeca tres veces antes de sumergirlas en el recipiente. En represalia, una herida que no sea mortal solo está sujeta a represalia si el corte se realiza en una articulación. Por dinero de sangre, cada falange del dedo conlleva una decimotercera parte de la diya completa, y el pulgar dos falanges de una vigésima parte cada una. La mayoría de los juristas sostienen que la mano de un ladrón se corta en la articulación de la muñeca y su pie en la articulación del tobillo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14827} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14828}"
  fr: "Une articulation (mafsil) est, au sens littéral, la jonction de deux os du corps; au sens technique, c'est le point de jonction entre deux organes, reliés par des ligaments. Ses règles interviennent dans les ablutions et les lavages, où il est recommandé de se laver les mains jusqu'aux poignets trois fois avant de les plonger dans le récipient. En cas de représailles, une blessure non mortelle n'est passible de représailles que si la coupure est infligée au niveau d'une articulation. Pour le prix du sang, chaque phalange d'un doigt vaut un treizième de la diya entière, et les deux phalanges du pouce, un vingtième chacune. La plupart des juristes considèrent que la main d'un voleur est coupée au niveau du poignet et son pied au niveau de la cheville. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14827} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14828}"
