id: concept/mafsil
class: concept
kind: legal
label:
  ar: المَفْصِل
  en: Joint (mafsil)
  ur: مفصل (جوڑ)
summary:
  ar: "المفصل في اللغة ملتقى العظمين من الجسد، وفي الاصطلاح موضع اتصال عضو بآخر برباطات واصلة بين عظمين. ويتعلق به حكم في الوضوء والغسل، إذ يُسن غسل اليدين إلى الرسغ ثلاثا قبل إدخالهما الإناء. وفي القصاص لا يجب القصاص فيما دون النفس إلا إذا كان القطع من مفصل. وفي الديات في قطع كل أنملة ثلث عشر الدية، وفي الإبهام نصف عشر لكل مفصل. وعند جمهور الفقهاء يكون قطع اليد في السرقة من الكوع، وهو مفصل الكف، وقطع الرجل من مفصل الكعب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14827} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14828}"
  en: "A joint (mafsil) is, in lexical sense, the meeting of two bones in the body; in the technical sense it is the place where one organ joins another by ligaments connecting two bones. Its rulings appear in ablution and washing, where it is recommended to wash the hands up to the wrist three times before dipping them into the vessel. In retaliation, a wound short of death is subject to retaliation only if the cut is made at a joint. For blood-money, each finger phalanx carries a thirteenth of the full diya, and the thumb two phalanges of a twentieth each. Most jurists hold that a thief's hand is cut at the wrist joint and his foot at the ankle joint. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14827} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14828}"
  ur: "مفصل لغت میں جسم کی دو ہڈیوں کے ملنے کی جگہ ہے۔ وضو میں ہتھیلی کو کلائی تک تین بار دھونا مسنون ہے۔ قصاص میں جوڑ سے کٹنے پر ہی قصاص ہوتا ہے، اور چوری میں ہاتھ کلائی کے جوڑ سے اور پاؤں ٹخنے کے جوڑ سے کاٹا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14827} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14828}"
