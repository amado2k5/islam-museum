summary:
  ar: "المازريون شجرة من جنس اليتوع، حار يابس في الرابعة، جلاء منق مقشر شديد الحرافة، يستعمل خارجاً في البهق والقروح ويسهل الماء، وهو قاتل في بعض أصنافه، ويضر الكبد جداً {cite:canon-ibn-sina-print-v1 p.555}."
  en: "Mazaryun is a shrub of the euphorbia kind, hot and dry in the fourth degree, cleansing, purifying and peeling with great pungency; it is used outwardly for vitiligo and ulcers and loosens water, but some of its kinds are deadly and it harms the liver greatly {cite:canon-ibn-sina-print-v1 p.555}."
  ur: "مازریون یتوع کی جنس کا درخت ہے، چوتھے درجے میں گرم خشک، جلا دینے والا، صاف کرنے والا اور چھیلنے والا، بہت تیز؛ بیرونی طور پر برص اور زخموں میں استعمال ہوتا ہے اور پانی خارج کرتا ہے، لیکن اس کی بعض قسمیں مہلک ہیں اور جگر کو بہت نقصان دیتا ہے {cite:canon-ibn-sina-print-v1 p.555}۔"
