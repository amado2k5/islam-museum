  en: "Mazaryun (a spurge-like shrub)"
  ur: "مازریون"
  es: "Mazaryun (un arbusto parecido a un tártago)"
  fr: "Mazaryun (un arbuste ressemblant à une euphorbe)"
summary:
  ar: "المازريون شجرة من جنس اليتوع، حار يابس في الرابعة، جلاء منق مقشر شديد الحرافة، يستعمل خارجاً في البهق والقروح ويسهل الماء، وهو قاتل في بعض أصنافه، ويضر الكبد جداً {cite:canon-ibn-sina-print-v1 p.555}."
  en: "Mazaryun is a shrub of the euphorbia kind, hot and dry in the fourth degree, cleansing, purifying and peeling with great pungency; it is used outwardly for vitiligo and ulcers and loosens water, but some of its kinds are deadly and it harms the liver greatly {cite:canon-ibn-sina-print-v1 p.555}."
  ur: "مازریون یتوع کی جنس کا درخت ہے، چوتھے درجے میں گرم خشک، جلا دینے والا، صاف کرنے والا اور چھیلنے والا، بہت تیز؛ بیرونی طور پر برص اور زخموں میں استعمال ہوتا ہے اور پانی خارج کرتا ہے، لیکن اس کی بعض قسمیں مہلک ہیں اور جگر کو بہت نقصان دیتا ہے {cite:canon-ibn-sina-print-v1 p.555}۔"
  es: "Mazaryun es un arbusto del tipo euforbia, cálido y seco en cuarto grado, limpiador, purificador y exfoliante con gran agresividad; se usa externamente para el vitíligo y las úlceras y afloja el agua, pero algunas de sus variedades son mortales y daña mucho el hígado {cite:canon-ibn-sina-print-v1 p.555}."
  fr: "Mazaryun est un arbuste de l'espèce euphorbe, chaud et sec au quatrième degré, nettoyant, purifiant et exfoliant avec une grande force piquante; il est utilisé en usage externe pour le vitiligo et les ulcères et dissout l'eau, mais certaines de ses espèces sont mortelles et nuisent grandement au foie {cite:canon-ibn-sina-print-v1 p.555}."
