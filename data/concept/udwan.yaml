id: concept/udwan
class: concept
kind: legal
label:
  ar: "العُدْوَان"
  en: "Aggression (udwan)"
  ur: "عدوان"
  es: "Agresión (udwan)"
  fr: "Agression (udwan)"
summary:
  ar: "العدوان في اللغة التجاوز عن الحد، وفي الاستعمال الفقهي الأغلب التعدي على النفس أو المال بغير حق، مما يوجب القصاص أو الضمان {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11521}. والظلم والإثم ألفاظ قريبة، والعدوان أخص من الإثم وأعم في معناه من الظلم بحسب ما ذكره أهل اللغة والتفسير {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11522}. وحكمه يختلف باختلاف متعلقه: فالعدوان على النفس أو الأعضاء عمداً حرام موجب للقصاص، والعدوان على المال بالسرقة أو الحرابة موجب للحد، والاستيلاء على حق الغير عدواناً كالغصب والنهب يوجب الضمان، والعدوان على الأعراض بالزنا أو القذف موجب للحد، وبما دون ذلك للتعزير {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11523}."
  en: "Linguistically, udwan means going beyond a limit; in the jurists' usage it mostly refers to an unjust attack on a person's life or property, which calls for retaliation (qisas) or compensation (daman) {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11521}. Related words are zulm and ithm: the lexicographers and commentators treat udwan as narrower than sin and as close in meaning to injustice {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11522}. Its ruling depends on its object: a deliberate attack on life or limbs is forbidden and entails retaliation; theft or armed robbery against property entails the fixed penalty (hadd); the seizure of another's right by aggression, such as usurpation or plunder, entails compensation; and aggression against honour, through unlawful intercourse or slander, entails the hadd, while lesser offences entail discretionary punishment (tazir) {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11523}."
  es: "Lingüísticamente, udwan significa ir más allá de un límite; en el uso de los juristas se refiere principalmente a un ataque injusto a la vida o propiedad de una persona, que requiere represalia (qisas) o compensación (daman) {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11521}. Palabras relacionadas son zulm e ithm: los lexicógrafos y comentaristas tratan a udwan como más restringido que pecado y como cercano en significado a injusticia {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11522}. Su dictamen depende de su objeto: un ataque deliberado a la vida o miembros está prohibido y conlleva represalia; el robo o robo a mano armada contra propiedad conlleva la pena fija (hadd); la toma del derecho de otro por agresión, como usurpación o saqueo, conlleva compensación; y la agresión contra el honor, a través de relaciones ilícitas o calumnias, conlleva el hadd, mientras que los delitos menores conllevan un castigo discrecional (tazir) {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11523}."
  fr: "Linguistiquement, udwan signifie dépasser une limite; dans l’usage juridique, il désigne principalement une atteinte injuste à la vie ou aux biens d’une personne, entraînant une riposte (qisas) ou une réparation (daman) {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11521}. Les termes apparentés sont zulm et ithm: les lexicographes et commentateurs considèrent udwan comme ayant une portée plus restreinte que le péché et un sens plus proche de l’injustice {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11522}. Son application dépend de son objet: une atteinte délibérée à la vie ou à l’intégrité physique est interdite et entraîne une riposte; le vol ou le vol à main armée contre des biens entraîne la peine fixe (hadd); la saisie du droit d’autrui par l’agression, comme l’usurpation ou le pillage, entraîne une réparation. et l'agression contre l'honneur, par le biais de relations illicites ou de calomnies, entraîne le hadd, tandis que les infractions mineures entraînent une peine discrétionnaire (tazir) {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11523}."
  ur: "لسانی اعتبار سے عودان کا مطلب ایک حد سے آگے جانا ہے۔ فقہاء کے استعمال میں اس سے مراد زیادہ تر کسی شخص کی جان یا مال پر ناجائز حملہ ہے، جس میں انتقام ⁦(قصاص)⁩ یا معاوضہ ⁦(دامن)⁩ کا مطالبہ کیا جاتا ہے۔ متعلقہ الفاظ زلم اور ثم ہیں: لغت نگار اور مفسرین عودوان کو گناہ سے تنگ اور ناانصافی کے قریب سمجھتے ہیں۔ اس کا حکم اس کے اعتراض پر منحصر ہے: جان بوجھ کر جان یا اعضاء پر حملہ حرام ہے اور اس کا بدلہ لینا ہے۔ جائیداد کے خلاف چوری یا مسلح ڈکیتی پر مقررہ جرمانہ ⁦(حد)⁩ شامل ہے؛ جارحیت کے ذریعے کسی دوسرے کے حق پر قبضہ کرنا، جیسے کہ غاصبانہ قبضہ یا لوٹ مار، معاوضہ پر مشتمل ہے۔ اور غیر قانونی جماع یا غیبت کے ذریعے غیرت کے خلاف جارحیت، حد کو داخل کرتی ہے، جب کہ اس سے کم جرائم میں صوابدیدی سزا ⁦(تذیر)⁩ {حوالہ: فقہ الموسوعہ-کویتیہ-نور-v3 صفحہ 11523}۔"
