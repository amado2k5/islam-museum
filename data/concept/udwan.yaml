class: concept
kind: legal
label:
  ar: "العُدْوَان"
  en: "Aggression (udwan)"
  ur: "عدوان"
summary:
  ar: "العدوان في اللغة التجاوز عن الحد، وفي الاستعمال الفقهي الأغلب التعدي على النفس أو المال بغير حق، مما يوجب القصاص أو الضمان {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11521}. والظلم والإثم ألفاظ قريبة، والعدوان أخص من الإثم وأعم في معناه من الظلم بحسب ما ذكره أهل اللغة والتفسير {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11522}. وحكمه يختلف باختلاف متعلقه: فالعدوان على النفس أو الأعضاء عمداً حرام موجب للقصاص، والعدوان على المال بالسرقة أو الحرابة موجب للحد، والاستيلاء على حق الغير عدواناً كالغصب والنهب يوجب الضمان، والعدوان على الأعراض بالزنا أو القذف موجب للحد، وبما دون ذلك للتعزير {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11523}."
  en: "Linguistically, udwan means going beyond a limit; in the jurists' usage it mostly refers to an unjust attack on a person's life or property, which calls for retaliation (qisas) or compensation (daman) {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11521}. Related words are zulm and ithm: the lexicographers and commentators treat udwan as narrower than sin and as close in meaning to injustice {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11522}. Its ruling depends on its object: a deliberate attack on life or limbs is forbidden and entails retaliation; theft or armed robbery against property entails the fixed penalty (hadd); the seizure of another's right by aggression, such as usurpation or plunder, entails compensation; and aggression against honour, through unlawful intercourse or slander, entails the hadd, while lesser offences entail discretionary punishment (tazir) {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11523}."
