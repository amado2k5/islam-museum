id: concept/freedom-of-property-in-islam
class: concept
kind: legal
label:
  ar: "الحرية في الأموال"
  en: "Freedom of property in Islam"
  es: "Libertad de propiedad en el Islam"
  fr: "La liberté de propriété en islam"
  ur: "اسلام میں جائیداد کی آزادی"
summary:
  ar: "يعالج محمد الخضر حسين الحرية في الأموال في أربعة مطالب: اكتسابها، وطريقها الوسط، والتمتع بها، والاعتداء عليها {cite:al-hurriyya-fi-al-islam-azhar p. 62}. ويرى أن الشريعة حثّت على السعي في الرزق بكل عمل مشروع لا يضر أحدًا، وأن الاشتغال بالتجارة مذموم حين يشغل عن الواجبات، لا لذاتها {cite:al-hurriyya-fi-al-islam-azhar p. 62} {cite:al-hurriyya-fi-al-islam-azhar p. 63}. ويعد الحرف والصناعات من فروض الكفاية، ويقسم الناس في ذلك إلى أربع طبقات: ولاة الأمور، وأهل العلم والمعارف، وأهل التجارة، وأهل الصنائع والفلاحة {cite:al-hurriyya-fi-al-islam-azhar p. 64}. ثم يشرع في تفصيل انتقال الأموال بالعقود، وقد ظهر من هذا الجزء أن الكتاب يعرض الباب كله في ضوء المقصد لا التفصيل الفقهي."
  en: "Muhammad al-Khidr Husayn treats freedom of property under four heads: acquiring wealth, its middle course, enjoying it, and aggression against it (p. 62). He holds that the law urges work for a living by any lawful trade that harms no one, and that commerce is blamed only when it distracts from duties (pp. 62-63). He counts crafts and trades among communal obligations and divides people into four classes by their roles: rulers, those who spread knowledge, traders, and craftsmen and farmers (p. 64). He then begins to set out how property passes by contract (p. 65)."
  es: "Muhammad al-Khidr Husayn aborda la libertad de propiedad desde cuatro perspectivas: la adquisición de riqueza, su uso, su disfrute y la agresión contra ella (p. 62). Sostiene que la ley insta a ganarse la vida mediante cualquier oficio lícito que no perjudique a nadie, y que el comercio solo se censura cuando distrae del cumplimiento de los deberes (pp. 62-63). Considera los oficios y las artesanías como obligaciones comunitarias y divide a las personas en cuatro clases según sus funciones: gobernantes, divulgadores del conocimiento, comerciantes, artesanos y agricultores (p. 64). A continuación, comienza a explicar cómo se transmite la propiedad mediante contrato (p. 65)."
  fr: "Muhammad al-Khidr Husayn aborde la liberté de propriété sous quatre angles: l’acquisition de richesses, leur entretien, leur jouissance et l’atteinte à ces richesses (p. 62). Il soutient que la loi encourage le travail pour subvenir à ses besoins par tout commerce licite qui ne nuit à personne, et que le commerce n’est répréhensible que lorsqu’il détourne de l’accomplissement des devoirs (pp. 62-63). Il considère l’artisanat et le commerce comme des obligations communautaires et répartit la population en quatre classes selon son rôle: les dirigeants, les dispensateurs de savoir, les commerçants, et les artisans et agriculteurs (p. 64). Il expose ensuite comment la propriété est transmise par contrat (p. 65)."
  ur: "محمد الخضر حسین جائیداد کی آزادی کو چار عنوانات کے تحت دیکھتے ہیں: دولت کا حصول، اس کا درمیانی راستہ، اس سے لطف اندوز ہونا، اور اس کے خلاف جارحیت ⁦(ص 62)⁩۔ اس کا خیال ہے کہ قانون کسی بھی حلال تجارت کے ذریعہ معاش کے لئے کام کرنے پر زور دیتا ہے جس سے کسی کو نقصان نہیں پہنچتا ہے، اور اس تجارت کو صرف اس وقت مورد الزام ٹھہرایا جاتا ہے جب یہ فرائض سے توجہ ہٹاتی ہے (pp. 62-63)۔ وہ دستکاری اور تجارت کو فرقہ وارانہ ذمہ داریوں میں شمار کرتا ہے اور لوگوں کو ان کے کردار کے لحاظ سے چار طبقوں میں تقسیم کرتا ہے: حکمران، علم پھیلانے والے، تاجر، اور کاریگر اور کسان ⁦(ص 64)⁩۔ اس کے بعد وہ یہ طے کرنا شروع کر دیتا ہے کہ معاہدے کے ذریعے جائیداد کیسے گزرتی ہے ⁦(ص 65)⁩۔"
