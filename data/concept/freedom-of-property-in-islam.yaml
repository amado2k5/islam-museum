label:
  ar: "الحرية في الأموال"
  en: "Freedom of property in Islam"
summary:
  ar: "يعالج محمد الخضر حسين الحرية في الأموال في أربعة مطالب: اكتسابها، وطريقها الوسط، والتمتع بها، والاعتداء عليها {cite:al-hurriyya-fi-al-islam-azhar p. 62}. ويرى أن الشريعة حثّت على السعي في الرزق بكل عمل مشروع لا يضر أحدًا، وأن الاشتغال بالتجارة مذموم حين يشغل عن الواجبات، لا لذاتها {cite:al-hurriyya-fi-al-islam-azhar p. 62} {cite:al-hurriyya-fi-al-islam-azhar p. 63}. ويعد الحرف والصناعات من فروض الكفاية، ويقسم الناس في ذلك إلى أربع طبقات: ولاة الأمور، وأهل العلم والمعارف، وأهل التجارة، وأهل الصنائع والفلاحة {cite:al-hurriyya-fi-al-islam-azhar p. 64}. ثم يشرع في تفصيل انتقال الأموال بالعقود، وقد ظهر من هذا الجزء أن الكتاب يعرض الباب كله في ضوء المقصد لا التفصيل الفقهي."
  en: "Muhammad al-Khidr Husayn treats freedom of property under four heads: acquiring wealth, its middle course, enjoying it, and aggression against it (p. 62). He holds that the law urges work for a living by any lawful trade that harms no one, and that commerce is blamed only when it distracts from duties (pp. 62-63). He counts crafts and trades among communal obligations and divides people into four classes by their roles: rulers, those who spread knowledge, traders, and craftsmen and farmers (p. 64). He then begins to set out how property passes by contract (p. 65)."
