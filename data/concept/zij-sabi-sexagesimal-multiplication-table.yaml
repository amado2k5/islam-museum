label: { ar: "جدول ضرب الأجناس الستينية", en: "The table for multiplying sexagesimal orders", ur: "ستینی اجناس کے ضرب کا جدول", es: "La tabla para multiplicar los órdenes sexagesimales", fr: "Tableau de multiplication des ordres sexagésimaux", tr: "Altmışlık çarpım tablosu", id: "Tabel perkalian seksagemial" }
summary:
  ar: "يضع البتاني جدولين مرتبين لمعرفة جنس حاصل ضرب أي جنسين من أجناس الدرج والكسور دون حساب، ويشرح طريقة استعمالهما: يؤخذ أحد الجنسين من سطر الجدول الأول في العرض ويُخرج منه على استقامة إلى أن يوازي الجنس الآخر في الجدول الثاني، فالبيت الذي يلتقيان فيه هو جنس الحاصل. {cite:zij-sabi-nallino-byblion pp.13-14}."
  en: "Al-Battani sets two arranged tables for finding the order of the product of any two orders of degrees and fractions without computing, and explains their use: take one order from the first table's row along the width, run straight out from it until it faces the other order in the second table, and the cell where they meet is the order of the product. {cite:zij-sabi-nallino-byblion pp.13-14}."
  ur: "البتانی دو مرتب جدول رکھتے ہیں تاکہ درجوں اور کسور کی کسی بھی دو اجناس کے حاصل ضرب کی جنس بغیر حساب کے معلوم ہو، اور ان کے استعمال کا طریقہ بتاتے ہیں: پہلے جدول کی چوڑائی کی ایک سطر سے ایک جنس لی جاتی ہے، اس سے سیدھے نکل کر دوسرے جدول میں دوسری جنس کے محاذی پہنچا جاتا ہے، اور جس خانے میں دونوں ملیں وہ حاصل کی جنس ہے۔ {cite:zij-sabi-nallino-byblion pp.13-14}۔"
  es: "Al-Battani dispone dos tablas para hallar el orden del producto de dos órdenes cualesquiera de grados y fracciones sin necesidad de realizar cálculos, y explica su uso: se toma un orden de la primera fila a lo largo del ancho, se traza una línea recta desde él hasta que se encuentre frente al otro orden en la segunda tabla, y la celda donde se cruzan es el orden del producto. {cite:zij-sabi-nallino-byblion pp.13-14}."
  fr: "Al-Battani propose deux tableaux ordonnés permettant de trouver l'ordre du produit de deux ordres de degrés et de fractions quelconques sans calcul, et explique leur utilisation: prendre un ordre dans la première ligne du tableau, suivre la largeur, puis tracer une ligne droite jusqu'à ce qu'elle fasse face à l'autre ordre dans le second tableau; la case où ils se rencontrent correspond à l'ordre du produit. {cite:zij-sabi-nallino-byblion pp.13-14}."
  tr: "Al-Battani, herhangi iki derece ve kesir cinsiyetinin çarpımının cinsiyetini hesaplama yapmadan belirlemek için iki sıralı tablo sunar ve bunların nasıl kullanılacağını açıklar: Tablonun ilk satırından bir cinsiyet alınır ve ikinci tablodaki diğer cinsiyete paralel olana kadar düz bir şekilde çizilir. Bunların kesiştiği nokta, çarpımın cinsiyetidir. {cite:zij-sabi-nallino-byblion pp.13-14}."
  id: "Al-Battani menyediakan dua tabel berurutan untuk menentukan jenis kelamin hasil perkalian dua jenis kelamin derajat dan pecahan tanpa perhitungan, dan menjelaskan cara menggunakannya: Satu jenis kelamin diambil dari baris pertama tabel dan ditarik lurus hingga sejajar dengan jenis kelamin lainnya di tabel kedua. Rumah tempat keduanya bertemu adalah jenis kelamin hasil perkalian tersebut. {cite:zij-sabi-nallino-byblion pp.13-14}."
