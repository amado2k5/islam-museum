summary:
  ar: "المني ماء الرجل والمرأة الغليظ الدافق الذي يخرج عند اشتداد الشهوة. وللفقهاء فيه أحكام: الاستمناء باليد وحكمه، وطهارته ونجاسته، وأثره في الوضوء والغسل، وفي الصوم عند المباشرة والنظر، وطريقة تطهير الثوب منه، وأثر انقطاعه في الخيار بين الزوجين."
  en: "Mani is the thick, gushing fluid of a man or a woman that comes out at the height of desire. The jurists rule on self-stimulation, on whether mani is pure or impure, on its effect on ablution and on the full bath, on fasting when touch or gaze causes it, on how to clean a garment soiled by it, and on whether its absence gives a wife the right to separate."
  ur: "منی وہ گاڑھا اور اچھلنے والا مادہ ہے جو شہوت کے زور پر مرد یا عورت سے نکلتا ہے۔ فقہاء نے اس کی طہارت و نجاست، وضو اور غسل پر اثر، روزے پر اثر، کپڑے کو پاک کرنے کے طریقے، اور انقطاع کے نکاح پر اثر کے احکام بیان کیے ہیں۔"
