summary:
  ar: "المني ماء الرجل والمرأة الغليظ الدافق الذي يخرج عند اشتداد الشهوة. وللفقهاء فيه أحكام: الاستمناء باليد وحكمه، وطهارته ونجاسته، وأثره في الوضوء والغسل، وفي الصوم عند المباشرة والنظر، وطريقة تطهير الثوب منه، وأثر انقطاعه في الخيار بين الزوجين."
  en: "Mani is the thick, gushing fluid of a man or a woman that comes out at the height of desire. The jurists rule on self-stimulation, on whether mani is pure or impure, on its effect on ablution and on the full bath, on fasting when touch or gaze causes it, on how to clean a garment soiled by it, and on whether its absence gives a wife the right to separate."
  ur: "منی وہ گاڑھا اور اچھلنے والا مادہ ہے جو شہوت کے زور پر مرد یا عورت سے نکلتا ہے۔ فقہاء نے اس کی طہارت و نجاست، وضو اور غسل پر اثر، روزے پر اثر، کپڑے کو پاک کرنے کے طریقے، اور انقطاع کے نکاح پر اثر کے احکام بیان کیے ہیں۔"
  es: "Mani es el fluido espeso y abundante que un hombre o una mujer expulsa en el clímax del deseo. Los juristas dictaminan sobre la autoestimulación, sobre si el mani es puro o impuro, sobre su efecto en la ablución y en el baño completo, sobre el ayuno cuando el contacto o la mirada lo provocan, sobre cómo limpiar una prenda manchada con él y sobre si su ausencia otorga a la esposa el derecho a la separación."
  fr: "Le mani est le liquide épais et abondant qui s'écoule chez l'homme ou la femme lors d'un désir intense. Les juristes statuent sur la masturbation, sur la pureté ou l'impureté du mani, sur son effet sur les ablutions et le bain complet, sur le jeûne lorsqu'il est provoqué par le toucher ou le regard, sur la manière de nettoyer un vêtement souillé et sur le droit de l'épouse à la séparation en cas d'absence de mani."
  tr: "Meni, arzu arttığında boşaltılan kalın, akan sudur. Hukukçuların bu konuda hükümleri vardır: elle mastürbasyon ve onun yönetimi, saflığı ve kirliliği, abdest alma ve yıkama üzerindeki etkisi, doğrudan temas ve bakma sırasında oruç, giysiyi arındırma yöntemi ve bırakılmasının eşler arasındaki seçime etkisi."
  id: "Sperma adalah air kental dan mengalir dari pria dan wanita yang dilepaskan ketika hasrat semakin kuat. Para ahli hukum memiliki keputusan: masturbasi dengan tangan dan keputusannya, kemurnian dan ketidakmurniannya, pengaruhnya terhadap wudhu dan pencucian, puasa saat kontak langsung dan menatap, metode pemurnian pakaian dari air tersebut, dan efek penghentiannya terhadap pilihan antara pasangan."
