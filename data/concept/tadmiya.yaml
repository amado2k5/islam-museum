label:
  ar: "التدمية"
  en: "Tadmiya (the dying man's word that he was killed)"
  ur: "تدمیہ ⁦(مقتول کا مرتے وقت کسی کا نام لینا)⁩"
  es: "Tadmiya (la palabra del moribundo de que fue asesinado)"
  fr: "Tadmiya (les paroles du mourant disant qu'il a été tué)"
  tr: "hemorajik"
  id: "berdarah"
summary:
  ar: "التدمية قول المقتول قبل موته: دمي عند فلان، أو قتلني فلان، وهو اصطلاح المالكية. وهي عندهم من اللوث الذي تثبت به القسامة إذا كان بالمقتول جرح أو أثر ضرب، وتسمى التدمية الحمراء، أما التدمية البيضاء التي لا جرح معها فلا يقبل قولها في المشهور إلا بالبينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4903}"
  en: "Tadmiya is the words of a slain man before he dies: my blood is on so-and-so, or so-and-so killed me. It is a term of the Malikis. They count it as the sign (lawth) that establishes qasama when there is a wound or a mark of a blow, called the red tadmiya; a white tadmiya without a wound is, in the accepted view, not accepted without proof. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4903}"
  es: "Tadmiya son las palabras de un hombre asesinado antes de morir: «Mi sangre está sobre fulano», o «Fulano me mató». Es un término de los malikíes. Lo consideran la señal (lawth) que establece la qasama cuando hay una herida o la marca de un golpe, llamada tadmiya roja; una tadmiya blanca sin herida, según la opinión generalizada, no se acepta sin prueba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4903}"
  fr: "La tadmiya désigne les paroles d'un homme tué avant de mourir: « Mon sang est sur untel » ou « Untel m'a tué ». C'est un terme malikite. Ils la considèrent comme le signe (lawth) établissant le qasama lorsqu'il y a une blessure ou une marque de coup, appelée tadmiya rouge; une tadmiya blanche sans blessure n'est, selon l'opinion communément admise, pas acceptée sans preuve. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4903}"
  ur: "تدمیہ مرنے سے پہلے ایک مقتول کے الفاظ ہیں: میرا خون فلاں پر ہے، یا فلاں نے مجھے مارا۔ یہ مالکیوں کی اصطلاح ہے۔ وہ اسے نشانی ⁦(قانون)⁩ کے طور پر شمار کرتے ہیں جو زخم یا ضرب کا نشان ہونے پر قصمہ قائم کرتا ہے، جسے سرخ تدمیہ کہتے ہیں۔ بغیر زخم کے سفید تدمیہ قابل قبول نظریہ ہے بغیر ثبوت کے قابل قبول نہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 4902}"
  tr: "Tadmiyye, öldürülen kişinin ölümünden önce söylediği ifadeye atıfta bulunur: 'Kanım şu ve şu kişiyle birlikte' ya da 'Şu şu kişi beni öldürdü' ki bu Maliki terimidir. Onlara göre, kurbanın bir yarası veya üfleme izi varsa qasama olduğunu kanıtlayan bir kirlilik biçimidir ve buna 'kırmızı tammiyah' denir. Yarası olmayan beyaz tammiyah ise, bilinen görüşte kanıt dışında bu ifadesi kabul edilmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4903}"
  id: "Tadmiyyah merujuk pada pernyataan orang yang dibunuh sebelum kematiannya: 'Darah saya bersama si anu,' atau 'Si yang membunuh saya,' yang merupakan terminologi Maliki. Menurut mereka, ini adalah bentuk polusi yang membuktikan qasama jika korban memiliki luka atau jejak pukulan, dan disebut 'tammiyah merah.' Adapun tammiyah putih yang tidak memiliki luka, pernyataannya tidak diterima dalam opini yang dikenal kecuali dengan bukti. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4902} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.4903}"
