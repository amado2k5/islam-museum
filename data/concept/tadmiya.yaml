label:
  ar: "التدمية"
  en: "Tadmiya (the dying man's word that he was killed)"
  ur: "تدمیہ (مقتول کا مرتے وقت کسی کا نام لینا)"
summary:
  ar: "التدمية قول المقتول قبل موته: دمي عند فلان، أو قتلني فلان، وهو اصطلاح المالكية. وهي عندهم من اللوث الذي تثبت به القسامة إذا كان بالمقتول جرح أو أثر ضرب، وتسمى التدمية الحمراء، أما التدمية البيضاء التي لا جرح معها فلا يقبل قولها في المشهور إلا بالبينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4903}"
  en: "Tadmiya is the words of a slain man before he dies: my blood is on so-and-so, or so-and-so killed me. It is a term of the Malikis. They count it as the sign (lawth) that establishes qasama when there is a wound or a mark of a blow, called the red tadmiya; a white tadmiya without a wound is, in the accepted view, not accepted without proof. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4903}"
