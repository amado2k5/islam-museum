summary:
  ar: "العدس في الكتاب جنس مأكول مشهور وجنس بري رديء مر، والمأكول معتدل في الحر واليبس أو مائل يسيرا إلى الحرارة، فيه قبض وجلاء ونفخ، يغلظ الدم ويقل البول ويولد خلطا سوداويا، ويعقل البطن مطبوخا بقشره، ويضمد به الورم والقروح {cite:canon-ibn-sina-print-v1 pp.617-619}"
  en: "Adas is in the book an edible kind, well known, and a wild, bad, bitter kind; the edible lentil is moderate in heat and dryness or inclined slightly to heat, astringent and cleansing and causing wind, thickening the blood, lessening urine and engendering a black-bile humour, restraining the bowels when cooked with its husk, and used as a poultice on swellings and ulcers {cite:canon-ibn-sina-print-v1 pp.617-619}"
  fr: "Le traité distingue la lentille comestible, bien connue, d’une lentille sauvage, mauvaise et amère. Il décrit la lentille comestible comme modérément chaude et sèche, ou légèrement portée vers la chaleur, astringente et nettoyante. Il lui attribue la production de vents, l’épaississement du sang, la diminution de l’urine et la formation d’une humeur de bile noire. Selon le traité, cuite avec son enveloppe, elle resserre les intestins ; elle figure aussi parmi les cataplasmes pour les tuméfactions et les ulcères {cite:canon-ibn-sina-print-v1 pp.617-619}"
  ur: "عدس کتاب میں ایک کھانے کی مشہور قسم اور ایک جنگلی، ناقص اور کڑوی قسم ہے؛ کھانے والا عدس گرمی اور خشکی میں معتدل یا ذرا گرمی کی طرف مائل ہے، اس میں قبض، جلاء اور نفخ ہے، خون کو گاڑھا کرتا، پیشاب کو کم کرتا اور سودائی خلط پیدا کرتا ہے، چھلکے سمیت پکایا جائے تو پیٹ کو روکتا ہے، اور ورموں اور زخموں پر ضماد کیا جاتا ہے {cite:canon-ibn-sina-print-v1 pp.617-619}۔"
  es: "Adas es en el libro una variedad comestible, bien conocida, y una variedad silvestre, mala y amarga; la lenteja comestible es moderada en calor y sequedad o ligeramente inclinada al calor, astringente y depurativa y causante de gases, espesa la sangre, disminuye la orina y genera un humor de bilis negra, restringe los intestinos cuando se cocina con su cáscara, y se usa como cataplasma para hinchazones y úlceras {cite:canon-ibn-sina-print-v1 pp.617-619}"
