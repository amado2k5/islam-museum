id: concept/dharq-fiqh
class: concept
kind: legal
label:
  ar: "الذرق (في الفقه)"
  en: "Dharq (bird droppings and their purity in fiqh)"
  ur: "ذرق (پرندوں کی بیٹ اور اس کی طہارت)"
summary:
  ar: "الذرق خرء الطائر، وهو طاهر عند جمهور الفقهاء في الطيور المأكولة اللحم، ونجس عند الشافعية، وذرق ما لا يؤكل لحمه نجس عند الجمهور، وعند الحنفية الأصح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8418} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8419} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8420} ويعفى عن القليل من النجاسة منه عند أكثر الفقهاء لمشقة الاحتراز، ويعفى عند الحنفية عن ما دون ربع الثوب في الذرق الخفيف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8420} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8421}"
  en: "Dharq is a bird's droppings. The majority hold it pure for birds whose flesh is eaten, while the Shafi'is hold it impure; the droppings of birds whose flesh is not eaten are impure by the majority and, in the sounder Hanafi view, too. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8418} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8419} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8420} Most jurists excuse a small amount of impurity from it because it is hard to avoid; the Hanafis excuse less than a quarter of a garment for the lighter kind. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8420} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8421}"
  ur: "ذرق پرندے کی بیٹ کو کہتے ہیں۔ حلال پرندوں کی بیٹ جمہور کے نزدیک پاک ہے، جبکہ شافعیہ اسے نجس کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8419} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8420}"
