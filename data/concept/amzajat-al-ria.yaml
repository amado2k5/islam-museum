id: concept/amzajat-al-ria
class: concept
kind: scientific
label:
  ar: "أمزجة الرئة"
  en: "The temperaments of the lung"
  ur: "پھیپھڑے کے مزاج"
summary:
  ar: "يدل على المزاج الحار للرئة سعة الصدر وعظم النفس وربما تضاعف والنفخة وثقل الصوت وقلة التضرر بالهواء البارد وكثرته بالحار وعطش يسكنه النسيم البارد، وكثيراً ما يصحبه لهب وسعال، وعلى البارد ما يقابله، وعلى الرطب كثرة الفضول وبحوحة الصوت والخرخرة خصوصاً إذا كانت مع مادة مائلة إلى فوق والعجز عن رفع الصوت لا لضعف البدن، وعلى اليابس قلة الفضول وخشونة الصوت ومشابهته بصوت الكراكي وربما كان هناك ربو لشدة التكاثف، وكل واحد من هذه الأمزجة قد يكون طبيعياً وقد يكون عرضياً ويشتركان في شيء من العلامات ويفترقان في أن الطبيعي تكون العلامة فيه واقعة بالطبع والعرضي عارضة {cite:canon-ibn-sina-print-v2 p.304}"
  en: "A hot temperament of the lung is shown by a broad chest, a large breath — sometimes doubled — puffing, a heavy voice, little hurt from cold air and much from hot, a thirst that the cold breeze often settles without drinking, and frequently a burning and a cough attending it; the cold shows the opposite. The moist is shown by many residues, hoarseness of voice and a rattling — above all when with matter inclining upward — and inability to raise the voice not from bodily weakness; the dry by few residues, a harsh voice like the crane's, and sometimes asthma for the thickness of the packing. Each of these temperaments may be natural or accidental; they share some signs and differ in this: in the natural the sign is by nature, in the accidental the sign is incidental — unless the sign is of the kind that only occurs by nature, like the chest's largeness or smallness {cite:canon-ibn-sina-print-v2 p.304}"
  ur: "پھیپھڑے کے گرم مزاج کی علامتیں ہیں سینے کی وسعت نفس کا بڑا ہونا — کبھی دہرا بھی — پھونکنا آواز کا بھاری ہونا ٹھنڈی ہوا سے کم اور گرم سے زیادہ تکلیف ایسا پیاس جو ٹھنڈی ہوا سے بغیر پانی کے ٹھٹھے اور اکثر اس کے ساتھ جلن اور کھانسی ہوتی ہے؛ ٹھنڈے کی اس کے مقابل علامتیں ہیں؛ تر مزاج کی علامت فضول کی کثرت آواز کی بحوحہ گھڑگھڑاہٹ خصوصاً جب مادہ اوپر کی طرف ہو اور کمزوری بدن کے بغیر آواز بلند نہ کر سکنا؛ خشک کی علامت فضول کی قلت آواز کی خشونی اور کرکس کی آواز سے مشابہت اور کبھی گاڑھی گنجان مادہ سے ربو بھی ہوتا ہے؛ ان مزاجوں میں سے ہر ایک طبیعی بھی ہو سکتا ہے اور عارضی بھی؛ دونوں کچھ علامتوں میں شریک ہیں اور اس میں فرق کرتے ہیں کہ طبیعی میں علامت بطبیعت ہوتی ہے اور عارضی میں وہ عارض ہوتی ہے {cite:canon-ibn-sina-print-v2 p.304}"
