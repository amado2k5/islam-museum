summary:
  fr: "Le Canon attribue au crottin de cheval l'action de celui de l'âne {cite:canon-ibn-sina-print-v1 p.635}."
  ar: "الفرس في الكتاب حيوان تذكر في أجزائه أخبار منسوبة: زبله كزبل الحمار، وجلد المهر المحرق على البثور، وزوائد ركبه للصداع، وأنفحته للإسهال المزمن وقروح الأمعاء، وهي أخبار تنقل منسوبة لا نصيحة {cite:canon-ibn-sina-print-v1 pp.635-636}"
  en: "Faras is in the book the horse, with attributed reports on its parts: its dung acts like donkey dung, the burnt skin of the foal on pustules, the growths on its knees for headache, and its rennet for chronic diarrhoea and ulcers of the intestines, all passed on as attributed reports, not advice {cite:canon-ibn-sina-print-v1 pp.635-636}"
  ur: "فرس کتاب میں گھوڑا ہے، جس کے اعضاء کے بارے میں منسوب خبریں ہیں: اس کی لید گدھے کی لید جیسا کام کرتی ہے، بچھیرے کی جلی ہوئی کھال پھنسیوں پر، اس کے گھٹنوں کی ابھار سر درد کے لیے، اور اس کی انفحہ پرانے اسہال اور آنتوں کے زخموں کے لیے؛ یہ خبریں منسوب اطلاعات کے طور پر نقل ہیں، نصیحت کے طور پر نہیں {cite:canon-ibn-sina-print-v1 pp.635-636}۔"
