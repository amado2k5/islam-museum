summary:
  ar: "الفرس في الكتاب حيوان تذكر في أجزائه أخبار منسوبة: زبله كزبل الحمار، وجلد المهر المحرق على البثور، وزوائد ركبه للصداع، وأنفحته للإسهال المزمن وقروح الأمعاء، وهي أخبار تنقل منسوبة لا نصيحة {cite:canon-ibn-sina-print-v1 pp.635-636}"
  en: "Faras is in the book the horse, with attributed reports on its parts: its dung acts like donkey dung, the burnt skin of the foal on pustules, the growths on its knees for headache, and its rennet for chronic diarrhoea and ulcers of the intestines, all passed on as attributed reports, not advice {cite:canon-ibn-sina-print-v1 pp.635-636}"
  ur: "فرس کتاب میں گھوڑا ہے، جس کے اعضاء کے بارے میں منسوب خبریں ہیں: اس کی لید گدھے کی لید جیسا کام کرتی ہے، بچھیرے کی جلی ہوئی کھال پھنسیوں پر، اس کے گھٹنوں کی ابھار سر درد کے لیے، اور اس کی انفحہ پرانے اسہال اور آنتوں کے زخموں کے لیے؛ یہ خبریں منسوب اطلاعات کے طور پر نقل ہیں، نصیحت کے طور پر نہیں {cite:canon-ibn-sina-print-v1 pp.635-636}۔"
  es: "Faras es el caballo en el libro, con informes atribuidos sobre sus partes: su estiércol actúa como el estiércol de burro, la piel quemada del potro sobre las pústulas, los crecimientos en sus rodillas para el dolor de cabeza, y su cuajo para la diarrea crónica y las úlceras intestinales, todo transmitido como informes atribuidos, no como consejos {cite:canon-ibn-sina-print-v1 pp.635-636}"
  fr: "Le Faras est mentionné dans le livre, avec des attributions concernant ses parties: son fumier agit comme celui de l’âne, la peau brûlée du poulain sur les pustules, les excroissances sur ses genoux contre les maux de tête, et sa présure contre la diarrhée chronique et les ulcères intestinaux, le tout transmis comme attribution, et non comme conseils {cite:canon-ibn-sina-print-v1 pp.635-636}"
  tr: "Kitaptaki at, bazı kısımlarında atfedilen raporlardan bahsedilen bir hayvandır: eşek dışkısı gibi gübresi, su toplamasıyla yanmış bir tay derisi, baş ağrısı için diz uzuvları, kronik ishal ve bağırsak ülserleri için şişirilmiş olması, bunlar tavsiye değil, atıf olarak iletilen raporlardır {cite:canon-ibn-sina-print-v1 s.635-636}"
  id: "Kuda dalam buku adalah hewan yang bagian-bagiannya menyebutkan laporan yang dikaitkan: kotoran kandang seperti kotoran keledai, kulit anak kuda terbakar karena lepuhan, anggota tubuh lututnya untuk sakit kepala, dipompa untuk diare kronis dan tukak lambung usus, yang dilaporkan sebagai atribusi, bukan nasihat {cite:canon-ibn-sina-print-v1 hlm.635-636}"
