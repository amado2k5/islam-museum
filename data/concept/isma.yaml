label: { ar: "عصمة الأئمة", en: "the imams' infallibility" }
summary:
  ar: "عند أهل الإمامة من فرق الشيعة أن الإمام لا بد أن يكون معصوماً من الذنوب لأنه إن لم يكن معصوماً لم يؤمن أن يدخل فيما يدخل فيه غيره فيحتاج إلى إمام إلى غير نهاية، وأن يكون أعلم الخليقة وأشجعها وأسخاها، وأن الإمامة نص من الله ورسوله على عين الإمام ولا تخلو الأعصار من حجة لله فيهم ظاهراً أو باطناً {cite:muruj-al-dhahab p. 210-211}."
  en: "The Imami doctrine — the imam must be sinless lest he need an imam above him without end, the most learned, bravest and most generous of creation, designated by God's and His prophet's text in every age, manifest or hidden {cite:muruj-al-dhahab p. 210-211}."
