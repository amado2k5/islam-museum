id: concept/isma
class: concept
kind: doctrine
label: { ar: "عصمة الأئمة", en: "the imams' infallibility", es: "la infalibilidad de los imanes", fr: "l'infaillibilité des imams", ur: "ائمہ کی خطا", tr: "İmamların Yanılmazlığı", id: "Ketidaksalahan para Imam" }
summary:
  ar: "عند أهل الإمامة من فرق الشيعة أن الإمام لا بد أن يكون معصوماً من الذنوب لأنه إن لم يكن معصوماً لم يؤمن أن يدخل فيما يدخل فيه غيره فيحتاج إلى إمام إلى غير نهاية، وأن يكون أعلم الخليقة وأشجعها وأسخاها، وأن الإمامة نص من الله ورسوله على عين الإمام ولا تخلو الأعصار من حجة لله فيهم ظاهراً أو باطناً {cite:muruj-al-dhahab p. 210-211}."
  en: "The Imami doctrine — the imam must be sinless lest he need an imam above him without end, the most learned, bravest and most generous of creation, designated by God's and His prophet's text in every age, manifest or hidden {cite:muruj-al-dhahab p. 210-211}."
  es: "La doctrina imamí: el imán debe ser impecable para no necesitar un imán por encima de él sin fin, el más sabio, valiente y generoso de la creación, designado por el texto de Dios y de su profeta en cada época, manifiesta u oculta {cite:muruj-al-dhahab p. 210-211}."
  fr: "La doctrine Imami — l'imam doit être sans péché, de peur qu'il n'ait besoin d'un imam au-dessus de lui pour toujours, le plus savant, le plus courageux et le plus généreux de la création, désigné par le texte de Dieu et de Son prophète à chaque époque, manifeste ou caché {cite:muruj-al-dhahab p. 210-211}."
  ur: "امامی عقیدہ - امام کو بے گناہ ہونا چاہیے کہیں ایسا نہ ہو کہ اسے اپنے اوپر کسی ایسے امام کی ضرورت نہ ہو جو بے انتہا علم رکھتا ہو، سب سے زیادہ علم والا، بہادر اور سب سے زیادہ سخی، ہر دور میں خدا اور اس کے نبی کے متن کے ذریعے ظاہر یا پوشیدہ۔ 210-211}۔"
  tr: "Şii mezhebine mensup İmamat halkına göre, İmam günahlardan sapmaz olmalıdır çünkü eğer yanılmaz olmasaydı, başkalarının yapacağı şeylere girmeye inanmazdı, bu yüzden sonsuz bir İmama ihtiyaç duyardı ve yaratılışın en bilgili, daha cesur ve cömert olanı olmalıdır. İmamatlık, Allah'ın ve Onun Elçi'nin imamın gözünde verdiği bir emrdir ve çağlar Allah'ın bu konuda, ister görünüşte ister içten, kanıtsız değildir. {cite:Muric-al-Dhahab s. 210-211}."
  id: "Menurut umat Imamate dari sekte Syiah, Imam harus tidak pernah salah dari dosa karena jika ia tidak sempurna, ia tidak akan percaya untuk masuk ke dalam apa yang dilakukan orang lain, sehingga membutuhkan Imam tanpa henti, dan bahwa ia harus menjadi yang paling berpengetahuan, lebih berani, dan murah hati dalam ciptaan. Imamate adalah sebuah perintah dari Allah dan Rasul-Nya di mata Imam, dan zaman-zaman tidak tanpa bukti bagi Allah mengenai mereka, baik secara nyata maupun batin. {cite:muruj-al-dhahab hlm. 210-211}."
