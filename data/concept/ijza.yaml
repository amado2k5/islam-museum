id: concept/ijza
class: concept
kind: legal
label: { ar: "إجزاء", en: "Sufficiency of an act (ijza')", es: "Suficiencia de un acto (ijza')", fr: "Suffisance d'un acte (ijza')" }
summary:
  ar: "الإجزاء في اللغة الكفاية والإغناء، وفي الشرع إغناء الفعل عن المطلوب ولو من غير زيادة عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1594} ويفترق الإجزاء عن الجواز، لأن الجواز يطلق على ما لا يمتنع شرعاً، ويفترق عن الحل، لأن الإجزاء قد يقع مع الشوائب كالكراهة، أما الحل فهو الخالص من كل شائبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1594} ويكون التصرف مجزئاً إذا استجمع شرائطه وأركانه وواجباته عند الحنابلة، فيجزئ في الوضوء الإتيان بفرائضه دون سننه ومستحباته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1595} ويجزئ التطهر بالماء ولو كان مملوكاً للغير عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1595}"
  en: "Ijza' in the lexicon means sufficiency and being enough. In law it is an act's being enough to meet what is required, even without anything added to it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1594} It differs from permissibility (jawaz), which means that nothing forbids the act, and from lawfulness (hill), which means purity from every blemish: an act may be sufficient while disliked. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1594} In the Hanbali view an act suffices when it has all its conditions, pillars and obligations, so ablution is sufficient with its obligatory parts without its sunnas and recommended acts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1595} For purification, water of any of the seven kinds suffices, and by the majority view it suffices even when the water belongs to another. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1595}"
  es: "Ijza' en el léxico significa suficiencia y ser suficiente. En derecho es que un acto sea suficiente para cumplir con lo requerido, incluso sin nada añadido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1594} Se diferencia de la permisibilidad (jawaz), que significa que nada prohíbe el acto, y de la legalidad (hill), que significa pureza de toda imperfección: un acto puede ser suficiente aunque sea desaconsejable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1594} En la visión hanbalí, un acto es suficiente cuando tiene todas sus condiciones, pilares y obligaciones, así que la ablución es suficiente con sus partes obligatorias sin sus sunnas y actos recomendados. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1595} Para la purificación, basta con agua de cualquiera de los siete tipos, y según la opinión mayoritaria, basta incluso cuando el agua pertenece a otra persona. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1595}"
  fr: "Dans le lexique, « ijza » signifie suffisance et abondance. En droit, il s'agit du fait qu'un acte soit suffisant pour satisfaire aux exigences, même sans ajout. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1594} Cela diffère de la permissibilité (jawaz), qui signifie que rien n'interdit l'acte, et de la licéité (hill), qui signifie la pureté de tout défaut: un acte peut être suffisant tout en étant déconseillé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1594} Selon l'école hanbalite, un acte est suffisant lorsqu'il remplit toutes ses conditions, ses piliers et ses obligations; ainsi, les ablutions sont suffisantes avec leurs aspects obligatoires, sans qu'il soit nécessaire d'y ajouter les sunnas et les actes recommandés. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1595} Pour la purification, l'eau de n'importe laquelle des sept sortes suffit, et selon l'avis majoritaire, elle suffit même si elle appartient à autrui. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1595}"
