id: concept/ijza
class: concept
kind: legal
label: { ar: "إجزاء", en: "Sufficiency of an act (ijza')" }
summary:
  ar: "الإجزاء في اللغة الكفاية والإغناء، وفي الشرع إغناء الفعل عن المطلوب ولو من غير زيادة عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1594} ويفترق الإجزاء عن الجواز، لأن الجواز يطلق على ما لا يمتنع شرعاً، ويفترق عن الحل، لأن الإجزاء قد يقع مع الشوائب كالكراهة، أما الحل فهو الخالص من كل شائبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1594} ويكون التصرف مجزئاً إذا استجمع شرائطه وأركانه وواجباته عند الحنابلة، فيجزئ في الوضوء الإتيان بفرائضه دون سننه ومستحباته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1595} ويجزئ التطهر بالماء ولو كان مملوكاً للغير عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1595}"
  en: "Ijza' in the lexicon means sufficiency and being enough. In law it is an act's being enough to meet what is required, even without anything added to it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1594} It differs from permissibility (jawaz), which means that nothing forbids the act, and from lawfulness (hill), which means purity from every blemish: an act may be sufficient while disliked. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1594} In the Hanbali view an act suffices when it has all its conditions, pillars and obligations, so ablution is sufficient with its obligatory parts without its sunnas and recommended acts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1595} For purification, water of any of the seven kinds suffices, and by the majority view it suffices even when the water belongs to another. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1595}"
