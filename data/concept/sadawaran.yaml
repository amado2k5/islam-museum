summary:
  ar: "سادآوران في الكتاب دواء بارد في الثانية يابس في الثالثة يحبس الدم، ويمنع انتشار الشعر بخاصيته، ويذكر الكتاب له بدلاً {cite:canon-ibn-sina-print-v1 p.590}."
  en: "Sadawaran is in the book a drug cold in the second degree and dry in the third that stops blood and by its special property stops the spreading of hair, and the book gives it a substitute {cite:canon-ibn-sina-print-v1 p.590}."
  ur: "سادآوران کتاب میں ایک دوا ہے جو دوسرے درجے میں ٹھنڈی اور تیسرے میں خشک ہے، خون روکتی ہے اور اپنی خاصیت سے بالوں کے پھیلنے کو روکتی ہے، اور کتاب اس کا ایک بدل بتاتی ہے {cite:canon-ibn-sina-print-v1 p.590}۔"
  es: "Sadawaran es en el libro un medicamento para el resfriado de segundo grado y seco de tercer grado que detiene la sangre y por su propiedad especial detiene la propagación del cabello, y el libro le da un sustituto {cite:canon-ibn-sina-print-v1 p.590}."
  fr: "Le Sadawaran est décrit dans le livre comme un médicament froid au deuxième degré et sec au troisième degré qui arrête le sang et, par sa propriété spéciale, arrête la pousse des cheveux, et le livre lui donne un substitut {cite:canon-ibn-sina-print-v1 p.590}."
