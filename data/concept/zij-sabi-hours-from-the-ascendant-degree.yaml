id: concept/zij-sabi-hours-from-the-ascendant-degree
class: concept
kind: scientific
label: { ar: "الساعات من درجة الطالع", en: "The hours from the degree of the ascendant", ur: "طالع کے درجے سے گھنٹے", es: "Las horas desde el grado del ascendente", fr: "Les heures à partir du degré de l'ascendant" }
summary:
  ar: "إذا أردت معرفة الساعات من الطالع المفروض، فانظره: فإن كان بين درجة الشمس ونظيرها على توالي البروج فالوقت نهار، وإن كان بين نظيرها ودرجة الشمس فالوقت ليل. {cite:zij-sabi-nallino-byblion p.111}."
  en: "To find the hours from a given ascendant, look at it: if it lies between the Sun's degree and its opposite going in the order of the signs, the time is day; if it lies between the opposite and the Sun's degree, the time is night. {cite:zij-sabi-nallino-byblion p.111}."
  ur: "اگر دیا گیا طالع دیکھ کر گھنٹے معلوم کرنے ہوں تو دیکھیں: اگر وہ سورج کے درجے اور اس کے نظیر کے درمیان برجوں کی ترتیب میں ہو تو وقت دن کا ہے، اور اگر نظیر اور سورج کے درجے کے درمیان ہو تو وقت رات کا ہے۔ {cite:zij-sabi-nallino-byblion p.111}۔"
  es: "Para hallar las horas a partir de un ascendente dado, obsérvelo: si se encuentra entre el grado del Sol y su opuesto en el orden de los signos, es de día; si se encuentra entre el opuesto y el grado del Sol, es de noche. {cite:zij-sabi-nallino-byblion p.111}."
  fr: "Pour déterminer l'heure à partir d'un ascendant donné, il faut l'observer: s'il se situe entre le degré du Soleil et son opposé, en suivant l'ordre des signes, c'est le jour; s'il se situe entre l'opposé et le degré du Soleil, c'est la nuit. {cite:zij-sabi-nallino-byblion p.111}."
