id: concept/ibn-al-ukht
class: concept
kind: legal
label: { ar: "ابن الأخت", en: "Sister's son", es: "El hijo de la hermana", fr: "Le fils de ma sœur" }
summary:
  ar: "تعرّف الموسوعة الفقهية الكويتية ابن الأخت نسباً بأنه الولد الذكر النسبي للأخت النسبية، وهو ثلاثة أنواع: ابن أخت شقيقة، وابن أخت لأب، وابن أخت لأم، ورضاعاً بأنه الولد الذكر الذي أرضعته الأخت النسبية. واتفق الفقهاء على أنه من أولي الأرحام المحارم، فيسري عليه ما يسري على المحارم من تحريم النكاح، وإباحة الدخول على النساء والنظر إليهن في حدود المباح، وما يتصل بالقطع في السرقة بحسب تفصيل الفقهاء. واتفقوا على أنه من ذوي الأرحام لهم أحكام خاصة في الميراث والنفقة وأحقية الإمامة في صلاة الجنازة والولاية وصلة الرحم، وفي تقديم الخالة على الأب في حضانة ابن أختها خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1461}"
  en: "The Kuwaiti encyclopedia defines a sister's son by blood as the male blood child of a blood sister, in three kinds: the son of a full sister, of a paternal sister and of a maternal sister. By fostering, he is the male child a blood sister suckled. The jurists agree that he is a mahram kinsman among those with blood-ties through a female, so the rules of mahrams apply to him: marriage to him is forbidden, women may enter upon him, and they may look at him within the permitted limits; the rules on cutting the hand for theft are treated in the books according to the jurists' detail. The jurists also agree that he is among those with blood-ties through a female, with special rules in inheritance, maintenance, the right to lead the funeral prayer, guardianship and the bond of kinship. They differ on whether the maternal aunt comes before the father in custody of her sister's son. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1461}"
  es: "La enciclopedia kuwaití define al hijo de una hermana por consanguinidad como el hijo varón de una hermana de sangre, en tres categorías: hijo de una hermana de padre y madre, de una hermana de padre y de una hermana de madre. Por crianza, es el hijo varón que una hermana de sangre amamantó. Los juristas coinciden en que es un pariente mahram entre aquellos con lazos de sangre por vía femenina, por lo que se le aplican las normas de los mahram: el matrimonio con él está prohibido, las mujeres pueden entrar en su cuerpo y mirarlo dentro de los límites permitidos; las normas sobre la amputación de la mano por robo se tratan en los libros según el detalle de los juristas. Los juristas también coinciden en que se encuentra entre aquellos con lazos de sangre por vía femenina, con normas especiales en materia de herencia, manutención, derecho a dirigir la oración fúnebre, tutela y vínculo de parentesco. Discrepan sobre si la tía materna tiene prioridad sobre el padre en la custodia del hijo de su hermana. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1460} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1461}"
  fr: "L'encyclopédie koweïtienne définit le fils d'une sœur par le sang comme l'enfant mâle né d'une sœur par le sang, et ce, de trois manières: fils d'une sœur germaine, d'une sœur paternelle ou d'une sœur maternelle. Par allaitement, il s'agit de l'enfant mâle allaité par une sœur par le sang. Les juristes s'accordent à dire qu'il est un mahram parmi ceux qui ont des liens de sang par une mère; par conséquent, les règles relatives aux mahrams s'appliquent à lui: le mariage avec lui est interdit, les femmes peuvent entrer en sa présence et le regarder dans les limites permises; les règles concernant l'incarcération pour vol sont traitées dans les ouvrages de référence selon la jurisprudence. Les juristes s'accordent également à dire qu'il fait partie des personnes ayant des liens de sang par une femme, et que des règles spécifiques s'appliquent en matière d'héritage, de pension alimentaire, de droit de diriger la prière funéraire, de tutelle et de lien de parenté. Ils divergent cependant quant à la priorité accordée à la tante maternelle par rapport au père pour la garde du fils de sa sœur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1461}"
