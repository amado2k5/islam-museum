id: concept/ibn-al-ukht
class: concept
kind: legal
label: { ar: "ابن الأخت", en: "Sister's son" }
summary:
  ar: "تعرّف الموسوعة الفقهية الكويتية ابن الأخت نسباً بأنه الولد الذكر النسبي للأخت النسبية، وهو ثلاثة أنواع: ابن أخت شقيقة، وابن أخت لأب، وابن أخت لأم، ورضاعاً بأنه الولد الذكر الذي أرضعته الأخت النسبية. واتفق الفقهاء على أنه من أولي الأرحام المحارم، فيسري عليه ما يسري على المحارم من تحريم النكاح، وإباحة الدخول على النساء والنظر إليهن في حدود المباح، وما يتصل بالقطع في السرقة بحسب تفصيل الفقهاء. واتفقوا على أنه من ذوي الأرحام لهم أحكام خاصة في الميراث والنفقة وأحقية الإمامة في صلاة الجنازة والولاية وصلة الرحم، وفي تقديم الخالة على الأب في حضانة ابن أختها خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1461}"
  en: "The Kuwaiti encyclopedia defines a sister's son by blood as the male blood child of a blood sister, in three kinds: the son of a full sister, of a paternal sister and of a maternal sister. By fostering, he is the male child a blood sister suckled. The jurists agree that he is a mahram kinsman among those with blood-ties through a female, so the rules of mahrams apply to him: marriage to him is forbidden, women may enter upon him, and they may look at him within the permitted limits; the rules on cutting the hand for theft are treated in the books according to the jurists' detail. The jurists also agree that he is among those with blood-ties through a female, with special rules in inheritance, maintenance, the right to lead the funeral prayer, guardianship and the bond of kinship. They differ on whether the maternal aunt comes before the father in custody of her sister's son. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1461}"
