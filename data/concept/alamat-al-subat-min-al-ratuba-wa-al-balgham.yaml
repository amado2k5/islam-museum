id: concept/alamat-al-subat-min-al-ratuba-wa-al-balgham
class: concept
kind: scientific
label:
  ar: "علامات السبات من الرطوبة والبلغم"
  en: "Signs of coma from moisture and phlegm"
  fr: "Signes du coma dû à l’humidité et au flegme"
  ur: "نمی اور بلغم سے غنودگی کی علامات"
  es: "Signos de coma por humedad y flema"
  tr: "Nem ve balgamdan kaynaklanan kış uykusu belirtileri"
  id: "Tanda-tanda hibernasi akibat kelembapan dan dahak"
summary:
  ar: "يذكر ابن سينا علامات السبات من رطوبة ساذجة وعلامات الكائن من البلغم، من تقدم الامتلاء والتخمة ولين النبض واستغراق السبات وبياض اللون وثقل الرأس {cite:canon-ibn-sina-print-v2 p.92}"
  en: "Ibn Sina gives the signs of coma from simple moisture and from phlegm: fullness and indigestion before, softness of the pulse, deep and heavy coma, whiteness of colour and heaviness of the head {cite:canon-ibn-sina-print-v2 p.92}"
  fr: "Ibn Sina donne les signes du coma dû à l’humidité simple et de celui dû au flegme : réplétion et indigestion préalables, pouls mou, coma profond et lourd, pâleur et pesanteur de la tête {cite:canon-ibn-sina-print-v2 p.92}."
  ur: "ابن سینا سادہ نمی اور بلغم سے ہونے والی غنودگی کی علامات بتاتا ہے: پہلے بھراؤ اور بدہضمی، نبض کی نرمی، گہری اور بھاری غنودگی، رنگ کی سفیدی اور سر کا بوجھ {cite:canon-ibn-sina-print-v2 p.92}۔"
  es: "Ibn Sina describe los signos de coma por simple humedad y por flema: plenitud e indigestión previas, pulso blando, coma profundo y pesado, palidez y pesadez de cabeza {cite:canon-ibn-sina-print-v2 p.92}"
  tr: "İbn Sina, saf nem ve balgam belirtileri gibi ileri dolgunluk, tokluk, nabzın yumuşaması, derin uyku, soluk renk ve başın ağırlığı gibi kış uykusu belirtilerinden bahseder {cite:canon-ibn-sina-print-v2 s.92}"
  id: "Ibn Sina menyebutkan tanda-tanda hibernasi seperti kelembapan murni dan dahak, seperti kenyang yang lanjut, kenyang, pelunakan nadi, tidur nyenyak, warna pucat, dan berat kepala {cite:canon-ibn-sina-print-v2 hlm.92}"
