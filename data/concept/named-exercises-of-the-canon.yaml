id: concept/named-exercises-of-the-canon
class: concept
kind: scientific
label: { ar: "أسماء الرياضات عند ابن سينا", en: "The named exercises of the Canon", ur: "قانون کی ناموں والی ورزشیں", es: "Los ejercicios nombrados del Canon", fr: "Les exercices nommés du Canon", tr: "İbn Sina'ya göre spor isimleri", id: "Nama Olahraga Menurut Ibn Sina" }
summary:
  ar: "يسرد ابن سينا أنواع الرياضة بأسمائها، من المنازعة والمباطشة والرمي عن القوس وركوب الخيل إلى الأراجيح والزواريق، ثم الرياضات القوية الميدانية كالعدو والمصارعة واللعب بالكرة والصولجان وإشالة الحجر {cite:canon-ibn-sina-print-v1 p.222}."
  en: "Ibn Sina lists the kinds of exercise by name, from wrestling bouts, archery and riding to swings and small boats, then the strong exercises of the open ground such as running, wrestling, ball games, polo and lifting a stone {cite:canon-ibn-sina-print-v1 p.222}."
  es: "Ibn Sina enumera los tipos de ejercicio por nombre, desde combates de lucha libre, tiro con arco y equitación hasta columpios y pequeñas embarcaciones, luego los ejercicios fuertes al aire libre como correr, luchar, juegos de pelota, polo y levantar una piedra {cite:canon-ibn-sina-print-v1 p.222}."
  fr: "Ibn Sina énumère les types d'exercices par leur nom, allant des combats de lutte, du tir à l'arc et de l'équitation aux balançoires et aux petits bateaux, puis les exercices vigoureux en plein air tels que la course, la lutte, les jeux de balle, le polo et le levage d'une pierre {cite:canon-ibn-sina-print-v1 p.222}."
  ur: "ابن سینا نے ورزش کی اقسام کو نام کے ساتھ درج کیا ہے، جس میں کشتی کے مقابلے، تیر اندازی اور سواری سے لے کر جھولوں اور چھوٹی کشتیوں تک، پھر کھلے میدان کی مضبوط مشقیں جیسے دوڑ، کشتی، گیند کے کھیل، پولو اور پتھر اٹھانا۔"
  tr: "İbn Sina, spor türlerini isimlerine göre sıralar; güreş, vurma, okçuluk, at binme, sallanma ve tekne sürme, ardından koşma, güreş, top ve sopalarla oynama, taş fırlatma gibi güçlü saha sporları {cite:canon-ibn-sina-print-v1 s.222}."
  id: "Ibn Sina mencantumkan jenis olahraga berdasarkan nama, mulai dari gulat, memukul, panahan, berkuda, ayunan dan berperahu, kemudian olahraga lapangan kuat seperti lari, gulat, bermain bola dan pentungan, serta melempar batu {cite:canon-ibn-sina-print-v1 hlm.222}."
