summary:
  ar: "يسرد ابن سينا أنواع الرياضة بأسمائها، من المنازعة والمباطشة والرمي عن القوس وركوب الخيل إلى الأراجيح والزواريق، ثم الرياضات القوية الميدانية كالعدو والمصارعة واللعب بالكرة والصولجان وإشالة الحجر {cite:canon-ibn-sina-print-v1 p.222}."
  en: "Ibn Sina lists the kinds of exercise by name, from wrestling bouts, archery and riding to swings and small boats, then the strong exercises of the open ground such as running, wrestling, ball games, polo and lifting a stone {cite:canon-ibn-sina-print-v1 p.222}."
