id: concept/hisab-al-tasbih-mia
class: concept
kind: doctrine
label:
  ar: "مائة تسبيحة: ألف حسنة"
  en: "A hundred tasbihs: a thousand good deeds"
  ur: "سو تسبیحات: ہزار نیکیاں"
summary:
  ar: "سأل النبي جلساءه: أيعجز أحدكم أن يكسب كل يوم ألف حسنة؟ ثم بيّن أن من سبّح مائة تسبيحة كُتبت له ألف حسنة أو حُطّ عنه ألف خطيئة، في رواية سعد بن أبي وقاص عند مسلم [[passage/muslim-api-6852]]، ولفظ الترمذي يجمع الأمرين بالواو [[passage/tirmidhi-api-3463]]. والحساب ظاهر: كل تسبيحة حسنة، والحسنة بعشر أمثالها، فالمائة ألف. تعرض الآلة الحاسبة الألف في عمود الحسنات، وتذكر المحو في خانة النتيجة لاختلاف اللفظين."
  en: "The Prophet asked those sitting with him whether any of them was unable to earn a thousand good deeds every day, then explained that whoever says a hundred tasbihs has a thousand good deeds written for him or a thousand sins shed, in Sa'd ibn Abi Waqqas's narration in Muslim [[passage/muslim-api-6852]]; al-Tirmidhi's wording joins the two with \"and\" [[passage/tirmidhi-api-3463]]. The arithmetic is plain: each tasbih is a good deed, a good deed counts ten, and a hundred makes a thousand. The calculator puts the thousand in the good-deeds column and names the shedding in the result line, because the two wordings differ."
  ur: "نبی نے اپنے ہم نشینوں سے پوچھا کہ کیا تم میں سے کوئی روزانہ ہزار نیکیاں کمانے سے عاجز ہے؟ پھر بتایا کہ جو سو بار تسبیح کرے اس کے لیے ہزار نیکیاں لکھی جاتی ہیں یا ہزار خطائیں مٹا دی جاتی ہیں، سعد بن ابی وقاص کی روایت میں جو مسلم میں ہے [[passage/muslim-api-6852]]، اور ترمذی کے الفاظ دونوں کو «اور» سے جوڑتے ہیں [[passage/tirmidhi-api-3463]]۔ حساب واضح ہے: ہر تسبیح ایک نیکی، نیکی دس گنا، تو سو کی ہزار۔ کیلکولیٹر ہزار کو نیکیوں کے کالم میں رکھتا ہے اور مٹنے کا ذکر نتیجے کی سطر میں کرتا ہے کیونکہ دونوں الفاظ مختلف ہیں۔"
