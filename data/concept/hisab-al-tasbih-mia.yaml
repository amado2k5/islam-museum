id: concept/hisab-al-tasbih-mia
class: concept
kind: doctrine
label:
  ar: "مائة تسبيحة: ألف حسنة"
  en: "A hundred tasbihs: a thousand good deeds"
  ur: "سو تسبیحات: ہزار نیکیاں"
  es: "Cien tasbihs: mil buenas obras"
  fr: "Cent chapelets: mille bonnes actions"
  tr: "Yüz tasbiha: bin iyi iş"
  id: "Seratus tasbiha: seribu perbuatan baik"
summary:
  ar: "سأل النبي جلساءه: أيعجز أحدكم أن يكسب كل يوم ألف حسنة؟ ثم بيّن أن من سبّح مائة تسبيحة كُتبت له ألف حسنة أو حُطّ عنه ألف خطيئة، في رواية سعد بن أبي وقاص عند مسلم [[passage/muslim-api-6852]]، ولفظ الترمذي يجمع الأمرين بالواو [[passage/tirmidhi-api-3463]]. والحساب ظاهر: كل تسبيحة حسنة، والحسنة بعشر أمثالها، فالمائة ألف. تعرض الآلة الحاسبة الألف في عمود الحسنات، وتذكر المحو في خانة النتيجة لاختلاف اللفظين."
  en: "The Prophet asked those sitting with him whether any of them was unable to earn a thousand good deeds every day, then explained that whoever says a hundred tasbihs has a thousand good deeds written for him or a thousand sins shed, in Sa'd ibn Abi Waqqas's narration in Muslim [[passage/muslim-api-6852]]; al-Tirmidhi's wording joins the two with \"and\" [[passage/tirmidhi-api-3463]]. The arithmetic is plain: each tasbih is a good deed, a good deed counts ten, and a hundred makes a thousand. The calculator puts the thousand in the good-deeds column and names the shedding in the result line, because the two wordings differ."
  ur: "نبی نے اپنے ہم نشینوں سے پوچھا کہ کیا تم میں سے کوئی روزانہ ہزار نیکیاں کمانے سے عاجز ہے؟ پھر بتایا کہ جو سو بار تسبیح کرے اس کے لیے ہزار نیکیاں لکھی جاتی ہیں یا ہزار خطائیں مٹا دی جاتی ہیں، سعد بن ابی وقاص کی روایت میں جو مسلم میں ہے [[passage/muslim-api-6852]]، اور ترمذی کے الفاظ دونوں کو «اور» سے جوڑتے ہیں [[passage/tirmidhi-api-3463]]۔ حساب واضح ہے: ہر تسبیح ایک نیکی، نیکی دس گنا، تو سو کی ہزار۔ کیلکولیٹر ہزار کو نیکیوں کے کالم میں رکھتا ہے اور مٹنے کا ذکر نتیجے کی سطر میں کرتا ہے کیونکہ دونوں الفاظ مختلف ہیں۔"
  es: "El Profeta preguntó a los que estaban sentados con él si alguno de ellos no podía acumular mil buenas acciones cada día, y luego explicó que quien recita cien tasbihs tiene mil buenas acciones registradas o mil pecados perdonados, según la narración de Sa'd ibn Abi Waqqas en Muslim [[passage/muslim-api-6852]]; la redacción de al-Tirmidhi une ambos conceptos con \"y\" [[passage/tirmidhi-api-3463]]. La aritmética es clara: cada tasbih es una buena acción, una buena acción cuenta como diez, y cien suman mil. La calculadora coloca los mil en la columna de buenas acciones y nombra la pérdida de pecados en la línea de resultados, porque las dos formulaciones difieren."
  fr: "Le Prophète demanda à ceux qui étaient assis avec lui si l'un d'eux était incapable d'accomplir mille bonnes actions chaque jour, puis expliqua que quiconque récite cent tasbihs se voit inscrire mille bonnes actions ou se voit pardonner mille péchés, selon le hadith rapporté par Sa'd ibn Abi Waqqas dans Muslim [[passage/muslim-api-6852]]. La version d'al-Tirmidhi associe les deux par « et » [[passage/tirmidhi-api-3463]]. Le calcul est simple: chaque tasbih compte comme une bonne action, une bonne action vaut dix, et cent font mille. Le calculateur inscrit le millier dans la colonne des bonnes actions et indique le pardon dans le résultat, car les deux formulations diffèrent."
  tr: "Peygamber sahabelerine sordu: Aranızda her gün bin iyilik kazanmak imkansız mı? Sonra şöyle açıkladı: Yüz tebehi yücelten kişi için bin iyi iş yazılır ya da bin günah çıkarılır, bu da Sa'd bin Ebi Vakkas'ın Müslüman [[passage/muslim-api-6852]] rivayetinde ve el-Tirmidi'nin ifadesi her ikisini bir waw ile birleştirir [[pasaj/tirmidhi-api-3463]]. Hesaplama açıktır: her tasbih iyi bir iştir, iyi bir iş on kat katlanır, yani yüz bindir. Hesap makinesi, iyi işler sütunundaki binini gösterir ve iki kelime arasındaki fark nedeniyle sonuç bölümünde silinme belirtilir."
  id: "Nabi bertanya kepada para sahabatnya: Apakah mustahil bagi kalian untuk memperoleh seribu amal baik setiap hari? Kemudian ia menjelaskan bahwa siapa pun memuliakan seratus tasbih, seribu amal baik ditulis untuknya atau seribu dosa dihapuskan darinya, dalam riwayat Sa'd ibn Abi Waqqas dalam Muslim [[passage/muslim-api-6852]], dan kata-kata al-Tirmidhi digabungkan dengan waw [[ayat/tirmidhi-api-3463]]. Perhitungannya jelas: setiap tasbih adalah amal baik, dan amal baik dikalikan sepuluh kali lipat, jadi seratus adalah seribu. Kalkulator menampilkan seribu di kolom amal baik, dan penghapusan disebutkan dalam bagian hasil karena perbedaan antara dua kata tersebut."
