label: { ar: "المُنَاشَدَة", en: "Public proclamation (munashada) of a found thing, and appealing to a wrongdoer", ur: "مناشدہ ⁦(لقطہ کا اعلان اور ظالم سے اپیل)⁩", es: "Proclamación pública (munashada) de un hallazgo y apelación a un malhechor.", fr: "proclamation publique (munashada) d'une chose trouvée et appel au malfaiteur", tr: "itiraz", id: "banding" }
summary:
  ar: "المناشدة في اللغة رفع الصوت بالمناداة، وفي الفقه إنشاد اللقطة أي الإعلان عنها، وهو واجب عند جمهور الفقهاء، ويفصل بين الأموال الباقية والتالفة والمدفونة، ومدة الإنشاد حول، وأماكنه مجامع الناس. ويحرم أو يكره إنشاد اللقطة في المسجد إلا المسجد الحرام. ومن أحكامها إنشاد ضوال الحيوان، والإنشاد بالشعر، ومناشدة الظالم قبل القتال."
  en: "Munashada in the lexicon is raising the voice to call out. In law it is the public announcement of a found thing (luqata), which most jurists hold obligatory. Its rules divide goods that keep from those that spoil and from buried treasure; the period is a year; the places are crowded ones. Proclaiming it in a mosque is forbidden or disliked except in the Sacred Mosque. Related rules cover strayed animals, poetry, and appealing to an aggressor before fighting."
  ur: "مناشدہ لغت میں بلند آواز سے پکارنے کو کہتے ہیں، اور فقہ میں لقطہ کا اعلان کرنا۔ جمہور کے نزدیک اعلان واجب ہے، اور مدت ایک سال ہے۔ مسجد میں اعلان مکروہ یا حرام ہے سوائے مسجد حرام کے۔"
  es: "Munashada, en el léxico, significa alzar la voz para anunciar algo. En derecho, se refiere al anuncio público de un hallazgo (luqata), que la mayoría de los juristas consideran obligatorio. Sus normas distinguen entre bienes que se conservan, bienes que se corrompen y tesoros enterrados; el plazo es de un año; los lugares deben ser concurridos. Proclamarlo en una mezquita está prohibido o mal visto, excepto en la Mezquita Sagrada. Normas relacionadas abarcan animales extraviados, poesía y apelar a un agresor antes de luchar."
  fr: "Munashada, dans le lexique, signifie « élever la voix pour appeler ». Juridiquement, il s'agit de l'annonce publique d'un objet trouvé (luqata), que la plupart des juristes considèrent comme obligatoire. Ses règles distinguent les biens qui se conservent de ceux qui se détériorent et des trésors enfouis; la période est d'un an; les lieux sont généralement fréquentés. La proclamation est interdite ou mal vue dans une mosquée, sauf dans la Mosquée sacrée. Des règles connexes concernent les animaux errants, la poésie et l'appel à la paix avant un combat."
  tr: "Dilbilimde, 'al-munashdah' seslenerek sesi yükseltmek anlamına gelirken, hukukta 'avı duyurmak' yani duyurmak çoğu hukukçuya göre zorunludur. Artık kalan, hasar görmüş ve gömülü eşyaları, ilahi süresini ve yerlerini ayırt eder. Camide 'al-laqta' okumak Kutsal Cami dışında yasak veya hoş karşılanmaz. Hükümleri arasında sokak hayvanını ilahi söylemek, şiirle ilahi söylemek ve savaşmadan önce zalimere çağrı yapmak yer alır."
  id: "Dalam linguistik, 'al-munashdah' berarti meninggikan suara dengan memanggil, dan dalam yurisprudensi, 'melantunkan tangkapan', yang berarti mengumumkannya, adalah wajib menurut mayoritas ahli hukum. Istilah ini membedakan antara barang yang tersisa, rusak, dan yang dikubur, durasi nyanyian, dan tempatnya adalah pertemuan orang. Dilarang atau tidak disukai untuk membacakan 'al-laqta' di masjid kecuali di Masjid Suci. Di antara putusannya adalah melantunkan hewan liar, melantunkan dengan puisi, dan mengajak penindas sebelum bertarung."
