label: { ar: "المُنَاشَدَة", en: "Public proclamation (munashada) of a found thing, and appealing to a wrongdoer", ur: "مناشدہ (لقطہ کا اعلان اور ظالم سے اپیل)" }
summary:
  ar: "المناشدة في اللغة رفع الصوت بالمناداة، وفي الفقه إنشاد اللقطة أي الإعلان عنها، وهو واجب عند جمهور الفقهاء، ويفصل بين الأموال الباقية والتالفة والمدفونة، ومدة الإنشاد حول، وأماكنه مجامع الناس. ويحرم أو يكره إنشاد اللقطة في المسجد إلا المسجد الحرام. ومن أحكامها إنشاد ضوال الحيوان، والإنشاد بالشعر، ومناشدة الظالم قبل القتال."
  en: "Munashada in the lexicon is raising the voice to call out. In law it is the public announcement of a found thing (luqata), which most jurists hold obligatory. Its rules divide goods that keep from those that spoil and from buried treasure; the period is a year; the places are crowded ones. Proclaiming it in a mosque is forbidden or disliked except in the Sacred Mosque. Related rules cover strayed animals, poetry, and appealing to an aggressor before fighting."
  ur: "مناشدہ لغت میں بلند آواز سے پکارنے کو کہتے ہیں، اور فقہ میں لقطہ کا اعلان کرنا۔ جمہور کے نزدیک اعلان واجب ہے، اور مدت ایک سال ہے۔ مسجد میں اعلان مکروہ یا حرام ہے سوائے مسجد حرام کے۔"
