label: { ar: "الاختلاف في عدد الغزوات والسرايا", en: "Disputing the count of raids and sariyas" }
summary:
  ar: "غزوات النبي بنفسه عند ابن إسحاق ست وعشرون وجعلها آخرون سبعاً وعشرين فصلوا منصرفه من خيبر إلى وادي القرى غزوة أخرى دون رجوع إلى المدينة، وقاتل في تسع منها اتفاقاً بين ابن إسحاق والواقدي بدر وأحد والخندق وقريظة وخيبر والفتح وحنين والطائف وتبوك وزاد الواقدي وادي القرى ويوم الغابة فقاتل عنده في إحدى عشرة، وقيل إن أول غزوة غزاها ذات العشيرة، وتنازعوا في سراياه وبعوثه فقال قوم خمس وثلاثون بعثاً وسرية وذكر الطبري عن الواقدي ثمانية وأربعين سرية وقيل ستة وستون {cite:muruj-al-dhahab p. 579-580}."
  en: "The maghazi arithmetic disputes: Ibn Ishaq's twenty-six raids versus the twenty-seven that split Wadi'l-Qura from Khaybar; nine pitched battles common to both lists with al-Waqidi adding Wadi'l-Qura and al-Ghaba for eleven; and the sariya counts ranging from thirty-five to al-Waqidi's forty-eight (in al-Tabari's chain) to sixty-six {cite:muruj-al-dhahab p. 579-580}."
