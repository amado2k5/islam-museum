label: { ar: "الاختلاف في عدد الغزوات والسرايا", en: "Disputing the count of raids and sariyas", es: "Disputar el recuento de incursiones y sariyas", fr: "Contestation du nombre de raids et de sariyas", ur: "چھاپوں اور ساریوں کی گنتی پر اختلاف", tr: "Baskın ve bölük sayısındaki farklar", id: "Perbedaan jumlah penggerebekan dan perusahaan" }
summary:
  ar: "غزوات النبي بنفسه عند ابن إسحاق ست وعشرون وجعلها آخرون سبعاً وعشرين فصلوا منصرفه من خيبر إلى وادي القرى غزوة أخرى دون رجوع إلى المدينة، وقاتل في تسع منها اتفاقاً بين ابن إسحاق والواقدي بدر وأحد والخندق وقريظة وخيبر والفتح وحنين والطائف وتبوك وزاد الواقدي وادي القرى ويوم الغابة فقاتل عنده في إحدى عشرة، وقيل إن أول غزوة غزاها ذات العشيرة، وتنازعوا في سراياه وبعوثه فقال قوم خمس وثلاثون بعثاً وسرية وذكر الطبري عن الواقدي ثمانية وأربعين سرية وقيل ستة وستون {cite:muruj-al-dhahab p. 579-580}."
  en: "The maghazi arithmetic disputes: Ibn Ishaq's twenty-six raids versus the twenty-seven that split Wadi'l-Qura from Khaybar; nine pitched battles common to both lists with al-Waqidi adding Wadi'l-Qura and al-Ghaba for eleven; and the sariya counts ranging from thirty-five to al-Waqidi's forty-eight (in al-Tabari's chain) to sixty-six {cite:muruj-al-dhahab p. 579-580}."
  es: "Las disputas aritméticas de Maghazi: las veintiséis incursiones de Ibn Ishaq frente a las veintisiete que dividieron Wadi'l-Qura de Khaybar; nueve batallas campales comunes a ambas listas, con al-Waqidi añadiendo Wadi'l-Qura y al-Ghaba para once; y los recuentos de sariya que van desde treinta y cinco hasta los cuarenta y ocho de al-Waqidi (en la cadena de al-Tabari) hasta sesenta y seis {cite:muruj-al-dhahab p. 579-580}."
  fr: "Les différends arithmétiques des maghazis: les vingt-six raids d'Ibn Ishaq contre les vingt-sept qui ont séparé Wadi'l-Qura de Khaybar; neuf batailles rangées communes aux deux listes, al-Waqidi ajoutant Wadi'l-Qura et al-Ghaba pour onze; et les décomptes de sariya allant de trente-cinq à quarante-huit selon al-Waqidi (dans la chaîne d'al-Tabari) jusqu'à soixante-six {cite: muruj-al-dhahab p. 579-580}."
  ur: "مغازی ریاضی کے تنازعات: ابن اسحاق کے چھبیس چھاپے بمقابلہ ستائیس حملے جنہوں نے وادی القریٰ کو خیبر سے الگ کیا۔ الواقدی کے ساتھ دونوں فہرستوں میں مشترکہ نو لڑائیاں ہیں جن میں وادی القرا اور الغابہ کو گیارہ کے لیے شامل کیا گیا ہے۔ اور ساریہ کی تعداد پینتیس سے لے کر الواقدی کے اڑتالیس ⁦(الطبری کے سلسلہ میں)⁩ سے چھیاسٹھ تک ہے۔ 579-580}۔"
  tr: "İbn İshak'a göre Peygamber'in kendi seferleri yirmi altı, diğerleri ise yirmi yedi sefer yaptı. Başka bir seferi Haybar'dan Wadi al-Kura'ya ayırdılar ama Medine'ye dönmediler. Dokuzunda savaştı; İbn İshaq ile el-Vaqidi, Bedir, Uhud, hendek, Qurayza, Haybar, fetih, Hunayn, Taif, Tabuk ve el-Vaqidi Wadi al-Kura ve Orman Günü'ne eklendi. Onunla on bir seferde savaştı. İlk seferin aynı kabile tarafından yapıldığı ve onun birlikleri ile elçileri üzerinde anlaşmazlık yaşadıkları söylenir. Bazıları otuz beş sefer ve sefer olduğunu söyledi. El-Taberi, el-Vaqidi'den kırk sekiz seferden bahsetti ve altmış altı sefer deniyor {atıf:Muruj-al-Dhahab, s. 579-580}."
  id: "Kampanye Nabi sendiri menurut Ibn Ishaq berjumlah dua puluh enam, sementara yang lain menjadi dua puluh tujuh. Mereka memisahkan kampanye lain dari Khaybar ke Wadi al-Qura tanpa kembali ke Madinah. Ia bertempur dalam sembilan kampanye, atas kesepakatan antara Ibn Ishaq dan al-Waqidi, Badr, Uhud, parit, Quraiza, Khaybar, penaklukan, Hunayn, Taif, Tabuk, dan al-Waqidi ditambahkan ke Wadi al-Qura dan Hari Hutan. Ia bertempur bersamanya dalam sebelas tahun. Konon ekspedisi pertama dilakukan oleh suku yang sama, dan mereka bersaing atas detasemen dan utusannya. Beberapa menyebut tiga puluh lima ekspedisi dan ekspedisi. Al-Tabari menyebutkan empat puluh delapan ekspedisi dari al-Waqidi, dan dikatakan enam puluh enam {cite:muruj-al-dhahab, hlm. 579-580}."
