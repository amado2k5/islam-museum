id: concept/massage-before-and-after-exercise
class: concept
kind: scientific
label: { ar: "دلك الاستعداد ودلك الاسترداد عند ابن سينا", en: "Massage before and after exercise in the Canon", ur: "قانون میں ورزش سے پہلے اور بعد کی مالش", es: "Masaje antes y después del ejercicio en el Canon", fr: "Massage avant et après l'exercice au Canon" }
summary:
  ar: "يفرق ابن سينا بين دلك الاستعداد قبل الرياضة، يبتدئ ليناً ثم يشدد إذا كاد يقوم إلى الرياضة، ودلك الاسترداد بعدها ويسمى المسكن، غرضه تحليل الفضول المحتبسة في العضل مما لم تستفرغه الرياضة ليُنعش ولا يحدث الإعياء، ويجب أن يكون رقيقاً معتدلاً وأحسنه ما كان بالدهن {cite:canon-ibn-sina-print-v1 p.225}."
  en: "Ibn Sina distinguishes the massage of preparation before exercise, begun gently and made firmer as the person is about to rise to exercise, from the massage of recovery after it, also called the calming massage, whose aim is to dissolve residues held in the muscles that exercise did not expel, so as to refresh and avoid fatigue; it should be light and moderate, best with oil {cite:canon-ibn-sina-print-v1 p.225}."
  es: "Ibn Sina distingue el masaje de preparación antes del ejercicio, que comienza suavemente y se vuelve más firme cuando la persona está a punto de levantarse para hacer ejercicio, del masaje de recuperación posterior, también llamado masaje calmante, cuyo objetivo es disolver los residuos que quedan en los músculos que el ejercicio no ha expulsado, para refrescar y evitar la fatiga; debe ser ligero y moderado, preferiblemente con aceite {cite:canon-ibn-sina-print-v1 p.225}."
  fr: "Ibn Sina distingue le massage de préparation avant l'exercice, commencé doucement et rendu plus ferme au moment où la personne s'apprête à commencer l'exercice, du massage de récupération après celui-ci, également appelé massage apaisant, dont le but est de dissoudre les résidus retenus dans les muscles que l'exercice n'a pas éliminés, afin de rafraîchir et d'éviter la fatigue; il doit être léger et modéré, de préférence avec de l'huile {cite:canon-ibn-sina-print-v1 p.225}."
  ur: "ابن سینا نے ورزش سے پہلے تیاری کے مساج کی تفریق کی ہے، آہستہ سے شروع کی گئی ہے اور اسے مضبوط بنایا گیا ہے جیسے ہی کوئی شخص ورزش کے لیے اٹھنے والا ہے، اس کے بعد صحت یاب ہونے کے مساج سے، اسے پرسکون مساج بھی کہا جاتا ہے، جس کا مقصد پٹھوں میں موجود باقیات کو تحلیل کرنا ہے جو ورزش سے باہر نہیں نکلے، تاکہ تازگی اور تھکاوٹ سے بچا جا سکے۔ یہ ہلکا اور اعتدال پسند ہونا چاہیے، تیل کے ساتھ بہترین ہونا چاہیے"
