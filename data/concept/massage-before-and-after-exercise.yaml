label: { ar: "دلك الاستعداد ودلك الاسترداد عند ابن سينا", en: "Massage before and after exercise in the Canon", ur: "قانون میں ورزش سے پہلے اور بعد کی مالش" }
summary:
  ar: "يفرق ابن سينا بين دلك الاستعداد قبل الرياضة، يبتدئ ليناً ثم يشدد إذا كاد يقوم إلى الرياضة، ودلك الاسترداد بعدها ويسمى المسكن، غرضه تحليل الفضول المحتبسة في العضل مما لم تستفرغه الرياضة ليُنعش ولا يحدث الإعياء، ويجب أن يكون رقيقاً معتدلاً وأحسنه ما كان بالدهن {cite:canon-ibn-sina-print-v1 p.225}."
  en: "Ibn Sina distinguishes the massage of preparation before exercise, begun gently and made firmer as the person is about to rise to exercise, from the massage of recovery after it, also called the calming massage, whose aim is to dissolve residues held in the muscles that exercise did not expel, so as to refresh and avoid fatigue; it should be light and moderate, best with oil {cite:canon-ibn-sina-print-v1 p.225}."
