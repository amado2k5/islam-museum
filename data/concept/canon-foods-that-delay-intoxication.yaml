label: { ar: "الأغذية المبطئة للسكر عند ابن سينا", en: "Foods that delay intoxication in the Canon", ur: "نشے کو دیر سے چڑھانے والی غذائیں قانون میں" }
summary:
  ar: "يذكر ابن سينا أن من أراد الامتلاء من الشراب لا يمتلئ من الطعام ولا يأكل الحلو، بل يتحسى من الأسفيذاج الدسم ويأكل ثريدة دسمة ولحماً دسماً، وينقل باللوز والعدس المملحين، وأن ما يجفف البخار وما فيه لزوجة يمنع السكر {cite:canon-ibn-sina-print-v1 pp.238-239}."
  en: "Ibn Sina says one who means to take his fill of wine does not fill himself with food or eat sweets, but sips a fatty broth, eats a fatty crumbled bread dish and fatty meat, and finishes with salted almonds and lentils, adding that what dries the vapour and what is sticky prevents drunkenness {cite:canon-ibn-sina-print-v1 pp.238-239}."
