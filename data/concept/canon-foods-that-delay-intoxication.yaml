id: concept/canon-foods-that-delay-intoxication
class: concept
kind: scientific
label:
  ar: "الأغذية المبطئة للسكر عند ابن سينا"
  en: "Foods that delay intoxication in the Canon"
  fr: "Aliments retardant l’ivresse dans le Canon"
  ur: "نشے کو دیر سے چڑھانے والی غذائیں قانون میں"
  es: "Alimentos que retrasan la intoxicación en el Canon"
summary:
  ar: "يذكر ابن سينا أن من أراد الامتلاء من الشراب لا يمتلئ من الطعام ولا يأكل الحلو، بل يتحسى من الأسفيذاج الدسم ويأكل ثريدة دسمة ولحماً دسماً، وينقل باللوز والعدس المملحين، وأن ما يجفف البخار وما فيه لزوجة يمنع السكر {cite:canon-ibn-sina-print-v1 pp.238-239}."
  en: "Ibn Sina says one who means to take his fill of wine does not fill himself with food or eat sweets, but sips a fatty broth, eats a fatty crumbled bread dish and fatty meat, and finishes with salted almonds and lentils, adding that what dries the vapour and what is sticky prevents drunkenness {cite:canon-ibn-sina-print-v1 pp.238-239}."
  fr: "Ibn Sina décrit, pour une forte prise de vin, absence de satiété alimentaire et de douceurs, bouillon gras, pain émietté et viande gras, puis amandes salées et lentilles ; desséchants de vapeur et substances visqueuses préviendraient l’ivresse {cite:canon-ibn-sina-print-v1 pp.238-239}."
  es: "Ibn Sina dice que quien quiere saciarse de vino no se llena de comida ni come dulces, sino que bebe un caldo graso, come un plato de pan desmenuzado graso y carne grasa, y termina con almendras saladas y lentejas, añadiendo que lo que seca el vapor y lo que es pegajoso previene la embriaguez {cite:canon-ibn-sina-print-v1 pp.238-239}."
