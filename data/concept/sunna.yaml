label:
  ar: "السُّنَّة"
  en: "Sunna (the way, the practice of the Prophet, and the legal grades of the recommended)"
  es: "Sunna (el camino, la práctica del Profeta y los grados legales de lo recomendado)"
  fr: "Sunna (la voie, la pratique du Prophète et les degrés légaux de ce qui est recommandé)"
  ur: "سنت ⁦(طریقہ، نبی کا عمل، اور سفارش کے قانونی درجات)⁩"
  tr: "Sünnet"
  id: "Sunnah"
summary:
  ar: "السنة في اللغة الطريقة والعادة والسيرة حميدة كانت أم ذميمة، ثم استعملت في الطريقة المحمودة المستقيمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9836} وعند الفقهاء تطلق على ما طُلب فعله طلبا غير جازم، ويقابلها الواجب والفرض والحرام والمكروه والمباح، وعند الحنفية سنة الهدى المؤكدة وسنن الزوائد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9838} وعند الأصوليين هي ما صدر عن النبي من قول أو فعل أو تقرير، وتنقسم باعتبار السند إلى المتواتر والمشهور وخبر الواحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9838} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9839}"
  en: "In language sunna means a way, custom or conduct, praiseworthy or blameworthy, and then came to mean the upright praiseworthy way. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9836} For the jurists it names what is requested without binding obligation, set against the obligatory, the compulsory, the forbidden, the disliked and the permitted; the Hanafis distinguish the sunna of guidance (emphasised) from the supplementary sunnas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9838} For the usulis it is what came from the Prophet in speech, act or tacit approval, and by chain of transmission it is divided into mass-transmitted, widely transmitted and single-report. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9838} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9839}"
  es: "En el lenguaje sunna significa un camino, costumbre o conducta, loable o censurable, y luego pasó a significar el camino recto y loable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9836} Para los juristas nombra lo que se solicita sin obligación vinculante, en contraposición a lo obligatorio, lo imperativo, lo prohibido, lo desaconsejable y lo permitido; los hanafíes distinguen la sunna de guía (enfatizada) de las sunnas suplementarias. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9838} Para los usulis es lo que vino del Profeta en palabra, acto o aprobación tácita, y por cadena de transmisión se divide en transmitido masivamente, ampliamente transmitido y reporte único. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9838} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9839}"
  fr: "En langue kuwaitiyya, le terme « sunna » désigne une voie, une coutume ou une conduite, louable ou blâmable, et a fini par signifier la voie droite et louable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9836} Pour les juristes, il s'agit de ce qui est recommandé sans obligation contraignante, par opposition à l'obligatoire, au impératif, à l'interdit, au déconseillé et au permis; les hanafites distinguent la sunna de guidance (soumise) des sunnas supplémentaires. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9838} Pour les usulis, il s'agit de ce qui a été transmis par le Prophète par la parole, l'acte ou l'approbation tacite, et selon la chaîne de transmission, on distingue la sunna à transmission massive, la sunna à transmission large et la sunna à transmission unique. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9838} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9839}"
  ur: "زبان میں سنت کا مطلب ایک طریقہ، رواج یا طرز عمل، قابل تعریف یا قابلِ ملامت ہے، اور پھر اس کا مطلب سیدھا قابل ستائش طریقہ ہو گیا۔ {حوالہ: فقہ الموسوعہ-کویتیہ-نور-v3 صفحہ 9836} فقہاء کے لیے اس میں واجب، واجب، حرام، ناپسندیدہ اور جائز کے خلاف متعین کردہ، بغیر کسی پابندی کے درخواست کی جانے والی چیزوں کا نام ہے۔ احناف ہدایت کی سنت کو ضمنی سنتوں سے ممتاز کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9837} {حوالہ: فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9838} اصولوں کے لیے وہی ہے جو نبی کی طرف سے تقریر، عمل یا لغوی منظوری میں آیا ہے، اور اس کی ترسیل کے سلسلہ کے ذریعے اسے تقسیم کیا گیا ہے، وسیع پیمانے پر منتقل کیا گیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9838}"
  tr: "Dildeki Sünnet, yöntem, adet ve biyografidir; övgüye değer ya da suçlu olsun, o zaman övgüye değer ve doğru yolda kullanılmıştır. {alıntı:fiqh-mawsua-kuveytiyya-noor-v3 s.9836} Hukukçular arasında, kesin talep olmaksızın yapılması istenen, zorunlu, zorunlu, yasak, sevilmez ve mücaiz anlamına gelir. Hanefiler arasında, onaylanmış rehber sünneti ve eklemelerin sünnetini ifade eder. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.9837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9838} usul âlimlerine göre, bu, Peygamber'in söz, eylem veya rapor olarak verdiği sözlere atıfta bulunur ve aktarım zincirine göre mutevatir, maşur ve bildirilen raporlara ayrılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9838} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9839}"
  id: "Sunnah dalam bahasa ini adalah metode, adat, dan biografi, baik terpuji maupun tercela, maka digunakan dalam jalan yang terpuji dan lurus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9836} Di antara para ahli hukum, istilah ini merujuk pada apa yang diminta dilakukan tanpa tuntutan yang pasti, yaitu wajib, wajib, terlarang, tidak disukai, dan diperbolehkan. Di kalangan Hanafi, ini merujuk pada Sunnah yang telah dikonfirmasi sebagai panduan dan Sunnah penambahan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9838} Menurut para ulama usul, ini merujuk pada apa yang dikeluarkan oleh Nabi dalam hal ucapan, tindakan, atau laporan, dan dibagi menjadi rantai transmisi menjadi mutawatir, mashhoor, dan laporan yang dilaporkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9838} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9839}"
