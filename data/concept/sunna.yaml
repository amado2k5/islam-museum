label:
  ar: "السُّنَّة"
  en: "Sunna (the way, the practice of the Prophet, and the legal grades of the recommended)"
summary:
  ar: "السنة في اللغة الطريقة والعادة والسيرة حميدة كانت أم ذميمة، ثم استعملت في الطريقة المحمودة المستقيمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9836} وعند الفقهاء تطلق على ما طُلب فعله طلبا غير جازم، ويقابلها الواجب والفرض والحرام والمكروه والمباح، وعند الحنفية سنة الهدى المؤكدة وسنن الزوائد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9838} وعند الأصوليين هي ما صدر عن النبي من قول أو فعل أو تقرير، وتنقسم باعتبار السند إلى المتواتر والمشهور وخبر الواحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9838} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9839}"
  en: "In language sunna means a way, custom or conduct, praiseworthy or blameworthy, and then came to mean the upright praiseworthy way. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9836} For the jurists it names what is requested without binding obligation, set against the obligatory, the compulsory, the forbidden, the disliked and the permitted; the Hanafis distinguish the sunna of guidance (emphasised) from the supplementary sunnas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9838} For the usulis it is what came from the Prophet in speech, act or tacit approval, and by chain of transmission it is divided into mass-transmitted, widely transmitted and single-report. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9838} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9839}"
