label:
  ar: "بلاذر"
  en: "Biladhur (marking nut)"
  ur: "بلاذر"
summary:
  ar: "ثمرة شبيهة بنوى التمر، لبّها حلو كلب الجوز، وقشرها متخلخل، وفيه عسل لزج. يابسة في آخر الرابعة، وعسلها مقرّح مورم يحرق الدم والأخلاط. تقطع الثآليل، وتنفع من برد العصب والفالج، ويدخّن بها البواسير، وهو من جملة السموم، وترياقه مخيض اللبن ودهن الجوز {cite:canon-ibn-sina-print-v1 p.388}، {cite:canon-ibn-sina-print-v1 p.389}."
  en: "A fruit like a date stone, with a sweet kernel like the walnut and a porous shell holding a sticky, strong-smelling juice. Dry at the end of the fourth degree. Its juice causes ulcers and swellings and burns the blood and humours. It cuts off warts, helps cold nerves and paralysis, and is smoked for piles to dry them. The book counts it among the poisons, with buttermilk and walnut oil as its antidote {cite:canon-ibn-sina-print-v1 p.388}, {cite:canon-ibn-sina-print-v1 p.389}."
  ur: "یہ ایک پھل ہے جو کھجور کی گٹھلی جیسا ہے، اس کا مغز اخروٹ کی طرح میٹھا ہوتا ہے، اور اس کا چھلکا سوراخ دار ہے جس میں چپچپا رس ہوتا ہے۔ چوتھے درجے کے آخر میں خشک۔ اس کا رس زخم اور ورم پیدا کرتا ہے اور خون اور رطوبتوں کو جلاتا ہے۔ یہ مسّوں کو کاٹتا ہے، سرد اعصاب اور فالج میں نفع دیتا ہے، اور بواسیر کو دھونی دے کر خشک کیا جاتا ہے۔ کتاب اسے زہروں میں شمار کرتی ہے، اور اس کا تریاق چھاچھ اور اخروٹ کا تیل بتاتی ہے {cite:canon-ibn-sina-print-v1 p.388}، {cite:canon-ibn-sina-print-v1 p.389}۔"
