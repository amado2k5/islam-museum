id: concept/rahan-fiqh
class: concept
kind: legal
label:
  ar: "الرهان"
  en: "Rahan: the wager (its senses, the contest in horse-racing and archery, and what may be staked)"
  ur: "رہان ⁦(شرط، مسابقت اور گروی)⁩"
  es: "Rahan: la apuesta (sus sentidos, la competición en las carreras de caballos y el tiro con arco, y lo que se puede apostar)"
  fr: "Rahan: le pari (ses sens, la compétition dans les courses de chevaux et le tir à l'arc, et ce qui peut être misé)"
  tr: "Bahis"
  id: "Taruhannya"
summary:
  ar: "الرهان يأتي بمعنى المخاطرة، وهي حرام باتفاق الفقهاء بين المسلمين والذميين لأنها صورة القمار، واختلفوا في الرهان بين المسلم والحربي فحرمه الجمهور وأجازه أبو حنيفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9017} ويأتي بمعنى المسابقة بالخيل أو الرمي وهو جائز بشروطه، وبمعنى الرهن ⁦(الوثيقة بالدين)⁩، وبمعنى المال المشروط في السباق، وهو مشروع باتفاق الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9017} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9018} واختلفوا فيما يجوز فيه السبق من الحيوان: فالشافعية تشمل الخيل والإبل والفيل والبغل والحمار في الأظهر، والمالكية الخيل والإبل، والحنفية الخيل والإبل وعلى الأرجل. ويشترط للجواز علم موضع البداية والغاية، وتساويهما، وإمكان سبق كل منهما، ولا يصح أن يشترط كل من المتسابقين على الآخر مالا إلا بوجود محلل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9018}"
  en: "Rahan means a wager or stake. In the sense of risk, it is forbidden by consensus among Muslims and dhimmis, because it takes the form of gambling. The jurists differ on a wager between a Muslim and a belligerent non-Muslim: the majority forbid it, and Abu Hanifa permits it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9017} It also means a race in horses or archery, which is permitted under conditions; a pledge held against a debt; and the prize stipulated in a race, which is lawful by consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9017} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9018} The jurists differ on which animals may race: the Shafi'is include horses, camels, elephants, mules and donkeys (the more likely view), the Malikis only horses and camels, and the Hanafis horses, camels and runners on foot. Permission requires knowing the starting point and the goal, equal conditions, the ability of each to win, and identified mounts; a prize that both sides stake on each other is not valid unless there is a third party whose horse is equal to both. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9018}"
  ur: "رہان کا مطلب شرط یا خطرہ ہے، جو قمار کی صورت ہونے کی وجہ سے حرام ہے؛ حربی سے شرط میں جمہور کے نزدیک حرام اور ابو حنیفہ کے نزدیک جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9017} گھوڑ دوڑ اور تیراندازی کی مسابقت شرائط کے ساتھ جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9018} دونوں فریقوں کی جانب سے انعام طے کرنا جائز نہیں، الا یہ کہ درمیان میں محلل ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9018}"
  es: "Rahan significa apuesta o riesgo. En el sentido de riesgo, está prohibido por consenso entre musulmanes y dhimmis, porque toma la forma de juego. Los juristas difieren sobre una apuesta entre un musulmán y un no musulmán beligerante: la mayoría la prohíbe, y Abu Hanifa la permite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9017} También significa una carrera de caballos o de tiro con arco, que está permitida bajo ciertas condiciones; una prenda hecha contra una deuda; y el premio estipulado en una carrera, que es lícito por consenso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9017} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9018} Los juristas difieren en cuanto a qué animales pueden competir en carreras: los shafi'ís incluyen caballos, camellos, elefantes, mulas y asnos (la opinión más probable), los malikíes solo caballos y camellos, y los hanafíes caballos, camellos y corredores a pie. El permiso requiere conocer el punto de partida y la meta, igualdad de condiciones, la capacidad de cada uno para ganar y monturas identificadas; un premio que ambas partes apuestan entre sí no es válido a menos que haya un tercero cuyo caballo sea igual al de ambos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9018}"
  fr: "Rahan signifie pari ou enjeu. Au sens de risque, il est interdit par consensus parmi les musulmans et les dhimmis, car il s'apparente à un jeu de hasard. Les juristes divergent quant à un pari entre un musulman et un non-musulman belligérant: la majorité l'interdit, tandis qu'Abu Hanifa l'autorise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9017} Il désigne également une course de chevaux ou de tir à l'arc, permise sous certaines conditions; un gage garanti par une dette; et le prix stipulé dans une course, licite par consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9017} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9018} Les juristes divergent quant aux animaux autorisés à participer à une course: les chafi'ites incluent les chevaux, les chameaux, les éléphants, les mules et les ânes (l'avis le plus probable), les malikites uniquement les chevaux et les chameaux, et les hanafites les chevaux, les chameaux et les coureurs à pied. L'autorisation requiert la connaissance du point de départ et de l'arrivée, des conditions égales, la capacité de chaque partie à gagner et l'identification des montures; un prix misé par les deux parties l'une sur l'autre n'est valable que s'il existe un tiers dont le cheval est de force égale à ceux des deux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9018}"
  tr: "Bahis risk demektir; bu, hukukçuların Müslümanlar ve zimmiler arasındaki uzlaşmasıyla yasaklanmıştır çünkü kumar biçimidir. Müslüman ile savaşçı arasında görüş ayrılığı vardır; çoğunluk bunu yasaklar ve Ebu Hanifa buna izin verir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9017} Atlarla veya okçulukla yarışmak anlamına gelir, bu koşullar altında izin verilen bir şeydir, bahis (borçlu bir belge) ve hukukçuların uzlaşmasıyla izin verilen yarışa bağlı para anlamına gelir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9017} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9018} Hangi hayvanın izin verildiği konusunda farklı görüşler ayrılmışlardır: Şafi'ler atları, develeri, filleri, katırları ve eşekleri içerirken, Malikiler at ve develeri içerirken, Hanafiler atları, develeri ve yaya olarak kabul eder. İzin verilebilirlik için, başlangıç ve sonun yerini, eşitliğini ve her birinin onlardan önce gelme olasılığını bilmek gerekir. Her yarışmacının, yasal bir kişi huzurunda diğerinden para istemesi caiz değildir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.9018}"
  id: "Bertaruh berarti risiko, yang dilarang oleh konsensus para ahli hukum antara Muslim dan dhimmi karena itu adalah bentuk perjudian. Ada perbedaan pendapat antara Muslim dan prajurit; mayoritas melarangnya dan Abu Hanifa mengizinkannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9017} Itu berarti bersaing dengan kuda atau panahan, yang diperbolehkan dalam kondisinya, dan berarti taruhan (dokumen berutang), dan berarti uang bergantung pada perlombaan, yang diperbolehkan oleh konsensus para ahli hukum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9017} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9018} Mereka berbeda dalam hal hewan mana yang diperbolehkan: Shafi'i mencakup kuda, unta, gajah, keledai, dan keledai dalam bentuk yang lebih baru, sedangkan Maliki mencakup kuda dan unta, sedangkan Hanafi mempertimbangkan kuda, unta, dan berjalan kaki. Untuk diperbolehkan, diperlukan mengetahui tempat awal dan akhir, kesetaraan mereka, dan kemungkinan keduanya mendahului. Tidak diperbolehkan bagi setiap peserta untuk meminta uang dari yang lain kecuali di hadapan orang yang berhak hukum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9018}"
