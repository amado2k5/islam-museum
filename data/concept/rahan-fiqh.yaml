id: concept/rahan-fiqh
class: concept
kind: legal
label:
  ar: "الرهان"
  en: "Rahan: the wager (its senses, the contest in horse-racing and archery, and what may be staked)"
  ur: "رہان (شرط، مسابقت اور گروی)"
summary:
  ar: "الرهان يأتي بمعنى المخاطرة، وهي حرام باتفاق الفقهاء بين المسلمين والذميين لأنها صورة القمار، واختلفوا في الرهان بين المسلم والحربي فحرمه الجمهور وأجازه أبو حنيفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9017} ويأتي بمعنى المسابقة بالخيل أو الرمي وهو جائز بشروطه، وبمعنى الرهن (الوثيقة بالدين)، وبمعنى المال المشروط في السباق، وهو مشروع باتفاق الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9017} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9018} واختلفوا فيما يجوز فيه السبق من الحيوان: فالشافعية تشمل الخيل والإبل والفيل والبغل والحمار في الأظهر، والمالكية الخيل والإبل، والحنفية الخيل والإبل وعلى الأرجل. ويشترط للجواز علم موضع البداية والغاية، وتساويهما، وإمكان سبق كل منهما، ولا يصح أن يشترط كل من المتسابقين على الآخر مالا إلا بوجود محلل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9018}"
  en: "Rahan means a wager or stake. In the sense of risk, it is forbidden by consensus among Muslims and dhimmis, because it takes the form of gambling. The jurists differ on a wager between a Muslim and a belligerent non-Muslim: the majority forbid it, and Abu Hanifa permits it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9017} It also means a race in horses or archery, which is permitted under conditions; a pledge held against a debt; and the prize stipulated in a race, which is lawful by consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9017} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9018} The jurists differ on which animals may race: the Shafi'is include horses, camels, elephants, mules and donkeys (the more likely view), the Malikis only horses and camels, and the Hanafis horses, camels and runners on foot. Permission requires knowing the starting point and the goal, equal conditions, the ability of each to win, and identified mounts; a prize that both sides stake on each other is not valid unless there is a third party whose horse is equal to both. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9018}"
  ur: "رہان کا مطلب شرط یا خطرہ ہے، جو قمار کی صورت ہونے کی وجہ سے حرام ہے؛ حربی سے شرط میں جمہور کے نزدیک حرام اور ابو حنیفہ کے نزدیک جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9017} گھوڑ دوڑ اور تیراندازی کی مسابقت شرائط کے ساتھ جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9018} دونوں فریقوں کی جانب سے انعام طے کرنا جائز نہیں، الا یہ کہ درمیان میں محلل ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9018}"
