summary:
  fr: "L'art de la prise de parole (fann al-ilqa') est enseigné par [[person/tariq-al-suwaidan|Tareq al-Suwaidan]] dans deux leçons de [[work/leadership-development-academy-1-program|the Leaders' Academy]], après [[concept/fann-al-talif|the art of authorship]]. {cite:assabile-tareq-al-suwaidan leadership-development-academy-1/ep05 00:02:00} Il consacre habituellement à ce cours cinq jours de cinq heures ; l'académie n'en offre que deux. Il renvoie à son livre et à l'album vidéo correspondant, qu'il conseille d'écouter quatre ou cinq fois. {cite:assabile-tareq-al-suwaidan leadership-development-academy-1/ep05 00:02:30} {cite:assabile-tareq-al-suwaidan leadership-development-academy-1/ep05 00:03:00} Règles, modèles et pourcentages ci-dessous sont les siens ; les études qu'il invoque ne sont pas nommées."
  ar: "فن الإلقاء كما يعلّمه طارق السويدان في أكاديمية إعداد القادة: صفات الملقي المتميز، ونموذجه «الخمسة P»، وقواعد الشرائح، وعلاج الرهبة، والمقدمة والخاتمة، والصوت والوقفات ولغة الجسد."
  en: "Public speaking as Tareq al-Suwaidan teaches it in the Leaders' Academy: the qualities of the outstanding speaker, his 'five Ps' model, rules for slides, managing fear, the introduction and conclusion, voice, pauses and body language."
  ur: "فنِ خطابت جیسا طارق السویدان قائدین کی اکیڈمی میں سکھاتے ہیں: نمایاں مقرر کی صفات، ان کا «پانچ P» ماڈل، سلائیڈوں کے اصول، خوف کا علاج، تمہید و اختتام، آواز، وقفے اور جسمانی زبان۔"
