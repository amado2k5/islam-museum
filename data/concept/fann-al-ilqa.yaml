id: concept/fann-al-ilqa
class: concept
kind: term
label:
  ar: "فن الإلقاء عند طارق السويدان"
  en: "The art of public speaking (Tareq al-Suwaidan)"
  ur: "طارق السویدان کے ہاں فنِ خطابت"
  es: "El arte de hablar en público (Tareq al-Suwaidan)"
  fr: "L'art oratoire (Tareq al-Suwaidan)"
summary:
  ar: "فن الإلقاء كما يعلّمه طارق السويدان في أكاديمية إعداد القادة: صفات الملقي المتميز، ونموذجه «الخمسة P»، وقواعد الشرائح، وعلاج الرهبة، والمقدمة والخاتمة، والصوت والوقفات ولغة الجسد."
  en: "Public speaking as Tareq al-Suwaidan teaches it in the Leaders' Academy: the qualities of the outstanding speaker, his 'five Ps' model, rules for slides, managing fear, the introduction and conclusion, voice, pauses and body language."
  ur: "فنِ خطابت جیسا طارق السویدان قائدین کی اکیڈمی میں سکھاتے ہیں: نمایاں مقرر کی صفات، ان کا «پانچ P» ماڈل، سلائیڈوں کے اصول، خوف کا علاج، تمہید و اختتام، آواز، وقفے اور جسمانی زبان۔"
  es: "Hablar en público según la enseñanza de Tareq al-Suwaidan en la Academia de Líderes: las cualidades del orador sobresaliente, su modelo de las \"cinco P\", reglas para las diapositivas, cómo controlar el miedo, la introducción y la conclusión, la voz, las pausas y el lenguaje corporal."
  fr: "L'art oratoire tel qu'enseigné par Tareq al-Suwaidan à la Leaders' Academy: les qualités de l'orateur exceptionnel, son modèle des « cinq P », les règles relatives aux diapositives, la gestion du trac, l'introduction et la conclusion, la voix, les pauses et le langage corporel."
