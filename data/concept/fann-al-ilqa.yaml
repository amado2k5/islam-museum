summary:
  ar: "فن الإلقاء كما يعلّمه طارق السويدان في أكاديمية إعداد القادة: صفات الملقي المتميز، ونموذجه «الخمسة P»، وقواعد الشرائح، وعلاج الرهبة، والمقدمة والخاتمة، والصوت والوقفات ولغة الجسد."
  en: "Public speaking as Tareq al-Suwaidan teaches it in the Leaders' Academy: the qualities of the outstanding speaker, his 'five Ps' model, rules for slides, managing fear, the introduction and conclusion, voice, pauses and body language."
  ur: "فنِ خطابت جیسا طارق السویدان قائدین کی اکیڈمی میں سکھاتے ہیں: نمایاں مقرر کی صفات، ان کا «پانچ P» ماڈل، سلائیڈوں کے اصول، خوف کا علاج، تمہید و اختتام، آواز، وقفے اور جسمانی زبان۔"
