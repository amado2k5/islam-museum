label:
  ar: "علامات المانيا"
  en: "Signs of mania"
  fr: "Les signes de la manie"
  ur: "مانیا کی علامات"
  es: "Signos de manía"
summary:
  ar: "يذكر ابن سينا علامات المانيا عامة، والعلامات المنذرة به، وما يدل عليه في آخره أو في الأمراض الحادة، وعلامة الكائن من سوداء محترقة ومن سوداء صفراوية، وفيه سطر موسوم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v2 p.102}"
  en: "Ibn Sina gives the general signs of mania and the signs that warn of it, what it points to at its end or in acute illnesses, and the signs of that from burnt black bile and from bilious black bile; the record has a labelled line in a section held for the founder's ruling {cite:canon-ibn-sina-print-v2 p.102}"
  fr: "Ibn Sina donne les signes généraux de la manie et les signes qui l’annoncent, ce qu’elle indique à sa fin ou dans les maladies aiguës, et les signes de celle qui vient de la bile noire brûlée et de la bile noire bilieuse ; la fiche comporte une ligne signalée dans une section en attente de la décision du fondateur {cite:canon-ibn-sina-print-v2 p.102}"
  ur: "ابن سینا مانیا کی عمومی علامات اور اس سے خبردار کرنے والی علامات بتاتا ہے، اور یہ کہ آخر میں یا تیز بیماریوں میں وہ کس کی نشانی ہے، اور جلے ہوئے سودا اور صفراوی سودا سے ہونے والے کی علامت؛ اس میں ایک موسوم سطر بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v2 p.102}۔"
  es: "Ibn Sina da los signos generales de la manía y los signos que la advierten, lo que indica en su final o en enfermedades agudas, y los signos de la bilis negra quemada y de la bilis negra biliosa; el registro tiene una línea etiquetada en una sección reservada para el dictamen del fundador {cite:canon-ibn-sina-print-v2 p.102}"
