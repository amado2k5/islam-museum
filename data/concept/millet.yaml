kids:
  ar: "الملّة كلمة تعني الدين أو الجماعة التي تتبع دينًا واحدًا، واستعملها العثمانيون بهذه المعاني."
  en: "Millet is a word that means a religion or a community that shares one faith, and the Ottomans used it in both ways."
