id: concept/millet
class: concept
kind: political
label: { ar: "الملّة", en: "Millet", ur: "ملت" }
summary:
  ar: "ملّة، وتُنطق بالتركية ميلّت، لفظ عربي معناه الدين والجماعة الدينية والأمة، وقد استُعملت هذه المعاني الثلاثة معاً في الدولة العثمانية حتى عهد التنظيمات وبعده. تقول دائرة المعارف الإسلامية إن ما يسمى نظام الملل ليس مؤسسة واحدة بل مجموعة ترتيبات اجتماعية في الغالب تختلف باختلاف الزمان والمكان، وإن المصطلح لم يُستعمل للجماعات غير المسلمة وحدها ولا باطّراد قبل القرن التاسع عشر {cite:encyclopaedia-of-islam-2 vol. 7 p. 81} {cite:encyclopaedia-of-islam-2 vol. 7 p. 83}."
  en: "Millet is the Turkish rendering of Arabic milla, meaning religion, religious community and nation, three senses used side by side in the Ottoman Empire until the Tanzimat and after. The Encyclopaedia of Islam stresses that the so-called millet system was not one institution but a set of largely social arrangements varying with time and place, and that the word was not used exclusively or consistently for non-Muslim communities before the nineteenth century {cite:encyclopaedia-of-islam-2 vol. 7 p. 81} {cite:encyclopaedia-of-islam-2 vol. 7 p. 83}."
  ur: "ملت ترکی میں عربی لفظ ملۃ کی صورت ہے، جس کے معنی دین، مذہبی جماعت اور قوم ہیں، اور سلطنتِ عثمانیہ میں یہ تینوں معنی تنظیمات کے دور تک اور اس کے بعد بھی ساتھ ساتھ چلتے رہے۔ دائرۃ المعارف الاسلامیہ زور دیتا ہے کہ نام نہاد نظامِ ملت کوئی ایک ادارہ نہیں تھا بلکہ زیادہ تر سماجی نوعیت کے انتظامات کا مجموعہ تھا جو وقت اور جگہ کے ساتھ بدلتا رہا، اور یہ لفظ انیسویں صدی سے پہلے صرف غیر مسلم جماعتوں کے لیے یا مسلسل استعمال نہیں ہوتا تھا {cite:encyclopaedia-of-islam-2 vol. 7 p. 81} {cite:encyclopaedia-of-islam-2 vol. 7 p. 83}."
