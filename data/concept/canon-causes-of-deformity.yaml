label: { ar: "أسباب فساد الشكل عند ابن سينا", en: "The causes of deformity of shape in the Canon", ur: "شکل بگڑنے کے اسباب، قانون کے مطابق" }
summary:
  ar: "في الفصل الخامس يعدد ابن سينا أسباب فساد الشكل: ما وقع في الخلقة الأولى فقصرت القوة المصورة، وما يقع عند الانفصال من الرحم وعند قمط الطفل، والأسباب البادية كالسقطة والضربة، والأسباب المرضية كالجذام والتمدد والسمن والهزال المفرطين والأورام وسوء اندمال القروح {cite:canon-ibn-sina-print-v1 pp.144-145}."
  en: "In chapter 5 Ibn Sina lists the causes of deformity of shape: faults in first creation where the shaping power fell short; those at birth from the womb and at the swaddling of the child; evident causes such as a fall or blow; and morbid causes such as leprosy, spasm, excessive fatness or leanness, tumours and poor healing of ulcers {cite:canon-ibn-sina-print-v1 pp.144-145}."
