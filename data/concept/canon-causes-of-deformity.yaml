id: concept/canon-causes-of-deformity
class: concept
kind: scientific
label:
  ar: "أسباب فساد الشكل عند ابن سينا"
  en: "The causes of deformity of shape in the Canon"
  fr: "Causes des déformations dans le Canon"
  ur: "شکل بگڑنے کے اسباب، قانون کے مطابق"
  es: "Las causas de la deformidad de la forma en el Canon"
  tr: "İbn Sina'ya göre Görünüşün Bozulmasının Nedenleri"
  id: "Alasan Korupsi Penampilan Menurut Ibn Sina"
summary:
  ar: "في الفصل الخامس يعدد ابن سينا أسباب فساد الشكل: ما وقع في الخلقة الأولى فقصرت القوة المصورة، وما يقع عند الانفصال من الرحم وعند قمط الطفل، والأسباب البادية كالسقطة والضربة، والأسباب المرضية كالجذام والتمدد والسمن والهزال المفرطين والأورام وسوء اندمال القروح {cite:canon-ibn-sina-print-v1 pp.144-145}."
  en: "In chapter 5 Ibn Sina lists the causes of deformity of shape: faults in first creation where the shaping power fell short; those at birth from the womb and at the swaddling of the child; evident causes such as a fall or blow; and morbid causes such as leprosy, spasm, excessive fatness or leanness, tumours and poor healing of ulcers {cite:canon-ibn-sina-print-v1 pp.144-145}."
  fr: "Au chapitre 5, Ibn Sina attribue les déformations aux défauts de formation initiale de la faculté formatrice, à la naissance et à l’emmaillotage, aux causes extérieures comme chute ou coup et aux maladies : lèpre, spasme, obésité ou maigreur excessives, tumeurs et mauvaise cicatrisation {cite:canon-ibn-sina-print-v1 pp.144-145}."
  es: "En el capítulo 5, Ibn Sina enumera las causas de la deformidad de la forma: defectos en la creación original donde el poder de modelado fue insuficiente; aquellos al nacer desde el útero y al envolver al niño; causas evidentes como una caída o un golpe; y causas mórbidas como la lepra, espasmos, exceso de grasa o delgadez, tumores y mala cicatrización de úlceras {cite:canon-ibn-sina-print-v1 pp.144-145}."
  ur: "باب 5 میں ابن سینا نے شکل کی خرابی کے اسباب کی فہرست دی ہے: پہلی تخلیق میں خرابیاں جہاں تشکیل دینے کی طاقت کم پڑ گئی۔ وہ لوگ جو رحم سے پیدا ہوتے ہیں اور بچے کو لپیٹتے وقت؛ واضح وجوہات جیسے گرنا یا دھچکا؛ اور بیماری کی وجوہات جیسے جذام، اینٹھن، بہت زیادہ موٹاپا یا دبلا پن، ٹیومر اور السر کی خراب شفا یابی"
  tr: "Beşinci bölümde, İbn Sina form bozulmasının nedenlerini sıralar: orijinal yaratılışta fiziksel gücün kısıtlanmasına neden olan şeyler, rahimden ayrılırken ve çocuk sütten kesildiğinde neler olur, düşme ve darbe gibi bariz nedenler ve cüzzam, genişleme, obezite, aşırı zayıflama, tümörler ve zayıf yara oluşumu gibi patolojik nedenler {cite:canon-ibn-sina-print-v1 s.144-145}."
  id: "Pada bab kelima, Ibn Sina mencantumkan penyebab kerusakan bentuk: apa yang terjadi dalam penciptaan asli yang menyebabkan kekuatan fisik terbatas, apa yang terjadi saat terpisah dari rahim dan saat anak disapih, penyebab yang jelas seperti jatuh dan benturan, serta penyebab patologis seperti kusta, pelebaran, obesitas, kurus kering berlebihan, tumor, dan pembentukan luka yang buruk {cite:canon-ibn-sina-print-v1 hlm.144-145}."
