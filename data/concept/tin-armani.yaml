label:
  ar: "طين أرمني"
  en: "Tin armani (the Armenian earth)"
  ur: "طین ارمنی"
  es: "Tin armani (la tierra armenia)"
  fr: "Tin armani (la terre arménienne)"
summary:
  ar: "طين أحمر إلى الغبرة يستعمله الصائغون في صبغ الذهب، يحبس الدم، وينفع من الطواعين والقروح والنزلة والقلاع والحميات السلية والوبائية."
  en: "A reddish-grey earth used by goldsmiths in colouring gold; it stops blood and helps plague, wounds, catarrh, thrush and consumptive and epidemic fevers."
  ur: "سرمئی مائل سرخ مٹی، جسے سنار سونے کی رنگت میں استعمال کرتے ہیں؛ یہ خون روکتی ہے اور طاعون، زخموں، نزلہ، قلاع اور سلّی و وبائی بخاروں میں فائدہ دیتی ہے۔"
  es: "Una tierra de color gris rojizo utilizada por los orfebres para colorear el oro; detiene las hemorragias y ayuda a combatir la peste, las heridas, el catarro, la candidiasis y las fiebres tuberculosas y epidémicas."
  fr: "Une terre gris rougeâtre utilisée par les orfèvres pour colorer l'or; elle arrête les saignements et soulage la peste, les plaies, le catarrhe, le muguet et les fièvres tuberculeuses et épidémiques."
