label:
  ar: إحصار
  en: Ihsar (being prevented from completing the rite)
summary:
  ar: 'الإحصار في اللغة المنع من بلوغ المناسك بمرض أو نحوه، وهو معناه الشرعي مع خلاف فيما يتحقق به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1845} وتعريفات المذاهب: الحنفية المنع من الوقوف والطواف معاً، ومالكية المنع من أحدهما أو كليهما، والشافعية والحنابلة المنع من أركان الحج أو العمرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1845} أصله حادثة الحديبية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1846} والخلاف هل يتحقق بالعدو وحده أم كذلك بالمرض وغيره، فالحنفية وجماعة يقولون بالعموم، والجمهور بالعدو والفتنة والحبس ظلماً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1846} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1847} شروطه: سبق الإحرام، وعدم الوقوف قبل المانع عند الحنفية والمالكية، واليأس من زوال المانع قبل فوات الحج، وعدم علم المحرم بالمانع عند الإحرام عند المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1848} وأنواعه بحسب الركن: الإحصار عن الوقوف والطواف معاً، وعن الوقوف وحده، وعن طواف الركن، وبحسب السبب: العدو والفتنة والحبس والمنع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1849} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1850} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1851} والحبس بحق لا يُعد إحصاراً عند المالكية والشافعية والحنابلة، والمحبوس ظلماً أو المعسر ثبت إعساره محصر، وقرض الدائن يُعد مانعاً عند الشافعية والحنابلة.'
  en: 'Ihsar is, in the lexicon, being barred from the rites by sickness or the like; the jurists give the word the same meaning, though they differ on what counts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1845} The schools define it differently: the Hanafis as being barred from both standing and circling, the Malikis from one or both, the Shafi''is and Hanbalis from any pillar of hajj or umra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1845} Its basis is the Hudaybiyya episode. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1846} The dispute is whether only an enemy counts or illness and similar causes too: the Hanafis and some others include all, while the majority limit it to an enemy, strife and unjust imprisonment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1846} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1847} Its conditions: a prior ihram; no standing before the obstacle according to the Hanafis and Malikis; despair of removal before the hajj is lost; and, for the Malikis, the pilgrim''s ignorance of the obstacle at entry. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1848} Types by pillar: ihsar from standing and circling together, from standing alone, and from the pillar circling; by cause: enemy, strife, imprisonment and bars of the ruler, creditor and husband. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1849} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1850} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1851}'
