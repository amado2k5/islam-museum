id: concept/ihsar
class: concept
kind: legal
label:
  ar: إحصار
  en: Ihsar (being prevented from completing the rite)
  es: "Ihsar (impedimento para completar el rito)"
  fr: "Ihsar (être empêché d'achever le rite)"
  ur: "اظہار ⁦(رسم کو پورا کرنے سے روکا جانا)⁩"
summary:
  ar: 'الإحصار في اللغة المنع من بلوغ المناسك بمرض أو نحوه، وهو معناه الشرعي مع خلاف فيما يتحقق به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1845} وتعريفات المذاهب: الحنفية المنع من الوقوف والطواف معاً، ومالكية المنع من أحدهما أو كليهما، والشافعية والحنابلة المنع من أركان الحج أو العمرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1845} أصله حادثة الحديبية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1846} والخلاف هل يتحقق بالعدو وحده أم كذلك بالمرض وغيره، فالحنفية وجماعة يقولون بالعموم، والجمهور بالعدو والفتنة والحبس ظلماً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1846} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1847} شروطه: سبق الإحرام، وعدم الوقوف قبل المانع عند الحنفية والمالكية، واليأس من زوال المانع قبل فوات الحج، وعدم علم المحرم بالمانع عند الإحرام عند المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1848} وأنواعه بحسب الركن: الإحصار عن الوقوف والطواف معاً، وعن الوقوف وحده، وعن طواف الركن، وبحسب السبب: العدو والفتنة والحبس والمنع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1849} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1850} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1851} والحبس بحق لا يُعد إحصاراً عند المالكية والشافعية والحنابلة، والمحبوس ظلماً أو المعسر ثبت إعساره محصر، وقرض الدائن يُعد مانعاً عند الشافعية والحنابلة. ومن الأسباب: المدين المحبوس، والزوج يمنع زوجته ⁦(في النفل باتفاق، وفي فرض الحج بحسب المذاهب)⁩، والأب يمنع ولده من التطوع، والعدة الطارئة، والمرض والكسر وهلاك النفقة والراحلة وضلال الطريق بحسب المذاهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1852} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1853} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1854}. ويُتحلل المحصر بالنية وذبح الهدي عند الجمهور، وبالنية وحدها عند المالكية، والهدي المبعوث لا يحلّ حتى يذبح، وتكون الشاة عن واحد والبدنة عن سبعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1855} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1856} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1857} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1858}. وفي الهدي: يلزم المفرد هدي واحد، والقارن هدي واحد عند الشافعية والحنابلة أو هديان عند الحنفية، ويُذبح الهدي حيث أُحصر أو في الحرم عند الحنفية، وزمانه مطلق عند الجمهور وأيام النحر عند الصاحبين، ويُبدل الهدي بالطعام أو الصيام عند الشافعية والحنابلة، والحلق شرط عند الشافعية والحنابلة لا عند الحنفية والمالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1859} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1860} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1861} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1862}. ومن اشترط التحلل في إحرامه يُحلّ بالشرط عند الشافعية والحنابلة لا عند الحنفية والمالكية، وقضاء الواجب المحصر عنه واجب، والنفل لا قضاء فيه عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1863} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1864} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1865} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1866}. وفي القضاء: يجب على المحصر قضاء النسك الواجب الذي أُحصر عنه، أما النفل ففيه خلاف، ومن حُصر عن الوقوف دون الطواف أو عن البيت دون الوقوف فله أحكام تفصيلية، وإذا زال الإحصار فتختلف الأحكام بحسب بقاء وقت الحج أو الهدي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1867} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1868} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1869} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1870} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1871}.'
  en: 'Ihsar is, in the lexicon, being barred from the rites by sickness or the like; the jurists give the word the same meaning, though they differ on what counts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1845} The schools define it differently: the Hanafis as being barred from both standing and circling, the Malikis from one or both, the Shafi''is and Hanbalis from any pillar of hajj or umra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1845} Its basis is the Hudaybiyya episode. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1846} The dispute is whether only an enemy counts or illness and similar causes too: the Hanafis and some others include all, while the majority limit it to an enemy, strife and unjust imprisonment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1846} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1847} Its conditions: a prior ihram; no standing before the obstacle according to the Hanafis and Malikis; despair of removal before the hajj is lost; and, for the Malikis, the pilgrim''s ignorance of the obstacle at entry. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1848} Types by pillar: ihsar from standing and circling together, from standing alone, and from the pillar circling; by cause: enemy, strife, imprisonment and bars of the ruler, creditor and husband. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1849} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1850} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1851} Among the causes: imprisonment for debt, a husband barring his wife (in voluntary hajj by agreement and in obligatory hajj by school), a father barring his son from voluntary hajj, the emergent waiting period, and illness, lameness, lost funds or mount and losing the road by school. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1852} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1853} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1854}. The barred pilgrim releases by intention and slaughter of an offering according to the majority, by intention alone according to the Malikis; a sent offering does not release until slaughtered; a sheep serves one and a camel or cow seven. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1855} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1856} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1857} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1858}. On the offering: a single pilgrim owes one; the qarin owes one (Shafi''is and Hanbalis) or two (Hanafis), slaughtered where barred or in the sanctuary by the Hanafis; the time is open for the majority and the days of sacrifice for the two companions; a substitute of food or fasting is allowed by the Shafi''is and Hanbalis; shaving is a condition for the Shafi''is and Hanbalis only. Stipulation at entry releases by the Shafi''is and Hanbalis only; the missed obligatory rite is made up, and the voluntary one is not, for most jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1859} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1860} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1861} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1862}. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1863} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1864} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1865} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1866}. The make-up: a barred pilgrim makes up an obligatory rite he was barred from; voluntary rites differ. Barring after standing and the Ifada circling is not ihsar. When the bar lifts, the outcome depends on whether time remains to catch the hajj or the offering. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1867} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1868} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1869} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1870} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1871}.'
  es: "Ihsar es, en el léxico, estar excluido de los ritos por enfermedad o similar; los juristas dan a la palabra el mismo significado, aunque difieren en qué cuenta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1845} Las escuelas lo definen de manera diferente: los Hanafi como estar excluido tanto de estar de pie como de dar vueltas, los Malikis de uno o ambos, los Shafi'i y Hanbali de cualquier pilar del Hajj o la Umrah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1845} Su base es el episodio de Hudaybiyya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1846} La disputa es si solo cuenta un enemigo o también la enfermedad y causas similares: los Hanafi y algunos otros incluyen todo, mientras que la mayoría lo limita a un enemigo, conflicto y encarcelamiento injusto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1846} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1847} Sus condiciones: un ihram previo; no estar de pie ante el obstáculo según los hanafíes y malikíes; la desesperación de ser removido antes del hajj se pierde; y, para los malikíes, la ignorancia del peregrino sobre el obstáculo al entrar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1848} Tipos por pilar: ihsar por estar de pie y rodear juntos, por estar de pie solo y por rodear el pilar; por causa: enemigo, conflicto, encarcelamiento y barrotes del gobernante, acreedor y esposo. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1849} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1850} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1851} Entre las causas: prisión por deudas, prohibición de un marido a su esposa (en hajj voluntario por acuerdo y en el hajj obligatorio por la escuela), un padre que excluye a su hijo del hajj voluntario, el período de espera emergente, y enfermedad, cojera, pérdida de fondos o de montura y pérdida del camino por la escuela. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1852} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1853} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1854}. El peregrino excluido se libera por intención y sacrificio de una ofrenda según la mayoría, por intención solamente según los malikíes; una ofrenda enviada no se libera hasta que es sacrificada; una oveja sirve para uno y un camello o vaca para siete. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1855} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1856} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1857} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1858}. Sobre la ofrenda: un solo peregrino debe uno; el qarin debe uno (Shafi'is y Hanbalis) o dos (Hanafis), sacrificados donde está prohibido o en el santuario por los Hanafis; el tiempo está abierto para la mayoría y los días de sacrificio para los dos compañeros; un sustituto de comida o ayuno es permitido por los Shafi'is y Hanbalis; afeitarse es una condición solo para los Shafi'is y Hanbalis. Estipulación en el momento de la liberación de entrada por parte de Shafi'is y Hanbalis únicamente; Para la mayoría de los juristas, el rito obligatorio perdido se recupera, y el voluntario no. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1859} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1860} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1861} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1862}. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1863} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1864} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1865} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1866}. La recuperación: un peregrino excluido recupera un rito obligatorio del que fue excluido; los ritos voluntarios difieren. La exclusión después de estar de pie y el círculo de Ifada no es ihsar. Cuando se levanta la prohibición, el resultado depende de si queda tiempo para alcanzar el hajj o la ofrenda. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1867} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1868} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1869} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1870} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1871}."
  fr: "L'ihsar, dans le lexique, désigne l'empêchement des rites pour cause de maladie ou autre. Les juristes lui attribuent la même signification, bien qu'ils divergent sur les critères pris en compte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1845} Les écoles de pensée le définissent différemment: les Hanafites excluent à la fois la station debout et la circumambulation, les Malikites l'excluent de l'un ou des deux, tandis que les Shafi'ites et les Hanbalites excluent tout pilier du hajj ou de la umra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1845} Son fondement est l'épisode de Hudaybiyya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1846} Le débat porte sur la question de savoir si seul un ennemi est concerné ou si la maladie et les causes similaires le sont également: les Hanafites et certains autres les incluent toutes, tandis que la majorité le limite à un ennemi, un conflit ou un emprisonnement injuste. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1846} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1847} Ses conditions: un ihram préalable; l’interdiction de s’arrêter devant l’obstacle selon les écoles hanafite et malikite; l’espoir d’être dégagé avant le hajj; et, pour les malikites, l’ignorance de l’obstacle par le pèlerin à l’entrée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1848} Types selon le pilier: ihsar (en se tenant debout et en tournant ensemble), en se tenant seul, et en tournant autour du pilier; selon la cause: ennemi, conflit, emprisonnement et interdictions du souverain, du créancier et du mari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1849} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1850} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1851} Parmi les causes: l'emprisonnement pour dettes, un mari interdisant à sa femme (au hajj volontaire par accord et au obligatoire le hajj à l'école), un père interdisant à son fils le hajj volontaire, la période d'attente émergente et la maladie, la boiterie, la perte d'argent ou la perte du chemin de l'école. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1852} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1853} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1854}. Le pèlerin interdit de pèlerinage est libéré par l'intention et le sacrifice d'une offrande selon la majorité, par l'intention seule selon les Malikites; une offrande envoyée n'est libérée qu'après avoir été sacrifiée; un mouton vaut une offrande et un chameau ou une vache sept. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1855} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1856} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1857} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1858}. Concernant l'offrande: un pèlerin seul doit une pièce; le qarin doit une pièce (chafi'ite et hanbalite) ou deux (hanafite), abattues là où c'est interdit ou dans le sanctuaire selon l'école hanafite; le moment est libre pour la majorité et les jours du sacrifice pour les deux compagnons; un substitut de nourriture ou le jeûne sont autorisés par les chafi'ites et les hanbalites; le rasage est une condition requise uniquement par les chafi'ites et les hanbalites. Stipulation à l'entrée des libérations par les Shafi'is et les Hanbalis uniquement; le rite obligatoire manqué est rattrapé, et le rite volontaire ne l'est pas, pour la plupart des juristes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1859} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1860} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1861} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1862}. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1863} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1864} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1865} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1866}. Rattraper le pèlerin interdit: il rattrape un rite obligatoire dont il a été empêché; les rites volontaires sont traités différemment. L’interdiction après la station debout et la circumambulation de l’Ifada n’est pas considérée comme un ihsar. Lorsque l’interdiction est levée, le résultat dépend du temps restant pour accomplir le hajj ou l’offrande. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1867} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1868} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1869} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1870} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1871}."
  ur: "احسار، لغت میں، بیماری یا اسی طرح کے عبادات سے روکنا ہے۔ فقہاء اس لفظ کے ایک ہی معنی بیان کرتے ہیں، حالانکہ ان کا اس میں اختلاف ہے۔ {حوالہ: فقہ الموسوعۃ-کویتیہ-نور-v3 صفحہ 1845} مکاتب اس کی مختلف تعریف کرتے ہیں: احناف کو کھڑے ہونے اور چکر لگانے سے، مالکیوں کو ایک یا دونوں سے، شافعی اور حنبلی کو حج یا عمرہ کے کسی بھی رکن سے منع کیا گیا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 1845} اس کی بنیاد واقعہ حدیبیہ ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1846} اختلاف یہ ہے کہ صرف دشمن شمار ہوتا ہے یا بیماری اور اسی طرح کے اسباب بھی: احناف اور بعض دوسرے سب شامل ہیں، جب کہ اکثریت اسے دشمن، جھگڑے اور ناجائز قید تک محدود رکھتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1846} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1847} اس کی شرائط: پہلے کا احرام؛ حنفیہ اور مالکیہ کے نزدیک رکاوٹ کے سامنے کھڑا نہیں ہونا۔ حج ضائع ہونے سے پہلے ہٹانے کی مایوسی؛ اور، مالکیوں کے لیے، داخلے میں رکاوٹ کے بارے میں حاجی کی لاعلمی۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 1848} ستون کے لحاظ سے اقسام: کھڑے ہونے اور ایک ساتھ چکر لگانے سے، تنہا کھڑے ہونے سے، اور ستون کے چکر لگانے سے؛ وجہ سے: دشمن، جھگڑا، قید اور حاکم، قرض دار اور شوہر کی سلاخیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1849} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1850} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1851} شوہر پر بیوی پر واجب الادا قرض کے اسباب میں سے: معاہدے کے ذریعہ اور اسکول کے ذریعہ فرض حج میں)) ایک باپ اپنے بیٹے کو رضاکارانہ حج سے روکتا ہے، ابھرتی ہوئی عدت، اور بیماری، لنگڑا پن، فنڈز کھو جانا یا اسکول کے راستے میں سوار ہونا اور کھو جانا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1852} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1853} ممنوعہ حاجی اکثریت کے مطابق قربانی کی نیت اور ذبح کر کے چھوڑ دیتا ہے، مالکیوں کے نزدیک صرف نیت سے۔ بھیجی ہوئی قربانی اس وقت تک جاری نہیں ہوتی جب تک کہ اسے ذبح نہ کیا جائے۔ ایک بھیڑ ایک اور اونٹ یا گائے کی سات خدمت کرتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1855} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1856} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ1857} صفحہ 1858}۔ ہدیہ پر: ایک ہی حاجی کا مقروض ہے۔ قارین ایک ⁦(شافعی اور حنبلی)⁩ یا دو ⁦(حنفیوں)⁩ کا مقروض ہے، جہاں حنفیوں کی طرف سے منع کیا گیا ہو یا حرم میں ذبح کیا جائے؛ جمہور کے لیے وقت کھلا ہے اور دو صحابہ کے لیے قربانی کے دن۔ شافعیوں اور حنبلیوں کے نزدیک کھانے یا روزے کے متبادل کی اجازت ہے۔ منڈوانا صرف شافعی اور حنبلی کے لیے شرط ہے۔ صرف شافعیوں اور حنبلیوں کی طرف سے داخلے کی شرائط؛ چھوٹ جانے والی واجب رسم کی قضا ہو جاتی ہے، اور زیادہ تر فقہاء کے نزدیک رضاکارانہ نہیں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1859} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1860} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1861} صفحہ 1862}۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1863} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1864} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1865} صفحہ 1866}۔ میک اپ: ایک ممنوعہ حاجی ایک واجب رسم ادا کرتا ہے جس سے اسے منع کیا گیا تھا۔ رضاکارانہ رسومات مختلف ہیں۔ کھڑے ہونے کے بعد روکنا اور افادہ کا چکر لگانا احسار نہیں ہے۔ جب بار اٹھتا ہے، تو نتیجہ اس بات پر منحصر ہوتا ہے کہ آیا حج یا قربانی کو پکڑنے میں وقت باقی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1867} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1868} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1869} صفحہ 1870} {حوالہ: فقہ معاویہ کویتیہ نور v3 صفحہ 1871}۔"
