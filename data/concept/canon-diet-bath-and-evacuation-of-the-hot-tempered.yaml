label: { ar: "غذاء حاري المزاج واستحمامهم واستفراغهم عند ابن سينا", en: "Diet, bath and evacuation for the hot-tempered in the Canon", ur: "گرم مزاج کی غذا، غسل اور استفراغ قانون میں" }
summary:
  ar: "يصف ابن سينا حاري المزاج المعتدلين في المنفعلتين بأنهم أدنى إلى الصحة وأسرع نباتاً للأسنان والشعور وذوو بيان وسرعة مشي، وقد يتولد فيهم المرار، ثم يعين تدبيرهم بالقيء بالماء الحار أو الإسهال بالبنفسج المربى والتمر الهندي والشيرخشك والترنجبين، وتخفيف الرياضة وتثليث الاستحمام، والمفتحات إذا عرض تمدد في الكبد والبطن {cite:canon-ibn-sina-print-v1 pp.255-256}."
  en: "Ibn Sina describes the hot-tempered who are balanced in the passive qualities as nearer to health, quicker to grow teeth and hair, eloquent and swift in walking, with bile often generated in them; their regimen is helped by vomiting with hot water or purging with preserved violet, tamarind, shir khushk and manna, by lighter exercise and up to three baths a day, and by opening remedies if stretching arises in the liver and abdomen {cite:canon-ibn-sina-print-v1 pp.255-256}."
