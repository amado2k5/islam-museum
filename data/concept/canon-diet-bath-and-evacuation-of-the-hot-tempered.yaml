id: concept/canon-diet-bath-and-evacuation-of-the-hot-tempered
class: concept
kind: scientific
label:
  ar: "غذاء حاري المزاج واستحمامهم واستفراغهم عند ابن سينا"
  en: "Diet, bath and evacuation for the hot-tempered in the Canon"
  fr: "Alimentation, bain et évacuation du tempérament chaud dans le Canon"
  ur: "گرم مزاج کی غذا، غسل اور استفراغ قانون میں"
  es: "Dieta, baño y evacuación para los iracundos en el Canon"
  tr: "İbn Sina'da sıcak yemek, banyo ve kusma"
  id: "Makanan panas serta mandi dan muntah di Ibn Sina"
summary:
  ar: "يصف ابن سينا حاري المزاج المعتدلين في المنفعلتين بأنهم أدنى إلى الصحة وأسرع نباتاً للأسنان والشعور وذوو بيان وسرعة مشي، وقد يتولد فيهم المرار، ثم يعين تدبيرهم بالقيء بالماء الحار أو الإسهال بالبنفسج المربى والتمر الهندي والشيرخشك والترنجبين، وتخفيف الرياضة وتثليث الاستحمام، والمفتحات إذا عرض تمدد في الكبد والبطن {cite:canon-ibn-sina-print-v1 pp.255-256}."
  en: "Ibn Sina describes the hot-tempered who are balanced in the passive qualities as nearer to health, quicker to grow teeth and hair, eloquent and swift in walking, with bile often generated in them; their regimen is helped by vomiting with hot water or purging with preserved violet, tamarind, shir khushk and manna, by lighter exercise and up to three baths a day, and by opening remedies if stretching arises in the liver and abdomen {cite:canon-ibn-sina-print-v1 pp.255-256}."
  fr: "Ibn Sina décrit les tempéraments chauds équilibrés dans les qualités passives : proches de santé, dents et poils précoces, éloquence, marche rapide et fréquente production de bile. Il propose vomissement à l’eau chaude ou purge par violette confite, tamarin, shir khushk et manne, exercice léger, jusqu’à trois bains quotidiens et remèdes ouvrants si tension hépatique et abdominale {cite:canon-ibn-sina-print-v1 pp.255-256}."
  es: "Ibn Sina describe a los temperamentales irascibles que están equilibrados en las cualidades pasivas como más cercanos a la salud, con un crecimiento más rápido de dientes y cabello, elocuentes y ágiles al caminar, y con bilis que a menudo se genera en ellos; su régimen se ve favorecido por el vómito con agua caliente o la purga con violeta en conserva, tamarindo, shir khushk y maná, por el ejercicio ligero y hasta tres baños al día, y por la apertura de remedios si surge distensión en el hígado y el abdomen {cite:canon-ibn-sina-print-v1 pp.255-256}."
  ur: "ابن سینا گرم مزاج لوگوں کو بیان کرتا ہے جو غیر فعال خصوصیات میں متوازن ہوتے ہیں صحت کے قریب، دانت اور بال اگانے میں جلدی، فصاحت اور چلنے میں تیز ہوتے ہیں، ان میں اکثر صفرا پیدا ہوتا ہے۔ گرم پانی سے قے کرنے یا سالم بنفشی، املی، شیر خشخ اور من کے ساتھ صاف کرنے، ہلکی ورزش کرنے اور دن میں تین غسل کرنے سے، اور جگر اور پیٹ میں کھنچاؤ پیدا ہونے کی صورت میں کھولنے کے علاج سے ان کے طریقہ کار میں مدد ملتی ہے۔"
  tr: "İbn Sina, sıcak mizaca sahip olanları ve pasifliği orta düzeyde olanları daha sağlıklı, daha hızlı diş ve his geliştiren, net ve hızlı yürüyen kişiler olarak tanımlar. Acı gelişebilir, ardından sıcak su ile kusma veya menekşe reçeli, demirhindi, şirkhoshk ve tarangbin ile ishal yaparak, egzersizi hafifleterek, üç gün egzersiz yaparak ve karaciğer ile karın genişlemesi varsa karaciğer ve karın kaslarını hafifleterek yönetebilirler {cite:canon-ibn-sina-print-v1 s.255-256}."
  id: "Ibn Sina menggambarkan mereka yang temperamen panas dan pasifitas sedang sebagai lebih sehat, lebih cepat mengembangkan gigi dan perasaan, serta berjalan dengan jelas dan cepat. Mereka mungkin mengalami kepahitan, lalu mengatasinya dengan muntah menggunakan air panas atau diare dengan selai violet, asam jawa, shirkhoshk, dan tarangbin, mengurangi olahraga, berolahraga tiga hari, dan menerangi hati serta perut jika ada pembesaran di hati dan perut {cite:canon-ibn-sina-print-v1 hlm.255-256}."
