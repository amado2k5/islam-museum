issue:
  ar: "هل تصح خطبة الجمعة بغير العربية؟"
  en: "Is the Friday sermon valid in a language other than Arabic?"
  ur: "کیا جمعہ کا خطبہ غیر عربی میں صحیح ہے؟"
  fr: "Le prône du vendredi est-il valide dans une autre langue que l'arabe ?"
  es: "¿Es válido el sermón del viernes en una lengua distinta del árabe?"
perspectives:
  - tradition: sunni-hanafi
    id: hanafi-arabic-recommended
    stance:
      ar: "العربية في الخطبة مستحبة عند أبي حنيفة لا شرط، ويشترطها صاحباه إلا لعاجز."
      en: "For Abu Hanifa Arabic in the sermon is recommended, not a condition; his two companions require it unless the speaker is unable."
      ur: "ابو حنیفہ کے نزدیک خطبے میں عربی مستحب ہے شرط نہیں؛ ان کے دونوں شاگرد عاجز کے سوا اسے شرط کہتے ہیں۔"
      fr: "Pour Abu Hanifa l'arabe dans le prône est recommandé, non une condition ; ses deux compagnons l'exigent sauf pour l'incapable."
      es: "Para Abu Hanifa el árabe en el sermón es recomendable, no condición; sus dos compañeros lo exigen salvo al incapaz."
    holders: [person/abu-hanifa, person/abu-yusuf-al-qadi, person/muhammad-ibn-al-hasan-al-shaybani, person/ibn-abidin]
    summary:
      ar: "ينقل ابن عابدين في رد المحتار، الجزء الثاني، الصفحة 147، وابن مازة في المحيط البرهاني، الجزء الثاني، الصفحة 74، أن العربية في الخطبة عند أبي حنيفة مستحبة لا شرط، فتصح الخطبة بغيرها ولو كان الخطيب يعرف العربية، وأن أبا يوسف ومحمداً يشترطانها إلا أن يعجز الخطيب {cite:dar-alifta-fatwa-8127 on Radd al-Muhtar 2/147 and al-Muhit al-Burhani 2/74}."
      en: "Ibn Abidin in Radd al-Muhtar, vol. 2, p. 147, and Ibn Maza in al-Muhit al-Burhani, vol. 2, p. 74, report that for Abu Hanifa Arabic in the sermon is recommended, not a condition, so a non-Arabic sermon is valid even if the speaker knows Arabic, while Abu Yusuf and Muhammad stipulate Arabic unless the speaker is unable {cite:dar-alifta-fatwa-8127 on Radd al-Muhtar 2/147 and al-Muhit al-Burhani 2/74}."
      ur: "ابن عابدین رد المحتار جلد 2 صفحہ 147 میں اور ابن مازہ المحیط البرہانی جلد 2 صفحہ 74 میں بتاتے ہیں کہ ابو حنیفہ کے نزدیک خطبے میں عربی مستحب ہے شرط نہیں، چنانچہ غیر عربی خطبہ صحیح ہے خواہ خطیب عربی جانتا ہو، اور ابو یوسف و محمد عربی کو شرط ٹھہراتے ہیں سوائے اس کے کہ خطیب عاجز ہو {cite:dar-alifta-fatwa-8127 on Radd al-Muhtar 2/147 and al-Muhit al-Burhani 2/74}۔"
      fr: "Ibn Abidin, dans Radd al-Muhtar, vol. 2, p. 147, et Ibn Maza, dans al-Muhit al-Burhani, vol. 2, p. 74, rapportent que pour Abu Hanifa l'arabe dans le prône est recommandé, non une condition, de sorte qu'un prône dans une autre langue est valide même si le prédicateur connaît l'arabe, tandis qu'Abu Yusuf et Muhammad exigent l'arabe sauf incapacité {cite:dar-alifta-fatwa-8127 on Radd al-Muhtar 2/147 and al-Muhit al-Burhani 2/74}."
      es: "Ibn Abidin, en Radd al-Muhtar, vol. 2, p. 147, e Ibn Maza, en al-Muhit al-Burhani, vol. 2, p. 74, transmiten que para Abu Hanifa el árabe en el sermón es recomendable, no condición, de modo que un sermón en otra lengua es válido aunque el predicador sepa árabe, mientras Abu Yusuf y Muhammad exigen el árabe salvo incapacidad {cite:dar-alifta-fatwa-8127 on Radd al-Muhtar 2/147 and al-Muhit al-Burhani 2/74}."
    sources: [source/dar-alifta-fatwa-8127]
  - tradition: sunni-maliki
    id: maliki-arabic-condition
    stance:
      ar: "العربية شرط في الخطبة متى قدر الخطيب، ولو لم يفهمها السامعون."
      en: "Arabic is a condition of the sermon whenever the preacher is able, even if the listeners do not understand it."
      ur: "خطیب قادر ہو تو خطبے میں عربی شرط ہے، خواہ سامعین نہ سمجھیں۔"
      fr: "L'arabe est une condition du prône dès que le prédicateur en est capable, même si les auditeurs ne le comprennent pas."
      es: "El árabe es condición del sermón siempre que el predicador pueda, aunque los oyentes no lo entiendan."
    summary:
      ar: "يذكر النفراوي في الفواكه الدواني، الجزء الأول، الصفحة 306، كما تنقله فتوى الإسلام سؤال وجواب رقم 112041، أن العربية شرط لصحة الخطبة عند المالكية ما دام الخطيب قادراً عليها، حتى لو كان السامعون لا يفهمون العربية {cite:islamqa-112041 on al-Nafrawi, al-Fawakih al-Dawani 1/306}."
      en: "Al-Nafrawi in al-Fawakih al-Dawani, vol. 1, p. 306, as cited in IslamQA 112041, states that for the Malikis Arabic is a condition for the sermon's validity whenever the preacher is capable of it, even if the listeners do not understand Arabic {cite:islamqa-112041 on al-Nafrawi, al-Fawakih al-Dawani 1/306}."
      ur: "نفراوی الفواکہ الدوانی جلد 1 صفحہ 306 میں، جیسا کہ اسلام سوال و جواب فتویٰ 112041 نے نقل کیا، بتاتے ہیں کہ مالکیہ کے نزدیک خطبے کی صحت کے لیے عربی شرط ہے جب تک خطیب اس پر قادر ہو، خواہ سامعین عربی نہ سمجھتے ہوں {cite:islamqa-112041 on al-Nafrawi, al-Fawakih al-Dawani 1/306}۔"
      fr: "Al-Nafrawi, dans al-Fawakih al-Dawani, vol. 1, p. 306, cité par IslamQA 112041, indique que pour les malikites l'arabe est une condition de validité du prône tant que le prédicateur en est capable, même si les auditeurs ne comprennent pas l'arabe {cite:islamqa-112041 on al-Nafrawi, al-Fawakih al-Dawani 1/306}."
      es: "Al-Nafrawi, en al-Fawakih al-Dawani, vol. 1, p. 306, citado por IslamQA 112041, indica que para los malikíes el árabe es condición de validez del sermón mientras el predicador sea capaz, aunque los oyentes no entiendan árabe {cite:islamqa-112041 on al-Nafrawi, al-Fawakih al-Dawani 1/306}."
    sources: [source/islamqa-112041]
  - tradition: sunni-shafii
    id: shafii-arabic-if-an-arabic-speaker-is-present
    stance:
      ar: "في المعتمد العربية شرط إن كان في الحاضرين من يعرفها، وتبقى آية القرآن بالعربية دائماً."
      en: "In the relied-upon view Arabic is a condition if any Arabic-speaker is present; the Qur'anic verse stays in Arabic in every case."
      ur: "معتمد قول میں حاضرین میں کوئی عربی جاننے والا ہو تو عربی شرط ہے، اور قرآنی آیت ہر حال میں عربی رہتی ہے۔"
      fr: "Dans l'avis retenu l'arabe est une condition si un arabophone est présent ; le verset coranique reste en arabe dans tous les cas."
      es: "En la opinión asumida el árabe es condición si hay algún arabófono presente; el versículo coránico queda en árabe en todo caso."
    holders: [person/al-nawawi]
    summary:
      ar: "في المعتمد عند الشافعية العربية شرط في الخطبة إن كان في الحاضرين من يعرف العربية، فإن لم يكن فيهم من يعرفها كفى لسانهم إلا الآية القرآنية فتبقى بالعربية، وفي وجه للمتولي أن العربية مستحبة لا شرط. ويعتمد ذلك على المجموع للنووي، الجزء الرابع، الصفحتين 521 و522، وشرح المحلي على المنهاج، الجزء الأول، الصفحة 322 {cite:dar-alifta-fatwa-8127 on al-Majmu' 4/521-522 and al-Mahalli 1/322}، وحاشية البيجوري، الصفحة 228 {cite:dar-alifta-fatwa-2711 on al-Bayjuri p.228}."
      en: "In the Shafi'i relied-upon position Arabic is a condition of the sermon if any Arabic-speaker is present; if none of the congregation knows Arabic, their own language suffices except for the Qur'anic verse, which stays in Arabic, and one minority wajh, of al-Mutawalli, holds Arabic to be recommended, not a condition. The sources are al-Nawawi's al-Majmu', vol. 4, pp. 521-522, and al-Mahalli's Sharh Minhaj al-Talibin, vol. 1, p. 322 {cite:dar-alifta-fatwa-8127 on al-Majmu' 4/521-522 and al-Mahalli 1/322}, and al-Bayjuri's Hashiya, p. 228 {cite:dar-alifta-fatwa-2711 on al-Bayjuri p.228}."
      ur: "شافعیہ کے معتمد قول میں اگر حاضرین میں کوئی عربی جاننے والا ہو تو خطبے میں عربی شرط ہے؛ اگر جماعت میں کوئی عربی نہ جانتا ہو تو ان کی اپنی زبان کافی ہے سوائے قرآنی آیت کے جو عربی ہی رہتی ہے، اور متولی کے ایک اقلیتی وجہ کے مطابق عربی مستحب ہے شرط نہیں۔ ماخذ نووی کی المجموع جلد 4 صفحات 521 و522 اور محلی کی شرح منہاج الطالبین جلد 1 صفحہ 322 {cite:dar-alifta-fatwa-8127 on al-Majmu' 4/521-522 and al-Mahalli 1/322} اور بیجوری کا حاشیہ صفحہ 228 {cite:dar-alifta-fatwa-2711 on al-Bayjuri p.228} ہیں۔"
      fr: "Dans l'avis retenu chez les chaféites, l'arabe est une condition du prône si un arabophone est présent ; si personne dans l'assemblée ne connaît l'arabe, leur langue suffit sauf pour le verset coranique, qui reste en arabe, et un wajh minoritaire d'al-Mutawalli tient l'arabe pour recommandé, non pour une condition. Les sources sont al-Majmu' d'al-Nawawi, vol. 4, pp. 521-522, et le Sharh Minhaj al-Talibin d'al-Mahalli, vol. 1, p. 322 {cite:dar-alifta-fatwa-8127 on al-Majmu' 4/521-522 and al-Mahalli 1/322}, et la Hashiya d'al-Bayjuri, p. 228 {cite:dar-alifta-fatwa-2711 on al-Bayjuri p.228}."
      es: "En la opinión asumida entre los shafi'íes el árabe es condición del sermón si hay algún arabófono presente; si nadie en la congregación sabe árabe, basta su lengua salvo el versículo coránico, que queda en árabe, y un wajh minoritario de al-Mutawalli tiene el árabe por recomendable, no por condición. Las fuentes son al-Majmu' de al-Nawawi, vol. 4, pp. 521-522, y el Sharh Minhaj al-Talibin de al-Mahalli, vol. 1, p. 322 {cite:dar-alifta-fatwa-8127 on al-Majmu' 4/521-522 and al-Mahalli 1/322}, y la Hashiya de al-Bayjuri, p. 228 {cite:dar-alifta-fatwa-2711 on al-Bayjuri p.228}."
    sources: [source/dar-alifta-fatwa-8127, source/dar-alifta-fatwa-2711]
  - tradition: sunni-hanbali
    id: hanbali-valid-only-if-unable
    stance:
      ar: "لا تصح الخطبة بغير العربية إن قدر الخطيب عليها، وتصح إن عجز."
      en: "The sermon is not valid in another language if the preacher is able in Arabic, and is valid if he is unable."
      ur: "خطیب عربی پر قادر ہو تو غیر عربی خطبہ صحیح نہیں، اور عاجز ہو تو صحیح ہے۔"
      fr: "Le prône n'est pas valide dans une autre langue si le prédicateur est capable en arabe, et l'est s'il en est incapable."
      es: "El sermón no es válido en otra lengua si el predicador es capaz en árabe, y lo es si es incapaz."
    holders: [person/al-buhuti-mansur-ibn-yunus]
    summary:
      ar: "يذكر البهوتي في كشاف القناع، الجزء الثاني، الصفحتين 35 و36، أن الخطبة لا تصح بلغة أخرى إذا كان الخطيب قادراً على العربية، وتصح بغيرها إن عجز عنها {cite:dar-alifta-fatwa-8127 on al-Buhuti, Kashshaf al-Qina' 2/35-36}."
      en: "Al-Buhuti in Kashshaf al-Qina', vol. 2, pp. 35-36, states that the sermon is not valid in another language if the preacher is able to give it in Arabic, though it is valid in another language when he is incapable of Arabic {cite:dar-alifta-fatwa-8127 on al-Buhuti, Kashshaf al-Qina' 2/35-36}."
      ur: "بہوتی کشاف القناع جلد 2 صفحات 35 و36 میں لکھتے ہیں کہ اگر خطیب عربی میں خطبہ دے سکتا ہو تو دوسری زبان میں خطبہ صحیح نہیں، اور عربی سے عاجز ہو تو دوسری زبان میں صحیح ہے {cite:dar-alifta-fatwa-8127 on al-Buhuti, Kashshaf al-Qina' 2/35-36}۔"
      fr: "Al-Buhuti, dans Kashshaf al-Qina', vol. 2, pp. 35-36, indique que le prône n'est pas valide dans une autre langue si le prédicateur peut le donner en arabe, mais qu'il l'est quand il est incapable en arabe {cite:dar-alifta-fatwa-8127 on al-Buhuti, Kashshaf al-Qina' 2/35-36}."
      es: "Al-Buhuti, en Kashshaf al-Qina', vol. 2, pp. 35-36, indica que el sermón no es válido en otra lengua si el predicador puede darlo en árabe, pero sí lo es cuando es incapaz en árabe {cite:dar-alifta-fatwa-8127 on al-Buhuti, Kashshaf al-Qina' 2/35-36}."
