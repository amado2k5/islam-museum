id: concept/khutbat-al-jumua-bi-ghayr-al-arabiyya
class: concept
kind: doctrine
tags: [arabiyya-browser, arabiyya-lisan]
label:
  ar: "خطبة الجمعة بغير العربية عند المذاهب الأربعة"
  en: "The Friday sermon in a language other than Arabic: the four Sunni schools"
  ur: "جمعہ کا خطبہ غیر عربی میں: چاروں سنی مذاہب"
  fr: "Le prône du vendredi dans une autre langue que l'arabe : les quatre écoles sunnites"
  es: "El sermón del viernes en una lengua distinta del árabe: las cuatro escuelas suníes"
  tr: "Dört düşünce okuluna göre Cuma vaazı Arapça olmayan dilde"
  id: "Khotbah Jumat dalam bahasa non-Arab menurut empat aliran pemikiran"
summary:
  ar: "اختلفت المذاهب السنية في اشتراط العربية في خطبة الجمعة: فهي عند أبي حنيفة مستحبة لا شرط، ويشترطها صاحباه إلا لعاجز، وهي شرط عند المالكية للقادر ولو لم يفهم السامعون، وشرط عند الشافعية في المعتمد إن كان في الحاضرين من يعرف العربية مع بقاء آية القرآن بالعربية، وشرط عند الحنابلة للقادر. وتنقل الصفحة كل قول عن أصحابه ولا تحكم بينها."
  en: "The Sunni schools differed on whether Arabic is a condition of the Friday sermon: for Abu Hanifa it is recommended, not a condition, while his two companions require it unless the speaker is unable; for the Malikis it is a condition for one able, even if the listeners do not understand; for the Shafi'is, in the relied-upon view, it is a condition if any Arabic-speaker is present, with the Qur'anic verse kept in Arabic; for the Hanbalis it is a condition for one able. The page gives each view under its holders and does not judge between them."
  ur: "جمعہ کے خطبے میں عربی کی شرط پر سنی مذاہب کا اختلاف ہے: ابو حنیفہ کے نزدیک عربی مستحب ہے شرط نہیں، جبکہ ان کے دونوں شاگرد عاجز کے سوا اسے شرط کہتے ہیں؛ مالکیہ کے نزدیک قادر کے لیے شرط ہے خواہ سامعین نہ سمجھیں؛ شافعیہ کے معتمد قول میں اگر حاضرین میں کوئی عربی جاننے والا ہو تو شرط ہے اور قرآنی آیت عربی ہی رہتی ہے؛ حنابلہ کے نزدیک قادر کے لیے شرط ہے۔ صفحہ ہر قول اس کے قائلین کی طرف منسوب کر کے نقل کرتا ہے اور فیصلہ نہیں کرتا۔"
  fr: "Les écoles sunnites ont divergé sur la question de savoir si l'arabe est une condition du prône du vendredi : pour Abu Hanifa il est recommandé, non une condition, ses deux compagnons l'exigeant sauf pour qui en est incapable ; pour les malikites c'est une condition pour qui en est capable, même si les auditeurs ne comprennent pas ; pour les chaféites, dans l'avis retenu, c'est une condition si un arabophone est présent, le verset coranique restant en arabe ; pour les hanbalites c'est une condition pour qui en est capable. La page donne chaque avis sous ses tenants, sans trancher."
  es: "Las escuelas suníes discreparon sobre si el árabe es condición del sermón del viernes: para Abu Hanifa es recomendable, no condición, mientras sus dos compañeros lo exigen salvo a quien no puede; para los malikíes es condición para quien puede, aunque los oyentes no entiendan; para los shafi'íes, en la opinión asumida, es condición si hay algún arabófono presente, quedando el versículo coránico en árabe; para los hanbalíes es condición para quien puede. La página da cada opinión bajo quienes la sostienen, sin juzgar entre ellas."
  tr: "Sünni okulları Cuma vaazında Arapça gerekliliği konusunda farklılık gösterir: Ebu Hanifa'ya göre Arapça şartı koşulsuz olarak önerilir ve iki yoldaşı, engelliler hariç, zorunludur. Malikilere göre, dinleyiciler anlamasa bile bu, yetenekli olanlar için bir şarttır. Şafiilere göre, Arapça bilenler varsa Kur'an Arapça kalırken, Hanbalilere göre ise yetenekliler için bir şarttır. Sayfa, yazarlarının her görüşünü alıntılar ve aralarında yargılama yapmaz."
  id: "Aliran Sunni berbeda mengenai persyaratan bahasa Arab dalam khotbah Jumat: menurut Abu Hanifa, bahasa Arab direkomendasikan tanpa syarat, dan dua sahabatnya mewajibkannya kecuali bagi mereka yang tidak mampu. Menurut Maliki, ini adalah syarat bagi yang mampu meskipun pendengar tidak memahaminya. Menurut syafi'i, ini adalah syarat jika ada yang hadir yang menguasai bahasa Arab sementara Al-Qur'an tetap dalam bahasa Arab, dan menurut Hanbali, ini adalah syarat bagi yang mampu. Halaman ini mengutip setiap pendapat dari penulisnya dan tidak menilai di antara mereka."
