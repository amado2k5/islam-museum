summary:
  ar: "يعد ابن سينا الشرب على الريق وبعد الرياضة والاستحمام وعند اشتغال الطبيعة بالهضم ضاراً، ويصف التدبير مع العطش الكاذب من الصبر والنوم والمضمضة وكوز ضيق الرأس، وأن الري الكافي ضار {cite:canon-ibn-sina-print-v1 pp.236-237}."
  en: "Ibn Sina counts drinking on an empty stomach, after exercise or bathing, and while nature is busy with digestion as harmful, and describes the handling of false thirst by patience, sleep, rinsing the mouth and a narrow-necked jug, adding that drinking to full quenching is harmful {cite:canon-ibn-sina-print-v1 pp.236-237}."
