id: concept/canon-clotty-sediment
class: concept
kind: scientific
label:
  ar: "الرسوب العلقي عند ابن سينا"
  en: "Clotted sediment in the Canon"
  fr: "Sédiment coagulé dans le Canon"
  ur: "لوتھڑے دار تلچھٹ قانون میں"
  es: "Sedimento coagulado en el cañón"
  tr: "İbn Sina'ya göre Askıya Alınmış Başarısızlık"
  id: "Kegagalan Tangguh menurut Ibn Sina"
summary:
  ar: "يذكر ابن سينا أن الرسوب العلقي الشديد الممازجة يدل على ضعف الكبد، ودون ذلك على جراحة في مجاري البول، والمتميز أكثره من المثانة والقضيب، ويحيل التفصيل إلى باب بول الدم. {cite:canon-ibn-sina-print-v1 p.195}."
  en: "Ibn Sina says closely mixed clotted sediment shows weakness of the liver, less mixed shows a wound in the urinary passages, and separate clots come mostly from the bladder and penis; he defers detail to the section on bloody urine. {cite:canon-ibn-sina-print-v1 p.195}."
  fr: "Ibn Sina attribue le sédiment coagulé intimement mêlé à la faiblesse hépatique, le moins mêlé à une plaie urinaire, les caillots séparés surtout à vessie et pénis ; il renvoie aux urines sanglantes. {cite:canon-ibn-sina-print-v1 p.195}."
  es: "Ibn Sina afirma que un sedimento coagulado muy mezclado indica debilidad del hígado, uno menos mezclado muestra una herida en las vías urinarias, y los coágulos separados provienen principalmente de la vejiga y el pene; retoma los detalles en la sección sobre orina con sangre. {cite:canon-ibn-sina-print-v1 p.195}."
  ur: "ابن سینا کا کہنا ہے کہ قریب سے ملا ہوا جمنا جگر کی کمزوری کو ظاہر کرتا ہے، کم ملاوٹ پیشاب کے راستے میں زخم کو ظاہر کرتا ہے، اور الگ تھلگ زیادہ تر مثانے اور عضو تناسل سے آتے ہیں۔ وہ خونی پیشاب کے حصے کی تفصیل کو موخر کرتا ہے۔ {حوالہ: کینن ابن سینا پرنٹ v1 صفحہ 195}۔"
  tr: "İbn Sina, şiddetli karışık süspansiyonun karaciğer zayıflığını gösterdiğini belirtir ve bu olmadan idrar yolu, özellikle mesane ve penis cerrahisi yapılır ve detaylar idrar yollarına atıfta bulunur. {cite:canon-ibn-sina-print-v1 s.195}."
  id: "Ibn Sina menyebutkan bahwa suspensi campuran berat menunjukkan kelemahan hati, dan tanpa itu, operasi pada saluran kemih, terutama kandung kemih dan penis, dan detailnya merujuk pada saluran kemih. {cite:canon-ibn-sina-print-v1 hlm.195}."
