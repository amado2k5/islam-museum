summary:
  ar: "يذكر ابن سينا أن الرسوب العلقي الشديد الممازجة يدل على ضعف الكبد، ودون ذلك على جراحة في مجاري البول، والمتميز أكثره من المثانة والقضيب، ويحيل التفصيل إلى باب بول الدم. {cite:canon-ibn-sina-print-v1 p.195}."
  en: "Ibn Sina says closely mixed clotted sediment shows weakness of the liver, less mixed shows a wound in the urinary passages, and separate clots come mostly from the bladder and penis; he defers detail to the section on bloody urine. {cite:canon-ibn-sina-print-v1 p.195}."
