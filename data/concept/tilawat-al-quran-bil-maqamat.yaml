summary:
  ar: "باب يختلف فيه العلماء: تحسين الصوت بالقراءة مندوب عندهم، واختلفوا في القراءة بالألحان الموسيقية والمقامات بين مانع ومجوّز بشروط {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  en: "A question on which the scholars differ: beautifying the voice in recitation is recommended with them, but they differed over reciting with musical melodies and maqamat — some forbidding, some permitting under conditions {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
