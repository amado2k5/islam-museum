label:
  ar: "الأفيون"
  en: "Afyun (opium)"
  fr: "Afyun (opium)"
  es: "Afyun (opio)"
  ur: "افیون ⁦(افیون)⁩"
  tr: "Afyon"
  id: "Afyon"
summary:
  ar: "الأفيون عصارة الكبسولات الخضراء للخشخاش، معروف عند اليونان، واستعمله الأطباء المسلمون علاجًا ومخدرًا؛ زُرع في صعيد مصر حتى القرن التاسع عشر، وصار في الأناضول أشهر مراكز زراعته قرب كره حصار {cite:encyclopaedia-of-islam-2 vol. 1 p. 265}."
  en: "Opium, the dried juice of the unripe capsules of the poppy (Papaver somniferum), known to the Greeks and used by Muslim physicians as a remedy and a narcotic. The poppy was grown in Upper Egypt until the 19th century and, in Anatolia, around Kara Hisar {cite:encyclopaedia-of-islam-2 vol. 1 p. 265}."
  fr: "L’opium, suc séché des capsules non mûres du pavot (Papaver somniferum), connu des Grecs et employé par les médecins musulmans comme remède et comme narcotique. Le pavot était cultivé en Haute-Égypte jusqu’au XIXe siècle et, en Anatolie, autour de Kara Hisar {cite:encyclopaedia-of-islam-2 vol. 1 p. 265}."
  es: "El opio, el jugo seco de las cápsulas inmaduras de la amapola (Papaver somniferum), conocido por los griegos y utilizado por los médicos musulmanes como remedio y narcótico. La amapola se cultivaba en el Alto Egipto hasta el siglo XIX y, en Anatolia, en los alrededores de Kara Hisar {cite:encyclopaedia-of-islam-2 vol. 1 p. 265}."
  ur: "افیون، پوست کے کچے کیپسول کا خشک رس (Papaver somniferum) جسے یونانیوں کے لیے جانا جاتا ہے اور مسلمان ڈاکٹر اسے علاج اور نشہ آور دوا کے طور پر استعمال کرتے ہیں۔ پوست بالائی مصر میں 19ویں صدی تک اور اناطولیہ میں، کارا حصار کے آس پاس اگایا جاتا تھا۔ 1 ص۔ 265}۔"
  tr: "Afyon, Yunanlar arasında bilinen yeşil haşhaş kapsüllerinin sudur ve Müslüman hekimler onu tedavi ve anestezi olarak kullanmıştır; on dokuzuncu yüzyıla kadar Yukarı Mısır'da yetiştirilmiş ve Kerr kuşatması yakınlarında Anadolu'nun en ünlü yetiştirme merkezi olmuştur {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 265}."
  id: "Opium adalah air kapsul poppy hijau yang dikenal di kalangan orang Yunani, dan dokter Muslim menggunakannya untuk pengobatan dan anestesi; opium dibudidayakan di Mesir Hulu hingga abad kesembilan belas dan menjadi pusat budidaya paling terkenal di Anatolia dekat pengepungan Kerr {cite:Encyclopaedia-of-Islam-2, vol. 1, hlm. 265}."
