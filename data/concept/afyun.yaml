summary:
  ar: "الأفيون عصارة الكبسولات الخضراء للخشخاش، معروف عند اليونان، واستعمله الأطباء المسلمون علاجًا ومخدرًا؛ زُرع في صعيد مصر حتى القرن التاسع عشر، وصار في الأناضول أشهر مراكز زراعته قرب كره حصار {cite:encyclopaedia-of-islam-2 vol. 1 p. 265}."
  en: "Opium, the dried juice of the unripe capsules of the poppy (Papaver somniferum), known to the Greeks and used by Muslim physicians as a remedy and a narcotic. The poppy was grown in Upper Egypt until the 19th century and, in Anatolia, around Kara Hisar {cite:encyclopaedia-of-islam-2 vol. 1 p. 265}."
