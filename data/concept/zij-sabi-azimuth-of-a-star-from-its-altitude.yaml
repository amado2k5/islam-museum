id: concept/zij-sabi-azimuth-of-a-star-from-its-altitude
class: concept
kind: scientific
label: { ar: "سمت الكوكب من ارتفاعه", en: "The azimuth of a star from its altitude", ur: "ستارے کی سمت اس کے ارتفاع سے", es: "El acimut de una estrella a partir de su altitud." }
summary:
  ar: "يعنون الباب الثالث والعشرون بمعرفة سمت أي كوكب من قبل ارتفاعه وموضعه من الفلك. يُعرف ارتفاع الكوكب في ذلك الوقت وبعده عن معدل النهار وعرض البلد، ثم يُسلك فيه المسلك الذي وُصف في باب سمت الارتفاع، من غير تغيير سوى أن بعد الكوكب عن معدل النهار يُستعمل بدل ميل درجة الشمس. {cite:zij-sabi-nallino-byblion p.57}."
  en: "Chapter 23 is headed with finding the azimuth of any star from its altitude and its place in the sphere. The altitude of the star at that time, its distance from the equator and the latitude of the place are found, and the course described in the earlier chapter on the azimuth of an altitude is followed without change, except that the star's distance from the equator is used in place of the declination of the Sun's degree. {cite:zij-sabi-nallino-byblion p.57}."
  ur: "تیئیسواں باب کا عنوان کسی بھی ستارے کی سمت اس کے ارتفاع اور فلک میں اس کے مقام سے جاننا ہے۔ اس وقت ستارے کا ارتفاع، اس کا معدل النہار سے بعد اور شہر کا عرض معلوم کیے جاتے ہیں، پھر وہی طریقہ برتا جاتا ہے جو ارتفاع کی سمت کے پچھلے باب میں بیان ہوا، بغیر کسی تبدیلی کے، سوائے اس کے کہ سورج کے درجے کے میل کی جگہ ستارے کا معدل النہار سے بعد استعمال ہوتا ہے۔ {cite:zij-sabi-nallino-byblion p.57}۔"
  es: "El capítulo 23 trata sobre cómo calcular el acimut de cualquier estrella a partir de su altitud y su posición en la esfera celeste. Se determina la altitud de la estrella en ese momento, su distancia al ecuador y la latitud del lugar, y se sigue el procedimiento descrito en el capítulo anterior para calcular el acimut de una estrella sin modificaciones, salvo que se utiliza la distancia de la estrella al ecuador en lugar de la declinación del Sol. {cite:zij-sabi-nallino-byblion p.57}."
