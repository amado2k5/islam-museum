id: concept/lahjat-al-maghrib
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-dialects]
label:
  ar: "اللهجات المغربية"
  en: "The dialects of the Maghrib"
  ur: "مغربی بولیاں"
  fr: "Les dialectes du Maghreb"
  es: "Los dialectos del Magreb"
summary:
  ar: "ما قُرئ عن كلام المغرب: ما تقوله دائرة المعارف البريطانية عن شمال أفريقيا مجموعة لهجية، وعن فرض العربية في المغرب الكبير، وعن العربية والأمازيغية في المغرب، وعن الحسانية في موريتانيا، وفصول ابن خلدون في لسان الأمصار وخلطة العرب بالبربر في إفريقية والمغرب والأندلس. ولم يُعثر على وصف لخصائص الدارجة المغربية ولا على عدد متكلميها. وأضاف لاحقاً ملخص بحثي قُدّم إلى المتحف أقساماً عن التصنيف وأبرز الخصائص وأعداد المتكلمين؛ ولم يفتح المتحف الصفحات التي يستشهد بها."
  en: "What was read of the speech of the Maghrib: what the Encyclopaedia Britannica says of North Africa as a dialect group, of the imposition of Arabic on the Maghrib, of Arabic and Tamazight in Morocco and of Hassaniyya in Mauritania, and Ibn Khaldun's chapters on the speech of the cities and the Arabs' mixing with the Berbers in Ifriqiya, the Maghrib and al-Andalus. No description of the features of the Maghribi darija, and no count of its speakers, was found. A research summary supplied to the museum later added sections on classification, main features and speaker numbers; the museum did not open the pages it cites."
  ur: "مغرب کے کلام کے بارے میں جو پڑھا گیا: انسائیکلوپیڈیا برٹانیکا شمالی افریقہ کو ایک لہجائی گروہ کے طور پر، مغربِ کبیر میں عربی کے مسلط کیے جانے کے بارے میں، مراکش میں عربی اور امازیغی کے بارے میں اور موریتانیا میں حسانیہ کے بارے میں کیا کہتا ہے، اور شہروں کی زبان اور افریقیہ، مغرب اور اندلس میں عربوں کے بربروں سے میل جول کے بارے میں ابن خلدون کی فصلیں۔ مغربی دارجہ کی خصوصیات کی کوئی توصیف اور اس کے بولنے والوں کی کوئی تعداد نہیں ملی۔ بعد میں عجائب گھر کو فراہم کردہ ایک تحقیقی خلاصے نے درجہ بندی، نمایاں خصوصیات اور بولنے والوں کی تعداد کے حصے شامل کیے؛ عجائب گھر نے اس کے حوالہ کردہ صفحات نہیں کھولے۔"
  fr: "Ce qui a été lu sur le parler du Maghreb : ce que dit l'Encyclopaedia Britannica de l'Afrique du Nord comme groupe dialectal, de l'imposition de l'arabe au Maghreb, de l'arabe et du tamazight au Maroc et de la hassaniyya en Mauritanie, et les chapitres d'Ibn Khaldun sur le parler des villes et le mélange des Arabes avec les Berbères en Ifriqiya, au Maghreb et en al-Andalus. Aucune description des traits de la darija maghrébine, ni aucun décompte de ses locuteurs, n'a été trouvée. Un dossier de recherche fourni au musée a ajouté ensuite des sections sur la classification, les principaux traits et le nombre de locuteurs ; le musée n'a pas ouvert les pages qu'il cite."
  es: "Lo que se leyó sobre el habla del Magreb: lo que dice la Encyclopaedia Britannica sobre el norte de África como grupo dialectal, sobre la imposición del árabe en el Magreb, sobre el árabe y el tamazight en Marruecos y sobre la hasaniyya en Mauritania, y los capítulos de Ibn Jaldún sobre el habla de las ciudades y la mezcla de los árabes con los bereberes en Ifriqiya, el Magreb y al-Ándalus. No se halló ninguna descripción de los rasgos de la darija magrebí ni un recuento de sus hablantes. Un archivo de investigación entregado al museo añadió después secciones sobre la clasificación, los rasgos principales y el número de hablantes; el museo no abrió las páginas que cita."
