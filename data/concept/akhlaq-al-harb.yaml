id: concept/akhlaq-al-harb
class: concept
kind: ethical
label:
  ar: "أخلاق الحرب (في عرض راغب السرجاني)"
  en: "The ethics of war (akhlaq al-harb), as Ragheb El-Sergani presents them"
  ur: "جنگ کے اخلاق (راغب السرجانی کی پیشکش میں)"
summary:
  ar: "الضوابط التي يقول راغب السرجاني إن الإسلام وضعها للحرب لتبقى في أقل صور الضرر: ألا تُطلب الحرب لذاتها، وألا يُقتل غير المقاتل، وأن يُحفظ العهد والأمان، وألا يُفسد في الأرض بقطع الشجر وهدم دور العبادة، وأن يُحسن إلى الأسرى؛ ويقارن فيها إحصاءه لقتلى الغزوات النبوية بقتلى الحرب العالمية الثانية."
  en: "The limits Ragheb El-Sergani says Islam set on war so that it does the least harm: that war is not sought for its own sake, that non-combatants are not killed, that covenants and safe-conduct are kept, that there is no wanton destruction of trees and houses of worship, and that captives are treated well; he sets his own count of those killed in the Prophet's campaigns against the dead of the Second World War."
  ur: "وہ حدود جن کے بارے میں راغب السرجانی کہتے ہیں کہ اسلام نے جنگ پر مقرر کیں تاکہ وہ کم سے کم نقصان کرے: جنگ بذاتِ خود مطلوب نہ ہو، غیر مقاتل قتل نہ ہوں، عہد اور امان کی پاسداری ہو، درختوں اور عبادت گاہوں کی بے جا تباہی نہ ہو، اور قیدیوں سے اچھا سلوک ہو؛ وہ نبی کے غزوات کے مقتولین کے اپنے شمار کا موازنہ دوسری عالمی جنگ کے مقتولین سے کرتے ہیں۔"
