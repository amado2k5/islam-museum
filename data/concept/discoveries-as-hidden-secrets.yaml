id: concept/discoveries-as-hidden-secrets
class: concept
kind: belief
label: { ar: "الاكتشافات بوصفها ميلاد أسرار الغيب", en: "Discoveries as the birth of hidden secrets", ur: "دریافتیں: پوشیدہ رازوں کا ظہور", es: "Los descubrimientos como el nacimiento de secretos ocultos", fr: "Les découvertes comme naissance de secrets cachés", tr: "Görünmeyenin Sırlarının Doğuşu Olarak Keşifler", id: "Penemuan sebagai Kelahiran Rahasia Yang Tak Terlihat" }
summary:
  ar: "يقسم الشعراوي الغيب إلى ما جعل الله له مقدمات في الكون يصل إليها البحث، وما لا مقدمات له يفيضه الله على من يشاء، ويرى أن الاكتشافات العلمية ظهور لأسرار أذن الله بظهورها، وأن الإنسان لا يحيط بعلم الله إلا بما شاء {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1098} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1100} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1102}."
  en: "Sha'rawi divides the unseen into what God has given means for, which inquiry can reach, and what has no means, which God bestows on whom He chooses. He reads scientific discoveries as the appearance of secrets God has allowed to appear, and holds that no one encompasses God's knowledge except as He wills {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1098} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1100} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1102}."
  ur: "شعراوی غیب کو دو قسموں میں بانٹتے ہیں: ایک وہ جس کے لیے اللہ نے کائنات میں مقدمات رکھے ہیں جن تک تحقیق پہنچ سکتی ہے، اور دوسرا وہ جس کے مقدمات نہیں اور جو اللہ جس کو چاہے عطا کرتا ہے۔ ان کے نزدیک علمی دریافتیں ان رازوں کا ظہور ہیں جن کے ظاہر ہونے کی اللہ نے اجازت دی، اور اللہ کے علم کا احاطہ اسی قدر ممکن ہے جتنا وہ چاہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1098} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1100} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1102}۔"
  es: "Sha'rawi divide lo invisible en aquello para lo que Dios ha dado medios, a lo que la investigación puede llegar, y aquello para lo que no tiene medios, que Dios otorga a quien Él elige. Interpreta los descubrimientos científicos como la aparición de secretos que Dios ha permitido que aparezcan, y sostiene que nadie abarca el conocimiento de Dios excepto como Él quiere {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1098} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1100} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1102}."
  fr: "Sha'rawi distingue deux catégories de l'invisible: ce que Dieu a rendu accessible par les moyens de recherche, et ce qui est inaccessible par les moyens de recherche, et que Dieu accorde à qui Il veut. Il interprète les découvertes scientifiques comme la manifestation de secrets que Dieu a permis de révéler, et affirme que nul ne peut appréhender la connaissance divine si ce n'est par Sa volonté."
  tr: "Al-Shaarawi, görünmeyeni Tanrı'nın evrende araştırmanın ulaştığı ön koşullar ve Tanrı'nın istediği kişiye verdiği önkoşullar olarak ikiye ayırır. Bilimsel keşiflerin Tanrı'nın ortaya çıkmasına izin verdiği sırların tezahürleri olduğuna ve insanların Tanrı'nın bilgisini yalnızca O'nun istediği şeylerle kapsadığına inanır {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1098} {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1100} {cite:tafsir-sharawi-khawatir-scan-vol-2 s.1102}."
  id: "Al-Shaarawi membagi yang tak terlihat menjadi apa yang telah Tuhan tetapkan prasyarat di alam semesta yang dicapai penelitian, dan apa yang tidak Dia miliki prasyarat yang Tuhan berikan kepada siapa pun yang Dia kehendaki. Dia percaya bahwa penemuan ilmiah adalah manifestasi dari rahasia yang Tuhan izinkan muncul, dan bahwa manusia hanya mencakup pengetahuan Tuhan melalui apa yang Dia kehendaki {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1098} {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1100} {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1102}."
