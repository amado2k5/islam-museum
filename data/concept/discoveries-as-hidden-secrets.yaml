id: concept/discoveries-as-hidden-secrets
class: concept
kind: belief
label: { ar: "الاكتشافات بوصفها ميلاد أسرار الغيب", en: "Discoveries as the birth of hidden secrets", ur: "دریافتیں: پوشیدہ رازوں کا ظہور" }
summary:
  ar: "يقسم الشعراوي الغيب إلى ما جعل الله له مقدمات في الكون يصل إليها البحث، وما لا مقدمات له يفيضه الله على من يشاء، ويرى أن الاكتشافات العلمية ظهور لأسرار أذن الله بظهورها، وأن الإنسان لا يحيط بعلم الله إلا بما شاء {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1098} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1100} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1102}."
  en: "Sha'rawi divides the unseen into what God has given means for, which inquiry can reach, and what has no means, which God bestows on whom He chooses. He reads scientific discoveries as the appearance of secrets God has allowed to appear, and holds that no one encompasses God's knowledge except as He wills {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1098} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1100} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1102}."
  ur: "شعراوی غیب کو دو قسموں میں بانٹتے ہیں: ایک وہ جس کے لیے اللہ نے کائنات میں مقدمات رکھے ہیں جن تک تحقیق پہنچ سکتی ہے، اور دوسرا وہ جس کے مقدمات نہیں اور جو اللہ جس کو چاہے عطا کرتا ہے۔ ان کے نزدیک علمی دریافتیں ان رازوں کا ظہور ہیں جن کے ظاہر ہونے کی اللہ نے اجازت دی، اور اللہ کے علم کا احاطہ اسی قدر ممکن ہے جتنا وہ چاہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1098} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1100} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1102}۔"
