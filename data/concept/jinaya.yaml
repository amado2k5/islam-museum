label: { ar: "الجناية", en: "Jinaya (offence against the person or body)" }
summary:
  ar: "الجناية في الفقه كل فعل محرم يقع على نفس أو بدن أو مال، وتقسمها الموسوعة الفقهية الكويتية إلى ثلاثة أقسام: الجناية على النفس وهي القتل، والجناية على ما دون النفس، والجناية على ما هو نفس من وجه دون وجه كالجنين. وتبيّن أحكام القتل العمد وشبه العمد والخطأ، والقصاص فيما دون النفس بشروط التكافؤ والتماثل، وأنواع الجراح كالموضحة والهاشمة والمنقلة والمأمومة، والدية والأرش والحكومة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6518} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6519} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6523} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6539} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6542}"
  en: "In fiqh a jinaya is any forbidden act against a person, body or property. The Kuwaiti encyclopedia divides it into three kinds: offences against life (killing), offences against what is less than life (injuries to limbs and wounds to the head and face), and offences against something that is life in one respect and not in another, such as the unborn child. It sets out the rules for intentional, quasi-intentional and accidental killing, retaliation (qisas) for injuries under the conditions of equivalence, the classes of head wounds (such as the wound that exposes bone and the one that reaches the membrane around the brain), and the blood-money, compensation and discretionary awards. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6518} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6519} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6523} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6539} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6542}"
