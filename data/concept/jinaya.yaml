label: { ar: "الجناية", en: "Jinaya (offence against the person or body)", es: "Jinaya (ofensa contra la persona o el cuerpo)", fr: "Jinaya (offense contre la personne ou le corps)" }
summary:
  ar: "الجناية في الفقه كل فعل محرم يقع على نفس أو بدن أو مال، وتقسمها الموسوعة الفقهية الكويتية إلى ثلاثة أقسام: الجناية على النفس وهي القتل، والجناية على ما دون النفس، والجناية على ما هو نفس من وجه دون وجه كالجنين. وتبيّن أحكام القتل العمد وشبه العمد والخطأ، والقصاص فيما دون النفس بشروط التكافؤ والتماثل، وأنواع الجراح كالموضحة والهاشمة والمنقلة والمأمومة، والدية والأرش والحكومة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6518} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6519} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6523} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6539} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6542}"
  en: "In fiqh a jinaya is any forbidden act against a person, body or property. The Kuwaiti encyclopedia divides it into three kinds: offences against life (killing), offences against what is less than life (injuries to limbs and wounds to the head and face), and offences against something that is life in one respect and not in another, such as the unborn child. It sets out the rules for intentional, quasi-intentional and accidental killing, retaliation (qisas) for injuries under the conditions of equivalence, the classes of head wounds (such as the wound that exposes bone and the one that reaches the membrane around the brain), and the blood-money, compensation and discretionary awards. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6518} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6519} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6523} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6539} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6542}"
  es: "En fiqh, un jinaya es cualquier acto prohibido contra una persona, cuerpo o propiedad. La enciclopedia kuwaití lo divide en tres tipos: delitos contra la vida (homicidio), delitos contra lo que es menos que vida (lesiones en las extremidades y heridas en la cabeza y el rostro), y delitos contra algo que es vida en un aspecto pero no en otro, como el feto. Establece las reglas para el homicidio intencional, cuasi intencional y accidental, la retribución (qisas) por lesiones bajo condiciones de equivalencia, las clases de heridas en la cabeza (como la herida que expone el hueso y la que alcanza la membrana que rodea el cerebro), y las indemnizaciones por homicidio, compensación y compensaciones discrecionales. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6518} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6519} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6523} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6539} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6542}"
  fr: "En droit islamique (fiqh), une jinaya désigne tout acte interdit commis contre une personne, son intégrité physique ou ses biens. L'encyclopédie koweïtienne la divise en trois catégories: les atteintes à la vie (meurtre), les atteintes à ce qui est inférieur à la vie (blessures aux membres et plaies à la tête et au visage) et les atteintes à ce qui est vivant sous un certain aspect et non sous un autre, comme l'enfant à naître. Elle énonce les règles relatives aux homicides intentionnels, quasi intentionnels et accidentels, à la vengeance (qisas) pour les blessures en cas d'équivalence, aux différentes catégories de plaies à la tête (par exemple, la plaie exposant l'os et celle atteignant les méninges), ainsi qu'au prix du sang, aux compensations et aux indemnités discrétionnaires. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6518} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6519} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6523} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6539} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6542}"
