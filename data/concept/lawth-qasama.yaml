id: concept/lawth-qasama
class: concept
kind: legal
label:
  ar: "اللَّوْث"
  en: "Lawth (apparent sign of a killing, a condition of qasama)"
  ur: "لوث (قتل کی ظاہری علامت، قسامہ کی شرط)"
summary:
  ar: "اللوث لغةً القوة والشر، وقيل الضعف، واصطلاحاً أمر ينشأ عنه غلبة الظن بصدق المدعي، وهو شبه دلالة على حدث من الأحداث ولا يكون بينة تامة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13713}. والفقهاء يجعلونه شرطاً لوجوب القسامة، وأصله قصة قتل عبد الله بن سهل في خيبر، حيث ادعى قومه على اليهود فلم يحلف المدعون ولم يحلف اليهود، فودى النبي القتيل من عنده {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13714-13715}. ولكل مذهب صور للوث: عند الشافعية خمس صور وستة في تعداد البغوي، وعند المالكية خمسة أمثلة، وعند الحنابلة العداوة الظاهرة وصور أخرى، وعند الحنفية وجود القتيل في محلة فيها أثر القتل {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13714-13718}. ويسقط اللوث بإنكار المدعى عليه، أو بتكذيب بعض الورثة بعضهم، أو بالبينة على غيبته {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13718-13720}."
  en: "Lawth, in lexicon, means strength and evil, or weakness; in technical use it is a matter that produces a strong presumption that the claimant is truthful, a semblance of proof on a killing that falls short of full evidence {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13713}. The jurists make it a condition of qasama. Its basis is the case of Abdullah ibn Sahl at Khaybar, where his people accused the Jews, neither side swore, and the Prophet paid the blood-money from his own side {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13714-13715}. Each school has its own forms of lawth: the Shafi'is list five, the Malikis five examples, the Hanbalis open enmity and other signs, and the Hanafis the finding of a corpse in a quarter with signs of killing {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13714-13718}. Lawth falls away when the accused denies it, when some heirs contradict others, or when proof of absence on the day is given {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13718-13720}."
  ur: "لوث لغت میں قوت اور برائی کو کہتے ہیں، اور کمزوری کے معنی میں بھی آتا ہے؛ اصطلاح میں یہ وہ امر ہے جس سے مدعی کے سچا ہونے کا غالب گمان پیدا ہو، یعنی کسی حادثے پر ایسی دلیل جو مکمل بینہ نہ ہو {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13713}۔ فقہاء اسے قسامہ کے وجوب کی شرط قرار دیتے ہیں۔ اس کی بنیاد خیبر میں عبداللہ بن سہل کا قتل ہے، جہاں ان کی قوم نے یہودیوں پر دعویٰ کیا، نہ مدعی قسم کھا سکے نہ یہودی، تو نبی نے مقتول کی دیت اپنی طرف سے ادا کی {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13714-13715}۔ ہر مذہب میں لوث کی صورتیں الگ ہیں: شافعیہ کے نزدیک پانچ، مالکیہ کے نزدیک پانچ مثالیں، حنابلہ کے نزدیک ظاہری دشمنی اور دیگر علامات، اور حنفیہ کے نزدیک کسی محلے میں قتل کے آثار کے ساتھ لاش ملنا {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13714-13718}۔ انکار، ورثاء کا ایک دوسرے کی تکذیب کرنا، یا غیبت کا ثبوت لوث کو ساقط کر دیتے ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13718-13720}۔"
