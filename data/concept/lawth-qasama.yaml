id: concept/lawth-qasama
class: concept
kind: legal
label:
  ar: "اللَّوْث"
  en: "Lawth (apparent sign of a killing, a condition of qasama)"
  ur: "لوث ⁦(قتل کی ظاہری علامت، قسامہ کی شرط)⁩"
  es: "Lawth (señal aparente de un asesinato, condición de qasama)"
  fr: "Lawth (signe apparent d'un meurtre, état de qasama)"
  tr: "kirlilik"
  id: "pencemaran"
summary:
  ar: "اللوث لغةً القوة والشر، وقيل الضعف، واصطلاحاً أمر ينشأ عنه غلبة الظن بصدق المدعي، وهو شبه دلالة على حدث من الأحداث ولا يكون بينة تامة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13713}. والفقهاء يجعلونه شرطاً لوجوب القسامة، وأصله قصة قتل عبد الله بن سهل في خيبر، حيث ادعى قومه على اليهود فلم يحلف المدعون ولم يحلف اليهود، فودى النبي القتيل من عنده {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13714-13715}. ولكل مذهب صور للوث: عند الشافعية خمس صور وستة في تعداد البغوي، وعند المالكية خمسة أمثلة، وعند الحنابلة العداوة الظاهرة وصور أخرى، وعند الحنفية وجود القتيل في محلة فيها أثر القتل {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13714-13718}. ويسقط اللوث بإنكار المدعى عليه، أو بتكذيب بعض الورثة بعضهم، أو بالبينة على غيبته {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13718-13720}."
  en: "Lawth, in lexicon, means strength and evil, or weakness; in technical use it is a matter that produces a strong presumption that the claimant is truthful, a semblance of proof on a killing that falls short of full evidence {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13713}. The jurists make it a condition of qasama. Its basis is the case of Abdullah ibn Sahl at Khaybar, where his people accused the Jews, neither side swore, and the Prophet paid the blood-money from his own side {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13714-13715}. Each school has its own forms of lawth: the Shafi'is list five, the Malikis five examples, the Hanbalis open enmity and other signs, and the Hanafis the finding of a corpse in a quarter with signs of killing {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13714-13718}. Lawth falls away when the accused denies it, when some heirs contradict others, or when proof of absence on the day is given {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13718-13720}."
  ur: "لوث لغت میں قوت اور برائی کو کہتے ہیں، اور کمزوری کے معنی میں بھی آتا ہے؛ اصطلاح میں یہ وہ امر ہے جس سے مدعی کے سچا ہونے کا غالب گمان پیدا ہو، یعنی کسی حادثے پر ایسی دلیل جو مکمل بینہ نہ ہو {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13713}۔ فقہاء اسے قسامہ کے وجوب کی شرط قرار دیتے ہیں۔ اس کی بنیاد خیبر میں عبداللہ بن سہل کا قتل ہے، جہاں ان کی قوم نے یہودیوں پر دعویٰ کیا، نہ مدعی قسم کھا سکے نہ یہودی، تو نبی نے مقتول کی دیت اپنی طرف سے ادا کی {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13714-13715}۔ ہر مذہب میں لوث کی صورتیں الگ ہیں: شافعیہ کے نزدیک پانچ، مالکیہ کے نزدیک پانچ مثالیں، حنابلہ کے نزدیک ظاہری دشمنی اور دیگر علامات، اور حنفیہ کے نزدیک کسی محلے میں قتل کے آثار کے ساتھ لاش ملنا {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13714-13718}۔ انکار، ورثاء کا ایک دوسرے کی تکذیب کرنا، یا غیبت کا ثبوت لوث کو ساقط کر دیتے ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13718-13720}۔"
  es: "Lawth, en el léxico, significa fuerza y maldad, o debilidad; en el uso técnico es un asunto que produce una fuerte presunción de que el reclamante es veraz, una apariencia de prueba sobre un homicidio que no llega a ser evidencia completa {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13713}. Los juristas lo establecen como condición de qasama. Su fundamento es el caso de Abdullah ibn Sahl en Khaybar, donde su pueblo acusó a los judíos, ninguna de las partes juró, y el Profeta pagó la indemnización por la sangre de su propio bando {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13714-13715}. Cada escuela tiene sus propias formas de lawth: los shafi'ís enumeran cinco, los malikíes cinco ejemplos, los hanbalíes la enemistad manifiesta y otros indicios, y los hanafíes el hallazgo de un cadáver en un barrio con indicios de asesinato {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13714-13718}. El lawth se extingue cuando el acusado lo niega, cuando algunos herederos se contradicen entre sí o cuando se presenta prueba de ausencia el día del crimen {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13718-13720}."
  fr: "Le terme « lawth », dans le lexique, signifie force et mal, ou faiblesse; en langage juridique, il désigne un élément qui crée une forte présomption de véracité du plaignant, une apparence de preuve dans un meurtre qui ne constitue pas une preuve complète (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.13713). Les juristes en font une condition du qasama. Son fondement est l’affaire d’Abdullah ibn Sahl à Khaybar, où son peuple accusa les Juifs, aucune des parties ne prêta serment, et le Prophète paya le prix du sang sur les fonds de sa propre famille (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.13714-13715). Chaque école de pensée a ses propres formes de lawth: les Shafi'ites en énumèrent cinq, les Malikites cinq exemples, les Hanbalites l'inimitié ouverte et d'autres signes, et les Hanafites la découverte d'un cadavre dans un quartier portant des traces de meurtre {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13714-13718}. La lawth est caduque lorsque l'accusé la nie, lorsque certains héritiers se contredisent, ou lorsqu'une preuve d'absence le jour du meurtre est apportée {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13718-13720}."
  tr: "Kirlilik, güç ve kötülüğün dilidir ve zayıflık olarak adlandırılır; teknik olarak iddia sahibinin doğruluğuna dair güçlü bir şüpheye yol açar. Bu, bir olayın yarı-göstergesidir ancak tam bir kanıt değildir {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.13713}. Hukukçular bunu qasama zorunluluğunun bir koşulu olarak kabul eder ve kökeni, Abdullah ibn Sahl'ın Haybar'da öldürülmesi hikayesidir; burada halkı Yahudilere karşı iddia etti ancak ne iddia edenler ne de Yahudiler yemin etmedi. Böylece Peygamber, öldürülenleri huzurundan ödedi {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.13714-13715}. Her okulun kirlilik biçimleri vardır: Şafiilere göre beş ve al-Baghawi sayımında altı; Malikilerde beş örnek; Hanbalilerde bariz düşmanlık ve diğer biçimler; ve Hanefilere göre, kurbanın öldürme izi taşıyan bir yerde bulunması {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.13714-13718}. Bulaşma, sanığın inkârıyla, bazı varislerin birbirini reddetmesiyle veya yokluğuna dair kanıt sunulmasıyla ortadan kalkar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13718-13720}."
  id: "Polusi adalah bahasa kekuatan dan kejahatan, dan dikatakan kelemahan, dan secara teknis, menimbulkan kecurigaan kuat atas kebenaran pengklaim. Ini adalah semacam indikasi suatu peristiwa tetapi bukan bukti lengkap {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13713}. Para ahli hukum menganggapnya sebagai syarat kewajiban qasama, dan asal-usulnya adalah kisah pembunuhan Abdullah ibn Sahl di Khaybar, di mana kaumnya mengklaim terhadap orang Yahudi tetapi baik para pengklaim maupun Yahudi tidak bersumpah. Dengan demikian, Nabi membayar korban dari hadapannya {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13714-13715}. Setiap aliran memiliki bentuk pencemaran: menurut syafi'i, lima bentuk dan enam dalam hitungan al-Baghawi; di antara Maliki, lima contoh; di antara Hanbali, permusuhan yang jelas dan bentuk lainnya; dan menurut Hanafi, kehadiran korban di tempat dengan jejak pembunuhan {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13714-13718}. Kontaminasi ini terangkat dengan penyangkalan terdakwa, oleh beberapa ahli waris yang saling menyangkal, atau dengan memberikan bukti ketidakhadirannya {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13718-13720}."
