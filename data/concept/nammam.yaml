summary:
  ar: "النمام في الكتاب هو السيسنبر، حار في الثالثة يابس إليها يقاوم العفونات، يقتل القمل وينفع من الأورام الباطنة والنسيان والصداع والفواق والديدان وأوجاع المثانة واللسع {cite:canon-ibn-sina-print-v1 p.576}."
  en: "Nammam is in the book the sisimbar, hot in the third degree and dry toward it, resisting putrefaction; it kills lice and helps inner swellings, forgetfulness, headache, hiccup, worms, pains of the bladder and stings {cite:canon-ibn-sina-print-v1 p.576}."
  ur: "نمام کتاب میں سیسنبر ہے، تیسرے درجے میں گرم اور اس کی طرف خشک، سڑاند کا مقابلہ کرتا ہے؛ جوئیں مارتا اور اندرونی وروں، بھول، سردرد، ہچکی، کیڑوں، مثانے کے دردوں اور ڈنک میں مفید ہے {cite:canon-ibn-sina-print-v1 p.576}۔"
  es: "Nammam es en el libro el sisimbar, caliente en tercer grado y seco hacia él, resistente a la putrefacción; mata los piojos y ayuda con hinchazones internas, olvidos, dolor de cabeza, hipo, gusanos, dolores de vejiga y picaduras {cite:canon-ibn-sina-print-v1 p.576}."
  fr: "Nammam est dans le livre le sisimbar, chaud au troisième degré et sec vers celui-ci, résistant à la putréfaction; il tue les poux et aide les gonflements internes, les oublis, les maux de tête, le hoquet, les vers, les douleurs de la vessie et les piqûres {cite:canon-ibn-sina-print-v1 p.576}."
