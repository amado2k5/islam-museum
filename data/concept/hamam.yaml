summary:
  ar: "الحمام طير معروف؛ فراخه فيها حرارة ورطوبة فضلية، والنواهض أخفّ هضماً، وبيضه حار جداً. ودمه يقطع الرعاف الذي من حجاب الدماغ، وزبله نافع للبياض العارض بعد اندمال قرحة في القرنية."
  en: "The dove is a well-known bird. Its nestlings are hot with a surplus of moisture, the fledged birds are lighter to digest, and its eggs are very hot. Its blood stops nosebleed from the membrane of the brain, and its dung helps the white spot left after an ulcer of the cornea has healed."
  ur: "کبوتر ایک معروف پرندہ ہے۔ اس کے بچے گرم اور زائد تری والے ہیں، پر نکلے ہوئے پرندے ہضم میں ہلکے ہیں، اور اس کے انڈے بہت گرم ہیں۔ اس کا خون دماغ کی جھلی سے آنے والی نکسیر روکتا ہے، اور اس کی بیٹ قرنیہ کے زخم بھرنے کے بعد کے سفید داغ میں مفید ہے۔"
  es: "La paloma es un ave muy conocida. Sus polluelos nacen calientes por su exceso de humedad, los polluelos son más fáciles de digerir y sus huevos están muy calientes. Su sangre detiene las hemorragias nasales causadas por la membrana del cerebro y sus excrementos ayudan a curar la mancha blanca que queda tras la cicatrización de una úlcera corneal."
  fr: "La tourterelle est un oiseau bien connu. Ses oisillons sont chauds grâce à un surplus d'humidité, les jeunes sont plus légers à digérer et ses œufs sont très chauds. Son sang arrête les saignements de nez dus aux méninges et ses excréments favorisent la cicatrisation de la tache blanche qui persiste après un ulcère de la cornée."
  tr: "Güvercin iyi bilinen bir kuştur; yavruları aşırı ısı ve nem alır, yükselen hücreleri sindirmesi daha hafiftir ve yumurtaları çok sıcaktır. Kanları beyin zarındaki burun kanamalarını keser ve gübreleri, kornea ülseri geliştikten sonra ara sıra beyazlık için faydalıdır."
  id: "Merpati adalah burung yang terkenal; anak-anaknya memiliki panas dan kelembapan berlebih, risersnya lebih ringan untuk dicerna, dan telurnya sangat panas. Darah mereka memotong mimisan dari membran otak, dan kotoran mereka berguna untuk sesekali memutihkan setelah terkena tukak kornea."
