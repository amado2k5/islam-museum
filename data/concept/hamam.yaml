  en: "Hamam (the dove)"
  ur: "حمام ⁦(کبوتر)⁩"
summary:
  ar: "الحمام طير معروف؛ فراخه فيها حرارة ورطوبة فضلية، والنواهض أخفّ هضماً، وبيضه حار جداً. ودمه يقطع الرعاف الذي من حجاب الدماغ، وزبله نافع للبياض العارض بعد اندمال قرحة في القرنية."
  en: "The dove is a well-known bird. Its nestlings are hot with a surplus of moisture, the fledged birds are lighter to digest, and its eggs are very hot. Its blood stops nosebleed from the membrane of the brain, and its dung helps the white spot left after an ulcer of the cornea has healed."
  ur: "کبوتر ایک معروف پرندہ ہے۔ اس کے بچے گرم اور زائد تری والے ہیں، پر نکلے ہوئے پرندے ہضم میں ہلکے ہیں، اور اس کے انڈے بہت گرم ہیں۔ اس کا خون دماغ کی جھلی سے آنے والی نکسیر روکتا ہے، اور اس کی بیٹ قرنیہ کے زخم بھرنے کے بعد کے سفید داغ میں مفید ہے۔"
