id: concept/tawfiq-wal-khidhlan
class: concept
kind: belief
label:
  ar: "التوفيق والخذلان"
  en: "Divine success (tawfiq) and abandonment (khidhlan)"
  ur: "توفیق اور خذلان"
summary:
  ar: "يعرّف الشيخ عمر عبد الكافي التوفيق بأنه ألا يكل الله العبد إلى نفسه، والخذلان بأنه أن يخلّي الله بينه وبين نفسه. ويقول إن كل خير من توفيق الله وكل شر من خذلانه، وإن الله إذا أحب عبدا غرس في قلبه بذرة التوفيق."
  en: "Sheikh Omar Abdelkafy defines tawfiq (divine success) as God not leaving the servant to himself, and khidhlan (abandonment) as God leaving him to himself. He says every good comes by God's tawfiq and every evil by His khidhlan, and that when God loves a person He sows the seed of tawfiq in his heart."
  ur: "شیخ عمر عبدالکافی توفیق کی تعریف یہ کرتے ہیں کہ اللہ بندے کو اپنے نفس کے حوالے نہ کرے، اور خذلان یہ کہ اللہ اسے اس کے نفس کے حوالے کر دے۔ ان کے بقول ہر بھلائی اللہ کی توفیق سے ہے اور ہر برائی اس کے خذلان سے، اور جب اللہ کسی سے محبت کرتا ہے تو اس کے دل میں توفیق کا بیج بوتا ہے۔"
