id: concept/jannah
education:
  did_you_know:
    ar: "الجنة في العقيدة السنية دار ثواب مخلوقة أصلاً: «الجنة والنار مخلوقتان لا تفنيان أبدًا ولا تبيدان»، يدخل الله المؤمنين إياها برحمته."
    en: "In Sunni belief Paradise is an already-created abode of reward: 'the Garden and the Fire are created, never perishing nor passing away' — and God admits the believers to it by His mercy."
    ur: "سنی عقیدے میں جنت پہلے سے مخلوق ثواب کا گھر ہے: «جنت اور دوزخ مخلوق ہیں نہ فنا ہوں گی نہ مٹیں گی» — اور اللہ مؤمنوں کو اپنی رحمت سے اس میں داخل کرتا ہے۔"
    sources: [source/aqida-tahawiyya, source/sharh-tahawiyya-ibn-abi-al-izz]
class: concept
kind: belief
sensitivity: contested
label:
  ar: الجنة
  en: Jannah (Paradise)
  ur: جنت
summary:
  ur: "جنت قرآن اور مسلم ادب میں وہ باغ ہے جو آخرت میں برگزیدہ لوگوں کے لیے تیار کیا گیا۔ دائرۃ المعارف اسلامیہ کے مطابق قرآن، حدیث، علمِ کلام کے مکاتب، فلاسفہ، صوفیہ اور جدید مصلحین نے اس کے بیانات کو مختلف انداز میں سمجھا، کسی نے لفظی، کسی نے تمثیلی۔ سنی عقیدے میں یہ پہلے سے مخلوق ہے اور ہمیشہ رہے گی۔"
  ar: "الجنة في القرآن والأدب الإسلامي هي الحديقة المعدّة في الآخرة للمختارين. وبحسب دائرة المعارف الإسلامية تناولها الحديث وعلم الكلام والفلاسفة والصوفية والمصلحون المحدثون بقراءات متفاوتة بين الحرفية والرمزية. وفي العقيدة السنية هي دار مخلوقة الآن لا تفنى."
  en: "Jannah, the Garden, is the Qur'anic and Muslim term for the abode prepared in the hereafter for the elect. The Encyclopaedia of Islam traces how hadith, the schools of kalam, philosophers, Sufis and modern reformers read its descriptions, some literally and some allegorically. In Sunni creed it is already created and never perishes."
