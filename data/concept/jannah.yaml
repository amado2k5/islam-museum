summary:
  ar: "الجنة في العقيدة السنية دار الثواب الأخروية المخلوقة أصلًا — «الجنة والنار مخلوقتان لا تفنيان أبدًا ولا تبيدان» {cite:aqida-tahawiyya §106-107}؛ ويجمع شرحها وصفها دارًا للمؤمنين يدخلهم الله إياها برحمته {cite:sharh-tahawiyya-ibn-abi-al-izz}."
  en: "In Sunni creed al-janna is the already-created abode of reward in the hereafter — 'Paradise and the Fire are created, never perishing' {cite:aqida-tahawiyya §106-107} — the home God admits the believers to by His mercy {cite:sharh-tahawiyya-ibn-abi-al-izz}."
