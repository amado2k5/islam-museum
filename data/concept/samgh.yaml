summary:
  ar: "الصمغ في الكتاب أنواعه كلها حارة جدا، وأجوده العربي الصافي القليل الخشب، قابض ومغر مع تجفيف وتقوية، وصمغ الأقاقيا أقوى جدا ولذلك يقع في الترياقات، يلين السعال الحار ويدفع ضرر قروح الرئة ويصفي الصوت ويقوي المعدة {cite:canon-ibn-sina-print-v1 639}"
  en: "Samgh is in the book gum, all its kinds very hot, the best being the clear Arabian with little wood; astringent and glutinous with drying and strengthening, acacia gum being much stronger and so entering theriacs; it softens hot cough, repels the harm of ulcers of the lung, clears the voice and strengthens the stomach {cite:canon-ibn-sina-print-v1 639}"
  ur: "صمغ کتاب میں گوند ہے، اس کی سب قسمیں بہت گرم ہیں، بہترین عربی صاف اور کم لکڑی والا؛ قابض اور چپکانے والا، خشکی اور قوت کے ساتھ، اور کیکر کا گوند بہت زیادہ قوی ہے اس لیے تریاقوں میں شامل ہوتا ہے؛ گرم کھانسی کو نرم کرتا، پھیپھڑے کے زخموں کا ضرر دور کرتا، آواز صاف کرتا اور معدے کو قوت دیتا ہے {cite:canon-ibn-sina-print-v1 639}۔"
  es: "Samgh es una goma de mascar, de todas sus variedades muy picante, siendo la mejor la árabe clara con poca madera; astringente y glutinosa, secante y fortalecedora, siendo la goma arábiga mucho más fuerte y por eso penetra en las teriacas; suaviza la tos caliente, repele el daño de las úlceras pulmonares, aclara la voz y fortalece el estómago {cite:canon-ibn-sina-print-v1 639}"
  fr: "Le Samgh est décrit dans le livre comme une gomme, toutes ses sortes étant très chaudes, la meilleure étant la gomme arabique claire à faible teneur en bois; astringente et gluante, asséchante et fortifiante, la gomme d'acacia étant beaucoup plus forte et entrant ainsi dans les thériaques; elle adoucit la toux chaude, repousse les méfaits des ulcères pulmonaires, éclaircit la voix et fortifie l'estomac {cite:canon-ibn-sina-print-v1 639}"
  tr: "Kitaptaki tüm sakız türleri çok baharatlıdır ve en iyisi saf, Arap tarzında, hafif odunsu, büzücü ve kurutma ile güçlendirici olan caziptir. Akasya sakızı çok güçlüdür, bu yüzden panzehir olarak kabul edilir. Sıcak öksürükleri hafifletir, akciğer ülserinin hasarını uzaklaştırır, sesi arındırır ve mideyi güçlendirir {cite:canon-ibn-sina-print-v1 639}"
  id: "Semua jenis permen karet dalam buku ini sangat pedas, dan yang terbaik adalah murni, Arab, sedikit kayu, astringen, dan menggoda untuk dikeringkan dan diperkuat. Permen karet akasia sangat kuat, itulah sebabnya dianggap sebagai penawar. Ia melembutkan batuk panas, mengusir kerusakan tukak paru-paru, memurnikan suara, dan memperkuat lambung {cite:canon-ibn-sina-print-v1 639}"
