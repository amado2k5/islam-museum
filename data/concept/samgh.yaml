summary:
  ar: "الصمغ في الكتاب أنواعه كلها حارة جدا، وأجوده العربي الصافي القليل الخشب، قابض ومغر مع تجفيف وتقوية، وصمغ الأقاقيا أقوى جدا ولذلك يقع في الترياقات، يلين السعال الحار ويدفع ضرر قروح الرئة ويصفي الصوت ويقوي المعدة {cite:canon-ibn-sina-print-v1 639}"
  en: "Samgh is in the book gum, all its kinds very hot, the best being the clear Arabian with little wood; astringent and glutinous with drying and strengthening, acacia gum being much stronger and so entering theriacs; it softens hot cough, repels the harm of ulcers of the lung, clears the voice and strengthens the stomach {cite:canon-ibn-sina-print-v1 639}"
  ur: "صمغ کتاب میں گوند ہے، اس کی سب قسمیں بہت گرم ہیں، بہترین عربی صاف اور کم لکڑی والا؛ قابض اور چپکانے والا، خشکی اور قوت کے ساتھ، اور کیکر کا گوند بہت زیادہ قوی ہے اس لیے تریاقوں میں شامل ہوتا ہے؛ گرم کھانسی کو نرم کرتا، پھیپھڑے کے زخموں کا ضرر دور کرتا، آواز صاف کرتا اور معدے کو قوت دیتا ہے {cite:canon-ibn-sina-print-v1 639}۔"
