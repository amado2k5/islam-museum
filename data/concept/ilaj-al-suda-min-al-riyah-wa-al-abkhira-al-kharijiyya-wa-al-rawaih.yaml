id: concept/ilaj-al-suda-min-al-riyah-wa-al-abkhira-al-kharijiyya-wa-al-rawaih
class: concept
kind: scientific
label:
  ar: "علاج الصداع من الرياح والأبخرة الخارجية والروائح"
  en: "Treatment of headache from winds, vapours and smells from outside"
  ur: "بیرونی ہواؤں، بخارات اور بوؤں سے صداع کا علاج"
  es: "Tratamiento del dolor de cabeza causado por vientos, vapores y olores del exterior."
summary:
  ar: "يبيّن ابن سينا أن علاج الصداع من ريح أو بخار أو رائحة طيبة أو منتنة من خارج يكون بمقابلة كيفيته بضدها، وبحسب حرارة الريح أو برودتها ومدخلها {cite:canon-ibn-sina-print-v2 pp.64-65}"
  en: "Ibn Sina shows that headache from a wind, a vapour or a pleasant or foul smell from outside is treated by meeting its quality with the opposite, according to whether the wind is hot or cold and where it entered {cite:canon-ibn-sina-print-v2 pp.64-65}"
  ur: "ابن سینا بتاتا ہے کہ باہر سے ہوا، بخار یا خوشبودار یا بدبودار بو سے ہونے والے صداع کا علاج اس کی کیفیت کو اس کی ضد سے ملانا ہے، اس لحاظ سے کہ ہوا گرم ہے یا ٹھنڈی اور کہاں سے داخل ہوئی {cite:canon-ibn-sina-print-v2 pp.64-65}۔"
  es: "Ibn Sina muestra que el dolor de cabeza causado por el viento, el vapor o un olor agradable o desagradable del exterior se trata contrarrestando su cualidad con la opuesta, según si el viento es caliente o frío y por dónde entró {cite:canon-ibn-sina-print-v2 pp.64-65}"
