summary:
  ar: "العلوم التي تُعين على فهم القرآن وتفسيره: أسباب النزول والمكي والمدني وجمعه ورسمه وقراءاته وناسخه ومنسوخه ومحكمه ومتشابهه وإعجازه وأساليبه وغيرها. يقول الزركشي إن مما فات المتقدمين وضع كتاب يشتمل على أنواعها كما وُضع ذلك في علوم الحديث، فألّف «البرهان» في سبعة وأربعين نوعًا، ثم بنى عليه السيوطي «الإتقان»."
  en: "The sciences that serve the understanding and interpretation of the Qur'an: the occasions of revelation, Meccan and Medinan, its collection, script and readings, abrogation, the clear and the ambiguous, inimitability, its styles and more. Al-Zarkashi says earlier scholars had missed writing a book gathering their types, as had been done for hadith, and wrote al-Burhan in forty-seven types; al-Suyuti then built al-Itqan on it."
  ur: "وہ علوم جو قرآن کے فہم اور تفسیر میں مدد دیتے ہیں: اسبابِ نزول، مکی و مدنی، جمع، رسم اور قراءتیں، ناسخ و منسوخ، محکم و متشابہ، اعجاز، اسالیب وغیرہ۔ زرکشی کہتے ہیں کہ متقدمین سے یہ رہ گیا کہ ان کی انواع پر ایک جامع کتاب لکھی جائے جیسی علومِ حدیث پر لکھی گئی، چنانچہ انہوں نے سینتالیس انواع میں «البرہان» لکھی؛ پھر سیوطی نے اس پر «الاتقان» کی بنیاد رکھی۔"
  es: "Las ciencias que sirven para la comprensión e interpretación del Corán: las ocasiones de revelación, la meca y la medina, su recopilación, escritura y lecturas, la abrogación, lo claro y lo ambiguo, la inimitabilidad, sus estilos y más. Al-Zarkashi afirma que los eruditos anteriores no habían escrito un libro que recopilara sus tipos, como se había hecho con los hadices, y escribieron al-Burhan en cuarenta y siete tipos; al-Suyuti luego construyó al-Itqan sobre esta base."
  fr: "Les sciences qui permettent de comprendre et d'interpréter le Coran: les circonstances de sa révélation, les versions mecquoise et médinoise, sa compilation, son écriture et ses lectures, l'abrogation, le clair et l'ambiguïté, son inimitabilité, ses styles, etc. Al-Zarkashi rapporte que les savants antérieurs, n'ayant pas pris la peine de rédiger un ouvrage rassemblant leurs types de révélation, comme cela avait été fait pour les hadiths, ont composé al-Burhan en quarante-sept types; al-Suyuti s'est ensuite appuyé sur ce recueil pour construire al-Itqan."
  tr: "Kur'an'ın anlaşılması ve yorumlanmasına yardımcı olan bilimler: vahiyin nedenleri, Mekke, Medinan, derleme, yazı, okumalar, iptal, açık ve belirsiz metinler, mucizevi işler, üsluplar ve diğerleri. El-Zerkaşi, erken alimler arasında, hadis bilimlerinde olduğu gibi, türlerini içeren bir kitap derlediğini söyler. \"El-Burhan\"ı kırk yedi türde yazdı, ardından El-Süyuti \"El-İtqan\"ı buna dayandırdı."
  id: "Ilmu yang membantu memahami dan menafsirkan Al-Qur'an: penyebab wahyu, Mekah, Madinah, kompilasi, naskah, pembacaan, pembatalan, pembatalan, teks yang jelas dan ambigu, karya mukjizat, gaya, dan lainnya. Al-Zarkashi mengatakan bahwa di antara para ulama awal ia menyusun sebuah kitab yang mencakup jenis-jenisnya, seperti yang ia lakukan dalam ilmu hadis. Ia menulis \"Al-Burhan\" dalam empat puluh tujuh tipe, kemudian Al-Suyuti mendasarkan \"Al-Itqan\" pada kitab tersebut."
