id: concept/ulum-al-quran
class: concept
kind: discipline
label:
  ar: "علوم القرآن"
  en: "The Qur'anic sciences (ulum al-Qur'an)"
  ur: "علومِ قرآن"
summary:
  ar: "العلوم التي تُعين على فهم القرآن وتفسيره: أسباب النزول والمكي والمدني وجمعه ورسمه وقراءاته وناسخه ومنسوخه ومحكمه ومتشابهه وإعجازه وأساليبه وغيرها. يقول الزركشي إن مما فات المتقدمين وضع كتاب يشتمل على أنواعها كما وُضع ذلك في علوم الحديث، فألّف «البرهان» في سبعة وأربعين نوعًا، ثم بنى عليه السيوطي «الإتقان»."
  en: "The sciences that serve the understanding and interpretation of the Qur'an: the occasions of revelation, Meccan and Medinan, its collection, script and readings, abrogation, the clear and the ambiguous, inimitability, its styles and more. Al-Zarkashi says earlier scholars had missed writing a book gathering their types, as had been done for hadith, and wrote al-Burhan in forty-seven types; al-Suyuti then built al-Itqan on it."
  ur: "وہ علوم جو قرآن کے فہم اور تفسیر میں مدد دیتے ہیں: اسبابِ نزول، مکی و مدنی، جمع، رسم اور قراءتیں، ناسخ و منسوخ، محکم و متشابہ، اعجاز، اسالیب وغیرہ۔ زرکشی کہتے ہیں کہ متقدمین سے یہ رہ گیا کہ ان کی انواع پر ایک جامع کتاب لکھی جائے جیسی علومِ حدیث پر لکھی گئی، چنانچہ انہوں نے سینتالیس انواع میں «البرہان» لکھی؛ پھر سیوطی نے اس پر «الاتقان» کی بنیاد رکھی۔"
