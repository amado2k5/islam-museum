label:
  ar: علاج الرعاف
  en: The treatment of nosebleed
  ur: نکسیر کا علاج
  es: "El tratamiento de la hemorragia nasal"
  fr: "Le traitement des saignements de nez"
summary:
  ar: البحراني الواقع من تلقاء نفسه لا يعالج حتى يحس بسقوط القوة وربما بلغ أرطالاً أربعة ويحبس حين يفرط، وغيره يعالج بالحوابس، والكائن عن مرارية البدن يداوم استفراغ المرار وتعديل الدم بالأغذية والأشربة، والفصد أفضل حابس إذا فصد ضيقاً من الجانب الموازي خصوصاً عند وقوع الغشي؛ والحوابس قوابض أو مبردات مغلظات مجمدات أو مغريات أو كاوية تستعمل باحتياط أو ذوات خاصية أو جامعة ⁦(أسماء الأدوية والعصارات والفتائل والنفوخات والأطلية ومقاديرها لا تحمل، وسطر الخصيتين والثديين سطر موسوم مطروح لحكم المؤسس)⁩ {cite:canon-ibn-sina-print-v2 p.237} {cite:canon-ibn-sina-print-v2 p.239}
  en: The crisis-like bleed that comes of itself is not treated until weakness is felt — it may reach four ratls — and is staunched only when it exceeds greatly; other kinds are treated by stanchers, and the one from the body's biliousness by continually evacuating the bile and correcting the blood with foods and drinks. Venesection is the best stauncher, a narrow letting from the corresponding side, especially when swoon occurs. The stanchers are astringents, cooling thickening congealing things, glutinous things, corrosives used with caution lest they raise a crust worse than before, or things of special property, or compounds ⁦(the drug, juice, tent, insufflation and embrocation names and measures are not carried; the line naming the testicles and women's breasts is kept as a labelled listing set aside for the founder's ruling)⁩ {cite:canon-ibn-sina-print-v2 p.237} {cite:canon-ibn-sina-print-v2 p.239}
  ur: خود سے ہونے والی بحرانی نکسیر کا علاج اس وقت تک نہیں کیا جاتا جب تک قوت کے گرنے کا احساس نہ ہو — وہ چار رطل تک پہنچ سکتی ہے — اور جب حد سے بڑھے تو بند کی جاتی ہے؛ دوسری قسمیں روکنے والوں سے علاج ہوتی ہیں اور جسم کی صفراویت سے ہونے والی کے لیے مرار کا مسلسل استفراغ اور خوراک و مشروبات سے خون کی تعدیل؛ فصد بہترین روک ہے — متعلقہ طرف سے تنگ فصد، خصوصاً غشی آنے پر؛ روکنے والے قبض کرنے والے، ٹھنڈے گاڑھا اور جمانے والے، چپچپے، جلانے والے — احتیاط سے کہ چھالے کا پھپھول پہلے سے بدتر نہ بنے — خاصیت والے یا مرکب ہیں ⁦(ادویہ، عصاروں، فتیلوں، نفوخ اور تیل مساج کے نام اور مقدار نہیں لیے گئے؛ خصیوں اور سینوں والا سطر موسوم فہرست کے طور پر بانی کے فیصلے کے لیے رکھا گیا ہے)⁩ {cite:canon-ibn-sina-print-v2 p.237} {cite:canon-ibn-sina-print-v2 p.239}
  es: "La hemorragia aguda que se presenta espontáneamente no se trata hasta que se siente debilidad —puede llegar a cuatro puntos— y solo se detiene cuando es muy grave; otros tipos se tratan con depresores, y la hemorragia biliar se trata evacuando continuamente la bilis y corrigiendo la sangre con alimentos y bebidas. La flebotomía es el mejor depresor, una pequeña incisión en el costado correspondiente, especialmente cuando se produce un desmayo. Los depresores son astringentes, sustancias que enfrían, espesan y coagulan, sustancias glutinosas, corrosivos que se usan con precaución para que no se forme una costra peor que la anterior, o sustancias de propiedades especiales, o compuestos (no se incluyen los nombres ni las medidas de los fármacos, jugos, tiendas de campaña, insuflación y ungüentos; la línea que nombra los testículos y los senos de las mujeres se mantiene como una lista etiquetada reservada para la decisión del fundador) {cite:canon-ibn-sina-print-v2 p.237} {cite:canon-ibn-sina-print-v2 p.239}"
  fr: "L'hémorragie soudaine et intense n'est traitée qu'à partir du moment où une grande faiblesse se fait sentir — elle peut atteindre quatre ratls — et n'est stoppée que lorsqu'elle devient importante. Les autres types d'hémorragie sont traités par des anesthésiants, et celle due à la bile est traitée en évacuant continuellement la bile et en corrigeant le sang par l'alimentation et l'hydratation. La saignée est le meilleur anesthésiant: il s'agit d'un petit incision pratiquée du côté correspondant, surtout en cas de syncope. Les substances mentionnées sont des astringents, des produits rafraîchissants, épaississants et congelants, des substances gluantes, des corrosifs à utiliser avec précaution afin d'éviter la formation de croûtes plus graves qu'auparavant, ou des substances aux propriétés particulières, ou des composés (les noms et les doses des médicaments, jus, tentes, insufflations et embrocations ne sont pas mentionnés; la mention des testicules et des seins des femmes est conservée sous forme de liste étiquetée, réservée à la décision du fondateur) {cite:canon-ibn-sina-print-v2 p.237} {cite:canon-ibn-sina-print-v2 p.239}"
