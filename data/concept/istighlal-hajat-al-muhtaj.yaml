label:
  ar: استغلال حاجة المحتاج
  en: Exploiting the need of the needy
summary:
  ar: "يرى الشيخ شلتوت أن المال وإن عُقدت ملكيته بأسماء أصحابه، فإن حق الانتفاع به مشترك بينهم وبين الفقراء والمصالح العامة {cite:azhar-quran-building-society-shaltut p. 118}. ويعد الإسلام الانتفاع بحاجة المحتاج وإقراضه بزيادة تحريماً قاطعاً، لأن الغني يصير في تربص دائم بحاجة الناس، ويزيد ماله دون عمل ينسبه إلى المجتمع {cite:azhar-quran-building-society-shaltut p. 120}{cite:azhar-quran-building-society-shaltut p. 121}. ويستشهد بحديث «المسلم أخو المسلم لا يظلمه ولا يسلمه»، ويرى أن من ترك أخاه يجوع ويعرى وهو قادر على إطعامه وكسوته فقد أسلمه {cite:azhar-quran-building-society-shaltut p. 120}. ويصف المؤلف الربا والمعاملات الاستغلالية بأنها ظهرت وقلوب الناس خالية من معاني الرحمة، ومنها نشأت في رأيه رأسمالية طاغية تمزق الإنسانية {cite:azhar-quran-building-society-shaltut p. 122}. ويرى أن الإسلام يقابل كل آية تحذر من الاستغلال بما يعلي شأن البذل والتراحم {cite:azhar-quran-building-society-shaltut p. 123}."
