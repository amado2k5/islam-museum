id: concept/istighlal-hajat-al-muhtaj
class: concept
kind: ethical
label:
  ar: استغلال حاجة المحتاج
  en: Exploiting the need of the needy
  es: "Explotando la necesidad de los necesitados"
  fr: "Exploiter la détresse des plus démunis"
  ur: "ضرورت مندوں کی ضرورت سے فائدہ اٹھانا"
  tr: "İhtiyaç sahiplerinin ihtiyacını değerlendirmek"
  id: "Memanfaatkan kebutuhan orang yang membutuhkan"
summary:
  ar: "يرى الشيخ شلتوت أن المال وإن عُقدت ملكيته بأسماء أصحابه، فإن حق الانتفاع به مشترك بينهم وبين الفقراء والمصالح العامة {cite:azhar-quran-building-society-shaltut p. 118}. ويعد الإسلام الانتفاع بحاجة المحتاج وإقراضه بزيادة تحريماً قاطعاً، لأن الغني يصير في تربص دائم بحاجة الناس، ويزيد ماله دون عمل ينسبه إلى المجتمع {cite:azhar-quran-building-society-shaltut p. 120}{cite:azhar-quran-building-society-shaltut p. 121}. ويستشهد بحديث «المسلم أخو المسلم لا يظلمه ولا يسلمه»، ويرى أن من ترك أخاه يجوع ويعرى وهو قادر على إطعامه وكسوته فقد أسلمه {cite:azhar-quran-building-society-shaltut p. 120}. ويصف المؤلف الربا والمعاملات الاستغلالية بأنها ظهرت وقلوب الناس خالية من معاني الرحمة، ومنها نشأت في رأيه رأسمالية طاغية تمزق الإنسانية {cite:azhar-quran-building-society-shaltut p. 122}. ويرى أن الإسلام يقابل كل آية تحذر من الاستغلال بما يعلي شأن البذل والتراحم {cite:azhar-quran-building-society-shaltut p. 123}."
  tr: "Şeyh Şaltut, servetin mülkiyeti sahiplerinin adına sözleşme yapılsa bile, bundan faydalanma hakkının onlar, yoksullar ve kamu çıkarları arasında paylaşıldığına inanır {cite:azhar-kuran-inşaat-toplum-şaltut s. 118}. İslam, muhtaçların ihtiyaçlarından faydalanmayı ve onları artırarak borç vermeyi kesin bir yasak olarak görür; çünkü zenginler sürekli insanların ihtiyaçlarını beklerler ve servetlerini artırırlar, ancak bunu topluma atfetmezler {cite:azhar-kuran-inşaat-toplum-şaltut s. 120} {cite:azhar-kuran-inşaat-toplum-şaltut s. 121}. \"Müslüman, başka bir Müslümanın kardeşidir; ona ne kötülük eder ne de affeder\" hadisini aktarır ve kardeşini aç ve çıplak bırakıp onu besleyip giydirebilecek halde bırakanın, İslam'ı benimsediğine inanır {cite:azhar-kuran-inşaat-toplum-şaltut s. 120}. Yazar, tefecilik ve sömürücü işlemlerin, insanların kalpleri merhamet anlamlarından yoksun iken ortaya çıktığını ve bunlardan, onun görüşüne göre, insanlığı parçalayan zorba bir kapitalizmin ortaya çıktığını belirtir {cite:azhar-kuran-toplum inşa etme-şaltut s. 122}. İslam'ın, sömürüye karşı uyarı veren her ayeti verme ve merhamet statüsünü yükselterek karşıladığına inanır {cite:azhar-kuran-toplum inşa etme-şaltut s. 123}."
  id: "Sheikh Shaltut percaya bahwa meskipun kepemilikan kekayaan dikontrakkan atas nama pemiliknya, hak untuk memanfaatkannya dibagi antara mereka, orang miskin, dan kepentingan publik {cite:azhar-quran-building-society-shaltut hlm. 118}. Islam menganggap mendapat manfaat dari kebutuhan yang membutuhkan dan meminjamkan kepada mereka dengan meningkatkan mereka sebagai larangan ketat, karena orang kaya terus-menerus menunggu kebutuhan orang dan menambah kekayaan mereka tanpa mengaitkannya dengan masyarakat {cite:azhar-quran-building-society-shaltut hlm. 120} {cite:azhar-quran-building-society-shaltut hlm. 121}. Ia mengutip hadits \"Seorang Muslim adalah saudara dari Muslim lain; ia tidak menyakitinya maupun menyema-maafkannya,\" dan percaya bahwa siapa pun yang meninggalkan saudaranya dalam keadaan lapar dan telanjang sementara mampu memberi makan dan mengenakan pakaian, telah memeluk Islam {cite:azhar-quran-building-society-shaltut hlm. 120}. Penulis menggambarkan riba dan transaksi eksploitasi muncul saat hati orang kosong dari makna belas kasihan, dan dari itu, menurutnya, lahirlah kapitalisme tirani yang memecah belah umat manusia {cite:azhar-quran-building-society-shaltut hlm. 122}. Ia percaya bahwa Islam menanggapi setiap ayat yang memperingatkan tentang eksploitasi dengan mengangkat status pemberian dan belas kasih {cite:azhar-quran-building-society-shaltut hlm. 123}."
