summary:
  ar: 'المؤمن: المصدّق رسله ووعده والمؤمّن عباده من الظلم. الاسم رقم 6 في التعداد الوارد في حديث الترمذي عن أسماء الله الحسنى.'
  en: al-Mu'min — The Granter of Faith and Security. Name 6 in the enumeration of the most beautiful names in the Tirmidhi hadith.
  fr: "al-Mu'min — Celui qui accorde la foi et la sécurité. Nom 6 dans l’énumération des plus beaux noms du hadith de Tirmidhi."
  ur: 'المؤمن: ایمان اور امن دینے والا — اپنے رسولوں کی تصدیق اور بندوں کو امن بخشنے والا۔ اسمائے حسنیٰ کی ترمذی والی گنتی میں نمبر 6۔'
  es: "al-Mu'min — El que otorga la fe y la seguridad. Ocupa el sexto lugar en la enumeración de los nombres más bellos en el hadiz de Tirmidhi."
  tr: "İnanan: El-Tirmihi'nin elçilerini onaylayan ve vaat eden, mümin, adaletsizlikten koparan kullarıdır. El-Tirmihi'nin Allah'ın En Güzel İsimleri hakkındaki hadislerde adı 6."
  id: "Orang beriman: dia yang menegaskan utusan dan janji-janji-Nya, dan orang beriman adalah hamba-Nya dari ketidakadilan. Nama nomor 6 dalam daftar yang disebutkan dalam hadits Al-Tirmidhi tentang Nama-nama Terindah Allah."
