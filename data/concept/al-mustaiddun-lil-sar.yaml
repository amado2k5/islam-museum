id: "concept/al-mustaiddun-lil-sar"
class: "concept"
kind: "scientific"
label:
  ar: "المتهيّئون للصرع"
  en: "Those prone to epilepsy"
  fr: "Ceux qui sont prédisposés à l'épilepsie"
  ur: "صرع کے مستعد"
  es: "Aquellos propensos a la epilepsia"
  tr: "Epilepsiye yatkın olanlar"
  id: "Mereka yang rentan terhadap epilepsi"
summary:
  ar: "يعرض الصرع للمرطوبين بأسنانهم كالصبيان والأطفال، والمرطوبين بتدبيرهم كأصحاب التخم، والذين يسكنون بلاداً جنوبية الريح لأنها تملأ الرأس وتقبض العروق أقلّ {cite:canon-ibn-sina-print-v2 p.122}"
  en: "Epilepsy befalls those moist by age, like infants and children, those moist by regimen, like people of indigestions, and those who live in lands of the south wind, because it fills the head and contracts the vessels less {cite:canon-ibn-sina-print-v2 p.122}"
  fr: "L'épilepsie atteint ceux qui sont humides par l'âge, comme les nourrissons et les enfants, ceux qui sont humides par leur régime, comme les gens sujets aux indigestions, et ceux qui vivent dans des pays de vent du sud, car il remplit la tête et resserre moins les vaisseaux {cite:canon-ibn-sina-print-v2 p.122}"
  ur: "صرع ان لوگوں پر گزرتا ہے جو سنی کے لحاظ سے مرطوب ہوں جیسے بچے اور طفل، جو تدبیر کے لحاظ سے مرطوب ہوں جیسے تُخمہ خور، اور جو جنوبی ہوا والے ملکوں میں رہتے ہوں کیونکہ وہ سر کو بھرتی اور عروق کو کم قبض کرتی ہے {cite:canon-ibn-sina-print-v2 p.122}۔"
  es: "La epilepsia afecta a los jóvenes húmedos por la edad, como los bebés y los niños, a los jóvenes húmedos por el régimen, como las personas con indigestión, y a los que viven en tierras del viento del sur, porque este llena la cabeza y contrae menos los vasos sanguíneos {cite:canon-ibn-sina-print-v2 p.122}"
  tr: "Epilepsi, dişleri nemli olanlara (örneğin erkek çocuklar ve çocuklara), yönetimleriyle nemli olanlara (örneğin sınırları olanlar) ve güney rüzgarlı ülkelerde yaşayanlara yatkındır çünkü başı doldurur ve damarları daha az daraltır {cite:canon-ibn-sina-print-v2 s.122}"
  id: "Epilepsi cenderung pada mereka yang memiliki gigi basah (misalnya, anak laki-laki dan anak-anak), mereka yang memiliki tendon lembap (misalnya, yang memiliki tepi rambut), serta mereka yang tinggal di negara berangin selatan karena menutupi kepala dan mempersempit pembuluh darah lebih sedikit {cite:canon-ibn-sina-print-v2 hlm.122}"
