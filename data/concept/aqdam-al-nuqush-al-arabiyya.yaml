label:
  ar: "أقدم النقوش العربية بالترتيب"
  en: "The earliest Arabic inscriptions, in order"
  ur: "عربی کے قدیم ترین کتبے، ترتیب سے"
  fr: "Les plus anciennes inscriptions arabes, dans l'ordre"
  es: "Las inscripciones árabes más antiguas, en orden"
  tr: "En eski Arapça yazıtlar sırasıyla"
  id: "Prasasti Arab tertua secara berurutan"
summary:
  ar: "ست نقوش مؤرخة بالترتيب، من نقش رقوش في الحِجر سنة 267م إلى نقش قبة الصخرة سنة 72هـ، مروراً بالنمارة وزبد وجبل أسيس وحران، كما يعرضها ملخص بحثي قُدّم إلى المتحف، مع التواريخ البديلة والتحفظات كما وردت {cite:britannica-arabic-alphabet}."
  en: "Six dated inscriptions in order, from the Raqosh epitaph at al-Hijr in 267 CE to the Dome of the Rock inscription of 72 AH, by way of Namara, Zabad, Jabal Usays and Harran, as a research summary supplied to the museum presents them, with the alternative dates and reservations as given {cite:britannica-arabic-alphabet}."
  ur: "چھ تاریخ دار کتبے ترتیب سے، 267 عیسوی میں الحجر کے رقوش کے کتبے سے لے کر 72ھ کے قبۃ الصخرہ کے کتبے تک، نمارہ، زبد، جبل اُسیس اور حران سے ہوتے ہوئے، جیسا میوزیم کو فراہم کیا گیا تحقیقی خلاصہ انھیں پیش کرتا ہے، متبادل تاریخوں اور تحفظات کے ساتھ جیسے وہ آئے {cite:britannica-arabic-alphabet}۔"
  fr: "Six inscriptions datées dans l'ordre, de l'épitaphe de Raqosh à al-Hijr en 267 à l'inscription du Dôme du Rocher de 72 H, en passant par Namara, Zabad, Jabal Usays et Harran, telles que les présente une synthèse de recherche remise au musée, avec les dates alternatives et les réserves telles qu'elles sont données {cite:britannica-arabic-alphabet}."
  es: "Seis inscripciones fechadas en orden, desde el epitafio de Raqosh en al-Hijr en 267 hasta la inscripción de la Cúpula de la Roca del año 72 AH, pasando por Namara, Zabad, Jabal Usays y Harran, tal como las presenta un resumen de investigación entregado al museo, con las fechas alternativas y las reservas tal como se dan {cite:britannica-arabic-alphabet}."
  tr: "Altı yazıt sırasıyla tarihlenmiştir; 267 yılında taş bir yazıttan Namara, Zabad, Asis Dağı ve Harran'dan geçen 72 Hicri Kaya Kubbesi yazıtına kadar; ayrıca müzeye sunulan bir araştırma özeti, alternatif tarihler ve rezervasyonlar {atıf:britannica-arabic-alphabet} ile birlikte hazırlanmıştır."
  id: "Enam prasasti bertanggal berurutan, mulai dari prasasti batu pada tahun 267 M hingga Prasasti Kubah Batu pada tahun 72 H, melewati Namara, Zabad, Gunung Asis, dan Harran, serta ringkasan penelitian yang diserahkan ke museum, beserta tanggal alternatif dan reservasi yang disediakan {cite:britannica-arabic-alphabet}."
