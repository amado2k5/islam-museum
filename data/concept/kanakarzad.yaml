summary:
  ar: "الكنكرزد عند الكتاب صمغ الحرشف، وهو أصناف من الكنكر، ويُقال فيه كركرهن، وطبعه حار يابس في الثانية."
  en: "Kankarzad is, according to the book, the gum of the artichoke, a kind of kankar, also called karkarhan. Its nature is hot and dry in the second degree. The editor's footnote gives the name as artichoke."
  ur: "کتاب کے مطابق کنکرزد حرشف کا گوند ہے، جو کنکر کی اقسام میں سے ہے اور جسے کرکرہن بھی کہا گیا ہے۔ اس کا مزاج دوسرے درجے میں گرم اور خشک ہے۔ حاشیے میں اسے حرشف لکھا گیا ہے۔"
  es: "Según el libro, Kankarzad es la goma de la alcachofa, una especie de kankar, también llamada karkarhan. Su naturaleza es cálida y seca de segundo grado. La nota al pie del editor indica que se trata de alcachofa."
