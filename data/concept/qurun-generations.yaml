id: concept/qurun-generations
class: concept
kind: social
label:
  ar: "القرون والأجيال"
  en: "Al-Qurun (the centuries and generations)"
summary:
  ar: "القرن في اللسان يطلق على أهل الزمان الواحد والجيل الذي يعيش معا، وعلى مدة من الزمان قدّرها العلماء بمئة عام أو نحوها. وجاء في الحديث: خير القرون قرني ثم الذين يلونهم ثم الذين يلونهم. وفي القرآن إهلاك القرون الظالمة وذكر عدة القرون بين نوح ومحمد. {cite:athar-baqiya-thaqafa-2008} {cite:muruj-al-dhahab}"
  en: "The qarn is a generation of people living in one age, and by extension a span of time the scholars reckoned at about a hundred years. The Prophet said: the best of generations is mine, then those who follow them, then those who follow them. The Qur'an speaks of the generations destroyed for their wrongdoing and of the number of generations between Noah and Muhammad. {cite:athar-baqiya-thaqafa-2008} {cite:muruj-al-dhahab}"
  ur: "قرن سے مراد ایک ہی زمانے میں رہنے والی نسل اور لوگ ہیں، اور اسے علما نے تقریباً سو برس کی مدت قرار دیا ہے۔ نبی کریم نے فرمایا: بہترین قرن میری قوم کی ہے، پھر ان کے بعد آنے والے، پھر ان کے بعد آنے والے۔ قرآن نے ظالم قرون کے ہلاک ہونے اور نوح سے محمد تک کی قرون کی گنتی کا ذکر کیا ہے۔ {cite:athar-baqiya-thaqafa-2008} {cite:muruj-al-dhahab}"
