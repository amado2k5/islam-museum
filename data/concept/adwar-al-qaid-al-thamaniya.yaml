id: concept/adwar-al-qaid-al-thamaniya
class: concept
kind: term
label:
  ar: "أدوار القائد الثمانية والتدريب على القيادة العامة"
  en: "The leader's eight roles and training in general leadership"
  fr: "Les huit rôles du dirigeant et la formation à la direction générale"
  ur: "قائد کے آٹھ کردار اور عمومی قیادت کی تدریب"
  es: "Los ocho roles del líder y la formación en liderazgo general."
  tr: "Lider ve Genel Komuta Eğitiminin Sekiz Rolü"
  id: "Delapan Peran Pelatihan Pemimpin dan Komando Umum"
summary:
  ar: "نموذج طارق السويدان للتدريب على القيادة العامة: ثمانية أدوار هي الوجهة والقدوة والتغيير والتحفيز والتدريب والعلاقات والتدخل والتمكين، لكل منها عنصران وكفاءتان ومهارة تدريب لكل كفاءة، وما سواها إدارة تُفوَّض."
  en: "Tareq al-Suwaidan's model of training in general leadership: eight roles, direction, example, change, motivation, training, relations, intervention and empowerment, each with two elements, two competencies and a training skill for each; everything else is management, to be delegated."
  fr: "Le modèle de formation à la direction générale de Tareq al-Suwaidan comporte huit rôles : orientation, exemplarité, changement, motivation, formation, relations, intervention et responsabilisation. Chacun comprend deux éléments et deux compétences, chacune associée à un apprentissage précis. Tout le reste relève de la gestion, qui doit être déléguée."
  ur: "عمومی قیادت کی تدریب کا طارق السویدان کا نمونہ: آٹھ کردار، یعنی سمت، نمونۂ عمل، تبدیلی، تحریک، تدریب، تعلقات، مداخلت اور اختیار دہی، ہر ایک کے دو عناصر، دو صلاحیتیں اور ہر صلاحیت کی تدریبی مہارت؛ باقی سب انتظام ہے جو سونپ دیا جائے۔"
  es: "El modelo de formación en liderazgo general de Tareq al-Suwaidan consta de ocho roles: dirección, ejemplo, cambio, motivación, formación, relaciones, intervención y empoderamiento, cada uno con dos elementos, dos competencias y una habilidad de formación específica; todo lo demás es gestión, que debe delegarse."
  tr: "Tariq Al-Suwaidan Genel Liderlik Eğitimi Modeli: Sekiz rol: hedef, rol model, değişim, motivasyon, eğitim, ilişkiler, müdahale ve güçlendirme; her biri iki unsur, iki yetkinlik ve her yetkinlik için bir eğitim becerisi içerir; geri kalanlar ise devredilen yönetimdir."
  id: "Model Pelatihan Kepemimpinan Umum Tariq Al-Suwaidan: Delapan peran: tujuan, panutan, perubahan, motivasi, pelatihan, hubungan, intervensi, dan pemberdayaan; masing-masing mencakup dua elemen, dua kompetensi, dan satu keterampilan pelatihan untuk setiap kompetensi; sisanya adalah manajemen yang didelegasikan."
