label:
  ar: "أدوار القائد الثمانية والتدريب على القيادة العامة"
  en: "The leader's eight roles and training in general leadership"
  ur: "قائد کے آٹھ کردار اور عمومی قیادت کی تدریب"
summary:
  ar: "نموذج طارق السويدان للتدريب على القيادة العامة: ثمانية أدوار هي الوجهة والقدوة والتغيير والتحفيز والتدريب والعلاقات والتدخل والتمكين، لكل منها عنصران وكفاءتان ومهارة تدريب لكل كفاءة، وما سواها إدارة تُفوَّض."
  en: "Tareq al-Suwaidan's model of training in general leadership: eight roles, direction, example, change, motivation, training, relations, intervention and empowerment, each with two elements, two competencies and a training skill for each; everything else is management, to be delegated."
  ur: "عمومی قیادت کی تدریب کا طارق السویدان کا نمونہ: آٹھ کردار، یعنی سمت، نمونۂ عمل، تبدیلی، تحریک، تدریب، تعلقات، مداخلت اور اختیار دہی، ہر ایک کے دو عناصر، دو صلاحیتیں اور ہر صلاحیت کی تدریبی مہارت؛ باقی سب انتظام ہے جو سونپ دیا جائے۔"
