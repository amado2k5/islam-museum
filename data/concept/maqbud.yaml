label: { ar: "المَقْبُوض", en: "Things taken into possession (maqbud)", ur: "مقبوضہ چیز" }
summary:
  ar: "المقبوض في اللغة ما أُخذ باليد أو صار في حيازة الشخص وتحت تصرفه، وتختلف صورة القبض باختلاف المقبوض: فالمكيل والموزون والمعدود يصير مقبوضا بكيله أو وزنه أو عده، والمنقول بنقله، والحيوان بتمشيته من مكان العقد، والعقار بالتخلية وتسليم المفتاح، وإتلاف المشتري له يصيره مقبوضا حكما. ويتعلق بالمقبوض أحكام الضمان في العارية والسوم والرهن والقرض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14915}"
  en: "A thing taken into possession is one held in the hand or in one's custody and control. The form of taking depends on the thing: measured, weighed or counted goods by measure, weight or count; movable goods by moving them; animals by walking them from the place of contract; land by handing over the keys once the buyer can use it; and the buyer's destruction of the goods counts as possession. Liability rules attach to such things in loan, goods on approval, pledge and loan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14915}"
  ur: "مقبوضہ چیز وہ ہے جو قبضے میں آ جائے۔ کیل، وزن اور گنتی والی چیزوں کا قبضہ ناپ، تول اور گنتی سے ہوتا ہے، اور غیر منقول کا قبضہ چابی سپرد کرنے سے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14914}"
