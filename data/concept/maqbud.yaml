label: { ar: "المَقْبُوض", en: "Things taken into possession (maqbud)", ur: "مقبوضہ چیز", es: "Cosas tomadas en posesión (maqbud)", fr: "Choses prises en possession (maqbud)", tr: "Tutuklandı", id: "Ditangkap" }
summary:
  ar: "المقبوض في اللغة ما أُخذ باليد أو صار في حيازة الشخص وتحت تصرفه، وتختلف صورة القبض باختلاف المقبوض: فالمكيل والموزون والمعدود يصير مقبوضا بكيله أو وزنه أو عده، والمنقول بنقله، والحيوان بتمشيته من مكان العقد، والعقار بالتخلية وتسليم المفتاح، وإتلاف المشتري له يصيره مقبوضا حكما. ويتعلق بالمقبوض أحكام الضمان في العارية والسوم والرهن والقرض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14915}"
  en: "A thing taken into possession is one held in the hand or in one's custody and control. The form of taking depends on the thing: measured, weighed or counted goods by measure, weight or count; movable goods by moving them; animals by walking them from the place of contract; land by handing over the keys once the buyer can use it; and the buyer's destruction of the goods counts as possession. Liability rules attach to such things in loan, goods on approval, pledge and loan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14915}"
  ur: "مقبوضہ چیز وہ ہے جو قبضے میں آ جائے۔ کیل، وزن اور گنتی والی چیزوں کا قبضہ ناپ، تول اور گنتی سے ہوتا ہے، اور غیر منقول کا قبضہ چابی سپرد کرنے سے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14914}"
  es: "Una cosa tomada en posesión es aquella que se sostiene en la mano o bajo la custodia y control de una persona. La forma de toma depende de la cosa: bienes medidos, pesados o contados mediante la medida, el peso o el conteo; bienes muebles mediante su traslado; animales mediante su traslado desde el lugar del contrato; terrenos mediante la entrega de las llaves una vez que el comprador puede usarlos; y la destrucción de los bienes por parte del comprador se considera posesión. Las normas de responsabilidad se aplican a tales cosas en préstamos, bienes a prueba, prenda y crédito. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14915}"
  fr: "La prise de possession d'une chose est celle d'une chose tenue en main ou sous la garde et le contrôle d'une personne. La forme de cette prise de possession dépend de la nature de la chose: les biens mesurés, pesés ou comptés sont pris en compte par mesure, poids ou comptage; les biens meubles sont pris en compte par leur déplacement; les animaux sont pris en compte par leur déplacement depuis le lieu de la transaction; les terrains sont pris en compte par la remise des clés une fois que l'acheteur peut les utiliser; la destruction des biens par l'acheteur vaut également prise de possession. Les règles de responsabilité s'appliquent aux biens prêtés, aux biens à l'essai, aux biens en gage et aux prêts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14915}"
  tr: "Dilbilimde 'ele geçirilen' elde edilen veya kişinin elinde ve elinde bulunan şeydir. Sahiplenme şekli mülkiyete göre değişir: ölçülen, tartılan ve sayılan kişiler temsilcileri, ağırlığı veya sayımına göre alınır; devredilen taşınma; hayvan sözleşme yerinden yürüyerek alınır; mal anahtarın boşaltılıp teslim edilmesiyle; alıcı tarafından yok edilirse yasal olarak sahiplenilmiş olur. Garanti kuralları, mülkiyet üzerindeki mülke borçlar, pazarlıklar, ipotekler ve krediler için geçerlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14915}"
  id: "Dalam linguistik, 'dimiliki' adalah apa yang diambil dengan tangan atau dimiliki dan dibuang oleh orang tersebut. Bentuk kepemilikan bervariasi tergantung pada kepemilikan: yang diukur, yang ditimbang, dan yang dihitung diambil oleh agen, berat, atau hitungnya; yang dipindahkan adalah dengan transportasinya; hewan dengan berjalan keluar dari tempat kontrak; properti dengan melepaskan dan menyerahkan kunci; dan penghancuran oleh pembeli menjadikannya dimiliki secara hukum. Aturan jaminan berlaku untuk properti yang dimiliki dalam pinjaman, tawar-menawar, gadai, dan pinjaman. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14915}"
