summary:
  ar: "الأذريون في الكتاب حارّ يابس في الثالثة، ينفع من داء الثعلب مسحوقاً بالخل، ورماده بالخل ينفع من عرق النسا، وينفع من السموم كلها وخصوصاً اللدوغ؛ وفي حاشية المحقق أنه الحنوة؛ وينقل الكتاب عن ديسقوريدوس قولاً عن الجنين في فقرة موسومة معلّقة لحكم المؤسس {cite:canon-ibn-sina-print-v1 p.355}"
  en: "In the book adhrion is hot and dry in the third degree; ground with vinegar it helps alopecia (da' al-tha'lab), its ash with vinegar helps sciatica, and it helps all poisons and especially stings; the editor's footnote gives it as al-hanwa; and the book reports from Dioscorides a statement on the foetus in a labelled section held for the founder's ruling {cite:canon-ibn-sina-print-v1 p.355}"
  fr: "Le Canon décrit l’adhrion comme chaud et sec au troisième degré. Il lui attribue un effet contre l’alopécie (da’ al-tha’lab) sous forme broyée avec du vinaigre, et à sa cendre mêlée à du vinaigre un effet contre la sciatique. Le traité lui prête aussi des effets contre tous les poisons, et surtout contre les piqûres. L’éditeur l’identifie en note à l’al-hanwa. Le traité rapporte un propos de Dioscoride sur le fœtus dans une section signalée et réservée à la décision du fondateur {cite:canon-ibn-sina-print-v1 p.355}"
  ur: "اذریون کتاب میں تیسرے درجے میں گرم خشک ہے؛ سرکے کے ساتھ پسا ہوا داء الثعلب میں مفید ہے، اس کی راکھ سرکے کے ساتھ عرق النسا میں مفید ہے، اور یہ تمام زہروں میں، خصوصاً ڈنکوں میں، مفید ہے؛ محقق کے حاشیے میں اسے حنوہ بتایا گیا ہے؛ اور کتاب دیسقوریدوس سے جنین کے بارے میں ایک بات موسوم حصے میں نقل کرتی ہے جو بانی کے فیصلے کے لیے موقوف ہے {cite:canon-ibn-sina-print-v1 p.355}۔"
  es: "En el libro, el adrión es caliente y seco en tercer grado; molido con vinagre ayuda a la alopecia (da' al-tha'lab), su ceniza con vinagre ayuda a la ciática y ayuda a todas las intoxicaciones y especialmente a las picaduras; la nota al pie del editor lo menciona como al-hanwa; y el libro recoge de Dioscórides una declaración sobre el feto en una sección etiquetada reservada para el dictamen del fundador {cite:canon-ibn-sina-print-v1 p.355}"
