summary:
  ar: "لكل كوكب من الكواكب الخمسة أربعة أفلاك على هيئة أفلاك القمر: فلك ممثل بفلك البروج، وفلك مائل عليه، وفلك خارج المركز، وفلك تدوير يجري مركزه على الفلك الخارج. {cite:zij-sabi-nallino-byblion p.95}."
  en: "Each of the five planets has four spheres arranged like the Moon's: one level with the zodiac's sphere, an inclined sphere over it, an eccentric sphere, and an epicycle whose centre travels along the eccentric. {cite:zij-sabi-nallino-byblion p.95}."
  ur: "پانچ سیاروں میں سے ہر ایک کے چار افلاک ہیں جو چاند کے افلاک کی ہیئت پر ہیں: بروجی فلک کے برابر فلک، اس پر مائل فلک، خارج المرکز فلک، اور فلکِ تدویر جس کا مرکز خارج المرکز پر چلتا ہے۔ {cite:zij-sabi-nallino-byblion p.95}۔"
