label: { ar: "أفلاك الكواكب الخمسة في الزيج الصابي", en: "The spheres of the five planets in the Zij al-Sabi", ur: "زیج صابی میں پانچ سیاروں کے افلاک", es: "Las esferas de los cinco planetas en el Zij al-Sabi", fr: "Les sphères des cinq planètes dans le Zij al-Sabi", tr: "Sabian astronomik tablolarındaki beş gezegenin yörüngeleri", id: "Orbit kelima planet dalam tabel astronomi Sabian" }
summary:
  ar: "لكل كوكب من الكواكب الخمسة أربعة أفلاك على هيئة أفلاك القمر: فلك ممثل بفلك البروج، وفلك مائل عليه، وفلك خارج المركز، وفلك تدوير يجري مركزه على الفلك الخارج. {cite:zij-sabi-nallino-byblion p.95}."
  en: "Each of the five planets has four spheres arranged like the Moon's: one level with the zodiac's sphere, an inclined sphere over it, an eccentric sphere, and an epicycle whose centre travels along the eccentric. {cite:zij-sabi-nallino-byblion p.95}."
  ur: "پانچ سیاروں میں سے ہر ایک کے چار افلاک ہیں جو چاند کے افلاک کی ہیئت پر ہیں: بروجی فلک کے برابر فلک، اس پر مائل فلک، خارج المرکز فلک، اور فلکِ تدویر جس کا مرکز خارج المرکز پر چلتا ہے۔ {cite:zij-sabi-nallino-byblion p.95}۔"
  es: "Cada uno de los cinco planetas tiene cuatro esferas dispuestas como la de la Luna: una al mismo nivel que la esfera del zodíaco, una esfera inclinada sobre ella, una esfera excéntrica y un epiciclo cuyo centro se desplaza a lo largo de la esfera excéntrica. {cite:zij-sabi-nallino-byblion p.95}."
  fr: "Chacune des cinq planètes possède quatre sphères disposées comme celle de la Lune: une sphère au niveau de la sphère zodiacale, une sphère inclinée par-dessus, une sphère excentrique et un épicycle dont le centre se déplace le long de la sphère excentrique. {cite:zij-sabi-nallino-byblion p.95}."
  tr: "Beş gezegenin her birinin, Ay'ın yörüngelerine benzer dört yörüngesi vardır: ekliptiği temsil eden bir yörünge, ona eğimli bir yörünge, dış merkezli bir yörünge ve merkezi dış merkezli yörünge üzerinde bulunan bir episikl. {cite:zij-sabi-nallino-byblion s.95}."
  id: "Masing-masing dari lima planet memiliki empat orbit yang berbentuk seperti orbit bulan: sebuah orbit yang mewakili bidang ekliptika, sebuah orbit yang miring terhadapnya, sebuah orbit eksentrik, dan sebuah epikikel yang pusatnya berada pada orbit eksentrik. {cite:zij-sabi-nallino-byblion p.95}."
