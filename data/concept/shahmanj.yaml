summary:
  ar: "الشهمانج في الكتاب حار يابس في الثانية، محلل ملطف جدا، وفي الحاشية أنه الشاه بانك، وإذا وضع تحت وساد الصبيان نفع من لعاب أفواههم، وينفع من الفالج طلاء وسعوطا وشربا بالشراب، ويسعط بمائه فينقي الدماغ، وينفع من اللقوة والصرع شربا بالشراب، وينفع من رطوبات المعدة، ويذكر الكتاب نقلا موسوما أنه ينفع من رياح الرحم {cite:canon-ibn-sina-print-v1 p.676}"
  en: "Shahmanj is in the book hot and dry in the second degree, very dissolving and subtilising, and the editor's note says it is the shah banak; when placed under the pillow of boys it benefits the slobber of their mouths; it benefits palsy as a smear, as a snuff and as a drink taken with a sharab; snuffed up as its water it cleans the brain, and drunk with a sharab it benefits facial palsy and epilepsy; it benefits the moistures of the stomach; and the book lists, as a labelled report, that it benefits the winds of the womb {cite:canon-ibn-sina-print-v1 p.676}"
  ur: "شہمانج کتاب میں دوسرے درجے میں گرم خشک، بہت تحلیل کرنے والا اور لطیف بنانے والا ہے، اور حاشیے میں ہے کہ یہ شاہ بانک ہے؛ اسے لڑکوں کے تکیے کے نیچے رکھا جائے تو ان کے منہ کی رال میں نافع ہے؛ فالج میں لیپ، نسوار اور مشروب ⁦(الشراب)⁩ کے ساتھ پینے کی صورت میں نافع ہے؛ اس کا پانی سونگھایا جائے تو دماغ کو صاف کرتا ہے، اور مشروب ⁦(الشراب)⁩ کے ساتھ پیا جائے تو لقوے اور مرگی میں نافع ہے؛ معدے کی رطوبتوں میں نافع ہے؛ اور کتاب منقول فہرست کے طور پر درج کرتی ہے کہ یہ رحم کی ہواؤں میں نافع ہے {cite:canon-ibn-sina-print-v1 p.676}۔"
  es: "En el libro, el shahmanj es caliente y seco en segundo grado, muy disolvente y sutilizante, y la nota del editor dice que es el shah banak; cuando se coloca debajo de la almohada de los niños beneficia la salivación de sus bocas; beneficia la parálisis como ungüento, como rapé y como bebida tomada con un sharab; inhalado como su agua limpia el cerebro, y bebido con un sharab beneficia la parálisis facial y la epilepsia; beneficia la humedad del estómago; y el libro enumera, como un informe etiquetado, que beneficia los vientos del útero {cite:canon-ibn-sina-print-v1 p.676}"
  fr: "Le shahmaj est décrit dans le livre comme chaud et sec au deuxième degré, très dissolvant et subtilisant, et la note de l'éditeur précise qu'il s'agit du shah banak; placé sous l'oreiller des garçons, il est bénéfique à leur salive; il est bénéfique à la paralysie, appliqué en pommade, prisé ou consommé avec du sharab; prisé sous forme d'eau, il purifie le cerveau, et bu avec du sharab, il est bénéfique à la paralysie faciale et à l'épilepsie; il est bénéfique à l'hydratation de l'estomac; et le livre mentionne, dans un rapport détaillé, qu'il est bénéfique aux gaz utérins {cite:canon-ibn-sina-print-v1 p.676}"
  tr: "Kitapta Şahmang ikinci saniyede sıcak ve kuru, çok nazik, dipnotta ise Şah Bankası'dır. Erkeklerin yastığının altına konduğunda, ağızlarında tükürük bulunur ve felç için kaplar, öksürerek ve içecekle içerek faydalıdır. Beyni arındırmak için suyu ile ıslatılır, içmeyle içilerek güçsüzlük ve epilepsi için faydalıdır ve mide neminden faydalıdır. Kitapta aktarılan bir pasajda rahim rüzgarından fayda sağladığı belirtilir {cite:canon-ibn-sina-print-v1 s.676}"
  id: "Dalam buku, Shahmang panas dan kering pada detik kedua, sangat lembut, dan dalam catatan kaki disebut Shah Bank. Ketika diletakkan di bawah bantal anak laki-laki, ia mendapat manfaat dari air liur di mulut mereka, dan dari kelumpuhan, bermanfaat dengan melapisi, batuk, dan minum bersama minuman. Ia direndam dengan airnya untuk memurnikan otak, bermanfaat untuk kelemahan dan epilepsi dengan diminum, dan mendapat manfaat dari kelembapan lambung. Buku ini menyebutkan dalam sebuah bagian transmisi bahwa ia mendapat manfaat dari angin rahim {cite:canon-ibn-sina-print-v1 hlm.676}"
