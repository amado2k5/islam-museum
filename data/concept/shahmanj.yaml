label:
  ar: "شهمانج"
  en: "Shahmanj"
  ur: "شہمانج"
summary:
  ar: "الشهمانج في الكتاب حار يابس في الثانية، محلل ملطف جدا، وفي الحاشية أنه الشاه بانك، وإذا وضع تحت وساد الصبيان نفع من لعاب أفواههم، وينفع من الفالج طلاء وسعوطا وشربا بالشراب، ويسعط بمائه فينقي الدماغ، وينفع من اللقوة والصرع شربا بالشراب، وينفع من رطوبات المعدة، ويذكر الكتاب نقلا موسوما أنه ينفع من رياح الرحم {cite:canon-ibn-sina-print-v1 p.676}"
  en: "Shahmanj is in the book hot and dry in the second degree, very dissolving and subtilising, and the editor's note says it is the shah banak; when placed under the pillow of boys it benefits the slobber of their mouths; it benefits palsy as a smear, as a snuff and as a drink taken with a sharab; snuffed up as its water it cleans the brain, and drunk with a sharab it benefits facial palsy and epilepsy; it benefits the moistures of the stomach; and the book lists, as a labelled report, that it benefits the winds of the womb {cite:canon-ibn-sina-print-v1 p.676}"
  ur: "شہمانج کتاب میں دوسرے درجے میں گرم خشک، بہت تحلیل کرنے والا اور لطیف بنانے والا ہے، اور حاشیے میں ہے کہ یہ شاہ بانک ہے؛ اسے لڑکوں کے تکیے کے نیچے رکھا جائے تو ان کے منہ کی رال میں نافع ہے؛ فالج میں لیپ، نسوار اور مشروب ⁦(الشراب)⁩ کے ساتھ پینے کی صورت میں نافع ہے؛ اس کا پانی سونگھایا جائے تو دماغ کو صاف کرتا ہے، اور مشروب ⁦(الشراب)⁩ کے ساتھ پیا جائے تو لقوے اور مرگی میں نافع ہے؛ معدے کی رطوبتوں میں نافع ہے؛ اور کتاب منقول فہرست کے طور پر درج کرتی ہے کہ یہ رحم کی ہواؤں میں نافع ہے {cite:canon-ibn-sina-print-v1 p.676}۔"
