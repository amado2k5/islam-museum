id: concept/jannat-al-tajriba
class: concept
kind: doctrine
label:
  ar: "جنة التجربة"
  en: "The garden of trial (where Adam dwelt)"
  ur: "آزمائش کا باغ"
summary:
  ar: "يرى الشعراوي أن الجنة التي سكنها آدم وزوجه ليست جنة الخلد، بل جنة تجربة لتطبيق المنهج، لأن فيها تكليفا ولا تكليف في جنة الآخرة، وأن القرآن يطلق لفظ الجنة على جنات الدنيا أيضا {cite:tafsir-sharawi-khawatir-scan p.258} {cite:tafsir-sharawi-khawatir-scan p.259} {cite:tafsir-sharawi-khawatir-scan p.260}."
  en: "Sha'rawi holds that the garden in which Adam and his wife dwelt was not the eternal Garden but a garden of trial for applying the method, since it carried a duty and the Hereafter has none, and that the Qur'an uses the word jannah for gardens of this world too {cite:tafsir-sharawi-khawatir-scan p.258} {cite:tafsir-sharawi-khawatir-scan p.259} {cite:tafsir-sharawi-khawatir-scan p.260}."
  ur: "شعراوی کے نزدیک جس باغ میں آدم اور ان کی بیوی رہے وہ جنت الخلد نہیں بلکہ منہج پر عمل کی آزمائش کا باغ تھا، کیونکہ اس میں تکلیف تھی اور آخرت میں تکلیف نہیں، اور قرآن دنیا کے باغوں کو بھی جنت کہتا ہے {cite:tafsir-sharawi-khawatir-scan p.258} {cite:tafsir-sharawi-khawatir-scan p.259} {cite:tafsir-sharawi-khawatir-scan p.260}۔"
wings: [place]
