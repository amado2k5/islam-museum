issue:
  ar: "أي جنة سكنها آدم: جنة الخلد أم جنة تجربة في الأرض؟"
  en: "Which garden did Adam dwell in: the eternal Garden, or a garden of trial on earth?"
perspectives:
  - tradition: sunni
    id: sunni-sharawi
    stance:
      ar: "جنة آدم جنة تجربة، لا جنة الخلد، ومن أراد الخلد فهو في الآخرة"
      en: "Adam's garden was a garden of trial, not the eternal Garden"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يرد الشعراوي على من قال إنها جنة الآخرة، وعلى من قال إنه لولا عصيان آدم لبقينا في الجنة، ويقرر أنها جنة تجربة تُطبق فيها المنهج {cite:tafsir-sharawi-khawatir-scan p.258} {cite:tafsir-sharawi-khawatir-scan p.260}."
      en: "Sha'rawi answers those who say it was the Garden of the Hereafter, and those who say that without Adam's disobedience we would still be in the Garden. He holds that it was a garden of trial in which the method was applied {cite:tafsir-sharawi-khawatir-scan p.258} {cite:tafsir-sharawi-khawatir-scan p.260}."
    sources: [source/tafsir-sharawi-khawatir-scan]
