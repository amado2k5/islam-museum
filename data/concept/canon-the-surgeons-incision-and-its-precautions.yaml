id: concept/canon-the-surgeons-incision-and-its-precautions
class: concept
kind: scientific
label: { ar: "البط وشروطه واحتياطاته عند ابن سينا", en: "The surgeon's incision and its precautions in the Canon", ur: "قانون میں چیرا لگانا اور اس کی احتیاطیں", es: "La incisión del cirujano y sus precauciones en el Canon", fr: "L'incision du chirurgien et ses précautions dans le Canon", tr: "İbn Sina'ya göre ördekler ve onların koşulları ile önlemleri", id: "Bebek dan kondisi serta tindakan pencegahan menurut Ibn Sina" }
summary:
  ar: "يتناول ابن سينا في الفصل السادس والعشرين البط، فيذكر الاتجاه الذي يشق فيه، وعلم الباط بالتشريح، وما يجب أن يعده من أدوية حابسة وآلات، وما يفعل بعد بط الخراج {cite:canon-ibn-sina-print-v1 pp.305-306}."
  en: "In chapter 26 Ibn Sina treats incision: the direction in which the cut is made, the incisor's knowledge of anatomy, what he must have ready in the way of blood-stopping drugs and instruments, and what to do after an abscess has been opened {cite:canon-ibn-sina-print-v1 pp.305-306}."
  es: "En el capítulo 26, Ibn Sina trata la incisión: la dirección en la que se realiza el corte, el conocimiento de anatomía que debe tener el cirujano, lo que debe tener preparado en cuanto a medicamentos e instrumentos para detener la hemorragia y qué hacer después de que se haya abierto un absceso {cite:canon-ibn-sina-print-v1 pp.305-306}."
  fr: "Au chapitre 26, Ibn Sina traite de l'incision: la direction dans laquelle la coupe est faite, la connaissance de l'anatomie de l'incisif, ce qu'il doit avoir prêt en matière de médicaments et d'instruments pour arrêter le saignement, et ce qu'il faut faire après l'ouverture d'un abcès {cite:canon-ibn-sina-print-v1 pp.305-306}."
  ur: "باب 26 میں ابن سینا چیرا کا علاج کرتا ہے: جس سمت میں کاٹا جاتا ہے، چیرا کرنے والے کا اناٹومی کا علم، خون کو روکنے والی دوائیوں اور آلات کے لیے اس کے پاس کیا تیار ہونا چاہیے، اور پھوڑے کے کھلنے کے بعد کیا کرنا چاہیے"
  tr: "Yirmi altıncı bölümde İbn Sina, ördekleri tartışır; kesildikleri yönden, yarasanın anatomi yoluyla bilgisinden, gerekli önleyici ilaçlar ve araçlardan ve ördeklerde apse oluştuğunda ne yapılması gerektiğinden bahseder {cite:canon-ibn-sina-print-v1 s.305-306}."
  id: "Dalam bab dua puluh enam, Ibn Sina membahas bebek, menyebutkan arah pemotongan, pengetahuan tentang kelelawar melalui anatomi, obat dan alat pencegahan yang diperlukan, serta apa yang harus dilakukan setelah bebek mengalami abses {cite:canon-ibn-sina-print-v1 hlm.305-306}."
