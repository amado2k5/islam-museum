  id: "dana pensiun"
summary:
  ar: 'يعرض المؤلف وجوه المعاش عن ابن خلدون: الجباية أو أخذ المال من يد الغير بالاقتدار، والاصطياد من الوحش والبحر، واستخراج الفضلات من الداجن كاللبن والحرير والعسل، والفلاحة في الزرع والشجر، والصنائع في مواد معينة أو غير معينة، والتجارة بالتقلب في البلاد أو احتكار السلع وترقب الأسواق {cite:usul-iqtisad-islami-0660 p. 55}. ويرى ابن خلدون أن الفلاحة أقدم وجوه المعاش وأنسبها إلى الطبيعة، وأن الصنائع متأخرة عنها وتوجد في الحضر، وأن التجارة فيها تحيّل على فرق الثمن {cite:usul-iqtisad-islami-0660 p. 55}. ويعرض المؤلف هذا التصنيف على أنه وجوه طبيعية للمعاش، ويذكر أن الإمارة ليست مذهبًا طبيعيًّا للمعاش {cite:usul-iqtisad-islami-0660 p. 55}.'
  tr: "Yazar, İbn Haldun'dan geçim kaynaklarının yönlerini sunar: vergilendirme veya başkalarından yetenekle para almak, vahşi hayvanlardan ve denizden avlanmak, kümes hayvanlarından süt, ipek ve bal gibi atıkların çıkarılması, tarlalarda ve ağaçlarda tarım, belirli veya belirtilmemiş malzemelerle el sanatları, ülkede dalgalanmaya dayalı ticaret, malların tekelleşmesi ve pazarları izlemek {cite:usul-iqtisad-islami-0660 s. 55}. İbn Haldun, tarımı en eski ve en uygun geçim kaynağı olarak görür; zanaatların kendilerinden daha geç ve kentsel alanlarda bulunduğunu, ticaretin fiyat farklarına dayandığını belirtir {cite:usul-iqtisad-islami-0660 s. 55}. Yazar bu sınıflandırmayı doğal emeklilik biçimleri olarak sunar ve emirliğin emeklilik doktrini olmadığını belirtir {cite:usul-iqtisad-islami-0660 s. 55}."
  id: "Penulis menyajikan aspek mata pencaharian dari Ibn Khaldun: pajak atau mengambil uang dari orang lain dengan kemampuan, berburu dari hewan liar dan laut, mengekstrak limbah unggas seperti susu, sutra, dan madu, bertani di ladang dan pohon, kerajinan dengan bahan tertentu atau tidak spesifik, perdagangan dengan fluktuasi di dalam negeri, memonopoli barang, dan mengamati pasar {cite:usul-iqtisad-islami-0660 hlm. 55}. Ibn Khaldun menganggap pertanian sebagai bentuk penghidupan tertua dan paling tepat, bahwa kerajinan lebih baru dan ditemukan di daerah perkotaan, dan perdagangan di dalamnya merujuk pada perbedaan harga {cite:usul-iqtisad-islami-0660 hlm. 55}. Penulis menyajikan klasifikasi ini sebagai bentuk pensiun alami, dan menyebutkan bahwa emirat bukanlah doktrin alami pensiun {cite:usul-iqtisad-islami-0660 hlm. 55}."
