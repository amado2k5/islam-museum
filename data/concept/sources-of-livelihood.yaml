label:
  ar: وجوه المعاش
  en: Sources of livelihood
summary:
  ar: 'يعرض المؤلف وجوه المعاش عن ابن خلدون: الجباية أو أخذ المال من يد الغير بالاقتدار، والاصطياد من الوحش والبحر، واستخراج الفضلات من الداجن كاللبن والحرير والعسل، والفلاحة في الزرع والشجر، والصنائع في مواد معينة أو غير معينة، والتجارة بالتقلب في البلاد أو احتكار السلع وترقب الأسواق {cite:usul-iqtisad-islami-0660 p. 55}. ويرى ابن خلدون أن الفلاحة أقدم وجوه المعاش وأنسبها إلى الطبيعة، وأن الصنائع متأخرة عنها وتوجد في الحضر، وأن التجارة فيها تحيّل على فرق الثمن {cite:usul-iqtisad-islami-0660 p. 55}. ويعرض المؤلف هذا التصنيف على أنه وجوه طبيعية للمعاش، ويذكر أن الإمارة ليست مذهبًا طبيعيًّا للمعاش {cite:usul-iqtisad-islami-0660 p. 55}.'
