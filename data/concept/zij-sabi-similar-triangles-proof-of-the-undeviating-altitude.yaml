class: concept
kind: scientific
label: { ar: "برهان المثلثات المتشابهة للارتفاع الذي لا ميل لسمته في الزيج الصابي", en: "The proof of the undeviating altitude by similar triangles", ur: "غیر منحرف ارتفاع کا مشابہ مثلثوں سے ثبوت", es: "La demostración de la altura sin desviaciones mediante triángulos semejantes", fr: "Démonstration de la hauteur invariante par les triangles semblables", tr: "Saba astronomik tablolarında, azimutuna göre eğimi olmayan bir yükseklik için benzer üçgenlerin ispatı.", id: "Bukti adanya segitiga serupa untuk garis tinggi tanpa kemiringan terhadap azimutnya dalam tabel astronomi Sabaean." }
summary:
  ar: "يختم البتاني الباب الثاني عشر ببرهان هندسي على الارتفاع الذي لا ميل لسمته: يخرج من نقطة مرور الشمس عموداً على قطر الأفق هو وتر الارتفاع نصف النهار، ويجعل المثلث القائم الزاوية معلوم الأضلاع وشبيهاً بمثلث آخر، فتتساوى النسب بين أضلاعهما، ثم يضرب ويقسم فيجد وتر الارتفاع المطلوب، فيخرج قوسه في المثال اثنين وأربعين جزءاً واثنتين وثلاثين دقيقة على قراءة المسح. {cite:zij-sabi-nallino-byblion p.42}."
  en: "Al-Battani closes chapter 12 with a geometrical proof of the altitude whose azimuth does not deviate: from the Sun's point he draws a perpendicular on the horizon diameter, the chord of the midday altitude, and makes a right-angled triangle with known sides similar to another, so that the ratios between their sides are equal; he then multiplies and divides to find the chord of the required altitude, whose arc in the example comes out, on the scan's reading, at forty-two degrees thirty-two minutes. {cite:zij-sabi-nallino-byblion p.42}."
  ur: "البتانی بارہویں باب کو غیر منحرف سمت والے ارتفاع کے ایک ہندسی ثبوت پر ختم کرتے ہیں: سورج کے نقطے سے افق کے قطر پر ایک عمود کھینچتے ہیں جو دوپہر کے ارتفاع کا وتر ہے، اور ایک ایسا قائم الزاویہ مثلث بناتے ہیں جس کے اضلاع معلوم ہیں اور جو دوسرے مثلث کے مشابہ ہے، یوں دونوں کے اضلاع کی نسبتیں برابر ہو جاتی ہیں؛ پھر ضرب و تقسیم سے مطلوبہ ارتفاع کا وتر نکلتا ہے جس کی قوس مثال میں مسح کی قراءت کے مطابق بیالیس درجے بتیس دقیقے آتی ہے۔ {cite:zij-sabi-nallino-byblion p.42}۔"
  es: "Al-Battani cierra el capítulo 12 con una demostración geométrica de la altitud cuyo acimut no se desvía: desde el punto del Sol traza una perpendicular al diámetro del horizonte, la cuerda de la altitud del mediodía, y forma un triángulo rectángulo con lados conocidos semejante a otro, de modo que las razones entre sus lados sean iguales; luego multiplica y divide para hallar la cuerda de la altitud requerida, cuyo arco en el ejemplo resulta, según la lectura del escáner, en cuarenta y dos grados treinta y dos minutos. {cite:zij-sabi-nallino-byblion p.42}."
  fr: "Al-Battani conclut le chapitre 12 par une démonstration géométrique de la hauteur dont l'azimut est constant: à partir du point du Soleil, il trace une perpendiculaire sur le diamètre de l'horizon, la corde de la hauteur de midi, et construit un triangle rectangle dont les côtés sont connus et semblables à un autre, de sorte que les rapports entre leurs côtés soient égaux; il effectue ensuite des multiplications et des divisions pour trouver la corde de la hauteur recherchée, dont l'arc, dans l'exemple, correspond, d'après la lecture du scanner, à quarante-deux degrés trente-deux minutes. {cite:zij-sabi-nallino-byblion p.42}."
  tr: "El-Battani, on ikinci bölümü, azimut açısı eğimsiz olan yüksekliğin geometrik bir ispatıyla sonlandırır: Güneşin bir noktanın üzerinden geçtiği noktadan, ufkun çapına dik bir doğru çizilir; bu doğru, öğle vaktindeki yüksekliğin kirişidir. Daha sonra, kenarları bilinen bir dik üçgen, kenarları arasındaki oranlar eşit olacak şekilde başka bir üçgene benzetilir. Ardından, sonuçların çarpılması ve bölünmesi, istenen yüksekliğin kirişini verir. Örnekte, ölçüm okumasına göre yay kırk iki kısım ve otuz iki dakikadır. {cite:zij-sabi-nallino-byblion s.42}."
  id: "Al-Battani menyimpulkan bab kedua belas dengan bukti geometris dari ketinggian yang azimutnya tidak memiliki kemiringan: Dari titik di mana matahari melewati suatu titik, ditarik garis tegak lurus ke diameter cakrawala, yang merupakan tali busur ketinggian pada tengah hari. Sebuah segitiga siku-siku dengan sisi-sisi yang diketahui kemudian dibuat serupa dengan segitiga lain, sehingga perbandingan antara sisi-sisinya sama. Kemudian, mengalikan dan membagi hasilnya menghasilkan tali busur ketinggian yang dibutuhkan. Dalam contoh ini, busurnya adalah empat puluh dua bagian dan tiga puluh dua menit menurut pembacaan survei. {cite:zij-sabi-nallino-byblion p.42}."
