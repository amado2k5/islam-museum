label: { ar: "النوادر والطرائف", en: "Anecdotes and witty tales (nawadir)", ur: "نوادر اور لطائف", fr: "Les anecdotes et traits d’esprit (nawadir)", es: "Las anécdotas y agudezas (nawadir)" }
summary:
  ar: "النادرة في كتب الأدب خبر قصير مضحك أو مستطرف يُروى عن ظريف أو مغفل أو بخيل أو طفيلي، ويجمعها المؤلفون في أبواب أو كتب مفردة. يذكر محقق نوادر جحا الكبرى أن الجاحظ أول من ذكر جحا من المؤلفين العرب، وأن فهرست ابن النديم يسمي كتابا في نوادر جحا بين كتب أخبار المغفلين {cite:juha-nawadir-kubra-djuwaydi p. 4-5}. ويعقد النويري في الجزء الرابع من نهاية الأرب بابا يجمع فيه نوادر الظرفاء والمغفلين والقضاة والنحاة والمغنين، ومنها أخبار أشعب {cite:nihayat-al-arab-nuwayri-vol4-scan p. 27-29}."
  en: "In the books of adab a nadira is a short funny or striking report told of a wit, a fool, a miser or a party-crasher, gathered by authors into chapters or whole books. The editor of Nawadir Juha al-Kubra records that al-Jahiz was the first Arab author to mention Juha and that Ibn al-Nadim's Fihrist names a book of Juha's anecdotes among the books on fools {cite:juha-nawadir-kubra-djuwaydi p. 4-5}. In volume 4 of Nihayat al-Arab al-Nuwayri gives a chapter to the anecdotes of wits, fools, judges, grammarians and singers, among them the reports of Ash'ab {cite:nihayat-al-arab-nuwayri-vol4-scan p. 27-29}."
  ur: "کتبِ ادب میں نادرہ ایک مختصر مضحک یا انوکھی خبر ہے جو کسی ظریف، مغفل، بخیل یا طفیلی سے منسوب ہو، اور مصنفین اسے ابواب یا مستقل کتابوں میں جمع کرتے ہیں۔ نوادر جحا الکبریٰ کے مرتب لکھتے ہیں کہ عرب مصنفین میں جاحظ نے سب سے پہلے جحا کا ذکر کیا، اور ابن الندیم کی الفہرست مغفلوں کی کتابوں میں نوادرِ جحا کی ایک کتاب کا نام لیتی ہے {cite:juha-nawadir-kubra-djuwaydi p. 4-5}۔ نویری نہایۃ الارب کی چوتھی جلد میں ظریفوں، مغفلوں، قاضیوں، نحویوں اور مغنیوں کے نوادر کا ایک باب باندھتے ہیں، جن میں اشعب کی خبریں بھی ہیں {cite:nihayat-al-arab-nuwayri-vol4-scan p. 27-29}۔"
  fr: "Dans les livres d'adab, une nadira est un court récit drôle ou piquant rapporté d'un bel esprit, d'un sot, d'un avare ou d'un pique-assiette, que les auteurs réunissent en chapitres ou en livres entiers. L'éditeur des Nawadir Juha al-Kubra note qu'al-Jahiz fut le premier auteur arabe à mentionner Juha et que le Fihrist d'Ibn al-Nadim nomme un livre des anecdotes de Juha parmi les livres sur les sots {cite:juha-nawadir-kubra-djuwaydi p. 4-5}. Au volume 4 de la Nihayat al-Arab, al-Nuwayri consacre un chapitre aux anecdotes des beaux esprits, des sots, des juges, des grammairiens et des chanteurs, dont les récits d'Ash'ab {cite:nihayat-al-arab-nuwayri-vol4-scan p. 27-29}."
  es: "En los libros de adab una nadira es un relato breve, gracioso o llamativo, contado de un ingenioso, un necio, un avaro o un gorrón, que los autores reúnen en capítulos o en libros enteros. El editor de Nawadir Juha al-Kubra señala que al-Jahiz fue el primer autor árabe en mencionar a Juha y que el Fihrist de Ibn al-Nadim nombra un libro de anécdotas de Juha entre los libros sobre necios {cite:juha-nawadir-kubra-djuwaydi p. 4-5}. En el volumen 4 de Nihayat al-Arab, al-Nuwayri dedica un capítulo a las anécdotas de ingeniosos, necios, jueces, gramáticos y cantores, entre ellas los relatos de Ash'ab {cite:nihayat-al-arab-nuwayri-vol4-scan p. 27-29}."
