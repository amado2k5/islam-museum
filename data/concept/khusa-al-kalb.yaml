summary:
  ar: "خصى الكلب في الكتاب نبات شبيه بنبات خصى الثعلب حتى اشتبه على قوم الفرق بينهما، وهما قريبا الأفعال، وهو صنفان أحدهما أصغر وهو زوجان زوج تحت وزوج فوق أحدهما رخو والآخر ممتلئ ونوع آخر أعظم، وفي النوع العظيم رطوبة فضلية، يحلل الأورام البلغمية وينقي القروح ويمنع النملة أن تنتشر ويفتح النواصير ويدمل القروح الخبيثة والمتأكلة وينفع من القلاع، ويذكر الكتاب فيه أقوالا عن الإنجاب والباه في فقرة موسومة معلقة لحكم المؤسس {cite:canon-ibn-sina-print-v1 p.703}"
  en: "Khusa al-kalb is in the book a plant like the plant of khusa al-tha'lab, so that some people were confused about the difference between them, the two being near in actions; it is of two kinds, one smaller, a pair, one below and one above, the one soft and the other full, and another larger kind; in the large kind there is a superfluous moisture; it dissolves phlegmatic swellings, cleanses ulcers, keeps erysipelas from spreading, opens fistulas, heals malignant and eating ulcers and benefits thrush; the book gives statements on begetting and desire in a labelled section held for the founder's ruling {cite:canon-ibn-sina-print-v1 p.703}"
  ur: "خصی الکلب کتاب میں ایک نبات ہے جو خصی الثعلب کے نبات سے مشابہ ہے یہاں تک کہ کچھ لوگوں کو دونوں کے فرق میں اشتباہ ہوا، اور دونوں افعال میں قریب ہیں؛ یہ دو قسموں کا ہے، ایک چھوٹا، جوڑا، ایک نیچے اور ایک اوپر، ایک نرم اور دوسرا بھرا ہوا، اور ایک اور بڑی قسم؛ بڑی قسم میں فاضل رطوبت ہے؛ بلغمی ورموں کو تحلیل کرتا ہے، قرحوں کو صاف کرتا ہے، نملہ کو پھیلنے سے روکتا ہے، ناسوروں کو کھولتا ہے، خبیث اور کھانے والے قرحوں کو بھرتا ہے اور قلاع میں نافع ہے؛ کتاب اولاد اور باہ کے بارے میں باتیں موسوم حصے میں دیتی ہے جو بانی کے فیصلے کے لیے موقوف ہے {cite:canon-ibn-sina-print-v1 p.703}۔"
