label:
  ar: "خصى الكلب"
  en: "Khusa al-kalb"
  ur: "خصی الکلب"
  es: "Khusa al-kalb"
  fr: "Khusa al-kalb"
  tr: "köpek testisi"
  id: "testis anjing"
summary:
  ar: "خصى الكلب في الكتاب نبات شبيه بنبات خصى الثعلب حتى اشتبه على قوم الفرق بينهما، وهما قريبا الأفعال، وهو صنفان أحدهما أصغر وهو زوجان زوج تحت وزوج فوق أحدهما رخو والآخر ممتلئ ونوع آخر أعظم، وفي النوع العظيم رطوبة فضلية، يحلل الأورام البلغمية وينقي القروح ويمنع النملة أن تنتشر ويفتح النواصير ويدمل القروح الخبيثة والمتأكلة وينفع من القلاع، ويذكر الكتاب فيه أقوالا عن الإنجاب والباه في فقرة موسومة معلقة لحكم المؤسس {cite:canon-ibn-sina-print-v1 p.703}"
  en: "Khusa al-kalb is in the book a plant like the plant of khusa al-tha'lab, so that some people were confused about the difference between them, the two being near in actions; it is of two kinds, one smaller, a pair, one below and one above, the one soft and the other full, and another larger kind; in the large kind there is a superfluous moisture; it dissolves phlegmatic swellings, cleanses ulcers, keeps erysipelas from spreading, opens fistulas, heals malignant and eating ulcers and benefits thrush; the book gives statements on begetting and desire in a labelled section held for the founder's ruling {cite:canon-ibn-sina-print-v1 p.703}"
  ur: "خصی الکلب کتاب میں ایک نبات ہے جو خصی الثعلب کے نبات سے مشابہ ہے یہاں تک کہ کچھ لوگوں کو دونوں کے فرق میں اشتباہ ہوا، اور دونوں افعال میں قریب ہیں؛ یہ دو قسموں کا ہے، ایک چھوٹا، جوڑا، ایک نیچے اور ایک اوپر، ایک نرم اور دوسرا بھرا ہوا، اور ایک اور بڑی قسم؛ بڑی قسم میں فاضل رطوبت ہے؛ بلغمی ورموں کو تحلیل کرتا ہے، قرحوں کو صاف کرتا ہے، نملہ کو پھیلنے سے روکتا ہے، ناسوروں کو کھولتا ہے، خبیث اور کھانے والے قرحوں کو بھرتا ہے اور قلاع میں نافع ہے؛ کتاب اولاد اور باہ کے بارے میں باتیں موسوم حصے میں دیتی ہے جو بانی کے فیصلے کے لیے موقوف ہے {cite:canon-ibn-sina-print-v1 p.703}۔"
  es: "En el libro, Khusa al-kalb es una planta similar a Khusa al-tha'lab, lo que causó confusión entre algunas personas, ya que sus efectos son parecidos. Existen dos variedades: una más pequeña, una doble, una inferior y otra superior, una suave y la otra carnosa, y otra más grande. Esta última posee un exceso de humedad. Disuelve las inflamaciones, limpia las úlceras, previene la propagación de la erisipela, abre las fístulas, cura las úlceras malignas y viscerales y beneficia a quienes padecen candidiasis. El libro incluye declaraciones sobre la procreación y el deseo en una sección específica reservada para la decisión del fundador {cite:canon-ibn-sina-print-v1 p.703}."
  fr: "Dans le livre, Khusa al-kalb est une plante semblable à Khusa al-tha'lab, ce qui a parfois semé la confusion quant à leur différence, leurs actions étant proches. Il en existe deux sortes: une plus petite, par paire, l'une au-dessus et l'autre en dessous, l'une molle et l'autre pleine, et une autre plus grande, cette dernière présentant une humidité excessive. Elle dissout les gonflements phlegmatiques, purifie les ulcères, empêche la propagation de l'érysipèle, ouvre les fistules, guérit les ulcères malins et purulents et est bénéfique en cas de muguet. Le livre contient des déclarations sur la procréation et le désir dans une section intitulée réservée à l'avis du fondateur. {cite:canon-ibn-sina-print-v1 p.703}"
  tr: "Kitaptaki köpeğin hadım edilmesi, tilkinin hadımına benzer bir bitkidir; bazı kişiler aralarındaki ayrımı karıştırmıştır ve fiiller birbirine yakındır. İki tipi vardır: biri daha küçük, aşağıda iki çift ve yukarıda bir çift, biri gevşek, diğeri dolgun, diğeri ise daha büyüktür. Büyük tip fazla nem içerir, flegmatik tümörleri analiz eder, ülserleri arındırır, karıncaların yayılmasını engeller, folikülleri açar, kötü huylu ve aşındırıcı yaraları iyileştirir ve kalelerden faydalanır. Kitap, 'Kurucu Kuralına Asmak' başlıklı bölümde doğum ve pah ile ilgili ifadelerden bahseder {cite:canon-ibn-sina-print-v1 s.703}"
  id: "Kastrasi anjing dalam buku adalah tanaman yang mirip dengan kasim rubah, sampai-sampai beberapa orang membingungkan perbedaan antara keduanya, dan keduanya mirip dalam kata kerja. Ada dua jenis: satu lebih kecil, dua pasang di bawah, satu pasang di atas, satu longgar dan satu penuh, dan yang lain lebih besar. Tipe besar mengandung kelembapan berlebih, menganalisis tumor flegmatik, memurnikan borok, mencegah semut menyebar, membuka folikel, menyembuhkan luka ganas dan korosif, dan mendapat manfaat dari benteng. Buku ini menyebutkan pernyataan tentang persalinan dan pah dalam bagian berjudul 'Bergantung pada Aturan Pendiri' {cite:canon-ibn-sina-print-v1 hlm.703}"
