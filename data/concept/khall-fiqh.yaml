id: concept/khall-fiqh
class: concept
kind: term
label:
  ar: الخل
  en: 'Khall (vinegar: ruling, purity and sale)'
  ur: خل ⁦(سرکہ)⁩
  es: "Khall (vinagre: gobierno, pureza y venta)"
  fr: "Khall (vinaigre: règle, pureté et vente)"
  tr: "sirke"
  id: "cuka"
summary:
  ar: 'الخل مال متقوم طاهر يحل أكله والمعاملة به، وهو من الخمر إذا تخللت بنفسها؛ والحديث «نعم الأدم الخل». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7783}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7784} التخليل: إن تخللت الخمر بنفسها فحلال باتفاق؛ وإذا خللت بالعلاج: الشافعية والحنابلة ورواية عن مالك لا يحل ولا تطهر بالتخليل، لحديث أبي طلحة في أن يهرقها؛ والحنفية والراجح عند المالكية يجيزونه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7784}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7785} أكل الخل وشربه حلال باتفاق؛ ودود الخل يؤكل معه لعسر تمييزه، ويحرم أكله منفردا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7785} الطهارة بالخل: لا تجوز إزالة الحدث الأصغر أو الأكبر به، لأنه ليس ماء مطلقا؛ وجمهور الفقهاء لا تزال به النجاسة؛ وأبو حنيفة وأبو يوسف ورواية عند الحنابلة يجيزونه، لحديث عائشة في قصع الدم بالظفر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7785}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7786} بيع الخل: لا يجوز بيع خل من جنس واحد متفاضلا أو نسيئة لأنه ربوي؛ والحنفية والشافعية والحنابلة في الصحيح يجيزون بيع الخلول من أنواع مختلفة متفاضلا؛ والحنابلة يستثنون خل العنب بخل الزبيب؛ والمالكية يعدون الخلول كلها جنسا واحدا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7786}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7787}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7787}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7788} الغصب والإتلاف: يجب الضمان على من غصب خلا أو أتلفه؛ ولو غصب خمرا فتخللت عند الغاصب يرد إلى المالك عند الحنفية والمالكية والحنابلة والشافعية في الأصح؛ وإذا خللها الغاصب بمال له قيمة فعند أبي حنيفة الخل للغاصب، وعند أبي يوسف ومحمد للمالك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7788} غصب العصير فتخمر: الجمهور يوجبون رد مثله لأنه صار كالتالف؛ وإذا تخلل بعد التخمر فالحنابلة والشافعية في الأصح يرد الخل وما نقص؛ والمالكية يخيرون مالكه بين عصير مثله وأخذه خلا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7788}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7789}'
  en: 'Vinegar is valuable clean property, lawful to eat and to trade, and it may come from wine; the report says "vinegar is a good condiment". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7783}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7784} Turning wine into vinegar: if it turns naturally, it is lawful by agreement; by treatment (onion, salt, fire), the Shafiis, Hanbalis and one Maliki report forbid it, citing the report of Abu Talha on whether to pour it out, while the Hanafis and the preferred Maliki view allow it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7784}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7785} Eating and drinking vinegar is lawful by agreement; the worms in it may be eaten with it, though eating them alone is forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7785} Purity by vinegar: it may not replace water for lesser or greater impurity, since it is not pure water; most jurists do not clean impurity with it, while Abu Hanifa, Abu Yusuf and one Hanbali view allow it, on the report of Aisha rubbing blood with the nail. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7785}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7786} Sale of vinegar: the same kind may not be exchanged unequally or deferred, being a usury good; the Hanafis, Shafiis and Hanbalis in the sounder view allow exchange of different kinds unequally; the Hanbalis except grape vinegar against raisin vinegar; the Malikis count all vinegars as one kind. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7786}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7787}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7787}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7788} Seizure and destruction: whoever seizes or destroys vinegar must pay; if a usurper turns seized wine into vinegar, it returns to the owner by the Hanafis, Malikis, Hanbalis and the sounder Shafii view; if the usurper treats it with valuable salt, Abu Hanifa gives the vinegar to him, while Abu Yusuf and Muhammad give it to the owner. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7788} Seizing juice that turned to wine: most jurists require the like; if it turned to vinegar after fermentation, the Hanbalis and the sounder Shafii view return it with the loss, and the Malikis let the owner take juice of the like or the vinegar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7788}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7789}'
  ur: 'خل متقوم اور پاک مال ہے، اس کا کھانا اور اس سے معاملہ جائز ہے؛ شراب خود بخود سرکہ بن جائے تو وہی خل ہے؛ حدیث «نعم الأدم الخل» اس کی دلیل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7783}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7784} تخلیل: اگر شراب خود سرکہ بن جائے تو بالاتفاق حلال؛ علاج ⁦(پیاز، نمک، آگ)⁩ سے سرکہ بنایا جائے تو شافعیہ، حنابلہ اور مالکیہ کا ایک قول ناجائز اور پاک نہیں، ابو طلحہ کی حدیث سے استدلال؛ حنفیہ اور مالکیہ کے راجح قول میں جائز۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7784}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7785} خل کھانا پینا بالاتفاق حلال؛ اس کے کیڑے ساتھ کھائے جا سکتے ہیں، الگ کھانا حرام۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7785} خل سے طہارت: حدث اصغر یا اکبر کو خل سے دور نہیں کیا جا سکتا کیونکہ وہ مطلق پانی نہیں؛ جمہور نجاست بھی خل سے دور نہیں کرتے، ابو حنیفہ، ابو یوسف اور حنابلہ کی ایک روایت جائز کہتے ہیں، عائشہ کی حدیث ⁦(ناخن سے خون کھرچنے)⁩ سے استدلال۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7785}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7786} بیع: ایک جنس کا خل زیادہ یا ادھار بیچنا جائز نہیں کیونکہ یہ ربوی ہے؛ حنفیہ، شافعیہ اور حنابلہ کے صحیح قول میں مختلف اقسام کا خل کم بیشی سے بیچنا جائز؛ حنابلہ انگور کے خل کو کشمش کے خل کے بدلے ممنوع کہتے ہیں؛ مالکیہ سب خلوں کو ایک جنس مانتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7786}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7787}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7787}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7788} غصب اور تلف: خل غصب یا تلف کرنے والا ضامن ہے؛ شراب غصب کر کے اس کا سرکہ بن جائے تو حنفیہ، مالکیہ، حنابلہ اور شافعیہ کے اصح قول میں مالک کو واپس؛ غاصب نے قیمتی نمک ڈال کر سرکہ بنایا تو ابو حنیفہ کے نزدیک سرکہ غاصب کا، ابو یوسف اور محمد کے نزدیک مالک کا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7788} انگور کا رس غصب کیا جو شراب بن گیا: جمہور مثل واجب کرتے ہیں؛ اور شراب کے بعد سرکہ بن جائے تو حنابلہ اور شافعیہ کے اصح قول میں سرکہ اور کمی واپس؛ مالکیہ مالک کو اختیار دیتے ہیں کہ اسی طرح کا رس لے یا سرکہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7788}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7789}'
  es: "El vinagre es una propiedad limpia y valiosa, lícita para comer y para comerciar, y puede provenir del vino; el informe dice \"el vinagre es un buen condimento\". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7783}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7784} Convertir el vino en vinagre: si se convierte naturalmente, es lícito por acuerdo; por tratamiento (cebolla, sal, fuego), los shafiíes, los hanbalíes y un informe malikí lo prohíben, citando el informe de Abu Talha sobre si se debe verter, mientras que los hanafíes y la opinión malikí preferida lo permiten. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7784}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7785} Comer y beber vinagre es lícito por acuerdo; Los gusanos que contiene pueden comerse con él, aunque comerlos solos está prohibido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7785} Pureza por vinagre: no puede reemplazar el agua para impurezas menores o mayores, ya que no es agua pura; la mayoría de los juristas no limpian la impureza con él, mientras que Abu Hanifa, Abu Yusuf y una opinión hanbalí lo permiten, en el relato de Aisha frotando sangre con la uña. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7785}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7786} Venta de vinagre: el mismo tipo no puede intercambiarse de manera desigual ni diferirse, siendo un bien usurario; los hanafíes, shafiíes y hanbalíes en la opinión más sólida permiten el intercambio de diferentes tipos de manera desigual; los hanbalíes exceptúan el vinagre de uva contra el vinagre de pasas; Los malikíes consideran todos los vinagres como un solo tipo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7786}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7787}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7787}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7788} Apoderamiento y destrucción: quien se apodere o destruya vinagre debe pagar; si un usurpador convierte el vino apoderado en vinagre, este regresa al propietario según la visión de los hanafíes, malikíes, hanbalíes y shafiíes más sólida; si el usurpador lo trata con sal valiosa, Abu Hanifa le da el vinagre, mientras que Abu Yusuf y Muhammad se lo dan al propietario. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7788} Confiscar el jugo que se convirtió en vino: la mayoría de los juristas exigen lo mismo; si se convirtió en vinagre después de la fermentación, los hanbalíes y la opinión shafií más sólida lo devuelven con la pérdida, y los malikíes permiten que el propietario se quede con el jugo de lo mismo o con el vinagre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7788}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7789}"
  fr: "Le vinaigre est une marchandise précieuse et pure, licite à consommer et à commercialiser, et peut provenir du vin; le hadith dit que « le vinaigre est un bon condiment ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7783}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7784} Transformer le vin en vinaigre: si la transformation est naturelle, elle est licite par convention; par traitement (oignon, sel, feu), les écoles chaféite, hanbalite et une école malikite l’interdisent, citant le hadith d’Abu Talha sur la question de savoir s’il faut le verser, tandis que les écoles hanafite et l’avis malikite prédominant l’autorisent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7784}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7785} Consommer du vinaigre est licite par convention. Les vers qu'il contient peuvent être consommés avec, bien que leur consommation seule soit interdite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7785} Purification par le vinaigre: il ne peut remplacer l'eau pour purifier une impureté, qu'elle soit moindre ou plus grande, car il ne s'agit pas d'eau pure; la plupart des juristes ne l'utilisent pas pour purifier une impureté, tandis qu'Abou Hanifa, Abou Yusuf et une opinion hanbalite l'autorisent, se fondant sur le récit d'Aïcha frottant du sang avec son ongle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7785}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7786} Vente de vinaigre: il est interdit d'échanger ou de différer un même type de vinaigre, car il s'agit d'un bien usuraire; les hanafites, les chaféites et les hanbalites, dans leur avis le plus solide, autorisent l'échange inégal de types différents; les hanbalites font exception pour le vinaigre de raisin contre le vinaigre de raisin sec. Les Malikites considèrent tous les vinaigres comme une seule et même catégorie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7786}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7787}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7787}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7788} Saisie et destruction: quiconque s’empare du vinaigre ou le détruit doit payer une amende; si un usurpateur transforme du vin saisi en vinaigre, celui-ci est restitué à son propriétaire selon les écoles hanafite, malikite, hanbalite et shafi'ite, considérée comme la plus solide; si l’usurpateur le traite avec du sel précieux, Abou Hanifa lui rend le vinaigre, tandis qu’Abou Yusuf et Muhammad le rendent à son propriétaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7788} Saisie du jus transformé en vin: la plupart des juristes exigent la restitution du jus transformé en vin; s’il s’est transformé en vinaigre après fermentation, les Hanbalites et l’avis plus solide des Shafi’ites préconisent sa restitution avec déduction pour perte, tandis que les Malikites autorisent le propriétaire à prendre soit le jus transformé en vin, soit le vinaigre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7788}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7789}"
  tr: "Sirke, yenmesi ve kullanılması caiz olan saf ve stabil bir yiyecektir. Kendi başına içilirse şarap olarak kabul edilir; ve hadis: 'İnna Adem sirkedir.' {alıntı:fiqh-mawsua-kuveytiyya-noor-v3 s.7783} {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7784} Turşulama: Şarap kendisiyle karıştırılırsa oybirliğiyle izinlidir; ve eğer işlenmiş olarak karıştırılırsa: Şafi'ler, Hanbaliler ve Malik'ten bir rivayet, ne izin verilebilir ne de turşu ile arındırılır; Ebu Talhah'ın yakma hadisine dayanarak; ve Hanefiler ile Malikiler arasında tercih edilen görüş buna izin verir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7785} Sirke yemek ve içmek oybirliğiyle izinlidir; ayırt etmenin zorluğu nedeniyle sirke kurtları da yenir ve tek başına yemek yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7785} Sirke ile arıtma: Küçük veya büyük kirliliğin bu sirkeyle çıkarılması yasaktır, çünkü bu tamamen su değildir; çoğu hukukçu hala kirliliğe sahiptir; Abu Hanifa, Abu Yusuf ve Hanbaliler arasında bir rivayet, Aisha'nın tırnaklı kan kasesi hakkındaki hadisine dayanarak buna izin vermektedir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7785} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7786} Sirke satışı: Aynı türden, ister farklılaştırılmış ister nisā'ī ile olsun, sirke satılması yasaktır çünkü bu tefeciliktir; Sahih'teki Hanefi, Şafii ve Hanbali okulları farklı türlerde sirke satışına izin verir; Hanbaliler üzüm sirkesini kuru üzüm sirkesinden hariç tutar; Malikiler ise tüm sirkeyi aynı tür olarak kabul eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7787} {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 s. 7788} Gasp ve yok etme: Şarabı gasp eden veya yok eden kişiye sorumluluk yükümlüdür; eğer şarap gasp ettiyse ve gaspçı tarafından geçirgen hale geldiyse, en doğru görüşe göre Hanefi, Maliki, Hanbeli ve Şafi'lere göre en doğru görüşe göre sahibine iade edilir; eğer gaspçı değerli mülkle onu rahatsız ettiyse, Ebu Hanifa'ya göre sirke gaspçıya, Abu Yusuf ve Muhammed'e göre ise sahibine aittir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7788} Suyun gaspı ve fermentasyonu: Çoğu suyu geri vermeyi gerektirir çünkü hasar görmüştür; fermantasyondan sonra geçirgen hale gelirse, Hanbalılar ve Şafiiler sirkenin geri verildiği ve eksik olanı geri verdiği konusunda daha doğru görüştedir; Malikiler sahibine onun gibi meyve suyu ile sirke olarak almak arasında seçim hakkı verir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7788} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7789}"
  id: "Cuka adalah makanan murni dan stabil yang diperbolehkan dimakan dan digunakan bersama. Cuka dianggap sebagai anggur jika diminum sendiri; dan hadits: 'Inna Adam adalah cuka.' {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7783} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7784} Acar: Jika anggur dicampur dengan dirinya sendiri, maka secara bulat diperbolehkan; dan jika dicampur dengan perlakuan: Shafi'i dan Hanbalis serta narasi dari Malik bahwa anggur itu tidak diperbolehkan atau dimurnikan dengan acar, berdasarkan hadis Abu Talhah tentang pembakarannya; dan Hanafi serta pandangan yang disukai di kalangan Malikis mengizinkannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7785} Makan dan minum cuka diperbolehkan secara bulat; cacing cuka dimakan bersamaan karena sulit membedakannya, dan memakannya saja dilarang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7785} Pemurnian dengan cuka: Tidak diperbolehkan menghilangkan kotoran kecil atau besar bersamanya, karena itu bukan air sama sekali; mayoritas ahli hukum masih memiliki kekotoran; Abu Hanifa, Abu Yusuf, dan sebuah riwayat di antara Hanbalis mengizinkannya, berdasarkan hadits Aisha tentang mangkuk darah dengan kuku. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7785} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7786} Menjual cuka: Tidak diperbolehkan menjual cuka jenis yang sama, baik yang dibedakan maupun dengan nisā'ī, karena itu riba; aliran Hanafi, Shafi'i, dan Hanbali di Sahih mengizinkan penjualan cuka jenis berbeda secara berbeda; Hanbal mengecualikan cuka anggur dari cuka kismis; dan Malili menganggap semua cuka adalah jenis yang sama. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm. 7788} Perampasan dan kehancuran: tanggung jawab wajib diberikan kepada siapa pun yang merebut atau menghancurkannya; jika ia mengambil alih anggur dan menjadi meresap oleh penggantinya, maka anggur itu dikembalikan kepada pemilik sesuai dengan Hanafi, Maliki, Hanbali, dan Shafi'i menurut pendapat yang paling benar; jika perebut kekuasaan mengganggunya dengan harta bernilai, menurut Abu Hanifa, cuka milik pengambil alih, dan menurut Abu Yusuf serta Muhammad milik pemiliknya. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.778} Pengambilalihan jus dan fermentasi: Sebagian besar mengharuskan pengembalian jus yang sama karena telah rusak; jika menjadi permeabel setelah fermentasi, Hanbalis dan Shafi'i berpendapat lebih benar bahwa cuka dikembalikan dan apa yang kurang; Malikis memberi pilihan kepada pemilik antara jus seperti itu dan mengambilnya sebagai cuka. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7788} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7789}"
