id: concept/khall-fiqh
class: concept
kind: term
label:
  ar: الخل
  en: 'Khall (vinegar: ruling, purity and sale)'
  ur: خل (سرکہ)
summary:
  ar: 'الخل مال متقوم طاهر يحل أكله والمعاملة به، وهو من الخمر إذا تخللت بنفسها؛ والحديث «نعم الأدم الخل». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7783}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7784} التخليل: إن تخللت الخمر بنفسها فحلال باتفاق؛ وإذا خللت بالعلاج: الشافعية والحنابلة ورواية عن مالك لا يحل ولا تطهر بالتخليل، لحديث أبي طلحة في أن يهرقها؛ والحنفية والراجح عند المالكية يجيزونه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7784}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7785} أكل الخل وشربه حلال باتفاق؛ ودود الخل يؤكل معه لعسر تمييزه، ويحرم أكله منفردا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7785} الطهارة بالخل: لا تجوز إزالة الحدث الأصغر أو الأكبر به، لأنه ليس ماء مطلقا؛ وجمهور الفقهاء لا تزال به النجاسة؛ وأبو حنيفة وأبو يوسف ورواية عند الحنابلة يجيزونه، لحديث عائشة في قصع الدم بالظفر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7785}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7786} بيع الخل: لا يجوز بيع خل من جنس واحد متفاضلا أو نسيئة لأنه ربوي؛ والحنفية والشافعية والحنابلة في الصحيح يجيزون بيع الخلول من أنواع مختلفة متفاضلا؛ والحنابلة يستثنون خل العنب بخل الزبيب؛ والمالكية يعدون الخلول كلها جنسا واحدا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7786}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7787}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7787}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7788} الغصب والإتلاف: يجب الضمان على من غصب خلا أو أتلفه؛ ولو غصب خمرا فتخللت عند الغاصب يرد إلى المالك عند الحنفية والمالكية والحنابلة والشافعية في الأصح؛ وإذا خللها الغاصب بمال له قيمة فعند أبي حنيفة الخل للغاصب، وعند أبي يوسف ومحمد للمالك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7788} غصب العصير فتخمر: الجمهور يوجبون رد مثله لأنه صار كالتالف؛ وإذا تخلل بعد التخمر فالحنابلة والشافعية في الأصح يرد الخل وما نقص؛ والمالكية يخيرون مالكه بين عصير مثله وأخذه خلا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7788}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7789}'
  en: 'Vinegar is valuable clean property, lawful to eat and to trade, and it may come from wine; the report says "vinegar is a good condiment". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7783}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7784} Turning wine into vinegar: if it turns naturally, it is lawful by agreement; by treatment (onion, salt, fire), the Shafiis, Hanbalis and one Maliki report forbid it, citing the report of Abu Talha on whether to pour it out, while the Hanafis and the preferred Maliki view allow it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7784}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7785} Eating and drinking vinegar is lawful by agreement; the worms in it may be eaten with it, though eating them alone is forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7785} Purity by vinegar: it may not replace water for lesser or greater impurity, since it is not pure water; most jurists do not clean impurity with it, while Abu Hanifa, Abu Yusuf and one Hanbali view allow it, on the report of Aisha rubbing blood with the nail. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7785}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7786} Sale of vinegar: the same kind may not be exchanged unequally or deferred, being a usury good; the Hanafis, Shafiis and Hanbalis in the sounder view allow exchange of different kinds unequally; the Hanbalis except grape vinegar against raisin vinegar; the Malikis count all vinegars as one kind. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7786}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7787}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7787}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7788} Seizure and destruction: whoever seizes or destroys vinegar must pay; if a usurper turns seized wine into vinegar, it returns to the owner by the Hanafis, Malikis, Hanbalis and the sounder Shafii view; if the usurper treats it with valuable salt, Abu Hanifa gives the vinegar to him, while Abu Yusuf and Muhammad give it to the owner. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7788} Seizing juice that turned to wine: most jurists require the like; if it turned to vinegar after fermentation, the Hanbalis and the sounder Shafii view return it with the loss, and the Malikis let the owner take juice of the like or the vinegar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7788}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7789}'
  ur: 'خل متقوم اور پاک مال ہے، اس کا کھانا اور اس سے معاملہ جائز ہے؛ شراب خود بخود سرکہ بن جائے تو وہی خل ہے؛ حدیث «نعم الأدم الخل» اس کی دلیل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7783}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7784} تخلیل: اگر شراب خود سرکہ بن جائے تو بالاتفاق حلال؛ علاج (پیاز، نمک، آگ) سے سرکہ بنایا جائے تو شافعیہ، حنابلہ اور مالکیہ کا ایک قول ناجائز اور پاک نہیں، ابو طلحہ کی حدیث سے استدلال؛ حنفیہ اور مالکیہ کے راجح قول میں جائز۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7784}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7785} خل کھانا پینا بالاتفاق حلال؛ اس کے کیڑے ساتھ کھائے جا سکتے ہیں، الگ کھانا حرام۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7785} خل سے طہارت: حدث اصغر یا اکبر کو خل سے دور نہیں کیا جا سکتا کیونکہ وہ مطلق پانی نہیں؛ جمہور نجاست بھی خل سے دور نہیں کرتے، ابو حنیفہ، ابو یوسف اور حنابلہ کی ایک روایت جائز کہتے ہیں، عائشہ کی حدیث (ناخن سے خون کھرچنے) سے استدلال۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7785}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7786} بیع: ایک جنس کا خل زیادہ یا ادھار بیچنا جائز نہیں کیونکہ یہ ربوی ہے؛ حنفیہ، شافعیہ اور حنابلہ کے صحیح قول میں مختلف اقسام کا خل کم بیشی سے بیچنا جائز؛ حنابلہ انگور کے خل کو کشمش کے خل کے بدلے ممنوع کہتے ہیں؛ مالکیہ سب خلوں کو ایک جنس مانتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7786}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7787}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7787}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7788} غصب اور تلف: خل غصب یا تلف کرنے والا ضامن ہے؛ شراب غصب کر کے اس کا سرکہ بن جائے تو حنفیہ، مالکیہ، حنابلہ اور شافعیہ کے اصح قول میں مالک کو واپس؛ غاصب نے قیمتی نمک ڈال کر سرکہ بنایا تو ابو حنیفہ کے نزدیک سرکہ غاصب کا، ابو یوسف اور محمد کے نزدیک مالک کا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7788} انگور کا رس غصب کیا جو شراب بن گیا: جمہور مثل واجب کرتے ہیں؛ اور شراب کے بعد سرکہ بن جائے تو حنابلہ اور شافعیہ کے اصح قول میں سرکہ اور کمی واپس؛ مالکیہ مالک کو اختیار دیتے ہیں کہ اسی طرح کا رس لے یا سرکہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7788}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7789}'
