summary:
  ar: "نبات ساحلي يغطيه ماء البحر إذا فاض، يتغير لونه ثلاث مرات في النهار، وأصله الأبيض يسخّن اللسان، ويُذكر أنه مُسهل للبطن والبول، ويُتخذ لدفع ضرر السموم."
