summary:
  ar: "المداد معروف عند ابن سينا، أجوده أخفه وزناً وأحلكه سواداً، حار مجفف كله إلا الهندي الذي عده الهند وبولس من المبردات {cite:canon-ibn-sina-print-v1 p.563}."
  en: "Midad, ink, is called well known; the best is the lightest in weight and the blackest, hot and drying in all kinds except the Indian, which the Indians and Paulus count among the coolers {cite:canon-ibn-sina-print-v1 p.563}."
  ur: "مداد کو کتاب معروف کہتی ہے؛ بہترین وہ ہے جو وزن میں ہلکا اور سب سے زیادہ سیاہ ہو؛ سب قسمیں گرم اور خشک کرنے والی ہیں سوائے ہندی کے، جسے اہلِ ہند اور بولس ٹھنڈا کرنے والوں میں شمار کرتے ہیں {cite:canon-ibn-sina-print-v1 p.563}۔"
  es: "Midad, tinta, es llamada bien conocida; la mejor es la más ligera en peso y la más negra, caliente y secante en todos los tipos excepto la india, que los indios y Paulus cuentan entre las más frescas {cite:canon-ibn-sina-print-v1 p.563}."
  fr: "Midad, l'encre, est bien connue; la meilleure est la plus légère et la plus noire, chaude et siccante dans toutes sortes sauf l'Indienne, que les Indiens et Paulus comptent parmi les plus fraîches {cite:canon-ibn-sina-print-v1 p.563}."
  tr: "Mürekkep İbn Sina arasında bilinir; ağırlığı daha iyi, daha hafif ve daha siyah, sıcak ve kurudur, ancak Hindistan ve Paul'un soğutucular arasında saydığı Hint tipi hariç {atıf:kanon-ibn-sina-print-v1 s.563}."
  id: "Tinta dikenal di kalangan Ibn Sina; beratnya lebih baik, lebih ringan, dan lebih hitam, panas, dan kering, kecuali tipe India, yang dianggap India dan Paul sebagai salah satu pendingin {cite:canon-ibn-sina-print-v1 hlm.563}."
