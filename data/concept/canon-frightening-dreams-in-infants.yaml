summary:
  ar: "يعلل ابن سينا أحلام الصبي المفزعة بامتلائه لشدة نهمته، إذ يتأذى القوة المصورة والمخيلة من أذى المعدة بالطعام الفاسد فتمثل أحلاماً هائلة، وينصح ألا ينوم على كظة وأن يلعق العسل {cite:canon-ibn-sina-print-v1 p.219}."
  en: "Ibn Sina explains a child's frightening dreams as coming from its fullness through greed: when food spoils and the stomach feels it, the harm passes to the moulding and imaginative powers, which show terrible dreams; he advises not putting it to sleep on a full stomach and giving honey to lick {cite:canon-ibn-sina-print-v1 p.219}."
