perspectives:
  - tradition: sunni
    id: sunni-sharawi-gradual-divorce
    stance: { en: "Divorce in two steps leaves room to correct the first", ar: "الطلاق مرةً ومرتين يترك مجالاً لتدارك الخطأ" }
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      en: "Sha'rawi explains that the law of divorce in two steps lets a couple who failed the first time succeed in the second, and so Allah, who knows human nature, gave a period of time to amend the first mistake {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1003}."
      ar: "يبيّن الشعراوي أن تشريع الطلاق مرتين يتيح لمن لم يُصلح الأمر في المرة الأولى أن يُصلحه في الثانية، وأن الله أعطى فسحة من الوقت لتدارك الخطأ الأول {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1003}."
    sources: [source/tafsir-sharawi-khawatir-scan-vol-2]
  - tradition: sunni
    id: sunni-sharawi-relatives-must-not-block
    stance: { en: "Relatives must not stand in the way of a return both spouses accept", ar: "لا يحق للأهل الوقوف في وجه رجوع يتراضى عليه الزوجان" }
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      en: "Sha'rawi reads the phrase 'when they agree among themselves in what is fair' as requiring the wife's consent to a return, and warns relatives who obstruct a reconciliation that they block a lawful return {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1003} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1004}."
      ar: "يقرأ الشعراوي عبارة «إذا تراضَوا بينهم بالمعروف» على أنها تشترط رضا المرأة بالرجوع، ويحذّر الأهل الذين يعطّلون الصلح من أنهم يمنعون رجوعاً مشروعاً {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1003} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1004}."
    sources: [source/tafsir-sharawi-khawatir-scan-vol-2]
