label:
  ar: الطلاق
  en: Divorce (talaq)
  ur: طلاق
  es: "Divorcio (talaq)"
  fr: "Divorce (talaq)"
summary:
  ar: "يعرض الشعراوي في تفسير آيات البقرة 228-232 أن الطلاق المتدرج ⁦(مرة ومرتين)⁩ يتيح للزوجين فرصة الإصلاح، وأن الرجوع بعد انقضاء العدة يحتاج إلى عقد ومهر جديدين ورضا المرأة، وأن الأهل لا يحق لهم منع الرجوع إذا تراضى الزوجان {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1003} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1004}."
  en: "In his commentary on al-Baqara 2:228-232, Sha'rawi reads divorce in stages, once and then twice, as giving the couple room to mend; he holds that returning to a wife after the waiting period needs a new contract and a new dower and the woman's consent, and that relatives may not block the return when the spouses agree {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1003} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1004}."
  es: "En su comentario sobre al-Baqara 2:228-232, Sha'rawi interpreta el divorcio en etapas, una vez y luego dos veces, como un espacio para que la pareja se reconcilie; sostiene que regresar con la esposa después del período de espera requiere un nuevo contrato, una nueva dote y el consentimiento de la mujer, y que los parientes no pueden impedir el regreso cuando los cónyuges están de acuerdo {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1003} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1004}."
  fr: "Dans son commentaire sur al-Baqara 2:228-232, Sha'rawi interprète le divorce par étapes, une fois puis deux, comme donnant au couple l'espace nécessaire pour se réconcilier; il soutient que le retour auprès d'une épouse après la période d'attente nécessite un nouveau contrat, une nouvelle dot et le consentement de la femme, et que les proches ne peuvent pas s'opposer au retour lorsque les époux sont d'accord {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1003} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1004}."
  ur: "البقرہ 2:228-232 کی اپنی تفسیر میں، شعراوی نے طلاق کو مرحلہ وار پڑھا ہے، ایک بار پھر دو بار، جوڑے کو اصلاح کے لیے جگہ دینے کے طور پر؛ اس کا خیال ہے کہ عدت کے بعد بیوی کے پاس واپس آنے کے لیے ایک نیا معاہدہ اور نیا مہر اور عورت کی رضامندی کی ضرورت ہے، اور یہ کہ رشتہ دار اس وقت واپسی کو روک نہیں سکتے جب میاں بیوی راضی ہو جائیں"
issue: { ar: "كيف يفهم الشعراوي تدرّج الطلاق ورجوع الزوجين بعد العدة، وما الذي تشترطه الآية للرجوع؟", en: "How does Sha'rawi read the gradual divorce and the return after the waiting period, and what does the verse require for that return?" }
