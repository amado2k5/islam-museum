id: concept/talaq
class: concept
kind: legal
label:
  ar: الطلاق
  en: Divorce (talaq)
  ur: طلاق
summary:
  ar: "يعرض الشعراوي في تفسير آيات البقرة 228-232 أن الطلاق المتدرج (مرة ومرتين) يتيح للزوجين فرصة الإصلاح، وأن الرجوع بعد انقضاء العدة يحتاج إلى عقد ومهر جديدين ورضا المرأة، وأن الأهل لا يحق لهم منع الرجوع إذا تراضى الزوجان {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1003} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1004}."
  en: "In his commentary on al-Baqara 2:228-232, Sha'rawi reads divorce in stages, once and then twice, as giving the couple room to mend; he holds that returning to a wife after the waiting period needs a new contract and a new dower and the woman's consent, and that relatives may not block the return when the spouses agree {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1003} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1004}."
issue: { ar: "كيف يفهم الشعراوي تدرّج الطلاق ورجوع الزوجين بعد العدة، وما الذي تشترطه الآية للرجوع؟", en: "How does Sha'rawi read the gradual divorce and the return after the waiting period, and what does the verse require for that return?" }
