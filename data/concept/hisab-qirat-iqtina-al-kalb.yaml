id: concept/hisab-qirat-iqtina-al-kalb
class: concept
kind: doctrine
label:
  ar: "اقتناء الكلب لغير حاجة: قيراط ينقص كل يوم"
  en: "Keeping a dog without need: a qirat lost each day"
  ur: "بلا ضرورت کتا پالنا: ہر روز ایک قیراط کی کمی"
  es: "Tener un perro sin necesidad: se pierde un qirat cada día."
  fr: "Garder un chien sans nécessité: une qirat perdue chaque jour"
  tr: "Gereksiz yere köpek sahibi olmak: her gün azalan bir karat"
  id: "Memelihara anjing tanpa perlu: satu karat menurun setiap hari"
summary:
  ar: "من أمسك كلبا فإنه ينقص كل يوم من عمله قيراط، إلا كلب حرث أو ماشية، في رواية أبي هريرة [[passage/bukhari-api-2322]]، وفي رواية ابن عمر: قيراطان، مع استثناء كلب الصيد والماشية [[passage/bukhari-api-5481]]. وهو مثال على عدّاد يجري في الاتجاه المعاكس: نقص يومي من الرصيد لا سيئة تُكتب، والقائمة تعرض الروايتين كما وردتا."
  en: "Whoever keeps a dog loses a qirat from his deeds each day, except a dog for farming or herding, in Abu Hurayra's narration [[passage/bukhari-api-2322]]; in Ibn Umar's narration it is two qirats, with the hunting and herding dog excepted [[passage/bukhari-api-5481]]. It is an example of a counter that runs the other way: a daily deduction from the balance rather than a bad deed written, and the ledger shows both narrations as they came."
  ur: "جو کتا پالے اس کے عمل سے ہر روز ایک قیراط کم ہوتا ہے، سوائے کھیتی یا مویشی کے کتے کے، ابو ہریرہ کی روایت میں [[passage/bukhari-api-2322]]، اور ابن عمر کی روایت میں دو قیراط، شکار اور مویشی کے کتے کے استثنا کے ساتھ [[passage/bukhari-api-5481]]۔ یہ اس گنتی کی مثال ہے جو الٹی سمت چلتی ہے: لکھی جانے والی برائی نہیں بلکہ جمع شدہ اجر میں سے روزانہ کمی، اور فہرست دونوں روایتیں جیسی آئی ہیں ویسی دکھاتی ہے۔"
  es: "Quien tiene un perro pierde un qirat de sus acciones cada día, excepto si se trata de un perro de trabajo o de pastoreo, según la narración de Abu Hurayra [[passage/bukhari-api-2322]]; en la narración de Ibn Umar son dos qirats, con la excepción del perro de caza y de pastoreo [[passage/bukhari-api-5481]]. Es un ejemplo de un contador que funciona al revés: una deducción diaria del saldo en lugar de una mala acción escrita, y el libro de contabilidad muestra ambas narraciones tal como fueron recibidas."
  fr: "Quiconque possède un chien perd un qirat sur ses actions quotidiennes, à l'exception des chiens de ferme ou de berger, selon le hadith rapporté par Abou Hourayra [[passage/bukhari-api-2322]]; selon celui rapporté par Ibn Omar, la perte est de deux qirats, les chiens de chasse et de berger étant exclus [[passage/bukhari-api-5481]]. Il s'agit d'un exemple de système de comptage inversé: une déduction quotidienne du solde plutôt qu'une mauvaise action inscrite, et le registre fait état des deux hadiths dans l'ordre de leur réception."
  tr: "Bir köpek yakalayan kişi, her gün işinden bir kirat kaybeder; sadece bir süren köpek veya çiftlik hariç; bu, Abu Huraira'nın rivayetine [[passage/bukhari-api-2322]] ve İbn Umar'ın rivayetinde: av köpeği ve hayvanlar hariç iki kirat [[passage/bukhari-api-5481]]. Bu, ters yönde çalışan bir sayaca örnektir: günlük denge azalması, kötü bir çıkarım değil ve liste her iki anlatının da ortaya çıktıkları gibi gösterilir."
  id: "Siapa pun yang menangkap seekor anjing kehilangan satu qirat setiap hari dari pekerjaannya, kecuali anjing bajak atau ternak, menurut riwayat Abu Huraira [[passage/bukhari-api-2322]], dan dalam narasi Ibn Umar: dua qirat, kecuali anjing pemburu dan ternak [[passage/bukhari-api-5481]]. Ini adalah contoh dari penghitung yang berjalan ke arah berlawanan: penurunan keseimbangan harian, deduksi yang tidak buruk tercatat, dan daftar menunjukkan kedua narasi seperti yang muncul."
