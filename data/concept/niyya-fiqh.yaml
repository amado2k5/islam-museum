id: concept/niyya-fiqh
class: concept
kind: legal
label: { ar: "نِيّة", en: "Niyya (intention: its place in worship and contracts, its conditions and time)" }
summary:
  ar: "النية في اللغة القصد، وفي الاصطلاح عند الحنفية قصد الطاعة والتقرب إلى الله في إيجاب الفعل، وعند المالكية قصد الإنسان بقلبه ما يريده بفعله، وعند الشافعية قصد الشيء مقترناً بفعله، وعند الحنابلة عزم القلب على فعل العبادة تقرباً إلى الله تعالى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16711} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16712} وتفترق عن العزم والإرادة، فالعزم متقدم على الفعل والنية مقترنة به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16712} وأعمال المكلف إذا كانت مطلوبة الفعل كالصلاة والطهارة والصيام والنسك افتقرت إلى النية، لأن المقصود منها تعظيم الله بفعلها، أما ما تتحقق مصلحته بمجرد الأداء كأداء الدين والودائع فلا تفتقر إليها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16713} وذهب الجمهور إلى أن النية شرط في العبادات، وذهب الشافعية إلى أنها ركن فيها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16714}"
  en: "Niyya in the lexical sense is intention; technically the Hanafis define it as the purpose of obeying and drawing near to God in enjoining the act, the Malikis as the heart's purpose in what one does, the Shafi'is as intending a thing together with doing it, and the Hanbalis as the heart's resolve to perform an act of worship seeking God. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16711} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16712} It differs from azm (resolve, which precedes the act) and from irada (will); niyya accompanies the act. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16712} Acts commanded in their form, such as prayer, purification, fasting and the rites, need intention, since their purpose is to honour God by doing them; those whose purpose is met by performance alone, such as repaying debts and deposits, do not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16713} Most jurists hold intention a condition of worship, and most Shafi'is a pillar of it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16714}"
