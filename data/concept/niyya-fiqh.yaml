id: concept/niyya-fiqh
class: concept
kind: legal
label:
  ar: نِيّة
  en: 'Niyya (intention: its place in worship, contracts and oaths, its conditions and time)'
  es: "Niyya (intención: su lugar en el culto, los contratos y los juramentos, sus condiciones y su tiempo)"
  fr: "Niyya (intention: sa place dans le culte, les contrats et les serments, ses conditions et son moment)"
  ur: "نیا ⁦(نیت: عبادت میں اس کا مقام، عقد اور قسمیں، اس کی شرائط اور وقت)⁩"
  tr: "Niyet"
  id: "Niat"
summary:
  ar: النية في اللغة القصد، وفي الاصطلاح عند الحنفية قصد الطاعة والتقرب إلى الله في إيجاب الفعل، وعند المالكية قصد الإنسان بقلبه ما يريده بفعله، وعند الشافعية قصد الشيء مقترناً بفعله، وعند الحنابلة عزم القلب على فعل العبادة تقرباً إلى الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16711} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16712} وتفترق عن العزم، لأن العزم متقدم على الفعل والنية مقترنة به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16712} وما كان مطلوب الفعل كالصلاة والطهارة والصيام والنسك يفتقر إلى النية، لأن المقصود تعظيم الله بفعله، أما ما تتحقق مصلحته بمجرد الأداء كأداء الدين والودائع فلا يفتقر إليها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16713} وجمهور الفقهاء على أن النية شرط في العبادات، وأكثر الشافعية على أنها ركن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16714} ويجب تعيين المنوي في العبادة التي تلتبس بغيرها من جنسها كالفرائض والصوم، ولا يُشترط في الحج والطهارات والزكاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16727} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16730} وفي الوضوء والغسل والتيمم خلاف في الفرضية والسنية، فالجمهور على أن النية شرط في الوضوء، والحنفية يرونها سنة، ولا تشترط في إزالة النجاسة عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16747} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16750} وفي الصلاة والصوم والزكاة والحج والكفارات خلاف في نية الفرضية والأداء والقضاء، والشافعية يشترطون التعيين فيما يلتبس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16732} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16737} وتنقسم النية إلى حقيقية شرط في أول العبادة، وحكمية تكفي في استمرارها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16738} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16739} ولا تقبل النيابة في النية، وتختلف المذاهب في تشريك النيات وتفريقها على أعضاء الطهارة وأجزاء الطاعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16743} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16745} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16746} وفي الصوم والزكاة والحج ونحوها خلاف في وقت النية وشرطها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16752} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16753} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16754} وفي العقود تؤثر النية في الكناية، فالطلاق الصريح يقع بلا نية والكناية بالنية، والظهار والوقف والنكاح والإعتاق والقصاص، وفي اليمين تُراعى نية المستحلف إن كان ظالماً ونية الحالف إن كان مظلوماً عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16753} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16755} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16756} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16757} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16759} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16760} وفي الجهاد والذكاة والصيد والقتل تعتبر النية والقصد، ويملك الصيد بالأخذ الحقيقي دون نية، وتعتبر النية في اللقطة لتحديد الضمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16761} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16762} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16763}
  en: 'Niyya in the lexical sense is intention. For the Hanafis it is the purpose of obeying and drawing near to God in enjoining the act; for the Malikis the heart''s purpose in what one does; for the Shafi''is intending a thing together with doing it; for the Hanbalis the heart''s resolve to perform an act of worship seeking God. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16711} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16712} It differs from azm, which precedes the act. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16712} Acts commanded in their form, such as prayer, purification, fasting and the rites, need intention, since their purpose is to honour God by doing them; those whose purpose is met by performance alone, such as repaying debts, do not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16713} Most jurists hold intention a condition of worship; most Shafi''is a pillar of it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16714} Acts that could be confused with another of their kind, such as the obligatory prayers and fasting, need specification; it is not required in the pilgrimage, the purifications and zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16727} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16730} The schools differ on whether intention in ablution, the major ablution and tayammum must be of obligation or merely of purification; the majority hold intention a condition of ablution, the Hanafis a sunna, and removing filth needs none according to the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16747} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16750} The schools differ on specifying obligation, performance or making up in prayer, fasting, zakat, the pilgrimage and expiations; the Shafi''is require specification where acts could be confused. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16732} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16737} Intention is real or constructive: the real one is a condition at the start of worship, the constructive one suffices for its continuance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16738} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16739} Intention cannot be delegated; the schools differ on combining intentions and on splitting intention over the parts of ablution and worship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16743} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16745} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16746} In fasting, zakat and the pilgrimage the schools differ on the time and the sufficiency of intention. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16752} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16753} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16754} In contracts, intention matters for allusive wording: a clear divorce takes effect without intention, an allusive one only with it; likewise return, zihar, waqf, marriage, emancipation and retaliation; in oaths the Hanafis follow the intention of the swearer if wronged and of the one who demands the oath if he is the wrongdoer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16755} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16756} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16757} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16759} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16760} In jihad, slaughter, hunting and the finding of lost property, intention affects the ruling; hunting is owned by taking even without intention, but the finder who intends to appropriate becomes liable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16761} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16762} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16763}'
  es: "Niyya en el sentido léxico es intención. Para los Hanafi es el propósito de obedecer y acercarse a Dios al ordenar el acto; para los Malikis el propósito del corazón en lo que uno hace; para los Shafi'is tener la intención de hacer algo junto con hacerlo; para los Hanbalis la resolución del corazón de realizar un acto de adoración buscando a Dios. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16711} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16712} Se diferencia de azm, que precede al acto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16712} Los actos ordenados en su forma, como la oración, la purificación, el ayuno y los ritos, necesitan intención, ya que su propósito es honrar a Dios al hacerlos; aquellos cuyo propósito se cumple solo con el desempeño, como el pago de deudas, no lo hacen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16713} La mayoría de los juristas sostienen la intención como una condición de la adoración; la mayoría de los shafi'is como un pilar de ella. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16714} Los actos que podrían confundirse con otros de su tipo, como las oraciones obligatorias y el ayuno, necesitan especificación; no se requiere en la peregrinación, las purificaciones y el zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16727} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16730} Las escuelas difieren en si la intención en la ablución, la ablución mayor y el tayammum debe ser de obligación o simplemente de purificación; La mayoría sostiene que la intención es una condición de la ablución, los Hanafis una sunna, y la eliminación de la suciedad no necesita ninguna según la mayoría. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16747} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16750} Las escuelas difieren en cuanto a la especificación de la obligación, el cumplimiento o la compensación en la oración, el ayuno, el zakat, la peregrinación y las expiaciones; los Shafi'is requieren especificación cuando los actos podrían confundirse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16732} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16737} La intención es real o constructiva: la real es una condición al comienzo de la adoración, la constructiva basta para su continuación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16738} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16739} La intención no puede delegarse; las escuelas difieren en la combinación de intenciones y en la división de la intención entre las partes de la ablución y la adoración. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16743} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16745} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16746} En el ayuno, el zakat y la peregrinación las escuelas difieren en cuanto al tiempo y la suficiencia de intención. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16752} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16753} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16754} En los contratos, la intención importa para la redacción alusiva: un divorcio claro surte efecto sin intención, un alusivo uno solo con ello; asimismo retorno, zihar, waqf, matrimonio, emancipación y represalia; En los juramentos, los Hanafis siguen la intención del que jura si es agraviado y del que exige el juramento si es el malhechor. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16755} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16756} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16757} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16759} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16760} En la yihad, la matanza, la caza y el hallazgo de bienes perdidos, la intención afecta el fallo; La caza se posee por la toma incluso sin intención, pero el buscador que pretende apropiarse se hace responsable. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16761} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16762} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16763}"
  fr: "Niyya, au sens lexical, signifie intention. Pour les Hanafites, il s'agit du but d'obéir à Dieu et de se rapprocher de lui en prescrivant l'acte; pour les Malikites, de l'intention du cœur dans ce que l'on fait; pour les Chafi'ites, de l'intention d'accomplir une chose en même temps que son exécution; pour les Hanbalites, de la résolution du cœur à accomplir un acte d'adoration en recherchant Dieu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16711} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16712} Cela diffère d'azm, qui précède l'acte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16712} Les actes prescrits dans leur forme, tels que la prière, la purification, le jeûne et les rites, requièrent une intention, car leur but est d'honorer Dieu en les accomplissant. Ceux dont le but est atteint par la seule action, comme le remboursement des dettes, n'en sont pas tenus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16713} La plupart des juristes considèrent l'intention comme une condition du culte; la plupart des écoles shafi'ites en font un pilier. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16714} Les actes qui pourraient être confondus avec d'autres de même nature, tels que les prières obligatoires et le jeûne, nécessitent une précision; l'intention n'est pas requise pour le pèlerinage, les purifications et la zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16727} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16730} Les écoles divergent quant à savoir si l'intention lors des ablutions, des ablutions majeures et du tayammum doit être une obligation ou simplement une intention de purification; La majorité considère l'intention comme une condition de l'ablution, les hanafites comme une sunna, et l'élimination des impuretés n'en requiert aucune selon la majorité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16747} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16750} Les écoles divergent quant à la précision des obligations, de leur accomplissement ou de leur rattrapage en matière de prière, de jeûne, de zakat, de pèlerinage et d'expiations; les chaféites exigent une précision lorsque les actes peuvent prêter à confusion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16732} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16737} L'intention est réelle ou constructive: l'intention réelle est une condition préalable au début du culte, l'intention constructive suffit à sa poursuite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16738} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16739} L'intention ne peut être déléguée; les écoles divergent quant à la combinaison des intentions et à leur répartition entre les différentes étapes des ablutions et du culte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16743} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16745} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16746} Dans le jeûne, la zakat et le pèlerinage, les écoles diffèrent sur le moment et la suffisance de intention. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16752} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16753} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16754} Dans les contrats, l'intention compte pour la formulation allusive: un divorce clair prend effet sans intention, un allusif un seul avec lui; de même le retour, le zihar, le waqf, le mariage, l'émancipation et les représailles; En prêtant serment, les Hanafis suivent l'intention de celui qui jure s'il est lésé et de celui qui exige le serment s'il est le fautif. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16755} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16756} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16757} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16759} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16760} Dans le jihad, le massacre, la chasse et la découverte des biens perdus, l'intention affecte la décision; la chasse est possédée en prenant même sans intention, mais celui qui a l'intention de s'approprier devient responsable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16761} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16762} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16763}"
  ur: "لغوی معنوں میں نیت نیت ہے۔ حنفیہ کے نزدیک عمل کا حکم دینے سے خدا کی اطاعت اور قرب حاصل کرنا مقصود ہے۔ مالکیوں کے لیے دل کا مقصد جو کچھ کرتا ہے۔ کیونکہ شافعی کسی کام کے ساتھ مل کر ارادہ کرتے ہیں۔ حنبلیوں کے لیے خدا کی تلاش میں عبادت کرنے کا دل کا عزم ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16711} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16712} یہ عجم سے مختلف ہے جو فعل سے پہلے ہے۔ {حوالہ: فقہ الموسوعۃ-کویتیہ-نور-v3 صفحہ 16712} نماز، طہارت، روزہ اور عبادات جیسے اعمال کا حکم ہے، نیت کی ضرورت ہے، کیونکہ ان کا مقصد خدا کی عزت کرنا ہے۔ جن کا مقصد صرف کارکردگی سے پورا ہوتا ہے، جیسے قرضوں کی ادائیگی، ایسا نہیں کرتے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 16713} اکثر فقہاء نیت کو عبادت کی شرط سمجھتے ہیں۔ زیادہ تر شافعی اس کا ایک ستون ہیں۔ {حوالہ: فقہ الموسوعہ-کویتیہ-نور-v3 صفحہ 16714} ایسے اعمال جو اپنی نوعیت کے کسی دوسرے سے الجھ سکتے ہیں، جیسے فرض نماز اور روزہ، وضاحت کی ضرورت ہے۔ حج، طہارت اور زکوٰۃ میں اس کی ضرورت نہیں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16727} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص16730} مکاتب میں اس بات پر اختلاف ہے کہ آیا وضو میں نیت کرنا، بڑا وضو اور تیمم واجب ہے یا محض پورہ کا؟ جمہور کے نزدیک نیت کو وضو، احناف سنت، اور گندگی کو دور کرنے کو جمہور کے نزدیک کوئی ضرورت نہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16731} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16747} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16750} نماز، روزے کی پابندی، مکاتب میں نماز کی پابندی، عمل میں اختلاف زکوٰۃ، حج اور کفارہ؛ شافعیوں کو تصریح کی ضرورت ہوتی ہے جہاں اعمال میں خلط ملط ہو سکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.16732} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16734} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16737} عبادت کی اصل شرط ہے یا اصل نیت کا آغاز کرنا ہے اس کے تسلسل کے لیے تعمیری کافی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16738} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16739} ارادہ نہیں کیا جا سکتا۔ وضو اور عبادت کے حصوں میں نیتوں کے امتزاج اور نیت کو تقسیم کرنے پر مکاتب کا اختلاف ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16743} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16745} {حوالہ: فقہ الموسوعہ کویتیہ نور-v3 ص16746} اور مکاتب میں روزہ اور نماز کے اوقات میں۔ نیت کی کفایت {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.16752} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص.16753} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16754} تمام معاہدوں کے لیے ایک واضح لفظ کا اطلاق ہوتا ہے۔ بغیر ارادے کے، صرف اس کے ساتھ ایک اشتعال انگیز؛ اسی طرح واپسی، ظہار، وقف، نکاح، آزادی اور انتقام؛ حنفیہ قسموں میں قسم کھانے والے کی نیت کی پیروی کرتے ہیں اگر وہ غلط ہو اور قسم مانگنے والے کی اگر وہ ظالم ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16755} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16756} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16757} ص16759} {حوالہ: فقہ معاویہ کویتیہ نور-v3 صفحہ 16760} جہاد، ذبح، شکار اور گمشدہ مال کی تلاش میں نیت حکم پر اثر انداز ہوتی ہے۔ شکار بغیر ارادے کے لے جانے کی ملکیت ہے، لیکن تلاش کرنے والا جو مناسب کرنے کا ارادہ رکھتا ہے ذمہ دار ہو جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16761} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16762}"
  tr: "Dilbilimde niyet niyet anlamına gelir; Hanefi terminolojisinde itaat niyeti ve eylemin yükümlülüğünde Tanrı'ya yaklaşma niyetidir; Malikilere göre, kişi kalbiyle yapmak istediğini yapar; Şafiilere göre ise, bir şeyin eylemiyle birleşen niyetidir; Hanbali'lere göre, kalbin Tanrı'ya yaklaşmak için ibadet etme kararlılığıdır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.16711} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16712} ve kararlılıktan farklıdır, çünkü kararlılık eylemden önce gelir ve niyet onunla ilişkilidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16712} Bu eylemden istenenler, örneğin dua, arınma, oruç ve ritüeller niyetsizdir, çünkü amaç bunu yaparak Allah'ı yüceltmektir. Sadece bunu yaparak elde edilen, borç ve depozito ödemek gibi şeyler ise bunu gerektirmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16713} Çoğu hukukçu, niyetin ibadet eylemlerinde bir koşul olduğu konusunda hemfikirdir, çoğu Şafi'ler ise bunu bir temel direk olarak kabul eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16714} Diğer ibadet türleriyle karıştırılan ibadet eylemlerinde amaçlanan kısmı belirtmek gerekir; hac, arınma veya zekat için zorunlu değildir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.16727}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16730} Abdest, ritüel yıkama ve kuru abdest alma konusunda, zorunlu ve sünnet hükümleri konusunda görüş ayrılığı vardır. Çoğunluk, niyetin abdest için bir koşul olduğunu düşünürken, Hanafiler bunu Sünnet olarak kabul eder ve çoğunluğa göre kirlerin giderilmesi için bir şart değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16747} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16750} Dua, oruç, zekat, hac ve kefaret konularında zorunluluk, ödeme ve oruç telafi etme niyeti konusunda anlaşmazlıklar vardır; Şafi'ler ise belirsiz durumlarda belirtme ister. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16732}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16737} niyet, ibadet eyleminin başında gerçek bir duruma ve devam etmesi için yeterli bilgelik olarak ikiye bölünür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16738} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16739} Niyet temsil kabul edilmez ve okullar niyetlerin paylaşımı ile saflık ve itaat bölümleri arasındaki ayrımı konusunda farklılık gösterir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16743} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16745} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16746} Oruç, zekat, hac ve benzeri konularda niyetin zamanlaması ve koşulları konusunda anlaşmazlıklar vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16752} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16753} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16754} Sözleşmelerde niyet metonimiyi etkiler; açık boşanma niyet olmaksızın, metonimi niyetsiz, zihar, duraklama, evlilik, özgürleşme ve intikam olur. Yeminlerde, yemin edenin niyeti haksızsa ve yemin niyeti Hanefilere göre haksızlığa uğrarsa dikkate alınır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16753} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16755} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16756} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16757}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16759} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16760} Cihat, zekat, avcılık ve öldürmede niyet ve niyet dikkate alınırken, avlanma gerçek alınarak kazanılır ve avdaki niyet sorumluluğu belirlemek için kabul edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16761} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16762} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16763}"
  id: "Dalam linguistik, niat berarti niat; dalam terminologi Hanafi, bermaksud untuk taat dan mendekatkan diri kepada Tuhan dalam kewajiban tindakan; menurut Maliki, seseorang bermaksud dengan hatinya apa yang diinginkan dengan melakukan; menurut Shafi'i, itu adalah niat sesuatu yang digabungkan dengan tindakannya; dan menurut Hanbali, tekad hati untuk melakukan ibadah sebagai sarana mendekatkan diri kepada Tuhan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16711} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16712} dan berbeda dari tekad, karena tekad mendahului tindakan dan niat terkait dengannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16712} Apa yang diwajibkan dari tindakan ini, seperti doa, penyucian, puasa, dan ritual, tidak memiliki niat, karena tujuannya adalah memuliakan Allah dengan melakukannya. Adapun apa yang dicapai hanya dengan melakukannya, seperti membayar hutang dan deposit, tidak mewajibkannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16713} Mayoritas ahli hukum setuju bahwa niat adalah syarat dalam ibadah, sementara kebanyakan Shafi'i menganggapnya sebagai pilar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16714} Perlu untuk menentukan bagian yang dimaksudkan dalam ibadah yang tertukar dengan jenis ibadah lain, seperti tindakan wajib dan puasa, dan tidak diperlukan untuk Haji, penyucian, atau zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16727} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16730} Mengenai wudhu, ritual mandi, dan wudhu kering, terdapat perbedaan pendapat mengenai aturan wajib dan Sunnah. Mayoritas berpendapat bahwa niat adalah syarat untuk wudhu, sementara Hanafi menganggapnya Sunnah dan bukan syarat untuk menghilangkan kemurnian menurut mayoritas. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.16731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16747} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16750} Dalam doa, puasa, zakat, ziarah, dan penebusan, terdapat perbedaan pendapat mengenai niat kewajiban, pembayaran, dan pembukaan puasa, sementara syafi'i memerlukan penjelasan dalam kasus yang ambigu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16732} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16737} niat dibagi menjadi kondisi nyata di awal tindakan ibadah, dan hikmah yang cukup untuk kelanjutannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16738} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16739} Representasi dalam niat tidak diterima, dan aliran berbeda dalam hal pembagian niat serta perbedaan antara bagian kemurnian dan bagian ketaatan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16743} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16745} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16746} Ada perbedaan pendapat mengenai waktu dan kondisi niat terkait puasa, zakat, ziarah, dan sejenisnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16752} {cite:fiqh-mawsua-Kuwaitiyya-noor-v3 hlm. 16753} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16754} Dalam kontrak, niat memengaruhi metonimi; perceraian eksplisit terjadi tanpa niat, metonimi dengan sengaja, zihar, jeda, pernikahan, pembebasan, dan pembalasan. Dalam sumpah, niat pelaku dipertimbangkan jika dia tidak adil, dan niat sumpah jika dia dizalimi menurut Hanafi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16753} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16755} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16756} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16757} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16759} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16760} Dalam jihad, zakat, berburu, dan pembunuhan, niat dan niat dipertimbangkan, sementara berburu diperoleh dengan mengambil yang nyata tanpa niat, dan niat dalam tangkapan dianggap untuk menentukan tanggung jawab. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16761} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16762} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16763}"
