label:
  ar: نِيّة
  en: 'Niyya (intention: its place in worship, contracts and oaths, its conditions and time)'
summary:
  ar: النية في اللغة القصد، وفي الاصطلاح عند الحنفية قصد الطاعة والتقرب إلى الله في إيجاب الفعل، وعند المالكية قصد الإنسان بقلبه ما يريده بفعله، وعند الشافعية قصد الشيء مقترناً بفعله، وعند الحنابلة عزم القلب على فعل العبادة تقرباً إلى الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16711} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16712} وتفترق عن العزم، لأن العزم متقدم على الفعل والنية مقترنة به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16712} وما كان مطلوب الفعل كالصلاة والطهارة والصيام والنسك يفتقر إلى النية، لأن المقصود تعظيم الله بفعله، أما ما تتحقق مصلحته بمجرد الأداء كأداء الدين والودائع فلا يفتقر إليها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16713} وجمهور الفقهاء على أن النية شرط في العبادات، وأكثر الشافعية على أنها ركن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16714} ويجب تعيين المنوي في العبادة التي تلتبس بغيرها من جنسها كالفرائض والصوم، ولا يُشترط في الحج والطهارات والزكاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16727} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16730} وفي الوضوء والغسل والتيمم خلاف في الفرضية والسنية، فالجمهور على أن النية شرط في الوضوء، والحنفية يرونها سنة، ولا تشترط في إزالة النجاسة عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16747} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16750} وفي الصلاة والصوم والزكاة والحج والكفارات خلاف في نية الفرضية والأداء والقضاء، والشافعية يشترطون التعيين فيما يلتبس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16732} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16737} وتنقسم النية إلى حقيقية شرط في أول العبادة، وحكمية تكفي في استمرارها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16738} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16739} ولا تقبل النيابة في النية، وتختلف المذاهب في تشريك النيات وتفريقها على أعضاء الطهارة وأجزاء الطاعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16743} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16745} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16746} وفي الصوم والزكاة والحج ونحوها خلاف في وقت النية وشرطها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16752} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16753} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16754} وفي العقود تؤثر النية في الكناية، فالطلاق الصريح يقع بلا نية والكناية بالنية، والظهار والوقف والنكاح والإعتاق والقصاص، وفي اليمين تُراعى نية المستحلف إن كان ظالماً ونية الحالف إن كان مظلوماً عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16753} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16755} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16756} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16757} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16759} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16760} وفي الجهاد والذكاة والصيد والقتل تعتبر النية والقصد، ويملك الصيد بالأخذ الحقيقي دون نية، وتعتبر النية في اللقطة لتحديد الضمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16761} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16762} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16763}
  en: 'Niyya in the lexical sense is intention. For the Hanafis it is the purpose of obeying and drawing near to God in enjoining the act; for the Malikis the heart''s purpose in what one does; for the Shafi''is intending a thing together with doing it; for the Hanbalis the heart''s resolve to perform an act of worship seeking God. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16711} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16712} It differs from azm, which precedes the act. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16712} Acts commanded in their form, such as prayer, purification, fasting and the rites, need intention, since their purpose is to honour God by doing them; those whose purpose is met by performance alone, such as repaying debts, do not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16713} Most jurists hold intention a condition of worship; most Shafi''is a pillar of it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16714} Acts that could be confused with another of their kind, such as the obligatory prayers and fasting, need specification; it is not required in the pilgrimage, the purifications and zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16727} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16730} The schools differ on whether intention in ablution, the major ablution and tayammum must be of obligation or merely of purification; the majority hold intention a condition of ablution, the Hanafis a sunna, and removing filth needs none according to the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16747} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16750} The schools differ on specifying obligation, performance or making up in prayer, fasting, zakat, the pilgrimage and expiations; the Shafi''is require specification where acts could be confused. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16732} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16737} Intention is real or constructive: the real one is a condition at the start of worship, the constructive one suffices for its continuance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16738} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16739} Intention cannot be delegated; the schools differ on combining intentions and on splitting intention over the parts of ablution and worship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16743} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16745} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16746} In fasting, zakat and the pilgrimage the schools differ on the time and the sufficiency of intention. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16752} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16753} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16754} In contracts, intention matters for allusive wording: a clear divorce takes effect without intention, an allusive one only with it; likewise return, zihar, waqf, marriage, emancipation and retaliation; in oaths the Hanafis follow the intention of the swearer if wronged and of the one who demands the oath if he is the wrongdoer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16755} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16756} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16757} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16759} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16760} In jihad, slaughter, hunting and the finding of lost property, intention affects the ruling; hunting is owned by taking even without intention, but the finder who intends to appropriate becomes liable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16761} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16762} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16763}'
