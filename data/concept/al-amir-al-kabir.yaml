id: concept/al-amir-al-kabir
class: concept
kind: term
label:
  ar: "الأمير الكبير (لقب مملوكي)"
  en: "Al-amir al-kabir ('the great amir', Mamluk title)"
summary:
  ar: "الأمير الكبير، لقب منح في المملكة المملوكية لكل من له أقدمية في الخدمة والسن، فكان ثمة جماعة من الأمراء كل منهم يسمى الأمير الكبير؛ ثم صار منذ سنة 752هـ/1352م مخصصًا لقائد الجيش الأعلى (أتابك العساكر) {cite:encyclopaedia-of-islam-2 vol. 1 p. 466}."
  en: "Al-amir al-kabir, 'the great amir', was a title granted in the Mamluk kingdom to all who had seniority in service and years, so that many amirs were each called by it. From 752/1352, in the days of Shaykhun al-'Umari, it was reserved for the commander-in-chief (atabak al-'asakir) {cite:encyclopaedia-of-islam-2 vol. 1 p. 466}."
