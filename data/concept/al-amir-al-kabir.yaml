id: concept/al-amir-al-kabir
class: concept
kind: term
label:
  ar: "الأمير الكبير ⁦(لقب مملوكي)⁩"
  en: "Al-amir al-kabir ('the great amir', Mamluk title)"
  fr: "Al-amir al-kabir (« le grand émir », titre mamelouk)"
  es: "Al-amir al-kabir ('el gran emir', título mameluco)"
  ur: "الامیر الکبیر ⁦('عظیم امیر'، مملوک لقب)⁩"
  tr: "Büyük Prens (Memlük unvanı)"
  id: "Pangeran Agung (gelar Mamluk)"
summary:
  ar: "الأمير الكبير، لقب منح في المملكة المملوكية لكل من له أقدمية في الخدمة والسن، فكان ثمة جماعة من الأمراء كل منهم يسمى الأمير الكبير؛ ثم صار منذ سنة 752هـ/1352م مخصصًا لقائد الجيش الأعلى ⁦(أتابك العساكر)⁩ {cite:encyclopaedia-of-islam-2 vol. 1 p. 466}."
  en: "Al-amir al-kabir, 'the great amir', was a title granted in the Mamluk kingdom to all who had seniority in service and years, so that many amirs were each called by it. From 752/1352, in the days of Shaykhun al-'Umari, it was reserved for the commander-in-chief (atabak al-'asakir) {cite:encyclopaedia-of-islam-2 vol. 1 p. 466}."
  fr: "Al-amir al-kabir, « le grand émir », était un titre accordé dans le royaume mamelouk à tous ceux qui avaient de l’ancienneté en service et en âge, de sorte que de nombreux émirs étaient chacun appelés ainsi. À partir de 752/1352, à l’époque de Shaykhun al-'Umari, il fut réservé au commandant en chef (atabak al-'asakir) {cite:encyclopaedia-of-islam-2 vol. 1 p. 466}."
  es: "Al-amir al-kabir, «el gran emir», era un título otorgado en el reino mameluco a todos aquellos que tenían antigüedad en el servicio y años de servicio, por lo que muchos emires eran llamados así. Desde 752/1352, en tiempos de Shaykhun al-'Umari, se reservó para el comandante en jefe (atabak al-'asakir) {cite:encyclopaedia-of-islam-2 vol. 1 p. 466}."
  ur: "الامیر الکبیر، 'عظیم امیر'، ایک لقب تھا جو مملوک بادشاہی میں ان تمام لوگوں کو دیا جاتا تھا جو خدمت اور سالوں میں بزرگی رکھتے تھے، اس لیے بہت سے امیر اس کے نام سے پکارے جاتے تھے۔ 752/1352 سے، شیخ العمری کے زمانے میں، یہ کمانڈر انچیف ⁦(عتابک الاساکیر)⁩ کے لیے مخصوص تھا۔ 1 ص۔ 466}۔"
  tr: "Büyük Prens, Memlük Krallığı'nda hizmet ve yaş açısından kıdemli herkese verilen bir unvandı. Her biri Büyük Prens olarak adlandırılan bir grup prens vardı; sonra, 752 Hicri / 1352 M.S. itibarıyla, bu unvan yüksek ordu komutanı (Atabeg al-Asakir) için belirlendi {cite:encyclopaedia-of-Islam-2 cilt 1, s. 466}."
  id: "Pangeran Agung adalah gelar yang diberikan kepada siapa pun yang lebih senior di Kerajaan Mamluk dalam hal dinas dan usia. Ada sekelompok pangeran, masing-masing disebut Pangeran Agung; kemudian, pada tahun 752 Hijrih / 1352 M, gelar ini diberikan kepada komandan tentara tinggi (Atabeg al-Asakir) {cite:encyclopaedia-of-Islam-2, volume 1, hlm. 466}."
