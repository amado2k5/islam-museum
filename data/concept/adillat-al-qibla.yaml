label: { ar: "أدلة القبلة: النجوم والرياح والجبال والأنهار", en: "Qibla-finding by stars, winds, mountains and rivers", fr: "Détermination de la qibla par les étoiles, les vents, les montagnes et les cours d’eau", es: "Cómo encontrar la Qibla mediante las estrellas, los vientos, las montañas y los ríos." }
summary:
  ar: "خصص ابن فضل الله العمري باباً رابعاً من مسالك الأبصار للقبلة والأدلة عليها: الاستدلال بالنجوم، فبالرياح، فبالجبال، فبالأنهار — الطرق التي اعتمدها أهل الأمصار قبل الإنشاءات الفلكية الدقيقة لضبط جهة الكعبة {cite:umari-masalik-1924 pp. 11, 128-129}."
  en: "Al-Umari devotes the fourth gate of Masalik al-Absar to the qibla and its proofs: determination by stars, then winds, then mountains, then rivers — the field methods by which the lands' people fixed the Kaaba's bearing before precision astronomy {cite:umari-masalik-1924 pp. 11, 128-129}."
  fr: "Al-Umari consacre le quatrième chapitre de Masalik al-Absar à la qibla et aux indices qui permettent de la trouver : les étoiles, puis les vents, les montagnes et les cours d’eau. Ces méthodes de terrain permettaient aux habitants de déterminer la direction de la Kaaba avant l’astronomie de précision {cite:umari-masalik-1924 pp. 11, 128-129}."
  es: "Al-Umari dedica la cuarta puerta de Masalik al-Absar a la qibla y sus pruebas: determinación por las estrellas, luego por los vientos, luego por las montañas, luego por los ríos: los métodos de campo con los que la gente de la tierra fijaba la orientación de la Kaaba antes de la astronomía de precisión {cite:umari-masalik-1924 pp. 11, 128-129}."
