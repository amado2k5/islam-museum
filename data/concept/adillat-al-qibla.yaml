label: { ar: "أدلة القبلة: النجوم والرياح والجبال والأنهار", en: "Qibla-finding by stars, winds, mountains and rivers", fr: "Détermination de la qibla par les étoiles, les vents, les montagnes et les cours d’eau", es: "Cómo encontrar la Qibla mediante las estrellas, los vientos, las montañas y los ríos.", ur: "ستاروں، ہواؤں، پہاڑوں اور دریاؤں سے قبلہ تلاش کرنا", tr: "Kıble Kanıtı: Yıldızlar, Rüzgarlar, Dağlar ve Nehirler", id: "Qibla Proof: Bintang, Angin, Pegunungan, dan Sungai" }
summary:
  ar: "خصص ابن فضل الله العمري باباً رابعاً من مسالك الأبصار للقبلة والأدلة عليها: الاستدلال بالنجوم، فبالرياح، فبالجبال، فبالأنهار — الطرق التي اعتمدها أهل الأمصار قبل الإنشاءات الفلكية الدقيقة لضبط جهة الكعبة {cite:umari-masalik-1924 pp. 11, 128-129}."
  en: "Al-Umari devotes the fourth gate of Masalik al-Absar to the qibla and its proofs: determination by stars, then winds, then mountains, then rivers — the field methods by which the lands' people fixed the Kaaba's bearing before precision astronomy {cite:umari-masalik-1924 pp. 11, 128-129}."
  fr: "Al-Umari consacre le quatrième chapitre de Masalik al-Absar à la qibla et aux indices qui permettent de la trouver : les étoiles, puis les vents, les montagnes et les cours d’eau. Ces méthodes de terrain permettaient aux habitants de déterminer la direction de la Kaaba avant l’astronomie de précision {cite:umari-masalik-1924 pp. 11, 128-129}."
  es: "Al-Umari dedica la cuarta puerta de Masalik al-Absar a la qibla y sus pruebas: determinación por las estrellas, luego por los vientos, luego por las montañas, luego por los ríos: los métodos de campo con los que la gente de la tierra fijaba la orientación de la Kaaba antes de la astronomía de precisión {cite:umari-masalik-1924 pp. 11, 128-129}."
  ur: "العمری نے مسالک الابصار کے چوتھے دروازے کو قبلہ اور اس کے ثبوت کے لیے وقف کیا ہے: ستاروں، پھر ہواؤں، پھر پہاڑوں، پھر دریاوں کے ذریعے تعین - وہ میدانی طریقے جن کے ذریعے اہلِ زمین نے کعبہ کی برق کو درست فلکیات سے پہلے درست کیا تھا۔"
  tr: "İbn Fadlallah el-Omeri, kible'ye ve kanıtlarına dördüncü bir bölümü \"Görme yolları\" konusuna adamıştır: önce yıldızlarla, sonra rüzgarlarla, sonra dağlarla, sonra nehirlerle çıkarım — şehir halkının Kabe'nin yönünü belirlemek için kesin astronomik yapılardan önce kullandığı yöntemler {cite:umari-masalik-1924 s. 11, 128-129}."
  id: "Ibn Fadlallah al-Omari mendedikasikan bab keempat untuk Qibla dan buktinya, \"Cara Melihat\": pertama dengan bintang, kemudian dengan angin, kemudian dengan gunung, kemudian dengan sungai — metode yang digunakan oleh penduduk kota untuk menentukan arah Ka'bah sebelum struktur astronomi yang tepat {cite:umari-masalik-1924 hlm. 11, 128-129}."
