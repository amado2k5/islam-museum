summary:
  ar: "ضرو في الكتاب معروف، ورب الضرو صمغه ويجلب إلى مكة، حار في الثالثة رطب في الأولى، جلاء محلل جذاب من عمق البدن، وصمغه صمغ في شجرة الكمكام وهو كاللأذن في القوة طيب، ورب الضرو نافع جدا لسيلان الرطوبة من الفم وقروحه، وفيه قوة عاقلة للبطن {cite:canon-ibn-sina-print-v1 p.721}"
  en: "Darw is in the book known, and rubb al-darw is its gum, brought to Mecca; it is hot in the third degree and moist in the first, cleansing, dissolving and drawing from the depth of the body; its gum is a gum in the kamkam tree, like al-la'dhan in strength, and fragrant; rubb al-darw is very beneficial for flow of moisture from the mouth and its ulcers, and it has a power that binds the belly {cite:canon-ibn-sina-print-v1 p.721}"
  ur: "ضرو کتاب میں معروف ہے، اور رب الضرو اس کا گوند ہے جو مکہ لایا جاتا ہے؛ تیسرے درجے میں گرم اور پہلے میں تر، جلا دینے والا، تحلیل کرنے والا اور بدن کی گہرائی سے کھینچنے والا؛ اس کا گوند کمکام کے درخت کا گوند ہے، قوت میں اللاذن کی طرح اور خوشبودار، رب الضرو منہ سے رطوبت کے بہنے اور منہ کے زخموں میں بہت نافع ہے، اور اس میں پیٹ کو روکنے والی قوت ہے {cite:canon-ibn-sina-print-v1 p.721}۔"
