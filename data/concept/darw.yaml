summary:
  ar: "ضرو في الكتاب معروف، ورب الضرو صمغه ويجلب إلى مكة، حار في الثالثة رطب في الأولى، جلاء محلل جذاب من عمق البدن، وصمغه صمغ في شجرة الكمكام وهو كاللأذن في القوة طيب، ورب الضرو نافع جدا لسيلان الرطوبة من الفم وقروحه، وفيه قوة عاقلة للبطن {cite:canon-ibn-sina-print-v1 p.721}"
  en: "Darw is in the book known, and rubb al-darw is its gum, brought to Mecca; it is hot in the third degree and moist in the first, cleansing, dissolving and drawing from the depth of the body; its gum is a gum in the kamkam tree, like al-la'dhan in strength, and fragrant; rubb al-darw is very beneficial for flow of moisture from the mouth and its ulcers, and it has a power that binds the belly {cite:canon-ibn-sina-print-v1 p.721}"
  ur: "ضرو کتاب میں معروف ہے، اور رب الضرو اس کا گوند ہے جو مکہ لایا جاتا ہے؛ تیسرے درجے میں گرم اور پہلے میں تر، جلا دینے والا، تحلیل کرنے والا اور بدن کی گہرائی سے کھینچنے والا؛ اس کا گوند کمکام کے درخت کا گوند ہے، قوت میں اللاذن کی طرح اور خوشبودار، رب الضرو منہ سے رطوبت کے بہنے اور منہ کے زخموں میں بہت نافع ہے، اور اس میں پیٹ کو روکنے والی قوت ہے {cite:canon-ibn-sina-print-v1 p.721}۔"
  es: "El darw es conocido en el libro, y rubb al-darw es su goma, traída a La Meca; es caliente en tercer grado y húmeda en primero, limpia, disuelve y extrae desde lo profundo del cuerpo; su goma es una goma del árbol kamkam, como al-la'dhan en fuerza, y fragante; rubb al-darw es muy beneficioso para el flujo de humedad de la boca y sus úlceras, y tiene un poder que aprieta el vientre {cite:canon-ibn-sina-print-v1 p.721}"
  fr: "Le darw est mentionné dans le livre, et le rubb al-darw est sa gomme, apportée à La Mecque; il est chaud au troisième degré et humide au premier, purifiant, dissolvant et drainant en profondeur; sa gomme est celle du kamkam, aussi puissante que l’al-la’dhan, et parfumée; le rubb al-darw est très bénéfique pour l’écoulement de l’humidité buccale et le traitement des ulcères, et il possède des propriétés tonifiantes pour l’estomac. {cite:canon-ibn-sina-print-v1 p.721}"
  tr: "Kitaptaki 'Dru' iyi bilinir ve kötülerin Rabbi onu mühürleyip Mekke'ye getirmiştir. Üçüncüsü sıcak, ilkinde nemlidir, vücudun derinliklerinden çekici ve çözünmüş bir ekstrakttır. Diş eti Kamkam ağacındaki sakız gibidir, kulak gibi güçlüdür, iyidir. Kötünün Rabbi, ağızdan ve yaralarından nemi gidermede çok faydalıdır ve mide için mantıklı bir güce sahiptir {cite:canon-ibn-sina-print-v1 s.721}"
  id: "'Dru' dalam kitab ini sangat dikenal, dan Tuhan yang jahat telah menyegelnya dan membawanya ke Mekah. Panas di bagian ketiga dan lembap di bagian pertama, ekstrak menarik dan larut dari dalam tubuh. Permen karetnya seperti permen getah di pohon Kamkam, yang seperti telinga dalam kekuatan, baik. Tuhan yang jahat sangat bermanfaat untuk menghilangkan kelembapan dari mulut dan luka-lukanya, dan memiliki kekuatan rasional untuk perut {cite:canon-ibn-sina-print-v1 hlm.721}"
