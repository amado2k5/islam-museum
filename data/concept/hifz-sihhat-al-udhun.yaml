id: "concept/hifz-sihhat-al-udhun"
class: "concept"
kind: "scientific"
label:
  ar: "حفظ صحة الأذن"
  en: "Preserving the health of the ear"
  ur: "کان کی صحت کا تحفظ"
  es: "Preservar la salud del oído"
summary:
  ar: "يجب أن يعتنى بالأذن فتوقى الحر والبرد والرياح والأشياء الغريبة المفرطة لئلا يدخلها شيء من المياه والحيوانات، وأن ينقى وسخها، وأن يدام تقطير ما يعرف فيها في كل أسبوع مرة، وأن يراعى لئلا يتولد فيها أورام وبثور وقروح فإنها مفسدة للأذن؛ ومما يضر الأذن وسائر الحواس التخمة والامتلاء وخصوصاً النوم على الامتلاء {cite:canon-ibn-sina-print-v2 p.217} {cite:canon-ibn-sina-print-v2 p.218}"
  en: "The ear must be cared for: guarded from heat, cold, winds and extreme foreign things lest waters or animals enter it; its dirt cleaned away; the known oil dropped in once a week; watch kept lest swellings, pustules and ulcers breed in it, for they corrupt the ear. What harms the ear and all the senses is indigestion and repletion, above all sleeping on repletion {cite:canon-ibn-sina-print-v2 p.217} {cite:canon-ibn-sina-print-v2 p.218}"
  ur: "کان کی دیکھ بھال ضروری ہے: گرمی، سردی، ہواؤں اور غیر معمولی بیرونی چیزوں سے بچایا جائے کہ پانی یا جانور اس میں نہ داخل ہوں؛ اس کی میل صاف رکھی جائے؛ ہر ہفتے ایک بار معروف تیل ٹپکایا جائے؛ اور نگہبانی رہے کہ اس میں ورم، دانے اور پھوڑے نہ پیدا ہوں کہ وہ کان کو بگاڑتے ہیں؛ اور کان اور تمام حواس کو نقصان دیتا ہے بدہضمی اور امتلاء، خصوصاً امتلاء پر سونا {cite:canon-ibn-sina-print-v2 p.217} {cite:canon-ibn-sina-print-v2 p.218}"
  es: "El oído debe cuidarse: protegerse del calor, el frío, el viento y las sustancias extrañas para que no le entren aguas ni animales; limpiarlo de la suciedad; aplicarle aceite una vez por semana; vigilarlo para que no se formen hinchazones, pústulas ni úlceras, pues dañan el oído. Lo que perjudica al oído y a todos los sentidos es la indigestión y la sobrealimentación, sobre todo dormir después de comer. {cite:canon-ibn-sina-print-v2 p.217} {cite:canon-ibn-sina-print-v2 p.218}"
