label: { ar: "هَيْئة", en: "Hay'a (the recommended forms of prayer, and the dignified offenders)" }
summary:
  ar: "الهيئة في اللغة الحالة الظاهرة التي يكون عليها الشيء، محسوسة كانت أو معقولة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16574} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16575} وفي الصلاة قسّم الشافعية أعمالها إلى أركان وأبعاض وهيئات، فالأبعاض تُجبر بسجود السهو، أما الهيئات فلا تُجبر به ولا يعود إليها المصلي، وشبّهوا الصلاة بالإنسان: فالركن كرأسه، والشرط كحياته، والبعض كأعضائه، والهيئة كشعره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16575} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16576} وتعدد الهيئات عند الشافعية أكثر من خمس عشرة خصلة، منها رفع اليدين عند تكبيرة الإحرام وعند الركوع وعند الرفع منه، ووضع اليمنى على اليسرى، والتعوذ قبل القراءة، والتأمين، والتسبيح في الركوع والسجود، والافتراش والتورك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16576} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16577} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16578} وأما الحنابلة فيعدّون الهيئات ما يتصل بالكيفية كضم الأصابع، وقبض اليمين على الشمال، والنظر إلى موضع السجود، وترتيل القراءة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16579} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16580} وفي باب التعزير ذهب جمهور الفقهاء إلى تخفيف العقوبة عن ذوي الهيئات، وهم أهل الدين والصلاح، وقد استندوا إلى حديث «أقيلوا ذوي الهيئات عثراتهم إلا الحدود». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16580} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16581} واختلفوا: فقال بعضهم يُوعظ ولا يُعزر، وقال الشافعية إن ذا الهيئة لا يُعاقب أصلاً عند ابن عبد السلام، ونازعه الأذرعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16581} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16584}"
  en: "Hay'a in the lexical sense is the outward state a thing is in, sensed or understood. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16574} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16575} In prayer the Shafi'is divide its acts into pillars (arkan), sunan that sahw prostration repairs, and hay'at that it does not repair and to which the worshipper does not return; they liken the prayer to a person, the pillar to the head, the condition to life, the sunan to the limbs and the hay'at to the hair. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16575} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16576} By the Shafi'i count there are more than fifteen hay'at, including raising the hands at the opening takbir, at bowing and at rising from it, placing the right palm on the left, seeking refuge before recitation, saying amin, the glorification in bowing and prostration, and the postures of sitting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16576} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16577} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16578} The Hanbalis list hay'at as matters of manner: the fingers, the placing of the right hand over the left below the navel, the gaze at the place of prostration, and measured recitation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16579} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16580} In discipline, most jurists lighten the punishment for the dignified, the people of religion and piety, relying on the saying 'pardon the lapses of the dignified except in the hadd punishments'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16580} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16581} The jurists differ: some admonish but do not discipline a first lapse; Ibn Abd al-Salam holds the dignified are not punished at all, and al-Adhra'i disputes him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16581} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16584}"
