label: { ar: "هَيْئة", en: "Hay'a (the recommended forms of prayer, and the dignified offenders)", es: "Hay'a (las formas recomendadas de oración y los ofensores dignos)", fr: "Hay'a (les formes de prière recommandées et les coupables dignes)", ur: "حیاء ⁦(نماز کی تجویز کردہ شکلیں، اور معزز مجرم)⁩", tr: "Yetki", id: "Otoritas" }
summary:
  ar: "الهيئة في اللغة الحالة الظاهرة التي يكون عليها الشيء، محسوسة كانت أو معقولة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16574} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16575} وفي الصلاة قسّم الشافعية أعمالها إلى أركان وأبعاض وهيئات، فالأبعاض تُجبر بسجود السهو، أما الهيئات فلا تُجبر به ولا يعود إليها المصلي، وشبّهوا الصلاة بالإنسان: فالركن كرأسه، والشرط كحياته، والبعض كأعضائه، والهيئة كشعره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16575} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16576} وتعدد الهيئات عند الشافعية أكثر من خمس عشرة خصلة، منها رفع اليدين عند تكبيرة الإحرام وعند الركوع وعند الرفع منه، ووضع اليمنى على اليسرى، والتعوذ قبل القراءة، والتأمين، والتسبيح في الركوع والسجود، والافتراش والتورك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16576} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16577} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16578} وأما الحنابلة فيعدّون الهيئات ما يتصل بالكيفية كضم الأصابع، وقبض اليمين على الشمال، والنظر إلى موضع السجود، وترتيل القراءة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16579} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16580} وفي باب التعزير ذهب جمهور الفقهاء إلى تخفيف العقوبة عن ذوي الهيئات، وهم أهل الدين والصلاح، وقد استندوا إلى حديث «أقيلوا ذوي الهيئات عثراتهم إلا الحدود». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16580} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16581} واختلفوا: فقال بعضهم يُوعظ ولا يُعزر، وقال الشافعية إن ذا الهيئة لا يُعاقب أصلاً عند ابن عبد السلام، ونازعه الأذرعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16581} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16584}"
  en: "Hay'a in the lexical sense is the outward state a thing is in, sensed or understood. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16574} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16575} In prayer the Shafi'is divide its acts into pillars (arkan), sunan that sahw prostration repairs, and hay'at that it does not repair and to which the worshipper does not return; they liken the prayer to a person, the pillar to the head, the condition to life, the sunan to the limbs and the hay'at to the hair. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16575} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16576} By the Shafi'i count there are more than fifteen hay'at, including raising the hands at the opening takbir, at bowing and at rising from it, placing the right palm on the left, seeking refuge before recitation, saying amin, the glorification in bowing and prostration, and the postures of sitting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16576} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16577} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16578} The Hanbalis list hay'at as matters of manner: the fingers, the placing of the right hand over the left below the navel, the gaze at the place of prostration, and measured recitation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16579} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16580} In discipline, most jurists lighten the punishment for the dignified, the people of religion and piety, relying on the saying 'pardon the lapses of the dignified except in the hadd punishments'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16580} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16581} The jurists differ: some admonish but do not discipline a first lapse; Ibn Abd al-Salam holds the dignified are not punished at all, and al-Adhra'i disputes him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16581} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16584}"
  es: "Hay'a en el sentido léxico es el estado externo en el que se encuentra una cosa, percibido o entendido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16574} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16575} En la oración, los shafi'ís dividen sus actos en pilares (arkan), sunan que sahw rehabilita la postración, y hay'at que no rehabilita y a la que el adorador no regresa; comparan la oración con una persona, el pilar con la cabeza, la condición con la vida, el sunan con las extremidades y el hay'at con el cabello. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16575} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16576} Según el recuento shafi'í, hay más de quince hay'at, incluyendo levantar las manos en el takbir inicial, en la inclinación y al levantarse de ella, colocar la palma derecha sobre la izquierda, buscar refugio antes de la recitación, decir amín, la glorificación en la inclinación y la postración, y las posturas de sentarse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16576} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16577} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16578} Los hanbalíes enumeran el hay'at como cuestiones de modales: los dedos, la colocación de la mano derecha sobre la izquierda debajo del ombligo, la mirada en el lugar de la postración y la recitación medida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16579} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16580} En disciplina, la mayoría de los juristas suavizan el castigo para los dignos, la gente de religión y piedad, basándose en el dicho 'perdona las faltas de los dignos excepto en los castigos hadd'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16580} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16581} Los juristas difieren: algunos amonestan pero no disciplinan una primera falta; Ibn Abd al-Salam sostiene que los dignos no son castigados en absoluto, y al-Adhra'i lo contradice. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16581} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16584}"
  fr: "Hay'a, au sens lexical, désigne l'état extérieur d'une chose, tel qu'il est perçu ou compris. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16574} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16575} Dans la prière, les chaféites distinguent les actes en piliers (arkan), les sunan que la prosternation (sahw) répare, et les hay'at qu'elle ne répare pas et auxquels le fidèle ne revient pas; ils comparent la prière à une personne, le pilier à la tête, l'état à la vie, les sunan aux membres et les hay'at aux cheveux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16575} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16576} Selon le décompte Shafi'i, il y a plus de quinze hay'at, y compris lever les mains au takbir d'ouverture, à l'inclinaison et au relèvement, placer la paume droite sur la gauche, chercher refuge avant la récitation, dire amin, la glorification dans l'inclinaison et la prosternation, et les postures assises. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16576} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16577} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16578} Les Hanbalites listent les hay'at comme des questions de manière: les doigts, le placement de la main droite sur la gauche sous le nombril, le regard au lieu de prosternation et la récitation mesurée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16579} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16580} En matière de discipline, la plupart des juristes allègent la peine pour les personnes dignes, les gens de religion et de piété, se fondant sur le principe « pardonnez les manquements des personnes dignes, sauf dans les peines de hadd ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16580} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16581} Les juristes divergent: certains admonestent sans sanctionner un premier manquement; Ibn Abd al-Salam soutient que les personnes dignes ne sont pas punies, ce qu’al-Adhra’i conteste. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16581} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16584}"
  ur: "حیا لغوی معنوں میں ظاہری حالت ہے جس میں کوئی چیز ہوتی ہے، محسوس ہوتی ہے یا سمجھی جاتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص16574} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص16575} نماز میں شافعی اپنے اعمال کو ستونوں ⁦(ارکان)⁩ میں تقسیم کرتے ہیں، سنن کہ سہو سجدہ اس کی مرمت نہیں کرتا، اور جو عبادت نہیں کرتا اس کی مرمت نہیں کرتا۔ وہ نماز کو انسان، ستون کو سر، حالت کو زندگی، سنن کو اعضاء سے اور حیا کو بالوں سے تشبیہ دیتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 ص16575} {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص16576} شافعی شمار کے مطابق پندرہ سے زیادہ حیاء ہیں، جن میں ہاتھ کھولنے کے وقت ہاتھ اٹھانا، تکبیر پر ہاتھ اٹھانا، دائیں طرف تکبیر لگانا، دائیں طرف تکبیر کرنا شامل ہیں۔ تلاوت سے پہلے پناہ مانگنا، آمین کہنا، رکوع و سجود میں تسبیح اور بیٹھنے کی حالت۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16576} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16577} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16578} حنبلیوں کی انگلیوں کی فہرست کا معاملہ: دایاں ہاتھ ناف کے نیچے بائیں طرف، سجدہ کی جگہ پر نظریں، اور ناپ کر تلاوت۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16579} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16580} نظم و ضبط میں، زیادہ تر فقہا معززین کے لیے سزا کو ہلکا کرتے ہیں، اہل مذہب اور تقویٰ والے یہ کہتے ہیں کہ 'معصوم پر بھروسہ کیا گیا تھا'۔ سزائیں' {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16580} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16581} فقہاء کا اختلاف ہے: بعض نصیحت کرتے ہیں لیکن پہلی غلطی پر تادیب نہیں کرتے۔ ابن عبدالسلام کا کہنا ہے کہ معززین کو سزا نہیں دی جاتی، اور الدرائی نے اس سے اختلاف کیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16581}"
  tr: "Dilde biçim, bir şeyin somut ya da makul olduğu görünür halidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16574} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16575} Dua sırasında Şafi'ler işlevlerini sütunlar, uzuvlar ve şekiller olarak ayırırlar. Uzuvlar unutkanlık secdesi ile zorlanırken, uzuvlar buna bağlı değildir ve ibadet eden kişi ona geri dönmez. Dua bir kişiye benzetmiştir: sütun başı gibidir, durumu hayatı gibidir, bazıları uzuvları gibidir ve beden saçları gibidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16575} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16576} Şafiiler arasındaki form çeşitliliği on beşten fazla özelliktir; İhram Tekbirini (Tekbir-İhrem) söylerken elleri kaldırmak, eğilmek, kaldırmak, sağ eli sol elinin üzerine koymak, okunmadan önce sığınak aramak, okunmadan önce sığınak aramak, sığınak aramak, eğilme ve secdede yüceltmek, uzanmak ve Türkçe olmak dahildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16576} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16577} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16578} Hanbaliler ise biçimlerin bu yöntemle ilişkili olduğunu düşünürler; örneğin parmakları birleştirmek, sağ eli sola tutmak, secde yerine bakmak ve okumayı okumak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16579} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16580} Takdir yetkisi cezası bölümünde, çoğu hukukçu, dini otoriteye sahip olanlar olan dindar kişiler için cezanın azaltılmasında hemfikir olmuş ve hadislerini şöyle kurmuşlardır: \"Yetkili olanları engelleri için bölge (hududlar) hariç kaldırın.\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16580} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16581} ve farklı görüş bildirmiştir: bazıları onun azarladığını ama mazeret aramadığını söylerken, Şafiiler bu biçimdeki kişinin İbn Abdül-Selamı'na göre hiç cezalandırılmadığını söylerken, el-Ezrai buna itiraz etmiştir. {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.16581} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16584}"
  id: "Dalam bahasa, bentuk adalah keadaan nyata di mana sesuatu berada, baik yang nyata maupun yang masuk akal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16574} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16575} Dalam doa, umat syafi'i membagi fungsinya menjadi pilar, anggota tubuh, dan bentuk. Anggota tubuh dipaksa oleh sujud karena lupa, sementara anggota tubuh tidak dipaksa oleh itu dan penyembah tidak kembali kepadanya. Mereka menyamakan doa dengan seseorang: tiang seperti kepalanya, kondisinya seperti hidupnya, beberapa seperti anggota tubuhnya, dan tubuh seperti rambutnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16575} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16576} Beragam bentuk di antara para syafi'i lebih dari lima belas karakteristik, termasuk mengangkat tangan saat mengucapkan Takbir (Takbir al-Ihram), membungkuk, dan saat mengangkat tangan dari sana, meletakkan tangan kanan di atas tangan kiri, mencari perlindungan sebelum pembacaan, mencari perlindungan sebelum pembacaan, mencari perlindungan, memuliakan dengan membungkuk dan sujud, meregangkan dan Turki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16576} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16577} {cite::fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16578} Adapun Hanbali, mereka menganggap bentuk-bentuknya berkaitan dengan cara, seperti memegang jari bersama, memegang tangan kanan ke kiri, melihat tempat sujud, dan mengucapkan bacaan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16579} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16580} Dalam bab tentang hukuman diskresioner, mayoritas ahli hukum setuju untuk mengurangi hukuman bagi mereka yang memiliki otoritas agama, yang merupakan orang yang saleh, dan mereka mendasarkan hadits mereka: \"Singkirkan mereka yang berwenang atas batu sandungan mereka kecuali hudud (hudud).\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16580} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16581} dan berbeda: beberapa mengatakan dia menegur tetapi tidak mencari alasan, sementara syafi'i mengatakan bahwa orang dengan bentuk ini sama sekali tidak dihukum menurut Ibn Abd al-Salam, dan al-Azra'i membantahnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16581} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16584}"
