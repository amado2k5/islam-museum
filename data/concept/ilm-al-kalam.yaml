label: { ar: "علم الكلام" }
summary:
  ar: "علم الكلام علم جديد تشكل في العصر العباسي الأول من تراكم البحث في العقائد؛ يعدد أحمد أمين لنشوئه أسباباً داخلية وخارجية، فمن الداخلية أن القرآن عرض لأهم الفرق والأديان المنتشرة في عهده ورد عليها ونقض قولها وحكى عن منكري النبوات والحشر ومسائل الجبر والاختيار، وأمر الرسول أن يجادل المخالفين بالتي هي أحسن فكان طبيعياً أن ينهج علماء الملة هذا المنهج فيردوا على المخالفين ويجددوا الحجج كلما جدد المخالفون الطعن؛ ومنها أن المسلمين لما فرغوا من الفتح واستقر لهم الأمر أخذ عقلهم يتفلسف في الدين فيثير خلافات ويجتهد في بحثها {cite:duha-islam p. 688-689}."
  en: "Ilm al-kalam — the new discipline of speculative theology that coalesced in the first Abbasid era; Ahmad Amin traces its rise to internal causes (the Qur'an's own engagement with rival creeds, the post-conquest turn to reflection) and external ones (foreign cultures and religions) {cite:duha-islam p. 688-689}."
