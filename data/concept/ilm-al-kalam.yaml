label: { ar: "علم الكلام", en: "Ilm al-kalam (speculative theology)", es: "Ilm al-kalam (teología especulativa)", fr: "Ilm al-kalam (théologie spéculative)", ur: "علم الکلام ⁦(قیاس پر مبنی نظریہ)⁩", tr: "konuşma", id: "pidato" }
summary:
  ar: "علم الكلام علم جديد تشكل في العصر العباسي الأول من تراكم البحث في العقائد؛ يعدد أحمد أمين لنشوئه أسباباً داخلية وخارجية، فمن الداخلية أن القرآن عرض لأهم الفرق والأديان المنتشرة في عهده ورد عليها ونقض قولها وحكى عن منكري النبوات والحشر ومسائل الجبر والاختيار، وأمر الرسول أن يجادل المخالفين بالتي هي أحسن فكان طبيعياً أن ينهج علماء الملة هذا المنهج فيردوا على المخالفين ويجددوا الحجج كلما جدد المخالفون الطعن؛ ومنها أن المسلمين لما فرغوا من الفتح واستقر لهم الأمر أخذ عقلهم يتفلسف في الدين فيثير خلافات ويجتهد في بحثها {cite:duha-islam p. 688-689}."
  en: "Ilm al-kalam — the new discipline of speculative theology that coalesced in the first Abbasid era; Ahmad Amin traces its rise to internal causes (the Qur'an's own engagement with rival creeds, the post-conquest turn to reflection) and external ones (foreign cultures and religions) {cite:duha-islam p. 688-689}."
  es: "Ilm al-kalam — la nueva disciplina de teología especulativa que se consolidó en la primera era abasí; Ahmad Amin atribuye su surgimiento a causas internas (el propio compromiso del Corán con credos rivales, el giro hacia la reflexión posterior a la conquista) y externas (culturas y religiones extranjeras) {cite:duha-islam p. 688-689}."
  fr: "Ilm al-kalam — la nouvelle discipline de théologie spéculative qui s'est cristallisée dans la première ère abbasside; Ahmad Amin attribue son essor à des causes internes (l'engagement du Coran avec les croyances rivales, le tournant post-conquête vers la réflexion) et externes (les cultures et religions étrangères) {cite:duha-islam p. 688-689}."
  ur: "علم الکلام - قیاس آرائی پر مبنی الہیات کا نیا شعبہ جو پہلے عباسی دور میں اکٹھا ہوا؛ احمد امین داخلی اسباب ⁦(قرآن کی اپنی حریف عقائد کے ساتھ مشغولیت، فتح کے بعد غور و فکر کی طرف رجوع)⁩ اور خارجی ⁦(غیر ملکی ثقافتوں اور مذاہب)⁩ سے اس کے عروج کا سراغ لگاتے ہیں۔ 688-689}۔"
  tr: "Kalam (İslami teoloji) bilimi, erken Abbasi döneminde mezhepler üzerine yapılan araştırmaların biriminden doğmuştur; Ahmed Amin bunun ortaya çıkışının iç ve dış nedenlerini sıralar. İçsel yönler arasında, Kur'an'ın kendi döneminde yaygın olan en önemli mezhep ve dinleri sunması, onları çürütmesi, ifadelerini çürütmesi ve peygamberlik, diriliş ve kader ile özgür irade meselelerini reddedenlerden bahsetmesidir. Peygamber, muhaliflerin en iyi şekilde tartışmasını emretmiş, bu nedenle mezhep alimlerinin bu yöntemi benimsemesi, karşıtlara yanıt vermesi ve muhalifler eleştirilerini yenilediğinde argümanları yenilemeleri doğaldır. Bunlar arasında, Müslümanlar fetihlerini tamamlayıp konu kendileri için çözüldüklerinde, zihinlerinin din üzerine felsefe yapmaya başlaması, tartışmalar çıkarması ve bunları araştırmaya çalışmaları vardır {atıf:Duha-İslam, s. 688-689}."
  id: "Ilmu Kalam (teologi Islam) muncul pada awal era Abbasiyah dari akumulasi penelitian tentang kepercayaan; Ahmad Amin mencantumkan alasan internal dan eksternal kemunculannya. Di antara aspek internalnya adalah Al-Qur'an menyajikan sekte dan agama paling penting yang berlaku pada zamannya, membantahnya, membantah pernyataan mereka, dan berbicara tentang mereka yang menolak kenabian, kebangkitan, serta isu takdir dan kehendak bebas. Nabi memerintahkan agar para penentang berdebat dengan cara terbaik, sehingga wajar bagi ulama sekte untuk mengadopsi metodologi ini, menanggapi lawan dan memperbarui argumen setiap kali lawan mengulangi kritik mereka. Di antaranya adalah ketika umat Muslim menyelesaikan penaklukan dan masalah tersebut diselesaikan bagi mereka, pikiran mereka mulai berfilosofi dalam agama, memicu perselisihan dan berusaha menyelidikinya {cite:Duha-Islam, hlm. 688-689}."
