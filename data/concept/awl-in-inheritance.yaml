id: concept/awl-in-inheritance
class: concept
kind: legal
label:
  ar: "العَوْل في الفرائض"
  en: "Awl (proportional reduction of shares in inheritance)"
  es: "Punzón (reducción proporcional de las participaciones en la herencia)"
  fr: "Awl (réduction proportionnelle des parts d'héritage)"
  ur: "Awl ⁦(وراثت میں حصص کی متناسب کمی)⁩"
  tr: "Mirasta kalıtım"
  id: "Warisan dalam warisan"
issue:
  ar: "هل تُدخل الزيادة على الواحد الصحيح نقصاً على جميع الورثة أم على بعضهم، أم لا تُدخل نقصاً أصلاً؟"
summary:
  ar: "العول عند المؤلف أن تزيد أنصبة أصحاب الفروض على الواحد الصحيح، فيُدخل النقص عليهم بالمحاصة عند القائلين به، ومثاله زوج وأختان شقيقتان فيكون المجموع 7/6 {cite:usul-iqtisad-islami-0660 p. 335}. وروي عن ابن عباس ومن وافقه أنهم لا يقولون به {cite:usul-iqtisad-islami-0660 p. 336}، ويرى المؤلف أن المذهبين قائمان على العول، لكن أحدهما يُدخل النقص على الجميع والآخر على بعضهم {cite:usul-iqtisad-islami-0660 p. 336}."
  tr: "Yazara göre, 'awl', sabit paya sahip olanların paylarının geçerli olanı aşmasıdır; bu nedenle indirim, payı elinde tutanlara göre pay sahibi olarak onlara uygulanır. Bir örnek olarak bir koca ve iki kız kardeş vardır; toplam 7/6 {cite:usul-iqtisad-islami-0660 s. 335} olur. İbn Abbas ve onunla aynı fikirde olanlardan rivayet edilmiştir {cite:usul-iqtisad-islami-0660 s. 336}. Yazar, iki okulun 'awl'a dayandığını, ancak birinin eksikliği herkese, diğerinin diğerlerine uyguladığını düşünür. {cite:usul-iqtisad-islami-0660 s. 336}."
  id: "Menurut penulis, 'awl' adalah bahwa saham mereka yang memiliki saham tetap melebihi saham yang sah, sehingga pengurangan diterapkan pada mereka dengan kepemilikan saham sesuai dengan pemegangnya. Contohnya adalah seorang suami dan dua saudara perempuan, sehingga totalnya 7/6 {cite:usul-iqtisad-islami-0660 hlm. 335}. Cerita ini diceritakan oleh Ibn Abbas dan mereka yang setuju dengannya bahwa mereka tidak mengatakannya {cite:usul-iqtisad-islami-0660 hlm. 336}. Penulis percaya bahwa kedua aliran tersebut didasarkan pada 'awl, tetapi satu menerapkan kekurangan pada semua dan yang lain pada yang lain. {cite:usul-iqtisad-islami-0660 hlm. 336}."
