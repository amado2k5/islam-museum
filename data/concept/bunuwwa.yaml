id: concept/bunuwwa
class: concept
kind: ethical
label:
  ar: "البنوة"
  en: "Sonhood and daughterhood (bunuwwa)"
  fr: "Filiation des fils et des filles (bunuwwa)"
  ur: "بنوّت"
  es: "Hijos e hijas (bunuwwa)"
  tr: "evlatlık"
  id: "keputraan"
summary:
  ar: "البنوة في الإسلام هي صفة الولد والبنت بالنسبة إلى والديهما، وقد أحاطها القرآن والسنة بمنظومة متكاملة: فالولد زينة الحياة الدنيا وفتنة وابتلاء، وولادة البنت بشرى كولادة البنين عند أهل الإيمان، وبين الوالدين وأولادهما حقوق متبادلة — للوالد البر والإحسان وعلى الوالد حسن التربية والعقيقة والتسمية والإنفاق — والبنوة تقف عند حدود الشرع، فلا طاعة في معصية ولا قرابة تحجب عن الحق."
  en: "Bunuwwa — sonhood and daughterhood — is the child's standing toward its parents in Islam, a bond the Qur'an and Sunnah frame from both directions: children are the adornment of worldly life and a trial, the birth of a daughter is good news as much as a son's among the people of faith, and the bond carries reciprocal rights — kindness and reverence owed to parents, good upbringing, naming, the birth sacrifice and maintenance owed by them — while stopping at the limits of the law, for there is no obedience in sin and no kinship that screens the truth."
  fr: "La bunuwwa est la position de l’enfant envers ses parents dans l’islam, lien réciproque encadré par Coran et Sunna. Les enfants sont parure de la vie terrestre et épreuve ; la naissance d’une fille est une bonne nouvelle autant que celle d’un fils chez les croyants. Droits réciproques : bonté et respect envers les parents ; éducation, nom, sacrifice de naissance et entretien dus par eux. Ces liens restent limités par la Loi : pas d’obéissance dans le péché, ni de parenté occultant la vérité."
  ur: "اسلام میں بنوّت — بیٹا اور بیٹی ہونا — بچے کی اپنے والدین سے نسبت ہے، جسے قرآن اور سنت نے دونوں جانب سے گھیرا ہے: اولاد دنیاوی زندگی کی زینت اور آزمائش ہے، بیٹی کی پیدائش اہل ایمان کے نزدیک خوش خبری ہے جیسے بیٹے کی، اور رشتے کے دونوں سرے پر حقوق ہیں — والدین کا حسن سلوک اور بچوں کی تربیت، نام، عقیقہ اور خرچ کا حق — لیکن یہ رشتہ شریعت کی حد پر رکتا ہے: معصیت میں اطاعت نہیں اور قرابت حق پر حجاب نہیں۔"
  es: "Bunuwwa —la relación de hijo e hija— es la posición del niño hacia sus padres en el Islam, un vínculo que el Corán y la Sunnah establecen desde ambas perspectivas: los hijos son el adorno de la vida mundana y una prueba, el nacimiento de una hija es una buena noticia tanto como el de un hijo entre la gente de fe, y el vínculo conlleva derechos recíprocos: bondad y reverencia debidas a los padres, buena educación, la elección del nombre, el sacrificio del nacimiento y el sustento que ellos deben, sin dejar de estar sujetos a los límites de la ley, pues no hay obediencia en el pecado ni parentesco que oculte la verdad."
  tr: "İslam'da oğulluk, bir oğul ve kızın ebeveynlerine atfedilmesidir ve Kur'an ile Sünnet bunu kapsamlı bir sistemle kapsar: çocuk, dünyevi hayatın süsüdür, bir sınav ve sınavdır; kız doğumu, inançlı insanlara göre oğulların doğumu gibi müjdedir. Ebeveynler ve çocukların karşılıklı hakları vardır — baba doğru ve iyilikseverdir, baba iyi yetiştirilmiştir, 'akik, isim verme ve harcama'dır. Kızlık Şeriat sınırlarıyla sınırlıdır, bu yüzden günah veya akrabalıkta gerçeği gizleyen itaat yoktur."
  id: "Keputraan dalam Islam adalah atribut anak laki-laki dan perempuan kepada orang tua mereka, dan Al-Qur'an serta Sunnah merangkuminya dengan sistem yang komprehensif: anak adalah hiasan kehidupan duniawi, ujian dan ujian, dan kelahiran seorang putri adalah kabar bahagia seperti kelahiran anak laki-laki menurut umat beriman. Orang tua dan anak-anak mereka memiliki hak bersama — ayah itu benar dan penyayang, dan ayah dibesarkan dengan baik, 'aqiqah, penamaan, dan pengeluaran.' Keperempuanan terbatas pada batas Syariah, sehingga tidak ada ketaatan dalam dosa atau kekerabatan yang menyembunyikan kebenaran."
