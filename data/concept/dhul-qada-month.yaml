id: concept/dhul-qada-month
class: concept
kind: legal
label:
  ar: "شهر ذو القعدة"
  en: "Dhu al-Qa'da (the eleventh month and one of the four sacred months)"
  es: "Dhu al-Qa'da (el undécimo mes y uno de los cuatro meses sagrados)"
  fr: "Dhu al-Qa'da (le onzième mois et l'un des quatre mois sacrés)"
  ur: "ذی القعدہ ⁦(گیارہواں مہینہ اور چار حرمت والے مہینوں میں سے ایک)⁩"
summary:
  ar: "ذو القعدة حادي عشر شهور السنة وأحد الأشهر الحرم، سمي لقعود العرب فيه عن الأسفار والقتال. وفيه اعتمر النبي عمرة القضاء وعمرة الجعرانة، وهو أول أشهر الحج الثلاثة المتتابعة الحرمة. {cite:athar-baqiya-thaqafa-2008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
  en: "Dhu al-Qa'da is the eleventh month and one of the sacred months, named for the Arabs sitting out travel and fighting in it. In it the Prophet performed the 'umra of qada' and the 'umra of al-Ji'rana; it opens the three consecutive sacred months of the pilgrimage season. {cite:athar-baqiya-thaqafa-2008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
  ur: "ذوالقعدہ گیارہواں مہینہ اور حرمت والے مہینوں میں سے ایک ہے، اسے اس لیے یہ نام ملا کہ عرب اس میں سفر اور قتال سے بیٹھ جاتے تھے۔ اسی میں نبی کریم نے عمرۃ القضا اور عمرۃ الجعرانہ کیا؛ یہ حج کے تین متواتر حرمت والے مہینوں کا آغاز ہے۔ {cite:athar-baqiya-thaqafa-2008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
  es: "Dhu al-Qa'da es el undécimo mes y uno de los meses sagrados, llamado así porque los árabes se abstuvieron de viajar y luchar durante ese mes. En él, el Profeta realizó la Umrah de Qada y la Umrah de al-Ji'rana; marca el inicio de los tres meses sagrados consecutivos de la temporada de peregrinación. {cite:athar-baqiya-thaqafa-2008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
  fr: "Dhu al-Qa'da est le onzième mois et l'un des mois sacrés, ainsi nommé car les Arabes s'abstenaient de voyager et de combattre durant cette période. C'est durant ce mois que le Prophète accomplit la 'umra de qada' et la 'umra d'al-Ji'rana; il marque le début des trois mois sacrés consécutifs de la saison du pèlerinage. {cite:athar-baqiya-thaqafa-2008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
