tags: [arabiyya-browser, arabiyya-world]
label:
  ar: "تعريب العلوم والمجامع اللغوية"
  en: "Arabisation of the sciences and the language academies"
  ur: "علوم کی تعریب اور لسانی مجامع"
  fr: "L'arabisation des sciences et les académies de langue"
  es: "La arabización de las ciencias y las academias de la lengua"
summary:
  ar: "تعريب التعليم العلمي في سوريا والمغرب وصعوباته، وأدوار المجامع اللغوية في الشام ومصر والعراق والرباط، ومكتب تنسيق التعريب التابع للألكسو الذي يؤرّخه الملخص بسنة 1962 وتؤرخه وثيقة أخرى بسنة 1961، كما ينقل ملخص بحثي قُدّم إلى المتحف {cite:pmc-articles-pmc9975733} {cite:alhawary-arabic-applied-linguistics-2021}."
  en: "Arabisation of scientific teaching in Syria and Morocco and its difficulties, and the parts of the academies of Damascus, Cairo, Baghdad and Rabat, with ALECSO's Bureau for the Coordination of Arabisation, which this summary dates 1962 and another file dates 1961, as a research summary supplied to the museum reports them {cite:pmc-articles-pmc9975733} {cite:alhawary-arabic-applied-linguistics-2021}."
  ur: "سوریہ اور مراکش میں سائنسی تعلیم کی تعریب اور اس کی مشکلات، اور دمشق، قاہرہ، بغداد اور رباط کے مجامع کا کردار، الکسو کے مکتب تنسیق التعریب کے ساتھ جسے یہ خلاصہ 1962 کا اور ایک اور فائل 1961 کا بتاتی ہے، جیسا میوزیم کو دیا گیا تحقیقی خلاصہ نقل کرتا ہے {cite:pmc-articles-pmc9975733} {cite:alhawary-arabic-applied-linguistics-2021}۔"
  fr: "L'arabisation de l'enseignement scientifique en Syrie et au Maroc et ses difficultés, et le rôle des académies de Damas, du Caire, de Bagdad et de Rabat, avec le Bureau de coordination de l'arabisation de l'ALECSO, que cette synthèse date de 1962 et une autre pièce de 1961, tels que les rapporte une synthèse de recherche remise au musée {cite:pmc-articles-pmc9975733} {cite:alhawary-arabic-applied-linguistics-2021}."
  es: "La arabización de la enseñanza científica en Siria y Marruecos y sus dificultades, y el papel de las academias de Damasco, El Cairo, Bagdad y Rabat, con la Oficina de Coordinación de la Arabización de la ALECSO, que este resumen fecha en 1962 y otro archivo en 1961, tal como los recoge un resumen de investigación entregado al museo {cite:pmc-articles-pmc9975733} {cite:alhawary-arabic-applied-linguistics-2021}."
