id: concept/ittihad-al-majlis
class: concept
kind: legal
label: { ar: "اتحاد المجلس", en: "Unity of the session (ittihad al-majlis)", es: "Unidad del consistorio (ittihad al-majlis)", fr: "Unité de la séance (ittihad al-majlis)" }
summary:
  ar: "اتحاد المجلس وحدة الجلسة التي يقع فيها الكلام أو الفعل، وهو أعم من موضع الجلوس، فقد يحصل مع الوقوف ومع تغير المكان والهيئة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1475} وله أثر في التعاقد والصرف والسلم والنكاح والخلع، وفي تكرار الوضوء والقيء وسجود التلاوة، وفي تكرار الطلاق واليمين والظهار والفدية في الإحرام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1475} ويشترط الحنفية والشافعية والحنابلة اتحاد المجلس في القبول، ويقطعه الإعراض عن الإيجاب عند جميع الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1479}"
  en: "The unity of the session is the single sitting in which a word or act occurs. It is wider than the seat: it can hold while standing, and it can hold when place and posture change. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1475} It affects contracts, exchange of ribawi goods, salam, marriage and khul', the renewal of ablution, vomiting, prostration of recitation, repeated divorce, oaths, zihar and expiation in ihram. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1475} All schools agree that turning away from an offer ends the session. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1479}"
  es: "La unidad de la sesión es la única sesión en la que se pronuncia una palabra o se realiza un acto. Es más amplia que el asiento: puede mantenerse estando de pie y puede mantenerse cuando cambia el lugar y la postura. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1475} Afecta a los contratos, el intercambio de bienes ribawi, el salam, el matrimonio y el khul', la renovación de la ablución, el vómito, la postración de la recitación, el divorcio repetido, los juramentos, el zihar y la expiación en ihram. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1475} Todas las escuelas coinciden en que rechazar una oferta pone fin a la sesión. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1479}"
  fr: "L'unité de la session réside dans l'unique moment où une parole ou un acte est prononcé. Elle est plus large que le siège: elle se maintient en position debout et lors de changements de lieu et de posture. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1475} Elle concerne les contrats, les échanges de biens ribawi, le salam, le mariage et le khul', le renouvellement des ablutions, les vomissements, la prosternation lors de la récitation, les divorces répétés, les serments, le zihar et l'expiation en état d'ihram. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1475} Toutes les écoles s'accordent à dire que le fait de refuser une offre met fin à la session. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1479}"
