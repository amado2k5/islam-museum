id: concept/ittihad-al-majlis
class: concept
kind: legal
label: { ar: "اتحاد المجلس", en: "Unity of the session (ittihad al-majlis)" }
summary:
  ar: "اتحاد المجلس وحدة الجلسة التي يقع فيها الكلام أو الفعل، وهو أعم من موضع الجلوس، فقد يحصل مع الوقوف ومع تغير المكان والهيئة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1475} وله أثر في التعاقد والصرف والسلم والنكاح والخلع، وفي تكرار الوضوء والقيء وسجود التلاوة، وفي تكرار الطلاق واليمين والظهار والفدية في الإحرام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1475} ويشترط الحنفية والشافعية والحنابلة اتحاد المجلس في القبول، ويقطعه الإعراض عن الإيجاب عند جميع الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1479}"
  en: "The unity of the session is the single sitting in which a word or act occurs. It is wider than the seat: it can hold while standing, and it can hold when place and posture change. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1475} It affects contracts, exchange of ribawi goods, salam, marriage and khul', the renewal of ablution, vomiting, prostration of recitation, repeated divorce, oaths, zihar and expiation in ihram. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1475} All schools agree that turning away from an offer ends the session. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1479}"
