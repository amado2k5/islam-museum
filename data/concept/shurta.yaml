id: concept/shurta
class: concept
kind: political
label: { ar: "الشرطة في خلافة علي", en: "The police (shurta) under Ali", es: "La policía (shurta) bajo el mando de Ali", fr: "La police (shurta) sous Ali", ur: "پولیس ⁦(شورتا)⁩ علی کے ماتحت" }
summary:
  ar: "في خلافة علي كانت الشرطة وظيفة مهمة معروفة في الدولة، ومن أصحاب شرطته: أبو الهياج الأسدي، وقيس بن سعد بن عبادة، ومعقل بن قيس الرياحي، ومالك بن خبيب اليربوعي، والأصبغ بن نباتة المجاشعي، وسعيد بن سارية الخزاعي {cite:sallabi-ali-vol1 p. 272}. وكان عملهم يتجاوز الضبط إلى مساعدة المحتاج وإغاثة الملهوف وإرشاد التائه وإطعام المساكين {cite:sallabi-ali-vol1 p. 272}. وكان للسجن عنده اسم «المخيس» ويُجرى على أهله الطعام والكسوة {cite:sallabi-ali-vol1 p. 271}."
  en: "Under Ali the police were an important office. His police included Abu al-Hayyaj al-Asadi, Qays ibn Sa'd, Ma'qil ibn Qays, Malik ibn Khubayb, al-Asbagh ibn Nubata and Sa'id ibn Sariya; their work included helping the needy and feeding the poor, and prisoners were fed and clothed {cite:sallabi-ali-vol1 p. 272}."
  es: "Bajo Ali, la policía era una oficina importante. Su policía incluía a Abu al-Hayyaj al-Asadi, Qays ibn Sa'd, Ma'qil ibn Qays, Malik ibn Khubayb, al-Asbagh ibn Nubata y Sa'id ibn Sariya; su trabajo incluía ayudar a los necesitados y alimentar a los pobres, y los prisioneros eran alimentados y vestidos {cite:sallabi-ali-vol1 p. 272}."
  fr: "Sous Ali, la police était un bureau important. Sa police comprenait Abu al-Hayyaj al-Asadi, Qays ibn Sa'd, Ma'qil ibn Qays, Malik ibn Khubayb, al-Asbagh ibn Nubata et Sa'id ibn Sariya; leur travail consistait à aider les nécessiteux et à nourrir les pauvres, et les prisonniers étaient nourris et habillés {cite: sallabi-ali-vol1 p. 272}."
  ur: "علی کے دور میں پولیس ایک اہم دفتر تھی۔ اس کی پولیس میں ابو الحیاج الاسدی، قیس بن سعد، معقل بن قیس، مالک بن خبیب، الاصبغ ابن نوبتہ اور سعید بن ساریہ شامل تھے۔ ان کے کام میں ضرورت مندوں کی مدد کرنا اور غریبوں کو کھانا کھلانا شامل تھا، اور قیدیوں کو کھانا کھلانا اور کپڑے پہنائے جاتے تھے۔ 272}۔"
