id: concept/shurta
class: concept
kind: political
label: { ar: "الشرطة في خلافة علي", en: "The police (shurta) under Ali" }
summary:
  ar: "في خلافة علي كانت الشرطة وظيفة مهمة معروفة في الدولة، ومن أصحاب شرطته: أبو الهياج الأسدي، وقيس بن سعد بن عبادة، ومعقل بن قيس الرياحي، ومالك بن خبيب اليربوعي، والأصبغ بن نباتة المجاشعي، وسعيد بن سارية الخزاعي {cite:sallabi-ali-vol1 p. 272}. وكان عملهم يتجاوز الضبط إلى مساعدة المحتاج وإغاثة الملهوف وإرشاد التائه وإطعام المساكين {cite:sallabi-ali-vol1 p. 272}. وكان للسجن عنده اسم «المخيس» ويُجرى على أهله الطعام والكسوة {cite:sallabi-ali-vol1 p. 271}."
  en: "Under Ali the police were an important office. His police included Abu al-Hayyaj al-Asadi, Qays ibn Sa'd, Ma'qil ibn Qays, Malik ibn Khubayb, al-Asbagh ibn Nubata and Sa'id ibn Sariya; their work included helping the needy and feeding the poor, and prisoners were fed and clothed {cite:sallabi-ali-vol1 p. 272}."
