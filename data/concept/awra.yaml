summary:
  ar: "العورة في الفقه ما يجب ستره من بدن الإنسان؛ تعالج الموسوعة الفقهية الكويتية العورة في أبواب اللباس والصلاة والنظر، منها التبرج بإظهار العورة وحدود ما يجب ستره {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  en: "Awra in fiqh is the part of the body that must be covered; the Kuwaiti Fiqh Encyclopedia treats it across the chapters of dress, prayer and looking, including uncovering the awra and the limits of required covering {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  fr: "En fiqh, l’awra désigne les parties du corps qui doivent être couvertes ; l’Encyclopédie koweïtienne du fiqh en traite dans les chapitres sur l’habillement, la prière et le regard, notamment du dévoilement de l’awra et des limites de la couverture requise {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  es: "Awra en fiqh es la parte del cuerpo que debe cubrirse; la Enciclopedia de Fiqh de Kuwait la trata en los capítulos de vestimenta, oración y mirada, incluyendo el descubrimiento del awra y los límites de la cobertura requerida {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
