label:
  ar: "الدينارية الصغرى"
  en: "al-Dinariyya al-Sughra (the lesser Dinar case in inheritance)"
  ur: "دیناریہ صغریٰ (وراثت کا ایک مشہور مسئلہ)"
summary:
  ar: "الدينارية الصغرى مسألة من المسائل الملقبات في المواريث، صورها الفقهاء في إرث ينحصر في سبع عشرة أنثى: ثلاث زوجات، وجدتان، وأربع أخوات لأم، وثماني أخوات شقيقات أو لأب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8361} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8362} أصل المسألة اثنا عشر وتعول إلى سبعة عشر، وتلقب بالدينارية لأن ميتا ترك سبعة عشر دينارا فخص كل وارثة دينار، ولها ألقاب أخرى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8362} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8363}"
  en: "The Lesser Dinar is a named problem in inheritance: the estate passes to seventeen women, three wives, two grandmothers, four maternal sisters and eight full or paternal sisters. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8361} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8362} Its base is twelve, raised by the rule of increase (awl) to seventeen; it is called the Dinar case because a deceased left seventeen dinars and each woman received one. It has other names. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8362} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8363}"
  ur: "دیناریہ صغریٰ وراثت کے ان ناموں والے مسائل میں سے ہے جن کا ایک خاص لقب ہے۔ اس میں سترہ عورتیں وارث ہیں، اور اصل مسئلہ بارہ سے بڑھ کر سترہ ہو جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8361} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8362}"
