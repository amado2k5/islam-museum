id: concept/dinariyya-sughra
class: concept
kind: legal
label:
  ar: "الدينارية الصغرى"
  en: "al-Dinariyya al-Sughra (the lesser Dinar case in inheritance)"
  ur: "دیناریہ صغریٰ ⁦(وراثت کا ایک مشہور مسئلہ)⁩"
  es: "al-Dinariyya al-Sughra (el caso del dinar menor en herencia)"
  fr: "al-Dinariyya al-Sughra (le cas du moindre Dinar en héritage)"
summary:
  ar: "الدينارية الصغرى مسألة من المسائل الملقبات في المواريث، صورها الفقهاء في إرث ينحصر في سبع عشرة أنثى: ثلاث زوجات، وجدتان، وأربع أخوات لأم، وثماني أخوات شقيقات أو لأب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8361} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8362} أصل المسألة اثنا عشر وتعول إلى سبعة عشر، وتلقب بالدينارية لأن ميتا ترك سبعة عشر دينارا فخص كل وارثة دينار، ولها ألقاب أخرى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8362} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8363}"
  en: "The Lesser Dinar is a named problem in inheritance: the estate passes to seventeen women, three wives, two grandmothers, four maternal sisters and eight full or paternal sisters. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8361} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8362} Its base is twelve, raised by the rule of increase (awl) to seventeen; it is called the Dinar case because a deceased left seventeen dinars and each woman received one. It has other names. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8362} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8363}"
  ur: "دیناریہ صغریٰ وراثت کے ان ناموں والے مسائل میں سے ہے جن کا ایک خاص لقب ہے۔ اس میں سترہ عورتیں وارث ہیں، اور اصل مسئلہ بارہ سے بڑھ کر سترہ ہو جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8361} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8362}"
  es: "El dinar menor es un problema específico en materia de herencia: la herencia se reparte entre diecisiete mujeres: tres esposas, dos abuelas, cuatro hermanas maternas y ocho hermanas paternas o de padre y madre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8361} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8362} Su base es doce, que se incrementa a diecisiete mediante la regla de aumento (awl); se denomina caso del dinar porque el difunto dejó diecisiete dinares y cada mujer recibió uno. Tiene otros nombres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8362} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8363}"
  fr: "Le « petit dinar » est un cas particulier de succession: le patrimoine est transmis à dix-sept femmes: trois épouses, deux grands-mères, quatre sœurs maternelles et huit sœurs germaines ou paternelles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8361} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8362} Sa base est de douze, augmentée à dix-sept par la règle de l’accroissement (awl). On l’appelle « cas du dinar » car le défunt laissait dix-sept dinars et chaque femme en recevait un. Il porte d’autres noms. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8362} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8363}"
