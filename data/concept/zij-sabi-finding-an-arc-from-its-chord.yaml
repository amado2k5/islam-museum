label: { ar: "تقويس الأوتار: معرفة القوس من وترها في الزيج الصابي", en: "Finding an arc from its chord (taqwis al-awtar)", ur: "اوتار کی تقویس: وتر سے قوس معلوم کرنا", es: "Encontrar un arco a partir de su cuerda (taqwis al-awtar)" }
summary:
  ar: "يعلّم البتاني طريقة العكس: لمن أراد القوس من وتر معلوم يطلب مثل الوتر في جدول الأوتار، فحيث أصاب مثله أو أقرب إليه مما هو أقل منه أخذ ما بإزائه من العدد في السطر الأول، ثم يُنقص الوتر الذي أصاب من وتره فيضرب الفضل في ثلاثين دقيقة ويقسم على فضل ما بين الوتر الذي أصاب والوتر التالي، ويُضاف الخارج إلى القوس المحفوظة. ويسمي هذا الباب تقويس الأوتار. {cite:zij-sabi-nallino-byblion p.20}."
  en: "Al-Battani teaches the reverse: whoever wants the arc of a known chord looks for the chord's like in the table, and where he finds it or what is nearest below it takes what faces it in the first row of numbers; then he subtracts the chord found from his own, multiplies the remainder by thirty minutes, divides by the difference between the found chord and the next one, and adds the result to the kept arc. He names this operation taqwis al-awtar. {cite:zij-sabi-nallino-byblion p.20}."
  ur: "البتانی الٹی ترکیب سکھاتے ہیں: جو شخص معلوم وتر سے قوس معلوم کرنا چاہے وہ جدول میں وتر کا مثل ڈھونڈے اور جہاں اس کا مثل یا اس سے کم میں قریب ترین پائے وہاں اعداد کی پہلی سطر میں مقابل عدد لے؛ پھر ملے ہوئے وتر کو اپنے وتر سے گھٹائے، فرق کو تیس دقیقوں سے ضرب دے، ملے ہوئے وتر اور اس کے بعد والے وتر کے فرق پر تقسیم کرے اور خارج کو محفوظ قوس میں جمع کرے۔ وہ اس عمل کو تقویس الاوتار کا نام دیتے ہیں۔ {cite:zij-sabi-nallino-byblion p.20}۔"
  es: "Al-Battani enseña el procedimiento inverso: quien desee el arco de una cuerda conocida busca su equivalente en la tabla periódica y, donde lo encuentre o donde esté más cerca en la tabla, toma el número que le corresponde en la primera fila. Luego, resta la cuerda encontrada de la suya, multiplica el resultado por treinta minutos, lo divide por la diferencia entre la cuerda encontrada y la siguiente, y suma el resultado al arco conservado. A esta operación la denomina taqwis al-awtar. {cite:zij-sabi-nallino-byblion p.20}."
