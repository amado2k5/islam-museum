id: concept/canon-treating-frostbitten-limbs
class: concept
kind: scientific
label: { ar: "علاج الطرف الذي أصابه البرد", en: "Treating frostbitten limbs in the Canon", ur: "سردی لگے ہوئے عضو کا علاج قانون میں", es: "Tratamiento de extremidades congeladas en el Canon", fr: "Traitement des gelures aux membres dans le Canon", tr: "Soğuktan etkilenen tarafın tedavisi", id: "Pengobatan sisi yang terkena flu" }
summary:
  ar: "يفرق ابن سينا بين طرف ضربه البرد ولم يعفن بعد فيوضع في ماء الثلج أو ماء طبخ فيه التين ويحرك ويدلك ويطلى بالتردوغ، وطرف مات حاره الغريزي وتعرض للعفونة فيعالج كالقروح الأكالة، وطرف أخذ يكمد فيشرط ويسيل منه الدم في ماء حار ثم يطلى بالطين الأرمني والخل، وإذا بلغ التعفن أسقط ما يعفن بعجلة {cite:canon-ibn-sina-print-v1 pp.264-265}."
  en: "Ibn Sina distinguishes a limb struck by cold but not yet putrid, set in snow water or water in which figs were boiled and moved, rubbed and coated; a limb whose innate heat has died and which is open to putrefaction, treated like eating ulcers; and a limb that has begun to darken, which is scarified and bled in hot water and then coated with Armenian bole and vinegar; once rot has set in, what rots is removed promptly {cite:canon-ibn-sina-print-v1 pp.264-265}."
  es: "Ibn Sina distingue una extremidad afectada por el frío pero aún no putrefacta, que se coloca en agua de nieve o agua en la que se hirvieron higos y se movió, frotó y cubrió; una extremidad cuyo calor innato ha muerto y que está abierta a la putrefacción, tratada como si se tratara de úlceras comestibles; y una extremidad que ha comenzado a oscurecerse, que se escarifica y sangra en agua caliente y luego se cubre con bole armenio y vinagre; una vez que la podredumbre se ha establecido, lo que se pudre se elimina rápidamente {cite:canon-ibn-sina-print-v1 pp.264-265}."
  fr: "Ibn Sina distingue un membre frappé par le froid mais pas encore putréfié, placé dans de l'eau de neige ou de l'eau dans laquelle des figues ont été bouillies et remuées, frottées et enduites; un membre dont la chaleur innée est morte et qui est ouvert à la putréfaction, traité comme des ulcères mangeurs; et un membre qui a commencé à noircir, qui est scarifié et saigné dans de l'eau chaude puis enduit de bol arménien et de vinaigre; une fois la pourriture installée, ce qui pourrit est rapidement enlevé {cite:canon-ibn-sina-print-v1 pp.264-265}."
  ur: "ابن سینا نے ایک ایسے عضو کی تمیز کی ہے جو سردی سے متاثر ہوتا ہے لیکن ابھی تک گرا ہوا نہیں ہے، جسے برف کے پانی یا پانی میں رکھا جاتا ہے جس میں انجیر کو ابال کر منتقل کیا جاتا تھا، رگڑا اور لیپ کیا جاتا تھا۔ ایک اعضاء جس کی فطری حرارت مر گئی ہو اور جو پھٹنے کے لیے کھلا ہو، کھانے کے السر جیسا سلوک کیا جاتا ہے۔ اور ایک اعضاء جو سیاہ ہونا شروع ہو گیا ہے، جسے گرم پانی میں داغ دیا جاتا ہے اور اس کے بعد آرمینیائی بول اور سرکہ کے ساتھ لیپت کیا جاتا ہے۔ ایک بار روٹ لگنے کے بعد، کون سی سڑ کو فوری طور پر ہٹا دیا جاتا ہے {حوالہ:کینن-ابن-سینا-پرنٹ-v1 صفحہ 264-265}۔"
  tr: "İbn Sina, soğuk tarafından vurulmuş ve henüz çürümemiş bir ucu buzlu suya veya incir şeklinde pişirilmiş suya konan, karıştırılmış, ovulmuş ve tardug ile kaplanmış; diğer ucu içgüdüsel olarak sıcak ölmüş ve çürümeye maruz kalmış, aşındırıcı yaralar gibi tedavi edilmiş; diğer ucu sıkıştırılmış ve şartlandırılmış, kanı sıcak suda aktırmış, ardından Ermeni kili ve sirkesiyle kaplanmıştır. Çürümüş olanı hızla bırakmıştır {cite:canon-ibn-sina-print-v1 s.264-265}."
  id: "Ibn Sina membedakan antara satu ujung yang terkena dingin dan belum membusuk, diletakkan dalam air es atau air yang dimasak dengan buah ara, diaduk, digosok, dan dilapisi tardug; satu ujung yang mati panas secara naluriah dan terpapar pembusukan, diperlakukan seperti luka korosif; dan ujung lainnya ditekan dan dikondisikan, menyebabkan darah mengalir dalam air panas, lalu dilapisi tanah liat Armenia dan cuka. Ketika membusuk, ia dengan cepat menjatuhkan apa yang membusuk {cite:canon-ibn-sina-print-v1 hlm.264-265}."
