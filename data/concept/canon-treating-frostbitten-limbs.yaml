label: { ar: "علاج الطرف الذي أصابه البرد", en: "Treating frostbitten limbs in the Canon", ur: "سردی لگے ہوئے عضو کا علاج قانون میں" }
summary:
  ar: "يفرق ابن سينا بين طرف ضربه البرد ولم يعفن بعد فيوضع في ماء الثلج أو ماء طبخ فيه التين ويحرك ويدلك ويطلى بالتردوغ، وطرف مات حاره الغريزي وتعرض للعفونة فيعالج كالقروح الأكالة، وطرف أخذ يكمد فيشرط ويسيل منه الدم في ماء حار ثم يطلى بالطين الأرمني والخل، وإذا بلغ التعفن أسقط ما يعفن بعجلة {cite:canon-ibn-sina-print-v1 pp.264-265}."
  en: "Ibn Sina distinguishes a limb struck by cold but not yet putrid, set in snow water or water in which figs were boiled and moved, rubbed and coated; a limb whose innate heat has died and which is open to putrefaction, treated like eating ulcers; and a limb that has begun to darken, which is scarified and bled in hot water and then coated with Armenian bole and vinegar; once rot has set in, what rots is removed promptly {cite:canon-ibn-sina-print-v1 pp.264-265}."
