summary:
  ar: "الحلبيب دواء هندي يشبه السورنجان الأبيض، حار يابس في الثانية، ينفع شربه من النقرس وأوجاع المفاصل، ويسهّل البلغم والديدان وحبّ القرع والأخلاط الغليظة."
  en: "Halbib is an Indian drug resembling white surankan. It is hot and dry in the second degree. Drunk, it helps gout and joint pains, and purges phlegm, worms, pumpkin-seed-like worms and thick humours."
  ur: "حلبیب ایک ہندی دوا ہے جو سفید سورنجان سے ملتی جلتی ہے، دوسرے درجے میں گرم اور خشک۔ پینے سے گٹھیا اور جوڑوں کے درد میں نفع دیتی ہے، اور بلغم، کیڑے، کدو کے بیج جیسے کیڑوں اور گاڑھے اخلاط کو نکالتی ہے۔"
  es: "Halbib es un medicamento indio similar al surankan blanco. Es de naturaleza cálida y seca de segundo grado. Al tomarlo, ayuda a aliviar la gota y los dolores articulares, y expulsa la flema, los parásitos intestinales, los gusanos con forma de semilla de calabaza y los humores espesos."
  fr: "L'halbib est une drogue indienne ressemblant au surankan blanc. Elle est chaude et sèche au deuxième degré. Ingérée, elle soulage la goutte et les douleurs articulaires, et purifie les mucosités, les vers, les vers ressemblant à des graines de courge et les humeurs épaisses."
