  id: "Amal yang Berkelanjutan"
summary:
  ar: "يذكر الشيخ عمر عبد الكافي أن ثواب الغرس يتصل ما دام منه يأكل إنسان أو طائر، أو يستظل به مخلوق. ويرى أن تعليم العلم النافع وبناء المسجد وكتابة المصحف وإنشاء المكتبة الخيرية من أبواب الصدقة التي يصل ثوابها بعد الموت. ويذكر مشروعا خيريا لرعاية اليتامى في محافظة الجيزة."
  en: "Sheikh Omar Abdelkafy says that the reward of planting continues for whatever eats from it or shelters under it. He holds that teaching beneficial knowledge, building a mosque, writing a copy of the Qur'an, and founding a library or a school bring reward after death. He also describes a charitable project for orphans in Giza governorate."
  ur: "شیخ عمر عبدالکافی کہتے ہیں کہ درخت لگانے کا ثواب اس وقت تک جاری رہتا ہے جب تک اس سے کوئی انسان یا پرندہ کھائے یا اس کے سائے میں کوئی مخلوق بیٹھے۔ ان کے نزدیک نفع بخش علم سکھانا، مسجد بنانا، قرآن کا نسخہ لکھوانا، اور لائبریری یا اسکول قائم کرنا ایسے کام ہیں جن کا ثواب موت کے بعد بھی پہنچتا ہے۔ وہ گیزہ کے گورنریٹ میں یتیموں کے ایک خیراتی منصوبے کا بھی ذکر کرتے ہیں۔"
  es: "El jeque Omar Abdelkafy afirma que la recompensa de sembrar perdura para todo aquel que se alimenta de sus frutos o se refugia bajo ellos. Sostiene que impartir conocimientos útiles, construir una mezquita, transcribir el Corán y fundar una biblioteca o una escuela traen recompensa después de la muerte. También describe un proyecto benéfico para huérfanos en la gobernación de Giza."
  fr: "Le cheikh Omar Abdelkafy affirme que la récompense de la plantation se poursuit pour tout ce qui s'en nourrit ou s'y abrite. Il soutient que transmettre un savoir bénéfique, construire une mosquée, recopier le Coran et fonder une bibliothèque ou une école apportent une récompense après la mort. Il décrit également un projet caritatif en faveur des orphelins du gouvernorat de Gizeh."
  tr: "Şeyh Ömer Abdülkafi, ekim ödülünün, bir kişi veya kuş tarafından yemek ya da bir canlının gölgesinde kalmak için kullanıldığı sürece bağlı olduğunu belirtir. Faydalı bilgi öğretmek, cami inşa etmek, Kur'an yazmak ve hayırsever kütüphane kurmak, ödülü ölümden sonra ulaşan hayır kurumları arasında yer alır. Giza Valiliği'nde yetimlere bakmak için yürütülen bir hayır projesinden bahseder."
  id: "Sheikh Omar Abdel Kafi menyebutkan bahwa hadiah untuk menanam terkait selama digunakan untuk dimakan oleh manusia atau burung, atau untuk dibayangi oleh makhluk. Ia percaya bahwa mengajarkan pengetahuan yang bermanfaat, membangun masjid, menulis Al-Quran, dan mendirikan perpustakaan amal adalah beberapa bentuk amal yang imbalannya bisa dicapai setelah kematian. Ia menyebutkan sebuah proyek amal untuk merawat anak yatim di Gubernur Giza."
