label:
  ar: "الصدقة الجارية"
  en: "Ongoing charity (sadaqa jariya)"
  ur: "صدقہ جاریہ"
summary:
  ar: "يذكر الشيخ عمر عبد الكافي أن ثواب الغرس يتصل ما دام منه يأكل إنسان أو طائر، أو يستظل به مخلوق. ويرى أن تعليم العلم النافع وبناء المسجد وكتابة المصحف وإنشاء المكتبة الخيرية من أبواب الصدقة التي يصل ثوابها بعد الموت. ويذكر مشروعا خيريا لرعاية اليتامى في محافظة الجيزة."
  en: "Sheikh Omar Abdelkafy says that the reward of planting continues for whatever eats from it or shelters under it. He holds that teaching beneficial knowledge, building a mosque, writing a copy of the Qur'an, and founding a library or a school bring reward after death. He also describes a charitable project for orphans in Giza governorate."
  ur: "شیخ عمر عبدالکافی کہتے ہیں کہ درخت لگانے کا ثواب اس وقت تک جاری رہتا ہے جب تک اس سے کوئی انسان یا پرندہ کھائے یا اس کے سائے میں کوئی مخلوق بیٹھے۔ ان کے نزدیک نفع بخش علم سکھانا، مسجد بنانا، قرآن کا نسخہ لکھوانا، اور لائبریری یا اسکول قائم کرنا ایسے کام ہیں جن کا ثواب موت کے بعد بھی پہنچتا ہے۔ وہ گیزہ کے گورنریٹ میں یتیموں کے ایک خیراتی منصوبے کا بھی ذکر کرتے ہیں۔"
