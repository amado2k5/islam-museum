label: { ar: "نصفا قطر القمر والظل في الكسوف", en: "The corrected diameter of the Moon and the radius of its shadow", ur: "چاند اور اس کے سائے کے قطر کی تصحیح", es: "El diámetro corregido de la Luna y el radio de su sombra.", fr: "Le diamètre corrigé de la Lune et le rayon de son ombre" }
summary:
  ar: "يبدأ الحساب بتصحيح قطر القمر من قدره المعروف بإضافة ما يُؤخذ من الجدول الثالث، وهو جدول الدقائق المرسوم بإزاء حاصة القمر. ويُصحَّح قطر الظل بالطريقة نفسها بإضافة دقائق من الجدول إلى عدد ثابت من الدقائق يذكره النص. ثم يُجمع نصف قطر القمر المعدّل ونصف قطر الظل المعدّل ويُنصَّف الناتج، فيخرج نصف القطرين الذي تُقاس به الكسوف. {cite:zij-sabi-nallino-byblion pp.150-151}"
  en: "The calculation begins by correcting the Moon's diameter from its known size, adding the minutes taken from the third table, the table of minutes set against the Moon's corrected anomaly. The shadow's radius is corrected in the same way, adding table minutes to a fixed number of minutes that the text gives. The corrected half-radii are then combined and halved to yield the half-sum of the two radii, the measure against which the Moon's latitude is compared. {cite:zij-sabi-nallino-byblion pp.150-151}"
  ur: "حساب چاند کے قطر کی اصل مقدار کو درست کر کے شروع ہوتا ہے، اس میں تیسرے جدول سے نکالے گئے دقائق جمع کیے جاتے ہیں، جو چاند کی تصحیح شدہ خاصہ کے مقابل درج ہیں۔ سائے کا نصف قطر اسی طرح درست ہوتا ہے، اور جدول کے دقائق متن میں دیے گئے ایک مقررہ عدد میں جمع کیے جاتے ہیں۔ پھر دونوں تصحیح شدہ نصف قطروں کو ملا کر آدھا کیا جاتا ہے، اور یہ نصف المجموع وہ پیمانہ ہے جس سے چاند کا عرض جانچا جاتا ہے۔ {cite:zij-sabi-nallino-byblion pp.150-151}"
  es: "El cálculo comienza corrigiendo el diámetro de la Luna a partir de su tamaño conocido, sumando los minutos tomados de la tercera tabla, la tabla de minutos comparada con la anomalía corregida de la Luna. El radio de la sombra se corrige de la misma manera, sumando los minutos de la tabla a un número fijo de minutos que se indica en el texto. Los semirradios corregidos se combinan y se dividen por la mitad para obtener la mitad de la suma de los dos radios, la medida con la que se compara la latitud de la Luna. {cite:zij-sabi-nallino-byblion pp.150-151}"
  fr: "Le calcul commence par la correction du diamètre lunaire à partir de sa taille connue, en ajoutant les minutes tirées de la troisième table, la table des minutes appliquée à l'anomalie lunaire corrigée. Le rayon de l'ombre est corrigé de la même manière, en ajoutant les minutes de la table à un nombre fixe de minutes indiqué dans le texte. Les demi-rayons corrigés sont ensuite combinés et divisés par deux pour obtenir la demi-somme des deux rayons, la mesure par rapport à laquelle la latitude lunaire est comparée. {cite:zij-sabi-nallino-byblion pp.150-151}"
