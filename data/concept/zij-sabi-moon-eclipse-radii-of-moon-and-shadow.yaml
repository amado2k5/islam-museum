label: { ar: "نصفا قطر القمر والظل في الكسوف", en: "The corrected diameter of the Moon and the radius of its shadow", ur: "چاند اور اس کے سائے کے قطر کی تصحیح" }
summary:
  ar: "يبدأ الحساب بتصحيح قطر القمر من قدره المعروف بإضافة ما يُؤخذ من الجدول الثالث، وهو جدول الدقائق المرسوم بإزاء حاصة القمر. ويُصحَّح قطر الظل بالطريقة نفسها بإضافة دقائق من الجدول إلى عدد ثابت من الدقائق يذكره النص. ثم يُجمع نصف قطر القمر المعدّل ونصف قطر الظل المعدّل ويُنصَّف الناتج، فيخرج نصف القطرين الذي تُقاس به الكسوف. {cite:zij-sabi-nallino-byblion pp.150-151}"
  en: "The calculation begins by correcting the Moon's diameter from its known size, adding the minutes taken from the third table, the table of minutes set against the Moon's corrected anomaly. The shadow's radius is corrected in the same way, adding table minutes to a fixed number of minutes that the text gives. The corrected half-radii are then combined and halved to yield the half-sum of the two radii, the measure against which the Moon's latitude is compared. {cite:zij-sabi-nallino-byblion pp.150-151}"
  ur: "حساب چاند کے قطر کی اصل مقدار کو درست کر کے شروع ہوتا ہے، اس میں تیسرے جدول سے نکالے گئے دقائق جمع کیے جاتے ہیں، جو چاند کی تصحیح شدہ خاصہ کے مقابل درج ہیں۔ سائے کا نصف قطر اسی طرح درست ہوتا ہے، اور جدول کے دقائق متن میں دیے گئے ایک مقررہ عدد میں جمع کیے جاتے ہیں۔ پھر دونوں تصحیح شدہ نصف قطروں کو ملا کر آدھا کیا جاتا ہے، اور یہ نصف المجموع وہ پیمانہ ہے جس سے چاند کا عرض جانچا جاتا ہے۔ {cite:zij-sabi-nallino-byblion pp.150-151}"
