summary:
  ar: "القنابري في الكتاب حار في الأولى لطيف جلاء مقطع، يجلو الكلف والبهق وينفع ضمادا من القروح الخبيثة في الثدي، ويفتح سدد الرئة والكبد والطحال، وضماد للسع الهوام {cite:canon-ibn-sina-print-v1 p.652}"
  en: "Qanabiri is in the book hot in the first degree, subtle, cleansing and cutting; it clears freckles and vitiligo, is a poultice for malignant ulcers of the breast, opens obstructions of the lung, liver and spleen, and is a poultice for the stings of vermin {cite:canon-ibn-sina-print-v1 p.652}"
  ur: "قنابری کتاب میں پہلے درجے میں گرم، لطیف، جلا دینے والا اور کاٹنے والا ہے؛ جھائیں اور برص کو صاف کرتا ہے، چھاتی کے خبیث قرحوں پر لیپ کے طور پر نافع ہے، پھیپھڑے، جگر اور تلی کی رکاوٹیں کھولتا ہے، اور ہر طرح کے زہریلے کیڑوں کے ڈنک پر لیپ ہے {cite:canon-ibn-sina-print-v1 p.652}۔"
