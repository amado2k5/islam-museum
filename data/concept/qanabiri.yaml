summary:
  ar: "القنابري في الكتاب حار في الأولى لطيف جلاء مقطع، يجلو الكلف والبهق وينفع ضمادا من القروح الخبيثة في الثدي، ويفتح سدد الرئة والكبد والطحال، وضماد للسع الهوام {cite:canon-ibn-sina-print-v1 p.652}"
  en: "Qanabiri is in the book hot in the first degree, subtle, cleansing and cutting; it clears freckles and vitiligo, is a poultice for malignant ulcers of the breast, opens obstructions of the lung, liver and spleen, and is a poultice for the stings of vermin {cite:canon-ibn-sina-print-v1 p.652}"
  ur: "قنابری کتاب میں پہلے درجے میں گرم، لطیف، جلا دینے والا اور کاٹنے والا ہے؛ جھائیں اور برص کو صاف کرتا ہے، چھاتی کے خبیث قرحوں پر لیپ کے طور پر نافع ہے، پھیپھڑے، جگر اور تلی کی رکاوٹیں کھولتا ہے، اور ہر طرح کے زہریلے کیڑوں کے ڈنک پر لیپ ہے {cite:canon-ibn-sina-print-v1 p.652}۔"
  es: "En el libro, Qanabiri es caliente en primer grado, sutil, purificador y cortante; elimina las pecas y el vitíligo, es un emplasto para las úlceras malignas del pecho, desbloquea las obstrucciones del pulmón, el hígado y el bazo, y es un emplasto para las picaduras de parásitos {cite:canon-ibn-sina-print-v1 p.652}"
  fr: "Le Qanabiri est décrit dans le livre comme étant chaud au premier degré, subtil, purifiant et tranchant; il atténue les taches de rousseur et le vitiligo, sert de cataplasme pour les ulcères malins du sein, débloque les obstructions des poumons, du foie et de la rate, et est un cataplasme contre les piqûres de vermine {cite:canon-ibn-sina-print-v1 p.652}"
  tr: "Kitaptaki el-Qanabari, ilk bölümde ateşlidir; nazikçe çıkarılır ve melazma ile vitiligoyu temizler, memedeki kötü huylu yaralar için pansuman görevi görür, akciğerlerin, karaciğerin ve dalağın kapağını açar ve zararlıların sokmasına karşı pansuman görevi görür {cite:canon-ibn-sina-print-v1 s.652}"
  id: "Al-Qanabari dalam buku ini panas di bagian pertama, dengan pengangkatan yang lembut, dan luka yang membersihkan melasma dan vitiligo, berfungsi sebagai perban untuk luka ganas di payudara, membuka katup paru-paru, hati, dan limpa, serta berfungsi sebagai perban untuk sengatan hama {cite:canon-ibn-sina-print-v1 hlm.652}"
