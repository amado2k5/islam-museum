label:
  ar: القيم الاقتصادية في الإسلام
  en: Values of the Islamic economy
summary:
  ar: 'يعدّد المؤلف قيم الاقتصاد الإسلامي: العدالة، والحرية، والشورى، والصبر، والتوكل، والمسؤولية الفردية، والمسؤولية الجماعية، والاستقلالية عن التقليد الأعمى {cite:usul-iqtisad-islami-0660 p. 36} {cite:usul-iqtisad-islami-0660 p. 37}. فالعدل عنده مطلوب في الحكم والإدارة والمعاوضات، وآثاره واضحة في التوزيع، والإحسان في إعادة التوزيع {cite:usul-iqtisad-islami-0660 p. 37}. والشورى مبدأ اقتصادي إداري اجتماعي إلى جانب كونها مبدأ سياسيًّا {cite:usul-iqtisad-islami-0660 p. 38} {cite:usul-iqtisad-islami-0660 p. 39}. والتوكل لا يكون إلا بعد العلم والعمل واتخاذ الأسباب {cite:usul-iqtisad-islami-0660 p. 41}. ويقرر أن المسؤولية الفردية تشمل فروض العين، والجماعية تشمل فروض الكفاية، فإذا لم يقم بها أحد أو قام بها عدد لا يكفي أثم الجميع {cite:usul-iqtisad-islami-0660 p. 42}. ويحذّر من التقليد الأعمى للغير، ويرى أن الأمة إن لم تكن لها شخصية أصيلة فإنها تذوب في الحضارات الأخرى {cite:usul-iqtisad-islami-0660 p. 42} {cite:usul-iqtisad-islami-0660 p. 43} {cite:usul-iqtisad-islami-0660 p. 44}.'
