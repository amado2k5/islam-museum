label:
  ar: القيم الاقتصادية في الإسلام
  en: Values of the Islamic economy
  es: "Valores de la economía islámica"
  fr: "Valeurs de l'économie islamique"
  ur: "اسلامی معیشت کی اقدار"
  tr: "İslam'da Ekonomik Değerler"
  id: "Nilai-nilai Ekonomi dalam Islam"
summary:
  ar: 'يعدّد المؤلف قيم الاقتصاد الإسلامي: العدالة، والحرية، والشورى، والصبر، والتوكل، والمسؤولية الفردية، والمسؤولية الجماعية، والاستقلالية عن التقليد الأعمى {cite:usul-iqtisad-islami-0660 p. 36} {cite:usul-iqtisad-islami-0660 p. 37}. فالعدل عنده مطلوب في الحكم والإدارة والمعاوضات، وآثاره واضحة في التوزيع، والإحسان في إعادة التوزيع {cite:usul-iqtisad-islami-0660 p. 37}. والشورى مبدأ اقتصادي إداري اجتماعي إلى جانب كونها مبدأ سياسيًّا {cite:usul-iqtisad-islami-0660 p. 38} {cite:usul-iqtisad-islami-0660 p. 39}. والتوكل لا يكون إلا بعد العلم والعمل واتخاذ الأسباب {cite:usul-iqtisad-islami-0660 p. 41}. ويقرر أن المسؤولية الفردية تشمل فروض العين، والجماعية تشمل فروض الكفاية، فإذا لم يقم بها أحد أو قام بها عدد لا يكفي أثم الجميع {cite:usul-iqtisad-islami-0660 p. 42}. ويحذّر من التقليد الأعمى للغير، ويرى أن الأمة إن لم تكن لها شخصية أصيلة فإنها تذوب في الحضارات الأخرى {cite:usul-iqtisad-islami-0660 p. 42} {cite:usul-iqtisad-islami-0660 p. 43} {cite:usul-iqtisad-islami-0660 p. 44}.'
  tr: "Yazar, İslami ekonominin değerlerini sıralar: adalet, özgürlük, danışma, sabır, Tanrı'ya güvenme, bireysel sorumluluk, kolektif sorumluluk ve kör taklitten bağımsızlık {cite:usul-iqtisad-islami-0660 s. 36} {cite:usul-iqtisad-islami-0660 s. 37}. Onun için adalet, yönetim, idari ve yerleşimlerde gereklidir ve etkileri dağıtımda ve yeniden dağıtımda iyilikseverlikte açıktır {cite:usul-iqtisad-islami-0660 s. 37}. Şura, siyasi bir ilke olmasının yanı sıra ekonomik, idari ve sosyal bir ilkedir {cite:usul-iqtisad-islami-0660 s. 38} {cite:usul-iqtisad-islami-0660 s. 39}. Tanrı'ya güvenmek ancak bilgi, eylem ve gerekli araçları aldıktan sonra ortaya çıkar. {cite:usul-iqtisad-islami-0660 s. 41}. Bireysel sorumluluğun gözün yükümlülüklerini, kolektif yükümlülüklerin ise toplumsal yükümlülükleri içerdiğini belirtir; kimse yerine getirmezse veya bir sayı yerine getirmezse, tüm günah yeterli değildir {cite:usul-iqtisad-islami-0660 s. 42}. Başkalarını körü körüne taklit etmemesi konusunda uyarır ve bir ulusun özgün bir karakteri yoksa, diğer medeniyetlerde çözüldüğüne inanır {cite:usul-iqtisad-islami-0660 s. 42} {cite:usul-iqtisad-islami-0660 s. 43} {cite:usul-iqtisad-islami-0660 s. 44}."
  id: "Penulis merinci nilai-nilai ekonomi Islam: keadilan, kebebasan, konsultasi, kesabaran, ketergantungan pada Tuhan, tanggung jawab individu, tanggung jawab kolektif, dan kemandirian dari peniruan buta {cite:usul-iqtisad-islami-0660 hlm. 36} {cite:usul-iqtisad-islami-0660 hlm. 37}. Bagi dia, keadilan diperlukan dalam pemerintahan, administrasi, dan pemukiman, dan dampaknya jelas dalam distribusi, serta kebaikan dalam redistribusi {cite:usul-iqtisad-islami-0660 hlm. 37}. Shura adalah prinsip ekonomi, administratif, dan sosial selain menjadi prinsip politik {cite:usul-iqtisad-islami-0660 hlm. 38} {cite:usul-iqtisad-islami-0660 hlm. 39}. Ketergantungan pada Tuhan hanya terjadi setelah pengetahuan, tindakan, dan mengambil cara yang diperlukan. {cite:usul-iqtisad-islami-0660 hlm. 41}. Ia menyatakan bahwa tanggung jawab individu mencakup kewajiban mata, dan kewajiban kolektif mencakup kewajiban komunalitas; jika tidak ada yang memenuhinya atau jika sejumlah tidak memenuhinya, dosa semua tidak cukup {cite:usul-iqtisad-islami-0660 hlm. 42}. Ia memperingatkan agar tidak meniru orang lain secara buta dan percaya bahwa jika suatu bangsa tidak memiliki karakter otentik, maka bangsa itu akan larut di peradaban lain {cite:usul-iqtisad-islami-0660 hlm. 42} {cite:usul-iqtisad-islami-0660 hlm. 43} {cite:usul-iqtisad-islami-0660 hlm. 44}."
