id: "concept/al-naffakhat"
class: "concept"
kind: "scientific"
label:
  ar: "النفاخات في العين"
  en: "Watery bladders in the eye (naffakhat)"
  fr: "Les vésicules aqueuses de l'œil (naffakhat)"
  ur: "آنکھ میں نفاخات"
summary:
  ar: "قد يحدث في العين نفاخات مائية في بعض قشور القرنية التي هي أربع طباق عند قوم وعند الباقين ثلاث فتحتقن هذه المائية بين قشرين وتختلف مواضعها ومقدارها وكيفها ولونها وقوامها وعذوبتها وحدتها وأكالها، وأغورها أردؤها، وعلاجها ما دامت صغيرة بالأدوية المجففة وإذا كبرت فبالحديد أي بالشق بالمبضع {cite:canon-ibn-sina-print-v2 p.176} {cite:canon-ibn-sina-print-v2 p.177}"
  en: "Watery bladders may arise in some of the cornea's coats — four by some, three by the rest — the water congesting between two coats, differing in site, size, quality, colour, consistency, mildness, sharpness and eating; the deepest is the worst; while small they are treated with the drying drugs, when large with the knife — that is, lancing with the scalpel {cite:canon-ibn-sina-print-v2 p.176} {cite:canon-ibn-sina-print-v2 p.177}"
  fr: "Des vésicules aqueuses peuvent apparaître dans certaines tuniques de la cornée, quatre selon certains, trois selon les autres, l'eau s'amassant entre deux tuniques ; elles diffèrent par le siège, la taille, la qualité, la couleur, la consistance, la douceur, l'âcreté et le caractère rongeant ; la plus profonde est la pire ; petites, on les traite par les drogues desséchantes, grandes, par le fer, c'est-à-dire en les incisant au scalpel {cite:canon-ibn-sina-print-v2 p.176} {cite:canon-ibn-sina-print-v2 p.177}"
  ur: "قرنیہ کی بعض تہوں میں — جو بعض کے نزدیک چار اور باقیوں کے نزدیک تین ہیں — پانی کے نفاخات ہو سکتے ہیں، یہ پانی دو تہوں کے درمیان جمع ہوتا ہے اور یہ مقام، مقدار، کیفیت، رنگ، قوام، نرمی، تیزی اور کاٹ میں مختلف ہوتے ہیں؛ سب سے گہرا سب سے بُرا؛ چھوٹے رہتے ہوئے ان کا علاج خشک کرنے والی ادویہ سے، بڑے ہو جائیں تو لوہے سے یعنی میبضع سے چیرنے سے ہوتا ہے {cite:canon-ibn-sina-print-v2 p.176} {cite:canon-ibn-sina-print-v2 p.177}"
