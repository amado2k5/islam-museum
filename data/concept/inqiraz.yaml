label: { ar: "الانقراض", en: "Inqiraz (the passing of an age or line, and its bearing on consensus and endowments)", es: "Inqiraz (el paso de una era o linaje, y su influencia en el consenso y las dotaciones)", fr: "Inqiraz (le passage d'une ère ou d'une lignée, et son incidence sur le consensus et les dotations)", ur: "انقراض ⁦(عمر یا لکیر کا گزرنا اور اس کا اثر اجماع اور اوقاف پر ہے)⁩", tr: "Yok oluş", id: "kepunahan" }
summary:
  ar: "الانقراض لغة الانقطاع والموت، ولا يخرج استعمال الفقهاء عن ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3540} واختلف الأصوليون في انقراض عصر أهل الإجماع هل هو شرط في حجيته، فذهب الجمهور إلى أنه لا يشترط، وذهب جماعة إلى اشتراطه، وفصل آخرون بين الإجماع بالقول أو الفعل والإجماع بالسكوت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3540} وفي الوقف لا يصح عند الحنفية والشافعية والحنابلة الوقف على من ينقرض كالوقف على الأولاد، لاشتراطهم التأبيد، ويصح عند المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3540}"
  en: "Inqiraz is lexically cutting off and passing away, and the jurists use it in that sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3540} The usulis differ on whether the passing of the age of those who agreed is a condition of the authority of a consensus: the majority do not require it; some do; and others distinguish a consensus by word or deed from one by silence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3540} In endowments the Hanafis, Shafi'is and Hanbalis do not validate a gift to a line that may die out, such as a gift to children, since they require perpetuity; the Malikis validate it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3540}"
  es: "Inqiraz significa léxicamente cortar y desaparecer, y los juristas lo usan en ese sentido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3540} Los usulis difieren en si el paso de la edad de quienes dieron su consentimiento es una condición para la autoridad de un consenso: la mayoría no lo exige; algunos sí; y otros distinguen un consenso por palabra o por obra de uno por silencio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3540} En las donaciones, los hanafíes, shafiíes y hanbalíes no validan una donación a una línea que puede extinguirse, como una donación a los hijos, ya que exigen perpetuidad; los malikíes sí la validan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3540}"
  fr: "Inqiraz signifie lexicalement « couper » et « disparaître », et les juristes l'emploient dans ce sens. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3540} Les usulis divergent quant à savoir si le décès des personnes ayant consenti est une condition de validité d'un consensus: la majorité ne l'exige pas; certains l'exigent; et d'autres distinguent un consensus exprimé par la parole ou par l'acte d'un consensus tacite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3540} En matière de dotations, les hanafites, les chaféites et les hanbalites ne valident pas un legs à une lignée susceptible de s'éteindre, comme un legs aux enfants, car ils exigent la perpétuité; les malikites, eux, le valident. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3540}"
  ur: "انقیراز لغوی طور پر کاٹنا اور مر جانا ہے اور فقہاء اسے اسی معنی میں استعمال کرتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص3540} اس بارے میں علماء کا اختلاف ہے کہ آیا متفق ہونے والوں کی عمر کا گزر جانا اجماع کے اختیار کی شرط ہے: جمہور کو اس کی ضرورت نہیں ہے۔ کچھ کرتے ہیں اور دوسرے اتفاق رائے کو لفظ یا عمل کے ذریعہ خاموشی سے الگ کرتے ہیں۔ اوقاف میں حنفیہ، شافعی اور حنبلی ایسے ہدیہ کو درست نہیں کرتے جو ختم ہو سکتی ہے، جیسے بچوں کے لیے تحفہ، کیونکہ ان کے لیے ہمیشہ کی ضرورت ہوتی ہے۔ مالکی اس کی تصدیق کرتے ہیں۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 3540}"
  tr: "Yok olma, sona erme ve ölüm dilidir ve hukukçuların kullanımı bundan sapmaz. {alıntı:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.3540} Usul (usul) alimleri, uzlaşma döneminin sona ermesinin otoritesinin bir koşulu olup olmadığı konusunda farklı görüşteydi. Çoğunluk bunun zorunlu olmadığını savunurken, bazıları bunun şartlandırılmasını tercih ederken, diğerleri söz veya eylemle uzlaşı, suskunlukla uzlaşı arasında ayrım yaptı. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.3540} Hanefiler, Şafiiler ve Hanbalilere göre, vakıf sona eren biri için geçerli değildir, örneğin çocuklar için verilen bağışlar çünkü sonsuzluk gerektirir ve Malikilere göre de geçerlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3540}"
  id: "Kepunahan adalah bahasa tentang penghentian dan kematian, dan penggunaan para ahli hukum tidak menyimpang dari itu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3540} Para sarjana usul (usul) berbeda pendapat apakah kepunahan era konsensus merupakan syarat untuk otoritasnya. Mayoritas berpendapat bahwa hal itu tidak wajib, sementara beberapa lebih memilih agar ditetapkan, sementara yang lain memisahkan antara konsensus berdasarkan kata atau tindakan dan konsensus dengan diam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3540} Dalam kasus wakaf, menurut Hanafi, Shafi'i, dan Hanbali, wakaf tidak berlaku bagi seseorang yang punah, seperti wakaf untuk anak-anak, karena mereka membutuhkan keabadian, dan menurut Maliki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3540}"
