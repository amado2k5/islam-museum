id: concept/inqiraz
class: concept
kind: term
label: { ar: "الانقراض", en: "Inqiraz (the passing of an age or line, and its bearing on consensus and endowments)" }
summary:
  ar: "الانقراض لغة الانقطاع والموت، ولا يخرج استعمال الفقهاء عن ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3540} واختلف الأصوليون في انقراض عصر أهل الإجماع هل هو شرط في حجيته، فذهب الجمهور إلى أنه لا يشترط، وذهب جماعة إلى اشتراطه، وفصل آخرون بين الإجماع بالقول أو الفعل والإجماع بالسكوت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3540} وفي الوقف لا يصح عند الحنفية والشافعية والحنابلة الوقف على من ينقرض كالوقف على الأولاد، لاشتراطهم التأبيد، ويصح عند المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3540}"
  en: "Inqiraz is lexically cutting off and passing away, and the jurists use it in that sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3540} The usulis differ on whether the passing of the age of those who agreed is a condition of the authority of a consensus: the majority do not require it; some do; and others distinguish a consensus by word or deed from one by silence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3540} In endowments the Hanafis, Shafi'is and Hanbalis do not validate a gift to a line that may die out, such as a gift to children, since they require perpetuity; the Malikis validate it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3540}"
