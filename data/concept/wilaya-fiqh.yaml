id: concept/wilaya-fiqh
class: concept
kind: legal
label:
  ar: "وِلاية"
  en: "Wilaya (authority and guardianship, fiqh)"
summary:
  ar: "الوِلاية بالكسر في اللغة من الوَلْي، وهو القرب، ويقال وليه أي دنا منه، وتولى الأمر أي تقلده؛ والولاية بالفتح النصرة والمحبة، وولي اليتيم والقتيل والمرأة من يقوم بأمرهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17849}\n\nوالولاية في الاصطلاح عند جل الفقهاء تنفيذ القول على الغير شاء أو أبى، فتشمل الإمامة العظمى والقضاء والحسبة والمظالم والشرطة، وتشمل قيام الكبير الراشد على القاصر في تدبير شؤونه؛ وتُطلق على سلطة الزوج في تأديب زوجته الناشز، وسلطة الوالد في تأديب ولده الصغير، وسلطة المعلم على تلاميذه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17850}\n\nوعند المالكية الولاية آصرة موجبة للإرث، فهي خمسة أنواع: ولاية الإسلام، ولا يورث بها إلا عند عدم غيرها، وولاية الحلف، وولاية الهجرة، وكان التوارث بهما في أول الإسلام ثم نُسخ، وولاية القرابة، وولاية العتق، والميراث بهما ثابت. وأوضح ابن رشد مرادهم: فولاية الإسلام عامة بنص القرآن، وولاية الحلف كانت التوارث بها أول الإسلام ثم نُسخت بآية أولي الأرحام، وولاية الهجرة كانت التوارث بها أول الإسلام ثم نُسخت بذلك، وولاية النسب ثابتة بالقرآن، وولاية العتق توجب الميراث عند انقطاع النسب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17850}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17851}\n\nوولاية الله للمؤمنين معناها أن يتولى أمرهم بالمحبة والهداية والنصرة؛ وقال ابن القيم إنها عامة لكل مؤمن تقي، وخاصة لمن قام بجميع حقوق الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17851}\n\nالألفاظ ذات الصلة: النيابة، وهي أن يقوم الإنسان عن غيره بفعل أمر، والولاية أعم منها مطلقاً، فكل نيابة ولاية وليس كل ولاية نيابة. والعمالة، وهي أجرة من يلي الصدقة، والوالي أعم من العامل. والقوامة، وهي الحفظ والرعاية والتدبير، والقيّم هو المتولي والناظر على الصغير والمجنون والسفيه وعلى مال الوقف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17852}\n\nالألفاظ ذات الصلة بالولاية: القوامة، وهي أخص من الولاية، وتعني الحفظ والصيانة؛ والوصاية، وهي إقامة الإنسان غيره مقامه بعد وفاته للنظر في تركته وشؤون أولاده الصغار، وهي أخص من الولاية؛ والوكالة، وهي تفويض الشخص غيره فيما يقبل النيابة في حياته، وهي أخص من الولاية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17852}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17853}\n\nالولاية العامة سلطة على إلزام الغير وإنفاذ التصرف عليه بغير تفويض منه، تتعلق بأمور الدين والدنيا والنفس والمال، وتهيمن على مرافق الحياة العامة، لجلب المصالح ودرء المفاسد، وهي منصب ديني ودنيوي شرع لثلاثة أمور: الأمر بالمعروف والنهي عن المنكر، وأداء الأمانات إلى أهلها، والحكم بين الناس بالعدل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17853}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17854}\n\nومراتبها تتدرج من الإمام الأعظم إلى نوابه وولاته، وبها تُجهز الجيوش وتُسد الثغور وتُجبى الأموال وتُصرف في محلها، وتُعيّن القضاة والولاة، وتُقام الحدود والتعازير، ويُقمع البغاة، ويُفصل بين الخصوم، ويُنصب الأوصياء والنظار ويُحاسبون. وقال ابن تيمية إن مقصود الولايات في الإسلام أن يكون الدين كله لله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17854}\n\nواعتبرت الشريعة ولاية أمر الناس من أعظم واجبات الدين، لأن الناس لا تتم مصالحهم إلا بالاجتماع ولابد لهم من رأس، ولقوله «إذا خرج ثلاثة في سفر فليؤمّروا أحدهم». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17854}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17855}\n\nالشروط المشتركة للولاية العامة: الإسلام، بالإجماع، لقوله تعالى في سورة النساء (الآية ١٤٤ والآية ٥٩)؛ والبلوغ، بالإجماع، للحديث «رُفع القلم عن ثلاث»؛ والعقل، بلا خلاف؛ والحرية، فلا يتولاها العبد؛ والذكورة، عند جمهور أهل العلم، لقوله تعالى «الرجال قوامون على النساء» (سورة النساء، الآية ٣٤)، ولقوله «لن يفلح قوم ولّوا أمرهم امرأة»؛ والعدالة، عند الجمهور؛ والعلم بالأحكام الشرعية، عند الجمهور، ويشترط السمناني العلم بأصول الدين والاجتهاد في فروعه، فيما نقل عن بعض المعاصرين أن ذلك يقتضي ألا يصح لإمام إمامة في عصره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17855}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17856}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17857}\n\nالكفاية الجسمية، وهي أن يكون الوالي سميعاً بصيراً ناطقاً، لأن الخلل في الأعضاء والحواس يعجزه عن كمال التصرف، وقال الجويني إن نقص الحواس يحول دون الانتهاض في الملمات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17857}\n\nالرأي والكفاية، وهما تختلفان بحسب الولاية؛ فما يلزم في الإمامة العظمى من المقدرة السياسية والحربية والفكرية لا يشترط فيما دونها. واستشهد الفقهاء بقول النبي لأبي ذر «إنك ضعيف، وإنها أمانة»، وبقوله «إذا ضيعت الأمانة فانتظر الساعة». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17857}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17858}\n\nتقديم الأمثل عند الاضطرار. إذا تعذر اجتماع الشروط في الناس، فلا يُعطَّل إسناد الولايات، بل يُقدم الأصلح والأمثل، لأن الضرورة تبيح المحظورات، ولأن حفظ بعض المصالح أولى من تضييعها كلها، ولقوله تعالى «فاتقوا الله ما استطعتم»؛ وقال العز بن عبد السلام إن تعذرت العدالة في الناس لم يجز تعطيل المصالح، بل يُقدّم أمثل الفسقة. وتُوجب الضرورة السعي في إصلاح الأحوال حتى تكمل الشروط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17858}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17859}\n\nواجبات صاحب الولاية العامة تختلف بحسب ولايته. والالتزام بأحكام الشريعة في الأقوال والأعمال والأخلاق واجب عليه، لأنه قدوة للناس؛ وأداء الأمانة واجب، لقوله تعالى «إن الله يأمركم أن تؤدوا الأمانات إلى أهلها» (سورة النساء، الآية ٥٨). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17859}\n\nقال النبي «ما من عبد يسترعيه الله رعية، يموت يوم يموت وهو غاش لرعيته، إلا حرم الله عليه الجنة»، وقال «من استعمل رجلاً من عصابة وفيها من هو أرضى لله منه فقد خان الله ورسوله»، فيجب على من ولي شيئاً من أمر المسلمين أن يستعمل في كل موضع أصلح من يقدر عليه وأمثلهم؛ وقال ابن تيمية إن العدول عن الأحق لقرابة أو ولاء أو صداقة أو موافقة في بلد أو مذهب أو جنس، أو رشوة، أو ضغن، فهو خيانة لله ورسوله والمؤمنين. وأداء الأمانة عنده مبني على خشية الله، وألا يشتري بآياته ثمناً قليلاً، وترك خشية الناس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17860}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17861}\n\nالعدل ميزان الله في الأرض وقوام الدين والدنيا، وقد نص الفقهاء على أن الولاية إذا شملها العدل كانت من أفضل الطاعات، وأن العادل من الأئمة والولاة أعظم أجراً، وأن ولاة الجور أعظم الناس وزراً، وجماع السياسة العادلة أداء الأمانات إلى أهلها والحكم بالعدل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17861}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17862}\n\nالأمر بالمعروف والنهي عن المنكر هو مقصود الولايات كلها، وهو فرض على كل قادر، ويصير فرض عين على القادر إذا لم يقم به غيره، وذوو السلطان أقدر فعليهم من الوجوب ما ليس على غيرهم. وتختلف الولايات: فبعضها بمنزلة الشاهد المؤتمن المطلوب منه الصدق، وبعضها بمنزلة الأمين المطاع المطلوب منه العدل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17861}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17862}\n\nمشورة أهل العلم وذوي الرأي والتجربة واجبة على صاحب الولاية، لقوله تعالى «وأمرهم شورى بينهم» (سورة الشورى، الآية ٣٨)؛ وقال ابن خويز منداد إن الوالي يستشير العلماء فيما لا يعلم، ووجوه الجيش في الحرب، ووجوه الناس في المصالح، والكتاب والعمال والوزراء في عمارة البلاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17862}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17863}\n\nرعاية حاجات الأمة ومصالحها واجب في كل ولاية، لقوله «من ولاه الله شيئاً من أمر المسلمين فاحتجب دون حاجتهم وخلتهم وفقرهم احتجب الله دون حاجته»؛ وقال القرافي إن الولاية إنما تتناول جلب المصلحة الخالصة أو الراجحة ودرء المفسدة الخالصة أو الراجحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17863}\n\nحقوق صاحب الولاية: طاعته في المعروف، وهو متفق عليه، لقوله تعالى «أطيعوا أولي الأمر منكم»، ولقوله «السمع والطاعة على المرء المسلم فيما أحب وكره ما لم يؤمر بمعصية». وحرمة الخروج على ولي الأمر العادل متفق عليها، والخروج على الجائر مختلف فيه. ونصيحته واجبة، لقوله «الدين النصيحة... ولأئمة المسلمين وعامتهم»، وتكون بالرفق والتلطف لا بالفضح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17863}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17864}\n\nوللمتولي حق في بيت المال يُرتب له منه ما يكفيه وعياله، قياساً على عامل الصدقة، لأنه متفرغ لمصالح المسلمين، ولئلا يُدفع إلى الرشوة أو الكسب الحرام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17864}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17865}\n\nأنواع الولاية العامة تختلف بحسب الأقاليم والأعصار والأعراف، وقد بلغت عند الفقهاء أكثر من عشرين نوعاً. منها الإمامة الكبرى، وهي الرئاسة العظمى في حراسة الدين وسياسة الدنيا خلافة عن النبي، وتُسمى كبرى تمييزاً لها عن إمامة الصلاة؛ والوزارة، وهي ولاية شرعية يخولها الإمام لشخص موثوق، وتنقسم إلى وزارة تفويض ووزارة تنفيذ؛ وولاية القضاء، وحقيقتها تبيين الحكم الشرعي مع الإلزام به وفصل الخصومات، ومنها ولاية جزئية كمتولي العقود في الأنكحة وحدها، أو النظر في الأيتام وحدها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17865}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17866}\n\nولاية المظالم، قال الماوردي إنها قود المتظالمين إلى التناصف بالرهبة، وزجر المتنازعين عن التجاحد بالهيبة، ويشترط فيمن يتولاها جلالة القدر ونفاذ الأمر وعظم الهيبة وظهور العفة وقلة الطمع وكثرة الورع؛ فإن كان ممن يملك الأمور العامة كالوزراء والأمراء لم يحتج إلى تقليد، وإلا احتاج إليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17867}\n\nولاية الإمارة على ضربين: إمارة استكفاء تنعقد باختيار الإمام، عامة لبلد أو إقليم، أو خاصة بتدبير الجيش وسياسة الرعية وحماية البيضة دون القضاء والخراج؛ وإمارة استيلاء يعقدها الإمام اضطراراً لمن غلب على بلد بالقوة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17867}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17868}\n\nولاية الشرطة. أعوان السلطان، ووظيفتها عند ابن الأمين القرطبي أمران: معونة الحكام في الحبس والإطلاق والإشخاص، والنظر في الجنايات وإقامة الحدود؛ وسماها ابن خلدون بحسب البلاد الحاكم أو صاحب المدينة أو الوالي. وقال التاج السبكي إن للشرطة الفحص عن المنكرات كالخمر والحشيش وسد الذريعة فيها والستر على من ستره الله، وليس لها التجسس على الناس ولا كبس البيوت بمجرد القيل والقال، بل ترسل رجلاً مأموناً ينهى عن المنكر بقدره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17868}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17869}\n\nوسمّى ابن تيمية هذه الولاية «ولاية الحرب الصغرى»، تمييزاً لها عن «الحرب الكبرى»، ومعتمدها المنع من الفساد في الأرض وقمع أهل الشر والعدوان، وذكر أنها في بلاد الشام ومصر تختص بالحدود التي فيها إتلاف وبالحكم في المخاصمات، وفي المغرب ينفذ الوالي ما يأمر به القاضي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17869}\n\nولاية الحسبة هي الأمر بالمعروف إذا ظهر تركه، والنهي عن المنكر إذا ظهر فعله، وهي من الخطط الدينية كالصلاة والفتيا والقضاء والجهاد؛ وهي نوعان: أصلية من الشارع لكل من طُلب منه، ومستمدة من عهد الخليفة أو الأمير، وهي للمحتسب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17869}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17870}\n\nولاية الإمارة على الجهاد تختص بقتال المشركين، وهي ضربان: مقصورة على سياسة الجيش وتدبير الحرب، أو مفوّضة إلى الأمير جميع أحكامه من قسمة الغنائم وعقد الصلح، وإذا عُقدت على غزوة واحدة لم يغزُ غيرها، وإذا عُقدت عموماً لزمه معاودة الغزو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17870}\n\nولاية حروب المصالح تختص بقتال غير المشركين، كأهل الردة وأهل البغي وقطاع الطريق. وولاية السعاية وجباية الصدقة تنحصر في الأموال الزكوية، ولا يكون متولّيها إلا عالماً بأحكام الصدقات ومقاديرها وصفاتها، حليماً غير عنيف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17870}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17871}\n\nالولاية الخاصة. تُطلق على ثلاثة ضروب: النيابة الجبرية على القاصر في شؤونه الشخصية (الولاية على النفس)، وشؤونه المالية (الولاية على المال)؛ وولاية المتولي على الوقف، وهي ولاية مالية محضة؛ والسلطة التي جعلها الشرع لأهل القتيل في استيفاء القصاص أو العفو عنه إلى الدية، لقوله تعالى «ومن قُتل مظلوماً فقد جعلنا لوليه سلطاناً»، وقوله «من قُتل له قتيل فأهله بين خيرتين». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17871}\n\nانتقال الولاية الخاصة إلى الولي العام عند عدم أهلها، لقوله «السلطان ولي من لا ولي له»، فيمارسها السلطان بنفسه أو بنوابه. والولاية الخاصة مقدمة على العامة لأنها أقوى؛ فولاية المتولي على الوقف ووصي اليتيم أقوى من ولاية القاضي، والقاضي أقوى من ولاية إمام المسلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17871}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17872}\n\nومن الفروع: القاضي لا يتصرف في الوقف مع وجود متولٍّ عليه، ولا في مال اليتيم مع وجود وصي الأب، ولا يزوج اليتيمة إلا عند عدم الولي أو عضله، وللولي الخاص العفو عن القصاص مجاناً، وليس للإمام ذلك؛ وإذا أجّر القاضي حانوت الوقف وأجّره المتولي، فإجارة المتولي معتبرة. وللولي العام الإشراف العام، فله أن يحاسب الأوصياء والنظار ويعزل الخائن منهم ولو شرط الواقف عدم مداخلته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17872}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17873}\n\nالولاية الخاصة على المال نوعان: قاصرة، وهي سلطة المرء على ماله، ومتعدية، وهي سلطة المرء على مال غيره، وهي أصلية كولاية الأب والجد على مال القاصر، ونيابية كالوصي والوكيل. وتثبت الولاية المتعدية على المحجور عليهم: الصغير، والمجنون، والمعتوه، والسفيه، ومن بهم غفلة، وتستمر ما دام الوصف قائماً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17873}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17874}\n\nوعن السفيه: الشافعية والمالكية والحنابلة والصاحبان يجيزون الحجر عليه، وأبو حنيفة لا يجيزه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17874}\n\nالمحجور عليه، كالسفيه وذي الغفلة، وحكم ذي الغفلة حكم السفيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17875}\n\nمن له الولاية على مال المحجور عليهم. عند الحنفية الترتيب: الأب، ثم وصيه، ثم وصي وصيه، ثم الجد، ثم وصيه، ثم وصي وصيه، ثم القاضي، ثم من نصبه القاضي؛ لأن الولاية مبنية على الشفقة، وشفقة الأب فوق شفقة كل أحد. وليس للأم ولا للأخ ولا للعم ولاية التصرف في مال الصغير، لقصور شفقة الأخ والعم، ولقصور الرأي عند النساء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17875}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17876} وعند المالكية: الأب، ثم وصيه، ثم وصي الوصي، ثم الحاكم أو وصيه. وعند الشافعية: الأب، ثم الجد، ثم من يوصي إليه المتأخر منهما، ثم القاضي أو أمينه، ولا تلي الأم في الأصح، ومقابله تلي. وعند الحنابلة: الأب، ثم وصيه، ثم الحاكم، ثم أمين الحاكم عند عدمه، ولا ولاية للجد ولا للأم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17876}\n\nما يجوز للولي من التصرفات. لا يجوز له التصرف إلا على وجه النظر والاحتياط وما فيه حظ للمحجور، لقوله «لا ضرر ولا ضرار». فلا يملك الهبة بغير عوض، ولا الوصية، ولا الصدقة، ولا العتق، ولا المحاباة في المعاوضة، ويضمن ما تبرع به. وأما الهبة بعوض فعند أبي حنيفة وأبي يوسف لا يجوز، وعند محمد والحنابلة يجوز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17876}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17877}\n\nوله الاتجار بمال المحجور، ودفعه مضاربة بجزء شائع من ربحه، وبيعه نسيئة للمصلحة، وإيداعه عند أمين، وشراء عقار له بمثل القيمة أو بأقل، وبيع عقاره وإجارته بثمن المثل أو بما فيه حظ له، وأن يوكل بذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17877}\n\nإقراض مال المحجور. الحنفية والمالكية يمنعونه، لأن القرض إزالة للملك بلا عوض للحال، بخلاف القاضي الذي يُقرض لحفظ الدين؛ والشافعية يجيزونه عند الخوف من النهب أو الحريق أو الغرق لثقة مليء؛ والحنابلة يجيزونه لمصلحة كالسفر، ويستحب الرهن أو الكفيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17877}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17878}\n\nوللولي أن يطالب بحقوق المحجور ويقيم البينة ويحلف الخصم، ويصالح بالشيء الذي تقوم به بينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17878}\n\nشراء الولي مال المحجور لنفسه أو بيعه له. المالكية يجيزون للأب شراء مال ابنه الصغير لنفسه وبيع ماله له إن كان فيه نظر للولد؛ والشافعية للأب والجد فقط؛ والحنابلة وزفر يمنعون، إلا الأب؛ والحنفية للأب ذلك بمثل القيمة أو بما يتغابن الناس بمثله، وأجازوا لوصي الأب أن يشتري لنفسه مال اليتيم إن كان فيه خير له عند أبي حنيفة وأبي يوسف دون محمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17878}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17879}\n\nأكل الولي من مال موليه. الحنفية يجيزون للوصي أجرة مثل عمله استحساناً إن كان محتاجاً، وبعضهم يمنع؛ والمالكية يمنعون الغني، ويجيزون الفقير كفايته بالمعروف، لقوله تعالى «ومن كان فقيراً فليأكل بالمعروف»؛ والشافعية: أقل الأمرين من الأجرة والنفقة للفقير المشغول بالولاية؛ والحنابلة: الأقل من أجرة المثل أو الكفاية، إلا الحاكم وأمينه. والجصاص يمنع الولي من الأكل مطلقاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17879}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17880}\n\nوهل يلزم رد بدل ما أكله الولي الفقير عند يساره؟ الجمهور لا يلزمه، لأنه عوض عن عمله؛ وأبو العالية وعبيدة السلماني والشافعية في مقابل الأظهر يلزمونه الضمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17880}\n\nالإنفاق على المحجور واجب بالمعروف، من غير إسراف ولا تقتير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17880}\n\nتنمية الولي مال اليتيم. ثلاثة أقوال: الأول للجمهور: للولي أن يتجر فيه وينميه، لأنه أصلح له، ولا يتجر به لنفسه؛ ويقول مالك «لا بأس بالتجارة في أموال اليتامى إذا كان الولي مأموناً»، وروي عن عمر «ابتغوا في أموال اليتامى». والثاني للشافعية في الأصح: يجب تنميته بقدر النفقة والزكاة إن أمكن. والثالث للجصاص وبعض الشافعية وابن تيمية: مندوب، لقوله تعالى «قل إصلاح لهم خير»؛ ويستحب عند ابن تيمية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17880}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17881}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17882}\n\nالولاية على النفس، وهي سلطة على شؤون القاصر المتعلقة بشخصه، كالتزويج والتعليم والتطبيب والتشغيل. وأسبابها ثلاثة: الصغر، والجنون (ويلحق به العته)، والأنوثة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17882}\n\nالولاية على النفس عند الفقهاء: سلطة على شؤون القاصر ونحوه المتعلقة بشخصه، كالتزويج والتعليم والتطبيب والتشغيل، وأسبابها: الصغر، والجنون (ويلحق به العته)، والأنوثة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17882}\n\nولاية التربية والتأديب. منشؤها مسؤولية الأبوين عن الأولاد في شؤونهم الدنيوية والأخروية، لقوله تعالى «قوا أنفسكم وأهليكم ناراً»، ولقوله «كلكم راع وكلكم مسؤول عن رعيته». وقال النووي إن على الأب تعليم ولده ما يحتاج إليه من وظائف الدين، وهذا واجب على الأب وسائر الأولياء قبل البلوغ. وقال الغزالي إن الطفل أمانة عند والديه، وقلبه قابل لكل نقش. وفي الحديث «مروا أولادكم بالصلاة وهم أبناء سبع سنين، واضربوهم عليها وهم أبناء عشر، وفرقوا بينهم في المضاجع». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17883}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17884}\n\nوجمهور الفقهاء يثبتون ولاية التأديب للأب والأم والجد والوصي والقيم من قبل القاضي، بأمر الصغير بالطاعات ونهيه عن المحظورات، وتأديبه بالقول، ثم الوعيد، ثم التعنيف، ثم الضرب، ولا يرقى إلى الأشد ما يحصل الغرض بالأخف. ويشترط في الضرب أن يغلب على الظن تحصيل المصلحة، وألا يكون مبرّحاً، وأن يتوقى الوجه والمواضع المهلكة؛ والحنفية يقصرونه على اليد، وألا يجاوز الثلاث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17884}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17885}\n\nومن موجبات الولاية على الصغار مداواته ورعايته صحياً، وتعليمه ما يستعد له من العلوم والحرف، بأجرة من ماله، وإيجار نفسه إن كان مميزاً بالمعروف، عند جمهور الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17885}\n\nولاية التزويج. للأب ولاية تزويج ابنه وابنته الصغيرين، باتفاق الحنفية والمالكية والشافعية والحنابلة؛ وفي غير الأب خلاف، فالحنفية يجيزون للجد والأخ تزويجهما مع الخيار عند البلوغ، والحنابلة يمنعون غير الأب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17886}\n\nوللمجنون ولي يدبر شؤونه وينفق عليه ويداويه ويقيّده إن خيف منه الأذى. ويجوز تزويجه إذا اقتضت مصلحته، فإن كانت له إفاقة لم يزوج بغير إذنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17886}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17887}\n\nالأنوثة سبب للولاية على النفس، وتنحصر في أمرين: تزويج المرأة، وتأديب الزوجة عند النشوز؛ وتنقسم ولاية التزويج إلى الإجبار والاختيار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17887}\n\nولاية الإجبار علتها عند المالكية والشافعية والحنابلة في الراجح البكارة، فيجبر الولي البكر البالغة العاقلة؛ وعند الحنفية علتها الصغر، فلا يجبر البالغة العاقلة، وإلى ذلك ذهب ابن تيمية وابن القيم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17887}\n\nولاية المرأة في تزويج نفسها: الشافعية والمالكية والحنابلة يمنعونه ولا يصح النكاح إلا بولي؛ وأبو حنيفة لا يشترط الولي للحرة البالغة العاقلة؛ وروي عن ابن سيرين والقاسم بن محمد والحسن بن صالح وأبي يوسف أنه لا يجوز بغير إذن الولي، فإن فعلت كان موقوفاً على إجازته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17887}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17888}\n\nعضل الولي، وهو منعه المرأة من التزويج بكفئها إذا طلبت ذلك ورغب فيها كفء، وموجبه انتقال الولاية إلى غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17888}\n\nالولاية التأديبية للزوج: للزوج تأديب زوجته إذا استعصت ونشزت، لقوله تعالى «واللاتي تخافون نشوزهن فعظوهن واهجروهن في المضاجع واضربوهن»، فيعظها بالرفق أولاً، ثم يهجرها في المضجع، ثم يضربها ضرباً غير مبرّح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17888}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17889}\n\nولاية ناظر الوقف ولاية خاصة تقتضي تنفيذ القول على الغير، وهي حق مقرر شرعاً على كل عين موقوفة، تُحفظ وتُعمر وتُؤجر وتُصرف غلتها إلى جهتها بحسب شرط الواقف، ولا يولى إلا الأمين القادر. وهي أصلية للواقف أو الموقوف عليه أو القاضي، أو فرعية بشرط أو تفويض أو توكيل أو إيصاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17889}\n\nولاية الله تعالى. قال ابن القيم إنها نوعان: عامة، وهي ولاية كل مؤمن تقي، لقوله تعالى «والله ولي المؤمنين» و«الله ولي الذين آمنوا يخرجهم من الظلمات إلى النور»؛ وخاصة، وهي القيام لله بجميع حقوقه، وإيثاره على كل ما سواه. وقال ابن تيمية إن الظالم لنفسه من أهل الإيمان معه من ولاية الله بقدر إيمانه وتقواه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17889}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17890}\n\nوقال الشوكاني إن المراد بأولياء الله خلّص المؤمنين، لأنهم قربوا من الله بطاعته، وقال الغنيمي إن الولي بمعنى المفعول من تولاه الله برعايته، وبمعنى الفاعل من تولى عبادته وطاعته. ولا تعني سلامتهم من الهفوات العصمة، إذ لا عصمة إلا لنبي، بل إن الله يحفظه من التمادي في الزلل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17890}"
  en: "Wilaya, with a kasra, in the language comes from the root wali, nearness; he is near to him, and one who takes up a matter is said to have governed it. With a fatha it means help and love. The guardian (wali) of an orphan, of a slain person, or of a woman is one who takes charge of their affairs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17849}\n\nIn the technical sense most jurists use wilaya as carrying out a word over another whether he wills it or not. It covers the supreme imamate, judgeship, the office of hisba (public order), the grievances court and the police, and the adult's management of the affairs of one who is still a minor. The word is also used for a husband's authority to discipline a rebellious wife, a father's to discipline a young son, and a teacher's over his pupils. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17850}\n\nThe Malikis use wilaya for a bond that causes inheritance, in five kinds: wilayat al-Islam, which gives inheritance only when no other kind exists; wilayat al-hilf (alliance); wilayat al-hijra (migration), by which inheritance was given at the start of Islam and then abrogated, as were the alliance; wilayat al-qaraba (kinship); and wilayat al-'itq (manumission), by which inheritance stands. Ibn Rushd explains that the wilaya of Islam is general, by the verse of believers as protectors of one another; the wilaya of alliance was abrogated by the verse of the kin; the wilaya of migration was likewise abrogated; kinship by the verse of shares; and manumission gives inheritance where lineage fails. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17850}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17851}\n\nGod's wilaya over believers means that He takes charge of them with love, guidance and help. Ibn al-Qayyim says it is general for every pious believer and special for one who keeps all God's rights. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17851}\n\nRelated words: deputising (niyaba), which is one person standing in place of another in an act; wilaya is wider than it, so every deputising is a wilaya, but not every wilaya is a deputising. 'Amala, the fee of the collector of charity; the wali is wider than the collector. Qiwama, the custody and care of a matter; the custodian (qayyim) is the manager and administrator of a minor, an insane or a spendthrift, or of an endowment's property. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17852}\n\nRelated words. Qiwama is narrower than wilaya and means keeping and preserving. Wasiya (guardianship after death) is the setting of another in one's place after death to look after the estate and the young children, and is narrower too. Wakala is the delegation of a disposal that admits delegation during one's life, and is narrower than wilaya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17852}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17853}\n\nGeneral authority (wilaya 'amma) is power to compel and carry out an act over another without his delegation, in matters of religion and the world, of persons and property, governing the public affairs of life, to secure benefits and avert harms. It is a religious and worldly office, instituted for three things: enjoining good and forbidding wrong, delivering trusts to their owners, and judging among people with justice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17853}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17854}\n\nIts ranks run from the supreme imam down to his deputies and governors. By it armies are equipped, frontiers defended, taxes collected and spent where they belong, judges and governors appointed, the hudud and the discretionary penalties enforced, rebels suppressed, disputes settled, and guardians and custodians appointed and held to account. Ibn Taymiyya says the aim of all authority in Islam is that religion be wholly God's. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17854}\n\nThe law makes the authority over people one of the greatest duties of religion, since people's interests are not secured without gathering, and gathering needs a head; hence the saying that when three go on a journey they should appoint one of them as leader. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17854}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17855}\n\nThe common conditions of general authority. Islam is required by agreement, on the verses of Surat al-Nisa (verses 144 and 59, cited by number). Puberty is required by agreement, on the saying that the pen is lifted from three. Sanity is required without dispute. Freedom is required, so a slave does not hold it. Male sex is required by the majority, on the verse that men are guardians over women (Surat al-Nisa, verse 34) and the saying that a people who give their affairs to a woman will not prosper. Justice is required by the majority, and knowledge of the rulings by the majority; al-Samarqandi requires knowledge of the principles of religion and independent judgement in its branches, and reports that a scholar of his time held that this would mean that no imam could hold office, so that a man can rely on others for what he lacks. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17855}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17856}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17857}\n\nBodily soundness: the holder must hear, see and speak, since a defect in these senses prevents full action; al-Juwayni says that loss of sight, hearing or speech prevents rising to urgent matters. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17857}\n\nOpinion and capacity. These differ with each office: what is needed in the supreme imamate (political, military and intellectual ability, firmness, compassion and shrewdness) is not required of lesser offices. The Prophet told Abu Dharr: 'you are weak, and it is a trust', and said: 'when trust is lost, await the hour'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17857}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17858}\n\nChoosing the best when the ideal is absent. When all the conditions cannot be met, the appointment of holders is not suspended; the most suitable is chosen, since necessity permits what is forbidden, and keeping some interests is better than losing all. Al-'Izz ibn 'Abd al-Salam says that if justice were absent from all people, the interests of judges, caliphs and governors could not be suspended, and the best of the corrupt would be chosen. Necessity also requires striving to reform matters until the conditions are completed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17858}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17859}\n\nThe duties of the holder of general authority vary with the office. He must keep to the law of Islam in word, deed and conduct, since he is an example; and he must discharge trusts, as the verse of Surat al-Nisa (verse 58) commands. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17859}\n\nThe Prophet said: 'No servant whom God appoints over a flock dies on the day he dies while deceiving them without God forbidding him Paradise.' He also said: 'Whoever appoints a man from a group while in it is one more pleasing to God has betrayed God and His Messenger.' So whoever holds any part of the affairs of Muslims must appoint in each place the most suitable and most capable he can find. Ibn Taymiyya says that turning from the most entitled to another for kinship, clientage, friendship, shared town or school, race, bribery or grudge is betrayal of God, His Messenger and the believers. He holds that the discharge of trust rests on three things: fear of God, not selling His signs for a small price, and not fearing people. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17860}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17861}\n\nJustice is God's balance on earth and the support of religion and the world. The jurists say that when authority is accompanied by justice it is among the best acts of obedience; a just imam, ruler or judge has a greater reward than all others, and unjust rulers bear the greatest burden. The sum of just governance is the delivery of trusts to their owners and judging with justice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17861}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17862}\n\nEnjoining good and forbidding wrong is the purpose of all authority. It is an obligation on each capable person, and becomes an individual obligation on the capable one when no one else undertakes it; those in power bear more of it. Offices differ: some are like a trusted witness, required to be truthful, and others like a trusted commander, required to be just. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17861}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17862}\n\nConsulting people of knowledge, judgement and experience is obligatory for the holder of general authority, on the verse that he should consult them in the matter (Surat al-Shura, verse 38, cited by number). Ibn Khuwaz Mindad said that rulers must consult the scholars where they do not know or where religious matters are unclear, the commanders in war, the notables on public interests, and the scribes and governors on the good of the lands. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17862}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17863}\n\nCaring for the needs of the community is an obligation in every office, on the saying that whoever God gives authority over Muslims and shuts himself off from their needs, poverty and wants, God shuts Himself off from his needs. Al-Qarafi says that authority is for securing pure or preponderant benefit and averting pure or preponderant harm. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17863}\n\nThe rights of the holder of authority include obedience in what is good, agreed upon, on the verse 'obey those in authority among you' and the saying 'hearing and obedience are due to the Muslim in what he likes and dislikes, unless he is ordered to sin'. Rebellion against a just ruler is agreed to be forbidden; rebellion against an unjust one is disputed. Advising him is obligatory, on the saying 'religion is sincere counsel... to the leaders of the Muslims and their common folk'; it should be gentle and private, not public censure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17863}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17864}\n\nThe holder has a right to a stipend from the public treasury sufficient for him and his dependants, by analogy with the zakat collector, since he devotes himself to the interests of Muslims, and so that he is not driven to bribery or unlawful gain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17864}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17865}\n\nThe kinds of general authority differ with regions, eras and customs, and the jurists count more than twenty. They include the supreme imamate, the great leadership in guarding religion and governing the world as deputy of the Prophet, called 'great' to distinguish it from leading the prayer; the vizierate, a legal authority the imam gives to a trusted man, in two kinds, delegated and executive; and the judgeship, whose reality is declaring the legal ruling with binding force and settling disputes, with partial kinds such as a supervisor of marriage contracts only or of orphans' affairs only. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17865}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17866}\n\nThe mazalim (grievances) authority. Al-Mawardi says it is the leading of wrongdoers to fairness through awe, and the restraint of disputants from denying one another's rights through dignity. Its holder must be of high rank, obeyed, of great presence, clearly chaste, little greedy and very pious. Those who already hold general powers, such as ministers and amirs, need no separate appointment; others need one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17867}\n\nThe amirate (imara) has two kinds. The chosen amirate (istikfa') is made by the imam, general over a town or region or specific to the army's command, the protection of the realm and the defence of its honour, without judgement, taxes or alms. The seized amirate (istila') is made by the imam out of necessity, when a commander has taken a land by force and the caliph gives him its command. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17867}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17868}\n\nThe police (shurta) are the sultan's aides. Ibn al-Amin al-Qurtubi gives them two tasks: helping the judges in imprisonment and release, and investigating crimes and carrying out the hudud. Ibn Khaldun notes the title varies by land (hakim, sahib al-madina, wali). Taj al-Din al-Subki says the police may investigate public wrongs such as wine and hashish and stop their pretext, and cover those whom God has covered, but may not spy on people or raid their houses on rumour; they should send a trusted man in secret to forbid the wrong only as far as God has forbidden it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17868}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17869}\n\nIbn Taymiyya calls this the 'lesser war' (wilayat al-harb al-sughra), to distinguish it from the 'greater war', which he describes as the deputising of the sultanate. Its purpose is to prevent corruption on earth and suppress the wicked and aggressive. He says that in his time in the Levant and Egypt it covered the hudud involving bodily harm and judgement in disputes, while in the Maghrib the governor only carries out what the judge orders. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17869}\n\nThe hisba is enjoining good when it is abandoned and forbidding evil when it is committed. It is a religious office like prayer, giving fatwas, judgeship and jihad. It is of two kinds: an original office from the lawgiver, binding on everyone asked, and a delegated one, given by the caliph or amir, held by the muhtasib. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17869}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17870}\n\nThe amirate of jihad is only against polytheists, and is of two kinds: one limited to army policy and the conduct of war, and one that includes the division of booty and the making of treaties. If it is made for a single campaign, the amir may not undertake another; if it is general, he must renew campaigns year by year. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17870}\n\nAuthority over wars for the public good is against non-polytheists: apostates, rebels and highwaymen. The office of collecting charity is limited to zakat funds; its holder must know the rules, the amounts, the kinds of property and the payers, and be gentle and vigilant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17870}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17871}\n\nSpecial authority (wilaya khassa) has three forms: the compulsory deputising over a minor's person and property (guardianship over the person and over property), the authority of the administrator of an endowment over its property, and the authority the law gives the kin of a slain person to exact retaliation or to pardon it for blood-money, on the verses and sayings 'whoever is slain wrongly, We have given his heir authority' and 'the kin of the slain have the choice of two things'. The first is the common meaning in the jurists' usage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17871}\n\nSpecial authority passes to the general authority when its holders are absent, on the saying 'the sultan is the guardian of him who has no guardian'; the sultan exercises it himself or through his deputies, such as governors and judges, since the deputies stand in his place. Special authority prevails over general authority, since it is stronger. Thus the endowment administrator prevails over the judge, and the guardian of an orphan prevails over the judge; the judge may not dispose of an orphan's property while the father's executor exists, nor marry an orphan except when there is no guardian or the guardian refuses. The holder of special authority may pardon retaliation free of charge, and the imam may not. If the judge leases an endowed shop to one man and the administrator leases it to another, the administrator's lease stands. The general authority nonetheless supervises all, and may audit the executors, supervisors and administrators, and remove the dishonest among them, even if the donor or founder stipulated against his interference. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17871}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17872}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17873}\n\nHanafi exceptions: the administrator may not appoint officers for the endowed purposes unless the founder stipulated it, but the judge may; the judge may lend an orphan's property without the father or executor. Ibn al-Qasim of the Malikis says that if the sultan marries an adult woman while her guardian is present, the marriage stands and is not annulled. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17873}\n\nSpecial authority over property is of two kinds: the authority over one's own property (qasira, proper to any fully capable person) and authority over another's property (muta'addiya), which is either original, given by the lawgiver (the father's or grandfather's authority over a minor's property), or deputising, such as the executor or agent. It is established over those under restraint: the minor, the insane, the imbecile, the spendthrift and the inattentive, and lasts while the cause remains. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17873}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17874}\n\nThe minor is one who has not reached puberty, male or female; he is discerning or not discerning. The insane is one whose reason is gone so that his words and acts do not go right, and it is permanent or intermittent; his acts while insane are void, and while sane are valid. The imbecile has little understanding and disordered speech but does not strike or curse; he may be like a non-discerning or a discerning minor. The spendthrift squanders his property against reason or the law, from a levity of joy or anger. The Shafi'is, Malikis, Hanbalis and the two companions of Abu Hanifa allow him to be placed under restraint, while Abu Hanifa does not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17874}\n\nThe prodigal and the inattentive (dhu al-ghafla), who is cheated for his simplicity, are treated like the spendthrift in restraint. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17875}\n\nWho holds authority over the property of those under restraint? The Hanafis give the order: the father, his executor, the executor's executor, the grandfather, his executor, the executor's executor, the judge, and then the judge's appointee; the order follows compassion, which is greatest in the father. The mother, the brother and the uncle have no authority over a minor's property, since a brother's or uncle's compassion is deficient and women's judgement is weak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17875}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17876} The Malikis: the father, his executor, the executor's executor, then the judge or his executor. The Shafi'is: the father, then the grandfather, then the executor of the later of them, then the judge or his trustee; the mother does not act in the sounder view, though the opposite view lets her act. The Hanbalis: the father, his executor, then the judge, then his trustee in his absence; neither the grandfather nor the mother has authority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17876}\n\nWhat the guardian may do. He may act only with care, precaution, and in what benefits the ward, on the saying 'no harm and no reciprocal harm'. He may not make a gift without return, a bequest, a charity, a manumission, or give an undue favour in an exchange, and he must compensate what he gave away. A gift for a return is, by Abu Hanifa and Abu Yusuf, not valid; by Muhammad and the Hanbalis, valid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17876}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17877}\n\nHe may trade with the ward's property, give it in partnership for a fixed share of profit, sell it on credit where useful, deposit it with a trusted person, buy real estate for it at the value or less, sell and lease his property at its value or better, and appoint another for all of this. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17877}\n\nLending the ward's money. The Hanafis and Malikis forbid it, since a loan removes ownership without an immediate return, unlike the judge who lends to preserve the debt. The Shafis allow it where he fears plunder, fire or drowning, to a trusted solvent person. The Hanbalis allow it for a reason such as travel, and prefer a surety or pledge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17877}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17878}\n\nHe may claim the ward's rights, prove them, make the opponent swear, and compromise on a part of a debt where there is evidence, and collect part of what is due to the ward where there is none. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17878}\n\nBuying or selling the ward's property to oneself. The Malikis allow the father to buy his minor son's property for himself and sell his own to the son if it benefits the son; the Shafis allow it only to the father and grandfather; the Hanbalis and Zufar forbid it except for the father; the Hanafis allow the father to buy at the value or the usual range, and allow the executor of the father to buy for himself where it is clearly better; Muhammad forbids it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17878}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17879}\n\nThe guardian eating from the ward's property. The Hanafis allow the executor a customary wage for his work if he is in need, by istihsan; some forbid it. The Malikis forbid the rich guardian and allow the poor one his sufficiency in what is customary, on the verse 'whoever is poor, let him eat in what is customary'. The Shafis give the poor guardian the lesser of wage and maintenance. The Hanbalis allow the lesser of the customary wage and his sufficiency, except for the judge and his trustee. Al-Jassas forbids it altogether. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17879}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17880}\n\nMust the poor guardian repay what he ate when he becomes rich? The majority say no, since it is a return for his work. Abu al-'Aliya, 'Ubayda al-Salmani and the Shafi'i view opposite the sounder one say he must pay it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17880}\n\nThe guardian must maintain the ward and his dependants from the ward's property, in what is customary, without extravagance or meanness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17880}\n\nDeveloping an orphan's property. Three views. The first, the majority's: the guardian may trade with it and develop it, since that is better for the orphan, but he may not trade with it for himself; Malik says 'no harm in trade with orphans' property where the guardian is trusted', and 'Umar said 'trade with the property of orphans, so that charity does not consume it'. The second, the sounder Shafi'i view: it is obligatory to develop it to the extent of the maintenance and zakat, where possible. The third, of al-Jassas and some Shafis and Ibn Taymiyya: it is recommended, not obligatory, on the verse 'say: to set them right is good'; Ibn Taymiyya says it is recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17880}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17881}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17882}\n\nGuardianship over the person is authority over the ward's personal affairs: marriage, teaching, medical care and employment. Its causes are three: minority, insanity (and imbecility, which follows it), and femaleness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17882}\n\nGuardianship over the person, as the jurists use it, is authority over a minor's or another incapable person's personal affairs, such as marriage, teaching, medical care and employment. Its causes are three: minority, insanity (with imbecility, which follows it), and femaleness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17882}\n\nGuardianship of upbringing and discipline. It rests on the responsibility of parents for their children's worldly and eternal affairs, on the verse 'save yourselves and your families from a fire' and the saying 'each of you is a shepherd and each is responsible for his flock'. Al-Nawawi says the father must teach his son what he needs of religious duties, a duty on the father and every guardian before puberty. Al-Ghazali says a child is a trust with his parents and his heart accepts any impression. The saying is: 'Command your children to pray at seven years old, strike them for it at ten, and separate them in their beds.' {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17883}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17884}\n\nThe majority give the authority of discipline to the father, the mother, the grandfather, the executor and the custodian appointed by the judge: they command the child to do the acts of obedience and forbid him the forbidden, and discipline him first by speech, then warning, then rebuke, then beating; the lighter is not passed over for the heavier while the lighter achieves the purpose. Beating must be likely to bring the benefit, must not be severe or painful, and must avoid the face and the lethal parts. The Hanafis confine it to the hand and not beyond three strokes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17884}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17885}\n\nAmong the duties of guardianship over minors are their health and their care, and their training in whatever knowledge or crafts they are fit for, paid from their property, and the letting of a discerning minor's labour within what is customary, according to the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17885}\n\nGuardianship in marriage. The father has the authority to marry his minor son and daughter, by agreement of the four schools; the others differ. The Hanafis allow the grandfather and the brother to marry them, with the right to choose on reaching puberty; the Hanbalis deny it to anyone but the father. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17886}\n\nAn insane person has a guardian who manages his affairs, feeds him, treats him and restrains him where his harm is feared. He may be married if it serves his interest; if he has lucid intervals he may not be married without his consent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17886}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17887}\n\nFemaleness is a cause of guardianship over the person and is confined to two things: a woman's marriage, and the discipline of a wife in rebellion. Guardianship in marriage is either compulsion (ijbar) or choice (ikhtiyar). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17887}\n\nThe cause of compulsion: the Malikis, Shafi'is and, in the sounder Hanbali view, hold it is virginity, so the guardian may compel a virgin adult sane woman. The Hanafis hold that the cause is minority, so he may not compel an adult sane woman; Ibn Taymiyya and Ibn al-Qayyim agree. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17887}\n\nA woman marrying herself. The Shafis, Malikis and Hanbalis hold that a marriage is not valid without a guardian, and a woman may not marry herself or delegate a non-guardian to marry her. Abu Hanifa does not require a guardian for a free adult sane woman, who may conclude her own marriage or appoint whom she wishes. A view reported from Ibn Sirin, al-Qasim ibn Muhammad, al-Hasan ibn Salih and Abu Yusuf is that it is not valid without the guardian's permission, and if she does it, it stands on his consent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17887}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17888}\n\nObstructing (adl): the guardian's refusal to marry a woman to a suitable man when she asks and he wants her; the effect is the transfer of the guardianship to another. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17888}\n\nThe husband's disciplinary authority. The jurists hold that the marriage contract carries the husband's authority to discipline his wife if she disobeys and is rebellious, on the verse 'those from whom you fear rebellion, admonish them, leave them in the beds, and strike them'. He first admonishes her gently, then leaves her in the bed, then strikes her lightly as far as it corrects her. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17888}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17889}\n\nThe authority of the endowment's administrator is a special authority that requires the execution of words over another. It is a right established by law over every endowed thing, which needs a hand to keep it, maintain it, let it, collect its yield and spend it on its purpose by the founder's terms. It is original, for the founder, the beneficiary or the judge, or derivative, by stipulation, delegation or appointment. Only a trustworthy and capable person is appointed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17889}\n\nThe authority of God. Ibn al-Qayyim says it is general, the authority of every pious believer, according to his faith and piety (cited: 'God is the protector of the believers'; 'God is the protector of those who believe; He brings them from darkness to light'); and special, the performance of all God's rights, preferring Him over everything else. Ibn Taymiyya says that a believer who wrongs himself has of God's authority in proportion to his faith and piety. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17889}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17890}\n\nAl-Shawkani says that the friends of God are sincere believers, who have drawn near to God by obedience. Al-Ghanimi says the wali in the passive sense is one whom God keeps and does not leave to himself, and in the active sense one who performs worship and obedience. Their being free of slips is not infallibility, which is for prophets alone, but God preserves them from persisting in error. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17890}"
