id: concept/wilaya-fiqh
class: concept
kind: legal
label:
  ar: "وِلاية"
  en: "Wilaya (authority and guardianship, fiqh)"
  es: "Wilaya (autoridad y tutela, fiqh)"
  fr: "Wilaya (autorité et tutelle, fiqh)"
summary:
  ar: "الوِلاية بالكسر في اللغة من الوَلْي، وهو القرب، ويقال وليه أي دنا منه، وتولى الأمر أي تقلده؛ والولاية بالفتح النصرة والمحبة، وولي اليتيم والقتيل والمرأة من يقوم بأمرهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17849}\n\nوالولاية في الاصطلاح عند جل الفقهاء تنفيذ القول على الغير شاء أو أبى، فتشمل الإمامة العظمى والقضاء والحسبة والمظالم والشرطة، وتشمل قيام الكبير الراشد على القاصر في تدبير شؤونه؛ وتُطلق على سلطة الزوج في تأديب زوجته الناشز، وسلطة الوالد في تأديب ولده الصغير، وسلطة المعلم على تلاميذه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17850}\n\nوعند المالكية الولاية آصرة موجبة للإرث، فهي خمسة أنواع: ولاية الإسلام، ولا يورث بها إلا عند عدم غيرها، وولاية الحلف، وولاية الهجرة، وكان التوارث بهما في أول الإسلام ثم نُسخ، وولاية القرابة، وولاية العتق، والميراث بهما ثابت. وأوضح ابن رشد مرادهم: فولاية الإسلام عامة بنص القرآن، وولاية الحلف كانت التوارث بها أول الإسلام ثم نُسخت بآية أولي الأرحام، وولاية الهجرة كانت التوارث بها أول الإسلام ثم نُسخت بذلك، وولاية النسب ثابتة بالقرآن، وولاية العتق توجب الميراث عند انقطاع النسب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17850}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17851}\n\nوولاية الله للمؤمنين معناها أن يتولى أمرهم بالمحبة والهداية والنصرة؛ وقال ابن القيم إنها عامة لكل مؤمن تقي، وخاصة لمن قام بجميع حقوق الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17851}\n\nالألفاظ ذات الصلة: النيابة، وهي أن يقوم الإنسان عن غيره بفعل أمر، والولاية أعم منها مطلقاً، فكل نيابة ولاية وليس كل ولاية نيابة. والعمالة، وهي أجرة من يلي الصدقة، والوالي أعم من العامل. والقوامة، وهي الحفظ والرعاية والتدبير، والقيّم هو المتولي والناظر على الصغير والمجنون والسفيه وعلى مال الوقف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17852}\n\nالألفاظ ذات الصلة بالولاية: القوامة، وهي أخص من الولاية، وتعني الحفظ والصيانة؛ والوصاية، وهي إقامة الإنسان غيره مقامه بعد وفاته للنظر في تركته وشؤون أولاده الصغار، وهي أخص من الولاية؛ والوكالة، وهي تفويض الشخص غيره فيما يقبل النيابة في حياته، وهي أخص من الولاية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17852}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17853}\n\nالولاية العامة سلطة على إلزام الغير وإنفاذ التصرف عليه بغير تفويض منه، تتعلق بأمور الدين والدنيا والنفس والمال، وتهيمن على مرافق الحياة العامة، لجلب المصالح ودرء المفاسد، وهي منصب ديني ودنيوي شرع لثلاثة أمور: الأمر بالمعروف والنهي عن المنكر، وأداء الأمانات إلى أهلها، والحكم بين الناس بالعدل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17853}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17854}\n\nومراتبها تتدرج من الإمام الأعظم إلى نوابه وولاته، وبها تُجهز الجيوش وتُسد الثغور وتُجبى الأموال وتُصرف في محلها، وتُعيّن القضاة والولاة، وتُقام الحدود والتعازير، ويُقمع البغاة، ويُفصل بين الخصوم، ويُنصب الأوصياء والنظار ويُحاسبون. وقال ابن تيمية إن مقصود الولايات في الإسلام أن يكون الدين كله لله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17854}\n\nواعتبرت الشريعة ولاية أمر الناس من أعظم واجبات الدين، لأن الناس لا تتم مصالحهم إلا بالاجتماع ولابد لهم من رأس، ولقوله «إذا خرج ثلاثة في سفر فليؤمّروا أحدهم». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17854}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17855}\n\nالشروط المشتركة للولاية العامة: الإسلام، بالإجماع، لقوله تعالى في سورة النساء ⁦(الآية ١٤٤ والآية ٥٩)⁩؛ والبلوغ، بالإجماع، للحديث «رُفع القلم عن ثلاث»؛ والعقل، بلا خلاف؛ والحرية، فلا يتولاها العبد؛ والذكورة، عند جمهور أهل العلم، لقوله تعالى «الرجال قوامون على النساء» ⁦(سورة النساء، الآية ٣٤)⁩، ولقوله «لن يفلح قوم ولّوا أمرهم امرأة»؛ والعدالة، عند الجمهور؛ والعلم بالأحكام الشرعية، عند الجمهور، ويشترط السمناني العلم بأصول الدين والاجتهاد في فروعه، فيما نقل عن بعض المعاصرين أن ذلك يقتضي ألا يصح لإمام إمامة في عصره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17855}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17856}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17857}\n\nالكفاية الجسمية، وهي أن يكون الوالي سميعاً بصيراً ناطقاً، لأن الخلل في الأعضاء والحواس يعجزه عن كمال التصرف، وقال الجويني إن نقص الحواس يحول دون الانتهاض في الملمات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17857}\n\nالرأي والكفاية، وهما تختلفان بحسب الولاية؛ فما يلزم في الإمامة العظمى من المقدرة السياسية والحربية والفكرية لا يشترط فيما دونها. واستشهد الفقهاء بقول النبي لأبي ذر «إنك ضعيف، وإنها أمانة»، وبقوله «إذا ضيعت الأمانة فانتظر الساعة». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17857}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17858}\n\nتقديم الأمثل عند الاضطرار. إذا تعذر اجتماع الشروط في الناس، فلا يُعطَّل إسناد الولايات، بل يُقدم الأصلح والأمثل، لأن الضرورة تبيح المحظورات، ولأن حفظ بعض المصالح أولى من تضييعها كلها، ولقوله تعالى «فاتقوا الله ما استطعتم»؛ وقال العز بن عبد السلام إن تعذرت العدالة في الناس لم يجز تعطيل المصالح، بل يُقدّم أمثل الفسقة. وتُوجب الضرورة السعي في إصلاح الأحوال حتى تكمل الشروط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17858}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17859}\n\nواجبات صاحب الولاية العامة تختلف بحسب ولايته. والالتزام بأحكام الشريعة في الأقوال والأعمال والأخلاق واجب عليه، لأنه قدوة للناس؛ وأداء الأمانة واجب، لقوله تعالى «إن الله يأمركم أن تؤدوا الأمانات إلى أهلها» ⁦(سورة النساء، الآية ٥٨)⁩. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17859}\n\nقال النبي «ما من عبد يسترعيه الله رعية، يموت يوم يموت وهو غاش لرعيته، إلا حرم الله عليه الجنة»، وقال «من استعمل رجلاً من عصابة وفيها من هو أرضى لله منه فقد خان الله ورسوله»، فيجب على من ولي شيئاً من أمر المسلمين أن يستعمل في كل موضع أصلح من يقدر عليه وأمثلهم؛ وقال ابن تيمية إن العدول عن الأحق لقرابة أو ولاء أو صداقة أو موافقة في بلد أو مذهب أو جنس، أو رشوة، أو ضغن، فهو خيانة لله ورسوله والمؤمنين. وأداء الأمانة عنده مبني على خشية الله، وألا يشتري بآياته ثمناً قليلاً، وترك خشية الناس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17860}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17861}\n\nالعدل ميزان الله في الأرض وقوام الدين والدنيا، وقد نص الفقهاء على أن الولاية إذا شملها العدل كانت من أفضل الطاعات، وأن العادل من الأئمة والولاة أعظم أجراً، وأن ولاة الجور أعظم الناس وزراً، وجماع السياسة العادلة أداء الأمانات إلى أهلها والحكم بالعدل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17861}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17862}\n\nالأمر بالمعروف والنهي عن المنكر هو مقصود الولايات كلها، وهو فرض على كل قادر، ويصير فرض عين على القادر إذا لم يقم به غيره، وذوو السلطان أقدر فعليهم من الوجوب ما ليس على غيرهم. وتختلف الولايات: فبعضها بمنزلة الشاهد المؤتمن المطلوب منه الصدق، وبعضها بمنزلة الأمين المطاع المطلوب منه العدل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17861}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17862}\n\nمشورة أهل العلم وذوي الرأي والتجربة واجبة على صاحب الولاية، لقوله تعالى «وأمرهم شورى بينهم» ⁦(سورة الشورى، الآية ٣٨)⁩؛ وقال ابن خويز منداد إن الوالي يستشير العلماء فيما لا يعلم، ووجوه الجيش في الحرب، ووجوه الناس في المصالح، والكتاب والعمال والوزراء في عمارة البلاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17862}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17863}\n\nرعاية حاجات الأمة ومصالحها واجب في كل ولاية، لقوله «من ولاه الله شيئاً من أمر المسلمين فاحتجب دون حاجتهم وخلتهم وفقرهم احتجب الله دون حاجته»؛ وقال القرافي إن الولاية إنما تتناول جلب المصلحة الخالصة أو الراجحة ودرء المفسدة الخالصة أو الراجحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17863}\n\nحقوق صاحب الولاية: طاعته في المعروف، وهو متفق عليه، لقوله تعالى «أطيعوا أولي الأمر منكم»، ولقوله «السمع والطاعة على المرء المسلم فيما أحب وكره ما لم يؤمر بمعصية». وحرمة الخروج على ولي الأمر العادل متفق عليها، والخروج على الجائر مختلف فيه. ونصيحته واجبة، لقوله «الدين النصيحة... ولأئمة المسلمين وعامتهم»، وتكون بالرفق والتلطف لا بالفضح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17863}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17864}\n\nوللمتولي حق في بيت المال يُرتب له منه ما يكفيه وعياله، قياساً على عامل الصدقة، لأنه متفرغ لمصالح المسلمين، ولئلا يُدفع إلى الرشوة أو الكسب الحرام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17864}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17865}\n\nأنواع الولاية العامة تختلف بحسب الأقاليم والأعصار والأعراف، وقد بلغت عند الفقهاء أكثر من عشرين نوعاً. منها الإمامة الكبرى، وهي الرئاسة العظمى في حراسة الدين وسياسة الدنيا خلافة عن النبي، وتُسمى كبرى تمييزاً لها عن إمامة الصلاة؛ والوزارة، وهي ولاية شرعية يخولها الإمام لشخص موثوق، وتنقسم إلى وزارة تفويض ووزارة تنفيذ؛ وولاية القضاء، وحقيقتها تبيين الحكم الشرعي مع الإلزام به وفصل الخصومات، ومنها ولاية جزئية كمتولي العقود في الأنكحة وحدها، أو النظر في الأيتام وحدها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17865}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17866}\n\nولاية المظالم، قال الماوردي إنها قود المتظالمين إلى التناصف بالرهبة، وزجر المتنازعين عن التجاحد بالهيبة، ويشترط فيمن يتولاها جلالة القدر ونفاذ الأمر وعظم الهيبة وظهور العفة وقلة الطمع وكثرة الورع؛ فإن كان ممن يملك الأمور العامة كالوزراء والأمراء لم يحتج إلى تقليد، وإلا احتاج إليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17867}\n\nولاية الإمارة على ضربين: إمارة استكفاء تنعقد باختيار الإمام، عامة لبلد أو إقليم، أو خاصة بتدبير الجيش وسياسة الرعية وحماية البيضة دون القضاء والخراج؛ وإمارة استيلاء يعقدها الإمام اضطراراً لمن غلب على بلد بالقوة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17867}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17868}\n\nولاية الشرطة. أعوان السلطان، ووظيفتها عند ابن الأمين القرطبي أمران: معونة الحكام في الحبس والإطلاق والإشخاص، والنظر في الجنايات وإقامة الحدود؛ وسماها ابن خلدون بحسب البلاد الحاكم أو صاحب المدينة أو الوالي. وقال التاج السبكي إن للشرطة الفحص عن المنكرات كالخمر والحشيش وسد الذريعة فيها والستر على من ستره الله، وليس لها التجسس على الناس ولا كبس البيوت بمجرد القيل والقال، بل ترسل رجلاً مأموناً ينهى عن المنكر بقدره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17868}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17869}\n\nوسمّى ابن تيمية هذه الولاية «ولاية الحرب الصغرى»، تمييزاً لها عن «الحرب الكبرى»، ومعتمدها المنع من الفساد في الأرض وقمع أهل الشر والعدوان، وذكر أنها في بلاد الشام ومصر تختص بالحدود التي فيها إتلاف وبالحكم في المخاصمات، وفي المغرب ينفذ الوالي ما يأمر به القاضي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17869}\n\nولاية الحسبة هي الأمر بالمعروف إذا ظهر تركه، والنهي عن المنكر إذا ظهر فعله، وهي من الخطط الدينية كالصلاة والفتيا والقضاء والجهاد؛ وهي نوعان: أصلية من الشارع لكل من طُلب منه، ومستمدة من عهد الخليفة أو الأمير، وهي للمحتسب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17869}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17870}\n\nولاية الإمارة على الجهاد تختص بقتال المشركين، وهي ضربان: مقصورة على سياسة الجيش وتدبير الحرب، أو مفوّضة إلى الأمير جميع أحكامه من قسمة الغنائم وعقد الصلح، وإذا عُقدت على غزوة واحدة لم يغزُ غيرها، وإذا عُقدت عموماً لزمه معاودة الغزو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17870}\n\nولاية حروب المصالح تختص بقتال غير المشركين، كأهل الردة وأهل البغي وقطاع الطريق. وولاية السعاية وجباية الصدقة تنحصر في الأموال الزكوية، ولا يكون متولّيها إلا عالماً بأحكام الصدقات ومقاديرها وصفاتها، حليماً غير عنيف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17870}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17871}\n\nالولاية الخاصة. تُطلق على ثلاثة ضروب: النيابة الجبرية على القاصر في شؤونه الشخصية ⁦(الولاية على النفس)⁩، وشؤونه المالية ⁦(الولاية على المال)⁩؛ وولاية المتولي على الوقف، وهي ولاية مالية محضة؛ والسلطة التي جعلها الشرع لأهل القتيل في استيفاء القصاص أو العفو عنه إلى الدية، لقوله تعالى «ومن قُتل مظلوماً فقد جعلنا لوليه سلطاناً»، وقوله «من قُتل له قتيل فأهله بين خيرتين». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17871}\n\nانتقال الولاية الخاصة إلى الولي العام عند عدم أهلها، لقوله «السلطان ولي من لا ولي له»، فيمارسها السلطان بنفسه أو بنوابه. والولاية الخاصة مقدمة على العامة لأنها أقوى؛ فولاية المتولي على الوقف ووصي اليتيم أقوى من ولاية القاضي، والقاضي أقوى من ولاية إمام المسلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17871}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17872}\n\nومن الفروع: القاضي لا يتصرف في الوقف مع وجود متولٍّ عليه، ولا في مال اليتيم مع وجود وصي الأب، ولا يزوج اليتيمة إلا عند عدم الولي أو عضله، وللولي الخاص العفو عن القصاص مجاناً، وليس للإمام ذلك؛ وإذا أجّر القاضي حانوت الوقف وأجّره المتولي، فإجارة المتولي معتبرة. وللولي العام الإشراف العام، فله أن يحاسب الأوصياء والنظار ويعزل الخائن منهم ولو شرط الواقف عدم مداخلته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17872}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17873}\n\nالولاية الخاصة على المال نوعان: قاصرة، وهي سلطة المرء على ماله، ومتعدية، وهي سلطة المرء على مال غيره، وهي أصلية كولاية الأب والجد على مال القاصر، ونيابية كالوصي والوكيل. وتثبت الولاية المتعدية على المحجور عليهم: الصغير، والمجنون، والمعتوه، والسفيه، ومن بهم غفلة، وتستمر ما دام الوصف قائماً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17873}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17874}\n\nوعن السفيه: الشافعية والمالكية والحنابلة والصاحبان يجيزون الحجر عليه، وأبو حنيفة لا يجيزه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17874}\n\nالمحجور عليه، كالسفيه وذي الغفلة، وحكم ذي الغفلة حكم السفيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17875}\n\nمن له الولاية على مال المحجور عليهم. عند الحنفية الترتيب: الأب، ثم وصيه، ثم وصي وصيه، ثم الجد، ثم وصيه، ثم وصي وصيه، ثم القاضي، ثم من نصبه القاضي؛ لأن الولاية مبنية على الشفقة، وشفقة الأب فوق شفقة كل أحد. وليس للأم ولا للأخ ولا للعم ولاية التصرف في مال الصغير، لقصور شفقة الأخ والعم، ولقصور الرأي عند النساء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17875}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17876} وعند المالكية: الأب، ثم وصيه، ثم وصي الوصي، ثم الحاكم أو وصيه. وعند الشافعية: الأب، ثم الجد، ثم من يوصي إليه المتأخر منهما، ثم القاضي أو أمينه، ولا تلي الأم في الأصح، ومقابله تلي. وعند الحنابلة: الأب، ثم وصيه، ثم الحاكم، ثم أمين الحاكم عند عدمه، ولا ولاية للجد ولا للأم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17876}\n\nما يجوز للولي من التصرفات. لا يجوز له التصرف إلا على وجه النظر والاحتياط وما فيه حظ للمحجور، لقوله «لا ضرر ولا ضرار». فلا يملك الهبة بغير عوض، ولا الوصية، ولا الصدقة، ولا العتق، ولا المحاباة في المعاوضة، ويضمن ما تبرع به. وأما الهبة بعوض فعند أبي حنيفة وأبي يوسف لا يجوز، وعند محمد والحنابلة يجوز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17876}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17877}\n\nوله الاتجار بمال المحجور، ودفعه مضاربة بجزء شائع من ربحه، وبيعه نسيئة للمصلحة، وإيداعه عند أمين، وشراء عقار له بمثل القيمة أو بأقل، وبيع عقاره وإجارته بثمن المثل أو بما فيه حظ له، وأن يوكل بذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17877}\n\nإقراض مال المحجور. الحنفية والمالكية يمنعونه، لأن القرض إزالة للملك بلا عوض للحال، بخلاف القاضي الذي يُقرض لحفظ الدين؛ والشافعية يجيزونه عند الخوف من النهب أو الحريق أو الغرق لثقة مليء؛ والحنابلة يجيزونه لمصلحة كالسفر، ويستحب الرهن أو الكفيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17877}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17878}\n\nوللولي أن يطالب بحقوق المحجور ويقيم البينة ويحلف الخصم، ويصالح بالشيء الذي تقوم به بينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17878}\n\nشراء الولي مال المحجور لنفسه أو بيعه له. المالكية يجيزون للأب شراء مال ابنه الصغير لنفسه وبيع ماله له إن كان فيه نظر للولد؛ والشافعية للأب والجد فقط؛ والحنابلة وزفر يمنعون، إلا الأب؛ والحنفية للأب ذلك بمثل القيمة أو بما يتغابن الناس بمثله، وأجازوا لوصي الأب أن يشتري لنفسه مال اليتيم إن كان فيه خير له عند أبي حنيفة وأبي يوسف دون محمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17878}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17879}\n\nأكل الولي من مال موليه. الحنفية يجيزون للوصي أجرة مثل عمله استحساناً إن كان محتاجاً، وبعضهم يمنع؛ والمالكية يمنعون الغني، ويجيزون الفقير كفايته بالمعروف، لقوله تعالى «ومن كان فقيراً فليأكل بالمعروف»؛ والشافعية: أقل الأمرين من الأجرة والنفقة للفقير المشغول بالولاية؛ والحنابلة: الأقل من أجرة المثل أو الكفاية، إلا الحاكم وأمينه. والجصاص يمنع الولي من الأكل مطلقاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17879}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17880}\n\nوهل يلزم رد بدل ما أكله الولي الفقير عند يساره؟ الجمهور لا يلزمه، لأنه عوض عن عمله؛ وأبو العالية وعبيدة السلماني والشافعية في مقابل الأظهر يلزمونه الضمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17880}\n\nالإنفاق على المحجور واجب بالمعروف، من غير إسراف ولا تقتير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17880}\n\nتنمية الولي مال اليتيم. ثلاثة أقوال: الأول للجمهور: للولي أن يتجر فيه وينميه، لأنه أصلح له، ولا يتجر به لنفسه؛ ويقول مالك «لا بأس بالتجارة في أموال اليتامى إذا كان الولي مأموناً»، وروي عن عمر «ابتغوا في أموال اليتامى». والثاني للشافعية في الأصح: يجب تنميته بقدر النفقة والزكاة إن أمكن. والثالث للجصاص وبعض الشافعية وابن تيمية: مندوب، لقوله تعالى «قل إصلاح لهم خير»؛ ويستحب عند ابن تيمية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17880}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17881}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17882}\n\nالولاية على النفس، وهي سلطة على شؤون القاصر المتعلقة بشخصه، كالتزويج والتعليم والتطبيب والتشغيل. وأسبابها ثلاثة: الصغر، والجنون ⁦(ويلحق به العته)⁩، والأنوثة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17882}\n\nالولاية على النفس عند الفقهاء: سلطة على شؤون القاصر ونحوه المتعلقة بشخصه، كالتزويج والتعليم والتطبيب والتشغيل، وأسبابها: الصغر، والجنون ⁦(ويلحق به العته)⁩، والأنوثة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17882}\n\nولاية التربية والتأديب. منشؤها مسؤولية الأبوين عن الأولاد في شؤونهم الدنيوية والأخروية، لقوله تعالى «قوا أنفسكم وأهليكم ناراً»، ولقوله «كلكم راع وكلكم مسؤول عن رعيته». وقال النووي إن على الأب تعليم ولده ما يحتاج إليه من وظائف الدين، وهذا واجب على الأب وسائر الأولياء قبل البلوغ. وقال الغزالي إن الطفل أمانة عند والديه، وقلبه قابل لكل نقش. وفي الحديث «مروا أولادكم بالصلاة وهم أبناء سبع سنين، واضربوهم عليها وهم أبناء عشر، وفرقوا بينهم في المضاجع». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17883}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17884}\n\nوجمهور الفقهاء يثبتون ولاية التأديب للأب والأم والجد والوصي والقيم من قبل القاضي، بأمر الصغير بالطاعات ونهيه عن المحظورات، وتأديبه بالقول، ثم الوعيد، ثم التعنيف، ثم الضرب، ولا يرقى إلى الأشد ما يحصل الغرض بالأخف. ويشترط في الضرب أن يغلب على الظن تحصيل المصلحة، وألا يكون مبرّحاً، وأن يتوقى الوجه والمواضع المهلكة؛ والحنفية يقصرونه على اليد، وألا يجاوز الثلاث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17884}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17885}\n\nومن موجبات الولاية على الصغار مداواته ورعايته صحياً، وتعليمه ما يستعد له من العلوم والحرف، بأجرة من ماله، وإيجار نفسه إن كان مميزاً بالمعروف، عند جمهور الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17885}\n\nولاية التزويج. للأب ولاية تزويج ابنه وابنته الصغيرين، باتفاق الحنفية والمالكية والشافعية والحنابلة؛ وفي غير الأب خلاف، فالحنفية يجيزون للجد والأخ تزويجهما مع الخيار عند البلوغ، والحنابلة يمنعون غير الأب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17886}\n\nوللمجنون ولي يدبر شؤونه وينفق عليه ويداويه ويقيّده إن خيف منه الأذى. ويجوز تزويجه إذا اقتضت مصلحته، فإن كانت له إفاقة لم يزوج بغير إذنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17886}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17887}\n\nالأنوثة سبب للولاية على النفس، وتنحصر في أمرين: تزويج المرأة، وتأديب الزوجة عند النشوز؛ وتنقسم ولاية التزويج إلى الإجبار والاختيار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17887}\n\nولاية الإجبار علتها عند المالكية والشافعية والحنابلة في الراجح البكارة، فيجبر الولي البكر البالغة العاقلة؛ وعند الحنفية علتها الصغر، فلا يجبر البالغة العاقلة، وإلى ذلك ذهب ابن تيمية وابن القيم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17887}\n\nولاية المرأة في تزويج نفسها: الشافعية والمالكية والحنابلة يمنعونه ولا يصح النكاح إلا بولي؛ وأبو حنيفة لا يشترط الولي للحرة البالغة العاقلة؛ وروي عن ابن سيرين والقاسم بن محمد والحسن بن صالح وأبي يوسف أنه لا يجوز بغير إذن الولي، فإن فعلت كان موقوفاً على إجازته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17887}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17888}\n\nعضل الولي، وهو منعه المرأة من التزويج بكفئها إذا طلبت ذلك ورغب فيها كفء، وموجبه انتقال الولاية إلى غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17888}\n\nالولاية التأديبية للزوج: للزوج تأديب زوجته إذا استعصت ونشزت، لقوله تعالى «واللاتي تخافون نشوزهن فعظوهن واهجروهن في المضاجع واضربوهن»، فيعظها بالرفق أولاً، ثم يهجرها في المضجع، ثم يضربها ضرباً غير مبرّح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17888}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17889}\n\nولاية ناظر الوقف ولاية خاصة تقتضي تنفيذ القول على الغير، وهي حق مقرر شرعاً على كل عين موقوفة، تُحفظ وتُعمر وتُؤجر وتُصرف غلتها إلى جهتها بحسب شرط الواقف، ولا يولى إلا الأمين القادر. وهي أصلية للواقف أو الموقوف عليه أو القاضي، أو فرعية بشرط أو تفويض أو توكيل أو إيصاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17889}\n\nولاية الله تعالى. قال ابن القيم إنها نوعان: عامة، وهي ولاية كل مؤمن تقي، لقوله تعالى «والله ولي المؤمنين» و«الله ولي الذين آمنوا يخرجهم من الظلمات إلى النور»؛ وخاصة، وهي القيام لله بجميع حقوقه، وإيثاره على كل ما سواه. وقال ابن تيمية إن الظالم لنفسه من أهل الإيمان معه من ولاية الله بقدر إيمانه وتقواه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17889}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17890}\n\nوقال الشوكاني إن المراد بأولياء الله خلّص المؤمنين، لأنهم قربوا من الله بطاعته، وقال الغنيمي إن الولي بمعنى المفعول من تولاه الله برعايته، وبمعنى الفاعل من تولى عبادته وطاعته. ولا تعني سلامتهم من الهفوات العصمة، إذ لا عصمة إلا لنبي، بل إن الله يحفظه من التمادي في الزلل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17890}\n\nالفرق بين الولي والنبي. الأنبياء معصومون وجوباً، والأولياء ليسوا كذلك، فقد يقترفون الذنوب، ولكن الولي محفوظ من الإصرار؛ والأنبياء يجب الإيمان بجميع ما يخبرون به وطاعتهم فيما يأمرون، والأولياء يُعرض أمرهم وخبرهم على الكتاب والسنة؛ والأنبياء يتلقون الوحي، والولي يتبع النبي، ولو ادعى النبوة كان عدواً لله؛ والنبوة ختمت بنبينا، والولاية باقية إلى قيام الساعة؛ ومن سب نبياً كفر، ومن سب ولياً لم يكفر إلا إن خالف أصلاً من أصول الإيمان. وأجمع أهل السنة على تفضيل الأنبياء على الأولياء، وقال ابن تيمية إن أفضل أولياء الله أنبياؤه، وأفضل الرسل أولو العزم، وأفضلهم نبينا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17891}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17892}\n\nمعيار التفرقة بين أولياء الرحمن وأولياء الشيطان ليس الخوارق، فقد تقع على أيدي الأعداء، وإنما الصفات والأفعال والأحوال التي دل عليها الكتاب والسنة؛ ومن كان متبعاً لهما فكراماته رحمانية، ومن لم يتمسك بهما فأحواله شيطانية. وضابط ابن القيم في ذلك ما يتلبس به العبد من قول وفعل وحال، ويُكشف عن ذلك في الصلاة ومحبة السنة وأهلها والدعوة إلى الله ورسوله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17892}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17893}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17894}\n\nالكرامة في الاصطلاح، كما قال ابن عابدين، ظهور أمر خارق للعادة على يد عبد ظاهر الصلاح ملتزم لمتابعة نبي، مقترن بصحيح الاعتقاد والعمل الصالح، غير مقترن بدعوى النبوة. وأهل السنة أثبتوا جوازها ووقوعها، وأنكرها المعتزلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17894}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17895}\n\nالفرق بين الكرامة والمعجزة. المعجزة تقترن بالتحدي، وتجب إظهارها لحاجة الناس إلى معرفة صدق النبي، والكرامة لا تقترن بالتحدي ويستحب سترها؛ ودلالة المعجزة قطعية، ودلالة الكرامة ظنية، ولا يعلم أحد أن صاحبها ولي؛ وتدل المعجزة على عصمة صاحبها ووجوب اتباعه، والكرامة لا تدل على ذلك؛ وقال بعض الفقهاء إن الكرامة لا تبلغ مبلغ المعجزة في جنسها وعظمها، وقال آخرون: كل ما جاز أن يكون معجزة لنبي جاز أن يكون كرامة لولي، لكن المعجزة تقترن بدعوى النبوة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17895}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17896}\n\nالخوارق قبل البعثة تُسمى إرهاصاً، وليست معجزات. وكرامة الولي معجزة للنبي من جهة أن الولي من أمته، فلا يكون ولياً إلا إذا كان محقاً في التصديق بالرسول وطاعته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17896}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17897}\n\nوما يظهر على يد ظاهر الفسق مطابقاً لدعواه يسمى استدراجاً، وعلى يد مدعي النبوة من أهل الضلال يسمى إهانة. وقد ذكر ابن تيمية أن الدجال يأتي بخوارق، فلا تثبت بها ولاية أو إسلام، ولا بد من الوقوف عند الأمر والنهي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17897}"
  en: "Wilaya, with a kasra, in the language comes from the root wali, nearness; he is near to him, and one who takes up a matter is said to have governed it. With a fatha it means help and love. The guardian (wali) of an orphan, of a slain person, or of a woman is one who takes charge of their affairs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17849}\n\nIn the technical sense most jurists use wilaya as carrying out a word over another whether he wills it or not. It covers the supreme imamate, judgeship, the office of hisba (public order), the grievances court and the police, and the adult's management of the affairs of one who is still a minor. The word is also used for a husband's authority to discipline a rebellious wife, a father's to discipline a young son, and a teacher's over his pupils. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17850}\n\nThe Malikis use wilaya for a bond that causes inheritance, in five kinds: wilayat al-Islam, which gives inheritance only when no other kind exists; wilayat al-hilf (alliance); wilayat al-hijra (migration), by which inheritance was given at the start of Islam and then abrogated, as were the alliance; wilayat al-qaraba (kinship); and wilayat al-'itq (manumission), by which inheritance stands. Ibn Rushd explains that the wilaya of Islam is general, by the verse of believers as protectors of one another; the wilaya of alliance was abrogated by the verse of the kin; the wilaya of migration was likewise abrogated; kinship by the verse of shares; and manumission gives inheritance where lineage fails. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17850}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17851}\n\nGod's wilaya over believers means that He takes charge of them with love, guidance and help. Ibn al-Qayyim says it is general for every pious believer and special for one who keeps all God's rights. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17851}\n\nRelated words: deputising (niyaba), which is one person standing in place of another in an act; wilaya is wider than it, so every deputising is a wilaya, but not every wilaya is a deputising. 'Amala, the fee of the collector of charity; the wali is wider than the collector. Qiwama, the custody and care of a matter; the custodian (qayyim) is the manager and administrator of a minor, an insane or a spendthrift, or of an endowment's property. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17852}\n\nRelated words. Qiwama is narrower than wilaya and means keeping and preserving. Wasiya (guardianship after death) is the setting of another in one's place after death to look after the estate and the young children, and is narrower too. Wakala is the delegation of a disposal that admits delegation during one's life, and is narrower than wilaya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17852}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17853}\n\nGeneral authority (wilaya 'amma) is power to compel and carry out an act over another without his delegation, in matters of religion and the world, of persons and property, governing the public affairs of life, to secure benefits and avert harms. It is a religious and worldly office, instituted for three things: enjoining good and forbidding wrong, delivering trusts to their owners, and judging among people with justice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17853}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17854}\n\nIts ranks run from the supreme imam down to his deputies and governors. By it armies are equipped, frontiers defended, taxes collected and spent where they belong, judges and governors appointed, the hudud and the discretionary penalties enforced, rebels suppressed, disputes settled, and guardians and custodians appointed and held to account. Ibn Taymiyya says the aim of all authority in Islam is that religion be wholly God's. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17854}\n\nThe law makes the authority over people one of the greatest duties of religion, since people's interests are not secured without gathering, and gathering needs a head; hence the saying that when three go on a journey they should appoint one of them as leader. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17854}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17855}\n\nThe common conditions of general authority. Islam is required by agreement, on the verses of Surat al-Nisa (verses 144 and 59, cited by number). Puberty is required by agreement, on the saying that the pen is lifted from three. Sanity is required without dispute. Freedom is required, so a slave does not hold it. Male sex is required by the majority, on the verse that men are guardians over women (Surat al-Nisa, verse 34) and the saying that a people who give their affairs to a woman will not prosper. Justice is required by the majority, and knowledge of the rulings by the majority; al-Samarqandi requires knowledge of the principles of religion and independent judgement in its branches, and reports that a scholar of his time held that this would mean that no imam could hold office, so that a man can rely on others for what he lacks. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17855}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17856}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17857}\n\nBodily soundness: the holder must hear, see and speak, since a defect in these senses prevents full action; al-Juwayni says that loss of sight, hearing or speech prevents rising to urgent matters. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17857}\n\nOpinion and capacity. These differ with each office: what is needed in the supreme imamate (political, military and intellectual ability, firmness, compassion and shrewdness) is not required of lesser offices. The Prophet told Abu Dharr: 'you are weak, and it is a trust', and said: 'when trust is lost, await the hour'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17857}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17858}\n\nChoosing the best when the ideal is absent. When all the conditions cannot be met, the appointment of holders is not suspended; the most suitable is chosen, since necessity permits what is forbidden, and keeping some interests is better than losing all. Al-'Izz ibn 'Abd al-Salam says that if justice were absent from all people, the interests of judges, caliphs and governors could not be suspended, and the best of the corrupt would be chosen. Necessity also requires striving to reform matters until the conditions are completed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17858}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17859}\n\nThe duties of the holder of general authority vary with the office. He must keep to the law of Islam in word, deed and conduct, since he is an example; and he must discharge trusts, as the verse of Surat al-Nisa (verse 58) commands. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17859}\n\nThe Prophet said: 'No servant whom God appoints over a flock dies on the day he dies while deceiving them without God forbidding him Paradise.' He also said: 'Whoever appoints a man from a group while in it is one more pleasing to God has betrayed God and His Messenger.' So whoever holds any part of the affairs of Muslims must appoint in each place the most suitable and most capable he can find. Ibn Taymiyya says that turning from the most entitled to another for kinship, clientage, friendship, shared town or school, race, bribery or grudge is betrayal of God, His Messenger and the believers. He holds that the discharge of trust rests on three things: fear of God, not selling His signs for a small price, and not fearing people. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17860}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17861}\n\nJustice is God's balance on earth and the support of religion and the world. The jurists say that when authority is accompanied by justice it is among the best acts of obedience; a just imam, ruler or judge has a greater reward than all others, and unjust rulers bear the greatest burden. The sum of just governance is the delivery of trusts to their owners and judging with justice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17861}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17862}\n\nEnjoining good and forbidding wrong is the purpose of all authority. It is an obligation on each capable person, and becomes an individual obligation on the capable one when no one else undertakes it; those in power bear more of it. Offices differ: some are like a trusted witness, required to be truthful, and others like a trusted commander, required to be just. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17861}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17862}\n\nConsulting people of knowledge, judgement and experience is obligatory for the holder of general authority, on the verse that he should consult them in the matter (Surat al-Shura, verse 38, cited by number). Ibn Khuwaz Mindad said that rulers must consult the scholars where they do not know or where religious matters are unclear, the commanders in war, the notables on public interests, and the scribes and governors on the good of the lands. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17862}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17863}\n\nCaring for the needs of the community is an obligation in every office, on the saying that whoever God gives authority over Muslims and shuts himself off from their needs, poverty and wants, God shuts Himself off from his needs. Al-Qarafi says that authority is for securing pure or preponderant benefit and averting pure or preponderant harm. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17863}\n\nThe rights of the holder of authority include obedience in what is good, agreed upon, on the verse 'obey those in authority among you' and the saying 'hearing and obedience are due to the Muslim in what he likes and dislikes, unless he is ordered to sin'. Rebellion against a just ruler is agreed to be forbidden; rebellion against an unjust one is disputed. Advising him is obligatory, on the saying 'religion is sincere counsel... to the leaders of the Muslims and their common folk'; it should be gentle and private, not public censure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17863}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17864}\n\nThe holder has a right to a stipend from the public treasury sufficient for him and his dependants, by analogy with the zakat collector, since he devotes himself to the interests of Muslims, and so that he is not driven to bribery or unlawful gain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17864}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17865}\n\nThe kinds of general authority differ with regions, eras and customs, and the jurists count more than twenty. They include the supreme imamate, the great leadership in guarding religion and governing the world as deputy of the Prophet, called 'great' to distinguish it from leading the prayer; the vizierate, a legal authority the imam gives to a trusted man, in two kinds, delegated and executive; and the judgeship, whose reality is declaring the legal ruling with binding force and settling disputes, with partial kinds such as a supervisor of marriage contracts only or of orphans' affairs only. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17865}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17866}\n\nThe mazalim (grievances) authority. Al-Mawardi says it is the leading of wrongdoers to fairness through awe, and the restraint of disputants from denying one another's rights through dignity. Its holder must be of high rank, obeyed, of great presence, clearly chaste, little greedy and very pious. Those who already hold general powers, such as ministers and amirs, need no separate appointment; others need one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17867}\n\nThe amirate (imara) has two kinds. The chosen amirate (istikfa') is made by the imam, general over a town or region or specific to the army's command, the protection of the realm and the defence of its honour, without judgement, taxes or alms. The seized amirate (istila') is made by the imam out of necessity, when a commander has taken a land by force and the caliph gives him its command. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17867}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17868}\n\nThe police (shurta) are the sultan's aides. Ibn al-Amin al-Qurtubi gives them two tasks: helping the judges in imprisonment and release, and investigating crimes and carrying out the hudud. Ibn Khaldun notes the title varies by land (hakim, sahib al-madina, wali). Taj al-Din al-Subki says the police may investigate public wrongs such as wine and hashish and stop their pretext, and cover those whom God has covered, but may not spy on people or raid their houses on rumour; they should send a trusted man in secret to forbid the wrong only as far as God has forbidden it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17868}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17869}\n\nIbn Taymiyya calls this the 'lesser war' (wilayat al-harb al-sughra), to distinguish it from the 'greater war', which he describes as the deputising of the sultanate. Its purpose is to prevent corruption on earth and suppress the wicked and aggressive. He says that in his time in the Levant and Egypt it covered the hudud involving bodily harm and judgement in disputes, while in the Maghrib the governor only carries out what the judge orders. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17869}\n\nThe hisba is enjoining good when it is abandoned and forbidding evil when it is committed. It is a religious office like prayer, giving fatwas, judgeship and jihad. It is of two kinds: an original office from the lawgiver, binding on everyone asked, and a delegated one, given by the caliph or amir, held by the muhtasib. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17869}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17870}\n\nThe amirate of jihad is only against polytheists, and is of two kinds: one limited to army policy and the conduct of war, and one that includes the division of booty and the making of treaties. If it is made for a single campaign, the amir may not undertake another; if it is general, he must renew campaigns year by year. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17870}\n\nAuthority over wars for the public good is against non-polytheists: apostates, rebels and highwaymen. The office of collecting charity is limited to zakat funds; its holder must know the rules, the amounts, the kinds of property and the payers, and be gentle and vigilant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17870}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17871}\n\nSpecial authority (wilaya khassa) has three forms: the compulsory deputising over a minor's person and property (guardianship over the person and over property), the authority of the administrator of an endowment over its property, and the authority the law gives the kin of a slain person to exact retaliation or to pardon it for blood-money, on the verses and sayings 'whoever is slain wrongly, We have given his heir authority' and 'the kin of the slain have the choice of two things'. The first is the common meaning in the jurists' usage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17871}\n\nSpecial authority passes to the general authority when its holders are absent, on the saying 'the sultan is the guardian of him who has no guardian'; the sultan exercises it himself or through his deputies, such as governors and judges, since the deputies stand in his place. Special authority prevails over general authority, since it is stronger. Thus the endowment administrator prevails over the judge, and the guardian of an orphan prevails over the judge; the judge may not dispose of an orphan's property while the father's executor exists, nor marry an orphan except when there is no guardian or the guardian refuses. The holder of special authority may pardon retaliation free of charge, and the imam may not. If the judge leases an endowed shop to one man and the administrator leases it to another, the administrator's lease stands. The general authority nonetheless supervises all, and may audit the executors, supervisors and administrators, and remove the dishonest among them, even if the donor or founder stipulated against his interference. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17871}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17872}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17873}\n\nHanafi exceptions: the administrator may not appoint officers for the endowed purposes unless the founder stipulated it, but the judge may; the judge may lend an orphan's property without the father or executor. Ibn al-Qasim of the Malikis says that if the sultan marries an adult woman while her guardian is present, the marriage stands and is not annulled. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17873}\n\nSpecial authority over property is of two kinds: the authority over one's own property (qasira, proper to any fully capable person) and authority over another's property (muta'addiya), which is either original, given by the lawgiver (the father's or grandfather's authority over a minor's property), or deputising, such as the executor or agent. It is established over those under restraint: the minor, the insane, the imbecile, the spendthrift and the inattentive, and lasts while the cause remains. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17873}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17874}\n\nThe minor is one who has not reached puberty, male or female; he is discerning or not discerning. The insane is one whose reason is gone so that his words and acts do not go right, and it is permanent or intermittent; his acts while insane are void, and while sane are valid. The imbecile has little understanding and disordered speech but does not strike or curse; he may be like a non-discerning or a discerning minor. The spendthrift squanders his property against reason or the law, from a levity of joy or anger. The Shafi'is, Malikis, Hanbalis and the two companions of Abu Hanifa allow him to be placed under restraint, while Abu Hanifa does not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17874}\n\nThe prodigal and the inattentive (dhu al-ghafla), who is cheated for his simplicity, are treated like the spendthrift in restraint. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17875}\n\nWho holds authority over the property of those under restraint? The Hanafis give the order: the father, his executor, the executor's executor, the grandfather, his executor, the executor's executor, the judge, and then the judge's appointee; the order follows compassion, which is greatest in the father. The mother, the brother and the uncle have no authority over a minor's property, since a brother's or uncle's compassion is deficient and women's judgement is weak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17875}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17876} The Malikis: the father, his executor, the executor's executor, then the judge or his executor. The Shafi'is: the father, then the grandfather, then the executor of the later of them, then the judge or his trustee; the mother does not act in the sounder view, though the opposite view lets her act. The Hanbalis: the father, his executor, then the judge, then his trustee in his absence; neither the grandfather nor the mother has authority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17876}\n\nWhat the guardian may do. He may act only with care, precaution, and in what benefits the ward, on the saying 'no harm and no reciprocal harm'. He may not make a gift without return, a bequest, a charity, a manumission, or give an undue favour in an exchange, and he must compensate what he gave away. A gift for a return is, by Abu Hanifa and Abu Yusuf, not valid; by Muhammad and the Hanbalis, valid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17876}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17877}\n\nHe may trade with the ward's property, give it in partnership for a fixed share of profit, sell it on credit where useful, deposit it with a trusted person, buy real estate for it at the value or less, sell and lease his property at its value or better, and appoint another for all of this. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17877}\n\nLending the ward's money. The Hanafis and Malikis forbid it, since a loan removes ownership without an immediate return, unlike the judge who lends to preserve the debt. The Shafis allow it where he fears plunder, fire or drowning, to a trusted solvent person. The Hanbalis allow it for a reason such as travel, and prefer a surety or pledge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17877}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17878}\n\nHe may claim the ward's rights, prove them, make the opponent swear, and compromise on a part of a debt where there is evidence, and collect part of what is due to the ward where there is none. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17878}\n\nBuying or selling the ward's property to oneself. The Malikis allow the father to buy his minor son's property for himself and sell his own to the son if it benefits the son; the Shafis allow it only to the father and grandfather; the Hanbalis and Zufar forbid it except for the father; the Hanafis allow the father to buy at the value or the usual range, and allow the executor of the father to buy for himself where it is clearly better; Muhammad forbids it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17878}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17879}\n\nThe guardian eating from the ward's property. The Hanafis allow the executor a customary wage for his work if he is in need, by istihsan; some forbid it. The Malikis forbid the rich guardian and allow the poor one his sufficiency in what is customary, on the verse 'whoever is poor, let him eat in what is customary'. The Shafis give the poor guardian the lesser of wage and maintenance. The Hanbalis allow the lesser of the customary wage and his sufficiency, except for the judge and his trustee. Al-Jassas forbids it altogether. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17879}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17880}\n\nMust the poor guardian repay what he ate when he becomes rich? The majority say no, since it is a return for his work. Abu al-'Aliya, 'Ubayda al-Salmani and the Shafi'i view opposite the sounder one say he must pay it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17880}\n\nThe guardian must maintain the ward and his dependants from the ward's property, in what is customary, without extravagance or meanness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17880}\n\nDeveloping an orphan's property. Three views. The first, the majority's: the guardian may trade with it and develop it, since that is better for the orphan, but he may not trade with it for himself; Malik says 'no harm in trade with orphans' property where the guardian is trusted', and 'Umar said 'trade with the property of orphans, so that charity does not consume it'. The second, the sounder Shafi'i view: it is obligatory to develop it to the extent of the maintenance and zakat, where possible. The third, of al-Jassas and some Shafis and Ibn Taymiyya: it is recommended, not obligatory, on the verse 'say: to set them right is good'; Ibn Taymiyya says it is recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17880}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17881}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17882}\n\nGuardianship over the person is authority over the ward's personal affairs: marriage, teaching, medical care and employment. Its causes are three: minority, insanity (and imbecility, which follows it), and femaleness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17882}\n\nGuardianship over the person, as the jurists use it, is authority over a minor's or another incapable person's personal affairs, such as marriage, teaching, medical care and employment. Its causes are three: minority, insanity (with imbecility, which follows it), and femaleness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17882}\n\nGuardianship of upbringing and discipline. It rests on the responsibility of parents for their children's worldly and eternal affairs, on the verse 'save yourselves and your families from a fire' and the saying 'each of you is a shepherd and each is responsible for his flock'. Al-Nawawi says the father must teach his son what he needs of religious duties, a duty on the father and every guardian before puberty. Al-Ghazali says a child is a trust with his parents and his heart accepts any impression. The saying is: 'Command your children to pray at seven years old, strike them for it at ten, and separate them in their beds.' {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17883}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17884}\n\nThe majority give the authority of discipline to the father, the mother, the grandfather, the executor and the custodian appointed by the judge: they command the child to do the acts of obedience and forbid him the forbidden, and discipline him first by speech, then warning, then rebuke, then beating; the lighter is not passed over for the heavier while the lighter achieves the purpose. Beating must be likely to bring the benefit, must not be severe or painful, and must avoid the face and the lethal parts. The Hanafis confine it to the hand and not beyond three strokes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17884}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17885}\n\nAmong the duties of guardianship over minors are their health and their care, and their training in whatever knowledge or crafts they are fit for, paid from their property, and the letting of a discerning minor's labour within what is customary, according to the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17885}\n\nGuardianship in marriage. The father has the authority to marry his minor son and daughter, by agreement of the four schools; the others differ. The Hanafis allow the grandfather and the brother to marry them, with the right to choose on reaching puberty; the Hanbalis deny it to anyone but the father. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17886}\n\nAn insane person has a guardian who manages his affairs, feeds him, treats him and restrains him where his harm is feared. He may be married if it serves his interest; if he has lucid intervals he may not be married without his consent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17886}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17887}\n\nFemaleness is a cause of guardianship over the person and is confined to two things: a woman's marriage, and the discipline of a wife in rebellion. Guardianship in marriage is either compulsion (ijbar) or choice (ikhtiyar). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17887}\n\nThe cause of compulsion: the Malikis, Shafi'is and, in the sounder Hanbali view, hold it is virginity, so the guardian may compel a virgin adult sane woman. The Hanafis hold that the cause is minority, so he may not compel an adult sane woman; Ibn Taymiyya and Ibn al-Qayyim agree. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17887}\n\nA woman marrying herself. The Shafis, Malikis and Hanbalis hold that a marriage is not valid without a guardian, and a woman may not marry herself or delegate a non-guardian to marry her. Abu Hanifa does not require a guardian for a free adult sane woman, who may conclude her own marriage or appoint whom she wishes. A view reported from Ibn Sirin, al-Qasim ibn Muhammad, al-Hasan ibn Salih and Abu Yusuf is that it is not valid without the guardian's permission, and if she does it, it stands on his consent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17887}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17888}\n\nObstructing (adl): the guardian's refusal to marry a woman to a suitable man when she asks and he wants her; the effect is the transfer of the guardianship to another. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17888}\n\nThe husband's disciplinary authority. The jurists hold that the marriage contract carries the husband's authority to discipline his wife if she disobeys and is rebellious, on the verse 'those from whom you fear rebellion, admonish them, leave them in the beds, and strike them'. He first admonishes her gently, then leaves her in the bed, then strikes her lightly as far as it corrects her. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17888}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17889}\n\nThe authority of the endowment's administrator is a special authority that requires the execution of words over another. It is a right established by law over every endowed thing, which needs a hand to keep it, maintain it, let it, collect its yield and spend it on its purpose by the founder's terms. It is original, for the founder, the beneficiary or the judge, or derivative, by stipulation, delegation or appointment. Only a trustworthy and capable person is appointed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17889}\n\nThe authority of God. Ibn al-Qayyim says it is general, the authority of every pious believer, according to his faith and piety (cited: 'God is the protector of the believers'; 'God is the protector of those who believe; He brings them from darkness to light'); and special, the performance of all God's rights, preferring Him over everything else. Ibn Taymiyya says that a believer who wrongs himself has of God's authority in proportion to his faith and piety. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17889}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17890}\n\nAl-Shawkani says that the friends of God are sincere believers, who have drawn near to God by obedience. Al-Ghanimi says the wali in the passive sense is one whom God keeps and does not leave to himself, and in the active sense one who performs worship and obedience. Their being free of slips is not infallibility, which is for prophets alone, but God preserves them from persisting in error. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17890}\n\nThe difference between the friend of God (wali) and the prophet. Prophets are infallible by necessity; friends of God are not, and may commit sins, but a friend of God is kept from persisting in them. One must believe all that prophets report and obey what they command; the words of a friend of God are weighed against the Book and the Sunna. Prophets receive revelation; the friend follows the prophet, and one who claims prophecy is an enemy of God. Prophecy ended with our Prophet; friendship lasts until the Hour. Whoever reviles a prophet is an unbeliever; whoever reviles a friend is not, unless he contradicts a root of faith. Muslims agree that prophets are better than friends who are not prophets, and Ibn Taymiyya says the best friends of God are His prophets, the best of them the messengers of firm resolve, and the best of these our Prophet. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17891}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17892}\n\nThe criterion distinguishing the friends of the Merciful from the friends of the devil is not marvels, since these may happen at the hands of enemies. It is the qualities, acts and states that the Book and the Sunna describe: whoever follows them has marvels that are of the Merciful; whoever does not has states that are of the devil. Ibn al-Qayyim's test is what the servant does in word, deed and state, examined in his prayer, love of the Sunna and its people, and his call to God and His Messenger. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17892}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17893}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17894}\n\nKarama (a grace) is, in the definition of Ibn 'Abidin, the appearance of a marvel contrary to custom at the hands of a servant of evident righteousness who follows a prophet, with sound belief and good works, not accompanied by a claim of prophecy. Sunni scholars hold it lawful and actual; the Mu'tazilis deny it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17894}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17895}\n\nThe difference between karama and miracle (mu'jiza). A miracle is accompanied by a challenge, and the prophet must show it, since people must know his truth; a karama is not accompanied by a challenge and the friend should hide it. The proof of a miracle is certain, and of a karama probable; no one knows for certain that the one who has it is a friend of God. A miracle proves the prophet's infallibility and the duty to follow him; a karama proves neither. Some jurists hold that a karama cannot reach a miracle in kind or greatness; others hold that whatever may be a prophet's miracle may be a friend's karama, but that a miracle is accompanied by a claim of prophecy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17895}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17896}\n\nMarvels before the mission are called irhas (foundations), not miracles; a friend's karama is also a miracle of the prophet, since the friend is of his community and is a friend only if he believes and obeys the messenger. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17896}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17897}\n\nA marvel that happens at the hands of an evident sinner and agrees with his claim is called istidraj (leading on); at the hands of a false claimant to prophecy it is called humiliation (ihana). Ibn Taymiyya says that the Antichrist's marvels prove no friendship or Islam; one must stop at God's command and prohibition. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17897}"
  es: "Wilaya, con kasra, en el idioma proviene de la raíz wali, cercanía; él está cerca de él, y se dice que quien se ocupa de un asunto lo ha gobernado. Con fatha significa ayuda y amor. El tutor (wali) de un huérfano, de una persona asesinada o de una mujer es quien se hace cargo de sus asuntos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17849} En el sentido técnico, la mayoría de los juristas usan wilaya como el cumplimiento de una palabra sobre otro, lo quiera o no. Abarca el imamato supremo, el poder judicial, el cargo de hisba (orden público), el tribunal de quejas y la policía, y la administración de los asuntos de un adulto sobre un menor. La palabra también se usa para la autoridad de un esposo para disciplinar a una esposa rebelde, de un padre para disciplinar a un hijo pequeño y de un maestro sobre sus alumnos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17850} Los malikíes usan wilaya para un vínculo que causa herencia, en cinco tipos: wilayat al-Islam, que da herencia solo cuando no existe otro tipo; wilayat al-hilf (alianza); wilayat al-hijra (migración), por la cual la herencia se dio al comienzo del Islam y luego fue abrogada, al igual que la alianza; wilayat al-qaraba (parentesco); y wilayat al-'itq (manumisión), por la cual la herencia se mantiene. Ibn Rushd explica que la wilaya del Islam es general, por el versículo de los creyentes como protectores unos de otros; la wilaya de alianza fue abrogada por el versículo del parentesco; la wilaya de migración fue igualmente abrogada; el parentesco por el versículo de las partes; y la manumisión da herencia cuando falla el linaje. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17850}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17851} La wilaya de Dios sobre los creyentes significa que Él se hace cargo de ellos con amor, guía y ayuda. Ibn al-Qayyim dice que es general para todo creyente piadoso y especial para aquel que guarda todos los derechos de Dios. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17851} Palabras relacionadas: deputación (niyaba), que es una persona que se coloca en lugar de otra en un acto; wilaya es más amplia que ella, por lo que toda deputación es una wilaya, pero no toda wilaya es una deputación. 'Amala, la tarifa del recaudador de caridad; el wali es más amplio que el recaudador. Qiwama, la custodia y el cuidado de un asunto; El custodio (qayyim) es el administrador de un menor, un demente o un derrochador, o de los bienes de una fundación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17852} Palabras relacionadas. Qiwama es más específico que wilaya y significa guardar y preservar. Wasiya (tutela después de la muerte) es la designación de otra persona en lugar de uno después de la muerte para cuidar los bienes y los hijos pequeños, y también es más específico. Wakala es la delegación de una disposición que admite delegación durante la vida de uno, y es más específico que wilaya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17852}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17853} La autoridad general (wilaya 'amma) es el poder de obligar y ejecutar un acto sobre otro sin su delegación, en asuntos de religión y del mundo, de personas y propiedades, gobernando los asuntos públicos de la vida, para asegurar beneficios y evitar daños. Es un cargo religioso y mundano, instituido para tres cosas: ordenar el bien y prohibir el mal, entregar fideicomisos a sus dueños y juzgar entre las personas con justicia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17853}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17854} Sus rangos van desde el imán supremo hasta sus diputados y gobernadores. Mediante ella se equipan los ejércitos, se defienden las fronteras, se recaudan y gastan los impuestos donde corresponde, se nombran jueces y gobernadores, se aplican el hudud y las penas discrecionales, se reprimen los rebeldes, se resuelven las disputas y se nombran y responsabilizan a los guardianes y custodios. Ibn Taymiyya dice que el objetivo de toda autoridad en el Islam es que la religión sea enteramente de Dios. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17854} La ley hace de la autoridad sobre las personas uno de los mayores deberes de la religión, ya que los intereses de las personas no están asegurados sin la reunión, y la reunión necesita un líder; de ahí el dicho de que cuando tres van de viaje deben nombrar a uno de ellos como líder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17854}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17855} Las condiciones comunes de la autoridad general. El Islam es obligatorio por acuerdo, según los versículos de la Sura al-Nisa (versículos 144 y 59, citados por número). La pubertad es obligatoria por acuerdo, según el dicho de que la pluma se levanta de tres. La cordura es obligatoria sin discusión. La libertad es obligatoria, para que un esclavo no la posea. El sexo masculino es obligatorio por mayoría, según el versículo que dice que los hombres son guardianes de las mujeres (Sura al-Nisa, versículo 34) y el dicho de que un pueblo que confía sus asuntos a una mujer no prosperará. La justicia es obligatoria por mayoría, y el conocimiento de las normas por mayoría; al-Samarqandi exige conocimiento de los principios de la religión y juicio independiente en sus ramas, e informa que un erudito de su tiempo sostenía que esto significaría que ningún imán podría ejercer un cargo, para que un hombre pueda depender de otros para lo que le falte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17855}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17856}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17857} Salud física: el titular debe oír, ver y hablar, ya que un defecto en estos sentidos impide la acción completa; al-Juwayni dice que la pérdida de la vista, el oído o el habla impide abordar asuntos urgentes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17857} Opinión y capacidad. Estas difieren con cada cargo: lo que se necesita en el imamato supremo (capacidad política, militar e intelectual, firmeza, compasión y astucia) no se requiere de los cargos menores. El Profeta le dijo a Abu Dharr: 'eres débil, y es una confianza', y dijo: 'cuando se pierde la confianza, espera la hora'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17857}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17858} Elegir al mejor cuando el ideal está ausente. Cuando no se pueden cumplir todas las condiciones, el nombramiento de los titulares no se suspende; se elige al más adecuado, ya que la necesidad permite lo prohibido, y conservar algunos intereses es mejor que perderlos todos. Al-'Izz ibn 'Abd al-Salam dice que si la justicia estuviera ausente de todas las personas, los intereses de los jueces, califas y gobernadores no podrían suspenderse, y se elegiría al mejor de los corruptos. La necesidad también requiere esforzarse por reformar las cosas hasta que se completen las condiciones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17858}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17859} Los deberes del titular de autoridad general varían según el cargo. Debe atenerse a la ley del Islam en palabra, obra y conducta, ya que es un ejemplo; y debe cumplir con los fideicomisos, como ordena el versículo de Surat al-Nisa (versículo 58). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17859} El Profeta dijo: 'Ningún siervo a quien Dios designa sobre un rebaño muere el día de su muerte engañándolos sin que Dios le prohíba el Paraíso'. También dijo: 'Quien designa a un hombre de un grupo cuando en él hay uno más agradable a Dios ha traicionado a Dios y a Su Mensajero. ' Así pues, quienquiera que ocupe cualquier parte de los asuntos de los musulmanes debe nombrar en cada lugar al más adecuado y capaz que pueda encontrar. Ibn Taymiyya dice que apartar al más merecedor para dárselo a otro por parentesco, clientela, amistad, ciudad o escuela compartida, raza, soborno o rencor es una traición a Dios, a Su Mensajero y a los creyentes. Él sostiene que el cumplimiento de la confianza se basa en tres cosas: temor de Dios, no vender Sus signos por un precio pequeño y no temer a la gente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17860}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17861} La justicia es el equilibrio de Dios en la tierra y el sustento de la religión y del mundo. Los juristas dicen que cuando la autoridad va acompañada de justicia es uno de los mejores actos de obediencia; un imán, gobernante o juez justo tiene una recompensa mayor que todos los demás, y los gobernantes injustos soportan la mayor carga. La esencia del gobierno justo es la entrega de los fideicomisos a sus dueños y el juicio con justicia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17861}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17862} Ordenar el bien y prohibir el mal es el propósito de toda autoridad. Es una obligación para cada persona capaz, y se convierte en una obligación individual para la persona capaz cuando nadie más la asume; quienes están en el poder soportan más de ella. Los cargos difieren: algunos son como un testigo de confianza, que debe ser veraz, y otros como un comandante de confianza, que debe ser justo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17861}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17862} Consultar a personas de conocimiento, juicio y experiencia es obligatorio para quien ostenta la autoridad general, según el versículo que dice que debe consultarlos en el asunto (Sura al-Shura, versículo 38, citado por número). Ibn Khuwaz Mindad dijo que los gobernantes deben consultar a los eruditos cuando no saben o cuando los asuntos religiosos no están claros, a los comandantes en la guerra, a los notables en los intereses públicos y a los escribas y gobernadores en el bien de las tierras. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17862}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17863} Cuidar de las necesidades de la comunidad es una obligación en todo cargo, según el dicho de que a quien Dios da autoridad sobre los musulmanes y se aparta de sus necesidades, pobreza y carencias, Dios se aparta de sus necesidades. Al-Qarafi dice que la autoridad es para asegurar el beneficio puro o preponderante y evitar el daño puro o preponderante. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17863} Los derechos del titular de la autoridad incluyen la obediencia en lo que es bueno, acordado, según el versículo 'obedeced a quienes tienen autoridad entre vosotros' y el dicho 'el musulmán debe escuchar y obedecer en lo que le agrada y le disgusta, a menos que se le ordene pecar'. Se acepta que la rebelión contra un gobernante justo está prohibida; la rebelión contra uno injusto es objeto de controversia. Aconsejarle es obligatorio, según el dicho «la religión es un consejo sincero... para los líderes de los musulmanes y su gente común»; debe ser amable y privado, no una censura pública. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17863}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17864} El titular tiene derecho a un estipendio del tesoro público suficiente para él y sus dependientes, por analogía con el recaudador del zakat, ya que se dedica a los intereses de los musulmanes y para que no se vea impulsado al soborno o a la ganancia ilícita. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17864}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17865} Los tipos de autoridad general difieren según las regiones, las épocas y las costumbres, y los juristas cuentan más de veinte. Incluyen el imamato supremo, el gran liderazgo en la custodia de la religión y el gobierno del mundo como representante del Profeta, llamado 'grande' para distinguirlo de dirigir la oración; el visirato, una autoridad legal que el imán otorga a un hombre de confianza, en dos tipos, delegada y ejecutiva; y el poder judicial, cuya realidad es declarar el fallo legal con fuerza vinculante y resolver disputas, con tipos parciales como un supervisor solo de contratos matrimoniales o solo de asuntos de huérfanos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17865}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17866} La autoridad mazalim (quejas). Al-Mawardi dice que es guiar a los malhechores hacia la justicia a través del temor reverencial, y la restricción de los disputantes para que no nieguen los derechos del otro a través de la dignidad. Su poseedor debe ser de alto rango, obedecido, de gran presencia, claramente casto, poco codicioso y muy piadoso. Aquellos que ya poseen poderes generales, como ministros y emires, no necesitan un nombramiento separado; los demás sí lo necesitan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17867} El emirato (imara) tiene dos tipos. El emirato elegido (istikfa') es creado por el imán, general sobre una ciudad o región o específico para el mando del ejército, la protección del reino y la defensa de su honor, sin juicio, impuestos ni limosnas. El emirato tomado (istila') es creado por el imán por necesidad, cuando un comandante ha tomado una tierra por la fuerza y el califa le da su mando. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17867}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17868} La policía (shurta) son los ayudantes del sultán. Ibn al-Amin al-Qurtubi les asigna dos tareas: ayudar a los jueces en el encarcelamiento y la liberación, e investigar los crímenes y llevar a cabo el hudud. Ibn Khaldun señala que el título varía según la tierra (hakim, sahib al-madina, wali). Taj al-Din al-Subki dice que la policía puede investigar delitos públicos como el vino y el hachís y detener su pretexto, y proteger a aquellos a quienes Dios ha protegido, pero no puede espiar a la gente ni allanar sus casas por rumores; deben enviar a un hombre de confianza en secreto para prohibir el mal solo en la medida en que Dios lo haya prohibido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17868}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17869} Ibn Taymiyya llama a esto la 'guerra menor' (wilayat al-harb al-sughra), para distinguirla de la 'guerra mayor', que describe como la delegación del sultanato. Su propósito es prevenir la corrupción en la tierra y reprimir a los malvados y agresivos. Dice que en su tiempo en el Levante y Egipto abarcaba el hudud relacionado con el daño corporal y el juicio en disputas, mientras que en el Magreb el gobernador solo ejecuta lo que ordena el juez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17869} La hisba es ordenar el bien cuando se abandona y prohibir el mal cuando se comete. Es un oficio religioso como la oración, dar fatwas, juzgar y la yihad. Hay dos tipos: un oficio original del legislador, vinculante para todo aquel al que se le pide, y uno delegado, dado por el califa o emir, ejercido por el muhtasib. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17869}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17870} El emirato de la yihad es solo contra los politeístas, y es de dos tipos: uno limitado a la política del ejército y la conducción de la guerra, y otro que incluye la división del botín y la celebración de tratados. Si se hace para una sola campaña, el emir no puede emprender otra; si es general, debe renovar las campañas año tras año. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17870} La autoridad sobre las guerras por el bien público es contra los no politeístas: apóstatas, rebeldes y bandoleros. El cargo de recaudar caridad se limita a los fondos del zakat; su titular debe conocer las reglas, las cantidades, los tipos de propiedad y los contribuyentes, y ser amable y vigilante. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17870}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17871} La autoridad especial (wilaya khassa) tiene tres formas: la tutela obligatoria sobre la persona y los bienes de un menor (tutela sobre la persona y sobre los bienes), la autoridad del administrador de una dotación sobre sus bienes, y la autoridad que la ley otorga a los parientes de una persona asesinada para exigir represalias o para perdonarla por dinero de sangre, sobre los versículos y dichos 'a quien sea asesinado injustamente, hemos dado autoridad a su heredero' y 'los parientes del asesinado tienen la opción de dos cosas'. El primero es el significado común en el uso de los juristas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17871} La autoridad especial pasa a la autoridad general cuando sus titulares están ausentes, según el dicho «el sultán es el tutor de quien no tiene tutor»; el sultán la ejerce él mismo o a través de sus delegados, como gobernadores y jueces, ya que los delegados lo representan. La autoridad especial prevalece sobre la autoridad general, puesto que es más fuerte. Así, el administrador de la dotación prevalece sobre el juez, y el tutor de un huérfano prevalece sobre el juez; el juez no puede disponer de los bienes de un huérfano mientras exista el albacea del padre, ni casarse con un huérfano salvo que no haya tutor o que el tutor se niegue. El titular de la autoridad especial puede perdonar la represalia gratuitamente, y el imán no. Si el juez arrienda una tienda dotada a un hombre y el administrador la arrienda a otro, el arrendamiento del administrador es el que prevalece. La autoridad general, sin embargo, supervisa a todos y puede auditar a los albaceas, supervisores y administradores, y destituir a los deshonestos entre ellos, incluso si el donante o fundador estipuló en contra de su interferencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17871}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17872}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17873} Excepciones hanafi: el administrador no puede nombrar funcionarios para los fines dotados a menos que el fundador lo estipule, pero el juez sí puede; el juez puede prestar la propiedad de un huérfano sin el padre o el albacea. Ibn al-Qasim de los malikíes dice que si el sultán se casa con una mujer adulta mientras su tutor está presente, el matrimonio es válido y no se anula. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17873} La autoridad especial sobre la propiedad es de dos tipos: la autoridad sobre la propiedad propia (qasira, propia de cualquier persona plenamente capaz) y la autoridad sobre la propiedad ajena (muta'addiya), que es original, otorgada por el legislador (la autoridad del padre o abuelo sobre la propiedad de un menor), o delegada, como la del albacea o agente. Se establece sobre aquellos bajo restricción: el menor, el demente, el imbécil, el derrochador y el distraído, y dura mientras la causa permanezca. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17873}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17874} El menor es aquel que no ha alcanzado la pubertad, varón o mujer; es discernidor o no discernidor. El demente es aquel cuya razón se ha perdido de tal manera que sus palabras y actos no son correctos, y es permanente o intermitente; sus actos mientras está demente son nulos, y mientras está cuerdo son válidos. El imbécil tiene poco entendimiento y habla desordenada pero no golpea ni maldice; puede ser como un menor no discernidor o discernidor. El derrochador malgasta su propiedad contra la razón o la ley, por una ligereza de alegría o ira. Los shafi'is, malikíes, hanbalíes y los dos compañeros de Abu Hanifa permiten que se le imponga restricción, mientras que Abu Hanifa no. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17874} El pródigo y el distraído (dhu al-ghafla), que es engañado por su ingenuidad, son tratados como el derrochador en restricción. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17875} ¿Quién tiene autoridad sobre los bienes de aquellos bajo restricción? Los Hanafis dan el orden: el padre, su albacea, el albacea del albacea, el abuelo, su albacea, el albacea del albacea, el juez y luego el designado por el juez; el orden sigue la compasión, que es mayor en el padre. La madre, el hermano y el tío no tienen autoridad sobre los bienes de un menor, ya que la compasión de un hermano o tío es deficiente y el juicio de las mujeres es débil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17875}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17876} Los Malikis: el padre, su albacea, el albacea del albacea, luego el juez o su albacea. Los shafi'ís: el padre, luego el abuelo, luego el albacea del último de ellos, luego el juez o su fideicomisario; la madre no actúa en la opinión más sólida, aunque la opinión opuesta le permite actuar. Los hanbalíes: el padre, su albacea, luego el juez, luego su fideicomisario en su ausencia; ni el abuelo ni la madre tienen autoridad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17876} Lo que el tutor puede hacer. Puede actuar solo con cuidado, precaución y en lo que beneficie al tutelado, bajo el dicho 'sin daño ni daño recíproco'. No puede hacer un regalo sin contraprestación, un legado, una caridad, una manumisión, ni dar un favor indebido a cambio, y debe compensar lo que dio. Un regalo a cambio de una contraprestación es, para Abu Hanifa y Abu Yusuf, no válido; para Muhammad y los hanbalíes, válido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17876}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17877} Puede comerciar con la propiedad del pupilo, darla en sociedad por una participación fija en las ganancias, venderla a crédito cuando sea útil, depositarla con una persona de confianza, comprar bienes raíces para ella por su valor o menos, vender y arrendar su propiedad por su valor o más, y nombrar a otra persona para todo esto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17877} Prestar el dinero del pupilo. Los hanafíes y malikíes lo prohíben, ya que un préstamo quita la propiedad sin un retorno inmediato, a diferencia del juez que presta para preservar la deuda. Los shafiíes lo permiten cuando teme saqueo, incendio o ahogamiento, a una persona solvente de confianza. Los hanbalíes lo permiten por una razón como el viaje, y prefieren una garantía o prenda. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17877}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17878} Puede reclamar los derechos del pupilo, probarlos, hacer jurar al oponente y transigir en una parte de una deuda donde haya evidencia, y cobrar parte de lo que se le debe al pupilo donde no la haya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17878} Comprar o vender la propiedad del pupilo para uno mismo. Los malikíes permiten que el padre compre la propiedad de su hijo menor para sí mismo y venda la suya al hijo si beneficia al hijo; los shafiíes lo permiten solo al padre y al abuelo; los hanbalíes y zufar lo prohíben excepto para el padre; Los hanafíes permiten al padre comprar al valor o al rango habitual, y permiten al albacea del padre comprar para sí mismo cuando sea claramente mejor; Muhammad lo prohíbe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17878}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17879} El tutor come de la propiedad del pupilo. Los hanafíes permiten al albacea un salario habitual por su trabajo si está necesitado, por istihsan; algunos lo prohíben. Los malikíes prohíben al tutor rico y permiten al pobre su suficiencia en lo que es habitual, en el versículo 'quien sea pobre, que coma de lo que es habitual'. Los shafiíes dan al tutor pobre el menor entre salario y manutención. Los hanbalíes permiten el menor entre el salario habitual y su suficiencia, excepto para el juez y su fideicomisario. Al-Jassas lo prohíbe por completo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17879}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17880} ¿Debe el tutor pobre devolver lo que comió cuando se enriquece? La mayoría dice que no, ya que es una recompensa por su trabajo. Abu al-'Aliya, 'Ubayda al-Salmani y la opinión shafi'í opuesta a la más sólida dicen que debe pagarlo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17880} El tutor debe mantener al pupilo y a sus dependientes de la propiedad del pupilo, según la costumbre, sin extravagancia ni mezquindad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17880} Desarrollo de la propiedad de un huérfano. Tres puntos de vista. La primera, la opinión mayoritaria: el tutor puede comerciar con ella y desarrollarla, puesto que eso es mejor para el huérfano, pero no puede comerciar con ella para sí mismo; Malik dice que «no hay inconveniente en comerciar con los bienes de los huérfanos cuando se confía en el tutor», y Umar dijo: «Comerciad con los bienes de los huérfanos, para que la caridad no los consuma». La segunda, la opinión shafi'í más sólida: es obligatorio desarrollarla hasta el nivel de manutención y zakat, cuando sea posible. La tercera, de al-Jassas y algunos shafi'íes e Ibn Taymiyya: es recomendable, no obligatorio, en el versículo «di: enderezarlos es bueno»; Ibn Taymiyya dice que es recomendable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17880}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17881}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17882} La tutela sobre la persona es autoridad sobre los asuntos personales del tutelado: matrimonio, enseñanza, atención médica y empleo. Sus causas son tres: minoría de edad, locura (y la imbecilidad que la sigue) y ser mujer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17882} La tutela sobre la persona, como la usan los juristas, es autoridad sobre los asuntos personales de un menor o de otra persona incapaz, como el matrimonio, la enseñanza, la atención médica y el empleo. Sus causas son tres: minoría de edad, locura (con la imbecilidad que la sigue) y ser mujer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17882} La tutela de la crianza y la disciplina. Se basa en la responsabilidad de los padres por los asuntos mundanos y eternos de sus hijos, en el versículo «Sálvense ustedes y sus familias del fuego» y en el dicho «Cada uno de ustedes es un pastor y cada uno es responsable de su rebaño». Al-Nawawi dice que el padre debe enseñar a su hijo lo que necesita de los deberes religiosos, un deber del padre y de todo tutor antes de la pubertad. Al-Ghazali dice que un niño es un encargo de sus padres y su corazón acepta cualquier impresión. El dicho es: «Ordena a tus hijos que recen a los siete años, golpéalos por ello a los diez y sepáralos en sus camas». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17883}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17884} La mayoría otorga la autoridad disciplinaria al padre, la madre, el abuelo, el albacea y el custodio designado por el juez: ordenan al niño que realice actos de obediencia y le prohíben lo prohibido, y lo disciplinan primero con palabras, luego advertencia, luego reprimenda, luego golpes; no se pasa de lo más leve a lo más fuerte mientras lo más leve logre el propósito. Los golpes deben ser susceptibles de producir el beneficio, no deben ser severos ni dolorosos, y deben evitar la cara y las partes letales. Los Hanafis lo limitan a la mano y no más de tres golpes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17884}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17885} Entre los deberes de la tutela sobre los menores están su salud y su cuidado, y su formación en cualquier conocimiento u oficio para el que estén capacitados, pagado con sus bienes, y el alquiler del trabajo de un menor discernidor dentro de lo que es costumbre, según la mayoría. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17885} Tutela en el matrimonio. El padre tiene la autoridad para casar a su hijo e hija menores, por acuerdo de las cuatro escuelas; las otras difieren. Los Hanafi permiten que el abuelo y el hermano los casen, con el derecho a elegir al llegar a la pubertad; los Hanbali lo niegan a cualquiera que no sea el padre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17886} Una persona con discapacidad mental tiene un tutor que administra sus asuntos, la alimenta, la trata y la restringe cuando se teme que sufra algún daño. Puede casarse si le conviene; si tiene intervalos de lucidez, no puede casarse sin su consentimiento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17886}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17887} La condición de mujer es causa de tutela sobre la persona y se limita a dos cosas: el matrimonio de una mujer y la disciplina de una esposa rebelde. La tutela en el matrimonio es obligatoria (ijbar) o voluntaria (ikhtiyar). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17887} La causa de la coacción: los malikíes, shafiíes y, en la opinión más sólida de los hanbalíes, sostienen que es la virginidad, por lo que el tutor puede obligar a una mujer adulta virgen y cuerda. Los hanafíes sostienen que la causa es la minoría de edad, por lo que no puede obligar a una mujer adulta y cuerda; Ibn Taymiyya e Ibn al-Qayyim están de acuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17887} Una mujer que se casa consigo misma. Los shafiíes, malikíes y hanbalíes sostienen que un matrimonio no es válido sin un tutor, y una mujer no puede casarse consigo misma ni delegar en un no tutor que se case con ella. Abu Hanifa no requiere un tutor para una mujer adulta libre y cuerda, quien puede contraer su propio matrimonio o designar a quien desee. Una opinión reportada por Ibn Sirin, al-Qasim ibn Muhammad, al-Hasan ibn Salih y Abu Yusuf es que no es válido sin el permiso del tutor, y si ella lo hace, se basa en su consentimiento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17887}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17888} Obstrucción (adl): la negativa del tutor a casar a una mujer con un hombre adecuado cuando ella lo pide y él la desea; el efecto es la transferencia de la tutela a otro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17888} La autoridad disciplinaria del marido. Los juristas sostienen que el contrato matrimonial otorga al esposo la autoridad para disciplinar a su esposa si desobedece y se rebela, según el versículo «aquellos de quienes temáis la rebelión, amonestadlos, dejadlos en la cama y golpeadlos». Primero la amonesta con suavidad, luego la deja en la cama y después la golpea levemente hasta corregirla. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17888}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17889} La autoridad del administrador de la dotación es una autoridad especial que requiere la ejecución de palabras sobre otra persona. Es un derecho establecido por ley sobre todo bien dotado, que necesita una mano para conservarlo, mantenerlo, administrarlo, recaudar sus frutos y gastarlos en su propósito según los términos del fundador. Es original, para el fundador, el beneficiario o el juez, o derivada, por estipulación, delegación o nombramiento. Solo se designa a una persona digna de confianza y capaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17889} La autoridad de Dios. Ibn al-Qayyim dice que es general, la autoridad de todo creyente piadoso, según su fe y piedad (citado: 'Dios es el protector de los creyentes'; 'Dios es el protector de los que creen; Él los trae de las tinieblas a la luz'); y especial, el cumplimiento de todos los derechos de Dios, prefiriéndolo a Él sobre todo lo demás. Ibn Taymiyya dice que un creyente que se perjudica a sí mismo tiene de la autoridad de Dios en proporción a su fe y piedad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17889}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17890} Al-Shawkani dice que los amigos de Dios son creyentes sinceros, que se han acercado a Dios mediante la obediencia. Al-Ghanimi dice que el wali en sentido pasivo es aquel a quien Dios mantiene y no abandona a sí mismo, y en sentido activo aquel que realiza la adoración y la obediencia. Su ausencia de errores no es infalibilidad, que es solo para los profetas, sino que Dios los preserva de persistir en el error. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17890} La diferencia entre el amigo de Dios (wali) y el profeta. Los profetas son infalibles por necesidad; los amigos de Dios no lo son, y pueden cometer pecados, pero un amigo de Dios es preservado de persistir en ellos. Hay que creer todo lo que los profetas informan y obedecer sus mandamientos; las palabras de un amigo de Dios se sopesan con el Libro y la Sunna. Los profetas reciben revelación; el amigo sigue al profeta, y quien se atribuya la profecía es enemigo de Dios. La profecía terminó con nuestro Profeta; la amistad perdura hasta la Hora. Quien insulta a un profeta es un incrédulo; quien insulta a un amigo no lo es, a menos que contradiga una raíz de la fe. Los musulmanes coinciden en que los profetas son mejores que los amigos que no son profetas, e Ibn Taymiyya afirma que los mejores amigos de Dios son Sus profetas, los mejores de ellos los mensajeros de firme resolución, y el mejor de estos nuestro Profeta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17891}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17892} El criterio que distingue a los amigos del Misericordioso de los amigos del diablo no son los milagros, ya que estos pueden ocurrir a manos de los enemigos. Son las cualidades, los actos y los estados que el Libro y la Sunna describen: quien los sigue tiene milagros que son del Misericordioso; quien no lo hace tiene estados que son del diablo. La prueba de Ibn al-Qayyim es lo que el siervo hace en palabra, obra y estado, examinado en su oración, amor a la Sunna y a su gente, y su llamado a Dios y a Su Mensajero. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17892}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17893}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17894} Karama (una gracia) es, en la definición de Ibn 'Abidin, la aparición de una maravilla contraria a la costumbre por parte de un siervo de evidente rectitud que sigue a un profeta, con fe sólida y buenas obras, sin que esté acompañada de una pretensión de profecía. Los eruditos sunitas la consideran lícita y real; los mutazilíes la niegan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17894}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17895} La diferencia entre karama y milagro (mu'jiza). Un milagro va acompañado de un desafío, y el profeta debe mostrarlo, ya que la gente debe conocer su verdad; un karama no va acompañado de un desafío y el amigo debe ocultarlo. La prueba de un milagro es cierta, y la de un karama probable; nadie sabe con certeza que quien lo tiene es amigo de Dios. Un milagro prueba la infalibilidad del profeta y el deber de seguirlo; un karama no prueba ninguna de las dos. Algunos juristas sostienen que un karama no puede alcanzar a un milagro en tipo o magnitud; otros sostienen que cualquier milagro de un profeta puede ser el karama de un amigo, pero que un milagro va acompañado de una pretensión de profecía. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17895}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17896} Las maravillas anteriores a la misión se llaman irhas (fundamentos), no milagros; el karama de un amigo es también un milagro del profeta, puesto que el amigo pertenece a su comunidad y es amigo solo si cree y obedece al mensajero. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17896}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17897} Un prodigio que ocurre en manos de un pecador evidente y concuerda con su afirmación se llama istidraj (inducción); en manos de un falso pretendiente a la profecía se llama humillación (ihana). Ibn Taymiyya dice que los prodigios del Anticristo no prueban amistad ni Islam; uno debe detenerse ante el mandato y la prohibición de Dios. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17897}"
  fr: "Le terme « wilaya », avec un kasra, provient de la racine « wali », qui signifie proximité; il est proche de lui, et celui qui prend en charge une affaire est dit l'avoir gouvernée. Avec un fatha, il signifie aide et amour. Le tuteur (wali) d'un orphelin, d'une personne tuée ou d'une femme est celui qui prend en charge leurs affaires. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17849} Au sens technique, la plupart des juristes utilisent « wilaya » pour désigner l'exécution d'une décision sur autrui, qu'il le veuille ou non. Ce terme englobe l'imamat suprême, la magistrature, la fonction de hisba (ordre public), le tribunal des griefs et la police, ainsi que la gestion par un adulte des affaires d'un mineur. Il est également employé pour désigner l'autorité d'un mari à discipliner une épouse rebelle, celle d'un père à discipliner son jeune fils et celle d'un enseignant sur ses élèves. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17850} Les Malikites utilisent le terme wilaya pour désigner un lien donnant lieu à l'héritage, et distinguent cinq formes: la wilaya al-Islam, qui n'accorde l'héritage qu'en l'absence d'autre forme; la wilaya al-hilf (alliance); la wilaya al-hijra (migration), qui constituait le fondement de l'héritage aux débuts de l'Islam, avant d'être abrogée, tout comme l'alliance; la wilaya al-qaraba (parenté); et la wilaya al-'itq (affranchissement), qui garantit la pérennité de l'héritage. Ibn Rushd explique que la wilaya de l'Islam est générale, conformément au verset qui établit la protection mutuelle des croyants; la wilaya d'alliance a été abrogée par le verset relatif à la parenté; la wilaya de migration a également été abrogée; la parenté par le verset relatif aux parts; et l'affranchissement confère l'héritage en cas de disparition de la lignée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17850}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17851} La wilaya de Dieu sur les croyants signifie qu'Il prend soin d'eux avec amour, guidance et aide. Ibn al-Qayyim affirme qu'elle est générale pour tout croyant pieux et particulière pour celui qui respecte tous les droits de Dieu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17851} Termes apparentés: la délégation (niyaba), qui consiste pour une personne à se substituer à une autre dans un acte; la wilaya a un sens plus large, donc toute délégation est une wilaya, mais l'inverse n'est pas vrai. L''amala, la rémunération du collecteur de charité; le wali a un sens plus large que le collecteur. La qiwama, la garde et la responsabilité d'une affaire. Le tuteur (qayyim) est le gestionnaire et l'administrateur d'un mineur, d'une personne atteinte de troubles mentaux ou d'un dépensier, ou encore des biens d'une fondation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17852} Termes apparentés: Qiwama est plus restreint que wilaya et signifie garder et préserver. Wasiya (tutelle après décès) consiste à désigner une personne pour gérer le patrimoine et les jeunes enfants après la mort; ce terme est également plus restreint. Wakala est la délégation d'un pouvoir de disposition qui peut être déléguée du vivant du titulaire; ce terme est également plus restreint que wilaya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17852}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17853} L'autorité générale (wilaya 'amma) est le pouvoir de contraindre et d'accomplir un acte sur autrui sans sa délégation, en matière religieuse et temporelle, concernant les personnes et les biens, et de gouverner les affaires publiques afin d'assurer le bien et d'éviter le mal. C'est une fonction religieuse et temporelle, instituée pour trois raisons: ordonner le bien et interdire le mal, remettre les dépôts à leurs propriétaires et juger avec justice entre les personnes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17853}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17854} Ses rangs s'étendent de l'imam suprême à ses adjoints et gouverneurs. Par elle, les armées sont équipées, les frontières défendues, les impôts perçus et dépensés à bon escient, les juges et les gouverneurs nommés, les peines hudud et discrétionnaires appliquées, les rebelles réprimés, les conflits réglés, et les tuteurs et gardiens nommés et tenus responsables. Ibn Taymiyya affirme que le but de toute autorité en Islam est que la religion appartienne entièrement à Dieu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17854} La loi fait de l'autorité sur le peuple l'un des plus grands devoirs de la religion, car les intérêts du peuple ne peuvent être garantis sans rassemblement, et un rassemblement a besoin d'un chef; d'où le dicton selon lequel, lorsque trois personnes entreprennent un voyage, elles doivent désigner l'une d'entre elles comme chef. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17854}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17855} Les conditions communes de l'autorité générale. L'islam est une obligation consensuelle, comme l'attestent les versets 144 et 59 de la sourate An-Nisa. La puberté est également une obligation consensuelle, selon l'adage selon lequel la plume est retirée de trois personnes. La raison est une obligation incontestable. La liberté est une obligation, aussi ne saurait-elle être détenue par un esclave. La sexualité masculine est une obligation majoritaire, comme l'affirme le verset 34 de la sourate An-Nisa qui stipule que l'homme est le protecteur de la femme, et comme l'adage selon lequel un peuple qui confie ses affaires à une femme ne prospérera pas. La justice et la connaissance des règles sont des obligations majoritaires. Al-Samarqandi exige la connaissance des principes de la religion et le discernement indépendant dans ses branches, et rapporte qu'un savant de son époque considérait que cela impliquait qu'aucun imam ne pouvait exercer de fonction, afin que chacun puisse compter sur autrui pour ce qui lui fait défaut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17855}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17856}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17857} Intégrité physique: le titulaire doit entendre, voir et parler, car une déficience de ces sens empêche d’agir pleinement; al-Juwayni affirme que la perte de la vue, de l’ouïe ou de la parole empêche de se montrer à la hauteur des situations urgentes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17857} Opinion et capacité. Celles-ci diffèrent selon la fonction: ce qui est requis pour l’imamat suprême (aptitudes politiques, militaires et intellectuelles, fermeté, compassion et perspicacité) n’est pas exigé des fonctions inférieures. Le Prophète dit à Abou Dharr: « Tu es faible, et c'est un dépôt », et ajouta: « Quand le dépôt est perdu, attends l'Heure. » {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17857}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17858} Choisir le meilleur quand l'idéal est absent. Lorsque toutes les conditions ne peuvent être réunies, la nomination des titulaires n'est pas suspendue; le plus apte est choisi, car la nécessité permet ce qui est interdit, et conserver certains intérêts vaut mieux que tout perdre. Al-'Izz ibn 'Abd al-Salam dit que si la justice était absente de tous, les intérêts des juges, des califes et des gouverneurs ne pourraient être suspendus, et le meilleur des corrompus serait choisi. La nécessité exige aussi de s'efforcer de réformer les choses jusqu'à ce que les conditions soient réunies. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17858}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17859} Les devoirs du détenteur d'une autorité générale varient selon sa fonction. Il doit se conformer à la loi de l'Islam en paroles, en actes et en conduite, car il est un exemple à suivre; et il doit s'acquitter des responsabilités qui lui sont confiées, comme le prescrit le verset 58 de la sourate An-Nisa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17859} Le Prophète a dit: « Nul serviteur que Dieu désigne à la tête d'un troupeau ne meurt le jour de sa mort en les trompant sans que Dieu ne lui interdise le Paradis. » Il a également dit: « Quiconque désigne un homme parmi un groupe alors qu'il en contient un autre plus agréable à Dieu a trahi Dieu et Son Messager. » Quiconque détient une part de l'administration des musulmans doit nommer à chaque poste la personne la plus compétente et la plus apte qu'il puisse trouver. Ibn Taymiyya affirme que se détourner de la personne la plus légitime au profit d'une autre par lien de parenté, de clientèle, d'amitié, de communauté (ville ou école), d'appartenance ethnique, par corruption ou par rancune, constitue une trahison envers Dieu, Son Messager et les croyants. Il soutient que l'exercice du pouvoir de confiance repose sur trois piliers: la crainte de Dieu, l'intégrité morale et la neutralité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17860}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17861} La justice est l'équilibre divin sur terre et le fondement de la religion et du monde. Les juristes affirment que lorsque l'autorité s'accompagne de justice, elle compte parmi les meilleurs actes d'obéissance; un imam, un dirigeant ou un juge juste est plus récompensé que tous les autres, tandis que les dirigeants injustes portent le plus lourd fardeau. La gouvernance juste consiste à remettre les biens confiés à leurs détenteurs et à juger avec équité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17861}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17862} Ordonner le bien et interdire le mal est le but de toute autorité. C'est une obligation pour toute personne capable, et cela devient une obligation individuelle pour celle qui est capable lorsqu'aucun autre ne s'en charge; ceux qui détiennent le pouvoir en portent une plus grande part. Les fonctions diffèrent: certaines sont comme un témoin digne de confiance, tenu à la sincérité, et d'autres comme un commandant digne de confiance, tenu à la justice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17861}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17862} Il est obligatoire pour le détenteur de l'autorité générale de consulter les personnes de science, de jugement et d'expérience, conformément au verset qui lui enjoint de les consulter en la matière (Sourate al-Shura, verset 38). Ibn Khuwaz Mindad a précisé que les gouvernants doivent consulter les savants lorsqu'ils ignorent quelque chose ou lorsque des questions religieuses sont obscures, les commandants militaires en temps de guerre, les notables pour les affaires publiques, ainsi que les scribes et les gouverneurs pour le bien du territoire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17862}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17863} Prendre soin des besoins de la communauté est une obligation pour toute personne occupant une fonction, car Dieu dit: « Quiconque confère une autorité sur les musulmans et se désintéresse de leurs besoins, de leur pauvreté et de leurs désirs, Dieu se désintéresse de ses propres besoins. » Al-Qarafi affirme que l’autorité vise à garantir un bienfait manifeste et à prévenir un préjudice manifeste. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17863} Parmi les droits du détenteur de l’autorité figure l’obéissance à ce qui est bon, conformément au verset: « Obéissez à ceux qui détiennent l’autorité parmi vous » et à l’adage: « Le musulman est tenu d’écouter et d’obéir, que ce soit en ce qui lui plaît ou non, sauf s’il lui est ordonné de pécher. » La rébellion contre un dirigeant juste est unanimement considérée comme interdite; la rébellion contre un dirigeant injuste est sujette à controverse. Il est obligatoire de le conseiller, selon l’adage « la religion est un conseil sincère… aux dirigeants des musulmans et à leur peuple »; ce conseil doit être bienveillant et discret, et non une censure publique. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17863}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17864} Le titulaire de cette charge a droit à une allocation du trésor public suffisante pour lui et les personnes à sa charge, par analogie avec le collecteur de la zakat, puisqu’il se consacre aux intérêts des musulmans, et ce, afin qu’il ne soit pas tenté par la corruption ou l’enrichissement illicite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17864}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17865} Les formes d'autorité générale varient selon les régions, les époques et les coutumes, et les juristes en recensent plus d'une vingtaine. Parmi elles figurent l'imamat suprême, la haute autorité chargée de la protection de la religion et de la gouvernance du monde en tant que représentant du Prophète, qualifiée de « haute » pour la distinguer de la direction de la prière; le vizirat, une autorité légale que l'imam confère à un homme de confiance, qui peut être déléguée ou exécutoire; et le pouvoir de jugement, dont la fonction consiste à prononcer des décisions de justice contraignantes et à régler les litiges, avec des formes partielles telles que la supervision des contrats de mariage ou des affaires des orphelins. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17865}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17866} L'autorité des mazalim (doléances). Al-Mawardi la décrit comme le fait de guider les injustes vers la justice par le respect et d'empêcher les parties en conflit de se dénier mutuellement leurs droits par le respect de la dignité. Son titulaire doit être de haut rang, obéi, d'une grande influence, d'une chasteté exemplaire, peu avide et très pieux. Ceux qui détiennent déjà des pouvoirs généraux, tels que les ministres et les émirs, n'ont pas besoin d'une nomination séparée; les autres, si. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17867} L'émirat (imara) se divise en deux catégories. L'émirat élu (istikfa') est institué par l'imam, conférant le commandement général d'une ville ou d'une région, ou plus spécifiquement celui de l'armée. Il a pour mission la protection du royaume et la défense de son honneur, sans jugement, impôts ni aumônes. L'émirat conquis (istila') est institué par l'imam par nécessité, lorsqu'un commandant s'est emparé d'un territoire par la force et que le calife lui en confie le commandement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17867}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17868} La police (shurta) est composée des aides du sultan. Ibn al-Amin al-Qurtubi leur attribue deux missions: assister les juges dans les procédures d'emprisonnement et de libération, et enquêter sur les crimes et appliquer les hudud. Ibn Khaldun note que le titre varie selon le territoire (hakim, sahib al-madina, wali). Taj al-Din al-Subki affirme que la police peut enquêter sur les délits publics tels que la consommation de vin et de haschisch, en déceler les prétextes et protéger ceux que Dieu a protégés, mais qu'elle ne doit ni espionner les gens ni perquisitionner leurs domiciles sur la base de rumeurs; elle doit envoyer secrètement un homme de confiance pour interdire le mal uniquement dans la mesure où Dieu l'a interdit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17868}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17869} Ibn Taymiyya appelle cela la « petite guerre » (wilayat al-harb al-sughra), pour la distinguer de la « grande guerre », qu'il décrit comme la délégation du sultanat. Son but est de prévenir la corruption sur terre et de réprimer les méchants et les agressifs. Il explique qu'à son époque au Levant et en Égypte, la hisba couvrait les hudud (lois relatives aux violences physiques) et le jugement des litiges, tandis qu'au Maghreb, le gouverneur se contentait d'exécuter les ordres du juge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17869} La hisba consiste à enjoindre le bien lorsqu'il est négligé et à interdire le mal lorsqu'il est commis. C'est une fonction religieuse au même titre que la prière, l'émission de fatwas, la justice et le jihad. Elle est de deux types: une fonction originelle, émanant du législateur et contraignante pour tous ceux qui en font la demande, et une fonction déléguée, conférée par le calife ou l'émir et exercée par les muhtasib. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17869}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17870} L'émirat du jihad ne s'exerce que contre les polythéistes et revêt deux formes: l'une se limite à la politique militaire et à la conduite de la guerre, l'autre englobe le partage du butin et la conclusion de traités. S'il est établi pour une campagne unique, l'émir ne peut en entreprendre une autre; s'il est général, il doit renouveler les campagnes chaque année. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17870} L'autorité sur les guerres menées pour le bien public s'exerce contre les non-polythéistes: apostats, rebelles et brigands de grand chemin. La charge de collecter la zakat est limitée à ce fonds; son titulaire doit connaître les règles, les montants, la nature des biens et les payeurs, et faire preuve de douceur et de vigilance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17870}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17871} L'autorité spéciale (wilaya khassa) revêt trois formes: la tutelle obligatoire d'un mineur (personne et biens), l'autorité de l'administrateur d'une fondation pieuse sur ses biens, et le droit conféré par la loi aux proches d'une personne tuée d'exercer une vengeance ou de la gracier moyennant une compensation financière, conformément aux versets et hadiths: « Quiconque est tué injustement, Nous avons donné à ses héritiers l'autorité » et « Les proches de la personne tuée ont le choix entre deux options ». La première interprétation est la plus courante chez les juristes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17871} En l'absence de ses titulaires, l'autorité spéciale est transférée à l'autorité générale, selon le principe « le sultan est le tuteur de celui qui n'a pas de tuteur ». Le sultan l'exerce lui-même ou par l'intermédiaire de ses représentants, tels que les gouverneurs et les juges, qui le remplacent. L'autorité spéciale prévaut sur l'autorité générale, car elle est plus forte. Ainsi, l'administrateur des biens de mainmorte prévaut sur le juge, et le tuteur d'un orphelin prévaut sur le juge. Le juge ne peut disposer des biens d'un orphelin tant que l'exécuteur testamentaire du père est en vie, ni marier un orphelin sauf en l'absence de tuteur ou si celui-ci refuse. Le titulaire de l'autorité spéciale peut accorder le pardon gratuitement, contrairement à l'imam. Si le juge loue une boutique de mainmorte à une personne et que l'administrateur la loue à une autre, le bail de l'administrateur est valide. L'autorité générale supervise néanmoins l'ensemble des opérations et peut contrôler les exécuteurs testamentaires, les superviseurs et les administrateurs, et destituer les malhonnêtes parmi eux, même si le donateur ou le fondateur s'est opposé à son intervention. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17871}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17872}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17873} Exceptions hanafites: l'administrateur ne peut nommer de responsables pour la gestion du fonds de dotation que si le fondateur l'a stipulé, mais le juge le peut; le juge peut prêter les biens d'un orphelin sans la présence du père ni de l'exécuteur testamentaire. Ibn al-Qasim, de l'école malikite, affirme que si le sultan épouse une femme majeure en présence de son tuteur, le mariage est valide et n'est pas annulé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17873} L'autorité spéciale sur les biens est de deux sortes: l'autorité sur ses propres biens (qasira, propre à toute personne pleinement capable) et l'autorité sur les biens d'autrui (muta'addiya). Cette dernière peut être originelle, conférée par le législateur (l'autorité du père ou du grand-père sur les biens d'un mineur), ou suppléante, comme celle de l'exécuteur testamentaire ou du mandataire. Elle s'exerce sur les personnes soumises à cette autorité: le mineur, le aliéné, le déficient mental, le prodigue et l'inattentif, et perdure tant que la cause subsiste. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17873}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17874} Est mineure toute personne, garçon ou fille, n'ayant pas atteint la puberté, qu'elle soit capable ou non de discernement. Le fou est celui dont la raison est altérée, de sorte que ses paroles et ses actes sont incohérents; cet état peut être permanent ou intermittent. Ses actes commis en état de folie sont nuls, tandis que ceux commis en état de lucidité sont valides. L’imbécile a peu d’intelligence et un discours désordonné, mais il ne frappe ni ne maudit; il peut être comparé à un enfant naïf ou perspicace. Le prodigue dilapide ses biens contre la raison ou la loi, sous l’effet d’une joie légère ou de la colère. Les écoles chaféite, malikite, hanbalite et les deux compagnons d’Abou Hanifa autorisent sa mise sous tutelle, contrairement à Abou Hanifa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17874} Le prodigue et l’inattentif (dhu al-ghafla), dupé en raison de sa naïveté, sont traités de la même manière que le prodigue et soumis à la même tutelle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17875} Qui détient l'autorité sur les biens des personnes sous tutelle ? Les hanafites donnent l'ordre suivant: le père, son exécuteur testamentaire, l'exécuteur testamentaire de l'exécuteur testamentaire, le grand-père, son exécuteur testamentaire, l'exécuteur testamentaire de l'exécuteur testamentaire, le juge, puis la personne désignée par le juge; cet ordre est guidé par la compassion, qui est la plus grande chez le père. La mère, le frère et l'oncle n'ont aucune autorité sur les biens d'un mineur, car la compassion d'un frère ou d'un oncle est insuffisante et le jugement des femmes est faible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17875}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17876} Les Malikites: le père, son exécuteur testamentaire, l’exécuteur testamentaire de l’exécuteur testamentaire, puis le juge ou son exécuteur testamentaire. Les Chafi'ites: le père, puis le grand-père, puis l’exécuteur testamentaire de ce dernier, puis le juge ou son tuteur; la mère n’intervient pas selon l’avis le plus pertinent, bien que l’avis contraire l’y autorise. Les Hanbalites: le père, son exécuteur testamentaire, puis le juge, puis son tuteur en son absence; ni le grand-père ni la mère n’ont d’autorité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17876} Ce que le tuteur peut faire. Il ne peut agir qu'avec prudence et circonspection, et uniquement dans l'intérêt du pupille, selon le principe « ni préjudice ni préjudice réciproque ». Il ne peut faire de don sans contrepartie, de legs, d'aumône, d'affranchissement, ni accorder une faveur indue en échange, et il doit indemniser le bénéficiaire pour ce qu'il a donné. Un don contre contrepartie est, selon Abou Hanifa et Abou Yusuf, invalide; selon Muhammad et les Hanbalites, il est valide. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17876}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17877} Il peut faire commerce des biens du pupille, les associer en contrepartie d'une part fixe des bénéfices, les vendre à crédit s'ils sont utiles, les confier à une personne de confiance, acquérir des biens immobiliers à leur valeur ou à une valeur inférieure, vendre et louer ses biens à leur valeur ou à une valeur supérieure, et désigner un mandataire pour toutes ces opérations. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17877} Prêter l'argent du pupille. Les hanafites et les malikites l'interdisent, car un prêt transfère la propriété sans remboursement immédiat, contrairement au juge qui prête pour préserver la dette. Les chaféites l'autorisent lorsqu'il craint le pillage, l'incendie ou la noyade, à condition qu'il s'agisse d'une personne solvable et digne de confiance. Les hanbalites l'autorisent pour un motif tel qu'un voyage, et préfèrent une caution ou un gage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17877}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17878} Il peut revendiquer les droits du pupille, les prouver, faire jurer la partie adverse, transiger sur une partie de la dette lorsqu'il existe des preuves, et recouvrer une partie de ce qui est dû au pupille en l'absence de preuves. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17878} Acquisition ou vente des biens du pupille. Les Malikites autorisent le père à acquérir les biens de son fils mineur et à lui vendre les siens si cela lui est profitable; les Shafi'ites l'autorisent uniquement au père et au grand-père; les Hanbalites et les Zufars l'interdisent, sauf pour le père; les Hanafites autorisent le père à acquérir les biens à leur juste valeur ou dans la fourchette habituelle, et permettent à l'exécuteur testamentaire du père d'acquérir les biens pour lui-même lorsque cela est manifestement plus avantageux; le Prophète Muhammad l'interdit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17878}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17879} Utilisation des biens du pupille par le tuteur. Les hanafites autorisent l'exécuteur testamentaire à percevoir une rémunération coutumière pour son travail s'il est dans le besoin, par le biais de l'istihsan; certains l'interdisent. Les malikites l'interdisent au tuteur riche et autorisent le pauvre à recevoir ce qui est coutumier, conformément au verset: « Que celui qui est pauvre mange selon ses coutumes ». Les chaféites accordent au tuteur pauvre le moindre montant entre la rémunération et l'entretien. Les hanbalites autorisent le moindre montant entre la rémunération coutumière et l'entretien, sauf pour le juge et son administrateur. Al-Jassas l'interdit totalement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17879}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17880} Le tuteur pauvre doit-il rembourser ce qu'il a mangé lorsqu'il devient riche ? La majorité répond par la négative, car il s'agit d'une rémunération pour son travail. Abu al-'Aliya, 'Ubayda al-Salmani et l'avis shafi'ite, contraire au plus solide, affirment que le tuteur doit s'acquitter de cette obligation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17880} Le tuteur doit subvenir aux besoins du pupille et de ses personnes à charge à partir des biens de ce dernier, selon les usages, sans prodigalité ni avarice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17880} Concernant la gestion des biens d'un orphelin, trois avis divergent. Le premier, majoritaire, autorise le tuteur à les faire fructifier, car cela est préférable pour l'orphelin, mais il ne peut les utiliser à son propre profit. Malik affirme qu'il n'y a pas de mal à faire fructifier les biens d'un orphelin lorsque le tuteur est digne de confiance, et 'Umar recommande de les faire fructifier afin que la charité ne les dilapide pas. La seconde opinion, plus solide selon l'école shafi'ite, stipule qu'il est obligatoire de développer la tutelle dans la mesure du possible, en contribuant à l'entretien et à la zakat. La troisième opinion, partagée par al-Jassas, certains shafi'ites et Ibn Taymiyya, recommande, sans l'imposer, de s'appuyer sur le verset « Dis: Il est bon de les redresser ». Ibn Taymiyya précise qu'il s'agit d'une recommandation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17880}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17881}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17882} La tutelle de la personne confère l'autorité sur les affaires personnelles du pupille: mariage, éducation, soins médicaux et emploi. Ses causes sont au nombre de trois: la minorité, la démence (et l'imbécillité qui en découle) et le sexe féminin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17882} La tutelle de la personne, telle que définie par les juristes, désigne l'autorité exercée sur les affaires personnelles d'un mineur ou d'une personne incapable, notamment en matière de mariage, d'éducation, de soins médicaux et d'emploi. Elle trouve ses causes au nombre de trois: la minorité, la démence (avec l'imbécillité qui en découle) et le sexe féminin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17882} La tutelle de l'éducation et de la discipline repose sur la responsabilité des parents envers leurs enfants, tant sur le plan terrestre que spirituel, sur le verset « Préservez-vous, vous et vos familles, du feu » et sur le dicton « Chacun de vous est un berger et chacun est responsable de son troupeau ». Al-Nawawi affirme que le père doit enseigner à son fils les devoirs religieux dont il a besoin, une obligation qui incombe au père et à tout tuteur avant la puberté. Al-Ghazali affirme qu'un enfant est confié à ses parents et que son cœur est réceptif à toute influence. Il est dit: « Ordonnez à vos enfants de prier à sept ans, corrigez-les à dix ans et séparez-les dans leurs lits. » {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17883}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17884} La majorité attribue l'autorité disciplinaire au père, à la mère, au grand-père, à l'exécuteur testamentaire et au tuteur désigné par le juge: ils enjoignent à l'enfant d'obéir et lui interdisent ce qui est interdit, et le disciplinent d'abord par la parole, puis par l'avertissement, puis par la réprimande, et enfin par la correction physique; la correction légère n'est pas remplacée par la plus sévère tant que la plus légère atteint son but. La correction physique doit être bénéfique, ne doit pas être excessive ni douloureuse, et doit éviter le visage et les parties sensibles. Les Hanafites limitent le geste à la main et à trois traits maximum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17884}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17885} Parmi les devoirs du tuteur envers les mineurs figurent leur santé, leurs soins, leur formation aux connaissances ou métiers pour lesquels ils sont aptes, financée par leurs biens, et la location du travail d'un mineur capable, dans le respect des usages, selon l'avis majoritaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17885} Tutelle en matière de mariage. Le père a l'autorité de marier son fils et sa fille mineurs, selon l'accord des quatre écoles; les autres écoles divergent. Les Hanafites autorisent le grand-père et le frère à les marier, avec le droit de choisir à la puberté; les Hanbalites refusent ce droit à quiconque autre que le père. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17886} Une personne atteinte de troubles mentaux a un tuteur qui gère ses affaires, la nourrit, la soigne et la surveille lorsqu'on craint qu'elle ne se fasse du mal. Elle peut se marier si cela sert son intérêt; si elle a des moments de lucidité, elle ne peut se marier sans son consentement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17886}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17887} La féminité est une cause de tutelle sur la personne et se limite à deux cas: le mariage d'une femme et la discipline d'une épouse rébellion. La tutelle dans le mariage est soit une obligation (ijbar), soit un choix (ikhtiyar). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17887} La cause de la contrainte: les Malikites, les Chafi'ites et, selon l'avis plus solide des Hanbalites, considèrent qu'il s'agit de la virginité; le tuteur peut donc contraindre une femme majeure, vierge et saine d'esprit à se marier. Les Hanafites considèrent que la cause est la minorité; il ne peut donc pas contraindre une femme majeure, saine d'esprit; Ibn Taymiyya et Ibn al-Qayyim partagent cet avis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17887} Le mariage d'une femme avec elle-même: les Chafi'ites, les Malikites et les Hanbalites considèrent qu'un mariage n'est pas valide sans tuteur, et qu'une femme ne peut ni se marier avec elle-même ni mandater une personne autre que son tuteur pour l'épouser. Abu Hanifa n'exige pas de tuteur pour une femme majeure, libre et saine d'esprit, qui peut conclure son propre mariage ou désigner la personne de son choix. Selon un avis rapporté par Ibn Sirin, al-Qasim ibn Muhammad, al-Hasan ibn Salih et Abu Yusuf, le mariage n'est pas valable sans l'autorisation du tuteur; s'il est consenti par la femme, il repose sur son consentement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17887}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17888} Obstruction (adl): le refus du tuteur de marier une femme à un homme convenable lorsqu'elle le demande et que celui-ci la désire; la tutelle est alors transférée à un tiers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17888} Autorité disciplinaire du mari. Les juristes estiment que le contrat de mariage confère au mari l'autorité de discipliner sa femme en cas de désobéissance et de rébellion, conformément au verset: « Ceux dont tu crains la rébellion, exhorte-les, laisse-les au lit et frappe-les. » Il commence par l'exhorter doucement, puis la laisse au lit, et enfin la frappe légèrement, dans la mesure où cela la corrige. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17888}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17889} L'autorité de l'administrateur d'une dotation est une autorité spéciale qui requiert l'exécution de ses propres termes. Il s'agit d'un droit établi par la loi sur tout bien doté, qui nécessite une intervention pour être conservé, entretenu, mis en location, percevoir ses revenus et les dépenser conformément aux dispositions du fondateur. Cette autorité est originelle, pour le fondateur, le bénéficiaire ou le juge, ou dérivée, par stipulation, délégation ou nomination. Seule une personne digne de confiance et compétente est désignée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17889} L'autorité de Dieu. Ibn al-Qayyim affirme qu'elle est générale, l'autorité de tout croyant pieux, selon sa foi et sa piété (cité: « Dieu est le protecteur des croyants »; « Dieu est le protecteur de ceux qui croient; Il les fait passer des ténèbres à la lumière »); et spéciale, l'accomplissement de tous les droits de Dieu, en Le préférant à toute chose. Ibn Taymiyya dit qu'un croyant qui se fait du tort à lui-même a une part de l'autorité de Dieu proportionnelle à sa foi et à sa piété. Al-Shawkani affirme que les amis de Dieu sont des croyants sincères qui se sont rapprochés de Dieu par l'obéissance. Al-Ghanimi explique que le wali, au sens passif, est celui que Dieu protège et ne laisse pas à lui-même, et au sens actif, celui qui accomplit l'adoration et l'obéissance. Leur absence de faux pas ne constitue pas l'infaillibilité, qui est réservée aux prophètes, mais Dieu les préserve de la persistance dans l'erreur. La différence entre l'ami de Dieu (wali) et le prophète réside dans le fait que les prophètes sont infaillibles par nécessité; les amis de Dieu ne le sont pas et peuvent commettre des péchés, mais Dieu les préserve de la persistance dans l'erreur. Il faut croire tout ce que rapportent les prophètes et obéir à leurs commandements; les paroles d’un ami de Dieu sont mises à l’épreuve au regard du Coran et de la Sunna. Les prophètes reçoivent des révélations; l’ami suit le prophète, et celui qui prétend recevoir des prophéties est un ennemi de Dieu. La prophétie a pris fin avec notre Prophète; l’amitié perdure jusqu’à l’Heure. Quiconque injurie un prophète est un mécréant; quiconque injurie un ami ne l’est pas, à moins qu’il ne contredise un fondement de la foi. Les musulmans s’accordent à dire que les prophètes valent mieux que les amis qui ne sont pas prophètes, et Ibn Taymiyya affirme que les meilleurs amis de Dieu sont Ses prophètes, les meilleurs d’entre eux étant les messagers à la ferme volonté, et le meilleur d’entre eux étant notre Prophète. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17891}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17892} Le critère qui distingue les amis du Miséricordieux des amis du diable n'est pas celui des prodiges, car ceux-ci peuvent être l'œuvre d'ennemis. Il s'agit plutôt des qualités, des actes et des attitudes décrits par le Coran et la Sunna: celui qui les suit accomplit des prodiges du Miséricordieux; celui qui ne les suit pas adopte des attitudes diaboliques. Le critère d'Ibn al-Qayyim est ce que le serviteur fait en paroles, en actes et en attitude, examiné dans sa prière, son amour de la Sunna et de ses fidèles, et son appel à Dieu et à Son Messager. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17892}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17893}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17894} Selon la définition d'Ibn 'Abidin, le karama (une grâce) est l'apparition d'un miracle contraire à la coutume, accompli par un serviteur d'une piété manifeste, qui suit un prophète avec une foi sincère et de bonnes œuvres, sans prétendre à la prophétie. Les savants sunnites le considèrent comme licite et réel; les mu'tazilites le nient. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17894}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17895} La différence entre karama et miracle (mu'jiza). Un miracle s'accompagne d'une épreuve, et le Prophète doit le manifester, car il est nécessaire que les gens connaissent sa vérité; un karama ne s'accompagne pas d'une épreuve, et l'ami doit le dissimuler. La preuve d'un miracle est certaine, celle d'un karama probable; nul ne peut affirmer avec certitude que celui qui en est l'ami est un ami de Dieu. Un miracle prouve l'infaillibilité du Prophète et le devoir de le suivre; un karma ne prouve ni l'un ni l'autre. Certains juristes estiment qu'un karma ne peut égaler un miracle ni par sa nature ni par sa grandeur; d'autres considèrent que ce qui peut être un miracle du Prophète peut être un karma d'un ami, mais qu'un miracle s'accompagne d'une prétention à la prophétie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17895}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17896} Les prodiges antérieurs à la mission sont appelés irhas (fondements), et non miracles; le karma d'un ami est également un miracle du Prophète, car cet ami appartient à sa communauté et n'est ami que s'il croit au Messager et lui obéit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17896}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17897} Un prodige accompli par un pécheur avéré et qui corrobore ses dires est appelé istidraj (tromperie); lorsqu’il est accompli par un faux prophète, il est appelé humiliation (ihana). Ibn Taymiyya affirme que les prodiges de l’Antéchrist ne prouvent ni l’amitié ni l’islam; il faut s’en tenir au commandement et à l’interdiction de Dieu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17897}"
