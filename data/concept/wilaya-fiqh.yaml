id: concept/wilaya-fiqh
class: concept
kind: legal
label:
  ar: "وِلاية"
  en: "Wilaya (authority and guardianship, fiqh)"
summary:
  ar: "الوِلاية بالكسر في اللغة من الوَلْي، وهو القرب، ويقال وليه أي دنا منه، وتولى الأمر أي تقلده؛ والولاية بالفتح النصرة والمحبة، وولي اليتيم والقتيل والمرأة من يقوم بأمرهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17849}\n\nوالولاية في الاصطلاح عند جل الفقهاء تنفيذ القول على الغير شاء أو أبى، فتشمل الإمامة العظمى والقضاء والحسبة والمظالم والشرطة، وتشمل قيام الكبير الراشد على القاصر في تدبير شؤونه؛ وتُطلق على سلطة الزوج في تأديب زوجته الناشز، وسلطة الوالد في تأديب ولده الصغير، وسلطة المعلم على تلاميذه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17850}\n\nوعند المالكية الولاية آصرة موجبة للإرث، فهي خمسة أنواع: ولاية الإسلام، ولا يورث بها إلا عند عدم غيرها، وولاية الحلف، وولاية الهجرة، وكان التوارث بهما في أول الإسلام ثم نُسخ، وولاية القرابة، وولاية العتق، والميراث بهما ثابت. وأوضح ابن رشد مرادهم: فولاية الإسلام عامة بنص القرآن، وولاية الحلف كانت التوارث بها أول الإسلام ثم نُسخت بآية أولي الأرحام، وولاية الهجرة كانت التوارث بها أول الإسلام ثم نُسخت بذلك، وولاية النسب ثابتة بالقرآن، وولاية العتق توجب الميراث عند انقطاع النسب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17850}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17851}\n\nوولاية الله للمؤمنين معناها أن يتولى أمرهم بالمحبة والهداية والنصرة؛ وقال ابن القيم إنها عامة لكل مؤمن تقي، وخاصة لمن قام بجميع حقوق الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17851}\n\nالألفاظ ذات الصلة: النيابة، وهي أن يقوم الإنسان عن غيره بفعل أمر، والولاية أعم منها مطلقاً، فكل نيابة ولاية وليس كل ولاية نيابة. والعمالة، وهي أجرة من يلي الصدقة، والوالي أعم من العامل. والقوامة، وهي الحفظ والرعاية والتدبير، والقيّم هو المتولي والناظر على الصغير والمجنون والسفيه وعلى مال الوقف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17852}\n\nالألفاظ ذات الصلة بالولاية: القوامة، وهي أخص من الولاية، وتعني الحفظ والصيانة؛ والوصاية، وهي إقامة الإنسان غيره مقامه بعد وفاته للنظر في تركته وشؤون أولاده الصغار، وهي أخص من الولاية؛ والوكالة، وهي تفويض الشخص غيره فيما يقبل النيابة في حياته، وهي أخص من الولاية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17852}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17853}\n\nالولاية العامة سلطة على إلزام الغير وإنفاذ التصرف عليه بغير تفويض منه، تتعلق بأمور الدين والدنيا والنفس والمال، وتهيمن على مرافق الحياة العامة، لجلب المصالح ودرء المفاسد، وهي منصب ديني ودنيوي شرع لثلاثة أمور: الأمر بالمعروف والنهي عن المنكر، وأداء الأمانات إلى أهلها، والحكم بين الناس بالعدل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17853}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17854}\n\nومراتبها تتدرج من الإمام الأعظم إلى نوابه وولاته، وبها تُجهز الجيوش وتُسد الثغور وتُجبى الأموال وتُصرف في محلها، وتُعيّن القضاة والولاة، وتُقام الحدود والتعازير، ويُقمع البغاة، ويُفصل بين الخصوم، ويُنصب الأوصياء والنظار ويُحاسبون. وقال ابن تيمية إن مقصود الولايات في الإسلام أن يكون الدين كله لله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17854}\n\nواعتبرت الشريعة ولاية أمر الناس من أعظم واجبات الدين، لأن الناس لا تتم مصالحهم إلا بالاجتماع ولابد لهم من رأس، ولقوله «إذا خرج ثلاثة في سفر فليؤمّروا أحدهم». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17854}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17855}\n\nالشروط المشتركة للولاية العامة: الإسلام، بالإجماع، لقوله تعالى في سورة النساء (الآية ١٤٤ والآية ٥٩)؛ والبلوغ، بالإجماع، للحديث «رُفع القلم عن ثلاث»؛ والعقل، بلا خلاف؛ والحرية، فلا يتولاها العبد؛ والذكورة، عند جمهور أهل العلم، لقوله تعالى «الرجال قوامون على النساء» (سورة النساء، الآية ٣٤)، ولقوله «لن يفلح قوم ولّوا أمرهم امرأة»؛ والعدالة، عند الجمهور؛ والعلم بالأحكام الشرعية، عند الجمهور، ويشترط السمناني العلم بأصول الدين والاجتهاد في فروعه، فيما نقل عن بعض المعاصرين أن ذلك يقتضي ألا يصح لإمام إمامة في عصره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17855}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17856}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17857}\n\nالكفاية الجسمية، وهي أن يكون الوالي سميعاً بصيراً ناطقاً، لأن الخلل في الأعضاء والحواس يعجزه عن كمال التصرف، وقال الجويني إن نقص الحواس يحول دون الانتهاض في الملمات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17857}\n\nالرأي والكفاية، وهما تختلفان بحسب الولاية؛ فما يلزم في الإمامة العظمى من المقدرة السياسية والحربية والفكرية لا يشترط فيما دونها. واستشهد الفقهاء بقول النبي لأبي ذر «إنك ضعيف، وإنها أمانة»، وبقوله «إذا ضيعت الأمانة فانتظر الساعة». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17857}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17858}\n\nتقديم الأمثل عند الاضطرار. إذا تعذر اجتماع الشروط في الناس، فلا يُعطَّل إسناد الولايات، بل يُقدم الأصلح والأمثل، لأن الضرورة تبيح المحظورات، ولأن حفظ بعض المصالح أولى من تضييعها كلها، ولقوله تعالى «فاتقوا الله ما استطعتم»؛ وقال العز بن عبد السلام إن تعذرت العدالة في الناس لم يجز تعطيل المصالح، بل يُقدّم أمثل الفسقة. وتُوجب الضرورة السعي في إصلاح الأحوال حتى تكمل الشروط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17858}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17859}\n\nواجبات صاحب الولاية العامة تختلف بحسب ولايته. والالتزام بأحكام الشريعة في الأقوال والأعمال والأخلاق واجب عليه، لأنه قدوة للناس؛ وأداء الأمانة واجب، لقوله تعالى «إن الله يأمركم أن تؤدوا الأمانات إلى أهلها» (سورة النساء، الآية ٥٨). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17859}\n\nقال النبي «ما من عبد يسترعيه الله رعية، يموت يوم يموت وهو غاش لرعيته، إلا حرم الله عليه الجنة»، وقال «من استعمل رجلاً من عصابة وفيها من هو أرضى لله منه فقد خان الله ورسوله»، فيجب على من ولي شيئاً من أمر المسلمين أن يستعمل في كل موضع أصلح من يقدر عليه وأمثلهم؛ وقال ابن تيمية إن العدول عن الأحق لقرابة أو ولاء أو صداقة أو موافقة في بلد أو مذهب أو جنس، أو رشوة، أو ضغن، فهو خيانة لله ورسوله والمؤمنين. وأداء الأمانة عنده مبني على خشية الله، وألا يشتري بآياته ثمناً قليلاً، وترك خشية الناس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17860}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17861}\n\nالعدل ميزان الله في الأرض وقوام الدين والدنيا، وقد نص الفقهاء على أن الولاية إذا شملها العدل كانت من أفضل الطاعات، وأن العادل من الأئمة والولاة أعظم أجراً، وأن ولاة الجور أعظم الناس وزراً، وجماع السياسة العادلة أداء الأمانات إلى أهلها والحكم بالعدل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17861}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17862}\n\nالأمر بالمعروف والنهي عن المنكر هو مقصود الولايات كلها، وهو فرض على كل قادر، ويصير فرض عين على القادر إذا لم يقم به غيره، وذوو السلطان أقدر فعليهم من الوجوب ما ليس على غيرهم. وتختلف الولايات: فبعضها بمنزلة الشاهد المؤتمن المطلوب منه الصدق، وبعضها بمنزلة الأمين المطاع المطلوب منه العدل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17861}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17862}\n\nمشورة أهل العلم وذوي الرأي والتجربة واجبة على صاحب الولاية، لقوله تعالى «وأمرهم شورى بينهم» (سورة الشورى، الآية ٣٨)؛ وقال ابن خويز منداد إن الوالي يستشير العلماء فيما لا يعلم، ووجوه الجيش في الحرب، ووجوه الناس في المصالح، والكتاب والعمال والوزراء في عمارة البلاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17862}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17863}\n\nرعاية حاجات الأمة ومصالحها واجب في كل ولاية، لقوله «من ولاه الله شيئاً من أمر المسلمين فاحتجب دون حاجتهم وخلتهم وفقرهم احتجب الله دون حاجته»؛ وقال القرافي إن الولاية إنما تتناول جلب المصلحة الخالصة أو الراجحة ودرء المفسدة الخالصة أو الراجحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17863}\n\nحقوق صاحب الولاية: طاعته في المعروف، وهو متفق عليه، لقوله تعالى «أطيعوا أولي الأمر منكم»، ولقوله «السمع والطاعة على المرء المسلم فيما أحب وكره ما لم يؤمر بمعصية». وحرمة الخروج على ولي الأمر العادل متفق عليها، والخروج على الجائر مختلف فيه. ونصيحته واجبة، لقوله «الدين النصيحة... ولأئمة المسلمين وعامتهم»، وتكون بالرفق والتلطف لا بالفضح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17863}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17864}\n\nوللمتولي حق في بيت المال يُرتب له منه ما يكفيه وعياله، قياساً على عامل الصدقة، لأنه متفرغ لمصالح المسلمين، ولئلا يُدفع إلى الرشوة أو الكسب الحرام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17864}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17865}\n\nأنواع الولاية العامة تختلف بحسب الأقاليم والأعصار والأعراف، وقد بلغت عند الفقهاء أكثر من عشرين نوعاً. منها الإمامة الكبرى، وهي الرئاسة العظمى في حراسة الدين وسياسة الدنيا خلافة عن النبي، وتُسمى كبرى تمييزاً لها عن إمامة الصلاة؛ والوزارة، وهي ولاية شرعية يخولها الإمام لشخص موثوق، وتنقسم إلى وزارة تفويض ووزارة تنفيذ؛ وولاية القضاء، وحقيقتها تبيين الحكم الشرعي مع الإلزام به وفصل الخصومات، ومنها ولاية جزئية كمتولي العقود في الأنكحة وحدها، أو النظر في الأيتام وحدها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17865}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17866}\n\nولاية المظالم، قال الماوردي إنها قود المتظالمين إلى التناصف بالرهبة، وزجر المتنازعين عن التجاحد بالهيبة، ويشترط فيمن يتولاها جلالة القدر ونفاذ الأمر وعظم الهيبة وظهور العفة وقلة الطمع وكثرة الورع؛ فإن كان ممن يملك الأمور العامة كالوزراء والأمراء لم يحتج إلى تقليد، وإلا احتاج إليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17867}\n\nولاية الإمارة على ضربين: إمارة استكفاء تنعقد باختيار الإمام، عامة لبلد أو إقليم، أو خاصة بتدبير الجيش وسياسة الرعية وحماية البيضة دون القضاء والخراج؛ وإمارة استيلاء يعقدها الإمام اضطراراً لمن غلب على بلد بالقوة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17867}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17868}\n\nولاية الشرطة. أعوان السلطان، ووظيفتها عند ابن الأمين القرطبي أمران: معونة الحكام في الحبس والإطلاق والإشخاص، والنظر في الجنايات وإقامة الحدود؛ وسماها ابن خلدون بحسب البلاد الحاكم أو صاحب المدينة أو الوالي. وقال التاج السبكي إن للشرطة الفحص عن المنكرات كالخمر والحشيش وسد الذريعة فيها والستر على من ستره الله، وليس لها التجسس على الناس ولا كبس البيوت بمجرد القيل والقال، بل ترسل رجلاً مأموناً ينهى عن المنكر بقدره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17868}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17869}\n\nوسمّى ابن تيمية هذه الولاية «ولاية الحرب الصغرى»، تمييزاً لها عن «الحرب الكبرى»، ومعتمدها المنع من الفساد في الأرض وقمع أهل الشر والعدوان، وذكر أنها في بلاد الشام ومصر تختص بالحدود التي فيها إتلاف وبالحكم في المخاصمات، وفي المغرب ينفذ الوالي ما يأمر به القاضي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17869}\n\nولاية الحسبة هي الأمر بالمعروف إذا ظهر تركه، والنهي عن المنكر إذا ظهر فعله، وهي من الخطط الدينية كالصلاة والفتيا والقضاء والجهاد؛ وهي نوعان: أصلية من الشارع لكل من طُلب منه، ومستمدة من عهد الخليفة أو الأمير، وهي للمحتسب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17869}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17870}\n\nولاية الإمارة على الجهاد تختص بقتال المشركين، وهي ضربان: مقصورة على سياسة الجيش وتدبير الحرب، أو مفوّضة إلى الأمير جميع أحكامه من قسمة الغنائم وعقد الصلح، وإذا عُقدت على غزوة واحدة لم يغزُ غيرها، وإذا عُقدت عموماً لزمه معاودة الغزو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17870}\n\nولاية حروب المصالح تختص بقتال غير المشركين، كأهل الردة وأهل البغي وقطاع الطريق. وولاية السعاية وجباية الصدقة تنحصر في الأموال الزكوية، ولا يكون متولّيها إلا عالماً بأحكام الصدقات ومقاديرها وصفاتها، حليماً غير عنيف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17870}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17871}\n\nالولاية الخاصة. تُطلق على ثلاثة ضروب: النيابة الجبرية على القاصر في شؤونه الشخصية (الولاية على النفس)، وشؤونه المالية (الولاية على المال)؛ وولاية المتولي على الوقف، وهي ولاية مالية محضة؛ والسلطة التي جعلها الشرع لأهل القتيل في استيفاء القصاص أو العفو عنه إلى الدية، لقوله تعالى «ومن قُتل مظلوماً فقد جعلنا لوليه سلطاناً»، وقوله «من قُتل له قتيل فأهله بين خيرتين». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17871}\n\nانتقال الولاية الخاصة إلى الولي العام عند عدم أهلها، لقوله «السلطان ولي من لا ولي له»، فيمارسها السلطان بنفسه أو بنوابه. والولاية الخاصة مقدمة على العامة لأنها أقوى؛ فولاية المتولي على الوقف ووصي اليتيم أقوى من ولاية القاضي، والقاضي أقوى من ولاية إمام المسلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17871}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17872}\n\nومن الفروع: القاضي لا يتصرف في الوقف مع وجود متولٍّ عليه، ولا في مال اليتيم مع وجود وصي الأب، ولا يزوج اليتيمة إلا عند عدم الولي أو عضله، وللولي الخاص العفو عن القصاص مجاناً، وليس للإمام ذلك؛ وإذا أجّر القاضي حانوت الوقف وأجّره المتولي، فإجارة المتولي معتبرة. وللولي العام الإشراف العام، فله أن يحاسب الأوصياء والنظار ويعزل الخائن منهم ولو شرط الواقف عدم مداخلته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17872}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17873}\n\nالولاية الخاصة على المال نوعان: قاصرة، وهي سلطة المرء على ماله، ومتعدية، وهي سلطة المرء على مال غيره، وهي أصلية كولاية الأب والجد على مال القاصر، ونيابية كالوصي والوكيل. وتثبت الولاية المتعدية على المحجور عليهم: الصغير، والمجنون، والمعتوه، والسفيه، ومن بهم غفلة، وتستمر ما دام الوصف قائماً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17873}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17874}\n\nوعن السفيه: الشافعية والمالكية والحنابلة والصاحبان يجيزون الحجر عليه، وأبو حنيفة لا يجيزه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17874}"
  en: "Wilaya, with a kasra, in the language comes from the root wali, nearness; he is near to him, and one who takes up a matter is said to have governed it. With a fatha it means help and love. The guardian (wali) of an orphan, of a slain person, or of a woman is one who takes charge of their affairs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17849}\n\nIn the technical sense most jurists use wilaya as carrying out a word over another whether he wills it or not. It covers the supreme imamate, judgeship, the office of hisba (public order), the grievances court and the police, and the adult's management of the affairs of one who is still a minor. The word is also used for a husband's authority to discipline a rebellious wife, a father's to discipline a young son, and a teacher's over his pupils. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17850}\n\nThe Malikis use wilaya for a bond that causes inheritance, in five kinds: wilayat al-Islam, which gives inheritance only when no other kind exists; wilayat al-hilf (alliance); wilayat al-hijra (migration), by which inheritance was given at the start of Islam and then abrogated, as were the alliance; wilayat al-qaraba (kinship); and wilayat al-'itq (manumission), by which inheritance stands. Ibn Rushd explains that the wilaya of Islam is general, by the verse of believers as protectors of one another; the wilaya of alliance was abrogated by the verse of the kin; the wilaya of migration was likewise abrogated; kinship by the verse of shares; and manumission gives inheritance where lineage fails. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17850}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17851}\n\nGod's wilaya over believers means that He takes charge of them with love, guidance and help. Ibn al-Qayyim says it is general for every pious believer and special for one who keeps all God's rights. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17851}\n\nRelated words: deputising (niyaba), which is one person standing in place of another in an act; wilaya is wider than it, so every deputising is a wilaya, but not every wilaya is a deputising. 'Amala, the fee of the collector of charity; the wali is wider than the collector. Qiwama, the custody and care of a matter; the custodian (qayyim) is the manager and administrator of a minor, an insane or a spendthrift, or of an endowment's property. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17852}\n\nRelated words. Qiwama is narrower than wilaya and means keeping and preserving. Wasiya (guardianship after death) is the setting of another in one's place after death to look after the estate and the young children, and is narrower too. Wakala is the delegation of a disposal that admits delegation during one's life, and is narrower than wilaya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17852}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17853}\n\nGeneral authority (wilaya 'amma) is power to compel and carry out an act over another without his delegation, in matters of religion and the world, of persons and property, governing the public affairs of life, to secure benefits and avert harms. It is a religious and worldly office, instituted for three things: enjoining good and forbidding wrong, delivering trusts to their owners, and judging among people with justice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17853}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17854}\n\nIts ranks run from the supreme imam down to his deputies and governors. By it armies are equipped, frontiers defended, taxes collected and spent where they belong, judges and governors appointed, the hudud and the discretionary penalties enforced, rebels suppressed, disputes settled, and guardians and custodians appointed and held to account. Ibn Taymiyya says the aim of all authority in Islam is that religion be wholly God's. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17854}\n\nThe law makes the authority over people one of the greatest duties of religion, since people's interests are not secured without gathering, and gathering needs a head; hence the saying that when three go on a journey they should appoint one of them as leader. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17854}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17855}\n\nThe common conditions of general authority. Islam is required by agreement, on the verses of Surat al-Nisa (verses 144 and 59, cited by number). Puberty is required by agreement, on the saying that the pen is lifted from three. Sanity is required without dispute. Freedom is required, so a slave does not hold it. Male sex is required by the majority, on the verse that men are guardians over women (Surat al-Nisa, verse 34) and the saying that a people who give their affairs to a woman will not prosper. Justice is required by the majority, and knowledge of the rulings by the majority; al-Samarqandi requires knowledge of the principles of religion and independent judgement in its branches, and reports that a scholar of his time held that this would mean that no imam could hold office, so that a man can rely on others for what he lacks. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17855}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17856}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17857}\n\nBodily soundness: the holder must hear, see and speak, since a defect in these senses prevents full action; al-Juwayni says that loss of sight, hearing or speech prevents rising to urgent matters. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17857}\n\nOpinion and capacity. These differ with each office: what is needed in the supreme imamate (political, military and intellectual ability, firmness, compassion and shrewdness) is not required of lesser offices. The Prophet told Abu Dharr: 'you are weak, and it is a trust', and said: 'when trust is lost, await the hour'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17857}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17858}\n\nChoosing the best when the ideal is absent. When all the conditions cannot be met, the appointment of holders is not suspended; the most suitable is chosen, since necessity permits what is forbidden, and keeping some interests is better than losing all. Al-'Izz ibn 'Abd al-Salam says that if justice were absent from all people, the interests of judges, caliphs and governors could not be suspended, and the best of the corrupt would be chosen. Necessity also requires striving to reform matters until the conditions are completed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17858}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17859}\n\nThe duties of the holder of general authority vary with the office. He must keep to the law of Islam in word, deed and conduct, since he is an example; and he must discharge trusts, as the verse of Surat al-Nisa (verse 58) commands. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17859}\n\nThe Prophet said: 'No servant whom God appoints over a flock dies on the day he dies while deceiving them without God forbidding him Paradise.' He also said: 'Whoever appoints a man from a group while in it is one more pleasing to God has betrayed God and His Messenger.' So whoever holds any part of the affairs of Muslims must appoint in each place the most suitable and most capable he can find. Ibn Taymiyya says that turning from the most entitled to another for kinship, clientage, friendship, shared town or school, race, bribery or grudge is betrayal of God, His Messenger and the believers. He holds that the discharge of trust rests on three things: fear of God, not selling His signs for a small price, and not fearing people. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17860}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17861}\n\nJustice is God's balance on earth and the support of religion and the world. The jurists say that when authority is accompanied by justice it is among the best acts of obedience; a just imam, ruler or judge has a greater reward than all others, and unjust rulers bear the greatest burden. The sum of just governance is the delivery of trusts to their owners and judging with justice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17861}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17862}\n\nEnjoining good and forbidding wrong is the purpose of all authority. It is an obligation on each capable person, and becomes an individual obligation on the capable one when no one else undertakes it; those in power bear more of it. Offices differ: some are like a trusted witness, required to be truthful, and others like a trusted commander, required to be just. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17861}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17862}\n\nConsulting people of knowledge, judgement and experience is obligatory for the holder of general authority, on the verse that he should consult them in the matter (Surat al-Shura, verse 38, cited by number). Ibn Khuwaz Mindad said that rulers must consult the scholars where they do not know or where religious matters are unclear, the commanders in war, the notables on public interests, and the scribes and governors on the good of the lands. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17862}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17863}\n\nCaring for the needs of the community is an obligation in every office, on the saying that whoever God gives authority over Muslims and shuts himself off from their needs, poverty and wants, God shuts Himself off from his needs. Al-Qarafi says that authority is for securing pure or preponderant benefit and averting pure or preponderant harm. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17863}\n\nThe rights of the holder of authority include obedience in what is good, agreed upon, on the verse 'obey those in authority among you' and the saying 'hearing and obedience are due to the Muslim in what he likes and dislikes, unless he is ordered to sin'. Rebellion against a just ruler is agreed to be forbidden; rebellion against an unjust one is disputed. Advising him is obligatory, on the saying 'religion is sincere counsel... to the leaders of the Muslims and their common folk'; it should be gentle and private, not public censure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17863}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17864}\n\nThe holder has a right to a stipend from the public treasury sufficient for him and his dependants, by analogy with the zakat collector, since he devotes himself to the interests of Muslims, and so that he is not driven to bribery or unlawful gain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17864}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17865}\n\nThe kinds of general authority differ with regions, eras and customs, and the jurists count more than twenty. They include the supreme imamate, the great leadership in guarding religion and governing the world as deputy of the Prophet, called 'great' to distinguish it from leading the prayer; the vizierate, a legal authority the imam gives to a trusted man, in two kinds, delegated and executive; and the judgeship, whose reality is declaring the legal ruling with binding force and settling disputes, with partial kinds such as a supervisor of marriage contracts only or of orphans' affairs only. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17865}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17866}\n\nThe mazalim (grievances) authority. Al-Mawardi says it is the leading of wrongdoers to fairness through awe, and the restraint of disputants from denying one another's rights through dignity. Its holder must be of high rank, obeyed, of great presence, clearly chaste, little greedy and very pious. Those who already hold general powers, such as ministers and amirs, need no separate appointment; others need one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17867}\n\nThe amirate (imara) has two kinds. The chosen amirate (istikfa') is made by the imam, general over a town or region or specific to the army's command, the protection of the realm and the defence of its honour, without judgement, taxes or alms. The seized amirate (istila') is made by the imam out of necessity, when a commander has taken a land by force and the caliph gives him its command. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17867}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17868}\n\nThe police (shurta) are the sultan's aides. Ibn al-Amin al-Qurtubi gives them two tasks: helping the judges in imprisonment and release, and investigating crimes and carrying out the hudud. Ibn Khaldun notes the title varies by land (hakim, sahib al-madina, wali). Taj al-Din al-Subki says the police may investigate public wrongs such as wine and hashish and stop their pretext, and cover those whom God has covered, but may not spy on people or raid their houses on rumour; they should send a trusted man in secret to forbid the wrong only as far as God has forbidden it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17868}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17869}\n\nIbn Taymiyya calls this the 'lesser war' (wilayat al-harb al-sughra), to distinguish it from the 'greater war', which he describes as the deputising of the sultanate. Its purpose is to prevent corruption on earth and suppress the wicked and aggressive. He says that in his time in the Levant and Egypt it covered the hudud involving bodily harm and judgement in disputes, while in the Maghrib the governor only carries out what the judge orders. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17869}\n\nThe hisba is enjoining good when it is abandoned and forbidding evil when it is committed. It is a religious office like prayer, giving fatwas, judgeship and jihad. It is of two kinds: an original office from the lawgiver, binding on everyone asked, and a delegated one, given by the caliph or amir, held by the muhtasib. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17869}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17870}\n\nThe amirate of jihad is only against polytheists, and is of two kinds: one limited to army policy and the conduct of war, and one that includes the division of booty and the making of treaties. If it is made for a single campaign, the amir may not undertake another; if it is general, he must renew campaigns year by year. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17870}\n\nAuthority over wars for the public good is against non-polytheists: apostates, rebels and highwaymen. The office of collecting charity is limited to zakat funds; its holder must know the rules, the amounts, the kinds of property and the payers, and be gentle and vigilant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17870}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17871}\n\nSpecial authority (wilaya khassa) has three forms: the compulsory deputising over a minor's person and property (guardianship over the person and over property), the authority of the administrator of an endowment over its property, and the authority the law gives the kin of a slain person to exact retaliation or to pardon it for blood-money, on the verses and sayings 'whoever is slain wrongly, We have given his heir authority' and 'the kin of the slain have the choice of two things'. The first is the common meaning in the jurists' usage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17871}\n\nSpecial authority passes to the general authority when its holders are absent, on the saying 'the sultan is the guardian of him who has no guardian'; the sultan exercises it himself or through his deputies, such as governors and judges, since the deputies stand in his place. Special authority prevails over general authority, since it is stronger. Thus the endowment administrator prevails over the judge, and the guardian of an orphan prevails over the judge; the judge may not dispose of an orphan's property while the father's executor exists, nor marry an orphan except when there is no guardian or the guardian refuses. The holder of special authority may pardon retaliation free of charge, and the imam may not. If the judge leases an endowed shop to one man and the administrator leases it to another, the administrator's lease stands. The general authority nonetheless supervises all, and may audit the executors, supervisors and administrators, and remove the dishonest among them, even if the donor or founder stipulated against his interference. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17871}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17872}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17873}\n\nHanafi exceptions: the administrator may not appoint officers for the endowed purposes unless the founder stipulated it, but the judge may; the judge may lend an orphan's property without the father or executor. Ibn al-Qasim of the Malikis says that if the sultan marries an adult woman while her guardian is present, the marriage stands and is not annulled. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17873}\n\nSpecial authority over property is of two kinds: the authority over one's own property (qasira, proper to any fully capable person) and authority over another's property (muta'addiya), which is either original, given by the lawgiver (the father's or grandfather's authority over a minor's property), or deputising, such as the executor or agent. It is established over those under restraint: the minor, the insane, the imbecile, the spendthrift and the inattentive, and lasts while the cause remains. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17873}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17874}\n\nThe minor is one who has not reached puberty, male or female; he is discerning or not discerning. The insane is one whose reason is gone so that his words and acts do not go right, and it is permanent or intermittent; his acts while insane are void, and while sane are valid. The imbecile has little understanding and disordered speech but does not strike or curse; he may be like a non-discerning or a discerning minor. The spendthrift squanders his property against reason or the law, from a levity of joy or anger. The Shafi'is, Malikis, Hanbalis and the two companions of Abu Hanifa allow him to be placed under restraint, while Abu Hanifa does not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17874}"
