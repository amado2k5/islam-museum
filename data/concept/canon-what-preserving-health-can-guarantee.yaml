id: concept/canon-what-preserving-health-can-guarantee
class: concept
kind: scientific
label: { ar: "ما تضمنه صناعة حفظ الصحة", en: "What the art of preserving health can and cannot guarantee", ur: "حفظ صحت کا فن کیا ضمانت دیتا ہے اور کیا نہیں", es: "Lo que el arte de preservar la salud puede y no puede garantizar", fr: "Ce que l'art de préserver la santé peut et ne peut pas garantir", tr: "Sağlık sektörü ne garanti eder", id: "Apa yang dijamin oleh industri kesehatan" }
summary:
  ar: "ينفي ابن سينا أن تضمن صناعة حفظ الصحة الأمان من الموت أو من الآفات الخارجة أو بلوغ غاية العمر، ويحصر ما تضمنه في أمرين: منع العفونة أصلاً وحماية الرطوبة كي لا يسرع إليها التحلل {cite:canon-ibn-sina-print-v1 pp.201-202}."
  en: "Ibn Sina denies that the art of preserving health can guarantee safety from death, from outside afflictions or a full span of life, and limits what it guarantees to two things: preventing putrefaction at the outset, and protecting the moisture so that dissolving does not hurry to it {cite:canon-ibn-sina-print-v1 pp.201-202}."
  es: "Ibn Sina niega que el arte de preservar la salud pueda garantizar la seguridad frente a la muerte, las aflicciones externas o una vida plena, y limita lo que garantiza a dos cosas: prevenir la putrefacción desde el principio y proteger la humedad para que la disolución no se apresure a ella {cite:canon-ibn-sina-print-v1 pp.201-202}."
  fr: "Ibn Sina nie que l'art de préserver la santé puisse garantir la sécurité contre la mort, contre les afflictions extérieures ou une vie complète, et limite ce qu'il garantit à deux choses: prévenir la putréfaction au début et protéger l'humidité afin que la dissolution ne s'y précipite pas {cite:canon-ibn-sina-print-v1 pp.201-202}."
  ur: "ابن سینا اس بات کی تردید کرتے ہیں کہ صحت کو محفوظ رکھنے کا فن موت، بیرونی مصیبتوں یا زندگی کے مکمل دور سے حفاظت کی ضمانت دے سکتا ہے، اور اسے دو چیزوں تک محدود کرتا ہے: شروع میں زوال کو روکنا، اور نمی کی حفاظت کرنا تاکہ تحلیل ہونے میں جلدی نہ ہو۔"
  tr: "İbn Sina, sağlığı koruma zanaatının ölümden, ortaya çıkan zararlılardan veya yaşam sonuna ulaşmaktan koruma sağladığını reddeder; içeriğini iki şeyle sınırlar: öncelikle küfü önlemek ve nemi korumak için hızlı bozulmamasını sağlamak. {cite:canon-ibn-sina-print-v1 s.201-202}."
  id: "Ibn Sina menyangkal bahwa keahlian menjaga kesehatan menjamin keselamatan dari kematian, hama yang muncul, atau mencapai akhir hayat, membatasi isinya pada dua hal: mencegah jamur sejak awal dan melindungi kelembapan agar tidak cepat terdegradasi. {cite:canon-ibn-sina-print-v1 hlm.201-202}."
