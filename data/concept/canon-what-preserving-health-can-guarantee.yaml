label: { ar: "ما تضمنه صناعة حفظ الصحة", en: "What the art of preserving health can and cannot guarantee", ur: "حفظ صحت کا فن کیا ضمانت دیتا ہے اور کیا نہیں" }
summary:
  ar: "ينفي ابن سينا أن تضمن صناعة حفظ الصحة الأمان من الموت أو من الآفات الخارجة أو بلوغ غاية العمر، ويحصر ما تضمنه في أمرين: منع العفونة أصلاً وحماية الرطوبة كي لا يسرع إليها التحلل {cite:canon-ibn-sina-print-v1 pp.201-202}."
  en: "Ibn Sina denies that the art of preserving health can guarantee safety from death, from outside afflictions or a full span of life, and limits what it guarantees to two things: preventing putrefaction at the outset, and protecting the moisture so that dissolving does not hurry to it {cite:canon-ibn-sina-print-v1 pp.201-202}."
