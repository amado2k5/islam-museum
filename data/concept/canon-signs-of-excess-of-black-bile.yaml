  ar: "علامات غلبة السوداء عند ابن سينا"
  en: "Signs of an excess of black bile in the Canon"
  fr: "Signes d’excès de bile noire dans le Canon"
  ur: "سودا کے غلبے کی علامات قانون میں"
  es: "Signos de un exceso de bilis negra en el Canon"
  tr: "İbn Sina'ya göre Siyahın Baskınlığının Belirtileri"
  id: "Tanda-tanda Dominasi Hitam menurut Ibn Sina"
summary:
  ar: "يذكر ابن سينا علامات غلبة السوداء، وهي في اللون والدم والفكر وفم المعدة والشهوة والبول والبدن والعلل المصاحبة {cite:canon-ibn-sina-print-v1 p.165}."
  en: "Ibn Sina gives the signs of a dominant black bile in colour, blood, thought, the mouth of the stomach, appetite, urine, build and accompanying ailments {cite:canon-ibn-sina-print-v1 p.165}."
  fr: "Ibn Sina décrit la bile noire dominante selon couleur, sang, pensée, orifice gastrique, appétit, urine, constitution et affections associées {cite:canon-ibn-sina-print-v1 p.165}."
  es: "Ibn Sina da los signos de una bilis negra dominante en el color, la sangre, el pensamiento, la boca del estómago, el apetito, la orina, la constitución y las dolencias que la acompañan {cite:canon-ibn-sina-print-v1 p.165}."
  ur: "ابن سینا رنگ، خون، خیال، معدے کے منہ، بھوک، پیشاب، ساخت اور اس کے ساتھ ہونے والی بیماریوں میں غالب سیاہ پت کی علامات بتاتے ہیں۔"
  tr: "İbn Sina, siyah mürekkebin baskınlığına dair belirtileri belirtir; bunlar renk, kan, düşünce, mide, ağız, arzu, idrar, vücut ve beraberindeki rahatsızlıklarda bulunur {cite:canon-ibn-sina-print-v1 s.165}."
  id: "Ibn Sina menyebutkan tanda-tanda dominasi tinta hitam, yaitu warna, darah, pikiran, perut dan mulut, hasrat, urin, tubuh, dan penyakit yang menyertainya {cite:canon-ibn-sina-print-v1 hlm.165}."
