summary:
  fr: "Dardi est la lie d'une substance, le dépôt du fond. La lie de vin vieux est la meilleure, celle du vinaigre la plus forte ; l'ouvrage dit de l'employer encore humide. {cite:canon-ibn-sina-print-v1 p.440}"
  ar: "الدردي ما سَفُل من كل شيء، أفضله درديّ الخمر العتيق، ودرديّ الخلّ أقواها، ويُستعمل ما كان طرياً. {cite:canon-ibn-sina-print-v1 p.440}"
  en: "Dardi is the lees of anything, the part that settles at the bottom. The lees of old wine are the best and those of vinegar the strongest; the book says to use it while it is still moist. {cite:canon-ibn-sina-print-v1 p.440}"
  ur: "دردی ہر چیز کی تہ میں بیٹھنے والا تلچھٹ ہے۔ پرانی شراب کا درد سب سے بہتر ہے اور سرکے کا سب سے طاقتور؛ کتاب کے مطابق اسے تر ہوتے ہوئے استعمال کرنا چاہیے۔ {cite:canon-ibn-sina-print-v1 p.440}"
