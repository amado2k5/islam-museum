- tradition: sunni
  id: presenter-not-pure-but-glorious
  stance:
    ar: "رأي المقدّم (رأي المتحدث): التاريخ المكتوب ليس صافياً ويحتاج إلى تحقيق وإعادة كتابة، لكن الاتجاه العام لتاريخنا صعود"
    en: "The presenter's view (speaker's opinion): written history is not pure and needs verifying and rewriting, but the overall direction of our history is upward"
    ur: "میزبان کی رائے (مقرر کی رائے): لکھی گئی تاریخ خالص نہیں اور اسے تحقیق اور ازسرِنو تحریر کی ضرورت ہے، مگر ہماری تاریخ کا مجموعی رخ عروج ہے"
  summary:
    ar: "قال طارق السويدان إن التاريخ المكتوب بين أيدينا فيه أهواء وانتماءات سياسية وطائفية، ودخله الأدب والغزل فشوّه صورة خلفاء كهارون الرشيد، وإنه يجب أن يُعاد كتابته بمنهجية التحقيق في الأسانيد، وإن منهج المستشرقين علمي لكنه غير محايد؛ ودعا إلى كتابة التاريخ الحضاري، وشبّه حركة التاريخ بالبورصة: نحو ألف سنة صعود فيها نقاط سوداء، ونحو أربعمئة سنة نزول فيها نقاط بيضاء {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:51:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:52:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:15:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:15:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:17:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:18:00}."
    en: "Tareq al-Suwaidan said the written history we have carries whims and political and sectarian loyalties, and that literature and love poetry entered it and distorted the image of caliphs such as Harun al-Rashid; it must be rewritten by verifying the chains of transmission, and the orientalists' method is scientific but not neutral; he called for writing civilisational history, and compared the movement of history to the stock market: about a thousand years of rise with black spots in it, and about four hundred years of decline with white spots in it {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:51:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:52:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:15:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:15:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:17:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:18:00}."
    ur: "طارق السویدان نے کہا کہ ہمارے پاس موجود لکھی گئی تاریخ میں اہواء اور سیاسی و فرقہ وارانہ وابستگیاں ہیں، اس میں ادب اور غزل داخل ہوئے اور ہارون الرشید جیسے خلفاء کی تصویر بگاڑی؛ اسے اسانید کی تحقیق کے منہج سے ازسرِنو لکھنا ضروری ہے، اور مستشرقین کا منہج علمی ہے مگر غیر جانبدار نہیں؛ انہوں نے تہذیبی تاریخ لکھنے کی دعوت دی، اور تاریخ کی حرکت کو اسٹاک مارکیٹ سے تشبیہ دی: تقریباً ہزار سال عروج جس میں سیاہ نقطے ہیں، اور تقریباً چار سو سال زوال جس میں سفید نقطے ہیں {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:51:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:15:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:17:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:18:00}."
