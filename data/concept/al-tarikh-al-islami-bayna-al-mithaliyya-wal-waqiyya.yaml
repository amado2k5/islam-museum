id: concept/al-tarikh-al-islami-bayna-al-mithaliyya-wal-waqiyya
class: concept
kind: discipline
label:
  ar: "التاريخ الإسلامي بين المثالية والواقعية"
  en: "Islamic history between idealism and realism"
  ur: "اسلامی تاریخ، مثالیت اور حقیقت پسندی کے درمیان"
issue:
  ar: "هل التاريخ الإسلامي المكتوب صافٍ ومثالي أم كتبه بشر تأثروا بميولهم، وهل كتبه المؤرخون الكبار بحياد، وهل كان المستشرقون أكثر علمية، وكيف يُحقَّق التاريخ ويُعاد كتابته؟"
  en: "Is written Islamic history pure and ideal, or was it written by people swayed by their leanings; did the great historians write it neutrally; were the orientalists more scientific; and how should history be verified and rewritten?"
  ur: "کیا لکھی گئی اسلامی تاریخ خالص اور مثالی ہے یا اسے انسانوں نے لکھا جو اپنے رجحانات سے متاثر تھے؛ کیا بڑے مؤرخین نے اسے غیر جانبداری سے لکھا؛ کیا مستشرقین زیادہ علمی تھے؛ اور تاریخ کی تحقیق اور ازسرِنو تحریر کیسے ہو؟"
summary:
  ar: "حلقة «الوسطية» عن التاريخ الإسلامي بين المثالية والواقعية. رفض 78% من جمهور الاستوديو أن معظم التاريخ الإسلامي صراع وأطماع، ورأى 62% أن المؤرخين تأثروا بميولهم العقائدية والسياسية، وانقسموا 45% و55% في أن المستشرقين أكثر علمية من المؤرخين المسلمين؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:05:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:22:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:01:30} وتقابل فيها من يعدّ التاريخ الإسلامي الصحيح مقدساً ومن يراه تاريخ بشر يحتاج إلى نقد وتحقيق. وختم المقدّم بأن التاريخ المكتوب ليس صافياً ويحتاج إلى تحقيق وإعادة كتابة، وبأن الاتجاه العام لتاريخ المسلمين كان صعوداً. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:15:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:17:30}"
  en: "The 'Al-Wasatiyya' episode on Islamic history between idealism and realism. Of the studio audience, 78% rejected the view that most of Islamic history is conflict and greed, 62% thought historians were swayed by their doctrinal and political leanings, and they split 45% to 55% on whether orientalists were more scientific than Muslim historians; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:05:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:22:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:01:30} the guests set a view of sound Islamic history as sacred against a view of it as human history needing critique and verification. The presenter closed by saying written history is not pure and needs verifying and rewriting, and that the overall direction of Muslim history was upward. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:15:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:17:30}"
  ur: "اسلامی تاریخ، مثالیت اور حقیقت پسندی کے درمیان، پر «الوسطیہ» کی قسط۔ اسٹوڈیو حاضرین میں سے 78% نے اس بات کو رد کیا کہ اسلامی تاریخ کا بیشتر حصہ کشمکش اور لالچ ہے، 62% کے نزدیک مؤرخین اپنے عقیدتی اور سیاسی رجحانات سے متاثر ہوئے، اور اس پر کہ کیا مستشرقین مسلم مؤرخین سے زیادہ علمی تھے، وہ 45% اور 55% میں بٹ گئے؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:05:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:22:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:01:30} مہمانوں میں ایک رائے صحیح اسلامی تاریخ کو مقدس سمجھتی تھی اور دوسری اسے انسانی تاریخ جسے تنقید اور تحقیق کی ضرورت ہے۔ میزبان نے یہ کہہ کر اختتام کیا کہ لکھی گئی تاریخ خالص نہیں، اسے تحقیق اور ازسرِنو تحریر کی ضرورت ہے، اور مسلم تاریخ کا مجموعی رخ عروج کی طرف تھا۔ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:15:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:17:30}"
sensitivity: contested
perspectives:
- tradition: sunni
  id: sound-history-is-sacred
  stance:
    ar: "التاريخ الإسلامي الصحيح الذي كتبه مؤرخون ملتزمون بالكتاب والسنة مقدس، وإيرادهم كل الروايات دليل حيادهم"
    en: "Sound Islamic history written by historians committed to the Qur'an and Sunna is sacred, and their reporting of every account is proof of their neutrality"
    ur: "قرآن و سنت کے پابند مؤرخین کی لکھی صحیح اسلامی تاریخ مقدس ہے، اور ان کا ہر روایت نقل کرنا ان کی غیر جانبداری کی دلیل ہے"
  summary:
    ar: "رأى محمود السيد الدغيم، الزميل في مركز الدراسات الإسلامية بجامعة لندن، أن التاريخ الإسلامي عقيدة ومثالي بقدر التزامه بالكتاب والسنة، وأن ما كتبه المؤرخ المسلم الملتزم من التاريخ الصحيح مقدس عنده، وأن روايات غير أهل السنة يعدّها من «أهل الأهواء»؛ ووافقته الدكتورة نما في جانب: أن المؤرخين الكبار رووا بالإسناد فأحالوا القارئ على أدوات النقد، وأن ذلك قمة الإنصاف، وأن منهج المستشرقين ظاهره علمي وباطنه غير علمي {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:07:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:09:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:13:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:14:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:23:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:23:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:02:30}."
    en: "Mahmud al-Sayyid al-Dughaym, a fellow of the Centre of Islamic Studies at the University of London, held that Islamic history is a creed and ideal to the extent it is committed to the Qur'an and Sunna, that sound history written by a committed Muslim historian is sacred to him, and that he counts the accounts of non-Sunnis as those of 'people of whims'; Dr Nama agreed in part: the great historians reported with chains of transmission and so referred the reader to the tools of criticism, which is the height of fairness, while the orientalists' method is scientific on the surface but not underneath {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:07:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:09:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:13:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:14:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:23:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:23:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:02:30}."
    ur: "جامعہ لندن کے مرکزِ اسلامی مطالعات کے فیلو محمود السید الدغیم کے نزدیک اسلامی تاریخ اسی حد تک عقیدہ اور مثالی ہے جس حد تک وہ قرآن و سنت کی پابند ہے، پابند مسلم مؤرخ کی لکھی صحیح تاریخ ان کے لیے مقدس ہے، اور وہ غیر اہلِ سنت کی روایات کو «اہلِ اہواء» کی روایات شمار کرتے ہیں؛ ڈاکٹر نما نے جزوی اتفاق کیا: بڑے مؤرخین نے اسناد کے ساتھ روایت کی اور یوں قاری کو تنقید کے اوزار کے حوالے کیا، جو انصاف کی انتہا ہے، جبکہ مستشرقین کا طریقہ ظاہر میں علمی اور باطن میں غیر علمی ہے {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:07:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:09:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:14:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:23:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:02:30}."
