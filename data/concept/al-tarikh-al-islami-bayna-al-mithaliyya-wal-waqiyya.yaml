- tradition: sunni
  id: human-history-needs-tahqiq
  stance:
    ar: "تاريخ المسلمين بعد عهد الوحي تاريخ بشر، ليس عقيدة ولا مقدساً، ويحتاج إلى تحقيق كتحقيق الحديث"
    en: "The history of Muslims after the age of revelation is human history, neither creed nor sacred, and needs verification as hadith was verified"
    ur: "عہدِ وحی کے بعد مسلمانوں کی تاریخ انسانی تاریخ ہے، نہ عقیدہ نہ مقدس، اور اسے حدیث کی طرح تحقیق کی ضرورت ہے"
  summary:
    ar: "رأى بسام، الوزير السابق والنائب وأستاذ الشريعة، أن يُفرَّق بين التاريخ الإسلامي، أي ما ورد في القرآن والحديث، وتاريخ المسلمين بعده، وأن الأخير ليس عقيدة ولا مقدساً، وأنه يرفض غض البصر عن أخطائه ويرفض لعن من وقع فيه، وأن التاريخ الإسلامي غير محقق؛ ورأى عبد الله الخباص أن التاريخ لا يرقى إلى العقيدة لأنه كتبه رجال بعضهم أصحاب نزعات؛ ورأى محمد إجميعان أن روايات الردة عند الطبري تسقط بمعيار الجرح والتعديل لأنها عن سيف بن عمر {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:15:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:15:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:30:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:31:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:33:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:34:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:46:00}."
    en: "Bassam, a former minister, member of parliament and professor of sharia, held that Islamic history, meaning what the Qur'an and hadith relate, should be distinguished from the history of Muslims after it, which is neither creed nor sacred; he rejected both turning a blind eye to its mistakes and cursing those involved, and said Islamic history has not been verified; Abdallah al-Khabbas held that history cannot rise to the level of creed because men wrote it, some with partisan leanings; and Muhammad Ijmi'an held that al-Tabari's reports of the ridda fall by the standard of hadith criticism because they come from Sayf ibn Umar {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:15:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:15:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:30:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:31:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:33:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:34:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:46:00}."
    ur: "سابق وزیر، رکنِ پارلیمان اور استادِ شریعت بسام کے نزدیک اسلامی تاریخ، یعنی جو قرآن و حدیث میں آیا، اور اس کے بعد مسلمانوں کی تاریخ میں فرق ہونا چاہیے، اور مؤخر الذکر نہ عقیدہ ہے نہ مقدس؛ وہ اس کی غلطیوں سے چشم پوشی کو بھی رد کرتے ہیں اور ان میں ملوث لوگوں پر لعنت کو بھی، اور کہتے ہیں کہ اسلامی تاریخ کی تحقیق نہیں ہوئی؛ عبد اللہ الخباص کے نزدیک تاریخ عقیدے کے درجے کو نہیں پہنچتی کیونکہ اسے انسانوں نے لکھا جن میں بعض جانبدار تھے؛ اور محمد اجمیعان کے نزدیک طبری کی ردہ کی روایات جرح و تعدیل کے معیار پر گر جاتی ہیں کیونکہ وہ سیف بن عمر سے ہیں {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:15:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:30:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:31:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:33:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:46:00}."
