- tradition: academic
  id: critical-review-civilisational-history
  stance:
    ar: "التاريخ الإسلامي يحتاج إلى مراجعات نقدية بمناهج حديثة، وإلى كتابة تاريخ حضاري لا تاريخ أسر حاكمة"
    en: "Islamic history needs critical reviews with modern methods, and a civilisational history rather than a history of ruling families"
    ur: "اسلامی تاریخ کو جدید مناہج کے ساتھ تنقیدی جائزوں اور حکمران خاندانوں کی تاریخ کے بجائے تہذیبی تاریخ کی ضرورت ہے"
  summary:
    ar: "رأى صلاح الدين الجورشي، الباحث والصحفي التونسي، أن المؤرخ بشر يعيش في مرحلة تشقها الصراعات فلا يخرج منها تماماً، وأن جيل الصحابة جيل بشري، وعدّ أهل السنة والجماعة «حزباً سياسياً» له رؤيته، وهذا رأيه؛ وخلص إلى خمس نقاط: التاريخ ليس مقدساً، ولا تُقصى رواية بل تُحقَّق، والتاريخ علم له مناهج، والحاجة إلى تاريخ حضاري، والفصل بين الإيمان والحجة التاريخية {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:26:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:26:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:28:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:29:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:13:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:14:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:14:30}."
    en: "Salah al-Din al-Jourchi, a Tunisian researcher and journalist, held that the historian is a human being living in a period riven by conflicts and cannot fully step outside it, that the Companions' generation was a human generation, and he called Ahl al-Sunna wa-l-Jama'a 'a political party' with its own outlook, which is his view; he concluded with five points: history is not sacred, no account is excluded but each is verified, history is a science with methods, a civilisational history is needed, and religious faith must be separated from historical argument {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:26:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:26:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:28:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:29:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:13:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:14:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:14:30}."
    ur: "تیونسی محقق اور صحافی صلاح الدین الجورشی کے نزدیک مؤرخ انسان ہے جو کشمکش سے بھرے دور میں رہتا ہے اور اس سے پوری طرح باہر نہیں نکل سکتا، صحابہ کی نسل انسانی نسل تھی، اور انہوں نے اہلِ سنت والجماعت کو اپنی رؤیت رکھنے والی «سیاسی جماعت» کہا، جو ان کی رائے ہے؛ ان کے پانچ نکات: تاریخ مقدس نہیں، کوئی روایت خارج نہ ہو بلکہ تحقیق ہو، تاریخ مناہج والا علم ہے، تہذیبی تاریخ کی ضرورت ہے، اور دینی ایمان اور تاریخی دلیل میں فرق کیا جائے {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:26:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:28:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 00:29:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:13:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep39 01:14:30}."
