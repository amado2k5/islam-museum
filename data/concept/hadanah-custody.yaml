class: concept
kind: legal
tags: [akhlaq-browser, akhlaq-talaq, ubuwwa-browser, bunuwwa-browser]
label: { ar: "الحضانة", en: "Custody of a child (hadana)", ur: "حضانت ⁦(بچے کی پرورش)⁩", es: "Custodia de un niño (hadana)", fr: "Garde d'un enfant (hadana)", tr: "Kreş", id: "Pembibitan" }
summary:
  ar: "الحضانة في الشرع حفظ من لا يستقل بأموره، وتربيته بما يصلحه، وهي واجبة لأن المحضون قد يهلك أو يتضرر بتركها، وتكون عينا عند عدم غير الحاضن وكفاية عند تعدد الحاضنين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7112} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7113} وتفترق عن الكفالة بمعنى ضم الذمة، والولاية، والوصاية التي تثبت بتفويض الغير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7113} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7114} وتثبت على الصغير وعلى المجنون والمعتوه بالاتفاق في الجملة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7114} والأم أحق بالحضانة ما لم تتزوج بأجنبي، لقوله: «أنت أحق به ما لم تنكحي». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7115} وترتيب المستحقين بعدها مختلف: الحنفية يقدمون أم الأم ثم أم الأب ثم الأخوات والخالات ثم العصبات، والمالكية يقدمون جدة الأم ثم الخالات والعمات ثم الجدة لأب ثم الأب، والشافعية يقدمون البنت ثم أمهات الأم ثم أم الأب ثم الأخوات ثم الخالات، والحنابلة يقدمون أمهات الأم ثم الأب ثم أمهات الأب ثم الجد ثم الأخوات والخالات والعمات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7115} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7116} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7117} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7118} وإذا اجتمع مستحقون من الذكور والإناث قدمت الأنثى مع التساوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7117} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7118} ومن شروط الحاضن عند الفقهاء: الإسلام عند بعضهم، والبلوغ والعقل، والأمانة، والقدرة على القيام بالمحضون، وسلامته من مرض معد، والرشد عند المالكية والشافعية، وأمن المكان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7118} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7119} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7120} وشروط الرجل أن يكون محرما للمحضونة المشتهاة، وشروط المرأة ألا تتزوج بأجنبي من المحضون وألا تكون أقامت بالمحضون في بيت من يكرهه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7120} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7121} ومكان الحضانة مسكن الأب، وانتقال الحاضن للنقلة يسقط الحضانة عند الجمهور، وللحنفية تفصيل في سفر الأم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7122} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7123} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7124} والأجرة على الحضانة جائزة عند الشافعية والحنابلة، ولا أجرة عند المالكية في المشهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7124} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7125} وتسقط الحضانة بالمانع وتعود بزواله، واختلفوا في عودتها بعد الطلاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7126} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7127} وتنتهي حضانة النساء على الذكر عند الحنفية بسبع سنين، وعند المالكية بالبلوغ، وعند الشافعية يخير المحضون بين أبويه إذا بلغ حد التمييز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7127} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7128} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7129} ولكل من الأبوين حق رؤية المحضون وزيارته، وللمحضون حق الاتصال بالأبوين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7130} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7131}"
  en: "Custody (hadana) is keeping safe, and raising in what suits, a person who cannot yet manage his own affairs; it is obligatory, since the child may perish or be harmed without it, and it becomes an individual duty when there is no other custodian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7112} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7113} It differs from sponsorship (kafala), which is the joining of liabilities, from guardianship, and from the executorship that a will creates. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7113} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7114} It applies to a child, and to an insane or imbecile adult by general agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7114} The mother has the better claim so long as she does not marry a stranger to the child: ”You have the better claim to him as long as you do not marry.” {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7115} The order of claimants after the mother differs: the Hanafis put the mother's mother, the father's mother, the sisters, the aunts and then the agnates; the Malikis put the maternal grandmother, the aunts, the paternal grandmother, then the father; the Shafi'is put the daughter, the mothers' line, the paternal grandmother, the sisters and the aunts; the Hanbalis put the mothers' line, then the father, the paternal line, the grandfather, and the sisters, aunts and kin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7115} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7116} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7117} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7118} When male and female claimants stand equal, the female takes precedence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7117} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7118} The custodian's conditions include Islam for some, puberty and reason, trustworthiness, ability, freedom from contagious illness, soundness of judgement for the Malikis and Shafi'is, and a safe place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7118} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7119} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7120} A man must be a mahram of an adolescent girl in his charge; a woman must not marry a stranger to the child and must not keep him in the house of someone who dislikes him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7120} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7121} The place of custody is the father's dwelling; a custodian's removal to settle elsewhere ends custody for the majority, and the Hanafis draw a distinction for a mother's travel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7122} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7123} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7124} Payment for custody is allowed for the Shafi'is and Hanbalis, and in the preferred Maliki view there is none. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7124} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7125} Custody lapses with a bar and returns when the bar is removed, and the views differ on its return after divorce. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7126} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7127} The mothers' custody of a boy ends at seven for the Hanafis, at puberty for the Malikis, while the Shafi'is give the child a choice between his parents on reaching discernment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7127} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7128} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7129} Each parent has the right to see and visit the child. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7130} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7131}"
  es: "La custodia (hadana) consiste en mantener a salvo y criar de la manera que le convenga a una persona que aún no puede administrar sus propios asuntos; es obligatoria, ya que el niño puede perecer o sufrir daños sin ella, y se convierte en un deber individual cuando no hay otro custodio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7112} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7113} Se diferencia del patrocinio (kafala), que es la unión de responsabilidades, de la tutela y del albacea que crea un testamento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7113} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7114} Se aplica a un niño y a un adulto con discapacidad intelectual o mental por acuerdo general. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7114} La madre tiene mejor derecho siempre que no se case con un extraño para el niño: \"Tienes mejor derecho sobre él siempre que no te cases\". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7115} El orden de los reclamantes después de la madre difiere: los Hanafis ponen a la madre de la madre, la madre del padre, las hermanas, las tías y luego los agnados; los Malikis ponen a la abuela materna, las tías, la abuela paterna, luego el padre; los Shafi'is ponen a la hija, la línea materna, la abuela paterna, las hermanas y las tías; los Hanbalis ponen la línea materna, luego el padre, la línea paterna, el abuelo y las hermanas, tías y parientes. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7115} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7116} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7117} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7118} Cuando los reclamantes masculinos y femeninos son iguales, la mujer tiene prioridad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7117} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7118} Las condiciones del custodio incluyen el Islam para algunos, la pubertad y la razón, la confiabilidad, la capacidad, la ausencia de enfermedades contagiosas, la solidez de juicio para los Malikis y Shafi'is, y un lugar seguro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7118} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7119} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7120} Un hombre debe ser mahram de una niña adolescente a su cargo; una mujer no debe casarse con un extraño para el niño y no debe mantenerlo en la casa de alguien que lo desaprecie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7120} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7121} El lugar de custodia es la vivienda del padre; la mudanza de un custodio para establecerse en otro lugar termina con la custodia para la mayoría, y los Hanafis hacen una distinción para el viaje de una madre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7122} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7123} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7124} El pago por la custodia está permitido para los shafi'is y hanbalis, y en la opinión preferida malikí no hay ninguno. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7124} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7125} La custodia caduca con una prohibición y se restablece cuando se levanta la prohibición, y las opiniones difieren sobre su restablecimiento después del divorcio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7126} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7127} La custodia de un niño por parte de la madre termina a los siete años para los Hanafi, en la pubertad para los Maliki, mientras que los Shafi'i le dan al niño la opción de elegir entre sus padres al llegar a la edad de discernimiento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7127} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7128} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7129} Cada padre tiene derecho a ver y visitar al niño. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7130} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7131}"
  fr: "La tutelle (hadana) consiste à assurer la sécurité et l'éducation, selon les besoins, d'une personne incapable de gérer ses propres affaires; elle est obligatoire, car l'enfant risque de périr ou de subir un préjudice en son absence, et elle devient une obligation individuelle lorsqu'il n'existe aucun autre tuteur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7112} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7113} Elle diffère du parrainage (kafala), qui consiste en une mise en commun des responsabilités, de la tutelle et de la charge d'exécuteur testamentaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7113} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7114} Elle s'applique à un enfant et, par convention générale, à un adulte atteint de troubles mentaux ou d'incapacité mentale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7114} La mère a la priorité sur l'enfant tant qu'elle ne se marie pas avec un étranger: « Tu as la priorité sur lui tant que tu ne te maries pas. » {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7115} L'ordre de succession après la mère varie: les Hanafites placent la grand-mère maternelle, la grand-mère paternelle, les sœurs, les tantes et ensuite les agnats; les Malikites placent la grand-mère maternelle, les tantes, la grand-mère paternelle, puis le père; les Shafi'ites placent la fille, la lignée maternelle, la grand-mère paternelle, les sœurs et les tantes; les Hanbalites placent la lignée maternelle, puis le père, la lignée paternelle, le grand-père, puis les sœurs, les tantes et les autres membres de la famille. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7115} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7116} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7117} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7118} Lorsque les demandeurs hommes et femmes sont égaux, la femme a préséance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7117} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7118} Les conditions requises pour confier un enfant à un tuteur incluent, pour certains, la conversion à l'islam, la puberté et la raison, la fiabilité, les capacités, l'absence de maladie contagieuse, la probité du jugement pour les Malikites et les Chafi'ites, et un lieu sûr. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7118} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7119} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7120} Un homme doit être un mahram de la jeune fille adolescente placée sous sa tutelle; une femme ne doit pas épouser un étranger à l'enfant et ne doit pas le garder chez une personne qui le désapprouve. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7120} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7121} Le lieu de garde est le domicile du père; le déménagement du tuteur pour s’installer ailleurs met fin à la garde pour la majorité des enfants, et les hanafites font une distinction en cas de voyage de la mère. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7122} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7123} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7124} La rémunération de la garde est autorisée chez les chaféites et les hanbalites, mais elle est proscrite dans l’avis majoritaire des malikites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7124} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7125} La garde est suspendue en cas d'interdiction et rétablie lorsque celle-ci est levée. Les avis divergent quant à son rétablissement après un divorce. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7126} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7127} La garde d'un garçon par sa mère prend fin à sept ans chez les Hanafites, à la puberté chez les Malikites, tandis que les Chafi'ites laissent à l'enfant le choix entre ses parents lorsqu'il atteint la maturité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7127} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7128} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7129} Chaque parent a le droit de voir et de rendre visite à l'enfant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7130} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7131}"
  ur: "کسٹڈی ⁦(ہدانا)⁩ کو محفوظ رکھنا ہے، اور اس کی پرورش کیا مناسب ہے، ایک ایسا شخص جو ابھی تک اپنے معاملات خود نہیں سنبھال سکتا ہے۔ یہ واجب ہے، کیونکہ بچہ اس کے بغیر ہلاک ہو سکتا ہے یا اسے نقصان پہنچا سکتا ہے، اور جب کوئی دوسرا نگران نہ ہو تو یہ انفرادی فرض بن جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.7112} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7113} یہ کفالت ⁦(کفالہ)⁩ سے مختلف ہے، جو کہ ذمہ داریوں کا ملاپ ہے، ولایت سے، اور وصیت کرنے والے سے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.7113} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.7114} یہ ایک بچے پر لاگو ہوتا ہے، اور عام معاہدے کے مطابق ایک پاگل یا نادان بالغ پر۔ {حوالہ: فقہ الموسوعۃ النور-v3 ص7114} ماں کا اس وقت تک بہتر دعویٰ ہے جب تک کہ وہ کسی اجنبی سے اس بچے سے شادی نہ کرے: ’’جب تک تم شادی نہیں کرتے اس پر تمہارا زیادہ حق ہے۔‘‘ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص7115} ماں کے بعد دعویٰ کرنے والوں کا حکم مختلف ہے: احناف نے ماں کی ماں، باپ کی ماں، بہنوں، خالہ کو اور پھر عصمت کو۔ مالکیوں نے نانی کو، خالہ کو، پھوپھی کو دادی کو، پھر باپ کو۔ شافعیوں نے بیٹی، ماؤں کی صف، پھوپھی، بہنوں اور خالہوں کو رکھا ہے۔ حنبلیوں نے ماؤں کی لائن ڈالی، پھر باپ، پھوپھی، دادا، اور بہنیں، خالہ اور رشتہ دار۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7115} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7116} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7117} p.7118} جب مرد اور عورت دعویدار برابر کھڑے ہوتے ہیں تو عورت کو فوقیت حاصل ہوتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7117} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص7118} متولی کی شرائط میں بعض کے لیے اسلام، بلوغت اور عقل، امانت، قابلیت، متعدی بیماری سے آزادی اور صحت مندی، صحت مندی اور صحت مندی کے لیے اسلام شامل ہے۔ جگہ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7118} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7119} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7120} مرد کو لڑکی کا مہتمم ہونا چاہیے۔ عورت کو کسی اجنبی سے بچے کی شادی نہیں کرنی چاہیے اور اسے کسی ایسے شخص کے گھر نہیں رکھنا چاہیے جو اسے ناپسند کرتا ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.7120} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7121} تحویل کی جگہ باپ کا ٹھکانہ ہے۔ کسی نگران کو کسی اور جگہ بسانے کے لیے ہٹانے سے اکثریت کی تحویل ختم ہو جاتی ہے، اور حنفیہ ماں کے سفر کے لیے امتیازی حیثیت رکھتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.7122} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7123} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص7124} حنفیہ کے لیے ادائیگی کی اجازت ہے اور شافعی کے لیے جائز ہے۔ مالکی نظریہ کوئی نہیں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7124} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7125} بار کے ساتھ حراست ختم ہو جاتی ہے اور بار ہٹانے پر واپس آجاتی ہے، اور طلاق کے بعد اس کی واپسی کے بارے میں آراء مختلف ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص7126} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7127} حنفیہ کے نزدیک ماؤں کی حفاظت سات پر ختم ہو جاتی ہے، مالکیوں کے لیے بلوغت کے وقت، جب کہ شافعی والدین کے درمیان اختیار کا فیصلہ کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.7127} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7128} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7129} ہر والدین کو بچے کو دیکھنے اور ملنے کا حق ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7130}"
  tr: "İslam hukukunda velayet, işlerini bağımsız olarak yönetmeyenleri korumak ve onları kendileri için en iyisi şekilde yetiştirmektir. Zorunludur çünkü vasi ihmal edilirse ölebilir veya zarar görebilir; başka kimse yoksa fayda olarak kabul edilir ve birden fazla vasi varsa bu yeterlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7112} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7113} ve kafalah'dan, başkalarının izniyle kurulan güven, vasilik ve vasilik ekleme anlamında farklıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7113} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7114} ve cümlede anlaşmayla küçük, akıl hastası ve akıl hastası için belirlenmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7114} Ve anne, yabancıyla evlenmediği sürece velayet hakkına daha fazla sahiptir, çünkü o der ki: \"Evlenmezsen ona daha çok hakkın var.\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7115} Hak sahiplerinin sıralaması farklıdır: Hanafiler önce annenin annesini, sonra babanın annesini, sonra kız kardeşleri ve anne tarafından teyzeleri, sonra asbāt'ı; Malikiler önce anne tarafından büyükanneyi, sonra anne tarafından teyzeleri, sonra baba tarafından büyükanneyi, sonra baba tarafından büyükanneyi, sonra baba tarafından teyzeleri, sonra kız kardeşleri, sonra anne tarafından teyzeleri önceliklendirir; ve Hanbaliler önce anne tarafındaki anneleri, sonra babaları, baba annelerini, büyükbabalarını, kız kardeşlerini, anne tarafından teyzeleri ve baba tarafından teyzeleri önceliklendirir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7115} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7116} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7117}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7118} Erkek ve kadın yararlanıcılar birleştirildiğinde, kadın eşit şekilde sunulur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7117} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7118} Hukukçulara göre vasi için koşullar şunlardır: bazılarına göre İslam, ergenlik, aklı, güvenilirlik, koruyucuya bakabilme yeteneği, bulaşıcı hastalıklardan korunma, Maliki ve Şafi'lere göre sağduyu ve yerin güvenliği. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7118} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7119} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7120} Bir erkeğin istenen vasiye mahram olmasının koşulları, kadının velayetten olmayan biriyle evlenmemesi ve sevmediği birinin evinde yaşamaması koşulları. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7120} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7121} ve velayet yeri babanın ikametgahıdır, vasi devri ise velayeti kamuoyuna kaybeder. Hanefi'nin anne kitabında ayrıntılı bir açıklaması vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7122} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7123} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7124} Vesayet için kira Şafi'ler ve Hanbalilere göre kabul edilir, ancak Maliki görüşüne göre ücret alınmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7124} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7125} Engel nedeniyle velayet kaybedilir ve sona erdiğinde geri verilir, boşanma sonrası geri verilmesi konusunda anlaşmazlık vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7126} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7127} Hanefilere göre kadının velayeti, ergenlikte erkek olarak yedi yaşında sona erer ve Şafiilere göre çocuk ayrımcılık noktasına ulaşırsa ebeveynleri arasında seçim hakkı verilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7127} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7128} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7129} Her ebeveynin çocuğu görme ve ziyaret etme hakkı vardır ve çocuğun ebeveynlerle iletişime geçme hakkı vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7130} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7131}"
  id: "Hak asuh dalam hukum Islam bertujuan melindungi mereka yang tidak mengelola urusan mereka secara mandiri dan membesarkan mereka dengan cara yang terbaik bagi mereka. Ini wajib karena penjaga dapat meninggal dunia atau dirugikan jika diabaikan, dan dianggap sebagai manfaat jika tidak ada orang lain selain penjaga, dan cukup jika ada beberapa wali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7112} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7113} dan berbeda dari kafalah dalam arti menambahkan kepercayaan, perwalian, dan wali yang ditetapkan atas izin orang lain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7113} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7114} dan ditetapkan untuk anak di bawah umur, orang gila, dan orang gila berdasarkan kesepakatan dalam kalimat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7114} Dan ibu lebih berhak atas hak asuh kecuali dia menikah dengan orang asing, seperti yang dikatakan ibu: \"Kamu lebih berhak atas dia kecuali kamu menikah.\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7115} Urutan mereka yang berhak setelah itu berbeda: Hanafi memprioritaskan ibu dari pihak ibu, lalu ibu dari pihak ayah, kemudian saudara perempuan dan bibi dari pihak ibu, lalu asbāt; keluarga Malik memprioritaskan nenek dari pihak ibu, lalu bibi dari pihak ibu, lalu nenek dari pihak ayah, lalu ayah; para Syafi'i memprioritaskan anak perempuan, lalu ibu, kemudian bibi dari pihak ayah, kemudian saudara perempuan dari pihak ibu; dan Hanbali memprioritaskan ibu dari pihak ibu, lalu ayah, ibu dari pihak ayah, kakek, saudari, bibi dari pihak ibu, dan bibi dari pihak ayah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7115} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7116} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7117} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7118} Jika penerima manfaat laki-laki dan perempuan digabungkan, maka perempuan akan disajikan secara sama. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7117} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7118} Di antara syarat bagi seorang wali menurut para ahli hukum adalah: Islam menurut sebagian orang, pubertas, kewarasan, kepercayaan, kemampuan merawat penjaga, keselamatan dari penyakit menular, penilaian yang bijak menurut Maliki dan syafi'i, serta keamanan tempat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7118} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7119} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7120} Syarat bagi seorang pria untuk menjadi mahram bagi penjaga yang diinginkan, dan syarat bagi seorang wanita untuk tidak menikah dengan non-pria dari penjaga dan tidak tinggal di rumah seseorang yang tidak disukainya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7120} {cite:) fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7121} dan tempat hak asuh adalah kediaman ayah, dan pemindahan hak asuh ke pemindahan kehilangan hak asuh kepada publik. Hanafi memiliki deskripsi rinci dalam buku ibu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7122} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7123} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7124} Sewa hak asuh diperbolehkan menurut Shafi'i dan Hanbali, tetapi tidak ada biaya menurut pandangan Maliki menurut pandangan yang sudah dikenal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7124} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7125} Hak asuh hilang karena hambatan tersebut dan dipulihkan setelah berakhir, dan ada perselisihan tentang pengembalian setelah perceraian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7126} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7127} Hak asuh perempuan berakhir dengan laki-laki pada usia tujuh tahun menurut Hanafi, saat pubertas, dan menurut para Shafi'i, anak diberi pilihan antara orang tuanya jika ia mencapai titik diskriminasi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7127} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7128} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7129} Setiap orang tua berhak melihat dan mengunjungi anak, dan anak berhak menghubungi orang tua. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7130} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7131}"
