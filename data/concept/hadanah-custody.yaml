label: { ar: "الحضانة", en: "Custody of a child (hadana)", ur: "حضانت (بچے کی پرورش)" }
summary:
  ar: "الحضانة في الشرع حفظ من لا يستقل بأموره، وتربيته بما يصلحه، وهي واجبة لأن المحضون قد يهلك أو يتضرر بتركها، وتكون عينا عند عدم غير الحاضن وكفاية عند تعدد الحاضنين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7112} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7113} وتفترق عن الكفالة بمعنى ضم الذمة، والولاية، والوصاية التي تثبت بتفويض الغير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7113} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7114} وتثبت على الصغير وعلى المجنون والمعتوه بالاتفاق في الجملة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7114} والأم أحق بالحضانة ما لم تتزوج بأجنبي، لقوله: «أنت أحق به ما لم تنكحي». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7115} وترتيب المستحقين بعدها مختلف: الحنفية يقدمون أم الأم ثم أم الأب ثم الأخوات والخالات ثم العصبات، والمالكية يقدمون جدة الأم ثم الخالات والعمات ثم الجدة لأب ثم الأب، والشافعية يقدمون البنت ثم أمهات الأم ثم أم الأب ثم الأخوات ثم الخالات، والحنابلة يقدمون أمهات الأم ثم الأب ثم أمهات الأب ثم الجد ثم الأخوات والخالات والعمات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7115} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7116} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7117} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7118} وإذا اجتمع مستحقون من الذكور والإناث قدمت الأنثى مع التساوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7117} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7118} ومن شروط الحاضن عند الفقهاء: الإسلام عند بعضهم، والبلوغ والعقل، والأمانة، والقدرة على القيام بالمحضون، وسلامته من مرض معد، والرشد عند المالكية والشافعية، وأمن المكان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7118} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7119} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7120} وشروط الرجل أن يكون محرما للمحضونة المشتهاة، وشروط المرأة ألا تتزوج بأجنبي من المحضون وألا تكون أقامت بالمحضون في بيت من يكرهه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7120} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7121} ومكان الحضانة مسكن الأب، وانتقال الحاضن للنقلة يسقط الحضانة عند الجمهور، وللحنفية تفصيل في سفر الأم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7122} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7123} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7124} والأجرة على الحضانة جائزة عند الشافعية والحنابلة، ولا أجرة عند المالكية في المشهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7124} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7125} وتسقط الحضانة بالمانع وتعود بزواله، واختلفوا في عودتها بعد الطلاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7126} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7127} وتنتهي حضانة النساء على الذكر عند الحنفية بسبع سنين، وعند المالكية بالبلوغ، وعند الشافعية يخير المحضون بين أبويه إذا بلغ حد التمييز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7127} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7128} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7129} ولكل من الأبوين حق رؤية المحضون وزيارته، وللمحضون حق الاتصال بالأبوين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7130} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7131}"
  en: "Custody (hadana) is keeping safe, and raising in what suits, a person who cannot yet manage his own affairs; it is obligatory, since the child may perish or be harmed without it, and it becomes an individual duty when there is no other custodian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7112} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7113} It differs from sponsorship (kafala), which is the joining of liabilities, from guardianship, and from the executorship that a will creates. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7113} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7114} It applies to a child, and to an insane or imbecile adult by general agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7114} The mother has the better claim so long as she does not marry a stranger to the child: ”You have the better claim to him as long as you do not marry.” {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7115} The order of claimants after the mother differs: the Hanafis put the mother's mother, the father's mother, the sisters, the aunts and then the agnates; the Malikis put the maternal grandmother, the aunts, the paternal grandmother, then the father; the Shafi'is put the daughter, the mothers' line, the paternal grandmother, the sisters and the aunts; the Hanbalis put the mothers' line, then the father, the paternal line, the grandfather, and the sisters, aunts and kin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7115} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7116} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7117} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7118} When male and female claimants stand equal, the female takes precedence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7117} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7118} The custodian's conditions include Islam for some, puberty and reason, trustworthiness, ability, freedom from contagious illness, soundness of judgement for the Malikis and Shafi'is, and a safe place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7118} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7119} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7120} A man must be a mahram of an adolescent girl in his charge; a woman must not marry a stranger to the child and must not keep him in the house of someone who dislikes him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7120} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7121} The place of custody is the father's dwelling; a custodian's removal to settle elsewhere ends custody for the majority, and the Hanafis draw a distinction for a mother's travel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7122} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7123} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7124} Payment for custody is allowed for the Shafi'is and Hanbalis, and in the preferred Maliki view there is none. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7124} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7125} Custody lapses with a bar and returns when the bar is removed, and the views differ on its return after divorce. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7126} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7127} The mothers' custody of a boy ends at seven for the Hanafis, at puberty for the Malikis, while the Shafi'is give the child a choice between his parents on reaching discernment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7127} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7128} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7129} Each parent has the right to see and visit the child. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7130} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7131}"
