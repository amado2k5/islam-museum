label:
  ar: "حبّة الخضراء"
  en: "Habbat al-khadra (the terebinth berry)"
  ur: "حبہ الخضراء ⁦(بطم کا پھل)⁩"
  es: "Habbat al-khadra (la baya de terebinto)"
  fr: "Habbat al-khadra (la baie de térébinthe)"
summary:
  ar: "حبّة الخضراء ثمرة شجرة البطم، حسب حاشية المحقّق، وأجودها ما جُلب من الجزيرة التي يذكرها الكتاب. صمغها أكثر تحليلاً من المصطكى، ويقوم مقامها في كثير من الأوقات. مسخّنة مليّنة منقّية، تنفع الطحال وتجلو الوجه وتنضج الأورام الصلبة وتنفع أوجاع الجنب. وما يذكره الكتاب عن إدرار صمغها وثمرتها تقرير مُعلَّم."
  en: "Habbat al-khadra is the fruit of the terebinth tree, according to the editor's note. The best comes from the island the book names. Its gum is more dissolving than mastic and often stands in for it. It warms, softens and cleans, helps the spleen, clears the face, ripens hard swellings and helps pains of the side. The book's report that its gum and fruit stir and promote flow is a labelled listing set aside for the founder's ruling."
  ur: "حبہ الخضراء بطم کے درخت کا پھل ہے، مدوّن کے حاشیے کے مطابق۔ بہترین وہ ہے جو کتاب کے بیان کردہ جزیرے سے آتا ہے۔ اس کا گوند مصطکی سے زیادہ تحلیل کرتا ہے اور اکثر اس کی جگہ کام آتا ہے۔ یہ گرم، نرم کرنے والا اور صاف کرنے والا ہے، تلی کو فائدہ دیتا ہے، چہرے کو نکھارتا ہے، سخت سوجن پکاتا ہے اور پہلو کے درد میں مفید ہے۔ کتاب کا بیان کہ اس کا گوند اور پھل بہاؤ پیدا کرتے ہیں نشان زدہ ہے۔"
  es: "Según la nota del editor, el Habbat al-khadra es el fruto del árbol de terebinto. El mejor proviene de la isla que menciona el libro. Su goma es más disolvente que el mástique y a menudo lo sustituye. Calienta, suaviza y limpia, beneficia al bazo, despeja el rostro, reduce la hinchazón y alivia los dolores de costado. La afirmación del libro de que su goma y su fruto estimulan y favorecen la circulación es una indicación específica reservada para la doctrina del fundador."
  fr: "Selon la note de l'éditeur, le fruit du térébinthe, Habbat al-khadra, est le meilleur provenant de l'île mentionnée dans l'ouvrage. Sa gomme, plus dissolvante que le mastic, le remplace souvent. Il réchauffe, adoucit et purifie, est bénéfique pour la rate, éclaircit le visage, résorbe les gonflements et soulage les douleurs latérales. L'affirmation, dans le livre, selon laquelle sa gomme et son fruit favorisent la circulation sanguine est une mention spécifique, attribuée au fondateur."
