label:
  ar: "كِرَاء الْعَقِب"
  en: "Hire of a mount in turns (kira al-aqib)"
  ur: "کرائے پر سواری نوبت وار ⁦(کراء العقب)⁩"
  es: "Alquiler de una montura por turnos (kira al-aqib)"
  fr: "Location d'une monture à tour de rôle (kira al-aqib)"
  tr: "Topuk kiralama"
  id: "Sewa hak"
summary:
  ar: "كراء العقب أن يؤجر الإنسان دابة لرجلين ليركب هذا أياماً وذاك أياماً، أو ليركب هذا مسافة من الطريق وذاك مسافة أخرى، وسميت بذلك لأن كلاً منهما يعقب صاحبه. وذهب جمهور الفقهاء إلى جوازه بصورتيه، مع اعتبار العادة إن وجدت، والقرعة عند التنازع في البداءة، ولا يصح عند الحنابلة إلا مع تعيين الراكب، وعند الشافعية في الأصح المنع، وقال الحنفية والمالكية بجوازه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13231} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13232} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13233}"
  en: "Hire of a mount in turns is letting a beast to two people, so that one rides for some days and the other for others, or one rides a stretch of the road and the other a further stretch; the name comes from each following the other in turns. Most jurists allow both forms, with custom followed where it exists and lots drawn if the two dispute who starts. The Hanbalis allow it only when the rider is named; the Shafi'is in the sounder view forbid it; the Hanafis and Malikis allow it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13231} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13232} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13233}"
  ur: "کراء العقب یہ ہے کہ آدمی کوئی جانور دو آدمیوں کو اس طرح کرائے پر دے کہ ایک کچھ دنوں تک سوار ہو اور دوسرا کچھ دنوں تک، یا ایک راستے کا کچھ حصہ سوار ہو اور دوسرا باقی حصہ، اور اسے یہ نام اس لیے دیا گیا کہ ہر ایک دوسرے کی نوبت پر آتا ہے۔ جمہور فقہاء دونوں صورتوں کو جائز کہتے ہیں، عادت کا لحاظ رکھا جائے گا، اور ابتداء پر اختلاف ہو تو قرعہ ڈالا جائے گا۔ حنابلہ اسے صرف سوار کو متعین کر کے جائز کہتے ہیں، شافعیہ کے اصح قول میں یہ ناجائز ہے، اور حنفیہ و مالکیہ جائز کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13231} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13232} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13233}"
  es: "El alquiler de una montura por turnos consiste en prestar un animal a dos personas, de modo que una cabalgue durante algunos días y la otra durante otros, o una recorra un tramo del camino y la otra otro; el nombre proviene de que cada una sigue a la otra por turnos. La mayoría de los juristas permiten ambas formas, respetándose la costumbre donde existe y sorteándose quién empieza si hay discrepancias. Los hanbalíes lo permiten solo cuando se nombra al jinete; los shafiíes, en una opinión más sólida, lo prohíben; los hanafíes y los malikíes lo permiten. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13231} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13232} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13233}"
  fr: "La location d'une monture à tour de rôle consiste à confier une bête à deux personnes, l'une la montant certains jours et l'autre d'autres, ou l'une parcourant une portion de route et l'autre une autre; le terme vient du fait que chacun se succède à tour de rôle. La plupart des juristes admettent les deux formes, la coutume étant respectée lorsqu'elle existe et un tirage au sort étant effectué en cas de désaccord sur l'identité du cavalier. Les hanbalites l'autorisent uniquement si le cavalier est nommé; les chaféites, d'un avis plus rigoureux, l'interdisent; les hanafites et les malikites l'autorisent."
  tr: "Topuklu kiralanması, bir kişinin iki adam için bir bineği günlerce, diğerini günlerce sürmesi ya da yoldan bir mesafe uzaklaşıp diğerini başka bir mesafe için binmesi durumunda verilir. Bu isim, her biri sahibini takip ettiği için verilir. Çoğu hukukçu, her iki durumda da bunu kabul eder, varsa gelenek dikkate alınır ve ilk düzenleme üzerinde anlaşmazlık olduğunda kura atmak geçerlidir. Hanbalilere göre, sadece binicinin belirtilmesiyle geçerlidir, Şafiiler ise yasak hakkında en doğru görüşe sahiptir. Hanafi ve Malikiler bunun izin verildiğini söylemiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13231} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13232}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13233}"
  id: "Rent of heels adalah ketika seseorang menyewa tunggangan untuk dua orang menunggang satu selama berhari-hari dan yang lain selama hari, atau menunggang satu jarak dari jalan dan yang lain untuk jarak lain. Dinamai demikian karena masing-masing mengikuti pemiliknya. Mayoritas ahli hukum mengizinkannya dalam kedua kasus, dengan mempertimbangkan kebiasaan jika ada, dan undian berlaku ketika ada perselisihan mengenai pengaturan awal. Menurut Hanbali, ini hanya berlaku jika menentukan penunggang, sementara Syafi'i memegang pandangan paling benar tentang larangan tersebut. Hanafi dan Malik mengatakan larangan itu diperbolehkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13231} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13232} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13233}"
