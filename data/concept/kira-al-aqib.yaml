id: concept/kira-al-aqib
class: concept
kind: legal
label:
  ar: "كِرَاء الْعَقِب"
  en: "Hire of a mount in turns (kira al-aqib)"
  ur: "کرائے پر سواری نوبت وار (کراء العقب)"
summary:
  ar: "كراء العقب أن يؤجر الإنسان دابة لرجلين ليركب هذا أياماً وذاك أياماً، أو ليركب هذا مسافة من الطريق وذاك مسافة أخرى، وسميت بذلك لأن كلاً منهما يعقب صاحبه. وذهب جمهور الفقهاء إلى جوازه بصورتيه، مع اعتبار العادة إن وجدت، والقرعة عند التنازع في البداءة، ولا يصح عند الحنابلة إلا مع تعيين الراكب، وعند الشافعية في الأصح المنع، وقال الحنفية والمالكية بجوازه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13231} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13232} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13233}"
  en: "Hire of a mount in turns is letting a beast to two people, so that one rides for some days and the other for others, or one rides a stretch of the road and the other a further stretch; the name comes from each following the other in turns. Most jurists allow both forms, with custom followed where it exists and lots drawn if the two dispute who starts. The Hanbalis allow it only when the rider is named; the Shafi'is in the sounder view forbid it; the Hanafis and Malikis allow it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13231} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13232} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13233}"
  ur: "کراء العقب یہ ہے کہ آدمی کوئی جانور دو آدمیوں کو اس طرح کرائے پر دے کہ ایک کچھ دنوں تک سوار ہو اور دوسرا کچھ دنوں تک، یا ایک راستے کا کچھ حصہ سوار ہو اور دوسرا باقی حصہ، اور اسے یہ نام اس لیے دیا گیا کہ ہر ایک دوسرے کی نوبت پر آتا ہے۔ جمہور فقہاء دونوں صورتوں کو جائز کہتے ہیں، عادت کا لحاظ رکھا جائے گا، اور ابتداء پر اختلاف ہو تو قرعہ ڈالا جائے گا۔ حنابلہ اسے صرف سوار کو متعین کر کے جائز کہتے ہیں، شافعیہ کے اصح قول میں یہ ناجائز ہے، اور حنفیہ و مالکیہ جائز کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13231} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13232} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13233}"
