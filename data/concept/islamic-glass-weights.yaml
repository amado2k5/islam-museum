summary:
  ar: "صنج وطوابع زجاجية دقيقة التأريخ صنعت في مصر الإسلامية، تتخذها نادين شيبيل مقياسًا زمنيًا لتركيب الزجاج المصري، وتنقطع نحو مائة سنة بعد سنة 868م ثم تعود بعد الفتح الفاطمي سنة 969م {cite:schibille-islamic-glass-2022 p. 23} {cite:schibille-islamic-glass-2022 p. 57}."
  en: "Precisely dated glass weights and stamps made in Islamic Egypt, which Nadine Schibille uses as a chronological benchmark for Egyptian glass compositions; they break off for about a century after 868 and reappear after the Fatimid conquest in 969 {cite:schibille-islamic-glass-2022 p. 23} {cite:schibille-islamic-glass-2022 p. 57}."
  ur: "اسلامی مصر کے درست تاریخ والے شیشے کے باٹ اور مہریں، جنہیں نادین شیبل مصری شیشے کی ترکیب کا زمانی معیار بناتی ہیں؛ 868ء کے بعد تقریباً سو سال منقطع رہیں اور 969ء کی فاطمی فتح کے بعد لوٹیں {cite:schibille-islamic-glass-2022 p. 57}."
