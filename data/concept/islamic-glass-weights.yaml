label: { ar: "الصنج الزجاجية الإسلامية", en: "Islamic glass weights and stamps (Egypt)", ur: "اسلامی شیشے کے باٹ ⁦(مصر)⁩", es: "Pesas y sellos de vidrio islámicos (Egipto)", fr: "Poids et poinçons en verre islamiques (Égypte)", tr: "İslami Cam Ziller", id: "Simbal Kaca Islam" }
summary:
  ar: "صنج وطوابع زجاجية دقيقة التأريخ صنعت في مصر الإسلامية، تتخذها نادين شيبيل مقياسًا زمنيًا لتركيب الزجاج المصري، وتنقطع نحو مائة سنة بعد سنة 868م ثم تعود بعد الفتح الفاطمي سنة 969م {cite:schibille-islamic-glass-2022 p. 23} {cite:schibille-islamic-glass-2022 p. 57}."
  en: "Precisely dated glass weights and stamps made in Islamic Egypt, which Nadine Schibille uses as a chronological benchmark for Egyptian glass compositions; they break off for about a century after 868 and reappear after the Fatimid conquest in 969 {cite:schibille-islamic-glass-2022 p. 23} {cite:schibille-islamic-glass-2022 p. 57}."
  ur: "اسلامی مصر کے درست تاریخ والے شیشے کے باٹ اور مہریں، جنہیں نادین شیبل مصری شیشے کی ترکیب کا زمانی معیار بناتی ہیں؛ 868ء کے بعد تقریباً سو سال منقطع رہیں اور 969ء کی فاطمی فتح کے بعد لوٹیں {cite:schibille-islamic-glass-2022 p. 57}."
  es: "Pesas y sellos de vidrio con fecha precisa, fabricados en el Egipto islámico, que Nadine Schibille utiliza como referencia cronológica para las composiciones de vidrio egipcio; se interrumpen durante aproximadamente un siglo después de 868 y reaparecen después de la conquista fatimí en 969 {cite:schibille-islamic-glass-2022 p. 23} {cite:schibille-islamic-glass-2022 p. 57}."
  fr: "Poids et poinçons en verre datés avec précision, fabriqués en Égypte islamique, que Nadine Schibille utilise comme repère chronologique pour les compositions de verre égyptiennes; ils disparaissent pendant environ un siècle après 868 et réapparaissent après la conquête fatimide en 969 {cite:schibille-islamic-glass-2022 p. 23} {cite:schibille-islamic-glass-2022 p. 57}."
  tr: "İslam Mısır'ında yapılmış hassas tarihli ziller ve cam damgalar, Nadine Schibel tarafından Mısır cam kompozisyonunun kronolojik ölçüsü olarak kullanılmış, yaklaşık yüz yıl sonra kırılmış, ardından 969 yılında Fatımi fethi sonrası geri getirilmiştir {cite:schibille-islamic-glass-2022 s. 23} {cite:schibille-islamic-glass-2022 s. 57}."
  id: "Simbal dan perangko kaca yang bertanggal tepat yang dibuat di Mesir Islam, yang digunakan oleh Nadine Schibel sebagai ukuran kronologis komposisi kaca Mesir, dipecahkan sekitar seratus tahun setelah 868 M, kemudian dikembalikan setelah penaklukan Fatimiyah pada 969 M {cite:schibille-islamic-glass-2022 hlm. 23} {cite:schibille-islamic-glass-2022 hlm. 57}."
