label:
  ar: "الأحكام"
  en: "Ahkam (rulings and judgments; the five qualifications)"
summary:
  ar: "الأحكام جمع «حكم»، أي القضاء والقرار، وفي الشريعة هي الأحكام التي تصف كل فعل إنساني بالوجوب أو الندب أو الإباحة أو الكراهة أو التحريم، وتُستعمل في معنى أوسع لقواعد أي موضوع {cite:encyclopaedia-of-islam-2 vol. 1 p. 279}."
  en: "Ahkam is the plural of hukm, judgment or decision. In religious law it is the set of rulings that qualify every human act as obligatory, recommended, indifferent, reprehensible or forbidden, and in a wider sense the rules of any subject {cite:encyclopaedia-of-islam-2 vol. 1 p. 279}."
