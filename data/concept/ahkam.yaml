id: concept/ahkam
class: concept
kind: legal
label:
  ar: "الأحكام"
  en: "Ahkam (rulings and judgments; the five qualifications)"
  fr: "Ahkam (règles et jugements ; les cinq qualifications)"
  es: "Ahkam (dictámenes y juicios; las cinco calificaciones)"
summary:
  ar: "الأحكام جمع «حكم»، أي القضاء والقرار، وفي الشريعة هي الأحكام التي تصف كل فعل إنساني بالوجوب أو الندب أو الإباحة أو الكراهة أو التحريم، وتُستعمل في معنى أوسع لقواعد أي موضوع {cite:encyclopaedia-of-islam-2 vol. 1 p. 279}."
  en: "Ahkam is the plural of hukm, judgment or decision. In religious law it is the set of rulings that qualify every human act as obligatory, recommended, indifferent, reprehensible or forbidden, and in a wider sense the rules of any subject {cite:encyclopaedia-of-islam-2 vol. 1 p. 279}."
  fr: "Ahkam est le pluriel de hukm, jugement ou décision. En droit religieux, il désigne l’ensemble des règles qui qualifient chaque acte humain d’obligatoire, recommandé, indifférent, répréhensible ou interdit et, dans un sens plus large, les règles de tout sujet {cite:encyclopaedia-of-islam-2 vol. 1 p. 279}."
  es: "Ahkam es el plural de hukm, juicio o decisión. En la ley religiosa, es el conjunto de normas que califican cada acto humano como obligatorio, recomendable, indiferente, reprobable o prohibido, y en un sentido más amplio, las reglas de cualquier tema {cite:encyclopaedia-of-islam-2 vol. 1 p. 279}."
