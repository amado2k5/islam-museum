summary:
  ar: "جاءت النصرانية إلى بلاد العرب عن طريق احتلال الحبشة والرومان في عرض الرحيق المختوم: دخل التبشير المسيحي اليمن في زمن الاحتلال الحبشي الأول، وتنصّر أهل نجران على يد الزاهد فيميون، ونشرها أبرهة بأوفر نشاط حتى بنى الكعبة اليمانية وأراد صرف حج العرب إليها، واعتنقها الغساسنة وتغلب وطيء وبعض ملوك الحيرة لمجاورة الرومان."
  en: "Christianity came to Arabia through the Abyssinian and Roman occupations in al-Raheeq al-Makhtum's account: Christian missions entered Yemen during the first Abyssinian occupation, Najran was converted by the ascetic Faymiyun, Abraha spread it vigorously and built the Yemeni Kaaba to divert the Arabs' pilgrimage, and the Ghassanids, Taghlib, Tayy and some kings of al-Hira adopted it from their proximity to the Romans."
