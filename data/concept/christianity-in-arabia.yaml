id: concept/christianity-in-arabia
class: concept
kind: belief
label: { ar: "النصرانية في جزيرة العرب قبل الإسلام", en: "Christianity in Arabia before Islam", es: "El cristianismo en Arabia antes del Islam", fr: "Le christianisme en Arabie avant l'islam" }
summary:
  ar: "جاءت النصرانية إلى بلاد العرب عن طريق احتلال الحبشة والرومان في عرض الرحيق المختوم: دخل التبشير المسيحي اليمن في زمن الاحتلال الحبشي الأول، وتنصّر أهل نجران على يد الزاهد فيميون، ونشرها أبرهة بأوفر نشاط حتى بنى الكعبة اليمانية وأراد صرف حج العرب إليها، واعتنقها الغساسنة وتغلب وطيء وبعض ملوك الحيرة لمجاورة الرومان."
  en: "Christianity came to Arabia through the Abyssinian and Roman occupations in al-Raheeq al-Makhtum's account: Christian missions entered Yemen during the first Abyssinian occupation, Najran was converted by the ascetic Faymiyun, Abraha spread it vigorously and built the Yemeni Kaaba to divert the Arabs' pilgrimage, and the Ghassanids, Taghlib, Tayy and some kings of al-Hira adopted it from their proximity to the Romans."
  es: "Según el relato de al-Raheeq al-Makhtum, el cristianismo llegó a Arabia a través de las ocupaciones abisinia y romana: las misiones cristianas entraron en Yemen durante la primera ocupación abisinia, Najrán fue convertido por el asceta Faymiyun, Abraha lo difundió con vigor y construyó la Kaaba yemení para desviar la peregrinación de los árabes, y los gasánidas, Taghlib, Tayy y algunos reyes de al-Hira lo adoptaron debido a su proximidad a los romanos."
  fr: "D'après le récit d'al-Raheeq al-Makhtum, le christianisme est arrivé en Arabie par le biais des occupations abyssinienne et romaine: des missions chrétiennes sont entrées au Yémen lors de la première occupation abyssinienne, Najran a été convertie par l'ascète Faymiyun, Abraha l'a répandu vigoureusement et a construit la Kaaba yéménite pour détourner les pèlerins arabes, et les Ghassanides, Taghlib, Tayy et certains rois d'al-Hira l'ont adopté en raison de leur proximité avec les Romains."
