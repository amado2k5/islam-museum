label: { ar: "من يصلح له الاغتسال بالماء البارد عند ابن سينا", en: "Who may wash in cold water in the Canon", ur: "قانون میں ٹھنڈے پانی سے غسل کس کے لیے موزوں ہے" }
summary:
  ar: "يقول ابن سينا في الفصل السادس إن الاغتسال بالماء البارد إنما يصلح لمن كان تدبيره من كل الوجوه مستقصى وكان سنه وقوته وسحنته وفصله موافقاً، ولم يكن به تخمة ولا قيء ولا إسهال ولا سهر ولا نوازل، ولا هو صبي ولا شيخ، وفي وقت يكون بدنه نشيطاً والحركات مواتية {cite:canon-ibn-sina-print-v1 p.227}."
  en: "In chapter 6 Ibn Sina says washing in cold water suits only someone whose regimen is thorough in every respect, with age, strength, physique and season fitting, and who has no indigestion, vomiting, looseness, sleeplessness or catarrh, who is neither child nor old man, at a time when the body is lively and movements come readily {cite:canon-ibn-sina-print-v1 p.227}."
