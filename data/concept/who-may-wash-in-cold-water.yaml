id: concept/who-may-wash-in-cold-water
class: concept
kind: scientific
label: { ar: "من يصلح له الاغتسال بالماء البارد عند ابن سينا", en: "Who may wash in cold water in the Canon", ur: "قانون میں ٹھنڈے پانی سے غسل کس کے لیے موزوں ہے", es: "¿Quién puede lavarse con agua fría en el Canon?", fr: "Qui peut se laver à l'eau froide dans le Canon" }
summary:
  ar: "يقول ابن سينا في الفصل السادس إن الاغتسال بالماء البارد إنما يصلح لمن كان تدبيره من كل الوجوه مستقصى وكان سنه وقوته وسحنته وفصله موافقاً، ولم يكن به تخمة ولا قيء ولا إسهال ولا سهر ولا نوازل، ولا هو صبي ولا شيخ، وفي وقت يكون بدنه نشيطاً والحركات مواتية {cite:canon-ibn-sina-print-v1 p.227}."
  en: "In chapter 6 Ibn Sina says washing in cold water suits only someone whose regimen is thorough in every respect, with age, strength, physique and season fitting, and who has no indigestion, vomiting, looseness, sleeplessness or catarrh, who is neither child nor old man, at a time when the body is lively and movements come readily {cite:canon-ibn-sina-print-v1 p.227}."
  es: "En el capítulo 6, Ibn Sina dice que lavarse con agua fría solo es adecuado para alguien cuyo régimen sea completo en todos los aspectos, con edad, fuerza, físico y estación apropiados, y que no tenga indigestión, vómitos, diarrea, insomnio o catarro, que no sea ni niño ni anciano, en un momento en que el cuerpo esté activo y los movimientos sean fáciles {cite:canon-ibn-sina-print-v1 p.227}."
  fr: "Au chapitre 6, Ibn Sina dit que se laver à l'eau froide ne convient qu'à une personne dont le régime est rigoureux à tous égards, avec un âge, une force, un physique et une saison appropriés, et qui ne souffre pas d'indigestion, de vomissements, de diarrhée, d'insomnie ou de catarrhe, qui n'est ni un enfant ni un vieillard, à un moment où le corps est vif et les mouvements viennent facilement {cite:canon-ibn-sina-print-v1 p.227}."
  ur: "باب 6 میں ابن سینا کا کہنا ہے کہ ٹھنڈے پانی سے نہانا صرف اس شخص کے لیے موزوں ہے جس کا طریقہ عمر، طاقت، جسم اور موسم کے لحاظ سے ہر لحاظ سے مکمل ہو اور جس کو بدہضمی، قے، ڈھیلے پن، نیند کی کمی یا نزلہ نہ ہو، جو نہ بچہ ہو اور نہ بوڑھا ہو، ایسے وقت میں جب جسم پڑھتا ہے اور حرکت کرتا ہے۔ {حوالہ: کینن ابن سینا پرنٹ v1 صفحہ 227}۔"
