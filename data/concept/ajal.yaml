id: concept/ajal
class: concept
kind: legal
label: { ar: "أجل", en: "Term, deadline (ajal)", fr: "Terme, échéance (ajal)", es: "Plazo, fecha límite (ajal)", ur: "میعاد، آخری تاریخ ⁦(اجل)⁩" }
summary:
  ar: "الأجل في اللغة مدة الشيء ووقته الذي يحل فيه، وهو عند الفقهاء مدة يُعلَّق بها حكم شرعي أو يُتفق عليها في العقد، وينقسم بحسب مصدره إلى شرعي وقضائي واتفاقي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1654} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1658} ومن الآجال الشرعية مدة الحمل ومدة الرضاع ومدة الإيلاء ومدة العنين ومدة الحيض، ومن الاتفاقية خيار الشرط ومدة التأجيل في العقود. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1658} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1662}"
  en: "Ajal is the term of a thing, the time when it falls due. For jurists it is a period on which a legal rule depends or which the parties agree in a contract; by source it is shar'i (fixed by the law), qada'i (fixed by a judge) or ittifaqi (agreed). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1654} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1658} Shar'i terms include the periods of pregnancy, suckling, the vow of abstention, impotence and menstruation; agreed terms include the option of stipulation and deferred payment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1658} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1662}"
  fr: "Ajal désigne le terme fixé pour une chose, le moment où elle échoit. Pour les juristes, il s’agit d’un délai dont dépend une règle de droit ou dont les parties conviennent par contrat. Selon son origine, il est shar‘i (fixé par la loi), qada’i (fixé par un juge) ou ittifaqi (convenu). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1654} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1658} Les délais fixés par la loi concernent notamment la grossesse, l’allaitement, le serment d’abstinence, l’impuissance et les règles. Parmi les délais convenus figurent le délai d’option stipulée et le paiement différé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1658} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1662}"
  es: "Ajal es el plazo de una cosa, el momento en que vence. Para los juristas, es un período del que depende una norma legal o que las partes acuerdan en un contrato; por su origen, puede ser shar'i (fijado por la ley), qada'i (fijado por un juez) o ittifaqi (acordado). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1654} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1658} Los plazos shar'i incluyen los períodos de embarazo, lactancia, el voto de abstinencia, la impotencia y la menstruación; los plazos acordados incluyen la opción de estipulación y el pago diferido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1658} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1662}"
  ur: "اجل کسی چیز کی اصطلاح کو کہتے ہیں، وہ وقت جب وہ گر جائے۔ فقہاء کے نزدیک یہ وہ مدت ہے جس پر کوئی قانونی قاعدہ منحصر ہوتا ہے یا جس پر فریقین معاہدے میں متفق ہوتے ہیں۔ ماخذ کے لحاظ سے یہ شرعی ⁦(قانون کے ذریعہ مقرر)⁩، قضا ⁦(جج کی طرف سے مقرر)⁩ یا اتفاق ⁦(متفقہ)⁩ ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1654} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1658} شرعی اصطلاحات میں حمل، دودھ پلانے، پرہیز کی نذر، نامردی اور حیض شامل ہیں۔ متفقہ شرائط میں شرط اور موخر ادائیگی کا اختیار شامل ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1658}"
