label: { ar: "أجل", en: "Term, deadline (ajal)" }
summary:
  ar: "الأجل في اللغة مدة الشيء ووقته الذي يحل فيه، وهو عند الفقهاء مدة يُعلَّق بها حكم شرعي أو يُتفق عليها في العقد، وينقسم بحسب مصدره إلى شرعي وقضائي واتفاقي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1654} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1658} ومن الآجال الشرعية مدة الحمل ومدة الرضاع ومدة الإيلاء ومدة العنين ومدة الحيض، ومن الاتفاقية خيار الشرط ومدة التأجيل في العقود. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1658} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1662}"
  en: "Ajal is the term of a thing, the time when it falls due. For jurists it is a period on which a legal rule depends or which the parties agree in a contract; by source it is shar'i (fixed by the law), qada'i (fixed by a judge) or ittifaqi (agreed). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1654} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1658} Shar'i terms include the periods of pregnancy, suckling, the vow of abstention, impotence and menstruation; agreed terms include the option of stipulation and deferred payment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1658} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1662}"
