label:
  ar: "جاورس"
  en: "Jawars (millet)"
  ur: "جاورس"
  es: "Jawars (mijo)"
  fr: "Jawars (millet)"
  tr: "Jarvis"
  id: "Jarvis"
summary:
  ar: "نوع من الدخن، يشبه الأرز في قوته لكنه أقل غذاءً منه، وهو خير من الدخن في جميع أحواله إلا أنه أقوى قبضاً. فيه قبض وتجفيف بلا لذع، ويُكمّد به لتسكين الأوجاع، وغذاؤه قليل لزج، وطعامه بطيء في المعدة، ويُقال إن طبخه باللبن أو بنخالة السميذ يجوّد غذاءه {cite:canon-ibn-sina-print-v1 p.430} {cite:canon-ibn-sina-print-v1 p.431}."
  en: "A kind of millet. Like rice in strength but less nourishing; in every state better than dukhn (millet), but more astringent. Astringent and drying without sting; a poultice to ease pains. Its nourishment is small and sticky, and it is slow in the stomach; cooked with milk or with fine bran it is said to improve its nourishment {cite:canon-ibn-sina-print-v1 p.430} {cite:canon-ibn-sina-print-v1 p.431}."
  ur: "ایک قسم کا دخن، جو قوت میں چاول جیسا ہے مگر چاول سے کم غذائی ہے؛ ہر حال میں دخن سے بہتر، مگر زیادہ قابض۔ اس میں قبض اور خشکی بغیر جلن کے ہے؛ درد کم کرنے کے لیے کمپریس کیا جاتا ہے۔ غذا کم اور لیس دار ہے، اور معدے میں دیر سے ہضم ہوتی ہے؛ کہا جاتا ہے کہ دودھ یا میدے کی بھوسی کے ساتھ پکانے سے اس کی غذائیت بہتر ہو جاتی ہے {cite:canon-ibn-sina-print-v1 p.430} {cite:canon-ibn-sina-print-v1 p.431}۔"
  es: "Un tipo de mijo. Similar al arroz en fuerza pero menos nutritivo; en todos los sentidos mejor que el dukhn (mijo), pero más astringente. Astringente y secante sin picar; cataplasma para aliviar dolores. Su valor nutritivo es pequeño y pegajoso, y es lento en el estómago; se dice que cocido con leche o con salvado fino mejora su valor nutritivo {cite:canon-ibn-sina-print-v1 p.430} {cite:canon-ibn-sina-print-v1 p.431}."
  fr: "Une sorte de millet. Aussi nourrissant que le riz, mais moins nutritif; meilleur que le dukhn (millet) à tous égards, mais plus astringent. Astringent et asséchant sans piquer; un cataplasme pour soulager les douleurs. Ses grains sont petits et collants, et il est lent à digérer; cuit avec du lait ou du son fin, on dit qu'il améliore sa valeur nutritive {cite:canon-ibn-sina-print-v1 p.430} {cite:canon-ibn-sina-print-v1 p.431}."
  tr: "Pirinç kadar güçlü ama ondan daha az besleyici olan bir darı türü. Tüm formlarıyla darıdan daha iyidir, ancak tutuş açısından daha güçlüdür. Sokmadan kontraktür ve kurutma özelliğine sahiptir ve ağrıyı hafifletmek için kullanılır. Yiyecekleri hafifçe yapışkandır ve midesinde yavaştır. Süt veya susam kepeği ile pişirmenin beslenmesini artırdığı söylenir {cite:canon-ibn-sina-print-v1 s.430} {cite:canon-ibn-sina-print-v1 s.431}."
  id: "Jenis millet, sekuat nasi tetapi kurang bergizi darinya. Millet lebih baik daripada millet dalam segala bentuknya, kecuali lebih kuat dalam cengkeraman. Millet ini memiliki kontraktur dan pengeringan tanpa sengat, dan digunakan untuk meredakan rasa sakit. Makanannya agak lengket, dan makanannya lambat di lambung. Dikatakan bahwa memasaknya dengan susu atau dedak sesameh meningkatkan nutrisinya {cite:canon-ibn-sina-print-v1 hlm.430} {cite:canon-ibn-sina-print-v1 hlm.431}."
