summary:
  ar: "بناء من طابقين: سبيل لسقي الماء للعامة في الأسفل، وكتّاب لتعليم الصبيان القرآن في الأعلى؛ صار سمة لعمارة الجوامع في القرن الخامس عشر بالقاهرة ثم بناءً مستقلاً {cite:yeomans-islamic-cairo-2006 p.205}."
  en: "A two-storey structure with a public drinking fountain (sabil) below and a Qur'an school for children (kuttab) above, a feature of fifteenth-century Cairene mosques and later a building in its own right {cite:yeomans-islamic-cairo-2006 p.205}."
  es: "Una estructura de dos plantas con una fuente pública de agua potable (sabil) en la planta baja y una escuela coránica para niños (kuttab) en la planta superior, una característica de las mezquitas cairotas del siglo XV y, posteriormente, un edificio por derecho propio {cite:yeomans-islamic-cairo-2006 p.205}."
  fr: "Une structure à deux étages avec une fontaine publique (sabil) en dessous et une école coranique pour enfants (kuttab) au-dessus, une caractéristique des mosquées du Caire du XVe siècle et plus tard un bâtiment à part entière {cite:yeomans-islamic-cairo-2006 p.205}."
  ur: "ایک دو منزلہ ڈھانچہ جس کے نیچے عوامی پینے کا چشمہ ⁦(سبیل)⁩ اور اوپر بچوں کے لیے ایک قرآنی اسکول ⁦(کتاب)⁩، پندرہویں صدی کی کیرین کی مساجد اور بعد میں اپنی جگہ ایک عمارت۔"
  tr: "İki katlı bir bina: aşağıda kamu su çeşmesi ve yukarıda erkekler için Kur'an öğretim kitabı; on beşinci yüzyılda Kahire'de cami mimarisinin bir özelliği haline geldi, ardından bağımsız bir bina oldu {cite:yeomans-Islamic-cairo-2006 s.205}."
  id: "Sebuah bangunan dua lantai: sebuah air mancur umum di bawah, dan buku pengajaran Al-Qur'an untuk anak laki-laki di atas; bangunan ini menjadi ciri khas arsitektur masjid pada abad kelima belas di Kairo, kemudian bangunan independen {cite:yeomans-Islamic-cairo-2006 hlm.205}."
