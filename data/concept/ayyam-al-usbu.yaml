id: concept/ayyam-al-usbu
class: concept
kind: term
label:
  ar: أيام الأسبوع
  en: The days of the week
  ur: ہفتے کے دن
summary:
  ar: "سبعة أيام جعلها الله طور الزمان الأسبوعي؛ خيرها عند الله يوم الجمعة: فيه خلق آدم وفيه أُدخل الجنة وفيه أُخرج منها ولا تقوم الساعة إلا يوم الجمعة، وفيها ساعة الإجابة {cite:sahih-muslim} {cite:jami-al-tirmidhi}."
  en: "The seven days God made the weekly cycle of time; the best of them is Friday: on it Adam was created, admitted to the Garden and taken out of it, the Hour rises only on a Friday, and in it is an hour of answered prayer {cite:sahih-muslim} {cite:jami-al-tirmidhi}."
  ur: "وہ سات دن جو اللہ نے ہفتہ وار زمانہ بنائے؛ ان میں سب سے افضل جمعہ ہے: اسی دن آدم پیدا ہوئے، جنت میں داخل ہوئے اور نکالے گئے، قیامت صرف جمعہ کو قائم ہوگی اور اس میں قبولیت کی ایک گھڑی ہے {cite:sahih-muslim} {cite:jami-al-tirmidhi}۔"
