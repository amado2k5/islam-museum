id: concept/ayyam-al-usbu
class: concept
kind: term
label:
  ar: أيام الأسبوع
  en: The days of the week
  fr: "Les jours de la semaine"
  ur: ہفتے کے دن
  es: "Los días de la semana"
  tr: "Hafta içi"
  id: "Hari kerja"
summary:
  ar: "سبعة أيام جعلها الله طور الزمان الأسبوعي؛ خيرها عند الله يوم الجمعة: فيه خلق آدم وفيه أُدخل الجنة وفيه أُخرج منها ولا تقوم الساعة إلا يوم الجمعة، وفيها ساعة الإجابة {cite:sahih-muslim} {cite:jami-al-tirmidhi}."
  en: "The seven days God made the weekly cycle of time; the best of them is Friday: on it Adam was created, admitted to the Garden and taken out of it, the Hour rises only on a Friday, and in it is an hour of answered prayer {cite:sahih-muslim} {cite:jami-al-tirmidhi}."
  fr: "Les sept jours dont Dieu a fait le cycle hebdomadaire du temps ; le meilleur est le vendredi : Adam y fut créé, admis au Jardin puis en sortit ; l’Heure ne survient qu’un vendredi, qui comprend un moment où les prières sont exaucées {cite:sahih-muslim} {cite:jami-al-tirmidhi}."
  ur: "وہ سات دن جو اللہ نے ہفتہ وار زمانہ بنائے؛ ان میں سب سے افضل جمعہ ہے: اسی دن آدم پیدا ہوئے، جنت میں داخل ہوئے اور نکالے گئے، قیامت صرف جمعہ کو قائم ہوگی اور اس میں قبولیت کی ایک گھڑی ہے {cite:sahih-muslim} {cite:jami-al-tirmidhi}۔"
  es: "Dios creó los siete días del ciclo semanal del tiempo; el mejor de ellos es el viernes: en él fue creado Adán, admitido en el Jardín y sacado de él, la Hora solo llega un viernes, y en ella hay una hora de oración respondida {cite:sahih-muslim} {cite:jami-al-tirmidhi}."
  tr: "Allah'ın haftalık dönem olarak yaptığı yedi gündür; bunların en iyisi Cuma günüdür: Adem o gün yaratılmıştır, o günde cennete girmiştir ve orada kovulmuştur. Saat ancak Cuma günü belirlenir ve o gün Cevabın Saatidir {atıf:sahih-müslim} {cite:jami-al-tirmidhi}."
  id: "Tujuh hari yang Allah tetapkan sebagai periode mingguan; yang terbaik bersama Allah adalah hari Jumat: pada hari itu Adam diciptakan, dan di dalamnya Dia menerima Surga, dan di dalamnya Dia diusir. Jam hanya ditetapkan pada hari Jumat, dan pada Jam itu adalah Jam Respon {cite:sahih-muslim} {cite:jami-al-tirmidhi}."
