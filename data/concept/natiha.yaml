id: concept/natiha
class: concept
kind: legal
label: { ar: "النَّطِيحَة", en: "Natiha (gored animal)", ur: "نطیحہ (سینگ سے مرا ہوا جانور)" }
summary:
  ar: "النطيحة الشاة أو الحيوان الذي أصابه غيره بقرنه فمات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15761} وهي من الميتة، وكل نطيحة ميتة ولا عكس، وتشترك مع المنخنقة والموقوذة والمتردية في أنها ميتة بغير ذكاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15761} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15762} وهي نجسة يحرم أكلها بنص الآية في سورة المائدة، ويستثنى منها ما أدرك وفيه حياة مستقرة وذكي ذكاة شرعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15762}"
  en: "Natiha is an animal gored to death by another's horns; a gored animal is carrion, and every gored animal is carrion but not the reverse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15761} It shares with the strangled, struck and fallen animals the status of carrion dead without lawful slaughter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15761} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15762} It is unclean and its eating is forbidden by the verse of the Ma'ida surah, except what is reached with a settled life and lawfully slaughtered. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15762}"
  ur: "نطیحہ وہ جانور ہے جو کسی دوسرے جانور کے سینگ سے مر گیا ہو۔ ہر نطیحہ مردار ہے مگر ہر مردار نطیحہ نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15761} یہ منخنقہ، موقوذہ اور متردیہ کی طرح بغیر ذبح کے مرنے کی وجہ سے مردار ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15761} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15762} سورہ مائدہ کی آیت کے مطابق اس کا کھانا حرام ہے، سوائے اس کے جو زندہ مل جائے، جس میں زندگی مستقر ہو اور شرعی طریقے سے ذبح کیا جائے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15762}"
