label: { ar: "التشيع في الشام وجبل عامل", en: "Shi'ism in Syria and Jabal Amil", es: "El chiismo en Siria y Jabal Amil", fr: "Le chiisme en Syrie et Jabal Amil" }
summary:
  ar: "يناقش شكيب أرسلان مع أحمد رضا، ومع فضلاء تبريز، مسألة أقدم التشيع: أفي الشام أم في العجم؟ يعرض رواية أن أبا ذر الغفاري كان على موالاة علي، وأنه أنكر على معاوية جمع المال، ويرى أن هذه الرواية تكفي لإثبات تشيّع مبكر في الشام لكنها لا تكفي لوحدها ولا يجعلها أصلاً لجبل عامل. ويذكر أن شيعة جبل عامل كانوا يتقيّدون بالتقية في العصور المتأخرة، وأن كثيراً من المؤرخين لم ينسبوا علماءهم إلى التشيع إلا مضطرين. ويصف مؤتمر بيت المقدس الإسلامي بأن أعضاءه صلّوا خلف مجتهد شيعي. يعرض هذا كله بوصف المؤلف لنقاشه، ولا يصح عدّه تحكيماً في مسألة تاريخية مختلف فيها."
  en: "Arslan debates whether Shi'ism is older in Syria or in Persia. He reads the Abu Dhar al-Ghifari traditions as evidence of early pro-Ali sentiment in Syria, but does not treat them as enough to explain the origin of Shi'ism in Jabal Amil. He notes that Shi'a there practised taqiyya for long periods, and that many historians named their scholars as Shi'a only reluctantly. He also records that the Jerusalem Islamic Congress was led in prayer by a Shi'i mujtahid. This is his debate with other writers, not a settled historical verdict."
  es: "Arslan debate si el chiismo es más antiguo en Siria o en Persia. Interpreta las tradiciones de Abu Dhar al-Ghifari como evidencia de un sentimiento pro-Ali temprano en Siria, pero no las considera suficientes para explicar el origen del chiismo en Jabal Amil. Señala que los chiíes de esa región practicaron la taqiyya durante largos períodos y que muchos historiadores solo identificaron a sus eruditos como chiíes con reticencia. También registra que el Congreso Islámico de Jerusalén fue dirigido en oración por un muytahid chií. Este es su debate con otros autores, no un veredicto histórico definitivo."
  fr: "Arslan s'interroge sur l'ancienneté du chiisme en Syrie ou en Perse. Il interprète les traditions d'Abu Dhar al-Ghifari comme une preuve d'un sentiment pro-Ali précoce en Syrie, mais ne les considère pas comme suffisantes pour expliquer l'origine du chiisme à Jabal Amil. Il note que les chiites de cette région ont pratiqué la taqiyya pendant de longues périodes et que de nombreux historiens n'ont qualifié leurs érudits de chiites qu'à contrecœur. Il rapporte également que le Congrès islamique de Jérusalem a été dirigé dans la prière par un mujtahid chiite. Il s'agit là d'un débat qu'il entretient avec d'autres auteurs, et non d'une conclusion historique définitive."
