label: { ar: "التشيع في الشام وجبل عامل", en: "Shi'ism in Syria and Jabal Amil" }
summary:
  ar: "يناقش شكيب أرسلان مع أحمد رضا، ومع فضلاء تبريز، مسألة أقدم التشيع: أفي الشام أم في العجم؟ يعرض رواية أن أبا ذر الغفاري كان على موالاة علي، وأنه أنكر على معاوية جمع المال، ويرى أن هذه الرواية تكفي لإثبات تشيّع مبكر في الشام لكنها لا تكفي لوحدها ولا يجعلها أصلاً لجبل عامل. ويذكر أن شيعة جبل عامل كانوا يتقيّدون بالتقية في العصور المتأخرة، وأن كثيراً من المؤرخين لم ينسبوا علماءهم إلى التشيع إلا مضطرين. ويصف مؤتمر بيت المقدس الإسلامي بأن أعضاءه صلّوا خلف مجتهد شيعي. يعرض هذا كله بوصف المؤلف لنقاشه، ولا يصح عدّه تحكيماً في مسألة تاريخية مختلف فيها."
  en: "Arslan debates whether Shi'ism is older in Syria or in Persia. He reads the Abu Dhar al-Ghifari traditions as evidence of early pro-Ali sentiment in Syria, but does not treat them as enough to explain the origin of Shi'ism in Jabal Amil. He notes that Shi'a there practised taqiyya for long periods, and that many historians named their scholars as Shi'a only reluctantly. He also records that the Jerusalem Islamic Congress was led in prayer by a Shi'i mujtahid. This is his debate with other writers, not a settled historical verdict."
