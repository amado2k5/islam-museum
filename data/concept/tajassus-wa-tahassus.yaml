id: concept/tajassus-wa-tahassus
class: concept
kind: legal
label:
  ar: "التحسس والتجسس"
  en: "Checking and spying (tahassus and tajassus)"
  ur: "تحسس اور تجسس"
summary:
  ar: "يفرّق الشيخ عمر عبد الكافي بين التحسس، وهو التثبت من الأمر بالحواس، والتجسس، وهو الدخول في شؤون الناس، ويقول إن التجسس حرام. ويروي قصة عمر مع القوم الذين وجدهم يشربون الخمر، وهي رواية مشوشة في التسجيل."
  en: "Sheikh Omar Abdelkafy distinguishes tahassus, checking a matter with one's senses, from tajassus, entering into people's affairs, which he says is forbidden. He narrates Umar's encounter with men drinking wine, a narration that is partly garbled in the recording."
  ur: "شیخ عمر عبدالکافی تحسس، یعنی حواس سے کسی معاملے کی تحقیق، اور تجسس، یعنی لوگوں کے معاملات میں داخل ہونا، کے درمیان فرق کرتے ہیں، اور کہتے ہیں کہ تجسس حرام ہے۔ وہ عمر کا شراب پینے والے لوگوں سے سامنا بیان کرتے ہیں، اور یہ روایت ریکارڈنگ میں جزوی طور پر مشوش ہے۔"
