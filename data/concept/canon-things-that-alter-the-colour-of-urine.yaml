id: concept/canon-things-that-alter-the-colour-of-urine
class: concept
kind: scientific
label: { ar: "ما يغير لون البول عند ابن سينا", en: "What alters the colour of urine in the Canon", ur: "پیشاب کا رنگ بدلنے والی چیزیں قانون میں", es: "¿Qué altera el color de la orina en el Canon?", fr: "Qu'est-ce qui modifie la couleur de l'urine dans le Canon ?", tr: "İbn Sina'ya göre idrarın rengini değiştirmez.", id: "Menurut Ibn Sina, warna urin tidak berubah." }
summary:
  ar: "يحصي ابن سينا ما يصبغ البول من المآكل والمشارب ومن أحوال خارجة عن المجرى الطبيعي كالصوم والسهر والتعب والغضب والجماع والقيء، فلا يوثق بالبول في وجودها {cite:canon-ibn-sina-print-v1 p.183}."
  en: "Ibn Sina lists foods and drinks that dye the urine and states outside the natural course such as fasting, sleeplessness, fatigue, anger, intercourse and vomiting, so that urine is not to be trusted when they are present {cite:canon-ibn-sina-print-v1 p.183}."
  es: "Ibn Sina enumera alimentos y bebidas que tiñen la orina y señala causas ajenas al curso natural, como el ayuno, la falta de sueño, la fatiga, la ira, las relaciones sexuales y el vómito, por lo que no se debe confiar en la orina cuando están presentes {cite:canon-ibn-sina-print-v1 p.183}."
  fr: "Ibn Sina énumère les aliments et les boissons qui colorent l'urine et cite des éléments hors du cours naturel tels que le jeûne, l'insomnie, la fatigue, la colère, les rapports sexuels et les vomissements, de sorte que l'urine ne doit pas être considérée comme fiable lorsqu'ils sont présents {cite:canon-ibn-sina-print-v1 p.183}."
  ur: "ابن سینا نے پیشاب کو رنگنے والے کھانے اور مشروبات کی فہرست دی ہے اور فطری طریقہ سے باہر بیان کیا ہے جیسے کہ روزہ، بے خوابی، تھکاوٹ، غصہ، جماع اور قے، تاکہ پیشاب کے موجود ہونے پر ان پر بھروسہ نہ کیا جائے۔"
  tr: "İbn Sina, idrarı yiyecek, içecek ve doğal seyir dışındaki durumlar açısından sayar; örneğin oruç, geç saatlere kadar uyanık kalma, yorgunluk, öfke, cinsel ilişki ve kusma. İdrarın varlığını ona bağlamaz {cite:canon-ibn-sina-print-v1 s.183}."
  id: "Ibn Sina menyebutkan apa yang mewarnai urin dalam hal makanan, minuman, dan keadaan di luar jalur alami seperti puasa, begadang larut, kelelahan, kemarahan, hubungan seksual, dan muntah. Ia tidak mengandalkan urin untuk kehadirannya {cite:canon-ibn-sina-print-v1 hlm.183}."
