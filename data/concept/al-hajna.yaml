id: concept/al-hajna
class: concept
kind: social
label:
  ar: الهجنة
  en: Al-hajna — the stigma of mixed lineage
summary:
  ar: "الهجنة عند العرب وصم اجتماعي: قال في لسان العرب الهجنة من الكلام ما يعيبك، والهجين العربي ابن الأمة لأنه معيب، وذكر ابن عبد ربه أن بني أمية لم يكونوا يستخلفون بني الإماء وقالوا لا تصلح لهم العرب، وعلله الأصمعي بنحوٍ نجومي — أنهم كانوا يرون زوال ملكهم على يد ابن أم ولد — بينما يميل أحمد أمين إلى تعليل الناس بالاستهانة بهم، ويحكى أن أعرابياً سأل سوار القاضي عن ميراثه وأخيه وهجين لهما فأجاب أن المال بينهم سواء فغضب الأعرابي لمساواة الهجين به، كما لاقى خالد بن عبد الله القسري هجو الشعراء لأن أمه كانت أمة رومية."
  en: "Al-hajna, the Arab stigma of impure lineage: Lisan al-Arab defines it as speech that disgraces you, the hajin being an Arab son of a slave-mother — 'for he is marked'. Ibn Abd Rabbih reports the Umayyads would not appoint the sons of slave-mothers, saying the Arabs do not fit them; al-Asma'i explained it astrologically — they saw their rule ending at a slave-mother's son's hands — but Ahmad Amin favours the popular explanation of sheer disdain. A Bedouin asking the qadi Suwar about his inheritance grew furious when told the hajin shared equally; Khalid al-Qasri, governor of Iraq, was lampooned because his mother was a Greek slave."
