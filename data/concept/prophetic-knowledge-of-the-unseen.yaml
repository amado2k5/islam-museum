id: concept/prophetic-knowledge-of-the-unseen
class: concept
kind: belief
label: { ar: "علم النبي بالأخبار السابقة", en: "The Prophet's knowledge of earlier news", ur: "نبی کا سابقہ واقعات کا علم" }
summary:
  ar: "يرى الشعراوي أن علم النبي بأخبار الرسل السابقين، مع أنه لم يقرأ ولم يكتب ولم يجلس إلى معلم، دليل على أنه يتلقى الوحي، وأن الآيات التي تنفي حضوره لتلك الأحداث تنقل الخبر إلى مرتبة المشاهدة {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1066} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1067} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1068}."
  en: "Sha'rawi holds that the Prophet's knowledge of earlier messengers' news, though he could not read or write and sat with no teacher, is evidence that he received revelation. The verses that deny his presence at those events present the news as if witnessed {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1066} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1067} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1068}."
  ur: "شعراوی کے نزدیک نبی کا سابقہ رسولوں کی خبروں کا علم، جبکہ وہ نہ پڑھنا جانتے تھے، نہ لکھنا، اور نہ کسی استاد کے پاس بیٹھے، اس بات کی دلیل ہے کہ وہ وحی پاتے تھے۔ جن آیات میں ان کی موجودگی کی نفی ہے وہ خبر کو مشاہدے کے درجے میں رکھتی ہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1066} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1067} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1068}۔"
