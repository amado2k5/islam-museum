summary:
  ar: "النبق في الكتاب شجرة عظيمة شائكة ثمرها كالبندق أحمر يؤكل طيب الطعم، وأجزاء شجرته مجففة ملطفة قابضة، وخاصة سويقه، ويمنع تساقط الشعر، وينفع من قروح الأمعاء والإسهال، ويذكر له نقلاً موسوماً في الحيض وسيلان الرحم {cite:canon-ibn-sina-print-v1 p.582}."
  en: "Nabq is in the book a great thorny tree whose fruit is like the hazelnut, red, eaten and pleasant in taste; all parts of the tree are drying, thinning and astringent, its meal especially; it stops the falling of hair and helps ulcers of the intestines and diarrhoea, and the book gives a labelled listing on menses and womb flow {cite:canon-ibn-sina-print-v1 p.582}."
  ur: "نبق کتاب میں ایک بڑا کانٹے دار درخت ہے جس کا پھل بندق جیسا، سرخ، کھایا جاتا اور خوش ذائقہ ہے؛ اس کے درخت کے سب اجزا خشک کرنے، لطیف کرنے اور قبض کرنے والے ہیں، خاص طور پر اس کا ستو؛ بالوں کا گرنا روکتا ہے، آنتوں کے زخموں اور اسہال میں مفید ہے، اور کتاب حیض اور رحم کے بہاؤ کے بارے میں اس کی ایک موسوم نقل دیتی ہے {cite:canon-ibn-sina-print-v1 p.582}۔"
  es: "En el libro, Nabq es un gran árbol espinoso cuyo fruto es como la avellana, rojo, comestible y de sabor agradable; todas las partes del árbol son secantes, adelgazantes y astringentes, especialmente su harina; detiene la caída del cabello y ayuda con las úlceras intestinales y la diarrea, y el libro ofrece una lista etiquetada sobre la menstruación y el flujo uterino {cite:canon-ibn-sina-print-v1 p.582}."
  fr: "Nabq est décrit dans le livre comme un grand arbre épineux dont le fruit ressemble à la noisette, rouge, comestible et agréable au goût; toutes les parties de l'arbre sont asséchantes, amincissantes et astringentes, sa farine en particulier; il arrête la chute des cheveux et aide les ulcères des intestins et la diarrhée, et le livre donne une liste légendée sur les menstruations et le flux utérin {cite:canon-ibn-sina-print-v1 p.582}."
  tr: "Kitapta jujube, meyvesi kırmızı fındık gibi olan, yenilebilir ve lezzetli büyük dikenli bir ağaçtır. Parçaları kuru, yatıştırıcı ve özellikle sürgülü türden türden bir yapıya sahiptir. Saç dökülmesini önler, bağırsak ülserleri ve ishal için faydalıdır ve 'Menstruasyon ve Rahim Kanaması' başlıklı bir raporda bahsedilir {cite:canon-ibn-sina-print-v1 s.582}."
  id: "Dalam buku ini, jujube adalah pohon berduri besar yang buahnya menyerupai kacang hazel merah, dapat dimakan dan lezat. Bagian-bagiannya kering, menenangkan, dan astringen, terutama tunasnya. Jujube mencegah kerontokan rambut, bermanfaat untuk tukak lambung dan diare, dan disebutkan dalam laporan berjudul 'Menstruation and Uterine Bleeding' {cite:canon-ibn-sina-print-v1 hlm.582}."
