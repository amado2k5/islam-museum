summary:
  ar: "النبق في الكتاب شجرة عظيمة شائكة ثمرها كالبندق أحمر يؤكل طيب الطعم، وأجزاء شجرته مجففة ملطفة قابضة، وخاصة سويقه، ويمنع تساقط الشعر، وينفع من قروح الأمعاء والإسهال، ويذكر له نقلاً موسوماً في الحيض وسيلان الرحم {cite:canon-ibn-sina-print-v1 p.582}."
  en: "Nabq is in the book a great thorny tree whose fruit is like the hazelnut, red, eaten and pleasant in taste; all parts of the tree are drying, thinning and astringent, its meal especially; it stops the falling of hair and helps ulcers of the intestines and diarrhoea, and the book gives a labelled listing on menses and womb flow {cite:canon-ibn-sina-print-v1 p.582}."
  ur: "نبق کتاب میں ایک بڑا کانٹے دار درخت ہے جس کا پھل بندق جیسا، سرخ، کھایا جاتا اور خوش ذائقہ ہے؛ اس کے درخت کے سب اجزا خشک کرنے، لطیف کرنے اور قبض کرنے والے ہیں، خاص طور پر اس کا ستو؛ بالوں کا گرنا روکتا ہے، آنتوں کے زخموں اور اسہال میں مفید ہے، اور کتاب حیض اور رحم کے بہاؤ کے بارے میں اس کی ایک موسوم نقل دیتی ہے {cite:canon-ibn-sina-print-v1 p.582}۔"
