summary:
  ar: "القصب في الكتاب أنواع كثيرة منها المصمت والأنثى وما يكتب به وما ينبت على شواطئ الأنهار، شديد التبريد ورماده حار، يجذب الشوك والشظايا من عمق اللحم ضمادا، وينفع من داء الثعلب والجمرة والأورام الحارة ولدغ العقرب، ويدر البول {cite:canon-ibn-sina-print-v1 p.644}"
  en: "Qasab is in the book of many kinds, the solid, the female, the one written with and the one that grows on river banks; very cooling, its ash hot, it draws thorns and splinters from deep in the flesh as a poultice and benefits alopecia, the carbuncle, hot swellings and the sting of the scorpion, and induces urine {cite:canon-ibn-sina-print-v1 p.644}"
  ur: "قصب کتاب میں بہت سی قسموں کا ہے، ٹھوس، مادہ، لکھنے کے کام کا اور دریاؤں کے کناروں پر اگنے والا؛ نہایت ٹھنڈا اور اس کی راکھ گرم، ضماد کے طور پر گوشت کی گہرائی سے کانٹے اور ریزے کھینچتا ہے، اور گنج، جمرہ، گرم ورموں اور بچھو کے ڈنک میں نافع ہے، اور پیشاب لاتا ہے {cite:canon-ibn-sina-print-v1 p.644}۔"
