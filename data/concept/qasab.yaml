summary:
  ar: "القصب في الكتاب أنواع كثيرة منها المصمت والأنثى وما يكتب به وما ينبت على شواطئ الأنهار، شديد التبريد ورماده حار، يجذب الشوك والشظايا من عمق اللحم ضمادا، وينفع من داء الثعلب والجمرة والأورام الحارة ولدغ العقرب، ويدر البول {cite:canon-ibn-sina-print-v1 p.644}"
  en: "Qasab is in the book of many kinds, the solid, the female, the one written with and the one that grows on river banks; very cooling, its ash hot, it draws thorns and splinters from deep in the flesh as a poultice and benefits alopecia, the carbuncle, hot swellings and the sting of the scorpion, and induces urine {cite:canon-ibn-sina-print-v1 p.644}"
  ur: "قصب کتاب میں بہت سی قسموں کا ہے، ٹھوس، مادہ، لکھنے کے کام کا اور دریاؤں کے کناروں پر اگنے والا؛ نہایت ٹھنڈا اور اس کی راکھ گرم، ضماد کے طور پر گوشت کی گہرائی سے کانٹے اور ریزے کھینچتا ہے، اور گنج، جمرہ، گرم ورموں اور بچھو کے ڈنک میں نافع ہے، اور پیشاب لاتا ہے {cite:canon-ibn-sina-print-v1 p.644}۔"
  es: "En el libro se menciona que el Qasab es de muchas clases: sólido, femenino, escrito con y que crece en las riberas de los ríos; muy refrescante, su ceniza caliente, extrae espinas y astillas de lo profundo de la carne como un cataplasma y beneficia la alopecia, el carbunco, las hinchazones calientes y la picadura del escorpión, e induce la micción {cite:canon-ibn-sina-print-v1 p.644}"
  fr: "Le qasab se présente sous de nombreuses formes: solide, féminin, écrit avec et poussant sur les rives des fleuves; très rafraîchissant, sa cendre est chaude; appliqué en cataplasme, il extrait les épines et les échardes profondément enfouies dans la chair et soulage l'alopécie, les anthrax, les gonflements chauds et les piqûres de scorpion; il favorise également la diurèse. {cite:canon-ibn-sina-print-v1 p.644}"
  tr: "Kitaptaki sazlar birçok çeşide sahiptir; katı ve dişi olanlar, onlarla yazılanlar ve nehir kıyılarında yetişenler dahil. Çok soğuktur ve sıcak külü vardır. Etin derinliklerinden diken ve parçaları merhem olarak çeker, tilki hastalığı, şarbon, sıcak tümörler, akrep sokmaları için faydalıdır ve idrar söktürücüleri tetikler {cite:canon-ibn-sina-print-v1 s.644}"
  id: "Buluh dalam buku ini hadir dalam berbagai jenis, termasuk yang padat dan betina serta apa yang tertulis dengannya, dan apa yang tumbuh di tepi sungai. Tanaman ini sangat dingin dan memiliki abu panas. Ia menarik duri dan serpihan dari dalam daging sebagai poultice, berguna untuk penyakit rubah, antraks, tumor panas, sengatan kalajengking, dan memicu diuretik {cite:canon-ibn-sina-print-v1 hlm.644}"
