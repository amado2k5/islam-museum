id: concept/iqtidaa
class: concept
kind: legal
label: { ar: "اقتضاء", en: "Iqtida' (implication, demand and claim of a right)", es: "Iqtida' (implicación, demanda y reclamación de un derecho)", fr: "Iqtida' (implication, demande et revendication d'un droit)", ur: "اقتداء ⁦(حق کا مطلب، مطالبہ اور دعویٰ)⁩" }
summary:
  ar: "الاقتضاء لغة طلب الحق وأخذه، ويستعمله الأصوليون بمعنى الدلالة، ومنه دلالة الاقتضاء وهي تقدير محذوف يتوقف عليه صحة الكلام أو صدقه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3180} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3181} ومثاله قول القائل: أعتق عبدك عني بألف، إذ لا يصح العتق إلا بعد الملك، فيقدّر: بعني عبدك بكذا. ومثاله في صدق المتكلم حديث رفع الخطأ والنسيان، فيُقدّر نفي حكم الفعل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3181} ويطلق الفقهاء الاقتضاء بمعناه اللغوي، فيكون أداء الحق قضاء، ويصح إطلاق القضاء على الأداء حقيقة لغوية، وإن اختص عرفا بتسليم المثل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3181} والشائع عند الفقهاء في أخذ الحق لفظ الاستيفاء، والاقتضاء بمعنى طلب قضاء الحق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3182} ويأتي اقتضاء الأمر بمعنى طلب الفعل أو الترك، فإن كان جازما فهو الإيجاب أو التحريم، وإن لم يكن جازما فهو الندب أو الكراهة، والتخيير قسيمه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3182}"
  en: "In the language, iqtida' means demanding a right and taking it in full. The usul scholars use it for implication (dalala). Implication is an unspoken element that a speech needs in order to be correct or true. For example, the words 'free your slave on my behalf for a thousand' cannot be valid unless the speaker is first taken to have asked for the sale of the slave, so the sale is implied. For the truth of the speaker, the hadith that lifts error and forgetting from the community requires the implied removal of the ruling for the act. In the jurists' usage, performing an obligation is called qada'; the word can cover both performing the obligation itself and delivering a like thing, and an executor who knows of a debt on the deceased and pays it does not sin. The common term in the jurists' usage for taking a right is istifa', while iqtida' means demanding that a right be fulfilled, as in the hadith of the generous seller and buyer. In usul, the demand of an act or of its omission is either obligatory or prohibited when definite, and recommended or disliked when not, while choice is its counterpart. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3180} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3181} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3182}"
  es: "En el idioma, iqtida' significa exigir un derecho y tomarlo en su totalidad. Los eruditos usul lo usan para implicación (dalala). La implicación es un elemento tácito que un discurso necesita para ser correcto o verdadero. Por ejemplo, las palabras \"libera a tu esclavo en mi nombre por mil\" no pueden ser válidas a menos que se considere que el hablante primero pidió la venta del esclavo, por lo que la venta está implícita. Para la veracidad del hablante, el hadiz que elimina el error y el olvido de la comunidad requiere la eliminación implícita de la norma para el acto. En el uso de los juristas, cumplir una obligación se llama qada'; la palabra puede abarcar tanto el cumplimiento de la obligación en sí como la entrega de algo similar, y un albacea que conoce una deuda del difunto y la paga no peca. El término común en el uso de los juristas para tomar un derecho es istifa', mientras que iqtida' significa exigir que se cumpla un derecho, como en el hadiz del vendedor y comprador generosos. En usul, la exigencia de un acto o de su omisión es obligatoria o prohibida cuando es definitiva, y recomendada o desagradada cuando no, mientras que la elección es su contraparte. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3180} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3181} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3182}"
  fr: "En langue hébraïque, « iqtida' » signifie exiger un droit et l'exercer pleinement. Les savants du droit coutumier l'emploient pour l'implication (dalala). L'implication est un élément non verbal nécessaire à la justesse ou à la véracité d'un discours. Par exemple, les paroles « affranchis ton esclave pour mille » ne sont valides que si l'on considère que le locuteur a préalablement demandé la vente de l'esclave; la vente est donc sous-entendue. Pour que le locuteur soit véridique, le hadith qui dissipe l'erreur et l'oubli de la communauté requiert la levée implicite de la règle relative à l'acte. Dans l'usage juriste, l'accomplissement d'une obligation est appelé « qada' »; ce terme peut désigner aussi bien l'accomplissement de l'obligation elle-même que la remise d'une contrepartie. Un exécuteur testamentaire qui a connaissance d'une dette du défunt et la règle ne commet pas de péché. Le terme courant chez les juristes pour désigner l'exercice d'un droit est « istifa' », tandis que « iqtida' » signifie exiger qu'un droit soit exercé, comme dans le hadith du vendeur et de l'acheteur généreux. En usul, l'exigence d'un acte ou de son omission est soit obligatoire, soit interdite lorsqu'elle est définie, et recommandée ou détestée lorsqu'elle ne l'est pas, tandis que le choix en est la contrepartie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3180} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3181} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3182}"
  ur: "زبان میں اقتداء کا مطلب حق مانگنا اور اسے پورا لینا ہے۔ اہل علم اسے تقلید ⁦(دلالہ)⁩ کے لیے استعمال کرتے ہیں۔ مضمرات ایک غیر بیان شدہ عنصر ہے جس کی درست یا درست ہونے کے لیے تقریر کی ضرورت ہوتی ہے۔ مثال کے طور پر، 'میری طرف سے ایک ہزار کے لیے اپنے غلام کو آزاد کرو' کے الفاظ درست نہیں ہو سکتے جب تک کہ بولنے والے سے پہلے یہ نہ لیا جائے کہ غلام کی فروخت کا مطالبہ کیا گیا ہے، اس لیے فروخت پر دلالت کرتا ہے۔ کہنے والے کی سچائی کے لیے، وہ حدیث جو برادری سے غلطی اور فراموش کو دور کرتی ہے، اس فعل کے حکم کو مٹانے کا تقاضا کرتی ہے۔ فقہاء کے استعمال میں فرض کو قضا کہتے ہیں۔ یہ لفظ خود فرض ادا کرنے اور اس جیسی چیز کو پہنچانے دونوں کا احاطہ کر سکتا ہے، اور وہ عمل کرنے والا جو میت پر قرض کا علم رکھتا ہو اور اسے ادا کرتا ہو گناہ نہیں کرتا۔ فقہاء کے ہاں حق لینے کے لیے استعمال ہونے والی عام اصطلاح استفہاء ہے، جب کہ اقتداء کا مطلب ہے کسی حق کو پورا کرنے کا مطالبہ، جیسا کہ سخی بیچنے والے اور خریدار کی حدیث میں ہے۔ اصول میں، کسی فعل کا مطالبہ یا اس کی چھوٹ یا تو واجب ہے یا جب قطعی ہو تو ممنوع، اور نہ ہونے پر مستحب یا ناپسندیدہ، جبکہ انتخاب اس کا ہمنوا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3180} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3181}"
