id: concept/iqtidaa
class: concept
kind: legal
label: { ar: "اقتضاء", en: "Iqtida' (implication, demand and claim of a right)" }
summary:
  ar: "الاقتضاء لغة طلب الحق وأخذه، ويستعمله الأصوليون بمعنى الدلالة، ومنه دلالة الاقتضاء وهي تقدير محذوف يتوقف عليه صحة الكلام أو صدقه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3180} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3181} ومثاله قول القائل: أعتق عبدك عني بألف، إذ لا يصح العتق إلا بعد الملك، فيقدّر: بعني عبدك بكذا. ومثاله في صدق المتكلم حديث رفع الخطأ والنسيان، فيُقدّر نفي حكم الفعل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3181} ويطلق الفقهاء الاقتضاء بمعناه اللغوي، فيكون أداء الحق قضاء، ويصح إطلاق القضاء على الأداء حقيقة لغوية، وإن اختص عرفا بتسليم المثل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3181} والشائع عند الفقهاء في أخذ الحق لفظ الاستيفاء، والاقتضاء بمعنى طلب قضاء الحق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3182} ويأتي اقتضاء الأمر بمعنى طلب الفعل أو الترك، فإن كان جازما فهو الإيجاب أو التحريم، وإن لم يكن جازما فهو الندب أو الكراهة، والتخيير قسيمه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3182}"
  en: "In the language, iqtida' means demanding a right and taking it in full. The usul scholars use it for implication (dalala). Implication is an unspoken element that a speech needs in order to be correct or true. For example, the words 'free your slave on my behalf for a thousand' cannot be valid unless the speaker is first taken to have asked for the sale of the slave, so the sale is implied. For the truth of the speaker, the hadith that lifts error and forgetting from the community requires the implied removal of the ruling for the act. In the jurists' usage, performing an obligation is called qada'; the word can cover both performing the obligation itself and delivering a like thing, and an executor who knows of a debt on the deceased and pays it does not sin. The common term in the jurists' usage for taking a right is istifa', while iqtida' means demanding that a right be fulfilled, as in the hadith of the generous seller and buyer. In usul, the demand of an act or of its omission is either obligatory or prohibited when definite, and recommended or disliked when not, while choice is its counterpart. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3180} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3181} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3182}"
