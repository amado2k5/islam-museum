id: concept/tacallum-al-asma
class: concept
kind: term
label:
  ar: "تعليم آدم الأسماء"
  en: "God teaches Adam the names"
  ur: "آدم کو اسماء کی تعلیم"
summary:
  ar: "يرى الشعراوي أن الله علّم آدم الأسماء كلها بإلهام يُلقى في القلب، وأن اللغة ليست وراثة ولا بيئة بل محاكاة تُسمع ثم تُنطق، وأن كل علم ينتهي إلى معلم أول هو الله {cite:tafsir-sharawi-khawatir-scan p.244} {cite:tafsir-sharawi-khawatir-scan p.245} {cite:tafsir-sharawi-khawatir-scan p.246} {cite:tafsir-sharawi-khawatir-scan p.248}."
  en: "Sha'rawi holds that God taught Adam all the names by an inspiration cast into his heart, that language is not heredity or environment but imitation of what one hears, and that every knowledge ends at a first teacher, who is God {cite:tafsir-sharawi-khawatir-scan p.244} {cite:tafsir-sharawi-khawatir-scan p.245} {cite:tafsir-sharawi-khawatir-scan p.246} {cite:tafsir-sharawi-khawatir-scan p.248}."
  ur: "شعراوی کے نزدیک اللہ نے آدم کو تمام اسماء دل میں ڈالے گئے الہام سے سکھائے، زبان وراثت یا ماحول سے نہیں بلکہ سنی ہوئی آواز کی نقل سے آتی ہے، اور ہر علم کا پہلا معلم اللہ ہے {cite:tafsir-sharawi-khawatir-scan p.244} {cite:tafsir-sharawi-khawatir-scan p.245} {cite:tafsir-sharawi-khawatir-scan p.246} {cite:tafsir-sharawi-khawatir-scan p.248}۔"
wings: [words]
themes: [linguistics]
periods: [period/prophetic-era]
regions: [global]
issue:
  ar: "هل علّم الله الإنسان اللغة تعليما، أم وضعها الإنسان بالاصطلاح؟"
  en: "Did God teach humanity language, or did humans set it by convention?"
perspectives:
  - tradition: sunni
    id: sunni-sharawi
    stance:
      ar: "اللغة أصلها تعليم من الله لآدم، والأسماء كلها أُلهمها آدم"
      en: "Language originates in God's teaching of Adam, who was inspired with all the names"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يرى الشعراوي أن تعليم الخالق يكون بالإلهام، وأن آدم سمع ثم نطق، وأن الطريقة التي علّم بها الله آدم هي نفسها التي يعلم بها الإنسان أبناءه بالأسماء قبل الأفعال {cite:tafsir-sharawi-khawatir-scan p.244} {cite:tafsir-sharawi-khawatir-scan p.245}."
      en: "Sha'rawi holds that the Creator teaches by inspiration, that Adam heard and then spoke, and that God taught Adam the way people teach their children: names first, then actions {cite:tafsir-sharawi-khawatir-scan p.244} {cite:tafsir-sharawi-khawatir-scan p.245}."
    sources: [source/tafsir-sharawi-khawatir-scan]
  - tradition: academic
    id: academic
    stance:
      ar: "نظرية الاصطلاح في نشأة اللغة لم تُعرض بعد"
      en: "The conventionalist theory of the origin of language is not yet set out"
    summary:
      ar: "لم تُعرض في هذه الصفحات نظرية علمية في نشأة اللغة، وتحتاج إلى مراجع لسانية محددة."
      en: "No linguistic theory of the origin of language is set out in these pages; it needs named linguistic sources."
    sources: []
  - tradition: other
    id: other
    stance:
      ar: "رأي المدارس الكلامية الأخرى لم يُضف بعد"
      en: "The view of other theological schools is not yet added"
    summary:
      ar: "لم تُعرض هنا أقوال المدارس الكلامية الأخرى في مسألة التوقيف والاصطلاح، ولم تُراجع."
      en: "The positions of other theological schools on tawqif and iṣṭilāḥ are not set out here and are not checked."
