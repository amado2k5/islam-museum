id: concept/al-shams-tashriq
class: concept
kind: doctrine
label:
  ar: طلوع الشمس من مغربها
  en: The Sun Rising from the West
  ur: مغرب سے طلوع آفتاب
summary:
  ar: "طلوع الشمس من مغربها من أشراط الساعة الكبرى المذكورة في القرآن والسنة: ﴿حتى إذا جنت الظلمات ما تدريجيا﴾، وقوله تعالى ﴿يوم يبعثون يوم لا ينفع مال ولا بنون إلا من أتى الله بقلب سليم﴾، وفي الحديث أن طلوع الشمس من مغربها من أشراط الساعة الكبرى التي إذا ظهرت لم تبق من الدنيا إلا يوم واحد."
  en: "The sun rising from the west is one of the major signs of the Hour in Qur'an and Sunnah: when the darkness of the grave is dispelled and people are raised, the sun will rise from the west as a trial after which the Hour is near."
  ur: "مغرب سے طلوع آفتاب ساعت کی بڑی نشانیوں میں سے ہے جو قرآن و سنت میں مذکور ہے: جب ظلمات ⁦(قبر)⁩ کے اندھیرے ختم ہو کر لوگ اٹھائے جائیں گے تو آفتاب مغرب سے طلوع کرے گا، اور اس کے بعد ساعت قریب ہو جائے گی۔"
