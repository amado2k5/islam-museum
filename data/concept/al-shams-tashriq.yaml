id: concept/al-shams-tashriq
class: concept
kind: doctrine
label:
  ar: طلوع الشمس من مغربها
  en: The Sun Rising from the West
  fr: "Le lever du soleil à l’ouest"
  ur: مغرب سے طلوع آفتاب
summary:
  ar: "يُعدّ طلوع الشمس من مغربها من أشراط الساعة في الروايات الحديثية، وفي [[passage/muslim-2759|صحيح مسلم 2759]] أن باب التوبة يبقى مفتوحاً إلى طلوعها من مغربها {cite:sahih-muslim 2759}. ويرى الطبري في تفسير [[passage/quran-6-158|سورة الأنعام، الآية 158]] أن طلوع الشمس من مغربها هو المراد ببعض آيات الله المذكورة في الآية {cite:tafsir-tabari-shakir-v12 p. 266}."
  en: "The sun rising from the west is one of the major signs of the Hour in Qur'an and Sunnah: when the darkness of the grave is dispelled and people are raised, the sun will rise from the west as a trial after which the Hour is near."
  fr: "Le lever du soleil à l’ouest compte parmi les grands signes annonciateurs de l’Heure. Dans le hadith [[passage/muslim-2759|Muslim 2759]], il marque la fin du temps laissé au repentir {cite:sahih-muslim 2759}. Al-Tabari l’identifie à l’un des signes évoqués dans le [[passage/quran-6-158|Coran, 6:158]] {cite:tafsir-tabari-shakir-v12 p. 266}."
  ur: "مغرب سے طلوع آفتاب ساعت کی بڑی نشانیوں میں سے ہے جو قرآن و سنت میں مذکور ہے: جب ظلمات ⁦(قبر)⁩ کے اندھیرے ختم ہو کر لوگ اٹھائے جائیں گے تو آفتاب مغرب سے طلوع کرے گا، اور اس کے بعد ساعت قریب ہو جائے گی۔"
