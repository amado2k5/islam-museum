id: concept/zij-sabi-parallax-of-the-sun-is-not-perceptible
class: concept
kind: scientific
label: { ar: "اختلاف منظر الشمس غير محسوس", en: "The Sun's parallax is not perceptible", ur: "سورج کا اختلافِ منظر محسوس نہیں", es: "La paralaje del Sol no es perceptible." }
summary:
  ar: "يقرر البتاني أن اختلاف المنظر في الشمس غير محسوس، كما هو في غيرها من الكواكب المذكورة، وأن بطليموس رسم ذلك بنسبة الواحد إلى الألف والمائتين والعشرة، وهي بُعد الشمس المرسل عن مركز الأرض. {cite:zij-sabi-nallino-byblion p.116}."
  en: "Al-Battani holds that the Sun's parallax is not perceptible, as it is with the other bodies named, and that Ptolemy set it at the ratio of one to 1210, which is the Sun's distance from the Earth's centre. {cite:zij-sabi-nallino-byblion p.116}."
  ur: "البتانی کہتے ہیں کہ سورج کا اختلافِ منظر محسوس نہیں، جیسا کہ دوسرے مذکورہ اجرام میں ہے، اور بطلیموس نے اسے ایک کی نسبت ایک ہزار دو سو دس پر رکھا، جو زمین کے مرکز سے سورج کا فاصلہ ہے۔ {cite:zij-sabi-nallino-byblion p.116}۔"
  es: "Al-Battani sostiene que la paralaje del Sol no es perceptible, como sí lo es la de los demás cuerpos celestes mencionados, y que Ptolomeo la estableció en una proporción de uno a 1210, que es la distancia del Sol al centro de la Tierra. {cite:zij-sabi-nallino-byblion p.116}."
