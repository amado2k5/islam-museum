id: concept/jabla-hank
class: concept
kind: natural
label:
  ar: "جبلا هنك"
  en: "Jabla hank (the plant the editor links to a Latin name)"
  ur: "جبلا ہنک"
  es: "Jabla hank (la planta que el editor relaciona con un nombre en latín)"
  fr: "Jabla hank (la plante dont le nom latin est associé par l'éditeur)"
  tr: "Jabala Hank"
  id: "Jabala Hank"
summary:
  ar: "نبات يقرب فعله من الخربق؛ قيل إنه بزر التربد الأسود وقشور أصله، وقيل إنه التربد الأصفر المنعوت بالصغد، والجيد منه الهندي. مُقيء، ويسهّل، وفيه قوة سمية، وذكر الكتاب أن بعضهم سقى منه المفلوج فعُوفي {cite:canon-ibn-sina-print-v1 p.421} {cite:canon-ibn-sina-print-v1 p.422}."
  en: "A plant whose action is close to hellebore's. Some say it is the seed of black turbith and its root rind; others say yellow turbith, described as Soghdian; the best is the Indian kind. It causes vomiting and purging, has a poisonous power, and the book reports that some gave it to paralysed patients and they recovered {cite:canon-ibn-sina-print-v1 p.421} {cite:canon-ibn-sina-print-v1 p.422}."
  ur: "ایک پودا جس کا عمل خربق کے قریب ہے۔ بعض کے نزدیک یہ کالے تربد کا بیج اور اس کی جڑ کا چھلکا ہے، اور دوسروں کے نزدیک زرد تربد جسے صغدی کہا جاتا ہے، اور اس کی بہترین قسم ہندی ہے۔ یہ قے لاتا ہے، مسہل ہے اور زہریلی قوت رکھتا ہے۔ کتاب بیان کرتی ہے کہ بعض نے اسے فالج زدہ مریضوں کو دیا اور وہ شفایاب ہوئے {cite:canon-ibn-sina-print-v1 p.421} {cite:canon-ibn-sina-print-v1 p.422}۔"
  es: "Una planta cuya acción es similar a la del eléboro. Algunos dicen que es la semilla del turbith negro y la corteza de su raíz; otros dicen que es el turbith amarillo, descrito como sogdiano; la mejor es la variedad india. Provoca vómitos y purgas, tiene poder venenoso, y el libro informa que algunos se la dieron a pacientes paralíticos y estos se recuperaron {cite:canon-ibn-sina-print-v1 p.421} {cite:canon-ibn-sina-print-v1 p.422}."
  fr: "Une plante dont l'action est proche de celle de l'hellébore. Certains disent qu'il s'agit de la graine de la turbith noire et de l'écorce de sa racine; d'autres disent de la turbith jaune, décrite comme soghdienne; la meilleure serait la variété indienne. Elle provoque des vomissements et des purges, possède un pouvoir toxique, et le livre rapporte que certains l'ont administrée à des patients paralysés qui ont guéri {cite:canon-ibn-sina-print-v1 p.421} {cite:canon-ibn-sina-print-v1 p.422}."
  tr: "Etkinliği harbak'a yakın olan bir bitki; siyah tarbalog tohumu ve kök kabuklarının tohumu olduğu söylenir, ayrıca Sogd adı verilen sarı tarpad olduğu ve en iyisi Hint tarbasıdır. Kusma etkisi vardır, kolaylaştırılır ve zehirli bir güce sahiptir. Kitapta, bazılarının felç kalmak için su verdiği ve uyanık olduğu belirtilir {cite:canon-ibn-sina-print-v1 s.421} {cite:canon-ibn-sina-print-v1 s.422}."
  id: "Tanaman yang aktivitasnya dekat dengan kharbak; dikatakan benih tarbalog hitam dan kulitnya dari akarnya, dan juga disebut sebagai tarbalog kuning yang disebut Sogd, dan yang terbaik adalah tarba India. Tanaman ini emetik, difasilitasi, dan memiliki kekuatan beracun. Buku tersebut menyebutkan bahwa beberapa dari mereka memberikan air dari tarbalog tersebut hingga lumpuh dan terjaga {cite:canon-ibn-sina-print-v1 hlm.421} {cite:canon-ibn-sina-print-v1 hlm.422}."
