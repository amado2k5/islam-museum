id: concept/insan
class: concept
kind: natural
label:
  ar: "إنسان"
  en: "Insan (substances of the human body)"
  ur: "انسان ⁦(انسانی جسم کے اجزا)⁩"
  es: "Insan (sustancias del cuerpo humano)"
  fr: "Insan (substances du corps humain)"
summary:
  ar: "مواد مأخوذة من جسم الإنسان، كالبول والمني واللبن والزبل والريق والشعر والعظم، ويعرضها الكتاب بصيغة النقل، ومنها ما يُنسب إلى الانتفاع بقروح العين والجلد والصدر والمعدة. وفيها ما يذكره الكتاب في الحيض والحبل وتنقية الرحم، فيُدرج هنا نقلاً عنه لا توصية به {cite:canon-ibn-sina-print-v1 p.373} {cite:canon-ibn-sina-print-v1 p.374}."
  en: "Substances taken from the human body, such as urine, semen, milk, dung, saliva, hair and bone. The book presents them as reported sayings, and some are said to help eye, skin, chest and stomach complaints. Some entries concern menses, conception and cleansing of the womb; they are kept here as the book's listing, not a recommendation {cite:canon-ibn-sina-print-v1 p.373} {cite:canon-ibn-sina-print-v1 p.374}."
  ur: "انسانی جسم سے لی گئی چیزیں، جیسے پیشاب، منی، دودھ، گوبر، لعاب، بال اور ہڈی۔ کتاب انہیں نقل شدہ اقوال کے طور پر پیش کرتی ہے، اور ان میں سے بعض کا تعلق آنکھ، جلد، سینے اور معدے کی بیماریوں سے بتایا گیا ہے۔ کچھ اندراجات حیض، حمل اور رحم کی صفائی سے متعلق ہیں؛ یہ یہاں کتاب کی فہرست کے طور پر رکھے گئے ہیں، کوئی سفارش نہیں {cite:canon-ibn-sina-print-v1 p.373} {cite:canon-ibn-sina-print-v1 p.374}۔"
  es: "Sustancias extraídas del cuerpo humano, como orina, semen, leche, heces, saliva, cabello y huesos. El libro las presenta como dichos atribuidos, y se dice que algunas ayudan con dolencias oculares, cutáneas, pectorales y estomacales. Algunas entradas se refieren a la menstruación, la concepción y la limpieza del útero; se mantienen aquí como una lista del libro, no como una recomendación {cite:canon-ibn-sina-print-v1 p.373} {cite:canon-ibn-sina-print-v1 p.374}."
  fr: "Des substances extraites du corps humain, telles que l'urine, le sperme, le lait, les excréments, la salive, les cheveux et les os, sont présentées dans l'ouvrage sous forme de dictons rapportés. Certaines sont réputées soulager les affections oculaires, cutanées, thoraciques et digestives. D'autres entrées traitent des menstruations, de la conception et de la purification de l'utérus; elles sont reproduites ici à titre de liste, et non comme une recommandation. {cite:canon-ibn-sina-print-v1 p.373} {cite:canon-ibn-sina-print-v1 p.374}"
