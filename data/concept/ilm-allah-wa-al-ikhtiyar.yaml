  - tradition: other
    id: compulsion-jabriyya-as-reported
    stance:
      ar: "لا اختيار للعبد في أفعاله على الحقيقة، وهي مجبورة عليه؛ ينسب المؤلف هذا القول إلى الجبرية الخالصة، وأولهم الجهمية أتباع الجهم بن صفوان"
      en: "The servant has no real choice and his acts are compelled; the author attributes this view to the pure Jabriyya, the first of whom were the Jahmiyya, followers of Jahm ibn Safwan"
      ur: "بندے کا اپنے افعال میں حقیقی اختیار نہیں اور اس پر جبر ہے؛ مصنف اس رائے کو خالص جبریہ کی طرف منسوب کرتے ہیں، جن کا پہلا فرقہ جہمیہ تھا، یعنی جہم بن صفوان کے پیروکار"
      fr: "Le serviteur n’a pas de choix véritable et ses actes sont contraints; l’auteur attribue cette thèse aux Jabriyya purs, dont le premier groupe fut celui des Jahmiyya, disciples de Jahm ibn Safwan"
      es: "El siervo no tiene una elección verdadera y sus actos están forzados; el autor atribuye esta tesis a los yabríes puros, cuyo primer grupo fue el de los yahmíes, discípulos de Jahm ibn Safwan"
    summary:
      ar: "يذكر المؤلف أن قوماً صرحوا بالجبر، ويرى أنه هدم للشريعة وإبطال للتكاليف ولحكم العقل البديهي."
      en: "The author says some stated compulsion openly, and holds that it demolishes the law, cancels the duties and overturns the self-evident judgement of reason."
      ur: "مصنف کہتے ہیں کہ کچھ لوگوں نے جبر کو کھل کر بیان کیا، اور ان کے نزدیک یہ شریعت کو ڈھا دیتا ہے، تکالیف کو ساقط کرتا ہے اور عقل کے بدیہی حکم کو باطل کرتا ہے۔"
      fr: "L’auteur dit que certains ont affirmé la contrainte ouvertement, et soutient qu’elle détruit la loi, annule les obligations et renverse le jugement évident de la raison."
      es: "El autor dice que algunos afirmaron la coacción abiertamente, y sostiene que destruye la ley, anula las obligaciones y trastoca el juicio evidente de la razón."
