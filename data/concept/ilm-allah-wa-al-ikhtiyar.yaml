      ar: "للعبد سلطة مطلقة على أفعاله واستقلال فيها، وهو قول ينسبه المؤلف في الحاشية إلى المعتزلة ومن رأى رأيهم"
      en: "The servant has absolute power over his acts and independence in them; the author attributes this view in a footnote to the Mu'tazila and those who share it"
      ur: "بندے کو اپنے افعال پر مطلق اختیار اور ان میں استقلال حاصل ہے؛ مصنف حاشیے میں یہ قول معتزلہ اور ان کے ہم خیالوں کی طرف منسوب کرتے ہیں"
      fr: "Le serviteur a un pouvoir absolu sur ses actes et y est indépendant; l’auteur attribue cette thèse en note aux Mu’tazilites et à ceux qui la partagent"
      es: "El siervo tiene poder absoluto sobre sus actos y es independiente en ellos; el autor atribuye esta tesis en una nota a los mu'tazilíes y a quienes la comparten"
    summary:
