issue:
  ar: "ما علاقة علم الله وإرادته وقدرته باختيار الإنسان؟"
  en: "How do God's knowledge, will and power relate to human choice?"
  ur: "اللہ کا علم، ارادہ اور قدرت انسانی اختیار سے کیسے جڑتے ہیں؟"
  fr: "Comment la science, la volonté et la puissance de Dieu se rapportent-elles au choix humain ?"
  es: "¿Cómo se relacionan el conocimiento, la voluntad y el poder de Dios con la elección humana?"
perspectives:
  - tradition: sunni-ashari
    id: kasb-ashari-as-reported
    stance:
      ar: "العبد يكسب أفعاله، وهو قول الأشعرية عند المؤلف، ويرى أن هذا القول لا يخرج في النهاية من الجبر"
      en: "The servant acquires (kasb) his acts; Abduh reports this as the Ash'ari view and holds that it does not in the end escape compulsion"
      ur: "بندہ اپنے افعال کا کسب کرتا ہے؛ مصنف اسے اشاعرہ کا قول بتاتے ہیں اور ان کے نزدیک یہ آخرکار جبر سے نہیں بچتا"
      fr: "Le serviteur acquiert (kasb) ses actes; l’auteur rapporte cette thèse comme celle des Ash’arites et soutient qu’elle n’échappe pas finalement à la contrainte"
      es: "El siervo adquiere (kasb) sus actos; el autor presenta esta tesis como la de los ash'aríes y sostiene que no escapa en última instancia a la coacción"
    summary:
      ar: "يذكر المؤلف أن قوماً قالوا بالجبر وتبرأوا من اسمه، وهم الأشعرية، وأن قولهم بالكسب لا يغني شيئاً عن الاتفاق مع الجبرية في نهاية المطاف. ويعرض هذا الرأي بوصفه أحد الأقوال الثلاثة، وليس رأيه."
      en: "The author says that some who held compulsion disowned its name; these are the Ash'aris, and he holds that their saying of acquisition does not in the end differ from the Jabriyya. He gives this as one of three views, not as his own."
      ur: "مصنف کہتے ہیں کہ کچھ لوگ جبر کے قائل تھے مگر اس کے نام سے بری ہوئے؛ یہ اشاعرہ ہیں، اور ان کا کسب کا قول آخرکار جبریہ سے مختلف نہیں ٹھہرتا۔ وہ اسے تین آراء میں سے ایک کے طور پر پیش کرتے ہیں، اپنی رائے کے طور پر نہیں۔"
      fr: "L’auteur dit que certains qui soutenaient la contrainte en ont désavoué le nom; ce sont les Ash’arites, et leur thèse de l’acquisition ne se distingue pas, au bout du compte, de celle des Jabriyya. Il la donne comme l’une de trois opinions, non comme la sienne."
      es: "El autor dice que algunos que sostenían la coacción renegaron de su nombre; son los ash'aríes, y su tesis de la adquisición no se distingue, al final, de la de los yabríes. La presenta como una de tres opiniones, no como la suya."
