      en: "The author gives this as the first of three views and calls it a manifest delusion."
      ur: "مصنف اسے تین آراء میں پہلی رائے کے طور پر پیش کرتے ہیں اور اسے کھلا فریب کہتے ہیں۔"
      fr: "L’auteur présente cette thèse comme la première des trois et la qualifie d’illusion manifeste."
      es: "El autor la presenta como la primera de tres posturas y la califica de engaño manifiesto."
