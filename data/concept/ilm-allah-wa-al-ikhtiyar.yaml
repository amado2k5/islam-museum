id: concept/ilm-allah-wa-al-ikhtiyar
class: concept
kind: doctrine
label:
  ar: "علم الله والاختيار الإنساني"
  en: "God’s knowledge and human choice"
  fr: "La science de Dieu et le choix humain"
  es: "El conocimiento de Dios y la elección humana"
  ur: "علمِ الٰہی اور انسانی اختیار"
  tr: "Tanrı'nın bilgisi ve insan seçimi"
  id: "Pengetahuan Tuhan dan pilihan manusia"
summary:
  ar: "يتناول عبده مسألة القدر والاختيار في باب أفعال العباد. يرى أن الإيمان بوحدانية الله يقتضي أن يعتقد المكلف أن الله صرفه في قواه، وأنه كاسب لإيمانه ولسائر أعماله، وأن قدرة الله فوق قدرته{cite:abduh-risalat-tawhid-imara-1994 p.66}. ويعد البحث عن التوفيق بين إحاطة علم الله وإرادته وقدرته وبين ما تشهد به البداهة من اختيار الإنسان من طلب سر القدر الذي نُهي عن الخوض فيه، وقد غلا فيه أهل كل ملة ولم يتجاوزوا موضع البداية{cite:abduh-risalat-tawhid-imara-1994 p.64}. ويذكر ثلاثة أقوال: سلطة العبد المطلقة على أفعاله، وهو ما ينسبه إلى المعتزلة في الحاشية، والجبر، والكسب الذي يرى أنه لا يخرج في النهاية من الجبر{cite:abduh-risalat-tawhid-imara-1994 p.64}{cite:abduh-risalat-tawhid-imara-1994 p.65}. ويقرر أن علم الله بما يختاره الإنسان لا يسلب الاختيار، لأن العلم تابع للواقع، والواقع لا يتبدل، ويضرب مثلا بالعاصي الذي يعلم أن عصيانه سيعاقب ثم يعصي باختياره{cite:abduh-risalat-tawhid-imara-1994 p.67}{cite:abduh-risalat-tawhid-imara-1994 p.68}. وهذه آراء المؤلف، ويعرضها المتحف بوصفها رأيه."
  en: "On divine decree and human choice, Abduh holds that belief in God’s oneness requires the believer to hold that God has disposed his powers, that he acquires his faith and his other acts, and that God’s power is above his own{cite:abduh-risalat-tawhid-imara-1994 p.66}. He calls the attempt to reconcile God’s all-encompassing knowledge, will and power with the self-evident fact of human choice a search for the secret of decree, which the believer is told not to probe; people of every religion, he says, have gone round this question and remained where they began{cite:abduh-risalat-tawhid-imara-1994 p.64}. He lists three positions: the servant’s absolute autonomy over his acts, which he attributes to the Mu’tazila in a footnote; compulsion; and acquisition (kasb), which he argues does not in the end escape compulsion{cite:abduh-risalat-tawhid-imara-1994 p.64}{cite:abduh-risalat-tawhid-imara-1994 p.65}. His own argument is that God’s knowledge of what a person will choose does not remove the choice, because knowledge follows what happens and what happens does not change; he gives the example of a rebel who knows his disobedience will be punished and disobeys anyway{cite:abduh-risalat-tawhid-imara-1994 p.67}{cite:abduh-risalat-tawhid-imara-1994 p.68}. These are the author’s positions, presented here as his view."
  fr: "Sur le décret divin et le choix humain, Abduh soutient que la croyance en l’unicité de Dieu exige de croire que Dieu a disposé les facultés de l’homme, que celui-ci acquiert sa foi et ses autres actes, et que la puissance de Dieu est au-dessus de la sienne{cite:abduh-risalat-tawhid-imara-1994 p.66}. Il appelle recherche du secret du décret la tentative de concilier la science, la volonté et la puissance englobantes de Dieu avec le choix humain évident; les croyants sont invités à ne pas la poursuivre{cite:abduh-risalat-tawhid-imara-1994 p.64}. Il recense trois positions: l’autonomie absolue du serviteur, qu’il attribue dans une note aux Mu’tazilites; la contrainte; et l’acquisition (kasb), qui, selon lui, n’échappe pas finalement à la contrainte{cite:abduh-risalat-tawhid-imara-1994 p.64}{cite:abduh-risalat-tawhid-imara-1994 p.65}. Son argument est que la science de Dieu de ce que choisira une personne n’annule pas le choix, car la science suit ce qui arrive et ce qui arrive ne change pas; il donne l’exemple du rebelle qui sait que sa désobéissance sera punie et désobéit malgré tout{cite:abduh-risalat-tawhid-imara-1994 p.67}{cite:abduh-risalat-tawhid-imara-1994 p.68}. Ce sont les positions de l’auteur, présentées ici comme son avis."
  es: "Sobre el decreto divino y la elección humana, Abduh sostiene que creer en la unicidad de Dios exige creer que Dios ha dispuesto las facultades del ser humano, que este adquiere su fe y sus demás actos, y que el poder de Dios está por encima del suyo{cite:abduh-risalat-tawhid-imara-1994 p.66}. Llama búsqueda del secreto del decreto al intento de conciliar el conocimiento, la voluntad y el poder abarcadores de Dios con la elección humana evidente, indagación que se pide al creyente no emprender{cite:abduh-risalat-tawhid-imara-1994 p.64}. Enumera tres posturas: la autonomía absoluta del siervo, que atribuye en una nota a los mu’tazilíes; la coacción; y la adquisición (kasb), que según él no escapa en última instancia a la coacción{cite:abduh-risalat-tawhid-imara-1994 p.64}{cite:abduh-risalat-tawhid-imara-1994 p.65}. Su argumento es que el conocimiento de Dios sobre lo que una persona elegirá no anula la elección, porque el conocimiento sigue a lo que ocurre y lo que ocurre no cambia; ilustra con el rebelde que sabe que su desobediencia será castigada y desobedece de todos modos{cite:abduh-risalat-tawhid-imara-1994 p.67}{cite:abduh-risalat-tawhid-imara-1994 p.68}. Son posturas del autor, presentadas aquí como su opinión."
  ur: "عبدہ تقدیر اور انسانی اختیار کے مسئلے پر کہتے ہیں کہ توحید پر ایمان کا تقاضا یہ ہے کہ مکلف یہ مانے کہ اللہ نے اس کی قوتوں کو اس کے تابع کیا ہے، وہ اپنے ایمان اور دوسرے اعمال کا کسب کرنے والا ہے، اور اللہ کی قدرت اس کی قدرت سے بالاتر ہے{cite:abduh-risalat-tawhid-imara-1994 p.66}۔ وہ اللہ کے علم، ارادے اور قدرت کو انسانی اختیار کے بدیہی ہونے کے ساتھ ملانے کی کوشش کو تقدیر کے راز کی تلاش قرار دیتے ہیں، جس سے منع کیا گیا ہے{cite:abduh-risalat-tawhid-imara-1994 p.64}۔ وہ تین آراء بیان کرتے ہیں: بندے کا اپنے افعال پر مطلق اختیار، جسے وہ حاشیے میں معتزلہ کی طرف منسوب کرتے ہیں؛ جبر؛ اور کسب، جو ان کے نزدیک آخرکار جبر سے نہیں بچتا{cite:abduh-risalat-tawhid-imara-1994 p.64}{cite:abduh-risalat-tawhid-imara-1994 p.65}۔ ان کی اپنی دلیل یہ ہے کہ اللہ کا علم کہ کوئی شخص کیا چنے گا، اختیار کو ختم نہیں کرتا، کیونکہ علم واقعے کے تابع ہے اور واقعہ بدلتا نہیں؛ وہ اس باغی کی مثال دیتے ہیں جو جانتا ہے کہ اس کی نافرمانی پر سزا ہوگی اور پھر بھی نافرمانی کرتا ہے{cite:abduh-risalat-tawhid-imara-1994 p.67}{cite:abduh-risalat-tawhid-imara-1994 p.68}۔ یہ مصنف کی آراء ہیں اور یہاں انہیں اس کی رائے کے طور پر پیش کیا گیا ہے۔"
  tr: "Abduh, hizmetkârların eylemleri bölümünde kader ve seçim konusuna değinir. Tanrı'nın birliğine inanmanın, sorumlu kişinin Tanrı'nın onu gücüne yönlendirdiğine, inancını ve tüm eylemlerini kazandığına ve Tanrı'nın gücünün gücünün üstünde olduğuna inanmasını gerektirdiğine inanır {cite:abduh-risalat-tawhid-imara-1994 s.66}. Tanrı'nın bilgisi, iradesi ve gücünün kapsamlı bilgisi arasındaki uzlaşma arayışı, insanın kader sırrını aramada apaçık bir tercihiyle kanıtlanır; bu sırrın içine girmesini yasaklamış, her inançtan insanlar tarafından abartılmış ve başlangıç noktasının ötesine geçmemiştir {cite:abduh-risalat-tawhid-imara-1994 s.64}. Üç görüşten bahseder: hizmetlinin eylemleri üzerindeki mutlak otoritesi, bunu kenar notlarında Mu'tazilcilere atfeder; ve kaderin nihai olarak kaderden kaçamadığına inandığı kader. {alıntı:Abduh-risalat-tawhid-imara-1994 s.64} {cite:abduh-risalat-tawhid-imara-1994 s.65}. Tanrı'nın insanın seçtiği şeyi bilmesinin seçimi geçersiz kılmadığını, çünkü bilginin gerçeği takip ettiğini ve gerçekliğin değişmediğini belirtir. Günahkârın örneğini verir; itaatsizliğinin cezalandırılacağını ve ardından kendi seçimi tarafından itaatsizlik edileceğini bilir{cite:abduh-risalat-tawhid-imara-1994 s.67} {cite:abduh-risalat-tawhid-imara-1994 s.68}. Bunlar yazarın görüşleridir ve müze bunları kendi görüşü olarak sunar."
  id: "Abduh membahas isu predestinasi dan pilihan dalam bab tentang tindakan para pelayan. Ia percaya bahwa kepercayaan pada keesaan Allah mengharuskan orang yang bertanggung jawab percaya bahwa Tuhan telah mengarahkannya pada kuasa-Nya, bahwa Ia telah memperoleh iman dan semua perbuatannya, dan bahwa kuasa Allah melebihi kuasa-Nya {cite:abduh-risalat-tawhid-imara-1994 hlm.66}. Pencarian rekonsiliasi antara pengetahuan menyeluruh tentang pengetahuan, kehendak, dan kuasa Tuhan dibuktikan oleh pilihan manusia yang jelas dalam mencari rahasia predestinasi, yang dilarangnya untuk dijelajahi dan telah dilebih-lebihkan oleh orang-orang dari setiap agama dan tidak melampaui titik awal {cite:abduh-risalat-tawhid-imara-1994 hlm.64}. Ia menyebutkan tiga pendapat: otoritas mutlak hamba atas tindakannya, yang ia atribusikan kepada Mu'tazilites dalam catatan pinggir; dan predestinasi, yang ia yakini pada akhirnya tidak lolos dari takdir. {cite:abduh-risalat-tawhid-imara-1994 hlm.64} {cite:abduh-risalat-tawhid-imara-1994 hlm.65}. Ia menyatakan bahwa pengetahuan Tuhan tentang apa yang dipilih manusia tidak meniadakan pilihan, karena pengetahuan mengikuti kenyataan, dan realitas tidak berubah. Ia memberikan contoh pendosa, yang tahu bahwa ketidakpatuhannya akan dihukum dan kemudian dilanggar oleh pilihannya {cite:abduh-risalat-tawhid-imara-1994 hlm.67} {cite:abduh-risalat-tawhid-imara-1994 hlm.68}. Ini adalah pendapat penulis, dan museum menyajikannya sebagai pendapatnya sendiri."
