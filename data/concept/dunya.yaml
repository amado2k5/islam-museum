summary:
  ar: "في دروس الشيخ عمر عبد الكافي تُشبَّه الدنيا بمتجر كبير يملأ فيه المرء عربته ثم يدفع الحساب في آخر الأمر {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:44:00}. ويرى الشيخ أن المال قد يكون من ركائز السعادة لكن السعادة نفسها لا تُشترى به {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:48:30}. ويدعو إلى قبول كل مرحلة من العمر بمزاياها وقبول طباع الناس كما هي {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:52:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:53:00}."
  en: "In Sheikh Omar Abdelkafy's lessons the world is compared to a large store where a person fills his cart and pays the bill at the end {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:44:00}. The Sheikh holds that money may be a pillar of happiness but that happiness itself cannot be bought with it {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:48:30}. He urges accepting every stage of life with its merits and accepting people's natures as they are {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:52:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:53:00}."
  ur: "شیخ عمر عبد الکافی کے دروس میں دنیا کو ایک بڑی دکان سے تشبیہ دی جاتی ہے جہاں آدمی اپنی ٹوکری بھرتا ہے اور آخر میں حساب ادا کرتا ہے {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:44:00}۔ شیخ کی رائے ہے کہ مال خوشی کے ستونوں میں سے ہو سکتا ہے لیکن خوشی خود اس سے خریدی نہیں جا سکتی {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:48:30}۔ وہ عمر کے ہر مرحلے کو اس کی خوبیوں کے ساتھ قبول کرنے اور لوگوں کی طبیعتوں کو جیسی ہیں ویسا قبول کرنے کی دعوت دیتے ہیں {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:52:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:53:00}۔"
  es: "En las enseñanzas del jeque Omar Abdelkafy, el mundo se compara con una gran tienda donde una persona llena su carrito y paga la cuenta al final {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:44:00}. El jeque sostiene que el dinero puede ser un pilar de la felicidad, pero que la felicidad misma no se puede comprar con él {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:48:30}. Él insta a aceptar cada etapa de la vida con sus méritos y a aceptar la naturaleza de las personas tal como es {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:52:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:53:00}."
  fr: "Dans les enseignements du cheikh Omar Abdelkafy, le monde est comparé à un grand magasin où l'on remplit son chariot et où l'on règle ses achats à la fin {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:44:00}. Le cheikh soutient que l'argent peut contribuer au bonheur, mais que le bonheur lui-même ne s'achète pas avec lui {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:48:30}. Il exhorte à accepter chaque étape de la vie avec ses mérites et à accepter la nature des gens telle qu'elle est {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:52:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:53:00}."
  tr: "Şeyh Ömer Abdulkafi'nin derslerinde hayat, bir kişinin arabasını doldurup sonunda faturayı ödediği büyük bir dükkana benzetilir {cite:assabile-omar-abdelkafy tafsir-al-quran-al-kareem/ep04 00:44:00}. Şeyh, paranın mutluluğun temel taşlarından biri olabileceğine inanır, ancak mutluluğun kendisi satın alınmaz {cite:assabile-omar-abdelkafy tafsir-al-quran-al-kareem/ep04 00:48:30}. Hayatın her aşamasını avantajlarıyla birlikte kabul etmeyi ve insanların mizacını olduğu gibi kabul etmeyi gerektirir {cite:assabile-omar-abdelkafy tafsir-al-kuran-al-kareem/ep04 00:52:30} {cite:assabile-omar-abdelkafy tafsir-al-kuran-al-kareem/ep04 00:53:00}."
  id: "Dalam pelajaran Sheikh Omar Abdulkafi, kehidupan disamakan dengan toko besar di mana seseorang mengisi trolinya dan kemudian membayar tagihan di akhir {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:44:00}. Sheikh percaya bahwa uang mungkin salah satu pilar kebahagiaan, tetapi kebahagiaan itu sendiri tidak dibeli {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:48:30}. Ia menyerukan penerimaan setiap tahap kehidupan dengan kelebihannya dan menerima temperamen orang sebagaimana adanya {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:52:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:53:00}."
