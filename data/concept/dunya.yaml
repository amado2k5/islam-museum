  en: "The world (dunya)"
  ur: "دنیا"
summary:
  ar: "في دروس الشيخ عمر عبد الكافي تُشبَّه الدنيا بمتجر كبير يملأ فيه المرء عربته ثم يدفع الحساب في آخر الأمر {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:44:00}. ويرى الشيخ أن المال قد يكون من ركائز السعادة لكن السعادة نفسها لا تُشترى به {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:48:30}. ويدعو إلى قبول كل مرحلة من العمر بمزاياها وقبول طباع الناس كما هي {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:52:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:53:00}."
  en: "In Sheikh Omar Abdelkafy's lessons the world is compared to a large store where a person fills his cart and pays the bill at the end {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:44:00}. The Sheikh holds that money may be a pillar of happiness but that happiness itself cannot be bought with it {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:48:30}. He urges accepting every stage of life with its merits and accepting people's natures as they are {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:52:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:53:00}."
  ur: "شیخ عمر عبد الکافی کے دروس میں دنیا کو ایک بڑی دکان سے تشبیہ دی جاتی ہے جہاں آدمی اپنی ٹوکری بھرتا ہے اور آخر میں حساب ادا کرتا ہے {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:44:00}۔ شیخ کی رائے ہے کہ مال خوشی کے ستونوں میں سے ہو سکتا ہے لیکن خوشی خود اس سے خریدی نہیں جا سکتی {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:48:30}۔ وہ عمر کے ہر مرحلے کو اس کی خوبیوں کے ساتھ قبول کرنے اور لوگوں کی طبیعتوں کو جیسی ہیں ویسا قبول کرنے کی دعوت دیتے ہیں {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:52:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:53:00}۔"
