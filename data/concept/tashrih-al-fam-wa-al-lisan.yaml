id: concept/tashrih-al-fam-wa-al-lisan
class: concept
kind: scientific
label:
  ar: تشريح الفم واللسان
  en: The anatomy of the mouth and the tongue
  ur: منہ اور زبان کی تشریح
  es: "La anatomía de la boca y la lengua"
  fr: "Anatomie de la bouche et de la langue"
  tr: "Ağız ve dil anatomisi"
  id: "Anatomi mulut dan lidah"
summary:
  ar: الفم عضو ضروري في إيصال الغذاء إلى الجوف الأسفل ومشارك في إيصال الهواء إلى الجوف الأعلى ونافع في قذف الفضول المجتمعة في فم المعدة إذا عسر دفعها إلى أسفل وهو الوعاء الكلي لأعضاء الكلام في الإنسان والتصويت في سائر الحيوانات المصوتة، واللسان عضو من آلات تقليب الممضوغ وتقطيع الصوت وإخراج الحروف وإليه تمييز الذوق، وجلدة سطحه الأسفل متصلة بجلدة المريء وباطن المعدة وتحته فوهتان هما منبع اللعاب يسميان ساكبي اللعاب وتحته عرقان كبيران أخضران يسميان الصردين {cite:canon-ibn-sina-print-v2 p.253}
  en: 'The mouth is a necessary organ for conveying nourishment to the lower cavity, shares in conveying air to the upper cavity, and serves to cast out the wastes gathered at the mouth of the stomach when their downward expulsion is hard; it is the general vessel of the organs of speech in man and of vocalisation in the other voiced animals. The tongue is an organ among the instruments that turn the chewed food, cut the voice and bring out the letters, and to it belongs the discernment of taste; the skin of its lower surface is continuous with the skin of the oesophagus and the stomach''s inside. Beneath it are two openings that admit the probe, the source of saliva called the two saliva-pourers, and two large greenish veins called the sardayn {cite:canon-ibn-sina-print-v2 p.253}'
  ur: 'منہ ایک ضروری عضو ہے جو خوراک کو نچلی جوف تک پہنچاتا ہے اور ہوا کو اوپر کی جوف تک پہنچانے میں شریک ہے اور معدے کے منہ پر جمع ہونے والی فضول کو باہر پھینکنے میں مدد دیتا ہے جب ان کا نیچے دھکیلنا دشوار ہو؛ یہ انسان میں کلام کے اعضاء کا کلی ظرف ہے اور باقی آواز والے جانوروں میں آواز کا؛ اور زبان ان آلات میں سے ایک عضو ہے جو چبائی ہوئی چیز کو پھیرتی ہے، آواز کو تقسیم اور حروف کو خارج کرتی ہے اور اسی سے ذائقہ ممیز ہوتا ہے؛ اس کے نچلے سطح کی کھال مری کی کھال اور معدے کے باطن سے ملی ہوئی ہے؛ اس کے نیچے دو سوراخ ہیں جہاں میل داخل ہوتا ہے، لعاب کا چشمہ، جنہیں ساکب لعاب کہتے ہیں، اور دو بڑی سبز رگیں جنہیں صردین کہتے ہیں {cite:canon-ibn-sina-print-v2 p.253}'
  es: "La boca es un órgano necesario para transportar nutrientes a la cavidad inferior, participa en el transporte de aire a la cavidad superior y sirve para expulsar los desechos acumulados en la boca del estómago cuando su expulsión hacia abajo es difícil; es el vaso principal de los órganos del habla en el hombre y de la vocalización en los demás animales que hablan. La lengua es uno de los órganos que giran los alimentos masticados, cortan la voz y pronuncian las letras, y a ella pertenece la percepción del gusto; la piel de su superficie inferior es continua con la piel del esófago y el interior del estómago. Debajo de ella hay dos aberturas que permiten el paso de la sonda, la fuente de saliva llamada dos salivales, y dos grandes venas verdosas llamadas sardayn {cite:canon-ibn-sina-print-v2 p.253}"
  fr: "La bouche est un organe indispensable à l'acheminement des aliments vers la cavité inférieure, participe à l'acheminement de l'air vers la cavité supérieure et sert à évacuer les déchets accumulés à l'entrée de l'estomac lorsque leur expulsion vers le bas est difficile; elle constitue le vaisseau principal des organes de la parole chez l'homme et de la vocalisation chez les autres animaux à voix. La langue fait partie des organes qui permettent de retourner les aliments mâchés, de moduler la voix et de prononcer les sons; elle est responsable du discernement du goût. La peau de sa face inférieure est en continuité avec celle de l'œsophage et de la paroi interne de l'estomac. En dessous se trouvent deux orifices permettant l'insertion de la sonde, les glandes salivaires et deux grosses veines verdâtres appelées sardayn."
  tr: "Ağız, yiyeceği alt boşluğa ulaştırmak için temel bir organdır, havanın üst boşluğa ulaşmasına katkıda bulunur ve mide ağzında toplanan merakın aşağı itilmesi zorlaştığında dışarı atmada faydalıdır. İnsanlarda konuşma organlarının, tüm sesli hayvanlarda ise ses çıkarmanın tüm damarıdır. Dil, çiğnenen organları karıştırmak, sesi kesmek ve tadına göre ayırt edilen harfler üretmek için kullanılan makinelerin bir parçasıdır. Alt yüzey derisi yemek borusunun derisine ve mide iç kısmına bağlıdır, altında tükürük kaynağı adı verilen iki meme bulunur ve altında sardalya adı verilen iki büyük yeşil damar bulunur {cite:canon-ibn-sina-print-v2 s.253}"
  id: "Mulut adalah organ penting untuk mengantarkan makanan ke rongga bawah, berpartisipasi dalam mengalirkan udara ke rongga atas, dan berguna untuk mengeluarkan rasa ingin tahu yang terkumpul di mulut lambung jika sulit untuk mendorongnya ke bawah. Lidah adalah seluruh pembuluh organ bicara pada manusia dan vokalisasi pada semua hewan vokal. Lidah adalah bagian dari mesin untuk mengaduk suara yang dikunyah, memotong, dan menghasilkan huruf, yang dibedakan berdasarkan rasa. Kulit permukaan bawahnya terhubung dengan kulit esofagus dan bagian dalam lambung, dan di bawahnya terdapat dua nosel yang disebut sumber air liur, dan di bawahnya terdapat dua urat hijau besar yang disebut sarden {cite:canon-ibn-sina-print-v2 hlm.253}"
