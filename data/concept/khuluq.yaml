id: concept/khuluq
class: concept
kind: ethical
label:
  ar: الخلق الحسن
  en: Husn al-khuluq (good character)
summary:
  ar: "معاملة الناس بما يسرهم من قول وفعل مع كف الأذى عنهم، وهو الشطر الثالث من وصية «اتق الله حيثما كنت» — «وخالق الناس بخلق حسن» — ويجمع مع التقوى حقوق الله وحقوق عباده، والجمع بينهما عزيز لا يقوى عليه إلا الكمل من الأنبياء والصديقين عند ابن رجب؛ وغاية حسن الخلق كما وصف الله به المتقين: بذل الندى واحتمال الأذى — «الذين ينفقون في السراء والضراء والكاظمين الغيظ والعافين عن الناس» — وجاء «أكمل المؤمنين إيماناً أحسنهم خلقاً»، وأنه أثقل ما يوضع في الميزان ويبلغ بصاحبه درجة صاحب الصوم والصلاة، وأنه أفضل ما أعطي المرء المسلم وأحبهم إلى الله وأقربهم من النبي مجلساً؛ ومن تعريفاته: قال الإمام أحمد حسن الخلق أن لا تغضب ولا تحتدد وفي رواية أن تحتمل ما يكون من الناس، وقال إسحاق بن راهويه بسط الوجه وأن لا تغضب، وقال بعض أهل العلم كظم الغيظ لله وإظهار الطلاقة والبشر إلا للمبتدع والفاجر والعفو عن الزالين إلا تأديباً أو إقامة حد وكف الأذى عن كل مسلم أو معاهد إلا تغيير منكر أو أخذاً بمظلمة لمظلوم من غير تعد."
  en: "Treating people with what pleases them in word and deed while withholding harm — the third clause of 'fear God wherever you are': 'and keep company with people in good character' — which together with taqwa combines God's rights and His servants' rights, a combination Ibn Rajab calls rare, sustained only by the most complete of prophets and the truthful; its summit, as God describes the muttaqun, is giving freely and bearing hurt — 'who spend in ease and hardship, who restrain their anger and pardon people' — and revelation reports 'the most complete of believers in faith are the best of them in character', that it is the heaviest thing laid in the scales, raising its owner to the rank of the one fasting and praying, the best gift given a Muslim and what makes them most beloved to God and nearest to the Prophet in station; among its definitions: Ahmad's 'that you not become angry or fierce' and, in another report, 'that you bear what comes from people', Ishaq ibn Rahuya's 'a cheerful face and not becoming angry', and some scholars' 'restraining anger for God, showing openness and cheer except to the innovator and the flagrant, pardoning the erring except for discipline or establishing a hadd, and withholding harm from every Muslim and covenanted person except to change an evil or take what is due for the wronged without transgression'."
