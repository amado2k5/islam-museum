id: concept/khuluq
class: concept
kind: ethical
tags: [akhlaq-browser, akhlaq-akhlaq]
label:
  ar: الخلق الحسن
  en: Husn al-khuluq (good character)
  es: "Husn al-khuluq (buen carácter)"
  fr: "Husn al-khuluq (bon caractère)"
  ur: "حسن الخلق ⁦(اچھا کردار)⁩"
summary:
  ar: "معاملة الناس بما يسرهم من قول وفعل مع كف الأذى عنهم، وهو الشطر الثالث من وصية «اتق الله حيثما كنت» — «وخالق الناس بخلق حسن» — ويجمع مع التقوى حقوق الله وحقوق عباده، والجمع بينهما عزيز لا يقوى عليه إلا الكمل من الأنبياء والصديقين عند ابن رجب؛ وغاية حسن الخلق كما وصف الله به المتقين: بذل الندى واحتمال الأذى — «الذين ينفقون في السراء والضراء والكاظمين الغيظ والعافين عن الناس» — وجاء «أكمل المؤمنين إيماناً أحسنهم خلقاً»، وأنه أثقل ما يوضع في الميزان ويبلغ بصاحبه درجة صاحب الصوم والصلاة، وأنه أفضل ما أعطي المرء المسلم وأحبهم إلى الله وأقربهم من النبي مجلساً؛ ومن تعريفاته: قال الإمام أحمد حسن الخلق أن لا تغضب ولا تحتدد وفي رواية أن تحتمل ما يكون من الناس، وقال إسحاق بن راهويه بسط الوجه وأن لا تغضب، وقال بعض أهل العلم كظم الغيظ لله وإظهار الطلاقة والبشر إلا للمبتدع والفاجر والعفو عن الزالين إلا تأديباً أو إقامة حد وكف الأذى عن كل مسلم أو معاهد إلا تغيير منكر أو أخذاً بمظلمة لمظلوم من غير تعد."
  en: "Treating people with what pleases them in word and deed while withholding harm — the third clause of 'fear God wherever you are': 'and keep company with people in good character' — which together with taqwa combines God's rights and His servants' rights, a combination Ibn Rajab calls rare, sustained only by the most complete of prophets and the truthful; its summit, as God describes the muttaqun, is giving freely and bearing hurt — 'who spend in ease and hardship, who restrain their anger and pardon people' — and revelation reports 'the most complete of believers in faith are the best of them in character', that it is the heaviest thing laid in the scales, raising its owner to the rank of the one fasting and praying, the best gift given a Muslim and what makes them most beloved to God and nearest to the Prophet in station; among its definitions: Ahmad's 'that you not become angry or fierce' and, in another report, 'that you bear what comes from people', Ishaq ibn Rahuya's 'a cheerful face and not becoming angry', and some scholars' 'restraining anger for God, showing openness and cheer except to the innovator and the flagrant, pardoning the erring except for discipline or establishing a hadd, and withholding harm from every Muslim and covenanted person except to change an evil or take what is due for the wronged without transgression'."
  es: "Tratar a las personas con lo que les agrada en palabra y obra, absteniéndose de hacerles daño —la tercera cláusula de \"temed a Dios dondequiera que estéis\": \"y juntaos con gente de buen carácter\"— que junto con la taqwa combina los derechos de Dios y los derechos de Sus siervos, una combinación que Ibn Rajab llama rara, sostenida solo por los profetas más completos y los veraces; su cumbre, como Dios describe al muttaqun, es dar generosamente y soportar el daño —\"quienes gastan en la facilidad y en la dificultad, quienes refrenan su ira y perdonan a la gente\"— y la revelación informa que \"los creyentes más completos en la fe son los mejores de ellos en carácter\", que es lo más pesado que se coloca en la balanza, elevando a su dueño al rango de aquel que ayuna y ora, el mejor regalo que se le da a un musulmán y lo que los hace más amados por Dios y más cercanos al Profeta en posición; Entre sus definiciones se encuentran: la de Ahmad, \"que no os enojéis ni os enfurezcáis\" y, en otro informe, \"que soportéis lo que venga de la gente\"; la de Ishaq ibn Rahuya, \"un rostro alegre y no enojarse\"; y la de algunos eruditos, \"refrenar la ira por Dios, mostrar apertura y alegría excepto hacia el innovador y el flagrante, perdonar al que se equivoca excepto para disciplinar o establecer un hadd, y abstenerse de hacer daño a todo musulmán y persona con la que haya hecho un pacto, excepto para corregir un mal o tomar lo que le corresponde al agraviado sin transgresión\"."
  fr: "Traiter les gens avec bienveillance, en paroles et en actes, tout en s'abstenant de leur nuire – le troisième volet de « craignez Dieu où que vous soyez »: « et fréquentez des gens de bonne moralité » – qui, avec la taqwa, unit les droits de Dieu et ceux de Ses serviteurs, une combinaison qu'Ibn Rajab qualifie de rare, pratiquée uniquement par les prophètes les plus accomplis et les plus véridiques; son apogée, comme Dieu décrit les muttaqun, est de donner généreusement et de supporter la souffrance – « ceux qui dépensent dans l'aisance comme dans l'épreuve, qui maîtrisent leur colère et pardonnent aux gens » – et la révélation rapporte que « les croyants les plus accomplis dans la foi sont les meilleurs d'entre eux par leur caractère », que c'est le plus lourd fardeau, élevant celui qui le possède au rang de celui qui jeûne et prie, le meilleur don fait à un musulman et ce qui le rend le plus aimé de Dieu et le plus proche du Prophète en statut; Parmi ses définitions: celle d'Ahmad, « que tu ne te mettes pas en colère et que tu ne deviennes pas féroce », et, dans un autre récit, « que tu supportes ce qui vient des gens », celle d'Ishaq ibn Rahuya, « un visage joyeux et ne pas se mettre en colère », et celle de certains savants, « retenir sa colère pour Dieu, faire preuve d'ouverture et de gaieté sauf envers l'innovateur et le flagrant, pardonner aux errants sauf pour discipliner ou établir un hadd, et s'abstenir de nuire à tout musulman et à toute personne liée par un pacte sauf pour réparer un mal ou prendre ce qui est dû à la victime sans transgression »."
  ur: "لوگوں کے ساتھ وہی سلوک کرنا جو ان کے قول و فعل میں خوش ہو اور نقصان کو روکتے ہوئے - 'خدا سے ڈرو جہاں کہیں بھی ہو' کی تیسری شق: 'اور لوگوں کے ساتھ اچھے اخلاق کے ساتھ صحبت رکھو' - جو تقویٰ کے ساتھ خدا کے حقوق اور اس کے بندوں کے حقوق کو یکجا کرتا ہے، جسے ابن رجب کہتے ہیں نایاب، صرف سب سے مکمل انبیاء اور سچے لوگوں کے ذریعہ برقرار رکھا گیا ہے۔ اس کی چوٹی، جیسا کہ خدا متقین کو بیان کرتا ہے، آزادانہ طور پر اور تکلیف دینے والا ہے - 'جو آسانی اور تنگی میں خرچ کرتے ہیں، جو اپنے غصے کو روکتے ہیں اور لوگوں کو معاف کرتے ہیں' - اور وحی رپورٹ کرتی ہے کہ 'ایمان میں سب سے کامل ایمان والے ان میں سب سے اچھے کردار ہیں'، کہ یہ ترازو میں رکھی سب سے بھاری چیز ہے، اور اس کے مالک کو روزے کا درجہ دینا اور ایک مسلمان کو بہترین تحفہ دینا۔ انہیں خدا کے نزدیک سب سے زیادہ محبوب اور مقام پر پیغمبر کے قریب ترین بناتا ہے۔ اس کی تعریفوں میں سے: احمد کی 'کہ تم غصہ نہ کرو' اور ایک دوسری رپورٹ میں 'کہ تم لوگوں کی طرف سے آنے والی چیزوں کو برداشت کرتے ہو'، اسحاق بن راہویہ کا 'خوشگوار چہرہ اور ناراض نہ ہونا'، اور بعض علماء کا 'خدا کے لیے غصہ کو روکنا، کشادگی اور خوش مزاجی کا مظاہرہ کرنا سوائے بدعتی اور کھلم کھلا، کھلم کھلا اور غصہ کرنے والے کو معاف کرنے کے علاوہ معافی کے لیے استغفار کرنا۔ ہر مسلمان اور عہد یافتہ شخص کی طرف سے نقصان پہنچانا سوائے برائی کو بدلنے یا ظالم کے حق میں جو واجب ہے اسے بغیر زیادتی کے لے جانا۔"
