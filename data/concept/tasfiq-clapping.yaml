  ur: "تصفیق (تالی بجانا)"
summary:
  ar: "التصفيق ضرب إحدى اليدين على الأخرى، وهو للنساء في الصلاة لتنبيه الإمام أو لدرء المار، والرجل يسبح. وكره الفقهاء تصفيق الرجل في الصلاة مطلقاً، وكرهه المالكية للمرأة. ولا يبطل الصلاة عند الشافعية إن كان على وجه اللعب إلا بأثره، والحنفية والمالكية يرون ما يعمل بالكفين في الصلاة عملاً كثيراً مبطلاً. وهو حرام أثناء الخطبة عند الجمهور، وجائز لحاجة معتبرة في غير الصلاة والخطبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5241} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5242} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5243} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5244} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5245} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5246}"
  en: "Tasfiq is striking one palm on the other. In prayer it is for women, to alert the imam to an error or to turn back someone passing in front; a man glorifies God instead, and all agree a man's clapping in prayer is disliked; the Malikis dislike it for women too. On the Shafii view clapping in prayer in play invalidates it; the Hanafis and Malikis treat two-handed clapping as a large act that breaks prayer. It is forbidden during the sermon according to the majority, and allowed for a real need outside prayer and the sermon. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5241} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5242} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5243} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5244} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5245} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5246}"
