label:
  ar: "التصفيق"
  en: "Tasfiq (clapping, in prayer and elsewhere)"
  ur: "تصفیق ⁦(تالی بجانا)⁩"
  es: "Tasfiq (aplaudir, en la oración y en otros contextos)"
  fr: "Tasfiq (applaudissements, en prière et ailleurs)"
  tr: "Alkışlar"
  id: "Tepuk tangan"
summary:
  ar: "التصفيق ضرب إحدى اليدين على الأخرى، وهو للنساء في الصلاة لتنبيه الإمام أو لدرء المار، والرجل يسبح. وكره الفقهاء تصفيق الرجل في الصلاة مطلقاً، وكرهه المالكية للمرأة. ولا يبطل الصلاة عند الشافعية إن كان على وجه اللعب إلا بأثره، والحنفية والمالكية يرون ما يعمل بالكفين في الصلاة عملاً كثيراً مبطلاً. وهو حرام أثناء الخطبة عند الجمهور، وجائز لحاجة معتبرة في غير الصلاة والخطبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5241} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5242} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5243} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5244} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5245} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5246}"
  en: "Tasfiq is striking one palm on the other. In prayer it is for women, to alert the imam to an error or to turn back someone passing in front; a man glorifies God instead, and all agree a man's clapping in prayer is disliked; the Malikis dislike it for women too. On the Shafii view clapping in prayer in play invalidates it; the Hanafis and Malikis treat two-handed clapping as a large act that breaks prayer. It is forbidden during the sermon according to the majority, and allowed for a real need outside prayer and the sermon. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5241} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5242} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5243} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5244} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5245} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5246}"
  es: "Tasfiq consiste en golpear una palma contra la otra. En la oración, las mujeres lo hacen para alertar al imán de un error o para detener a alguien que pasa por delante; un hombre, en cambio, glorifica a Dios, y todos coinciden en que aplaudir durante la oración es desaconsejable; los malikíes también lo desaprueban para las mujeres. Según la escuela shafií, aplaudir durante la oración en un juego la invalida; los hanafíes y los malikíes consideran que aplaudir con ambas manos es un acto grave que interrumpe la oración. Está prohibido durante el sermón, según la mayoría, y se permite solo en casos de necesidad real fuera de la oración y el sermón. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5241} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5242} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5243} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5244} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5245} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5246}"
  fr: "Le tasfiq consiste à frapper une paume contre l'autre. Pendant la prière, les femmes l'utilisent pour signaler une erreur à l'imam ou pour faire rebrousser chemin à une personne qui passe devant elles; chez l'homme, il s'agit d'une glorification de Dieu, et tous s'accordent à dire que les applaudissements d'un homme pendant la prière sont mal vus; les malikites le désapprouvent également chez les femmes. Selon l'école chaféite, applaudir pendant la prière à des fins ludiques l'invalide; les hanafites et les malikites considèrent les applaudissements à deux mains comme un acte important qui rompt la prière. Il est interdit pendant le sermon selon la majorité, sauf en cas de nécessité réelle en dehors de la prière et du sermon. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5241} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5242} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5243} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5244} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5245} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5246}"
  ur: "تصدیق ایک ہتھیلی دوسری پر مار رہی ہے۔ نماز میں عورتوں کے لیے، امام کو غلطی سے آگاہ کرنا یا سامنے سے گزرنے والے کو پیچھے ہٹانا؛ ایک آدمی اس کے بجائے خدا کی تسبیح کرتا ہے، اور سب اس بات پر متفق ہیں کہ نماز میں آدمی کا تالیاں بجانا ناپسندیدہ ہے۔ مالکیہ اسے عورتوں کے لیے بھی ناپسند کرتے ہیں۔ شافعی کے نزدیک نماز میں تالی بجانا اسے باطل کر دیتا ہے۔ احناف اور مالکیہ دو ہاتھ سے تالی بجانے کو ایک بڑا عمل سمجھتے ہیں جس سے نماز ٹوٹ جاتی ہے۔ یہ اکثریت کے مطابق خطبہ کے دوران منع ہے، اور نماز اور خطبہ سے باہر حقیقی ضرورت کے لیے اجازت دی گئی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5241} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ5242} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5243} صفحہ 5244} {حوالہ: فقہ الموسوعہ کویتیہ نور v3 صفحہ 5245}"
  tr: "Alkışlama, kadınların namaz sırasında imamı uyarmak veya geçenleri uzaklaştırmak için bir elin diğer elin üzerine vurmasıdır; erkek tepsih okurken. Hukukçular erkeklerin dua ederken alkışlamasından hiç hoşlanmazken, Malikiler kadınlar için alkışlamaz. Şafiilere göre, namaz, sadece etkisiyle oyunbazca yapılırsa geçersiz sayılmaz; Hanafi ve Malikiler ise ellerle yapılan namazın çok geçersiz bir eylem olduğunu düşünürler. Çoğunluk önünde vaaz yapılırken yasaktır ve namaz ve vaaz dışında geçerli bir ihtiyaç için kabul edilebilir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.5241} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5242} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5243} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5244} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5245} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5246}"
  id: "Tepuk tangan adalah ketukan satu tangan di atas tangan lainnya, yang digunakan untuk wanita saat shalat untuk memperingatkan imam atau mengusir orang yang lewat, sementara pria sedang melafalkan tasbih. Para ahli hukum sama sekali tidak menyukai pria bertepuk tangan saat shalat, sementara Malik tidak suka dengan wanita bertepuk tangan. Menurut syafi'i, shalat tidak dibatalkan jika dilakukan dengan cara main-main kecuali karena efeknya, dan Hanafi serta Malik menganggap bahwa apa yang dilakukan dengan tangan dalam shalat adalah tindakan yang sangat tidak sah. Hal ini dilarang selama khotbah di hadapan mayoritas dan diperbolehkan untuk kebutuhan yang sah di luar shalat dan khotbah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5241} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5242} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.5243} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5244} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5245} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5246}"
