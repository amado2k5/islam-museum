label: { ar: "الالتباس", en: "Iltibas (confusion between the lawful and the forbidden)", es: "Iltibas (confusión entre lo lícito y lo ilícito)", fr: "Iltibas (confusion entre le licite et l'interdit)", ur: "التباس ⁦(حلال اور حرام کے درمیان الجھن)⁩", tr: "Karışıklık", id: "Kebingungan" }
summary:
  ar: "الالتباس في اللغة الخلط، ويأتي بمعنى الاشتباه والإشكال، وهو عند المالكية لفظ مستعمل بذاته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3282} وإذا التبس الحلال بالحرام رجح جانب الحرمة احتياطا، كمن اشتبهت عليه أجنبية بأخته من الرضاع، أو المذكاة بالميتة، وإذا التبست القبلة اجتهد وتحرى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3283} وعند جمهور الفقهاء يجتهد ويتحرى فيما التبس من الماء الطاهر بالنجس أو الأواني والثياب، وأحكامه في مصطلح ⁦(اشتباه)⁩. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3283}"
  en: "Iltibas in the lexical sense means mixing, and also confusion or perplexity; the Malikis use the word in its own right. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3282} When the lawful is mixed with the forbidden, the forbidden side is preferred as a precaution: a stranger woman confused with a sister by nursing, or a slaughtered animal confused with carrion. When the qibla is unclear, one searches and decides by reasoning. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3283} Most jurists hold that clean water, vessels and clothes confused with unclean ones are judged by reasoned search. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3283}"
  es: "Iltibas, en sentido léxico, significa mezcla, y también confusión o perplejidad; los malikíes usan la palabra en su propio sentido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3282} Cuando lo lícito se mezcla con lo ilícito, se prefiere lo ilícito como precaución: una mujer extraña confundida con una hermana por amamantarla, o un animal sacrificado confundido con carroña. Cuando la qibla no está clara, se busca y se decide mediante el razonamiento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3283} La mayoría de los juristas sostienen que el agua limpia, los recipientes y la ropa confundidos con los impuros se juzgan mediante una búsqueda razonada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3283}"
  fr: "Le terme « iltibas », au sens littéral, signifie mélange, mais aussi confusion ou perplexité; les Malikites l’emploient à part entière. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3282} Lorsque le licite est mêlé à l’illicite, on privilégie, par précaution, l’illicite: par exemple, une femme étrangère prise pour une sœur par l’allaitement, ou un animal abattu pris pour une charogne. Lorsque la qibla est incertaine, on procède à une recherche et on tranche par raisonnement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3283} La plupart des juristes estiment que la distinction entre eau pure, récipients et vêtements purs et impurs se fait par une recherche raisonnée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3283}"
  ur: "لغوی معنوں میں التباس کا مطلب ہے اختلاط، اور الجھن یا الجھن بھی۔ مالکی اس لفظ کو اپنے حق میں استعمال کرتے ہیں۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 3282} جب حلال کو حرام کے ساتھ ملایا جاتا ہے تو احتیاط کے طور پر حرام کو ترجیح دی جاتی ہے: اجنبی عورت دودھ پلانے سے بہن کے ساتھ الجھتی ہے، یا ذبح شدہ جانور کو مردار سے الجھتا ہے۔ جب قبلہ واضح نہ ہو تو استدلال تلاش کر کے فیصلہ کرتا ہے۔ {حوالہ: فقہ الموسوعہ-کویتیہ-نور-v3 صفحہ 3283} اکثر فقہاء کا خیال ہے کہ صاف پانی، برتن اور کپڑے جو ناپاک چیزوں سے ملتے ہیں ان کا فیصلہ استدلال سے کیا جاتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 3283}"
  tr: "Dildeki belirsizlik karışıklıktır, yani şüphe veya kafa karışıklığı anlamına gelir ve Malikilere göre bu terim kendi başına kullanılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3282} Yasal olan yasa dışı ile karıştırılırsa, yasak tarafı önlem olarak tercih edilir; örneğin mahram olmayan bir kadın kız kardeşinin emzirdiğinden veya ölen kişilerden şüphelenirse ve kıble karışıksa çabalar ve araştırma yapar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3283} Çoğu hukukçuya göre, saf su ile ilgili karışıklığı araştırmak ve saf su, mutfak gereçleri veya giysiler arasında karıştırılmak ve kararlar (karışıklık) olarak belirtilmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3283}"
  id: "Ambiguitas dalam bahasa adalah kebingungan, yang berarti keraguan atau kebingungan, dan menurut Maliki, istilah ini digunakan dengan sendirinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3282} Jika yang sah disalahartikan dengan yang tidak sah, sisi larangan lebih dipilih sebagai tindakan pencegahan, misalnya jika seorang wanita non-mahram mencurigai saudara perempuannya menyusui atau orang yang telah meninggal, dan jika kibla itu bingung, ia berusaha dan menyelidiki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3283} Menurut mayoritas ahli hukum, seseorang harus berusaha dan menyelidiki apa yang membingungkan mengenai air murni dari kotoran, peralatan, atau pakaian, dan keputusannya ada dalam istilah (kebingungan). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3283}"
