id: concept/iltibas
class: concept
kind: legal
label: { ar: "الالتباس", en: "Iltibas (confusion between the lawful and the forbidden)" }
summary:
  ar: "الالتباس في اللغة الخلط، ويأتي بمعنى الاشتباه والإشكال، وهو عند المالكية لفظ مستعمل بذاته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3282} وإذا التبس الحلال بالحرام رجح جانب الحرمة احتياطا، كمن اشتبهت عليه أجنبية بأخته من الرضاع، أو المذكاة بالميتة، وإذا التبست القبلة اجتهد وتحرى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3283} وعند جمهور الفقهاء يجتهد ويتحرى فيما التبس من الماء الطاهر بالنجس أو الأواني والثياب، وأحكامه في مصطلح (اشتباه). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3283}"
  en: "Iltibas in the lexical sense means mixing, and also confusion or perplexity; the Malikis use the word in its own right. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3282} When the lawful is mixed with the forbidden, the forbidden side is preferred as a precaution: a stranger woman confused with a sister by nursing, or a slaughtered animal confused with carrion. When the qibla is unclear, one searches and decides by reasoning. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3283} Most jurists hold that clean water, vessels and clothes confused with unclean ones are judged by reasoned search. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3283}"
