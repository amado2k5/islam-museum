label:
  ar: الزكاة
  en: Zakat (alms tax)
summary:
  ar: "تعرّف الزكاة عند الفقهاء بأنها تمليك جزء مخصوص من مال مخصوص لشخص مخصوص، وهي الركن الثالث بعد الشهادتين والصلاة {cite:min-qadaya-al-mal-wal-amal-azhar p. 43} {cite:min-qadaya-al-mal-wal-amal-azhar p. 45}. ويعدّد الكتاب نصب الإبل خمسًا، والبقر ثلاثين، والغنم أربعين {cite:min-qadaya-al-mal-wal-amal-azhar p. 46}، ونصاب الذهب عشرين مثقالًا، والفضة مائتي درهم، والواجب فيهما ربع العشر {cite:min-qadaya-al-mal-wal-amal-azhar p. 46}. وفي الزروع يجب العشر فيما سُقي بماء المطر، ونصفه فيما سُقي بالآلات {cite:min-qadaya-al-mal-wal-amal-azhar p. 47}، ويجب الخمس في المعدن والركاز {cite:min-qadaya-al-mal-wal-amal-azhar p. 47}. وتُصرف الزكاة إلى ثمانية أصناف {cite:min-qadaya-al-mal-wal-amal-azhar p. 48}، ويذكر الكتاب أن المؤلفة قلوبهم سقطوا بعد وفاة النبي، ويورد رأي الشوكاني بأن الصنف باقٍ عند الحاجة {cite:min-qadaya-al-mal-wal-amal-azhar p. 49}. وتجب الزكاة في أوراق البنكنوت والأسهم والسندات {cite:min-qadaya-al-mal-wal-amal-azhar p. 46}. وفي حلي النساء خلاف المذاهب {cite:min-qadaya-al-mal-wal-amal-azhar p. 46}. ويقترح المؤلف رأيًا خاصًا في حكمة تحديد النسبة بأنها تقاس بنسبة العجز في الجماعة، وهو رأيه يعرضه بوصفه كذلك {cite:min-qadaya-al-mal-wal-amal-azhar p. 50}. ويقرر أن لولي الأمر أن يأخذ الزكاة ممن يمنعها، ولو بالقتال {cite:min-qadaya-al-mal-wal-amal-azhar p. 51}. وقرر مؤتمر مجمع البحوث الإسلامية في دورته الثانية أن الضرائب لا تغني عن الزكاة، وأن نصاب عروض التجارة يقوَّم بالذهب {cite:min-qadaya-al-mal-wal-amal-azhar p. 54}، وأن صافي غلة العمائر الاستغلالية يُزكّى بربع العشر {cite:min-qadaya-al-mal-wal-amal-azhar p. 54}. وتاريخ هذا المؤتمر مضطرب في الكتاب، انظر مدخل الضرائب. ويذكر المؤلف أن عائد الموارد الحرة المستخدمة في الإنتاج من حق الفقراء، فتقابله الزكاة، فالسائمة في المرعى المباح فيها الزكاة، والمعلوفة لا زكاة فيها عند الجمهور كما يذكر، وفي الزرع البعلي العشر وفي المسقي بمياه مكلّفة نصف العشر {cite:usul-iqtisad-islami-0660 p. 17} {cite:usul-iqtisad-islami-0660 p. 18}. ويعدّ الزكاة أحد موارد بيت مال الزكاة ومصارفه في سورة التوبة {cite:usul-iqtisad-islami-0660 p. 63}. يعرض المؤلف حديث أخذ شطر المال من مانع الزكاة بوصفه عقوبة سياسية لا تشريعًا عامًا، نقلًا عن عبد الرحمن تاج، ويذكر أن زكاة النقود ربع العشر في الظروف العادية عند جمهور العلماء، وأن الإمام قد يوظف توظيفات إضافية في الظروف الاستثنائية، وأن الزكاة لا تُعطى للغني أو للقوي القادر على العمل."
  en: "Jurists define zakat as the transfer of a prescribed portion of a prescribed property to a prescribed recipient, the third pillar (pp. 43, 45). The book lists nisab for camels (5), cattle (30) and sheep (40), gold (20 mithqal) and silver (200 dirhams) at a quarter-tenth, land at a tenth or half-tenth by irrigation, and one-fifth on minerals and treasure (pp. 46-47). Banknotes and shares are zakatable (p. 46). The eight recipient categories are listed (pp. 48-49); the book says the muallafa lapsed after the Prophet but cites al-Shawkani for their continuance (p. 49). The author offers his own reading of the rate (p. 50). The 1965 Academy conference resolutions are reported on p. 54, with a date the book prints in conflicting forms."
