label:
  ar: الزكاة
  en: Zakat (alms tax)
  es: "Zakat (impuesto de limosna)"
  fr: "Zakat (impôt d'aumône)"
  ur: "زکوٰۃ ⁦(بھیک ٹیکس)⁩"
  tr: "Zekat"
  id: "Zakat"
summary:
  ar: "تعرّف الزكاة عند الفقهاء بأنها تمليك جزء مخصوص من مال مخصوص لشخص مخصوص، وهي الركن الثالث بعد الشهادتين والصلاة {cite:min-qadaya-al-mal-wal-amal-azhar p. 43} {cite:min-qadaya-al-mal-wal-amal-azhar p. 45}. ويعدّد الكتاب نصب الإبل خمسًا، والبقر ثلاثين، والغنم أربعين {cite:min-qadaya-al-mal-wal-amal-azhar p. 46}، ونصاب الذهب عشرين مثقالًا، والفضة مائتي درهم، والواجب فيهما ربع العشر {cite:min-qadaya-al-mal-wal-amal-azhar p. 46}. وفي الزروع يجب العشر فيما سُقي بماء المطر، ونصفه فيما سُقي بالآلات {cite:min-qadaya-al-mal-wal-amal-azhar p. 47}، ويجب الخمس في المعدن والركاز {cite:min-qadaya-al-mal-wal-amal-azhar p. 47}. وتُصرف الزكاة إلى ثمانية أصناف {cite:min-qadaya-al-mal-wal-amal-azhar p. 48}، ويذكر الكتاب أن المؤلفة قلوبهم سقطوا بعد وفاة النبي، ويورد رأي الشوكاني بأن الصنف باقٍ عند الحاجة {cite:min-qadaya-al-mal-wal-amal-azhar p. 49}. وتجب الزكاة في أوراق البنكنوت والأسهم والسندات {cite:min-qadaya-al-mal-wal-amal-azhar p. 46}. وفي حلي النساء خلاف المذاهب {cite:min-qadaya-al-mal-wal-amal-azhar p. 46}. ويقترح المؤلف رأيًا خاصًا في حكمة تحديد النسبة بأنها تقاس بنسبة العجز في الجماعة، وهو رأيه يعرضه بوصفه كذلك {cite:min-qadaya-al-mal-wal-amal-azhar p. 50}. ويقرر أن لولي الأمر أن يأخذ الزكاة ممن يمنعها، ولو بالقتال {cite:min-qadaya-al-mal-wal-amal-azhar p. 51}. وقرر مؤتمر مجمع البحوث الإسلامية في دورته الثانية أن الضرائب لا تغني عن الزكاة، وأن نصاب عروض التجارة يقوَّم بالذهب {cite:min-qadaya-al-mal-wal-amal-azhar p. 54}، وأن صافي غلة العمائر الاستغلالية يُزكّى بربع العشر {cite:min-qadaya-al-mal-wal-amal-azhar p. 54}. وتاريخ هذا المؤتمر مضطرب في الكتاب، انظر مدخل الضرائب. ويذكر المؤلف أن عائد الموارد الحرة المستخدمة في الإنتاج من حق الفقراء، فتقابله الزكاة، فالسائمة في المرعى المباح فيها الزكاة، والمعلوفة لا زكاة فيها عند الجمهور كما يذكر، وفي الزرع البعلي العشر وفي المسقي بمياه مكلّفة نصف العشر {cite:usul-iqtisad-islami-0660 p. 17} {cite:usul-iqtisad-islami-0660 p. 18}. ويعدّ الزكاة أحد موارد بيت مال الزكاة ومصارفه في سورة التوبة {cite:usul-iqtisad-islami-0660 p. 63}. يعرض المؤلف حديث أخذ شطر المال من مانع الزكاة بوصفه عقوبة سياسية لا تشريعًا عامًا، نقلًا عن عبد الرحمن تاج، ويذكر أن زكاة النقود ربع العشر في الظروف العادية عند جمهور العلماء، وأن الإمام قد يوظف توظيفات إضافية في الظروف الاستثنائية، وأن الزكاة لا تُعطى للغني أو للقوي القادر على العمل."
  en: "Jurists define zakat as the transfer of a prescribed portion of a prescribed property to a prescribed recipient, the third pillar (pp. 43, 45). The book lists nisab for camels (5), cattle (30) and sheep (40), gold (20 mithqal) and silver (200 dirhams) at a quarter-tenth, land at a tenth or half-tenth by irrigation, and one-fifth on minerals and treasure (pp. 46-47). Banknotes and shares are zakatable (p. 46). The eight recipient categories are listed (pp. 48-49); the book says the muallafa lapsed after the Prophet but cites al-Shawkani for their continuance (p. 49). The author offers his own reading of the rate (p. 50). The 1965 Academy conference resolutions are reported on p. 54, with a date the book prints in conflicting forms."
  es: "Los juristas definen el zakat como la transferencia de una porción prescrita de una propiedad prescrita a un receptor prescrito, el tercer pilar (pp. 43, 45). El libro enumera el nisab para camellos (5), ganado vacuno (30) y ovejas (40), oro (20 mithqal) y plata (200 dirhams) a un cuarto de décima parte, tierra a una décima o media décima parte con riego, y una quinta parte sobre minerales y tesoros (pp. 46-47). Los billetes y acciones son zakatables (p. 46). Se enumeran las ocho categorías de receptores (pp. 48-49); el libro dice que el muallafa caducó después del Profeta, pero cita a al-Shawkani para su continuidad (p. 49). El autor ofrece su propia interpretación de la tasa (p. 50). Las resoluciones de la conferencia de la Academia de 1965 se citan en la p. 54, con una fecha que el libro imprime de forma contradictoria."
  fr: "Les juristes définissent la zakat comme le transfert d'une part déterminée d'un bien déterminé à un bénéficiaire déterminé, le troisième pilier (p. 43, 45). L'ouvrage indique le nisab pour les chameaux (5), les bovins (30) et les moutons (40), l'or (20 mithqal) et l'argent (200 dirhams) à hauteur d'un quart de dixième, les terres irriguées à hauteur d'un dixième ou d'un demi-dixième, et les minéraux et trésors à hauteur d'un cinquième (p. 46-47). Les billets de banque et les actions sont soumis à la zakat (p. 46). Les huit catégories de bénéficiaires sont énumérées (p. 48-49); l'ouvrage indique que les muallafa ont cessé après le Prophète, mais cite al-Shawkani pour justifier leur maintien (p. 49). L'auteur propose sa propre interprétation du taux (p. 50). Les résolutions de la conférence de l'Académie de 1965 sont rapportées à la page 54, avec une date imprimée de manière contradictoire dans l'ouvrage."
  ur: "فقہاء زکوٰۃ کی تعریف ایک مقررہ جائیداد کے ایک مقررہ حصے کو ایک مقررہ وصول کنندہ کو منتقل کرنے کے طور پر کرتے ہیں، تیسرا ستون ⁦(صفحہ 43، 45)⁩۔ کتاب میں اونٹ (5)، مویشی (30) اور بھیڑ بکریوں (40)، سونا ⁦(20 مثقال)⁩ اور چاندی ⁦(200 درہم)⁩ چوتھائی دسواں، زمین کے دسویں یا آدھے حصے پر آبپاشی، اور معدنیات اور خزانے پر پانچواں حصہ درج کیا گیا ہے ⁦(صفحہ 46-47)⁩۔ بینک نوٹ اور شیئرز قابل زکوٰۃ ہیں ⁦(ص46)⁩۔ آٹھ وصول کنندگان کے زمرے درج ہیں (pp. 48-49)؛ کتاب کہتی ہے کہ مولفہ نبی کے بعد ختم ہو گئے لیکن ان کے تسلسل کے لیے الشوکانی کا حوالہ دیتے ہیں ⁦(صفحہ 49)⁩۔ مصنف اپنی شرح کا مطالعہ پیش کرتا ہے ⁦(ص 50)⁩۔ 1965 اکیڈمی کانفرنس کی قراردادیں صفحہ پر درج ہیں۔ 54، تاریخ کے ساتھ کتاب متضاد شکلوں میں پرنٹ کرتی ہے۔"
  tr: "Zekât, İslam hukukçuları tarafından belirli bir servetin belirli bir kısmının belirli bir kişiye devredilmesi olarak tanımlanır. İman ve namazdan sonra İslam'ın üçüncü şartıdır. Kitapta zekâta tabi deve sayısı en az beş, sığır sayısı otuz ve koyun sayısı kırk olarak belirtilmiştir. Zekâta tabi altın miktarı en az yirmi miskal, gümüş miktarı ise iki yüz dirhemdir. Bunların zekâtı onda birinin dörtte biridir. Mahsuller için, yağmurla sulanan arazilerde onda bir, makineyle sulanan arazilerde ise onda yarım zekât verilir. 47. Madenlerden ve gömülü hazinelerden beşte bir (humus) zekât verilir. {cite:min-qadaya-al-mal-wal-amal-azhar s. 47}. Zekât sekiz kategoriye dağıtılır. {cite:min-qadaya-al-mal-wal-amal-azhar s. 48}. Kitap, Peygamberin ölümünden sonra kalpleri kazanılacak olanlar (al-mu'allafah qulubuhum) kategorisinin ortadan kalktığını belirtiyor ve el-Şevkani'nin bu kategorinin gerektiğinde geçerliliğini koruduğu görüşünü aktarıyor. {cite:min-qadaya-al-mal-wal-amal-azhar s. 49}. Zekat, banknotlar, hisse senetleri ve tahviller üzerinden verilir. {cite:min-qadaya-al-mal-wal-amal-azhar s. 46}. Kadınların takıları konusunda farklı görüşler mevcuttur. {cite:min-qadaya-al-mal-wal-amal-azhar s. 46}. Yazar, yüzde oranının toplumun açığına göre ölçülmesinin hikmetine dair özel bir görüş öne sürüyor ve bu görüşü şu şekilde sunuyor: {cite:min-qadaya-al-mal-wal-amal-azhar s. 50}. Yazar, yöneticinin zekâtı ödemeyi reddedenlerden zorla bile zekât toplama hakkına sahip olduğunu ileri sürüyor {kaynak:min-qadaya-al-mal-wal-amal-azhar s. 51}. İslam Araştırma Akademisi Konferansı'nın ikinci oturumunda, vergilerin zekâtın yerine geçmediğine, zekâta tabi malların asgari miktarının altın cinsinden değerlendirildiğine {kaynak:min-qadaya-al-mal-wal-amal-azhar s. 54} ve ticari binalardan elde edilen net gelirin onda birinin dörtte biri oranında zekâta tabi olduğuna karar verildi {kaynak:min-qadaya-al-mal-wal-amal-azhar s. 54}. Bu konferansın tarihi kitapta açıkça belirtilmemiştir; vergilerle ilgili maddeye bakınız. Yazar, üretimde kullanılan serbestçe erişilebilir kaynaklardan elde edilen gelirlerin yoksullara ait olduğunu ve bu nedenle zekâta tabi olduğunu belirtiyor. Yazar, helal meralarda otlayan hayvanlardan zekât alındığını, ancak çoğu âlimin görüşüne göre hayvanlarla beslenenlerden zekât alınmadığını açıklıyor. Ayrıca, yağmurla sulanan ürünlerden zekâtın onda bir, sulanan ürünlerden ise onda yarım olduğunu belirtiyor (Tevbe Suresi, 17. ve 18. ayetler). Zekât, Tevbe Suresi'nde de belirtildiği gibi (Tevbe Suresi, 63. ayet), zekât hazinesinin (Beytü'l-Mal) kaynaklarından ve giderlerinden biri olarak kabul edilir. Yazar, zekâtı esirgeyenlerin mallarının yarısının alınmasıyla ilgili hadisi, genel bir kanun değil, siyasi bir ceza olarak Abdurrahman Tac'tan alıntılayarak sunuyor. Çoğu âlimin görüşüne göre, normal şartlarda paradan alınan zekâtın onda birin dörtte biri olduğunu ve imamın istisnai durumlarda ek fonlar tahsis edebileceğini belirtiyor. Ayrıca zekâtın zenginlere veya fiziksel ve zihinsel olarak çalışmaya elverişli olanlara verilmediğini belirtiyor."
  id: "Zakat didefinisikan oleh ahli hukum Islam sebagai pengalihan kepemilikan sebagian harta tertentu kepada orang tertentu. Ini adalah rukun Islam ketiga setelah dua syahadat dan salat. Kitab ini mencantumkan jumlah minimum unta yang dikenakan zakat sebanyak lima ekor, sapi sebanyak tiga puluh ekor, dan domba sebanyak empat puluh ekor. Jumlah minimum emas yang dikenakan zakat adalah dua puluh mithqal, dan perak sebanyak dua ratus dirham. Zakat yang wajib dibayarkan untuk ini adalah seperempat dari sepersepuluh. Untuk tanaman, sepersepuluh wajib dibayarkan untuk lahan tadah hujan dan setengah dari sepersepuluh untuk lahan yang diairi dengan mesin. 47. Seperlima (khums) wajib dibayarkan untuk mineral dan harta karun yang terkubur. {cite:min-qadaya-al-mal-wal-amal-azhar p. 47}. Zakat dibagi menjadi delapan kategori. {cite:min-qadaya-al-mal-wal-amal-azhar p. 48}. Buku ini menyebutkan bahwa kategori orang-orang yang hatinya harus dimenangkan (al-mu'allafah qulubuhum) tidak lagi ada setelah wafatnya Nabi, dan mengutip pendapat al-Shawkani bahwa kategori ini tetap berlaku jika diperlukan. {cite:min-qadaya-al-mal-wal-amal-azhar hlm. 49}. Zakat wajib dibayarkan atas uang kertas, saham, dan obligasi. {cite:min-qadaya-al-mal-wal-amal-azhar hlm. 46}. Terdapat perbedaan pendapat di antara berbagai mazhab mengenai perhiasan wanita. {cite:min-qadaya-al-mal-wal-amal-azhar hlm. 46}. Penulis mengusulkan pandangan khusus tentang kebijaksanaan menentukan persentase yang diukur berdasarkan defisit masyarakat, dan menyajikan pandangan ini sebagai berikut {cite:min-qadaya-al-mal-wal-amal-azhar hlm. 50}. Ia menegaskan bahwa penguasa memiliki hak untuk memungut zakat dari mereka yang menolak membayarnya, bahkan dengan paksa {kutip:min-qadaya-al-mal-wal-amal-azhar hlm. 51}. Sesi kedua Konferensi Akademi Penelitian Islam memutuskan bahwa pajak tidak menggantikan zakat, bahwa jumlah minimum barang dagangan yang dikenakan zakat dinilai dalam emas {kutip:min-qadaya-al-mal-wal-amal-azhar hlm. 54}, dan bahwa pendapatan bersih dari bangunan komersial dikenakan zakat dengan tarif seperempat dari sepersepuluh {kutip:min-qadaya-al-mal-wal-amal-azhar hlm. 54}. Tanggal konferensi ini tidak jelas dalam buku; lihat entri tentang pajak. Penulis menyatakan bahwa keuntungan dari sumber daya yang tersedia secara bebas yang digunakan dalam produksi adalah milik kaum miskin, dan karenanya dikenakan zakat. Ia menjelaskan bahwa zakat wajib dikenakan pada hewan ternak yang merumput di padang rumput yang halal, sedangkan zakat tidak wajib dikenakan pada mereka yang diberi makan hewan, menurut mayoritas ulama. Ia juga menyebutkan bahwa zakat adalah sepersepuluh untuk tanaman tadah hujan dan setengah sepersepuluh untuk tanaman irigasi (lihat Surah At-Tawbah, ayat 17, ayat 18). Zakat dianggap sebagai salah satu sumber dan pengeluaran kas zakat (Bait al-Mal), sebagaimana disebutkan dalam Surah At-Tawbah (lihat Surah At-Tawbah, ayat 63). Penulis menyajikan hadits tentang mengambil setengah harta orang yang menahan zakat sebagai hukuman politik, bukan hukum umum, mengutip Abdur-Rahman Taj. Ia mencatat bahwa zakat atas uang adalah seperempat dari sepersepuluh dalam keadaan normal, menurut mayoritas ulama, dan bahwa imam dapat mengalokasikan dana tambahan dalam keadaan luar biasa. Ia selanjutnya menyatakan bahwa zakat tidak diberikan kepada orang kaya atau kepada mereka yang secara fisik dan mental mampu bekerja."
