issue:
  ar: "هل جاء الإسلام مكملاً للرسالات السابقة في أصولها، أم ناسخاً لها؟"
  en: "Did Islam come to complete earlier messages in their foundations, or to replace them?"
perspectives:
- tradition: sunni
  id: sunni-sharawi-completion
  stance:
    ar: "الإسلام مكمّل للرسالات السابقة في الأصول، وفيه شرائع تناسب كل زمان"
    en: "Islam completes earlier messages in their foundations and has laws suited to every age"
  summary:
    ar: "يقرر الشعراوي أن الأديان السابقة في أصولها موجودة في الإسلام، وأن الإسلام جاء بشرائع تناسب كل زمان ومكان، وأنه لن يأتي بعد الرسول ما يطلب من أمته أن تصدقه {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1592}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1593}."
    en: "Sha'rawi holds that the foundations of earlier religions are present in Islam, which came with laws suited to every age and place, and that nothing will come after the Prophet that asks his community to confirm it {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1592}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1593}."
