id: concept/completion-of-earlier-messages
class: concept
kind: doctrine
label:
  ar: كمال الرسالة الخاتمة لما قبلها
  en: The completion of the final message of earlier ones
summary:
  ar: "يرى الشعراوي أن الإسلام لم يأت ليهدم الأديان، بل ليكمل ما فيها من صحيح العقائد والأخبار والقصص، ويضيف إليها شرائع تناسب كل زمان ومكان. ويستشهد بقول الرسول في تمثيل النبوة بالبنيان الذي تركت فيه لبنة واحدة، وبقوله تعالى إنه أكمل الدين، ويقرر أن الغاية من الإسلام اكتملت، وأن المنهج نزل بتمامه {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1592}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1593}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1588}."
  en: "Sha'rawi holds that Islam did not come to abolish earlier religions but to complete what they contain of sound belief, reports and stories, adding laws suited to every age and place. He cites the Prophet's image of a building in which one brick was missing, and the Qur'anic statement that God has completed the religion, and holds that the purpose of Islam is complete and the law has come whole {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1592}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1593}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1588}."
