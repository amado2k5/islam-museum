id: concept/completion-of-earlier-messages
class: concept
kind: doctrine
label:
  ar: كمال الرسالة الخاتمة لما قبلها
  en: The completion of the final message of earlier ones
  es: "La finalización del último mensaje de los anteriores"
  fr: "L'achèvement du dernier message des précédents"
  ur: "پہلے والوں کے آخری پیغام کی تکمیل"
  tr: "Kamal, öncekilerin son mesajı"
  id: "Kamal pesan terakhir untuk apa yang terjadi sebelumnya"
tags: ["nubuwat-browser", "nubuwat-nubuwwa"]
summary:
  ar: "يرى الشعراوي أن الإسلام لم يأت ليهدم الأديان، بل ليكمل ما فيها من صحيح العقائد والأخبار والقصص، ويضيف إليها شرائع تناسب كل زمان ومكان. ويستشهد بقول الرسول في تمثيل النبوة بالبنيان الذي تركت فيه لبنة واحدة، وبقوله تعالى إنه أكمل الدين، ويقرر أن الغاية من الإسلام اكتملت، وأن المنهج نزل بتمامه {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1592}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1593}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1588}."
  en: "Sha'rawi holds that Islam did not come to abolish earlier religions but to complete what they contain of sound belief, reports and stories, adding laws suited to every age and place. He cites the Prophet's image of a building in which one brick was missing, and the Qur'anic statement that God has completed the religion, and holds that the purpose of Islam is complete and the law has come whole {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1592}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1593}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1588}."
  es: "Sha'rawi sostiene que el Islam no vino a abolir las religiones anteriores, sino a completar lo que contienen de creencias sólidas, relatos e historias, añadiendo leyes adecuadas para cada época y lugar. Cita la imagen del Profeta de un edificio al que le faltaba un ladrillo, y la afirmación coránica de que Dios ha completado la religión, y sostiene que el propósito del Islam es completo y la ley ha llegado íntegra {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1592}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1593}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1588}."
  fr: "Sha'rawi soutient que l'islam n'est pas venu abolir les religions antérieures, mais compléter ce qu'elles contiennent de croyances, de récits et de traditions solides, en y ajoutant des lois adaptées à chaque époque et à chaque lieu. Il cite l'image du Prophète d'un édifice auquel il manquait une brique, ainsi que l'affirmation coranique selon laquelle Dieu a parachevé la religion. Il affirme ainsi que le but de l'islam est atteint et que la loi est complète."
  ur: "شعراوی کا خیال ہے کہ اسلام پہلے کے مذاہب کو ختم کرنے کے لیے نہیں آیا تھا بلکہ اس لیے آیا تھا کہ ان میں صحیح عقیدہ، رپورٹس اور کہانیاں شامل ہوں، ہر زمانے اور جگہ کے لیے موزوں قوانین شامل کیے جائیں۔ اس نے نبی کی ایک عمارت کی تصویر کا حوالہ دیا جس میں ایک اینٹ غائب تھی، اور قرآنی بیان کہ خدا نے دین کو مکمل کر دیا ہے، اور یہ کہتا ہے کہ اسلام کا مقصد مکمل ہے اور قانون مکمل ہو چکا ہے صفحہ 1593 {حوالہ: تفسیر شعراوی خواطر اسکین جلد 2 صفحہ 1588}۔"
  tr: "El-Şaarawi, İslam'ın dinleri yok etmek için değil, doğru inançlar, haberler ve hikayeler açısından onların içindekileri tamamlamak ve her zaman ve mekâna uygun yasalar eklemek için geldiğine inanır. Peygamber'in peygamberliği tek bir binanın bırakıldığı yapı olarak tasvir ettiği ve dini mükemmelleştirdiğini, İslam'ın amacının tamamlandığını ve metodolojinin tamamen vahyedildiğini belirten ifadesini aktarır {cite:tafsir-sharawi-khawatir-scan-vol-2 s.1592}{cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1593}{cite:tafsir-sharawi-khawatir-scan-vol-cül-2 s.1588}."
  id: "Al-Shaarawi percaya bahwa Islam tidak datang untuk menghancurkan agama, melainkan untuk melengkapi apa yang ada di dalamnya dalam bentuk kepercayaan, laporan, dan cerita yang benar, serta menambahkan hukum yang sesuai untuk setiap waktu dan tempat. Ia mengutip pernyataan Nabi yang menggambarkan kenabian sebagai struktur di mana satu bangunan ditinggalkan, dan bahwa Ia menyempurnakan agama, menegaskan bahwa tujuan Islam telah tercapai dan metodologinya telah diwahyukan secara keseluruhan {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1592}{cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1593}{cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1588}."
