id: concept/asking-for-a-king-for-jihad
class: concept
kind: belief
label: { ar: "طلب الملك للجهاد", en: "Asking for a king to fight (the notables of Banu Isra'il)", ur: "جہاد کے لیے بادشاہ کا مطالبہ" }
summary:
  ar: "يعرض الشعراوي قصة أشراف بني إسرائيل الذين طلبوا من نبيهم ملكاً ليقاتلوا في سبيل الله، ويرى أن النبي موجه لا منفذ، وأن الطلب كان لصالحهم ثم تلكأوا فيه {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1041} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1044}."
  en: "Sha'rawi tells how the notables of Banu Isra'il asked their prophet for a king to fight in God's cause. He holds that the prophet guides and does not command in the field, and that the request was in their own interest, which they then dragged out {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1041} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1044}."
  ur: "شعراوی بنی اسرائیل کے سرداروں کا قصہ بیان کرتے ہیں جنہوں نے اپنے نبی سے بادشاہ مانگا تاکہ وہ اللہ کی راہ میں لڑیں۔ ان کے نزدیک نبی رہنمائی کرتا ہے، میدان کا حکم نہیں دیتا، اور یہ مطالبہ ان کے اپنے فائدے میں تھا جسے بعد میں انہوں نے ٹالا {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1041} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1044}۔"
