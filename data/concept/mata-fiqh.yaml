id: concept/mata-fiqh
class: concept
kind: legal
label:
  ar: "المَتَاع"
  en: "Mata' (household goods): their ownership between spouses, the cargo jettison, and the mosque"
  ur: "متاع (گھریلو سامان): زوجین میں ملکیت، کشتی کا سامان پھینکنا، اور مسجد کا سامان"
summary:
  ar: "المتاع في اللغة اسم لكل شيء ينتفع به، فيتناول متعة الحج ومتعة الطلاق وما يستمتع به الإنسان في حوائجه، واصطلاحاً كل ما ينتفع به من عروض الدنيا {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13832}. ويجب على الزوج توفير متاع البيت لزوجته من آلات الأكل والشرب والطبخ والنوم، وهو من النفقة الواجبة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13832}. وإذا اختلف فيه الزوجان أو ورثتهما، فالقاعدة أن وضع اليد مرجح بيمين صاحبها عند عدم البينة، وما يصلح للرجال فللزوج، وما يصلح للنساء فللزوجة، وما يصلح لهما فللحنفية والمالكية للرجل، وللحنابلة بينهما، وللشافعية يتحالفان {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13832-13833}. وإذا تنازعت زوجات الرجل في متاع البيت الواحد فمتاع النساء بينهن بالسواء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13833}. وتخلية العقار المبيع من متاع غير المشتري شرط في قبضه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13833}. وإلقاء المتاع عند خوف غرق السفينة جائز، ويجب لنجاة الراكب المحترم، ومن ألقى متاع غيره بلا إذنه ضمنه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13834}. وعند الشافعية والحنابلة لا يقام حد السرقة على من سرق من متاع المسجد المعد لانتفاع الناس، لشبهة الانتفاع {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13834}."
  en: "Mata', in lexicon, is the name for anything that gives benefit, covering the pilgrimage enjoyment, the divorce gift, and whatever a person uses for his needs; in technical use it is any goods of this world that are of benefit {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13832}. A husband must supply his wife with household goods, utensils for eating, drinking, cooking and sleeping, as part of the maintenance due to her {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13832}. When spouses or their heirs dispute such goods, possession is a presumption, and the owner swears when there is no stronger proof; what suits men goes to the husband and what suits women to the wife; what suits both goes to the man in the Hanafi and Maliki view, is shared in the Hanbali view, and the Shafi'is have both swear {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13832-13833}. If a man's wives dispute goods in one house, the women's goods are shared equally among them {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13833}. Clearing a sold property of another's goods is a condition of taking possession {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13833}. Throwing cargo overboard when a ship is in danger of sinking is allowed, and required to save a free passenger; whoever throws another's goods without leave is liable {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13834}. The Shafi'is and Hanbalis hold that no hadd for theft is applied to one who steals mosque furnishings made for public use, since the right of use is a doubt {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13834}."
  ur: "متاع لغت میں ہر اس چیز کو کہتے ہیں جس سے نفع اٹھایا جائے، جس میں حج کا تمتع اور طلاق کا متعہ بھی شامل ہے؛ اصطلاح میں دنیا کا ہر وہ سامان جس سے نفع اٹھایا جائے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13832}۔ شوہر پر لازم ہے کہ بیوی کو گھر کا سامان مہیا کرے، جیسے کھانے، پینے، پکانے اور سونے کے برتن، اور یہ واجب نفقہ میں شامل ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13832}۔ زوجین یا ان کے ورثاء کے درمیان سامان پر اختلاف ہو تو قبضہ قرینہ ہے اور بینہ نہ ہونے پر قبضہ والا قسم کھائے؛ مردوں کے لائق سامان شوہر کا، عورتوں کے لائق بیوی کا، اور دونوں کے لائق سامان حنفیہ اور مالکیہ کے نزدیک مرد کا، حنابلہ کے نزدیک دونوں کے درمیان، اور شافعیہ کے نزدیک دونوں قسم کھائیں گے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13832-13833}۔ ایک شوہر کی بیویاں ایک گھر میں ہوں اور سامان پر جھگڑیں تو عورتوں کا سامان ان میں برابر تقسیم ہوگا {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13833}۔ بیچی ہوئی غیر منقول چیز کو خریدار کے حوالے کرنے کے لیے کسی اور کے سامان سے خالی کرنا قبضہ کی شرط ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13833}۔ کشتی ڈوبنے کے خطرے میں سامان سمندر میں پھینکنا جائز ہے، اور محترم مسافر کی نجات کے لیے واجب ہے؛ جو دوسرے کا سامان بلا اجازت پھینکے وہ ضامن ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13834}۔ شافعیہ اور حنابلہ کے نزدیک مسجد کا وہ سامان جو عوام کے انتفاع کے لیے ہو چرانے والے پر حدِ سرقہ نہیں، کیونکہ انتفاع کا حق شبہ ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13834}۔"
