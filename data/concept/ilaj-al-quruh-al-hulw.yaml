id: concept/ilaj-al-quruh-al-hulw
class: concept
kind: scientific
label:
  ar: علاج القروح التي تسمى حلوة
  en: The treatment of the ulcers called sweet
  ur: ان چھالوں کا علاج جو میٹھے کہلاتے ہیں
  es: "El tratamiento de las úlceras llamadas dulces"
  fr: "Le traitement des ulcères appelés ulcères sucrés"
  tr: "Tatlı olarak adlandırılan yaraların tedavisi"
  id: "Pengobatan luka yang disebut sweet"
summary:
  ar: القروح التي تسمى حلوة في ابتدائها يكفي دهن من جنس ما يعرف وحده أو مع شمع وشحم من جنس ما يعرف وأقوى من ذلك مرهم من جنس ما يعرف ولا سيما مخلوطاً بلعاب حب من جنس ما يعرف فإن ريد زيادة تجفيف جعل فيه خبث من جنس ما يعرف، وأما إذا اشتدت العلة يسيراً أو أزمنت واشتدت جداً فمراهم ولطوخ أقواها ما يطبخ في إناء نحاس حتى يصير في قوام العسل ⁦(النسخ والمقادير والأسماء لا تحمل وتحمل جنسها)⁩ {cite:canon-ibn-sina-print-v2 p.247} {cite:canon-ibn-sina-print-v2 p.248}
  en: 'For the ulcers called sweet: at their start an oil of the known kind suffices alone, or with wax and a fat of the known kind; stronger is an ointment of the known kind, especially mixed with the mucilage of a seed of the known kind, and if more drying is wanted a dross of the known kind is put in. If the ailment grows a little stronger or turns chronic and very severe, there are ointments and smears, the strongest of them cooked in a copper vessel till it reaches honey''s consistency ⁦(the recipes, measures and names are carried only by kind)⁩ {cite:canon-ibn-sina-print-v2 p.247} {cite:canon-ibn-sina-print-v2 p.248}'
  ur: 'ان چھالوں کے لیے جو میٹھے کہلاتے ہیں: ابتدا میں معروف جنس کا تیل اکیلا کافی ہے یا موم اور معروف جنس کی چربی کے ساتھ؛ اس سے مضبوط معروف جنس کا مرہم ہے خاص طور پر معروف جنس کے بیج کے لعاب ملا کر، اور اگر مزید خشک کرنے کی ضرورت ہو تو معروف جنس کی میل ڈالا جائے؛ اور اگر علت تھوڑی بڑھ جائے یا دائمی اور نہایت سخت ہو جائے تو مرہم اور لیپ ہیں جن میں سب سے مضبوط تانبے کے برتن میں پکا کر شہد کے قوام تک لایا جاتا ہے ⁦(نسخے، مقدار اور نام صرف جنس کے اعتبار سے)⁩ {cite:canon-ibn-sina-print-v2 p.247} {cite:canon-ibn-sina-print-v2 p.248}'
  es: "Para las úlceras llamadas dulces: al principio basta un aceite conocido, solo o con cera y una grasa conocida; más fuerte es un ungüento conocido, especialmente mezclado con el mucílago de una semilla conocida, y si se desea mayor efecto secante se añade una escoria conocida. Si la dolencia se agrava un poco o se vuelve crónica y muy severa, existen ungüentos y ungüentos, el más fuerte de ellos cocido en un recipiente de cobre hasta que alcanza la consistencia de la miel (las recetas, medidas y nombres se llevan solo por tipo) {cite:canon-ibn-sina-print-v2 p.247} {cite:canon-ibn-sina-print-v2 p.248}"
  fr: "Pour les ulcères dits « sucrés »: à leur apparition, une huile connue suffit, seule ou associée à de la cire et une graisse connue; plus fort, on utilise un onguent connu, notamment mélangé au mucilage d’une graine connue, et, si l’on souhaite un effet plus asséchant, on y ajoute des scories connues. Si l’affection s’aggrave ou devient chronique et très sévère, on emploie des onguents et des pommades, les plus concentrés étant cuits dans un récipient en cuivre jusqu’à obtenir la consistance du miel (les recettes, les doses et les noms sont indiqués par type). {cite:canon-ibn-sina-print-v2 p.247} {cite:canon-ibn-sina-print-v2 p.248}"
  tr: "Başlangıçta 'Haliwa' adı verilen yaralar, bilinen türde bir yağ veya bilinen türde balmumu ve yağ ile yeterlidir. Bundan daha da güçlü, bilinen türden bir merhemdir, özellikle bilinen türden tükürükle karıştırıldığında, istenen aşırı kurutma, bilinen türde bir safsızlık yaratır. Ancak durum biraz kötüleşirse veya çok uzarsa, en güçlü merhem ve leke bakır kapta bal kıvamı olana kadar pişirilmelidir (versiyonlar, içerikler ve isimler bu türü taşımaz) {cite:canon-ibn-sina-print-v2 s.247} {cite:canon-ibn-sina-print-v2 s.248}"
  id: "Luka yang disebut 'Haliwa' di awal cukup dengan minyak jenis yang dikenal sendiri atau dengan lilin dan gemuk jenis yang diketahui. Lebih kuat lagi adalah salep jenis yang dikenal, terutama dicampur dengan air liur jenis yang diketahui, karena pengeringan berlebih yang diinginkan menyebabkan kotoran jenis yang diketahui terjadi. Namun jika kondisi sedikit memburuk atau menjadi sangat panjang, salep dan noda terkuat harus dimasak dalam wadah tembaga sampai mencapai konsistensi madu (versi, bahan, dan nama tidak mengandung jenis tersebut) {cite:canon-ibn-sina-print-v2 hlm.247} {cite:canon-ibn-sina-print-v2 hlm.248} {cite:canon-ibn-sina-print-v2 hlm.248}"
