summary:
  ar: "الفقه علم تفريع الأحكام العملية من أدلتها التفصيلية، وقد انقسم المسلمون فيه إلى مذاهب فقهية كبرى عبر التاريخ. وعرّفه السايس بأنه الأحكام الشرعية العملية المستنبطة من الأدلة التفصيلية، وهو أحد أنواع الشريعة الثلاثة مع العقائد والأخلاق {cite:nashat-al-fiqh-al-ijtihadi-azhar p. 6}. وتذكر دائرة المعارف الإسلامية أنه صار المصطلح الفني لعلم الشريعة، ويشمل العبادات والأسرة والميراث والعقود والجنايات وأحكام الدولة والحرب. وتعرض نشأته من الرأي في القرن الأول الهجري إلى المدارس القديمة، ثم أهل الحديث والشافعي وأصول الفقه، ثم المذاهب السنية الأربعة الباقية."
  en: "Fiqh is the science of deriving practical rulings from their detailed evidence, in which Muslims divided over history into major legal schools. The Encyclopaedia of Islam says it became the technical term for the science of religious law, covering worship, family law, inheritance, contracts, criminal law and the law of state and war. It traces the field from independent opinion in the first Islamic century through the ancient schools, the traditionists, al-Shafii and the science of legal roots, to the four surviving Sunni schools."
  ur: "فقہ وہ علم ہے جو عملی احکام کو ان کی تفصیلی دلیلوں سے نکالتا ہے، اور تاریخ میں مسلمان اس میں بڑے فقہی مذاہب میں بٹے۔ انسائیکلوپیڈیا آف اسلام کے مطابق یہ دینی قانون کے علم کی فنی اصطلاح بنا جو عبادات، خاندانی قانون، وراثت، عقود، فوجداری اور ریاست و جنگ کے احکام کو شامل ہے۔ وہ اس کی نشوونما پہلی صدی ہجری کی رائے سے قدیم مدارس، اہل حدیث، شافعی اور اصول فقہ، اور پھر چار باقی سنی مذاہب تک بیان کرتا ہے۔"
  es: "El fiqh es la ciencia que deriva dictámenes prácticos a partir de pruebas detalladas, y en ella los musulmanes se dividieron históricamente en importantes escuelas jurídicas. La Enciclopedia del Islam afirma que se convirtió en el término técnico para la ciencia del derecho religioso, que abarca el culto, el derecho de familia, la herencia, los contratos, el derecho penal y el derecho de Estado y de guerra. La obra traza la evolución de este campo desde la opinión independiente del primer siglo islámico, pasando por las escuelas antiguas, los tradicionalistas, al-Shafi'i y la ciencia de las raíces jurídicas, hasta las cuatro escuelas sunitas que aún perduran."
  fr: "Le fiqh est la science qui consiste à déduire des règles pratiques à partir de preuves détaillées. Au fil de l'histoire, les musulmans se sont divisés en grandes écoles juridiques. L'Encyclopédie de l'Islam indique que ce terme est devenu la terminologie technique désignant la science du droit religieux, englobant le culte, le droit de la famille, l'héritage, les contrats, le droit pénal, le droit de l'État et le droit de la guerre. Elle retrace l'évolution de ce domaine, depuis les opinions indépendantes du premier siècle de l'Hégire, en passant par les écoles anciennes, les traditionalistes, l'école d'al-Shafi'i et la science des racines juridiques, jusqu'aux quatre écoles sunnites actuelles."
  tr: "Fıkıh, ayrıntılı kanıtlardan pratik hükümler çıkarma bilimidir ve Müslümanlar tarih boyunca büyük fıkıh okullarına ayrılmıştır. Al-Sais, bunu ayrıntılı kanıtlardan türetilen pratik hukuki hükümler olarak tanımlamış ve inanç ve etikle birlikte üç tür Şeriat'tan biridir {cite:nashat-al-fiqh-al-ijtihadi-azhar s. 6}. İslami Ansiklopedi, şeriatın bilimsel terimi haline geldiğini, ibadet, aile, miras, sözleşmeler, suçlar, devlet hükümleri ve savaşı kapsadığını belirtir. Kökeni, ilk yüzyıl Ahri Dönemi'ndeki görüşten eski mezhebilere, ardından hadis, şafii ve fıkıh ilkelerine, son olarak ise kalan dört Sünni mezhebi tarafından ortaya çıkmıştır."
  id: "Ilmu ilmu untuk mengambil keputusan praktis dari bukti rinci mereka, dan umat Muslim telah terbagi ke dalam aliran yurisprudensi utama sepanjang sejarah. Al-Sais mendefinisikannya sebagai putusan hukum praktis yang diperoleh dari bukti rinci, dan merupakan salah satu dari tiga jenis Syariah bersama dengan kepercayaan dan etika {cite:nashat-al-fiqh-al-ijtihadi-azhar hlm. 6}. Ensiklopedia Islam mencatat bahwa istilah ini menjadi istilah teknis untuk ilmu Syariah, mencakup tindakan ibadah, keluarga, warisan, kontrak, kejahatan, aturan negara, dan perang. Asal-usulnya dari pendapat pada abad pertama AH terpapar pada aliran lama, kemudian pada umat hadis, Syafi'i, dan prinsip fiqdensi, serta akhirnya empat mazhab Sunni yang tersisa."
