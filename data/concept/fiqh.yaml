label:
  ar: الفقه
  en: Fiqh
summary:
  ar: "الفقه علم تفريع الأحكام العملية من أدلتها التفصيلية، وقد انقسم المسلمون فيه إلى مذاهب فقهية كبرى عبر التاريخ. وعرّفه السايس بأنه الأحكام الشرعية العملية المستنبطة من الأدلة التفصيلية، وهو أحد أنواع الشريعة الثلاثة مع العقائد والأخلاق {cite:nashat-al-fiqh-al-ijtihadi-azhar p. 6}. وتذكر دائرة المعارف الإسلامية أنه صار المصطلح الفني لعلم الشريعة، ويشمل العبادات والأسرة والميراث والعقود والجنايات وأحكام الدولة والحرب. وتعرض نشأته من الرأي في القرن الأول الهجري إلى المدارس القديمة، ثم أهل الحديث والشافعي وأصول الفقه، ثم المذاهب السنية الأربعة الباقية."
  en: "Fiqh is the science of deriving practical rulings from their detailed evidence, in which Muslims divided over history into major legal schools. The Encyclopaedia of Islam says it became the technical term for the science of religious law, covering worship, family law, inheritance, contracts, criminal law and the law of state and war. It traces the field from independent opinion in the first Islamic century through the ancient schools, the traditionists, al-Shafii and the science of legal roots, to the four surviving Sunni schools."
  ur: "فقہ وہ علم ہے جو عملی احکام کو ان کی تفصیلی دلیلوں سے نکالتا ہے، اور تاریخ میں مسلمان اس میں بڑے فقہی مذاہب میں بٹے۔ انسائیکلوپیڈیا آف اسلام کے مطابق یہ دینی قانون کے علم کی فنی اصطلاح بنا جو عبادات، خاندانی قانون، وراثت، عقود، فوجداری اور ریاست و جنگ کے احکام کو شامل ہے۔ وہ اس کی نشوونما پہلی صدی ہجری کی رائے سے قدیم مدارس، اہل حدیث، شافعی اور اصول فقہ، اور پھر چار باقی سنی مذاہب تک بیان کرتا ہے۔"
