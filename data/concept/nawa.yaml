  es: "Nawa (piedras y semillas)"
  fr: "Nawa (pierres et grains)"
summary:
  ar: "النوى في الكتاب فيه قبض وتغرية، ينفع محرقه من القروح الخبيثة، ويقوم المحرق المطفأ المغسول في الأكحال مقام التوتيا، ويحسن الهدب وينبته {cite:canon-ibn-sina-print-v1 p.582}."
  en: "Nawa, the stones or kernels, has in the book astringency and a gluing power; its burnt form helps malignant ulcers, and burnt, quenched and washed it takes the place of tutia in eye salves, beautifies the lashes and grows them {cite:canon-ibn-sina-print-v1 p.582}."
  ur: "نوىٰ، یعنی گٹھلیاں، کتاب میں قبض اور چپکانے کی قوت رکھتی ہیں؛ ان کی راکھ خبیث زخموں میں مفید ہے، اور جلا کر بجھا کر دھوئی ہوئی سرمے میں توتیا کی جگہ لیتی، پلکوں کو سنوارتی اور اگاتی ہے {cite:canon-ibn-sina-print-v1 p.582}۔"
  es: "Nawa, las piedras o semillas, tiene en el libro astringencia y poder adhesivo; su forma quemada ayuda a las úlceras malignas, y quemada, templada y lavada reemplaza a la tutia en los ungüentos para los ojos, embellece las pestañas y las hace crecer {cite:canon-ibn-sina-print-v1 p.582}."
  fr: "Nawa, les pierres ou les noyaux, a dans le livre des propriétés astringentes et un pouvoir liant; sa forme brûlée aide les ulcères malins, et brûlée, éteinte et lavée, elle remplace la tutia dans les onguents oculaires, embellit les cils et les fait pousser {cite:canon-ibn-sina-print-v1 p.582}."
