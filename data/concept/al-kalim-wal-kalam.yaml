summary:
  ar: "يفتتح سيبويه كتابه ببابٍ يحصر «الكلم» في ثلاثة أنواع: الاسم، والفعل، و«حرفٌ جاء لمعنى ليس باسم ولا فعل»، ويمثّل لكل نوع بأمثلة من العربية. وتُعنى أبواب «الكلام» بعده بالإسناد: المسند والمسند إليه. وقد اختار سيبويه لفظ «الكلم» دون «الكلمات» لخفّته، كما ينقل المحقق عن السيرافي. {cite:bakka-kitab-sibawayh-2015 p.25}"
  en: "Sibawayh opens the Kitab by dividing the word (kalim) into three kinds, noun, verb and particle, each illustrated with Arabic examples; the later section on utterance (kalam) treats the predicate and the predicated-upon. {cite:bakka-kitab-sibawayh-2015 p.53-54}"
