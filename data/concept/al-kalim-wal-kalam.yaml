label: { ar: "الكلم والكلام", en: "Kalim and kalam (word classes and utterance)", fr: "Kalim et kalam (classes de mots et énoncé)", es: "Kalim y kalam (clases de palabras y enunciados)", ur: "کلم اور کلام (لفظوں کی کلاسیں", tr: "Konuş ve konuş", id: "Bicara dan bicara" }
summary:
  ar: "يفتتح سيبويه كتابه ببابٍ يحصر «الكلم» في ثلاثة أنواع: الاسم، والفعل، و«حرفٌ جاء لمعنى ليس باسم ولا فعل»، ويمثّل لكل نوع بأمثلة من العربية. وتُعنى أبواب «الكلام» بعده بالإسناد: المسند والمسند إليه. وقد اختار سيبويه لفظ «الكلم» دون «الكلمات» لخفّته، كما ينقل المحقق عن السيرافي. {cite:bakka-kitab-sibawayh-2015 p.25}"
  en: "Sibawayh opens the Kitab by dividing the word (kalim) into three kinds, noun, verb and particle, each illustrated with Arabic examples; the later section on utterance (kalam) treats the predicate and the predicated-upon. {cite:bakka-kitab-sibawayh-2015 p.53-54}"
  fr: "Sibawayh ouvre le Kitab en distinguant trois classes de mots (kalim) : le nom, le verbe et la particule, qu’il illustre chacune d’exemples arabes. La section qui suit, sur l’énoncé (kalam), traite du prédicat et de ce dont il est prédiqué. {cite:bakka-kitab-sibawayh-2015 p.53-54}"
  es: "Sibawayh inicia el Kitab dividiendo la palabra (kalim) en tres tipos: sustantivo, verbo y partícula, cada uno ilustrado con ejemplos en árabe; la sección posterior sobre la enunciación (kalam) trata el predicado y el predicado. {cite:bakka-kitab-sibawayh-2015 p.53-54}"
  ur: "سباویہ نے کتاب کو لفظ ⁦(کلم)⁩ کو تین قسموں، اسم، فعل اور ذرہ میں تقسیم کر کے کھولا ہے، ہر ایک کو عربی مثالوں سے واضح کیا گیا ہے۔ کلمات ⁦(کلام)⁩ پر بعد کا حصہ پیشین گوئی اور پیشین گوئی کے ساتھ برتاؤ کرتا ہے۔ {حوالہ: بکا-کتاب سیباویہ-2015 صفحہ 53-54}"
  tr: "Sibawayh kitabına, \"konuşma\"yı üç türle sınırlayan bir bölümle açar: isim, fiil ve \"ne isim ne de fiil olan bir anlam kazanan bir harf\"; her türü Arapçadan örneklerle temsil eder. Sonraki \"konuşma\" bölümleri ise aşkınlık zinciriyle ilgilidir: yüklem ve ona yüklem. Editörün Sirafi'den alıntı yaptığı gibi, Sibawayh \"kelimeler\" yerine \"konuşma\" kelimesini hafifliği nedeniyle seçmiştir. {cite:bakka-kitab-sibawayh-2015 s.25}"
  id: "Sibawayh membuka bukunya dengan bagian yang membatasi \"ucapan\" menjadi tiga jenis: kata benda, kata kerja, dan \"huruf yang tidak memiliki makna sama sekali bukan kata benda maupun kata kerja\"; ia mewakili setiap tipe dengan contoh dari bahasa Arab. Bagian \"ucapan\" berikutnya berkaitan dengan rantai transendensi: predikat dan predikat yang mengikutinya. Seperti yang dikutip editor oleh Sirafi, Sibawayh memilih kata \"ucapan\" daripada \"kata\" karena ringannya. {cite:bakka-kitab-sibawayh-2015 hlm.25}"
