id: concept/canon-drawing-matter-away-from-an-organ
class: concept
kind: scientific
label: { ar: "جذب المادة عن العضو عند ابن سينا", en: "Drawing matter away from an organ in the Canon", ur: "عضو سے مادے کو کھینچنا قانون میں" }
summary:
  ar: "يفرق ابن سينا بين مادة تنصب كلها إلى العضو ومادة ما زالت تنصب، ويذكر في الثانية جذبها عن موضعها بعد مراعاة شروط، أولها مخالفة الجهة كالجذب من اليمين إلى اليسار ومن فوق إلى أسفل، وثانيها مراعاة المشاركة، ثم مراعاة التبعيد، ويسكن أولاً وجع العضو المجذوب إليه {cite:canon-ibn-sina-print-v1 p.269}."
  en: "Ibn Sina distinguishes matter that has already poured wholly into an organ from matter still pouring, and for the second says it is drawn from its place once conditions are met, the first being the opposite direction, as from right to left and from above to below, the second regard for sympathy, then keeping the two places far apart, and the pain of the organ drawn from is soothed first {cite:canon-ibn-sina-print-v1 p.269}."
