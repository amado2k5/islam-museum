id: concept/canon-drawing-matter-away-from-an-organ
class: concept
kind: scientific
label:
  ar: "جذب المادة عن العضو عند ابن سينا"
  en: "Drawing matter away from an organ in the Canon"
  fr: "Détourner la matière d’un organe dans le Canon"
  ur: "عضو سے مادے کو کھینچنا قانون میں"
  es: "Extraer materia de un órgano en el Canon"
summary:
  ar: "يفرق ابن سينا بين مادة تنصب كلها إلى العضو ومادة ما زالت تنصب، ويذكر في الثانية جذبها عن موضعها بعد مراعاة شروط، أولها مخالفة الجهة كالجذب من اليمين إلى اليسار ومن فوق إلى أسفل، وثانيها مراعاة المشاركة، ثم مراعاة التبعيد، ويسكن أولاً وجع العضو المجذوب إليه {cite:canon-ibn-sina-print-v1 p.269}."
  en: "Ibn Sina distinguishes matter that has already poured wholly into an organ from matter still pouring, and for the second says it is drawn from its place once conditions are met, the first being the opposite direction, as from right to left and from above to below, the second regard for sympathy, then keeping the two places far apart, and the pain of the organ drawn from is soothed first {cite:canon-ibn-sina-print-v1 p.269}."
  fr: "Ibn Sina distingue matière entièrement affluée et afflux en cours. Pour celui-ci, le détournement exige direction opposée — droite-gauche, haut-bas —, attention aux sympathies et éloignement des lieux, après apaisement de la douleur de l’organe source {cite:canon-ibn-sina-print-v1 p.269}."
  es: "Ibn Sina distingue la materia que ya se ha vertido completamente en un órgano de la materia que aún se está vertiendo, y para la segunda dice que se extrae de su lugar una vez que se cumplen las condiciones, la primera es la dirección opuesta, como de derecha a izquierda y de arriba a abajo, la segunda tiene en cuenta la simpatía, luego manteniendo los dos lugares alejados, y el dolor del órgano del que se extrae se calma primero {cite:canon-ibn-sina-print-v1 p.269}."
  ur: "ابن سینا اس مادے کو الگ کرتا ہے جو پہلے ہی کسی عضو میں مکمل طور پر انڈیل چکا ہوتا ہے اور دوسرے کے لیے کہتا ہے کہ یہ شرائط پوری ہونے کے بعد اپنی جگہ سے کھینچا جاتا ہے، پہلا مخالف سمت، جیسا کہ دائیں سے بائیں اور اوپر سے نیچے، دوسرا ہمدردی کے لیے، پھر دونوں جگہوں کو دور رکھنا، اور عضو کے درد کو پہلے کھینچا جاتا ہے۔ {حوالہ: کینن ابن سینا پرنٹ v1 صفحہ 269}۔"
