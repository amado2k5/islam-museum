summary:
  ar: "الحلتيت صمغ يُؤخذ من أصل الأنجدان وساقه بشرطهما، وهو صنفان: منتن وطيّب، والمنتن أسخنهما؛ طبعه حار في أول الرابعة يابس في الثانية، ويُذكر له منافع في الرياح والأورام الخبيثة والدبيلات والصلع والعضل والعصب والسعال والربو والصداع والصرع واليرقان، ومنه مُعلَّمات في الحيض والحمل."
  en: "Halitit is a gum taken from the root and stalk of anjudan by cutting them. There are two kinds, foul-smelling and fragrant; the foul is the hotter. Its temperament is hot at the start of the fourth degree and dry in the second. The book lists uses for wind, malignant swellings and abscesses, joints, nerves, cough, asthma, headache, epilepsy and jaundice, and some labelled listings on the menses and pregnancy."
  ur: "حلتیت انجدان کی جڑ اور ڈنڈی کو کاٹ کر نکالا جانے والا صمغ ہے؛ اس کی دو قسمیں ہیں، بدبودار اور خوشبودار، اور بدبودار زیادہ گرم ہے۔ اس کی طبع چوتھے درجے کے آغاز میں گرم اور دوسرے میں خشک ہے۔ کتاب ہوا، خبیث سوجن اور دبیلات، جوڑ، عصب، کھانسی، دمہ، سردرد، مرگی اور یرقان کے فوائد درج کرتی ہے، اور حیض اور حمل کی کچھ مُعلَّم فہرستیں بھی ہیں۔"
  es: "El halitit es una goma que se obtiene de la raíz y el tallo del anjudan mediante cortes. Existen dos variedades: una maloliente y otra fragante; la maloliente es la más caliente. Su temperamento es caliente al inicio del cuarto grado y seco en el segundo. El libro enumera usos para el viento, inflamaciones y abscesos malignos, articulaciones, nervios, tos, asma, dolor de cabeza, epilepsia e ictericia, y algunas listas etiquetadas para la menstruación y el embarazo."
  fr: "L'halitit est une gomme extraite de la racine et de la tige de l'anjudan par incision. Il en existe deux sortes: l'une malodorante et l'autre parfumée; la première, malodorante, est la plus chaude. Son tempérament est chaud au début du quatrième degré et sec au deuxième. L'ouvrage mentionne ses usages contre les gaz, les tumeurs malignes et les abcès, les affections articulaires et nerveuses, la toux, l'asthme, les maux de tête, l'épilepsie et la jaunisse, ainsi que des indications spécifiques pour les menstruations et la grossesse."
