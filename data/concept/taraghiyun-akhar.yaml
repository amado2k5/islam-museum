label:
  ar: "طراغيون آخر"
  en: "Taraghiyun akhar (the sea grape)"
  ur: "طراغیون آخر ⁦(سمندری انگور)⁩"
  es: "Taraghiyun akhar (la uva de mar)"
  fr: "Taraghiyun akhar (le raisin de mer)"
  tr: "Diğer Taraghionlar"
  id: "Taraghion Lainnya"
summary:
  ar: "نبات صغير يقرب الأرض يكثر على سواحل البحر، بلا ورق، وحبّه الأحمر قابض؛ يذكر الكتاب أن شربه مع الشراب ينفع من الإسهال المزمن وسيلان الرطوبات من الرحم."
  en: "A low coastal plant with no leaves and small red astringent berries; the book says taking them in wine helps long diarrhoea and discharges from the womb, recorded as a labelled listing."
  ur: "ساحلی علاقے کا ایک چھوٹا پودا جس کے پتے نہیں اور سرخ قابض دانے ہیں؛ کتاب کے مطابق شراب میں لینے سے دائمی اسہال اور رحم سے رطوبت بہنے میں فائدہ ہوتا ہے، جو نشان زد بیان کے طور پر درج ہے۔"
  es: "Una planta costera baja, sin hojas y con pequeñas bayas rojas astringentes; el libro dice que tomarlas en vino ayuda con la diarrea prolongada y las secreciones uterinas, según consta en una lista etiquetada."
  fr: "Plante côtière basse sans feuilles et aux petites baies rouges astringentes; le livre indique que leur consommation dans du vin aide à soulager les diarrhées persistantes et les pertes utérines, mentionnées dans une liste étiquetée."
  tr: "Yere yakın yetişen, deniz kıyılarında bolca bulunan küçük bir bitki, yapraksız ve kırmızı tohumu büzücüdür; kitap, içecekle birlikte içilmesinin kronik ishal ve rahimden nemin boşalması için faydalı olduğunu belirtir."
  id: "Tanaman kecil yang tumbuh dekat dengan tanah, melimpah di sepanjang pantai, tanpa daun, dan biji merahnya bersifat astringen; buku tersebut menyebutkan bahwa meminumnya bersama minuman ini bermanfaat untuk diare kronis dan pengaliran air dari rahim."
