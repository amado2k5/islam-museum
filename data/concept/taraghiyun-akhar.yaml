summary:
  ar: "نبات صغير يقرب الأرض يكثر على سواحل البحر، بلا ورق، وحبّه الأحمر قابض؛ يذكر الكتاب أن شربه مع الشراب ينفع من الإسهال المزمن وسيلان الرطوبات من الرحم."
  en: "A low coastal plant with no leaves and small red astringent berries; the book says taking them in wine helps long diarrhoea and discharges from the womb, recorded as a labelled listing."
