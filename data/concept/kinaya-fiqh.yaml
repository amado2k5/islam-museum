id: concept/kinaya-fiqh
class: concept
kind: legal
label:
  ar: "الكِنَايَة"
  en: "Kinaya (allusive speech in fiqh)"
  ur: "کنایہ (فقہی)"
summary:
  ar: "الكناية في اللغة أن يتكلم المرء بشيء يستدل به على المكنّى عنه، كالرفث والغائط، وفي الاصطلاح كلام استتر المراد منه بالاستعمال مع ظهور معناه في اللغة، فيحتاج إلى النية أو ما يقوم مقامها من دلالة الحال {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13506}."
  en: "Kinaya, in lexical sense, is speaking so as to indicate what is meant, like rafath and ghaʾit; in law it is speech whose meaning is hidden by use although its literal sense is clear, so it needs intention or what stands for it, such as the circumstances {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13506}."
  ur: "کنایہ لغت میں ایسی بات کرنا ہے جس سے کسی اور چیز کی طرف اشارہ ہو، جیسے رفث اور غائط؛ اصطلاح میں یہ وہ کلام ہے جس کی مراد استعمال کی وجہ سے چھپی ہو، اگرچہ لغوی معنی ظاہر ہو، لہٰذا اس میں نیت یا اس کے قائم مقام دلالتِ حال درکار ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13506}۔"
