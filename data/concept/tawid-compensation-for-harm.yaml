id: concept/tawid-compensation-for-harm
class: concept
kind: legal
label:
  ar: التعويض
  en: Ta'wid (compensation for harm)
  ur: تعویض (نقصان کا بدل)
summary:
  ar: 'التعويض لغة العوض والبدل، واصطلاحا دفع ما وجب من بدل مالي بسبب إلحاق ضرر بالغير. وهو يفرق عن التثمين الذي يخص المعاوضات، وعن التقويم الذي يدخل في التعويضات، وعن الأرش الذي هو المال الواجب في الجناية على ما دون النفس، وعن الضمان الذي هو أعم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5547} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5548} والتعويض لا يكون إلا مقابل ضرر، وهو واجب الأداء، ويشمل الضرر الواقع على المال أو المنفعة أو النفس أو ما دونها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5548} والإتلاف غير المشروع يوجب التعويض بالاتفاق، سواء كان حقا لله كصيد المحرم، أو حقا للعبد. وأما المشروع فيوجب التعويض إذا ترتب عليه حق لغير في بعض الصور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5548} وفي العين المتلفة: إن كانت مثلية فمثلها، وإن كانت قيمية فقيمتها بمكان الإتلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5548} وفي منافع الأموال: جمهور الفقهاء يضمنونها بأجرة المثل بالتفويت، والشافعية والحنابلة يضمنون منافع المغصوب، والمالكية يضمنون غلة المستعمل ومعطّل الدار، والحنفية يرون المنفعة غير مضمونة إلا في ثلاث صور: الوقف، ومال اليتيم، والمعد للاستغلال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5550} وفي عقود الأمانات كالوديعة والوكالة لا يضمن من بيده المال إلا بتفريط أو تعد، وكذلك الأجير الخاص، وفي المشترك خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} وفي التحريض: الجمهور يجعلون الضمان على المغري، والمالكية لا يتبعونه إلا عند تعذر الرجوع على المباشر، والنووي يرى عدم الضمان في صور التسبب كفتح باب الحرز ودلالة السارق، والحنابلة يخيرون صاحب المال بين تضمين المغري والظالم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} وفي الإكراه اختلف هل يضمن المكره وحده أم معه المكره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} ويضمن المتلِف مباشرة أو تسببا. وتشترط في المتلف أن يكون مالا متقوما، وأن يكون من أهل الضمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} وفي الدواب: يضمن ما تتلفه من غير الزرع إذا كان معها من له يد عليها ولم يمنعها، واختلف في غير ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} وإتلاف النفس يوجب الدية في ما لا يقتص فيه، وإتلاف العضو الدية إن كانت مقدرة وإلا حكومة عدل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} والتعويض عن الأضرار المعنوية لم يجد الكاتب من الفقهاء من عبر به، ولم يجد في كتبهم كلاما عن التعويض المالي في شيء من الأضرار المعنوية، وهو تعبير حادث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5552}'
  en: 'Ta''wid is in language a substitute, and in law the payment of a monetary replacement owed for harm done to another. It differs from taththim (fixing a price in an exchange), from taqwim (valuation), which belongs to compensation, from arsh (the sum owed for an injury short of death), and it is narrower than daman (liability). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5547} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5548} Compensation is owed only against harm and is binding; harm may fall on property, its use, life, or a part of the body. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5548} Unlawful destruction calls for compensation by agreement, whether the right is God''s (as hunting in the sacred state) or a person''s. Lawful destruction calls for compensation only where another''s right is involved. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5548} For a destroyed thing: a fungible item is replaced by its like, a valued item by its value at the place of destruction. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5548} For the loss of use: most jurists hold use guaranteed by the one who takes it; the Shafiis and Hanbalis guarantee the use of usurped property, the Malikis guarantee the yield of property used or left idle, and the Hanafis hold use is not property, except in three cases: an endowment, an orphan''s property, and property prepared for rent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5550} In trusts such as deposit and agency, the holder is liable only for negligence or transgression, and so is a private hired worker; the shared worker is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} On instigation: most jurists place liability on the instigator; the Malikis pursue him only when the actual wrongdoer cannot pay; al-Nawawi holds no liability for mere cause, such as opening a store or guiding a thief; the Hanbalis let the owner hold either. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} On coercion, the jurists differ whether the coercer alone is liable or the coerced too. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} Liability falls on one who destroys directly or by causing. The thing destroyed must be valuable property, and the destroyer must be liable in law. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} Animals are guaranteed for damage to crops only where a keeper is present and does not restrain them; the rest is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} Killing carries blood money where retaliation does not apply; loss of a limb carries its fixed sum, or else a just assessment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} No jurist, the book notes, spoke of monetary compensation for moral injury; the term is a recent one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5552}'
  ur: تعویض لغت میں بدل کو کہتے ہیں، اور شریعت میں دوسرے کو پہنچنے والے نقصان کے سبب واجب ہونے والے مالی بدل کی ادائیگی۔ یہ معاوضات میں قیمت مقرر کرنے (تثمین) سے، تقویم سے، ارش سے اور ضمان سے مختلف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5547} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5548} تعویض صرف نقصان کے مقابل واجب ہوتا ہے، اور یہ نقصان مال، منفعت، جان یا جسم کے کسی حصے پر ہو سکتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5548} ناجائز اتلاف پر بالاتفاق تعویض واجب ہے، خواہ حقِ الٰہی ہو (جیسے احرام میں شکار) یا حقِ بندہ۔ جائز اتلاف پر تعویض تبھی ہے جب کسی غیر کا حق متعلق ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5548} تلف شدہ چیز مثلی ہو تو اس کا مثل، اور قیمی ہو تو تلف کی جگہ کی قیمت دی جائے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5548} منافع کے نقصان پر جمہور فقہاء اجرت مثل کے ساتھ ضمان کے قائل ہیں؛ شافعیہ اور حنابلہ مغصوب کے منافع کا ضمان لیتے ہیں، مالکیہ استعمال شدہ اور معطل مکان کی آمدنی کا، جبکہ حنفیہ منفعت کو مال نہیں مانتے سوائے وقف، یتیم کے مال اور کرایہ کے لیے تیار مکان کے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5550} امانت کے معاملات (جیسے ودیعت اور وکالت) میں قابض صرف تفریط یا تعدی سے ضامن ہوتا ہے، اور خاص اجیر بھی؛ مشترک اجیر میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} ترغیب دینے پر جمہور کے نزدیک ضمان ترغیب دینے والے پر ہے، مالکیہ اس کے پیچھے تب جاتے ہیں جب اصل مرتکب ادائیگی سے عاجز ہو، نووی اسباب محض پر ضمان کے قائل نہیں، اور حنابلہ مال کے مالک کو اختیار دیتے ہیں کہ ترغیب دینے والے یا ظالم دونوں میں سے کسی سے لے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} جبر کی صورت میں اختلاف ہے کہ ضمان صرف جبر کرنے والے پر ہے یا مجبور پر بھی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} تلف کرنے والا براہ راست یا بالواسطہ ضامن ہوتا ہے، اور تلف شدہ چیز متقوم مال ہونی چاہیے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} جانوروں کے زرعی نقصان کا ضمان اس صورت میں ہے جب ان کے ساتھ کوئی نگران ہو اور وہ روکے نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} جان کے اتلاف پر دیت، اور عضو کے اتلاف پر مقررہ دیت یا حکومت عدل۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} کتاب کے مطابق فقہاء میں سے کسی نے معنوی نقصان پر مالی تعویض کا ذکر نہیں کیا، اور یہ تعبیر نئی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5552}
