id: concept/tawid-compensation-for-harm
class: concept
kind: legal
label:
  ar: التعويض
  en: Ta'wid (compensation for harm)
  ur: تعویض ⁦(نقصان کا بدل)⁩
  es: "Ta'wid (compensación por daños)"
  fr: "Ta'wid (indemnisation pour préjudice)"
  tr: "Ücretlendirme"
  id: "Kompensasi"
summary:
  ar: 'التعويض لغة العوض والبدل، واصطلاحا دفع ما وجب من بدل مالي بسبب إلحاق ضرر بالغير. وهو يفرق عن التثمين الذي يخص المعاوضات، وعن التقويم الذي يدخل في التعويضات، وعن الأرش الذي هو المال الواجب في الجناية على ما دون النفس، وعن الضمان الذي هو أعم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5547} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5548} والتعويض لا يكون إلا مقابل ضرر، وهو واجب الأداء، ويشمل الضرر الواقع على المال أو المنفعة أو النفس أو ما دونها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5548} والإتلاف غير المشروع يوجب التعويض بالاتفاق، سواء كان حقا لله كصيد المحرم، أو حقا للعبد. وأما المشروع فيوجب التعويض إذا ترتب عليه حق لغير في بعض الصور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5548} وفي العين المتلفة: إن كانت مثلية فمثلها، وإن كانت قيمية فقيمتها بمكان الإتلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5548} وفي منافع الأموال: جمهور الفقهاء يضمنونها بأجرة المثل بالتفويت، والشافعية والحنابلة يضمنون منافع المغصوب، والمالكية يضمنون غلة المستعمل ومعطّل الدار، والحنفية يرون المنفعة غير مضمونة إلا في ثلاث صور: الوقف، ومال اليتيم، والمعد للاستغلال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5550} وفي عقود الأمانات كالوديعة والوكالة لا يضمن من بيده المال إلا بتفريط أو تعد، وكذلك الأجير الخاص، وفي المشترك خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} وفي التحريض: الجمهور يجعلون الضمان على المغري، والمالكية لا يتبعونه إلا عند تعذر الرجوع على المباشر، والنووي يرى عدم الضمان في صور التسبب كفتح باب الحرز ودلالة السارق، والحنابلة يخيرون صاحب المال بين تضمين المغري والظالم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} وفي الإكراه اختلف هل يضمن المكره وحده أم معه المكره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} ويضمن المتلِف مباشرة أو تسببا. وتشترط في المتلف أن يكون مالا متقوما، وأن يكون من أهل الضمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} وفي الدواب: يضمن ما تتلفه من غير الزرع إذا كان معها من له يد عليها ولم يمنعها، واختلف في غير ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} وإتلاف النفس يوجب الدية في ما لا يقتص فيه، وإتلاف العضو الدية إن كانت مقدرة وإلا حكومة عدل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} والتعويض عن الأضرار المعنوية لم يجد الكاتب من الفقهاء من عبر به، ولم يجد في كتبهم كلاما عن التعويض المالي في شيء من الأضرار المعنوية، وهو تعبير حادث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5552}'
  en: 'Ta''wid is in language a substitute, and in law the payment of a monetary replacement owed for harm done to another. It differs from taththim (fixing a price in an exchange), from taqwim (valuation), which belongs to compensation, from arsh (the sum owed for an injury short of death), and it is narrower than daman (liability). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5547} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5548} Compensation is owed only against harm and is binding; harm may fall on property, its use, life, or a part of the body. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5548} Unlawful destruction calls for compensation by agreement, whether the right is God''s (as hunting in the sacred state) or a person''s. Lawful destruction calls for compensation only where another''s right is involved. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5548} For a destroyed thing: a fungible item is replaced by its like, a valued item by its value at the place of destruction. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5548} For the loss of use: most jurists hold use guaranteed by the one who takes it; the Shafiis and Hanbalis guarantee the use of usurped property, the Malikis guarantee the yield of property used or left idle, and the Hanafis hold use is not property, except in three cases: an endowment, an orphan''s property, and property prepared for rent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5550} In trusts such as deposit and agency, the holder is liable only for negligence or transgression, and so is a private hired worker; the shared worker is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} On instigation: most jurists place liability on the instigator; the Malikis pursue him only when the actual wrongdoer cannot pay; al-Nawawi holds no liability for mere cause, such as opening a store or guiding a thief; the Hanbalis let the owner hold either. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} On coercion, the jurists differ whether the coercer alone is liable or the coerced too. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} Liability falls on one who destroys directly or by causing. The thing destroyed must be valuable property, and the destroyer must be liable in law. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} Animals are guaranteed for damage to crops only where a keeper is present and does not restrain them; the rest is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} Killing carries blood money where retaliation does not apply; loss of a limb carries its fixed sum, or else a just assessment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} No jurist, the book notes, spoke of monetary compensation for moral injury; the term is a recent one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5552}'
  ur: تعویض لغت میں بدل کو کہتے ہیں، اور شریعت میں دوسرے کو پہنچنے والے نقصان کے سبب واجب ہونے والے مالی بدل کی ادائیگی۔ یہ معاوضات میں قیمت مقرر کرنے ⁦(تثمین)⁩ سے، تقویم سے، ارش سے اور ضمان سے مختلف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5547} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5548} تعویض صرف نقصان کے مقابل واجب ہوتا ہے، اور یہ نقصان مال، منفعت، جان یا جسم کے کسی حصے پر ہو سکتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5548} ناجائز اتلاف پر بالاتفاق تعویض واجب ہے، خواہ حقِ الٰہی ہو ⁦(جیسے احرام میں شکار)⁩ یا حقِ بندہ۔ جائز اتلاف پر تعویض تبھی ہے جب کسی غیر کا حق متعلق ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5548} تلف شدہ چیز مثلی ہو تو اس کا مثل، اور قیمی ہو تو تلف کی جگہ کی قیمت دی جائے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5548} منافع کے نقصان پر جمہور فقہاء اجرت مثل کے ساتھ ضمان کے قائل ہیں؛ شافعیہ اور حنابلہ مغصوب کے منافع کا ضمان لیتے ہیں، مالکیہ استعمال شدہ اور معطل مکان کی آمدنی کا، جبکہ حنفیہ منفعت کو مال نہیں مانتے سوائے وقف، یتیم کے مال اور کرایہ کے لیے تیار مکان کے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5550} امانت کے معاملات ⁦(جیسے ودیعت اور وکالت)⁩ میں قابض صرف تفریط یا تعدی سے ضامن ہوتا ہے، اور خاص اجیر بھی؛ مشترک اجیر میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} ترغیب دینے پر جمہور کے نزدیک ضمان ترغیب دینے والے پر ہے، مالکیہ اس کے پیچھے تب جاتے ہیں جب اصل مرتکب ادائیگی سے عاجز ہو، نووی اسباب محض پر ضمان کے قائل نہیں، اور حنابلہ مال کے مالک کو اختیار دیتے ہیں کہ ترغیب دینے والے یا ظالم دونوں میں سے کسی سے لے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} جبر کی صورت میں اختلاف ہے کہ ضمان صرف جبر کرنے والے پر ہے یا مجبور پر بھی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} تلف کرنے والا براہ راست یا بالواسطہ ضامن ہوتا ہے، اور تلف شدہ چیز متقوم مال ہونی چاہیے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} جانوروں کے زرعی نقصان کا ضمان اس صورت میں ہے جب ان کے ساتھ کوئی نگران ہو اور وہ روکے نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} جان کے اتلاف پر دیت، اور عضو کے اتلاف پر مقررہ دیت یا حکومت عدل۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} کتاب کے مطابق فقہاء میں سے کسی نے معنوی نقصان پر مالی تعویض کا ذکر نہیں کیا، اور یہ تعبیر نئی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5552}
  es: "Ta'wid es en lenguaje un sustituto, y en derecho el pago de un reemplazo monetario debido por el daño causado a otro. Se diferencia de taththim (fijar un precio en un intercambio), de taqwim (valoración), que pertenece a la compensación, de arsh (la suma debida por una lesión que no llega a la muerte), y es más limitado que daman (responsabilidad). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5547} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5548} La compensación se debe solo por daño y es vinculante; el daño puede recaer sobre la propiedad, su uso, la vida o una parte del cuerpo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5548} La destrucción ilícita requiere compensación por acuerdo, ya sea que el derecho sea de Dios (como la caza en el estado sagrado) o de una persona. La destrucción legal requiere compensación solo cuando está involucrado el derecho de otro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5548} Para una cosa destruida: un artículo fungible es reemplazado por su semejante, un artículo valioso por su valor en el lugar de la destrucción. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5548} Para la pérdida de uso: la mayoría de los juristas sostienen que el uso está garantizado por quien lo toma; los shafiíes y hanbalíes garantizan el uso de la propiedad usurpada, los malikíes garantizan el rendimiento de la propiedad usada o dejada ociosa, y los hanafíes sostienen que el uso no es propiedad, excepto en tres casos: una dotación, la propiedad de un huérfano y la propiedad preparada para alquiler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5550} En fideicomisos como el depósito y la agencia, el titular es responsable solo por negligencia o transgresión, y también lo es un trabajador contratado privado; el trabajador compartido es objeto de disputa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} Sobre la instigación: la mayoría de los juristas atribuyen la responsabilidad al instigador; los malikíes lo persiguen solo cuando el verdadero infractor no puede pagar; al-Nawawi no considera responsable a la mera causa, como abrir una tienda o guiar a un ladrón; los hanbalíes dejan que el propietario sea responsable en ambos casos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} Sobre la coacción, los juristas difieren en si solo el coaccionador es responsable o también el coaccionado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} La responsabilidad recae sobre quien destruye directamente o por causa. La cosa destruida debe ser propiedad valiosa, y el destructor debe ser responsable ante la ley. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} Los animales están garantizados por daños a los cultivos solo cuando un cuidador está presente y no los retiene; el resto es disputado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} El homicidio conlleva una indemnización por homicidio cuando no procede la represalia; la pérdida de una extremidad conlleva una suma fija, o bien una justa compensación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} Ningún jurista, señala el libro, habló de compensación monetaria por daño moral; el término es reciente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5552}"
  fr: "Le ta'wid, en langage, désigne un substitut; en droit, il s'agit du paiement d'une compensation financière due pour un préjudice causé à autrui. Il diffère du taththim (fixation d'un prix lors d'un échange), du taqwim (évaluation), qui relève de la compensation, de l'arsh (somme due pour un préjudice non mortel), et son champ d'application est plus restreint que celui du daman (responsabilité). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5547} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5548} La compensation n'est due qu'en cas de préjudice et est obligatoire; le préjudice peut concerner un bien, son usage, la vie ou une partie du corps. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5548} La destruction illicite donne lieu à une compensation par accord, que le droit soit divin (comme pour la chasse dans l'État sacré) ou personnel. La destruction licite donne lieu à indemnisation uniquement lorsqu'un droit d'autrui est en jeu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5548} Concernant un bien détruit: un bien fongible est remplacé par un similaire, un bien précieux par sa valeur au lieu de destruction. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5548} Concernant la perte de jouissance: la plupart des juristes estiment que la jouissance est garantie par celui qui en prend possession; les écoles chaféite et hanbalite garantissent la jouissance du bien usé, les écoles malikite garantissent le rendement du bien utilisé ou laissé en friche, et les écoles hanafite considèrent que la jouissance n'est pas un bien, sauf dans trois cas: une dot, le bien d'un orphelin et le bien préparé pour la location. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5550} Dans les fiducies telles que le dépôt et le mandat, le titulaire n'est responsable qu'en cas de négligence ou de transgression, à l'instar d'un travailleur indépendant; le cas du travailleur partagé est controversé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} En cas d'instigation: la plupart des juristes imputent la responsabilité à l'instigateur; les Malikites ne le poursuivent que lorsque l'auteur du préjudice est insolvable; al-Nawawi n'impose aucune responsabilité pour simple cause, comme l'ouverture d'un magasin ou le fait de guider un voleur; les Hanbalites laissent la responsabilité au propriétaire dans les deux cas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} En matière de contrainte, les juristes divergent quant à la responsabilité de celui qui contraint ou également de la personne contrainte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} La responsabilité incombe à celui qui détruit directement ou indirectement. Le bien détruit doit être un bien de valeur, et le destructeur doit être juridiquement responsable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} La responsabilité des animaux pour les dommages causés aux récoltes n'est garantie que si un gardien est présent et ne les retient pas; le reste est sujet à controverse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} Le meurtre entraîne le versement d'une compensation financière en l'absence de représailles; la perte d'un membre donne lieu à une indemnisation forfaitaire, ou à une juste évaluation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5551} Aucun juriste, note l'ouvrage, n'a évoqué de compensation financière pour préjudice moral; le terme est récent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5552}"
  tr: "Tazminat, tazminat ve ikame dilidir ve teknik olarak, başkalarına zarar vermekten kaynaklanan herhangi bir maddi tazminatın ödenmesidir. Bu, değişimle ilgili değerlemeden, tazminata dahil edilen değerlemeden, kişiden daha az olan bir suçta zorunlu olan 'arsh'dan ve daha geniş olan sorumluluktan farklıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5547} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5548} Tazminat yalnızca ödenmesi gereken bir yükümlülük olan ve mal, fayda, can veya daha az zararı kapsayan zararlar içindir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5548} Hukuka aykırı yok etme, ister yasak bir hayvan avlamak gibi Allah'ın hakkı olsun ister köle hakkı olsun, anlaşma yoluyla tazminat gerektirir. Meşru mal için ise, bazı durumlarda başkalarına karşı bir hak doğuyorsa tazminat talep edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5548} Hasar görmüş bir nesne durumunda: çift mülk ise benzerdir, değerliyse değeri imha yerindedir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5548} Servetin faydaları hakkında: çoğu hukukçu eşdeğer kira ile devri garanti eder; Şafi'ler ve Hanbaliler gasp edilen malın faydalarını garanti eder; Malikiler kullanılmış malın ve boş evin getirisini garanti eder; ve Hanafiler ise faydayı sadece üç durumda garanti eder: vakıf, yetim malvarlığı ve kullanım amaçlı mal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5550} Mevduat ve acente sözleşmeleri gibi güven sözleşmelerinde, paranın sahibi yalnızca ihmal veya ihlal nedeniyle sorumlu tutulur, tıpkı özel çalışanlarda olduğu gibi. Ortak sahipler konusunda anlaşmazlık vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5551} Teşvik içinde: çoğunluk sorumluluğu baştan çıkaranı üstlenirken, Malikiler sadece doğrudan tarafa karşı başvurulamazsa bunu takip eder. Al-Nawawi, güvenlik kapısını açmak ve hırsızın göstermesi gibi nedensellik durumlarında sorumluluk olmadığını düşünür. Hanbaliler, sahibine ayartma sorumluluğu ile baskıcı arasında seçim yapar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5551} Zorlama konusunda, zorlayıcının tek başına mı yoksa zorlamayla mı sorumlu olduğu konusunda anlaşmazlık vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5551} Hayvanı yok eden kişi doğrudan veya sebeple sorumludur. Zarar gören malın iyi durumda olması ve sorumlu olması şart koşulmuştur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5551} Hayvanlar hakkında: eğer birisi ürünleri ele geçirip engellemezse ve başka konularda anlaşmazlık varsa, mahvetlerinden sorumludur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5551} Ceza alınmadığı durumlarda can zararı gerekir ve uzvdaki zarar onaylanırsa kan parasıdır, aksi takdirde adil bir hükümettir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5551} Yazar, manevi zararlar için tazminat konusunda bunu ifade eden herhangi bir hukukçu bulmamış ve kitaplarında herhangi bir manevi zararlar için maddi tazminattan bahsetmemiştir; bu yaygın bir ifadedir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5552}"
  id: "Kompensasi adalah bahasa kompensasi dan substitusi, dan secara teknis, ini adalah pembayaran kompensasi finansial yang disebabkan oleh kerugian bagi orang lain. Ini berbeda dari penilaian yang terkait dengan pertukaran, dari penilaian yang termasuk dalam kompensasi, dari 'arsh' yang merupakan properti wajib dalam kejahatan yang lebih kecil dari orang tersebut, dan dari tanggung jawab yang lebih luas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5547} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5548} Kompensasi hanya berlaku untuk kerusakan, yang merupakan kewajiban dibayar dan mencakup kerusakan pada properti, manfaat, nyawa, atau kurang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5548} Penghancuran yang tidak sah memerlukan kompensasi melalui kesepakatan, baik itu hak Tuhan seperti berburu hewan terlarang atau hak budak. Adapun properti yang sah, kompensasi diperlukan jika dalam beberapa kasus menghasilkan hak atas orang lain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5548} Dalam kasus objek yang rusak: jika benda itu adalah properti ganda, maka serupa, dan jika bernilai, nilainya berada di tempat kehancuran. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5548} Mengenai manfaat kekayaan: mayoritas ahli hukum menjamin dengan sewa yang setara melalui transfer; Shafi'i dan Hanbal menjamin manfaat properti yang direbut; Maliki menjamin hasil properti bekas dan rumah kosong; dan Hanafi menganggap manfaat tersebut tidak dijamin kecuali dalam tiga kasus: wakaf, properti yatim piatu, dan properti yang dimaksudkan untuk digunakan. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.5549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5550} Dalam kontrak trust seperti deposit dan kontrak agensi, orang yang memegang uang tidak bertanggung jawab kecuali karena kelalaian atau pelanggaran, seperti halnya karyawan pribadi. Ada perbedaan pendapat mengenai pemilik bersama. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5551} Dalam hasutan: mayoritas menempatkan tanggung jawab pada penggoda, sementara Maliki hanya mengikutinya jika tidak mungkin mengajukan banding terhadap pihak langsung. Al-Nawawi percaya tidak ada tanggung jawab dalam kasus sebab-akibat seperti membuka pintu untuk pengamanan dan indikasi pencuri. Hanbal memberi pemilik pilihan antara tanggung jawab atas godaan dan penindas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5551} Mengenai paksaan, ada perbedaan pendapat apakah pemaksa bertanggung jawab sendiri atau bersama pemaksaan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5551} Orang yang menghancurkannya bertanggung jawab langsung atau karena sebab. Ditetapkan bahwa properti yang rusak harus dalam kondisi baik dan bertanggung jawab. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5551} Dan mengenai hewan: dia bertanggung jawab atas apa yang dihancurkan kecuali tanaman jika seseorang memilikinya dan tidak mencegahnya, dan ada perbedaan pendapat dalam hal lain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5551} Kerusakan pada jiwa memerlukan uang darah dalam kasus tidak ada hukuman yang dijatuhkan, dan kerusakan pada anggota tubuh adalah uang darah jika disetujui, jika tidak, itu adalah pemerintahan yang adil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5551} Penulis tidak menemukan ahli hukum yang menyatakan hal ini mengenai kompensasi atas kerugian moral, juga tidak menemukan dalam buku-buku mereka tentang kompensasi finansial atas kerugian moral, yang merupakan ungkapan umum. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.5552}"
