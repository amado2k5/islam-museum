label:
  ar: "إرسال"
  en: "Irsal (sending; the mursal report)"
  ur: "ارسال ⁦(بھیجنا، مرسل روایت)⁩"
  es: "Irsal (enviando; el informe mursal)"
  fr: "Irsal (envoi; le rapport mursal)"
  tr: "Gönderim"
  id: "Mengirim"
summary:
  ar: "الإرسال في اللغة الإطلاق والإهمال والتوجيه والتسليط، وفي استعمال الفقهاء يشمل إرخاء اليدين في الصلاة وإرسال العمامة وإرسال الرسول بالمال أو الكتاب. وفي الحديث هو أن يرفع التابعي الحديث إلى النبي دون الصحابي، وفي حجيته خلاف بين الفقهاء. وفي الأحكام: يصح العقد والطلاق بالرسول والكتاب بشروطه، وتبقى الشيء المرسل على ملك مرسله حتى يقبضه المرسل إليه، ويتحمل الضمان بحسب الحال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2173} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2180}"
  en: "Irsal in the lexicon is release, neglect, direction and empowerment; in the jurists' usage it covers letting the hands hang in prayer, letting the turban's end hang, and sending a messenger with money or a letter. In hadith it is a Successor's report that omits the companion and goes straight to the Prophet, and its authority is disputed. In the rulings, a contract or divorce by messenger or letter is valid under its conditions, the sent thing remains the sender's property until the addressee takes it, and liability follows the circumstances. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2173} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2180}"
  ur: "ارسال لغت میں چھوڑنا، بے پروائی، توجہ اور مسلط کرنا ہے؛ فقہاء کے استعمال میں نماز میں ہاتھ لٹکانا، عمامے کا پلو چھوڑنا، اور مال یا خط دے کر پیغامبر بھیجنا بھی اس میں شامل ہے۔ حدیث میں یہ وہ روایت ہے جس میں تابعی صحابی کو چھوڑ کر براہ راست نبی کی طرف بات منسوب کرتا ہے، اور اس کی حجیت میں اختلاف ہے۔ احکام میں پیغامبر یا خط کے ذریعے نکاح اور طلاق اپنی شرائط کے ساتھ درست ہیں، بھیجی ہوئی چیز مرسل الیہ کے قبضے تک بھیجنے والے کی ملکیت رہتی ہے، اور ضمان حالات کے مطابق ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2173} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2180}"
  es: "Irsal, en el léxico, significa liberación, negligencia, dirección y empoderamiento; en el uso de los juristas, abarca dejar las manos colgando en oración, dejar el extremo del turbante colgando y enviar un mensajero con dinero o una carta. En el hadiz, es un relato del Sucesor que omite al compañero y va directamente al Profeta, y su autoridad es cuestionada. En las normas, un contrato o divorcio por mensajero o carta es válido bajo sus condiciones, el objeto enviado sigue siendo propiedad del remitente hasta que el destinatario lo reciba, y la responsabilidad se deriva de las circunstancias. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2173} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2180}"
  fr: "Dans le lexique, « irsal » signifie libération, négligence, orientation et habilitation; dans l’usage juridique, il englobe le fait de laisser pendre les mains pendant la prière, de laisser pendre l’extrémité du turban et d’envoyer un messager avec de l’argent ou une lettre. Dans les hadiths, il s’agit d’un récit d’un Successeur qui omet le Compagnon et s’adresse directement au Prophète; son autorité est contestée. Selon la jurisprudence, un contrat ou un divorce par messager ou lettre est valable sous certaines conditions; l’objet envoyé reste la propriété de l’expéditeur jusqu’à ce que le destinataire le reçoive; et la responsabilité dépend des circonstances. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2173} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2180}"
  tr: "Dilde 'arsal' mutlaklık, ihmal, rehberlik ve kontrol anlamına gelir. Hukukçuların kullanımında, namaz sırasında ellerin gevşetilmesi, sarığın gönderilmesi ve elçiye para veya kitap gönderilmesi anlamına gelir. Hadiste, takipçinin hadisi Peygamber'e yükseltmesi, sahabeye değil yükseltmesi ve hukukçular arasında otorite konusunda anlaşmazlık yaşanmasıdır. Hükümlerde: Peygamber ve Kitap ile yapılan sözleşme ve boşanma, kendi koşulları altında geçerlidir ve iletilen nesne, gönderici teslim alana kadar göndericide kalır ve duruma göre sorumluluk üstlenir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.2173} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.2180}"
  id: "Dalam bahasa, 'arsal' berarti absolut, pengabaian, bimbingan, dan kontrol. Dalam penggunaan para ahli hukum, ini termasuk merilekskan tangan saat shalat, mengirimkan sorban, dan mengirim utusan dengan uang atau buku. Dalam hadits, ini terjadi ketika pengikut mengangkat hadis kepada Nabi dan bukan kepada sahabat, dan terdapat perbedaan pendapat di antara para ahli hukum mengenai otoritasnya. Dalam keputusan: Kontrak dan perceraian dengan Nabi dan Kitab berlaku dalam syaratnya, dan barang yang dikirimkan tetap menjadi milik pengirim sampai pengirim mengambil alih, dan tanggung jawab ditanggung sesuai situasi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.2173} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.2180}"
