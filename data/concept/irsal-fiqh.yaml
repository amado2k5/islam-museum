label:
  ar: "إرسال"
  en: "Irsal (sending; the mursal report)"
  ur: "ارسال (بھیجنا، مرسل روایت)"
summary:
  ar: "الإرسال في اللغة الإطلاق والإهمال والتوجيه والتسليط، وفي استعمال الفقهاء يشمل إرخاء اليدين في الصلاة وإرسال العمامة وإرسال الرسول بالمال أو الكتاب. وفي الحديث هو أن يرفع التابعي الحديث إلى النبي دون الصحابي، وفي حجيته خلاف بين الفقهاء. وفي الأحكام: يصح العقد والطلاق بالرسول والكتاب بشروطه، وتبقى الشيء المرسل على ملك مرسله حتى يقبضه المرسل إليه، ويتحمل الضمان بحسب الحال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2173} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2180}"
  en: "Irsal in the lexicon is release, neglect, direction and empowerment; in the jurists' usage it covers letting the hands hang in prayer, letting the turban's end hang, and sending a messenger with money or a letter. In hadith it is a Successor's report that omits the companion and goes straight to the Prophet, and its authority is disputed. In the rulings, a contract or divorce by messenger or letter is valid under its conditions, the sent thing remains the sender's property until the addressee takes it, and liability follows the circumstances. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2173} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2180}"
  ur: "ارسال لغت میں چھوڑنا، بے پروائی، توجہ اور مسلط کرنا ہے؛ فقہاء کے استعمال میں نماز میں ہاتھ لٹکانا، عمامے کا پلو چھوڑنا، اور مال یا خط دے کر پیغامبر بھیجنا بھی اس میں شامل ہے۔ حدیث میں یہ وہ روایت ہے جس میں تابعی صحابی کو چھوڑ کر براہ راست نبی کی طرف بات منسوب کرتا ہے، اور اس کی حجیت میں اختلاف ہے۔ احکام میں پیغامبر یا خط کے ذریعے نکاح اور طلاق اپنی شرائط کے ساتھ درست ہیں، بھیجی ہوئی چیز مرسل الیہ کے قبضے تک بھیجنے والے کی ملکیت رہتی ہے، اور ضمان حالات کے مطابق ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2173} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2180}"
