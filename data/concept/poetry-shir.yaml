id: concept/poetry-shir
class: concept
kind: legal
label:
  ar: "الشِّعْر"
  en: "Poetry (shi'r): its permissibility, limits, teaching, recitation and the rulings that touch poets"
  es: "Poesía (shi'r): su permisibilidad, límites, enseñanza, recitación y las normas que afectan a los poetas."
  fr: "La poésie (shi'r): sa permissibilité, ses limites, son enseignement, sa récitation et les règles qui concernent les poètes"
  ur: "شعر ⁦(شعر)⁩: اس کی اجازت، حدود، درس، تلاوت اور وہ احکام جو شاعروں کو چھوتے ہیں۔"
  tr: "Saç"
  id: "Rambut"
summary:
  ar: "الشعر لغة العلم، وغلب على الكلام المنظوم لشرف وزنه وقافيته، واصطلاحا الكلام المقفى الموزون على سبيل القصد. وأجمع أهل العلم على إباحته ما لم يتضمن محرما، وجعله بعضهم واجبا في معرفة شعر الجاهلية لفهم الكتاب والسنة، ويستحب إذا تضمن الذكر والثناء والمواعظ، ويحرم إذا تضمن الفحش أو الهجاء بغير حق أو الكذب المحض، ويكره إذا أكثر منه المرء حتى شغله عن ذكر الله. ويختلف الفقهاء في تعلمه وإنشاده في المسجد وفي التكسب به وفي قبول شهادة الشاعر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10084} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10086} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10088} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10095}"
  en: "Shi'r in language means knowledge; the word came to be used for measured and rhymed speech because of its worth. In law it is speech that is rhymed and metred, composed on purpose. The jurists agree it is permissible unless it contains something forbidden; some hold that knowing the pre-Islamic poetry is a communal duty for understanding the Qur'an and the sunna. It is recommended when it praises God and the Prophet or gives moral counsel, forbidden when it is obscene, satirises without right or is pure lies, and disliked when a man indulges in it so much that it distracts him from the remembrance of God. They differ on learning it, reciting it in the mosque, earning by it and accepting the testimony of a poet. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10084} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10086} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10088} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10095}"
  es: "Shi'r, en el idioma, significa conocimiento; la palabra llegó a usarse para el discurso medido y rimado debido a su valor. En derecho, es el discurso rimado y métrico, compuesto con un propósito. Los juristas coinciden en que es permisible a menos que contenga algo prohibido; algunos sostienen que conocer la poesía preislámica es un deber comunitario para comprender el Corán y la Sunna. Se recomienda cuando alaba a Dios y al Profeta o brinda consejo moral, se prohíbe cuando es obscena, satiriza sin derecho o es pura mentira, y se desaconseja cuando una persona se entrega tanto a ella que la distrae del recuerdo de Dios. Existen discrepancias sobre su aprendizaje, su recitación en la mezquita, su obtención de ingresos y la aceptación del testimonio de un poeta. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10084} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10086} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10088} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10095}"
  fr: "En linguistique, le terme « shi'r » signifie connaissance; il en est venu à désigner un discours mesuré et rimé en raison de sa valeur. En droit, il s'agit d'un discours rimé et métrique, composé intentionnellement. Les juristes s'accordent à dire qu'il est permis, sauf s'il contient quelque chose d'interdit; certains estiment que la connaissance de la poésie préislamique est un devoir communautaire pour la compréhension du Coran et de la Sunna. Elle est recommandée lorsqu'elle loue Dieu et le Prophète ou prodigue des conseils moraux, interdite lorsqu'elle est obscène, satirique sans fondement ou mensongère, et déconseillée lorsqu'on s'y adonne au point d'en être distrait du souvenir de Dieu. Les avis divergent quant à son apprentissage, sa récitation à la mosquée, le fait d'en tirer profit et l'acceptation du témoignage d'un poète. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10084} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10086} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10088} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10095}"
  ur: "زبان میں شعر کا مطلب علم ہے۔ یہ لفظ اس کی قیمت کی وجہ سے ناپے ہوئے اور شاعری والی تقریر کے لیے استعمال ہوا۔ قانون میں یہ تقریر ہے جو تال اور میٹرڈ ہوتی ہے، مقصد کے مطابق بنائی جاتی ہے۔ فقہاء کا اتفاق ہے کہ یہ جائز ہے جب تک کہ اس میں کوئی حرام چیز نہ ہو۔ بعض کا خیال ہے کہ قبل از اسلام شاعری کو جاننا قرآن و سنت کو سمجھنے کے لیے اجتماعی فرض ہے۔ مستحب ہے جب خدا اور رسول کی تعریف کرے یا اخلاقی نصیحت کرے، حرام ہے جب فحش ہو، حق کے بغیر طنز کرے یا خالص جھوٹ ہو، اور ناپسندیدہ ہے جب آدمی اس میں اس قدر مشغول ہو کہ اس سے خدا کی یاد سے غافل ہو جائے۔ اس کے سیکھنے، مسجد میں پڑھنے، اس سے کمانے اور شاعر کی گواہی قبول کرنے میں اختلاف ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10084} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10086} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10088} صفحہ 10095}"
  tr: "Şiir, bilgi dilidir ve asil ölçüsü ve kafiyesi nedeniyle komik konuşmanın önüne geçer; geleneksel olarak, amaç için tasarlanmış kafiyeli, ölçülü bir konuşmadır. Bilginler, yasak bir şey içermediği sürece bunun caiz olduğu konusunda oybirliğiyle hemfikirdir ve bazıları, İslam öncesi şiiri anlamak için Kur'an ve Sünnet'i anlamayı zorunlu kılmıştır. Eğer anma, övgü ve uyarılar içeriyorsa tavsiye edilir; müstehcenlik, hiciv, gerçek olmayan veya açık yalan içeriyorsa yasaktır. Eğer bu dili o kadar aşması ve Allah'ın anıtmasından dikkati dağıtması hoş karşılanmaz. Hukukçular, camide şiiri öğrenmek ve ilahi okumak, geçimini sağlamak ve şairin tanıklığını kabul etmek konusunda farklı görüşlere sahiptir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.10084} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.10086} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.10088} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.10095}"
  id: "Puisi adalah bahasa pengetahuan, dan bahasa ini lebih dominan daripada ucapan yang disusun karena irama dan irama yang mulia, dan secara konvensional, puisi adalah bahasa berrima dan berukuran yang dimaksudkan untuk tujuan tertentu. Para ulama sepakat bahwa puisi diperbolehkan selama tidak mengandung sesuatu yang terlarang, dan beberapa orang mewajibkan pemahaman puisi pra-Islam untuk memahami Al-Qur'an dan Sunnah. Puisi ini direkomendasikan jika mengandung peringatan, pujian, dan peringatan, dan dilarang jika mengandung kata-kata cabul, satir, tanpa kebenaran, atau kebohongan terang-terangan. Puisi ini tidak disukai jika melebihi batas itu sampai mengalihkan perhatian dari ingatan akan Allah. Para ahli hukum berbeda pendapat mengenai belajar dan melantunkannya di masjid, mencari nafkah darinya, dan menerima kesaksian penyair. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10084} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10086} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10088} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10095}"
