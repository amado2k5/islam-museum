label:
  ar: "الشِّعْر"
  en: "Poetry (shi'r): its permissibility, limits, teaching, recitation and the rulings that touch poets"
summary:
  ar: "الشعر لغة العلم، وغلب على الكلام المنظوم لشرف وزنه وقافيته، واصطلاحا الكلام المقفى الموزون على سبيل القصد. وأجمع أهل العلم على إباحته ما لم يتضمن محرما، وجعله بعضهم واجبا في معرفة شعر الجاهلية لفهم الكتاب والسنة، ويستحب إذا تضمن الذكر والثناء والمواعظ، ويحرم إذا تضمن الفحش أو الهجاء بغير حق أو الكذب المحض، ويكره إذا أكثر منه المرء حتى شغله عن ذكر الله. ويختلف الفقهاء في تعلمه وإنشاده في المسجد وفي التكسب به وفي قبول شهادة الشاعر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10084} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10086} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10088} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10095}"
  en: "Shi'r in language means knowledge; the word came to be used for measured and rhymed speech because of its worth. In law it is speech that is rhymed and metred, composed on purpose. The jurists agree it is permissible unless it contains something forbidden; some hold that knowing the pre-Islamic poetry is a communal duty for understanding the Qur'an and the sunna. It is recommended when it praises God and the Prophet or gives moral counsel, forbidden when it is obscene, satirises without right or is pure lies, and disliked when a man indulges in it so much that it distracts him from the remembrance of God. They differ on learning it, reciting it in the mosque, earning by it and accepting the testimony of a poet. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10084} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10086} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10088} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10095}"
