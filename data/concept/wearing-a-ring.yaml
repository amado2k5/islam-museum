summary:
  ar: "التختم لبس الخاتم في الإصبع، والفقهاء يبحثونه بحسب مادة الخاتم وموضعه ووزنه وعدده ونقشه وفصّه. التختم بالذهب جائز للنساء ومحرّم على الرجال، والتختم بالفضة جائز للمرأة وللرجل على تفصيل بين المذاهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4792} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4794} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4795}"
  en: "Wearing a ring means putting a ring on a finger. Jurists examine it by the metal of the ring, where it is worn, its weight, number, inscription and stone. Gold is lawful for women and forbidden to men; silver is lawful for women and, with differences between the schools, for men. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4792} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4794} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4795}"
