id: concept/afyus
class: concept
kind: natural
label:
  ar: "أفيوس"
  en: "Afyus (not the poppy juice afyun)"
  fr: "Afyus (distinct de l’afyun, suc du pavot)"
  ur: "افیوس ⁦(افیون سے الگ)⁩"
  es: "Afyus (no el afyun de jugo de amapola)"
summary:
  ar: "شيء يشدّ الحدقة، بارد في الثانية مجفّف في الأولى، وثمرته تنفع من اليرقان، ويحفظ عانة الصبيان فلا ينبت عليها الشعر مدة، وفي هامش المحقق أنه الشلجم {cite:canon-ibn-sina-print-v1 p.379}."
  en: "Something that tightens the pupil; cold in the second degree and drying in the first, and its fruit helps jaundice. It keeps the pubic area of boys free of hair for a time. The editor's note says it is turnip {cite:canon-ibn-sina-print-v1 p.379}. Not to be confused with afyun, the poppy juice, which has its own entry."
  fr: "Une substance qui resserre la pupille ; froide au deuxième degré et desséchante au premier, et dont le fruit soulage la jaunisse. Elle empêche pendant un temps la pousse des poils sur le pubis des garçons. La note de l’éditeur indique qu’il s’agit du navet {cite:canon-ibn-sina-print-v1 p.379}. À ne pas confondre avec l’afyun, le suc du pavot, qui possède sa propre entrée."
  ur: "وہ چیز جو پتلی کو سکیڑتی ہے؛ دوسرے درجے میں ٹھنڈی اور پہلے میں خشک، اور اس کا پھل یرقان میں نفع دیتا ہے۔ یہ لڑکوں کی شرم گاہ پر کچھ عرصے تک بال نہیں اگنے دیتی۔ حاشیے میں اسے شلجم بتایا گیا ہے {cite:canon-ibn-sina-print-v1 p.379}۔ اسے افیون، یعنی پوست کے رس، سے خلط نہ کیا جائے، جس کا اپنا اندراج ہے۔"
  es: "Algo que contrae la pupila; frío en segundo grado y secante en primero, y su fruto ayuda con la ictericia. Mantiene la zona púbica de los chicos libre de vello durante un tiempo. La nota del editor dice que es nabo {cite:canon-ibn-sina-print-v1 p.379}. No confundir con afyun, el jugo de amapola, que tiene su propia entrada."
