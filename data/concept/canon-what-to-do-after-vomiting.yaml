label: { ar: "تدبير من تقيأ بعد الفراغ من القيء عند ابن سينا", en: "What the patient does after vomiting in the Canon", ur: "قانون میں قے کے بعد کی تدبیر" }
summary:
  ar: "يرتب ابن سينا ما يفعله المتقيئ بعد فراغه: غسل الفم والوجه بخل ممزوج بماء، وشرب شيء من المصطكى بماء التفاح، والامتناع عن الأكل والماء، والراحة، ودهن الشراسيف، ودخول الحمام، ثم طعام لذيذ جيد الجوهر سريع الهضم عند الضرورة {cite:canon-ibn-sina-print-v1 p.287}."
  en: "Ibn Sina sets out what the patient does once he has finished vomiting: wash mouth and face with vinegar mixed with water, drink a little mastic in apple water, abstain from food and water, rest, oil the soft part under the ribs, enter the bath, and if he must be fed, eat something pleasant, of good substance and quick to digest {cite:canon-ibn-sina-print-v1 p.287}."
