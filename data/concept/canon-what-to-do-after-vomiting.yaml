id: concept/canon-what-to-do-after-vomiting
class: concept
kind: scientific
label: { ar: "تدبير من تقيأ بعد الفراغ من القيء عند ابن سينا", en: "What the patient does after vomiting in the Canon", ur: "قانون میں قے کے بعد کی تدبیر", es: "Lo que hace el paciente después de vomitar en el Canon", fr: "Que fait le patient après avoir vomi dans le Canon ?" }
summary:
  ar: "يرتب ابن سينا ما يفعله المتقيئ بعد فراغه: غسل الفم والوجه بخل ممزوج بماء، وشرب شيء من المصطكى بماء التفاح، والامتناع عن الأكل والماء، والراحة، ودهن الشراسيف، ودخول الحمام، ثم طعام لذيذ جيد الجوهر سريع الهضم عند الضرورة {cite:canon-ibn-sina-print-v1 p.287}."
  en: "Ibn Sina sets out what the patient does once he has finished vomiting: wash mouth and face with vinegar mixed with water, drink a little mastic in apple water, abstain from food and water, rest, oil the soft part under the ribs, enter the bath, and if he must be fed, eat something pleasant, of good substance and quick to digest {cite:canon-ibn-sina-print-v1 p.287}."
  es: "Ibn Sina expone lo que debe hacer el paciente una vez que haya terminado de vomitar: lavarse la boca y la cara con vinagre mezclado con agua, beber un poco de mástique en agua de manzana, abstenerse de comer y beber, descansar, ungir con aceite la parte blanda debajo de las costillas, entrar en el baño y, si debe comer, ingerir algo agradable, de buena sustancia y de fácil digestión {cite:canon-ibn-sina-print-v1 p.287}."
  fr: "Ibn Sina décrit ce que le patient doit faire une fois qu'il a fini de vomir: se laver la bouche et le visage avec du vinaigre mélangé à de l'eau, boire un peu de mastic dans de l'eau de pomme, s'abstenir de nourriture et d'eau, se reposer, huiler la partie molle sous les côtes, entrer dans le bain, et s'il doit être nourri, manger quelque chose d'agréable, de bonne substance et facile à digérer {cite:canon-ibn-sina-print-v1 p.287}."
  ur: "ابن سینا بتاتے ہیں کہ قے آنے کے بعد مریض کیا کرتا ہے: پانی میں سرکہ ملا کر منہ اور چہرہ دھوئے، سیب کے پانی میں تھوڑا سا مستطیع پیئے، کھانے اور پانی سے پرہیز کرے، آرام کرے، پسلیوں کے نیچے نرم حصے میں تیل ڈالے، غسل میں داخل ہو، اور اگر اسے کھانا کھلانا ضروری ہے تو کوئی لذیذ چیز کھائیں، اچھی چیز اور فوری طور پر کھانے کے لیے۔ صفحہ 287}۔"
