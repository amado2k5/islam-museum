issue:
  ar: "بأي سلطان يوسوس الشيطان للإنسان، وهل يملك إكراهه؟"
  en: "By what authority does Satan whisper to a person, and can he compel him?"
  ur: "شیطان کس سلطان سے انسان کو وسوسہ ڈالتا ہے، اور کیا وہ اسے مجبور کر سکتا ہے؟"
