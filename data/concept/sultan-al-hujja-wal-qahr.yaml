id: concept/sultan-al-hujja-wal-qahr
class: concept
kind: doctrine
label:
  ar: "سلطان الحجة وسلطان القهر"
  en: "Sultan al-hujja and sultan al-qahr (authority of argument and of compulsion)"
  ur: "سلطانِ حجت اور سلطانِ قہر"
summary:
  ar: "تفريق الشعراوي بين نوعين من السلطان في سياق وسوسة إبليس: سلطان القهر، وهو ما يُكره به الإنسان على فعل لا يريده، وسلطان الحجة، وهو الإقناع. ويرى أن الشيطان لا يملك الأول ولا الثاني، وإنما يجد هوى في النفس فيتبعه، وأن الطاعة بلا ابتلاء لا تُظهر قوة الإيمان، وأن إبليس أتى من الجهات الأربع لا من فوق ولا من تحت، وأن معصية إبليس كانت رداً للأمر على الآمر، أما معصية آدم فاعتراف بالضعف {cite:tafsir-sharawi-khawatir-scan p.33} {cite:tafsir-sharawi-khawatir-scan p.35} {cite:tafsir-sharawi-khawatir-scan p.36} {cite:tafsir-sharawi-khawatir-scan p.37}. هذا تفسيره ويُنسب إليه."
  en: "Sha'rawi separates two kinds of authority in the context of Satan's whispering: the authority of compulsion, forcing a person to act against his will, and the authority of argument, persuading him. He holds that Satan has neither; he finds a desire in the self and follows it. Obedience with no test shows no strength of faith. Iblis came from the four sides and not from above or below. Iblis's disobedience answered the command with refusal, while Adam's admitted weakness {cite:tafsir-sharawi-khawatir-scan p.33} {cite:tafsir-sharawi-khawatir-scan p.35} {cite:tafsir-sharawi-khawatir-scan p.36} {cite:tafsir-sharawi-khawatir-scan p.37}. This is Sha'rawi's reading and is attributed to him."
  ur: "شعراوی شیطان کی وسوسہ کے سیاق میں دو قسم کے سلطان میں فرق کرتے ہیں: سلطانِ قہر، یعنی کسی کو اس کی مرضی کے خلاف کام پر مجبور کرنا، اور سلطانِ حجت، یعنی قائل کرنا۔ ان کے نزدیک شیطان کے پاس نہ یہ ہے نہ وہ؛ وہ نفس میں خواہش پاتا ہے اور اس کی پیروی کراتا ہے۔ آزمائش کے بغیر اطاعت ایمان کی قوت ظاہر نہیں کرتی۔ ابلیس چاروں اطراف سے آیا، اوپر یا نیچے سے نہیں۔ ابلیس کی نافرمانی حکم کو رد کرنے کی تھی، جبکہ آدم کی کمزوری کا اعتراف تھا {cite:tafsir-sharawi-khawatir-scan p.33} {cite:tafsir-sharawi-khawatir-scan p.35} {cite:tafsir-sharawi-khawatir-scan p.36} {cite:tafsir-sharawi-khawatir-scan p.37}۔ یہ شعراوی کی تفسیر ہے اور ان کی طرف منسوب ہے۔"
