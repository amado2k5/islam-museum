id: concept/adornment-of-desires
class: concept
kind: belief
label: { ar: "تزيين الشهوات ومتاع الدنيا", en: "The adornment of desires and the goods of this world", ur: "خواہشات کی زینت اور دنیا کا متاع" }
summary:
  ar: "يرى الشعراوي في قوله تعالى «محبة الشهوات المزينة» أن الميل الذي يحفظ الحياة مقبول، وأن الزيادة عليه مذمومة، وأن الزينة فوق الجوهر، وأن الشهوات مفاتيح تختلف باختلاف النفوس، وأن الدنيا محدودة بعمر الإنسان، وأن الغض عن المحرم يملأ العين في الآخرة بالمباح {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1310} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1311} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1317} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1322}."
  en: "On the verse that the love of desires is made attractive to people, Sha'rawi holds that the inclination which sustains life is permitted, that excess is blameworthy, and that adornment is something added to substance. Desires are keys that differ from person to person. The world is bounded by a person's life span, and lowering the gaze from what is forbidden fills the eye with what is lawful in the Hereafter {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1310} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1311} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1317} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1322}."
  ur: "شعراوی اس آیت پر کہ لوگوں کے لیے خواہشات کی محبت مزین کی گئی، کہتے ہیں کہ وہ میلان جو زندگی کو قائم رکھے جائز ہے، اور اس سے زیادتی مذموم ہے، اور زینت جوہر کے اوپر کی چیز ہے۔ خواہشات ہر شخص کے لیے مختلف کنجیاں ہیں، دنیا انسان کی عمر تک محدود ہے، اور حرام سے نگاہ نیچی رکھنا آخرت میں آنکھ کو حلال سے بھر دیتا ہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1310} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1311} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1317} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1322}۔"
