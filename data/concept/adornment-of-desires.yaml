id: concept/adornment-of-desires
class: concept
kind: belief
label: { ar: "تزيين الشهوات ومتاع الدنيا", en: "The adornment of desires and the goods of this world", fr: "L’attrait des désirs et les biens de ce monde", ur: "خواہشات کی زینت اور دنیا کا متاع", es: "El adorno de los deseos y los bienes de este mundo.", tr: "Dünyanın arzularını ve zevklerini süslemek", id: "Menghiasi keinginan dan kesenangan dunia" }
summary:
  ar: "يرى الشعراوي في قوله تعالى «محبة الشهوات المزينة» أن الميل الذي يحفظ الحياة مقبول، وأن الزيادة عليه مذمومة، وأن الزينة فوق الجوهر، وأن الشهوات مفاتيح تختلف باختلاف النفوس، وأن الدنيا محدودة بعمر الإنسان، وأن الغض عن المحرم يملأ العين في الآخرة بالمباح {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1310} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1311} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1317} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1322}."
  en: "On the verse that the love of desires is made attractive to people, Sha'rawi holds that the inclination which sustains life is permitted, that excess is blameworthy, and that adornment is something added to substance. Desires are keys that differ from person to person. The world is bounded by a person's life span, and lowering the gaze from what is forbidden fills the eye with what is lawful in the Hereafter {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1310} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1311} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1317} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1322}."
  fr: "À propos du verset où l’amour des objets du désir est rendu attrayant aux yeux des gens, Sha’rawi estime que le penchant qui entretient la vie est permis, que l’excès est blâmable et que la parure s’ajoute à la substance. Les désirs sont des clés qui diffèrent d’une personne à l’autre. Ce monde se mesure à la durée d’une vie ; détourner le regard de l’interdit le comble de ce qui est licite dans l’au-delà {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1310} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1311} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1317} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1322}."
  ur: "شعراوی اس آیت پر کہ لوگوں کے لیے خواہشات کی محبت مزین کی گئی، کہتے ہیں کہ وہ میلان جو زندگی کو قائم رکھے جائز ہے، اور اس سے زیادتی مذموم ہے، اور زینت جوہر کے اوپر کی چیز ہے۔ خواہشات ہر شخص کے لیے مختلف کنجیاں ہیں، دنیا انسان کی عمر تک محدود ہے، اور حرام سے نگاہ نیچی رکھنا آخرت میں آنکھ کو حلال سے بھر دیتا ہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1310} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1311} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1317} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1322}۔"
  es: "Sobre el versículo que dice que el amor a los deseos hace atractiva a la gente, Sha'rawi sostiene que la inclinación que sustenta la vida está permitida, que el exceso es censurable y que el adorno es algo añadido a la sustancia. Los deseos son claves que difieren de persona a persona. El mundo está limitado por la duración de la vida de una persona, y bajar la mirada de lo prohibido llena el ojo con lo que es lícito en el Más Allá {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1310} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1311} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1317} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1322}."
  tr: "El-Şaarawi, \"Süslü arzuların sevgisi\" dizesinde yaşamı koruyan eğilimin kabul edilebilir olduğunu, aşırılığın suçlanacak olduğunu, süslemenin özün üzerinde olduğunu, arzuların farklı ruhlara göre farklı anahtarlar olduğunu, bu dünyanın insan ömrüne göre sınırlı olduğunu ve yasak olandan uzaklaşmanın ahirette gözleri izin verilenlerle doldurduğunu görür {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1310} {cite:tafsir-sharawi-khawatir-scan-vol-vol-vol-vol-2 s.1322}."
  id: "Dalam baris \"Cinta terhadap hasrat khayalan,\" Al-Shaarawi melihat bahwa kecenderungan untuk mempertahankan kehidupan dapat diterima, bahwa kelebihan harus disalahkan, bahwa ornamen berada di atas esensi, keinginan adalah kunci yang berbeda menurut jiwa yang berbeda, bahwa dunia ini terbatas menurut umur manusia, dan bahwa menjauh dari yang terlarang memenuhi mata di akhirat dengan apa yang diperbolehkan {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 hlm.1310} {cite:tafsir-sharawi-khawatir-scan-vol-vol-vol-vol-2 hlm.1322}."
