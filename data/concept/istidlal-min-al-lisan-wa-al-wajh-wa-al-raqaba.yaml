id: concept/istidlal-min-al-lisan-wa-al-wajh-wa-al-raqaba
class: concept
kind: scientific
label:
  ar: "الاستدلال من اللسان والوجه والرقبة والأعصاب"
  en: "Inference from the tongue, the face, the neck and the nerves"
  ur: "زبان، چہرے، گردن اور اعصاب سے استدلال"
  es: "Inferencia a partir de la lengua, la cara, el cuello y los nervios."
  fr: "Déduction à partir de la langue, du visage, du cou et des nerfs"
  tr: "Dil, yüz, boyun ve sinirlerden çıkarım"
  id: "Inferensi dari lidah, wajah, leher, dan saraf"
summary:
  ar: "يذكر ابن سينا ما يدل عليه لون اللسان ولون الوجه وسمنه وهزاله وغلظ الرقبة ودقتها وقبولها الخنازير وحال الأعصاب، ويقرن بها ما يشبهها {cite:canon-ibn-sina-print-v2 pp.20-21}"
  en: "Ibn Sina gives what the colour of the tongue, the colour, fatness and leanness of the face, the thickness or thinness of the neck and its readiness for scrofula, and the state of the nerves indicate {cite:canon-ibn-sina-print-v2 pp.20-21}"
  ur: "ابن سینا بتاتا ہے کہ زبان کا رنگ، چہرے کا رنگ، موٹاپا اور دبلاپن، گردن کی موٹائی یا باریکی اور اس کا خنازیر قبول کرنا، اور اعصاب کی حالت کس چیز پر دلالت کرتے ہیں {cite:canon-ibn-sina-print-v2 pp.20-21}۔"
  es: "Ibn Sina indica lo que significan el color de la lengua, el color, la gordura y la delgadez del rostro, el grosor o la delgadez del cuello y su predisposición a la escrófula, y el estado de los nervios {cite:canon-ibn-sina-print-v2 pp.20-21}"
  fr: "Ibn Sina donne ce que la couleur de la langue, la couleur, la graisse et la maigreur du visage, l'épaisseur ou la minceur du cou et sa prédisposition à la scrofule, ainsi que l'état des nerfs indiquent {cite:canon-ibn-sina-print-v2 pp.20-21}"
  tr: "İbn Sina, dilin rengi, yüz rengi, yağlılığı, zayıflığı, boynun kalınlığı ve hassasiyeti, domuzlar tarafından kabul edilmesi ve sinirlerin durumu ile belirtilir ve bunu benzer bir şeyle ilişkilendirir {cite:canon-ibn-sina-print-v2 s.20-21}"
  id: "Ibn Sina menyebutkan apa yang ditunjukkan oleh warna lidah, warna wajah, kegemukannya, kurusnya, ketebalan dan ketelitian leher, penerimaannya oleh babi, dan keadaan saraf, dan ia mengaitkannya dengan sesuatu yang serupa {cite:canon-ibn-sina-print-v2 hlm.20-21}"
