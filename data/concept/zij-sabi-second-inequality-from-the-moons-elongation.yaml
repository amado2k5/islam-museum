class: concept
kind: scientific
label: { ar: "الاختلاف الثاني من بُعد القمر عن الشمس", en: "The second inequality from the Moon's elongation from the Sun", ur: "سورج سے چاند کے فاصلے سے دوسرا اختلاف", es: "La segunda desigualdad se debe al alargamiento de la Luna con respecto al Sol.", fr: "La seconde inégalité provient de l'élongation de la Lune par rapport au Soleil.", tr: "İkinci fark ise Ay'ın Güneş'e olan uzaklığıdır.", id: "Perbedaan kedua adalah jarak bulan dari matahari." }
summary:
  ar: "الاختلاف الثاني الذي يتبع بُعد القمر عن الشمس يبلغ في أكثر ما وجده الراصدون نحو جزءين وثلثي جزء، فإذا جُمع مع الاختلاف المفرد بلغ المجموع نحو سبعة أجزاء وأربعين دقيقة. {cite:zij-sabi-nallino-byblion p.79}."
  en: "The second inequality, which follows the Moon's elongation from the Sun, reaches about two and two-thirds parts in the greatest case the observers found. Added to the single inequality, the total comes to about seven parts and forty minutes. {cite:zij-sabi-nallino-byblion p.79}."
  ur: "سورج سے چاند کے فاصلے پر مبنی دوسرا اختلاف، رصد کرنے والوں کے پائے گئے زیادہ سے زیادہ مقدار میں، تقریباً دو اجزاء اور دو تہائی جزء تک جاتا ہے۔ واحد اختلاف کے ساتھ جمع ہو کر کل تقریباً سات اجزاء اور چالیس دقائق بنتا ہے۔ {cite:zij-sabi-nallino-byblion p.79}۔"
  es: "La segunda desigualdad, que sigue la elongación de la Luna con respecto al Sol, alcanza aproximadamente dos partes y dos tercios en el caso máximo que encontraron los observadores. Sumada a la primera desigualdad, el total asciende a aproximadamente siete partes y cuarenta minutos. {cite:zij-sabi-nallino-byblion p.79}."
  fr: "La seconde inégalité, qui suit l'élongation de la Lune par rapport au Soleil, atteint environ deux parties et deux tiers dans le cas le plus extrême observé. Ajoutée à la première inégalité, on obtient un total d'environ sept parties et quarante minutes. {cite:zij-sabi-nallino-byblion p.79}."
  tr: "Ayın güneşe olan uzaklığını takip eden ikinci fark, çoğu gözlemde yaklaşık iki buçuk kısım kadardır. Tek farkla birleştirildiğinde, toplam yaklaşık yedi kısım ve kırk dakikaya ulaşır. {cite:zij-sabi-nallino-byblion s.79}."
  id: "Perbedaan kedua, yang mengikuti jarak bulan dari matahari, berjumlah sekitar dua dan dua pertiga bagian dalam sebagian besar pengamatan. Jika digabungkan dengan perbedaan tunggal, totalnya mencapai sekitar tujuh bagian dan empat puluh menit. {cite:zij-sabi-nallino-byblion p.79}."
