summary:
  ar: "النحاس في الكتاب أنواع، أفضلها القبرصي، حار يابس في الثالثة، والمحرق فيه قبض وحدة وإدمال، ويدمل الخبيثة الساعية ويأكل اللحم الزائد وينفع العين، ويحذر الكتاب من حفظ الأطعمة في آنيته لأن الزنجار سم قاتل {cite:canon-ibn-sina-print-v1 p.581}."
  en: "Nuhas, copper, is in the book of several kinds, the Cypriot the best, hot and dry in the third degree; the burnt has astringency, sharpness and healing, it heals the malignant creeping ulcer, eats excess flesh and helps the eye, and the book warns against keeping foods in copper vessels because verdigris is a deadly poison {cite:canon-ibn-sina-print-v1 p.581}."
  ur: "نحاس ⁦(تانبا)⁩ کتاب میں کئی قسم کا ہے، سب سے بہتر قبرصی، تیسرے درجے میں گرم خشک؛ جلا ہوا قبض، تیزی اور زخم بھرنے کی صفت رکھتا ہے، خبیث رینگنے والے زخم کو بھرتا، زائد گوشت کھاتا اور آنکھ میں مفید ہے، اور کتاب خبردار کرتی ہے کہ کھانے تانبے کے برتنوں میں نہ رکھے جائیں کیونکہ زنجار مہلک زہر ہے {cite:canon-ibn-sina-print-v1 p.581}۔"
  es: "Nuhas, cobre, es en el libro de varios tipos, el chipriota es el mejor, caliente y seco en tercer grado; el quemado tiene astringencia, agudeza y curación, cura la úlcera maligna reptante, come el exceso de carne y ayuda al ojo, y el libro advierte contra guardar alimentos en recipientes de cobre porque el cardenillo es un veneno mortal {cite:canon-ibn-sina-print-v1 p.581}."
