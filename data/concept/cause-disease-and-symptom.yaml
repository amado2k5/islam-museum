  en: "Ibn Sina opens the second part of the first book, on diseases, causes and general symptoms, by defining cause, disease and symptom with examples, and by showing that one thing may be, in relation to others, a cause, a disease and a symptom {cite:canon-ibn-sina-print-v1 pp.103-104}."
