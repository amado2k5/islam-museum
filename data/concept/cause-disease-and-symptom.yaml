id: concept/cause-disease-and-symptom
class: concept
kind: scientific
label: { ar: "السبب والمرض والعرض عند ابن سينا", en: "Cause, disease and symptom in the Canon", ur: "قانون میں سبب، مرض اور عرض", es: "Causa, enfermedad y síntoma en el Canon", fr: "Cause, maladie et symptôme dans le Canon", tr: "İbn Sina'ya göre Neden, Hastalık ve Belirti", id: "Penyebab, Penyakit, dan Gejala Menurut Ibn Sina" }
summary:
  ar: "يفتتح ابن سينا الفن الثاني من الكتاب الأول، في الأمراض والأسباب والأعراض الكلية، بتعريف السبب والمرض والعرض بأمثلتها، وبيان أن الواحد قد يكون بالنسبة إلى غيره سبباً ومرضاً وعرضاً {cite:canon-ibn-sina-print-v1 pp.103-104}."
  en: "Ibn Sina opens the second part of the first book, on diseases, causes and general symptoms, by defining cause, disease and symptom with examples, and by showing that one thing may be, in relation to others, a cause, a disease and a symptom {cite:canon-ibn-sina-print-v1 pp.103-104}."
  es: "Ibn Sina abre la segunda parte del primer libro, sobre enfermedades, causas y síntomas generales, definiendo causa, enfermedad y síntoma con ejemplos, y mostrando que una cosa puede ser, en relación con otras, una causa, una enfermedad y un síntoma {cite:canon-ibn-sina-print-v1 pp.103-104}."
  fr: "Ibn Sina ouvre la deuxième partie du premier livre, sur les maladies, les causes et les symptômes généraux, en définissant la cause, la maladie et le symptôme avec des exemples, et en montrant qu'une chose peut être, par rapport à d'autres, une cause, une maladie et un symptôme {cite:canon-ibn-sina-print-v1 pp.103-104}."
  ur: "ابن سینا نے پہلی کتاب کا دوسرا حصہ بیماریوں، اسباب اور عام علامات پر کھولا ہے، مثالوں کے ساتھ وجہ، بیماری اور علامات کی وضاحت کر کے، اور یہ ظاہر کر کے کہ ایک چیز، دوسروں کے سلسلے میں، ایک وجہ، بیماری اور ایک علامت ہوسکتی ہے۔"
  tr: "İbn Sina, ilk kitabın ikinci bölümü olan hastalıklar, nedenler ve genel semptomlar üzerine, nedenleri, hastalıkları ve semptomları örneklerle tanımlayarak açar ve bir kişinin diğerine kıyasla bir neden, hastalık ve belirti olabileceğini açıklar {cite:canon-ibn-sina-print-v1 s.103-104}."
  id: "Ibn Sina membuka bagian kedua dari buku pertama, tentang penyakit, penyebab, dan gejala umum, dengan mendefinisikan penyebab, penyakit, dan gejala melalui contoh, serta menjelaskan bahwa satu orang mungkin menjadi penyebab, penyakit, dan gejala dibandingkan dengan yang lain {cite:canon-ibn-sina-print-v1 hlm.103-104}."
