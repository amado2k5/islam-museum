summary:
  ar: "ثومون في الكتاب بزره قوي الحرارة، يسهل دما وأخلاطا مرارية ويخرج الديدان، ويذكر الكتاب فيه الإدرار دون أن يسمي السطر المطبوع ما يدره، وإخراج الجنين الميت في فقرة موسومة معلقة لحكم المؤسس {cite:canon-ibn-sina-print-v1 p.696}"
  en: "Thawmun is in the book a plant whose seed is strongly hot; it loosens blood and bilious humours and expels worms, and the book gives its promotion of flow, the printed line not saying what flows, and its bringing out of a dead foetus in a labelled section held for the founder's ruling {cite:canon-ibn-sina-print-v1 p.696}"
  ur: "ثومون کتاب میں ایک نبات ہے جس کا بیج بہت گرم ہے؛ خون اور صفراوی خلطوں کو خارج کرتا ہے اور کیڑے نکالتا ہے، اور کتاب اس کے بہاؤ لانے کا، جبکہ مطبوعہ سطر یہ نہیں بتاتی کہ کیا بہتا ہے، اور مردہ جنین کو نکالنے کا ذکر موسوم حصے میں کرتی ہے جو بانی کے فیصلے کے لیے موقوف ہے {cite:canon-ibn-sina-print-v1 p.696}۔"
  es: "Thawmun es en el libro una planta cuya semilla es muy caliente; afloja la sangre y los humores biliares y expulsa los gusanos, y el libro menciona su capacidad para promover el flujo, aunque la línea impresa no especifica qué fluye, y su capacidad para expulsar un feto muerto en una sección etiquetada reservada para el dictamen del fundador {cite:canon-ibn-sina-print-v1 p.696}"
