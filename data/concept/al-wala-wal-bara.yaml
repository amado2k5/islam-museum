label:
  ar: "الولاء والبراء بين المسلمين"
  en: "Wala' and bara' among Muslims"
issue:
  ar: "هل يطبق مفهوم الولاء والبراء بين المسلمين أنفسهم أم يقتصر على غير المسلمين، وهل يتحول إلى تكفير؟"
summary:
  ar: "حلقة «الوسطية» عن الولاء والبراء داخل الصف الإسلامي — بين الحركات والمذاهب والطوائف والعلمانيين المسلمين ودعاة السلام مع إسرائيل. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep09 00:01:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep09 00:02:00} صوّت الجمهور: 42% يرون إمكان تحوله إلى تكفير بسهولة؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep09 00:31:00} و63% يؤيدون البراء ممن يدعو للسلام مع إسرائيل؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep09 00:48:30} و63% يرون المفهوم يحتاج ضبطاً وأبحاثاً و10% يرون إلغاءه تماماً. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep09 01:03:30} وبلور المتحاورون قاعدة: نحب ما في الشخص من إسلام ونبرأ من مخالفته لا من شخصه — الإسلام درجات لا حدّ واحد. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep09 00:14:00}"
  en: "The 'Al-Wasatiyya' episode on wala' and bara' inside the Muslim rank — among movements, madhhabs, sects, secular Muslims, and advocates of peace with Israel. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep09 00:01:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep09 00:02:00} The audience voted: 42% saw it easily turning into takfir; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep09 00:31:00} 63% endorsed disavowal of whoever calls for peace with Israel; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep09 00:48:30} and 63% saw the concept needing definition and research while 10% would abolish it entirely. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep09 01:03:30} The panel distilled the rule: love the Islam in a person and disavow his violation, not his person — Islam is degrees, not a single bar. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep09 00:14:00}"
