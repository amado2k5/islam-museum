id: concept/al-wala-wal-bara
class: concept
kind: doctrine
sensitivity: contested
label:
  ar: "الولاء والبراء بين المسلمين"
  en: "Wala' and bara' among Muslims"
  ur: "مسلمانوں کے درمیان ولاء اور براء"
issue:
  ar: "هل يطبق مفهوم الولاء والبراء بين المسلمين أنفسهم أم يقتصر على غير المسلمين، وهل يتحول إلى تكفير؟"
  en: "Does the concept of wala' and bara' apply among Muslims themselves or only to non-Muslims, and does it turn into takfir?"
  ur: "کیا ولاء اور براء کا تصور خود مسلمانوں کے درمیان لاگو ہوتا ہے یا صرف غیر مسلموں پر، اور کیا یہ تکفیر میں بدل جاتا ہے؟"
summary:
  ar: "حلقة «الوسطية» عن الولاء والبراء داخل الصف الإسلامي — بين الفرق والمذاهب والحركات، ومع العلمانيين المسلمين ودعاة السلام مع إسرائيل وتارك الصلاة. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep09 00:01:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 00:01:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 00:02:00} صوّت 66% من جمهور الاستوديو أن وحدة المسلمين تشمل كل المسلمين؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep09 00:06:30} ورأى 23% أن تطبيق المفهوم بين المسلمين يتحول إلى تكفير بسهولة و35% أنه يتحول بغير سهولة و42% أنه لا يتحول؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 00:34:30} وأيّد 63% البراءة من كل من يدعو للسلام مع إسرائيل؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep09 00:48:30} وفضّل 63% إبقاء المصطلح وضبطه و27% استبداله و10% إلغاءه. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 01:09:30} وانتهى المتحاورون إلى أن البراءة من فرقة ما زالت من أهل القبلة تكون من عقائدها وأفعالها الخطأ لا منها كلها. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 00:28:30}"
  en: "The 'Al-Wasatiyya' episode on wala' and bara' inside the Muslim fold — among sects, schools and movements, and towards secular Muslims, advocates of peace with Israel and those who abandon prayer. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep09 00:01:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 00:01:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 00:02:00} Sixty-six percent of the studio audience voted that Muslim unity includes all Muslims; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep09 00:06:30} 23% thought applying the concept among Muslims turns easily into takfir, 35% that it does so but not easily, and 42% that it does not; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 00:34:30} 63% backed disavowing everyone who calls for peace with Israel; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep09 00:48:30} and 63% preferred keeping and defining the term, 27% replacing it and 10% abolishing it. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 01:09:30} The panel concluded that disavowal of a sect still within the people of the qibla is disavowal of its wrong beliefs and acts, not of the sect as a whole. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 00:28:30}"
  ur: "«الوسطیہ» کی وہ قسط جو مسلم صف کے اندر ولاء اور براء پر ہے — فرقوں، مسالک اور تحریکوں کے درمیان، اور سیکولر مسلمانوں، اسرائیل سے صلح کے داعیوں اور تارکِ نماز کے بارے میں۔ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep09 00:01:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 00:01:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 00:02:00} اسٹوڈیو حاضرین میں سے 66% نے ووٹ دیا کہ مسلم وحدت سب مسلمانوں کو شامل ہے؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep09 00:06:30} 23% کے خیال میں مسلمانوں کے درمیان اس تصور کا اطلاق آسانی سے تکفیر بن جاتا ہے، 35% کے نزدیک بن جاتا ہے مگر آسانی سے نہیں، اور 42% کے نزدیک نہیں بنتا؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 00:34:30} 63% نے اسرائیل سے صلح کے ہر داعی سے براءت کی تائید کی؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep09 00:48:30} اور 63% نے اصطلاح کو برقرار رکھ کر منضبط کرنے، 27% نے بدلنے اور 10% نے ختم کرنے کو ترجیح دی۔ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 01:09:30} مذاکرہ اس نتیجے پر پہنچا کہ اہلِ قبلہ میں شامل کسی فرقے سے براءت اس کے غلط عقائد اور افعال سے ہے، پورے فرقے سے نہیں۔ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 00:28:30}"
perspectives:
- tradition: sunni
  id: applies-with-gradation
  stance:
    ar: "يجتمع الحب والبغض بقدر — نحب ما معه من أصل الإسلام ونبرأ من المخالفة"
    en: "Love and dislike combine in measure — love what one has of the root of Islam, disavow the violation"
  summary:
    ar: "رأى سامي الماجد، أستاذ أصول الفقه في جامعة الإمام محمد بن سعود، أن الولاء والبراء بين الفرق الإسلامية يجتمع فيه البغض والحب؛ وحين سأله المقدّم هل من فيه 60% إسلاماً نحبه 60%، قال: لا، من معه أصل الإسلام فهو مسلم، ثم نبرأ مما فوق الأساس من مخالفة؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 00:15:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 00:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 00:16:30} وقال عبد الرحمن البر، أستاذ الحديث في الأزهر، إن المنحرف نبرأ من انحرافه ويبقى له إسلامه الذي نواليه عليه وننصحه. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 00:12:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 00:13:00}"
  holders: []
  evidence:
