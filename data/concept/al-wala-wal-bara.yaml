- tradition: other
  id: presenter-closing-view
  stance:
    ar: "رأي المقدّم: الحب والبغض للأفعال والأفكار لا للأشخاص"
    en: "The presenter's view: love and dislike are for acts and ideas, not persons"
  summary:
    ar: "رأي طارق السويدان (رأي المتحدث): الولاء حب ونصرة يكونان للفكرة والفعل، فلا يحب الفعل الظالم ولو صدر من أهله وجماعته، ويحب الفعل الحسن ولو صدر من كافر؛ والبراءة من غير المسلمين براءة عقيدة؛ ووحدة المسلمين درجات تقوم على المتفق عليه ويُتحاور في المختلف فيه بالدليل؛ والأصل في العلاقة مع الناس الحب والسلام والعدل، إلا من أصرّ على الظلم كإسرائيل؛ والمصطلح أصيل يُحافظ عليه ويُضبط. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 01:17:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 01:17:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 01:18:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 01:19:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 01:19:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 01:20:00}"
