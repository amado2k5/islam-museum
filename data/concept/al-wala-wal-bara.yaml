- tradition: sunni
  id: sects-by-consensus-and-detail
  stance:
    ar: "الفرق التي اتفق أهل السنة على خروجها يُتبرأ منها، وغيرها يُتبرأ من أخطائها"
    en: "Sects Sunnis agree are outside Islam are disavowed; with the others, their errors are disavowed"
  summary:
    ar: "قال أستاذ عقيدة من الأردن إن أهل السنة اتفقوا على خروج الإسماعيلية والدروز من الإسلام، واختلفوا في الشيعة والإباضية والزيدية مع أنهم لا يكفّرون المعين، ورأى أن وحدة المسلمين لا تشمل هذه الفرق لأنها أقلية قدّرها بنحو 7%؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 00:21:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 00:21:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 00:22:00} وقال عبد الله سمك، رئيس قسم المذاهب والأديان في الأزهر، إن البراءة لا تكون من الفرقة ولا من الشخص بل من الفعل الخطأ، كما تبرأ النبي مما فعله خالد بن الوليد في بني جذيمة؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 00:27:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 00:27:30} وصاغ المقدّم الخلاصة: المتفق على خروجهم يُتبرأ منهم، والباقون يُتبرأ من عقائدهم وأفعالهم الخطأ. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 00:28:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 00:28:30}"
  holders: []
  evidence:
  - ref: source/assabile-tareq-al-suwaidan
    note: {en: "al-wassitiya ep26, 00:18:00-00:30:00"}
- tradition: sunni
  id: guard-against-takfir-drift
  stance:
    ar: "التكفير ليس للأفراد — المعين للقضاء والفرق لإجماع كبار العلماء"
    en: "Takfir is not for individuals — of a person for the courts, of a sect for the consensus of senior scholars"
  summary:
    ar: "رأى 23% من الجمهور أن المفهوم يتحول إلى تكفير بسهولة و35% بغير سهولة و42% أنه لا يتحول؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 00:34:30} وقال عبد الله سمك إن التكفير إعلان عداوة وحرب، وإنه في الأصول لا في المسائل، وإن تركه للقضاء أحسن؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 00:36:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 00:37:00} وقال أستاذ العقيدة الأردني إن تكفير المعين للقاضي وتكفير الفرق لإجماع كبار العلماء، ونصح الشباب بالابتعاد عنه تماماً. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep26 00:40:00}"
  holders: []
