summary:
  ar: "يضع ابن سينا في الفصل الثاني علامة فاصلة بين المرض الذي يعرض بدءاً في عضو والمرض المشارك، وهي النظر في أيهما عرض أولاً وأيهما يبقى بعد زوال الآخر، ويحذر من غلط يقع إذا كانت العلة الأصلية غير محسوسة {cite:canon-ibn-sina-print-v1 pp.157-158}."
  en: "In the second chapter Ibn Sina gives a way to tell a disease that begins in an organ from one that comes by sympathy: look at which came first and which stays after the other has gone, and he warns of an error when the original cause is not felt {cite:canon-ibn-sina-print-v1 pp.157-158}."
