label: { ar: "أصابع كسوف القمر والمكث", en: "Digits of a lunar eclipse and its stay", ur: "چاند گرہن کی انگلیاں اور مکث", es: "Dígitos de un eclipse lunar y su duración" }
summary:
  ar: "يُقسم قطر القمر إلى اثني عشر إصبعاً، ويُحسب عدد الأصابع المنكسفة بطرح عرض القمر من نصف القطرين وضرب الفضل في اثني عشر ثم قسمته على قطر القمر المعدّل. فإن بقي من النصف الفاضل ما يزيد على قطر القمر فإن للكسوف مكثاً، أي أن القمر يبقى في الظلمة كلها زمناً. وتُسمى الأصابع المنكسفة أصابع الكسوف، ويُستخرج ما يبقى دقائق المكث. {cite:zij-sabi-nallino-byblion pp.151-152}"
  en: "The Moon's diameter is divided into twelve digits. The number of digits eclipsed is found by subtracting the Moon's latitude from the half-sum of the radii, multiplying the difference by twelve and dividing by the corrected diameter. If the remainder of the half-sum exceeds the Moon's diameter, the eclipse has a stay, that is a time in which the Moon lies wholly in the shadow; the minutes of this stay are what is left. {cite:zij-sabi-nallino-byblion pp.151-152}"
  ur: "چاند کے قطر کو بارہ انگلیوں میں تقسیم کیا جاتا ہے۔ گرہن زدہ انگلیوں کی تعداد نصف المجموع میں سے چاند کا عرض گھٹا کر، فرق کو بارہ سے ضرب دے کر اور تصحیح شدہ قطر پر تقسیم کر کے نکالی جاتی ہے۔ اگر نصف المجموع کا بقیہ چاند کے قطر سے زیادہ ہو تو گرہن میں مکث ہوتا ہے، یعنی چاند کچھ وقت پورا سائے میں رہتا ہے؛ جو دقائق باقی بچیں وہ مکث کے دقائق ہیں۔ {cite:zij-sabi-nallino-byblion pp.151-152}"
  es: "El diámetro de la Luna se divide en doce dígitos. El número de dígitos eclipsados se obtiene restando la latitud de la Luna a la mitad de la suma de los radios, multiplicando la diferencia por doce y dividiendo el resultado entre el diámetro corregido. Si el resto de la mitad de la suma excede el diámetro de la Luna, el eclipse tiene una pausa, es decir, un tiempo durante el cual la Luna permanece completamente en la sombra; los minutos de esta pausa son lo que queda. {cite:zij-sabi-nallino-byblion pp.151-152}"
