label:
  ar: "الرقبى"
  en: "Ruqba (a 'life-estate' in which each party watches for the other's death): its meaning, its relation to the umra and the gift, and the schools' views"
  ur: "رقبیٰ"
  es: "Ruqba (un usufructo vitalicio en el que cada parte vela por la muerte de la otra): su significado, su relación con la Umrah y la donación, y las opiniones de las escuelas"
  fr: "La ruqba (un usufruit viager où chaque partie veille sur l'autre jusqu'à son décès): sa signification, son lien avec l'umra et le don, et les points de vue des écoles doctrinales."
summary:
  ar: "الرقبى في اللغة من المراقبة، ومعناها أن يقول الرجل: أرقبتك هذه الدار، فإن مت قبلي عادت إلي، وإن مت قبلك فهي لك ولعقبك، وعند المالكية أن يقول للآخر: إن مت قبلي فدارك لي، وإن مت قبلك فداري لك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8851} ويقرب منها العمرى، والهبة، والعارية، والمنيحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8851} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8852} وكانت الرقبى معروفة في الجاهلية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8852} وذهب الشافعية والحنابلة وأبو يوسف إلى جوازها، ويلغو شرط العود إلى المرقِب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8852} وذهب أبو حنيفة ومحمد إلى بطلانها، لأنها تعليق للتمليك بالخطر، وذهب المالكية إلى أنها عارية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8852} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8853}"
  en: "Ruqba in the lexicon comes from watching; one says: I grant you this house as a ruqba: if I die first it returns to me, and if you die first it is yours and your heirs'. For the Malikis each says to the other: if I die first your house is mine, and if you die first mine is yours. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8851} It is close to the 'umra, to gift, to loan and to the milk-ewe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8851} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8852} It was known in the pre-Islamic period. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8852} The Shafi'is, Hanbalis and Abu Yusuf hold it valid, and the condition of return void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8852} Abu Hanifa and Muhammad hold it void, as the making of ownership hangs on a doubtful event; the Malikis treat it as a loan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8852} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8853}"
  ur: "رقبیٰ ایک ایسا عطیہ ہے جس میں ہر فریق دوسرے کی موت کا منتظر ہو؛ شافعی، حنبلی اور ابو یوسف اسے جائز کہتے ہیں، جبکہ ابو حنیفہ اور محمد اسے باطل کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8852} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8853}"
  es: "Ruqba en el léxico proviene de observar; uno dice: Te concedo esta casa como ruqba: si yo muero primero, vuelve a mí, y si tú mueres primero, es tuya y de tus herederos. Porque los malikíes cada uno le dice al otro: si yo muero primero, tu casa es mía, y si tú mueres primero, la mía es tuya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8851} Está cerca de la 'umra, de dar, de prestar y de la oveja lechera. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8851} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8852} Era conocido en el período preislámico. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8852} Los shafi'ís, hanbalíes y Abu Yusuf lo consideran válido, y la condición de devolución nula. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8852} Abu Hanifa y Muhammad lo consideran nulo, ya que la adquisición de la propiedad depende de un evento dudoso; los malikíes lo tratan como un préstamo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8852} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8853}"
  fr: "Le terme « ruqba » dans le lexique provient de l'idée de « veiller »; on dit: « Je te lègue cette maison en guise de ruqba: si je meurs le premier, elle me revient, et si tu meurs le premier, elle est à toi et à tes héritiers. » Chez les Malikites, chacun dit à l'autre: « Si je meurs le premier, ta maison est à moi, et si tu meurs le premier, la mienne est à toi. » {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8851} Il est proche des mots « 'umra », « don », « prêt » et « brebis laitière ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8851} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8852} Ce terme était connu à l'époque préislamique. Les Shafi'ites, les Hanbalites et Abu Yusuf le considèrent comme valide, mais la condition de restitution comme nulle. Abu Hanifa et Muhammad le considèrent comme nul, car l'acquisition de la propriété repose sur un événement incertain; les Malikites le traitent comme un prêt."
