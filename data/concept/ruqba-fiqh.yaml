label:
  ar: "الرقبى"
  en: "Ruqba (a 'life-estate' in which each party watches for the other's death): its meaning, its relation to the umra and the gift, and the schools' views"
  ur: "رقبیٰ"
summary:
  ar: "الرقبى في اللغة من المراقبة، ومعناها أن يقول الرجل: أرقبتك هذه الدار، فإن مت قبلي عادت إلي، وإن مت قبلك فهي لك ولعقبك، وعند المالكية أن يقول للآخر: إن مت قبلي فدارك لي، وإن مت قبلك فداري لك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8851} ويقرب منها العمرى، والهبة، والعارية، والمنيحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8851} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8852} وكانت الرقبى معروفة في الجاهلية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8852} وذهب الشافعية والحنابلة وأبو يوسف إلى جوازها، ويلغو شرط العود إلى المرقِب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8852} وذهب أبو حنيفة ومحمد إلى بطلانها، لأنها تعليق للتمليك بالخطر، وذهب المالكية إلى أنها عارية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8852} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8853}"
  en: "Ruqba in the lexicon comes from watching; one says: I grant you this house as a ruqba: if I die first it returns to me, and if you die first it is yours and your heirs'. For the Malikis each says to the other: if I die first your house is mine, and if you die first mine is yours. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8851} It is close to the 'umra, to gift, to loan and to the milk-ewe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8851} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8852} It was known in the pre-Islamic period. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8852} The Shafi'is, Hanbalis and Abu Yusuf hold it valid, and the condition of return void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8852} Abu Hanifa and Muhammad hold it void, as the making of ownership hangs on a doubtful event; the Malikis treat it as a loan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8852} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8853}"
  ur: "رقبیٰ ایک ایسا عطیہ ہے جس میں ہر فریق دوسرے کی موت کا منتظر ہو؛ شافعی، حنبلی اور ابو یوسف اسے جائز کہتے ہیں، جبکہ ابو حنیفہ اور محمد اسے باطل کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8852} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8853}"
