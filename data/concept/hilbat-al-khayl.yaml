id: concept/hilbat-al-khayl
class: concept
kind: term
label: { ar: "حلبة الخيل", en: "The race-course placings" }
summary:
  ar: "كانت العرب ترسل خيلها في الحلبة عشرة عشرة أو أسفل والقصب تسعة لا يدخل الحجرة المحجرة منها إلا الثمانية: الأول السابق المجلي، والثاني المصلي لوضعه جحفلته على قطاة المجلي وهي صلاة، والثالث المسلي لأنه شريك في السبق، والرابع التالي، والخامس المرتاح لأن خامس أصابع اليد الخنصر، والسادس الحظي لأن له حظاً، والسابع العاطف لدخوله الحجرة، والثامن المؤمل على القلب والتفاؤل، والتاسع اللطيم لأنه لو رام الحجرة للطم دونها، والعاشر السكيت لأن صاحبه يعلوه خشوع وذلة فكانوا يجعلون في عنقه حبلاً ويحملون عليه قرداً بسوط ليعيروا بذلك صاحبه، وبلغ التعيير أن كان بعضهم ينصب فرسه ويرميه بالنبل حتى يتعجف وقد فعله النعمان بفرسه النهب {cite:muruj-al-dhahab p. 698-699}."
  en: "The ten placers — Mujalli, Musalli, Musli, Tali, Murtah, Hazzi, 'Atif, Mu'ammal, Latim and the shamed Sukayt ridden by a whip-bearing monkey {cite:muruj-al-dhahab p. 698-699}."
