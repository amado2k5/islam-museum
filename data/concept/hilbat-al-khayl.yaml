label: { ar: "حلبة الخيل", en: "The race-course placings", es: "Las clasificaciones del recorrido de la carrera", fr: "Le classement sur le parcours", ur: "ریس کورس کی جگہیں", tr: "at halkası", id: "cincin kuda" }
summary:
  ar: "كانت العرب ترسل خيلها في الحلبة عشرة عشرة أو أسفل والقصب تسعة لا يدخل الحجرة المحجرة منها إلا الثمانية: الأول السابق المجلي، والثاني المصلي لوضعه جحفلته على قطاة المجلي وهي صلاة، والثالث المسلي لأنه شريك في السبق، والرابع التالي، والخامس المرتاح لأن خامس أصابع اليد الخنصر، والسادس الحظي لأن له حظاً، والسابع العاطف لدخوله الحجرة، والثامن المؤمل على القلب والتفاؤل، والتاسع اللطيم لأنه لو رام الحجرة للطم دونها، والعاشر السكيت لأن صاحبه يعلوه خشوع وذلة فكانوا يجعلون في عنقه حبلاً ويحملون عليه قرداً بسوط ليعيروا بذلك صاحبه، وبلغ التعيير أن كان بعضهم ينصب فرسه ويرميه بالنبل حتى يتعجف وقد فعله النعمان بفرسه النهب {cite:muruj-al-dhahab p. 698-699}."
  en: "The ten placers — Mujalli, Musalli, Musli, Tali, Murtah, Hazzi, 'Atif, Mu'ammal, Latim and the shamed Sukayt ridden by a whip-bearing monkey {cite:muruj-al-dhahab p. 698-699}."
  es: "Los diez colocadores: Mujalli, Musalli, Musli, Tali, Murtah, Hazzi, 'Atif, Mu'ammal, Latim y el avergonzado Sukayt montado por un mono con látigo {citar:muruj-al-dhahab p. 698-699}."
  fr: "Les dix placers — Mujalli, Musalli, Musli, Tali, Murtah, Hazzi, 'Atif, Mu'ammal, Latim et le honteux Sukayt monté par un singe portant un fouet {cite:muruj-al-dhahab p. 698-699}."
  ur: "دس جگہ کرنے والے — مجلی، مصلی، مصلی، طلی، مرتح، حذی، عاطف، معمل، لاطیم اور ایک شرمندہ سقیت جس پر کوڑے والے بندر نے سوار کیا ہوا تھا۔ 698-699}۔"
  tr: "Araplar atlarını arenaya on kez veya daha az gönderirlerdi ve kamışlar dokuz kez olurdu; taşların oyulduğu odaya sadece sekiz kişi girerdi: birincisi önceki kişi yerleştirilen, ikincisi majli'nin haspasına toynaklarını koyduğu için dua eden, üçüncüsü liderliği paylaştığı için eğlenen, dördüncüsü sonraki, beşincisi rahat olan çünkü elin parmakları serçe parmaktı, altıncı şanslı olduğu için şanslı, yedinci odaya girdiği için tutkulu, sekizinci kalp ve iyimserlik için umutlu, dokuzuncu yumuşak çünkü odaya çıkmış olsaydı onu yere vuracaktı, onuncu ise sessizdi çünkü sahibi alçakgönüllülük ve alçakgönüllülükle onun üstündeydi Boynuna ip bağlayıp sahibine hakaret etmek için bir maymunu kırbaçla taşırlardı. Eleştiriler öyle bir noktaya geldi ki, bazıları atını dizip ona ok atarak inatçı hale getirdi; el-Nu'man da atını yağmacı olarak atına yaptı {atıf:muruj-al-dhahab, s. 698-699}."
  id: "Orang Arab biasa mengirim kuda mereka ke arena sepuluh kali atau kurang, dan alang-alang itu sembilan; hanya delapan yang masuk ke ruang tempat batu diukir: yang pertama adalah yang sebelumnya yang diletakkan, yang kedua yang berdoa karena meletakkan kukunya di atas tikar majli, yang merupakan doa, yang ketiga yang terhibur karena dia ikut memimpin, yang keempat berikutnya, yang kelima yang nyaman karena jari-jari tangan adalah jari kelingking, yang keenam yang beruntung karena dia beruntung, yang ketujuh yang penuh semangat karena dia masuk ruangan, yang kedelapan yang berharap akan hati dan optimisme, yang kesembilan yang lembut karena jika dia keluar ke ruangan itu, dia akan menamparnya, dan yang kesepuluh diam karena pemiliknya berada di atasnya dengan kerendahan hati dan kerendahan hati Mereka mengikat tali di lehernya dan membawa seekor monyet dengan cambuk untuk menghina pemiliknya. Kritik sampai pada titik di mana beberapa orang mendirikan kudanya dan melempar panah hingga kudanya menjadi keras kepala, seperti yang dilakukan al-Nu'man pada kudanya sebagai perampok {cite:muruj-al-dhahab, hlm. 698-699}."
