id: concept/al-buthur-fi-al-fam
class: concept
kind: scientific
label:
  ar: البثور في الفم
  en: Pustules in the mouth
  fr: "Pustules dans la bouche"
  ur: منہ میں دانے
  es: "Pústulas en la boca"
  tr: "Ağız sivilceleri"
  id: "Jerawat di mulut"
summary:
  ar: أكثر ما يتبثر الفم يكون لحرارة في نواحي المعدة والرأس وبخارات، وأما المفردات النافعة في البثور في أول الأمر إذا احتيج إلى تبريد وتجفيف فهي الباردة القابضة من هذا الجنس وأما الحارة المحتاج إليها في آخر الأمر فمن هذا الجنس، وكثير من الصبيان من يعالج بثور أفواههم بالسكر ودواء بارد من هذا الجنس، ومنها من الأدوية القذرة من هذا الجنس ⁦(دواء قذر منسوب مطروح لحكم المؤسس)⁩ وربما احتيج في المتقرح منها إلى ما يكوي من هذا الجنس، وإذا أخذت البثور تتقيح فيجب أن يقرب منها اللعابات المتخذة من بزور من هذا الجنس ودقيق الشعير ولبن الأتن وحده أو مع شيء من هذه ⁦(لبن حيوان منقول)⁩ {cite:canon-ibn-sina-print-v2 p.261} {cite:canon-ibn-sina-print-v2 p.262}
  en: 'The mouth mostly breaks out in pustules for a heat about the stomach and head and for vapours. The simples useful in pustules at the start when cooling and drying are needed are the cold astringents of this kind, and the hot ones needed at the end are of this kind; many boys have their mouth-pustules treated with sugar and a cooling simple of this kind. Among them are the unclean drugs of this kind (an unclean drug carried as a labelled listing for the founder''s ruling) and the ulcerated ones may need a cauterising thing of this kind. When the pustules begin to suppurate, mucilages made of seeds of this kind, barley-flour and she-asses'' milk alone or with some of these are brought near them (an animal milk carried as the book names it; the other names and tried recipes left out) {cite:canon-ibn-sina-print-v2 p.261} {cite:canon-ibn-sina-print-v2 p.262}'
  fr: "La bouche se couvre le plus souvent de pustules à cause d’une chaleur autour de l’estomac et de la tête, et de vapeurs. Les simples utiles aux pustules à leur début, lorsque rafraîchissement et dessiccation sont nécessaires, sont les astringents froids de cette catégorie, et les chauds nécessaires à la fin sont de cette catégorie ; chez de nombreux garçons, les pustules buccales sont traitées avec du sucre et un simple rafraîchissant de cette catégorie. Parmi eux figurent les médicaments impurs de cette catégorie (un médicament impur est conservé dans une liste explicitement désignée, dans l’attente de la décision du fondateur), et les formes ulcérées peuvent nécessiter une substance cautérisante de cette catégorie. Lorsque les pustules commencent à suppurer, on en approche des mucilages de graines de cette catégorie, de la farine d’orge et du lait d’ânesse, seul ou avec certains de ces ingrédients (un lait animal est repris tel que le livre le nomme ; les autres noms et les recettes expérimentées sont omis) {cite:canon-ibn-sina-print-v2 p.261} {cite:canon-ibn-sina-print-v2 p.262}"
  ur: 'منہ میں دانے اکثر معدے اور سر کے اطراف کی گرمی اور بخارات سے ہوتے ہیں؛ شروع میں جب ٹھنڈک اور خشکی درکار ہو تو نفع دینے والے مفردات اسی جنس کے ٹھنڈے قابض ہیں اور آخر میں درکار گرم اسی جنس کے؛ بہت سے لڑکوں کے منہ کے دانے شکر اور اسی جنس کی ٹھنڈی مفرد سے علاج ہوتے ہیں؛ ان میں اسی جنس کی ناپاک ادویہ بھی ہیں ⁦(ناپاک دوا منسوبہ، بانی کے فیصلے کے لیے موسوم فہرست)⁩ اور پھنس جانے والوں میں جلانے والی چیز اسی جنس کی درکار پڑ سکتی ہے؛ جب دانے چول پڑنے لگیں تو اسی جنس کے بیجوں سے بنے لعاب دار، جو کے آٹے اور گدھی کا دودھ اکیلا یا ان میں سے کسی چیز کے ساتھ قریب لایا جائے ⁦(حیوانی دودھ جیسا کتاب نے نام لیا؛ باقی نام اور آزمودہ نسخے مطروح)⁩ {cite:canon-ibn-sina-print-v2 p.261} {cite:canon-ibn-sina-print-v2 p.262}'
  es: "La boca suele presentar pústulas debido al calor en el estómago y la cabeza, y a los vapores. Los remedios simples útiles para las pústulas al inicio, cuando se necesita enfriamiento y secado, son los astringentes fríos de este tipo, y los calientes necesarios al final son de este tipo; muchos niños reciben tratamiento para sus pústulas bucales con azúcar y un remedio simple refrescante de este tipo. Entre ellos se encuentran las drogas impuras de este tipo (una droga impura que figura en la lista etiquetada según la regla del fundador) y las ulceradas pueden requerir un cauterizador de este tipo. Cuando las pústulas comienzan a supurar, se les acercan mucílagos hechos de semillas de este tipo, harina de cebada y leche de cabra, sola o con algunos de estos ingredientes (una leche animal que figura como la denomina el libro; se omiten los otros nombres y recetas probadas). {cite:canon-ibn-sina-print-v2 p.261} {cite:canon-ibn-sina-print-v2 p.262}"
  tr: "Ağzı kıran şeylerin çoğu mide ve baştaki ısı ile buharlardan kaynaklanır. Sivilceler için ilk başta faydalı maddeler ise, soğutma ve kurutma için soğutma ve kurutma gerekiyorsa, soğuktur, bu türden büzücüdür, sonunda ise sıcak olanlar bu türdendir. Birçok erkek çocuk ağız sivilcelerini bu tür şeker ve soğuk algınlığı ilaçlarıyla tedavi eder, bazıları ise bu tür kirli ilaçlardır (kurucunun kararına atfedilen kirli ilaç) ve bazen ülserli olanlar için koterize edilmiş olanı kullanmak gerekir Bu cins ve eğer püstüller saflaşmaya başlarsa, bu cinsin tohumlarından ve arpa unundan ve eşek sütünden yapılan tükürük tek başına veya bunlardan bazılarıyla (aktarılmış hayvansal sütü) onlara getirilmelidir {cite:canon-ibn-sina-print-v2 s.261} {cite:canon-ibn-sina-print-v2 s.262}"
  id: "Sebagian besar zat yang merusak mulut berasal dari panas dan uap di lambung dan kepala. Jika zat tersebut awalnya bermanfaat untuk jerawat, jika pendinginan dan pengeringan diperlukan untuk mendinginkan dan mengeringkan, dingin adalah jenis astringen; dan akhirnya, yang hangat adalah jenis ini. Banyak anak laki-laki mengobati jerawat mulut dengan gula dan obat flu seperti itu, beberapa adalah obat kotor (obat kotor yang dikaitkan dengan keputusan pendiri), dan terkadang yang dikauterisasi perlu digunakan untuk borok. Jenis ini, dan jika napas mulai memurnikan, air liur yang terbuat dari biji genus ini, tepung jelai, dan susu keledai harus dibawa hanya kepada mereka atau beberapa dari biji tersebut (susu hewan yang dipindahkan) {cite:canon-ibn-sina-print-v2 hlm.261} {cite:canon-ibn-sina-print-v2 hlm.262}"
