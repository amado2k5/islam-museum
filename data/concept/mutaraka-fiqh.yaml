id: concept/mutaraka-fiqh
class: concept
kind: legal
label:
  ar: "المُتَارَكَة"
  en: "Mutaraka (release from a defective contract, and its effects)"
  ur: "متارکہ (فاسد عقد سے دستبرداری اور اس کے اثرات)"
summary:
  ar: "المتاركة في اللغة التخلية والمفارقة، ولم يعرّفها الفقهاء تعريفاً واضحاً، واستعاض عنها جمهورهم بالفسخ، واستعملها الحنفية في بعض العقود الفاسدة بمعناها اللغوي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13830}. وركنها لفظ يعبر عنها كتركت وفسخت ونقضت، وتصح بلفظ الطلاق في النكاح الفاسد ولا ينقص عدد الطلقات، ويحل محل اللفظ فعل يدل عليها كرد المشتري المبيع الفاسد على بائعه بهبة أو صدقة، فيبرأ من ضمانه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13830-13831}. وفي النكاح الفاسد لا تتحقق المتاركة بعد الدخول إلا بالقول، ولكل من الزوجين فسخه، ويجب التفريق بينهما، وتجب العدة بعد الوطء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13831}. وإذا تمت المتاركة انتقض العقد، ورجع المتعاقدان إلى ما كانا عليه ما أمكن، فإن تعذر الرد لزم رد القيمة، وبقي نسب الولد والمهر والعدة لأنها حقوق لا تقبل الإلغاء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13831-13832}."
  en: "Mutaraka, in lexicon, is leaving and parting; the jurists did not define it clearly, and most used fasKh (annulment) in its place, while the Hanafis use it for some defective contracts in its lexical sense {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13830}. Its form is a word such as 'I left it', 'I annulled it', 'I cancelled it'; in a defective marriage it may be expressed by the word of divorce without reducing the number of divorces; an act may take the place of the word, such as a buyer returning a defective purchase to the seller by gift or charity, which releases him from liability {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13830-13831}. In a defective marriage after consummation the release must be by word; either spouse may end it, the separation is required, and the waiting period is due after intercourse {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13831}. Once it is complete the contract is undone and the parties are restored as far as possible; if restoration is impossible the price is returned, and the child's descent, the dower and the waiting period stand, as rights that cannot be waived {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13831-13832}."
  ur: "متارکہ لغت میں چھوڑنے اور جدا ہونے کو کہتے ہیں؛ فقہاء نے اس کی واضح تعریف نہیں کی، اور اکثر نے اس کی جگہ فسخ کا لفظ استعمال کیا، جبکہ حنفیہ بعض فاسد عقود میں اسے لغوی معنی میں لاتے ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13830}۔ اس کا رکن ایسا لفظ ہے جیسے میں نے چھوڑا، فسخ کیا یا ختم کیا؛ فاسد نکاح میں طلاق کے لفظ سے بھی ہو سکتی ہے اور طلاقوں کی گنتی کم نہیں ہوتی؛ لفظ کی جگہ فعل بھی کافی ہے، جیسے خریدار فاسد بیع کی چیز بائع کو ہبہ یا صدقے کے طور پر لوٹا دے تو وہ ضمان سے بری ہو جاتا ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13830-13831}۔ فاسد نکاح میں دخول کے بعد متارکہ صرف قول سے ہوتی ہے؛ دونوں میں سے ہر ایک فسخ کر سکتا ہے، تفریق واجب ہے، اور وطی کے بعد عدت لازم ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13831}۔ متارکہ مکمل ہونے پر عقد ٹوٹ جاتا ہے اور فریقین ممکنہ حد تک پہلی حالت میں لوٹائے جاتے ہیں؛ اگر واپسی ممکن نہ ہو تو قیمت واجب ہوتی ہے، اور اولاد کا نسب، مہر اور عدت باقی رہتے ہیں، کیونکہ یہ حقوق ساقط نہیں ہو سکتے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13831-13832}۔"
