  "ur": "سل کے لیے مستعد لوگ جسم رنگ عمر ملک اور مزاج میں"
"summary":
  "ar": "هؤلاء هم المجنحون الضيقو الصدور العاريو الأكتاف من اللحم وخصوصاً من خلف المائلو\
    \ الأكتاف إلى قدام بارز أو كان للواحد منهم جناحين وكان كتفاه منقطعين عن العضد\
    \ وقدام وخلف، والطويلو الأعناق المائلوها إلى قدام قد برزت حلوقهم ووثبت، وهؤلاء\
    \ تكثر الرياح في صدورهم وما يليها والنفخ فيها لصغر صدورهم، وإن كان بهم مع ذلك\
    \ ضعف الأدمغة تقبل الفضول ولا تنضج الأغذية فقد تمت الشرائط وخصوصاً إن كانت أخلاطهم\
    \ حارة مرارية، والسحنات القابلة للسل بسرعة مع التجنح المذكور هي الزعر البيض إلى\
    \ الشقرة، وأيضاً الأبدان الصلبة المتكاثفة لما يعرض لها من انحراف العروق والمزاج\
    \ القابل لذلك من كان أبرد مزاجاً. والسن الذي يكثر فيه السل ما بين ثماني عشرة سنة\
    \ إلى حدود ثلاثين سنة وهي في البلاد الباردة أكثر لما يعرض فيها من انفتاق العروق\
    \ ونفث الدم أكثر والفصل الذي يكثر فيه ذلك الخريف {cite:canon-ibn-sina-print-v2\
    \ p.356}"
  "en": "These are the winged ones — narrow of chest, shoulders bare of flesh especially\
    \ behind, shoulders inclined forward and jutting, or one of them having two wing-blades\
    \ with the shoulders separated from the upper arm before and behind; the long-necked\
    \ whose necks incline forward with the throat jutting out and leaping. Winds abound\
    \ in their chests and what adjoins them, and blowing, for the smallness of their\
    \ chests; and if with that they have weakness of the brains accepting superfluities,\
    \ and their foods do not ripen, then the full list is complete — especially if\
    \ their humours are hot and bilious. The complexions that take consumption quickly,\
    \ together with the said wingedness, are the pale white tending to ruddy; also\
    \ the hard dense bodies, for the vessels' deviation that befalls them; and the\
    \ receptive temperament is whoever is colder of temperament. The age in which\
    \ consumption most abounds is from eighteen years to about thirty; it is commoner\
    \ in the cold countries, where the vessels' rupture and the spitting of blood\
    \ occur more; and the season in which it most abounds is autumn {cite:canon-ibn-sina-print-v2\
    \ p.356}"
  "ur": "یہ وہ لوگ ہیں جن کے کندھے پرندے کے پروں جیسے ہوتے ہیں سینہ تنگ کندھے گوشت\
